lexical_decisions:
- source_word: ܡܛܠ ܡܢܐ / corresponding Syriac interrogative idiom (continuation not fully visible in supplied page excerpt)
  choice: wofür
  rationale: Gibt die zweck- bzw. gegenwertbezogene Frage in natürlichem modernem Deutsch wieder und bewahrt den Parallelismus beider Satzhälften.
- source_word: ܚܝ̈ܐ
  choice: Leben
  rationale: Die übliche und kontextgerechte Wiedergabe des syrischen Ausdrucks für Leben.
- source_word: ܢܦܫܐ
  choice: Seele
  rationale: Bewahrt die anthropologische Offenheit des syrischen Begriffs und die Spannung zum vorausgehenden »Leben«, statt beide Wörter anzugleichen.
- source_word: ܚܠܦ / corresponding exchange verb
  choice: eingetauscht
  rationale: Drückt den Gedanken eines Tauschs gegen etwas anderes idiomatisch aus, ohne den nicht genannten Gegenwert zu ergänzen.
theological_decisions:
- issue: Verhältnis von »Leben« und »Seele«
  choice: Beide Begriffe werden unterschieden wiedergegeben.
  alternative: Beide Male »Leben« oder beide Male »Seele«
  rationale: Die unterschiedliche Wortwahl des Ausgangstextes soll erhalten bleiben; der Vers erklärt nicht ausdrücklich, ob beide Begriffe deckungsgleich sind.
- issue: Sinn der einleitenden Frage
  choice: »wofür« im Haupttext
  alternative: »warum«
  rationale: »Wofür« passt besonders zum parallelen Motiv des Eintauschens; »warum« bleibt als mögliche kausale Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der parallele Satzbau und die begriffliche Unterscheidung zwischen »Leben« und »Seele« bleiben erhalten.
