base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: de
  text: 'Denn vor ihnen werden die Weiten des Paradieses ausgebreitet werden. Ihnen wird die Schönheit der Herrlichkeit der Lebewesen unter dem Thron gezeigt werden, ebenso alle Heerscharen der Engel: jene, die jetzt durch mein Wort zurückgehalten werden, sodass sie nicht erscheinen, und jene, die durch mein Gebot an ihren Plätzen festgehalten werden bis zu ihrer Ankunft.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich möglicherweise: »bis ihr Kommen kommt«.'
    reason: Die zugrunde liegende Wendung kann eine betonte, im Deutschen jedoch schwerfällige Verbindung von „Kommen“ und „eintreten/kommen“ enthalten.
lexical_decisions:
- source_word: Paradise / underlying Syriac tradition
  choice: Paradies
  rationale: Die geläufige und würdevolle deutsche Entsprechung bewahrt die eschatologische Bildsprache.
- source_word: living beings
  choice: Lebewesen
  rationale: Die neutrale Bezeichnung lässt offen, um welche himmlischen Wesen es sich genau handelt, und vermeidet die enger deutende Wiedergabe „Tiere“.
- source_word: armies of the angels
  choice: Heerscharen der Engel
  rationale: „Heerscharen“ gibt die geordnete himmlische Gesamtheit idiomatisch und traditionsnah wieder.
- source_word: held fast / kept
  choice: zurückgehalten / an ihren Plätzen festgehalten
  rationale: 'Die unterschiedlichen deutschen Verben machen den jeweiligen Zusammenhang deutlich: Nicht-Erscheinen einerseits und Verbleiben an zugewiesenen Orten andererseits.'
theological_decisions:
- issue: Identität der Lebewesen unter dem Thron
  choice: Lebewesen
  alternative: Tiere oder Cherubim
  rationale: Der Text benennt sie nicht genauer; eine Identifikation mit einer bestimmten Engelklasse wäre interpretierend.
- issue: Bezug der abschließenden Ankunft
  choice: bis zu ihrer Ankunft
  alternative: bis ihre Ankunft eintritt / bis ihr Kommen kommt
  rationale: Die pronominale Offenheit bleibt erhalten; zugleich wird die im Deutschen unnötig schwerfällige figura etymologica im Haupttext vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die langen Aufzählungen wurden durch Doppelpunkt und Parallelbau gegliedert. Da der bereitgestellte syrische Seitenausschnitt unmittelbar vor dem Wortlaut dieses Verses abbricht, wurde die englische POB-Konsultationsschicht unter Wahrung ihrer ausgewiesenen Ambiguität herangezogen.
