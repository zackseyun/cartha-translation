  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: de
  text: 'Und danach hörte ich, wie jener Engel zu den Engeln, die die Fackeln hielten, sagte:[a] »Reißt nun die Stützen der Stadtmauern nieder und stürzt sie um, damit die Feinde sich nicht rühmen und sagen: ›Wir selbst haben die Mauer Zions eingerissen und die Stätte des mächtigen Gottes verbrannt.‹ Stellt euch dort auf, wo ich zuvor gestanden hatte.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte syrische Text lautet hier offenbar: »verließ ich jenen Engel«. Die Übersetzung folgt einer naheliegenden Textkorrektur: »hörte ich jenen Engel«.'
    reason: Die syrische Überlieferung ist an dieser Stelle wahrscheinlich fehlerhaft; die Übersetzung soll die textkritische Unsicherheit sichtbar machen.
  - marker: b
    text: 'Der syrische Text ist am Versende beschädigt. Nach dem Zusammenhang richtet sich der Befehl weiterhin an die Engel: »Stellt euch … auf.«'
    reason: Die handschriftlich beziehungsweise im Druck vorliegende Form könnte sonst irrtümlich als Aussage Baruchs verstanden werden.
lexical_decisions:
- source_word: ܫܒܩܬܗ (wohl verderbt für ܫܡܥܬܗ)
  choice: hörte ich
  rationale: Der überlieferte Text bietet offenbar „ich verließ ihn“, doch Satzbau, direkte Rede und die weithin angenommene Korrektur zu „ich hörte ihn“ sprechen für diese Wiedergabe; die Textfrage wird in einer Fußnote offengelegt.
- source_word: ܠܡܦܐܕ̈ܐ
  choice: Fackeln
  rationale: Im Zusammenhang der bevorstehenden Verbrennung bezeichnet das Wort feurige Leuchtmittel; „Fackeln“ ist anschaulicher und kontextgerechter als „Lampen“.
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: die Stützen ihrer Mauern
  rationale: Die Wendung bezeichnet tragende oder stützende Teile der Mauer, ohne eindeutig „Fundamente“ oder „Strebepfeiler“ festzulegen.
- source_word: ܣܚܦܢܝܗܝ
  choice: eingerissen
  rationale: Das Verb bezeichnet gewaltsames Niederwerfen oder Zerstören; im Deutschen passt „eine Mauer einreißen“ natürlich und präzise.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: die Stätte des mächtigen Gottes
  rationale: „Stätte“ bewahrt den sakralen Klang, ohne ausdrücklich „Wohnstätte“ einzutragen; der Gottesbeiname wird idiomatisch als „mächtig“ wiedergegeben.
- source_word: ܘܐܬܩܝܡܘ (erschlossen statt des verderbten ܘܐܬܩܝܡܘܬ)
  choice: Stellt euch dann dort auf
  rationale: Der Zusammenhang verlangt einen pluralischen Imperativ an die Engel. So bleibt der Satz Teil des Befehls und wird nicht fälschlich als Aussage Baruchs verstanden.
theological_decisions:
- issue: Urheberschaft beim Fall Jerusalems
  choice: Die Engel reißen die Mauer auf himmlischen Befehl nieder; die Feinde sollen sich den Sieg nicht selbst zuschreiben.
  alternative: Die feindlichen Heere allein zerstören Jerusalem.
  rationale: Die ausdrückliche Anweisung an die Engel und die Begründung gegen das Rühmen der Feinde stellen den Fall der Stadt als göttlich verfügtes Gericht dar, ohne die geschichtliche Beteiligung der Feinde weiter auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer apokalyptischer Bildsprache. „Stätte“ und „Zion“ bewahren den feierlichen Ton; Satzbau und direkte Rede bleiben für heutige Leser gut verständlich. Textkritische Eingriffe werden nicht stillschweigend vorgenommen, sondern in Fußnoten kenntlich gemacht.
