  text: For when Sennacherib was stirred up for destruction, and his wrath was inflamed so as to destroy, together with the multitude of the nations that were with him,
translation:
  language: de
  text: Denn als Sanherib zur Vernichtung aufgestachelt wurde und sein Zorn entbrannte, damit er zusammen mit der Menge der Völker, die bei ihm waren, vernichtet würde,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥ
  choice: aufbrach
  rationale: Das syrische Verb bezeichnet hier ein In-Bewegung-Geraten beziehungsweise militärisches Aufbrechen; „aufbrach“ gibt den erzählerischen Zusammenhang natürlich wieder.
- source_word: ܠܡܘܒܕܘ
  choice: zum Vernichten
  rationale: Der Infinitiv drückt den Zweck des Aufbruchs aus; die substantivierte deutsche Infinitivkonstruktion bewahrt diese Funktion.
- source_word: ܚܡܬܗ
  choice: sein Zorn
  rationale: Die Wendung bezeichnet Sanheribs eigenen Zorn und bleibt in der deutschen Zuordnung eindeutig.
- source_word: ܥܡ ܣܘܓܐܐ ܕܥܡ̈ܡܐ
  choice: zusammen mit der Menge der Völker
  rationale: Die Formulierung bewahrt das kollektive Bild zahlreicher mitziehender Völker, ohne es unnötig zu „Heeren“ zu konkretisieren.
theological_decisions:
- issue: Zweck oder vorausbestimmtes Ergebnis der Vernichtung
  choice: „zum Vernichten … um zu zerstören“ auf Sanheribs feindliche Absicht bezogen
  alternative: „damit er zugrunde ginge“ als Hinweis auf Sanheribs von Gott bestimmtes Ende
  rationale: Der unmittelbare Zusammenhang beschreibt Sanheribs Zorn und die mit ihm ziehenden Völker. Die gewählte Fassung wahrt den naheliegenden intentionalen Sinn, ohne eine zusätzliche Aussage über göttliche Vorherbestimmung einzutragen.
