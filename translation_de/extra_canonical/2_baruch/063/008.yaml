  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: de
  text: Und zu jener Zeit verbrannte ich ihre Körper von innen; ihre Kleider und ihre Waffen jedoch ließ ich äußerlich unversehrt, damit die noch größeren Wunder des Mächtigen sichtbar würden und sein Name auf der ganzen Erde verkündet würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܓܪ̈ܝܗܘܢ
  choice: ihre Körper
  rationale: Gibt die konkrete leibliche Bedeutung natürlich und ohne zusätzliche Deutung wieder.
- source_word: ܠܒܪ
  choice: äußerlich
  rationale: Bewahrt den Gegensatz zu „von innen“; gemeint ist, dass Kleider und Waffen nach außen hin unversehrt blieben.
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Bewahrt den substantivierten Gottesbeiname und vermeidet eine konfessionell geprägte Erweiterung.
- source_word: ܢܬܡܠܠ
  choice: verkündet würde
  rationale: Im Zusammenhang mit dem Namen auf der ganzen Erde bezeichnet das Verb ein öffentliches Sprechen beziehungsweise Bekanntmachen.
theological_decisions:
- issue: Bezeichnung Gottes als „der Mächtige“
  choice: des Mächtigen
  alternative: des Allmächtigen
  rationale: „Der Mächtige“ bildet den Gottesbeiname enger ab; „der Allmächtige“ würde eine stärkere, im Ausdruck nicht notwendigerweise enthaltene Präzisierung einführen.
- issue: Zweck der Bewahrung von Kleidung und Waffen
  choice: damit die noch größeren Wunder … sichtbar würden
  alternative: sodass die noch größeren Wunder … sichtbar wurden
  rationale: Die syrische Zweckkonstruktion wird als Absicht wiedergegeben, ohne zu entscheiden, ob der Schwerpunkt stärker auf göttlicher Planung oder auf der eingetretenen Folge liegt.
translation_notes:
  register: Gehobenes, aber gut verständliches modernes Standarddeutsch. Der Gegensatz zwischen der inneren Verbrennung der Körper und der äußerlichen Unversehrtheit von Kleidung und Waffen bleibt deutlich; der Gottesbeiname wird bewusst nicht zu „Allmächtiger“ erweitert.
