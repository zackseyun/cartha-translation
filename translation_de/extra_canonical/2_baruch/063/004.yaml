  text: “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up when he destroys Zion.”
translation:
  language: de
  text: „Siehe, Sanherib steht bereit, uns zu vernichten; und er wird sich erheben und sich überheben, wenn er Zion vernichtet.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝ
  choice: Siehe
  rationale: Bewahrt den feierlich-deiktischen Charakter der einleitenden Aufforderung.
- source_word: ܣܢܚܪܝܒ
  choice: Sanherib
  rationale: Im modernen deutschen Bibelgebrauch übliche Namensform für Sennacherib.
- source_word: ܡܛܝܒ
  choice: steht bereit
  rationale: Gibt den Zustand des Vorbereitetseins natürlich und unmittelbar wieder.
- source_word: ܢܬܬܪܝܡ / ܢܙܕܩܦ
  choice: wird sich großtun und überheben
  rationale: Bewahrt die doppelte Beschreibung hochmütiger Selbsterhöhung, ohne sie zu einem einzigen Ausdruck einzuebnen.
- source_word: ܡܐ ܕـ
  choice: wenn
  rationale: 'Die Verbindung ist hier temporal: Sanheribs erwartete Selbsterhöhung wird auf den Zeitpunkt der vermeintlichen Vernichtung Zions bezogen, nicht auf eine bloße Bedingung.'
theological_decisions:
- issue: Sanheribs erwartete Vernichtung Zions
  choice: wenn er Zion vernichtet
  alternative: falls er Zion vernichtet
  rationale: Die temporale Formulierung spiegelt Sanheribs selbstsichere Erwartung innerhalb der Rede wider, ohne zu behaupten, dass die Vernichtung tatsächlich eintreten wird.
- issue: Versgrenze vor der direkten Rede
  choice: Der Vers beginnt mit „Siehe“
  alternative: '„Und er sagte: Siehe“'
  rationale: Die Redeeinleitung gehört nach der üblichen Versabgrenzung zum Ende von Vers 3; ihre Wiederholung hier würde die Grenze verwischen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Sich großtun und überheben“ gibt die parallelen Ausdrücke der hochmütigen Erhöhung verständlich wieder; das Semikolon hält Ankündigung und erwartete Folge eng zusammen.
