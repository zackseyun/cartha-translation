base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: de
  text: Als König Hiskija hörte, was der König von Assyrien plante – nämlich zu kommen, ihn zu ergreifen, sein Volk, die übrig gebliebenen zweieinhalb Stämme, zu vernichten und sogar Zion zu stürzen –, da vertraute Hiskija auf seine Werke, setzte seine Hoffnung auf seine Gerechtigkeit und redete mit dem Mächtigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: Hiskija
  rationale: Die syrische Namensform bezeichnet König Hiskija; verwendet wird die im Deutschen geläufige biblische Form.
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: der König von Assyrien
  rationale: Direkte und idiomatische Wiedergabe des Königstitels mit geografischer Zuordnung.
- source_word: ܚܝܠܘܗܝ ܕܐܠܗܐ
  choice: der Mächtige
  rationale: Bewahrt den als Gottesbezeichnung gebrauchten Macht-Titel, ohne ihn durch eine konfessionell geprägte Deutung zu ersetzen.
- source_word: ܥܒ̈ܕܝܗܝ
  choice: seine Werke
  rationale: Die formale Wiedergabe erhält die mögliche Spannung, ob Hiskijas Taten als Grund seines Vertrauens positiv oder kritisch beurteilt werden.
- source_word: ܙܕܝܩܘܬܗ
  choice: seine Gerechtigkeit
  rationale: Bewahrt den theologischen und ethischen Bedeutungsumfang des Abstraktums und vermeidet die verengende Wiedergabe als bloße Frömmigkeit.
theological_decisions:
- issue: Grundlage von Hiskijas Vertrauen
  choice: „vertraute … auf seine Werke“ und „setzte seine Hoffnung auf seine Gerechtigkeit“
  alternative: „vertraute wegen seiner Taten und hoffte wegen seiner Rechtschaffenheit“
  rationale: Die gewählte Fassung wahrt die auffällige Spannung des Textes, dass Hiskija sich auf eigene Werke und eigene Gerechtigkeit stützt, ohne dies wertend aufzulösen.
- issue: Gottesbezeichnung
  choice: „der Mächtige“
  alternative: „Gott“ oder „der Allmächtige“
  rationale: Der Titel wird als Titel erhalten; „der Allmächtige“ wäre eine stärkere und potenziell überpräzisierende Festlegung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Der lange Planungssatz wird durch Gedankenstriche und eine Infinitivreihe gegliedert; die theologisch markanten Ausdrücke „Werke“, „Gerechtigkeit“ und „der Mächtige“ bleiben bewusst nah an der Quellensprache.
