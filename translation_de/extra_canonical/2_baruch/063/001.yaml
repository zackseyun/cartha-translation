  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: de
  text: Und die achten hellen Wasser, die du gesehen hast, bedeuten die Lauterkeit und Rechtschaffenheit Hiskias, des Königs von Juda, sowie die gnädige Gunst, die ihm zuteilwurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: helle Wasser
  rationale: Bewahrt das wiederkehrende Bild der hellen und dunklen Wasser und klingt im modernen Deutschen klar und würdig.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  choice: Lauterkeit und Rechtschaffenheit
  rationale: Gibt die doppelte ethische Charakterisierung natürlich wieder, ohne beide Begriffe zu einem einzigen zu verschmelzen.
- source_word: ܛܝܒܘܬܐ
  choice: gnädige Gunst
  rationale: Bezeichnet eine wohltätige, zugewandte Gunst, die Hiskia zuteilwird, ohne den Ausdruck auf einen späteren dogmatischen Gnadenbegriff zu verengen.
theological_decisions:
- issue: Verhältnis von Hiskias eigener Rechtschaffenheit zur ihm erwiesenen göttlichen Gunst
  choice: Beide Aspekte werden als voneinander unterschiedene Bestandteile der Deutung genannt.
  alternative: Die Aussage ausschließlich auf Hiskias sittliche Haltung oder ausschließlich auf Gottes Güte beziehen.
  rationale: Die überlieferte Formulierung unterscheidet die Lauterkeit und Rechtschaffenheit Hiskias von der zusätzlichen Gunst, die ihm zuteilwurde; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Bedeuten“ macht die Deutung des Visionssymbols idiomatisch deutlich; „sowie“ trennt Hiskias Eigenschaften von der ihm erwiesenen Gunst.
