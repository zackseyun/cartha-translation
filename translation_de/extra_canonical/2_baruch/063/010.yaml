  text: And all those who were in the holy land rejoiced, and the name of the Mighty One was glorified, so that it was spoken of.
translation:
  language: de
  text: Und alle, die im heiligen Land waren, freuten sich, und der Name des Mächtigen wurde verherrlicht, sodass von ihm gesprochen wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ (sinngemäß im überlieferten Verskontext)
  choice: heiliges Land
  rationale: Die natürliche deutsche Wiedergabe bewahrt die räumliche und religiöse Bedeutung, ohne sie ausdrücklich mit einem bestimmten politischen Gebiet gleichzusetzen.
- source_word: ܚܝܠܬܢܐ / entsprechende syrische Gottesbezeichnung
  choice: der Mächtige
  rationale: Die substantivierte Gottesbezeichnung wird als Titel wiedergegeben; „der Allmächtige“ würde eine stärkere, dogmatisch festgelegte Nuance eintragen.
- source_word: ܐܫܬܒܚ / entsprechende Passivform
  choice: wurde verherrlicht
  rationale: Das Passiv bleibt erhalten und benennt nicht ausdrücklich, wer den Namen verherrlichte.
theological_decisions:
- issue: Referenz der Bezeichnung „der Mächtige“
  choice: Als Hoheitstitel stehen lassen
  alternative: „Gott“ oder „der Allmächtige“
  rationale: Der Titel bezeichnet im Kontext Gott, soll aber nicht durch eine explizitere oder theologisch stärkere Benennung ersetzt werden.
- issue: Unbestimmtes Subjekt des abschließenden Sprechens
  choice: 'Passivisch: „sodass von ihm gesprochen wurde“'
  alternative: „sodass alle von ihm sprachen“
  rationale: Die passive und hinsichtlich der Handelnden offene Aussage wird nicht unnötig konkretisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am überlieferten Sinn, wird aber flüssig formuliert. Da der bereitgestellte syrische Kapitelblock den Einzelvers aufgrund der Seiten- und Texterfassung nicht eindeutig sichtbar abgrenzt, wurde die englische POB-Fassung nur als geprüfte Konsultationsschicht herangezogen und ihre offenen Formulierungen wurden bewahrt.
