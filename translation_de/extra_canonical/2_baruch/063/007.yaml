lexical_decisions:
- source_word: ܘܢܦܩ
  choice: Und er zog aus
  rationale: Die Verbform ist nach der maßgeblichen Quellenprüfung als 3. Person Singular zu verstehen; gemeint ist der zuvor ausgesandte Engel, nicht Baruch als Sprecher.
- source_word: ܐܘܒܕ
  choice: vernichtete
  rationale: Gibt die gewaltsame Beseitigung des feindlichen Heeres in natürlichem, würdigem Deutsch wieder.
- source_word: ܪ̈ܝܫܐ
  choice: Anführer
  rationale: Bezeichnet die führenden Männer beziehungsweise Befehlshaber, ohne einen spezielleren militärischen Rang einzutragen.
- source_word: ܐܝܟ ܗܘ
  choice: ebenso viele
  rationale: Bewahrt die auffällige Aussage, dass jeder Anführer eine gleich große Zahl unter sich hatte.
theological_decisions:
- issue: Handelndes Subjekt
  choice: '„er“: der zuvor von Gott ausgesandte Engel'
  alternative: '„ich“: Baruch als Sprecher'
  rationale: Die syrische Verbform steht in der 3. Person maskulin Singular. Dadurch bleibt Gott der Befehlende und der Engel der ausführende Handelnde.
- issue: Deutung der gleichen Zahl
  choice: Die Ergänzung „unter seinem Befehl“ macht die Beziehung verständlich, ohne die außergewöhnlich hohe Zahlenangabe abzuschwächen.
  alternative: Die Zahlenangabe als Gesamtzahl des Heeres verstehen oder textkritisch glätten
  rationale: Der überlieferte Wortlaut ist auffällig, soll aber nicht stillschweigend harmonisiert oder korrigiert werden.
