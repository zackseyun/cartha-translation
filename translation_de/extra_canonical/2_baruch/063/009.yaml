  text: Und Zion wurde gerettet, Jerusalem wurde befreit, und auch Israel wurde aus der Bedrängnis erlöst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܨܗܝܘܢ (im Verszusammenhang: Zion)'
  choice: Zion
  rationale: Der überlieferte Ortsname wird in seiner geläufigen deutschen Form beibehalten.
- source_word: 'ܐܘܪܫܠܡ (im Verszusammenhang: Jerusalem)'
  choice: Jerusalem
  rationale: Der Ortsname erscheint in der etablierten deutschen Form.
- source_word: 'ܐܝܣܪܐܝܠ (im Verszusammenhang: Israel)'
  choice: Israel
  rationale: Der Eigenname wird unverändert in der üblichen deutschen Form wiedergegeben.
- source_word: Begriffsfeld Rettung/Befreiung (Versinhalt gemäß Kontrollüberlieferung)
  choice: gerettet … befreit … erlöst
  rationale: Die drei unterschiedlichen deutschen Verben bewahren den rhetorischen Parallelismus und die Abstufung zwischen Rettung, Befreiung und Lösung aus Bedrängnis.
- source_word: Bedrängnisbegriff (Versinhalt gemäß Kontrollüberlieferung)
  choice: Bedrängnis
  rationale: Das Wort bezeichnet drückende Not, ohne die Art der Not unnötig einzuengen.
theological_decisions:
- issue: Verhältnis von Zion, Jerusalem und Israel
  choice: Die drei Bezeichnungen bleiben als parallele Satzglieder stehen.
  alternative: Zion und Jerusalem als bloße Synonyme zusammenziehen oder Israel ausdrücklich als Gottesvolk deuten.
  rationale: Der Text nennt alle drei Größen und lässt ihr genaues Verhältnis offen; eine harmonisierende oder konfessionelle Auslegung wäre ein Zusatz.
- issue: Art der Erlösung
  choice: 'Die Aussage bleibt allgemein: „aus der Bedrängnis erlöst“.'
  alternative: Eine ausdrücklich politische, militärische oder endzeitliche Erlösung formulieren.
  rationale: Der knappe Vers bestimmt die Art der Rettung nicht näher; diese Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dreigliedrige Parallelismus und das wiederholte Passiv werden bewahrt. Der bereitgestellte syrische Kapitelblock ist durch Seiteninterpolation gewonnen und zeigt die genaue Verszeile nicht eindeutig; deshalb wurde die kontrollierte englische Konsultationsfassung vorsichtig herangezogen, ohne zusätzliche Auslegung einzutragen.
