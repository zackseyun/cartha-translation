  text: Und der Mächtige erhörte ihn, weil Hiskija weise war, und achtete auf sein Gebet, weil er gerecht war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (im überlieferten Textzusammenhang OCR-bedingt unsicher)
  choice: der Mächtige
  rationale: Bewahrt den göttlichen Hoheitstitel, ohne den Gottesnamen oder eine konfessionell geprägte Deutung einzutragen.
- source_word: ܫܡܥ
  choice: erhörte
  rationale: Im Zusammenhang mit dem Gebet bezeichnet das Verb nicht bloß akustisches Hören, sondern gnädiges Hören und Reagieren.
- source_word: ܚܟܝܡ
  choice: weise
  rationale: Direkte und natürliche Wiedergabe der Hiskija zugeschriebenen Weisheit.
- source_word: ܒܥܘܬܗ
  choice: sein Gebet
  rationale: Gibt die Bitte beziehungsweise das flehentliche Gebet in idiomatischem modernem Deutsch wieder.
- source_word: ܙܕܝܩ
  choice: gerecht
  rationale: Bewahrt die ethisch-religiöse Aussage des Ausgangstextes, ohne sie näher zu systematisieren.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: der Mächtige
  alternative: der Allmächtige
  rationale: „Der Mächtige“ entspricht dem Titel enger und vermeidet die stärkere, dogmatisch aufgeladene Ausweitung zu „der Allmächtige“.
- issue: Zusammenhang zwischen Hiskijas Eigenschaften und Gottes Erhörung
  choice: Die beiden Begründungssätze mit „weil“ bleiben ausdrücklich stehen.
  alternative: Die Aussagen nur lose mit „und“ aneinanderreihen.
  rationale: So bleibt die im Text formulierte Begründungsstruktur erhalten, ohne zu erklären, wie sie theologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des syrischen Textes wird beibehalten; „erhörte“ ist im Gebetskontext natürlicher als das rein akustische „hörte“.
