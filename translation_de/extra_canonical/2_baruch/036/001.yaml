    Stille an einen Ort unweit jener Zeder; und sie brachten die gestürzte Zeder zu ihm.


    Da sah ich: Siehe, der Weinstock öffnete seinen Mund und sagte zu der Zeder: »Bist du nicht jene Zeder, die von dem Wald der Bosheit übrig geblieben ist? Durch dich bestand die Bosheit fort und wurde all die Jahre hindurch ausgeübt, während es kein Gutes gab. Du nahmst dir immer wieder, was dir nicht gehörte, und mit dem, was dir gehörte, hattest du nie Erbarmen. Die Fernen brachtest du unter deine Gewalt, und die, die dir nahe kamen, hieltest du in den Schlingen deiner Bosheit fest. Stets erhobst du dich, als könntest du nicht mit den Wurzeln ausgerissen werden. Doch nun ist deine Zeit schnell herangekommen, und deine Stunde ist da. So geh auch du, Zeder, dem Wald nach, der dir vorausgegangen ist. Werde mit ihm zu Staub, und eure Asche soll miteinander vermischt werden. Lege dich in Kummer nieder und ruhe in Qual, bis deine letzte Zeit kommt, wenn du wiederkehren und noch schwerer gequält werden wirst.«'
