  yaml_path: translation/extra_canonical/2_baruch/036/001.yaml
  text: 'When I had said these things, I fell asleep there, and in the night I saw a vision. And behold, a forest of trees planted on the plain, and high, rugged mountains surrounded it; and that forest covered a great expanse. And behold, opposite it a vine arose, and from beneath it a fountain came forth peacefully. Then that fountain came to the forest and swelled into mighty waves, and those waves submerged that forest, and suddenly uprooted the greater part of it and threw down all the mountains around it. And the height of the forest was brought low, and the tops of the mountains were lowered, and that fountain prevailed greatly, so that nothing was left of that great forest except one cedar alone. And when it had cast down and destroyed and uprooted the greater part of that forest, so that nothing remained of it and its place could no longer be recognized, then that vine came with the fountain in peace and great stillness, and it came to a place not far from that cedar, and they brought
    the cedar that had been thrown down to it. And I saw, and behold, the vine opened its mouth and said to the cedar: “Are you not that cedar which was left from the forest of wickedness, by whose means wickedness continued and was worked all those years, while goodness was not? And you kept taking what was not yours, and what was yours you never treated with compassion; and those far away you brought under your power, and those who came near you, you held fast in the snares of your evil; and you always lifted yourself up like one that could not be uprooted. But now your time has hastened, and your hour has come. So depart also, O cedar, after the forest which went before you, and become dust with it, and let your ashes be mixed together. And lie down in grief, and rest in torment until your last time comes, when you will return again and be tormented still more.”'
translation:
  language: de
  text: 'Als ich dies gesagt hatte, schlief ich dort ein, und in der Nacht sah ich eine Vision: Siehe, auf der Ebene stand ein Wald von Bäumen, und hohe, zerklüftete Berge umgaben ihn; dieser Wald bedeckte ein weites Gebiet. Und siehe, ihm gegenüber erhob sich ein Weinstock, und unter ihm entsprang in Frieden eine Quelle. Dann gelangte die Quelle zu dem Wald und schwoll zu gewaltigen Wogen an. Diese Wogen überfluteten den Wald, rissen plötzlich den größten Teil von ihm mit den Wurzeln aus und stürzten alle Berge rings um ihn nieder. Die Höhe des Waldes wurde erniedrigt, und die Gipfel der Berge wurden gesenkt. Die Quelle gewann so sehr die Oberhand, dass von jenem großen Wald nichts übrig blieb als eine einzige Zeder. Nachdem sie den größten Teil des Waldes niedergeworfen, vernichtet und mit den Wurzeln ausgerissen hatte, sodass nichts von ihm übrig blieb und selbst sein Ort nicht mehr zu erkennen war, kam der Weinstock mit der Quelle in Frieden und großer Stille an einen Ort unweit jener
    Zeder; und sie brachten die gestürzte Zeder zu ihm.


    Da sah ich: Siehe, der Weinstock öffnete seinen Mund und sagte zu der Zeder: »Bist du nicht jene Zeder, die von dem Wald der Bosheit übrig geblieben ist? Durch dich bestand die Bosheit fort und wurde all die Jahre hindurch ausgeübt, während das Gute nicht da war. Du nahmst dir immer wieder, was dir nicht gehörte, und mit dem, was dir gehörte, hattest du nie Erbarmen. Die Fernen brachtest du unter deine Gewalt, und die, die dir nahe kamen, hieltest du in den Schlingen deiner Bosheit fest. Stets erhobst du dich, als könntest du nicht mit den Wurzeln ausgerissen werden. Doch nun ist deine Zeit schnell herangekommen, und deine Stunde ist da. So geh auch du, Zeder, dem Wald nach, der dir vorausgegangen ist. Werde mit ihm zu Staub, und eure Asche soll miteinander vermischt werden. Lege dich in Kummer nieder und ruhe in Qual, bis deine letzte Zeit kommt, wenn du wiederkehren und noch schwerer gequält werden wirst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܐ
  choice: Wald
  rationale: Das Bild bezeichnet eine ausgedehnte, symbolische Gesamtheit von Bäumen; »Wald« bewahrt den apokalyptischen Maßstab natürlich und prägnant.
- source_word: ܓܦܢ
  choice: Weinstock
  rationale: »Weinstock« ist im Deutschen die klare biblische Bezeichnung für die Pflanze und lässt ihre symbolische Bedeutung ohne vorweggenommene Deutung stehen.
- source_word: ܡܒܘܥܐ
  choice: Quelle
  rationale: Gemeint ist hervorsprudelndes, fließendes Wasser. »Quelle« ist im modernen Deutschen natürlicher als »Brunnen« und kann zugleich den erhöhten visionären Ton tragen.
- source_word: ܐܪܙܐ
  choice: Zeder
  rationale: Die einfache Ba bezeichnet den bekannten biblischen Symbolbaum; ein erklärender Zusatz ist nicht erforderlich.
- source_word: ܒܫܠܡܐ
  choice: in Frieden
  rationale: Die ausdrückliche Friedenssprache wird beibehalten, damit der auffällige Gegensatz zwischen dem friedlichen Hervorkommen der Quelle und ihrer überwältigenden Gewalt erhalten bleibt.
theological_decisions:
- issue: Ob die spätere Deutung von Weinstock und Quelle bereits in die Vision eingetragen werden soll
  choice: Weinstock und Quelle bleiben im Haupttext ungedeutete Bildgestalten.
  alternative: Die Bilder durch Großschreibung, Titel oder erläuternde Zusätze ausdrücklich als messianische Gestalten kennzeichnen.
  rationale: Die Erzählfolge trennt Vision und spätere Auslegung. Eine Identifizierung an dieser Stelle würde die literarische und theologische Spannung vorzeitig auflösen.
- issue: Die Aussage über die spätere Rückkehr der Zeder zu noch größerer Qual
  choice: Die zeitliche und eschatologische Spannung wird wörtlich erkennbar bewahrt.
  alternative: Die Rückkehr abschwächen oder als bloße Fortdauer der gegenwärtigen Qual umformulieren.
  rationale: Der Text unterscheidet die gegenwärtige Ruhe in Qual von einer späteren Rückkehr zu noch schwererer Qual; diese schwierige Aussage darf nicht harmonisiert werden.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Ton mit klarer apokalyptischer Bildsprache. Wiederholungen wie »Und siehe«, »Wald«, »Quelle« und »Zeder« bleiben weitgehend erhalten, weil sie die Vision strukturieren. Die Symbole werden nicht durch spätere Auslegung erklärt.
