translation:
  language: de
  text: Und zu jener Zeit wird Frieden herrschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܡܐ
  choice: Frieden und Ruhe
  rationale: ܫܠܡܐ bezeichnet hier einen Zustand des Friedens beziehungsweise ungestörter Ruhe; die koordinierte deutsche Wendung gibt die Bedeutungsbreite in natürlicher Sprache wieder.
- source_word: ܙܒܢܐ
  choice: zu jener Zeit
  rationale: Die temporale Angabe wird idiomatisch wiedergegeben und an den im Zusammenhang bezeichneten Zeitraum zurückgebunden.
theological_decisions:
- issue: Bezug der Zeitangabe
  choice: „zu jener Zeit“
  alternative: „seine Zeit wird eine Zeit des Friedens sein“
  rationale: Der englische Konsultationstext versteht die Aussage als Zustandsbeschreibung jener Zeit. Der breitere syrische Kontext lässt zugleich einen Bezug auf die Zeit des zuvor genannten Messias zu; die knappe Formulierung vermeidet eine weitergehende dogmatische Ausdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; „herrschten“ drückt das Bestehen eines allgemeinen Zustands natürlicher aus als das wörtliche „existierten“.
