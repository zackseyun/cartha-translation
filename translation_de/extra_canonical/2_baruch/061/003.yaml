    rationale: Die syrische Verbform ist zukunftsbezogen („wird sein“). Die deutsche Wiedergabe sollte diese eschatologisch-prophetische Zeitreferenz bewahren.
  revised_text: Und zu jener Zeit wird Frieden herrschen.
