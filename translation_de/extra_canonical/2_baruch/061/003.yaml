review_pass:
  verdict: revise
  source_fidelity: Das Syrische sagt im relevanten Satzteil wörtlich, dass „seine Zeit“ (d. h. die zuvor genannte Zeit seines Offenbarwerdens) in/mit Frieden sein wird. Der Entwurf trifft die Zeitangabe grundsätzlich, fügt mit „Ruhe“ jedoch einen nicht eigens ausgedrückten zweiten Begriff hinzu und setzt die Aussage als vergangen bzw. gegenwärtig dar („herrschten“) statt zukunftsbezogen.
  naturalness: „Und zu jener Zeit wird Frieden herrschen.“ ist modernes, würdiges und idiomatisches Standarddeutsch. Es vermeidet eine unnötige Doppelung und gibt die prophetische Zukunft klar wieder.
  terminology: ܫܠܡܐ ist hier angemessen mit „Frieden“ wiedergegeben. Ein zusätzliches „Ruhe“ ist zur Wiedergabe dieses einzelnen Begriffs nicht erforderlich. Die zurückverweisende Formulierung „zu jener Zeit“ bewahrt den Kontextbezug, ohne ihn konfessionell auszudeuten.
