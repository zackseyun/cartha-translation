  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: de
  text: 'Und die sechsten hellen Wasser, die du gesehen hast: Das ist die Zeit, in der David und Salomo geboren wurden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auf die „Wasser“ bezogen: „Sie sind die Zeit“.'
    reason: Der pluralische Bildträger „Wasser“ wird mit dem singularischen Begriff „Zeit“ gleichgesetzt; die deutsche Hauptfassung glättet diesen Numeruswechsel idiomatisch.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: helle Wasser
  rationale: Die Formulierung bewahrt das Bild leuchtender, günstiger Wasser und ihren Gegensatz zu den dunklen Wassern, ohne das Symbol unnötig auszudeuten.
- source_word: ܕܘܝܕ ܘܫܠܝܡܘܢ (durch den Kontrolltext gesicherte Namen)
  choice: David und Salomo
  rationale: Die geläufigen deutschen Namensformen benennen die historische davidisch-salomonische Epoche klar und traditionsübergreifend.
- source_word: ܙܒܢܐ
  choice: Zeit
  rationale: Das Wort bezeichnet hier eine geschichtliche Epoche; „Zeit“ gibt diese Bedeutung schlicht und würdig wieder.
theological_decisions:
- issue: Ist die Aussage unmittelbar messianisch oder bezeichnet sie zunächst die geschichtliche Epoche Davids und Salomos?
  choice: Die sechsten hellen Wasser werden mit der geschichtlichen Zeit Davids und Salomos identifiziert.
  alternative: Eine unmittelbar messianische Herrschaftsaussage oder eine rein geistliche Deutung.
  rationale: Der Vers nennt ausdrücklich die Zeit, in der David und Salomo geboren wurden. Eine typologische Bedeutung bleibt möglich, wird aber nicht in den Wortlaut hineingetragen.
- issue: Numerus bei der Gleichsetzung der pluralischen Wasser mit der singularischen Zeit
  choice: „Das ist die Zeit“
  alternative: „Sie sind die Zeit“
  rationale: Die neutrale Rückverweisung mit „Das“ ist im modernen Deutsch natürlich und erhält die Identifikation mit einer einzigen Epoche; die formal pluralische Alternative wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die Deutung des Visionssymbols deutlich, ohne zusätzliche theologische Erklärung einzuführen.
