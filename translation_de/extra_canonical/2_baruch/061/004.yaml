translation:
  language: de
  text: Und Weisheit wurde in der Versammlung vernommen, und der Reichtum der Einsicht wurde in den Gemeinden vermehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܟܡܬܐ
  choice: Weisheit
  rationale: Die übliche und sachlich genaue Wiedergabe des syrischen Begriffs.
- source_word: ܣܘܟܠܬܢܘܬܐ
  choice: Einsicht
  rationale: Bezeichnet verständige Erkenntnis beziehungsweise Einsichtsvermögen; „Einsicht“ ist im modernen Deutschen natürlich und bewahrt die Unterscheidung von „Weisheit“.
- source_word: ܥܘܬܪܐ
  choice: Reichtum
  rationale: Bewahrt das konkrete Bild der Fülle und entspricht der substantivischen Ausdrucksweise des Syrischen.
- source_word: ܟܢܘܫܬܐ / ܟܢܘ̈ܫܬܐ
  choice: Versammlung / Gemeinden
  rationale: Gibt den im konsultierten Verswortlaut erkennbaren Wechsel zwischen Singular und Plural wieder, ohne die Begriffe konfessionell einzuengen.
theological_decisions:
- issue: Personifizierte Weisheit
  choice: Die passive Formulierung „Weisheit wurde … vernommen“ bleibt erhalten.
  alternative: „Man hörte Weisheit“ oder „die Weisheit sprach“
  rationale: Die Übersetzung lässt offen, ob Weisheit personifiziert gedacht ist oder ob weise Rede gemeint ist; sie fügt keine ausdrücklich sprechende Gestalt hinzu.
translation_notes:
  register: Würdevoller, gut verständlicher Standardsatz mit paralleler Struktur. „Hochgepriesen“ gibt die Steigerungs- beziehungsweise Verherrlichungsaussage wieder, ohne eine spezifisch liturgische Deutung festzulegen.
