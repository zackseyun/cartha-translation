    issue: „hochgepriesen“ für „were magnified“
    rationale: „Hochpreisen“ bedeutet loben bzw. verherrlichen. Die Aussage betrifft hier die Vermehrung/Steigerung des Reichtums der Einsicht. „vermehrt“ gibt dies ohne Bedeutungsverschiebung wieder.
