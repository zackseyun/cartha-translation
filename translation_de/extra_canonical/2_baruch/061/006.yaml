  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: de
  text: Damals zeigte sich, dass die Urteile[a] der Herrscher frei von Täuschung waren, und die Gerechtigkeit der Gebote des Mächtigen wurde in Wahrheit verwirklicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine ältere Wiedergabe lautet: „das Urteil der Herrscher war“. Im Syrischen stehen jedoch Substantiv und Verb im Plural.'
    reason: Dokumentiert die überlieferte Übersetzungsalternative und erklärt, weshalb der Haupttext dem grammatischen Plural folgt.
lexical_decisions:
- source_word: ܕܝ̈ܢܐ (dīnē)
  choice: die Urteile
  rationale: Das syrische Substantiv steht im Plural; die deutsche Wiedergabe wahrt diesen Numerus und passt zur pluralischen Verbform.
- source_word: ܫܠܝ̈ܛܢܐ (šallīṭānē)
  choice: der Herrscher
  rationale: Bezeichnet Machthaber oder Regierende; „Herrscher“ ist hier knapp, verständlich und registergerecht.
- source_word: ܠܐ ܢܟܠܐ (lā neklā)
  choice: frei von Täuschung
  rationale: Gibt die Aussage idiomatisch wieder, ohne sie auf bloße Irrtumslosigkeit oder eine bestimmte Rechtslehre zu verengen.
- source_word: ܟܐܢܘܬܐ (kēnūṯā)
  choice: Gerechtigkeit
  rationale: Bewahrt den ethisch-rechtlichen Sinn und die Verbindung zu den Geboten.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: des Mächtigen
  rationale: Der substantivierte Gottesbeiname wird entsprechend dem Sprachgebrauch von 2 Baruch als „der Mächtige“ wiedergegeben.
- source_word: ܒܩܘܫܬܐ (b-quštā)
  choice: in Wahrheit
  rationale: Erhält die ausdrückliche Wahrheitsformel und ihre feierliche Färbung.
theological_decisions:
- issue: Verhältnis von Gerechtigkeit und Geboten
  choice: „die Gerechtigkeit der Gebote … wurde … verwirklicht“
  alternative: „die gerechten Gebote … wurden erfüllt“
  rationale: Die gewählte Fassung erhält die eigenständige Abstraktion „Gerechtigkeit“ und löst die theologische Spannung nicht in ein bloßes Adjektiv auf.
- issue: Numerus bei „Urteil(e)“
  choice: 'Plural: „die Urteile … waren“'
  alternative: 'Singular: „das Urteil … war“'
  rationale: Substantiv und Verb sind nach der überprüften syrischen Lesung pluralisch; der Singular wird nur als frühere Wiedergabemöglichkeit in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am syrischen Parallelismus, wird aber durch „Damals zeigte sich, dass …“ natürlich lesbar gemacht. Der Gottesbeiname „der Mächtige“ und die abstrakte Wendung „Gerechtigkeit der Gebote“ bleiben bewusst erhalten.
