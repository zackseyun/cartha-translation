base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: de
  text: Und das Land wurde mehr als alle anderen Länder verherrlicht, weil es damals Erbarmen erfahren hatte und seine Bewohner nicht sündigten. Die Stadt Zion herrschte damals über alle Länder und Gebiete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „herrschte damals über alle Länder“.'
    reason: Überlieferte kürzere Wiedergabe, bei der „und Gebiete“ nicht mit ausgedrückt wird.
lexical_decisions:
- source_word: ܐܪܥܐ (arʿā)
  choice: Land
  rationale: „Land“ bewahrt den geografisch-politischen Sinn und passt zum anschließenden Vergleich mit anderen Ländern.
- source_word: ܪܚܡܐ / entsprechende Überlieferungsform
  choice: Erbarmen erfahren hatte
  rationale: Die Formulierung gibt den passiven Empfang göttlichen Erbarmens natürlich wieder, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: ܨܗܝܘܢ (ṣehyōn)
  choice: Zion
  rationale: Der traditionelle Eigenname bleibt unverändert und ist im Deutschen allgemein verständlich.
- source_word: ܫܠܛ / entsprechende Verbform
  choice: herrschte
  rationale: „Herrschte“ gibt die politische Vorrangstellung Zions klar und würdig wieder; „regierte“ wäre ebenfalls möglich, klingt hier aber stärker administrativ.
theological_decisions:
- issue: Grund der Verherrlichung des Landes
  choice: 'Beide im Text genannten Gründe bleiben nebeneinander stehen: empfangenes Erbarmen und die Sündlosigkeit seiner Bewohner.'
  alternative: Die Sündlosigkeit als Folge des Erbarmens oder das Erbarmen als Belohnung für die Sündlosigkeit deuten.
  rationale: Der Satz nennt beide Begründungen, legt ihr theologisches Verhältnis aber nicht ausdrücklich fest; diese Spannung wird nicht aufgelöst.
- issue: Zeitliche Einordnung der Herrschaft Zions
  choice: „damals“ wird ausdrücklich auch im zweiten Satz wiedergegeben.
  alternative: Das Zeitadverb nur aus dem Zusammenhang erschließen lassen.
  rationale: Die bezeugte zeitliche Markierung soll sichtbar bleiben und betont die Herrschaft Zions in jener bestimmten Epoche.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde gegenüber einer möglichen langen Periodenkonstruktion in zwei Sätze gegliedert, damit die beiden Aussagen klar verständlich bleiben. Wegen der nur kapitelweise und offenbar nicht versgenau abgegrenzten syrischen Quellenausgabe stützt sich die genaue Verszuordnung zusätzlich auf die auditierte Konsultationsschicht.
