  text: And the holy festivals were celebrated with goodness and with much joy.
translation:
  language: de
  text: Und die heiligen Feste wurden in Güte und mit großer Freude begangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wurden vollendet (oder: erfüllt).'
    reason: Bewahrt die mögliche wörtlichere Bedeutung hinter der idiomatischen Wiedergabe „begangen“.
lexical_decisions:
- source_word: '(im vorgelegten syrischen Kapitelblock nicht sicher abgrenzbar; englische Prüfschicht: “holy festivals”)'
  choice: die heiligen Feste
  rationale: „Feste“ ist im heutigen Deutsch die natürliche Bezeichnung für religiöse Festzeiten; „heilig“ bewahrt ihre kultische Bestimmung.
- source_word: '(englische Prüfschicht: “were celebrated”; frühere wörtliche Wiedergabe: “were fulfilled”)'
  choice: wurden … begangen
  rationale: „Ein Fest begehen“ ist eine natürliche und würdevolle deutsche Wendung. Sie bezeichnet die tatsächliche Feier, ohne die mögliche Grundbedeutung „vollendet/erfüllt“ ganz aus dem Blick zu verlieren.
- source_word: '(englische Prüfschicht: “with goodness and with much joy”)'
  choice: in Güte und mit großer Freude
  rationale: Die unterschiedliche Präposition wahrt gutes Deutsch und bildet zugleich beide Begleitumstände knapp ab.
theological_decisions:
- issue: Mögliche Mehrdeutigkeit zwischen dem Feiern und dem Erfüllen der Feste
  choice: Im Haupttext „begangen“, mit Fußnote „vollendet/erfüllt“
  alternative: „wurden vollendet“ oder „wurden erfüllt“
  rationale: Im Zusammenhang mit Festen ist „begangen“ idiomatisch und sachlich naheliegend. Die Fußnote erhält jedoch die im Überlieferungs- beziehungsweise Revisionsbefund bezeugte wörtlichere Möglichkeit und vermeidet eine stille Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der bereitgestellte syrische Text ist ein breiter, offenbar seitenüberlappender Kapitelblock; der genaue Wortlaut von Vers 5 lässt sich darin nicht zuverlässig isolieren. Deshalb folgt der Entwurf vorsichtig der auditierten englischen Prüfschicht und kennzeichnet die relevante lexikalische Alternative ausdrücklich.
