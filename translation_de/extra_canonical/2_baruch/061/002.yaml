  yaml_path: translation/extra_canonical/2_baruch/061/002.yaml
  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: de
  text: Und zu jener Zeit kam es[a] zum Aufbau Zions und zur Einweihung des Heiligtums. Viel Blut der Völker, die damals sündigten, wurde vergossen, und bei der Einweihung des Heiligtums wurden damals viele Opfer dargebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich, mit Umstellung: »Der Aufbau Zions und die Einweihung des Heiligtums fanden statt.«'
    reason: Das zugrunde liegende Verb kann allgemein das Eintreten oder Stattfinden eines Geschehens bezeichnen; die alternative deutsche Wiedergabe erfordert eine Umstellung der Satzkonstruktion.
lexical_decisions:
- source_word: ܗܘܐ (erschlossen aus der überlieferten Fassung; im bereitgestellten Kapitel-Ausschnitt ist Vers 61,2 nicht eindeutig abgrenzbar)
  choice: kam es
  rationale: Bewahrt die weite Ereignisbedeutung des syrischen Verbs und klingt im modernen Deutschen bei »Aufbau« und »Einweihung« natürlich.
- source_word: building of Zion
  choice: Aufbau Zions
  rationale: »Aufbau« bezeichnet den Vorgang, ohne unnötig festzulegen, ob ausschließlich eine Stadt, ihre Mauern oder die Gemeinschaft gemeint ist.
- source_word: dedication of the sanctuary
  choice: Einweihung des Heiligtums
  rationale: Natürliche, kultisch passende Wiedergabe; »Heiligtum« lässt die im Ausdruck angelegte sakrale Bedeutung bestehen.
- source_word: offerings
  choice: Opfer
  rationale: Im Zusammenhang mit der Einweihung ist »Opfer« die idiomatische und sachlich passende deutsche Bezeichnung.
theological_decisions:
- issue: Bezug von »Zion«
  choice: Zion unbestimmt stehen lassen
  alternative: Jerusalem, den Tempel oder die Glaubensgemeinschaft ausdrücklich einsetzen
  rationale: Der Name kann mehrere miteinander verbundene Bedeutungen tragen; der Text selbst soll diese nicht vorschnell auf eine einzige festlegen.
- issue: Verantwortung der Völker
  choice: »die damals gesündigt hatten«
  alternative: »die damals schuldig geworden waren«
  rationale: »Gesündigt« wahrt die ausdrücklich religiös-moralische Aussage, ohne Art oder Umfang der Schuld zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »damals« wurde beibehalten, weil sie beide Aussagen ausdrücklich an jene Zeit bindet. Der bereitgestellte syrische Kapitel-Ausschnitt lässt Vers 61,2 nicht sicher isolieren; deshalb wurde die englische POB-Fassung nur als geprüfte Orientierung herangezogen und ihre erkennbare Ereignisstruktur nicht weiter harmonisiert.
