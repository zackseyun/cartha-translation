  yaml_path: translation/extra_canonical/2_baruch/065/002.yaml
  text: For he committed much impiety, and he killed the righteous, and he perverted the law, and he shed innocent blood, and he polluted the sanctuary, and he caused the people to sin.
translation:
  language: de
  text: Denn er beging viel Frevel, tötete die Gerechten, verdrehte das Gesetz, vergoss unschuldiges Blut, entweihte das Heiligtum und verleitete das Volk zur Sünde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘ̈ܒܐ
  choice: Frevel
  rationale: Gibt schwere schuldhafte und gottlose Taten in einem würdigen, allgemein verständlichen Ausdruck wieder, ohne sie auf bloße Ritualverstöße einzuengen.
- source_word: ܕܡܐ ܐܫܕ
  choice: Blut vergoss
  rationale: Bewahrt die konkrete semitische Wendung für gewaltsames Töten.
- source_word: ܙܕܝ̈ܩܐ
  choice: die Gerechten
  rationale: Entspricht dem ethisch-religiösen Sinn und lässt den bestimmten Personenkreis offen.
theological_decisions:
- issue: Art und Umfang von Manasses Schuld
  choice: Die einzelnen Vergehen werden gleichrangig und ohne zusätzliche Deutung wiedergegeben.
  alternative: Die Handlungen als besonderen Abfall oder als spezifische Form des Götzendienstes zusammenfassen.
  rationale: Der Text entfaltet die Schuld durch eine Reihe konkreter Taten; eine konfessionelle oder systematische Einordnung würde mehr festlegen, als die Überlieferung ausdrücklich sagt.
- issue: Verursachung der Sünde des Volkes
  choice: „verleitete das Volk zur Sünde“
  alternative: „ließ das Volk sündigen“
  rationale: „Verleitete“ drückt wirksame Verursachung natürlich aus, ohne dem Volk jede eigene Verantwortung abzusprechen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Reihung des Ausgangstextes bleibt erhalten, wird aber durch eine einzige klare Satzstruktur flüssig lesbar gemacht. Die überlieferten englischen Fußnoten zur angeblichen neunten schwarzen Wasserflut wurden nicht übernommen, da sie auf einer früheren Versfehlzuordnung beruhen und nicht zu 2 Baruch 65,2 gehören.
