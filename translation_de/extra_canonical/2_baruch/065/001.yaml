  yaml_path: translation/extra_canonical/2_baruch/065/001.yaml
  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: de
  text: Nach Manasse trat Amon auf. Zu seiner Zeit meinte er, der Mächtige werde ihn für diese Dinge nicht zur Rechenschaft ziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܒܬܪ ܕܝܢ ܡܢܫܐ ܗܘܐ
  choice: Nach Manasse trat Amon auf
  rationale: Der überlieferte Seitentext ist an dieser Stelle erkennbar gestört und scheint einen Namen zu wiederholen. Der Kapitelzusammenhang und die kontrollierte Lesart weisen auf Amon als Nachfolger Manasses. „trat … auf“ gibt ܗܘܐ idiomatisch wieder, ohne die unbelegte frühere Deutung „handelte gottlos“ zu übernehmen.
- source_word: ܘܡܬܚܫܒ
  choice: meinte er
  rationale: Das Verb bezeichnet hier Amons innere Annahme oder Überlegung; „meinte“ ist natürlich und bewahrt diesen subjektiven Charakter.
- source_word: ܒܙܒܢܗ
  choice: Zu seiner Zeit
  rationale: Die Formulierung bewahrt den zeitlichen Bezug auf Amons eigene Regierungs- beziehungsweise Lebenszeit.
- source_word: ܚܝܒܘܬܐ
  choice: zur Rechenschaft ziehen
  rationale: Die gerichtliche Bedeutung wird wiedergegeben, ohne sie vorschnell auf eine bestimmte Form der Bestrafung zu verengen.
- source_word: ܡ̈ܠܐ / pronominaler Rückbezug im gestörten Satz
  choice: für diese Dinge
  rationale: Der pluralische Rückbezug wird beibehalten und verweist auf die zuvor geschilderten Verfehlungen.
theological_decisions:
- issue: Bezeichnung Gottes als „der Mächtige“
  choice: der Mächtige
  alternative: Gott
  rationale: Die titulare Gottesbezeichnung wird bewahrt; eine Ersetzung durch „Gott“ wäre verständlich, würde aber das charakteristische Vokabular des Werkes einebnen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Wegen des erkennbar gestörten syrischen Seitentextes folgt die Namensfolge dem kontrollierten Kapitelzusammenhang: Auf Manasse folgt Amon. Die unbelegte ältere Alternativwiedergabe „Amon handelte gottlos“ wurde nicht als Fußnote übernommen.'
