  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: de
  text: Denn die Erde wird dann gewiss die Toten wieder herausgeben, die sie jetzt aufnimmt, um sie zu bewahren, ohne etwas an ihrer Gestalt zu verändern. Vielmehr wird sie sie so zurückgeben, wie sie sie aufgenommen hat; und so, wie ich sie ihr übergeben habe, wird sie sie auch auferwecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܩܝܡܐ
  choice: wieder herausgeben / zurückgeben / auferwecken
  rationale: Die abgestufte Verbenfolge bewahrt sowohl den Gedanken der Rückgabe durch die Erde als auch die ausdrückliche Auferstehungsbedeutung des Schlussverbs.
- source_word: ܕܬܢܛܪ ܐܢܘܢ
  choice: um sie zu bewahren
  rationale: Die Zweckangabe beschreibt die Erde als den Ort, der die Toten bis zu ihrer Rückgabe verwahrt; sie darf nicht zu einer bloßen Vergleichsformel abgeschwächt werden.
- source_word: ܒܨܘܪܬܗܘܢ
  choice: an ihrer Gestalt
  rationale: „Gestalt“ lässt den Bezug auf die erkennbare leibliche Erscheinung offen und wahrt den Gedanken der Kontinuität, ohne physiologische Einzelheiten festzulegen.
- source_word: ܐܠܐ
  choice: vielmehr
  rationale: Das adversative Bindewort stellt der Verneinung einer Veränderung die positive Aussage gegenüber, dass die Erde die Toten so zurückgibt, wie sie sie aufgenommen hat.
- source_word: ܐܫܠܡܬ ܐܢܘܢ ܠܗ̇
  choice: ich sie ihr übergeben habe
  rationale: Das feminine Pronomen bezieht sich auf die Erde. „Übergeben“ gibt die Anvertrauung der Toten an die Erde natürlich und sachlich wieder.
theological_decisions:
- issue: Kontinuität zwischen den aufgenommenen Toten und den Auferweckten
  choice: Die Erde gibt dieselben Toten in unveränderter Gestalt zurück und erweckt sie auf.
  alternative: Eine rein geistige Auferstehung ohne Kontinuität der Gestalt oder eine nur symbolische Wiedererkennung.
  rationale: Die wiederholten Aussagen über Aufnehmen, Bewahren, unveränderte Gestalt, Zurückgeben und Auferwecken betonen die fortbestehende Identität, ohne den Vorgang der Auferstehung näher zu definieren.
- issue: Handelndes Subjekt bei Übergabe und Auferweckung
  choice: Der Sprecher übergibt die Toten der Erde; die Erde gibt sie zurück und erweckt sie auf.
  alternative: Das abschließende Verb unmittelbar auf den Sprecher zu beziehen.
  rationale: Die fortlaufenden femininen Verb- und Pronomenbezüge führen die Erde als grammatisches Subjekt weiter, während das Ich ausdrücklich als derjenige erscheint, der ihr die Toten übergeben hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „sie“ ist wegen der engen Rückbezüge bewusst beibehalten; „wieder herausgeben“, „zurückgeben“ und „auferwecken“ bilden eine natürliche deutsche Steigerung, ohne die verschiedenen syrischen Verben einzuebnen.
