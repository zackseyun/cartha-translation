base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: de
  text: Denn sie haben für sich diese gegenwärtige Zeit gewählt, die nicht ohne Bedrängnis vergehen kann. Sie haben für sich jene Zeit gewählt, deren Folgen voller Klagen und Übel sind. Die Welt aber, die alle, die in sie eingehen, nicht altern lässt,[a] haben sie verworfen, ebenso die Zeit der Herrlichkeit. So werden sie nicht zu der Ehre gelangen, von der ich euch zuvor erzählt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die diejenigen, die in sie eingehen, nicht alt macht«; weniger wahrscheinlich: »diejenigen, die in sie eingehen, nicht altern«.'
    reason: Die transitive Lesart der syrischen Verbform ist vorzuziehen; die Fußnote dokumentiert die überlieferte alternative, intransitive Auffassung mit richtigem Subjekt.
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: Zeit
  rationale: Gibt den zeitlichen Abschnitt natürlich und würdig wieder; der Wechsel zwischen »diese gegenwärtige Zeit« und »jene Zeit« bleibt erhalten.
- source_word: ܐܘܠܨܢܐ
  choice: Bedrängnis
  rationale: Bewahrt den Sinn von Not, Druck und leidvoller Bedrängung, ohne ihn unnötig auf körperlichen Schmerz einzuengen.
- source_word: ܥܠܡܐ
  choice: Welt
  rationale: Lässt die mögliche eschatologische Weite des syrischen Begriffs bestehen; »Zeitalter« wäre ebenfalls denkbar, würde hier aber die Bildlichkeit des Eingehens abschwächen.
- source_word: ܡܣܐܒ
  choice: altern lässt
  rationale: Die transitive Pael-Form bezeichnet ein Alternmachen; die kommende Welt lässt ihre Bewohner demnach nicht altern.
- source_word: ܐܝܩܪܐ
  choice: Ehre
  rationale: Entspricht dem Bedeutungsfeld von Ehre, Würde und Herrlichkeit und unterscheidet den Ausdruck von der unmittelbar zuvor genannten »Herrlichkeit«.
theological_decisions:
- issue: Wirkung der kommenden Welt auf diejenigen, die in sie eingehen
  choice: »die ... nicht altern lässt«
  alternative: »die für diejenigen, die in sie eingehen, nicht altert«
  rationale: Die syrische Verbform ist transitiv. So bleibt die Aussage erhalten, dass diese Welt ihre Bewohner vor dem Altern bewahrt, statt lediglich selbst nicht zu altern.
- issue: Folge der Verwerfung
  choice: »So werden sie nicht zu der Ehre gelangen«
  alternative: »damit sie nicht zu der Ehre gelangen«
  rationale: Die deutsche Folgeformulierung gibt den Zusammenhang natürlich wieder, ohne zu unterstellen, dass das Nichterlangen der Ehre ausdrücklich ihr beabsichtigtes Ziel war.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem apokalyptischem Ton. Die parallele Satzstruktur des Ausgangstextes bleibt erkennbar, wird aber durch natürliche deutsche Satzgrenzen lesbar gehalten.
