  text: 'For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.'
translation:
  language: de
  text: 'Denn dies ist erforderlich: Den Lebenden muss gezeigt werden, dass die Toten zum Leben gekommen sind und dass die, die fortgegangen waren, wiedergekommen sind.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: muss … gezeigt werden
  rationale: Das unpersönliche Passiv bezeichnet hier eine Notwendigkeit bzw. Erfordernis; zusammen mit dem folgenden Infinitiv ܠܡܚܘܝܘ ergibt sich im Deutschen natürlich „muss … gezeigt werden“.
- source_word: ܚܝܘ ܡ̈ܝܬܐ
  choice: die Toten zum Leben gekommen sind
  rationale: ܚܝܘ bedeutet wörtlich „lebten/sind lebendig geworden“. „Zum Leben gekommen“ gibt den Eintritt ins Leben wieder, ohne die Aussage näher zu systematisieren.
- source_word: ܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: die, die fortgegangen waren, wiedergekommen sind
  rationale: Die syrische Gegenüberstellung lautet wörtlich „es kamen diejenigen, die fortgegangen waren“. „Wiedergekommen“ bewahrt diese Bewegung und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Art und Zeitpunkt des Lebens der Toten
  choice: „zum Leben gekommen sind“
  alternative: „auferstanden sind“
  rationale: Der Ausgangstext verwendet das allgemeine Verb „leben/lebendig werden“ und nicht ausdrücklich einen technischen Auferstehungsbegriff. Die Übersetzung bewahrt diese sprachliche Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt bildet die erklärende ܕ-Konstruktion transparent ab; die parallelen Aussagen über Tote und Fortgegangene bleiben erhalten.
