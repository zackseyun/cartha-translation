  text: By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?
translation:
  language: de
  text: Wodurch also haben die Menschen ihr Leben verloren, und wofür haben die, die auf der Erde waren, ihre Seele eingetauscht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: Wodurch
  rationale: Die instrumentale Frage wird im Deutschen natürlich und präzise mit „wodurch“ wiedergegeben.
- source_word: ܗܟܝܠ
  choice: also
  rationale: Bewahrt die folgernde Funktion der syrischen Partikel.
- source_word: ܐܘܒܕܘ
  choice: haben … verloren
  rationale: Gibt die Bedeutung „verlieren, zugrunde richten“ im vorliegenden Fragesatz idiomatisch wieder.
- source_word: ܚܝܝ̈ܗܘܢ
  choice: ihr Leben
  rationale: Bewahrt den konkreten Bezug auf das Leben der betreffenden Menschen.
- source_word: ܢܦܫܗܘܢ (durch den kontrollierten Verskontext bezeugt)
  choice: ihre Seele
  rationale: „Seele“ erhält die anthropologische Spannung gegenüber „Leben“, ohne beide Begriffe gleichzusetzen.
- source_word: ܚܠܦ / Austauschformulierung (durch den kontrollierten Verskontext bezeugt)
  choice: eingetauscht
  rationale: Gibt den Gedanken eines Tauschs gegen etwas anderes wieder und lässt den fragenden Vorwurf bestehen.
theological_decisions:
- issue: Verhältnis von „Leben“ und „Seele“
  choice: Beide Begriffe werden unterschieden wiedergegeben.
  alternative: Beide Stellen mit „Leben“ übersetzen.
  rationale: Die unterschiedliche Begrifflichkeit trägt zur anthropologischen und rhetorischen Spannung des Verses bei und soll nicht eingeebnet werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Doppelfrage und ihre anklagende Offenheit bleiben erhalten; „die Menschen“ vermeidet eine unnötig geschlechtsspezifische Formulierung.
