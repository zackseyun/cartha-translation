  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: de
  text: Und wenn jener festgesetzte Tag vorüber ist, wird sich danach die Gestalt der Verurteilten verändern, ebenso die Herrlichkeit der Gerechtfertigten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘ ܝܘܡܐ
  choice: jener festgesetzte Tag
  rationale: Der Ausdruck bezeichnet im Zusammenhang den zuvor bestimmten eschatologischen Tag; „jener“ hält den rückverweisenden Charakter fest, während „festgesetzt“ die kontextuell vorausgesetzte Bestimmung ausdrückt.
- source_word: ܕܡܘ̈ܬܐ / ܕܡܘܬܐ
  choice: Gestalt
  rationale: „Gestalt“ gibt die sichtbare Erscheinungsform natürlich und würdig wieder, ohne die Aussage auf bloßes Aussehen oder auf das Wesen der Personen zu verengen.
- source_word: ܐܝܠܝܢ ܕܡܬܚܘܝܢ
  choice: die Verurteilten
  rationale: Im unmittelbaren Kontrast zu den Gerechtfertigten sind diejenigen gemeint, über die ein negatives Urteil ergangen ist.
- source_word: ܫܘܒܚܬܗܘܢ
  choice: die Herrlichkeit
  rationale: Der Begriff bezeichnet hier die eschatologische Herrlichkeit der Gerechtfertigten; „Herrlichkeit“ bewahrt den theologischen und erhöhten Gehalt.
- source_word: ܐܝܠܝܢ ܕ… ܐܙܕܩܘ
  choice: die Gerechtfertigten
  rationale: Die passive Form wird beibehalten und nicht als bloße moralische Beschreibung („die Gerechten“) geglättet.
theological_decisions:
- issue: Art der endzeitlichen Veränderung
  choice: Die Gestalt der Verurteilten verändert sich; die Herrlichkeit der Gerechtfertigten wird parallel genannt.
  alternative: Beide Gruppen erhalten ausdrücklich eine veränderte körperliche Erscheinung.
  rationale: Der Wortlaut setzt „Gestalt“ und „Herrlichkeit“ nebeneinander, ohne die genaue ontologische oder körperliche Art der Veränderung näher zu bestimmen. Diese Spannung wird nicht harmonisiert.
- issue: Bedeutung von „Gerechtfertigten“
  choice: Passive, urteilshafte Formulierung
  alternative: „die Gerechten“ als Charakterbezeichnung
  rationale: Die passive Wiedergabe wahrt die Möglichkeit eines göttlichen Rechtfertigungs- oder Freispruchsakts und vermeidet eine konfessionelle Ausdeutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem eschatologischem Ton. Die Satzstellung wurde gegenüber einer streng formalen Nachbildung gestrafft; „danach“ bewahrt dennoch die zeitliche Abfolge des syrischen Textes.
