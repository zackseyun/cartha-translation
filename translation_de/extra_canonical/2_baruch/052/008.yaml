  - severity: low
    issue: Singular „mein Gesetz“ statt syrischem Plural
    rationale: Der kollektive Singular ist im Deutschen möglich, aber der ausdrücklich markierte Plural „meine Gesetze“ ist ebenso natürlich und genauer.
