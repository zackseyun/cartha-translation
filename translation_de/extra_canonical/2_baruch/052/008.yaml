  text: But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—
translation:
  language: de
  text: Doch besonders werden diejenigen erschüttert werden, die wie diese sind – die meine Gesetze verworfen und ihre Ohren verschlossen haben, um Weisheit nicht zu hören und Einsicht nicht anzunehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: werden bestürzt sein
  rationale: Das Ethpaal von ܙܘܥ bezeichnet ein starkes inneres Erschüttert- oder Aufgewühltsein. „Bestürzt sein“ gibt dies im Zusammenhang des Gerichts natürlich wieder, ohne die Bedeutung auf bloße Beschämung zu verengen.
- source_word: ܢܡܘܣܝ̈
  choice: mein Gesetz
  rationale: Die syrische Form ist ein Plural mit Suffix der ersten Person Singular, wörtlich etwa „meine Gesetze“. Im Deutschen bezeichnet der kollektive Singular „mein Gesetz“ die göttliche Weisung idiomatisch; die Sprecherreferenz bleibt erhalten.
- source_word: ܐܣܠܝܘ
  choice: verworfen
  rationale: Das Verb bedeutet ablehnen, verschmähen oder verwerfen. „Verworfen“ bewahrt die bewusste Zurückweisung.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: ihre Ohren verschlossen haben
  rationale: Die bildhafte syrische Wendung wird direkt und im Deutschen verständlich wiedergegeben.
- source_word: ܚܟܡܬܐ
  choice: Weisheit
  rationale: Die übliche und kontextuell passende Entsprechung für die personell beziehungsweise lehrhaft gedachte Weisheit.
- source_word: ܣܘܟܠܐ
  choice: Einsicht
  rationale: Das Wort bezeichnet Verständnis, Einsicht oder Erkenntnisvermögen. „Einsicht“ passt zur parallelen Verbindung mit Weisheit und dem Verb „annehmen“.
theological_decisions:
- issue: Numerus von ܢܡܘܣܝ̈ („meine Gesetze“)
  choice: mein Gesetz
  alternative: meine Gesetze
  rationale: Der deutsche kollektive Singular bezeichnet Gottes gesamte Weisung natürlicher und entspricht dem unmittelbaren Kontext. Die mögliche Betonung einzelner Gebote durch den syrischen Plural wird dabei nicht dogmatisch ausgedeutet.
- issue: Art des endzeitlichen Ergehens
  choice: bestürzt sein
  alternative: zuschanden werden / erschüttert werden
  rationale: Der syrische Ausdruck benennt primär Erschütterung oder Aufgewühltheit. Die Übersetzung vermeidet es, ausdrücklich Scham oder Verdammnis einzutragen, wo der Ausgangstext dies nicht eindeutig festlegt.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die adversative Fortführung „Doch“ und die besondere Hervorhebung „besonders“ entsprechen dem syrischen Zusammenhang. Der Vers endet syntaktisch vollständig, obwohl der Gedankengang im folgenden Vers weitergeführt wird.
