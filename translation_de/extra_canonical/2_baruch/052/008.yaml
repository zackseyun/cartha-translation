  naturalness: Die Revision bleibt in modernem, würdigem Standarddeutsch flüssig. Die Doppelbestimmung „die wie diese sind – die ...“ bildet die leicht verschachtelte syrische Satzführung verständlich ab.
  terminology: „erschüttert werden“ gibt das reflexiv/passivische ܢܬܬܙܝܥܘܢ genauer wieder als die statische Formulierung „bestürzt sein“. „Weisheit“ und „Einsicht“ sind passende, etablierte Entsprechungen. Der Plural „meine Gesetze“ wahrt die Form des Ausgangstextes.
