  source_fidelity: 'Der Entwurf gibt die wesentlichen Bilder und Beziehungen des Syrischen zutreffend wieder: die nicht mehr bedrängende Zeit, die ausgebreiteten Bereiche des Paradieses, die Lebewesen unter dem Thron und die zurückgehaltenen Engel. Die Schlussformulierung „bis die für sie bestimmte Zeit kommt“ legt jedoch den schwierigen Ausdruck stärker als nötig als festgesetzten Zeitpunkt aus. Der Kontext spricht von einem künftigen Hervortreten/Erscheinen der Engel; dies lässt sich im Deutschen genauer und zugleich zurückhaltender ausdrücken.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. Die Gliederung in zwei Sätze ist sinnvoll. „Damit sie an ihren Plätzen stehen bleiben“ bildet die finale Funktion des Befehls natürlicher und genauer ab als „an ihren Plätzen festgehalten“.
  terminology: „Paradies“, „Lebewesen“, „Thron“, „Scharen der Engel“ und „mein Wort“ sind passend und ohne konfessionelle Überbestimmung gewählt. „Herrliche Schönheit“ ist als idiomatische Wiedergabe der Verbindung von Schönheit und Majestät vertretbar.
