    rationale: Die Quelle und der englische Audit Trail weisen eher auf das künftige Kommen bzw. Erscheinen der Engel. „Die Zeit ihres Erscheinens“ wahrt den Kontext, ohne eine zusätzliche Bestimmung („für sie bestimmte“) einzutragen.
  - severity: low
    issue: „Durch einen Befehl an ihren Plätzen festgehalten“ gibt den finalen Sinn der syrischen Konstruktion weniger deutlich wieder.
    rationale: Die Formulierung mit „damit sie an ihren Plätzen stehen bleiben“ zeigt, dass der Befehl auf ihr Verbleiben an diesen Plätzen zielt.
