base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: de
  text: Und jene Zeit wird sie nicht mehr bedrängen. Denn vor ihnen werden sich die Weiten des Paradieses ausbreiten, und ihnen wird die herrliche Schönheit der Lebewesen unter dem Thron gezeigt werden, ebenso alle Scharen der Engel. Sie werden jetzt durch mein Wort zurückgehalten, damit sie nicht sichtbar werden, und durch einen Befehl gehalten, damit sie an ihren Plätzen stehen bleiben, bis die Zeit ihres Erscheinens kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܢܥܘܩ ܐܢܘܢ ܙܒܢܐ
  choice: jene Zeit wird sie nicht mehr bedrängen
  rationale: Das Verb bezeichnet Bedrängen oder Bedrücken. Diese Bedeutung ist im Syrischen unmittelbarer als die konsultierte englische Wiedergabe „grow old“.
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: die Weiten des Paradieses
  rationale: Die Form bezeichnet die ausgedehnten Bereiche oder Weiten des Paradieses; „Weiten“ ist natürlich und bewahrt das räumliche Bild.
- source_word: ܫܘܦܪܐ ܕܪܒܘܬܐ
  choice: die herrliche Schönheit
  rationale: Die Genitivverbindung enthält sowohl Schönheit als auch Majestät/Größe. Die idiomatische deutsche Verbindung gibt beides wieder, ohne den Ausdruck unnötig zu verkomplizieren.
- source_word: ܚ̈ܝܐ ܕܐܝܬ ܬܚܘܬܝܗ
  choice: der Lebewesen unter dem Thron
  rationale: Im apokalyptischen Zusammenhang sind die Lebewesen beim Thron gemeint. „Lebewesen“ bleibt gegenüber einer präziseren Identifizierung offen.
- source_word: ܚܒܝ̈ܫܐ
  choice: zurückgehalten
  rationale: Das Wort bezeichnet ein Eingeschlossensein oder Zurückhalten; hier passt die funktionale Wiedergabe „zurückgehalten“.
- source_word: ܥܕܡܐ ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ
  choice: bis die für sie bestimmte Zeit kommt
  rationale: Der überlieferte Ausdruck ist textlich schwierig; im Kontext bezeichnet er den festgesetzten Zeitpunkt ihres Hervortretens. Die Übersetzung bewahrt den zeitlichen und angeordneten Charakter.
theological_decisions:
- issue: Identität der Wesen unter dem Thron
  choice: Lebewesen
  alternative: lebendige Wesen / Thronwesen
  rationale: Der Quelltext benennt sie allgemein als Lebewesen. Eine nähere angelologische Klassifizierung würde mehr festlegen, als der Text ausdrücklich sagt.
- issue: Mittel, durch das die Engel zurückgehalten werden
  choice: durch mein Wort
  alternative: durch meine Vollmacht
  rationale: Die Textüberlieferung beziehungsweise Lesung ist an dieser Stelle schwierig. „Durch mein Wort“ entspricht der kontrollierten Lesetradition und steht parallel zum folgenden „durch einen Befehl“, ohne eine besondere Lehrtradition einzutragen.
- issue: Zeitpunkt des Erscheinens der Engel
  choice: die für sie bestimmte Zeit
  alternative: ihre Ankunft
  rationale: Die Formulierung betont den angeordneten Zeitpunkt. „Ankunft“ könnte nahelegen, die Engel kämen von einem anderen Ort, während der Kontext sagt, dass sie bis dahin an ihren Plätzen festgehalten werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt der syrischen Argumentation, wird aber für heutige Leser maßvoll gegliedert. Die apokalyptischen Bilder bleiben erhalten; textlich oder sachlich offene Einzelheiten werden nicht konfessionell präzisiert.
