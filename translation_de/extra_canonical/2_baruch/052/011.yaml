  yaml_path: translation/extra_canonical/2_baruch/052/011.yaml
  text: But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and purity a crown,
translation:
  language: de
  text: Für die aber, die durch ihre Taten gerettet wurden und denen das Gesetz Hoffnung, die Einsicht Erwartung, die Weisheit Zuversicht und die Reinheit eine Krone war,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: gerettet wurden
  rationale: Das Ethpaal von ܦܨܐ bezeichnet hier das Gerettet- bzw. Befreitwerden; „gerettet“ passt zum eschatologischen Zusammenhang.
- source_word: ܒܥ̈ܒܕܝܗܘܢ
  choice: durch ihre Taten
  rationale: Die instrumentale Präposition wird ausdrücklich wiedergegeben; „Taten“ ist im heutigen Deutsch natürlicher als „Werke“, ohne die Aussage abzuschwächen.
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Bezeichnet in diesem jüdisch-apokalyptischen Zusammenhang das Gesetz als maßgebende göttliche Weisung.
- source_word: ܣܘܟܠܐ
  choice: die Einsicht
  rationale: Gibt den Sinn von Verstehen bzw. Einsicht in natürlichem Deutsch wieder.
- source_word: ܬܘܟܠܢܐ
  choice: Zuversicht
  rationale: Bezeichnet vertrauensvolle Sicherheit; „Zuversicht“ wahrt die parallele Reihe abstrakter Tugenden.
- source_word: ܕܟܝܘܬܐ / ܟܠܝܠܐ
  choice: die Reinheit / eine Krone
  rationale: Die kontrollierte Lesart der Schlusswendung wird entsprechend der jüngsten quellenbezogenen Korrektur als „Reinheit eine Krone“ wiedergegeben.
theological_decisions:
- issue: Rettung durch Taten
  choice: „durch ihre Taten gerettet wurden“
  alternative: „deren Taten sie retteten“ oder eine abschwächende Umschreibung
  rationale: Die im Text vorhandene instrumentale Aussage und ihre theologische Spannung werden nicht harmonisiert oder abgeschwächt.
- issue: Bild vom Gesetz und den Tugenden
  choice: Die nominale Parallelreihe bleibt erhalten.
  alternative: Ausdeutende Verben wie „Hoffnung schenkte“ oder „Zuversicht gab“
  rationale: Die knappe metaphorische Zuordnung des Ausgangstextes soll nicht interpretierend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als abhängiger, mit Komma endender Teilsatz stehen, weil Vers 11 syntaktisch in den folgenden Vers hineinführt. Die wiederholte Kopula „war“ wird nur am Ende gesetzt, damit die feierliche Parallelstruktur verständlich bleibt.
