  text: For the appearance of those who now act wickedly will become worse than it is now, as they suffer torment.
translation:
  language: de
  text: Denn das Aussehen derer, die jetzt Böses tun, wird schlimmer werden, als es jetzt ist, wenn sie Qual erleiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘ̈ܬܐ
  choice: Aussehen
  rationale: Das syrische Wort bezeichnet hier die äußere Gestalt bzw. Erscheinung; „Aussehen“ gibt den Zusammenhang mit ihrer sichtbaren Verwandlung natürlich wieder.
- source_word: ܒܝܫ
  choice: schlimmer
  rationale: Der Komparativ des Satzes verlangt eine wertende Verschlechterung des Aussehens, nicht lediglich eine äußerliche Veränderung.
- source_word: ܬܫܢܝܩܐ
  choice: Qual
  rationale: Das Wort bezeichnet Pein oder Folter; „Qual“ bewahrt den starken Sinn, ohne eine bestimmte Art der Bestrafung festzulegen.
theological_decisions:
- issue: Zeitliches oder begleitendes Verhältnis zwischen verändertem Aussehen und Qual
  choice: wenn sie Qual erleiden
  alternative: während sie Qual erleiden
  rationale: Die knappe syrische Fügung lässt das genaue Verhältnis offen. „Wenn“ wahrt den eschatologischen Zeitpunkt und behauptet nicht unnötig, dass die Veränderung ausschließlich während der Qual stattfindet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am syrischen Sinn und übernimmt die im Kontext erkennbare Gegenüberstellung zwischen gegenwärtigem und künftig verschlechtertem Aussehen.
