translation:
  language: de
  text: wenn sie sehen, dass diejenigen, die sie jetzt für nichts halten, Ruhe gefunden haben und mit den Engeln verherrlicht sind,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܬܢܝܚܝܢ
  choice: Ruhe gefunden haben
  rationale: Das syrische Ethpaal bezeichnet hier das Zur-Ruhe-Kommen beziehungsweise den Zustand der Ruhe; die Formulierung klingt im Deutschen natürlich und wahrt den eschatologischen Zusammenhang.
- source_word: ܡܫܬܒܚܝܢ
  choice: verherrlicht sind
  rationale: Die Passivform bezeichnet das Verherrlichtwerden, nicht lediglich menschliches Lob.
- source_word: ܥܡ ܡܢܝܘܗܝ
  choice: mit seinen himmlischen Heerscharen
  rationale: Wörtlich steht ein Ausdruck für seine Scharen beziehungsweise Heerscharen. Im Kontext sind damit himmlische Wesen gemeint; diese Wiedergabe bleibt näher am Syrischen als die bloße Auflösung zu „Engeln“.
- source_word: ܠܐ ܡܕܡ
  choice: für nichts
  rationale: Die idiomatische Wendung gibt die abwertende Einschätzung der Betrachter wieder, ohne sie zu „unbedeutend“ abzuschwächen.
theological_decisions:
- issue: Bezug des Possessivpronomens bei den himmlischen Heerscharen
  choice: seinen himmlischen Heerscharen
  alternative: den himmlischen Heerscharen
  rationale: Das Possessivsuffix wird beibehalten. Sein genauer Bezug wird nicht durch eine ausdrückliche Benennung Gottes oder einer anderen Gestalt festgelegt.
- issue: Art der endzeitlichen Erhöhung
  choice: verherrlicht sind
  alternative: geehrt werden
  rationale: Die stärkere, im Kontext eschatologische Bedeutung des syrischen Verbs bleibt erhalten, ohne die Art dieser Verherrlichung dogmatisch näher zu bestimmen.
translation_notes:
  register: Moderner, würdevoller Standardsatz. Die zeitliche Gegenüberstellung „jetzt“ und die scharfe Geringschätzung „für nichts halten“ bleiben erhalten. Das Partizipialgefüge des Syrischen wird zugunsten eines flüssigen deutschen Nebensatzes mit Perfekt wiedergegeben.
