  terminology: „Herrlichkeit“, „gerechtfertigt“ und „Wurzel der Weisheit“ sind angemessen und erhalten die bildhafte sowie theologisch offene Sprache. Die passive Form von „gerechtfertigt wurden“ soll beibehalten werden. Die Fußnote muss auf die tatsächlich übersetzte semantische Spannweite von ܫܘܒܠܐ bezogen werden, nicht auf „Einsicht“.
