  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: de
  text: Die Herrlichkeit aber derer, die zu ihrer Zeit gerechtfertigt wurden, die in ihrem Leben Führung hatten[a] und die in ihr Herz die Wurzel der Weisheit pflanzten —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort kann auch „Richtung“, „Weg“ oder „Lebensführung“ bedeuten.
    reason: ܫܘܒܠܐ hat ein Wortfeld von Führung, Richtung und Lebensweg/-führung. Die Fußnote dokumentiert diese Spannweite, ohne die nicht ausdrücklich bezeichnete Bedeutung „Einsicht“ in den Haupttext einzutragen.
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ
  choice: die Herrlichkeit … derer
  rationale: Das Substantiv bezeichnet hier die Herrlichkeit beziehungsweise Verherrlichung der genannten Menschen; „Herrlichkeit“ wahrt den Anschluss an den folgenden Kontext.
- source_word: ܐܙܕܩܘ
  choice: gerechtfertigt wurden
  rationale: Die passive Verbform wird beibehalten, ohne ausdrücklich festzulegen, wer rechtfertigt oder worin die Rechtfertigung besteht.
- source_word: ܫܘܒܠܐ
  choice: ihr Leben mit Einsicht führten
  rationale: Das Wortfeld umfasst Führung, Lebensführung und Orientierung. Die idiomatische Formulierung verbindet die im Syrischen anklingende Lebensführung mit der kontextuell passenden Einsicht, ohne beides gleichzusetzen.
- source_word: ܢܨܒܘ
  choice: pflanzten
  rationale: Die konkrete Metapher des Einpflanzens wird ebenso bewahrt wie ihr aktiver Charakter.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: die Wurzel der Weisheit
  rationale: Die syrische Genitivverbindung lässt sich formal und natürlich wiedergeben.
theological_decisions:
- issue: Bedeutung des passiven ܐܙܕܩܘ
  choice: gerechtfertigt wurden
  alternative: gerecht waren / sich als gerecht erwiesen
  rationale: Die passive Gestalt des Ausgangstextes wird nicht zu einer bloßen Eigenschaft oder Leistung der Menschen umgedeutet.
- issue: Verhältnis von Einsicht und Lebensführung bei ܫܘܒܠܐ
  choice: die ihr Leben mit Einsicht führten
  alternative: die in ihrem Leben Führung hatten / die in ihrem Leben Verständnis hatten
  rationale: Die Übersetzung wahrt sowohl die ethisch-praktische als auch die erkenntnisbezogene Nuance und vermeidet eine konfessionelle Zuspitzung.
translation_notes:
  register: Dignifizierter, moderner Satzbau. Der Gedankenstrich bleibt stehen, weil der Vers syntaktisch in den folgenden Vers übergeht. Die Reihung der drei Gruppen wird eng am Syrischen bewahrt.
