    rationale: Der syrische Ausdruck verweist auf Führung, Richtung, Weg oder Lebensführung. „Einsicht“ entspricht eher dem folgenden Weisheitskontext und der englischen Audit-Fassung als dem konkreten Lexem; dadurch wird die mittlere Reihung semantisch verschoben.
