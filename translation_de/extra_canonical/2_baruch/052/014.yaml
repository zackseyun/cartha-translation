translation:
  language: de
  text: Dann werden sie in einer Gestalt erscheinen, die die der Engel übertrifft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wird ihre Erscheinung die der Engel übertreffen.“ Der syrische Ausdruck kann „Gestalt“, „Erscheinung“ oder „Ähnlichkeit“ bedeuten.'
    reason: Die Bedeutungsbreite von ܕܡܘܬܐ und die elliptische Vergleichskonstruktion lassen sowohl eine konkrete Gestalt als auch die gesamte Erscheinung im Vergleich mit den Engeln erkennen.
lexical_decisions:
- source_word: ܡܬܚܙܝܐ
  choice: werden sie … erscheinen
  rationale: Das Verb bezeichnet ein Sichtbarwerden oder Erscheinen. Der deutsche Plural nimmt die im Zusammenhang gemeinten Gerechten wieder auf, obwohl die syrische Form grammatisch feminin singular ist und möglicherweise auf ihre Gestalt bezogen werden kann.
- source_word: ܒܕܡܘܬܐ
  choice: in einer Gestalt
  rationale: ܕܡܘܬܐ kann Gestalt, Erscheinungsform oder Ähnlichkeit bedeuten. „Gestalt“ bewahrt den Bezug auf die sichtbare Verwandlung, ohne die Aussage auf abstrakte Vortrefflichkeit zu verengen.
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: die selbst die der Engel übertrifft
  rationale: Die Vergleichsformel bedeutet „mehr als die der Engel“. „Übertrifft“ gibt den gesteigerten Vergleich idiomatisch wieder; „selbst“ hebt die überraschende Rangsteigerung hervor, ohne eine zusätzliche Lehraussage einzuführen.
theological_decisions:
- issue: Worin die Gerechten die Engel übertreffen
  choice: Der Vergleich wird auf ihre offenbar werdende Gestalt bezogen.
  alternative: „Dann wird die Herrlichkeit der Gerechten größer sein als die der Engel.“
  rationale: Der syrische Wortlaut spricht ausdrücklich von ܕܡܘܬܐ, „Gestalt/Ähnlichkeit“, und vom Erscheinen. Die abstraktere Wiedergabe „Herrlichkeit“ ist kontextuell möglich, würde den konkreten Bildgehalt jedoch abschwächen.
- issue: Ergänzung des Subjekts „die Gerechten“
  choice: Das Pronomen „sie“ greift die zuvor beschriebenen Geretteten beziehungsweise Gerechten auf.
  alternative: Eine ausdrückliche Wiederholung von „die Gerechten“
  rationale: Der unmittelbare Kontext liefert den Bezug; das Pronomen hält die Übersetzung knapp und vermeidet eine im Vers nicht ausdrücklich stehende Benennung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt bildhaft und verständlich und bewahrt die offene Frage, ob vor allem die sichtbare Gestalt oder allgemeiner die Herrlichkeit der Gerechten gemeint ist.
