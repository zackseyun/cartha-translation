  text: For the first will receive the last, whom they were expecting, and the last those they had heard had passed away.
translation:
  language: de
  text: Denn die Früheren werden die Späteren empfangen, auf die sie gewartet hatten, und die Späteren jene, von deren Dahinscheiden sie gehört hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von denen sie gehört hatten, dass sie dahingegangen waren“.'
    reason: Die alternative Form macht die dem syrischen Satzbau näherstehende Konstruktion sichtbar; der Bedeutungsunterschied ist gering.
lexical_decisions:
- source_word: ܩܕܡܝܐ / ܐܚܪ̈ܝܐ
  choice: die Früheren / die Späteren
  rationale: Die substantivierten zeitlichen Bezeichnungen geben den Gegensatz zwischen den zuerst und den später Verstorbenen wieder, ohne eine Rangordnung hineinzulesen.
- source_word: ܢܩܒܠܘܢ
  choice: werden … empfangen
  rationale: Das Verb bezeichnet hier das Willkommenheißen beziehungsweise Aufnehmen der jeweils anderen Gruppe.
- source_word: ܡܣܟܝܢ ܗܘܘ
  choice: auf die sie gewartet hatten
  rationale: Die durative Vergangenheitsform wird im Deutschen idiomatisch als Plusquamperfekt wiedergegeben.
- source_word: ܫܡܥܝܢ ܗܘܘ
  choice: von deren … sie gehört hatten
  rationale: Die Formulierung bewahrt den Bezug auf eine zuvor erhaltene Nachricht und vermeidet im Deutschen eine schwerfällige Satzkonstruktion.
theological_decisions:
- issue: Identität der beiden Gruppen
  choice: die Früheren / die Späteren
  alternative: die Ersten / die Letzten
  rationale: Im Auferstehungszusammenhang ist primär eine zeitliche Abfolge gemeint. Die Wiedergabe vermeidet, daraus ohne Textgrund eine Rangfolge oder ein festes eschatologisches Schema zu machen.
- issue: Bedeutung des elliptischen Ausdrucks über die später Verstorbenen
  choice: von deren Dahinscheiden sie gehört hatten
  alternative: von denen sie gehört hatten, dass sie dahingegangen waren
  rationale: Der syrische Wortlaut ist an dieser Stelle syntaktisch knapp beziehungsweise textlich schwierig. Die gewählte Fassung folgt dem Zusammenhang des gegenseitigen Wiedererkennens und Empfangens, ohne die Art des Todes näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dahinscheiden“ ist hier bewusst etwas gehobener, aber allgemein verständlich und passt zum eschatologischen Zusammenhang; die Satzparallelität des Syrischen bleibt erhalten.
