  yaml_path: translation/extra_canonical/2_baruch/052/007.yaml
  text: then their splendor will be glorified in transformations, and the form of their faces will be changed into the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.
translation:
  language: de
  text: Dann wird ihre Herrlichkeit in Verwandlungen verherrlicht, und die Gestalt ihrer Gesichter wird im Licht ihrer Herrlichkeit aufleuchten, damit sie die unvergängliche Welt erlangen und empfangen, die ihnen verheißen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܒܚܗܘܢ / ܫܘܒ̈ܚܐ
  choice: ihr Glanz
  rationale: Gibt das Bedeutungsfeld von Herrlichkeit, Pracht und Glanz im Zusammenhang mit der verwandelten Erscheinung natürlich wieder.
- source_word: ܫܘܚܠܦ̈ܐ
  choice: Verwandlungen
  rationale: Bewahrt den Plural und den Gedanken mehrfacher beziehungsweise umfassender Veränderung, ohne deren genaue Art festzulegen.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: die unvergängliche Welt
  rationale: Natürliches Deutsch für wörtlich „die Welt, die nicht stirbt“; bezeichnet eine Welt, die dem Tod nicht unterliegt.
- source_word: ܢܣܒܘܢ ܘܢܩܒܠܘܢ
  choice: erlangen und empfangen
  rationale: Erhält die beiden koordinierten Verben und vermeidet, sie zu einem einzigen Vorgang zusammenzuziehen.
theological_decisions:
- issue: Art der endzeitlichen Verwandlung
  choice: Die körperlich sichtbare Verwandlung wird ausgesagt, ihr genauer metaphysischer Charakter bleibt offen.
  alternative: Die Aussage ausdrücklich als Vergöttlichung oder als bloß symbolische Ehrenbekundung deuten.
  rationale: Der Text beschreibt Glanz, Gesichtsgestalt und Licht, bestimmt aber nicht systematisch, wie diese Verwandlung ontologisch zu verstehen ist.
- issue: Bedeutung der unvergänglichen Welt
  choice: „die unvergängliche Welt“
  alternative: „das ewige Leben“ oder „der Himmel“
  rationale: Die konkrete Rede von der Welt wird bewahrt und nicht durch eine konfessionell oder systematisch stärker festgelegte Bezeichnung ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glanz“ und „unvergängliche Welt“ sind allgemein verständlich; die parallelen Verben und die Spannung zwischen gegenwärtiger Gestalt und künftiger Verwandlung bleiben erhalten.
