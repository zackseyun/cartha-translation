  yaml_path: translation/extra_canonical/2_baruch/052/010.yaml
  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: de
  text: Während sie selbst zu den Anhäufungen von Sünden gerechnet werden, verfallen ihre bösen Gestalten noch mehr.[a] Denn zuerst sehen sie; danach gehen sie fort, um gequält zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der syrische Wortlaut dieses Satzteils ist schwierig. Möglich ist auch, ihn im Sinn von „das Böse an ihren Gestalten verschlimmert sich noch mehr“ zu verstehen.
    reason: Die Anmerkung kennzeichnet die lexikalisch und syntaktisch unsichere Beschreibung der weiteren Veränderung ihrer Gestalten, ohne die Deutung auf bestimmte körperliche oder metaphysische Vorstellungen festzulegen.
lexical_decisions:
- source_word: ܡܬܚܫܒܝܢ
  choice: werden … gerechnet
  rationale: Gibt das passive „gerechnet/gezählt werden“ formal und idiomatisch wieder.
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: Anhäufungen von Sünden
  rationale: Bewahrt das konkrete Sammelbild des syrischen Ausdrucks, ohne es zu einer abstrakten Sündenschuld umzudeuten.
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: die Bosheit ihrer Gestalten
  rationale: Hält sowohl den moralisch negativen Ausdruck „Bosheit“ als auch den mehrdeutigen Begriff für Gestalten/Erscheinungsformen fest.
- source_word: ܕܢܫܬܢܩܘܢ
  choice: um gequält zu werden
  rationale: Gibt die finale Konstruktion und die passive Bedeutung direkt wieder.
theological_decisions:
- issue: Verhältnis von Sehen und anschließender Qual
  choice: „zuerst sehen sie; danach gehen sie fort, um gequält zu werden“
  alternative: Das Gesehene ausdrücklich als Herrlichkeit der Gerechten bestimmen
  rationale: Der Vers selbst nennt das Objekt des Sehens nicht; die Übersetzung bewahrt diese Offenheit und fügt keine eschatologische Deutung ein.
- issue: Deutung der „Gestalten“
  choice: Gestalten
  alternative: Leiber oder Erscheinung
  rationale: Der syrische Ausdruck kann Erscheinungsformen bzw. Gestalten bezeichnen; „Gestalten“ vermeidet eine unnötige Festlegung auf ausschließlich körperliche Leiber.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge des Ausgangstextes und seine eschatologische Spannung bleiben erhalten; die schwer verständliche Bildsprache wird nicht harmonisiert.
