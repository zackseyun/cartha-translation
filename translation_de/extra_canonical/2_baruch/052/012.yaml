base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: de
  text: Zu ihrer Zeit werden ihnen Wunder erscheinen. Denn sie werden jene Welt sehen, die ihnen jetzt unsichtbar ist, und jene Zeit, die ihnen jetzt verborgen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܡܝ̈ܗܬܐ
  choice: Wunder
  rationale: Das syrische Substantiv bezeichnet erstaunliche oder wunderbare Dinge; „Wunder“ ist hier prägnant und dem eschatologischen Zusammenhang angemessen.
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ
  choice: werden ihnen … erscheinen
  rationale: Die passive Form bedeutet wörtlich, dass die Wunder ihnen sichtbar werden; „erscheinen“ gibt dies in natürlichem Deutsch wieder, ohne ihren Urheber näher zu bestimmen.
- source_word: ܗ̇ܘ ܥܠܡܐ
  choice: jene Welt
  rationale: Das Demonstrativpronomen hebt die künftige, gegenwärtig unsichtbare Welt hervor; „jene“ bewahrt diesen Kontrast.
- source_word: ܕܠܐ ܡܬܚܙܐ ܠܗܘܢ
  choice: die ihnen jetzt unsichtbar ist
  rationale: Die Formulierung beschreibt, dass diese Welt ihnen gegenwärtig nicht sichtbar ist. „Jetzt“ verdeutlicht den im Kontext gesetzten Gegensatz zur künftigen Schau.
- source_word: ܙܒܢܐ
  choice: Zeit
  rationale: Die Grundbedeutung „Zeit“ wird beibehalten; eine speziellere Deutung als Zeitalter oder Zeitpunkt wird nicht erzwungen.
theological_decisions:
- issue: Verhältnis der gegenwärtigen zur künftigen Welt
  choice: „jene Welt … die ihnen jetzt unsichtbar ist“
  alternative: „die kommende Welt“
  rationale: Die Übersetzung wahrt die Aussage des syrischen Textes über gegenwärtige Unsichtbarkeit, ohne ausdrücklich eine dogmatische Terminologie wie „kommende Welt“ einzuführen.
- issue: Die verborgene Zeit
  choice: „jene Zeit, die ihnen jetzt verborgen ist“
  alternative: „das Zeitalter, das ihnen verborgen ist“
  rationale: „Zeit“ bewahrt die lexikalische Offenheit und legt nicht fest, ob ein Zeitpunkt, eine Epoche oder der eschatologische Zustand gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte demonstrative Struktur „jene Welt … jene Zeit“ bildet die Parallelität des Syrischen ab; unnötige konfessionelle Fachsprache wird vermieden.
