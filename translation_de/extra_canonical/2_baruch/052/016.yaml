  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: de
  text: Denn sie sind aus dieser Welt der Bedrängnis befreit worden und haben die Last der Nöte abgelegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: sind … befreit worden
  rationale: Das syrische Ethpaal/Passiv bezeichnet eine erfahrene Befreiung oder Rettung; „befreit worden“ bewahrt die passive Aussage, ohne den unausgesprochenen Handelnden festzulegen.
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ
  choice: Welt der Bedrängnis
  rationale: Die Genitivverbindung wird eng und würdig wiedergegeben; „Bedrängnis“ umfasst Druck, Not und Trübsal.
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ
  choice: haben … abgelegt
  rationale: Wörtlich liegt der Gedanke des Ruhenlassens beziehungsweise Entfernens von sich vor; in Verbindung mit einer Last ist „abgelegt“ natürlich und bildtreu.
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ
  choice: die Last der Nöte
  rationale: „Last“ erhält die konkrete Metapher; der Plural „Nöte“ wahrt die Mehrzahl des syrischen Ausdrucks.
theological_decisions:
- issue: Urheber der Befreiung
  choice: Passivform ohne ausdrückliches Subjekt
  alternative: Gott hat sie befreit
  rationale: Der syrische Text nennt den Handelnden nicht. Die Übersetzung vermeidet daher eine theologisch plausible, aber nicht ausdrücklich vorhandene Ergänzung.
- issue: Art der Befreiung
  choice: „befreit“ statt eindeutig „gestorben“ oder „gerettet“
  alternative: „aus dieser Welt erlöst“
  rationale: Der Kontext betrifft das Verlassen der leidvollen Welt, doch das Verb selbst lässt eine breitere Befreiungs- beziehungsweise Rettungsbedeutung zu. „Befreit“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Bildsprache von bedrängender Welt und abgelegter Last bleibt erhalten.
