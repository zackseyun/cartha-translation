  yaml_path: translation/extra_canonical/2_baruch/052/003.yaml
  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn diejenigen, die sich jetzt kennen, einander erkennen, dann wird das Aussehen derer, die jetzt verurteilt sind, noch schrecklicher werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ … ܕܗܫܐ ܝܕܥܝܢ
  choice: einander erkennen … die sich jetzt kennen
  rationale: Die Wiederholung des syrischen Erkenntniswortfeldes bleibt erhalten; „sich kennen“ ist im Deutschen für die gegenwärtige Beziehung idiomatischer, während „einander erkennen“ den künftigen Vorgang wiedergibt.
- source_word: ܚܙܘܗ
  choice: das Aussehen
  rationale: Das Wort bezeichnet hier die sichtbare Erscheinung oder Gestalt; „Aussehen“ ist natürlich und lässt den konkreten visuellen Sinn bestehen.
- source_word: ܐܝܠܝܢ ܕܡܩܕܡܝܢ ܐܡܝܢ
  choice: derer, die jetzt verurteilt sind
  rationale: Die Formulierung folgt der durch den geprüften Kapitelkontext gestützten Deutung der schwer überlieferten beziehungsweise schwer lesbaren syrischen Wendung.
theological_decisions:
- issue: Zeitpunkt und Wirkung des gegenseitigen Erkennens bei der Auferstehung
  choice: Das gegenseitige Erkennen wird als zukünftiges Geschehen wiedergegeben, auf das die schrecklichere Erscheinung der Verurteilten folgt.
  alternative: Das Erkennen ausdrücklich als Wiedererkennen nach dem Tod auszulegen.
  rationale: „Wiedererkennen“ wäre zwar kontextuell möglich, fügte aber eine im Wortlaut nicht ausdrücklich markierte Nuance hinzu; die Übersetzung bewahrt die zurückhaltendere Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Einleitung „Und es wird geschehen“ wahrt den apokalyptischen Erzählton; der übrige Satz bleibt für heutige Leser klar und natürlich.
