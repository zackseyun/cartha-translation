  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: de
  text: 'Als ich betete und die ersten Worte dieses Gebets sprach, wurde ich aufgewühlt und begann zu zittern. Ich dachte über die Nachkommen der Menschen nach: Wie viele sind schon dahingegangen, und wie wenige werden bewahrt! Während ich darüber nachdachte, hörte ich eine Stimme zu mir sagen:


    »Menschensohn, warum bist du so verstört, und warum fürchtest du dich? Schon bevor du geformt wurdest, warst du mir bekannt, und bevor du aus dem Leib deiner Mutter hervorgingst, warst du mir bekannt. Darum wurden dir die künftigen Dinge gezeigt.«[a]


    Ich sagte zu ihm: »Herr, du hast mir die Fülle der Zeiten und alles gezeigt, was in ihnen geschehen ist; aber du hast mir nicht gezeigt, wie lange es dauern wird.[b] Darum bitte ich darum, über diejenigen zu hören, die für die Gerechtigkeit Zeugnis abgelegt haben: Welcher Lohn wird für sie bewahrt?« Darauf wurde mir eine Fülle kommender guter und böser Dinge verheißen, und dann stieg ich auf den Berg.


    Nach sieben Tagen kam ich an jene Stelle, an der sich eine Quelle befand. Als ich dort saß, wurde ich auf dem Wagen einer Wolke emporgehoben[c] – nicht im Körper; wie es geschah, wusste ich nicht. Ein Geheimnis wurde mir gezeigt, und ich hörte eine Stimme zu mir sagen: »Sieh und erkenne, wie in dieser Welt die Taten und Mühen derer bewahrt werden, die gut gehandelt haben, und derer, die böse gehandelt haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Darum habe ich dir diese künftigen Dinge gezeigt.«'
    reason: Die syrische Verbform kann im Deutschen entweder passiv oder mit Gott als ausdrücklich genanntem Handelnden wiedergegeben werden.
  - marker: b
    text: 'Wörtlich: »von welchem bis zu welchem [Zeitpunkt]«.'
    reason: Die syrische Zeitspanne wird im Haupttext idiomatisch mit „wie lange“ wiedergegeben.
  - marker: c
    text: 'Oder: »Als ich dort auf dem Wagen einer Wolke saß, wurde ich emporgehoben.«'
    reason: Die syntaktische Zuordnung der Ortsangabe zum Sitzen oder zum Emporgehobenwerden ist nicht völlig eindeutig.
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: die Nachkommen der Menschen
  rationale: Die wörtliche Metapher „Same der Menschen“ bezeichnet kollektiv die menschliche Nachkommenschaft; „Nachkommen“ ist im heutigen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: ܡܬܕܘܕ
  choice: verstört
  rationale: Gibt die innere Unruhe wieder und lässt sich deutlich vom folgenden Ausdruck der Furcht unterscheiden.
- source_word: ܡܬܪܗܒ
  choice: sich fürchten
  rationale: Entspricht dem Grundsinn des Verbs, ohne die Stärke unnötig zu „erschrocken“ oder „entsetzt“ zu steigern.
- source_word: ܬܬܒܪܐ
  choice: geformt wurdest
  rationale: Das Verb bezeichnet das Gebildetwerden und passt zum anschließenden Hinweis auf den Mutterleib; „geformt“ vermeidet weitergehende metaphysische Festlegungen.
- source_word: ܝܕܝܥ ܗܘܝܬ ܠܝ / ܐܬܝܕܥܬ ܠܝ
  choice: warst du mir bekannt / erkannte ich dich
  rationale: Beide Ausdrücke betreffen Erkennen beziehungsweise Bekanntsein. Die leicht unterschiedliche deutsche Formulierung spiegelt den Wechsel der syrischen Verbform, ohne den zweiten Ausdruck unbegründet als „verheißen“ wiederzugeben.
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: wie lange es dauern wird
  rationale: Die idiomatische Wendung fragt im Zusammenhang nach der zeitlichen Erstreckung („von welchem bis zu welchem [Zeitpunkt]“); die deutsche Wiedergabe macht diesen Sinn verständlich.
- source_word: ܬܘܪܨܐ
  choice: Gerechtigkeit
  rationale: Im schwierigen Zusammenhang des Zeugnisses bezeichnet der Ausdruck eine rechte Ordnung oder Ausrichtung. „Gerechtigkeit“ folgt der kontextuellen Deutung der konsultierten Fassung, ohne eine bestimmte Bekenntnistradition einzutragen.
- source_word: ܐܫܬܘܕܝܘ
  choice: wurde mir … verheißen
  rationale: Bewahrt den Sinn des Zusagens oder Verheißens auch bei der auffälligen Verbindung mit kommenden guten und bösen Dingen, statt diese Spannung stillschweigend aufzulösen.
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: Wagen einer Wolke
  rationale: Erhält das apokalyptische Bild wörtlich und verständlich.
- source_word: ܐܬܢܣܒܬ
  choice: wurde … emporgehoben
  rationale: Passt zur visionären Entrückung, ohne eine dauerhafte leibliche Aufnahme zu behaupten.
- source_word: ܪܐܙܐ
  choice: Geheimnis
  rationale: Bezeichnet ein offenbartes göttliches Geheimnis; das deutsche Wort wahrt den apokalyptischen Ton.
theological_decisions:
- issue: Göttliches Vorherwissen vor Geburt und Formung
  choice: Als persönliches Bekanntsein und Erkennen wiedergegeben
  alternative: Als ausdrückliche Erwählungs- oder Berufungsformel deuten
  rationale: Der Wortlaut erinnert an prophetische Berufungssprache, formuliert aber unmittelbar nur göttliches Erkennen. Die Übersetzung lässt die intertextuelle und theologische Tragweite offen.
- issue: Art der Erhebung Baruchs
  choice: Visionäre Erhebung mit ausdrücklicher Verneinung körperlicher Mitnahme
  alternative: Leibliche Entrückung oder rein innerer Traum
  rationale: Der syrische Text verneint die Körperlichkeit und bekennt zugleich Unwissen über den Vorgang; beides wird ohne systematische Auflösung bewahrt.
- issue: Bewahrung von Taten und Mühen
  choice: „bewahrt“ ohne nähere Bestimmung
  alternative: Als himmlische Aufzeichnung oder ausschließlich endzeitliche Vergeltung präzisieren
  rationale: Das Verb erlaubt die Vorstellung des Aufbewahrens für eine spätere Beurteilung, legt deren Zeitpunkt und Art jedoch nicht ausdrücklich fest.
- issue: Viele sind gegangen, wenige werden bewahrt
  choice: Offene Aussage im Rahmen der Klage über die Menschheit
  alternative: Numerische Lehre über wenige Gerettete und viele Verlorene
  rationale: Die Übersetzung erhält den Gegensatz, macht daraus aber keine ausdrücklich soteriologische Statistik.
- issue: Verheißung guter und böser kommender Dinge
  choice: Die auffällige Formulierung „verheißen“ bleibt stehen
  alternative: Neutralisierend „angekündigt“ oder „offenbart“
  rationale: So bleibt die lexikalische und theologische Spannung des syrischen Verbs mit seinem gemischten Gegenstand sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch-apokalyptischem Ton. Archaismen wurden vermieden; „Menschensohn“, „verheißen“ und „Geheimnis“ bleiben wegen ihres Quellregisters erhalten. Wiederholungen und theologische Offenheiten wurden nicht durch konfessionelle Deutungen geglättet.
