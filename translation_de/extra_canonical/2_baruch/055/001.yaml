    issue: „erkannte ich dich“ für ܐܬܝܕܥܬ ܠܝ
    rationale: Die syrische Form ist passiv/reflexiv mit Dativ („du warst/wurdest mir bekannt“), nicht eine aktive Form „ich erkannte dich“. Die aktive deutsche Wiedergabe kann eine zeitlich eintretende Erkenntnis nahelegen und schwächt die formale Parallelität zur vorangehenden Aussage.
  - severity: low
    issue: „nicht mit dem Körper“
    rationale: ܠܐ ܟܕ ܒܦܓܪܐ bedeutet am besten „nicht im Körper“ bzw. „nicht leiblich“. „Mit dem Körper“ ist im Deutschen weniger quellnah und kann eine bloße Begleitmodalität ausdrücken.
  revised_text: 'Als ich betete und die ersten Worte dieses Gebets sprach, wurde ich aufgewühlt und begann zu zittern. Ich dachte über die Nachkommen der Menschen nach: Wie viele sind schon dahingegangen, und wie wenige werden bewahrt! Während ich darüber nachdachte, hörte ich eine Stimme zu mir sagen:


    »Menschensohn, warum bist du so verstört, und warum fürchtest du dich? Schon bevor du geformt wurdest, warst du mir bekannt, und bevor du aus dem Leib deiner Mutter hervorgingst, warst du mir bekannt. Darum wurden dir die künftigen Dinge gezeigt.«[a]


    Ich sagte zu ihm: »Herr, du hast mir die Fülle der Zeiten und alles gezeigt, was in ihnen geschehen ist; aber du hast mir nicht gezeigt, wie lange es dauern wird.[b] Darum bitte ich darum, über diejenigen zu hören, die für die Gerechtigkeit Zeugnis abgelegt haben: Welcher Lohn wird für sie bewahrt?« Darauf wurde mir eine Fülle kommender guter und böser Dinge verheißen, und dann stieg ich auf den Berg.


    Nach sieben Tagen kam ich an jene Stelle, an der sich eine Quelle befand. Als ich dort saß, wurde ich auf dem Wagen einer Wolke emporgehoben[c] – nicht im Körper; wie es geschah, wusste ich nicht. Ein Geheimnis wurde mir gezeigt, und ich hörte eine Stimme zu mir sagen: »Sieh und erkenne, wie in dieser Welt die Taten und Mühen derer bewahrt werden, die gut gehandelt haben, und derer, die böse gehandelt haben.«'
  revised_footnotes:
  - marker: a
    text: 'Oder: »Darum habe ich dir diese künftigen Dinge gezeigt.«'
    reason: Die syrische Verbform kann im Deutschen entweder passiv oder mit Gott als ausdrücklich genanntem Handelnden wiedergegeben werden.
  - marker: b
    text: 'Wörtlich: »von welchem bis zu welchem [Zeitpunkt]«.'
    reason: Die syrische Zeitspanne wird im Haupttext idiomatisch mit „wie lange“ wiedergegeben.
  - marker: c
    text: 'Oder: »Als ich dort auf dem Wagen einer Wolke saß, wurde ich emporgehoben.«'
    reason: Die syntaktische Zuordnung der Ortsangabe zum Sitzen oder zum Emporgehobenwerden ist nicht völlig eindeutig.
  revision_rationale: Die Revision beschränkt sich auf zwei sichere, quellbezogene Korrekturen. Sie bewahrt die Wiederholung der syrischen Aussage des Bekanntseins vor Geburt, ohne daraus eine besondere dogmatische Aussage abzuleiten, und gibt die Verneinung der leiblichen Erhebung genauer wieder. Alle vorhandenen Fußnoten bleiben am passenden Anker erhalten.
