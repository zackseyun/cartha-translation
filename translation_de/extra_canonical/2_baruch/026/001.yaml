  yaml_path: translation/extra_canonical/2_baruch/026/001.yaml
  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: de
  text: 'Und ich antwortete ihm: »Wird jene kommende Bedrängnis lange andauern, und wird diese Not viele Jahre umfassen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Bedrängnis«; der Wortlaut der zweiten Satzhälfte ist in der syrischen Überlieferung an dieser Stelle unsicher.'
    reason: Der demonstrative Bezug und insbesondere der Seitenabdruck am Kapitelrand sind textkritisch nicht völlig sicher.
lexical_decisions:
- source_word: ܘܥܢܝܬ ܘܐܡܪܬ ܠܝܗ
  choice: Und ich antwortete ihm
  rationale: Die natürliche deutsche Wiedergabe bündelt die semitische Formel »ich antwortete und sagte zu ihm«, ohne ihren Aussagegehalt zu verändern.
- source_word: ܐܘܠܨܢܐ ܗܘ ܕܐܬܝ
  choice: jene kommende Bedrängnis
  rationale: ܐܘܠܨܢܐ bezeichnet Druck, Drangsal oder Bedrängnis; »Bedrängnis« wahrt den ernsten apokalyptischen Ton. ܗܘ ist ein fernweisendes Demonstrativ, und ܕܐܬܝ bezeichnet das Kommende.
- source_word: ܡܐ ܣܓܝܐܐ ܡܣܘܟ
  choice: lange andauern
  rationale: Die schwierige Formulierung fragt offenbar nach der zeitlichen Ausdehnung; die idiomatische Wiedergabe vermeidet eine überpräzise Rekonstruktion des instabil überlieferten Wortlauts.
- source_word: ܫܢ̈ܝܐ ܣܓܝ̈ܐܬܐ (textkritisch erschlossen)
  choice: viele Jahre
  rationale: Der Seitenabdruck ist an dieser Stelle fehlerhaft beziehungsweise unsicher, doch der Zusammenhang und die kontrollierte Textüberlieferung stützen eine Frage nach »vielen Jahren«.
theological_decisions:
- issue: Verhältnis von »Bedrängnis« und »Not«
  choice: Zwei verwandte, aber nicht völlig gleichgesetzte Begriffe beibehalten
  alternative: Beide Satzhälften mit »Bedrängnis« wiedergeben
  rationale: Die Überlieferung lässt eine zweite Bezeichnung für dieselbe endzeitliche Notlage erkennen. Die Variation wahrt die mögliche begriffliche Spannung, ohne zwei sicher getrennte Ereignisse zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitische Redeeinleitung wurde leicht gestrafft; die beiden Zukunftsfragen und die apokalyptische Ernsthaftigkeit bleiben erhalten.
