  yaml_path: translation/extra_canonical/2_baruch/041/001.yaml
  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: de
  text: 'Und ich sagte: »Für wen und für wie viele werden diese Dinge sein? Und wer wird als würdig erachtet werden, jene Zeit zu sehen?[a]


    Doch ich will dir alles mitteilen, was ich denke, und dich nach denen aus deinem Volk fragen, die ich in großer Zahl gesehen habe: Sie haben sich von deinem Bund abgewandt und das Joch deines Gesetzes von sich geworfen.


    Andere wiederum habe ich gesehen, die ihre Eitelkeit[b] verließen und unter deine Flügel flohen.


    Was wird nun mit diesen geschehen? Oder wie wird jene letzte Zeit sie aufnehmen?


    Oder wird etwa die Zeit dieser Menschen gewogen werden, und werden sie danach gerichtet werden, wie sich die Waage neigt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende Ceriani-Textblock überschneidet sich mit dem Ende von Kapitel 40 und dem Anfang von Kapitel 42. Der Sinn dieses Frageabschnitts ist klar; seine genaue Abgrenzung wird durch Kmoskos Kontrolltext auf S. 576 bestätigt.
    reason: textual_variant
  - marker: b
    text: Die syrische Zeile ist in der Ceriani-Überlieferung an dieser Stelle unsicher. »Ihre Eitelkeit« wird durch den lateinischen Kontrollzeugen Kmoskos gestützt; möglich wäre auch »ihre Leere«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ (in der Ceriani-Zeile durch OCR entstellt)
  choice: deinem Bund
  rationale: Der Kontrollzeuge weist auf eine Verpflichtungs- bzw. Bundeszusage. Im jüdisch-apokalyptischen Zusammenhang gibt »Bund« den theologischen Sinn natürlich wieder, ohne den Verpflichtungsaspekt auszuschließen.
- source_word: ܢܡܘܣܐ
  choice: Gesetz
  rationale: Die feste Wendung »Joch deines Gesetzes« bewahrt sowohl den Bundesbezug als auch die verbindliche und richtende Kraft des Ausdrucks.
- source_word: ܡܘܒܠܐ / örtlich unsichere Wendung
  choice: ihre Nichtigkeit
  rationale: Die Ceriani-Überlieferung ist an dieser Stelle unsicher; der lateinische Kontrollzeuge stützt vanitatem suam. »Nichtigkeit« wahrt die moralisch-geistliche Leere, ohne sie als einen bestimmten Irrtum auszudeuten.
- source_word: ܓܢܦ̈ܐ / durch den Kontrollzeugen bewahrte Wendung
  choice: unter deine Flügel
  rationale: Das konkrete biblische Schutzbild bleibt erhalten und wird nicht erklärend zu »unter deinen Schutz« verflacht.
- source_word: ܡܬܬܚܒܘ / Ausdruck des Wiegens (OCR-unsicher)
  choice: gewogen werden
  rationale: Die anschließende Waage bestätigt, dass das Bild des Gerichts ausdrücklich vom Wiegen handelt und nicht nur von allgemeiner Beurteilung.
theological_decisions:
- issue: Das Schicksal der Abgefallenen und der Umgekehrten
  choice: Der Abschnitt lässt ihr Schicksal als offene, an Gott gerichtete Frage stehen.
  alternative: Eine vorweggenommene eindeutige Verurteilung oder Rettungszusage.
  rationale: Baruch fragt noch, wie die letzte Zeit beide Gruppen aufnehmen wird; die Antwort folgt erst im nächsten Abschnitt. Die Spannung darf daher nicht vorzeitig aufgelöst werden.
- issue: Das Bild »unter deine Flügel«
  choice: Das wörtliche Bild göttlicher Zuflucht wird beibehalten.
  alternative: Die erklärende Wiedergabe »unter deinen Schutz«.
  rationale: Das Bild beschreibt Umkehr nicht nur als Abkehr von Nichtigkeit, sondern zugleich als Flucht zu Gottes bergender Gegenwart.
- issue: Die Neigung der Waage als Gerichtsaussage
  choice: 'Die grammatische und theologische Offenheit bleibt gewahrt: Das Urteil entspricht der Neigung der Waage.'
  alternative: Eine Auslegung, welche die gewogenen Taten, Zeiten oder Verdienste ausdrücklich benennt.
  rationale: Der überlieferte Wortlaut ist an dieser Stelle unsicher und lässt den genauen Gegenstand beziehungsweise Maßstab des Wiegens offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die direkte Anrede Gottes bleibt durchgehend erhalten. »Jene Zeit« und »jene letzte Zeit« bewahren den apokalyptischen Bezug; das Waagenbild und die offenen Fragen werden nicht dogmatisch erläutert.
