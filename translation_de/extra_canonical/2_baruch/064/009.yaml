  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: de
  text: Nicht weil er untadelig gelebt hätte – denn er war es nicht wert –, sondern damit er von da an wüsste, von wem er schließlich bestraft werden würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܐ
  choice: nicht
  rationale: Bewahrt die verneinende Begründung des syrischen Satzes.
- source_word: ܒܣܝܡܐ
  choice: untadelig
  rationale: Gibt in diesem moralischen Zusammenhang die Vorstellung eines guten beziehungsweise schuldlosen Lebens idiomatisch wieder, ohne Vollkommenheit ausdrücklich zu behaupten.
- source_word: ܢܫܡܥܘܢ / Strafkontext im überlieferten Textzusammenhang
  choice: bestraft werden würde
  rationale: Der Zusammenhang zielt auf eine ihm künftig widerfahrende Vergeltung; die passive Form wahrt, dass der Handelnde erst durch „von wem“ bestimmt wird.
theological_decisions:
- issue: Grund und Zweck der gewährten Erkenntnis
  choice: Die Bewahrung beziehungsweise Offenbarung geschieht ausdrücklich nicht aufgrund eines untadeligen Lebens, sondern zur Erkenntnis des künftigen Strafenden.
  alternative: Den Satz als nachträgliche Bekehrung oder als Beweis göttlicher Anerkennung deuten.
  rationale: Die adversative Konstruktion stellt Unwürdigkeit und Zweck gegeneinander; weitergehende Aussagen über Bekehrung oder Erwählung wären interpretierende Zusätze.
- issue: Endgültigkeit der Strafe
  choice: „schließlich“
  alternative: „für immer“ oder „am Ende der Zeit“
  rationale: „Schließlich“ hält den zeitlichen Zielpunkt offen und vermeidet eine nicht ausdrücklich belegte Aussage über Dauer oder Eschatologie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Konjunktiv „gelebt hätte“ entspricht der zurückgewiesenen Begründung; die Gedankenstriche machen den eingeschobenen Unwürdigkeitssatz klar lesbar.
