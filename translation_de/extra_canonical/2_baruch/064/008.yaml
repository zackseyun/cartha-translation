  - marker: a
    text: 'Oder: „vorübergehend“.'
    reason: Die syrische Zeitangabe ist idiomatisch und kann die begrenzte Dauer besonders hervorheben.
lexical_decisions:
- source_word: ܒܥܘܬܗ
  choice: sein Gebet
  rationale: Das syrische Substantiv bezeichnet hier seine Bitte beziehungsweise sein Gebet; im Kontext ist „Gebet“ die natürliche deutsche Wiedergabe.
- source_word: ܡܪܝܡܐ
  choice: der Höchste
  rationale: Bewahrt den traditionellen Gottesnamen beziehungsweise Hoheitstitel des syrischen Textes.
- source_word: ܠܫܥܬܐ
  choice: für den Augenblick
  rationale: Die idiomatische Wendung bedeutet hier „vorübergehend“ oder „für den Augenblick“ und bezeichnet keine Aussage über eine bestimmte Stunde.
- source_word: ܢܚܫܐ
  choice: bronzen
  rationale: Gibt das Metall als Bronze beziehungsweise Kupfer wieder; „bronzen“ passt natürlich zur Bezeichnung des Pferdes als Foltergerät.
theological_decisions:
- issue: Verhältnis zwischen erhörtem Gebet und endgültigem Geschick
  choice: „obwohl … erhört wurde … doch nur für den Augenblick“
  alternative: Die Erhörung als uneingeschränkte oder endgültige Rettung formulieren
  rationale: 'Die adversative und zeitlich begrenzende Aussage des Textes bleibt erhalten: Das Gebet wird erhört, doch das Zeichen beziehungsweise die Hilfe gilt nur vorläufig.'
translation_notes:
  register: Moderne, würdige Standardsprache. Die auffällige Wiederholung „das bronzene Pferd“ wurde beibehalten, da sie den Vorgang klar beschreibt und wahrscheinlich die Wiederholung der Vorlage widerspiegelt.
