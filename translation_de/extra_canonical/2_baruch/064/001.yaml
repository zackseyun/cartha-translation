  text: And the ninth black waters that you saw—this is all the wickedness that was in the days of Manasseh son of Hezekiah.
translation:
  language: de
  text: Und die neunten schwarzen Wasser, die du gesehen hast – das ist die ganze Bosheit, die es in den Tagen Manasses, des Sohnes Hiskias, gab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܫ̈ܟܐ
  choice: schwarzen Wasser
  rationale: Die apokalyptische Bildfolge unterscheidet ausdrücklich zwischen hellen und schwarzen Wassern; daher bleibt die Farbbezeichnung erhalten und wird nicht zum allgemeineren „dunkel“ abgeschwächt.
- source_word: ܚܒܠܐ
  choice: Bosheit
  rationale: Im Zusammenhang bezeichnet das Wort vor allem Manasses sittlich-religiöses Unrecht und nicht lediglich dessen zerstörerische Folgen.
- source_word: ܟܠܗ
  choice: all die
  rationale: Die ausdrückliche Totalitätsangabe des Syrischen wird wiedergegeben und nicht ausgelassen.
- source_word: ܗܢܘ
  choice: das ist
  rationale: Die singularische demonstrative Erklärung des Syrischen wird trotz des pluralischen Bildworts „Wasser“ bewahrt.
theological_decisions:
- issue: Bezug der schwarzen Wasser auf Manasses Zeit
  choice: Die Wasser stehen für die gesamte Bosheit jener Zeit.
  alternative: Die Wasser stehen lediglich für deren zerstörerische Folgen.
  rationale: Der erklärende Zusammenhang entfaltet das moralische Unrecht unter Manasse; deshalb bezeichnet die Aussage die Bosheit selbst, ohne ihre Folgen auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet die Deutung des zuvor genannten Visionsbildes; die genealogische Bezeichnung bleibt klar und ungekürzt.
