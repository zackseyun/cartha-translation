  - severity: medium
    issue: Die Fußnote bietet keine tragfähige deutsche Alternative.
    rationale: „sie sind all die Bosheit“ ist kein natürliches Standarddeutsch und erklärt keine tatsächliche textkritische Mehrdeutigkeit. Die Singularform des Haupttexts kann ohne Fußnote stehen.
