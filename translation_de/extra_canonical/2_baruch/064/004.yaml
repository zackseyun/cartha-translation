  text: Then wrath went out from before the Mighty One, that Zion should be uprooted—as it also happened in your days.
translation:
  language: de
  text: Da ging Zorn vom Mächtigen aus, dass Zion entwurzelt würde – wie es auch in euren Tagen geschah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ
  choice: Zorn
  rationale: Gibt den starken Ausdruck für göttlichen Zorn direkt und würdevoll wieder.
- source_word: ܡܢ ܩܕܡ
  choice: vom … aus
  rationale: Überträgt die syrische Wendung wörtlich ‚von vor‘ in natürliches modernes Deutsch, ohne den Ursprung des Zorns beim Mächtigen zu verwischen.
- source_word: ܚܝܠܬܢܐ (im kontrollierten Textzusammenhang erschlossen)
  choice: der Mächtige
  rationale: Bewahrt den traditionellen Gottesbeiname als substantiviertes Adjektiv und entspricht der konsultierten englischen Fassung.
- source_word: ܬܬܥܩܪ (im kontrollierten Textzusammenhang erschlossen)
  choice: ausgerissen wurde
  rationale: Gibt das Bild des Entwurzelns bzw. gewaltsamen Herausreißens wieder; bei einer Stadt klingt ‚ausgerissen‘ im Deutschen verständlicher als das seltenere ‚entwurzelt‘.
theological_decisions:
- issue: Verhältnis zwischen göttlichem Zorn und der Zerstörung Zions
  choice: „sodass Zion ausgerissen wurde“
  alternative: „damit Zion ausgerissen würde“
  rationale: Die Folgewendung wahrt den engen Zusammenhang, legt aber weniger eindeutig eine ausdrückliche göttliche Zweckabsicht fest; die Ausgangsüberlieferung lässt sich hier kausal-konsekutiv verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesbeiname „der Mächtige“ bleibt erhalten; die knappe historische Rückbindung „in euren Tagen“ wird unverändert bewahrt.
