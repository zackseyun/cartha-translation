base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: de
  text: 'Denn er beging viel Frevel: Er tötete die Gerechten, verdrehte das Recht, vergoss unschuldiges Blut, vergewaltigte verheiratete Frauen, riss Altäre nieder, schaffte die Opfer ab und vertrieb die Priester, sodass sie im Heiligtum keinen Dienst mehr tun konnten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪ̈ܫܝܥܐ / Frevelkontext
  choice: Frevel
  rationale: Gibt schweres gottloses und rechtswidriges Handeln in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: ܕܡܐ ܐܫܕ
  choice: vergoss unschuldiges Blut
  rationale: Bewahrt die traditionelle Blutvergießensformel; „unschuldig“ entspricht dem in der Überlieferung bezeugten Sinn der Opfer.
- source_word: ܥܒܕ ܓܘܪܐ
  choice: vergewaltigte verheiratete Frauen
  rationale: Der Zusammenhang bezeichnet gewaltsame sexuelle Verletzung verheirateter Frauen; die aktive Form benennt die Gewalt unmissverständlich.
- source_word: priesterlicher Dienst im Heiligtum
  choice: Dienst tun
  rationale: Natürliches modernes Deutsch für kultischen bzw. priesterlichen Dienst, ohne die Aussage konfessionell zu verengen.
theological_decisions:
- issue: Art und Gewicht der aufgezählten Vergehen
  choice: Konkrete schwere Freveltaten werden in paralleler Reihung benannt.
  alternative: Die Handlungen verallgemeinernd als bloße Gottlosigkeit zusammenfassen.
  rationale: Die Einzelvergehen tragen die moralische und theologische Anklage des Verses und dürfen nicht eingeebnet werden.
- issue: Bezeichnung der kultischen Gaben
  choice: Opfer
  alternative: Opfergaben beziehungsweise Darbringungen
  rationale: „Opfer“ ist im Deutschen knapp und umfasst hier die abgeschafften kultischen Darbringungen, ohne ihre genaue Art festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anklagende Reihung und die klaren Verben des Ausgangstextes bleiben erhalten; unnötige Archaismen und konfessionelle Fachsprache werden vermieden.
