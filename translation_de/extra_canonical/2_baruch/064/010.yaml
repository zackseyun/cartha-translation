lexical_decisions:
- source_word: 'Rekonstruierter Gegensatz: „Gutes tun“ / „Böses tun“'
  choice: „Gutes tun“ / „Böses tun“
  rationale: Die parallele, idiomatische Formulierung bewahrt den ethischen Gegensatz und die ausgewogene Satzstruktur der kontrollierten englischen Fassung.
- source_word: „fähig sein / können“
  choice: „kann“
  rationale: „Können“ gibt die Fähigkeit natürlich und knapp wieder, ohne eine zusätzliche moralische oder metaphysische Deutung einzutragen.
theological_decisions:
- issue: Verhältnis zwischen der Fähigkeit zum Guten und zum Bösen
  choice: Beide Möglichkeiten werden mit derselben Formulierung nebeneinandergestellt.
  alternative: Den zweiten Satzteil als Zufügen von Qual oder Strafe wiederzugeben.
  rationale: Die Übersetzung erhält die theologische und anthropologische Spannung, ohne zu erklären, wer das Subjekt ist oder unter welchen Bedingungen die jeweilige Fähigkeit ausgeübt wird.
