  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Parallelstruktur wurde bewahrt. Da der bereitgestellte syrische Kapitelkorpus stark beschädigt beziehungsweise versweise nicht sicher abgrenzbar ist, folgt die Formulierung vorsichtig der auditierten englischen Konsultationsfassung und vermeidet weitergehende Präzisierungen.
