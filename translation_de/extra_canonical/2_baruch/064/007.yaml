lexical_decisions:
- source_word: ܡܢܫܐ
  choice: Manasse
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ܪܫܝܥܐ
  choice: der Gottlose
  rationale: Das syrische Wort bezeichnet einen Frevler bzw. gottlosen Menschen; die substantivische Form bewahrt hier den charakterisierenden Beinamen.
- source_word: ܡܥܡܘܪܗ
  choice: seine Wohnung
  rationale: Die konkrete Wohn- und Aufenthaltsmetapher des syrischen Ausdrucks bleibt erhalten, statt sie deutend als bloßes Schicksal wiederzugeben.
- source_word: ܢܘܪܐ
  choice: Feuer
  rationale: Die Gerichtssymbolik wird wörtlich und ohne zusätzliche theologische Auslegung wiedergegeben.
theological_decisions:
- issue: Bedeutung des Feuers und endgültiges Geschick Manasses
  choice: „am Ende war seine Wohnung im Feuer“
  alternative: „schließlich musste er im Feuer wohnen“ oder eine ausdrückliche Deutung als ewige Verdammnis
  rationale: Die Formulierung bewahrt das drastische Gerichtsbild, ohne Dauer, Ort oder dogmatische Bedeutung des Feuers über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau und der Beiname „der Gottlose“ bewahren den apokalyptisch-gerichtlichen Ton des Ausgangstextes.
