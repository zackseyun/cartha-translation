lexical_decisions:
- source_word: ܪܘܚܒܗ ܕܡܢܝܡܐ
  choice: Manasses’ Gottlosigkeit nahm so sehr zu
  rationale: Die Formulierung gibt das starke Anwachsen beziehungsweise Ausmaß von Manasses Frevel in natürlichem, gegenwärtigem Deutsch wieder; „Gottlosigkeit“ bewahrt dabei den religiös-moralischen Gehalt.
- source_word: ܡܪܝܡܐ
  choice: der Höchste
  rationale: Die traditionelle und zugleich verständliche Gottesbezeichnung entspricht dem syrischen Titel.
- source_word: ܡܕܒܪܐ
  choice: Heiligtum
  rationale: Im gegebenen Zusammenhang bezeichnet das Wort den heiligen Wohn- beziehungsweise Kultort; „Heiligtum“ ist prägnant und sachgerecht.
theological_decisions:
- issue: Handlungsträger beim Entfernen der Herrlichkeit
  choice: 'Manasses’ Gottlosigkeit ist grammatisch der Handlungsträger: „dass sie … entfernte“'
  alternative: „dass die Herrlichkeit des Höchsten aus dem Heiligtum entfernt wurde“
  rationale: Die aktive syrische Verbform in der 3. Person Femininum Singular stimmt mit dem femininen Ausdruck für „Gottlosigkeit“ überein. Die aktive Wiedergabe bewahrt die zugespitzte Aussage, ohne näher zu bestimmen, wie das Entfernen der göttlichen Herrlichkeit zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Genitiv „Manasses’“ ist idiomatisch; die feminine Rückverweisung „sie“ hält die aktive Struktur des Syrischen sichtbar.
