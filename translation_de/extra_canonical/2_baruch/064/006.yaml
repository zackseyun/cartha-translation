translation:
  language: de
  text: Und die Gottlosigkeit Manasses nahm so sehr zu, dass sie die Herrlichkeit des Höchsten aus dem Heiligtum entfernte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
