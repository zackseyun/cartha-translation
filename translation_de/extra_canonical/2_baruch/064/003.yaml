  terminology: „Bild“ ist für ṣalmā angemessen und nicht unnötig wertend. „Rivale“ trifft den im Audit hervorgehobenen personalen Gehalt von ḥarwayā. Die substantivische Gottesbezeichnung „der Mächtige“ ist würdevoll und konfessionell nicht einengend. „Eifer“ wahrt gegenüber „Eifersucht“ die größere semantische Offenheit.
