base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: de
  text: 'Und er fertigte ein Bild mit fünf Gesichtern an: Vier blickten in die vier Windrichtungen, und das fünfte befand sich oben auf dem Bild[a] – als Rivale des Eifers des Mächtigen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über dem Bild“.'
    reason: Die räumliche Wendung kann sowohl eine Lage an der Oberseite als auch oberhalb des Bildes bezeichnen.
  - marker: b
    text: 'Oder: „gleichsam im Widerstreit mit dem Eifer des Mächtigen“.'
    reason: Die Formulierung kann entweder personale Rivalität oder allgemeiner eine gegnerische Stellung ausdrücken.
lexical_decisions:
- source_word: ܨܠܡܐ (ṣalmā)
  choice: Bild
  rationale: Das Wort bezeichnet ein Bildnis beziehungsweise Götzenbild. „Bild“ wahrt die sachliche Bezeichnung, ohne die Wertung stärker festzulegen als der Zusammenhang.
- source_word: ܪ̈ܘܚܐ (rūḥē)
  choice: Windrichtungen
  rationale: Im Zusammenhang mit der Vierzahl sind die „vier Winde“ als die vier Himmels- beziehungsweise Windrichtungen gemeint. Die moderne Formulierung ist unmittelbar verständlich.
- source_word: ܠܥܠ ܡܢ ܨܠܡܐ (leʿel men ṣalmā)
  choice: oben auf dem Bild
  rationale: Die Wendung kann räumlich „über dem Bild“ oder „oben auf dem Bild“ bedeuten. Bei einem fünften Gesicht desselben Bildwerks ist eine Position an dessen Oberseite am wahrscheinlichsten.
- source_word: ܚܪܘܝܐ (ḥarwayā)
  choice: Rivale
  rationale: Das Substantiv bezeichnet einen Rivalen oder Widersacher und stellt das Bild als unmittelbare Anmaßung gegenüber dem göttlichen Eifer dar.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: der Mächtige
  rationale: Der Gottesbeiname wird substantivisch und würdevoll wiedergegeben, ohne ihn durch eine konfessionell geprägte Benennung zu ersetzen.
theological_decisions:
- issue: Verhältnis des fünften Gesichts zum Eifer Gottes
  choice: „als Rivale des Eifers des Mächtigen“
  alternative: „gleichsam im Widerstreit mit dem Eifer des Mächtigen“
  rationale: Die substantivische Rede vom „Rivalen“ bewahrt die scharfe Aussage über die vermessene Konkurrenz des Bildes mit Gott; die Vergleichspartikel lässt zugleich offen, in welchem genauen Sinn diese Rivalität besteht.
- issue: Göttlicher Eifer
  choice: „Eifer“
  alternative: „Eifersucht“
  rationale: „Eifer“ erhält die semantische Breite des Ausdrucks und vermeidet eine vorschnelle psychologisierende Festlegung, während der Kontext dennoch den Anspruch Gottes auf ausschließliche Verehrung erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Windrichtungen“ vermeidet die heute leicht missverständliche konkrete Vorstellung von vier einzelnen Winden; der Gedankenstrich hebt die abschließende Deutung hervor. Die Fußnoten bewahren die räumliche und relationale Mehrdeutigkeit.
