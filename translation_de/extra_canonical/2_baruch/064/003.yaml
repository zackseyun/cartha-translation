  source_fidelity: 'Die Übersetzung gibt die im englischen Audit ausgewiesenen syrischen Kernelemente sachgerecht wieder: ein Bild mit fünf Gesichtern, vier zu den vier Winden/Windrichtungen ausgerichtete Gesichter, ein fünftes an der Oberseite sowie dessen Charakterisierung als Rivale in Bezug auf den Eifer des Mächtigen. „oben auf dem Bild“ ist im konkreten Bildzusammenhang eine vertretbare, anschauliche Wiedergabe der räumlich nicht völlig eindeutigen Wendung; Fußnote a bewahrt die Alternative „über dem Bild“.'
