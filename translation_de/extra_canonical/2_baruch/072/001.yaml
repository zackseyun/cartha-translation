  text: But hear also about the bright waters that are to come at the end, after these dark waters.
translation:
  language: de
  text: Doch höre auch von den hellen Wassern, die am Ende nach diesen dunklen Wassern kommen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ / durch die Kontrollüberlieferung als aquae lucidae bezeugt
  choice: helle Wasser
  rationale: Die Wiedergabe bewahrt den bildhaften Gegensatz zu den dunklen Wassern und lässt sowohl Helligkeit als auch Lichtglanz anklingen, ohne das Bild auszudeuten.
- source_word: ܗܠܝܢ
  choice: diese
  rationale: Das proximale Demonstrativ verweist auf die unmittelbar zuvor geschilderten dunklen Wasser; daher ist „diese“ genauer als „jene“.
- source_word: Ausdruck für den Abschluss der Folge
  choice: am Ende
  rationale: Die Formulierung bezeichnet die abschließende Phase der visionären Wasserfolge und bleibt im Deutschen knapp und natürlich.
theological_decisions:
- issue: Eschatologische Deutung der hellen Wasser
  choice: Das Bild bleibt als „helle Wasser“ unaufgelöst stehen.
  alternative: Die Wasser ausdrücklich als messianische Heilszeit deuten.
  rationale: Der Vers kündigt zunächst das Symbol an. Eine explizite theologische Identifikation würde der nachfolgenden Auslegung vorgreifen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch höre auch“ erhält den weiterführenden und zugleich kontrastierenden Anschluss; „Wasser“ wird entsprechend dem wiederkehrenden Visionssymbol im Plural gebraucht.
