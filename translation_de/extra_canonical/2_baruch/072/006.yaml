  text: But all those who have ruled over you, or have known you, all these shall be delivered to the sword.
translation:
  language: de
  text: Doch alle, die über dich geherrscht oder dich gekannt haben – sie alle werden dem Schwert ausgeliefert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕ… / zugrunde liegende relative Wendungen im Vers
  choice: alle, die …
  rationale: Gibt die umfassende Personengruppe natürlich und zugleich eng am überlieferten Sinn wieder.
- source_word: „über dich herrschen“
  choice: über dich geherrscht
  rationale: Bewahrt den politischen beziehungsweise machtbezogenen Sinn, ohne die Art der Herrschaft näher festzulegen.
- source_word: „dich kennen“
  choice: dich gekannt
  rationale: Erhält die auffällige und möglicherweise mehrdeutige Aussage, statt sie als Anerkennen, Beobachten oder Vertrautsein auszudeuten.
- source_word: „dem Schwert übergeben/ausliefern“
  choice: dem Schwert ausgeliefert
  rationale: Eine natürliche deutsche Formulierung, die das Schwert als Bild für gewaltsamen Tod oder Hinrichtung stehen lässt.
theological_decisions:
- issue: Bedeutung von „dich gekannt haben“
  choice: Wörtlich als „dich gekannt haben“ wiedergegeben.
  alternative: „mit dir vertraut waren“ oder „dich anerkannt haben“
  rationale: Der knappe Ausdruck bleibt theologisch und historisch offen; der Kontext rechtfertigt keine eindeutige Spezifizierung.
- issue: Reichweite des angekündigten Gerichts
  choice: „sie alle“ bewahrt die uneingeschränkte Gesamtaussage.
  alternative: Abschwächung zu „auch sie“ oder „viele von ihnen“
  rationale: Die universale Formulierung soll nicht stillschweigend eingeschränkt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die zusammenfassende Wiederaufnahme „sie alle“ hervor. Keine konfessionell geprägte Terminologie.
