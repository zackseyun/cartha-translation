base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: de
  text: 'Das ist das Wort: Nachdem die Zeichen eingetreten sind, die dir zuvor angekündigt wurden, werden die Völker in Verwirrung geraten, und die Zeit meines Messias wird kommen. Er wird alle Völker zusammenrufen; einige von ihnen wird er am Leben lassen, andere aber wird er töten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: Wort
  rationale: Die traditionelle und im Kontext natürliche Wiedergabe der einleitenden Formel; sie kann hier eine angekündigte Botschaft oder Aussage bezeichnen.
- source_word: ܥܡܡ̈ܐ
  choice: Völker
  rationale: Gibt den kollektiven Plural präzise wieder und passt zum endzeitlichen Horizont des Abschnitts.
- source_word: Messias (im konsultierten Verszusammenhang)
  choice: mein Messias
  rationale: Bewahrt die possessive und messianische Bezeichnung der Überlieferung, ohne sie christologisch weiter auszudeuten.
- source_word: summon (durch den konsultierten Text für den schwer abzugrenzenden syrischen Seitenbefund gestützt)
  choice: zusammenrufen
  rationale: Natürliches Deutsch für das Herbeirufen sämtlicher Völker und weniger missverständlich als bloßes „rufen“.
- source_word: keep alive
  choice: am Leben lassen
  rationale: Bewahrt den Gegensatz zum Töten und vermeidet die zusätzliche Nuance von Begnadigung, die „verschonen“ eintragen könnte.
theological_decisions:
- issue: Identität und Funktion des Messias
  choice: „mein Messias“ ohne erklärenden Zusatz
  alternative: „mein Gesalbter“ oder eine ausdrücklich christologische Identifizierung
  rationale: „Messias“ bewahrt den jüdisch-apokalyptischen Titel und lässt die Identität innerhalb des Werkes offen.
- issue: Gericht über die Völker
  choice: Der Messias lässt einige am Leben und tötet andere
  alternative: Abschwächung als rein bildliche Scheidung oder Verurteilung
  rationale: Der scharfe Gegensatz der Überlieferung wird nicht harmonisiert oder spiritualisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der überlieferte Quellenausschnitt ist aufgrund der Seiteninterpolation und unsicheren Versabgrenzung schwer direkt zu isolieren; deshalb wurde die englische POB-Fassung als geprüfte Konsultationsschicht herangezogen und ihre Aussagen in quellennahem Deutsch wiedergegeben.
