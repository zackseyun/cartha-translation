  text: Every people that has not known Israel and has not trampled the seed of Jacob—these are the ones that shall live.
translation:
  language: de
  text: Alle Völker, die Israel nicht gekannt und den Samen Jakobs nicht zertreten haben, werden leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܐ / ܥܡ̈ܡܐ
  choice: Volk
  rationale: Gibt die kollektive Bezeichnung für eine ethnische oder politische Gemeinschaft natürlich wieder, ohne sie vorschnell auf den modernen Nationalstaat einzuengen.
- source_word: ܝܕܥ
  choice: gekannt
  rationale: Bewahrt die offene Bedeutung von »kennen«; eine Deutung als Anerkennen, Verehren oder Unterstützen wird nicht in den Haupttext eingetragen.
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ
  choice: Samen Jakobs
  rationale: Erhält das biblische Abstammungsbild des Ausgangstextes; gemeint sind Jakobs Nachkommen, doch das Bild wird nicht aufgelöst.
- source_word: ܕܫ / ܕܘܫ
  choice: zertreten
  rationale: Bewahrt die starke körperliche Metapher feindlicher Unterdrückung.
- source_word: ܢܚܘܢ
  choice: werden leben
  rationale: Gibt die Zukunftsaussage wörtlich und theologisch offen wieder; »überleben« oder »verschont werden« würde den Gerichtskontext stärker ausdeuten.
theological_decisions:
- issue: Bedeutung des Lebensversprechens
  choice: werden leben
  alternative: werden verschont bleiben / überleben
  rationale: Der Wortlaut lässt offen, ob zeitliches Überleben, Bewahrung im Gericht oder endzeitliches Leben gemeint ist. Die Übersetzung bewahrt diese Spannung.
- issue: Identität des »Samens Jakobs«
  choice: bildhafte Abstammungsbezeichnung beibehalten
  alternative: die Nachkommen Jakobs / Israel
  rationale: Die Metapher verbindet die Aussage mit biblischer Bundes- und Abstammungssprache, ohne eine spätere konfessionelle Identifikation festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die semitische Bildsprache. Die leichte Numerusspannung zwischen »jedes Volk« und dem hervorhebenden »diese« wird beibehalten, weil sie die zusammenfassende Identifikation des Ausgangssinns hörbar macht.
