translation:
  language: de
  text: Dies also sind die Dinge, die über jene Völker kommen werden, die von ihm verschont werden sollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ
  choice: Völker
  rationale: Bezeichnet hier ethnisch-politische Gruppen beziehungsweise Nationen; „Völker“ ist im Deutschen natürlich und traditionsgemäß.
- source_word: ܢܫܬܒܩܘܢ
  choice: verschont werden sollen
  rationale: Das passive Verb bezeichnet im Kontext diejenigen Völker, die der angekündigten Vernichtung entgehen beziehungsweise am Leben gelassen werden.
theological_decisions:
- issue: Bezug des Pronomens „ihm“
  choice: Das Pronomen bleibt als „ihm“ stehen.
  alternative: Explizit „vom Messias“
  rationale: Der Bezug ergibt sich aus dem unmittelbaren Zusammenhang; eine ausdrückliche Einfügung von „Messias“ würde die knappe Form des Verses interpretierend erweitern.
translation_notes:
  register: Knappe, würdige Zukunftsaussage in modernem Standarddeutsch. „Das also wird … kommen“ bildet die folgernde Zusammenfassung des vorangehenden Abschnitts natürlich ab.
