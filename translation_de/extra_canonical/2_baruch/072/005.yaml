  text: And this is because they shall be subjected, from among all the nations, to your people.
translation:
  language: de
  text: Und dies geschieht, weil sie aus allen Völkern deinem Volk unterworfen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܠ
  choice: deshalb, weil
  rationale: Gibt die kausale Verknüpfung des Verses in natürlichem, zugleich präzisem Deutsch wieder.
- source_word: ܥܡ̈ܡܐ
  choice: Völker
  rationale: Die übliche und kontextuell passende Wiedergabe des syrischen Plurals für ethnische beziehungsweise nationale Gruppen.
- source_word: ܥܡܟ
  choice: deinem Volk
  rationale: Bewahrt die direkte Anrede und unterscheidet das angesprochene Volk von den übrigen Völkern.
- source_word: ܢܫܬܥܒܕܘܢ
  choice: unterworfen werden
  rationale: Bewahrt den passiven Sinn der Unterordnung, ohne freiwilligen Dienst oder bloße Zugehörigkeit hineinzulesen.
theological_decisions:
- issue: Umfang der Unterwerfung aus den Völkern
  choice: aus allen Völkern einige
  alternative: sie werden aus allen Völkern deinem Volk unterworfen
  rationale: Der Vers bezeichnet nach der überlieferten Textgestalt eine Teilmenge aus sämtlichen Völkern; die ausdrückliche Wiedergabe mit „einige“ verhindert, dass eine Unterwerfung aller Angehörigen aller Völker behauptet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Begründungsfunktion und die Gegenüberstellung zwischen „allen Völkern“ und „deinem Volk“ klar fest.
