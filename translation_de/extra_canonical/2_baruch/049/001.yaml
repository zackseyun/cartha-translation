base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: de
  text: 'Doch nun will ich dich fragen, du Mächtiger, und den, der alles geschaffen hat, um Erbarmen bitten: In welcher Gestalt werden die leben, die in seinen Tagen am Leben sind? Oder wie wird der Glanz derer erhalten bleiben, die nach jener Zeit kommen? Werden sie dann diese gegenwärtige Gestalt wieder annehmen, und werden jene menschlichen Gestalten fortbestehen und wird ihnen Leben verliehen werden?[a] Oder wirst du vielleicht das, was in der Welt gewesen ist, verwandeln – ebenso wie die Welt selbst?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und werden sie als lebendige Wesen aufgerichtet werden?“ Die syrische Konstruktion kann entweder auf die Einsetzung als lebendige Wesen oder unmittelbarer auf das Verleihen beziehungsweise Wiederherstellen von Leben bezogen werden.'
    reason: Die Anmerkung markiert die syntaktische Mehrdeutigkeit der syrischen Lebens-Wendung, ohne eine bestimmte Auferstehungsvorstellung festzulegen.
lexical_decisions:
- source_word: ܕܡܘܬܐ
  choice: Gestalt
  rationale: Das Substantiv bezeichnet hier Form beziehungsweise Erscheinung, nicht Tod. „Gestalt“ passt zur Frage nach der leiblichen Existenz und wahrt zugleich die begriffliche Offenheit.
- source_word: ܙܥܘܪܬܗ
  choice: Glanz
  rationale: Die überlieferte Lesart ist an dieser Stelle schwierig; die Kontrollüberlieferung weist auf Glanz oder Herrlichkeit. „Glanz“ gibt diesen Sinn zurück, ohne ihn theologisch auszubauen.
- source_word: ܡܚܠܦ
  choice: verwandeln
  rationale: Das Verb bezeichnet eine Veränderung oder Umgestaltung. „Verwandeln“ bringt den Gegensatz zwischen Fortbestand und Veränderung natürlich zum Ausdruck, ohne deren Ausmaß festzulegen.
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: als Lebewesen ins Leben gerufen werden
  rationale: Die Wendung fragt nach der Begründung beziehungsweise Wiederherstellung lebendiger Existenz. Die passive Form entspricht dem Fragesatz und vermeidet die ältere syntaktische Fehlauffassung „die jetzt die Lebenden erhalten“.
theological_decisions:
- issue: Kontinuität oder Verwandlung der menschlichen Gestalt
  choice: 'Die Aussage bleibt als offene Frage formuliert: Die gegenwärtige Gestalt könnte fortbestehen beziehungsweise wieder lebendig werden oder verwandelt werden.'
  alternative: Den Vers eindeutig als Lehre von unveränderter leiblicher Identität oder von vollständiger Ablösung der bisherigen Gestalt wiederzugeben.
  rationale: Der Text stellt beide Möglichkeiten gegenüber und entscheidet sie in diesem Vers nicht. Diese Spannung darf nicht zugunsten einer bestimmten Auferstehungslehre aufgelöst werden.
- issue: Bezug von „seinen Tagen“
  choice: Das syrische maskuline Suffix wird formal mit „seinen Tagen“ wiedergegeben.
  alternative: „deinen Tagen“ oder eine ausdrücklich messianische Deutung.
  rationale: Die vorliegende syrische Zeile bietet ein Suffix der dritten Person. Eine Identifizierung des Bezugs wäre interpretierend und bleibt deshalb unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsanrede bleibt feierlich, während die verschachtelten Fragen für heutige Leser syntaktisch klar gegliedert sind. Die schwierige Überlieferung bei „Glanz“ und die Mehrdeutigkeit der Lebens-Wendung werden nicht stillschweigend dogmatisch vereindeutigt.
