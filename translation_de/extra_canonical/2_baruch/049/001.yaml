  - severity: low
    issue: „Ebenbilder“ ist hier zu spezifisch
    rationale: Für die im Kontext der leiblichen Gestalt stehende Bezeichnung ist „Gestalten“ idiomatischer und weniger bildtheologisch vorgeprägt.
