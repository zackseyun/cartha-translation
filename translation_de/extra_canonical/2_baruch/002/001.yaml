  text: But now I say to you, and to Jeremiah, and to all those who are like you, that you should depart[a] from this city.
translation:
  language: de
  text: Nun aber sage ich dir, Jeremia und allen, die euch ähnlich sind, dass ihr diese Stadt verlassen sollt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Seht für euch selbst von dieser Stadt ab“; eine syrische Redewendung dafür, sich von der Stadt zu entfernen oder sie zu verlassen.'
    reason: lexical_choice
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  choice: allen, die euch gleichen
  rationale: Gibt den konkreten Vergleich mit Baruch und Jeremia samt ihrem gleichgesinnten Kreis wieder; das pluralische ܠܟܘܢ wird als „euch“ bewahrt.
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
  choice: Zieht euch … zurück
  rationale: Die wörtliche Wendung „seht nach euch selbst weg von“ ist im Syrischen idiomatisch und fordert dazu auf, sich von der Stadt zu entfernen; „zieht euch zurück“ wahrt sowohl das reflexive Element als auch den Sinn des Weggehens.
- source_word: ܡܟܝܠ ܕܝܢ
  choice: Nun aber
  rationale: Bewahrt sowohl den zeitlich-folgernden Zug von ܡܟܝܠ als auch den kontrastierenden Anschluss durch ܕܝܢ in natürlichem Deutsch.
