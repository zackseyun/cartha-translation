  text: Denn deine Taten sind für diese Stadt wie eine feste Säule und dein Gebet wie eine starke Mauer.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܕܝܟ / ܥܒ̈ܕܐ (im überlieferten Seitentext offenbar fehlerhaft bzw. schwer lesbar wiedergegeben)
  choice: deine Taten
  rationale: Gibt den konkreten Sinn von „Werke/Taten“ in natürlichem, heutigem Deutsch wieder; „Taten“ passt zur Anrede Baruchs und vermeidet einen technisch klingenden Ausdruck.
- source_word: ܥܡܘܕܐ ܫܪܝܪܐ (nach dem durch die Parallelüberlieferung gestützten Wortlaut; Seitentext gestört)
  choice: eine feste Säule
  rationale: Bewahrt das tragende Bild und die Bedeutung „fest, standhaft, zuverlässig“.
- source_word: ܨܠܘܬܟ
  choice: dein Gebet
  rationale: Der Singular wird beibehalten; er bezeichnet Baruchs Gebet beziehungsweise Fürbitte als Ganzes.
- source_word: ܫܘܪܐ ܚܠܝܢܐ / ܬܩܝܦܐ (Seitentext offenbar fehlerhaft erfasst)
  choice: eine starke Mauer
  rationale: Erhält das parallele Schutzbild und folgt dem kontrollgestützten Sinn der Überlieferung.
theological_decisions:
- issue: Wirksamkeit von Baruchs Taten und Gebet für Jerusalem
  choice: Die Bilder von Säule und Mauer werden ohne weitere Erklärung direkt wiedergegeben.
  alternative: Den Satz ausdrücklich als Aussage über Fürbitte, Schutz oder Verdienst auslegen.
  rationale: Der Text stellt die tragende und schützende Bedeutung bildhaft dar, legt aber den genauen theologischen Wirkmechanismus nicht fest; diese Spannung soll offenbleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Der im bereitgestellten Seitenabzug erkennbar gestörte beziehungsweise fehlerhaft erfasste syrische Wortlaut wurde im Licht des kontrollgestützten Verssinns rekonstruiert. Keine Fußnote ist nötig, da im Haupttext kein Marker verwendet wird.
