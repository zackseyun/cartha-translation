revisions:
- from: 'Und wenn er offenbart wird, wird er die Menge ihres Heeres ausrotten. Der hohe Zedernbaum aber, den du als einzigen Überrest jenes Waldes gesehen hast, und die Worte, die der Weinstock zu ihm sprach und die du gehört hast – dies ist ihre Bedeutung:'
  to: 'Und wenn dies offenbar wird, wird es die Menge seines Heeres entwurzeln. Was aber die hohe Zeder betrifft, die du als Überrest jenes Waldes gesehen hast, und die Worte, die der Weinstock mit ihr sprach und die du gehört hast: Dies ist ihre Bedeutung:'
  rationale: Die Revision korrigiert die Bildmetapher, entfernt eine nicht ausgedrückte Exklusivierung und stellt die Beziehung zwischen Weinstock und Zeder quellentreu dar. Zugleich bleibt die Referenz des Offenbarten bewusst offen, statt sie im Deutschen als männliche messianische Person festzulegen.
