  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: de
  text: 'Und wenn dies offenbar wird, wird es die Menge seines Heeres entwurzeln. Was aber die hohe Zeder betrifft, die du als Überrest jenes Waldes gesehen hast, und die Worte, die der Weinstock mit ihr sprach und die du gehört hast: Dies ist ihre Bedeutung:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܓܠܝܬ
  choice: offenbart wird
  rationale: Bewahrt den apokalyptischen Offenbarungsbegriff und den passivischen Charakter des syrischen Ausdrucks.
- source_word: ܬܥܩܘܪ
  choice: ausrotten
  rationale: Gibt das Bild des Entwurzelns idiomatisch und mit seiner gewaltsamen Endgültigkeit wieder.
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: der hohe Zedernbaum
  rationale: Entspricht unmittelbar dem syrischen Bild und klingt im Deutschen natürlich.
- source_word: ܐܫܬܚܪ
  choice: als einzigen Überrest … gesehen hast
  rationale: Drückt das Zurückbleiben der Zeder aus; „als einzigen“ verdeutlicht im Kontext, dass sie allein vom Wald übrig blieb.
- source_word: ܓܦܢܐ
  choice: der Weinstock
  rationale: Bewahrt das konkrete Bild der Vision; „Weinstock“ ist hier präziser als das allgemeinere „Rebe“.
- source_word: ܗܢܘ ܡܠܬܐ
  choice: dies ist ihre Bedeutung
  rationale: Der Ausdruck leitet ausdrücklich die Deutung der zuvor genannten Bildrede ein; „Bedeutung“ ist im Deutschen sachgerecht und verständlich.
theological_decisions:
- issue: Bezug des offenbarten Subjekts
  choice: „wenn er offenbart wird“
  alternative: „wenn sie offenbart wird“
  rationale: Der vorausgehende syrische Kontext bezieht die Offenbarung auf den Messias; das grammatische Geschlecht wird daher nicht an das deutsche Femininum „Quelle“ oder „Rebe“ angeglichen.
- issue: Deutung der Vision im Übersetzungstext
  choice: Die Bilder Zeder, Wald und Weinstock bleiben unaufgelöst stehen.
  alternative: Die Zeder oder den Weinstock bereits mit geschichtlichen beziehungsweise messianischen Gestalten identifizieren.
  rationale: Der Vers eröffnet erst die folgende Auslegung. Eine vorweggenommene Identifikation würde die narrative und theologische Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Der lange Satzbau des Syrischen wurde lesbar gegliedert, ohne den ausdrücklichen Übergang zur folgenden Deutung zu verlieren.
