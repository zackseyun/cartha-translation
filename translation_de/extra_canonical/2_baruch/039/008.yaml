review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist nötig. Das syrische Bild von Ausreißen/Entwurzeln sollte nicht durch das allgemeinere „ausrotten“ ersetzt werden. Außerdem ist die maskuline Auflösung „er“ für das Offenbarte nicht durch den Vers selbst geboten und verengt die bildhafte bzw. im Kontext diskutierbare Referenz. „als einzigen Überrest“ fügt „einzigen“ hinzu, das der vorliegende Wortlaut nicht ausdrückt. Das Verhältnis zwischen Weinstock und Zeder lautet „mit ihr“, nicht „zu ihm“.
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „Entwurzeln“ bewahrt die Metapher und ist hier idiomatisch; die Satzstruktur mit vorangestelltem „Was ... betrifft“ verhindert einen unklaren Anschluss nach dem ersten Satz.
  terminology: „Zeder“ und „Weinstock“ geben die Bildsprache treffend wieder. Die neutrale Formulierung „wenn dies offenbar wird“ bewahrt die Referenzoffenheit, ohne eine messianische Personenreferenz in den Übersetzungstext einzutragen. „Bedeutung“ entspricht der ausdrücklich eingeleiteten Deutung.
  issues:
  - severity: medium
    issue: „er“ legt das Subjekt der Offenbarung als männliche Person fest.
    rationale: Der Vers verwendet bildhafte, in der Überlieferung bzw. im unmittelbaren Kontext nicht ohne Weiteres im Deutschen geschlechtlich übertragbare Bezüge. Die im Audit verwendete neutrale Formulierung vermeidet diese zusätzliche Festlegung.
  - severity: medium
    issue: „ausrotten“ verliert das Bild des Entwurzelns.
    rationale: ܬܥܩܘܪ bezeichnet das Ausreißen bzw. Entwurzeln; „entwurzeln“ erhält die konkrete Metapher.
  - severity: low
    issue: „als einzigen Überrest“ ergänzt „einzigen“.
    rationale: Der Text sagt, dass die Zeder vom Wald übrig geblieben ist, nicht ausdrücklich, dass sie dessen einziger Überrest war.
  - severity: medium
    issue: „der Weinstock zu ihm sprach“ verschiebt „mit ihr sprach“.
    rationale: Die Quelle und der englische Audit Trail beschreiben ein Sprechen des Weinstocks mit der Zeder; im Deutschen ist die Zeder feminin.
  revised_text: 'Und wenn dies offenbar wird, wird es die Menge seines Heeres entwurzeln. Was aber die hohe Zeder betrifft, die du als Überrest jenes Waldes gesehen hast, und die Worte, die der Weinstock mit ihr sprach und die du gehört hast: Dies ist ihre Bedeutung:'
