  yaml_path: translation/extra_canonical/2_baruch/039/003.yaml
  text: And this kingdom that once destroyed Zion will be destroyed, and it will be subjected to the one that comes after it.
translation:
  language: de
  text: Und dieses Königreich, das einst Zion verwüstet hat, wird vernichtet und dem unterworfen werden, der nach ihm kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ (malkūṯā)
  choice: Königreich
  rationale: Bezeichnet hier im Rahmen der Vision eine politische Herrschaftsmacht; „Königreich“ ist konkret und entspricht dem Bildzusammenhang.
- source_word: ܚܒܠܬ (ḥabbelat)
  choice: verwüstet hat
  rationale: Das Verb bezeichnet schweres Schädigen beziehungsweise Zerstören. Bei Zion gibt „verwüstet“ die historische Zerstörung natürlich und präzise wieder.
- source_word: ܬܚܒܠ (teṯḥabbal/tḥabbel)
  choice: wird vernichtet
  rationale: 'Der Zusammenhang und die parallele englische Kontrollfassung stützen die passive Deutung: Das zuvor zerstörende Königreich wird selbst zerstört.'
- source_word: ܬܫܬܥܒܕ (teštaʿbad)
  choice: wird … unterworfen werden
  rationale: Die Ethpaal-Form drückt hier das Unterworfenwerden unter eine nachfolgende Macht aus.
- source_word: ܗ̇ܘ ܕܐܬܐ ܒܬܪܗ (haw d-āṯē bāṯreh)
  choice: der nach ihm kommt
  rationale: Die personale beziehungsweise substantivierte Formulierung des Syrischen bleibt erhalten, ohne den Referenten ausdrücklich als Person oder Reich festzulegen.
theological_decisions:
- issue: Identität dessen, der nach dem Königreich kommt
  choice: 'offen gelassen: „der nach ihm kommt“'
  alternative: „das Reich, das nach ihm kommt“ oder eine messianische Identifikation
  rationale: Der Vers selbst benennt den Referenten nicht ausdrücklich. Eine nähere Identifikation würde die genuine Offenheit des Textes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Syrischen, ist aber idiomatisch geglättet; „einst“ gibt die zeitliche Rückschau von ܕܡܟܝ im Kontext wieder.
