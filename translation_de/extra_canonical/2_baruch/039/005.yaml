  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: de
  text: Und nach diesen wird ein viertes Königreich aufstehen. Seine Macht wird härter und schlimmer sein als die seiner Vorgänger. Es wird viele Zeiten lang herrschen wie die Wälder der Ebene, wird Zeiten erleben[a] und höher aufragen als die Zedern des Libanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird Zeiten sehen“. Die Wendung kann meinen, dass das Reich lange Zeiten erlebt; eine abweichende Textfassung beziehungsweise Deutung versteht sie als Herrschaft über die Zeiten.'
    reason: Die Anmerkung gibt die vorliegende syrische Lesung genau wieder und hält die im englischen Audit-Trail erkennbare abweichende Wiedergabe transparent, ohne eine Entscheidung über ihren textkritischen Rang vorwegzunehmen.
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: Königreich
  rationale: Das syrische Wort bezeichnet hier im Zusammenhang der aufeinanderfolgenden Reiche eine Königsherrschaft beziehungsweise ein Reich; „Königreich“ hält das Bild konkret.
- source_word: ܙܒ̈ܢܐ ܣܓܝ̈ܐܐ
  choice: viele Zeiten lang
  rationale: Die ungewöhnliche zeitliche Mehrzahl wird bewahrt, da sie zur apokalyptischen Ausdrucksweise des Abschnitts gehört.
- source_word: ܥܒ̈ܐ ܕܦܩܥܬܐ
  choice: die Wälder der Ebene
  rationale: Formale Wiedergabe des Vergleichs; die Bildspannung zwischen Wald und Ebene wird nicht geglättet.
- source_word: ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: die Zedern des Libanon
  rationale: Bewahrt das traditionelle Macht- und Höhenbild des syrischen Textes.
theological_decisions:
- issue: Identität des vierten Königreichs
  choice: Das Reich bleibt unbenannt.
  alternative: Ausdrückliche Gleichsetzung mit einem bestimmten historischen Weltreich.
  rationale: Der Vers selbst nennt keinen Namen; eine historische oder konfessionelle Identifikation wäre Auslegung, nicht Übersetzung.
- issue: Wertung seiner Macht
  choice: „härter und schlimmer“
  alternative: „mächtiger“ oder „stärker“
  rationale: Die konsultierte, geprüfte Fassung bezeugt die negative Doppelwertung; sie passt zum feindlichen Charakter des Reiches, ohne dessen Identität näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die apokalyptischen Bilder und die ungewöhnliche Rede von „vielen Zeiten“ bleiben erhalten; die unklare Formulierung über die Zeiten wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
