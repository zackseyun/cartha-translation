  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. „Zeiten erleben“ ist zwar bewusst bildhaft und ungewohnt, aber deutlich natürlicher als ein wörtliches „Zeiten sehen“ und bewahrt dessen offene Bedeutung. „höher aufragen“ gibt das Höhenbild idiomatisch wieder.
