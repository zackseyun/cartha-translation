  yaml_path: translation/extra_canonical/2_baruch/039/002.yaml
  text: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding it, this is the interpretation:'
translation:
  language: de
  text: Was den großen Wald betrifft, den du gesehen hast und den hohe, zerklüftete Berge umgaben, so ist dies die Deutung:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach anderer Lesung und Satzgliederung: »Dies ist ein Königreich, das in jenen Tagen entstehen wird.«'
    reason: Die vorliegende syrische Seitenwiedergabe bietet an dieser Stelle offenbar ܡܠܟܘܬܐ (»Königreich«); zugleich ist die Abgrenzung zum folgenden Vers unsicher.
  - marker: b
    text: 'Wörtlich bei der Lesung ܡܠܬܐ: »Dies ist das Wort.«'
    reason: Bewahrt die formale Bedeutung der Lesart, die im Auslegungskontext idiomatisch mit »Deutung« wiedergegeben wird.
lexical_decisions:
- source_word: ܥܒܐ ܣܓܝܐܐ
  choice: der große Wald
  rationale: Die Wendung bezeichnet hier den in der Vision gesehenen großen Wald; die deutsche Formulierung folgt dem Bild natürlich und ohne zusätzliche Deutung.
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: hohe, zerklüftete Berge
  rationale: ܪ̈ܒܐ kann Größe beziehungsweise Höhe ausdrücken; ܩܫܝܐ bezeichnet hier die raue, schroffe Beschaffenheit. »Hohe, zerklüftete Berge« gibt das visionäre Landschaftsbild idiomatisch wieder.
- source_word: ܡܠܬܐ
  choice: Deutung
  rationale: Wörtlich bedeutet das Wort »Wort« beziehungsweise »Aussage«; im unmittelbaren Zusammenhang wird jedoch eine Vision erklärt, sodass »Deutung« den kontextuellen Sinn wiedergibt. Die wörtliche Möglichkeit bleibt in Fußnote [b] erhalten.
theological_decisions:
- issue: Bezeichnet der Schlusssatz eine Deutung oder bereits ein endzeitliches Königreich?
  choice: 'Im Haupttext wird der Satz als Einleitung der Auslegung verstanden: »so ist dies die Deutung«.'
  alternative: »Dies ist ein Königreich, das in jenen Tagen entstehen wird.«
  rationale: 'Die überlieferte Textgliederung beziehungsweise Lesung ist an dieser Stelle unsicher: Der unmittelbare Auslegungskontext stützt »Deutung«, während die vorliegende syrische Seitenwiedergabe ܡܠܟܘܬܐ (»Königreich«) erkennen lässt und die anschließenden Wörter mit dem folgenden Satz verbunden werden können. Die Alternative wird deshalb nicht stillschweigend ausgeschlossen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und bewahrt den visionären Charakter. Wegen der textkritisch und satzsyntaktisch unsicheren Schlussformulierung stehen beide ernsthaft möglichen Lesungen in den Fußnoten.
