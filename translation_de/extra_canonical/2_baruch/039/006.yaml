review_pass:
  verdict: revise
  source_fidelity: 'Die vorgelegte syrische Primärquelle liest ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ (w-tetqayyam bah šrārā): »und die Wahrheit wird in ihm/ihr aufgerichtet bzw. gefestigt werden«. Das Verb ist nicht »sich verbergen«. Die englische Audit-Spur steht hier daher im Widerspruch zum abgebildeten Quellentext und darf die Übersetzung nicht bestimmen. Für den anschließenden Vergleich bewahrt »wie wilde Tiere ... in den Wald fliehen und hineinkriechen« die in der englischen Fassung dokumentierte Bildsprache; die genauere Deutung der zweiten syrischen Form bleibt textkritisch unsicher.'
  naturalness: »In ihm wird die Wahrheit gefestigt sein« ist modernes, würdiges Deutsch. Das neutrale Pronomen nimmt natürlich auf das zuvor bezeichnete Reich/Königreich Bezug. »Mit Unrecht befleckt« bewahrt das Bild der Verunreinigung und bleibt idiomatisch.
  terminology: »Wahrheit« für šrārā und »Unrecht« für ʿawlā sind sachgerecht. »Wilde Tiere« ist im deutschen Vergleich idiomatischer als »böse Tiere« und entspricht der traditionellen Vergleichsformulierung, ohne eine zusätzliche moralische Wertung der Tiere einzutragen.
  issues:
  - severity: high
    issue: Das Hauptverb wurde als »wird sich ... verbergen« übersetzt.
    rationale: Die sichtbare Primärquelle hat ܬܬܩܝܡ, eine Form von qwm (aufgerichtet werden, Bestand haben), nicht ein Verb von ṭšā (sich verbergen).
  - severity: medium
    issue: Fußnote a stellt »aufgerichtet werden« nur als Alternativlesart dar und ergänzt eine nicht quellenbelegte Sicherheitslesart.
    rationale: Die Aufrichtungs-/Bestandsaussage ist die Lesung des vorgelegten syrischen Textes. Die Fußnote würde den korrigierten Haupttext unbegründet relativieren.
  - severity: low
    issue: »böse Tiere« ist unnötig wertend.
    rationale: Für den Vergleich ist »wilde Tiere« im Deutschen natürlich und näher an der tradierten Wiedergabe; die moralische Aussage des Verses betrifft die mit Unrecht Befleckten, nicht die Tiere.
  revised_text: Und in ihm wird die Wahrheit gefestigt sein, und alle, die mit Unrecht befleckt sind, werden zu ihm fliehen, wie wilde Tiere in den Wald fliehen und hineinkriechen.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: »wie wilde Tiere und Kriechtiere in den Wald fliehen«.'
    reason: Die zweite Form der Vergleichsformel kann als weiteres Subjekt (»Kriechtiere«) oder als zweites Verb zum selben Subjekt (»hineinkriechen«) verstanden werden. Der Haupttext folgt der verbalen Deutung, ohne die Alternative zu verschweigen.
  revision_rationale: 'Der Haupttext wird nach der abgebildeten syrischen Lesung korrigiert: Wahrheit wird im Reich gefestigt bzw. aufgerichtet, nicht verborgen. Die unzutreffende Variantenfußnote wird entfernt. Die verbleibende Fußnote beschränkt sich auf die tatsächlich relevante grammatische Mehrdeutigkeit im Tiervergleich.'
