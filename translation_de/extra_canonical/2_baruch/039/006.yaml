  yaml_path: translation/extra_canonical/2_baruch/039/006.yaml
  text: And truth will hide itself in it, and all those who are stained with iniquity will flee to it, just as evil beasts flee and creep into the forest.
translation:
  language: de
  text: Und die Wahrheit wird sich in ihr verbergen,[a] und alle, die mit Unrecht befleckt sind, werden zu ihr fliehen, wie böse Tiere in den Wald fliehen und hineinkriechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Lesart: »Und die Wahrheit wird in ihr aufgerichtet werden«; nach einer weiteren Deutung: »Und Sicherheit wird in ihr hergestellt werden«.'
    reason: Die überlieferte beziehungsweise erschlossene Verb- und Substantivlesung ist strittig und führt zu deutlich verschiedenen Aussagen.
  - marker: b
    text: 'Oder nach abweichender grammatischer Deutung: »wie wilde Tiere und Kriechtiere in den Wald fliehen«.'
    reason: Die zweite Form kann traditionell als weiteres Subjekt aufgefasst werden; grammatisch liegt jedoch eher ein zweites, zum selben Subjekt gehörendes Verb vor.
lexical_decisions:
- source_word: ܫܪܪܐ (šrārā)
  choice: die Wahrheit
  rationale: Das gewöhnliche syrische Wort für »Wahrheit«; es bildet hier einen sinnvollen Gegensatz zu ܥܘܠܐ, »Unrecht/Frevel«.
- source_word: ܡܟܬܡܝܢ (mḵattəmīn)
  choice: mit Unrecht befleckt
  rationale: Bewahrt das konkrete Bild des Beschmutzt- oder Beflecktseins, ohne es zu einer bloßen moralischen Bewertung abzuschwächen.
- source_word: ܥܘܠܐ (ʿawlā)
  choice: Unrecht
  rationale: Eine natürliche, breite Wiedergabe, die sowohl Ungerechtigkeit als auch schuldhaften Frevel umfassen kann.
- source_word: ܚܝ̈ܘܬܐ ܒܝ̈ܫܬܐ (ḥaywāṯā bīšāṯā)
  choice: böse Tiere
  rationale: Gibt die negative Kennzeichnung der Tiere formal wieder; »wilde Tiere« wäre idiomatischer, würde aber die Wertung verschieben.
- source_word: ܥܪܩܝܢ … ܘܪܚܫܢ (ʿārqīn … w-rāḥšān)
  choice: fliehen und hineinkriechen
  rationale: Behandelt beide Partizipien als parallele Verben mit demselben Subjekt und nicht das zweite als Substantiv »Kriechtiere«.
theological_decisions:
- issue: Verhalten der Wahrheit innerhalb des dargestellten Reiches
  choice: wird sich in ihr verbergen
  alternative: wird in ihr aufgerichtet werden / Sicherheit wird in ihr hergestellt werden
  rationale: Die revidierte Lesung versteht das Verb als reflexiv-passives »sich verbergen/verborgen werden« und lässt die Spannung stehen, dass die Wahrheit in diesem Reich zwar gegenwärtig, aber verborgen ist. Die abweichende Überlieferung beziehungsweise Lesung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das feminine Pronomen »ihr« nimmt das zuvor genannte Reich auf. Die Bewegungsverben bleiben anschaulich und werden im Deutschen durch »hinein-« räumlich eindeutig miteinander verbunden.
