revisions:
- from: Und wenn die Zeit ihrer Vollendung[a] naht, sodass sie fällt, dann wird die Herrschaft meines Messias offenbar werden, die einer Quelle und einem Weinstock gleicht.
  to: Und wenn die Zeit ihres Endes naht, in der sie fallen wird, dann wird der Anbruch meines Messias offenbar werden, der einer Quelle und einem Weinstock gleicht.
  rationale: Die Revision gibt den bevorstehenden Fall explizit als zeitlich bestimmten Vorgang wieder und ersetzt die interpretierende Wiedergabe von ܪܝܫܝܬܐ als „Herrschaft“ durch „Anbruch“, das den ausgedrückten Beginn bewahrt und im modernen Deutschen idiomatisch bleibt. Die Metaphern und der Titel „Messias“ bleiben unverändert.
  reviewer_model: gpt-5.6-terra
