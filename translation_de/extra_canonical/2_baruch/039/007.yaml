  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: de
  text: Und wenn die Zeit ihres Endes naht, in der sie fallen wird, dann wird der Anbruch meines Messias offenbar werden, der einer Quelle und einem Weinstock gleicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܡܗ̇ (šūlāmāh)
  choice: ihrer Vollendung
  rationale: Das Wort bezeichnet Vollendung, Abschluss oder Ende. „Vollendung“ bewahrt den Gedanken, dass die betreffende Herrschaft an den ihr bestimmten Abschluss gelangt; die folgende Wendung „sodass sie fällt“ macht deutlich, dass dieser Abschluss ihr Untergang ist.
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ (rēšītēh d-mšīḥī)
  choice: die Herrschaft meines Messias
  rationale: ܪܝܫܝܬܐ kann Vorrang, Fürstenstellung oder Herrschaft bezeichnen. Im Zusammenhang der aufeinanderfolgenden Reiche ist „Herrschaft“ natürlich und sachgerecht, ohne die Aussage auf einen bloßen zeitlichen „Anfang“ zu verengen.
- source_word: ܡܫܝܚܝ (mšīḥī)
  choice: meines Messias
  rationale: Die possessive Form bedeutet „mein Gesalbter/mein Messias“. „Messias“ erhält den im apokalyptischen Zusammenhang erkennbaren Titelcharakter.
- source_word: ܡܒܘܥܐ ... ܓܦܢ (mabbūʿā ... gpen)
  choice: einer Quelle und einem Weinstock
  rationale: Die beiden Bildwörter werden konkret und parallel wiedergegeben; die ungewöhnliche Verbindung der Bilder bleibt erhalten.
theological_decisions:
- issue: Art und Zeitpunkt der messianischen Offenbarung
  choice: „dann wird die Herrschaft meines Messias offenbar werden“
  alternative: „dann wird der Anfang meines Messias offenbar werden“
  rationale: Der Kontext handelt von Reichen und ihrer Ablösung. Daher bezeichnet ܪܝܫܝܬܐ hier am ehesten die Herrschaft oder Regentschaft des Messias. Das Futur und „offenbar werden“ werden beibehalten, ohne die Gestalt oder Dauer dieser Herrschaft näher zu bestimmen.
- issue: Bezug des Falls
  choice: „sodass sie fällt“ bezieht sich auf die zuvor beschriebene Herrschaft
  alternative: 'unpersönlich: „wenn die Zeit gekommen ist, dass sie fällt“'
  rationale: Das feminine Pronomen und der Zusammenhang weisen auf das vorangehende Reich beziehungsweise seine Herrschaft. Die Übersetzung lässt den Fall ausdrücklich stehen und vermeidet die frühere Auslassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem apokalyptischen Wenn-dann-Gefüge des Syrischen, bleibt aber flüssig. Die beiden Metaphern werden ohne erklärende Ausdeutung bewahrt.
