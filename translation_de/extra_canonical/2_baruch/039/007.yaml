review_pass:
  verdict: revise
  source_fidelity: Die Aussage über den bevorstehenden Fall der zuvor geschilderten Herrschaft ist enthalten. ܪܝܫܝܬܗ (rēšītēh) bezeichnet jedoch primär „Beginn/Anfang“ und nicht unmittelbar „Herrschaft“. Die Wiedergabe „Herrschaft meines Messias“ ist daher eine kontextgestützte, aber zu weit gehende Ausdeutung.
  naturalness: Der Satz ist insgesamt modernes, würdiges Deutsch. „sodass sie fällt“ klingt jedoch kausal-konsekutiv; die syrische Formulierung beschreibt den herannahenden Zeitpunkt ihres Falls. „wenn die Zeit ihres Endes naht, in der sie fallen wird“ ist klarer und wahrt den Bezug.
  terminology: „Messias“, „Quelle“ und „Weinstock“ sind treffend. „Anbruch meines Messias“ gibt den bildhaft-apokalyptischen Ausdruck für den Beginn beziehungsweise das erste Hervortreten des Messias natürlicher wieder als ein wörtliches, im Deutschen missverständliches „Beginn meines Messias“.
  issues:
  - severity: medium
    issue: „Herrschaft meines Messias“ für ܪܝܫܝܬܗ ܕܡܫܝܚܝ
    rationale: Der syrische Ausdruck hat als Grundbedeutung „Beginn/Anfang“. Der Reichskontext kann eine messianische Regentschaft implizieren, doch die Übersetzung sollte diese Deutung nicht an die Stelle des ausgedrückten Begriffs setzen.
  - severity: low
    issue: „sodass sie fällt“
    rationale: Die Konjunktion kann einen durch die Vollendung verursachten Fall nahelegen. Gemeint ist der Zeitpunkt, zu dem die betreffende Herrschaft fallen wird.
  revised_text: Und wenn die Zeit ihres Endes naht, in der sie fallen wird, dann wird der Anbruch meines Messias offenbar werden, der einer Quelle und einem Weinstock gleicht.
  revised_footnotes:
  - marker: a
    text: 'Oder: „ihrer Vollendung“ beziehungsweise „ihres Abschlusses“.'
    reason: ܫܘܠܡܐ kann sowohl den Abschluss beziehungsweise die Vollendung als auch das Ende bezeichnen.
  revision_rationale: Die Revision gibt den bevorstehenden Fall explizit als zeitlich bestimmten Vorgang wieder und ersetzt die interpretierende Wiedergabe von ܪܝܫܝܬܐ als „Herrschaft“ durch „Anbruch“, das den ausgedrückten Beginn bewahrt und im modernen Deutschen idiomatisch bleibt. Die Metaphern und der Titel „Messias“ bleiben unverändert.
