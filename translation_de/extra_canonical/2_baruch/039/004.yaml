  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: de
  text: Und auch jenes Reich wird nach einiger Zeit vernichtet werden. Dann wird ein anderes, ein drittes, aufstehen; auch es wird eine Zeit lang herrschen und vernichtet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: Reich
  rationale: Der Zusammenhang beschreibt eine Folge politischer Herrschaftsreiche; „Reich“ ist im Deutschen natürlicher und konkreter als „Königsherrschaft“.
- source_word: ܬܩܘܡ
  choice: wird aufstehen
  rationale: Bewahrt das bildhafte Verb des syrischen Textes und bezeichnet zugleich das Entstehen eines weiteren Reiches.
- source_word: ܬܚܒܠ
  choice: wird vernichtet werden
  rationale: Gibt den Gedanken von Zerstörung beziehungsweise Untergang in diesem Zusammenhang klar und würdig wieder.
- source_word: ܙܒܢܐ
  choice: eine Zeit lang
  rationale: Drückt die begrenzte Herrschaftsdauer idiomatisch aus, ohne eine genaue Zeitspanne festzulegen.
theological_decisions:
- issue: Bestimmung der aufeinanderfolgenden Reiche
  choice: Die Reiche werden nur als „jenes“, „ein anderes“ und „ein drittes“ bezeichnet.
  alternative: Die Reiche ausdrücklich mit historischen Weltmächten identifizieren.
  rationale: Der Vers selbst nennt keine historischen Namen; seine absichtliche Offenheit darf nicht durch eine bestimmte Auslegung ersetzt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung von Vernichtung, Aufstehen und zeitlich begrenzter Herrschaft bleibt erhalten.
