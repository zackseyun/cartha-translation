  yaml_path: translation/extra_canonical/2_baruch/083/001.yaml
  text: '… into dust where it was born. And the possession of wealth will no longer turn back, but will seek death in its craving. And the snatchers of wages will bring forth death before its time, and the death that is the wage of sufferings will be taken away. And no matter of joy will remain for delight. And the realm of change will be turned into accomplished conflict, and there will be no hearing for sinners in Sheol.


    Since, then, all these things now come to pass, do you think they are not requited? One day, therefore, the inhabitants of the earth … If, then, I have made these things known to you while I still live—for great is the burden of guilt for those who belong to falsehood, and I set forth its full measure, because from falsehood they were begotten from the beginning, unto death—and I have said that you ought to be instructed: hear, and do, and say.


    "If you transgress the law, you will be scattered, and you will be removed from your land." Jeremiah also spoke to you while he was with you, when your fathers were forty years in the wilderness. And after the death of Joshua, and after Moses had been taken from you, your tribes still remained established. Moses told you beforehand that these things would come upon you; and when they did come upon you, know that it was according to the law.


    So now I also say to you, after what you have seen: do not go astray after those things that have come upon you. You will receive from the Mighty One the kingdom that endures, and what has been laid up for you. But know, children, that you were not handed over to emptiness when the commandments of the Mighty One were given to you; and no one goes forth by the spirit before the place of judgment. Rather, turn back to acknowledge his will and his law, and the holy people, and the assemblies, and his sanctuaries, and the beautiful works. Do not go astray …'
translation:
  language: de
  text: Denn der Höchste wird seine Zeiten gewiss beschleunigen und seine Stunden gewiss herbeiführen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: der Höchste
  rationale: Die traditionelle und zugleich allgemein verständliche Wiedergabe des syrischen Gottesprädikats bewahrt dessen erhabenen, nicht eigennamensartigen Charakter.
- source_word: ܙܒܢܘ̈ܗܝ
  choice: seine Zeiten
  rationale: Die formnahe Wiedergabe erhält den Plural und die Aussage, dass die festgesetzten Zeiten Gott zugeordnet sind.
- source_word: ܫܥ̈ܬܗ
  choice: seine Stunden
  rationale: „Stunden“ bewahrt die parallele Zeitangabe und den poetischen Gleichklang mit „seine Zeiten“.
- source_word: ܢܣܪܗܒ
  choice: wird … beschleunigen
  rationale: Das Verb bezeichnet ein Beschleunigen oder rasches Herbeiführen; „beschleunigen“ wahrt den Unterschied zum folgenden Verb.
- source_word: ܢܝܬܐ
  choice: wird … herbeiführen
  rationale: Die Wiedergabe drückt das aktive Eintretenlassen der festgesetzten Stunden aus, ohne den Parallelismus einzuebnen.
theological_decisions:
- issue: Göttliche Bestimmung der endzeitlichen Zeiten
  choice: Die Possessivformen „seine Zeiten“ und „seine Stunden“ bleiben erhalten.
  alternative: „die von ihm bestimmten Zeiten und Stunden“
  rationale: Die knappere Form bewahrt die Aussage und ihre Offenheit, ohne eine erklärende Deutung in den Haupttext einzutragen.
- issue: Nachdruck der Aussage
  choice: „gewiss“ wird in beiden parallelen Satzteilen gesetzt.
  alternative: Ein einziges „gewiss“ für den gesamten Satz
  rationale: Die Wiederholung gibt den emphatischen Parallelismus wieder und unterstreicht beide göttlichen Handlungen gleichermaßen.
translation_notes:
  register: Gehobenes, aber heutiges Standarddeutsch. Der parallele Satzbau und die zweimalige Bekräftigung wurden beibehalten. Der bereitgestellte Seitenblock weist laut Metadaten unsichere Kapitelgrenzen auf und zeigt 83:1 nicht zuverlässig im sichtbaren Ausschnitt; die Fassung folgt daher dem für diesen Vers kontrolliert überlieferten syrischen Wortlaut und nicht der im englischen Konsultationstext enthaltenen, offenbar verschobenen Passage.
