base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: de
  text: Wenn ihr nun den Brief erhaltet, lest ihn in eurer Versammlung mit Bedacht vor. Achtet an den Tagen der Wochen[a] besonders auf seine Worte, damit ihr euch erinnert und zurechtgebracht werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Tagen der Wochen“. Die genaue Bedeutung der syrischen Wendung ist unsicher.'
    reason: Die ungewöhnliche syrische Zeitangabe wird im Haupttext möglichst nahe bewahrt, ohne sie als wöchentliche Regel, Fasttage oder eine bestimmte liturgische Praxis auszulegen.
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: mit Bedacht
  rationale: Die Wendung bezeichnet hier ruhige, sorgfältige Aufmerksamkeit. „Mit Bedacht“ bewahrt diesen Sinn, ohne einseitig Fleiß oder bloße Muße zu betonen.
- source_word: ܬܬܗܪܘܢ … ܝܬܝܪܐܝܬ
  choice: achtet … besonders auf
  rationale: Das Verb fordert zu achtsamer Beachtung auf; ܝܬܝܪܐܝܬ verstärkt die Aufforderung. Die deutsche Formulierung gibt beides knapp und natürlich wieder.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: an den Tagen jeder Woche
  rationale: Dies gibt die im Syrischen ausdrücklich genannten „Tage“ und „Wochen“ verständlich wieder, ohne die unsichere Wendung als Hinweis auf Fasttage oder eine bestimmte Liturgie auszulegen. Die wörtliche Form und ihre Unsicherheit werden in einer Fußnote festgehalten.
- source_word: ܬܬܥܗܕܘܢ
  choice: damit ihr euch erinnert
  rationale: Die Grundbedeutung ist „sich erinnern, sich ins Gedächtnis rufen“. Die reflexive deutsche Form entspricht dem Zusammenhang der Mahnung.
- source_word: ܬܬܪܨܘܢ
  choice: zurechtgebracht werdet
  rationale: Das Verb bezeichnet ein Gerademachen beziehungsweise Richtigstellen. „Zurechtgebracht“ bewahrt sowohl das passive Moment als auch die moralisch-korrigierende Kraft, ohne nur Belehrung auszudrücken.
theological_decisions:
- issue: Soll die schwer verständliche Zeitangabe liturgisch gedeutet werden?
  choice: Die allgemeine Bezugnahme auf die Tage jeder Woche bleibt im Haupttext erhalten.
  alternative: Eine Deutung als Fasttage oder andere besondere liturgische Tage.
  rationale: Der vorliegende syrische Wortlaut nennt Tage und Wochen, legt aber keine bestimmte liturgische Praxis eindeutig fest. Eine solche Festlegung würde mehr in den Text eintragen, als die Quelle trägt.
- issue: Bedeutung des abschließenden Passivs
  choice: „zurechtgebracht werdet“
  alternative: „euch bessert“ oder „belehrt werdet“
  rationale: Die gewählte Fassung wahrt das passive Gerademachen und lässt offen, wodurch oder durch wen die Korrektur geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Versammlung“ hält den gemeinschaftlichen Rahmen fest, ohne eine spätere kirchliche Amts- oder Gottesdienstordnung vorauszusetzen; „vorlesen“ macht den öffentlichen Charakter des Lesens im Deutschen idiomatisch deutlich.
