  verdict: revise
  source_fidelity: Die Übersetzung trifft den Aufforderungscharakter, das öffentliche Vorlesen, die besondere Beachtung der Worte sowie das abschließende Erinnern und Zurechtgebrachtwerden insgesamt gut. „An den Tagen jeder Woche“ engt jedoch die auffällig offene syrische Formulierung „Tage der/in den Wochen“ zu einer regelmäßigen wöchentlichen Praxis ein, die der überlieferte Wortlaut nicht eindeutig aussagt.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und gut verständlich. „Mit Bedacht vorlesen“ und „besonders auf seine Worte achten“ sind idiomatisch. Die wörtlich nähere Zeitangabe bleibt ungewohnt, ist aber aufgrund der textlichen Unsicherheit mit Fußnote vertretbar.
  terminology: „Versammlung“ gibt den gemeinschaftlichen Rahmen angemessen wieder, ohne spätere institutionelle Konnotationen einzutragen. „Zurechtgebracht werdet“ bewahrt das passive und moralisch-korrigierende Moment von ܬܬܪܨܘܢ. Keine theologisch problematische Festlegung liegt vor.
