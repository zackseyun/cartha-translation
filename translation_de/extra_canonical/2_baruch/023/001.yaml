  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: de
  text: 'Da antwortete ich: »Nein, Herr, mein Herr.« Und er antwortete mir: »Warum bist du beunruhigt über das, was du nicht weißt, und warum bist du aufgewühlt wegen Dingen, die du nicht kennst? Denn so, wie du weder die vergessen hast, die jetzt leben, noch die, die dahingegangen sind, so denke auch ich an die, die noch kommen werden. Als Adam sündigte und der Tod über alle verhängt wurde, die geboren werden sollten, da wurde die Menge derer, die geboren werden sollten, gezählt. Für diese Zahl wurde ein Ort bereitet, damit die Lebenden darin wohnen und die Toten darin verwahrt werden. Solange also jene im Voraus festgesetzte Zahl nicht erreicht ist, wird die Schöpfung[a] nicht wieder lebendig werden. Denn mein Geist schenkt Leben, und der Scheol[b] nimmt die Toten auf. Außerdem wurde dir gewährt, zu hören, was nach diesen Zeiten kommen wird. Denn mein Heil ist wahrhaftig nahe gekommen und nicht mehr so fern wie zuvor.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Geschöpf«.'
    reason: Die zugrunde liegende Einzahl kann kollektiv auf die Schöpfung oder individuell auf das Geschöpf bezogen werden.
  - marker: b
    text: 'Scheol: die Totenwelt.'
    reason: Kurze Erklärung des beibehaltenen jüdisch-apokalyptischen Begriffs.
lexical_decisions:
- source_word: ܡܥܝܪ
  choice: beunruhigt
  rationale: Gibt die innere Unruhe der göttlichen Frage natürlich wieder, ohne sie zu Panik zu steigern; die parallele Formulierung wird mit »aufgewühlt« variiert.
- source_word: ܡܢܝܢܐ
  choice: Zahl
  rationale: Bewahrt die apokalyptische Vorstellung einer im Voraus bestimmten Gesamtzahl und bezeichnet nicht nur den Vorgang des Zählens.
- source_word: ܫܝܘܠ
  choice: Scheol
  rationale: Die im Deutschen gebräuchliche biblische Umschrift erhält die jüdisch-apokalyptische Vorstellungswelt, statt sie auf »Grab« zu verengen.
- source_word: ܦܘܪܩܢܐ
  choice: Heil
  rationale: »Heil« umfasst hier Gottes rettendes Eingreifen und klingt in würdigem, modernem Bibeldeutsch natürlich.
- source_word: ܪܘܚܝ
  choice: mein Geist
  rationale: Bewahrt die göttliche, lebenspendende Wirksamkeit, ohne die Aussage durch spätere dogmatische Präzisierung festzulegen.
theological_decisions:
- issue: Adams Sünde und das Todesurteil über die künftige Menschheit
  choice: »der Tod [wurde] über alle verhängt …, die geboren werden sollten«
  alternative: »die Sterblichkeit wurde für Adams Nachkommen festgesetzt«
  rationale: Die kollektive apokalyptische Aussage bleibt erhalten, ohne eine spätere Lehrformel in den Text einzutragen.
- issue: Der Abschluss der festgesetzten Zahl und das erneute Lebendigwerden
  choice: »wird die Schöpfung nicht wieder lebendig werden«
  alternative: »wird das Geschöpf nicht wieder leben«
  rationale: »Schöpfung« passt zum umfassenden endzeitlichen Zusammenhang; die mögliche singularische Lesart »Geschöpf« wird in einer Fußnote offengehalten.
- issue: Göttliche lebenspendende Wirksamkeit und Scheol
  choice: »mein Geist schenkt Leben, und der Scheol nimmt die Toten auf«
  alternative: »mein Geist erschafft die Lebenden, und der Scheol verwahrt die Toten«
  rationale: Die Gegenüberstellung von Leben und Tod bleibt deutlich, ohne die Art des Lebenswirkens über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Wiederholungen, die zur dialogischen und apokalyptischen Form gehören, bleiben weitgehend erhalten. Der bereitgestellte Ceriani-Seitenausschnitt liegt an einer unsicheren Kapitelgrenze und enthält den Wortlaut von 23,1 nicht vollständig; deshalb folgt der Entwurf den ausgewiesenen syrischen Schlüssellexemen und der geprüften englischen Konsultationsschicht, ohne darüber hinausgehende Konjekturen.
