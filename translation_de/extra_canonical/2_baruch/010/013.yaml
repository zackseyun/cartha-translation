  yaml_path: translation/extra_canonical/2_baruch/010/013.yaml
  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: de
  text: 'Und ihr Bräutigame, tretet nicht ein;

    und die Jungfrauen sollen sich nicht schmücken.

    Und ihr Frauen, betet nicht darum, Kinder zu gebären.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܘܪ̈ܟܐ
  choice: Bräutigame
  rationale: Der Zusammenhang mit den Jungfrauen und der Hochzeitssprache stützt die Wiedergabe „Bräutigame“; die vorliegende Textgestalt ist orthografisch beziehungsweise in der Erfassung unsicher.
- source_word: ܒܬܘܠܬܝܐ
  choice: Jungfrauen
  rationale: Das syrische Wort bezeichnet Jungfrauen beziehungsweise junge unverheiratete Frauen; „Jungfrauen“ bewahrt die konkrete Bezeichnung der Vorlage.
- source_word: ܢܫܝ̈ܐ
  choice: Frauen
  rationale: Die gewöhnliche und kontextgemäße Bedeutung ist „Frauen“.
- source_word: ܡܣܒܪܝܢ / englische Kontrolllesart „pray“
  choice: betet nicht darum
  rationale: Die Kontrollüberlieferung versteht die Aussage als Aufforderung, nicht um Nachkommenschaft zu bitten; „darum“ ergibt im Deutschen eine natürliche Verbindung zum folgenden Infinitiv.
- source_word: ܒܛܢܝ̈ܗܝܢ / Geburtskontext
  choice: Kinder zu gebären
  rationale: Die Formulierung gibt den Sinn von Empfangen, Schwangerschaft und Gebären idiomatisch wieder, ohne den Satz unnötig medizinisch zu verengen.
theological_decisions:
- issue: Geltungsbereich des Verbots
  choice: Als situationsgebundene Klageaufforderung formuliert
  alternative: Als allgemeines Verbot von Ehe, Schmuck oder Kinderwunsch verstehen
  rationale: Der unmittelbare Kontext ist die Klage über Zions und Jerusalems Untergang. Die Übersetzung lässt diesen rhetorischen Kontext bestehen und macht daraus keine allgemeine Lehre.
- issue: Imperativ gegenüber rhetorischer Frage
  choice: Negative Aufforderungen entsprechend der kontrollierten Versabgrenzung
  alternative: „Warum freuen sich die Bräutigame …?“
  rationale: Der überlieferte Seitentext ist in diesem Abschnitt beschädigt beziehungsweise schwer segmentierbar; die englische, auditierte Kontrollschicht und der fortlaufende Klagekontext stützen hier die imperativische Fassung.
translation_notes:
  register: Moderner, würdevoller Klage- und Mahnton. Der Parallelismus der drei Zeilen bleibt erhalten; auf altertümliche Formen wie „Weiber“ oder „Mägde“ wurde verzichtet.
