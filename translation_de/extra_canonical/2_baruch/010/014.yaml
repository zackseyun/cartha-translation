  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: de
  text: 'Vielmehr sollen sich die Unfruchtbaren freuen,

    und die Kinderlosen sollen froh sein;

    doch sollen die, die Kinder haben, trauern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܘܪ̈ܟܐ
  choice: die Unfruchtbaren
  rationale: Das syrische Wort bezeichnet hier im Zusammenhang von Empfängnis und Geburt unfruchtbare beziehungsweise kinderlose Personen; die substantivierte Form wahrt die knappe, allgemeine Aussage.
- source_word: ܚܕܝܢ
  choice: sollen sich freuen
  rationale: Die Form drückt Freude aus; im klagenden, auffordernden Kontext ist die deutsche Wiedergabe mit „sollen“ natürlich und entspricht der rhetorischen Wendung.
- source_word: ܕܠܝܬ ܠܗܘܢ
  choice: die Kinderlosen
  rationale: Wörtlich liegt eine Formulierung wie „die keine haben“ vor; „die Kinderlosen“ macht den aus dem unmittelbaren Geburtskontext erschlossenen Bezug idiomatisch deutlich.
- source_word: ܟܐܒܐ
  choice: trauern
  rationale: Das Wortfeld umfasst Schmerz und Leid; als Gegenstück zu „sich freuen“ gibt „trauern“ den Sinn in diesem Klagelied prägnant wieder.
theological_decisions:
- issue: Wertung von Kinderlosigkeit und Elternschaft im Gerichtskontext
  choice: Die paradoxe Gegenüberstellung wird ohne Abschwächung beibehalten.
  alternative: Die Aussage ausdrücklich auf die bevorstehende Katastrophe zu beschränken oder erklärend umzudeuten.
  rationale: Der Vers formuliert im Klagelied eine zugespitzte Umkehrung gewöhnlicher Erwartungen. Eine zusätzliche Erklärung im Haupttext würde die Spannung auflösen und mehr sagen als der Vers selbst.
translation_notes:
  register: Poetisch gegliederte, moderne Standardsprache mit würdigem Klang. Die parallelen Verben „sich freuen“ und „froh sein“ sowie der abschließende Gegensatz „doch … trauern“ bewahren die dreiteilige rhetorische Struktur.
