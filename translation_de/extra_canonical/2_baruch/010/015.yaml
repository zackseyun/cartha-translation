translation:
  language: de
  text: 'Denn warum sollten sie unter Schmerzen gebären

    und unter Seufzen begraben?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܠܕܝܢ
  choice: gebären
  rationale: Das syrische Verb bezeichnet im vorliegenden Zusammenhang das Hervorbringen beziehungsweise Gebären von Kindern; „gebären“ bewahrt das Bild der klagenden Mütter und den Gegensatz zum anschließenden Begraben.
- source_word: ܟܐܒܐ
  choice: Schmerzen
  rationale: Das Substantiv bezeichnet Schmerz oder Leid. Der Plural klingt im Deutschen in Verbindung mit dem Gebären natürlich und lässt körperlichen wie seelischen Schmerz mitschwingen.
- source_word: (im vorgelegten Seitenausschnitt nicht vollständig sichtbar; durch die konsultierte Versfassung bezeugter Begräbnisausdruck)
  choice: begraben
  rationale: Die deutsche Wiedergabe folgt der durch die englische Kontrollfassung bezeugten zweiten Verszeile und erhält die harte Gegenüberstellung von Geburt und Bestattung.
- source_word: (im vorgelegten Seitenausschnitt nicht vollständig sichtbar; durch die konsultierte Versfassung bezeugter Klageausdruck)
  choice: unter Seufzen
  rationale: „Unter Seufzen“ gibt die begleitende Klage knapp, würdig und ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Bezug der rhetorischen Frage
  choice: Die Subjekte bleiben unbestimmt („sie“), wie es der isolierte Vers und die Kontrollfassung nahelegen.
  alternative: Ausdrücklich „die Frauen“ oder „die Mütter“ einsetzen.
  rationale: Der Kontext handelt von Schwangerschaft, Geburt und geraubten Kindern, doch eine ausdrückliche Ergänzung würde die im Vers vorhandene Referenz stärker festlegen als nötig.
- issue: Verhältnis von Geburt und Tod
  choice: Die beiden Verben werden ohne erklärenden Zusatz unmittelbar parallel gestellt.
  alternative: Ergänzen, dass die geborenen Kinder später begraben werden.
  rationale: Die erschütternde Spannung zwischen Gebären und Begraben soll erhalten bleiben; der Text erklärt weder Zeitabstand noch Objekt ausdrücklich.
translation_notes:
  register: Knappe, poetische Klagesprache in modernem, würdigem Standarddeutsch. Der Zeilenumbruch wahrt den Parallelismus der beiden Handlungen. Keine Fußnoten erforderlich.
