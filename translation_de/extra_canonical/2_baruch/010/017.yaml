lexical_decisions:
- source_word: ܡܢ ܗܫܐ
  choice: Von nun an
  rationale: Gibt die zeitliche Wendung unmittelbar und idiomatisch wieder.
- source_word: ܠܐ ܗܘܝ ܬܙܡܪܘܢ
  choice: singt nicht mehr
  rationale: ܬܙܡܪܘܢ bezeichnet primär das Singen; die Verbindung mit ܠܐ ܗܘܝ trägt hier den Sinn einer künftig zu unterlassenden Handlung.
- source_word: ܫܘܦܪܐ
  choice: Schönheit
  rationale: Die geläufige Bedeutung ist Schönheit beziehungsweise Pracht; „Schönheit“ passt zum Klagekontext und zur Parallelzeile.
- source_word: ܬܚܬܘܢ
  choice: redet
  rationale: Der überlieferte Text ist an dieser Stelle durch den Seitenabbruch unvollständig beziehungsweise schwer zu bestimmen. „redet“ folgt dem durch die konsultierte englische Fassung bezeugten parallelen Sinn, ohne die Aussage auszuschmücken.
