review_pass:
  verdict: revise
  source_fidelity: Die zweite Frage des Entwurfs („der Same ihrer Art ... genannt werden“) folgt zwar der englischen Audit-Fassung, ist jedoch in der vorliegenden syrischen Wortfolge nicht sicher belegt. Der sichtbare syrische Abschnitt hat vielmehr zwei parallele Fragen über Frauen und Schwangerschaften sowie Menschen, die Kinder zeugen. Diese Fassung sollte im Haupttext bevorzugt werden; die schwierige Überlieferungslage ist weiterhin anzumerken.
  naturalness: Der Entwurf ist sprachlich flüssig und angemessen würdevoll. „Same ihrer Art“ wirkt im heutigen Deutsch jedoch biologisierend und ist ohne sicheren syrischen Rückhalt weniger natürlich als die parallele Formulierung mit Schwangerschaft und Kinderzeugen.
  terminology: „Gefangenschaft“ und „weggeführt“ treffen die Aussage von ܐܬܬܒܝܘ gut. „Verödet“ gibt die im Kontext vorausgesetzte Verwüstung der Mutterstadt poetisch und idiomatisch wieder. Die Personifikation als „die Mutter“ bleibt bewusst nicht weiter allegorisiert.
  issues:
  - severity: medium
    issue: Die Wendung „der Same ihrer Art noch genannt werden“ ist im Haupttext nicht hinreichend durch die sichtbare syrische Lesung gedeckt.
    rationale: Der überlieferte Abschnitt bietet erkennbar „Frauen“, „Schwangerschaften“, „Menschen, die Kinder zeugen“, und „hoffen“. Die englische Formulierung beruht offenbar auf einer Rekonstruktion bzw. abweichenden Textgestalt. Für eine quellennähere deutsche Übersetzung ist die syrisch sichtbare Parallelstruktur vorzuziehen.
  - severity: low
    issue: Die quellennähere Alternative ist nur in der Fußnote enthalten.
    rationale: Da sie die unmittelbar belegbare syrische Wortfolge besser abbildet, soll sie den Haupttext bilden. Die englische Rekonstruktion kann knapp als alternative Textgestalt in der Anmerkung dokumentiert werden.
