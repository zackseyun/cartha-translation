  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: de
  text: 'Oder warum sollten Menschen noch Kinder zeugen,

    und warum sollte der Same ihrer Art noch genannt werden,

    wenn diese Mutter verwüstet daliegt

    und ihre Kinder in die Gefangenschaft weggeführt worden sind?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte syrische Text dieses Abschnitts ist schwer lesbar und weicht in seiner sichtbaren Wortfolge teilweise von späteren Rekonstruktionen ab; sinngemäß ist auch möglich: „Warum sollten Frauen noch auf ihre Schwangerschaften hoffen, oder warum sollten Menschen, die Kinder zeugen, noch Hoffnung haben, wenn die Mutter verödet ist und ihre Kinder gefangen weggeführt wurden?“'
    reason: Die textliche Unsicherheit und die abweichende syrische Wortfolge sollen offengelegt werden, statt eine einzige Rekonstruktion als zweifelsfrei auszugeben.
lexical_decisions:
- source_word: ܐܢܫܐ ܕܡܘܠܕܝܢ
  choice: Menschen … Kinder zeugen
  rationale: Die Wendung bezeichnet Menschen, die Nachkommen hervorbringen; „Kinder zeugen“ ist im Deutschen natürlich und wahrt den Bezug auf Fortpflanzung.
- source_word: ܒܢܝ̈ܗ ܐܬܬܒܝܘ
  choice: ihre Kinder … in die Gefangenschaft weggeführt worden sind
  rationale: Das syrische Verb bezeichnet das Gefangennehmen beziehungsweise Wegführen in Gefangenschaft; das Passiv erhält die Perspektive des Klagelieds.
- source_word: seed / kind (consultation-layer reconstruction)
  choice: Same ihrer Art
  rationale: Die Formulierung bewahrt das Bild biologischer beziehungsweise geschlechtlicher Fortdauer, ohne „Natur“ im modernen philosophischen Sinn missverständlich wirken zu lassen.
theological_decisions:
- issue: Bezug der „Mutter“
  choice: diese Mutter
  alternative: die Mutter aller / ihre Mutter
  rationale: Der unmittelbare Kontext des Klagelieds richtet sich an Zion beziehungsweise Jerusalem. Die Übersetzung lässt die Personifikation stehen, ohne sie dogmatisch oder allegorisch weiter auszudeuten.
- issue: Aussage über Nachkommenschaft
  choice: rhetorische Klage über weiteres Kinderzeugen
  alternative: allgemeine Verurteilung von Elternschaft
  rationale: Die Fragen stehen im Kontext der Verwüstung Jerusalems und der Verschleppung ihrer Kinder; sie werden nicht zu einer zeitlosen theologischen Ablehnung von Fortpflanzung verallgemeinert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in poetischen Zeilen. Die anklagende rhetorische Struktur und die Personifikation der Stadt als Mutter bleiben erhalten; „noch“ gibt den wiederholenden beziehungsweise fortdauernden Sinn natürlich wieder.
