    text: 'Der überlieferte syrische Text ist an dieser Stelle schwierig. Die Übersetzung folgt seiner sichtbaren Parallelstruktur („Frauen … Schwangerschaften“; „Menschen, die Kinder zeugen“). Eine spätere Rekonstruktion beziehungsweise abweichende Textgestalt lautet sinngemäß: „Warum sollten Menschen wieder Kinder haben, oder warum sollte der Same ihrer Art wieder genannt werden?“'
