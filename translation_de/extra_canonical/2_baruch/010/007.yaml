  text: 'But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.'
translation:
  language: de
  text: 'Doch wehe uns, die wir leben,

    denn wir haben Zions Bedrängnisse gesehen

    und das, was Jerusalem widerfahren ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: Doch wehe uns, die wir leben
  rationale: Die syrische Wortfolge hebt die noch Lebenden kontrastiv hervor. Das im überlieferten Text erkennbare Klagewort wird im Deutschen idiomatisch mit „wehe uns“ wiedergegeben.
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: Zions Bedrängnisse
  rationale: Die Form bezeichnet hier leidvolle Bedrängnisse beziehungsweise Nöte; „Bedrängnisse“ wahrt den poetischen Klagecharakter, ohne die Art des Leidens zu verengen.
- source_word: ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: und das, was Jerusalem widerfahren ist
  rationale: ܓܕܫ bezeichnet ein Geschehen oder Widerfahren. Die neutrale Formulierung bewahrt die semantische Offenheit, während der Kontext das Unheil erkennen lässt.
