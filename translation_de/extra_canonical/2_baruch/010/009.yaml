base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/009.yaml
  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: de
  text: 'Ihr Bauern, sät nicht wieder;


    und du, Erde, warum bringst du noch die Frucht deines Ertrags hervor?


    Bewahre in dir die Süße deiner Nahrung.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒ
  choice: wieder / noch
  rationale: Das Adverb bezeichnet eine Wiederholung oder Fortdauer. Im ersten Satz ist „wieder“, in der anschließenden Frage idiomatisch „noch“ gewählt.
- source_word: ܐܪܥܐ
  choice: Erde
  rationale: Die Erde wird in der Klage direkt angeredet; die Personifikation bleibt erhalten.
- source_word: ܦܐܪ̈ܐ
  choice: Frucht
  rationale: Der kollektive Singular klingt im Deutschen natürlich und bewahrt das Bild des Ertrags der Erde.
- source_word: ܚܠܝܡܘܬܐ
  choice: Süße
  rationale: Das Wort bezeichnet hier die angenehme, wohltuende Qualität der Nahrung; „Süße“ erhält die poetische Bildsprache.
- source_word: ܡܙܘ̈ܢܝܟܝ
  choice: deiner Nahrung
  rationale: Die Form bezeichnet Nahrung beziehungsweise Lebensunterhalt; „Nahrung“ passt zur angeredeten Erde und bleibt nahe am syrischen Ausdruck.
theological_decisions:
- issue: Kosmische Trauer als Aufforderung an Bauern und Erde
  choice: Die imperativische Klagesprache wird wörtlich als Anrede wiedergegeben.
  alternative: Die Aussagen als bloße Vorhersage von Unfruchtbarkeit formulieren.
  rationale: Der Kontext ist eine poetische Toten- und Zionsklage. Die Personifikation und die drastische Aufforderung sollen nicht zu einer sachlichen Vorhersage geglättet werden.
translation_notes:
  register: Poetisch-klagender, würdevoller Stil in modernem Standarddeutsch. Die parallelen Anreden und der Zeilenbau wurden bewahrt; wegen der unsicheren beziehungsweise beschädigten Überlieferung wurde keine zusätzliche Präzisierung in den Haupttext eingeführt.
