    ܐܝܟܘ ܢܘܗܪܟܘܢ ܕܠܚܫܟܘܢ.

    ܘܐܢܬ ܫܡܫܐ ܐܢܒܝ

    ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ.

    ܠܡܢܐ ܓܝܪ ܗܘܝ ܠܝܠܝ

    ܢܘܗܪܐ ܐܢܘܢ ܕܡܘܬܐ

    ܕܐܝܟ ܗܟܢܐ. ܘܬܘܒ

