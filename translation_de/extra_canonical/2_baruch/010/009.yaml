    ܘܐܡܪܘ ܒܫܡܝ ܕܐܢܬܘܢ

    ܦܠܚܝ̈ܢ ܠܐ ܬܙܥܘܢ ܬܘܒ.

    ܘܐܢܬ ܐܢܒܐ ܠܡܢܝ

    ܚܘܒܐ ܦܐܪ̈ܐ ܕܒ̈ܠܠܝܘܗܝ.

    ܐܝܟܢܐ ܒܨܝܪܝܢ ܚܠܝܡܘܬܐ

