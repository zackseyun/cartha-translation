    ܘܐܬܩܒܠ ܗܘ̣ ܕܐܫܬܡܥ.

    ܀ ܕܟܕ ܠܒܝܫ ܡܢ ܚܛܝ̈ܗ̣ܐ

    ܗܘ̣ ܕܠܐ ܐܬܚܙܝ ܒܥܒܕܘܗܝ

    ܕܡܕܝܢܬܐ ܘܕܢܝ ܡܕ̈ܢܝܗ

    ܘܒܩ̈ܝ. ܘܐܬܒܥܝ ܘܕܩ̈ܝ

    10 .. ܝܡܝܟ ܐܘ ܡ̈ܢܝ ܆܀܆ ܗܘ̣ܘ

