translation:
  language: de
  text: Und ich sagte zu meinem Bruder Jeremia, wie der Herr mir geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ (wa-ʾemret)
  choice: Und ich sagte
  rationale: Gibt das gewöhnliche syrische Verb für »sagen« natürlich und unmittelbar wieder.
- source_word: ܠܐܪܡܝܐ ܐܚܝ (le-ʾarmiyā ʾaḥī)
  choice: zu meinem Bruder Jeremia
  rationale: Bewahrt sowohl die Anredebeziehung zu Jeremia als auch die ausdrückliche Bezeichnung »mein Bruder«.
- source_word: ܕܦܩܕܢܝ ܡܪܝܐ (da-paqdanī māryā)
  choice: wie der Herr mir geboten hatte
  rationale: Die Partikel ܕ verbindet den Satz hier am natürlichsten modal mit dem vorausgehenden Sprechen; ܡܪܝܐ wird entsprechend seinem üblichen Gottesbezug mit »der Herr« wiedergegeben.
theological_decisions:
- issue: Bezeichnung Jeremias als »mein Bruder«
  choice: wörtlich beibehalten
  alternative: als vertrauliche Anrede oder Volkszugehörigkeit abschwächen
  rationale: Der Text nennt Jeremia ausdrücklich »mein Bruder«; ob dies leiblich oder weiter gefasst gemeint ist, wird nicht entschieden.
- issue: Art des göttlichen Auftrags
  choice: »wie der Herr mir geboten hatte«
  alternative: »was der Herr mir geboten hatte«
  rationale: »Wie« wahrt den Bezug auf die Ausführung des Auftrags, ohne einen im Vers nicht ausdrücklich genannten Befehlsinhalt zu ergänzen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton; die Satzstellung ist natürlich, ohne die knappe Struktur des Syrischen auszubauen.
