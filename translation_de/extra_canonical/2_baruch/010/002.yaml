translation:
  language: de
  text: „Sag Jeremia, dass er gehen und die Gefangenen des Volkes bis nach Babylon begleiten soll.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܡܝܐ
  choice: Jeremia
  rationale: Die übliche deutsche Namensform.
- source_word: ܥܡܐ
  choice: Volk
  rationale: Gibt den kollektiven Bezug des syrischen Ausdrucks natürlich und präzise wieder.
- source_word: captivity (durch die englische Kontrollschicht bezeugt)
  choice: die Gefangenen aus dem Volk
  rationale: Im Deutschen bezeichnet „die Gefangenschaft des Volkes“ eher einen Zustand; gemeint ist hier die Gruppe der Verschleppten, die Jeremia begleiten soll.
- source_word: Babylon (durch die englische Kontrollschicht bezeugt)
  choice: Babylon
  rationale: Bewahrt das konkrete Ziel der Wegführung.
theological_decisions:
- issue: Art der Gefangenschaft
  choice: Gefangene aus dem Volk
  alternative: Gefangenschaft des Volkes
  rationale: Die personenbezogene Wiedergabe passt zum Verb „begleiten“, ohne über den Text hinaus eine bestimmte theologische Deutung der Wegführung einzutragen.
translation_notes:
  register: Moderne, klare und zugleich würdige direkte Rede. Der vorgelegte syrische Seitenausschnitt ist an der Versgrenze textlich schwer zuzuordnen; die Einzelheiten des Satzes werden durch die auditierte englische Kontrollschicht gestützt.
