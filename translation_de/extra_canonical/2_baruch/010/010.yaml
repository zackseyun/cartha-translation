  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: de
  text: Und du, Weinstock, warum gibst du noch deinen Wein, warum trägst du noch Früchte? Denn keine Opfergabe von dir wird in Zion mehr entgegengenommen, und keine Erstlingsfrüchte werden mehr angenommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: Weinstock
  rationale: Die Anrede bezeichnet hier die Weinrebe beziehungsweise den Weinstock; „Weinstock“ ist im Deutschen natürlich und bewahrt die Bildsprache.
- source_word: ܦܐܪ̈ܐ
  choice: Wein
  rationale: Im Zusammenhang des angeredeten Weinstocks sind dessen Ertrag beziehungsweise Frucht als Wein wiedergegeben; dies entspricht auch der kontrollierenden englischen Fassung.
- source_word: ܩܘܪܒܢܐ / Opferterminus im beschädigten Textbereich
  choice: Opfergabe
  rationale: „Opfergabe“ gibt den kultischen Zusammenhang präzise und allgemeinverständlich wieder, ohne eine bestimmte Opferart festzulegen.
- source_word: ܪܝܫܝܬܐ / Erstlingsfruchtterminus im beschädigten Textbereich
  choice: Erstlingsfrucht
  rationale: Der kultische Fachbegriff bezeichnet die erste Erntegabe; der Singular wird im Deutschen kollektiv verstanden.
theological_decisions:
- issue: Endgültigkeit der Einstellung des Zionskults
  choice: „mehr“ in beiden Versteilen
  alternative: „wieder“ beziehungsweise „wiederum“
  rationale: Das deutsche „mehr“ bringt im negierten Zukunftssatz die fortan ausbleibende Annahme der Opfer zum Ausdruck, ohne über den Vers hinaus eine theologische Begründung zu ergänzen.
- issue: Art der Opfergabe
  choice: allgemeines „Opfergabe“
  alternative: „Speisopfer“, „Trankopfer“ oder eine andere spezifizierte Opferart
  rationale: Wegen des beschädigten beziehungsweise fehlerhaft erfassten syrischen Textbereichs und der unspezifischen Kontrollfassung wird keine enger bestimmte Opferkategorie eingeführt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter poetischer Anrede. Die Parallelstruktur und der kultische Ernst des Klageworts bleiben erhalten; unnötige Archaismen wurden vermieden.
