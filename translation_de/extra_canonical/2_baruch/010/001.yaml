- source_word: ܐܡܪ ܠܝ
  choice: sprach zu mir
  rationale: Das idiomatische „sprach zu mir“ gibt die direkte göttliche Anrede würdig und im Deutschen natürlich wieder.
theological_decisions:
- issue: Personifizierung des göttlichen Wortes
  choice: „das Wort Gottes kam zu mir“ bleibt als prophetische Formel stehen
  alternative: „Gott teilte mir mit“
  rationale: Die konkrete Formulierung des Syrischen wird bewahrt, ohne sie christologisch auszudeuten oder zu einer bloßen Mitteilung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel bleibt erhalten; der Doppelbezug „zu mir kam und zu mir sprach“ bildet die Wiederholung des Ausgangstextes ab.
