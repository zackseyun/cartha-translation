base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: de
  text: 'Und du, Sonne, halte das Licht deiner Strahlen zurück;

    und du, Mond, lass die Fülle deines Lichts erlöschen.

    Denn warum sollte wieder Licht aufgehen,

    wo Zions Licht verdunkelt worden ist?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte syrische Textgestalt ist an dieser Stelle schwer zu lesen; insbesondere die Mondzeile und die Reihenfolge der beiden Anreden werden in Übersetzungen unterschiedlich wiedergegeben.
    reason: Kennzeichnet eine echte textliche Unsicherheit, ohne den poetischen Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: Sonne
  rationale: Die eindeutige gewöhnliche Bedeutung passt zur Anrede an die Himmelskörper.
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: das Licht deiner Strahlen
  rationale: Gibt die Lichtstrahlen der Sonne in natürlichem, zugleich bildhaftem Deutsch wieder.
- source_word: ܢܘܗܪܐ
  choice: Licht
  rationale: Die Wiederholung von „Licht“ wird beibehalten, weil sie den Gegensatz zur Verdunkelung Zions trägt.
- source_word: ܨܗܝܘܢ
  choice: Zion
  rationale: Der traditionelle Eigenname bleibt erhalten und wird nicht deutend durch „Jerusalem“ ersetzt.
theological_decisions:
- issue: Bedeutung von „Zions Licht“
  choice: Die Metapher bleibt unaufgelöst.
  alternative: Zions Licht ausdrücklich als Tempel, Herrlichkeit oder göttliche Gegenwart deuten.
  rationale: Der Text selbst erklärt die Metapher nicht; ihre poetische und theologische Offenheit soll erhalten bleiben.
- issue: Rhetorische Frage über das erneute Aufgehen des Lichts
  choice: „warum sollte wieder Licht aufgehen“
  alternative: „wozu sollte es noch einmal hell werden“
  rationale: Die gewählte Fassung bewahrt sowohl das kosmische Bild des aufgehenden Lichts als auch die klagende Spannung.
translation_notes:
  register: Poetische Klage in modernem, würdigem Standarddeutsch. Der Parallelismus und die wiederholte Lichtmetaphorik werden erhalten; altertümliche Anredeformen werden vermieden.
