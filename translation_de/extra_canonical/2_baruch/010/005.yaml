  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: de
  text: 'Und er ging mit dem Volk fort. Ich aber, Baruch, führte sie hinaus[a], setzte mich vor die Tore des Tempels, stimmte über Zion dieses Klagelied an und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem überlieferten syrischen Text: „führte/brachte sie hinaus“. Manche Übersetzungen geben stattdessen „kehrte zurück“ oder „ging fort“ wieder.'
    reason: Der syrische Wortlaut mit dem pluralischen Objekt „sie“ ist im Zusammenhang schwierig und weicht von der geglätteten Wiedergabe der englischen Konsultationsfassung ab.
lexical_decisions:
- source_word: ܐܙܠ ܥܡ ܥܡܐ
  choice: ging mit dem Volk fort
  rationale: Gibt die einfache Bewegungsaussage natürlich wieder; „fort“ verdeutlicht im Deutschen den Weggang aus der erzählten Situation.
- source_word: ܐܦܩܬ ܐܢܘܢ
  choice: führte sie hinaus
  rationale: Die überlieferte syrische Form bedeutet wörtlich „ich brachte/führte sie hinaus“ und enthält ein ausdrückliches pluralisches Objekt.
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: setzte mich vor die Tore des Tempels
  rationale: Bewahrt sowohl die Sitzhandlung als auch den Plural „Tore“ und die räumliche Angabe „vor“.
- source_word: ܐܠܝܬ ܐܠܝܬܐ ܗܕܐ ܥܠ ܨܗܝܘܢ
  choice: stimmte über Zion dieses Klagelied an
  rationale: Die figura etymologica aus Verb und Substantiv wird idiomatisch als das Anstimmen eines Klagelieds wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Abfolge des Syrischen bleibt erkennbar, während „stimmte … an“ die Klageform natürlich ausdrückt. Die textlich schwierige Aussage ܐܦܩܬ ܐܢܘܢ wird nicht stillschweigend nach der englischen Konsultationsfassung harmonisiert.
