  text: But you, remain here in the desolation of Zion, and after these days I will show you what is to happen in the latter times.”
translation:
  language: de
  text: Du aber bleib hier in der Verwüstung Zions; nach diesen Tagen werde ich dir zeigen, was in den letzten Zeiten geschehen wird.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܬ ܕܝܢ
  choice: Du aber
  rationale: Gibt den ausdrücklichen Gegensatz der syrischen Wendung knapp und natürlich wieder.
- source_word: ܩܘܡ
  choice: bleib hier
  rationale: Das Verb bedeutet wörtlich „steh auf/steh da“ und kann im Kontext den Sinn „bleib“ beziehungsweise „halte dich auf“ tragen; die Fortsetzung der Szene verlangt hier eine Ortsanweisung.
- source_word: ܒܚܘܫܒܝܟ
  choice: in der Verwüstung Zions
  rationale: Die vorliegende Seitenüberlieferung ist an dieser Stelle offenbar gestört beziehungsweise schwer lesbar. Die im Verszusammenhang bezeugte Lesart bezeichnet Baruchs Verbleiben am verwüsteten Zion.
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: nach diesen Tagen
  rationale: Nahe, idiomatische Wiedergabe der syrischen Zeitangabe.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: was … geschehen wird
  rationale: Bewahrt den Zukunftssinn der Konstruktion, ohne das angekündigte Geschehen näher festzulegen.
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ
  choice: in den letzten Zeiten
  rationale: Die überlieferte Zeile ist textlich unsicher; der Sinn zielt auf eine spätere beziehungsweise endzeitliche Zeitspanne. Die Formulierung bewahrt den Plural und vermeidet eine zu enge dogmatische Festlegung.
theological_decisions:
- issue: Zeitliche beziehungsweise endzeitliche Bedeutung der Schlussformel
  choice: in den letzten Zeiten
  alternative: in späteren Zeiten / am Ende der Zeiten
  rationale: „In den letzten Zeiten“ lässt den eschatologischen Klang bestehen, ohne die Wendung auf einen einzelnen Endzeitpunkt festzulegen.
- issue: Gegenstand der angekündigten Offenbarung
  choice: was … geschehen wird
  alternative: die kommenden Ereignisse
  rationale: Die verbale Formulierung bewahrt die Offenheit des Textes und fügt keine konkrete Ereignisfolge hinzu.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Rede bleibt knapp und prophetisch; das Futur „werde ich dir zeigen“ gibt die Ankündigung direkt wieder. Wegen der beschädigten beziehungsweise unsicheren syrischen Zeilen wurde die im Kapitelzusammenhang und in der kontrollierten englischen Konsultationsschicht erkennbare Versgestalt gewählt.
