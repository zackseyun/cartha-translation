base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: de
  text: 'Ich rufe die Sirenen aus dem Meer,

    und ihr Liliths[a], kommt aus der Wüste,

    und ihr Dämonen und Drachen aus den Wäldern:

    Wacht auf, gürtet eure Hüften zur Trauer,

    stimmt mit mir die Klage an

    und trauert mit mir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Liliths«: weibliche Nacht- oder Wüstenwesen.'
    reason: Die transkribierte Bezeichnung dürfte heutigen Lesenden nicht ohne Weiteres vertraut sein.
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: Sirenen
  rationale: Die syrische Lehnbezeichnung wird als Name der mythischen Meereswesen wiedergegeben.
- source_word: ܠܝ̈ܠܝܬܐ
  choice: Lilithen
  rationale: Der Plural bezeichnet weibliche Wüsten- oder Nachtwesen; die Transliteration bewahrt die konkrete Gestalt des Ausgangstextes.
- source_word: ܫܐ̈ܕܐ
  choice: Dämonen
  rationale: Die übliche sachliche Entsprechung für böse oder unheimliche Geistwesen.
- source_word: ܡܘܡܬܐ
  choice: Trauer
  rationale: Im Zusammenhang des Klageaufrufs bezeichnet das Wort den Zustand beziehungsweise Vollzug des Trauerns.
theological_decisions:
- issue: Anrufung mythischer und dämonischer Wesen
  choice: Die Wesen werden als poetisch angerufene Mittrauernde stehen gelassen.
  alternative: Die Bezeichnungen verallgemeinernd als Tiere oder Naturkräfte wiederzugeben.
  rationale: Der syrische Text nennt konkrete unheimliche Wesen; ihre ontologische Einordnung wird nicht erklärt oder harmonisiert.
translation_notes:
  register: Poetische, würdevolle Klagesprache mit kurzen parallelen Zeilen. Der Imperativ „gürtet eure Hüften“ bewahrt das antike Bild, bleibt aber im Deutschen verständlich.
