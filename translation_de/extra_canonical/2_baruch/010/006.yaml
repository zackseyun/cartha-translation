  text: 'Glücklich ist, wer nicht geboren wurde,

    oder wer geboren wurde und starb.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܘܒܘܗܝ (ṭūbawhy)
  choice: Glücklich ist
  rationale: Gibt die syrische Seligpreisungsformel natürlich und würdig wieder, ohne sie unnötig dogmatisch aufzuladen.
- source_word: ܠܗܘ ܕܠܐ ܐܬܝܠܕ (l-haw d-lā etīled)
  choice: wer nicht geboren wurde
  rationale: Bewahrt die passive Form und den allgemeinen Personenbezug des Syrischen.
- source_word: ܐܘ ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ (aw l-haw d-etīled w-mīt)
  choice: oder wer geboren wurde und starb
  rationale: Folgt der knappen Parallelstruktur des Ausgangstextes und lässt das zeitliche Verhältnis der beiden Verben unverändert.
theological_decisions:
- issue: Charakter der Seligpreisung im Trauerlied
  choice: Die drastische Aussage wird ohne Abschwächung als Glücklichpreisung wiedergegeben.
  alternative: „Besser hat es, wer …“ oder eine erklärende Umschreibung
  rationale: Der syrische Text formuliert ausdrücklich mit ܛܘܒܘܗܝ; die Spannung des Klagerufs soll erhalten bleiben und nicht als allgemeine Lehrbehauptung erklärt oder harmonisiert werden.
translation_notes:
  register: Knappe, poetische und würdige Standardsprache. Der Parallelismus und die schonungslose Spannung des syrischen Klagerufs bleiben erhalten.
