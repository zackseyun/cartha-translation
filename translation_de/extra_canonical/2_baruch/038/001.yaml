  language: en
  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: de
  text: 'Und ich betete und sagte: »Herr, mein Herr, du schenkst denen immerfort Licht, die sich von Einsicht leiten lassen. Dein Gesetz ist Leben, und deine Weisheit ist Rechtschaffenheit. Darum zeige mir die Deutung dieser Vision. Denn du weißt, dass meine Seele nach deinem Gesetz gelebt hat und dass ich seit meinen frühesten Tagen nie von deiner Weisheit getrennt gewesen bin.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: die sich von Einsicht leiten lassen
  rationale: Die Formulierung bewahrt sowohl das Geführtwerden als auch die verstandesmäßige und sittliche Bedeutung von ܣܘܟܠܐ; zugleich klingt sie im heutigen Deutsch natürlich.
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: Dein Gesetz ist Leben
  rationale: Die starke, nominale Gleichsetzung wird beibehalten und nicht zu der schwächeren Aussage »gibt Leben« umgedeutet.
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: deine Weisheit ist Rechtschaffenheit
  rationale: »Rechtschaffenheit« gibt die Grundidee von Geradheit und sittlicher Richtigkeit wieder, ohne den Ausdruck vorschnell forensisch oder konfessionell festzulegen.
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: die Deutung dieser Vision
  rationale: Im apokalyptischen Zusammenhang bezeichnet ܦܘܫܩܐ die Auslegung beziehungsweise Deutung eines symbolischen Offenbarungsgesichts.
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: nie von deiner Weisheit getrennt war
  rationale: Die Wiedergabe wahrt den passiv-relationalen Gedanken des Getrennt- oder Abgeschnittenseins und vermeidet die Verengung auf ein freiwilliges Abweichen.
theological_decisions:
- issue: Verhältnis von Gesetz und Weisheit zur göttlichen Offenbarung
  choice: 'Die beiden Aussagen bleiben als starke parallele Bekenntnisse stehen: Gottes Gesetz ist Leben, Gottes Weisheit ist Rechtschaffenheit.'
  alternative: Die Prädikate könnten abgeschwächt als »gibt Leben« beziehungsweise stärker forensisch als »Gerechtigkeit« wiedergegeben werden.
  rationale: Die direkte Form bewahrt die theologische Spannung und Aussagekraft des Textes, ohne eine spätere Lehrsystematik einzutragen.
- issue: Treue zur Weisheit Gottes
  choice: »nie von deiner Weisheit getrennt war«
  alternative: »nicht von deiner Weisheit abgewichen bin«
  rationale: Die gewählte Fassung lässt offen, ob vor allem Bewahrung, Zugehörigkeit oder fehlende Entfremdung gemeint ist, statt nur eine bewusste menschliche Abkehr auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vision« und »Deutung« entsprechen dem apokalyptischen Zusammenhang; »meine Seele« bleibt als semitische Ganzheitsbezeichnung erhalten. Die vorliegende OCR-Zeile des syrischen Textes ist erkennbar beschädigt; die Fassung folgt der durch Editions- und Kontrollzeugnisse gestützten Lesung, die auch der geprüften englischen Konsultationsschicht zugrunde liegt.
