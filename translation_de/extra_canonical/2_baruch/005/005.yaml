  yaml_path: translation/extra_canonical/2_baruch/005/005.yaml
  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: de
  text: Da ging ich und holte Jeremia, Addo, Seraja, Jabisch, Gedalja und alle angesehenen Männer des Volkes. Ich führte sie ins Kidrontal hinab[a] und berichtete ihnen alles, was zu mir gesagt worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: brachte sie ins Kidrontal hinab.'
    reason: Die syrische Kausativform kann sowohl mit „hinabführen“ als auch mit „hinabbringen“ wiedergegeben werden.
lexical_decisions:
- source_word: ܐܚܬ (Aphel von ܢܚܬ; gemäß der für den Vers bezeugten Lesart)
  choice: führte sie … hinab
  rationale: Die kausative Form bezeichnet ein Hinabführen oder Hinabbringen. „Ins Kidrontal hinabführen“ gibt sowohl die Bewegungsrichtung als auch die geografische Lage natürlich wieder.
- source_word: ܝܩܝܪ̈ܐ / entsprechende Bezeichnung der geehrten Männer (gemäß der Versüberlieferung)
  choice: angesehenen Männer
  rationale: „Angesehen“ vermittelt gesellschaftliche Achtung und Rang in natürlichem modernem Deutsch, ohne einen amtlichen Titel einzuführen.
- source_word: ܐܡܪ / entsprechende Mitteilungsformel (gemäß der Versüberlieferung)
  choice: berichtete ihnen alles, was zu mir gesagt worden war
  rationale: Die passive Formulierung bewahrt, dass Baruch zuvor eine Botschaft empfangen hatte, ohne den Sprecher im Deutschen ausdrücklich zu ergänzen.
