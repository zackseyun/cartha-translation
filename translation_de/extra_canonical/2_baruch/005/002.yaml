  text: And the Lord said to me, "My name and my glory endure forever, but my judgment maintains its right in its time."
translation:
  language: de
  text: 'Und der Herr sagte zu mir: »Mein Name und meine Herrlichkeit bestehen für immer; mein Gericht aber wahrt zu seiner Zeit sein Recht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bewahrt zu seiner Zeit sein eigenes Recht«.'
    reason: Die syrische Wendung kann enger und wörtlicher mit »sein eigenes Recht bewahren« wiedergegeben werden; die genaue Nuance zwischen Wahrung, Anspruch und Gerechtigkeit bleibt offen.
lexical_decisions:
- source_word: ܫܡܝ ܘܬܫܒܘܚܬܝ
  choice: mein Name und meine Herrlichkeit
  rationale: Gibt die beiden auf Gott bezogenen Begriffe sachlich und in würdigem, geläufigem Deutsch wieder.
- source_word: ܠܥܠܡ ܕܠܥܠܡ
  choice: für immer
  rationale: Natürliche deutsche Wiedergabe der verstärkten Ewigkeitsformel; der Sinn dauernden Bestehens bleibt erhalten.
- source_word: ܕܝܢܝ
  choice: mein Gericht
  rationale: Bewahrt den möglichen Bedeutungsumfang von göttlichem Richten, Urteil und Rechtsprechung, ohne ihn unnötig einzuengen.
- source_word: ܢܛܝܪ ... ܙܕܩܗ
  choice: wahrt ... sein Recht
  rationale: Die Rechtsmetaphorik wird erhalten; »wahrt« klingt im Deutschen natürlicher als ein wörtliches »bewahrt« und lässt den Bezug des Possessivpronomens bestehen.
theological_decisions:
- issue: Verhältnis von Gottes ewigem Namen und seiner zeitgebundenen Rechtsprechung
  choice: Kontrast durch »aber« beibehalten
  alternative: Die beiden Aussagen ohne adversative Verknüpfung nebeneinanderstellen
  rationale: Der überlieferte Satz stellt das ewige Bestehen von Name und Herrlichkeit der Durchsetzung des Gerichts zu der dafür bestimmten Zeit gegenüber; diese Spannung soll nicht aufgelöst werden.
- issue: Bedeutung von »Gericht«
  choice: mein Gericht
  alternative: mein Urteil / meine Gerechtigkeit
  rationale: »Gericht« lässt sowohl den richterlichen Vorgang als auch dessen Entscheidung anklingen und vermeidet eine konfessionell oder systematisch verengende Auslegung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Die Satzstruktur ist knapp gehalten; das Semikolon verdeutlicht den inhaltlichen Gegensatz, ohne zwei eigenständige Aussprüche daraus zu machen.
