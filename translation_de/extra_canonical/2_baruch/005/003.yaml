  yaml_path: translation/extra_canonical/2_baruch/005/003.yaml
  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: de
  text: 'Und du wirst mit eigenen Augen sehen: Nicht die Feinde sind es, die Zion zu Fall bringen, und auch nicht die, die Jerusalem verbrennen; vielmehr stehen sie eine Zeit lang im Dienst des Richters.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܒܕܩܢܐ
  choice: die Feinde …, die Zion zu Fall bringen
  rationale: Im Kontext bezeichnet das Wort die gegen Zion handelnden Zerstörer. Die Formulierung gibt die feindliche Rolle und die bewirkte Vernichtung in natürlichem Deutsch wieder, ohne ihnen letztgültige Eigenmacht zuzuschreiben.
- source_word: ܡܘܩܕܝܢ
  choice: die … Jerusalem verbrennen
  rationale: Das Partizip bezeichnet diejenigen, die Jerusalem in Brand setzen bzw. verbrennen.
- source_word: ܠܕܝ̈ܢܐ ܡܫܡܫܝܢ
  choice: dienen … den Gerichten
  rationale: Der überlieferte syrische Text weist bei ܕܝ̈ܢܐ Pluralmarkierung auf und bedeutet daher am unmittelbarsten „den Gerichten/Urteilen dienen“. ܡܫܡܫܝܢ bezeichnet dienendes oder vollziehendes Handeln.
- source_word: ܒܙܒܢܐ
  choice: für eine Zeit
  rationale: Bewahrt die zeitliche Begrenzung des Handelns.
theological_decisions:
- issue: Sind die Zerstörer eigenmächtige Feinde oder zeitweilige Werkzeuge göttlichen Gerichts?
  choice: Die Feinde werden als solche benannt, zugleich aber als zeitweilig den Gerichten dienend dargestellt.
  alternative: „Diener des Richters“
  rationale: Die Spannung zwischen menschlicher Täterschaft und ihrer begrenzten Funktion im Gericht bleibt erhalten. Der sichtbare syrische Text hat den Plural „Gerichte/Urteile“; die traditionelle Deutung auf den Richter wird deshalb nur als Variante vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hervorhebung „Nicht … sind es“ bewahrt den Gegensatz des syrischen Satzes; „mit eigenen Augen“ ist die natürliche deutsche Entsprechung der wörtlichen Wendung „mit deinen Augen“.
