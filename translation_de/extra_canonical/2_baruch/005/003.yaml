  verdict: revise
  source_fidelity: Die Schlusswendung ܠܕܝܢܐ ܡܫܡܫܝܢ bezeichnet, im Einklang mit dem englischen Audit Trail, Diener bzw. Beauftragte des Richters, nicht ein Dienen „den Gerichten“. Die zeitliche Bestimmung ܒܙܒܢܐ ist mit „eine Zeit lang“ angemessen wiedergegeben. Die Gegenüberstellung von Zerstörern/Brandstiftern und ihrer nur zeitweiligen Funktion bleibt erhalten.
  naturalness: Der Entwurf ist insgesamt gut verständlich und würdig. „Sie stehen eine Zeit lang im Dienst des Richters“ ist im modernen Standarddeutsch idiomatisch und macht die agentive Rolle klarer als „sie dienen ... den Gerichten“.
  terminology: „Richter“ gibt ܕܝܢܐ treffend wieder; „Diener“ bzw. „im Dienst ... stehen“ gibt ܡܫܡܫܝܢ wieder. Die Fußnote und die zugehörigen Entscheidungen behaupten fälschlich, der Text verlange einen Plural „Gerichte“, und müssen daher entfallen.
  issues:
  - severity: high
    issue: Die Wiedergabe „den Gerichten“ und die Fußnote setzen einen Plural voraus.
    rationale: Die maßgebliche Lesung und der englische Audit Trail verstehen ܕܝܢܐ als „der Richter“. Damit ist die Aussage, die Zerstörer dienten Gerichten/Urteilen, nicht quellentreu und verwischt die Aussage, dass sie zeitweilig als Diener des Richters handeln.
