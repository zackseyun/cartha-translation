  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: de
  text: '1 Und ich sagte: »Dann habe ich also vergeblich gehofft, und vergeblich wurde Zion erbaut. Denn wenn die, die uns hassen, Zion in Besitz genommen haben, was wirst du dann für deinen großen Namen tun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒܪܬܝ
  choice: ich habe gehofft
  rationale: Das syrische Verb bezeichnet Hoffen oder Erwarten; im klagenden Zusammenhang passt „gehofft“ am besten.
- source_word: ܨܗܝܘܢ
  choice: Zion
  rationale: Der biblische Orts- und Symbolname wird in seiner geläufigen deutschen Form beibehalten.
- source_word: ܐܝܠܝܢ ... ܠܐܬܪܐ
  choice: die, die uns hassen, [haben] Zion in Besitz genommen
  rationale: Die überlieferte Zeile ist im bereitgestellten Seitenkorpus textlich schwer gestört. Die Fassung folgt dem durch die Kontrollüberlieferung gestützten Sinn, dass die Feinde Zion an sich gebracht haben, ohne ihnen endgültige Herrschaft zuzuschreiben.
- source_word: ܫܡܐ ܪܒܐ
  choice: deinen großen Namen
  rationale: Die wörtliche und im biblischen Deutsch verständliche Wendung bewahrt den Bezug auf Gottes Ansehen und Selbstoffenbarung.
theological_decisions:
- issue: Bedeutung der Einnahme Zions
  choice: Die Feinde haben das geschichtliche Zion tatsächlich in Besitz genommen; die Frage bestreitet aber nicht Gottes letztgültigen Anspruch.
  alternative: Die Feinde hätten keine wirkliche Gewalt über Zion ausgeübt.
  rationale: Der Vers formuliert Baruchs Klage und lässt die Spannung zur anschließenden göttlichen Antwort bestehen, statt sie vorweg aufzulösen.
- issue: Der „große Name“ Gottes
  choice: Die offene Frage bleibt als Berufung auf Gottes Namen stehen.
  alternative: Die Frage ausdrücklich als Aussage über die Bewahrung von Gottes Ehre auslegen.
  rationale: Der Text selbst fragt, was Gott tun wird; eine dogmatisch ausformulierte Antwort gehört nicht in diesen Vers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „vergeblich“ und die rhetorische Frage wurden bewahrt. Das Subjekt „Zion“ wird im Bedingungssatz wiederholt, um den Bezug des Pronomens im Deutschen eindeutig und flüssig zu machen.
