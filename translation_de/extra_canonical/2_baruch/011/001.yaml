  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: de
  text: 'Dann sagte ich, Baruch: »Und ich sagte zu dir, Babylon: ›Wenn es dir gut ergangen wäre und Zion in seiner Herrlichkeit gewohnt hätte, wäre unser Schmerz dennoch groß gewesen, weil du Zion gleichgestellt worden wärst. Doch nun sieh: Der Schmerz ist unendlich und die Klage kennt kein Maß, denn Babylon ist es gut ergangen, während Zion verwüstet daliegt. Wer kann über diese Dinge urteilen? Oder bei wem sollen wir Klage erheben über das, was uns widerfahren ist? Herr, wie hast du das ertragen? Unsere Väter gingen ohne Schmerz zur Ruhe, und sieh: Die Gerechten schlafen still in der Erde, denn sie kannten diese Not nicht und hatten auch nicht gehört, was uns widerfahren ist. Hättest du doch Ohren, Erde, und hättest du doch ein Herz, Staub! Dann könntest du hingehen, es im Scheol[a] verkünden und zu den Toten sagen: Glücklich seid ihr, glücklicher als wir, die wir leben.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Scheol: antike Bezeichnung für den Bereich der Toten; nicht ohne Weiteres gleichbedeutend mit »Hölle«.'
    reason: Der transliterierte Begriff bewahrt die historische Vorstellungswelt, benötigt für heutige Leserinnen und Leser aber eine knappe Erläuterung.
lexical_decisions:
- source_word: ܐܡ̇ܪ ܐܢܐ ... ܒܪܘܟ
  choice: Dann sagte ich, Baruch
  rationale: Die schlichte Erzählform bewahrt Baruch als Sprecher und gibt den fortführenden Charakter des Kapitelanfangs wieder, ohne den beschädigt überlieferten Anschluss zu überdeuten.
- source_word: ܒܒܠ
  choice: Babylon
  rationale: Babylon bleibt als personifizierte Stadt direkt angeredet; der Eigenname wird nicht zu einer allgemeinen Bezeichnung für eine Weltmacht erweitert.
- source_word: prosperity language in the Babylon address
  choice: wenn es dir gut ergangen wäre / Babylon ist es gut ergangen
  rationale: Diese idiomatische Formulierung gibt Wohlergehen und Erfolg wieder, ohne zwingend moralische Billigung oder materiellen Reichtum einzutragen.
- source_word: ܨܗܝܘܢ
  choice: Zion
  rationale: Die im Deutschen übliche biblische Namensform erhält die Personifikation der Stadt.
- source_word: desolation language for Zion
  choice: verwüstet daliegt
  rationale: Die Formulierung hält den bildhaften Gegensatz zwischen Babylons Wohlergehen und Zions Zustand fest und bewahrt den Klagecharakter.
- source_word: ܫܝܘܠ
  choice: Scheol
  rationale: Der antike Begriff für den Bereich der Toten wird transliteriert, statt ihn vorschnell mit Grab, Hölle oder Hades gleichzusetzen.
theological_decisions:
- issue: Baruchs erstaunte Klage an Gott
  choice: Herr, wie hast du das ertragen?
  alternative: Herr, wie konntest du das zulassen?
  rationale: Die gewählte Fassung bewahrt das Motiv des Tragens beziehungsweise Ertragens. Sie verschärft die Klage nicht zu einer ausdrücklichen Anklage, Gott habe das Geschehen aktiv erlaubt.
- issue: Bezeichnung des Totenreichs
  choice: Scheol
  alternative: Totenreich / Grab / Hades
  rationale: Die Transliteration wahrt den jüdischen Vorstellungsrahmen der Schrift und legt keine spätere, systematisierte Lehre über den Zustand nach dem Tod fest.
- issue: Tod als Ruhe und Schlaf
  choice: gingen ... zur Ruhe / schlafen still in der Erde
  alternative: starben / liegen begraben
  rationale: Die überlieferten Ruhe- und Schlafbilder bleiben erhalten, ohne daraus eine bestimmte Lehre über Bewusstsein oder Nichtbewusstsein der Toten abzuleiten.
translation_notes:
  register: Moderne, gut verständliche Standardsprache in würdigem Klage- und Gebetsregister. Die personifizierten Anreden an Babylon, Erde und Staub sowie die verschachtelte direkte Rede bleiben erhalten. »Sieh« gibt den deiktischen Nachdruck wieder; »Glücklich« vermeidet ein unnötig kirchensprachliches Register, ohne die Seligpreisungsform abzuschwächen.
