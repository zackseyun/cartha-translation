  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: de
  text: Denn was gewesen ist, geht in den Verfall über,[a] und was verfällt, sinkt aus dem Gedächtnis und wird vergessen. Was aber kommen wird, danach wird gesucht; was der Hand entglitten ist, wird nicht mehr berücksichtigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vergeht zum Verfall hin“.'
    reason: Die syrische Wendung ܚܠܦ ܠܡܬܚܒܠܘ kann sowohl den Übergang in den Verfall als auch das Vergehen zum Verfall hin ausdrücken.
lexical_decisions:
- source_word: ܚܠܦ ܠܡܬܚܒܠܘ
  choice: geht dem Verfall entgegen
  rationale: ܚܠܦ kann ein Vorüber- oder Hinübergehen bezeichnen; zusammen mit dem Infinitiv von ܚܒܠ gibt die Formulierung den Übergang in Verderben bzw. Verfall wieder, ohne eine stärkere Aussage über völlige Vernichtung einzutragen.
- source_word: ܒܥܘܗܕܢܐ ܢܦܠܐ ܘܡܬܛܥܐ
  choice: fällt aus dem Gedächtnis und wird vergessen
  rationale: Die wörtlich schwierige Verbindung von „fallen“ und „Gedächtnis/Erinnerung“ wird als im Deutschen idiomatisches „aus dem Gedächtnis fallen“ wiedergegeben; ܡܬܛܥܐ ist passivisch „wird vergessen“.
- source_word: ܡܬܒܥܐ
  choice: danach wird gesucht
  rationale: Bewahrt die passive bzw. unpersönliche Aussage des Syrischen und den Gegensatz zwischen dem Kommenden und dem Vergangenen.
- source_word: ܥܒܪ ܡܢ ܐܝܕܐ
  choice: der Hand entglitten ist
  rationale: Die bildhafte Rede vom Vorübergehen bzw. Fortgehen „aus der Hand“ wird in natürlichem Deutsch bewahrt.
- source_word: ܡܬܚܫܒ
  choice: wird … berücksichtigt
  rationale: Gibt das semantische Feld von rechnen, anrechnen oder in Betracht ziehen hier verständlich wieder, ohne die Aussage auf bloßes Zählen zu verengen.
theological_decisions:
- issue: Bedeutung von „Verfall/Verdorbenwerden“
  choice: Verfall
  alternative: Verderben oder Vernichtung
  rationale: „Verfall“ wahrt den vergänglichkeitstheologischen Zusammenhang und vermeidet die unbelegte Präzisierung, dass völlige Vernichtung gemeint sei.
- issue: Bezug des Gesuchten
  choice: das künftig Kommende
  alternative: eine bestimmte endzeitliche Person oder Heilswirklichkeit
  rationale: Das Syrische spricht allgemein von dem, was künftig sein bzw. kommen wird; eine nähere dogmatische Identifikation wird nicht eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallel gebauten Gegensätze zwischen Vergangenem und Kommendem bleiben deutlich; schwierige syrische Bilder werden möglichst erhalten und nur dort idiomatisch geglättet, wo eine streng wörtliche Wiedergabe im Deutschen missverständlich wäre.
