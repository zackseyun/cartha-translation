  source_fidelity: 'Die Grundstruktur und die Gegensätze von Vergangenem, Verderben, Vergessen, Kommendem und Berücksichtigen sind zutreffend erfasst. „geht dem Verfall entgegen“ schwächt jedoch die syrische Bewegungsformel ܚܠܦ ܠܡܬܚܒܠܘ ab: Sie bezeichnet eher ein Übergehen in den Verfall bzw. ein Vergehen zum Verderben als bloß eine Annäherung daran.'
