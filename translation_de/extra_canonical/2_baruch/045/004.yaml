  to: Denn was gewesen ist, geht in den Verfall über,[a] und was verfällt, sinkt aus dem Gedächtnis und wird vergessen. Was aber kommen wird, danach wird gesucht; was der Hand entglitten ist, wird nicht mehr berücksichtigt.
