  terminology: „Verfall“ ist als zurückhaltende Wiedergabe von ܚܒܠ angemessen. „berücksichtigt“ gibt ܡܬܚܫܒ im Kontext plausibel wieder. Es sind keine problematischen theologischen Festlegungen oder Namensfragen vorhanden.
