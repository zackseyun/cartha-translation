  - severity: low
    issue: Die Fußnote bietet als Alternative genau die quellennähere Formulierung, während der Haupttext die abgeschwächte Lesart wählt.
    rationale: Die Hauptfassung sollte die direkte, natürliche Wiedergabe „geht in den Verfall über“ tragen; die Fußnote kann die alternative Nuance des Vergehens benennen.
  revised_text: Denn was gewesen ist, geht in den Verfall über,[a] und was verfällt, sinkt aus dem Gedächtnis und wird vergessen. Was aber kommen wird, danach wird gesucht; was der Hand entglitten ist, wird nicht mehr berücksichtigt.
