  text: And if there are any who are appointed for it, it is not withheld from them; and for those who live in it, they will not be led to destruction.
translation:
  language: de
  text: Und wenn es welche gibt, die dafür bestimmt sind, wird es ihnen nicht vorenthalten; und diejenigen, die darin leben, werden nicht ins Verderben geführt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für diejenigen, die darin leben, gibt es kein Führen ins Verderben.“'
    reason: Die syrische Formulierung kann neben dem personenbezogenen Passiv auch unpersönlich verstanden werden.
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: bestimmt sind
  rationale: Das syrische Wort bezeichnet hier Personen, für die etwas vorgesehen oder bestimmt ist; die Wiedergabe lässt den im Zusammenhang nicht ausdrücklich genannten Bezug offen.
- source_word: ܠܐ ܡܬܚܣܟ
  choice: wird es ihnen nicht vorenthalten
  rationale: Die passive Form drückt aus, dass das zuvor Gemeinte den dafür Bestimmten nicht entzogen oder verweigert wird.
- source_word: ܐܒܕܢܐ
  choice: Verderben
  rationale: „Verderben“ gibt den umfassenden Sinn von Untergang beziehungsweise Vernichtung in einem würdigen biblischen Register wieder.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in „wird es nicht vorenthalten“
  choice: Das Pronomen „es“ bleibt ohne nähere inhaltliche Festlegung.
  alternative: Den Bezug ausdrücklich als künftiges Heil oder künftige Welt bestimmen.
  rationale: Der syrische Vers setzt den Bezug aus dem Kontext voraus; eine Präzisierung würde die im Text bestehende Offenheit theologisch verengen.
- issue: Unpersönliche oder personenbezogene Deutung von ܠܐ ܡܘܒܠܐ ܠܐܒܕܢܐ
  choice: 'Als personenbezogenes Passiv: „werden nicht ins Verderben geführt“.'
  alternative: 'Unpersönlich: „gibt es kein Führen ins Verderben“.'
  rationale: Der unmittelbar vorausgehende Ausdruck „die darin leben“ legt eine personenbezogene deutsche Fassung nahe, während die Fußnote die grammatisch mögliche unpersönliche Lesart bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mehrfachen unbestimmten Bezüge des syrischen Textes werden nicht durch zusätzliche theologische Begriffe aufgelöst; das Semikolon bewahrt den engen Zusammenhang der beiden Aussagen.
