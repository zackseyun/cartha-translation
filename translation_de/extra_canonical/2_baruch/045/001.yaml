  yaml_path: translation/extra_canonical/2_baruch/045/001.yaml
  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: de
  text: 1 … die zum Verderben und zu seinen Wegen gehören, zu Wegen, die unergründlich sind, wie immer sie auch beschaffen sein mögen.[a] Wenn ihr aber ausharrt, in Ehrfurcht vor ihm standhaft bleibt und nicht von seinem Gesetz abirrt, werden sich die Zeiten zu ihrer Zeit zum Guten wenden, und ihr werdet den Trost Zions sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine schwer verständliche Wiederholung: „und sie sind sie“; möglicherweise ist gemeint: „welcher Art sie auch sein mögen“.'
    reason: Die syrische Wendung ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ ist idiomatisch und in ihrer genauen Funktion nicht völlig durchsichtig. Die Fußnote dokumentiert dies, ohne die im Haupttext gewählte vorsichtige Wiedergabe zu überdeuten.
lexical_decisions:
- source_word: ܕܝܠܗ ܕܚܒܠܬܐ
  choice: die zum Verderben gehören
  rationale: Die Formulierung bewahrt die Zugehörigkeitsaussage des Syrischen und gibt ܚܒܠܬܐ als „Verderben“ wieder, ohne die Aussage auf bloße Vergänglichkeit oder moralische Verdorbenheit einzuengen.
- source_word: ܐܘܪ̈ܚܬܗ ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: seine unerforschlichen Wege
  rationale: Das Partizip bezeichnet Wege, die sich nicht ergründen oder erforschen lassen. „Unerforschlich“ ist knapp, würdig und erhält die sachliche Unbestimmtheit.
- source_word: ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ
  choice: wie sie auch beschaffen sein mögen
  rationale: Die schwerfällige syrische Wiederholung wird als idiomatische Unbestimmtheitsformel verstanden. Die Wiedergabe lässt offen, welcher Art diese Wege sind, statt sie näher zu erklären.
- source_word: ܬܣܝܒܪܘܢ
  choice: ihr ausharrt
  rationale: Das Verb bezeichnet geduldiges Ertragen und standhaftes Durchhalten. „Ausharren“ passt zum mahnenden und eschatologischen Zusammenhang.
- source_word: ܡܬܚܠܦܝܢ ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: werden sich die Zeiten zu ihrer bestimmten Zeit zum Guten wenden
  rationale: Die Wendung erhält sowohl den Wandel der Zeiten als auch ihren festgesetzten Zeitpunkt. „Zum Guten wenden“ ist natürliches Deutsch, ohne den apokalyptischen Zeitenwechsel zu verflachen.
- source_word: ܒܘܝܐܐ ܕܨܝܘܢ
  choice: den Trost Zions
  rationale: ܒܘܝܐܐ bezeichnet Trost oder Tröstung. „Trost Zions“ bewahrt den gemeinschaftlichen und eschatologischen Bezug auf Zion.
theological_decisions:
- issue: Das Verhältnis von menschlicher Treue und dem kommenden Guten
  choice: Die Bedingung wird als Aufforderung zum Ausharren, zur Gottesfurcht und zur Treue gegenüber dem Gesetz wiedergegeben; darauf folgt der verheißene Wandel der Zeiten.
  alternative: Die Aussage als Verdienstschema oder als bedingungslose Verheißung zu formulieren.
  rationale: Der syrische Wenn-Satz setzt menschliche Standhaftigkeit und die kommende Wende eng zueinander, erklärt aber nicht systematisch, ob ein kausales Verdienstverhältnis gemeint ist. Diese Spannung bleibt erhalten.
- issue: Zions künftige Wiederherstellung
  choice: den Trost Zions
  alternative: allgemeine Rettung oder persönlicher Trost
  rationale: Der Text nennt ausdrücklich Zion. Die Übersetzung verallgemeinert diese Hoffnung nicht und deutet den Genitiv weder ausschließlich subjektiv noch objektiv aus.
- issue: Gottesbezug der Pronomen
  choice: in Ehrfurcht vor ihm … von seinem Gesetz
  alternative: seine Furcht … sein Gesetz ohne ausdrückliche Verdeutlichung des Bezugs
  rationale: Der Gottesbezug ergibt sich aus dem Zusammenhang. „Ehrfurcht vor ihm“ ist im modernen Deutschen verständlich, ohne „Furcht“ als bloße Angst zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Der Satzanfang bleibt mit Auslassungszeichen offen, da Vers 1 mitten in einer Aussage einsetzt. Apokalyptische Schlüsselbegriffe wie „Zeiten“, „Gesetz“, „Zion“ und „Trost“ werden beibehalten; unnötig konfessionelle Terminologie wird vermieden.
