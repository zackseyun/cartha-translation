  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: de
  text: Denn wenn die Zeit kommt, die nicht vergeht, und ihre Stunde eintrifft, ordnet sie ihre Taten und untersucht ihre Sünden. Diejenigen, die zu ihr gehören, fügen dem Verderben keine Bedrängnis hinzu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܕ
  choice: die Zeit, die nicht vergeht
  rationale: Die Wendung bezeichnet wörtlich eine nicht vorübergehende Zeit; die auffällige Personifizierung wird entsprechend dem syrischen Satzbau bewahrt.
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: ordnet sie ihre Taten
  rationale: ܡܫܘܐ kann hier das Ordnen beziehungsweise Zurechtbringen ausdrücken; „Taten“ gibt ܥܒܕܘܗܝ natürlich und sachlich wieder.
- source_word: ܡܒܩܪ ܚܛܗܝܗ̇
  choice: untersucht ihre Sünden
  rationale: Die Grundbedeutung des Verbs ist prüfen oder untersuchen. Das feminine Suffix wird auf die grammatisch feminine „Zeit“ bezogen, ohne die ungewöhnliche Aussage zu glätten.
- source_word: ܠܐܚܝܕܝܢ ܕܡܢܘܗܝ ܐܢܘܢ
  choice: Diejenigen, die zu ihr gehören
  rationale: Die textlich schwierige Formulierung beschreibt Personen, die an dieser Zeit Anteil haben beziehungsweise ihr zugehören; die neutrale Fassung vermeidet eine überpräzise Deutung.
- source_word: ܥܘܩܢ ... ܚܒܠܐ
  choice: Bedrängnis ... Verderben
  rationale: 'Die beiden Unheilsbegriffe werden unterschieden: ܥܘܩܢ als Bedrängnis/Not und ܚܒܠܐ als Verderben/Zerstörung.'
theological_decisions:
- issue: Personifizierung der kommenden, nicht vergehenden Zeit
  choice: Die Zeit bleibt Subjekt ihrer Taten und Sünden.
  alternative: Gott oder ein endzeitlicher Richter ordnet die Taten und untersucht die Sünden.
  rationale: Die unmittelbar vorliegende Grammatik und die englische Kontrollfassung beziehen die Pronomina auf die Zeit. Die theologisch ungewöhnliche Spannung wird nicht durch einen unausgesprochenen Subjektwechsel beseitigt.
- issue: Beziehung der Zugehörigen zur kommenden Zeit
  choice: „die zu ihr gehören“
  alternative: „die sich an sie halten“ oder „die von ihr ergriffen sind“
  rationale: Der syrische Text ist an dieser Stelle schwer und möglicherweise beschädigt. Die gewählte Formulierung bewahrt den Zugehörigkeitsgedanken, ohne die Art dieser Beziehung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche Bildsprache und die Personifizierung der Zeit wurden bewusst erhalten; zugleich wurde die Syntax so geglättet, dass der Vers für heutige Leser verständlich bleibt.
