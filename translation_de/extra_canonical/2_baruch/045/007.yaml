  text: Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.
translation:
  language: de
  text: Und alle, die sichtbar werden möchten,[a] sollen sich vor der genannten Zeit in Acht nehmen und die Last[b] der Zeit des Erwachens[c] hinter sich lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die erscheinen möchten“. Die syrische Verbform ist formal passiv beziehungsweise reflexiv; eine aktive Wiedergabe „die sehen möchten“ ist ebenfalls vorgeschlagen worden.'
    reason: Die Form ܕܢܬܚܙܝܢ ist grammatisch mehrdeutig und soll nicht ohne Hinweis aktiv verstanden werden.
  - marker: b
    text: 'Oder: „die Schuld“ beziehungsweise „die Verpflichtung“.'
    reason: ܚܘܒܐ kann Last, Schuld oder Verpflichtung bezeichnen.
  - marker: c
    text: Das syrische Wort kann auch „der erregten“, „der unruhigen“ oder, im Kontext, „der bedrängten Zeit“ bedeuten; die genaue Nuance ist unsicher.
    reason: ܕܡܥܝܪ ist lexikalisch und kontextuell nicht eindeutig; „Erwachen“ hält die Grundbedeutung offen.
lexical_decisions:
- source_word: ܕܢܬܚܙܝܢ
  choice: es sehen möchten
  rationale: Im Zusammenhang ist das Erleben beziehungsweise Sehen des angekündigten Zukünftigen gemeint. Die syrische Form kann formal auch passiv verstanden werden; diese Mehrdeutigkeit wird in Fußnote [a] offengelegt.
- source_word: ܕܢܬܙܗܪܘܢ
  choice: sich … in Acht nehmen
  rationale: Gibt den Gedanken des Wachseins, Aufmerkens und vorsichtigen Verhaltens in natürlichem modernem Deutsch wieder.
- source_word: ܚܘܒܐ
  choice: Last
  rationale: Das Wort kann Schuld, Verpflichtung oder etwas Geschuldetes bezeichnen. Im vorliegenden Bedrängniskontext vermittelt „Last“ den Sinn verständlich, ohne die mögliche Schuldnuance zu verschweigen.
- source_word: ܕܡܥܝܪ
  choice: aufgewühlten
  rationale: Das Partizip bezeichnet etwas Wachendes, Weckendes oder Erregtes. „Aufgewühlt“ bewahrt den unruhigen Charakter der betreffenden Zeit und entspricht der kontextuellen Deutung als bedrängte Zeit.
theological_decisions:
- issue: Bezug des ersehnten Sehens
  choice: Neutrales Pronomen „es“ ohne ausdrückliche Identifizierung
  alternative: „die künftige Welt“ oder „Zions Trost“ ausdrücklich nennen
  rationale: Der unmittelbare Vers nennt den Gegenstand nicht eindeutig. Eine nähere theologische Festlegung würde mehr in den Text eintragen, als die syrische Form ausdrücklich sagt.
- issue: Bedeutung von ܚܘܒܐ
  choice: Als „Last“ wiedergegeben
  alternative: „Schuld“ oder „Verpflichtung“
  rationale: Der Text kann sowohl Belastung als auch Schuldverpflichtung anklingen lassen. Die Hauptübersetzung folgt dem Bedrängniskontext; die Fußnote hält die andere Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am syrischen Parallelismus, wird jedoch für gewöhnliche heutige Leser geglättet. Echte lexikalische und syntaktische Unsicherheiten werden durch Fußnoten sichtbar gehalten.
