  source_fidelity: 'Der Satz entspricht dem syrischen Text und der englischen Kontrollfassung weitgehend: Das Vergängliche/Verderbliche vergeht, wird zunichte, und die vergangene Zeit wird vergessen und nicht mehr im Gedenken gesucht. „Von nun an“ ist jedoch keine tragfähige Wiedergabe von ܡܟܝܠ („ferner, weiterhin, künftig/nicht mehr“), da es einen neuen zeitlichen Ausgangspunkt einführt.'
  naturalness: Der Entwurf ist gut verständlich und würdig. Die Formulierung „danach sucht man sie auch nicht mehr in der Erinnerung“ ist allerdings syntaktisch und semantisch weniger klar als eine direkte passive Wiedergabe von „im Gedenken gesucht werden“.
  terminology: „Vergängliche“ ist für ܡܬܚܒܠ passend und vermeidet eine unbegründet moralische Lesart. „Zu nichts werden“ gibt den überlieferten Sinn angemessen wieder. „Gedenken“ passt in diesem literarisch-gehobenen Register besser als „Erinnerung“ und wahrt die ungewöhnliche Such-Metapher.
  issues:
