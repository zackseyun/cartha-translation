revisions:
- from: Denn alles Vergängliche vergeht und wird zu nichts. Die vergangene Zeit gerät von nun an in Vergessenheit, und danach sucht man sie auch nicht mehr in der Erinnerung.
  to: Denn alles Vergängliche vergeht und wird zunichte, und die Zeit, die gewesen ist, gerät in Vergessenheit; auch wird sie nicht mehr im Gedenken gesucht.
  rationale: Die Revision entfernt die nicht gedeckte zeitliche Präzisierung „von nun an“, gibt die passive Aussage der Vorlage unmittelbarer wieder und ersetzt „Erinnerung“ durch das im Kontext passendere „Gedenken“. Die knappe, reflektierende Satzstruktur bleibt erhalten.
