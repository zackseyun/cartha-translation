  text: For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.
translation:
  language: de
  text: Denn alles Vergängliche vergeht und wird zunichte, und die Zeit, die gewesen ist, gerät in Vergessenheit; auch wird sie nicht mehr im Gedenken gesucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠ
  choice: vergänglich
  rationale: Das syrische Partizip bezeichnet hier das, was dem Verderben beziehungsweise Verfall unterliegt; „vergänglich“ gibt dies im Zusammenhang natürlich und prägnant wieder.
- source_word: ܐܙܠ ܠܐ ܡܢ ܕܡܢܐ
  choice: vergeht und wird zu nichts
  rationale: Die offenbar fehlerhaft überlieferte beziehungsweise erkannte Wortfolge wird im Einklang mit dem erkennbaren Sinn des syrischen Satzes und der Kontrollübersetzung als Übergang ins Nichts wiedergegeben.
- source_word: ܡܬܛܥܐ
  choice: gerät … in Vergessenheit
  rationale: Die passive Bedeutung „wird vergessen“ wird idiomatisch ausgedrückt, ohne die Aussage zu verstärken.
- source_word: ܡܬܒܥܐ ܒܥܘܗܕܢܐ
  choice: sucht man … in der Erinnerung
  rationale: Die ungewöhnliche Verbindung von „suchen“ und „Erinnerung/Gedenken“ bleibt erkennbar, wird aber in verständliches modernes Deutsch gefasst.
theological_decisions:
- issue: Reichweite der Vergänglichkeitsaussage
  choice: alles Vergängliche
  alternative: alles Verderbliche
  rationale: „Vergänglich“ wahrt die allgemeine Aussage über das dem Verfall Unterworfene, ohne sie moralisch als „verderbt“ oder „böse“ umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zeitphilosophische Aussage bleibt knapp und bewusst spannungsvoll; die ungewöhnliche Vorstellung, Vergangenes werde nicht mehr „in der Erinnerung gesucht“, wird nicht zu einer stärkeren theologischen Behauptung ausgeweitet.
