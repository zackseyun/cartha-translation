  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: de
  text: Die aber, die sich der Finsternis[a] zuwandten, Lügen annahmen, den Halt ihrer Hoffnung verloren, Nichtigkeiten nachjagten[b], kein Erbarmen zeigten und den Weg der Unterweisung nicht einhielten –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei einer abweichenden Lesung: „der Bedrängnis“.'
    reason: Die kontrollierte Lesart wird mit „Finsternis“ wiedergegeben; die abweichende Deutung soll als textliche Alternative kenntlich bleiben.
  - marker: b
    text: 'Oder, bei passiver Auffassung der syrischen Form: „in Nichtigkeiten gesucht wurden“.'
    reason: Die überlieferte Verbform bzw. der beschädigte Kontext erlaubt neben der bevorzugten medial-aktiven Wiedergabe eine passive Deutung.
lexical_decisions:
- source_word: ܚܫܘܟܐ
  choice: Finsternis
  rationale: Das syrische Wort bezeichnet Dunkelheit; „Finsternis“ bewahrt hier den würdevollen, ethisch-symbolischen Klang.
- source_word: ܕ̈ܓܠܐ
  choice: Lügen
  rationale: Der Plural bezeichnet Unwahrheiten beziehungsweise Täuschungen; „Lügen“ ist unmittelbar und natürlich.
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: den festen Grund der Hoffnung
  rationale: Die Wendung bezeichnet den gefestigten beziehungsweise verlässlichen Halt der Hoffnung. Die Wiedergabe vermeidet das unnatürliche „Festigkeit der Hoffnung“, ohne den Sinn zu verengen.
- source_word: ܒܗܘܐܢܬ ܐܬܒܥܝܘ
  choice: Nichtigkeiten nachjagten
  rationale: Die beschädigt beziehungsweise schwer lesbar überlieferte Form lässt eine passive oder medial-reflexive Deutung zu; im Zusammenhang ist eine aktive deutsche Form am verständlichsten.
- source_word: ܪ̈ܚܡܐ
  choice: Erbarmen
  rationale: Das Wortfeld umfasst Erbarmen, Barmherzigkeit und Mitgefühl; „Erbarmen zeigen“ passt idiomatisch zur negierten Aussage.
- source_word: ܡܘܣܪ
  choice: Zucht
  rationale: Gemeint ist erziehende Unterweisung und sittliche Disziplin. „Zucht“ hält die knappe, weisheitliche Ausdrucksweise fest, ohne eine konfessionelle Deutung einzutragen.
theological_decisions:
- issue: Ethisch-symbolische Zielrichtung der Hinwendung
  choice: Finsternis
  alternative: Bedrängnis
  rationale: Die kontrollierte syrische Lesart ܚܫܘܟܐ bedeutet „Finsternis“. Eine Wiedergabe als „Bedrängnis“ würde ein anderes syrisches Wort voraussetzen und den Licht-Finsternis-Gegensatz abschwächen.
- issue: Art des Verlusts der Hoffnung
  choice: den festen Grund der Hoffnung verloren
  alternative: den Schatz der Hoffnung verloren
  rationale: Die Formulierung soll den Verlust des verlässlichen Halts der Hoffnung ausdrücken, ohne den abstrakten Ausdruck dogmatisch auszudeuten; die nominale Wendung kann jedoch auch bildhafter verstanden werden.
- issue: Bedeutung von ܡܘܣܪ
  choice: Zucht
  alternative: Unterweisung
  rationale: „Zucht“ umfasst hier sittliche Erziehung und Disziplin. „Unterweisung“ wäre ebenfalls möglich, betonte aber den lehrhaften Aspekt stärker.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit weisheitlich-mahnendem Ton. Der Satz bleibt wegen des folgenden Verses mit einem Gedankenstrich offen. „Zucht“ ist bewusst traditioneller als der übrige Wortlaut, aber im Kontext verständlich und semantisch breiter als bloße Belehrung.
