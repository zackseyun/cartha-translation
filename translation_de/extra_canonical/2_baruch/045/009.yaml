  text: they desire to inquire into the hidden anguish of the people to come; but the visitation of that matter by which many were justified they will not see.
translation:
  language: de
  text: Sie wünschen, die verborgene Bedrängnis des kommenden Volkes zu ergründen; doch die Heimsuchung der Sache, worin viele gerechtfertigt wurden,[a] werden sie nicht sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als gerecht erwiesen wurden“.'
    reason: Das syrische Verb kann sowohl forensisch als „gerechtfertigt“ als auch erweisend als „für gerecht befunden“ verstanden werden.
lexical_decisions:
- source_word: ܥܘܩܢ
  choice: Bedrängnis
  rationale: Bezeichnet Not, Bedrückung oder leidvolle Bedrängnis; „Bedrängnis“ wahrt den ernsten, eschatologischen Ton.
- source_word: ܡܬܚܣܟ
  choice: verborgen
  rationale: Gibt hier den Sinn von verborgen beziehungsweise vorenthalten wieder und entspricht der syntaktischen Verbindung mit der zu ergründenden Bedrängnis.
- source_word: ܡܒܩܪܐ
  choice: Heimsuchung
  rationale: Das Wort kann Untersuchung, Aufsuchen oder göttliche Heimsuchung bezeichnen. „Heimsuchung“ bewahrt die mögliche gerichtliche beziehungsweise göttliche Dimension, ohne sie näher festzulegen.
- source_word: ܐܙܕܕܩܘ
  choice: gerechtfertigt wurden
  rationale: Die Ethpaal-Form der Wurzel z-d-q bezeichnet hier, dass viele als gerecht erwiesen oder gerechtfertigt wurden; die passive Form bleibt erhalten.
theological_decisions:
- issue: Bedeutung der Rechtfertigungsaussage
  choice: „gerechtfertigt wurden“
  alternative: „als gerecht erwiesen wurden“
  rationale: Die Übersetzung wahrt die passive theologische Spannung des syrischen Verbs und legt weder den Vorgang noch den Handelnden näher fest.
- issue: Charakter der Heimsuchung
  choice: „Heimsuchung“ ohne ausdrückliche Zuordnung zu Gericht oder Gnade
  alternative: „Prüfung“ oder „Untersuchung“
  rationale: Der syrische Ausdruck ist mehrdeutig; eine ausdrückliche Festlegung auf Strafgericht oder gnädiges Eingreifen würde den Text unnötig vereindeutigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Verbindung von verborgener Bedrängnis, Heimsuchung und Rechtfertigung wird nicht harmonisiert; die syntaktische und theologische Spannung des Ausgangstextes bleibt erhalten.
