lexical_decisions:
- source_word: underlying Syriac corresponding to “understands” (not present in the supplied page excerpt)
  choice: Einsicht hat
  rationale: Gibt den kognitiven Sinn natürlich und würdevoll wieder, ohne ihn auf bloßes intellektuelles Verstehen oder besondere Offenbarungserkenntnis einzuengen.
- source_word: underlying Syriac corresponding to “will be wise” (not present in the supplied page excerpt)
  choice: wird … weise sein
  rationale: Bewahrt die prädikative und zukünftige Aussage der kontrollierten Versfassung.
- source_word: therefore / but (conjunction; source line absent from supplied excerpt)
  choice: aber
  rationale: Der überlieferte Kapitelzusammenhang legt eine fortführend-kontrastive Verknüpfung nahe; „aber“ ist im Deutschen natürlicher und weniger stark folgernd als „daher“.
theological_decisions:
- issue: Art der verheißenen Weisheit
  choice: 'Die Aussage bleibt allgemein: Wer Einsicht hat, wird weise sein.'
  alternative: Wer die endzeitlichen Zeichen richtig deutet, erlangt besondere Offenbarungsweisheit.
  rationale: Der knappe Vers benennt keine besondere Erkenntnismethode und sollte nicht konfessionell oder spekulativ ausgelegt werden.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Der bereitgestellte syrische Seitenausschnitt endet offenbar mit 2 Baruch 27,10 und enthält den Wortlaut von 28,1 nicht; deshalb stützt sich die Formulierung auf die kontrollierte Versfassung und den dokumentierten Revisionsbefund. Die adversative Konjunktion bewahrt den wahrscheinlichen Zusammenhang, ohne eine stärkere Schlussfolgerung einzutragen.
