  yaml_path: translation/extra_canonical/2_baruch/001/003.yaml
  text: For the former tribes were compelled by their kings to sin, but these two tribes themselves desired to sin and compelled their kings to sin.
translation:
  language: de
  text: Denn die früheren Stämme wurden von ihren Königen gezwungen zu sündigen; diese beiden Stämme aber waren es, die ihre Könige drängten und zwangen zu sündigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ ܩܕ̈ܡܝܬܐ
  choice: die früheren Stämme
  rationale: ܫܪܒܬܐ bezeichnet hier im Zusammenhang mit den zehn und den zwei Stämmen Israels die »Stämme«; ܩܕ̈ܡܝܬܐ kontrastiert sie als die früher erwähnten beziehungsweise früher weggeführten Stämme mit den beiden verbliebenen.
- source_word: ܐܬܐܠܨܘ
  choice: wurden … gezwungen
  rationale: Die passive Form von ܐܠܨ drückt äußeren Zwang aus und bildet den Gegensatz zum aktiven Verhalten der beiden Stämme.
- source_word: ܕܚܨܘ ܘܐܠܨܘ
  choice: die … drängten und zwangen
  rationale: 'Der überlieferte syrische Wortlaut enthält zwei aktive Verben: ܚܨ bezeichnet Drängen oder Antreiben, ܐܠܨ stärkeres Nötigen beziehungsweise Zwingen. Die Wiedergabe bewahrt diese Steigerung und folgt damit unmittelbar der vorgelegten syrischen Quelle.'
- source_word: ܕܢܚܛܘܢ
  choice: zu sündigen
  rationale: Der Infinitivausdruck gibt das Ziel des Zwangs beziehungsweise Drängens an und wird im Deutschen natürlich mit »zu sündigen« wiedergegeben.
theological_decisions:
- issue: Verantwortung von Volk und Königen
  choice: 'Die gegensätzliche Verantwortungsrichtung bleibt ausdrücklich erhalten: Zuerst zwingen die Könige die Stämme, dann drängen und zwingen die beiden Stämme ihre Könige.'
  alternative: Die beiden Stämme »wollten sündigen« und zwangen ihre Könige dazu.
  rationale: Die Alternative entspricht der englischen Konsultationsfassung, wird aber vom hier vorgelegten syrischen Text ܕܚܨܘ nicht unmittelbar getragen. Daher wird keine Aussage über einen bloß inneren Wunsch eingeführt; die wechselseitige moralische Verantwortlichkeit des Textes bleibt unangetastet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion »waren es, die« hebt den im Syrischen markierten Gegensatz hervor; das Verbpaar »drängten und zwangen« wahrt die rhetorische Steigerung.
