review_pass:
  verdict: revise
  source_fidelity: Die Gegenüberstellung von äußerem Zwang bei den früheren Stämmen und aktivem Handeln der zwei Stämme ist richtig erfasst. Der vorgelegte syrische Wortlaut bietet jedoch bei ܕܚܨܘ eine Lesart, deren genaue Deutung gegenüber der im englischen Audit zugrunde gelegten Lesart („desired“) nicht ohne Weiteres identisch ist. Die deutsche Fassung sollte diese Spannung nicht durch eine eindeutige, nicht abgesicherte Deutung übergehen.
  naturalness: Der Satz ist verständlich und sprachlich würdig. „waren es, die“ ist jedoch schwerfälliger als nötig; außerdem legt „drängten und zwangen“ eine doppelte äußere Einwirkung nahe, während der englische Kontrolltext zunächst freiwilliges Wollen ausdrückt.
  terminology: „Stämme“, „Könige“, „sündigen“ und „zwangen“ sind angemessen. Für das erste aktive Verb ist angesichts der abweichenden Textgrundlagen eine vorsichtige Fußnote erforderlich.
  issues:
  - severity: medium
    issue: Abweichung vom englischen POB-Audit bei ܕܚܨܘ
    rationale: Der englische Kontrolltext und seine dokumentierte Entscheidung geben das erste Verb als „desired to sin“ wieder; die deutsche Fassung hat stattdessen „drängten“. Da der angegebene syrische Wortlaut eine davon abweichende Form überliefert, sollte die Übersetzung die Lesart transparent markieren, statt die Abweichung unkommentiert zu harmonisieren.
  - severity: low
    issue: Stilistisch markierte Hervorhebung
    rationale: „diese beiden Stämme aber waren es, die“ ist im Deutschen unnötig umständlich. „Diese beiden Stämme aber wollten selbst sündigen“ wahrt den Kontrast und liest sich natürlicher.
  revised_text: Denn die früheren Stämme wurden von ihren Königen gezwungen zu sündigen; diese beiden Stämme aber wollten selbst sündigen und zwangen ihre Könige zu sündigen.a
  revised_footnotes:
  - marker: a
    text: 'Der englischen POB-Kontrolllesart zufolge: „wollten selbst sündigen“. Der hier vorgelegte syrische Wortlaut hat an dieser Stelle eine abweichend deutbare Form, die auch „drängten ihre Könige“ verstanden werden kann.'
    reason: Macht die textliche und lexikalische Unsicherheit transparent, ohne die im englischen Audit dokumentierte Lesart als unstrittig auszugeben.
  revision_rationale: Die Revision folgt für die Grundübersetzung dem englischen POB-Audit („desired to sin“) und bewahrt den ausdrücklichen Zweckbezug zweimal mit „zu sündigen“. Zugleich dokumentiert die Fußnote, dass der vorgelegte syrische Wortlaut an der entscheidenden Stelle nicht eindeutig mit dieser Kontrolllesart übereinstimmt. Dadurch wird keine dogmatische oder harmonisierende Entscheidung verdeckt getroffen.
