  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: de
  text: Darum bringe ich nun Unheil über diese Stadt und ihre Bewohner. Sie wird für eine Zeit aus meiner Gegenwart weggenommen werden, und ich werde dieses Volk unter die Völker zerstreuen, damit es für die Völker zurückbleibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit es den Völkern verbleibt“. Der hier zugrunde gelegte syrische Wortlaut lautet „damit es für die Völker zurückbleibt“; die Übersetzung „damit es den Völkern dient“ beruht auf einem abweichenden Wortlaut.'
    reason: Der Schlusssatz ܕܠܥܡܡ̈ܐ ܢܘܬܪ ist knapp. Die Anmerkung dokumentiert die idiomatische Alternative und macht transparent, dass die im englischen Audittext vertretene Aussage vom Dienen nicht dem bereitgestellten syrischen Text entspricht.
lexical_decisions:
- source_word: ܡܝܬܐ ܐܢܐ ܒܝܫܬܐ
  choice: ich bringe nun Unheil
  rationale: Die Konstruktion bezeichnet das Herbeiführen von Schlimmem oder Unheil. „Unheil“ gibt den sachlichen Sinn im Deutschen natürlicher wieder als das missverständliche „Böses“; ܗܐ wird durch „nun“ signalisiert.
- source_word: ܘܬܬܬܪܝܡ ܡܢ ܩܕܡܝ
  choice: Sie wird aus meiner Gegenwart entfernt werden
  rationale: Das feminine Verb bezieht sich auf „diese Stadt“. Die Wendung ܡܢ ܩܕܡܝ bedeutet wörtlich „von vor mir“; „aus meiner Gegenwart“ bewahrt die relationale und theologische Aussage, ohne sie weiter auszudeuten.
- source_word: ܥܕ ܙܒܢܐ
  choice: für eine Zeit
  rationale: Die zeitliche Begrenzung bleibt bewusst unbestimmt, wie im Syrischen.
- source_word: ܘܡܒܕܪ ܐܢܐ ... ܒܝܢܬ ܥܡܡ̈ܐ
  choice: und ich werde dieses Volk unter die Völker zerstreuen
  rationale: ܡܒܕܪ bezeichnet Zerstreuen oder Verstreuen; „unter die Völker“ ist im Deutschen idiomatisch und entspricht ܒܝܢܬ ܥܡܡ̈ܐ.
- source_word: ܕܠܥܡܡ̈ܐ ܢܘܬܪ
  choice: sodass es den Völkern überlassen bleibt
  rationale: Der vorgelegte syrische Text enthält ein Verb aus dem Bedeutungsfeld „übrig bleiben/zurückbleiben“ und nicht das in der Revisionsnotiz behauptete Wort für „Diener sein“. Die Formulierung wahrt zudem den Dativ ܠܥܡܡ̈ܐ und den singularischen Bezug auf „dieses Volk“.
theological_decisions:
- issue: Göttliches Herbeiführen von ܒܝܫܬܐ
  choice: Unheil
  alternative: Böses
  rationale: „Unheil“ bezeichnet hier angekündigtes Gericht beziehungsweise Unglück und vermeidet die unnötige Aussage, Gott begehe moralisch Böses.
- issue: Entfernung der Stadt aus Gottes Gegenwart
  choice: aus meiner Gegenwart entfernt
  alternative: vor mir weggenommen
  rationale: Die Übersetzung lässt offen, ob Zerstörung, Verwerfung oder eine andere Form zeitweiliger Entfernung gemeint ist, und bewahrt damit die Spannung des Ausgangstextes.
- issue: Schlusssatz über das Volk unter den Völkern
  choice: sodass es den Völkern überlassen bleibt
  alternative: damit es den Völkern dient
  rationale: Die Alternative beruht auf einer abweichenden beziehungsweise vorausgesetzten Lesart, die im bereitgestellten syrischen Wortlaut nicht steht. Der Primärtext ist daher maßgeblich; die Übersetzung löst den knappen Ausdruck nicht konfessionell oder historisch weiter auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Gerichtssprache. Der Satzbau bleibt quellennah, ohne syrische Wortstellung unnötig nachzuahmen. Das Singularpronomen „es“ nimmt grammatisch „dieses Volk“ auf.
