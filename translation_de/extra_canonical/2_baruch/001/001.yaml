base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: de
  text: Im fünfundzwanzigsten Jahr Jojachins, des Königs von Juda, erging das Wort des Herrn an Baruch, den Sohn Nerijas,[a] und er sprach zu ihm:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »kam über Baruch, den Sohn Nerijas«.'
    reason: Bewahrt die räumliche Grundbedeutung der syrischen Präposition ܥܠ als Übersetzungsalternative.
  - marker: b
    text: 'Oder: »mit den Worten:«'
    reason: Gibt eine natürliche deutsche Möglichkeit wieder, die prophetische Redeformel ohne ausdrückliche Festlegung des pronominalen Subjekts anzuschließen.
lexical_decisions:
- source_word: ܗܘܐ ܦܬܓܡܗ ܕܡܪܝܐ ܥܠ
  choice: erging das Wort des Herrn an
  rationale: Die geläufige deutsche prophetische Formel gibt das syrische ܗܘܐ ... ܥܠ natürlich und würdig wieder; ܥܠ kann dabei wörtlicher als „über/auf“ verstanden werden.
- source_word: ܝܘܟܢܝܐ
  choice: Jojachin
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Namensform für den König von Juda, der auch als Jechonja bezeichnet wird.
- source_word: ܘܐܡܪ ܠܗ
  choice: und er sprach zu ihm
  rationale: Bewahrt den eigenständigen syrischen Satzanschluss und lässt das grammatische Subjekt in der deutschen Wiedergabe offen genug, statt das Wort selbst ausdrücklich als Sprecher festzulegen.
theological_decisions:
- issue: Subjekt von „und er sprach zu ihm“
  choice: Das Pronomen „er“ bleibt im Haupttext stehen.
  alternative: „und es sprach zu ihm“ beziehungsweise die Umformung „mit den Worten“
  rationale: Das Syrische hat eine maskuline Verbform, die formal an „das Wort“ anschließen oder den Herrn als Sprecher voraussetzen kann. Die Übersetzung erhält diese Spannung, während die Fußnote die idiomatische Alternative nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen vertrauten deutschen Bibelformen; die Satzstruktur bleibt nahe am syrischen Text, ohne unnatürlich zu wirken.
