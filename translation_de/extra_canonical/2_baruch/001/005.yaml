  text: And my people will be chastened, and the time will come when they will seek the prosperity of their times.”
translation:
  language: de
  text: Und mein Volk wird gezüchtigt werden, und es wird eine Zeit kommen, in der[a] sie das Glück ihrer Zeiten suchen werden.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und eine Zeit wird kommen, und sie werden … suchen«.'
    reason: Das wiederholte syrische „und“ kann zwei aufeinanderfolgende Aussagen verbinden; der Haupttext gibt die im Deutschen natürliche zeitliche Verknüpfung wieder, während die Fußnote die formale parataktische Alternative bewahrt.
lexical_decisions:
- source_word: ܡܬܪܕܐ
  choice: wird gezüchtigt werden
  rationale: Das syrische Passiv bezeichnet eine strafende Zurechtweisung oder Disziplinierung. „Gezüchtigt“ bewahrt hier den ernsten Gerichtskontext, ohne eine darüber hinausgehende Deutung einzutragen.
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: das Wohlergehen
  rationale: Das Substantiv bezeichnet Gelingen, Gedeihen oder Wohlergehen. „Wohlergehen“ ist im Deutschen verständlich und lässt die genaue Art des ersehnten guten Zustands offen.
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: ihrer Zeiten
  rationale: Die ungewöhnliche Genitivverbindung wird formal bewahrt, weil der syrische Wortlaut nicht eindeutig erkennen lässt, ob vergangene günstige Zeiten oder das Wohlergehen innerhalb ihrer jeweiligen Zeiten gemeint ist.
theological_decisions:
- issue: Verhältnis von göttlicher Züchtigung und späterer Suche
  choice: Die beiden Aussagen werden nacheinander wiedergegeben, ohne ein Ergebnis der Suche zu behaupten.
  alternative: Die Züchtigung als Läuterung deuten, die unmittelbar zur Umkehr oder Wiederherstellung führt.
  rationale: Der Vers sagt nur, dass das Volk gezüchtigt wird und später sucht; Ziel, Erfolg und geistliche Bedeutung dieser Suche bleiben unausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gezüchtigt“ ist bewusst gehoben und gerichtsbezogen; die ungewöhnliche Wendung „das Wohlergehen ihrer Zeiten“ bleibt erhalten, damit die Mehrdeutigkeit des syrischen Genitivs nicht vorschnell aufgelöst wird.
