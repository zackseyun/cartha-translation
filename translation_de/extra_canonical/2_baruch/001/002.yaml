  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: de
  text: '„Du hast alles gesehen, was dieses Volk mir angetan hat: Das Böse, das diese beiden übrig gebliebenen Stämme getan haben, ist größer als das der zehn Stämme, die in die Gefangenschaft geführt wurden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: Du hast … gesehen
  rationale: Das syrische Perfekt wird direkt und natürlich wiedergegeben.
- source_word: ܕܥܒܕ ܠܝ
  choice: was … mir angetan hat
  rationale: Die Verbindung aus ܥܒܕ und dem Dativ bezeichnet hier angesichts des ausdrücklich genannten Bösen nicht bloß neutrales Tun, sondern gegen Gott gerichtetes Handeln.
- source_word: ܒܝ̈ܫܬܐ
  choice: das Böse
  rationale: Der syrische Ausdruck kann Übeltaten bzw. Böses bezeichnen. Der deutsche Kollektivsingular ist im Vergleichssatz klar und idiomatisch.
- source_word: ܬܪ̈ܬܝܢ ܫܪ̈ܒܢ
  choice: diese beiden … Stämme
  rationale: ܫܪܒܐ bezeichnet hier im geschichtlichen Zusammenhang einen Stamm; der feminine Plural steht mit der Zahl zwei.
- source_word: ܕܐܫܬܚܪܝ
  choice: übrig gebliebenen
  rationale: Das passive Verb bezeichnet die Stämme, die zurück- oder übrig geblieben sind.
- source_word: ܕܐܫܬܒܝܘ
  choice: die in die Gefangenschaft geführt wurden
  rationale: Das passive Verb von der Wurzel für Gefangennahme wird als vollzogene Wegführung wiedergegeben.
theological_decisions:
- issue: Vergleich der Schuld der zwei und der zehn Stämme
  choice: ist größer als das der zehn Stämme
  alternative: mehr als die zehn Stämme
  rationale: Die elliptische syrische Vergleichskonstruktion wird im Deutschen vervollständigt, ohne zu erklären, worin die größere Schuld bestand.
- issue: Sprecherbezug in „mir“
  choice: mir
  alternative: Gott ausdrücklich benennen
  rationale: Der Kontext identifiziert den Sprecher als den Herrn; der Vers selbst verwendet jedoch nur das Pronomen, das beibehalten wird.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Doppelpunkt macht deutlich, dass der zweite Satzteil das zuvor genannte Handeln näher bestimmt. Die historische Rede von zwei verbliebenen und zehn gefangenen Stämmen bleibt ohne harmonisierende Erläuterung stehen.
