lexical_decisions:
- source_word: ܝܕܥܝܢ (im überlieferten Textzusammenhang)
  choice: sie wissen
  rationale: Gibt das Erkenntnisverb direkt und natürlich wieder.
- source_word: ܡܛܐ ܙܒܢܐ
  choice: die Zeit ist gekommen
  rationale: Bewahrt die zeitlich-eschatologische Aussage des Syrischen in idiomatischem Deutsch.
- source_word: ܫܘܠܡܐ / entsprechende Abschlussformulierung im Textzusammenhang
  choice: Vollendung
  rationale: Bezeichnet sowohl Abschluss als auch Erfüllung und erhält dadurch die eschatologische Spannung.
- source_word: ܙܒܢ̈ܐ
  choice: der Zeiten
  rationale: Der Plural wird formal bewahrt; eine Vereinheitlichung zu „der Zeit“ würde eine Nuance des Ausgangstextes beseitigen.
theological_decisions:
- issue: Bedeutung der zeitlichen Vollendung
  choice: Vollendung der Zeiten
  alternative: Ende der Zeiten
  rationale: „Vollendung“ lässt offen, ob primär Abschluss, Zielerreichung oder Erfüllung gemeint ist, während „Ende“ die Aussage stärker auf bloßes Aufhören festlegen würde.
- issue: Wiedergabe der berichteten Aussage
  choice: von der gesagt wurde, sie sei
  alternative: von der gesagt wurde, dass sie ist
  rationale: Der deutsche Konjunktiv kennzeichnet die überlieferte Aussage, ohne ihre Wahrheit zu bestreiten oder sie ungekennzeichnet zur Erzählerbehauptung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung „Vollendung der Zeiten“ entspricht dem apokalyptischen Register, bleibt aber allgemein verständlich.
