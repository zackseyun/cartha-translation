translation:
  language: de
  text: Die Seelen der Frevler aber werden noch mehr dahinschwinden, wenn sie all dies sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦܫܬܗܘܢ
  choice: die Seelen
  rationale: Gibt den anthropologischen Ausdruck wörtlich und im Zusammenhang mit dem Geschick nach dem Tod angemessen wieder.
- source_word: ܕܪ̈ܫܝܥܐ
  choice: der Frevler
  rationale: Bezeichnet moralisch Schuldige beziehungsweise Gottlose; „Frevler“ ist prägnant, würdig und vermeidet eine unnötig konfessionelle Festlegung.
- source_word: ܢܬܡܣܝܢ
  choice: werden dahinschwinden
  rationale: Bewahrt die Vorstellung eines fortschreitenden Vergehens oder Aufzehrens, ohne eine präzisere Art des Leidens festzulegen, als der Ausdruck hergibt.
theological_decisions:
- issue: Art und Dauer des Geschicks der Frevler
  choice: Keine nähere Bestimmung; das Bild des Dahinschwindens bleibt stehen.
  alternative: Eine ausdrückliche Aussage über Vernichtung oder ewige bewusste Qual.
  rationale: Der Vers beschreibt die Reaktion beziehungsweise das Geschick der Seelen bildhaft, legt aber an dieser Stelle weder dessen metaphysische Art noch seine Dauer eindeutig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die adversative Stellung von „aber“ und die Steigerung „noch mehr“ bleiben erhalten; der knappe Satz benötigt keine Fußnote.
