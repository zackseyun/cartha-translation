  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: de
  text: 'Und zu jener Zeit wird es geschehen: Die Schatzkammern werden geöffnet, in denen die Zahl der Seelen der Gerechten aufbewahrt wird, und sie werden hervorkommen. Die vielen Seelen werden gemeinsam in einer einzigen Versammlung und eines Sinnes zu sehen sein. Die Ersten werden sich freuen, und die Letzten werden nicht betrübt sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܟܬܐ / Kontext der verborgenen, verwahrten Seelen
  choice: Schatzkammern
  rationale: Die traditionelle Wiedergabe trifft das Bild eines himmlischen Verwahrungsortes und entspricht dem durch die Textüberlieferung gestützten Sinn.
- source_word: ܢܦܩܝ
  choice: sie werden hervorkommen
  rationale: Bewahrt die konkrete Bewegungsrichtung des syrischen Verbs und lässt offen, wie das endzeitliche Hervorkommen genau zu verstehen ist.
- source_word: ܚܕܐ … ܟܢܫܬܐ
  choice: in einer einzigen Versammlung
  rationale: Gibt sowohl die Einheit als auch das versammelte Kollektiv wieder, ohne daraus eine institutionelle Versammlung zu machen.
- source_word: ܚܕܐ (im Sinn gemeinsamer Gesinnung)
  choice: eines Sinnes
  rationale: Natürliches, würdiges Deutsch für die ausgesagte innere Einmütigkeit der versammelten Seelen.
- source_word: ܠܐ ܬܬܬܥܝܩ
  choice: werden nicht betrübt sein
  rationale: Gibt den emotionalen Sinn wieder, ohne eine besondere Ursache oder Form des Leids hinzuzufügen.
theological_decisions:
- issue: Zustand und Ort der Seelen vor ihrem Hervorkommen
  choice: Das Bild der aufbewahrten Seelen in Schatzkammern bleibt unkommentiert stehen.
  alternative: Die Schatzkammern ausdrücklich als Himmel, Totenreich oder Zwischenzustand bestimmen.
  rationale: Der Vers verwendet bildhafte Sprache, legt aber keine eindeutige dogmatische Lokalisierung oder Systematik fest.
- issue: Identität der „Ersten“ und „Letzten“
  choice: Die Bezeichnungen werden ohne erklärenden Zusatz beibehalten.
  alternative: Sie als früh beziehungsweise spät Verstorbene oder als Ranggruppen auslegen.
  rationale: Der Text erklärt die Gruppen hier nicht näher; eine Präzisierung würde die vorhandene Mehrdeutigkeit auflösen.
- issue: „Zahl der Seelen“
  choice: Die semitische Formulierung wird wörtlich bewahrt.
  alternative: „die volle Zahl der Seelen“ oder „die festgesetzte Zahl“ schreiben.
  rationale: Eine Vollzahl oder göttliche Festsetzung mag im Kontext mitschwingen, wird aber nicht ausdrücklich genug bezeichnet, um sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer eschatologischer Bildsprache. Die Satzfolge bleibt nahe am syrischen Aufbau, wird jedoch für heutige Leser flüssig gegliedert. Keine konfessionelle Deutung des Seelenzustands, der Schatzkammern oder der Ersten und Letzten wird ergänzt.
