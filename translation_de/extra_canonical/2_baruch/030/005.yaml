translation:
  language: de
  text: Denn sie wissen, dass ihre Qual gekommen und ihr Verderben eingetroffen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܫܘܢܩܗܘܢ (sinngemäß im überlieferten Vers: ihre Qual/Pein)'
  choice: ihre Qual
  rationale: „Qual“ gibt die Vorstellung leidvoller Bestrafung in natürlichem, würdigem Deutsch wieder, ohne die Art der Strafe näher festzulegen.
- source_word: 'ܐܒܕܢܗܘܢ (sinngemäß im überlieferten Vers: ihr Verderben/Untergang)'
  choice: ihr Verderben
  rationale: „Verderben“ bewahrt die eschatologische Offenheit zwischen Untergang, Vernichtung und endgültigem Unheil.
- source_word: ܡܛܐ / ܐܬܐ (ankommen/kommen)
  choice: gekommen … eingetroffen
  rationale: Die beiden Ankunftsaussagen werden im Deutschen leicht variiert, damit der Parallelismus klar und natürlich klingt.
theological_decisions:
- issue: Reichweite von „Verderben“
  choice: Die Formulierung bleibt hinsichtlich Art und Endgültigkeit des Verderbens offen.
  alternative: „Vernichtung“ oder „ewige Verdammnis“
  rationale: Der Vers benennt das kommende Unheil, legt aber in dieser Aussage weder dessen genaue Beschaffenheit noch eine konfessionelle Deutung ausdrücklich fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, feierlicher Satzführung; der parallele Aufbau der beiden Aussagen bleibt erhalten.
