  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: de
  text: '1 Und nach diesen Dingen wird es geschehen: Wenn die Zeit des Kommens des Messias vollendet ist, wird er in Herrlichkeit zurückkehren. Dann werden alle auferstehen, die in der Hoffnung auf ihn entschlafen sind.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: das Kommen des Messias
  rationale: Gibt die syrische Wendung direkt und in natürlichem, theologisch nicht überladenem Deutsch wieder.
- source_word: ܢܬܦܣܩ
  choice: vollendet ist
  rationale: Bewahrt den zeitlichen Abschlussgedanken; „vollendet“ passt zum eschatologischen Kontext besser als das rein rechnerische „abgelaufen“.
- source_word: ܕܡܟܝܢ / Schlafmetapher im kontrollierten Textbestand
  choice: entschlafen sind
  rationale: Erhält das Bild vom Schlaf für den Tod und vermeidet die missverständliche Aussage, die Betreffenden schliefen lediglich gewöhnlich.
- source_word: ܢܩܘܡܘܢ / Auferstehungsaussage im kontrollierten Textbestand
  choice: werden auferstehen
  rationale: Bezeichnet im Kontext eindeutig das Erstehen der Toten und ist im modernen Standarddeutsch klarer als „werden sich erheben“.
theological_decisions:
- issue: Bezug der Hoffnung
  choice: „in der Hoffnung auf ihn“ bezieht sich auf den Messias
  alternative: „in seiner Hoffnung“ oder allgemein „in Hoffnung“
  rationale: Das Pronomen wird ohne dogmatische Erweiterung mit seinem nächstliegenden Bezug, dem Messias, wiedergegeben.
- issue: Art der Rückkehr des Messias
  choice: „wird er in Herrlichkeit zurückkehren“
  alternative: „kehrt er mit Herrlichkeit zurück“
  rationale: „In Herrlichkeit“ ist idiomatisches Deutsch und bewahrt die Aussage über die ruhmvolle Erscheinungsweise, ohne näher zu bestimmen, worin diese Herrlichkeit besteht.
- issue: Satzbezug von „vollendet“ und „zurückkehren“
  choice: Die Vollendung der Zeit bildet den zeitlichen Rahmen; anschließend wird die Rückkehr ausgesagt.
  alternative: Beides in einem langen Wenn-dann-Satz eng zusammenziehen
  rationale: Die Satzteilung folgt dem in der Überlieferung erkennbaren Gedankenverlauf und verhindert, dass die Rückkehr selbst als Bestandteil der Zeitvollendung umgedeutet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nach diesen Dingen“ bewahrt die apokalyptische Übergangsformel; „entschlafen“ erhält die traditionelle Schlafmetapher, bleibt aber allgemein verständlich.
