translation:
  language: de
  text: 'Oder meinst du, dies sei die Stadt, von der ich gesagt habe: »Auf meine Handflächen habe ich dich eingraviert«?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Jesaja 49,16. Gemeint ist das Bild einer dauerhaft in Gottes Handflächen eingezeichneten Stadt.
    reason: Die Fußnote macht die Schriftanspielung und das konkrete Bild verständlich, ohne die Deutung in den Haupttext einzutragen.
lexical_decisions:
- source_word: ܣܟܠ ܐܢܬ
  choice: meinst du
  rationale: Die Wendung wird im Kontext als rhetorische Frage des Denkens bzw. Dafürhaltens verstanden; „meinst du“ ist natürliches modernes Deutsch.
- source_word: ܡܕܝܢܬܐ
  choice: Stadt
  rationale: Die übliche und kontextuell eindeutige Bedeutung ist „Stadt“.
- source_word: 'ܒܐܝ̈ܕܝ / überlieferte Anspielung: „auf/in die Hände bzw. Handflächen“'
  choice: in meine Handflächen
  rationale: Die Formulierung bewahrt das konkrete Bild der Jesaja-Anspielung; „Handflächen“ ist im Deutschen präziser als das allgemeinere „Hände“.
- source_word: ܓܠܦ (in der überlieferten Zitatgestalt)
  choice: eingeritzt
  rationale: Das Verb bezeichnet ein Eingravieren oder Einritzen; „eingeritzt“ gibt das bleibende, körperlich-konkrete Bild idiomatisch wieder.
theological_decisions:
- issue: Identität der gegenwärtigen und der von Gott eingezeichneten Stadt
  choice: Die rhetorische Frage bleibt offen und unterscheidet implizit die sichtbare Stadt von der zuvor verheißenen Stadt.
  alternative: Die beiden Städte ausdrücklich gleichsetzen oder ausdrücklich voneinander trennen.
  rationale: Der Vers leitet erst zur Erklärung der präexistenten, künftig offenbarten Stadt über; eine dogmatische Auflösung würde die Spannung des Textes vorwegnehmen.
- issue: Biblische Anspielung
  choice: Die Aussage wird als Zitat in direkter Rede wiedergegeben, ohne sie im Haupttext ausdrücklich Jesaja zuzuschreiben.
  alternative: „wie ich durch Jesaja gesagt habe“ ergänzen.
  rationale: Eine solche Zuschreibung steht nicht ausdrücklich im Vers und soll daher nicht in den Haupttext importiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp; die direkte Rede erhält den bildhaften, feierlichen Charakter des syrischen Textes.
