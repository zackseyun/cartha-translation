translation:
  language: de
  text: Und danach zeigte ich es meinem Diener Abraham in der Nacht, zwischen den Stücken des Opfers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܟܝܢ
  choice: danach
  rationale: Gibt die zeitliche Abfolge natürlich und präzise wieder.
- source_word: ܚܘܝܬܗ
  choice: zeigte ich ihn
  rationale: Das pronominale Suffix ist maskulin und bezieht sich im Zusammenhang am ehesten auf den zuvor genannten Garten beziehungsweise das Paradies; das Pronomen bleibt wie in der Quelle erhalten.
- source_word: ܠܥܒܕܝ ܐܒܪܗܡ
  choice: meinem Diener Abraham
  rationale: Bewahrt das Gotteswort in der ersten Person und die übliche biblische Bedeutung von ܥܒܕܐ.
- source_word: ܒܠܠܝܐ
  choice: in der Nacht
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: zwischen den Stücken des Opfers
  rationale: ܦܓܪ̈ܐ bezeichnet hier die zerteilten Körper beziehungsweise Stücke der Opfertiere; die Formulierung wahrt den Bezug zu Genesis 15, ohne ihn auszudeuten.
theological_decisions:
- issue: Bezugswort des maskulinen Pronomens in ܚܘܝܬܗ
  choice: „ihn“
  alternative: „es“ oder ausdrücklich „das Paradies“
  rationale: Der syrische Text verwendet ein maskulines Suffix, dessen naheliegendes Bezugswort ܦܪܕܝܣܐ („Paradies/Garten“) ist. Das Pronomen bewahrt den Rückbezug, ohne die Quelle erklärend zu erweitern.
- issue: Identität dessen, was Abraham gezeigt wurde
  choice: im Vers nicht ausdrücklich benannt
  alternative: „das Paradies“ ausdrücklich einsetzen
  rationale: Obwohl der Kontext das Paradies nahelegt, erhält die Übersetzung die pronominale Form und damit die Textstruktur und geringe Restambiguität des Syrischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die syrische Syntax; „Stücke des Opfers“ ist verständlich und bewahrt zugleich die kultische Bildwelt von Genesis 15.
