  source_fidelity: 'Der syrische Text lautet sinngemäß: „Und danach zeigte ich es meinem Knecht Abraham bei Nacht, zwischen den Stücken/Körperteilen des Opfers.“ Die zeitliche Angabe, Abraham als Gottes „Diener“ und die Ortsangabe werden im Entwurf zutreffend wiedergegeben. Das pronominale Objekt von ܚܘܝܬܗ bezieht sich im Kontext auf ܦܪܕܝܣܐ, „das Paradies“.'
  naturalness: „zeigte ich ihn“ ist im Deutschen bei einem Rückbezug auf „das Paradies“ nicht möglich; das Pronomen muss „es“ lauten. „In der Nacht“ und „zwischen den Stücken des Opfers“ sind verständlich und im würdigen modernen Register angemessen.
  terminology: „Diener“ für ܥܒܕܝ ist passend. „Stücke des Opfers“ gibt ܦܓܪ̈ܐ ܕܕܒܚܐ zurück, ohne die Anspielung auf die zerteilten Opfertiere in Genesis 15 übermäßig auszudeuten. Eine Änderung zu „Teilen“ wäre ebenfalls möglich, aber nicht erforderlich.
