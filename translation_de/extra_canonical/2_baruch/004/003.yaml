  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: de
  text: Denn sie ist nicht von Menschenhand geschaffen; sie ist es, die offenbart werden wird und die im Voraus bereitet wurde, seit ich beschloss, das Paradies zu schaffen. Ich zeigte sie Adam, bevor er sündigte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: von Menschenhand geschaffen
  rationale: Die syrische Wendung lautet wörtlich „durch die Hand der Menschen“. Im Zusammenhang steht die nicht von Menschen errichtete Stadt im Gegensatz zur künftig offenbarten Stadt; „geschaffen“ macht die im Syrischen elliptische Aussage im Deutschen verständlich.
- source_word: ܡܬܓܠܐ
  choice: offenbart werden wird
  rationale: Das Ethpaal/Passiv von ܓܠܐ bezeichnet ein Offenbarwerden. Der Zukunftsbezug ergibt sich aus dem folgenden ܠܡܐܬܝܐ und dem Kontext.
- source_word: ܐܬܟܢ ܡܢܩܕܡ
  choice: im Voraus bereitet wurde
  rationale: ܐܬܟܢ bedeutet hier „wurde bereitet/angelegt“, ܡܢܩܕܡ „zuvor, im Voraus“.
- source_word: ܡܢ ܟܕ ܐܬܚܫܒܬ
  choice: seit ich beschloss
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, an dem Gott den Entschluss beziehungsweise Plan fasste; „seit“ gibt den zeitlichen Anschluss natürlich wieder.
- source_word: ܦܪܕܝܣܐ
  choice: das Paradies
  rationale: Das Lehnwort bezeichnet hier das Paradies und wird entsprechend der etablierten deutschen biblischen Terminologie wiedergegeben.
- source_word: ܚܘܝܬܗ
  choice: Ich zeigte sie
  rationale: Das suffigierte Pronomen verweist auf die im Kontext genannte Stadt; daher steht im Deutschen das feminine „sie“.
theological_decisions:
- issue: Identität und Vorherexistenz der Stadt
  choice: Die weiblichen Pronomen beziehen sich auf die zuvor genannte Stadt; ihre göttliche Vorbereitung und spätere Offenbarung bleiben ausdrücklich stehen.
  alternative: Den Bezug als „das Paradies“ deuten oder die Stadt lediglich als später neu zu errichtende irdische Stadt verstehen.
  rationale: Der unmittelbare Kontext kontrastiert die gegenwärtige, zeitweise ausgelieferte Stadt mit einer nicht von Menschenhand stammenden Stadt. Der feminine Rückverweis und die Aussage, sie sei Adam gezeigt worden, stützen den Bezug auf die Stadt, ohne ihre genaue Seinsweise weiter festzulegen.
- issue: Zeitpunkt der Offenbarung
  choice: „offenbart werden wird“
  alternative: „für die kommende Welt offenbart wird“
  rationale: Der syrische Ausdruck trägt einen Zukunfts- beziehungsweise Kommenskonnex, doch die genaue Ergänzung („bei der Ankunft“, „für die Zukunft“, „in der kommenden Welt“) ist knapp und auslegungsfähig. Die Hauptübersetzung bewahrt die sichere Zukunftsaussage, ohne eine spezifische eschatologische Terminologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das wiederholte syrische Demonstrativpronomen wird durch „sie ist es“ aufgenommen. Die im Syrischen elliptische Formulierung „nicht durch die Hand der Menschen“ wird idiomatisch als „nicht von Menschenhand geschaffen“ wiedergegeben; der Bezug auf die himmlische beziehungsweise künftig offenbarte Stadt wird nicht dogmatisch weiterbestimmt.
