  yaml_path: translation/extra_canonical/2_baruch/004/001.yaml
  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: de
  text: '1 Und der Herr sagte zu mir: »Diese Stadt wird für eine Zeit preisgegeben, und das Volk wird in die Gefangenschaft geführt werden; doch die Welt wird nicht vergessen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܬܠܡܐ
  choice: wird … preisgegeben
  rationale: Das Ethpaal/Passiv von šlm bezeichnet hier das Ausliefern bzw. Preisgeben der Stadt; die Formulierung bewahrt den passiven Charakter, ohne den im Satz nicht genannten Empfänger zu ergänzen.
- source_word: ܒܙܒܢܐ
  choice: für eine Zeit
  rationale: Die Wendung bezeichnet eine begrenzte Zeitspanne; die knappe Wiedergabe erhält die zeitliche Offenheit des Syrischen.
- source_word: ܡܬܕܒܪ ܫܒܝܐ
  choice: wird in die Gefangenschaft geführt werden
  rationale: Die Verbindung aus ‚geführt werden‘ und ‚Gefangenschaft‘ beschreibt die Wegführung des Volkes ins Exil und hält sich eng an die syrische Konstruktion.
- source_word: ܥܠܡܐ
  choice: die Welt
  rationale: ܥܠܡܐ kann je nach Kontext auch ‚Zeitalter‘ bedeuten; hier wird die unmarkierte Grundbedeutung ‚Welt‘ beibehalten, da der folgende Kontext die gegenwärtige Stadt einer umfassenderen, von Gott vorbereiteten Wirklichkeit gegenüberstellt.
- source_word: ܠܐ ܡܬܬܢܫܐ
  choice: wird nicht vergessen werden
  rationale: Die passive Verbform wird formal bewahrt; Gott als Handelnder wird nicht ausdrücklich ergänzt, weil auch der syrische Text ihn in diesem Teilsatz nicht nennt.
theological_decisions:
- issue: Bedeutung von ܥܠܡܐ
  choice: die Welt
  alternative: das Zeitalter / die Ewigkeit
  rationale: Die Übersetzung entscheidet die mögliche kosmische oder zeitliche Nuance nicht durch eine konfessionell geprägte Deutung vor. ‚Welt‘ entspricht der naheliegenden lexikalischen Bedeutung und dem überlieferten Verständnis dieser Aussage.
- issue: Impliziter Handelnder beim Vergessen
  choice: 'Passiv: „wird nicht vergessen werden“'
  alternative: „Gott wird die Welt nicht vergessen“
  rationale: Das Passiv wahrt die Form und theologische Spannung des Ausgangstextes, statt Gott explizit als Subjekt einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt den drei parallelen Aussagen des Syrischen; das Semikolon macht den abschließenden Gegensatz klar, ohne ihn stärker auszudeuten.
