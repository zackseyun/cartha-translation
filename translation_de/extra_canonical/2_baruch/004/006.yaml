  source_fidelity: Das pronominale Objekt in ܚܘܝܬܗ („ich zeigte es/sie“) darf weiterhin offen auf die zuvor genannte vorbereitete Stadt zurückverweisen; das feminine „sie“ ist im Deutschen dafür angemessen. ܕܡܘܬܐ bezeichnet hier jedoch vorrangig ein gezeigtes Muster bzw. Vorbild, nicht ein „Abbild“. Die Wiedergabe „Muster“ entspricht sowohl dem syrischen Kontext als auch dem englischen Audit trail („pattern“) genauer.
  naturalness: „Wohnstätte“ ist in diesem kultischen Zusammenhang zwar verständlich, klingt aber ohne erläuternde Fußnote ungewöhnlich und kann den sachlichen Bezug auf das mobile Zeltheiligtum verdecken. „Zeltheiligtum“ ist modernes, präzises Deutsch. Die Satzstellung wurde leicht geglättet, ohne die Wiederholung von „zeigte“ aufzugeben.
  terminology: „Muster des Zeltheiligtums und all seiner Geräte“ gibt die kultische Terminologie klar und nicht konfessionell wieder. „Muster“ vermeidet die stärkere und hier weniger genaue Vorstellung eines bloßen Abbilds.
