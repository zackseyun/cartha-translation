  - severity: low
    issue: „Wohnstätte“ für ܡܫܟܢܐ
    rationale: Die Grundbedeutung ist möglich, aber im Zusammenhang mit dem Mose gezeigten Muster und den Geräten ist „Zeltheiligtum“ natürlicher und genauer. Die erläuternde Fußnote wird dadurch entbehrlich.
