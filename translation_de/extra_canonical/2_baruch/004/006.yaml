  text: And again I also showed it to Moses on Mount Sinai, when I showed him the pattern of the tabernacle and all its vessels.”
translation:
  language: de
  text: Und wiederum zeigte ich sie auch Mose auf dem Berg Sinai, als ich ihm das Muster des Zeltheiligtums und all seiner Geräte zeigte.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: zeigte ich sie
  rationale: Das syrische Verb mit pronominalem Objekt verweist im Zusammenhang auf die zuvor genannte, von Gott bereitete Stadt; das feminine deutsche Pronomen bewahrt diesen Rückbezug.
- source_word: ܕܡܘܬܐ
  choice: Abbild
  rationale: Der Ausdruck bezeichnet eine Entsprechung beziehungsweise ein vorgegebenes Muster. „Abbild“ wahrt hier die Beziehung zwischen der himmlischen Wirklichkeit und der Mose gezeigten Gestalt, ohne sie näher zu systematisieren.
- source_word: ܡܫܟܢܐ
  choice: Wohnstätte
  rationale: Der Ausdruck meint das heilige Zeltheiligtum. „Wohnstätte“ gibt seine Grundbedeutung wieder und bleibt für heutige Leser verständlich; die traditionelle Bezeichnung wird in der Fußnote genannt.
- source_word: ܡܐܢ̈ܐ
  choice: Geräte
  rationale: Im Heiligtumskontext bezeichnet das Wort die zugehörigen kultischen Gegenstände; „Geräte“ ist die geläufige und sachlich passende Wiedergabe.
theological_decisions:
- issue: Bezug des pronominalen Objekts „sie“
  choice: Rückbezug auf die zuvor genannte, von Gott bereitete Stadt
  alternative: Explizite Einfügung „die himmlische Stadt“
  rationale: Der Quelltext verwendet nur ein Pronomen. Die Übersetzung bewahrt diese Textgestalt und vermeidet eine erklärende Ergänzung im Haupttext.
- issue: Verhältnis von himmlischer Wirklichkeit und irdischem Heiligtum
  choice: „Abbild“ ohne weitergehende dogmatische Präzisierung
  alternative: „Bauplan“, „Urbild“ oder „Modell“
  rationale: Die Formulierung lässt offen, wie genau die gezeigte Stadt, die Wohnstätte und ihr Muster ontologisch zueinander stehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung von „zeigte“ wurde beibehalten, weil sie der rhetorischen Struktur des Quelltexts entspricht. Das Schlusszeichen setzt die in den vorangehenden Versen begonnene Gottesrede fort.
