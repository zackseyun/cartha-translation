translation:
  language: de
  text: Als aber das Gebot übertreten worden war, wurde ihm die Stadt genommen, wie auch das Paradies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht als erster Satzgegenstand nur ein femininer Rückverweis: „wurde sie ihm genommen“. Gemeint ist sehr wahrscheinlich die zuvor genannte Stadt.'
    reason: Die Ergänzung „die Stadt“ macht den im Syrischen grammatisch markierten Rückbezug im Deutschen verständlich und dokumentiert zugleich die knappe Ausdrucksweise des Textes.
lexical_decisions:
- source_word: ܦܘܩܕܢܐ
  choice: das Gebot
  rationale: Die übliche und im Zusammenhang mit Adams Übertretung sachgerechte Wiedergabe.
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: wurde ihm die Stadt genommen
  rationale: Das feminine Verb verweist am ehesten auf die zuvor genannte Stadt; das Bezugswort wird im Deutschen wiederholt, um einen missverständlichen pronominalen Bezug zu vermeiden.
- source_word: ܦܪܕܝܣܐ
  choice: das Paradies
  rationale: Entspricht dem syrischen Lehnwort und dem Adam-Kontext.
theological_decisions:
- issue: Wer das Gebot übertrat
  choice: 'Passiv: „das Gebot übertreten worden war“'
  alternative: „als er das Gebot übertrat“
  rationale: Der syrische Text nennt Adam in diesem Teilsatz nicht ausdrücklich als handelndes Subjekt. Das Passiv bewahrt die Form und vermeidet eine unnötige Explizierung, obwohl Adam aus dem Kontext klar naheliegt.
- issue: Was Adam genommen wurde
  choice: die zuvor genannte Stadt
  alternative: ein unbestimmtes „es“ oder das Gebot
  rationale: Die feminine Verbform passt zur syrischen Bezeichnung für „Stadt“, während „Gebot“ und „Paradies“ im Syrischen maskulin sind. Der Kontext spricht von der für die kommende Zeit bereiteten Stadt, die Adam zuvor gezeigt wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Form bewahrt die Ausdrucksweise der syrischen Vorlage; die Wiederaufnahme von „die Stadt“ stellt den grammatisch erkennbaren Rückbezug natürlich und verständlich her.
