base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: de
  text: '„Und dies sind die Anweisungen, die dir dein Gefährte Jeremia gab, als er sagte: ‚Kümmere dich um dieses Volk, während ich fortgehe und die übrigen unserer Brüder in Babylon tröste, die in Gefangenschaft geraten sind.‘ Und nun: Wenn auch du uns verlässt, wäre es für uns alle besser, vor dir zu sterben, als dass du von uns fortgehst.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: Anweisungen
  rationale: Das Substantiv bezeichnet verbindliche Aufträge oder Weisungen. „Anweisungen“ klingt im modernen Deutschen natürlich und bewahrt den Nachdruck der Frage.
- source_word: ܚܒܪܟ
  choice: dein Gefährte
  rationale: Das Wort bezeichnet einen eng verbundenen Genossen oder Gefährten. Die Wiedergabe wahrt die Beziehung zwischen Jeremia und Baruch, ohne sie als bloße Freundschaft zu verengen.
- source_word: ܚܙܝ ܠܗܘܢ ܥܡܐ
  choice: Kümmere dich um dieses Volk
  rationale: Wörtlich steht eine Aufforderung, nach dem Volk zu sehen. Im Zusammenhang bezeichnet sie die übertragene Fürsorge und Aufsicht.
- source_word: ܐܦܝܣܘܢܢܝ / ܐܦܝ
  choice: tröste
  rationale: Die Kausativform von ܦܝܣ kann „überzeugen“, „zureden“ oder „trösten“ bedeuten. Bei den Verschleppten in Babylon ist „trösten“ kontextuell naheliegend, ohne den Vorgang näher auszudeuten.
- source_word: ܐܚ̈ܝ
  choice: unsere Brüder
  rationale: Die familiäre Gemeinschaftsbezeichnung bleibt erhalten; „Brüder“ ist hier im Deutschen verständlich und angemessen.
- source_word: ܕܢܦܠܘ
  choice: die in Gefangenschaft geraten sind
  rationale: Das Verb bedeutet grundsätzlich „fallen“; zusammen mit dem am Seitenübergang erschlossenen Gefangenschaftskontext bezeichnet es diejenigen, die der Verschleppung anheimgefallen sind.
theological_decisions:
- issue: Bezeichnung Jeremias
  choice: dein Gefährte Jeremia
  alternative: der Prophet Jeremia
  rationale: Der vorliegende syrische Text bietet ܚܒܪܟ, „dein Gefährte/Genosse“. Ein Prophetentitel wird deshalb nicht in den Haupttext eingeführt.
- issue: Tätigkeit bei den Brüdern in Babylon
  choice: tröste
  alternative: ihnen zurede / sie überzeuge
  rationale: Das syrische Verb besitzt eine entsprechende Bedeutungsbreite. Der Exilkontext stützt „trösten“, doch die Übersetzung macht daraus keine weitergehende theologische Aussage.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und die eindringliche Klage des Volkes bleiben erhalten. Der am Seitenrand unvollständige syrische Satz wird unter Kontrolle der Kapitelüberlieferung und der geprüften englischen Konsultationsschicht wiedergegeben.
