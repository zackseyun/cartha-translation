revisions:
- from: 'Und nachdem ich dies gesagt hatte, schlief ich dort ein. In der Nacht sah ich eine Vision: Siehe, aus dem großen Meer stieg eine Wolke auf. Sie war voll von weißen und schwarzen Wassern, und in diesen Wassern waren viele Farbtöne. An ihrer Spitze erschien etwas wie ein gewaltiger Blitz. Ich sah, wie die Wolke in heftigem Lauf rasch dahinzog und die ganze Erde bedeckte. Danach begann Wasser aus ihr auf die Erde herabzufallen. Dabei sah ich, dass diese Wasser nicht alle gleich aussahen. Danach sah ich wieder Schwarzes, darauf wieder Helles, dann wieder Schwarzes und wieder Helles. So geschah es bis zu zwölfmal; doch jedes Mal war das Schwarze umfangreicher als das Helle.


