  yaml_path: translation/extra_canonical/2_baruch/053/001.yaml
  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: de
  text: 'Und nachdem ich dies gesagt hatte, schlief ich dort ein. In der Nacht sah ich eine Vision: Siehe, aus dem großen Meer stieg eine Wolke auf. Sie war voller weißer und schwarzer Wasser, und in diesen Wassern waren viele Farbtöne. An ihrer Spitze erschien etwas wie ein gewaltiger Blitz. Ich sah, wie die Wolke rasch und mit großer Wucht dahinjagte und die ganze Erde bedeckte. Danach begann Wasser aus ihr auf die Erde herabzufallen. Dabei sah ich, dass diese Wasser nicht alle gleich aussahen. Danach sah ich wieder Schwarzes, darauf wieder Helles, dann wieder Schwarzes und wieder Helles. So geschah es bis zu zwölfmal; doch insgesamt überwog das Schwarze das Helle.


    Am Ende der Wolke fiel schwarzes, finsteres Wasser herab, dunkler als alle Wasser zuvor. Es war darin vermischt, und wo immer dieses Wasser niederfiel, richtete es Verwüstung und Zerstörung an. Danach sah ich den Blitz, den ich an der Spitze der Wolke gesehen hatte. Er ergriff die Wolke und zog sie zur Erde hinab. Danach sah ich: Siehe, zwölf Flüsse[a] stiegen aus dem Meer empor. Sie umgaben jenen Blitz und unterwarfen sich ihm. Sie freuten sich über jene Verkündigung und priesen sie. Da erwachte ich vor Angst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwölf Lichter“.'
    reason: textual_variant
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: Wolke
  rationale: Die übliche Bedeutung des syrischen Wortes passt zu dem Gebilde, das aufsteigt, über die Erde zieht und Wasser herabfallen lässt.
- source_word: ܩ̈ܝܐ / ܡ̈ܝܐ
  choice: Wasser
  rationale: Der Text beschreibt helle und dunkle Niederschläge aus der Wolke; „Wasser“ hält die Bildsprache zusammen und folgt besonders im Schlussteil dem ausdrücklich bezeugten ܡ̈ܝܐ.
- source_word: ܐܘܟܡܐ / ܢܗܝܪܐ
  choice: schwarz / hell
  rationale: Das Gegensatzpaar der Vision wird knapp und ohne allegorische Deutung wiedergegeben.
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: in heftigem Lauf
  rationale: Die Wendung bezeichnet die kraftvolle, schnelle Bewegung der Wolke und bewahrt zugleich das konkrete Bewegungsbild.
- source_word: ܒܪܩܐ
  choice: Blitz
  rationale: Dies ist die natürliche deutsche Entsprechung für das visionäre Gebilde an der Spitze der Wolke.
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: Verwüstung und Zerstörung
  rationale: Die beiden Substantive werden als Paar beibehalten und nicht zu einem einzigen allgemeinen Schadensbegriff zusammengezogen.
- source_word: ܢܘܗܪ̈ܐ
  choice: Lichter
  rationale: Der vorgelegte syrische Haupttext liest sichtbar „Lichter“. Die in Kontrollüberlieferung und früherer Redaktion vertretene Lesart „Flüsse“ wird transparent in einer Fußnote genannt.
- source_word: ܟܪܘܙ
  choice: Herold
  rationale: Das syrische Nomen bezeichnet gewöhnlich einen Herold oder Verkündiger; die anschließenden maskulinen Bezüge „über ihn“ und „ihn“ sprechen hier für eine personale Wiedergabe statt des abstrakten „Verkündigung“.
theological_decisions:
- issue: Historische Deutung der schwarzen und hellen Wasser
  choice: Die Symbole bleiben in der Vision ungedeutet.
  alternative: Die Wasser bereits hier bestimmten geschichtlichen Epochen oder Personen zuordnen.
  rationale: Der vorliegende Abschnitt berichtet zunächst nur das Gesicht; eine vorweggenommene Deutung würde die spätere Auslegung des Buches in den Visionstext eintragen.
- issue: Zwölf Lichter oder zwölf Flüsse
  choice: „Zwölf Lichter“ im Haupttext, mit „zwölf Flüsse“ als textkritischer Alternative.
  alternative: „Zwölf Flüsse“ im Haupttext.
  rationale: Die bereitgestellte syrische Zeile bietet ܢܘܗܪ̈ܐ („Lichter“). Wegen der ähnlichen Schreibgestalt und der abweichenden Kontrollüberlieferung bleibt „Flüsse“ als echte Variante erhalten.
- issue: Bezug von ܟܪܘܙ
  choice: „jenen Herold“ als mehrdeutige Gestalt der Vision.
  alternative: „jene Verkündigung“ als abstrakter Inhalt.
  rationale: Die grammatischen Bezüge wirken personal, doch die Vision identifiziert den Herold nicht ausdrücklich. Daher wird weder eine konkrete messianische noch eine andere dogmatische Identifikation ergänzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Wiederholungen wie „wieder Schwarzes … wieder Helles“ und die einleitende Schauformel „Siehe“ bleiben als Merkmale des Visionserzählens erhalten; die Symbolik wird nicht geglättet oder konfessionell ausgedeutet.
