  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: de
  text: '1 Darum sieh: Es kommen Tage, an denen die Zeiten schneller dahineilen werden als die früheren, die Zeitabschnitte rascher vergehen als die vergangenen und die Jahre schneller voranschreiten als die gegenwärtigen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: Zeiten
  rationale: Gibt den allgemeinen zeitlichen Begriff wieder und bewahrt die apokalyptische Aussage vom beschleunigten Ablauf der Zeit.
- source_word: temporal term rendered in the consultation layer as “seasons”
  choice: Zeitabschnitte
  rationale: Unterscheidet den zweiten Zeitbegriff von „Zeiten“ und „Jahre“, ohne die im Deutschen naheliegende, aber hier irreführende Bedeutung „Jahreszeiten“ einzutragen.
- source_word: ܫܢܝ̈ܐ
  choice: Jahre
  rationale: Direkte und natürliche Wiedergabe des konkreten Zeitmaßes.
theological_decisions:
- issue: Beschleunigung der endzeitlichen Zeitläufe
  choice: Die dreifache Steigerung mit Zeiten, Zeitabschnitten und Jahren bleibt bestehen.
  alternative: Die Aussage zu einer allgemeinen Verkürzung der Endzeit zusammenzufassen.
  rationale: Der Vers beschreibt die Beschleunigung in parallelen zeitlichen Kategorien; eine Zusammenfassung würde die rhetorische Spannung und die genuine Bildsprache abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ bewahrt den prophetischen Aufmerksamkeitsruf; die drei parallelen Zeitangaben bleiben klar unterscheidbar. Aufgrund der beschädigten und überlappenden Seitenüberlieferung wurde die englische POB-Fassung lediglich als kontrollierende Konsultationsschicht genutzt.
