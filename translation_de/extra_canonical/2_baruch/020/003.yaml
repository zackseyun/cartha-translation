translation:
  language: de
  text: Und nun bewahre alles, was ich dir gebiete, fest in deinem Herzen und versiegle es in den inneren Kammern deines Denkens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܐ / Herzensbegriff (rekonstruiert nach der konsultierten Versüberlieferung)
  choice: Herzen
  rationale: Bewahrt das biblisch-semitische Bild des Herzens als Zentrum des Erinnerns, Wollens und Verstehens.
- source_word: Gebotsform von „festhalten/bewahren“ (Versüberlieferung)
  choice: bewahre … fest
  rationale: Gibt sowohl das dauerhafte Festhalten als auch das innere Bewahren in natürlichem Deutsch wieder.
- source_word: „versiegeln“ (Versüberlieferung)
  choice: versiegle
  rationale: Erhält das konkrete Bild eines sicheren, unverlierbaren Einschließens.
- source_word: „innere Kammern“ (Versüberlieferung)
  choice: innersten Kammern
  rationale: Bewahrt die räumliche Metapher und formuliert zugleich idiomatisch.
- source_word: Denk-/Geistesbegriff (Versüberlieferung)
  choice: deines Denkens
  rationale: Vermeidet eine vorschnelle Gleichsetzung mit „Seele“ oder „Geist“ und bezeichnet den inneren Bereich des Verstehens und Erinnerns.
theological_decisions:
- issue: Verhältnis von Herz und Denken
  choice: Beide Bilder bleiben als unterschiedliche, aber überlappende Bereiche stehen.
  alternative: Beide Ausdrücke zu „Innerem“ oder „Geist“ vereinheitlichen.
  rationale: Die semitische Anthropologie soll nicht durch eine systematische Trennung oder Verschmelzung der Begriffe geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Aufforderungen und die Bilder von Herz, Versiegelung und inneren Kammern bleiben erhalten. Da der bereitgestellte syrische Kapitelblock stark gestört ist und den Zielvers nicht sicher erkennen lässt, folgt die Formulierung vorsichtig der konsultierten Versüberlieferung, ohne zusätzliche Auslegung einzutragen.
