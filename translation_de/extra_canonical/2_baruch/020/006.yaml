  yaml_path: translation/extra_canonical/2_baruch/020/006.yaml
  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: de
  text: Danach komm an diesen Ort. Dort werde ich dir erscheinen und mit dir über wahre Dinge sprechen. Ich werde dich über die Abfolge der Zeiten unterweisen; denn sie kommen und werden sich nicht verzögern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪ̈ܬܐ (mutmaßlicher Ausdruck hinter der Überlieferung „true things“)
  choice: wahre Dinge
  rationale: Bewahrt die konkrete und zugleich offene Ausdrucksweise, ohne sie verengend als bestimmte „Wahrheiten“ auszudeuten.
- source_word: ܛܟܣܐ / ܣܕܪܐ ܕܙܒ̈ܢܐ (durch die konsultierte Überlieferung als „order of the times“ bezeugt)
  choice: Abfolge der Zeiten
  rationale: Im Deutschen natürlicher als „Ordnung der Zeiten“ und passend für eine angekündigte zeitliche Folge eschatologischer Ereignisse.
- source_word: ܠܐ ܢܘܚܪܘܢ (durch die konsultierte Überlieferung als „will not delay“ bezeugt)
  choice: werden sich nicht verzögern
  rationale: Gibt die zeitliche Aussage direkt wieder, ohne ein zusätzliches handelndes Subjekt einzuführen.
theological_decisions:
- issue: Gegenstand der angekündigten Unterweisung
  choice: Abfolge der Zeiten
  alternative: Heilsordnung der Zeiten
  rationale: Die Übersetzung vermeidet eine konfessionell oder systematisch-theologisch aufgeladene Präzisierung, die der offene Ausdruck nicht verlangt.
- issue: Bezug von „sie kommen“
  choice: Das grammatische Pronomen bleibt auf „die Zeiten“ bezogen.
  alternative: Die angekündigten Ereignisse kommen.
  rationale: So bleibt die Spannung der überlieferten Formulierung erhalten, statt „Zeiten“ stillschweigend durch „Ereignisse“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und prophetisch. Da der bereitgestellte syrische Kapitelblock durch Seiteninterpolation und starke Textstörungen den Zielvers nicht sicher isoliert, wurde die englische POB-Fassung nur als kontrollierte Konsultationsschicht verwendet; unsichere Rückerschließungen wurden nicht als Fußnoten in den Lesetext aufgenommen.
