translation:
  language: de
  text: Dann werde ich dir das Gericht meiner Macht und meine unerforschlichen Wege zeigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ
  choice: Gericht
  rationale: Bewahrt den forensischen und zugleich vollziehenden Sinn von »Gericht«; »Urteil« wäre enger.
- source_word: ܚܝܠܝ
  choice: meiner Macht
  rationale: Gibt den Genitiv wörtlich wieder, ohne ihn als bloße Stärke oder Gewalt zu verengen.
- source_word: ܐܘܪ̈ܚܬܝ
  choice: meine Wege
  rationale: Das biblisch geprägte Bild bezeichnet Gottes Handlungsweisen und wird im Deutschen natürlich beibehalten.
- source_word: ܠܐ ܡܬܒܨܝܢ
  choice: unerforschlich
  rationale: Drückt aus, dass diese Wege menschlicher Erforschung entzogen sind, ohne zu behaupten, sie seien völlig unbekannt.
theological_decisions:
- issue: Verhältnis von Gottes Macht und Gericht
  choice: Gericht meiner Macht
  alternative: mein machtvolles Gericht
  rationale: Die Genitivverbindung bleibt erhalten; so wird nicht vorschnell festgelegt, ob die Macht das Gericht kennzeichnet, begründet oder vollzieht.
- issue: Unerforschlichkeit der göttlichen Wege
  choice: meine unerforschlichen Wege
  alternative: meine Wege, die nicht zu ergründen sind
  rationale: Die knappe attributive Form ist natürlich und würdevoll und bewahrt die Aussage über die Grenzen menschlicher Erkenntnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch vertrauten Schlüsselbegriffen. Die Formulierung bleibt knapp und bewahrt die theologische Spannung der Genitivverbindung.
