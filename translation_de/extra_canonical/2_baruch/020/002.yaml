  text: Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.
translation:
  language: de
  text: Darum habe ich Zion jetzt weggenommen, damit ich die Welt zur festgesetzten Zeit umso schneller heimsuche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heimsuchen“ kann hier sowohl Gottes Eingreifen im Allgemeinen als auch sein gerichtliches Eingreifen bezeichnen.
    reason: Die Bedeutungsbreite des zugrunde liegenden Besuchsverbs soll sichtbar bleiben, ohne sie im Haupttext einseitig auf Strafgericht festzulegen.
lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: Darum
  rationale: Gibt die begründende Folgerung knapp und natürlich wieder.
- source_word: ܢܣܒܬ
  choice: habe ich … weggenommen
  rationale: Bewahrt das konkrete Bild des Nehmens beziehungsweise Entfernens, ohne ausdrücklich festzulegen, ob Zerstörung, Preisgabe oder Entzug gemeint ist.
- source_word: ܨܗܝܘܢ
  choice: Zion
  rationale: Der traditionelle Eigenname wird unverändert beibehalten.
- source_word: ܥܠܡܐ
  choice: die Welt
  rationale: Entspricht dem weiten Bedeutungsumfang von ܥܠܡܐ im gegebenen Zusammenhang.
- source_word: ܐܣܥܘܪ
  choice: heimsuche
  rationale: Gibt das Motiv des göttlichen Aufsuchens beziehungsweise Eingreifens wieder und lässt offen, ob Gericht oder eine andere Form göttlichen Handelns im Vordergrund steht.
- source_word: ܒܙܒܢܗ
  choice: zu der für sie bestimmten Zeit
  rationale: Macht den Bezug auf den festgesetzten Zeitpunkt idiomatisch deutlich; das feminine Pronomen kann sich auf die Welt beziehen.
theological_decisions:
- issue: Bedeutung der göttlichen Heimsuchung
  choice: heimsuche
  alternative: zur Rechenschaft ziehe
  rationale: Die Alternative würde den Vorgang eindeutig als Strafgericht auslegen. „Heimsuchen“ erhält die im Besuchsverb liegende Spannung zwischen göttlichem Eingreifen und Gericht.
- issue: Wegnahme Zions
  choice: weggenommen
  alternative: zerstört
  rationale: „Zerstört“ wäre interpretierend enger. Die gewählte Fassung bewahrt die Bildlichkeit und die mögliche Mehrdeutigkeit des Quellverbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah an der syrischen Begründungs- und Zwecksatzfolge; „umso schneller“ gibt den komparativen Gedanken idiomatisch wieder.
