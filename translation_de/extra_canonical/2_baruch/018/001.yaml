  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: de
  text: 'Und ich antwortete und sagte: „Wer aus dem Licht geschöpft hat[a], kann es erkennen. Die Vielen aber empfingen aus Adams Finsternis und freuten sich nicht am Licht des Mose.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wer aus dem Licht genommen hat“.'
    reason: Das syrische Verb ܢܣܒ ist weit gefasst und kann „nehmen“ oder „empfangen“ bedeuten; „schöpfen“ gibt im Deutschen die Herkunftsmetapher natürlich wieder.
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: empfangen / empfingen
  rationale: Das Verb kann „nehmen“ oder „empfangen“ bedeuten. „Empfangen“ bewahrt das Bild, dass Menschen aus Licht beziehungsweise Finsternis schöpfen, und stellt Mose nicht als eigenständige Quelle des Lichts dar.
- source_word: ܢܘܗܪܐ
  choice: Licht
  rationale: „Licht“ erhält die unmittelbare apokalyptische Bildsprache und den Gegensatz zu Adams Finsternis.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: Adams Finsternis
  rationale: Die persönliche Zuordnung zu Adam bleibt erhalten und wird nicht zu allgemeiner menschlicher Unwissenheit verflacht.
- source_word: ܐܬܒܣܡܘ (hinter der fehlerhaften Lesung ܐܬܒܣܣܘ)
  choice: freuten sich
  rationale: Die kontrollierte Lesung weist auf das syrische Verb für „sich freuen“; die sichtbare Form mit ܣ statt ܡ beruht auf einem Übertragungs- beziehungsweise OCR-Fehler.
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: das Licht des Mose
  rationale: Die ausdrückliche Verbindung des Lichts mit Mose bleibt bestehen, ohne sie deutend durch „Gesetz“ oder eine andere Bezeichnung zu ersetzen.
theological_decisions:
- issue: Gegensatz zwischen Adams Finsternis und Moses Licht
  choice: Die genannten Gestalten und der heilsgeschichtliche Gegensatz bleiben ausdrücklich erhalten.
  alternative: Der Satz könnte allgemeiner als Gegensatz zwischen Unwissenheit und Unterweisung wiedergegeben werden.
  rationale: Der syrische Text nennt Adam und Mose; eine Verallgemeinerung würde seine geschichtliche und repräsentative Spannung abschwächen.
- issue: Moses Verhältnis zum Licht
  choice: Mose wird mit dem Licht verbunden, ohne als dessen eigenständiger Ursprung bezeichnet zu werden.
  alternative: „Moses Licht“ könnte als Licht verstanden werden, das Mose selbst hervorbringt.
  rationale: Die Formulierung „Licht des Mose“ wahrt die Genitivbeziehung, während „aus dem Licht empfangen“ den abgeleiteten Charakter der Erkenntnis offenhält.
translation_notes:
  register: Moderne, würdige Standardsprache. Die leicht feierliche Wiederholung „antwortete und sagte“ und die substantivische Form „die Vielen“ spiegeln den syrischen Satzbau, ohne die Aussage konfessionell auszudeuten.
