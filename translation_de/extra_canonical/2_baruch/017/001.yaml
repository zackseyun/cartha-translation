  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: de
  text: Und der Herr antwortete und sprach zu mir:[a] »Bei dem Höchsten gibt es keine Berechnung vieler oder weniger Jahre. Denn was nützte es Adam, dass er neunhundertdreißig Jahre lebte, wenn er doch das übertrat, was ihm geboten worden war? So brachte ihm die lange Zeit, die er lebte, keinen Nutzen, sondern brachte ihm den Tod und verkürzte die Lebensjahre seiner Nachkommen. Und was fehlte Mose, weil er nur hundertzwanzig Jahre lebte? Weil er dem untertan war, der ihn gebildet hatte, brachte er das Gesetz den Nachkommen Jakobs nahe und entzündete eine Leuchte für das Volk Israel.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und der Herr sprach zu mir.«'
    reason: Eine kürzere Wiedergabe lässt das einleitende »antwortete« unberücksichtigt; die Hauptfassung folgt dem bezeugten syrischen Antwortverb.
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: zählt es
  rationale: Die idiomatische deutsche Wendung gibt den Gedanken des Zählens beziehungsweise Anrechnens wieder und leitet natürlich zum Gegensatz zwischen vielen und wenigen Jahren über.
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: viele oder wenige Jahre
  rationale: Trotz der unsicheren Textgestalt ist der Gegensatz zwischen langer und kurzer Lebensdauer klar erkennbar.
- source_word: ܡܘܬܪܐ
  choice: nützte / Nutzen
  rationale: Die Wortwahl bewahrt die rhetorische Frage nach dem wirklichen Gewinn eines langen Lebens, ohne einen vorrangig wirtschaftlichen Sinn nahezulegen.
- source_word: ܡܒܣܪܝܢ
  choice: entzündete
  rationale: In Verbindung mit der Leuchte wahrt das Verb das anschauliche Bild von Offenbarung und Orientierung.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: das Volk Israel
  rationale: Die kollektive nationale Bezugnahme wird in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Moralischer Wert der Lebensdauer
  choice: Die Länge des Lebens bringt ohne Gehorsam keinen bleibenden Nutzen.
  alternative: Der Text stellt lediglich Adam und Mose gegenüber, ohne daraus einen allgemeineren Grundsatz abzuleiten.
  rationale: Die Gegenüberstellung von Adams langem Leben samt Übertretung und Moses kürzerem Leben samt Treue hat ausdrücklich argumentativen Charakter.
- issue: Mose als Lichtbringer
  choice: Das Bild der Leuchte bezeichnet die durch Mose und das Gesetz vermittelte göttliche Orientierung für Israel.
  alternative: Die Leuchte bezeichnet enger gefasst Mose selbst als Vorbild.
  rationale: Gesetz und Leuchte stehen unmittelbar nebeneinander; die Übersetzung lässt das Bild stehen und legt seine genaue Beziehung nicht zusätzlich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und der Kontrast zwischen Adam und Mose bleiben erhalten; das Bild von Gesetz und Leuchte wird nicht erklärend aufgelöst.
