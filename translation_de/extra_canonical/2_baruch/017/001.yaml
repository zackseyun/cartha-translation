revisions:
- from: Und der Herr antwortete und sprach zu mir:[a] »Beim Höchsten zählt es nicht, ob es viele oder wenige Jahre sind. Denn was nützte es Adam, dass er neunhundertdreißig Jahre lebte, wenn er doch das übertrat, was ihm geboten worden war? So brachte ihm die lange Zeit, die er lebte, keinen Nutzen, sondern den Tod; und sie verkürzte die Lebensjahre seiner Nachkommen. Und was fehlte Mose, weil er nur hundertzwanzig Jahre lebte? Weil er sich dem unterwarf, der ihn gebildet hatte, brachte er das Gesetz den Nachkommen Jakobs nahe und entzündete eine Leuchte für das Volk Israel.«
  to: Und der Herr antwortete und sprach zu mir:[a] »Bei dem Höchsten gibt es keine Berechnung vieler oder weniger Jahre. Denn was nützte es Adam, dass er neunhundertdreißig Jahre lebte, wenn er doch das übertrat, was ihm geboten worden war? So brachte ihm die lange Zeit, die er lebte, keinen Nutzen, sondern brachte ihm den Tod und verkürzte die Lebensjahre seiner Nachkommen. Und was fehlte Mose, weil er nur hundertzwanzig Jahre lebte? Weil er dem untertan war, der ihn gebildet hatte, brachte er das Gesetz den Nachkommen Jakobs nahe und entzündete eine Leuchte für das Volk Israel.«
  rationale: Die Revision bewahrt die Zählungs-/Berechnungsmetapher der Eingangsaussage, präzisiert die Beschreibung von Moses Verhältnis zu seinem Schöpfer und beseitigt eine Ellipse im Adam-Satz. Inhalt, Register, Eigennamen und das Leuchtenbild bleiben erhalten.
