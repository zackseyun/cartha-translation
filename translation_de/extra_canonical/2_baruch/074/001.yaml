  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: de
  text: '1 Und in jenen Tagen wird es so sein: Die Schnitter werden nicht müde werden, und die Bauleute werden sich nicht abmühen; denn die Arbeiten werden mit denen, die sie verrichten, wie von selbst voranschreiten – in großer Ruhe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: messores / wahrscheinliche syrische Bezeichnung für Erntearbeiter an der Kapitelgrenze
  choice: Schnitter
  rationale: Bewahrt das konkrete Bild der Ernte und passt zum Zusammenhang der endzeitlichen Fülle.
- source_word: aedificantes / wahrscheinliche syrische Bezeichnung für Bauende
  choice: Bauleute
  rationale: Eine natürliche, konkrete deutsche Bezeichnung, die das Gegenbild zu den Schnittern erhält.
- source_word: non fatigabuntur ... neque laborabunt
  choice: werden nicht müde werden ... werden sich nicht abmühen
  rationale: Hält die beiden Verben auseinander und bewahrt ihren parallelen Rhythmus.
- source_word: sponte erunt currentia opera
  choice: die Arbeiten werden ... wie von selbst voranschreiten
  rationale: Gibt das Bild mühelosen Fortgangs wieder, ohne es technisch oder mechanisch zu deuten.
- source_word: tranquillitate multa
  choice: in großer Ruhe
  rationale: Natürliches, würdiges Deutsch für die umfassende Ruhe der dargestellten Heilszeit.
theological_decisions:
- issue: Stärke des Bildes von müheloser Arbeit in der messianischen Zeit
  choice: die Arbeiten werden ... wie von selbst voranschreiten
  alternative: die Arbeiten werden leicht sein / guten Fortgang haben
  rationale: Die Formulierung wahrt das gesteigerte apokalyptische Bild einer erneuerten Ordnung und schwächt es nicht zu bloßem Erfolg ab.
- issue: Bedeutungsumfang des abschließenden Ausdrucks für Ruhe
  choice: in großer Ruhe
  alternative: in großem Frieden / in tiefer Rast
  rationale: „Ruhe“ lässt sowohl die Abwesenheit belastender Mühe als auch die umfassendere geordnete Friedlichkeit des Zusammenhangs anklingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bilder von Ernte und Bau bleiben konkret; die ungewöhnliche Verbindung der von selbst voranschreitenden Arbeiten mit den Ausführenden wird nicht erklärend aufgelöst.
