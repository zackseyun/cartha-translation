  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: de
  text: Wenn ich Gnade vor dir gefunden habe, möge dein Erbarmen meinen Geist rasch zu dir nehmen, damit ich zu meinen Vätern gehe und die Zerstörung meiner Mutter nicht mit ansehen muss.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܝܒܘܬܐ
  choice: Gnade
  rationale: Die traditionelle Wendung „Gnade vor dir finden“ gibt die Bitte um göttliche Gunst natürlich und würdig wieder.
- source_word: ܪ̈ܚܡܝܟ
  choice: dein Erbarmen
  rationale: Das syrische Pluralwort bezeichnet Gottes barmherzige Zuwendung; der deutsche Kollektivsingular klingt natürlicher als „deine Erbarmungen“.
- source_word: ܪܘܚܝ
  choice: meinen Geist
  rationale: „Geist“ entspricht dem syrischen Ausdruck und bewahrt die anthropologische Offenheit des Textes.
- source_word: ܐܒ̈ܗܝ
  choice: meine Väter
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird bewahrt; gemeint sind die verstorbenen Vorfahren.
- source_word: ܚܪܒܗ̇ ܕܐܡܝ
  choice: die Zerstörung meiner Mutter
  rationale: Die Personifikation der Stadt als Mutter bleibt erhalten, ohne die Metapher erklärend aufzulösen.
theological_decisions:
- issue: Bitte um den Tod vor der kommenden Katastrophe
  choice: „möge dein Erbarmen meinen Geist rasch zu dir nehmen“
  alternative: „lass mich rasch sterben“
  rationale: Die bildhafte und theologisch spannungsvolle Ausdrucksweise des Quelltexts wird beibehalten, statt sie auf eine direkte Todesbitte zu reduzieren.
- issue: Bezeichnung der zerstörten Stadt als Mutter
  choice: „meiner Mutter“
  alternative: „meiner Mutterstadt“ oder „Jerusalems“
  rationale: Die genuine Metapher bleibt unaufgelöst und bewahrt ihren emotionalen Gehalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nicht mit ansehen muss“ ist idiomatischer als „nicht sehe“ und bringt den Wunsch zum Ausdruck, die Zerstörung nicht miterleben zu müssen.
