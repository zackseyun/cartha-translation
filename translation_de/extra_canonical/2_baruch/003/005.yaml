  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: de
  text: Denn wenn du deine Stadt vernichtest, dein Heiligtum für eine Zeit preisgibst und dein Volk unter die Völker zerstreust, sodass es nicht mehr besteht,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒܕ
  choice: vernichtest
  rationale: Die Kausativform bezeichnet hier das Zugrunde-richten bzw. Vernichten der Stadt; die aktive Form wahrt zugleich die Schärfe von Baruchs Frage an Gott.
- source_word: ܬܫܠܡ
  choice: preisgibst
  rationale: Das Verb kann das Übergeben oder Ausliefern bezeichnen. „preisgibst“ ist im Zusammenhang mit Stadt und Heiligtum natürlich und erhält den Gedanken der Überlassung an fremde Gewalt.
- source_word: ܡܕܝܢܬܟ
  choice: deine Stadt
  rationale: Die Possessivform wird direkt wiedergegeben; gemeint ist Jerusalem, ohne dass der Eigenname erläuternd in den Text eingefügt wird.
- source_word: ܥܡܡ̈ܐ
  choice: die Völker
  rationale: Der Plural bezeichnet die fremden Nationen beziehungsweise Völker; „Völker“ bewahrt den biblischen Sprachgebrauch, ohne ihn konfessionell aufzuladen.
theological_decisions:
- issue: Gott als Handelnder bei der Vernichtung und Preisgabe
  choice: Die direkten Verben „vernichtest“ und „preisgibst“ bleiben erhalten.
  alternative: Eine abschwächende Formulierung wie „zulässt, dass deine Stadt vernichtet wird“.
  rationale: Baruchs Anrede schreibt Gott das Handeln unmittelbar zu. Eine Umformung in bloßes Zulassen würde die theologische Spannung des Ausgangstextes auflösen.
- issue: Fortbestand des Volkes
  choice: „sodass es nicht mehr besteht“
  alternative: „sodass sie nicht mehr da sind“ oder „damit sie zugrunde gehen“.
  rationale: Die Formulierung bewahrt die Aussage vom drohenden Ende des Volkes, ohne vorschnell festzulegen, ob vollständige physische Vernichtung, Verlust nationaler Existenz oder beides gemeint ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt als konditionaler, zum folgenden Vers hin offener Nebensatz stehen. Die parallele Folge „deine Stadt … dein Heiligtum … dein Volk“ wurde rhythmisch bewahrt.
