  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: de
  text: Und damit ihr an dieser Stadt[a] erkennen könnt, dass sie wegen der Bosheit ihrer Taten wie eine verbitterte Witwe ist und dass ihre Erniedrigung wie süße Beute ist.“[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dieser Stadt aus sehen könnt“.'
    reason: Das syrische ܡܢ kann hier entweder lokal („von/aus“) oder auf den Gegenstand beziehungsweise Anschauungsfall des Erkennens bezogen verstanden werden.
  - marker: b
    text: 'Oder: „Und damit ihr an dieser Stadt erkennen könnt: Wegen der Bosheit ihrer Taten ist diese Stadt wie eine verbitterte Witwe, und ihre Erniedrigung ist wie süße Beute.“'
    reason: Die syrische Satzgliederung lässt offen, wie eng die Begründung mit den folgenden Vergleichen zu verbinden ist.
lexical_decisions:
- source_word: ܡܢ ܗܕܐ ܡܕܝܢܬܐ (men hāḏē mdīntā)
  choice: an dieser Stadt
  rationale: Die Präposition ܡܢ bedeutet gewöhnlich „von/aus“, kann im Zusammenhang des Sehens jedoch den Gegenstand bzw. den Ort der Erkenntnis bezeichnen. „An dieser Stadt sehen“ ist im Deutschen natürlich und wahrt diese Offenheit besser als ein rein lokales „aus dieser Stadt“.
- source_word: ܥܡܗܕܐ ܡܪܝܪܐ
  choice: verbitterte Witwe
  rationale: Das Substantiv wird im Überlieferungszusammenhang als „Witwe“ verstanden; ܡܪܝܪܐ bedeutet wörtlich „bitter“. „Verbittert“ vermittelt hier idiomatisch einen von bitterem Leid geprägten Zustand, nicht einen unangenehmen Charakter.
- source_word: ܨܥܪܘܗܝ
  choice: ihre Erniedrigung
  rationale: Die Form gehört zum Bedeutungsfeld von Schmach, Verachtung und Erniedrigung. Die substantivische Wiedergabe folgt der parallelen Bildstruktur, ohne näher festzulegen, ob eher Zustand, Behandlung oder Schande gemeint ist.
- source_word: ܫܘܕܐ ܚܠܝܬܐ
  choice: süße Beute
  rationale: Die auffällige Verbindung von „Beute“ und „süß“ wird als bewusstes Bild bewahrt, statt sie erklärend zu glätten.
theological_decisions:
- issue: Begründungs- und Vergleichsstruktur des Satzes
  choice: „dass sie wegen der Bosheit ihrer Taten wie … ist“
  alternative: „wegen der Bosheit ihrer Taten diese Stadt wie …“
  rationale: Im Syrischen ist die elliptische Syntax mehrdeutig. Die gewählte Ergänzung ergibt einen verständlichen deutschen Satz, während eine Fußnote die formal nähere, weniger eindeutig gegliederte Lesart dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen Bilder „verbitterte Witwe“ und „süße Beute“ bleiben erhalten; die elliptische syrische Syntax wird im Haupttext behutsam ergänzt und in den Fußnoten als mehrdeutig ausgewiesen.
