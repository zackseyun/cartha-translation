  text: Or how will one speak of your praise? Or to whom will what is in your law be explained?
translation:
  language: de
  text: Oder wie soll man von deinem Lob sprechen? Oder wem soll erklärt werden, was in deinem Gesetz steht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (tešbuḥtāk)
  choice: deinem Lob
  rationale: Das syrische Substantiv steht im Singular und bezeichnet Lob bzw. Lobpreis; die singularische Wiedergabe bewahrt die Form des Ausgangstextes.
- source_word: ܢܬܦܫܩ (netpaššaq)
  choice: soll erklärt werden
  rationale: Die passive Form bezeichnet das Erklären oder Auslegen; die unpersönliche Passivkonstruktion erhält die Offenheit darüber, wer die Erklärung gibt.
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: deinem Gesetz
  rationale: Das Wort bezeichnet hier das göttliche Gesetz; „Gesetz“ ist im Deutschen klar und traditionsübergreifend verständlich.
theological_decisions:
- issue: Bedeutungsumfang von „Gesetz“
  choice: deinem Gesetz
  alternative: deiner Weisung
  rationale: „Gesetz“ entspricht dem üblichen Sinn von nāmōsā und vermeidet eine interpretierende Verengung oder Ausweitung; der weitere Sinn von göttlicher Weisung bleibt kontextuell möglich.
translation_notes:
  register: Zwei parallele rhetorische Fragen in würdigem, modernem Standarddeutsch. Das unbestimmte Subjekt der ersten Frage und das Passiv der zweiten bleiben erhalten.
