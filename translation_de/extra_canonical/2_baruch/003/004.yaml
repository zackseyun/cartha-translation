  rationale: Die räumlich-bildhafte Formulierung des Syrischen wird bewahrt; sie bezeichnet das Reden in Gottes Gegenwart.
- source_word: ܡܪܝܐ
  choice: Herr
  rationale: Die übliche ehrerbietige Gottesbezeichnung wird in moderner deutscher Bibelsprache mit „Herr“ wiedergegeben.
