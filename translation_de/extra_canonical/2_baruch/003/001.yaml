  yaml_path: translation/extra_canonical/2_baruch/003/001.yaml
  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: de
  text: '1 Und ich sagte: »O Herr, mein Herr, bin ich dazu in die Welt gekommen, um das Unheil meiner Mutter[a] zu sehen? Nein, mein Herr!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „meiner Mutter“ ist Jerusalem beziehungsweise Zion gemeint.
    reason: Die Fußnote erklärt die personifizierende Metapher, ohne sie im Haupttext zu beseitigen.
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: bin ich … in die Welt gekommen
  rationale: Die durch die Textkontrolle bestätigte syrische Lesart bezeichnet Baruchs Eintritt in die Welt; sie ist einer OCR-bedingten Lesart im abgedruckten Ausschnitt vorzuziehen.
- source_word: ܒܝܫܬܗ̇
  choice: das Unheil
  rationale: „Unheil“ gibt hier das drohende Leid beziehungsweise Unglück wieder, ohne bereits den in Vers 2 ausdrücklich genannten Untergang vorwegzunehmen.
- source_word: ܐܡܝ
  choice: meiner Mutter
  rationale: Die mütterliche Personifikation Jerusalems wird bewahrt, statt sie im Haupttext erklärend durch „meine Stadt“ oder „Zion“ zu ersetzen.
- source_word: ܡܪܝܐ ܡܪܝܐ
  choice: O Herr, mein Herr
  rationale: Die feierliche, eindringliche Anrede wird in natürlichem biblischem Deutsch wiedergegeben.
theological_decisions:
- issue: Identität der „Mutter“
  choice: Die Metapher bleibt im Haupttext als „meine Mutter“ stehen.
  alternative: Jerusalem, Zion oder meine Stadt
  rationale: Gemeint ist Jerusalem beziehungsweise Zion, doch die mütterliche Bildsprache trägt Baruchs persönliche und gemeinschaftliche Klage und soll nicht aufgelöst werden.
- issue: Art von Baruchs Frage
  choice: Die Frage wird als verzweifelte Klage formuliert.
  alternative: Eine sachliche Frage nach seiner Lebensbestimmung
  rationale: Anrede, rhetorische Frage und abschließendes „Nein“ zeigen eine leidenschaftliche Bitte, ohne dass Baruch damit Gottes Herrschaft ausdrücklich bestreitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Wucht der Anrede und des abschließenden Widerspruchs bleibt erhalten; „Unheil“ vermeidet eine Verwechslung mit dem ausdrücklichen „Untergang“ in Vers 2.
