base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/003.yaml
  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: de
  text: 'Denn diese beiden Dinge sind zu schwer für mich: Ich kann nicht die Hälfte deines Volkes preisgeben, und auch meine Seele kann es nicht ertragen, den Untergang meiner Mutter mitanzusehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene syrische Wortlaut kann auch so verstanden werden: „Ich kann weder mit den Vielen noch mit meiner Versammlung sterben; auch meine Seele kann es nicht ertragen, das Unheil meiner Mutter mitanzusehen.“'
    reason: Die Anmerkung kennzeichnet die Abweichung zutreffend als alternative Deutung des erhaltenen syrischen Wortlauts und bewahrt sie, ohne den Haupttext zu überladen.
lexical_decisions:
- source_word: ܠܐ ܡܫܟܚ ܐܢܐ
  choice: ich kann … nicht
  rationale: Die syrische Wendung bezeichnet hier Unvermögen beziehungsweise Unvermögen zum Ertragen; die schlichte deutsche Wiedergabe erhält den parallelen Satzbau.
- source_word: ܒܒܝܫܬܗ̇ ܕܐܡܝ
  choice: den Untergang meiner Mutter
  rationale: Wörtlich steht das Unheil beziehungsweise Verderben der „Mutter“. Im Kontext ist die personifizierte Stadt Jerusalem gemeint; „Untergang“ gibt die drohende Zerstörung natürlich wieder, ohne die Metapher „Mutter“ aufzulösen.
- source_word: ܢܦܫܝ
  choice: meine Seele
  rationale: Die formale Wiedergabe bewahrt die anthropologische Ausdrucksweise und den emotionalen Nachdruck des Syrischen.
- source_word: ܟܢܘܫܬܝ
  choice: deines Volkes
  rationale: Die zugrunde liegende Passage ist textlich beziehungsweise in ihrer Lesung unsicher. Der Haupttext folgt der sinnvollen, überlieferten Deutung auf den zurückbleibenden Teil des Gottesvolkes; die abweichende nähere Wiedergabe der erhaltenen syrischen Wortfolge wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Bezeichnung Jerusalems als „meine Mutter“
  choice: Metapher unverändert beibehalten
  alternative: Jerusalem ausdrücklich nennen
  rationale: Die Personifikation gehört zur theologischen und emotionalen Spannung des Textes und soll nicht erklärend aufgelöst werden.
- issue: Unklare erste Hälfte des Verses
  choice: Im Haupttext die Deutung „die Hälfte deines Volkes nicht im Stich lassen“ verwenden
  alternative: „Ich kann nicht mit den Vielen oder mit meiner Versammlung sterben“
  rationale: Die konsultierte englische Fassung bietet eine kohärente kontextuelle Deutung, während die erhaltene syrische Wortfolge eine abweichende Lesart nahelegt. Die Unsicherheit wird ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Stich lassen“ ist gegenwärtig und verständlich, ohne umgangssprachlich zu wirken. Die Metapher der Mutter und die Seelensprache bleiben erhalten; die textliche Unsicherheit wird transparent in der Fußnote dokumentiert.
