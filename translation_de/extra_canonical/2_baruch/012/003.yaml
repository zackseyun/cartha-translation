  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: de
  text: Erwartet oder hofft nicht darauf, dass ihr immer Wohlstand und Freude haben werdet. Überhebt euch nicht zu sehr und übt keine Unterdrückung aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒܪ / ܪܓܐ (im bereitgestellten Ausschnitt nicht unmittelbar sichtbar; durch die kontrollierte Versüberlieferung bezeugte Erwartungs-/Hoffnungsbegriffe)
  choice: erwartet oder hofft nicht darauf
  rationale: Gibt die beiden nahe verwandten Verben in natürlichem Deutsch wieder, ohne sie zu einem einzigen Begriff zu verschmelzen.
- source_word: ܫܠܡܐ / ܚܕܘܬܐ (im Ausschnitt nicht unmittelbar sichtbar; kontrollierte Versüberlieferung)
  choice: Wohlstand und Freude
  rationale: „Wohlstand“ erfasst hier das Wohlergehen bzw. Gedeihen besser als das primär politische „Frieden“; „Freude“ bewahrt den zweiten eigenständigen Begriff.
- source_word: Pluralformen der Anrede
  choice: ihr / euch
  rationale: Die Adressaten werden kollektiv in der zweiten Person Plural angesprochen.
- source_word: Begriff des Sich-Erhöhens
  choice: überhebt euch nicht
  rationale: Natürliches, würdiges Deutsch für selbstherrliche Erhöhung; die moralische Wertung bleibt erhalten.
- source_word: Begriff des Unterdrückens
  choice: übt keine Unterdrückung aus
  rationale: Bewahrt die offene, objektlose Formulierung, ohne ein im Text nicht ausdrücklich genanntes Objekt wie „niemanden“ oder „andere“ einzufügen.
theological_decisions:
- issue: Dauer des gegenwärtigen Wohlergehens
  choice: für immer
  alternative: allezeit
  rationale: Die Warnung richtet sich gegen die Annahme dauerhaften Wohlstands; „für immer“ ist modern und wahrt den zeitlichen Nachdruck.
- issue: Numerus der Angesprochenen
  choice: 'Plural: „ihr/euch“'
  alternative: 'Singular: „du/dich“'
  rationale: Die syrische Grammatik der kontrollierten Versüberlieferung spricht eine Mehrzahl kollektiv an; eine singularische Individualisierung wäre irreführend.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der gelieferte syrische Seitenausschnitt enthält den Wortlaut von 12,3 nicht unmittelbar, sondern angrenzendes Kapitelmaterial; deshalb stützt sich die Formulierung neben der Primärquellenangabe auf die kontrollierte Versüberlieferung und die auditierte englische Konsultationsschicht. Keine konfessionelle Deutung wurde ergänzt.
