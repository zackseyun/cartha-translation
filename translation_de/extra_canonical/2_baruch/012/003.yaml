- from: Erwartet oder hofft nicht darauf, dass ihr für immer Wohlstand und Freude haben werdet. Überhebt euch nicht und übt keine Unterdrückung aus.
  to: Erwartet oder hofft nicht darauf, dass ihr immer Wohlstand und Freude haben werdet. Überhebt euch nicht zu sehr und übt keine Unterdrückung aus.
  rationale: Die einzige sichere Änderung ergänzt die in der englischen Auditspur bezeugte Intensivierung der Warnung vor Selbstüberhebung. „Immer“ entspricht der gewöhnlichen deutschen Wiedergabe von „always“; im Übrigen bleibt der Sinn unverändert. Da der gelieferte syrische Ausschnitt den Vers nicht selbst enthält, werden keine weitergehenden lexikalischen Änderungen behauptet.
