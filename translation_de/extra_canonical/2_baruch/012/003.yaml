    rationale: Die englische Auditspur lautet ausdrücklich „Do not exalt yourselves too highly“. „Überhebt euch nicht“ gibt zwar die Grundaufforderung wieder, lässt aber die qualifizierende Begrenzung aus. „Überhebt euch nicht zu sehr“ stellt sie in natürlichem Deutsch wieder.
