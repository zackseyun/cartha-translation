  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: de
  text: Denn zur festgesetzten Zeit wird gewiss Zorn gegen dich entfacht werden; jetzt aber wird er durch Langmut wie mit einem Zaum zurückgehalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: gewiss
  rationale: Gibt die bekräftigende Bedeutung des syrischen Adverbs natürlich und würdig wieder.
- source_word: ܒܙܒܢܐ
  choice: zur festgesetzten Zeit
  rationale: Der Kontext bezeichnet nicht bloß irgendeinen Zeitpunkt, sondern den Zeitpunkt, zu dem der bislang zurückgehaltene Zorn wirksam wird.
- source_word: ܪܘܓܙܐ (im durch den Kapitelkontext erschlossenen Verswortlaut)
  choice: Zorn
  rationale: Bewahrt die sachliche und theologisch offene Bezeichnung, ohne den Träger des Zorns ausdrücklich festzulegen.
- source_word: ܡܬܬܒܪܐ / zurückhaltende Passivform der Überlieferung
  choice: wird … zurückgehalten
  rationale: Die passive Aussage bleibt erhalten; der Handelnde wird nicht ergänzt.
- source_word: ܡܓܪܬ ܪܘܚܐ (durch die englische Kontrollschicht bezeugter Versbestand)
  choice: Langmut
  rationale: Gibt den idiomatischen Sinn von wörtlich ‚Länge des Geistes‘ prägnant wieder.
- source_word: Zaum-Vergleich der Versüberlieferung
  choice: wie mit einem Zaum
  rationale: Erhält das konkrete Bild eines gebändigten, noch nicht losgelassenen Zorns.
theological_decisions:
- issue: Träger des Zorns
  choice: Kein ausdrückliches ‚Gottes‘ ergänzt
  alternative: Gottes Zorn
  rationale: Der Zusammenhang kann göttlichen Zorn nahelegen, doch die vorliegende Aussage nennt den Träger nicht ausdrücklich; die Übersetzung wahrt diese Offenheit.
- issue: Langmut als Mittel oder Ursache des Aufschubs
  choice: „durch Langmut“
  alternative: „aus Langmut“
  rationale: Die instrumentale Formulierung entspricht dem Bild des Zügels, ohne die personifizierte oder theologische Zuordnung näher festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung hebt den Gegensatz zwischen künftigem Zorn und gegenwärtiger Zurückhaltung hervor; keine konfessionell geprägte Deutung wird ergänzt.
