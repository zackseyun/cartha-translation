base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: de
  text: 'Und ich antwortete: »O Herr, mein Herr, die Jahre dieses Zeitalters[a] sind wenige und böse. Wer kann in so kurzer Zeit erlangen, was unermesslich[b] ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Zeit“ beziehungsweise „dieser Weltzeit“.'
    reason: Das syrische Wort kann eine Zeitspanne bezeichnen und trägt hier wahrscheinlich den apokalyptischen Sinn des gegenwärtigen Zeitalters.
  - marker: b
    text: 'Wörtlich auch: „was ohne Maß ist“ oder „was jedes Maß übersteigt“.'
    reason: Die syrische Formulierung lässt den genauen Gegenstand bewusst unbestimmt.
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: die Jahre
  rationale: Das syrische Wort bezeichnet hier Jahre und bewahrt so die konkrete Klage über die Kürze des menschlichen Lebens.
- source_word: ܙܒܘ̈ܢܝ
  choice: dieses Zeitalters
  rationale: Im apokalyptischen Zusammenhang ist nicht nur ein einzelner Zeitpunkt, sondern die gegenwärtige, vergängliche Weltzeit gemeint.
- source_word: ܡܫܟܚ
  choice: kann … erlangen
  rationale: „Erlangen“ gibt die aktive Frage danach wieder, ob ein Mensch innerhalb seiner kurzen Lebenszeit das Ziel erreichen kann.
- source_word: ܡܟܝܠܐ
  choice: in so kurzer Zeit
  rationale: Die Wendung bezeichnet die geringe beziehungsweise knapp bemessene Zeitspanne und bildet den Gegensatz zum Unermesslichen.
- source_word: ܡܫܘܚܬܐ
  choice: was unermesslich ist
  rationale: Die substantivische Formulierung hält offen, worauf das Unermessliche genau verweist, und bewahrt den Gegensatz von begrenzter Lebenszeit und einem jeder Messung entzogenen Ziel.
theological_decisions:
- issue: Ob Baruchs Klage die göttliche Gerechtigkeit bestreitet oder die menschliche Begrenztheit angesichts eines unermesslichen Ziels beklagt
  choice: Die Übersetzung formuliert eine scharfe Klage über die Kürze des menschlichen Lebens, ohne sie ausdrücklich als Bestreitung der göttlichen Gerechtigkeit zu deuten.
  alternative: Die Frage könnte als unmittelbare Anklage gegen die Fairness der göttlichen Forderung verstanden werden.
  rationale: Der Wortlaut bleibt als Frage spannungsvoll; der nähere Zusammenhang antwortet jedoch mit Gehorsam und Lebensführung statt mit der bloßen Länge des Lebens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wenige und böse“ bewahrt die knappe, biblisch geprägte Doppelcharakterisierung; „erlangen“ klingt natürlicher als „erwerben“, ohne die aktive Zielbewegung abzuschwächen.
