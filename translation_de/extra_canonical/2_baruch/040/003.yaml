  text: And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.
translation:
  language: de
  text: Und seine Herrschaft wird für immer bestehen, bis die Welt des Verderbens an ihr Ende kommt und bis die zuvor genannten Zeiten erfüllt sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܛܢܗ (sinngemäß nach dem überlieferten Zusammenhang)
  choice: seine Herrschaft
  rationale: Gibt den politischen und eschatologischen Sinn von „Herrschaft, Machtbereich“ natürlich und würdig wieder.
- source_word: ܠܥܠܡ
  choice: für immer
  rationale: Bewahrt die Aussage dauerhafter Herrschaft, ohne das anschließende „bis“ abzuschwächen oder die darin liegende Spannung aufzulösen.
- source_word: ܥܠܡܐ ܕܚܒܠܐ
  choice: die Welt des Verderbens
  rationale: Die formnahe Wendung erhält die Mehrdeutigkeit von Verderben, Verfall und Vergänglichkeit besser als eine eingrenzende Umschreibung.
- source_word: ܙܒ̈ܢܐ
  choice: die … Zeiten
  rationale: „Zeiten“ entspricht der apokalyptischen Rede von festgesetzten Zeitabschnitten; „Fristen“ wäre enger.
theological_decisions:
- issue: Dauer der messianischen Herrschaft und anschließende Bis-Sätze
  choice: „für immer … bis … und bis …“
  alternative: „auf ewig, auch nachdem …“ oder „bis zum Ende …“
  rationale: Die sprachliche Spannung zwischen dauerhafter Herrschaft und zeitlichen Endpunkten bleibt bestehen und wird nicht systematisch harmonisiert.
- issue: Charakter der gegenwärtigen Welt
  choice: „Welt des Verderbens“
  alternative: „vergängliche Welt“
  rationale: Die Übersetzung lässt offen, ob moralisches Verderben, zerstörerischer Zustand oder Vergänglichkeit im Vordergrund steht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die koordinierte Satzstruktur des Ausgangstextes bleibt erhalten; es werden keine konfessionellen Deutungen ergänzt.
