    issue: Das Gefundenwerden der Restgruppe ist zu bloßem Sich-Befinden abgeschwächt.
    rationale: Die englische POB-Spur und die bekannte syrische Verslesart haben „those who are found“. Diese passive Auswahl-/Erhaltungsformulierung sollte im Deutschen erhalten bleiben.
  revised_text: Danach wird er ihn töten und die Übrigen meines Volkes beschützen, die an dem Ort gefunden werden, den ich erwählt habe.
