revisions:
- from: Danach wird er ihn töten und den Rest meines Volkes beschützen, der sich an dem Ort befindet, den ich erwählt habe.
  to: Danach wird er ihn töten und die Übrigen meines Volkes beschützen, die an dem Ort gefunden werden, den ich erwählt habe.
  rationale: Die Revision stellt die passive Formulierung „gefunden werden“ wieder her und verwendet für die pluralische Personengruppe eine im modernen Deutschen natürliche Bezugskonstruktion. Die Pronomen bleiben wie im Ausgangstext unaufgelöst; es wird keine messianische oder politische Identifikation ergänzt.
