  text: And afterward he will put him to death, and he will protect the rest of my people, those who are found in the place that I have chosen.
translation:
  language: de
  text: Danach wird er ihn töten und die Übrigen meines Volkes beschützen, die an dem Ort gefunden werden, den ich erwählt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ (sinngemäß im überlieferten Verskontext)
  choice: Danach
  rationale: Gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: ܢܩܛܠܝܘܗܝ (sinngemäß im überlieferten Verskontext)
  choice: wird er ihn töten
  rationale: Bewahrt Subjekt und pronominales Objekt, ohne deren im vorhergehenden Vers bestimmte Bezugspersonen erklärend in den Text einzusetzen.
- source_word: ܫܪܟܐ ܕܥܡܝ (sinngemäß im überlieferten Verskontext)
  choice: den Rest meines Volkes
  rationale: Die kollektive Größe wird formal und theologisch neutral als „Rest“ wiedergegeben.
- source_word: ܐܬܪܐ ܕܓܒܝܬ (sinngemäß im überlieferten Verskontext)
  choice: den Ort, den ich erwählt habe
  rationale: „Erwählt“ entspricht dem Wahlmotiv und wahrt den gehobenen biblischen Sprachgebrauch.
theological_decisions:
- issue: Identität der mit „er“ und „ihn“ bezeichneten Personen
  choice: Die Pronomen bleiben unaufgelöst.
  alternative: „Der Messias wird den letzten Herrscher töten.“
  rationale: Die Referenten ergeben sich aus 40,1; ihre ausdrückliche Benennung in 40,2 wäre eine interpretierende Erweiterung.
- issue: Bedeutung des „Restes“
  choice: „Rest meines Volkes“ bleibt als kollektive Bezeichnung stehen.
  alternative: „die übrigen Angehörigen meines Volkes“
  rationale: Die traditionelle und theologisch offene Rest-Terminologie des Ausgangstextes soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die überlieferte Satzstruktur. Der bereitgestellte syrische Seitenausschnitt bricht noch innerhalb von 40,1 ab; für 40,2 wurde daher die im englischen POB dokumentierte, mit der bekannten syrischen Versüberlieferung übereinstimmende Lesart herangezogen.
