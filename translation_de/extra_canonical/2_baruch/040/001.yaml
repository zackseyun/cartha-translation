base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: de
  text: Der letzte Herrscher jener Zeit wird am Leben gelassen werden, nachdem die Menge seiner Heerscharen mit dem Schwert niedergestreckt worden ist. Dann wird er gefesselt, und man wird ihn auf den Berg Zion hinaufführen. Mein Messias wird ihn aller seiner Frevel überführen und ihm alle bösen Taten seiner Heerscharen vor Augen stellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܝܛܐ / ruler sense
  choice: Herrscher
  rationale: „Herrscher“ gibt die politische Stellung der endzeitlichen Gestalt in natürlichem, würdigem Deutsch wieder, ohne einen bestimmten historischen Titel einzutragen.
- source_word: ܒܝܫܘܬܗ
  choice: Freveltaten
  rationale: „Freveltaten“ bewahrt sowohl den moralischen Ernst als auch die gegen Gott gerichtete Dimension der Anklage; der Plural passt im Deutschen natürlich zu „all“ und zur gerichtlichen Aufzählung.
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: die bösen Taten seiner Heerscharen
  rationale: Die Formulierung erhält ausdrücklich den Tatbezug, die moralische Wertung und den kollektiven Bezug auf die Streitkräfte.
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: der Berg Zion
  rationale: Dies ist die geläufige deutsche Form des Eigennamens und bewahrt den Schauplatz des messianischen Gerichts.
- source_word: ܡܫܝܚܝ
  choice: mein Messias
  rationale: Die possessive Form und die ausdrücklich messianische Bezeichnung bleiben unverändert sichtbar; sie werden weder verallgemeinert noch konfessionell ausgelegt.
theological_decisions:
- issue: Rolle des Messias beim Gericht über den letzten Herrscher
  choice: Der Messias erscheint als persönliche richterliche Gestalt, die den letzten Herrscher überführt.
  alternative: Die Aussage lediglich als Bild für ein unpersönliches messianisches Zeitalter zu verstehen.
  rationale: Die Bezeichnung „mein Messias“ und sein konkretes richterliches Handeln sprechen für eine personale Darstellung; weitergehende dogmatische Festlegungen werden vermieden.
- issue: Art der Schuld des letzten Herrschers
  choice: „Freveltaten“ lässt die religiöse und moralische Dimension der Schuld anklingen.
  alternative: „Bosheit“ oder „böse Taten“ könnte die Anklage allgemeiner und weniger ausdrücklich als Vergehen gegen Gott wiedergeben.
  rationale: Die Gerichtsszene auf Zion und die Handlung des Messias tragen eine theologische Dimension, die nicht auf bloß politische Verbrechen verengt werden sollte.
translation_notes:
  register: Modernes Standarddeutsch in würdigem apokalyptischem Erzählton. „Lebend übrig gelassen“ bewahrt gegenüber dem bloßen „am Leben bleiben“ den Eindruck gezielter Verschonung. „Vor Augen stellen“ gibt die gerichtliche Konfrontation idiomatisch wieder. Der bereitgestellte Ceriani-Seitenausschnitt endet unmittelbar am Beginn von Kapitel 40; der genaue Wortlaut des Verses ist dort nicht vollständig sichtbar. Daher stützt sich der Entwurf für diesen Vers auf die mitgelieferte, lexikalisch auditierte englische Konsultationsschicht und ihre syrischen Lemmata, ohne über diese Evidenz hinaus textkritische Einzelheiten zu behaupten.
