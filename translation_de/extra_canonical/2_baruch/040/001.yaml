    rationale: Die Formulierung ist zwar verständlich, aber im modernen Standarddeutsch unnatürlich. „Wird am Leben gelassen werden“ bewahrt die passive, auf Verschonung weisende Nuance.
  - severity: low
    issue: Gerichtliche Rektion bei „überführen“
    rationale: „Jemanden aller seiner Frevel überführen“ ist die idiomatischere gerichtliche Konstruktion und gibt die Anklage wegen sämtlicher Verfehlungen präziser wieder als „wegen all seiner Freveltaten“.
  revised_text: Der letzte Herrscher jener Zeit wird am Leben gelassen werden, nachdem die Menge seiner Heerscharen mit dem Schwert niedergestreckt worden ist. Dann wird er gefesselt, und man wird ihn auf den Berg Zion hinaufführen. Mein Messias wird ihn aller seiner Frevel überführen und ihm alle bösen Taten seiner Heerscharen vor Augen stellen.
