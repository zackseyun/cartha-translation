  source_fidelity: 'Die Satzglieder, die Szenenfolge und die zentralen Begriffe entsprechen der bereitgestellten englischen Auditspur und den angegebenen syrischen Lemmata: der letzte Herrscher bleibt am Leben, seine Heerscharen werden durch das Schwert geschlagen, er wird nach Zion geführt, und der Messias legt seine Schuld sowie die bösen Taten seiner Heerscharen offen. Da der übermittelte syrische Seitenausschnitt den Wortlaut von 40:1 nicht selbst enthält, sind über diese kontrollierte Evidenz hinaus keine textkritischen Behauptungen möglich.'
  naturalness: Der Entwurf ist insgesamt verständlich und würdig. „Lebend übrig gelassen werden“ wirkt jedoch unnötig schwerfällig. „Am Leben gelassen werden“ ist modernes Standarddeutsch und erhält den Sinn des gezielten Verschontwerdens. Die Konstruktion „ihn wegen all seiner Freveltaten überführen“ wird idiomatischer und enger am gerichtlichen Sprachgebrauch als „ihn aller seiner Frevel überführen“ formuliert.
  terminology: „Herrscher“, „Heerscharen“, „Berg Zion“ und „mein Messias“ sind passend und registergerecht. „Frevel“ gibt die religiös-moralische Schwere von ܒܝܫܘܬܗ angemessen wieder, ohne die Aussage dogmatisch zu erweitern. „Böse Taten“ bewahrt beim zweiten Schuldbegriff den ausdrücklich handlungsbezogenen und kollektiven Bezug.
