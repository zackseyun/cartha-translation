revisions:
- from: Der letzte Herrscher jener Zeit wird lebend übrig gelassen werden, nachdem die Menge seiner Heerscharen mit dem Schwert niedergestreckt worden ist. Dann wird er gefesselt, und man wird ihn auf den Berg Zion hinaufführen. Mein Messias wird ihn wegen all seiner Freveltaten überführen und ihm alle bösen Taten seiner Heerscharen vor Augen stellen.
  to: Der letzte Herrscher jener Zeit wird am Leben gelassen werden, nachdem die Menge seiner Heerscharen mit dem Schwert niedergestreckt worden ist. Dann wird er gefesselt, und man wird ihn auf den Berg Zion hinaufführen. Mein Messias wird ihn aller seiner Frevel überführen und ihm alle bösen Taten seiner Heerscharen vor Augen stellen.
  rationale: Die Revision beschränkt sich auf zwei sprachlich sichere Verbesserungen. Sie erhält die passive Verschonung des letzten Herrschers, die zeitliche Abfolge, den Namen Zion, die personale Bezeichnung „mein Messias“ sowie die Unterscheidung zwischen dessen Freveln und den bösen Taten seiner Heerscharen.
