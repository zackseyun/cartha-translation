translation:
  language: de
  text: Dies ist deine Vision[a], und dies ist ihre Deutung.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Gesicht«.'
    reason: »Gesicht« ist eine traditionelle deutsche Wiedergabe für eine prophetische Schau, klingt heute jedoch weniger unmittelbar als »Vision«.
lexical_decisions:
- source_word: ܚܙܘܐ
  choice: Vision
  rationale: Das syrische Wort bezeichnet eine prophetische Schau; »Vision« ist im modernen Deutschen natürlich und bewahrt den Zusammenhang mit ihrer anschließenden Deutung.
- source_word: ܦܘܫܩܐ
  choice: Deutung
  rationale: Das Wort bezeichnet hier die erklärende Auslegung der Vision; »Deutung« gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Zweitpersoniges Possessivsuffix bei »Vision«
  choice: deine Vision
  alternative: die Vision
  rationale: Das syrische Wort trägt ein Suffix der 2. Person Singular. Die persönliche Anrede darf nicht verallgemeinert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzform des Syrischen bleibt erhalten; das schließende Anführungszeichen setzt die vorausgehende direkte Rede fort.
