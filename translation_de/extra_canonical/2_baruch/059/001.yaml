base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: de
  text: '**2. Baruch 59,1**


    Höre nun, was die große Wolke bedeutet, die du aus dem Meer aufsteigen, dahinziehen und diese Erde bedecken sahst: Sie ist die Welt, die seine Macht erschuf, als er beschloss, die Schöpfung zu machen. Als das Wort von ihm ausging, trat das Gefüge der Welt hervor, noch ganz klein, und wurde so eingerichtet, wie es werden sollte.


    Die ersten schwarzen Wasser aber, die du aus der Wolke auf sie herabströmen sahst, sind die erste Sünde, die Übertretung, die der erste Adam beging. Denn als er sündigte, wurde der Tod in Bewegung gesetzt, obwohl seine Zeit noch nicht gekommen war. Trauer wurde bekannt, Schmerzen wurden bereitet, Leid wurde geschaffen, Mühsal wurde vollendet, und Größe begann, erniedrigt zu werden.


    Was aber den letzten Tag betrifft, der in einer Gestalt sichtbar wurde und ein Abbild annahm, so wisse: Die Zeit wird geprüft werden, das Gesetz der Menschheit[a] wird bemessen und seine Kraft erprobt werden. Denn Adam hörte von Gott etwas von dem, was kommen sollte; er begriff die gewährte Freilassung der Toten[b] und das, was ihm von Gott geboten worden war. Er dachte weiter darüber nach und fasste fünf Gedanken. Denn er machte sich selbst haftbar; auch die Engel machte er haftbar. Schon zu der Zeit, als er erschaffen wurde, wurde ihm eine Vision gezeigt: die grimmigen Tiere[c] und die Elemente zusammen mit dem Feuer. So sammelte Gott in Eden, nach dem Abbild derer, die erschaffen worden waren.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Norm der Menschheit“; dem Zusammenhang nach möglicherweise auch: „das Maß der Menschheit“.'
    reason: Der griechisch-syrische Ausdruck bezeichnet primär Gesetz oder Norm, steht hier aber parallel zu Prüfen, Bemessen und Erproben.
  - marker: b
    text: Der Ausdruck kann auch „Loslassung“ oder „Befreiung der Toten“ bedeuten; ob damit ihre Auferstehung gemeint ist, bleibt offen.
    reason: Die theologische Bedeutung der syrischen Wendung ist nicht eindeutig genug für eine spezifischere Übersetzung.
  - marker: c
    text: 'Wörtlicher: „die grimmigen“ oder „bitteren Tiere“; möglicherweise sind gefährliche oder giftige Tiere gemeint.'
    reason: Das Adjektiv kann Bitterkeit, Grimmigkeit oder Gefährlichkeit bezeichnen.
  - marker: d
    text: 'Der syrische Schlusssatz ist elliptisch: Das Objekt von „sammelte“ und der genaue Bezug von „nach dem Abbild“ bleiben unklar.'
    reason: Eine eindeutige Ergänzung würde die überlieferte syntaktische und inhaltliche Unsicherheit verdecken.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: das Gefüge der Welt
  rationale: Die Wendung bezeichnet das hervortretende beziehungsweise fest gegründete Gebilde der Welt. „Gefüge“ bewahrt den konkreten Schöpfungssinn und passt zum anschließenden Einrichten.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: der Tod wurde in Bewegung gesetzt
  rationale: Das Verb bezeichnet ein Aufgerüttelt- oder Inganggesetztwerden. Die Übersetzung wahrt den kausalen Zusammenhang mit Adams Sünde, ohne mehr als den syrischen Wortlaut auszusagen.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: das Gesetz der Menschheit
  rationale: ܢܘܡܫܐ ist eine Bildung zu griechisch νόμος und bezeichnet Gesetz, Ordnung oder Norm. „Gesetz“ ist die formal nächstliegende Wiedergabe; die kontextuell mögliche Deutung als Maß beziehungsweise Norm wird in einer Fußnote offengehalten.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: die Freilassung der Toten
  rationale: „Freilassung“ bildet die Grundbedeutung des schwierigen Ausdrucks ab, ohne ihn vorschnell als Auferstehung oder Vergebung dogmatisch festzulegen.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: machte … haftbar
  rationale: Die Form hat forensische Kraft und bezeichnet das Versetzen in Schuld oder Haftbarkeit. „Haftbar machen“ erhält auch die befremdliche Aussage über die Engel.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: die wilden Tiere
  rationale: ܚܝܘܬܐ bezeichnet hier Tiere oder Bestien, und ܡܪܝܪܬܐ charakterisiert sie als bitter, grimmig oder gefährlich. „Wilde Tiere“ ist im Deutschen verständlich; eine schärfere Alternative steht in der Fußnote.
- source_word: ܒܥܕܢ
  choice: in Eden
  rationale: Die Konsonantenfolge ist im Adam-Kontext als b-ʿEden, „in Eden“, zu verstehen, nicht als zeitliches „zuvor“.
theological_decisions:
- issue: Adams Sünde und das Wirksamwerden des Todes
  choice: Adams Übertretung setzt den Tod vor dessen Zeit in Bewegung.
  alternative: Die Aussage könnte abgeschwächt werden, sodass der Tod lediglich bekannt geworden wäre.
  rationale: Der syrische Text stellt einen ausdrücklichen Ursache-Wirkungs-Zusammenhang zwischen Adams Sünde und Tod, Trauer, Schmerz und Mühsal her. Diese Spannung wird ohne spätere dogmatische Ausgestaltung bewahrt.
- issue: Die Freilassung der Toten
  choice: Der Ausdruck bleibt als „Freilassung der Toten“ bewusst offen.
  alternative: Auferstehung der Toten; Erlass in Bezug auf die Toten
  rationale: Der Wortlaut erlaubt keine sichere dogmatische Präzisierung. Die formalere Wiedergabe hält mehrere mögliche Vorstellungen offen.
- issue: Die Haftbarkeit der Engel
  choice: Die schwierige Behauptung, Adam habe auch die Engel haftbar gemacht, bleibt im Haupttext stehen.
  alternative: Man könnte den Text als gestört ansehen oder die Engel nur als himmlische Zeugen verstehen.
  rationale: Der überlieferte syrische Wortlaut nennt ausdrücklich die Engel. Die Übersetzung glättet diese theologisch schwierige Aussage nicht weg.
- issue: Gottes Sammeln in Eden
  choice: Der elliptische Schlusssatz wird eng am Wortlaut wiedergegeben und seine Unsicherheit in einer Fußnote kenntlich gemacht.
  alternative: Ein nicht ausdrücklich genanntes Objekt könnte ergänzt oder der Satz als Aussage über ein vorheriges Sammeln verstanden werden.
  rationale: Der Text nennt Eden klar, lässt aber offen, was Gott sammelte und worauf die abschließende Ähnlichkeitsangabe genau zielt.
translation_notes:
  register: Moderne, würdige Standardsprache mit moderater Satzgliederung. Apokalyptische Bildsprache und forensische Begriffe bleiben deutlich. Schwierige oder elliptische Aussagen werden nicht konfessionell harmonisiert; unvermeidliche Verständnishilfen und Alternativen stehen in Fußnoten.
