    rationale: Das syrische ܢܣܒܬ ܕܡܘܬܐ bezeichnet das Annehmen einer Ähnlichkeit bzw. eines Abbilds. „bestimmte“ ist im Ausgangstext nicht verankert; „Erscheinungsform“ verwischt zudem die Beziehung zur vorangehenden Gestalt.
  - severity: low
    issue: „Mühsal erreichte ihr volles Maß“
    rationale: ܥܡܠܐ ܐܬܓܡܪܘ sagt wörtlich, dass Mühsal vollendet wurde. Die deutsche Wendung vom Erreichen des vollen Maßes ist eine nicht erforderliche Auslegung.
