  terminology: 'Die Terminologie ist im Wesentlichen konsistent und angemessen: „Gefüge der Welt“, „Übertretung“, „Gesetz der Menschheit“, „Freilassung der Toten“, „haftbar machen“, „Elemente“ und „Eden“ sind tragfähig. Bei ܚܝܘܬܐ ܡܪܝܪܬܐ ist „wilde Tiere“ möglich, doch „grimmige Tiere“ wahrt die qualifizierende Schärfe des Adjektivs besser; die Fußnote erläutert die verbleibende Bedeutungsbreite.'
