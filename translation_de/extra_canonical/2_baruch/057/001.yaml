base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/057/001.yaml
  text: 'For you saw a great cloud that ascended from the sea and went and covered this earth, hear this: that it is the world that the Mighty One made when he planned to make creation. And it happened that, when the word went out from before him, the beginning of the world stood, small and beautiful, and was established as it was destined to be.


    And the black waters that you saw first, which descended upon it from the cloud—this is the transgression that the first Adam committed at first. For when he sinned, death was stirred up, though it was not its time, and grief was made known, and pains were prepared, and suffering was created, and toil was accomplished, and greatness began to be brought low.


    And the last day, which was shown in the form and took the likeness, know that the time will be inquired into, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, while he was, heard from God something of what was to be, and understood the release of the dead that was to be given, and what had been commanded him by God, he considered it, and he devised five thoughts. For he made himself liable, and he also made the angels liable. And also at that time when he was created, there was shown to him a vision of the bitter life and of the elements with fire. Thus God gathered in Eden, in the likeness of those that were created.'
translation:
  language: de
  text: 'Denn du sahst eine große Wolke, die aus dem Meer aufstieg, weiterzog und diese Erde bedeckte. Höre nun: Sie ist die Welt, die der Mächtige schuf, als er beschloss, die Schöpfung hervorzubringen.[a] Und als das Wort von ihm ausging, trat der Anfang der Welt hervor, klein und schön, und wurde so geordnet, wie er sein sollte.


    Die schwarzen Wasser aber, die du zuerst sahst und die aus der Wolke auf sie herabströmten, sind die Übertretung, die der erste Adam am Anfang beging. Denn als er sündigte, wurde der Tod aufgerüttelt, obwohl seine Zeit noch nicht gekommen war; Trauer wurde bekannt, Qualen wurden bereitet, Leid wurde geschaffen, Mühsal kam zur Vollendung, und Größe begann, erniedrigt zu werden.


    Und was den letzten Tag betrifft, der in der Gestalt gezeigt wurde und die Ähnlichkeit annahm, so erkenne: Die Zeit wird untersucht, das Maß der Menschheit wird gemessen,[b] und ihre Kraft wird geprüft werden.[c] Als Adam von Gott etwas von dem hörte, was geschehen sollte, und sowohl die den Toten zu gewährende Befreiung als auch das verstand, was ihm von Gott geboten worden war, dachte er darüber nach und fasste fünf Gedanken. Denn er machte sich selbst haftbar, und auch die Engel machte er haftbar. Auch wurde ihm zu der Zeit, als er geschaffen wurde, eine Vision vom bitteren Leben und von den Elementen samt dem Feuer gezeigt. So sammelte Gott in Eden, nach dem Abbild derer, die geschaffen worden waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… bedeckte. Diese Erde ist die Welt, die der Mächtige schuf …“'
    reason: Die Satzgrenze und der Bezug von „sie/diese“ lassen sich im Syrischen unterschiedlich setzen.
  - marker: b
    text: Das syrische Verb kann seiner Form nach auch „gesalbt“ bedeuten; im Zusammenhang mit „Maß“ sowie mit Untersuchen und Prüfen ist hier jedoch „gemessen“ gemeint.
    reason: Lexikalische Homonymie bei ܬܬܡܫܚ.
  - marker: c
    text: 'Der Satzanfang ist schwierig. Weniger wahrscheinlich: „Und die letzte Zeit, die in Gestalt und Ähnlichkeit gezeigt wurde …“'
    reason: Der Text liest wörtlich „der letzte Tag“ und enthält vor „Ähnlichkeit“ ein Verb mit der Bedeutung „nahm/empfing“.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: der Anfang der Welt
  rationale: Die Kontrollüberlieferung stützt einen Bezug auf den ursprünglichen Beginn der Welt; „Anfang“ bewahrt diesen Sinn, ohne die schwierige Formulierung unnötig auf „Grundlegung“ oder „Ordnung“ festzulegen.
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: Übertretung
  rationale: Die Wendung bezeichnet Adams ursprüngliches Vergehen als Grenzüberschreitung und nicht nur allgemein als Sünde.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: der Tod wurde aufgerüttelt
  rationale: Die Wiedergabe erhält das Bild, dass der Tod vor seiner eigentlichen Zeit aktiviert oder in Bewegung gesetzt wurde.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: Größe begann, erniedrigt zu werden
  rationale: Dies bewahrt die Abwärtsbewegung und lässt offen, ob menschliche Größe, Hoheit oder Größe allgemein gemeint ist.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: das Maß der Menschheit
  rationale: Im parallelen Zusammenhang von Untersuchung, Messung und Prüfung ist „Maß“ die naheliegende gerichtliche und bewertende Bedeutung.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: machte ... haftbar
  rationale: „Haftbar“ drückt zugerechnete oder eingegangene Verantwortlichkeit aus, ohne den schwierigen Satz auf bloßes Schuldgefühl oder eindeutig moralische Schuld zu verengen.
- source_word: ܐܣܛܘܟܣܐ
  choice: die Elemente
  rationale: Das griechische Lehnwort stoicheia wird transparent wiedergegeben; mögliche kosmologische Resonanzen bleiben erhalten.
theological_decisions:
- issue: Adams Rolle bei den ersten schwarzen Wassern
  choice: Adams Übertretung setzt den Tod vor seiner Zeit in Bewegung und leitet umfassende Folgen für die menschliche Existenz ein.
  alternative: Adams Tat lediglich als Beispiel allgemeiner menschlicher Sünde oder ausschließlich als juristischen Einzelverstoß zu verstehen.
  rationale: Der Text führt Tod, Trauer, Qual, Leid, Mühsal und Erniedrigung unmittelbar auf Adams Tat zurück und beschreibt damit sowohl kosmische als auch menschliche Folgen.
- issue: Umfang von Adams Haftung
  choice: Die starke und schwierige Aussage, Adam habe sich selbst und auch die Engel haftbar gemacht, bleibt ausdrücklich stehen.
  alternative: Die Engel aus dem Satz zu entfernen oder die Aussage zu einer bloßen Schädigung Adams abzuschwächen.
  rationale: Die syrische Formulierung ist theologisch spannungsvoll, aber textlich deutlich genug, dass ihre Schwierigkeit nicht durch Paraphrase beseitigt werden sollte.
- issue: Die Befreiung der Toten
  choice: Die Aussage wird als Adam bekannt gewordene, künftig zu gewährende Befreiung wiedergegeben.
  alternative: Sie ausdrücklich als Auferstehung, Vergebung oder Erlösung zu bestimmen.
  rationale: Der Quelltext nennt eine „Befreiung“ oder „Loslassung“ der Toten, legt ihre genaue Art hier jedoch nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzgliedern. Apokalyptische Bilder und schwierige theologische Aussagen werden nicht geglättet. Archaismen wurden vermieden; „der Mächtige“ bleibt als Gottesbezeichnung erhalten.
