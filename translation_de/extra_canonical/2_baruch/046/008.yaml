translation:
  language: de
  text: Doch die Botschaft, dass ich hinweggenommen werde, machte ich ihnen nicht bekannt, auch ihren Söhnen nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende syrische Text lautet „ihren Söhnen“. Die englische POB-Konsultationsfassung liest dagegen „meinem Sohn“.
    reason: Die Fußnote dokumentiert die im bereitgestellten Material belegte Abweichung bei Person und Zahl, ohne weitere, hier nicht nachgewiesene Textzeugen zu behaupten.
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: Botschaft
  rationale: Hier bezeichnet das Wort eine mitzuteilende Nachricht über Baruchs bevorstehendes Geschick; „Botschaft“ ist im Deutschen natürlicher als eine wörtliche Wiederholung von „Wort“.
- source_word: ܕܡܬܬܣܝܡ ܐܢܐ
  choice: dass ich hinweggenommen werde
  rationale: Die passive syrische Wendung wird als bevorstehende Wegnahme Baruchs wiedergegeben. Sie lässt offen, auf welche Weise dies geschieht, und vermeidet die stärkere Festlegung von „in den Himmel aufgenommen“.
- source_word: ܠܒܢܝ̈ܗܘܢ
  choice: ihren Söhnen
  rationale: Der übermittelte syrische Text hat eine maskuline Pluralform mit dem Suffix „ihr“ und bedeutet daher nach dem vorliegenden Wortlaut „ihren Söhnen“.
theological_decisions:
- issue: Art von Baruchs bevorstehendem Fortgang
  choice: hinweggenommen werde
  alternative: sterben werde / in den Himmel aufgenommen werde
  rationale: Der syrische Ausdruck bezeichnet eine Wegnahme, ohne hier ausdrücklich Tod oder Himmelfahrt festzulegen. Die Übersetzung bewahrt diese eschatologische Offenheit.
- issue: Empfänger, denen Baruch die Botschaft verschwieg
  choice: ihren Söhnen
  alternative: meinem Sohn
  rationale: Der bereitgestellte syrische Wortlaut stützt den Plural „ihren Söhnen“, während die englische Konsultationsfassung und verbreitete Übersetzungen „meinem Sohn“ bieten. Die Hauptübersetzung folgt der vorgelegten Primärquelle; die Abweichung wird offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am syrischen Kontrast, während „Botschaft“ die idiomatische Bedeutung von ܡܠܬܐ wiedergibt. Die Fußnote dokumentiert die relevante Textabweichung, ohne sie stillschweigend zu harmonisieren.
