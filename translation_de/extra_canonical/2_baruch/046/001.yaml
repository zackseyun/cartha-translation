  yaml_path: translation/extra_canonical/2_baruch/046/001.yaml
  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: de
  text: '1 Da antworteten mein Sohn und die Ältesten des Volkes und sagten zu mir:


    »Hat der Mächtige uns so sehr gedemütigt, dass er dich so plötzlich von uns nimmt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Der bestimmte syrische Gottesbeiname wird substantivisch und würdevoll wiedergegeben, ohne ihn durch eine konfessionell stärker geprägte Benennung zu ersetzen.
- source_word: ܡܟܟܢ
  choice: uns … gedemütigt
  rationale: Die Form bezeichnet ein Erniedrigen oder Demütigen; die deutsche Wiedergabe bewahrt die Klage und ihre theologische Spannung.
- source_word: ܕܢܣܒܟ
  choice: dass er dich … von uns nimmt
  rationale: ܢܣܒ bedeutet hier im Zusammenhang des bevorstehenden Weggangs Baruchs »nehmen/wegnehmen«; das Präsens entspricht der unmittelbar bevorstehenden Handlung.
- source_word: ܫܠܝ …
  choice: so plötzlich
  rationale: Der beschädigt beziehungsweise unsicher überlieferte Ausdruck wird im Einklang mit dem Satzkontext als Hinweis auf die unvermittelte Wegnahme verstanden; »plötzlich« wahrt den klagenden Ton.
theological_decisions:
- issue: Deutung der Erniedrigung durch den Mächtigen
  choice: Die Frage bleibt als Klage formuliert und schreibt die Erniedrigung unmittelbar dem Mächtigen zu.
  alternative: 'Abschwächend: »Hat der Mächtige zugelassen, dass wir so erniedrigt werden …?«'
  rationale: Der syrische Wortlaut bietet keinen ausdrücklichen Zulassungsbegriff; eine solche Ergänzung würde die theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede und die rhetorische Frage bleiben erhalten; »der Mächtige« wird als Gottesbeiname großgeschrieben.
