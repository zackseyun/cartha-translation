lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: Wahrlich
  rationale: Das Adverb bekräftigt die Aussage; „Wahrlich“ bewahrt den würdevollen, eindringlichen Ton.
- source_word: ܒܚܫܘܟܐ
  choice: in Finsternis
  rationale: Gibt die bildhafte Aussage direkt wieder und wahrt ihren ernsten Ton.
- source_word: ܢܘܗܪܐ
  choice: Licht
  rationale: Die gewöhnliche und kontextuell passende Entsprechung; die Gegenüberstellung von Finsternis und Licht bleibt erhalten.
- source_word: ܠܥܡܐ ܕܐܫܬܚܪܘ
  choice: für das Volk, das übrig bleibt
  rationale: Gibt den Gedanken des zurückbleibenden beziehungsweise verbliebenen Volkes natürlich auf Deutsch wieder, ohne näher festzulegen, wodurch es übrig bleibt.
theological_decisions:
- issue: Bildsprache von Finsternis und Licht
  choice: Die Metaphern werden wörtlich beibehalten.
  alternative: Deutende Wiedergabe als Verzweiflung und fehlende Führung
  rationale: Der syrische Text lässt die Bilder theologisch und existenziell offen; eine Ausdeutung würde die mögliche Mehrdeutigkeit unnötig einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die feierliche Klage des syrischen Textes bleiben erhalten.
