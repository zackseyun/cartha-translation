translation:
  language: de
  text: Doch bereitet eure Herzen darauf vor, auf das Gesetz zu hören[a] und an der Einsicht festzuhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Gesetz zu gehorchen“. Das syrische Verb kann sowohl „hören“ als auch „gehorchen“ bedeuten.'
    reason: Die Bedeutungsbreite des syrischen ܫܡܥ ist für das Verständnis der Aufforderung relevant und soll erhalten bleiben.
lexical_decisions:
- source_word: ܨܒܘ ܠܒܩ̈ܝܟܘܢ
  choice: bereitet eure Herzen darauf vor
  rationale: Die syrische Wendung richtet den Willen bzw. die innere Bereitschaft des Herzens auf das folgende Hören; die deutsche Formulierung gibt dies natürlich und verständlich wieder.
- source_word: ܕܬܫܡܥܘܢ ܠܢܡܘܣܐ
  choice: auf das Gesetz zu hören
  rationale: ܫܡܥ kann sowohl „hören“ als auch „gehorchen“ bedeuten. „Auf … hören“ bewahrt im Deutschen beide Bedeutungsanteile.
- source_word: '[im Zeilenübergang der Vorlage beschädigte bzw. schwer lesbare Wendung zur Einsicht]'
  choice: an der Einsicht festzuhalten
  rationale: Die konsultierte englische Fassung stützt diese Wiedergabe; zugleich passt sie zum erkennbaren Zusammenhang, in dem Gesetz, Weisheit und Einsicht verbunden werden.
theological_decisions:
- issue: Verhältnis von Hören und Gehorsam gegenüber dem Gesetz
  choice: auf das Gesetz zu hören
  alternative: dem Gesetz zu gehorchen
  rationale: Die gewählte Formulierung lässt die semantische Spannung des syrischen Verbs zwischen aufmerksamem Hören und praktischem Gehorsam bestehen, ohne sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist direkt und allgemein verständlich; „Herzen“ bleibt als biblisch-anthropologische Bezeichnung des inneren Wollens und Denkens erhalten.
