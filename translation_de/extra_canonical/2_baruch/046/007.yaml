translation:
  language: de
  text: Und ihr werdet nicht in die Qual geraten, die euch im Voraus angekündigt wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦܠ… ܒـ
  choice: in … geraten
  rationale: Die syrische Wendung mit dem Verb »fallen« und der Präposition wird im Deutschen idiomatisch als »in … geraten« wiedergegeben, ohne die Warnung abzuschwächen.
- source_word: ܒܬܘܝܒܘܬܐ
  choice: in die Qual
  rationale: Der im überlieferten Text schwer lesbare Ausdruck bezeichnet im Kontext die zuvor angekündigte Bedrängnis beziehungsweise Strafe; »Qual« bewahrt die Härte und entspricht der kontrollierten englischen Lesart.
- source_word: ܕܩܕܡܘ ܐܡܪܘܗ ܠܟܘܢ
  choice: die euch im Voraus angekündigt wurde
  rationale: Die Vorzeitigkeit von ܩܕܡܘ und der Mitteilungscharakter von ܐܡܪ werden knapp und natürlich wiedergegeben; das Passiv lässt den nicht ausdrücklich genannten Ankündigenden offen.
theological_decisions:
- issue: Charakter der angekündigten Not
  choice: Qual
  alternative: Strafe
  rationale: »Strafe« würde die Ursache der Not ausdrücklich als vergeltendes Gericht bestimmen. »Qual« wahrt die Aussage des Verses, ohne diese Deutung stärker festzulegen als der Text.
translation_notes:
  register: Moderne, klare und würdige Standardsprache; direkte Anrede im Plural. Die Formulierung bleibt eng am syrischen Satz und vermeidet unnötig altertümliche Wendungen.
