translation:
  language: de
  text: Denn wo sollen wir das Gesetz wieder suchen, oder wer wird uns aus dem Haus des Todes ins Leben führen?«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Das syrische Lehnwort bezeichnet hier das göttliche Gesetz; der bestimmte Artikel entspricht dem kontextuell bestimmten Bezug.
- source_word: ܡܕܪܟܢ
  choice: wird uns … führen
  rationale: Die Form bezeichnet jemanden, der den Weg weist beziehungsweise führt; die deutsche Futurform entspricht dem erwartenden Fragesinn.
- source_word: ܒܝܬ ܡܘܬܐ
  choice: aus dem Haus des Todes
  rationale: Die bildhafte syrische Wendung wird formal bewahrt und nicht zu »Totenreich« oder einer konfessionell geprägten Deutung vereindeutigt.
- source_word: ܠܚܝ̈ܐ
  choice: ins Leben
  rationale: Der Gegensatz zu »Tod« wird im Deutschen idiomatisch als Bewegung »ins Leben« wiedergegeben; die syrische Pluralform kann abstrakt-kollektiv Leben bezeichnen.
theological_decisions:
- issue: Bedeutung von »Haus des Todes«
  choice: Metapher unverändert beibehalten
  alternative: Totenreich
  rationale: Der Ausdruck kann einen Zustand oder Bereich des Todes meinen. »Haus des Todes« bewahrt die genuine Bildsprache und legt keine bestimmte Jenseitstopografie fest.
- issue: Bezug des Gesetzes
  choice: »das Gesetz« ohne erläuternden Zusatz
  alternative: das Gesetz Gottes / die Tora
  rationale: Der Kontext legt das göttliche Gesetz nahe, doch der syrische Text enthält weder »Gottes« noch ausdrücklich die Bezeichnung »Tora«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur der beiden Fragen und die eindringliche Bewegung vom Tod zum Leben bleiben erhalten.
