translation:
  language: de
  text: Denn wenn ihr diese Dinge tut, wird Hoffnung auf euch ruhen – jene Dinge, die euch zuvor gesagt wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢ ܓܝܪ ܬܥܒܕܘܢ ܗܠܝܢ
  choice: Denn wenn ihr dies tut
  rationale: Gibt die konditionale Wendung und den rückverweisenden Plural natürlich und eng am Syrischen wieder.
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ ܣܒܪܐ
  choice: wird die Hoffnung bei euch Ruhe finden
  rationale: Bewahrt das Bild des Ruhens im Ethpaal/Passivstamm und gibt ܣܒܪܐ als „Hoffnung“ wieder; „bei euch“ bildet den Dativ ܠܟܘܢ ab.
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: jene Hoffnung, von der euch schon früher gesagt wurde
  rationale: Der überlieferte Wortlaut ist syntaktisch rau; die Formulierung versteht den Nachsatz als nähere Bestimmung der Hoffnung und wahrt den passivisch-unbestimmten Sprecherbezug.
theological_decisions:
- issue: Bezug des abschließenden Relativsatzes
  choice: Bezug auf „Hoffnung“
  alternative: „jene Dinge, die euch schon früher gesagt wurden“ als eigenständige Apposition
  rationale: Der unmittelbare Kontext und die englische Konsultationsschicht stützen einen Bezug auf die zuvor verkündete Hoffnung; die syrische Form ist jedoch grammatisch uneben. Die Übersetzung glättet nur so weit, wie es für verständliches Deutsch nötig ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Ruhebild bleibt erhalten; keine konfessionelle Ausdeutung wird ergänzt.
