translation:
  language: de
  text: 'Und ich sagte zu ihnen: „Gegen den Mächtigen kann ich nicht bestehen. Doch Israel wird es nicht an einem Weisen fehlen und die Nachkommenschaft Jakobs nicht an einem Sohn des Gesetzes[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn des Gesetzes“; gemeint sein kann jemand, der vom Gesetz geprägt, darin unterwiesen oder ihm treu ist.'
    reason: Die wörtliche semitische Wendung ist im Deutschen ungewöhnlich und lässt mehrere eng verwandte Deutungen zu.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Gibt den syrischen Gottesbeiname im Zusammenhang würdig und direkt wieder, ohne ihn durch eine konfessionell geprägte Benennung zu ersetzen.
- source_word: ܠܐ ܡܫܟܚ ܐܢܐ ܕܐܩܘܡ
  choice: kann ich nicht widerstehen
  rationale: Der Ausdruck bedeutet wörtlich etwa „ich kann nicht standhalten/stehen“; mit dem vorangehenden „gegenüber dem Willen“ bezeichnet er hier das Unvermögen, sich diesem Willen entgegenzustellen.
- source_word: ܚܟܝܡܐ
  choice: ein Weiser
  rationale: Bewahrt die substantivische, allgemein gehaltene Bezeichnung des syrischen Textes.
- source_word: ܒܪ ܢܡܘܣܐ
  choice: ein Sohn des Gesetzes
  rationale: Die auffällige semitische Wendung wird formal bewahrt, da sie mehr als nur einen allgemein „gesetzeskundigen“ Menschen bezeichnen kann.
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ
  choice: dem Geschlecht Jakobs
  rationale: ܓܢܣܐ bezeichnet hier Abstammung, Geschlecht oder Stamm; „Geschlecht“ wahrt den kollektiven genealogischen Sinn.
theological_decisions:
- issue: Verhältnis des Sprechers zum Willen Gottes
  choice: „Dem Willen des Mächtigen kann ich nicht widerstehen“
  alternative: „Gegen den Willen des Mächtigen kann ich nicht bestehen“
  rationale: Die gewählte Fassung macht die Aussage im Deutschen verständlich, ohne zu entscheiden, ob vor allem Widerstand, Standhalten oder das Sich-Erheben gegen Gottes Willen gemeint ist.
- issue: Bedeutung von „Sohn des Gesetzes“
  choice: Die wörtliche Wendung im Haupttext beibehalten
  alternative: „ein Gesetzeskundiger“ oder „einer, der nach dem Gesetz lebt“
  rationale: Der syrische Ausdruck kann Zugehörigkeit, Prägung oder besondere Gesetzestreue andeuten. Eine auslegende Paraphrase würde diese Offenheit unnötig verengen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Der parallele Satzbau des Syrischen wird bewahrt; die markante Bezeichnung „Sohn des Gesetzes“ bleibt stehen und wird knapp erläutert.
