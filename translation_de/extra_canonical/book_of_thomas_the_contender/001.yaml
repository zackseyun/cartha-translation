  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: de
  text: '[] Die geheimen Worte, die der Retter zu Judas Thomas sprach und die ich – ja, ich, Mathaias – niederschrieb, während ich mitging und ihrem Gespräch zuhörte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen gemeinfreien englischen Textzeugen; eine direkte Prüfung des koptischen Ausgangstextes steht noch aus.
