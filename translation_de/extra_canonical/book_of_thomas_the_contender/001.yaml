lexical_decisions:
- source_word: secret sayings
  choice: die geheimen Worte
  rationale: „Worte“ ist im Deutschen natürlich und bewahrt die mögliche Bedeutung von Aussprüchen oder Lehren, ohne sie näher festzulegen.
- source_word: Savior
  choice: der Retter
  rationale: Die geläufige und würdige deutsche Entsprechung; sie vermeidet eine unnötig konfessionelle Ausgestaltung.
- source_word: Judas Thomas
  choice: Judas Thomas
  rationale: Die im Zeugnis überlieferte Doppelnennung wird unverändert beibehalten.
- source_word: Mathaias
  choice: Mathaias
  rationale: Die Namensform des vorgelegten englischen Textzeugen wird bewahrt, da die direkte Prüfung des koptischen Textes noch aussteht.
- source_word: while I was walking
  choice: während ich mitging
  rationale: „Mitging“ gibt den begleitenden Zusammenhang natürlich wieder, ohne das Gehen als bloß gleichzeitige, unabhängige Handlung erscheinen zu lassen.
- source_word: listening to them speak with one another
  choice: ihrem Gespräch zuhörte
  rationale: Natürliche deutsche Wiedergabe, die sowohl das Zuhören als auch das wechselseitige Sprechen erhält.
theological_decisions:
- issue: Bezeichnung Jesu als „Savior“
  choice: Retter
  alternative: Heiland
  rationale: „Retter“ ist gegenwärtiges Standarddeutsch und gibt den Titel unmittelbar wieder, ohne zusätzliche traditionelle oder konfessionelle Färbung.
- issue: Verhältnis des Schreibers zu den Gesprächspartnern
  choice: während ich mitging und ihrem Gespräch zuhörte
  alternative: während ich ging und hörte, wie sie miteinander sprachen
  rationale: Die Übersetzung lässt offen, in welcher genauen Beziehung Mathaias zu den beiden steht, macht aber den im englischen Zeugnis naheliegenden Begleitzusammenhang verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Selbsthervorhebung „ja, ich, Mathaias“ und der einleitende fragmentarische Marker „[]“ bleiben erhalten. Der Satzbau wurde für flüssiges Deutsch leicht gestrafft, ohne die überlieferte Sprecherkonstellation aufzulösen.
