review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe folgt dem vorliegenden englischen Textzeugen grundsätzlich. „Mitging“ legt jedoch einen Begleitzusammenhang nahe, den „while I was walking“ nicht ausdrücklich besagt. Die korrigierte Fassung gibt das Gehen ohne diesen Zusatz wieder. Da die koptische Direktprüfung noch aussteht, bleibt die Beurteilung vorläufig.
  naturalness: Der Satz ist in modernem Standarddeutsch gut lesbar. „Aussprüche“ ist für „sayings“ in diesem einleitenden Überlieferungskontext idiomatischer als das allgemeinere „Worte“. Die Konstruktion „ihnen zuhörte, wie sie miteinander sprachen“ bewahrt beide Aspekte des englischen Textes ausdrücklich.
  terminology: „Retter“, „Judas Thomas“ und „Mathaias“ sind angemessen und werden beibehalten. „Geheime Aussprüche“ wahrt die offene Bedeutung von „secret sayings“, ohne daraus bestimmte Lehren oder eine technische Gattung abzuleiten.
  issues:
  - severity: medium
    issue: „während ich mitging“ ergänzt einen nicht ausdrücklich bezeugten Begleitzusammenhang.
    rationale: Der englische Zeuge sagt lediglich „while I was walking“. „Mitging“ kann nahelegen, Mathaias sei mit den beiden Gesprächspartnern gegangen; diese Präzisierung sollte ohne koptische Prüfung nicht vorgenommen werden.
  - severity: low
    issue: „Worte“ ist für „sayings“ weniger präzise als „Aussprüche“.
    rationale: „Aussprüche“ bezeichnet hier natürlicher die überlieferten gesprochenen Äußerungen und erhält den Charakter der Textüberschrift.
  revised_text: '[] Die geheimen Aussprüche, die der Retter zu Judas Thomas sprach und die ich – ja, ich, Mathaias – niederschrieb, während ich ging und ihnen zuhörte, wie sie miteinander sprachen.[a]'
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen gemeinfreien englischen Textzeugen; eine direkte Prüfung des koptischen Ausgangstextes steht noch aus.
    reason: Die Quellenangabe kennzeichnet ausdrücklich, dass der Entwurf mangels abgeschlossener Prüfung der alten Sprache nicht als unmittelbar aus dem Koptischen verifiziert gelten kann.
  revision_rationale: Die Revision entfernt die unbelegte Nuance eines gemeinsamen Gehens, fasst „sayings“ idiomatisch als „Aussprüche“ und erhält zugleich die Selbsthervorhebung, die Namen, den fragmentarischen Marker sowie die Aussage, dass Mathaias beim Gehen dem wechselseitigen Gespräch zuhörte.
