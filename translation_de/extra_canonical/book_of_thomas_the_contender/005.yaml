source:
  text: 'Thomas responded: “What can we say after these things? What can we say to the blind? What teaching should we communicate to these pitiable mortals who say: ‘We came here to [do] good and not to curse,’ and yet [say], ‘If we had not been begotten in the flesh, we would never have known [sin]’?”


    The Savior said: “Truly, regarding [those], do not consider them as human, but consider them [as] animals, because just like animals eat each other, so this kind of people also eat each other. It is exactly the opposite; they have forfeited [the kingdom] with their love, the sweet fire, being slaves of death and running to (do) deeds of decay. They practice the lust of their ancestors. They will be cast down into the abyss to suffer the torment of the bitter evil of their nature, because they will be whipped, causing them to run backwards to where they cannot see, and they [will be separated] from their limbs, not (bearing it) bravely, but [in] despair. And they are glad because [. . .] insanity and irrationality [. . .] [They] chase after this irrationality without recognizing [their insanity, believing] that they [are] wise. [They . . .] their body [. . .] [] Their mind is selfishly oriented, because their thinking is preoccupied with their actions, but the fire will scorch them.”


    And Thomas responded: “Lord, what will the person cast down to them do? Because I am very concerned for them, there being many who attack them.”


    The Savior answered: “What do you yourself think?”


    Judas, called Thomas, said: “Lord, it is right that you speak, and that I listen.”


    The Savior responded: “Heed what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. And after a lot of time passes, they will manifest the fruit of evil trees, being reproved and killed in the mouths of animals and humans, urged on by the rains and winds and air and the light shining from above.”


    Thomas responded: “Without a doubt you have convinced us, Lord. We know in our heart, and it is clear that it [is the case], and that your word suffices. These words you speak to us, however, are laughable and detestable to the world, because they are misinterpreted. So how can we go to preach them, because we are [not] respected [in] the world?”


    The Savior responded: “I tell you truly that whoever hears [your] word and rejects it or mocks it or laughs at these matters, I tell you truly that he will be delivered to the ruler on high who as their king rules over every power, and he will twirl that one in circles and cast him out from heaven down into the abyss, and he will be confined in a constricted gloomy place. Furthermore, he will be unable to turn or move because of the tremendous depth of Tartaros, and the [ponderous bitterness] of Hades that is unwavering. [. . .] them to it [. . .] they will not forgive [. . .] chase you. They will deliver [. . .] over to [. . .] angel Tartarouchos [. . .] fire chasing them. [] [. . .] fiery lashes that spew a shower of sparks into the face of the one being chased.


    If he runs to the west, he will encounter the fire.

    If he runs to the south, he will encounter it there, too.

    If he turns to the north, the danger of boiling fire will meet him again.

    Nor can he find a way to the east to run away there and be rescued.


    Because he did not find it in the day when he dwelt in the body, he will not find it in the day of judgment.”'
