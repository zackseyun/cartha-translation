review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen im Allgemeinen eng und bewahrt die textkritischen Signale meist zuverlässig. Korrigiert werden muss jedoch die unzulässige Ersetzung der leeren Schadensmarkierung „[]“ durch den Fußnotenanker „[a]“. Außerdem wird das Schlusspronomen auf den im vorherigen Satz genannten „Weg“ bezogen, ohne aus dem knappen Zeugen eine weitergehende Heilsdeutung abzuleiten. Die Prüfung beruht notwendigerweise auf dem englischen öffentlichen Zeugen; eine unmittelbare koptische Kontrolle steht laut Kontext noch aus.
  naturalness: Das Deutsch ist überwiegend modernes Standarddeutsch mit angemessen feierlich-apokalyptischem Register. An beschädigten oder semantisch schwierigen Stellen bleibt die Syntax absichtlich fragmentarisch, statt den Zeugen durch Glättung zu präzisieren. Kleinere Formulierungen wurden angepasst, damit die Markierungen von Ergänzung, Auslassung und Parenthese transparent bleiben.
  terminology: „Retter“, „Fleisch“, „Königreich“, „Abgrund“, „Tartaros“, „Hades“, „Tartarouchos“ und „Tag des Gerichts“ sind sachgerecht. „unwandelbaren Hades“ gibt „unwavering Hades“ zurück, ohne „Hades“ mit einer konfessionell bestimmten Höllenvorstellung gleichzusetzen.
  issues:
  - severity: high
    issue: Die Manuskriptschadensmarkierung „[]“ wurde im Fließtext durch „[a]“ ersetzt.
    rationale: Der Zeuge enthält an dieser Stelle eine leere eckige Klammer als eigenständiges Zeichen für Textverlust. Ein Fußnotenanker innerhalb eckiger Klammern verändert dieses textkritische Signal und lässt die ursprünglich vorhandene Lücke verschwinden.
  - severity: medium
    issue: „sie [werden getrennt werden] von ihren Gliedern und es nicht tapfer ertragen“ glättet und ergänzt die schwierige Struktur über den Zeugen hinaus.
    rationale: Der Zeuge markiert „[will be separated]“ als ergänzte Lesung und setzt „not (bearing it) bravely“ parenthetisch. Die Revision erhält die Unsicherheit und die parenthetische Anlage deutlicher.
  - severity: medium
    issue: Das Schlusspronomen „ihn“ ist im Deutschen ohne eindeutigen Bezug missverständlich.
    rationale: Der englische Zeuge verwendet zwar ebenfalls ein neutrales „it“, doch im Kontext ist der zuvor erwähnte Weg der nächstliegende grammatische Bezug. „den Weg“ stellt diesen Rückbezug klar, ohne ihn zum ausdrücklich benannten Heilsweg auszubauen.
