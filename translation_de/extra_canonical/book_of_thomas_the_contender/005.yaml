  footnotes:
  - marker: a
    text: Die Auslassungszeichen und eckigen Klammern kennzeichnen Lücken im überlieferten Text beziehungsweise ergänzte, unsichere Lesungen. An dieser Stelle ist der Text besonders stark beschädigt.
    reason: Kennzeichnung von Manuskriptschäden und editorischen Ergänzungen.
  - marker: b
    text: „Tartaros“ und „Hades“ sind hier unterschiedliche Bezeichnungen aus der antiken Unterweltsvorstellung. Die Namen werden beibehalten, statt beide allgemein mit „Hölle“ wiederzugeben.
    reason: Bewahrung der lexikalischen und kosmologischen Differenz.
  - marker: c
    text: „Tartarouchos“ ist die überlieferte Bezeichnung eines mit dem Tartaros verbundenen Engels oder Wächters. Der beschädigte Satz lässt seine genaue Rolle offen.
    reason: Erläuterung eines seltenen Eigennamens bei zugleich unsicherem Kontext.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Natürliches, würdiges modernes Deutsch; bewahrt die titelartige Funktion ohne zusätzliche konfessionelle Festlegung.
- source_word: flesh
  choice: Fleisch
  rationale: Erhält die körperlich-anthropologische und mögliche theologische Spannung des Ausdrucks, statt ihn auf „Körper“ zu verengen.
- source_word: kingdom
  choice: Königreich
  rationale: Die ergänzte Lesart bleibt in eckigen Klammern; „Königreich“ bewahrt den Herrschaftsbezug.
- source_word: abyss
  choice: Abgrund
  rationale: Entspricht der kosmologisch-räumlichen Bildsprache und unterscheidet sich von Hades und Tartaros.
- source_word: mind
  choice: Sinn
  rationale: Der Ausdruck kann Denken, innere Ausrichtung und Gesinnung umfassen; „Sinn“ hält diese Breite eher offen als „Verstand“.
- source_word: Tartaros / Hades / Tartarouchos
  choice: Tartaros / Hades / Tartarouchos
  rationale: Die Eigennamen und kosmologischen Bezeichnungen werden transliteriert, um ihre Unterscheidung nicht einzuebnen.
- source_word: day of judgment
  choice: Tag des Gerichts
  rationale: Idiomatiche und traditionsübergreifend verständliche Wiedergabe ohne Zusatzdeutung.
theological_decisions:
- issue: „the sweet fire“ und der Verlust des Königreichs
  choice: Die syntaktische Spannung bleibt in „[das Königreich] verwirkt, das süße Feuer“ sichtbar.
  alternative: „Sie haben wegen ihrer Liebe zum süßen Feuer das Königreich verwirkt.“
  rationale: Der englische Zeuge ist syntaktisch mehrdeutig; eine eindeutige Zuordnung des „süßen Feuers“ zur Liebe würde den beschädigten oder schwierigen Text interpretierend glätten.
- issue: Natur des „bitteren Bösen“
  choice: „das bittere Böse ihrer Natur“
  alternative: „die bittere Bosheit, die ihnen eigen ist“
  rationale: Die harte anthropologische Aussage wird bewahrt, ohne sie systematisch als Erbsünden- oder Wesenslehre auszulegen.
- issue: „what sows and what is sown“
  choice: „Was sät und was gesät wird“
  alternative: „Der Sämann und die Saat“
  rationale: Die grammatische und sachliche Fremdheit des Zeugnisses bleibt erhalten; eine Identifikation der Größen wird vermieden.
- issue: Nicht gefundener „Weg“ am Gerichtstag
  choice: Das männliche Pronomen „ihn“ bleibt auf den zuvor genannten „Weg“ bezogen.
  alternative: Explizit „den Weg der Rettung“
  rationale: Der Text nennt nicht ausdrücklich einen Heilsweg; die Übersetzung fügt diese theologische Präzisierung daher nicht hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener apokalyptischer Härte. Eckige Klammern und Auslassungszeichen folgen dem gelieferten Zeugen und markieren Ergänzungen beziehungsweise Textverlust. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung als quellennaher, vorläufiger Publikationsentwurf auf Grundlage des gemeinfreien englischen Zeugen zu verstehen.
