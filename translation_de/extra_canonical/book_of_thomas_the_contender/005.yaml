  text: 'Thomas replied, “What can we say after these things? What can we say to the blind? What teaching should we communicate to these pitiable mortals who say, ‘We came here to [do] good and not to curse,’ and yet [say], ‘If we had not been begotten in the flesh, we would never have known [sin]’?”


    The Savior said, “Truly, regarding [those], do not consider them human, but consider them [as] animals, because just as animals eat each other, so these people also eat each other. It is exactly the opposite: they have forfeited [the kingdom] through their love, the sweet fire, becoming servants of death and rushing to perform deeds of decay. They practice the lust of their ancestors. They will be cast down into the abyss to suffer the torment of the bitter evil of their nature, because they will be whipped, making them run backward to where they cannot see, and they [will be separated] from their limbs, not enduring it bravely, but [in] despair. And they are glad because [. . .] insanity and irrationality [. . .] [They] pursue this irrationality without recognizing [their insanity, believing] that they [are] wise. [They . . .] their body [. . .] [] Their mind is selfishly directed, because their thinking is preoccupied with their actions, but the fire will scorch them.”


    Thomas replied, “Lord, what will the person cast down to them do? I am deeply concerned for them, since many attack them.”


    The Savior answered, “What do you yourself think?”


    Judas, called Thomas, said, “Lord, it is right for you to speak and for me to listen.”


    The Savior replied, “Pay attention to what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. After much time has passed, they will reveal the fruit of evil trees, being reproved and killed in the mouths of animals and humans, driven on by the rains, winds, air, and the light shining from above.”


    Thomas replied, “Without a doubt, you have convinced us, Lord. We know in our hearts, and it is clear that this [is the case] and that your word is sufficient. Yet these words you speak to us are laughable and detestable to the world because they are misinterpreted. So how can we go and preach them, since we are [not] respected [in] the world?”


    The Savior replied, “Truly I tell you, whoever hears [your] word and rejects it, mocks it, or laughs at these matters—truly I tell you, he will be handed over to the ruler on high, who rules as king over every power. He will spin that person around in circles and cast him out of heaven and down into the abyss, and he will be confined in a narrow, gloomy place. Furthermore, he will be unable to turn or move because of the tremendous depth of Tartaros and the [ponderous bitterness] of unwavering Hades. [. . .] them to it [. . .] they will not forgive [. . .] chase you. They will hand [. . .] over to [. . .] angel Tartarouchos [. . .] fire chasing them. [] [. . .] fiery whips that spew a shower of sparks into the face of the one being chased.


    If he runs to the west, he will encounter the fire.


    If he runs to the south, he will encounter it there too.


    If he turns to the north, the danger of boiling fire will meet him again.


    Nor will he find a way to the east to flee there and be rescued.


    Because he did not find it in the day when he lived in the body, he will not find it on the day of judgment.”'
translation:
  language: de
  text: 'Thomas erwiderte: „Was können wir nach diesen Dingen noch sagen? Was können wir zu den Blinden sagen? Welche Lehre sollen wir diesen beklagenswerten Sterblichen vermitteln, die sagen: ‚Wir sind hierhergekommen, um Gutes zu [tun] und nicht zu verfluchen‘, und dennoch [sagen]: ‚Wären wir nicht im Fleisch gezeugt worden, hätten wir [die Sünde] niemals kennengelernt‘?“


    Der Retter sagte: „Wahrlich, betrachtet [jene] nicht als Menschen, sondern als Tiere; denn wie Tiere einander fressen, so fressen auch solche Menschen einander. Doch es verhält sich genau umgekehrt: Durch ihre Liebe haben sie [das Königreich] verwirkt, das süße Feuer; sie sind Sklaven des Todes und eilen dahin, Werke des Verfalls zu tun. Sie üben die Begierde ihrer Vorfahren aus. Man wird sie in den Abgrund hinabwerfen, damit sie die Qual des bitteren Bösen ihrer Natur erleiden. Denn sie werden ausgepeitscht werden, sodass sie rückwärts dorthin laufen, wo sie nichts sehen können; und sie [werden getrennt werden] von ihren Gliedern und es nicht tapfer ertragen, sondern [in] Verzweiflung. Und sie freuen sich, weil […] Wahnsinn und Unvernunft […] [Sie] jagen dieser Unvernunft nach, ohne [ihren Wahnsinn] zu erkennen, [und glauben], sie [seien] weise. [Sie …] ihren Leib […] [a] Ihr Sinn ist selbstsüchtig ausgerichtet, denn ihr Denken ist von ihren Taten in Anspruch genommen; doch das Feuer
    wird sie versengen.“


    Thomas erwiderte: „Herr, was wird der Mensch tun, der zu ihnen hinabgeworfen wird? Denn ich bin sehr um sie besorgt, weil viele sie angreifen.“


    Der Retter antwortete: „Was meinst du selbst?“


    Judas, der Thomas genannt wird, sagte: „Herr, es ist recht, dass du sprichst und ich zuhöre.“


    Der Retter erwiderte: „Achte auf das, was ich dir sagen werde, und glaube, was wahr ist. Was sät und was gesät wird, wird im Feuer vergehen, in Feuer und Wasser; und sie werden sich in dunklen Gräbern bedecken. Wenn viel Zeit vergangen ist, werden sie die Frucht böser Bäume hervorbringen: In den Mäulern von Tieren und Menschen werden sie zurechtgewiesen und getötet, angetrieben von Regen, Wind und Luft und von dem Licht, das von oben her scheint.“


    Thomas erwiderte: „Ohne Zweifel hast du uns überzeugt, Herr. Wir wissen es in unserem Herzen, und es ist klar, dass es [so ist] und dass dein Wort genügt. Doch diese Worte, die du zu uns sprichst, erscheinen der Welt lächerlich und abscheulich, weil sie missverstanden werden. Wie können wir also hinausgehen und sie verkünden, da wir in der Welt [nicht] geachtet werden?“


    Der Retter erwiderte: „Wahrlich, ich sage euch: Wer [euer] Wort hört und es verwirft oder verspottet oder über diese Dinge lacht – wahrlich, ich sage euch: Er wird dem Herrscher in der Höhe ausgeliefert werden, der als ihr König über jede Macht herrscht. Dieser wird ihn im Kreis herumwirbeln und ihn aus dem Himmel hinab in den Abgrund werfen; dort wird er an einem engen, finsteren Ort eingeschlossen werden. Wegen der ungeheuren Tiefe des Tartaros und der [schwer lastenden Bitterkeit] des unerbittlichen Hades wird er sich weder wenden noch bewegen können.[b] […] sie dorthin […] sie werden nicht vergeben […] euch verfolgen. Sie werden […] übergeben an […] den Engel Tartarouchos […] Feuer verfolgt sie. […] feurige Geißeln, die einen Funkenregen in das Gesicht des Verfolgten speien.[c]


    Wenn er nach Westen läuft, wird er auf das Feuer stoßen.


    Wenn er nach Süden läuft, wird er auch dort darauf stoßen.


    Wenn er sich nach Norden wendet, wird ihm erneut die Gefahr siedenden Feuers begegnen.


    Auch nach Osten wird er keinen Weg finden, um dorthin zu fliehen und gerettet zu werden.


    Denn weil er ihn an dem Tag, als er im Leib lebte, nicht gefunden hat, wird er ihn am Tag des Gerichts nicht finden.“'
