translation:
  language: de
  text: 'Dann fuhr der Retter fort: „O unergründliche Liebe des Lichts! O Bitterkeit des Feuers, das in den Körpern und im Mark der Menschen brennt, das Tag und Nacht in ihnen entfacht wird, die Glieder der Menschen versengt und [bewirkt], dass ihr Verstand berauscht und ihre Seele rasend wird […] sie in Männern wie in Frauen […] Nacht, und sie vollführen Bewegungen […] im Verborgenen und vor aller Augen; denn die Männer [vollführen Bewegungen … an den Frauen] und die Frauen an [den Männern]. [Dementsprechend heißt es]: ‚Alle, die aus wahrer Weisheit nach der Wahrheit suchen, werden Flügel bekommen, um davonzufliegen und der Begierde zu entkommen, die den Geist der Menschen versengt; und sie werden Flügel bekommen, um jedem [bösen] Geist zu entkommen, den sie sehen.‘“[a]


    Thomas antwortete: „Herr, genau danach frage ich dich; denn ich habe begriffen, dass du, wie du sagst, unser Wohltäter bist.“


    Der Retter antwortete erneut: „Darum müssen wir zu dir sprechen, denn dies ist die Lehre für die Reifen. Wenn du nun reif werden willst, wirst du diese Dinge erfüllen. Wenn nicht, lautet dein Name ‚Unwissender‘; denn ein Verständiger kann nicht mit einem Toren zusammenleben, weil der Verständige in aller Weisheit reif ist. Wer weise ist, wird nämlich von der Wahrheit genährt werden und ‚wie ein Baum sein, der am gewundenen Wasserlauf wächst‘ (Psalm 1,3).[b] Für den Toren dagegen sind Gut und Böse dasselbe. Obwohl manche Flügel besitzen, laufen sie dennoch den sichtbaren Dingen nach, die der Wahrheit fern sind. Der Grund dafür ist: Das Feuer, das sie leitet, erzeugt für sie einen Schein von Wahrheit; es lässt sie in einer [vergänglichen] Schönheit erstrahlen, schließt sie in süßes Dunkel ein und bezaubert sie mit duftender Genusssucht.


    Es wird sie mit unauslöschlicher Begierde blenden, ihre Seelen versengen und für sie wie ein Pfahl werden, der in ihr Herz gerammt ist und den sie niemals herausziehen können. Wie es will, treibt es sie umher wie ein Gebiss im Mund. Mit der Bitterkeit der Gefangenschaft in der Begierde nach sichtbaren Dingen, die unversehens entarten, sich verändern und abirren, hat es sie in seine Ketten gelegt und jedes ihrer Glieder gefesselt. Unaufhörlich werden sie nach unten gezogen. Wenn sie getötet werden, werden sie von allen Tieren des vergänglichen Bereichs verdaut.“


    Thomas antwortete: „Es ist klar, wie auch gesagt worden ist: [‚Viele sind … diejenigen, die nicht kennen] […] Seele.‘“[c]


    Und [der Retter] antwortete: „[Selig ist], wer weise ist, wer [nach der Wahrheit suchte und], als er sie fand, für immer in ihr Ruhe fand und sich vor denen nicht fürchtete, die ihn zu beunruhigen suchten.“


    Thomas antwortete: „Ist es gut für uns, Herr, in dem zu ruhen, was zu uns gehört?“


    Der Retter sagte: „Ja, es ist hilfreich und gut für euch. Denn das, was unter den Menschen sichtbar ist, wird vergehen, weil ihr fleischliches Gefäß vergehen wird. Und wenn es zu nichts geworden ist, wird es unter den sichtbaren Dingen, unter den Dingen, die man sehen kann, zu bestehen kommen.[d] Dann wird das Feuer, das sie sehen, ihnen wegen ihrer früheren Liebe zum Glauben Schmerz bereiten.[e] Sie werden wieder zum Sichtbaren gesammelt werden. Ferner werden diejenigen, die unter den unsichtbaren Dingen sehen können, aber nicht die größte Liebe besitzen, an ihrer Sorge um dieses Leben und am Versengen des Feuers zugrunde gehen. Nach nur kurzer Zeit wird das Sichtbare vergehen. Dann werden formlose Schatten hervorkommen, und zwischen den Gräbern werden sie für immer bei den Leichnamen verweilen, leidend und mit ihrer Seele im Verfall.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eckige Klammern und Auslassungspunkte kennzeichnen beschädigten Text oder unsichere Ergänzungen des zugrunde gelegten Übersetzungszeugen. Eine unmittelbare Prüfung des koptischen Manuskripts steht noch aus.
    reason: Der Abschnitt ist stark fragmentarisch; die Rekonstruktionen dürfen nicht als sicherer Wortlaut erscheinen.
  - marker: b
    text: Anspielung auf Psalm 1,3. Die Formulierung „gewundener Wasserlauf“ weicht von der geläufigen Gestalt des Psalms („Wasserbäche“) ab und folgt hier dem vorliegenden Zeugen.
    reason: Kennzeichnet das Schriftzitat und bewahrt zugleich die auffällige Lesart.
  - marker: c
    text: Das von Thomas angeführte Wort ist so lückenhaft überliefert, dass weder sein vollständiger Wortlaut noch sein Bezug sicher bestimmt werden kann.
    reason: Verhindert, dass das Fragment als identifizierbares, vollständiges Zitat missverstanden wird.
  - marker: d
    text: 'Der Satz ist inhaltlich schwer verständlich: Das vergehende fleischliche Gefäß soll, nachdem es zu nichts geworden ist, dennoch unter dem Sichtbaren bestehen. Die Spannung wurde nicht geglättet.'
    reason: Dokumentiert eine echte textliche beziehungsweise übersetzerische Schwierigkeit.
  - marker: e
    text: „Wegen ihrer früheren Liebe zum Glauben“ ist die Lesart des zugrunde gelegten englischen Zeugen, wirkt im Zusammenhang jedoch unerwartet. Eine Prüfung am koptischen Text ist erforderlich.
    reason: Macht die mögliche Überlieferungs- oder Übersetzungsunsicherheit transparent.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Die geläufige, würdevolle deutsche Entsprechung; vermeidet die stärker kirchlich geprägte Festlegung auf „Heiland“.
- source_word: mature
  choice: reif / die Reifen
  rationale: Bewahrt die wiederholte Leitmetapher des Erwachsenseins beziehungsweise der Vollendung, ohne sie als technische Initiationsstufe auszudeuten.
- source_word: Ignoramus
  choice: Unwissender
  rationale: Gibt die Bedeutung natürlich wieder und erhält die direkte Namensgebung; das lateinisch wirkende deutsche Fremdwort wäre unnötig auffällig.
- source_word: spirit(s)
  choice: Geist / Geistwesen
  rationale: Im ersten Fall bleibt der menschliche Geist gemeint; bei „evil spirit“ ist „Geist“ beibehalten und die ergänzte Unsicherheit durch eckige Klammern markiert.
- source_word: reposed
  choice: Ruhe fand / ruhen
  rationale: Natürliches Deutsch, das den im Abschnitt wiederkehrenden Gedanken des Ruhens wahrt.
- source_word: visible things
  choice: sichtbare Dinge / das Sichtbare
  rationale: Erhält den philosophisch-theologischen Gegensatz zwischen Sichtbarem und Unsichtbarem.
- source_word: fleshly vessel
  choice: fleischliches Gefäß
  rationale: Bewahrt das konkrete Gefäßbild und die Körperlichkeit der Vorlage.
- source_word: sweet gloom
  choice: süßes Dunkel
  rationale: Erhält die paradoxe, verführerische Bildsprache, statt sie erklärend aufzulösen.
theological_decisions:
- issue: Negative Darstellung körperlicher Begierde
  choice: Die scharfe Bildsprache von Feuer, Begierde und Gefangenschaft bleibt stehen.
  alternative: Die Aussagen allgemein als moralische Warnung vor Maßlosigkeit abschwächen.
  rationale: Der Text verbindet Begierde ausdrücklich mit Körper, Seele und sichtbarer Welt; eine Harmonisierung würde seine genuine Spannung beseitigen.
- issue: „Liebe zum Glauben“ im Schlussabschnitt
  choice: Wörtlich und ohne dogmatische Erklärung als „Liebe zum Glauben“ wiedergegeben.
  alternative: Zu „früherer Liebe zur Begierde“ oder „Liebe zum Sichtbaren“ emendieren.
  rationale: Der überlieferte englische Zeuge bietet die schwierige Formulierung „love for the faith“; ohne koptische Prüfung darf sie nicht stillschweigend korrigiert werden.
- issue: Schicksal nach dem Tod
  choice: Die Aussagen über Feuer, Schatten, Gräber und Verfall bleiben bildhaft und mehrdeutig.
  alternative: Sie ausdrücklich als Hölle, Fegefeuer oder Vernichtung deuten.
  rationale: Der Text selbst legt kein späteres konfessionelles Lehrsystem eindeutig fest.
- issue: „was zu uns gehört“
  choice: Die unklare Zugehörigkeitsformel bleibt erhalten.
  alternative: Sie als das wahre Selbst, den geistigen Bereich oder die Gemeinde konkretisieren.
  rationale: Eine solche Konkretisierung wäre interpretierend und auf Grundlage des Zeugen nicht gesichert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener apokalyptisch-weisheitlicher Bildsprache. Wiederholungen und Gegensätze wie reif/töricht, sichtbar/unsichtbar und Wahrheit/Schein wurden nicht geglättet. Wegen der ausstehenden Prüfung des koptischen Textes ist die Fassung ausdrücklich als quellennahe, vorläufige Übersetzung des öffentlichen englischen Zeugen zu behandeln.
