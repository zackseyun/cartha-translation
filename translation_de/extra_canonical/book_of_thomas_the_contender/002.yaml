base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: de
  text: 'Der Retter sagte: „Bruder Thomas, höre auf mich, solange dir noch Zeit in der Welt bleibt; dann werde ich dir offenbaren, worüber du in deinem Inneren nachgedacht hast.


    Es heißt, du seist mein Zwilling und wahrer Freund. Darum erforsche dich selbst und erkenne, wer du bist, auf welche Weise du bist und wie du künftig sein wirst. Weil du ‚mein Bruder‘ genannt werden wirst, ziemt es sich nicht für dich, dich selbst nicht zu kennen. Doch ich weiß, dass du dich selbst erkannt hast, denn du hast bereits erkannt, dass ich die wahre Erkenntnis bin. Auch wenn du also nicht erkennst, hast du doch, indem du mit mir übereinstimmst,[a] bereits Erkenntnis erlangt; deshalb wirst du ‚der Selbsterkennende‘ genannt werden. Denn wer sich selbst nicht kennt, weiß nichts; wer sich aber selbst kennt, hat damit bereits tiefe Erkenntnis über alles erlangt. So hast du, mein Bruder Thomas, das geschaut, was den Menschen verborgen ist: das, worüber sie in ihrer Unwissenheit über sich selbst stolpern.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem du mir zustimmst“ bzw. „mit mir eins bist“. Die genaue Bedeutung dieser Wendung bedarf noch der Prüfung am koptischen Text.'
    reason: Die englische Zeugenübersetzung „as you concur with me“ lässt sowohl gedankliche Zustimmung als auch ein stärkeres Einvernehmen anklingen; die Quellenprüfung steht aus.
lexical_decisions:
- source_word: heed me
  choice: höre auf mich
  rationale: Gibt sowohl das Hören als auch die Aufforderung zum Beachten natürlich und würdevoll wieder.
- source_word: mind
  choice: Inneren
  rationale: Vermeidet eine zu enge Festlegung auf den bloßen Verstand und bewahrt den möglichen Sinnbereich von Denken und innerem Bewusstsein.
- source_word: study yourself
  choice: erforsche dich selbst
  rationale: Drückt eine eingehende Selbstprüfung deutlicher aus als das schwächere „betrachte dich selbst“.
- source_word: the mode in which you are
  choice: auf welche Weise du bist
  rationale: Bewahrt die ungewöhnliche und möglicherweise philosophisch-technische Formulierung, ohne sie spekulativ auszudeuten.
- source_word: true knowledge
  choice: die wahre Erkenntnis
  rationale: „Erkenntnis“ passt zum epistemischen und möglicherweise soteriologischen Zusammenhang besser als das sachlichere „Wissen“.
- source_word: the one of self-knowledge
  choice: der Selbsterkennende
  rationale: Eine verständliche substantivische Benennung, die den Zusammenhang mit dem wiederkehrenden Motiv der Selbsterkenntnis wahrt.
- source_word: gazed on
  choice: geschaut
  rationale: Erhält den stärkeren, kontemplativen Sinn gegenüber einem alltäglichen „angesehen“.
theological_decisions:
- issue: Verhältnis zwischen fehlendem Erkennen und bereits erlangter Erkenntnis
  choice: 'Die paradoxe Spannung bleibt stehen: „Auch wenn du also nicht erkennst … bereits Erkenntnis erlangt“'
  alternative: Die erste Aussage als nur teilweise oder noch nicht vollständig verstandene Erkenntnis erklären
  rationale: Der überlieferte Wortlaut enthält eine echte Spannung, die nicht durch eine theologische Harmonisierung beseitigt werden sollte.
- issue: Aussage „ich bin die wahre Erkenntnis“
  choice: Prädikative Identitätsaussage unverändert wiedergeben
  alternative: „Ich besitze/vermittele wahre Erkenntnis“
  rationale: Die stärkere christologische beziehungsweise offenbarungstheologische Aussage des Zeugnisses soll nicht abgeschwächt werden.
- issue: Universaler Umfang der Selbsterkenntnis
  choice: „tiefe Erkenntnis über alles“
  alternative: „Erkenntnis über das All“
  rationale: Die vorliegende englische Zeugenübersetzung bietet „everything“; mangels abgeschlossener koptischer Prüfung wird keine kosmologische Fachbedeutung festgelegt.
translation_notes:
  register: Modernes, gut verständliches Hochdeutsch mit würdigem, leicht philosophischem Ton. Wiederholungen um „erkennen/Erkenntnis“ wurden bewusst erhalten, da sie die Argumentation tragen. Die Übersetzung ist vorläufig, weil laut Datensatz noch keine direkte Prüfung des koptischen Textes von Nag Hammadi Codex II,7 erfolgt ist.
