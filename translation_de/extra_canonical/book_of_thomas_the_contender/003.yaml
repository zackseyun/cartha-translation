translation:
  language: de
  text: 'Thomas sagte zum Herrn: „So bitte ich dich inständig: Antworte mir noch vor deiner Himmelfahrt auf das, was ich dich frage. Wenn ich von dir über die verborgenen Dinge gehört habe, kann ich offen über sie sprechen. Und mir ist klar, dass es schwer ist, vor anderen die Wahrheit zu tun.“


    Der Retter antwortete: „Wenn euch schon die sichtbaren Dinge verborgen sind, wie könnt ihr dann von den unsichtbaren Dingen hören? Wenn es euch schwerfällt, die in dieser Welt sichtbaren Werke der Wahrheit zu tun, wie wollt ihr dann erst die Werke tun, die zur unsichtbaren erhabenen Höhe und zur Fülle[a] gehören? Und wie soll man euch ‚Arbeiter‘ nennen? In dieser Hinsicht seid ihr Schüler und habt den Gipfel der Vollkommenheit noch nicht erreicht.“


    Thomas erwiderte und sagte zum Retter: „Erkläre uns, was du mit den unsichtbaren Dingen meinst, [die dennoch] vor uns verborgen sind.“


    Der Retter sagte: „[Alle] Körper […] die Tiere werden gezeugt […] es ist offenbar wie […] auch dies: Diejenigen, die oben sind […] sichtbare Dinge; doch [sie sind] sichtbar [ ] in ihrer eigenen Wurzel, und ihre Frucht ernährt sie. Diese sichtbaren Körper dagegen erhalten sich dadurch am Leben, dass sie Tiere essen, die ihnen gleichen; infolgedessen verändern sich die Körper. Was sich verändert, wird verfallen und zugrunde gehen; von da an verliert es jede Hoffnung auf Leben, denn es ist ein tierischer Körper.[b] Wie also die Körper der Tiere zugrunde gehen, so werden auch diese [körperlichen] Gestalten zugrunde gehen. Sie entstehen doch ebenso wie die der Tiere durch Geschlechtsverkehr, nicht wahr? Wenn auch ein solcher Körper durch Geschlechtsverkehr entsteht, wie sollte er dann etwas hervorbringen, das sich von den Tieren unterscheidet? Deshalb werdet ihr Kinder bleiben, bis ihr reif werdet.“


    Thomas erwiderte: „Darum sage ich dir, Herr: Wer über unsichtbare und schwer auszulegende Dinge spricht, gleicht Menschen, die nachts Pfeile auf ein Ziel schießen. Gewiss schießen sie ihre Pfeile wie alle anderen, denn sie schießen auf das Ziel; doch es ist nicht zu sehen. Wenn aber das Licht hervortritt und die Dunkelheit verhüllt,[c] wird das Werk eines jeden sichtbar werden. O Herr, unser Licht, erleuchte uns!“


    Jesus sagte: „Das Wesen des Lichts ist Licht.“[d]


    Thomas sagte: „Herr, warum geht dieses sichtbare Licht, das für die Menschen leuchtet, auf und unter?“


    Der Retter antwortete: „O seliger Thomas, dieses sichtbare Licht leuchtet für euch gewiss nicht, damit ihr hierbleibt, sondern damit ihr fortgeht. Und wenn alle Erwählten den tierischen Zustand[e] verlassen haben, wird dieses Licht wieder zu seinem Wesen hinaufsteigen und das Licht begrüßen, denn es ist ein guter Diener.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fülle“ kann hier ein kosmologischer Fachausdruck sein (oft „Pleroma“ genannt); die genaue Bedeutung bleibt wegen der noch ausstehenden Prüfung des koptischen Textes vorläufig.
    reason: Möglicher technischer Begriff mit theologischer Tragweite.
  - marker: b
    text: 'Wörtlich nach dem zugrunde liegenden englischen Zeugen: „tierischer Körper“. Gemeint sein kann ein Körper, der der vergänglichen Lebensweise der Tiere zugehört; die Formulierung wird nicht weiter gedeutet.'
    reason: Bewahrt eine fremdartige anthropologische Bezeichnung ohne konfessionelle Harmonisierung.
  - marker: c
    text: Der Zeuge hat ungewöhnlich „die Dunkelheit verhüllt“, nicht „vertreibt“. Diese möglicherweise paradoxe oder textlich unsichere Lesart ist beibehalten.
    reason: Genuine Schwierigkeit des zugrunde liegenden Zeugen.
  - marker: d
    text: 'Auch möglich: „Die Natur des Lichts ist Licht.“ Der Satz ist im Zeugen bewusst knapp und rätselhaft.'
    reason: Lexikalische Mehrdeutigkeit von „nature“ und Erhalt der Tautologie.
  - marker: e
    text: „Tierischer Zustand“ entspricht der Formulierung des englischen Zeugen. Ob der koptische Ausdruck eher Zustand, Natur oder Lebensweise bezeichnet, muss am Original geprüft werden.
    reason: Direkte Prüfung der koptischen Quelle steht aus.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Die schlichte, traditionsnahe Bezeichnung wahrt den Titelcharakter, ohne zusätzliche christologische Festlegungen einzutragen.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den möglicherweise fachsprachlich-gnostischen Ausdruck wieder, ohne ihn im Haupttext durch eine dogmatische Deutung zu ersetzen.
- source_word: workers
  choice: Arbeiter
  rationale: Bewahrt das Bild und den Zusammenhang mit dem Tun der Werke der Wahrheit.
- source_word: animal body / animal state
  choice: tierischer Körper / tierischer Zustand
  rationale: Die wiederkehrende Bild- und Begriffsverbindung wird sichtbar gehalten; eine glättende Wiedergabe wie „sterblich“ würde die anthropologische Spannung auflösen.
- source_word: essence
  choice: Wesen
  rationale: Eine natürliche philosophisch-religiöse Wiedergabe, die Herkunft, Natur oder Seinsgrund nicht voreilig voneinander abgrenzt.
- source_word: The nature of light is light
  choice: Das Wesen des Lichts ist Licht
  rationale: Die knappe, rätselhafte Tautologie bleibt erhalten und wird nicht erklärend erweitert.
theological_decisions:
- issue: Fachbegriff „Fullness“
  choice: Fülle
  alternative: Pleroma
  rationale: „Fülle“ ist verständlich und quellentreu; eine Fußnote weist auf den möglichen kosmologischen Fachgebrauch hin, ohne diesen endgültig festzulegen.
- issue: Abwertung oder Beschreibung des Leiblichen
  choice: tierischer Körper / tierischer Zustand
  alternative: fleischlicher oder natürlicher Körper/Zustand
  rationale: Die starke Aussage des Zeugen wird bewahrt, aber weder paulinisch mit „fleischlich“ überformt noch durch „natürlich“ abgeschwächt.
- issue: Beziehung des sichtbaren Lichts zu „dem Licht“
  choice: „das Licht begrüßen“
  alternative: „sich mit dem Licht vereinigen“
  rationale: Der überlieferte relationale Ausdruck wird nicht in eine ontologische Verschmelzung umgedeutet.
- issue: Verhüllung der Dunkelheit durch das Licht
  choice: wörtlich „die Dunkelheit verhüllt“
  alternative: „die Dunkelheit vertreibt“
  rationale: Die unerwartete Formulierung und mögliche Überlieferungs- oder Übersetzungsunsicherheit werden sichtbar bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dialogischem Rhythmus. Die beschädigte Passage behält eckige Klammern, leere Klammern und Auslassungspunkte als sichtbare Signale von Textverlust beziehungsweise editorischer Ergänzung. Der Entwurf ist ausdrücklich vorläufig, da als unmittelbare Grundlage nur der öffentliche englische Übersetzungszeuge vorliegt und die Prüfung des koptischen Textes noch aussteht.
