translation:
  language: de
  text: 'Dann fuhr der Retter fort: „Wehe euch Gottlosen, die ihr ohne Hoffnung seid und etwas erwartet, das nicht eintreten wird! Wehe euch, deren Hoffnung auf dem Fleisch ruht, ja, auf dem Gefängnis, das zum Untergang bestimmt ist! Wie lange wollt ihr noch vergesslich sein? Und wie lange wollt ihr noch annehmen, dass auch das Unvergängliche vergehen wird? Eure Hoffnung ist auf die Welt gerichtet, und euer Gott ist dieses Leben! Ihr richtet euch selbst zugrunde!


    Wehe euch wegen des Feuers, das euch von innen versengt, denn es ist unauslöschlich!


    Wehe euch wegen des Rades, das sich in eurem Denken dreht!


    Wehe euch, die ihr in der Gewalt der Glut seid, die in euch wohnt! Denn sie wird euer Fleisch sichtbar verzehren und eure Seelen unsichtbar zerreißen und euch bereit machen, euch euren Freunden anzuschließen!


    Wehe euch Gefangenen, denn ihr seid in Höhlen gefesselt!


    „Ihr spottet und grinst in wahnsinnigem Gelächter! Ihr erkennt eure Verdammnis nicht, bedenkt euren Zustand nicht und habt nicht verstanden, dass ihr in Finsternis und [Tod] lebt! Stattdessen seid ihr vom Feuer berauscht und [mit] Bitterkeit [erfüllt]. Euer Denken ist wahnsinnig wegen der [Glut, die in] euch [ist], und das Gift und die Angriffe eurer Feinde sind euch süß! Die Dunkelheit ging euch als Licht auf, weil ihr eure Freiheit für die Sklaverei preisgegeben habt! Ihr habt eure Herzen verfinstert, eure Gedanken der Torheit überlassen und euer Denken mit dem feurigen Rauch in euch erfüllt! Und euer Licht [wurde] in der Wolke [von … verdunkelt], und die Kleider, die euch bedecken, ihr […]. Und [ihr] wurdet von einer leeren [Hoffnung] gefangen. Und wem habt [ihr] geglaubt? [Versteht ihr nicht, dass] ihr alle unter denen lebt, die […] euch, als ob [ihr …].


    [a] Ihr habt euch in das Wasser der Finsternis getaucht!


    Ihr habt nach euren eigenen Trieben gehandelt!


    Wehe euch, die ihr im Irrtum lebt und das Licht der Sonne nicht beachtet, die die Welt richtet und auf die Welt herabschaut und alles umschließen wird, um Feinde zu versklaven.


    Auch nehmt ihr den Mond nicht wahr, der bei Nacht und bei Tag herabschaut und die Leichen eures Gemetzels sieht!


    Wehe euch, die ihr die Nähe von Frauen und unreinen Verkehr mit ihnen liebt!


    Wehe euch, die ihr in der Gewalt eurer körperlichen Kräfte seid, denn sie werden euch quälen!


    Wehe euch, die ihr in der Gewalt der Mächte böser Dämonen seid!


    Wehe euch, die ihr eure Glieder mit Feuer lockt!


    „Wer wird einen Schauer kühlen Taus auf euch herabsenden, um die Feuerwolke zu löschen, die euch samt der Glut umhüllt? Wer wird die Sonne über euch scheinen lassen, um die Finsternis in euch zu vertreiben und die Finsternis und das unreine Wasser zu verbergen? Sonne und Mond werden euch zusammen mit Luft und Wind, Erde und Wasser einen wohlriechenden Duft schenken. Denn wenn die Sonne nicht auf diese Körper scheint, werden sie verwelken und vergehen, genau wie Unkraut und Gras. Wenn die Sonne auf sie scheint, breiten sie sich aus und ersticken den Weinstock. Wenn aber der Weinstock die Oberhand gewinnt, all das Unkraut und die anderen Sträucher beschattet, die neben ihm wachsen, und sich [ausbreitet] und zunimmt, wird er allein das Land erhalten, auf dem er wächst, und jeden Ort beherrschen, den er überschattet hat. Wenn er reif ist, wird er das ganze Land beherrschen und seinem Herrn reichen Ertrag bringen. Er wird ihm umso mehr gefallen, weil dieser sich die große Mühe erspart hat,
    jene Pflanzen auszureißen. Vielmehr hat der Weinstock sie selbst beseitigt und sogar erstickt; sie starben und wurden so tot wie der Erdboden.“


    Dann fuhr Jesus fort und sagte: „Wehe euch, weil ihr die Lehre nicht angenommen habt, und diejenigen, die […] beim Verkündigen arbeiten werden […]. Und [ihr] lauft in […] wird [sie] hinabtreiben […] am Tag tötet ihr sie [a] damit sie vom Tod auferstehen könnten.“'
