lexical_decisions:
- source_word: godless
  choice: Gottlosen
  rationale: Gibt die religiös-moralische Bezeichnung direkt und ohne konfessionelle Zusatzdeutung wieder.
- source_word: flesh
  choice: Fleisch
  rationale: Bewahrt den körperlich-anthropologischen Leitbegriff und seine Spannung zum Unvergänglichen.
- source_word: prison
  choice: Gefängnis
  rationale: Erhält die starke Körpermetapher des Zeugnisses, ohne sie erklärend aufzulösen.
- source_word: scorching
  choice: Glut
  rationale: Natürliches Deutsch für eine im Inneren wohnende, versengende Hitze; unterscheidet sie vom ausdrücklich genannten Feuer.
- source_word: minds / mind
  choice: Denken
  rationale: Passt sowohl zum inneren Vorgang als auch zum geistigen Zustand und vermeidet eine zu moderne psychologische Festlegung.
- source_word: bodily powers
  choice: körperliche Kräfte
  rationale: Bewahrt die mögliche Mehrdeutigkeit zwischen leiblichen Antrieben und personifizierten Mächten.
- source_word: teaching
  choice: Lehre
  rationale: Formale, theologisch neutrale Wiedergabe ohne Festlegung auf eine bestimmte Lehrtradition.
- source_word: grapevine
  choice: Weinstock
  rationale: Idiomatiche und traditionsfähige deutsche Pflanzenbezeichnung, ohne die Bildrede allegorisch auszudeuten.
theological_decisions:
- issue: Vergänglichkeit des Fleisches und Gefängnisbild
  choice: Die Hoffnung ruht auf dem Fleisch, „ja, auf dem Gefängnis“
  alternative: Das Fleisch selbst ausdrücklich als Gefängnis identifizieren
  rationale: Die appositionale Spannung des Zeugnisses bleibt erhalten, ohne eine ausgearbeitete Leibfeindlichkeit stärker festzuschreiben, als der Wortlaut erlaubt.
- issue: Personifikation von Sonne und Mond
  choice: Personifizierende Relativsätze beibehalten
  alternative: Sonne und Mond als bloße Naturerscheinungen paraphrasieren
  rationale: Das Zeugnis schreibt ihnen richtende, schauende und handelnde Funktionen zu; diese ungewöhnliche Bildwelt darf nicht rationalisiert werden.
- issue: „Freunde“ im Gerichtswort
  choice: „euren Freunden“ unverändert und unerklärt lassen
  alternative: Als Dämonen, Mitverdammte oder Leidensgenossen bestimmen
  rationale: Der Bezug ist im überlieferten Text nicht eindeutig.
- issue: Sexualethische Aussage
  choice: „Nähe von Frauen und unreinen Verkehr mit ihnen“
  alternative: Die Aussage verallgemeinern oder abschwächen
  rationale: Die konkrete, asketisch gefärbte Formulierung wird bewahrt, ohne zusätzliche universale Lehraussagen daraus abzuleiten.
- issue: Auferstehen vom Tod im beschädigten Schluss
  choice: Fragmentarische Aussage ohne syntaktische Harmonisierung erhalten
  alternative: Einen kohärenten Verfolgungs- und Auferstehungssinn rekonstruieren
  rationale: Die Textlücken lassen Subjekte, Bezüge und logische Verknüpfung unsicher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit eindringlichem prophetischem Rhythmus. Wiederholte Weherufe und drastische Körperbilder bleiben erhalten. Eckige Klammern und Auslassungspunkte kennzeichnen überlieferte Ergänzungen beziehungsweise Textverlust. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist dies ein vorläufiger, eng am bereitgestellten gemeinfreien englischen Zeugen orientierter Entwurf.
