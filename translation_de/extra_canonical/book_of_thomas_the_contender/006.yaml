review_pass:
  verdict: revise
  source_fidelity: Der Entwurf ist insgesamt eng am bereitgestellten englischen Zeugen und bewahrt dessen Bildsprache, Wiederholungen und die fragmentarische Schlusssequenz. Eine unmittelbare koptische Gegenprüfung ist auf Grundlage des vorliegenden Materials nicht möglich. Einige beschädigte bzw. ergänzte Stellen wurden jedoch im Deutschen unnötig umgestellt oder durch Fußnotenmarker ersetzt; dadurch werden die Schadenssignale des Zeugen nicht durchgängig bewahrt.
  naturalness: Der prophetisch-drastische Ton ist im Wesentlichen idiomatisch und angemessen. Kleinere Eingriffe verbessern die deutsche Satzführung, ohne die absichtlich harte und lückenhafte Syntax der Überlieferung zu glätten.
  terminology: Die Leitbegriffe „Fleisch“, „Gefängnis“, „Glut“, „Finsternis“, „Lehre“ und „Weinstock“ sind passend und theologisch nicht überdeutet. Die parenthetische Wiederholung bei der Aussage über Frauen und unreinen Verkehr sowie die Parenthese „(dead)“ im Vergleich mit dem Boden sollten auch im Deutschen sichtbar bleiben.
  issues:
  - severity: medium
    issue: Leere Schadstellen wurden durch den Fußnotenmarker [a] ersetzt.
    rationale: Der englische Zeuge kennzeichnet zwei nicht lesbare Partien ausdrücklich als „[]“. Ein wiederverwendeter Fußnotenmarker ist weder ein gleichwertiges Schadenssignal noch eindeutig einem einzelnen Anker zugeordnet. Die leeren Klammern werden im Haupttext wiederhergestellt.
  - severity: medium
    issue: Mehrere eckig markierte Ergänzungen wurden syntaktisch zerlegt oder umplatziert.
    rationale: Insbesondere „[scorching that is inside]“, „[was obscured]“ und „[of ...]“ sollten als erkennbare, zusammenhängende Ergänzungen bzw. Lücken erhalten bleiben. Die Revision bildet diese Markierung im Deutschen enger nach.
  - severity: low
    issue: Einige Referenzen und Parenthesen wurden geglättet.
    rationale: „neben ihm“ legt den Bezug stärker fest als das englische „next to them“; außerdem fehlten die parenthetische Wiederholung bei „(who love)“ und das überlieferte „(dead)“. Die Revision bewahrt diese Unsicherheiten und Signale.
