base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: de
  text: '„Selig seid ihr, die ihr im Voraus erkennt, was euch zu Fall bringen kann, und die ihr vor fremdartigen Dingen flieht.


    Selig seid ihr, die ihr beschimpft und missachtet werdet wegen der Liebe, die ihr Herr euch erweist.[a]


    Selig seid ihr, die ihr weint und von denen verfolgt werdet, die keine Hoffnung haben; denn ihr werdet aus jeder Gefangenschaft befreit werden.


    Wacht und betet, damit ihr es vermeidet, im Fleisch zu leben, und stattdessen aus der bitteren Gefangenschaft dieses Lebens fortgeht. Wenn ihr betet, werdet ihr Ruhe finden, weil ihr Leiden und Schande hinter euch gelassen habt. Denn wenn ihr die Leiden und Begierden des Körpers hinter euch lasst, werdet ihr vom Guten Ruhe empfangen; und ihr werdet mit dem König herrschen, ihr und er miteinander vereint, von nun an für immer und ewig. Amen.“


    Das Buch des Thomas


    Der Wettkämpfer


    An die Gereiften geschrieben


    Denkt auch an mich, meine Brüder,


    [in] euren Gebeten:


    Friede sei mit den Heiligen


    und mit denen des Geistes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Satz wechselt auffällig zwischen „ihr/euch“ und „ihr Herr“; der genaue Bezug der Pronomen ist im zugrunde liegenden englischen Zeugnis unsicher.
    reason: Kennzeichnet eine echte grammatische und semantische Unklarheit, ohne sie stillschweigend zu glätten.
  - marker: b
    text: 'Wörtlich: „denen des Geistes“; gemeint sein können Menschen, die zum Geist gehören oder vom Geist geprägt sind.'
    reason: Bewahrt die knappe, theologisch offene Schlussformel und erläutert mögliche Lesarten.
lexical_decisions:
- source_word: have knowledge beforehand
  choice: im Voraus erkennt
  rationale: Gibt den im Zeugnistexte ausdrücklich kognitiven Sinn wieder und klingt im Deutschen natürlicher als „Vorwissen haben“.
- source_word: what can trip you up
  choice: was euch zu Fall bringen kann
  rationale: Bewahrt das bildhafte Gefährdungs- und Anstoßmotiv, ohne es auf eine bestimmte Art moralischen Versagens festzulegen.
- source_word: strange things
  choice: fremdartigen Dingen
  rationale: Bewahrt die Unbestimmtheit des Zeugnisses; „fremd“ allein könnte Zugehörigkeit statt Beschaffenheit betonen.
- source_word: repose / rest
  choice: Ruhe
  rationale: Einheitliche, würdige Wiedergabe, die sowohl Erquickung als auch endgültige Ruhe offenlässt.
- source_word: the Good One
  choice: dem Guten
  rationale: Erhält die substantivierte personale oder titulare Offenheit der Formulierung, ohne sie ausdrücklich mit einer benannten Person gleichzusetzen.
- source_word: Contender
  choice: Wettkämpfer
  rationale: Gibt die Vorstellung eines Ringenden oder Kämpfenden wieder, ohne die moderne Bedeutung von „Kontrahent“ in den Vordergrund zu stellen.
- source_word: the Mature
  choice: die Gereiften
  rationale: Bewahrt den möglichen geistlichen Reifungssinn und vermeidet die bloße Altersbezeichnung „Erwachsene“.
theological_decisions:
- issue: Leben „im Fleisch“
  choice: im Fleisch zu leben
  alternative: im Körper zu existieren
  rationale: Die traditionelle anthropologische Wendung und ihre theologische Spannung bleiben erhalten; sie wird nicht zu einer pauschalen Aussage über die Schlechtigkeit des Körpers ausgelegt.
- issue: Liebe des Herrn und Pronomenbezug
  choice: wegen der Liebe, die ihr Herr euch erweist
  alternative: aus Liebe zu ihrem Herrn
  rationale: Folgt der syntaktischen Richtung des vorliegenden Zeugnisses, obwohl der Wechsel zwischen zweiter und dritter Person auffällig bleibt; eine Fußnote kennzeichnet die Unsicherheit.
- issue: Vereinigung mit dem König
  choice: ihr und er miteinander vereint
  alternative: eins geworden mit ihm
  rationale: Bewahrt die Aussage gegenseitiger Vereinigung, ohne eine metaphysische Identität zu behaupten.
- issue: „die des Geistes“
  choice: denen des Geistes
  alternative: den Geistmenschen
  rationale: Lässt offen, ob Zugehörigkeit, Herkunft oder geistliche Beschaffenheit gemeint ist, statt eine feste anthropologische Klasse einzuführen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Seligpreisungen behalten ihre parallele Form. Eckige Klammern um „[in]“ markieren wie im Zeugnis eine Ergänzung. Nicht zum Werk gehörende Webseiten-, Kontakt- und Werbeangaben wurden nicht übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und eng am bereitgestellten gemeinfreien englischen Zeugnis orientiert.
