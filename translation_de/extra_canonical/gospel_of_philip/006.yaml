base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: de
  text: '„Jesus“ ist ein verborgener Name; „Christus“ ist ein offenbarter Name. Deshalb wird „Jesus“ nicht übersetzt, sondern er wird bei seinem Namen „Jesus“ genannt. Der Name „Christus“ aber lautet auf Syrisch „Messias“, auf Griechisch „Christus“, und alle anderen geben ihn in ihrer eigenen Sprache wieder. „Der Nazarener“ offenbart, was verborgen ist. Christus hat alles in sich: sei es Mensch oder Engel oder Geheimnis – und den Vater.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten gemeinfreien englischen Textzeugen. Eine direkte Prüfung des koptischen Textes steht noch aus; besonders die Syntax der letzten Aufzählung kann daher anders zu gliedern sein.
    reason: Die angegebene Grundlage ist ein englischer Übersetzungszeuge, während die Prüfung der koptischen Ausgangssprache noch aussteht.
lexical_decisions:
- source_word: Jesus
  choice: Jesus
  rationale: Der Eigenname bleibt entsprechend der ausdrücklichen Aussage des Textes unübersetzt.
- source_word: Christ
  choice: Christus
  rationale: Die im Deutschen etablierte gräzisierende Namensform bewahrt die Gegenüberstellung zu „Messias“.
- source_word: Syriac
  choice: Syrisch
  rationale: Natürliche moderne Bezeichnung der im englischen Zeugen genannten Sprache; eine genauere Bestimmung anhand des Koptischen steht noch aus.
- source_word: Messiah
  choice: Messias
  rationale: Etablierte deutsche Wiedergabe des semitischen Titels und passend zur sprachlichen Gegenüberstellung.
- source_word: The Nazarene
  choice: Der Nazarener
  rationale: Bewahrt den substantivischen Beinamen und seine im Text behauptete offenbarende Funktion.
- source_word: mystery
  choice: Geheimnis
  rationale: Gibt die religiöse Bedeutungsbreite wieder, ohne sie vorschnell als Geheimlehre oder Sakrament festzulegen.
theological_decisions:
- issue: Das Verhältnis zwischen „Nazarener“ und dem Verborgenen
  choice: „offenbart, was verborgen ist“
  alternative: „macht das Verborgene sichtbar“
  rationale: Die Formulierung erhält die begriffliche Spannung zwischen verborgenem und offenbartem Namen.
- issue: Umfang dessen, was Christus in sich hat
  choice: Die offene Aufzählung „Mensch oder Engel oder Geheimnis – und den Vater“ bleibt bestehen.
  alternative: Die Begriffe als Seinsweisen oder Personengruppen näher bestimmen.
  rationale: Der Text erklärt weder die grammatische noch die theologische Beziehung abschließend; eine dogmatische Präzisierung wäre unbegründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Namensformen und die Gegenüberstellung von „verborgen“ und „offenbart“ wurden bewusst beibehalten. Der Gedankenstrich in der Schlussaufzählung macht die auffällige Stellung des Vaters lesbar, ohne ihre theologische Beziehung zu den vorausgehenden Gliedern festzulegen.
