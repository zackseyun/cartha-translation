translation:
  language: de
  text: 'Diejenigen, die sagen, der Herr sei zuerst gestorben und dann auferstanden, irren sich; denn er ist zuerst auferstanden, und dann ist er gestorben. Wer nicht zuerst die Auferstehung erlangt, wird nicht sterben. So wahr Gott lebt: Ein solcher würde /sterben\![a]


    Niemand wird etwas Großes und Wertvolles in etwas Großem verbergen; oft aber hat jemand unzählige Tausende in etwas gelegt, das nur einen Pfennig wert ist. Ebenso ist es mit der Seele: Etwas Wertvolles ist in einem verachteten Körper entstanden.


    Manche fürchten, sie würden nackt auferstehen. Darum wollen sie im Fleisch auferstehen. Dabei wissen [sie] nicht, dass diejenigen nackt sind, die das [Fleisch] tragen. Diejenigen, die […] sich nackt auszuziehen, [sind] nicht nackt.[b] »Fleisch [und Blut werden Gottes] Reich [nicht] erben.« Was ist es, das nicht erben wird? Das, was auf uns ist. Doch was ist es wiederum, das erben wird? Es ist Jesu Fleisch und Blut.[c] Deshalb sagte er: »Wer mein Fleisch nicht isst und mein Blut nicht trinkt, hat kein Leben in sich.« Was ist sein Fleisch? Es ist das Wort, und sein Blut ist der Heilige Geist. Wer diese empfangen hat, hat Speise, Trank und Kleidung.


    Ich meinerseits widerspreche also den anderen, die sagen: »Es wird nicht auferstehen.« Beide Seiten irren sich. Ihr, die ihr sagt: »Das Fleisch wird nicht auferstehen«, sagt mir, was auferstehen wird, damit wir euch Achtung erweisen können. Ihr sagt: »Der Geist im Fleisch und dieses andere Licht im Fleisch.« Doch auch dieser Ausspruch ist im Fleisch; denn was ihr auch sagt, ihr könnt es nicht ohne das Fleisch sagen. Es ist notwendig, in diesem Fleisch aufzuerstehen, weil alles in ihm besteht.[d] In dieser Welt sind die Menschen besser als die Kleider, die sie tragen. Im Himmelreich sind die Kleider besser als die Menschen, die sie tragen.


    Alles wird durch Wasser und Feuer gereinigt: das Sichtbare durch das Sichtbare, das Verborgene durch das Verborgene. Manche Dinge sind durch sichtbare Dinge verborgen. Es gibt Wasser im Wasser und Feuer im Salböl.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche Form /sterben\ gibt die Kennzeichnung des zugrunde liegenden englischen Zeugnisses wieder. Der genaue koptische Wortlaut muss noch unmittelbar geprüft werden.
    reason: Unsichere beziehungsweise auffällig markierte Lesart des Zeugnisses darf nicht stillschweigend normalisiert werden.
  - marker: b
    text: Die eckigen Klammern und die Auslassung […] kennzeichnen beschädigten oder ergänzten Text. Der Satzbau bleibt deshalb unsicher.
    reason: Manuskriptschaden und Ergänzungen müssen für Leser sichtbar bleiben.
  - marker: c
    text: »Fleisch« steht im englischen Zeugnis an dieser Stelle in runden Klammern und ist möglicherweise eine verdeutlichende Ergänzung. Im Haupttext ist es lesbar integriert, die Unsicherheit wird hier festgehalten.
    reason: Die vom Zeugnis signalisierte editorische Unsicherheit soll dokumentiert werden.
  - marker: d
    text: »Weil alles in ihm besteht« kann sich grammatisch auf das Fleisch beziehen; Bedeutung und Reichweite der Aussage bleiben jedoch offen.
    reason: Bewahrt eine echte referenzielle und theologische Mehrdeutigkeit.
  - marker: e
    text: Das mit »Salböl« wiedergegebene Wort bezeichnet Chrisma, also Öl zur Salbung; welche konkrete rituelle Bedeutung gemeint ist, bleibt offen.
    reason: Lexikalische Erläuterung ohne konfessionelle Festlegung.
lexical_decisions:
- source_word: arose / resurrection
  choice: auferstanden / Auferstehung
  rationale: Bewahrt die bewusste Wiederholung und die Spannung zwischen der Auferstehung des Herrn und dem gegenwärtigen Erlangen der Auferstehung.
- source_word: flesh
  choice: Fleisch
  rationale: Der zentrale, mehrdeutige Begriff wird durchgehend formal wiedergegeben und nicht auf »Körper« oder eine bestimmte theologische Deutung verengt.
- source_word: body
  choice: Körper
  rationale: Unterscheidet die im Zeugnis verwendete Bezeichnung »body« vom theologischen Leitwort »flesh«.
- source_word: Word
  choice: Wort
  rationale: Erhält die christologische und offenbarungstheologische Mehrdeutigkeit des Ausdrucks.
- source_word: Holy Spirit
  choice: Heiliger Geist
  rationale: Geläufige und sachlich genaue Wiedergabe des ausdrücklich genannten theologischen Begriffs.
- source_word: chrism
  choice: Salböl
  rationale: Natürliches modernes Deutsch; bezeichnet das für die Salbung verwendete Öl, ohne die Stelle konfessionell als ein bestimmtes Sakrament festzulegen.
- source_word: clothes / clothing
  choice: Kleider / Kleidung
  rationale: Erhält das im Abschnitt entwickelte Bild des Anziehens und Nacktseins.
theological_decisions:
- issue: Zeitliche Aussage über Auferstehung und Tod des Herrn
  choice: »zuerst auferstanden, und dann ... gestorben« wörtlich bewahrt
  alternative: Die Aussage als geistliche Auferstehung vor dem leiblichen Tod erklärend umformulieren
  rationale: Die paradoxe Reihenfolge ist für den Gedankengang wesentlich und darf nicht harmonisiert werden.
- issue: Auferstehung des Fleisches
  choice: Die wechselnden Aussagen und die Kritik an beiden Seiten bleiben unaufgelöst
  alternative: Den Abschnitt eindeutig für oder gegen eine leibliche Auferstehung formulieren
  rationale: Der Text entfaltet absichtlich eine Spannung zwischen äußerem Fleisch, Jesu Fleisch und dem Auferstehen »in diesem Fleisch«.
- issue: Jesu Fleisch und Blut
  choice: Fleisch als »Wort« und Blut als »Heiliger Geist« wiedergegeben
  alternative: Die Aussagen ausschließlich eucharistisch oder ausschließlich metaphorisch deuten
  rationale: Die ausdrückliche Auslegung des Textes wird bewahrt, ohne ihren möglichen rituellen Hintergrund festzulegen.
- issue: Reinigung durch Wasser, Feuer und Salböl
  choice: Rituelle Bildsprache ohne dogmatische Präzisierung erhalten
  alternative: Als Taufe, Firmung oder eine bestimmte Initiationsordnung auslegen
  rationale: Das vorliegende Zeugnis nennt Elemente und Vorgänge, identifiziert sie aber nicht eindeutig mit späteren konfessionellen Riten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten Wiederholungen, Paradoxien und Bildfeldern. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist dies ein vorläufiger, am bereitgestellten gemeinfreien englischen Zeugnis orientierter Entwurf. Eckige Klammern und Auslassungszeichen bleiben als textkritische Signale erhalten.
