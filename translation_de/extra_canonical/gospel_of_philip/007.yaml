  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng und bewahrt dessen Paradoxien, Wiederholungen sowie die textkritischen Klammern und Auslassungen. Eine sichere Korrektur ist bei der beschädigt/ergänzt überlieferten Zitatformel zu Fleisch, Blut und Reich nötig: Die Klammerung des Zeugen darf nicht so umgestellt werden, dass »Gottes« und die Verneinung anders als im Zeugen als gesichert bzw. ergänzt erscheinen. Außerdem gibt »existiert« die schlichte Aussage »everything exists in it« genauer wieder als »besteht«. Eine unmittelbare Kontrolle des Koptischen ist nach den Metadaten weiterhin ausstehend.'
  naturalness: Das Deutsch ist weitgehend modernes, würdiges Standarddeutsch. Die bewusst sperrige Formulierung im beschädigten Satz über das Nacktsein bleibt als Folge der überlieferten Lücke kenntlich. »Achtung erweisen« und die Bildsprache sind angemessen.
  terminology: Die Wiedergaben »Auferstehung«, »Fleisch«, »Körper«, »Wort«, »Heiliger Geist« und »Salböl« sind konsistent und wahren die theologischen Mehrdeutigkeiten des Zeugen. »Salböl« ist als Übersetzung von »chrism« mit der vorhandenen Fußnote ausreichend erläutert.
