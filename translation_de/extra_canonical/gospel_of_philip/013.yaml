review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen Brüche, Auslassungen, eckige Klammern und auffällige Mehrdeutigkeiten. Eine sichere Korrektur betrifft den Schlusssatz des Abschnitts über Wollen und Handeln: »Es liegt weder am Willen noch an der Tat« fügt eine im Zeugen nicht ausgedrückte Kausalrelation hinzu. »Es ist weder der Wille noch die Tat« bildet die bewusst rätselhafte Vorlage genauer nach.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Die Korrektur von »Einige wollen es weder noch können sie es« zu »Einige wollen es weder, noch können sie es« stellt eine notwendige, natürliche Negationsverbindung her. Die fragmentarischen Partien bleiben absichtlich unvollständig.
  terminology: Die konsequente Wiedergabe der Schlüsselbegriffe (Welt, Mächte, mittlere Orte/Mitte, Ruhe, Salbung, Brautgemach, Fülle) ist sachgerecht. »Salbung« für chrism und »Fülle« für fullness werden zurückhaltend erläutert. Die Gegenüberstellung »ein [Christ]«/»ein Christus« und die unklare Logik des Namens-Erwerbens bleiben zu Recht nicht harmonisiert.
  issues:
  - severity: medium
    issue: Zusätzliche Kausalinterpretation in der Aussage über Willen und Tat
    rationale: '»Es liegt weder am Willen noch an der Tat« bedeutet, dass etwas Bestimmtes nicht von Wille oder Tat abhänge. Der englische Zeuge sagt lediglich: »It is not the will, and it is not the act.« Die ergänzte Relation sollte nicht eingeführt werden.'
  - severity: low
    issue: Fehlendes Komma bei korrelierter Negation
    rationale: 'In »Einige wollen es weder noch können sie es« muss die Konstruktion durch ein Komma gegliedert werden: »weder, noch«. Dies verbessert die Lesbarkeit ohne Sinnänderung.'
  revised_text: "Wer aus der Welt herauskommt, kann nicht mehr gebunden werden, denn er war in der Welt. Es zeigt sich, dass er über dem Verlangen nach [… und] der Furcht steht. Er herrscht über […]; er ist der Missgunst überlegen. Wenn […] kommen, binden und würgen sie – die Mächte – [ihn]. Wie wird [er] den [großen Mächten …] entkommen können? Wie wird er […] können? Einige [sagen]: »Wir sind gläubig«, damit […] [unreiner Geist] und Dämon; denn hätten sie den Heiligen Geist, würde kein unreiner Geist an ihnen haften. Fürchte das Fleisch nicht und liebe es auch nicht. Wenn du es fürchtest, wird es über dich herrschen; wenn du es liebst, wird es dich verschlingen und würgen.\n\n\n      Ein Mensch befindet sich entweder in dieser Welt, in der Auferstehung oder in den mittleren Orten.[a] Möge ich dort niemals gefunden werden! In dieser Welt gibt es sowohl Gutes als auch Böses. Was in ihr gut ist, ist nicht gut, und was in ihr böse ist, ist nicht böse. Doch nach dieser Welt gibt es ein Übel,\
    \ das wirklich böse ist: das, was »die Mitte« genannt wird. Es ist der Tod. Solange wir in dieser Welt sind, sollen wir die Auferstehung für uns erlangen. Wenn wir dann vom Fleisch entkleidet werden, werden wir in der Ruhe gefunden und müssen nicht durch die Mitte ziehen; denn viele verirren sich auf dem Weg.\n\n\n      Es ist gut, aus der Welt herauszukommen, bevor man sündigt. Einige wollen es weder, noch können sie es. Andere aber hätten, selbst wenn sie wollten, keinen Nutzen davon, weil sie nicht gehandelt haben. Ihr Wollen macht sie zu Sündern. Doch selbst wenn sie nicht wollen, bleibt ihnen die Gerechtigkeit verborgen. Es ist weder der Wille noch die Tat.[b]\n\n\n      Ein Apostel sah [in einer] Vision einige Menschen, die in einem brennenden Haus eingeschlossen und mit brennenden […] gefesselt waren, geworfen […] des Brennenden […] sie in […]. Und man sagte zu ihnen: »[… gerettet] werden können […]« Sie wollten nicht und empfingen […] Strafe, die »die [äußere] Finsternis« genannt\
    \ wird, weil sie […].\n\n\n      Die Seele und der Geist entstanden aus Wasser und Feuer. Der Nachkomme des Brautgemachs entstand aus Wasser, Feuer und Licht. Das Feuer ist die Salbung,[c] und das Licht ist das Feuer. Ich spreche nicht von jenem gestaltlosen Feuer, sondern von dem anderen, dessen Gestalt weiß ist, das hell und schön ist und Schönheit verleiht.\n\n\n      Die Wahrheit kam nicht nackt in die Welt, sondern in Sinnbildern und Bildern. Anders wird die Welt sie nicht aufnehmen. Es gibt eine Wiedergeburt und ein Bild der Wiedergeburt. Es ist wirklich notwendig, durch das Bild von Neuem gezeugt zu werden. Was ist die Auferstehung und das Bild? Durch das Bild muss sie auferstehen. Das Brautgemach und das Bild? Durch das Bild müssen sie in die Wahrheit eingehen, die Wiederherstellung ist. Es ist nicht nur nötig, dass Menschen den Namen des Vaters, des Sohnes und des Heiligen Geistes erlangen; auch sie sind für euch erlangt worden.[d] Wenn jemand sie nicht erlangt, wird ihm auch\
    \ der Name genommen werden. Empfangen werden sie aber in der Salbung des […] der Kraft des Kreuzes. Die Apostel nannten dies »[die] Rechte und die Linke«, denn dieser Mensch ist nicht länger ein [Christ], sondern ein Christus.[e]\n\n\n      Der Herr [vollzog] alles in einem Mysterium: eine Taufe, eine Salbung, eine Eucharistie, eine Erlösung, ein Brautgemach […]. Er [sagte]: »Ich bin gekommen, um [das Untere] wie das [Obere und das Äußere] wie das [Innere] zu machen [und] sie an dem Ort [zu vereinen].« […] hier durch [Sinnbilder …] Diejenigen, die sagen: »[…] es gibt einen oben […«, irren, denn] das Offenbare ist das […], das, [was] »das Untere« genannt wird; und das Verborgene ist ihm gegenüber das, was über ihm ist, denn es ist gut. Und sie sagen: »das Innere und das Äußere und das, was außerhalb des Äußeren ist«. Darum nannte der Herr das Verderben »die äußere Finsternis«. Außerhalb von ihr gibt es nichts.\n\n\n      Er sagte: »Mein Vater, der im Verborgenen ist.« Er sagte: »Geh in\
    \ deine Kammer, schließ die Tür hinter dir und bete zu deinem Vater, der im Verborgenen ist« – das heißt zu dem, der in ihnen allen ist. Der aber, der in ihnen allen ist, ist die Fülle.[f] Darüber hinaus gibt es im Inneren nichts anderes. Dies wird »das, was über ihnen ist« genannt.\n\n\n      Vor Christus kamen einige von dort, wo sie nicht mehr hineingehen konnten, und sie gingen dorthin, wo sie nicht mehr herauskommen konnten. Dann kam Christus. Er führte diejenigen heraus, die hineingegangen waren, und führte diejenigen hinein, die hinausgegangen waren."
