translation:
  language: de
  text: 'Wer aus der Welt herauskommt, kann nicht mehr gebunden werden, denn er war in der Welt. Es zeigt sich, dass er über dem Verlangen nach [… und] der Furcht steht. Er herrscht über […]; er ist der Missgunst überlegen. Wenn […] kommen, binden und würgen sie – die Mächte – [ihn]. Wie wird [er] den [großen Mächten …] entkommen können? Wie wird er […] können? Einige [sagen]: »Wir sind gläubig«, damit […] [unreiner Geist] und Dämon; denn hätten sie den Heiligen Geist, würde kein unreiner Geist an ihnen haften. Fürchte das Fleisch nicht und liebe es auch nicht. Wenn du es fürchtest, wird es über dich herrschen; wenn du es liebst, wird es dich verschlingen und würgen.


    Ein Mensch befindet sich entweder in dieser Welt, in der Auferstehung oder in den mittleren Orten.[a] Möge ich dort niemals gefunden werden! In dieser Welt gibt es sowohl Gutes als auch Böses. Was in ihr gut ist, ist nicht gut, und was in ihr böse ist, ist nicht böse. Doch nach dieser Welt gibt es ein Übel, das wirklich böse ist: das, was »die Mitte« genannt wird. Es ist der Tod. Solange wir in dieser Welt sind, sollen wir die Auferstehung für uns erlangen. Wenn wir dann vom Fleisch entkleidet werden, werden wir in der Ruhe gefunden und müssen nicht durch die Mitte ziehen; denn viele verirren sich auf dem Weg.


    Es ist gut, aus der Welt herauszukommen, bevor man sündigt. Einige wollen es weder noch können sie es. Andere aber hätten, selbst wenn sie wollten, keinen Nutzen davon, weil sie nicht gehandelt haben. Ihr Wollen macht sie zu Sündern. Doch selbst wenn sie nicht wollen, bleibt ihnen die Gerechtigkeit verborgen. Es liegt weder am Willen noch an der Tat.[b]


    Ein Apostel sah [in einer] Vision einige Menschen, die in einem brennenden Haus eingeschlossen und mit brennenden […] gefesselt waren, geworfen […] des Brennenden […] sie in […]. Und man sagte zu ihnen: »[… gerettet] werden können […]« Sie wollten nicht und empfingen […] Strafe, die »die [äußere] Finsternis« genannt wird, weil sie […].


    Die Seele und der Geist entstanden aus Wasser und Feuer. Der Nachkomme des Brautgemachs entstand aus Wasser, Feuer und Licht. Das Feuer ist die Salbung,[c] und das Licht ist das Feuer. Ich spreche nicht von jenem gestaltlosen Feuer, sondern von dem anderen, dessen Gestalt weiß ist, das hell und schön ist und Schönheit verleiht.


    Die Wahrheit kam nicht nackt in die Welt, sondern in Sinnbildern und Bildern. Anders wird die Welt sie nicht aufnehmen. Es gibt eine Wiedergeburt und ein Bild der Wiedergeburt. Es ist wirklich notwendig, durch das Bild von Neuem gezeugt zu werden. Was ist die Auferstehung und das Bild? Durch das Bild muss sie auferstehen. Das Brautgemach und das Bild? Durch das Bild müssen sie in die Wahrheit eingehen, die Wiederherstellung ist. Es ist nicht nur nötig, dass Menschen den Namen des Vaters, des Sohnes und des Heiligen Geistes erlangen; auch sie sind für euch erlangt worden.[d] Wenn jemand sie nicht erlangt, wird ihm auch der Name genommen werden. Empfangen werden sie aber in der Salbung des […] der Kraft des Kreuzes. Die Apostel nannten dies »[die] Rechte und die Linke«, denn dieser Mensch ist nicht länger ein [Christ], sondern ein Christus.[e]


    Der Herr [vollzog] alles in einem Mysterium: eine Taufe, eine Salbung, eine Eucharistie, eine Erlösung, ein Brautgemach […]. Er [sagte]: »Ich bin gekommen, um [das Untere] wie das [Obere und das Äußere] wie das [Innere] zu machen [und] sie an dem Ort [zu vereinen].« […] hier durch [Sinnbilder …] Diejenigen, die sagen: »[…] es gibt einen oben […«, irren, denn] das Offenbare ist das […], das, [was] »das Untere« genannt wird; und das Verborgene ist ihm gegenüber das, was über ihm ist, denn es ist gut. Und sie sagen: »das Innere und das Äußere und das, was außerhalb des Äußeren ist«. Darum nannte der Herr das Verderben »die äußere Finsternis«. Außerhalb von ihr gibt es nichts.


    Er sagte: »Mein Vater, der im Verborgenen ist.« Er sagte: »Geh in deine Kammer, schließ die Tür hinter dir und bete zu deinem Vater, der im Verborgenen ist« – das heißt zu dem, der in ihnen allen ist. Der aber, der in ihnen allen ist, ist die Fülle.[f] Darüber hinaus gibt es im Inneren nichts anderes. Dies wird »das, was über ihnen ist« genannt.


    Vor Christus kamen einige von dort, wo sie nicht mehr hineingehen konnten, und sie gingen dorthin, wo sie nicht mehr herauskommen konnten. Dann kam Christus. Er führte diejenigen heraus, die hineingegangen waren, und führte diejenigen hinein, die hinausgegangen waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Mittlere Orte« bezeichnet hier einen Zustand oder Bereich zwischen dieser Welt und der Auferstehung; die genaue Vorstellung bleibt im Text offen.
    reason: Der Ausdruck ist ein technischer kosmologischer Begriff und für heutige Leser nicht selbsterklärend.
  - marker: b
    text: Der Gedankengang über Wollen, Handeln, Sünde und Gerechtigkeit ist im erhaltenen Wortlaut schwer zu bestimmen und wurde nicht geglättet.
    reason: Kennzeichnet echte semantische beziehungsweise textliche Unsicherheit.
  - marker: c
    text: »Salbung« gibt den Ausdruck für das Chrisma wieder, der sowohl das Salbmittel als auch den rituellen Vollzug bezeichnen kann.
    reason: Erläutert einen zentralen technischen Begriff.
  - marker: d
    text: Worauf sich »sie« bezieht und wie das wechselseitige »Erlangen« zu verstehen ist, bleibt mehrdeutig.
    reason: Das Pronomen und die Satzlogik lassen mehrere Bezüge zu.
  - marker: e
    text: Wörtlich steht der zugespitzte Gegensatz zwischen »Christ« und »ein Christus«; vermutlich spielt er auf die Bedeutung »Gesalbter« an, ohne dass der Text sie ausdrücklich erklärt.
    reason: Bewahrt eine theologisch auffällige und potenziell missverständliche Formulierung.
  - marker: f
    text: »Fülle« ist ein theologischer Fachausdruck für die umfassende göttliche Wirklichkeit; seine genaue Reichweite wird hier nicht näher bestimmt.
    reason: Unterstützt das Verständnis, ohne eine bestimmte dogmatische Deutung festzuschreiben.
lexical_decisions:
- source_word: world
  choice: Welt
  rationale: Bewahrt den wiederkehrenden kosmologischen Schlüsselbegriff, ohne ihn als bloße Gesellschaft oder Schöpfung auszudeuten.
- source_word: powers
  choice: Mächte
  rationale: Gibt die personifiziert-kosmische Bedeutung wieder und lässt offen, welche konkreten Mächte gemeint sind.
- source_word: middle places / the middle
  choice: mittlere Orte / die Mitte
  rationale: Bewahrt die räumliche Bildsprache und den Wechsel zwischen Plural und Singular des Zeugnisses.
- source_word: rest
  choice: Ruhe
  rationale: Erhält den religiös-eschatologischen Sinn, ohne ihn vorschnell mit Himmel oder Erlösung gleichzusetzen.
- source_word: chrism
  choice: Salbung
  rationale: Natürliches deutsches Wort für den sakralen Akt beziehungsweise dessen Mittel; die besondere technische Bedeutung wird in einer Fußnote angezeigt.
- source_word: types and images
  choice: Sinnbilder und Bilder
  rationale: Unterscheidet die beiden Ausdrücke verständlich, ohne ihre genaue metaphysische Beziehung festzulegen.
- source_word: bridal chamber
  choice: Brautgemach
  rationale: Bewahrt den technischen und zugleich bildhaften Ausdruck der Schrift.
- source_word: fullness
  choice: Fülle
  rationale: Formale Wiedergabe des theologischen Fachbegriffs, ohne eine bestimmte Systematik einzutragen.
- source_word: redemption
  choice: Erlösung
  rationale: Im Deutschen verständlich und in der Reihe ritueller Mysterien bewusst ohne zusätzliche dogmatische Präzisierung belassen.
theological_decisions:
- issue: Auferstehung als gegenwärtig zu erlangende Wirklichkeit
  choice: »Solange wir in dieser Welt sind, sollen wir die Auferstehung für uns erlangen«
  alternative: Auferstehung ausschließlich als zukünftiges Ereignis formulieren
  rationale: Der Text verbindet Auferstehung ausdrücklich mit einem Erwerb in der gegenwärtigen Welt; diese Spannung wird nicht harmonisiert.
- issue: Das Verhältnis von Wollen, Handeln, Sünde und Gerechtigkeit
  choice: Die schwer verständliche Schlussfolgerung bleibt wörtlich und unaufgelöst
  alternative: Die Aussage zu einer Lehre über guten Willen oder Werkgerechtigkeit glätten
  rationale: Der überlieferte Gedankengang ist mehrdeutig und möglicherweise textlich gestört.
- issue: »ein Christ« gegenüber »ein Christus«
  choice: Die zugespitzte Gegenüberstellung wird bewahrt
  alternative: »christusgleich« oder »ein Gesalbter«
  rationale: Die Formulierung trägt eine echte christologische beziehungsweise initiatorische Spannung, die nicht abgeschwächt werden soll.
- issue: Vater im Verborgenen und innerhalb aller
  choice: Beide Aussagen werden unmittelbar miteinander verbunden, wie im Zeugnis
  alternative: Die Aussage trinitarisch, pantheistisch oder psychologisch erklären
  rationale: Keine spätere Lehrsystematik soll die offene Aussage vereindeutigen.
- issue: Mysterienreihe
  choice: Taufe, Salbung, Eucharistie, Erlösung und Brautgemach bleiben als parallele Größen stehen
  alternative: Sie als kirchliche Sakramente einer bestimmten Tradition klassifizieren
  rationale: Der Text selbst bestimmt weder Zahl noch späteres konfessionelles Sakramentsverständnis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fragmentarischen Stellen, eckigen Klammern und Auslassungspunkte wurden als Signale beschädigter oder ergänzter Überlieferung beibehalten. Generisches Singular wurde dort mit »er« wiedergegeben, wo der englische Zeuge singularisches »they« verwendet; dies ist grammatisch, nicht als Beschränkung auf Männer, gemeint. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich auf den bereitgestellten gemeinfreien englischen Zeugen gegründet.
