review_pass:
  verdict: revise
  source_fidelity: Eine direkte Prüfung am koptischen Manuskript ist nach den vorliegenden Angaben noch nicht möglich; die Prüfung erfolgt daher vorläufig gegen den bereitgestellten englischen Zeugen. Die Übersetzung bewahrt dessen Auslassungen, Ergänzungen in eckigen Klammern und zentrale Mehrdeutigkeiten weitgehend zuverlässig. Einige Formulierungen präzisieren jedoch den Zeugen unnötig oder lassen formale Markierungen aus.
  naturalness: Das Deutsch ist insgesamt klar, würdig und gut lesbar. Einzelne wörtlichkeitsnahe Stellen sind bewusst kantig und angesichts des beschädigten Textes vertretbar. Kleinere Anpassungen verbessern idiomatische Kohärenz ohne inhaltliche Glättung.
  terminology: Chrisma, Brautgemach, Unvergänglichkeit, Erkenntnis und vollkommener Mensch sind angemessen und konsistent. Die eschatologische Zeitangabe muss näher am Zeugen als „(ewiges) Zeitalter“ stehen; „kommend“ ist dort nicht ausdrücklich belegt.
  issues:
  - severity: medium
    issue: „kommendes Zeitalter“ statt „(eternal) age“
    rationale: Der englische Zeuge markiert ausdrücklich „(eternal)“, nicht „coming“. „Kommend“ ist eine plausible Deutung, fügt aber eine zeitliche Bestimmung hinzu, die die Vorlage nicht bietet.
  - severity: low
    issue: Die Parenthese „(two)“ in der Aussage über die Einheit der beiden Dinge fehlt.
    rationale: Bei einem Text, dessen Überlieferung und Wortlaut mehrfach markiert unsicher sind, soll auch diese formale Markierung erhalten bleiben.
  - severity: low
    issue: „größer als die Starken“ verschiebt „better than the strong“.
    rationale: „Besser/vorzüglicher“ gibt die wertende Aussage genauer wieder als die primär quantitative Kategorie „größer“.
  - severity: low
    issue: „Nur Jesus kennt das Ende dieses Menschen“ legt „this one“ auf den vollkommenen Menschen fest.
    rationale: Der Bezug von „this one“ ist im fragmentarischen Kontext nicht sicher. „dessen Ende“ bewahrt die Anaphorik, ohne den Referenten festzulegen.
  - severity: low
    issue: „macht sich ... zum Diener“ bei der Liebe-Passage ist aktiver und milder als „is a slave“.
    rationale: Der Zeuge sagt, die durch Erkenntnis befreite Person „ist ein Sklave“ wegen der Liebe. Die deutsche Fassung soll diese paradoxe und harte Bildsprache bewahren.
  revised_text: 'Wer sagt, er werde zuerst sterben und danach auferstehen, irrt sich. Wenn Menschen die Auferstehung nicht zuerst empfangen, solange sie leben, werden sie beim Sterben nichts empfangen. Ebenso ist es, wenn sie von der Taufe sprechen und sagen: »Die Taufe ist etwas Großes«, denn wer sie empfängt, wird leben.



    Der Apostel Philippus sagte: »Josef, der Zimmermann, pflanzte einen Garten, weil er Holz für sein Handwerk brauchte. Er war es, der aus den Bäumen, die er gepflanzt hatte, das Kreuz machte; und sein Nachkomme hing an dem, was er gepflanzt hatte. Sein Nachkomme war Jesus, und die Pflanze war das Kreuz.« Doch der Baum des Lebens steht mitten im Paradies. Vom Ölbaum kam das Chrisma[a], und von diesem die Auferstehung.



    Diese Welt verzehrt Leichen. Alles, was in ihr verzehrt wird, stirbt ebenfalls. Die Wahrheit verzehrt Leben; darum wird niemand sterben, der von [der Wahrheit] genährt wird. Jesus kam von jenem Ort und brachte von dort Nahrung. Allen, die wollten, gab er [zu essen, damit] sie nicht sterben.



    [Gott …] ein Paradies, [Mensch …] Paradies; dort sind […] und […] Gottes […] die darin [sind …] Ich wünsche, dass [das Paradies …] sie zu mir sagen werden: »[… iss] dies«, oder: »Iss [das nicht …] wünsche.« Der Baum der Erkenntnis ist der Ort, an dem ich alles essen werde. Er tötete Adam, hier aber macht er die Menschheit lebendig. Das Gesetz war der Baum. Es hat die Macht, die Erkenntnis von Gut und Böse zu geben. Es hielt sie weder vom Bösen ab noch versetzte es sie in das Gute; vielmehr brachte es denen, die von ihm aßen, den Tod. Denn als es sagte: »Iss dies; iss das nicht«, wurde es zum Anfang des Todes.



    Das Chrisma ist vorzüglicher als die Taufe; denn wir heißen wegen des Chrismas »Christen«, nicht wegen der Taufe. Auch Christus erhielt seinen Namen wegen des Chrismas: Der Vater salbte den Sohn, der Sohn salbte die Apostel, und die Apostel salbten uns. Wer gesalbt ist, hat alles: die Auferstehung, das Licht, das Kreuz und den Heiligen Geist. Der Vater gab ihm dies im Brautgemach, und er empfing es. Der Vater war im Sohn und der Sohn im Vater. Dies ist [das Reich] der Himmel.



    Der Herr sagte [es] treffend: »Einige gingen lachend in das Reich der Himmel und kamen […] heraus. Ein Christ […] und sobald [… hinabstieg] ins Wasser und er […] alles über […] es ist [ein] Spiel; [doch … missachten] dies […] zum Reich der [Himmel …] wenn sie […] missachten und wenn sie es als Spiel verachten, [… heraus] lachend.« Ebenso ist es mit dem Brot, dem Kelch und dem Öl, obwohl es eines gibt, das vorzüglicher ist als diese.



    Die Welt entstand durch eine Verfehlung; denn derjenige, der sie schuf, wollte sie unvergänglich und unsterblich schaffen. Er fiel ab und erreichte nicht, was er wollte. Denn weder war die Welt unvergänglich noch war derjenige, der sie schuf, unvergänglich. Nicht Dinge sind nämlich unvergänglich, sondern Kinder. Nichts wird Unvergänglichkeit empfangen können, ohne ein Kind zu werden. Wer aber nicht empfangen kann – wie viel weniger wird er geben können?



    Der Gebetskelch enthält Wein und Wasser, denn er ist als Sinnbild des Blutes eingesetzt, über dem das Dankgebet gesprochen wird. Er wird mit dem Heiligen Geist erfüllt und gehört dem ganz vollkommenen Menschen. Wenn wir daraus trinken, werden wir den vollkommenen Menschen empfangen. Das lebendige Wasser ist ein Leib. Wir müssen den lebendigen Menschen anziehen. Wenn Menschen also zum Wasser hinabsteigen, entkleiden sie sich, damit sie jenen anziehen.



    Ein Pferd zeugt ein Pferd, ein Mensch zeugt einen Menschen, und ein Gott zeugt einen Gott. Ebenso ist es mit [dem Bräutigam] und [den Bräuten]. Sie [entstehen] aus dem […] Kein Jude […] aus […] besteht, und […] aus den Juden […] die Christen […] nannten diese […] »das auserwählte Geschlecht der […]«, »den wahren Menschen«, »den Menschensohn« und »den Samen des Menschensohnes«. Dieses wahre Geschlecht ist in der Welt bekannt. Dies sind die Orte, an denen die Kinder des Brautgemachs bestehen.



    In dieser Welt besteht die Vereinigung zwischen Mann und Frau, dem Ort von Kraft und Schwäche. Im (ewigen) Zeitalter[b] ist die Vereinigung andersartig, doch wir bezeichnen beides mit denselben Namen. Es gibt jedoch andere Namen, die über jedem genannten Namen stehen, und sie sind besser als die Starken. Denn wo Gewalt ist, gibt es solche, die noch mächtiger sind. Es sind nicht (zwei) verschiedene Dinge, sondern beide sind dasselbe. Dies kann nicht auf das fleischliche Herz herabkommen.



    Muss nicht jeder, der alles hat, sich selbst vollständig erkennen? Manche, die sich selbst nicht erkennen, werden nicht genießen können, was sie haben. Wer aber sich selbst erkannt hat, wird daran Freude haben.



    Sie werden den vollkommenen Menschen nicht nur nicht binden können; sie werden ihn auch nicht sehen können, denn wenn sie ihn sehen, werden sie ihn binden. Es gibt keinen anderen Weg, diese Gnade zu erwerben, [als] das vollkommene Licht anzuziehen [und] das vollkommene [Licht] zu werden. [Wer es angezogen hat], wird gehen […] dies ist das Vollkommene […] damit wir werden […] bevor wir kamen zu […] wer alles empfängt […] diese Orte, wird […] jenen Ort erreichen können, doch er wird […] [in der Mitte] als unvollkommen. Nur Jesus kennt dessen Ende.



    Der heilige Mensch – der Priester[c] – ist ganz und gar heilig, bis hin zu seinem Leib. Denn wenn er das Brot empfängt, wird er es heiligen; ebenso den Kelch oder alles andere, was er nimmt und reinigt. Warum sollte er nicht auch den Leib reinigen?



    Wie Jesus das Wasser der Taufe vollkommen machte, so goss er den Tod aus. Darum steigen wir ins Wasser hinab, aber nicht in den Tod, damit wir nicht in den Geist der Welt ausgegossen werden. Wenn dieser weht, kommt der Winter; wenn der Heilige Geist haucht, kommt der Sommer.



    Wer die Wahrheit kennt, ist ein freier Mensch, und der freie Mensch sündigt nicht; denn »wer sündigt, ist ein Sklave der Sünde«. Die Wahrheit ist die Mutter, die Erkenntnis aber ist die Vereinigung. Wer der Sünde nicht hingegeben ist, wird von der Welt »frei« genannt. Diese Menschen, die der Sünde nicht hingegeben sind, werden durch die Erkenntnis der Wahrheit stolz. Sie macht sie frei und erhebt sie über alles. Doch »die Liebe baut auf«. Wer durch Erkenntnis frei geworden ist, ist aus Liebe ein Sklave derer, die die Freiheit der Erkenntnis noch nicht erlangen können; [doch] die Erkenntnis befähigt sie, frei zu werden. Die Liebe […] nichts als ihr Eigentum […] sie […] ihr Eigentum. Sie sagt niemals [»…«] oder: »Dies gehört mir«, [sondern: »…] gehört euch.« Geistliche Liebe ist duftender Wein. Alle, die sich damit salben, genießen ihn. Solange die Gesalbten in ihrer Nähe bleiben, genießen ihn auch die Umstehenden. Wenn aber die mit Salböl Gesalbten sie verlassen und fortgehen,

    bleiben die Ungesalbten, die nur in ihrer Nähe waren, in ihrem Gestank zurück.


    Der Samariter gab dem Verwundeten nichts als Wein mit Öl. Das war nichts anderes als Salböl, und es heilte die Wunden; denn »die Liebe bedeckt eine Menge von Sünden«.



    Die Kinder, die eine Frau zur Welt bringt, werden dem Mann gleichen, den sie liebt. Ist es ihr Ehemann, gleichen sie ihrem Ehemann; ist es ein Ehebrecher, gleichen sie dem Ehebrecher. Oft schläft eine Frau aus Pflicht mit ihrem Ehemann, während ihr Herz bei dem Ehebrecher ist, mit dem sie vertrauten Umgang hat. Bringt sie dann ein Kind zur Welt, gleicht es dem Ehebrecher. Ihr aber, die ihr mit dem Sohn Gottes verbunden seid: Liebt nicht die Welt, sondern liebt den Herrn, damit die, die ihr zeugt, nicht der Welt gleichen, sondern dem Herrn.



    Der Mensch vereinigt sich mit dem Menschen, das Pferd mit dem Pferd und der Esel mit dem Esel. Arten vereinigen sich [mit] gleichartigen Wesen. Ebenso vereinigt sich Geist mit Geist; das [Wort] ist dem Wort vertraut, und [das Licht ist] dem [Licht] vertraut. [Wenn du] Mensch wirst, wird [der Mensch] dich lieben. Wenn du [Geist] wirst, wird der Geist sich mit dir vereinigen. Wenn du Wort wirst, wird das Wort sich mit dir vereinigen. Wenn du Licht wirst, wird das Licht dir vertraut sein. Wenn du einer von denen oben wirst, werden die von oben auf dir ruhen. Wenn du aber Pferd oder Esel, Kalb oder Hund, Schaf oder irgendeines der anderen Tiere wirst, die draußen oder unten sind, werden weder Mensch noch Geist noch Wort noch Licht noch die von oben noch die im Innern dich lieben können. Sie werden nicht in dir ruhen können, und du wirst keinen Anteil an ihnen haben.



    Wer gegen seinen Willen Sklave ist, kann frei werden. Wer durch die Gnade seines Herrn frei geworden ist und sich selbst wieder in die Sklaverei verkauft hat, kann nicht mehr frei werden.'
