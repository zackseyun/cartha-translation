  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten englischen Zeugen des koptischen Textes; eine unmittelbare Prüfung am Koptischen steht noch aus. Eckige Klammern und Auslassungspunkte kennzeichnen ergänzten oder beschädigten Text.
    reason: Die Quellenlage und der vorläufige Charakter müssen transparent bleiben.
  - marker: b
    text: Die Aussage »ist noch ein Hebräer« wird in ihrer auffälligen Form bewahrt; der beschädigungsfreie Wortlaut erklärt nicht näher, wie die Bezeichnung hier gemeint ist.
    reason: Verhindert eine stillschweigende ethnische, religiöse oder polemische Festlegung.
  - marker: c
    text: Die hier gegebenen Namensdeutungen und Wortspiele werden als Aussagen des Textes wiedergegeben; sie entsprechen nicht durchweg den üblichen sprachwissenschaftlichen Etymologien.
    reason: Ungewöhnliche antike Etymologien sollen erhalten, aber nicht als moderne Sprachwissenschaft ausgegeben werden.
  - marker: d
    text: Auch die syrische Deutung von »Pharisatha« und die Wendung »die Welt kreuzigen« werden ohne sprachliche oder theologische Harmonisierung beibehalten.
    reason: Kennzeichnet eine umstrittene Worterklärung und schützt die Mehrdeutigkeit der Aussage.
  - marker: e
    text: Der Abschnitt über die Weisheit und Maria Magdalena ist stark beschädigt. Insbesondere das Körperteil nach »auf ihren« fehlt; es wird nicht ergänzt.
    reason: Verhindert, dass eine verbreitete, aber in der vorliegenden Textgrundlage nicht erhaltene Ergänzung in den Haupttext gelangt.
lexical_decisions:
- source_word: dyer / dyes / dyed
  choice: Färber / Farben / gefärbt
  rationale: Bewahrt das durchgehende Bildfeld des Färbens in natürlichem Deutsch; »Farben« umfasst hier Färbemittel und Farbtöne, ohne das Bild zu erklären.
- source_word: true (of dyes)
  choice: echt
  rationale: »Echte Farben« gibt den Sinn von beständigen beziehungsweise unverfälschten Färbungen idiomatisch wieder, ohne die anschließende Unsterblichkeitsmetapher vorwegzunehmen.
- source_word: Hebrew
  choice: Hebräer
  rationale: Die markante Bezeichnung des Zeugen wird beibehalten und nicht konfessionell oder ethnisch umgedeutet.
- source_word: the measured
  choice: der Gemessene
  rationale: Erhält die ungewöhnliche, im Text ausdrücklich behauptete Namensdeutung und glättet sie nicht zu einer geläufigeren christologischen Bezeichnung.
- source_word: human-eater
  choice: Menschenfresser
  rationale: Gibt die bewusst schockierende Formulierung direkt wieder, statt sie durch »Menschenopfer empfangend« abzuschwächen.
- source_word: breath
  choice: Hauch
  rationale: Bewahrt die mögliche Spannung zwischen handwerklichem Blasen von Glas und lebensspendendem Atem.
- source_word: Son of Humanity / Man
  choice: Sohn des Menschen
  rationale: Eine formnahe, verständliche Wiedergabe, die den Ausdruck nicht durch eine dogmatisch stärker festgelegte Auslegung ersetzt.
- source_word: mystery
  choice: Mysterium
  rationale: Bewahrt den rituell-religiösen Sinn und vermeidet, den Ausdruck auf ein bloß verborgenes »Geheimnis« zu reduzieren.
theological_decisions:
- issue: Vergöttlichungs- und Verwandlungssprache
  choice: »seid Christus geworden« und »werdet Vater werden« unmittelbar beibehalten
  alternative: Abschwächung zu »Christus ähnlich geworden« oder »dem Vater ähnlich werden«
  rationale: Der Text formuliert eine reale Identifikation beziehungsweise Verwandlung. Eine abschwächende Paraphrase würde die theologische Spannung beseitigen.
- issue: Aussage »Gott ist ein Menschenfresser«
  choice: wörtlich und ohne harmonisierende Erklärung wiedergegeben
  alternative: Deutung als bloße Aussage über Opferkult oder Eucharistie
  rationale: Der unmittelbare Kontext erlaubt verschiedene Deutungen; die Übersetzung soll keine davon verbindlich festlegen.
- issue: Eucharistie ist Jesus
  choice: Identitätsaussage als »Die Eucharistie ist Jesus« erhalten
  alternative: »Die Eucharistie stellt Jesus dar«
  rationale: Eine repräsentative oder symbolische Lesart wäre eine theologische Präzisierung, die der Wortlaut nicht ausdrücklich vornimmt.
- issue: Empfang des christlichen Namens in Taufe und Geist
  choice: Metapher von Geschenk, Darlehen und Zins bewahrt
  alternative: Systematische Auslegung als Aussage über Sakramentsgültigkeit oder Wiedergeburt
  rationale: Der Text verbindet Wasser, Geist, Namen und Mysterium, erklärt ihr Verhältnis aber nicht vollständig; diese Offenheit bleibt bestehen.
- issue: Sophia und Maria Magdalena
  choice: Beschädigten Satzbau mit Rekonstruktionszeichen erhalten
  alternative: Ergänzung zu »Die Gefährtin des Erlösers ist Maria Magdalena«
  rationale: Die gebotene Textgrundlage trägt eine solche bekannte Rekonstruktion nicht sicher genug; die Lücke darf nicht stillschweigend geschlossen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, klaren Sätzen. Bildhafte und anstößige Formulierungen wurden nicht geglättet. Philosophische Existenzsprache bleibt bewusst paradox. Personenbezeichnungen sind überwiegend generisch formuliert; wo der Text feste historische oder soziale Benennungen verwendet, wurden diese erhalten. Die Übersetzung ist wegen der noch ausstehenden direkten koptischen Kollation ausdrücklich vorläufig.
