  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen eng und bewahrt dessen Brüche, Wiederholungen, provokante Aussagen und textkritische Klammern. Sichere Korrekturen betreffen vor allem die grammatische Kennzeichnung der Lücke beim Vater, die als Titel formulierte Namensreihe sowie die Metapher des gegen Zins aufgenommenen Namens. Eine direkte Prüfung am Koptischen ist nach wie vor ausstehend.
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. Einige absichtlich fragmentarische Stellen bleiben wegen des beschädigten Zeugen fragmentarisch. Die korrigierte Fassung vermeidet jedoch unnötige deutsche Mehrdeutigkeit bei »leihen« und macht die Titelreihe natürlicher.
  terminology: Schlüsselbegriffe wie »Geist«, »Christus«, »Vater«, »Eucharistie«, »Heiliger Geist« und »Mysterium« sind angemessen und ohne dogmatische Harmonisierung wiedergegeben. »Sklave« folgt dem vorgelegten Quellzeugen gegenüber dem davon abweichenden englischen POB-Audittext. Die ungewöhnlichen Etymologien und die Aussage über den »Menschenfresser« bleiben als Textaussagen erhalten.
  issues:
  - severity: medium
    issue: Die Lücke in der Aussage über den Vater ist im deutschen Text nicht quellengetreu abgegrenzt.
    rationale: Der Zeuge bietet »you saw [the Father, you] will become father«. Die Fassung »ihr habt [den Vater gesehen und] werdet Vater werden« verschiebt die Ergänzung und stellt »gesehen« außerhalb der im Zeugen markierten Ergänzung dar. Die Klammerung ist für die Textkritik relevant.
  - severity: medium
    issue: Die Namensreihe wird als Akkusativgruppe statt als zitierter Name wiedergegeben.
    rationale: »Jesus, den Nazarener, den Messias« klingt, als sei ein Satzobjekt zitiert, während der Zeuge eine Benennung bzw. einen Titel anführt. Die nominativische Reihung »Jesus, der Nazarener, Messias« wahrt die Struktur und ist im Deutschen klarer.
  - severity: medium
    issue: »hat den Namen gegen Zins geliehen« ist im Deutschen hinsichtlich der Richtung des Leihvorgangs mehrdeutig.
    rationale: Der Zeuge meint eindeutig, dass die betreffende Person den Namen gegen Zins geborgt hat. »hat sich den Namen gegen Zins geliehen« stellt dies klar. Entsprechend ist auch im Folgesatz das Reflexivpronomen nötig.
  - severity: low
    issue: Fußnote a beschreibt die Funktion der textkritischen Zeichen nicht präzise genug.
    rationale: Eckige Klammern markieren im vorliegenden Zeugen Ergänzungen bzw. Rekonstruktionen; Auslassungspunkte signalisieren Lücken oder Beschädigung. Die bisherige Formulierung verbindet beides zu unbestimmt.
  revised_text: '**Christen werden**[a]



    Gott ist ein Färber. Die guten Farben – man nennt sie echt – sterben zusammen mit dem, was mit ihnen gefärbt wurde. So ist es auch mit denen, die Gott gefärbt hat. Weil seine Farben unsterblich sind, werden sie durch seine Farbtöne unsterblich. Gott aber tauft im Wasser.



    Niemand kann etwas, das wirklich existiert, sehen, ohne ihm gleich zu werden. Bei einem Menschen in der Welt ist es nicht so: Er sieht die Sonne, ohne zur Sonne zu werden, und er sieht Himmel und Erde und alles andere, ohne dazu zu werden. Dort aber ist es so. Ihr habt etwas von jenem Ort gesehen und seid dazu geworden. Ihr habt den Geist gesehen und seid Geist geworden; ihr habt Christus gesehen und seid Christus geworden; ihr habt [den Vater gesehen, ihr] werdet Vater werden. Deshalb seht ihr [hier] alles, aber [euch selbst seht ihr] nicht. [Dort] aber seht ihr euch selbst, denn ihr werdet zu dem [werden], was ihr seht.



    Der Glaube empfängt; die Liebe gibt. [Niemand wird] ohne Glauben [empfangen können], und niemand wird ohne Liebe geben können. Darum glauben wir, damit wir empfangen; wir geben aber, damit wir lieben. Denn wer nicht aus Liebe gibt, hat nichts davon. Wer den Herrn noch nicht empfangen hat, ist noch ein Hebräer.[b]



    Die Apostel vor uns nannten ihn »Jesus, der Nazarener, Messias«, das heißt: »Jesus, der Nazarener, Christus«. Der letzte Name ist »Christus«, der erste »Jesus«, der mittlere »der Nazarener«. »Messias« hat zwei Bedeutungen: »Christus« und »der Gemessene«. »Jesus« bedeutet auf Hebräisch »die Erlösung«. »Nazara« bedeutet »die Wahrheit«. Somit ist »der Nazarener« die Wahrheit. »Christus« ist der, der gemessen wurde. »Der Nazarener« und »Jesus« sind die, die gemessen wurden.[c]



    Eine Perle verliert nicht an Wert, wenn man sie in den Schlamm wirft, und sie gewinnt nicht an Wert, wenn man sie mit Balsam salbt. Für ihren Besitzer ist sie zu jeder Zeit kostbar. So ist es auch mit den Kindern Gottes: Wo sie auch sind, für ihren Vater bleiben sie kostbar.



    Wenn du sagst: »Ich bin Jude«, wird niemand bewegt. Wenn du sagst: »Ich bin Römer«, wird sich niemand beunruhigen. Wenn du sagst: »Ich bin Grieche«, »ein Barbar«, »ein Sklave«, [»ein freier Mensch«], wird sich niemand aufregen. [Wenn] du [sagst]: »Ich bin Christ«, wird der […] erzittern. Wenn doch nur [… von] dieser Art; dieser, [der …], wird es nicht ertragen können, seinen Namen [zu hören].



    Gott ist ein Menschenfresser. Deshalb wird ihm der Mensch [geopfert]. Bevor der Mensch geopfert wurde, opferte man Tiere; denn diejenigen, denen sie geopfert wurden, waren keine Götter.



    Gefäße aus Glas und Ton entstehen durch Feuer. Wenn Glasgefäße zerbrechen, werden sie neu gemacht, denn sie sind durch einen Hauch entstanden. Wenn aber Tongefäße zerbrechen, werden sie vernichtet, denn sie sind ohne Hauch entstanden.



    Ein Esel, der einen Mühlstein drehte, legte hundert Meilen zurück. Als man ihn losband, fand er sich noch immer am selben Ort wieder. Viele Menschen sind unterwegs und kommen doch nirgendwohin. Als der Abend kam, sahen sie weder Stadt noch Dorf, weder etwas Geschaffenes noch etwas Natürliches, weder Macht noch Engel. Die Unglücklichen hatten sich vergeblich abgemüht.



    Die Eucharistie ist Jesus, denn auf Syrisch heißt er »Pharisatha«, das bedeutet »der Ausgebreitete«; denn Jesus kam, um die Welt zu kreuzigen.[d]



    Der Herr ging in Levis Färberei. Er nahm zweiundsiebzig Farben und warf sie in den Bottich. Er holte sie alle weiß wieder heraus und sagte: »So ist der Sohn des Menschen [als] Färber gekommen.«



    Die Weisheit, die »die Unfruchtbare« genannt wird, ist die Mutter [der Engel] und [die] Gefährtin des [… Maria] Magdalena [… liebte sie] mehr als die Jünger [… er] küsste sie oft auf ihren […]. Die übrigen […] […] sagten zu ihm: »Warum liebst du sie mehr als uns alle?« Der Retter antwortete ihnen: »Warum liebe ich euch nicht so wie sie? Wenn ein Blinder und ein Sehender beide im Dunkeln sind, unterscheiden sie sich nicht voneinander. Wenn das Licht kommt, wird der Sehende das Licht sehen; der Blinde aber wird im Dunkeln bleiben.«[e]



    Der Herr sagte: »Selig ist, wer existiert, bevor er existiert; denn wer existiert, existierte und wird existieren.«



    Die Überlegenheit der Menschheit zeigt sich nicht offen, sondern liegt im Verborgenen. Darum herrscht sie über Tiere, die stärker sind und sowohl im Sichtbaren als auch im Verborgenen größer. So können sie überleben. Trennt sich aber die Menschheit von ihnen, den Tieren, dann töten, beißen und fressen sie einander, weil sie keine Nahrung finden. Jetzt aber haben sie Nahrung gefunden, weil die Menschheit die Erde bearbeitet hat.



    Wenn jemand ins Wasser hinabsteigt, wieder heraufkommt, ohne etwas empfangen zu haben, und sagt: »Ich bin Christ«, dann hat er sich den Namen gegen Zins geliehen. Empfängt er aber den Heiligen Geist, hat er die Gabe des Namens. Wer ein Geschenk empfangen hat, dem wird es nicht wieder genommen; wer dagegen sich etwas gegen Zins geliehen hat, muss es zurückgeben. So verhält es sich, wenn jemand in einem Mysterium ins Dasein tritt.'
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten englischen Zeugen des koptischen Textes; eine unmittelbare Prüfung am Koptischen steht noch aus. Eckige Klammern kennzeichnen ergänzten oder rekonstruierten Text; Auslassungspunkte kennzeichnen Textlücken oder Beschädigung.
    reason: Die Quellenlage, der vorläufige Charakter und die textkritischen Zeichen müssen transparent bleiben.
  - marker: b
    text: Die Aussage »ist noch ein Hebräer« wird in ihrer auffälligen Form bewahrt; der beschädigungsfreie Wortlaut erklärt nicht näher, wie die Bezeichnung hier gemeint ist.
    reason: Verhindert eine stillschweigende ethnische, religiöse oder polemische Festlegung.
  - marker: c
    text: Die hier gegebenen Namensdeutungen und Wortspiele werden als Aussagen des Textes wiedergegeben; sie entsprechen nicht durchweg den üblichen sprachwissenschaftlichen Etymologien.
    reason: Ungewöhnliche antike Etymologien sollen erhalten, aber nicht als moderne Sprachwissenschaft ausgegeben werden.
  - marker: d
    text: Auch die syrische Deutung von »Pharisatha« und die Wendung »die Welt kreuzigen« werden ohne sprachliche oder theologische Harmonisierung beibehalten.
    reason: Kennzeichnet eine umstrittene Worterklärung und schützt die Mehrdeutigkeit der Aussage.
  - marker: e
    text: Der Abschnitt über die Weisheit und Maria Magdalena ist stark beschädigt. Insbesondere das Körperteil nach »auf ihren« fehlt; es wird nicht ergänzt.
    reason: Verhindert, dass eine verbreitete, aber in der vorliegenden Textgrundlage nicht erhaltene Ergänzung in den Haupttext gelangt.
  revision_rationale: Die Revision beschränkt sich auf sichere, quellennahe Korrekturen. Sie wahrt die im Zeugen sichtbare Rekonstruktion beim Vater, formuliert die zitierten Namen als Titelreihe, beseitigt die im Deutschen entstandene Leihrichtungs-Mehrdeutigkeit und präzisiert die Erläuterung der textkritischen Zeichen. Beschädigte, semantisch schwierige und theologisch spannungsvolle Aussagen werden nicht harmonisiert oder über die Vorlage hinaus ergänzt.
