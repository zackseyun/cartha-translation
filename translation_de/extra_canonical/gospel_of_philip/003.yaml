translation:
  language: de
  text: 'Die Namen, die den Weltlichen gegeben werden, sind sehr trügerisch; denn sie lenken das Herz vom Richtigen zum Unrichtigen. Wer »Gott« hört, denkt nicht an das Richtige, sondern an das Unrichtige. Ebenso ist es mit »dem Vater«, »dem Sohn«, »dem Heiligen Geist«, »dem Leben«, »dem Licht«, »der Auferstehung«, »der Gemeinde« und all den anderen: Sie denken nicht an [das Richtige], sondern an das [Unrichtige], [es sei denn,] sie haben das Richtige kennengelernt. Die [Namen, die gehört wurden,] gibt es in der Welt […] [sie täuschen. Wenn es sie] im Äon[a] [gäbe], wären sie weder als Namen in der Welt gebraucht noch unter die weltlichen Dinge eingeordnet worden. Im Äon finden sie ihr Ende.


    Es gibt einen Namen, der in der Welt nicht ausgesprochen wird: den Namen, den der Vater dem Sohn gab. Er ist über alles erhaben; er ist der Name des Vaters. Denn der Sohn wäre nicht Vater geworden, wenn er nicht den Namen des Vaters angenommen hätte. Die diesen Namen haben, kennen ihn, sprechen ihn aber nicht aus; und die ihn nicht haben, kennen ihn nicht. Doch die Wahrheit brachte für uns Namen in die Welt, weil es uns ohne diese Namen unmöglich ist, sie – die Wahrheit – kennenzulernen. Es gibt nur eine Wahrheit, doch für uns ist sie vieles, damit sie durch vieles in Liebe dieses Eine lehrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Äon« bezeichnet hier das jenseitige beziehungsweise ewige Zeitalter. Die genaue kosmologische Bedeutung bleibt offen.
    reason: Der Fachausdruck wahrt die Mehrdeutigkeit besser als eine eindeutige Wiedergabe mit »Ewigkeit«.
lexical_decisions:
- source_word: worldly / world
  choice: weltlich / Welt
  rationale: Bewahrt den wiederkehrenden Gegensatz zwischen der gegenwärtigen Weltordnung und dem Äon, ohne ihn konfessionell auszudeuten.
- source_word: what's right / what's not right
  choice: das Richtige / das Unrichtige
  rationale: Erhält die abstrakte, wiederholte Gegenüberstellung des Zeugnisses. Eine Wiedergabe mit »Wirklichkeit« oder »Wahrheit« würde die Begriffe stärker harmonisieren, als die Vorlage erlaubt.
- source_word: (eternal) age
  choice: Äon
  rationale: Der religionsgeschichtlich geprägte Ausdruck wahrt die mögliche Bedeutung eines jenseitigen beziehungsweise ewigen Zeitalters, ohne bloß »Ewigkeit« einzusetzen.
- source_word: church
  choice: Gemeinde
  rationale: Natürliches modernes Deutsch mit breiter Bedeutung; vermeidet die mögliche institutionelle Verengung von »Kirche«.
- source_word: learn / know
  choice: kennenlernen / kennen
  rationale: Unterscheidet den Vorgang des Erkennens von vorhandenem Wissen in idiomatischem Deutsch.
- source_word: many things / one thing
  choice: vieles / dieses Eine
  rationale: Bewahrt das philosophische Wortspiel von Einheit und Vielheit und macht den Bezug im Schlusssatz verständlich.
theological_decisions:
- issue: Der Sohn wird »Vater«
  choice: »der Sohn wäre nicht Vater geworden«
  alternative: Den Satz auf Gott den Vater beziehen oder als bloße Titelübertragung umformulieren
  rationale: Die auffällige theologische Aussage wird entsprechend dem vorliegenden Zeugnis bewahrt und nicht durch eine trinitarische Harmonisierung entschärft.
- issue: Unaussprechlicher Name
  choice: Der Name wird als zugleich besessen, erkannt und nicht ausgesprochen dargestellt.
  alternative: »Name« ausdrücklich als Wesen, Vollmacht oder Offenbarung deuten
  rationale: Die Vorlage lässt die genaue Bedeutung des Namens offen; die Übersetzung fügt keine bestimmte sakramentale oder metaphysische Lehre ein.
- issue: Wahrheit als eine und viele
  choice: »Es gibt nur eine Wahrheit, doch für uns ist sie vieles«
  alternative: »Die eine Wahrheit erscheint in vielen Formen«
  rationale: Die spannungsreiche Aussage bleibt bestehen, statt durch eine erklärende Paraphrase aufgelöst zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Wiederholung. Eckige Klammern und Auslassungspunkte kennzeichnen wie in der gelieferten Textgrundlage ergänzten beziehungsweise beschädigten Text. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung als quellennahe, vorläufige Übersetzung auf Grundlage des angegebenen englischen Zeugnisses zu behandeln.
