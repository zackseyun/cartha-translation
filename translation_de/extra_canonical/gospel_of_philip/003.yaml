review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die wiederholte Gegenüberstellung von »richtig« und »nicht richtig« sowie die auffälligen Aussagen über Vater, Sohn, Namen und Wahrheit. Eine Klammer wurde jedoch ohne Entsprechung im Zeugen um das deutsche Konditionalverb ergänzt; dies verwischt die dort markierte Grenze zwischen ergänztem und unergänztem Text. Die direkte Prüfung am koptischen Text steht weiterhin aus.
  naturalness: Modernes Standarddeutsch, überwiegend klar und dem reflektierenden Register angemessen. »Im Äon haben sie ein Ende« gibt die knappe Aussage des Zeugen unmittelbarer wieder als »finden sie ihr Ende«.
  terminology: »Welt/Weltliche«, »das Richtige/das Unrichtige«, »Äon«, »Vater«, »Sohn«, »Heiliger Geist« und »Wahrheit« sind konsistent und ohne konfessionelle Harmonisierung wiedergegeben. Die Fußnote zu »Äon« wahrt sinnvoll die semantische Offenheit.
  issues:
  - severity: medium
    issue: Nicht gedeckte eckige Klammer um »gäbe«
    rationale: Der englische Zeuge markiert »[deceive. If they existed] in the (eternal) age« als Ergänzung nur bis einschließlich »existed«. Die zusätzliche Klammerung von »[gäbe]« erweitert die Markierung von restauriertem Text über die Vorlage hinaus.
  - severity: low
    issue: Wiedergabe von »They have an end in the (eternal) age«
    rationale: »Im Äon finden sie ihr Ende« ist verständlich, kann aber stärker nach Untergang klingen. »Im Äon haben sie ein Ende« bildet die knappe, sachliche Formulierung des Zeugen unmittelbarer nach.
