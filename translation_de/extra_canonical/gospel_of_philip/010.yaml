  naturalness: 'Modernes Standarddeutsch und der würdige, bewusst rätselhafte Registerton sind weitgehend gelungen. „Der Heilige Geist weidet alle“ ist jedoch im Deutschen missverständlich: Es bedeutet vorrangig, dass er alle grasen lässt, statt dass er sie als Hirt betreut. „hütet alle“ bewahrt das Hirtenbild und ist idiomatischer.'
  terminology: Die wiederkehrende Wiedergabe von submit/submissive durch „sich unterordnen“ ist konsistent. „Mächte“ erhält den möglichen personal-kosmologischen Sinn. Die Schlussmaxime wird zu Recht nicht konfessionell oder sexuell verengt. Die Fußnoten markieren Beschädigung, die ungewöhnliche Kain-Aussage und die Mehrdeutigkeit von „Verbindung“ sachgerecht.
