base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: de
  text: 'Einige Tiere ordnen sich dem Menschen unter, etwa das Kalb, der Esel und andere dieser Art. Andere ordnen sich nicht unter und leben allein in der Wildnis. Der Mensch pflügt das Feld mit den Tieren, die sich unterordnen, und ernährt dadurch sich selbst und die Tiere – ob sie sich unterordnen oder nicht. Ebenso ist es mit dem vollkommenen Menschen: Er pflügt mit den Mächten, die sich unterordnen, und bereitet für alle vor, die ins Dasein treten werden. Deshalb besteht der ganze Ort – das Gute wie das Böse, die Rechte wie die Linke. Der Heilige Geist weidet alle und herrscht über sämtliche Mächte: über die, die sich unterordnen, über die, die sich [nicht unterordnen], und über die, die allein sind. Denn wahrhaftig: Er […] hält sie fest, [sodass sie, selbst wenn sie …] wollen, nicht [fortgehen] können.[a]


    [Derjenige, der] geformt [wurde, ist schön; doch] man würde feststellen, dass seine Kinder edle Gestalten sind. Wäre er nicht geformt, sondern gezeugt worden, würde man feststellen, dass sein Same edel war. Nun aber wurde er geformt und zeugte. Was ist das für ein Adel? Zuerst geschah Ehebruch und danach Mord. Er – Kain – wurde im Ehebruch gezeugt, denn er war der Sohn der Schlange.[b] Deshalb wurde auch er zum Mörder wie sein Vater und tötete seinen Bruder Abel. Jede Verbindung zwischen Ungleichartigen ist Ehebruch.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern und Auslassungspunkte kennzeichnen beschädigten Text und unsichere Ergänzungen. Der genaue Wortlaut und teilweise auch der Satzbau bleiben ungewiss.
    reason: Die Handschrift ist an dieser Stelle lückenhaft; die Übersetzung darf die Rekonstruktion nicht als sicheren Text ausgeben.
  - marker: b
    text: Die Aussage, Kain sei „der Sohn der Schlange“, gibt die eigenständige Deutung dieses Textes wieder; sie steht so nicht im Wortlaut der Genesis.
    reason: Verhindert eine unbemerkte Harmonisierung mit der kanonischen Erzählung, ohne die Aussage konfessionell zu bewerten.
  - marker: c
    text: „Verbindung“ kann hier eine Vereinigung, Gemeinschaft oder Partnerschaft bezeichnen. Was genau mit den „Ungleichartigen“ gemeint ist, lässt der erhaltene Abschnitt offen.
    reason: Markiert eine echte lexikalische und theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: submit / submissive
  choice: sich unterordnen / die sich unterordnen
  rationale: Bewahrt das wiederkehrende Motiv freiwilliger oder tatsächlicher Unterordnung und vermeidet das stärker wertende „gehorsam“.
- source_word: perfect human
  choice: der vollkommene Mensch
  rationale: Gibt die anthropologische und möglicherweise soteriologische Fachformel würdevoll und ohne zusätzliche Auslegung wieder.
- source_word: powers
  choice: Mächte
  rationale: „Mächte“ erhält den möglichen geistigen bzw. kosmologischen Sinn; „Kräfte“ wäre allgemeiner, könnte aber den personalen Zug abschwächen.
- source_word: the whole place stands
  choice: der ganze Ort besteht
  rationale: Die rätselhafte räumlich-kosmologische Aussage bleibt bewusst offen; sie wird nicht zu „die ganze Welt“ normalisiert.
- source_word: shepherds
  choice: weidet
  rationale: Bewahrt das Hirtenbild des Zeugnisses; „hütet“ wäre idiomatischer, aber weniger eng an der Bildhandlung.
- source_word: formed / forms
  choice: geformt / Gestalten
  rationale: Erhält das Wortspiel soweit im Deutschen möglich, ohne „Formen“ bei den Kindern unnatürlich klingen zu lassen.
- source_word: begotten / begot
  choice: gezeugt / zeugte
  rationale: Bewahrt den deutlichen Gegensatz zwischen Formen und Zeugen.
- source_word: seed
  choice: Same
  rationale: Erhält die Mehrdeutigkeit von Abstammung, Nachkommenschaft und Zeugung.
- source_word: partnership
  choice: Verbindung
  rationale: Deckt eine Beziehung oder Vereinigung ab, ohne sie vorschnell als Ehe, Geschlechtsverkehr oder bloße Zusammenarbeit festzulegen.
- source_word: dissimilar
  choice: Ungleichartige
  rationale: Bewahrt die ontologische oder kategoriale Spannung stärker als das bloße „Verschiedene“.
theological_decisions:
- issue: Pronomen für den vollkommenen Menschen
  choice: Singular „Er“ als generisches Pronomen
  alternative: Pluralisches oder geschlechtsneutrales Umschreiben
  rationale: Das Zeugnis spricht von einer einzelnen exemplarischen menschlichen Gestalt. Die deutsche Form soll keine zusätzliche Geschlechterlehre eintragen.
- issue: Herrschaft des Heiligen Geistes über gute und böse Mächte
  choice: Die umfassende Aussage unverändert stehen lassen
  alternative: Die Herrschaft auf gute oder untergeordnete Mächte einschränken
  rationale: Der Text schließt ausdrücklich untergeordnete, nicht untergeordnete und allein lebende Mächte ein; die theologische Spannung darf nicht geglättet werden.
- issue: Kain als Sohn der Schlange
  choice: Als Behauptung des Textes direkt wiedergegeben
  alternative: Metaphorisch erklären oder mit Genesis harmonisieren
  rationale: Die ungewöhnliche Abstammungsaussage gehört zum theologischen Profil des Werkes und wird weder bestätigt noch harmonisierend umgedeutet.
- issue: Ehebruch als Verbindung Ungleichartiger
  choice: Die abschließende Maxime formal bewahrt
  alternative: Auf sexuelle Untreue oder bestimmte kosmologische Gruppen festlegen
  rationale: Der unmittelbare Sinnbereich ist absichtlich weit und möglicherweise kosmologisch; eine engere Deutung wäre nicht textlich abgesichert.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener Bildlichkeit und Rätselhaftigkeit. Wiederholungen wie „sich unterordnen“, „geformt“ und „gezeugt“ wurden beibehalten, weil sie die Argumentation tragen. Der Entwurf ist vorläufig, da keine direkte Prüfung des koptischen Textes vorliegt und die angegebene Grundlage ein englisches gemeinfreies Zeugnis ist.
