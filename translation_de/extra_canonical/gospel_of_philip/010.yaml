  - severity: medium
    issue: „weidet alle“ für „shepherds everyone“
    rationale: Die deutsche Konstruktion bezeichnet gewöhnlich das Weidenlassen von Tieren und kann den Heiligen Geist semantisch zumjenigen machen, der andere grasen lässt. „hütet alle“ ist die natürliche deutsche Wiedergabe der Hirtenmetapher und wahrt die Aussage.
