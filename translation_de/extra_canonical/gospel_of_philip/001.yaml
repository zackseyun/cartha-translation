    reason: Die englische Formulierung ist für einen antiken Kontext auffällig und darf ohne direkte koptische Prüfung nicht stillschweigend normalisiert werden.
lexical_decisions:
- source_word: Hebrew
  choice: Hebräer
  rationale: Bewahrt die im Abschnitt ausdrücklich verwendete religiös-ethnische Bezeichnung und ihre Gegenüberstellung zu Proselyten, Nichtjuden und Christen.
- source_word: proselyte
  choice: Proselyt
  rationale: Der etablierte deutsche Fachausdruck erhält den Gedanken eines zum Judentum Übergetretenen, ohne ihn im Haupttext auszudeuten.
- source_word: creates
  choice: bringt … hervor
  rationale: Gibt die wiederholte Hervorbringungsmetaphorik natürlicher wieder als »erschafft«, ohne festzulegen, ob Zeugung, Bekehrung oder geistliche Bildung gemeint ist.
- source_word: slave
  choice: Sklave
  rationale: Folgt dem vorgelegten Quellenzeugnis statt der abgeschwächten Wiedergabe »Diener« in der englischen POB-Schicht und erhält den Gegensatz zwischen Sklave und Sohn.
- source_word: gentile
  choice: Nichtjude
  rationale: Ist im modernen Standarddeutsch verständlich und neutraler als »Heide«; der Bezug wird als Zugehörigkeitskategorie und nicht als abwertendes Urteil wiedergegeben.
- source_word: gentrified
  choice: aufgewertet
  rationale: Bildet die ungewöhnliche Formulierung des vorgelegten englischen Zeugnisses möglichst knapp ab; wegen der noch ausstehenden koptischen Prüfung wird die Unsicherheit in einer Fußnote offengelegt.
theological_decisions:
- issue: Erben der Lebenden und der Toten
  choice: Die paradoxen Formulierungen bleiben wörtlich und unaufgelöst stehen.
  alternative: Eine geistliche Deutung auf Erlöste und Unerlöste ausdrücklich in den Text eintragen.
  rationale: Der Abschnitt arbeitet bewusst mit theologischer Spannung und Wortspiel; eine konfessionelle oder systematische Erklärung wäre nicht durch die vorgelegte Grundlage gesichert.
- issue: Leben und Todesgefahr nach dem Kommen Christi
  choice: »ist lebendig geworden und läuft Gefahr zu sterben«
  alternative: »hat das ewige Leben und kann nicht sterben«
  rationale: Die scheinbare Spannung des Zeugnisses wird bewahrt und nicht durch eine dogmatische Harmonisierung beseitigt.
- issue: Vater und Mutter der Christen
  choice: Die Elternmetaphorik bleibt ohne Identifizierung.
  alternative: Vater und Mutter ausdrücklich mit bestimmten göttlichen, kirchlichen oder sakramentalen Größen gleichsetzen.
  rationale: Der Ausschnitt selbst nennt keine eindeutigen Bezugsgrößen; eine Festlegung würde eine private oder konfessionelle Auslegung importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Die wiederholten Leitwörter »hervorbringen«, »erben«, »tot« und »lebendig« wurden zur Erhaltung der argumentativen und rhetorischen Struktur konsequent wiederholt. Generisches Maskulinum wurde dort beibehalten, wo die Bildsprache ausdrücklich mit Sklave, Sohn, Herr und Vater arbeitet. Der Entwurf bleibt wegen der ausstehenden direkten Prüfung des koptischen Textes vorläufig.
