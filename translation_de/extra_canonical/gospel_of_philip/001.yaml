review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bewahrt die Gliederung, die Textlücken und die bewusst paradoxen Aussagen weitgehend zuverlässig. Einige Formulierungen verschieben jedoch den vorgelegten Wortlaut: Besonders »ist lebendig geworden« ersetzt das Perfekt »has lived«, und »sodass er sterben könnte« schwächt die finale Wendung »in order that they may die« ab. Die Deutung von »gentrified« als »aufgewertet« ist zu bestimmt, solange der koptische Befund noch nicht geprüft ist.'
  naturalness: Das Deutsch ist überwiegend klar und würdig. »hat gelebt und ist in Gefahr zu sterben« wirkt absichtlich spannungsvoll, ist aber als getreue Wiedergabe der Vorlage verständlich. Die mit Anführungszeichen markierte vorläufige Übernahme »gentrifiziert« vermeidet eine ungesicherte, glättende Deutung; die Fußnote erläutert sie.
  terminology: »Hebräer«, »Proselyt«, »Sklave«, »Nichtjude«, »Wahrheit« und »Christus« sind sachgerecht. »Sklave« folgt dem Quellenzeugen gegenüber dem englischen POB-Auditwort »servant«. Die Elternmetaphorik und die Erbparadoxien bleiben ohne konfessionelle Ausdeutung erhalten.
  issues:
  - severity: medium
    issue: »ist lebendig geworden« für »has lived«
    rationale: Die deutsche Formulierung trägt einen nicht ausdrücklich vorhandenen Eintritt in einen neuen Zustand ein. Das englische Zeugnis sagt wörtlich, die Person »has lived«, und stellt dies anschließend mit der gegenwärtigen Lebendigkeit seit Christi Kommen in Beziehung.
  - severity: medium
    issue: »sodass er sterben könnte« für »in order that they may die«
    rationale: »Sodass« legt eher eine Folge nahe; die Vorlage hat eine finale Konstruktion. »um sterben zu können« gibt diese Funktion genauer wieder.
  - severity: medium
    issue: »aufgewertet« legt »gentrified« einseitig aus
    rationale: Die vorgelegte englische Lesart ist ungewöhnlich und der koptische Text ist noch nicht direkt geprüft. »Aufgewertet« entscheidet sich bereits für eine positive Modernisierungsdeutung. Eine markierte vorläufige Lehnübernahme wahrt die Unsicherheit besser.
  - severity: low
    issue: »Proselyten« pluralisiert die in Anführungszeichen stehende Bezeichnung
    rationale: Der Zeuge verbindet ein ergänztes Pluralwort »[those]« mit der Singularbezeichnung »a proselyte«. Die deutsche Formulierung kann die Personen im Plural nennen und die zitierte Kategorie im Singular belassen.
  revised_text: 'Ein Hebräer bringt einen Hebräer hervor, und [solche] nennt man »Proselyt«. Doch ein [Proselyt] bringt keinen weiteren Proselyten hervor. Sie sind wie […] und bringen andere hervor […]; ihnen genügt es, ins Dasein zu kommen.[a]



    Der Sklave sucht nur die Freiheit; er sucht nicht den Besitz seines Herrn. Der Sohn aber ist nicht bloß ein Sohn; er beansprucht das Erbe seines Vaters für sich. Diejenigen, die die Toten erben, sind selbst tot, und sie erben die Toten. Diejenigen, die die Lebenden erben, sind selbst lebendig, und sie erben sowohl die Lebenden als auch die Toten. Die Toten können nichts erben; denn wie könnten die Toten erben? Wenn ein Toter einen Lebenden erbt, wird er nicht sterben; vielmehr wird der Tote umso mehr leben! Ein Nichtjude stirbt nicht, denn er hat nie gelebt, um sterben zu können. Wer an die Wahrheit geglaubt hat, hat gelebt und ist in Gefahr zu sterben, denn seit dem Tag, an dem Christus kam, lebt er. Die Welt wird erschaffen, die Städte werden »gentrifiziert«,[b] und die Toten werden hinausgetragen.



    Als wir Hebräer waren, waren wir vaterlos – wir hatten nur unsere Mutter. Als wir aber Christen wurden, erhielten wir Vater und Mutter.'
