translation:
  language: de
  text: 'Ein Hebräer bringt einen Hebräer hervor, und [Menschen] dieser Art nennt man »Proselyten«. Doch ein [Proselyt] bringt keinen weiteren Proselyten hervor. Sie sind wie […] und bringen andere hervor […]; ihnen genügt es, ins Dasein zu kommen.[a]


    Der Sklave sucht nur die Freiheit; er verlangt nicht nach dem Besitz seines Herrn. Der Sohn aber ist nicht bloß ein Sohn; er beansprucht das Erbe seines Vaters für sich. Diejenigen, die die Toten erben, sind selbst tot, und sie erben die Toten. Diejenigen, die die Lebenden erben, sind selbst lebendig, und sie erben sowohl die Lebenden als auch die Toten. Die Toten können nichts erben; denn wie könnten die Toten erben? Wenn der Tote den Lebenden erbt, wird er nicht sterben; vielmehr wird der Tote umso mehr leben! Ein Nichtjude stirbt nicht, denn er hat nie gelebt, sodass er sterben könnte. Wer an die Wahrheit geglaubt hat, ist lebendig geworden und läuft Gefahr zu sterben, denn seit dem Tag, an dem Christus kam, ist er lebendig. Die Welt wird erschaffen, die Städte werden aufgewertet,[b] und die Toten werden hinausgetragen.


    Als wir Hebräer waren, waren wir vaterlos – wir hatten nur unsere Mutter. Als wir aber Christen wurden, bekamen wir Vater und Mutter.'
  philosophy: optimal-equivalence
