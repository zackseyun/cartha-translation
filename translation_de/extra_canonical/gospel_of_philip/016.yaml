translation:
  language: de
  text: 'Die Welt wird durch vier Dinge bestellt. Durch Wasser, Erde, Wind und Licht bringt man die Ernte in die Scheunen. Ebenso bestellt auch Gott durch vier Dinge: durch Glauben, Hoffnung, Liebe und Erkenntnis. Unsere Erde ist der Glaube, in dem wir verwurzelt sind. [Und] das [Wasser] ist die Hoffnung, durch die [wir] genährt werden. Der Wind ist die Liebe, durch die wir wachsen. Und das Licht [ist] die Erkenntnis, durch die wir [reifen]. Die Gnade gibt es in [vier Arten. Sie ist] irdisch, sie ist [himmlisch, …] der Himmel des Himmels […] durch […].[a]


    Selig ist, wer keine […] Seele hat. Dieser ist Jesus Christus. Er zog überall umher und fiel niemandem zur Last. Selig ist also, wer so ist; ein solcher Mensch ist vollkommen. Denn das Wort sagt uns, wie schwer es ist, dies durchzuhalten. Wie werden wir etwas so Großes vollbringen können? Wie wird er allen Ruhe schenken? Vor allem darf man niemandem Kummer bereiten – weder einem Großen noch einem Kleinen, weder einem Ungläubigen noch einem Gläubigen – und dann denen Ruhe schenken, die unter den Wohlhabenden schon Ruhe haben. Manche ziehen Nutzen daraus, dem Wohlhabenden Ruhe zu schenken. Wer Gutes tut, kann ihnen keine Ruhe schenken, denn er kann nicht einfach tun, was er will. Er kann keinen Kummer bereiten, weil er niemanden bedrängen kann; doch bisweilen bereitet ihm der Wohlhabende Kummer. Nicht er ist so, vielmehr bereitet den Wohlhabenden dessen eigenes Böses Kummer. Wer das Wesen des vollkommenen Menschen hat, macht dem Guten Freude; manche aber betrüben sich darüber sehr.


    Ein Hausherr hatte alles erworben: Kinder und Sklaven, Rinder, Hunde und Schweine, Weizen [und] Gerste, Stroh und Heu, […] Fleisch und Eicheln. [Doch er war] weise und wusste, womit er jeden [füttern] musste. Den Kindern setzte er Brot vor […], den Sklaven aber gab er […]. Den Rindern [warf er Gerste] hin sowie Stroh und Heu. Den Hunden warf er Knochen [hin], den Schweinen Eicheln und Spültrank. So ist es auch mit dem Jünger Gottes. Wenn er weise ist, versteht er, was es bedeutet, ein Jünger zu sein. Die körperlichen Gestalten werden ihn nicht täuschen; vielmehr wird er den Zustand der Seele jedes Einzelnen betrachten und entsprechend mit ihm reden. In der Welt gibt es viele Tiere, die Menschengestalt haben. Der Jünger erkennt sie. Den Schweinen wird er Eicheln hinwerfen, den Rindern Gerste mit Stroh und Heu, den Hunden Knochen. Den Sklaven wird er die Vorspeise geben, den Kindern aber die vollkommene Speise.[b]


    Es gibt den Menschensohn, und es gibt den Sohn des Menschensohnes. Der Herr ist der Menschensohn; der Sohn des Menschensohnes aber ist derjenige, der durch den Menschensohn erschafft. Der Menschensohn empfing von Gott die Fähigkeit zu erschaffen. Er besitzt auch die Fähigkeit zu zeugen. Wer die Fähigkeit zu erschaffen empfing, ist ein Geschöpf; wer die Fähigkeit zu zeugen empfing, ist gezeugt. Wer erschafft, kann nicht zeugen; wer zeugt, kann erschaffen. Man sagt: „Wer erschafft, zeugt.“ Doch was er zeugt, ist ein Geschöpf. [Darum] sind seine Gezeugten nicht seine Kinder, sondern sie sind […]. Wer erschafft, wirkt [öffentlich] und wird selbst [offenbar]. Wer zeugt, zeugt [im Verborgenen], und seine Kinder sind verborgen […] das Bild. [Wiederum:] Wer [erschafft, erschafft] öffentlich; wer aber zeugt, [zeugt] Kinder im Verborgenen.[c]


    [Niemand wird erkennen können], wann [der Mann] und die Frau miteinander verkehren, außer ihnen selbst; denn die Ehe der Welt ist für die Verheirateten ein Geheimnis. Wenn schon die befleckte Ehe verborgen ist, wie viel mehr ist die unbefleckte Ehe ein wahres Geheimnis! Sie ist nicht fleischlich, sondern rein. Sie entspringt nicht der Begierde, sondern dem Willen. Sie gehört nicht zur Finsternis oder zur Nacht, sondern zum Tag und zum Licht. Wird eine Ehe entblößt, wird sie zur Unzucht – nicht nur dann, wenn die Braut den Samen eines anderen Mannes empfängt; selbst wenn sie das Gemach verlässt und gesehen wird, begeht sie Ehebruch. Sie soll sich ihrem Vater, ihrer Mutter, dem Brautführer und den Kindern des Bräutigams zeigen. Sie dürfen jeden Tag in das Brautgemach eintreten. Die anderen aber sollen sich danach sehnen, auch nur ihre Stimme zu hören und sich an ihrem Duft zu erfreuen; wie Hunde sollen sie die Krümel fressen, die vom Tisch fallen. Bräutigame und Bräute gehören in das Brautgemach.
    Niemand wird den Bräutigam und die Braut sehen können, wenn er nicht [so wird wie] sie.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eckige Klammern markieren ergänzten oder unsicher rekonstruierten Text; […] bezeichnet eine Lücke im erhaltenen Manuskript. Der gesamte Abschnitt ist vorläufig anhand des angegebenen englischen Textzeugen übersetzt; eine direkte Prüfung des koptischen Textes steht noch aus.
    reason: Die Überlieferung ist mehrfach beschädigt, und die vorliegende Arbeitsgrundlage ist keine direkte koptische Edition.
  - marker: b
    text: Die Abstufung von Tierfutter, Vorspeise und „vollkommener Speise“ bildet unterschiedliche Arten geistlicher Unterweisung ab. Die drastische Gleichsetzung mancher Menschen mit Tieren bleibt dabei bewusst unausgelegt.
    reason: Die Metapher ist theologisch und anthropologisch aufgeladen, aber im Text nicht eindeutig erklärt.
  - marker: c
    text: Die Unterscheidung zwischen „erschaffen“ und „zeugen“ ist im überlieferten Wortlaut teilweise beschädigt und wirkt stellenweise paradox. Sie wird hier nicht harmonisiert.
    reason: Bewahrt die echte Spannung und Unsicherheit der Passage.
  - marker: d
    text: 'Wörtlich sinngemäß: „wenn sie nicht solche werden“. Der Bezug kann auf Bräutigam und Braut beziehungsweise auf Menschen ihrer Art weisen.'
    reason: Das Pronomen und der Vergleich sind mehrdeutig; die Ergänzung im Haupttext macht den deutschen Satz lesbar, ohne die Unsicherheit ganz aufzuheben.
lexical_decisions:
- source_word: Son of Humanity
  choice: Menschensohn
  rationale: Bewahrt den traditionellen, theologisch offenen Titel und zugleich das Wortspiel mit dem „Sohn des Menschensohnes“.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Passt zum religiös-spirituellen Zusammenhang besser als das rein sachliche „Wissen“, ohne eine bestimmte gnostische Deutung festzuschreiben.
- source_word: farms / farmed
  choice: bestellt / wird bestellt
  rationale: Die landwirtschaftliche Metapher wird idiomatisch erhalten; „bewirtschaften“ wäre sachlicher, aber weniger bildkräftig.
- source_word: give rest
  choice: Ruhe schenken
  rationale: Bewahrt die mögliche geistliche wie soziale Bedeutung des Ausdrucks und glättet sie nicht zu „trösten“ oder „entlasten“.
- source_word: slave
  choice: Sklave
  rationale: Gibt die antike soziale Kategorie deutlich wieder; „Diener“ würde das Machtverhältnis abschwächen.
- source_word: bridal chamber
  choice: Brautgemach
  rationale: Bewahrt das wiederkehrende symbolische Motiv und klingt würdig, ohne es dogmatisch auszudeuten.
- source_word: pornography
  choice: Unzucht
  rationale: Der moderne Begriff „Pornografie“ wäre in diesem antiken metaphorischen Kontext anachronistisch eng; „Unzucht“ wahrt öffentliche sexuelle Entblößung und moralische Verfehlung als Bedeutungsfeld.
theological_decisions:
- issue: Verhältnis von Erschaffen und Zeugen
  choice: Die widersprüchlich oder paradox wirkenden Aussagen bleiben wörtlich nebeneinander stehen.
  alternative: Die Passage christologisch oder kosmologisch harmonisieren.
  rationale: Der Text entfaltet bewusst eine Spannung zwischen Geschöpf, Gezeugtem, Schöpfer und Zeugendem; eine Auflösung wäre interpretierend.
- issue: Tiergestalten in Menschengestalt
  choice: Die anstößige anthropologische Bildrede wird unverändert wiedergegeben.
  alternative: Sie als bloße Charaktertypen abschwächen.
  rationale: Der Ausgangstext formuliert scharf; die Übersetzung darf seine mögliche Polemik nicht verbergen oder entschärfen.
- issue: Unbefleckte Ehe und Brautgemach
  choice: Die konkrete Ehebildsprache bleibt stehen, ohne sie ausdrücklich sakramental, asketisch oder mystisch zu bestimmen.
  alternative: Das Brautgemach als festes Ritual oder ausschließlich geistliche Vereinigung erklären.
  rationale: Der Text lässt das Verhältnis zwischen realer Ehe und symbolischer Wirklichkeit offen.
- issue: Jesus als derjenige, der keine […] Seele hat
  choice: Die beschädigte und theologisch schwierige Aussage wird mit der Lücke bewahrt.
  alternative: Die Lücke ergänzen oder die Aussage christologisch korrigieren.
  rationale: Eine Ergänzung könnte den Sinn grundlegend verändern und wäre ohne direkte koptische Prüfung nicht vertretbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Wiederholungen und zentrale Bildwörter bleiben erhalten. Generisches Maskulinum wird dort verwendet, wo die Einzelgestalt des Jüngers oder Menschen für den Gedankengang wichtig ist; keine konfessionelle Terminologie wurde ergänzt. Wegen der noch ausstehenden direkten koptischen Quellenprüfung ist der Entwurf ausdrücklich vorläufig.
