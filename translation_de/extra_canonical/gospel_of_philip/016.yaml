review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bewahrt weitgehend die Bildsprache, die Schäden des Textzeugen sowie die paradoxe Unterscheidung von Erschaffen und Zeugen. Eine sichere Korrektur ist jedoch bei „pornography“ nötig: „Unzucht“ verschiebt den ausdrücklich benannten Begriff zu allgemein. Zudem glättet „seine Kinder sind verborgen“ ein mehrdeutiges Pronomen interpretierend.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Einige Bezugnahmen im Abschnitt über das Ruhegeben werden durch die Singularisierung unnötig festgelegt; eine pluralische Formulierung bewahrt die schwierige Vorlage klarer.
  terminology: „Menschensohn“, „Erkenntnis“, „Sklaven“ und „Brautgemach“ sind treffend. „Pornografie“ ist trotz seines modernen Klangs als direkte Wiedergabe des englischen Arbeitszeugens vorzuziehen; der anachronistische bzw. rhetorische Charakter ist nicht durch eine andere Bedeutung zu ersetzen.
  issues:
  - severity: high
    issue: „wird sie zur Unzucht“ für „it becomes pornography“
    rationale: „Unzucht“ bezeichnet allgemein sexuelle Verfehlung, während der Textzeuge ausdrücklich die öffentliche Entblößung als „pornography“ benennt. Die Ersetzung verändert die Aussage und darf nicht durch eine vermutete antike Angemessenheit begründet werden.
  - severity: medium
    issue: „Nicht er ist so“ und die folgende Singularisierung
    rationale: Die Vorlage hat an dieser Stelle mehrdeutige pluralische Bezugnahmen. Die deutsche Singularform legt den Bezug auf eine bestimmte Person fest und sollte vermieden werden.
  - severity: medium
    issue: „seine Kinder sind verborgen“ im Abschnitt über Zeugen
    rationale: Die Vorlage lautet mehrdeutig „they’re hidden […] the image“ und nennt dort nicht ausdrücklich Kinder. Die Ergänzung „seine Kinder“ ist nicht durch den Textzeugen gedeckt.
  - severity: low
    issue: Fußnote b deutet die Futterfolge als abgestufte geistliche Unterweisung aus
    rationale: Die Passage kann dies nahelegen, erklärt die konkrete Zuordnung aber nicht. Die Anmerkung sollte die Bildfolge beschreiben, ohne ihre theologische Funktion festzulegen.
  revised_text: 'Die Welt wird durch vier Dinge bestellt. Durch Wasser, Erde, Wind und Licht bringt man die Ernte in die Scheunen. Ebenso bestellt auch Gott durch vier Dinge: durch Glauben, Hoffnung, Liebe und Erkenntnis. Unsere Erde ist der Glaube, in dem wir verwurzelt sind. [Und] das [Wasser] ist die Hoffnung, durch die [wir] genährt werden. Der Wind ist die Liebe, durch die wir wachsen. Und das Licht [ist] die Erkenntnis, durch die wir [reifen]. Die Gnade gibt es in [vier Arten. Sie ist] irdisch, sie ist [himmlisch, …] der Himmel des Himmels […] durch […].[a]



    Selig ist, wer keine […] Seele hat. Dieser ist Jesus Christus. Er zog überall umher und fiel niemandem zur Last. Selig ist also, wer so ist; ein solcher Mensch ist vollkommen. Denn das Wort sagt uns, wie schwer es ist, dies durchzuhalten. Wie werden wir etwas so Großes vollbringen können? Wie wird er allen Ruhe schenken? Vor allem darf man niemandem Kummer bereiten – weder einem Großen noch einem Kleinen, weder einem Ungläubigen noch einem Gläubigen – und dann denen Ruhe schenken, die unter den Wohlhabenden schon Ruhe haben. Manche ziehen Nutzen daraus, dem Wohlhabenden Ruhe zu schenken. Wer Gutes tut, kann ihnen keine Ruhe schenken, denn sie können nicht einfach tun, was sie wollen. Sie können keinen Kummer bereiten, weil sie niemanden bedrängen können; doch bisweilen bereitet ihnen der Wohlhabende Kummer. Sie sind nicht so; vielmehr bereitet ihnen ihr eigenes Böses Kummer. Wer das Wesen des vollkommenen Menschen hat, macht dem Guten Freude; manche aber betrüben sich darüber sehr.



    Ein Hausherr hatte alles erworben: Kinder und Sklaven, Rinder, Hunde und Schweine, Weizen [und] Gerste, Stroh und Heu, […] Fleisch und Eicheln. [Doch er war] weise und wusste, womit er jeden [füttern] musste. Den Kindern setzte er Brot vor […], den Sklaven aber gab er […]. Den Rindern [warf er Gerste] hin sowie Stroh und Heu. Den Hunden warf er Knochen [hin], den Schweinen Eicheln und Spültrank. So ist es auch mit dem Jünger Gottes. Wenn er weise ist, versteht er, was es bedeutet, ein Jünger zu sein. Die körperlichen Gestalten werden ihn nicht täuschen; vielmehr wird er den Zustand der Seele jedes Einzelnen betrachten und entsprechend mit ihm reden. In der Welt gibt es viele Tiere, die Menschengestalt haben. Der Jünger erkennt sie. Den Schweinen wird er Eicheln hinwerfen, den Rindern Gerste mit Stroh und Heu, den Hunden Knochen. Den Sklaven wird er die Vorspeise geben, den Kindern aber die vollkommene (Speise).[b]



    Es gibt den Menschensohn, und es gibt den Sohn des Menschensohnes. Der Herr ist der Menschensohn; der Sohn des Menschensohnes aber ist derjenige, der durch den Menschensohn erschafft. Der Menschensohn empfing von Gott die Fähigkeit zu erschaffen. Er besitzt auch die Fähigkeit zu zeugen. Wer die Fähigkeit zu erschaffen empfing, ist ein Geschöpf; wer die Fähigkeit zu zeugen empfing, ist gezeugt. Wer erschafft, kann nicht zeugen; wer zeugt, kann erschaffen. Man sagt: „Wer erschafft, zeugt.“ Doch was er zeugt, ist ein Geschöpf. [Darum] sind seine Gezeugten nicht seine Kinder, sondern sie sind […]. Wer erschafft, wirkt [öffentlich] und wird selbst [offenbar]. Wer zeugt, zeugt [im Verborgenen] und ist verborgen […] das Bild. [Wiederum:] Wer [erschafft, erschafft] öffentlich; wer aber zeugt, [zeugt] Kinder im Verborgenen.[c]



    [Niemand wird erkennen können], wann [der Mann] und die Frau miteinander verkehren, außer ihnen selbst; denn die Ehe der Welt ist für die Verheirateten ein Geheimnis. Wenn schon die befleckte Ehe verborgen ist, wie viel mehr ist die unbefleckte Ehe ein wahres Geheimnis! Sie ist nicht fleischlich, sondern rein. Sie entspringt nicht der Begierde, sondern dem Willen. Sie gehört nicht zur Finsternis oder zur Nacht, sondern zum Tag und zum Licht. Wird eine Ehe entblößt, wird sie zur Pornografie – nicht nur dann, wenn die Braut den Samen eines anderen Mannes empfängt; selbst wenn sie das Gemach verlässt und gesehen wird, begeht sie Ehebruch. Sie soll sich ihrem Vater, ihrer Mutter, dem Brautführer und den Kindern des Bräutigams zeigen. Sie dürfen jeden Tag in das Brautgemach eintreten. Die anderen aber sollen sich danach sehnen, auch nur ihre Stimme zu hören und sich an ihrem Duft zu erfreuen; wie Hunde sollen sie die Krümel fressen, die vom Tisch fallen. Bräutigame und Bräute gehören in das
    Brautgemach. Niemand wird den Bräutigam und die Braut sehen können, wenn man nicht [zu solchen wird].[d]'
