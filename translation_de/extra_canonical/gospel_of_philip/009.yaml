  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: de
  text: 'Die Kinder des himmlischen Menschen sind zahlreicher als die Kinder des irdischen Menschen. Wenn Adam so viele Kinder hat, obwohl sie sterben, wie viele Kinder hat dann erst der vollkommene Mensch – Kinder, die nicht sterben, sondern fortwährend gezeugt werden?


    Der Vater zeugt einen Sohn; doch ein Sohn kann keinen Sohn zeugen, denn wer selbst geboren wurde, kann keine Söhne zeugen. Der Sohn zeugt Brüder, nicht Söhne. Alle, die in der Welt gezeugt werden, werden leiblich gezeugt; die anderen aber werden in […] von ihm gezeugt […] dort draußen für den Menschen […] an dem […] himmlischen Ort […] es aus dem Mund […] das Wort kam von dort hervor. Sie würden aus dem Mund genährt [und] vollkommen werden. Die Vollkommenen werden durch einen Kuss empfangen und gezeugt. Darum küssen auch wir einander und empfangen aus der Gnade, die ineinander ist.[a]


    Drei waren es, die den Herrn stets begleiteten: seine Mutter Maria, ihre Schwester und Magdalena, die seine Gefährtin genannt wird; denn Maria ist seine Schwester, seine Mutter und seine Gefährtin.[b]


    »Der Vater« und »der Sohn« sind jeweils ein einfacher Name; »der Heilige Geist« ist ein doppelter Name, denn sie sind überall.[c] Sie sind im Himmel und unten; sie sind verborgen und offenbart. Der Heilige Geist ist unten offenbart und im Himmel verborgen.


    Den Heiligen wird durch die bösen Mächte gedient, denn der Heilige Geist hat diese Mächte geblendet. So meinen sie, einem gewöhnlichen Menschen zu dienen, während sie in Wirklichkeit für die Heiligen wirken. Eines Tages fragte daher ein Jünger den Herrn nach einer weltlichen Angelegenheit. Er sagte zu ihm: »Bitte deine Mutter, und sie wird dir von jemand anderem geben.«[d]


    Die Apostel sagten zu den Jüngern: »Möge unser ganzes Opfer Salz annehmen.« Sie nannten […] »Salz«. Ohne es wird das Opfer nicht [annehmbar]. Die Weisheit aber [ist] kinderlos. Darum [wird sie] […] genannt, dieses vom Salz, der Ort, an dem sie […] auf ihre eigene Weise. Der Heilige Geist […] […] viele Kinder.[e]


    Was dem Vater gehört, gehört dem Sohn. Solange der Sohn aber noch klein ist, wird ihm das, was ihm gehört, nicht anvertraut. Wenn er ein Mann wird, gibt ihm sein Vater alles, was ihm gehört.


    Diejenigen, die vom Geist gezeugt worden sind und in die Irre gehen, gehen auch durch ihn in die Irre. Darum lodert durch diesen einen Geist das Feuer auf und erlischt wieder.[f]


    Echamoth ist das eine, Echmoth etwas anderes. Echamoth ist die Weisheit schlechthin; Echmoth aber ist die Weisheit des Todes, die den Tod kennt. Diese wird »die kleine Weisheit« genannt.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Abschnitt ist mehrfach beschädigt. Auslassungszeichen in eckigen Klammern kennzeichnen Lücken; ergänzte Wörter in eckigen Klammern sind unsichere Wiederherstellungen. Die genaue Verbindung zwischen Mund, Wort, Ernährung und Vollkommenwerden bleibt daher unklar.
    reason: Manuskriptbeschädigung und unsichere Syntax müssen sichtbar bleiben.
  - marker: b
    text: Die Bezüge von »Maria«, »Schwester«, »Mutter« und »Gefährtin« sind im überlieferten Wortlaut nicht eindeutig. »Gefährtin« legt weder ausdrücklich eine Ehe noch eine sexuelle Beziehung fest.
    reason: Bewahrung referenzieller und sozialer Mehrdeutigkeit.
  - marker: c
    text: Der ungewöhnliche Plural »sie« folgt der vorliegenden Textzeugnisgrundlage. Er kann sich auf den doppelten Namen oder auf die zuvor genannten göttlichen Bezeichnungen beziehen; der Satz entscheidet dies nicht eindeutig.
    reason: Die grammatische und theologische Spannung soll nicht stillschweigend aufgelöst werden.
  - marker: d
    text: Wer mit »deine Mutter« und »jemand anderem« gemeint ist, wird nicht erklärt.
    reason: Vermeidung einer unbelegten theologischen Identifikation.
  - marker: e
    text: Dieser Absatz weist große Textlücken auf. Besonders die Aussagen über Weisheit, Salz, den Ort und die vielen Kinder lassen sich nicht sicher zu einem vollständigen Gedankengang verbinden.
    reason: Umfangreiche Manuskriptbeschädigung.
  - marker: f
    text: Der genaue Bezug von »ihn«, »diesem einen Geist«, dem Feuer sowie Auflodern und Erlöschen ist unsicher. Die Übersetzung bewahrt deshalb die auffällige Aussage, dass Menschen auch durch den Geist in die Irre gehen.
    reason: Bewahrung einer schwer deutbaren theologischen Aussage.
  - marker: g
    text: »Echamoth« und »Echmoth« sind hier zwei verschieden geschriebene Fachnamen. Ihre genaue sprachliche Herleitung wird nicht vorausgesetzt.
    reason: Transliteration und Unterscheidung technischer Begriffe.
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: himmlischer Mensch / irdischer Mensch / vollkommener Mensch
  rationale: Die wiederkehrende anthropologische Bezeichnung wird formal und geschlechtsübergreifend als »Mensch« bewahrt; eine Festlegung auf einen bestimmten Mann wäre unnötig.
- source_word: begotten / beget
  choice: gezeugt werden / zeugen
  rationale: »Zeugen« erhält die absichtliche Geburts- und Abstammungsmetaphorik sowie die Wortwiederholung des Textes.
- source_word: physically
  choice: leiblich
  rationale: »Leiblich« ist würdevoll und lässt offen, ob der Gegensatz primär körperlich, irdisch oder sakramental gemeint ist.
- source_word: companion / partner
  choice: Gefährtin
  rationale: Das Wort bezeichnet enge Zugehörigkeit, ohne eine Ehe- oder Sexualbeziehung festzuschreiben, die der vorliegenden Zeugnisgrundlage nicht eindeutig zu entnehmen ist.
- source_word: Wisdom
  choice: Weisheit
  rationale: Die personifizierte Weisheit wird als Titel großgeschrieben; das grammatische Femininum und die theologische Mehrdeutigkeit bleiben erhalten.
- source_word: Echamoth / Echmoth
  choice: Echamoth / Echmoth
  rationale: Die zwei Fachnamen werden transliteriert und nicht etymologisch harmonisiert, da gerade ihr Unterschied Gegenstand des Satzes ist.
theological_decisions:
- issue: Geistliche Zeugung durch Kuss und gegenseitige Gnade
  choice: Die körperlich-geistliche Bildsprache wird ohne allegorische Erklärung wiedergegeben.
  alternative: Den Kuss ausdrücklich als rein rituell oder symbolisch kennzeichnen.
  rationale: Der Text selbst verbindet Kuss, Empfangen, Zeugung und Gnade; eine konfessionelle oder sexualisierte Auflösung würde seine Spannung beseitigen.
- issue: Identität der drei Marien beziehungsweise Bezug von »Maria«
  choice: Die Pronomen und Namensbezüge werden entsprechend dem Zeugen bewahrt.
  alternative: Jede Maria ausdrücklich identifizieren oder den letzten Satz allein auf Magdalena beziehen.
  rationale: Die Passage ist sprachlich und traditionsgeschichtlich mehrdeutig; die Übersetzung darf keine nicht belegte Identifikation erzwingen.
- issue: Pluralpronomen nach »der Heilige Geist«
  choice: »denn sie sind überall« wird im Plural bewahrt.
  alternative: Singular »denn er ist überall« oder ausdrücklicher Bezug auf Vater, Sohn und Geist.
  rationale: Der überlieferte Wortlaut verbindet den »doppelten Namen« mit einem Plural. Die ungewöhnliche Grammatik trägt die theologische Aussage und soll nicht normalisiert werden.
- issue: Irrtum durch den Geist
  choice: »gehen auch durch ihn in die Irre« bleibt stehen.
  alternative: Den Geist nur als Anlass, Prüfung oder zugelassene Ursache umdeuten.
  rationale: Die harte Kausalspannung des Textes wird nicht dogmatisch entschärft.
- issue: Feuer und Geist
  choice: Der Satz wird syntaktisch geglättet, aber Feuer, Auflodern und Erlöschen bleiben ohne Deutung verbunden.
  alternative: Feuer ausdrücklich als Gericht, Inspiration oder Begierde identifizieren.
  rationale: Der beschädigte beziehungsweise schwer verständliche Zusammenhang erlaubt keine sichere theologische Festlegung.
- issue: Mütterliche Anrede im Herrenwort
  choice: »deine Mutter« bleibt ohne Identifikation.
  alternative: Die Mutter mit dem Heiligen Geist, Maria oder einer himmlischen Gestalt gleichsetzen.
  rationale: Der unmittelbare Text liefert keine eindeutige Referenz; eine Identifikation wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit möglichst klarer Syntax. Wiederholungen wie »zeugen«, »Sohn«, »Weisheit« und »Geist« wurden beibehalten, weil sie die Argumentation tragen. Die Fassung ist vorläufig, da laut Metadaten noch keine direkte Prüfung des koptischen Textes erfolgt ist; sie stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen. Manuskriptlücken wurden weder ergänzt noch harmonisiert.
