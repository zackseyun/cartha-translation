translation:
  language: de
  text: 'Jesus gewann sie alle auf verborgene Weise, denn er erschien nicht so, wie er war, sondern so, wie [sie] ihn sehen konnten. Er erschien ihnen (auf) [all diese] (Weisen): Den Großen [erschien] er als groß, den Kleinen [erschien] er als klein, den Engeln [erschien] er als Engel und den Menschen als Mensch. So verbarg sich sein Wort vor allen. Einige sahen ihn zwar, meinten aber, sie sähen sich selbst. Als er jedoch seinen Jüngern auf dem Berg in Herrlichkeit erschien, war er nicht klein. Er wurde groß; doch auch die Jünger machte er groß, damit sie ihn als groß sehen konnten.


    An jenem Tag sagte er bei der Eucharistie:[a] „Du, der du das vollkommene Licht mit dem Heiligen Geist vereint hast, vereine auch die Engel mit uns, mit den Bildern!“[b]


    Verachtet das Lamm nicht; denn ohne es ist es unmöglich, die Tür zu sehen.[c] Niemand wird sich dem König nackt nähern können.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bei der Eucharistie“ kann auch „beim Dankgebet“ beziehungsweise „bei der Danksagung“ bedeuten.
    reason: Der griechische Lehnbegriff kann sowohl die liturgische Feier als auch Danksagung im weiteren Sinn bezeichnen.
  - marker: b
    text: Der Wortlaut der Anrede und die Beziehung zwischen „Engeln“, „uns“ und „Bildern“ sind schwer verständlich; „Bilder“ kann auch „Abbilder“ bedeuten.
    reason: Die syntaktische und begriffliche Mehrdeutigkeit soll sichtbar bleiben, statt durch eine spekulative Ergänzung beseitigt zu werden.
  - marker: c
    text: Ob „Lamm“ und „Tür“ hier bestimmte Personen, Riten oder geistliche Wirklichkeiten bezeichnen, wird im Wortlaut nicht erklärt.
    reason: Die Bildsprache lädt zu theologischen Deutungen ein, legt aber keine davon eindeutig fest.
lexical_decisions:
- source_word: took all of them by stealth
  choice: gewann sie alle auf verborgene Weise
  rationale: Die englische Zeugenformulierung ist ungewöhnlich und kann Täuschung, heimliches Ergreifen oder verborgenes Gewinnen andeuten. Die deutsche Fassung bewahrt das Motiv des Verborgenen, ohne Jesus ausdrücklich Täuschung zuzuschreiben.
- source_word: his Word
  choice: sein Wort
  rationale: Die personhafte beziehungsweise offenbarende Bedeutung bleibt ebenso offen wie im Zeugen­text; eine Festlegung auf „Lehre“ oder einen ausdrücklichen Logos-Titel wird vermieden.
- source_word: became great
  choice: wurde groß
  rationale: Die auffällige Aussage wird formal bewahrt und nicht erklärend zu „erschien groß“ abgeschwächt.
- source_word: Eucharist
  choice: Eucharistie
  rationale: Der überlieferte kultische Ausdruck wird beibehalten; die Fußnote weist auf die mögliche Bedeutung als Dankgebet oder eucharistische Handlung hin.
- source_word: images
  choice: Bilder
  rationale: Der mehrdeutige Ausdruck wird wörtlich wiedergegeben und nicht als Abbilder, Gestalten oder Urbilder interpretiert.
- source_word: lamb
  choice: Lamm
  rationale: Das Bild bleibt ohne christologische oder rituelle Explikation stehen.
theological_decisions:
- issue: Jesu wechselnde Erscheinungsweisen
  choice: Die Aussagen werden als unterschiedliche, den Sehenden angepasste Erscheinungsweisen wiedergegeben.
  alternative: Die Passage als bloße Wahrnehmungsmetapher oder als feste Inkarnationslehre auslegen.
  rationale: Der Text verbindet Erscheinung, Wahrnehmungsfähigkeit und Verbergen, ohne die ontologische Frage eindeutig aufzulösen.
- issue: „Er wurde groß“ und die Vergrößerung der Jünger
  choice: Die sachlich schwierige Formulierung bleibt bestehen.
  alternative: „Er zeigte sich in seiner Größe“ oder „er erhöhte ihre Erkenntnisfähigkeit“.
  rationale: Eine glättende Paraphrase würde die mögliche mystische oder visionäre Aussage vorzeitig festlegen.
- issue: Anrede im Eucharistiewort
  choice: Singularisches „Du“ wird beibehalten.
  alternative: Pluralisches „Ihr“ oder eine ausdrückliche Anrede Gottes.
  rationale: Der englische Zeuge bietet eine formal singularische Anrede, deren Referent unklar bleibt; die Übersetzung benennt ihn nicht eigenmächtig.
- issue: Lamm, Tür und Nacktheit vor dem König
  choice: Die Bildfolge wird ohne allegorische Auflösung übersetzt.
  alternative: Lamm ausdrücklich mit Christus, Tür mit Heil und Bekleidung mit Taufe oder Sakrament identifizieren.
  rationale: Solche Deutungen sind möglich, werden aber im vorliegenden Wortlaut nicht ausdrücklich festgelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter Rätselhaftigkeit. Eckige Klammern kennzeichnen Ergänzungen beziehungsweise unsichere Wiederherstellungen des zugrunde liegenden Zeugen; runde Klammern bewahren dessen alternative oder ergänzende Formsignale. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen.
