  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen weitgehend genau und bewahrt dessen Ergänzungszeichen sowie die absichtlich rätselhafte Bildsprache. „gewann sie alle auf verborgene Weise“ schwächt jedoch „took all of them by stealth“ zu stark ab: Es macht aus dem Aneignen/Ergreifen ein einladendes Gewinnen und neutralisiert das Moment des Heimlichen bzw. Listigen. Die revidierte Fassung gibt dieses Moment ohne weitergehende Deutung wieder.'
  naturalness: Die Sprache ist modernes, gut lesbares Standarddeutsch und wahrt angemessen einen würdigen, knappen Registerton. „nahm sie alle heimlich an sich“ ist bewusst leicht markiert, aber idiomatisch genug und näher an der ungewöhnlichen Vorlage als die glättende Ausgangsformulierung.
  terminology: „Wort“, „Herrlichkeit“, „Eucharistie“, „Heiliger Geist“, „Lamm“, „Tür“ und „König“ sind angemessen und legen keine konfessionelle Ausdeutung fest. Die Fußnoten erläutern Mehrdeutigkeiten zurückhaltend. Da eine unmittelbare koptische Kontrolle ausdrücklich noch aussteht, bleibt die Beurteilung hinsichtlich einzelner textkritischer Nuancen vorläufig.
  issues:
  - severity: medium
    issue: „gewann sie alle auf verborgene Weise“ für „took all of them by stealth“
    rationale: „Gewinnen“ fügt eine positive, werbende Bedeutung hinzu, die der englische Zeuge nicht ausdrückt. Zugleich wird „by stealth“ zu unverbindlich als bloßes „verborgen“ wiedergegeben. „nahm sie alle heimlich an sich“ wahrt Aneignung und Heimlichkeit, ohne die Aussage etwa als Täuschung oder gewaltsames Ergreifen festzulegen.
  revised_text: 'Jesus nahm sie alle heimlich an sich, denn er erschien nicht so, wie er war, sondern so, wie [sie] ihn sehen konnten. Er erschien ihnen (auf) [all diese] (Weisen): Den Großen [erschien] er als groß, den Kleinen [erschien] er als klein, den Engeln [erschien] er als Engel und den Menschen als Mensch. So verbarg sich sein Wort vor allen. Einige sahen ihn zwar, meinten aber, sie sähen sich selbst. Als er jedoch seinen Jüngern auf dem Berg in Herrlichkeit erschien, war er nicht klein. Er wurde groß; doch auch die Jünger machte er groß, damit sie ihn als groß sehen konnten.



    An jenem Tag sagte er bei der Eucharistie:[a] „Du, der du das vollkommene Licht mit dem Heiligen Geist vereint hast, vereine auch die Engel mit uns, mit den Bildern!“[b]



    Verachtet das Lamm nicht; denn ohne es ist es unmöglich, die Tür zu sehen.[c] Niemand wird sich dem König nackt nähern können.'
