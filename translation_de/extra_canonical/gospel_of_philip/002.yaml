  naturalness: Modernes Standarddeutsch und der würdige Registerton sind überwiegend gelungen. „Diese Art wird keine Frucht hervorbringen“ ist idiomatischer und genauer als die bisherige Formulierung. Die Wendung zur Auflösung wird mit „in seinen ursprünglichen Ursprung“ gestrafft, ohne das offene Bezugsfeld zu einer anthropologischen oder kosmologischen Aussage einzuengen.
  terminology: Die Unterscheidung „erkaufen / retten / erlösen“, die Pfandmetaphorik, „Weltzeit“ für „other age“ und der sichtbare Gegensatz von „auflösen“ und „können nicht aufgelöst werden“ sind beizubehalten. „Geschwister“ ist für die abstrakten Gegensatzpaare eine natürliche deutsche Wiedergabe, obwohl der englische Zwischenzeuge „brothers“ hat.
