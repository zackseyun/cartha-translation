  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: de
  text: 'Wer im Winter sät, erntet im Sommer. Der Winter ist die Welt, der Sommer die andere Weltzeit. Lasst uns in der Welt säen, damit wir im Sommer ernten können. Deshalb ist es für uns nicht recht, im Winter zu beten. Auf den Winter folgt der Sommer. Wenn aber jemand im Winter erntet, wird er nicht ernten, sondern ausreißen; denn etwas von dieser Art wird keine Frucht hervorbringen […] es kommt nicht einfach hervor […] sondern am anderen Sabbat […] ist es fruchtlos.[a]


    Christus kam, um einige zu erkaufen, andere zu retten und wieder andere zu erlösen.[b] Die Fremden erkaufte er, machte sie zu den Seinen und sonderte sie nach seinem Willen als Pfand aus. Nicht erst, als er erschien, gab er sein Leben hin, wann er wollte; vielmehr gab er sein Leben seit dem Tag, an dem die Welt entstand, hin, wann er wollte. Dann kam er zuerst, um es an sich zu nehmen, denn es war als Pfand gegeben worden.[c] Es war in der Gewalt der Räuber, die es gefangen genommen hatten; doch er rettete es. Und er erlöste die Guten in der Welt ebenso wie die Bösen.


    Licht und Finsternis, rechts und links, sind Geschwister.[d] Sie sind untrennbar. Daher sind die Guten nicht gut und die Bösen nicht böse; auch ist das Leben nicht wirklich Leben und der Tod nicht wirklich Tod. Deshalb wird jedes in seinen Ursprung von Anfang an aufgelöst werden.[e] Die aber über die Welt erhöht sind, können nicht aufgelöst werden und sind ewig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Auslassungszeichen kennzeichnen Lücken oder unsicheren Text im überlieferten Abschnitt. Dadurch ist der Zusammenhang, besonders beim „anderen Sabbat“, nicht sicher herzustellen.
    reason: Manuskriptschaden beziehungsweise unsichere Wiederherstellung muss für Leser sichtbar bleiben.
  - marker: b
    text: „Erkaufen“, „retten“ und „erlösen“ geben drei verschiedene Verben des vorläufig herangezogenen Textzeugen wieder; wie genau die damit bezeichneten Gruppen voneinander unterschieden werden, bleibt offen.
    reason: Die lexikalische und theologische Dreiteilung darf nicht stillschweigend vereinheitlicht werden.
  - marker: c
    text: Worauf sich „es“ bezieht und wie das Pfandbild im Einzelnen zu verstehen ist, ist nicht völlig eindeutig; der nächste mögliche Bezug ist das hingegebene Leben.
    reason: Die pronominale Mehrdeutigkeit und die schwierige Bildfolge werden offengelegt.
  - marker: d
    text: Der vorläufige englische Textzeuge hat hier wörtlich „Brüder“. „Geschwister“ bezeichnet im Deutschen die Zusammengehörigkeit der abstrakten Gegensatzpaare.
    reason: Die Übersetzungsentscheidung weicht aus Gründen natürlichen deutschen Sprachgebrauchs von der grammatischen Geschlechtsmarkierung des Zeugen ab.
  - marker: e
    text: Auch die Wendung „in seinen Ursprung von Anfang an“ ist mehrdeutig. Sie kann eine Rückführung der genannten Gegensätze an ihren jeweiligen Ursprung bezeichnen; der beschädigte beziehungsweise nur vorläufig erschlossene Kontext erlaubt keine sichere Festlegung.
    reason: Eine mögliche kosmologische oder anthropologische Deutung soll nicht zur eindeutigen Aussage gemacht werden.
lexical_decisions:
- source_word: winter / summer
  choice: Winter / Sommer
  rationale: Die tragende Jahreszeitenmetapher wird unmittelbar und konsequent bewahrt.
- source_word: the other age
  choice: die andere Weltzeit
  rationale: „Weltzeit“ gibt den eschatologischen Zeitalterbegriff verständlicher wieder als das zeitlich unspezifische „andere Alter“, ohne ihn als bloßen Ort aufzufassen.
- source_word: buy / save / redeem
  choice: erkaufen / retten / erlösen
  rationale: Die drei verschiedenen Handlungen werden lexikalisch unterschieden und nicht zu einem einzigen Heilsbegriff eingeebnet.
- source_word: pledge
  choice: Pfand
  rationale: „Pfand“ bewahrt die wirtschaftlich-rechtliche Bildsprache und den Zusammenhang zwischen Aussonderung und späterer Inbesitznahme.
- source_word: brothers
  choice: Geschwister
  rationale: Bei den paarweise genannten abstrakten Größen klingt „Geschwister“ im modernen Deutschen natürlich und bewahrt die Aussage einer engen Zusammengehörigkeit, ohne den grammatisch männlichen Plural überzubetonen.
- source_word: indissoluble
  choice: können nicht aufgelöst werden
  rationale: Die Formulierung hält den Gegensatz zum vorherigen „aufgelöst werden“ sichtbar und vermeidet das im Deutschen möglicherweise stofflich missverständliche „unauflöslich“.
theological_decisions:
- issue: Gebet im Winter beziehungsweise in der Welt
  choice: „es ist für uns nicht recht, im Winter zu beten“
  alternative: „wir sollen in der Welt nicht beten“ oder eine sinnbildliche Umdeutung
  rationale: Die anstößige oder rätselhafte Aussage wird nicht harmonisiert. Die Metapher bleibt stehen, da der vorläufige Zeuge keine sichere Erklärung bietet.
- issue: Verschiedene Wirkungen des Kommens Christi
  choice: erkaufen, retten und erlösen als drei getrennte Verben
  alternative: alle drei Gruppen einheitlich als Gerettete bezeichnen
  rationale: Die möglicherweise theologisch bedeutsame Dreiteilung des Textes wird bewahrt, ohne eine Lehrsystematik hineinzulesen.
- issue: Gute und Böse sind nicht gut beziehungsweise böse
  choice: wörtliche Spannung bewahrt
  alternative: als nur scheinbare oder relative moralische Eigenschaften erklären
  rationale: Der Text stellt ontologische und moralische Gegensätze infrage; eine erklärende Auflösung würde seine genuine Spannung beseitigen.
- issue: Rückkehr oder Auflösung in den Ursprung
  choice: „jedes in seinen Ursprung von Anfang an“
  alternative: „jeder Mensch kehrt zu seinem ursprünglichen Wesen zurück“
  rationale: Das grammatische Bezugsfeld bleibt offen; weder eine ausschließlich anthropologische noch eine kosmologische Deutung wird festgelegt.
