translation:
  language: de
  text: '**Das Geheimnis der Ehe**


    [Das] Geheimnis der Ehe [ist] groß; denn [ohne] sie würde die Welt [nicht bestehen]. Denn [die] Ordnung [der Welt …], sondern die Ordnung [… die Ehe]. Denkt an das [Intime …], das befleckt ist, denn es hat […] Macht. Sein Bild besteht in einer [Befleckung].[a]


    Die unreinen Geister nehmen männliche und weibliche [Gestalt] an. Die männlichen sind jene, die mit den Seelen verkehren, die in einer weiblichen Gestalt wohnen; die weiblichen sind jene, die sich aus Ungehorsam mit denen vermischen, die in einer männlichen Gestalt wohnen. Niemand kann ihrer Fessel entkommen, ohne eine männliche und eine weibliche Kraft zu empfangen – den Bräutigam und die Braut – nach dem Bild der Brautkammer.


    Wenn die törichten weiblichen Wesen einen Mann allein dasitzen sehen, stürzen sie sich auf ihn, treiben ihr Spiel mit ihm und beflecken ihn. Ebenso verführen und überwältigen die törichten männlichen Wesen eine schöne Frau, wenn sie sie allein dasitzen sehen, weil sie sie beflecken wollen. Sehen sie aber den Ehemann und seine Frau beieinandersitzen, können die weiblichen Wesen nicht in den Ehemann eindringen und die männlichen nicht in die Frau. So ist es auch, wenn sich das Bild mit dem Engel vereint:[b] Niemand wird es wagen können, in den [Mann] oder die Frau einzudringen.'
  philosophy: optimal-equivalence
  footnotes:
