    reason: Bewahrt eine echte begriffliche und theologische Mehrdeutigkeit, ohne eine bestimmte Auslegung in den Haupttext einzutragen.
lexical_decisions:
- source_word: mystery of marriage
  choice: Geheimnis der Ehe
  rationale: Bewahrt den religiös-symbolischen Sinn von „mystery“ und gibt „marriage“ in natürlichem, würdigem Deutsch wieder.
- source_word: structure
  choice: Ordnung
  rationale: „Ordnung“ ist im kosmologischen Zusammenhang verständlicher als das technischere „Struktur“, ohne die beschädigte Aussage inhaltlich zu ergänzen.
- source_word: intimate
  choice: das Intime
  rationale: Die Vorlage ist beschädigt und grammatisch unsicher. Die substantivierte Wiedergabe wahrt diese Unbestimmtheit, statt etwa ausdrücklich Geschlechtsverkehr zu ergänzen.
- source_word: are intimate with
  choice: mit … verkehren
  rationale: Vermittelt die wahrscheinlich sexuelle oder eng verbindende Bedeutung, ohne unnötig explizit zu werden.
- source_word: male power and a female one
  choice: eine männliche und eine weibliche Kraft
  rationale: „Kraft“ erhält die personale und zugleich spirituelle Offenheit des Ausdrucks.
- source_word: bridal chamber
  choice: Brautkammer
  rationale: Der etablierte, bildhafte Ausdruck bewahrt die besondere sakramentale beziehungsweise mystische Begrifflichkeit des Textes, ohne sie konfessionell auszudeuten.
- source_word: foolish females / foolish males
  choice: törichte weibliche Wesen / törichte männliche Wesen
  rationale: Vermeidet das im Deutschen missverständliche substantivierte „Weibliche/Männliche“ und hält zugleich offen, dass hier die zuvor genannten Geister in geschlechtlicher Gestalt gemeint sind.
- source_word: seduce and coerce
  choice: verführen und überwältigen
  rationale: Gibt sowohl die Verlockung als auch den Zwang wieder; „überwältigen“ klingt im Kontext natürlicher als eine abstrakte Formulierung mit „nötigen“.
- source_word: go inside
  choice: eindringen
  rationale: Bewahrt die bedrohliche körperlich-spirituelle Bildsprache und schwächt sie nicht zu bloßem „hineingehen“ ab.
theological_decisions:
- issue: Verhältnis von Ehe, Brautkammer und kosmischer Ordnung
  choice: Die Aussagen werden ohne dogmatische Erklärung oder Gleichsetzung wiedergegeben.
  alternative: Die Ehe ausdrücklich als Sakrament oder als rein geistige Vereinigung deuten.
  rationale: Der beschädigte Text und sein symbolischer Kontext lassen mehrere Deutungen zu; eine konfessionelle Festlegung wäre nicht quellengetreu.
- issue: Männliche und weibliche Kraft als Bräutigam und Braut
  choice: Die Parallelsetzung bleibt in ihrer Spannung stehen.
  alternative: Die Kräfte als konkrete Personen, Seelenanteile oder bestimmte göttliche Mächte identifizieren.
  rationale: Die Vorlage benennt die Beziehung bildhaft, erklärt aber ihre Ontologie nicht eindeutig.
- issue: Vereinigung des Bildes mit dem Engel
  choice: Die ungewöhnliche Formulierung wird wörtlich und ohne Auflösung bewahrt.
  alternative: „Bild“ als Mensch beziehungsweise Seele und „Engel“ als himmlisches Gegenstück auslegen.
  rationale: Eine solche Deutung ist möglich, wird durch den vorliegenden Wortlaut jedoch nicht eindeutig festgelegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die beschädigten Stellen wurden weder geglättet noch spekulativ ergänzt. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Übersetzungszeugen.
