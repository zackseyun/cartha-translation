review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung bewahrt den Gedankengang des englischen Zeugnisses, die Textlücken in eckigen Klammern, die Bildsprache und die auffälligen Spannungen im Text überwiegend sorgfältig. Einzelne Stellen verschieben jedoch Personenbezüge oder den Sinn: Besonders „those who are revealed of the truth“ wurde unzutreffend versachlicht; außerdem ist „inactive“ nicht „unwirksam“. Die beschädigte, grammatisch gebrochene Passage über die aus Unwissenheit hervorgehenden Dinge sollte ihre pluralische Inkohärenz sichtbar bewahren.'
  naturalness: 'Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. Einige vorsichtige Anpassungen verbessern die Lesbarkeit, ohne die bewusst rätselhafte Sprache zu glätten: „sagte uns damit“ statt „zeigte uns damit“, „ans Licht bringt“ für das Herausbringen der Wurzel und „aus dem Samen des Heiligen Geistes“ für die engere Bildverbindung.'
  terminology: „Fleisch“, „Wort“, „Erkenntnis“, „Fülle“, „Brautgemach“, „Arche“, „Allerheiligstes“ und „Salbung“ sind im Kontext angemessen. „Sinnbilder und Bilder“ ist als verständliche Wiedergabe von „types and images“ vertretbar. Die Fußnoten sind sachlich, nicht konfessionell festlegend, und ihre Marker sind korrekt verankert.
  issues:
  - severity: medium
    issue: Personenbezug bei dem von der Wahrheit Offenbarten verändert
    rationale: 'Die Vorlage spricht von „those who are revealed of the truth“ und setzt mit „they are weak and scorned“ fort. Die Fassung „mit dem, was ... offenbar ist: Es ist“ versachlicht und singularisiert diese Gruppe.'
  - severity: medium
