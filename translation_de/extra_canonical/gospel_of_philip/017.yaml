  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are servants of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the servants will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: de
  text: 'Als Abraham […] um zu sehen, was er sehen sollte, beschnitt [er] das Fleisch der Vorhaut und [zeigte] uns damit, dass es notwendig ist, das Fleisch zu vernichten.[a]


    [Die meisten Dinge] der Welt können bestehen und leben, solange ihr [Inneres verborgen ist. Wird es sichtbar], sterben sie. Das zeigt sich am sichtbaren Menschen: [Solange] das Innere eines Menschen verborgen ist, lebt er. Werden seine Eingeweide bloßgelegt und treten aus ihm heraus, stirbt er. Ebenso ist es mit einem Baum. Solange seine Wurzel verborgen ist, blüht und wächst er. Wird seine Wurzel freigelegt, verdorrt der Baum. So verhält es sich mit allem, was in der Welt entsteht – nicht nur mit dem Sichtbaren, sondern auch mit dem Verborgenen. Denn solange die Wurzel des Bösen verborgen ist, ist sie stark. Wird sie aber erkannt, löst sie sich auf; wird sie offenbar, stirbt sie. Darum sagt das Wort: »Schon ist die Axt an die Wurzel der Bäume gelegt.«[b] Sie wird nicht nur abschlagen, denn was abgeschlagen wird, treibt wieder aus. Vielmehr dringt die Axt tief in die Erde ein, bis sie die Wurzel herausgeholt hat. Jesus riss die Wurzel vollständig aus, andere dagegen nur zum Teil.


    Was uns betrifft: Jeder von uns soll bis zur Wurzel des Bösen in seinem Inneren hinabgraben und es mitsamt seiner Wurzel aus uns herausreißen. Es wird entwurzelt, wenn wir es erkennen. Erkennen wir es aber nicht, schlägt es in uns Wurzeln und bringt in uns seine Frucht hervor. Es beherrscht uns, und wir werden gezwungen, ihm zu dienen. Es nimmt uns gefangen, sodass wir tun, was wir [nicht] wollen, und [nicht] tun, was wir wollen. Es ist mächtig, weil wir es nicht erkannt haben. Solange [es besteht], ist es wirksam.


    [Unwissenheit] ist die Mutter [alles Bösen]. Unwissenheit wird [den Tod] herbeiführen, [denn] was aus [Unwissenheit] hervorgegangen ist, existierte weder, noch [existiert es], noch wird es ins Dasein kommen […] Sie werden vollendet werden, wenn die ganze Wahrheit offenbar wird. Denn mit der Wahrheit verhält es sich ähnlich wie mit der Unwissenheit: Solange sie verborgen ist, ruht sie in sich selbst. Wird sie aber offenbar und erkannt, so wird sie verherrlicht, weil sie stärker ist als Unwissenheit und Irrtum. Sie schenkt Freiheit. Das Wort sagt: »Wenn ihr die Wahrheit erkennt, wird die Wahrheit euch frei machen.«[c] Unwissenheit ist Sklaverei; Erkenntnis ist Freiheit. Wenn wir die Wahrheit erkennen, werden wir die Früchte der Wahrheit in uns finden. Wenn wir uns mit ihr vereinen, wird sie unsere Fülle empfangen.


    Jetzt besitzen wir das, was von der Schöpfung offenbar ist. Wir sagen: »Die Starken stehen in Ehren, die Verborgenen aber sind schwach und verachtet.« So ist es auch mit dem, was von der Wahrheit offenbar ist: Es ist schwach und verachtet; das Verborgene dagegen ist stark und steht in Ehren. Doch die Geheimnisse der Wahrheit werden in Sinnbildern und Bildern offenbart.


    Das Brautgemach jedoch ist verborgen; es ist das Heilige im Heiligen.[d] Anfangs verhüllte der Vorhang, wie Gott die Schöpfung lenkte. Wenn aber der Vorhang zerreißt und das Innere offenbar wird, dann wird dieses Haus verlassen zurückbleiben [wie] eine Wüste – oder vielmehr: Es wird [zerstört] werden. Und die ganze Gottheit wird [aus] diesen Orten fliehen, nicht in das Allerheiligste hinein, denn sie wird sich nicht mit dem reinen [Licht] und der [makellosen] Fülle vereinen können. [Vielmehr] wird sie unter die Flügel des Kreuzes [und unter] seine Arme gelangen.[e] Diese Arche wird [ihnen zur] Rettung werden, wenn die Wasserflut über sie hereinbricht.


    Wenn einige zum Priestertum gehören, werden sie mit dem Hohen Priester hinter den Vorhang treten können. Der Vorhang zerriss also nicht nur oben, denn dann wäre er nur für die Oberen geöffnet worden. Er zerriss auch nicht nur unten, denn dann wäre er nur den Unteren enthüllt worden. Vielmehr zerriss er von oben bis unten. Die Oberen öffneten uns den unteren Bereich, damit wir in das Geheimnis der Wahrheit eintreten können. Dies ist wahrhaftig das Ehrenvolle, das Starke. Doch wir werden dorthin durch verachtete Sinnbilder und Schwachheiten eintreten. Vor der vollkommenen Herrlichkeit werden sie erniedrigt. Es gibt eine Herrlichkeit, die Herrlichkeit übertrifft, und eine Kraft, die Kraft übertrifft. So wurde uns das Vollkommene zusammen mit den Geheimnissen der Wahrheit geöffnet; das Allerheiligste wurde enthüllt, und das Brautgemach lud uns ein einzutreten.


    Solange das Böse verborgen ist, ist es unwirksam; doch aus der Mitte der Nachkommenschaft des Heiligen Geistes ist es noch nicht entfernt. Sie sind Sklaven des Bösen. Sobald es aber offenbar wird, wird das vollkommene Licht über alle ausströmen, und alle, die in ihm sind, werden [die Salbung empfangen].[f] Dann werden die Sklaven befreit und die Gefangenen erlöst werden. »[Jede] Pflanze, [die] mein Vater im Himmel [nicht] gepflanzt hat, [wird] ausgerissen werden.«[g] Die Getrennten werden sich vereinen […] werden erfüllt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des Satzes ist beschädigt. Auch die Ergänzungen in eckigen Klammern sind erschlossen. »Das Fleisch vernichten« kann hier körperlich, asketisch oder symbolisch gemeint sein; der erhaltene Wortlaut entscheidet das nicht eindeutig.
    reason: Kennzeichnet Textverlust und bewahrt eine theologisch bedeutsame Mehrdeutigkeit.
  - marker: b
    text: Vgl. Matthäus 3,10; Lukas 3,9.
    reason: Weist die erkennbare Schriftanspielung nach.
  - marker: c
    text: Vgl. Johannes 8,32.
    reason: Weist das zitierte Jesuswort nach.
  - marker: d
    text: »Brautgemach« bezeichnet im Philippusevangelium einen verborgenen, heiligen Raum und zugleich eine symbolische Wirklichkeit der Vereinigung. Die genaue rituelle und theologische Bedeutung bleibt umstritten.
    reason: Erklärt einen zentralen Fachbegriff, ohne eine bestimmte konfessionelle Deutung festzulegen.
  - marker: e
    text: Dieser Abschnitt ist textlich und inhaltlich besonders schwierig. Worauf »die ganze Gottheit« verweist und weshalb sie sich nicht mit Licht und Fülle vereinen kann, bleibt offen.
    reason: Markiert echte Referenz- und Deutungsunsicherheit.
  - marker: f
    text: Wörtlich steht hier der Begriff »Chrisma«, also Salböl beziehungsweise Salbung. Im Philippusevangelium hat die Salbung eine besondere rituelle und geistliche Bedeutung.
    reason: Bewahrt den kultischen Hintergrund des Ausdrucks.
  - marker: g
    text: Vgl. Matthäus 15,13.
    reason: Weist die erkennbare Schriftanspielung nach.
lexical_decisions:
- source_word: flesh
  choice: Fleisch
  rationale: Bewahrt den körperlichen Ausdruck und seine mögliche symbolische Tragweite, ohne ihn vorschnell als bloße Sündhaftigkeit oder als den ganzen Leib auszulegen.
- source_word: Word
  choice: das Wort
  rationale: Gibt die autoritative Redeformel wieder und lässt offen, ob der Text dabei Schriftwort, Christus als Logos oder beides anklingen lässt.
- source_word: knowledge / recognize
  choice: Erkenntnis / erkennen
  rationale: Der wiederkehrende Wortstamm macht den Gegensatz zwischen Unwissenheit und befreiender Erkenntnis im Deutschen sichtbar.
- source_word: types
  choice: Sinnbilder
  rationale: Ist im modernen Deutsch verständlicher als »Typen«, bewahrt aber die Funktion sichtbarer Formen, die auf verborgene Wirklichkeit verweisen.
- source_word: chamber
  choice: Brautgemach
  rationale: Im Kontext des Philippusevangeliums ist der kultisch-symbolische Raum des Brautgemachs gemeint; »Kammer« wäre zwar neutraler, würde aber diesen wiederkehrenden Fachbegriff verdunkeln.
- source_word: fullness
  choice: Fülle
  rationale: Bewahrt den theologischen und kosmologischen Bedeutungsraum, ohne das Wort durch einen engeren Lehrbegriff zu ersetzen.
- source_word: chrism
  choice: Salbung
  rationale: Gibt den rituellen Sinn natürlich wieder; eine Fußnote nennt den engeren Ausdruck »Chrisma«.
- source_word: ark
  choice: Arche
  rationale: Erhält die ausdrücklich durch die Wasserflut aktivierte Noah-Typologie.
theological_decisions:
- issue: Aussage über die Vernichtung des Fleisches
  choice: Wörtlich und spannungsvoll als »das Fleisch zu vernichten« wiedergegeben
  alternative: Deutend als Überwindung fleischlicher Begierden oder Abtötung des sündigen Wesens
  rationale: Der beschädigte Kontext erlaubt keine sichere dogmatische Eingrenzung; die Übersetzung soll eine mögliche leibfeindliche, asketische oder symbolische Lesart nicht vorentscheiden.
- issue: Personifikation des Bösen
  choice: Zwischen »die Wurzel des Bösen« und dem sächlichen Pronomen »es« gewechselt
  alternative: Durchgehend »der Böse« oder ausschließlich abstrakt »das Böse«
  rationale: Der Text beschreibt das Böse zugleich als Wurzel, Macht und Herrschaft; die Wiedergabe bewahrt diese Spannung, ohne daraus eindeutig eine Person zu machen.
- issue: Wahrheit und Unwissenheit als vergleichbare verborgene Größen
  choice: Die überraschende Ähnlichkeit ausdrücklich beibehalten
  alternative: Die Wahrheit lediglich als Gegensatz zur Unwissenheit darstellen
  rationale: Die Pointe liegt darin, dass beide im Verborgenen in sich ruhen, während die offenbarte Wahrheit Unwissenheit und Irrtum überwindet.
- issue: Die Gottheit flieht, kann sich aber nicht mit Licht und Fülle vereinen
  choice: Die schwierige Aussage ohne Harmonisierung übersetzt
  alternative: »falsche Gottheiten« oder »göttliche Kräfte« einsetzen
  rationale: Referenz und Wertung sind im vorliegenden Zeugnis unsicher. Eine dogmatisch glättende Präzisierung wäre nicht quellengetreu.
- issue: Nachkommenschaft des Heiligen Geistes als Sklaven des Bösen
  choice: Die Spannung unverändert stehen gelassen
  alternative: Nur einige Angehörige der Nachkommenschaft als versklavt verstehen
  rationale: Der pronominale Bezug ist schwierig, doch der überlieferte Gedankengang verbindet geistliche Zugehörigkeit und noch bestehende Versklavung. Diese Spannung darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen bis mittellangen Sätzen. Bildfelder wie Wurzel, Axt, Vorhang, Arche, Licht und Fülle wurden konsequent erhalten. Eckige Klammern und Auslassungspunkte markieren wie in der Vorlage beschädigten Text oder redaktionelle Ergänzungen. Da eine unmittelbare Prüfung des koptischen Manuskripttextes noch aussteht, ist dies ein quellenbewusster Entwurf auf Grundlage des angegebenen englischen Zeugnisses; besonders unsichere Stellen wurden nicht geglättet.
