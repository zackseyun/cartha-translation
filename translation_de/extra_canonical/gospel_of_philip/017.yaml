    rationale: „[telling] us“ ist eher „[sagte] uns damit“ als „[zeigte] uns damit“; die Axt „brings up“ die Wurzel, was „ans Licht bringt“ genauer abbildet als ein abgeschlossenes „herausgeholt hat“.
  revised_text: 'Als Abraham […] um zu sehen, was er sehen sollte, beschnitt [er] das Fleisch der Vorhaut und [sagte] uns damit, dass es notwendig ist, das Fleisch zu vernichten.[a]


    [Die meisten Dinge] der Welt können bestehen und leben, solange ihr [Inneres verborgen ist. Wird es sichtbar], sterben sie. Das zeigt sich am sichtbaren Menschen: [Solange] das Innere eines Menschen verborgen ist, lebt er. Werden seine Eingeweide bloßgelegt und treten aus ihm heraus, stirbt er. Ebenso ist es mit einem Baum. Solange seine Wurzel verborgen ist, blüht und wächst er. Wird seine Wurzel freigelegt, verdorrt der Baum. So verhält es sich mit allem, was in der Welt entsteht – nicht nur mit dem Sichtbaren, sondern auch mit dem Verborgenen. Denn solange die Wurzel des Bösen verborgen ist, ist sie stark. Wird sie aber erkannt, löst sie sich auf; wird sie offenbar, stirbt sie. Darum sagt das Wort: »Schon ist die Axt an die Wurzel der Bäume gelegt.«[b] Sie wird nicht nur abschlagen, denn was abgeschlagen wird, treibt wieder aus. Vielmehr dringt die Axt tief in die Erde ein, bis sie die Wurzel ans Licht bringt. Jesus riss die Wurzel vollständig aus, andere dagegen nur zum Teil.


    Was uns betrifft: Jeder von uns soll bis zur Wurzel des Bösen in seinem Inneren hinabgraben und es mitsamt seiner Wurzel aus uns herausreißen. Es wird entwurzelt, wenn wir es erkennen. Erkennen wir es aber nicht, schlägt es in uns Wurzeln und bringt in uns seine Frucht hervor. Es beherrscht uns, und wir werden gezwungen, ihm zu dienen. Es nimmt uns gefangen, sodass wir tun, was wir [nicht] wollen, und [nicht] tun, was wir wollen. Es ist mächtig, weil wir es nicht erkannt haben. Solange [es besteht], ist es wirksam.


    [Unwissenheit] ist die Mutter [alles Bösen]. Unwissenheit wird [den Tod] herbeiführen, [denn] was aus [Unwissenheit] hervorgegangen ist, existierte weder, noch [existiert es], noch werden sie ins Dasein kommen […] Sie werden vollendet werden, wenn die ganze Wahrheit offenbar wird. Denn mit der Wahrheit verhält es sich ähnlich wie mit der Unwissenheit: Solange sie verborgen ist, ruht sie in sich selbst. Wird sie aber offenbar und erkannt, so wird sie verherrlicht, weil sie stärker ist als Unwissenheit und Irrtum. Sie schenkt Freiheit. Das Wort sagt: »Wenn ihr die Wahrheit erkennt, wird die Wahrheit euch frei machen.«[c] Unwissenheit ist Sklaverei; Erkenntnis ist Freiheit. Wenn wir die Wahrheit erkennen, werden wir die Früchte der Wahrheit in uns finden. Wenn wir uns mit ihr vereinen, wird sie unsere Fülle empfangen.


    Jetzt besitzen wir das, was von der Schöpfung offenbar ist. Wir sagen: »Die Starken stehen in Ehren, die Verborgenen aber sind schwach und verachtet.« So ist es auch mit denen, die von der Wahrheit offenbar sind: Sie sind schwach und verachtet; die Verborgenen dagegen sind stark und stehen in Ehren. Doch die Geheimnisse der Wahrheit werden in Sinnbildern und Bildern offenbart.


    Das Brautgemach jedoch ist verborgen; es ist das Heilige im Heiligen.[d] Anfangs verhüllte der Vorhang, wie Gott die Schöpfung lenkte. Wenn aber der Vorhang zerreißt und das Innere offenbar wird, dann wird dieses Haus verlassen zurückbleiben [wie] eine Wüste – oder vielmehr: Es wird [zerstört] werden. Und die ganze Gottheit wird [aus] diesen Orten fliehen, nicht in das Allerheiligste hinein, denn sie wird sich nicht mit dem reinen [Licht] und der [makellosen] Fülle vereinen können. [Vielmehr] wird sie unter die Flügel des Kreuzes [und unter] seine Arme gelangen.[e] Diese Arche wird [ihnen zur] Rettung werden, wenn die Wasserflut über sie hereinbricht.


    Wenn einige zum Priestertum gehören, werden sie mit dem Hohen Priester hinter den Vorhang treten können. Der Vorhang zerriss also nicht nur oben, denn dann wäre er nur für die Oberen geöffnet worden. Er zerriss auch nicht nur unten, denn dann wäre er nur den Unteren enthüllt worden. Vielmehr zerriss er von oben bis unten. Die Oberen öffneten uns den unteren Bereich, damit wir in das Geheimnis der Wahrheit eintreten können. Dies ist wahrhaftig das Ehrenvolle, das Starke. Doch wir werden dorthin durch verachtete Sinnbilder und Schwachheiten eintreten. Vor der vollkommenen Herrlichkeit werden sie erniedrigt. Es gibt eine Herrlichkeit, die Herrlichkeit übertrifft, und eine Kraft, die Kraft übertrifft. So wurde uns das Vollkommene zusammen mit den Geheimnissen der Wahrheit geöffnet; das Allerheiligste wurde enthüllt, und das Brautgemach lud uns ein einzutreten.


    Solange das Böse verborgen ist, ist es untätig; doch aus dem Samen des Heiligen Geistes ist es noch nicht entfernt. Sie sind Sklaven des Bösen. Sobald es aber offenbar wird, wird das vollkommene Licht über alle ausströmen, und alle, die in ihm sind, werden [die Salbung empfangen].[f] Dann werden die Sklaven befreit und die Gefangenen erlöst werden. »[Jede] Pflanze, [die] mein Vater im Himmel [nicht] gepflanzt hat, [wird] ausgerissen werden.«[g] Die Getrennten werden sich vereinen […] werden erfüllt werden.'
