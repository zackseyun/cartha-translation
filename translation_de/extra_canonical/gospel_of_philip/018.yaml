review_pass:
  verdict: revise
  source_fidelity: Die Vorlage ist nur ein englischer, ausdrücklich vorläufiger Zeuge; die koptische Direktprüfung steht aus. Die Beschädigungszeichen sind grundsätzlich bewahrt. Im ersten Satz verschiebt jedoch „[in] die Kammer [eintreten]“ die Klammerung gegenüber dem Zeugen („[enter] the chamber“). Ferner ergänzt „Die Welt ist zu den [ewigen] Zeitaltern geworden“ ein nicht belegtes bestimmtes Ziel und verändert damit die knappe, schwierige Prädikation „has become the ages“.
  naturalness: Der Text ist überwiegend würdevoll und verständlich. „Das Feuer […] nachts und erlischt“ ist wegen der Lücke zwar fragmentarisch, aber syntaktisch nicht tragfähig; eine zurückhaltende Umstellung stellt die beschädigte Aussage lesbar dar, ohne Text zu ergänzen. „selbst solange“ ist unnötig schwerfällig.
  terminology: „Brautgemach“, „Geheimnisse“, „Wahrheit“, „Bilder“ und „Fülle“ sind angemessen und nicht konfessionell überdeutet. Für das im Zeugen parenthetisch erläuterte „(eternal) age(s)“ sollte die Kennzeichnung als editorische Erläuterung eher durch runde Klammern als durch eckige Klammern erfolgen; eckige Klammern signalisieren hier sonst Handschriftenergänzungen. Die Fußnote zur „Äonenwelt“ ist nicht nötig und legt eine ungesicherte kosmologische Lesart nahe.
  issues:
  - severity: medium
    issue: Klammerung im ersten Satz verschoben
    rationale: Der englische Zeuge markiert ausschließlich „[enter]“ als Ergänzung. Die deutsche Fassung markiert dagegen „[in]“ und „[eintreten]“, wodurch das Ausmaß der Ergänzung nicht mehr transparent dem Zeugen entspricht.
  - severity: medium
    issue: Der beschädigte Feuersatz ist syntaktisch unvollständig
    rationale: „Das Feuer […] nachts und erlischt“ enthält kein tragfähiges Prädikat vor der Konjunktion. „Das Feuer […] in der Nacht brennt und erlischt“ bewahrt die Lücke und ergibt eine verständliche fragmentarische Parallele.
  - severity: medium
    issue: „zu den [ewigen] Zeitaltern“ fügt eine Zielrichtung und einen bestimmten Artikel hinzu
    rationale: Die Vorlage sagt knapp „The world has become the (eternal) ages“. „Die Welt ist (zu) ewigen Zeitaltern geworden“ gibt die Prädikation unmittelbarer wieder und vermeidet die nicht belegte Bestimmtheit.
  - severity: low
    issue: Editorische Kennzeichnung von „eternal“
    rationale: Im Zeugen stehen runde Klammern, nicht eckige. Runde Klammern in der Übersetzung unterscheiden die erläuternde Kennzeichnung von den in der Handschriftüberlieferung angezeigten Ergänzungen.
  - severity: low
    issue: Fußnote „Äonenwelt“ ist interpretierend und entbehrlich
    rationale: Sie führt einen fachsprachlich-kosmologischen Begriff ein, den der vorliegende Zeuge nicht erzwingt. Die Mehrdeutigkeit bleibt mit „Zeitalter“ ausreichend offen.
