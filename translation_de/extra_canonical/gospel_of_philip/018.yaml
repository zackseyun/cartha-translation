translation:
  language: de
  text: 'Jeder, der [in] die Kammer [eintreten] wird, wird seine [Lampe] anzünden; denn [es ist] wie bei den Hochzeiten, die […] nachts stattfinden: Das Feuer […] nachts und erlischt. Doch die Geheimnisse dieser Hochzeit werden am Tag und im Licht vollendet. Weder jener Tag noch sein Licht geht jemals unter.


    Wenn jemand ein Kind des Brautgemachs wird, wird er das Licht empfangen. Wenn jemand es nicht empfängt, solange er hier ist, wird er es am anderen Ort nicht empfangen können. Wer jenes Licht empfängt, wird weder gesehen noch gebunden werden, und niemand wird einen solchen Menschen behelligen können, selbst solange er in der Welt lebt. Wenn er die Welt verlässt, hat er außerdem die Wahrheit bereits in den Bildern empfangen. Die Welt ist zu den [ewigen] Zeitaltern geworden,[a] denn das [ewige] Zeitalter ist für ihn die Fülle. Und so verhält es sich: Ihm allein wird es offenbart. Es ist nicht in der Finsternis und der Nacht verborgen, sondern in einem vollkommenen Tag und einem heiligen Licht.


    Das Evangelium


    nach Philippus


    [a] Oder: „Die Welt ist zur Äonenwelt geworden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Welt ist zur Äonenwelt geworden.“'
    reason: Die zugrunde liegende Wendung kann kosmologische „Äonen“ meinen; wegen der noch ausstehenden direkten koptischen Prüfung bleibt die Alternative sichtbar.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: Kammer / Brautgemach
  rationale: Die erste beschädigte Wendung bleibt allgemein als „Kammer“ erhalten; der technisch-symbolische Ausdruck im zweiten Absatz wird natürlich und traditionsnah mit „Brautgemach“ wiedergegeben.
- source_word: mysteries
  choice: Geheimnisse
  rationale: „Geheimnisse“ bewahrt den religiös-rituellen Sinn, ohne durch „Sakramente“ eine spätere konfessionelle Deutung einzutragen.
- source_word: child of the bridal chamber
  choice: Kind des Brautgemachs
  rationale: Die ungewöhnliche Bildsprache wird formal bewahrt und nicht interpretierend aufgelöst.
- source_word: Truth
  choice: Wahrheit
  rationale: Die substantivische, offenbar personifizierte oder hypostasierte Verwendung wird durch Großschreibung kenntlich gemacht.
- source_word: images
  choice: Bilder
  rationale: Die offene Bild- und Offenbarungssprache bleibt erhalten; „Abbilder“ wäre bereits stärker metaphysisch festgelegt.
- source_word: ages / age
  choice: '[ewige] Zeitalter / [ewiges] Zeitalter'
  rationale: „Zeitalter“ bildet die zeitlich-kosmologische Mehrdeutigkeit ab. „Ewig“ steht in eckigen Klammern, weil es im Zeugen als erläuternder Zusatz gekennzeichnet ist.
- source_word: fullness
  choice: Fülle
  rationale: „Fülle“ erhält den möglichen terminologischen Gehalt, ohne ihn durch eine erklärende Umschreibung festzulegen.
theological_decisions:
- issue: Empfang des Lichts im Diesseits und Jenseits
  choice: Die ausschließliche Bedingung wird direkt wiedergegeben.
  alternative: Eine abschwächende Formulierung wie „nur schwer“ oder eine Erklärung über nachträgliche Erlösung.
  rationale: Der Text behauptet ausdrücklich, dass das Licht am anderen Ort nicht mehr empfangen werden kann; diese Spannung darf nicht harmonisiert werden.
- issue: Unsichtbarkeit und Ungebundenheit des Lichtempfängers
  choice: „wird weder gesehen noch gebunden werden“
  alternative: Metaphorische Ausdeutung als rein geistige Freiheit.
  rationale: Der Aussageumfang bleibt bewusst offen; der Text kann rituell, kosmologisch oder geistlich verstanden werden.
- issue: Wahrheit „in den Bildern“
  choice: Die paradoxe Formulierung bleibt wörtlich bestehen.
  alternative: „durch Sinnbilder erkannt“ oder „hinter den Bildern empfangen“.
  rationale: Eine Präpositionserklärung würde die Beziehung zwischen Wahrheit und Bildern unzulässig festlegen.
- issue: Welt und Zeitalter/Äonen
  choice: Im Haupttext „[ewige] Zeitalter“, mit Fußnote zur Alternative „Äonenwelt“.
  alternative: Ausschließlich gnostisch-technisches „Äonen“.
  rationale: Die verständliche Wiedergabe steht im Haupttext; die mögliche kosmologische Fachbedeutung wird transparent bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die eckigen Klammern und Auslassungspunkte des überlieferten englischen Zeugen bleiben als Signale von Ergänzung beziehungsweise Textschaden erhalten. Wegen der ausdrücklich noch ausstehenden Prüfung des Koptischen ist der Entwurf zurückhaltend und vermeidet vermeintliche Rekonstruktionen. Das generische Singularpronomen wurde im Deutschen überwiegend mit „er/ihn“ wiedergegeben, um schwerfällige Wiederholungen zu vermeiden; gemeint ist jeweils jede Person.
