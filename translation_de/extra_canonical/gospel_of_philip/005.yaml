review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist erforderlich. »von einer Frau empfangen« bedeutet im Deutschen primär, etwas von einer Frau zu erhalten; für eine Empfängnis ist »durch eine Frau empfangen« erforderlich. Außerdem wurden die im englischen Zeugen als runde Klammern gesetzten Elemente unzutreffend in eckige Klammern umgewandelt und die Klammerung bei »Mein [Vater, der im] Himmel« verändert. Die objektlose, beschädigte Befehlssequenz am Schluss darf nicht durch ein unmarkiertes »es« ergänzt werden.
  naturalness: Mit »durch eine Frau empfangen« ist die rhetorische Frage idiomatisch und bleibt zugleich nah am Wortlaut. Die fragmentarische Syntax im letzten Satz ist absichtlich beizubehalten, da sie die überlieferte Lücke sichtbar macht.
  terminology: »Heiliger Geist«, »empfangen«, »Macht/Mächte«, »befleckt«, »Zeugnis« und »Haus des Vaters« sind treffend und bewahren die theologische beziehungsweise kosmologische Offenheit des Zeugen.
  issues:
  - severity: high
    issue: »Wann hat je eine Frau von einer Frau empfangen?«
    rationale: »von einer Frau empfangen« ist im Deutschen keine natürliche Aussage über Empfängnis und verfehlt die beabsichtigte grammatische Pointe. »durch eine Frau empfangen« gibt den Zeugen unmittelbar wieder.
  - severity: medium
    issue: Runde Klammern bei den Aposteln und Nachfolgern wurden als eckige Klammern wiedergegeben.
    rationale: Dies verändert die im englischen POB-Zeugen überlieferte Kennzeichnung. Runde Klammern sind beizubehalten; eine Fußnote, die sie fälschlich als eckige Klammern beschreibt, ist zu entfernen.
  - severity: medium
    issue: Die Klammerung in »Mein [Vater, der im] Himmel [ist]« weicht vom Zeugen ab.
    rationale: Der Zeuge lautet »my [Father who is in] heaven«. Das zusätzliche, separat eingeklammerte »[ist]« ist keine gedeckte Ergänzung und verschiebt die Markierung der rekonstruierten Stelle.
  - severity: medium
    issue: Unmarkierte Ergänzung »es« in »bringt es in das Haus des Vaters«.
    rationale: Der englische Zeuge bietet an dieser beschädigten Stelle kein Objekt. Die deutsche Fassung darf die Lücke nicht stillschweigend schließen.
  revised_text: 'Einige sagen: »Maria empfing durch den Heiligen Geist.« Sie irren sich; sie wissen nicht, was sie sagen. Wann hat je eine Frau durch eine Frau empfangen? »Maria ist die Jungfrau, die keine Macht befleckt hat« – das ist das große Zeugnis jener Hebräer, die zu (den ersten) Aposteln und zu (den) apostolischen (Nachfolgern) wurden. Die Jungfrau, die keine Macht befleckt hat, […] die Mächte befleckten sich selbst.


    Und der Herr hätte nicht gesagt: »Mein [Vater, der im] Himmel«, wenn [er] nicht noch einen anderen Vater gehabt hätte. Stattdessen hätte er einfach gesagt: [»Mein Vater.«] Der Herr sagte zu den [Jüngern: »…] [aus] jedem [Haus] und bringt in das Haus des Vaters; doch stehlt nichts aus dem Haus des Vaters und tragt nichts daraus fort.«'
  revised_footnotes: []
  revision_rationale: Die Revision korrigiert die deutsche Rektion von »empfangen«, stellt die Klammerarten und -grenzen gemäß dem bereitgestellten englischen POB-Zeugen wieder her und entfernt eine unmarkierte inhaltliche Ergänzung. Die Polemik, die Mehrdeutigkeit von »Macht/Mächte« und die textkritisch sichtbaren Lücken bleiben unverändert erhalten.
