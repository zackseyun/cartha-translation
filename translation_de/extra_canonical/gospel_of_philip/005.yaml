    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: de
  text: 'Einige sagen: »Maria empfing durch den Heiligen Geist.« Sie irren sich; sie wissen nicht, was sie sagen. Wann hat je eine Frau von einer Frau empfangen? »Maria ist die Jungfrau, die keine Macht befleckt hat« – das ist das große Zeugnis jener Hebräer, die zu den [ersten] Aposteln und den [apostolischen Nachfolgern] wurden.[a] Die Jungfrau, die keine Macht befleckt hat, […] die Mächte befleckten sich selbst.


    Und der Herr hätte nicht gesagt: »Mein [Vater, der im] Himmel [ist]«, wenn [er] nicht noch einen anderen Vater gehabt hätte. Stattdessen hätte er einfach gesagt: [»Mein Vater.«] Der Herr sagte zu den [Jüngern: »…] [aus] jedem [Haus] und bringt es in das Haus des Vaters; doch stehlt nichts aus dem Haus des Vaters und tragt nichts daraus fort.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter »ersten« und »apostolischen Nachfolgern« stehen hier in eckigen Klammern, weil die zugrunde gelegte englische Zeugenübersetzung den Wortlaut beziehungsweise seine Ergänzung als unsicher kennzeichnet. Eine unmittelbare Prüfung des koptischen Textes steht noch aus.
    reason: Macht die ungewöhnliche Klammerung transparent und weist auf die vorläufige Quellenlage hin.
lexical_decisions:
- source_word: Holy Spirit
  choice: Heiliger Geist
  rationale: Die geläufige und würdevolle deutsche Entsprechung; die im Abschnitt vorausgesetzte grammatische Spannung bleibt im anschließenden Satz sichtbar.
- source_word: conceived
  choice: empfing / empfangen
  rationale: Im Zusammenhang der Schwangerschaft ist »empfangen« natürlich und bewahrt die Wortwiederholung des Zeugnisses.
- source_word: power / powers
  choice: Macht / Mächte
  rationale: Die einheitliche Wiedergabe erhält den bewussten Wechsel zwischen Singular und Plural und vermeidet eine vorschnelle Deutung als bloß menschliche Gewalten.
- source_word: defiled
  choice: befleckt
  rationale: »Befleckt« wahrt die kultische, sexuelle und moralische Bedeutungsbreite besser als eine eindeutiger interpretierende Formulierung.
- source_word: testimony
  choice: Zeugnis
  rationale: Entspricht dem religiös-rhetorischen Register und legt nicht fest, ob eine Aussage, Überlieferung oder Beweisführung gemeint ist.
- source_word: Father's house
  choice: Haus des Vaters
  rationale: Bewahrt die wiederholte Vater-Terminologie und die mögliche symbolische Bedeutung.
theological_decisions:
- issue: Polemik gegen die Aussage von der Empfängnis durch den Heiligen Geist
  choice: Die zugespitzte Argumentation wird ohne dogmatische Glättung wiedergegeben.
  alternative: Den Satz im Sinn einer bestimmten Lehre über Maria, den Geist oder eine himmlische Mutter erläutern.
  rationale: Der überlieferte Text erzeugt bewusst eine theologische und grammatische Spannung. Eine konfessionelle oder systematische Auflösung wäre nicht quellenneutral.
- issue: »keine Macht« und »die Mächte«
  choice: Singular und Plural sowie die Mehrdeutigkeit von »Macht/Mächten« bleiben erhalten.
  alternative: Mit »Herrscher«, »Gewalten« oder ausdrücklich »dämonische Mächte« übersetzen.
  rationale: Ohne abgeschlossene koptische Quellenprüfung sollte die mögliche kosmologische Bedeutung nicht enger festgelegt werden.
- issue: Der »andere Vater« des Herrn
  choice: Die Aussage bleibt wörtlich und spannungsvoll stehen.
  alternative: Zwischen irdischem und himmlischem Vater erklärend unterscheiden.
  rationale: Der beschädigte Zusammenhang erlaubt keine sichere dogmatische Präzisierung.
- issue: Beschädigte und ergänzte Textstellen
  choice: Eckige Klammern und Auslassungszeichen werden beibehalten.
  alternative: Die Lücken zu einem flüssigen, vollständigen Satz ergänzen.
  rationale: Der Grad der Unsicherheit und die handschriftliche Beschädigung müssen für Leser erkennbar bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Ton. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes vorläufig und folgt quellenbewusst dem bereitgestellten gemeinfreien englischen Textzeugen. Eckige Klammern und Ellipsen markieren überlieferungsbedingte Lücken oder Ergänzungen; sie wurden nicht stillschweigend geglättet.
