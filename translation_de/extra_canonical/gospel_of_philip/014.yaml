  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen ergänzte oder unsicher wiederhergestellte Wörter; Auslassungspunkte in eckigen Klammern zeigen beschädigten oder verlorenen Text an. In diesem Satz bleibt außerdem unklar, worauf „es“ sich bezieht.
    reason: Die Überlieferung ist fragmentarisch, und die pronominale Referenz darf nicht stillschweigend festgelegt werden.
  - marker: b
    text: Wörtlich steht hinter „Salbung“ der Begriff für das Chrisam beziehungsweise den Salbungsritus. Der Text setzt Licht, Salbung und Taufe bildhaft zueinander in Beziehung.
    reason: Der kultische Fachbegriff und das Wortspiel sind in einer einzigen natürlichen deutschen Entsprechung nicht vollständig darstellbar.
  - marker: c
    text: Das Pronomen in „seine Trennung“ kann sich grammatisch auf das Männliche beziehungsweise den Mann beziehen; inhaltlich ist wohl der Vorgang der Trennung gemeint.
    reason: Die Referenz ist im zugrunde gelegten Zeugnis nicht eindeutig.
  - marker: d
    text: Die Verbindung von „Leben“ und „Eva“ beruht auf einer alten etymologischen Deutung des Namens Eva. Der genaue Wortlaut dieser beschädigten Passage ist unsicher.
    reason: Erklärt die sonst schwer verständliche Parenthese, ohne die Lücke zu rekonstruieren.
lexical_decisions:
- source_word: bridal chamber
  choice: Brautgemach
  rationale: Bewahrt den wiederkehrenden sakral-symbolischen Leitbegriff und klingt würdiger sowie traditionsnäher als „Hochzeitszimmer“.
- source_word: chrism
  choice: Salbung
  rationale: Gibt den rituellen Sinn verständlich wieder; „Chrisam“ wäre enger stofflich und für viele Leser weniger zugänglich.
- source_word: powers
  choice: Mächte
  rationale: Erhält die mögliche kosmologische Bedeutung ebenso wie das Wortspiel mit menschlicher Kraft.
- source_word: rest
  choice: Ruhe
  rationale: Bewahrt den theologischen Schlüsselbegriff und seine Spannung zwischen Ruhe, Vollendung und eschatologischem Zustand.
- source_word: begotten
  choice: gezeugt
  rationale: Erhält die körperliche und zugleich theologische Bildsprache; „geboren“ würde die wiederholte Zeugungsmetaphorik abschwächen.
- source_word: redemption
  choice: Erlösung
  rationale: Ist im Deutschen der natürliche theologische Begriff und lässt den hier vorausgesetzten rituellen Sinn offen.
- source_word: image
  choice: Abbild
  rationale: Kennzeichnet eine abgeleitete Darstellung, ohne „Bild“ unnötig konkret oder „Ebenbild“ zu biblisch festgelegt wiederzugeben.
- source_word: contemplation
  choice: Schau
  rationale: Gibt den mystischen Erkenntnisakt knapp und traditionsfähig wieder, ohne ihn als bloßes Nachdenken zu verengen.
theological_decisions:
- issue: Die Vereinigung von Männlichem und Weiblichem als Überwindung des Todes
  choice: Die Aussagen werden wörtlich-symbolisch wiedergegeben, ohne sie psychologisch, sakramental oder kosmologisch festzulegen.
  alternative: Die Vereinigung ausdrücklich als Ehe, Taufe oder Wiederherstellung eines androgynen Urmenschen deuten.
  rationale: Der fragmentarische Text verbindet mehrere Bedeutungsebenen; eine eindeutige konfessionelle oder systematische Auslegung wäre nicht quellengerecht.
- issue: „Brautgemach“ als ritueller und eschatologischer Begriff
  choice: Der Leitbegriff bleibt unverändert und wird nicht erklärend paraphrasiert.
  alternative: Mit „Ehesakrament“, „himmlischer Vereinigung“ oder einer bestimmten Initiationsstufe übersetzen.
  rationale: Der Text bezeichnet offenbar ein Mysterium, legt dessen genaue rituelle oder theologische Gestalt hier aber nicht eindeutig fest.
- issue: Christologische Aussage über wahres Fleisch und Abbild
  choice: Die beschädigte und widersprüchlich wirkende Form bleibt mitsamt Lücken erhalten.
  alternative: Die Passage zu einer klar doketischen oder antidoketischen Aussage glätten.
  rationale: Die Überlieferung ist lückenhaft; eine Glättung würde die genuine Spannung beseitigen.
- issue: „Vater des Alls“ und die herabkommende Jungfrau
  choice: Die Bildfolge wird ohne Identifikation der Jungfrau oder des durch Feuer Erleuchteten übersetzt.
  alternative: Die Jungfrau ausdrücklich als Maria, Weisheit oder Geist bestimmen.
  rationale: Der vorliegende Wortlaut trägt keine sichere Identifikation.
- issue: Sklaven und Freie im Himmelreich
  choice: „Sklaven“ bleibt erhalten und die Umkehrung wird nicht moralisch abgeschwächt.
  alternative: Mit „Diener“ übersetzen, um die soziale Härte zu mindern.
  rationale: Die antithetische Aussage beruht gerade auf dem Statusgegensatz von Sklaven und Freien.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener mystischer und fragmentarischer Diktion. Wiederkehrende technische Begriffe werden möglichst einheitlich übersetzt. Eckige Klammern und […] bewahren Ergänzungen und Textverlust. Da eine direkte Prüfung am koptischen Codex noch aussteht, ist dies ein vorläufiger, am bereitgestellten öffentlichen englischen Zeugen orientierter Entwurf; unsichere Syntax und theologische Spannungen wurden nicht geglättet.
