  revised_text: 'Als Eva [in] Adam war, gab es den Tod nicht. Als sie sich von ihm trennte, entstand der Tod. Wenn er wieder [eintritt] und es für sich empfängt, wird es keinen Tod geben.[a]



    »[Mein] Gott, mein Gott, warum, Herr, [hast] du mich verlassen?« Dies sagte er am Kreuz, weil er dort geteilt wurde. […] dass er gezeugt wurde durch das, was […] von Gott. Das […] von den Toten […] existiert, aber […] er ist vollkommen […] aus Fleisch, doch dieses […] ist wahres Fleisch […] ist nicht wahr, [sondern …] Abbild des Wahren.



    Ein Brautgemach ist weder für Tiere noch für Sklaven noch für Unreine bestimmt, sondern für Freie und Jungfrauen.



    Wir werden durch den Heiligen Geist von Neuem gezeugt; durch Christus aber werden wir durch zwei Dinge gezeugt. Durch den Geist werden wir gesalbt. Als wir gezeugt wurden, wurden wir vereint.



    Ohne Licht kann niemand sich selbst im Wasser oder in einem Spiegel sehen; ebenso kannst du auch im Licht nichts sehen ohne Wasser oder Spiegel. Darum muss man in beidem getauft werden: im Licht und im Wasser. Das Licht aber ist die Salbung.[b]



    In Jerusalem gab es drei Opferhäuser. Das nach Westen hin geöffnete heißt »das Heilige«. Das andere, das nach Süden hin geöffnet ist, heißt »das Heilige des Heiligen«. Das dritte, das nach Osten hin geöffnet ist, heißt »das Heilige der Heiligen«; dort tritt allein der Hohepriester ein. Die Taufe ist das Haus »des Heiligen«. Die [Erlösung] ist »das Heilige des Heiligen«. »Das [Heilige] der Heiligen« ist das Brautgemach. Die [Taufe] schließt die Auferstehung [mit] der Erlösung ein. Die Erlösung ist im Brautgemach. Doch [das] Brautgemach ist besser als […] Du wirst sein […] nicht finden […] die beten […] Jerusalem. […] Jerusalem, die [… Jerusalem], indem es gesehen wird […] diese, die »[die Heiligen] der Heiligen« genannt werden [… der] Vorhang zerriss […] Brautgemach außer dem Abbild [… das] [oben ist. Daher] zerriss sein Vorhang von oben bis unten; denn einige von unten mussten nach oben hinaufsteigen.



    Die Mächte können diejenigen nicht sehen, die das vollkommene Licht angezogen haben, und sie können sie nicht binden. Dieses Licht aber zieht man im Geheimnis der Vereinigung an.



    Wäre das Weibliche nicht vom Männlichen getrennt worden, wäre es nicht zusammen mit dem Männlichen gestorben. Seine Trennung war der Anfang des Todes.[c] Darum kam Christus, um die seit dem Anfang bestehende Trennung zu heilen, indem er die beiden wieder vereint. Er wird denen, die infolge der Trennung starben, Leben geben, indem er sie vereint. Nun vereint sich die Frau mit ihrem Mann im Brautgemach, und diejenigen, die sich im Brautgemach vereint haben, werden nicht mehr getrennt werden. Darum trennte sich Eva von Adam: weil sie sich nicht mit ihm im Brautgemach vereinte.



    Durch einen Hauch entstand Adams Seele. Ihr Gefährte war der Geist. Was ihm gegeben wurde, war seine Mutter. Seine Seele wurde [genommen], und an ihrer Stelle wurde ihm [Leben] (Eva) gegeben.[d] Als er vereint wurde […] Worte, die besser waren als die Mächte, und sie beneideten ihn […] geistlicher Gefährte […] verborgen […] das heißt, die […] sich selbst […] Brautgemach, damit […] Jesus erschien [… der] Jordan, die [Fülle des Himmelreichs]. Der, der [gezeugt worden war], bevor alles von Neuem gezeugt wurde. Der, der [gesalbt worden war], zuerst von Neuem gesalbt. Der, der erlöst worden war, wurde von Neuem erlöst.



    Wenn man von einem Geheimnis sprechen muss: Der Vater des Alls vereinte sich mit der Jungfrau, die herabkam, und an jenem Tag erleuchtete ihn ein Feuer. Er offenbarte das große Brautgemach; so entstand an jenem Tag sein Leib. Er kam aus dem Brautgemach hervor wie der, der aus dem Bräutigam und der Braut entstand. Auf diese Weise richtete Jesus alles in sich selbst ein. Ebenso muss jeder der Jünger durch diese Dinge in seine Ruhe eingehen.



    Adam entstand aus zwei Jungfrauen: aus dem Geist und aus der jungfräulichen Erde. So wurde Christus von einer Jungfrau gezeugt, um den Fall zu berichtigen, der sich am Anfang ereignet hatte.



    Im Paradies wachsen zwei Bäume. Der eine zeugt [Tiere], der andere zeugt Menschen. Adam [aß] von dem Baum, der Tiere zeugte; [und er] wurde ein Tier und zeugte [Tiere]. Deshalb verehren Adams Kinder die [Tiere]. Der Baum […] ist Frucht […] dies sie […] aßen die […] Frucht des […] Menschen zeugen […] des Menschen von […] Gott macht den Menschen, [… Menschen] machen [Gott]. So ist es in der Welt: Menschen machen Götter und verehren ihre Schöpfung. Es wäre besser, wenn die Götter die Menschen verehrten!



    Die Wahrheit ist: Das Werk der Menschen geht aus ihrer Kraft hervor; deshalb werden sie »die Mächte« genannt. Ihre Werke sind ihre Kinder, die durch Ruhe entstehen. So zeigt sich ihre Kraft in ihren Werken, die Ruhe aber wird in ihren Kindern offenbar. Und du wirst feststellen, dass sich dies auch auf das Abbild erstreckt. So verhält es sich mit dem Menschen im Abbild: Er vollbringt seine Werke durch seine Kraft, seine Kinder aber zeugt er durch Ruhe.



