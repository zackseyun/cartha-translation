review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen im Wesentlichen zuverlässig. In der stark beschädigten Passage über die „Mächte“ ergänzt sie jedoch mit „und sie wollen“ sowie „keine Tiere würden“ syntaktische und semantische Verbindungen, die der Zeuge wegen der Lacunae nicht ausdrücklich bietet. Die Klammerergänzung [nicht] sollte dort stehen bleiben, wo sie der Zeuge ausweist. Die direkte Prüfung am koptischen Text steht laut Kontext noch aus; diese Beurteilung kann daher nur den englischen öffentlichen Zeugen kontrollieren.
  naturalness: Der Registerton ist klar, modern und dem Text angemessen. Einige Anpassungen erhöhen die idiomatische Präzision, ohne den feierlich-knappen Duktus zu glätten. Besonders „glaubten, sie täten, was sie taten“ gibt die Aussage über die Herrscher unmittelbarer wieder als die verschobene Perfektkonstruktion „sie hätten ... vollbracht“.
  terminology: „Herrscher“, „Mächte“, „der vollkommene Mensch“, „dargebracht“ und „Heiliger Geist“ sind konsistent und angemessen. Die unbestimmte Formulierung „Ein Mensch“ bewahrt die im Zeugen vorhandene Zurückhaltung. Für die beschädigte Stelle wird keine weitergehende Deutung über Opfer oder Tiere eingeführt.
  issues:
  - severity: high
    issue: Die beschädigte Mächte-Passage wird über den Zeugen hinaus geglättet und ergänzt.
    rationale: „und sie wollen“ setzt einen Anschluss nach der Lacuna voraus; „keine Tiere würden den Mächten dargebracht“ ergänzt zudem eine Negation und eine vollständige Aussage, die im englischen Zeugen nicht ausgeschrieben sind. Bei Textverlust müssen Ellipsen, eckige Klammern und die daraus resultierende Fragmentierung bewahrt werden.
  - severity: medium
    issue: Die Formulierung über das vermeintlich eigenmächtige Handeln der Herrscher verschiebt den Aspekt.
    rationale: „meinten, sie hätten ihr Tun ... vollbracht“ macht aus „thought they did what they did“ eine rückblickende Behauptung eines bereits vollendeten Werkes. „glaubten, sie täten, was sie taten“ entspricht dem wiederholenden und gleichzeitig kontrastierten Ausdruck genauer.
  - severity: low
    issue: Die Analogie zwischen Brotlosigkeit der Welt und dem Paradies kann enger markiert werden.
    rationale: „So wie ...“ stellt die im Zeugen ausdrücklich gesetzte Vergleichsverbindung natürlicher her als ein neuer Satz mit „Ebenso“.
  revised_text: 'Die Herrscher wollten die Menschheit täuschen, denn sie sahen, dass die Menschheit mit denen verwandt war, die wahrhaft gut sind. Sie nahmen den Namen der Guten und gaben ihn denen, die nicht gut sind, um die Menschheit durch die Namen zu täuschen und sie an diejenigen zu binden, die nicht gut sind. Und was für einen Gefallen erweisen sie ihnen dann! Sie nehmen sie von denen weg, die nicht gut sind, und versetzen sie unter die Guten. Die Herrscher wussten, was sie taten; denn sie wollten die Freien nehmen und für immer in die Sklaverei führen.



    Es gibt Mächte, die bestehen […] die Menschheit, da sie nicht wollen, dass sie [gerettet wird], damit sie […] denn wenn die Menschheit [gerettet würde], würden Opfer [nicht] stattfinden […] und den Mächten dargebrachte Tiere, denn diejenigen, denen Opfer dargebracht wurden, waren Tiere. Lebendig wurden sie dargebracht; doch als sie dargebracht waren, starben sie. Ein Mensch wurde Gott tot dargebracht – und er lebte.



    Bevor Christus kam, gab es kein Brot in der Welt – so wie das Paradies, wo Adam war, viele Bäume hatte, um die Tiere zu ernähren, aber keinen Weizen, um die Menschheit zu ernähren. Die Menschen ernährten sich wie die Tiere. Als aber Christus, der vollkommene Mensch, kam, brachte er Brot vom Himmel, damit die Menschheit mit der Nahrung des Menschen ernährt würde.



    Die Herrscher glaubten, sie täten, was sie taten, aus eigener Kraft und nach eigenem Willen. Doch der Heilige Geist bewirkte durch sie im Verborgenen alles, was er wollte. Die Wahrheit, die von Anfang an besteht, wird überall ausgesät. Viele sehen, wie sie ausgesät wird; aber nur wenige sehen, wie sie geerntet wird.'
  revised_footnotes: []
  revision_rationale: Die Revision beschränkt sich auf sichere Korrekturen. Sie bewahrt insbesondere die beschädigte Überlieferung als fragmentarisch, statt aus dem Kontext einen vollständigen Satz über das Ausbleiben von Tieropfern zu rekonstruieren. Die übrigen Änderungen verbessern die Nähe zum englischen Zeugen und die Satzbeziehungen im Deutschen, ohne die offenen theologischen oder kosmologischen Bezüge festzulegen.
