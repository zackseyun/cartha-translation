translation:
  language: de
  text: 'Die Herrscher wollten die Menschheit täuschen, denn sie sahen, dass die Menschheit mit denen verwandt war, die wahrhaft gut sind. Sie nahmen den Namen der Guten und gaben ihn denen, die nicht gut sind, um die Menschheit durch die Namen zu täuschen und sie an diejenigen zu binden, die nicht gut sind. Und was für einen Gefallen erweisen sie ihnen dann! Sie nehmen sie von denen weg, die nicht gut sind, und versetzen sie unter die Guten. Die Herrscher wussten, was sie taten; denn sie wollten die Freien nehmen und für immer in die Sklaverei führen.


    Es gibt Mächte, die […] die Menschheit, und sie wollen nicht, dass die Menschen [gerettet werden], damit sie […] Denn wenn die Menschheit [gerettet würde], gäbe es [keine] Opfer […] und keine Tiere würden den Mächten dargebracht. Denn diejenigen, denen Opfer dargebracht wurden, waren Tiere. Lebendig wurden sie dargebracht; doch als sie dargebracht waren, starben sie. Ein Mensch wurde Gott tot dargebracht – und er lebte.


    Bevor Christus kam, gab es kein Brot in der Welt. Ebenso gab es im Paradies, wo Adam war, viele Bäume, um die Tiere zu ernähren, aber keinen Weizen, um die Menschheit zu ernähren. Die Menschen ernährten sich wie die Tiere. Als aber Christus, der vollkommene Mensch, kam, brachte er Brot vom Himmel, damit die Menschheit mit der Nahrung des Menschen ernährt würde.


    Die Herrscher meinten, sie hätten ihr Tun aus eigener Kraft und nach eigenem Willen vollbracht. Doch der Heilige Geist führte durch sie im Verborgenen alles aus, was er wollte. Die Wahrheit, die von Anfang an besteht, wird überall ausgesät. Viele sehen, wie sie ausgesät wird; aber nur wenige sehen, wie sie geerntet wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rulers
  choice: Herrscher
  rationale: Gibt die kosmischen Machthaber des Textes neutral und traditionsnah wieder, ohne mit „Archonten“ unnötig einen Fachbegriff einzuführen.
- source_word: humanity
  choice: die Menschheit / die Menschen
  rationale: „Menschheit“ wahrt den kollektiven Sinn; „die Menschen“ wird punktuell verwendet, wo das Deutsche sonst unnatürlich oder der Bezug eines Pronomens unklar wäre.
- source_word: kinship
  choice: verwandt
  rationale: Bewahrt die Aussage einer Wesens- oder Herkunftsbeziehung, ohne sie als bloße Ähnlichkeit abzuschwächen.
- source_word: powers
  choice: Mächte
  rationale: Wahrt die Unterscheidung gegenüber den zuvor genannten „Herrschern“ und lässt die genaue Art dieser Mächte offen.
- source_word: perfect human
  choice: der vollkommene Mensch
  rationale: Gibt die anthropologische Christusbezeichnung wörtlich und ohne dogmatische Erweiterung wieder.
- source_word: food of humanity
  choice: Nahrung des Menschen
  rationale: Erhält den auffälligen Gegensatz zwischen tierischer Nahrung und der dem Menschen entsprechenden Nahrung.
- source_word: offered up
  choice: dargebracht
  rationale: Passt zum Opferkontext und bewahrt zugleich die mögliche christologische Anspielung des Satzes über den Menschen, der Gott tot dargebracht wurde.
theological_decisions:
- issue: Identität der „wahrhaft Guten“
  choice: „die wahrhaft gut sind“ / „die Guten“
  alternative: „die wahrhaft Guten“ als fest umrissene himmlische Wesenklasse
  rationale: Der Wortlaut lässt offen, ob Personen, Mächte oder eine metaphysische Gruppe gemeint sind; die Übersetzung bestimmt dies nicht näher.
- issue: Ironie in der Aussage über den erwiesenen Gefallen
  choice: 'Ausruf beibehalten: „Und was für einen Gefallen erweisen sie ihnen dann!“'
  alternative: Als sachliche oder eindeutig sarkastische Aussage umformulieren
  rationale: Der rhetorische und möglicherweise ironische Ton bleibt erhalten, ohne seine genaue Funktion festzulegen.
- issue: Der Gott tot dargebrachte Mensch
  choice: Unbestimmt „Ein Mensch“ und Tempusfolge „wurde … dargebracht – und er lebte“
  alternative: Explizit „Christus wurde … geopfert und wurde lebendig“
  rationale: Die wahrscheinliche christologische Beziehung wird nicht geleugnet, aber auch nicht expliziter gemacht als im vorliegenden Zeugnis.
- issue: Wirken des Heiligen Geistes durch die Herrscher
  choice: „führte durch sie im Verborgenen alles aus, was er wollte“
  alternative: Herrscher nur als unwissentlich zugelassene Werkzeuge darstellen
  rationale: Die Spannung zwischen dem Eigenwillen der Herrscher und dem verborgenen Wirken des Geistes wird ohne systematische Erklärung bewahrt.
- issue: Geschlecht des Heiligen Geistes
  choice: grammatisch maskulines Pronomen „er“
  alternative: „sie“ entsprechend einem möglichen femininen koptischen oder semitischen Hintergrund
  rationale: Im modernen Standarddeutsch verlangt „der Geist“ grammatisch „er“; daraus wird keine Aussage über ontologisches Geschlecht abgeleitet.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klaren Satzbezügen. Die vorhandenen eckigen Klammern und Auslassungszeichen wurden als Hinweise auf Textverlust beziehungsweise Ergänzungen des Zeugen bewahrt. Wegen der noch ausstehenden direkten Prüfung des koptischen Textes ist die Fassung ausdrücklich als vorläufiger, am angegebenen englischen Zeugen orientierter Entwurf zu behandeln.
