  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: de
  text: 'Eines Tages war Jesus mit seinen Jüngern in Judäa. Er fand sie beisammensitzend und ihre Frömmigkeit übend. Als er zu seinen Jüngern [hinzutrat], die beisammensaßen und über dem Brot beteten, lachte [er].


    Die Jünger sagten zu ihm: »Meister, warum lachst du über [unser] Gebet? Was haben wir getan? [Dies] ist doch richtig.«


    Er antwortete ihnen: »Ich lache nicht über euch. Ihr tut dies nicht aus eigenem Willen, sondern damit dadurch euer Gott [gepriesen wird].«


    Sie sagten: »Meister, du […] bist der Sohn unseres Gottes!«


    Jesus sagte zu ihnen: »Woher kennt [ihr] mich? Wahrlich, [ich] sage euch: Keine Generation des Volkes unter euch wird mich erkennen.«[a]


    Als seine Jünger das hörten, wurden [sie] zornig und gerieten in Wut; in ihren Herzen begannen sie, ihn zu verfluchen.


    Als Jesus aber ihre Unwissenheit bemerkte, [sagte er] zu ihnen: »Warum lasst ihr euch von eurem Zorn aufwühlen? Ist euer Gott in euch samt [seinen Sternen] über eure Seelen zornig geworden?[b] Wenn einer von euch unter den Menschen [stark genug] ist, den vollkommenen Menschen hervorzubringen, dann soll er aufstehen und mir gegenübertreten.«[c]


    Sie alle sagten: »Wir sind stark genug.« Doch ihre Geister waren nicht mutig genug, vor [ihn] zu treten – außer Judas Iskariot. Er konnte vor ihn treten, doch er vermochte ihm nicht in die Augen zu sehen und wandte seinen Blick ab.


    Judas [sagte] zu ihm: »Ich weiß, wer du bist und woher du gekommen bist. Du bist aus dem unvergänglichen Reich Barbelo gekommen,[d] und ich bin nicht würdig, den Namen dessen auszusprechen, der dich gesandt hat.«


    Da Jesus wusste, dass Judas an das Erhabene dachte, sagte er zu ihm: »Sondere dich von den anderen ab, dann werde ich dir die Geheimnisse des Reiches mitteilen. Nicht damit du dorthin gelangst; vielmehr wirst du viel Kummer haben, denn ein anderer wird an deine Stelle treten, damit die zwölf [Elemente] vor ihrem Gott vollständig werden.«[e]


    Judas sagte zu ihm: »Wann wirst du mir diese Dinge mitteilen, und wann wird für die Generation der große Tag des Lichts anbrechen […]?«


    Nachdem er dies gesagt hatte, verließ Jesus ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Generation« kann hier eine Menschengruppe, ein Geschlecht oder eine geistlich bestimmte Gemeinschaft bezeichnen.
    reason: Der wiederkehrende Ausdruck ist semantisch und theologisch mehrdeutig.
  - marker: b
    text: Der Satz über »euren Gott in euch« und »seine Sterne« ist im beschädigten Text syntaktisch unsicher.
    reason: Kennzeichnet eine Unsicherheit, die sich anhand des vorgelegten englischen Zeugen nicht zuverlässig lösen lässt.
  - marker: c
    text: 'Wörtlich sinngemäß: »die vollkommene Menschheit/den vollkommenen Menschen hervorbringen«; die Wendung kann anthropologisch oder als Fachausdruck gemeint sein.'
    reason: Die englische Großschreibung »Humanity« deutet einen möglichen terminologischen Sinn an, beweist ihn aber nicht.
  - marker: d
    text: Barbelo ist in manchen spätantiken religiösen Texten der Name einer erhabenen himmlischen Wirklichkeit oder Gestalt.
    reason: Der Eigenname ist heutigen Leserinnen und Lesern meist unbekannt, sollte aber nicht paraphrasiert werden.
  - marker: e
    text: »Elemente« steht in eckigen Klammern, weil das betreffende Wort ergänzt ist; worauf »die zwölf« genau verweist, bleibt unsicher.
    reason: Bewahrt das Signal der Textrekonstruktion und verhindert eine voreilige Festlegung.
lexical_decisions:
- source_word: practicing their piety
  choice: ihre Frömmigkeit übend
  rationale: Bewahrt den möglicherweise kritischen religiösen Sinn, ohne ihn als bloße Heuchelei auszulegen.
- source_word: praying over the bread
  choice: über dem Brot beteten
  rationale: Gibt die räumlich-rituelle Formulierung wieder, ohne vorschnell eine bestimmte Mahl- oder Eucharistielehre einzutragen.
- source_word: generation
  choice: Generation
  rationale: Der im Judasevangelium theologisch aufgeladene und mehrdeutige Gruppenbegriff bleibt erkennbar; »Geschlecht« wäre im modernen Deutsch missverständlich.
- source_word: perfect Humanity
  choice: den vollkommenen Menschen
  rationale: Natürliches Deutsch, das sowohl eine ideale Menschengestalt als auch einen anthropologischen Fachbegriff zulässt.
- source_word: immortal realm of Barbelo
  choice: unvergängliches Reich Barbelo
  rationale: Barbelo bleibt als Eigenname unverändert; »unvergänglich« vermeidet die Vorstellung, ein räumliches Reich selbst sei biologisch unsterblich.
- source_word: mysteries of the kingdom
  choice: Geheimnisse des Reiches
  rationale: Bewahrt die religiöse Terminologie, ohne »Mysterien« unnötig als festes Ritualsystem festzulegen.
- source_word: complete the twelve [elements]
  choice: damit die zwölf [Elemente] ... vollständig werden
  rationale: Erhält die ergänzte, im beschädigten Text unsichere Bezugsgröße und vermeidet eine eindeutige Identifikation mit Aposteln.
theological_decisions:
- issue: Bezeichnung »euer Gott«
  choice: euer Gott
  alternative: Gott
  rationale: Die distanzierende Formulierung des Zeugen wird bewahrt und nicht mit einer kanonisch-christlichen Gottesbezeichnung harmonisiert.
- issue: Erkenntnis Jesu durch eine Generation
  choice: Keine Generation des Volkes unter euch wird mich erkennen
  alternative: Kein Geschlecht der Menschen unter euch wird mich kennen
  rationale: Die kollektive und möglicherweise eschatologische Spannung bleibt erhalten; »erkennen« kann mehr als bloße Bekanntschaft ausdrücken.
- issue: Gott und Sterne im Inneren der Jünger
  choice: euer Gott in euch samt [seinen Sternen]
  alternative: euer Gott, der in euch ist, und [seine Sterne]
  rationale: Die syntaktische Mehrdeutigkeit des beschädigten Zeugnisses wird nicht durch eine spekulative kosmologische Deutung beseitigt.
- issue: Judas' Zugang zum Reich
  choice: Nicht damit du dorthin gelangst; vielmehr wirst du viel Kummer haben
  alternative: Du wirst dorthin gelangen, aber großen Kummer haben
  rationale: Folgt dem vorgelegten Zeugen, obwohl der Satz theologisch und textkritisch schwierig ist; die negative Aussage wird nicht geglättet.
- issue: Ersetzung des Judas und die Zwölf
  choice: ein anderer wird an deine Stelle treten, damit die zwölf [Elemente] ... vollständig werden
  alternative: ein anderer wird dich ersetzen, um die zwölf Jünger zu vervollständigen
  rationale: Vermeidet die nicht ausdrücklich gesicherte Identifikation der ergänzten »Elemente« mit den zwölf Jüngern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Eckige Klammern und Auslassungspunkte bewahren sämtliche im Zeugen markierten Ergänzungen und Lücken. Da eine direkte Prüfung des koptischen Textes ausdrücklich noch aussteht, ist der Entwurf als quellenbewusste, aber vorläufige Übersetzung des öffentlichen englischen Zeugen formuliert; beschädigte oder theologisch gespannte Stellen wurden nicht harmonisiert.
