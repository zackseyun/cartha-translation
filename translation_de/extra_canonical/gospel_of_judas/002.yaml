review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem vorgelegten englischen Zeugen insgesamt zuverlässig und erhält Ergänzungen in eckigen Klammern, die Textlücke sowie die bewusst nicht harmonisierten Aussagen über »euren Gott«, Barbelo und Judas. Einige Formulierungen lassen sich jedoch näher am Zeugen und zugleich idiomatischer fassen, insbesondere bei Barbelos »realm« und bei Judas' Denken über »what is exalted«. Eine unmittelbare koptische Kontrolle ist anhand des bereitgestellten Materials weiterhin nicht möglich.
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. »ihre Frömmigkeit übend«, »an das Erhabene dachte« und »Sondere dich ... ab« wirken jedoch unnötig steif oder treffen die jeweilige Aussage nicht ganz präzise. Die Revision verwendet natürlichere Formulierungen ohne Bedeutungsvereinfachung.
  terminology: Die Begriffe »Generation«, »vollkommener Mensch«, »Reich«, »Geheimnisse« und »[Elemente]« bleiben vorsichtig und ohne konfessionelle Harmonisierung wiedergegeben. »Reich Barbelos« stellt die im Zeugen ausgedrückte Zugehörigkeit des Bereichs zu Barbelo sprachlich korrekt dar. Die erläuternden Anmerkungen bleiben angemessen zurückhaltend.
  issues:
  - severity: low
    issue: Unidiomatische Wiedergabe der Frömmigkeitspraxis
    rationale: »ihre Frömmigkeit übend« ist verständlich, aber im modernen Deutsch weniger natürlich als »bei der Ausübung ihrer Frömmigkeit«.
  - severity: medium
    issue: Zu ungenaue Beziehung von Barbelo und dem Reich
    rationale: »immortal realm of Barbelo« bezeichnet das Reich Barbelos; »Reich Barbelo« lässt die genitivische Zuordnung im Deutschen aus.
  - severity: low
    issue: Wiedergabe von »thinking about what is exalted«
    rationale: »an das Erhabene dachte« klingt im Deutschen eher wie eine bloße Erinnerung; »über das Erhabene nachdachte« gibt den gedanklichen Vorgang präziser wieder.
  - severity: low
    issue: Leicht übertragene Aufforderung an Judas
    rationale: »Sondere dich von den anderen ab« ist stärker und formeller als das schlichte »Come away from the others«. »Geh von den anderen weg« wahrt die Aufforderung ohne zusätzliche soziale oder religiöse Konnotation.
  revised_text: 'Eines Tages war Jesus mit seinen Jüngern in Judäa. Er fand sie beisammensitzend, bei der Ausübung ihrer Frömmigkeit. Als er zu seinen Jüngern [hinzutrat], die beisammensaßen und über dem Brot beteten, lachte [er].


    Die Jünger sagten zu ihm: »Meister, warum lachst du über [unser] Gebet? Was haben wir getan? [Dies] ist doch richtig.«


    Er antwortete ihnen: »Ich lache nicht über euch. Ihr tut dies nicht, weil ihr es wollt, sondern damit dadurch euer Gott [gepriesen wird].«


    Sie sagten: »Meister, du […] bist der Sohn unseres Gottes!«


    Jesus sagte zu ihnen: »Woher kennt [ihr] mich? Wahrlich, [ich] sage euch: Keine Generation der Menschen unter euch wird mich erkennen.«[a]


    Als seine Jünger das hörten, wurden [sie] zornig und gerieten in Wut; sie begannen, ihn in ihren Herzen zu verfluchen.


    Als Jesus aber ihre Unwissenheit bemerkte, [sagte er] zu ihnen: »Warum lasst ihr euch von eurem Zorn aufwühlen? Ist euer Gott in euch samt [seinen Sternen] über eure Seelen zornig geworden?[b] Wenn einer von euch unter den Menschen [stark genug] ist, den vollkommenen Menschen hervorzubringen, dann soll er aufstehen und sich mir stellen.«[c]


    Sie alle sagten: »Wir sind stark genug.« Doch ihre Geister waren nicht mutig genug, vor [ihn] zu treten – außer Judas Iskariot. Er konnte vor ihn treten, doch er vermochte ihm nicht in die Augen zu sehen und wandte seinen Blick ab.


    Judas [sagte] zu ihm: »Ich weiß, wer du bist und woher du gekommen bist. Du bist aus dem unvergänglichen Reich Barbelos gekommen,[d] und ich bin nicht würdig, den Namen dessen auszusprechen, der dich gesandt hat.«


    Da Jesus wusste, dass Judas über das Erhabene nachdachte, sagte er zu ihm: »Geh von den anderen weg, dann werde ich dir die Geheimnisse des Reiches mitteilen. Nicht damit du dorthin gelangst; vielmehr wirst du viel Kummer haben, denn ein anderer wird an deine Stelle treten, damit die zwölf [Elemente] vor ihrem Gott vollständig werden.«[e]


    Judas sagte zu ihm: »Wann wirst du mir diese Dinge mitteilen, und wann wird für die Generation der große Tag des Lichts anbrechen […]?«


    Nachdem er dies gesagt hatte, verließ Jesus ihn.'
