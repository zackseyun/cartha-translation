translation:
  language: de
  text: 'An einem anderen Tag kam Jesus zu ihnen. Sie sagten zu ihm: »Meister, wir haben dich in einem Traum gesehen, denn letzte Nacht hatten wir große [Träume].«


    Jesus aber sagte: »Warum habt ihr […] euch verborgen?«


    Da [sagten] sie: »[Wir sahen] ein großes [Haus mit einem großen] Altar [darin und] zwölf Menschen – wir würden sagen, dass sie Priester waren – und einen Namen. Eine Menschenmenge wartete am Altar, [bis] die Priester [mit der Entgegennahme] der Opfergaben [fertig waren]. Auch wir warteten weiter.«


    [Jesus sagte]: »Wie waren sie?«


    Sie antworteten: »[Einige] fasten [zwei] Wochen lang. Andere opfern ihre eigenen Kinder, andere ihre Frauen; dabei preisen sie einander und erniedrigen sich voreinander. Andere schlafen mit Männern, andere morden, und wieder andere begehen viele Sünden und verüben Verbrechen. [Und] die Menschen, die [vor] dem Altar stehen, rufen deinen [Namen] an! Bei all ihren Opfern füllen sie den [Altar] mit ihren Gaben.« Als sie dies gesagt hatten, [schwiegen] sie, denn sie waren beunruhigt.


    Jesus sagte zu ihnen: »Warum seid ihr beunruhigt? Wahrlich, ich sage euch: Alle Priester, die vor diesem Altar stehen, rufen meinen Namen an. Und [noch einmal] sage ich euch: Mein Name ist von den Menschengeschlechtern auf dieses [Haus] der Geschlechter der Sterne geschrieben worden.[a] [Und sie] haben schändlich in meinem Namen Bäume gepflanzt, die keine Frucht tragen.« Jesus sagte zu ihnen: »Ihr seid es, die die Opfergaben auf dem Altar entgegennehmen, den ihr gesehen habt. Das ist der Gott, dem ihr dient, und ihr seid die zwölf Menschen, die ihr gesehen habt. Die Tiere, die ihr zur Opferung herbeigebracht saht, sind die Menschenmenge, die ihr vor diesem Altar in die Irre führt. [Euer Diener] wird auftreten und meinen Namen auf diese Weise gebrauchen, und [die] Geschlechter der Frommen werden ihm treu sein. Nach ihm wird ein anderer [die sexuell Ausschweifenden] darbringen, ein anderer diejenigen, die Kinder ermorden, ein anderer diejenigen, die mit Männern schlafen, ferner diejenigen,
    die fasten, und den ganzen Rest an Unreinheit, Verbrechen und Irrtum. Und diejenigen, die sagen: ›Wir sind den Engeln gleich‹ – sie sind die Sterne, die alles vollenden.[b] Den Menschengeschlechtern ist gesagt worden: ›Seht, Gott hat euer Opfer aus den Händen von Priestern angenommen‹ – das heißt: aus der Hand des Dieners des Irrtums. Doch der Herr, der gebietet, ist der Herr über alles. Am letzten Tag werden sie für schuldig befunden werden.«


    Jesus sagte [zu ihnen]: »Hört auf, [Tiere zu opfern]. Ihr habt [sie] über dem Altar [dargebracht], über euren Sternen mit euren Engeln, wo sie bereits vollendet worden sind.[c] So sollen sie […] mit euch werden, und sie sollen [deutlich] werden.«


    Seine Jünger [sagten zu ihm]: »Reinige uns von unseren [Sünden], die wir infolge der Täuschung durch die Engel begangen haben.«


    Jesus sagte zu ihnen: »Es ist nicht möglich […]; ebenso wenig [kann] eine Quelle das Feuer der ganzen bewohnten Welt löschen. Auch kann der Brunnen [einer Stadt] nicht alle Geschlechter versorgen – außer der große, beständige.[d] Eine einzige Lampe wird nicht alle Reiche erleuchten – außer dem zweiten Geschlecht[e] –, und ein Bäcker kann nicht die ganze Schöpfung unter dem [Himmel] ernähren.«


    [Als die Jünger] dies [hörten], sagten sie zu [ihm]: »Meister, hilf uns und rette uns!«


    Jesus sagte zu ihnen: »Hört auf, gegen mich anzukämpfen. Jeder von euch hat seinen eigenen Stern, [und …] von den Sternen wird […] das, was ihm gehört […] Ich bin nicht zu dem vergänglichen Geschlecht gesandt worden, sondern zu dem starken und unvergänglichen Geschlecht. Denn kein Feind hat über jenes Geschlecht geherrscht, auch keiner der Sterne. Wahrlich, ich sage euch: Die Feuersäule wird bald fallen, und jenes Geschlecht wird von den Sternen nicht erschüttert werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wortfolge über das »Haus«, die »Geschlechter der Sterne« und die »Menschengeschlechter« ist im überlieferten Text schwer verständlich; die Übersetzung wahrt ihre Mehrdeutigkeit.
    reason: Kennzeichnet eine syntaktisch und kosmologisch unsichere Passage, deren direkte Prüfung am Koptischen noch aussteht.
  - marker: b
    text: 'Oder: »die alles zu Ende bringen«. Was oder wen die »Sterne« bezeichnen und was sie vollenden, bleibt offen.'
    reason: Bewahrt die semantische Offenheit von »finish everything« und vermeidet eine kosmologische Festlegung.
  - marker: c
    text: Der Satz ist wegen Textlücken und unklarer Bezüge unsicher; insbesondere kann nicht sicher bestimmt werden, worauf sich »sie« und »wo« beziehen.
    reason: Warnt vor Scheingenauigkeit in einer beschädigten Passage.
  - marker: d
    text: Die Verbindung »außer der große, beständige« ist grammatisch und inhaltlich unklar; ein ausgelassenes Bezugswort ist möglich.
    reason: Macht eine im Zeugnis selbst erkennbare Ellipse transparent.
  - marker: e
    text: Die Wendung »außer dem zweiten Geschlecht« bleibt rätselhaft und wird nicht erklärend aufgelöst.
    reason: Erhält die genuine kosmologische bzw. gruppenbezogene Mehrdeutigkeit.
lexical_decisions:
- source_word: Master
  choice: Meister
  rationale: Bewahrt die respektvolle Anrede des Zeugnisses in natürlichem, traditionsfähigem Deutsch.
- source_word: generation(s)
  choice: Geschlecht(er)
  rationale: Der Text verwendet den Ausdruck sowohl für menschliche Gruppen als auch für kosmologisch bestimmte Ordnungen; »Geschlecht« hält diese wiederkehrende Terminologie zusammen, ohne sie als bloße Alterskohorte zu verengen.
- source_word: minister
  choice: Diener
  rationale: »Diener« wahrt die mögliche kultische oder leitende Funktion, ohne vorschnell ein bestimmtes kirchliches Amt einzutragen.
- source_word: inhabited world
  choice: bewohnte Welt
  rationale: Gibt den kosmographischen Umfang formal wieder und vermeidet die Verengung auf eine einzelne Gesellschaft.
- source_word: realms
  choice: Reiche
  rationale: Bewahrt die kosmologische Mehrzahl und bleibt für heutige Leser verständlich.
- source_word: corruptible / incorruptible
  choice: vergänglich / unvergänglich
  rationale: Gibt den Gegensatz als Existenzweise wieder; »verderblich« könnte im Deutschen primär moralisch verstanden werden.
- source_word: sleep with men
  choice: mit Männern schlafen
  rationale: Folgt der konkreten, nicht weiter ausgedeuteten Formulierung des englischen Zeugnisses und vermeidet zusätzliche Identitätskategorien.
- source_word: stable
  choice: beständig
  rationale: »Beständig« trägt den Sinn von Festigkeit und Dauer, ohne die rätselhafte Bildsprache zu erklären.
theological_decisions:
- issue: Identität des Gottes am Altar
  choice: »Das ist der Gott, dem ihr dient«
  alternative: »Das ist euer Gott«
  rationale: Die gewählte Form hält die polemische Identifikation des Zeugnisses fest, ohne über ihren genauen metaphysischen Gehalt hinauszugehen.
- issue: Kosmologische »Sterne« und menschliche Geschlechter
  choice: Wiederkehrende Bezeichnungen wörtlich und ohne erklärende Harmonisierung beibehalten
  alternative: Sterne als Engel, Schicksalsmächte oder Herrscher auslegen
  rationale: Der Abschnitt setzt Sterne, Engel und Geschlechter in ein spannungsvolles Verhältnis; eine eindeutige Gleichsetzung wäre mangels koptischer Prüfung und wegen der beschädigten Überlieferung zu spekulativ.
- issue: Der »Herr, der gebietet«
  choice: »der Herr, der gebietet, ist der Herr über alles«
  alternative: Den ersten »Herrn« ausdrücklich als höchsten Gott identifizieren
  rationale: Die Aussage wird in ihrer überlieferten Spannung bewahrt, ohne eine systematische Gotteslehre einzutragen.
- issue: Sendung zum unvergänglichen Geschlecht
  choice: Exklusive Formulierung des Zeugnisses unverändert wiedergeben
  alternative: Als allgemeine Heilszusage paraphrasieren
  rationale: Der Text kontrastiert ausdrücklich ein vergängliches und ein unvergängliches Geschlecht; diese theologische Spannung darf nicht geglättet werden.
- issue: Täuschung durch die Engel
  choice: Als Aussage der Jünger stehen lassen
  alternative: Die Engel ausdrücklich als böse Mächte kennzeichnen
  rationale: Der Text nennt eine Täuschung, liefert hier aber keine vollständige Engellehre; zusätzliche Wertungen wären interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Eckige Klammern und Auslassungspunkte bewahren Ergänzungen und Beschädigungssignale des vorgelegten öffentlichen englischen Zeugnisses. Da die direkte Prüfung des koptischen Textes von Codex Tchacos 3 noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorläufig; unklare Syntax und kosmologische Begriffe wurden nicht konfessionell oder systematisch harmonisiert.
