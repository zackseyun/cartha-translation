  yaml_path: translation/extra_canonical/gospel_of_judas/003.yaml
  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: de
  text: 'Am nächsten Morgen erschien er seinen Jüngern. [Und] sie sagten zu ihm: „Meister, wohin bist [du] gegangen, und was hast du getan, nachdem du uns verlassen hattest?“


    Jesus sagte zu ihnen: „Ich bin zu einem anderen großen und heiligen Geschlecht gegangen.“


    Seine Jünger sagten zu ihm: „Herr, welches große Geschlecht ist besser und heiliger als wir und befindet sich nicht in diesen Bereichen?“


    Als Jesus das hörte, lachte er. Er sagte zu ihnen: „Warum fragt ihr euch in euren Herzen nach dem starken und heiligen Geschlecht? Wahrlich, ich sage euch: Niemand, der [aus] diesem Bereich geboren ist, wird jenes [Geschlecht] sehen. Kein Heer von Engeln aus den Sternen wird über es herrschen, und kein sterblich geborener Mensch wird sich ihm anschließen können. Denn jenes Geschlecht stammt nicht aus […] das geworden ist […] das Geschlecht der Menschen unter [ihnen] stammt aus dem Geschlecht der großen Menschen […] die mächtigen Herrschaften, die […] noch die Mächte […] jene, durch die ihr herrscht.“[a]


    Als seine Jünger dies hörten, wurde jeder von ihnen in seinem Geist beunruhigt. Sie konnten nichts sagen.'
