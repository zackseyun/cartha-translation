review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem vorliegenden englischen Zeugen im Wesentlichen eng und bewahrt die eckigen Klammern sowie die Textlücken. Einzelne Formulierungen geben jedoch den Satzbau der Vorlage unnötig unklar bzw. im Deutschen missverständlich wieder, besonders in der Frage der Jünger und im stark beschädigten Schlusssatz.
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. „befindet sich nicht in diesen Bereichen“ ist in der vorliegenden Frage syntaktisch schwerfällig; „fragt ihr euch ... nach“ ist weniger idiomatisch als „grübelt ... über“. „noch die Mächte“ ist an dieser Stelle im Deutschen semantisch falsch, da es ein fortdauerndes „noch“ statt eines ausschließenden „auch nicht“ nahelegt.
  terminology: „Geschlecht“ ist als offene Wiedergabe von „generation“ vertretbar und bewahrt die mögliche kollektive bzw. herkunftsbezogene Bedeutung. „Bereiche“, „stark“, „Heer von Engeln aus den Sternen“ und „Geist“ legen keine bestimmte kosmologische oder konfessionelle Deutung fest.
  issues:
  - severity: medium
    issue: Die Frage nach dem Geschlecht ist im Deutschen syntaktisch und semantisch unnötig holprig.
    rationale: „Welches große Geschlecht ist besser und heiliger als wir und befindet sich nicht in diesen Bereichen?“ lässt „welches“ zugleich als Subjekt von „befindet sich“ erscheinen und verschiebt die Relativbestimmung. Die Vorlage fragt nach einem Geschlecht, das nicht in diesen Bereichen ist.
  - severity: low
    issue: „Warum fragt ihr euch in euren Herzen nach ...?“ ist nicht die natürlichste deutsche Wiedergabe.
    rationale: Für inneres Fragen bzw. Grübeln „über etwas grübeln“ ist idiomatischer und wahrt die Bedeutungsweite der Vorlage.
  - severity: medium
    issue: „noch die Mächte“ verfälscht die ausschließende Verknüpfung im fragmentarischen Satzende.
    rationale: Das englische „nor the powers“ verlangt, soweit die beschädigte Syntax überhaupt übersetzbar ist, „auch nicht die Mächte“, nicht ein zeitliches „noch“.
  revised_text: 'Am nächsten Morgen erschien er seinen Jüngern. [Und] sie sagten zu ihm: „Meister, wohin bist [du] gegangen, und was hast du getan, als du uns verlassen hattest?“


    Jesus sagte zu ihnen: „Ich bin zu einem anderen großen und heiligen Geschlecht gegangen.“


    Seine Jünger sagten zu ihm: „Herr, welches große Geschlecht, das nicht in diesen Bereichen ist, ist besser und heiliger als wir?“


    Als Jesus das hörte, lachte er. Er sagte zu ihnen: „Warum grübelt ihr in euren Herzen über das starke und heilige Geschlecht? Wahrlich, ich sage euch: Niemand, der [aus] diesem Bereich geboren ist, wird jenes [Geschlecht] sehen. Kein Heer von Engeln aus den Sternen wird über es herrschen, und kein Mensch sterblicher Geburt wird sich ihm anschließen können. Denn jenes Geschlecht stammt nicht aus […] das geworden ist […] das Geschlecht der Menschen unter [ihnen] stammt aus dem Geschlecht der großen Menschen […] die mächtigen Herrschaften, die […] auch nicht die Mächte […] jene, durch die ihr herrscht.“[a]


    Als seine Jünger dies hörten, war jeder von ihnen in seinem Geist beunruhigt. Sie konnten nichts sagen.'
