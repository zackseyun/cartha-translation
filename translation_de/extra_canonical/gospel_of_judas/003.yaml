    text: Die eckigen Klammern kennzeichnen ergänzten oder unsicher wiederhergestellten Text; […] bezeichnet eine Lücke im beschädigten Manuskript. Der Satz nach „stammt nicht aus“ ist nur bruchstückhaft erhalten, sodass sein genauer Zusammenhang unklar bleibt.
    reason: Die zahlreichen Schäden und Ergänzungen müssen sichtbar bleiben, damit die fragmentarische Überlieferung nicht als sicherer fortlaufender Text erscheint.
lexical_decisions:
- source_word: generation
  choice: Geschlecht
  rationale: „Geschlecht“ bewahrt hier eher als „Generation“ die mögliche Bedeutung einer geistigen oder wesensmäßigen Menschengruppe beziehungsweise Abstammungslinie; eine bloße Alterskohorte wäre im Deutschen irreführend.
- source_word: realms
  choice: Bereiche
  rationale: Die kosmologische Bedeutung bleibt bewusst offen. „Bereiche“ ist verständlich und legt sich weniger stark als „Sphären“ oder „Äonen“ auf ein bestimmtes gnostisches System fest.
- source_word: strong
  choice: stark
  rationale: Die direkte Wiedergabe erhält die ungewöhnliche Charakterisierung, ohne sie deutend zu „mächtig“ oder „auserwählt“ umzuschreiben.
- source_word: army of angels from the stars
  choice: Heer von Engeln aus den Sternen
  rationale: Die bildhafte kosmologische Formulierung wird eng am überlieferten Zeugen wiedergegeben; die Beziehung der Engel zu den Sternen wird nicht näher bestimmt.
- source_word: mortal-born person
  choice: sterblich geborener Mensch
  rationale: Die etwas fremdartige Formulierung bewahrt den Gegensatz zwischen sterblicher Herkunft und dem heiligen Geschlecht.
- source_word: join it
  choice: sich ihm anschließen
  rationale: Diese Wiedergabe lässt offen, ob Zugehörigkeit, Eintritt oder Vereinigung gemeint ist.
- source_word: spirit
  choice: Geist
  rationale: „Geist“ erhält die anthropologische und möglicherweise religiöse Bedeutungsweite des Ausdrucks; „Inneres“ wäre stärker deutend.
theological_decisions:
- issue: Wesen des „großen und heiligen Geschlechts“
  choice: Als „Geschlecht“ bezeichnet, ohne seine Identität oder ontologische Herkunft zu erklären
  alternative: „Generation“, „Volk“ oder „Geschlecht der Erwählten“
  rationale: Der beschädigte Text und die kosmologische Sprache erlauben keine sichere Festlegung. Insbesondere wird keine Erwählungslehre in den Text eingeführt.
- issue: Kosmologische „Bereiche“
  choice: Neutral als „Bereiche“ wiedergegeben
  alternative: „Welten“, „Sphären“ oder „Äonen“
  rationale: Der vorliegende englische Zeuge bietet keine hinreichende Grundlage, eine bestimmte antike Kosmologie terminologisch festzuschreiben.
- issue: Herrschaft der Jünger durch Mächte
  choice: Die syntaktisch beschädigte Aussage bleibt fragmentarisch und mehrdeutig
  alternative: Rekonstruktion einer eindeutigen Anklage gegen die Jünger oder kosmischen Herrscher
  rationale: Eine geglättete Rekonstruktion würde die großen Lücken verdecken und könnte eine theologische Deutung unberechtigt festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht fremdartiger kosmologischer Ausdrucksweise. Die Vorlage ist nur über den angegebenen gemeinfreien englischen Übersetzungszeugen ausgewertet; eine unmittelbare Prüfung des koptischen Textes steht aus. Eckige Klammern und Auslassungspunkte wurden als textkritische Signale bewahrt.
