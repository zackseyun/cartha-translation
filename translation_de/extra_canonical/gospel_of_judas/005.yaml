  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: de
  text: 'Als Jesus dies [gesagt] hatte, ging er fort und [nahm] Judas Iskariot mit sich. Er sagte zu ihm: „Das Wasser auf dem erhabenen Berg ist [von] […] Es kam nicht, um [zu bewässern … den Brunnen] des Baumes der [Frucht …] dieses Reiches […] nach einer Zeit […], sondern es kam, um Gottes Paradies und die unvergängliche [Frucht] zu bewässern; denn [es] wird den [Lebenswandel] jener Generation nicht verderben, sondern [es wird] in alle Ewigkeit [bestehen].“[a]


    Judas sagte zu [ihm: „Sag] mir: Was für eine Frucht hat diese Generation?“


    Jesus sagte: „Die Seelen jeder menschlichen Generation werden sterben. Wenn jedoch diese Menschen ihre Zeit im Königreich vollendet haben und der Geist sie verlässt, werden ihre Körper sterben; ihre Seelen aber werden leben und emporgehoben werden.“


    Judas sagte: „Was werden die übrigen menschlichen Generationen tun?“


    Jesus sagte: „Man kann nicht auf [Fels] säen und dessen Frucht ernten. Ebenso kann man nicht auf das [befleckte] Geschlecht säen, zusammen mit der vergänglichen Weisheit [und] der Hand, die sterbliche Menschen erschaffen hat, damit ihre Seelen zu den oberen Reichen aufsteigen. [Wahrlich], ich sage dir: [Kein Herrscher], kein Engel [und] keine Macht wird die [Orte] sehen können, die [diese große], heilige Generation [sehen wird].“[b] Als Jesus dies gesagt hatte, ging er fort.


    Judas sagte: „Meister, so wie du ihnen allen zugehört hast, höre nun auch mir zu; denn ich habe eine große Vision gesehen.“


    Als Jesus das hörte, lachte er. Er sagte zu ihm: „Warum bist du so aufgebracht, du dreizehnter Dämon? Doch sprich; ich werde dich ertragen.“[c]


    Judas sagte zu ihm: „In der Vision sah ich mich selbst. Die zwölf Jünger steinigten mich und verfolgten [mich rasch]. Auch kam ich an den Ort, an dem [ich dir gefolgt war]. Ich sah [an diesem Ort ein Haus], und meine Augen konnten seine Größe nicht [ermessen]. Bedeutende Menschen umgaben es, und das Haus hatte ein Dach aus Grün. In der Mitte des Hauses befand sich [eine Menschenmenge …]. Meister, nimm mich bei diesen Menschen auf!“[d]


    [Jesus] antwortete: „Dein Stern hat dich in die Irre geführt, Judas.“ Und er sagte: „Kein sterblich geborener Mensch ist würdig, das Haus zu betreten, das du gesehen hast; denn jener Ort ist denen vorbehalten, die heilig sind. Dort werden weder Sonne noch Mond noch der Tag herrschen. Vielmehr werden die Heiligen für immer im Reich bei den heiligen Engeln stehen. Sieh, ich habe dir die Geheimnisse des Königreichs mitgeteilt und dich über den Irrtum der Sterne belehrt und […] [in die Höhe] über die zwölf Reiche gesandt.“[e]


    Judas sagte: „Meister, mein Same herrscht doch nicht etwa über die Herrscher?“[f]


    Jesus antwortete ihm: „Komm, ich will dir [von der heiligen Generation erzählen. Nicht damit du dorthin gelangst]; vielmehr wirst du tief betrübt sein, wenn du das Königreich und seine ganze Generation siehst.“[g]


    Als Judas dies hörte, sagte er zu ihm: „Was hat es mir genützt, dass du mich von jener Generation abgesondert hast?“


    Jesus antwortete: „Du wirst der Dreizehnte werden, und die anderen Generationen werden dich verfluchen; doch du wirst über sie herrschen. In den letzten Tagen werden sie […] zu dir, und du wirst nicht zur heiligen Generation aufsteigen.“[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang ist stark beschädigt. Ergänzungen in eckigen Klammern und Auslassungspunkte kennzeichnen rekonstruierte beziehungsweise verlorene Textteile. Der Bezug mehrerer Pronomen ist unsicher.
    reason: Manuskriptschaden und unsichere Syntax müssen für Leser sichtbar bleiben.
  - marker: b
    text: Der Satzbau im Bild vom Säen ist wegen Textlücken unsicher. Auch ist nicht eindeutig, wie „vergängliche Weisheit“ und „die Hand“ syntaktisch mit dem befleckten Geschlecht und dem Aufstieg der Seelen zusammenhängen.
    reason: Die Übersetzung darf die unklare Kosmologie und Grammatik nicht scheinbar glätten.
  - marker: c
    text: „Dreizehnter Dämon“ folgt dem vorliegenden englischen Zeugnis. Eine unmittelbare Prüfung des koptischen Ausdrucks steht noch aus.
    reason: Die auffällige und theologisch umstrittene Wortwahl beruht hier auf einer vorläufigen Vermittlungsquelle.
  - marker: d
    text: „Bedeutende Menschen“ gibt das im Zeugnis mehrdeutige „great people“ wieder; gemeint sein könnten große, angesehene oder erhabene Personen.
    reason: Die semantische Reichweite lässt sich ohne koptische Quellenprüfung nicht enger bestimmen.
  - marker: e
    text: Der letzte Satz ist beschädigt; insbesondere ist unklar, was oder wen Jesus „[in die Höhe] über die zwölf Reiche gesandt“ haben soll.
    reason: Das fehlende Satzglied verhindert eine sichere Deutung.
  - marker: f
    text: „Same“ kann wörtlich, genealogisch oder übertragen gemeint sein. Die Frageform erwartet im Deutschen wahrscheinlich eine Verneinung, doch der Sinn bleibt unsicher.
    reason: Lexikalische und pragmatische Mehrdeutigkeit sollen offengelegt werden.
  - marker: g
    text: Die Ergänzung über die heilige Generation ist rekonstruiert. Die genaue Beziehung zwischen dem Sehen des Königreichs und Judas’ Trauer bleibt unklar.
    reason: Beschädigter Text und theologische Spannung.
  - marker: h
    text: Vor „zu dir“ fehlt Text. Deshalb bleibt offen, was die anderen Generationen in den letzten Tagen tun werden.
    reason: Eine Ergänzung wäre spekulativ.
lexical_decisions:
- source_word: generation / race
  choice: Generation / Geschlecht
  rationale: „Generation“ bewahrt die wiederkehrende Gruppenbezeichnung des Zeugnisses; beim ausdrücklich als „race“ wiedergegebenen Ausdruck steht „Geschlecht“, um den lexikalischen Wechsel sichtbar zu halten.
- source_word: kingdom / realm
  choice: Königreich / Reich
  rationale: 'Der Unterschied des englischen Zeugnisses wird soweit möglich gewahrt: „kingdom“ erscheint als „Königreich“, „realm(s)“ als „Reich(e)“.'
- source_word: spirit
  choice: Geist
  rationale: Die knappe und mehrdeutige anthropologische Bezeichnung wird nicht als Atem, Lebensgeist oder Heiliger Geist präzisiert.
- source_word: ruler
  choice: Herrscher
  rationale: „Herrscher“ ist verständlich und lässt offen, ob kosmische Mächte oder andere Herrschaftsträger gemeint sind.
- source_word: seed
  choice: Same
  rationale: Die wörtliche, möglicherweise genealogische oder geistige Metapher bleibt erhalten; „Nachkommenschaft“ würde die Mehrdeutigkeit verengen.
- source_word: demon
  choice: Dämon
  rationale: Die scharfe Bezeichnung wird nicht abgeschwächt oder interpretierend als Geistwesen umschrieben.
- source_word: taken up / ascend
  choice: emporgehoben werden / aufsteigen
  rationale: Passives Aufgenommenwerden und aktives Aufsteigen bleiben entsprechend dem Zeugnis unterschieden.
theological_decisions:
- issue: Schicksal der Seelen und Leiber
  choice: Die Spannung zwischen dem Sterben aller Seelen und dem späteren Weiterleben bestimmter Seelen bleibt stehen.
  alternative: Den ersten Satz auf die Seelen der übrigen Generationen zu beschränken oder „sterben“ metaphorisch umzudeuten.
  rationale: Das beschädigte Zeugnis bietet keine sichere Grundlage, den scheinbaren Widerspruch harmonisierend aufzulösen.
- issue: Judas als „dreizehnter Dämon“
  choice: Die Bezeichnung wird direkt beibehalten.
  alternative: „Dreizehnter Geist“ oder eine positiv verstandene kosmologische Amtsbezeichnung.
  rationale: Eine Umdeutung würde die im konsultierten Zeugnis vorhandene negative oder zumindest spannungsreiche Aussage beseitigen.
- issue: Judas’ künftige Stellung
  choice: Fluch und Herrschaft werden nebeneinandergestellt, ohne Judas als erlöst oder verdammt festzulegen.
  alternative: Seine Herrschaft als eindeutige Erhöhung oder den Fluch als endgültige Verwerfung auszulegen.
  rationale: Der Abschnitt verbindet beide Aussagen und verwehrt Judas zugleich den Aufstieg zur heiligen Generation.
- issue: Die „Hand“, die sterbliche Menschen erschuf
  choice: Die rätselhafte Formulierung bleibt ohne Identifizierung stehen.
  alternative: Die Hand ausdrücklich einem Schöpfergott, Demiurgen oder bösen Herrscher zuzuordnen.
  rationale: Eine solche Identifikation wäre konfessionell oder systematisch importiert und wird vom vorliegenden Zeugnis nicht eindeutig geleistet.
- issue: Heilige Generation
  choice: Als „heilige Generation“ wiedergegeben.
  alternative: „Heiliges Geschlecht“, „Geschlecht der Heiligen“ oder „auserwähltes Volk“.
  rationale: Die wiederkehrende Terminologie und ihre kosmologische Mehrdeutigkeit sollen erhalten bleiben, ohne eine kirchliche oder ethnische Identifikation einzutragen.
translation_notes:
  register: Moderne deutsche Standardsprache in würdigem, gut verständlichem Erzählregister. Wiederholungsformeln wie „Jesus sagte“ bleiben zur Wahrung des antiken Stils erhalten, werden aber syntaktisch behutsam geglättet. Eckige Klammern und Auslassungspunkte folgen dem überlieferten englischen Zeugen und markieren Schäden oder Ergänzungen. Der Entwurf ist ausdrücklich vorläufig, da eine direkte Prüfung des koptischen Textes von Codex Tchacos 3 noch aussteht.
