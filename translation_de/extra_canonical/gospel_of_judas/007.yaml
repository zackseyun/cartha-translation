lexical_decisions:
- source_word: Truly I say
  choice: Amen, ich sage
  rationale: Bewahrt den feierlichen, formelhaften Charakter der Rede, ohne die Aussage durch eine bloß idiomatische Umschreibung abzuschwächen.
- source_word: the one/human who bears me
  choice: der mich trägt / der Mensch, der mich trägt
  rationale: Die auffällige Träger-Formulierung bleibt erhalten; sie wird nicht christologisch oder anthropologisch ausgedeutet.
- source_word: generation
  choice: Geschlecht
  rationale: Passt in diesem kosmologisch-genealogischen Zusammenhang besser als „Generation“ und lässt sowohl Abstammungsgruppe als auch überirdische Gemeinschaft anklingen.
- source_word: realm(s)
  choice: Reich / Reiche
  rationale: Gibt die räumlich-herrschaftliche Mehrdeutigkeit wieder, ohne eine bestimmte kosmologische Systematik einzutragen.
- source_word: handed him over
  choice: lieferte ihn an sie aus
  rationale: Bewahrt die Bedeutung von Übergabe beziehungsweise Verrat, ohne das Motiv stärker zu bewerten als der Text selbst.
- source_word: guest room
  choice: Gastzimmer
  rationale: Formale Wiedergabe der bezeugten Raumbezeichnung; eine Harmonisierung mit neutestamentlichen Ortsangaben wird vermieden.
theological_decisions:
- issue: Judas opfert „den Menschen, der mich trägt“
  choice: Wörtlich-nahe Wiedergabe ohne Erklärung im Haupttext
  alternative: „Du wirst meinen Leib opfern“
  rationale: Die Alternative würde die im Text angelegte Unterscheidung zwischen Jesus und seinem menschlichen Träger theologisch festlegen.
- issue: Keine Hand eines Sterblichen kommt über Jesus
  choice: Die beschädigte und spannungsreiche Aussage wird mit Ergänzungsklammern bewahrt
  alternative: Deutung als Aussage über Jesu geistiges Selbst
  rationale: Der überlieferte Wortlaut soll nicht durch eine bestimmte doketische oder andere christologische Lesart aufgelöst werden.
- issue: Judas’ Stern und Eintritt in die Wolke
  choice: Ohne moralische Wertung übersetzt
  alternative: Als ausdrückliche Erhöhung oder Verdammung des Judas kennzeichnen
  rationale: Der Abschnitt enthält positive und negative Signale; die Übersetzung bewahrt diese Spannung.
- issue: „großes Geschlecht Adams“
  choice: Kosmologische Bezeichnung unverändert stehen lassen
  alternative: Mit „die Erlösten“ oder einer bestimmten religiösen Gruppe identifizieren
  rationale: Eine solche Identifikation ist im beschädigten Text nicht eindeutig abgesichert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde behutsam geglättet, doch abrupte Übergänge, Wiederholungen, beschädigte Stellen und kosmologische Mehrdeutigkeiten wurden nicht harmonisiert. „Amen, ich sage“ erhält den feierlichen Formelcharakter; Eigennamen wie Saklas bleiben unübersetzt.
