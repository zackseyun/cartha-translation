translation:
  language: de
  text: 'Jesus sagte: „Amen, ich sage [euch]: Diese Taufe, [die sie] in meinem Namen [empfangen haben], […] wird das ganze Geschlecht des irdischen Adam vernichten. Morgen werden sie den quälen, der mich trägt. Amen, ich [sage] euch: Keine Hand eines sterblichen Menschen [wird] über mich [kommen]. Amen, [ich sage] dir, Judas: Diejenigen, die Saklas Opfer darbringen, […] alles Böse. Doch du wirst sie alle übertreffen, denn du wirst den Menschen opfern, der mich trägt. Dein Horn ist bereits erhoben, dein Zorn ist entbrannt, dein Stern ist aufgegangen, und dein Herz ist [in die Irre gegangen]. Amen, [ich sage dir]: Dein letzter […] und der […] [die Throne] des Reiches sind [besiegt worden], die Könige sind kraftlos geworden, die Geschlechter der Engel haben getrauert, und das Böse, [das sie säten, …] ist vernichtet, [und] der [Herrscher] ist ausgelöscht. [Und] dann wird die [Frucht] des großen Geschlechts Adams erhöht werden; denn noch vor Himmel, Erde und Engeln besteht jenes Geschlecht aus
    den Reichen. Sieh, dir ist alles gesagt worden. Erhebe deine Augen und sieh die Wolke mit dem Licht in ihr und die Sterne rings um sie. Und der Stern, der voranzieht, ist dein Stern.“


    Da blickte Judas auf und sah die leuchtende Wolke, und er trat in sie hinein. Die auf dem Boden Stehenden hörten eine Stimme aus der Wolke sagen: „[… das] große [Geschlecht …] und […].“ Und Judas sah Jesus nicht mehr.


    Sogleich entstand unter [den] Juden eine Unruhe, größer als […]. Ihre Hohenpriester murrten, weil er in das Gastzimmer gegangen war, um zu beten. Einige Schriftgelehrte aber waren dort und beobachteten ihn genau, damit sie ihn während seines Gebets festnehmen könnten. Denn sie fürchteten das Volk, weil alle ihn für einen Propheten hielten.


    Sie traten an Judas heran und sagten zu ihm: „Was machst du hier? Bist du nicht ein Jünger Jesu?“


    Da antwortete er ihnen, wie sie es wünschten. Dann nahm Judas etwas Geld entgegen und lieferte ihn an sie aus.


    Das Evangelium


    des Judas[a]'
