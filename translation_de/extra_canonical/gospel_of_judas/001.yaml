review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt eng. Die eckig markierte Ergänzung in „[gingen]“ wird korrekt beibehalten. „Besprechung“ kann jedoch gegenüber „spoke with“ zu stark ein sachliches Erörtern nahelegen; außerdem fügt „doch dann“ im letzten Satz eine im Textzeugen nicht vorhandene zeitliche Nuance hinzu.
  naturalness: Der Text ist überwiegend klares, würdiges modernes Standarddeutsch. „Im Gespräch mit … äußerte“ gibt die auffällige Formulierung der Überschrift natürlich wieder, ohne sie zu einer bloßen Diskussion umzudeuten. Das Weglassen von „dann“ macht den Schlusssatz präziser und flüssiger.
  terminology: „Gericht“, „Passafest“, „Zeichen“, „Wunder“, „Rettung“, „Gerechtigkeit“, „Übertretung“, „Jünger“ und „Geheimnisse jenseits der Welt“ sind angemessen. Die Formulierung bewahrt die theologische und kosmologische Offenheit des Textzeugen.
  issues:
  - severity: low
    issue: „besprach“ für „spoke with“
    rationale: „Besprach“ legt im Deutschen eher nahe, dass Jesus einen Gegenstand mit Judas erörterte. Der Zeuge sagt lediglich, dass er die Botschaft im Umgang/Gespräch mit Judas sprach.
  - severity: low
    issue: Zusatz „dann“ im Schlusssatz
    rationale: Das englische „but you'd find him“ setzt einen Kontrast, aber keine zusätzliche zeitliche Abfolge. „Dann“ sollte daher entfallen.
  revised_text: 'Dies ist die geheime Botschaft des Gerichts, die Jesus im Verlauf von acht Tagen im Gespräch mit Judas Iskariot äußerte, drei Tage bevor er das Passafest feierte.[a]


    Als er auf der Erde erschien, vollbrachte er Zeichen und große Wunder zur Rettung der Menschheit. Einige [gingen] auf dem Weg der Gerechtigkeit, andere aber lebten in ihrer Übertretung; darum wurden die zwölf Jünger berufen.[b] Er begann, ihnen von den Geheimnissen jenseits der Welt und von dem zu erzählen, was am Ende geschehen würde. Oft offenbarte er sich seinen Jüngern nicht, doch man fand ihn als Kind mitten unter ihnen.'
  revised_footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Die bereitgestellte Grundlage ist kein direkt geprüfter koptischer Ausgangstext.
  - marker: b
    text: Die eckigen Klammern in »[gingen]« kennzeichnen ergänzten oder unsicher überlieferten Handschriftentext.
    reason: Erhält die im Textzeugen markierte Unsicherheit sichtbar.
  revision_rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-fidelitybezogene Anpassungen: „besprach“ wird durch „im Gespräch mit … äußerte“ ersetzt, damit der Sprechakt nicht als inhaltliche Beratung verengt wird; das nicht bezeugte „dann“ entfällt. Die Vorläufigkeits- und Unsicherheitsfußnoten bleiben samt ihren Ankern erhalten. Da nur ein englischer öffentlicher Textzeuge vorliegt und die unmittelbare koptische Prüfung aussteht, werden keine weitergehenden philologischen oder theologischen Festlegungen vorgenommen.'
