  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: de
  text: 'Dies ist die geheime Botschaft des Gerichts, die Jesus im Lauf von acht Tagen mit Judas Iskariot besprach, drei Tage bevor er das Passafest feierte.[a]


    Als er auf der Erde erschien, vollbrachte er Zeichen und große Wunder zur Rettung der Menschheit. Einige [gingen] auf dem Weg der Gerechtigkeit, andere aber lebten in ihrer Übertretung; darum wurden die zwölf Jünger berufen.[b] Er begann, ihnen von den Geheimnissen jenseits der Welt und von dem zu erzählen, was am Ende geschehen würde. Oft offenbarte er sich seinen Jüngern nicht, doch dann fand man ihn als Kind mitten unter ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Die bereitgestellte Grundlage ist kein direkt geprüfter koptischer Ausgangstext.
  - marker: b
    text: Die eckigen Klammern in »[gingen]« kennzeichnen ergänzten oder unsicher überlieferten Handschriftentext.
    reason: Erhält die im Textzeugen markierte Unsicherheit sichtbar.
lexical_decisions:
- source_word: secret message of judgment
  choice: geheime Botschaft des Gerichts
  rationale: Bewahrt sowohl den Offenbarungscharakter der Botschaft als auch die gerichtliche Bedeutung, ohne »judgment« vorschnell als Urteilsspruch oder Verurteilung einzuengen.
- source_word: spoke with
  choice: mit … besprach
  rationale: Gibt den wechselseitigen bzw. begleitenden Charakter der Rede natürlicher wieder als das einseitige »sprach zu«, bleibt aufgrund der ausstehenden koptischen Prüfung jedoch vorläufig.
- source_word: Passover
  choice: Passafest
  rationale: Geläufige, sachlich präzise deutsche Bezeichnung des jüdischen Festes.
- source_word: salvation of humanity
  choice: Rettung der Menschheit
  rationale: »Rettung« ist allgemeinverständlich und lässt die konkrete soteriologische Ausgestaltung offen.
- source_word: way of righteousness
  choice: Weg der Gerechtigkeit
  rationale: Bewahrt das traditionelle Weg-Motiv und die ethisch-theologische Mehrdeutigkeit von »Gerechtigkeit«.
- source_word: walked in their transgression
  choice: lebten in ihrer Übertretung
  rationale: Natürliches modernes Deutsch; das semitisch bzw. biblisch geprägte Bild des Wandelns wird hier idiomatisch als Lebensführung wiedergegeben.
- source_word: mysteries beyond the world
  choice: Geheimnisse jenseits der Welt
  rationale: Bewahrt die räumlich-kosmologische Offenheit des Ausdrucks, statt eine bestimmte gnostische Kosmologie einzutragen.
- source_word: as a child
  choice: als Kind
  rationale: Gibt die überraschende Erscheinungsform schlicht wieder, ohne sie symbolisch auszudeuten.
theological_decisions:
- issue: Bedeutung von »judgment« im Titel
  choice: Gericht
  alternative: Urteil / Verurteilung
  rationale: »Gericht« hält den Vorgang, die Botschaft und eine mögliche eschatologische Dimension offen.
- issue: Zweck der Zeichen und Wunder
  choice: zur Rettung der Menschheit
  alternative: zum Heil der Menschheit
  rationale: Die gewählte Formulierung ist verständlich und vermeidet eine konfessionell aufgeladene Präzisierung des Heilsbegriffs.
- issue: Kausalzusammenhang bei der Berufung der Zwölf
  choice: darum wurden die zwölf Jünger berufen
  alternative: und die zwölf Jünger wurden berufen
  rationale: Der englische Zeuge enthält ausdrücklich »so«; »darum« bildet diesen Zusammenhang ab, ohne näher zu erklären, weshalb die gegensätzlichen Lebenswege zur Berufung führten.
- issue: Jesu Nichtoffenbarung und Erscheinung als Kind
  choice: wörtlich und spannungsvoll beibehalten
  alternative: als Verbergen seiner Identität interpretieren
  rationale: Der Text erklärt weder die Art des Nichtoffenbarens noch die Bedeutung der Kindgestalt; eine Deutung wird daher nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Traditionelle Schlüsselbegriffe wie »Gericht«, »Gerechtigkeit« und »Jünger« bleiben erhalten. Die kosmologische und theologische Fremdheit des Textes wird nicht geglättet. Wegen der noch ausstehenden Prüfung des koptischen Codex Tchacos 3 ist der Entwurf ausdrücklich vorläufig.
