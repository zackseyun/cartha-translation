  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Übersetzungszeugen im Wesentlichen eng und bewahrt dessen Kennzeichnung von Lücken und Ergänzungen. Einige Formulierungen fügen jedoch Inhalte hinzu oder verändern Bezüge: Besonders „Er setzte Herrscher über sie ein“ geht über „he made them to be ruled“ hinaus; außerdem ist „zeugte Seth an jenem Ort“ gegenüber der beschädigten Vorlage grammatisch und semantisch sicherer. Die direkte Prüfung am koptischen Codex ist nach den Angaben noch ausstehend.'
  naturalness: Die Sprache ist überwiegend moderne, würdevolle Standardsprache. Einzelne Wendungen wurden geglättet, ohne die eigentümliche Kosmologie zu normalisieren, etwa „dessen Gesicht vor [Feuer] aufleuchtete“ und „der Selbsterzeugte, der Engel“ statt des missverständlichen „engelhaften Selbsterzeugten“.
  terminology: Die konsequente Unterscheidung von Bereich, Lichtwesen, Engel, Geist, Seele, Chaos und Hades ist angemessen. Eigennamen bleiben in den im Entwurf gewählten deutschen Formen. Die auffälligen und textlich unsicheren Pronomen bei Eva/Leben sowie die Bruchstücke bleiben bewusst erhalten.
  issues:
  - severity: medium
    issue: Zusatz von Herrschern
    rationale: „Er setzte Herrscher über sie ein“ hat keine ausdrückliche Entsprechung im englischen Zeugen („And he made them to be ruled“) und legt eine konkrete hierarchische Handlung fest. Die Übersetzung sollte die knappe, etwas unklare Aussage ohne Zusatz bewahren.
  - severity: medium
    issue: Unidiomatische und potenziell falsche Wiedergabe der beschädigten Seth-Zeile
    rationale: „Adamas zeugte Seth an jenem Ort“ ist im Deutschen missverständlich. „Adamas zeugte Seth an jenem Ort“ wird durch die Stellung und Satzfügung als lokative Angabe lesbar, ohne die Lücke nach „in that place“ zu füllen.
  - severity: low
    issue: Bezug in der Aussage über den Geist in Judas
    rationale: Jesus spricht Judas im Singular an. „in dir, den du ... lebendig gemacht hast“ bewahrt den Singular des Zeugen besser als der Wechsel zu „euch/ihr“.
  - severity: low
    issue: Bezeichnung des Selbsterzeugten als Engel
    rationale: „engelhafter Selbsterzeugter“ kann im Deutschen „engelgleich“ bedeuten. Der Zeuge bezeichnet ihn als einen großen Engel; „der Selbsterzeugte, der Engel“ wahrt diese Zuordnung klarer.
  revised_text: 'Jesus sagte: „[Komm], und ich werde dich über die [Geheimnisse belehren, die kein] Mensch [sehen wird]. Denn es gibt einen großen, grenzenlosen Bereich, dessen Horizonte kein Engelgeschlecht je gesehen hat. [In] ihm ist ein [großer], unsichtbarer Geist, den kein [Engels]auge je gesehen und kein Herz je erfasst hat und der nie mit irgendeinem Namen bezeichnet worden ist.


    Und dort erschien eine leuchtende Wolke. Und er – der Geist – sagte: ‚Ein Engel soll entstehen, um mir zu dienen.‘ Da ging aus der Wolke ein großer Engel hervor: der Selbsterzeugte, der Gott des Lichts. Seinetwegen entstanden aus einer anderen Wolke vier weitere Engel, und sie dienten dem Selbsterzeugten, dem Engel. Und der [Selbsterzeugte] sagte: ‚Ein [Bereich] soll entstehen‘, und er entstand, [wie er gesagt hatte]. Und er [erschuf] das erste Lichtwesen, damit es über ihn herrsche. Dann sagte er: ‚Engel sollen entstehen, um [ihm zu dienen‘, und zahllose Myriaden] entstanden. Und er sagte: ‚[Ein] leuchtender Bereich soll entstehen‘, und er entstand. Er erschuf das zweite Lichtwesen, damit es über ihn herrsche, zusammen mit zahllosen Myriaden von Engeln, die Dienst leisten sollten. Auf diese Weise erschuf er auch die übrigen Bereiche des Lichts. Er ließ sie herrschen und erschuf für sie zahllose Myriaden von Engeln, die ihnen beistehen sollten.


    Und Adamas war in der ersten Lichtwolke, die kein Engel unter all denen, die ‚Gott‘ genannt werden, je sehen konnte. Und [Adamas zeugte Seth an] jenem [Ort nach dem] Bild [von …] und nach dem Abbild [dieses] Engels. Er ließ das unvergängliche [Geschlecht] Seths vor den zwölf mannweiblichen [Lichtwesen erscheinen. Dann] ließ er nach dem Willen des Geistes im unvergänglichen Geschlecht zweiundsiebzig Lichtwesen erscheinen. Darauf ließen die zweiundsiebzig Lichtwesen selbst nach dem Willen des Geistes im unvergänglichen Geschlecht dreihundertsechzig Lichtwesen erscheinen, sodass auf jedes fünf kamen. Die zwölf Bereiche der zwölf Lichtwesen bilden ihren Vater. Jeder Bereich hat sechs Himmel, sodass es für die zweiundsiebzig Lichtwesen zweiundsiebzig Himmel gibt, und für jedes [von ihnen fünf] Himmelsgewölbe, [insgesamt] dreihundertsechzig [Himmelsgewölbe. Ihnen] wurden Vollmacht und ein [großes], zahlloses Heer von Engeln zu Ehre und Dienst gegeben, dazu auch jungfräuliche Geister zur Ehre
    und zum [Dienst] aller Bereiche und der Himmel mit ihren Himmelsgewölben.


    Die Menge jener Unsterblichen nun wird vom Vater und den zweiundsiebzig Lichtwesen samt dem Selbsterzeugten und seinen zweiundsiebzig Bereichen ‚Kosmos‘ – das heißt ‚vergänglich‘ – genannt. Dort erschien der erste Mensch mit seinen unvergänglichen Kräften. In dem Bereich, der mit seinem Geschlecht erschien, befinden sich die Wolke der Erkenntnis und der Engel, der [Eleleth …] genannt wird. Danach sagte [Eleleth]: ‚Zwölf Engel sollen entstehen, [um] über das Chaos und den [Hades] zu herrschen.‘ Und sieh: Aus der Wolke erschien ein [Engel], dessen Gesicht vor [Feuer] aufleuchtete und dessen Gestalt mit Blut [besudelt] war. Sein Name war Nebro, was ‚Aufrührer‘ bedeutet. Andere nennen ihn Jaldabaoth. Auch ein weiterer Engel, Saklas, kam aus der Wolke. Nebro erschuf also sechs Engel – und Saklas ebenso –, damit sie ihnen beistünden. Sie brachten zwölf Engel in den Himmeln hervor, und jeder von ihnen erhielt einen Anteil in den Himmeln.


    Und die zwölf Herrscher sprachen zu den zwölf Engeln: ‚Jeder von euch soll […] und sie sollen […] Geschlecht [… fünf] Engel:


    Der erste [ist Jaoth], der ‚der Gute‘ genannt wird.


    Der zweite ist Harmathoth, [das Feuerauge].


    Der [dritte] ist Galila.


    Der vierte [ist] Jobel.


    Der fünfte ist Adonaios.


    Das sind die fünf, die über den Hades herrschten und die Ersten über dem Chaos sind.


    Dann sagte Saklas zu seinen Engeln: ‚Lasst uns einen Menschen nach dem Abbild und dem Bild erschaffen.‘ Und sie formten Adam und seine Frau Eva, die in der Wolke ‚Leben‘ genannt wird. Denn unter diesem Namen suchen alle Geschlechter ihn, und jedes von ihnen nennt sie mit seinen Namen. Saklas aber [befahl nicht …], zu gebären, außer […] unter den Geschlechtern […] welches dies […] und der [Engel] sagte zu ihm: ‚Dein Leben und das deiner Kinder wird nur eine begrenzte Zeit dauern.‘“


    Da sagte Judas zu Jesus: „[Wie] lange kann ein Mensch leben?“


    Jesus sagte: „Warum wunderst du dich darüber, dass die Lebenszeit Adams und seines Geschlechts begrenzt ist – an dem Ort, an dem er sein Reich samt seinem Herrscher empfangen hat?“


    Judas sagte zu Jesus: „Stirbt der menschliche Geist?“


    Jesus sagte: „So verhält es sich: Gott befahl Michael, den Menschen Geister zu leihen, damit sie dienen könnten. Dann befahl der Große Gabriel, dem großen Geschlecht, das keinen König hat, Geister zu geben – den Geist zusammen mit der Seele. Die [übrigen] Seelen also […] Licht [… das] Chaos […] suchen [den] Geist in dir, den du aus den Engelgeschlechtern in diesem Fleisch lebendig gemacht hast. Dann ließ Gott Adam und denen, die bei ihm waren, Erkenntnis bringen, damit die Könige des Chaos und des Hades nicht über sie herrschten.“


    [Da] sagte Judas zu Jesus: „Was werden also jene Geschlechter tun?“


    Jesus sagte: „Wahrlich, ich sage dir: Die Sterne vollenden dies alles. Wenn Saklas die für ihn festgesetzte Zeitspanne vollendet hat, wird ihr erster Stern mit den Geschlechtern erscheinen, und sie werden zu Ende führen, was gesagt worden ist. Dann werden sie in meinem Namen Unzucht treiben, ihre Kinder ermorden und [sie werden …] Böses und […] die Bereiche; sie werden die Geschlechter herbeibringen und Saklas übergeben. [Und] danach […] wird die zwölf Stämme [Israels] aus […] bringen, und alle [Geschlechter] werden Saklas dienen und in meinem Namen sündigen. Dein Stern aber wird über den dreizehnten Bereich [herrschen].“ Da [lachte] Jesus.


    [Judas] sagte: „Meister, warum [lachst du über mich?“


    Jesus] antwortete [und sagte]: „Ich lache nicht [über dich, sondern] über den Irrtum der Sterne. Denn diese sechs Sterne gehen mit diesen fünf Kriegern in die Irre, und sie alle werden zusammen mit ihren Schöpfungen vernichtet werden.“


    Da sagte Judas zu Jesus: „Was werden diejenigen tun, die auf deinen Namen getauft worden sind?“'
