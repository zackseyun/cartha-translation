review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung bewahrt die zentrale kosmologische Terminologie, die Wiederholungen und die textkritisch markierte Lücke im Wesentlichen zuverlässig. Eine sachlich relevante Abweichung betrifft jedoch das Subjekt der Lobpreisung: Der vorliegende englische Zeuge bezieht das Relativpronomen „who“ unmittelbar auf „the God of truth“. Der Entwurf macht dagegen die zuvor genannte „Gemeinde“ zum Subjekt. Da eine direkte koptische Kontrolle noch aussteht, ist die im bereitgestellten Zeugen ausdrücklich vorliegende syntaktische Zuordnung beizubehalten.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „diejenigen, die in dem Gezeugten gezeugt wurden“ liest sich etwas klarer als die elliptische Form „die, die …“, ohne die absichtlich fremdartige Zeugungsmetaphorik zu glätten. Die poetisch-syntaktische Reihung bleibt erhalten.
  terminology: „Unvergängliche“, „Selbstgezeugte“, „Äonen“, „Fülle“, „Siegel“ und „Herrscher“ sind konsistent und angemessen. „Gemeinde“ für „church“ ist hier vertretbar, da der Ausdruck als geistliche Gemeinschaft und nicht als spätere Institution verwendet wird. Die geschlechtlich markierte Bezeichnung „männliche Kinder“ bleibt quellennahe erhalten.
  issues:
  - severity: high
    issue: Das Subjekt von „pries, besang und verherrlichte“ wurde von „dem Gott der Wahrheit“ zu „der … Gemeinde“ geändert.
    rationale: Im gelieferten Zeugen lautet die Konstruktion „the God of truth, who praised, sang, (and) extolled“. Die deutsche Fassung muss daher, vorbehaltlich einer späteren koptischen Prüfung, den Gott der Wahrheit als Subjekt ausweisen. Die Umdeutung verändert den Aussageinhalt und ist nicht bloß eine stilistische Glättung.
  - severity: low
    issue: Die Formulierung „zu denen, die …“ ist unnötig elliptisch.
    rationale: „zu denjenigen, die in dem Gezeugten gezeugt wurden“ ist im heutigen Standarddeutsch klarer und bewahrt vollständig die Wiederholung und begriffliche Spannung des Zeugen.
  revised_text: "Da erbebte alles, und Zittern ergriff die Unvergänglichen. Dann stiegen die drei männlichen Kinder von oben herab zu den Ungeborenen und Selbstgezeugten und zu denjenigen, die in dem Gezeugten gezeugt wurden. Die Größe trat hervor, die ganze Größe des großen Christus.\n\n\nEr errichtete unzählige Myriaden herrlicher Throne in den vier Äonen, die sie umgaben, unzählige Myriaden von Mächten und Herrlichkeiten [a] und Unvergänglichkeiten. So gingen sie hervor, und die unvergängliche, geistliche Gemeinde wuchs in den vier Lichtern des großen, lebendigen Selbstgezeugten, des Gottes der Wahrheit, der mit einer Stimme, in einmütigem Einklang und mit einem Mund, der niemals verstummte,\n\n\n den Vater,\n\n\n die Mutter,\n\n\n den Sohn\n\n\n und ihre ganze Fülle pries, besang und verherrlichte, wie ich zuvor erwähnt habe.[b]\n\n\nDen fünf Siegeln, welche die Myriaden besitzen,\n\n\n den Herrschern über die Äonen\n\n\n und den Trägern der Herrlichkeit der Anführer\n\n\n wurde befohlen,\
    \ sich den Würdigen zu offenbaren.\n\n\nAmen."
  revised_footnotes:
  - marker: a
    text: An dieser Stelle weist die Handschrift beziehungsweise die zugrunde liegende Textausgabe eine Lücke oder beschädigte Passage auf.
    reason: Der im englischen Zeugen mit leeren eckigen Klammern bezeichnete Textverlust muss sichtbar bleiben.
