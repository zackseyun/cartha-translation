  revision_rationale: 'Die Revision stellt die im bereitgestellten Zeugen angezeigte syntaktische Referenz wieder her: Der Gott der Wahrheit ist der Lobpreisende. Die Satzstellung wird dafür im Deutschen umgestellt, ohne den Inhalt zu deuten oder die litaneiartige Gliederung zu verändern. Die Lücke und die editorische Ergänzung bleiben an ihren jeweiligen Ankern kenntlich. Da nur ein englischer Brückenzeuge und keine direkt geprüfte koptische Lesung vorliegt, werden ungewöhnliche Beziehungen wie „Siegel, welche die Myriaden besitzen“ nicht harmonisiert.'
