translation:
  language: de
  text: 'Da erbebte alles, und Zittern ergriff die Unvergänglichen. Dann stiegen die drei männlichen Kinder von oben herab zu den Ungeborenen und Selbstgezeugten und zu denen, die in dem Gezeugten gezeugt wurden. Die Größe trat hervor, die ganze Größe des großen Christus.


    Er errichtete unzählige Myriaden herrlicher Throne in den vier Äonen, die sie umgaben, unzählige Myriaden von Mächten und Herrlichkeiten [a] und Unvergänglichkeiten. So gingen sie hervor, und die unvergängliche, geistliche Gemeinde wuchs in den vier Lichtern des großen, lebendigen Selbstgezeugten, des Gottes der Wahrheit. Mit einer Stimme, in einmütigem Einklang und mit einem Mund, der niemals verstummte, pries, besang und verherrlichte sie


    den Vater,


    die Mutter,


    den Sohn


    und ihre ganze Fülle, wie ich zuvor erwähnt habe.[b]


    Den fünf Siegeln, welche die Myriaden besitzen,


    den Herrschern über die Äonen


    und den Trägern der Herrlichkeit der Anführer


    wurde befohlen, sich den Würdigen zu offenbaren.


    Amen.'
