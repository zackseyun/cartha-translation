lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: die Unvergänglichen / Unvergänglichkeiten
  rationale: „Unvergänglich“ bewahrt den kosmologisch-theologischen Sinn besser als das materiell klingende „unzerstörbar“ und hält die verwandten Ausdrücke erkennbar zusammen.
- source_word: self-begotten / self-generated one
  choice: Selbstgezeugte / Selbstgezeugter
  rationale: Die einheitliche Wiedergabe erhält die Zeugungsmetaphorik und vermeidet eine vorschnelle Gleichsetzung mit „selbsterschaffen“.
- source_word: Greatness
  choice: Größe
  rationale: Als substantivierter Titel bewusst wörtlich wiedergegeben, damit die eigentümliche Bezeichnung und ihre Wiederholung erhalten bleiben.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff wahrt die kosmologische Mehrdeutigkeit; „Zeitalter“ wäre im räumlichen Zusammenhang missverständlich.
- source_word: church
  choice: Gemeinde
  rationale: „Gemeinde“ ist im modernen Deutsch verständlich und bezeichnet hier die geistliche Gemeinschaft, ohne eine spätere kirchliche Institution einzutragen.
- source_word: Fullness
  choice: Fülle
  rationale: Bewahrt den technischen und zugleich allgemein verständlichen Sinn des Ausdrucks, ohne ihn durch „Pleroma“ unnötig zu spezialisieren.
- source_word: archons
  choice: Herrscher
  rationale: Die deutsche Bedeutungsentsprechung ist verständlicher als das bloße Lehnwort „Archonten“, ohne ihre kosmische Funktion näher festzulegen.
- source_word: manifest themselves
  choice: sich … offenbaren
  rationale: Gibt das aktive Sichtbar- oder Erkennbarwerden in einem religiösen Kontext natürlich wieder.
theological_decisions:
- issue: Beziehung der drei Gruppen „Vater, Mutter und Sohn“
  choice: Die drei Bezeichnungen parallel und ohne Zusatz wiedergeben.
  alternative: Sie ausdrücklich als Trinität oder als drei Gottheiten deuten.
  rationale: Der Text nennt die Gestalten, erklärt aber ihre genaue ontologische Beziehung nicht; die Übersetzung darf diese Spannung nicht konfessionell auflösen.
- issue: Referenz des preisenden Subjekts
  choice: „die … Gemeinde“ als Subjekt von „pries, besang und verherrlichte“ lesen.
  alternative: „der Gott der Wahrheit“ als das preisende Subjekt verstehen.
  rationale: Die englische Satzfügung ist grammatisch mehrdeutig. Der feminine Rückbezug auf „Gemeinde“ ergibt im Deutschen den kohärenteren Zusammenhang, bleibt wegen ausstehender koptischer Prüfung jedoch vorläufig.
- issue: Selbstzeugung des großen lebendigen Wesens
  choice: „Selbstgezeugter“ beibehalten.
  alternative: „Selbsterschaffener“ oder „aus sich selbst Entstandener“.
  rationale: „Gezeugt“ hält die im Abschnitt wiederkehrende Abstammungs- und Zeugungssprache offen und vermeidet eine weitergehende Aussage über Schöpfung.
- issue: „die fünf Siegel, welche die Myriaden besitzen“
  choice: Die syntaktische Zuordnung des vorliegenden Zeugnisses wahren.
  alternative: „die fünf Siegel mit ihren Myriaden“ oder „die Myriaden, welche die fünf Siegel besitzen“.
  rationale: Ohne direkte koptische Prüfung sollte die ungewöhnliche Besitzrelation nicht geglättet oder umgekehrt werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltenen kosmologischen Fachbegriffen. Wiederholungen wie „Größe“, „Myriaden“ und „gezeugt“ wurden nicht geglättet, da sie die rhetorische und begriffliche Struktur tragen. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes ausdrücklich vorläufig.
