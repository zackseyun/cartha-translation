    you have [cleansed me inside him]

    with your life,

    [in accord with your] indestructible [name].

    [Therefore], with him [is incense of life]

    that has mingled with baptismal [water] of [every] archon,

    [so that I might] live together with you in the [well-being of the holy ones],

    O eternal one [who exists],

    TRUTH TRULY.


    [The great Seth] wrote [this book], and deposited it on [a] high [mountain] where [the sun rises] not, nor [. . .], and [since the days of the] prophets [and . . . and the] apostles, [. . .] come forth [. . . and their] ear [has not heard] it.


    The great Seth wrote [this] [] [book] with letters [. . .]. He deposited [it . . .].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/014.yaml
  text: 'This is the book that the great Seth wrote and deposited high in the mountains, where the sun has not risen, nor is that (even) possible. Since the days of the prophets, apostles, and preachers, its name has not arisen in their hearts in the least, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the intention that, at the end of the times and eras, in agreement with the desire of the self-generated God and the complete Fullness, and by the gift of the inscrutable, ungraspable, fatherly will, it might come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and eternal light, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    Also restore the omitted witness markers in their respective locations: “the mystery] of [mysteries]. [7] They [appeared . . . who oversees . . .] and the aeons, TRUTH TRULY [8] [. . .], and TRUTH TRULY, [eternal] aeons”; “[. . .] AIA[. . .]THAŌTHŌSTH[. . .], [9]”; and “[. . .] TRUTH, [16]”.'
translation:
  language: de
  text: 'Dies ist das Buch, das der große Seth schrieb und hoch oben in den Bergen hinterlegte, wo die Sonne nicht aufgegangen ist und dies auch gar nicht möglich ist. Seit den Tagen der Propheten, Apostel und Verkündiger ist sein Name auch nicht im Geringsten in ihren Herzen aufgegangen, und auch das ist gar nicht möglich; ihr Ohr hat ihn nicht gehört.


    Der große Seth schrieb dieses Buch innerhalb von 130 Jahren in Schriftzeichen.[a] Er hinterlegte es auf dem Berg namens Charaxio[b] mit der Absicht, dass es am Ende der Zeiten und Zeitalter, im Einklang mit dem Verlangen des selbstentstandenen Gottes und der vollständigen Fülle und durch die Gabe des unerforschlichen, unbegreiflichen väterlichen Willens, ans Licht kommen und erscheinen möge: für dieses heilige, unvergängliche Geschlecht des großen Retters und für diejenigen, die mit ihnen in Liebe wohnen, und für den großen, unsichtbaren, ewigen Geist und seinen einziggezeugten Sohn und das ewige Licht, [] ebenso für dessen große, unvergängliche Gefährtin, die unvergängliche Sophia und Barbelon und die vollständige Fülle — in Ewigkeit. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der zugrunde liegende englische Zeuge lautet wörtlich „with letters in 130 years“. Die genaue Bedeutung dieser ungewöhnlichen Formulierung bleibt unsicher; eine unmittelbare Prüfung des koptischen Textes steht noch aus.
    reason: Kennzeichnet eine echte sprachliche Unsicherheit der vorläufigen, auf einem englischen Zeugen beruhenden Fassung.
  - marker: b
    text: Charaxio ist die im zugrunde gelegten Zeugen überlieferte beziehungsweise rekonstruierte Form des Bergnamens.
    reason: Erklärt einen seltenen Eigennamen, ohne ihn spekulativ zu normalisieren.
lexical_decisions:
- source_word: deposited
  choice: hinterlegte
  rationale: Gibt die bewusste Verwahrung eines Buches an einem verborgenen Ort natürlicher wieder als das allgemeinere „legte ab“.
- source_word: generation
  choice: Geschlecht
  rationale: Bewahrt den kollektiven, abstammungsbezogenen Sinn des Ausdrucks, ohne ihn vorschnell als bloße zeitliche „Generation“ zu deuten.
- source_word: self-generated God
  choice: selbstentstandener Gott
  rationale: Hält die besondere kosmologische Aussage fest und vermeidet eine Gleichsetzung mit geläufigeren theologischen Begriffen wie „ungezeugt“.
- source_word: Fullness
  choice: Fülle
  rationale: Entspricht dem kosmologischen Fachbegriff und wahrt seine substantivische Funktion.
- source_word: only-begotten Son
  choice: einziggezeugter Sohn
  rationale: Bewahrt die Aussage vom einzigartigen Gezeugtsein, ohne sie durch eine konfessionell geprägte Formel weiter auszulegen.
- source_word: with letters in 130 years
  choice: innerhalb von 130 Jahren in Schriftzeichen
  rationale: Gibt beide Bestandteile des schwierigen Ausdrucks wieder, ohne sicher zu behaupten, ob die Zeitangabe die Schreibdauer oder eine andere kodikologische Aussage bezeichnet.
theological_decisions:
- issue: Empfängerkreis der endzeitlichen Offenbarung
  choice: Die aneinandergereihte Folge nach „erscheinen möge“ bleibt syntaktisch weitgehend offen.
  alternative: Nur das heilige Geschlecht und die mit ihm Wohnenden als Empfänger verstehen; Geist, Sohn, Licht, Sophia, Barbelon und Fülle davon abtrennen.
  rationale: Der beschädigte und schwer gegliederte Wortlaut erlaubt keine sichere Begrenzung der auf „für“ bezogenen Reihe.
- issue: Bezeichnung des höchsten bzw. selbstentstandenen Gottes
  choice: „selbstentstandener Gott“
  alternative: „selbstgezeugter Gott“ oder „aus sich selbst hervorgegangener Gott“
  rationale: Die gewählte Form bewahrt die Aussage des Zeugen knapp, ohne die im Werk unterschiedenen Begriffe „zeugen“ und „hervorgehen“ unnötig zu vermischen.
- issue: Unvergängliches Geschlecht des Retters
  choice: Die gruppenspezifische Selbstbezeichnung wird wörtlich als „heiliges, unvergängliches Geschlecht“ wiedergegeben.
  alternative: „heiliges, unsterbliches Volk“
  rationale: „Geschlecht“ erhält die im Text angelegte Abstammungs- und Identitätssprache; „Volk“ würde sie vereinheitlichen und stärker biblisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzführung. Wiederholungen wie „auch gar nicht möglich“ und die kosmologischen Titel bleiben erhalten. Eckige Klammern und die leere Lakunenmarkierung [] werden als Signale von Textverlust oder editorischer Ergänzung bewahrt. Die Zeugenmarkierungen [7], [8], [9] und [16] gehören zu früheren, hier nicht enthaltenen Abschnitten und wurden daher in diesem Schlussabschnitt nicht an sachfremder Stelle eingefügt. Die Fassung bleibt bis zur direkten Prüfung des koptischen Textes vorläufig.
