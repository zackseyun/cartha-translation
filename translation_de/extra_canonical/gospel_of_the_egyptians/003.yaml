translation:
  language: de
  text: 'Domedon Doxomedon zog in feierlicher Folge hervor: der Äon der Äonen[a], mit dem Thron in seinem Inneren, den Mächten, die ihn [umgeben], den Herrlichkeiten und den [Unvergänglichkeiten. Der] Vater des großen Lichts, [der] aus der Stille [hervor]ging, ist [der große] Äon Doxomedon. In ihm ruht das [dreifach-]männliche Kind, und der Thron seiner [Herrlichkeit] wurde [in ihm] errichtet, [jener], auf dessen Tafel sein nicht zu offenbarender Name [geschrieben steht]: […] das eine Wesen ist die Rede[b], der [Vater des Lichts] des Alls, er, [der] aus der Stille [hervor]ging, während er in der Stille ruht, dessen [] Name in einem [unsichtbaren] Zeichen ist.


    [Ein] verborgenes, [unsichtbares] Geheimnis zog in feierlicher Folge hervor:


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    und auf diese Weise brachten die drei Mächte dem [großen], unsichtbaren, unnennbaren, jungfräulichen, unaussprechlichen Geist und [seiner] männlichen Jungfrau[c] Lobpreis dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Äon“ kann sowohl ein Weltzeitalter als auch eine personifizierte überweltliche Größe bezeichnen. Die Wendung „Äon der Äonen“ lässt diese Bedeutungsbreite bestehen.
    reason: Der Fachbegriff ist für das Verständnis der kosmologischen Sprache zentral und sollte nicht einseitig aufgelöst werden.
  - marker: b
    text: Der Wortlaut in diesem beschädigten Abschnitt ist syntaktisch unsicher; auch die Beziehung von „Wesen“, „Rede“ und dem folgenden „Vater des Lichts“ bleibt unklar.
    reason: Die Fußnote kennzeichnet eine echte textliche und grammatische Unsicherheit, die eine flüssige Übersetzung sonst verdecken könnte.
  - marker: c
    text: „Männliche Jungfrau“ gibt die absichtlich paradoxe Bezeichnung des Zeugen wieder; der beschädigte Text erklärt ihre genaue Bedeutung nicht.
    reason: Die ungewöhnliche Formulierung könnte ohne Hinweis irrtümlich für einen Übersetzungsfehler gehalten werden.
lexical_decisions:
- source_word: came in procession
  choice: zog in feierlicher Folge hervor
  rationale: Verbindet das prozessionsartige Auftreten mit dem wiederholten Hervorgehen, ohne den Vorgang als bloßes Erscheinen abzuschwächen.
- source_word: aeon
  choice: Äon
  rationale: Der etablierte religionsgeschichtliche Fachbegriff wahrt hier sowohl die zeitliche als auch die hypostatische Bedeutung, statt einseitig mit „Zeitalter“ zu übersetzen.
- source_word: Silence
  choice: Stille
  rationale: Die Großschreibung kennzeichnet die Stille als personifizierte oder hypostatische Größe, ohne ihre genaue metaphysische Funktion festzulegen.
- source_word: indestructibilities
  choice: Unvergänglichkeiten
  rationale: Das substantivierte Abstraktum erhält den ungewöhnlichen pluralischen Charakter der Mächteordnung.
- source_word: undisclosable name
  choice: nicht zu offenbarender Name
  rationale: Bewahrt die Aussage, dass der Name nicht enthüllt oder mitgeteilt werden kann beziehungsweise soll, ohne ihn lediglich als unbekannt zu bezeichnen.
- source_word: the All
  choice: das All
  rationale: Gibt die kosmologische Gesamtheit als bestimmten Fachausdruck wieder.
- source_word: symbol
  choice: Zeichen
  rationale: „Zeichen“ ist im Deutschen natürlich und lässt offen, ob ein Schriftzeichen, Sinnbild oder verborgenes Kennzeichen gemeint ist.
- source_word: presented praise
  choice: brachten … Lobpreis dar
  rationale: Eine würdevolle, verständliche kultische Wendung, die den dargebrachten Charakter des Lobes erhält.
theological_decisions:
- issue: Beziehung zwischen Doxomedon, dem Vater des großen Lichts und dem Äon
  choice: Die appositionale und pronominale Verknüpfung bleibt eng und teilweise mehrdeutig.
  alternative: Die Gestalten ausdrücklich gleichsetzen oder voneinander trennen.
  rationale: Der beschädigte, syntaktisch dichte Text erlaubt keine sichere dogmatische Auflösung ihrer Identität oder Unterscheidung.
- issue: Geschlechtlich paradoxe Bezeichnungen
  choice: „dreifach-männliches Kind“ und „männliche Jungfrau“ werden wörtlich und spannungsvoll beibehalten.
  alternative: Die Ausdrücke harmonisierend als rein symbolische oder geschlechtslose Titel umschreiben.
  rationale: Die paradoxe Sprache ist ein sachlich bedeutsamer Bestandteil der überlieferten Theologie und darf nicht geglättet werden.
- issue: Personifizierung der Stille
  choice: „Stille“ wird großgeschrieben, die Aussage des Hervorgehens und Ruhens aber nicht weiter erklärt.
  alternative: Stille als eindeutig personale Gottheit oder nur als Zustand deuten.
  rationale: Die Formulierung legt eine hypostatische Verwendung nahe, lässt deren genaue ontologische Bedeutung jedoch offen.
- issue: Bezug des Possessivpronomens bei der männlichen Jungfrau
  choice: „[seiner] männlichen Jungfrau“ bewahrt die ergänzte männliche Zuordnung des Zeugen.
  alternative: Das Possessivpronomen neutralisieren oder auf eine andere Größe beziehen.
  rationale: Die Ergänzung wird sichtbar markiert; ihr möglicher Bezug auf den Geist bleibt erhalten, ohne über den beschädigten Text hinaus gesichert zu werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltenen kosmologischen Fachbegriffen und paradoxen Titeln. Eckige Klammern und Auslassungspunkte bewahren die im englischen öffentlichen Zeugen ausgewiesenen Ergänzungen und Textverluste; bloße Handschriften-Seitenzahlen wurden nicht übernommen. Die Folge der Vokalzeichen bleibt diplomatisch erhalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorläufig.
