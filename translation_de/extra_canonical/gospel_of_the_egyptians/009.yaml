base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/009.yaml
  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: de
  text: "Dann brachte der große Seth, der Sohn des unvergänglichen Menschen Adamas, Lob dar:\n\n dem großen unsichtbaren, unnennbaren, unaussprechlichen, jungfräulichen Geist,\n nämlich der <männlichen Jungfrau>,\n <und dem dreifach-männlichen Kind>,\n <und der männlichen> Jungfrau Youel,\n und Esephech, dem Hüter des Glanzes,\n und der Krone seiner Herrlichkeit, dem Kind des Kindes,\n [a] und den großen Doxomedon-Äonen,\n und der Fülle, wie ich zuvor erwähnt habe.\n\nUnd er bat für seinen Samen.\n\nDann ging von dort die große Kraft des großen Lichtes hervor, Plesithea:\n\n die Mutter der Engel,\n die Mutter der Lichter,\n die herrliche Mutter,\n die vierbrüstige Jungfrau,\n die als Quelle die Frucht aus Gomorra und aus Sodom trägt,\n die Frucht der Quelle von Gomorra, die in ihr wohnt.\n\nSie ging durch den großen Seth hervor.\n\nDa freute sich der große Seth über die Gabe, die ihm das unvergängliche Kind geschenkt hatte. Er entnahm seinen Samen der vierbrüstigen Jungfrau und legte ihn\
    \ bei ihm im vierten Äon nieder, im dritten großen Licht, Davithe."
