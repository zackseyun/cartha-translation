lexical_decisions:
- source_word: indestructible
  choice: unvergänglich
  rationale: Im kosmologischen Kontext bezeichnet das Wort eher Unvergänglichkeit als bloße physische Unzerstörbarkeit; die im Deutschen geläufige religiöse Ausdrucksweise bleibt gewahrt.
- source_word: Man, Adamas
  choice: Menschen Adamas
  rationale: „Mensch“ bewahrt den titularen Charakter, während der Eigenname Adamas unverändert bleibt.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den technischen kosmologischen Begriff wieder, ohne ihn durch eine konfessionell oder systematisch festgelegte Deutung zu ersetzen.
- source_word: seed
  choice: Samen
  rationale: Bewahrt die Mehrdeutigkeit zwischen Nachkommenschaft, geistlicher Zugehörigkeit und zeugendem Samen, statt sie auf „Nachkommen“ einzuengen.
- source_word: aeon
  choice: Äon
  rationale: Der etablierte Lehnbegriff bewahrt den technischen Sinn einer kosmischen Sphäre oder Wesenheit.
- source_word: came/proceeded forth
  choice: ging hervor
  rationale: Natürliches, würdiges Deutsch, das eine Emanation oder ein Hervortreten ausdrücken kann, ohne die Art des Vorgangs festzulegen.
- source_word: keeper of splendor
  choice: Hüter des Glanzes
  rationale: Nahe und idiomatische Wiedergabe des Titels.
- source_word: deposited it with him
  choice: legte ihn bei ihm ... nieder
  rationale: Das männliche Pronomen bezieht sich im Deutschen auf „Samen“; „bei ihm“ erhält den im Zeugnis vorhandenen, jedoch nicht eindeutig bestimmten männlichen Bezug.
theological_decisions:
- issue: Geschlechtlich paradoxe Titel
  choice: Die Formen „<männliche Jungfrau>“, „<dreifach-männliches Kind>“ und „<männliche> Jungfrau“ werden einschließlich der Winkelklammern bewahrt.
  alternative: Glättung zu geschlechtlich eindeutigen oder erklärenden Titeln.
  rationale: Die paradoxe Sprache und die textkritischen Kennzeichnungen gehören zum überlieferten Zeugnis und dürfen nicht harmonisiert werden.
- issue: Bedeutung von „Samen“
  choice: Durchgehend „Samen“.
  alternative: „Nachkommenschaft“ in der Fürbitte und „Samen“ im späteren Satz.
  rationale: Die Wiederaufnahme desselben Ausdrucks ist literarisch und theologisch bedeutsam; eine Aufspaltung würde die mögliche Identität der Bezüge vorentscheiden.
- issue: Hervorgehen Plesitheas „durch den großen Seth“
  choice: Wörtlich als „durch den großen Seth“ wiedergegeben.
  alternative: „mithilfe des großen Seth“, „aus dem großen Seth“ oder „über den großen Seth“.
  rationale: Die vermittelte oder räumliche Beziehung bleibt im vorhandenen Zeugnis mehrdeutig und wird nicht dogmatisch festgelegt.
- issue: Pronomen in „deposited it with him“
  choice: „legte ihn bei ihm ... nieder“ mit unbestimmtem Bezug von „ihm“.
  alternative: Explizite Identifizierung des Bezugs mit Seth, dem Kind oder einer anderen Gestalt.
  rationale: Das englische Zwischenzeugnis lässt den Bezug offen; eine ausdrückliche Identifizierung wäre ohne koptische Prüfung unbegründet.
- issue: Sodom und Gomorra als positive kosmologische Bilder
  choice: Die ungewöhnliche positive Bildsprache wird unverändert bewahrt.
  alternative: Allegorisierende Erklärung oder moralische Umdeutung.
  rationale: Die Spannung zum sonst geläufigen biblischen Gebrauch ist Bestandteil dieses Textes und darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit liturgisch-kosmologischem Rhythmus. Eigennamen und technische Begriffe bleiben transliteriert. Die Wiederholungen der Vorlage werden bewusst erhalten. Vorläufige Fassung auf Grundlage des bereitgestellten gemeinfreien englischen Zeugnisses; eine unmittelbare Prüfung des koptischen Textes steht noch aus.
