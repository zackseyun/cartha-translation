review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen fragmentarisch-katalogartige Syntax. Korrigiert werden müssen jedoch eine zusätzlich gesetzte öffnende eckige Klammer vor „des Vaters“, die im Zeugen keine Entsprechung hat, die Ankerbezeichnungen der beiden Fußnoten sowie einzelne Bedeutungsnuancen bei „indestructibilities“ und „undeclarable“. Eine unmittelbare koptische Kontrolle steht laut Kontext weiterhin aus.
  naturalness: Der feierliche Genitivkatalog ist im Deutschen absichtlich sperrig, aber für diesen Texttyp tragfähig. „Licht des Lichts aus den Äonen des Lichts“ bildet die englische Konstruktion genauer und zugleich idiomatischer ab als „Lichts vom Licht aus“. „Unzerstörbarkeiten“ bleibt ungewöhnlich, bewahrt aber den abstrakten Plural ohne die spezifisch auf Vergänglichkeit bezogene Verschiebung.
  terminology: „Fülle“, „Äon(en)“, „Vorsehung“, „Wort“ und „der Fremde“ sind angemessene, nicht konfessionell verengende Entscheidungen. Die griechische Schlussformel ALĒTHŌS soll stehen bleiben. Für „undeclarable“ ist „unverkündbar“ näher als „nicht zu verkündend“; damit wird keine Auslegung als dogmatische Aussage eingeführt.
  issues:
  - severity: medium
    issue: Zusätzliche eckige Klammer vor „des Vaters“
    rationale: Der englische Zeuge setzt vor „the Father“ keine öffnende Klammer. Die deutsche Fassung darf keine zusätzliche Rekonstruktion beziehungsweise Beschädigungsmarkierung einführen.
  - severity: medium
    issue: Fußnotenanker von [1]/[2] zu [a]/[b] geändert
    rationale: Die im Zeugen sichtbaren Anker sind als formale Textsignale zu erhalten. Die Fußnoten werden deshalb wieder mit 1 und 2 verknüpft.
  - severity: low
    issue: „Unvergänglichkeiten“ für „indestructibilities“
    rationale: „Unvergänglichkeit“ betrifft primär das Nichtvergehen; „indestructibility“ bezeichnet Nichtzerstörbarkeit. Der technische abstrakte Plural wird mit „Unzerstörbarkeiten“ genauer erhalten.
  - severity: low
    issue: „nicht zu verkündenden“ für „undeclarable“
    rationale: Die bisherige Form ist grammatisch möglich, aber semantisch weniger präzise und stilistisch schwerfälliger. „unverkündbar“ wahrt die apophatische Prädikatsreihe.
  - severity: low
    issue: Fußnote zu ALĒTHŌS enthält „offenbar“
    rationale: Die behauptete Einschätzung einer liturgischen Funktion ist über den bereitgestellten Zeugen hinausgehend. Die Anmerkung sollte nur die Sprachform und möglichen Sinn benennen.
