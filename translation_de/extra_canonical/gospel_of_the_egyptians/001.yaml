translation:
  language: de
  text: '[] Das [heilige] Buch des […] großen unsichtbaren [Geistes],


    [des Vaters, dessen Name unaussprechlich ist,


    der hervorging] aus den Höhen der [Fülle,


    des] Lichts vom Licht aus den Äonen des Lichts,


    des Lichts der [Stille der] Vorsehung


    und des Vaters der Stille,


    des [Lichts] des Wortes und der Wahrheit,


    des Lichts der […] [Unvergänglichkeiten,


    des] unendlichen Lichts,


    [des] Glanzes aus den Äonen des Lichts


    des nicht zu offenbarenden, nicht zu bezeichnenden,


    nicht alternden, nicht zu verkündenden Vaters,


    des Äons der Äonen,[a]


    des aus sich selbst Entstandenen, sich selbst Erzeugenden, sich selbst Hervorbringenden,


    des Fremden,


    des Äons,


    WAHRHEIT, ALĒTHŌS.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Äon« kann ein Weltzeitalter, eine ewige Weltordnung oder eine überweltliche Wesenheit bezeichnen. »Äon der Äonen« gibt die gesteigerte Formel des Zeugnisses wieder.
    reason: Der technische Ausdruck ist im Deutschen erklärungsbedürftig und soll nicht vorschnell auf »Ewigkeit« verengt werden.
  - marker: b
    text: Griechisch alēthōs bedeutet »wahrhaftig« oder »wahrlich«; die Umschrift bleibt erhalten, weil sie hier offenbar als feierliche Formel neben »WAHRHEIT« steht.
    reason: Die Form und mögliche liturgische Funktion des griechischen Schlusswortes sollen sichtbar bleiben.
lexical_decisions:
- source_word: sacred
  choice: heilig
  rationale: Die geläufige und würdige deutsche Entsprechung für die kultisch-religiöse Bezeichnung des Buches.
- source_word: Fullness
  choice: Fülle
  rationale: Bewahrt den technischen kosmologischen Sinn, ohne ihn durch eine konfessionelle Deutung festzulegen.
- source_word: aeon(s)
  choice: Äon(en)
  rationale: Die Transliteration erhält den möglichen Sinn als Weltzeitalter und zugleich als personifizierte überweltliche Größe.
- source_word: Providence
  choice: Vorsehung
  rationale: Natürliche deutsche Wiedergabe, die den möglicherweise personifizierten Charakter offenlässt.
- source_word: Speech
  choice: Wort
  rationale: Im vorliegenden kosmologischen Register klingt »Wort« natürlicher und kann sowohl Rede als auch eine hypostasierte Größe bezeichnen.
- source_word: indestructibilities
  choice: Unvergänglichkeiten
  rationale: Der ungewöhnliche abstrakte Plural wird absichtlich erhalten, da er kosmologische Wesenheiten oder Bereiche bezeichnen kann.
- source_word: alien
  choice: der Fremde
  rationale: Bewahrt die substantivische, möglicherweise titulare Form und ihre Aussage radikaler Andersartigkeit.
- source_word: ALĒTHŌS
  choice: ALĒTHŌS
  rationale: Die überlieferte griechische Form wird als feierliche Schlussformel unübersetzt bewahrt.
theological_decisions:
- issue: Genitivische Reihung der Gottesprädikate
  choice: Fortlaufende Genitivkonstruktion mit wiederholtem »des«
  alternative: Umformung in selbstständige Aussagesätze
  rationale: Die syntaktische Schwebe und liturgisch-katalogartige Struktur des Zeugnisses bleibt erhalten; eine eindeutige Zuordnung sämtlicher Titel wird nicht erzwungen.
- issue: Selbstursächliche Dreierformel
  choice: »aus sich selbst Entstandenen, sich selbst Erzeugenden, sich selbst Hervorbringenden«
  alternative: Vereinheitlichung als »Selbstgeschaffenen«
  rationale: Die drei verschiedenen Formulierungen und die in ihnen liegende Spannung werden nicht zu einem einzelnen dogmatischen Begriff eingeebnet.
- issue: Status von »Licht«, »Stille«, »Vorsehung«, »Wort« und »Wahrheit«
  choice: Großschreibung gemäß deutscher Substantivierung, ohne erklärende Personifizierung
  alternative: Ausdrückliche Kennzeichnung als göttliche Personen oder Äonen
  rationale: Der Text kann Titel, Kräfte oder hypostasierte Wesen meinen; die Übersetzung entscheidet diese Frage nicht.
translation_notes:
  register: Feierlich-liturgischer, katalogartiger Stil in modernem Standarddeutsch. Eckige Klammern und Auslassungspunkte bewahren die im englischen öffentlichen Zeugen markierten Ergänzungen und Textlücken. Da eine unmittelbare Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und eng am bereitgestellten Zeugen orientiert.
