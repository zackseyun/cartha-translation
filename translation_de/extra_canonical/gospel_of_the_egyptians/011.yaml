  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen hier und im Folgenden eine Lücke im erhaltenen Text. Die spitzen Klammern markieren eine unsichere oder ergänzte Lesung der Textvorlage.
    reason: Die verschiedenen editorischen Zeichen müssen für Leserinnen und Leser unterscheidbar sein.
  - marker: b
    text: Der Satzbau lässt offen, ob »durch die Jungfrauen« enger zur Vorbereitung beziehungsweise Aussaat oder zum heiligen Gefäß gehört.
    reason: Eine echte syntaktische Mehrdeutigkeit der Vorlage soll nicht unbemerkt durch die deutsche Wortstellung entschieden werden.
  - marker: c
    text: Gemeint ist offenbar eine Deutung des Namens »Sodom« nach dem Zahlenwert seiner Buchstaben; das zugrunde liegende Zahlensystem wird im Ausschnitt nicht erklärt.
    reason: Der technische Verweis auf einen Zahlenwert ist modernen Lesenden sonst kaum verständlich.
  - marker: d
    text: »Ihr Hervorgang« kann sich auf den Ursprung der Standhaltenden, ihres Geschlechts oder des Samens beziehen.
    reason: Der pronominale Bezug ist mehrdeutig und soll nicht dogmatisch festgelegt werden.
  - marker: e
    text: Das Subjekt von »sie wird … gesandt werden« ist unsicher; grammatisch liegt die Sintflut nahe, doch der Gedankengang kann auf ein kommendes Gericht vorausweisen.
    reason: Die schwierige zeitliche und sachliche Beziehung des Satzes darf nicht stillschweigend geglättet werden.
  - marker: f
    text: 'Die genaue Verbindung von Geschlecht, Propheten und Wächtern ist unsicher: Der Text kann ein durch sie hervorgebrachtes Geschlecht meinen oder diejenigen aus dem Geschlecht näher bestimmen, die mit ihnen verbunden sind.'
    reason: Die Vorlage bietet mehrere mögliche syntaktische Zuordnungen.
lexical_decisions:
- source_word: race
  choice: Geschlecht
  rationale: Bewahrt den antiken kosmologisch-genealogischen Sinn besser als das modern biologisch und politisch belastete »Rasse«; »Geschlecht« bleibt zugleich als Abstammungsgemeinschaft verständlich.
- source_word: aeon
  choice: Äon
  rationale: Der technische gnostische Begriff wird transliteriert, da je nach Zusammenhang sowohl ein Weltzeitalter als auch ein überweltlicher Bereich oder eine Wesenheit gemeint sein kann.
- source_word: archon
  choice: Archont
  rationale: Der technische Titel wird beibehalten, statt ihn durch »Herrscher« zu verengen.
- source_word: seed
  choice: Samen
  rationale: Erhält die wiederkehrende Bildwelt von Zeugung, Aussaat und Abstammung sowie ihre beabsichtigte Mehrdeutigkeit.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den gnostischen Fachbegriff in seiner etablierten deutschen Form wieder, ohne im Haupttext zusätzlich »Pleroma« einzuführen.
- source_word: emanation
  choice: Hervorgang
  rationale: Das natürliche deutsche Wort wahrt den kosmologischen Sinn, ohne eine bestimmte metaphysische Systematisierung durch »Emanation« vorauszusetzen.
- source_word: watchers
  choice: Wächter
  rationale: Bewahrt die personale und zugleich funktionale Bezeichnung sowie die Wortverbindung mit »wachen«.
- source_word: Logos
  choice: Logos
  rationale: Der traditionsreiche Fachbegriff bleibt stehen, da »Wort« mögliche personale und kosmologische Bezüge vorschnell festlegen könnte.
theological_decisions:
- issue: Bezug des weiblichen Pronomens am Anfang
  choice: Das Pronomen »sie« bleibt ohne ergänzte Identifikation stehen.
  alternative: Die gemeinte Gestalt namentlich identifizieren.
  rationale: Der vorgelegte Ausschnitt nennt die Bezugsfigur nicht; eine Ergänzung würde die im Fragment bestehende Unbestimmtheit beseitigen.
- issue: Wiederholter Ausdruck »wegen dieses Geschlechts«
  choice: Die kausale Wendung wird konsequent bewahrt.
  alternative: Je nach Kontext zwischen Ursache, Ziel und Begünstigung differenzieren.
  rationale: Der Text hält die Spannung aufrecht, dass Gerichte wegen beziehungsweise um dieses Geschlechts willen eintreten; diese theologische Mehrdeutigkeit darf nicht harmonisiert werden.
- issue: Sintflut und künftige Sendung
  choice: Der Wechsel von vergangenem Ereignis zu künftigem Passiv bleibt erhalten.
  alternative: Das künftige Subjekt als Feuer, Gericht oder Sintflut erklären.
  rationale: Der überlieferte Wortlaut ist in seinem Bezug schwierig. Eine eindeutige Identifikation wäre spekulativ.
- issue: »männliche Jungfrau« und »dreifach männlich«
  choice: Die paradoxen Geschlechtsbezeichnungen werden wörtlich bewahrt.
  alternative: Sie als »androgyn« oder rein symbolisch paraphrasieren.
  rationale: Die Spannung gehört zur theologischen Sprache des Werkes und soll nicht durch Deutung aufgelöst werden.
- issue: Vernichtung des Dämonen zeugenden Gottes
  choice: Die Aussage wird direkt und ohne dogmatische Abschwächung wiedergegeben.
  alternative: »göttliches Wesen« oder eine erklärende Distanzierung verwenden.
  rationale: Die polemische Kosmologie des Textes muss als solche hörbar bleiben und darf nicht an spätere konfessionelle Kategorien angepasst werden.
- issue: »Truth and Justice«
  choice: »Wahrheit und Gerechtigkeit« werden als personifizierbare Größen großgeschrieben.
  alternative: Kleinschreibung als bloße Eigenschaften.
  rationale: Der Geburtskontext legt personale oder hypostasierte Größen nahe, ohne dass dies durch Zusatzwörter endgültig festgelegt wird.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Text mit bewusst erhaltenen gnostischen Fachbegriffen und paradoxen Titeln. Wiederholungen wie »Samen«, »Geschlecht« und »wegen dieses Geschlechts« wurden nicht stilistisch geglättet, weil sie die argumentative und bildliche Struktur tragen. Eigennamen und die griechisch wirkenden Akklamationen bleiben unübersetzt. Der Entwurf ist aufgrund der noch ausstehenden direkten Prüfung des koptischen Textes ausdrücklich quellennah, aber vorläufig; Grundlage ist der angegebene öffentliche englische Zeuge.
