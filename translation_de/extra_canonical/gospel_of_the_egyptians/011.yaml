  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: de
  text: 'Sie empfing ihre Vollendung und ihre Kraft durch den Willen und das Wohlgefallen des Vaters. In diesem Wohlgefallen hatte er Gefallen an dem großen, unvergänglichen, unbeweglichen Geschlecht der großen, mächtigen Männer des großen Seth, damit er es in die hervorgebrachten Äonen säen und durch sie den Mangel ausfüllen konnte. Denn sie stieg von oben in die Welt hinab und war das Abbild der Nacht. Als sie hervorgetreten war, bat sie für den Samen des Archonten dieses Äons und für <die> Mächte, die aus ihm hervorgegangen waren – den befleckten Samen des Dämonen zeugenden Gottes, der vernichtet werden wird – und sie bat für den Samen […] Adams und des großen Seth, der der Sonne gleicht.[a]


    Dann kam der große Engel Hormos, um den Samen des großen Seth vorzubereiten: durch die Jungfrauen der befleckten Aussaat dieses Äons, in einem heiligen Gefäß, das der Logos durch den heiligen Geist gezeugt hatte.[b]


    Dann kam der große Seth mit seinem Samen, und dieser wurde in die hervorgebrachten Äonen gesät. Ihre Zahl entsprach dem Zahlenwert von »Sodom«.[c] Manche sagen, Sodom sei der Ort, an dem der große Seth weidet, nämlich Gomorra. Andere dagegen sagen, der große Seth habe seine Pflanzung aus Gomorra fortgenommen und an einen zweiten Ort verpflanzt, den er Sodom nannte.


    Dies ist das Geschlecht, das durch Edokla hervorkam; denn indem sie sprach, gebar sie Wahrheit und Gerechtigkeit. So wurde sie zum Anfang des Samens des ewigen Lebens, der denen bestimmt ist, die aufgrund der Erkenntnis ihres Hervorgangs standhalten werden.[d] Dies ist das große, unvergängliche Geschlecht, das durch drei […] Welten hindurch in die Welt gekommen ist. Die Sintflut ereignete sich als Sinnbild für die Vollendung des Äons; doch sie wird wegen dieses Geschlechts in die Welt gesandt werden.[e]


    Eine Feuersbrunst wird die Erde erfassen, und Gnade wird denen aus dem Geschlecht zuteilwerden, das durch die Propheten und die Wächter entstand, die über das Leben des Geschlechts wachen.[f] Wegen dieses Geschlechts werden Hungersnöte und Seuchen kommen; all dies wird um des großen, unvergänglichen Geschlechts willen geschehen. Wegen dieses Geschlechts werden Versuchungen kommen, ja sogar die Täuschung durch falsche Propheten.


    Dann sah der große Seth das Werk des Teufels: seine vielen Verkleidungen, seine Anschläge gegen das unvergängliche, unbewegliche Geschlecht, die Verfolgungen durch seine Mächte und seine Engel sowie ihren Irrtum, durch den sie gegen sich selbst handelten.


    Dann brachte der große Seth Lob dar:


    dem großen, unnennbaren, jungfräulichen Geist,


    und der männlichen […] Jungfrau Barbelon,


    und dem dreifach männlichen Kind Telmael Telmael Heli Heli Machar Machar Seth,


    der lebendigen Kraft ALĒTHES ALĒTHŌS,


    und der männlichen Jungfrau Youel,


    und Esephech, dem Hüter des Glanzes, der Krone seiner Herrlichkeit,


    und dem großen Äon Doxomedon,


    und den Thronen in ihm,


    und den Mächten, die sie umgeben,


    und der gesamten Fülle, wie ich zuvor erwähnt habe.


    Und er bat um Wächter für seinen Samen.'
