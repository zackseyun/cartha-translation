  terminology: „Geschlecht“, „Äon“, „Archont“, „Samen“, „Logos“, „Fülle“ und „Wächter“ sind konsequent und für diesen gnostischen Kontext angemessen wiedergegeben. Die paradoxen Titel und Namensfolgen bleiben ohne interpretierende Normalisierung erhalten.
  issues:
  - severity: medium
    issue: Aktivierung des Passivs bei der Erfüllung des Mangels
    rationale: Die Vorlage sagt, dass durch sie der Mangel erfüllt werden könne. „damit er … durch sie den Mangel ausfüllen konnte“ macht den Vater ausdrücklich zum Handelnden und verändert damit die Satzrelation.
  - severity: medium
    issue: Die Klammer in „the polluted (seed)“ fehlt
    rationale: Die Parenthese ist ein Bestandteil des englischen Zeugen und signalisiert eine textkritisch bzw. syntaktisch markierte Ergänzung oder Wiederaufnahme. „den befleckten Samen“ glättet diese Markierung.
  - severity: low
    issue: Die erhaltene Lücke „[]“ wurde bei Barbelon zu „[…]“ erweitert
    rationale: Die Vorlage bietet ein leeres Klammerpaar. Die Ergänzung durch Auslassungspunkte ist nicht belegt und sollte nicht in den Haupttext eingetragen werden.
