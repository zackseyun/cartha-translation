translation:
  language: de
  text: 'Dann gingen aus den großen Äonen vierhundert ätherische Engel hervor. Unter ihnen waren der große Aerosiel und der große Selmechel. Sie sollten über das große unvergängliche Geschlecht, seine Frucht und die großen Männer des großen Seth wachen – von der Zeit und dem Augenblick der Wahrheit und Gerechtigkeit an bis zur Vollendung des Äons und seiner Archonten, die von den großen Richtern zum Tod verurteilt worden waren.


    Dann wurde der große Seth von den vier Lichtern ausgesandt, nach dem Willen des Selbsterzeugten, […] und der ganzen Fülle, durch <die Gabe> und das Wohlgefallen des großen unsichtbaren Geistes sowie durch die fünf Siegel und die ganze Fülle.


    Er durchschritt die drei Ankünfte, die ich zuvor erwähnt habe: die Sintflut, den Weltenbrand und die Verurteilung der Archonten, der Mächte und der Gewalten. So sollte die Verirrte gerettet werden: durch die Versöhnung der Welt und durch die Taufe mittels eines vom Logos gezeugten Leibes. Diesen bereitete der große Seth durch die Jungfrau heimlich für sich selbst vor, damit die Heiligen durch den heiligen Geist gezeugt würden – durch unsichtbare, geheime Zeichen, durch die Versöhnung von Welt mit Welt, durch die Absage an die Welt und an den Gott der dreizehn Äonen und durch die Thronsitze der heiligen, unaussprechlichen, unvergänglichen Wesen im Schoß und im großen Licht des Vaters. Dieses Licht bestand mit seiner Vorsehung schon zuvor und setzte durch sie die heilige Taufe ein, die den Himmel überragt: durch den Unvergänglichen […], der vom Logos gezeugt wurde, nämlich den Lebenden, Jesus, den der große Seth anzog. Durch ihn schlug er die Mächte der dreizehn Äonen ans Kreuz und festigte
    diejenigen, die hervorgebracht und fortgenommen werden.[a]


    Er rüstete sie mit dem Panzer der Erkenntnis dieser Wahrheit aus, in der unüberwindlichen Kraft der Unvergänglichkeit. Ihnen erschienen:


    Der große Diener Yesseus Mazareus Yessedekeus, das lebendige Wasser;


    und die großen Obersten: Jakob der Große,


    Theopemptos und Isavel;


    und die Aufseher über die Quelle der Wahrheit: Micheus, Michar und Mnesinous;


    und der Aufseher über die Taufe für die Lebenden;


    und die Reinigenden;


    und Sesengenpharanges;


    und die Aufseher über die Tore zu den Wassern: Micheus und Michar;


    und die Aufseher über den hohen Berg: Seldao und Elainos;


    und die Empfänger des großen Geschlechts;


    die unvergänglichen mächtigen Männer <des> großen Seth;


    die Diener der vier Lichter: der große Gamaliel, der große Gabriel, der große Samblo und der große […] Abrasax;


    und die Aufseher über den Sonnenaufgang: Olses, Hupneus und Heurumaious;


    und die über den Eingang in die Ruhe des ewigen Lebens gesetzten Herrscher Mixanther und Michanor;


    und die Wächter der erwählten Seelen: Akramas und Strempouchos;


    und die große Macht Heli Heli Machar Machar Seth;


    und der große, unsichtbare, unnennbare, unaussprechliche jungfräuliche Geist und die Stille;


    und das große Licht Harmozel;


    der Ort des lebendigen Selbsterzeugten, des Gottes der Wahrheit, und <derjenige>, der ihn begleitet:


    der unvergängliche Mensch Adamas;


    der zweite, Oroiael, der Ort des großen Seth;


    und Jesus, der das Leben besitzt, der kam und das ans Kreuz schlug, was im Gesetz ist;[b]


    der dritte, Davithe, der Ort der Söhne des großen Seth;


    der vierte, Eleleth, der Ort der Seelen der zur Ruhe gelangten Söhne;


    der fünfte, Yoel, der über den Namen dessen gesetzt ist, der dazu bestimmt werden wird, mit der heiligen Taufe zu taufen, die den unvergänglichen Himmel überragt.


    Von nun an aber werden sie […] durch den unvergänglichen Menschen Poimael und durch diejenigen, die des Flehens würdig sind, durch die Absagen der fünf Siegel an der Taufquelle ihre Empfänger erkennen, sobald sie über sie unterwiesen worden sind. Auch sie werden von ihren Empfängern erkannt werden, und sie werden den Tod keineswegs schmecken.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Satz ist an mehreren Stellen beschädigt und syntaktisch schwer durchschaubar. Insbesondere bleibt unklar, worauf sich „dieses Licht“, „durch sie“ und „der Unvergängliche“ jeweils genau beziehen und wie „hervorgebracht und fortgenommen“ zu verstehen ist.
    reason: Textschaden und echte syntaktisch-theologische Mehrdeutigkeit werden offengelegt.
  - marker: b
    text: 'Wörtlich sinngemäß: „der kam und das kreuzigte, was im Gesetz ist“. Ob damit ein Inhalt, eine Macht oder eine Vorschrift des Gesetzes gemeint ist, bleibt offen.'
    reason: Die ungewöhnliche Aussage darf nicht stillschweigend zu einer eindeutigen Lehre über das Gesetz umgeformt werden.
  - marker: c
    text: Der Anfang dieses Satzes weist eine Textlücke auf; auch der Zusammenhang zwischen Poimael, den des Flehens Würdigen und den „Absagen der fünf Siegel“ ist im erhaltenen Wortlaut grammatisch unsicher.
    reason: Die Übersetzung markiert die begrenzte Sicherheit des beschädigten Abschlusses.
lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der technische kosmologische Begriff wird beibehalten und nicht vereinfachend mit „Zeitalter“ oder „Welten“ wiedergegeben.
- source_word: archons
  choice: Archonten
  rationale: Der etablierte Fachbegriff wahrt die spezifische Rolle dieser kosmischen Herrscher.
- source_word: Fullness
  choice: Fülle
  rationale: „Fülle“ ist die geläufige deutsche Wiedergabe des technischen Begriffs, ohne ihn durch eine konfessionelle Auslegung zu präzisieren.
- source_word: self-generated one
  choice: Selbsterzeugter
  rationale: Die substantivierte Form gibt die ungewöhnliche Selbstbezeichnung möglichst formal wieder.
- source_word: parousias
  choice: Ankünfte
  rationale: Die Grundbedeutung wird verständlich wiedergegeben; „Parusien“ könnte hier vorschnell ausschließlich christologisch verstanden werden.
- source_word: Logos
  choice: Logos
  rationale: Der technische Ausdruck bleibt erhalten, da „Wort“ mögliche philosophisch-kosmologische Bezüge verengen könnte.
- source_word: reconciling
  choice: Versöhnung
  rationale: Die relationale und möglicherweise kosmologische Mehrdeutigkeit des Ausdrucks bleibt gewahrt.
- source_word: receivers
  choice: Empfänger
  rationale: Die wörtliche, im Ritualzusammenhang technische Bezeichnung wird beibehalten, obwohl ihre genaue Funktion unklar bleibt.
- source_word: repose
  choice: Ruhe
  rationale: „Ruhe“ wahrt den religiösen Sinn eines endgültigen Ruheortes, ohne Tod oder Schlaf eindeutig festzulegen.
- source_word: renunciations
  choice: Absagen
  rationale: „Absagen“ passt zum rituellen Taufkontext und vermeidet die stärker asketische Einengung von „Entsagungen“.
theological_decisions:
- issue: Verhältnis des großen Seth zu Jesus
  choice: „Jesus, den der große Seth anzog“
  alternative: „Jesus, mit dem sich der große Seth bekleidete“
  rationale: Die Kleidungsmetapher wird ausdrücklich bewahrt, ohne das Verhältnis ontologisch oder konfessionell zu erklären.
- issue: Gegenstand der Kreuzigung durch Jesus
  choice: „das ans Kreuz schlug, was im Gesetz ist“
  alternative: „das Gesetz kreuzigte“
  rationale: Die syntaktische Spannung des Zeugnisses wird erhalten; der Text setzt das Gesetz nicht eindeutig als Ganzes mit dem Gekreuzigten gleich.
- issue: Die feminine Verirrte
  choice: „die Verirrte“
  alternative: „sie, die sich verirrt hatte“
  rationale: Das feminine Subjekt bleibt ohne Identifikation erhalten, statt es etwa als Seele, Weisheit oder Welt auszulegen.
- issue: Zeugung der Heiligen durch den heiligen Geist
  choice: „durch den heiligen Geist gezeugt“
  alternative: „aus dem Heiligen Geist geboren“
  rationale: Die Zeugungssprache des Zeugnisses wird gewahrt, ohne sie an eine bestimmte kanonische Formel anzugleichen.
- issue: Kreuzigung der Mächte
  choice: „schlug er die Mächte … ans Kreuz“
  alternative: „kreuzigte er die Mächte“
  rationale: Das starke Bild wird direkt wiedergegeben und nicht als bloßer Sieg oder Entmachtung paraphrasiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen und Eigennamen. Lange Perioden wurden behutsam gegliedert, ohne die gedankliche Verkettung zu glätten. Eckige Klammern kennzeichnen Überlieferungslücken, spitze Klammern editorische Ergänzungen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung als quellennaher, vorläufiger Publikationsentwurf auf Grundlage des angegebenen englischen Zeugnisses zu behandeln.
