review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die Lücken, Ergänzungen sowie die technische Terminologie. Eine sichere Korrektur ist jedoch bei einem mehrdeutigen Relativsatz nötig: „Dieses Licht“ legt den im Zeugen syntaktisch unsicheren Bezug unzulässig auf das große Licht fest. Die Revision erhält die Unsicherheit durch eine syntaktisch offenere Formulierung und erläutert sie in der Anmerkung. Kleinere Anpassungen stellen ferner „Gefolge“, „Rüstung“ und die fortdauernde/passivische Aussage „hervorgebracht und weggenommen werden“ genauer dar.'
  naturalness: Modernes Standarddeutsch, sachlich-würdig und trotz der absichtlich fremdartigen kosmologischen Aufzählung gut lesbar. Die lange Satzperiode bleibt als Kennzeichen des Zeugen erhalten, wird aber durch Gedankenstriche und klare Bezüge lesbar gegliedert.
  terminology: „Äonen“, „Archonten“, „Fülle“, „Logos“, „Selbsterzeugter“, „Unvergänglicher“ und „Empfänger“ bleiben als fachsprachlich erforderliche Begriffe erhalten. „Ankünfte“ gibt parousiai nicht konfessionell verengt wieder. Die Eigennamen und editorischen Zeichen werden unverändert bewahrt.
  issues:
  - severity: medium
    issue: Eindeutige Festlegung des Bezugs von „which pre-existed … and which instituted …“ auf „dieses Licht“
    rationale: Der englische Zeuge ist an dieser Stelle syntaktisch beschädigt bzw. unsicher. Die Formulierung „Dieses Licht bestand … und setzte … ein“ macht das große Licht zum eindeutigen handelnden Subjekt, obwohl der Bezug im Zeugen nicht sicher ist.
  - severity: low
    issue: „Panzer der Erkenntnis“
    rationale: „Armor of knowledge“ bezeichnet umfassender eine Rüstung bzw. Bewaffnung. „Rüstung der Erkenntnis“ ist genauer, ohne das Bild zu verändern.
  - severity: low
    issue: „die hervorgebracht und fortgenommen werden“
    rationale: Die deutsche Fassung soll die im Zeugen präsente/passivische Form („are produced and removed“) nicht durch eine abgeschlossene Vergangenheit abschwächen.
  revised_text: 'Dann gingen aus den großen Äonen vierhundert ätherische Engel hervor, in deren Gefolge der große Aerosiel und der große Selmechel waren. Sie sollten über das große unvergängliche Geschlecht, seine Frucht und die großen Männer des großen Seth wachen – von der Zeit und dem Augenblick der Wahrheit und Gerechtigkeit an bis zur Vollendung des Äons und seiner Archonten, die von den großen Richtern zum Tod verurteilt worden waren.


    Dann wurde der große Seth von den vier Lichtern ausgesandt, nach dem Willen des Selbsterzeugten, […] und der ganzen Fülle, durch <die Gabe> und das Wohlgefallen des großen unsichtbaren Geistes sowie durch die fünf Siegel und die ganze Fülle.


    Er durchschritt die drei Ankünfte, die ich zuvor erwähnt habe: die Sintflut, den Weltenbrand und die Verurteilung der Archonten, der Mächte und der Gewalten. So sollte die Verirrte gerettet werden: durch die Versöhnung der Welt und durch die Taufe mittels eines vom Logos gezeugten Leibes. Diesen bereitete der große Seth durch die Jungfrau heimlich für sich selbst vor, damit die Heiligen durch den heiligen Geist gezeugt würden – durch unsichtbare, geheime Zeichen, durch die Versöhnung von Welt mit Welt, durch die Absage an die Welt und an den Gott der dreizehn Äonen und durch die Thronsitze der heiligen, unaussprechlichen, unvergänglichen Wesen im Schoß und im großen Licht des Vaters, der mit seiner Vorsehung schon zuvor bestand und durch sie die heilige Taufe einsetzte, die den Himmel überragt: durch den Unvergänglichen […], der vom Logos gezeugt wurde, nämlich den Lebenden, Jesus, den der große Seth anzog. Durch ihn schlug er die Mächte der dreizehn Äonen ans Kreuz und bestätigte diejenigen,
    die hervorgebracht und weggenommen werden.[a]


    Er rüstete sie mit einer Rüstung der Erkenntnis dieser Wahrheit aus, in der unbesiegbaren Kraft der Unvergänglichkeit. Ihnen erschienen:


    Der große Begleiter Yesseus Mazareus Yessedekeus, das lebendige Wasser;


    die großen Obersten: Jakob der Große,


    Theopemptos und Isavel;


    die Aufseher über die Quelle der Wahrheit: Micheus, Michar und Mnesinous;


    der Aufseher über die Taufe für die Lebenden;


    die Reinigenden;


    Sesengenpharanges;


    die Aufseher über die Tore zu den Wassern: Micheus und Michar;


    die Aufseher über den hohen Berg: Seldao und Elainos;


    die Empfänger des großen Geschlechts;


