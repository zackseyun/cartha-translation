translation:
  language: de
  text: 'Der große Logos, der selbstentstandene Gott, und der unvergängliche Mensch Adamas brachten Lobpreis dar. Sie baten um eine Kraft und eine ewige Macht für den Selbstentstandenen, zur Vollendung der vier Äonen, damit durch sie [] […] die Herrlichkeit und Macht des unsichtbaren Vaters der heiligen Menschen des großen Lichts sichtbar würde, die in die Welt, das Abbild der Nacht, eintreten werden.


    Der unvergängliche Mensch Adamas bat sie darum, dass aus ihm ein Sohn hervorgehe, damit er zum Vater des unbeweglichen, unvergänglichen Geschlechts werde, damit durch dieses Schweigen und Stimme offenbar würden und damit durch dieses der tote Äon sich erhöbe, um sich aufzulösen. Und so ging von oben die Kraft des großen Lichts hervor: die Erscheinung. Sie gebar die vier großen Lichter:


    Harmozel,


    Oroiael,


    Davithe,


    Eleleth,


    und den großen unvergänglichen Seth, den Sohn des unvergänglichen Menschen Adamas. So wurde die vollkommene Siebenheit, die in verborgenen Geheimnissen besteht, vollendet. [] Wenn sie die [Herrlichkeit] [empfängt], wird sie zu elf Achtheiten, und der Vater gab durch ein Nicken seine Zustimmung. Die ganze Fülle der Lichter freute sich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Der traditionsreiche Fachbegriff bleibt erhalten, da „Wort“ mögliche personhafte und kosmologische Bedeutungen verengen könnte.
- source_word: self-generated
  choice: selbstentstanden / der Selbstentstandene
  rationale: Gibt die Aussage einer Herkunft aus sich selbst wieder, ohne mit „selbsterschaffen“ eine Schöpfungshandlung ausdrücklich festzulegen.
- source_word: indestructible
  choice: unvergänglich
  rationale: Natürliches, würdevolles Deutsch; bezeichnet bleibende Unzerstörbarkeit, ohne die wiederholte Formulierung unnötig technisch klingen zu lassen.
- source_word: aeon
  choice: Äon
  rationale: Der gnostische Fachbegriff bleibt wegen seines besonderen kosmologischen Gehalts erhalten.
- source_word: Manifestation
  choice: Erscheinung
  rationale: Bewahrt den personifizierten Charakter durch Großschreibung und ein feminines deutsches Substantiv, auf das „sie“ zurückverweisen kann.
- source_word: Hebdomad
  choice: Siebenheit
  rationale: Gibt die zahlenhafte Gruppe verständlich wieder, ohne sie als bloße Zahl Sieben zu reduzieren.
- source_word: Ogdoads
  choice: Achtheiten
  rationale: Bewahrt die technische Vorstellung von Achtergruppen und den auffälligen Plural des Zeugen.
- source_word: Fullness
  choice: Fülle
  rationale: Entspricht dem kosmologischen Fachsinn, ohne ihn durch eine ergänzende Deutung zu erklären.
theological_decisions:
- issue: Bezug von „the image of the night“
  choice: „die Welt, das Abbild der Nacht“
  alternative: „die in die Welt eintreten werden, das Abbild der Nacht“
  rationale: Die Apposition wird im Deutschen so gefasst, dass sie sich grammatisch am ehesten auf „Welt“ bezieht; die beschädigte Textumgebung lässt dennoch Unsicherheit bestehen.
- issue: Art der Hervorbringung des Sohnes aus Adamas
  choice: „dass aus ihm ein Sohn hervorgehe“
  alternative: „dass ihm aus sich selbst ein Sohn entstehe“
  rationale: „Hervorgehen“ bewahrt die Emanationssprache, ohne Zeugung oder Schöpfung dogmatisch festzulegen.
- issue: Zweck des Sich-Erhebens des toten Äons
  choice: „um sich aufzulösen“
  alternative: „damit er aufgelöst würde“
  rationale: Der reflexive Wortlaut des englischen Zeugen wird gewahrt, obwohl offenbleibt, ob Selbstauflösung oder Auflösung durch eine andere Macht gemeint ist.
- issue: Personifizierung der Erscheinung
  choice: „die Erscheinung. Sie gebar“
  alternative: „die Offenbarung. Sie brachte hervor“
  rationale: Die feminine Personifizierung und das konkrete Gebären werden bewahrt, ohne die Gestalt mit einer anderweitig definierten theologischen Figur gleichzusetzen.
- issue: Zahlenmystische Aussage „eleven Ogdoads“
  choice: „elf Achtheiten“
  alternative: „elf Ogdoaden“
  rationale: Die ungewöhnliche Aussage bleibt ohne rechnerische Harmonisierung oder spekulative Erklärung stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit behutsam bewahrter gnostischer Fachsprache. Die Überlieferungslücken und unsicheren Ergänzungen bleiben durch [] beziehungsweise eckige Klammern sichtbar. Da eine unmittelbare Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert; unklare Syntax und theologische Spannungen wurden nicht stillschweigend geglättet.
