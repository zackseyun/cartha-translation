lexical_decisions:
- source_word: great Light
  choice: großes Licht
  rationale: Die wörtliche, möglicherweise titulare Formulierung bleibt erhalten; die Kleinschreibung des Adjektivs vermeidet eine unnötige dogmatische Festlegung.
- source_word: indestructible
  choice: unvergänglich
  rationale: Im kosmologischen Kontext bezeichnet der Ausdruck eher Unvergänglichkeit als bloße physische Unzerstörbarkeit.
- source_word: Logos
  choice: Logos
  rationale: Der traditionsreiche Fachbegriff bleibt stehen, weil „Wort“, „Vernunft“ oder „Rede“ jeweils nur einen Teil des Bedeutungsfeldes wiedergeben würden.
- source_word: self-generated
  choice: aus sich selbst entstanden
  rationale: Diese transparente Umschreibung gibt die Selbstentstehung wieder, ohne den schwer verständlichen Neologismus „selbsterzeugt“ zu erzwingen.
- source_word: deficiency
  choice: Mangel
  rationale: „Mangel“ bewahrt den kosmologischen Fachsinn und legt nicht vorschnell „Sünde“, „Fehler“ oder eine konkrete metaphysische Lehre fest.
- source_word: Fullness
  choice: Fülle
  rationale: „Fülle“ ist eine natürliche deutsche Wiedergabe und bewahrt zugleich den möglichen technischen Sinn eines vollständigen göttlichen Bereichs.
- source_word: aeon
  choice: Äon
  rationale: Der Fachbegriff wahrt die Mehrdeutigkeit zwischen Weltzeitalter, Sphäre und personifizierter Emanation.
- source_word: keeper of splendor
  choice: Hüter des Glanzes
  rationale: Die titulare Wendung wird knapp und formal wiedergegeben.
theological_decisions:
- issue: Ursächlichkeit und Zielbestimmung der Schöpfung in Bezug auf Adamas
  choice: „Durch ihn und um seinetwillen entstand alles“
  alternative: „durch den und für den alles entstand“
  rationale: Die Formulierung hält sowohl vermittelnde Ursache als auch Zielbezug fest, ohne Adamas mit einer anderen theologischen Gestalt gleichzusetzen.
- issue: Das Hervortreten und Herabsteigen des Vaters
  choice: „trat hervor und stieg von oben herab“
  alternative: „ging aus und kam von oben herab“
  rationale: Die Übersetzung bewahrt die emanative und räumliche Bildsprache, ohne daraus eine präzise Inkarnationslehre abzuleiten.
- issue: Verhältnis von Logos und Mensch
  choice: „Ein Logos des Menschen entstand; der Mensch aber entstand durch einen Sprechakt“
  alternative: „Ein menschlicher Logos entstand, doch der Mensch entstand durch das Wort“
  rationale: Der Genitiv und der Kontrast bleiben möglichst offen; weder wird „Logos des Menschen“ zu einem bloßen Adjektiv abgeschwächt noch der Sprechakt ohne sichere Grundlage mit dem personalen Logos gleichgesetzt.
- issue: Paradoxe Geschlechtsbezeichnungen
  choice: „männliche Jungfrau“ und „dreifach männliches Kind“
  alternative: glättende oder symbolisch ausdeutende Umschreibungen
  rationale: Die auffälligen, theologisch spannungsvollen Titel werden nicht harmonisiert oder erklärt.
- issue: Kosmologische Wendung „earth of the air“
  choice: „Erde der Luft“
  alternative: „luftartige Erde“ oder „Land des Luftraums“
  rationale: Die ungewöhnliche Genitivverbindung bleibt erhalten, da ihre genaue kosmologische Referenz unsicher ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenen kosmologischen Fachbegriffen. Namen und vokalische Namensformeln wurden nicht eingedeutscht. Die listenartige Liturgie und die paradoxen Titel bleiben formal sichtbar. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert; Restaurierungen und Unsicherheiten werden nicht geglättet.
