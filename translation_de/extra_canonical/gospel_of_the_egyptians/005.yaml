translation:
  language: de
  text: '[a] [… erschien aus] jenem [Ort] die Wolke [des] großen Lichts: die lebendige Kraft, die Mutter der heiligen, unvergänglichen Wesen, die große Kraft Mirothoe. Und sie gebar den, dessen Namen ich nenne, indem ich dreimal ausrufe:[b]


    IEN


    IEN


    EA


    EA


    EA,


    Denn dieser ist es: Adamas, das strahlende Licht, das aus dem Menschen, dem Urmenschen, hervorgeht. Durch ihn und um seinetwillen entstand alles; ohne ihn entstand nichts. Der unerkennbare, unfassbare Vater trat hervor und stieg von oben herab, um den Mangel aufzuheben.


    Dann vereinigten sich der große Logos, der aus sich selbst entstandene Gott, und der unvergängliche Mensch Adamas miteinander. Ein Logos des Menschen entstand; der Mensch aber entstand durch einen Sprechakt.[c] Er brachte Lobpreis dar für:


    den großen unsichtbaren, unfassbaren jungfräulichen Geist,


    und die männliche Jungfrau,


    und das dreifach männliche Kind,


    […] und die männliche [Jungfrau] Youel,


    und Esephech, den Hüter des Glanzes,


    das Kind des Kindes,


    und die Krone seiner Herrlichkeit,


    den großen Äon Doxomedon,


    und die Throne in ihm,


    und die Mächte rings um ihn,


    die Herrlichkeiten,


    und die Unvergänglichkeiten,


    und ihre ganze Fülle, die ich zuvor erwähnt habe,


    und die Erde der Luft, die Gott aufnimmt,


    wo die heiligen Menschen des großen Lichts ein Bild empfangen,


    die Menschen des Vaters der schweigenden, lebendigen Stille,


    den Vater und ihre ganze Fülle, wie ich zuvor erwähnt habe.[d]'
