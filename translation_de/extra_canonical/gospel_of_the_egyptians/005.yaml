  terminology: „Logos“, „Adamas“, „Äon“, „Fülle“, „Mirothoe“, „Youel“ und „Esephech“ sind sachgerecht beibehalten. „männliche Jungfrau“ und „dreifach männliches Kind“ bewahren die absichtlich paradoxe Titelsprache. „Erde der Luft“ ist als wörtlich-offene kosmologische Wendung angemessen.
