translation:
  language: de
  text: 'Ihre Gefährten traten hervor, um die Achtheit des selbsterzeugten Gottes zu vollenden:


    Gnade, dem ersten Licht Harmozel zugeordnet;

    Wahrnehmung, dem zweiten Licht Oroiael zugeordnet;

    Verständnis, dem dritten Licht Davithe zugeordnet;

    Urteilsvermögen, dem vierten Licht Eleleth zugeordnet.


    Dies ist die erste Achtheit des selbsterzeugten Gottes, und der Vater gab durch ein Nicken seine Zustimmung. Die ganze Fülle der Lichter freute sich.


    Die Diener traten hervor:


    der erste, der große Gamaliel, dem ersten großen Licht Harmozel zugeordnet;

    und der große Gabriel, dem zweiten großen Licht Oroiael zugeordnet;

    und der große Samlo[a], dem großen Licht Davithe zugeordnet;

    und der große Abrasax, dem […] [großen Licht] Eleleth zugeordnet.


    Auch die Gefährten traten hervor, nach dem Willen, der dem Vater wohlgefiel:


    Erinnerung, dem großen Gamaliel, dem ersten, zugeordnet;

    Liebe, dem großen Gabriel, dem zweiten, zugeordnet;

    Frieden, dem großen Samblo[b], dem dritten, zugeordnet;

    Ewiges Leben, dem großen Abrasax, dem vierten, zugeordnet.


    Auf diese Weise wurden die fünf Achtheiten vollendet, insgesamt vierzig, als eine Kraft, die sich jeder Deutung entzieht.


    Dann brachten der große selbsterzeugte Logos[c] und das Wort der Fülle der vier Lichter Lob dar:


    dem großen unsichtbaren, unnennbaren jungfräulichen Geist,

    ja, der männlichen Jungfrau,

    und dem großen Äon Doxomedon,

    und den Thronen in ihnen,

    und den Kräften um sie herum,

    den Herrlichkeiten, Gewalten und Mächten,

    [und] dem dreifach-männlichen Kind,

    und der männlichen Jungfrau Youel,

    und Esephech, […], dem Hüter des Glanzes, [dem Kind] des Kindes,

    und der Krone [seiner] Herrlichkeit,

    der ganzen Fülle,

    und allen Herrlichkeiten, die dort wohnen,

    den unendlichen Füllen

    und den unnennbaren Äonen,


    damit sie den Vater, den Vierten, zusammen mit dem unvergänglichen Geschlecht benennen und den Samen des Vaters den Samen des großen Seth nennen könnten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name erscheint hier als „Samlo“, später jedoch als „Samblo“. Die abweichenden Formen wurden bewahrt.
    reason: Textinterne Namensvariante beziehungsweise mögliche Überlieferungsstörung.
  - marker: b
    text: Zuvor steht „Samlo“; hier lautet der Name „Samblo“.
    reason: Macht die inkonsistente Namensform transparent, ohne sie zu vereinheitlichen.
  - marker: c
    text: „Logos“ kann „Wort“, „Rede“ oder „Vernunft“ bedeuten. Der Fachbegriff bleibt hier stehen, weil unmittelbar danach ein weiterer Ausdruck für „Wort/Rede“ folgt.
    reason: Bewahrt die terminologische Unterscheidung und die semantische Offenheit.
lexical_decisions:
- source_word: Ogdoad
  choice: Achtheit
  rationale: Das verständliche deutsche Bildungswort bewahrt die technische Bedeutung einer geordneten Gruppe von acht Wesenheiten; die wiederholte Zahlenangabe vierzig bleibt dadurch nachvollziehbar.
- source_word: self-generated
  choice: selbsterzeugt
  rationale: Bewahrt die kosmologische Eigenbezeichnung, ohne sie durch stärker dogmatisch geprägte Begriffe wie „ungezeugt“ umzudeuten.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den technischen pleromatischen Begriff würdig und zugleich verständlich wieder.
- source_word: Logos
  choice: Logos
  rationale: Der Fachbegriff bleibt stehen, während das unmittelbar folgende „Wort“ die im Text vorhandene Unterscheidung zwischen Logos und Rede/Wort sichtbar hält.
- source_word: Discretion
  choice: Urteilsvermögen
  rationale: Bezeichnet eine Fähigkeit zu besonnener Unterscheidung natürlicher als „Diskretion“, ohne sie mit bloßer Klugheit gleichzusetzen.
- source_word: aeon
  choice: Äon
  rationale: Bewahrt die technische kosmologische Bedeutung statt sie vorschnell als bloßes „Zeitalter“ wiederzugeben.
theological_decisions:
- issue: Geschlechtlich paradoxe Gottesbezeichnungen
  choice: „jungfräulicher Geist“, „männliche Jungfrau“ und „dreifach-männliches Kind“ bleiben wörtlich spannungsvoll stehen.
  alternative: Die Ausdrücke geschlechtsneutralisieren oder erklärend harmonisieren.
  rationale: Die ungewöhnliche geschlechtliche Bildsprache gehört zur theologischen Eigenart des Textes und darf nicht stillschweigend aufgelöst werden.
- issue: Beziehung der aufgezählten Wesen zu den Lichtern und Dienern
  choice: Die elliptischen Genitive werden mit „zugeordnet“ wiedergegeben.
  alternative: Besitz oder Abstammung durch „von“ beziehungsweise „Sohn/Tochter des“ festlegen.
  rationale: „Zugeordnet“ ergibt natürliches Deutsch, ohne die im Zeugen nicht eindeutig bestimmte Beziehung als Besitz oder Abstammung zu definieren.
- issue: „the Father, the fourth“
  choice: „den Vater, den Vierten“
  alternative: „den vierten Vater“
  rationale: Die appositionale Mehrdeutigkeit wird bewahrt; die Übersetzung legt nicht fest, ob eine feste Titulatur oder eine Rangfolge gemeint ist.
- issue: Zwecksatz am Ende
  choice: „damit sie … benennen … und … nennen könnten“
  alternative: Als Feststellung wiedergeben, dass diese Benennung tatsächlich erfolgt.
  rationale: Die finale Ausrichtung des Satzes und sein modaler Charakter bleiben erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgisch-kosmologischem Klang. Elliptische Listen wurden behutsam syntaktisch verdeutlicht. Eckige Klammern und Auslassungszeichen markieren Ergänzungen beziehungsweise beschädigten oder fehlenden Text. Die Übersetzung ist vorläufig, da nur der angegebene englische gemeinfreie Zeuge vorlag und eine direkte Prüfung des koptischen Textes noch aussteht.
