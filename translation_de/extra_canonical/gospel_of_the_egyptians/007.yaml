  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Die listenförmige Gestaltung ist angemessen. „nach dem Willen des Wohlgefallens des Vaters“ ist zwar bewusst feierlich und dicht, gibt aber die verschachtelte Formulierung des Zeugen genauer wieder als die vorliegende Umformung.
  terminology: „Achtheit“, „selbsterzeugt“, „Fülle“, „Äon“ und „Logos“ sind für diesen vorläufig nur gegen den englischen Zeugen geprüften Text sachgerecht. Die Namensvariante Samlo/Samblo und die technische Differenzierung von Logos und Wort bleiben erhalten.
  issues:
  - severity: medium
    issue: „by the will of the pleasure of the Father“ ist als „nach dem Willen, der dem Vater wohlgefiel“ wiedergegeben.
    rationale: Die Fassung macht den Willen selbst zum Gegenstand des göttlichen Gefallens. Der Zeuge spricht hingegen vom Willen des Wohlgefallens des Vaters; die genitivische Beziehung sollte gewahrt werden.
  - severity: medium
    issue: Leere eckige Klammern des Zeugen wurden als „[…]“ wiedergegeben.
    rationale: „[]“ und „[…]“ sind unterschiedliche editorische Signale. Da der englische Audit trail ausdrücklich die Bewahrung von Klammer- und Schadenssignalen verlangt, sind die leeren Klammern unverändert zu übernehmen.
