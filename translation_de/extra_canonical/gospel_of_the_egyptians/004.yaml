translation:
  language: de
  text: 'Sie baten [um eine] Kraft. Eine Stille der lebendigen Stille ging hervor, nämlich [Herrlichkeiten] und Unvergänglichkeiten in den Äonen, [… Äonen], Myriaden, hinzugefügt [zu den …], drei Männliche, [die drei] männlichen Nachkommen. Die [männlichen] Geschlechter erfüllten den großen Doxomedon [Äon mit] der Kraft der Rede der [gesamten Fülle].


    Dann brachte das dreifach-männliche [Kind des großen] Christus, das der [große] unsichtbare Geist gesalbt hatte und dessen Kraft Ainon [genannt wurde], dem großen unsichtbaren Geist [Lobpreis dar] und seiner männlichen Jungfrau, Joël, und der Stille der schweigenden Stille und der Größe […].


    [Im Codex III fehlen die Seiten 45–48; dieser Abschnitt entspricht den Seiten 55–60 des Codex IV.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Codex III, Seiten 45–48, ist nicht erhalten. Der entsprechende Text steht in Codex IV auf den Seiten 55–60.
    reason: Die Handschriftenlücke und die Grundlage des hier gebotenen Abschnitts müssen für die Textkritik sichtbar bleiben.
lexical_decisions:
- source_word: power
  choice: Kraft
  rationale: „Kraft“ bewahrt den kosmologisch-personalen Bedeutungsraum besser als das institutionell oder politisch klingende „Macht“.
- source_word: silence / living Silence / silent Silence
  choice: Stille / lebendige Stille / schweigende Stille
  rationale: Die wiederholte Begrifflichkeit und die offenbar hypostatische Verwendung werden beibehalten, ohne die Ausdrücke dogmatisch auszudeuten.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff wahrt die mögliche Bedeutung als Zeiträume und zugleich als personifizierte himmlische Größen.
- source_word: indestructibilities
  choice: Unvergänglichkeiten
  rationale: Das abstrakte Pluralwort bildet die ungewöhnliche Ausdrucksweise des Zeugnisses ab und vermeidet eine vorschnelle Personalisierung.
- source_word: the Fullness
  choice: die Fülle
  rationale: „Fülle“ gibt den kosmologischen Terminus verständlich wieder; die Großschreibung des englischen Zeugen wird im Deutschen nicht zur zusätzlichen Deutung genutzt.
- source_word: triple-male
  choice: dreifach-männlich
  rationale: Die auffällige dreifache männliche Bestimmung wird möglichst eng bewahrt; eine glättende Umschreibung würde die technische oder symbolische Bedeutung verdecken.
- source_word: male virgin
  choice: männliche Jungfrau
  rationale: Die absichtsvoll spannungsreiche Verbindung wird nicht harmonisiert oder durch eine geschlechtlich eindeutigere Bezeichnung ersetzt.
- source_word: Yoel
  choice: Joël
  rationale: Die im Deutschen geläufige Schreibung wahrt den Eigennamen; der Trema verhindert die Lesung als ein einziger Vokal.
- source_word: speech
  choice: Rede
  rationale: „Rede“ lässt sowohl sprachliche Äußerung als auch eine möglicherweise kosmisch wirksame Rede zu, ohne ausdrücklich „Wort“ und damit weitergehende Logos-Assoziationen einzutragen.
theological_decisions:
- issue: Hypostatische oder abstrakte Bedeutung von Stille, Kraft, Herrlichkeiten und Unvergänglichkeiten
  choice: Die ungewöhnlichen Abstrakta und ihre Wiederholungen werden formal bewahrt.
  alternative: Die Größen durchgehend als personale Himmelswesen ausweisen.
  rationale: Das vorliegende Zeugnis erlaubt keine sichere Festlegung; die Übersetzung erhält die genuine Schwebe zwischen Eigenschaft, Bereich und personaler Größe.
- issue: Beziehung der Aufzählung nach „Lobpreis darbringen“
  choice: Die koordinierte Folge „dem … Geist und seiner … Jungfrau … und der Stille … und der Größe“ bleibt syntaktisch offen.
  alternative: Alle Glieder ausdrücklich als getrennte Empfänger des Lobpreises kennzeichnen oder als Zugehörigkeiten des Geistes deuten.
  rationale: Der fragmentarische Text und die englische Zeugnisübersetzung sichern die genaue Struktur nicht ausreichend.
- issue: Titel „Christus“ und Salbung durch den unsichtbaren Geist
  choice: Titel und Aussage werden ohne trinitarische oder christologische Harmonisierung wiedergegeben.
  alternative: Die Figur ausdrücklich mit Jesus Christus identifizieren oder ontologisch näher bestimmen.
  rationale: Der kosmologische Kontext dieses Werkes darf nicht durch spätere konfessionelle Kategorien vereindeutigt werden.
translation_notes:
  register: Würdevolles, modernes Standarddeutsch mit bewusster Beibehaltung der fremdartigen kosmologischen Terminologie. Eckige Klammern kennzeichnen Ergänzungen beziehungsweise beschädigte oder erschlossene Textteile; Auslassungspunkte in Klammern markieren Lücken. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Zeugen.
