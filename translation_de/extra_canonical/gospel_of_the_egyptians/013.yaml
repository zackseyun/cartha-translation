review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung bewahrt die Vokalfolgen, Namensformen, orthographisch unterschiedlichen Formen ALĒTHES/ALĒTHŌS, die Anrufungsstruktur und die beiden Lückenhinweise sorgfältig. Einige Formulierungen entfernen sich jedoch unnötig vom bereitgestellten englischen Zeugen: insbesondere »aus dir selbst hervorgegangen«, die Zweckbedeutung in »um ... willen«, »Urbild« für »mold« und die Umformung von »I have been shaped« zu »bin ... Gestalt geworden«. Da eine unmittelbare koptische Prüfung noch aussteht, bleiben die Korrekturen eng am vorliegenden Zeugen.'
  naturalness: Der liturgisch-poetische Ton ist gelungen und die deutsche Syntax ist überwiegend natürlich. Die überarbeiteten Stellen sind zugleich idiomatischer und genauer. Die bewusst fremdartige Sprache an den Stellen mit Vokalformeln und kosmologischen Titeln wird beibehalten.
  terminology: »Äonen« und »Archonten« sind angemessene, nicht harmonisierende Fachbegriffe. »selbstgezeugter Vollkommener« gibt self-generated ohne die unzutreffende Anredebeziehung von »aus dir selbst« wieder. »Form« ist für mold neutraler als das stärker platonisierende »Urbild«.
  issues:
  - severity: medium
    issue: »o aus dir selbst hervorgegangener Vollkommener«
    rationale: Das »dir« ist im Zeugen nicht vorhanden und macht den Angeredeten fälschlich zum Ursprung aus dem angesprochenen Gegenüber. Gemeint ist Selbstursprünglichkeit.
  - severity: medium
    issue: »denn die Mutter war an dem Ort um der erhabenen Schönheit der Gnade willen«
    rationale: Die Wendung »um ... willen« fügt eine Zweckrelation hinzu. Der Zeuge sagt lediglich, dass die Mutter im/an dem Ort für die vortreffliche Schönheit der Gnade war.
  - severity: medium
    issue: »Im Kreis des Reichtums des Lichts bin ich Gestalt geworden«
    rationale: »I have been shaped« ist passiv und sollte als »bin ... geformt worden« wiedergegeben werden; die vorliegende Fassung verschiebt die Aussage zu einem Zustandswechsel.
  - severity: low
    issue: »Urbild aller Archonten«
    rationale: »Urbild« legt eine archetypische, platonisierende Lesart nahe, während »mold« zunächst nur eine Form bzw. Gussform bezeichnet.
  - severity: low
    issue: »das ewig und immer ist«
    rationale: Die doppelte Ewigkeit des Zeugen wird besser durch die ebenfalls bewusst emphatische Wiederholung »ewiglich ewig« gewahrt.
