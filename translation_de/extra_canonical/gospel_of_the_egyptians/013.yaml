lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: Die überlieferten griechischen Laut- bzw. Wortformen und ihre Abweichung werden unverändert bewahrt, statt sie vereinheitlichend mit »wahrhaftig« zu übersetzen.
- source_word: aeons
  choice: Äonen
  rationale: Der in diesem Text kosmologisch geprägte Fachbegriff bleibt als verständliches deutsches Fremdwort erhalten.
- source_word: self-generated
  choice: aus dir selbst hervorgegangen
  rationale: Diese natürliche Formulierung wahrt die Vorstellung eines Ursprungs aus sich selbst, ohne eine bestimmte metaphysische Lehre stärker festzulegen.
- source_word: archons
  choice: Archonten
  rationale: Der traditionsgeschichtliche Fachbegriff wird beibehalten, da »Herrscher« die besondere kosmologische Bedeutung verwischen könnte.
- source_word: mold
  choice: Urbild
  rationale: »Urbild« gibt die Idee einer formgebenden Vorlage wieder; die genaue Bildlichkeit bleibt wegen der nur mittelbar zugänglichen Vorlage unsicher.
- source_word: Place
  choice: Ort
  rationale: Die Großschreibung des englischen Zeugen wird nicht als sichere deutsche Eigenbezeichnung behandelt; der mögliche technische Sinn bleibt aus dem Kontext erkennbar.
theological_decisions:
- issue: Identifikation mit dem Unwandelbaren
  choice: »mit dem Unwandelbaren eins geworden«
  alternative: »mit dem Unwandelbaren verschmolzen«
  rationale: Die gewählte Form wahrt die starke mystische Vereinigungsaussage, ohne zwingend eine stoffliche Verschmelzung zu behaupten.
- issue: Der »Mensch« als möglicherweise technische Gestalt
  choice: »den Menschen«
  alternative: »den Menschen [als himmlische Gestalt]«
  rationale: Die mögliche kosmologische Fachbedeutung wird nicht durch eine erklärende Deutung in den Haupttext eingetragen.
- issue: Lichtwerdung des Sprechers
  choice: »Ich bin Licht geworden«
  alternative: »Ich wurde erleuchtet«
  rationale: Die stärkere ontologische Aussage des Zeugen wird bewahrt und nicht zu einer bloßen Erfahrung des Erleuchtetwerdens abgeschwächt.
translation_notes:
  register: Poetisch-liturgischer, würdevoller Gegenwartsstil. Namen, Vokalfolgen, diakritische Zeichen, geschweifte Klammern sowie die wechselnden Formen ALĒTHES und ALĒTHŌS sind bewahrt. Die Fassung ist vorläufig, weil eine direkte Prüfung des koptischen Textes noch aussteht; sie stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen. Die störende Seitenzahl [15] wurde nicht als Fußnote übernommen.
