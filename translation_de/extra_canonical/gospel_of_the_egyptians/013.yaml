translation:
  language: de
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    o Yesseus Mazareus Yessedekeus,


    o lebendiges Wasser,


    o Kind des Kindes,


    o ruhmreicher Name,


    ALĒTHŌS ALĒTHŌS,


    das ewige Sein,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    o Sein, das die Äonen schaut,


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    das ewig und immer ist,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ im Herzen, das da ist:


    UAEI EISAEI EIOEI EIOSEI!


    Dieser dein großer Name wohnt in mir,


    o aus dir selbst hervorgegangener Vollkommener.


    Du, der du nicht außerhalb von mir bist —


    ich schaue dich,


    o du, den niemand sieht;


    denn wer kann dich in einer anderen Sprache erfassen?


    [a] Weil ich dich erkannt habe,


    bin ich nun mit dem Unwandelbaren eins geworden.


    Ich habe die Rüstung des Lichts angelegt.


    Ich bin Licht geworden,


    denn die Mutter war an dem Ort um der erhabenen Schönheit der Gnade willen.


    Darum habe ich meine gefalteten Hände ausgestreckt.


    Im Kreis des Reichtums des Lichts bin ich Gestalt geworden,


    in meinem Schoß,


    der die Gestalt der vielen aus Licht Gezeugten hervorbringt,


    wohin keine Anklage reicht.


    ALĒTHŌS,


    ich werde deine Herrlichkeit verkünden,


    denn ich habe dich erfasst,


    SOU IĒS IDE AEIŌ AEIE OIS,


    o Äon, Äon, o Gott des Schweigens!


    Ich ehre dich ganz und gar.


    Du bist mein Ruheort, o Sohn,


    ĒS ĒS O E,


    Gestaltloser unter Gestaltlosen,


    der du den Menschen aufrichtest, in dem du mich reinigen wirst,


    damit ich in dein Leben eintrete,


    gemäß deinem unvergänglichen Namen.


    Darum wohnt der Weihrauch des Lebens in mir.


    Ich habe ihn mit Wasser vermischt nach dem Urbild aller Archonten,


    damit ich mit dir im Wohlergehen der Heiligen lebe,


    du, der du ewig bist. [b]


    ALĒTHŌS ALĒTHŌS.'
