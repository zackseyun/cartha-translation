  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Eckige Klammern und Auslassungszeichen folgen dem überlieferten englischen Zeugen und markieren Ergänzungen beziehungsweise Textverlust. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist diese Fassung als vorläufiger, quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses zu behandeln. Die störende Seitenzahl des Manuskripts wurde nicht in den Haupttext übernommen.
