translation:
  language: de
  text: 'Fünftausend Jahre später sprach das große Licht Eleleth: »Es soll einen Herrscher über das Chaos und den Hades geben.« Da erschien eine Wolke, [] [namens] die stoffliche Sophia[a] […]


    [Sie] blickte über die Bereiche [des Chaos]. Ihr Gesicht glich […] in ihrer Gestalt […] Blut. Und [der große] Engel Gamaliel sprach [zu dem großen Gabriel], dem Diener [des großen Lichts] Oroiael. Er [sagte: »Ein] Engel soll hervorkommen, [um] über das Chaos [und den Hades] zu herrschen.«


    Da [fügte sich] die Wolke [und brachte] zwei Monaden[b] hervor, von denen jede [Licht besaß]. […] [den Thron] hatte sie in der Wolke [darüber] errichtet.


    Da [sah] Sakla, der große [Engel], den großen Dämon [an seiner Seite, Nebr]uel. Gemeinsam wurden sie zu einem zeugenden Geist der Erde. [Sie zeugten] dienende Engel.


    Sakla [sprach] zu dem großen [Dämon] Nebruel: »Die zwölf Äonen[c] sollen in [dem …] Äon entstehen, Welten […].«


    […] Der große Engel [Sakla] sprach nach dem Willen des Selbsterzeugten: [] »Es soll […] die […] Zahl Sieben […] geben.« Und er sprach zu den [großen Engeln]: »Geht, und [jeder] von euch soll über seine [eigene Welt] herrschen.«


    Jeder [dieser] zwölf [Engel] kam [hervor]:


    [Der erste] Engel ist Ath[oth]. [Er ist derjenige], den [die großen] Generationen der Menschen […] nennen.


    [Der] zweite ist Harmas, [der] das [Feuerauge] ist.


    Der dritte [ist Galila].


    [Der] vierte ist Yobel.


    [Der fünfte ist] Adonaios, der [Sabaoth genannt] wird.


    Der sechste [ist Kain, den] die [großen Generationen der] Menschen die Sonne nennen.


    Der [siebte ist Abel].


    Der achte ist Akiressina.


    Der [neunte ist Yubel].


    Der zehnte ist Harm[oupiael].


    [Der] elfte ist Arch[ir-Adonin].


    Der zwölfte [ist Belias].


    [Diese sind es], die über den Hades [und das Chaos] gesetzt sind. Nach der Grundlegung [der Welt] sprach Sakla zu seinen [Engeln]: »Ich, ja ich, bin ein [eifersüchtiger] Gott, und außer mir ist nichts [entstanden«; denn er] [] vertraute auf seine eigene Substanz.[d]


    Da kam eine Stimme aus der Höhe und sprach: »Der Mensch existiert und der Sohn des Menschen.«[e]


    Die erste Form[f] wurde aufgrund des Herabkommens des Bildes von oben gebildet, das seine Stimme in der Höhe widerhallen lässt – des Bildes, das hervorgeblickt hat, durch das Hervorblicken des Bildes von oben. Aufgrund dessen entstand die Umkehr.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise fachsprachlich: »die hyliche Sophia«; »hylich« bedeutet »stofflich, materiell«.'
    reason: Erläutert einen kosmologischen Fachbegriff, ohne ihn im Haupttext unverständlich stehen zu lassen.
  - marker: b
    text: »Monaden« bezeichnet hier einzelne ursprüngliche Einheiten oder Wesen; die genaue kosmologische Bedeutung bleibt unsicher.
    reason: Der technische Begriff ist für heutige Leser erklärungsbedürftig.
  - marker: c
    text: »Äon« kann ein Weltzeitalter, einen überweltlichen Bereich oder eine personifizierte Wesenheit bezeichnen.
    reason: Bewahrt und erläutert die echte Bedeutungsbreite des Begriffs.
  - marker: d
    text: Die eckigen Klammern und Auslassungspunkte kennzeichnen beschädigten Text und ergänzte Lesungen. Der Satz ist nur bruchstückhaft erhalten.
    reason: Macht die textkritische Unsicherheit dieser besonders schwierigen Passage transparent.
  - marker: e
    text: 'Auch möglich: »Der Mensch ist, und der Sohn des Menschen.« Die Formulierung kann als Existenzbehauptung oder als Titel verstanden werden.'
    reason: Dokumentiert die semantische und theologische Offenheit.
  - marker: f
    text: Das zugrunde liegende Wort kann eine Form, Gestalt oder ein geprägtes Modell meinen.
    reason: Die Bildsprache der Schöpfung soll nicht auf eine einzige konkrete Vorstellung festgelegt werden.
  - marker: g
    text: »Umkehr« kann hier möglicherweise als personifizierte Größe gemeint sein.
    reason: Weist auf die kosmologische Verwendung eines sonst psychologisch verstandenen Wortes hin.
lexical_decisions:
- source_word: hylic Sophia
  choice: stoffliche Sophia
  rationale: Gibt den philosophischen Sinn von griechisch hylikos („materiell, stofflich“) wieder, ohne den Fachausdruck unkommentiert zu lassen.
- source_word: monads
  choice: Monaden
  rationale: Der technische kosmologische Begriff bleibt erhalten; eine Umschreibung als „Einheiten“ würde mögliche metaphysische Bedeutung verengen.
- source_word: aeons
  choice: Äonen
  rationale: Bewahrt den mehrdeutigen Fachbegriff, der sowohl überweltliche Wesenheiten beziehungsweise Bereiche als auch Weltzeitalter bezeichnen kann.
- source_word: self-generated one
  choice: Selbsterzeugter
  rationale: Bildet die vorliegende Benennung formal nach und vermeidet eine dogmatisch festgelegte Deutung.
- source_word: mold
  choice: Form
  rationale: „Form“ ist im Deutschen natürlich und lässt offen, ob eine Gussform, Gestalt oder ein Urmodell gemeint ist.
- source_word: repentance
  choice: Umkehr
  rationale: „Umkehr“ ist verständlich und kann sowohl eine innere Sinnesänderung als auch eine personifizierte kosmologische Größe bezeichnen.
theological_decisions:
- issue: Saklas Selbstaussage als eifersüchtiger Gott
  choice: Die Aussage und ihre kritische narrative Einordnung werden unverändert spannungsvoll wiedergegeben.
  alternative: Die Aussage mit dem Gott der biblischen Tradition identifizieren oder ausdrücklich von ihm abgrenzen.
  rationale: Der Text stellt Saklas Anspruch dar und begründet ihn mit seinem Vertrauen auf die eigene Substanz; die Übersetzung darf diese polemische Kosmologie weder harmonisieren noch konfessionell ausdeuten.
- issue: „Der Mensch“ und „der Sohn des Menschen“
  choice: Beide Titel werden wörtlich mit bestimmtem Artikel wiedergegeben.
  alternative: „der himmlische Mensch“ beziehungsweise „der Menschensohn“.
  rationale: Die wörtliche Fassung bewahrt die mögliche kosmologische und titulare Mehrdeutigkeit; „Menschensohn“ könnte vorschnell eine bestimmte christologische Identifikation festlegen.
- issue: Personifikation der Umkehr
  choice: „Umkehr“ bleibt grammatisch als etwas Entstandenes formuliert.
  alternative: „Reue“ als bloßer psychologischer Zustand.
  rationale: Der kosmologische Zusammenhang kann eine personifizierte Größe meinen; die Übersetzung hält diese Möglichkeit offen.
