lexical_decisions:
- source_word: Silence
  choice: Schweigen
  rationale: Bewahrt den personifiziert-abstrakten Charakter und klingt im Deutschen natürlicher und würdiger als „Stille“, ohne das Motiv auf bloße Geräuschlosigkeit zu verengen.
- source_word: aeon
  choice: Äon
  rationale: Der traditionsgeschichtlich geprägte Fachbegriff bleibt erhalten; eine Auflösung als „Zeitalter“ würde die kosmologische Bedeutung möglicherweise verengen.
- source_word: Ogdoad
  choice: Ogdoade
  rationale: Der etablierte deutsche Fachausdruck bezeichnet eine Achtheit beziehungsweise eine Gruppe von acht Wesen oder Prinzipien.
- source_word: Logos
  choice: Logos
  rationale: Die griechisch geprägte Bezeichnung bleibt wegen ihrer semantischen Weite erhalten; eine Fußnote nennt mögliche deutsche Wiedergaben.
- source_word: Mind
  choice: Geist
  rationale: Gibt das intellektive Prinzip in natürlichem Deutsch wieder, ohne es lediglich als psychologische Tätigkeit „Denken“ zu fassen.
- source_word: Precognition
  choice: Vorherwissen
  rationale: Bewahrt die Bedeutung eines vorgängigen Wissens; „Vorhersehung“ könnte mit der unmittelbar genannten Vorsehung vermischt werden.
- source_word: androgynous
  choice: mann-weiblich
  rationale: Eine transparente deutsche Wiedergabe erhält die ausdrücklich doppelte Geschlechtsbestimmung; sie vermeidet eine moderne Identitätskategorie.
- source_word: Providence
  choice: Vorsehung
  rationale: Entspricht dem kosmologisch-theologischen Abstraktum und wahrt dessen mögliche Personifizierung.
- source_word: speech
  choice: Rede
  rationale: Unterscheidet das vollendete sprachliche Hervortreten von den zuvor genannten einzelnen „Stimmen“.
theological_decisions:
- issue: Verhältnis von Vater, Mutter und Sohn zum lebendigen Schweigen
  choice: 'Die syntaktische Folge wird beibehalten: Die drei Mächte gehen aus dem lebendigen Schweigen hervor, dieses aus dem unvergänglichen Vater.'
  alternative: Den unvergänglichen Vater unmittelbar als Ursprung der drei Mächte darstellen.
  rationale: Die vermittelte Emanationsfolge ist im Zeugen ausdrücklich angelegt und darf nicht harmonisiert werden.
- issue: Reihenfolge als vierter, fünfte und sechster
  choice: Die ungewöhnliche Zählung wird unverändert wiedergegeben.
  alternative: Die Zählung nach den zuvor genannten drei Mächten erklären oder berichtigen.
  rationale: Der fragmentarische Text lässt den Bezug der Ordnungszahlen offen; eine Erklärung wäre spekulativ.
- issue: „unsignified“
  choice: „durch kein Zeichen bezeichnet“
  alternative: „unbedeutend“ oder „nicht offenbart“
  rationale: Die Formulierung wahrt den Bezug auf Bezeichnung beziehungsweise Zeichen und vermeidet die theologisch irreführende Aussage, die Gestalt sei bedeutungslos.
- issue: Geschlechtliche Bezeichnung des ersten Vaters
  choice: „mann-weiblicher Vater“
  alternative: „androgyner Vater“
  rationale: Die paradoxe Doppelbestimmung wird nicht geglättet; zugleich bleibt der Wortlaut für gewöhnliche Leser erschließbar.
- issue: Fragmentarische Zuschreibung der Tugend/Kraft
  choice: „die Kraft [der] […] [Mutter]“
  alternative: Die Lücke zu „die Kraft der Mutter“ schließen.
  rationale: Die beschädigte Überlieferung wird sichtbar gehalten und nicht stillschweigend rekonstruiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener kosmologischer Fachsprache. Eckige Klammern und Auslassungspunkte kennzeichnen Ergänzungen beziehungsweise Schäden des Textzeugen; störende Handschriftenseitenangaben wurden nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, bleibt der Entwurf ausdrücklich an den bereitgestellten gemeinfreien englischen Zeugen gebunden.
