translation:
  language: de
  text: 'Drei Mächte gingen aus ihm hervor: der Vater, die Mutter und der Sohn. Sie gingen aus dem lebendigen Schweigen hervor, das aus dem unvergänglichen Vater hervorgegangen war. Diese gingen [aus] dem Schweigen des unbekannten Vaters hervor. [Und] von dort ging Domedon Doxomedon hervor, [der Äon der] Äonen und das [Licht] ihrer jeweiligen Mächte. Auf diese Weise ging der Sohn als vierter hervor, die Mutter [als fünfte und der Vater] als sechster.


    Er blieb [unbemerkt] und war noch nicht verkündet. [Er ist derjenige], der inmitten aller [Mächte], Herrlichkeiten und [Unvergänglichkeiten] durch kein Zeichen bezeichnet ist.


    Von dort gingen die drei Mächte hervor, […] die drei Ogdoaden, [die der Vater] im Schweigen zusammen mit der Vorsehung aus seinem Schoß [hervorbringt]: der Vater, die Mutter und der Sohn.


    Die <erste> Ogdoade, um derentwillen das dreifach-männliche Kind hervorging, besteht aus:


    Gedanke,


    Logos[a],


    Unvergänglichkeit,


    Ewigem [Leben],


    Wille,


    Geist,


    Vorherwissen,


    dem mann-weiblichen Vater.


    Die zweite Ogdoaden-Macht:


    die Mutter,


    die Jungfrau Barbelon,


    Epititioch[…]ai,


    Memeneaimen, [die] über den Himmel wacht,


    Karb[…],


    die Macht, die sich jeder Deutung entzieht,


    die unaussprechliche Mutter.


    [Sie ist] aus sich selbst [entstanden …]. Sie ging hervor. [Sie] stimmte mit dem Vater [des] schweigenden [Schweigens] überein.


    Die dritte Ogdoaden-[Macht]:


    der Sohn des [schweigenden Schweigens],


    und die Krone des schweigenden Schweigens,


    [und] die Herrlichkeit des Vaters,


    und die Kraft [der] […] [Mutter].


    [Er] bringt aus dem Schoß die sieben Mächte des großen Lichtes hervor; sie sind die sieben Stimmen, und ihre Vollendung ist die Rede.


    Dies sind die drei [Mächte], die drei Ogdoaden, die der Vater durch seine Vorsehung aus seinem Schoß [hervorbrachte]. Er brachte sie an jenem Ort hervor.


    [a] Oder: „Wort“ bzw. „Vernunft“.'
