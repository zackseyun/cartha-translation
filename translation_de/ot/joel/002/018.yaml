  text: וַ/יְקַנֵּ֥א יְהוָ֖ה לְ/אַרְצ֑/וֹ וַ/יַּחְמֹ֖ל עַל עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: de
  text: Da entbrannte Jahwe in leidenschaftlichem Eifer für sein Land[a] und hatte Erbarmen mit seinem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da wurde Jahwe eifersüchtig um sein Land.“ Das hebräische Verb kann sowohl Eifersucht als auch leidenschaftlichen Eifer ausdrücken; hier bezeichnet es Jahwes glühende, seinem Bund entsprechende Sorge um das, was ihm gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: Da entbrannte … in leidenschaftlichem Eifer
  rationale: קנא kann Eifersucht oder Eifer bezeichnen. Die Form führt die Erzählung als vergangenes Geschehen fort; die gewählte Wendung bewahrt die starke emotionale und schützende Anteilnahme, ohne im Deutschen den leicht missverständlichen Eindruck kleinlicher Eifersucht zu erwecken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְאַרְצוֹ
  choice: für sein Land
  rationale: אֶרֶץ bezeichnet hier im Kontext das Bundesland; לְ markiert das Ziel von Jahwes leidenschaftlichem Eifer.
- source_word: וַיַּחְמֹל
  choice: hatte Erbarmen
  rationale: חמל umfasst Mitleid, Erbarmen und das daraus folgende Verschonen. „Erbarmen haben“ passt zum restaurativen Kontext und bewahrt die emotionale Bedeutung.
- source_word: עַל עַמּוֹ
  choice: mit seinem Volk
  rationale: Im Deutschen verbindet sich „Erbarmen haben“ idiomatisch mit „mit“. עַם bezeichnet hier Jahwes Volk als Bundesgemeinschaft.
theological_decisions:
- issue: Wiedergabe von Gottes Eifersucht beziehungsweise Eifer
  choice: entbrannte … in leidenschaftlichem Eifer für sein Land
  alternative: wurde eifersüchtig um sein Land
  rationale: Das hebräische קנא trägt beide Bedeutungsnuancen. Der Haupttext formuliert im Deutschen natürlich und bringt Jahwes glühende, schützende Bundesverbundenheit zum Ausdruck; die Fußnote erhält die stärkere Nuance der Eifersucht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ gibt die narrative Folge knapp wieder. „Jahwe“ bewahrt den persönlichen Gottesnamen; „leidenschaftlicher Eifer“ und die Fußnote erhalten die echte Bedeutungsbreite von קנא.
