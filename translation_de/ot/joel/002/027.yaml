source:
  edition: WLC
  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich mitten in Israel bin, dass ich, Jahwe, euer Gott bin, und dass es keinen anderen gibt. Mein Volk wird nie wieder beschämt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Volk wird für immer nicht beschämt werden.«'
    reason: Die Anmerkung bewahrt die nähere Wiedergabe von לְעוֹלָם („für immer“), während »nie wieder« den dauerhaften Charakter der Verheißung im Wiederherstellungskontext idiomatisch ausdrückt.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ bezeichnet im prophetischen Zusammenhang die künftige Folge der zuvor verheißenen Wiederherstellung. »Dann« gibt diesen Folgesinn natürlich wieder.
- source_word: בְקֶרֶב יִשְׂרָאֵל
  choice: mitten in Israel
  rationale: בְּקֶרֶב bezeichnet die Gegenwart im Inneren beziehungsweise in der Mitte einer Gemeinschaft. »Mitten in« bewahrt diese räumlich-bildhafte und bundesbezogene Aussage.
- source_word: וַאֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: und dass ich Jahwe bin, euer Gott
  rationale: Die Wiederholung des Personalpronomens hebt den Sprecher hervor. Die deutsche Satzform führt die zweite Aussage natürlich als weiteren Gegenstand des Erkennens fort; »Jahwe« gibt den Gottesnamen wieder.
- source_word: וְאֵין עוֹד
  choice: und sonst keiner
  rationale: Die knappe hebräische Wendung behauptet Jahwes Einzigkeit. »Sonst keiner« ist gegenwärtiges, idiomatisches Deutsch und lässt das im Hebräischen unausgesprochene Bezugswort ebenfalls unausgesprochen.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: Und mein Volk wird nie wieder beschämt werden
  rationale: יֵבֹשׁוּ kann innere Scham oder öffentliches Zuschandenwerden bezeichnen; im Wiederherstellungszusammenhang bringt »beschämt werden« die Beseitigung öffentlicher Schande zum Ausdruck. »Nie wieder« gibt die dauerhafte Verneinung mit לְעוֹלָם idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. »Jahwe« ist dessen im Deutschen geläufige wissenschaftliche Wiedergabe und ersetzt ihn nicht durch einen Titel.
- issue: Aussage von וְאֵין עוֹד
  choice: und sonst keiner
  alternative: und es gibt keinen anderen
  rationale: Die Formulierung bewahrt die uneingeschränkte Einzigkeitsaussage, ohne ein im Hebräischen nicht ausdrücklich genanntes Substantiv wie »Gott« einzufügen.
- issue: Dauer und Sinn der Schamformel
  choice: mein Volk wird nie wieder beschämt werden
  alternative: mein Volk wird in Ewigkeit nicht beschämt werden
  rationale: Die Hauptfassung versteht לְעוֹלָם als dauerhafte Verneinung einer künftig beseitigten Schande. Die wörtlichere Struktur wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. »Mitten in Israel« erhält das Gegenwartsbild; »sonst keiner« bewahrt die knappe Exklusivitätsaussage. Der Fußnotenmarker steht bei der tatsächlich erläuterten Schamformel.
