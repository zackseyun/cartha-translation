  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: de
  text: Ich werde euch die Jahre erstatten, die die Schwarmheuschrecke, der Fresser, der Vertilger und der Nager[a] gefressen haben – mein großes Heer, das ich unter euch[b] gesandt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vier hebräischen Ausdrücke bezeichnen wahrscheinlich Arten oder Entwicklungsstadien von Heuschrecken. Ihre genaue zoologische Unterscheidung ist unsicher; möglich sind auch Wiedergaben wie „kriechende Heuschrecke“, „Verzehrer“ und „Abnager“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegen euch“. Die hebräische Präposition lässt hier sowohl „unter euch“ als auch eine gegen die Angesprochenen gerichtete Bedeutung zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Ich werde … erstatten
  rationale: Das Piel von שלם bezeichnet hier ein Vergelten, Ersetzen oder Wieder-gutmachen. „Erstatten“ gibt die zugesagte Wiedergutmachung natürlich wieder und bewahrt zugleich das eindrückliche Bild, dass verlorene Jahre ersetzt werden.
- source_word: לָכֶם
  choice: euch
  rationale: ל kennzeichnet die Empfänger der zugesagten Erstattung; im Deutschen steht bei „erstatten“ idiomatisch der Dativ.
- source_word: הַשָּׁנִים
  choice: die Jahre
  rationale: Der hebräische Text nennt wörtlich „die Jahre“. Diese metonymische Rede von den durch die Plage verlorenen Erntejahren bleibt erhalten, statt erklärend erweitert zu werden.
- source_word: אֲשֶׁר אָכַל
  choice: die … gefressen haben
  rationale: „Fressen“ ist für Heuschrecken natürlich und bildet אָכַל direkt ab. Wegen der im Deutschen als gemeinsames Subjekt verstandenen vier Bezeichnungen steht das Verb im Plural.
- source_word: הָאַרְבֶּה
  choice: die Schwarmheuschrecke
  rationale: אַרבה ist die gewöhnliche Bezeichnung für die Heuschrecke, häufig im Zusammenhang mit Schwärmen. „Schwarmheuschrecke“ unterscheidet den Ausdruck von den folgenden Benennungen, ohne eine konkrete Art festzulegen.
- source_word: הַיֶּלֶק
  choice: der Abfresser
  rationale: Die genaue zoologische Bedeutung ist unsicher; das Wort bezeichnet wohl eine fressende Heuschreckenart oder ein Entwicklungsstadium. „Abfresser“ wahrt den verheerenden Sinn und die Unterscheidung innerhalb der Viererreihe.
- source_word: וְהֶחָסִיל
  choice: der Vertilger
  rationale: חסיל bezeichnet wahrscheinlich eine verzehrende oder vernichtende Heuschreckenform. „Vertilger“ gibt diese Wirkung knapp wieder, ohne taxonomische Genauigkeit vorzutäuschen.
- source_word: וְהַגָּזָם
  choice: der Nager
  rationale: גזם wird mit Schneiden oder Abnagen verbunden. „Nager“ ist eine knappe traditionelle Wirkungsbezeichnung; die Fußnote macht deutlich, dass keine sichere zoologische Zuordnung beabsichtigt ist.
- source_word: חֵילִי הַגָּדוֹל
  choice: mein großes Heer
  rationale: חיל kann „Heer“, „Streitmacht“ oder „Kraft“ bedeuten. Hier stellt die Wendung die Heuschreckenplage in militärischer Bildsprache als Gottes große Streitmacht dar.
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: das ich unter euch gesandt habe
  rationale: Das Verb wird entsprechend dem ausdrücklichen göttlichen Handeln direkt mit „ich … gesandt habe“ wiedergegeben. בָּכֶם kann die Gegenwart innerhalb der Gemeinschaft oder eine gegen sie gerichtete Bewegung ausdrücken; „unter euch“ hält die erste Lesart im Haupttext fest.
theological_decisions:
- issue: Sind die vier Bezeichnungen wörtliche Heuschrecken oder ein rein symbolisches menschliches Heer?
  choice: Eine wirkliche Heuschreckenplage, die mit militärischer Bildsprache beschrieben wird
  alternative: Ein ausschließlich metaphorisch bezeichnetes menschliches Heer
  rationale: Die vier hebräischen Bezeichnungen gehören zum Wortfeld der Heuschrecken; die nachgestellte Wendung „mein großes Heer“ deutet sie zugleich militärisch. Die Übersetzung erhält beide Ebenen, ohne die eine in der anderen aufzulösen.
- issue: Gottes Wirken bei der Katastrophe
  choice: Gott erklärt ausdrücklich, dass er das Heer gesandt hat
  alternative: Gott habe die Plage lediglich zugelassen
  rationale: Der hebräische Text verwendet die aktive erste Person „ich sandte“. Diese Aussage wird weder abgeschwächt noch über das Gesagte hinaus systematisiert.
- issue: Sinn der zugesagten Erstattung
  choice: Wiedergutmachung der verlorenen Jahre beziehungsweise ihrer Erträge
  alternative: Eine wörtliche Rückkehr vergangener Zeit oder lediglich eine finanzielle Entschädigung
  rationale: „Die Jahre erstatten“ bewahrt die kühne metonymische Ausdrucksweise des Hebräischen. Der landwirtschaftliche Zusammenhang zeigt Wiedergutmachung an, ohne dass der Vers ihren genauen Modus festlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bewahrt das hebräische Bild von den „gefressenen Jahren“ und die appositionelle militärische Deutung. Die vier seltenen Insektenbezeichnungen bleiben unterscheidbar; eine Fußnote verhindert dabei den Eindruck falscher zoologischer Präzision.
