lexical_decisions:
- source_word: מִפָּנָיו
  choice: Vor ihm
  rationale: Die Wendung aus מִן und פָּנִים bezeichnet hier die unmittelbare Gegenwart oder Konfrontation. »Vor ihm« ist knapp und natürlich und bewahrt den männlichen Singularbezug, ohne dessen Referenten näher festzulegen.
- source_word: יָחִילוּ
  choice: winden sich
  rationale: Das Verb חול beschreibt heftige körperliche Erschütterung, Sichwinden oder geburtswehenartige Qual. »Winden sich« erhält die drastische Körperlichkeit des Bildes.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet menschliche Kollektive. »Völker« ist im Deutschen idiomatisch und legt den Ausdruck nicht unnötig auf moderne Nationalstaaten fest.
- source_word: כָּל־פָּנִים
  choice: alle Gesichter
  rationale: Die kollektive hebräische Formulierung wird direkt und verständlich wiedergegeben.
- source_word: קִבְּצוּ פָארוּר
  choice: erbleichen
  rationale: Die wörtlich schwer verständliche Verbindung mit קבץ und dem seltenen פָארוּר wird gewöhnlich als idiomatische Beschreibung davon verstanden, dass Gesichter ihre Farbe verlieren. »Erbleichen« gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezug des Suffixes der 3. Person Singular in מִפָּנָיו
  choice: Das Pronomen bleibt als »ihm« unbestimmt.
  alternative: Den Bezug ausdrücklich als den HERRN, den Tag oder das heranziehende Heer benennen.
  rationale: Der unmittelbare Zusammenhang lässt mehr als einen rhetorisch eng miteinander verbundenen Bezug zu. Die Übersetzung bewahrt diese Spannung und fügt keine ausdrückliche Identifizierung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze, rhythmische Satzstruktur folgt dem hebräischen Parallelismus; das seltene Idiom der zweiten Hälfte wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
