  text: Vor ihm winden sich die Völker[a]; alle Gesichter erbleichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »In seiner Gegenwart geraten die Völker in Qual.«'
