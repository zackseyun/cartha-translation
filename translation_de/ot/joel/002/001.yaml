id: JOL.2.1
reference: Joel 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: de
  text: Blast das Horn auf Zion und schlagt Alarm auf meinem heiligen Berg! Alle Bewohner des Landes[a] sollen erbeben, denn der Tag Jahwes kommt; ja, er ist nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Erde“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: Blast das Horn
  rationale: Die Verbindung bezeichnet das Blasen eines Schofarhorns. „Das Horn blasen“ ist im Deutschen natürlich und vermeidet die irreführende Vorstellung einer modernen Metalltrompete.
- source_word: בְּצִיּוֹן
  choice: auf Zion
  rationale: Zion ist hier parallel zu Jahwes heiligem Berg als heiliger Ort gedacht; „auf Zion“ gibt diesen räumlichen Bezug idiomatisch wieder.
- source_word: וְהָרִיעוּ
  choice: schlagt Alarm
  rationale: Der Hifil-Imperativ bezeichnet hier ein lautes Warnsignal. Im Zusammenhang mit dem Horn und dem nahenden Tag Jahwes trifft „Alarm schlagen“ den dringlichen Sinn besser als ein allgemeines „jubelt“ oder das militärisch engere „erhebt den Schlachtruf“.
- source_word: בְּהַר קָדְשִׁי
  choice: auf meinem heiligen Berg
  rationale: Die Präposition wird bei einem Berg im Deutschen natürlich mit „auf“ wiedergegeben; das Suffix der ersten Person bleibt in „meinem“ erhalten.
- source_word: יִרְגְּזוּ
  choice: sollen erbeben
  rationale: Die volitive Form nach den Imperativen fordert eine von Furcht geprägte Reaktion. „Erbeben“ bewahrt sowohl die körperliche als auch die innere Erschütterung.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: alle Bewohner des Landes
  rationale: Im unmittelbaren Zusammenhang mit Zion und dem heiligen Berg liegt das Land Juda als Hauptbezug nahe. Da אֶרֶץ auch „Erde“ bedeuten kann, wird die weitere Deutung in einer Fußnote bewahrt.
- source_word: כִּי בָא יוֹם יְהוָה
  choice: denn der Tag Jahwes kommt
  rationale: בָא stellt das bevorstehende Eintreffen anschaulich als kommend dar. Der Gottesname wird in der im modernen Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: כִּי קָרוֹב
  choice: ja, er ist nahe
  rationale: Das zweite כִּי kann begründend oder bekräftigend verstanden werden. „Ja“ wahrt hier die bekräftigende Kraft, ohne die vorherige kausale Verknüpfung schwerfällig zu wiederholen.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der örtliche Bezug auf Zion spricht zunächst für Juda beziehungsweise das Land; die umfassendere, möglicherweise endzeitliche Bedeutung „Erde“ bleibt sprachlich möglich und wird deshalb nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn im deutschen Haupttext als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Funktion des zweiten כִּי
  choice: 'bekräftigend: „ja“'
  alternative: 'begründend: „denn/weil“'
  rationale: Beide Funktionen sind grammatisch möglich. Die bekräftigende Wiedergabe ergibt einen natürlichen deutschen Satz und erhält die eindringliche Wiederholung, ohne eine zusätzliche kausale Stufe festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen und prophetischer Dringlichkeit. „Alarm schlagen“ ist gegenwärtig verständlich, ohne umgangssprachlich zu wirken; „erbeben“ und „nahe“ bewahren den gehobenen biblischen Ton.
