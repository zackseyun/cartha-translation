source:
  edition: WLC
  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: de
  text: Ein Tag der Finsternis und des Dunkels, ein Tag der Wolken und des dichten Dunkels. Wie die Morgenröte breitet sich ein zahlreiches und mächtiges Volk über die Berge aus.[a] Seinesgleichen hat es seit Urzeiten nicht gegeben, und auch nach ihm wird es bis in die Jahre kommender Generationen keines mehr geben.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Schwärze, die sich über die Berge ausbreitet“, wenn שַׁחַר in einer seltenen Bedeutung verstanden wird. Wahrscheinlicher ist „Morgenröte“, entsprechend der üblichen hebräischen Bedeutung und dem Bild einer sich rasch über die Berge ausbreitenden Erscheinung.'
    reason: lexical_alternative
  - marker: b
    text: Das „zahlreiche und mächtige Volk“ kann ein einfallendes Heer, einen in militärischen Bildern beschriebenen Heuschreckenschwarm oder ein bewusst verschmolzenes prophetisches Bild bezeichnen.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „bis zu den Jahren von Generation und Generation“; eine Formel für eine unabsehbar lange Folge von Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֧וֹם
  choice: Tag
  rationale: Das grundlegende Zeitwort wird in beiden parallelen Wendungen beibehalten und bewahrt den prophetischen Rhythmus.
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  choice: Finsternis und Dunkel
  rationale: Die Paarung gibt zwei eng verwandte Dunkelheitsbegriffe wieder; „Finsternis“ und das substantivierte „Dunkel“ klingen würdig und vermeiden eine unnötige psychologische Verengung auf Niedergeschlagenheit.
- source_word: עָנָן וַעֲרָפֶל
  choice: Wolken und dichtes Dunkel
  rationale: „Wolken“ entspricht der deutschen Wetteridiomatik; „dichtes Dunkel“ bewahrt die verhüllende, undurchdringliche Wirkung von עֲרָפֶל.
- source_word: כְּשַׁחַר
  choice: wie die Morgenröte
  rationale: שַׁחַר bezeichnet gewöhnlich die Morgendämmerung bzw. Morgenröte. Die Formulierung passt zu dem Bild, wie sich etwas über die Berge ausbreitet; die selten vorgeschlagene Bedeutung „Schwärze“ wird nicht in den Haupttext aufgenommen.
- source_word: פָּרֻשׂ עַל הֶהָרִים
  choice: breitet es sich über die Berge aus
  rationale: Das passive Partizip beschreibt ein über die Berge ausgebreitetes Phänomen. Eine finite reflexive Form ist im Deutschen natürlich und lässt das „es“ auf das nun folgende Volk bzw. die gesamte Erscheinung vorausweisen.
- source_word: עַם רַב וְעָצוּם
  choice: ein großes und mächtiges Volk
  rationale: עַם bleibt bewusst „Volk“ und wird nicht zu „Heer“ oder „Heuschreckenschwarm“ präzisiert. רַב und עָצוּם werden als feste, gehobene Paarung wiedergegeben.
- source_word: כָּמֹהוּ לֹא נִהְיָה מִן הָעוֹלָם
  choice: Seinesgleichen hat es seit Urzeiten nicht gegeben
  rationale: Die idiomatische deutsche Wendung gibt den Vergleich und den Rückblick auf fernste Zeit knapp und natürlich wieder.
- source_word: עַד שְׁנֵי דּוֹר וָדוֹר
  choice: bis in die Jahre von Generation zu Generation
  rationale: Die ungewöhnliche hebräische Zeitformel wird relativ formal bewahrt, damit ihre offene, generationenübergreifende Reichweite nicht durch ein bestimmtes Enddatum ersetzt wird.
theological_decisions:
- issue: Identität des „großen und mächtigen Volkes“
  choice: Allgemein als „ein großes und mächtiges Volk“ wiedergeben
  alternative: Heuschreckenschwarm, menschliches Invasionsheer oder bewusst verschmolzenes Bild
  rationale: Der Vers selbst nennt ein „Volk“, legt dessen Identität aber nicht eindeutig fest. Die Übersetzung wahrt diese prophetische Spannung.
- issue: Bezug des Bildes von der Morgenröte
  choice: Das Bild auf die sich über den Bergen ausbreitende Erscheinung bzw. das Volk beziehen
  alternative: „Schwärze“ als seltene Bedeutung von שַׁחַר annehmen
  rationale: Die gewöhnliche lexikalische Bedeutung ist „Morgenröte“; der Kontrast zur Dunkelheit wird nicht harmonisiert, sondern als starkes poetisches Bild erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Parallelität. Die Wiederholung von „ein Tag“ und die gestufte Dunkelheitsmetaphorik bleiben bestehen. Die Auslegung des Volkes wird nicht konfessionell oder sachlich verengt.
