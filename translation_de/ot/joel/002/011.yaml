id: JOL.2.11
reference: Joel 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: de
  text: Und Jahwe lässt vor seinem Heer seine Stimme erschallen[a], denn sein Heerlager ist überaus groß; denn mächtig ist, wer sein Wort ausführt[b]. Denn groß ist der Tag Jahwes und überaus furchtbar[c] – wer kann ihn ertragen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gibt seine Stimme“. Auch möglich: „erhebt seine Stimme“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wer seinen Befehl ausführt“. Das hebräische Wort für „Wort“ kann hier einen Befehl bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „überaus schrecklich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Konjunktion bleibt erhalten und verbindet den Vers mit dem vorausgehenden Zusammenhang.
- source_word: נָתַן קוֹלוֹ
  choice: lässt … seine Stimme erschallen
  rationale: Die hebräische Wendung lautet wörtlich „gibt seine Stimme“. Die gewählte Formulierung bewahrt das Bild in natürlichem, gehobenem Deutsch.
- source_word: לִפְנֵי חֵילוֹ
  choice: vor seinem Heer
  rationale: חַיִל bezeichnet hier eine geordnete Streitmacht; „Heer“ passt zum prophetischen Register und lässt die genaue Art der Streitmacht offen.
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: denn sein Heerlager ist überaus groß
  rationale: „Heerlager“ erhält die militärische Lager-Metaphorik und unterscheidet מַחֲנֶה von dem zuvor genannten Heer. „Groß“ lässt offen, ob Umfang, Zahl oder Stärke im Vordergrund steht.
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: denn mächtig ist, wer sein Wort ausführt
  rationale: Der singularische Partizipialausdruck bleibt singularisch und kann individuell oder kollektiv verstanden werden. „Sein Wort ausführt“ ist idiomatisch und bewahrt דָּבָר als „Wort“, während der Zusammenhang den Befehlscharakter nahelegt.
- source_word: כִּי גָדוֹל יוֹם יְהוָה
  choice: Denn groß ist der Tag Jahwes
  rationale: Die vorangestellte Prädikatsbestimmung „groß“ erhält die emphatische Wortstellung und die feste prophetische Wendung „Tag Jahwes“.
- source_word: וְנוֹרָא מְאֹד
  choice: und überaus furchtbar
  rationale: נוֹרָא bezeichnet hier angesichts des Gerichts etwas, das Furcht hervorruft. „Furchtbar“ wahrt diese bedrohliche Bedeutung.
- source_word: וּמִי יְכִילֶנּוּ
  choice: wer kann ihn ertragen?
  rationale: „Ertragen“ gibt die Fähigkeit wieder, diesem Tag standzuhalten; das Pronomen bezieht sich grammatisch auf den Tag.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ kennzeichnet den Gottesnamen als Eigennamen und vermeidet eine konfessionell geprägte Ersatzlesung.
- issue: Identität des Heeres und Heerlagers
  choice: Die Streitmacht wird als Jahwe zugehörig und seinem Wort folgend dargestellt, ohne ihre konkrete Identität festzulegen.
  alternative: ausschließlich ein Heuschreckenschwarm; ausschließlich ein menschliches Heer
  rationale: Die Possessivformen und die Aussage über das Ausführen seines Wortes stellen die Streitmacht unter Jahwes Befehl. Ob die Bildsprache Heuschrecken, ein menschliches Heer oder beides meint, wird nicht entschieden.
- issue: Numerus und Referent von עֹשֵׂה דְבָרוֹ
  choice: 'singularisch und offen: „wer sein Wort ausführt“'
  alternative: 'kollektiv-pluralisch: „die sein Wort ausführen“; personalisiert: „der Vollstrecker seines Befehls“'
  rationale: Der hebräische Ausdruck steht im Singular, kann aber eine einzelne oder kollektiv gedachte ausführende Macht bezeichnen. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Rhythmus. Die Wiederholung von „denn“ und die emphatische Stellung „groß ist“ spiegeln die hebräische Satzführung, ohne unnatürlich zu wirken. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Stellen im Haupttext.
