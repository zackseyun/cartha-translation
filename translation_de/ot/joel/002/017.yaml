  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: de
  text: 'Zwischen der Vorhalle[a] und dem Altar sollen die Priester, die Diener Jahwes, weinen und sagen: »Verschone dein Volk, Jahwe! Mach dein Erbteil nicht zum Gegenstand der Schande und des Spotts unter den Nationen.[b] Warum soll man unter den Völkern sagen: ›Wo ist ihr Gott?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Eingangshalle“ oder „Säulenhalle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gib dein Erbteil nicht der Schande preis, sodass die Nationen über sie herrschen.“ Die hebräische Wendung kann entweder eine sprichwörtliche Verhöhnung oder die Auslieferung an fremde Herrschaft bezeichnen. Der Zusammenhang mit der anschließenden Spottfrage spricht hier eher für die erste Bedeutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: zwischen der Vorhalle und dem Altar
  rationale: אוּלָם bezeichnet die Eingangshalle beziehungsweise den Vorhallenbereich des Tempels. „Vorhalle“ ist im heutigen Deutsch klar und bewahrt den kultischen Ort.
- source_word: יִבְכּוּ
  choice: sollen ... weinen
  rationale: Die Imperfektform hat hier im Zusammenhang des Aufrufs zur Versammlung auffordernden Charakter. „Sollen ... weinen“ gibt diesen Sinn natürlich wieder.
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: die Priester, die Diener Jahwes
  rationale: Das Partizip מְשָׁרְתֵי bezeichnet die Priester nach ihrem kultischen Dienst. „Diener Jahwes“ ist verständlich und bewahrt die formelle Funktionsbezeichnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חוּסָה עַל עַמֶּךָ
  choice: Verschone dein Volk
  rationale: Das Verb bittet Jahwe, vom vernichtenden Gericht abzusehen und sich erbarmend zu erweisen. „Verschone“ ist knapp und idiomatisch.
- source_word: נַחֲלָתְךָ
  choice: dein Erbteil
  rationale: „Erbteil“ bewahrt die bundesbezogene Vorstellung, dass Israel Jahwes besonderer Anteil und Besitz ist.
- source_word: לְחֶרְפָּה
  choice: zum Gegenstand der Schande
  rationale: חֶרְפָּה bezeichnet öffentliche Schmach und Verhöhnung. Die Formulierung macht deutlich, dass das Erbteil selbst dieser Schande ausgesetzt wäre.
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: des Spotts unter den Nationen
  rationale: מָשָׁל kann hier eine sprichwörtliche Verhöhnung oder einen Spottgegenstand bezeichnen. Die folgende höhnische Frage der Völker stützt diesen Sinn, ohne die alternative Deutung als Fremdherrschaft zu verschweigen.
- source_word: גּוֹיִם / בָעַמִּים
  choice: die Nationen / die Völker
  rationale: 'Die unterschiedliche Wiedergabe bildet die hebräische Wortwahl ab: גּוֹיִם bezeichnet hier die fremden Nationen, עַמִּים die Völker allgemein.'
- source_word: לָמָּה יֹאמְרוּ
  choice: Warum soll man ... sagen
  rationale: Das Imperfekt bezeichnet die befürchtete Folge. Die unpersönliche Formulierung ist im Deutschen natürlich und entspricht dem allgemeinen Reden unter den Völkern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text gebraucht den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen.
- issue: Sinn von לִמְשָׁל בָּם גּוֹיִם
  choice: Spott unter den Nationen
  alternative: den Nationen zur Herrschaft über sie preisgegeben
  rationale: Die Verbindung mit חֶרְפָּה und die unmittelbar folgende Spottfrage „Wo ist ihr Gott?“ sprechen im Kontext für öffentliche Verhöhnung. Da מָשָׁל beziehungsweise die entsprechende Konsonantenfolge auch auf Herrschaft bezogen werden kann, wird diese echte Deutungsmöglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache bleibt eindringlich, ohne altertümliche Syntax. „Erbteil“ bewahrt bewusst den theologischen Klang; „Jahwe“ gibt den Gottesnamen direkt wieder. Sämtliche Fußnotenmarker stehen an den sachlich zugehörigen Stellen im Haupttext.
