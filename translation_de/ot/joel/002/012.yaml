  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַם עַתָּה֙ נְאֻם יְהוָ֔ה שֻׁ֥בוּ עָדַ֖/י בְּ/כָל לְבַבְ/כֶ֑ם וּ/בְ/צ֥וֹם וּ/בְ/בְכִ֖י וּ/בְ/מִסְפֵּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: de
  text: „Doch auch jetzt“, spricht Jahwe, „kehrt zu mir zurück mit eurem ganzen Herzen, mit Fasten, mit Weinen und mit Klagen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: Doch auch jetzt
  rationale: Die Wendung verbindet mit dem Vorhergehenden, setzt zugleich einen einräumenden Kontrast und betont, dass selbst jetzt noch Gelegenheit zur Umkehr besteht.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt den feierlichen Charakter wieder; der Gottesname wird als persönlicher Name mit „Jahwe“ wiedergegeben.
- source_word: שֻׁבוּ עָדַי
  choice: kehrt zu mir zurück
  rationale: שׁוב bezeichnet grundlegend das Umkehren oder Zurückkehren. Zusammen mit „zu mir“ bleibt so das relationale und bundestheologische Bild erhalten, ohne es auf den abstrakteren Begriff „bereuen“ zu verengen.
- source_word: בְּכָל לְבַבְכֶם
  choice: mit eurem ganzen Herzen
  rationale: לֵבָב bezeichnet hier die innere Person einschließlich Wille und Gesinnung. Die deutsche Wendung ist natürlich und bewahrt den umfassenden Anspruch.
- source_word: וּבְצוֹם וּבְבְכִי וּבְמִסְפֵּד
  choice: mit Fasten, mit Weinen und mit Klagen
  rationale: Die Wiederholung der Präposition wird durch das wiederholte „mit“ teilweise bewahrt. „Klagen“ gibt מִסְפֵּד als hörbaren Ausdruck tiefer Trauer wieder, ohne zwingend auf eine Totenklage einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und entspricht im modernen Deutschen der üblichen wissenschaftlich begründeten Umschrift.
- issue: Bedeutung von שׁוב im Aufruf
  choice: kehrt zu mir zurück
  alternative: kehrt euch zu mir; tut Buße
  rationale: Die gewählte Fassung erhält die Bewegungs- und Beziehungsmetapher des hebräischen Verbs. Der Zusammenhang schließt Umkehr und Reue ein, doch „tut Buße“ wäre stärker auslegend und würde die bildhafte Offenheit einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Die Satzstruktur bewahrt den eindringlichen Aufruf und die dreigliedrige Reihe körperlich sichtbarer Trauer- und Umkehrhandlungen.
