  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
translation:
  language: de
  text: Blast das Schofarhorn in Zion[a], weiht ein Fasten[b], beruft eine feierliche Versammlung ein[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Widderhorn“. Das hebräische Wort bezeichnet ein Horn, das als Warnsignal oder zu einem heiligen Aufruf geblasen wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heiligt ein Fasten“. Gemeint ist, das Fasten für einen heiligen Zweck auszusondern.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ruft eine heilige Versammlung aus“. Das hebräische Wort bezeichnet eine förmliche religiöse Zusammenkunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Blast
  rationale: Der Qal-Imperativ Plural von תקע bezeichnet zusammen mit שׁוֹפָר das Blasen beziehungsweise Ertönenlassen des Horns. „Blast“ ist im Deutschen die natürliche imperative Formulierung.
- source_word: שׁוֹפָר
  choice: Schofarhorn
  rationale: Das Wort bezeichnet das für Warnsignale und heilige Aufrufe verwendete Horn. „Schofarhorn“ bewahrt die konkrete kultische Klangfarbe und ist für heutige Leser verständlicher als „Schofar“ allein.
- source_word: בְּצִיּוֹן
  choice: auf dem Zion
  rationale: Bei Zion als Bergbezeichnung ist „auf dem Zion“ im Deutschen natürlich; zugleich bleibt Zion als religiöses und städtisches Zentrum im Blick.
- source_word: קַדְּשׁוּ
  choice: heiligt
  rationale: Der Piel-Imperativ von קדשׁ bedeutet, etwas für einen heiligen Zweck auszusondern beziehungsweise zu weihen. „Heiligt“ bildet die kultische Aussage knapp und würdig ab.
- source_word: צוֹם
  choice: ein Fasten
  rationale: Das Substantiv bezeichnet eine konkrete gemeinschaftliche Fastenzeit oder Fastenordnung, nicht bloß das Fasten als abstrakte Handlung.
- source_word: קִרְאוּ
  choice: ruft … aus
  rationale: קרא kann hier das öffentliche Ausrufen oder Einberufen bezeichnen. „Ruft … aus“ gibt den Verkündigungscharakter natürlich wieder.
- source_word: עֲצָרָה
  choice: eine Festversammlung
  rationale: עֲצָרָה bezeichnet eine förmliche kultische Zusammenkunft. „Festversammlung“ ist eine etablierte, knappe Wiedergabe, ohne die Feierlichkeit mit Fröhlichkeit gleichzusetzen.
theological_decisions:
- issue: Charakter der עֲצָרָה
  choice: Festversammlung
  alternative: feierliche Versammlung; heilige Versammlung
  rationale: Der kultische und förmliche Charakter wird gewahrt, ohne zusätzliche Aussagen über Inhalt, Stimmung oder eine bestimmte konfessionelle Praxis einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappen parallelen Imperativen. Die kultischen Begriffe werden konkret wiedergegeben; Fußnoten bewahren sachlich mögliche Alternativen.
