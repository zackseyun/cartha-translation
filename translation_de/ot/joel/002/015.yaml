revisions:
- from: Blast das Schofarhorn auf dem Zion[a], heiligt ein Fasten[b], ruft eine Festversammlung aus[c]!
  to: Blast das Schofarhorn in Zion[a], weiht ein Fasten[b], beruft eine feierliche Versammlung ein[c]!
  rationale: Die Ortsangabe wird mit „in Zion“ neutraler am hebräischen Lokativ ausgerichtet. Die kultische Zusammenkunft wird als „feierliche Versammlung“ wiedergegeben, damit weder ein freudiger Festcharakter noch weitergehende Einzelheiten eingetragen werden. „Weiht“ ist eine sichere, natürliche Wiedergabe des kultischen Aussonderns.
