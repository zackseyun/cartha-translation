  timestamp: '2026-07-17T02:53:28Z'
review_pass:
  verdict: revise
  source_fidelity: Die drei pluralischen Imperative und die kultische Abfolge sind getroffen. „Auf dem Zion“ legt jedoch die Bergtopographie stärker fest als das hebräische בְּצִיּוֹן; „in Zion“ bewahrt die Ortsangabe für Stadt und/oder Berg. „Festversammlung“ kann im heutigen Deutsch zudem einen freudig-feiernden Charakter nahelegen, der im Buß- und Klagekontext nicht ausgesagt ist.
  naturalness: Die revidierte Fassung ist moderne, würdige Standardsprache. „Weiht ein Fasten“ ist verständlicher und idiomatischer als „heiligt ein Fasten“, ohne die kultische Setzung des Piel von קדשׁ abzuschwächen. „Beruft … ein“ verbindet sich natürlich mit „Versammlung“.
  terminology: „Schofarhorn“ ist als Bezeichnung des שׁוֹפָר möglich. „Feierliche Versammlung“ gibt עֲצָרָה ohne die potenziell zu positive Konnotation von „Festversammlung“ wieder. Die Fußnoten unterscheiden lexikalische Alternativen und erläutern sie sachlich.
  issues:
  - severity: medium
    issue: „auf dem Zion“ statt „in Zion“
    rationale: Die Präposition בְּ ist zunächst lokativ. „Auf“ ist bei einer ausdrücklich als Berg verstandenen Lesart möglich, schränkt den Bezug hier aber unnötig ein; Zion kann auch die Stadt bzw. das kultische Zentrum bezeichnen.
  - severity: medium
    issue: „Festversammlung“ für עֲצָרָה
    rationale: Eine Festversammlung kann im gegenwärtigen Deutsch eine feiernde oder freudige Veranstaltung bezeichnen. עֲצָרָה benennt hier eine formelle heilige bzw. feierliche Zusammenkunft und enthält keine Aussage freudigen Feierns.
  - severity: low
    issue: „heiligt ein Fasten“
    rationale: Die Formulierung ist quellennah, wirkt im modernen Deutsch aber ungewohnt. „Weiht ein Fasten“ gibt die Aussonderung für einen heiligen Zweck klar und registergerecht wieder.
