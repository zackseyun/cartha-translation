  text: מִ֥י יוֹדֵ֖עַ יָשׁ֣וּב וְ/נִחָ֑ם וְ/הִשְׁאִ֤יר אַֽחֲרָי/ו֙ בְּרָכָ֔ה מִנְחָ֣ה וָ/נֶ֔סֶךְ לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: de
  text: 'Wer weiß? Vielleicht kehrt er um, ändert seinen Entschluss und lässt einen Segen zurück: ein Speisopfer und ein Trankopfer für den HERRN, euren Gott.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Wer weiß? Vielleicht
  rationale: Die kurze rhetorische Frage bewahrt die im Hebräischen ausgesprochene Ungewissheit; „vielleicht“ führt die möglichen Handlungen Gottes im Deutschen natürlich ein.
- source_word: יָשׁוּב
  choice: kehrt er um
  rationale: שׁוב bezeichnet hier die mögliche Abkehr vom angekündigten Gericht. „Umkehren“ bewahrt das Bewegungsbild, ohne es auf räumliche Rückkehr zu beschränken.
- source_word: וְנִחָם
  choice: und lässt es sich gereuen
  rationale: Die im Deutschen traditionsreiche, weiterhin verständliche Wendung gibt die mögliche Abkehr vom angekündigten Strafhandeln wieder und bewahrt dabei die theologische Spannung des hebräischen Ausdrucks.
- source_word: וְהִשְׁאִיר
  choice: Vielleicht lässt er … zurück
  rationale: Der Hifil von שׁאר bedeutet, etwas übrig beziehungsweise zurückzulassen. Die erneute Setzung von „vielleicht“ macht den deutschen Satz klar, ohne die Unsicherheit des Ausgangstextes aufzuheben.
- source_word: אַחֲרָיו
  choice: hinter sich
  rationale: Die räumliche Metapher „hinter ihm“ wird natürlich deutsch wiedergegeben und nicht zu einer bloßen Zeitangabe verflacht.
- source_word: בְּרָכָה
  choice: einen Segen
  rationale: Der Singular wird beibehalten; im Zusammenhang bezeichnet der Segen konkret die Erntegaben, durch die Opfer wieder möglich werden.
- source_word: מִנְחָה
  choice: ein Speisopfer
  rationale: In der Verbindung mit נֶסֶךְ hat מִנְחָה sehr wahrscheinlich die kultische Bedeutung eines aus pflanzlichen Erzeugnissen bestehenden Opfers. „Speisopfer“ ist präzise und im biblischen Sprachgebrauch verständlich; die allgemeinere Möglichkeit wird in einer Fußnote genannt.
- source_word: וָנֶסֶךְ
  choice: und ein Trankopfer
  rationale: Der kultische Fachausdruck bezeichnet ein ausgegossenes Opfer. „Trankopfer“ ist genauer und allgemein verständlicher als „Libation“.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition bezeichnet hier den Empfänger beziehungsweise die Bestimmung der Opfergabe. Der Gottesname יהוה wird nach üblicher deutscher Bibelkonvention als „der HERR“ wiedergegeben.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die Possessivkonstruktion und die Anrede im Plural werden unmittelbar bewahrt.
theological_decisions:
- issue: Rede von einer möglichen Reue Gottes
  choice: Vielleicht kehrt er um und lässt es sich gereuen
  alternative: Vielleicht wendet er sich ab und hat Mitleid
  rationale: Der Text spricht aus menschlicher Perspektive ausdrücklich ungewiss von einer möglichen Änderung des angekündigten göttlichen Handelns. Die gewählte Fassung bewahrt diese Spannung, ohne zu erklären, Gott habe moralisch gefehlt oder neue Erkenntnis gewonnen.
- issue: Bedeutungsumfang von מִנְחָה im Opferzusammenhang
  choice: ein Speisopfer
  alternative: eine Opfergabe
  rationale: Die Paarung mit dem Trankopfer spricht stark für den technischen kultischen Sinn. Daher steht die präzisere Wiedergabe im Haupttext; die allgemeinere lexikalische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Sätze erhalten die zögernde, hoffnungsvolle Bewegung des Hebräischen. Kultische Begriffe werden präzise, aber ohne unnötig akademische Sprache wiedergegeben.
