source:
  edition: WLC
  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: de
  text: Zerreißt eure Herzen, nicht eure Gewänder[a], und kehrt um zu Jahwe, eurem Gott. Denn er ist gnädig und barmherzig, langsam zum Zorn und reich an beständiger Liebe[b], und das Unheil gereut ihn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der Gewänder war ein äußeres Zeichen von Trauer oder Erschütterung. Gefordert ist hier eine Umkehr im Innersten.
    reason: cultural_context
  - marker: b
    text: 'Oder: „treuer Liebe“; das hebräische Wort bezeichnet beständige, verlässliche und loyale Zuwendung.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann bedeuten, dass Gott vom angekündigten Unheil absieht. Die Formulierung bewahrt zugleich die spannungsvolle Aussage, dass das Unheil ihn „gereut“.
    reason: theological_tension
lexical_decisions:
- source_word: קִרְעוּ
  choice: Zerreißt
  rationale: Der Imperativ von קרע bezeichnet ein tatsächliches Zerreißen. Die geläufige deutsche Wendung wahrt das eindringliche Bild.
- source_word: לְבַבְכֶם
  choice: eure Herzen
  rationale: Der Plural entspricht den mehreren Angesprochenen und bewahrt das Herz als Bild für die innere Umkehr.
- source_word: וְאַל בִּגְדֵיכֶם
  choice: und nicht eure Gewänder
  rationale: Die knappe Parallelkonstruktion des Hebräischen bleibt erhalten; „Gewänder“ verweist deutlich auf den äußeren Trauerritus.
- source_word: וְשׁוּבוּ
  choice: und kehrt um
  rationale: שוב bedeutet zurückkehren oder umkehren. „Kehrt um zu“ ist im Deutschen natürlich und bewahrt sowohl die Richtungsangabe als auch den Ruf zur Umkehr.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Form mit Suffix bezeichnet Gott als den Gott der angesprochenen Gemeinschaft.
- source_word: חַנּוּן
  choice: gnädig
  rationale: „Gnädig“ ist die sachgerechte und geläufige Wiedergabe innerhalb der biblischen Gnadenformel.
- source_word: רַחוּם
  choice: barmherzig
  rationale: „Barmherzig“ unterscheidet den Ausdruck von חַנּוּן und gibt Gottes mitfühlende Zuwendung würdig und verständlich wieder.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die deutsche Bedeutungsentsprechung gibt die hebräische Körpermetapher idiomatisch wieder, ohne ihren Sinn abzuschwächen.
- source_word: רַב חֶסֶד
  choice: reich an beständiger Liebe
  rationale: חֶסֶד umfasst loyale, verlässliche und dauerhafte Zuwendung. „Beständige Liebe“ ist verständlich und lässt die bundestheologische Tiefe offen mitschwingen.
- source_word: וְנִחָם
  choice: und er lässt sich ... gereuen
  rationale: Die deutsche Wendung wahrt die Aussage, dass Gott angesichts der Umkehr vom angekündigten Gericht absehen kann, ohne die Spannung durch eine systematische Erklärung aufzulösen.
- source_word: עַל הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet hier das drohende Strafgericht beziehungsweise eine Katastrophe, nicht moralische Bosheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Gottes Reaktion auf das angekündigte Unheil
  choice: er lässt sich das Unheil gereuen
  alternative: er sieht vom Unheil ab; er ändert seine Meinung über das Unheil
  rationale: Die gewählte Formulierung bewahrt die anthropopathische und theologisch spannungsreiche Aussage von נחם, ohne sie entweder zu einer bloßen Handlungsbeschreibung abzuschwächen oder zu einer Behauptung göttlichen Irrtums auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Der Imperativ „Zerreißt“ und die direkte Aufforderung „kehrt um“ erhalten den rhetorischen Nachdruck. Traditionell verständliche Begriffe wie „gnädig“ und „barmherzig“ werden mit der zugänglichen Wendung „beständige Liebe“ verbunden.
