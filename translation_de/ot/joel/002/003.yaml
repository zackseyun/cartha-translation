source:
  edition: WLC
  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: de
  text: Vor ihm her frisst Feuer, hinter ihm lodert eine Flamme. Vor ihm liegt das Land wie der Garten Eden, hinter ihm aber ist es eine öde Wüste. Ja, nichts entkommt ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Entronnener bleibt vor ihm übrig“ beziehungsweise „es gibt kein Entkommen vor ihm“. Das hebräische Wort kann sowohl das Entkommen als auch einen Entronnenen oder Überlebenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: vor ihm her
  rationale: Die räumliche Wendung bezeichnet den Bereich vor der kollektiv als Einheit dargestellten Heeres- oder Schwarmmacht. „Vor ihm her“ ist im Deutschen anschaulich und bewahrt den maskulin/neutrum-kompatiblen Singularbezug.
- source_word: אָכְלָה אֵשׁ
  choice: frisst Feuer
  rationale: Das Perfekt steht in einer lebhaften prophetischen Schilderung und wird präsentisch wiedergegeben. „Frisst“ bewahrt das kraftvolle Bild des verzehrenden Feuers.
- source_word: וְאַחֲרָיו
  choice: hinter ihm
  rationale: Die räumliche Wiedergabe entspricht dem Parallelismus mit לְפָנָיו und klingt im Deutschen natürlich.
- source_word: תְּלַהֵט לֶהָבָה
  choice: lodert eine Flamme
  rationale: Das Piel beschreibt intensives Brennen. „Lodert“ gibt die gesteigerte Feuererscheinung idiomatisch und bildhaft wieder.
- source_word: כְּגַן עֵדֶן
  choice: wie der Garten Eden
  rationale: Die geläufige deutsche Form bewahrt den ausdrücklichen Vergleich und den Bezug zur Paradieserzählung.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Verwüstung von Vegetation und Gelände bezeichnet das Wort eher das betroffene Land als die gesamte Erde.
- source_word: מִדְבַּר שְׁמָמָה
  choice: eine öde Wüste
  rationale: Die Verbindung bezeichnet eine völlig verwüstete, unfruchtbare Landschaft. „Öde Wüste“ ist knapp, natürlich und erhält die Intensität.
- source_word: וְגַם
  choice: ja
  rationale: „Ja“ gibt die steigernde, abschließende Hervorhebung der hebräischen Partikel im modernen Deutschen wieder.
- source_word: פְּלֵיטָה לֹא הָיְתָה לוֹ
  choice: nichts entkommt ihm
  rationale: Die idiomatische verbale Fassung vermittelt die völlige Vernichtung. Da פְּלֵיטָה sowohl das Entkommen als auch einen Entkommenen bezeichnen kann, wird die Alternative in einer Fußnote offengelegt.
theological_decisions:
- issue: Bezug der singularischen Pronominalsuffixe
  choice: Singularisches „ihm“ für die kollektiv dargestellte Heeres- oder Schwarmmacht
  alternative: Stärkere Personifizierung als einzelner männlicher Akteur oder Wechsel zum pluralischen „ihnen“
  rationale: Der hebräische Text verwendet konsequent Suffixe der 3. Person Singular. Das deutsche „ihm“ bewahrt diese Form und kann sich grammatisch auf „das Heer“ beziehen, ohne einen einzelnen Mann vorauszusetzen.
- issue: Bedeutung der Schlussaussage
  choice: „nichts entkommt ihm“
  alternative: „kein Entronnener bleibt ihm gegenüber übrig“ oder „für ihn gibt es kein Entrinnen“
  rationale: Der Zusammenhang legt umfassende Verwüstung nahe, doch das hebräische Substantiv lässt sowohl „Entkommen“ als auch „Entronnener/Überlebender“ zu. Die Hauptfassung bleibt verständlich, während die Fußnote die echte lexikalische Mehrdeutigkeit bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kräftiger Bildsprache. Die kurzen, parallelen Sätze folgen dem Aufbau des Hebräischen; „frisst“ und „lodert“ erhalten die lebhafte prophetische Darstellung, ohne altertümlich zu wirken.
