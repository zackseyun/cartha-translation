  text: וַ/יַּ֨עַן יְהוָ֜ה וַ/יֹּ֣אמֶר לְ/עַמּ֗/וֹ הִנְ/נִ֨י שֹׁלֵ֤חַ לָ/כֶם֙ אֶת הַ/דָּגָן֙ וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר וּ/שְׂבַעְתֶּ֖ם אֹת֑/וֹ וְ/לֹא אֶתֵּ֨ן אֶתְ/כֶ֥ם ע֛וֹד חֶרְפָּ֖ה בַּ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: de
  text: 'Da antwortete der HERR und sagte zu seinem Volk: »Seht, ich sende euch das Getreide, den neuen Wein und das Öl, und ihr werdet davon satt werden. Ich werde euch nicht länger dem Spott unter den Völkern preisgeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Da antwortete ... und sagte
  rationale: Gibt die hebräische Doppelformel formal erkennbar und zugleich in natürlichem Deutsch wieder.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Bewahrt den hervorhebenden, aufmerksamkeitslenkenden Charakter der hebräischen Präsentativformel.
- source_word: הַדָּגָן
  choice: das Getreide
  rationale: Bezeichnet den Getreideertrag als Grundnahrungsmittel.
- source_word: הַתִּירוֹשׁ
  choice: den neuen Wein
  rationale: תִּירוֹשׁ bezeichnet frischen beziehungsweise neuen Wein als Erzeugnis der Ernte.
- source_word: הַיִּצְהָר
  choice: das frische Öl
  rationale: Bezeichnet frisch gewonnenes Öl, im Kontext der agrarischen Trias Olivenöl.
- source_word: וּשְׂבַעְתֶּם אֹתוֹ
  choice: damit ihr davon satt werdet
  rationale: Das pronominale Objekt steht im Singular und kann kollektiv auf die zugesagten Erntegaben bezogen werden; idiomatisches Deutsch verwendet hier „davon“.
- source_word: וְלֹא אֶתֵּן אֶתְכֶם עוֹד חֶרְפָּה בַּגּוֹיִם
  choice: Ich werde euch nicht länger dem Spott unter den Völkern preisgeben
  rationale: Gibt die Konstruktion „jemanden zur Schmach machen/geben“ natürlich wieder und bewahrt den sozialen Aspekt öffentlicher Verachtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention, ohne den Gottesnamen mit einem gewöhnlichen Herrschaftstitel zu verwechseln; die Versalien kennzeichnen die Stellvertretung.
- issue: Bezug von אֹתוֹ („es/ihn“)
  choice: davon, kollektiv auf die genannten Erntegaben bezogen
  alternative: davon, eng nur auf das zuletzt genannte Öl bezogen
  rationale: Der Kontext der dreifachen Versorgung und das Verb „satt werden“ sprechen für einen zusammenfassenden Bezug, während die Singularform durch das neutrale „davon“ nicht unnötig geglättet wird.
- issue: Bedeutung von חֶרְפָּה בַּגּוֹיִם
  choice: Spott unter den Völkern
  alternative: Schmach bei den Nationen
  rationale: Bewahrt die öffentliche Erniedrigung Israels im Blick der umliegenden Völker, ohne zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und feierlich, aber ohne altertümliche Formen. „Seht“ hält den prophetischen Nachdruck von הִנְנִי fest; „preisgeben“ macht die hebräische Gebekonstruktion idiomatisch verständlich.
