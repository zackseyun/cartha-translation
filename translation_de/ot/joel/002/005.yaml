  register: Modernes, würdevolles Standarddeutsch. Die dreifache Vergleichsstruktur wird bewahrt; die beiden ersten Vergleiche halten das akustische Motiv ausdrücklich fest. »Streitwagen«, »Stoppeln« und »zur Schlacht aufgestellt« sind allgemein verständlich und tragen zugleich das prophetisch-militärische Bild.
