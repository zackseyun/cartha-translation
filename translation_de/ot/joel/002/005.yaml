  text: כְּ/ק֣וֹל מַרְכָּב֗וֹת עַל רָאשֵׁ֤י הֶֽ/הָרִים֙ יְרַקֵּד֔וּ/ן כְּ/קוֹל֙ לַ֣הַב אֵ֔שׁ אֹכְלָ֖ה קָ֑שׁ כְּ/עַ֣ם עָצ֔וּם עֱר֖וּךְ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: de
  text: Wie das Geräusch von Streitwagen springen[a] sie auf den Berggipfeln[b], wie das Geräusch einer Feuerflamme, die Stoppeln verzehrt, wie ein mächtiges Volk, zur Schlacht aufgestellt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hüpfen« oder »tanzen«. Das hebräische Verb bezeichnet eine lebhafte, federnde Bewegung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf den Häuptern der Berge«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »zum Krieg gerüstet« beziehungsweise »in Schlachtordnung aufgestellt«. Das Hebräische betont die geordnete militärische Formation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל
  choice: wie das Geräusch von
  rationale: כְּ drückt den Vergleich aus, קוֹל das hörbare Geräusch. Die wiederholte Formulierung bewahrt die parallelen Klangvergleiche des Hebräischen.
- source_word: מַרְכָּבוֹת
  choice: Streitwagen
  rationale: Im militärischen Zusammenhang bezeichnet מַרְכָּבוֹת Wagen, besonders Streitwagen. Die deutsche Wahl macht das naheliegende Bild verständlich, ohne einen modernen Fahrzeugtyp anzudeuten.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: über die Berggipfel
  rationale: Wörtlich steht »auf/über den Häuptern der Berge«. »Über die Berggipfel« verbindet das Höhenbild natürlich mit der springenden Bewegung; die konkrete hebräische Metapher wird in der Fußnote genannt.
- source_word: יְרַקֵּדוּן
  choice: springen
  rationale: רקד bezeichnet eine lebhafte, hüpfende oder springende Bewegung und kann auch »tanzen« bedeuten. »Springen« passt zur raschen Bewegung des geschilderten Heeres, ohne einen feierlichen Tanz nahezulegen.
- source_word: לַהַב אֵשׁ
  choice: Feuerflamme
  rationale: Die Verbindung benennt eine Flamme beziehungsweise Feuersglut. »Feuerflamme« hält beide Bestandteile sichtbar und trägt den zweiten Klangvergleich.
- source_word: אֹכְלָה קָשׁ
  choice: die Stoppeln verzehrt
  rationale: Das Partizip beschreibt das Feuer als aktiv fressend beziehungsweise verzehrend. קָשׁ meint trockene Halme oder Stoppeln; »Stoppeln« passt zum prophetischen Brandbild.
- source_word: כְּעַם עָצוּם
  choice: wie ein mächtiges Volk
  rationale: עָצוּם kann Stärke, Macht oder große Zahl ausdrücken. »Mächtig« lässt diese Bedeutungsbreite im militärischen Kontext weitgehend offen.
- source_word: עֱרוּךְ מִלְחָמָה
  choice: zur Schlacht aufgestellt
  rationale: Das passive Partizip von ערך bezeichnet geordnetes Aufstellen, hier in militärischer Formation. Die Formulierung gibt sowohl die Kampfbereitschaft als auch die geordnete Aufstellung wieder.
theological_decisions: []
