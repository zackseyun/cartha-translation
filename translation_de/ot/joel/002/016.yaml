  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: de
  text: Versammelt das Volk, heiligt die Gemeinde! Ruft die Ältesten zusammen, versammelt die Kinder und die Säuglinge an der Brust! Der Bräutigam soll aus seinem Zimmer kommen und die Braut aus ihrem Hochzeitsgemach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter ihrem Hochzeitsdach“ beziehungsweise „unter ihrem Baldachin“. Das hebräische Wort kann einen Hochzeitsbaldachin oder das Hochzeitsgemach bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ עָם
  choice: Versammelt das Volk
  rationale: Der Qal-Imperativ im Plural ruft dazu auf, das ganze Volk zusammenzubringen; die Wiederholung von אסף wird im Deutschen mit „versammelt“ aufgenommen.
- source_word: קַדְּשׁוּ קָהָל
  choice: heiligt die Gemeinde
  rationale: Der Piel-Imperativ von קדשׁ bezeichnet hier die sakrale Bereitung beziehungsweise Absonderung der versammelten Gemeinschaft. „Heiligt“ bewahrt diese kultische Aussage knapp und würdig.
- source_word: קִבְצוּ זְקֵנִים
  choice: Ruft die Ältesten zusammen
  rationale: קבץ bedeutet sammeln beziehungsweise zusammenbringen. Die abweichende Formulierung gibt den Wechsel des hebräischen Verbs natürlich wieder; זְקֵנִים bezeichnet im Gemeinschaftskontext wahrscheinlich die Ältesten, kann aber auch allgemein alte Männer meinen.
- source_word: עוֹלָלִים
  choice: die Kinder
  rationale: Das Wort bezeichnet kleine Kinder. „Kinder“ hält sie von den anschließend eigens genannten Säuglingen unterscheidbar.
- source_word: יֹנְקֵי שָׁדָיִם
  choice: die Säuglinge an der Brust
  rationale: Die Wendung bedeutet wörtlich „die an den Brüsten Saugenden“. Die gewählte Formulierung ist natürlich und bewahrt das konkrete Bild.
- source_word: יֵצֵא חָתָן מֵחֶדְרוֹ
  choice: Der Bräutigam soll aus seinem Zimmer kommen
  rationale: Der Jussiv drückt in der Folge der Aufforderungen einen nachdrücklichen Aufruf aus. חֶדֶר ist ein Zimmer oder inneres Gemach.
- source_word: כַלָּה מֵחֻפָּתָהּ
  choice: die Braut aus ihrem Hochzeitsgemach
  rationale: חֻפָּה kann den schützenden Hochzeitsraum beziehungsweise die Hochzeitskammer, aber auch das Hochzeitsdach oder den Baldachin bezeichnen. „Hochzeitsgemach“ passt zum Parallelismus, ohne die lexikalische Alternative zu verschweigen.
theological_decisions:
- issue: Sakrale Bedeutung von קַדְּשׁוּ
  choice: „heiligt die Gemeinde“
  alternative: „bereitet die Versammlung heilig vor“ oder „sondert die Gemeinde aus“
  rationale: Der Aufruf betrifft eine feierliche religiöse Versammlung. „Heiligt“ wahrt die kultische Kraft des Verbs, ohne ein bestimmtes Ritual hinzuzufügen.
- issue: Bedeutung von זְקֵנִים
  choice: „die Ältesten“
  alternative: „die alten Männer“
  rationale: Im gemeinschaftlichen Kontext kann das Wort anerkannte Älteste bezeichnen; zugleich bleibt die altersbezogene Lesart lexikalisch möglich und wird nicht zu einer weitergehenden Amtslehre ausgebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative erhalten den dringlichen, liturgischen Rhythmus. „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft, ohne eine spätere kirchliche Organisationsform vorauszusetzen.
