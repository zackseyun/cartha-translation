source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: de
  text: Ich werde den aus dem Norden weit von euch entfernen[a] und ihn in ein dürres und ödes Land treiben, sein Vorderteil dem östlichen Meer und sein Hinterteil dem westlichen Meer zugewandt[b]. Sein Gestank wird aufsteigen, und sein übler Geruch wird emporsteigen, denn er hat Großes getan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Heer aus dem Norden«. Im Hebräischen steht eine personifizierte Einzahl: »der Nördliche« beziehungsweise »der aus dem Norden«.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »östlichen Meer« ist wahrscheinlich das Tote Meer gemeint, mit dem »westlichen Meer« das Mittelmeer.
    reason: cultural_note
  - marker: c
    text: 'Oder: »denn er hat überheblich gehandelt«. Wörtlich lautet die hebräische Wendung: »denn er hat Großes getan«; im Zusammenhang hat sie wahrscheinlich einen negativen Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: der aus dem Norden
  rationale: Die substantivierte Einzahl bedeutet wörtlich etwa »der Nördliche«. »Der aus dem Norden« bewahrt die personifizierte Einzahl, ohne die Gestalt im Haupttext ausdrücklich als Heer, Volk oder Wind festzulegen.
- source_word: אַרְחִיק
  choice: weit … entfernen
  rationale: Der Hifil von רחק bezeichnet das Verursachen räumlicher Entfernung. Die Formulierung gibt sowohl den kausativen als auch den ausdrücklich räumlichen Sinn wieder.
- source_word: וְהִדַּחְתִּיו
  choice: ich werde ihn … treiben
  rationale: Der Hifil von נדח beschreibt ein Weg- oder Forttreiben. »Treiben« passt zur gewaltsamen Entfernung der personifiziert dargestellten Größe.
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: ein dürres und verwüstetes Land
  rationale: צִיָּה bezeichnet dürres, wasserloses Gelände; שְׁמָמָה ein verwüstetes oder ödes Land. Die beiden deutschen Adjektive erhalten beide Aspekte.
- source_word: פָּנָיו … סֹפוֹ
  choice: seinen vorderen Teil … seinen hinteren Teil
  rationale: פָּנָיו heißt wörtlich »sein Gesicht/seine Vorderseite«, סֹפוֹ »sein Ende«. Im räumlichen Gegensatz bezeichnen sie den vorderen und hinteren Teil der personifizierten Masse, ohne sie ausdrücklich militärisch als Vor- und Nachhut zu bestimmen.
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: das östliche Meer
  rationale: Die Richtungsbezeichnung wird übersetzt, statt die wahrscheinliche geografische Identifikation als Totes Meer in den Haupttext einzutragen.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: das westliche Meer
  rationale: Wörtlich ist dies das »hintere/letzte Meer«, nach der hebräischen Orientierung jedoch das Meer im Westen. Die wahrscheinliche Identifikation als Mittelmeer bleibt der Fußnote vorbehalten.
- source_word: בָאְשׁוֹ
  choice: sein Gestank
  rationale: Das Wort bezeichnet einen schlechten, abstoßenden Geruch; »Gestank« gibt seine negative Stärke knapp wieder.
- source_word: צַחֲנָתוֹ
  choice: sein übler Geruch
  rationale: Der nahezu synonyme Ausdruck wird eigenständig wiedergegeben, sodass die hebräische Parallelität erkennbar bleibt, ohne im Deutschen dasselbe Wort mechanisch zu wiederholen.
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: denn er hat Großes getan
  rationale: Die Wendung kann große Taten bezeichnen, im vorliegenden Gerichtskontext aber auch überhebliches oder maßloses Handeln. Die wörtungsnahe Fassung bewahrt diese Spannung; die negative Deutung wird als Alternative erläutert.
theological_decisions:
- issue: Identität dessen, der »aus dem Norden« ist
  choice: Eine personifiziert dargestellte feindliche Macht, deren genaue Identität im Haupttext offenbleibt
  alternative: Das nördliche Heer; ein bestimmtes historisches Volk; die personifizierte Heuschreckenplage; ein Nordwind
  rationale: Die grammatische Einzahl und die Darstellung mit einem vorderen und hinteren Teil sprechen für Personifikation. Der Vers selbst benennt jedoch weder ein bestimmtes Volk noch eindeutig ein Heer oder ausschließlich die Heuschrecken; daher wird keine dieser Deutungen festgeschrieben.
- issue: Bedeutung von »er hat Großes getan«
  choice: Die hebräische Wendung bleibt im Haupttext formal offen
  alternative: »Denn er hat überheblich gehandelt« oder »denn er hat maßlos gehandelt«
  rationale: Im Gerichtszusammenhang liegt eine negative, möglicherweise überhebliche Bedeutung nahe. Dieselbe Wendungsart kann jedoch auch positiv von mächtigen Taten sprechen. Die Übersetzung erhält deshalb die bewusste Spannung und nennt die kontextuelle Alternative in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die personifizierte Einzahl und die doppelte Geruchsaussage bleiben erhalten. Die geografischen und wertenden Deutungen werden nicht in den Haupttext eingetragen, sondern in Fußnoten kenntlich gemacht.
