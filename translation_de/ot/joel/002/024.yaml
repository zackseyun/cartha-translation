  text: וּ/מָלְא֥וּ הַ/גֳּרָנ֖וֹת בָּ֑ר וְ/הֵשִׁ֥יקוּ הַ/יְקָבִ֖ים תִּיר֥וֹשׁ וְ/יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/024.yaml
  text: The threshing floors will be filled with grain[a], and the vats will overflow with new wine and oil.
translation:
  language: de
  text: Die Tennen werden voll Getreide sein, und die Kelterbecken[a] werden von jungem Wein und Öl überfließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Keltern.'
    reason: Das hebräische Wort kann die Kelteranlage beziehungsweise die zugehörigen Auffangbecken bezeichnen.
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: werden voll … sein
  rationale: Das Qal-Perfekt mit וְ bezeichnet im prophetischen Zusammenhang den künftigen Zustand als Ergebnis der angekündigten Wiederherstellung. Die deutsche Zustandsformulierung gibt dies direkt und natürlich wieder.
- source_word: הַגֳּרָנוֹת
  choice: die Tennen
  rationale: גֹּרֶן bezeichnet den Dreschplatz. „Tennen“ ist eine knappe, im biblisch-landwirtschaftlichen Zusammenhang verständliche Wiedergabe; der Plural bleibt erhalten.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר meint hier gedroschenes Korn beziehungsweise Getreide, ohne die Getreideart auf Weizen einzugrenzen.
- source_word: וְהֵשִׁיקוּ
  choice: werden … überfließen
  rationale: Die Form beschreibt das Überströmen beziehungsweise Überlaufen und zeichnet so das Bild überreicher Ernte.
- source_word: הַיְקָבִים
  choice: die Kelterbecken
  rationale: יֶקֶב bezeichnet hier die mit dem Keltern verbundenen Becken oder Behälter, in denen die aus Trauben oder Oliven gewonnene Flüssigkeit gesammelt wird. „Kelterbecken“ passt daher zu Wein und Öl.
- source_word: תִּירוֹשׁ
  choice: junger Wein
  rationale: תִּירוֹשׁ bezeichnet den frischen Ertrag der Weinlese. „Junger Wein“ bewahrt den landwirtschaftlich-saisonalen Sinn, ohne ihn auf unvergorenen Traubensaft festzulegen.
- source_word: וְיִצְהָר
  choice: Öl
  rationale: יִצְהָר bezeichnet als landwirtschaftliches Erzeugnis Öl, gewöhnlich Olivenöl. „Öl“ ist hier die direkte Wiedergabe; die Verbindung mit den Kelterbecken macht den Erntezusammenhang deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Parallelstruktur. Der landwirtschaftliche Begriff „Tennen“ bleibt wegen seiner Präzision erhalten; „Kelterbecken“ verdeutlicht, dass Behälter gemeint sind, die mit Wein und Öl überfließen können.
