base_translation:
  language: en
  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
translation:
  language: de
  text: Wie Pferde sehen sie aus[a], und wie Reiter[b] rennen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wie das Aussehen von Pferden ist sein Aussehen.“ Das Hebräische verwendet ein Suffix im Singular („sein Aussehen“), dessen Bezug im Zusammenhang kollektiv ist.'
    reason: lexical_alternative
  - marker: b
    text: „Reiter“ kann hier auch „berittene Kämpfer“ oder „Kavallerie“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה סוּסִים מַרְאֵהוּ
  choice: Wie Pferde sehen sie aus
  rationale: Die Formulierung gibt die wiederholte Wurzel מראה idiomatisch wieder, ohne im Deutschen das schwerfällige „Ihr Aussehen ist wie das Aussehen von Pferden“ zu verwenden. Der maskuline Singularsuffix bezieht sich im Zusammenhang kollektiv auf den Schwarm beziehungsweise das Heer und wird daher mit dem deutschen Plural „sie“ wiedergegeben.
- source_word: וּכְפָרָשִׁים
  choice: und wie Reiter
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer beziehungsweise Reiter. „Reiter“ ist im modernen Deutsch natürlich und bewahrt das militärische Vergleichsbild.
- source_word: כֵּן יְרוּצוּן
  choice: rennen sie dahin
  rationale: כֵּן nimmt den Vergleich auf; die deutsche Satzparallelität macht diese Funktion ohne ein zusätzliches „so“ deutlich. רוץ bedeutet grundsätzlich „rennen/laufen“; „dahinrennen“ vermittelt hier die schnelle Vorwärtsbewegung, ohne die Bildsprache weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: Natürliches, gehobenes Standarddeutsch. Die kompakte Parallelstruktur bewahrt den Vergleich mit Pferden und Reitern sowie die kollektive Darstellung des heranstürmenden Schwarms beziehungsweise Heeres.
