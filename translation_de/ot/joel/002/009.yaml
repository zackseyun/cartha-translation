  text: בָּ/עִ֣יר יָשֹׁ֗קּוּ בַּֽ/חוֹמָה֙ יְרֻצ֔וּ/ן בַּ/בָּתִּ֖ים יַעֲל֑וּ בְּעַ֧ד הַ/חַלּוֹנִ֛ים יָבֹ֖אוּ כַּ/גַּנָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/009.yaml
  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: de
  text: Sie stürmen durch die Stadt[a], rennen auf der Mauer, klettern in die Häuser und kommen durch die Fenster herein wie ein Dieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Stadt“. Die hebräische Präposition bedeutet gewöhnlich „in“; im Zusammenhang bezeichnet sie Bewegung innerhalb der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: stürmen
  rationale: Das Verb bezeichnet hier eine schnelle, energische Bewegung. „Stürmen“ gibt das unaufhaltsame Vordringen im Stadtraum natürlich und anschaulich wieder.
- source_word: בָּעִיר
  choice: durch die Stadt
  rationale: Die Präposition ב bedeutet gewöhnlich „in“; zusammen mit dem Bewegungsverb bezeichnet sie hier Bewegung innerhalb beziehungsweise durch den Stadtraum. „Durch die Stadt“ ist im Deutschen idiomatisch.
- source_word: יְרֻצוּן
  choice: rennen
  rationale: Die Grundbedeutung von רוץ ist „laufen/rennen“. „Rennen“ bewahrt die Geschwindigkeit und den Parallelismus der Bewegungsverben.
- source_word: בַּחוֹמָה
  choice: auf der Mauer
  rationale: Die Präposition bezeichnet die Bewegung auf der Stadtmauer; der Singular kann die Befestigung als Ganzes bezeichnen.
- source_word: יַעֲלוּ
  choice: steigen … ein
  rationale: עלה bedeutet „hinaufsteigen“. In Verbindung mit Häusern gibt „einsteigen“ die kontextuell gemeinte Überwindung der Gebäudegrenze knapp und natürlich wieder.
- source_word: בַּבָּתִּים
  choice: in die Häuser
  rationale: Die hebräischen Häuser stehen mit Artikel. Die deutsche Form bewahrt die bestimmte, anschauliche Szene.
- source_word: בְּעַד הַחַלּוֹנִים
  choice: durch die Fenster
  rationale: בְּעַד bezeichnet hier den Weg durch eine Öffnung. „Durch die Fenster“ ist die direkte und natürliche Wiedergabe.
- source_word: יָבֹאוּ
  choice: dringen … ein
  rationale: בוא bedeutet grundsätzlich „kommen/eintreten“. „Eindringen“ bringt im Zusammenhang den feindlichen Eintritt zum Ausdruck; das Verb wird mit „ein“ vervollständigt.
- source_word: כַּגַּנָּב
  choice: wie ein Dieb
  rationale: Die Vergleichspartikel und das Substantiv werden direkt und in modernem Deutsch wiedergegeben, ohne den Vergleich theologisch auszuweiten.
theological_decisions:
- issue: Identität der eindringenden Schar
  choice: Das unausgesprochene Subjekt bleibt durch die dritte Person Plural unbestimmt.
  alternative: Die Eindringlinge ausdrücklich als Heuschrecken oder als menschliches Heer bezeichnen.
  rationale: Der hebräische Vers nennt das Subjekt nicht ausdrücklich und führt die Spannung zwischen Heuschreckenplage und militärischem Angriff aus dem Kontext fort. Die Übersetzung löst diese Bildüberlagerung nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, dynamischen Bewegungsverben. Die Reihung erhält das rasche Tempo des hebräischen Verses; das Subjekt bleibt wie im Ausgangstext unausgesprochen.
