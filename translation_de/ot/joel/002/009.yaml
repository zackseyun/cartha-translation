  source_fidelity: Die Bewegungsabfolge und das unbestimmte plurale Subjekt werden zutreffend wiedergegeben. „Stürmen“ ist für יָשֹׁקּוּ im Kontext vertretbar, und die Fußnote wahrt die mit בָּעִיר verbundene Möglichkeit „in der Stadt“. Für יָבֹאוּ ist „kommen ... herein“ näher am Grundverb als das stärker interpretierende „dringen ... ein“.
  naturalness: „In die Häuser einsteigen“ ist bei Gebäuden im modernen Standarddeutsch weniger idiomatisch und kann an das Einsteigen in Fahrzeuge denken lassen. „In die Häuser klettern“ ist klar, dynamisch und bildet das Hinaufsteigen ab. Die Vermeidung der doppelten Partikel „ein“ verbessert den Satzfluss.
  terminology: Die Begriffe Stadt, Mauer, Häuser, Fenster und Dieb sind sachgerecht. Der Vergleich bleibt singularisch und ohne Festlegung des Bildreferenten; dadurch wird weder die Heuschrecken- noch die Heeresdeutung vorentschieden.
