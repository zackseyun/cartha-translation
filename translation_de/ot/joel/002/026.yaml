  text: וַ/אֲכַלְתֶּ֤ם אָכוֹל֙ וְ/שָׂב֔וֹעַ וְ/הִלַּלְתֶּ֗ם אֶת שֵׁ֤ם יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר עָשָׂ֥ה עִמָּ/כֶ֖ם לְ/הַפְלִ֑יא וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: de
  text: Ihr werdet gewiss essen und satt werden[a] und den Namen Jahwes, eures Gottes, loben, der Wunderbares für euch getan hat[b]. Mein Volk wird nie mehr zuschanden kommen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr werdet reichlich essen und satt werden.“ Im Hebräischen wird das Verb „essen“ durch einen Infinitivus absolutus verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „der wunderbar mit euch gehandelt hat“; auch: „der wunderbar an euch gehandelt hat“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Und mein Volk wird nicht für immer zuschanden kommen.“ Die Wendung bezeichnet dauerhafte Bewahrung vor Schande; auch: „wird niemals beschämt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  choice: Ihr werdet reichlich essen
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus verstärkt den Vorgang des Essens. „Reichlich essen“ gibt diese Betonung im Zusammenhang der wiederhergestellten Versorgung natürlich wieder; die genauere Form der hebräischen Hervorhebung wird in der Fußnote erläutert.
- source_word: וְשָׂבוֹעַ
  choice: und satt werden
  rationale: שׂבע bezeichnet das Sattwerden nach dem Essen. Die Wendung ist im modernen Deutschen klar, idiomatisch und nah am Bild des Ausgangstextes.
- source_word: וְהִלַּלְתֶּם
  choice: und … loben
  rationale: Das Piel von הלל bedeutet hier „loben“. Die einfache deutsche Entsprechung passt zum gottesdienstlichen und bundesbezogenen Zusammenhang.
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: den Namen Jahwes, eures Gottes
  rationale: „Name“ bleibt erhalten, weil der Ausdruck Gottes offenbarte Identität und seinen Ruf bezeichnet. Das Tetragramm wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen Form des Gottesnamens.
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: der wunderbar an euch gehandelt hat
  rationale: Die Formulierung bewahrt sowohl Gottes Handeln als auch dessen außergewöhnlichen Charakter. „An euch“ bildet עִם in diesem Zusammenhang idiomatisch ab, ohne die mögliche Deutung „für euch“ auszuschließen.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: Und mein Volk wird niemals beschämt werden
  rationale: בושׁ kann öffentliches Zuschandenwerden oder enttäuschte Hoffnung bezeichnen. „Beschämt werden“ wahrt diese Ehr- und Schanddimension; „niemals“ gibt die dauerhafte Verneinung von לְעוֹלָם wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „wieder“ in den Haupttext einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den offenbarten Bundesnamen und entspricht der geläufigen deutschen Umschrift, während „der HERR“ eine traditionelle Ersatzlesung darstellt.
- issue: Reichweite der Zusage וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: mein Volk wird niemals beschämt werden
  alternative: mein Volk wird nie wieder beschämt werden
  rationale: Die gewählte Fassung gibt die dauerhafte Verneinung direkt wieder. „Nie wieder“ passt zum Wiederherstellungskontext, ergänzt jedoch den Gedanken einer Wiederholung, der nicht eigens im Wortlaut steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Anrede steht im vertrauten biblischen Plural „ihr/euer“. Der Gottesname wird als „Jahwe“ wiedergegeben. Hebräische Hervorhebung und echte Deutungsalternativen werden in knappen Fußnoten sichtbar gemacht.
