  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: de
  text: Fürchte dich nicht, du Land! Juble und freue dich, denn Jahwe hat Großes getan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisches Idiom: „hat groß gehandelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Fürchte dich nicht
  rationale: אַל mit dem Imperfekt drückt hier ein Verbot aus. Die feminine Singularform richtet sich an אֲדָמָה, das personifizierte Land.
- source_word: אֲדָמָה
  choice: du Land
  rationale: Im landwirtschaftlichen und territorialen Zusammenhang ist das Land Judas personifiziert angesprochen. „Du“ gibt die direkte Anrede im heutigen Deutsch natürlich wieder.
- source_word: גִּילִי
  choice: Juble
  rationale: Das Verb bezeichnet laute, überschwängliche Freude. „Juble“ wahrt die poetische Steigerung gegenüber dem folgenden „freue dich“.
- source_word: וּשְׂמָחִי
  choice: und freue dich
  rationale: Die zweite Aufforderung wird eigenständig wiedergegeben, damit die parallele Intensivierung des Hebräischen erhalten bleibt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die vorausgehenden Aufforderungen ein; „denn“ ist in diesem prophetisch-poetischen Satz natürlich und würdig.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: hat Großes getan
  rationale: Die hebräische Verbindung bedeutet idiomatisch „groß gehandelt“ beziehungsweise „Großes getan“. Die gewählte Formulierung ist verständlich und bewahrt den Gedanken machtvollen Handelns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen in einer im modernen Deutschen gebräuchlichen wissenschaftlichen Umschrift.
- issue: Bezug von הִגְדִּיל לַעֲשׂוֹת
  choice: Jahwes großes Handeln
  alternative: allgemeine Aussage, dass Jahwe sich groß erwiesen hat
  rationale: Die idiomatische Konstruktion wird nicht dogmatisch näher bestimmt. Sie bezeichnet Jahwes machtvolles Tun, ohne im Vers selbst einzelne Taten zu benennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-poetischer Direktheit. Die Personifikation des Landes und die zwei unterschiedlichen Freudenverben bleiben erkennbar; archaisches „o Land“ wird vermieden.
