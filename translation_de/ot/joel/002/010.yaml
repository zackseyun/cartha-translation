  variant: modern standard German
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: de
  text: Vor ihm bebt die Erde[a], der Himmel erzittert. Sonne und Mond werden dunkel, und die Sterne ziehen ihren Glanz zurück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In seiner Gegenwart zittert die Erde.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Die Sterne sammeln ihren Glanz ein“, das heißt, sie lassen ihr Licht nicht mehr leuchten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Vor ihm
  rationale: Die Verbindung aus ל und פָּנִים mit Suffix bedeutet idiomatisch „vor ihm“ beziehungsweise „in seiner Gegenwart“. „Vor ihm“ ist natürlich und bewahrt zugleich die räumlich-relationale Bildhaftigkeit.
- source_word: רָגְזָה
  choice: bebt
  rationale: רגז bezeichnet Zittern, Beben oder Erregung. Bei der Erde als Subjekt gibt „bebt“ die seismische und kosmische Erschütterung prägnant wieder.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Obwohl אֶרֶץ auch „Land“ bedeuten kann, spricht der Zusammenhang mit Himmel, Sonne, Mond und Sternen für den umfassenden kosmischen Sinn „Erde“.
- source_word: רָעֲשׁוּ
  choice: erzittert
  rationale: רעשׁ bezeichnet heftiges Schütteln oder Beben. „Erzittert“ wahrt den Parallelismus, ohne „bebt“ unmittelbar zu wiederholen.
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Das morphologisch plurale שָׁמַיִם bezeichnet den Himmel beziehungsweise die Himmel. Der deutsche Singular „der Himmel“ ist hier idiomatisch, würdevoll und umfasst den sichtbaren kosmischen Raum.
- source_word: קָדָרוּ
  choice: werden dunkel
  rationale: קדר bezeichnet das Dunkelwerden oder Sich-Verfinstern. „Werden dunkel“ gibt den Vorgang klar und ohne interpretierende Zuspitzung wieder.
- source_word: אָסְפוּ
  choice: ziehen … zurück
  rationale: אסף bedeutet grundsätzlich „sammeln, einziehen“. Zusammen mit „Glanz“ entsteht das Bild, dass die Sterne ihren Glanz einziehen; „zurückziehen“ bewahrt dieses Bild und vermittelt zugleich das Erlöschen des Lichts.
- source_word: נָגְהָם
  choice: ihren Glanz
  rationale: נֹגַהּ bezeichnet Glanz, Helligkeit oder Leuchten. „Glanz“ passt zum poetisch-prophetischen Register und verbindet sich natürlich mit „zurückziehen“.
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: Sonne und Mond
  rationale: Die direkte Wiedergabe erhält die Reihenfolge und die paarweise kosmische Bildsprache des Hebräischen.
- source_word: וְכוֹכָבִים
  choice: und die Sterne
  rationale: Die direkte Wiedergabe bewahrt den poetischen Fortgang von Erde und Himmel zu den einzelnen Himmelskörpern.
theological_decisions:
- issue: Reichweite der Bilder kosmischer Erschütterung
  choice: Die kosmischen Vorgänge werden unmittelbar und bildkräftig wiedergegeben, ohne sie auf bloße Metaphern zu reduzieren oder einem bestimmten Endzeitschema zuzuordnen.
  alternative: Die Aussagen entweder ausschließlich als bildliche Schilderung des Schreckens vor einem Heer oder ausdrücklich als festgelegte endzeitliche Vorhersage auszulegen.
  rationale: Der prophetische Text lässt offen, wie historische, poetische und eschatologische Dimensionen zusammenwirken. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Parallelismus und die Steigerung der kosmischen Erschütterung bleiben erhalten; unnötige konfessionelle oder endzeitliche Festlegungen werden vermieden.
