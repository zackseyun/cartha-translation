source:
  edition: WLC
  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: de
  text: 'Und ihr, Kinder Zions, jubelt und freut euch über Jahwe, euren Gott! Denn er hat euch den Frühregen zur Gerechtigkeit[a] gegeben und lässt Regen für euch herabkommen: Frühregen und Spätregen wie zuvor.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Lehrer zur Gerechtigkeit“ beziehungsweise „den Lehrer der Gerechtigkeit“. Das hebräische Wort kann „Lehrer“ oder „Frühregen“ bedeuten. Auch „zur Gerechtigkeit“ kann hier „nach rechtem Maß“ oder „zu eurer Rechtfertigung/Vindikation“ meinen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „im ersten Monat“. Die hebräische Form kann auch eine kalendarische Angabe sein; „wie zuvor“ passt jedoch gut zum Zusammenhang der Wiederherstellung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: Und ihr, Kinder Zions
  rationale: Die Anrede bezeichnet die Bevölkerung Zions kollektiv. „Kinder“ gibt den familiären Sinn wieder, ohne die Aussage auf Männer zu beschränken; „und ihr“ bewahrt den Anschluss an den vorigen Zusammenhang.
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: jubelt und freut euch
  rationale: Die beiden Imperative bilden eine verstärkende Aufforderung zur Freude und werden durch zwei natürliche deutsche Verben wiedergegeben.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: über Jahwe, euren Gott
  rationale: Die Präposition bezeichnet hier den Grund beziehungsweise Gegenstand der Freude. Der Gottesname wird transparent als „Jahwe“ wiedergegeben.
- source_word: כִּי נָתַן לָכֶם
  choice: Denn er gibt euch
  rationale: כִּי begründet die Aufforderung. Das hebräische Perfekt kann hier im prophetischen Wiederherstellungszusammenhang eine als gewiss dargestellte Gabe bezeichnen; deutsches Präsens passt zugleich zum folgenden Verb.
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: den Frühregen zur Gerechtigkeit
  rationale: מוֹרֶה kann „Lehrer“ oder „Frühregen“ bedeuten; die anschließende ausdrückliche Nennung von Früh- und Spätregen spricht stark für die meteorologische Bedeutung. „Zur Gerechtigkeit“ bewahrt die schwierige Wendung לִצְדָקָה, ohne sie vorschnell auf Maß, Verdienst oder Rechtfertigung festzulegen.
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: und lässt Regen für euch herabkommen
  rationale: Die Hifil-Form von ירד ist kausativ. Die Formulierung gibt sowohl das Herabkommen als auch Gottes Wirken wieder.
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: Frühregen und Spätregen
  rationale: Dies sind die beiden für die Landwirtschaft wichtigen saisonalen Regenzeiten; die herkömmlichen deutschen Fachwörter sind knapp und verständlich.
- source_word: בָּרִאשׁוֹן
  choice: wie zuvor
  rationale: Die adverbiale Deutung passt zum Wiederherstellungskontext. Eine kalendarische Deutung als „im ersten Monat“ bleibt möglich und wird in der Fußnote genannt.
theological_decisions:
- issue: Mehrdeutigkeit von הַמּוֹרֶה
  choice: Im Haupttext „Frühregen“
  alternative: „Lehrer zur Gerechtigkeit“ oder „Lehrer der Gerechtigkeit“
  rationale: Der unmittelbare landwirtschaftliche Kontext favorisiert „Frühregen“. Die alternative didaktische, mitunter messianisch verstandene Lesart wird nicht in den Haupttext eingetragen, aber ausdrücklich dokumentiert.
- issue: Bedeutung von לִצְדָקָה
  choice: „zur Gerechtigkeit“
  alternative: „nach rechtem Maß“ oder „zu eurer Rechtfertigung“
  rationale: Die wörtlich nahe Wiedergabe erhält die moralische und bundestheologische Spannung von צדקה. Eine rein mengenmäßige oder forensische Festlegung wäre kontextuell möglich, aber enger als der hebräische Ausdruck.
- issue: Deutung von בָּרִאשׁוֹן
  choice: „wie zuvor“
  alternative: „im ersten Monat“
  rationale: Die Wiederherstellung früherer Segensverhältnisse ist im Kontext naheliegend; die morphologisch mögliche kalendarische Lesart wird offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, rhythmischer Anrede. Die landwirtschaftlichen Begriffe „Frühregen“ und „Spätregen“ sind geläufige Bibelwörter und zugleich sachlich präzise. Schwierige Mehrdeutigkeiten werden im Haupttext nicht konfessionell aufgelöst, sondern in Fußnoten transparent gemacht.
