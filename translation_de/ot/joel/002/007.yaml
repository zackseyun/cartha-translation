  source_fidelity: 'Die Grundbedeutung wird weitgehend richtig wiedergegeben: גִּבּוֹרִים sind hier Krieger, רוץ bezeichnet Laufen, und die Bewegung über die Mauer wird treffend ausgedrückt. Die distributive Wendung אִישׁ בִּדְרָכָיו verlangt jedoch keine zusätzliche Vorstellung eines längeren Vorrückens; »zieht ... dahin« ist daher stärker als der hebräische Text. »geht« bildet יֵלֵכוּן angemessener ab. Die offene Wiedergabe von יְעַבְּטוּן als Nichtabweichen wahrt die lexikalische Unsicherheit.'
