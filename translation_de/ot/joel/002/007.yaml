  text: כְּ/גִבּוֹרִ֣ים יְרֻצ֔וּ/ן כְּ/אַנְשֵׁ֥י מִלְחָמָ֖ה יַעֲל֣וּ חוֹמָ֑ה וְ/אִ֤ישׁ בִּ/דְרָכָי/ו֙ יֵֽלֵכ֔וּ/ן וְ/לֹ֥א יְעַבְּט֖וּ/ן אֹרְחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: de
  text: Wie Krieger laufen sie, wie Soldaten erklimmen sie die Mauer.[a] Jeder geht auf seinem Weg, und sie weichen nicht von ihren Pfaden ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie Kämpfer«. Wörtlich: »wie Männer des Krieges«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie brechen nicht aus der Reihe.« Das seltene hebräische Verb kann bezeichnen, dass sie weder von ihrer Bahn noch aus ihrer Ordnung abweichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: Wie Krieger
  rationale: גִּבּוֹר bezeichnet im militärischen Zusammenhang starke, kampffähige Männer. »Krieger« gibt diesen Sinn natürlich und prägnant wieder.
- source_word: יְרֻצוּן
  choice: laufen sie
  rationale: Das Verb רוץ bedeutet unmittelbar »laufen«; die Imperfektform schildert hier anschaulich den Vormarsch.
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: wie Kriegsmänner
  rationale: Die Wendung bedeutet wörtlich »wie Männer des Krieges«. »Kriegsmänner« bewahrt den ausdrücklich männlichen und militärischen Ausdruck knapp; modernere Alternativen werden in der Fußnote genannt.
- source_word: יַעֲלוּ חוֹמָה
  choice: erklimmen sie die Mauer
  rationale: עלה bezeichnet das Hinaufgehen; zusammen mit חוֹמָה ist das Besteigen einer Stadtmauer gemeint. »Erklimmen« ist im Deutschen klar und idiomatisch.
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: Jeder zieht auf seinem Weg dahin
  rationale: 'אִישׁ hat hier distributive Bedeutung: jeder Einzelne hält seinen zugewiesenen Weg ein. »Dahinziehen« passt zur geordneten Bewegung des Heeres, ohne bereits eine bestimmte militärische Formation vorauszusetzen.'
- source_word: וְלֹא יְעַבְּטוּן
  choice: sie weichen nicht ... ab
  rationale: Das seltene Verb ist unsicher und kann eine Abweichung, Störung oder Verwicklung bezeichnen. »Nicht abweichen« passt zum parallelen Gedanken des Einhaltens des eigenen Weges, ohne die Bedeutung auf das Brechen einer Schlachtreihe festzulegen.
- source_word: אֹרְחוֹתָם
  choice: von ihren Pfaden
  rationale: אֹרַח bezeichnet Pfad, Bahn oder Weg. »Pfade« wahrt die Bildsprache und unterscheidet das Wort vom vorhergehenden דֶּרֶךְ.
theological_decisions:
- issue: Männlich geprägte Militärsprache
  choice: »Kriegsmänner« und das distributive »Jeder ... seinem« beibehalten
  alternative: »Soldaten ... alle auf ihrem Weg«
  rationale: Der hebräische Text verwendet ausdrücklich אִישׁ beziehungsweise אַנְשֵׁי und männliche Formen. Die deutsche Fassung bewahrt diese sprachliche Gestalt, ohne daraus eine über den militärischen Vergleich hinausgehende Lehraussage abzuleiten.
- issue: Bedeutung des seltenen Verbs יְעַבְּטוּן
  choice: Als Abweichen vom eingeschlagenen Pfad wiedergeben
  alternative: »Sie brechen nicht aus der Reihe«
  rationale: Der Kontext spricht für einen ungestörten, geordneten Vormarsch, doch das seltene Verb legt nicht eindeutig eine militärische Reihenformation fest. Die Hauptfassung bleibt daher weiter, während die engere militärische Deutung in der Fußnote erscheint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem, rhythmischem Parallelismus. »Kriegsmänner« ist bewusst etwas gehobener, bildet jedoch die ausdrücklich männliche hebräische Wendung präzise ab; die geläufigeren Möglichkeiten stehen in der Fußnote.
