  source_fidelity: Die ersten beiden Satzglieder geben die distributive Ordnung der Schar zutreffend wieder. Im dritten Satz ist „stürzen“ jedoch stärker und aktiver als יִפֹּלוּ („fallen“). Die Schlusswendung bleibt lexikalisch unsicher; „werden nicht aufgehalten“ ist als kontextuelle Deutung vertretbar, muss aber durch eine präzisere Fußnote als Deutung kenntlich bleiben.
  naturalness: „Keiner bedrängt seinen Bruder“ ist idiomatischer und näher am hebräischen Verhältniswort als „den anderen“. „Auf seiner eigenen Bahn“ bewahrt das poetisch-militärische Bild. „Durch die Waffe fallen“ ist absichtlich knapp und ungewöhnlich, entsprechend der schwierigen hebräischen Bildsprache; die Fußnote erläutert dies.
  terminology: „Bahn“ ist für מְסִלָּה im Bild einer geordnet vorrückenden Schar angemessen. „Waffe“ erhält den Singular von הַשֶּׁלַח, ohne die Waffengattung ungesichert festzulegen. Die Fußnote vermeidet die nicht hinreichend gedeckte Formulierung „gegen die Waffe an“.
