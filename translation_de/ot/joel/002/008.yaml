  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
translation:
  language: de
  text: Keiner bedrängt seinen Bruder; jeder zieht auf seiner eigenen Bahn dahin. Sie fallen durch die Waffe[a], doch sie werden nicht aufgehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie fallen durch die Waffen hindurch und brechen nicht ab.“ Die letzte Verszeile ist im Hebräischen lexikalisch schwierig; auch „sie werden nicht abgeschnitten“ oder „sie werden nicht verwundet“ wird vertreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו לֹא יִדְחָקוּן
  choice: Keiner bedrängt den anderen
  rationale: Die distributive Wendung אִישׁ אָחִיו beschreibt die gegenseitige Rücksicht innerhalb der Schar; דחק bezeichnet Drängen oder Bedrängen. Die deutsche Formulierung ist natürlich und bewahrt den Gedanken, dass sie einander beim Vorrücken nicht behindern.
- source_word: גֶּבֶר בִּמְסִלָּתוֹ יֵלֵכוּן
  choice: jeder zieht auf seiner eigenen Bahn dahin
  rationale: גֶּבֶר setzt die distributive Aussage fort. מְסִלָּה kann Straße, aufgeschütteten Weg oder Bahn bezeichnen; im Zusammenhang ist die geordnete Linie des Vorrückens gemeint. „zieht … dahin“ gibt הלך im militärisch-poetischen Kontext wieder, ohne ausdrücklich „marschieren“ in den Text einzutragen.
- source_word: וּבְעַד הַשֶּׁלַח יִפֹּלוּ
  choice: Sie stürzen durch die Waffe
  rationale: שֶׁלַח bezeichnet eine Waffe, häufig eine Wurf- oder Fernwaffe; בְּעַד kann hier „durch“ bedeuten. Die ungewöhnliche, bildkräftige Aussage bleibt bewusst erhalten, ohne die Art der Waffe näher festzulegen.
- source_word: לֹא יִבְצָעוּ
  choice: doch sie lassen sich nicht aufhalten
  rationale: Die Form ist lexikalisch schwierig. Im Kontext einer unaufhaltsam und geordnet vorrückenden Schar passt die Deutung, dass ihr Vormarsch trotz der Waffenwirkung nicht abgebrochen wird. Eine stärker formbezogene Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Ob die Schlussaussage Unverwundbarkeit, ungebrochene Formation oder unaufhaltsames Vorrücken bezeichnet
  choice: doch sie lassen sich nicht aufhalten
  alternative: sie werden nicht abgeschnitten / sie durchbrechen die Reihen nicht
  rationale: Der hebräische Ausdruck entscheidet die genaue Vorstellung nicht eindeutig. Die Hauptfassung gibt den kontextuellen Gedanken der nicht gestoppten Schar wieder, während die Fußnote die lexikalische Unsicherheit offenlegt und keine übernatürliche Unverwundbarkeit behauptet.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Klang. „Bahn“ bewahrt das Bild einer jeweils eigenen, geordneten Bewegungslinie; die schwer verständliche Schlusszeile wird kontextgerecht wiedergegeben, ihre echte Mehrdeutigkeit jedoch in der Fußnote kenntlich gemacht.
