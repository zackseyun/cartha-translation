base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: de
  text: Fürchtet euch nicht, ihr Tiere des Feldes! Denn die Weideplätze der Steppe sind grün geworden; die Bäume tragen ihre Früchte, Feigenbaum und Weinstock geben ihren Ertrag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „geben ihre Kraft“; gemeint sein kann auch: „bringen ihren Ertrag“ oder „geben ihren vollen Ertrag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: Fürchtet euch nicht
  rationale: Die verneinte Aufforderung mit ירא wird direkt und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: בַּהֲמוֹת שָׂדַי
  choice: ihr Tiere des Feldes
  rationale: בְּהֵמָה bezeichnet hier die wild lebenden beziehungsweise weidenden Tiere; die Anrede mit „ihr“ macht den hebräischen Vokativ im Deutschen deutlich.
- source_word: דָשְׁאוּ
  choice: sind grün geworden
  rationale: Das Verb bezeichnet das Hervorsprießen frischen Grüns; die resultative Form entspricht dem hebräischen Perfekt im Zusammenhang der Wiederherstellung.
- source_word: נְאוֹת מִדְבָּר
  choice: die Weideplätze der Steppe
  rationale: נָאוֹת sind Weide- oder Grasplätze. מִדְבָּר meint hier unbebautes Weideland und nicht notwendig eine wasserlose Sandwüste; „Steppe“ trifft diesen Landschaftstyp im Deutschen prägnant.
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: die Bäume tragen ihre Früchte
  rationale: Der hebräische Singular עֵץ kann kollektiv gebraucht sein. Der deutsche Plural stellt den Klassenbezug natürlich dar und passt zur anschließenden Nennung von Feigenbaum und Weinstock.
- source_word: תְּאֵנָה וָגֶפֶן
  choice: Feigenbaum und Weinstock
  rationale: Die beiden Kulturpflanzen werden konkret und in traditionell verständlicher deutscher Benennung wiedergegeben.
- source_word: נָתְנוּ חֵילָם
  choice: geben reichen Ertrag
  rationale: חַיִל bedeutet wörtlich Kraft, kann hier aber die produktive Kraft beziehungsweise Fülle der Pflanzen bezeichnen. „Reichen Ertrag geben“ vermittelt den landwirtschaftlichen Sinn idiomatisch, ohne eine sachfremde Bedeutung von Reichtum einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Die Bildsprache bleibt konkret; „Steppe“ vermeidet die irreführende Vorstellung einer reinen Sandwüste. Der hebräische Ausdruck „ihre Kraft geben“ wird im Text kontextgerecht als reicher Ertrag wiedergegeben und in der Fußnote transparent gemacht.
