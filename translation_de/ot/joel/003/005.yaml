  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: de
  text: 'Und es wird geschehen: Jeder, der den Namen Jahwes anruft, wird entkommen[a]. Denn auf dem Berg Zion und in Jerusalem wird es ein Entrinnen geben[b], wie Jahwe gesagt hat, und unter den Überlebenden, die Jahwe ruft[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird gerettet werden“. Das hebräische Verb kann Entkommen oder Errettung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort פְלֵיטָה kann „Entrinnen“, „Rettung“ oder auch „Entkommene/Überlebende“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Der Vers stellt beides nebeneinander: Menschen rufen den Namen Jahwes an, und Jahwe ruft die Überlebenden.'
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die zukunftsgerichtete Einleitungsformel in verständlichem, würdigem Deutsch.
- source_word: כֹּל אֲשֶׁר
  choice: Jeder, der
  rationale: Gibt die distributive und auf Personen bezogene Aussage klar wieder.
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: den Namen Jahwes anruft
  rationale: Entspricht der hebräischen Wendung für die religiöse Anrufung beziehungsweise den Hilferuf an Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Gottes persönlichen Namen wieder, statt es durch einen Titel zu ersetzen.
- source_word: יִמָּלֵט
  choice: wird entkommen
  rationale: Das Nifal von מלט bezeichnet Entkommen beziehungsweise Errettung; „entkommen“ bleibt im unmittelbaren Gerichtskontext konkret und vermeidet eine unnötige dogmatische Verengung.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: auf dem Berg Zion und in Jerusalem
  rationale: Verwendet die im Deutschen natürlichen Präpositionen für einen Berg und eine Stadt.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: wird es ein Entrinnen geben
  rationale: Spiegelt das singularische Substantiv פְלֵיטָה möglichst direkt und lässt dessen Bedeutungsbreite zwischen Entkommen, Rettung und den Entkommenen offen.
- source_word: וּבַשְּׂרִידִים
  choice: unter den Überlebenden
  rationale: Gibt sowohl die Präposition als auch die konkrete Bedeutung der Übriggebliebenen nach einem Gericht verständlich wieder.
- source_word: אֲשֶׁר יְהוָה קֹרֵא
  choice: die Jahwe ruft
  rationale: Der deutsche Präsenssatz bewahrt den partizipialen, nicht näher zeitlich festgelegten Charakter und die Wiederaufnahme des Verbs „rufen“.
theological_decisions:
- issue: Verhältnis zwischen menschlicher Anrufung und göttlichem Rufen
  choice: 'Beide Aussagen bleiben nebeneinander stehen: Menschen rufen Jahwes Namen an, und Jahwe ruft die Überlebenden.'
  alternative: Den Schlusssatz ausdrücklich als Einschränkung der allgemeinen Zusage oder als bloßen nicht einschränkenden Zusatz deuten.
  rationale: Der hebräische Text löst das Verhältnis nicht systematisch auf; die Übersetzung bewahrt diese theologische Spannung.
- issue: Bedeutung von פְלֵיטָה im Gerichtskontext
  choice: ein Entrinnen
  alternative: Rettung; die Entkommenen; ein Rest
  rationale: Die konkrete, aber offene Wiedergabe vermeidet sowohl eine rein abstrakte Heilsdeutung als auch die Festlegung des Substantivs auf eine Personengruppe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entrinnen“ ist bewusst etwas gehobener, bildet jedoch die nominale Form des Hebräischen ab und bewahrt dessen Mehrdeutigkeit. Die Satzstellung lässt die mögliche Beziehung von „unter den Überlebenden“ zum vorausgehenden Entrinnen bestehen, ohne sie dogmatisch auszudeuten.
