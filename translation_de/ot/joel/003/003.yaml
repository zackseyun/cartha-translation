source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ מֽוֹפְתִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ דָּ֣ם וָ/אֵ֔שׁ וְ/תִֽימֲר֖וֹת עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: de
  text: 'Und ich werde Wunderzeichen am Himmel und auf der Erde geben: Blut und Feuer und Rauchsäulen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: emporsteigende Rauchwolken.'
    reason: Lexikalische Alternative für תִּימֲרוֹת עָשָׁן; der Ausdruck beschreibt säulen- oder palmenartig aufsteigenden Rauch.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: נתן bedeutet grundlegend „geben, setzen, anbringen“. Die direkte Wiedergabe „geben“ bewahrt die Ausdrucksweise des Hebräischen und ist in diesem prophetischen Zusammenhang verständlich; „zeigen“ oder „erscheinen lassen“ wäre stärker deutend.
- source_word: מוֹפְתִים
  choice: Wunderzeichen
  rationale: מוֹפְתִים bezeichnet außergewöhnliche, Staunen oder Schrecken auslösende Zeichen. „Wunderzeichen“ gibt sowohl den Zeichencharakter als auch das Außerordentliche wieder, ohne die Erscheinungen näher zu erklären.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: Das morphologisch plurale שָׁמַיִם wird im modernen Standarddeutsch idiomatisch mit dem kollektiven Singular „Himmel“ wiedergegeben. Im Zusammenhang sind sichtbare Erscheinungen im Himmelsbereich gemeint; die Übersetzung legt jedoch keine engere kosmologische Deutung fest.
- source_word: וּבָאָרֶץ
  choice: und auf der Erde
  rationale: Im Gegensatz zum Himmel bezeichnet אֶרֶץ hier den irdischen Bereich. „Auf der Erde“ ist im Deutschen die natürliche kosmische Gegenüberstellung.
- source_word: דָּם
  choice: Blut
  rationale: דָּם bedeutet unmittelbar „Blut“. Eine sinnbildliche oder naturalistische Erklärung wird nicht in den Text eingetragen.
- source_word: וָאֵשׁ
  choice: und Feuer
  rationale: אֵשׁ bedeutet „Feuer“. Das verbindende „und“ erhält die eindringliche Reihung des Hebräischen.
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: und Rauchsäulen
  rationale: תִּימֲרוֹת bezeichnet hoch aufsteigende, säulen- oder palmenartig geformte Gebilde. „Rauchsäulen“ bewahrt das anschauliche Bild in natürlichem Deutsch; die mögliche dynamischere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Art der angekündigten Erscheinungen
  choice: Die kosmischen Zeichen göttlichen Eingreifens werden bildhaft und ohne nähere Festlegung wiedergegeben.
  alternative: Die Erscheinungen ausschließlich als buchstäbliche Naturereignisse oder ausschließlich als symbolische Bilder politischer beziehungsweise endzeitlicher Umwälzung zu deuten.
  rationale: Der hebräische Text nennt eindringliche Phänomene, erklärt aber nicht, ob jedes davon buchstäblich, symbolisch oder in beiderlei Sinn zu verstehen ist. Die Übersetzung wahrt diese Spannung und legt kein bestimmtes endzeitliches Schema fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Reihung. „Wunderzeichen geben“ folgt der hebräischen Formulierung enger als glättende Varianten wie „erscheinen lassen“, bleibt aber verständlich. Der Singular „Himmel“ entspricht dem üblichen deutschen Sprachgebrauch.
