  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male servants and on the female servants[a], in those days I will pour out my Spirit.
translation:
  language: de
  text: Und selbst über die Sklaven und über die Sklavinnen[a] werde ich in jenen Tagen meinen Geist ausgießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Diener und die Dienerinnen“. Die hebräischen Begriffe bezeichnen männliche und weibliche Personen in einem unfreien Dienstverhältnis; „Sklaven“ und „Sklavinnen“ geben diese soziale Wirklichkeit deutlicher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Gibt sowohl die anknüpfende als auch die hervorhebende Kraft wieder und verbindet die Aussage mit der vorausgehenden Verheißung.
- source_word: עַל הָעֲבָדִים וְעַל הַשְּׁפָחוֹת
  choice: über die Sklaven und über die Sklavinnen
  rationale: Beide Substantive bezeichnen hier männliche beziehungsweise weibliche Menschen in einem unfreien Dienstverhältnis. Die Wiederholung von „über“ bewahrt den hebräischen Parallelismus.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: in jenen Tagen
  rationale: Natürliche, würdevolle Wiedergabe der prophetischen Zeitangabe.
- source_word: אֶשְׁפּוֹךְ
  choice: werde ich … ausgießen
  rationale: Bewahrt das konkrete Bild von einer reichlichen göttlichen Zuwendung und entspricht dem Futurbezug des Kontextes.
- source_word: אֶת רוּחִי
  choice: meinen Geist
  rationale: Der Sprecher ist Gott, und der Kontext bezeichnet seinen eigenen Geist. Die Großschreibung folgt der deutschen Konvention für den göttlichen Geist.
theological_decisions:
- issue: Wiedergabe der sozialen Bezeichnungen עֲבָדִים / שְׁפָחוֹת
  choice: Sklaven / Sklavinnen
  alternative: Diener / Dienerinnen
  rationale: Die Formulierung macht den unfreien sozialen Status sichtbar, dessen Einbeziehung die umfassende Ausgießung des Geistes besonders hervorhebt, ohne die Begriffe durch eine mildere Bezeichnung abzuschwächen.
- issue: Bezug von רוּחִי
  choice: meinen Geist
  alternative: meinen geist / meinen Wind
  rationale: Im Zusammenhang ist Gottes eigener Geist gemeint, der über Menschen ausgegossen wird. Diese Lesart ist kontextuell deutlich, während die Bildsprache des Ausgießens erhalten bleibt.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen prophetischen Ton. Die Satzstellung ist im Deutschen natürlich, während die Wiederholung von „über“ den Parallelismus der hebräischen Vorlage bewahrt.
