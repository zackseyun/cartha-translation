id: JOL.3.1
reference: Joel 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: de
  text: 'Und danach wird es geschehen: Ich werde meinen Geist[b] über alles Fleisch[a] ausgießen. Eure Söhne und eure Töchter werden prophetisch reden, eure alten Männer werden Träume träumen, und eure jungen Männer werden Visionen sehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Menschen“ beziehungsweise „die ganze Menschheit“; wörtlich: „alles Fleisch“.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische markiert nicht durch Groß- oder Kleinschreibung, ob „mein Geist“ als Gottes Geist oder allgemeiner zu verstehen ist; der Zusammenhang mit prophetischer Befähigung spricht für Gottes Geist.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Die formelhafte Wendung kündigt ein zukünftiges Ereignis an. Die gewählte Fassung bewahrt diesen Vorhersagecharakter in natürlichem, würdigem Deutsch.
- source_word: אַחֲרֵי כֵן
  choice: danach
  rationale: Die Wendung bezeichnet eine zeitliche Folge, ohne deren zeitlichen Abstand näher festzulegen.
- source_word: אֶשְׁפּוֹךְ
  choice: werde … ausgießen
  rationale: Die konkrete Metapher des Ausgießens wird unmittelbar bewahrt.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: Im Zusammenhang mit prophetischem Reden, Träumen und Visionen bezeichnet die Wendung am ehesten Gottes Geist als Quelle prophetischer Befähigung.
- source_word: עַל כָּל בָּשָׂר
  choice: über alles Fleisch
  rationale: Die wörtliche hebräische Redeweise bleibt erhalten und bewahrt ihre umfassende, leibbezogene Weite, ohne sie vorschnell auf eine bestimmte Bezugsgruppe einzuengen.
- source_word: וְנִבְּאוּ
  choice: werden prophetisch reden
  rationale: Die Form bezeichnet das Reden unter prophetischer Eingebung. Diese Wiedergabe ist im heutigen Deutsch klarer und natürlicher als das inzwischen weniger alltägliche „weissagen“.
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: eure Söhne und eure Töchter
  rationale: Beide ausdrücklich genannten Gruppen werden bewahrt und nicht zum allgemeineren „eure Kinder“ zusammengezogen.
- source_word: זִקְנֵיכֶם
  choice: eure alten Männer
  rationale: Der Gegensatz zu den jungen Männern zeigt, dass hier das Lebensalter und nicht vorrangig ein Ältestenamt gemeint ist.
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: werden Träume träumen
  rationale: Die Verbindung des Verbs mit dem stammverwandten Objekt wird bewahrt und erhält so die rhetorische Gestalt des Hebräischen.
- source_word: בַּחוּרֵיכֶם
  choice: eure jungen Männer
  rationale: Im parallelen Gegensatz zu den alten Männern bezeichnet der Ausdruck junge männliche Angehörige der Gemeinschaft.
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: werden Visionen sehen
  rationale: Die übliche prophetische Ausdrucksweise lässt sich sowohl wörtlich als auch idiomatisch so wiedergeben.
theological_decisions:
- issue: Bedeutung von רוּחִי im Zusammenhang der prophetischen Ausgießung
  choice: meinen Geist
  alternative: meinen Lebenshauch / meinen Geist im allgemeineren Sinn
  rationale: Die daraus folgenden prophetischen Worte, Träume und Visionen sprechen dafür, dass Gottes Geist als Quelle der Offenbarung gemeint ist. Die Fußnote hält die größere Bedeutungsbreite des hebräischen Wortes sichtbar.
- issue: Reichweite von כָּל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen / die ganze Menschheit
  rationale: Die wörtliche Fassung erhält die umfassende Aussage und lässt offen, ob der Schwerpunkt auf der gesamten Menschheit oder auf Menschen aller Gruppen innerhalb der angesprochenen Gemeinschaft liegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die markante hebräische Wendung „alles Fleisch“ sowie die Wiederholung „Träume träumen“ bleiben bewusst erhalten. „Prophetisch reden“ vermeidet das heute teils altertümlich wirkende „weissagen“, ohne den Sinn abzuschwächen.
