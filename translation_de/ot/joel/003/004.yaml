id: JOL.3.4
reference: Joel 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: de
  text: Die Sonne wird sich in Finsternis verwandeln und der Mond in Blut[a], bevor der große und furchtgebietende[b] Tag Jahwes[c] kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in Blut“; gemeint sein kann auch ein blutrotes Aussehen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schreckliche“ beziehungsweise „ehrfurchtgebietende“.'
    reason: lexical_alternative
  - marker: c
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder; traditionell steht dafür „der HERR“.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Der bestimmte hebräische Ausdruck bezeichnet eindeutig den Himmelskörper; die direkte deutsche Entsprechung ist natürlich und präzise.
- source_word: יֵהָפֵךְ
  choice: wird sich verwandeln
  rationale: Das Nifal Imperfekt beschreibt eine eintretende Zustandsveränderung. Die reflexive deutsche Form gibt den resultativen Sinn natürlicher wieder als die schwerfällige Formulierung „wird verwandelt werden“.
- source_word: לְחֹשֶׁךְ
  choice: in Finsternis
  rationale: Die Präposition לְ bezeichnet hier den erreichten Zustand. „Finsternis“ bewahrt den feierlichen, prophetischen Klang besser als das neutralere „Dunkelheit“.
- source_word: וְהַיָּרֵחַ
  choice: und der Mond
  rationale: Die koordinierte Nominalphrase wird direkt wiedergegeben; das im Hebräischen ausgelassene Verb kann auch im Deutschen aus dem ersten Satzglied ergänzt werden.
- source_word: לְדָם
  choice: in Blut
  rationale: Die wörtliche, eindringliche Bildsprache des Hebräischen bleibt erhalten. Eine Deutung als bloße Farbangabe wird nicht in den Haupttext eingetragen.
- source_word: לִפְנֵי בּוֹא
  choice: bevor … kommt
  rationale: Die temporale Beziehung wird in natürlichem modernem Deutsch als Nebensatz ausgedrückt, ohne den Sinn von „vor dem Kommen“ zu verändern.
- source_word: יוֹם יְהוָה
  choice: Tag Jahwes
  rationale: Die feste prophetische Wendung wird bewahrt und der Gottesname als Eigenname wiedergegeben.
- source_word: הַגָּדוֹל
  choice: große
  rationale: „Groß“ erfasst sowohl das Ausmaß als auch die Bedeutung des angekündigten Tages, ohne zusätzliche Deutung.
- source_word: וְהַנּוֹרָא
  choice: und furchtgebietende
  rationale: Das Wort bezeichnet etwas, das Furcht beziehungsweise ehrfürchtiges Erschrecken hervorruft. „Furchtgebietend“ bewahrt diese Spannung besser als das heute oft positiv verstandene „ehrfurchtgebietend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: 'Jahwe / im Genitiv: Jahwes'
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder; die Form „Jahwes“ ist im deutschen Satz grammatisch erforderlich.
- issue: Charakter der kosmischen Bildsprache
  choice: „der Mond in Blut“
  alternative: „der Mond wird blutrot“
  rationale: Die Übersetzung erhält die drastische prophetische Formulierung und legt nicht fest, ob sie wörtlich, als Beschreibung einer blutroten Erscheinung oder symbolisch zu verstehen ist.
- issue: Bedeutungsumfang von הַנּוֹרָא
  choice: furchtgebietend
  alternative: schrecklich; ehrfurchtgebietend
  rationale: Die gewählte Form lässt sowohl Schrecken als auch ehrfürchtiges Erschauern anklingen und vermeidet eine rein positive oder moralisch wertende Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. Die elliptische zweite Verbgruppe folgt dem Hebräischen und ist im Deutschen klar verständlich. „Finsternis“, „Blut“ und „furchtgebietend“ bewahren den ernsten apokalyptischen Ton, ohne die Bildsprache auszudeuten.
