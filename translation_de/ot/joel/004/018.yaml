  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: de
  text: An jenem Tag werden die Berge von Most triefen, die Hügel werden von Milch überfließen, und in allen Bachbetten Judas wird Wasser fließen. Eine Quelle wird aus dem Haus Jahwes hervorbrechen und das Schittimtal[a] bewässern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Akaziental“ beziehungsweise „das Akazienwadi“.'
    reason: Die hebräische Wendung נַחַל הַשִּׁטִּים kann als Ortsname oder als Bezeichnung eines von Akazien geprägten Wadis verstanden werden.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die knappe deutsche Zeitformel gibt die hebräische Einleitung einer künftigen Szene natürlich und würdig wieder.
- source_word: יִטְּפוּ
  choice: werden … triefen
  rationale: Das Verb bezeichnet ein Tropfen oder Träufeln; „triefen“ bewahrt hier das kräftige Bild überströmender Fülle.
- source_word: עָסִיס
  choice: Most
  rationale: Das Wort bezeichnet frisch gepressten Traubensaft beziehungsweise jungen Wein. „Most“ ist im Deutschen knapp und bildet diese Bedeutung ab, ohne den Gärungsgrad genauer festzulegen.
- source_word: תֵּלַכְנָה חָלָב
  choice: werden von Milch überfließen
  rationale: Das hebräische Bewegungsverb bedeutet wörtlich „gehen“, beschreibt hier aber bildhaft reichlich fließende Milch. Die Wiedergabe ist im Deutschen idiomatisch und erhält das Motiv der Fülle.
- source_word: אֲפִיקֵי יְהוּדָה
  choice: alle Bachbetten Judas
  rationale: אֲפִיקִים bezeichnet Rinnen, Bachbetten oder Wadis. „Bachbetten“ ist anschaulich und allgemein verständlich, besonders im Kontrast zu dem Wasser, das sie nun füllt.
- source_word: יֵלְכוּ מָיִם
  choice: wird Wasser fließen
  rationale: Das hebräische „gehen“ wird bei Wasser im Deutschen sachgerecht mit „fließen“ wiedergegeben.
- source_word: מַעְיָן
  choice: eine Quelle
  rationale: Das Substantiv bezeichnet eine natürliche Quelle oder einen hervorströmenden Wasserursprung.
- source_word: מִבֵּית יְהוָה
  choice: aus dem Haus Jahwes
  rationale: „Haus“ wahrt die konkrete hebräische Bezeichnung des Heiligtums; „Tempel“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des hebräischen Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: יֵצֵא
  choice: hervorbrechen
  rationale: Wörtlich „hinausgehen“; bei einer Quelle vermittelt „hervorbrechen“ die räumliche Bewegung aus dem Heiligtum in natürlichem Deutsch.
- source_word: וְהִשְׁקָה
  choice: bewässern
  rationale: Der Hifil bezeichnet das Tränken beziehungsweise Versorgen mit Wasser; für ein Tal ist „bewässern“ präzise und idiomatisch.
- source_word: נַחַל הַשִּׁטִּים
  choice: das Schittimtal
  rationale: Die Wendung kann einen bekannten Ort bezeichnen. „Schittimtal“ bewahrt diese Möglichkeit; die ebenso mögliche botanische Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ wahrt den Unterschied zwischen Name und Herrschaftstitel.
- issue: Ortsname oder botanische Bezeichnung in הַשִּׁטִּים
  choice: Schittimtal
  alternative: Akaziental beziehungsweise Akazienwadi
  rationale: Die Form lässt sowohl die Auffassung als Ortsbezeichnung als auch die Ableitung von „Akazien“ zu. Der Haupttext bewahrt den möglichen Ortsnamen, während die Fußnote die lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Bildsprache. Die parallelen Zukunftsaussagen bleiben erhalten; vermeidbare Fachwörter werden nur in der Fußnote verwendet.
