  text: וִ/יהוּדָ֖ה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וִ/ירוּשָׁלִַ֖ם לְ/ד֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: de
  text: Doch Juda wird für immer bewohnt sein[a] und Jerusalem von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Juda wird für immer wohnen.“ Das hebräische Verb kann wörtlicher mit „wohnen“ oder „sitzen“ wiedergegeben werden; im Zusammenhang mit einem Land oder einer Stadt bedeutet es wahrscheinlich „bewohnt sein“ oder „bewohnt bleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוּדָה
  choice: Doch Juda
  rationale: Das einleitende Waw verbindet den Vers mit dem vorausgehenden Gericht über die feindlichen Völker und hat hier einen natürlichen kontrastiven Sinn. „Doch“ gibt diesen Zusammenhang im modernen Deutsch prägnant wieder.
- source_word: לְ/עוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier ein unbegrenztes Fortbestehen in die Zukunft; „für immer“ ist die natürliche und würdige deutsche Entsprechung.
- source_word: תֵּשֵׁב
  choice: wird bewohnt sein
  rationale: ישׁב kann wörtlich „sitzen“ oder „wohnen“ bedeuten, bezeichnet bei einem Land oder Gebiet jedoch häufig das Bewohntsein. Da Juda hier als Gebiet aufgefasst werden kann, ist „wird bewohnt sein“ sachgemäß; die mögliche personifizierende Wiedergabe bleibt in der Fußnote erhalten.
- source_word: וִ/ירוּשָׁלִַם
  choice: und Jerusalem
  rationale: Das zweite Waw verbindet die parallelen Aussagen additiv. Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: לְ/דֹור וָ/דֹור
  choice: von Generation zu Generation
  rationale: Die hebräische Wiederholungsformel bezeichnet ununterbrochene Fortdauer über aufeinanderfolgende Generationen hinweg. Die gewählte Formulierung bewahrt die Struktur und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Art und Zeithorizont der Verheißung für Juda und Jerusalem
  choice: Der Vers wird als unmittelbare prophetische Zusage dauerhaften Bewohntseins wiedergegeben, ohne die Art ihrer Erfüllung näher festzulegen.
  alternative: Die Aussage könnte ausschließlich geopolitisch-wörtlich oder vorrangig symbolisch beziehungsweise eschatologisch gedeutet werden.
  rationale: Der hebräische Text verheißt Juda und Jerusalem bleibende Zukunft, bestimmt jedoch nicht ausdrücklich den vollständigen Modus oder Horizont der Erfüllung. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger prophetischer Sprache. Die Parallelstruktur der beiden Halbverse und der Kontrast zum vorausgehenden Gericht bleiben erhalten.
