id: JOL.4.14
reference: Joel 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲמוֹנִ֣ים הֲמוֹנִ֔ים בְּ/עֵ֖מֶק הֶֽ/חָר֑וּץ כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה בְּ/עֵ֖מֶק הֶ/חָרֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: de
  text: Scharen, Scharen im Tal der Entscheidung[a]! Denn nahe ist der Tag Jahwes im Tal der Entscheidung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tal des Gerichts“ oder „Tal des Dreschens“. Das hebräische Wort bezeichnet etwas Entschiedenes oder Festgesetztes und kann zugleich an das Dreschen erinnern.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  choice: Scharen
  rationale: Das Substantiv im Plural bezeichnet große Menschenmengen. „Scharen“ ist im Deutschen anschaulich und würdevoll; die Wiederholung bewahrt die eindringliche rhetorische Wirkung des Hebräischen.
- source_word: בְּעֵמֶק
  choice: im Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal. „Im Tal“ gibt das konkrete räumliche Bild knapp und natürlich wieder.
- source_word: הֶחָרוּץ
  choice: der Entscheidung
  rationale: חָרוּץ kann auf etwas Entschiedenes oder Festgesetztes verweisen und zugleich Assoziationen an Schärfe beziehungsweise Dreschen wecken. „Entscheidung“ wahrt den Gedanken eines entscheidenden göttlichen Spruchs, ohne die Bildfülle auf eine einzige Deutung zu verengen.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für den vorausgehenden Ausruf ein. „Denn“ entspricht dieser Funktion in natürlichem prophetischem Deutsch.
- source_word: קָרוֹב
  choice: nahe ist
  rationale: Das Adjektiv sagt unmittelbare Nähe aus. Die vorangestellte Formulierung „nahe ist“ bewahrt den Nachdruck und klingt in diesem poetisch-prophetischen Kontext angemessen.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Die feste prophetische Wendung bezeichnet den Tag des göttlichen Eingreifens. „Der Tag Jahwes“ erhält sowohl die kanonische Formel als auch den persönlichen Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bedeutung von עֵמֶק הֶחָרוּץ
  choice: Tal der Entscheidung
  alternative: Tal des Gerichts; Tal des Dreschens
  rationale: Der Ausdruck kann den festgesetzten, entscheidenden Urteilsspruch bezeichnen und zugleich Gericht beziehungsweise Dreschen anklingen lassen. Der Haupttext wahrt mit „Entscheidung“ diese Spannung; die engeren möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. Die Wiederholung „Scharen, Scharen“ und die zweimalige Nennung des Tales bleiben als prägende Stilmittel des Ausgangstextes erhalten.
