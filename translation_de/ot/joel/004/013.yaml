source:
  edition: WLC
  text: שִׁלְח֣וּ מַגָּ֔ל כִּ֥י בָשַׁ֖ל קָצִ֑יר בֹּ֤אֽוּ רְדוּ֙ כִּֽי מָ֣לְאָה גַּ֔ת הֵשִׁ֨יקוּ֙ הַ/יְקָבִ֔ים כִּ֥י רַבָּ֖ה רָעָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: de
  text: Legt die Sichel an, denn die Ernte ist reif! Kommt, steigt hinab, denn die Kelter ist voll; die Kelterbecken laufen über, denn ihre Bosheit ist groß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: Legt die Sichel an
  rationale: Die wörtliche Wendung „sendet die Sichel“ bezeichnet den Einsatz der Sichel. „Legt die Sichel an“ gibt den Erntebefehl im Deutschen natürlich und bildkräftig wieder.
- source_word: בָשַׁל קָצִיר
  choice: die Ernte ist reif
  rationale: בשל bezeichnet hier das Reifsein der Ernte; die knappe deutsche Form bewahrt das Erntebild.
- source_word: בֹּאוּ רְדוּ
  choice: Kommt, steigt hinab
  rationale: Die masoretische Vokalisierung רְדוּ ist als „steigt hinab“ zu verstehen. Diese Wiedergabe bewahrt den überlieferten Wortlaut, statt ihn kontextbedingt zu „tretet“ umzudeuten.
- source_word: גַּת
  choice: Kelter
  rationale: Gemeint ist die Anlage beziehungsweise der Ort, an dem Trauben ausgepresst werden.
- source_word: הַיְקָבִים
  choice: die Kelterbecken
  rationale: Der Plural bezeichnet die Auffangbecken der Kelter; „Kelterbecken“ unterscheidet sie klar von der zuvor genannten Kelter.
- source_word: הֵשִׁיקוּ
  choice: laufen über
  rationale: Im Zusammenhang mit den vollen Kelterbecken drückt das Verb ein Überströmen beziehungsweise Überlaufen aus.
- source_word: רַבָּה רָעָתָם
  choice: ihre Bosheit ist groß
  rationale: רָעָה bezeichnet hier die moralische Schlechtigkeit der Gerichteten. „Bosheit“ macht diesen ethischen Sinn deutlich, ohne ihn weiter auszudeuten.
theological_decisions:
- issue: Gerichtsmetaphorik von Ernte und Kelter
  choice: Die Bilder bleiben ohne erklärenden Zusatz stehen.
  alternative: Die Ernte oder Kelter ausdrücklich mit dem göttlichen Gericht gleichsetzen.
  rationale: Der Vers stellt die Bilder und die große Bosheit unmittelbar nebeneinander, formuliert ihre Deutung aber nicht ausdrücklich. Die Übersetzung bewahrt diese poetische Spannung.
- issue: Deutung von רְדוּ im Kelterzusammenhang
  choice: „steigt hinab“ gemäß masoretischer Vokalisierung
  alternative: „tretet“ als kontextuelle Angleichung an das Keltern
  rationale: Obwohl „tretet“ gut zum Kelterbild passen würde, stützt der vorliegende vokalisierte hebräische Text „steigt hinab“. Die ungewöhnliche Formulierung wird nicht stillschweigend harmonisiert.
translation_notes:
  register: Knapp, eindringlich und würdevoll; die Imperative und die parallelen Begründungssätze erhalten den prophetischen Rhythmus. Moderne, allgemein verständliche Standardsprache ohne konfessionelle Zusätze.
