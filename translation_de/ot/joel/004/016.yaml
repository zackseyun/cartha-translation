id: JOL.4.16
reference: Joel 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: de
  text: Und Jahwe brüllt vom Zion her und lässt von Jerusalem her seine Stimme erschallen[a]. Himmel und Erde erbeben. Doch Jahwe ist eine Zuflucht für sein Volk und eine Festung für die Söhne Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gibt von Jerusalem her seine Stimme“; die hebräische Wendung bezeichnet eine laute, machtvolle Äußerung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein können auch „die Kinder Israels“ beziehungsweise „das Volk Israel“. Wörtlich steht im Hebräischen „die Söhne Israels“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; das vorangestellte ו verbindet den Vers mit dem Zusammenhang.
- source_word: מִצִּיּוֹן יִשְׁאָג
  choice: brüllt vom Zion her
  rationale: שׁאג bezeichnet das kraftvolle Brüllen, besonders eines Löwen. „Brüllt“ bewahrt dieses anschauliche Bild; „vom Zion her“ gibt Herkunft und Ausgangspunkt natürlich wieder.
- source_word: וּמִירוּשָׁלִַם יִתֵּן קוֹלוֹ
  choice: und lässt von Jerusalem her seine Stimme erschallen
  rationale: Die hebräische Wendung lautet wörtlich „gibt seine Stimme“ und meint eine machtvoll hörbare Äußerung. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt die akustische Wucht.
- source_word: וְרָעֲשׁוּ שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde erbeben
  rationale: רעשׁ bezeichnet heftiges Beben oder Erschüttertwerden. „Erbeben“ passt zur kosmischen Weite der beiden Subjekte und zum Gotteserscheinungsmotiv.
- source_word: מַחֲסֶה לְעַמּוֹ
  choice: eine Zuflucht für sein Volk
  rationale: מַחֲסֶה ist ein schützender Zufluchtsort; die ל-Konstruktion bezeichnet hier, wem dieser Schutz gilt.
- source_word: וּמָעוֹז
  choice: und eine Festung
  rationale: מָעוֹז kann einen befestigten Schutzort oder eine starke Schutzwehr bezeichnen. „Festung“ ergänzt „Zuflucht“ anschaulich, ohne die Schutzmetapher aufzulösen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt das grammatisch männliche בְּנֵי und die traditionelle Abstammungsbezeichnung; eine Fußnote nennt geläufigere sinngemäße Möglichkeiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name erkennbar wiedergegeben und nicht durch einen Titel ersetzt. Die im Deutschen übliche Form ist „Jahwe“.
- issue: Bildsprache des göttlichen Brüllens
  choice: brüllt
  alternative: donnert
  rationale: Das Verb שׁאג trägt die Bildwelt des Löwenbrüllens. „Donnert“ würde zwar die Lautstärke ausdrücken, aber das genuine Tierbild beseitigen.
- issue: Nationale und abstammungsbezogene Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels / Volk Israel
  rationale: Die Hauptfassung bleibt an der konkreten hebräischen Form. Die Wendung kann im Zusammenhang jedoch die Israeliten insgesamt bezeichnen; diese Bedeutung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger prophetischer Bildsprache. Die Parallelität von Zion/Jerusalem und Zuflucht/Festung bleibt erhalten; die schwer verständliche hebräische Lautäußerungsformel wird idiomatisch wiedergegeben und in der Fußnote transparent gemacht.
