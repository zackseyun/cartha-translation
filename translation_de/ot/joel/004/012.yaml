source:
  edition: WLC
  text: יֵע֨וֹרוּ֙ וְ/יַעֲל֣וּ הַ/גּוֹיִ֔ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט כִּ֣י שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט אֶת כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: de
  text: Die Völker sollen erwachen und zum Tal Joschafat[a] hinaufziehen; denn dort werde ich mich setzen, um alle Völker ringsum zu richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Joschafat spielt wahrscheinlich auf die Aussage »Der HERR richtet« an und unterstreicht so die Gerichtsszene.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעֹרוּ
  choice: sollen erwachen
  rationale: Die Jussivform ruft die Völker zum Handeln auf. »Erwachen« bewahrt das Bild des Aufgerütteltwerdens, statt es durch ein allgemeineres »sich aufmachen« einzuebnen.
- source_word: וְיַעֲלוּ
  choice: und ... hinaufziehen
  rationale: עלה bezeichnet eine Aufwärtsbewegung. »Hinaufziehen« ist im Zusammenhang einer versammelten Völkermenge natürlich und wahrt die räumliche Richtung zum Tal.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die fremden Nationen, die zum Gericht versammelt werden. »Völker« ist hier präziser und weniger traditionsgebunden als »Heiden«.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: das Tal Joschafat
  rationale: Der Name wird nach geläufiger deutscher biblischer Form transliteriert. Sein Anklang an das göttliche Richten wird in der Fußnote bewahrt.
- source_word: כִּי שָׁם
  choice: denn dort
  rationale: Die Wendung begründet die Aufforderung und verweist knapp auf den bestimmten Ort des Gerichts.
- source_word: אֵשֵׁב
  choice: werde ich mich setzen
  rationale: ישב kann auch »wohnen« bedeuten; zusammen mit »richten« bezeichnet es hier jedoch das Einnehmen des Richterplatzes. Die konkrete Sitzmetaphorik bleibt erhalten.
- source_word: לִשְׁפֹּט
  choice: um ... zu richten
  rationale: שפט bezeichnet in diesem Zusammenhang Gottes richterliches Handeln an den Völkern.
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: alle Völker ringsum
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit als auch den räumlichen Sinn von מסביב, ohne festzulegen, ob damit ausschließlich unmittelbare Nachbarvölker gemeint sind.
theological_decisions:
- issue: Wiedergabe des göttlich geprägten Ortsnamens יְהוֹשָׁפָט
  choice: Im Haupttext steht der Name »Joschafat«; seine Bedeutung wird in einer Fußnote erläutert.
  alternative: Den Namen im Haupttext als »Der HERR richtet« wiederzugeben.
  rationale: Die Transliteration wahrt den Eigennamen, während die Fußnote den für die Gerichtsszene bedeutsamen Wortanklang sichtbar macht, ohne Namen und Aussage gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffordernde Charakter der Jussivformen, die Bewegungsrichtung und das Bild Gottes, der seinen Richterplatz einnimmt, bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar beim Ortsnamen.
