  rationale: Die Revision beschränkt sich auf die deutsche Präposition bei der Aufwärtsbewegung zum Tal und auf eine stilistisch sowie etymologisch vorsichtigere Fußnotenformulierung. Aussage, Ambiguität und gerichtlicher Bildgehalt des hebräischen Textes bleiben erhalten.
