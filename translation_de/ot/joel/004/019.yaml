  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: de
  text: Ägypten wird zur Einöde und Edom zu einer öden Wüste, weil sie den Menschen von Juda[a] Gewalt antaten und in deren Land unschuldiges Blut[b] vergossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Judas“; die Wendung kann kollektiv die Bevölkerung Judas bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Blut Unschuldiger“. Hebräisch: „in ihrem Land“; der Bezug liegt im Zusammenhang am ehesten bei den Menschen von Juda, wird aber nicht ausdrücklich benannt.'
    reason: lexical_alternative; referential_ambiguity
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: Ägypten wird zur Einöde werden
  rationale: Die Verbindung von לְ mit שְׁמָמָה und היה bezeichnet den eintretenden Zustand; die substantivische Wiedergabe bewahrt die Bildkraft des hebräischen Ausdrucks.
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִּהְיֶה
  choice: und Edom zu einer öden Wüste
  rationale: מִדְבָּר bezeichnet eine Wüste beziehungsweise unbewohnte Wildnis; שְׁמָמָה kennzeichnet sie als verwüstet und verlassen. Im Deutschen gibt „öde Wüste“ beide Bestandteile natürlich wieder.
- source_word: מֵחֲמַס
  choice: weil … Gewalt angetan wurde
  rationale: מִן ist hier kausal zu verstehen. חָמָס bezeichnet Gewalt oder schweres Unrecht; die passive Formulierung stellt die Betroffenen im Deutschen klar heraus.
- source_word: בְּנֵי יְהוּדָה
  choice: den Menschen von Juda
  rationale: Die wörtliche Form lautet „Söhne Judas“, kann hier jedoch kollektiv die Bevölkerung Judas bezeichnen. „Menschen von Juda“ ist im modernen Deutsch verständlich und vermeidet eine unnötige Einschränkung auf männliche Einzelpersonen.
- source_word: אֲשֶׁר שָׁפְכוּ
  choice: und sie … vergossen haben
  rationale: Der Relativsatz benennt die konkrete Gewalttat. Das pluralische Verb bezieht sich im Zusammenhang am ehesten auf Ägypten und Edom; „sie“ bewahrt den knappen Bezug des Hebräischen.
- source_word: דָם נָקִיא
  choice: unschuldiges Blut
  rationale: Dies ist die geläufige und formnahe Wiedergabe der hebräischen Verbindung; sie kann sowohl Blut, das schuldlos vergossen wurde, als auch das Blut unschuldiger Menschen bezeichnen.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: Die Wiedergabe erhält das Possessivsuffix der dritten Person Plural und lässt dessen im Hebräischen nicht völlig eindeutigen Bezug bestehen.
theological_decisions:
- issue: Bezug des Possessivsuffixes in בְּאַרְצָם
  choice: „in ihrem Land“ im Haupttext, ohne den Bezug ausdrücklich festzulegen
  alternative: „im Land Judas“ beziehungsweise „in deren Land“; möglich ist auch ein Bezug auf Ägypten und Edom
  rationale: Der Zusammenhang legt das Land der Menschen von Juda nahe, doch die Form des hebräischen Pronomens benennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt diese begrenzte Mehrdeutigkeit, während die Fußnote die wahrscheinlichste Deutung nennt.
- issue: Bedeutung von דָם נָקִיא
  choice: „unschuldiges Blut“
  alternative: „das Blut Unschuldiger“
  rationale: Die gewählte Form ist idiomatisch und bewahrt die traditionelle, theologisch gewichtige Rede vom unschuldigen Blut, ohne die alternative inhaltliche Auffassung auszuschließen.
- issue: Kollektive Bedeutung von בְּנֵי יְהוּדָה
  choice: „Menschen von Juda“
  alternative: wörtlich „Söhne Judas“
  rationale: Im Kontext bezeichnet die Wendung wahrscheinlich das Volk beziehungsweise die Bevölkerung Judas. Die inklusive kollektive Wiedergabe importiert keine zusätzliche theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Ursache-Folge-Zusammenhang, während „Menschen von Juda“ die kollektiv gebrauchte Herkunftsbezeichnung für heutige Leser natürlich wiedergibt. Die Wiederholung von „werden“ wird nur dort ausgesprochen, wo sie im Deutschen für Klarheit nötig ist.
