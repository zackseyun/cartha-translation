  terminology: „Edom“, „Einöde“, „öde Wüste“, „Gewalt“, „unschuldiges Blut“ und „Juda“ sind angemessen. „Menschen von Juda“ ist als kollektive Wiedergabe möglich; die Fußnote sichert die wörtliche Form ab. Für den Ortsbezug ist „deren Land“ im Deutschen erforderlich, damit nicht fälschlich Ägypten und Edom als Besitzer des Landes verstanden werden; die begrenzte hebräische Diskussion wird in der Fußnote dokumentiert.
