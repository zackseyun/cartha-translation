  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: de
  text: Und ich werde ihr Blut rächen, das ich noch nicht gerächt habe[a]. Und Jahwe wohnt in Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihr Blut nicht ungestraft lassen.“ Im Hebräischen wird dasselbe Verb mit einer Verneinung wiederholt; die Formulierung kann sowohl die Rache für das vergossene Blut als auch das Nicht-ungestraft-Lassen ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: Und ich werde … rächen
  rationale: נקה ist hier im Piel mit „Blut“ und im Zusammenhang des Gerichts über die Völker idiomatisch als Ahndung des vergossenen Blutes zu verstehen. „Rächen“ gibt diesen gerichtlichen Sinn natürlich wieder, ohne die schwierigere hebräische Formulierung zu verschleiern.
- source_word: דָּמָם
  choice: ihr Blut
  rationale: Die wörtliche Wiedergabe bewahrt sowohl den Bezug auf das vergossene Blut als auch den damit verbundenen Gedanken der Blutschuld.
- source_word: לֹא נִקֵּיתִי
  choice: das ich noch nicht gerächt habe
  rationale: Die Wiederholung desselben Verbs mit Verneinung wird als Rückbezug auf bislang nicht vollzogene Vergeltung verstanden. „Noch“ macht den zeitlichen Gegensatz im Deutschen verständlich, ohne die alternative idiomatische Deutung auszuschließen; diese wird in der Fußnote genannt.
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Der Eigenname יהוה wird als „Jahwe“ wiedergegeben, sodass der Personenname im Ausgangstext erkennbar bleibt.
- source_word: שֹׁכֵן
  choice: wohnt
  rationale: Das Partizip bezeichnet ein andauerndes Wohnen beziehungsweise Gegenwärtigsein. „Wohnt“ ist natürlich, würdig und bewahrt diesen durativen Sinn.
- source_word: בְּצִיּוֹן
  choice: auf dem Zion
  rationale: Bei der als Berg und Heiligtumsort verstandenen Ortsbezeichnung ist „auf dem Zion“ im Deutschen idiomatisch und entspricht dem räumlichen Sinn der Präposition ב in diesem Zusammenhang.
theological_decisions:
- issue: Bedeutung von נקה mit „Blut“ im Gerichtskontext
  choice: Gott rächt beziehungsweise ahndet das vergossene Blut seines Volkes.
  alternative: Gott reinigt von Blutschuld oder spricht jemanden schuldlos.
  rationale: Der unmittelbare Kontext handelt vom Gericht über feindliche Völker und von der Wiederherstellung Judas und Jerusalems. Die Wiedergabe mit „rächen“ bringt die gerichtliche Ahndung zur Geltung, ohne einen rituellen Reinigungsvorgang oder einen Freispruch nahezulegen.
- issue: Verhältnis der wiederholten Verbformen וְנִקֵּיתִי … לֹא נִקֵּיתִי
  choice: 'Eine bisher ausgebliebene Vergeltung wird nun angekündigt: „das ich noch nicht gerächt habe“.'
  alternative: 'Idiomatich verstärkte Zusage: „Ich werde ihr Blut nicht ungestraft lassen.“'
  rationale: Das Hebräische ist knapp und mehrdeutig. Der Haupttext erhält die auffällige Wiederholung und den möglichen zeitlichen Gegensatz; die Fußnote bewahrt die ebenso plausible Deutung als Zusage, die Bluttat keinesfalls ungestraft zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante hebräische Wiederholung bleibt im Haupttext hörbar; die echte semantische Mehrdeutigkeit wird durch die Fußnote offengehalten. Der kurze abschließende Satz wird zur Wahrung seiner feierlichen Eigenständigkeit separat wiedergegeben.
