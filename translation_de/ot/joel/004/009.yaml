base_translation:
  language: en
  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
translation:
  language: de
  text: 'Ruft dies unter den Völkern aus:


    Heiligt den Krieg![a]


    Rüttelt die Krieger auf!


    Alle Kriegsmänner sollen herankommen,


    sie sollen heraufziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rüstet zum Krieg.“ Im Hebräischen steht wörtlich „Heiligt den Krieg“; dabei wird kultische Sprache für die Aussonderung und Vorbereitung zum Kampf gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת
  choice: Ruft dies … aus
  rationale: Der pluralische Imperativ קִרְאוּ bezeichnet hier eine öffentliche Bekanntmachung. „Ausrufen“ gibt den feierlichen Aufruf wieder; זֹאת bleibt als schlichtes „dies“ erhalten.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die fremden Völker. „Unter den Völkern“ ist im Deutschen idiomatisch und vermeidet die neutestamentlich geprägte Bezeichnung „Heiden“.
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: Heiligt den Krieg
  rationale: קדשׁ bedeutet, etwas auszusondern beziehungsweise zu heiligen. Die ungewöhnliche kultische Ausdrucksweise wird bewahrt, statt sie im Haupttext auf bloße Kriegsvorbereitung zu reduzieren.
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: Weckt die Krieger auf
  rationale: Die Kausativform von עור fordert dazu auf, die Kämpfer aufzurütteln. „Krieger“ gibt den militärischen Sinn von גִּבּוֹרִים klarer wieder als „Helden“ oder „Mächtige“.
- source_word: יִגְּשׁוּ
  choice: sollen herankommen
  rationale: Die imperfektive Form hat in der Reihe von Aufforderungen jussivischen Sinn. „Herankommen“ bewahrt sowohl die Annäherung als auch den feierlichen Sammelruf.
- source_word: יַעֲלוּ
  choice: sie sollen heraufziehen
  rationale: עלה bezeichnet wörtlich eine Bewegung hinauf. „Heraufziehen“ erhält das Richtungsbild und passt zugleich zum militärischen Aufmarsch, ohne es lediglich als „angreifen“ auszudeuten.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Kriegsmänner
  rationale: Die ausdrücklich maskuline militärische Wendung wird mit dem im heutigen Deutsch noch verständlichen, bewusst gehobenen „Kriegsmänner“ knapp wiedergegeben.
theological_decisions:
- issue: Kultische Bedeutung von קדשׁ im Kriegsaufruf
  choice: Heiligt den Krieg
  alternative: Bereitet euch zum Krieg vor
  rationale: Der Kontext erlaubt eine idiomatische Bedeutung im Sinn der Kriegsvorbereitung, doch das Verb קדשׁ trägt eine kultische Bedeutung des Heiligens beziehungsweise Aussonderns. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die funktionale Alternative.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst gehobenen militärisch-prophetischen Formulierungen. Die kurzen Aufforderungssätze bilden den drängenden Rhythmus des hebräischen Aufrufs nach; „Kriegsmänner“ ist markiert, aber verständlich und bewahrt die ausdrücklich männliche Bezeichnung des Ausgangstextes.
