id: JOL.4.1
reference: Joel 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֗י הִנֵּ֛ה בַּ/יָּמִ֥ים הָ/הֵ֖מָּה וּ/בָ/עֵ֣ת הַ/הִ֑יא אֲשֶׁ֥ר אשוב אֶת שְׁב֥וּת יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/001.yaml
  text: For behold[a], in those days and at that time, when I restore the fortunes of Judah and Jerusalem,
translation:
  language: de
  text: 'Denn seht: In jenen Tagen und zu jener Zeit, wenn ich das Geschick Judas und Jerusalems wende[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich die Gefangenen Judas und Jerusalems zurückbringe“. Der hebräische Ausdruck bezeichnet die Wiederherstellung eines Volkes aus seiner Not; häufig ist dabei die Rückkehr aus der Verbannung mitgemeint.'
    reason: 'Lexikalische Alternative: Die hebräische Wendung lässt sowohl eine allgemeinere Wiederherstellung als auch eine konkret auf Gefangenschaft und Rückkehr bezogene Wiedergabe zu.'
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert das zuvor Gesagte und bleibt deshalb ausdrücklich erhalten.
- source_word: הִנֵּה
  choice: seht
  rationale: Die Aufmerksamkeitspartikel hebt das angekündigte Geschehen hervor. „Seht“ klingt im heutigen Deutsch natürlicher als das formelhafte „siehe“, ohne den prophetischen Nachdruck aufzugeben.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: in jenen Tagen
  rationale: Die geläufige Zeitangabe verweist auf den bereits prophetisch angekündigten künftigen Zeitraum.
- source_word: וּבָעֵת הַהִיא
  choice: und zu jener Zeit
  rationale: Die parallele Zeitbestimmung und ihre verstärkende Wirkung bleiben erhalten.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Das Relativwort leitet hier sinngemäß einen temporalen Nebensatz ein.
- source_word: אשוב אֶת שְׁבוּת
  choice: ich das Geschick … wende
  rationale: Die Verbindung mit שְׁבוּת ist eine feste Wendung für die Umkehr einer Notlage beziehungsweise die Wiederherstellung; „das Geschick wenden“ gibt sie im Deutschen idiomatisch wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Übliche deutsche Form des Landes- und Volksnamens.
- source_word: וִירוּשָׁלִָם
  choice: und Jerusalem
  rationale: Übliche deutsche Form des Stadtnamens; Juda und Jerusalem stehen gemeinsam unter der angekündigten Wiederherstellung.
theological_decisions:
- issue: Bedeutung der Wendung שׁוּב אֶת־שְׁבוּת
  choice: „das Geschick Judas und Jerusalems wenden“ im Haupttext
  alternative: „die Gefangenen Judas und Jerusalems zurückbringen“ beziehungsweise „die Gefangenschaft Judas und Jerusalems wenden“
  rationale: Die hebräische Wendung kann allgemein die Umkehr von Not und die Wiederherstellung bezeichnen, trägt hier aber zugleich den geschichtlichen Hintergrund von Gefangenschaft und Rückkehr. Der Haupttext gibt den idiomatischen Sinn wieder; die Fußnote bewahrt den engeren exilbezogenen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „seht“ macht die aufmerksamkeitslenkende Funktion von הִנֵּה deutlich. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
