  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die hebräische Anklage vollständig wieder: die parallelen Gruppenbezeichnungen für Juda und Jerusalem, das Verkaufen an die Griechen, den Zweckausdruck und die bewirkte große Entfernung vom eigenen Gebiet. „Gebiet“ ist für גְּבוּל in diesem Zusammenhang eine gut vertretbare, idiomatische Wahl; die konkretere Alternative „Grenze“ ist sachgerecht vermerkt.'
  naturalness: Modernes, würdiges Standarddeutsch. Die vorangestellte Doppelgruppe und die Wiederholung von „Söhne“ sind bewusst formal und im biblisch-prophetischen Register gut verständlich. „Um sie weit weg von ihrem Gebiet zu bringen“ formuliert Zweck und Kausativ natürlich.
  terminology: „Juda“, „Jerusalem“ und „Griechen“ sind etablierte deutsche Formen. Die Fußnote zu „Söhne der Griechen“ dokumentiert die im Deutschen nicht idiomatisch übernommene hebräische Konstruktion angemessen. Die Angabe „Ionier“ beziehungsweise „Nachkommen Jawans“ hält die mögliche Bezeichnungstradition fest, ohne sie dem Text aufzuzwingen.
