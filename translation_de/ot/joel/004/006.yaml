id: JOL.4.6
reference: Joel 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֤י יְהוּדָה֙ וּ/בְנֵ֣י יְרוּשָׁלִַ֔ם מְכַרְתֶּ֖ם לִ/בְנֵ֣י הַ/יְּוָנִ֑ים לְמַ֥עַן הַרְחִיקָ֖/ם מֵ/עַ֥ל גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: de
  text: Und die Söhne Judas und die Söhne Jerusalems habt ihr an die Griechen[a] verkauft, um sie weit weg von ihrem Gebiet[b] zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an die Söhne der Griechen“; יְוָנִים kann auch „Ionier“ beziehungsweise „Nachkommen Jawans“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weit weg von ihrer Grenze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: Und die Söhne Judas und die Söhne Jerusalems
  rationale: Die Wiedergabe bewahrt die zweimalige hebräische Zugehörigkeitsformel mit בְּנֵי und ihre parallele Struktur. „Söhne“ ist formal näher am Ausgangstext als „Bewohner“ oder „Menschen“, auch wenn die Bezeichnung kollektiv die Angehörigen Judas und Jerusalems meint.
- source_word: מְכַרְתֶּם
  choice: habt ihr … verkauft
  rationale: Das Qal-Perfekt der 2. Person Plural bezeichnet die vollzogene Handlung, die als direkte Anklage formuliert wird. Das deutsche Perfekt klingt in gegenwärtiger Standardsprache natürlich und nachdrücklich.
- source_word: לִבְנֵי הַיְּוָנִים
  choice: an die Griechen
  rationale: יְוָנִים bezeichnet hier Griechen beziehungsweise Ionier. Die idiomatische deutsche Volksbezeichnung vermeidet das missverständliche „Söhne der Griechen“; die wörtlichere Form wird in einer Fußnote dokumentiert.
- source_word: לְמַעַן הַרְחִיקָם
  choice: um sie weit weg … zu bringen
  rationale: לְמַעַן kennzeichnet den Zweck, und der Hifil von רחק drückt aus, dass jemand in große Entfernung gebracht wird. Die Formulierung gibt sowohl Absicht als auch Kausativität natürlich wieder.
- source_word: מֵעַל גְּבוּלָם
  choice: von ihrem Gebiet
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Territorium bedeuten. Im Zusammenhang mit Verschleppung bezeichnet „Gebiet“ am natürlichsten den Raum, aus dem die Menschen weit entfernt werden; „Grenze“ bleibt als formale Alternative in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Ausdruck „Söhne Judas … Söhne Jerusalems“ bewahrt die markante hebräische Form, während „an die Griechen“ und „von ihrem Gebiet“ im Deutschen idiomatisch wiedergegeben werden.
