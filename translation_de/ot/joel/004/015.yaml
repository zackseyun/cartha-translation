base_translation:
  language: en
  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: de
  text: Sonne und Mond verfinstern sich, und die Sterne ziehen ihren Glanz zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und die Sterne sammeln ihren Glanz ein“, das heißt, sie halten ihr Licht zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ
  choice: Sonne
  rationale: Die übliche deutsche Wiedergabe des Himmelskörpers; in der festen Paarung „Sonne und Mond“ ist der artikellose Gebrauch natürlich und poetisch knapp.
- source_word: וְיָרֵחַ
  choice: und Mond
  rationale: Die übliche Wiedergabe von יָרֵחַ; zusammen mit „Sonne“ bildet sie eine geläufige deutsche Wortverbindung.
- source_word: קָדָרוּ
  choice: verfinstern sich
  rationale: Das Qal Perfekt Plural von קדר bezeichnet hier das Dunkelwerden. „Verfinstern sich“ bewahrt den inchoativen Sinn, ohne einen ausdrücklich genannten Verursacher einzuführen.
- source_word: וְכוֹכָבִים
  choice: und die Sterne
  rationale: Direkte Wiedergabe des Plurals; der bestimmte Artikel entspricht dem natürlichen deutschen Ausdruck in dieser kosmischen Szene.
- source_word: אָסְפוּ
  choice: ziehen … zurück
  rationale: אסף bedeutet grundsätzlich „sammeln/einziehen“. In Verbindung mit „ihren Glanz“ gibt „zurückziehen“ idiomatisch wieder, dass die Sterne ihr Leuchten einhalten, und lässt das Bild des Einziehens erkennen.
- source_word: נָגְהָם
  choice: ihren Glanz
  rationale: נֹגַהּ bezeichnet Helligkeit, Lichtglanz oder Strahlen. „Glanz“ ist prägnant, poetisch angemessen und bezieht sich natürlich auf Sterne.
theological_decisions:
- issue: Kosmische Verdunkelung als prophetisches Gerichtsbild
  choice: Die kosmischen Vorgänge werden ohne weitere Deutung unmittelbar wiedergegeben.
  alternative: Die Verdunkelung ausdrücklich als buchstäbliches astronomisches Ereignis, als bloße Metapher oder als apokalyptisches Symbol kennzeichnen.
  rationale: Der hebräische Text bleibt knapp und deutet die Art des Geschehens nicht näher. Die Übersetzung bewahrt daher die Spannung zwischen wörtlicher, bildlicher und apokalyptisch-symbolischer Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Die Wortwahl folgt dem hebräischen Bild und vermeidet eine konfessionelle oder naturkundliche Festlegung.
