  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: de
  text: Seht[a], ich werde sie aus dem Ort aufrütteln, wohin ihr sie verkauft habt, und eure Vergeltung auf euren eigenen Kopf zurückfallen lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ich“ oder „Ja, ich“. Der hebräische Ausdruck leitet eine nachdrückliche göttliche Ankündigung ein; das Verb kann auch „aufwecken“ oder „in Bewegung setzen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß: „Ich werde es euch vergelten“; wörtlich steht hier das Bild, dass eure Vergeltung auf euren Kopf zurückkehrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: Bewahrt die aufmerksamkeitslenkende und feierliche Kraft der hebräischen Präsentativform in verständlichem, gegenwärtigem Deutsch.
- source_word: מְעִירָם
  choice: ich wecke sie auf
  rationale: Das Hifil von עור bezeichnet ein Aufwecken, Aufrütteln oder In-Bewegung-Setzen. „Wecke … auf“ wahrt das Bild, ohne die Handlung auf innere Erregung oder militärische Mobilisierung einzuengen.
- source_word: מִן הַמָּקוֹם
  choice: an dem Ort
  rationale: Mit „aufwecken an dem Ort“ wird der Ausgangsort idiomatisch ausgedrückt; die Bewegung von dort weg ergibt sich aus Verb und Zusammenhang.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: wohin ihr sie verkauft habt
  rationale: Das Richtungsadverb שָׁמָּה wird durch „wohin“ ausdrücklich wiedergegeben.
- source_word: וַהֲשִׁבֹתִי
  choice: lasse … zurückfallen
  rationale: Gibt das kausative Zurückkehrenlassen natürlich wieder und erhält zugleich das konkrete Bild einer auf die Täter zurückkommenden Vergeltung.
- source_word: גְמֻלְכֶם
  choice: eure Vergeltung
  rationale: Bezeichnet die erwidernde Folge des eigenen Handelns und trägt hier eine deutlich retributive, nicht bloß kommerzielle Bedeutung.
- source_word: בְּרֹאשְׁכֶם
  choice: auf euren eigenen Kopf
  rationale: Bewahrt die konkrete hebräische Redewendung und macht ihren rückbezüglichen Sinn im Deutschen klar.
theological_decisions:
- issue: Art des göttlichen Handelns in מְעִירָם
  choice: Gott setzt die Verkauften an ihrem Aufenthaltsort wieder in Bewegung.
  alternative: Gott weckt sie lediglich innerlich auf oder mobilisiert sie ausdrücklich zum Krieg.
  rationale: Das Verb lässt mehrere Arten des Aufrüttelns zu. Der Zusammenhang weist auf ein Herausführen aus dem Ort hin, wohin sie verkauft wurden, ohne die Handlung psychologisch oder militärisch festzulegen.
- issue: Aussagekraft von גְמֻלְכֶם בְּרֹאשְׁכֶם
  choice: Die Vergeltung für das Handeln der Täter fällt auf sie selbst zurück.
  alternative: Eine verallgemeinernde Wiedergabe wie „ich werde euch bestrafen“.
  rationale: Die konkrete Bildsprache des Hebräischen betont die Entsprechung zwischen Tat und Vergeltung und sollte nicht zu einem allgemeinen Strafwort verflacht werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Aufwecken und zurückfallender Vergeltung bleibt erhalten; ungebräuchliches „siehe“ und das schwerfällige „eure Vergeltung zurückbringen“ werden vermieden.
