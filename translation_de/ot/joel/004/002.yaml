id: JOL.4.2
reference: Joel 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: de
  text: Ich werde alle Völker versammeln und sie ins Tal Joschafat[a] hinabführen. Dort werde ich mit ihnen ins Gericht gehen wegen meines Volkes und meines Erbteils Israel[b], das sie unter die Völker zerstreut haben; und mein Land haben sie aufgeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Joschafat“ ist hier ein Ortsname. Der Name kann zugleich an die Bedeutung „Der HERR richtet“ erinnern.
    reason: cultural_note
  - marker: b
    text: 'Oder: „zugunsten meines Volkes und meines Erbteils Israel“ beziehungsweise „in der Sache meines Volkes und meines Erbteils Israel“. Die hebräische Präposition kann in diesem gerichtlichen Zusammenhang mehrere eng verwandte Bedeutungen haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִבַּצְתִּי אֶת כָּל הַגּוֹיִם
  choice: Ich werde alle Völker versammeln
  rationale: קבץ bezeichnet das Sammeln oder Zusammenrufen; גּוֹיִם meint hier die fremden Völker insgesamt. „Völker versammeln“ ist quellennah und im Deutschen natürlich.
- source_word: וְהוֹרַדְתִּים
  choice: und sie … hinabführen
  rationale: Der Hifil von ירד hat kausative Bedeutung. „Hinabführen“ bewahrt die gerichtete Bewegung ins Tal und klingt würdiger als eine rein mechanische Umschreibung.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: Tal Joschafat
  rationale: Die Wortgruppe wird als Ortsname wiedergegeben. Die mögliche sprechende Bedeutung des Namens wird in einer Fußnote erläutert, nicht in den Text hineingedeutet.
- source_word: וְנִשְׁפַּטְתִּי עִמָּם שָׁם
  choice: Dort werde ich mit ihnen ins Gericht gehen
  rationale: Der Nifal von שפט mit עִם bezeichnet hier ein gerichtliches Verfahren beziehungsweise einen Rechtsstreit. „Mit ihnen ins Gericht gehen“ erhält diese forensische Nuance.
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: wegen meines Volkes und meines Erbteils Israel
  rationale: עַל kann in diesem Zusammenhang Grund, Bezug oder Eintreten zugunsten einer Partei ausdrücken. „Wegen“ lässt den Anlass des Gerichts erkennen, ohne die eng verwandten Deutungen völlig festzulegen. „Erbteil“ bewahrt die bundestheologische und besitzrechtliche Prägung von נַחֲלָה.
- source_word: אֲשֶׁר פִּזְּרוּ בַגּוֹיִם
  choice: das sie unter die Völker zerstreut haben
  rationale: Das Relativpronomen bezieht sich im Hebräischen auf Israel. „Unter die Völker zerstreuen“ gibt das Exilmotiv klar und quellennah wieder.
- source_word: וְאֶת אַרְצִי חִלֵּקוּ
  choice: und mein Land haben sie aufgeteilt
  rationale: Der Piel von חלק bezeichnet das Teilen beziehungsweise Aufteilen. Die vorangestellte Formulierung „mein Land“ wird durch die deutsche Satzstellung hervorgehoben.
theological_decisions:
- issue: Bundestheologische Bedeutung von נַחֲלָתִי
  choice: mein Erbteil
  alternative: mein Erbe; mein Besitz
  rationale: „Erbteil“ wahrt die biblische Vorstellung, dass Israel in besonderer Weise JHWH zugehört, ohne eine konfessionelle Zusatzdeutung einzuführen.
- issue: Bedeutung von עַל in der Gerichtsaussage
  choice: wegen meines Volkes und meines Erbteils Israel
  alternative: zugunsten meines Volkes und meines Erbteils Israel; über mein Volk und mein Erbteil Israel
  rationale: Die Präposition kann den Grund oder Gegenstand des Rechtsstreits und zugleich das Eintreten für Israel anzeigen. Die Hauptfassung benennt den Anlass; die Fußnote bewahrt die echte semantische Spannweite.
- issue: Bezeichnung des Tals Joschafat
  choice: Ortsname mit erläuternder Fußnote
  alternative: Tal, in dem der HERR richtet
  rationale: Der hebräische Text bietet einen Eigennamen. Seine mögliche theologische Wortwirkung wird erläutert, aber nicht an die Stelle des Namens gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die forensische Wendung „ins Gericht gehen“ erhält den Rechtsstreitcharakter des Hebräischen; „Erbteil“ bewahrt einen zentralen biblischen Begriff. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Textstelle.
