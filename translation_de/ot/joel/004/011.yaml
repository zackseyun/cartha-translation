source:
  edition: WLC
  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: de
  text: Eilt[a] und kommt, all ihr Völker von ringsum, und versammelt euch dort! Lass deine Mächtigen[b] herabsteigen, Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Beeilt euch und kommt …« Die seltene hebräische Form wird hier als Aufforderung zur Eile verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sende deine Krieger herab.« Das hebräische Wort bezeichnet mächtige Personen oder Wesen, ohne ausdrücklich zu sagen, ob menschliche oder himmlische Kräfte gemeint sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: Eilt
  rationale: Die seltene Imperativform wird im Zusammenhang als Aufforderung zu raschem Handeln verstanden. »Eilt« gibt die Dringlichkeit knapp und würdig wieder, ohne eine übermäßig freie Deutung einzuführen.
- source_word: וָבֹ֧אוּ
  choice: und kommt
  rationale: Der Imperativ von בוא bedeutet »kommen«. Das verbindende »und« bewahrt die Abfolge und den eindringlichen Rhythmus des hebräischen Aufrufs.
- source_word: כָֽל־הַגּוֹיִ֛ם
  choice: all ihr Völker
  rationale: Im Zusammenhang richtet sich die Aufforderung unmittelbar an die Völker. Die deutsche Anrede »all ihr Völker« macht diesen vokativischen Sinn deutlich.
- source_word: מִסָּבִ֖יב
  choice: ringsum
  rationale: Das Wort bezeichnet die Herkunft aus allen umliegenden Richtungen. »Ringsum« ist prägnant und erhält das Bild der von allen Seiten zusammenströmenden Völker.
- source_word: וְנִקְבָּ֑צוּ
  choice: und versammelt euch
  rationale: Die Niphal-Form trägt eine passive beziehungsweise reflexive Färbung, fungiert hier aber als Aufforderung. »Versammelt euch« ist im Deutschen natürlich und bewahrt den reflexiven Zug.
- source_word: שָׁ֕מָּה
  choice: dort
  rationale: Das Richtungsadverb verweist auf den zuvor bestimmten Ort. »Dort« gibt dies schlicht und genau wieder.
- source_word: הַֽנְחַ֥ת
  choice: Lass … herabsteigen
  rationale: Der Hiphil-Imperativ bezeichnet ein Veranlassen des Herabkommens. Die deutsche Konstruktion bewahrt sowohl den kausativen Sinn als auch die räumliche Bewegung nach unten.
- source_word: יְהוָ֖ה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: גִּבּוֹרֶֽיךָ
  choice: deine Mächtigen
  rationale: גִּבּוֹרִים kann mächtige Männer, Helden oder Krieger bezeichnen. »Deine Mächtigen« lässt offen, ob menschliche oder himmlische Machtträger gemeint sind.
theological_decisions:
- issue: Identität der »Mächtigen« Jahwes
  choice: deine Mächtigen
  alternative: deine Krieger; deine Helden; deine himmlischen Heerscharen
  rationale: Der hebräische Ausdruck benennt mächtige Wesen oder Personen, die Jahwe zugeordnet sind, legt aber nicht ausdrücklich fest, ob sie menschlich oder himmlisch sind. Die allgemeinere Wiedergabe erhält diese Offenheit.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname יהוה. »Jahwe« gibt ihn als Namen wieder, während »der HERR« ihn durch einen traditionellen Ersatztitel ersetzen würde.
translation_notes:
  register: Moderne, verständliche Standardsprache mit feierlich-eindringlichem Ton. Die direkte Anrede der Völker und der abschließende Ruf an Jahwe bleiben erhalten; Ausrufezeichen bilden die Dringlichkeit der Imperative ab.
