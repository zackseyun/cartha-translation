language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֤תּוּ אִתֵּי/כֶם֙ לַֽ/חֲרָב֔וֹת וּ/מַזְמְרֹֽתֵי/כֶ֖ם לִ/רְמָחִ֑ים הַֽ/חַלָּ֔שׁ יֹאמַ֖ר גִּבּ֥וֹר אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: de
  text: 'Schmiedet eure Pflugscharen zu Schwertern[a] und eure Winzermesser zu Speeren! Der Schwache soll sagen[b]: »Ich bin ein Krieger.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dies kehrt das Bild aus Jesaja 2,4 und Micha 4,3 um, wo Waffen zu Ackergeräten geschmiedet werden.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Ich bin mächtig« bzw. »Ich bin stark.« Das hebräische גִּבּוֹר kann einen mächtigen oder starken Mann sowie einen Krieger bezeichnen; hier spricht der militärische Zusammenhang für »Krieger«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: Schmiedet
  rationale: Der Pluralimperativ von כתת bezeichnet das Hämmern bzw. Bearbeiten von Metall. »Schmiedet« gibt den konkreten Umformungsvorgang im heutigen Deutsch natürlich wieder.
- source_word: אִתֵּיכֶם
  choice: eure Pflugscharen
  rationale: Das Substantiv bezeichnet Geräte zum Pflügen oder Bearbeiten des Bodens. »Pflugscharen« wahrt zudem den erkennbaren Bezug auf Jesaja 2,4 und Micha 4,3.
- source_word: לַחֲרָבוֹת
  choice: zu Schwertern
  rationale: Die Präposition ל bezeichnet hier das Ergebnis der Umformung; »zu Schwertern« ist im Deutschen idiomatisch.
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: und eure Winzermesser
  rationale: Das Wort bezeichnet Schneidegeräte zur Pflege von Reben oder anderen Pflanzen. »Winzermesser« ist ein verständlicher deutscher Ausdruck und passt zum weinbaulichen Hintergrund.
- source_word: לִרְמָחִים
  choice: zu Speeren
  rationale: רמח bezeichnet einen Speer oder eine Lanze; »Speere« ist allgemein verständlich und passt zum militärischen Zusammenhang.
- source_word: הַחַלָּשׁ
  choice: der Schwache
  rationale: Das substantivierte Adjektiv steht im repräsentativen Singular und bezeichnet einen schwachen oder kraftlosen Menschen.
- source_word: יֹאמַר
  choice: soll sagen
  rationale: Die Imperfektform setzt die auffordernde Folge der vorangehenden Imperative fort. »Soll sagen« bewahrt diesen exhortativen Sinn.
- source_word: גִּבּוֹר
  choice: ein Krieger
  rationale: גבור kann einen starken oder mächtigen Mann, besonders aber einen kampferprobten Krieger bezeichnen. Im Aufrüstungskontext ist »Krieger« die naheliegende Wiedergabe.
- source_word: אָנִי
  choice: Ich bin
  rationale: Das ausdrücklich gesetzte Pronomen betont die Selbstaussage; im Deutschen wird die Kopula ergänzt.
theological_decisions:
- issue: Umkehrung der Friedensvision aus Jesaja 2,4 und Micha 4,3
  choice: Die vertrauten landwirtschaftlichen Geräte und Waffen werden so wiedergegeben, dass die bewusste Umkehrung der Friedensvision sichtbar bleibt.
  alternative: Die Zeile ohne erkennbaren sprachlichen Bezug auf die früheren prophetischen Bilder wiedergeben.
  rationale: Der hebräische Wortlaut kehrt die bekannte Bewegung von Waffen zu Ackergeräten ausdrücklich um. Die Übersetzung erhält diese Spannung als Aufruf zur Bewaffnung im Gerichtskontext, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ »Schmiedet« ist kräftig und konkret; der repräsentative Singular »der Schwache« und die knappe direkte Rede bewahren die Form des Hebräischen. Sämtliche Fußnotenmarker stehen im Haupttext.
