base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: de
  text: Und ich werde eure Söhne und eure Töchter in die Gewalt der Judäer verkaufen. Sie werden sie an die Sabäer[a] verkaufen, an ein fernes Volk. Denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Sabäer waren die Menschen aus Saba (Scheba).
    reason: cultural_note
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: Und ich werde … verkaufen
  rationale: Das Qal von מכר bedeutet hier „verkaufen“. Die Formulierung bewahrt die wirtschaftlich-rechtliche Umkehrung des zuvor geschilderten Unrechts und mildert sie nicht zu „ausliefern“ ab.
- source_word: בְּנֵיכֶם וְאֶת בְּנוֹתֵיכֶם
  choice: eure Söhne und eure Töchter
  rationale: Der hebräische Text nennt männliche und weibliche Nachkommen ausdrücklich getrennt; diese Unterscheidung bleibt erhalten.
- source_word: בְּיַד
  choice: in die Gewalt
  rationale: Wörtlich steht „in die Hand“. In dieser Wendung bezeichnet יָד die Verfügungsgewalt; „in die Gewalt“ gibt den Sinn im heutigen Deutsch klar wieder, ohne die Härte des Vorgangs abzuschwächen.
- source_word: בְּנֵי יְהוּדָה
  choice: die Söhne Judas
  rationale: Die Wiedergabe bewahrt die hebräische Abstammungs- und Volksbezeichnung. Gemeint sind die Angehörigen des Volkes Juda, nicht nur unmittelbare leibliche Söhne des Stammvaters.
- source_word: וּמְכָרוּם
  choice: Sie werden sie … verkaufen
  rationale: Dasselbe Verb מכר wird wie zuvor mit „verkaufen“ wiedergegeben. Das Objektsuffix bezieht sich auf die genannten Söhne und Töchter.
- source_word: לִשְׁבָאִים
  choice: an die Sabäer
  rationale: Die Form bezeichnet die Menschen aus Saba beziehungsweise Scheba. „Sabäer“ ist die präzise deutsche Volksbezeichnung.
- source_word: אֶל גּוֹי רָחוֹק
  choice: an ein fernes Volk
  rationale: גּוֹי kann „Volk“ oder „Nation“ bedeuten, רָחוֹק „fern“. „Ein fernes Volk“ ist natürliches Deutsch und erhält die Vorstellung großer Entfernung.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: Denn Jahwe hat gesprochen
  rationale: כִּי begründet hier die Gewissheit der Ankündigung; דִּבֵּר wird gewichtig mit „hat gesprochen“ wiedergegeben. Der Gottesname יהוה erscheint als „Jahwe“, der im Deutschen üblichen Form des Namens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über den Verkauf der Nachkommen
  choice: Die direkte Aussage „ich werde … verkaufen“ bleibt stehen
  alternative: eine abschwächende Wiedergabe wie „ich werde ausliefern“
  rationale: Der Text beschreibt vergeltendes Gericht in bewusster Entsprechung zum vorausgehenden Menschenhandel. Die Übersetzung soll diese theologische und ethische Spannung weder mildern noch zusätzlich deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am hebräischen Parallelismus, während „in die Gewalt“ die Bedeutung des hebräischen Hand-Idioms natürlich ausdrückt. Die Wiederholung von „verkaufen“ ist bewusst beibehalten.
