- from: Und ich werde eure Söhne und eure Töchter in die Gewalt der Söhne Judas verkaufen. Sie werden sie an die Sabäer[a] verkaufen, an ein fernes Volk. Denn Jahwe hat gesprochen.
  to: Und ich werde eure Söhne und eure Töchter in die Gewalt der Judäer verkaufen. Sie werden sie an die Sabäer[a] verkaufen, an ein fernes Volk. Denn Jahwe hat gesprochen.
