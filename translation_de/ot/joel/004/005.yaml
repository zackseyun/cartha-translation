  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
translation:
  language: de
  text: weil ihr mein Silber und mein Gold genommen und meine kostbaren Dinge in eure Tempel[a] gebracht habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eure Paläste“. Das hebräische Wort kann sowohl Tempel als auch Paläste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort führt im Zusammenhang den Grund für das zuvor angekündigte Gericht an; daher ist die kausale Wiedergabe im Deutschen natürlich und kontextgemäß.
- source_word: כַּסְפִּי וּזְהָבִי
  choice: mein Silber und mein Gold
  rationale: Die Possessivformen werden direkt und würdevoll wiedergegeben.
- source_word: לְקַחְתֶּם
  choice: ihr ... genommen
  rationale: Das Qal Perfekt 2. Person Plural von לקח bedeutet hier schlicht „nehmen“; eine stärkere Wiedergabe wie „rauben“ wäre interpretierender.
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: und meine kostbaren Dinge
  rationale: Die Verbindung bezeichnet begehrenswerte, wertvolle Gegenstände. „Kostbare Dinge“ bildet dies verständlich ab, ohne durch „Schätze“ eine zusätzliche Nuance einzutragen.
- source_word: הֲבֵאתֶם
  choice: gebracht habt
  rationale: Das Hifil Perfekt von בוא bezeichnet das Hineinbringen von Gegenständen an einen Ort.
- source_word: לְהֵיכְלֵיכֶם
  choice: in eure Tempel
  rationale: היכל kann sowohl einen Tempel als auch einen Palast bezeichnen. Im Zusammenhang mit der Aneignung dessen, was Gott gehört, ist „Tempel“ wahrscheinlich; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von הֵיכְלֵיכֶם im Zusammenhang mit dem Umgang der Völker mit Gottes Eigentum
  choice: „eure Tempel“ als kultische Gebäude
  alternative: „eure Paläste“ als königliche Gebäude
  rationale: Der Kontext lässt an eine kultische Aneignung geraubter Kostbarkeiten denken, doch das hebräische Wort legt diese Bedeutung nicht eindeutig fest. Deshalb steht die wahrscheinlichere Lesart im Text und die Alternative in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt der hebräischen Anklage eng, bleibt aber im Deutschen natürlich; die Zweideutigkeit von היכל wird nicht verschwiegen.
