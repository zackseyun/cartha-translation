  source_fidelity: 'Der Vers gibt die Abfolge und die zentralen Ausdrücke des Hebräischen zutreffend wieder: Loswerfen über Gottes Volk, die Preisgabe eines Jungen für eine Prostituierte, der Verkauf eines Mädchens für Wein und das anschließende Trinken. „Für eine Prostituierte“ bewahrt die knappe, im Detail nicht weiter erklärte Tauschformulierung, ohne eine bestimmte Deutung aufzuzwingen.'
  naturalness: Die Übersetzung ist insgesamt verständlich und im angemessen nüchternen Register gehalten. Die Umstellung „über mein Volk warfen sie das Los“ ist literarisch vertretbar, aber „sie warfen das Los über mein Volk“ ist im modernen Standarddeutsch unmittelbarer. „Dann“ ist nicht falsch, aber das schlichte verbindende „und“ entspricht der Reihung des Ausgangstextes genauer.
  terminology: '„Mein Volk“, „Los“, „Jungen“, „Mädchen“, „Prostituierte“ und „Wein“ sind sachgerecht. Der Fußnotentext zu a ist jedoch keine überzeugende deutsche Alternative: „um mein Volk verlosten sie“ ist idiomatisch unklar und kann den Vorgang eher verschleiern. Die Erklärung in der Fußnote ist zwar sachlich richtig, aber für den klaren Haupttext nicht erforderlich. Die implizite Bezugnahme von „ihn“ auf den Wein ist im Deutschen eindeutig und benötigt ebenfalls keine Fußnote.'
