base_translation:
  language: en
  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: de
  text: Und sie warfen das Los über mein Volk. Einen Jungen gaben sie für eine Prostituierte, ein Mädchen verkauften sie für Wein und tranken ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל עַמִּי יַדּוּ גוֹרָל
  choice: Und über mein Volk warfen sie das Los
  rationale: Die Wendung bezeichnet das Loswerfen zur Verteilung von Menschen als Beute. „Über“ markiert den Gegenstand der Verlosung und bewahrt die konkrete Bildsprache.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die Wiedergabe erhält sowohl den Possessivbezug als auch den gemeinschaftlichen und bundesbezogenen Klang.
- source_word: וַיִּתְּנוּ
  choice: gaben sie
  rationale: „Gaben“ entspricht dem hebräischen Verb unmittelbar. Der ausbeuterische Tausch ergibt sich aus der Konstruktion mit „für“, ohne dass das Verb interpretierend zu „tauschten“ erweitert wird.
- source_word: הַיֶּלֶד
  choice: einen Jungen
  rationale: Der Artikel kann hier generisch gebraucht sein. „Einen Jungen“ bildet zudem die natürliche männliche Entsprechung zu „ein Mädchen“.
- source_word: בַּזּוֹנָה
  choice: für eine Prostituierte
  rationale: Die Präposition bezeichnet wahrscheinlich den Gegenwert eines Tausches. Die knappe Formulierung bewahrt jedoch die erschütternde Mehrdeutigkeit, ob die Person als Bezahlung für den Dienst einer Prostituierten gegeben oder einer Prostituierten überlassen wurde.
- source_word: וְהַיַּלְדָּה מָכְרוּ
  choice: und ein Mädchen verkauften sie
  rationale: „Verkauften“ gibt מָכְרוּ direkt wieder; „ein Mädchen“ versteht den Artikel parallel zum Jungen generisch.
- source_word: בַיַּיִן
  choice: für Wein
  rationale: Die Präposition bezeichnet den als Kaufpreis oder Tauschwert empfangenen Wein.
- source_word: וַיִּשְׁתּוּ
  choice: dann tranken sie ihn
  rationale: Das im Hebräischen unausgesprochene Objekt ist aus dem unmittelbar genannten Wein eindeutig erschließbar. „Dann“ macht die erzählte Folge idiomatisch deutlich, ohne einen zusätzlichen Sachverhalt einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, schonungsloser Darstellung. Die markante Folge von Verlosung, sexueller Ausbeutung, Verkauf und Konsum bleibt erhalten. Die Wortstellung „ein Mädchen verkauften sie“ wahrt den hebräischen Parallelismus, ohne unnatürlich altertümlich zu wirken.
