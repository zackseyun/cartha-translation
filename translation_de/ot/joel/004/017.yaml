  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich Yahweh, euer Gott, bin, der auf Zion, meinem heiligen Berg, wohnt. Jerusalem wird heilig sein, und Fremde[a] werden nie mehr durch die Stadt ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Außenstehende“. Das hebräische Wort bezeichnet Menschen, die nicht dazugehören; hier sind wahrscheinlich diejenigen gemeint, die nicht in die heilige Stadt gehören, nicht unterschiedslos alle Nichtisraeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das waw kann im prophetischen Zusammenhang eine folgernde oder zeitlich anschließende Bedeutung tragen. „Dann“ gibt diesen Zusammenhang wieder; „erkennen“ bewahrt den kognitiven und erfahrungsbezogenen Sinn von ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: 'Die Konstruktion mit dem Suffix der 2. Person Plural bezeichnet unmittelbar die Bundesbeziehung: „euer Gott“.'
- source_word: שֹׁכֵן בְּצִיּוֹן
  choice: der auf Zion … wohnt
  rationale: Das Partizip bezeichnet Yahweh als den auf Zion Wohnenden. Bei einem Bergnamen ist „auf Zion“ im Deutschen natürlicher als „in Zion“.
- source_word: הַר קָדְשִׁי
  choice: meinem heiligen Berg
  rationale: Die Formulierung gibt den possessiven Ausdruck und das Heiligkeitsmotiv idiomatisch und genau wieder.
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: Jerusalem wird heilig sein
  rationale: Die Wendung sagt die Heiligkeit Jerusalems aus. „Wird heilig sein“ vermeidet die nicht ausdrücklich bezeichnete Vorstellung eines allmählichen Heiligwerdens.
- source_word: וְזָרִים
  choice: und Fremde
  rationale: זָרִים bezeichnet Außenstehende beziehungsweise Nichtzugehörige. „Fremde“ bewahrt diese Breite, ohne die Aussage ausschließlich ethnisch zu bestimmen.
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: werden nie mehr durch die Stadt ziehen
  rationale: עבר mit ב bezeichnet hier das Hindurchziehen. „Durch die Stadt“ macht den femininen Rückbezug auf Jerusalem im Deutschen eindeutig, ohne eine ungewohnte Personifizierung zu erzwingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration „Yahweh“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von זָרִים im Zusammenhang von Heiligkeit und Wiederherstellung
  choice: Fremde
  alternative: Ausländer; Außenstehende
  rationale: Der Kontext betrifft den Schutz der heiligen Stadt vor unbefugtem beziehungsweise entweihendem Eindringen. Das Wort muss daher nicht pauschal jeden Nichtisraeliten in ethnischem Sinn ausschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber für flüssiges Deutsch gegliedert. „Durch die Stadt“ vermeidet das im Deutschen missverständliche feminine Pronomen bei Jerusalem.
