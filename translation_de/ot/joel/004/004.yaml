source:
  edition: WLC
  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: de
  text: 'Und auch: Was habt ihr mit mir zu schaffen, Tyrus und Sidon und alle Gebiete Philistäas?[a] Zahlt ihr mir Vergeltung heim? Wenn ihr gegen mich Vergeltung übt, werde ich eure Vergeltung rasch und unverzüglich auf euren eigenen Kopf zurückbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was seid ihr mir?« Die hebräische Wendung ist eine konfrontative Herausforderung. Für »Gebiete« sind auch »Bezirke« oder »Landstriche« möglich. Die folgende Frage kann auch wiedergegeben werden: »Zahlt ihr mir eine Vergeltung heim?«'
    reason: Die Fußnote bewahrt die formnähere Alternative zum Idiom sowie die lexikalische Spannweite von גְּלִילוֹת und die knappe Formulierung der anschließenden rhetorischen Frage, ohne einen nicht ausgedrückten Gegenstand zu ergänzen.
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: 'Und auch: Was habt ihr mit mir zu schaffen'
  rationale: Die natürliche deutsche Wendung gibt die konfrontative hebräische Herausforderung wieder; „Und auch“ bildet den emphatischen Anschluss וְגַם ab.
- source_word: צֹר וְצִידוֹן
  choice: Tyrus und Sidon
  rationale: Gebräuchliche deutsche Namensformen.
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: und ihr ganzen Gebiete Philistäas
  rationale: גְּלִילוֹת bezeichnet Gebiete oder Bezirke; die Anrede wird im Deutschen durch „ihr“ verdeutlicht. פְּלָשֶׁת wird als Gebietsname Philistäa verstanden.
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: Wollt ihr mir mein Tun vergelten?
  rationale: Der vorangestellte Artikel bei הַגְּמוּל kann eine fragende Konstruktion markieren. „Vergelten“ wahrt den Gedanken der Gegenleistung beziehungsweise Wiedervergeltung; „mein Tun“ macht die elliptische Bedeutung des Nomens verständlich, ohne die Drohung abzuschwächen.
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: Wenn ihr mir etwas vergelten wollt
  rationale: Die Bedingung und das fortgesetzte Wortfeld גמל/גמול werden mit „vergelten“ bewahrt. „Etwas“ hält den Gegenstand bewusst allgemein.
- source_word: קַל מְהֵרָה
  choice: rasch und unverzüglich
  rationale: Zwei deutsche Adverbien bilden die emphatische Doppelung und die unmittelbare Schnelligkeit ab.
- source_word: אָשִׁיב גְּמֻלְכֶם בְּרֹאשְׁכֶם
  choice: werde ich eure Vergeltung ... auf euren eigenen Kopf zurückfallen lassen
  rationale: „Zurückfallen lassen“ gibt das kausative Zurückkehren von שׁוב wieder und erhält zugleich die hebräische Vorstellung, dass das Handeln auf die Täter selbst zurückkommt.
theological_decisions:
- issue: Charakter der göttlichen Antwort
  choice: Die angekündigte Antwort wird als unmittelbare göttliche Wiedervergeltung wiedergegeben.
  alternative: Eine allgemein gehaltene Aussage über unpersönliche Folgen des Handelns.
  rationale: Die Wiederholung von גמל/גמול, das Verb אָשִׁיב und die Wendung „auf euren Kopf“ bezeichnen eine direkte Antwort Gottes; diese gerichtliche Spannung darf nicht verharmlost werden.
- issue: Bezug von הַגְּמוּל
  choice: „mein Tun“ als das von den Angeredeten vermeintlich zu vergeltende Handeln Gottes
  alternative: „eine Vergeltung“ als feindselige Leistung gegen Gott
  rationale: Die knappe hebräische Form lässt im Deutschen verschiedene Nuancen zu. Der Haupttext folgt einer natürlichen Deutung der rhetorischen Frage; die Fußnote wahrt die alternative formnahe Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die rhetorische Schärfe bleiben erhalten. Das wiederkehrende Wortfeld der Vergeltung wird möglichst konsequent abgebildet, ohne unnatürliche deutsche Nominalhäufungen.
