  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: de
  text: Wacht auf, ihr Betrunkenen, und weint! Klagt laut, ihr alle, die ihr Wein trinkt, über den süßen Wein[a], denn er ist eurem Mund entzogen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: jungen Wein; auch: frischen Wein. Das hebräische Wort עָסִיס kann frisch gepressten beziehungsweise süßen Wein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: Wacht auf
  rationale: Der Imperativ Plural bezeichnet das Erwachen aus Schlaf oder Benommenheit. „Wacht auf“ ist im heutigen Deutsch natürlich und bewahrt den eindringlichen prophetischen Ruf.
- source_word: שִׁכּוֹרִים
  choice: ihr Betrunkenen
  rationale: Das substantivierte Adjektiv steht als direkte Anrede. „Betrunkene“ gibt den Zustand klar wieder, ohne die altertümliche oder stark abwertende Färbung von „Trunkenbolde“.
- source_word: וּבְכוּ
  choice: und weint
  rationale: Das Verb bezeichnet Weinen als Ausdruck der Trauer und bildet die erste Stufe des folgenden Klagerufs.
- source_word: וְהֵילִלוּ
  choice: Jammert
  rationale: Der Imperativ von ילל bezeichnet lautes Klagen. „Jammert“ vermittelt die gesteigerte Klage natürlich, ohne die im Deutschen mögliche Tierassoziation von „heult“.
- source_word: כָּל שֹׁתֵי יָיִן
  choice: ihr alle, die ihr Wein trinkt
  rationale: Die partizipiale Wendung bezeichnet die Weintrinkenden und hat hier Anredefunktion. Die gewählte Form ist klar, idiomatisch und erhält das umfassende כָּל.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier den Gegenstand beziehungsweise Anlass der Klage. „Über“ passt idiomatisch zu „jammern“.
- source_word: עָסִיס
  choice: den süßen Wein
  rationale: Das Substantiv kann frisch gepressten, jungen oder süßen Wein bezeichnen. „Süßer Wein“ ist verständlich und hebt den begehrten Genuss hervor; die lexikalische Bandbreite wird in der Fußnote bewahrt.
- source_word: נִכְרַת
  choice: entzogen worden
  rationale: Der Nifal von כרת bedeutet wörtlich „abgeschnitten worden sein“. In Verbindung mit „Mund“ gibt „entzogen worden“ die resultierende völlige Vorenthaltung in natürlichem Deutsch wieder.
- source_word: מִפִּיכֶם
  choice: eurem Mund
  rationale: Die wörtliche Körpermetapher „Mund“ bleibt erhalten und macht die unmittelbare Entbehrung anschaulich.
