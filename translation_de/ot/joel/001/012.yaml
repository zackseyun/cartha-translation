source:
  edition: WLC
  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: de
  text: 'Der Weinstock ist verdorrt,

    und der Feigenbaum ist verkümmert.


    Der Granatapfelbaum, auch die Dattelpalme und der Apfelbaum[a] –

    alle Bäume des Feldes sind verdorrt.


    Ja, bei den Menschen ist die Freude verdorrt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise »Aprikosenbaum«; welche Baumart das hebräische Wort tappuach genau bezeichnet, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von den Söhnen des Menschen«; gemeint sind Menschen beziehungsweise die Menschheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: der Weinstock
  rationale: Bezeichnet die kultivierte Weinrebe als Nutzpflanze; »Weinstock« ist im Deutschen eindeutig und in diesem landwirtschaftlichen Zusammenhang natürlich.
- source_word: הוֹבִישָׁה
  choice: ist verdorrt
  rationale: Im Zusammenhang der Erntekatastrophe bezeichnet das Verb das Austrocknen der Pflanze. »Verdorrt« bewahrt zugleich die Wortverbindung zum abschließenden Bild von der verdorrten Freude.
- source_word: הַתְּאֵנָה
  choice: der Feigenbaum
  rationale: Die Pflanzenbezeichnung wird im Deutschen idiomatisch mit »Feigenbaum« wiedergegeben.
- source_word: אֻמְלָלָה
  choice: ist verkümmert
  rationale: Das Verb beschreibt einen geschwächten, dahinschwindenden Zustand. »Verkümmert« unterscheidet diesen Ausdruck vom wiederholten »verdorrt«.
- source_word: רִמּוֹן
  choice: Granatapfelbaum
  rationale: In der Aufzählung von Bäumen ist die ausdrückliche Benennung als Baum im Deutschen klarer als der bloße Fruchtname.
- source_word: גַּם תָּמָר
  choice: Dattelpalme
  rationale: תָּמָר bezeichnet in diesem Kulturraum die Dattelpalme; die additive Partikel גַּם wird durch die fortgesetzte deutsche Aufzählung hinreichend ausgedrückt.
- source_word: תַפּוּחַ
  choice: Apfelbaum
  rationale: »Apfelbaum« ist die traditionelle und verständliche Wiedergabe; da die genaue botanische Art unsicher ist, wird die Alternative in einer Fußnote genannt.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: alle Bäume des Feldes
  rationale: Die formnahe Wendung erhält das umfassende ländliche Bild des Hebräischen.
- source_word: יָבֵשׁוּ
  choice: sind verdorrt
  rationale: Das Verb beschreibt den ausgetrockneten Zustand sämtlicher Bäume; die Wiederholung verstärkt das Bild der Verwüstung.
- source_word: כִּי
  choice: Ja
  rationale: Hier leitet כִּי eine bekräftigende und zugleich erklärende Zuspitzung ein. »Ja« gibt diese rhetorische Kraft in natürlichem Deutsch wieder, ohne eine eindeutige Kausalbeziehung aufzuzwingen.
- source_word: הֹבִישׁ
  choice: ist verdorrt
  rationale: Die landwirtschaftliche Bildsprache wird auf die menschliche Freude übertragen. Dieselbe Wiedergabe wie zu Beginn erhält die poetische Klammer.
- source_word: מִן בְּנֵי אָדָם
  choice: der Menschen
  rationale: Die hebräische Wendung bezeichnet die Menschheit beziehungsweise Menschen allgemein. Der deutsche Genitiv vermittelt knapp, dass die Freude ihnen entzogen und bei ihnen verschwunden ist; die formnähere Ausdrucksweise wird in der Fußnote bewahrt.
theological_decisions:
- issue: Generische Bedeutung von בְּנֵי אָדָם
  choice: der Menschen
  alternative: von den Menschenkindern
  rationale: Die Wendung meint Menschen allgemein, nicht ausschließlich männliche Personen oder Kinder. »Der Menschen« gibt den allgemeinen Bezug im modernen Deutsch natürlich wieder; die wörtlichere Form und die im Hebräischen ausdrücklich privative Präposition werden in der Fußnote dokumentiert.
- issue: Beziehung zwischen dem Verdorren der Pflanzen und dem Verlust der Freude
  choice: Die Freude wird ausdrücklich als verdorrt bezeichnet
  alternative: Die Freude ist verschwunden beziehungsweise gewichen
  rationale: 'Die Wiederaufnahme des Verbs bewahrt die beabsichtigte Metapher: Die äußere Dürre und die innere Freudlosigkeit spiegeln einander, ohne dass die Übersetzung diesen Zusammenhang weiter theologisch ausdeutet.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die dreifache Wiederholung von »verdorrt« erhält das Leitbild des hebräischen Textes. Die Baumaufzählung bleibt knapp; der Gedankenstrich markiert die zusammenfassende Steigerung.
