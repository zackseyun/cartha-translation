  - severity: low
    issue: „die Freude der Menschen“ ersetzt die Konstruktion mit מִן durch einen Genitiv.
    rationale: Der Genitiv ist verständlich, verdeckt aber die Aussage, dass Freude von bzw. bei den Menschen geschwunden ist. Eine Formulierung mit „bei den Menschen“ ist formnäher und bewahrt die Metapher.
  - severity: low
