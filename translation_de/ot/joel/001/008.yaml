  text: אֱלִ֕י כִּ/בְתוּלָ֥ה חֲגֻֽרַת שַׂ֖ק עַל בַּ֥עַל נְעוּרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
translation:
  language: de
  text: Klage wie eine Jungfrau, die mit Sacktuch umgürtet ist[a], über den Mann ihrer Jugend[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in Sacktuch gekleidet ist“.'
    reason: lexical_alternative
  - marker: b
    text: „Mann“ kann hier auch im Sinn von „Verlobter“ verstanden werden; das poetische Bild ist kulturell verdichtet.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִי
  choice: Wehklage
  rationale: Der feminine Singular des Imperativs fordert zu hörbarer, eindringlicher Toten- oder Trauerklage auf. „Wehklage“ gibt die prophetische Klagesprache prägnant wieder.
- source_word: כִּבְתוּלָה
  choice: wie eine Jungfrau
  rationale: Die Präposition כְּ kennzeichnet den Vergleich. בְּתוּלָה wird in seiner üblichen Bedeutung wiedergegeben; die poetische Spannung zum folgenden „Mann ihrer Jugend“ bleibt erhalten.
- source_word: חֲגֻרַת שַׂק
  choice: die in Sacktuch gekleidet ist
  rationale: Die Form beschreibt den Zustand der Trauernden. Die deutsche Wendung ist verständlich und bewahrt Sacktuch als sichtbares Zeichen der Trauer; die wörtlichere Alternative steht in der Fußnote.
- source_word: שַׂק
  choice: Sacktuch
  rationale: „Sacktuch“ ist die etablierte Bezeichnung für den groben Stoff, der als Trauerkleidung getragen wurde.
- source_word: עַל
  choice: um
  rationale: In einem Klagezusammenhang bezeichnet עַל die Person, der die Trauer gilt. „Um jemanden wehklagen“ ist im Deutschen idiomatisch.
- source_word: בַּעַל
  choice: Mann
  rationale: Im Beziehungskontext bezeichnet בַּעַל den ehelichen Partner. „Mann“ bewahrt im Deutschen etwas mehr von der poetischen Offenheit als „Ehemann“; die mögliche Deutung als Verlobter wird in der Fußnote genannt.
- source_word: נְעוּרֶיהָ
  choice: ihrer Jugend
  rationale: Die Genitivverbindung bestimmt „Mann“ näher und wird als „Mann ihrer Jugend“ wiedergegeben, also als der in jungen Jahren mit ihr verbundene Partner.
theological_decisions:
- issue: Spannung zwischen „Jungfrau“ und „Mann ihrer Jugend“ im Trauerbild
  choice: Das verdichtete hebräische Bild wird im Haupttext beibehalten, ohne die Beziehung genauer festzulegen.
  alternative: בַּעַל als „Verlobter“ wiedergeben oder das Bild als junge Braut und Bräutigam ausformulieren.
  rationale: Der poetische Text lässt offen, ob eine Jungfrau beziehungsweise junge Frau um ihren Verlobten oder um den als „Mann ihrer Jugend“ bezeichneten Partner klagt. Eine eindeutige moderne Kategorie würde die im Hebräischen vorhandene Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wehklage“ wahrt den starken, hörbaren Klagecharakter; „Sacktuch“ erhält das konkrete Trauerzeichen. Die Satzform folgt dem knappen poetischen Vergleich des Hebräischen.
