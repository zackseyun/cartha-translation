base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: de
  text: Selbst die Tiere des Feldes lechzen nach dir[a], denn die Wasserläufe[b] sind ausgetrocknet, und Feuer hat die Weideplätze[c] der Steppe verzehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »zu dir hin«; das Hebräische betont die Richtung auf Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wasserrinnen« oder »Bachbetten«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Weideflächen« oder »Grasplätze«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: Die vorangestellte Partikel hebt hervor, dass sogar die Tiere von der Not betroffen sind und sich an Gott wenden.
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: die Tiere auf dem Feld
  rationale: Die Wortgruppe bezeichnet allgemein Tiere der freien Flur und ist nicht auf Haustiere oder Vieh beschränkt.
- source_word: תַּעֲרוֹג אֵלֶיךָ
  choice: lechzen nach dir
  rationale: ערג beschreibt ein durch Durst geprägtes Verlangen oder Hecheln; die deutsche Wendung gibt sowohl die körperliche Not als auch die Ausrichtung auf Gott natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für das Lechzen der Tiere an.
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: die Wasserläufe sind ausgetrocknet
  rationale: אֲפִיקִים kann Rinnen, Bachbetten oder Wasserläufe bezeichnen; „Wasserläufe“ ist präzise und in diesem Dürrekontext gut verständlich.
- source_word: וְאֵשׁ אָכְלָה
  choice: und Feuer hat … verzehrt
  rationale: Das Verb אָכַל wird bei Feuer bildhaft für vollständiges Abbrennen oder Vernichten gebraucht; „verzehrt“ bewahrt dieses Bild.
- source_word: נְאוֹת
  choice: die Weideplätze
  rationale: Im Zusammenhang mit Tieren, Dürre und offenem Land bezeichnet das Wort Weide- oder Grasplätze.
- source_word: הַמִּדְבָּר
  choice: der Steppe
  rationale: מִדְבָּר meint hier unbebautes, trockenes Weideland; „Steppe“ vermittelt diesen Landschaftstyp im modernen Deutsch genauer als „Wüste“.
theological_decisions:
- issue: Bezug der zweiten Person Singular in אֵלֶיךָ
  choice: direkte Anrede Gottes („nach dir“)
  alternative: bloß ungerichtetes Verlangen der Tiere
  rationale: Die hebräische Form nennt ausdrücklich ein männliches Gegenüber in der zweiten Person Singular. Im Gebetszusammenhang des vorhergehenden Verses ist damit Gott gemeint; die Übersetzung lässt die Tiere daher auf ihn ausgerichtet sein.
translation_notes:
  register: Moderne, würdige Standardsprache. „Lechzen“ erhält das eindringliche Bild dürstender Tiere; „Steppe“ vermeidet die im Deutschen leicht irreführende Vorstellung einer völlig vegetationslosen Sandwüste.
