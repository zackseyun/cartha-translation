source:
  edition: WLC
  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: de
  text: Setzt ein heiliges Fasten an, ruft eine feierliche Versammlung aus! Versammelt die Ältesten und alle Bewohner des Landes[a] im Haus Jahwes, eures Gottes, und schreit zu Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; hier passt wegen des auf den Tempel ausgerichteten Aufrufs die örtliche Bedeutung besser.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ צוֹם
  choice: Heiligt ein Fasten
  rationale: Der Imperativ von קדשׁ bezeichnet die Aussonderung zu einem heiligen Zweck. „Heiligt“ bewahrt den kultischen Gehalt und ist in diesem feierlichen Aufruf verständlich; „ein Fasten“ gibt צום idiomatisch wieder.
- source_word: קִרְאוּ עֲצָרָה
  choice: ruft eine feierliche Versammlung aus
  rationale: קרא kann hier das Ausrufen beziehungsweise Einberufen bezeichnen. עצרה meint in diesem gottesdienstlichen Zusammenhang eine festliche oder feierlich-ernste Versammlung; „feierliche Versammlung“ wahrt die kultische Würde, ohne eine bestimmte Art von Festtag festzulegen.
- source_word: אִסְפוּ זְקֵנִים
  choice: Versammelt die Ältesten
  rationale: אסף fordert zum Zusammenbringen auf. זקנים bezeichnet hier wahrscheinlich die anerkannten Ältesten der Gemeinschaft, nicht lediglich alte Männer.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: alle Bewohner des Landes
  rationale: יֹשְׁבֵי ist eine substantivierte Partizipialform für die dort Wohnenden. הארץ kann „Land“ oder „Erde“ bedeuten; wegen des auf den Tempel und die örtliche Gemeinschaft bezogenen Aufrufs ist „Land“ im Kontext wahrscheinlicher.
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: im Haus Jahwes, eures Gottes
  rationale: Beim Verb „versammeln“ kann die präpositionslose Ortsangabe das Ziel beziehungsweise den Versammlungsort bezeichnen. Natürliches Deutsch verwendet hier „im Haus“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: und schreit zu Jahwe
  rationale: זעק bezeichnet einen dringlichen Hilferuf in Not. „Schreit zu“ erhält diese Intensität besser als das allgemeinere „ruft“ oder eine erklärende Wiedergabe mit „betet“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Räumlicher Geltungsbereich von הָאָרֶץ
  choice: des Landes
  alternative: der Erde
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der tempelzentrierte Aufruf an die Gemeinschaft spricht hier eher für das örtliche „Land“; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
- issue: Bedeutung von זְקֵנִים
  choice: die Ältesten
  alternative: die alten Männer
  rationale: Im öffentlichen, gemeinschaftlichen Aufruf liegt die institutionelle beziehungsweise soziale Bedeutung „Älteste“ näher. Die Form allein könnte grundsätzlich auch ältere Männer bezeichnen, doch der Kontext begünstigt die Gemeinschaftsältesten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen und liturgischem Ernst. „Heiligt“ und „feierliche Versammlung“ erhalten den sakralen Charakter, ohne unnötig altertümlich zu wirken. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
