  text: הֹבִ֣ישׁוּ אִכָּרִ֗ים הֵילִ֨ילוּ֙ כֹּֽרְמִ֔ים עַל חִטָּ֖ה וְ/עַל שְׂעֹרָ֑ה כִּ֥י אָבַ֖ד קְצִ֥יר שָׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: de
  text: Schämt euch[a], ihr Bauern! Klagt laut[b], ihr Winzer, über Weizen und Gerste, denn die Ernte des Feldes ist zugrunde gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid bestürzt“ oder „Werdet zuschanden“. Das hebräische Verb kann sowohl innere Bestürzung als auch Scham oder öffentliche Beschämung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Heult“. Das hebräische Verb bezeichnet einen lauten Klageruf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Schämt euch
  rationale: Der Hifil-Imperativ Plural von בוש kann Scham, Beschämung oder Bestürzung ausdrücken. „Schämt euch“ bewahrt die unmittelbare Aufforderung und die lexikalische Spannung; die kontextuell mögliche Bedeutung „Seid bestürzt“ wird in der Fußnote genannt.
- source_word: אִכָּרִים
  choice: Bauern
  rationale: Das Wort bezeichnet Menschen, die den Boden bearbeiten. „Bauern“ ist im modernen Deutsch klar und passt zum Getreidekontext.
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Der Imperativ von ילל bezeichnet einen lauten Klageruf. „Jammert“ ist natürlich und ernst; die noch stärkere Wiedergabe „heult“ wird als Alternative vermerkt.
- source_word: כֹּרְמִים
  choice: Winzer
  rationale: Gemeint sind Arbeiter beziehungsweise Besitzer, die Weinberge bewirtschaften. „Winzer“ ist die geläufige und prägnante deutsche Bezeichnung.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier den Gegenstand oder Anlass der Klage. „Über“ gibt dies im Deutschen idiomatisch wieder.
- source_word: חִטָּה וְעַל שְׂעֹרָה
  choice: Weizen und Gerste
  rationale: Dies sind die üblichen und eindeutigen deutschen Bezeichnungen für die beiden Getreidearten; die wiederholte Präposition muss im natürlichen Deutschen nicht wiederholt werden.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die vorangehenden Aufforderungen ein. „Denn“ wahrt den kausalen Zusammenhang in einem würdigen, natürlichen Satzbau.
- source_word: אָבַד
  choice: ist zugrunde gegangen
  rationale: Das Qal-Perfekt bezeichnet Verlust, Untergang oder Verderben. Die Formulierung bewahrt den resultativen Sinn, ohne ausdrücklich einen handelnden Zerstörer vorauszusetzen.
- source_word: קְצִיר שָׂדֶה
  choice: die Ernte des Feldes
  rationale: Die Konstruktion bezeichnet die zum Feld gehörende Ernte. Die formnahe Wiedergabe bleibt verständlich und bewahrt das konkrete landwirtschaftliche Bild.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit prophetischer Dringlichkeit. Die direkte Anrede wird durch „ihr Bauern“ und „ihr Winzer“ ausdrücklich wiedergegeben; Ausrufezeichen verdeutlichen die beiden parallelen Imperative, ohne den Inhalt zu erweitern.
