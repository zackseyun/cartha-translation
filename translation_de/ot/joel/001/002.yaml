  text: שִׁמְעוּ זֹאת֙ הַ/זְּקֵנִ֔ים וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל יוֹשְׁבֵ֣י הָ/אָ֑רֶץ הֶ/הָ֤יְתָה זֹּאת֙ בִּֽ/ימֵי/כֶ֔ם וְ/אִ֖ם בִּ/ימֵ֥י אֲבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: de
  text: 'Hört dies, ihr Ältesten, und hört zu, alle Bewohner des Landes[a]: Ist dies in euren Tagen geschehen oder in den Tagen eurer Väter[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; im unmittelbaren Zusammenhang passt „Land“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eurer Vorfahren“. Wörtlich: „eurer Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Hört dies
  rationale: Der pluralische Imperativ und sein direktes Objekt werden knapp und in würdiger, verständlicher Sprache wiedergegeben.
- source_word: הַזְּקֵנִים
  choice: ihr Ältesten
  rationale: Die Anredeform wird ausdrücklich gemacht. „Älteste“ kann sowohl ältere Männer als auch anerkannte Verantwortungsträger der Gemeinschaft bezeichnen und wahrt damit die Bedeutungsbreite.
- source_word: וְהַאֲזִינוּ
  choice: und hört zu
  rationale: האזין fordert aufmerksames Hören. „Hört zu“ ist im heutigen Deutsch natürlich und bildet mit „Hört dies“ den hebräischen Parallelismus ab, ohne altertümlich zu wirken.
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: ihr Bewohner des Landes
  rationale: Die hebräische Gesamtbezeichnung wird als direkte Anrede wiedergegeben. Im unmittelbaren Zusammenhang ist mit אֶרֶץ am ehesten das betroffene Land gemeint; die mögliche weitere Bedeutung „Erde“ bleibt in der Fußnote erhalten.
- source_word: הֶהָיְתָה זֹּאת
  choice: Ist so etwas ... geschehen
  rationale: Die Frage zielt darauf, ob ein vergleichbares Ereignis schon vorgekommen ist. „So etwas geschehen“ drückt diesen Sinn im Deutschen natürlicher aus als eine formale Wiedergabe mit „sein“.
- source_word: בִּימֵיכֶם
  choice: in euren Tagen
  rationale: Die hebräische Zeitangabe wird bewusst in ihrer bildhaften und im Deutschen verständlichen Form bewahrt.
- source_word: וְאִם
  choice: oder
  rationale: In der zweiteiligen Frage führt וְאִם die alternative Zeitangabe ein; im Deutschen entspricht dem schlicht „oder“.
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: in den Tagen eurer Väter
  rationale: Die generationenübergreifende Gegenüberstellung und die ausdrücklich männliche Form des Hebräischen bleiben erhalten; die umfassendere Wiedergabe „Vorfahren“ wird als Alternative vermerkt.
theological_decisions:
- issue: Bezugsweite von הָאָרֶץ
  choice: des Landes
  alternative: der Erde
  rationale: אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten. Die an Älteste und Bewohner gerichtete prophetische Rede und die folgende Schilderung einer örtlich erfahrenen Katastrophe sprechen hier für „Land“. Die grundsätzlich weitere Lesart wird nicht ausgeschlossen, sondern in der Fußnote ausgewiesen.
- issue: Wiedergabe von אֲבֹתֵיכֶם
  choice: eurer Väter
  alternative: eurer Vorfahren
  rationale: Der hebräische Ausdruck lautet wörtlich „eure Väter“ und bezeichnet die früheren Generationen. Der Haupttext wahrt die konkrete Ausgangsform; die im Deutschen mögliche umfassendere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Anrede. Der hebräische Parallelismus der beiden Höraufforderungen und die Zeitformel „in euren Tagen“ bleiben erkennbar; unnötig altertümliche Wendungen wie „leiht euer Ohr“ werden vermieden.
