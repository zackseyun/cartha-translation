id: JOL.1.19
reference: Joel 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: de
  text: Zu dir, Jahwe[a], rufe ich; denn Feuer hat die Weideplätze der Steppe[b] verzehrt, und eine Flamme hat alle Bäume des Feldes versengt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Weideplätze der Wüste“. Das hebräische Wort kann offenes, unbewohntes Weideland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Zu dir
  rationale: Die Präposition אֶל mit Suffix der 2. Person Singular bezeichnet die Ausrichtung des Rufens auf Gott; „Zu dir“ ist im Deutschen natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Transkription, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶקְרָא
  choice: rufe ich
  rationale: Das Qal-Imperfekt von קרא bezeichnet hier den an Gott gerichteten Hilferuf. Die deutsche Wortstellung wahrt den hervorgehobenen Auftakt „Zu dir“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für den Ruf ein; „denn“ passt zum gehobenen, aber verständlichen Klagegebet.
- source_word: אֵשׁ אָכְלָה
  choice: Feuer hat … verzehrt
  rationale: אכל beschreibt die zerstörerische Wirkung des Feuers bildhaft als Fressen oder Verzehren. „Verzehrt“ erhält dieses kräftige Bild in würdigem Deutsch.
- source_word: נְאוֹת מִדְבָּר
  choice: die Weideplätze der Steppe
  rationale: נְאוֹת bezeichnet hier Weide- oder Lagerplätze; מִדְבָּר meint offenes, dünn besiedeltes Weideland und nicht zwingend eine Sandwüste. „Steppe“ vermittelt diese Landschaft im Deutschen treffend.
- source_word: וְלֶהָבָה
  choice: und eine Flamme
  rationale: Die koordinierte Wendung setzt das parallele Bild des zerstörerischen Feuers fort; im Deutschen ist der unbestimmte Artikel idiomatisch.
- source_word: לִהֲטָה
  choice: hat … versengt
  rationale: להט bezeichnet die Wirkung lodernder Hitze. „Versengt“ erhält den Unterschied zu „verzehrt“ und die poetische Parallelität.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: alle Bäume des Feldes
  rationale: Die Wendung wird formal und verständlich wiedergegeben; „Feld“ bezeichnet hier das offene Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt den persönlichen Namen; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Der Satzbeginn „Zu dir“ bewahrt die Hervorhebung des hebräischen Textes; Semikolon und „denn“ machen den Klagezusammenhang klar.
