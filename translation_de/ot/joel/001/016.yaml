base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: de
  text: Ist nicht vor unseren Augen die Nahrung ausgeblieben, Freude und Jubel aus dem Haus unseres Gottes[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Haus unseres Gottes“ ist der Tempel gemeint.
    reason: contextual_clarification
lexical_decisions:
- source_word: הֲלוֹא
  choice: Wird nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet, und verbindet sich natürlich mit dem deutschen Passiv.
- source_word: נֶגֶד עֵינֵינוּ
  choice: vor unseren Augen
  rationale: Bewahrt die anschauliche idiomatische Aussage, dass das Geschehen offen sichtbar ist.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: Bezeichnet allgemein das zum Essen Bestimmte und ist im Zusammenhang der landwirtschaftlichen Verwüstung weiter als „Brot“.
- source_word: נִכְרָת
  choice: weggerissen
  rationale: Gibt das gewaltsame Abgeschnitten- beziehungsweise Entzogenwerden natürlich wieder, ohne den Vorgang auf bloße Vernichtung festzulegen.
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: aus dem Haus unseres Gottes
  rationale: Folgt dem hebräischen Ausdruck wörtlich genug; im Zusammenhang ist damit Gottes Tempel gemeint.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: Eine klare und geläufige Wiedergabe des allgemeinen Begriffs für Freude.
- source_word: וָגִיל
  choice: und Jubel
  rationale: Bringt gegenüber „Freude“ den gesteigerten, nach außen tretenden Charakter des zweiten Begriffs zum Ausdruck und erhält die poetische Doppelung.
theological_decisions:
- issue: Syntaktischer Geltungsbereich der rhetorischen Frage bei den beiden Verlusten
  choice: Das Verb „weggerissen“ gilt elliptisch sowohl für die Nahrung als auch für Freude und Jubel.
  alternative: Der zweite Ausdruck könnte appositionell oder als Folge des Verlusts der Nahrung verstanden werden.
  rationale: Die Parallelstruktur der hebräischen Dichtung erlaubt die Auslassung des wiederholten Verbs im zweiten Glied. So bleibt die Klage über den Verlust sowohl der Versorgung als auch der gottesdienstlichen Festfreude erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die poetische Ellipse bleiben erhalten; „Haus unseres Gottes“ bewahrt das hebräische Bild, während die Fußnote den gemeinten Tempel erläutert.
