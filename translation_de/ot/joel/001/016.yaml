- from: Wird nicht vor unseren Augen die Nahrung weggerissen, Freude und Jubel aus dem Haus unseres Gottes[a]?
  to: Ist nicht vor unseren Augen die Nahrung ausgeblieben, Freude und Jubel aus dem Haus unseres Gottes[a]?
  rationale: Die Revision ersetzt die überstarke und im Deutschen zeitlich weniger passende Formulierung „Wird … weggerissen“ durch „Ist … ausgeblieben“. Damit wird der bereits eingetretene Entzug der Nahrung natürlich wiedergegeben, ohne eine konkrete Art der gewaltsamen Wegnahme zu behaupten. Die elliptische zweite Vershälfte, die Freude und Jubel als ebenso verlorene Güter aus Gottes Haus beklagt, bleibt erhalten.
