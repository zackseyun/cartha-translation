  - severity: medium
    issue: „Wird nicht“ verschiebt den Aspekt in eine gegenwärtige bzw. künftige passive Handlung.
    rationale: Der hebräische Perfekt beschreibt im Klageton einen eingetretenen Zustand. „Ist nicht … ausgeblieben“ gibt dies im modernen Deutschen natürlicher wieder.
  - severity: low
    issue: Die Fußnote bezeichnet den identischen Wortlaut als „wörtlich“.
    rationale: Da der Haupttext schon „Haus unseres Gottes“ lautet, sollte die Anmerkung lediglich die kontextuelle Tempelreferenz erläutern.
