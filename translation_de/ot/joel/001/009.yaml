  naturalness: „Sind dem Haus Jahwes entzogen“ ist modernes, verständliches Standarddeutsch und wahrt die Aussage der kultischen Unterbrechung. Die Stellung „Die Priester, die Diener Jahwes, trauern“ macht die Apposition im Deutschen klar und bleibt würdig.
  terminology: „Speiseopfer“ und „Trankopfer“ sind etablierte präzise Kultbegriffe. Für modernes Standarddeutsch ist „Jahwe“ die übliche deutsche Schreibung des Gottesnamens; sie bewahrt die Wiedergabe von יהוה als Eigenname.
