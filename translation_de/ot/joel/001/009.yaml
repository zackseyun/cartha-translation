source:
  edition: WLC
  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: de
  text: Speiseopfer und Trankopfer sind dem Haus Jahwes[a] entzogen. Die Priester, die Diener Jahwes, trauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Speiseopfer und Trankopfer sind vom Haus Jahwes abgeschnitten.“ Mit dem „Haus Jahwes“ ist der Tempel beziehungsweise das Heiligtum gemeint.'
    reason: Die Anmerkung dokumentiert die bildhafte hebräische Formulierung und erläutert die Tempelbezeichnung.
lexical_decisions:
- source_word: הָכְרַת
  choice: bleiben … aus
  rationale: Der Hophal von כרת bezeichnet hier passiv-resultativ, dass die Opfer aufgehört haben beziehungsweise nicht mehr verfügbar sind. „Bleiben … aus“ gibt diese kultische Unterbrechung im Deutschen natürlich wieder, ohne eine bestimmte Ursache hinzuzufügen.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im kultischen Zusammenhang bezeichnet מִנְחָה das aus Getreide bereitete Opfer. „Speiseopfer“ ist die geläufige und präzise deutsche Fachbezeichnung.
- source_word: נֶסֶךְ
  choice: Trankopfer
  rationale: Das Wort bezeichnet eine ausgegossene Opfergabe. „Trankopfer“ ist verständlich und im biblisch-kultischen Sprachgebrauch etabliert.
- source_word: מִבֵּית יְהוָה
  choice: im Haus Yahwes
  rationale: 'Die idiomatische Konstruktion „bleiben im Haus … aus“ gibt den hebräischen Ausgangspunkt מִן natürlich wieder: Diese Opfer gehen nicht mehr vom Heiligtum aus beziehungsweise finden dort nicht mehr statt. „Haus“ bewahrt das hebräische Bild; gemeint ist der Tempel.'
- source_word: יְהוָה
  choice: Yahwe / Yahwes
  rationale: Der Gottesname wird als „Yahwe“ wiedergegeben; im Genitiv lautet die Form „Yahwes“. So bleibt der im Hebräischen verwendete Eigenname erkennbar, statt durch einen Titel ersetzt zu werden.
- source_word: אָבְלוּ
  choice: trauern
  rationale: Das Verb bezeichnet Trauer beziehungsweise Klage. „Trauern“ ist hier knapp, würdig und kontextgerecht.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte und übliche Wiedergabe der kultischen Amtsträger.
- source_word: מְשָׁרְתֵי יְהוָה
  choice: die Diener Yahwes
  rationale: Die Partizipialfügung beschreibt die Priester appositionell als diejenigen, die Yahwe kultisch dienen. „Diener Yahwes“ bewahrt diese knappe Satzstruktur.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe mit dem Eigennamen „Yahwe“ bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Verhältnis von „Priester“ und „Diener Yahwes“
  choice: appositionelle Bezeichnung derselben Gruppe
  alternative: zwei getrennte Gruppen
  rationale: מְשָׁרְתֵי יְהוָה steht unmittelbar nach „die Priester“ und erläutert sehr wahrscheinlich deren Funktion. Die knappe Apposition erhält zugleich die Formulierung des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bleiben … aus“ vermeidet das im Deutschen missverständliche „vom Haus abgeschnitten“, während die Fußnote die hebräische Bildsprache dokumentiert. Die Wiederholung des Gottesnamens und die knappe Apposition entsprechen dem feierlichen Parallelismus des Ausgangstextes.
