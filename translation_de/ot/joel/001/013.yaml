  to: Gürtet euch[a] und klagt, ihr Priester! Heult, ihr Diener des Altars! Kommt, verbringt die Nacht in Sacktuch, ihr Diener meines Gottes! Denn dem Haus eures Gottes[b] werden Speiseopfer und Trankopfer vorenthalten.
