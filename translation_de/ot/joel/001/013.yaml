  naturalness: Der Text ist überwiegend klares, würdiges modernes Standarddeutsch. „Jammert“ kann im heutigen Deutsch jedoch auch bloßes, klägliches Beschweren bezeichnen und trifft den intensiven rituellen Klageruf von הֵילִילוּ weniger gut. „Heult“ bewahrt dessen Nachdruck. Die Umformung zu „werden ... vorenthalten“ ist idiomatisch und verdeutlicht die passive Aussage.
  terminology: „Diener des Altars“, „Diener meines Gottes“, „Speiseopfer“ und „Trankopfer“ sind angemessen. „Haus eures Gottes“ wahrt die hebräische Bezeichnung; die Tempel-Alternative gehört zutreffend in die Fußnote.
