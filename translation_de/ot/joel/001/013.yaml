source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: de
  text: Gürtet euch[a] und klagt, ihr Priester! Heult, ihr Diener des Altars! Kommt, verbringt die Nacht in Sacktuch, ihr Diener meines Gottes! Denn dem Haus eures Gottes[b] werden Speiseopfer und Trankopfer vorenthalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gürtet euch.“ Im Zusammenhang ist wohl das Anlegen von Sacktuch als Trauerkleidung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Tempel eures Gottes“. Hebräisch: „dem Haus eures Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: Legt Trauerkleidung an
  rationale: Das Verb bedeutet wörtlich „gürtet euch“. Im Zusammenhang ritueller Klage und des später ausdrücklich genannten Sacktuchs bezeichnet es hier wahrscheinlich das Anlegen von Trauerkleidung. Die Fußnote bewahrt den wörtlichen Ausdruck und die verbleibende Bildhaftigkeit.
- source_word: וְסִפְדוּ
  choice: und klagt
  rationale: Das Verb bezeichnet die Toten- oder Trauerklage. „Klagt“ gibt die kultische wie emotionale Dimension knapp und würdig wieder.
- source_word: הֵילִילוּ
  choice: Jammert
  rationale: Das Verb bezeichnet einen lauten, intensiven Klageruf und steigert das vorherige „klagt“. „Jammert“ ist im heutigen Deutschen verständlich, ohne die Stärke abzuschwächen.
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: ihr Diener des Altars
  rationale: Die Konstruktverbindung bezeichnet diejenigen, die am Altar Dienst tun. „Diener des Altars“ wahrt die kultische Funktion und die direkte Anrede.
- source_word: לִינוּ
  choice: verbringt die Nacht
  rationale: Das Verb bedeutet, über Nacht zu bleiben. Die Wendung macht deutlich, dass die Trauerhandlung die ganze Nacht andauern soll.
- source_word: בַשַּׂקִּים
  choice: in Sacktuch
  rationale: Der hebräische Plural bezeichnet hier Trauergewänder aus grobem Stoff. Die deutsche Kollektivbezeichnung „Sacktuch“ ist idiomatisch und erhält den kulturellen Bezug.
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: ihr Diener meines Gottes
  rationale: Der Suffix der ersten Person Singular („meines Gottes“) wird ausdrücklich bewahrt und nicht an das folgende „eures Gottes“ angeglichen.
- source_word: נִמְנַע
  choice: sind … entzogen
  rationale: Der Nifal drückt aus, dass die Opfer dem Gotteshaus vorenthalten beziehungsweise entzogen sind. Die passive Form und der Bezug mit מִן bleiben erhalten.
- source_word: מִנְחָה וָנָסֶךְ
  choice: Speiseopfer und Trankopfer
  rationale: מִנְחָה bezeichnet hier im kultischen Zusammenhang das Speiseopfer, נֶסֶךְ das ausgegossene Trankopfer.
- source_word: מִבֵּית אֱלֹהֵיכֶם
  choice: dem Haus eures Gottes
  rationale: „Haus“ bildet בַּיִת formal ab und lässt die im Hebräischen übliche Bezeichnung des Tempels stehen; „Tempel“ wird als verständliche Deutung in der Fußnote genannt.
theological_decisions:
- issue: Wechsel zwischen אֱלֹהָי und אֱלֹהֵיכֶם
  choice: „meines Gottes“ und „eures Gottes“ werden beide bewahrt
  alternative: Beide Bezüge zu „unseres Gottes“ vereinheitlichen
  rationale: Der Wechsel von der ersten Person des Propheten zur zweiten Person der Priester steht ausdrücklich im Hebräischen. Eine Harmonisierung würde die rhetorische Spannung beseitigen.
- issue: Bezeichnung des Heiligtums als בֵּית אֱלֹהֵיכֶם
  choice: „Haus eures Gottes“
  alternative: „Tempel eures Gottes“
  rationale: „Haus“ wahrt die hebräische Metapher und bleibt im Deutschen verständlich; „Tempel“ wäre eine sachlich naheliegende, aber stärker deutende Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger imperativischer Folge. Die direkte Anrede „ihr …“ ist natürlicher als ein archaisierendes „o“. Kultische Fachbegriffe werden verständlich und konsistent wiedergegeben; die Bildsprache und der Wechsel zwischen „mein Gott“ und „euer Gott“ bleiben erhalten.
