id: JOL.1.17
reference: Joel 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָבְשׁ֣וּ פְרֻד֗וֹת תַּ֚חַת מֶגְרְפֹ֣תֵי/הֶ֔ם נָשַׁ֨מּוּ֙ אֹֽצָר֔וֹת נֶהֶרְס֖וּ מַמְּגֻר֑וֹת כִּ֥י הֹבִ֖ישׁ דָּגָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: de
  text: Die Saatkörner sind unter ihren Erdschollen verschrumpft[a]. Die Vorratshäuser liegen verödet, die Kornspeicher sind niedergerissen; denn das Getreide ist verdorrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter für „Saatkörner“ und „Erdschollen“ sind selten und in ihrer Bedeutung unsicher. Möglich sind auch Wiedergaben wie „Körner“ beziehungsweise „Furchen“; das zweite Wort wird teils sogar als „Hacken“ oder „Schaufeln“ verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: sind verschrumpft
  rationale: Das Verb bezeichnet ein Austrocknen oder Einschrumpfen; in Verbindung mit Saatkörnern gibt „verschrumpft“ das konkrete Schadensbild natürlich wieder.
- source_word: פְרֻדוֹת
  choice: Saatkörner
  rationale: Das seltene und unsichere Substantiv bezeichnet im Zusammenhang wahrscheinlich Samen- oder Getreidekörner. „Saatkörner“ passt zur Lage im Boden, ohne die Bedeutung unnötig zu verengen.
- source_word: תַּחַת
  choice: unter
  rationale: Die gewöhnliche räumliche Bedeutung ist hier sachlich und idiomatisch.
- source_word: מֶגְרְפֹתֵיהֶם
  choice: ihren Erdschollen
  rationale: Das seltene Wort ist umstritten. Im landwirtschaftlichen Zusammenhang ergibt die Deutung als Erdschollen über den Saatkörnern ein stimmiges Bild; die Unsicherheit wird in der Fußnote bewahrt.
- source_word: נָשַׁמּוּ
  choice: liegen verödet
  rationale: Bei Gebäuden bezeichnet die Form einen Zustand der Verwüstung oder Verlassenheit. „liegen verödet“ gibt diesen resultativen Zustand in natürlichem Deutsch wieder.
- source_word: אֹצָרוֹת
  choice: Vorratshäuser
  rationale: Im agrarischen Kontext sind Lagerräume für Erzeugnisse gemeint, nicht Schatzkammern.
- source_word: נֶהֶרְסוּ
  choice: sind niedergerissen
  rationale: Das Verb bezeichnet das Einreißen oder Zerstören eines Bauwerks; „niedergerissen“ bewahrt das konkrete Bild.
- source_word: מַמְּגֻרוֹת
  choice: Kornspeicher
  rationale: Das Wort bezeichnet Speicheranlagen für Getreide. „Kornspeicher“ ist präzise und allgemein verständlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für den Zustand der Speicher ein; „denn“ verbindet die Aussagen in würdigem, natürlichem Deutsch.
- source_word: הֹבִישׁ
  choice: ist verdorrt
  rationale: Die Hifil-Form kann das Misslingen beziehungsweise Austrocknen der Ernte ausdrücken. „ist verdorrt“ macht die landwirtschaftliche Katastrophe anschaulich, ohne zusätzliche Ursachen einzutragen.
- source_word: דָּגָן
  choice: Getreide
  rationale: Der allgemeine Ausdruck für Getreideerzeugnisse wird mit dem üblichen modernen deutschen Sammelbegriff wiedergegeben.
theological_decisions: []
