base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: de
  text: Es hat meinen Weinstock zur Ödnis gemacht und meinen Feigenbaum zu Splittern gemacht[a]. Es hat ihn völlig kahl geschält und hingeworfen[b]; seine Zweige[c] sind weiß geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Bruchholz gemacht“ beziehungsweise „zu Stümpfen gemacht“. Das hebräische Wort ist selten; es kann zerbrochene oder zersplitterte Überreste bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen ist das Objekt bei „hingeworfen“ nicht erneut genannt; es kann den Feigenbaum oder das abgeschälte Material meinen.
    reason: source_ambiguity
  - marker: c
    text: 'Oder: „Schösslinge“ oder „Ranken“. Das Weißwerden beschreibt wahrscheinlich das nach dem Abschälen freigelegte Holz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם … לְשַׁמָּה
  choice: zur Ödnis gemacht
  rationale: Die Verbindung von שׂים mit לְ und dem Substantiv שַׁמָּה bezeichnet das Versetzen in einen Zustand der Verwüstung. Die substantivische Fassung bewahrt das eindringliche Bild des Hebräischen.
- source_word: גַּפְנִי
  choice: meinen Weinstock
  rationale: גֶּפֶן bezeichnet hier den einzelnen Weinstock, nicht den Weinberg; das Besitzsuffix der ersten Person Singular bleibt erhalten.
- source_word: וּתְאֵנָתִי
  choice: und meinen Feigenbaum
  rationale: תְּאֵנָה bezeichnet den Feigenbaum beziehungsweise die Feigenpflanze; im landwirtschaftlichen Zusammenhang ist „Feigenbaum“ eindeutig und natürlich.
- source_word: לִקְצָפָה
  choice: zersplittert
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich einen zerbrochenen oder zersplitterten Zustand. Die verbale Wiedergabe ist im Deutschen natürlich, ohne die lexikalische Unsicherheit zu verdecken; Alternativen stehen in der Fußnote.
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: völlig kahl geschält
  rationale: Infinitivus absolutus und finites Verb desselben Stammes verstärken die Aussage. „Völlig“ gibt diese Intensivierung wieder; „kahl geschält“ passt zum anschließenden Weißwerden des freigelegten Holzes.
- source_word: וְהִשְׁלִיךְ
  choice: und hingeworfen
  rationale: Das Hifil von שלך bedeutet „werfen, schleudern“. Da im Hebräischen kein ausdrückliches Objekt folgt, wahrt die knappe deutsche Form die Offenheit, ob an den Baum oder an das Abgeschälte zu denken ist.
- source_word: הִלְבִּינוּ שָׂרִיגֶיהָ
  choice: seine Zweige sind weiß geworden
  rationale: Das finite Verb bezeichnet das Weißwerden; שָׂרִיג kann Zweig, Schössling oder Ranke bedeuten. „Zweige“ ist verständlich und lässt das Bild des durch Abschälen freigelegten Holzes erkennen.
