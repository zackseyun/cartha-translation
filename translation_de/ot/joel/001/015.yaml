revisions:
- from: Ach, dieser Tag! Denn der Tag Jahwes ist nahe; wie Verwüstung vom Allmächtigen[a] kommt er.
  to: Weh über den Tag! Denn der Tag Jahwes ist nahe, und er kommt wie Verwüstung vom Allmächtigen[a].
  rationale: Die Revision gibt die mit לַיּוֹם ausgedrückte Klagebeziehung ohne Zusatznuance wieder, stellt die explizite hebräische Verknüpfung mit „und“ her und glättet die deutsche Satzstellung. Die Übersetzung wahrt den Vergleich; sie behauptet nicht, dass der Tag selbst mit Verwüstung gleichzusetzen sei. Die Fußnote bewahrt den Hinweis auf das im Deutschen nicht reproduzierbare Klangspiel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:53:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Elemente zutreffend wieder: Klageruf, Nähe des Tages Jahwes, Vergleich mit Verwüstung und Ursprung „vom Allmächtigen“. „Ach, dieser Tag!“ schwächt jedoch die durch לַיּוֹם markierte Klagebeziehung ab und wirkt eher wie ein bloßer Ausruf. Die Verbindung mit ו am Beginn des letzten Satzteils sollte ausdrücklich wiedergegeben werden.'
  naturalness: „Weh über den Tag!“ ist im prophetisch-würdigen modernen Standarddeutsch natürlich und prägnant. „und er kommt wie Verwüstung vom Allmächtigen“ ist klarer und idiomatischer als die nachgestellte Inversion „wie Verwüstung vom Allmächtigen kommt er“.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe von יְהוָה. „der Allmächtige“ ist für שַׁדַּי vertretbar. Die Fußnote erläutert das Klangspiel angemessen; die hebräische Umschrift wird zur besseren Lesbarkeit als „Schod“ und „Schaddai“ beibehalten.
  issues:
  - severity: medium
    issue: Der Klageruf „Ach, dieser Tag!“ gibt לַיּוֹם nicht hinreichend wieder.
    rationale: Die Präposition verbindet die Klage ausdrücklich mit dem Tag („Wehe/ach über den Tag“). „Dieser Tag“ fügt zudem eine demonstrative Nuance hinzu, die im Hebräischen nicht ausgedrückt ist.
  - severity: low
    issue: Die Satzstellung im zweiten Teilsatz ist unnötig schwerfällig, und die hebräische Konjunktion ו fehlt.
    rationale: „… und er kommt wie Verwüstung vom Allmächtigen“ bewahrt die Verknüpfung und liest sich im Deutschen natürlicher.
  revised_text: Weh über den Tag! Denn der Tag Jahwes ist nahe, und er kommt wie Verwüstung vom Allmächtigen[a].
