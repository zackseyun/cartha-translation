id: JOL.1.15
reference: Joel 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
translation:
  language: de
  text: Weh über den Tag! Denn der Tag Jahwes ist nahe, und er kommt wie Verwüstung vom Allmächtigen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen besteht ein Klangspiel zwischen „Verwüstung“ (Schod) und „Schaddai“ („der Allmächtige“).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: Ach, dieser Tag!
  rationale: Die Klagepartikel אֲהָהּ drückt Trauer und Bestürzung aus; zusammen mit לַיּוֹם wird sie in natürlichem, prägnantem Deutsch als Klage über den bevorstehenden Tag wiedergegeben.
- source_word: כִּי קָרוֹב
  choice: Denn … ist nahe
  rationale: כִּי begründet den Klageruf, während קָרוֹב die unmittelbare Nähe beziehungsweise das Bevorstehen bezeichnet.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Die feste prophetische Wendung bezeichnet Jahwes entscheidendes Eingreifen; der Gottesname wird als Eigenname wiedergegeben.
- source_word: וּכְשֹׁד
  choice: wie Verwüstung
  rationale: שֹׁד bezeichnet gewaltsame Verheerung oder Verwüstung; כְ kennzeichnet den Vergleich.
- source_word: מִשַׁדַּי
  choice: vom Allmächtigen
  rationale: מִן bezeichnet hier den Ursprung, und שַׁדַּי wird mit seinem herkömmlichen deutschen Titel wiedergegeben. Das hebräische Klangspiel mit שֹׁד wird in einer Fußnote erläutert.
- source_word: יָבוֹא
  choice: kommt er
  rationale: Das Imperfekt beschreibt das unmittelbar bevorstehende und als gewiss dargestellte Kommen. Das Präsens wirkt im Deutschen lebendig und passt zur Aussage, der Tag sei nahe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von שֹׁד zu שַׁדַּי
  choice: „Verwüstung vom Allmächtigen“ im Haupttext mit Erläuterung des Klangspiels
  alternative: „Verwüstung von Schaddai“
  rationale: „Der Allmächtige“ vermittelt die geläufige Bedeutung des Gottesnamens beziehungsweise Titels שַׁדַּי, während die Fußnote die im Deutschen sonst verlorene lautliche Beziehung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Klageruf und die prophetische Unmittelbarkeit bleiben erhalten; das im Deutschen nicht nachbildbare hebräische Klangspiel wird transparent in der Fußnote erklärt.
