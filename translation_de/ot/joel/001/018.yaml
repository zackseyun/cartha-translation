  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: de
  text: Wie stöhnt das Vieh! Die Rinderherden sind verwirrt[a], denn sie haben keine Weide; selbst die Schafherden leiden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind ratlos“ beziehungsweise „sind orientierungslos“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch „büßen“, „Schuld tragen“ oder „als schuldig gelten“ bedeuten. Hier bezeichnet es wahrscheinlich, dass die Schafherden unter den Folgen der Verwüstung leiden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶּאֶנְחָה
  choice: Wie stöhnt
  rationale: מַה dient hier als Ausrufspartikel; das Verb bezeichnet hörbar geäußerte Not. „Wie stöhnt“ gibt den Klageruf natürlich und würdig wieder.
- source_word: בְהֵמָה
  choice: das Vieh
  rationale: Der kollektive Singular bezeichnet hier allgemein die Nutztiere. „Vieh“ wahrt den Kollektivcharakter und vermeidet eine Vorwegnahme der anschließend eigens genannten Rinder.
- source_word: נָבֹכוּ
  choice: irren ratlos umher
  rationale: Das Verb bezeichnet Verwirrung beziehungsweise Orientierungslosigkeit. Im Zusammenhang mit der fehlenden Weide macht „irren ratlos umher“ sowohl den Zustand als auch das Verhalten der Herden anschaulich.
- source_word: עֶדְרֵי בָקָר
  choice: die Rinderherden
  rationale: Die deutsche Zusammensetzung gibt die hebräische Constructusverbindung knapp und präzise wieder.
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: denn sie finden keine Weide
  rationale: כִּי ist kausal; מִרְעֶה bezeichnet Weide beziehungsweise Weideland. Die Formulierung ist natürliches Deutsch und wahrt den Sinn, dass keine Weide für die Tiere vorhanden ist.
- source_word: גַּם
  choice: selbst
  rationale: „Selbst“ bringt hier die steigernde, ausweitende Funktion der Partikel zum Ausdruck.
- source_word: עֶדְרֵי הַצֹּאן
  choice: die Schafherden
  rationale: צֹאן kann Kleinvieh bezeichnen; im gegebenen Kontext ist „Schafherden“ eine klare und sachgerechte Wiedergabe.
- source_word: נֶאְשָׁמוּ
  choice: leiden
  rationale: Die Form von אשם kann Schuld, Haftung oder das Tragen schlimmer Folgen anklingen lassen. „Leiden“ passt zum Schicksal der Tiere, ohne ihnen eindeutig moralische Schuld oder eine ausdrücklich genannte Bestrafung zuzuschreiben.
theological_decisions:
- issue: Gerichtlicher beziehungsweise schuldbezogener Beiklang von נֶאְשָׁמוּ bei Tieren
  choice: Im Haupttext steht neutral „leiden“, während eine Fußnote den möglichen schuld- oder haftungsbezogenen Beiklang nennt.
  alternative: „büßen“, „Schuld tragen“ oder „werden schuldig“
  rationale: Der Stamm אשם besitzt einen echten forensischen beziehungsweise schuldbezogenen Bedeutungsbereich. Da hier jedoch Schafherden Subjekt sind, würde eine eindeutige Aussage moralischer Schuld die Spannung vorschnell auflösen. Haupttext und Fußnote bewahren gemeinsam sowohl den Kontext des Leidens als auch die lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit klagendem, würdigem Ton. Die Ausrufeform und die konkrete Bewegung der orientierungslosen Herden bleiben erhalten; die schwierige Schlussformulierung wird im Haupttext nicht überinterpretiert, ihre gerichtliche Nuance aber in der Fußnote dokumentiert.
