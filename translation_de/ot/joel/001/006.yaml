  terminology: „Volk“, „Land“, „mächtig“ und „zahllos“ passen zur prophetischen Sprache und bewahren die Metapher. Die Fußnote zu גוי sollte die im Kontext naheliegende Plage als Kontextinformation, nicht als zwingende Identifizierung im Text, formulieren. Bei לָבִיא ist eine Fußnote zur möglichen Wiedergabe „Löwin“ sinnvoll; „kräftiger/ausgewachsener Löwe“ sollte nicht als feste lexikalische Definition behauptet werden.
