  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: de
  text: Denn ein Volk ist gegen mein Land heraufgezogen[a], mächtig und zahllos. Seine Zähne sind Löwenzähne, und es hat Reißzähne wie ein Löwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ist gegen/über mein Land heraufgezogen“. „Volk“ kann auch „Nation“ bedeuten und bezeichnet im Zusammenhang bildhaft die einfallende Plage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie eine Löwin“. Das hebräische Wort לָבִיא kann einen Löwen bezeichnen; die genaue zoologische und geschlechtliche Nuance ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zur Klage ein und wahrt die erklärende beziehungsweise kausale Funktion.
- source_word: גוֹי
  choice: Volk
  rationale: Das hebräische Wort bezeichnet ein Volk oder eine Nation und dient hier als militärisch geprägte Metapher für die einfallende Plage. „Volk“ klingt im Deutschen natürlich, ohne das Bild zu einer bloßen Heuschreckenmenge aufzulösen.
- source_word: עָלָה עַל
  choice: ist gegen … heraufgezogen
  rationale: Bewahrt sowohl die Bewegungsrichtung des Verbs als auch den feindlichen Sinn der Präposition; „ist eingefallen“ wäre deutlicher, aber stärker deutend.
- source_word: אַרְצִי
  choice: mein Land
  rationale: Gibt das ausdrückliche Suffix der ersten Person Singular und die territoriale Bedeutung unmittelbar wieder.
- source_word: עָצוּם
  choice: mächtig
  rationale: Vermittelt die überwältigende Stärke des Angreifers in würdiger prophetischer Sprache.
- source_word: וְאֵין מִסְפָּר
  choice: und zahllos
  rationale: Eine knappe, natürliche Wiedergabe der hebräischen Aussage, dass keine Zahl für die Menge vorhanden ist.
- source_word: שִׁנֵּי אַרְיֵה
  choice: wie die Zähne eines Löwen
  rationale: Das Deutsche benötigt hier zur klaren Vergleichsaussage ein „wie“, auch wenn der hebräische Nominalsatz wörtlich „Zähne eines Löwen“ lautet.
- source_word: מְתַלְּעוֹת
  choice: Gebiss
  rationale: Das seltene Wort bezeichnet die zum Zerreißen dienenden Kieferzähne beziehungsweise das Gebiss. „Gebiss“ wahrt das Raubtierbild, ohne die anatomisch engere Bedeutung „Fangzähne“ zu erzwingen.
- source_word: לָבִיא
  choice: starker Löwe
  rationale: Das Wort bezeichnet einen kräftigen oder ausgewachsenen Löwen, möglicherweise auch eine Löwin. Die Hauptfassung vermeidet eine unbelegte Festlegung auf das Geschlecht und bringt die Nuance der Stärke zum Ausdruck.
- source_word: לוֹ
  choice: es hat
  rationale: Die Präposition mit Suffix drückt Besitz aus; der Bezug auf das kollektiv gebrauchte „Volk“ wird im Deutschen mit dem Neutrum aufgenommen.
theological_decisions:
- issue: Identität des einfallenden Volkes
  choice: Die Bezeichnung „Volk“ bleibt als prophetische Metapher im Haupttext stehen.
  alternative: „Schwarm“, „Heuschreckenheer“ oder „Heuschreckenvolk“
  rationale: Der hebräische Text sagt גוי, nicht ausdrücklich „Schwarm“ oder „Heuschrecken“. Die militärische Metapher soll nicht durch eine erklärende Identifikation im Haupttext eingeebnet werden.
- issue: Geschlecht und genaue Art des Raubtiers לָבִיא
  choice: „starker Löwe“ mit Fußnote zur möglichen Wiedergabe „Löwin“
  alternative: „Löwin“
  rationale: Die lexikalische Nuance ist nicht eindeutig geschlechtsspezifisch. Die Übersetzung wahrt diese Offenheit, statt aufgrund einer verbreiteten Tradition auf ein weibliches Tier festzulegen.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit klarer Satzführung. Die Metapher eines feindlich heraufziehenden Volkes und die Löwenbilder bleiben erhalten; seltene oder mehrdeutige hebräische Ausdrücke werden nicht unnötig vereindeutigt.
