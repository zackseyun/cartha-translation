  source_fidelity: 'Der Grundsatz und die erste Bildhälfte sind gut getroffen: כִּי ist kausal mit „Denn“ wiedergegeben, גוי bleibt als metaphorisches „Volk“ stehen, und die erste Person in „mein Land“ ist erhalten. In der zweiten Bildhälfte schwächt „wie“ jedoch den hebräischen Nominalsatz ab: Dieser setzt die Zähne des Volkes unmittelbar mit Löwenzähnen gleich. Zudem ist „starker“ bei לָבִיא als Haupttextzusatz nicht erforderlich; die genaue zoologische bzw. geschlechtliche Nuance ist unsicher und sollte nicht durch eine zusätzliche Bedeutungsbestimmung eingeengt werden. „Reißzähne“ gibt מְתַלְּעוֹת als zerreißende Zähne präziser wieder als das umfassendere „Gebiss“.'
