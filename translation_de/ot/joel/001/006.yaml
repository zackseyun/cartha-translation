    rationale: Die Bezeichnung kann einen Löwen bzw. je nach lexikalischer Einordnung auch eine Löwin meinen. Die Stärke des Tieres als explizites Adjektiv im Haupttext ist keine notwendige Wiedergabe und geht über die sichere Bedeutung hinaus.
