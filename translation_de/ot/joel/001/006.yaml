  to: Denn ein Volk ist gegen mein Land heraufgezogen[a], mächtig und zahllos. Seine Zähne sind Löwenzähne, und es hat Reißzähne wie ein Löwe[b].
  rationale: Die Revision bewahrt die militärisch-prophetische Metapher von גוי und die räumlich-feindliche Bewegung von עלה על. Sie stellt zugleich die stärkere hebräische Gleichsetzung in der ersten Löwenmetapher wieder her, gibt מְתַלְּעוֹת konkreter als „Reißzähne“ wieder und vermeidet eine nicht sichere Zusatznuance bei לָבִיא. Die Fußnoten dokumentieren die echten lexikalischen Alternativen, ohne den Haupttext zu überladen.
