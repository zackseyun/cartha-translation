  text: יֶ֤תֶר הַ/גָּזָם֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה וְ/יֶ֥תֶר הָ/אַרְבֶּ֖ה אָכַ֣ל הַ/יָּ֑לֶק וְ/יֶ֣תֶר הַ/יֶּ֔לֶק אָכַ֖ל הֶ/חָסִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/004.yaml
  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
translation:
  language: de
  text: Was die nagende Heuschrecke übrig ließ[a], fraß die schwärmende Heuschrecke; und was die schwärmende Heuschrecke übrig ließ, fraß die hüpfende Heuschrecke; und was die hüpfende Heuschrecke übrig ließ, fraß die fressende Heuschrecke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vier hebräischen Bezeichnungen meinen wahrscheinlich verschiedene Arten oder Entwicklungsstadien von Heuschrecken; ihre genaue zoologische Abgrenzung ist jedoch unsicher. Möglich sind sinngemäße Wiedergaben wie „nagende“, „schwärmende“, „hüpfende“ und „fressende“ Heuschrecke.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר
  choice: was ... übrig ließ
  rationale: Das Substantiv bezeichnet den Rest bzw. das Übriggebliebene. Die gewählte idiomatische Konstruktion bewahrt die dreifache Abfolge, in der jeweils der verbliebene Rest weitergefressen wird.
- source_word: גָּזָם
  choice: Nagerheuschrecke
  rationale: Der Ausdruck bezeichnet wohl eine Heuschreckenart oder ein fressendes Insekt; die genaue zoologische Zuordnung ist unsicher. „Nagerheuschrecke“ vermittelt die Tätigkeit des Abnagerns, ohne eine exakte Artbestimmung zu behaupten.
- source_word: אָכַל
  choice: fraß
  rationale: Die Qatal-Form schildert hier jeweils eine abgeschlossene Handlung. Bei Heuschrecken ist „fraß“ im Deutschen natürlich und erhält den eindringlichen Gleichklang der Wiederholung.
- source_word: אַרְבֶּה
  choice: Schwarmheuschrecke
  rationale: Dies ist die gewöhnliche Bezeichnung für die Heuschrecke und kann besonders mit ihrem Auftreten in Schwärmen verbunden sein. Das Bestimmungswort unterscheidet sie verständlich von den drei anderen Ausdrücken.
- source_word: יָּלֶק / יֶּלֶק
  choice: Hüpferheuschrecke
  rationale: Das Wort bezeichnet eine weitere Art oder ein Entwicklungsstadium der Heuschrecke, doch die genaue Unterscheidung bleibt unsicher. „Hüpferheuschrecke“ bietet eine anschauliche, vorsichtige Differenzierung; die unterschiedliche Vokalisierung im Vers ändert die Bedeutung nicht.
- source_word: חָסִיל
  choice: Fresserheuschrecke
  rationale: Der Ausdruck bezeichnet ein verzehrendes, verwüstendes Insekt. „Fresserheuschrecke“ gibt diese zerstörerische Tätigkeit wieder und passt zur Reihe gleichartig gebildeter Benennungen.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die Glieder zu einer sich steigernden Folge. „Und“ bewahrt den Rhythmus und die kumulative Wirkung des Hebräischen.
