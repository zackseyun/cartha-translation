  text: שֻׁדַּ֣ד שָׂדֶ֔ה אָבְלָ֖ה אֲדָמָ֑ה כִּ֚י שֻׁדַּ֣ד דָּגָ֔ן הוֹבִ֥ישׁ תִּיר֖וֹשׁ אֻמְלַ֥ל יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: de
  text: Das Feld ist verwüstet, der Ackerboden trauert; denn das Getreide ist vernichtet, der Most ist vertrocknet, das Öl[a] ist ausgeblieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist frisches Öl, gewöhnlich Olivenöl. Das hebräische Wort gehört zur häufigen Dreierformel „Getreide, Most und Öl“. Wörtlicher könnte der letzte Satzteil auch heißen: „das frische Öl ist dahingewelkt“ oder „das Olivenöl hat versagt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד (שׁדד)
  choice: ist verwüstet / ist vernichtet
  rationale: Das Passiv bezeichnet gewaltsame Zerstörung oder Verheerung. Beim Feld ist „verwüstet“ idiomatisch; beim Getreide vermeidet „vernichtet“ eine schwerfällige Wiederholung, ohne die Stärke abzuschwächen.
- source_word: שָׂדֶה
  choice: das Feld
  rationale: Die gewöhnliche Bedeutung ist „Feld“; der Singular bleibt als dichterische, kollektiv zu verstehende Form erhalten.
- source_word: אָבְלָה (אבל)
  choice: trauert
  rationale: Das Verb bedeutet „trauern, klagen“. Die Wiedergabe bewahrt die Personifikation des Ackerbodens, statt sie zu einer rein landwirtschaftlichen Aussage aufzulösen.
- source_word: אֲדָמָה
  choice: der Ackerboden
  rationale: „Ackerboden“ unterscheidet אֲדָמָה vom vorausgehenden שָׂדֶה und passt zum landwirtschaftlichen Zusammenhang sowie zur poetischen Personifikation.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier den Grund für die Trauer des Bodens ein; „denn“ ist knapp und dem poetischen Register angemessen.
- source_word: דָּגָן
  choice: das Getreide
  rationale: Gemeint ist Getreideertrag allgemein, nicht eine bestimmte Getreideart.
- source_word: הוֹבִישׁ (יבש)
  choice: ist vertrocknet
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet die Form das Austrocknen. „Ist vertrocknet“ gibt sowohl den Vorgang als auch den eingetretenen Zustand wieder.
- source_word: תִּירוֹשׁ
  choice: der Most
  rationale: תִּירוֹשׁ bezeichnet neuen beziehungsweise frisch gewonnenen Wein. „Most“ ist im Deutschen eine knappe und natürliche Bezeichnung für den noch jungen Traubensaft beziehungsweise neuen Wein.
- source_word: אֻמְלַל (אמל)
  choice: ist ausgeblieben
  rationale: Das Verb bezeichnet Welken, Hinschwinden oder Versagen. Da יִצְהָר das landwirtschaftliche Ölerzeugnis meint, drückt „ist ausgeblieben“ verständlich den Ertragsausfall aus, ohne Öl selbst unnatürlich „welken“ zu lassen.
- source_word: יִצְהָר
  choice: das Öl
  rationale: Das Wort bezeichnet frisches Öl, gewöhnlich Olivenöl, als landwirtschaftliches Erzeugnis. „Öl“ ist im Haupttext natürlich; die genauere sachliche Einordnung steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Personifikation des trauernden Ackerbodens bleibt erhalten. Das Semikolon bildet die zweiteilige Struktur des hebräischen Verses ab; „denn“ kennzeichnet die Begründung. Der Fußnotenmarker steht bei „Öl“, da sich die lexikalische Erläuterung auf יִצְהָר und nicht auf „trauert“ bezieht.
