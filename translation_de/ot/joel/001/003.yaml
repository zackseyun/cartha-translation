base_translation:
  language: en
  yaml_path: translation/ot/joel/001/003.yaml
  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: de
  text: Erzählt euren Kindern davon[a]; eure Kinder sollen es ihren Kindern erzählen, und deren Kinder sollen es einer späteren Generation erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „euren Söhnen … ihren Söhnen … ihren Söhnen“; hier steht „Kinder“, weil es um die Weitergabe der Erinnerung durch aufeinanderfolgende Generationen insgesamt geht, nicht nur durch männliche Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: davon
  rationale: Die Präposition עַל mit femininem Suffix verweist im Zusammenhang auf das zuvor geschilderte Unheil. Das idiomatische deutsche „davon erzählen“ gibt den Rückbezug natürlich wieder, ohne das grammatische Geschlecht des hebräischen Bezugswortes nachzuahmen.
- source_word: לִבְנֵיכֶם / וּבְנֵיכֶם / לִבְנֵיהֶם / וּבְנֵיהֶם
  choice: euren Kindern / eure Kinder / ihren Kindern / deren Kinder
  rationale: בנים kann insbesondere „Söhne“, aber auch allgemein „Kinder“ bezeichnen. Hier geht es um die Weitergabe der Erinnerung über aufeinanderfolgende Generationen hinweg, weshalb „Kinder“ den kontextuellen Sinn angemessen wiedergibt.
- source_word: סַפֵּרוּ
  choice: Erzählt
  rationale: Der Piel-Imperativ im Plural fordert zum bewussten, ausführlichen Weitererzählen auf. „Erzählt“ ist gegenwärtig, würdig und bewahrt den erzählerischen Aspekt des Verbs.
- source_word: וּבְנֵיכֶם ... וּבְנֵיהֶם
  choice: eure Kinder sollen es ... erzählen und deren Kinder ...
  rationale: In den Folgegliedern lässt das Hebräische das Verb aus. Im Deutschen wird „erzählen“ ergänzt und die vom Imperativ ausgehende Aufforderung mit „sollen“ fortgeführt, damit die Überlieferungskette klar und natürlich klingt.
- source_word: לְדוֹר אַחֵר
  choice: einer späteren Generation
  rationale: אַחֵר bezeichnet hier eine weitere beziehungsweise nachfolgende Generation. „Einer späteren Generation“ ist im Deutschen klarer als das potenziell missverständliche „einer anderen Generation“ und legt die Wendung nicht auf ausschließlich die unmittelbar nächste Generation fest.
