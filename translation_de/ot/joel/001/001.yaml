  text: דְּבַר יְהוָה֙ אֲשֶׁ֣ר הָיָ֔ה אֶל יוֹאֵ֖ל בֶּן פְּתוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/001.yaml
  text: The word of Yahweh that came to Joel son of Pethuel[a][b].
translation:
  language: de
  text: Das Wort[a] Jahwes[b], das an Joel, den Sohn Petuëls, erging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Botschaft Jahwes, die an Joel, den Sohn Petuëls, erging.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: Wort
  rationale: Die Konstruktverbindung mit dem Gottesnamen bildet die geläufige prophetische Formel „Wort Jahwes“. „Wort“ wahrt den formalen und kanonischen Bezug besser als das stärker deutende „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das an … erging
  rationale: Die Wendung bezeichnet idiomatisch den Empfang prophetischer Offenbarung. „An … erging“ ist im Deutschen natürlich und würdevoll, ohne die hebräische Konstruktion hölzern nachzubilden.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: Die genealogische Zuordnung wird idiomatisch als Apposition „den Sohn …“ wiedergegeben.
- source_word: פְּתוּאֵל
  choice: Petuël
  rationale: Die Schreibweise gibt den Personennamen wieder; das Trema zeigt an, dass u und e getrennt gesprochen werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname JHWH. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel bleibt erkennbar; „erging“ gibt die Offenbarungswendung knapp und idiomatisch wieder.
