id: MIC.1.15
reference: Micah 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: de
  text: Noch werde ich einen, der dich in Besitz nimmt[a], über dich bringen, du Bewohnerin von Marescha; bis nach Adullam wird die Herrlichkeit Israels[b] kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „einen Erben“, „einen Besitzer“ oder „einen Eroberer“ bedeuten. Im Hebräischen besteht wahrscheinlich ein Wortspiel mit dem Namen Marescha.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Vornehmen Israels“, „der Reichtum Israels“ oder „Israels Pracht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: noch
  rationale: Kennzeichnet, dass das angekündigte Gericht weitergeht; „noch“ ist knapp und entspricht dem prophetischen Zusammenhang.
- source_word: הַיֹּרֵשׁ
  choice: einen, der dich in Besitz nimmt
  rationale: Das Wort von ירשׁ kann einen Erben, Besitzer oder Eroberer bezeichnen. Die Umschreibung hält den Gedanken der Besitzergreifung fest und passt zum Gericht durch Eroberung, ohne die Bedeutung auf ein genealogisches Erbe einzuengen.
- source_word: אָבִי לָךְ
  choice: werde ich … über dich bringen
  rationale: Der Hifil von בוא mit ל bezeichnet hier im Gerichtskontext das Heranbringen einer feindlichen Macht; „über dich bringen“ gibt diese feindliche Stoßrichtung natürlich wieder.
- source_word: יוֹשֶׁבֶת מָרֵשָׁה
  choice: du Bewohnerin von Marescha
  rationale: Das feminine Singularpartizip redet die personifizierte Stadt beziehungsweise ihre Bewohnerschaft direkt an. Die Anrede mit „du“ macht dies im Deutschen deutlich.
- source_word: עַד עֲדֻּלָּם
  choice: bis nach Adullam
  rationale: עַד bezeichnet hier die räumliche Erstreckung einer Bewegung bis zu diesem Ort.
- source_word: יָבוֹא
  choice: wird … kommen
  rationale: Bewahrt die einfache Bewegungsangabe des hebräischen Verbs בוא.
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: die Herrlichkeit Israels
  rationale: „Herrlichkeit“ bewahrt die Bedeutungsbreite von כָּבוֹד, das auch Ehre, Pracht, Reichtum oder die angesehenen Personen des Volkes bezeichnen kann.
theological_decisions:
- issue: Bezug von „die Herrlichkeit Israels“
  choice: Die offene, wörtliche Formulierung „die Herrlichkeit Israels“ bleibt im Haupttext stehen.
  alternative: „die Vornehmen Israels“, „der Reichtum Israels“ oder „Israels Pracht“
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob führende Personen, Besitz oder die Pracht des Volkes gemeint sind. Die Übersetzung wahrt diese Spannung.
- issue: Identität dessen, der Marescha in Besitz nimmt
  choice: Als „einen, der dich in Besitz nimmt“ wiedergegeben, ohne ihn näher zu identifizieren.
  alternative: „einen Erben“, „einen Besitzer“ oder „einen Eroberer“
  rationale: Der Kontext spricht für eine feindliche Besitzergreifung, doch das hebräische Wort umfasst auch Erben und Besitzer. Eine nähere historische oder theologische Identifikation wäre eine unbelegte Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierende feminine Anrede der Stadt wird mit „du Bewohnerin“ sichtbar gemacht. Der inhaltlich nicht nachbildbare hebräische Wortklang zwischen Besitzergreifer und Marescha wird in der Fußnote erläutert; die Mehrdeutigkeit von כְּבוֹד bleibt erhalten.
