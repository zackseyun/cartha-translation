  terminology: „Berge“, „Täler“, „Wachs“, „Feuer“ und „Wasser“ sind treffende und registergerechte Entsprechungen. „Sich spalten“ gibt die reflexiv/mediale Dynamik von יִתְבַּקָּעוּ gut wieder. Es bestehen keine problematischen theologischen Festlegungen oder Namensfragen.
