  source_fidelity: 'Die Übersetzung gibt die hebräischen Prädikate und Bildfelder zuverlässig wieder: Berge „schmelzen“, Täler „spalten sich“, und die beiden Vergleiche mit Wachs vor Feuer sowie hinabgegossenem Wasser bleiben erhalten. „Unter ihm“ bewahrt den pronominalen Bezug auf den HERRN aus dem vorherigen Vers, ohne ihn unnötig zu explizieren. Die passivische Nuance von מֻגָּרִים ist in „hinabgegossen wird“ angemessen wiedergegeben.'
