source:
  edition: WLC
  text: וְ/נָמַ֤סּוּ הֶֽ/הָרִים֙ תַּחְתָּ֔י/ו וְ/הָ/עֲמָקִ֖ים יִתְבַּקָּ֑עוּ כַּ/דּוֹנַג֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ כְּ/מַ֖יִם מֻגָּרִ֥ים בְּ/מוֹרָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: de
  text: Die Berge werden unter ihm schmelzen, und die Täler werden sich spalten wie Wachs vor dem Feuer, wie Wasser, das einen Abhang hinabgegossen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: werden schmelzen
  rationale: נמס bezeichnet ein Schmelzen oder Sichauflösen. „Schmelzen“ ist im Deutschen natürlich und wird durch den anschließenden Vergleich mit Wachs gestützt.
- source_word: הֶהָרִים
  choice: die Berge
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: תַּחְתָּיו
  choice: unter ihm
  rationale: Die Präposition mit Suffix verweist auf den HERRN im vorausgehenden Vers. „Unter ihm“ bewahrt den pronominalen Zusammenhang und das räumliche Bild.
- source_word: וְהָעֲמָקִים
  choice: und die Täler
  rationale: עֲמָקִים bezeichnet Täler oder tiefe Orte. „Täler“ ist die geläufige Entsprechung und bildet den natürlichen Gegensatz zu den Bergen.
- source_word: יִתְבַּקָּעוּ
  choice: werden sich spalten
  rationale: Die Form beschreibt ein Auseinanderbrechen oder Sichspalten. Die reflexive deutsche Form gibt das dramatische Geschehen prägnant wieder, ohne einen handelnden Urheber hinzuzufügen.
- source_word: כַּדּוֹנַג
  choice: wie Wachs
  rationale: דּוֹנַג bedeutet „Wachs“; der Vergleich wird unmittelbar und bildhaft wiedergegeben.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: vor dem Feuer
  rationale: Die Wendung bezeichnet hier die Einwirkung beziehungsweise Gegenwart des Feuers. „Vor dem Feuer“ ist knapp, idiomatisch und bewahrt das Bild.
- source_word: כְּמַיִם
  choice: wie Wasser
  rationale: Obwohl מַיִם formal pluralisch ist, wird das Stoffwort im modernen Deutschen idiomatisch im Singular gebraucht. Das Bild einer fließenden Wassermasse bleibt erhalten.
- source_word: מֻגָּרִים
  choice: das … hinabgegossen wird
  rationale: Das passive Partizip von נגר bezeichnet Wasser, das zum Fließen gebracht beziehungsweise ausgegossen wird. Die passive Form der Vorlage bleibt erhalten.
- source_word: בְּמוֹרָד
  choice: einen Abhang hinab
  rationale: מוֹרָד bezeichnet einen Abstieg oder Abhang. Die Formulierung bringt die abwärts gerichtete Bewegung in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Bezug des Pronomens in „unter ihm“
  choice: Das Pronomen bleibt stehen und bezieht sich im Zusammenhang auf den HERRN aus Micha 1,3.
  alternative: Den Bezug durch „unter dem HERRN“ ausdrücklich machen.
  rationale: Der unmittelbare Kontext identifiziert den Kommenden eindeutig. Die pronominale Wiedergabe bewahrt zugleich die Kohäsion und Zurückhaltung des hebräischen Textes.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer poetischer Parallelität. Die Zukunftsformen entsprechen dem prophetischen Zusammenhang; die beiden Vergleiche bleiben eng und rhythmisch aneinandergefügt.
