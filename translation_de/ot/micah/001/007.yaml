revisions:
- from: Alle ihre geschnitzten Bilder werden zerschlagen[a], und all ihr Dirnenlohn wird im Feuer verbrannt; alle ihre Götzen werde ich verwüsten. Denn aus Dirnenlohn hat sie sie zusammengetragen[b], und zu Dirnenlohn werden sie wieder werden[c].
  to: Alle ihre geschnitzten Bilder werden zerschlagen[a], und alle ihre Hurenlöhne[b] werden im Feuer verbrannt; alle ihre Götzen werde ich verwüsten. Denn aus Hurenlohn hat sie sie zusammengetragen, und zu Hurenlohn werden sie zurückkehren[c].
  rationale: Die Revision stellt die ausdrückliche Rückkehr-Aussage des hebräischen Schlussverbs wieder her und bewahrt die alternative Deutung in der Fußnote. Sie gibt den Plural der ersten Lohnbezeichnung wieder, verwendet eine moderne, bewusst scharfe Entsprechung für die prophetische Prostitutionsmetapher und korrigiert die Fußnotenankerung sowie die zitierte grammatische Form.
