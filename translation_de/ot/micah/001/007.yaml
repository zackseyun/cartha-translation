review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge der hebräischen Aussage, die weibliche Personifizierung Samarias und die wiederholte Prostitutionsmetapher grundsätzlich treffend wieder. Die Schlussformulierung „werden sie wieder werden“ ist jedoch keine tragfähige Wiedergabe von יָשׁוּבוּ („werden zurückkehren“); sie verwischt den ausdrücklich vorhandenen Rückkehrgedanken. Die Pluralform אֶתְנַנֶּיהָ sollte außerdem im ersten Vorkommen als Plural erscheinen.
  naturalness: „Dirnenlohn“ ist verständlich, wirkt im heutigen Standarddeutsch aber literarisch-veraltet. „Hurenlohn“ bewahrt die absichtlich scharfe Sprache des Textes deutlicher und ist zugleich idiomatischer. Die neue Schlussfassung ist natürliches, verständliches Deutsch, ohne die Metapher zu erklären.
  terminology: „Geschnitzte Bilder“, „Götzen“, „zerschlagen“ und „im Feuer verbrannt“ sind quellentreu. „Hurenlöhne“ gibt den hebräischen Plural wieder; „Hurenlohn“ in den beiden folgenden, singulären Wendungen entspricht dem jeweiligen hebräischen Singular. Die Fußnote zur metaphorischen Bedeutung wird unmittelbar bei dem Ausdruck verankert, den sie erläutert.
  issues:
  - severity: high
    issue: Die Wendung „zu Dirnenlohn werden sie wieder werden“ verfehlt die Grundbedeutung von יָשׁוּבוּ.
    rationale: שוב bedeutet hier zunächst „zurückkehren“. Das doppelte „werden“ ist im Deutschen zudem stilistisch fehlerhaft und macht aus der möglichen alternativen Deutung die Hauptlesart.
  - severity: medium
    issue: „all ihr Dirnenlohn“ nivelliert den hebräischen Plural אֶתְנַנֶּיהָ.
    rationale: Die erste Nennung bezeichnet mehrere Einnahmen bzw. Löhne; eine pluralische deutsche Form erhält diesen Unterschied gegenüber den späteren Singularformen.
  - severity: low
    issue: Die Fußnote b ist an „sie“ statt an der Metapher „Dirnenlohn“ verankert; die Alternativform in Fußnote a ist grammatisch nicht passend zitiert.
    rationale: Die Ankerung sollte die erläuterte Wendung unmittelbar markieren. Als Alternative zu „geschnitzten Bildern“ lautet die Zitatform „geschnitzte Götzenbilder“.
  revised_text: Alle ihre geschnitzten Bilder werden zerschlagen[a], und alle ihre Hurenlöhne[b] werden im Feuer verbrannt; alle ihre Götzen werde ich verwüsten. Denn aus Hurenlohn hat sie sie zusammengetragen, und zu Hurenlohn werden sie zurückkehren[c].
