source:
  edition: WLC
  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: de
  text: Alle ihre geschnitzten Bilder werden zerschlagen[a], und alle ihre Hurenlöhne[b] werden im Feuer verbrannt; alle ihre Götzen werde ich verwüsten. Denn aus Hurenlohn hat sie sie zusammengetragen, und zu Hurenlohn werden sie zurückkehren[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geschnitzte Götzenbilder“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist bildhaft der Reichtum, den Samaria durch ihre Untreue im Götzendienst erworben hat.
    reason: cultural_note
  - marker: c
    text: 'Oder: „und sie werden wieder zu Hurenlohn werden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: ihre geschnitzten Bilder
  rationale: Bewahrt den konkreten Sinn von פֶּסֶל als geschnitztes oder behauenes Kultbild; die Fußnote nennt die idiomatisch eindeutigere Alternative.
- source_word: יֻכַּתּוּ
  choice: werden zerschlagen
  rationale: Die passive Form bezeichnet gewaltsame Zerstörung; „zerschlagen“ ist würdig, anschaulich und quellentreu.
- source_word: אֶתְנַנֶּיהָ / אֶתְנַן זוֹנָה
  choice: ihr Dirnenlohn / aus Dirnenlohn / zu Dirnenlohn
  rationale: אֶתְנַן bezeichnet den Lohn für Prostitution. „Dirnenlohn“ erhält die scharfe prophetische Metapher knapp und verständlich.
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: wird im Feuer verbrannt
  rationale: Gibt sowohl das Verb als auch die ausdrückliche Feuerangabe natürlich wieder.
- source_word: עֲצַבֶּיהָ
  choice: ihre Götzen
  rationale: Bezeichnet hier Götzenbilder; die Wortwahl erhält die semantische Überschneidung mit פְּסִילֶיהָ, ohne beide Ausdrücke gleich wiederzugeben.
- source_word: אָשִׂים שְׁמָמָה
  choice: werde ich verwüsten
  rationale: Gibt die vom Sprecher bewirkte Verödung idiomatisch und mit der erforderlichen Härte wieder.
- source_word: קִבָּצָה
  choice: hat sie sie zusammengetragen
  rationale: Das feminine Subjekt ist das personifizierte Samaria; das zweite „sie“ verweist grammatisch auf die zuvor genannten Gegenstände oder Vermögenswerte.
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: und zu Dirnenlohn werden sie wieder werden
  rationale: Die Konstruktion mit עַד und שוב kann als Rückkehr in den Bereich beziehungsweise Status von Dirnenlohn verstanden werden. Diese Wiedergabe bewahrt den Wiederkehrgedanken und klingt im Deutschen natürlicher als „zu ... zurückkehren“.
theological_decisions:
- issue: Prostitutionsmetapher für Götzendienst und den damit verbundenen Reichtum
  choice: Die Bezeichnung „Dirnenlohn“ bleibt ausdrücklich im Haupttext erhalten.
  alternative: Eine deutende Abschwächung wie „unrechtmäßiger Gewinn“ oder „Götzendienstertrag“.
  rationale: Der hebräische Text wiederholt אֶתְנַן und זוֹנָה bewusst. Eine Abschwächung würde die prophetische Anklage und ihre theologische Spannung vermindern.
- issue: Personifizierung Samarias
  choice: Die femininen Formen werden mit „ihre“ und „sie“ bewahrt.
  alternative: Sachliche Wiedergabe mit „seine“ beziehungsweise „es“ für die Stadt.
  rationale: Samaria wird im Kontext als weibliche Stadtgestalt personifiziert; diese Bildsprache trägt zugleich die Prostitutionsmetapher.
- issue: Deutung des letzten Satzglieds
  choice: „zu Dirnenlohn werden sie wieder werden“ steht im Haupttext.
  alternative: „zum Dirnenlohn werden sie zurückkehren“.
  rationale: Das Hebräische lässt Spannung zwischen Rückkehr und erneutem Werden beziehungsweise erneuter Verwendung als Dirnenlohn zu. Die gewählte Fassung ist im Deutschen verständlich; die formnähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Ton. „Dirnenlohn“ ist knapp und literarisch, aber weiterhin verständlich; es bewahrt die anstößige Schärfe des Originals. Die Satzstellung „alle ihre Götzen werde ich verwüsten“ hebt den Wechsel zur ersten Person hervor.
