  source_fidelity: 'Der Entwurf gibt die hebräische Überschrift vollständig und sachgerecht wieder: דְּבַר־יְהוָה als „Das Wort Jahwes“, die Empfangsformel als „an Micha ... erging“, die regnale Datierung, das Gentiliz in verständlicher Herkunftsform sowie die zweite Relativbestimmung zu dem geschauten Wort. Die Reihenfolge „das ... erging und das er ... schaute“ entspricht den beiden hebräischen Relativsätzen und wahrt die bewusst visionäre Ausdrucksweise von חָזָה.'
