  terminology: „Jahwe“, „Micha“, „Moreschet“, „Jotam“, „Ahas“, „Hiskia“, „Juda“, „Samaria“ und „Jerusalem“ entsprechen etabliertem deutschem Bibelgebrauch. „Über“ lässt den weiten Gegenstandsbezug von עַל bestehen; die Fußnote nennt ohne Überdeutung die im Kontext mögliche adversative Lesart.
