id: MIC.1.1
reference: Micah 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: de
  text: Das Wort Jahwes, das in den Tagen Jotams, Ahas’ und Hiskias, der Könige von Juda, an Micha aus Moreschet[a] erging und das er über[b] Samaria und Jerusalem schaute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Moreschetiter“, also ein Mann aus Moreschet.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gegen Samaria und Jerusalem“. Die hebräische Präposition kann sowohl den Gegenstand als auch, besonders im Gerichtskontext, die gegen jemanden gerichtete Aussage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: Die feste prophetische Formel bleibt erhalten. „Wort“ gibt דָּבָר wieder, während „Jahwes“ den im hebräischen Text stehenden Gottesnamen als Eigennamen bewahrt.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das … an Micha … erging
  rationale: Die prophetische Wendung wird im Deutschen idiomatisch mit „an jemanden ergehen“ wiedergegeben und bezeichnet den Empfang göttlicher Offenbarung.
- source_word: מִיכָה הַמֹּרַשְׁתִּי
  choice: Micha aus Moreschet[a]
  rationale: Der Personenname folgt der üblichen deutschen Form. Das Gentiliz wird im Haupttext verständlich als Herkunftsangabe ausgedrückt; die wörtlichere Form steht in der Fußnote.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Die im Hebräischen übliche Datierungsformel wird formal nah und zugleich verständlich wiedergegeben.
- source_word: יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Jotams, Ahas’ und Hiskias
  rationale: Verwendet die etablierten deutschen Namensformen und kennzeichnet durch den Genitiv die Zugehörigkeit zu „Tagen“.
- source_word: מַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Die Apposition zum vorangehenden Namensverzeichnis wird unmittelbar und natürlich wiedergegeben.
- source_word: אֲשֶׁר חָזָה
  choice: und das er … schaute
  rationale: „Schaute“ bewahrt die prophetische Bildsprache von חזה und die auffällige Aussage, dass Micha das „Wort“ sah, ohne sie erklärend aufzulösen.
- source_word: עַל
  choice: über[b]
  rationale: „Über“ lässt wie die hebräische Präposition sowohl den Gegenstandsbezug als auch im Gerichtskontext eine gegen die Städte gerichtete Aussage zu.
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: Samaria und Jerusalem
  rationale: Die herkömmlichen deutschen Ortsnamen geben die ausdrücklich genannten Städte wieder, ohne ihre mögliche stellvertretende Bedeutung für die beiden Reiche in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Wiedergabe und ersetzt ihn nicht durch einen Titel.
- issue: Bezug und Aussage von עַל
  choice: über
  alternative: gegen
  rationale: Die Präposition kann das Thema der Schau bezeichnen, im Gerichtszusammenhang aber auch eine feindliche beziehungsweise anklagende Ausrichtung tragen. „Über“ bewahrt diese Spannung; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bewahrt den Charakter einer prophetischen Überschrift. „Erging“ und „schaute“ sind gehoben, aber im biblisch-prophetischen Zusammenhang weiterhin gut verständlich; die ungewöhnliche Verbindung von „Wort“ und „schauen“ bleibt bewusst stehen.
