source:
  edition: WLC
  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: de
  text: Darum will ich klagen und heulen; entblößt und nackt will ich gehen[a]. Ich will klagen wie die Schakale und trauern wie die Töchter des Straußes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „barfuß und nackt“. Das mit „entblößt“ wiedergegebene hebräische Wort ist schwierig und kann das Barfußgehen als Zeichen von Trauer und Erniedrigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Töchter des Straußes“ ist wörtlich wiedergegeben; die hebräische poetische Wendung bezeichnet Strauße oder Straußenweibchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Darum
  rationale: Die Wendung bezeichnet die zuvor genannte Ursache der Klage. „Darum“ gibt den Zusammenhang knapp und idiomatisch wieder.
- source_word: אֶסְפְּדָה וְאֵילִילָה
  choice: will ich klagen und heulen
  rationale: ספד bezeichnet das Klagen, besonders im Trauerzusammenhang; ילל meint ein lauteres, durchdringendes Heulen oder Wehgeschrei. Die zwei deutschen Verben erhalten diese Steigerung.
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: entblößt und nackt will ich umhergehen
  rationale: עָרוֹם bedeutet eindeutig „nackt“. Das schwierige שילל bezeichnet wahrscheinlich einen entblößten oder beraubten Zustand, kann aber auch als „barfuß“ verstanden werden. „Entblößt und nackt“ wahrt die auffällige Doppelung und den Gedanken öffentlicher Erniedrigung; die wichtige Alternative steht in der Fußnote.
- source_word: אֶעֱשֶׂה מִסְפֵּד
  choice: Ich will klagen
  rationale: Wörtlich wird eine Klage „gemacht“ oder „erhoben“. Das verbale „klagen“ ist im heutigen Deutsch natürlicher und bewahrt den Sinn.
- source_word: כַּתַּנִּים
  choice: wie die Schakale
  rationale: תַּנִּים bezeichnet hier am wahrscheinlichsten Schakale, deren weithin hörbare Rufe zu der poetischen Klageszene passen.
- source_word: וְאֵבֶל
  choice: und trauern
  rationale: אֵבֶל bezeichnet Trauer beziehungsweise Trauern. „trauern“ unterscheidet diesen Ausdruck leicht von der vorherigen „Klage“.
- source_word: כִּבְנוֹת יַעֲנָה
  choice: wie die Töchter des Straußes
  rationale: Die Wiedergabe folgt dem wörtlichen poetischen Bild „Töchter des Straußes“, statt es im Haupttext zu „Strauße“ einzuebnen. Die Bedeutung wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „will ich“ gibt die entschlossene, persönliche Klage der hebräischen Kohortativformen wieder. Das drastische Bild „entblößt und nackt“ sowie die ungewöhnliche Wendung „Töchter des Straußes“ bleiben bewusst erhalten.
