review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die beiden femininen Imperative, den Traueranlass, die Exilierung und die Absonderung von der angeredeten Gemeinschaft grundsätzlich zutreffend wieder. Die Formulierung „so groß wie die des Adlers“ macht jedoch den Vergleich zu einer konkreten kahlen Stelle des Adlers und ist sowohl stilistisch als auch angesichts der unsicheren Vogelbestimmung problematisch. Die hebräische Bildsprache zielt auf auffällige bzw. ausgedehnte Kahlheit.
  naturalness: „Schere dich kahl“ ist verständlich, aber „Schere dir den Kopf kahl“ ist im heutigen Standarddeutsch idiomatischer. „In die Verbannung gezogen“ wirkt weniger natürlich und kann unnötig freiwilliges Wegziehen nahelegen; „ins Exil gegangen“ ist näher am hebräischen Exilwortfeld und flüssiger.
  terminology: „Geliebte Kinder“ ist als natürliche Wiedergabe von „Kinder deiner Wonnen/deiner Freude“ vertretbar. Für נֶשֶׁר wird hier „Geier“ im Haupttext gewählt, weil der Vergleich mit Kahlheit dadurch im Deutschen sachlich nachvollziehbar bleibt; die traditionelle Alternative „Adler“ wird in der Fußnote ausdrücklich erhalten.
  issues:
  - severity: medium
    issue: Der Vergleich „wie die des Adlers“ ist im Deutschen semantisch und zoologisch missverständlich.
    rationale: Er ergänzt eine angebliche kahle Stelle des Adlers, während das Hebräische die eigene Kahlheit mit נֶשֶׁר vergleicht. Da נֶשֶׁר auch einen Geier bezeichnen kann und der Vergleich gerade die auffällige Kahlheit betrifft, sollte die Übersetzung dies klar und ohne sachwidrige Implikation formulieren.
  - severity: low
    issue: „in die Verbannung gezogen“ ist unnötig markiert.
    rationale: גָּלוּ bezeichnet das Ins-Exil-Gehen bzw. Exiliertsein. „ins Exil gegangen“ bewahrt die Perfektbedeutung und ist modernes, unauffälliges Standarddeutsch.
