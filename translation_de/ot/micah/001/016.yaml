  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: de
  text: Schere dir den Kopf kahl und schneide dir das Haar ab wegen deiner geliebten Kinder! Vergrößere deine Glatze wie die eines Geiers[a], denn sie sind von dir fort ins Exil gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Adlers“. Das hebräische Wort נֶשֶׁר kann einen großen Aasvogel bezeichnen und nicht nur einen Adler; der Vergleich bezieht sich jedenfalls auf auffällige Kahlheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  choice: Schere dich kahl
  rationale: Der feminine Singularimperativ bezeichnet das Kahlscheren als Trauerhandlung. Die Formulierung ist direkt, verständlich und bewahrt das konkrete Bild.
- source_word: וָגֹזִּי
  choice: und schneide dir das Haar ab
  rationale: גזז bedeutet wörtlich „scheren/abschneiden“. Im Parallelismus bezeichnet es eine weitere Trauerhandlung; die deutsche Wendung vermeidet eine unnatürliche Wiederholung von „scheren“.
- source_word: עַל
  choice: wegen
  rationale: עַל bezeichnet hier den Anlass der Klage beziehungsweise Trauer.
- source_word: בְּנֵי תַּעֲנוּגָיִךְ
  choice: deiner geliebten Kinder
  rationale: Die wörtliche Wendung „Kinder deiner Wonne“ bezeichnet die Kinder, an denen die Angesprochene Freude hat. „Geliebte Kinder“ gibt die emotionale Beziehung natürlich wieder, ohne בנים auf Söhne einzuengen.
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: Mach deine kahle Stelle so groß
  rationale: Der Imperativ רחב fordert dazu auf, die durch das Scheren entstandene kahle Fläche zu vergrößern. „Kahle Stelle“ ist im Deutschen anschaulicher und idiomatischer als das abstrakte „Kahlheit“.
- source_word: כַּנֶּשֶׁר
  choice: wie die des Adlers
  rationale: נֶשֶׁר wird traditionell mit „Adler“ wiedergegeben, kann aber auch einen großen Geier bezeichnen. Das ergänzte „die des“ macht deutlich, dass die kahle Stelle verglichen wird.
- source_word: כִּי גָלוּ
  choice: denn sie sind ... in die Verbannung gezogen
  rationale: Das Qal von גלה bezeichnet das Fortziehen beziehungsweise Weggeführtwerden ins Exil. Die Formulierung hält sowohl die vollendete Handlung als auch das Verbannungsmotiv fest.
- source_word: מִמֵּךְ
  choice: von dir fort
  rationale: Die Präposition bezeichnet die Trennung von der als Frau angeredeten Stadt oder Gemeinschaft; „fort“ macht diese Trennung im Deutschen deutlich.
