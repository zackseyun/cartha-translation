  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: de
  text: Denn die Stadt Marot windet sich nach Gutem[a]; denn vom HERRN ist Unheil bis zum Tor Jerusalems herabgekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung lautet wörtlich etwa: „ist krank/windet sich für Gutes“. Die Verbindung ist ungewöhnlich; sie kann qualvolle Sehnsucht oder Erwartung des Guten ausdrücken.'
    reason: Die Anmerkung dokumentiert die ungewöhnliche Verbindung חָלָה לְטוֹב und bewahrt ihre Deutungsoffenheit, ohne die Hauptübersetzung zu überladen.
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: windet sich und hofft auf Gutes
  rationale: חָלָה bezeichnet gewöhnlich das Krank- oder Schwachsein und vermittelt hier körperlich zugespitzte Qual; לְטוֹב richtet diese Qual auf das ersehnte Gute. Die Formulierung bewahrt beide Aspekte, ohne die ungewöhnliche Wendung auf bloßes Warten zu reduzieren.
- source_word: יוֹשֶׁבֶת מָרוֹת
  choice: die Bewohnerin von Marot
  rationale: Das feminine Singularpartizip wird formal als kollektive Personifikation der Stadt beziehungsweise ihrer Einwohnerschaft wiedergegeben.
- source_word: רָע
  choice: Unheil
  rationale: Im Kontext bezeichnet רָע kein moralisch böses Handeln, sondern hereinbrechendes Unglück beziehungsweise Gericht.
- source_word: מֵאֵת יְהוָה
  choice: vom HERRN
  rationale: מֵאֵת kennzeichnet den Ursprung beziehungsweise Urheber; der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: יָרַד ... לְשַׁעַר
  choice: ist ... bis zum Tor ... herabgekommen
  rationale: Die räumliche Bewegung von יָרַד und das Erreichen des Stadttores werden anschaulich und nah am hebräischen Satzbau wiedergegeben.
theological_decisions:
- issue: Das Unheil kommt von JHWH
  choice: den göttlichen Ursprung ausdrücklich stehen lassen
  alternative: das Unheil nur als von Gott zugelassen oder nicht näher verursacht darstellen
  rationale: Der hebräische Text sagt ausdrücklich מֵאֵת יְהוָה. Eine Abschwächung auf bloße Zulassung würde die theologische Spannung des Verses auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierende feminine Einzahl „Bewohnerin“ folgt bewusst dem Hebräischen. „Windet sich und hofft“ klingt verständlich, bewahrt aber die Härte und Ungewöhnlichkeit der Ausgangsformulierung; die Fußnote dokumentiert die echte lexikalische Spannung.
