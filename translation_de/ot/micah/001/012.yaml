  source_fidelity: Die Übersetzung gibt die Satzstruktur, den doppelten Begründungszusammenhang, den göttlichen Ursprung des Unheils und dessen Vordringen bis zum Tor Jerusalems zutreffend wieder. חָלָה לְטוֹב ist jedoch eine ungewöhnliche und semantisch nicht vollständig eindeutige Verbindung. Die Hauptfassung darf die Qual und die Ausrichtung auf das Gute verbinden, sollte dies aber nicht durch eine zu bestimmte zusätzliche Hoffnungsaussage weiter auslegen.
  naturalness: „Die Bewohnerin von Marot“ ist als feminine Personifikation verständlich, kann im modernen Deutsch aber unnötig den Eindruck einer einzelnen weiblichen Einwohnerin erzeugen. „Die Stadt Marot“ bewahrt die feminine Singularform und ist idiomatischer. Die knappe Formulierung „windet sich nach Gutem“ erhält die absichtlich ungewöhnliche Bildlichkeit, ohne mit „und hofft“ eine zusätzliche explizite Aussage einzutragen.
  terminology: „Unheil“ trifft רָע im Kontext gut. „HERR“ ist eine etablierte deutsche Wiedergabe des Tetragramms. „Marot“ und „Jerusalem“ sind angemessene deutsche Namensformen.
