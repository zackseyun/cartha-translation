  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵן֙ תִּתְּנִ֣י שִׁלּוּחִ֔ים עַ֖ל מוֹרֶ֣שֶׁת גַּ֑ת בָּתֵּ֤י אַכְזִיב֙ לְ/אַכְזָ֔ב לְ/מַלְכֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: de
  text: Darum wirst du Abschiedsgaben für Moreschet-Gat geben[a]; die Häuser Achsibs werden sich für die Könige Israels als trügerisch erweisen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gaben zur Entlassung“; das hebräische Wort bezeichnet Gaben beim Wegschicken und kann möglicherweise an eine Scheidung erinnern.
    reason: lexical_alternative
  - marker: b
    text: 'Achsib klingt im Hebräischen ähnlich wie das Wort für „Täuschung“, „Lüge“ oder „Enttäuschung“. So entsteht ein Wortspiel: Die Häuser Achsibs werden die Könige Israels enttäuschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als geläufige Folgerungspartikel die angekündigte Konsequenz aus den vorangehenden Gerichtsworten ein.
- source_word: תִּתְּנִי
  choice: wirst du … geben
  rationale: Das Qal-Imperfekt in der 2. Person Singular Femininum wird als prophetische Zukunftsaussage wiedergegeben; der weibliche Bezug bleibt wie im Hebräischen unausgesprochen.
- source_word: שִׁלּוּחִים
  choice: Abschiedsgaben
  rationale: Bezeichnet Gaben beim Wegschicken oder Abschied. Die Wiedergabe wahrt diesen Sinn, ohne die mögliche Anspielung auf eine Entlassung oder Scheidung zum alleinigen Sinn zu machen.
- source_word: עַל מוֹרֶשֶׁת גַּת
  choice: für Moreschet-Gat
  rationale: Die Präposition wird im Zusammenhang mit dem Geben idiomatisch als „für“ wiedergegeben; der zusammengesetzte Ortsname wird transliteriert.
- source_word: בָּתֵּי אַכְזִיב
  choice: die Häuser Achsibs
  rationale: Gibt die Constructusverbindung wörtlich wieder. „Häuser“ kann dabei Häuser, Hausgemeinschaften oder Siedlungen bezeichnen.
- source_word: לְאַכְזָב
  choice: werden sich … als trügerisch erweisen
  rationale: Eine natürliche deutsche Prädikatsformulierung für „zu einer Täuschung/Enttäuschung werden“, die zugleich das Wortspiel mit dem Ortsnamen Achsib vorbereitet.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: für die Könige Israels
  rationale: Das לְ bezeichnet hier, für wen sich Achsib als trügerisch beziehungsweise enttäuschend erweist.
theological_decisions:
- issue: Bezug der weiblichen Singularform תִּתְּנִי
  choice: Der Bezug bleibt im Haupttext unausgesprochen; „du“ bewahrt die grammatische Form und die Ambiguität.
  alternative: Judah, Jerusalem beziehungsweise Zion als Frauengestalt ausdrücklich nennen; alternativ Moreschet-Gat als personifizierte Stadt verstehen.
  rationale: Die Verbform verlangt eine weibliche Singularadressatin, doch der Vers benennt sie nicht ausdrücklich. Eine Konkretisierung würde eine echte Auslegungsfrage vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Abschiedsgaben“ ist verständlich und lässt die genaue Art des Abschieds offen. Die Ortsnamen folgen einer am Hebräischen orientierten deutschen Umschrift; das Wortspiel wird im Text sinngemäß angedeutet und in der Fußnote erläutert.
