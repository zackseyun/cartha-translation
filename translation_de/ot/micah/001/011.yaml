  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: de
  text: Zieh weiter, nackt und in Schande, Bewohnerin von Schafir.[a] Die Bewohnerin von Zaanan ist nicht herausgekommen. Die Trauerklage von Bet-Ezel nimmt euch seinen Standort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Schafir, Zaanan und Bet-Ezel sind Ortsnamen. Micha verwendet wahrscheinlich Wortspiele mit ihrem Klang oder ihrer Bedeutung: Schafir kann an „schön“ erinnern, Zaanan klingt im Hebräischen ähnlich wie „herauskommen“, und Bet-Ezel kann „Haus daneben“ oder „Haus in der Nähe“ nahelegen.'
    reason: cultural_note
  - marker: b
    text: 'Der hebräische Schlusssatz ist schwer zu deuten. Wörtlicher: „Die Trauerklage von Bet-Ezel nimmt euch seinen Standplatz.“ Gemeint sein könnte der Verlust von Beistand, festem Halt oder einer nahen Zuflucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: Zieht weiter
  rationale: Der feminine Singularimperativ richtet sich an die personifizierte Ortschaft, schließt aber ihre Bewohner ein. Der deutsche Plural schafft zusammen mit der Anrede einen natürlichen Übergang zum späteren pluralischen מִכֶּם und kann die erzwungene Weiterbewegung ins Exil ausdrücken; die schwer eigens wiederzugebende Wendung לָכֶם bleibt idiomatisch darin enthalten.
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: ihr Bewohner von Schafir
  rationale: Das feminine Partizip personifiziert die Stadt. Die kollektive deutsche Anrede passt zu „zieht“; der Ortsname wird transliteriert, während das mögliche Wortspiel in der Fußnote erläutert wird.
- source_word: עֶרְיָה בֹשֶׁת
  choice: nackt und in Schande
  rationale: Die Formulierung bewahrt sowohl die körperliche Entblößung als auch die damit verbundene öffentliche Erniedrigung.
- source_word: לֹא יָצְאָה יוֹשֶׁבֶת צַאֲנָן
  choice: Die Bewohnerin von Zaanan ist nicht herausgekommen
  rationale: Die feminine Personifikation und die Mehrdeutigkeit des Herauskommens – etwa zum Kampf, zur Hilfe oder zur Klage – bleiben erhalten. Das Perfekt wird mit gegenwärtiger Relevanz wiedergegeben.
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: Die Totenklage von Bet-Ezel
  rationale: מִסְפַּד bezeichnet eine laute Trauerklage, meist im Zusammenhang mit Tod oder Verwüstung. „Von“ lässt offen, ob in Bet-Ezel oder über Bet-Ezel geklagt wird.
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: nimmt euch euren Halt
  rationale: Der schwierige Schlusssatz wird als Entzug von Halt, Beistand oder Zuflucht verstanden. Das Präsens entspricht dem prophetisch vergegenwärtigenden Kontext; die alternative strukturelle Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung des schwierigen Schlusssatzes
  choice: Die Klage von Bet-Ezel entzieht den Angesprochenen ihren Halt.
  alternative: Die Klage von Bet-Ezel nimmt euch seinen Standort beziehungsweise Standplatz weg.
  rationale: עֶמְדָּתוֹ kann wörtlich einen Standplatz oder übertragen festen Halt bezeichnen. Der Kontext benachbarter, einander nicht mehr helfender Orte stützt die übertragene Wiedergabe, ohne sie als einzig mögliche Deutung auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen folgen einer gut lesbaren deutschen Transliteration. Der poetische Ortsnamensound bleibt im Haupttext unangetastet und wird in einer Fußnote erklärt. Die wechselnde kollektive und feminine Personifikation wird soweit möglich bewahrt.
