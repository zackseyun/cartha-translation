base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: de
  text: In Gat erzählt es nicht! Weint überhaupt nicht![a] In Bet-Le-Afra[b] wälze dich im Staub![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach der masoretischen Vokalisierung verstärkt ein Infinitiv absolut das Verbot: „Weint überhaupt nicht!“ Einige deuten die Wortfolge als Anspielung auf den Ortsnamen Akko und übersetzen: „In Akko weint nicht.“'
    reason: alternative_reading
  - marker: b
    text: Bet-Le-Afra klingt wie „Haus des Staubes“ und bildet ein Wortspiel mit dem folgenden „Staub“.
    reason: cultural_note
  - marker: c
    text: 'Der Konsonantentext (Ketiv) lautet: „Ich habe mich gewälzt.“ Die traditionelle Lesung (Qere) und der Zusammenhang verstehen die Form als Aufforderung: „Wälze dich!“'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: In Gat
  rationale: Der Ortsname wird in üblicher deutscher Form wiedergegeben; בְּ bezeichnet hier den Ort, an dem die Nachricht nicht verbreitet werden soll.
- source_word: אַל תַּגִּידוּ
  choice: erzählt es nicht
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten, erzählen“. Das im Hebräischen unausgesprochene Objekt wird im Deutschen knapp mit „es“ ergänzt; so bleibt auch der Anklang an 2. Samuel 1,20 erhalten.
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: Weint überhaupt nicht!
  rationale: Nach der masoretischen Vokalisierung steht der Infinitivus absolutus von בכה vor einem verneinten Imperfekt desselben Verbs und verstärkt das Verbot. „Überhaupt nicht“ gibt diese Emphase in natürlichem Deutsch wieder.
- source_word: בְּבֵית לְעַפְרָה
  choice: In Bet-Le-Afra
  rationale: Der Ortsname wird transliteriert statt übersetzt. Seine lautliche und semantische Beziehung zu עָפָר („Staub“) wird in einer Fußnote erläutert.
- source_word: עָפָר
  choice: Staub
  rationale: „Staub“ ist die naheliegende Bedeutung und bewahrt das Wortspiel mit Bet-Le-Afra sowie das Bild von Trauer und Erniedrigung.
- source_word: התפלשתי
  choice: wälze dich
  rationale: Der überlieferte Konsonantentext lässt formal die erste Person Singular erkennen, während Lesetradition und Zusammenhang eine feminine Singularaufforderung an die personifizierte Ortschaft nahelegen. Die Hauptübersetzung folgt diesem kontextuell passenden Verständnis; die schriftliche Form wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Knappe, eindringliche prophetische Sprache mit Ausrufezeichen zur Wiedergabe der Verbote und Aufforderung. Moderne standarddeutsche Ortsnamenschreibung; das schwer übertragbare Ortsnamenwortspiel und die textliche Besonderheit werden transparent in Fußnoten bewahrt.
