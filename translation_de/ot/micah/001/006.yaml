base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: de
  text: Darum werde ich Samaria zu einem Trümmerhaufen auf freiem Feld machen[a], zu einem Ort für Weinberge. Ich werde ihre Steine ins Tal hinabschütten[b] und ihre Fundamente freilegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „zu einem Trümmerhaufen auf dem Feld“. Die hebräische Wendung ist knapp und kann sowohl ein Feld als auch offenes Land bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in die Schlucht hinabschütten“. Das Verb vermittelt wörtlich das Bild, etwas hinabfließen oder hinabströmen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Darum werde ich … machen
  rationale: Das Qal Perfekt mit וְ steht in der prophetischen Ankündigung für ein zukünftiges Handeln. „Darum“ gibt den Folgezusammenhang zum vorangehenden Gerichtswort idiomatisch wieder, ohne eine stärkere Kausalität zu behaupten.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: לְעִי הַשָּׂדֶה
  choice: zu einem Trümmerhaufen auf freiem Feld
  rationale: עִי bezeichnet einen Schutt- oder Trümmerhaufen; שָׂדֶה kann „Feld“ oder offenes Land bedeuten. Die Formulierung bewahrt das Bild der zerstörten Stadt und macht den Gegensatz zur bisherigen Stadtlage verständlich.
- source_word: לְמַטָּעֵי כָרֶם
  choice: zu einem Platz für Weinbergpflanzungen
  rationale: Die kompakte Wendung bezeichnet einen Ort beziehungsweise ein Gelände zum Anpflanzen von Weinbergen. Die deutsche Fassung erhält das landwirtschaftliche Bild.
- source_word: וְהִגַּרְתִּי
  choice: Ich werde … hinabschütten
  rationale: Der Hifil-Stamm von נגר bezeichnet ein Fließen- oder Herabströmenlassen. Bei Steinen vermittelt „hinabschütten“ das konkrete Bild, ohne die Metapher einzuebnen.
- source_word: לַגַּי
  choice: ins Tal
  rationale: גַּי kann ein Tal oder eine Schlucht bezeichnen. „Tal“ ist die zugängliche Grundbedeutung; die engere Möglichkeit wird in einer Fußnote genannt.
- source_word: אֲבָנֶיהָ
  choice: ihre Steine
  rationale: Das feminine Suffix bezieht sich auf Samaria und bewahrt die im Hebräischen angelegte Personifizierung der Stadt.
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: und ihre Fundamente freilegen
  rationale: יְסוֹד bezeichnet die Fundamente; Piel גלה bedeutet „aufdecken, bloßlegen“. „Freilegen“ drückt die vollständige Zerstörung bis auf den Grund anschaulich aus.
theological_decisions:
- issue: Personifizierung Samarias durch feminine Suffixe
  choice: „ihre Steine“ und „ihre Fundamente“
  alternative: „seine Steine“ und „seine Fundamente“ beziehungsweise Wiederholung des Stadtnamens
  rationale: Die feminine Referenz des Hebräischen zeichnet Samaria als personifizierte Stadt. Das feminine Pronomen erhält diese prophetische Bildsprache und kann im Deutschen auf die mitgedachte „Stadt“ bezogen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Zukunftsaussage. Die Zerstörungsbilder bleiben konkret; ungewöhnliche hebräische Bildsprache wird nicht geglättet, sondern knapp und natürlich wiedergegeben.
