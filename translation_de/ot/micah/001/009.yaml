  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: de
  text: 'Denn ihre Wunde ist unheilbar[a]; denn es ist bis nach Juda gekommen, es hat das Tor meines Volkes erreicht: bis nach Jerusalem.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ihre Wunden sind unheilbar.“ Das hebräische Wort für „Wunde“ steht im Plural, kann hier aber kollektiv gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es hat das Tor meines Volkes berührt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: unheilbar
  rationale: Das Adjektiv bezeichnet hier einen verzweifelten, nicht mehr heilbaren Zustand; zusammen mit מַכּוֹתֶיהָ ist „unheilbar“ im Deutschen präzise und natürlich.
- source_word: מַכּוֹתֶיהָ
  choice: ihre Wunde
  rationale: Die Form ist morphologisch Plural, kann aber kollektiv die gesamte Verwundung beziehungsweise Heimsuchung der personifizierten Stadt bezeichnen. Der Singular ergibt mit „ist unheilbar“ einen natürlichen deutschen Satz; die Pluralalternative wird in der Fußnote bewahrt.
- source_word: בָאָה
  choice: das Unheil ist … gekommen
  rationale: Das feminine Verb knüpft an die zuvor bezeichnete Heimsuchung an. „Das Unheil“ macht im Deutschen den voranschreitenden Gegenstand verständlich, ohne die personifizierte Stadt selbst als Reisende darzustellen.
- source_word: עַד יְהוּדָה
  choice: bis nach Juda
  rationale: עַד bezeichnet die erreichte Ausdehnung. Bei einem Gebietsnamen drückt „bis nach Juda“ das Vordringen idiomatisch aus.
- source_word: נָגַע
  choice: es hat … erreicht
  rationale: נגע kann „berühren“ oder „erreichen“ bedeuten. Im Bild des vordringenden Unheils gibt „erreicht“ den räumlichen Zusammenhang treffend wieder; „berührt“ bleibt als Fußnotenalternative erhalten.
- source_word: שַׁעַר
  choice: das Tor
  rationale: Die konkrete Tor-Metapher wird bewahrt; das folgende „Jerusalem“ erläutert, dass das Tor der Stadt beziehungsweise des Volkes gemeint ist.
- source_word: עַמִּי
  choice: meines Volkes
  rationale: Die erste Person und der bundestheologisch gewichtige Ausdruck „mein Volk“ werden unmittelbar bewahrt.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Bezug der femininen Formen und Wechsel des grammatischen Subjekts
  choice: Die feminine Personifikation bleibt in „ihre Wunde“ sichtbar; anschließend wird das vordringende Gericht als „das Unheil“ bezeichnet.
  alternative: Man kann die femininen Formen enger auf die personifizierte Stadt beziehen oder als fortgesetzten Bezug auf ihre Wunden beziehungsweise Heimsuchung verstehen.
  rationale: Der hebräische Text verbindet feminine Personifikation mit einem Wechsel zum maskulinen נָגַע. Die deutsche Fassung macht das voranschreitende Unheil verständlich, ohne die im Hebräischen vorhandene Spannung über den genauen Bezug dogmatisch aufzulösen.
- issue: Bedeutung des erreichten „Tores meines Volkes“
  choice: „Jerusalem“ wird als nachgestellte Konkretisierung des Tores verstanden und formal beibehalten.
  alternative: „Tor meines Volkes“ könnte allgemeiner die Schwelle oder den Zugang zum Gebiet des Volkes bezeichnen.
  rationale: Die Apposition „Jerusalem“ legt nahe, dass Jerusalem selbst als Tor beziehungsweise als Ort des erreichten Tores im Blick steht; die Bildsprache bleibt dennoch wörtlich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ja“ gibt das zweite כִּי als bekräftigende Weiterführung wieder und vermeidet eine schwerfällige doppelte Begründung mit „denn“. Die Wiederholung von עַד wird durch „bis nach“ und „erreicht“ natürlich abgebildet; die abschließende Apposition „Jerusalem“ bleibt erhalten.
