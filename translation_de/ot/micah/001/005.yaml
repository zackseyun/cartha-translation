source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: de
  text: All das geschieht wegen Jakobs Vergehen[a] und wegen der Sünden des Hauses Israel. Was ist Jakobs Vergehen? Ist es nicht Samaria? Und was sind die Kulthöhen Judas[b]? Sind sie nicht Jerusalem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auflehnung“, „Übertretung“ oder „Rebellion“; das hebräische Wort bezeichnet einen Verstoß beziehungsweise Aufruhr gegen Gott.'
    reason: lexical_alternative
  - marker: b
    text: „Kulthöhen“ waren Kultstätten, häufig an erhöhten Orten, die oft mit unerlaubter oder götzendienerischer Verehrung verbunden waren.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/פֶשַׁע
  choice: wegen ... Auflehnung
  rationale: Die Präposition ב ist hier kausal. פשע bezeichnet einen bewussten Bruch mit Gott und kann treffend mit „Auflehnung“ wiedergegeben werden; so bleibt die Bundes- und Rebellionsdimension erhalten.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der ausdrücklich verwendete Eigenname bleibt erhalten und wird nicht zu „Israel“ angeglichen; das wahrt Parallelismus und rhetorische Wirkung.
- source_word: כָּל זֹאת
  choice: All das geschieht
  rationale: „All das“ verweist auf das zuvor angekündigte Gerichtsgeschehen. Das ergänzte „geschieht“ macht den deutschen Satz idiomatisch, ohne den Bezug enger als der hebräische Text festzulegen.
- source_word: וּ/בְ/חַטֹּאות
  choice: und wegen der Sünden
  rationale: Auch hier ist ב kausal; חטאות meint im Anklagekontext „Sünden“, nicht „Sündopfer“.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die formale Wiedergabe bewahrt die nationale und bundestheologische Bezeichnung sowie den Parallelismus mit „Jakob“.
- source_word: מִי
  choice: Wer ist ... verantwortlich?
  rationale: Das hebräische מִי bedeutet formal „wer?“. Die deutsche Formulierung bewahrt diese Personenfrage und verdeutlicht zugleich idiomatisch, dass Samaria beziehungsweise Jerusalem als verantwortliche Zentren benannt werden.
- source_word: פֶשַׁע
  choice: Auflehnung
  rationale: Die Wiederholung desselben deutschen Wortes bildet die hebräische Wiederholung ab und betont den bewussten Widerstand gegen Gott.
- source_word: הֲ/לוֹא
  choice: Ist es nicht ...?
  rationale: Die negative rhetorische Frage erwartet Zustimmung und wird im Deutschen natürlich beibehalten.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Die geläufige deutsche Namensform bezeichnet hier metonymisch die Hauptstadt als Zentrum der Schuld des Nordreichs.
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: Der Ausdruck bezeichnet erhöhte oder als solche verstandene Kultstätten. „Kulthöhen“ ist im Deutschen knapper und deutlicher als das missverständliche „Höhen“ allein.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Geläufige deutsche Form des Stammes- und Reichsnamens.
theological_decisions:
- issue: Bedeutung von פשע
  choice: Auflehnung
  alternative: Vergehen / Übertretung
  rationale: „Auflehnung“ bringt den bewussten Widerstand gegen Gott zur Geltung, ohne eine spezifische konfessionelle Deutung einzutragen; die mögliche stärker rechtliche Wiedergabe wird in der Fußnote genannt.
- issue: Bezug der Fragen auf Samaria und Jerusalem
  choice: Die Hauptstädte werden als verantwortliche und repräsentative Zentren der Auflehnung und des verfehlten Kultes angesprochen.
  alternative: Die Städte selbst werden unmittelbar mit der Auflehnung beziehungsweise den Kulthöhen gleichgesetzt.
  rationale: Das hebräische מִי („wer?“) legt eine personale beziehungsweise metonymische Frage nahe. „Wer ist ... verantwortlich?“ ergibt natürliches Deutsch, wahrt aber, dass die Städte selbst als Antwort erscheinen.
- issue: Plural בָּמוֹת gegenüber der singularischen Antwort Jerusalem
  choice: Der Plural „Kulthöhen“ bleibt erhalten; Jerusalem steht als kollektives Zentrum dafür.
  alternative: 'Glättung zum Singular: „Was ist die Kulthöhe Judas?“'
  rationale: Der masoretische Text hat eindeutig den Plural. Die Spannung zwischen mehreren Kultstätten und der einen Hauptstadt soll nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die Wiederholungen des hebräischen Textes bleiben erhalten. Die Formulierung „Wer ist ... verantwortlich?“ folgt dem wörtlichen Fragewort מִי und macht die metonymische Nennung der Hauptstädte verständlich, ohne sie im Haupttext auszudeuten.
