source:
  edition: WLC
  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: de
  text: 'Denn seht: Der HERR[a] kommt aus seinem Ort hervor; er steigt herab und tritt auf die Höhen der Erde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wo HERR in dieser Form steht, gibt der hebräische Text den Gottesnamen JHWH wieder.
    reason: Macht die Übersetzungskonvention für das Tetragramm transparent.
lexical_decisions:
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp wieder und bewahrt die unmittelbare, eindringliche Wirkung des Hebräischen.
- source_word: יֹצֵא מִמְּקוֹמוֹ
  choice: kommt von seinem Ort hervor
  rationale: Bewahrt sowohl die Bewegung des Herauskommens als auch die bewusst unbestimmte Bezeichnung מָקוֹם („Ort“), ohne sie etwa als Himmel oder Wohnstätte auszudeuten.
- source_word: וְדָרַךְ
  choice: und schreitet
  rationale: Gibt das Treten bzw. Schreiten würdevoll und natürlich wieder; im Zusammenhang zeichnet es das Bild des machtvollen göttlichen Auftretens.
- source_word: במותי אָרֶץ
  choice: die Höhen der Erde
  rationale: „Höhen“ entspricht hier dem räumlichen Bild und lässt die poetische Weite der Formulierung bestehen, ohne vorschnell kultische „Höhenheiligtümer“ anzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen ist allgemein verständlich und wird durch eine Fußnote transparent gemacht; sie ersetzt den Gottesnamen nicht kommentarlos durch einen theologischen Titel.
- issue: Bezug von „seinem Ort“
  choice: unbestimmt belassen
  alternative: „seiner Wohnstätte“ oder „dem Himmel“
  rationale: Der hebräische Text nennt lediglich „seinen Ort“. Eine genauere Lokalisierung würde eine im Vers nicht ausdrücklich vollzogene Deutung festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Aufmerksamkeitsruf bleibt knapp; parallele Verben und das poetische Bild des Herabsteigens und Schreitens werden bewahrt.
