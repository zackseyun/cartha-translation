source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: de
  text: Spann das schnelle Pferd vor den Streitwagen, du Bewohnerin von Lachisch![a] Sie war für die Tochter Zion der Anfang der Sünde;[b][c] denn in dir wurden Israels Vergehen gefunden.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die Anrede auch mit „die in Lachisch Wohnende“ wiedergegeben werden. Das Hebräische gebraucht eine feminine Singularform und stellt die Stadt als Frau dar.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sie war für die Tochter Zion der erste Anlass zur Sünde.“ Gemeint sein kann, dass von Lachisch aus Israels Auflehnung nach Juda gelangte; der genaue historische Vorgang bleibt unausgesprochen.'
    reason: alternative_reading
  - marker: c
    text: „Tochter Zion“ ist eine hebräische poetische Personifikation Zions beziehungsweise Jerusalems.
    reason: cultural_note
  - marker: d
    text: 'Oder: „Übertretungen“ oder „Rebellionen“. Das hebräische Wort kann bewusste Auflehnung und nicht nur allgemeines Fehlverhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  choice: Spann das schnelle Pferd vor den Streitwagen
  rationale: Das Verb bezeichnet das Anschirren beziehungsweise Anspannen. Die im Deutschen natürliche Konstruktion stellt das Pferd vor den Wagen, ohne die sachliche Beziehung des Hebräischen zu verändern. רֶכֶשׁ bezeichnet ein schnelles Reit- oder Zugtier.
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: du Bewohnerin von Lachisch
  rationale: Das feminine Partizip Singular redet die personifizierte Stadt unmittelbar an. Die feminine Form wird im Deutschen ausdrücklich bewahrt.
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: Sie war … der Anfang der Sünde
  rationale: רֵאשִׁית bezeichnet Anfang oder Ausgangspunkt, חַטָּאת hier moralische Sünde und nicht ein Sündopfer. Die Formulierung lässt offen, auf welche historische Weise Lachisch zum Ausgangspunkt wurde.
- source_word: לְבַת צִיּוֹן
  choice: für die Tochter Zion
  rationale: Die Präposition ל wird kontextgemäß mit „für“ wiedergegeben. „Tochter Zion“ bewahrt die poetische Personifikation Jerusalems.
- source_word: כִּי בָךְ נִמְצְאוּ
  choice: denn in dir wurden … gefunden
  rationale: כִּי begründet die Anklage; das feminine Singularpronomen setzt die direkte Anrede Lachischs fort. Der Niphal von מצא wird passiv wiedergegeben.
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: Israels Auflehnungen
  rationale: פֶּשַׁע bezeichnet nicht nur allgemeines Fehlverhalten, sondern bewusste Übertretung oder Auflehnung. „Auflehnungen“ wahrt diesen starken Sinn.
theological_decisions:
- issue: Bedeutung von חַטָּאת in der prophetischen Anklage
  choice: Sünde
  alternative: Sündopfer
  rationale: Der Zusammenhang spricht von Schuld und Auflehnung; eine kultische Opfergabe ist hier nicht gemeint.
- issue: Aussagekraft von רֵאשִׁית חַטָּאת
  choice: Lachisch als Anfang oder Ausgangspunkt der Sünde für die Tochter Zion
  alternative: Lachisch als Hauptsünde oder als erste vom Gericht betroffene Stadt
  rationale: Die Syntax legt Anfang beziehungsweise Ursprung nahe. Die Übersetzung legt jedoch nicht fest, durch welchen konkreten geschichtlichen Vorgang Lachisch diese Rolle einnahm.
translation_notes:
  register: Moderne, gehobene Standardsprache. „Spann … vor“ ist idiomatisches Deutsch für das Anschirren eines Zugtiers; „Bewohnerin“ und die feminine Anrede bewahren die Personifikation Lachischs. Der poetische Ausdruck „Tochter Zion“ bleibt erhalten.
