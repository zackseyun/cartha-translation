  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: de
  text: Hört, all ihr Völker! Hör zu, Erde, mit allem, was sie erfüllt! Der Herr Yahweh[a] sei Zeuge gegen euch[b], der Herr aus seinem heiligen Tempel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Herr JHWH“; Yahweh gibt den Gottesnamen יהוה wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter euch“. Im Zusammenhang ist wahrscheinlich die gerichtliche Bedeutung „gegen euch“ gemeint.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „aus seinem heiligen Palast“ beziehungsweise „aus seinem heiligen Heiligtum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ עַמִּים כֻּלָּם
  choice: Hört, all ihr Völker!
  rationale: Der pluralische Imperativ ist eine feierliche prophetische Aufforderung. „All ihr Völker“ bewahrt die direkte Anrede und den umfassenden Plural von עַמִּים.
- source_word: הַקְשִׁיבִי
  choice: Horche auf
  rationale: Der feminine Singular richtet sich an die personifizierte Erde. „Horche auf“ gibt die nachdrückliche Aufforderung in gehobenem, aber verständlichem Deutsch wieder.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: Erde, mit allem, was dich erfüllt
  rationale: Im Parallelismus mit allen Völkern bezeichnet אֶרֶץ wahrscheinlich die ganze Erde. Die direkte Anrede „dich“ bewahrt die Personifikation; מְלֹאָהּ umfasst alles, was die Erde enthält.
- source_word: וִיהִי
  choice: sei
  rationale: Der Jussiv von היה wird durch den deutschen Konjunktiv I knapp und feierlich wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Die Wiedergabe erhält beide Bestandteile des zusammengesetzten Gottestitels: אֲדֹנָי als „der Herr“ und den Gottesnamen יהוה als „Yahweh“.'
- source_word: בָּכֶם לְעֵד
  choice: Zeuge gegen euch
  rationale: 'עֵד ist ein Rechtsbegriff. בָּכֶם kann örtlich „unter euch“ heißen, hat im gerichtlichen Zusammenhang jedoch wahrscheinlich adversative Bedeutung: Gott tritt als Zeuge gegen die Angeredeten auf.'
- source_word: מֵהֵיכַל קָדְשׁוֹ
  choice: aus seinem heiligen Tempel
  rationale: הֵיכָל kann Tempel, Palast oder Heiligtum bezeichnen. „Tempel“ ist hier die klare, traditionelle Bezeichnung für Gottes heilige Wohnstätte, ohne die anderen Bildnuancen auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der Herr; der Herr HERR
  rationale: „Der Herr Yahweh“ macht sowohl den Herrschaftstitel als auch den im hebräischen Text stehenden Eigennamen sichtbar und vermeidet, יהוה durch einen zweiten Titel zu ersetzen.
- issue: Gerichtliche oder örtliche Bedeutung von בָּכֶם
  choice: gegen euch
  alternative: unter euch
  rationale: Die Zeugenmetaphorik und der folgende Gerichtskontext sprechen für die gerichtliche Bedeutung „gegen euch“. Da die Präposition auch örtlich verstanden werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- issue: Umfang von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Die parallele Anrede an alle Völker und an alles, was die Erde erfüllt, legt einen universalen Horizont näher als die Beschränkung auf ein einzelnes Land.
translation_notes:
  register: Feierlich-prophetischer, zugleich moderner Standardstil. Die Imperative und der Konjunktiv „sei“ erhalten den Charakter einer öffentlichen Gerichts- und Zeugenladung. Die Personifikation der Erde wird durch die direkte Anrede „dich“ sichtbar gemacht.
