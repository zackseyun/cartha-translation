revisions:
- from: Hört, all ihr Völker! Horche auf, Erde, mit allem, was dich erfüllt! Der Herr Yahweh[a] sei Zeuge gegen euch[b], der Herr aus seinem heiligen Tempel.[c]
  to: Hört, all ihr Völker! Hör zu, Erde, mit allem, was sie erfüllt! Der Herr Yahweh[a] sei Zeuge gegen euch[b], der Herr aus seinem heiligen Tempel.[c]
  rationale: Die Revision beschränkt sich auf die Wiedergabe von אֶרֶץ וּמְלֹאָהּ und den zugehörigen Imperativ. Sie verdeutlicht, dass die Erde samt ihrem Inhalt aufgerufen wird, und wahrt dabei die feminine Singularanrede der personifizierten Erde. Alle Fußnotenanker bleiben unmittelbar an den betreffenden Ausdrücken und die textliche Ambiguität von בָּכֶם sowie von הֵיכָל bleibt erhalten.
