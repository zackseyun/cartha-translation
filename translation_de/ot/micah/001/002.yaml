    issue: „mit allem, was dich erfüllt“ für וּמְלֹאָהּ
    rationale: Die Formulierung kann im Deutschen bedeuten, was die Erde innerlich oder existenziell erfüllt. Gemeint ist hingegen ihre Fülle, also alles, was sie enthält bzw. was sie füllt. Das feminine Pronomen sollte sich zudem klar auf „Erde“ beziehen.
  - severity: low
    issue: „Horche auf“
    rationale: Die Wendung ist nicht falsch und wahrt den gehobenen Stil, ist aber weniger natürlich im modernen Standarddeutsch als „Hör zu“.
