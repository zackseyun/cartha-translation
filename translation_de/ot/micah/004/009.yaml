id: MIC.4.9
reference: Micah 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַתָּ֕ה לָ֥/מָּה תָרִ֖יעִי רֵ֑עַ הֲ/מֶ֣לֶךְ אֵֽין בָּ֗/ךְ אִֽם יוֹעֲצֵ/ךְ֙ אָבָ֔ד כִּֽי הֶחֱזִיקֵ֥/ךְ חִ֖יל כַּ/יּוֹלֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: de
  text: Nun, warum schreist du so laut?[a] Gibt es keinen König in dir?[b] Ist dein Ratgeber zugrunde gegangen, sodass dich Geburtswehen gepackt haben[c] wie eine Frau in den Wehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum schreist du jetzt so laut?“ Das hebräische „nun/jetzt“ kann den Übergang zur Frage markieren oder zeitlich zu „schreist“ gehören; das Verb bezeichnet einen lauten Aufschrei oder Ruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ist kein König in dir?“'
    reason: literal_rendering
  - marker: c
    text: 'Oder: „ergriffen haben“ beziehungsweise „fest im Griff haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: Nun, warum
  rationale: עַתָּה ist ausdrücklich vorhanden und markiert hier den Übergang zur rhetorischen Frage. „Nun, warum“ bewahrt sowohl die zeitlich-diskursive Nuance als auch den vorwurfsvollen Frageton.
- source_word: תָרִיעִי רֵעַ
  choice: schreist du so laut
  rationale: Die Verbindung bezeichnet einen lauten Ausruf oder Aufschrei. Im Zusammenhang der Bedrängnis gibt „so laut schreien“ die Intensität und den klagenden Ton natürlich wieder.
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: Gibt es keinen König in dir?
  rationale: Die ungewöhnliche Formulierung „in dir“ wird beibehalten, da die angeredete Stadt beziehungsweise Gemeinschaft als Frau personifiziert ist und der Ausdruck mehr als bloßen Besitz bezeichnen kann.
- source_word: יוֹעֲצֵךְ
  choice: dein Ratgeber
  rationale: Das Partizip von יעץ bezeichnet jemanden, der Rat gibt; „Ratgeber“ ist direkt, verständlich und im Kontext eines Königs angemessen.
- source_word: אָבָד
  choice: zugrunde gegangen
  rationale: אבד kann „umkommen“, „verloren gehen“ oder „zugrunde gehen“ bedeuten. Die gewählte Form bewahrt die Schärfe der Frage, ohne die Art des Verlusts festzulegen.
- source_word: הֶחֱזִיקֵךְ
  choice: dich ... gepackt haben
  rationale: Die Hifil-Form bezeichnet ein kräftiges Ergreifen. „Gepackt haben“ klingt mit Geburtswehen im Deutschen natürlich und vermittelt die Gewalt des Vorgangs.
- source_word: חִיל
  choice: Geburtswehen
  rationale: Durch den anschließenden Vergleich mit einer Gebärenden ist hier nicht allgemeine Angst oder Qual, sondern der Geburtsschmerz gemeint.
- source_word: כַּיּוֹלֵדָה
  choice: wie eine Frau in den Wehen
  rationale: Das Partizip bezeichnet eine Frau während des Gebärens. Die Formulierung ist im heutigen Deutsch natürlich und erhält das weibliche Geburtsbild.
theological_decisions:
- issue: Personifizierung Zions beziehungsweise Jerusalems als angesprochene Frau
  choice: Die weibliche Bildwelt bleibt durch den Vergleich mit einer Frau in den Wehen erhalten, ohne den Namen Zion oder Jerusalem in den Vers einzufügen.
  alternative: Die Angeredete ausdrücklich als „Tochter Zion“ benennen.
  rationale: Die femininen Singularformen und das Geburtsbild weisen auf eine weiblich personifizierte Adressatin, doch der Eigenname steht in diesem Vers nicht. Eine ausdrückliche Identifizierung würde Kontext in den Wortlaut eintragen.
- issue: Beziehung zwischen dem Verlust des Ratgebers und den Geburtswehen
  choice: כִּי wird mit „sodass“ als folgernde Verbindung wiedergegeben.
  alternative: „weil“ als streng kausale Verbindung oder „dass“ als weniger bestimmte Folgeformulierung.
  rationale: Der Satz beschreibt die Wehen als Folge beziehungsweise Zeichen der in den Fragen vorausgesetzten Not. „Sodass“ ist im Deutschen klar, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren rhetorischen Fragen. Die auffällige Wendung „in dir“ und das Geburtsbild bleiben erhalten; erklärende Zusätze zur Identität der Angeredeten werden vermieden.
