source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: de
  text: Und du, Herdenturm[a], Hügel der Tochter Zion[b] – zu dir wird sie kommen; kommen wird die frühere Herrschaft[c], das Königtum für die Tochter Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Migdal-Eder« (ein Ortsname); auch möglich: »Wachturm der Herde«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Ofel der Tochter Zion«, wenn »Ofel« hier als Ortsname und nicht als gewöhnliches Wort für einen Hügel verstanden wird.'
    reason: alternative_reading
  - marker: c
    text: Mit der »früheren Herrschaft« ist wahrscheinlich die Wiederherstellung der einstigen Königsherrschaft Jerusalems gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: Herdenturm
  rationale: Die deutsche Zusammensetzung gibt die hebräische Genitivverbindung knapp und bildhaft wieder. Da der Ausdruck auch als Ortsname verstanden werden kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
- source_word: עֹפֶל
  choice: Hügel
  rationale: Das Wort bezeichnet eine Erhebung beziehungsweise einen befestigten Hügel und kann in Jerusalem auch als Eigenname »Ofel« dienen. Die Hauptfassung bewahrt die topografische Bedeutung, die Fußnote die Eigennamenlesart.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die geläufige prophetische Personifikation wird beibehalten, statt sie zu dem bloßen Ortsnamen »Zion« zu verflachen.
- source_word: עָדֶיךָ
  choice: zu dir
  rationale: Die Wendung erhält den gerichteten Sinn von עַד mit Suffix in natürlichem Deutsch.
- source_word: תֵּאתֶה
  choice: wird sie kommen
  rationale: Die feminine Verbform wird auf die nachfolgend genannte feminine »Herrschaft« bezogen. Das deutsche Pronomen macht diese grammatische Beziehung sichtbar, ohne den Bezug vorzeitig auszudeuten.
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: die frühere Herrschaft
  rationale: מֶמְשָׁלָה bezeichnet Herrschaft oder Regierungsgewalt; הָרִאשֹׁנָה wird im Zusammenhang zeitlich als die einstige beziehungsweise frühere Herrschaft verstanden.
- source_word: מַמְלֶכֶת
  choice: das Königtum
  rationale: »Königtum« bewahrt den Gedanken königlicher Herrschaft und steht passend als nähere Bestimmung zur »früheren Herrschaft«; es vermeidet zugleich, nur ein Staatsgebiet anzudeuten.
- source_word: לְבַת יְרוּשָׁלִָם
  choice: der Tochter Jerusalem
  rationale: Die Zugehörigkeitsbeziehung wird im Deutschen idiomatisch mit dem Genitiv wiedergegeben. Die personifizierende Tochter-Metapher bleibt erhalten.
theological_decisions:
- issue: Sind die einleitenden Bezeichnungen als anschauliche Titel oder als feste Ortsnamen wiederzugeben?
  choice: 'Anschauliche beziehungsweise topografische Wiedergabe im Haupttext: »Herdenturm« und »Hügel der Tochter Zion«'
  alternative: 'Eigennamen: »Migdal-Eder« und/oder »Ofel der Tochter Zion«'
  rationale: Beide hebräischen Ausdrücke haben erkennbare gewöhnliche Wortbedeutungen. Weil sie zugleich bestimmte Orte bezeichnen können, wird keine der geografisch oder messianisch bedeutsamen Eigennamenlesarten ausgeschlossen, sondern in den Fußnoten dokumentiert.
- issue: Bezeichnet die »frühere Herrschaft« ausdrücklich die davidische Monarchie?
  choice: Die politische Wiederherstellung wird übersetzt, ohne David im Haupttext ausdrücklich zu nennen.
  alternative: Eine ausdeutende Fassung wie »die frühere davidische Herrschaft«
  rationale: Der Zusammenhang legt die Wiederkehr der einstigen Königsherrschaft Jerusalems nahe; David wird in diesem Vers jedoch nicht genannt. Die zurückhaltende Formulierung bewahrt diese Grenze des Wortlauts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen prophetischen Anreden und die Personifikationen »Tochter Zion« und »Tochter Jerusalem« bleiben bewusst erhalten. Die Wiederholung von »kommen« und das verstärkende »ja« bilden die emphatische, vorausweisende Bewegung des hebräischen Satzes ab.
