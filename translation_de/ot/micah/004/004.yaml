source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: de
  text: Und jeder wird unter seinem Weinstock und unter seinem Feigenbaum sitzen[a], und niemand wird ihnen Angst machen. Denn der Mund Jahwes, des HERRN der Heere[b], hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Jeder Mann wird unter seinem Weinstock und unter seinem Feigenbaum sitzen.“ Das Hebräische verwendet ein maskulines Singularwort in distributivem Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“; auch: „Jahwe der Heere“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: Und jeder wird ... sitzen
  rationale: יָשַׁב bezeichnet hier konkret das Sitzen und lässt zugleich das Bild dauerhaften, friedlichen Wohnens anklingen. Das Futur gibt die prophetische Verheißung natürlich wieder.
- source_word: אִישׁ
  choice: jeder
  rationale: 'Das maskuline Singularwort wird nach dem pluralischen Verb distributiv gebraucht: jeder Einzelne ist gemeint. „Jeder“ bewahrt diese Form, ohne das im Hebräischen nicht eigens betonte Substantiv „Mann“ hinzuzufügen.'
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: unter seinem Weinstock und unter seinem Feigenbaum
  rationale: Die konkrete Doppelmetapher für Frieden, Sicherheit und Wohlstand bleibt unverändert erhalten.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand wird sie aufschrecken
  rationale: מַחֲרִיד bezeichnet jemanden, der Zittern oder Schrecken verursacht. „Aufschrecken“ ist knapp und bildhaft; „sie“ greift die in „jeder“ zusammengefasste Vielzahl auf.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt den Grund und die Gewähr für die vorausgehende Verheißung ein.
- source_word: פִּי יְהוָה צְבָאוֹת
  choice: der Mund Jahwes der Heere
  rationale: „Mund“ wird als betonte hebräische Redeweise beibehalten. Der Gottesname wird als „Jahwe“ wiedergegeben; צְבָאוֹת wird transparent mit „der Heere“ übersetzt.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt unterstreicht die Gewissheit des bereits ergangenen göttlichen Wortes; „hat gesprochen“ bewahrt den feierlichen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen
  rationale: „Heere“ ist im heutigen Deutsch verständlicher und bewahrt den militärischen beziehungsweise kosmischen Bedeutungsraum; die traditionelle Form wird in der Fußnote genannt.
- issue: Distributives maskulines אִישׁ
  choice: jeder
  alternative: jeder Mann
  rationale: „Jeder“ entspricht der distributiven Funktion und bleibt grammatisch maskulin, ohne eine stärkere Beschränkung auf erwachsene Männer zu behaupten, als der Kontext verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Friedensbildsprache bleibt konkret; „der Mund ... hat gesprochen“ bewahrt bewusst die feierliche hebräische Ausdrucksweise.
