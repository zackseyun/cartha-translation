  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. Für צבאות ist „der Heere“ möglich; die Genitivapposition „Jahwes, des HERRN der Heere“ wahrt jedoch die etablierte Verständlichkeit von „HERR der Heere“, ohne den Eigennamen zu ersetzen. Die Fußnote soll die tatsächlich naheliegende traditionelle Variante benennen, nicht die missverständliche Form „Jahwe der Heerscharen“.
