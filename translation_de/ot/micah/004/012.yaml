id: MIC.4.12
reference: Micah 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: de
  text: Doch sie kennen die Gedanken Jahwes nicht und verstehen seinen Ratschluss[a] nicht; denn er hat sie wie Garben zur Tenne gesammelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Plan“ oder „seine Absicht“.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild von Garben, die zur Tenne gebracht werden, deutet darauf hin, dass die Völker zum Dreschen und damit zum Gericht gesammelt sind.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Doch sie
  rationale: Das ausdrückliche Pronomen steht im Kontext in einem Gegensatz; „Doch sie“ gibt diesen adversativen Sinn im Deutschen natürlich wieder.
- source_word: יָדְעוּ
  choice: kennen … nicht
  rationale: Das Perfekt beschreibt hier den gegenwärtigen Erkenntnismangel der Völker. Bei „Gedanken“ ist „kennen“ im Deutschen idiomatischer als „wissen“.
- source_word: מַחְשְׁבוֹת
  choice: Gedanken
  rationale: Das Wort kann Gedanken, Pläne oder Absichten bezeichnen. „Gedanken“ bewahrt die lexikalische Breite und unterscheidet den Ausdruck vom folgenden עֲצָה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen Standarddeutsch als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֵבִינוּ
  choice: verstehen … nicht
  rationale: בין bezeichnet Verstehen oder Einsicht. Die Formulierung ist klar und bildet eine natürliche Parallele zu „kennen … nicht“.
- source_word: עֲצָתוֹ
  choice: seinen Ratschluss
  rationale: עֵצָה kann Rat, Plan, Absicht oder Beschluss bedeuten. „Ratschluss“ bezeichnet hier würdig und prägnant Jahwes beabsichtigtes Handeln, ohne es vollständig mit „Gedanken“ gleichzusetzen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung ein und passt zum gehobenen prophetischen Sprachstil.
- source_word: קִבְּצָם
  choice: er hat sie … gesammelt
  rationale: Der aus dem Kontext erschlossene Handelnde ist Jahwe; das Suffix bezeichnet die feindlichen Völker. Das deutsche Perfekt stellt das vollzogene Sammeln mit gegenwärtigem Ergebnis dar.
- source_word: כֶּעָמִיר
  choice: wie Garben
  rationale: עָמִיר bezeichnet geschnittenes und gebündeltes Getreide beziehungsweise einen Getreidehaufen. „Garben“ vermittelt das landwirtschaftliche Bild im Deutschen klar.
- source_word: גֹּרְנָה
  choice: zur Tenne
  rationale: Die Richtungsendung bezeichnet eine Bewegung zur Tenne hin; „zur Tenne“ gibt diese Zielrichtung knapp und genau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen in der im Deutschen üblichen Form.
- issue: Subjekt von קִבְּצָם („er hat sie gesammelt“)
  choice: Das unausgesprochene Subjekt ist Jahwe, der die Völker zum Gericht sammelt.
  alternative: Ein nicht näher bezeichnetes Subjekt; Zion als handelndes Subjekt
  rationale: Jahwe ist im unmittelbaren Satz der genannte Bezugspunkt, dessen Gedanken und Ratschluss die Völker nicht verstehen. Das folgende Dreschbild erklärt ihr Zusammenkommen als sein Handeln, ohne die Gerichtsdeutung in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die beiden hebräischen Begriffe מַחְשְׁבוֹת und עֲצָה werden durch „Gedanken“ und „Ratschluss“ unterschieden. Das landwirtschaftliche Gerichtsbild bleibt im Haupttext unaufgelöst und wird nur in der Fußnote erläutert.
