base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: de
  text: Nun schare dich zusammen, Tochter der Scharen[a]! Gegen uns hat man Belagerungswerke errichtet. Mit dem Stock schlagen[b] sie dem Richter Israels[c] auf die Wange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ritze dich“ beziehungsweise „Schneide dich“; das hebräische Verb kann statt des Zusammenscharens auch Selbstverletzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sie schlagen“; das hebräische Imperfekt kann im prophetischen Zusammenhang Zukunftsbedeutung haben.'
    reason: lexical_alternative
  - marker: c
    text: „Richter Israels“ kann allgemein Israels Herrscher oder Anführer bezeichnen; im Zusammenhang sehen manche darin auch eine messianische Vorausdeutung.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: schare dich zusammen
  rationale: Das Hitpolel von גדד kann das Sich-Zusammenscharen in Verbänden oder das Sich-Ritzen bezeichnen. Im militärischen Zusammenhang von Scharen und Belagerung ist „schare dich zusammen“ am wahrscheinlichsten; die andere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: בַת גְּדוּד
  choice: Tochter der Scharen
  rationale: Die hebräische Tochter-Bezeichnung personifiziert eine Stadt oder Gemeinschaft. „Scharen“ bewahrt das militärische Wortspiel mit dem vorangehenden Verb.
- source_word: מָצוֹר שָׂם עָלֵינוּ
  choice: Man hat uns belagert
  rationale: Das hebräische Verb steht im Singular mit ungenanntem Subjekt. Die unpersönliche deutsche Form bewahrt diese Offenheit und gibt מָצוֹר im Kontext idiomatisch als Belagerung wieder.
- source_word: בַשֵּׁבֶט
  choice: mit dem Stock
  rationale: שֵׁבֶט kann Stock, Stab oder Zepter bedeuten. Als Schlaginstrument ist „Stock“ im Deutschen am unmittelbarsten, ohne zusätzliche königliche Symbolik einzutragen.
- source_word: יַכּוּ
  choice: schlagen sie
  rationale: Das Imperfekt kann im prophetischen Zusammenhang präsentisch oder futurisch verstanden werden. Das Präsens vergegenwärtigt die Szene; die Zukunftslesart wird in der Fußnote genannt.
- source_word: עַל הַלְּחִי
  choice: auf die Wange
  rationale: „Wange“ gibt sowohl den Körperteil als auch den entehrenden Charakter des Schlages natürlich wieder.
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: dem Richter Israels
  rationale: Die formnahe Wiedergabe wahrt die Bezeichnung des hebräischen Textes und legt nicht fest, ob allgemein ein Herrscher oder eine bestimmte heilsgeschichtliche Gestalt gemeint ist.
theological_decisions:
- issue: Mögliche messianische Bedeutung von „Richter Israels“
  choice: Die Hauptübersetzung bleibt bei „Richter Israels“ und nimmt keine ausdrückliche messianische Identifizierung vor.
  alternative: Gemeint sein könnte der damalige Herrscher Judas; im Zusammenhang mit dem folgenden Vers kann die Gestalt auch messianisch vorausweisen.
  rationale: Der Vers selbst identifiziert den Geschlagenen nicht eindeutig als Messias. Die lexikalische Wiedergabe bewahrt die Spannung zwischen unmittelbarem historischen Bezug und möglicher messianischer Vorausdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Wortspiel zwischen dem Verb גדד und גְּדוּד wird durch „schare“/„Scharen“ soweit möglich erhalten. Die unpersönliche Form „Man hat“ bildet das nicht genannte Subjekt ab; die Satzfolge bleibt knapp und prophetisch.
