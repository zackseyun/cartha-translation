base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: de
  text: Und ich werde die Hinkende zu einem Rest machen und die Weggetriebene zu einem mächtigen Volk. Und Jahwe wird von nun an bis in Ewigkeit auf dem Berg Zion als König über sie herrschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Und ich mache
  rationale: שׂוּם bedeutet »setzen, stellen, machen«; zusammen mit לְ drückt es hier eine bewirkte Veränderung aus. Das deutsche Präsens gibt die prophetische Zukunftsaussage natürlich wieder.
- source_word: הַצֹּלֵעָה
  choice: die Hinkende
  rationale: Das feminine Singularpartizip bezeichnet wörtlich eine hinkende Gestalt und personifiziert wahrscheinlich die bedrängte Gemeinschaft. Die substantivierte Form bewahrt Numerus und Bild.
- source_word: לִשְׁאֵרִית
  choice: zu einem Rest
  rationale: שְׁאֵרִית ist der prophetisch bedeutsame »Rest«; »zu« bildet die resultative Funktion von לְ genau und verständlich ab.
- source_word: הַנַּהֲלָאָה
  choice: die Weggetriebene
  rationale: Die Form bezeichnet eine, die zum Fortgehen gebracht beziehungsweise vertrieben wurde. »Weggetriebene« wahrt die feminine Singularpersonifikation und den Exilbezug.
- source_word: לְגוֹי עָצוּם
  choice: zu einem mächtigen Volk
  rationale: גּוֹי kann »Volk« oder »Nation« heißen; »Volk« klingt im Deutschen hier natürlicher. עָצוּם bezeichnet Stärke oder Macht.
- source_word: וּמָלַךְ יְהוָה
  choice: Und Jahwe wird ... als König herrschen
  rationale: מלך bezeichnet das Königsein beziehungsweise königliche Herrschen. Die Formulierung bewahrt den königlichen Gehalt; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: Mit מלך bezeichnet עַל diejenigen, über die königliche Herrschaft ausgeübt wird.
- source_word: בְּהַר צִיּוֹן
  choice: auf dem Berg Zion
  rationale: Die Präposition bezeichnet hier den Ort der Herrschaft; »auf dem Berg Zion« ist die übliche natürliche Wiedergabe.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: von nun an bis in Ewigkeit
  rationale: Die Wendung verbindet den gegenwärtigen Ausgangspunkt mit unbegrenzter zukünftiger Dauer; diese deutsche Formulierung bildet beide Bestandteile idiomatisch ab.
theological_decisions:
- issue: Singularische Personifikationen oder ausdrücklich kollektive Wiedergabe
  choice: Die femininen Singularformen »die Hinkende« und »die Weggetriebene« bleiben erhalten.
  alternative: 'Pluralisch: »die Hinkenden ... die Weggetriebenen« oder kollektiv: »das hinkende Volk ... das vertriebene Volk«.'
  rationale: Der hebräische Text verwendet feminine Singularformen, die wahrscheinlich Zion beziehungsweise die bedrängte Gemeinschaft personifizieren. Eine singularische Wiedergabe bewahrt dieses Bild, ohne seine kollektive Bedeutung festzuschreiben.
- issue: Königliche Bedeutung von מלך
  choice: »als König herrschen«
  alternative: »regieren« oder »König sein«
  rationale: Die gewählte Formulierung macht den königlichen Sinn ausdrücklich, ohne die Aussage über Art und Gestalt dieser Herrschaft weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen femininen Singularbilder werden wegen ihrer Bedeutung im hebräischen Text bewusst beibehalten. Der Satz ist leicht gegliedert, ohne den Parallelismus aufzulösen.
