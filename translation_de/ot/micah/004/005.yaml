id: MIC.4.5
reference: Micah 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: de
  text: Denn alle Völker gehen[a], jedes[b] im Namen seines Gottes; wir aber gehen im Namen Jahwes[c], unseres Gottes, für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann hier auch zukünftig wiedergegeben werden: „werden gehen“. „Gehen“ bezeichnet dabei mehr als Fortbewegung und kann die Lebensführung und religiöse Ausrichtung einschließen.'
    reason: tense_and_lexical_ambiguity
  - marker: b
    text: 'Wörtlich steht im Hebräischen „ein Mann/jeder“. Im Zusammenhang mit „alle Völker“ ist das Wort distributiv gebraucht: jedes Volk beziehungsweise jeder aus ihnen.'
    reason: lexical_alternative
  - marker: c
    text: „Jahwe“ gibt den im hebräischen Text stehenden Gottesnamen JHWH wieder. Traditionell wird er im Deutschen häufig mit „der HERR“ ersetzt.
    reason: divine_name
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier eine begründende bzw. erläuternde Aussage im Anschluss an die vorhergehende Verheißung ein. „Denn“ bildet diese Verknüpfung im Deutschen natürlich ab.
- source_word: כָּל הָעַמִּים
  choice: alle Völker
  rationale: עַמִּים bezeichnet hier die verschiedenen ethnisch-politischen Gemeinschaften. „Völker“ bewahrt den Plural und den Gegensatz zum sprechenden „wir“.
- source_word: יֵלְכוּ / נֵלֵךְ
  choice: gehen / gehen
  rationale: Die Wiederholung von הלך wird beibehalten. „Gehen“ lässt sowohl Lebensführung als auch religiöse Ausrichtung anklingen, ohne die Bildsprache durch „leben“ aufzulösen. Das deutsche Präsens kann den allgemeinen Weg der Völker und die fortdauernde Entschlossenheit des „wir“ ausdrücken.
- source_word: אִישׁ
  choice: jedes
  rationale: אִישׁ wird distributiv auf „alle Völker“ bezogen. Da „Volk“ im Deutschen sächlich ist, gibt „jedes“ die Verteilung auf die einzelnen Völker präzise wieder, ohne die Stelle unnötig auf männliche Einzelpersonen festzulegen.
- source_word: בְּשֵׁם
  choice: im Namen
  rationale: Die Wendung kann Zugehörigkeit, Berufung auf eine Gottheit und Handeln unter ihrer Autorität ausdrücken. „Im Namen“ erhält diese Bedeutungsbreite und die Parallelität beider Vershälften.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: 'Der Singular mit maskulinem Suffix gehört zur distributiven Konstruktion mit אִישׁ. Im Deutschen richtet sich das Possessivpronomen natürlich nach dem Bezugswort „Volk“: jedes Volk im Namen seines Gottes.'
- source_word: וַאֲנַחְנוּ
  choice: wir aber
  rationale: Das וְ ist formal verbindend, trägt hier jedoch durch den deutlichen Gegensatz adversative Kraft. „Wir aber“ gibt diesen Kontrast knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text bietet den Gottesnamen JHWH. „Jahwe“ ist die geläufige deutsche Wiedergabe des Eigennamens und ersetzt ihn nicht durch einen Titel.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Apposition bezeichnet die Beziehung des sprechenden Volkes zu Jahwe. Der Genitiv fügt sich im Deutschen natürlich an „im Namen Jahwes“ an.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die gepaarte hebräische Formel verstärkt die Vorstellung unbegrenzter Dauer. „Für immer und ewig“ bewahrt diesen Nachdruck in geläufigem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: יהוה ist im Ausgangstext ein Eigenname. Die Umschrift „Jahwe“ macht dies sichtbar, während „der HERR“ den Namen durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bezug des distributiven אִישׁ
  choice: jedes, auf die einzelnen Völker bezogen
  alternative: jeder Mann / jeder Einzelne
  rationale: Im Satz folgt אִישׁ auf „alle Völker“ und verteilt die Aussage auf deren einzelne Glieder. Die Wiedergabe „jedes“ lässt offen, ob primär jedes Volk als Gemeinschaft oder seine Angehörigen im Blick sind, und vermeidet eine sachlich unbegründete Beschränkung auf Männer.
- issue: Aussage über die Götter der Völker
  choice: seines Gottes
  alternative: seiner Götter
  rationale: Der hebräische Ausdruck אֱלֹהָיו ist morphologisch mehrdeutig, wird hier aber wegen der distributiven Einzahl und des Gegensatzes zu „unserem Gott“ am natürlichsten singularisch verstanden. Die Übersetzung bestätigt damit nicht die Wirklichkeit oder Gleichrangigkeit dieser Gottheiten, sondern gibt die jeweilige religiöse Bindung der Völker wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das schlichte „gehen“ bewahrt die hebräische Bildsprache, ohne auf das heute altertümliche „wandeln“ zurückzugreifen. Die parallele Satzstruktur und der starke Gegensatz „wir aber“ bleiben erhalten.
