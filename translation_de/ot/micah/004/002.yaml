source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: de
  text: 'Und viele Völker werden kommen und sagen: „Kommt, lasst uns hinaufziehen zum Berg Jahwes, zum Haus des Gottes Jakobs, damit er uns seine Wege lehrt und wir auf seinen Pfaden gehen.“ Denn von Zion wird Weisung[a] ausgehen und das Wort Jahwes von Jerusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tora“, „Gesetz“ oder „Unterweisung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: werden kommen
  rationale: הלך bedeutet grundsätzlich „gehen“; da die Bewegung hier auf Zion als Ziel gerichtet ist, gibt „kommen“ die Perspektive des Zielorts im Deutschen natürlich wieder.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: Die Wendung bezeichnet zahlreiche Völker beziehungsweise Nationen und unterstreicht die internationale Weite der Vision.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Kommt, lasst uns hinaufziehen
  rationale: Die Verbindung aus Imperativ und Kohortativ ist eine gemeinsame Aufforderung; „hinaufziehen“ bewahrt zugleich die Vorstellung des Aufstiegs nach Jerusalem.
- source_word: הַר יְהוָה
  choice: Berg Jahwes
  rationale: הַר wird direkt mit „Berg“ wiedergegeben; der Gottesname erscheint als „Jahwe“.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: Haus des Gottes Jakobs
  rationale: „Haus“ bewahrt den hebräischen Ausdruck, ohne ihn interpretierend auf „Tempel“ einzuengen.
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: Er soll uns seine Wege lehren
  rationale: Die Form drückt im Zusammenhang das gewünschte Ergebnis des Hinaufziehens aus. Das מן gehört zur hebräischen Lehrkonstruktion und muss im Deutschen nicht mit „von“ abgebildet werden.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: damit wir auf seinen Pfaden gehen
  rationale: „Gehen“ erhält die biblische Metapher für die Lebensführung; „Pfade“ wahrt den poetischen Wechsel gegenüber „Wege“.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung für den Zug der Völker nach Zion ein.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: „Weisung“ vermittelt hier die von Gott ausgehende Lehre umfassender als das leicht auf Gesetzesvorschriften verengte deutsche Wort „Gesetz“; die Alternativen werden in der Fußnote genannt.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die knappe Wiedergabe erhält die poetische Parallele zu der von Zion ausgehenden Weisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה im Zionswort
  choice: Weisung
  alternative: Tora; Gesetz; Unterweisung
  rationale: Der Kontext spricht von Gottes Lehre, die von Zion ausgeht. „Weisung“ hält diesen breiten Sinn offen, während eine Fußnote die traditionsreiche Form „Tora“ und weitere mögliche Wiedergaben dokumentiert.
- issue: Verhältnis von Lehre und Lebensweg
  choice: „Er soll uns … lehren, damit wir … gehen“
  alternative: „und er wird uns … lehren, und wir wollen … gehen“
  rationale: Die gewählte Fassung macht den im Kontext naheliegenden Zielzusammenhang sichtbar, ohne die Aussage als bloße Zukunftsprognose festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. „Hinaufziehen“, „Wege“ und „Pfade“ bewahren die Bildsprache, ohne unnötig altertümlich zu klingen.
