source:
  edition: WLC
  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: de
  text: 'Und nun haben sich viele Völker gegen dich versammelt und sagen: »Sie soll entweiht werden, und unsere Augen sollen auf Zion sehen!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie soll verunreinigt werden« bzw. »geschändet werden«. Das hebräische Verb kann Verunreinigung oder Entweihung bezeichnen. »Unsere Augen sollen auf Zion sehen« gibt den Wunsch der feindlichen Völker wieder, Zions Erniedrigung mitzuerleben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Funktion von וְ als auch den zeitlich-diskursiven Übergang durch עַתָּה.
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: haben sich ... gegen dich versammelt
  rationale: Das Nifal bezeichnet das Zusammenkommen der Völker; עַל hat im feindlichen Zusammenhang adversative Bedeutung.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: Bezeichnet hier zahlreiche politische bzw. ethnische Gemeinschaften; »Völker« ist im Deutschen die natürliche Wiedergabe.
- source_word: תֶּחֱנָף
  choice: Sie soll entweiht werden
  rationale: Die feminine Singularform bezieht sich auf Zion. חנף kann hier ein Verunreinigen bzw. Profanieren bezeichnen; »entweiht« bringt den sakralen Bezug Zions verständlich zum Ausdruck, ohne die mögliche Verunreinigungsnuance zu verschweigen.
- source_word: וְתַחַז ... עֵינֵינוּ
  choice: und unsere Augen sollen sich ... weiden
  rationale: חזה mit dem ausdrücklich genannten »unsere Augen« beschreibt hier nicht bloß neutrales Sehen, sondern das feindselige, genüssliche Anschauen von Zions erwarteter Erniedrigung. Die deutsche Wendung erhält das Körperteilbild und den hämischen Ton.
- source_word: בְּצִיּוֹן
  choice: an Zion
  rationale: Die Präposition wird entsprechend der deutschen idiomatischen Verbindung »die Augen an etwas weiden« wiedergegeben; Zion bleibt als Eigenname erhalten.
theological_decisions:
- issue: Wechsel von der direkten Anrede zur femininen Rede über Zion
  choice: In der Rahmenerzählung »dich«, im Zitat »sie«
  alternative: Durchgehend »du/dich« verwenden
  rationale: Das Hebräische redet Zion zunächst direkt an, während die feindlichen Völker mit femininen Singularformen über Zion sprechen. Der Personenwechsel wird nicht geglättet.
- issue: Bedeutung von Zions erwarteter Entweihung
  choice: Die Aussage als Wunsch der feindlichen Völker wiedergeben
  alternative: Die Aussage als göttliche Feststellung oder Billigung formulieren
  rationale: Die Kohortativ-/Jussivbedeutung gehört zum zitierten feindlichen Wunsch. Der Text billigt diesen Wunsch nicht, sondern berichtet ihn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hämische Färbung der Völkerrede wird durch »unsere Augen sollen sich an Zion weiden« natürlich wiedergegeben; eine Fußnote dokumentiert die formal nähere Alternative und die Bedeutungsbreite von חנף.
