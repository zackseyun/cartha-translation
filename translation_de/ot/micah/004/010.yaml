  terminology: „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen. „Babel“ ist die etablierte deutsche biblische Ortsnamensform. Die terminologische Differenzierung „gerettet“ / „erlösen“ ist theologisch und sprachlich angemessen, ohne zusätzliche Lehraussagen einzutragen.
