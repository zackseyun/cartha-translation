id: MIC.4.10
reference: Micah 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: de
  text: Winde dich und stöhne[a], Tochter Zion, wie eine Gebärende! Denn jetzt wirst du aus der Stadt hinausziehen und auf dem Feld wohnen; du wirst bis nach Babel kommen. Dort wirst du gerettet[b]; dort wird Jahwe dich aus der Hand deiner Feinde erlösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schrei auf« statt »stöhne«. Das hebräische Verb kann einen Schmerzensschrei bezeichnen, was zum Bild der Geburt passt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »befreit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: Winde dich
  rationale: Der feminine Singularimperativ bezeichnet im Zusammenhang der Geburt schmerzhafte körperliche Bewegungen; die Wendung bewahrt das Bild, ohne es weiter auszudeuten.
- source_word: וָ/גֹ֛חִי
  choice: und stöhne
  rationale: Das Verb kann einen Schmerzenslaut beziehungsweise Aufschrei bezeichnen. „Stöhne“ passt zum Geburtsbild; die Alternative wird in einer Fußnote bewahrt.
- source_word: בַּת צִיּ֖וֹן
  choice: Tochter Zion
  rationale: Die knappe, im Deutschen geläufige prophetische Personifikation Zions beziehungsweise Jerusalems bleibt erhalten.
- source_word: כַּ/יּֽוֹלֵדָ֑ה
  choice: wie eine Gebärende
  rationale: Die substantivierte feminine Form bezeichnet eine Frau, die gebiert. „Eine Gebärende“ ist knapp, würdevoll und eindeutig.
- source_word: מִ/קִּרְיָ֜ה
  choice: aus der Stadt
  rationale: Im Kontext ist die personifizierte Stadt Zion beziehungsweise Jerusalem gemeint; der bestimmte Ausdruck entspricht diesem Bezug.
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: und auf dem Feld wohnen
  rationale: „Wohnen“ gibt שׁכן wieder, während „auf dem Feld“ die ungeschützte Lage außerhalb der Stadt ohne erklärenden Zusatz bezeichnet.
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: du wirst bis nach Babel kommen
  rationale: בוא bezeichnet das Kommen beziehungsweise Gelangen, und עַד markiert den erreichten Zielpunkt. „Bis nach Babel kommen“ bildet beides natürlich ab.
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: Dort wirst du gerettet
  rationale: Der Nifal von נצל bezeichnet hier das Gerettetwerden aus einer Notlage. „Gerettet“ ist verständlich und bleibt von גאל unterschieden.
- source_word: יִגְאָלֵ֣/ךְ
  choice: wird dich … erlösen
  rationale: גאל trägt die Vorstellung der Loslösung beziehungsweise Rückgewinnung durch einen Löser. „Erlösen“ wahrt hier das gewichtige Wiederherstellungsmotiv.
- source_word: יְהוָ֔ה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: aus der Hand deiner Feinde
  rationale: Die hebräische Metapher der Hand als Macht beziehungsweise Gewalt ist auch im Deutschen verständlich und bleibt deshalb erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ ist seine geläufige deutsche Form und vermeidet die Ersetzung durch einen Titel.
- issue: Unterscheidung zwischen נצל und גאל
  choice: gerettet … erlösen
  alternative: befreit … retten
  rationale: 'Die zwei verschiedenen hebräischen Verben werden nicht eingeebnet: נצל bezeichnet die Rettung aus Gefahr, גאל die gewichtigere Erlösung beziehungsweise Rückgewinnung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. „Babel“ folgt der traditionellen deutschen Form des biblischen Ortsnamens. Die Satzfolge und das zweimalige „dort“ spiegeln die Betonung des hebräischen Textes.
