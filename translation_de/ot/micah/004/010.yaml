  source_fidelity: Die Übersetzung gibt die beiden feminin-singulären Imperative und das Geburtsbild angemessen wieder. „Winde dich und stöhne“ bewahrt die körperliche Qual und den Schmerzenslaut, ohne die mögliche Nuance eines Aufschreis auszuschließen; diese ist zutreffend in der Fußnote vermerkt. Die Abfolge Auszug aus der Stadt – Aufenthalt auf dem Feld – Ankunft in Babel sowie die zweimalige Hervorhebung „dort“ entsprechen dem hebräischen Text. „Gerettet“ für נצל und „erlösen“ für גאל unterscheiden die beiden Verben sinnvoll. „Aus der Hand deiner Feinde“ erhält die hebräische Machtmetapher.
