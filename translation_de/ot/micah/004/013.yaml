review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die femininen Imperative, die Bildsprache von Horn und Hufen, die Verheißung göttlicher Befähigung sowie das Zermalmen vieler Völker präzise wieder. „Gewinn“ für בִּצְעָם wahrt die lexikalische Offenheit; „Reichtum“ passt im Parallelismus für וְחֵילָם. „Jahwe“ und „der Herr der ganzen Erde“ bilden den Wechsel von יהוה zu אֲדוֹן nachvollziehbar ab.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „Steh auf und drisch, Tochter Zion!“ ist als prophetische Anrede klar und erhält das Dreschbild. Satzgliederung und Ellipse in „und ihren Reichtum dem Herrn der ganzen Erde“ sind idiomatisch.
  terminology: „Horn“, „Hufe“, „Bronze“, „zermalmen“ und „weihen“ bewahren die konkreten Bilder und den sachbezogenen Charakter von חרם. Die Fußnoten erläutern sowohl die mögliche negative Konnotation von בֶּצַע als auch die Bannbedeutung von חרם, ohne diese als zwingende Lesart in den Haupttext einzutragen. Die Fußnotenanker sind sinnvoll an Gewinn bzw. weihen gesetzt.
