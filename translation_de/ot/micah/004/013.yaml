id: MIC.4.13
reference: Micah 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: de
  text: Steh auf und drisch, Tochter Zion! Denn ich mache dein Horn zu Eisen und deine Hufe zu Bronze. Du wirst viele Völker zermalmen. Ihren Gewinn[a] werde ich Jahwe weihen[b] und ihren Reichtum dem Herrn der ganzen Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Beute“; das hebräische Wort kann auch gierig oder unrechtmäßig erworbenen Gewinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet die unwiderrufliche Übereignung an Gott, oft im Sinn des Banns, der auch Vernichtung einschließen kann.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ק֧וּמִי וָד֣וֹשִׁי
  choice: Steh auf und drisch
  rationale: Die femininen Imperative rufen die personifizierte Tochter Zion zum Handeln auf. „Drisch“ bewahrt das landwirtschaftliche Bild des Dreschens durch Zertreten.
- source_word: בַת צִיּ֗וֹן
  choice: Tochter Zion
  rationale: Die im Deutschen vertraute prophetische Anrede bewahrt Personifikation und Vokativ.
- source_word: קַרְנֵ֞ךְ אָשִׂ֤ים בַּרְזֶל֙
  choice: ich mache dein Horn zu Eisen
  rationale: „Horn“ bleibt als biblisches Bild für Kraft und Angriffsmacht erhalten; die Formulierung gibt die göttliche Verwandlung natürlich wieder.
- source_word: וּפַרְסֹתַ֨יִךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה
  choice: und deine Hufe zu Bronze
  rationale: Die Hufe führen das Bild eines dreschenden Tieres fort; נְחוּשָׁה bezeichnet hier am ehesten Bronze.
- source_word: וַהֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים
  choice: Du wirst viele Völker zermalmen
  rationale: Das Verb bezeichnet kräftiges Zerstampfen oder Zermalmen und setzt das Dreschbild fort; עַמִּים wird als „Völker“ wiedergegeben.
- source_word: בִּצְעָ֔ם
  choice: ihren Gewinn
  rationale: בֶּצַע kann Gewinn, häufig mit negativer Färbung, oder Beute bezeichnen. Der Haupttext bleibt mit „Gewinn“ nahe am Wortlaut; die mögliche moralische Nuance steht in der Fußnote.
- source_word: וְהַחֲרַמְתִּ֤י
  choice: werde ich ... weihen
  rationale: Die Hifilform von חרם bezeichnet die unwiderrufliche Übereignung an Gott und kann den Bann bis hin zur Vernichtung einschließen. „Weihen“ passt zu den Sachobjekten Gewinn und Reichtum, ohne die stärkere Bedeutung auszuschließen.
- source_word: לַֽיהוָה֙
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und vom Titel „Herr“ am Versende unterschieden.
- source_word: וְחֵילָ֖ם
  choice: ihren Reichtum
  rationale: חֵיל kann Kraft, Vermögen oder Reichtum bedeuten. Parallel zu „Gewinn“ bezeichnet es hier wahrscheinlich den materiellen Besitz der besiegten Völker.
- source_word: לַאֲד֥וֹן כָּל־הָאָֽרֶץ
  choice: dem Herrn der ganzen Erde
  rationale: Die Wiedergabe erhält den universalen Herrschaftstitel und unterscheidet ihn vom vorangehenden Gottesnamen.
theological_decisions:
- issue: Bedeutung der Bannterminologie חרם im Siegeskontext
  choice: ihren Gewinn ... Jahwe weihen
  alternative: ihren Gewinn dem Bann für Jahwe übergeben / der Vernichtung weihen
  rationale: Die Objekte des Verbs sind Gewinn und Reichtum, nicht ausdrücklich die Völker. „Weihen“ bewahrt die Übereignung an Gott, während die Fußnote den möglichen Bann- und Vernichtungsaspekt offenhält.
- issue: Moralische Färbung von בֶּצַע
  choice: Gewinn
  alternative: unrechtmäßiger Gewinn / Beute
  rationale: Das Wort kann gierigen oder ungerechten Profit bezeichnen, doch diese Färbung ist nicht in jedem Gebrauch zwingend. Daher bleibt der Haupttext zurückhaltend und nennt die Alternativen in der Fußnote.
- issue: Wechsel zwischen Gottesname und Herrschaftstitel
  choice: Jahwe ... der Herr der ganzen Erde
  alternative: der HERR ... der Herr der ganzen Erde
  rationale: Der hebräische Text verwendet zuerst das Tetragramm und danach אֲדוֹן. Die unterschiedliche Wiedergabe erhält diesen bewussten Wechsel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten die kraftvolle prophetische Rede; die konkreten Bilder von Horn, Hufen und Dreschen werden nicht erklärend aufgelöst.
