id: MIC.4.1
reference: Micah 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: de
  text: 'Und am Ende der Tage[a] wird es geschehen: Der Berg des Hauses Jahwes wird als Haupt der Berge[b] fest gegründet sein und über die Hügel erhaben sein. Völker werden zu ihm strömen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in den letzten Tagen“ oder „in künftigen Tagen“.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „am Haupt der Berge“; die Wendung kann die höchste Lage oder den höchsten Rang bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb zeichnet das Bild, dass die Völker wie ein Wasserstrom zum Berg hinströmen.
    reason: lexical_metaphor
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Die prophetische Einleitungsformel bezeichnet ein künftiges Geschehen; die Formulierung ist gegenwärtiges, würdiges Deutsch und bewahrt den Ereignischarakter.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  rationale: Die formnahe Wiedergabe erhält den prophetischen und möglicherweise endzeitlichen Klang, ohne die Wendung auf ein bestimmtes eschatologisches System festzulegen.
- source_word: הַר בֵּית יְהוָה
  choice: der Berg des Hauses Jahwes
  rationale: Die hebräische Genitivverbindung wird transparent wiedergegeben. „Haus“ lässt sowohl den Tempelbau als auch den damit verbundenen heiligen Ort im Blick.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des göttlichen Eigennamens bewahrt dessen Charakter als Name.
- source_word: נָכוֹן
  choice: fest gegründet sein
  rationale: Die Form bezeichnet einen festen, dauerhaft gesicherten Zustand; „fest gegründet“ gibt Stabilität und Bestand wieder.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: als Haupt der Berge
  rationale: Die Wendung kann sowohl räumliche Höhe als auch Vorrang ausdrücken. Die gewählte Form bewahrt diese bildhafte Mehrdeutigkeit.
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: und über die Hügel erhaben sein
  rationale: Die Zustandsaussage und die betonte Stellung des Berges werden gewahrt; „erhaben“ kann räumliche Erhöhung und ausgezeichneten Rang bezeichnen.
- source_word: וְנָהֲרוּ
  choice: werden … strömen
  rationale: Das Verb zeichnet das ungewöhnliche Bild von Völkern, die wie Wasser zum Berg hinströmen; „strömen“ bewahrt diese Metapher natürlich.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural bezeichnet mehrere Volksgruppen und wird im Deutschen am genauesten mit „Völker“ wiedergegeben.
- source_word: עָלָיו
  choice: zu ihm
  rationale: Das Suffix bezieht sich grammatisch auf den maskulinen „Berg“; bei einer Bewegung ist „zu ihm“ idiomatisches Deutsch.
theological_decisions:
- issue: Zeitliche Tragweite der prophetischen Wendung
  choice: am Ende der Tage
  alternative: in künftigen Tagen; in den letzten Tagen
  rationale: Die Übersetzung erhält die mögliche endzeitliche Tragweite, legt aber weder einen exakten Zeitpunkt noch ein bestimmtes heilsgeschichtliches Modell fest.
- issue: Art der Erhöhung des Berges
  choice: Bildsprache, die räumliche Höhe und Vorrang offenhält
  alternative: ausschließlich topografische Erhöhung; ausschließlich symbolischer Vorrang
  rationale: Der Parallelismus verbindet Festigkeit, erhöhte Lage und Vorrang. Die Übersetzung entscheidet nicht, ob eine geografische Veränderung, symbolische Überlegenheit oder beides gemeint ist.
- issue: Bedeutung des Hauses Jahwes
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus“ entspricht dem Ausgangstext und vermeidet eine unnötige Verengung, obwohl im Zusammenhang der Tempel gemeint sein kann.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit prophetischem Rhythmus. Die Syntax bleibt gut verständlich; traditionelle Bildsprache wird bewahrt, ohne altertümliche Hilfsformen oder konfessionell geprägte Deutungen einzuführen.
