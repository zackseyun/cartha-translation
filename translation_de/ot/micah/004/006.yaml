  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אֹֽסְפָה֙ הַ/צֹּ֣לֵעָ֔ה וְ/הַ/נִּדָּחָ֖ה אֲקַבֵּ֑צָה וַ/אֲשֶׁ֖ר הֲרֵעֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
translation:
  language: de
  text: An jenem Tag – Spruch Jahwes – werde ich die Hinkenden[a] sammeln und die Vertriebenen[b] zusammenbringen und diejenigen, denen ich Unheil zugefügt habe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine feminine Singularform: „die Hinkende“. Sie bezeichnet kollektiv eine Gruppe.'
    reason: grammatical_clarification
  - marker: b
    text: 'Auch möglich: „die Fortgetriebenen“ oder „die Verstoßenen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „denen ich Leid zugefügt habe“. Der hebräische Text schreibt das vorausgegangene Unheil ausdrücklich Jahwe zu.'
    reason: theological_clarification
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben, ohne ihre Offenheit auf einen bestimmten Zeitpunkt einzuengen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die knappe prophetische Ausspruchsformel bleibt feierlich und im Deutschen gut verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹסְפָה
  choice: werde ich ... sammeln
  rationale: „Sammeln“ bewahrt das verbreitete Bild der Wiederherstellung und entspricht der Grundbedeutung von אסף.
- source_word: הַצֹּלֵעָה
  choice: die Hinkenden
  rationale: Das hebräische feminine Singularpartizip hat hier kollektive Bedeutung. Der deutsche Plural gibt diese Gruppenbezeichnung natürlich wieder und bewahrt das konkrete Bild des Hinkens.
- source_word: וְהַנִּדָּחָה
  choice: die Vertriebenen
  rationale: נדח bezeichnet Menschen, die fortgetrieben oder verstoßen wurden. „Vertriebene“ erhält den passiven Zwangsaspekt deutlicher als das allgemeinere „Zerstreute“.
- source_word: אֲקַבֵּצָה
  choice: zusammenbringen
  rationale: Die Wiedergabe unterscheidet dieses Verb hörbar von אסף, ohne den parallelen Gedanken der Sammlung künstlich zu überzeichnen.
- source_word: וַאֲשֶׁר
  choice: auch diejenigen, denen
  rationale: Die Formulierung lässt die syntaktische Anfügung als einschließende beziehungsweise steigernde Ergänzung erkennen.
- source_word: הֲרֵעֹתִי
  choice: Unheil zugefügt habe
  rationale: Der Hifil in der ersten Person bezeichnet ausdrücklich von Gott verursachtes Unheil oder Leid. Diese Formulierung bewahrt die göttliche Urheberschaft, ohne eine böswillige Absicht in das Verb hineinzulesen.
theological_decisions:
- issue: Göttliche Urheberschaft des zuvor erfahrenen Unheils
  choice: „denen ich Unheil zugefügt habe“
  alternative: „die ich habe leiden lassen“
  rationale: Der hebräische Hifil in der ersten Person schreibt Jahwe die Verursachung ausdrücklich zu. Die Spannung zwischen göttlichem Gericht und anschließender Wiederherstellung darf nicht durch eine bloß zulassende Formulierung abgeschwächt werden.
- issue: Bezug von וַאֲשֶׁר הֲרֵעֹתִי
  choice: 'als zusätzliche, einschließende Gruppe: „auch diejenigen, denen ...“'
  alternative: 'als nähere Bestimmung ausschließlich der Vertriebenen: „die Vertriebenen, denen ...“'
  rationale: Die hebräische Verknüpfung erlaubt eine anreihende Lesart. „Auch diejenigen“ folgt der ausdrücklich einschließenden Struktur, ohne zu behaupten, die genannten Gruppen seien zwingend vollständig voneinander getrennt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Die Parallelität der beiden Sammelverben bleibt erkennbar, während unnötig altertümliche Wendungen vermieden werden. Kollektive feminine Singularformen werden im Haupttext als natürliche deutsche Plurale wiedergegeben und in der Fußnote erläutert.
