    rationale: '„Für mächtige Nationen bis in weite Ferne entscheiden“ ist syntaktisch und semantisch missverständlich: „bis in weite Ferne“ kann nicht sinnvoll das Entscheiden bestimmen. Der hebräische Ausdruck bezieht die mächtigen Nationen als solche in der Ferne ein und steht parallel zum Rechtsprechen.'
  - severity: low
