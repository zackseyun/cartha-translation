source:
  edition: WLC
  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: de
  text: Er wird zwischen vielen Völkern Recht sprechen und über mächtige Nationen in weiter Ferne Recht sprechen.[a] Sie werden ihre Schwerter zu Pflugscharen schmieden und ihre Speere zu Winzermessern. Kein Volk wird gegen ein anderes Volk das Schwert erheben, und sie werden nicht mehr lernen, Krieg zu führen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann hier auch „zurechtweisen“, „Streit schlichten“ oder „eine Entscheidung treffen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie werden nicht mehr für den Krieg ausgebildet werden“; das Hebräische kann auch das Sichüben oder Ausbilden für den Krieg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: Er wird zwischen vielen Völkern Recht sprechen
  rationale: „Recht sprechen“ bewahrt den richterlichen Sinn von שׁפט und ist im Deutschen natürlicher als das isolierte „richten“. עַמִּים wird mit „Völker“ wiedergegeben, ohne es auf moderne Nationalstaaten einzuengen.
- source_word: וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: und für mächtige Nationen bis in weite Ferne entscheiden
  rationale: 'Im Parallelismus hat יכח im Hifil hier wahrscheinlich eine forensische Bedeutung: entscheiden beziehungsweise Streit schlichten. Die Formulierung lässt den ungewöhnlichen Anschluss mit לְ bestehen und gibt עַד רָחוֹק als große räumliche Reichweite wieder.'
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: Dann werden sie ihre Schwerter zu Pflugscharen schmieden
  rationale: כתת bezeichnet das Schlagen beziehungsweise Bearbeiten des Metalls. „Schmieden“ drückt im Deutschen die Umgestaltung der Waffen zu Ackergeräten klar und bildhaft aus; „Pflugscharen“ ist die präzise, geläufige Bezeichnung.
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: und ihre Speere zu Winzermessern
  rationale: מַזְמֵרוֹת sind Werkzeuge zum Beschneiden von Reben oder Zweigen. „Winzermesser“ ist verständlich, konkret und näher am landwirtschaftlichen Bild als das allgemeinere „Sicheln“.
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: Kein Volk wird gegen ein anderes Volk das Schwert erheben
  rationale: Die distributiv gebrauchten Singularformen werden in natürliches Deutsch übertragen. „Das Schwert erheben“ bewahrt das hebräische Bild und bezeichnet feindliches Vorgehen.
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: und sie werden den Krieg nicht mehr erlernen
  rationale: Die bewusst markante Formulierung bewahrt die Nähe zum hebräischen למד מלחמה. Eine Fußnote weist darauf hin, dass auch militärische Ausbildung gemeint sein kann.
theological_decisions:
- issue: Subjekt der Verben im Singular
  choice: Das Subjekt wird lediglich mit „er“ wiedergegeben.
  alternative: Ausdrückliche Identifizierung als der HERR, der messianische Herrscher oder das personifizierte Zion.
  rationale: Das Hebräische nennt in diesem Vers kein ausdrückliches Subjekt. Der Zusammenhang weist auf den zuvor genannten HERRN zurück, doch die Übersetzung ergänzt keine weitergehende christologische oder personifizierende Deutung.
- issue: Art des verheißenen Friedens
  choice: Die Aussagen über Waffen und Krieg werden als konkrete, uneingeschränkte Zukunftsaussagen übersetzt.
  alternative: Eine ausschließlich geistliche oder metaphorische Umschreibung.
  rationale: Der Text verwendet konkrete Bilder internationaler Rechtsprechung, entwaffneter Völker und beendeter Kriegsausbildung. Die Übersetzung lässt deren theologischen und eschatologischen Umfang offen, statt ihn einzuengen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrtem prophetischem Bildgehalt. „Recht sprechen“, „Pflugscharen“ und „das Schwert erheben“ sind gehoben, aber allgemein verständlich; „Winzermesser“ verdeutlicht das alte landwirtschaftliche Werkzeug ohne archaische Ausdrucksweise.
