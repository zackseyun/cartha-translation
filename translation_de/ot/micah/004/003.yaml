    rationale: Die einfache hebräische Waw-Verbindung verlangt keine explizite zeitliche Stufung. Ein schlichtes „Sie werden“ ist näher am Text.
  - severity: low
    issue: „den Krieg nicht mehr erlernen“ ist im Deutschen unnötig sperrig
    rationale: Die Wendung kann natürlich mit „nicht mehr lernen, Krieg zu führen“ wiedergegeben werden, ohne die im Hebräischen mögliche Bedeutung von Ausbildung für den Krieg zu verlieren.
