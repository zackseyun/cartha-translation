source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: de
  text: Sie werden das Land Assyrien mit dem Schwert weiden und das Land Nimrods an seinen Eingängen[b]. Und er wird uns von Assyrien[a] erretten, wenn es in unser Land kommt und in unserem Gebiet einherzieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Assyrer, wenn er in unser Land kommt und in unserem Gebiet einherzieht“. Das Hebräische kann Assyrien hier als eindringenden Feind personifizieren.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „an seinen Toren“. Das hebräische Wort bedeutet wörtlich „Öffnungen, Eingänge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: sie werden … weiden
  rationale: Das Grundbild von רעה („weiden, als Hirte führen“) bleibt erhalten. Zusammen mit „mit dem Schwert“ bezeichnet es hier eine gewaltsame Unterwerfung, ohne die Hirtenmetaphorik des Zusammenhangs zu einer bloßen Aussage über Herrschaft oder Verwüstung abzuflachen.
- source_word: אֶרֶץ אַשּׁוּר
  choice: das Land Assyrien
  rationale: Die ausdrückliche territoriale Wendung mit אֶרֶץ wird bewahrt; „Assyrien“ bleibt als Eigenname stehen.
- source_word: בַּחֶרֶב
  choice: mit dem Schwert
  rationale: Das instrumentale ב wird natürlich mit „mit“ wiedergegeben; das konkrete militärische Bild des Schwertes bleibt erhalten.
- source_word: אֶרֶץ נִמְרֹד
  choice: das Land Nimrods
  rationale: Diese natürliche deutsche Genitivfügung erhält sowohl den territorialen Bezug als auch den anspielungsreichen Namen Nimrod.
- source_word: בִּפְתָחֶיהָ
  choice: an seinen Eingängen
  rationale: פתח bezeichnet eine Öffnung oder einen Eingang. „Eingänge“ ist näher am Hebräischen als „Tore“, da nicht das übliche Wort שׁער verwendet wird.
- source_word: וְהִצִּיל
  choice: und er wird uns … erretten
  rationale: Der Hifil von נצל bedeutet „erretten, retten“. Das singularische Subjekt wird gegen den vorhergehenden Plural ausdrücklich als „er“ beibehalten.
- source_word: מֵאַשּׁוּר
  choice: von Assyrien
  rationale: Der Ländername passt zum vorausgehenden territorialen Sprachgebrauch. Die mögliche Personifizierung als „der Assyrer“ wird in einer Fußnote offengehalten.
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: wenn es in unser Land kommt
  rationale: כִּי wird im Zusammenhang temporal verstanden. Weil das deutsche „Assyrien“ sächlich ist, nimmt „es“ den Ländernamen grammatisch korrekt wieder auf.
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: und in unserem Gebiet einherschreitet
  rationale: דרך bewahrt mit „einherschreiten“ das konkrete Bild des Tretens oder Marschierens; גבול bezeichnet hier das durch Grenzen bestimmte Gebiet, nicht nur die Grenzlinie.
theological_decisions:
- issue: Wechsel vom pluralischen zum singularischen Handlungsträger
  choice: „Sie werden … weiden … Und er wird uns … erretten“
  alternative: Den Vers auf einen durchgehend pluralischen oder singularischen Handlungsträger angleichen.
  rationale: Der hebräische Text wechselt unvermittelt vom Plural zum Singular. Die Übersetzung bewahrt diese Spannung, sodass die Mehrzahl der zuvor genannten Führer und der einzelne Herrscher nicht stillschweigend miteinander gleichgesetzt werden.
- issue: Bezug von אַשּׁוּר im letzten Satzteil
  choice: Im Haupttext „Assyrien“, grammatisch durch „es“ wieder aufgenommen.
  alternative: „der Assyrer“, mit anschließenden maskulinen Pronomen.
  rationale: אַשּׁוּר kann das Land beziehungsweise die Macht Assyriens bezeichnen und im Invasionsbild zugleich personifiziert verstanden werden. Der Haupttext hält am Ländernamen fest; die personifizierte Lesart wird als echte Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche Bild „mit dem Schwert weiden“ ist bewusst beibehalten, weil es die Hirten- und Herrscherthematik des Zusammenhangs mit der militärischen Unterwerfung verbindet. Die Fußnotenmarker stehen jeweils unmittelbar an der betroffenen Formulierung.
