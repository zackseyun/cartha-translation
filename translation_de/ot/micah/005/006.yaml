  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: de
  text: Und der Rest Jakobs wird inmitten vieler Völker sein wie Tau von Jahwe, wie Regenschauer auf dem Gras – er wartet nicht auf einen Menschen und hofft nicht auf Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Verben können sowohl „warten“ als auch „hoffen“ bedeuten. Die Aussage kann sich auf das Bild von Tau und Regenschauern beziehen, die ohne menschliches Zutun kommen; grammatisch ist auch ein Bezug auf den Rest Jakobs möglich.
    reason: lexikalische und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird … sein
  rationale: Die Verbform eröffnet im prophetischen Zusammenhang eine zukünftige Aussage; die Formulierung ist modern und bewahrt den Anschluss durch וְ.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: der Rest Jakobs
  rationale: „Rest“ gibt den prophetischen Begriff für den übrig gebliebenen Teil des Volkes präzise wieder; „Jakob“ bleibt als ausdrücklicher Bundesname erhalten.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: inmitten vieler Völker
  rationale: „Inmitten“ bildet die räumliche Wendung בקרב genauer ab als ein bloßes „unter“; „Völker“ entspricht עַמִּים, ohne politische Staaten vorauszusetzen.
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: wie Tau von Jahwe
  rationale: Die Herkunft des Taus von Gott bleibt ausdrücklich; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: wie Regenschauer auf dem Gras
  rationale: רְבִיבִים bezeichnet ergiebige Regenschauer; „Gras“ bewahrt das konkrete Bild von עֵשֶׂב.
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: er wartet nicht auf einen Menschen
  rationale: קוה kann „warten“ oder „hoffen“ bedeuten. Im Bild von Tau und Regen passt „warten“ gut und hält die menschliche Mitwirkung auf Abstand.
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: und hofft nicht auf Menschenkinder
  rationale: יחל überschneidet sich mit קוה in den Bedeutungen „warten“ und „hoffen“. Der Wechsel zu „hoffen“ wahrt die Bedeutungsbreite und den Parallelismus; „Menschenkinder“ bildet die hebräische Wendung בְּנֵי אָדָם formal ab.
theological_decisions:
- issue: Bezug des Relativsatzes beziehungsweise der anschließenden Aussage
  choice: Das Pronomen „er“ lässt den Bezug im Deutschen offen, wobei das Bild von Tau und Regenschauern als nächster sachlicher Bezug naheliegt.
  alternative: Die Aussage kann unmittelbar auf den Rest Jakobs bezogen werden.
  rationale: Die hebräischen Verben stehen im Singular und können grammatisch zum singularischen „Tau“ beziehungsweise möglicherweise zum „Rest Jakobs“ gehören. Die Zeichensetzung und das Pronomen vermeiden eine unnötige dogmatische Festlegung.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den ausdrücklichen Gottesnamen; „Jahwe“ macht ihn im Haupttext erkennbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Menschenkinder“ ist bewusst etwas formeller, um die hebräische Wendung zu bewahren. Der Gedankenstrich macht die syntaktische Mehrdeutigkeit sichtbar, ohne den Satz unnatürlich werden zu lassen.
