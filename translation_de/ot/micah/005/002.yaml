  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: de
  text: Darum wird er sie preisgeben[a] bis zu der Zeit, da die Gebärende entbunden hat[b]. Dann wird der Rest seiner Brüder zu den Söhnen Israels[c] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie ausliefern« oder »sie verlassen«.'
    reason: lexical_alternative
  - marker: b
    text: Wer »die Gebärende« ist, wird im Hebräischen nicht ausdrücklich gesagt. Sie wird unterschiedlich als personifiziertes Zion beziehungsweise Juda, als Mutter des verheißenen Herrschers oder als eine andere Gestalt verstanden.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Kindern Israels«. Wörtlich steht im Hebräischen »Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang klar und in natürlichem modernem Deutsch.
- source_word: יִתְּנֵם
  choice: wird er sie preisgeben
  rationale: נתן mit Objektsuffix hat hier idiomatisch den Sinn des Überlassens oder Preisgebens. Die Formulierung wahrt den gerichtlichen Klang, ohne endgültige Verlassenheit festzuschreiben.
- source_word: עַד עֵת
  choice: bis zu der Zeit
  rationale: Bewahrt die gegenüber einem einfachen »bis« ausführlichere hebräische Zeitangabe und klingt dennoch natürlich.
- source_word: יוֹלֵדָה
  choice: die Gebärende
  rationale: Das substantivierte Partizip bezeichnet eine Frau beim Gebären, ohne ihre Identität oder ihre Beziehung zum Kind näher festzulegen.
- source_word: יָלָדָה
  choice: geboren hat
  rationale: Das Perfekt bezeichnet die Geburt als das Ereignis, mit dem die vorausgehende Frist endet.
- source_word: וְיֶתֶר
  choice: Dann wird der Rest
  rationale: »Der Rest« gibt die verbleibende Gruppe wieder, ohne durch »Überrest« unnötig einen theologischen Fachbegriff einzuführen; »dann« verdeutlicht den zeitlichen Fortgang.
- source_word: אֶחָיו
  choice: seiner Brüder
  rationale: Bewahrt den männlichen Plural und die mögliche familiäre beziehungsweise auf den angekündigten Herrscher bezogene Resonanz.
- source_word: יְשׁוּבוּן
  choice: zurückkehren
  rationale: Gibt שוב natürlich wieder und lässt sowohl räumliche Rückkehr als auch weitergehende Bundesanklänge offen.
- source_word: עַל
  choice: zu
  rationale: Bei שוב und einer Personengruppe bezeichnet die Präposition hier am natürlichsten die Rückkehr beziehungsweise Hinwendung zu dieser Gruppe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Entspricht der wörtlichen Form des Hebräischen; die geläufigere inklusive Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Identität der Gebärenden
  choice: Im Haupttext nicht näher bestimmt
  alternative: Zion/Juda als Frau dargestellt; die Mutter des verheißenen Herrschers; eine andere zeitgeschichtliche Gestalt
  rationale: Der hebräische Text identifiziert die Frau nicht ausdrücklich. Die offene Formulierung bewahrt diese Mehrdeutigkeit und vermeidet eine konfessionelle Vorentscheidung.
- issue: Bezugsgruppe von »seiner Brüder«
  choice: Die familiäre Bezeichnung bleibt ohne erklärende Erweiterung stehen
  alternative: Israelitische Volksgenossen; Verwandte des kommenden Herrschers; Angehörige des wiedervereinigten Volkes
  rationale: Der Kontext legt einen Bezug zum angekündigten Herrscher nahe, doch der Vers bestimmt Art und Umfang der Beziehung nicht genauer.
- issue: Ziel der Rückkehr
  choice: zu den Söhnen Israels
  alternative: sich mit den Söhnen Israels vereinigen; über die Söhne Israels zurückkehren
  rationale: Die Präposition עַל ist in dieser Verbindung nicht rein räumlich wörtlich ins Deutsche zu übertragen. »Zu« wahrt die Bewegung beziehungsweise erneute Zugehörigkeit, ohne die Art der Wiedervereinigung auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Syntax. »Die Gebärende« ist bewusst knapp und nicht identifizierend; »preisgeben« erhält die gerichtliche Spannung. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
