  source_fidelity: Der Text gibt die beiden hebräischen Imperfekte angemessen als volitive Aussage wieder und dokumentiert die ebenso mögliche futurische Deutung in der Fußnote. „Deine Hand“ und „über“ bewahren das Bild und die Dominanznuance von יָד und עַל. „Ausgerottet werden“ ist für יִכָּרֵתוּ im Kontext vertretbar und gibt die umfassende Beseitigung der Feinde wieder, auch wenn „abgeschnitten werden“ die formale Metapher enger abbilden würde.
