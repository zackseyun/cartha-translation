  text: תָּרֹ֥ם יָדְ/ךָ֖ עַל צָרֶ֑י/ךָ וְ/כָל אֹיְבֶ֖י/ךָ יִכָּרֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: de
  text: Deine Hand möge sich über deine Bedränger erheben[a], und alle deine Feinde mögen ausgerottet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deine Hand wird sich über deine Bedränger erheben, und alle deine Feinde werden ausgerottet werden.“ Die hebräischen Imperfektformen können auch als Aussagen über die Zukunft verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: möge sich erheben
  rationale: Das Qal-Imperfekt von רום stimmt mit dem femininen Subjekt יָד („Hand“) überein. Die reflexive Formulierung gibt das konkrete Bild einer siegreich erhobenen Hand natürlich wieder, ohne es zum abstrakten „erhöht werden“ umzudeuten.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild für Macht und Durchsetzungskraft und ist auch im Deutschen verständlich.
- source_word: עַל
  choice: über
  rationale: „Über“ erhält sowohl das räumliche Bild der erhobenen Hand als auch den Gedanken der Überlegenheit gegenüber den Gegnern.
- source_word: צָרֶיךָ
  choice: deine Bedränger
  rationale: צַר bezeichnet einen feindlichen Gegner und kann zugleich die Nuance des Bedrängens tragen. „Bedränger“ unterscheidet den Ausdruck vom folgenden אֹיְבֶיךָ („Feinde“), ohne den Parallelismus einzuebnen.
- source_word: וְכָל
  choice: und alle
  rationale: Die Wiedergabe erhält die umfassende Aussage des hebräischen Textes.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: „Feinde“ ist die übliche und klare Wiedergabe von אֹיֵב und wahrt eine leichte lexikalische Unterscheidung zu צָרֶיךָ.
- source_word: יִכָּרֵתוּ
  choice: mögen ausgerottet werden
  rationale: Das Niphal-Imperfekt von כרת bedeutet wörtlich „abgeschnitten werden“. Im Deutschen vermittelt „ausgerottet werden“ in diesem Zusammenhang die Vernichtung beziehungsweise vollständige Beseitigung der Feinde, ohne die passive Form aufzugeben.
theological_decisions:
- issue: Aussageweise der beiden Imperfektformen im prophetischen Zusammenhang
  choice: Als Wunsch beziehungsweise gebetsartige Aufforderung mit „möge/mögen“ wiedergegeben.
  alternative: 'Zukünftige Feststellung: „Deine Hand wird sich über deine Bedränger erheben, und alle deine Feinde werden ausgerottet werden.“'
  rationale: Die hebräischen Imperfektformen können hier sowohl jussiv-volitiv als auch futurisch verstanden werden. Der Haupttext wahrt die mögliche Wunschform; die ebenfalls tragfähige futurische Lesart wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelstruktur und das konkrete Bild der erhobenen Hand bleiben erhalten; „Bedränger“ und „Feinde“ geben die beiden unterschiedlichen hebräischen Gegnerbezeichnungen wieder.
