revisions:
- from: Und ich werde die Zauberkünste aus deiner Hand ausrotten, und Wahrsager wird es bei dir nicht mehr geben.[a]
  to: Und ich werde die Zauberkünste aus deiner Hand entfernen, und Wahrsager wird es bei dir nicht mehr geben.[a]
  rationale: Die Änderung ersetzt eine im Deutschen unnatürliche Verbverbindung durch eine idiomatische Formulierung, ohne die Bildsprache von „deiner Hand“ oder die Aussage der göttlichen Beseitigung aufzugeben. Die Fußnote wird so gefasst, dass sie mögliche engere Deutungen von מְעוֹנְנִים nennt, ohne eine umstrittene Spezifizierung zu behaupten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:55:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen im Wesentlichen zutreffend wieder: Gott beseitigt magische Praktiken aus der Verfügungssphäre des angesprochenen Volkes, und Praktizierende der Mantik werden nicht mehr vorhanden sein. „Ausrotten“ ist für כרת zwar grundsätzlich möglich, wirkt mit dem Gegenstand „Zauberkünste“ und der Ergänzung „aus deiner Hand“ im Deutschen jedoch unidiomatisch und verschiebt die Aussage unnötig zu einer Vernichtungsformel.'
  naturalness: „Aus deiner Hand ausrotten“ ist keine natürliche moderne deutsche Verbindung. „Aus deiner Hand entfernen“ bewahrt das hebräische Bild und ist verständlich. Der zweite Satzteil ist idiomatisch; „bei dir“ gibt לָךְ angemessen wieder.
  terminology: „Zauberkünste“ ist für כְּשָׁפִים passend. „Wahrsager“ ist als allgemeine Wiedergabe von מְעוֹנְנִים vertretbar. Die Fußnote sollte keine engere, lexikalisch unsichere Erklärung als „Deuter günstiger Zeiten“ präsentieren; „Zeichendeuter“ und „Zeitendeuter“ markieren die möglichen engeren Auffassungen ohne zusätzliche Spezifizierung.
  issues:
  - severity: medium
    issue: Unnatürliche Kollokation „aus deiner Hand ausrotten“
    rationale: Das Verb „ausrotten“ passt im modernen Deutsch nur schlecht zu „Zauberkünste“ in Verbindung mit „aus deiner Hand“. „Entfernen“ gibt die Beseitigung aus der Hand bzw. Verfügungssphäre klar und natürlich wieder.
  - severity: low
    issue: Fußnote überbestimmt die Bedeutung von מְעוֹנְנִים
    rationale: „Deuter günstiger Zeiten“ legt eine spezifische Nuance nahe, die im hebräischen Ausdruck nicht sicher festgelegt ist. Neutralere Alternativen bewahren die lexikalische Offenheit.
  revised_text: Und ich werde die Zauberkünste aus deiner Hand entfernen, und Wahrsager wird es bei dir nicht mehr geben.[a]
  revised_footnotes:
