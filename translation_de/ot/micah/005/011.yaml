  text: וְ/הִכְרַתִּ֥י כְשָׁפִ֖ים מִ/יָּדֶ֑/ךָ וּֽ/מְעוֹנְנִ֖ים לֹ֥א יִֽהְיוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: de
  text: Und ich werde die Zauberkünste aus deiner Hand entfernen, und Wahrsager wird es bei dir nicht mehr geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeichendeuter“ oder „Zeitendeuter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Und ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet das Abschneiden beziehungsweise vollständige Beseitigen. „Ausrotten“ gibt hier die entschiedene Entfernung wieder und passt natürlich zu „Zauberkünste“.
- source_word: כְשָׁפִים
  choice: Zauberkünste
  rationale: Der Plural bezeichnet magische Praktiken. „Zauberkünste“ ist im modernen Deutschen verständlich und vermeidet die mögliche Verengung von „Hexerei“ auf bestimmte Personen oder neuzeitliche Vorstellungen.
- source_word: מִיָּדֶךָ
  choice: aus deiner Hand
  rationale: Die Übersetzung bewahrt das hebräische Bild der Hand als Bereich des Besitzes, der Verfügung oder der Ausübung.
- source_word: וּמְעוֹנְנִים
  choice: Wahrsager
  rationale: Das Partizip bezeichnet Menschen, die Zeichen oder Zeiten deuten beziehungsweise Wahrsagerei betreiben. „Wahrsager“ ist ein geläufiger, hinreichend weiter deutscher Ausdruck.
- source_word: לֹא יִהְיוּ לָךְ
  choice: wird es bei dir nicht mehr geben
  rationale: 'Wörtlich heißt es: „Sie werden nicht für dich/bei dir sein.“ Die Formulierung gibt idiomatisch wieder, dass solche Personen im Bereich des angeredeten Volkes nicht mehr vorhanden sein werden.'
theological_decisions:
- issue: Art der verurteilten Praktiken
  choice: Der Vers bezeichnet allgemein magische Praktiken und Wahrsager, die Gott aus seinem Volk entfernt.
  alternative: מְעוֹנְנִים kann enger als Zeichendeuter, Orakeldeuter oder Deuter günstiger Zeiten verstanden werden.
  rationale: Die genaue Methode der Divination ist lexikalisch nicht zweifelsfrei festgelegt. Der Haupttext bleibt daher allgemein; eine Fußnote bewahrt die engere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des Hebräischen und das Bild „aus deiner Hand“ bleiben erhalten; „bei dir nicht mehr geben“ verdeutlicht idiomatisch die Zugehörigkeits- beziehungsweise Bereichsaussage von לָךְ.
