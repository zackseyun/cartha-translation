base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: de
  text: Und ich werde deine Schnitzbilder und deine Kultsteine[a] aus deiner Mitte beseitigen, und du wirst dich nicht mehr vor dem Werk deiner Hände niederwerfen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Kultmale“, „deine heiligen Säulen“ oder „deine aufgerichteten Steine“. Das hebräische Wort bezeichnet aufgerichtete Steine, die in kultischen Zusammenhängen verwendet wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „und du wirst das Werk deiner Hände nicht mehr anbeten“. Im Hebräischen ist wörtlicher vom Sich-Niederwerfen die Rede, einer körperlichen Gebärde der Verehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Und ich werde … beseitigen
  rationale: Das Hifil von כרת bezeichnet hier das Abschneiden beziehungsweise vollständige Entfernen. „Beseitigen“ gibt die Aussage im Deutschen natürlich wieder, ohne bei unbelebten Kultgegenständen das missverständliche „ausrotten“ zu verwenden.
- source_word: פְסִילֶיךָ
  choice: deine Schnitzbilder
  rationale: פֶּסֶל bezeichnet ein durch Schnitzen oder Behauen hergestelltes Kultbild. „Schnitzbilder“ bewahrt die konkrete Herstellungsart und ist präziser als das allgemeinere „Götzen“.
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: deine Kultsteine
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein beziehungsweise ein steinernes Kultmal. „Kultsteine“ macht die kultische Funktion verständlich, ohne die Form unnötig auf eine Säule festzulegen.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die Wendung entspricht dem räumlich-gemeinschaftlichen Bild des Hebräischen und lässt offen, ob Volk, Gebiet oder beides im Blick ist.
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: und du wirst dich nicht mehr … niederwerfen
  rationale: Das Verb bezeichnet das Niederwerfen oder Sich-Verbeugen, besonders als kultische Handlung. Die Übersetzung erhält sowohl die körperliche Gebärde als auch ihre religiöse Bedeutung.
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: vor dem Werk deiner Hände
  rationale: Die Formulierung bewahrt den hebräischen Ausdruck für menschengemachte Kultgegenstände. „Vor“ ist im Deutschen die natürliche Ergänzung zu „sich niederwerfen“ und gibt hier die Funktion der Präposition לְ wieder.
theological_decisions:
- issue: Wiedergabe der verschiedenen Kultgegenstände
  choice: „Schnitzbilder“ und „Kultsteine“ als zwei unterschiedliche Gegenstandsarten
  alternative: „Götzenbilder“ und „heilige Säulen“
  rationale: Der hebräische Text nennt zwei konkrete Arten unerlaubter Kultobjekte. Die differenzierte Wiedergabe vermeidet, beide unter einem allgemeinen Begriff zusammenzufassen.
- issue: Bedeutung der abschließenden Kultgeste
  choice: „dich … vor dem Werk deiner Hände niederwerfen“
  alternative: „das Werk deiner Hände anbeten“
  rationale: Die körperliche Handlung des Niederwerfens wird ausdrücklich bewahrt; zugleich bleibt durch den Zusammenhang ihre Bedeutung als Anbetung erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache der Kultgegenstände und des Niederwerfens bleibt erhalten; zugleich werden im Deutschen unnatürliche oder missverständliche Formulierungen vermieden.
