  text: וְ/הִכְרַתִּ֖י עָרֵ֣י אַרְצֶ֑/ךָ וְ/הָרַסְתִּ֖י כָּל מִבְצָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: de
  text: Und ich werde die Städte deines Landes vernichten und alle deine Festungen niederreißen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: und ich werde … vernichten
  rationale: Das Hifil von כרת bezeichnet hier das Beseitigen oder Auslöschen. Bei Städten gibt „vernichten“ die gemeinte vollständige Entfernung im natürlichen modernen Deutsch wieder; das wörtlichere „abschneiden“ wäre in dieser Verbindung missverständlich.
- source_word: עָרֵי אַרְצֶךָ
  choice: die Städte deines Landes
  rationale: עִיר wird direkt mit „Städte“ wiedergegeben, אֶרֶץ in seinem territorialen Sinn mit „Land“. Der Suffix der 2. Person Singular erscheint als „deines“.
- source_word: וְהָרַסְתִּי
  choice: und … niederreißen
  rationale: הרס bezeichnet konkret das Einreißen oder Niederreißen und wird hier von befestigten Anlagen gebraucht. „Niederreißen“ bewahrt dieses anschauliche Moment.
- source_word: כָּל מִבְצָרֶיךָ
  choice: alle deine Festungen
  rationale: מִבְצָר bezeichnet einen befestigten Ort beziehungsweise eine Festung. „Festungen“ ist im militärischen Zusammenhang präzise und idiomatisch; כָּל wird mit „alle“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Klares, würdiges modernes Standarddeutsch. Die parallele Satzstruktur und die zwei Verben des göttlichen Gerichts bleiben erhalten; die ungewöhnliche hebräische Verbindung von כרת mit Städten wird sinngemäß, aber mit voller prophetischer Schärfe wiedergegeben.
