source:
  edition: WLC
  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: de
  text: 'Und der Rest Jakobs wird unter den Nationen sein, inmitten vieler Völker, wie ein Löwe unter den Tieren des Waldes, wie ein junger Löwe unter Schafherden: Wenn er hindurchzieht, zertritt und zerreißt er[a], und niemand kann retten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zertritt und in Stücke reißt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und ... wird ... sein
  rationale: Das Waw mit Qatal bezeichnet hier im prophetischen Zusammenhang eine künftige Folge; die Formulierung wahrt Vorhersage und Anschluss.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: der Rest Jakobs
  rationale: „Rest“ ist die etablierte, knappe Wiedergabe des prophetischen Begriffs für den übrig gebliebenen Teil Jakobs.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: „Nationen“ gibt גּוֹיִם breit und ohne die zusätzliche religiöse Konnotation von „Heiden“ wieder.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: inmitten vieler Völker
  rationale: Die räumliche Aussage von בְּקֶרֶב und der poetische Parallelismus bleiben erhalten.
- source_word: בְּבַהֲמוֹת יַעַר
  choice: unter den Tieren des Waldes
  rationale: „Tiere“ ist eine natürliche moderne Entsprechung für בְּהֵמוֹת; „des Waldes“ bewahrt die hebräische Genitivverbindung.
- source_word: כִּכְפִיר
  choice: wie ein junger Löwe
  rationale: כְּפִיר bezeichnet einen jungen, kräftigen Löwen; diese Wiedergabe ist präzise und idiomatisch.
- source_word: בְּעֶדְרֵי צֹאן
  choice: unter Schafherden
  rationale: עֶדְרֵי צֹאן bezeichnet Herden von Kleinvieh, hier im Bild besonders Schafe; „Schafherden“ ist knapp und anschaulich.
- source_word: אֲשֶׁר אִם עָבַר
  choice: Wenn er hindurchzieht
  rationale: אִם kann hier einen typischen oder möglichen Fall einleiten. Deutsches „wenn“ erhält diese Offenheit natürlicher als ein schwerfälliges „falls“.
- source_word: וְרָמַס וְטָרַף
  choice: zertritt und zerreißt er
  rationale: Die beiden Verben werden als lebendige Prädatorenhandlung wiedergegeben, ohne den zweiten Ausdruck unnötig zu „zerreißt in Stücke“ zu erweitern.
- source_word: וְאֵין מַצִּיל
  choice: und niemand kann retten
  rationale: Die idiomatische Aussage vom Fehlen eines Retters wird in natürlichem Deutsch ausgedrückt und bleibt auf das unmittelbare Gefahrenbild bezogen.
theological_decisions:
- issue: Der Rest Jakobs als Löwe unter den Nationen
  choice: Das Bild uneingeschränkter, überwältigender Stärke wird beibehalten, ohne seine Erfüllungsweise näher festzulegen.
  alternative: Das Bild ausdrücklich als militärische Eroberung oder ausschließlich als symbolischen Einfluss deuten.
  rationale: Der hebräische Text zeichnet räuberische Überlegenheit, bestimmt aber nicht ausdrücklich, ob diese militärisch, politisch oder enger eschatologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Bildsprache. Der Doppelpunkt macht den Bezug des folgenden Relativsatzes auf den jungen Löwen im Deutschen klar. Die Bedingungs- beziehungsweise Wiederholungsnuance von אִם bleibt mit „wenn“ offen.
