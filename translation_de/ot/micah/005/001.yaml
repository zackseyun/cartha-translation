id: MIC.5.1
reference: Micah 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: de
  text: Doch du, Bethlehem-Efrata, bist zu klein, um zu den Sippen Judas zu zählen[a]. Aus dir wird für mich einer hervorgehen, der Herrscher in Israel sein soll. Sein Hervorgehen reicht bis in die Vorzeit zurück, bis in die Tage der Urzeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu klein, um unter den Tausendschaften Judas zu sein“. Mit den „Tausendschaften“ sind hier wahrscheinlich Sippenverbände gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Ursprünge liegen in alter Zeit, in längst vergangenen Tagen.“ Das Hebräische kann auch stärker verstanden werden: „Sein Hervorgehen ist von alters her, aus den Tagen der Ewigkeit.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: Bethlehem-Efrata
  rationale: Beide Ortsbezeichnungen bleiben erhalten; der Bindestrich macht die zusammengehörige Benennung im Deutschen klar und unterscheidet diesen Ort von einem anderen Bethlehem.
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: zu klein, um zu den Sippen Judas zu zählen
  rationale: Die Wiedergabe bewahrt die durch den Infinitiv ausgedrückte Aussage „zu klein, um …“; אַלְפֵי bezeichnet hier wahrscheinlich die sozialen beziehungsweise administrativen Sippenverbände Judas, wörtlich jedoch „Tausendschaften“.
- source_word: מִמְּךָ לִי יֵצֵא
  choice: Aus dir wird für mich einer hervorgehen
  rationale: „Hervorgehen“ bildet יֵצֵא konkret und zugleich würdevoll ab. „Für mich“ bewahrt לִי, ohne die Art der göttlichen Beauftragung näher festzulegen.
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: der Herrscher in Israel sein soll
  rationale: „Herrscher“ entspricht מוֹשֵׁל; „in Israel“ folgt der hebräischen Präposition בְּ. „Sein soll“ gibt die Zweckbestimmung des Infinitivs wieder.
- source_word: מוֹצָאֹתָיו
  choice: sein Hervorgehen
  rationale: Die verbale Vorstellung des Heraus- oder Hervorgehens bleibt erhalten, während die schwer verständliche wörtliche Mehrzahl „seine Ausgänge“ vermieden wird. Die mögliche Bedeutung „Ursprünge“ wird in der Fußnote genannt.
- source_word: מִקֶּדֶם מִימֵי עוֹלָם
  choice: bis in die Vorzeit zurück, bis in die Tage der Urzeit
  rationale: Die Formulierung gibt die zeitliche Ferne natürlich wieder. Da עוֹלָם sowohl unabsehbare Vorzeit als auch Ewigkeit bezeichnen kann, wird die stärkere Lesart in der Fußnote offengehalten.
theological_decisions:
- issue: Bezeichnet der Schluss eine Herkunft aus uralter Zeit oder ausdrücklich ewige Präexistenz?
  choice: Im Haupttext steht die offene zeitliche Formulierung „bis in die Vorzeit zurück, bis in die Tage der Urzeit“; die mögliche stärkere Bedeutung wird in der Fußnote benannt.
  alternative: „von alters her, aus den Tagen der Ewigkeit“ beziehungsweise „von Ewigkeit her“
  rationale: מִקֶּדֶם und עוֹלָם können sehr frühe, unabsehbare Zeit bezeichnen, wobei עוֹלָם im Kontext auch stärker als „Ewigkeit“ verstanden werden kann. Der Text soll weder eine ausschließlich historische Herkunft noch ausdrücklich eine dogmatisch definierte ewige Präexistenz festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am Hebräischen, ohne unnatürlich zu wirken. „Hervorgehen“ erhält die verbale Bildlichkeit von מוֹצָאֹתָיו; die Fußnoten dokumentieren sowohl die wörtlichere Ausdrucksweise als auch die zeitlich-theologische Spannweite.
