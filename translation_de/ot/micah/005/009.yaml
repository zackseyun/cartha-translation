  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה וְ/הִכְרַתִּ֥י סוּסֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הַאֲבַדְתִּ֖י מַרְכְּבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: de
  text: 'Und es wird geschehen an jenem Tag, spricht Jahwe: Ich werde deine Pferde aus deiner Mitte[a] beseitigen und deine Streitwagen vernichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus deinem Inneren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Und an jenem Tag wird es geschehen
  rationale: Die prophetische Zukunftsformel wird vollständig und zugleich idiomatisch wiedergegeben. „An jenem Tag“ entspricht dem natürlichen deutschen Sprachgebrauch; „wird es geschehen“ bewahrt den ausdrücklich vorhandenen Verbalausdruck וְהָיָה.
- source_word: נְאֻם יְהוָה
  choice: lautet der Ausspruch Jahwes
  rationale: Die feste prophetische Botenformel wird würdevoll und quellennah wiedergegeben. „Ausspruch“ erhält den nominalen Charakter von נְאֻם, während „lautet“ die Formel natürlich in den deutschen Satz einfügt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Form „Jahwe“ gibt den Eigennamen des Gottes Israels wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְהִכְרַתִּי
  choice: Ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier ein entschiedenes Beseitigen. „Ausrotten“ bewahrt die starke, endgültige Aussage und passt idiomatisch zu den militärisch verwendeten Pferden.
- source_word: סוּסֶיךָ
  choice: deine Pferde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der zweiten Person maskulin Singular; die angesprochene Gemeinschaft erscheint wie im Hebräischen als kollektives Du.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die Wendung gibt die räumlich-kollektive Bedeutung von קֶרֶב eng wieder und lässt offen, ob der Schwerpunkt auf dem Gebiet oder der Gemeinschaft des Angesprochenen liegt.
- source_word: וְהַאֲבַדְתִּי
  choice: und … vernichten
  rationale: Das Hifil von אבד bedeutet, etwas zugrunde gehen zu lassen beziehungsweise zu zerstören. „Vernichten“ ist im Zusammenhang mit Kriegsgerät klar und kraftvoll.
- source_word: מַרְכְּבֹתֶיךָ
  choice: deine Streitwagen
  rationale: „Streitwagen“ bezeichnet im Deutschen eindeutig die militärischen Wagen, die zusammen mit den Pferden als Kriegsmittel genannt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Übersetzung bewahrt es als Eigennamen in der üblichen deutschen Form, statt es durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung der Entfernung von Pferden und Streitwagen
  choice: Konkrete Ankündigung, dass Jahwe die militärischen Mittel beseitigt
  alternative: Ausdrückliche Deutung als Gericht über das Vertrauen auf militärische Macht oder als Reinigung von Kriegslust
  rationale: Der Haupttext bleibt bei der konkreten Aussage des Verses. Mögliche theologische Deutungen aus dem größeren Zusammenhang werden nicht in den Wortlaut hineingetragen.
- issue: Bezug der singularischen Anrede
  choice: Kollektives „du/dein“ wird beibehalten
  alternative: Pluralische Anrede „ihr/eure“ oder ausdrückliche Nennung Israels beziehungsweise Zions
  rationale: Die hebräischen Suffixe stehen im maskulinen Singular. Ihre Beibehaltung wahrt den nicht ausdrücklich benannten kollektiven Adressaten und vermeidet eine interpretierende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Der Satzbau bleibt gut verständlich, bewahrt aber die feierliche Botenformel. Die starke Bildsprache der Verben wird nicht abgeschwächt; militärische Bedeutung wird durch „Streitwagen“ präzisiert.
