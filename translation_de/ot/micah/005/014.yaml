  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: de
  text: Und in Zorn und Grimm werde ich Rache üben an den Völkern, die nicht hörten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die nicht gehorchten« oder »die nicht darauf hörten«. Das hebräische Verb kann sowohl Hören als auch ein hörendes, gehorsames Reagieren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי ... נָקָם
  choice: Und … werde ich Rache üben
  rationale: Die Verbindung von עשה mit נָקָם ist eine feste Sinnverbindung für das Vollziehen von Rache. »Rache üben« ist im Deutschen idiomatisch, präzise und bewahrt den vergeltenden Gerichtscharakter.
- source_word: בְּאַף
  choice: in Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch Zorn. »In Zorn« gibt die Präposition knapp wieder und passt zum würdevollen prophetischen Sprachstil.
- source_word: וּבְחֵמָה
  choice: und Grimm
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm. »Grimm« unterscheidet das Wort von אַף, erhält die steigernde Parallelität und ist in diesem Zusammenhang verständlich, ohne altertümlich zu wirken.
- source_word: אֶת הַגּוֹיִם
  choice: an den Völkern
  rationale: אֶת markiert hier das Ziel der Rache. Die deutsche Verbindung lautet idiomatisch »Rache üben an«; »Völker« ist die direkte kontextgemäße Wiedergabe von גּוֹיִם.
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: die nicht gehört haben
  rationale: שׁמע kann hören, auf etwas hören oder gehorchen bedeuten. »Nicht gehört haben« bewahrt im Haupttext die lexikalische Grundbedeutung und die Mehrdeutigkeit; die Gehorsamsnuance wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von שָׁמֵעוּ im Blick auf die gerichteten Völker
  choice: die nicht gehört haben
  alternative: die nicht gehorcht haben; die nicht darauf gehört haben
  rationale: Das hebräische Verb umfasst sowohl das Hören als auch die gehorsame Reaktion. Der Haupttext legt sich nicht einseitig auf bloße Wahrnehmung oder ausdrücklichen Ungehorsam fest; die Fußnote macht den möglichen Gehorsamssinn sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Prägnanz. Die Paarung »Zorn und Grimm« erhält die Intensivierung des Hebräischen; »Rache üben« ist natürliches Deutsch und wahrt den gerichtlichen Ernst.
