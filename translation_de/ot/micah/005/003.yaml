reference: Micah 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָמַ֗ד וְ/רָעָה֙ בְּ/עֹ֣ז יְהוָ֔ה בִּ/גְא֕וֹן שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו וְ/יָשָׁ֕בוּ כִּֽי עַתָּ֥ה יִגְדַּ֖ל עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: de
  text: Und er wird dastehen und als Hirte weiden in der Kraft Jahwes, in der Hoheit des Namens Jahwes, seines Gottes. Und sie werden sicher wohnen[a]; denn jetzt[b] wird er groß sein bis an die Enden der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden wohnen.“ Das hebräische Verb bedeutet wörtlich „wohnen“, „sitzen“ oder „bleiben“; die Sicherheit ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „denn jetzt“. Manche Übersetzungen geben zur Glättung der prophetischen Zeitfolge „denn dann“ wieder; das hebräische Adverb lautet jedoch „jetzt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: Und er wird dastehen
  rationale: עמד bedeutet konkret „stehen“. „Dastehen“ bewahrt das Bild des Herrschers, der seinen Platz einnimmt und beständig ausübt, ohne es durch „auftreten“ oder „sich erheben“ auszudeuten.
- source_word: וְרָעָה
  choice: und als Hirte weiden
  rationale: רעה bezeichnet das Weiden beziehungsweise Hüten einer Herde. Die Formulierung erhält sowohl das Hirtenbild als auch dessen königliche Bedeutung und klingt im heutigen Deutsch natürlicher als das isolierte „weiden“.
- source_word: בְּעֹז יְהוָה
  choice: in der Kraft Jahwes
  rationale: עֹז bezeichnet Kraft oder Macht; ב kann hier den Wirkungsbereich oder das Mittel ausdrücken. „In der Kraft“ hält sich eng an die Bildsprache. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: in der Hoheit des Namens Jahwes, seines Gottes
  rationale: גאון kann Hoheit, Erhabenheit oder Majestät bedeuten. „Hoheit“ passt zum königlichen Zusammenhang; die hebräische Genitivverbindung und „seines Gottes“ bleiben ausdrücklich erhalten.
- source_word: וְיָשָׁבוּ
  choice: Und sie werden sicher wohnen
  rationale: ישב bedeutet „sitzen“, „wohnen“ oder „bleiben“. Die Sicherheit ist im Zusammenhang vorausgesetzt; „sicher wohnen“ macht diese Folge der Hirtenherrschaft verständlich, während die Fußnote die wörtlich knappere Wiedergabe nennt.
- source_word: כִּי עַתָּה
  choice: denn jetzt
  rationale: כִּי führt die Begründung ein, und עַתָּה bedeutet gewöhnlich „jetzt“. Die Übersetzung wahrt die prophetische Unmittelbarkeit, statt den Ausdruck zur zeitlichen Glättung in „dann“ zu ändern.
- source_word: יִגְדַּל
  choice: wird er groß sein
  rationale: גדל bezeichnet hier Größe beziehungsweise Erhabenheit. „Groß sein“ vermeidet die möglicherweise entwicklungsbezogene Nebenbedeutung von „groß werden“.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die feste Wendung bezeichnet die äußersten Bereiche der Erde. Die gewählte Form ist quellennah, verständlich und im Deutschen idiomatisch.
theological_decisions:
- issue: Bezug der Verben in der dritten Person Singular
  choice: Das Subjekt bleibt schlicht „er“ und verweist auf den angekündigten Herrscher des vorangehenden Zusammenhangs.
  alternative: Den Bezug im Vers ausdrücklich als „Messias“, „Christus“, „König“ oder nur als allgemeinen davidischen Herrscher benennen.
  rationale: Der unmittelbare Kontext spricht von dem kommenden Herrscher, doch der hebräische Vers selbst verwendet nur Verben in der dritten Person Singular. Daher wird keine auslegende Amtsbezeichnung ergänzt.
- issue: אֱלֹהָיו in Bezug auf den Herrscher
  choice: „seines Gottes“ wird unverändert beibehalten.
  alternative: Die Wendung aus christologischen oder anderen systematisch-theologischen Gründen umformulieren oder abschwächen.
  rationale: Der hebräische Text nennt Jahwe ausdrücklich „seinen Gott“. Die Übersetzung bewahrt diese Aussage und die damit verbundene theologische Spannung, ohne sie erläuternd aufzulösen.
- issue: Implizite Sicherheit in וְיָשָׁבוּ
  choice: Die kontextuell nahe Bedeutung wird als „sie werden sicher wohnen“ im Haupttext ausgedrückt.
  alternative: Nur „sie werden wohnen“ beziehungsweise „sie werden bleiben“.
  rationale: Das Verb selbst bezeichnet das Wohnen oder Bleiben; die sichere Wohnlage ergibt sich aus dem Herrschafts- und Friedenszusammenhang. Eine Fußnote macht den Unterschied zwischen Wortbedeutung und Kontextaussage transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Hirten- und Herrschaftsbildsprache. Der Gottesname wird als „Jahwe“ wiedergegeben. Die Wortstellung ist lesbar gegliedert, ohne die Wiederholung des Namens Jahwes oder die Formulierung „seines Gottes“ zu glätten.
