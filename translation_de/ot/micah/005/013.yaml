  terminology: „Aschera-Pfähle“ ist eine etablierte und verständliche Bezeichnung für die wahrscheinliche Referenz. Die Fußnote bewahrt mit „Ascheren“ und „Kultpfähle“ die möglichen alternativen Auffassungen und erläutert den religionsgeschichtlichen Bezug zurückhaltend. Theologisch aufgeladene oder konfessionell einengende Terminologie liegt nicht vor.
