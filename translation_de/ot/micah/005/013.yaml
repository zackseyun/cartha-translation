  text: וְ/נָתַשְׁתִּ֥י אֲשֵׁירֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הִשְׁמַדְתִּ֖י עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: de
  text: Und ich werde deine Aschera-Pfähle aus deiner Mitte ausreißen[a] und deine Städte vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Ascheren“ beziehungsweise „deine Kultpfähle“. Das hebräische Wort kann Kultobjekte bezeichnen, die mit der Göttin Aschera verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: und ich werde … ausreißen
  rationale: נתשׁ bezeichnet das Herausreißen oder Entwurzeln von etwas Feststehendem. „Ausreißen“ passt natürlich zu hölzernen Kultobjekten.
- source_word: אֲשֵׁירֶיךָ
  choice: deine Aschera-Pfähle
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich hölzerne Kultobjekte, die mit der Göttin Aschera verbunden waren. Die konkrete Wiedergabe bewahrt zugleich den religionsgeschichtlichen Eigennamen.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Dies gibt die räumlich und gemeinschaftlich geprägte Wendung מִקֶּרֶב direkt und in würdigem Deutsch wieder.
- source_word: וְהִשְׁמַדְתִּי
  choice: und … vernichten
  rationale: Der Hifil von שׁמד drückt vollständige Zerstörung aus. „Vernichten“ wahrt die Stärke des Verbs.
- source_word: עָרֶיךָ
  choice: deine Städte
  rationale: עִיר bedeutet regulär „Stadt“; der Plural mit Suffix wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Referenz von אֲשֵׁירֶיךָ
  choice: Kultobjekte, die mit der Verehrung Ascheras verbunden sind („Aschera-Pfähle“)
  alternative: „deine Ascheren“ oder allgemeiner „deine Kultpfähle“
  rationale: Der Zusammenhang nennt Dinge, die im Gericht beseitigt werden. Das Herausreißen legt konkrete hölzerne Kultobjekte nahe; da der hebräische Ausdruck jedoch auch anders gefasst werden kann, bleibt die Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gottesrede und die parallele Satzstruktur des Hebräischen bleiben erhalten; „Aschera-Pfähle“ ist verständlicher als die fachsprachliche Form „Ascheren“, ohne die kultische Spezifik zu verallgemeinern.
