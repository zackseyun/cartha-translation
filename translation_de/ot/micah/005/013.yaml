  source_fidelity: Der Entwurf gibt die beiden weqatal-/Perfektformen in Gottes künftiger Gerichtsankündigung angemessen mit „ich werde“ wieder. נָתַשׁ ist mit „ausreißen“ treffend wiedergegeben; מִקִּרְבֶּךָ entspricht „aus deiner Mitte“. „Aschera-Pfähle“ gibt die im Kontext wahrscheinlichen Kultobjekte wieder, ohne die lexikalische Mehrdeutigkeit zu verschweigen. „vernichten“ bildet den starken Hifil von שׁמד sachgerecht ab, und עָרֶיךָ ist korrekt „deine Städte“.
