  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe insgesamt zuverlässig wieder: זֶה bleibt als persönlicher Rückverweis erhalten, שָׁלוֹם wird nicht zu einer bloßen Friedenswirkung abgeschwächt, und die Zahlenfolge wird wörtlich belassen. „Assur“ kann sowohl das Reich als auch den personifizierten Angreifer bezeichnen; das folgende „ihn“ ist in diesem metonymischen Verständnis möglich und wird durch die Fußnote ausreichend abgesichert. Die Wiedergabe von אַרְמְנֹתֵינוּ als „Festungen“ ist im Invasionskontext vertretbar, sollte aber nicht durch ein Verb abgeschwächt werden, das lediglich ein feierliches Schreiten bezeichnet.'
