  terminology: „Frieden“, „Hirten“ und „Fürsten“ bewahren die maßgeblichen Begriffe und ihre Metaphorik. „Fürsten unter den Menschen“ ist eine vertretbare, verständliche Wiedergabe von נְסִיכֵי אָדָם, ohne eine weitergehende anthropologische oder theologische Deutung einzutragen. Die Fußnoten bilden den erweiterten Sinn von שָׁלוֹם, die Mehrdeutigkeit von אַשּׁוּר und אַרְמוֹן sowie die idiomatische Zahlenfolge angemessen ab.
