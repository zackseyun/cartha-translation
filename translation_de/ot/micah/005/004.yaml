id: MIC.5.4
reference: Micah 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: de
  text: Und dieser wird Frieden sein.[a] Wenn Assur[b] in unser Land kommt und in unsere Festungen[c] eindringt, werden wir gegen ihn sieben Hirten und acht Fürsten unter den Menschen aufstellen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frieden“ kann hier auch umfassendes Heil, Wohlergehen und Unversehrtheit einschließen.
    reason: lexical_range
  - marker: b
    text: 'Oder: „der Assyrer“. Das hebräische Wort kann Assur als Reich oder den assyrischen Angreifer bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Palästen“. Das hebräische Wort kann Paläste oder befestigte Herrschaftssitze meinen.'
    reason: lexical_alternative
  - marker: d
    text: „Sieben … und acht“ ist eine hebräische Zahlenfolge, die wahrscheinlich eine reichliche oder hinreichende Anzahl ausdrückt.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה זֶה שָׁלוֹם
  choice: Und dieser wird Frieden sein
  rationale: Das Demonstrativpronomen זֶה verweist auf den zuvor genannten Herrscher zurück. Die prädikative Aussage mit שָׁלוֹם wird bewusst nicht zu „Frieden bringen“ abgeschwächt; „Frieden“ bewahrt zugleich den weiteren Sinn von Heil und Wohlergehen.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Der traditionelle deutsche Name gibt die Bezeichnung des Landes beziehungsweise Reiches wieder; die mögliche Personifizierung als assyrischer Angreifer bleibt in einer Fußnote erhalten.
- source_word: כִּי יָבוֹא
  choice: Wenn … kommt
  rationale: כִּי leitet hier im Zusammenhang am natürlichsten den zeitlichen Fall des Eindringens ein. „Wenn“ bewahrt dies, ohne die Aussage als bloß hypothetisch festzulegen.
- source_word: בְאַרְצֵנוּ
  choice: in unser Land
  rationale: Bei einem Bewegungsverb bezeichnet ב den Eintritt in das Land; im Deutschen ist „in unser Land kommt“ idiomatisch.
- source_word: וְכִי יִדְרֹךְ
  choice: und … einhertritt
  rationale: דרך bezeichnet wörtlich das Treten oder Schreiten. „Einhertritt“ erhält das konkrete Bild und den bedrohlichen militärischen Unterton, ohne ausdrücklich „zertrampelt“ in den Text einzutragen.
- source_word: בְאַרְמְנֹתֵינוּ
  choice: in unseren Festungen
  rationale: אַרְמוֹן kann einen Palast oder einen befestigten Herrschaftssitz bezeichnen. Im Invasionszusammenhang ist „Festungen“ natürlich und sachlich passend; „Paläste“ bleibt als lexikalische Alternative vermerkt.
- source_word: וַהֲקֵמֹנוּ עָלָיו
  choice: werden wir gegen ihn … aufstellen
  rationale: Der Hifil von קום bedeutet hier, jemanden auftreten zu lassen beziehungsweise einzusetzen. „Aufstellen“ passt zur Abwehrlage; das maskuline Pronomen gibt die Personifizierung des Angreifers wieder.
- source_word: שִׁבְעָה רֹעִים
  choice: sieben Hirten
  rationale: Die wörtliche Herrschermetapher „Hirten“ wird bewahrt und nicht durch „Anführer“ erklärt.
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: und acht Fürsten unter den Menschen
  rationale: נְסִיכִים bezeichnet Fürsten beziehungsweise eingesetzte Führer. „Unter den Menschen“ gibt die generische Verbindung mit אָדָם verständlich wieder, ohne daraus eine Aussage über die gesamte Menschheit zu machen.
theological_decisions:
- issue: Bezugswort von „dieser“
  choice: Der Ausdruck verweist auf den im vorhergehenden Zusammenhang angekündigten Herrscher.
  alternative: Formal könnte man „dies“ lesen und die Aussage weniger ausdrücklich personal formulieren.
  rationale: Der unmittelbare Diskurszusammenhang legt den persönlichen Rückverweis nahe; die Übersetzung fügt jedoch keine weitergehende dogmatische Identifikation hinzu.
- issue: Aussage „wird Frieden sein“
  choice: Die nominale Identifikation wird wörtlich bewahrt.
  alternative: „Er wird Frieden bringen“ oder „er wird für Frieden sorgen“.
  rationale: Die Alternativen erklären eine mögliche Wirkung, schwächen aber die stärkere und theologisch spannungsvolle Formulierung des Hebräischen ab.
- issue: Identität Assurs beziehungsweise des Angreifers
  choice: Im Haupttext steht das Reich „Assur“, das anschließend durch „ihn“ personifiziert wird.
  alternative: „Der Assyrer“ als persönliche Bezeichnung des Angreifers.
  rationale: אַשּׁוּר kann die politische Macht oder metonymisch deren Angreifer bezeichnen. Haupttext und Fußnote bewahren beide Möglichkeiten.
- issue: Zahlenpaar „sieben … acht“
  choice: Die Zahlen werden wörtlich übersetzt; ihre idiomatische Kraft wird in einer Fußnote erläutert.
  alternative: Eine rein arithmetische Zahl von genau fünfzehn Führern.
  rationale: Die in der hebräischen Dichtung geläufige Steigerungsformel bezeichnet wahrscheinlich eine reichliche oder hinreichende Zahl, doch der Wortlaut soll diese Deutung nicht an die Stelle der Zahlen setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser“ hält den Rückverweis sichtbar; „einhertritt“ bewahrt das Trittbild in gehobenem, aber verständlichem Register. Die Herrschermetapher „Hirten“ und die starke Aussage „wird Frieden sein“ bleiben formal erhalten, während Fußnoten echte lexikalische und idiomatische Mehrdeutigkeiten offenlegen.
