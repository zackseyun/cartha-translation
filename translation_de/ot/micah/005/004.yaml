revisions:
- from: Und dieser wird Frieden sein.[a] Wenn Assur[b] in unser Land kommt und in unseren Festungen[c] einhertritt, werden wir gegen ihn sieben Hirten und acht Fürsten unter den Menschen aufstellen.[d]
  to: Und dieser wird Frieden sein.[a] Wenn Assur[b] in unser Land kommt und in unsere Festungen[c] eindringt, werden wir gegen ihn sieben Hirten und acht Fürsten unter den Menschen aufstellen.[d]
  rationale: Die Revision ersetzt ausschließlich „einhertritt“ durch „eindringt“. Damit wird der militärische Kontext klar und idiomatisch ausgedrückt, ohne die konkrete hebräische Bildsprache durch eine stärkere Deutung wie „zertrampelt“ zu ersetzen. Text, Ambiguitäten und Fußnotenanker bleiben vollständig erhalten.
