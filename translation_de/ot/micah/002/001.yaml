  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: de
  text: Wehe denen, die Unheil planen und auf ihren Lagern Böses tun! Beim Morgenlicht führen sie es aus[a], weil es in ihrer Macht steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil ihre Hand ihr Gott ist“; dabei wird „Gott“ bildlich als Bezeichnung ihrer selbstherrlichen Macht verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Interjektion leitet eine drohende Anklage ein; „Wehe“ bewahrt ihre eindringliche, feierliche Kraft.
- source_word: חֹשְׁבֵי אָוֶן
  choice: die Unheil planen
  rationale: חשב bezeichnet hier absichtsvolles Planen; אָוֶן umfasst moralisch verwerfliches Unheil und Unrecht. Die Formulierung ist natürlich und wahrt die Unterscheidung zum folgenden רָע.
- source_word: וּפֹעֲלֵי רָע עַל מִשְׁכְּבוֹתָם
  choice: und auf ihren Betten Böses aushecken
  rationale: Die Partizipialkonstruktion beschreibt weiterhin das nächtliche Planen. „Aushecken“ gibt פעל in diesem Zusammenhang idiomatisch wieder, ohne schon die erst am Morgen erfolgende Ausführung vorwegzunehmen.
- source_word: בְּאוֹר הַבֹּקֶר
  choice: Sobald der Morgen hell wird
  rationale: Die Wiedergabe bewahrt das Bild vom Licht des Morgens und macht zugleich den zeitlichen Übergang von nächtlichem Planen zu morgendlichem Handeln deutlich.
- source_word: יַעֲשׂוּהָ
  choice: führen sie es aus
  rationale: Das feminine Suffix nimmt das geplante böse Vorhaben auf. „Ausführen“ bringt den Gegensatz zwischen Plan und Tat klar und natürlich zum Ausdruck.
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: weil es in ihrer Macht steht
  rationale: אֵל bezeichnet hier am wahrscheinlichsten Macht oder Vermögen; die deutsche Wendung gibt den idiomatischen Sinn verständlich wieder, auch wenn das Handbild nicht ausdrücklich erhalten bleibt.
theological_decisions:
- issue: Bedeutung von לְאֵל im Schlusssatz
  choice: idiomatisch als „Macht“
  alternative: „weil ihre Hand ihr Gott ist“
  rationale: 'Im Zusammenhang begründet der Satz, weshalb die Täter ihre Pläne umgehend verwirklichen: Sie besitzen die Macht dazu. Die mögliche rhetorisch-theologische Deutung von אֵל als „Gott“ bleibt wegen der echten Mehrdeutigkeit in einer Fußnote erhalten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nächtliche Planung und die Ausführung bei Tagesanbruch werden sprachlich klar unterschieden. Der Fußnotenmarker [a] steht unmittelbar an der einschlägigen Aussage im Haupttext.
