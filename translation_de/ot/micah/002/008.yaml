  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: de
  text: 'Doch erst kürzlich hat sich mein Volk wie ein Feind erhoben: Ihr zieht denen, die arglos vorübergehen, den Mantel vom Leib – den Heimkehrern aus dem Krieg.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denen, die dem Krieg ausweichen« beziehungsweise »denen, die sich vom Kampf abgewandt haben«. Die hebräische Schlusswendung ist schwierig und kann friedliche Nichtkämpfer statt Heimkehrer aus dem Krieg bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: Doch seit Kurzem
  rationale: Das Adverb bezeichnet wörtlich »gestern«, kann aber idiomatisch die jüngste Vergangenheit meinen. »Doch seit Kurzem« gibt sowohl den zeitlichen als auch den gegensätzlichen Sinn wieder.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die schlichte Possessivverbindung bewahrt den Bundes- und Beziehungston.
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: erhebt sich … wie ein Feind
  rationale: קום bezeichnet hier ein feindseliges Sich-Erheben; לְאוֹיֵב wird prädikativ beziehungsweise vergleichend verstanden. »Wie ein Feind« vermeidet die stärkere Aussage, das Volk sei zu einem Feind geworden.
- source_word: מִמּוּל שַׂלְמָה אֶדֶר
  choice: Vom Gewand … den Mantel
  rationale: Die schwierige Verbindung bezeichnet im Kontext am ehesten das Abziehen eines äußeren Kleidungsstücks. Die zwei deutschen Kleidungsbegriffe bilden die hebräische Wortpaarung ab, ohne eine unsichere technische Unterscheidung zu behaupten.
- source_word: תַּפְשִׁטוּן
  choice: zieht ihr … ab
  rationale: Der Hifil von פשט bedeutet, Kleidung auszuziehen beziehungsweise abzustreifen. Die Form bezeichnet ausdrücklich eine Mehrzahl von Angeredeten.
- source_word: מֵעֹבְרִים בֶּטַח
  choice: denen, die arglos vorübergehen
  rationale: Das Partizip bezeichnet Vorübergehende. בֶּטַח kann Sicherheit oder unbekümmertes Vertrauen ausdrücken; »arglos« hebt hier ihre friedliche, nichtsahnende Lage hervor.
- source_word: שׁוּבֵי מִלְחָמָה
  choice: die aus dem Krieg heimkehren
  rationale: Diese Deutung versteht שוב im üblichen Sinn von »zurückkehren«. Da die syntaktisch und semantisch schwierige Wendung auch anders aufgefasst werden kann, wird die Alternative in einer Fußnote bewahrt.
theological_decisions:
- issue: Deutung der schwierigen Schlusswendung שׁוּבֵי מִלְחָמָה
  choice: die aus dem Krieg heimkehren
  alternative: die dem Krieg ausweichen / die sich vom Kampf abgewandt haben
  rationale: Die gewählte Lesart folgt dem naheliegenden Sinn von שוב als »zurückkehren« und ergibt im Zusammenhang das Bild schutzloser Heimkehrer, die beraubt werden. Weil der hebräische Ausdruck umstritten ist, wird die mögliche Beschreibung friedlicher Nichtkämpfer nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anklage wird durch den Wechsel vom singularischen »mein Volk« zum pluralischen »ihr« sichtbar gehalten. »Arglos« klingt natürlich und lässt sowohl Sicherheit als auch nichtsahnendes Vertrauen anklingen.
