source:
  edition: WLC
  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: de
  text: Darum wird es für dich niemanden geben, der in der Versammlung Jahwes die Messschnur nach dem Los auswirft.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Schnur“, „Seil“ oder „Zuteilungsschnur“. Das hebräische Wort bezeichnet hier wohl die Schnur, mit der zugeteiltes Erbland vermessen wurde.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die versammelte Bundesgemeinschaft bei der Verteilung des Landes durch das Los.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die angekündigte Folge des zuvor ausgesprochenen Gerichts und klingt im modernen prophetischen Deutsch natürlich.
- source_word: לֹא יִהְיֶה לְךָ
  choice: wird es für dich niemanden geben
  rationale: Bewahrt die hebräische Existenzkonstruktion und die direkte Anrede im maskulinen Singular, ohne den angesprochenen Personenkreis näher festzulegen.
- source_word: מַשְׁלִיךְ
  choice: der … auswirft
  rationale: Das Partizip bezeichnet substantivisch denjenigen, der die Schnur wirft; der Relativsatz gibt dies im Deutschen klar wieder.
- source_word: חֶבֶל
  choice: die Messschnur
  rationale: Im Zusammenhang der Landzuteilung bezeichnet das Wort eine Schnur zum Vermessen beziehungsweise Abgrenzen eines Erbteils.
- source_word: בְּגוֹרָל
  choice: beim Losentscheid
  rationale: Gibt die Verteilung des Landes durch das Los verständlich wieder und erhält das konkrete Zuteilungsverfahren.
- source_word: בִּקְהַל יְהוָה
  choice: in der Versammlung Jahwes
  rationale: קהל bezeichnet die versammelte Bundesgemeinschaft; „Versammlung“ bewahrt den gemeinschaftlichen und formellen Charakter. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bezug der Anrede im maskulinen Singular
  choice: Die direkte Singularanrede bleibt mit „für dich“ erhalten.
  alternative: Explizite Wiedergabe als eine Gruppe von Unterdrückern oder Landräubern.
  rationale: Der unmittelbare Zusammenhang legt ein Gericht über die Landräuber nahe, doch der Vers selbst bestimmt den genauen Adressaten nicht näher; daher wird nicht überpräzisiert.
- issue: Bedeutung des Ausschlusses aus der Landverteilung
  choice: Der Wortlaut beschreibt, dass für den Angesprochenen niemand an der künftigen Landzuteilung in Jahwes Versammlung teilnehmen wird.
  alternative: Allgemeiner Ausschluss des Angesprochenen selbst aus der Bundesgemeinschaft.
  rationale: Das Bild der geworfenen Messschnur und des Losentscheids weist konkret auf Landverteilung; eine umfassendere Aussage über den Bundesstatus wäre eine mögliche Folgerung, geht aber über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform erhält die direkte Gerichtsaussage und das konkrete Bild der Landvermessung; Fachsprache wird in den Fußnoten erläutert.
