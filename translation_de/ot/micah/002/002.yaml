  text: וְ/חָמְד֤וּ שָׂדוֹת֙ וְ/גָזָ֔לוּ וּ/בָתִּ֖ים וְ/נָשָׂ֑אוּ וְ/עָֽשְׁקוּ֙ גֶּ֣בֶר וּ/בֵית֔/וֹ וְ/אִ֖ישׁ וְ/נַחֲלָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: de
  text: Sie begehren Felder und reißen sie an sich[a], Häuser und nehmen sie weg[b]. Sie unterdrücken einen Mann und sein Haus[c], einen Mann und sein Erbteil[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rauben sie“ oder „nehmen sie mit Gewalt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schaffen sie fort“.'
    reason: lexical_alternative
  - marker: c
    text: „Haus“ kann hier auch die Hausgemeinschaft beziehungsweise den gesamten häuslichen Besitzbereich bezeichnen.
    reason: lexical_ambiguity
  - marker: d
    text: Das „Erbteil“ meint besonders den ererbten Familienbesitz, häufig das angestammte Land, nicht nur Besitz im Allgemeinen.
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: begehren
  rationale: '„Begehren“ bewahrt den moralischen Ernst des Verbs: Das Verlangen richtet sich auf den Besitz anderer und führt unmittelbar zur widerrechtlichen Aneignung.'
- source_word: שָׂדוֹת
  choice: Felder
  rationale: Die konkrete Bezeichnung für landwirtschaftlich genutzte Grundstücke entspricht dem hebräischen Plural und ist im Deutschen natürlich.
- source_word: גָזָלוּ
  choice: reißen sie an sich
  rationale: Die Wendung bringt die gewaltsame oder widerrechtliche Aneignung zum Ausdruck und passt idiomatisch zu Feldern als Besitz.
- source_word: בָתִּים
  choice: Häuser
  rationale: Die direkte Wiedergabe erhält den konkreten Bezug auf Immobilien und Eigentum.
- source_word: נָשָׂאוּ
  choice: nehmen sie weg
  rationale: Im Zusammenhang bezeichnet das Verb das Wegnehmen beziehungsweise Fortschaffen der Häuser nach ihrer Aneignung; die schlichte Formulierung lässt die genaue Art offen.
- source_word: עָשְׁקוּ
  choice: unterdrücken
  rationale: Das Verb umfasst hier soziale und wirtschaftliche Unterdrückung, einschließlich Ausbeutung und widerrechtlicher Besitzentziehung.
- source_word: גֶּבֶר
  choice: einen Mann
  rationale: Die männliche Einzahl des Ausgangstextes wird beibehalten; sie bezeichnet einen einzelnen, exemplarischen Betroffenen.
- source_word: בֵיתוֹ
  choice: sein Haus
  rationale: „Haus“ bewahrt die Mehrdeutigkeit zwischen Gebäude, Besitzbereich und Hausgemeinschaft, die im hebräischen Ausdruck möglich ist.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Die männliche Einzahl und der Parallelismus mit גֶּבֶר bleiben erhalten.
- source_word: נַחֲלָתוֹ
  choice: sein Erbteil
  rationale: „Erbteil“ gibt den ererbten und rechtlich zugehörigen Besitz wieder und bewahrt besonders den Bezug auf angestammtes Land besser als das allgemeinere „Eigentum“.
theological_decisions:
- issue: Geschlechtsspezifische Einzahl bei גֶּבֶר und אִישׁ
  choice: einen Mann … einen Mann
  alternative: einen Menschen … einen Menschen
  rationale: Der hebräische Text verwendet zwei maskuline Substantive in der Einzahl und stellt einen einzelnen Mann als repräsentatives Opfer dar. Die Übersetzung neutralisiert oder pluralisiert diese Form nicht.
- issue: Bedeutungsumfang von נַחֲלָה
  choice: Erbteil
  alternative: Eigentum / Erbbesitz / angestammtes Land
  rationale: „Erbteil“ erhält sowohl den rechtlichen als auch den möglichen land- und bundestheologischen Klang, ohne die Bedeutung ausschließlich auf Land festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzstruktur. Die Wiederholung „einen Mann“ folgt bewusst dem hebräischen Parallelismus. Konkrete Eigentumsbegriffe und die Mehrdeutigkeit von „Haus“ und „Erbteil“ bleiben erhalten.
