base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: de
  text: Steht auf und geht[a], denn dies ist nicht die Stätte der Ruhe; wegen der Unreinheit richtet sie Verderben an[b] – ja, schweres Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zieht fort.“ Das Verb kann allgemein „gehen“ bedeuten; hier fordert es dazu auf, den Ort zu verlassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wegen der Unreinheit zerstört sie – ja, mit schwerem Verderben.“ Das Hebräische verbindet ein Verb und ein stammverwandtes Substantiv, um die Aussage zu verstärken.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Steht auf
  rationale: Der Imperativ Plural von קום wird als natürlicher, nachdrücklicher Befehl wiedergegeben.
- source_word: וּ/לְכ֔וּ
  choice: und geht weg
  rationale: הלך bezeichnet hier im Zusammenhang der Vertreibung das Fortgehen; „geht weg“ ist klarer als das bloße „geht“ und weniger gehoben als „zieht fort“.
- source_word: כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה
  choice: denn dies ist kein Ruheort
  rationale: מְנוּחָה kann „Ruhe“ oder konkret „Ruheort“ bedeuten. Das Demonstrativpronomen und der Landkontext sprechen hier für die örtliche Bedeutung, ohne die Vorstellung der Ruhe aufzugeben.
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  choice: Weil er unrein geworden ist
  rationale: טָמְאָה ist am natürlichsten als feminines Verb „sie ist unrein geworden“ zu verstehen und auf מְנוּחָה beziehungsweise den gemeinten Ruheort zu beziehen. Im Deutschen verlangt „Ruheort“ das maskuline Pronomen „er“.
- source_word: תְּחַבֵּ֖ל
  choice: richtet er Verderben an
  rationale: Das Piel von חבל bezeichnet Verderben oder Zerstören. Die Formulierung bewahrt den transitiv-verursachenden Zug und ermöglicht, die verwandte Substantivform im Anschluss hörbar aufzugreifen.
- source_word: וְ/חֶ֥בֶל נִמְרָֽץ
  choice: – schweres Verderben
  rationale: Das mit dem vorangehenden Verb stammverwandte Substantiv verstärkt die Aussage. נִמְרָץ bezeichnet hier die Intensität; „schwer“ ist verständlich und würdig, ohne die Art des Verderbens unnötig festzulegen.
theological_decisions:
- issue: Bezugswort der femininen Verbformen im Begründungssatz
  choice: Die Formen beziehen sich wahrscheinlich auf מְנוּחָה, den als Land gedachten Ruheort, der unrein geworden ist und Verderben anrichtet.
  alternative: טָמְאָה kann substantivisch beziehungsweise abstrakter als „wegen Unreinheit“ verstanden werden, wobei die Ursache des Verderbens ohne ausdrücklich genanntes Subjekt bleibt.
  rationale: Die feminine Singularform passt grammatisch zu מְנוּחָה. Die Übersetzung bildet diesen wahrscheinlichen Bezug ab, während die Fußnote die knapper formulierte alternative Analyse offenhält.
- issue: Wirkung von וְחבל נמרץ
  choice: 'Emphatische Steigerung durch die Verbindung eines Verbs und eines stammverwandten Substantivs: „richtet Verderben an – schweres Verderben“.'
  alternative: „zerstört, und zwar mit gewaltiger Zerstörung“ oder „bringt schmerzliche Vernichtung“
  rationale: Die gewählte Form bewahrt die rhetorische Wiederholung und Intensivierung, ohne נִמְרָץ einseitig als „gewaltsam“ oder „schmerzlich“ festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Steht auf“ und „geht weg“ geben den doppelten Imperativ unmittelbar wieder; „Ruheort“ hält sowohl den räumlichen als auch den theologischen Ruhegedanken fest. Die Wiederholung von „Verderben“ bildet die hebräische figura etymologica erkennbar nach.
