source:
  edition: WLC
  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: de
  text: Ich werde euch alle gewiss sammeln, Jakob; ich werde den Überrest Israels gewiss zusammenbringen. Ich werde sie alle zusammenstellen wie die Schafe von Bozra[a], wie eine Herde mitten auf ihrer Weide. Sie werden wegen der Menschen laut sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie Schafe in einer Hürde«. Das hebräische Wort wird traditionell als Ortsname »Bozra« gelesen; möglicherweise klingt jedoch ein Wort für eine Einfriedung oder Schafhürde an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie werden vor Menschen laut sein«, »Sie werden von Menschen wimmeln« oder: »Sie werden wegen der Menschenmenge lärmen«. Der hebräische Ausdruck ist schwer zu deuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: ganz gewiss sammeln
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. »Ganz gewiss« gibt diese nachdrückliche Zusage in natürlichem Deutsch wieder.
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: dich …, Jakob, dich ganz und gar
  rationale: Jakob wird als kollektive Größe in der Einzahl angeredet. Die Wiederaufnahme mit »dich ganz und gar« bewahrt sowohl die direkte Anrede als auch den Gedanken der Gesamtheit.
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: gewiss zusammenbringen
  rationale: Auch hier verstärkt ein Infinitivus absolutus das finite Verb. »Zusammenbringen« bezeichnet das Sammeln der Zerstreuten und vermeidet eine unnatürliche Wiederholung.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: der Rest Israels
  rationale: Die Formulierung bezeichnet den übrig gebliebenen beziehungsweise wieder gesammelten Teil Israels, ohne den Ausdruck durch eine bestimmte dogmatische Deutung einzuengen.
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: Ich werde sie vereint an einen Ort bringen
  rationale: Das singularische Suffix bezieht sich auf eine kollektiv verstandene Gruppe. Die deutsche Mehrzahl macht diesen Bezug klar; »vereint« gibt יַחַד wieder, während »an einen Ort bringen« die räumliche Bedeutung von שׂים im Zusammenhang natürlich ausdrückt.
- source_word: כְּצֹאן בָּצְרָה
  choice: wie die Schafe von Bozra
  rationale: Die masoretische Punktierung legt den Ortsnamen Bozra nahe. Die mögliche Deutung als Schafhürde bleibt wegen der echten lexikalischen Unsicherheit in einer Fußnote erhalten.
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: wie eine Herde mitten auf ihrer Weide
  rationale: Der seltene Ausdruck wird im pastoralen Zusammenhang als Weide beziehungsweise Weideland verstanden. Das fügt sich in das Herdenbild und bleibt im Deutschen anschaulich.
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: Von der Menge der Menschen wird es dort laut sein
  rationale: Der hebräische Ausdruck bezeichnet laute Bewegung oder Getöse und ist syntaktisch schwierig. Die Wiedergabe versteht מֵאָדָם als Ursache des Lärms und vermittelt das Bild einer dicht gedrängten, belebten Menschenmenge.
theological_decisions:
- issue: Verheißung der Wiederherstellung an Jakob und Israel
  choice: Der Vers bleibt eine an Jakob beziehungsweise Israel gerichtete göttliche Zusage des Sammelns.
  alternative: Eine ausschließlich vergeistigte oder ausschließlich endzeitliche Deutung.
  rationale: Der hebräische Text nennt ausdrücklich Jakob, Israel und dessen Rest. Die Übersetzung bewahrt diesen geschichtlich-korporativen Bezug, ohne eine spätere heilsgeschichtliche Systematik in den Wortlaut einzutragen.
- issue: Spannung zwischen »ganz Jakob« und »dem Rest Israels«
  choice: Beide Ausdrücke stehen ohne Harmonisierung nebeneinander.
  alternative: »Ganz Jakob« auf den Rest Israels zu beschränken oder den »Rest« ausdrücklich mit ganz Israel gleichzusetzen.
  rationale: Der Text verbindet eine umfassende Sammelzusage mit der Rede vom Rest. Diese theologische Spannung soll die Übersetzung nicht eigenmächtig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatischen hebräischen Verbformen werden klar, aber nicht hölzern wiedergegeben. Die kollektive Anrede Jakobs und die Bildsprache von Herde und Weide bleiben erhalten; echte lexikalische und syntaktische Unsicherheiten werden in den Fußnoten offengelegt.
