source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: de
  text: 'An jenem Tag wird man ein Spottlied über euch anstimmen und eine Klage klagen[a]. Man wird sagen:


    »Wir sind völlig verwüstet!


    Er verändert den Anteil meines Volkes.


    Wie entzieht er ihn mir!


    Dem, der sich abwendet, teilt er unsere Felder zu.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und ein Klagelied anheben“ oder „wehklagen“. Im Hebräischen stehen mehrere verwandte Trauerwörter zur Verstärkung nebeneinander.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwer zu deuten. Statt „dem, der sich abwendet“ sind auch „dem Abtrünnigen“, „einem Aufrührer“ oder – weniger wahrscheinlich – „dem Eroberer/dem, der zurückkehrt“ möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: ein Spottlied ... anstimmen
  rationale: Die Wendung bezeichnet das Anheben eines geformten Spruchs, der hier angesichts des Gerichts als öffentliches Spott- oder Hohnlied verstanden wird. „Anstimmen“ gibt das hebräische Idiom im Deutschen natürlich wieder.
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: eine Klage klagen
  rationale: Die bewusste Wiederholung verwandter Trauerwörter bleibt erhalten und vermittelt die eindringliche, feierliche Klage; alternative Nuancen werden in Fußnote [a] genannt.
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: Wir sind völlig verwüstet
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Passivform verstärkt die Aussage. „Völlig verwüstet“ drückt die umfassende Vernichtung und Enteignung aus.
- source_word: חֵלֶק עַמִּי
  choice: den Anteil meines Volkes
  rationale: „Anteil“ entspricht חֵלֶק unmittelbar und bewahrt den Bezug auf den zugeteilten Landbesitz, ohne bereits den spezifischeren Begriff „Erbe“ einzutragen.
- source_word: יָמִיר
  choice: tauscht er ein
  rationale: Das Hifil von מור bezeichnet ein Ändern oder Austauschen. „Eintauschen“ macht die Übertragung des Landanteils deutlich, ohne ihren genauen rechtlichen Vorgang festzulegen.
- source_word: אֵיךְ יָמִישׁ לִי
  choice: Wie entzieht er ihn mir
  rationale: אֵיךְ leitet einen erschrockenen Ausruf ein; das Hifil von מוש bezeichnet hier das Wegnehmen beziehungsweise Entfernen. Das Pronomen verweist auf den zuvor genannten Anteil.
- source_word: לְשׁוֹבֵב
  choice: dem, der sich abwendet
  rationale: Die transparente Wiedergabe bewahrt die Grundvorstellung des Sich-Abwendens, ohne die schwierige Form vorschnell als religiösen „Abtrünnigen“ oder als „Eroberer“ festzulegen. Die Ambiguität wird in Fußnote [b] offengelegt.
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: teilt er unsere Felder zu
  rationale: Das Verb bezeichnet Teilen oder Zuteilen. „Zuteilen“ bringt hier treffend zum Ausdruck, dass die enteigneten Felder einem anderen überlassen werden.
theological_decisions:
- issue: Deutung des schwierigen Ausdrucks לְשׁוֹבֵב
  choice: dem, der sich abwendet
  alternative: dem Abtrünnigen; einem Aufrührer; dem Eroberer beziehungsweise dem, der zurückkehrt
  rationale: Die Form und ihr syntaktischer Bezug sind umstritten. Die Hauptfassung bleibt nahe bei der Vorstellung des Ab- oder Umwendens und vermeidet eine konfessionell oder moralisch stärker festgelegte Bezeichnung. Fußnote [b] erhält die echten Auslegungsalternativen.
- issue: Nicht ausdrücklich genanntes Subjekt der Landübertragung
  choice: er
  alternative: unbestimmtes beziehungsweise implizites handelndes Subjekt
  rationale: Das maskuline Singularsubjekt bleibt wie im Hebräischen unbenannt. Die Übersetzung identifiziert es nicht ausdrücklich mit Gott oder einem menschlichen Eroberer und bewahrt dadurch die Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zeilenform und die hebräische Wiederholung in „eine Klage klagen“ bleiben erhalten. Archaische oder konfessionell vorgeprägte Ausdrücke werden vermieden; die schwierige Schlusszeile wird nicht stillschweigend vereindeutigt.
