source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Seht, ich plane gegen diese Sippe[a] ein Unheil, aus dem ihr eure Nacken nicht herausziehen werdet[b], und ihr werdet nicht hochmütig einhergehen[c]; denn es ist eine Zeit des Unheils[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Familie“ beziehungsweise „Geschlecht“. Das hebräische Wort kann eine Hausgemeinschaft, eine Familienlinie oder einen größeren Sippenverband bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Von dort werdet ihr eure Nacken nicht wegziehen.“ Das Bild meint ein auferlegtes Joch oder eine Last, der man nicht entkommen kann.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „stolz einhergehen“ beziehungsweise „mit erhobenem Haupt gehen“.'
    reason: lexical_alternative
  - marker: d
    text: Im Hebräischen steht hier dasselbe Wort wie zuvor bei dem angekündigten „Unheil“. Die Wiederholung verbindet das Gericht mit der kommenden Zeit des Unheils.
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als Folgerung Jahwes Antwort auf das zuvor geschilderte Unrecht ein.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen als Jahwe wieder.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Gibt die nachdrückliche hinweisende Funktion in heutigem, würdigem Deutsch wieder.
- source_word: חֹשֵׁב
  choice: plane
  rationale: Bewahrt den bewussten Entschluss und den Rückbezug auf das Planen der Übeltäter im vorigen Vers.
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: gegen diese Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier wahrscheinlich einen größeren verwandtschaftlichen Verband; „Sippe“ hält zugleich die mögliche Bedeutung Familie offen.
- source_word: רָעָה
  choice: Unheil
  rationale: Bezeichnet hier das angekündigte Gericht beziehungsweise die Katastrophe, nicht moralische Bosheit.
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: Aus diesem werdet ihr eure Nacken nicht herausziehen
  rationale: Erhält das anschauliche Bild eines auferlegten Jochs, dem die Betroffenen nicht entkommen können.
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: und ihr werdet nicht mehr hochmütig einhergehen
  rationale: Gibt die erhöhte, stolze Haltung idiomatisch wieder; „mehr“ ist im Deutschen aus dem Kontrast zur bisherigen Überheblichkeit erschlossen.
- source_word: כִּי עֵת רָעָה הִיא
  choice: denn es ist eine Zeit des Unheils
  rationale: Bewahrt durch die Wiederholung von „Unheil“ den absichtlichen Gleichklang mit dem angekündigten Gericht.
theological_decisions:
- issue: Bedeutung von רָעָה im Zusammenhang mit Gottes Handeln
  choice: Beide Vorkommen werden mit „Unheil“ wiedergegeben.
  alternative: „Böses“ oder ein Wechsel zwischen „Unheil“ und „böse Zeit“
  rationale: „Unheil“ bezeichnet eine von Gott angekündigte Katastrophe, ohne ihm moralisches Böses zuzuschreiben, und erhält zugleich die Wiederholung des hebräischen Wortes.
- issue: Bezug von מִשְׁפָּחָה
  choice: „Sippe“ als größerer verwandtschaftlich-sozialer Verband
  alternative: „Familie“, „Geschlecht“ oder „Volk“
  rationale: Der genaue Umfang bleibt offen. „Sippe“ wahrt den kollektiven Sinn besser als die im heutigen Deutsch oft eng verstandene „Familie“, ohne den Ausdruck vorschnell auf das ganze Volk auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und anschaulicher Jochmetapher. „Einhergehen“ ist leicht gehoben, aber allgemein verständlich und bildet die stolze Haltung treffend ab.
