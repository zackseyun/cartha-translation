source:
  edition: WLC
  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: de
  text: Der, der den Durchbruch schafft[a][b], ist vor ihnen heraufgezogen. Sie sind durchgebrochen, durch das Tor gezogen und durch das Tor hinausgezogen. Ihr König ist vor ihnen hergezogen, und der HERR[c] ist an ihrer Spitze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Durchbrecher“. Das hebräische Partizip kann wie eine titelartige Bezeichnung für jemanden gebraucht werden, der ein Hindernis durchbricht oder den Weg öffnet.'
    reason: lexical_alternative
  - marker: b
    text: Wer der „den Durchbruch schafft“ ist, bleibt umstritten. Gemeint sein können ein militärischer Anführer, der König oder der HERR selbst. Der hebräische Text lässt ihr gegenseitiges Verhältnis unausgesprochen.
    reason: alternative_reading
  - marker: c
    text: Hebräisch JHWH; nach der üblichen Wiedergabepraxis mit „der HERR“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: der Breschenbrecher
  rationale: Das substantivierte Partizip von פרץ bezeichnet den, der ein Hindernis durchbricht oder eine Bresche öffnet. „Breschenbrecher“ bewahrt die titelartige Kürze und das konkrete Bild, ohne die Identität der Gestalt festzulegen.
- source_word: עָלָה
  choice: ist hinaufgezogen
  rationale: Das Qal-Perfekt bezeichnet ein Hinaufgehen oder Hinaufziehen. Das deutsche Perfekt gibt die abgeschlossene Form wieder und kann zugleich die prophetisch gewisse Darstellung tragen.
- source_word: פָּרְצוּ
  choice: sie sind durchgebrochen
  rationale: Die Wiedergabe erhält den Wortstamm und die Bildverbindung zu הַפֹּרֵץ so weit wie in natürlichem Deutsch möglich.
- source_word: וַיַּעֲבֹרוּ שַׁעַר
  choice: durch das Tor gezogen
  rationale: עבר bezeichnet hier die Bewegung durch eine Öffnung; „ziehen“ passt zu einer gemeinsam ausziehenden Gruppe.
- source_word: וַיֵּצְאוּ בוֹ
  choice: durch dieses hinausgegangen
  rationale: Das Pronomen בּוֹ wird ausdrücklich auf das Tor bezogen. „Durch dieses“ bildet die räumliche Bedeutung der Präposition verständlich ab.
- source_word: מַלְכָּם
  choice: ihr König
  rationale: מֶלֶךְ bezeichnet eindeutig den König; eine allgemeinere Wiedergabe wie „Herrscher“ würde den königlichen Bezug abschwächen.
- source_word: וַיהוָה
  choice: der HERR
  rationale: Das Tetragramm JHWH wird gemäß der üblichen deutschen Bibeltradition mit „der HERR“ wiedergegeben; eine Fußnote macht die hebräische Form transparent.
- source_word: בְּרֹאשָׁם
  choice: an ihrer Spitze
  rationale: Die räumliche Metapher „an ihrem Kopf“ bezeichnet die führende Position. „An ihrer Spitze“ bewahrt dieses Bild in idiomatischem Deutsch.
theological_decisions:
- issue: Identität des הַפֹּרֵץ („Breschenbrechers“)
  choice: Die Gestalt wird beschreibend und titelartig wiedergegeben, ohne sie im Haupttext zu identifizieren.
  alternative: Sie ausdrücklich als militärischen Anführer, als König beziehungsweise messianischen Herrscher oder als den HERRN bestimmen.
  rationale: Der hebräische Text nennt den Breschenbrecher, den König und JHWH in enger Folge, setzt sie aber weder ausdrücklich gleich noch grenzt er ihre Identität abschließend voneinander ab. Die Übersetzung wahrt diese Spannung.
- issue: Verhältnis zwischen „ihrem König“ und „dem HERRN“
  choice: Beide Bezeichnungen bleiben im Haupttext eigenständig.
  alternative: Beide als Bezeichnungen derselben Gestalt auffassen oder in der Übersetzung zusammenziehen.
  rationale: Der hebräische Satz stellt מַלְכָּם und יהוה als gesonderte Ausdrücke nebeneinander. Eine interpretierende Gleichsetzung würde mehr festlegen als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bewegung der Gruppe wird klar und rhythmisch dargestellt; die ungewöhnliche, bildkräftige Bezeichnung „Breschenbrecher“ erhält den titelartigen Charakter und die Mehrdeutigkeit des Hebräischen.
