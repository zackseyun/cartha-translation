source:
  edition: WLC
  text: אַל תַּטִּ֖פוּ יַטִּיפ֑וּ/ן לֹֽא יַטִּ֣פוּ לָ/אֵ֔לֶּה לֹ֥א יִסַּ֖ג כְּלִמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: de
  text: »Verkündet nicht!«, verkünden sie. »Über solche Dinge soll man nicht verkünden[a]; die Schande wird nicht weichen[b].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diesen Leuten soll man nicht verkünden.«'
    reason: לָאֵלֶּה kann sachlich (»über solche Dinge«) oder personal (»diesen Leuten«) verstanden werden.
  - marker: b
    text: 'Die hebräische Wendung ist schwer zu deuten; auch möglich: »Schande wird nicht einholen.«'
    reason: Das Verb יסג und die ungewöhnliche Verbindung mit dem pluralischen כְּלִמּוֹת lassen mehrere syntaktische und semantische Deutungen zu. Der hebräische Text nennt kein ausdrückliches Ziel der Schande.
lexical_decisions:
- source_word: תַּטִּיפוּ / יַטִּיפוּן / יַטִּיפוּ
  choice: »verkündet« / »verkünden«
  rationale: Das Verb נָטַף bedeutet wörtlich »tropfen lassen«, wird hier aber für prophetisches Reden gebraucht. Die einheitliche Wiedergabe bewahrt die pointierte Wiederholung des Hebräischen, ohne im Deutschen das missverständliche Bild des Träufelns zu erzwingen.
- source_word: לָאֵלֶּה
  choice: »über solche Dinge«
  rationale: Die Präposition mit dem Demonstrativ kann sich auf die angesprochenen Inhalte oder auf Personen beziehen. Im Zusammenhang liegt ein Verbot nahe, über die zuvor erhobenen Vorwürfe zu verkünden; die verbleibende Mehrdeutigkeit wird in der Fußnote genannt.
- source_word: כְּלִמּוֹת
  choice: »Schande«
  rationale: Der hebräische Plural bezeichnet Beschämungen bzw. Schmach. Das deutsche Kollektivum »Schande« gibt den natürlichen Sinn knapp und würdig wieder.
theological_decisions:
- issue: Wer spricht, und worauf bezieht sich das Verkündungsverbot?
  choice: Die Gegner geben den Verkündigern ein Verbot weiter und behaupten zugleich, Schande werde sie nicht erreichen.
  alternative: Der Satz könnte teilweise als Erzählerrede oder als Aufforderung verstanden werden, diesen Leuten nicht zu verkünden, sodass ihre Schmach nicht weicht.
  rationale: Die direkte Rede folgt der naheliegenden prophetischen Auseinandersetzung und der geprüften englischen Fassung, ohne die schwer eindeutige hebräische Syntax als völlig sicher auszugeben.
- issue: Bedeutung von לֹא יִסַּג כְּלִמּוֹת
  choice: »Schande wird uns nicht einholen«
  alternative: »Die Schmach wird nicht weichen« bzw. »Beschämungen werden nicht abgewendet werden«
  rationale: Die gewählte Fassung versteht die Worte als selbstsichere Behauptung der Gegner. Wegen der ungewöhnlichen Form und Satzfügung bleibt jedoch eine Deutung im Sinn von »weichen/zurückgehen« möglich und wird ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Verkünden« vermeidet sowohl das heute unverständliche wörtliche Bild »träufeln« als auch die enger kirchlich-gottesdienstliche Färbung von »predigen«; zugleich bleibt die dreifache Wortwiederholung des hebräischen Textes hörbar.
