source:
  edition: WLC
  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: de
  text: 'Darf man sagen[a], Haus Jakob: »Ist der Geist Jahwes ungeduldig? Sind das seine Taten?« Tun meine Worte nicht dem Gutes, der aufrichtig lebt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wird gesagt«. Wörtlich kann die folgende Frage auch heißen: »Ist der Geist Jahwes kurz geworden?« Das hebräische Sprachbild kann sich auf Jahwes Geduld beziehen.'
    reason: Die Form הֶאָמ֣וּר und das Idiom הֲקָצַר רוּחַ יְהוָה lassen mehrere eng verwandte Wiedergaben zu.
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: Darf man sagen
  rationale: Die schwierige Form leitet wahrscheinlich eine rhetorisch beanstandete Aussage ein. Die unpersönliche deutsche Frage ist natürlich und bewahrt den berichtenden Charakter.
- source_word: בֵּית יַעֲקֹב
  choice: Haus Jakob
  rationale: Die traditionelle Kollektivbezeichnung bleibt als direkte Anrede erhalten.
- source_word: הֲקָצַר רוּחַ יְהוָה
  choice: Ist der Geist Jahwes ungeduldig?
  rationale: Das wörtliche Bild vom »kurzen Geist« bezeichnet wahrscheinlich Ungeduld oder begrenzte Langmut. »Geist Jahwes« hält zugleich die mögliche personale Lesart von רוּחַ offen; die idiomatische Alternative wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: אִם אֵלֶּה מַעֲלָלָיו
  choice: Sind das seine Taten?
  rationale: Die kurze rhetorische Parallelfrage wahrt den Bezug auf Gottes Handeln und den Plural von מַעֲלָלִים.
- source_word: דְבָרַי יֵיטִיבוּ
  choice: Tun meine Worte ... Gutes
  rationale: Der Plural »Worte« und die Wirkungsaussage des Hiphil von יטב werden eng am Hebräischen und dennoch idiomatisch wiedergegeben.
- source_word: עִם הַיָּשָׁר הוֹלֵךְ
  choice: dem, der aufrichtig lebt
  rationale: Das hebräische Bild des Gehens bezeichnet die fortdauernde Lebensführung. Im heutigen Deutsch bringt »lebt« diesen idiomatischen Sinn klar zum Ausdruck.
theological_decisions:
- issue: Personale oder idiomatische Deutung von רוּחַ יְהוָה
  choice: Geist Jahwes
  alternative: Jahwes Geduld / Ist Jahwes Geist kurz geworden?
  rationale: Der Haupttext bewahrt רוּחַ als »Geist«, ohne die idiomatische Bedeutung des gesamten Ausdrucks zu verdecken. Die Fußnote hält die wörtlichere und auf Gottes Geduld bezogene Deutung ausdrücklich offen.
- issue: Sprecher von »meine Worte«
  choice: Göttliche Rede bleibt durch die erste Person markiert
  alternative: Explizite Ergänzung »meine Worte, spricht Jahwe«
  rationale: Der Kontext legt Jahwe als Sprecher nahe, doch eine ausdrückliche Sprecherformel steht im hebräischen Satz nicht und wird daher nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Abfolge und die direkte Anrede bleiben erhalten; das hebräische Lebensweg-Bild wird für natürliche Verständlichkeit mit »lebt« wiedergegeben.
