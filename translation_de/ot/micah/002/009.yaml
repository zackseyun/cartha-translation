  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: de
  text: Die Frauen meines Volkes[a] vertreibt ihr aus ihren behaglichen Häusern; ihren kleinen Kindern nehmt ihr meinen Glanz[b] für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ehefrauen meines Volkes“. Das hebräische Wort kann Frauen allgemein oder Ehefrauen im Besonderen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Herrlichkeit“, „meine Würde“ oder „meine Majestät“. Das hebräische Wort bezeichnet Glanz, Herrlichkeit, Majestät oder Ehre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: die Frauen meines Volkes
  rationale: נְשֵׁי, der Status constructus Plural von אִשָּׁה, kann „Frauen“ oder „Ehefrauen“ bedeuten. Der weitere Ausdruck „Frauen meines Volkes“ bewahrt den wahrscheinlichen sozialen Bezug, ohne den Familienstand festzulegen.
- source_word: תְּגָרְשׁוּן
  choice: vertreibt ihr
  rationale: Das Piel von גרשׁ bezeichnet ein gewaltsames Fortschicken oder Vertreiben. Die deutsche Verb-Erststellung nach dem vorangestellten Objekt gibt der Anklage angemessenen Nachdruck.
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: aus ihrem behaglichen Zuhause
  rationale: בַּיִת bezeichnet Haus oder Zuhause; תַּעֲנֻגִים angenehme Dinge, Behagen oder Wonne. Die singularischen Suffixe beziehen sich kollektiv auf die Frauen. „Behagliches Zuhause“ klingt natürlich und vermittelt sowohl Wohnort als auch Geborgenheit, ohne Wohlstand zwingend vorauszusetzen.
- source_word: מֵעַל עֹלָלֶיהָ
  choice: ihren kleinen Kindern
  rationale: עוֹלָל bezeichnet kleine Kinder, teils Säuglinge. מֵעַל wird zusammen mit לקח idiomatisch als Entzug von etwas wiedergegeben; „kleinen Kindern“ erhält die Altersnuance.
- source_word: תִּקְחוּ
  choice: nehmt ihr … für immer
  rationale: לקח bedeutet „nehmen“; in Verbindung mit der betroffenen Person im Dativ drückt deutsches „jemandem etwas nehmen“ den Entzug klar und knapp aus.
- source_word: הֲדָרִי
  choice: meinen Glanz
  rationale: הָדָר umfasst Glanz, Herrlichkeit, Majestät und Würde. „Glanz“ wahrt das bildhafte, gehobene Register, ohne die mögliche Bedeutung vorschnell auf einen technischen theologischen Begriff festzulegen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier eine bleibende beziehungsweise unabsehbare Dauer. „Für immer“ ist die natürliche und eindringliche deutsche Entsprechung.
theological_decisions:
- issue: Bezug des Possessivpronomens in „mein Volk“ und „mein Glanz“
  choice: 'Die erste Person wird als Rede des HERRN unverändert beibehalten: „meines Volkes“ und „meinen Glanz“.'
  alternative: „Meinen Glanz“ könnte deutend als die von Gott verliehene Würde oder Ehre der Kinder umschrieben werden.
  rationale: Der prophetische Zusammenhang trägt göttliche Rede. Die wörtliche Beibehaltung von „mein“ wahrt zugleich die Spannung, ob unmittelbar Gottes eigener Glanz oder der von ihm verliehene Glanz der Kinder gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anklage. „Behagliches Zuhause“ ist verständlicher als eine formale Wendung wie „Haus ihrer Wonnen“; „kleine Kinder“ erhält die Verletzlichkeit von עֹלָל. Die Satzstellung spiegelt den Nachdruck auf den betroffenen Frauen und Kindern.
