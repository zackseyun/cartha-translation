base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: de
  text: 'Wenn ein Mann mit Wind und Lüge umherzöge und dabei löge: »Ich will dir von Wein und berauschendem Getränk predigen[a]«, dann wäre er der Prediger für dieses Volk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »Ich will dir von Wein und berauschendem Getränk weissagen … dann wäre er für dieses Volk einer, der weissagt.« Im Hebräischen steht in beiden Satzteilen dasselbe Verb; es wird auch für prophetisches Reden gebraucht und ist hier beißend ironisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Wenn … umherzöge
  rationale: Die Partikel eröffnet hier ein hypothetisches Szenario. Der Konjunktiv II gibt diese satirische Bedingung im Deutschen natürlich wieder, ohne den möglichen Wunschsinn von »wenn doch« einzutragen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Dies wahrt die maskuline Singularform und die konkrete rhetorische Gestalt des hebräischen Satzes.
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: mit Wind und Lüge umherzöge
  rationale: 'Die schwierige Wendung bleibt bildhaft: »Wind« deutet Leere oder Gehaltlosigkeit an, »Lüge« den Betrug. Eine deutende Paraphrase wie »ein Aufschneider« würde das Bild auflösen.'
- source_word: כִּזֵּב
  choice: und dabei löge
  rationale: Die Wiedergabe hält das falsche Reden ausdrücklich fest und verbindet es idiomatisch mit dem vorausgehenden Umherziehen.
- source_word: אַטִּף
  choice: ich will … predigen
  rationale: נטף kann prophetisches Reden bezeichnen und wird hier beißend ironisch verwendet. »Predigen« ist verständlich, bezeichnet religiöse Verkündigung und beansprucht nicht von sich aus echte prophetische Autorität.
- source_word: לְךָ
  choice: dir
  rationale: Der hebräische Adressat steht im maskulinen Singular; »dir« bildet dies knapp und unmittelbar ab.
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: von Wein und berauschendem Getränk
  rationale: Die Präposition bezeichnet hier am ehesten den Inhalt der angekündigten Rede. »Berauschendes Getränk« gibt שֵׁכָר als Kategorie alkoholischer Getränke wieder, ohne es unbelegt auf Bier oder hochprozentigen Alkohol einzuengen.
- source_word: וְהָיָה מַטִּיף
  choice: dann wäre er der Prediger
  rationale: Der Ergebnissatz führt die hypothetische Form fort. »Prediger« erhält die Wortverbindung zu »predigen« und trägt die Ironie.
- source_word: הָעָם הַזֶּה
  choice: dieses Volkes
  rationale: Der Genitiv bewahrt den singularischen Kollektivausdruck und gibt die Zugehörigkeit beziehungsweise Eignung dieses Redners für das getadelte Volk prägnant wieder.
theological_decisions:
- issue: Wiedergabe von נטף in der ironischen Verurteilung eines religiösen Redners
  choice: predigen / Prediger
  alternative: weissagen / einer, der weissagt; prophetisch reden / Prophet
  rationale: Der Vers verspottet den religiösen Sprecher, den das Volk willkommen heißen würde. »Predigen« ist im heutigen Deutsch zugänglich und wahrt den religiösen Zusammenhang, ohne den Mann als wahren Propheten auszuweisen. Die mögliche technische Bedeutung prophetischen Redens wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem Bild »Wind und Lüge«. Der Konjunktiv II trägt den hypothetisch-satirischen Charakter. »Berauschendes Getränk« ist verständlicher und sachlich breiter als das altertümliche »Rauschtrank« oder das missverständliche »starkes Getränk«.
