source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: de
  text: 'Ihre führenden Männer sprechen Recht für Bestechungsgeld, ihre Priester erteilen Weisung gegen Bezahlung, und ihre Propheten wahrsagen für Silber. Dennoch stützen sie sich auf Jahwe[a] und sagen: »Ist Jahwe nicht in unserer Mitte? Kein Unheil[b] wird über uns kommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verlassen sie sich auf Jahwe“. Das hebräische Verb enthält das Bild, sich zur Unterstützung auf jemanden zu stützen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Unglück“. Das hebräische Wort kann allgemein auch „Böses“ bedeuten; hier geht es um drohendes Unheil beziehungsweise Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: ihre führenden Männer
  rationale: Der Plural von רֹאשׁ mit femininem Suffix bezeichnet hier die führenden Amtsträger der Stadt beziehungsweise Gemeinschaft. Die Formulierung gibt den idiomatischen politischen Sinn wieder und wahrt den Bezug auf Personen.
- source_word: בְּשֹׁחַד יִשְׁפֹּטוּ
  choice: sprechen Recht für Bestechungsgeld
  rationale: שֹׁחַד bezeichnet ein Bestechungsgeschenk; שׁפט meint hier richterliches Entscheiden. „Recht sprechen“ ist im Deutschen idiomatisch und macht den Missbrauch des Richteramtes deutlich.
- source_word: בִּמְחִיר יוֹרוּ
  choice: erteilen Weisung gegen Bezahlung
  rationale: ירה im Hifil bezeichnet besonders im priesterlichen Zusammenhang verbindliche Unterweisung. „Weisung erteilen“ erhält diese amtlich-religiöse Nuance besser als das allgemeinere „lehren“; מְחִיר wird als entgeltliche Bezahlung wiedergegeben.
- source_word: בְּכֶסֶף יִקְסֹמוּ
  choice: wahrsagen für Silber
  rationale: קסם bezeichnet divinatorische Praxis. „Wahrsagen“ ist verständliches modernes Deutsch, während „Silber“ das konkrete Bild des hebräischen Textes und den Parallelismus bewahrt.
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: Dennoch stützen sie sich auf Jahwe
  rationale: Das Nifal von שׁען enthält das Bild des Sich-Anlehnens beziehungsweise Sich-Stützens. „Dennoch“ bringt den ironischen Gegensatz zwischen ihrer Korruption und ihrem beanspruchten Gottvertrauen zum Ausdruck.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang bezeichnet רָעָה eine drohende schädliche Katastrophe beziehungsweise ein Gericht, nicht primär moralische Bosheit. „Unheil“ wahrt zugleich die gewisse Bedeutungsbreite des Wortes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רָעָה im Schlusssatz
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Die Sprecher bestreiten das kommende Gericht. Daher ist äußeres Unheil gemeint; „Unheil“ vermeidet eine unnötige Festlegung auf moralisches Böses und erhält die Gerichtsdimension.
- issue: Verhältnis von Korruption und beanspruchtem Vertrauen auf Jahwe
  choice: kontrastiv mit „Dennoch“ wiedergegeben
  alternative: rein koordinierend mit „und“
  rationale: Das hebräische וְ kann koordinieren, doch der Zusammenhang zeigt einen scharfen ironischen Gegensatz. „Dennoch“ macht diesen Diskurswert sichtbar, ohne die falsche Zuversicht der Sprecher als echtes Vertrauen zu bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Anklage gegen führende Männer, Priester und Propheten bleibt durch parallele Satzstruktur erhalten. „Weisung erteilen“ wahrt den besonderen Charakter priesterlicher Unterweisung; „Bestechungsgeld“, „Bezahlung“ und „Silber“ bilden die wirtschaftliche Korruption konkret ab.
