base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: de
  text: Dann werden sie zum HERRN schreien, doch er wird ihnen nicht antworten. Zu jener Zeit wird er sein Angesicht vor ihnen verbergen, weil sie ihre Taten böse gemacht haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit vergleichender Nuance: „entsprechend dem, dass sie ihre Taten böse gemacht haben“. Wörtlich: „sie machten ihre Taten böse“.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Die temporale Angabe leitet die auf die vorherige Anklage folgende Gerichtskonsequenz ein.
- source_word: יִזְעֲקוּ
  choice: werden sie … schreien
  rationale: זעק bezeichnet einen eindringlichen Hilferuf aus Bedrängnis; „schreien“ bewahrt dessen Dringlichkeit.
- source_word: אֶל יְהוָה
  choice: zum HERRN
  rationale: Die Präposition ist direktional. Der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ wiedergegeben.
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: doch er wird ihnen nicht antworten
  rationale: Das verbindende ו hat hier im Zusammenhang adversative Kraft. Beim deutschen Verb „antworten“ steht die angesprochene Person idiomatisch im Dativ.
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: wird er sein Angesicht vor ihnen verbergen
  rationale: Die bildhafte biblische Wendung für den Entzug göttlicher Zuwendung bleibt erhalten, statt deutend aufgelöst zu werden.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die Formulierung ist gehoben, aber gegenwärtig verständlich, und bezeichnet den Zeitpunkt des angekündigten Gerichts.
- source_word: כַּאֲשֶׁר
  choice: weil
  rationale: Im Kontext führt die Partikel am natürlichsten den Grund für Gottes Nichtantworten und sein Sichverbergen ein; eine vergleichende Nuance ist jedoch möglich und wird in der Fußnote berücksichtigt.
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  choice: sie böse Taten begangen haben
  rationale: Diese natürliche deutsche Formulierung bewahrt sowohl die moralische Wertung von רעע als auch den ausdrücklichen Bezug auf ihre Taten, ohne die hebräische Konstruktion unidiomatisch nachzubilden.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Abwendung
  choice: „sein Angesicht vor ihnen verbergen“ im Haupttext beibehalten
  alternative: „sich von ihnen abwenden“ oder „ihnen seine Gunst entziehen“
  rationale: Das hebräische Bild trägt die theologische Aussage selbst und soll nicht durch eine bloße Erklärung ersetzt werden.
- issue: Verhältnis zwischen Gericht und bösen Taten
  choice: Die Schlusswendung kausal mit „weil“ wiedergeben
  alternative: 'Vergleichend: „so, wie sie durch ihre Taten Böses getan haben“'
  rationale: Der unmittelbare Zusammenhang legt eine Begründung des Gerichts nahe. Da כַּאֲשֶׁר auch vergleichend verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Klang. „Angesicht“ bewahrt die feste Bildsprache; Satzbau und Verbformen bleiben zugleich für heutige Leser gut verständlich.
