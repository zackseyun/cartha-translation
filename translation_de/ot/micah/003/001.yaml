source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: de
  text: 'Und ich sagte: „Hört doch, ihr Oberhäupter Jakobs und ihr Anführer des Hauses Israel! Ist es nicht eure Aufgabe, das Recht[a] zu kennen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gerechtigkeit“ beziehungsweise „die Rechtsprechung“. Das hebräische Wort mischpat kann das Recht, die Gerechtigkeit, die Rechtsprechung oder ein gerichtliches Urteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Das waw-consecutivum führt die Rede weiter. „Und ich sagte“ bewahrt die Verknüpfung mit dem vorausgehenden Zusammenhang, ohne zwingend eine streng zeitliche Abfolge auszudrücken.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der Imperativ שׁמע fordert zum Hören auf; נָא verleiht dem Aufruf hier Nachdruck. Das deutsche „doch“ gibt diese dringliche rhetorische Nuance natürlich wieder.
- source_word: רָאשֵׁי יַעֲקֹב
  choice: Oberhäupter Jakobs
  rationale: „Oberhäupter“ bewahrt die im Hebräischen enthaltene Haupt-Metapher und ist im Deutschen eine geläufige, würdige Bezeichnung für führende Personen. „Jakob“ bleibt als Bezeichnung des Volkes erhalten.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: und ihr Anführer des Hauses Israel
  rationale: קָצִין bezeichnet je nach Zusammenhang einen Anführer, Machthaber oder Amtsträger. „Anführer“ passt zum politischen und richterlichen Verantwortungsbereich, während „Haus Israel“ die feste nationale und bundestheologische Bezeichnung wahrt.
- source_word: הֲלוֹא לָכֶם
  choice: Ist es nicht eure Aufgabe
  rationale: Die Frage הֲלוֹא erwartet Zustimmung; die ל-Konstruktion bezeichnet hier die den Angeredeten zukommende Pflicht. „Eure Aufgabe“ drückt diese Verantwortung in natürlichem Deutsch aus.
- source_word: לָדַעַת
  choice: zu kennen
  rationale: ידע bedeutet grundlegend „kennen, wissen“. Im Zusammenhang schließt es die praktische Kenntnis ein, die von verantwortlichen Amtsträgern erwartet wird, ohne sie ausdrücklich auf bloßes Verstehen oder Ausüben einzuengen.
- source_word: הַמִּשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט umfasst Recht, Gerechtigkeit, Rechtsprechung und gerichtliche Entscheidung. „Das Recht“ ist im Deutschen in diesem Kontext idiomatisch und bewahrt sowohl den rechtlichen als auch den ethischen Aspekt.
theological_decisions:
- issue: Wiedergabe von מִשְׁפָּט im Zusammenhang der Verantwortung von Führungspersonen
  choice: das Recht
  alternative: die Gerechtigkeit; die Rechtsprechung; das Urteil
  rationale: Die Anklage betrifft die Pflicht der führenden Personen, das Rechte zu kennen und entsprechend Recht zu üben. „Das Recht“ hält den öffentlichen, ethischen und richterlichen Sinn zusammen, ohne das Wort auf ein einzelnes Urteil oder auf einen abstrakten Gerechtigkeitsbegriff zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hört doch“ vermittelt den Nachdruck des prophetischen Aufrufs; „Oberhäupter“ und „Haus Israel“ bewahren die hebräische Bildsprache und die traditionelle Volksbezeichnung, ohne altertümliche Syntax zu verwenden.
