base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: de
  text: Darum wird es Nacht für euch, ohne Vision[a], und es wird finster für euch, ohne Wahrsagung. Die Sonne wird über den Propheten untergehen[b], und der Tag wird sich über ihnen verdunkeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch näher am Hebräischen: „von Vision“ und entsprechend „von Wahrsagung“. Die Präposition kann hier wahrscheinlich privativ verstanden werden: Den Propheten werden Vision und Wahrsagung entzogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die Sonne wird über die Propheten kommen“; in Verbindung mit der Sonne bezeichnet das hebräische Verb hier idiomatisch ihr Untergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet das Folgende als Konsequenz aus der vorausgehenden Anklage und klingt im modernen prophetischen Urteil natürlich.
- source_word: לַיְלָה לָכֶם
  choice: wird es für euch Nacht
  rationale: Die verblos formulierte hebräische Wendung erhält aus dem Gerichtskontext Zukunftssinn; die Zuordnung „für euch“ bleibt ausdrücklich erhalten.
- source_word: מֵחָזוֹן
  choice: ohne Vision
  rationale: 'Die Präposition מִן ist hier wahrscheinlich privativ: Den angesprochenen Propheten wird prophetische Schau entzogen. „Vision“ wahrt den Bezug auf Offenbarung, ohne eine bestimmte Lehre über deren Form einzutragen.'
- source_word: וְחָשְׁכָה לָכֶם
  choice: und es wird finster für euch
  rationale: Die verbale Form wird als eintretende Verdunkelung wiedergegeben und zugleich die poetische Parallele zur Nacht bewahrt.
- source_word: מִקְּסֹם
  choice: ohne Wahrsagung
  rationale: Wie bei מֵחָזוֹן wird מִן privativ verstanden. „Wahrsagung“ bezeichnet die hier verurteilte Praxis, ohne sie mit legitimer prophetischer Offenbarung gleichzusetzen.
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: Die Sonne wird über den Propheten untergehen
  rationale: בוא bedeutet grundsätzlich „kommen“, bezeichnet in Verbindung mit der Sonne jedoch idiomatisch ihr Untergehen. „über den Propheten“ erhält die Bildgestaltung mit עַל.
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: und der Tag wird sich über ihnen verdunkeln
  rationale: קדר bezeichnet das Dunkel- oder Düsterwerden; die reflexive deutsche Form gibt den Vorgang natürlich wieder und wahrt das Gerichtsbild.
theological_decisions:
- issue: Bedeutung der Dunkelheitsbilder
  choice: Die Bilder von Nacht, Finsternis, Sonnenuntergang und verdunkeltem Tag schildern das Gericht über die angeklagten Propheten, insbesondere den Entzug prophetischer Einsicht.
  alternative: Bloße gesellschaftliche Beschämung oder ein ausschließlich wörtliches astronomisches Ereignis.
  rationale: Der unmittelbare Zusammenhang nennt Vision und Wahrsagung. Daher liegt der Schwerpunkt auf dem Ende ihres beanspruchten prophetischen Zugangs; die bildhafte Sprache wird dennoch nicht auf eine einzige systematische Deutung verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die Wiederholung „für euch“ und die Abfolge der Dunkelheitsmotive bleiben erhalten; ungewöhnliche hebräische Wendungen werden im Haupttext idiomatisch und in den Fußnoten transparent wiedergegeben.
