  text: שֹׂ֥נְאֵי ט֖וֹב וְ/אֹ֣הֲבֵי רעה גֹּזְלֵ֤י עוֹרָ/ם֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/שְׁאֵרָ֖/ם מֵ/עַ֥ל עַצְמוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/002.yaml
  text: you who hate good and love evil[a], who strip their skin from off them and their flesh from off their bones—
translation:
  language: de
  text: die ihr das Gute hasst und das Böse liebt, die ihr ihnen die Haut abzieht und das Fleisch von ihren Knochen –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: die ihr das Gute hasst
  rationale: Die substantivisch gebrauchte Qal-Partizipialform setzt die direkte Anrede aus dem vorherigen Vers fort. »Das Gute« gibt den substantivischen Gebrauch von טוֹב im Deutschen natürlich wieder.
- source_word: וְאֹהֲבֵי רעה
  choice: und das Böse liebt
  rationale: Die parallele Partizipialkonstruktion wird als fortgesetzte direkte Anrede wiedergegeben. Im Gegensatz zu »dem Guten« bezeichnet רעה hier das moralisch Böse, nicht lediglich Schaden oder Unglück.
- source_word: גֹּזְלֵי עוֹרָם מֵעֲלֵיהֶם
  choice: die ihr ihnen die Haut abzieht
  rationale: גזל bezeichnet gewaltsames Wegnehmen oder Rauben. In Verbindung mit Haut und Körper gibt »die Haut abziehen« das drastische Bild idiomatisch und ohne Abschwächung wieder; »ihnen« bildet sowohl den Bezug des Suffixes als auch die räumliche Ablösung natürlich ab.
- source_word: וּשְׁאֵרָם מֵעַל עַצְמוֹתָם
  choice: und das Fleisch von ihren Knochen
  rationale: שְׁאֵר bezeichnet hier im anatomischen Zusammenhang das Fleisch. Die Präpositionalfügung wird als »von ihren Knochen« wiedergegeben und bewahrt den Parallelismus sowie das Schlachtbild.
theological_decisions:
- issue: Gewaltmetapher für die Unterdrückung durch korrupte Machthaber
  choice: Das drastische Bild vom Abziehen der Haut und des Fleisches bleibt erhalten.
  alternative: Abstrakte Umschreibung wie »die ihr sie völlig ausbeutet«.
  rationale: Der hebräische Text schildert die Unterdrückung bewusst mit schockierender körperlicher Bildsprache. Eine abstrakte Umschreibung würde die prophetische Anklage abschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Formulierung »die ihr« erhält die direkte Anrede und den hebräischen Parallelismus. Der Gedankenstrich zeigt an, dass der Satz und das Bild im folgenden Vers weitergeführt werden.
