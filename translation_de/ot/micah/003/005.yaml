  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל הַ/נְּבִיאִ֖ים הַ/מַּתְעִ֣ים אֶת עַמִּ֑/י הַ/נֹּשְׁכִ֤ים בְּ/שִׁנֵּי/הֶם֙ וְ/קָרְא֣וּ שָׁל֔וֹם וַ/אֲשֶׁר֙ לֹא יִתֵּ֣ן עַל פִּי/הֶ֔ם וְ/קִדְּשׁ֥וּ עָלָ֖י/ו מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: de
  text: So spricht Jahwe über die Propheten, die mein Volk in die Irre führen, die mit ihren Zähnen beißen[a] und »Frieden!« rufen. Wer ihnen aber nichts in den Mund gibt[b], gegen den heiligen sie einen Krieg[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild kann Propheten bezeichnen, die sich nähren lassen, und zugleich ihre räuberische Haltung andeuten.
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein kann, ihnen Nahrung oder eine Bezahlung zukommen zu lassen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »gegen den bereiten sie einen Krieg vor«. Wörtlich verwendet das Hebräische kultische Sprache: Sie »heiligen« einen Krieg gegen ihn.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen in seiner im Deutschen etablierten wissenschaftlichen Form wieder.
- source_word: עַל הַנְּבִיאִים
  choice: über die Propheten
  rationale: עַל führt hier den Gegenstand des Gerichtswortes ein; die verurteilende Haltung ergibt sich aus dessen Inhalt.
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: die mein Volk in die Irre führen
  rationale: Bewahrt den kausativen Sinn des Hifil-Partizips von תעה in natürlichem Deutsch.
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: die mit ihren Zähnen beißen
  rationale: Erhält das konkrete, mehrdeutige Bild, das sowohl Essen als auch räuberische Aggression anklingen lässt.
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: und »Frieden!« rufen
  rationale: קרא bezeichnet hier ein öffentliches Ausrufen; שָׁלוֹם umfasst Frieden, Wohlergehen und Sicherheit.
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: Wer ihnen aber nichts in den Mund gibt
  rationale: Folgt dem auffälligen hebräischen Bild und lässt offen, ob besonders an Nahrung, Bezahlung oder sonstige Zuwendung gedacht ist.
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: gegen den heiligen sie einen Krieg
  rationale: Bewahrt die kultische Sprache von קדשׁ im Piel und die vorangestellte Bezugnahme auf den Betroffenen, obwohl die Wendung im Deutschen bewusst ungewöhnlich klingt.
theological_decisions:
- issue: Wirtschaftliche Abhängigkeit und räuberische Bildsprache der falschen Propheten
  choice: Die Bilder vom Beißen und vom Geben in den Mund bleiben im Haupttext erhalten.
  alternative: Sinngemäß mit »wenn man sie bezahlt« oder »wenn man sie füttert« übersetzen.
  rationale: Der hebräische Text verurteilt Botschaften, die von empfangenen Leistungen abhängen, legt aber nicht ausdrücklich fest, ob Nahrung, Bezahlung oder beides gemeint ist.
- issue: Kultische Färbung der Kriegsankündigung
  choice: »einen Krieg heiligen«
  alternative: »den heiligen Krieg erklären« oder »sich zum Krieg rüsten«
  rationale: Die gewählte Fassung wahrt die ungewöhnliche kultische Formulierung, ohne durch den feststehenden Ausdruck »heiliger Krieg« eine umfassendere theologische Kategorie in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen Bilder des Hebräischen werden im Haupttext bewusst beibehalten und in knappen Fußnoten erläutert.
