id: MIC.3.8
reference: Micah 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: de
  text: Ich aber bin erfüllt mit Kraft, mit dem Geist Jahwes, mit Recht und Stärke,[a] um Jakob sein Vergehen[b] und Israel seine Sünde zu verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wortfolge kann auch verstanden werden: „Ich aber bin durch den Geist Jahwes mit Kraft, Recht und Stärke erfüllt.“'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Auflehnung“ bedeuten und hebt dann den Widerstand gegen Gott hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: Ich aber
  rationale: Gibt den starken Gegensatz zu den zuvor genannten korrupten Propheten sowie das betonte Ich knapp und natürlich wieder.
- source_word: מָלֵאתִי
  choice: bin erfüllt
  rationale: 'Bewahrt den resultativ-stativen Sinn des Perfekts: Der Prophet befindet sich in einem Zustand der Erfüllung und Befähigung.'
- source_word: כֹחַ
  choice: Kraft
  rationale: Bezeichnet hier die dem Propheten verliehene Befähigung zur mutigen Verkündigung.
- source_word: אֶת רוּחַ יְהוָה
  choice: mit dem Geist Jahwes
  rationale: Versteht die Wendung parallel zu den übrigen Gliedern als Inhalt der Erfüllung; die mögliche instrumentale Zuordnung wird in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als gebräuchliche deutsche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Trifft im Zusammenhang prophetischer Anklage sowohl moralische Gerechtigkeit als auch die Fähigkeit zu gerechtem Urteil.
- source_word: גְבוּרָה
  choice: Stärke
  rationale: Bezeichnet tatkräftige, mutige Stärke und bildet eine natürliche Verbindung mit „Kraft“, ohne die Bedeutungsnähe aufzulösen.
- source_word: לְהַגִּיד
  choice: zu verkünden
  rationale: Passt zur öffentlichen und autoritativen prophetischen Bekanntmachung.
- source_word: פִּשְׁעוֹ
  choice: sein Vergehen
  rationale: Gibt den schweren Normbruch verständlich wieder; der häufig mitklingende Aspekt der Auflehnung wird in einer Fußnote genannt.
- source_word: חַטָּאתוֹ
  choice: seine Sünde
  rationale: Bewahrt den geläufigen religiös-moralischen Sinn und den Parallelismus mit „Vergehen“.
theological_decisions:
- issue: Bezug und Funktion von רוּחַ יְהוָה innerhalb der Aufzählung
  choice: „mit Kraft, mit dem Geist Jahwes, mit Recht und Stärke“
  alternative: „durch den Geist Jahwes mit Kraft, Recht und Stärke“
  rationale: Die hebräische Wortfolge lässt den Geist Jahwes als Inhalt beziehungsweise Begleitung der Erfüllung lesen, kann aber auch die Quelle der Kraft bezeichnen. Der Haupttext folgt der additiven Lesart, ohne die instrumentale Lesart auszuschließen.
- issue: Personaler oder unpersönlicher Sinn von רוּחַ יְהוָה
  choice: „der Geist Jahwes“
  alternative: „der Geist von Jahwe“ beziehungsweise ein unpersönlicher göttlicher Antrieb
  rationale: Im Zusammenhang prophetischer Befähigung bezeichnet die feste Wendung am natürlichsten Gottes eigenen Geist; der deutsche bestimmte Artikel und die Großschreibung entsprechen diesem Verständnis, ohne weitergehende dogmatische Aussagen einzutragen.
- issue: Wiedergabe des Tetragramms
  choice: „Jahwe“
  alternative: „der HERR“
  rationale: Der Ausgangstext nennt den göttlichen Eigennamen ausdrücklich; seine Transliteration wahrt diese Form des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Aussage. „Ich aber“ trägt den Kontrast ohne unnötige Erweiterung; „Recht und Stärke“ bleibt verständlich und bewahrt die knappe hebräische Reihung.
