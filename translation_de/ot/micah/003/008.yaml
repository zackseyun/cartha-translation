  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. „Geist Jahwes“, „Recht“, „Stärke“, „Vergehen“ und „Sünde“ passen zum prophetischen Register und bewahren die begrifflichen Unterscheidungen des Ausgangstextes. Die Fußnoten geben die relevante syntaktische Alternative und die lexikalische Nuance von פֶּשַׁע angemessen wieder.
