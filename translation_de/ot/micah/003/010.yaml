source:
  edition: WLC
  text: בֹּנֶ֥ה צִיּ֖וֹן בְּ/דָמִ֑ים וִ/ירוּשָׁלִַ֖ם בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/010.yaml
  text: who builds Zion with bloodshed and Jerusalem with injustice[a].
translation:
  language: de
  text: die Zion mit Blutvergießen[a] bauen und Jerusalem mit Unrecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Blut«; der hebräische Plural bezeichnet häufig Blutvergießen oder Blutschuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּנֶה
  choice: die … bauen
  rationale: Das maskuline Singularpartizip setzt die Anklage gegen die zuvor angesprochenen führenden Männer fort. Im Deutschen nimmt der Relativanschluss aus dem Kontext idiomatisch den Plural auf.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der eingebürgerte deutsche Name wird beibehalten.
- source_word: בְּדָמִים
  choice: mit Blutvergießen
  rationale: Der hebräische Plural »Blut« bezeichnet häufig Blutvergießen oder Blutschuld. »Mit Blutvergießen« gibt hier die gewaltsamen Mittel der führenden Männer klar wieder.
- source_word: וִירוּשָׁלִַם
  choice: und Jerusalem
  rationale: Der eingebürgerte deutsche Name und die ausdrückliche Konjunktion werden beibehalten.
- source_word: בְּעַוְלָה
  choice: mit Unrecht
  rationale: עַוְלָה bezeichnet Unrecht, Ungerechtigkeit oder Frevel. »Unrecht« ist prägnant, verständlich und bewahrt die breite moralisch-soziale Anklage.
theological_decisions:
- issue: Art der prophetischen Anklage
  choice: Die führenden Männer bauen beziehungsweise befestigen Zion und Jerusalem durch Blutvergießen und Unrecht.
  alternative: Die Formulierung könnte wörtlicher als »mit Blut« wiedergegeben werden.
  rationale: Der hebräische Plural דָּמִים ist hier idiomatisch als Blutvergießen oder Blutschuld zu verstehen; die Übersetzung vermeidet die irreführende Vorstellung eines buchstäblichen Baumaterials, ohne die Schärfe der Anklage zu mindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als syntaktische Fortsetzung von Micha 3,9 formuliert; deshalb steht »die … bauen« im Plural, obwohl das hebräische Partizip formal Singular ist. Die parallele Struktur »Zion … und Jerusalem …« bleibt erhalten.
