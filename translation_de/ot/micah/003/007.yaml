source:
  edition: WLC
  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: de
  text: Dann werden die Seher beschämt dastehen und die Wahrsager in Schande geraten. Sie alle werden die Oberlippe verhüllen[a], denn von Gott kommt keine Antwort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lippe“ oder „den Schnurrbart verhüllen“; vermutlich eine Geste der Scham, Trauer oder Unreinheit.'
    reason: lexikalische Alternative und kulturelle Erläuterung
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: werden beschämt dastehen
  rationale: בוש bezeichnet hier das Beschämt- oder Zuschandenwerden. Die Formulierung gibt im prophetischen Gerichtskontext sowohl den eintretenden Zustand als auch dessen öffentliche Wirkung natürlich wieder.
- source_word: הַחֹזִים
  choice: die Seher
  rationale: חֹזִים ist eine etablierte Bezeichnung für Menschen, die Visionen zu empfangen beanspruchen. „Seher“ ist knapp, verständlich und bewahrt den fachsprachlichen Charakter.
- source_word: וְחָפְרוּ
  choice: in Schande geraten
  rationale: חפר drückt hier Beschämung beziehungsweise Entehrung aus. Die Wiedergabe wahrt den Parallelismus zu בוש, ohne beide Verben völlig gleichzusetzen.
- source_word: הַקֹּסְמִים
  choice: die Wahrsager
  rationale: קסם bezeichnet das Praktizieren von Wahrsagerei oder Divination. „Wahrsager“ ist im modernen Deutschen die unmittelbar verständliche Personenbezeichnung.
- source_word: וְעָטוּ עַל שָׂפָם
  choice: werden die Oberlippe verhüllen
  rationale: Die Wendung bezeichnet wörtlich das Bedecken der Lippe, Oberlippe oder des Schnurrbartbereichs. „Die Oberlippe verhüllen“ bewahrt das konkrete Bild, ohne die Bedeutung der Geste im Haupttext festzulegen.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die ausdrückliche Gesamtheit der beiden genannten Gruppen wird hervorgehoben.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung für ihre Beschämung ein. „Denn“ verbindet die Aussagen in diesem prophetisch-dignifizierten Register natürlich.
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: von Gott kommt keine Antwort
  rationale: Die nominale hebräische Aussage wird idiomatisch wiedergegeben und lässt offen, ob Gottes Schweigen oder das Fehlen eines echten göttlichen Bescheids im Vordergrund steht.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet im Kontext den einen Gott, von dem keine Antwort ergeht.
theological_decisions:
- issue: Göttliches Schweigen oder Fehlen eines gültigen Gottesbescheids
  choice: von Gott kommt keine Antwort
  alternative: Gott antwortet nicht; es gibt keinen göttlichen Bescheid
  rationale: 'Die gewählte nominalnahe Formulierung bewahrt die Spannung des Hebräischen: Sie sagt weder genauer, warum keine Antwort vorliegt, noch legt sie fest, ob das Ausbleiben oder die Ungültigkeit der beanspruchten Offenbarung betont wird.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Parallelismus der beiden Gruppen und ihrer Beschämung bleibt erhalten; die körperliche Geste wird nicht vorschnell gedeutet.
