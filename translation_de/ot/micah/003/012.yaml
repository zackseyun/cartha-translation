source:
  edition: WLC
  text: לָ/כֵן֙ בִּ/גְלַלְ/כֶ֔ם צִיּ֖וֹן שָׂדֶ֣ה תֵֽחָרֵ֑שׁ וִ/ירוּשָׁלִַ֨ם֙ עִיִּ֣ין תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: de
  text: Darum wird Zion euretwegen wie ein Feld gepflügt werden, Jerusalem wird zu Trümmerhaufen werden, und der Berg des Hauses[a] wird zu bewaldeten Höhen[b] werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Tempelberg« oder »der Berg des Tempels«. Wörtlich: »der Berg des Hauses«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Waldhöhen« beziehungsweise »Höhen eines Waldes«. Das Hebräische zeichnet wahrscheinlich das Bild des verwilderten und überwucherten Tempelbergs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet das angekündigte Gericht als Folge der zuvor genannten Schuld und klingt im modernen Deutschen natürlich und nachdrücklich.
- source_word: בִּגְלַלְכֶם
  choice: euretwegen
  rationale: Weist den Angesprochenen unmittelbar die Verantwortung zu und bewahrt die kausale Aussage.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Entspricht der etablierten deutschen Form des Ortsnamens.
- source_word: שָׂדֶה תֵחָרֵשׁ
  choice: wird wie ein Feld gepflügt werden
  rationale: Gibt das landwirtschaftliche Bild sowie die passive Form des hebräischen Verbs präzise und idiomatisch wieder.
- source_word: עִיִּין תִּהְיֶה
  choice: wird zu einem Trümmerhaufen werden
  rationale: עִיִּין bezeichnet eine Ruinen- beziehungsweise Trümmerstätte; die Wendung macht die angekündigte Verwandlung Jerusalems deutlich.
- source_word: הַר הַבַּיִת
  choice: der Berg des Hauses
  rationale: Bewahrt die konkrete hebräische Formulierung, in der »das Haus« den Tempel bezeichnet, ohne die Auslegung in den Haupttext einzubauen.
- source_word: לְבָמוֹת יָעַר
  choice: zu bewaldeten Höhen
  rationale: Gibt die topografische Vorstellung von Höhen wieder, die zu wildem Waldland geworden sind; יָעַר prägt hier das Bild der Verwilderung.
theological_decisions:
- issue: Ob הַבַּיִת im Haupttext ausdrücklich als »Tempel« wiederzugeben ist
  choice: die wörtlichere Wendung »der Berg des Hauses«
  alternative: der Tempelberg; der Berg des Tempels
  rationale: Das Hebräische sagt »das Haus«. Diese im prophetischen Sprachgebrauch tempelbezogene Bezeichnung bleibt erhalten, während die eindeutige Erläuterung in der Fußnote steht.
- issue: Ob בָּמוֹת kultisch als »Kulthöhen« oder topografisch als »Höhen« zu verstehen ist
  choice: bewaldete Höhen
  alternative: Waldhöhen; Höhen eines Waldes
  rationale: Der Zusammenhang schildert Verwüstung und Verwilderung. Das nachfolgende יָעַר legt daher eher ein topografisches Bild als einen Hinweis auf Kultstätten nahe, ohne die sprachliche Mehrdeutigkeit ganz zu verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Gerichtsankündigung bleibt in einem fließenden Satz erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
