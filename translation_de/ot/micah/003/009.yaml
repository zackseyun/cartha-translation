source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: de
  text: 'Hört doch dies[a], ihr Häupter des Hauses Jakob und ihr Herrscher des Hauses Israel, die ihr das Recht verabscheut und alles Gerade krumm macht[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört nun dies“. Das hebräische נָא kann sowohl Dringlichkeit als auch eine eindringliche Bitte ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und alles Richtige verdreht“. Wörtlich steht im Hebräischen „alles Gerade krumm macht“; so bleibt der bildhafte Gegensatz erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Hört doch dies
  rationale: Der pluralische Imperativ wird direkt wiedergegeben. „doch“ vermittelt hier die eindringliche, zugleich appellative Kraft von נָא natürlicher als ein zeitliches „nun“ oder das im Deutschen unpassend höfliche „bitte“.
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: Häupter des Hauses Jakob
  rationale: „Häupter“ bewahrt die Körpermetapher von רָאשֵׁי und den würdevoll-prophetischen Ton; „Haus Jakob“ erhält die kollektive Bezeichnung des Hebräischen.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: und ihr Herrscher des Hauses Israel
  rationale: קְצִינֵי bezeichnet hier leitende Amtsträger. „Herrscher“ passt zum gesellschaftlich-juristischen Kontext und bildet eine verständliche Parallele zu „Häupter“.
- source_word: הַמֲתַעֲבִים מִשְׁפָּט
  choice: die ihr das Recht verabscheut
  rationale: Das Partizip bezeichnet eine starke ablehnende Haltung. מִשְׁפָּט meint im Kontext gerechtes Recht beziehungsweise Rechtsprechung; „das Recht“ ist im Deutschen prägnant und idiomatisch.
- source_word: וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  choice: und alles Gerade krumm macht
  rationale: Die konkrete Gegenüberstellung von „gerade“ und „krumm machen“ bewahrt das hebräische Bild und die rhetorische Schärfe besser als abstrakte Wiedergaben wie „alles Richtige verdrehen“.
theological_decisions:
- issue: Bezeichnungen des Bundesvolkes
  choice: Haus Jakob ... Haus Israel
  alternative: Volk Jakobs ... Volk Israel
  rationale: בֵּית wird in beiden parallelen Wendungen ausdrücklich genannt. Die Wiedergabe mit „Haus“ bewahrt sowohl die poetische Struktur als auch den korporativen Sinn, ohne ihn interpretierend einzuengen.
- issue: Bedeutungsumfang von מִשְׁפָּט
  choice: das Recht
  alternative: die Gerechtigkeit
  rationale: Im Kontext der angeklagten Führungsträger umfasst der Ausdruck gerechtes Urteilen und die geordnete Rechtsausübung. „Recht“ wahrt diesen institutionellen Bezug, während „Gerechtigkeit“ stärker als abstrakte Tugend verstanden werden könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-eindringlichem Ton. Die Anredepronomen werden ergänzt, um die partizipiale Anklage im Deutschen klar auf die zuvor genannten Führungsträger zu beziehen. Die traditionelle, aber weiterhin verständliche Bezeichnung „Häupter“ bewahrt die hebräische Metapher; der bildhafte Gegensatz „gerade/krumm“ bleibt ausdrücklich erhalten.
