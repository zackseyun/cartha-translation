  to: Hört, ihr Berge, den Rechtsstreit[a] Jahwes, und hört, ihr festen[b] Grundfesten der Erde! Denn Jahwe hat einen Rechtsstreit gegen sein Volk[c], und mit Israel wird er seinen Rechtsstreit führen.
  rationale: Die Wiederholung von „hört“ stellt die im Deutschen erforderliche parallele Anrede von Bergen und Grundfesten her. Die Schlusswendung wird so gefasst, dass sie das rechtliche Moment von יִתְוַכָּח und die Präposition „mit Israel“ zugleich wiedergibt, ohne ein bestimmtes modernes Gerichtsverfahren zu behaupten. Die Anker und ihre Reihenfolge bleiben konsistent.
