  naturalness: Ohne ein zweites „hört“ ist „und ihr festen Grundfesten der Erde“ kein vollständiger, natürlich lesbarer Satzteil. Mit der Wiederholung des Imperativs ist die parallele Anrede klar. „Mit Israel wird er seinen Rechtsstreit führen“ ist modernes, würdiges Deutsch und bewahrt den juristischen Charakter ohne eine moderne Prozesshandlung zu stark festzulegen.
