source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: de
  text: Hört, ihr Berge, den Rechtsstreit[a] Jahwes, und hört, ihr festen[b] Grundfesten der Erde! Denn Jahwe hat einen Rechtsstreit gegen sein Volk[c], und mit Israel wird er seinen Rechtsstreit führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Streit“, „Rechtssache“ oder „Anklage“. Das hebräische Wort רִיב wird häufig für eine rechtliche oder bundesrechtliche Auseinandersetzung gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beständigen“, „mächtigen“ oder „uralten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „mit seinem Volk“; im Zusammenhang eines Rechtsstreits ist gemeint: „gegen sein Volk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ eröffnet einen prophetischen Aufruf an die als Zeugen angeredeten Berge. „Hört“ ist knapp und bewahrt die direkte Anrede.
- source_word: הָרִים
  choice: ihr Berge
  rationale: Die Ergänzung „ihr“ kennzeichnet im heutigen Deutschen die vokativische Anrede natürlich.
- source_word: רִיב
  choice: Rechtsstreit
  rationale: רִיב bezeichnet hier eine rechtlich geprägte, bundesbezogene Auseinandersetzung oder Anklage. „Rechtsstreit“ bewahrt den forensischen Ton, ohne auf eine moderne Prozessform festgelegt zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen mit der gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאֵתָנִים
  choice: festen
  rationale: Das Wort bezeichnet Festigkeit, Beständigkeit oder dauerhafte Stärke. „Fest“ passt unmittelbar zu den Grundfesten und lässt die Bedeutungsnuancen „beständig“ und „uralt“ offen.
- source_word: מֹסְדֵי אָרֶץ
  choice: Grundfesten der Erde
  rationale: Die Konstruktverbindung bezeichnet die tragenden Fundamente der Erde. „Grundfesten“ erhält das kosmische Bild und den gehobenen prophetischen Ton.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für den Aufruf an die Schöpfungszeugen ein.
- source_word: עִם עַמּוֹ
  choice: gegen sein Volk
  rationale: עִם bedeutet formal „mit“, bezeichnet aber in Verbindung mit רִיב die Gegenpartei eines Rechtsstreits. „Gegen“ macht diese forensische Beziehung im Deutschen verständlich.
- source_word: יִתְוַכָּח
  choice: wird er ins Gericht gehen
  rationale: Das Hitpael von יכח bezeichnet hier ein rechtliches Streiten beziehungsweise das Austragen einer Sache. Die deutsche Wendung erhält den gerichtlichen Zusammenhang, ohne den Ausgang vorwegzunehmen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Namens des Bundesvolkes.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Rechtlicher Charakter von רִיב und יִתְוַכָּח
  choice: Rechtsstreit / ins Gericht gehen
  alternative: Streit / sich auseinandersetzen
  rationale: Der Zusammenhang stellt Berge und Grundfesten als Zeugen einer bundesrechtlichen Anklage dar. Die rechtliche Wortwahl bewahrt diese Dimension, ohne aus dem Vers ein modernes Gerichtsverfahren zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-forensischem Klang. Die direkte Anrede der Schöpfung bleibt erhalten; „Grundfesten“ ist bewusst gehoben, aber allgemein verständlich. Die Wiederholung von „Rechtsstreit“ spiegelt die Wiederaufnahme des hebräischen רִיב und verstärkt den Gerichtsrahmen.
