source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: de
  text: 'Hört doch, was Jahwe sagt: »Steh auf, führe vor den Bergen einen Rechtsstreit[a], und die Hügel sollen deine Stimme hören!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »führe einen Rechtsstreit mit den Bergen« beziehungsweise »gegen die Berge«. Das hebräische Verb hat einen rechtlichen Klang; wahrscheinlich werden die Berge hier als Zeugen in einer Rechtssache aufgerufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der pluralische Imperativ fordert zum aufmerksamen Hören auf; נָא verleiht dem Aufruf Nachdruck. „Doch“ gibt diese dringliche, auffordernde Nuance im heutigen Deutsch natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des göttlichen Eigennamens bewahrt den Tetragrammaton als Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: קוּם
  choice: Steh auf
  rationale: Der singularische Imperativ ruft den Angesprochenen unmittelbar zum Handeln auf und ist im modernen Deutsch klar und würdevoll.
- source_word: רִיב
  choice: zum Rechtsstreit antreten
  rationale: Das Verb bezeichnet hier nicht bloß allgemeinen Streit, sondern trägt einen deutlich forensischen Sinn. Die Formulierung wahrt diesen gerichtlichen Hintergrund ohne unnötige Ausdeutung.
- source_word: אֶת הֶהָרִים
  choice: vor den Bergen
  rationale: Im Zusammenhang erscheinen die Berge wahrscheinlich als Zeugen der Rechtssache. Da אֶת bei ריב jedoch auch die Streitpartei bezeichnen kann, wird die grammatische Mehrdeutigkeit in einer Fußnote offengehalten.
- source_word: וְתִשְׁמַעְנָה הַגְּבָעוֹת
  choice: und die Hügel sollen … hören
  rationale: Die Fortsetzung nach den Imperativen hat auffordernden beziehungsweise jussivischen Charakter. „Sollen“ gibt diesen Zug natürlich wieder und erhält den poetischen Parallelismus.
- source_word: קוֹלֶךָ
  choice: deine Stimme
  rationale: Die wörtliche und idiomatische Wiedergabe bewahrt das Bild des öffentlich vorgetragenen Rechtsstreits.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen; die Schreibweise mit J entspricht der etablierten deutschen Umschrift.
- issue: Rolle der Berge in der Rechtsszene
  choice: Die Rechtssache wird vor den Bergen vorgetragen
  alternative: Die Berge selbst sind Streitgegner oder Angeklagte
  rationale: Der folgende Aufruf, dass die Hügel die Stimme hören sollen, legt nahe, dass Berge und Hügel als Zeugen angerufen werden. Weil die Konstruktion auch „mit/gegen die Berge“ zulässt, wird diese Alternative nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Ton. Der Wechsel vom pluralischen „Hört“ zum singularischen „Steh auf“ bleibt wie im Hebräischen erhalten. Die direkte Rede wird typografisch markiert; die Rechtssprache bleibt erkennbar, ohne die Rolle der Berge im Haupttext endgültig festzulegen.
