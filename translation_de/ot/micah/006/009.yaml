  text: ק֤וֹל יְהוָה֙ לָ/עִ֣יר יִקְרָ֔א וְ/תוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑/ךָ שִׁמְע֥וּ מַטֶּ֖ה וּ/מִ֥י יְעָדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: de
  text: 'Die Stimme des HERRN ruft der Stadt zu:


    »Weisheit sieht deinen Namen.[a]


    Hört auf die Rute


    und auf den, der sie bestimmt hat!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Weisheit sieht deinen Namen.“ Nach anderer Vokalisierung der Konsonanten wird auch übersetzt: „Weisheit fürchtet deinen Namen.“'
    reason: Die masoretische Lesart und die verbreitete alternative Vokalisierung werden transparent gemacht.
  - marker: b
    text: Die „Rute“ steht wahrscheinlich bildhaft für angekündigte Züchtigung oder Gericht. Das hebräische „hört“ kann hier auch „achtet auf“ bedeuten.
    reason: Die ungewöhnliche Verbindung von „hören“ mit der Rute und die Bildsprache werden knapp erläutert.
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  choice: Die Stimme des HERRN
  rationale: קול bezeichnet die hörbare Stimme; der Gottesname יהוה wird in der im Deutschen vertrauten Wiedergabe HERR wiedergegeben.
- source_word: וְתוּשִׁיָּה
  choice: Weisheit
  rationale: תושיה kann wirksame, zuverlässige Einsicht oder Klugheit bezeichnen. „Weisheit“ ist hier natürlich und lässt die personifizierende Formulierung des Hebräischen bestehen.
- source_word: יִרְאֶה שְׁמֶךָ
  choice: erkennt deinen Namen
  rationale: Der masoretisch vokalisierte Text hat יִרְאֶה, „sieht“. „Erkennt“ überträgt das gemeinte aufmerksame Wahrnehmen idiomatisch, ohne zur abweichenden Lesart „fürchtet“ zu wechseln.
- source_word: שִׁמְעוּ מַטֶּה
  choice: Hört auf die Rute
  rationale: 'Das ungewöhnliche Bild wird bewahrt: מטה ist die Rute bzw. der Stab als Werkzeug der Züchtigung oder des Gerichts; שמע umfasst hier ein hörendes Beachten.'
- source_word: וּמִי יְעָדָהּ
  choice: und auf den, der sie bestimmt hat
  rationale: Das feminine Suffix bezieht sich am ehesten auf die Rute; יעד bedeutet hier bestimmen, anordnen oder einsetzen. Die personale Form „den, der“ erhält die offene Frage nach dem Handelnden, statt ihn ausdrücklich zu benennen.
theological_decisions:
- issue: Masoretische Lesart „sieht“ gegenüber der Deutung „fürchtet“
  choice: „Weisheit erkennt deinen Namen“ nach der Vokalisierung יִרְאֶה („sieht“)
  alternative: „Weisheit fürchtet deinen Namen“ bzw. „Wer weise ist, fürchtet deinen Namen“
  rationale: Die Konsonanten könnten bei anderer Vokalisierung mit „fürchten“ verbunden werden, doch der vorgelegte WLC-Text punktiert eindeutig die Form von ראה, „sehen“. Die Übersetzung folgt daher zuerst dem originalsprachlichen Quellenbefund und dokumentiert die andere traditionsreiche Auffassung in der Fußnote.
- issue: Identität dessen, der die Rute bestimmt hat
  choice: Nicht ausdrücklich als Gott identifiziert
  alternative: „den HERRN, der sie bestimmt hat“
  rationale: Der Zusammenhang legt Gott nahe, aber der hebräische Text sagt lediglich „wer/der sie bestimmt hat“. Die Übersetzung vermeidet eine ausdrückliche Ergänzung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die poetische Zeilenform und die personifizierte „Weisheit“ bleiben erhalten. „HERR“ steht traditionsgemäß für den Gottesnamen יהוה; „Rute“ bewahrt das markante Gerichtsbild des Ausgangstextes.
