source:
  edition: WLC
  text: ע֗וֹד הַ/אִשׁ֙ בֵּ֣ית רָשָׁ֔ע אֹצְר֖וֹת רֶ֑שַׁע וְ/אֵיפַ֥ת רָז֖וֹן זְעוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
translation:
  language: de
  text: Gibt es im Haus des Gottlosen noch Schätze des Unrechts und ein zu knappes Efa[a], das verflucht ist?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein gebräuchliches Trockenmaß; hier kann auch der entsprechende Messbehälter eines Händlers gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ein mangelhaftes Efa, das verflucht ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: noch
  rationale: Das Adverb bezeichnet das Fortbestehen des angeprangerten Zustands; „noch“ ist im Deutschen natürlich und präzise.
- source_word: הַאִשׁ
  choice: Gibt es
  rationale: Die schwierige Form wird im Kontext als Fragepartikel verstanden. „Gibt es“ gibt die rhetorische Frage idiomatisch wieder.
- source_word: בֵּית רָשָׁע
  choice: im Haus des Gottlosen
  rationale: Die singularische Status-constructus-Verbindung bezeichnet das Haus beziehungsweise den Haushalt eines gottlosen Menschen; die Formulierung wahrt den Singular und den moralischen Begriff.
- source_word: אֹצְרוֹת רֶשַׁע
  choice: Schätze des Unrechts
  rationale: Die formnahe Wiedergabe bewahrt sowohl den konkreten Gedanken angehäufter Güter als auch ihre Verbindung mit Unrecht, ohne ausdrücklich festzulegen, ob sie durch Unrecht erworben wurden oder selbst als unrechtmäßig gelten.
- source_word: אֵיפַת
  choice: Efa
  rationale: Das Efa ist ein antikes Trockenmaß und kann hier zugleich den Messbehälter eines Händlers bezeichnen. Der Fachbegriff bewahrt die konkrete Maßeinheit; eine Fußnote erklärt ihn.
- source_word: רָזוֹן
  choice: zu knappes
  rationale: Das Wort bezeichnet hier ein vermindertes beziehungsweise zu kleines Maß, das den Kunden benachteiligt. „Zu knapp“ klingt im modernen Deutschen natürlich und macht den Betrug verständlich.
- source_word: זְעוּמָה
  choice: verflucht
  rationale: Das Partizip bezeichnet etwas, das verurteilt oder dem Fluch preisgegeben ist. „Verflucht“ erhält die starke wertende Aussage.
theological_decisions:
- issue: Fragesatz trotz schwieriger Textform am Versanfang
  choice: 'Rhetorische Frage: „Gibt es ... noch ...?“'
  alternative: Aussagesatz über das fortdauernde Vorhandensein unrechten Gewinns
  rationale: Der Zusammenhang der göttlichen Anklage und die anschließenden Fragen sprechen für eine rhetorische Frage. Die textliche Schwierigkeit wird jedoch nicht zu einer weitergehenden theologischen Aussage ausgebaut.
- issue: Bezug von „verflucht“
  choice: Grammatischer Bezug auf das Efa beziehungsweise Maß
  alternative: Allgemeine Verurteilung der betrügerischen Praxis
  rationale: Die feminine Form זְעוּמָה stimmt mit אֵיפַת überein. Zugleich bleibt sachlich erkennbar, dass der Fluch dem betrügerisch verkleinerten Maß gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; „zu knappes Efa“ verbindet Verständlichkeit mit der konkreten antiken Maßeinheit. Sämtliche Fußnotenmarker stehen im Haupttext.
