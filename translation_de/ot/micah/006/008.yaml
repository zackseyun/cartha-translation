  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: de
  text: Er hat dir mitgeteilt, Mensch,[a] was gut ist. Und was fordert Jahwe von dir anderes, als Recht zu üben, Güte[b] zu lieben und demütig mit deinem Gott zu gehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Mensch“ im Singular; die Anrede gilt dem menschlichen Hörer stellvertretend.
    reason: cultural_note
  - marker: b
    text: Oder „Barmherzigkeit“, „beständige Liebe“ oder „Bundestreue“. Das hebräische חֶסֶד bezeichnet Güte sowie verlässliche, loyale Liebe innerhalb einer verbindlichen Beziehung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: Er hat dir mitgeteilt
  rationale: Das Hifil von נגד bedeutet „mitteilen, bekannt machen“. Das Perfekt bezeichnet hier eine bereits erfolgte Offenbarung, die weiterhin maßgeblich ist.
- source_word: אָדָם
  choice: Mensch
  rationale: Der singularische Vokativ spricht einen einzelnen menschlichen Hörer stellvertretend an. „Mensch“ bewahrt Singular und rhetorische Direktheit, ohne im modernen Deutschen unnötig auf männliches Geschlecht festzulegen.
- source_word: טּוֹב
  choice: gut
  rationale: Das breite moralische Wort wird nicht auf „richtig“ oder „nützlich“ verengt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Wiedergabe des Gottesnamens bildet das Tetragramm als Eigennamen ab.
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: fordert ... von dir
  rationale: דרשׁ mit מן bezeichnet hier das, was Gott vom Menschen verlangt. Die Formulierung ist im Deutschen natürlich und wahrt die ethische Verbindlichkeit.
- source_word: כִּי אִם
  choice: außer dies
  rationale: Die Konstruktion führt in der rhetorischen Frage den ausschließlich genannten Inhalt der Forderung ein.
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: Recht zu üben
  rationale: מִשְׁפָּט bezeichnet hier gerechtes Handeln; „Recht üben“ gibt die tätige Bedeutung von עשׂה idiomatisch wieder.
- source_word: אַהֲבַת חֶסֶד
  choice: beständige Liebe zu lieben
  rationale: חֶסֶד umfasst Güte, loyale Verbundenheit und verlässliche Liebe. Die bewusst markante Verbindung „Liebe lieben“ spiegelt die hebräische Form, statt sie auf bloße Barmherzigkeit zu verengen.
- source_word: הַצְנֵעַ לֶכֶת
  choice: demütig ... zu gehen
  rationale: Die adverbiale Wendung bezeichnet eine bescheidene, demütige Lebensführung. „Gehen“ bewahrt zugleich das hebräische Wegmotiv.
- source_word: עִם אֱלֹהֶיךָ
  choice: mit deinem Gott
  rationale: עִם bedeutet unmittelbar „mit“ und betont die Beziehung zu Gott, ohne interpretierend zu „vor deinem Gott“ zu wechseln.
theological_decisions:
- issue: Wiedergabe von חֶסֶד
  choice: beständige Liebe
  alternative: Barmherzigkeit; Güte; Bundestreue
  rationale: Der Ausdruck bezeichnet mehr als Mitleid und kann loyale, verlässliche Liebe innerhalb einer verbindlichen Beziehung umfassen. Die Hauptfassung wahrt diese Bedeutungsbreite; gebräuchliche Alternativen stehen in der Fußnote.
- issue: Stellvertretende Anrede אָדָם
  choice: Mensch
  alternative: du Mensch; Menschenkind; Menschheit
  rationale: Der hebräische Singular redet den Hörer als Menschen stellvertretend an. „Mensch“ wahrt diese direkte, singularische Anrede und ist im Deutschen geschlechtsübergreifend verständlich.
- issue: Bedeutung von הַצְנֵעַ
  choice: demütig
  alternative: bescheiden; behutsam
  rationale: Das seltene Wort lässt Nuancen von Bescheidenheit oder bedachtem Verhalten zu. „Demütig“ entspricht dem ethischen Zusammenhang, ohne die Alternativen als unmöglich auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter rhetorischer Anrede. Die Dreierfolge der Infinitive und das Wegmotiv bleiben erhalten. Die leicht markante Wendung „beständige Liebe zu lieben“ bewahrt bewusst die Spannung und Ausdrucksform des Hebräischen.
