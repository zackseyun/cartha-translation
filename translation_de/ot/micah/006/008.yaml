  naturalness: „Was fordert Jahwe von dir anderes als …?“ ist eine natürliche rhetorische Frage und bildet den exceptiven Sinn präzise ab. „Güte zu lieben“ ist im modernen würdevollen Bibeldeutsch klar, gut lesbar und für den ethischen Kontext passend. „Demütig mit deinem Gott zu gehen“ bewahrt die Wegmetapher.
  terminology: „Jahwe“, „Recht üben“ und „mit deinem Gott gehen“ sind angemessen. Für חֶסֶד ist „Güte“ als Haupttext vorzuziehen; die Fußnote wahrt die wichtigen Nuancen von Barmherzigkeit, beständiger/loyaler Liebe und Bundestreue. Die Anmerkungsanker sind korrekt dem jeweiligen hebräischen Ausdruck zugeordnet.
