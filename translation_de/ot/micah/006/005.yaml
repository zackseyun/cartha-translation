id: MIC.6.5
reference: Micah 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: de
  text: Mein Volk, erinnere dich bitte daran, was Balak, der König von Moab, plante[a] und was Bileam, der Sohn Beors, ihm antwortete – von Schittim bis Gilgal[b] –, damit du die gerechten Taten Jahwes[c] erkennst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was Balak, der König von Moab, ersann“ beziehungsweise „wozu er riet“.'
    reason: lexical_alternative
  - marker: b
    text: Schittim und Gilgal sind Ortsnamen, die an Israels Weg aus den Ebenen Moabs in das verheißene Land erinnern.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „die rettenden Taten Jahwes“ oder „die Gerechtigkeitstaten Jahwes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mein Volk
  rationale: Die Anrede Gottes an Israel wird relational und bundestheologisch offen wiedergegeben; „mein Volk“ ist im modernen Deutschen natürlich.
- source_word: זְכָר נָא
  choice: erinnere dich bitte daran
  rationale: Der Imperativ fordert zum bewussten Erinnern auf; נָא verleiht ihm hier den Ton einer eindringlichen Bitte.
- source_word: מַה יָּעַץ
  choice: was … plante
  rationale: יעץ kann „raten“, „beschließen“ oder „ersinnen“ bedeuten. Im Zusammenhang mit Balaks feindlicher Absicht gibt „plante“ den Sinn klar wieder, ohne die möglichen Nuancen zu verschweigen.
- source_word: בָּלָק מֶלֶךְ מוֹאָב
  choice: Balak, der König von Moab
  rationale: Die Eigennamen folgen der im Deutschen üblichen Form; die Apposition wird idiomatisch mit Artikel wiedergegeben.
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: und was … ihm antwortete
  rationale: Die Wiedergabe behält das hebräische Fragewort „was“ und die direkte Bedeutung von ענה als „antworten“ bei.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam, der Sohn Beors
  rationale: Verwendet die etablierten deutschen Namensformen und gibt das Patronym klar wieder.
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: von Schittim bis Gilgal
  rationale: Beide Ortsnamen werden transliteriert. Die Wendung bleibt syntaktisch abgesetzt, weil ihr genauer Bezug im Hebräischen knapp und nicht vollständig eindeutig ist.
- source_word: לְמַעַן דַּעַת
  choice: damit du … erkennst
  rationale: Der Zwecksatz erhält sein aus der Anrede erschließbares Subjekt in der zweiten Person Singular. „Erkennen“ bezeichnet hier mehr als bloßes Faktenwissen.
- source_word: צִדְקוֹת
  choice: die gerechten Taten
  rationale: Der Plural bezeichnet Jahwes gerechte, bundestreue Handlungen in der Geschichte. Die Formulierung bewahrt den Bezug zur Gerechtigkeit und verengt ihn nicht ausschließlich auf Rettung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der geläufigen deutschen Transkription wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von צִדְקוֹת יְהוָה
  choice: die gerechten Taten Jahwes
  alternative: die rettenden Taten Jahwes; die Gerechtigkeitstaten Jahwes
  rationale: Die Wendung umfasst Jahwes gerechtes und bundestreues Handeln, das in diesem Zusammenhang auch rettenden Charakter hat. „Gerechte Taten“ hält diese Bedeutungsbreite offen.
- issue: Bezug von מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: 'als abgesetzte Erinnerungsangabe: „von Schittim bis Gilgal“'
  alternative: direkter Anschluss an Bileams Antwort oder an das gesamte erinnerte Geschehen
  rationale: Die knappe hebräische Ortsangabe lässt ihren syntaktischen Anschluss offen. Gedankenstriche erhalten diese Spannung, statt sie durch eine erklärende Ergänzung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter persönlicher Anrede. Etablierte deutsche Namensformen werden verwendet. Die Gedankenstriche markieren die knappe und syntaktisch mehrdeutige Ortsangabe; die Fußnoten sichern wesentliche lexikalische und theologische Alternativen.
