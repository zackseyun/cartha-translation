  verdict: revise
  source_fidelity: 'Der Entwurf gibt die hebräischen Verben und Satzglieder zuverlässig wieder: Gottes Herausführen aus Ägypten, Loskauf aus dem Sklavenhaus und das Senden von Mose, Aaron und Mirjam. „Sklavenhaus“ ist als verdichtete Wiedergabe von בֵּית עֲבָדִים vertretbar; „vor dir her“ wahrt die offene räumlich-leitende Nuance von לְפָנֶיךָ.'
  naturalness: Die Mischung aus Perfekt („habe … heraufgeführt“, „erlöst“) und Präteritum („sandte“) innerhalb der eng parallelen Reihe wirkt im modernen Standarddeutsch stilistisch uneinheitlich. Eine einheitliche Perfektreihe ist natürlich und bewahrt zugleich den würdevollen Registerton. Die Fußnote sollte „Haus der Sklaverei“ nicht fälschlich als idiomatischer bezeichnen.
  terminology: „erlöst“ ist für פדה passend und erhält die exodische sowie theologisch gewichtete Sprache, ohne einen bestimmten Loskaufmechanismus einzutragen. Die Namen Mose, Aaron und Mirjam entsprechen dem üblichen modernen deutschen Bibelgebrauch. „Sklavenhaus“ bewahrt den konkreten Statusbezug besser als das traditionelle „Knechtschaft“.
  issues:
