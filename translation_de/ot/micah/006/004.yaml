  text: כִּ֤י הֶעֱלִתִ֨י/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מִ/בֵּ֥ית עֲבָדִ֖ים פְּדִיתִ֑י/ךָ וָ/אֶשְׁלַ֣ח לְ/פָנֶ֔י/ךָ אֶת מֹשֶׁ֖ה אַהֲרֹ֥ן וּ/מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: de
  text: Denn ich habe dich aus dem Land Ägypten heraufgeführt und dich aus dem Sklavenhaus erlöst; und ich habe Mose, Aaron und Mirjam vor dir her gesandt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die vorangehende göttliche Anrede ein und bewahrt den argumentativen Anschluss.
- source_word: הֶעֱלִתִיךָ
  choice: ich habe dich … heraufgeführt
  rationale: Gibt den Hifil von עלה und die geläufige Exodus-Sprache wieder; „heraufgeführt“ bewahrt die Bewegungsrichtung des hebräischen Verbs.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Direkte und natürliche Wiedergabe der Herkunftsangabe.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Bewahrt das konkrete Bild von בֵּית und den Statusbegriff im Plural עֲבָדִים, klingt im Deutschen aber natürlicher als „Haus der Sklaven“.
- source_word: פְּדִיתִיךָ
  choice: dich … erlöst
  rationale: „Erlöst“ wahrt die Loskauf- und Befreiungsbedeutung von פדה sowie dessen Gewicht in der Exodusüberlieferung, ohne über den Vers hinaus zu präzisieren.
- source_word: וָאֶשְׁלַח
  choice: ich sandte
  rationale: Schlichte, würdige Wiedergabe des narrativen Verbs שלח.
- source_word: לְפָנֶיךָ
  choice: vor dir her
  rationale: Gibt die räumliche beziehungsweise leitende Bedeutung der Wendung im Deutschen idiomatisch wieder.
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: Mose, Aaron und Mirjam
  rationale: Bewahrt ausdrücklich alle drei im Hebräischen genannten Führungspersonen; „Mirjam“ entspricht der im modernen deutschen Bibelgebrauch üblichen Namensform.
theological_decisions:
- issue: Wiedergabe von עֲבָדִים in der Exodusformel
  choice: Sklavenhaus
  alternative: Haus der Sklaven; Haus der Sklaverei; Haus der Knechtschaft
  rationale: „Sklavenhaus“ erhält die konkrete Aussage über den versklavten Status, ohne auf das traditionellere und weniger transparente „Knechtschaft“ auszuweichen. Die Fußnote nennt eine stärker abstrakte, idiomatische Alternative.
- issue: Wiedergabe von פדה
  choice: erlöst
  alternative: freigekauft; befreit
  rationale: „Erlöst“ bewahrt die Bedeutung von Loskauf und göttlicher Befreiung sowie die theologische Spannung des Ausdrucks, ohne einen ausdrücklich genannten Kaufpreis vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am hebräischen Parallelismus, wird jedoch durch „vor dir her“ natürlich deutsch formuliert.
