    issue: Uneinheitliche Zeitform in der dreigliedrigen Rückschau
    rationale: Die hebräischen Perfektformen werden im Deutschen am besten in einer konsistenten Vergangenheitsform wiedergegeben. Der Wechsel vom Perfekt zu „ich sandte“ ist zwar verständlich, aber stilistisch weniger glatt.
  - severity: low
    issue: Wertung der Fußnotenalternative als „idiomatischer“
    rationale: „Haus der Sklaverei“ ist eine mögliche erläuternde Alternative, aber im heutigen Deutschen nicht idiomatischer als „Sklavenhaus“. Die Wertung sollte entfallen.
  revised_text: Denn ich habe dich aus dem Land Ägypten heraufgeführt und dich aus dem Sklavenhaus erlöst; und ich habe Mose, Aaron und Mirjam vor dir her gesandt.
