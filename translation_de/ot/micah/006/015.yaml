source:
  edition: WLC
  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: de
  text: Du wirst säen, aber nicht ernten; du wirst Oliven pressen, dich aber nicht mit Öl einreiben; du wirst Most keltern[a], aber keinen Wein trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht wörtlich nur „und Most“; das Verb „pressen/treten“ aus dem vorhergehenden Satzglied ist sinngemäß zu ergänzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: du wirst säen
  rationale: זרע bezeichnet gewöhnlich das Aussäen von Saatgut. „Säen“ bewahrt das landwirtschaftliche Bild und bildet mit „ernten“ ein natürliches Begriffspaar.
- source_word: תִקְצוֹר
  choice: aber nicht ernten
  rationale: קצר ist das übliche Verb für das Ernten beziehungsweise Schneiden des Getreides. „Ernten“ ist im modernen Deutsch natürlicher als „einholen“ und bewahrt den Gegensatz zu „säen“.
- source_word: תִדְרֹךְ זַיִת
  choice: du wirst Oliven pressen
  rationale: דרך bedeutet wörtlich „treten“, bezeichnet hier aber die Verarbeitung von Oliven durch Zertreten oder Pressen. „Oliven pressen“ vermittelt den konkreten Vorgang im heutigen Deutsch klar und natürlich.
- source_word: תָסוּךְ שֶׁמֶן
  choice: dich aber nicht mit Öl salben
  rationale: סוך bezeichnet das Bestreichen oder Salben des Körpers mit Öl. Das reflexive „dich … salben“ bringt zum Ausdruck, dass der Ertrag nicht selbst genutzt werden kann.
- source_word: תִירוֹשׁ
  choice: Most
  rationale: תירוש bezeichnet frischen Wein beziehungsweise Traubenmost. „Most“ wahrt im Deutschen die Unterscheidung zum anschließenden יין („Wein“), ohne den Begriff auf alkoholfreien Traubensaft zu verengen.
- source_word: וְתִירוֹשׁ
  choice: du wirst Most keltern
  rationale: Vor תירוש steht im Hebräischen kein eigenes Verb; das vorherige דרך ist sinngemäß weiterzuführen. „Most keltern“ macht diese Ellipse im Deutschen verständlich und gibt den gemeinten Verarbeitungsvorgang idiomatisch wieder.
- source_word: תִשְׁתֶּה יַיִן
  choice: aber keinen Wein trinken
  rationale: יין ist das gewöhnliche Wort für Wein. „Keinen Wein trinken“ bewahrt den Kontrast zwischen Herstellung und verweigertem Genuss.
- source_word: אַתָּה
  choice: du
  rationale: Das wiederholte ausdrückliche Pronomen betont die direkte Anrede. Im Deutschen wird diese Betonung durch die wiederholte Satzstruktur hinreichend wiedergegeben.
theological_decisions:
- issue: Art des Gerichtsbildes
  choice: Gericht als vergebliche landwirtschaftliche Arbeit und vorenthaltener Genuss des Ertrags
  alternative: Allgemeines Unglück ohne Bezug auf ein Gericht
  rationale: Der Vers beschreibt Arbeit ohne Ernte und Herstellung ohne Genuss. Die Übersetzung bewahrt dieses scharfe Gerichtsbild, ohne seinen theologischen Hintergrund im Text ausdeutend zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Parallelstruktur. „Oliven pressen“ und „Most keltern“ geben die antiken Arbeitsvorgänge verständlich wieder; „Most“ bewahrt die lexikalische Spannung zwischen תירוש und יין.
