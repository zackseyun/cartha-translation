source:
  edition: WLC
  text: עַמִּ֛/י מֶה עָשִׂ֥יתִי לְ/ךָ֖ וּ/מָ֣ה הֶלְאֵתִ֑י/ךָ עֲנֵ֥ה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: de
  text: Mein Volk, was habe ich dir getan? Womit habe ich dich ermüdet[a]? Antworte mir[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Womit habe ich dich belastet?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Antworte gegen mich“ beziehungsweise „Sage gegen mich aus“; dies nimmt den möglichen gerichtlichen Rahmen des Abschnitts auf.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mein Volk
  rationale: Die Anrede mit Suffix der 1. Person Singular wird natürlich und würdevoll als „Mein Volk“ wiedergegeben; sie bewahrt den persönlichen Bundesbezug.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: was habe ich dir getan?
  rationale: Die Formulierung gibt das Fragewort, das Qal-Perfekt der 1. Person Singular und die auf den Angeredeten bezogene Präposition לְ direkt wieder. Das deutsche Perfekt entspricht dem gegenwartsbezogenen Rückblick.
- source_word: וּמָה הֶלְאֵתִיךָ
  choice: Womit habe ich dich ermüdet?
  rationale: 'Das Hifil von לאה hat kausativen Sinn: jemanden müde machen bzw. ermüden. „Womit“ formuliert die durch מָה erfragte Hinsicht idiomatisch und bewahrt den Parallelismus der rhetorischen Fragen.'
- source_word: עֲנֵה בִּי
  choice: Antworte mir!
  rationale: Der Imperativ von ענה fordert das Volk zu einer Erwiderung auf. Zusammen mit בִּי ist „Antworte mir“ im Deutschen die unmittelbarste Lesart; eine forensische Bedeutung bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bundesrechtlicher bzw. gerichtlicher Ton der göttlichen Anrede
  choice: Die direkte persönliche Herausforderung wird im Haupttext ohne ausdrücklich hinzugefügte Gerichtssprache wiedergegeben.
  alternative: „Sage gegen mich aus“ oder „Tritt als Zeuge gegen mich auf“
  rationale: Der weitere Zusammenhang kann als Bundesrechtsstreit verstanden werden, doch עֲנֵה בִּי erzwingt für sich genommen keine ausdrücklich gegnerische oder gerichtliche Wiedergabe. Die Fußnote bewahrt diese echte Deutungsmöglichkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller prophetischer Direktheit. Die kollektive Anrede bleibt entsprechend dem Hebräischen im Singular; die kurzen Fragen und der abschließende Imperativ erhalten ihre rhetorische Schärfe.
