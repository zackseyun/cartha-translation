source:
  edition: WLC
  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: de
  text: Womit soll ich vor Jahwe treten und mich vor Gott in der Höhe beugen?[a] Soll ich mit Brandopfern vor ihn treten, mit einjährigen Kälbern?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem erhabenen Gott“. Wörtlich: „vor Gott der Höhe“.'
    reason: lexikalische Alternative; die hebräische Wendung kann räumlich-bildhaft oder als Aussage über Gottes Erhabenheit verstanden werden.
lexical_decisions:
- source_word: בַּמָּה
  choice: Womit
  rationale: Die knappe Frageform bewahrt den instrumentalen Sinn und klingt im Deutschen natürlich.
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: soll ich vor … treten / Soll ich … vor ihn treten
  rationale: קדם bezeichnet hier das ehrfürchtige Herantreten vor Gott. Die Wiederholung wird zur Wahrung der rhetorischen Struktur beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: אִכַּף
  choice: mich … beugen
  rationale: Die Form bezeichnet eine körperliche Verbeugung beziehungsweise ein Sich-Niederbeugen und wird nicht lediglich als innere Demut gedeutet.
- source_word: לֵאלֹהֵי מָרוֹם
  choice: vor dem Gott in der Höhe
  rationale: Die Wiedergabe erhält die räumlich-erhabene Bildsprache von מָרוֹם, ohne die Wendung eindeutig als festen Titel zu behandeln.
- source_word: בְעוֹלוֹת
  choice: mit Brandopfern
  rationale: Dies ist die übliche deutsche Bezeichnung für עוֹלוֹת; der Plural und die Begleitung beziehungsweise das Mittel des Herantretens bleiben erhalten.
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: mit einjährigen Kälbern
  rationale: Die Altersangabe der Opfertiere wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname.
- issue: Ist מָרוֹם eine Beschreibung oder ein fester Gottestitel?
  choice: dem Gott in der Höhe
  alternative: dem höchsten Gott
  rationale: Die beschreibende Fassung bewahrt die konkrete Höhenmetaphorik und vermeidet es, ohne eindeutigen sprachlichen Anhaltspunkt den festen Titel „der Höchste“ einzusetzen. Die mögliche titulare Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Fragen und die Wiederholung von „vor … treten“ bilden die hebräische Rhetorik ab; „entgegentreten“ wurde vermieden, da es im heutigen Deutsch leicht feindselig klingt.
