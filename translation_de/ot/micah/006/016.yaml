source:
  edition: WLC
  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: de
  text: Man hält sich an die Satzungen Omris und an alle Taten des Hauses Ahab; ihr folgt ihren Ratschlägen, sodass ich dich zur Verwüstung mache und deine Bewohner zum Zischen[a]. Ihr werdet die Schmach meines Volkes tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Pfeifen“; gemeint ist ein verächtliches Zischen oder Pfeifen als Ausdruck des Spottes.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „die gegen mein Volk gerichtete Schmach“ oder „die Schande meines Volkes“. Die knappe hebräische Wendung lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: Man hält sich an
  rationale: Die Nifal-/Imperfektform wird als unpersönliche Aussage verstanden. Die deutsche Formulierung gibt das fortgesetzte Befolgen natürlich wieder, ohne ein bestimmtes Subjekt einzuführen.
- source_word: חֻקּוֹת עָמְרִי
  choice: die Satzungen Omris
  rationale: „Satzungen“ bewahrt den formalen Charakter vorgeschriebener Ordnungen oder königlicher Regelungen.
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: alles, was das Haus Ahabs getan hat
  rationale: Die Wendung gibt מַעֲשֵׂה idiomatisch als Taten beziehungsweise Handlungsweisen wieder und bewahrt den dynastischen Ausdruck „Haus Ahabs“.
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: ihr folgt ihren Ratschlägen
  rationale: „Folgen“ überträgt das hebräische Bild des Wandelns in gegenwärtiges, natürliches Deutsch; „Ratschläge“ kann zugleich Weisungen, Pläne und politische Leitlinien bezeichnen.
- source_word: לְמַעַן תִּתִּי
  choice: Darum mache ich
  rationale: לְמַעַן bezeichnet hier die folgerichtige Verbindung zwischen dem Verhalten und dem angekündigten Gericht. „Darum“ ist im Deutschen klarer als eine missverständliche Zweckangabe, nach der das Volk sündigte, damit Gott es richte.
- source_word: לְשַׁמָּה
  choice: zu einer Stätte des Entsetzens
  rationale: שַׁמָּה kann sowohl Verwüstung als auch das dadurch hervorgerufene Entsetzen bezeichnen. Die Wendung hält beide Aspekte zusammen.
- source_word: לִשְׁרֵקָה
  choice: zum Gegenstand des Spottes
  rationale: Die konkrete Gebärde des verächtlichen Zischens oder Pfeifens wird in der Hauptzeile verständlich übertragen und in der Fußnote erläutert.
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: Ihr werdet die Schmach meines Volkes tragen
  rationale: Die knappe hebräische Genitivverbindung bleibt bewusst weitgehend wörtlich, damit ihre mögliche Zuordnung nicht vorschnell festgelegt wird.
theological_decisions:
- issue: Bezug und Sinn von חֶרְפַּת עַמִּי („die Schmach meines Volkes“)
  choice: die Schmach meines Volkes
  alternative: die gegen mein Volk gerichtete Schmach; die Schande meines Volkes
  rationale: Die hebräische Konstruktverbindung lässt offen, ob es um die Schmach geht, die Gottes Volk trifft, die ihm zugerechnet wird oder die es infolge des Gerichts trägt. Der Haupttext bewahrt diese Spannung; die Fußnote nennt mögliche Verständnisse.
- issue: Zweck- oder Folgebeziehung von לְמַעַן
  choice: Darum mache ich
  alternative: sodass ich dich mache; damit ich dich mache
  rationale: Eine rein finale deutsche Wiedergabe könnte den falschen Eindruck erwecken, das Volk folge Omris Ordnungen mit dem Zweck, von Gott verwüstet zu werden. „Darum“ bringt den im Kontext gerichtlichen Ergebniszusammenhang zum Ausdruck, ohne die Verantwortlichkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede wechselt wie im Hebräischen von kollektivem Singular („dich“, wohl die Stadt beziehungsweise das Gemeinwesen) zum Plural („ihr“). Konkrete, heute leicht missverständliche Bildsprache wird im Haupttext verständlich wiedergegeben und in Fußnoten transparent gemacht.
