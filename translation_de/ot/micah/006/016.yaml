revisions:
- from: Man hält sich an die Satzungen Omris und an alles, was das Haus Ahabs getan hat; ihr folgt ihren Ratschlägen. Darum mache ich dich zu einer Stätte des Entsetzens und ihre Bewohner zum Gegenstand des Spottes[a]. Ihr werdet die Schmach meines Volkes tragen.[b]
  to: Man hält sich an die Satzungen Omris und an alle Taten des Hauses Ahab; ihr folgt ihren Ratschlägen, sodass ich dich zur Verwüstung mache und deine Bewohner zum Zischen[a]. Ihr werdet die Schmach meines Volkes tragen.[b]
  rationale: Die Revision erhält die bewusst nicht aufgelöste Mehrdeutigkeit von „die Schmach meines Volkes“ und die kollektive Anrede. Sie ersetzt eine semantisch zu stark umgedeutete Beschreibung der Verwüstung, stellt den Bezug von „deine Bewohner“ zum angesprochenen Kollektiv her und bewahrt das Bild des Zischens im Haupttext. Die Folgebeziehung wird mit „sodass“ transparent wiedergegeben.
