id: MIC.6.14
reference: Micah 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֤ה תֹאכַל֙ וְ/לֹ֣א תִשְׂבָּ֔ע וְ/יֶשְׁחֲ/ךָ֖ בְּ/קִרְבֶּ֑/ךָ וְ/תַסֵּג֙ וְ/לֹ֣א תַפְלִ֔יט וַ/אֲשֶׁ֥ר תְּפַלֵּ֖ט לַ/חֶ֥רֶב אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: de
  text: Du wirst essen, aber nicht satt werden, und deine Leere wird in dir bleiben[a]. Du wirst etwas fortschaffen, aber nichts retten; und was du rettest, werde ich dem Schwert preisgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Sie kann auch bedeuten: „Deine Erniedrigung wird in deiner Mitte sein“ oder: „Dein Sinken wird in deinem Inneren sein.“'
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: du wirst essen
  rationale: Das Qal-Imperfekt 2. Person Singular bezeichnet im Gerichtswort eine angekündigte Handlung.
- source_word: תִשְׂבָּע
  choice: nicht satt werden
  rationale: שׂבע bezeichnet das Sattwerden beziehungsweise Gesättigtsein und bildet hier den direkten Gegensatz zum Essen.
- source_word: יֶשְׁחֲךָ
  choice: deine Leere wird … bleiben
  rationale: Die seltene und schwierige Form lässt mehrere Deutungen zu. Im Zusammenhang von Essen ohne Sättigung gibt „Leere“ den naheliegenden Sinn wieder; „wird bleiben“ macht die im Hebräischen knappe Fügung im Deutschen verständlich, ohne die Unsicherheit zu verschweigen.
- source_word: בְּקִרְבֶּךָ
  choice: in dir
  rationale: קֶרֶב kann die Mitte oder das Innere bezeichnen. „In dir“ ist hier natürlich und wahrt den Gedanken einer inneren Not.
- source_word: תַסֵּג
  choice: du wirst etwas fortschaffen
  rationale: Die Form kann ein Wegbewegen, Entfernen oder Fortschaffen bezeichnen. Die Übersetzung lässt das im Hebräischen unausgesprochene Objekt unbestimmt und passt zum anschließenden erfolglosen Rettungsversuch.
- source_word: תַפְלִיט / תְּפַלֵּט
  choice: retten / rettest
  rationale: Die beiden Formen von פלט werden einheitlich wiedergegeben, damit die Wiederholung und der Gegensatz zwischen misslungener und scheinbar gelungener Rettung erhalten bleiben.
- source_word: לַחֶרֶב
  choice: dem Schwert
  rationale: Die traditionelle prophetische Metonymie bezeichnet gewaltsamen Tod im Krieg und bleibt im Deutschen verständlich.
- source_word: אֶתֵּן
  choice: werde ich … preisgeben
  rationale: „Preisgeben“ gibt נתן in dieser Verbindung idiomatisch wieder und bewahrt die ausdrückliche göttliche Urheberschaft des Gerichts.
theological_decisions:
- issue: Deutung von וְיֶשְׁחֲךָ בְּקִרְבֶּךָ
  choice: innere Leere beziehungsweise fortbestehender Hunger als Gericht
  alternative: Erniedrigung in deiner Mitte oder ein Sinken beziehungsweise Siechtum in deinem Inneren
  rationale: Der unmittelbare Zusammenhang spricht von Essen ohne Sättigung und von endgültigem Verlust. „Leere“ passt dazu, doch wegen der lexikalisch unsicheren Form werden andere mögliche Deutungen in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Zukunftssätze bewahren den eindringlichen Rhythmus des Gerichtswortes; die schwierige Wendung wird im Haupttext verständlich wiedergegeben und in der Fußnote als unsicher ausgewiesen.
