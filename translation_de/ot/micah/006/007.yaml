source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: de
  text: Wird Jahwe an Tausenden von Widdern Gefallen haben, an Zehntausenden von Bächen aus Öl[a]? Soll ich für mein Vergehen meinen Erstgeborenen hingeben, für die Sünde meiner Seele die Frucht meines Leibes[b][c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die Wendung auch mit „an Myriaden von Ölbächen“ wiedergegeben werden. Das Bild bezeichnet eine unermessliche Menge Öl.
    reason: lexical_alternative
  - marker: b
    text: „Die Frucht meines Leibes“ ist eine hebräische Redewendung für das eigene Kind beziehungsweise die eigene Nachkommenschaft.
    reason: idiom_explanation
  - marker: c
    text: 'Oder: „als Sündopfer für meine Seele“. Das hebräische Wort kann sowohl „Sünde“ als auch „Sündopfer“ bedeuten; der Parallelismus mit „mein Vergehen“ spricht hier eher für „Sünde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: Wird ... Gefallen haben
  rationale: Die rhetorische Frage mit רצה fragt, ob Jahwe an solchen Gaben Gefallen findet beziehungsweise sie wohlwollend annimmt. Die Formulierung ist natürlich und bewahrt den wertenden Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאַלְפֵי אֵילִים
  choice: an Tausenden von Widdern
  rationale: Bei der Wendung ‚Gefallen haben an‘ verlangt natürliches Deutsch die Präposition ‚an‘; אֵילִים bezeichnet im Opferzusammenhang Widder.
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: an Zehntausenden von Bächen voll Öl
  rationale: רִבְבוֹת bezeichnet eine riesige Zahl, während נַחֲלֵי das Bild von Bächen oder Wasserläufen liefert. Die Wiedergabe erhält die anschauliche Übertreibung.
- source_word: הַאֶתֵּן
  choice: Soll ich ... hingeben
  rationale: Die zweite rhetorische Frage steigert die erste. ‚Hingeben‘ passt zur erschreckenden Vorstellung eines Opfers, ohne dessen Billigung anzudeuten.
- source_word: בְּכוֹרִי
  choice: meinen Erstgeborenen
  rationale: Das Hebräische nennt den Erstgeborenen, ohne das Wort ‚Sohn‘ ausdrücklich hinzuzufügen.
- source_word: פִּשְׁעִי
  choice: mein Vergehen
  rationale: פשע kann Übertretung oder Auflehnung bezeichnen. ‚Vergehen‘ ist in modernem Deutsch verständlich und behält hier die moralische Schwere bei.
- source_word: פְּרִי בִטְנִי
  choice: die Frucht meines Leibes
  rationale: Die konkrete hebräische Redewendung für das eigene Kind beziehungsweise die Nachkommenschaft bleibt erhalten, ohne das Geschlecht der sprechenden Person festzulegen.
- source_word: חַטַּאת נַפְשִׁי
  choice: die Sünde meines Lebens
  rationale: חַטָּאת bezeichnet hier im Parallelismus wahrscheinlich die Sünde; נֶפֶשׁ kann das eigene Leben beziehungsweise die eigene Person meinen. ‚Meines Lebens‘ ist im Deutschen verständlicher als das missverständliche ‚meiner Seele‘, lässt aber die enge persönliche Zuordnung erkennen.
theological_decisions:
- issue: Ob חַטַּאת als „Sünde“ oder „Sündopfer“ zu verstehen ist
  choice: Sünde
  alternative: Sündopfer
  rationale: Der Parallelismus mit „mein Vergehen“ spricht eher für den abstrakten moralischen Sinn. Da die kultische Bedeutung lexikalisch möglich bleibt, wird sie in einer Fußnote genannt.
- issue: Ob die Fragen eine Billigung übermäßiger Opfer oder eines Kinderopfers nahelegen
  choice: Die rhetorische Steigerung unverändert wiedergeben, ohne Zustimmung anzudeuten
  alternative: Die Aussage durch eine erklärende Verneinung im Haupttext abschwächen
  rationale: Der Vers führt die angebotenen Opfer bis zu einer entsetzlichen äußersten Möglichkeit. Die Frageform bewahrt die Spannung; eine eingefügte Verneinung würde dem folgenden Kontext vorgreifen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen und ihre schockierende Steigerung bleiben erhalten. Konkrete Opferbilder werden nicht verflacht; altertümliche oder unnötig konfessionell geprägte Formulierungen werden vermieden.
