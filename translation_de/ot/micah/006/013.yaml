  text: וְ/גַם אֲנִ֖י הֶחֱלֵ֣יתִי הַכּוֹתֶ֑/ךָ הַשְׁמֵ֖ם עַל חַטֹּאתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/013.yaml
  text: Therefore I too have begun to strike you[a], making you desolate because of your sins.
translation:
  language: de
  text: Darum habe auch ich begonnen, dich zu schlagen[a] und dich wegen deiner Sünden zu verwüsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe dich krank gemacht, indem ich dich schlug.« Das hebräische Verb kann auch bedeuten, jemanden krank oder schwach zu machen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְגַם
  choice: Darum ... auch
  rationale: Die Verbindung führt die angekündigte Gerichtsfolge weiter und hebt zugleich hervor, dass nun auch Gott selbst handelt. »Darum« gibt den Folgerungszusammenhang wieder, »auch« bewahrt die additive Betonung.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt zur Hervorhebung des göttlichen Handelnden erhalten.
- source_word: הֶחֱלֵיתִי
  choice: habe begonnen
  rationale: 'Der Hifil von חלה kann ein Krank- oder Schwachmachen bezeichnen, in Verbindung mit dem folgenden Infinitiv jedoch auch inzeptiv verstanden werden: »beginnen, jemanden zu schlagen«. Diese syntaktisch gut passende Lesart steht im Haupttext; die echte lexikalische Alternative wird in der Fußnote bewahrt.'
- source_word: הַכּוֹתֶךָ
  choice: dich zu schlagen
  rationale: Der Infinitiv von נכה mit Suffix der 2. Person Singular bezeichnet hier das strafende Schlagen. »Schlagen« ist gegenwärtig, verständlich und nicht archaisch.
- source_word: הַשְׁמֵם
  choice: dich ... zu verwüsten
  rationale: Der Hifil von שמם bezeichnet das Herbeiführen von Verwüstung. Die koordinierte deutsche Infinitivkonstruktion gibt die enge Verbindung mit dem begonnenen Gerichtshandeln flüssig wieder.
- source_word: עַל
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund des Gerichts.
- source_word: חַטֹּאתֶךָ
  choice: deiner Sünden
  rationale: Der Plural entspricht den mehrfachen, zuvor genannten Verfehlungen und klingt im Deutschen natürlich.
theological_decisions:
- issue: Art des göttlichen Gerichtshandelns in הֶחֱלֵיתִי הַכּוֹתֶךָ
  choice: 'inzeptiv: »habe begonnen, dich zu schlagen«'
  alternative: 'kausativ: »habe dich krank/geschwächt gemacht, indem ich dich schlug«'
  rationale: Die Konstruktion erlaubt sowohl eine inzeptive als auch eine kausative Deutung. Der Haupttext folgt der syntaktisch naheliegenden inzeptiven Lesart, ohne die mögliche Aussage von Krankheit oder Schwächung als Wirkung göttlicher Schläge zu verdrängen; diese bleibt ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular und die Schärfe der Gerichtssprache bleiben erhalten; archaische Wörter wie »schlagen« im Sinne von »zerschmettern« oder konfessionell geprägte Zusätze werden vermieden.
