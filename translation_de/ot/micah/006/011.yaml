base_translation:
  language: en
  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: de
  text: Sollte ich jemanden mit betrügerischen Waagen und einem Beutel falscher Gewichte für unschuldig erklären?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kann ich rein sein bei betrügerischen Waagen und einem Beutel falscher Gewichte?« Das hebräische Verb kann »rein sein« oder »als unschuldig gelten beziehungsweise jemanden für unschuldig erklären« bedeuten; der Zusammenhang spricht eher für den forensischen Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »Steine des Betrugs«; gemeint sind Gewichtssteine, die beim Handel verwendet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶזְכֶּה
  choice: Sollte ich jemanden für unschuldig erklären
  rationale: Das Qal-Imperfekt von זכה mit Fragepartikel kann »rein sein« oder im forensischen Sinn »für unschuldig gelten/erklären« ausdrücken. Im Zusammenhang der Bundesanklage ist die forensische Wiedergabe am plausibelsten; das nicht ausdrücklich genannte Objekt wird im Deutschen mit »jemanden« ergänzt.
- source_word: בְּמֹאזְנֵי רֶשַׁע
  choice: der betrügerische Waagen ... besitzt
  rationale: מֹאזְנַיִם bezeichnet Handelswaagen; רֶשַׁע trägt eine starke moralische Wertung. »Betrügerische Waagen« gibt im Deutschen sowohl die Ungerechtigkeit als auch den konkreten Handelsbetrug natürlich wieder. Die hebräische ב-Konstruktion wird kontextgemäß als Besitz beziehungsweise Gebrauch verstanden.
- source_word: וּבְכִיס
  choice: und einen Beutel ... besitzt
  rationale: כִּיס ist ein Beutel oder eine Tasche, hier der Beutel eines Händlers für Gewichtssteine. »Beutel« ist präzise und allgemein verständlich.
- source_word: אַבְנֵי מִרְמָה
  choice: falschen Gewichten
  rationale: Wörtlich steht »Steine des Betrugs«. Gemeint sind Gewichtssteine, deren falscher Wert Käufer oder Verkäufer täuscht. »Falsche Gewichte« bezeichnet dies im modernen Deutschen klar; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Subjekt und Sinn der rhetorischen Frage
  choice: Gott fragt, ob er einen Menschen mit betrügerischen Handelsmitteln für unschuldig erklären sollte.
  alternative: Der Sprecher fragt, ob er selbst trotz betrügerischer Waagen rein sein könne.
  rationale: Im Zusammenhang von Micha 6 spricht der HERR als Ankläger seines Volkes. Daher liegt der forensische Sinn von זכה nahe. Da die hebräische Form jedoch auch »rein sein« erlauben kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und ihre moralisch-forensische Schärfe bleiben erhalten. Die Ergänzung »jemanden« schafft natürliches Deutsch, ohne die in der Fußnote dokumentierte grammatische Mehrdeutigkeit zu verdecken.
