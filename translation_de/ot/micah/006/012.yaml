  language: en
  yaml_path: translation/ot/micah/006/012.yaml
  text: whose rich men are full of violence[a], and her inhabitants speak lies; their tongue is deceitful in their mouth.
translation:
  language: de
  text: deren Reiche voller Gewalttat[a] sind und deren Bewohner Lügen reden; ihre Zunge ist Trug in ihrem Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Gewalttat, Unterdrückung oder gewaltsames Unrecht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: deren
  rationale: Das Relativpartikel knüpft an die zuvor angesprochene Stadt an; „deren“ gibt die Zugehörigkeit der Reichen und Bewohner natürlich wieder.
- source_word: עֲשִׁירֶיהָ
  choice: deren Reiche
  rationale: Der maskuline Plural mit femininem Suffix bezeichnet die wohlhabenden Angehörigen beziehungsweise Eliten der Stadt. „Reiche“ bewahrt die grammatische Form, ohne den Begriff unnötig einzuengen.
- source_word: מָלְאוּ חָמָס
  choice: voller Gewalttat sind
  rationale: Die Wendung beschreibt einen von חָמָס bestimmten Zustand. „Gewalttat“ erfasst sowohl konkrete Gewalt als auch gewaltsames Unrecht und klingt im Deutschen natürlicher als eine streng wörtliche Konstruktion mit „füllen“.
- source_word: וְיֹשְׁבֶיהָ
  choice: und deren Bewohner
  rationale: Das substantivierte Partizip bezeichnet kollektiv die Menschen, die in der Stadt wohnen.
- source_word: דִּבְּרוּ שָׁקֶר
  choice: Lügen reden
  rationale: Das Perfekt steht in der prophetischen Anklage für kennzeichnendes Verhalten. Das Präsens gibt diesen Sinn im Deutschen angemessen wieder; „Lügen reden“ bleibt nahe am hebräischen Ausdruck.
- source_word: וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶם
  choice: ihre Zunge ist Trug in ihrem Mund
  rationale: Die nominale Aussage und das konkrete Bild von Zunge und Mund werden bewusst bewahrt. „Trug“ deckt den Sinnbereich von Täuschung, Betrug und Falschheit ab.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Bindung an die hebräische Bildsprache. Der zweite Halbvers bleibt bewusst markant und leicht fremdartig, damit die nominale Aussage „die Zunge ist Trug“ nicht zu einer bloßen Umschreibung abgeschwächt wird.
