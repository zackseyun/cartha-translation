source:
  edition: WLC
  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: de
  text: Die Völker werden es sehen und sich all ihrer Macht schämen[a]. Sie werden die Hand auf den Mund legen[b]; ihre Ohren werden taub werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden wegen all ihrer Macht beschämt werden.“ Die hebräische Wendung kann Scham im Blick auf ihre Macht oder aufgrund ihrer Macht ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Die Hand auf den Mund zu legen ist eine Geste des Schweigens, der Bestürzung oder der Unterwerfung.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Ihre Ohren werden verschlossen sein“ beziehungsweise „ihre Ohren werden stumpf werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: werden es sehen
  rationale: Das Qal-Imperfekt von ראה bezeichnet Sehen oder Wahrnehmen. Das ergänzte „es“ ist im Deutschen idiomatisch und verweist im Zusammenhang auf Gottes zuvor beschriebenes Handeln.
- source_word: גוֹיִם
  choice: die Völker
  rationale: גּוֹיִם bezeichnet hier die fremden Völker im geopolitischen Sinn; „Völker“ ist daher treffender als eine religiös eingeengte Wiedergabe.
- source_word: וְיֵבֹשׁוּ
  choice: und sich … schämen
  rationale: בוש im Qal drückt Scham oder Beschämung aus. Die reflexive deutsche Form ist natürlich und lässt offen, ob der Akzent stärker auf innerer Scham oder öffentlicher Beschämung liegt.
- source_word: מִכֹּל גְּבוּרָתָם
  choice: all ihrer Macht
  rationale: Die Präposition מִן kann hier Beziehung oder Ursache ausdrücken. „Sich all ihrer Macht schämen“ bewahrt die knappe Formulierung und die Spannung, ob ihre Macht Gegenstand oder Anlass ihrer Scham ist.
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: Sie werden die Hand auf den Mund legen
  rationale: Die Bildrede wird mit dem idiomatischen Singular „die Hand“ bewahrt; die Geste kann Schweigen, Bestürzung oder Unterwerfung anzeigen.
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: ihre Ohren werden taub werden
  rationale: חרשׁ bezeichnet bei Ohren das Taub- oder Unhörbarwerden. Die Wiedergabe erhält das körperliche Bild, ohne es vorschnell als bloße Redensart aufzulösen.
