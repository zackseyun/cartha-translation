id: MIC.7.7
reference: Micah 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: de
  text: Ich aber will nach Jahwe Ausschau halten; ich will auf den Gott meines Heils warten.[a] Mein Gott wird mich hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich will auf den Gott meines Heils hoffen“. Das hebräische Verb kann sowohl erwartungsvolles Warten als auch Hoffen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen zusammen mit der Konjunktion hebt den Gegensatz zur zuvor geschilderten menschlichen Unzuverlässigkeit hervor. „Ich aber“ gibt diesen Kontrast im Deutschen knapp und natürlich wieder.
- source_word: בַּיהוָה אֲצַפֶּה
  choice: will nach Jahwe Ausschau halten
  rationale: צפה bezeichnet ein aufmerksames, erwartungsvolles Ausschauen. Die Verbindung „nach … Ausschau halten“ bewahrt das anschauliche Bild und gibt die Präposition idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אוֹחִילָה
  choice: will … warten
  rationale: יחל kann sowohl Warten als auch Hoffen ausdrücken. „Warten“ passt zum vorausgehenden erwartungsvollen Ausschauen; die ebenfalls mögliche Hoffnungsnuance bleibt in der Fußnote erhalten.
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: auf den Gott meines Heils
  rationale: Die Formulierung bewahrt die hebräische Genitivverbindung und ihre poetisch-theologische Dichte. „Heil“ umfasst hier Rettung und bewahrendes Eingreifen Gottes.
- source_word: יִשְׁמָעֵנִי
  choice: wird mich hören
  rationale: שמע bedeutet grundlegend „hören“ beziehungsweise „zuhören“. „Erhören“ oder „antworten“ würde die im Gebetszusammenhang mögliche positive Reaktion ausdrücklicher machen, als es der Wortlaut verlangt.
- source_word: אֱלֹהָי
  choice: Mein Gott
  rationale: Die persönliche Zugehörigkeit und das Vertrauensbekenntnis bleiben erhalten; die deutsche Satzstellung setzt die Bezeichnung natürlich an den Anfang des Schlussglieds.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsspannweite von אוֹחִילָה
  choice: warten im Haupttext, hoffen als Fußnotenalternative
  alternative: hoffen; erwartungsvoll warten
  rationale: Das Verb kann erwartungsvolles Warten und Hoffen verbinden. Der Haupttext wählt wegen des parallelen Bildes vom Ausschauhalten „warten“, ohne die Hoffnungsnuance auszuschließen; die Fußnote macht sie ausdrücklich sichtbar.
- issue: Bedeutung von יִשְׁמָעֵנִי im Gebetskontext
  choice: wird mich hören
  alternative: wird mich erhören; wird mir antworten
  rationale: Der Zusammenhang kann ein wirksames Hören Gottes nahelegen, doch das Verb selbst sagt zunächst „hören“. Die offenere Wiedergabe vermeidet eine stillschweigende Ausdeutung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Rhythmus. „Ausschau halten“ bewahrt das konkrete Bild; „Gott meines Heils“ trägt den gehobenen biblisch-poetischen Ton, bleibt aber verständlich. Die parallelen Willenssätze geben die entschlossene Erwartung des hebräischen Textes wieder.
