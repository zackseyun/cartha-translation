  terminology: „Jahwe“ gibt den Gottesnamen יהוה konsistent als Namen wieder. „Heil“ bewahrt die offene, theologisch gewichtige Bedeutung von יֵשַׁע; „hören“ bleibt gegenüber stärker deutenden Alternativen neutral. Die Fußnote wahrt sachgerecht die Hoffnungsnuance von יחל.
