  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: de
  text: Vertraut keinem Nächsten[a]; verlasst euch auf keinen engen Vertrauten[b]. Selbst vor der Frau, die an deiner Brust liegt[c], hüte die Tore deines Mundes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freund« beziehungsweise »Mitmensch«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vertrauten Freund« beziehungsweise »engen Gefährten«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »der an deiner Brust liegenden Frau«; die Wendung bezeichnet eine äußerst intime Lebensgemeinschaft, wahrscheinlich die eigene Frau.'
    reason: cultural_note
  - marker: d
    text: Das Hebräische wechselt hier von der Mehrzahl (»vertraut«, »verlasst euch«) zur Einzahl (»deiner«, »deines«).
    reason: textual_clarification
lexical_decisions:
- source_word: רֵעַ
  choice: Nächster
  rationale: Das Wort bezeichnet einen Menschen in naher sozialer Beziehung und kann je nach Zusammenhang »Nächster«, »Mitmensch« oder »Freund« bedeuten. »Nächster« bewahrt hier die größere Bedeutungsbreite und die Steigerung zum engeren Vertrauten im zweiten Satzteil.
- source_word: אַלּוּף
  choice: enger Vertrauter
  rationale: Gemeint ist hier kein Anführer, sondern ein vertrauter, eng verbundener Gefährte. »Enger Vertrauter« gibt die persönliche Nähe wieder und unterscheidet den Ausdruck vom vorangehenden רֵעַ.
- source_word: תַּאֲמִינוּ
  choice: vertraut
  rationale: Der Hifil von אמן mit ב bezeichnet, dass man sein Vertrauen auf jemanden setzt; »vertrauen« ist daher treffender als »glauben«.
- source_word: תִּבְטְחוּ
  choice: verlasst euch
  rationale: בטח bezeichnet vertrauensvolle Zuversicht beziehungsweise das Sichverlassen auf jemanden. Die Formulierung wahrt den synonymen Parallelismus, ohne das gleiche deutsche Verb zu wiederholen.
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: Vor der Frau, die an deiner Brust liegt
  rationale: Die Wendung bezeichnet wörtlich eine Frau, die am Busen beziehungsweise an der Brust des Angesprochenen liegt, und damit eine äußerst intime häusliche Beziehung. Das vorangestellte מִן wird als Trennung oder Zurückhaltung gegenüber dieser Person wiedergegeben.
- source_word: שְׁמֹר
  choice: hüte
  rationale: Der Imperativ fordert zu sorgfältiger Bewahrung und Kontrolle auf. »Hüte« verbindet den warnenden Ton natürlich mit dem bildhaften Objekt »Tore deines Mundes«.
- source_word: פִּתְחֵי פִיךָ
  choice: die Tore deines Mundes
  rationale: Die wörtliche Metapher von den »Toren/Öffnungen des Mundes« wird bewahrt; sie beschreibt anschaulich die Kontrolle dessen, was man sagt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der unvermittelte Wechsel von der Anrede im Plural zur Einzahl wird entsprechend dem Hebräischen beibehalten. Die Bildsprache der »Tore des Mundes« bleibt bewusst erhalten.
