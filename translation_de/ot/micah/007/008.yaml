  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: de
  text: Freu dich nicht über mich[a], meine Feindin! Auch wenn ich gefallen bin[b], werde ich wieder aufstehen. Wenn ich in der Finsternis sitze, ist Jahwe mein Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht schadenfroh über mich“. Das hebräische Verb bedeutet „sich freuen“; „schadenfroh sein“ verdeutlicht den feindseligen Zusammenhang, deutet aber stärker.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräischen Verbformen für „fallen“ und „aufstehen“ stehen beide im Perfekt: wörtlich etwa „Ich bin gefallen, ich bin aufgestanden“. Im poetischen Zusammenhang kann die zweite Form die künftige Wiederherstellung als gewiss darstellen; daher wird auch übersetzt: „Obwohl ich gefallen bin, werde ich wieder aufstehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמְחִי
  choice: Freu dich nicht
  rationale: Die Verneinung אַל mit der Verbform drückt ein Verbot aus. „Sich freuen“ bewahrt den Grundsinn von שׂמח; „schadenfroh sein“ wäre kontextuell möglich, aber stärker deutend.
- source_word: אֹיַבְתִּי
  choice: meine Feindin
  rationale: Die hebräische Anrede steht ausdrücklich im femininen Singular mit Suffix der 1. Person Singular; die deutsche feminine Form erhält diese grammatische Kennzeichnung.
- source_word: לִי
  choice: über mich
  rationale: Nach einem Verb des Sichfreuens bezeichnet ל hier das Ziel feindlicher Freude; „über mich“ ist im Deutschen idiomatisch.
- source_word: כִּי נָפַלְתִּי קָמְתִּי
  choice: Bin ich gefallen, stehe ich wieder auf
  rationale: Die asyndetische poetische Gegenüberstellung beschreibt den Fall und die zuversichtlich erwartete beziehungsweise als gewiss dargestellte Umkehr. Die deutsche Konditionalkonstruktion gibt den Zusammenhang natürlich wieder, ohne die hebräischen Perfektformen schematisch gleichzusetzen.
- source_word: אֵשֵׁב בַּחֹשֶׁךְ
  choice: Sitze ich auch in der Finsternis
  rationale: ישׁב wird bildhaft und konkret mit „sitzen“ wiedergegeben; „auch“ markiert den im Kontext naheliegenden konzessiven Sinn, während „Finsternis“ den poetisch-gewichtigen Gegensatz zum Licht wahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אוֹר לִי
  choice: ist Jahwe mein Licht
  rationale: Die prädikative Lichtmetapher und die persönliche Beziehung, die לִי ausdrückt, werden im Deutschen knapp und natürlich als „mein Licht“ formuliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. „Jahwe“ bewahrt den Namenscharakter, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Zeitliche beziehungsweise aspektuelle Deutung von קָמְתִּי
  choice: stehe ich wieder auf
  alternative: bin ich aufgestanden / werde ich aufstehen
  rationale: Die hebräische Perfektform kann in der prophetisch-poetischen Zuversicht die Umkehr als gewiss darstellen. Das deutsche Präsens in der allgemeinen Konditionalkonstruktion erhält diese Gewissheit, ohne ausschließlich Vergangenheit oder Zukunft festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. „Feindin“ erhält das feminine Singular des Hebräischen. „Finsternis“ trägt den gehobenen poetischen Gegensatz zu „Licht“, ohne altertümlich zu wirken.
