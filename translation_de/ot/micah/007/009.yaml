source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: de
  text: Den Zorn Jahwes werde ich tragen, denn ich habe gegen ihn gesündigt, bis er meinen Rechtsstreit führt und mir Recht verschafft. Er wird mich ans Licht herausführen; ich werde seine Gerechtigkeit[a] sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein gerechtes Handeln“. Das hebräische Wort kann sowohl Gerechtigkeit als auch Recht schaffendes Handeln bezeichnen, besonders in einem gerichtlichen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: den Zorn Jahwes
  rationale: זַעַף bezeichnet heftigen, berechtigten Zorn. „Zorn“ ist im Deutschen klar, würdig und trägt hier die moralisch-gerichtliche Färbung. Der Gottesname יְהוָה wird in seiner im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: אֶשָּׂא
  choice: werde ich tragen
  rationale: נשׂא bedeutet hier, eine Last oder die Folgen einer Schuld zu tragen. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: כִּי חָטָאתִי לוֹ
  choice: denn ich habe gegen ihn gesündigt
  rationale: כִּי begründet das Tragen des Zorns; חטא mit ל bezeichnet hier den, gegen den sich die Sünde richtet.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem das Tragen des göttlichen Zorns endet.
- source_word: יָרִיב רִיבִי
  choice: er meinen Rechtsstreit führt
  rationale: 'Verb und stammverwandtes Substantiv bilden eine forensische Wendung: Jahwe nimmt den Rechtsfall der Sprecherin beziehungsweise des Sprechers auf und führt ihn.'
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: und mir Recht verschafft
  rationale: מִשְׁפָּט meint im Zusammenhang nicht nur ein Urteil, sondern die gerichtliche Rechtsentscheidung zugunsten der sprechenden Person. „Recht verschaffen“ gibt diese Vindikation natürlich wieder.
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: Er wird mich hinaus ans Licht führen
  rationale: Die Hifilform von יצא ist kausativ („hinausführen“). „Ans Licht“ bewahrt das Bild des Hervortretens aus Dunkelheit und Bedrängnis.
- source_word: אֶרְאֶה
  choice: ich werde ... sehen
  rationale: Die schlichte Bedeutung „sehen“ ist im Deutschen natürlich und lässt offen, ob das Wahrnehmen wörtlich oder bildlich gemeint ist.
- source_word: בְּצִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit und Recht schaffendes Handeln bezeichnen. „Gerechtigkeit“ erhält die breite Bedeutung; die gerichtliche Nuance wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בְּצִדְקָתוֹ im Zusammenhang gerichtlicher Rechtfertigung
  choice: seine Gerechtigkeit
  alternative: wie er Recht schafft
  rationale: Der Zusammenhang ist forensisch, doch צְדָקָה hat einen weiteren Bedeutungsumfang als bloße richterliche Entscheidung. Der Haupttext bewahrt mit „Gerechtigkeit“ diese Weite; die Fußnote hält die rechtsschaffende Nuance ausdrücklich fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit erhaltener poetischer Bildsprache und klar erkennbarer Gerichtsszene. Die Satzstellung „Den Zorn Jahwes werde ich tragen“ hebt wie im Hebräischen die zu tragende Größe hervor. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
