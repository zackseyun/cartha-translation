base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: de
  text: 'Mit beiden Händen sind sie darauf aus, Böses gut zu tun[a]: Der Fürst verlangt, der Richter urteilt gegen Bestechungsgeld[b], und der Mächtige äußert, was seine Seele begehrt. So verflechten sie es miteinander[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Hände sind auf das Böse gerichtet, um es geschickt zu tun.“ „Beide Hände“ betont ihren ganzen Einsatz und ihr Können im Unrechttun.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische ist knapp: „der Richter in/für Zahlung“. Es kann bedeuten, dass der Richter Bezahlung verlangt oder dass er gegen Bestechungsgeld Recht spricht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „So verdrehen sie es miteinander.“ Das Bild bezeichnet abgestimmte Korruption, als würden sie ihre Machenschaften miteinander verflechten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  choice: Auf das Böse sind beide Hände aus
  rationale: Die schwierige Wendung bezeichnet tatkräftige, uneingeschränkte Beteiligung am Bösen. „Beide Hände“ gibt den Dual כַּפַּיִם wieder und betont den vollen Einsatz.
- source_word: לְהֵיטִיב
  choice: um es gut zu machen
  rationale: 'Die wörtlich-nahe Wiedergabe bewahrt die bittere Ironie: Im Bösen zeigen sie Können.'
- source_word: הַשַּׂר שֹׁאֵל
  choice: Der Fürst fordert
  rationale: שַׂר bezeichnet einen Herrscher oder hohen Amtsträger. Im korrupten Zusammenhang hat שׁאל eher den Nachdruck von „fordern“ als von einer unverbindlichen Bitte.
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: und der Richter ist für Bezahlung
  rationale: Die elliptische Formulierung des Hebräischen bleibt erhalten. שִׁלּוּם bezeichnet eine Zahlung und kann im Zusammenhang als Bestechungsgeld verstanden werden.
- source_word: וְהַגָּדוֹל
  choice: der Mächtige
  rationale: Das substantivierte Adjektiv bezeichnet hier eine gesellschaftlich einflussreiche, hochgestellte Person; „der Mächtige“ ist im Deutschen natürlicher als „der große Mann“.
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: spricht aus, wonach ihn verlangt
  rationale: Die Wendung lässt die Spannung zwischen Begehren und verderblicher Absicht stehen. Die idiomatische Form vermeidet eine unnötige Festlegung auf eine bestimmte Art des Verlangens.
- source_word: וַיְעַבְּתוּהָ
  choice: So verflechten sie es miteinander
  rationale: Das Verb עבת vermittelt das Bild des Verwindens oder Verflechtens. Gemeint ist offenbar das abgestimmte Zusammenwirken der korrupten Beteiligten.
theological_decisions:
- issue: Bezug und moralische Färbung von הַוַּת נַפְשׁוֹ
  choice: wonach ihn verlangt
  alternative: das verderbliche Verlangen seiner Seele
  rationale: Der Zusammenhang macht das Verlangen korrupt, doch die knappe Übersetzung bewahrt die lexikalische Mehrdeutigkeit, ohne eine bestimmte innere Sünde einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bildhafter Nähe zum Hebräischen. Die elliptische Aussage über den Richter und die Mehrdeutigkeit des Verlangens werden nicht stillschweigend aufgelöst; schwer verständliche Alternativen stehen in den Fußnoten.
