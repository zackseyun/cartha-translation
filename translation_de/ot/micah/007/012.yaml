reference: Micah 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: de
  text: 'An jenem Tag wird man zu dir kommen: aus Assyrien und den Städten Ägyptens[a], von Ägypten bis zum Strom[b], von Meer zu Meer und von Berg zu Berg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort מָצוֹר kann hier auch „Festung“, „Belagerung“ oder „befestigte Stadt beziehungsweise Städte“ bedeuten, statt als Bezeichnung für Ägypten verstanden zu werden.
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Strom“ ist wahrscheinlich der Euphrat gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: An jenem Tag
  rationale: Die prophetische Zeitangabe wird im modernen Standarddeutsch natürlich und würdevoll wiedergegeben.
- source_word: וְעָדֶ֣יךָ יָב֔וֹא
  choice: wird man zu dir kommen
  rationale: Das Verb steht im Hebräischen im Singular, während die folgenden Herkunftsangaben eine kollektive Ankunft nahelegen. Das unpersönliche „man“ bewahrt den Singular und gibt zugleich den kollektiven Sinn idiomatisch wieder; das Suffix der 2. Person Singular bleibt als „zu dir“ erhalten.
- source_word: לְמִנִּ֥י אַשּׁ֖וּר
  choice: aus Assyrien
  rationale: Die Präposition bezeichnet den Ausgangspunkt; אַשּׁוּר ist der geläufige Ortsname Assyrien.
- source_word: וְעָרֵ֣י מָצ֑וֹר
  choice: und den Städten Ägyptens
  rationale: מָצוֹר wird im geografischen Parallelismus als Bezeichnung für Ägypten verstanden. Die reale Möglichkeit, das Wort als „Festung“ beziehungsweise „befestigte Städte“ zu deuten, wird in einer Fußnote erhalten.
- source_word: וּלְמִנִּ֤י מָצוֹר֙
  choice: von Ägypten
  rationale: Auch hier legt die Reihe geografischer Bezeichnungen nahe, מָצוֹר als Ägypten zu verstehen.
- source_word: וְעַד נָהָ֔ר
  choice: bis zum Strom
  rationale: Der absolut gebrauchte Ausdruck bezeichnet im biblischen geopolitischen Sprachgebrauch wahrscheinlich den Euphrat. „Strom“ bewahrt jedoch die knappe Ausdrucksweise des Hebräischen.
- source_word: וְיָ֥ם מִיָּ֖ם
  choice: von Meer zu Meer
  rationale: Die deutsche Wendung gibt die räumliche Spannweite der hebräischen Formulierung knapp und idiomatisch wieder.
- source_word: וְהַ֥ר הָהָֽר
  choice: und von Berg zu Berg
  rationale: Die ergänzte Präposition verdeutlicht im Deutschen die Parallelität zu „von Meer zu Meer“, ohne die Aussage inhaltlich einzuengen.
theological_decisions:
- issue: Bezug des singularischen Verbs יָבֹוא bei mehreren Herkunftsgebieten
  choice: 'Unpersönlich-kollektiv: „wird man zu dir kommen“'
  alternative: „wird er zu dir kommen“ oder kollektiv „werden sie zu dir kommen“
  rationale: Die Singularform wird nicht stillschweigend in einen grammatischen Plural umgewandelt; zugleich lässt „man“ offen, ob die Ankommenden als Kollektiv gedacht sind. So wird kein einzelner Bote oder eine bestimmte messianische Gestalt in den Text hineingelesen.
- issue: Bedeutung von מָצוֹר
  choice: Ortsbezeichnung für Ägypten
  alternative: „Festung“, „Belagerung“ oder „befestigte Stadt/Städte“
  rationale: Der Zusammenhang mit Assyrien und dem Strom spricht für eine geografische Deutung. Da die gemeinnominale Bedeutung sprachlich möglich bleibt, wird sie ausdrücklich in der Fußnote genannt.
- issue: Identität von נָהָר („Strom“)
  choice: Im Haupttext allgemein „Strom“, mit wahrscheinlichem Bezug auf den Euphrat in der Fußnote
  alternative: Explizit „Euphrat“ im Haupttext
  rationale: Dies wahrt die knappe hebräische Bezeichnung und informiert zugleich über ihren wahrscheinlich gemeinten geografischen Bezug.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die geografische Reihung bleibt knapp; „man“ wahrt die singularische Verbform und ermöglicht zugleich eine kollektive Lesart.
