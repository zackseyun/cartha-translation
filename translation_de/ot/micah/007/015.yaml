  terminology: „Land Ägypten“, „auszogst“ und „Wundertaten“ sind terminologisch stimmig. Die Fußnote erläutert die grammatische Singularform und die mögliche kollektive Referenz sachlich, ohne die Ambiguität auszulegen oder konfessionell festzulegen.
