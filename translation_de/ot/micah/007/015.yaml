  text: כִּ/ימֵ֥י צֵאתְ/ךָ֖ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אַרְאֶ֖/נּוּ נִפְלָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
translation:
  language: de
  text: Wie in den Tagen, als du aus dem Land Ägypten auszogst, werde ich ihm[a] Wundertaten zeigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen“. Das hebräische Suffix steht im Singular („ihm“), kann sich hier aber kollektiv auf Israel beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּימֵי
  choice: Wie in den Tagen
  rationale: Die Präposition כְּ leitet einen Vergleich mit einer vergangenen Zeit ein. „Wie in den Tagen“ bewahrt die Vergleichsform und den feierlichen Ton.
- source_word: צֵאתְךָ
  choice: als du … auszogst
  rationale: Der Infinitiv mit Suffix der 2. Person Singular bezeichnet das Herausgehen des Angesprochenen. Ein temporaler Nebensatz klingt im Deutschen natürlich; „ausziehen“ entspricht zudem dem geläufigen Exodus-Sprachgebrauch.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe erhält sowohl אֶרֶץ als auch den Eigennamen und bleibt näher an der vollständigen hebräischen Wendung als das kürzere „aus Ägypten“.
- source_word: אַרְאֶנּוּ
  choice: werde ich ihm … zeigen
  rationale: Der Hifil von ראה bedeutet hier „sehen lassen, zeigen“. Das Suffix ist grammatisch maskulin Singular; bei deutschem „zeigen“ wird die Person idiomatisch mit dem Dativ „ihm“ bezeichnet.
- source_word: נִפְלָאוֹת
  choice: Wundertaten
  rationale: Das Wort bezeichnet außergewöhnliche, Staunen hervorrufende Taten. „Wundertaten“ passt zum Exodus-Kontext, ohne den Ausdruck auf eine bestimmte Art von Wunder festzulegen.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in אַרְאֶנּוּ
  choice: Den grammatischen Singular mit „ihm“ im Haupttext bewahren; wahrscheinlich ist Israel beziehungsweise Jakob als kollektive Einheit gemeint.
  alternative: „ihnen“ als sinngemäße Wiedergabe des Volkes Israel.
  rationale: Die hebräische Form ist Singular. Der Haupttext bewahrt daher die grammatische Spannung, während die Fußnote auf die mögliche kollektive Bedeutung hinweist, ohne sie verbindlich festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt quellennah, ohne im Deutschen unnatürlich zu wirken; die Numerusspannung des hebräischen Suffixes wird nicht stillschweigend aufgelöst.
