id: MIC.7.19
reference: Micah 7:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: de
  text: Er wird sich wieder über uns erbarmen; er wird unsere Schuld bezwingen. Du wirst[a] alle ihre Sünden[b] in die Tiefen des Meeres werfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text wechselt hier unerwartet von „Er wird“ zur direkten Anrede: „Du wirst werfen.“ Einige alte Textzeugen und Übersetzungen gleichen den Wechsel zu „und er wird werfen“ aus.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen steht „ihre Sünden“. Viele Übersetzungen geben „unsere Sünden“ wieder und gleichen die Formulierung damit an „unsere Schuld“ im ersten Satz an.
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב
  choice: wieder
  rationale: 'In Verbindung mit dem folgenden finiten Verb bezeichnet שׁוב hier idiomatisch die Wiederholung: Gott wird sich erneut erbarmen. „Wieder“ gibt dies im Deutschen natürlich wieder.'
- source_word: יְרַחֲמֵנוּ
  choice: sich über uns erbarmen
  rationale: רחם bezeichnet tiefes Mitgefühl und barmherzige Zuwendung. Die gewählte Formulierung ist würdevoll, verständlich und im Deutschen idiomatisch.
- source_word: יִכְבֹּשׁ
  choice: bezwingen
  rationale: כבש bedeutet unterwerfen oder unter Kontrolle bringen. „Bezwingen“ bewahrt das Bild eines entschiedenen Sieges über die Schuld, ohne zusätzliche Bildelemente wie Füße oder Zertreten einzuführen.
- source_word: עֲוֺנֹתֵינוּ
  choice: unsere Schuld
  rationale: עון kann sowohl schuldhaftes Vergehen als auch die daraus erwachsende Schuld bezeichnen. Das kollektive „unsere Schuld“ klingt im modernen Deutsch natürlich und wahrt zugleich den Unterschied zum folgenden חטאת, „Sünden“.
- source_word: וְתַשְׁלִיךְ
  choice: Du wirst … werfen
  rationale: Die masoretische Form ist zweite Person Singular maskulin und wechselt damit von der Rede über Gott zur unmittelbaren Anrede Gottes. Die Übersetzung bewahrt diesen auffälligen Wechsel.
- source_word: בִּמְצֻלוֹת יָם
  choice: in die Tiefen des Meeres
  rationale: מצולות bezeichnet tiefe Stellen, besonders Meerestiefen. Die Formulierung erhält das eindrückliche Bild vollständiger Entfernung.
- source_word: כָּל
  choice: alle
  rationale: Die umfassende Aussage des hebräischen Wortes wird unmittelbar wiedergegeben.
- source_word: חַטֹּאותָם
  choice: ihre Sünden
  rationale: Der masoretische Text hat ein Suffix der dritten Person Plural („ihre“), nicht der ersten Person Plural („unsere“). Die Übersetzung erhält diese unerwartete Verschiebung.
theological_decisions:
- issue: Wechsel der Person und des pronominalen Bezugs im Vers
  choice: 'Die masoretischen Wechsel werden beibehalten: zunächst dritte Person („Er wird“), dann direkte Anrede („Du wirst“) und schließlich dritte Person Plural („ihre Sünden“).'
  alternative: 'Harmonisierte Wiedergabe: „Er wird sich wieder über uns erbarmen; er wird unsere Schuld bezwingen und alle unsere Sünden in die Tiefen des Meeres werfen.“'
  rationale: Die Wechsel sind im überlieferten hebräischen Text tatsächlich vorhanden. Sie werden nicht stillschweigend ausgeglichen, damit die textliche Spannung und die unmittelbare Gebetsanrede erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die auffälligen Personen- und Suffixwechsel des masoretischen Textes bleiben im Haupttext sichtbar; die Fußnoten erläutern die verbreiteten Harmonisierungen.
