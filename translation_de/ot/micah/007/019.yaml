  source_fidelity: 'Die Übersetzung gibt die Abfolge und die auffälligen Wechsel des masoretischen Textes präzise wieder: חוזר/יָשׁוּב als Wiederholung, Erbarmen über „uns“, Bezwingen der „unseren Schuld“ und danach die direkte Anrede „Du wirst“ mit dem abschließenden Bezug „ihre Sünden“. Die Pluralform עֲוֺנֹתֵינוּ wird durch das im Deutschen mögliche Kollektivsingular „unsere Schuld“ vertretbar wiedergegeben; der Kontrast zu „Sünden“ bleibt erhalten.'
  naturalness: Modernes, würdiges und idiomatisches Standarddeutsch. „Sich über uns erbarmen“, „Schuld bezwingen“ und „in die Tiefen des Meeres werfen“ sind klar und dem prophetischen Register angemessen. Der Wechsel von „Er“ zu „Du“ ist absichtlich textbedingt und wird verständlich erläutert.
