  text: אַ֣לְלַי לִ֗/י כִּ֤י הָיִ֨יתִי֙ כְּ/אָסְפֵּי קַ֔יִץ כְּ/עֹלְלֹ֖ת בָּצִ֑יר אֵין אֶשְׁכּ֣וֹל לֶ/אֱכ֔וֹל בִּכּוּרָ֖ה אִוְּתָ֥ה נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: de
  text: 'Weh mir![a] Mir geht es wie nach dem Einsammeln des Sommerobsts, wie nach der Nachlese bei der Weinernte: Keine Traube ist da, die man essen könnte, keine Frühfeige[b], nach der ich mich sehne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ach, wehe mir!“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „etwas zuerst Reifendes“; wahrscheinlich ist die besonders geschätzte frühe Feige gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: Weh mir!
  rationale: Die Wendung ist ein eindringlicher Klageruf. „Weh mir!“ bewahrt seine Kraft und den gehobenen Ton, ohne im heutigen Deutsch unverständlich zu sein.
- source_word: כִּי הָיִיתִי
  choice: Mir geht es
  rationale: Das Perfekt von היה beschreibt hier den eingetretenen, nun bestehenden Zustand des Sprechers. Die deutsche Wendung gibt diesen Zustand natürlich wieder; ein wörtliches „ich bin geworden“ wäre zusammen mit den folgenden Erntebildern schwerfällig.
- source_word: כְאָסְפֵּי קַיִץ
  choice: wie nach dem Einsammeln des Sommerobsts
  rationale: Die nominale Form kann die Einsammlung beziehungsweise den Zustand nach dem Einsammeln bezeichnen. Im Parallelismus mit der Nachlese und angesichts des anschließenden Mangels steht die abgeerntete Situation im Vordergrund.
- source_word: כְעֹלְלֹת בָּצִיר
  choice: wie nach der Nachlese bei der Weinernte
  rationale: עֹלְלֹת bezeichnet das Nachlesen beziehungsweise das nach der eigentlichen Lese Verbliebene. Die Formulierung hält das Weinlesebild fest und macht die erfolglose Suche nach Resten verständlich.
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכֹל
  choice: Keine Traube ist da, die man essen könnte
  rationale: אֶשְׁכּוֹל bezeichnet eine Traube beziehungsweise ein Traubenbüschel. Im Deutschen ist „Traube“ im Zusammenhang mit der Weinernte natürlich und eindeutig.
- source_word: בִּכּוּרָה
  choice: Frühfeige
  rationale: Das Wort bedeutet wörtlich etwas zuerst Reifendes und bezeichnet im einschlägigen Sprachgebrauch wahrscheinlich die besonders geschätzte frühe Feige. „Frühfeige“ gibt den wahrscheinlichen Bezug knapp wieder, während die Fußnote die lexikalische Offenheit nennt.
- source_word: אִוְּתָה נַפְשִׁי
  choice: nach der ich mich sehne
  rationale: נֶפֶשׁ bezeichnet hier die begehrende Person beziehungsweise ihr Verlangen. Die idiomatische Wiedergabe vermeidet ein im Deutschen missverständliches „meine Seele begehrt“, ohne die Intensität des Verlangens abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Erntevergleiche werden als Bilder der bereits abgeernteten, erfolglos abgesuchten Felder wiedergegeben. So bleibt der Parallelismus natürlich, ohne die unsichere Nominalform einseitig auf Erntearbeiter festzulegen.
