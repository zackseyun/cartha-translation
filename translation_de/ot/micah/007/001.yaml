  terminology: „Sommerobst“, „Nachlese“, „Weinernte“ und „Frühfeige“ passen zum landwirtschaftlichen Bild und zum Register. Die Erläuterung zu Frühfeige bewahrt mit „wahrscheinlich“ die lexikalische Unsicherheit angemessen.
