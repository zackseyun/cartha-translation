  text: מִי אֵ֣ל כָּמ֗וֹ/ךָ נֹשֵׂ֤א עָוֺן֙ וְ/עֹבֵ֣ר עַל פֶּ֔שַׁע לִ/שְׁאֵרִ֖ית נַחֲלָת֑/וֹ לֹא הֶחֱזִ֤יק לָ/עַד֙ אַפּ֔/וֹ כִּֽי חָפֵ֥ץ חֶ֖סֶד הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: de
  text: Wer ist ein Gott wie du, der dem Rest seines Erbteils die Schuld wegnimmt und über seine Auflehnung hinweggeht[a]? Er hält nicht für immer an seinem Zorn fest, denn er hat Gefallen an treuer Liebe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der dem Rest seines Erbteils Schuld vergibt und seine Auflehnung verzeiht“. Das Hebräische lautet bildhafter: „der Schuld trägt und über Auflehnung hinweggeht“.'
    reason: lexical_alternative
  - marker: b
    text: „Treue Liebe“ übersetzt das hebräische חֶסֶד. Der Ausdruck kann auch mit „Güte“, „Barmherzigkeit“ oder „Bundestreue“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: Wer ist ein Gott wie du
  rationale: Die rhetorische Frage bringt Gottes Unvergleichlichkeit zum Ausdruck und bewahrt zugleich die prädikative Wendung mit אֵל.
- source_word: נֹשֵׂא עָוֹן
  choice: der Schuld wegnimmt
  rationale: נשׂא bedeutet grundsätzlich „tragen, heben, wegnehmen“ und bezeichnet in dieser Verbindung Vergebung. „Schuld wegnimmt“ bewahrt das konkrete Bild, ohne im Deutschen fälschlich nahezulegen, Gott sei selbst schuldig.
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: und über die Auflehnung … hinweggeht
  rationale: Die Formulierung erhält das Bild von עבר על. „Auflehnung“ gibt den rebellischen Beiklang von פֶּשַׁע deutlicher wieder als das allgemeinere „Sünde“.
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: des Restes seines Erbteils
  rationale: „Rest“ bewahrt den prophetisch bedeutsamen Ausdruck שְׁאֵרִית; „Erbteil“ bezeichnet hier Gottes ihm zugehöriges Volk. Die deutsche Genitivkonstruktion ordnet Schuld und Auflehnung verständlich den Begünstigten der Vergebung zu.
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: Er hält nicht für immer an seinem Zorn fest
  rationale: „An seinem Zorn festhalten“ gibt das Festhalten oder Bewahren von חזק idiomatisch wieder; אַף wird seiner übertragenen Bedeutung entsprechend mit „Zorn“ übersetzt.
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: denn er hat Gefallen an treuer Liebe
  rationale: חפץ bezeichnet Gefallen oder Freude. „Treue Liebe“ hält bei חֶסֶד sowohl den Aspekt liebevoller Güte als auch den der beständigen Verbundenheit offen.
theological_decisions:
- issue: Bedeutungsfülle von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: „Treue Liebe“ verbindet Zuwendung und Beständigkeit, ohne den Ausdruck ausschließlich auf Mitleid oder auf eine ausgearbeitete Bundestheologie festzulegen.
- issue: Unterscheidung von עָוֹן und פֶּשַׁע
  choice: Schuld … Auflehnung
  alternative: Sünde … Vergehen
  rationale: 'Die Übersetzung erhält die unterschiedlichen Akzente: עָוֹן kann Schuld samt ihrer Belastung bezeichnen, während פֶּשַׁע häufig vorsätzlichen Bruch oder Auflehnung ausdrückt.'
- issue: Bildsprache in נשׂא עָוֹן und עבר על פשע
  choice: Schuld wegnehmen und über Auflehnung hinweggehen
  alternative: Schuld und Auflehnung vergeben
  rationale: Die konkreten hebräischen Bilder bleiben erkennbar, während die deutsche Formulierung nicht behauptet, Gott trage eigene Schuld. Die Fußnote nennt die glattere Vergebungsformulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Eröffnung und die hebräische Bildsprache bleiben erhalten; ungewöhnliche Bilder werden durch Fußnoten erschlossen. „Erbteil“ und „Rest“ bewahren die prophetische und gemeinschaftsbezogene Ausdrucksweise.
