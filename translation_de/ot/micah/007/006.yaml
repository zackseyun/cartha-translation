  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: de
  text: Denn der Sohn behandelt seinen Vater mit Verachtung[a], die Tochter erhebt sich gegen ihre Mutter, die Schwiegertochter gegen ihre Schwiegermutter. Die Feinde eines Mannes sind die Menschen seines eigenen Hauses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entehrt seinen Vater“. Das hebräische Verb kann bedeuten, jemanden verächtlich oder schändlich zu behandeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Männer seines Hauses“. Gemeint sein können die Angehörigen seines Haushalts insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Klage und verbindet den Vers im Deutschen natürlich mit seinem Kontext.
- source_word: בֵן מְנַבֵּל אָב
  choice: der Sohn behandelt seinen Vater mit Verachtung
  rationale: Der generische Singular wird mit dem im Deutschen möglichen bestimmten Artikel wiedergegeben; das Piel-Partizip von נבל bezeichnet eine fortdauernde Haltung oder Handlung, durch die der Vater verächtlich behandelt und entehrt wird.
- source_word: בַּת קָמָה בְאִמָּהּ
  choice: die Tochter erhebt sich gegen ihre Mutter
  rationale: קום mit adversativem ב bezeichnet hier feindseliges Auftreten gegen jemanden. „Erhebt sich gegen“ bewahrt das anschauliche Bild, ohne es vorschnell als förmliche Rebellion zu bestimmen.
- source_word: כַּלָּה בַּחֲמֹתָהּ
  choice: die Schwiegertochter gegen ihre Schwiegermutter
  rationale: Im familiären Zusammenhang bezeichnen כַּלָּה und חֲמוֹת eindeutig Schwiegertochter und Schwiegermutter. Das Prädikat „erhebt sich“ ist aus dem vorigen Satzteil zu ergänzen.
- source_word: אֹיְבֵי אִישׁ
  choice: die Feinde eines Mannes
  rationale: Die ausdrücklich maskuline, generisch-repräsentative Form אִישׁ bleibt erhalten.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: die Menschen seines eigenen Hauses
  rationale: Wörtlich steht „die Männer seines Hauses“; אַנְשֵׁי בֵיתוֹ kann jedoch idiomatisch die Angehörigen des Haushalts insgesamt bezeichnen. „Menschen seines eigenen Hauses“ wahrt die Haus-Metapher und vermeidet eine sachlich möglicherweise zu enge Beschränkung auf männliche Personen.
theological_decisions:
- issue: Geschlechtsspezifische Sprache für den Haushalt
  choice: „eines Mannes“ bleibt maskulin, während אַנְשֵׁי בֵיתוֹ idiomatisch als „die Menschen seines eigenen Hauses“ wiedergegeben wird.
  alternative: „Die Feinde eines Mannes sind die Männer seines eigenen Hauses.“
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann. Die Konstruktverbindung אַנְשֵׁי בֵיתוֹ kann dagegen trotz ihrer grammatisch maskulinen Form sämtliche Hausangehörigen meinen, wie auch die zuvor genannten weiblichen Familienmitglieder zeigen. Die Übersetzung erhält diese Spannung, statt den Haushalt unnötig auf Männer einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die zugespitzte Schlussaussage bleiben erhalten; „eigenen“ bringt die im Possessivsuffix liegende schmerzhafte Nähe idiomatisch zur Geltung.
