id: MIC.7.2
reference: Micah 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: de
  text: Der Treue ist aus dem Land[a] verschwunden, und unter den Menschen gibt es keinen Aufrichtigen. Sie alle lauern auf Blut; jeder jagt seinen Bruder[b] mit einem Netz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von der Erde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: seinen Bruder; damit kann auch ein anderer Angehöriger der Gemeinschaft gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: mit einer Schlinge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: ist verschwunden
  rationale: Das Qal Perfekt bezeichnet den eingetretenen Verlust. „Ist verschwunden“ gibt im Deutschen den klagenden Befund natürlich wieder, ohne zwingend festzulegen, ob der Treue getötet wurde oder auf andere Weise nicht mehr vorhanden ist.
- source_word: חָסִיד
  choice: der Treue
  rationale: Das Wort bezeichnet einen Menschen, der von Treue, loyaler Hingabe und Frömmigkeit geprägt ist. „Der Treue“ bewahrt den repräsentativen Singular und vermeidet eine konfessionell verengte Deutung.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Im Zusammenhang der prophetischen Gesellschaftskritik ist das konkrete „Land“ am wahrscheinlichsten; die weitere Bedeutung „Erde“ bleibt in einer Fußnote erhalten.
- source_word: וְיָשָׁר
  choice: keinen Aufrichtigen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen moralisch rechtschaffenen Menschen. Die Formulierung ist idiomatisch und bewahrt den Singular.
- source_word: בָּאָדָם
  choice: unter den Menschen
  rationale: אָדָם ist hier generisch und meint Menschen beziehungsweise die Menschheit, nicht ausschließlich Männer.
- source_word: אָיִן
  choice: gibt es keinen
  rationale: Gibt die hebräische Existenzverneinung in natürlichem Deutsch wieder.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Bewahrt die ausdrückliche Gesamtheit und leitet flüssig zu den pluralischen Tätern über.
- source_word: לְדָמִים
  choice: auf Blut
  rationale: Der Plural „Blute“ bezeichnet gewaltsames Blutvergießen. „Auf Blut lauern“ erhält die knappe und drastische Bildsprache.
- source_word: יֶאֱרֹבוּ
  choice: lauern
  rationale: Das Verb beschreibt das versteckte Warten auf ein Opfer beziehungsweise einen Hinterhalt.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird hier distributiv gebraucht und hebt die Verantwortung jedes Einzelnen hervor.
- source_word: אָחִיהוּ
  choice: seinen Bruder
  rationale: Die wörtliche Wiedergabe verstärkt das Motiv des Verrats innerhalb der Gemeinschaft; die mögliche weitere Bedeutung wird in der Fußnote erläutert.
- source_word: יָצֹדוּ
  choice: jagt
  rationale: Das Verb bezeichnet Jagen oder Fangen. „Jagt“ bewahrt das Raubtier- und Jagdbild und passt zum distributiven Subjekt „jeder“.
- source_word: חֵרֶם
  choice: mit einem Netz
  rationale: Das Substantiv bezeichnet hier ein Fangnetz; die instrumentale Wiedergabe ergibt sich aus dem Zusammenhang des Jagens.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: unter den Menschen
  alternative: unter der Menschheit; unter den Männern
  rationale: Der Ausdruck bezieht sich allgemein auf Menschen. Die gewählte Form ist geschlechtsgenau, natürlich und erweitert den Aussagebereich nicht über den hebräischen Text hinaus.
- issue: Bedeutungsumfang von אָחִיהוּ
  choice: seinen Bruder
  alternative: seinen Mitmenschen; seinen Volksgenossen
  rationale: Die konkrete Verwandtschafts- und Gemeinschaftssprache bleibt im Haupttext erhalten. Zugleich wird nicht ausgeschlossen, dass „Bruder“ hier ein Mitglied derselben Gemeinschaft bezeichnet.
- issue: Art des Verschwindens des חָסִיד
  choice: ist verschwunden
  alternative: ist zugrunde gegangen; ist nicht mehr da
  rationale: אָבַד kann Untergang oder Verlust bezeichnen. Die Übersetzung bewahrt die Klage über sein völliges Fehlen, ohne ausdrücklich festzulegen, ob Tod oder gesellschaftliches Verschwinden gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Schärfe. Die Parallelstruktur und die Jagdbilder des Hebräischen bleiben erhalten; ungebräuchliche oder unnötig konfessionelle Begriffe werden vermieden.
