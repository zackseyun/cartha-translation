base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: de
  text: 'Dann wird meine Feindin sehen, und Scham wird sie bedecken – sie, die zu mir sagte: »Wo ist Jahwe, dein Gott?« Meine Augen werden sie sehen. Nun wird sie wie Schlamm auf den Straßen zertreten werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתֵרֶא אֹיַבְתִּי
  choice: Dann wird meine Feindin es sehen
  rationale: Das Qal-Imperfekt setzt die erwartete Abfolge fort. Das grammatische Femininum wird im Deutschen mit »Feindin« sichtbar gemacht; »es« nimmt sinngemäß das zuvor geschilderte rettende Eingreifen auf, das im Hebräischen als Objekt unausgesprochen bleibt.
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: und Scham wird sie bedecken
  rationale: Die personifizierende Bildsprache des Hebräischen bleibt in einer natürlichen deutschen Form erhalten.
- source_word: הָאֹמְרָה אֵלַי
  choice: sie, die zu mir sagte
  rationale: Das substantivierte feminine Partizip kennzeichnet die Feindin durch ihren früheren Spott.
- source_word: אַיּוֹ יְהוָה אֱלֹהָיִךְ
  choice: Wo ist Jahwe, dein Gott?
  rationale: Die direkte Spottfrage sowie der feminine Singular der Anrede werden bewahrt; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: Meine Augen werden sie ansehen
  rationale: Das ausdrücklich genannte Subjekt »meine Augen« bleibt erhalten. »Ansehen« gibt das beobachtende, im Kontext auch Genugtuung ausdrückende Sehen wieder, ohne diesen Unterton auszudeuten.
- source_word: עַתָּה תִּהְיֶה לְמִרְמָס
  choice: Nun wird sie zertreten werden
  rationale: Die Konstruktion mit לְמִרְמָס bezeichnet sie als dem Zertreten preisgegeben. Die passive deutsche Form gibt das Ergebnis klar und idiomatisch wieder.
- source_word: כְּטִיט חוּצוֹת
  choice: wie Schlamm auf den Straßen
  rationale: Die verächtliche Vorstellung von Straßenschlamm, der unter die Füße gerät, wird direkt bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. Die Transliteration »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der weiblichen Feindgestalt
  choice: Feindin
  alternative: Feind
  rationale: Nomen, Verben und Pronomen stehen im Hebräischen im Femininum. Die Übersetzung hält diese Textgestalt fest, ohne die Feindin ausdrücklich mit einer bestimmten Stadt oder Macht gleichzusetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper prophetischer Bildkraft. Das Femininum der Gegnerin und die ausdrücklich genannten »Augen« bleiben erhalten. Die Zeichensetzung macht den eingeschobenen Rückbezug auf die spottende Feindin verständlich.
