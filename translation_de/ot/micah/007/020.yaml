source:
  edition: WLC
  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: de
  text: Du wirst Jakob Treue erweisen und Abraham beständige Liebe, die du unseren Vätern seit den Tagen der Vorzeit geschworen hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת
  choice: Treue
  rationale: Im Zusammenhang mit Gottes Verheißungen bezeichnet אֱמֶת verlässliche, wahrhaftige Bundestreue; „Treue“ gibt dies im Deutschen natürlich wieder.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Verlässlichkeit und Dauer. „Beständige Liebe“ bewahrt diese Dimensionen, ohne den Ausdruck konfessionell zu verengen.
- source_word: מִימֵי קֶדֶם
  choice: seit den Tagen der Vorzeit
  rationale: Die Wendung bezeichnet eine weit zurückliegende Zeit und wird in würdigem, verständlichem Deutsch nah an der hebräischen Bildsprache wiedergegeben.
theological_decisions:
- issue: Bezug des Relativsatzes אֲשֶׁר נִשְׁבַּעְתָּ
  choice: „die du unseren Vätern … geschworen hast“ lässt den Rückbezug im Deutschen offen genug, um die zugesagte Treue und Liebe als Inhalt des Eides zu verstehen.
  alternative: „wie du unseren Vätern … geschworen hast“
  rationale: Das hebräische אֲשֶׁר ist ein Relativwort und nicht ausdrücklich ein Vergleichswort. Die gewählte Form bleibt näher am Wortlaut und vermeidet eine unnötige Auflösung der syntaktischen Spannung.
- issue: Identität von Jakob, Abraham und den Vätern
  choice: Die Namen und „unsere Väter“ werden unverändert als kollektive heilsgeschichtliche Bezeichnungen wiedergegeben.
  alternative: Explizite Umschreibung als Volk Israel oder Patriarchen
  rationale: Der Ausgangstext erklärt diese Beziehungen nicht näher; eine Ausdeutung würde zusätzliche theologische Information importieren.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus: „Jakob … Abraham“, „Treue … beständige Liebe“. Die direkte Anrede Gottes bleibt wie im Hebräischen erhalten.'
