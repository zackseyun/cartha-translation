  terminology: „Treue“ für אֱמֶת und „beständige Liebe“ für חֶסֶד sind kontextgerecht, theologisch nicht unnötig festgelegt und im Deutschen verständlich. Die Eigennamen sowie „unsere Väter“ sind korrekt und ohne interpretierende Ergänzung wiedergegeben.
