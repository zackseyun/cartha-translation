base_translation:
  language: en
  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: de
  text: Ein Tag zum Bau deiner Mauern! An jenem Tag wird die Grenze weit entfernt liegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »An jenem Tag wird die Satzung fern sein.« Das hebräische Wort kann »Grenze/Begrenzung« oder »Satzung/Festsetzung« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: Ein Tag
  rationale: Die knappe, elliptische prophetische Ankündigung wird bewahrt; »Ein Tag kommt« wäre deutlicher, fügte aber ein im Hebräischen nicht vorhandenes Verb hinzu.
- source_word: לִ/בְנ֣וֹת
  choice: deine Mauern zu bauen
  rationale: Die Präposition ל mit dem Infinitiv von בנה bezeichnet hier Zweck oder Bestimmung. »Zu bauen« gibt die Form knapp wieder; »wieder aufzubauen« wäre im Zusammenhang plausibel, ist aber im Verb selbst nicht ausdrücklich enthalten.
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: deine Mauern
  rationale: גדר bezeichnet umschließende Mauern oder Abgrenzungen. »Mauern« passt zum Wiederherstellungsbild, ohne die Bedeutung auf militärische Befestigungen einzuengen.
- source_word: י֥וֹם הַ/ה֖וּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitangabe wird in natürlichem, würdigem Deutsch wiedergegeben und nimmt den zuvor genannten Tag auf.
- source_word: יִרְחַק
  choice: wird … weit entfernt sein
  rationale: רחק bedeutet »fern sein« oder »sich entfernen«. Die Wiedergabe wahrt den resultativen Sinn, ohne eine handelnde Instanz hinzuzufügen.
- source_word: חֹֽק
  choice: die Grenze
  rationale: חֹק kann eine Grenze oder Festsetzung, aber auch eine Verfügung beziehungsweise Satzung bezeichnen. Im unmittelbaren Bildfeld von Mauern und Wiederherstellung ist »Grenze« kontextuell stimmig; die echte lexikalische Alternative wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von חֹק im Schlusssatz
  choice: räumliche Grenze oder Begrenzung
  alternative: Verfügung, Erlass oder Satzung
  rationale: 'Das Bild vom Bau der Mauern legt eine räumliche Lesart nahe: Die bisherige Begrenzung liegt künftig weit entfernt. Da חֹק ebenso eine rechtliche oder obrigkeitliche Festsetzung bezeichnen kann, wird diese nicht ausgeschlossen, sondern in einer Fußnote genannt.'
translation_notes:
  register: Knappe, feierliche prophetische Sprache in modernem Standarddeutsch. Der Ausruf bewahrt die Ellipse des Hebräischen; die Wortwahl bleibt verständlich und vermeidet eine ausdrückliche Ergänzung wie »kommt« oder das kontextuell mögliche, aber lexikalisch nicht zwingende »wiederaufzubauen«.
