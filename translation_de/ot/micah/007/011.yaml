  naturalness: »Ein Tag, deine Mauern zu bauen!« ist im modernen Standarddeutsch keine natürliche elliptische Konstruktion. »Ein Tag zum Bau deiner Mauern!« bewahrt die knappe Ausrufsform und ist idiomatisch. Für die zweite Aussage ist »weit entfernt liegen« bei einer räumlichen Grenze klarer und natürlicher als »weit entfernt sein«.
