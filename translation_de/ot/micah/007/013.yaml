base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: de
  text: Doch das Land[a] wird zur Einöde werden wegen seiner Bewohner, wegen der Frucht ihrer Taten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische Wort אֶרֶץ kann „Land“ oder „Erde“ bedeuten; im unmittelbaren Gerichtskontext passt „Land“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von der Frucht ihrer Taten“. „Frucht“ ist ein hebräisches Bild für die Folgen, die ihr Handeln hervorbringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird … werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang futurische Bedeutung; „wird … werden“ bringt den Übergang in den verwüsteten Zustand zum Ausdruck.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im unmittelbaren Gerichtskontext bezeichnet „Land“ am ehesten das betroffene Gebiet, ohne die weitere Möglichkeit zu verschweigen.
- source_word: לִשְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen Zustand schwerer Verwüstung. „Zur Einöde“ wahrt die nominale Ausdrucksweise und klingt in modernem, würdigem Deutsch natürlich.
- source_word: עַל יֹשְׁבֶיהָ
  choice: wegen seiner Bewohner
  rationale: עַל bezeichnet hier den Grund des Gerichts, während יֹשְׁבֶיהָ die Menschen meint, die in dem Land wohnen.
- source_word: מִפְּרִי
  choice: wegen der Frucht
  rationale: Die Präposition מִן führt hier die Ursache beziehungsweise den daraus hervorgehenden Grund an. „Frucht“ bewahrt das hebräische Bild für die Folgen des Handelns.
- source_word: מַעַלְלֵיהֶם
  choice: ihrer Taten
  rationale: Das Wort bezeichnet Handlungen mit moralischem Gewicht; „Taten“ ist knapp, verständlich und dem Gerichtskontext angemessen.
theological_decisions:
- issue: Kausale Struktur des Gerichts
  choice: Die Verwüstung des Landes wird sowohl mit seinen Bewohnern als auch mit der Frucht ihrer Taten begründet.
  alternative: 'Die zweite Wendung könnte enger als Herkunftsangabe wiedergegeben werden: „aus der Frucht ihrer Taten“.'
  rationale: Das Hebräische reiht zwei kausale Wendungen aneinander. Die zweimalige Wiedergabe mit „wegen“ macht den Zusammenhang im Deutschen verständlich, ohne die moralische Ursache des Gerichts über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Die Satzstruktur bleibt knapp und bewahrt durch „Frucht ihrer Taten“ das konkrete hebräische Bild; die genuine Mehrdeutigkeit von אֶרֶץ wird in einer Fußnote erhalten.
