source:
  edition: WLC
  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: de
  text: Hüte dein Volk mit deinem Stab, deine Herde, dein Erbteil. Sie wohnen für sich allein in einem Wald mitten im Karmel[a]. Lass sie in Baschan und Gilead weiden wie in den Tagen der Vorzeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitten im Weideland“ beziehungsweise „in fruchtbarem Land“. Das hebräische Wort Karmel kann sowohl die Region Karmel als auch fruchtbares Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  choice: Hüte
  rationale: Der Imperativ von רעה bezeichnet hier das Handeln eines Hirten. „Hüte“ bewahrt das Bild von Führung, Schutz und Versorgung und ist im Deutschen natürlicher und umfassender als das engere „Weide“.
- source_word: בְשִׁבְטֶךָ
  choice: mit deinem Stab
  rationale: שֵׁבֶט kann Stab, Rute, Zepter oder Stamm bedeuten. Im unmittelbaren Hirtenbild ist „Stab“ die naheliegende Bedeutung, ohne einen im Kontext nicht hervorgehobenen Strafaspekt einzutragen.
- source_word: צֹאן נַחֲלָתֶךָ
  choice: die Herde, die dein Erbteil ist
  rationale: Die Formulierung gibt die Herde als Gottes eigenen, ihm zugehörigen Anteil wieder. „Erbteil“ bewahrt die bundestheologisch geprägte Besitzsprache; der Relativsatz vermeidet das missverständliche „Herde deines Erbteils“.
- source_word: שֹׁכְנִי לְבָדָד
  choice: Sie wohnt abgeschieden
  rationale: Die Wendung beschreibt einen Zustand abgesonderten beziehungsweise alleinigen Wohnens. „Abgeschieden“ gibt die räumliche Isolation idiomatisch wieder; das singularische Pronomen nimmt im Deutschen die kollektive „Herde“ auf.
- source_word: יַעַר
  choice: in einem Wald
  rationale: יַעַר bezeichnet Wald oder bewaldetes Gelände. Die Präposition wird im Deutschen ergänzt, da das Hebräische die Ortsangabe knapp an die vorausgehende Partizipialwendung anschließt.
- source_word: בְּתוֹךְ כַּרְמֶל
  choice: mitten im Karmel
  rationale: כַּרְמֶל kann den Karmel als Region oder allgemein fruchtbares Weideland bezeichnen. Wegen der nachfolgenden geografischen Namen Baschan und Gilead wird der Eigenname im Haupttext bewahrt; die Bedeutungsalternative steht in der Fußnote.
- source_word: יִרְעוּ
  choice: Lass sie … weiden
  rationale: Das Imperfekt hat im Gebetszusammenhang auffordernden beziehungsweise wünschenden Sinn. „Lass sie weiden“ wahrt sowohl diesen Sinn als auch das durchgehende Hirtenbild.
- source_word: בָשָׁן וְגִלְעָד
  choice: in Baschan und Gilead
  rationale: Die traditionellen deutschen Formen der beiden Ortsnamen werden beibehalten. Beide Gebiete waren für fruchtbares Weideland bekannt.
- source_word: כִּימֵי עוֹלָם
  choice: wie in den Tagen der Vorzeit
  rationale: עוֹלָם bezeichnet hier die weit zurückliegende Vergangenheit, nicht metaphysische Ewigkeit. „Tage der Vorzeit“ ist würdig, verständlich und historisch offen.
theological_decisions:
- issue: Göttliche Fürsorge oder Züchtigung in שֵׁבֶט
  choice: „Stab“ im Rahmen des Hirtenbildes
  alternative: „Rute“, mit stärkerer Betonung von Autorität oder Züchtigung
  rationale: Der Kontext bittet Gott darum, sein Volk zu hüten und ihm Weide zu geben. „Stab“ hält das Bild kohärent, ohne die mögliche Autoritätskomponente auszuschließen oder einen Strafgedanken in den Vordergrund zu rücken.
- issue: Bezug und Numerus von שֹׁכְנִי
  choice: 'Bezug auf die kollektiv verstandene Herde: „Sie wohnt“'
  alternative: 'Bezug auf die einzelnen Angehörigen des Volkes: „die abgeschieden wohnen“'
  rationale: Das hebräische maskuline Pluralpartizip kann sich sinngemäß auf die Angehörigen des Volkes beziehen, während צֹאן eine Kollektivbezeichnung ist. Im Deutschen führt die Aufnahme der unmittelbar genannten „Herde“ im Singular zu einem natürlichen Satz, ohne die kollektive Bedeutung zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit durchgehendem Hirtenbild. Zwei kurze Sätze nach der Anrede vermeiden eine überladene Konstruktion. „Erbteil“ bewahrt die prägnante biblische Besitz- und Bundesvorstellung, während „Vorzeit“ die historische Ferne ohne Archaismus ausdrückt.
