  variant: modern standard German
source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: de
  text: Sie werden Staub lecken wie eine Schlange; wie die Kriechtiere der Erde werden sie zitternd aus ihren Festungen hervorkommen.[a] Jahwe,[b] unserem Gott, werden sie sich voller Angst zuwenden,[c] und vor dir werden sie sich fürchten.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihren Befestigungen“, „aus ihren umschlossenen Orten“ oder „aus ihren Verstecken“.'
    reason: Das hebräische Wort מִסְגְּרוֹת kann umschlossene oder verschlossene Orte bezeichnen. Die genaue Art dieser Orte bleibt im Zusammenhang offen.
  - marker: b
    text: Im Hebräischen steht der Gottesname JHWH, hier mit „Jahwe“ wiedergegeben.
    reason: Der Eigenname soll erkennbar bleiben; „der HERR“ ist eine verbreitete traditionelle Wiedergabe.
  - marker: c
    text: 'Auch möglich: „Zu Jahwe, unserem Gott, werden sie in Angst kommen.“ Die knappe hebräische Verbindung von Richtung und Furcht lässt sich im Deutschen verschieden wiedergeben.'
    reason: Die Übersetzung macht die durch אֶל angezeigte Hinwendung ausdrücklich, ohne die Furchtkomponente von פחד aufzugeben.
  - marker: d
    text: 'Oder: „und vor dir werden sie Ehrfurcht haben“. Das hebräische Verb kann je nach Zusammenhang Furcht oder ehrfürchtiges Scheuen ausdrücken.'
    reason: Die Furchtbedeutung überwiegt hier, doch ein möglicher Anklang an Ehrfurcht soll nicht ausgeschlossen werden.
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: Staub lecken
  rationale: Die konkrete Erniedrigungsmetapher des hebräischen Textes bleibt unverändert erhalten.
- source_word: כַּנָּחָשׁ
  choice: wie eine Schlange
  rationale: נָחָשׁ ist hier die gewöhnliche Bezeichnung für eine Schlange; der unbestimmte Artikel ergibt im Deutschen einen natürlichen Vergleich.
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: wie die Kriechtiere der Erde
  rationale: Die Formulierung bewahrt das Bild niedrig am Boden kriechender Geschöpfe, ohne die zoologische Kategorie unnötig einzuengen.
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  choice: werden sie zitternd aus ihren Festungen hervorkommen
  rationale: רגז bezeichnet Zittern oder Beben; מן markiert die Bewegung aus den geschützten beziehungsweise umschlossenen Orten. „Hervorkommen“ macht die im Hebräischen knappe Bewegungsangabe im Deutschen verständlich.
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: Jahwe, unserem Gott, werden sie sich voller Angst zuwenden
  rationale: Die Richtungsangabe אֶל wird mit „sich … zuwenden“ wiedergegeben, während פחד die von Furcht geprägte Annäherung bezeichnet.
- source_word: וְיִרְאוּ מִמֶּךָּ
  choice: und vor dir werden sie sich fürchten
  rationale: Nach einem Verb des Fürchtens kann מן die Person bezeichnen, vor der man sich fürchtet. Die deutsche Wendung ist quellennah und idiomatisch, ohne mögliche Ehrfurchtsanklänge grundsätzlich auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit sein Charakter als Gottesname sichtbar bleibt; eine Fußnote nennt die hebräische Form JHWH.
- issue: Nuance der beiden Furchtverben פחד und ירא
  choice: Angst / sich fürchten
  alternative: Ehrfurcht haben
  rationale: Der Zusammenhang von gedemütigten, zitternden Völkern spricht vorrangig für Furcht und Angst. Eine Fußnote hält offen, dass ירא auch ehrfürchtiges Scheuen bezeichnen kann.
- issue: Richtungsaussage אֶל bei יִפְחָדוּ
  choice: sich voller Angst zuwenden
  alternative: in Angst zu … kommen / sich vor … ängstigen
  rationale: Die gewählte Fassung wahrt sowohl die Richtung auf Gott hin als auch die Furcht, ohne das Verhältnis als freiwillige Verehrung zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bilder von Schlange, Kriechtieren und zitterndem Hervorkommen bleiben anschaulich erhalten. Der Satzbau ist leicht gehoben, aber für heutige Leser gut verständlich; unnötige konfessionelle Terminologie wird vermieden.
