source:
  edition: WLC
  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: de
  text: Der Beste unter ihnen ist wie ein Dornstrauch, der Rechtschaffene schlimmer als eine Dornenhecke. Der Tag deiner Wächter, deine Heimsuchung[a], ist gekommen. Jetzt geraten sie in Verwirrung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Strafe“ beziehungsweise „deine Abrechnung“. Das hebräische Wort kann ein prüfendes oder ahndendes Einschreiten bezeichnen; hier ist ein Gericht gemeint.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: טוֹבָם
  choice: Der Beste unter ihnen
  rationale: Das substantivierte טוֹב mit Suffix bezeichnet vergleichend den besten Menschen innerhalb der zuvor beschriebenen Gruppe.
- source_word: כְּחֵדֶק
  choice: wie ein Dornstrauch
  rationale: חֵדֶק bezeichnet eine dornige Pflanze; „Dornstrauch“ vermittelt das verletzende Bild natürlich und klar.
- source_word: יָשָׁר
  choice: der Rechtschaffene
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen, der als moralisch aufrichtig gilt.
- source_word: מִמְּסוּכָה
  choice: schlimmer als eine Dornenhecke
  rationale: Das מִן ist vergleichend; מְסוּכָה bezeichnet eine Hecke oder Einfriedung, die im Zusammenhang als dornig und schädlich vorgestellt wird. „Schlimmer“ macht den im knappen Hebräisch vorausgesetzten negativen Vergleich verständlich.
- source_word: מְצַפֶּיךָ
  choice: deine Wächter
  rationale: Das Partizip von צפה bezeichnet Beobachter oder Wächter, hier wahrscheinlich prophetische Wächter, die vor dem Gerichtstag gewarnt haben.
- source_word: פְּקֻדָּתְךָ
  choice: deine Heimsuchung
  rationale: פְּקֻדָּה kann Aufsicht, Einschreiten, Heimsuchung oder Strafe bezeichnen. „Heimsuchung“ wahrt die Breite des Ausdrucks; die gerichtliche Bedeutung wird in der Fußnote erläutert.
- source_word: בָאָה
  choice: ist gekommen
  rationale: Das Perfekt stellt das angekündigte Geschehen als eingetreten beziehungsweise gewiss dar.
- source_word: עַתָּה תִהְיֶה מְבוּכָתָם
  choice: Jetzt geraten sie in Verwirrung
  rationale: Die idiomatische deutsche Formulierung gibt das hebräische „nun wird ihre Verwirrung sein“ verständlich wieder, ohne die Art oder Ursache der Verwirrung näher festzulegen.
theological_decisions:
- issue: Bedeutung von פְּקֻדָּתְךָ im Gerichtswort
  choice: deine Heimsuchung
  alternative: deine Strafe; deine Abrechnung
  rationale: Der Zusammenhang legt ein richtendes Eingreifen nahe, doch das hebräische Wort benennt allgemeiner ein prüfendes oder ahndendes Einschreiten. „Heimsuchung“ bewahrt diese Spannung, während die Fußnote den Gerichtssinn erklärt.
- issue: Verhältnis von „Tag deiner Wächter“ und „deiner Heimsuchung“
  choice: Der von den Wächtern angekündigte Tag wird mit der Heimsuchung inhaltlich verbunden
  alternative: der Tag, an dem die Wächter selbst heimgesucht werden
  rationale: Der knappe hebräische Nominalausdruck lässt das genaue Verhältnis offen. Im Zusammenhang gelten die Wächter am ehesten als diejenigen, die den kommenden Gerichtstag erwarten oder ankündigen; die Übersetzung macht diese wahrscheinlichste Beziehung verständlich, ohne eine besondere Lehrtradition einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache der Dornen bleibt erhalten. Kurze Hauptsätze und ein Doppelpunkt verdeutlichen die Beziehung zwischen dem angekündigten Tag und der Heimsuchung; die altertümlichere, aber semantisch breitere Bezeichnung „Heimsuchung“ wird durch eine Fußnote erschlossen.
