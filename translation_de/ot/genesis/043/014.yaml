    rationale: Das Verb bedeutet hier, dass der Mann den Bruder und Benjamin zu ihnen zurücksendet beziehungsweise freigibt. „Zurückschickt“ gibt die Handlung direkt wieder, ohne ein bloßes Erlauben oder die Begleitung „mit euch“ einzutragen.
