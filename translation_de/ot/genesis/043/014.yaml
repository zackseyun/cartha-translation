  to: 'Gott, der Allmächtige, schenke euch Erbarmen bei dem Mann[a], damit er euch euren anderen Bruder[b] und Benjamin zurückschickt. Und ich: Wenn ich Kinder verliere, dann verliere ich Kinder[c].'
