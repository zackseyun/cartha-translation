  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: de
  text: 'Gott, der Allmächtige, schenke euch Erbarmen bei dem Mann[a], damit er euch euren anderen Bruder[b] und Benjamin zurückschickt. Und ich: Wenn ich Kinder verliere, dann verliere ich Kinder[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Mann“. Das hebräische רַחֲמִים kann Erbarmen, Mitgefühl oder inniges Mitleid bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „anderen Bruder“ ist Simeon gemeint, der in Ägypten festgehalten wurde.
    reason: cross_reference
  - marker: c
    text: 'Oder, näher am Wortlaut: „Wie ich der Kinder beraubt bin, so bin ich der Kinder beraubt.“ Das Hebräische wiederholt dasselbe Verb. Die Wendung kann Jakobs Ergebung angesichts eines möglichen weiteren Verlusts ausdrücken; die genaue zeitlich-modale Nuance ist umstritten.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  rationale: Der göttliche Titel wird verständlich übersetzt statt transliteriert; die Formulierung bewahrt den feierlichen Anrufungscharakter.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: schenke euch Erbarmen bei dem Mann
  rationale: רַחֲמִים bezeichnet Erbarmen, Mitgefühl oder inniges Mitleid. „Bei dem Mann“ gibt לִפְנֵי in diesem Zusammenhang natürlich als erhoffte günstige Haltung des ägyptischen Machthabers wieder.
- source_word: וְשִׁלַּח לָכֶם
  choice: damit er … mit euch zurückkehren lässt
  rationale: Die Fortsetzung wird als Ziel beziehungsweise erhoffte Folge des Segenswunsches verstanden. Der Mann soll die festgehaltenen Brüder zur Rückkehr freigeben.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: euren anderen Bruder
  rationale: אַחֵר kennzeichnet den neben Benjamin gemeinten Bruder; im Kontext ist dies Simeon.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: Wenn ich meiner Kinder beraubt werde, dann werde ich ihrer beraubt
  rationale: Die Wiederholung desselben Verbs bleibt erhalten und bringt Jakobs schmerzliche Ergebung zum Ausdruck. Die Ergänzung „meiner Kinder/ihrer“ macht den im deutschen Verb nötigen Bezug deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens beziehungsweise Titels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El-Schaddai
  rationale: Die Übersetzung macht den traditionellen Sinn des Titels für heutige Leser zugänglich, ohne eine konfessionelle Sonderdeutung einzutragen; die etymologische Unsicherheit des Elements שַׁדַּי bleibt grundsätzlich bestehen.
- issue: Sinn der abschließenden Wiederholung
  choice: konditionale, ergebene Aussage über einen möglichen weiteren Verlust
  alternative: „Wie ich bereits kinderlos geworden bin, so bin ich kinderlos geworden“
  rationale: Der Kontext spricht für Jakobs Bereitschaft, das Verlustrisiko hinzunehmen. Da כַּאֲשֶׁר gewöhnlich „wie/als“ bedeutet, wird die alternative, stärker rückblickende Lesart in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch bleibt feierlich, die Schlusswendung bewusst knapp und wiederholend. Alle Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
