  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל לָ/מָ֥ה הֲרֵעֹתֶ֖ם לִ֑/י לְ/הַגִּ֣יד לָ/אִ֔ישׁ הַ/ע֥וֹד לָ/כֶ֖ם אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: de
  text: 'Da sagte Israel: »Warum habt ihr mir geschadet, indem ihr dem Mann mitgeteilt habt, dass ihr noch einen Bruder habt?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… indem ihr dem Mann mitgeteilt habt, ob ihr noch einen Bruder habt?“'
    reason: Die Fragepartikel הֲ kann die von לְהַגִּיד abhängige Frage einleiten. Die Fußnote bewahrt diese mögliche syntaktische Deutung, ohne sie fälschlich als eindeutig wörtlich auszugeben.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive Waw führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text verwendet ausdrücklich den Namen Israel; er wird nicht zu „Jakob“ harmonisiert.
- source_word: לָמָה
  choice: Warum
  rationale: Direkte und natürliche Wiedergabe des Frageworts.
- source_word: הֲרֵעֹתֶם לִי
  choice: habt ihr mir geschadet
  rationale: Die Hifil-Form von רעע bezeichnet das Zufügen von Schaden oder Unheil. „Mir geschadet“ bewahrt diesen Sinn, ohne ausdrücklich moralische Bosheit zu unterstellen.
- source_word: לְהַגִּיד
  choice: indem ihr ... gesagt habt
  rationale: Der Infinitiv bezeichnet hier das Mittel beziehungsweise die Handlung, durch die Israel sich geschädigt sieht.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Gemeint ist der bereits bekannte ägyptische Amtsträger; die bestimmte Form wird schlicht beibehalten.
- source_word: הַעוֹד לָכֶם אָח
  choice: dass ihr noch einen Bruder habt
  rationale: Die idiomatische deutsche Formulierung gibt das Fortbestehen eines weiteren Bruders wieder. „Noch einen“ lässt den im Zusammenhang vorausgesetzten zusätzlichen Bruder erkennen.
