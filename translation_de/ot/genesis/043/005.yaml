source:
  edition: WLC
  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: de
  text: 'Wenn du ihn aber nicht mitschickst, werden wir nicht hinabziehen. Denn der Mann hat zu uns gesagt: »Ihr dürft mir nicht unter die Augen treten, wenn euer Bruder nicht bei euch ist.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ihr werdet mein Angesicht nicht sehen, wenn euer Bruder nicht bei euch ist.« Gemeint ist, vor jemandem zu erscheinen oder in seine Gegenwart zu kommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet den Gegensatz zum vorausgehenden positiven Bedingungssatz ein und klingt im modernen Deutschen natürlich.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: du ihn nicht mitschickst
  rationale: Die verneinte Partizipialkonstruktion bezeichnet hier die beabsichtigte beziehungsweise ausbleibende Handlung. Das im Hebräischen unausgesprochene Objekt ist aus dem Zusammenhang Benjamin; »mitschicken« verdeutlicht, dass er mit den Brüdern reisen soll.
- source_word: לֹא נֵרֵד
  choice: werden wir nicht hinabziehen
  rationale: Die Übersetzung bewahrt die im Erzählzusammenhang übliche geografische Perspektive der Reise von Kanaan nach Ägypten.
- source_word: כִּי
  choice: Denn
  rationale: כִּי begründet die Weigerung. »Denn« verbindet die Begründung im Deutschen flüssig mit dem vorherigen Satz.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Josef ist für die Brüder noch nicht erkannt; die schlichte Bezeichnung wahrt ihre Erzählperspektive.
- source_word: אָמַר אֵלֵינוּ
  choice: hat zu uns gesagt
  rationale: Dies gibt die Redeeinleitung unmittelbar und natürlich wieder.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Ihr dürft mir nicht unter die Augen treten
  rationale: Die hebräische Wendung bedeutet, vor jemandem zu erscheinen beziehungsweise in seine Gegenwart zu kommen. Die deutsche Redewendung bewahrt das Bild des Angesichts und vermittelt zugleich den idiomatischen Sinn.
- source_word: בִּלְתִּי
  choice: wenn … nicht
  rationale: In Verbindung mit dem folgenden Begleitumstand bezeichnet בִּלְתִּי die notwendige Bedingung; die negative Bedingungsform ist im Deutschen klar und natürlich.
- source_word: אֲחִיכֶם אִתְּכֶם
  choice: euer Bruder … bei euch ist
  rationale: Die Übersetzung erhält »euer Bruder« ohne ergänzende Namensnennung und fügt das im hebräischen Nominalsatz vorausgesetzte »ist« ein.
