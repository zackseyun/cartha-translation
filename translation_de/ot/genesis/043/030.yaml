  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: de
  text: Da eilte Josef, denn sein Mitgefühl für seinen Bruder war tief aufgewühlt. Er suchte einen Ort, um zu weinen[a], ging in das Zimmer und weinte dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er suchte zu weinen.“ Gemeint ist offenbar, dass er einen Ort suchte, an dem er weinen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Da eilte Josef hinaus
  rationale: Das Verb bedeutet „eilen, sich beeilen“. „Hinaus“ ergibt sich aus dem erzählten Ortswechsel in einen privaten Raum, ist im Hebräischen jedoch nur sinngemäß enthalten und wird deshalb in einer Fußnote kenntlich gemacht.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: sein Mitgefühl ... war tief aufgewühlt
  rationale: Die hebräische Wendung beschreibt wörtlich, dass Josefs „Erbarmungen“ innerlich erregt oder entbrannt wurden. Die Formulierung bewahrt die starke Gefühlsbewegung in natürlichem modernem Deutsch.
- source_word: אֶל אָחִיו
  choice: für seinen Bruder
  rationale: Die Präposition bezeichnet hier die Person, der das Mitgefühl gilt. Der Name Benjamin wird nicht ergänzend in den Haupttext eingefügt.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: Er suchte einen Ort, um zu weinen
  rationale: Wörtlich steht „er suchte zu weinen“. Im Zusammenhang sucht Josef offenbar einen privaten Ort zum Weinen; die Ergänzung macht diese Implikation idiomatisch verständlich und wird durch eine Fußnote ausgewiesen.
- source_word: הַחַדְרָה
  choice: in das Zimmer
  rationale: Das Substantiv bezeichnet einen Raum oder ein Gemach, hier wahrscheinlich einen privaten Innenraum. „Zimmer“ ist gegenwärtiges, klares Deutsch.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: und weinte dort
  rationale: Die Wiedergabe entspricht dem gewöhnlichen Sinn des Verbs und bewahrt mit „dort“ die Ortsangabe שָׁמָּה.
