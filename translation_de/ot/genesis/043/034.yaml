  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: de
  text: Er ließ ihnen Portionen von seinem Tisch bringen[a]. Benjamins Portion aber war fünfmal so groß wie die Portion jedes anderen[b]. Dann tranken sie und wurden mit ihm betrunken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von vor seinem Angesicht«; gemeint sind wohl Portionen von Josefs eigenem Platz am Tisch.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »fünf Hände«; eine hebräische Ausdrucksweise für die fünffache Menge.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder abgeschwächt: »wurden fröhlich«. Das hebräische Verb bedeutet direkter »wurden betrunken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: Er ließ … Portionen … bringen
  rationale: Die Verbindung bezeichnet im Mahlkontext das Austeilen beziehungsweise Herbeibringen von Essensportionen; die kausative deutsche Form gibt die Handlung natürlich wieder.
- source_word: מֵאֵת פָּנָיו
  choice: von seinem Tisch
  rationale: Wörtlich steht »von vor seinem Angesicht«; im Bankettkontext sind Portionen von Josephs eigenem Platz beziehungsweise Tisch gemeint. Die konkrete Wiedergabe ist im modernen Deutsch klar und wird durch eine Fußnote abgesichert.
- source_word: מַשְׂאַת בִּנְיָמִן מִמַּשְׂאֹת כֻּלָּם
  choice: Benjamins Portion … wie die Portion jedes anderen
  rationale: Der Vergleich stellt Benjamins Portion den Portionen der übrigen Anwesenden gegenüber. »Jedes anderen« gibt den distributiven Sinn von כֻּלָּם in idiomatischem Deutsch wieder.
- source_word: חָמֵשׁ יָדוֹת
  choice: fünfmal so groß
  rationale: Die Wendung lautet wörtlich »fünf Hände« und bezeichnet hier das Fünffache einer Portion.
- source_word: וַיִּשְׁתּוּ
  choice: Dann tranken sie
  rationale: Direkte und natürliche Wiedergabe des Erzählverbs.
- source_word: וַיִּשְׁכְּרוּ
  choice: wurden … betrunken
  rationale: Das Verb bezeichnet unmittelbar das Betrunkenwerden. Eine Abschwächung zu »wurden fröhlich« würde die Aussage des Hebräischen unnötig mildern.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Das Pronomen bezieht sich im Kontext eindeutig auf Josef und wird entsprechend der hebräischen Form beibehalten.
