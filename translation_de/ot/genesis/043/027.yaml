base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: de
  text: 'Er erkundigte sich nach ihrem Wohlergehen und sagte: „Geht es eurem alten Vater, von dem ihr gesprochen habt, gut? Lebt er noch?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Er erkundigte sich nach ihrem Wohlergehen
  rationale: Die hebräische Wendung bezeichnet die Frage nach dem allgemeinen Ergehen. Diese deutsche Formulierung gibt den idiomatischen Sinn natürlich und würdig wieder.
- source_word: הֲשָׁלוֹם
  choice: Geht es … gut?
  rationale: שָׁלוֹם meint hier umfassendes Wohlergehen, nicht nur Gesundheit oder die Abwesenheit von Konflikt.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: eurem alten Vater
  rationale: Das Adjektiv bezeichnet den Vater als alt. „Alter Vater“ ist im Deutschen direkt und kontextgemäß; „betagt“ wäre stilistisch stärker markiert.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: von dem ihr erzählt habt
  rationale: Wörtlich steht „von dem ihr gesagt habt“. Im Zusammenhang verweist die Wendung darauf, dass die Brüder zuvor von ihrem Vater berichtet hatten.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Lebt er noch?
  rationale: Die knappe deutsche Frage bildet עוֹד („noch“) und חָי („lebend/am Leben“) idiomatisch und genau ab.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die Wiederholung des Begriffs שָׁלוֹם wird im Deutschen idiomatisch durch „Wohlergehen“ und „gut gehen“ wiedergegeben.
