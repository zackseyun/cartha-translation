  naturalness: Der Text ist flüssiges, modernes Standarddeutsch. „Sich nach ihrem Wohlergehen erkundigen“ und „Geht es ... gut?“ sind idiomatisch und bewahren die sinnvolle Variation der zweimaligen hebräischen schalom-Wendung.
