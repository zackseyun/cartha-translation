review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt das nachdrückliche Befragen (שָׁאוֹל שָׁאַל), die Auskunft entsprechend den genannten Fragen und die rhetorisch-emphatische Schlussfrage insgesamt zutreffend wieder. Bei „Habt ihr einen Bruder?“ fehlt jedoch im deutschen Kontext die notwendige Bedeutung eines weiteren Bruders: Da die Sprecher selbst Brüder sind, klingt die Frage sonst sachlich unplausibel. Das Hebräische verwendet zwar nur אָח im Singular, zielt im Kontext aber auf einen zusätzlichen Bruder.'
  naturalness: Die Sprache ist klar, modern und dem erzählenden Register angemessen. „Noch einen Bruder“ ist im Deutschen die natürliche, verständliche Formulierung. „Bringt euren Bruder mit herunter“ ist verständlich, aber „Bringt euren Bruder herunter“ hält sich enger an das Richtungsverb, ohne die Aussage zu verändern.
  terminology: „Familie“ ist für מוֹלַדְתֵּנוּ im Kontext eine angemessene moderne Wiedergabe. Die Anrede im Plural sowie die direkte Rede sind konsistent. Keine theologischen Fachbegriffe oder Eigennamen sind betroffen.
  issues:
  - severity: medium
    issue: „Habt ihr einen Bruder?“
    rationale: Die Formulierung lässt offen, ob überhaupt ein Bruder vorhanden ist, obwohl die Befragten als Brüder sprechen. Kontext und englische Audit-Fassung („another brother“) verlangen im Deutschen „noch einen Bruder“ bzw. „einen weiteren Bruder“.
  - severity: low
    issue: „mit herunter“
    rationale: Das „mit“ ist idiomatisch möglich, aber im hebräischen Imperativ הוֹרִידוּ („bringt ... hinab/herunter“) nicht eigens ausgedrückt. Die schlichtere Formulierung ist quellentreuer.
