base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: de
  text: 'Sie sagten: „Der Mann erkundigte sich sehr genau nach uns und unserer Familie und fragte: ‚Lebt euer Vater noch? Habt ihr noch einen Bruder?‘ Wir gaben ihm auf diese Fragen Auskunft. Wie hätten wir wissen können, dass er sagen würde: ‚Bringt euren Bruder herunter‘?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: erkundigte sich sehr genau
  rationale: Die Verbindung aus Infinitiv und finitem Verb verstärkt den Vorgang des Fragens; die deutsche Formulierung gibt dieses nachdrückliche Befragen natürlich wieder.
- source_word: מוֹלַדְתֵּנוּ
  choice: unserer Familie
  rationale: Das Wort bezeichnet hier die familiäre Herkunft beziehungsweise Verwandtschaft; die folgenden Fragen nach Vater und Bruder stützen die kontextuelle Wiedergabe „Familie“.
- source_word: הֲיֵשׁ לָכֶם אָח
  choice: Habt ihr einen Bruder?
  rationale: Der hebräische Text sagt schlicht „einen Bruder“; „noch einen“ oder „einen weiteren Bruder“ würde eine kontextuelle Präzisierung hinzufügen, die nicht ausdrücklich im Wortlaut steht.
- source_word: וַנַּגֶּד לוֹ עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: Wir gaben ihm auf diese Fragen Auskunft
  rationale: Die Wendung bedeutet, dass sie entsprechend den genannten Worten beziehungsweise Fragen berichteten. Die gewählte Formulierung ist im Deutschen klar und wahrt den Zusammenhang.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: Wie hätten wir wissen können
  rationale: Infinitiv absolut und finites Verb bilden eine emphatische rhetorische Frage. Die deutsche Formulierung gibt die starke Verneinung der Möglichkeit idiomatisch wieder.
- source_word: הוֹרִידוּ
  choice: Bringt … mit herunter
  rationale: Das Verb bezeichnet das Hinabbringen, hier auf der Reise nach Ägypten. „Herunter“ bewahrt die räumliche Perspektive, während „mitbringen“ im Deutschen die Begleitung natürlich ausdrückt.
