source:
  edition: WLC
  text: וַֽ/יְהִ֞י כִּי בָ֣אנוּ אֶל הַ/מָּל֗וֹן וַֽ/נִּפְתְּחָ/ה֙ אֶת אַמְתְּחֹתֵ֔י/נוּ וְ/הִנֵּ֤ה כֶֽסֶף אִישׁ֙ בְּ/פִ֣י אַמְתַּחְתּ֔/וֹ כַּסְפֵּ֖/נוּ בְּ/מִשְׁקָל֑/וֹ וַ/נָּ֥שֶׁב אֹת֖/וֹ בְּ/יָדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: de
  text: Als wir an den Übernachtungsplatz kamen und unsere Säcke öffneten, da lag das Silber eines jeden oben in seinem Sack[a] – unser Silber in vollem Gewicht –, und wir haben es wieder mitgebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Mund seines Sackes“, das heißt an der Öffnung des Sackes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: der Übernachtungsplatz
  rationale: מָלוֹן bezeichnet einen Ort, an dem Reisende die Nacht verbringen, ohne zwingend ein kommerzielles Gasthaus zu meinen.
- source_word: וַנִּפְתְּחָה
  choice: wir öffneten
  rationale: Die Form mit paragogischem ה hat hier in der Erzählung die Bedeutung der 1. Person Plural und bezeichnet die abgeschlossene Handlung.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: unsere Säcke / sein Sack
  rationale: אַמְתַּחַת bezeichnet hier einen Reise- beziehungsweise Getreidesack; „Sack“ passt zum Erzählzusammenhang.
- source_word: וְהִנֵּה
  choice: da lag
  rationale: Die überraschende Entdeckung wird in natürlichem modernem Deutsch durch die präsentative Wendung „da lag“ ausgedrückt.
- source_word: כֶסֶף אִישׁ
  choice: das Silber eines jeden
  rationale: 'Die Konstruktion ist distributiv: Das Silber jedes einzelnen Mannes wurde gefunden. „Silber“ bewahrt die konkrete Bezeichnung des Zahlungsmittels.'
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: oben in seinem Sack
  rationale: Wörtlich steht „im Mund seines Sackes“. „Oben in seinem Sack“ gibt die räumliche Bedeutung verständlich wieder; die konkrete hebräische Metapher wird in der Fußnote genannt.
- source_word: כַּסְפֵּנוּ בְּמִשְׁקָלוֹ
  choice: unser Silber nach seinem vollen Gewicht
  rationale: Die Formulierung bezeichnet den vollständigen, nach Gewicht bestimmten Betrag, ohne „Gewicht“ vorschnell durch den abstrakteren Begriff „Wert“ zu ersetzen.
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: Deshalb haben wir es wieder mitgebracht
  rationale: Das Verb bezeichnet das Zurückbringen des Silbers. Das deutsche Perfekt passt zur gegenwärtigen Erklärung der Brüder; „deshalb“ macht den im Zusammenhang naheliegenden Anschluss natürlich, ohne die Handlung inhaltlich zu erweitern.
- source_word: בְּיָדֵנוּ
  choice: mitgebracht
  rationale: Das hebräische „in unserer Hand“ bezeichnet hier, dass sie das Silber bei sich zurückbringen. Die deutsche Verbform gibt diesen Besitz- und Transportgedanken idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede klingt natürlich, bewahrt aber die Wiederholung von „Silber“ und die Gewichtsangabe des Hebräischen. Das altertümliche „siehe“ wird vermieden; die Überraschungsfunktion von וְהִנֵּה bleibt durch „da lag“ erhalten.
