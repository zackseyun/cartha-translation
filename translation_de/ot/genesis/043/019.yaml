  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: de
  text: Da gingen sie auf den Mann zu, der Josefs Haushalt verwaltete, und sprachen am Eingang des Hauses mit ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Tür des Hauses“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: gingen sie auf … zu
  rationale: נגשׁ bezeichnet hier das Herantreten an eine Person. „Auf … zugehen“ ist natürliches modernes Deutsch und bewahrt die gerichtete Bewegung.
- source_word: הָאִישׁ
  choice: den Mann
  rationale: Der hebräische Text sagt schlicht „der Mann“. Eine genauere Amtsbezeichnung wie „Verwalter“ oder „Diener“ wird nicht anstelle des Substantivs eingesetzt.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: der Josefs Haushalt verwaltete
  rationale: Die Konstruktion mit עַל bezeichnet Zuständigkeit und Aufsicht. „Josefs Haushalt verwaltete“ gibt diese Leitungsfunktion idiomatisch wieder; „Haushalt“ meint dabei die gesamte Hausgemeinschaft, nicht nur das Gebäude.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: und sprachen … mit ihm
  rationale: דבר mit אֶל bezeichnet das Sprechen zu einer Person. Im Deutschen klingt „mit ihm sprechen“ in dieser Szene natürlich, während der folgende Vers den Inhalt der Rede wiedergibt.
- source_word: פֶּתַח הַבָּיִת
  choice: am Eingang des Hauses
  rationale: פֶּתַח kann Eingang, Öffnung oder Türöffnung bezeichnen. „Am Eingang des Hauses“ ist klar und lässt offen, ob der konkrete Türbereich oder der allgemeinere Zugang gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die einfache Bezeichnung „Mann“ bleibt erhalten; seine Funktion wird nur im Relativsatz ausgedrückt. Das einleitende „Da“ bildet den hebräischen Erzählfortgang natürlich ab.
