  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: de
  text: Als Josef ins Haus kam, brachten sie ihm das Geschenk, das sie bei sich hatten, ins Haus und warfen sich vor ihm bis zur Erde nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das Qal-Wayyiqtol von בוא bezeichnet hier Josefs Kommen beziehungsweise Eintreten; zusammen mit „ins Haus“ ist „kam“ im deutschen Erzählstil natürlich.
- source_word: הַבַּיְתָה
  choice: ins Haus
  rationale: בית mit direktionalem ה bezeichnet eine Bewegung zum beziehungsweise in das Haus hinein; „ins Haus“ gibt diese Richtung knapp wieder.
- source_word: וַיָּבִיאוּ לוֹ
  choice: brachten sie ihm
  rationale: Das Hifil von בוא bedeutet „bringen“; לוֹ wird als natürlicher deutscher Dativ „ihm“ wiedergegeben.
- source_word: הַמִּנְחָה
  choice: das Geschenk
  rationale: מִנְחָה kann Geschenk, Gabe, Tribut oder Opfergabe bedeuten. Im Zusammenhang ist die für Josef bestimmte diplomatische Gabe gemeint, daher ist „Geschenk“ klar und neutral.
- source_word: אֲשֶׁר בְּיָדָם
  choice: das sie bei sich hatten
  rationale: Wörtlich heißt die Wendung „das in ihrer Hand war“. Die idiomatische deutsche Formulierung vermittelt, dass sie das Geschenk mitgebracht beziehungsweise bei sich hatten, ohne unnatürlich zu klingen.
- source_word: הַבָּיְתָה
  choice: ins Haus
  rationale: Die zweite direktionale Form wird beibehalten, sodass die auffällige Wiederholung des Hebräischen erhalten bleibt.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: warfen sich vor ihm nieder
  rationale: Die Verbform bezeichnet das ehrerbietige Niederwerfen beziehungsweise tiefe Verbeugen vor einer Person. „Sich vor ihm niederwerfen“ gibt die körperliche Unterwerfung deutlich und würdig wieder.
- source_word: אָרְצָה
  choice: bis zur Erde
  rationale: Die direktionale Form von אֶרֶץ beschreibt die Bewegung erdwärts; „bis zur Erde“ bewahrt die ausdrückliche Zielangabe und verstärkt nicht unnötig zu „mit dem Gesicht zur Erde“.
theological_decisions:
- issue: Art der Ehrerbietung vor Josef
  choice: warfen sich vor ihm bis zur Erde nieder
  alternative: beteten ihn an
  rationale: Der Kontext beschreibt höfische Unterwerfung beziehungsweise Huldigung, nicht notwendig religiöse Anbetung. Die Übersetzung wahrt diese Unterscheidung.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die zweimalige Angabe „ins Haus“ bleibt entsprechend dem hebräischen Text erhalten; „bei sich hatten“ gibt die konkrete hebräische Hand-Wendung idiomatisch wieder.
