  source_fidelity: 'Der deutsche Text gibt die Abfolge und alle wesentlichen Elemente des Hebräischen zuverlässig wieder: Josefs Eintreten ins Haus, das Überreichen der Gabe, die konkrete Wendung „bei sich hatten“, die zweite ausdrückliche Ortsangabe „ins Haus“ sowie die Niederwerfung bis zur Erde. „Geschenk“ ist für מִנְחָה im höfisch-diplomatischen Kontext treffend und vermeidet die unangebrachte kultische Einengung von „Opfergabe“.'
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch mit angemessen würdigem Erzählregister. Die Wiederholung von „ins Haus“ klingt im Deutschen leicht markiert, ist aber absichtlich und sachgerecht, da sie die Wiederholung im hebräischen Text bewahrt. „Sich vor ihm bis zur Erde niederwerfen“ ist idiomatisch und klar.
  terminology: „Josef“, „Geschenk“, „bei sich hatten“ und „warfen sich vor ihm bis zur Erde nieder“ sind terminologisch passend. Die Wiedergabe beschreibt Huldigung bzw. Unterwerfung, ohne theologisch als Anbetung festzulegen.
