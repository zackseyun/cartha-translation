review_pass:
  verdict: revise
  source_fidelity: Die betonte Selbstverpflichtung („Ich selbst bürge für ihn“), das Bringen und Vorführen Benjamins sowie die lebenslange persönliche Schuld entsprechen dem Hebräischen gut. „zurückfordern“ ergänzt jedoch den ausdrücklich nicht vorhandenen Gedanken des Zurückbringens/-forderns. Der Imperfekt in der Rechenschaftsformel ist besser als verbindliche Zusage („sollst“) denn als bloße Möglichkeit („kannst“) wiederzugeben.
  naturalness: Die Fassung ist überwiegend modernes, würdiges Standarddeutsch. „Von mir sollst du ihn fordern“ ist idiomatischer als die wörtlichere, aber im Deutschen steife Wendung „von meiner Hand“, ohne den Sinn persönlicher Haftung zu verlieren. „werde ich ... schuldig sein“ gibt die Folge der Selbstverpflichtung präziser wieder als das voluntative „will ich ... sein“.
  terminology: „Bürge für ihn“ trifft ערב angemessen. „Schuldig sein“ ist in diesem zwischenmenschlichen Haftungszusammenhang eine natürliche Wiedergabe von חטא, ohne die mögliche engere Bedeutung „sündigen“ zu unterschlagen. Die Fußnote bewahrt diese lexikalische Alternative.
  issues:
  - severity: medium
    issue: „zurückfordern“ fügt einen nicht ausdrücklich im hebräischen Text enthaltenen Rückkehr-/Wiedererlangungsaspekt hinzu.
    rationale: הֲבִיאֹתִיו („ich bringe ihn“) kann im Kontext eine Rückkehr voraussetzen, doch מִיָּדִי תְּבַקְשֶׁנּוּ sagt nur, dass der Vater ihn von Juda fordern bzw. Juda für ihn in Anspruch nehmen kann. Die Ergänzung sollte vermieden werden.
  - severity: low
    issue: „kannst du“ schwächt die bindende Rechenschaftszusage.
    rationale: Das Imperfekt in dieser Bürgschaftsformel drückt eher eine eingeräumte Forderung bzw. verbindliche Haftung aus als bloße Erlaubnis oder Möglichkeit.
  - severity: low
    issue: „dann will ich ... schuldig sein“ kann im Deutschen als freiwillige Absicht statt als eintretende Folge verstanden werden.
    rationale: „Dann werde ich ... schuldig sein“ stellt die Selbstverpflichtung klarer dar und bleibt beim Sinn der hebräischen Selbstverwünschung.
  revised_text: Ich selbst bürge für ihn. Von mir sollst du ihn fordern. Wenn ich ihn nicht zu dir bringe und ihn vor dich stelle, dann werde ich dir gegenüber mein Leben lang schuldig sein.[a]
  revised_footnotes:
