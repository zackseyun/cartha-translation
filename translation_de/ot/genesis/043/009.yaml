    text: 'Oder wörtlicher: „Dann habe ich mich dir gegenüber mein Leben lang versündigt.“'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt die nicht explizite Ergänzung „zurück-“ und schärft die Verbindlichkeit von Judas Bürgschaft. Die Hauptfassung bleibt natürliches modernes Deutsch; die Fußnote dokumentiert weiterhin die mögliche engere Wiedergabe von חטא als „sich versündigen“.
