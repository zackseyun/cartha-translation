revisions:
- from: Ich selbst bürge für ihn. Von meiner Hand kannst du ihn zurückfordern. Wenn ich ihn nicht zu dir bringe und ihn vor dich stelle, dann will ich dir gegenüber mein Leben lang schuldig sein.[a]
  to: Ich selbst bürge für ihn. Von mir sollst du ihn fordern. Wenn ich ihn nicht zu dir bringe und ihn vor dich stelle, dann werde ich dir gegenüber mein Leben lang schuldig sein.[a]
  rationale: Die Revision entfernt die nicht explizite Ergänzung „zurück-“ und schärft die Verbindlichkeit von Judas Bürgschaft. Die Hauptfassung bleibt natürliches modernes Deutsch; die Fußnote dokumentiert weiterhin die mögliche engere Wiedergabe von חטא als „sich versündigen“.
