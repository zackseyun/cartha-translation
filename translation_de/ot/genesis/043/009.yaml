base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: de
  text: Ich selbst bürge für ihn. Von mir sollst du ihn fordern. Wenn ich ihn nicht zu dir bringe und ihn vor dich stelle, dann werde ich dir gegenüber mein Leben lang schuldig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Dann habe ich mich dir gegenüber mein Leben lang versündigt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Das selbstständige Pronomen ist betont und hebt Judas persönliche Verantwortungsübernahme hervor.
- source_word: אֶעֶרְבֶנּוּ
  choice: bürge für ihn
  rationale: Das Verb bezeichnet das Eintreten als Bürge; diese Wendung ist im Deutschen natürlich und bewahrt den rechtlichen Verantwortungscharakter.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Von meiner Hand kannst du ihn zurückfordern
  rationale: Die konkrete Bildsprache der Hand bleibt erhalten; „zurückfordern“ gibt den Sinn des Einforderns persönlicher Rechenschaft im Kontext verständlich wieder.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: ich ihn nicht zu dir bringe
  rationale: Das Hifil von בוא bedeutet „bringen“; ein ausdrückliches „zurück“ wird hier nicht ergänzt, da es nur aus dem Zusammenhang folgt.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: und ihn vor dich stelle
  rationale: Die konkrete Bedeutung von יצג im Hifil, jemanden hinzustellen beziehungsweise vorzuführen, wird formal und verständlich wiedergegeben.
- source_word: וְחָטָאתִי לְךָ
  choice: dann will ich dir gegenüber ... schuldig sein
  rationale: חטא bezeichnet gewöhnlich Sünde beziehungsweise Schuld. Im persönlichen Haftungsversprechen drückt es bleibende Schuld gegenüber Jakob aus, ohne den moralischen Ernst abzuschwächen.
- source_word: כָּל הַיָּמִים
  choice: mein Leben lang
  rationale: Die Wendung bezeichnet eine lebenslange Dauer; „mein Leben lang“ ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe von וְחָטָאתִי לְךָ im zwischenmenschlichen Haftungsversprechen
  choice: dann will ich dir gegenüber mein Leben lang schuldig sein
  alternative: dann habe ich mich dir gegenüber mein Leben lang versündigt
  rationale: Die Hauptfassung erhält den Gedanken persönlicher Schuld und dauernder Haftung in natürlichem Deutsch. Die Alternative bewahrt die engere Grundbedeutung „sündigen“ und wird wegen der echten lexikalisch-theologischen Spannung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die betonte Selbstverpflichtung Judas und die konkrete Rechenschaftssprache des Hebräischen bleiben erhalten; unnötig altertümliche Rechtssprache wird vermieden.
