  text: וַ/יַּ֣עַשׂ הָ/אִ֔ישׁ כַּֽ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֥יתָ/ה יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: de
  text: Der Mann tat, was Josef gesagt hatte, und brachte die Männer in Josefs Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה bezeichnet hier die Ausführung einer Anweisung; die Wendung „tat, was … gesagt hatte“ ist im Deutschen natürlich und gibt den Gehorsam gegenüber Josefs Anordnung wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der hebräische Text bezeichnet ihn lediglich als „den Mann“. Eine Wiedergabe als „Verwalter“ oder „Diener“ würde eine aus dem Kontext erschlossene Funktion ausdrücklich machen, die dieser Vers nicht nennt.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: was Josef gesagt hatte
  rationale: Die Formulierung drückt Übereinstimmung mit Josefs zuvor erteilter Anweisung aus. Das Plusquamperfekt entspricht im Deutschen natürlich der zeitlichen Abfolge.
- source_word: וַיָּבֵא
  choice: brachte
  rationale: Der Hifil von בוא hat hier die kausative Bedeutung „hineinbringen/herbringen“. „Brachte“ bildet diese Bedeutung unmittelbar ab.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Obwohl damit Josefs Brüder gemeint sind, verwendet der Ausgangstext die allgemeine Bezeichnung „die Männer“, die beibehalten wird.
- source_word: בֵּיתָה יוֹסֵף
  choice: in Josefs Haus
  rationale: Das direktionale ה an בֵּיתָה bezeichnet eine Bewegung zum beziehungsweise ins Haus; mit dem Verb „brachte“ gibt „in Josefs Haus“ den Eintritt idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „der Mann“ im zweiten Satzteil wird im Deutschen durch das fortgeführte Subjekt vermieden, ohne Information auszulassen. Keine Fußnote nötig, da die mögliche Wiedergabe „führte“ keine für den Sinn wesentliche Mehrdeutigkeit darstellt.
