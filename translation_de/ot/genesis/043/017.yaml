  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die wesentlichen Bezüge zuverlässig wieder: Der unbestimmte „Mann“ handelt gemäß Josefs Anweisung und bringt „die Männer“ in Josefs Haus. Die generischen Personenbezeichnungen werden nicht durch „Verwalter“ oder „Brüder“ interpretierend ersetzt. „In Josefs Haus“ vermittelt mit „brachte“ die vom direktionalen -ה ausgedrückte Bewegung ins Haus angemessen.'
