lexical_decisions:
- source_word: וְהָרָעָב
  choice: Und die Hungersnot
  rationale: רָעָב bezeichnet hier im Erzählzusammenhang eine Hungersnot. Das vorangestellte וְ wird als „Und“ wiedergegeben, weil es den Satz ausdrücklich mit dem vorhergehenden Geschehen verbindet.
- source_word: כָּבֵד
  choice: lastete schwer
  rationale: כָּבֵד bedeutet wörtlich „schwer sein“. Bei einer Hungersnot bezeichnet es deren große Belastung beziehungsweise Heftigkeit; „lastete schwer“ bewahrt das Bild und klingt zugleich natürlich.
- source_word: בָּאָרֶץ
  choice: auf dem Land
  rationale: אֶרֶץ meint hier das betroffene Land beziehungsweise Gebiet, nicht die gesamte Erde. In Verbindung mit „lastete schwer“ ist „auf dem Land“ idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bewahrt den hebräischen Anschluss mit וְ und das Gewichtsbild von כָּבֵד, ohne unnatürlich wörtlich zu wirken.
