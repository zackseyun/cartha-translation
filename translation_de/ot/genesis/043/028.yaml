source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: de
  text: 'Sie antworteten: »Deinem Diener, unserem Vater, geht es gut[a]; er lebt noch.« Dann verneigten sie sich und warfen sich nieder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier das hebräische Wort für »Frieden« (Schalom); in diesem Zusammenhang bezeichnet es Wohlergehen beziehungsweise gutes Befinden.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: geht es gut
  rationale: Das Substantiv bezeichnet hier idiomatisch das Wohlergehen des Vaters und beantwortet die vorausgehende Frage nach seinem Befinden. »Geht es gut« ist natürliches modernes Deutsch; die wörtliche Alternative »Frieden« wird in der Fußnote genannt.
- source_word: לְעַבְדְּךָ
  choice: deinem Diener
  rationale: עבד ist hier eine ehrerbietige Selbstbezeichnung gegenüber einem Höhergestellten, nicht zwingend eine Aussage über den rechtlichen Status als Sklave.
- source_word: לְאָבִינוּ
  choice: unserem Vater
  rationale: 'Die Apposition wird im Deutschen durch Kommas kenntlich gemacht: Der als »dein Diener« bezeichnete Mann ist ihr Vater.'
- source_word: עוֹדֶנּוּ חָי
  choice: er lebt noch
  rationale: Die Formulierung bewahrt den zeitlichen Sinn von עוד und klingt in modernem Deutsch natürlich.
- source_word: וַיִּקְּדוּ
  choice: sie verneigten sich
  rationale: קדד bezeichnet das Beugen beziehungsweise tiefe Neigen des Körpers.
- source_word: וישתחו
  choice: warfen sich nieder
  rationale: Die Form bezeichnet hier die körperliche Niederwerfung vor Joseph. Diese Wiedergabe vermeidet, dem sozialen Ehrbeweis ohne textlichen Grund religiöse Anbetung zuzuschreiben.
theological_decisions:
- issue: Wiedergabe der Huldigung mit וישתחו
  choice: warfen sich nieder
  alternative: beteten an; verbeugten sich
  rationale: Im Erzählzusammenhang gilt die Geste Joseph als einem Machthaber. Die Übersetzung bezeichnet daher die körperliche Handlung, ohne religiöse Anbetung zu behaupten; zugleich bleibt die gegenüber וַיִּקְּדוּ gesteigerte Niederwerfung erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfisch-ehrerbietige Anrede »deinem Diener« bleibt erhalten. Die beiden aufeinanderfolgenden Gesten werden mit »verneigten sich« und »warfen sich nieder« unterschieden.
