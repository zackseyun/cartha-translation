base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: de
  text: Da nahmen die Männer dieses Geschenk, den doppelten Geldbetrag und Benjamin mit sich. Sie machten sich auf, zogen nach Ägypten hinab und traten vor Josef.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: Geschenk
  rationale: Im Erzählzusammenhang bezeichnet das Wort eine beschwichtigende Gabe für einen Höhergestellten, nicht ein kultisches Opfer.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: den doppelten Geldbetrag
  rationale: Die Wendung bezeichnet gegenüber dem früheren Betrag die doppelte Menge; „Geldbetrag“ macht den quantitativen Bezug im Deutschen klar.
- source_word: כֶּסֶף
  choice: Geld
  rationale: Das Wort bedeutet wörtlich „Silber“, wird hier im geschäftlichen Zusammenhang jedoch im Sinn von Zahlungsmitteln gebraucht.
- source_word: בְיָדָם
  choice: mit sich
  rationale: Die wörtliche Wendung „in ihrer Hand“ ist ein hebräisches Besitz- und Mitführungsidiom; „mit sich“ gibt ihre Funktion natürlich wieder.
- source_word: וְאֶת בִּנְיָמִן
  choice: ebenso Benjamin
  rationale: Benjamin wird als weiteres Objekt des Mitnehmens an die Aufzählung angeschlossen; diese Formulierung ist im Deutschen klar und respektiert die Koordination.
- source_word: וַיָּקֻמוּ
  choice: sie machten sich auf
  rationale: Im Reisebericht bezeichnet das Aufstehen idiomatisch den Aufbruch, ohne den folgenden Weg nach Ägypten vorwegzunehmen.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: zogen nach Ägypten hinab
  rationale: „Hinabziehen“ bewahrt die übliche hebräische geografische Perspektive bei einer Reise von Kanaan nach Ägypten.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: traten vor Josef
  rationale: Die Wendung bezeichnet das Erscheinen in Josefs Gegenwart; „traten vor“ klingt im Deutschen natürlich und bewahrt den formellen Charakter der Begegnung.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der Ausgangstext nennt sie ausdrücklich „die Männer“, nicht „die Brüder“.
