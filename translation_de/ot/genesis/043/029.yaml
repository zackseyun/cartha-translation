source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֞רְא אֶת בִּנְיָמִ֣ין אָחִי/ו֮ בֶּן אִמּ/וֹ֒ וַ/יֹּ֗אמֶר הֲ/זֶה֙ אֲחִי/כֶ֣ם הַ/קָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑/י וַ/יֹּאמַ֕ר אֱלֹהִ֥ים יָחְנְ/ךָ֖ בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: de
  text: 'Er hob die Augen und sah Benjamin, seinen Bruder, den Sohn seiner Mutter.[a] Er sagte: »Ist das euer jüngster Bruder, von dem ihr mir erzählt habt?« Dann sagte er: »Gott sei dir gnädig, mein Sohn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die nähere Bestimmung »den Sohn seiner Mutter« unterstreicht, dass Benjamin Josefs Bruder auch von derselben Mutter her war.
    reason: Erläuterung der im Hebräischen ausdrücklich hervorgehobenen Verwandtschaftsbeziehung.
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Er hob die Augen
  rationale: Die hebräische Wendung wird bildhaft und zugleich in natürlichem modernem Deutsch wiedergegeben; »er blickte auf« wäre idiomatischer, würde das konkrete Bild jedoch abschwächen.
- source_word: וַיַּרְא
  choice: und sah
  rationale: ראה bezeichnet hier schlicht das Sehen und schließt unmittelbar an das Heben der Augen an.
- source_word: אֶת בִּנְיָמִין
  choice: Benjamin
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: seinen Bruder, den Sohn seiner Mutter
  rationale: Die appositionelle Formulierung des Hebräischen bleibt erhalten und hebt hervor, dass Benjamin mit Josef dieselbe Mutter hatte; die verdichtende Wiedergabe »seinen leiblichen Bruder« wäre stärker auslegend.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: euer jüngster Bruder
  rationale: הַקָּטֹן bezeichnet im erzählerischen Zusammenhang den jüngsten der Brüder, nicht seine Körpergröße.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: von dem ihr mir erzählt habt
  rationale: Die wörtliche Struktur »von dem ihr zu mir gesagt habt« wäre im Deutschen unnatürlich; die gewählte Fassung gibt den kontextuellen Sinn knapp und verständlich wieder.
- source_word: אֱלֹהִים יָחְנְךָ
  choice: Gott sei dir gnädig
  rationale: Der deutsche Wunschsatz bewahrt den Segenscharakter des hebräischen Jussivs und gibt חנן unmittelbar mit »gnädig sein« wieder.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die männliche Singularform mit Suffix wird als persönliche, liebevolle Anrede genau wiedergegeben.
theological_decisions:
- issue: Segensformel mit אֱלֹהִים und jussivischem יָחְנְךָ
  choice: Gott sei dir gnädig, mein Sohn!
  alternative: Möge Gott dir gnädig sein, mein Sohn!
  rationale: Der deutsche Konjunktiv »sei« bringt den Wunsch- und Segenscharakter knapp zum Ausdruck, ohne die Aussage als bloße Feststellung oder als Befehl an Gott misszuverstehen. Die allgemeine Gottesbezeichnung אֱלֹהִים wird ohne Einfügung eines Bundesnamens als »Gott« wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Das hebräische Bild vom Heben der Augen und die appositionelle Hervorhebung Benjamins bleiben erhalten; schwerfällige hebräische Satzmuster werden nur dort idiomatisch geglättet, wo dies für natürliches Deutsch nötig ist.
