base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: de
  text: Außerdem haben wir weiteres Silber mit hierhergebracht, um Lebensmittel zu kaufen.[a][b][c] Wir wissen nicht, wer unser Silber in unsere Säcke gelegt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geld“ an beiden Stellen; das hebräische Wort כֶּסֶף kann sowohl Silber als Metall als auch Geld als Zahlungsmittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um Getreide zu kaufen“; die Wendung kann sich besonders auf den Kauf von Getreide beziehen, doch das hier verwendete Hauptwort bedeutet allgemeiner „Nahrung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „haben wir in unserer Hand hinabgebracht“. Die hebräische Ausdrucksweise verbindet den Besitz mit der Reise hinab nach Ägypten.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: Auch weiteres Silber
  rationale: כֶּסֶף bezeichnet Silber und kann zugleich als Zahlungsmittel gemeint sein. „Silber“ bewahrt die konkrete Ausdrucksweise und die Wiederholung im Vers; אַחֵר kennzeichnet einen zusätzlichen Betrag.
- source_word: הוֹרַדְנוּ בְ/יָדֵ/נוּ
  choice: haben wir mit hierhergebracht
  rationale: Der Hifil von ירד bedeutet wörtlich „hinabbringen“ und spiegelt die Reise von Kanaan nach Ägypten. Im heutigen Deutschen gibt „mit hierhergebracht“ die Bewegung und den Besitz idiomatisch wieder; die konkretere hebräische Wendung wird in Fußnote [c] festgehalten.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: um Nahrung zu kaufen
  rationale: שׁבר bezeichnet hier den Erwerb von Vorräten beziehungsweise Getreide, während אֹכֶל allgemein „Nahrung“ bedeutet. Die Wiedergabe bleibt daher bewusst weiter als „Getreide“.
- source_word: לֹא יָדַעְנוּ
  choice: Wir wissen nicht
  rationale: Das Perfekt beschreibt hier passend einen gegenwärtigen Wissensstand, der aus bisheriger Unkenntnis fortbesteht.
- source_word: מִי שָׂם
  choice: wer ... gelegt hat
  rationale: מִי leitet die indirekte Frage ein; שׂים bedeutet „legen, setzen, tun“. „Gelegt hat“ ist im Zusammenhang mit den Säcken natürlich.
- source_word: כַּסְפֵּ/נוּ
  choice: unser Silber
  rationale: Die Wiederholung von כֶּסֶף wird sichtbar bewahrt und nicht beim zweiten Vorkommen zu „Geld“ verändert.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: in unsere Säcke
  rationale: אַמְתַּחַת bezeichnet einen Sack oder eine Tragetasche für Vorräte. „Säcke“ passt konkret zum Erzählzusammenhang.
