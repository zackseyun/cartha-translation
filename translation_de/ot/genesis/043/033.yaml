    rationale: „Jugendrang“ ist im modernen Standarddeutsch unidiomatisch und suggeriert einen formalen Rang. Der hebräische Ausdruck bezeichnet hier die Stellung nach dem Alter innerhalb der Sitzordnung.
  - severity: medium
