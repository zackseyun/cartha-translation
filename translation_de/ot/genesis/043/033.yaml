revisions:
- from: Sie setzten sich vor ihm, der Erstgeborene seinem Erstgeburtsrang entsprechend und der Jüngste seinem Jugendrang entsprechend.[a] Da sahen die Männer einander erstaunt an.[b]
  to: Sie saßen vor ihm in der Reihenfolge ihres Alters, vom Erstgeborenen bis zum Jüngsten.[a] Da blickten die Männer einander erstaunt an.[b]
  rationale: Die Revision ersetzt die künstlichen Ausdrücke „Erstgeburtsrang“ und „Jugendrang“ durch eine klare, moderne Formulierung der vom Hebräischen beschriebenen Altersreihenfolge. Sie bewahrt die Pole „Erstgeborener“ und „Jüngster“, die Bezeichnung „Männer“ und die gegenseitige Verwunderung. Die Fußnoten erläutern die formale Parallelität und die reziproke Wendung korrekt.
