base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: de
  text: Sie saßen vor ihm in der Reihenfolge ihres Alters, vom Erstgeborenen bis zum Jüngsten.[a] Da blickten die Männer einander erstaunt an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Erstgeborene entsprechend seiner Erstgeburt und der Jüngste entsprechend seiner Jugend«. Die parallelen hebräischen Ausdrücke bezeichnen die Sitzordnung nach dem Alter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Da staunten die Männer einander an.« Das hebräische Verb bezeichnet Erstaunen; die Wendung lautet wörtlich »einer zum anderen« und drückt die gegenseitige Reaktion aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Sie setzten sich
  rationale: Die aktive Wayyiqtol-Form von ישׁב bezeichnet hier im Erzählfluss das Sichsetzen; ein Passiv wie »sie wurden gesetzt« würde eine im Hebräischen nicht ausdrücklich formulierte Handlung Josephs eintragen.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Gibt die räumliche Beziehung knapp und natürlich wieder und lässt den Bezug auf Josef aus dem Kontext hervorgehen.
- source_word: הַבְּכֹר
  choice: der Erstgeborene
  rationale: Bewahrt gegenüber »der Älteste« den ausdrücklichen Bezug auf den Status und die Reihenfolge der Geburt.
- source_word: כִּבְכֹרָתוֹ
  choice: seinem Erstgeburtsrang entsprechend
  rationale: בכורה kann Erstgeburtsstatus beziehungsweise Erstgeburtsrecht bezeichnen; beim Sitzen ist konkret die Rangfolge nach der Geburt gemeint. »Erstgeburtsrang« erhält beide Aspekte, ohne einen rechtlichen Vorgang zu unterstellen.
- source_word: וְהַצָּעִיר
  choice: und der Jüngste
  rationale: Im Gegensatz zum Erstgeborenen und angesichts der vollständigen Altersordnung ist im Deutschen die superlativische Wiedergabe sachgerecht.
- source_word: כִּצְעִרָתוֹ
  choice: seinem Jugendrang entsprechend
  rationale: Die seltene Bildung bezeichnet Jugend beziehungsweise den Rang als Jüngerer. »Jugendrang« spiegelt die parallele Konstruktion zu »Erstgeburtsrang« und macht die Sitzordnung nach Alter verständlich.
- source_word: וַיִּתְמְהוּ
  choice: Da sahen ... erstaunt an
  rationale: תמה bezeichnet Staunen oder Verblüffung. Zusammen mit dem reziproken Ausdruck אישׁ אל־רעהו wird die gegenseitige Reaktion im Deutschen natürlich als erstauntes Ansehen wiedergegeben.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Bewahrt die ausdrückliche Bezeichnung des hebräischen Textes; »die Brüder« wäre zwar referenziell richtig, aber interpretierend.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: einander
  rationale: Die hebräische Wendung drückt eine wechselseitige Handlung aus; »einander« ist dafür die idiomatische deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aktive Form und die Bezeichnung »die Männer« bleiben erhalten. Die ungewöhnliche Parallelität der Altersbezeichnungen wird im Haupttext verständlich wiedergegeben und in der Fußnote formal näher erläutert.
