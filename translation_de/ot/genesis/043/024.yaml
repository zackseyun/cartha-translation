  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: de
  text: Der Mann[a] brachte die Männer in Josefs Haus und gab ihnen Wasser; sie wuschen sich die Füße. Dann gab er ihren Eseln Futter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich stehen hier „der Mann“ und anschließend „die Männer“. Der Vers bezeichnet den Mann nicht ausdrücklich als Josefs Hausverwalter und die Männer nicht ausdrücklich als Josefs Brüder, auch wenn beides aus dem Zusammenhang klar ist.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: brachte … in … Haus
  rationale: Die Hifil-Form von בוא bezeichnet hier das Veranlassen des Hineingehens. „Brachte … in Josefs Haus“ gibt sowohl die kausative Bedeutung als auch die durch בֵּיתָה ausgedrückte Richtung natürlich wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der hebräische Text nennt ihn schlicht „den Mann“. Seine Funktion als Verwalter von Josefs Haus geht aus dem Zusammenhang hervor, wird hier aber nicht ausdrücklich bezeichnet.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das gewöhnliche Substantiv bedeutet „die Männer“. Dass es Josefs Brüder sind, ist aus dem Zusammenhang klar, steht jedoch nicht ausdrücklich in diesem Vers.
- source_word: וַיִּתֶּן מַיִם
  choice: gab ihnen Wasser
  rationale: „Ihnen“ ist im Hebräischen nicht ausdrücklich gesetzt, ergibt sich aber eindeutig aus dem Zusammenhang und ist für natürliches Deutsch erforderlich.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: sie wuschen sich die Füße
  rationale: Das Verb steht aktiv im Plural. Die Wiedergabe bewahrt ausdrücklich, dass die Männer selbst als grammatisches Subjekt erscheinen, statt ein Waschen durch Diener anzunehmen.
- source_word: מִסְפּוֹא
  choice: Futter
  rationale: Das Wort bezeichnet Tierfutter. „Futter“ ist im heutigen Deutsch klarer und natürlicher als das gehobenere „Viehfutter“ oder das veraltete „Futterstroh“.
- source_word: לַחֲמֹרֵיהֶם
  choice: ihren Eseln
  rationale: Der Präpositionalausdruck bezeichnet die Empfänger des Futters und lässt sich im Deutschen idiomatisch mit dem Dativ wiedergeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Semikolon macht den Subjektwechsel vom Mann zu den Männern deutlich, ohne die Abfolge der hebräischen Satzglieder unnötig aufzulösen.
