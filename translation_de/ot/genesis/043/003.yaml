id: GEN.43.3
reference: Genesis 43:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: de
  text: 'Da sagte Juda zu ihm: »Der Mann hat uns eindringlich gewarnt[a]: ›Ihr dürft mir nicht vor die Augen kommen[b], wenn euer Bruder nicht bei euch ist.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »hat uns mit allem Nachdruck gewarnt« oder »hat uns unmissverständlich gewarnt«. Im Hebräischen wird das Verb durch eine zusätzliche Form desselben Verbs verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ihr dürft mein Gesicht nicht sehen.« Die Wendung bedeutet hier, dass sie nicht vor ihm erscheinen dürfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive Waw führt die Erzählung weiter; »Da« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Bezeichnet den Angeredeten, im Kontext Jakob.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Namensform.
- source_word: הָעֵד הֵעִד
  choice: hat uns eindringlich gewarnt
  rationale: Infinitivus absolutus und finite Verbform von עוד verstärken gemeinsam die Aussage. Im Kontext geht es um eine nachdrückliche Warnung, nicht um gerichtliches Zeugnis.
- source_word: בָּנוּ
  choice: uns
  rationale: Die Präposition wird im Deutschen idiomatisch durch das direkte Objekt des Verbs »warnen« wiedergegeben.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Bewahrt die gewöhnliche hebräische Bezeichnung für den ägyptischen Amtsträger.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Ihr dürft mir nicht vor die Augen kommen
  rationale: Gibt die bildhafte Wendung und ihre kontextuelle Bedeutung, vor jemandem zu erscheinen, in natürlichem Deutsch wieder.
- source_word: בִּלְתִּי
  choice: wenn ... nicht
  rationale: Drückt die ausschließende Bedingung im Deutschen natürlich aus; sinngleich mit »es sei denn« oder »ohne dass«.
- source_word: אֲחִיכֶם
  choice: euer Bruder
  rationale: Singular mit Pluralsuffix; gemeint ist Benjamin.
- source_word: אִתְּכֶם
  choice: bei euch ist
  rationale: Die hebräische Präpositionalphrase verlangt im Deutschen ein ergänztes Verb.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt anschaulich; die hebräische Verstärkung wird idiomatisch mit »eindringlich« wiedergegeben. Die Anredeformen stehen im Plural.
