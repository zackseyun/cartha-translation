base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: de
  text: Sie servierten ihm gesondert, seinen Brüdern gesondert und den Ägyptern, die mit ihm aßen, gesondert. Denn die Ägypter konnten nicht mit den Hebräern Brot essen[a]; das ist für die Ägypter ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »mit den Hebräern Brot essen«; die Wendung meint, gemeinsam mit ihnen eine Mahlzeit einzunehmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: sie servierten
  rationale: Das Verb bedeutet wörtlich »setzen/stellen/legen«; im Zusammenhang einer Mahlzeit bezeichnet es das Auftragen beziehungsweise Servieren der Speisen.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: gesondert / ebenfalls gesondert
  rationale: Die wiederholte Formulierung betont die räumliche und soziale Trennung der drei Tischgruppen. »Gesondert« gibt dies knapp und idiomatisch wieder.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: die mit ihm aßen
  rationale: Das Partizip wird als Relativsatz wiedergegeben; das Präteritum entspricht dem deutschen Erzählstil.
- source_word: לֹא יוּכְלוּן
  choice: konnten nicht
  rationale: Die Wendung bezeichnet hier eine durch gesellschaftliche beziehungsweise kultische Normen bedingte Unmöglichkeit, ohne deren genaue Ursache festzulegen.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: mit den Hebräern Brot essen
  rationale: Die hebräische Ausdrucksweise wird bewahrt; sie bezeichnet idiomatisch das gemeinsame Einnehmen einer Mahlzeit.
- source_word: תּוֹעֵבָה
  choice: ein Gräuel
  rationale: »Gräuel« wahrt die starke Wertung des hebräischen Begriffs und passt zu einem kulturell oder religiös Verabscheuten, ohne die Art des Tabus näher zu bestimmen.
- source_word: הַמִּצְרִים / הָעִבְרִים
  choice: die Ägypter / die Hebräer
  rationale: Die Volksbezeichnungen und ihr bestimmter Gebrauch werden im Deutschen natürlich wiedergegeben; der ethnische Gegensatz ist für die Aussage zentral.
theological_decisions:
- issue: Grund der getrennten Mahlzeit
  choice: Die starke Aussage eines ägyptischen Tabus wird beibehalten, ohne einen konkreten religiösen, rituellen oder sozialen Grund zu ergänzen.
  alternative: Das Tabu ausdrücklich als rituelle Unreinheit oder ethnische Verachtung erklären.
  rationale: Der hebräische Text nennt nur, dass gemeinsames Essen mit Hebräern für die Ägypter ein Gräuel ist; eine genauere Begründung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die dreifache Trennung der Tischgruppen wird entsprechend der hebräischen Wiederholung sichtbar gehalten. »Gräuel« bewahrt die Intensität des Ausgangstextes, ohne das nicht näher erklärte ägyptische Tabu konfessionell oder historisch zu spezifizieren.
