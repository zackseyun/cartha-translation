lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם קָחוּ
  choice: Nehmt auch euren Bruder mit
  rationale: Das Objektzeichen bleibt unübersetzt; וְ trägt hier im Zusammenhang additive Kraft. Das im Deutschen idiomatische trennbare Verb „mitnehmen“ gibt לקח samt dem Gedanken wieder, dass der Bruder sie begleiten soll, ohne seinen Namen in den Haupttext einzufügen.
- source_word: וְ/ק֖וּמוּ
  choice: macht euch auf
  rationale: Der pluralische Imperativ von קום bedeutet wörtlich „steht auf“. In einer Reiseaufforderung ist „macht euch auf“ natürlich, würdig und bewahrt den eigenen Aufforderungscharakter des Verbs.
- source_word: שׁ֥וּבוּ
  choice: kehrt … zurück
  rationale: Der pluralische Imperativ von שוב bezeichnet hier die Rückkehr an einen bereits besuchten Ort. „Zurückkehren“ ist im Deutschen die direkte und idiomatische Wiedergabe.
- source_word: אֶל הָ/אִישׁ
  choice: zu dem Mann
  rationale: אֶל bezeichnet das Ziel, und der bestimmte Ausdruck הָאִישׁ lautet „der Mann“. Die Übersetzung bewahrt diese Bezeichnung, statt den kontextuell gemeinten ägyptischen Amtsträger näher zu bestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Macht euch auf“ vermeidet das heute steife „erhebt euch“, während die Abfolge der beiden hebräischen Imperative erhalten bleibt.
