  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: de
  text: Nehmt doppelt so viel Geld mit und bringt auch das Geld zurück, das in die Öffnung eurer Säcke zurückgelegt worden war[a]; vielleicht war es ein Versehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Geld, das im Mund eurer Säcke zurückgelegt worden war“. Gemeint ist die Öffnung der Säcke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: doppelt so viel Geld
  rationale: מִשְׁנֶה bezeichnet hier zusammen mit כֶסֶף eine doppelte Geldmenge. Die Formulierung ist im Deutschen klarer und natürlicher als „doppeltes Geld“.
- source_word: קְחוּ בְיֶדְכֶם
  choice: Nehmt ... mit
  rationale: Die Wendung „in eurer Hand“ bezeichnet idiomatisch das Mitführen. „Mitnehmen“ gibt den Sinn in natürlichem modernem Deutsch wieder.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: das Geld, das ... zurückgelegt worden war
  rationale: Das passive Partizip bezeichnet Geld, das zurückgebracht beziehungsweise wieder hingelegt worden war. „Zurückgelegt“ passt zum Erzählzusammenhang, ohne zu unterstellen, die Brüder hätten es bereits zurückgegeben.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: oben in eure Säcke
  rationale: Wörtlich steht „an der Mündung eurer Säcke“. „Oben in eure Säcke“ bezeichnet verständlich die Öffnung beziehungsweise den oberen Bereich der Säcke; die konkrete hebräische Metapher bleibt in der Fußnote erhalten.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: sollt ihr wieder mitnehmen
  rationale: Der Hifil von שוב bedeutet hier „zurückbringen“. Im Zusammenhang ist gemeint, dass die Brüder das zurückgelegte Geld wieder nach Ägypten mitnehmen sollen. Die deutsche Formulierung vermeidet die missverständliche Aussage, sie sollten es bloß erneut an sich nehmen.
- source_word: אוּלַי
  choice: vielleicht
  rationale: „Vielleicht“ gibt die Unsicherheit natürlich und registergerecht wieder.
- source_word: מִשְׁגֶּה
  choice: ein Versehen
  rationale: Das Substantiv bezeichnet einen Irrtum oder Fehler. „Versehen“ passt besonders gut zu einer unbeabsichtigten Unregelmäßigkeit bei der Geldrückgabe und impliziert keine Täuschungsabsicht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige hebräische Wendung „in eurer Hand“ wird idiomatisch mit „mitnehmen“ wiedergegeben. Die ungewöhnliche Behältermetapher „Mündung der Säcke“ wird zugunsten unmittelbarer Verständlichkeit im Haupttext geglättet und in der Fußnote dokumentiert.
