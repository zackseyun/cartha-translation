  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Es geht um eine doppelte Geldsumme, um das in den Säcken vorgefundene zurückgegebene/zurückgelegte Geld und um die Möglichkeit eines Versehens. „Oben in eure Säcke“ ist jedoch keine angemessene Wiedergabe von בְּפִי אַמְתְּחֹתֵיכֶם („an/in der Öffnung eurer Säcke“). Außerdem sollte die Aufforderung תָּשִׁיבוּ klar als Zurückbringen des Geldes erscheinen, nicht nur als erneutes Mitnehmen.'
  naturalness: Die vorgeschlagene Haupttextformulierung ist grundsätzlich verständlich, doch „oben in eure Säcke zurückgelegt“ klingt räumlich ungenau und stilistisch holprig. „Bringt ... zurück“ und „in die Öffnung eurer Säcke“ sind im modernen Standarddeutsch klar und natürlich.
  terminology: „Doppelt so viel Geld“, „Versehen“ und „zurückgelegt worden war“ sind sachgerecht. Die Fußnote sollte die hebräische Behältermetapher korrekt als „Mund“ beziehungsweise idiomatisch als „Öffnung“ der Säcke abbilden und nicht die missverständliche Formulierung „an der Mündung“ als alleinige Erklärung verwenden.
  issues:
  - severity: medium
    issue: „oben in eure Säcke“ für בְּפִי אַמְתְּחֹתֵיכֶם
    rationale: Das Hebräische bezeichnet den „Mund“, also die Öffnung eines Sacks, nicht einen allgemein oberen Bereich oder eine Bewegung „in“ die Säcke. Die Formulierung verliert den konkreten Ortsbezug und ist im Deutschen unidiomatisch.
  - severity: medium
    issue: „sollt ihr wieder mitnehmen“ für תָּשִׁיבוּ
    rationale: Der Hifil von שוב fordert hier dazu auf, das vorgefundene Geld zurückzubringen. „Wieder mitnehmen“ kann lediglich das erneute An-sich-Nehmen ausdrücken; „zurückbringen“ stellt die Rückgabehandlung klarer dar.
  - severity: low
    issue: Fußnote verwendet „Mündung“ ohne idiomatische Erläuterung
    rationale: „Mündung“ kann bei Säcken im Deutschen befremdlich wirken. Die wörtliche Metapher sollte genannt und unmittelbar als „Öffnung“ erklärt werden.
  revised_text: Nehmt doppelt so viel Geld mit und bringt auch das Geld zurück, das in die Öffnung eurer Säcke zurückgelegt worden war[a]; vielleicht war es ein Versehen.
