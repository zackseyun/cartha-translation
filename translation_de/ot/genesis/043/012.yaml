- from: Nehmt doppelt so viel Geld mit. Auch das Geld, das oben in eure Säcke zurückgelegt worden war, sollt ihr wieder mitnehmen[a]; vielleicht war es ein Versehen.
  to: Nehmt doppelt so viel Geld mit und bringt auch das Geld zurück, das in die Öffnung eurer Säcke zurückgelegt worden war[a]; vielleicht war es ein Versehen.
  rationale: Die Revision ersetzt die räumlich unpräzise und unnatürliche Wendung „oben in eure Säcke“ durch „in die Öffnung eurer Säcke“ und gibt die Aufforderung zum Zurückbringen des Geldes eindeutig wieder. Die idiomatische Auslassung von „in eurer Hand“ im Haupttext ist vertretbar; die Fußnote bewahrt die hebräische Behältermetapher, ohne eine künstliche deutsche Formulierung aufzuzwingen.
