lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי leitet Judas begründende Erklärung ein; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: לוּלֵא
  choice: wenn … nicht
  rationale: לוּלֵא eröffnet eine irreale Bedingung der Vergangenheit, die im Deutschen idiomatisch mit „wenn … nicht … hätten“ ausgedrückt wird.
- source_word: הִתְמַהְמָהְנוּ
  choice: wir nicht gezögert hätten
  rationale: Das Verb kann ein Verzögern, Zögern oder längeres Verweilen bezeichnen. „gezögert“ passt zur aufgeschobenen Abreise und bewahrt die mögliche Nuance des Zauderns.
- source_word: כִּי עַתָּה
  choice: inzwischen schon
  rationale: In der irrealen Folgerung verweist die Wendung auf das, was bis zum jetzigen Zeitpunkt bereits geschehen wäre. „inzwischen schon“ gibt diese zeitliche Nuance natürlich wieder.
- source_word: שַׁבְנוּ
  choice: wären wir … zurückgekehrt
  rationale: Der hebräische Perfekt bezeichnet in dieser irrealen Konstruktion das Ergebnis, das bereits eingetreten wäre.
- source_word: זֶה פַעֲמָיִם
  choice: zweimal
  rationale: 'Die Wendung bedeutet hier idiomatisch „zweimal“: In der verstrichenen Zeit hätten sie die Reise bereits zweimal vollenden können.'
