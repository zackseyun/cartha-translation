  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: de
  text: Denn wenn wir nicht gezögert hätten[a], wären wir inzwischen schon zweimal zurückgekehrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns nicht aufgehalten hätten“ oder „nicht länger gewartet hätten“. Das hebräische Verb kann zögern, sich aufhalten oder verweilen bezeichnen.'
