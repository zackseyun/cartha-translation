  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: de
  text: Wenn du unseren Bruder mit uns schickst[a], werden wir hinabziehen und für dich Nahrung kaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du bereit bist, unseren Bruder mit uns zu schicken.“ Die hebräische Wendung mit יֵשׁ und einem Partizip kann sowohl die Bereitschaft als auch die Handlung selbst ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet schlicht die Bedingung ein, ohne eine im Hebräischen nicht ausdrücklich markierte Verstärkung hinzuzufügen.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: du ... mitschickst
  rationale: Die Verbindung aus יֵשׁ mit Personalsuffix und Partizip kann das tatsächliche Handeln oder die Bereitschaft dazu ausdrücken. Im deutschen Bedingungssatz ist „mitschickst“ natürlich und lässt die Bereitschaft implizit, während die mögliche ausdrückliche Lesart in der Fußnote erhalten bleibt.
- source_word: אֶת אָחִינוּ
  choice: unseren Bruder
  rationale: Gibt das Substantiv mit Suffix der 1. Person Plural direkt wieder und bewahrt den familiären Nachdruck.
- source_word: אִתָּנוּ
  choice: mit uns
  rationale: Bezeichnet eindeutig die Begleitung; zusammen mit „schicken“ ergibt sich im Deutschen idiomatisch „mitschicken“.
- source_word: נֵרְדָה
  choice: werden wir hinabziehen
  rationale: Der Kohortativ bezeichnet hier im Folgesatz die beabsichtigte, von der Bedingung abhängige Handlung. „Hinabziehen“ bewahrt die räumliche Perspektive der Erzählung und klingt im biblischen Erzählregister würdig.
- source_word: וְנִשְׁבְּרָה
  choice: und ... kaufen
  rationale: שׁבר bedeutet in diesem Versorgungskontext kaufen. Das Objekt folgt mit אֹכֶל, sodass keine Ergänzung wie „Getreide“ nötig ist.
- source_word: לְךָ
  choice: für dich
  rationale: Gibt den Dativ des Nutzens unmittelbar und natürlich wieder.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: Das hebräische Wort bezeichnet allgemein Essbares beziehungsweise Nahrung und ist hier nicht auf Getreide beschränkt.
