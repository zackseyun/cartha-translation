translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Hinabziehen“ bewahrt die geographisch-erzählerische Perspektive; „Nahrung“ entspricht dem allgemeinen אֹכֶל. Die echte Bedeutungsbreite der Konstruktion יֶשְׁךָ + Partizip wird durch die Fußnote offengehalten.
