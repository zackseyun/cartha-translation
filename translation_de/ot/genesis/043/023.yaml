source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ אֱלֹ֨הֵי/כֶ֜ם וֵֽ/אלֹהֵ֤י אֲבִי/כֶם֙ נָתַ֨ן לָ/כֶ֤ם מַטְמוֹן֙ בְּ/אַמְתְּחֹ֣תֵי/כֶ֔ם כַּסְפְּ/כֶ֖ם בָּ֣א אֵלָ֑/י וַ/יּוֹצֵ֥א אֲלֵ/הֶ֖ם אֶת שִׁמְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: de
  text: 'Er sagte: „Friede sei mit euch! Fürchtet euch nicht! Euer Gott und der Gott eures Vaters hat euch einen Schatz[a] in eure Säcke gegeben. Euer Silber[b] ist bei mir angekommen.“ Dann brachte er Simeon zu ihnen heraus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen verborgenen Schatz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Euer Geld“. Das hebräische Wort für „Silber“ kann auch Geld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Friede sei mit euch!
  rationale: Die knappe Friedenszusage dient hier der Beruhigung. Die ergänzte Verbform ist im Deutschen idiomatisch und bewahrt den Kern von שָׁלוֹם.
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht!
  rationale: Die geläufige deutsche Wendung gibt den negativen Imperativ prägnant und würdig wieder.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Euer Gott und der Gott eures Vaters
  rationale: אֱלֹהִים bezeichnet hier den einen Gott; der Singular „eures Vaters“ entspricht dem hebräischen Text und wird nicht zu „eurer Väter“ verallgemeinert.
- source_word: נָתַן לָכֶם
  choice: hat euch … gegeben
  rationale: 'Das deutsche Perfekt passt zur gegenwärtigen Folge der vollendeten Handlung: Der Schatz befindet sich nun in ihren Säcken.'
- source_word: מַטְמוֹן
  choice: einen Schatz
  rationale: Das Wort bezeichnet etwas Verborgenes oder Aufbewahrtes von Wert. „Schatz“ ist im Haupttext natürlich; die Bedeutungskomponente „verborgen“ wird in einer Fußnote bewahrt.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: in eure Säcke
  rationale: „Säcke“ passt zum Transport des Getreides und gibt den konkreten Gegenstand angemessen wieder.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Euer Silber ist bei mir angekommen
  rationale: „Silber“ bewahrt die konkrete hebräische Ausdrucksweise, während „bei mir angekommen“ die Bewegungsformulierung בָּא אֵלָי erhält, ohne sie zu „ich habe es erhalten“ umzudeuten.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Dann führte er Simeon zu ihnen heraus
  rationale: Der Hifil von יצא bedeutet „herausführen“. „Dann“ sorgt für einen natürlichen deutschen Erzählfluss.
theological_decisions:
- issue: Die Gottesbezeichnung in der Rede des Verwalters
  choice: Die Worte werden unmittelbar als Hinweis auf den Gott der Brüder und den Gott ihres Vaters wiedergegeben.
  alternative: Die Aussage könnte als bloße diplomatische Anpassung oder als persönliches Glaubensbekenntnis des Verwalters ausgelegt werden.
  rationale: Der hebräische Text gibt die Rede wieder, erklärt aber nicht die innere Überzeugung des Sprechers. Die Übersetzung lässt diese Frage offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und beruhigend; konkrete hebräische Bilder wie „Silber“ und „herausführen“ bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, auf den sie sich beziehen.
