  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: de
  text: Und sie bereiteten das Geschenk vor, bis Josef am Mittag kam; denn sie hatten gehört, dass sie dort eine Mahlzeit einnehmen würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot essen“; eine hebräische Wendung für das Einnehmen einer Mahlzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: sie bereiteten … vor
  rationale: Der Hifil des Verbs כון bezeichnet hier das Bereitmachen eines Gegenstands; „vorbereiten“ ist im modernen Deutschen natürlich und präzise.
- source_word: הַמִּנְחָה
  choice: das Geschenk
  rationale: מִנְחָה bezeichnet in diesem Erzählzusammenhang das Mitbringsel der Brüder für Josef, keine kultische Opfergabe.
- source_word: עַד בּוֹא יוֹסֵף
  choice: bis Josef … kam
  rationale: עַד mit dem Infinitiv בּוֹא gibt den Zeitraum bis zu Josefs Eintreffen an.
- source_word: בַּצָּהֳרָיִם
  choice: am Mittag
  rationale: Die Wendung bezeichnet die Mittagszeit; „am Mittag“ ist eine klare, natürliche deutsche Entsprechung.
- source_word: כִּי שָׁמְעוּ
  choice: denn sie hatten gehört
  rationale: Das erste כִּי ist kausal. Das Plusquamperfekt verdeutlicht, dass die Information ihrer Vorbereitung vorausging.
- source_word: כִּי שָׁם
  choice: dass sie dort
  rationale: Das zweite כִּי leitet den Inhalt des Gehörten ein; שָׁם bezeichnet den Ort.
- source_word: יֹאכְלוּ לָחֶם
  choice: eine Mahlzeit einnehmen würden
  rationale: Wörtlich „Brot essen“; die hebräische Wendung bezeichnet idiomatisch das Essen einer Mahlzeit. Die Übersetzung gibt den gemeinten Sinn in natürlichem Deutsch wieder, während die Fußnote den Wortlaut bewahrt.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Form gibt den hebräischen Namen יוֹסֵף wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hebräische Erzählanschluss wird mit „Und“ bewahrt; das kausale כִּי wird zur besseren deutschen Satzführung nach einem Semikolon mit „denn“ wiedergegeben.
