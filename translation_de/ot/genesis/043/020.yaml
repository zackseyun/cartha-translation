  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: de
  text: 'Da sagten sie: „Bitte, mein Herr[a], wir sind beim ersten Mal wirklich herabgekommen, um Lebensmittel zu kaufen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mein Herr“ ist hier die respektvolle Anrede eines menschlichen Höhergestellten, keine Gottesbezeichnung.
    reason: cultural_note
  - marker: b
    text: Die hebräische Verbindung eines Infinitivs mit dem finiten Verb verstärkt die Aussage („wir sind wirklich herabgekommen“). „Beim ersten Mal“ bezieht sich auf ihre erste Reise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das narrative וַ wird in natürlichem Deutsch mit „Da“ wiedergegeben und führt die direkte Rede im Erzählfluss fort.
- source_word: בִּי
  choice: Bitte
  rationale: Die Interjektion drückt hier eine höfliche, eindringliche Bitte aus; eine wörtliche Wiedergabe der Präposition wäre irreführend.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Respektvolle Anrede an einen menschlichen Höhergestellten; sie bewahrt den gehobenen sozialen Ton des Hebräischen.
- source_word: יָרֹד יָרַדְנוּ
  choice: wir sind … wirklich herabgekommen
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt die Aussage. „wirklich“ gibt diese Bekräftigung in idiomatischem Deutsch wieder.
- source_word: בַּתְּחִלָּה
  choice: damals
  rationale: Im Kontext bezeichnet der Ausdruck die frühere beziehungsweise erste Reise. „damals“ ist in der deutschen Rede natürlich; die genauere zeitliche Bedeutung wird in der Fußnote erläutert.
- source_word: לִשְׁבָּר
  choice: um … zu kaufen
  rationale: Das Verb bezeichnet hier das entgeltliche Beschaffen von Nahrung beziehungsweise Getreide.
- source_word: אֹכֶל
  choice: Lebensmittel
  rationale: Das Substantiv bedeutet allgemein Nahrung. „Lebensmittel“ wahrt diesen weiteren Sinn, ohne ihn auf Getreide zu verengen.
theological_decisions:
- issue: Bedeutung der Anrede אֲדֹנִי
  choice: Als respektvolle Anrede an einen menschlichen Höhergestellten verstanden
  alternative: Als Gottesbezeichnung verstanden
  rationale: Der unmittelbare Erzählzusammenhang richtet die Worte an Josefs Hausverwalter; eine göttliche Anrede liegt nicht vor.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede klingt höflich und eindringlich; die soziale Unterordnung bleibt erkennbar. Die hebräische Bekräftigung wird im Haupttext ausgedrückt, während die Fußnote Form und zeitliche Wendung transparent macht.
