review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft den Angstgrund, das zurückgegebene Geld, die schwierige idiomatische Wendung und den befürchteten Angriff im Wesentlichen. Allerdings bezieht die Formulierung „uns samt unseren Eseln zu Sklaven machen“ das Prädikat „zu Sklaven machen“ auch auf die Esel. Im Hebräischen sollen dagegen die Männer als Sklaven genommen und die Esel zusätzlich weggenommen werden.
  naturalness: „In Josefs Haus gebracht worden waren“ ist verständlich, aber „in Josefs Haus geführt worden waren“ ist im erzählerischen Kontext idiomatischer. Die überarbeitete Satzführung macht außerdem die mit den Infinitiven ausgedrückte Zweck- beziehungsweise Befürchtungsfolge klarer.
  terminology: „Sklaven“ gibt לַעֲבָדִים hier angemessen wieder. „Esel wegnehmen“ bildet die gesonderte Ergänzung וְאֶת־חֲמֹרֵינוּ präzise ab. Die Fußnote bewahrt die Unsicherheit der Wendung לְהִתְגֹּלֵל עָלֵינוּ, ohne sie übermäßig festzulegen.
  issues:
  - severity: high
    issue: Die Esel werden in der deutschen Fassung scheinbar ebenfalls „zu Sklaven“ gemacht.
    rationale: 'Die Verbindung „uns samt unseren Eseln zu Sklaven machen“ ordnet „samt unseren Eseln“ dem Infinitiv „zu Sklaven machen“ unter. Der hebräische Text unterscheidet jedoch: die Männer sollen als Sklaven genommen werden, und ihre Esel sollen weggenommen werden.'
  - severity: low
    issue: Die passive Ortsangabe ist unnötig schwerfällig.
    rationale: „In Josefs Haus geführt worden waren“ gibt das Hineinbringen natürlich und kontextgerecht wieder, ohne die passive Veranlassung des Hophal zu verlieren.
