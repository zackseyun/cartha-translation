  to: 'Die Männer bekamen Angst, weil sie in Josefs Haus geführt worden waren, und sagten: »Wegen des Geldes, das beim ersten Mal in unsere Säcke zurückgelegt worden war, werden wir hereingebracht, damit man einen Vorwand gegen uns findet[a], über uns herfällt, uns zu Sklaven macht und unsere Esel wegnimmt.«'
