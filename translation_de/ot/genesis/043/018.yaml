  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: de
  text: 'Die Männer bekamen Angst, weil sie in Josefs Haus geführt worden waren, und sagten: »Wegen des Geldes, das beim ersten Mal in unsere Säcke zurückgelegt worden war, werden wir hereingebracht, damit man einen Vorwand gegen uns findet[a], über uns herfällt, uns zu Sklaven macht und unsere Esel wegnimmt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Gelegenheit gegen uns suchen«. Die zugrunde liegende hebräische Wendung ist idiomatisch und in ihrer genauen Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: bekamen Angst
  rationale: Das narrative Verb bezeichnet ihre einsetzende Furcht; die Formulierung ist natürlich und gibt die Reaktion im Handlungsablauf wieder.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: in Josefs Haus gebracht worden waren
  rationale: Der Hophal von בוא ist kausativ-passiv; das Plusquamperfekt verdeutlicht, dass das Hineinbringen den Anlass ihrer Angst bildet.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: wegen des Geldes
  rationale: עַל דְּבַר bezeichnet hier den Grund oder Anlass ihrer befürchteten Behandlung.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: das wieder in unsere Säcke gelangt ist
  rationale: Die resultative Form von שוב besagt, dass das Geld zurückgekehrt bzw. wieder dort vorgefunden wurde, ohne ausdrücklich festzulegen, wer es zurücklegte.
- source_word: בַּתְּחִלָּה
  choice: beim ersten Mal
  rationale: Im Erzählzusammenhang verweist die Wendung auf die erste Ägyptenreise der Brüder.
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: werden wir hereingebracht
  rationale: Das passive Partizip vermittelt den gegenwärtigen, an ihnen vollzogenen Vorgang.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: einen Vorwand gegen uns finden
  rationale: Die schwierige idiomatische Wendung beschreibt wahrscheinlich das Schaffen oder Suchen eines feindseligen Anlasses gegen die Brüder.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: über uns herfallen
  rationale: Die Formulierung bewahrt das Bild des Fallens und gibt zugleich den feindlichen Angriff idiomatisch wieder.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: uns … zu Sklaven machen
  rationale: עֲבָדִים bezeichnet hier erzwungene Unfreiheit und nicht lediglich freiwilligen Dienst.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: samt unseren Eseln
  rationale: Die koordinierte Ergänzung besagt knapp, dass auch ihre Lasttiere weggenommen werden sollen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählsyntax. Die unbestimmte deutsche Formulierung »Man will« vermeidet es, ein im Hebräischen nicht ausdrücklich genanntes Subjekt festzulegen. Die Angst der Brüder und die schwierige feindselige Redewendung bleiben erkennbar, ohne die Unsicherheit zu überspielen.
