  verdict: revise
  source_fidelity: 'Der Entwurf gibt Satzbau und Sinn des Hebräischen insgesamt zuverlässig wieder: Josef sieht Benjamin in der Gruppe, befiehlt das Hereinführen der Männer, das Schlachten und Zubereiten eines Tieres und begründet dies mit dem gemeinsamen Essen zur Mittagszeit. »Heute Mittag« fügt jedoch ein im hebräischen Text nicht ausdrücklich markiertes deiktisches Element hinzu.'
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch. »Verwalter seines Hauses« ist gegenüber »Hausverwalter« etwas eindeutiger, da Letzteres im heutigen Deutsch auch einen Gebäudeverwalter bezeichnen kann.
  terminology: Josef und Benjamin sind korrekt. »Verwalter seines Hauses« gibt die Funktionsbezeichnung לַאֲשֶׁר עַל־בֵּיתוֹ angemessen wieder, ohne einen stärker institutionell geprägten Titel festzulegen. Die Fußnote wahrt die wörtliche Ausdrucksweise; die idiomatische Schlachtformel wird sachgerecht erklärt.
