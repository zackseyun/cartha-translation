  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: de
  text: 'Als Josef Benjamin bei ihnen sah, sagte er zu dem Verwalter seines Hauses[a]: »Führe die Männer ins Haus, schlachte ein Tier und bereite es zu[b]; denn die Männer werden zu Mittag mit mir essen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu dem, der über seinem Haus war«.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht die Redewendung »schlachte eine Schlachtung«; gemeint ist das Schlachten und Zubereiten eines Tieres für die Mahlzeit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: 'Das Qal wayyiqtol von ראה bezeichnet hier schlicht die Wahrnehmung: Josef bemerkte Benjamin bei den anderen.'
- source_word: אִתָּם
  choice: bei ihnen
  rationale: Die Präposition bezeichnet Benjamins Zugehörigkeit zur anwesenden Gruppe; »bei ihnen« ist im Deutschen natürlich und präzise.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: zu seinem Hausverwalter
  rationale: Wörtlich ist es »zu dem, der über seinem Haus war«. »Hausverwalter« gibt die Funktion knapp und in modernem Deutsch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: הָבֵא אֶת הָאֲנָשִׁים הַבָּיְתָה
  choice: Führe die Männer ins Haus
  rationale: Die Richtungsendung an הַבָּיְתָה bezeichnet die Bewegung hinein. Da die Männer zu Josef gebracht werden sollen, ist »führe ... ins Haus« natürlich.
- source_word: וּטְבֹחַ טֶבַח
  choice: schlachte ein Tier
  rationale: Die figura etymologica bedeutet idiomatisch, ein Tier für eine Mahlzeit zu schlachten. Die Tierart bleibt wie im Hebräischen unbestimmt.
- source_word: וְהָכֵן
  choice: bereite es zu
  rationale: Der Hifil-Imperativ von כון bedeutet »bereitmachen«. Im Zusammenhang bezieht er sich natürlich auf das geschlachtete Tier beziehungsweise die daraus bereitete Speise.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: denn die Männer werden ... mit mir essen
  rationale: כִּי begründet die Befehle; »mit mir essen« gibt אִתִּי יֹאכְלוּ direkt und idiomatisch wieder.
- source_word: בַּצָּהֳרָיִם
  choice: heute Mittag
  rationale: Das Wort bezeichnet die Mittagszeit. Im Deutschen verlangt die konkrete Mahlzeit idiomatisch oft »heute Mittag«; die zeitliche Einordnung ergibt sich aus der Erzählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Erzählweise. »Hausverwalter« vermeidet eine schwerfällige wörtliche Amtsbeschreibung. Die figura etymologica des Hebräischen wird idiomatisch wiedergegeben und in der Fußnote erläutert.
