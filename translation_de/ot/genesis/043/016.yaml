  - severity: low
    issue: »Hausverwalter«
    rationale: Die Wiedergabe ist möglich, kann im modernen Deutsch aber einen Verwalter eines Gebäudes nahelegen. »Verwalter seines Hauses« spiegelt die personale Zuständigkeit für Josefs Haus/Haushalt klarer wider.
