  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: de
  text: 'Als sie das Getreide aufgegessen hatten, das sie aus Ägypten mitgebracht hatten, sagte ihr Vater zu ihnen: »Geht zurück und kauft uns ein wenig zu essen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang ein. Im Deutschen gibt ein temporaler Nebensatz mit »Als« die Abfolge natürlich wieder, ohne das schwerfällige »Und es geschah, als«.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: sie ... aufgegessen hatten
  rationale: Die Verbindung von כלה mit dem Infinitiv bezeichnet den Abschluss des Essens beziehungsweise Verbrauchens. »Aufgegessen hatten« ist im Kontext von Vorräten natürlich und wahrt die Vorzeitigkeit.
- source_word: הַשֶּׁבֶר
  choice: das Getreide
  rationale: שֶׁבֶר bezeichnet in der Josefgeschichte das während der Hungersnot gekaufte Getreide und nicht bloß Nahrung im Allgemeinen.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: das sie aus Ägypten mitgebracht hatten
  rationale: Das Plusquamperfekt verdeutlicht, dass das Mitbringen dem Aufessen vorausging; »mitgebracht« entspricht hier natürlichem deutschem Sprachgebrauch.
- source_word: אֲבִיהֶם
  choice: ihr Vater
  rationale: Die Verwandtschaftsbezeichnung wird entsprechend dem Hebräischen beibehalten und nicht durch den Eigennamen Jakob ersetzt.
- source_word: שֻׁבוּ
  choice: Geht wieder hin
  rationale: Der Imperativ fordert zu einer erneuten Reise nach Ägypten auf. »Geht wieder hin« ist natürlich und bewahrt den Wiederholungsaspekt, ohne im Deutschen eine bereits genannte Zielangabe ergänzen zu müssen.
- source_word: שִׁבְרוּ
  choice: kauft
  rationale: Das Verb שׁבר bedeutet in diesem Zusammenhang, Getreide beziehungsweise Vorräte zu kaufen. Da anschließend ein ausdrückliches Objekt folgt, genügt das allgemeine Verb »kauft«.
- source_word: לָנוּ
  choice: uns
  rationale: Der Dativ wird in der natürlichen deutschen Wendung »kauft uns« direkt wiedergegeben.
- source_word: מְעַט אֹכֶל
  choice: ein wenig zu essen
  rationale: אֹכֶל ist der allgemeinere Ausdruck für Nahrung. »Ein wenig zu essen« unterscheidet ihn idiomatisch vom zuvor genannten spezifischen Getreide und gibt die geringe Menge wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede ist knapp und natürlich gehalten; die lexikalische Unterscheidung zwischen dem spezifischen »Getreide« und dem allgemeineren »zu essen« bleibt erhalten.
