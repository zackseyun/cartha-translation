source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: de
  text: 'Da sagte Juda zu seinem Vater Israel: „Schick den Jungen[a] mit mir. Dann wollen wir uns aufmachen und gehen, damit wir am Leben bleiben und nicht sterben – wir ebenso wie du und unsere kleinen Kinder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den jungen Mann“. Das hebräische Wort kann einen Jungen, einen Jugendlichen oder einen jungen Mann bezeichnen, nicht nur ein kleines Kind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt diesen Fortgang im modernen Deutschen natürlich wieder.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: zu seinem Vater Israel
  rationale: Bewahrt den im Hebräischen verwendeten Namen Israel und gibt das appositionelle Verhältnis idiomatisch deutsch wieder.
- source_word: שִׁלְחָה
  choice: Schick
  rationale: Der Imperativ ist eine direkte Aufforderung; die paragogische Endung erfordert im Deutschen keine eigene Wiedergabe.
- source_word: הַנַּעַר
  choice: den Jungen
  rationale: נער kann einen Jungen, Jugendlichen oder jungen Mann bezeichnen. „Den Jungen“ bewahrt Judas familiäre und fürsorgliche Redeweise; die mögliche Altersweite wird in der Fußnote kenntlich gemacht.
- source_word: אִתִּי
  choice: mit mir
  rationale: Gibt die Begleitung durch Juda und damit seine persönliche Verantwortungsübernahme direkt wieder.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Dann wollen wir uns aufmachen und gehen
  rationale: Die Kohortative drängen zu gemeinsamem Handeln. „Uns aufmachen und gehen“ bewahrt die zweigliedrige Form und klingt zugleich natürlich.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: damit wir am Leben bleiben und nicht sterben
  rationale: „Damit“ erfasst den Zweck beziehungsweise die erwartete Folge der Reise; die antithetische Formulierung des Hebräischen bleibt erhalten.
- source_word: גַּם אֲנַחְנוּ גַּם אַתָּה גַּם טַפֵּנוּ
  choice: wir ebenso wie du und unsere kleinen Kinder
  rationale: Die Formulierung bewahrt die nachdrückliche Einbeziehung aller drei Gruppen, ohne die wiederholte Partikel גם unnatürlich mechanisch nachzubilden.
- source_word: טַפֵּנוּ
  choice: unsere kleinen Kinder
  rationale: טף bezeichnet besonders die kleinen und schutzbedürftigen Angehörigen; „kleine Kinder“ gibt diese Bedeutung genauer wieder als das allgemeinere „Kinder“.
theological_decisions: []
