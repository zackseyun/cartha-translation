translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge der hebräischen Erzählverben bleibt erhalten; »Tragt das Essen auf« ist eine natürliche, kontextgerechte Wiedergabe des wörtlichen Befehls »Setzt/Stellt Brot hin«.
