  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: de
  text: 'Dann wusch er sich das Gesicht, kam heraus, beherrschte sich und sagte: »Tragt das Essen auf.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brot«; hier ist wahrscheinlich allgemeiner das Essen oder die Mahlzeit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: wusch er sich das Gesicht
  rationale: רחץ bedeutet gewöhnlich »waschen«; das idiomatische deutsche Reflexivgefüge gibt das Reinigen seines Gesichts nach dem Weinen natürlich wieder. Das morphologisch plurale פָּנִים wird bei einer Person als Singular »Gesicht« übersetzt.
- source_word: וַיֵּצֵא
  choice: kam heraus
  rationale: יצא bezeichnet das Hinausgehen oder Herauskommen. Hier kehrt Josef aus dem abgeschiedenen Raum zur Mahlzeit zurück; »kam heraus« passt zur Erzählperspektive.
- source_word: וַיִּתְאַפַּק
  choice: beherrschte sich
  rationale: Der Hitpael von אפק bezeichnet hier die bewusste Selbstbeherrschung nach starker Gefühlsregung. »Beherrschte sich« ist gegenwärtig, klar und bewahrt den aktiven Aspekt der Zurückhaltung.
- source_word: שִׂימוּ
  choice: Tragt … auf
  rationale: שׂים heißt wörtlich »setzen/stellen/legen«. Im Zusammenhang einer Mahlzeit bezeichnet der Imperativ das Auftragen beziehungsweise Bereitstellen des Essens.
- source_word: לָחֶם
  choice: das Essen
  rationale: לֶחֶם bedeutet wörtlich »Brot«, kann aber metonymisch Nahrung oder eine Mahlzeit bezeichnen. Im Bankettkontext gibt »das Essen« den gemeinten Umfang im Deutschen natürlich wieder.
