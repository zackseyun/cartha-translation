source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: de
  text: 'Da sagte ihr Vater Israel zu ihnen: „Wenn es denn so sein muss, dann tut Folgendes: Nehmt in euren Gefäßen etwas von den erlesenen Erzeugnissen des Landes[a] mit und bringt dem Mann ein Geschenk hinunter: ein wenig Balsam und ein wenig Honig[b], Würzharz und Ladanum[c], Pistazien und Mandeln.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von den besten Erträgen des Landes“. Der hebräische Ausdruck bezeichnet allgemein ausgewählte Landesprodukte, nicht nur Früchte.'
    reason: lexical_alternative
  - marker: b
    text: „Honig“ kann in manchen Zusammenhängen auch einen süßen Fruchtsirup bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Die genaue Bestimmung der hier mit „Würzharz“ und „Ladanum“ wiedergegebenen hebräischen Begriffe ist unsicher. Gemeint sind vermutlich aromatische Harze; vorgeschlagen wurden unter anderem Tragant und Ladanum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: ihr Vater Israel
  rationale: Bewahrt sowohl die Bezeichnung Jakob als „Israel“ als auch die Apposition, klingt im Deutschen aber natürlicher als „Israel, ihr Vater“.
- source_word: אִם כֵּן אֵפוֹא
  choice: Wenn es denn so sein muss
  rationale: Die Formulierung gibt die widerstrebende Zustimmung wieder, die über ein schlichtes „Wenn es so ist“ hinausgeht.
- source_word: זֹאת עֲשׂוּ
  choice: dann tut Folgendes
  rationale: Eine knappe, idiomatische Wiedergabe der Aufforderung, die zugleich auf die anschließenden Anweisungen vorausweist.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: etwas von den erlesenen Erzeugnissen des Landes
  rationale: Die seltene Wendung bezeichnet ausgewählte, geschätzte Landesprodukte und ist nicht sicher auf Früchte beschränkt.
- source_word: בִּכְלֵיכֶם
  choice: in euren Gefäßen
  rationale: כְּלִי ist eine allgemeine Bezeichnung für Gerät oder Behältnis; „Gefäße“ bleibt hinreichend offen und passt zum gehobenen Erzählstil.
- source_word: וְהוֹרִידוּ
  choice: bringt ... hinunter
  rationale: Bewahrt die räumliche Perspektive der Reise hinab nach Ägypten und verbindet sie im Deutschen natürlich mit dem Transport des Geschenks.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Bezeichnet den bereits bekannten ägyptischen Amtsträger, dessen Identität den Brüdern noch verborgen ist.
- source_word: מִנְחָה
  choice: ein Geschenk
  rationale: Im diplomatischen Zusammenhang ist „Geschenk“ natürlicher als das möglicherweise kultisch klingende „Opfergabe“ oder das politisch stärkere „Tribut“.
- source_word: מְעַט צֳרִי
  choice: ein wenig Balsam
  rationale: צֳרִי bezeichnet ein heilkräftiges beziehungsweise aromatisches Harz oder Balsam; „Balsam“ ist verständlich und traditionsnah.
- source_word: וּמְעַט דְּבַשׁ
  choice: ein wenig Honig
  rationale: „Honig“ ist die gewöhnliche Bedeutung, während die mögliche Bedeutung eines süßen Sirups in einer Fußnote erhalten bleibt.
- source_word: נְכֹאת
  choice: Würzharz
  rationale: Die botanische Identifizierung ist unsicher. „Würzharz“ gibt den aromatischen Charakter wieder, ohne eine bestimmte Pflanzenart zu behaupten.
- source_word: לֹט
  choice: Ladanum
  rationale: Das Wort wird häufig als Ladanum, ein aromatisches Harz der Zistrose, bestimmt. Da die Identifizierung nicht völlig sicher ist, wird dies durch eine Fußnote kenntlich gemacht.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: Pistazien und Mandeln
  rationale: Gibt die allgemein anerkannten botanischen Bezeichnungen präzise und verständlich wieder.
