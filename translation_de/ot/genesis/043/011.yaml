  source_fidelity: 'Der Text gibt die hebräische Satzfolge und den Sinn zuverlässig wieder: Israels widerwillige Einwilligung, die Auswahl der Landeserzeugnisse, das Hinabbringen nach Ägypten, das Geschenk sowie die Warenliste bleiben erhalten. „Erlesene Erzeugnisse des Landes“ wahrt die bewusst breite Bedeutung von מִזִּמְרַת הָאָרֶץ. Die unsicheren Benennungen נְכֹאת und לֹט werden nicht übermäßig festgelegt, da die Fußnote die Unsicherheit ausdrücklich sichert.'
