  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: de
  text: Isaak säte in jenem Land und erzielte in jenem Jahr einen hundertfachen Ertrag[a]. Jahwe segnete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fand hundert Maße“. Die hebräische Ertragsformel ist nicht eindeutig; sie bezeichnet offenbar einen außergewöhnlich reichen Ertrag, möglicherweise hundertmal so viel wie die Aussaat.'
    reason: lexikalische Alternative und Erläuterung einer unsicheren idiomatischen Wendung
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: säte
  rationale: Das Verb זרע bezeichnet im landwirtschaftlichen Zusammenhang das Aussäen von Saatgut; „säte“ gibt das Bild direkt und natürlich wieder.
- source_word: בָּאָרֶץ הַהִוא
  choice: in jenem Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet, in dem Isaak sich aufhielt. „Land“ bleibt nah am Hebräischen, ohne einen politischen Sinn zu erzwingen.
- source_word: וַיִּמְצָא ... מֵאָה שְׁעָרִים
  choice: erzielte ... einen hundertfachen Ertrag
  rationale: מצא bedeutet grundsätzlich „finden“, bezeichnet hier zusammen mit der Ertragsangabe jedoch idiomatisch das Erlangen eines Ernteertrags. Diese Formulierung ist im Deutschen verständlich und bewahrt den landwirtschaftlichen Zusammenhang.
- source_word: בַּשָּׁנָה הַהִוא
  choice: in jenem Jahr
  rationale: Die Wendung wird sachlich und formal nah als zeitliche Angabe wiedergegeben.
- source_word: מֵאָה שְׁעָרִים
  choice: einen hundertfachen Ertrag
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet einen außergewöhnlich reichen Ertrag, wohl im Verhältnis zur Aussaat. Die Übersetzung vermittelt diesen Sinn, ohne eine bestimmte antike Maßeinheit festzulegen.
- source_word: וַיְבָרֲכֵהוּ
  choice: segnete ihn
  rationale: ברך ist das übliche Verb für „segnen“. Die Wiedergabe bewahrt die ausdrückliche theologische Aussage, dass Isaaks Gedeihen auf Gottes Segen zurückgeführt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Ausdruck des landwirtschaftlichen Ergebnisses
  choice: erzielte ... einen hundertfachen Ertrag
  alternative: fand hundert Maße / fand hundertfach
  rationale: Die Grundbedeutung „finden“ bleibt in der Fußnote sichtbar; im Haupttext wird der idiomatische landwirtschaftliche Sinn in natürlichem Deutsch ausgedrückt, ohne die anschließende Aussage über Gottes Segen vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Kette von Hauptsätzen; die ungewöhnliche hebräische Ertragsformel wird im Text verständlich und in der Fußnote formal näher wiedergegeben.
