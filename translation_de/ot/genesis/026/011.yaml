review_pass:
  verdict: revise
  source_fidelity: 'Der Satzbau und die wesentlichen Bezüge sind zutreffend wiedergegeben: Abimelech richtet einen autoritativen Befehl an die gesamte Bevölkerung; das generische Partizip meint jede Person, die Isaak oder Rebekka anrührt. „Oder“ ist im Deutschen in diesem verbietenden/distributiven Zusammenhang idiomatisch, obwohl im Hebräischen וְ steht. Die Schlussformel sollte jedoch die explizite Tötungsstrafe des passiven יוּמָת unmittelbarer ausdrücken.'
  naturalness: „Darauf befahl Abimelech dem ganzen Volk“ und die direkte Rede sind flüssiges, modernes Standarddeutsch. „Muss mit dem Tod bestraft werden“ ist verständlich, wirkt aber etwas verwaltungs- bzw. urteilsförmig und kann den Vollzug gegenüber dem hebräischen „wird getötet werden“ abschwächen. „Muss unbedingt getötet werden“ ist klar, natürlich und bewahrt die Nachdrücklichkeit.
  terminology: „Befahl“, „dem ganzen Volk“, „anrührt“ und „seine Frau“ sind angemessen. „Getötet werden“ gibt die passive Form und den Charakter einer angeordneten Todesstrafe präziser wieder als die abstraktere Wendung „mit dem Tod bestraft werden“.
  issues:
