  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: de
  text: 'Darauf befahl Abimelech dem ganzen Volk: „Wer diesen Mann oder seine Frau anrührt, muss unbedingt getötet werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: Das Piel von צוה bezeichnet einen verbindlichen, autoritativen Befehl; „befahl“ gibt diese Kraft natürlich wieder.
- source_word: כָּל הָעָם
  choice: dem ganzen Volk
  rationale: עם bezeichnet hier die gesamte Bevölkerung unter Abimelechs Herrschaft; „dem ganzen Volk“ ist verständlich und umfassend, ohne eine ethnische Nation vorauszusetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der quotative Infinitiv leitet den Inhalt des Befehls ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als ein zusätzliches „und sagte“.
- source_word: הַנֹּגֵעַ
  choice: Wer … anrührt
  rationale: 'Das substantivierte Partizip mit Artikel ist generisch: „derjenige, der“ beziehungsweise idiomatisch „wer“. „Anrührt“ bewahrt den schlichten Sinn von נגע, ohne eine gewaltsame Handlung ausdrücklich hineinzulesen.'
- source_word: בָּאִישׁ הַזֶּה וּבְאִשְׁתּוֹ
  choice: diesen Mann oder seine Frau
  rationale: ב markiert nach נגע die berührte Person. Das deutsche „anrühren“ regiert den Akkusativ; die Verbindung wird im Kontext sinnvoll mit „oder“ wiedergegeben.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Infinitivus absolutus plus passives Hofal verstärkt die Gewissheit der angeordneten Strafe. Die Formulierung wahrt den passiven, rechtlichen Charakter einer Hinrichtung und klingt in modernem Deutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und autoritativ; unnötige Archaismen wie „des Todes sterben“ oder missverständliches „soll des Todes sein“ werden vermieden.
