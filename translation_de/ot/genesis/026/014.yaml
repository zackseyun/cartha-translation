  text: וַֽ/יְהִי ל֤/וֹ מִקְנֵה צֹאן֙ וּ/מִקְנֵ֣ה בָקָ֔ר וַ/עֲבֻדָּ֖ה רַבָּ֑ה וַ/יְקַנְא֥וּ אֹת֖/וֹ פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: de
  text: Er besaß Schaf- und Ziegenherden, Rinderherden und zahlreiche Arbeitskräfte[a], und die Philister beneideten ihn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und viel Arbeit/Dienst“; gemeint sein kann auch eine große Dienerschaft oder Belegschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf ihn eifersüchtig waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Er besaß
  rationale: Die hebräische Existenzkonstruktion היה + ל drückt Besitz aus; „er besaß“ ist eine natürliche und würdige deutsche Entsprechung.
- source_word: מִקְנֵה צֹאן
  choice: Schaf- und Ziegenherden
  rationale: צֹאן bezeichnet Kleinvieh und kann sowohl Schafe als auch Ziegen umfassen; die ausdrückliche Wiedergabe vermeidet die Verengung auf Schafe.
- source_word: וּמִקְנֵה בָקָר
  choice: Rinderherden
  rationale: בָקָר bezeichnet Rindvieh; „Rinderherden“ gibt den kollektiven Viehbestand idiomatisch wieder.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: zahlreiche Arbeitskräfte
  rationale: עֲבֻדָּה kann Arbeit, Dienst oder die damit befasste Dienerschaft bezeichnen. Im Zusammenhang mit umfangreichem Viehbesitz liegt ein großer Arbeits- beziehungsweise Dienstkräftebestand nahe, ohne dass das Hebräische ausschließlich „Diener“ sagt.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: sodass die Philister ihn beneideten
  rationale: קנא bezeichnet hier angesichts von Isaaks Besitz Neid oder Eifersucht. „Beneideten“ passt im Deutschen am besten zum wirtschaftlichen Zusammenhang; „sodass“ macht den im Erzählzusammenhang naheliegenden Folgebezug verständlich.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung der Volksgruppe.
theological_decisions: []
