  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: de
  text: Im Land herrschte eine Hungersnot – abgesehen von der ersten Hungersnot, die es zur Zeit Abrahams gegeben hatte. Da ging Isaak zu Abimelech, dem König der Philister, nach Gerar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: Im Land herrschte eine Hungersnot
  rationale: Die idiomatische deutsche Wendung gibt das hebräische Existenz- und Situationsgefüge natürlich wieder; אֶרֶץ bezeichnet hier das Land bzw. die Region, nicht die ganze Erde.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: zusätzlich zu der ersten Hungersnot
  rationale: מִלְּבַד grenzt diese Hungersnot von der früheren ab und stellt sie zugleich als eine weitere dar. רִאשׁוֹן wird entsprechend seiner ordinalen Bedeutung mit »erste« wiedergegeben.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: die es zur Zeit Abrahams gegeben hatte
  rationale: Die relative Bestimmung verweist auf ein gegenüber der Erzählgegenwart früheres Ereignis; das Plusquamperfekt bildet diesen Rückbezug im Deutschen klar ab.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: Da ging Isaak
  rationale: Das Wayyiqtol führt die Handlung weiter. »Da« stellt den erzählerischen Anschluss her, ohne einen ausdrücklich kausalen Zusammenhang stärker zu behaupten, als der hebräische Text ihn formuliert.
- source_word: אֶל אֲבִימֶּלֶךְ מֶלֶךְ פְּלִשְׁתִּים
  choice: zu Abimelech, dem König der Philister
  rationale: אֶל bezeichnet die Bewegung zu einer Person; die Apposition macht Abimelechs Titel und Herrschaftsbereich im Deutschen eindeutig.
- source_word: גְּרָרָה
  choice: nach Gerar
  rationale: Die Ortsbezeichnung trägt die direktionale Endung ה־ und bezeichnet daher ausdrücklich die Bewegung in Richtung Gerar.
theological_decisions:
- issue: Historisch-ethnische Bezeichnung פְּלִשְׁתִּים
  choice: Philister
  alternative: philistäisches Volk
  rationale: Der Ausdruck ist hier eine ethnisch-politische Bezeichnung ohne besondere theologische Titelbedeutung; »Philister« ist die geläufige und genaue deutsche Wiedergabe.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Gedankenstrich gliedert die längere Situationsangabe lesefreundlich. »Nach Gerar« bewahrt die im Hebräischen ausdrücklich markierte Bewegungsrichtung; eine Fußnote ist deshalb nicht erforderlich.
