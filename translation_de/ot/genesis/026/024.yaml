id: GEN.26.24
reference: Genesis 26:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: de
  text: 'In jener Nacht erschien ihm Jahwe und sagte: „Ich bin der Gott deines Vaters Abraham. Fürchte dich nicht[a], denn ich bin mit dir. Ich werde dich segnen und deine Nachkommen zahlreich machen[b] um meines Dieners Abraham willen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hab keine Angst.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deinen Samen vermehren“; das hebräische Wort „Same“ bezeichnet hier kollektiv die Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen des hebräischen Textes, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: וַיֵּרָא אֵלָיו
  choice: erschien ihm
  rationale: Das Nifal von ראה bezeichnet hier eine sichtbare Erscheinung oder Offenbarung; „erschien ihm“ ist direkt und idiomatisch.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Die Formulierung gibt den zeitlichen Ausdruck samt Demonstrativ natürlich und würdig wieder.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Ich bin der Gott deines Vaters Abraham
  rationale: Diese deutsche Wortstellung gibt die Identifizierung Abrahams als Isaaks Vater klar wieder und bewahrt die bundesgeschichtliche Selbstvorstellung Gottes.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die knappe Form entspricht dem Verbot mit אַל und passt zum würdigen Ton göttlicher Zusicherung; die alltagssprachlichere Alternative wird in einer Fußnote genannt.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: denn ich bin mit dir
  rationale: כִּי begründet hier die Aufforderung, sich nicht zu fürchten; „denn“ macht diesen Zusammenhang deutlich.
- source_word: וּבֵרַכְתִּיךָ
  choice: Ich werde dich segnen
  rationale: Die Verbform hat im Zusammenhang der Verheißung Zukunftsbezug und wird im Deutschen natürlich mit „werde“ wiedergegeben.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: und deine Nachkommen zahlreich machen
  rationale: Die Wiedergabe erfasst sowohl den kausativen Sinn des Hifil von רבה als auch den kollektiven Sinn von זֶרַע, ohne im Deutschen unnatürlich zu klingen.
- source_word: בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: um meines Dieners Abraham willen
  rationale: Die Wendung bewahrt den begründenden beziehungsweise begünstigenden Sinn von בַּעֲבוּר und den Zusammenhang der Verheißung mit Abraham.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im Kontext bezeichnet עֶבֶד Abrahams Bundesbeziehung und Dienststellung gegenüber Gott; „Diener“ ist daher angemessener als „Sklave“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Grundlage der Segensverheißung in בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: um meines Dieners Abraham willen
  alternative: wegen meines Dieners Abraham
  rationale: Die gewählte Formulierung hält fest, dass Gottes Zusage an Isaak mit Abraham verbunden ist, ohne die genaue Art dieses Zusammenhangs über den Wortlaut hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in einem natürlichen, würdigen Erzählton. Der Gottesname wird als „Jahwe“ wiedergegeben. Die Rede bleibt knapp und feierlich; weniger geläufige wörtliche Alternativen werden in Fußnoten erläutert.
