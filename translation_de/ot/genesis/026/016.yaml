  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: de
  text: 'Da sagte Abimelech zu Isaak: »Geh fort von uns, denn du bist viel mächtiger geworden als wir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Da sagte« gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname folgt der etablierten deutschen Bibelschreibung.
- source_word: אֶל יִצְחָק
  choice: zu Isaak
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; »Isaak« ist die etablierte deutsche Namensform.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Geh fort von uns
  rationale: Der Imperativ von הלך und die Trennungsangabe מֵעִמָּנוּ werden durch die natürliche deutsche Wendung »Geh fort von uns« wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den Befehl ein. »Denn« ist in direkter Rede klar, würdevoll und idiomatisch.
- source_word: עָצַמְתָּ
  choice: du bist ... mächtiger geworden
  rationale: עצם bezeichnet hier ein Stark- oder Mächtigwerden. »Mächtiger geworden« wahrt sowohl den resultativen Vorgang als auch die durch מִמֶּנּוּ ausgedrückte Vergleichsrelation.
- source_word: מִמֶּנּוּ מְאֹד
  choice: viel ... als wir
  rationale: מִן wird komparativ gebraucht, während מְאֹד den Grad verstärkt; im Deutschen ergibt sich idiomatisch »viel mächtiger ... als wir«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller direkter Rede. Die Formulierung bleibt nahe an der hebräischen Vergleichskonstruktion, ohne unnatürlich wörtlich zu wirken.
