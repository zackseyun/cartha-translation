  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: de
  text: weil Abraham auf meine Stimme hörte[a] und meine Anordnung, meine Gebote, meine Satzungen und meine Weisungen[b] befolgte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Stimme gehorchte“. Die hebräische Wendung „auf meine Stimme hören“ bezeichnet häufig gehorsames Hören.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Gesetze“. Das hebräische Wort Tora kann je nach Zusammenhang „Weisung“, „Unterweisung“ oder „Gesetz“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: weil
  rationale: Die Konjunktion gibt den begründenden Zusammenhang zum vorangehenden Segensversprechen natürlich und präzise wieder.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: auf meine Stimme hörte
  rationale: Die deutsche Wendung bewahrt das akustische Bild des Hebräischen und vermittelt im Kontext zugleich gehorsames Hören.
- source_word: וַיִּשְׁמֹר
  choice: befolgte
  rationale: Bei den nachfolgenden verpflichtenden und rechtlichen Begriffen gibt „befolgte“ den Sinn von halten, beachten oder einhalten in heutigem Deutsch idiomatisch wieder.
- source_word: מִשְׁמַרְתִּי
  choice: meine Anordnung
  rationale: Der Ausdruck bezeichnet das, was jemandem zur Beachtung anvertraut oder auferlegt ist. „Anordnung“ hält ihn von den folgenden Geboten, Satzungen und Weisungen unterscheidbar.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: „Gebote“ ist die klare und geläufige deutsche Wiedergabe des rechtlich-bundestheologischen Begriffs.
- source_word: חֻקּוֹתַי
  choice: meine Satzungen
  rationale: „Satzungen“ bewahrt die Unterscheidung zu Geboten und Weisungen und entspricht dem festgesetzten Charakter des hebräischen Ausdrucks.
- source_word: וְתוֹרֹתָי
  choice: und meine Weisungen
  rationale: Der Plural „Weisungen“ bildet den hebräischen Plural ab und bewahrt die Grundbedeutung von תּוֹרָה als Unterweisung, ohne den rechtlichen Sinn im Kontext auszuschließen.
theological_decisions:
- issue: Häufung rechtlich-bundestheologischer Begriffe vor der Sinaioffenbarung
  choice: 'Die vier unterscheidbaren Begriffe bleiben vollständig erhalten: Anordnung, Gebote, Satzungen und Weisungen.'
  alternative: Die Reihe zu „meinen Vorschriften und Gesetzen“ zusammenzufassen oder תּוֹרָה ausschließlich als „Gesetze“ wiederzugeben.
  rationale: Die Häufung unterstreicht Abrahams umfassenden Gehorsam. Ihre Beibehaltung wahrt zugleich die Spannung, dass solche Begriffe bereits vor dem Sinai auf Abraham bezogen werden, ohne diese Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des einleitenden „weil“ bewusst an den vorangehenden Kontext gebunden. Die vier hebräischen Pflicht- und Rechtsbegriffe werden nicht eingeebnet; „befolgte“ sorgt trotz der Reihung für natürliche Verständlichkeit.
