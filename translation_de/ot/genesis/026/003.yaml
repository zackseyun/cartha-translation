source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: de
  text: Halte dich als Fremder in diesem Land auf[a]. Ich werde mit dir sein und dich segnen; denn dir und deinen Nachkommen[b] werde ich alle diese Länder geben, und ich werde den Eid bestätigen[c], den ich deinem Vater Abraham geschworen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lebe als Fremder in diesem Land.“ Das hebräische Verb bezeichnet den Aufenthalt als Fremder oder vorübergehend Ansässiger.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Samen“. Das hebräische Wort wird hier kollektiv für die Nachkommenschaft gebraucht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bekräftigen“, „aufrichten“ oder „erfüllen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Halte dich als Fremder auf
  rationale: Das Verb bezeichnet den Aufenthalt als Schutzbürger, Fremder oder vorübergehend Ansässiger. Die Formulierung bewahrt diese Nuance und ist im modernen Deutschen verständlich.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: אֶרֶץ bezeichnet hier das geografische Land im Zusammenhang der Verheißung.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: Ich werde mit dir sein
  rationale: Die Formulierung gibt die Zusage göttlicher Gegenwart unmittelbar und ohne erklärende Erweiterung wieder.
- source_word: וַאֲבָרְכֶךָ
  choice: und dich segnen
  rationale: Der deutsche Infinitiv schließt sich natürlich an das gemeinsame Hilfsverb „werde“ an und führt die Verheißung fort.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung der Aufforderung und Zusage ein.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: dir und deinen Nachkommen
  rationale: זֶרַע ist hier ein Kollektivbegriff. „Nachkommen“ gibt den gemeinten familiären Gesamtbezug im Deutschen natürlich wieder; die wörtliche Bildsprache wird in einer Fußnote dokumentiert.
- source_word: אֶתֵּן
  choice: werde ich ... geben
  rationale: Dies gibt die zukünftige göttliche Zusage direkt wieder.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: alle diese Länder
  rationale: Der Plural meint die verschiedenen in den Blick genommenen Gebiete und bewahrt zugleich den lexikalischen Bezug zum vorherigen „Land“.
- source_word: וַהֲקִמֹתִי
  choice: So werde ich ... bekräftigen
  rationale: Der Hifil von קום bezeichnet hier das Aufrichten, Bestätigen oder Inkraftsetzen eines bereits geschworenen Eides. „Bekräftigen“ ist natürlich und lässt offen, auf welche Weise Gott ihn verwirklicht.
- source_word: הַשְּׁבֻעָה
  choice: den Eid
  rationale: Das Substantiv bezeichnet ausdrücklich einen Eid und nicht nur allgemein eine Verheißung.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: den ich ... geschworen habe
  rationale: Die idiomatische deutsche Relativkonstruktion bewahrt Wortspiel und Sachbezug zwischen Eid und Schwören.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: deinem Vater Abraham
  rationale: Diese im Deutschen natürliche Wortstellung identifiziert Abraham eindeutig als Isaaks Vater und wahrt die Kontinuität der Zusage.
theological_decisions:
- issue: Wiedergabe der eidlich bekräftigten Verheißung
  choice: So werde ich den Eid bekräftigen, den ich deinem Vater Abraham geschworen habe
  alternative: Und ich werde den Eid aufrichten / bestätigen / erfüllen, den ich Abraham, deinem Vater, geschworen habe
  rationale: „Bekräftigen“ bewahrt die feierliche Verbindlichkeit, ohne den Ausdruck technisch als Bundesschluss zu erweitern oder die Bedeutung ausschließlich auf die vollständige Erfüllung festzulegen.
- issue: Kollektiver und formal singularischer Charakter von זֶרַע
  choice: Nachkommen
  alternative: Same / Nachkommenschaft
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Wort Isaaks Nachkommenschaft kollektiv. Die Fußnote bewahrt die wörtliche Form „Same“, ohne eine mögliche weiterführende kanonische Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Halte dich als Fremder ... auf“ bewahrt eine im Ausgangstext wichtige Nuance, ohne das altertümliche „weilen“ zu verwenden. Die Satzgliederung vermeidet einen überlangen deutschen Satz und stellt mit „So“ den sachlichen Zusammenhang zwischen Landgabe und Bekräftigung des Eides her.
