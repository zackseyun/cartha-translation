lexical_decisions:
- source_word: אִם
  choice: dass
  rationale: Im Zusammenhang mit der in Vers 28 eingeleiteten Schwur- und Bundesforderung gibt אִם wahrscheinlich den Inhalt der verlangten Zusage wieder. »Dass« setzt diese Funktion im Deutschen natürlich fort; die wörtliche bedingende Lesart wird in einer Fußnote bewahrt.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: du uns nichts Böses antust
  rationale: Die Verbindung bedeutet, jemandem Böses beziehungsweise Schaden zuzufügen. »Nichts Böses antun« ist im heutigen Deutsch idiomatisch und passt zum Nichtangriffskontext.
- source_word: נְגַעֲנוּךָ
  choice: wir dich nicht angerührt
  rationale: נגע bedeutet zunächst »berühren«, kann hier aber schädigendes Antasten einschließen. »Angerührt« bewahrt das konkrete Bild und die behauptete Zurückhaltung der Sprecher.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: dir nur Gutes getan
  rationale: Die Formulierung gibt das emphatische רַק טוֹב knapp und idiomatisch wieder.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: dich in Frieden ziehen lassen haben
  rationale: Obwohl שׁלח auch »fortschicken« heißen kann, trifft »ziehen lassen« hier die behauptete friedliche Entlassung, ohne die Handlung unnötig zu verschärfen. »In Frieden« bewahrt den relationalen Klang von שָׁלוֹם.
- source_word: אַתָּה עַתָּה בְּרוּךְ יְהוָה
  choice: Jetzt bist du von Jahwe gesegnet
  rationale: Die deutsche Passivform gibt das Partizip בְּרוּךְ natürlich wieder; »Jahwe« überträgt den im Text stehenden Gottesnamen יְהוָה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Behauptung der Abimelech-Gruppe, sie habe Isaak nur Gutes getan
  choice: als direkte Rede ohne erklärende Abschwächung bewahrt
  alternative: durch eine wertende Formulierung als beschönigende oder unwahre Behauptung kennzeichnen
  rationale: Der Vers gibt die Selbstdarstellung der Sprecher wieder, obwohl der größere Erzählzusammenhang Spannungen dazu erkennen lässt. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist als Fortsetzung der in Vers 28 begonnenen Bundesforderung formuliert. Die direkte Rede behält die spannungsreiche Selbstdarstellung der Sprecher bei.
