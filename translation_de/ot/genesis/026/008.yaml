  text: וַ/יְהִ֗י כִּ֣י אָֽרְכוּ ל֥/וֹ שָׁם֙ הַ/יָּמִ֔ים וַ/יַּשְׁקֵ֗ף אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽ/חַלּ֑וֹן וַ/יַּ֗רְא וְ/הִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: de
  text: Als er schon lange dort gewesen war, blickte Abimelech, der König der Philister, durch das Fenster hinaus. Da sah er, wie Isaak mit seiner Frau Rebekka scherzte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist mit dem Namen Isaak verwandt und kann scherzendes, spielerisches oder zärtlich-intimes Verhalten bezeichnen. Hier verriet das Verhalten, dass Rebekka seine Frau war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als
  rationale: Die Verbindung eröffnet einen neuen Erzählabschnitt und führt zugleich den zeitlichen Umstand ein. Im modernen Deutschen gibt „Als“ diese Funktion natürlich wieder, ohne die hebräische Erzählformel schwerfällig nachzubilden.
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: er schon lange dort gewesen war
  rationale: Die wörtliche Vorstellung, dass sich ihm dort die Tage verlängerten, bezeichnet idiomatisch einen längeren Aufenthalt.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: blickte ... durch das Fenster hinaus
  rationale: Das Verb bezeichnet das Schauen von einem erhöhten oder umschlossenen Standort aus; zusammen mit בְּעַד הַחַלּוֹן ist diese Formulierung im Deutschen natürlich und quellennah.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Da sah er, wie
  rationale: „Da“ markiert die überraschende Wahrnehmung, die הִנֵּה im Erzählfluss hervorhebt, ohne das im heutigen Deutsch markierte „siehe“ zu verwenden.
- source_word: מְצַחֵק
  choice: scherzte
  rationale: Das Partizip von צחק bezeichnet hier spielerisches oder vertraulich-intimes Verhalten und spielt zugleich auf Isaaks Namen an. „Scherzte“ bewahrt die Grundbedeutung und lässt die im Kontext nötige Intimität offen; die Fußnote erläutert die Spannweite.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: mit seiner Frau Rebekka
  rationale: Obwohl אֵת formal den direkten Gegenstand markiert, verlangt „scherzen“ im Deutschen die Präposition „mit“. Die Apposition אִשְׁתּוֹ wird natürlich als „seiner Frau“ wiedergegeben.
