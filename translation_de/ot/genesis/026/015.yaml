source:
  edition: WLC
  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: de
  text: Und alle Brunnen, die die Diener seines Vaters zur Zeit seines Vaters Abraham gegraben hatten, verstopften die Philister und füllten sie mit Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Erdreich« beziehungsweise »mit Staub«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Und alle Brunnen
  rationale: Das einleitende וְ verbindet den Satz mit der vorausgehenden Erzählung; כָל und der bestimmte Artikel werden mit »alle Brunnen« wiedergegeben.
- source_word: אֲשֶׁר חָפְרוּ
  choice: die … gegraben hatten
  rationale: Der Relativsatz bezieht sich auf die Brunnen; das Plusquamperfekt macht verständlich, dass das Graben vor dem Verstopfen geschah.
- source_word: עַבְדֵי אָבִיו
  choice: die Diener seines Vaters
  rationale: עֶבֶד kann je nach Zusammenhang »Diener« oder »Sklave« bedeuten. Hier wird der rechtliche Status nicht hervorgehoben; »Diener« bewahrt die Offenheit angemessen.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: zur Zeit seines Vaters Abraham
  rationale: Die idiomatische deutsche Wiedergabe wahrt sowohl den zeitlichen Bezug als auch die im Hebräischen wiederholte Bezeichnung Abrahams als sein Vater.
- source_word: סִתְּמוּם
  choice: verstopften … sie
  rationale: Das Verb bezeichnet das Verschließen oder Blockieren, besonders eines Brunnens; »verstopfen« ist hier konkret und idiomatisch.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung der Volksgruppe.
- source_word: וַיְמַלְאוּם עָפָר
  choice: und füllten sie mit Erde
  rationale: Das Objektsuffix wird ausdrücklich mit »sie« aufgenommen. עָפָר bezeichnet hier Erde, Erdreich oder Staub; im Zusammenhang zugeschütteter Brunnen passt »Erde« am besten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bildet die hervorgehobene Voranstellung der Brunnen im Hebräischen nach, bleibt aber gut verständlich. Die Wiederholung »seines Vaters … seines Vaters Abraham« wird idiomatisch gebündelt, ohne den verwandtschaftlichen Bezug zu tilgen.
