  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und die zentralen Aussagen präzise wieder: Jahwes Erscheinen, das Verbot, nach Ägypten hinabzuziehen, sowie der Befehl, im bezeichneten Land zu wohnen. „Nennen werde“ ist hier als idiomatische Wiedergabe von אֹמַר אֵלֶיךָ („dir sagen/mitteilen werde“) vertretbar und wahrt die zukunftsbezogene Offenheit der Aussage.'
