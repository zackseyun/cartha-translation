source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: de
  text: 'Da erschien ihm Jahwe und sagte: „Zieh nicht hinab nach Ägypten. Wohne in dem Land, das ich dir nennen werde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Niphal von ראה bezeichnet hier ein sichtbares oder wahrnehmbares Erscheinen. „Erschien“ ist im Deutschen natürlich und legt die Art der Offenbarung nicht näher fest.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: Zieh nicht hinab nach Ägypten
  rationale: אַל mit dem Imperfekt drückt ein Verbot aus. „Hinabziehen“ bewahrt zudem die hebräische Reiseformulierung in Bezug auf Ägypten.
- source_word: שְׁכֹן
  choice: Wohne
  rationale: Der Imperativ von שכן fordert zum Wohnen beziehungsweise Verweilen an einem Ort auf. „Wohne“ ist verständlich und wahrt den Sinn eines Aufenthalts.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet, in dem Isaak wohnen soll, nicht die Erde im Allgemeinen.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: das ich dir nennen werde
  rationale: Wörtlich steht eine Form von „sagen“. Im Zusammenhang geht es um die noch folgende Benennung beziehungsweise Weisung hinsichtlich des Landes; „nennen werde“ gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Text; das topografische „hinab“ wird bewahrt. Keine Fußnote ist nötig, da „das ich dir nennen werde“ die offene, auf eine spätere göttliche Weisung gerichtete Aussage natürlich wiedergibt.
