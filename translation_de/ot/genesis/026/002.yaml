  terminology: „Jahwe“ gibt den Gottesnamen יהוה angemessen als Eigenname wieder. „Land“ entspricht dem kontextuellen Sinn von אֶרֶץ; „wohne“ gibt den Imperativ שְׁכֹן sachgerecht wieder.
