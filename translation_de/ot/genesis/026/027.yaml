  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: de
  text: 'Isaak sagte zu ihnen[a]: »Warum seid ihr zu mir gekommen, obwohl ihr mich gehasst und aus eurer Mitte weggeschickt habt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum seid ihr zu mir gekommen? Ihr habt mich doch gehasst und aus eurer Mitte weggeschickt.« Das hebräische Bindewort bedeutet wörtlich meist »und«, kann hier aber einen Gegensatz oder Begleitumstand ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: Isaak sagte zu ihnen
  rationale: Die übliche erzählende Wiedergabe von אמר mit der durch אֶל bezeichneten Anrede; die inhaltliche Frage rechtfertigt keine Änderung zu »fragte«.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Natürliche und genaue Wiedergabe des kausalen Frageworts im heutigen Deutsch.
- source_word: בָּאתֶם אֵלָי
  choice: seid ihr zu mir gekommen
  rationale: Das deutsche Perfekt bezeichnet idiomatisch die gerade erfolgte Ankunft, die Isaaks Frage auslöst.
- source_word: וְאַתֶּם
  choice: obwohl ihr
  rationale: Das וְ verbindet die Ankunft mit dem dazu im Gegensatz stehenden früheren Verhalten. »Obwohl« gibt diesen konzessiv-adversativen Zusammenhang natürlich wieder; die wörtlichere Möglichkeit »und ihr« bleibt in der Fußnote erhalten.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: ihr mich gehasst
  rationale: שׂנא bedeutet regulär »hassen«; die Stärke der Aussage wird nicht zu »feindlich gesinnt sein« abgeschwächt.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: und … weggeschickt habt
  rationale: שׁלח mit Personenobjekt bezeichnet hier das Wegschicken. »Vertrieben« wäre im Deutschen stärker, als das Verb allein verlangt.
- source_word: מֵאִתְּכֶם
  choice: aus eurer Mitte
  rationale: Die Präposition bezeichnet die Trennung von ihrer Gegenwart beziehungsweise Gemeinschaft; »aus eurer Mitte« bewahrt diesen sozialen Beiklang.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede mit deutschen Anführungszeichen; »gehasst« bewahrt die Schärfe des hebräischen Ausdrucks, während »weggeschickt« keine über den Ausgangstext hinausgehende Gewalt andeutet.
