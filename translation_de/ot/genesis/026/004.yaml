  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: de
  text: Und ich werde deine Nachkommen so zahlreich machen wie die Sterne am Himmel, und ich werde deinen Nachkommen all diese Länder geben. In deinen Nachkommen werden alle Völker der Erde gesegnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Völker der Erde werden sich durch deine Nachkommen Segen wünschen.“ Die hebräische Verbform kann auch reflexiv verstanden werden; im Zusammenhang der Bundesverheißung liegt jedoch die passive Bedeutung nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Und ich werde … so zahlreich machen
  rationale: Die Hifil-Form von רבה bezeichnet eine von Gott bewirkte zahlenmäßige Vermehrung. Die deutsche Wendung ist natürlich und bringt Gottes unmittelbares Handeln klar zum Ausdruck.
- source_word: זַרְעֲךָ / לְזַרְעֲךָ / בְזַרְעֲךָ
  choice: deine Nachkommen / deinen Nachkommen / in deinen Nachkommen
  rationale: זֶרַע ist ein kollektiver Singular und kann die gesamte Nachkommenschaft bezeichnen. „Nachkommen“ ist im heutigen Deutsch natürlicher als das archaische „Same“; die konsequente Wiedergabe an allen drei Stellen bewahrt den inneren Zusammenhang des Verses.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: wie die Sterne am Himmel
  rationale: Das vergleichende כְּ wird mit „wie“ wiedergegeben. „Am Himmel“ entspricht natürlichem modernem Deutsch und bewahrt das erhabene Bild.
- source_word: וְנָתַתִּי
  choice: und ich werde … geben
  rationale: נתן bedeutet schlicht „geben“. Diese direkte Wiedergabe passt zur Form der göttlichen Verheißung.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: all diese Länder
  rationale: Der Plural אֲרָצוֹת bezeichnet hier die verheißenen Gebiete; הָאֵל ist hinweisend und wird daher mit „diese“ wiedergegeben.
- source_word: וְהִתְבָּרֲכוּ
  choice: werden … gesegnet werden
  rationale: Die passive Deutung passt gut zum Zusammenhang der Bundesverheißung. Da die Hitpael-Form auch reflexiv verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
- source_word: בְזַרְעֲךָ
  choice: in deinen Nachkommen
  rationale: „In“ bildet die Präposition ב formal ab und lässt offen, ob eine relationale oder vermittelnde Bedeutung im Vordergrund steht; „durch“ wäre stärker auslegend.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: גּוֹיִם bezeichnet hier die Völker der Welt. „Völker“ klingt im Deutschen natürlicher als „Nationen“ und erfasst den ethnisch-kollektiven Sinn.
theological_decisions:
- issue: Bedeutung der Segensformel וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: In deinen Nachkommen werden alle Völker der Erde gesegnet werden.
  alternative: Alle Völker der Erde werden sich mit deinen Nachkommen Segen wünschen.
  rationale: Die passive Lesart entspricht dem Kontext der an Abraham und Isaak gerichteten Bundesverheißung. Die grammatisch mögliche reflexive Lesart wird jedoch nicht ausgeschlossen, sondern in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Verheißungsstil, ohne unnötig altertümliche Wörter wie „Same“ oder unnatürliche Formulierungen zu verwenden.
