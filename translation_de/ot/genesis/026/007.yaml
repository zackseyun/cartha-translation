  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: de
  text: 'Als die Männer des Ortes ihn nach seiner Frau fragten, sagte er: „Sie ist meine Schwester“, denn er hatte Angst zu sagen, sie sei seine Frau; die Männer des Ortes könnten ihn sonst wegen Rebekka töten, denn sie war schön anzusehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ
  choice: Als die Männer des Ortes ihn nach seiner Frau fragten
  rationale: שׁאל mit ל bezeichnet hier den Gegenstand der Frage. „Jemanden nach jemandem fragen“ ist die natürliche deutsche Wiedergabe; אַנְשֵׁי bleibt entsprechend dem Hebräischen ausdrücklich „Männer“.
- source_word: אֲחֹתִי הִוא
  choice: Sie ist meine Schwester
  rationale: Die prädikative Identifizierung wird in natürlicher deutscher Wortstellung als direkte Rede wiedergegeben.
- source_word: כִּי יָרֵא לֵאמֹר
  choice: Denn er hatte Angst zu sagen
  rationale: כִּי führt die Begründung ein; ירא bezeichnet hier konkrete Furcht. „Hatte Angst“ ist modern, klar und weniger steif als „fürchtete sich“.
- source_word: פֶּן יַהַרְגֻנִי
  choice: Sonst könnten mich … töten
  rationale: פֶּן bezeichnet die befürchtete Folge. „Sonst könnten“ gibt diese Befürchtung idiomatisch wieder, ohne sie als sichere Folge darzustellen; הרג bedeutet schlicht „töten“.
- source_word: עַל רִבְקָה
  choice: wegen Rebekka
  rationale: עַל bezeichnet hier Anlass beziehungsweise Ursache. „Wegen Rebekka“ ist knapp und idiomatisch.
- source_word: טוֹבַת מַרְאֶה
  choice: sie war schön
  rationale: Die Wendung bezeichnet ein ansprechendes Äußeres. Im Deutschen drückt „schön“ dies natürlich aus, ohne die Aussage unnötig zu erklären.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: „Rebekka“ ist die im Deutschen etablierte biblische Namensform.
theological_decisions:
- issue: Wechsel von der Erzählperspektive zur ersten Person in יַהַרְגֻנִי („sie könnten mich töten“)
  choice: 'Die befürchtete Folge wird als Isaaks unausgesprochener Gedanke eingeführt: „Er dachte: …“'
  alternative: Die erste Person ohne Einleitung unmittelbar an die Aussage des Erzählers anschließen oder in die dritte Person ändern
  rationale: Die gewählte Fassung bewahrt die erste Person des hebräischen Textes und macht zugleich den Perspektivwechsel im Deutschen verständlich, ohne Isaaks Beweggrund umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Sätze erhalten die erzählerische Direktheit und machen den im Hebräischen abrupten Wechsel zur ersten Person transparent.
