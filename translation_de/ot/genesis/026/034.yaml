base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: de
  text: 'Als Esau vierzig Jahre alt war, nahm er sich eine Frau[a]: Judit, die Tochter Beeris, des Hethiters, und Basemat, die Tochter Elons, des Hethiters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen die Einzahl »eine Frau«, obwohl anschließend zwei Frauen genannt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן אַרְבָּעִים שָׁנָה
  choice: Als Esau vierzig Jahre alt war
  rationale: Die hebräische Erzählungsform leitet hier eine zeitliche Angabe ein; die deutsche Fassung gibt die übliche hebräische Altersformel natürlich wieder.
- source_word: וַיִּקַּח אִשָּׁה
  choice: nahm er sich eine Frau
  rationale: Die Formulierung bewahrt den Singular des hebräischen Textes und zugleich den im Kontext eindeutigen Sinn einer Eheschließung.
- source_word: יְהוּדִית
  choice: Judit
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: בַּת
  choice: die Tochter des
  rationale: Natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung; der folgende Volksname wird attributiv dem Vater zugeordnet.
- source_word: הַחִתִּי
  choice: des Hetiters
  rationale: Der bestimmte hebräische Volksname bezeichnet Beeri beziehungsweise Elon als Angehörige der Hetiter.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Quellnahe deutsche Umschrift des Personennamens.
- source_word: בְּאֵרִי / אֵילֹן
  choice: Beeri / Elon
  rationale: Im Deutschen verständliche, quellnahe Umschrift der Eigennamen.
