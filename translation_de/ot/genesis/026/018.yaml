base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: de
  text: Dann grub Isaak die Wasserbrunnen wieder auf, die man zur Zeit seines Vaters Abraham gegraben hatte[a] und die die Philister nach Abrahams Tod verstopft hatten. Er gab ihnen dieselben Namen, die ihnen sein Vater gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Dann kehrte Isaak zurück und grub.“ Das hebräische Verb kann ausdrücklich „zurückkehren“ bedeuten, kennzeichnet hier aber wahrscheinlich die Wiederaufnahme einer Handlung: Isaak grub die Brunnen erneut auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיַּחְפֹּר
  choice: grub … wieder auf
  rationale: שוב vor einem weiteren Verb bezeichnet hier die Wiederaufnahme der Handlung. Da bereits vorhandene, verstopfte Brunnen erneut ausgegraben werden, gibt „wieder aufgraben“ Sinn und Bild natürlich wieder, ohne eine räumliche Rückkehr Isaaks vorauszusetzen.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: die Wasserbrunnen
  rationale: Die ausdrückliche Erwähnung des Wassers bleibt erhalten. „Wasserbrunnen“ ist im Deutschen verständlich und unterscheidet diese Wasserquellen von anderen Verwendungen des Wortes „Brunnen“.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: die man zur Zeit seines Vaters Abraham gegraben hatte
  rationale: Das nicht näher bestimmte Subjekt des hebräischen Plurals wird mit dem unpersönlichen „man“ wiedergegeben. „Zur Zeit“ überträgt die zeitliche Wendung בימי natürlich; die Zuordnung „seines Vaters Abraham“ bleibt deutlich.
- source_word: וַיְסַתְּמוּם
  choice: verstopft hatten
  rationale: סתם bedeutet verschließen oder verstopfen. „Verstopfen“ passt idiomatisch zu Brunnen und legt nicht fest, mit welchem Material sie blockiert wurden.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Eingebürgerte deutsche Bezeichnung der Volksgruppe.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: nach Abrahams Tod
  rationale: Natürliche und genaue Wiedergabe der zeitlichen Konstruktion.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: Er gab ihnen … Namen
  rationale: קרא mit ל und שׁמות bezeichnet hier die Benennung. „Namen geben“ ist im modernen Deutschen idiomatischer als eine formale Wiedergabe mit „nennen“ oder „rufen“.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: dieselben Namen, die ihnen sein Vater gegeben hatte
  rationale: Das Präfix כ bezeichnet hier die Übereinstimmung mit den früheren Namen. „Dieselben Namen“ macht klar, dass Isaak die Benennungen seines Vaters übernahm.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. „Wieder aufgraben“ entspricht dem Kontext bereits vorhandener, später verstopfter Brunnen; die wörtlichere Deutung von שוב bleibt in der Fußnote erhalten.
