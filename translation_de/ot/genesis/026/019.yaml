id: GEN.26.19
reference: Genesis 26:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: de
  text: Dann gruben Isaaks Knechte im Wadi[a] und fanden dort einen Brunnen mit lebendigem Wasser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tal“ beziehungsweise „Bachbett“; das hebräische Wort bezeichnet häufig ein Wadi, also einen saisonal wasserführenden Wasserlauf.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „lebendiges Wasser“, das heißt frisches oder fließendes Quellwasser im Unterschied zu abgestandenem Wasser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: gruben
  rationale: Das Qal-Wayyiqtol von חפר bezeichnet gewöhnliches Graben; „gruben“ gibt die fortlaufende Erzählung natürlich und direkt wieder.
- source_word: עַבְדֵי יִצְחָק
  choice: Isaaks Knechte
  rationale: Die Constructusverbindung bezeichnet die Männer in Isaaks Dienst. „Knechte“ bewahrt die mögliche soziale Abhängigkeit deutlicher als „Diener“, ohne hier einen genaueren Rechtsstatus festzulegen.
- source_word: בַּנָּחַל
  choice: im Wadi
  rationale: נחל bezeichnet häufig ein saisonal wasserführendes Tal oder Bachbett. „Wadi“ ist im modernen Deutschen als geografischer Ausdruck verständlich und präzise; Alternativen stehen in der Fußnote.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: und fanden dort
  rationale: Die Form setzt die Erzählfolge fort; שָׁם wird zur örtlichen Betonung mit „dort“ ausdrücklich wiedergegeben.
- source_word: בְּאֵר
  choice: einen Brunnen
  rationale: בְּאֵר bezeichnet einen Brunnen; die folgende Wortgruppe beschreibt die Art seines Wassers.
- source_word: מַיִם חַיִּים
  choice: lebendigem Wasser
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild und seine biblischen Bezüge. Gemeint ist frisches beziehungsweise fließendes Quellwasser, nicht abgestandenes Wasser; dies wird in der Fußnote erläutert.
theological_decisions:
- issue: Bildhafte Wendung מַיִם חַיִּים
  choice: „lebendigem Wasser“ im Haupttext beibehalten
  alternative: „frischem“, „fließendem“ oder „Quellwasser“
  rationale: Die wörtliche Wendung ist im Deutschen verständlich und bewahrt mögliche innerbiblische Resonanzen, ohne an dieser Stelle eine zusätzliche theologische Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wadi“ sorgt für geografische Genauigkeit; „Knechte“ passt zum patriarchalischen Erzählmilieu und lässt den genauen sozialen Status offen. Die hebräische Metapher „lebendiges Wasser“ bleibt erhalten und wird durch eine Fußnote erklärt.
