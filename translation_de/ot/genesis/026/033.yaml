  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: de
  text: Und er nannte ihn Schiba[a]. Darum heißt die Stadt bis auf den heutigen Tag Beerscheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schiba klingt ähnlich wie das hebräische Wort für „sieben“ und gehört zu dem Wortspiel hinter Beerscheba. Beerscheba kann als „Brunnen der Sieben“ oder „Brunnen des Schwurs“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: Und er nannte ihn
  rationale: קרא mit direktem Objekt bezeichnet in Namensformeln das Benennen. Das feminine Pronomen bezieht sich im Kontext auf den Brunnen; im Deutschen verlangt „Brunnen“ das maskuline Pronomen „ihn“.
- source_word: שִׁבְעָה
  choice: Schibea
  rationale: Der Brunnenname wird transliteriert, statt seine mehrdeutige Wortbeziehung zu „sieben“ und „Schwur“ im Haupttext einseitig aufzulösen.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung leitet knapp und natürlich die Folgerung aus der Namensgebung ein.
- source_word: שֵׁם הָעִיר
  choice: heißt die Stadt
  rationale: Die idiomatische deutsche Benennungsformel gibt wörtlich „der Name der Stadt ist“ präzise und flüssig wieder.
- source_word: בְּאֵר שֶׁבַע
  choice: Beerscheba
  rationale: Der etablierte deutsche Eigenname bleibt erhalten; seine hebräische Wortbedeutung wird wegen ihrer Mehrdeutigkeit in der Fußnote erläutert.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die geläufige gehobene deutsche Wendung entspricht der hebräischen Zeitangabe und passt zum würdigen Erzählregister.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Namensdeutung und ihre echte Doppelbedeutung werden nicht im Haupttext vereindeutigt, sondern in der Fußnote bewahrt.
