  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: de
  text: Und sie bereiteten Isaak und Rebekka tiefen Kummer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und sie waren [oder: wurden] für Isaak und Rebekka eine Bitterkeit des Geistes.“ Der hebräische Ausdruck bezeichnet tiefen Verdruss oder Kummer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: Und sie bereiteten
  rationale: Das Qal-Wayyiqtol 3. Person feminin Plural von היה führt die Erzählung fort und bezieht sich auf Esaus Frauen aus dem vorigen Vers. Zusammen mit dem folgenden Ausdruck gibt „bereiteten“ die bewirkte Belastung im natürlichen Deutschen wieder; wörtlicher wäre „waren“ oder „wurden“.
- source_word: מֹרַת רוּחַ
  choice: tiefen Kummer
  rationale: Die hebräische Verbindung bedeutet wörtlich „Bitterkeit des Geistes“ und bezeichnet hier schwere innere Kränkung, Bekümmernis oder Verdruss. „Tiefen Kummer“ ist im modernen Deutschen verständlich und bewahrt die emotionale Stärke des Idioms.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: Isaak und Rebekka
  rationale: Die Präposition ל bezeichnet die betroffenen Personen. Bei „Kummer bereiten“ stehen diese im Deutschen natürlich im Dativ; die Wiederholung der hebräischen Präposition muss nicht eigens abgebildet werden.
