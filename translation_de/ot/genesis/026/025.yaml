  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: de
  text: Dort baute er einen Altar und rief den Namen Jahwes an[a]. Dort schlug er sein Zelt auf, und dort gruben Isaaks Knechte einen Brunnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verkündete den Namen Jahwes«. Die hebräische Wendung kann sowohl das Anrufen als auch das Verkünden bezeichnen; der Zusammenhang mit dem Altar spricht hier eher für das Anrufen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Dort baute er einen Altar
  rationale: Gibt die Ortsbetonung und die gewöhnliche Bedeutung von בנה und מזבח in natürlichem deutschem Erzählstil wieder.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: rief den Namen Jahwes an
  rationale: Die Wendung bezeichnet im Zusammenhang mit dem Altar am ehesten eine kultische Anrufung; die mögliche Bedeutung »verkündete« bleibt in einer Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: Dort schlug er sein Zelt auf
  rationale: »Ein Zelt aufschlagen« ist die idiomatische deutsche Wiedergabe von נטה mit אהל.
- source_word: עַבְדֵי יִצְחָק
  choice: Isaaks Knechte
  rationale: עבד bezeichnet hier Angehörige des Haushalts, die Arbeitsaufgaben ausführen; »Knechte« bewahrt den historischen sozialen Kontext besser als das moderne, missverständliche »Diener«.
- source_word: וַיִּכְרוּ ... בְּאֵר
  choice: gruben ... einen Brunnen
  rationale: Direkte und natürliche Wiedergabe des üblichen Ausdrucks für das Graben eines Brunnens.
- source_word: שָׁם
  choice: dort ... Dort ... dort
  rationale: Die dreimalige Ortsangabe wird beibehalten, weil ihre Wiederholung den Ort der Handlungen betont.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; »Jahwe« wahrt diese Form und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von קרא בשם יהוה
  choice: den Namen Jahwes anrufen
  alternative: den Namen Jahwes verkünden
  rationale: Beide Bedeutungen sind sprachlich möglich. Im unmittelbaren Zusammenhang mit dem Altar ist die gottesdienstliche Anrufung wahrscheinlicher, ohne dass die andere Möglichkeit verschwiegen wird.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die wiederholte Ortsangabe des Hebräischen bleibt sichtbar; die Satzgliederung verhindert zugleich einen schwerfälligen Satzbau.
