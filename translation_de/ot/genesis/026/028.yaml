  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: de
  text: 'Da sagten sie: »Wir haben deutlich gesehen, dass Jahwe mit dir gewesen ist. Da sagten wir: ›Es möge doch ein Eid[a] zwischen uns bestehen, zwischen dir und uns, und lasst uns einen Bund mit dir schließen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fluchschwur«. Das hebräische Wort kann einen Schwur bezeichnen, bei dem für den Fall des Bruchs ein Fluch angerufen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Gibt den erzählenden Fortgang des Waw-Konsekutivs in natürlichem Deutsch wieder, ohne eine stärkere zeitliche Aussage einzutragen.
- source_word: רָאוֹ רָאִינוּ
  choice: Wir haben deutlich gesehen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage; »deutlich« bildet diesen Nachdruck idiomatisch ab.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: dass Jahwe mit dir gewesen ist
  rationale: Bewahrt die Vergangenheitsform von הָיָה und lässt zugleich ihre erkennbare Bedeutung für die Gegenwart offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- source_word: וַנֹּאמֶר
  choice: Deshalb sagten wir
  rationale: Der Zusammenhang zeigt, dass der folgende Vorschlag aus der zuvor genannten Beobachtung hervorgeht; »deshalb« macht diese Folgerung lesbar.
- source_word: תְּהִי נָא
  choice: soll doch … gelten
  rationale: Gibt die höflich auffordernde Nuance des Jussivs mit נָא in natürlichem Deutsch wieder.
- source_word: אָלָה
  choice: Schwur
  rationale: Bezeichnet hier eine feierliche eidliche Verpflichtung; eine mögliche mitgedachte Fluchandrohung wird in der Fußnote offengehalten.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: zwischen uns, zwischen dir und uns
  rationale: Erhält die auffällige Wiederholung und den bilateralen Charakter der hebräischen Formulierung, bleibt aber im Deutschen verständlich.
- source_word: וְנִכְרְתָה בְרִית
  choice: und wir wollen einen Bund … schließen
  rationale: »Einen Bund schließen« ist die natürliche deutsche Entsprechung der hebräischen Wendung, die wörtlich »einen Bund schneiden« lautet.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Gibt die an Isaak gerichtete Singularform unmittelbar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; »Jahwe« bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutungsumfang von אָלָה
  choice: Schwur im Haupttext, mögliche Fluchkomponente in der Fußnote
  alternative: Fluchschwur
  rationale: Der Kontext verlangt eine eidliche Verpflichtung, während das Wort zugleich einen für den Übertretungsfall angerufenen Fluch bezeichnen kann. Die Übersetzung wahrt beide Aspekte, ohne den stärkeren im Haupttext zwingend festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die formelhafte Wiederholung »zwischen uns, zwischen dir und uns« bleibt bewusst erhalten; »soll doch« vermittelt die höfliche, eindringliche Bitte.
