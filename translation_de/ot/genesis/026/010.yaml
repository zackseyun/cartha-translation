  to: 'Und Abimelech sagte: „Was hast du uns da angetan? Beinahe hätte einer aus dem Volk mit deiner Frau geschlafen, und du hättest Schuld auf uns gebracht.“'
  rationale: Die Änderung von „über uns“ zu „auf uns“ verbessert die moderne deutsche Idiomatik, ohne den Sinn von „Schuld auf die Gemeinschaft bringen“ zu verändern. Die optionale Fußnote dokumentiert die auch im englischen Audit berücksichtigte kontextuelle Nuance von כִּמְעַט.
