  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und die wesentlichen Sinngehalte zuverlässig wieder: die vorwurfsvolle Frage, die beinahe eingetretene sexuelle Beziehung, den unbestimmten Einzelnen aus dem Volk und die dadurch drohende Schuld des Gemeinwesens. כִּמְעַט wird mit „Beinahe“ unmittelbar und ohne Überdeutung wiedergegeben.'
  naturalness: „Schuld über uns gebracht“ ist zwar verständlich und bibelsprachlich belegt, klingt im modernen Standarddeutsch jedoch etwas gezwungen. „Schuld auf uns gebracht“ ist idiomatischer und bewahrt die Bildlichkeit sowie die Zurechnung der Schuld.
  terminology: „Mit deiner Frau geschlafen“ ist eine angemessen zurückhaltende, klare Wiedergabe des sexuellen Idioms שָׁכַב ... אֶת. „Schuld“ trifft אָשָׁם hier besser als bloßes „Vorwurf“ oder „Blame“. „Abimelech“ entspricht der üblichen deutschen Namensform.
