  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: de
  text: 'Und Abimelech sagte: „Was hast du uns da angetan? Beinahe hätte einer aus dem Volk mit deiner Frau geschlafen, und du hättest Schuld auf uns gebracht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Was hast du uns da angetan?
  rationale: Das betonte „da“ gibt die hebräische Ausrufekonstruktion מַה זֹּאת natürlich wieder; „uns angetan“ bewahrt den gemeinschaftlichen Bezug von לָּנוּ.
- source_word: כִּמְעַט
  choice: Beinahe
  rationale: Das Adverb bezeichnet hier eine Handlung, die fast eingetreten wäre. „Beinahe“ ist im Deutschen eindeutig und idiomatisch.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: hätte ... mit deiner Frau geschlafen
  rationale: „Mit jemandem schlafen“ ist die natürliche, verständliche und zugleich zurückhaltende deutsche Entsprechung des hebräischen Ausdrucks für Geschlechtsverkehr.
- source_word: אַחַד הָעָם
  choice: einer aus dem Volk
  rationale: Die Formulierung bewahrt den unbestimmten Einzelnen innerhalb des Kollektivs, ohne הָעָם unnötig auf „Männer“ einzuengen.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: und du hättest Schuld über uns gebracht
  rationale: „Schuld“ erfasst die objektive moralische Verantwortlichkeit von אָשָׁם; „über uns gebracht“ bildet das räumliche Bild des Hebräischen verständlich nach.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: Und Abimelech sagte
  rationale: Die schlichte Verbindung bewahrt den hebräischen Erzählfluss, ohne die zeitliche Abfolge stärker auszudeuten.
theological_decisions:
- issue: Bedeutung von אָשָׁם in diesem Zusammenhang
  choice: Schuld
  alternative: Verfehlung; Strafwürdigkeit; Vorwurf
  rationale: Gemeint ist nicht bloß ein gesellschaftlicher Vorwurf, sondern eine durch die mögliche Tat entstandene moralische Schuld des Gemeinwesens. „Schuld“ bewahrt diese religiös-ethische Tragweite, ohne hier eine spezielle opfergesetzliche Bedeutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die sexuelle Wendung ist idiomatisch und zurückhaltend; die Satzfolge bleibt nahe am Hebräischen.
