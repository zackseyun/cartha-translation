  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: de
  text: Da ging Abimelech aus Gerar zu ihm, zusammen mit Ahusat, seinem Freund[a], und Pichol, dem Befehlshaber seines Heeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Gefährten“, „seinem Vertrauten“ oder möglicherweise „seinem Berater“. Das hebräische Wort kann sowohl einen persönlichen Freund als auch einen engen Begleiter oder höfischen Vertrauten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: Da ging Abimelech
  rationale: Das narrative וַ wird im Deutschen idiomatisch mit „Da“ wiedergegeben; der Eigenname folgt der üblichen deutschen Transkription.
- source_word: הָלַךְ אֵלָי/ו מִ/גְּרָר
  choice: ging … aus Gerar zu ihm
  rationale: הלך bedeutet hier „gehen“, אֵלָיו „zu ihm“ und מִגְּרָר „aus Gerar“. Das Pronomen bleibt wie im Hebräischen erhalten und verweist im Kontext auf Isaak.
- source_word: וַ/אֲחֻזַּת מֵֽרֵעֵ/הוּ
  choice: zusammen mit Ahusat, seinem Freund
  rationale: Ahusat wird als Eigenname verstanden. מֵרֵעֵהוּ bezeichnet einen Freund, Gefährten oder engeren Vertrauten; „Freund“ ist die unmittelbarste Wiedergabe, während die mögliche höfische Funktion nicht in den Haupttext hineingedeutet wird.
- source_word: וּ/פִיכֹל שַׂר צְבָא/וֹ
  choice: und Pichol, dem Befehlshaber seines Heeres
  rationale: שַׂר bezeichnet einen Obersten oder Befehlshaber, צָבָא hier die militärischen Kräfte. „Befehlshaber seines Heeres“ ist präzise, modern und würdevoll.
