  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: de
  text: Dann gruben sie einen weiteren Brunnen, und auch um ihn stritten sie. Da nannte er ihn Sitna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Sitna erinnert an ein hebräisches Wort für Feindschaft oder Anfeindung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: sie gruben
  rationale: Das Qal-Wayyiqtol im Plural von חפר bezeichnet gewöhnlich das Graben und führt die Erzählung fort.
- source_word: בְּאֵר אַחֶרֶת
  choice: einen weiteren Brunnen
  rationale: בְּאֵר bedeutet „Brunnen“; אַחֶרֶת kennzeichnet einen weiteren, von dem zuvor genannten verschiedenen Brunnen.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: doch auch um ihn stritten sie
  rationale: ריב bezeichnet hier einen Streit um den Brunnen. „Auch“ gibt גַּם wieder; „doch“ macht den erneuten Gegensatz im Deutschen natürlich deutlich, ohne den Sinn zu verändern.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: da nannte er ihn
  rationale: Die hebräische Namensformel lautet wörtlich „er rief seinen Namen“. „Er nannte ihn“ ist im modernen Deutschen natürlich und bewahrt die Funktion der Benennung.
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: Der Brunnenname wird transliteriert. Seine Verbindung mit Feindschaft oder Widerstand wird in der Fußnote erläutert.
