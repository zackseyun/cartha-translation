  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַ/יַּגִּ֣דוּ ל֔/וֹ עַל אֹד֥וֹת הַ/בְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַ/יֹּ֥אמְרוּ ל֖/וֹ מָצָ֥אנוּ מָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: de
  text: 'An jenem Tag[a] kamen Isaaks Diener zu ihm und berichteten ihm von dem Brunnen, den sie gegraben hatten. Sie sagten zu ihm: »Wir haben Wasser gefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangabe kann auch mit »an demselben Tag« wiedergegeben werden und betont dann, dass die Meldung noch am Tag der unmittelbar vorausgehenden Ereignisse eintraf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die deutsche Erzählprosa gibt die hebräische Fortsetzungsformel וַיְהִי hier natürlich durch den zeitlichen Einsatz wieder; הַהוּא bleibt mit »jenem« demonstrativ markiert.
- source_word: עַבְדֵי יִצְחָק
  choice: Isaaks Knechte
  rationale: עֶבֶד kann Knecht, Diener oder Sklave bezeichnen. »Knechte« wahrt im patriarchalischen Erzählzusammenhang die historische Haushaltsbindung besser als das modernere »Diener«, ohne den rechtlichen Status über das im Vers Gesagte hinaus festzulegen.
- source_word: וַיַּגִּדוּ לוֹ
  choice: berichteten ihm
  rationale: Die Hifil-Form von נגד bezeichnet hier das Überbringen einer Nachricht; »berichteten ihm« passt präzise zur Meldung über den Brunnen.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: von dem Brunnen
  rationale: Die Wendung עַל אֹדוֹת bedeutet »über/hinsichtlich«; in Verbindung mit »berichten« ist »von dem Brunnen« natürliches Standarddeutsch.
- source_word: אֲשֶׁר חָפָרוּ
  choice: den sie gegraben hatten
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Graben der anschließenden Meldung vorausging.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Sie sagten zu ihm
  rationale: Die ausdrückliche hebräische Redeeinleitung wird beibehalten und nicht mit dem vorhergehenden Bericht verschmolzen.
- source_word: מָצָאנוּ מָיִם
  choice: Wir haben Wasser gefunden
  rationale: Das Perfekt gibt den abgeschlossenen Fund mit gegenwärtiger Relevanz idiomatisch wieder; מַיִם verlangt keine unbestimmte Mengenangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählführung. Die hebräische Satzreihung wird leicht gegliedert, ohne Inhalt auszulassen. Der sozialgeschichtlich mehrdeutige Ausdruck עֶבֶד wird im Haupttext traditionell-kontextgerecht als »Knechte« wiedergegeben.
