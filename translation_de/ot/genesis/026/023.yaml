lexical_decisions:
- source_word: וַיַּעַל
  choice: zog er hinauf
  rationale: עלה bezeichnet ein Hinaufgehen oder Hinaufziehen. Im Zusammenhang einer Ortsveränderung ist „zog … hinauf“ natürliches Deutsch und bewahrt sowohl den Reisecharakter als auch die mögliche Höhenrichtung.
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Wendung bezeichnet schlicht den Ausgangspunkt der Bewegung und wird im modernen Deutschen natürlich mit „Von dort“ wiedergegeben.
- source_word: בְּאֵר שָׁבַע
  choice: Beerscheba
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form „Beerscheba“ wiedergegeben.
