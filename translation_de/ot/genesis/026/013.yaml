  text: וַ/יִּגְדַּ֖ל הָ/אִ֑ישׁ וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וְ/גָדֵ֔ל עַ֥ד כִּֽי גָדַ֖ל מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: de
  text: Und der Mann wurde groß; er wurde immer größer, bis er sehr groß wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Größe im Sinn von Wachstum, Wohlstand, Stellung oder Bedeutung bezeichnen. Die Verbfolge hebt die fortdauernde Zunahme hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: wurde immer bedeutender
  rationale: גדל bezeichnet ein Größerwerden an Umfang, Stellung oder Bedeutung. „Bedeutender“ wahrt die semantische Breite und verengt den Sinn nicht ausdrücklich auf Reichtum; „immer“ leitet den im Hebräischen stark hervorgehobenen fortschreitenden Zuwachs natürlich ein.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: איש bezeichnet hier den Mann Isaak und wird geschlechtsgenau wiedergegeben.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: er nahm stetig weiter zu
  rationale: Die Verbindung aus finitem Verb, Infinitivus absolutus und Partizip beschreibt einen fortdauernden, fortschreitenden Vorgang. Eine wörtliche Wiedergabe mit „gehen“ wäre im Deutschen missverständlich; „stetig weiter“ erhält den progressiven Nachdruck.
- source_word: עַד כִּי
  choice: bis
  rationale: Die Wendung führt zum Höhepunkt des fortschreitenden Zuwachses und wird im Deutschen natürlich mit „bis“ wiedergegeben.
- source_word: גָדַל מְאֹד
  choice: sehr bedeutend geworden war
  rationale: Die Wiedergabe greift denselben Wortstamm wie zu Versbeginn auf und erhält mit „sehr“ die Verstärkung durch מאוד, ohne ausschließlich materiellen Wohlstand festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wiedergabe vermeidet das im Deutschen unnatürliche „er ging gehend und wachsend“, bewahrt aber durch „immer“, „stetig weiter“ und die abschließende Steigerung die auffällige Progression des hebräischen Satzes.
