  text: וַ/יֵּ֥לֶךְ מִ/שָּׁ֖ם יִצְחָ֑ק וַ/יִּ֥חַן בְּ/נַֽחַל גְּרָ֖ר וַ/יֵּ֥שֶׁב שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: de
  text: Da zog Isaak von dort weg, schlug sein Lager im Tal von Gerar[a] auf und ließ sich dort nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Wadi von Gerar“ beziehungsweise „im Bachbett von Gerar“. Das hebräische Wort kann ein Tal, ein zeitweise trockenes Bachbett oder eine Schlucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Da zog Isaak von dort weg
  rationale: Die Verbindung bezeichnet im Erzählzusammenhang den Aufbruch vom vorherigen Ort. „zog … weg“ gibt die Bewegung natürlich wieder; „Da“ wahrt den narrativen Anschluss des וַ.
- source_word: וַיִּחַן
  choice: schlug sein Lager … auf
  rationale: חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. Die gewählte Wendung ist im modernen Deutschen anschaulich und idiomatisch.
- source_word: בְּנַחַל גְּרָר
  choice: im Tal von Gerar
  rationale: נַחַל kann ein Tal, ein Bachbett oder ein Wadi bezeichnen. „Tal“ ist allgemein verständlich und lässt die genaue Geländeform offen; die Alternativen werden in der Fußnote genannt.
- source_word: וַיֵּשֶׁב שָׁם
  choice: und ließ sich dort nieder
  rationale: ישׁב kann sitzen, wohnen, bleiben oder sich niederlassen bedeuten. Nach dem Aufschlagen des Lagers vermittelt „ließ sich … nieder“ die mögliche längerfristige Ansiedlung und die narrative Abfolge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am knappen hebräischen Erzählstil, während „schlug sein Lager auf“ und „ließ sich nieder“ idiomatisches Deutsch bieten.
