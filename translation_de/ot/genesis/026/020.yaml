  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: de
  text: 'Da stritten die Hirten von Gerar mit Isaaks Hirten und sagten: »Das Wasser gehört uns!« Deshalb gab er dem Brunnen den Namen Esek[a], denn sie hatten mit ihm gestritten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esek bedeutet im Hebräischen etwa »Streit« oder »Auseinandersetzung«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: Da stritten
  rationale: Das Verb ריב bezeichnet Streit oder eine rechtliche beziehungsweise sachliche Auseinandersetzung. »Stritten« ist im Deutschen natürlich und lässt den genauen Charakter des Konflikts offen.
- source_word: רֹעֵי גְרָר ... רֹעֵי יִצְחָק
  choice: die Hirten von Gerar ... Isaaks Hirten
  rationale: »Hirten« gibt רֹעִים direkt und im patriarchalischen Kontext verständlich wieder; die parallele Formulierung des Hebräischen bleibt erhalten.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: 'und sagten: »Das Wasser gehört uns!«'
  rationale: Die knappe hebräische Besitzkonstruktion bedeutet idiomatisch, dass die Sprecher das Wasser für sich beanspruchen. »Gehört uns« formuliert diesen Anspruch in natürlichem Deutsch.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: Deshalb nannte er den Brunnen
  rationale: Die hebräische Wendung »den Namen des Brunnens nennen« wird idiomatisch mit »den Brunnen nennen« wiedergegeben. »Deshalb« macht den im Kontext ausgedrückten Zusammenhang deutlich.
- source_word: עֵשֶׂק
  choice: Esek
  rationale: Der Brunnenname wird transliteriert; sein Bedeutungsanklang an Streit und Auseinandersetzung wird in einer Fußnote erklärt.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: denn sie hatten mit ihm gestritten
  rationale: Das Verb ist mit עֵשֶׂק verwandt. »Mit ihm gestritten« ist natürlich, bewahrt die Verbindung zum vorausgehenden Streit und gibt das singularische Suffix als Bezug auf Isaak wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede ist knapp und nachdrücklich formuliert; die hebräische Namensdeutung wird nicht in den Fließtext eingetragen, sondern durch die Fußnote erschlossen.
