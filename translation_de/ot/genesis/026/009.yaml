review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und der Sinn des hebräischen Textes sind getroffen: Abimelech ruft Isaak, stellt fest, dass Rebekka seine Frau ist, fragt nach der Bezeichnung als Schwester, und Isaak nennt seine Furcht als Grund. „Ja ganz eindeutig“ verstärkt die Feststellung jedoch stärker und spezifischer als אַךְ הִנֵּה; „doch“ gibt die nachdrückliche, entdeckende Feststellung genauer und idiomatischer wieder. Die Fußnote bezeichnet zudem eine nicht wörtliche Deutung als „wörtlicher“.'
  naturalness: 'Die direkte Rede ist gut verständlich und modern. „Sie ist doch deine Frau!“ ist knapper, natürlicher und behält den vorwurfsvoll-entdeckenden Ton. „Weil ich dachte: Ich könnte ihretwegen sterben“ ist idiomatisch und gibt die mit פֶּן ausgedrückte Befürchtung angemessen wieder.'
  terminology: „Frau“, „Schwester“, „ihretwegen“ und die Namensform „Isaak“ sind korrekt und registergerecht. Eine Fußnote zur implizierten Tötungsgefahr ist nicht erforderlich, weil der Vers selbst nur Isaaks Furcht zu sterben ausdrückt.
  issues:
  - severity: low
    issue: „ja ganz eindeutig“ ist eine überstarke Auslegung von אַךְ הִנֵּה.
    rationale: Die Partikeln markieren eine emphatische, auf etwas hinweisende Feststellung; sie besagen nicht ausdrücklich „ganz eindeutig“. „doch“ bewahrt die Nachdrücklichkeit ohne zusätzliche Graduierung.
  - severity: medium
    issue: Die Fußnote ist mit „Wörtlicher“ unzutreffend etikettiert.
    rationale: „Damit ich nicht ihretwegen sterbe“ ist keine wörtlichere Wiedergabe von פֶּן אָמוּת עָלֶיהָ, und „damit man mich ... tötet“ erläutert den Kontext statt eine lexikalische Alternative zu bieten. Da die Erläuterung für das Verständnis nicht nötig ist, wird die Fußnote entfernt.
  revised_text: 'Da rief Abimelech Isaak zu sich und sagte: »Sie ist doch deine Frau! Wie konntest du sagen: ›Sie ist meine Schwester‹?« Isaak antwortete ihm: »Weil ich dachte: Ich könnte ihretwegen sterben.«'
