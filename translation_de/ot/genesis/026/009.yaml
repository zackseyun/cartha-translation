- from: 'Da rief Abimelech Isaak zu sich und sagte: »Sie ist ja ganz eindeutig deine Frau! Wie konntest du da sagen: ›Sie ist meine Schwester‹?« Isaak antwortete ihm: »Weil ich dachte: Sonst könnte ich ihretwegen sterben.«[a]'
  to: 'Da rief Abimelech Isaak zu sich und sagte: »Sie ist doch deine Frau! Wie konntest du sagen: ›Sie ist meine Schwester‹?« Isaak antwortete ihm: »Weil ich dachte: Ich könnte ihretwegen sterben.«'
  rationale: Die Revision vermindert die überstarke Wiedergabe der emphatischen Partikeln und entfernt eine als wörtlich ausgegebene, tatsächlich interpretierende Fußnote. Die Befürchtung Isaaks bleibt in der direkten Rede klar, natürlich und quellennah erhalten.
