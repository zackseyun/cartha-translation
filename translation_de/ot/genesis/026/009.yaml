base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: de
  text: 'Da rief Abimelech Isaak zu sich und sagte: »Sie ist doch deine Frau! Wie konntest du sagen: ›Sie ist meine Schwester‹?« Isaak antwortete ihm: »Weil ich dachte: Ich könnte ihretwegen sterben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְיִצְחָק
  choice: Da rief Abimelech Isaak zu sich
  rationale: קרא mit לְ bei einer Person kann das Herbeirufen bezeichnen. „Zu sich rufen“ passt natürlich zur anschließenden direkten Befragung.
- source_word: אַךְ הִנֵּה
  choice: ja ganz eindeutig
  rationale: Die Verbindung verstärkt Abimelechs Feststellung und lenkt nachdrücklich auf den nun offensichtlichen Sachverhalt. Die deutsche Formulierung gibt diesen emphatischen Ausruf wieder, ohne ein unhebräisches Fragewort einzuführen.
- source_word: אִשְׁתְּךָ הִוא
  choice: sie ist … deine Frau
  rationale: אִשָּׁה bezeichnet hier eindeutig Isaaks Ehefrau; die direkte Aussage bleibt erhalten.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Wie konntest du da sagen
  rationale: וְאֵיךְ leitet eine vorwurfsvolle, ungläubige Frage ein. „Da“ stellt idiomatisch den Bezug zur vorausgehenden Feststellung her.
- source_word: אֲחֹתִי הִוא
  choice: Sie ist meine Schwester
  rationale: אֲחוֹת bedeutet im unmittelbaren Wortsinn „Schwester“; eine Verallgemeinerung zu „Verwandte“ wäre hier unnötig.
- source_word: כִּי אָמַרְתִּי
  choice: Weil ich dachte
  rationale: אָמַרְתִּי heißt formal „ich sagte“, kann aber in innerer Rede „ich dachte“ bedeuten. Da Isaak seinen Beweggrund nennt, ist dies im Deutschen natürlich und kontextgerecht.
- source_word: פֶּן אָמוּת
  choice: Sonst könnte ich … sterben
  rationale: פֶּן bezeichnet einen befürchteten möglichen Ausgang. Der Konjunktiv „könnte“ bildet diese Befürchtung in modernem Deutsch klar ab.
- source_word: עָלֶיהָ
  choice: ihretwegen
  rationale: 'עַל mit Suffix bezeichnet hier den Anlass oder Grund der befürchteten Gefahr: Isaak fürchtete, wegen Rebekka zu sterben.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die emphatische Feststellung אַךְ הִנֵּה und die anschließende vorwurfsvolle Frage bleiben klar voneinander unterschieden. Der im Kontext erschließbare Gedanke des Getötetwerdens wird nur in der Fußnote ausdrücklich gemacht.
