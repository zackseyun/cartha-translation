  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: de
  text: Sie standen früh am Morgen auf und schworen einander einen Eid.[a] Dann schickte Isaak sie fort, und sie gingen in Frieden von ihm fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann seinem Bruder“; die hebräische Wendung bezeichnet hier das gegenseitige Schwören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: sie standen früh am Morgen auf
  rationale: Das Hifil von שׁכם bezeichnet das frühe Aufstehen; zusammen mit בַבֹּקֶר ergibt sich diese natürliche deutsche Wendung.
- source_word: וַיִּשָּׁבְעוּ
  choice: schworen … einen Eid
  rationale: Das Nifal von שׁבע bedeutet „schwören/einen Eid leisten“. Die Formulierung wahrt den förmlichen Charakter der gegenseitigen Verpflichtung.
- source_word: אִישׁ לְאָחִיו
  choice: einander
  rationale: Wörtlich „ein Mann seinem Bruder“; in diesem Zusammenhang bezeichnet die hebräische Wendung das gegenseitige Schwören. „Einander“ gibt die Funktion im heutigen Deutsch klar wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
- source_word: וַיְשַׁלְּחֵם
  choice: ließ … sie ziehen
  rationale: Das Piel von שׁלח mit Objektsuffix bedeutet hier, jemanden fortzuschicken beziehungsweise ziehen zu lassen. Die gewählte Formulierung klingt natürlich und passt zum friedlichen Abschied.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: sie gingen … von ihm fort
  rationale: הלך mit מֵאֵת beschreibt die Bewegung von einer Person weg; die Übersetzung bildet dies unmittelbar ab.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: שָׁלוֹם kann hier sowohl das friedliche Verhältnis als auch den unversehrten Abzug bezeichnen. „In Frieden“ bewahrt diese Bedeutungsbreite.
