base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: de
  text: 'Er zog von dort weiter und grub einen anderen Brunnen. Um ihn stritten sie nicht. Da nannte er ihn Rehobot[a] und sagte: »Nun hat Jahwe uns Raum geschaffen, und wir werden im Land fruchtbar sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Rehobot klingt im Hebräischen wie das Wort für »weite Räume« oder »weite Plätze«. Isaaks Erklärung greift diese Bedeutung auf: »Jahwe hat uns Raum geschaffen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Er zog von dort weiter
  rationale: Das Verb עתק bezeichnet hier Isaaks Ortswechsel. »Weiterziehen« gibt die Bewegung im Erzählzusammenhang natürlich wieder, ohne ihre Art unnötig festzulegen.
- source_word: בְּאֵר אַחֶרֶת
  choice: einen anderen Brunnen
  rationale: Die einfache Nominalgruppe wird im modernen Deutschen direkt und idiomatisch wiedergegeben.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: Um ihn stritten sie nicht
  rationale: ריב bezeichnet Streit oder Auseinandersetzung; die Präposition עַל markiert hier den Gegenstand des Streits. Die vorangestellte Wendung »Um ihn« wahrt den Bezug auf den Brunnen.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: Da nannte er ihn Rehobot
  rationale: Die hebräische Namensgebungsformel wird in natürliches Deutsch übertragen. Der Ortsname bleibt transliteriert; sein Sinn und das Wortspiel werden in der Fußnote erläutert.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Nun hat Jahwe uns Raum geschaffen
  rationale: Das Hifil von רחב bedeutet hier, Raum oder Weite zu verschaffen. »Raum geschaffen« ist idiomatisch und bewahrt das Wortspiel mit Rehobot. כי wird als einleitende Begründung im Deutschen nicht eigens wiedergegeben, da »nun« den Gedankengang natürlich anschließt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: und wir werden im Land fruchtbar sein
  rationale: פרה bedeutet »fruchtbar sein« und kann Zunahme einschließen. Die Form bezeichnet hier die erwartete Folge des neu gewonnenen Raums; »im Land« wahrt den konkreten territorialen und möglichen verheißungsgeschichtlichen Bezug von אָרֶץ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar bewahrt, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וּפָרִינוּ
  choice: wir werden … fruchtbar sein
  alternative: wir werden uns … vermehren / gedeihen
  rationale: Die lexikalische Grundbedeutung und der mögliche Anklang an Segens- und Verheißungssprache bleiben erhalten, ohne Fruchtbarkeit ausschließlich als Wohlstand oder ausschließlich als zahlenmäßige Vermehrung auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Der Ortsname wird in der geläufigen deutschen Form »Rehobot« transliteriert; das hebräische Wortspiel wird nicht im Haupttext aufgelöst, sondern durch die Fußnote zugänglich gemacht.
