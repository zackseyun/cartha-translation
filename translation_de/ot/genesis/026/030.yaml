  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: de
  text: Er bereitete für sie ein Festmahl[a], und sie aßen und tranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gastmahl“; das hebräische Wort kann ein Festmahl bezeichnen, bei dem das Trinken besonders hervortritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: bereitete
  rationale: Das Verb עשה bedeutet wörtlich „machen/tun“. In Verbindung mit מִשְׁתֶּה gibt „bereitete“ idiomatisch wieder, dass Isaak das Mahl veranstaltete beziehungsweise ausrichtete.
- source_word: לָהֶם
  choice: für sie
  rationale: Die Präposition ל bezeichnet hier die Begünstigten; „für sie“ ist im Deutschen natürlich und sachlich genau.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: Das Substantiv bezeichnet ein Fest- oder Gastmahl, bei dem auch das Trinken eine wichtige Rolle spielen kann. „Festmahl“ ist würdig und allgemein verständlich; der folgende Satzteil nennt Essen und Trinken ausdrücklich.
- source_word: וַיֹּאכְלוּ
  choice: und sie aßen
  rationale: Direkte Wiedergabe des Verbs אכל und der fortlaufenden hebräischen Erzählform.
- source_word: וַיִּשְׁתּוּ
  choice: und tranken
  rationale: Direkte Wiedergabe von שתה; im Deutschen kann das bereits genannte Subjekt bei der koordinierten Handlung natürlich unausgesprochen bleiben.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. „Festmahl“ vermeidet die heute teils luxuriös wirkende Nuance von „Bankett“ und bewahrt zugleich den festlichen Charakter.
