source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: de
  text: Alles auf dem trockenen Land, in dessen Nüstern Lebensatem war, starb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Atem des Geistes des Lebens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Alles, … dessen
  rationale: Die umfassende Konstruktion schließt Menschen und Tiere ein. „Alles“ bewahrt diesen nicht ausschließlich personalen Gesamtbezug.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: Lebensatem
  rationale: Die zusammengesetzte hebräische Wendung bezeichnet den lebendig machenden Atem. „Lebensatem“ gibt sie im Deutschen natürlich und prägnant wieder, ohne eine zusätzliche metaphysische Unterscheidung zwischen Atem und Geist einzutragen.
- source_word: בְּאַפָּיו
  choice: in dessen Nase
  rationale: Das Hebräische verwendet den Singular mit einem Suffix der 3. Person maskulin Singular in kollektiv-distributiver Funktion. „In dessen Nase“ bildet die Relativkonstruktion ab und ist im Deutschen idiomatisch.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: auf dem trockenen Land
  rationale: Die Wendung begrenzt den Bezug auf die Lebewesen an Land und stellt sie dem vom Wasser bestimmten Lebensraum gegenüber.
- source_word: מֵתוּ
  choice: starb
  rationale: Das finite Verb bezeichnet schlicht den eingetretenen Tod. Der Singular stimmt mit dem kollektiven „Alles“ überein.
theological_decisions:
- issue: Verhältnis von נִשְׁמַת und רוּחַ in der Lebensatem-Wendung
  choice: Im Haupttext als „Lebensatem“ wiedergegeben
  alternative: „Atem des Lebensgeistes“ oder wörtlicher „Atem des Geistes des Lebens“
  rationale: Die hebräischen Begriffe überschneiden sich semantisch und bilden hier eine verdichtete Lebensatem-Wendung. Die natürliche deutsche Wiedergabe vermeidet eine nicht zwingend gemeinte metaphysische Schichtung; die formale Gestalt bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „Lebensatem“ die komplexe Genitivverbindung idiomatisch bündelt.
