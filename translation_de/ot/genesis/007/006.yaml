source:
  edition: WLC
  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: de
  text: Noah war sechshundert Jahre alt, als die Flut über die Erde[a] kam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Und Noah war sechshundert Jahre alt, und die Flut war Wasser auf der Erde.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Noah
  rationale: Der Name wird in seiner etablierten deutschen Form wiedergegeben. Das einleitende וְ verbindet den Satz mit dem Kontext; im Deutschen muss es hier nicht eigens mit „und“ oder „nun“ wiedergegeben werden, da die Satzverknüpfung durch die Gesamtkonstruktion erkennbar bleibt.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: war sechshundert Jahre alt
  rationale: Die wörtliche hebräische Wendung „ein Sohn von sechshundert Jahren“ ist eine übliche Altersangabe und wird idiomatisch ins Deutsche übertragen.
- source_word: וְ/הַ/מַּבּוּל
  choice: als die Flut
  rationale: מַבּוּל bezeichnet hier die große Flut. Das verbindende וְ wird zusammen mit הָיָה im Deutschen als zeitliche Nebensatzkonstruktion wiedergegeben, die den erzählerischen Zusammenhang natürlich ausdrückt.
- source_word: הָיָה מַיִם
  choice: kam
  rationale: Die hebräische Formulierung lautet sehr wörtlich „war Wasser“. „Kam“ gibt den ereignishaften Sinn im Deutschen verständlich wieder; die ungewöhnlichere hebräische Struktur wird in einer Fußnote bewahrt.
- source_word: עַל הָאָרֶץ
  choice: über die Erde
  rationale: עַל bezeichnet die räumliche Ausbreitung über bzw. auf etwas. הָאָרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten; im Kontext der Fluterzählung steht „Erde“ im Haupttext, während „Land“ als echte lexikalische Alternative vermerkt wird.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Das hebräische Wort lässt beide Bedeutungen zu. „Erde“ passt zum weiteren Kontext der Fluterzählung, ohne die mögliche Lesart „Land“ zu verschweigen.
- issue: Verhältnis der beiden Satzteile
  choice: zeitliche Verknüpfung mit „als“
  alternative: koordinierende Wiedergabe mit „und“
  rationale: Das hebräische וְ verbindet die Aussagen formal mit „und“. Im Deutschen macht „als“ den im Kontext naheliegenden zeitlichen Zusammenhang idiomatisch deutlich; die formalere Struktur wird in der Fußnote angegeben, damit keine weitergehende theologische Folgerung aus der Umformung entsteht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Hauptfassung vermeidet die im Deutschen schwer verständliche wörtliche Prädikation „die Flut war Wasser“, dokumentiert sie jedoch in der Fußnote. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
