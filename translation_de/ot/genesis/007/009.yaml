  text: Jeweils zu zweit kamen sie zu Noah in die Arche, männlich und weiblich, wie Gott Noah geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: jeweils zu zweit
  rationale: Die Wiederholung der Zahl hat distributive Bedeutung und bezeichnet das paarweise Kommen. „Jeweils zu zweit“ ist natürliches heutiges Deutsch und wahrt diesen Sinn.
- source_word: בָּאוּ
  choice: kamen
  rationale: בוא bezeichnet hier die Bewegung auf Noah und die Arche zu. „Kamen“ erhält die Erzählperspektive, ohne bereits im Verb die Bedeutung „hineingehen“ festzulegen.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: zu Noah in die Arche
  rationale: Die erste Fügung bezeichnet die Bewegung zu Noah, die zweite im Kontext den Eintritt in die Arche. Die deutsche Formulierung gibt beide Zielangaben flüssig und ohne einen im Hebräischen nicht vorhandenen Zusatz wieder.
- source_word: זָכָר וּנְקֵבָה
  choice: ein männliches und ein weibliches Tier
  rationale: Die Wendung bezeichnet die beiden Geschlechter. Die Ergänzung „Tier“ ist im Deutschen für eine natürliche, eindeutige Formulierung erforderlich und ergibt sich unmittelbar aus dem Kontext.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Vergleichspartikel bezeichnet die Übereinstimmung des Geschehens mit Gottes vorausgehendem Gebot; „genau wie“ bringt diese Entsprechung klar zum Ausdruck.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: Gott es Noah geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Gottes Gebot dem Kommen der Tiere vorausging. Das Pronomen „es“ ist eine idiomatische Ergänzung beim Verb „gebieten“.
theological_decisions:
- issue: Wie die Tiere zu Noah kamen
  choice: Der Vers sagt lediglich, dass sie gemäß Gottes vorausgehendem Gebot kamen.
  alternative: Die Tiere kamen allein aus Instinkt oder wurden ausschließlich durch Noahs eigene Anstrengung zusammengebracht.
  rationale: Der hebräische Text nennt keine konkrete Wirkungsweise. Die Übersetzung wahrt die Aussage über Gottes Gebot, ohne einen nicht genannten Mechanismus hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jeweils zu zweit“ bewahrt die hervorgehobene Paarstruktur am Satzanfang; die Satzstellung bleibt flüssig und allgemein verständlich.
