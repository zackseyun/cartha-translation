base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: de
  text: Und Noah ging mit seinen Söhnen, seiner Frau und den Frauen seiner Söhne in die Arche, wegen des Wassers der Flut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging … in
  rationale: בוא bezeichnet je nach Perspektive Kommen, Gehen oder Eintreten. Mit אֶל הַתֵּבָה gibt „ging … in die Arche“ die Bewegung ins Innere natürlich und genau wieder.
- source_word: נֹחַ
  choice: Noah
  rationale: Die im Deutschen etablierte Namensform.
- source_word: בָנָיו
  choice: seinen Söhnen
  rationale: בֵּן bezeichnet hier ausdrücklich die Söhne, nicht allgemein die Kinder.
- source_word: אִשְׁתּוֹ
  choice: seiner Frau
  rationale: אִשָּׁה mit Possessivsuffix bezeichnet in diesem familiären Zusammenhang Noahs Ehefrau; „Frau“ ist die natürliche moderne deutsche Bezeichnung.
- source_word: נְשֵׁי בָנָיו
  choice: den Frauen seiner Söhne
  rationale: Die Wiedergabe folgt transparent der hebräischen Genitivverbindung; „Schwiegertöchtern“ wäre sinngemäß möglich, aber weniger formnah.
- source_word: אִתּוֹ
  choice: die bei ihm waren
  rationale: Das hebräische „mit ihm“ bezieht sich nach der Wortstellung besonders auf die Frauen seiner Söhne. Die Relativform erhält diese Zuordnung und vermeidet im Deutschen ein schwerfälliges doppeltes „mit“.
- source_word: אֶל הַתֵּבָה
  choice: in die Arche
  rationale: אֶל bezeichnet hier die Richtung auf die Arche und kontextuell in sie hinein; „Arche“ ist die etablierte deutsche Wiedergabe von תֵּבָה in der Noaherzählung.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Grund für das Hineingehen.
- source_word: מֵי הַמַּבּוּל
  choice: des Wassers der Flut
  rationale: Der hebräische Status constructus lautet wörtlich „Wasser der Flut“. Der deutsche Singular „Wasser“ ist idiomatisch und bewahrt beide Begriffe.
theological_decisions: []
translation_notes:
