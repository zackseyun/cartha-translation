    issue: Eingrenzung von אִתּוֹ durch den Relativsatz „die bei ihm waren“
    rationale: Die Formulierung bezieht „bei ihm waren“ grammatisch nur auf „die Frauen seiner Söhne“. Im Hebräischen steht אִתּוֹ nach der gesamten Personenreihe und kennzeichnet die Begleitung Noahs, ohne diese auf die zuletzt genannten Frauen zu beschränken.
  revised_text: Und Noah ging mit seinen Söhnen, seiner Frau und den Frauen seiner Söhne in die Arche, wegen des Wassers der Flut.
