  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֖יִם עַל הָ/אָ֑רֶץ חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: de
  text: Und die Wassermassen behielten 150 Tage lang die Oberhand über die Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das Land“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: behielten die Oberhand
  rationale: Das Qal-Wayyiqtol von גבר bezeichnet Starksein beziehungsweise Überwältigen. Im Zusammenhang der Flut gibt die idiomatische Wendung die anhaltende, überwältigende Macht des Wassers natürlich und prägnant wieder.
- source_word: הַמַּיִם
  choice: die Wassermassen
  rationale: Das hebräische pluralische beziehungsweise kollektiv gebrauchte Wort wird mit „Wassermassen“ wiedergegeben, um sowohl den Pluralcharakter als auch das gewaltige Flutwasser in natürlichem Deutsch auszudrücken.
- source_word: עַל הָאָרֶץ
  choice: über die Erde
  rationale: עַל bedeutet hier „über“, während אֶרֶץ sowohl „Erde“ als auch „Land“ heißen kann. Der umfassende Horizont der Fluterzählung spricht im Haupttext für „Erde“.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: 150 Tage lang
  rationale: Die hebräische Zahlenfolge lautet wörtlich „fünfzig und hundert Tage“. „150 Tage lang“ gibt die Zeitdauer in modernem Deutsch klar wieder.
theological_decisions:
- issue: Reichweite von אֶרֶץ in der Fluterzählung
  choice: Erde
  alternative: Land
  rationale: Die unmittelbare Erzählung beschreibt die Flut in umfassenden Begriffen, weshalb „Erde“ im Haupttext am besten passt. Da אֶרֶץ lexikalisch auch „Land“ bedeuten kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Oberhand behalten“ bewahrt die Kraft von גבר idiomatisch; „Wassermassen“ vermeidet das im Deutschen hier weniger natürliche pluralische „die Wasser“.
