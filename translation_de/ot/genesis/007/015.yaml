  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: de
  text: Sie kamen zu Noah in die Arche, je zwei von allem Fleisch, in dem Lebensatem war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist des Lebens“. Das hebräische Wort רוּחַ kann „Atem“, „Wind“ oder „Geist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: Das Wayyiqtol von בוא bezeichnet hier die fortschreitende Erzählung in der Vergangenheit; „sie kamen“ gibt die Bewegung natürlich wieder.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: zu Noah in die Arche
  rationale: Die doppelte Zielangabe wird eng am Hebräischen wiedergegeben. Beim zweiten אֶל macht der Kontext deutlich, dass die Bewegung ins Innere der Arche führt.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: je zwei
  rationale: Die Wiederholung der Zahl hat distributiven Sinn und bezeichnet die paarweise Ankunft.
- source_word: מִכָּל הַבָּשָׂר
  choice: von allem Fleisch
  rationale: „Fleisch“ bewahrt die wörtliche und im Sintflutbericht thematisch wichtige Bezeichnung für beseelte Geschöpfe.
- source_word: אֲשֶׁר בּוֹ
  choice: in dem
  rationale: Die Relativkonstruktion wird formal bewahrt und bezieht sich grammatisch auf das sächliche „Fleisch“.
- source_word: רוּחַ חַיִּים
  choice: Lebensatem
  rationale: רוּחַ bezeichnet hier im Zusammenhang mit Lebewesen am ehesten den Atem als Kennzeichen des Lebens; das zusammengesetzte deutsche Wort ist verständlich und würdevoll.
theological_decisions:
- issue: Bedeutung von רוּחַ in רוּחַ חַיִּים
  choice: Lebensatem
  alternative: Geist des Lebens
  rationale: Der zoologisch-schöpfungstheologische Zusammenhang spricht für den belebenden Atem, doch die mögliche Bedeutung „Geist“ wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „von allem Fleisch“ wurde bewusst beibehalten, um die Bildsprache und den thematischen Wortlaut des hebräischen Sintflutberichts zu bewahren.
