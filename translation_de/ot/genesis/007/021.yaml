  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: de
  text: 'Da starb alles Fleisch, das sich auf der Erde regte: die Vögel, das Vieh, die wilden Tiere, alles Gewimmel, das auf der Erde wimmelte, und alle Menschen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Menschheit“. Hebräisch: „der ganze Adam“, das heißt die Menschheit als Gesamtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: starb
  rationale: גוע bezeichnet sterben beziehungsweise verscheiden. „Starb“ ist im heutigen Deutsch klar, unmittelbar und ohne altertümliche Färbung.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die hebräische Wendung wird formal transparent wiedergegeben und bezeichnet hier umfassend das anschließend aufgezählte irdische Leben.
- source_word: הָרֹמֵשׂ
  choice: das sich … regte
  rationale: רמש kann kriechen, wimmeln oder sich bewegen bezeichnen. Der weitere Ausdruck „sich regen“ umfasst hier passend Vögel, Vieh, Wildtiere und Kleingetier, ohne die Bedeutung auf Kriechtiere zu verengen.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: „Auf der Erde“ ist eine natürliche Wiedergabe und entspricht dem umfassenden Horizont des Flutberichts; „auf dem Land“ wäre lexikalisch möglich, hier aber weniger passend.
- source_word: בָּעוֹף
  choice: die Vögel
  rationale: עוֹף kann Flugtiere allgemein bezeichnen; „Vögel“ ist in dieser Aufzählung idiomatisch und sachlich angemessen.
- source_word: וּבַבְּהֵמָה
  choice: das Vieh
  rationale: בְּהֵמָה bezeichnet in der Gegenüberstellung zu חַיָּה die domestizierten Landtiere. „Vieh“ wahrt diese Kategorie knapp und geläufig.
- source_word: וּבַחַיָּה
  choice: die wilden Tiere
  rationale: חַיָּה meint hier im Gegensatz zum Vieh die nicht domestizierten Landtiere. „Die wilden Tiere“ macht diese Unterscheidung deutlich.
- source_word: וּבְכָל הַשֶּׁרֶץ
  choice: alles Gewimmel
  rationale: שֶׁרֶץ bezeichnet kleine, zahlreich sich bewegende Tiere. „Gewimmel“ bewahrt die Kollektivbedeutung und ermöglicht die Wiedergabe der folgenden Stammwiederholung.
- source_word: הַשֹּׁרֵץ
  choice: das … wimmelte
  rationale: Das Verb wird mit „wimmelte“ wiedergegeben, sodass die hebräische Wiederholung von שׁרץ durch „Gewimmel … wimmelte“ hörbar bleibt.
- source_word: וְכֹל הָאָדָם
  choice: und alle Menschen
  rationale: אָדָם steht mit Artikel und כֹּל kollektiv für die gesamte Menschheit. „Alle Menschen“ ist im modernen Standarddeutsch natürlich, inklusiv und präzise.
theological_decisions:
- issue: Kollektive Bedeutung von הָאָדָם
  choice: alle Menschen
  alternative: die ganze Menschheit
  rationale: Der Ausdruck meint hier nicht nur männliche Einzelpersonen, sondern das Menschengeschlecht insgesamt. „Alle Menschen“ wahrt die distributive Form von כֹּל und gibt den kollektiven Sinn klar wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante hebräische Wendung „alles Fleisch“ und die Wortwiederholung „Gewimmel … wimmelte“ bleiben erhalten; die übrigen Tierkategorien werden natürlich und klar formuliert.
