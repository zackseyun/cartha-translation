revisions:
- from: Das Wasser gewann immer mehr an Macht und stieg stark über der Erde an, und die Arche trieb auf der Wasseroberfläche dahin.[a]
  to: Die Wasser wurden immer mächtiger und nahmen auf der Erde sehr zu, und die Arche bewegte sich auf der Oberfläche des Wassers dahin.[a]
  rationale: Die Revision wahrt die Unterscheidung zwischen dem Mächtigerwerden (גבר) und der starken Zunahme (רבה מאוד), gibt עַל הָאָרֶץ ohne die räumliche Mehrdeutigkeit von „über der Erde“ wieder und verwendet für die Bewegung der Arche eine neutrale deutsche Formulierung. Die Fußnotenmarkierung bleibt am idiomatisch übertragenen Ausdruck verankert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:21:27Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zwei Prädikate für das Erstarken und die starke Zunahme der Wassermassen grundsätzlich wieder. „stieg stark über der Erde an“ verschiebt jedoch die Präpositionalphrase in eine im Deutschen missverständliche räumliche Aussage und macht die Zunahme unnötig zu einem bloßen Ansteigen.
  naturalness: „Das Wasser gewann immer mehr an Macht“ ist verständlich, aber weniger natürlich als eine Prädikation mit „mächtiger“. „Die Arche bewegte sich … dahin“ ist idiomatisch und neutraler als „trieb“, das eine passive, ungerichtete Drift stärker nahelegen kann als das hebräische „ging/bewegte sich“.
  terminology: „Die Wasser“ ist im gehobenen, narrativen Register möglich und bildet die hebräische Pluralform angemessen ab; „Arche“ ist der etablierte Ausdruck. Die Fußnote erklärt die idiomatische Wendung zutreffend.
  issues:
  - severity: medium
    issue: „stieg stark über der Erde an“ für וַיִּרְבּוּ מְאֹד עַל הָאָרֶץ
    rationale: Die Wendung kann auf Deutsch bedeuten, dass das Wasser sich oberhalb der Erde erhob, statt dass die Wassermassen auf/über die Erde hin sehr zunahmen. Sie gibt zudem רבה („zunehmen, sich vermehren“) zu eng als Pegelanstieg wieder.
  - severity: low
    issue: „trieb … dahin“ für וַתֵּלֶךְ
    rationale: Das hebräische Verb bedeutet zunächst „ging/bewegte sich“. „Treiben“ ist möglich, kann aber eine ungerichtete passive Bewegung stärker spezifizieren als der Ausgangstext.
  revised_text: Die Wasser wurden immer mächtiger und nahmen auf der Erde sehr zu, und die Arche bewegte sich auf der Oberfläche des Wassers dahin.[a]
