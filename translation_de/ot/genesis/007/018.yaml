  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: de
  text: Die Wasser wurden immer mächtiger und nahmen auf der Erde sehr zu, und die Arche bewegte sich auf der Oberfläche des Wassers dahin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ging auf dem Angesicht des Wassers«; gemeint ist ihre Bewegung auf der Wasseroberfläche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: gewann immer mehr an Macht
  rationale: Das Verb גבר bezeichnet ein Stark- oder Mächtigwerden. Die Formulierung bewahrt die Vorstellung der zunehmenden Gewalt des Wassers und verbindet sich im Deutschen natürlich mit der folgenden Zunahme.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Obwohl מַיִם im Hebräischen formal pluralisch ist, wird die Wassermasse im modernen Standarddeutsch idiomatisch mit dem singularischen Kollektivbegriff „das Wasser“ wiedergegeben.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: stieg stark … an
  rationale: רבה mit מְאֹד drückt eine intensive Zunahme aus. Im Flutkontext gibt „stieg stark an“ die gemeinte Vermehrung der Wassermassen natürlich wieder.
- source_word: עַל הָאָרֶץ
  choice: über der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. „Erde“ wahrt hier den weiten Erzählrahmen, ohne in diesem Einzelvers eine zusätzliche Aussage über den geografischen Umfang einzutragen.
- source_word: וַתֵּלֶךְ
  choice: trieb … dahin
  rationale: הלך bedeutet wörtlich „gehen“ und bezeichnet hier die Bewegung der Arche auf dem Wasser. „Dahintreiben“ ist im Deutschen anschaulich und idiomatisch, legt aber keinen eigenen Antrieb nahe.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: „Arche“ ist die etablierte und kontextgerechte deutsche Bezeichnung für תֵּבָה in der Noah-Erzählung.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: auf der Wasseroberfläche
  rationale: Die Wendung bedeutet wörtlich „auf dem Angesicht des Wassers“ und bezeichnet idiomatisch dessen Oberfläche.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Erde“ passt zum weiteren Flutbericht; die Übersetzung vermeidet jedoch, aus der Präposition allein eine zusätzliche Aussage über die geografische Ausdehnung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden aufeinanderfolgenden Verben für die zunehmende Gewalt und Menge des Wassers bleiben unterscheidbar. Die Fußnote erläutert das hebräische Bewegungsidiom.
