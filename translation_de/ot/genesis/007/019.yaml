  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: de
  text: Und die Wasser wurden auf der Erde[a] überaus mächtig, und alle hohen Berge unter dem ganzen Himmel[b] wurden bedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Land“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „unter allen Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: wurden … mächtig
  rationale: Das Verb bezeichnet Stark- oder Übermächtigwerden. Diese Wiedergabe bewahrt das hebräische Kraftbild und passt zum zunehmenden Anschwellen der Wasser.
- source_word: מְאֹד מְאֹד
  choice: überaus
  rationale: Die Verdoppelung verstärkt das Verb sehr stark; „überaus“ gibt die Intensität in natürlichem, gehobenem Deutsch wieder.
- source_word: עַל הָאָרֶץ
  choice: über der Erde
  rationale: עַל bezeichnet hier die räumliche Ausbreitung über etwas; אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Haupttext entspricht „Erde“ der umfassenden Formulierung des Verses.
- source_word: וַיְכֻסּוּ
  choice: sodass … bedeckt wurden
  rationale: 'Die Form ist passiv: Die Berge wurden bedeckt. „Sodass“ macht den im Kontext naheliegenden Zusammenhang mit dem Mächtigwerden der Wasser im Deutschen flüssig deutlich.'
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: alle hohen Berge
  rationale: Dies entspricht unmittelbar der hebräischen Wortgruppe; הָרִים kann je nach Gelände auch Anhöhen bezeichnen, doch „Berge“ ist hier die natürliche Wiedergabe.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: unter dem ganzen Himmel
  rationale: Obwohl שָׁמַיִם formal pluralisch ist, wird das Wort im Deutschen idiomatisch häufig mit dem singularischen Kollektiv „Himmel“ wiedergegeben. כָּל bezeichnet hier die Gesamtheit.
theological_decisions:
- issue: Reichweite von אֶרֶץ in der Fluterzählung
  choice: Erde
  alternative: Land
  rationale: Die Wendung „unter dem ganzen Himmel“ gibt dem Vers eine umfassende Perspektive. Dennoch kann אֶרֶץ lexikalisch auch „Land“ bedeuten; die Fußnote erhält diese echte Deutungsmöglichkeit, ohne die Frage nach der geografischen Reichweite dogmatisch festzulegen.
- issue: Wiedergabe von תַּחַת כָּל הַשָּׁמָיִם
  choice: unter dem ganzen Himmel
  alternative: unter allen Himmeln
  rationale: Der deutsche Singular ist idiomatisch und gibt die umfassende Aussage wieder, während die Fußnote die formnähere Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Bildsprache des hebräischen Verbs bleibt erhalten; die doppelte Intensivierung wird ohne schwerfällige Wiederholung wiedergegeben. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
