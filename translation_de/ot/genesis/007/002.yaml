  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: de
  text: Von allen reinen Tieren sollst du dir jeweils sieben Paare[a] nehmen, ein Männchen und sein Weibchen; von den Tieren aber, die nicht rein sind, zwei[b], ein Männchen und sein Weibchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sieben, sieben, ein Männchen und sein Weibchen«. Gemeint sind wahrscheinlich sieben Paare; manche verstehen die Angabe jedoch als sieben einzelne Tiere.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »von den unreinen Tieren«. Im Hebräischen steht wörtlich: »von den Tieren, die nicht rein sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: von allen … Tieren
  rationale: מִן mit כֹּל bezeichnet die Auswahl aus einer Gesamtmenge. Der deutsche Plural ist in dieser Verteilungsform natürlicher als eine wörtliche kollektive Singularform.
- source_word: הַטְּהוֹרָה
  choice: rein
  rationale: טָהוֹר bezeichnet hier die Unterscheidung zwischen reinen und nicht reinen Tieren. „Rein“ ist knapp und vermeidet die erklärende Überbestimmung „kultisch rein“.
- source_word: תִּקַּח לְךָ
  choice: sollst du dir … nehmen
  rationale: Der Imperfekt hat hier anweisende Funktion; „dir“ gibt das לְךָ wieder, ohne im Deutschen schwerfällig zu wirken.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: jeweils sieben Paare
  rationale: Die wiederholte Zahl drückt Verteilung beziehungsweise Gruppierung aus. Zusammen mit „ein Männchen und sein Weibchen“ liegt die Bedeutung „sieben Paare“ nahe; die echte Deutungsalternative wird in einer Fußnote bewahrt.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: ein Männchen und sein Weibchen
  rationale: Die wörtlich auf Menschen bezogene Paarformel wird bei Tieren idiomatisch zur Bezeichnung beider Geschlechter gebraucht. Diese Wiedergabe erhält sowohl die Paarstruktur als auch den possessiven Ausdruck.
- source_word: וּמִן הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: von den Tieren aber, die nicht rein sind
  rationale: Die analytische hebräische Formulierung „nicht rein“ bleibt erhalten. „Aber“ macht den im Kontext vorhandenen Gegensatz im natürlichen Deutschen sichtbar.
- source_word: שְׁנַיִם
  choice: zwei
  rationale: Der Text nennt schlicht die Zahl zwei; die folgende Paarformel verdeutlicht, dass ein Männchen und ein Weibchen gemeint sind.
theological_decisions:
- issue: Bedeutung der Zahlenformel bei den reinen Tieren
  choice: sieben Paare reiner Tiere
  alternative: sieben einzelne reine Tiere
  rationale: שִׁבְעָה שִׁבְעָה in Verbindung mit אִישׁ וְאִשְׁתּוֹ spricht am ehesten für sieben männlich-weibliche Paare. Da die Formulierung auch als sieben einzelne Tiere verstanden worden ist, wird diese Möglichkeit ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, während „jeweils sieben Paare“ die distributive Zahlenformel verständlich wiedergibt. „Weibchen“ ist sachlich und allgemein verständlich; die nicht aufgelöste Zahlenfrage wird durch die Fußnote transparent gemacht.
