source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Noah: »Geh in die Arche, du und dein ganzes Haus, denn ich habe gesehen, dass du vor mir gerecht bist in dieser Generation.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung fort; „Da sagte“ klingt in modernem Deutsch natürlich und wahrt die zeitliche Folge.
- source_word: בֹּא
  choice: Geh in
  rationale: Das Bewegungsverb kann je nach Perspektive „komm“ oder „geh“ bedeuten. Im Deutschen ist „in die Arche gehen“ hier idiomatisch; die Richtungsangabe אֶל wird sachgemäß wiedergegeben.
- source_word: בֵּיתְךָ
  choice: dein ganzes Haus
  rationale: „Haus“ bezeichnet hier Noahs Hausgemeinschaft beziehungsweise Familie. Die formnahe Wendung ist im biblisch gehobenen Deutsch verständlich und bewahrt den sozialen Umfang des hebräischen Begriffs.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: „Arche“ ist die etablierte und kontextuell eindeutige deutsche Bezeichnung für Noahs תֵּבָה.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Befehls ein; „denn“ verbindet beide Hauptsätze natürlich.
- source_word: רָאִיתִי
  choice: ich habe gesehen
  rationale: Das Perfekt bezeichnet eine vollzogene Wahrnehmung beziehungsweise Beurteilung mit gegenwärtiger Geltung, ohne den Bildgehalt des Verbs abzuschwächen.
- source_word: צַדִּיק
  choice: gerecht
  rationale: „Gerecht“ ist die übliche und semantisch tragfähige Wiedergabe von צַדִּיק und lässt die theologische Aussage unverengt stehen.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die Wendung gibt Gottes Wahrnehmungs- und Beurteilungsperspektive wieder und bleibt nahe am hebräischen Ausdruck.
- source_word: בַּדּוֹר הַזֶּה
  choice: in dieser Generation
  rationale: דּוֹר bezeichnet hier Noahs zeitgenössische Generation; die direkte Wiedergabe erhält den möglichen Bezug auf seine Stellung innerhalb dieser Generation.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von Noahs Gerechtigkeit
  choice: dass du vor mir gerecht bist
  alternative: dass ich dich für gerecht halte
  rationale: Die Übersetzung bewahrt Gottes Feststellung, ohne zu erklären, worauf Noahs Gerechtigkeit beruht oder wie sie dogmatisch einzuordnen ist.
- issue: Bezugsrahmen von בַּדּוֹר הַזֶּה
  choice: in dieser Generation
  alternative: unter dieser Generation
  rationale: „In dieser Generation“ bildet den hebräischen Ausdruck eng ab und lässt offen, ob vor allem Noahs Zeitzugehörigkeit oder der Vergleich mit seinen Zeitgenossen betont wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater Formnähe. Die direkte Rede ist klar und flüssig; „dein ganzes Haus“ bewahrt bewusst die biblische Metonymie für Noahs Hausgemeinschaft.
