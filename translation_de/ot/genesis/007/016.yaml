  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: de
  text: Und die, die hineingingen – Männchen und Weibchen von allem Fleisch[a] –, kamen hinein, wie Gott ihm geboten hatte; und Jahwe schloss hinter ihm zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fleisch“ ist hier eine Sammelbezeichnung für die Lebewesen.
    reason: Die wörtlich bewahrte hebräische Wendung kann im modernen Deutschen ohne Erläuterung missverstanden werden.
  - marker: b
    text: 'Auch möglich: „Jahwe schloss ihn ein.“ Wörtlich steht im hebräischen Text kein Gegenstand wie „Tür“.'
    reason: Die Konstruktion lässt im Deutschen mehrere sachlich nahe Wiedergaben zu; die im Kontext vorausgesetzte Tür wird nicht ausdrücklich genannt.
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: Und die, die hineingingen …, gingen hinein
  rationale: Die substantivierte Partizipialform und das anschließende finite Verb werden beide wiedergegeben. Die Wiederholung entspricht der hebräischen Satzgestalt und bleibt im Deutschen verständlich.
- source_word: זָכָר וּנְקֵבָה
  choice: Männchen und Weibchen
  rationale: Im unmittelbaren Zusammenhang sind Tiere gemeint. Die substantivischen deutschen Bezeichnungen geben die Geschlechtsunterscheidung natürlich und präzise wieder.
- source_word: מִכָּל בָּשָׂר
  choice: von allem Fleisch
  rationale: Die Formulierung bewahrt sowohl die Präposition מִן („von/aus“) als auch das kollektive Bild בָּשָׂר („Fleisch“), ohne die Wendung im Haupttext interpretierend durch „Lebewesen“ zu ersetzen.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: wie Gott ihm geboten hatte
  rationale: „Gebieten“ gibt den verbindlichen Charakter von צוה wieder. Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot dem Hineingehen vorausging.
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: und … schloss hinter ihm zu
  rationale: Die Wiedergabe erhält die räumliche Wendung בַּעֲדוֹ und ergänzt nicht ausdrücklich „die Tür“, da im Hebräischen kein Objekt genannt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen, nicht den Titel אֲדֹנָי. „Jahwe“ wahrt diese Unterscheidung.
- issue: Nicht ausdrücklich genanntes Objekt beim Zuschließen
  choice: schloss hinter ihm zu
  alternative: schloss ihn ein
  rationale: Die gewählte Fassung bewahrt die Offenheit der hebräischen Konstruktion und vermeidet es, „Tür“ in den Haupttext einzufügen; zugleich bleibt das durch den Zusammenhang nahegelegte Zuschließen erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche gliedern den langen hebräischen Satz, ohne seine Wiederholung aufzulösen. „Von allem Fleisch“ ist bewusst quellennah und wird deshalb erläutert.
