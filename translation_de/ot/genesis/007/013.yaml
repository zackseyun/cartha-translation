    rationale: „die bei ihnen waren“ beschreibt grammatisch die unmittelbar vorausgehenden „drei Frauen“. Das hebräische אִתָּם ist dagegen eine abschließende pluralische Begleitangabe zur Bewegung; sein genauer Bezug bleibt nicht ausdrücklich festgelegt.
  revised_text: An eben diesem Tag gingen Noah, seine Söhne Sem, Ham und Jafet, Noahs Frau und die drei Frauen seiner Söhne mit ihnen in die Arche.[a]
