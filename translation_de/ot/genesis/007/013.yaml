review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von „an eben diesem Tag“, den Namen, den Familienbeziehungen und der Arche ist quellentreu. Der abschließende hebräische Plural אִתָּם („mit ihnen“) wird im Entwurf jedoch durch „die bei ihnen waren“ zu einem Relativsatz umgeformt. Dadurch wird er unmittelbar als nähere Bestimmung der drei Frauen gelesen, statt die im Hebräischen syntaktisch offene Begleitangabe bei der Bewegung in die Arche zu bleiben.
  naturalness: Der Satz ist grundsätzlich verständlich, aber „den drei Frauen seiner Söhne, die bei ihnen waren“ klingt im modernen Deutsch unnötig schwerfällig und legt einen anderen syntaktischen Bezug nahe. Eine koordinierte Subjektaufzählung mit abschließendem „mit ihnen“ ist natürlich und bildet die hebräische Konstruktion besser ab.
  terminology: „Arche“, „Noah“, „Sem“, „Ham“ und „Jafet“ entsprechen dem etablierten deutschen Bibelgebrauch. „Noahs Frau“ ist neutral und angemessen; der Text nennt ihren Namen nicht.
  issues:
