revisions:
- from: An eben diesem Tag ging Noah in die Arche, zusammen mit Sem, Ham und Jafet, den Söhnen Noahs, sowie Noahs Frau und den drei Frauen seiner Söhne, die bei ihnen waren.[a]
  to: An eben diesem Tag gingen Noah, seine Söhne Sem, Ham und Jafet, Noahs Frau und die drei Frauen seiner Söhne mit ihnen in die Arche.[a]
  rationale: Die Revision stellt die Personen als gemeinsame Satzsubjekte voran und gibt die abschließende pluralische Begleitangabe direkt als „mit ihnen“ wieder. So bleibt die im Hebräischen vorhandene, aber nicht näher spezifizierte Pluralreferenz erhalten, ohne die drei Frauen durch einen Relativsatz als bloß „bei ihnen“ befindlich zu charakterisieren.
