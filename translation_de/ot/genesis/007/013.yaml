base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: de
  text: An eben diesem Tag gingen Noah, seine Söhne Sem, Ham und Jafet, Noahs Frau und die drei Frauen seiner Söhne mit ihnen in die Arche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „mit ihnen“ steht im Plural; worauf es genau zurückverweist, lässt der Satz offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: An eben diesem Tag
  rationale: Die Wendung mit בְּעֶצֶם hebt genau diesen Tag nachdrücklich hervor; „an eben diesem Tag“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: ging ... in die Arche
  rationale: בּוֹא bedeutet grundsätzlich „kommen/gehen“; mit אֶל und dem Ziel „Arche“ bezeichnet es hier die Bewegung hinein. „ging in die Arche“ bleibt näher am Bewegungsverb als das stärker deutende „betrat“.
- source_word: נֹחַ
  choice: Noah
  rationale: Im Deutschen übliche Namensform.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: zusammen mit Sem, Ham und Jafet, den Söhnen Noahs
  rationale: „zusammen mit“ macht die gemeinsame Bewegung idiomatisch deutlich; die Apposition gibt בְּנֵי נֹחַ direkt wieder.
- source_word: וְאֵשֶׁת נֹחַ
  choice: sowie Noahs Frau
  rationale: Die Genitivverbindung wird natürlich als „Noahs Frau“ wiedergegeben; „sowie“ führt die Aufzählung klar fort.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: und den drei Frauen seiner Söhne
  rationale: Die Formulierung bewahrt Zahl und Verwandtschaftsbeziehung ohne anzunehmen, dass „drei“ syntaktisch auf einzelne Zuordnungen verteilt werden müsse.
- source_word: אִתָּם
  choice: die bei ihnen waren
  rationale: Das maskuline Pluralsuffix wird als „ihnen“ bewahrt. Ein Relativsatz vermeidet im Deutschen die missverständliche Häufung von „mit“, ohne den pluralischen Bezug zu tilgen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Aufzählung bleibt erkennbar, wird jedoch durch „zusammen mit“ und „sowie“ lesbar gegliedert. Der pluralische Ausdruck אִתָּם wird nicht zu einem Singular vereindeutigt.
