base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: de
  text: sie und alle wilden Tiere nach ihren Arten, alles Vieh nach seiner Art, alles, was sich auf der Erde regt, nach seiner Art, und alle Vögel nach ihren Arten – jeder Vogel, alles Geflügelte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder Vogel, jeder Flügel“. „Jeder Flügel“ ist eine knappe hebräische Bezeichnung für alles Geflügelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Personalpronomen nimmt die im Zusammenhang genannten Menschen und Tiere auf; „sie“ ist im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: הַחַיָּה
  choice: wilde Tiere
  rationale: Im Rahmen der Tierklassifikation der Genesis bezeichnet חַיָּה hier die wilden Landtiere im Unterschied zu בְּהֵמָה, dem Vieh.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: nach ihren Arten
  rationale: Die distributive Pluralform ist im Deutschen bei den kollektiv beziehungsweise pluralisch wiedergegebenen Tiergruppen natürlich und bewahrt den klassifizierenden Sinn von מִין.
- source_word: הַבְּהֵמָה
  choice: Vieh
  rationale: בְּהֵמָה bezeichnet hier domestizierte Groß- beziehungsweise Nutztiere und steht im Gegensatz zu den wilden Tieren; „Vieh“ ist prägnant und nicht auf Rinder beschränkt.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: Kriechtiere, die sich auf der Erde regen
  rationale: „Kriechtiere“ gibt die Tierklasse verständlich wieder; „sich regen“ nimmt die etymologische Wiederholung von רמש auf, ohne im Deutschen das schwerfällige „kriechen, die kriechen“ zu erzeugen.
- source_word: הָעוֹף
  choice: Vögel
  rationale: Obwohl עוֹף grundsätzlich fliegende Geschöpfe bezeichnen kann, legt die anschließende Apposition mit צִפּוֹר den Bezug auf Vögel nahe.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: jeder Vogel, alles, was Flügel hat
  rationale: Die Wiedergabe hält die beiden appositionellen hebräischen Ausdrücke auseinander und bewahrt die umfassende, leicht spannungsvolle Klassifikationssprache, statt sie zu „jeder geflügelte Vogel“ zusammenzuziehen.
