  naturalness: Der Satz ist gut lesbar und dem aufzählenden Stil angemessen. Bei den Kollektiva „Vieh“ und „alles, was sich auf der Erde regt“ ist der Singular „nach seiner Art“ idiomatischer als ein pluralisches Possessivpronomen. „Alles Geflügelte“ ist eine natürliche knappe Entsprechung der abschließenden hebräischen Klassifikationssprache.
  terminology: „wilde Tiere“ und „Vieh“ halten die Unterscheidung von חַיָּה und בְּהֵמָה angemessen aufrecht. Die Änderung bei רֶמֶשׂ vermeidet eine moderne, zu enge zoologische Festlegung. Die Fußnote erklärt die wörtliche Formulierung „jeder Flügel“ zutreffend, ohne deren idiomatischen Charakter zu verschleiern.
