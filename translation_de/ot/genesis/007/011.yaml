source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: de
  text: Im sechshundertsten Lebensjahr Noahs, im zweiten Monat, am siebzehnten Tag des Monats – an diesem Tag wurden alle Quellen der großen Tiefe aufgebrochen[a], und die Fenster des Himmels wurden geöffnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Brunnen der großen Tiefe“.'
    reason: Lexikalische Alternative für מַעְיְנֹת.
  - marker: b
    text: 'Auch: „die Schleusen des Himmels“.'
    reason: „Schleusen“ gibt die Funktion der himmlischen Öffnungen deutender wieder, während „Fenster“ das Ausgangsbild enger bewahrt.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: Im sechshundertsten Lebensjahr Noahs
  rationale: Die Wendung datiert das Geschehen nach Noahs Lebensalter. „Im sechshundertsten Lebensjahr Noahs“ ist präzise, natürlich und bewahrt die hebräische Zeitangabe.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: im zweiten Monat
  rationale: Direkte und im Deutschen idiomatische Wiedergabe der Monatsangabe.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am siebzehnten Tag des Monats
  rationale: Die hebräische Kardinalkonstruktion bezeichnet hier idiomatisch das Datum; im Deutschen ist die Ordinalzahl sachgerecht.
- source_word: בַּיּוֹם הַזֶּה
  choice: an eben diesem Tag
  rationale: „Eben“ gibt den nachdrücklichen Rückverweis auf das unmittelbar zuvor genannte Datum wieder, ohne den Ausdruck unnötig auszubauen.
- source_word: נִבְקְעוּ
  choice: brachen ... auf
  rationale: Das Nifal von בקע bezeichnet ein Aufbrechen oder Aufgespaltenwerden. Die deutsche Formulierung ist anschaulich und lässt den katastrophischen Vorgang hervortreten.
- source_word: כָּל מַעְיְנֹת
  choice: alle Quellen
  rationale: מַעְיָן bezeichnet eine Quelle oder einen Wasserquell. „Quellen“ ist im heutigen Deutsch verständlich und vermeidet die moderne Bedeutung von „Brunnen“ als künstlich angelegte Wasserstelle.
- source_word: תְּהוֹם רַבָּה
  choice: der großen Tiefe
  rationale: תְּהוֹם bezeichnet die urzeitliche Wassertiefe; „die große Tiefe“ bewahrt das kosmische Bild und die adjektivische Verstärkung durch רַבָּה.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: und die Fenster des Himmels
  rationale: אֲרֻבּוֹת sind Öffnungen oder Fenster. Die Wiedergabe erhält das hebräische Bild; „des Himmels“ ist im Deutschen die natürliche Entsprechung zum grammatisch pluralischen שָׁמַיִם.
- source_word: נִפְתָּחוּ
  choice: wurden geöffnet
  rationale: Die Passivform bildet das hebräische Nifal genau ab und steht in klarem Parallelismus zum Aufbrechen der Quellen.
theological_decisions:
- issue: Kosmische Bildsprache der Flutwasser
  choice: Die Bilder von der „großen Tiefe“ und den „Fenstern des Himmels“ bleiben erhalten.
  alternative: Deutende Umschreibungen wie „unterirdische Wassermassen“ und „Schleusen am Himmel“ im Haupttext.
  rationale: Der hebräische Text beschreibt das Geschehen mit alter kosmischer Bildsprache. Die Übersetzung bewahrt diese Sprache, statt sie in eine moderne naturwissenschaftliche Erklärung umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Datierungsstil bleibt feierlich und präzise; der Gedankenstrich gliedert die lange Zeitangabe. Die kosmische Bildsprache wird weder archaisierend noch naturwissenschaftlich paraphrasiert.
