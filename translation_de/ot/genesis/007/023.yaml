source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: de
  text: 'So löschte er alles Lebendige aus, das auf der Oberfläche des Erdbodens war[a]: vom Menschen[b] bis zum Vieh, bis zu den Kriechtieren und bis zu den Vögeln des Himmels[c]. Sie wurden von der Erde ausgelöscht. Nur Noah und alle, die bei ihm in der Arche waren, blieben übrig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wischte … weg“. Das hebräische Verb trägt das Bild des Wegwischens oder Tilgens.'
    reason: lexical_alternative
  - marker: b
    text: „Vom Menschen“ gibt das hebräische adam wieder, das hier repräsentativ für die Menschheit steht; auch „von den Menschen“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Vögel des Himmelsraums“ beziehungsweise „die Vögel am Himmel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: löschte ... aus / wurden ... ausgelöscht
  rationale: מחה bezeichnet ein Wegwischen oder Auslöschen. „Auslöschen“ bewahrt das Bild des Tilgens, klingt im Deutschen aber natürlicher als „wegwischen“; beim zweiten Vorkommen wird die passivische Form des Nifal wiedergegeben.
- source_word: כָּל הַיְקוּם
  choice: alles Lebendige
  rationale: הַיְקוּם bezeichnet hier im Kontext der Flut alles, was auf dem Land besteht beziehungsweise lebt, nicht abstrakt die gesamte Existenz.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf der Oberfläche des Erdbodens
  rationale: Die Wiedergabe erhält das hebräische Bild von der „Fläche“ beziehungsweise „Oberfläche“ des Bodens und ist zugleich in modernem Deutsch verständlich.
- source_word: מֵאָדָם
  choice: vom Menschen
  rationale: אָדָם steht hier im repräsentativen Sinn für die Menschheit und eröffnet die Aufzählung der betroffenen Lebewesen. Der Singular des Hebräischen bleibt erhalten.
- source_word: בְּהֵמָה
  choice: Vieh
  rationale: „Vieh“ ist die übliche knappe Bezeichnung für domestizierte größere Landtiere und ist weniger eng als „Rinder“.
- source_word: רֶמֶשׂ
  choice: Kriechtiere
  rationale: Der Ausdruck bezeichnet kleine Tiere, die sich am Boden bewegen. „Kriechtiere“ gibt dies im Genesis-Kontext verständlich wieder, ohne den Begriff auf die moderne zoologische Klasse der Reptilien festzulegen.
- source_word: עוֹף הַשָּׁמַיִם
  choice: Vögel des Himmels
  rationale: Die Formulierung bewahrt die hebräische Genitivverbindung und den literarischen Anklang an den Schöpfungsbericht; „Vögel des Himmels“ meint hier die Vögel des Luftraums.
- source_word: מִן הָאָרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. „Erde“ bewahrt hier die umfassende Erzählperspektive, ohne die moderne Frage nach der geografischen Ausdehnung ausdrücklich zu entscheiden.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: Übrig blieben nur Noah
  rationale: „Nur“ gibt die einschränkende Partikel אַךְ wieder, „übrig blieben“ den Sinn von שׁאר. Die Umstellung ermöglicht zusammen mit dem folgenden Ausdruck einen natürlichen deutschen Satz.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: und alle, die bei ihm in der Arche waren
  rationale: Die substantivierte Relativkonstruktion umfasst Noahs menschliche und tierische Gefährten. „Alle, die“ ist inklusiver und natürlicher als das sachlich klingende „was“; תֵּבָה wird im Noahbericht traditionell und verständlich mit „Arche“ wiedergegeben.
theological_decisions:
- issue: Reichweite der Vernichtung in der Fluterzählung
  choice: 'Die umfassende Aussage des Verses wird direkt wiedergegeben: Alles Lebendige auf dem Erdboden in den genannten Gruppen wurde ausgelöscht.'
  alternative: Die Sprache ausdrücklich als regionale Übertreibung oder als moderne naturwissenschaftliche Aussage über den gesamten Globus deuten.
  rationale: Die Übersetzung bewahrt die erzählerische Tragweite des Hebräischen, ohne über den Wortlaut hinaus eine Position zur geografischen Ausdehnung der Flut festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Wiederholung von „auslöschen“. Die mehrfachen „bis“ spiegeln die nachdrückliche hebräische Aufzählung. „Kriechtiere“ ist kontextuell und nicht als moderne taxonomische Eingrenzung zu verstehen.
