base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: de
  text: Die Flut war vierzig Tage lang auf der Erde[a]. Die Wasser nahmen zu und hoben die Arche empor, sodass sie sich über die Erde erhob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Flut war vierzig Tage auf der Erde.“ Im Hebräischen steht die Zeitangabe ohne ein Wort, das ausdrücklich „lang“ bedeutet; im Deutschen macht „lang“ die Dauer deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: war … lang
  rationale: In Verbindung mit der Zeitangabe „vierzig Tage“ bezeichnet das Verb hier das Andauern bzw. Bestehen der Flut. Die deutsche Wendung „war … lang“ gibt den hebräischen Wortlaut relativ nah und zugleich natürlich wieder.
- source_word: הַמַּבּוּל
  choice: die Flut
  rationale: Übliche und kontextgerechte Wiedergabe des besonderen Ausdrucks für die Flut zur Zeit Noahs.
- source_word: אַרְבָּעִים יוֹם
  choice: vierzig Tage lang
  rationale: „Lang“ macht die im Hebräischen ohne Präposition ausgedrückte Zeitdauer im Deutschen eindeutig.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten; im Zusammenhang der Fluterzählung ist „Erde“ die naheliegende, zugleich aber nicht überdeutende Wiedergabe.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: das Wasser stieg
  rationale: Das pluralisch formulierte hebräische „die Wasser nahmen zu“ bezeichnet hier die zunehmende Wassermenge beziehungsweise den steigenden Wasserstand. Der deutsche Kollektivsingular ist natürlich und bewahrt den konkreten Vorgang.
- source_word: וַיִּשְׂאוּ אֶת־הַתֵּבָה
  choice: hob die Arche empor
  rationale: נשא beschreibt hier, wie das zunehmende Wasser die Arche nach oben hebt. „Emporheben“ gibt diese Richtung präzise und würdig wieder.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: Die etablierte und im Noah-Kontext eindeutige deutsche Bezeichnung für das Fahrzeug.
- source_word: וַתָּרָם
  choice: sie sich … erhob
  rationale: Die feminine Singularform bezieht sich auf die Arche. Die intransitive Wiedergabe bezeichnet das Ergebnis des Hebens, ohne die Handlung unnötig zu wiederholen.
- source_word: מֵעַל הָאָרֶץ
  choice: über die Erde
  rationale: Die Präposition bezeichnet die erhöhte Lage beziehungsweise Bewegung weg von der Erdoberfläche. „Über die Erde“ wahrt die räumliche Aussage.
