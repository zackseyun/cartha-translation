  - severity: low
    issue: Die Fußnotenalternative „Die Flut kam vierzig Tage lang über die Erde“ ist semantisch und syntaktisch ungenau.
    rationale: Sie kann ein Über-die-Erde-Kommen beziehungsweise Überfluten ausdrücken, während der Text die Flut mit einer Zeitangabe „auf der Erde“ sein lässt. Eine formale Alternative sollte dies nicht verschieben.
