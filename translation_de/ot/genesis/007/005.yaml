source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: de
  text: Und Noah tat alles so, wie Jahwe es ihm geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עָשָׂה bedeutet allgemein „tun/machen“. Im Zusammenhang mit einem vorausgehenden Gebot gibt „tat“ Noahs Handeln knapp und ohne interpretierende Zusätze wieder.
- source_word: נֹחַ
  choice: Noah
  rationale: Die im Deutschen etablierte Form des hebräischen Personennamens.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles so, wie
  rationale: Die Verbindung bezeichnet vollständige Übereinstimmung mit dem Gebot. „Alles so, wie“ ist natürliches modernes Deutsch und bewahrt sowohl den umfassenden Sinn von כֹּל als auch die Vergleichs- bzw. Entsprechungsnuance von כְּ.
- source_word: צִוָּהוּ
  choice: es ihm geboten hatte
  rationale: צוה bezeichnet verbindliches Gebieten. Das Plusquamperfekt macht im Deutschen deutlich, dass Jahwes Gebot Noahs Ausführung vorausging; „es“ nimmt den gesamten Inhalt des Gebotenen auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Wiedergabe „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
- issue: Umfang von Noahs Gehorsam
  choice: alles so, wie
  alternative: gemäß allem, was
  rationale: Die Formulierung bewahrt die durch כְּכֹל ausgedrückte vollständige Übereinstimmung, ohne über den Text hinaus eine besondere Lehre über Noahs Gehorsam zu formulieren.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung ist idiomatisch; zugleich bleiben die Vollständigkeit von Noahs Ausführung und ihre genaue Übereinstimmung mit Jahwes Gebot erkennbar.
