  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: de
  text: 'Auch von den Vögeln des Himmels: je sieben[a], männlich und weiblich, um Nachkommen auf der ganzen Erde am Leben zu erhalten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Paare“. Im Hebräischen steht wörtlich „sieben, sieben“, eine distributive Ausdrucksweise. Sie kann als je sieben Tiere oder als sieben Paare verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Führt die Vögel als weitere Kategorie neben den zuvor genannten Landtieren ein und gibt die fortführende Funktion knapp wieder.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: von den Vögeln des Himmels
  rationale: עוֹף bezeichnet hier Vögel beziehungsweise fliegende Tiere; „Vögel des Himmels“ ist verständlich, würdevoll und bewahrt die hebräische Wendung mit שָׁמַיִם.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: sieben und sieben
  rationale: Die Wiederholung der Zahl hat distributive Kraft. Die formnahe Wiedergabe bewahrt die echte Unklarheit, ob sieben von jeder Art oder sieben Paare gemeint sind.
- source_word: זָכָר וּנְקֵבָה
  choice: männlich und weiblich
  rationale: Gibt die Geschlechtszuordnung direkt wieder, ohne durch zusätzliche Artikel oder Possessivformen eine bestimmte Paarstruktur festzulegen.
- source_word: לְחַיּוֹת זֶרַע
  choice: um Nachwuchs … am Leben zu erhalten
  rationale: Der Hifil-Infinitiv von חיה bezeichnet das Bewahren beziehungsweise Erhalten des Lebens; זֶרַע meint hier die fortbestehende Nachkommenschaft der Tiere.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Gibt den räumlichen Sinn der hebräischen Wendung in natürlichem modernem Deutsch wieder; die wörtliche Form „auf dem Angesicht der ganzen Erde“ wäre im Deutschen unnötig archaisch.
theological_decisions:
- issue: Zahl und Anordnung der mitgenommenen Vögel
  choice: Die hebräische Form „sieben und sieben“ bleibt im Haupttext erhalten.
  alternative: „sieben Paare“ oder „je sieben“
  rationale: Der Ausdruck ist auslegungsfähig. Eine eindeutige Paarzahl soll nicht in den Text hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt verdeutlicht die elliptische Aufzählung des Hebräischen. Die ungewöhnliche Zahlenform bleibt wegen ihrer inhaltlichen Mehrdeutigkeit bewusst stehen und wird durch die Fußnote erläutert.
