  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: de
  text: Nach sieben Tagen[a] waren die Wasser der Flut auf der Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und es geschah nach sieben Tagen, und die Wasser der Flut waren auf der Erde.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“. Das hebräische אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Nach sieben Tagen
  rationale: Die Verbindung aus וַיְהִי und der mit לְ eingeleiteten Zeitangabe führt das nächste Ereignis nach Ablauf der genannten Frist ein. Die knappe deutsche Zeitbestimmung gibt diese Erzählfunktion natürlich wieder; die wörtlichere Satzform wird in Fußnote [a] dokumentiert.
- source_word: וּמֵי הַמַּבּוּל
  choice: die Wasser der Flut
  rationale: מֵי ist die Konstruktform von מַיִם und wird mit „die Wasser“ wiedergegeben. מַבּוּל bezeichnet hier die noachische Flut; „Flut“ ist im modernen Standarddeutsch klar und geläufig.
- source_word: הָיוּ עַל
  choice: kamen ... über
  rationale: Wörtlich steht „waren auf/über“. Im Zusammenhang bezeichnet die Form den Eintritt des Flutereignisses. „kamen ... über“ bewahrt den ereignishaften Sinn und klingt im Deutschen natürlich.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten. Im Kontext der Fluterzählung ist „Erde“ die naheliegende Hauptwiedergabe; die echte lexikalische Alternative wird in Fußnote [b] erhalten.
theological_decisions:
- issue: Reichweite von אֶרֶץ in der Fluterzählung
  choice: die Erde
  alternative: das Land
  rationale: Das hebräische Wort lässt grundsätzlich beide Bedeutungen zu. „Erde“ wird als kontextuell stärkere und traditionelle Lesart im Haupttext verwendet, ohne durch die Übersetzung die weitergehende Debatte über die räumliche Ausdehnung der Flut entscheiden zu wollen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist erzählerisch flüssig, während die wörtlichere hebräische Satzgestalt und die Bedeutungsbreite von אֶרֶץ in den Fußnoten sichtbar bleiben.
