translation:
  language: de
  text: Fünfzehn Ellen höher stieg das Wasser, und die Berge wurden bedeckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut nennt nicht ausdrücklich, von welchem Bezugspunkt aus die fünfzehn Ellen gemessen werden.
    reason: Die Anmerkung bewahrt die tatsächliche syntaktisch-kontextuelle Unbestimmtheit der Maßangabe, ohne eine zusätzliche freie Alternativübersetzung einzuführen.
lexical_decisions:
- source_word: גָּבְרוּ
  choice: stieg
  rationale: Das Verb bezeichnet hier das mächtige Anschwellen bzw. Überhandnehmen des Wassers; im Deutschen gibt „stieg“ den räumlichen Zusammenhang natürlich wieder.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: fünfzehn Ellen höher
  rationale: Die Wendung gibt eine nach oben reichende Distanz von fünfzehn Ellen an. „Höher“ bewahrt die knappe räumliche Aussage, ohne einen ausdrücklich genannten Bezugspunkt hinzuzufügen.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: sodass die Berge bedeckt wurden
  rationale: Die passive Verbform wird als „bedeckt wurden“ wiedergegeben. „Sodass“ macht den im Hebräischen durch וַ ausgedrückten Fortgang bzw. Zusammenhang im Deutschen verständlich.
theological_decisions:
- issue: Bezugspunkt der fünfzehn Ellen
  choice: Im Haupttext bleibt offen, worüber das Wasser fünfzehn Ellen höher stieg.
  alternative: „Fünfzehn Ellen über die Berge hinaus“
  rationale: Der hebräische Wortlaut nennt den Bezugspunkt nicht ausdrücklich. Die alternative Deutung ist aus dem Kontext möglich, sollte aber nicht als eindeutig in den Haupttext eingebracht werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Maßeinheit „Elle“ bleibt als historischer Begriff erhalten; die syntaktische Beziehung wird natürlich formuliert, ohne den ungenannten Messbezug festzulegen.
