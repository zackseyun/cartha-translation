base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: de
  text: Denn in sieben Tagen werde ich es vierzig Tage und vierzig Nächte lang auf die Erde regnen lassen, und ich werde alles Lebendige, das ich gemacht habe, vom Erdboden[b] wegwischen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch mit „auslöschen“ oder „auslöschen tilgen“ wiedergegeben werden; es bezeichnet bildhaft ein Wegwischen oder Ausradieren.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „von über dem Angesicht des Erdbodens“; gemeint ist: von der Oberfläche des Erdbodens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anweisung ein und bewahrt den erklärenden Zusammenhang.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: in sieben Tagen
  rationale: 'Gibt die hebräische Wendung natürlich wieder: Bis zum Beginn des Regens verbleiben noch sieben Tage.'
- source_word: מַמְטִיר עַל הָאָרֶץ
  choice: werde ich es auf die Erde regnen lassen
  rationale: Bewahrt den kausativen Sinn des Hifil und damit Gottes ausdrückliches Handeln; „Erde“ lässt den umfassenden Aussagecharakter stehen.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: vierzig Tage und vierzig Nächte lang
  rationale: Natürliche deutsche Zeitangabe; „lang“ verdeutlicht die Dauer, ohne den Sinn zu erweitern.
- source_word: וּמָחִיתִי
  choice: und ich werde … wegwischen
  rationale: Erhält das anschauliche Bild des hebräischen Verbs מחה, das Wegwischen beziehungsweise Auslöschen bezeichnet.
- source_word: כָּל הַיְקוּם
  choice: alles Lebendige
  rationale: Bezeichnet im Flutkontext die gesamte von dem Gericht betroffene lebendige Schöpfung; vermeidet das zu umfassende „alles Existierende“.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: das ich gemacht habe
  rationale: Verbindet Gottes vollendetes Schaffen idiomatisch mit dem nun angekündigten Gericht.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Erdboden
  rationale: Bewahrt durch „Erdboden“ die lexikalische Unterscheidung von אֶרֶץ („Erde“); die verkürzte deutsche Form gibt die hebräische Vorstellung von der Oberfläche des Bodens natürlich wieder.
theological_decisions:
- issue: Reichweite des Flutgerichts in אֶרֶץ und כָּל הַיְקוּם
  choice: Breite Formulierungen „Erde“ und „alles Lebendige“, ohne die Reichweite ausdrücklich auf ein örtliches Ereignis einzugrenzen
  alternative: „Land“ und eine entsprechend regional verstandene Reichweite
  rationale: Die umfassende Gerichtssprache des Verses soll in ihrer Spannung erhalten bleiben, ohne eine moderne wissenschaftliche oder konfessionelle Festlegung in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Das kausative „regnen lassen“ bewahrt Gottes Handeln; „wegwischen“ erhält das konkrete Bild. Die Satzstellung folgt natürlichem Deutsch, während „Erde“ und „Erdboden“ die hebräische Wortwahl unterscheiden.
