base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: de
  text: Von den reinen Tieren und von den Tieren, die nicht rein sind[a], und von den Vögeln und von allem, was auf dem Erdboden kriecht –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die unrein sind«. Das Hebräische lautet wörtlich: »die nicht rein sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: von
  rationale: Die Präposition bezeichnet die Herkunft beziehungsweise Zugehörigkeit zu den aufgezählten Gruppen. Ihre Wiederholung bildet die hebräische Aufzählungsstruktur ab.
- source_word: בְּהֵמָה
  choice: Tiere
  rationale: Der Ausdruck bezeichnet hier eine umfassende Tiergruppe im Gegensatz zu Vögeln und kriechenden Tieren; »Tiere« ist im Deutschen natürlich und legt die Bedeutung nicht unnötig auf Nutzvieh fest.
- source_word: טְּהוֹרָה
  choice: rein
  rationale: Im Zusammenhang der kultischen Einteilung von Tieren ist »rein« die übliche und klare deutsche Entsprechung.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: die nicht rein sind
  rationale: Diese Wiedergabe bewahrt die ausdrückliche Verneinung des Hebräischen, statt sie durch das einzelne Gegenwort »unrein« zu ersetzen.
- source_word: עוֹף
  choice: Vögel
  rationale: Obwohl das Wort fliegende Geschöpfe weiter fassen kann, ist »Vögel« hier die natürliche und sachlich passende Wiedergabe.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: alles, was … kriecht
  rationale: Die Formulierung gibt die durch ihre Bewegung gekennzeichnete Gruppe bodennaher Kleintiere verständlich und quellennah wieder.
- source_word: עַל הָאֲדָמָה
  choice: auf dem Erdboden
  rationale: אֲדָמָה bezeichnet hier die Bodenfläche als Lebensraum der kriechenden Tiere; »Erdboden« wahrt zugleich den Bezug zum hebräischen Ausdruck.
theological_decisions:
- issue: Bezeichnung der nicht reinen Tiere
  choice: die nicht rein sind
  alternative: die unrein sind
  rationale: Die analytische Negation des Ausgangstextes bleibt erhalten; dadurch wird keine stärkere terminologische Festlegung eingeführt als im Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition und der abschließende Gedankenstrich bewahren den katalogartigen Satzbau sowie den im Vers fortgesetzten Gedanken.
