  rationale: Die ausdrückliche Nennung Josefs bei der Schlusswendung beseitigt einen im Deutschen möglichen, aber sachlich falschen Bezug auf Jahwe. Die hebräische Bildsprache und ihre offene Nuance bleiben erhalten; die Fußnote benennt weiterhin mögliche idiomatische Auslegungen.
