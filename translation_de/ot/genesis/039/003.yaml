  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: de
  text: Sein Herr sah, dass Jahwe mit Josef war und dass Jahwe alles, was er tat, in Josefs Hand gelingen ließ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Josefs Hand“ oder „unter seiner Leitung“; wörtlich: „in seiner Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das narrative ראה bedeutet hier zunächst schlicht „sehen“, schließt im Zusammenhang aber das Erkennen anhand sichtbarer Ergebnisse ein.
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: Bezeichnet Potifar als Josefs Hausherrn und Besitzer. „Herr“ gibt das soziale Verhältnis knapp und im biblischen Erzählregister angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִתּוֹ
  choice: mit ihm war
  rationale: Die Präpositionalfügung bezeichnet Jahwes Gegenwart und Beistand bei Josef; der Bezug des Pronomens bleibt erhalten.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: alles, was er tat
  rationale: Gibt den umfassenden Sinn der hebräischen Wendung in natürlichem deutschem Erzählstil wieder.
- source_word: מַצְלִיחַ
  choice: gelingen ließ
  rationale: 'Die Hifil-Form ist kausativ: Jahwe bewirkt den Erfolg dessen, was Josef tut.'
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Bewahrt das konkrete hebräische Bild und lässt offen, ob vor allem Josefs Wirken, seine Zuständigkeit oder die durch ihn vermittelte Ausführung gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes; seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter.
- issue: Deutung von בְּיָדוֹ
  choice: „in seiner Hand“ im Haupttext beibehalten
  alternative: „durch seine Hand“ beziehungsweise „unter seiner Leitung“
  rationale: Die wörtliche Fassung erhält die Bildlichkeit und löst die mögliche instrumentale oder zuständigkeitliche Nuance nicht einseitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener hebräischer Bildsprache. Die Satzstellung ist im Deutschen natürlich, ohne die Mehrdeutigkeit der Schlusswendung zu beseitigen.
