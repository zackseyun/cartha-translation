  text: So she kept his garment beside her until his master came home.
translation:
  language: de
  text: Sie ließ sein Gewand neben sich liegen, bis sein Herr nach Hause kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: Sie ließ … liegen
  rationale: Das Hifil von נוח bezeichnet hier, dass sie das Gewand bei sich liegen ließ bzw. aufbewahrte; die Formulierung gibt den fortdauernden Zustand im Deutschen natürlich wieder.
- source_word: בִּגְדוֹ
  choice: sein Gewand
  rationale: בֶּגֶד bezeichnet das Kleidungsstück, das Josef zurückließ; „Gewand“ ist präzise und im Erzählkontext angemessen.
- source_word: אֶצְלָהּ
  choice: neben sich
  rationale: Die Präposition אֵצֶל mit Suffix bedeutet räumlich „bei/neben ihr“; „neben sich“ bewahrt diese konkrete Aussage.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: bis sein Herr nach Hause kam
  rationale: 'Wörtlich: „bis sein Herr in sein Haus kam“. Das idiomatische „nach Hause kam“ gibt die Bewegung in das eigene Haus knapp und natürlich wieder.'
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die Übersetzung bleibt eng am hebräischen Satz und verwendet zugleich die im Deutschen natürliche Wendung „nach Hause kam“.
