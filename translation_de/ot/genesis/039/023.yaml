- from: Der Leiter des Gefängnisses kümmerte sich um nichts von dem, was seiner Aufsicht anvertraut war[a], denn Jahwe war mit ihm; und alles, was er tat, ließ Jahwe gelingen.[b]
  to: Der Leiter des Gefängnisses kümmerte sich um nichts von allem, was Josef anvertraut war[a], denn Jahwe war mit ihm; und was Josef auch tat, Jahwe ließ es gelingen.[b]
  rationale: Die Revision beseitigt die syntaktische Mehrdeutigkeit, indem Josef bei beiden auf ihn bezogenen Aussagen ausdrücklich genannt wird. Dadurch bleibt klar, dass der Gefängnisleiter Josefs Aufgaben nicht selbst überwachte und dass Jahwe Josefs Tun gelingen ließ. Die Fußnotenanker bleiben an den jeweiligen Aussagen; die Fußnote zu b wird idiomatisch und eindeutig formuliert.
