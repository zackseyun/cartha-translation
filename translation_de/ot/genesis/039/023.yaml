  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: de
  text: Der Leiter des Gefängnisses kümmerte sich um nichts von allem, was Josef anvertraut war[a], denn Jahwe war mit ihm; und was Josef auch tat, Jahwe ließ es gelingen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von all dem, was in seiner Hand war“; gemeint ist, was Josef zur Aufsicht und Verantwortung übertragen worden war.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Jahwe verschaffte allem, was Josef tat, Erfolg.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: der Leiter des Gefängnisses
  rationale: שַׂר bezeichnet hier den verantwortlichen Vorsteher bzw. Amtsträger. „Leiter des Gefängnisses“ gibt seine Verwaltungs- und Aufsichtsfunktion in natürlichem modernem Deutsch wieder.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: kümmerte sich um nichts
  rationale: Wörtlich steht eine Konstruktion mit „nicht sehen“. Im Zusammenhang bezeichnet sie, dass der Gefängnisleiter die Josef übertragenen Angelegenheiten nicht mehr überprüfen oder selbst beaufsichtigen musste.
- source_word: בְּיָדוֹ
  choice: was seiner Aufsicht anvertraut war
  rationale: „In seiner Hand“ ist ein hebräisches Bild für etwas, das jemandes Verfügungsgewalt und Verantwortung übertragen wurde. Die gewählte Formulierung vermittelt den idiomatischen Sinn klar.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: denn Jahwe war mit ihm
  rationale: בַּאֲשֶׁר ist hier kausal zu verstehen und nennt den Grund für das Vertrauen des Gefängnisleiters.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: und alles, was er tat
  rationale: Die umfassende Relativkonstruktion bezieht sich im Kontext auf Josefs gesamte Tätigkeit.
- source_word: מַצְלִיחַ
  choice: ließ ... gelingen
  rationale: 'Die Hifil-Form von צלח ist kausativ: Jahwe bewirkte, dass Josefs Tun Erfolg hatte. „ließ ... gelingen“ bewahrt diese Aussage in idiomatischem Deutsch.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Ursache von Josefs Erfolg
  choice: Jahwe ließ Josefs gesamtes Tun gelingen
  alternative: Josefs Tun gelang
  rationale: Die kausative Verbform schreibt den Erfolg ausdrücklich Jahwes Wirken zu; diese Aussage wird nicht zu einer bloßen Feststellung von Josefs Erfolg abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verwaltungsfunktion des Gefängnisleiters und die hebräische Aussage, dass Jahwe den Erfolg bewirkte, bleiben deutlich; das Bild „in seiner Hand“ wird zugunsten unmittelbarer Verständlichkeit im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
