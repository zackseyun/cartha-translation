  text: וַ/יְהִ֕י כַּ/הֲרִימִ֥/י קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֥ב בִּגְד֛/וֹ אֶצְלִ֖/י וַ/יָּ֥נָס הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: de
  text: Als ich meine Stimme erhob und laut rief, ließ er sein Gewand[a] bei mir zurück und floh nach draußen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kleidungsstück“. Das hebräische Wort בֶּגֶד bezeichnet allgemein Kleidung und legt nicht fest, um welches Kleidungsstück es sich handelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: Als ich … erhob
  rationale: Die Konstruktion leitet hier einen temporalen Nebensatz ein. „Als ich … erhob“ gibt den Erzählfluss und das idiomatische Erheben der Stimme natürlich wieder.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: קוֹל bezeichnet in diesem Zusammenhang die Stimme; „die Stimme erheben“ ist auch im Deutschen die passende Wendung.
- source_word: וָאֶקְרָא
  choice: und laut rief
  rationale: קרא kann „rufen“, „ausrufen“ oder „schreien“ bedeuten. „Laut rief“ vermittelt den alarmierenden Ruf, ohne ausdrücklich „um Hilfe“ zu ergänzen.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: ließ er sein Gewand … zurück
  rationale: עזב bezeichnet hier das Zurücklassen; בגד ist eine allgemeine Bezeichnung für ein Kleidungsstück. „Gewand“ ist knapp und dem würdevollen Erzählstil angemessen, ohne die genaue Art festzulegen.
- source_word: אֶצְלִי
  choice: bei mir
  rationale: אצל bezeichnet räumliche Nähe beziehungsweise Verbleib bei einer Person. „Bei mir“ bewahrt diese Offenheit besser als eine ausdrücklich besitzanzeigende Formulierung.
- source_word: וַיָּנָס הַחוּצָה
  choice: und floh nach draußen
  rationale: נוס bezeichnet eiliges Fliehen; die Richtungsendung in הַחוּצָה zeigt eine Bewegung hinaus an, die „nach draußen“ natürlich wiedergibt.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die Formulierung vermeidet die nicht ausdrücklich im Hebräischen stehende Ergänzung „um Hilfe“ und bewahrt bei „bei mir“ die räumliche Offenheit des Ausgangstextes.
