source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: de
  text: Niemand ist in diesem Haus größer als ich[a], und er hat mir nichts vorenthalten außer dir, weil du seine Frau bist. Wie könnte ich da dieses große Unrecht[b] tun und gegen Gott sündigen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ist in diesem Haus nicht größer als ich.“ Dann bezieht sich die Aussage auf den Hausherrn.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „dieses große Böse“ oder „diese große Bosheit“. Das hebräische Wort kann Böses, Bosheit oder Unrecht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל בַּבַּיִת הַזֶּה מִמֶּנִּי
  choice: Niemand ist in diesem Haus größer als ich
  rationale: Die Konstruktion wird im Zusammenhang als Aussage über Josefs höchsten Rang innerhalb des Hauses verstanden. Die gewählte Formulierung ist im Deutschen klar und natürlich; die grammatisch mögliche Bezugnahme auf den Hausherrn wird in einer Fußnote bewahrt.
- source_word: בַּבַּיִת הַזֶּה
  choice: in diesem Haus
  rationale: בַּיִת kann sowohl das Gebäude als auch den Haushalt und dessen Verwaltungsbereich bezeichnen. „Haus“ bewahrt die hebräische Bildwelt und ist im Kontext weit genug.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: hat mir nichts vorenthalten
  rationale: חָשַׂךְ bezeichnet hier das Zurückhalten oder Vorenthalten; unter der Verneinung bedeutet מְאוּמָה „nichts“.
- source_word: כִּי אִם אוֹתָךְ
  choice: außer dir
  rationale: כִּי אִם markiert nach einer Verneinung eine Ausnahme.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: weil du seine Frau bist
  rationale: Die Wendung begründet, warum allein die Frau des Hausherrn von Josefs Vollmacht ausgenommen ist.
- source_word: וְאֵיךְ
  choice: Wie könnte ich da
  rationale: „Da“ gibt den folgernden Sinn des וְ wieder und führt natürlich zu Josefs moralischer Schlussfolgerung.
- source_word: אֶעֱשֶׂה
  choice: tun
  rationale: עָשָׂה ist das gewöhnliche Verb für „tun“; eine stärker deutende Wiedergabe wie „begehen“ ist nicht erforderlich.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: dieses große Unrecht
  rationale: רָעָה kann Böses, Bosheit oder Unrecht bezeichnen. „Dieses große Unrecht“ ist natürliches modernes Deutsch und bewahrt die starke moralische Wertung.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: und gegen Gott sündigen
  rationale: חטא mit ל bezeichnet hier ein Sündigen gegen jemanden; „gegen Gott sündigen“ ist die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Josefs Aussage
  choice: Gott
  alternative: ein Gott
  rationale: Im Erzählzusammenhang spricht Josef von dem Gott, dem er verantwortlich ist. Die moralische Aussage geht über ein bloßes Vergehen gegen seinen Herrn hinaus.
- issue: Subjekt von אֵינֶנּוּ גָדוֹל
  choice: Niemand ist größer als ich
  alternative: Er ist nicht größer als ich
  rationale: Der Zusammenhang stützt eine Aussage über Josefs Rang im gesamten Haushalt. Da die hebräische Form auch auf den zuvor genannten Hausherrn bezogen werden kann, bleibt diese Lesart ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. „Haus“ erhält die Bildsprache des Hebräischen, während „Unrecht“ die Aussage für heutige Leser natürlich und verständlich formuliert. Die Satzfolge bleibt eng an der hebräischen Argumentation: Rang und Vertrauen, die einzige Ausnahme, dann die moralische und theologische Schlussfolgerung.'
