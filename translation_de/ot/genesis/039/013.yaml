base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: de
  text: Und es geschah, als sie sah, dass er sein Gewand in ihrer Hand zurückgelassen hatte und nach draußen geflohen war,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Form dient als erzählerischer Übergang. Die traditionelle, aber weiterhin verständliche Wendung gibt sie vollständig wieder; der Doppelpunkt leitet den folgenden temporalen Satz ein.
- source_word: כִּרְאוֹתָהּ
  choice: als sie sah
  rationale: 'כ mit dem Infinitivus constructus von ראה und dem Suffix der 3. Person Femininum Singular bezeichnet hier den Zeitpunkt: „als sie sah“.'
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt ihrer Wahrnehmung ein und wird im Deutschen natürlich mit „dass“ wiedergegeben.
- source_word: עָזַב
  choice: zurückgelassen hatte
  rationale: עזב bedeutet hier „(zurück)lassen“. Das Plusquamperfekt kennzeichnet die Handlung als der Wahrnehmung vorausgehend; „zurückgelassen“ passt zum konkreten Situationszusammenhang.
- source_word: בִּגְדוֹ
  choice: sein Gewand
  rationale: בגד bezeichnet allgemein ein Kleidungsstück oder Gewand. „Gewand“ wahrt diese Breite, ohne den Gegenstand als Mantel zu spezifizieren.
- source_word: בְּיָדָהּ
  choice: in ihrer Hand
  rationale: Die wörtliche Wiedergabe bewahrt das konkrete Bild und ist im Deutschen idiomatisch.
- source_word: וַיָּנָס
  choice: geflohen war
  rationale: נוס bezeichnet eine eilige Flucht. Das Plusquamperfekt entspricht der zeitlichen Einordnung innerhalb des dass-Satzes.
- source_word: הַחוּצָה
  choice: nach draußen
  rationale: Die Richtungsendung bezeichnet eine Bewegung hinaus; „nach draußen“ gibt diese direktionale Bedeutung im Deutschen natürlich wieder.
