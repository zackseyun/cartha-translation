base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: de
  text: 'Da rief sie die Männer ihres Haushalts und sagte zu ihnen: „Seht! Er hat uns einen Hebräer gebracht, um uns zu verhöhnen.[a] Er kam zu mir, um mit mir zu schlafen, und ich schrie laut.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um sich über uns lustig zu machen“ oder „um ein übles Spiel mit uns zu treiben“. Das hebräische Verb kann Spott oder missbräuchliches, entehrendes Spiel bezeichnen; in dieser Anschuldigung kann es zugleich einen sexuellen Unterton haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Da rief sie die Männer ihres Hauses
  rationale: Das Narrativpräteritum gibt die fortschreitende Handlung natürlich wieder. אַנְשֵׁי bezeichnet ausdrücklich Männer; „ihres Hauses“ kann sowohl das Haus als auch den Haushalt bezeichnen.
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: und sagte zu ihnen
  rationale: Die formelhafte Wiederholung „sagte … und sprach“ wird im natürlichen modernen Deutsch ohne Bedeutungsverlust gestrafft.
- source_word: רְאוּ
  choice: Seht!
  rationale: Der pluralische Imperativ richtet die Aufmerksamkeit der versammelten Männer auf die folgende Anschuldigung.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Er hat uns einen hebräischen Mann gebracht
  rationale: Das Perfekt wird als Handlung mit gegenwärtiger Relevanz wiedergegeben. „Einen hebräischen Mann“ bewahrt sowohl אִישׁ als auch die ethnische Bezeichnung עִבְרִי; „uns“ erhält den gemeinschaftsbildenden Dativ.
- source_word: לְצַחֶק בָּנוּ
  choice: damit der seinen Spott mit uns treibt
  rationale: Die Formulierung bewahrt den Vorwurf von Spott und entehrendem Spiel, ohne die im Verb liegende Mehrdeutigkeit vorschnell ausschließlich sexuell festzulegen.
- source_word: בָּא אֵלַי
  choice: Er kam zu mir
  rationale: Die schlichte Richtungsangabe entspricht בוא mit אֶל und vermeidet die zusätzliche Festlegung, er sei ausdrücklich in ein Zimmer eingedrungen.
- source_word: לִשְׁכַּב עִמִּי
  choice: um mit mir zu schlafen
  rationale: Dies ist im heutigen Deutsch die natürliche und klar verständliche sexuelle Entsprechung der hebräischen Wendung „bei/mit jemandem liegen“.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: und ich schrie laut
  rationale: „Schrie“ entspricht dem Hilferuf im Kontext; „laut“ gibt die idiomatische Wendung „mit großer Stimme“ natürlich wieder. Das „und“ wahrt die hebräische Verknüpfung, ohne einen nicht ausdrücklich markierten Gegensatz einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, mündlich glaubwürdiger Rede. Die ethnische und männliche Kennzeichnung Josephs sowie die Mehrdeutigkeit des Vorwurfs werden bewahrt; unnötig altertümliche Wendungen wie „bei mir liegen“ oder „mit großer Stimme“ werden vermieden.
