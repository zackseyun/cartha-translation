source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: de
  text: So überließ er alles, was ihm gehörte, der Hand Josefs[a], und kümmerte sich um nichts mehr außer um die Speise, die er aß.[b] Josef aber war von schöner Gestalt und schön anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Josefs Hand“; die Hand steht hier für Verantwortung und Verfügungsgewalt.'
    reason: hebräisches_idiom
  - marker: b
    text: 'Wörtlich: „das Brot, das er aß“; „Brot“ kann hier Nahrung oder Speise allgemein bezeichnen. Der vorausgehende hebräische Satzteil lautet wörtlich etwa: „und er wusste bei/mit ihm von nichts“.'
    reason: lexikalische_und_syntaktische_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: überließ
  rationale: Das Verb bedeutet grundsätzlich „lassen, zurücklassen“. Im administrativen Zusammenhang gibt „überließ“ natürlich wieder, dass Potifar Josef die Verantwortung übertrug, ohne die Aussage stärker als nötig auszudeuten.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: alles, was ihm gehörte
  rationale: Die Wendung umfasst Potifars gesamten Besitz beziehungsweise seine Angelegenheiten und bleibt dabei nah am hebräischen Ausdruck.
- source_word: בְּיַד יוֹסֵף
  choice: der Hand Josefs
  rationale: Die Wiedergabe bewahrt das hebräische Bild der Hand als Ausdruck von Verfügungsgewalt und Verantwortung; eine Fußnote erläutert das Idiom.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: und kümmerte sich um nichts mehr
  rationale: Wörtlich steht etwa „und er wusste bei/mit ihm von nichts“. Im Zusammenhang bezeichnet die Wendung, dass Potifar wegen Josefs Verwaltung nichts weiter selbst beachten musste. Die natürliche deutsche Fassung gibt diesen Sinn wieder, ohne aus bloßer Unkenntnis Potifars eine eigene Aussage zu machen.
- source_word: כִּי אִם
  choice: außer
  rationale: Die Konstruktion kennzeichnet knapp und eindeutig eine Ausnahme.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: die Speise, die er aß
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann aber allgemein Nahrung oder Mahlzeit bezeichnen. „Speise“ wahrt den gehobenen Erzählton und lässt den allgemeineren Sinn erkennen; der Wortlaut wird in der Fußnote genannt.
- source_word: וַיְהִי יוֹסֵף
  choice: Josef aber war
  rationale: Das „aber“ markiert im Deutschen den erzählerischen Übergang zu Josefs Aussehen und bereitet die folgende Szene vor, ohne ein Werden zu behaupten.
- source_word: יְפֵה תֹאַר
  choice: von schöner Gestalt
  rationale: Die Wendung bezieht sich auf Körperbau beziehungsweise Gestalt. Die Formulierung erhält die Unterscheidung von der nachfolgenden sichtbaren Erscheinung.
- source_word: וִיפֵה מַרְאֶה
  choice: schön anzusehen
  rationale: Die natürliche deutsche Wendung beschreibt Josefs äußere Erscheinung und bewahrt zugleich den Parallelismus mit „von schöner Gestalt“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Erzählton. Der Parallelismus der beiden Beschreibungen von Josefs Schönheit bleibt erhalten. Die schwer wörtlich wiederzugebende Verbindung אִתּוֹ wird im Haupttext kontextgemäß geglättet und in der Fußnote offengelegt.
