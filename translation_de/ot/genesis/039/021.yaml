source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: de
  text: Doch Jahwe war mit Josef. Er erwies ihm treue Liebe[a] und ließ ihn beim Gefängnisleiter Gunst finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beständige Güte“ beziehungsweise „loyale Güte“. Das hebräische Wort חֶסֶד bezeichnet eine beständige, treue und gütige Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְהִי ... אֶת
  choice: war mit
  rationale: Die Wendung bezeichnet Gottes begleitende Gegenwart und wird im Deutschen idiomatisch mit „war mit“ wiedergegeben.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: erwies ihm treue Liebe
  rationale: Die idiomatische Verbindung bezeichnet die tätige Zuwendung von חֶסֶד. „Treue Liebe“ bewahrt den Gedanken beständiger, loyaler Güte, ohne hier ausdrücklich einen Bund vorauszusetzen.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: ließ ihn ... Gunst finden
  rationale: Diese natürliche deutsche Wendung gibt wieder, dass Jahwe Josef die wohlwollende Anerkennung des Gefängnisleiters verschaffte.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: Gefängnisleiter
  rationale: Die konstruktive Wortgruppe bezeichnet den für das Gefängnis verantwortlichen Amtsträger; „Gefängnisleiter“ ist präzise und modernes Deutsch.
- source_word: וַ
  choice: Doch
  rationale: Die adversative Wiedergabe macht den sachlichen Gegensatz zwischen Josefs Gefangenschaft im vorherigen Vers und Jahwes fortdauernder Gegenwart deutlich.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: beständige Güte; loyale Güte; Bundestreue
  rationale: חֶסֶד umfasst beständige, loyale und gütige Zuwendung. Da in diesem Vers kein Bund ausdrücklich genannt wird, vermeidet „treue Liebe“ eine mögliche Überdeutung, ohne die theologische Tiefe auf bloße Freundlichkeit zu reduzieren.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname des hebräischen Textes bleibt als Name sichtbar; die traditionelle Ersetzung durch einen Titel wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste kurze Satz hebt Jahwes Gegenwart in Josefs Gefangenschaft hervor; die folgende Formulierung bleibt flüssig und für heutige Leser unmittelbar verständlich.
