base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: de
  text: Eines Tages[a] ging er ins Haus, um seine Arbeit zu verrichten; und keiner von den Männern des Hauses war dort im Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie an diesem Tag“. Die hebräische Wendung ist idiomatisch und kann auch „an einem Tag wie diesem“ oder „zu dieser Zeit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da geschah es
  rationale: Die hebräische Erzählformel leitet das nächste Ereignis ein. „Da geschah es“ wahrt den erzählerischen Anschluss, ohne altertümlich zu wirken.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: an einem solchen Tag
  rationale: Die Wendung bezeichnet idiomatisch einen bestimmten Anlass beziehungsweise einen Tag dieser Art. Die Übersetzung bleibt nahe am Bild des Hebräischen und klingt zugleich natürlich.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: dass er ins Haus kam
  rationale: בוא mit dem Richtungs-he bezeichnet eine Bewegung in das Haus hinein. „Ins Haus kam“ gibt sowohl das Verb als auch die Zielrichtung wieder.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: um seine Arbeit zu tun
  rationale: מְלָאכָה bezeichnet hier am naheliegendsten die Arbeit oder Aufgabe, die ihm im Haus oblag. Die schlichte Formulierung vermeidet spekulative Deutungen.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: und von den Männern des Hauses war niemand
  rationale: Die negative Existenzkonstruktion wird im Deutschen natürlich mit „niemand“ wiedergegeben; „von den Männern des Hauses“ bewahrt die ausdrücklich männliche Bezeichnung des Ausgangstextes.
- source_word: שָׁם בַּבָּיִת
  choice: dort im Haus
  rationale: „Dort“ gibt שָׁם ausdrücklich wieder, während „im Haus“ den Ort nennt. So bleibt die locative Verstärkung des Hebräischen erhalten, ohne die volle Wortwiederholung „Haus … Haus“ zu vermeiden, die bereits im Vers vorhanden ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater Formnähe. Die Wiederholung von „Haus“ und die Angabe „dort“ wurden beibehalten, weil beide im Hebräischen ausdrücklich stehen; die Satzstellung wurde für einen natürlichen deutschen Erzählfluss angepasst.
