  naturalness: Der revidierte Satz verwendet modernes Standarddeutsch. Die Koordination mit „und wollte weder ... noch ...“ macht die im Deutschen sonst sperrige Anbindung der Infinitive an „auf sie hören“ klar, ohne den Sinn zu verändern.
  terminology: „Josef“ ist die übliche deutsche Namensform. „Bei ihr liegen“ lässt, wie אֶצְלָהּ, räumliche Nähe erkennen und bleibt im erzählerischen Kontext für die sexuelle Bedeutung offen. „Mit ihr zusammen sein“ gibt לִהְיוֹת עִמָּהּ breit und idiomatisch wieder.
