  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: de
  text: 'Und es geschah: Als sie Tag für Tag zu Josef sprach, hörte er nicht auf sie und wollte weder bei ihr liegen[a] noch mit ihr zusammen sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihr liegen“ oder „mit ihr schlafen“. Das hebräische Verb kann hier sexuell gemeint sein; „bei ihr liegen“ bewahrt zugleich die räumliche Formulierung und lässt dem folgenden „mit ihr zusammen sein“ sein eigenes Gewicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: Und obwohl sie … auf ihn einredete
  rationale: Die Konstruktion leitet die fortdauernde Situation ein; zusammen mit יוֹם יוֹם und der anschließenden Verneinung gibt „obwohl“ den konzessiven Zusammenhang im natürlichen Deutschen wieder. „Auf ihn einreden“ bringt die wiederholte, drängende Rede zum Ausdruck.
- source_word: יוֹסֵף
  choice: Josef
  rationale: „Josef“ ist die etablierte moderne deutsche Form des hebräischen Namens.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wiederholung des Substantivs bezeichnet ein fortgesetztes, tägliches Geschehen.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: hörte er nicht auf sie
  rationale: שׁמע mit אֶל bedeutet hier, einer Aufforderung Gehör zu schenken bzw. ihr Folge zu leisten. Die deutsche Wendung bewahrt sowohl den Hörbezug als auch den Sinn der Weigerung.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: neben ihr liegen
  rationale: אֵצֶל bezeichnet räumliche Nähe, während שׁכב im Kontext zugleich sexuell verstanden werden kann. Die Formulierung bewahrt diese Spannung, ohne die folgende Wendung einzuebnen.
- source_word: לִהְיוֹת עִמָּהּ
  choice: mit ihr zusammen sein
  rationale: Die Wendung bedeutet wörtlich „mit ihr sein“ und kann über den Geschlechtsverkehr hinaus auch ihre Gesellschaft bzw. kompromittierende Nähe meinen.
theological_decisions:
- issue: Umfang von Josefs Weigerung
  choice: 'Die beiden Infinitivwendungen werden unterschieden wiedergegeben: „neben ihr liegen“ und „mit ihr zusammen sein“.'
  alternative: Beide Wendungen ausschließlich auf den Geschlechtsverkehr beziehen.
  rationale: Der hebräische Text lässt neben dem eindeutig sexuellen Kontext erkennen, dass Josef auch fortgesetzte Nähe zu ihr mied; diese mögliche Erweiterung soll nicht dogmatisch verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf jemanden einreden“ vermittelt die beharrliche tägliche Aufforderung natürlich; der Doppelpunkt macht deutlich, worin Josef ihr nicht folgte.
