base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: de
  text: Von dem Zeitpunkt an, als er ihn über sein Haus und seinen gesamten Besitz eingesetzt hatte,[a] segnete Jahwe das Haus des Ägypters wegen Josef. Und der Segen Jahwes war bei allem, was ihm gehörte, im Haus und auf dem Feld.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von da an, nachdem er ihn mit der Aufsicht über sein Haus und seinen gesamten Besitz betraut hatte.“'
    reason: Die hebräische Zeitfügung kann den Zeitpunkt der Einsetzung oder den anschließenden Zeitraum nach der Betrauung hervorheben.
  - marker: b
    text: 'Wörtlich: „Und der Segen Jahwes war in allem, was ihm gehörte, im Haus und auf dem Feld.“'
    reason: Die Präposition ב kennzeichnet den Bereich beziehungsweise Umfang, in dem der Segen wirksam war; die wörtlichere Form bewahrt diese offene räumlich-sachliche Nuance.
lexical_decisions:
- source_word: מֵאָז
  choice: Von der Zeit an
  rationale: Die Wendung bezeichnet den Zeitpunkt, von dem an der folgende Zustand eintrat; die deutsche Formulierung gibt diesen zeitlichen Ausgangspunkt klar wieder.
- source_word: הִפְקִיד
  choice: eingesetzt hatte
  rationale: Der Hifil von פקד bezeichnet hier die Übertragung von Aufsicht und Verantwortung. „Einsetzen“ wahrt den offiziellen Charakter und passt natürlich zur Konstruktion mit „über“.
- source_word: בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: über sein Haus und seinen ganzen Besitz
  rationale: Im Zusammenhang mit הפקיד bezeichnen die Präpositionen den Verantwortungsbereich Josefs. „Sein ganzer Besitz“ gibt idiomatisch alles wieder, was dem Ägypter gehörte.
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: ברך bedeutet ausdrücklich „segnen“. Die materiellen Folgen im Kontext rechtfertigen nicht, die göttliche Segenshandlung auf „gedeihen lassen“ zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt das Tetragramm; „Jahwe“ gibt den Eigennamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּית הַמִּצְרִי
  choice: das Haus des Ägypters
  rationale: Die Konstruktion kann Haus, Haushalt oder Hauswesen umfassen. Die konkrete Wiedergabe „Haus“ wahrt die Wiederaufnahme von בַּבַּיִת am Versende.
- source_word: בִּגְלַל יוֹסֵף
  choice: wegen Josef
  rationale: בגלל bezeichnet den Grund beziehungsweise Anlass. „Wegen Josef“ ist direkt, verständlich und lässt offen, auf welche Weise Josef Anlass des Segens war.
- source_word: בִּרְכַּת יְהוָה
  choice: der Segen Jahwes
  rationale: Die Genitivverbindung bewahrt die ausdrückliche Zuordnung des Segens zu Jahwe.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: auf seinem ganzen Besitz
  rationale: Die Präposition bezeichnet hier den Bereich, auf dem der Segen liegt. „Auf“ verbindet sich im Deutschen natürlich mit „ruhte“.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: im Haus und auf dem Feld
  rationale: Die konkreten Bereiche bilden zusammen eine umfassende Angabe des häuslichen und landwirtschaftlichen Besitzes; die deutsche Präpositionswahl ist idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Gottesnamen selbst verwendet, wird er als „Jahwe“ wiedergegeben. Die traditionelle Ersetzung durch den Titel „der HERR“ ist möglich, würde aber die Unterscheidung zwischen Eigenname und Titel einebnen.
- issue: Art des Segens
  choice: segnete / der Segen Jahwes ruhte
  alternative: ließ gedeihen / Erfolg
  rationale: Der Wortlaut spricht von ברך, nicht lediglich von wirtschaftlichem Erfolg. Die Übersetzung bewahrt daher die theologische Aussage göttlichen Segens, ohne dessen Wirkung näher zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. „Haus“ bleibt bewusst stehen, obwohl im Kontext auch Haushalt oder Hauswesen mitschwingen kann. Die Satzteilung entlastet den langen hebräischen Satz, ohne seine inhaltlichen Beziehungen zu verändern.
