    rationale: Der Text sagt, dass sie ihre Stimme erhob und rief/schrie, spezifiziert aber nicht ausdrücklich, dass sie um Hilfe rief. Der Kontext kann dies nahelegen, darf aber nicht in den Wortlaut übernommen werden.
