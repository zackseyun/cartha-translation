  source_fidelity: Die Wiedergabe der Zeitfolge, des Inhalts von „hörte“, des zurückgelassenen Gewands sowie der Flucht nach draußen ist grundsätzlich zutreffend. „um Hilfe rief“ legt jedoch einen Hilferuf ausdrücklich fest; קרא bezeichnet hier zwar einen lauten Ruf, nennt aber dessen Inhalt nicht. Auch „lief hinaus“ fügt gegenüber der getrennten hebräischen Folge „floh und ging hinaus“ eine spezifischere Bewegungsart hinzu.
  naturalness: Der Satz ist gut verständlich und idiomatisch. „floh und ging hinaus“ bewahrt die knappe erzählerische Reihung des Hebräischen natürlicher und genauer als „floh und lief hinaus“.
  terminology: „Gewand“ ist für בגד im Singular passend. „bei mir zurück“ gibt אצלי angemessen wieder, ohne die räumliche Beziehung unnötig auf „neben“ einzugrenzen. Der Ruf sollte inhaltlich offen bleiben.
