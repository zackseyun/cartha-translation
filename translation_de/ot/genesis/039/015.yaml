  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: de
  text: Als er hörte, dass ich meine Stimme erhob und rief[a], ließ er sein Gewand bei mir zurück[b], floh und ging hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Stimme erhob und laut schrie«.'
