- from: Als er hörte, dass ich meine Stimme erhob und um Hilfe rief[a], ließ er sein Gewand neben mir liegen[b], floh und lief hinaus.
  to: Als er hörte, dass ich meine Stimme erhob und rief[a], ließ er sein Gewand bei mir zurück[b], floh und ging hinaus.
  rationale: Die Revision entfernt die nicht ausdrücklich im hebräischen Text genannte Aussage, sie habe „um Hilfe“ gerufen, und bewahrt die Abfolge „floh und ging hinaus“. Zugleich wird die Bedeutung von אצלי mit „bei mir zurück“ angemessen offen wiedergegeben. Die Fußnotenmarker bleiben unmittelbar an den jeweiligen Formulierungen verankert.
