    rationale: וינס bezeichnet bereits das Fliehen; ויצא החוצה fügt das Hinausgehen hinzu. „ging hinaus“ erhält die zweigliedrige Folge ohne zusätzliche Festlegung des Tempos.
  - severity: low
    issue: „neben mir“ ist enger als אצלי.
    rationale: Die Präposition kann das Zurücklassen bei einer Person bezeichnen; „bei mir zurück“ bildet dies idiomatisch und weniger räumlich präzise ab.
