    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Als er hörte
  rationale: Die hebräische Erzählungsformel mit der temporalen Infinitivkonstruktion wird im modernen Deutschen natürlich als Temporalsatz wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was er hörte.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: ich meine Stimme erhob
  rationale: Die deutsche Wendung bewahrt das hebräische Bild und klingt zugleich verständlich und würdig.
- source_word: וָאֶקְרָא
  choice: und um Hilfe rief
  rationale: Im Kontext bezeichnet קרא einen lauten Alarmruf; »um Hilfe rief« macht die aus der Szene erkennbare Funktion deutlich, ohne einen konkreten Wortlaut hinzuzufügen.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: ließ er sein Gewand liegen
  rationale: »Gewand« entspricht dem Singular בגד; »liegen lassen« gibt die konkrete Handlung im Deutschen natürlich wieder.
- source_word: אֶצְלִי
  choice: neben mir
  rationale: Die Präposition bezeichnet räumliche Nähe beziehungsweise den Verbleib bei einer Person; »neben mir« ist hier anschaulich, während »bei mir« als Alternative möglich bleibt.
- source_word: וַיָּנָס
  choice: floh
  rationale: נוס bezeichnet eine hastige Flucht.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: und lief hinaus
  rationale: Die Konstruktion bezeichnet die Bewegung nach draußen; »lief hinaus« passt zur unmittelbar vorausgehenden Flucht und ist idiomatisches Deutsch.
