source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: de
  text: Jahwe war mit Josef, und er war ein Mann, dem alles gelang[a]; und er war im Haus seines ägyptischen Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein erfolgreicher Mann«. Das hebräische Partizip kann jemanden bezeichnen, der Erfolg hat oder dem sein Tun gelingt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֶת יוֹסֵף
  choice: mit Josef
  rationale: Die Wendung bezeichnet Jahwes Gegenwart bei Josef und lässt den damit verbundenen Beistand anklingen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: אִישׁ מַצְלִיחַ
  choice: ein erfolgreicher Mann
  rationale: מַצְלִיחַ bezeichnet jemanden, dessen Tun gelingt beziehungsweise der Erfolg hat; »erfolgreich« ist im heutigen Deutsch natürlich und weniger auf materiellen Wohlstand verengt als »wohlhabend«.
- source_word: וַיְהִי
  choice: wurde … war
  rationale: Beim mittleren Vorkommen gibt »wurde« die erzählerische Entwicklung idiomatisch wieder; beim letzten bezeichnet »war« Josefs Aufenthaltsort. Die wiederholte Satzverknüpfung bleibt erkennbar.
- source_word: בְּבֵית אֲדֹנָיו
  choice: im Haus seines Herrn
  rationale: Die konkrete Ortsangabe »im Haus« wird bewahrt. »Herr« bezeichnet hier den menschlichen Hausherrn und Autoritätsträger Josefs.
- source_word: הַמִּצְרִי
  choice: ägyptischen
  rationale: Das Adjektiv kennzeichnet Josefs Herrn als Ägypter und wird im Deutschen natürlich attributiv wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zusammenhang zwischen Jahwes Gegenwart und Josefs Erfolg
  choice: Die beiden Aussagen werden nebeneinandergestellt, ohne einen ausdrücklichen Kausalsatz einzufügen.
  alternative: Weil Jahwe mit Josef war, wurde er erfolgreich.
  rationale: Der Text legt den Zusammenhang nahe, formuliert ihn in diesem Vers jedoch nicht ausdrücklich als Ursache und Wirkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Erzählfolge des Hebräischen bleibt durch kurze, mit »und« beziehungsweise Semikolon verbundene Aussagen hörbar; unnötig altertümliche Formulierungen werden vermieden.
