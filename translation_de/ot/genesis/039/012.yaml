base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: de
  text: 'Da packte sie ihn am Gewand[a] und sagte: »Schlaf mit mir!«[b] Doch er ließ sein Gewand in ihrer Hand, floh und lief hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „am Kleidungsstück“. Das hebräische Wort bezeichnet allgemein ein Kleidungsstück und legt nicht fest, ob ein Mantel oder ein anderes Gewand gemeint ist.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Leg dich mit mir hin!“ Die hebräische Wendung verwendet das Verb „liegen“ als verhüllenden Ausdruck für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: Da packte sie ihn
  rationale: תפשׂ bezeichnet ein festes Ergreifen. „Packte“ gibt die plötzliche körperliche Handlung im modernen Deutschen anschaulich wieder.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: am Gewand / sein Gewand
  rationale: בגד ist eine allgemeine Bezeichnung für ein Kleidungsstück. „Gewand“ bewahrt diese Offenheit, ohne eine bestimmte Art von Kleidung festzulegen.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv leitet die direkte Rede ein. Im Deutschen ist die finite Wendung hier natürlicher als „sagend“.
- source_word: שִׁכְבָה עִמִּי
  choice: Leg dich zu mir!
  rationale: Die Verbindung von שׁכב mit עִם ist hier eine sexuelle Aufforderung. „Leg dich zu mir“ bewahrt die bildhafte Ausdrucksweise und ihre sprachliche Zurückhaltung.
- source_word: וַיַּעֲזֹב
  choice: er ließ
  rationale: עזב bedeutet hier, dass Josef das Kleidungsstück zurückließ. „Ließ“ passt idiomatisch zur folgenden Ortsangabe „in ihrer Hand“.
- source_word: בְּיָדָהּ
  choice: in ihrer Hand
  rationale: Die wörtliche Wiedergabe von יד ist im Deutschen natürlich und beschreibt, dass das Gewand in ihrem Besitz beziehungsweise Griff blieb.
- source_word: וַיָּנָס
  choice: floh
  rationale: נוס bezeichnet eine dringliche Flucht; „floh“ erhält die knappe Intensität der Erzählung.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: und lief hinaus
  rationale: יצא mit החוצה bezeichnet die Bewegung aus dem Inneren nach draußen. „Lief hinaus“ ist natürlich und bewahrt neben „floh“ die zweite, ausdrücklich genannte Handlung.
