- from: Josef fand Gunst in seinen Augen und diente ihm. Da setzte er ihn über sein Haus, und alles, was ihm gehörte, gab er in seine Hand.[a]
  to: Josef fand Gunst in seinen Augen und diente ihm. Darauf setzte sein Herr ihn über sein Haus und gab alles, was ihm gehörte, in Josefs Hand.[a]
  rationale: Die Revision beseitigt die im Deutschen entstehende Pronomenmehrdeutigkeit, indem sie den im Kontext eindeutig bestimmten Herrn und Josef als Empfänger der übertragenen Verantwortung nennt. Das hebräische Bild der „Hand“ bleibt im Haupttext erhalten; die Fußnote erklärt seine idiomatische Bedeutung.
