  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: de
  text: Josef fand Gunst in seinen Augen und diente ihm. Darauf setzte sein Herr ihn über sein Haus und gab alles, was ihm gehörte, in Josefs Hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab er in seine Hand“; das bedeutet, dass er Josef alles zu Aufsicht und Verfügung anvertraute.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: fand Gunst in seinen Augen
  rationale: Bewahrt die geläufige hebräische Wendung und ihre Bildsprache; „Gunst“ passt zum erzählerischen, nicht ausdrücklich theologischen Zusammenhang.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: diente ihm
  rationale: Gibt Josefs persönlichen Dienst für seinen Herrn direkt und natürlich wieder.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: setzte er ihn über sein Haus
  rationale: Gibt die Einsetzung in eine Aufsichtsstellung formal nah wieder; „Haus“ kann hier das gesamte Hauswesen bezeichnen.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: alles, was ihm gehörte
  rationale: Bezeichnet umfassend den Besitz beziehungsweise das gesamte Eigentum des Herrn und ist im Deutschen klarer als eine streng wörtliche Existenzformel.
- source_word: נָתַן בְּיָדוֹ
  choice: gab er in seine Hand
  rationale: Bewahrt das hebräische Hand-Bild für übertragene Verfügungsgewalt und Obhut; die Fußnote erläutert das Idiom.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll formnaher Syntax. Die Pronomenfolge und das Hand-Idiom des Hebräischen bleiben erhalten; Satzteilung und „Da“ sorgen für natürliche Lesbarkeit, ohne den nicht ausdrücklich genannten Herrn im Haupttext ergänzend zu benennen.
