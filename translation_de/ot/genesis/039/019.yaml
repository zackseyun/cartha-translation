review_pass:
  verdict: revise
  source_fidelity: 'Der Satz gibt die Satzstruktur und den Sinn des Hebräischen im Wesentlichen zuverlässig wieder: Potifar hört die Worte seiner Frau und reagiert zornig. »Sklave« ist für עַבְדְּךָ im gegebenen Haushaltskontext vertretbar. Die Wiedergabe von כַּדְּבָרִים הָאֵלֶּה durch »So« ist möglich, sollte aber im deutschen Zitat syntaktisch klarer stehen. Die Fußnote erklärt die wörtlichere Alternative bislang mit »Nach solchen Worten«, was im Deutschen fälschlich einen Grund bzw. eine Grundlage des Handelns nahelegt.'
  naturalness: »So hat dein Sklave an mir gehandelt« ist verständlich, aber mit vorangestelltem »So« im Zitat weniger idiomatisch. »Dein Sklave hat so an mir gehandelt« ist natürlicher und bewahrt die offene, nicht weiter spezifizierte Formulierung.
  terminology: »Herr«, »Frau«, »Sklave« und »Zorn« sind registergerecht und terminologisch stimmig. »Entbrannte sein Zorn« ist gehobenes, aber gut verständliches modernes Standarddeutsch und gibt das Bild von וַיִּחַר אַפּוֹ angemessen wieder.
  issues:
  - severity: medium
    issue: Die Fußnote übersetzt כַּדְּבָרִים הָאֵלֶּה mit »Nach solchen Worten«.
    rationale: »Nach solchen Worten« bedeutet im Deutschen eher „aufgrund solcher Worte“ oder „im Anschluss an solche Worte“. Die hebräische Wendung bezeichnet hier vielmehr die Art bzw. den demonstrativ aufgegriffenen Inhalt der behaupteten Handlung („so/auf diese Weise“, gegebenenfalls „so etwas“).
  - severity: low
    issue: Die Stellung von »So« im direkten Zitat klingt leicht unnatürlich.
    rationale: Eine Umstellung zu »Dein Sklave hat so an mir gehandelt« verbessert die deutsche Satzführung, ohne die Offenheit von עָשָׂה לִי oder den demonstrativen Bezug zu verändern.
  revised_text: 'Als sein Herr die Worte seiner Frau hörte, die ihm sagte: »Dein Sklave hat so an mir gehandelt«, entbrannte sein Zorn.'
  revised_footnotes:
  - marker: a
    text: 'Oder: »Dein Sklave hat mir so etwas angetan.« Die hebräische Wendung kann die Art der behaupteten Tat bezeichnen oder demonstrativ auf den Inhalt der zuvor berichteten Anschuldigung verweisen.'
