base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: de
  text: 'Als sein Herr die Worte seiner Frau hörte, die ihm sagte: »Dein Sklave hat so an mir gehandelt«, entbrannte sein Zorn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Als … hörte
  rationale: Die hebräische Erzählungsform leitet das nächste Geschehen ein; im Deutschen gibt der temporale Nebensatz die Abfolge natürlich wieder, ohne ein schwerfälliges »Und es geschah«.
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: Bezeichnet Potifar als Josefs Hausherrn und Besitzer; »Herr« ist im Deutschen kontextgemäß und bewahrt das Herrschaftsverhältnis.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: die Worte seiner Frau … die zu ihm sagte
  rationale: »Worte« bildet דְּבָרִים ab; im Relativsatz ist »sagte« natürliches modernes Deutsch und vermeidet die unbeholfene Wiederholung »Worte … sprach«.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: So
  rationale: Das adverbiale »So« gibt den demonstrativen Bezug auf die geschilderte Art des angeblichen Handelns knapp und idiomatisch wieder; die mögliche wörtlichere Lesart wird in der Fußnote genannt.
- source_word: עָשָׂה לִי
  choice: hat … an mir gehandelt
  rationale: Bewahrt den allgemeinen Charakter von עשה und gibt לִי ohne die interpretative Verschärfung »gegen mich« wieder.
- source_word: עַבְדֶּךָ
  choice: dein Sklave
  rationale: עבד kann »Diener« oder »Sklave« bedeuten; Josefs rechtlicher und sozialer Status in Potifars Haus spricht hier für »Sklave«.
- source_word: וַיִּחַר אַפּוֹ
  choice: entbrannte sein Zorn
  rationale: Bewahrt das hebräische Bild vom aufflammenden Zorn in würdigem, verständlichem Deutsch.
