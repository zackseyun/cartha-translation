source:
  edition: WLC
  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: de
  text: 'Doch er weigerte sich und sagte zur Frau seines Herrn: „Sieh, mein Herr kümmert sich nicht um das, was im Haus ist,[a] und alles, was ihm gehört, hat er in meine Hand gegeben.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „weiß nicht mit mir, was im Haus ist“. Gemeint ist, dass er Joseph die Angelegenheiten des Hauses überlässt und sich nicht selbst darum kümmert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat er mir anvertraut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Doch er weigerte sich
  rationale: Das Verb bezeichnet eine entschiedene Weigerung. „Doch“ gibt im Zusammenhang den Gegensatz zu dem zuvor ausgesprochenen Ansinnen wieder.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: und sagte zur Frau seines Herrn
  rationale: Die deutsche Konstruktion gibt die hebräische Genitivverbindung natürlich wieder. „Herr“ bezeichnet hier Potifar als Josephs Dienstherrn.
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Begründung hervor; „Sieh“ ist gegenwärtig, würdig und näher am Bild des Hebräischen als eine rein bestätigende Wiedergabe.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: mein Herr kümmert sich nicht um das, was im Haus ist
  rationale: Wörtlich steht eine schwierige Wendung, etwa „weiß nicht mit mir, was im Haus ist“. Im Zusammenhang besagt sie, dass der Herr die Angelegenheiten des Hauses Joseph überlässt. Die Fußnote bewahrt die sprachliche Besonderheit und mögliche engere Wiedergabe.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: alles, was ihm gehört
  rationale: Die Formulierung bezeichnet umfassend den Besitz des Herrn und klingt im Deutschen natürlich.
- source_word: נָתַן בְּיָדִי
  choice: hat er in meine Hand gegeben
  rationale: Die konkrete hebräische Metapher bleibt erhalten und bezeichnet zugleich die Übertragung von Verantwortung und Verfügungsgewalt.
