  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: de
  text: Der Leiter des Gefängnisses vertraute Josef alle Gefangenen an, die im Gefängnis waren. Und alles, was man dort tat, führte Josef selbst aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und alles, was dort getan wurde, tat Josef selbst.“ Das Hebräische betont Josef als denjenigen, der dies tat; die Verbform kann fortdauerndes beziehungsweise regelmäßiges Handeln ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: der Gefängnisleiter
  rationale: שַׂר bezeichnet hier den verantwortlichen Aufseher. „Gefängnisleiter“ ist im modernen Deutschen natürlich und gibt seine Amtsstellung klar wieder.
- source_word: בְּיַד יוֹסֵף
  choice: vertraute Josef … an
  rationale: Die Wendung „in Josefs Hand geben“ ist ein Idiom für das Übertragen von Verantwortung und Verfügungsgewalt. Die idiomatische deutsche Wiedergabe vermeidet eine missverständliche wörtliche Form.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Die im modernen deutschen Bibel- und Allgemeingebrauch etablierte Namensform ist verständlich und würdig.
- source_word: כָּל הָאֲסִירִם
  choice: alle Gefangenen
  rationale: אֲסִירִים bezeichnet hier die im Gefängnis festgehaltenen Menschen; „Gefangene“ ist präzise und natürlich.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: und alles, was man dort tat
  rationale: Das pluralische Partizip עֹשִׂים hat ein unbestimmtes Subjekt. Das deutsche „man“ bewahrt diese Unbestimmtheit, ohne einen konkreten Täter einzuführen.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: führte er aus
  rationale: Das betonte הוּא und die Verlaufsform mit הָיָה plus Partizip stellen Josefs fortdauernde aktive Verantwortung heraus. „führte er aus“ knüpft natürlich an „alles“ an.
theological_decisions:
- issue: Art und Umfang von Josefs Tätigkeit
  choice: aktive Ausführung aller dort anfallenden Aufgaben
  alternative: bloße Aufsicht oder Verantwortung für die Abläufe
  rationale: Der hebräische Wortlaut verwendet erneut עשה („tun, ausführen“) und betont mit הוּא Josef selbst. Die Übersetzung wahrt diese aktive Aussage, ohne auszuschließen, dass sie leitende Verantwortung einschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satzteil gibt das hebräische Hand-Idiom sinngemäß wieder; der zweite bewahrt das unbestimmte Subjekt und die emphatische, fortdauernde Rolle Josefs.
