source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: de
  text: Da nahm Josefs Herr ihn und brachte ihn ins Gefängnis[a], an den Ort, an dem die Gefangenen des Königs gefangen gehalten wurden[b]. Und er war dort im Gefängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in das Haus des Sohar«. »Sohar« ist wahrscheinlich ein ägyptischer Ausdruck für ein Gefängnis oder eine Haftanstalt.'
    reason: cultural_note
  - marker: b
    text: 'Im Hebräischen steht zweimal derselbe Wortstamm für »binden/gefangen halten«; wörtlicher: »an dem die Gefangenen des Königs gefangen waren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: Josefs Herr
  rationale: אדון bezeichnet hier Josefs menschlichen Herrn beziehungsweise Besitzer, nicht Gott. »Herr« bewahrt den sozialen und rechtlichen Rahmen der Erzählung und ist im Deutschen natürlich.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet gewöhnlich »nehmen«. Eine stärkere Wiedergabe wie »packte« oder »ergriff« würde eine im Verb nicht ausdrücklich enthaltene Gewaltkomponente hinzufügen.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: brachte ihn ins
  rationale: נתן mit אֶל beschreibt hier das Verbringen an einen Ort. »Brachte ihn ins« ist idiomatisches Deutsch und gibt die gerichtete Bewegung in die Haft wieder.
- source_word: בֵּית הַסֹּהַר
  choice: Gefängnis
  rationale: Der Ausdruck bezeichnet im Kontext eindeutig eine Haftanstalt. »Gefängnis« ist die klare, moderne deutsche Entsprechung; die ungewöhnliche wörtliche Form wird in einer Fußnote erläutert.
- source_word: מְקוֹם אֲשֶׁר
  choice: an den Ort, wo
  rationale: Die ausdrückliche Apposition des Hebräischen bleibt erhalten und erklärt das Gefängnis als den Haftort der königlichen Gefangenen.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: die Gefangenen des Königs gefangen gehalten wurden
  rationale: Die Wiedergabe erhält die auffällige Wiederholung des hebräischen Stammes אסר durch »Gefangenen« und »gefangen gehalten«, ohne unverständliches Deutsch zu erzeugen.
- source_word: וַיְהִי שָׁם
  choice: Dort war er nun
  rationale: היה mit שׁם bezeichnet Josefs daraus folgenden Aufenthalt. »Nun« markiert natürlich den erzählerischen Ergebniszustand, ohne eine lange Haftdauer ausdrücklich zu behaupten.
- source_word: בְּבֵית הַסֹּהַר
  choice: im Gefängnis
  rationale: Die erneute Ortsangabe wird wie im Hebräischen beibehalten, statt die stilistische Wiederholung zu tilgen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Name wird in der im Deutschen üblichen Form »Josef« wiedergegeben. Die Wiederholungen des Ausgangstextes bleiben weitgehend erkennbar, während die Satzführung natürlich deutsch ist.
