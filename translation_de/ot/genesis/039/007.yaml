  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: de
  text: 'Nach diesen Ereignissen richtete die Frau seines Herrn ihren Blick auf Josef[a] und sagte: »Schlaf mit mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hob ihre Augen zu Josef auf“; die hebräische Wendung bezeichnet hier eine gezielte, begehrliche Aufmerksamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die Wendung leitet eine spätere Entwicklung der Erzählung ein. „Nach diesen Ereignissen“ gibt den zeitlichen Zusammenhang natürlich wieder, ohne dem formelhaften hebräischen Ausdruck zusätzliches Gewicht aufzuerlegen.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: richtete ... ihren Blick auf
  rationale: Wörtlich heißt die Wendung „hob ihre Augen zu … auf“. Im Zusammenhang bezeichnet sie eine gezielte, begehrliche Aufmerksamkeit. „Richtete ihren Blick auf“ bewahrt die Bildhaftigkeit, ohne das Begehren ausdrücklich in den Text einzutragen.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: die Frau seines Herrn
  rationale: Die Statusbezeichnung אָדוֹן wird hier mit „Herr“ wiedergegeben. Das Pronomen bezieht sich auf Josef; die deutsche Formulierung ist klar und eng am hebräischen Konstruktus.
- source_word: יוֹסֵף
  choice: Josef
  rationale: „Josef“ ist die im modernen Standarddeutschen etablierte Form des hebräischen Namens יוֹסֵף.
- source_word: שִׁכְבָה עִמִּי
  choice: Schlaf mit mir!
  rationale: Der Imperativ mit עִם ist hier eine unverhüllte sexuelle Aufforderung. „Schlaf mit mir“ vermittelt diese Bedeutung im heutigen Deutsch direkt und natürlich; „Leg dich zu mir“ wäre formnäher, könnte aber als bloße Aufforderung zum Hinlegen missverstanden werden.
