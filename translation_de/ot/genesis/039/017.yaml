translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt anklagend; „Sklave“ benennt den sozialen Status klar. Die Mehrdeutigkeit von לְצַחֶק בִּי wird im Haupttext nicht vorschnell aufgelöst und in der Fußnote erläutert.
