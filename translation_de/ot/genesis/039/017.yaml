  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: de
  text: 'Dann sagte sie zu ihm etwa Folgendes: „Der hebräische Sklave, den du zu uns gebracht hast, kam zu mir, um sich über mich lustig zu machen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um seinen Spott mit mir zu treiben“; im Zusammenhang kann die Wendung auch einen sexuellen oder übergriffigen Beiklang haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Dann berichtete sie ihm
  rationale: Das Wayyiqtol führt die Erzählung fort. „Berichtete“ passt zum Kontext ihrer Mitteilung an ihren Mann; das hebräische Pronomen „ihm“ bleibt erhalten.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: mit folgenden Worten
  rationale: Die idiomatische Wendung leitet den Inhalt ihrer Aussage ein und bewahrt den Bezug auf ihre Worte in natürlichem Deutsch.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Redeintroduktor wird im Deutschen idiomatisch durch die Konstruktion mit Doppelpunkt wiedergegeben.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: der hebräische Sklave
  rationale: „Sklave“ gibt Josefs rechtlich und sozial unfreien Status deutlicher wieder als das mildere „Diener“; „hebräische“ bewahrt die ethnische Kennzeichnung.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: den du zu uns gebracht hast
  rationale: Die anklagende Formulierung gegenüber ihrem Mann sowie der Plural „uns“ werden beibehalten.
- source_word: בָּא אֵלַי
  choice: kam zu mir
  rationale: Die Wendung bezeichnet zunächst eine Bewegung auf sie zu. Eine mögliche sexuelle Bedeutung wird nicht bereits in die Bewegungsangabe hineingelesen.
- source_word: לְצַחֶק בִּי
  choice: um sich über mich lustig zu machen
  rationale: Die Formulierung bewahrt den spöttischen beziehungsweise herabsetzenden Grundsinn, ohne die im Kontext mögliche sexuelle oder missbräuchliche Nuance im Haupttext eindeutig festzulegen.
