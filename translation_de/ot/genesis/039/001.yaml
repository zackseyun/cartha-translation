source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: de
  text: Josef war nach Ägypten hinabgebracht worden. Potifar, ein Hofbeamter[a] des Pharaos und Oberster der Leibwache, ein Ägypter, kaufte ihn von den Ismaelitern, die ihn dorthin hinabgebracht hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl „Hofbeamter“ als auch „Eunuch“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: war hinabgebracht worden
  rationale: Der Hofal von ירד bezeichnet ein passiv verursachtes Hinabgehen. Das Plusquamperfekt ordnet dies zeitlich vor Potifars Kauf ein und bewahrt zugleich das im Vers wiederholte Motiv des Hinabbringens.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet die Bewegung auf Ägypten zu; „nach Ägypten“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיִּקְנֵהוּ
  choice: kaufte ihn
  rationale: קנה bezeichnet im Zusammenhang des Sklavenhandels eindeutig einen Kauf und wird ohne abschwächenden Euphemismus wiedergegeben.
- source_word: סְרִיס פַּרְעֹה
  choice: ein Hofbeamter des Pharaos
  rationale: סְרִיס kann sowohl einen Eunuchen als auch einen königlichen Hofbeamten bezeichnen. Im Haupttext steht die im amtlichen Kontext passende weitere Bedeutung; die konkrete Alternative wird in der Fußnote bewahrt.
- source_word: שַׂר הַטַּבָּחִים
  choice: Oberster der Leibwache
  rationale: Die Amtsbezeichnung kann den Befehlshaber der königlichen Wächter beziehungsweise Scharfrichter meinen. „Oberster der Leibwache“ ist verständlich und vermeidet eine unnötige Festlegung auf die umstrittene engere Bedeutung.
- source_word: אִישׁ מִצְרִי
  choice: ein Ägypter
  rationale: Die deutsche Personenbezeichnung gibt Geschlecht und Herkunft natürlich wieder; „ein ägyptischer Mann“ wäre in dieser Reihe von Bezeichnungen unnötig schwerfällig.
- source_word: מִיַּד
  choice: von
  rationale: Das wörtliche „aus der Hand von“ ist hier eine hebräische Wendung für den Erwerb von jemandem; „von“ ist im Deutschen sachgerecht und idiomatisch.
- source_word: הַיִּשְׁמְעֵאלִים
  choice: die Ismaeliter
  rationale: Die Volksbezeichnung wird direkt wiedergegeben. Eine Ergänzung wie „Händler“ wäre zwar kontextuell naheliegend, steht aber nicht ausdrücklich im Text.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: die ihn dorthin hinabgebracht hatten
  rationale: Der Relativsatz bezieht sich auf die Ismaeliter, bewahrt שָׁמָּה als „dorthin“ und wiederholt bewusst den Stamm ירד.
theological_decisions:
- issue: Bedeutung von סְרִיס in Potifars Amtsbezeichnung
  choice: Im Haupttext „Hofbeamter des Pharaos“
  alternative: „Eunuch des Pharaos“
  rationale: Das hebräische Wort kann einen tatsächlichen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. Da der Kontext die körperliche Bedeutung nicht erzwingt, steht die amtliche Bedeutung im Haupttext; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Hauptsätze vermeiden eine überladene Satzstruktur. „Hinabgebracht“ erhält die geographisch und erzählerisch markierte Wiederholung des hebräischen Verbs; „Leibwache“ gibt die traditionelle Amtsdeutung verständlich wieder, ohne die mögliche Zuständigkeit für Hinrichtungen im Haupttext festzuschreiben.
