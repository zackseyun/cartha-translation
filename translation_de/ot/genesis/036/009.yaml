  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: de
  text: Und dies ist die Geschlechterfolge Esaus, des Vaters Edoms, im Bergland Seïr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf dem Berg Seïr; auch möglich: im Gebirge Seïr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies ist
  rationale: Das וְ wahrt die erzählerische Verknüpfung; die im Deutschen idiomatische Singularform „dies ist“ leitet die folgende Geschlechterfolge ein.
- source_word: תֹּלְדוֹת
  choice: Geschlechterfolge
  rationale: Der Ausdruck bewahrt den wiederkehrenden Gliederungsbegriff der Genesis und umfasst hier Abstammungslinie und Nachkommenschaft, ohne ihn bloß als Bericht zu deuten.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אֲבִי אֱדֹום
  choice: des Stammvaters von Edom
  rationale: „Stammvater“ gibt die progenitorische Bedeutung von אָב in Bezug auf das Volk beziehungsweise Land Edom im heutigen Deutsch klarer wieder als das möglicherweise unmittelbar-biologische „Vater“.
- source_word: בְּהַר שֵׂעִיר
  choice: im Bergland Seïr
  rationale: הַר kann in einer geografischen Bezeichnung ein Gebirge oder Bergland meinen; „im Bergland“ gibt die regionale Ortsangabe natürlich wieder. Die Schreibung „Seïr“ macht die getrennte Aussprache der Vokale sichtbar.
theological_decisions:
- issue: Esau als אֲבִי אֱדֹום
  choice: Stammvater von Edom
  alternative: Vater Edoms
  rationale: Die Formulierung bezeichnet Esau als Ursprung der Edomiter; sie legt nicht unnötig fest, ob אֱדֹום hier primär das Volk, das Land oder die namensgleiche Gestalt bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Gliederung der Genesis bleibt mit „Geschlechterfolge“ erkennbar; die geografische Mehrdeutigkeit von הַר wird in der Fußnote bewahrt.
