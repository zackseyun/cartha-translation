revisions:
- from: Und dies ist die Geschlechterfolge Esaus, des Stammvaters von Edom, im Bergland Seïr.[a]
  to: Und dies ist die Geschlechterfolge Esaus, des Vaters Edoms, im Bergland Seïr.[a]
  rationale: Die Revision stellt bei אֲבִי אֱדוֹם die direkte, bewusst offene Entsprechung „Vater Edoms“ her und korrigiert die idiomatische Form der geografischen Fußnotenalternative. Die formelhafte Singularverbindung „dies ist die Geschlechterfolge“ bleibt als im Deutschen übliche Einführung eines einzelnen Gliederungsabschnitts erhalten.
