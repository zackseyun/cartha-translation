  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: de
  text: 'Dies sind die Namen der Söhne Esaus: Elifas, der Sohn Adas, der Frau Esaus; Reguël, der Sohn Basemats, der Frau Esaus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht »der Frau Esaus« nach jedem der beiden Namen der Mütter; die Wiederholung wurde entsprechend dem genealogischen Stil beibehalten.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Dies sind die Namen
  rationale: Die präsentierende hebräische Wendung wird in natürlichem, würdigem Deutsch mit einer Kopula wiedergegeben.
- source_word: בְּנֵי עֵשָׂו
  choice: der Söhne Esaus
  rationale: בְּנֵי bezeichnet hier ausdrücklich männliche Nachkommen; die deutsche Genitivkonstruktion passt zur genealogischen Überschrift.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Die Namensform folgt der im Deutschen üblichen, am Hebräischen orientierten Wiedergabe.
- source_word: בֶּן עָדָה
  choice: der Sohn Adas
  rationale: בֶּן bezeichnet das direkte Sohnverhältnis. Der bestimmte Artikel macht die Apposition im Deutschen klar und natürlich.
- source_word: אֵשֶׁת עֵשָׂו
  choice: der Frau Esaus
  rationale: Die Genitivfügung gibt den hebräischen Status constructus genau wieder. Die im Hebräischen zweimal stehende Wendung bleibt an beiden Stellen erhalten.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Die Trema-Schreibung macht kenntlich, dass u und e getrennt gesprochen werden, und entspricht einer geläufigen deutschen Namensform.
- source_word: בֶּן בָּשְׂמַת
  choice: der Sohn Basemats
  rationale: Die Konstruktion wird parallel zur ersten Sohnesangabe wiedergegeben.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Transliteration des hebräischen Personennamens in einer im Deutschen geläufigen Form.
