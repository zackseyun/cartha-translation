  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: de
  text: Und dies sind die Könige, die im Land Edom regierten, bevor ein König über die Söhne Israels regierte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bevor ein König für die Israeliten regierte“. Wörtlich steht im Hebräischen: „bevor ein König für/über die Söhne Israels regierte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende וְ wird als „Und“ bewahrt; „dies sind“ eröffnet natürlich die folgende Liste.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: die Könige, die … regierten
  rationale: Der bestimmte Artikel und der Relativsatz werden unmittelbar wiedergegeben; מלך im Qal bezeichnet hier die Ausübung der Königsherrschaft.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Bewahrt sowohl den ausdrücklichen territorialen Begriff „Land“ als auch den Eigennamen Edom in natürlichem Deutsch.
- source_word: לִפְנֵי
  choice: bevor
  rationale: Die Präposition hat hier eindeutig zeitliche Bedeutung; vor einem deutschen Nebensatz ist „bevor“ idiomatisch.
- source_word: מְלָךְ מֶלֶךְ
  choice: ein König … regierte
  rationale: Die Verbindung aus Verb und singularischem Subjekt wird direkt wiedergegeben, ohne das interpretierende „irgendein“ einzuführen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: über die Söhne Israels
  rationale: „Söhne Israels“ wahrt die Form des hebräischen Ethnonyms; „über“ gibt die im Zusammenhang mit dem Regieren naheliegende Herrschaftsbeziehung wieder.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die wörtliche Ausdrucksform bleibt erhalten, obwohl die Wendung als Volksbezeichnung alle Israeliten meint.
- issue: Bedeutung der Präposition לְ bei לִבְנֵי יִשְׂרָאֵל
  choice: über
  alternative: für
  rationale: Beim Verb „regieren“ ist „über“ im Deutschen sachlich und idiomatisch; da לְ formal auch „für“ zulässt, wird diese echte lexikalische Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Listenformel und das hebräische Ethnonym werden bewusst relativ formnah wiedergegeben; die Fußnote bewahrt die Mehrdeutigkeit der Präposition.
