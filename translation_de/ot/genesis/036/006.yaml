source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: de
  text: Esau nahm seine Frauen, seine Söhne und seine Töchter sowie alle Personen seines Haushalts mit, dazu sein Vieh, alle seine Tiere und seinen gesamten Besitz, den er im Land Kanaan erworben hatte. Wegen seines Bruders Jakob zog er in ein Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet: „in ein Land“. Einige Handschriften und alte Übersetzungen stützen die Lesart „in das Land Seïr“; häufig wird dem Zusammenhang entsprechend auch „in ein anderes Land“ übersetzt.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: לקח bedeutet wörtlich „nehmen“; im Zusammenhang des Wegzugs gibt „nahm … mit“ den deutschen Sinn natürlich und genau wieder.
- source_word: נָשָׁיו
  choice: seine Frauen
  rationale: Der Plural von אִשָּׁה bezeichnet hier Esaus Ehefrauen; „seine Frauen“ ist im modernen Deutschen die natürliche biblische Bezeichnung.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: seine Söhne und seine Töchter
  rationale: Der hebräische Text nennt Söhne und Töchter ausdrücklich getrennt; diese Unterscheidung bleibt erhalten.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: alle Angehörigen seines Hauses
  rationale: נֶפֶשׁ bezeichnet in dieser Wendung Personen. „Angehörige seines Hauses“ gibt den antiken Haushalt verständlich wieder, ohne „Seelen“ theologisch zu überfrachten.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: מִקְנֶה bezeichnet den Viehbestand beziehungsweise tierischen Besitz; „Vieh“ ist knapp und idiomatisch.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: alle seine Tiere
  rationale: בְּהֵמָה ist ein weiter Ausdruck für Tiere. Die Wiedergabe wahrt gegenüber „Vieh“ die formale Wiederholung und den breiteren Ausdruck.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: seinen gesamten Besitz, den er … erworben hatte
  rationale: קִנְיָן bezeichnet Besitz beziehungsweise Erworbenes, und רכשׁ betont den Erwerb. Das Plusquamperfekt entspricht der vorausliegenden Handlung.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die ausdrückliche geografische Formulierung „Land Kanaan“ wird bewahrt.
- source_word: אֶל אֶרֶץ
  choice: in ein Land
  rationale: Der masoretische Text nennt unbestimmt „ein Land“. Die Übersetzung fügt weder „anderes“ noch „Seïr“ in den Haupttext ein.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: wegen seines Bruders Jakob
  rationale: מִפְּנֵי kann räumlich „weg von/vor“ oder kausal „wegen“ bedeuten. Vers 7 erklärt den durch den gemeinsamen Besitz verursachten Trennungsgrund, weshalb die kausale Wiedergabe im Haupttext gut passt.
theological_decisions:
- issue: Räumliche oder kausale Bedeutung von מִפְּנֵי
  choice: wegen seines Bruders Jakob
  alternative: weg von seinem Bruder Jakob
  rationale: Die Präposition lässt beide Nuancen zu. Der unmittelbare Kontext in Vers 7 hebt den Grund der Trennung hervor; daher wird die kausale Lesart gewählt, ohne daraus eine theologische Wertung Jakobs zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufzählung des hebräischen Textes bleibt erhalten, wird aber durch „sowie“ und „dazu“ natürlich gegliedert. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung „in ein Land“.
