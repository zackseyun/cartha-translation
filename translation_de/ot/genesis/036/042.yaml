lexical_decisions:
- source_word: אַלּוּף
  choice: Oberhaupt
  rationale: Im Zusammenhang von Genesis 36 bezeichnet das Wort den führenden Vertreter einer edomitischen Sippe oder Stammesgruppe. „Oberhaupt“ ist knapp, gegenwärtig und bewahrt die formelhafte Wiederholung des Hebräischen, ohne den Rang genauer festzulegen, als es der Ausgangstext tut.
- source_word: קְנַז
  choice: Kenaz
  rationale: Eigenname; nach der im Deutschen üblichen biblischen Form transliteriert.
- source_word: תֵּימָן
  choice: Teman
  rationale: Hier ein Eigenname in der Liste edomitischer Oberhäupter; daher transliteriert und nicht nach einer möglichen Wortbedeutung wie „Süden“ übersetzt.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Eigenname; die Transliteration mit „z“ gibt den entsprechenden hebräischen Konsonanten angemessen wieder.
theological_decisions: []
