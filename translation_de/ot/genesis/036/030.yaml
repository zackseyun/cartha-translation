source:
  edition: WLC
  text: אַלּ֥וּף דִּשֹׁ֛ן אַלּ֥וּף אֵ֖צֶר אַלּ֣וּף דִּישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י לְ/אַלֻּפֵי/הֶ֖ם בְּ/אֶ֥רֶץ שֵׂעִֽיר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: de
  text: Oberhaupt Dischon, Oberhaupt Ezer, Oberhaupt Dischan – das waren die Oberhäupter der Horiter, geordnet nach ihren Stammesverbänden[a] im Land Seïr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »nach ihren Oberhäuptern«. Die hebräische Formulierung kann die Einteilung nach Stammesführern oder nach den von ihnen geführten Verbänden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: Oberhaupt
  rationale: Das Wort bezeichnet hier einen führenden Mann eines Stammes oder Sippenverbandes. »Oberhaupt« ist im heutigen Deutsch verständlich, würdevoll und weniger historisch irreführend als »Fürst« oder »Herzog«; die Wiederholung der hebräischen Listenform bleibt erhalten.
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: Dischon / Ezer / Dischan
  rationale: Die Eigennamen werden nach im Deutschen üblichen biblischen Umschriftkonventionen wiedergegeben; Dischon und Dischan bleiben entsprechend dem Hebräischen klar unterschieden.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: die Oberhäupter der Horiter
  rationale: הַחֹרִי bezeichnet hier die Horiter als Volksgruppe; der deutsche Plural ist natürlich und kontextgerecht.
- source_word: לְאַלֻּפֵיהֶם
  choice: geordnet nach ihren Stammesverbänden
  rationale: Die לְ-Verbindung ist in dieser Zusammenfassung am ehesten klassifizierend zu verstehen. אַלּוּף kann neben dem Oberhaupt auch den ihm zugeordneten Verband bezeichnen. Die Fußnote hält die formnähere Alternative offen.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: im Land Seïr
  rationale: Die feste geografische Wendung wird knapp und formnah wiedergegeben; die Schreibung Seïr macht die getrennte Aussprache der Vokale kenntlich.
