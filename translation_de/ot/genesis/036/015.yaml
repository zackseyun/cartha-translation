  text: אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: de
  text: 'Dies sind die Stammesoberhäupter der Söhne Esaus: die Söhne Elifas’, des Erstgeborenen Esaus: das Stammesoberhaupt Teman, das Stammesoberhaupt Omar, das Stammesoberhaupt Zefo und das Stammesoberhaupt Kenas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: Stammesoberhäupter / Stammesoberhaupt
  rationale: Der Titel bezeichnet in den edomitischen Listen einen führenden Repräsentanten eines Stammes oder einer Sippe. „Stammesoberhaupt“ ist im heutigen Deutsch verständlich, bewahrt die personenbezogene Titelfunktion und vermeidet das historisch anders besetzte „Fürst“.
- source_word: בְנֵי
  choice: Söhne
  rationale: Die wörtliche genealogische Bezeichnung bleibt erhalten; je nach Zusammenhang kann sie auch Nachkommen einschließen.
- source_word: בְּכוֹר
  choice: Erstgeborener
  rationale: Die Wiedergabe bewahrt sowohl die Geburtsreihenfolge als auch mögliche Rangvorstellungen, ohne diese auszudeuten.
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die verblos eingeleitete Aufzählungsformel wird idiomatisch und zugleich eng am Hebräischen wiedergegeben.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Im Deutschen etablierte Namensform.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Im Deutschen etablierte biblische Namensform.
- source_word: תֵּימָן
  choice: Teman
  rationale: Gebräuchliche deutsche Umschrift des Personen- beziehungsweise Sippennamens.
- source_word: אוֹמָר
  choice: Omar
  rationale: Direkte und im Deutschen geläufige Umschrift des Namens.
- source_word: צְפוֹ
  choice: Zefo
  rationale: Die Umschrift folgt der masoretischen Form צְפוֹ; Varianten in anderen Überlieferungen werden in der Fußnote genannt.
- source_word: קְנַז
  choice: Kenas
  rationale: Gebräuchliche deutsche Umschrift des Namens.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der doppelte Doppelpunkt bildet die hierarchische Gliederung des hebräischen Satzes ab: allgemeine Überschrift, dann die Untergruppe der Söhne Elifas’. Die wiederholte Titelbezeichnung wird trotz stilistischer Schwere beibehalten, weil sie die listenartige Struktur und die Funktion von אַלּוּף sichtbar macht.'
