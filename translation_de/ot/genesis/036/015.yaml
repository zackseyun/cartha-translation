review_pass:
  verdict: revise
  source_fidelity: 'Der hebräische Satz bezeichnet die genannten Personen als אַלּוּפִים, also als Oberhäupter bzw. Führer der edomitischen Abstammungsgruppen. „Stammesoberhäupter“ gibt die personenbezogene Titelfunktion im Wesentlichen angemessen wieder; die genealogische Zuordnung zu Elifas, dem Erstgeborenen Esaus, bleibt erhalten. Die Fußnote behauptet jedoch fälschlich eine abweichende Textüberlieferung zu Genesis 36,15: „Zefi“ ist die Namensform in der parallelen Genealogie von 1 Chronik 1,36, nicht eine hier zu verzeichnende Textvariante des hebräischen Textes dieses Verses.'
  naturalness: Der listenartige, zweifache Doppelpunkt ist im Deutschen zwar schwerfällig, aber als enge Abbildung der gestuften genealogischen Aufzählung verständlich und vertretbar. Die Wiederholung von „das Stammesoberhaupt“ bewahrt die Reihung des hebräischen Titels.
  terminology: Die etablierten deutschen Namensformen Esau, Elifas, Teman, Omar, Zefo und Kenas sind passend. „Erstgeborenen“ trifft בְּכוֹר präzise. „Stammesoberhaupt“ ist eine mögliche moderne Wiedergabe von אַלּוּף, ohne die veraltete oder feudal missverständliche Bezeichnung „Fürst“ zu erzwingen.
  issues:
  - severity: medium
    issue: Die Fußnote zu „Zefi“ ist als textkritische Anmerkung zu Genesis 36,15 unzutreffend.
    rationale: Die Form „Zefi“ steht in 1 Chronik 1,36, einer parallelen biblischen Genealogie, nicht als belegte abweichende Lesart der hier zugrunde gelegten hebräischen Überlieferung von Genesis 36,15. Sie sollte daher nicht als „alte Textzeugen“ dieses Verses ausgegeben werden.
