  naturalness: Der listenartige Stil mit der Wiederholung von „Oberhaupt“ ist im modernen würdigen Deutsch gut verständlich. „Nach ihren Wohnsitzen im Land ihres Besitzes“ ist präziser als „geordnet nach ihren Wohnorten in dem Land, das ihr Besitz war“ und bleibt in diesem genealogisch-administrativen Kontext idiomatisch.
  terminology: „Oberhaupt/Oberhäupter“, „Magdiël“, „Iram“ und „Vater Edoms“ sind angemessen. Die Erläuterung zu „Vater Edoms“ erklärt korrekt die genealogisch-ethnische Bedeutung, ohne sie im Haupttext zu ersetzen.
