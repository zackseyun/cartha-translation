  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: de
  text: Oberhaupt Magdiël[a], Oberhaupt Iram. Das sind die Oberhäupter Edoms nach ihren Wohnsitzen im Land ihres Besitzes.[b] Das ist Esau,[c] der Vater Edoms.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sippenoberhaupt“. Das hebräische Wort bezeichnet einen Stammes- oder Sippenführer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach ihren Wohnorten in dem Land, das sie besaßen“.'
    reason: translation_alternative
  - marker: c
    text: 'Oder: „Er ist Esau“.'
    reason: translation_alternative
  - marker: d
    text: 'Gemeint ist: Esau ist der Stammvater der Edomiter.'
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף / אַלּוּפֵי
  choice: Oberhaupt / Oberhäupter
  rationale: Der Ausdruck bezeichnet hier die führenden Männer edomitischer Stämme oder Sippen. „Oberhaupt“ ist im Deutschen würdig und verständlich und vermeidet das historisch irreführende „Fürst“ oder das veraltete „Herzog“.
- source_word: מַגְדִּיאֵל
  choice: Magdiël
  rationale: Der Personenname wird nach geläufiger deutscher Bibelschreibung transliteriert; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: עִירָם
  choice: Iram
  rationale: Der Personenname wird in geläufiger deutscher Form wiedergegeben.
- source_word: לְמֹשְׁבֹתָם
  choice: geordnet nach ihren Wohnorten
  rationale: Die Präposition לְ bezeichnet hier wahrscheinlich die Gliederung der genannten Oberhäupter nach ihren jeweiligen Siedlungs- oder Wohngebieten. Die Ergänzung „geordnet“ macht diese Funktion im Deutschen verständlich.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: in dem Land, das ihr Besitz war
  rationale: Die Wiedergabe bewahrt die substantivische Bedeutung von אֲחֻזָּה als Besitz beziehungsweise Landbesitz, ohne die im Deutschen schwerfällige Formulierung „im Land ihres Besitzes“ zu verwenden.
- source_word: הוּא עֵשָׂו
  choice: Das ist Esau
  rationale: הוּא dient hier als zusammenfassende Identifikation. „Das“ verweist im Deutschen klarer auf den gesamten vorausgehenden Zusammenhang als „Er“, das fälschlich auf Iram bezogen werden könnte.
- source_word: אֲבִי אֱדֹם
  choice: der Vater Edoms
  rationale: Die wörtliche genealogische Wendung bleibt erhalten. „Vater“ bezeichnet hier den Stammvater beziehungsweise Vorfahren der Edomiter.
theological_decisions:
- issue: Esau als „Vater Edoms“
  choice: der Vater Edoms
  alternative: der Stammvater der Edomiter
  rationale: Die Übersetzung bewahrt das hebräische Bild und die Spannung zwischen Edom als Personen-/Volksbezeichnung; die Fußnote erläutert die genealogisch-ethnische Bedeutung, ohne sie in den Haupttext einzutragen.
- issue: Bezug des identifizierenden Pronomens הוּא
  choice: Das ist Esau
  alternative: Er ist Esau
  rationale: Die gewählte Fassung versteht den Satz als abschließende Identifikation des zuvor dargestellten edomitischen Zusammenhangs. Die formal nähere Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die listenartige Wiederholung von „Oberhaupt“ bleibt erhalten. Der zusammenfassende zweite Satz ist zur Verständlichkeit leicht expliziert, während Fußnoten die formaleren Alternativen dokumentieren.
