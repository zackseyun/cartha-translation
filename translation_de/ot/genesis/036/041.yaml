  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: de
  text: Oberhaupt Oholibama[a], Oberhaupt Ela, Oberhaupt Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sippenoberhaupt Oholibama«; ebenso bei den folgenden Namen.'
    reason: Das hebräische אַלּוּף bezeichnet hier wahrscheinlich das Oberhaupt eines edomitischen Stammes oder einer Sippe; die genauere soziale Stellung lässt sich im Deutschen nicht mit einem einzigen Wort vollständig abbilden.
lexical_decisions:
- source_word: אַלּוּף
  choice: Oberhaupt
  rationale: In Genesis 36 bezeichnet das Wort den führenden Vertreter eines edomitischen Stammes oder einer Sippe. »Oberhaupt« ist im Deutschen knapp, würdig und weniger missverständlich als »Fürst« oder das historisch unpassende »Herzog«.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Der Eigenname wird in einer im Deutschen geläufigen, dem Hebräischen nahen Form wiedergegeben.
- source_word: אֵלָה
  choice: Ela
  rationale: Der Ausdruck ist hier ein Eigenname und wird unmittelbar aus dem Hebräischen übertragen, ohne ihm eine Sachbedeutung beizulegen.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Der Eigenname wird entsprechend der hebräischen Konsonantenform als »Pinon« wiedergegeben.
