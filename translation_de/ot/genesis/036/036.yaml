  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: de
  text: Und Hadad starb, und an seiner Stelle wurde Samla aus Masreka König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מות führt die Ereignisfolge fort; „starb“ ist in dieser Königsfolge die natürliche deutsche Erzählform.
- source_word: הֲדָד
  choice: Hadad
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: מלך bezeichnet hier den Herrschaftsantritt in der königlichen Nachfolge; „wurde König“ ist im modernen Deutsch natürlich und gibt den Eintritt in das Königtum klar wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Pronominalsuffix bezeichnet hier die Nachfolge beziehungsweise Ablösung und wird mit „an seiner Stelle“ präzise wiedergegeben.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Der Personenname wird in einer im Deutschen natürlichen Transliteration wiedergegeben.
- source_word: מִמַּשְׂרֵקָה
  choice: aus Masreka
  rationale: Die Präposition מן kennzeichnet hier am natürlichsten Herkunft oder örtliche Zugehörigkeit; „aus Masreka“ bewahrt diese Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer königlichen Nachfolgenotiz bleibt erhalten. Anders als in der englischen Beratungsschicht gehört der mögliche Ortsbezug nicht zu וַיָּמָת, sondern eindeutig zu שַׂמְלָה מִמַּשְׂרֵקָה; daher ist dort keine Fußnote angebracht.
