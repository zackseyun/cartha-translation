  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: de
  text: 'Und dies sind die Namen der Stammesoberhäupter Esaus nach ihren Sippen, ihren Orten und Namen: das Stammesoberhaupt Timna[a], das Stammesoberhaupt Alwa[b], das Stammesoberhaupt Jetet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Timna wird auch „Timnah“ geschrieben.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Alwa; in 1. Chronik 1,51 steht die verwandte Namensform Alja.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: Und dies sind die Namen
  rationale: Bewahrt die verbindende Konjunktion und die natürliche Einleitung der folgenden Liste.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: Stammesoberhäupter / das Stammesoberhaupt
  rationale: אַלּוּף bezeichnet hier edomitische Stammes- oder Sippenführer. „Stammesoberhaupt“ ist im modernen Deutsch verständlich und vermeidet den historisch irreführenden traditionellen Titel „Fürst“ oder „Herzog“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem genealogisch-tribalen Zusammenhang eher eine Sippe als eine moderne Kleinfamilie.
- source_word: לִמְקֹמֹתָם
  choice: nach ihren Gebieten
  rationale: מָקוֹם bedeutet wörtlich „Ort“, verweist hier aber wahrscheinlich auf die jeweiligen örtlichen oder territorialen Zuordnungen; „Gebiete“ gibt diesen Kontext natürlich wieder, ohne „Siedlungen“ vorauszusetzen.
- source_word: בִּשְׁמֹתָם
  choice: mit ihren Namen
  rationale: Gibt die Aufzählung nach Namen eng am Hebräischen wieder und erhält die etwas formelhafte Ausdrucksweise.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Übliche deutsche Umschrift der hebräischen Namensform.
- source_word: עַלְוָה
  choice: Alwa
  rationale: Folgt der masoretischen Form עַלְוָה in einer natürlichen deutschen Umschrift.
- source_word: יְתֵת
  choice: Jetet
  rationale: Gibt die hebräische Form יְתֵת wieder, ohne sie an ähnlich lautende Namen anzugleichen.
theological_decisions: []
