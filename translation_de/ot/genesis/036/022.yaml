  text: וַ/יִּהְי֥וּ בְנֵי לוֹטָ֖ן חֹרִ֣י וְ/הֵימָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: de
  text: Die Söhne Lotans waren Hori und Hemam[a]; Lotans Schwester war Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Chronik 1,39 lautet der Name in der parallelen Liste Homam.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: Das Wayyiqtol von היה dient hier in der genealogischen Aufzählung als einfache Kopula; „waren“ ist im Deutschen natürlich und genau.
- source_word: בְנֵי
  choice: Söhne
  rationale: In diesem genealogischen Zusammenhang bezeichnet der Ausdruck männliche Nachkommen; darauf folgen zwei Männernamen.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: חֹרִי
  choice: Hori
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
- source_word: הֵימָם
  choice: Hemam
  rationale: Die vokalisierte hebräische Form dieses Verses wird unmittelbar wiedergegeben; die Parallelstelle in 1. Chronik 1,39 hat eine abweichende Namensform.
- source_word: וַאֲחוֹת לוֹטָן תִּמְנָע
  choice: Lotans Schwester war Timna
  rationale: Die knappe nominale genealogische Aussage wird im Deutschen durch die ergänzte Kopula „war“ natürlich wiedergegeben.
- source_word: תִּמְנָע
  choice: Timna
  rationale: „Timna“ gibt die hebräische Namensform in geläufiger deutscher Transliteration wieder.
