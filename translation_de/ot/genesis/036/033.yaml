  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: de
  text: Bela starb, und Jobab, der Sohn Serachs aus Bozra[a], wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Bozra«. Die hebräische Präposition kann sowohl die Herkunft als auch eine allgemeinere Zugehörigkeit zu der Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מוּת führt das nächste Ereignis der Erzählfolge ein; das ausdrücklich genannte Subjekt Bela wird im Deutschen natürlich vorangestellt.
- source_word: בָּלַע
  choice: Bela
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: מלך bezeichnet in dieser Thronfolgeformel die Übernahme des Königtums. Die deutsche Wendung gibt den Beginn der Herrschaft idiomatisch wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Pronominalsuffix bezeichnet hier die Nachfolge anstelle des vorherigen Herrschers.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Der Personenname wird in der üblichen deutschen Form wiedergegeben.
- source_word: בֶּן זֶרַח
  choice: der Sohn Serachs
  rationale: Die hebräische Status-constructus-Verbindung benennt Jobabs Vater; im Deutschen ist die Genitivform natürlich und eindeutig.
- source_word: מִבָּצְרָה
  choice: aus Bozra
  rationale: Die Präposition מִן bezeichnet gewöhnlich Herkunft, kann hier jedoch auch eine allgemeinere Zugehörigkeit zur Stadt ausdrücken.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Thronfolgeformel bleibt erhalten; »wurde … König« klingt im Deutschen natürlicher als ein isoliertes »herrschte« und gibt den Herrschaftsantritt im Kontext wieder.
