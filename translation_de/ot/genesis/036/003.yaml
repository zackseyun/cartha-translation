lexical_decisions:
- source_word: וְ/אֶת
  choice: und
  rationale: וְ verbindet Basemat als weiteren Eintrag mit der vorausgehenden Aufzählung; אֵת ist der hebräische Akkusativmarker und bleibt im Deutschen unübersetzt.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בַּת
  choice: die Tochter
  rationale: Die Constructusverbindung bezeichnet die Abstammung; die deutsche Apposition verlangt hier natürlich den bestimmten Artikel.
- source_word: יִשְׁמָעֵאל
  choice: Ismaels
  rationale: Der Eigenname erscheint in seiner etablierten deutschen Form und im Genitiv, um die hebräische Constructusverbindung natürlich wiederzugeben.
- source_word: אֲחוֹת
  choice: Schwester
  rationale: Das Constructusnomen bezeichnet das Geschwisterverhältnis; nach dem gemeinsamen Artikel innerhalb der koordinierten Apposition ist keine Wiederholung erforderlich.
- source_word: נְבָיוֹת
  choice: Nebajots
  rationale: Die etablierte deutsche biblische Namensform ist »Nebajot«; der Genitiv gibt die hebräische Constructusverbindung wieder.
