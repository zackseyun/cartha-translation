  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: de
  text: 'Und dies sind die Söhne Reguëls, des Sohnes Esaus: Fürst Nachat[a], Fürst Serach, Fürst Schamma und Fürst Mizza. Dies sind die Fürsten Reguëls im Land Edom. Dies sind die Söhne Basemats, der Frau Esaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sippenoberhaupt“. Das hebräische Wort bezeichnet einen edomitischen Stammes- oder Sippenführer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Bewahrt sowohl die erzählerische Verknüpfung durch וְ als auch die formelhafte Einleitung des genealogischen Abschnitts.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Die Aufzählung nennt männliche Nachkommen; die direkte Wiedergabe wahrt den genealogischen Wortlaut.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Reguëls, des Sohnes Esaus
  rationale: Die Apposition wird in natürlichem Deutsch eindeutig auf Reguël bezogen.
- source_word: אַלּוּף
  choice: Fürst
  rationale: Das Wort bezeichnet hier einen edomitischen Stammes- oder Sippenführer. „Fürst“ ist knapp, würdevoll und in genealogischer Aufzählung gut verständlich; die genauere soziale Bedeutung wird in einer Fußnote angegeben.
- source_word: נַחַת
  choice: Nachat
  rationale: Namensübertragung nach deutscher Lautkonvention, wobei ח durch „ch“ wiedergegeben wird.
- source_word: זֶרַח
  choice: Serach
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: שַׁמָּה
  choice: Schamma
  rationale: Lautnahe deutsche Umschrift des Personennamens.
- source_word: מִזָּה
  choice: Misa
  rationale: Natürliche deutsche Namensform; der Dagesch wird nicht durch eine für deutsche Leser künstliche Doppelung wiedergegeben.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Dies sind die Fürsten Reguëls
  rationale: Gibt die zusammenfassende Wiederaufnahme der vorherigen Liste eng und idiomatisch wieder.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Behält das ausdrücklich genannte אֶרֶץ („Land“) bei.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basemats, der Frau Esaus
  rationale: Die Apposition bezeichnet Basemat als Esaus Frau und wird im Deutschen eindeutig und flüssig formuliert.
