  text: וְ/אֵ֗לֶּה בְּנֵ֤י אָהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אָֽהֳלִיבָמָ֛ה בַּת עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: de
  text: 'Und dies sind die Söhne Oholibamas, der Frau Esaus: der Stammesführer Jeusch, der Stammesführer Jaëlam und der Stammesführer Korach. Dies sind die Stammesführer Oholibamas, der Tochter Anas, der Frau Esaus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Söhne
  rationale: Der maskuline Plural bezeichnet hier die drei namentlich genannten männlichen Nachkommen; „Nachkommen“ wäre an dieser Stelle unnötig weit.
- source_word: אֵשֶׁת עֵשָׂו
  choice: der Frau Esaus / Frau Esaus
  rationale: Die hebräische Status-constructus-Verbindung wird in natürlichem, zugleich gehobenem Deutsch mit dem Genitiv wiedergegeben; die leichte syntaktische Variation vermeidet Schwerfälligkeit.
- source_word: אַלּוּף
  choice: Stammesführer
  rationale: Das Wort bezeichnet in Genesis 36 einen führenden Repräsentanten einer edomitischen Gruppe beziehungsweise Sippe. „Stammesführer“ ist verständlicher und sachlich genauer als das veraltete „Fürst“ oder „Herzog“.
- source_word: יְעוּשׁ
  choice: Jeusch
  rationale: Quellnahe deutsche Umschrift des Personennamens.
- source_word: יַעְלָם
  choice: Jaëlam
  rationale: Die Trema-Schreibung macht deutlich, dass a und e getrennt zu sprechen sind, und bildet den hebräischen Namen angemessen ab.
- source_word: קֹרַח
  choice: Korach
  rationale: Im Deutschen übliche, quellnahe Umschrift des hebräischen Namens.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Dies sind die Stammesführer Oholibamas
  rationale: Die verblos formulierte hebräische Zusammenfassung wird im Präsens wiedergegeben. Der Genitiv wahrt die nicht näher bestimmte Zuordnung und ergänzt nicht ausdrücklich „abstammend von“.
- source_word: בַּת עֲנָה
  choice: der Tochter Anas
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Und dies sind ... Dies sind
  rationale: Die Wiederholung des Demonstrativpronomens und die formelhafte genealogische Rahmung bleiben erhalten; das Präsens entspricht der zeitlich nicht markierten hebräischen Nominalkonstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit genealogischem Ton. Die wiederholte Bezeichnung „Stammesführer“ macht die Funktion von אַלּוּף im edomitischen Zusammenhang unmittelbar verständlich, ohne die Zugehörigkeitsbeziehung in der abschließenden Zusammenfassung über den hebräischen Wortlaut hinaus festzulegen.
