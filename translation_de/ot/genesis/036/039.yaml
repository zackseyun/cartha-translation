base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: de
  text: Baal-Hanan, der Sohn Achbors, starb, und Hadar[a] wurde an seiner Stelle König. Seine Stadt hieß Pau[b], und seine Frau hieß Mehetabel, eine Tochter Matreds, der Tochter Me-Sahabs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textüberlieferungen und 1. Chronik 1,50 lesen Hadad statt Hadar.
    reason: textual_variant
  - marker: b
    text: In 1. Chronik 1,50 lautet der Stadtname Pai.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Die finite Form von מות bezeichnet schlicht den Tod; „starb“ ist die direkte, uneuphemistische deutsche Entsprechung.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: Baal-Hanan, der Sohn Achbors
  rationale: Die Eigennamen werden in gebräuchlicher deutscher Form wiedergegeben; die Apposition macht die Abstammungsangabe natürlich verständlich.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: מלך bezeichnet hier den Regierungsantritt in der Nachfolge des Verstorbenen; diese Formulierung gibt sowohl das Königtum als auch den Nachfolgegedanken idiomatisch wieder.
- source_word: הֲדַר
  choice: Hadar
  rationale: Der masoretische Text des WLC liest Hadar; die Variante Hadad wird in einer Fußnote dokumentiert.
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: Seine Stadt hieß Pau
  rationale: Die hebräische Namensformel wird in natürliches, knappes Deutsch übertragen; Pau folgt dem masoretischen Text.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: seine Frau hieß Mehetabel
  rationale: Die parallele Namensformel wird verständlich und ohne unnötige Schwerfälligkeit wiedergegeben.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: eine Tochter Matreds, der Tochter Me-Sahabs
  rationale: Die wiederholte Abstammungsformel wird formal bewahrt. Der Genitiv „der Tochter“ bezieht die zweite Angabe grammatisch auf Matred, ohne „Enkelin“ als interpretierende Verwandtschaftsbezeichnung einzuführen.
