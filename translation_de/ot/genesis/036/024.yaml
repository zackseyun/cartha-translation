base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: de
  text: 'Das sind die Söhne Zibeons: Aja und Ana. Das ist jener Ana, der in der Wildnis die Jemim[a] fand, als er für seinen Vater Zibeon die Esel weidete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes jemim ist ungewiss. Es wird als „heiße Quellen“ und in einigen alten sowie späteren Auslegungen als „Maultiere“ verstanden. Der Haupttext behält den hebräischen Ausdruck bei, weil der Wortbefund keine sichere Entscheidung erlaubt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: Söhne
  rationale: Die Konstruktverbindung bezeichnet hier in der genealogischen Aufzählung unmittelbar die männlichen Nachkommen.
- source_word: צִבְעוֹן
  choice: Zibon
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אַיָּה
  choice: Aja
  rationale: Der Personenname wird nach deutscher Laut- und Schreibkonvention transliteriert.
- source_word: עֲנָה
  choice: Ana
  rationale: Der Personenname wird innerhalb der Genealogie einheitlich transliteriert.
- source_word: הוּא עֲנָה
  choice: Das ist jener Ana
  rationale: Die Formulierung identifiziert diesen Ana näher; „jener“ gibt die rückverweisende, hervorhebende Funktion im Deutschen natürlich wieder.
- source_word: מָצָא
  choice: fand
  rationale: Das häufige Verb bedeutet schlicht „finden“; eine nähere Bestimmung als „entdecken“ wäre interpretierender.
- source_word: הַיֵּמִם
  choice: Jemim
  rationale: Das seltene hebräische Wort ist lexikalisch unsicher. Die Transliteration bewahrt diese Unsicherheit, während die Fußnote die wichtigsten Deutungen nennt.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: „Wildnis“ gibt מִדְבָּר breit wieder, ohne das Gelände unnötig auf eine Sandwüste einzuengen.
- source_word: בִּרְעֹתוֹ
  choice: als er … weidete
  rationale: Die Präposition mit Infinitiv bezeichnet eine gleichzeitige Handlung; mit „Esel“ als Objekt ist „weiden“ natürlich und präzise.
- source_word: הַחֲמֹרִים
  choice: die Esel
  rationale: Dies ist die klare, moderne deutsche Entsprechung.
- source_word: לְצִבְעוֹן אָבִיו
  choice: seines Vaters Zibon
  rationale: Der Zusammenhang zeigt, dass Ana die seinem Vater Zibon zugeordneten Esel hütete. Die deutsche Genitivform ist natürlicher als eine wörtliche Wiedergabe mit „für“.
