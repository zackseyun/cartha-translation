lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das deiktische Pluralpronomen leitet eine Liste ein; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: Stammesoberhäupter / Stammesoberhaupt
  rationale: Der Ausdruck bezeichnet hier führende Männer einer Stammes- oder Sippeneinheit. „Stammesoberhaupt“ ist gegenwärtig, würdevoll und gibt die Leitungsfunktion wieder; die Wiederholung vor jedem Namen folgt dem Hebräischen.
- source_word: הַחֹרִי
  choice: der Horiter
  rationale: Die morphologisch singularische Volksbezeichnung wird im Zusammenhang kollektiv verstanden und im Deutschen idiomatisch als Plural wiedergegeben.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: צִבְעוֹן
  choice: Zibon
  rationale: Der Personenname wird in einer geläufigen deutschen biblischen Form wiedergegeben.
- source_word: עֲנָה
  choice: Ana
  rationale: Der Personenname wird in einer geläufigen deutschen biblischen Form wiedergegeben.
