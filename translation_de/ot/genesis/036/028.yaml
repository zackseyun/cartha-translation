lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das deiktische Pluralpronomen leitet eine genealogische Aufzählung ein. „Das sind“ gibt die verblöse hebräische Formel im modernen Deutschen natürlich wieder.
- source_word: בְנֵי
  choice: die Söhne
  rationale: Im genealogischen Zusammenhang bezeichnet der Ausdruck hier die unmittelbar genannten männlichen Nachkommen; „Söhne“ ist daher genauer als „Kinder“ oder „Nachkommen“.
- source_word: דִישָׁן
  choice: Dischan
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition und nahe an der hebräischen Lautgestalt transliteriert.
- source_word: עוּץ
  choice: Uz
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַאֲרָן
  choice: und Aran
  rationale: Die Konjunktion ו verbindet den zweiten Namen mit dem ersten; der Personenname wird als „Aran“ transliteriert.
