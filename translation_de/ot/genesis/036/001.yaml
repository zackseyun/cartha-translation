id: GEN.36.1
reference: Genesis 36:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: de
  text: 'Dies ist die Geschlechterfolge Esaus (das heißt: Edom).[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dies ist die Geschlechterfolge Esaus; er ist Edom.“'
    reason: 'Lexikalische und syntaktische Alternative: וְ kann ausdrücklich als „Und“ wiedergegeben und הוּא prädikativ mit „er ist“ übersetzt werden.'
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Dies ist
  rationale: Die Verbindung aus וְ und אֵלֶּה eröffnet hier einen neuen Abschnitt. Im Deutschen kann die überschriftartige Formel ohne ein zusätzliches „Und“ natürlich wiedergegeben werden; die mögliche ausdrückliche Wiedergabe der Konjunktion wird in der Fußnote bewahrt.
- source_word: תֹּלְדֹוֹת
  choice: die Geschlechterfolge
  rationale: תֹּלְדֹוֹת ist ein wiederkehrender Gliederungsbegriff im 1. Buch Mose. „Geschlechterfolge“ erhält den Bezug auf Abstammung und Generationen, ohne den Ausdruck ausschließlich auf einen Bericht oder nur auf die Nachkommen einzuengen.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הוּא
  choice: das heißt
  rationale: Das Pronomen kann hier erläuternd bzw. identifizierend verstanden werden. „Das heißt“ ist in der Klammer idiomatisches Deutsch; die wörtlichere pronominale Fassung „er ist“ bleibt in der Fußnote erhalten.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der Eigenname wird in seiner etablierten deutschen Form beibehalten und mit Esau identifiziert.
theological_decisions:
- issue: Wiedergabe der Gliederungsformel תֹּלְדֹוֹת
  choice: die Geschlechterfolge
  alternative: die Geschichte / die Nachkommen
  rationale: Die Wahl bewahrt die literarische Leitformel des 1. Buches Mose und legt sie weder ausschließlich als Erzählbericht noch ausschließlich als Bezeichnung biologischer Nachkommen aus.
- issue: Verhältnis von Esau und Edom in הוּא אֱדוֹם
  choice: 'erläuternde Identifikation: „das heißt: Edom“'
  alternative: 'prädikative Aussage: „er ist Edom“'
  rationale: Der hebräische Wortlaut lässt eine knappe pronominale Aussage zu, die im Zusammenhang zugleich identifizierend wirkt. Die Hauptfassung gibt diese Funktion natürlich wieder; die formalere Möglichkeit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form bleibt als Abschnittsüberschrift erkennbar; der wiederkehrende Genesis-Begriff wird möglichst konsistent und ohne konfessionelle Zusatzdeutung wiedergegeben.
