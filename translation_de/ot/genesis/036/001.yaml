  source_fidelity: 'Die Übersetzung gibt die hebräische Gliederungsformel וְאֵלֶּה תֹּלְדוֹת angemessen als „Dies ist die Geschlechterfolge“ wieder. Die singularische deutsche Formel ist bei dem kollektiven Begriff „Geschlechterfolge“ idiomatisch und stellt keine sachliche Abweichung von dem hebräischen Plural dar. Die Identifikation „Esau ... Edom“ wird durch „das heißt: Edom“ verständlich und ohne zusätzliche Deutung wiedergegeben.'
