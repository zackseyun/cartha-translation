lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: In der genealogischen Aufzählung dient היה mit vorangestelltem Waw als einfache Kopula; »waren« gibt dies natürlich wieder, ohne eine Entwicklung im Sinn von »wurden« anzudeuten.
- source_word: בְּנֵי
  choice: die Söhne von
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich die männlichen Nachkommen und wird in der genealogischen Aussage entsprechend wiedergegeben.
- source_word: אֱלִיפָז
  choice: Elifas
  rationale: Für den Personennamen wird die im Deutschen geläufige biblische Namensform verwendet.
- source_word: תֵּימָן
  choice: Teman
  rationale: Der Personenname wird transliteriert und nicht nach einer möglichen Orts- oder Wortbedeutung übersetzt.
- source_word: אוֹמָר
  choice: Omar
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: צְפוֹ
  choice: Zefo
  rationale: Die Form entspricht der masoretischen Punktierung und der üblichen deutschen Wiedergabe des Namens; abweichende Schreibweisen werden in einer Fußnote genannt.
- source_word: גַעְתָּם
  choice: Gatam
  rationale: Der Personenname wird in einer lesbaren deutschen Transliteration wiedergegeben.
- source_word: קְנַז
  choice: Kenas
  rationale: Die etablierte deutsche Namensform wird gegenüber der strengeren Transliteration »Qenas« bevorzugt.
