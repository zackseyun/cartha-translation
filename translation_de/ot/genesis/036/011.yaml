  text: Und die Söhne von Elifas waren Teman, Omar, Zefo[a], Gatam und Kenas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in 1. Chronik 1,36 steht die Namensform »Zefi«; der masoretische Text hier hat »Zefo«.
