  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: de
  text: Schaul[a] starb, und an seiner Stelle wurde Baal-Hanan, der Sohn Akbors, König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In traditionellen deutschen Bibelübersetzungen stehen für diese Namen häufig die Formen „Saul“ und „Achbor“. Hier werden die dem Hebräischen näheren Formen „Schaul“ und „Akbor“ verwendet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet im erzählenden Zusammenhang schlicht den Tod; „starb“ ist direkt und vermeidet einen Euphemismus.
- source_word: שָׁאוּל
  choice: Schaul
  rationale: Die Form gibt den hebräischen Namen für deutschsprachige Leser lautnah wieder und unterscheidet sich bewusst von der traditionellen Form „Saul“.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: In dieser Thronfolgeformel bezeichnet מלך den Antritt der Königsherrschaft. „Wurde König“ ist im Deutschen natürlicher als „regierte“, wenn ausdrücklich die Nachfolge im Amt gemeint ist.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Pronominalsuffix bezeichnet hier, dass jemand die Stellung seines Vorgängers einnimmt; die deutsche Wendung bewahrt diesen Nachfolgegedanken.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Der zweiteilige hebräische Personenname wird zur Lesbarkeit mit Bindestrich wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die Constructusverbindung bezeichnet die unmittelbare Abstammung; im deutschen Satz ist die Apposition „der Sohn Akbors“ idiomatisch.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: „Akbor“ ist eine lesbare, dem hebräischen Namen nähere Umschrift; die traditionelle deutsche Form lautet häufig „Achbor“.
theological_decisions: []
