source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: de
  text: So ließ sich Esau im Bergland Seïr[a] nieder; Esau ist Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Gebirge Seïr“ oder „auf dem Berg Seïr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: Das wayyiqtol von ישׁב bezeichnet hier im erzählenden Zusammenhang die Aufnahme bzw. Festigung des Wohnsitzes; die Wendung ist im modernen Deutsch natürlich und passt zum Kontext.
- source_word: בְּהַר
  choice: im Bergland
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen. Bei Seïr liegt die regionale Bedeutung nahe; „Bergland“ bewahrt zugleich den geografischen Charakter.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Der Ortsname wird in seiner etablierten deutschen biblischen Form wiedergegeben; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Etablierte deutsche Namensform.
- source_word: הוּא אֱדוֹם
  choice: Esau ist Edom
  rationale: Die direkte Wiedergabe des verblosen Identifikationssatzes bewahrt die knappe genealogisch-ethnische Gleichsetzung, ohne sie erläuternd aufzulösen.
theological_decisions:
- issue: Identifikation Esaus mit Edom
  choice: Esau ist Edom
  alternative: 'Das heißt: Edom'
  rationale: Die direkte Form erhält die Spannung und Prägnanz der hebräischen Identifikationsaussage und deutet Edom nicht ausdrücklich nur als weiteren Namen oder als Volk.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ließ sich … nieder“ gibt den narrativen Zusammenhang idiomatisch wieder; „Bergland“ vermeidet die unnötige Festlegung auf einen einzelnen Gipfel.
