  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חֻשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: de
  text: Und Jobab starb, und an seiner Stelle wurde Huscham aus dem Land der Temaniter[a] König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „aus dem Land Teman“ oder „aus dem Land des Temaniters“. Die hebräische Herkunftsbezeichnung kann sich auf das mit Teman verbundene Gebiet oder auf dessen Bevölkerung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מות bezeichnet in dieser fortlaufenden Königsnotiz ein schlichtes Ereignis der Vergangenheit; „starb“ ist die natürliche deutsche Wiedergabe.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: מלך bezeichnet in dieser Nachfolgeformel den Antritt der Königsherrschaft. „Wurde König“ ist im heutigen Deutsch natürlicher als „regierte“, das eher die Dauer der Herrschaft betonen könnte.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Pronominalsuffix bezeichnet hier die Nachfolge beziehungsweise Ersetzung im Königsamt.
- source_word: חֻשָׁם
  choice: Huscham
  rationale: Der Personenname wird in einer dem Hebräischen entsprechenden, im Deutschen gut lesbaren Form transliteriert.
- source_word: מֵאֶרֶץ
  choice: aus dem Land
  rationale: מן mit אֶרֶץ bezeichnet die geografische Herkunft; „aus dem Land“ gibt dies natürlich und präzise wieder.
- source_word: הַתֵּימָנִי
  choice: der Temaniter
  rationale: Die gentilizische Form wird kollektiv als Bezeichnung der mit Teman verbundenen Bevölkerung verstanden; nach „Land“ ist „der Temaniter“ idiomatisches Deutsch, ohne die zugrunde liegende Mehrdeutigkeit zu verdecken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Königsformel wird knapp wiedergegeben; „wurde König“ macht den Amtsantritt deutlich. Die genuine Mehrdeutigkeit von הַתֵּימָנִי wird in einer Fußnote bewahrt.
