  source_fidelity: 'Der Vers gibt die beiden Wayyiqtol-Handlungen korrekt in der erzählerischen Abfolge wieder: Jobab stirbt, und Huscham tritt an seine Stelle als König. „An seiner Stelle“ trifft תַּחְתָּיו im Kontext einer Thronfolge präzise. „Aus dem Land der Temaniter“ ist als kollektive Wiedergabe des hebräischen Gentiliziums vertretbar und die reale Deutungsbreite wird in der Anmerkung ausgewiesen.'
  naturalness: „Und Jobab starb, und an seiner Stelle wurde Huscham aus dem Land der Temaniter König“ ist klares, modernes und zugleich für eine Königsnotiz angemessen würdiges Standarddeutsch. Die Stellung von „König“ am Satzende ist idiomatisch.
