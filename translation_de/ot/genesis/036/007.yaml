  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: de
  text: Denn ihr Besitz war zu groß, als dass sie zusammen wohnen konnten, und das Land, in dem sie als Fremde lebten[a], konnte sie wegen ihres Viehs nicht versorgen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land ihres Fremdlingsaufenthalts“; gemeint ist das Land, in dem sie sich als ansässige Fremde aufhielten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „konnte sie nicht tragen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Esaus im vorhergehenden Vers geschilderte Trennung von Jakob ein.
- source_word: רְכוּשָׁם
  choice: ihr Besitz
  rationale: Bezeichnet den gesamten beweglichen Besitz; der deutsche Kollektivbegriff passt zu Gütern und Tieren.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: war zu groß, als dass sie zusammen wohnen konnten
  rationale: Gibt die durch מִן ausgedrückte Unvereinbarkeit von Besitzfülle und gemeinsamem Wohnen natürlich und präzise wieder.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: das Land, in dem sie als Fremde lebten
  rationale: Bewahrt den Gedanken eines Aufenthalts ohne volle Heimat- oder Besitzstellung und bleibt zugleich in modernem Deutsch verständlich.
- source_word: לָשֵׂאת אֹתָם
  choice: konnte sie nicht versorgen
  rationale: נשא bedeutet wörtlich „tragen“; bei einem Land als Subjekt bezeichnet es hier dessen unzureichende Trag- beziehungsweise Versorgungskapazität.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: wegen ihres Viehs
  rationale: מִפְּנֵי bezeichnet hier den Grund; מִקְנֶה ist ein weiter Sammelbegriff für gehaltene Nutztiere.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „als Fremde lebten“ erhält das Motiv des nicht endgültigen, rechtlich nicht voll beheimateten Aufenthalts; „versorgen“ macht die konkrete Tragfähigkeit des Landes verständlich, während die wörtliche Bildsprache in der Fußnote erhalten bleibt.
