  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: de
  text: Das sind die Söhne Esaus, und das sind ihre Stammesoberhäupter[a]. Er ist Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Stammesfürsten. Das hebräische Wort אַלּוּפִים bezeichnet in Edom die Oberhäupter von Stämmen oder Sippen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das deiktische Pluralpronomen eröffnet eine genealogische Zusammenfassung. Die präsentische Form gibt den verblosen hebräischen Satz im modernen Deutschen natürlich wieder.
- source_word: בְנֵי עֵשָׂו
  choice: die Söhne Esaus
  rationale: בְּנֵי bezeichnet hier in einer Genealogie die männlichen Nachkommen; der deutsche Genitiv bewahrt die knappe Konstruktion.
- source_word: וְאֵלֶּה
  choice: und das sind
  rationale: Die Wiederholung erhält den parallelen Aufbau der beiden hebräischen Identifikationssätze.
- source_word: אַלּוּפֵיהֶם
  choice: ihre Stammesoberhäupter
  rationale: אַלּוּף bezeichnet in Genesis 36 die führenden Männer edomitischer Stammes- oder Sippenverbände. »Stammesoberhäupter« ist verständlich und bildet die gesellschaftlich-politische Funktion genauer ab als ein unspezifisches »Anführer«.
- source_word: הוּא אֱדוֹם
  choice: Er ist Edom
  rationale: Das maskuline Singularpronomen greift Esau auf und identifiziert ihn mit Edom. Die direkte Form bewahrt die knappe Aussage und ihre eponymische Spannung.
theological_decisions:
- issue: Identifikation Esaus mit Edom
  choice: Er ist Edom
  alternative: Das ist Edom
  rationale: Das hebräische הוּא ist maskulin Singular und verweist am naheliegendsten auf Esau. Die Übersetzung deutet die Aussage nicht zusätzlich als bloße Erklärung eines Volks- oder Landesnamens aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; der institutionelle Titel wird verständlich, aber ohne moderne Amtskonnotationen wiedergegeben.
