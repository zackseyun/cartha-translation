  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: de
  text: Bela, der Sohn Beors, wurde König in Edom[a], und seine Stadt hieß Dinhaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde König über Edom“. Wörtlich steht im Hebräischen „in Edom“; gemeint sein kann damit zugleich sein Herrschaftsgebiet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Das wayyiqtol von מלך bezeichnet in dieser Königsliste den Regierungsantritt; „wurde König“ gibt diesen erzählerischen Fortgang im modernen Deutschen natürlich wieder.
- source_word: בֶּאֱדוֹם
  choice: in Edom
  rationale: Die Präposition ב bezeichnet unmittelbar den Ort beziehungsweise Herrschaftsbereich. „In Edom“ bewahrt die hebräische Formulierung; „über Edom“ ist kontextuell ebenfalls möglich.
- source_word: בֶּלַע
  choice: Bela
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן בְּעוֹר
  choice: der Sohn Beors
  rationale: Die genealogische Verbindung wird im Deutschen idiomatisch und genau ausgedrückt.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: und seine Stadt hieß Dinhaba
  rationale: Diese natürliche deutsche Wendung gibt die Aussage „und der Name seiner Stadt war Dinhaba“ vollständig wieder, einschließlich des Possessivsuffixes an עִירוֹ.
