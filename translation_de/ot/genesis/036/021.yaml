  register: Modernes, würdiges Standarddeutsch. Die Namensreihe und die genealogische Identifikationsformel bleiben eng an der hebräischen Struktur; »Stammesoberhäupter« verdeutlicht die soziale Führungsfunktion ohne archaische oder feudale Konnotationen.
