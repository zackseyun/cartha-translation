source:
  edition: WLC
  text: וְ/דִשׁ֥וֹן וְ/אֵ֖צֶר וְ/דִישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י בְּנֵ֥י שֵׂעִ֖יר בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: de
  text: und Dischon, Ezer und Dischan. Das sind die Stammesoberhäupter[a] der Horiter, die Söhne Seïrs, im Land Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sippenoberhäupter«. Das hebräische Wort bezeichnet die gesellschaftlich-politischen Führer von Stammes- oder Sippengruppen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Dischon
  rationale: Personenname; in einer dem Hebräischen angenäherten, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Personenname; nach gängiger deutscher biblischer Namensform transliteriert.
- source_word: דִישָׁן
  choice: Dischan
  rationale: Personenname; zur Unterscheidung von Dischon entsprechend der hebräischen Vokalisierung transliteriert.
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die pluralische Identifikationsformel wird idiomatisch deutsch mit ergänzter Kopula wiedergegeben.
- source_word: אַלּוּפֵי
  choice: Stammesoberhäupter
  rationale: Der Ausdruck bezeichnet hier die führenden Häupter gesellschaftlich-politischer Gruppen; diese Wiedergabe ist präziser als das allgemeinere »Fürsten« und vermeidet das missverständliche »Herzöge«.
- source_word: הַחֹרִי
  choice: der Horiter
  rationale: Das morphologisch singularische Ethnonym wird kollektiv verstanden und im Deutschen pluralisch wiedergegeben.
- source_word: בְּנֵי שֵׂעִיר
  choice: die Söhne Seïrs
  rationale: Bewahrt die formale genealogische Ausdrucksweise und den Abstammungsbezug des Hebräischen.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Gibt die ausdrückliche geografische Wendung einschließlich »Land« knapp und natürlich wieder.
theological_decisions: []
