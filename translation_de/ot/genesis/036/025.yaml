lexical_decisions:
- source_word: בְנֵי
  choice: Kinder
  rationale: Obwohl das Wort häufig »Söhne« bedeutet, umfasst die anschließende Aufzählung ausdrücklich Dischon und Oholibama, die als Tochter bezeichnet wird. »Kinder« gibt hier den kontextuellen Umfang im natürlichen Deutschen wieder.
- source_word: דִּשֹׁן
  choice: Dischon
  rationale: Der hebräische Personenname wird in einer im Deutschen gut lesbaren, quellenahen Form wiedergegeben.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Der hebräische Personenname wird in gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: בַּת עֲנָה
  choice: die Tochter Anas
  rationale: Die Status-constructus-Verbindung wird idiomatisch und eindeutig als Abstammungsangabe übersetzt.
