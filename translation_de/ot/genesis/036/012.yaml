source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: de
  text: Timna war eine Nebenfrau Elifas’, des Sohnes Esaus, und sie gebar Elifas Amalek. Das sind die Söhne[a] Adas, der Frau Esaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann in biblischen Abstammungslisten auch Nachkommen einer späteren Generation bezeichnen; nach dem Zusammenhang sind hier Adas Enkel beziehungsweise ihre Nachkommen gemeint.
    reason: genealogical_semantic_range
lexical_decisions:
- source_word: וְתִמְנַע הָיְתָה
  choice: Timna war
  rationale: Das Perfekt von היה dient hier als Kopula; die einleitende Konjunktion wird im Deutschen nicht eigens wiedergegeben, da der Satz mit dem Subjekt natürlich anschließt.
- source_word: פִילֶגֶשׁ
  choice: Nebenfrau
  rationale: Der Ausdruck bezeichnet eine anerkannte, aber gegenüber einer Hauptfrau nachgeordnete eheähnliche Verbindung. „Nebenfrau“ gibt diese soziale Stellung verständlich und würdig wieder.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: Elifas’, des Sohnes Esaus
  rationale: Das erste ל bezeichnet die Zugehörigkeit beziehungsweise Beziehung; die Apposition gibt die hebräische Statuskette knapp und natürlich wieder.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת־עֲמָלֵק
  choice: und sie gebar Elifas Amalek
  rationale: Die Form von ילד bezeichnet das Gebären; der Dativ „Elifas“ bewahrt die genealogische Konstruktion mit ל, ohne die Vaterschaft umständlich auszudeuten.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Das sind die Söhne Adas
  rationale: Die genealogische Formel und der Grundsinn von בָּנִים werden formal bewahrt. Eine Fußnote weist darauf hin, dass „Söhne“ in Abstammungslisten weiter gefasst sein kann.
- source_word: אֵשֶׁת עֵשָׂו
  choice: der Frau Esaus
  rationale: Die Apposition identifiziert Ada als Esaus Frau; der deutsche Genitiv entspricht der hebräischen Status-constructus-Verbindung.
theological_decisions:
- issue: Genealogische Reichweite von בְּנֵי
  choice: Söhne
  alternative: Enkel beziehungsweise Nachkommen
  rationale: Der Haupttext bewahrt den unmittelbaren Wortlaut und dessen Spannung. Da die zuvor genannten Personen genealogisch über Elifas zu Ada gehören, erläutert die Fußnote die mögliche weitere Bedeutung, ohne sie stillschweigend in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzstruktur. „Nebenfrau“ ist verständlicher und weniger fremdsprachlich als „Konkubine“, wahrt aber die untergeordnete soziale Stellung. Der Genitiv mit Apostroph bei „Elifas’“ verhindert eine schwerfällige Wiederholung.
