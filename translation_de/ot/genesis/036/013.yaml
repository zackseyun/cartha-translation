  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: de
  text: 'Und dies waren die Söhne Reguëls: Nahat, Serach, Schamma und Missa. Dies waren die Nachkommen Basemats, der Frau Esaus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Dies waren die Söhne Basemats.'
    reason: Die Fußnote dokumentiert die formale Wiederholung von בְּנֵי im Hebräischen, während der Haupttext dessen weitere genealogische Bedeutung kontextgerecht wiedergibt.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies
  rationale: Die Verbindung aus Konjunktion und Demonstrativ führt den nächsten Abschnitt der Geschlechtsfolge ein; „Und dies“ wahrt den Anschluss und klingt in einer genealogischen Aufzählung würdig.
- source_word: בְּנֵי רְעוּאֵל
  choice: die Söhne Reguëls
  rationale: Hier werden die unmittelbar folgenden männlichen Kinder Reguëls namentlich aufgezählt, daher ist „Söhne“ präzise.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Nahat, Serach, Schamma und Missa
  rationale: Die Personennamen werden nach gängigen deutschen Bibelnamenkonventionen transliteriert; das abschließende „und“ bildet die hebräische Liste natürlich ab.
- source_word: אֵלֶּה הָיוּ
  choice: Dies waren
  rationale: Die Vergangenheitsform entspricht der genealogischen Formel mit היה und ist im Deutschen natürlich.
- source_word: בְּנֵי בָשְׂמַת
  choice: die Nachkommen Basemats
  rationale: בְּנֵי kann über unmittelbare Söhne hinaus Angehörige der Nachkommenschaft bezeichnen. Da Reguël nach dem Kontext Basemats Sohn ist, sind die genannten Männer ihre Enkel; „Nachkommen“ wahrt die semantische Breite des Hebräischen, ohne einen Widerspruch zu erzeugen oder den Verwandtschaftsgrad enger festzulegen als der Wortlaut.
- source_word: אֵשֶׁת עֵשָׂו
  choice: der Frau Esaus
  rationale: Die Apposition identifiziert Basemat knapp und idiomatisch als Esaus Frau.
theological_decisions:
- issue: Reichweite des zweiten בְּנֵי
  choice: Nachkommen
  alternative: Söhne; Enkel
  rationale: Die wörtliche Wiederholung „Söhne Basemats“ kann im Deutschen fälschlich unmittelbare Mutterschaft zu allen vier Männern behaupten. „Enkel“ träfe zwar den Kontext, spezifiziert aber stärker als das hebräische בְּנֵי. „Nachkommen“ erhält dessen genealogische Weite und die kontextuelle Stimmigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem genealogischem Ton. Die Namensformen orientieren sich an etablierten deutschen Transliterationskonventionen; der zweite Gebrauch von בְּנֵי wird kontextsensitiv und ohne unnötige Präzisierung wiedergegeben.
