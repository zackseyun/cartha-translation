base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: de
  text: Und Oholibama gebar Jëusch, Jalam und Korach. Das sind die Söhne Esaus, die ihm im Land Kanaan geboren wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Eingebürgerte deutsche Transliteration des Personennamens; der Name wird nicht übersetzt.
- source_word: יָלְדָה
  choice: gebar
  rationale: Gibt das genealogisch verwendete Verb prägnant wieder und bewahrt Oholibama als mütterliches Subjekt.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: im Deutschen nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine unmittelbare deutsche Entsprechung.
- source_word: יעיש
  choice: Jëusch
  rationale: Deutsche biblische Namensform; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: יַעְלָם
  choice: Jalam
  rationale: Natürliche deutsche Transliteration des Personennamens.
- source_word: קֹרַח
  choice: Korach
  rationale: Übliche deutsche Wiedergabe des Namens mit ch für den hebräischen Kehllaut.
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Natürliche deutsche Formulierung zur zusammenfassenden Identifizierung der zuvor genannten Personen.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Bezeichnet hier ausdrücklich männliche Nachkommen, die einzeln genannt werden.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: die ihm ... geboren wurden
  rationale: Bewahrt die passive Konstruktion und den Bezug auf Esau, ohne eine im Teilsatz nicht ausdrücklich genannte Mutter einzufügen.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Gibt אֶרֶץ ausdrücklich wieder und entspricht einem würdigen genealogischen Register.
