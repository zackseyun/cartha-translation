  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: de
  text: Dann starb Samla, und an seiner Stelle wurde Schaul aus Rechobot am Strom König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Wayyiqtol führt die Erzählung zeitlich weiter; „Dann starb“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Im Zusammenhang der Königsnachfolge bezeichnet מלך den Regierungsantritt; die deutsche Wendung ist natürlich und bewahrt den königlichen Sinn.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet hier die Nachfolge eines Herrschers durch einen anderen.
- source_word: שָׁאוּל
  choice: Schaul
  rationale: Die Transliteration gibt den hebräischen Namen unmittelbar wieder und unterscheidet ihn nicht künstlich von derselben Namensform an anderen Stellen.
- source_word: מֵרְחֹבוֹת הַנָּהָר
  choice: aus Rechobot am Strom
  rationale: מִן kennzeichnet die Herkunft. הַנָּהָר bestimmt den Ortsnamen geografisch; „am Strom“ bewahrt den bestimmten, offenbar als bekannt vorausgesetzten Fluss, ohne ihn ungesichert zu identifizieren.
