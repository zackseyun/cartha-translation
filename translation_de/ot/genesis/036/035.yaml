  text: וַ/יָּ֖מָת חֻשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עֲוִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: de
  text: Und Huscham starb, und an seiner Stelle wurde Hadad, der Sohn Bedads, König, der Midian im Gebiet von Moab[a] schlug. Seine Stadt hieß Awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Feld Moabs“. Gemeint sein kann auch das Land oder Territorium Moabs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Verb מות bezeichnet hier schlicht den Tod; „starb“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: an seiner Stelle wurde … König
  rationale: מלך bezeichnet das Königsein bzw. Herrschen, während תחתיו die Nachfolge ausdrückt. Die Formulierung ist im Deutschen natürlich und bewahrt den Sinn der Thronfolge.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad, der Sohn Bedads
  rationale: Die Personennamen werden transliteriert; בן wird in der genealogischen Wendung als „Sohn“ wiedergegeben.
- source_word: הַמַּכֶּה
  choice: Er war es, der … schlug
  rationale: Das Hifil-Partizip von נכה kennzeichnet Hadad durch eine bekannte Tat. „schlug“ wahrt die lexikalische Offenheit besser als das eindeutigere „besiegte“.
- source_word: אֶת מִדְיָן
  choice: Midian
  rationale: Der hebräische Text nennt den Eigennamen Midian; eine Erweiterung zu „die Midianiter“ wäre möglich, aber stärker auslegend.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: im Gebiet von Moab
  rationale: שׂדה kann zwar wörtlich „Feld“ bedeuten, bezeichnet in einer geografischen Verbindung jedoch auch Land, Gebiet oder Territorium. „Gebiet“ ist hier verständliches, idiomatisches Deutsch.
- source_word: וְשֵׁם עִירוֹ
  choice: Seine Stadt hieß
  rationale: Die knappe deutsche Namensformel gibt den Inhalt des hebräischen Ausdrucks natürlich und vollständig wieder.
- source_word: עֲוִית
  choice: Awit
  rationale: Der Ortsname wird nach seiner hebräischen Lautgestalt für deutsche Leser transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte hebräische Satzverknüpfung wird teilweise in kürzere deutsche Sätze aufgelöst. Die offene Bedeutung von נכה bleibt mit „schlug“ erhalten; die geografische Wendung wird idiomatisch als „Gebiet von Moab“ wiedergegeben und in der Fußnote wörtlich erläutert.
