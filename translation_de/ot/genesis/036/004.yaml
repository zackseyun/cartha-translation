  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: de
  text: Ada gebar für Esau Elifas, und Basemat gebar Reguël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: gebar
  rationale: Beide Formen stammen von ילד, »gebären«. Das knappe »gebar« passt zum genealogischen Erzählstil und lässt die Mütter jeweils klar als Subjekt erkennen.
- source_word: לְעֵשָׂו
  choice: Esau
  rationale: Die Präposition ל bezeichnet bei ילד in genealogischen Zusammenhängen den Vater. Im natürlichen Deutschen wird diese Beziehung durch »Ada gebar Esau Elifas« ausgedrückt, ohne eine zusätzliche Präposition einzufügen.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der direkte Objektmarker hat kein eigenständiges deutsches Gegenstück; seine syntaktische Funktion wird durch Satzstellung und Kasus ausgedrückt.
- source_word: עָדָה
  choice: Ada
  rationale: Der Personenname wird in einer im Deutschen etablierten, eng am hebräischen Namen orientierten Form wiedergegeben.
- source_word: אֱלִיפָז
  choice: Elifas
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: בָשְׂמַת
  choice: Basemat
  rationale: Die Form gibt den masoretischen Namen בָשְׂמַת in natürlicher deutscher Transliteration wieder.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Die geläufige deutsche Namensform gibt die hebräischen Bestandteile des Namens hinreichend erkennbar wieder; der Trema kennzeichnet, dass u und e getrennt gesprochen werden.
- source_word: וּ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden Geburtsnotizen.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger genealogischer Erzählstil in modernem Standarddeutsch. Die zweimalige Wiederholung von »gebar« bewahrt die Parallelstruktur des Hebräischen.
