base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: de
  text: 'Dies sind die Söhne Seïrs, des Horiters, die Bewohner des Landes[a]: Lotan, Schobal, Zibeon und Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die im Land wohnen.'
    reason: Die hebräische Partizipialwendung kann statt als substantivische Apposition auch verbal wiedergegeben werden.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die präsentische Wendung gibt die hebräische Einleitung einer genealogischen Aufzählung natürlich und würdig wieder.
- source_word: בְנֵי
  choice: die Söhne
  rationale: Der unmittelbare Zusammenhang nennt männliche Nachkommen beziehungsweise Sippenhäupter; die formale genealogische Bezeichnung bleibt erhalten.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: הַחֹרִי
  choice: des Horiters
  rationale: Das Gentiliz bezeichnet Seïrs ethnische Zugehörigkeit. Die Apposition im Genitiv ist im Deutschen eindeutig und idiomatisch.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Das substantivierte Partizip im Plural bezeichnet die dort ansässigen Bewohner und steht als Apposition zu den genannten Söhnen.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Transliteration des Eigennamens in geläufiger deutscher Form.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Transliteration des Eigennamens nach üblicher deutscher Lautwiedergabe.
- source_word: צִבְעוֹן
  choice: Zibon
  rationale: Etablierte deutsche Form des Eigennamens.
- source_word: עֲנָה
  choice: Ana
  rationale: Etablierte deutsche Form des Eigennamens.
