  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: de
  text: 'Und dies waren die Söhne Dischans: Hemdan, Eschban, Jitran und Keran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies waren
  rationale: Die Konjunktion und das Demonstrativpronomen leiten eine genealogische Liste ein. Der im Hebräischen fehlende Kopulaverb wird im Deutschen als „waren“ ergänzt, passend zum erzählenden Rückblick.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Konstruktusform bedeutet wörtlich „Söhne von“. Da unmittelbar namentlich genannte männliche Nachkommen aufgezählt werden, ist „Söhne“ genauer als das weitere „Nachkommen“.
- source_word: דִישָׁן
  choice: Dischan
  rationale: Der Personenname wird nach gängiger deutscher Bibeltransliteration wiedergegeben; שׁ wird dabei durch „sch“ dargestellt.
- source_word: חֶמְדָּן
  choice: Hemdan
  rationale: Der Personenname wird lautnah aus der masoretischen Form transliteriert.
- source_word: וְ/אֶשְׁבָּן
  choice: Eschban
  rationale: Der Personenname wird nach deutscher Lautkonvention transliteriert; die vorangestellte Konjunktion wird durch die deutsche Listenstruktur wiedergegeben.
- source_word: וְ/יִתְרָן
  choice: Jitran
  rationale: Anlautendes י wird in deutscher Transliterationskonvention als „J“ und ת ohne Dagesch als „t“ wiedergegeben.
- source_word: וּ/כְרָן
  choice: und Keran
  rationale: Die Konjunktion wird vor dem letzten Glied ausdrücklich mit „und“ wiedergegeben. כ ohne Dagesch könnte streng lautbezogen als Reibelaut erscheinen; „Keran“ wahrt jedoch die im Deutschen bei biblischen Eigennamen übliche und gut lesbare Namensform.
