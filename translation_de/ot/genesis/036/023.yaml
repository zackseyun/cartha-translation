base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: de
  text: 'Dies sind die Söhne Schobals: Alwan[a], Manahat, Ebal, Schefo[b] und Onam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier Alwan; in der parallelen Geschlechtsliste in 1. Chronik 1,40 steht Aljan.
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen steht hier Schefo; in der parallelen Geschlechtsliste in 1. Chronik 1,40 steht Schefi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet den nächsten genealogischen Eintrag ein. Im modernen Deutschen ist „Dies sind“ natürlich; das vorangestellte וְ muss in dieser Formel nicht eigens mit „und“ wiedergegeben werden.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Hier folgt eine Liste männlicher direkter Nachkommen; daher ist „Söhne“ genauer als das weiter gefasste „Nachkommen“.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, hebräisch orientierten Form wiedergegeben.
- source_word: עַלְוָן
  choice: Alwan
  rationale: Die Form folgt dem masoretischen Text dieses Verses. Die abweichende Parallelform in 1. Chronik 1,40 wird in einer Fußnote bewahrt.
- source_word: וּ/מָנַחַת
  choice: Manahat
  rationale: Der Personenname wird hebräisch orientiert wiedergegeben; die Konjunktion wird entsprechend deutscher Aufzählungsweise nicht bei jedem Namen ausgedrückt.
- source_word: וְ/עֵיבָל
  choice: Ebal
  rationale: Direkte Wiedergabe des Personennamens in geläufiger deutscher Schreibweise.
- source_word: שְׁפוֹ
  choice: Schefo
  rationale: Die Form folgt dem masoretischen Text dieses Verses. Die Variante „Schefi“ aus 1. Chronik 1,40 wird in einer Fußnote angegeben.
- source_word: וְ/אוֹנָם
  choice: und Onam
  rationale: Der Personenname wird direkt wiedergegeben; die Konjunktion steht idiomatisch vor dem letzten Glied der deutschen Aufzählung.
