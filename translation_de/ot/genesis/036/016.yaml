  source_fidelity: Der Entwurf gibt die dreifache Titelformel אַלּוּף angemessen wieder und bewahrt die abschließenden Identifikationssätze. „Söhne Adas“ entspricht בְּנֵי עָדָה und lässt dessen im genealogischen Kontext mögliche weitere Nachkommensbedeutung unmarkiert. Die Namensformen Korach, Gatam, Amalek, Elifas, Edom und Ada sind im Deutschen etabliert bzw. unproblematisch.
