base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: de
  text: Fürst Korach, Fürst Gatam, Fürst Amalek. Das sind die Fürsten Elifas’ im Land Edom; das sind die Söhne Adas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף (ʾallūf)
  choice: Fürst
  rationale: Der Titel bezeichnet hier ein Stammes- oder Sippenoberhaupt. „Fürst“ ist im genealogisch-politischen Zusammenhang würdig und verständlich, ohne den Rang genauer festzulegen, als es der hebräische Ausdruck erlaubt.
- source_word: גַּעְתָּם (Gaʿtām)
  choice: Gatam
  rationale: Der hebräische Personenname wird in einer knappen, am Konsonantenbestand orientierten deutschen Form wiedergegeben.
- source_word: בְּנֵי (bənê)
  choice: Söhne
  rationale: Die formale Wiedergabe bewahrt die genealogische Aussage des Hebräischen; im Zusammenhang kann der Ausdruck auch Nachkommen beziehungsweise die zu Adas Linie Gehörenden bezeichnen.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger genealogischer Stil in modernem Standarddeutsch. Die Wiederholung von „Fürst“ und „Das sind“ folgt der Struktur des hebräischen Textes; das erste Satzglied wird zur natürlichen deutschen Lesbarkeit als eigener Satz gesetzt.
