  variant: modern standard German
source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: de
  text: 'Esau nahm seine Frauen aus den Töchtern Kanaans: Ada, die Tochter Elons, des Hetiters, und Oholibama, die Tochter Anas und Enkelin[a] Zibons, des Hiwiters.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Tochter Anas, die Tochter Zibons«.'
    reason: Die hebräische Formulierung wiederholt »Tochter«; »Enkelin« gibt die naheliegende genealogische Beziehung im Deutschen wieder, ohne die ungewöhnliche Ausdrucksweise zu verschweigen.
  - marker: b
    text: 'Hebräisch: »der Hiwiter«. Manche deuten die Abstammung im Einklang mit verwandten Geschlechtsregistern anders, darunter »der Horiter«; vergleiche Genesis 36,20.'
    reason: Die Fußnote bewahrt die genealogische beziehungsweise textliche Spannung, während der Haupttext dem masoretischen Text folgt.
lexical_decisions:
- source_word: לָקַח
  choice: nahm
  rationale: Die Grundbedeutung »nahm« bleibt erhalten. Im Zusammenhang mit »seine Frauen« ist verständlich, dass Esau sie zu Frauen nahm, ohne das Verb deutend zu »heiratete« zu erweitern.
- source_word: נָשָׁיו
  choice: seine Frauen
  rationale: Im genealogischen Zusammenhang bezeichnet der Plural eindeutig Esaus Ehefrauen; »Frauen« ist im Deutschen die natürliche und sachlich passende Wiedergabe.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: aus den Töchtern Kanaans
  rationale: Die hebräische Wendung wird formal und zugleich verständlich bewahrt; sie bezeichnet Frauen aus den Völkern beziehungsweise dem Land Kanaan.
- source_word: הַחִתִּי
  choice: der Hetiter
  rationale: »Hetiter« ist die übliche deutsche Bezeichnung für חִתִּי.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Die Form folgt einer im Deutschen gebräuchlichen, dem Hebräischen nahen Umschrift des Namens.
- source_word: בַּת עֲנָה בַּת צִבְעוֹן
  choice: die Tochter Anas und Enkelin Zibons
  rationale: Die Wiedergabe macht die genealogische Abfolge im Deutschen verständlich, ohne Anas Geschlecht durch die unmittelbar wiederholte Bezeichnung »Tochter« festzulegen; die wörtliche Form wird in einer Fußnote offengelegt.
- source_word: הַחִוִּי
  choice: der Hiwiter
  rationale: Der masoretische Text liest חִוִּי, »Hiwiter«. Die abweichende Einordnung als Horiter wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
theological_decisions:
- issue: Genealogische Formulierung »Tochter Anas, Tochter Zibons«
  choice: Im Haupttext »Tochter Anas und Enkelin Zibons«
  alternative: 'Wörtlich: »Tochter Anas, Tochter Zibons«'
  rationale: Die deutsche Formulierung bildet die naheliegende genealogische Beziehung verständlich ab, während die ungewöhnliche Wiederholung und die damit verbundene Spannung in der Fußnote erhalten bleiben.
- issue: Volkszugehörigkeit Zibons im letzten Satzglied
  choice: 'Dem masoretischen Text folgend: »der Hiwiter«'
  alternative: »der Horiter« aufgrund verwandter genealogischer Angaben, besonders Genesis 36,20
  rationale: Der überlieferte hebräische Text wird im Haupttext übersetzt. Die Spannung zu verwandten genealogischen Angaben wird nicht stillschweigend harmonisiert, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle biblische Wendung »Töchter Kanaans« bleibt erhalten, ist aber im Zusammenhang gut verständlich. Eigennamen und Volksbezeichnungen folgen geläufigen deutschen Formen.
