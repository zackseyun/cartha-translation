source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: de
  text: 'Und dies waren die Söhne Oholibamas, der Tochter Anas, der Tochter Zibeons, der Frau Esaus: Sie gebar Esau Jeusch, Jalam und Korach.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: Und dies waren
  rationale: Bewahrt sowohl die Verknüpfung durch ו als auch die übliche genealogische Einleitungsformel mit der Vergangenheitsform von היה.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die unmittelbar genannten Nachkommen sind männlich; daher ist „Söhne“ genauer als „Kinder“ oder „Nachkommen“.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: der Tochter Anas, der Tochter Zibeons
  rationale: Die zweimalige Bezeichnung als „Tochter“ wird entsprechend der hebräischen Apposition beibehalten, statt die zweite Beziehung zu „Enkelin“ zu glätten.
- source_word: אֵשֶׁת עֵשָׂו
  choice: der Frau Esaus
  rationale: Die Genitivkonstruktion gibt die hebräische Statusangabe knapp und in würdigem modernem Deutsch wieder.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: Sie gebar Esau
  rationale: Das Verb ילד mit ל bezeichnet hier das Gebären von Kindern für beziehungsweise dem Ehemann; der deutsche Dativ gibt diese Beziehung natürlich wieder.
- source_word: יעיש
  choice: Jëusch
  rationale: Deutsche Transliteration des Personennamens; das Trema macht kenntlich, dass e und u getrennt gesprochen werden.
- source_word: יַעְלָם
  choice: Jalam
  rationale: Nahe Transliteration des hebräischen Personennamens in deutscher Lautzuordnung.
- source_word: קֹרַח
  choice: Korach
  rationale: Die Wiedergabe mit „ch“ entspricht der im Deutschen üblichen Transliteration des Schlusskonsonanten ח.
