base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: de
  text: Alle Tiere, alle Kriechtiere und alle Vögel – alles, was sich auf der Erde regt – gingen nach ihren Familien[a] aus der Arche hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Familie für Familie“. Der hebräische Ausdruck bezeichnet eine Gliederung der Tiere nach ihren Familien oder Sippen; „nach ihren Arten“ wäre stärker deutend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Alle Tiere
  rationale: חַיָּה bezeichnet hier im Rahmen der Aufzählung die Tiere neben Kriechtieren und Vögeln. „Tiere“ ist im modernen Deutsch natürlich und legt weder wilde noch domestizierte Tiere fest.
- source_word: כָּל הָרֶמֶשׂ
  choice: alle Kriechtiere
  rationale: רֶמֶשׂ bezeichnet Tiere, die sich dicht am Boden bewegen. „Kriechtiere“ bewahrt die Kategorie der hebräischen Schöpfungs- und Fluterzählung, ohne sie auf die moderne zoologische Klasse der Reptilien zu verengen.
- source_word: וְכָל הָעוֹף
  choice: und alle Vögel
  rationale: עוֹף kann allgemein fliegende Geschöpfe bezeichnen; in dieser Aufzählung ist „Vögel“ die natürliche deutsche Wiedergabe.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: alles, was sich auf der Erde regt
  rationale: Das Partizip רוֹמֵשׂ bezeichnet hier umfassend die Bewegung der Landtiere. „Sich regen“ erhält den Zusammenhang mit רֶמֶשׂ, vermeidet aber die schwerfällige Wiederholung „Kriechtiere … alles, was kriecht“.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: nach ihren Familien
  rationale: מִשְׁפָּחָה bedeutet gewöhnlich „Familie“ oder „Sippe“. Die Wiedergabe bewahrt das Bild verwandtschaftlich geordneter Gruppen und ersetzt es nicht deutend durch „Arten“.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: gingen … aus der Arche hinaus
  rationale: יָצְאוּ bezeichnet das Hinausgehen; „aus der Arche hinausgehen“ ist idiomatisches modernes Deutsch und bewahrt die Bewegungsrichtung. „Arche“ ist die etablierte Bezeichnung für תֵּבָה in der Noah-Erzählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bilden die zusammenfassende Einschaltung des hebräischen Satzes übersichtlich ab. Die Wiederholung von „alle“ gibt die distributive Aufzählung wieder; die ungewöhnliche Familienbezeichnung bleibt bewusst erhalten und wird in der Fußnote erläutert.
