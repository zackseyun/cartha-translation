base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: de
  text: 'Und es geschah im sechshundertersten Jahr[a], im ersten Monat, am ersten Tag des Monats: Die Wasser waren von der Erde abgetrocknet. Noah entfernte die Abdeckung[b] der Arche und sah hin, und siehe: Die Oberfläche des Erdbodens war trocken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist dem Zusammenhang nach wahrscheinlich Noahs sechshunderterstes Lebensjahr; im Hebräischen bleibt der Bezug unausgesprochen.
    reason: contextual_clarification
  - marker: b
    text: 'Oder: „das Dach“. Das hebräische Wort bedeutet allgemein „Abdeckung“ und legt die Bauform nicht näher fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die geläufige deutsche Erzählformel wahrt den fortschreitenden Charakter des hebräischen Narrativs und bleibt würdevoll, ohne unnötig altertümlich zu wirken.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: im sechshundertersten Jahr
  rationale: Die ungewöhnliche hebräische Zahlenfolge bedeutet idiomatisch das 601. Jahr. Wessen Jahreszählung gemeint ist, bleibt wie im Vers selbst unausgesprochen.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: im ersten Monat, am ersten Tag des Monats
  rationale: Die elliptische Monatsangabe und die hebräische Datumsformel werden in natürlichem, eindeutigem Deutsch wiedergegeben.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: Da war das Wasser auf der Erde versiegt
  rationale: חרב bezeichnet hier das Austrocknen beziehungsweise Versiegen. Der deutsche Kollektivsingular „das Wasser“ ist idiomatisch; „auf der Erde“ gibt die räumliche Beziehung von מֵעַל verständlich wieder.
- source_word: וַיָּסַר
  choice: entfernte
  rationale: Die Hifil-Form von סור bedeutet „wegnehmen, entfernen“; „entfernte“ ist präzise und natürlich.
- source_word: מִכְסֵה הַתֵּבָה
  choice: die Abdeckung der Arche
  rationale: מִכְסֶה bezeichnet allgemein etwas, das bedeckt. „Abdeckung“ vermeidet die nicht zwingend im Wort enthaltene architektonische Festlegung auf ein Dach.
- source_word: וַיַּרְא וְהִנֵּה
  choice: und sah hin, und siehe
  rationale: „sah hin“ bringt Noahs gezielte Beobachtung zum Ausdruck; „siehe“ bewahrt die aufmerksamkeitslenkende und überraschende Kraft von הִנֵּה in gehobenem, aber verständlichem Erzählstil.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: Die Oberfläche des Erdbodens war trocken
  rationale: פְּנֵי bedeutet hier „Oberfläche“, und אֲדָמָה bezeichnet den Erdboden. Die Wiedergabe unterscheidet diesen konkreten Boden sinnvoll von הָאָרֶץ im vorigen Satz.
theological_decisions:
- issue: Bezug des sechshundertersten Jahres
  choice: Im Haupttext bleibt unausgesprochen, wessen Jahr gezählt wird.
  alternative: „im sechshundertersten Lebensjahr Noahs“
  rationale: Der Zusammenhang legt Noahs Lebensalter nahe, doch der hebräische Vers nennt Noah an dieser Stelle nicht als Bezugsgröße. Die Ergänzung wird daher nur in einer Fußnote erläutert.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Erzählton. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber durch Doppelpunkt und idiomatische Datumsangaben für heutige Leser geglättet. Das traditionelle „siehe“ bleibt erhalten, weil es die diskursive Funktion von וְהִנֵּה knapp und erkennbar wiedergibt.
