  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: de
  text: Und das Wasser ging immer weiter zurück bis zum zehnten Monat. Im zehnten Monat, am ersten Tag des Monats, wurden die Gipfel der Berge sichtbar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren die Gipfel der Berge zu sehen“ beziehungsweise „erschienen die Gipfel der Berge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Das morphologisch plurale hebräische מַיִם wird im modernen Standarddeutsch als Stoffbezeichnung gewöhnlich mit dem singularischen Kollektivum „Wasser“ wiedergegeben.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: ging immer weiter zurück
  rationale: Die Verbindung von היה mit den Infinitivi absoluti bezeichnet einen fortschreitenden, anhaltenden Vorgang. „ging immer weiter zurück“ gibt diesen durativen Verlauf natürlich wieder.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: bis zum zehnten Monat
  rationale: חֹדֶשׁ bezeichnet hier innerhalb der erzählerischen Zeitangabe den Monat.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Im zehnten Monat, am ersten Tag des Monats
  rationale: Die knappe hebräische Datumsformel wird zu einer im Deutschen klaren und üblichen Zeitangabe ergänzt.
- source_word: נִרְאוּ
  choice: wurden … sichtbar
  rationale: Der Nifal von ראה kann passiv oder inchoativ verstanden werden. „wurden sichtbar“ bewahrt diese Bedeutungsbreite weitgehend und bezeichnet das Hervortreten ins Blickfeld, ohne einen bestimmten Beobachter zu nennen.
- source_word: רָאשֵׁי הֶהָרִים
  choice: die Gipfel der Berge
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet topografisch aber die obersten Teile der Berge. „Gipfel“ ist im Deutschen die natürliche und prägnante Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „zehnten Monat“ und „Monat“ bleibt erhalten, da sie die formale Datumsstruktur des Hebräischen wiedergibt.
