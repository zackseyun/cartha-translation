id: GEN.8.20
reference: Genesis 8:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: de
  text: Dann baute Noah Yahweh einen Altar. Er nahm von allen reinen Tieren und von allen reinen Vögeln einige und brachte auf dem Altar Brandopfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: בנה bezeichnet hier schlicht das Bauen bzw. Errichten; „baute“ ist im Deutschen natürlich und präzise.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Die übliche und sachlich genaue Wiedergabe von מִזְבֵּחַ.
- source_word: לַיהוָה
  choice: Yahweh einen Altar
  rationale: Die Präposition ל kennzeichnet hier den Empfänger bzw. die Widmung des Altars; die deutsche Dativkonstruktion ist natürlich. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: מִכֹּל
  choice: von allen … einige
  rationale: 'Wörtlich steht „von jedem/allen“. Im Zusammenhang ist die Konstruktion partitiv: Noah nahm Exemplare aus jeder reinen Kategorie. „Einige“ macht dies verständlich, ohne zu behaupten, er habe sämtliche reinen Tiere geopfert.'
- source_word: הַבְּהֵמָה
  choice: Tieren
  rationale: בְּהֵמָה bezeichnet Landtiere, häufig besonders größere oder domestizierte Tiere. „Tiere“ ist hier eine klare, nicht unnötig verengende Wiedergabe.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: reinen
  rationale: טָהוֹר bezeichnet in diesem Opferzusammenhang kultisch reine Tiere und Vögel; „rein“ bewahrt den biblischen Fachgebrauch, ohne ihn im Haupttext auszudeuten.
- source_word: הָעוֹף
  choice: Vögeln
  rationale: עוֹף kann fliegende Lebewesen bezeichnen; im Opferkontext ist „Vögel“ die natürliche deutsche Wiedergabe.
- source_word: וַיַּעַל עֹלֹת
  choice: brachte … Brandopfer dar
  rationale: Die Hifil-Form von עלה mit עֹלֹת ist eine feste Opferformulierung. „Brandopfer darbringen“ gibt den kultischen Sinn idiomatisch wieder.
- source_word: בַּמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die Präposition ב bezeichnet hier den Ort der Opferdarbringung; „auf dem Altar“ entspricht dem deutschen Sprachgebrauch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen יהוה. „Yahweh“ macht den Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Partitiver Sinn von מִכֹּל
  choice: von allen … einige
  alternative: von allen reinen Tieren und von allen reinen Vögeln
  rationale: Die wörtlich knappere Alternative könnte auf Deutsch missverständlich so verstanden werden, als habe Noah sämtliche reinen Tiere genommen. Die gewählte Formulierung verdeutlicht die im Kontext naheliegende Auswahl, ohne einzelne Arten ausdrücklich in den Text einzutragen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die beiden aufeinanderfolgenden hebräischen Verbfolgen werden zur besseren deutschen Lesbarkeit auf zwei Sätze verteilt. Keine Fußnoten erforderlich; daher enthält der Haupttext auch keine Fußnotenmarker.
