  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: de
  text: Dann wartete er weitere sieben Tage[a] und sandte die Taube erneut aus der Arche hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann begann er eine weitere Wartezeit von sieben Tagen.“ Das hebräische Verb kann wörtlicher „beginnen“ bedeuten, bezeichnet hier im Zusammenhang aber idiomatisch das Warten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: wartete
  rationale: Mit der folgenden Zeitangabe bezeichnet das Verb hier idiomatisch das Warten bis zur nächsten Handlung; die wörtlichere Wiedergabe „begann“ wäre im Deutschen ohne Ergänzung missverständlich.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: noch einmal sieben Tage
  rationale: עוֹד und אֲחֵרִים kennzeichnen gemeinsam einen weiteren Zeitraum von sieben Tagen. „Noch einmal“ gibt diese Wiederholung natürlich wieder.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: ließ … erneut … hinausfliegen
  rationale: וַיֹּסֶף markiert die Wiederholung der Handlung; שַׁלַּח bezeichnet hier das Aussenden der Taube. Die deutsche Formulierung ist natürlich und wahrt die Richtung aus der Arche hinaus.
- source_word: הַיּוֹנָה
  choice: die Taube
  rationale: Der bestimmte Artikel verweist auf die bereits zuvor erwähnte Taube.
- source_word: מִן הַתֵּבָה
  choice: aus der Arche
  rationale: Im Sintflutbericht bezeichnet תֵּבָה die Arche; die Präposition מִן gibt den Ausgangspunkt der Bewegung an.
