source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: de
  text: Dann wartete er noch einmal sieben Tage und ließ die Taube hinaus. Sie kehrte nicht mehr zu ihm zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Dann wartete er
  rationale: Das Verb יחל bezeichnet hier im Erzählzusammenhang das Warten; „Dann“ gibt die fortschreitende Erzählfolge des וַ wieder.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: noch einmal sieben Tage
  rationale: Die Wendung bezeichnet einen weiteren Zeitraum von sieben Tagen. „Noch einmal“ gibt die Wiederholung natürlich und präzise wieder.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: und ließ die Taube hinaus
  rationale: שׁלח bedeutet „senden/fortschicken“. Im konkreten Zusammenhang des Aussendens aus der Arche ist „hinauslassen“ natürlich, ohne die Handlung als endgültige Freilassung zu überdeuten.
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: Sie kehrte nicht mehr zu ihm zurück
  rationale: Die verneinte Konstruktion יסף + Infinitiv mit abschließendem עוֹד drückt aus, dass die Taube fortan nicht wiederkehrte. „Nicht mehr … zurück“ ist im Deutschen idiomatisch und bewahrt den Aspekt des Aufhörens.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präpositionalfügung bezeichnet die Richtung zu Noah; das Subjekt bleibt im unmittelbaren Zusammenhang eindeutig.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Erzählsprache. Die feminine Verbform zum hebräischen Wort für „Taube“ wird im Deutschen natürlich mit „sie“ aufgenommen. Keine Fußnote ist nötig, da „nicht mehr … zurück“ die im Hebräischen angelegte Bedeutung der verneinten יסף-Konstruktion unmittelbar wiedergibt.
