  text: וַ/תָּבֹ֨א אֵלָ֤י/ו הַ/יּוֹנָה֙ לְ/עֵ֣ת עֶ֔רֶב וְ/הִנֵּ֥ה עֲלֵה זַ֖יִת טָרָ֣ף בְּ/פִ֑י/הָ וַ/יֵּ֣דַע נֹ֔חַ כִּי קַ֥לּוּ הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: de
  text: 'Und die Taube kam zur Abendzeit zu ihm[a], und siehe: Sie hatte ein frisch gepflücktes Olivenblatt im Schnabel[b]. Da wusste Noah, dass die Wasser von der Erde abgenommen hatten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kam zu ihm“; aus dem Zusammenhang geht hervor, dass die Taube zu Noah zurückkehrte.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet etwas Abgerissenes oder Abgepflücktes und deutet darauf hin, dass das Blatt frisch von einem lebenden Olivenbaum stammte.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zurückgegangen waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: kam … zu ihm zurück
  rationale: Das Verb בוא bedeutet wörtlich „kommen“; im Erzählzusammenhang ist jedoch eindeutig die Rückkehr der zuvor ausgesandten Taube gemeint. Die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: לְעֵת עֶרֶב
  choice: gegen Abend
  rationale: Gibt die Zeitangabe idiomatisch und nahe am hebräischen Ausdruck wieder.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Bewahrt die aufmerksamkeitslenkende, anschauliche Funktion des hebräischen Erzählmarkers.
- source_word: עֲלֵה זַיִת
  choice: Olivenblatt
  rationale: Die Verbindung bedeutet wörtlich „Blatt eines Olivenbaums“; „Olivenblatt“ ist die natürliche deutsche Entsprechung.
- source_word: טָרָף
  choice: frisch abgerissenes
  rationale: Das Wort bezeichnet etwas Abgerissenes oder Abgepflücktes und lässt erkennen, dass das Blatt erst kürzlich von einem lebenden Baum genommen worden war.
- source_word: בְּפִיהָ
  choice: in ihrem Schnabel
  rationale: Wörtlich steht „in ihrem Mund“. Bei einem Vogel ist „Schnabel“ im Deutschen die natürliche, sachlich entsprechende Bezeichnung; das Femininum nimmt die Taube auf.
- source_word: וַיֵּדַע נֹחַ
  choice: Da wusste Noah
  rationale: „Da“ führt Noahs aus dem Zeichen gewonnene Erkenntnis natürlich als nächsten Erzählschritt ein.
- source_word: קַלּוּ הַמַּיִם
  choice: das Wasser … zurückgegangen war
  rationale: Das Verb bezeichnet hier das Abnehmen oder Sinken der Flut. Der deutsche Singular „das Wasser“ ist bei einer Wassermasse idiomatisch, obwohl das Hebräische den Plural verwendet.
- source_word: מֵעַל הָאָרֶץ
  choice: auf der Erde
  rationale: 'In Verbindung mit „zurückgehen“ gibt diese Formulierung den räumlichen Sinn natürlich wieder: Das die Erde bedeckende Wasser hatte abgenommen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Anschaulichkeit. „Und siehe“ erhält bewusst den markierten hebräischen Erzählstil; „Schnabel“ ist gegenüber dem wörtlichen „Mund“ im Deutschen natürlich. Die Fußnoten stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
