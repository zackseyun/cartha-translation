lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw consecutivum führt die Erzählung zeitlich weiter; „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder. „sprach“ entspricht דבר und passt zum würdevollen Erzählstil.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den einen Gott und wird im Deutschen idiomatisch mit „Gott“ wiedergegeben.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu“ ist im Deutschen die übliche Verbindung mit „sprechen“.
- source_word: נֹחַ
  choice: Noah
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden Redeinhalt ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne das hebräische „indem er sagte“ unidiomatisch nachzubilden.
