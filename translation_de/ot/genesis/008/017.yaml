    rationale: Das Hebräische verwendet hier bewusst denselben Stamm für die Kategorie und ihre Fortbewegung. „Sich regen“ kann jede Bewegung bezeichnen und ist daher weniger genau. „Die auf der Erde kriechen“ bewahrt die Verbindung ohne den Sinn einzuengen.
  - severity: low
