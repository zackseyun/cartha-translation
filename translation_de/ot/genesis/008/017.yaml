    rationale: Die Formulierung „– von allem Fleisch die Vögel ...“ ist verständlich, wirkt aber im modernen Standarddeutsch holprig. Ein Doppelpunkt kennzeichnet die drei Gruppen als Erläuterung von „allem Fleisch“.
