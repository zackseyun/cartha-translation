  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: de
  text: 'Bring mit dir alle Lebewesen hinaus, die bei dir sind, von allem Fleisch: die Vögel, das Vieh und alle Kriechtiere, die auf der Erde kriechen, damit sie auf der Erde wimmeln[a], fruchtbar sind und sich auf der Erde vermehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich zahlreich ausbreiten“. Das hebräische Verb bezeichnet ein reiches Wimmeln oder Sich-Ausbreiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: alle Lebewesen
  rationale: חַיָּה bezeichnet hier umfassend lebende Geschöpfe und wird durch die nachfolgende Aufzählung näher bestimmt; „Lebewesen“ vermeidet eine Einengung auf Wildtiere.
- source_word: אֲשֶׁר אִתְּךָ
  choice: die bei dir sind
  rationale: Die schlichte Relativkonstruktion wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: מִכָּל בָּשָׂר
  choice: von allem Fleisch
  rationale: Die Wiedergabe bewahrt das im Sintflutbericht kollektiv für beseelte Geschöpfe gebrauchte hebräische Bild „Fleisch“, ohne es erklärend aufzulösen.
- source_word: בָּעוֹף
  choice: die Vögel
  rationale: עוֹף kann Flugtiere allgemein bezeichnen; in dieser Dreiergruppe ist „Vögel“ die natürliche und hinreichend weite deutsche Bezeichnung.
- source_word: וּבַבְּהֵמָה
  choice: das Vieh
  rationale: בְּהֵמָה bezeichnet besonders größere Land- und Nutztiere; „Vieh“ entspricht der üblichen Kategorie in Genesis und ist weiter als „Rinder“.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: und alle Kriechtiere, die sich … regen
  rationale: „Kriechtiere“ bezeichnet bodennah bewegte Kleintiere. Für das Partizip wird „sich regen“ gewählt, weil eine wörtliche Wiederholung mit „kriechen“ im Deutschen schwerfällig wäre, während die Bewegungsbedeutung erhalten bleibt.
- source_word: הוֹצֵא אִתָּךְ
  choice: Bring … mit dir hinaus
  rationale: 'Der Hifil-Imperativ von יצא hat kausative Bedeutung: Noah soll die Tiere hinausführen. Die deutsche Formulierung bewahrt zugleich das begleitende אִתָּךְ.'
- source_word: וְשָׁרְצוּ
  choice: damit sie … wimmeln
  rationale: שׁרץ bezeichnet zahlreiche, lebhafte Ausbreitung und greift die Schöpfungssprache auf. „Wimmeln“ erhält dieses kräftige Bild; „damit“ gibt den beabsichtigten Ausgang des Befehls wieder.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Im weltweiten Horizont nach der Flut bezeichnet אֶרֶץ hier die Erde; das Deutsche verwendet bei Ausbreitung und Vermehrung idiomatisch „auf der Erde“.
- source_word: וּפָרוּ וְרָבוּ
  choice: fruchtbar sind und sich … vermehren
  rationale: Die Wortwahl bewahrt den bewussten Anklang an den Schöpfungssegen in Genesis 1 und passt grammatisch in den deutschen Zwecksatz.
theological_decisions:
- issue: Anklang an den Schöpfungssegen nach der Flut
  choice: „wimmeln, fruchtbar sind und sich … vermehren“
  alternative: „sich ausbreiten und zahlreich werden“
  rationale: Die markante Schöpfungsterminologie signalisiert Erneuerung nach dem Gericht. Ihre Beibehaltung wahrt den literarisch-theologischen Zusammenhang, ohne ihn im Vers auszudeuten.
- issue: Kollektive Wendung מִכָּל בָּשָׂר
  choice: „von allem Fleisch“ beibehalten
  alternative: „von allen Arten von Geschöpfen“
  rationale: „Fleisch“ ist im Flutbericht eine theologisch und literarisch bedeutsame Sammelbezeichnung. Eine Auflösung in „Arten“ würde eine nicht ausdrücklich vorhandene taxonomische Aussage eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz bleibt als zusammenhängender Befehl mit Gedankenstrichen für die erläuternde Aufzählung erhalten. Die Schöpfungssprache wird erkennbar bewahrt; veraltete Formen und unnötige Fachsprache werden vermieden.
