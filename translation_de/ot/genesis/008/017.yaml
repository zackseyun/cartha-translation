  source_fidelity: Der Entwurf gibt den Imperativ הוֹצֵא, die umfassende Kategorie „alles Fleisch“, die drei Tiergruppen und die abschließenden Verben der Vermehrung insgesamt zuverlässig wieder. Bei הָרֶמֶשׂ הָרֹמֵשׂ wird die absichtliche Wiederaufnahme des hebräischen Wortstamms jedoch durch „Kriechtiere, die sich ... regen“ abgeschwächt; „sich regen“ ist weiter und weniger konkret als רֹמֵשׂ.
  naturalness: „von allem Fleisch die Vögel“ ist im Deutschen ohne klare Gliederung schwer lesbar. Ein Doppelpunkt macht die nachfolgende Spezifizierung verständlich. Die Wiederholung „Kriechtiere, die ... kriechen“ ist zwar markiert, in diesem würdigen biblischen Register jedoch verständlich und entspricht dem hebräischen Wortspiel.
  terminology: „Lebewesen“, „alles Fleisch“, „Vieh“, „wimmeln“, „fruchtbar“ und „sich vermehren“ sind passende moderne, zugleich bibelnah verständliche Wiedergaben. „Kriechtiere“ sollte auch im folgenden Relativsatz durch „kriechen“ aufgenommen werden.
