  text: וּ/בַ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָ֧ה וְ/עֶשְׂרִ֛ים י֖וֹם לַ/חֹ֑דֶשׁ יָבְשָׁ֖ה הָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: de
  text: Und im zweiten Monat, am siebenundzwanzigsten Tag des Monats, war die Erde trocken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war das Land trocken“. Das hebräische אֶרֶץ kann „Erde“, „Land“ oder „Boden“ bedeuten. Hier steht „Erde“, weil die Fluterzählung das Austrocknen in einem umfassenden, weltweiten Rahmen darstellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: Und im … Monat
  rationale: Die Verbindung aus ו und ב führt die nächste Zeitangabe in der Erzählfolge ein. „Und im“ bewahrt sowohl den Anschluss als auch den zeitlichen Rahmen.
- source_word: הַשֵּׁנִי
  choice: zweiten
  rationale: Das Ordinalzahlwort bestimmt „Monat“ näher; im Deutschen lautet die natürliche Form „im zweiten Monat“.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: am siebenundzwanzigsten Tag des Monats
  rationale: Die hebräische Datumsformel wird in idiomatischem modernem Deutsch präzise mit „am siebenundzwanzigsten Tag des Monats“ wiedergegeben.
- source_word: יָבְשָׁה
  choice: war … trocken
  rationale: Das Qal Perfekt, 3. Person feminin Singular, beschreibt hier den zu diesem Zeitpunkt bestehenden Zustand. „War trocken“ bewahrt den statischen Sinn, ohne ausdrücklich einen Vorgang zu formulieren.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“, „Land“ oder „Boden“ bedeuten. Im umfassenden Darstellungsrahmen der Fluterzählung passt „die Erde“ am besten; die echte lexikalische Alternative wird in der Fußnote offengelegt.
