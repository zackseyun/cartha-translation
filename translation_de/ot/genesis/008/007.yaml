  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: de
  text: Dann sandte er den Raben aus, und er flog immer wieder hinaus und zurück, bis das Wasser von der Erde verschwunden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Dann ließ er … hinaus
  rationale: Der Wayyiqtol führt die Erzählung fort. „Dann“ gibt die zeitliche Folge natürlich wieder; „hinauslassen“ bezeichnet hier idiomatisch das Aussenden des Vogels.
- source_word: הָעֹרֵב
  choice: den Raben
  rationale: Die bestimmte Form bezeichnet eindeutig einen Raben; dies ist die übliche und genaue deutsche Entsprechung.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: Er zog immer wieder hin und her
  rationale: Die Verbindung aus finitem Verb und Infinitivformen beschreibt eine fortgesetzte oder wiederholte Bewegung. „zog“ vermeidet den nicht ausdrücklich genannten Zusatz „flog“, während „immer wieder hin und her“ den iterativen Sinn natürlich wiedergibt.
- source_word: עַד
  choice: bis
  rationale: Die Konjunktion bezeichnet den zeitlichen Endpunkt der wiederholten Bewegung.
- source_word: יְבֹשֶׁת הַמַּיִם
  choice: das Wasser … ausgetrocknet war
  rationale: Nach עַד bezeichnet der Infinitiv von יבש den Zustand, mit dessen Eintritt die Bewegung endet. Das hebräische מַיִם ist formal pluralisch, wird im modernen Deutschen jedoch idiomatisch als Singular „Wasser“ wiedergegeben.
- source_word: מֵעַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Formulierung bewahrt die räumliche Vorstellung des Wassers über beziehungsweise auf der Erde; zusammen mit „ausgetrocknet“ ergibt sie einen natürlichen deutschen Satz.
