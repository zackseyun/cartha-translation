revisions:
- from: Dann ließ er den Raben hinaus. Er zog immer wieder hin und her[a], bis das Wasser auf der Erde ausgetrocknet war.
  to: Dann sandte er den Raben aus, und er flog immer wieder hinaus und zurück, bis das Wasser von der Erde verschwunden war.
  rationale: Die Revision bewahrt die wiederholte Bewegung sowie das ausdrücklich genannte Hinausgehen und Zurückkehren. „Flog“ ist bei einem Raben eine natürliche deutsche Bewegungsbeschreibung; die Fußnote hält die weniger spezifizierte hebräische Formulierung fest. „Von der Erde verschwunden“ gibt die räumliche Aussage idiomatisch wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: Die wiederholte Bewegung des Raben wird grundsätzlich zutreffend wiedergegeben. „Zog ... hin und her“ lässt jedoch das im Hebräischen ausdrücklich vorangehende Hinausgehen weniger deutlich erkennen. Zudem gibt „auf der Erde ausgetrocknet“ מֵעַל הָאָרֶץ („von/weg von der Erde“) räumlich weniger präzise wieder.
  naturalness: Die Vorlage ist verständlich, doch „der Rabe zog ... hin und her“ klingt für einen fliegenden Vogel leicht literarisch und weniger idiomatisch als eine Bewegungsbeschreibung mit „flog“. Die Wiederholung „hinaus und zurück“ bleibt dabei natürlich und spiegelt die hebräische Ausdrucksweise.
  terminology: „Rabe“, „Wasser“ und die narrative Einleitung sind angemessen. „Sandte ... aus“ ist eine direkte, moderne Entsprechung von וַיְשַׁלַּח. „Verschwunden war“ gibt im Deutschen idiomatisch wieder, dass das Wasser nicht mehr auf der Erde lag, ohne eine bestimmte physikalische Erklärung hinzuzufügen.
  issues:
  - severity: medium
    issue: Die Hauptübersetzung lässt das ausdrückliche „hinausgehen“ in וַיֵּצֵא יָצוֹא וָשׁוֹב nur indirekt erkennen.
    rationale: „Immer wieder hin und her“ vermittelt Wiederholung, aber nicht die Abfolge des Hinausgehens und Zurückkehrens. Eine Formulierung mit „hinaus und zurück“ bewahrt diese Struktur besser.
  - severity: low
    issue: „auf der Erde ausgetrocknet“ bildet מֵעַל הָאָרֶץ nicht optimal ab.
    rationale: Der hebräische Ausdruck bezeichnet das Verschwinden bzw. Wegtrocknen des Wassers von der Erde, nicht bloß dessen Zustand an einem Ort auf der Erde.
  revised_text: Dann sandte er den Raben aus, und er flog immer wieder hinaus und zurück, bis das Wasser von der Erde verschwunden war.
  revised_footnotes:
  - marker: a
    text: 'Wörtlicher: „und er ging hinaus, immer wieder hinaus und zurück“. Die hebräische Ausdrucksweise bezeichnet eine fortgesetzte oder wiederholte Bewegung.'
    reason: lexical_alternative
  revision_rationale: Die Revision bewahrt die wiederholte Bewegung sowie das ausdrücklich genannte Hinausgehen und Zurückkehren. „Flog“ ist bei einem Raben eine natürliche deutsche Bewegungsbeschreibung; die Fußnote hält die weniger spezifizierte hebräische Formulierung fest. „Von der Erde verschwunden“ gibt die räumliche Aussage idiomatisch wieder.
