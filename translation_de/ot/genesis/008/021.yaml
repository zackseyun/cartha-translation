  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: de
  text: 'Und der HERR roch den wohlgefälligen Duft. Da sagte der HERR zu sich selbst: »Nie wieder will ich den Erdboden um des Menschen willen verfluchen, denn das Sinnen des menschlichen Herzens ist von seiner Jugend an böse.[a] Nie wieder will ich alles Lebendige schlagen, wie ich es getan habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »obwohl das Sinnen des menschlichen Herzens von seiner Jugend an böse ist«.'
    reason: Das hebräische כִּי wird gewöhnlich kausal (»denn/weil«) verstanden, kann im Kontext jedoch auch konzessiv aufgefasst werden. Die Fußnote erhält diese mögliche Lesart, ohne sie gegenüber der syntaktisch naheliegenden kausalen Wiedergabe vorzuziehen.
lexical_decisions:
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: der beruhigende Duft
  rationale: Die Wortverbindung bezeichnet einen Duft, der beruhigt beziehungsweise besänftigt. Die Wiedergabe bleibt näher an der hebräischen Wortbildung als lediglich »angenehmer Duft«, ohne eine magische Wirkung des Opfers anzudeuten.
- source_word: אֶל־לִבּוֹ
  choice: zu sich selbst
  rationale: Wörtlich »zu seinem Herzen«; im Hebräischen bezeichnet das Herz auch den inneren Ort des Denkens und Entschlusses. Natürliches Deutsch gibt den inneren Ausspruch mit »zu sich selbst« wieder.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: das Sinnen des menschlichen Herzens
  rationale: יֵצֶר kann Gebilde, Neigung, Vorstellung oder Sinnen bezeichnen. »Sinnen« wahrt die innere Ausrichtung, ohne den Ausdruck auf einzelne Absichten oder eine feste Anlage zu verengen.
- source_word: מִנְּעֻרָיו
  choice: von seiner Jugend an
  rationale: Entspricht der zeitlichen Bedeutung des hebräischen Ausdrucks und vermeidet die stärkere, hier nicht ausdrücklich formulierte Aussage »von Geburt an«.
- source_word: לְהַכּוֹת
  choice: schlagen
  rationale: Das Verb bedeutet grundlegend »schlagen« und kann im Kontext tödliches Vernichten einschließen. Die formnahe Wiedergabe erhält die Verbindung zum Flutgericht.
theological_decisions:
- issue: Bedeutung von כִּי im Verhältnis zwischen menschlicher Bosheit und Gottes Zusage
  choice: obwohl
  alternative: denn/weil
  rationale: כִּי kann kausal oder konzessiv verstanden werden. Da dieselbe menschliche Bosheit zuvor das Gericht begründet (Gen 6,5), bringt »obwohl« die hier naheliegende Spannung zum Ausdruck. Eine Fußnote bewahrt die grammatisch mögliche kausale Lesart.
- issue: Gottes inneres Reden
  choice: zu sich selbst
  alternative: in seinem Herzen
  rationale: Die idiomatische Wiedergabe vermittelt einen inneren göttlichen Entschluss, ohne das hebräische Körperbild im Deutschen missverständlich wirken zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname wird entsprechend der deutschen Bibeltradition als HERR gesetzt. Die Satzstruktur bleibt gut vorlesbar; die zentrale Mehrdeutigkeit wird nicht stillschweigend beseitigt, sondern durch eine knappe Fußnote offengehalten.
