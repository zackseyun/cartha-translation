  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: de
  text: Dann schickte er die Taube von sich fort, um zu sehen, ob das Wasser von der Oberfläche des Erdbodens zurückgegangen war[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abgenommen hatte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von über dem Angesicht des Erdbodens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Dann ließ er … ausfliegen
  rationale: Das Wayyiqtol führt die Erzählung zeitlich weiter. Im Zusammenhang mit einem Vogel gibt die deutsche Wendung natürlich wieder, dass Noach ihn hinausschickte bzw. freiließ.
- source_word: הַיּוֹנָה
  choice: die Taube
  rationale: יוֹנָה bezeichnet eine Taube; diese geläufige Wiedergabe passt zum Kontext der Fluterzählung.
- source_word: מֵאִתּוֹ
  choice: von sich
  rationale: Die Form bezeichnet eine Bewegung von Noachs Person bzw. seiner Nähe weg. Die Wiedergabe bewahrt diese im Hebräischen ausdrücklich genannte Beziehung, ohne sie zu »aus der Arche« umzudeuten.
- source_word: לִרְאוֹת
  choice: um zu sehen
  rationale: Der Infinitiv von ראה bezeichnet den Zweck und wird unmittelbar und natürlich wiedergegeben.
- source_word: הֲקַלּוּ
  choice: ob … zurückgegangen war
  rationale: קלל bedeutet hier, dass die Flutwassermenge abgenommen hatte. »Zurückgegangen« ist im heutigen Deutsch für Wasser idiomatisch; »abgenommen« bleibt als nähere lexikalische Alternative möglich.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, wird מַיִם im modernen Standarddeutsch idiomatisch als singularisches Kollektivum »Wasser« wiedergegeben.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: von der Oberfläche des Erdbodens
  rationale: Die Wiedergabe vermittelt das räumliche Bild der hebräischen Wendung klar. אֲדָמָה meint hier den Boden bzw. die Landfläche, nicht den Planeten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch klar; die ungewöhnliche Angabe »von sich« wird wegen ihrer ausdrücklichen Präsenz im Hebräischen bewahrt. »Oberfläche des Erdbodens« gibt das hebräische Bild verständlich wieder.
