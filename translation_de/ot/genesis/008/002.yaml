  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: de
  text: Die Quellen der Tiefe und die Fenster des Himmels wurden verschlossen[a], und der Regen vom Himmel wurde zurückgehalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schleusen des Himmels“. Das hebräische Wort bezeichnet wörtlich Fenster oder Öffnungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und der Regen vom Himmel hörte auf“. Das hebräische Verb kann betonen, dass der Regen zurückgehalten wurde und deshalb aufhörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: wurden verschlossen
  rationale: Das Nifal bezeichnet ein Verschlossen- oder Zugemachtwerden. Die passive Form entspricht dem Hebräischen und lässt sich natürlich auf beide Subjekte beziehen.
- source_word: מַעְיְנֹת
  choice: Quellen
  rationale: Bezeichnet hervorströmende Wasserquellen. „Quellen“ ist im modernen Deutschen natürlich und bewahrt das Bild unterirdischer Ursprünge des Wassers.
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: Bewahrt den kosmologischen Ausdruck aus Genesis 1,2, ohne ihn durch „Meer“ oder eine mythologisch stärker gefärbte Bezeichnung einzuengen.
- source_word: אֲרֻבֹּת
  choice: Fenster
  rationale: Die Grundbedeutung ist „Fenster/Öffnungen“. „Fenster des Himmels“ erhält das hebräische Bild; „Schleusen“ ist eine verständliche, aber deutendere Alternative.
- source_word: הַשָּׁמַיִם
  choice: der Himmel / vom Himmel
  rationale: Der deutsche Singular „Himmel“ ist die natürliche Entsprechung in dieser kosmologischen Wendung und bewahrt zugleich die Wiederholung des hebräischen Ausdrucks.
- source_word: וַיִּכָּלֵא
  choice: wurde zurückgehalten
  rationale: Die Form bezeichnet, dass etwas zurück- oder abgehalten wird. Die Wiedergabe erhält diese Nuance stärker als das bloße Ergebnis „hörte auf“.
- source_word: הַגֶּשֶׁם
  choice: der Regen
  rationale: Die gewöhnliche und kontextgemäße deutsche Entsprechung.
- source_word: מִן הַשָּׁמָיִם
  choice: vom Himmel
  rationale: Bewahrt die Wiederholung von שָׁמַיִם und klingt im modernen Deutschen natürlicher als „von den Himmeln“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmologische Bildsprache und die Wiederholung von „Himmel“ bleiben erhalten; traditionelle, aber stärker deutende „Schleusen“ steht in der Fußnote.
