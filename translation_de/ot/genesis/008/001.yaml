  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: de
  text: Doch Gott erinnerte sich an Noah[a] und an alle wilden Tiere und alles Vieh, die bei ihm in der Arche waren. Und Gott ließ einen Wind über die Erde wehen[b], und das Wasser ging zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott dachte an Noah.“ Das hebräische „sich erinnern“ meint oft ein Erinnern, das sich in treuem Handeln auswirkt, nicht bloß ein Zurückdenken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten. Hier passt „Wind“ am besten zum Zusammenhang; möglicherweise klingt zugleich Genesis 1,2 an, wo vom Geist Gottes beziehungsweise von Wind über den Wassern die Rede ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: erinnerte sich an
  rationale: Bewahrt die hebräische Ausdrucksweise und ihren theologischen Nachklang. Im Erzählzusammenhang bezeichnet das Erinnern nicht bloßes Zurückdenken, sondern Gottes aufmerksames, treues Handeln zugunsten Noahs.
- source_word: כָּל הַחַיָּה
  choice: alle wilden Tiere
  rationale: חַיָּה bezeichnet hier im Gegensatz zu בְּהֵמָה die wild lebenden Tiere; die Unterscheidung des hebräischen Begriffspaars bleibt erhalten.
- source_word: כָּל הַבְּהֵמָה
  choice: alles Vieh
  rationale: בְּהֵמָה meint im Kontrast zu חַיָּה die domestizierten Tiere. „Vieh“ ist im Deutschen geläufig und sachlich passend.
- source_word: בַּתֵּבָה
  choice: in der Arche
  rationale: „Arche“ ist die etablierte und kontextuell eindeutige deutsche Wiedergabe von תֵּבָה in der Noaherzählung.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: ließ ... einen Wind ... wehen
  rationale: רוּחַ bezeichnet kontextuell am ehesten Wind. Die kausative Verbform wird natürlich durch „ließ ... wehen“ wiedergegeben.
- source_word: עַל הָאָרֶץ
  choice: über die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten; angesichts des umfassenden Horizonts der Fluterzählung ist „Erde“ hier angemessen.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: das Wasser ging zurück
  rationale: Die Wendung beschreibt das Nachlassen beziehungsweise Zurückgehen der Flut. Der deutsche Kollektivsingular „das Wasser“ klingt natürlich und gibt den Vorgang klar wieder.
- source_word: וַ
  choice: Doch / Da
  rationale: Das einleitende „Doch“ markiert den erzählerischen Wendepunkt vom Gericht zur Rettung; „Da“ verbindet die folgende Handlung flüssig mit Gottes Erinnern.
theological_decisions:
- issue: Anthropomorphe Redeweise „Gott erinnerte sich“
  choice: Die hebräische Wendung wird im Haupttext beibehalten.
  alternative: „Gott dachte an Noah“ oder „Gott wandte sich Noah zu“
  rationale: Die wörtliche Ausdrucksweise wahrt die literarische und theologische Spannung. Sie bedeutet im Kontext nicht, dass Gott Noah zuvor vergessen hatte, sondern leitet sein treues Eingreifen ein.
- issue: Bedeutung von רוּחַ
  choice: „Wind“ im Haupttext
  alternative: „Geist“ oder „Atem“
  rationale: Die unmittelbare Wirkung auf das Flutwasser spricht für die meteorologische Bedeutung „Wind“. Die mögliche Anspielung auf Genesis 1,2 wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ hebt den erzählerischen Wendepunkt hervor, ohne zusätzlichen Sachinhalt einzutragen. Die traditionelle Bezeichnung „Arche“ bleibt erhalten; unnötig altertümliche Formulierungen werden vermieden.
