source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: de
  text: Solange die Erde besteht[a], werden Saat und Ernte, Kälte und Hitze, Sommer und Winter sowie Tag und Nacht nicht aufhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „noch alle Tage der Erde“ beziehungsweise „solange alle Tage der Erde währen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Solange die Erde besteht
  rationale: Die Wendung bezeichnet die gesamte weitere Dauer der Erde. Die idiomatische deutsche Formulierung gibt diesen zeitlichen Rahmen klar wieder; der wörtliche Ausdruck wird in der Fußnote bewahrt.
- source_word: זֶרַע
  choice: Saat
  rationale: Im Gegensatzpaar mit קָצִיר bezeichnet das Wort hier das Säen beziehungsweise die Saatzeit. „Saat und Ernte“ ist im Deutschen knapp, geläufig und würdig.
- source_word: קָצִיר
  choice: Ernte
  rationale: Dies ist die natürliche deutsche Entsprechung im landwirtschaftlichen Gegensatzpaar mit „Saat“.
- source_word: קֹר וָחֹם
  choice: Kälte und Hitze
  rationale: Die beiden Substantive bilden ein umfassendes Gegensatzpaar klimatischer Zustände; die direkte Wiedergabe erhält diese Struktur.
- source_word: קַיִץ וָחֹרֶף
  choice: Sommer und Winter
  rationale: Die üblichen deutschen Jahreszeitenbegriffe entsprechen dem Gegensatzpaar; die im levantinischen Klima mitklingenden Trocken- und Regenzeiten werden nicht unnötig in den Text eingetragen.
- source_word: יוֹם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Das feste Gegensatzpaar bezeichnet den fortlaufenden Tagesrhythmus und wird im Deutschen ebenso knapp wiedergegeben.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: werden nicht aufhören
  rationale: Das Verb שׁבת bedeutet hier „aufhören, aussetzen“. Da mehrere wiederkehrende Ordnungen Subjekt sind, ist die pluralische Zukunftsform sachgerecht und natürlich.
theological_decisions:
- issue: Reichweite und Dauer der Zusage über die Ordnungen der Schöpfung
  choice: Die regelmäßigen Abläufe dauern fort, solange die Erde besteht.
  alternative: Die Abläufe werden uneingeschränkt und in absoluter Ewigkeit fortbestehen.
  rationale: כָּל יְמֵי הָאָרֶץ setzt einen zeitlichen Rahmen, ohne näher zu bestimmen, wann oder wie dieser endet. Die Übersetzung bewahrt diese Begrenzung und macht keine weitergehende metaphysische Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, rhythmischem Satzbau. Die drei Gegensatzpaare werden parallel geführt; „sowie“ markiert lediglich das letzte Glied der Aufzählung, ohne die inhaltliche Gleichordnung aufzuheben.
