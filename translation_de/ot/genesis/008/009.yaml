- from: Doch die Taube fand keinen Ruheplatz für ihre Fußsohle[a]. Da kehrte sie zu ihm zur Arche zurück, denn das Wasser lag noch auf der Oberfläche der ganzen Erde. Er streckte seine Hand aus, nahm sie und holte sie zu sich in die Arche.
  to: Doch die Taube fand keinen Ruheplatz für ihre Fußsohle[a]. Da kehrte sie zu ihm, zur Arche, zurück, denn das Wasser lag auf der Oberfläche der ganzen Erde. Er streckte seine Hand aus, nahm sie und brachte sie zu sich in die Arche.
  rationale: Die Revision entfernt die nicht ausdrücklich markierte zeitliche Ergänzung „noch“, ersetzt das weniger genaue „holte“ durch „brachte“ und gliedert die beiden Zielangaben bei der Rückkehr durch Kommas. Bedeutung, Register und die im Hebräischen enthaltenen Richtungsangaben bleiben erhalten.
