review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen hebräischen Elemente zutreffend wieder: fehlender Ruheplatz, Rückkehr zu Noah/zur Arche, Wasser auf der Oberfläche der ganzen Erde sowie Noahs Ausstrecken der Hand, Aufnehmen und Hineinbringen der Taube. Das ergänzende „noch“ hat jedoch keine unmittelbare lexikalische Entsprechung und sollte nicht in den Text aufgenommen werden. „Holte“ ist hier gegenüber וַיָּבֵא weniger genau als das neutrale „brachte“.'
  naturalness: Der Erzählton ist natürliches modernes Standarddeutsch. „Zu ihm zur Arche“ ist zwar verständlich, wirkt aber ohne Komma leicht gedrängt; die Kommasetzung macht die zwei im Hebräischen vorhandenen Zielangaben lesbarer.
  terminology: „Ruheplatz“, „Fußsohle“, „Arche“ und „Oberfläche der ganzen Erde“ sind passend. „Brachte sie zu sich in die Arche“ bewahrt beide Richtungsangaben des hebräischen Schlusssatzes in idiomatischem Deutsch.
  issues:
  - severity: low
    issue: „noch“ in „das Wasser lag noch auf der Oberfläche …“
    rationale: Das hebräische כִּי מַיִם עַל־פְּנֵי כָל־הָאָרֶץ beschreibt den bestehenden Zustand, enthält aber kein ausdrückliches „noch“. Der Kontext kann es nahelegen, doch der Übersetzungstext sollte die zusätzliche zeitliche Nuance nicht setzen.
  - severity: low
    issue: „holte sie zu sich in die Arche“
    rationale: וַיָּבֵא bedeutet hier „brachte (hinein)“. „Holen“ kann einen Vorgang des Herbeiholens nahelegen und ist daher weniger unmittelbar als „brachte“.
