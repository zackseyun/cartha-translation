source:
  edition: WLC
  text: וְ/לֹֽא מָצְאָה֩ הַ/יּוֹנָ֨ה מָנ֜וֹחַ לְ/כַף רַגְלָ֗/הּ וַ/תָּ֤שָׁב אֵלָי/ו֙ אֶל הַ/תֵּבָ֔ה כִּי מַ֖יִם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יָּבֵ֥א אֹתָ֛/הּ אֵלָ֖י/ו אֶל הַ/תֵּבָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: de
  text: Doch die Taube fand keinen Ruheplatz für ihre Fußsohle[a]. Da kehrte sie zu ihm, zur Arche, zurück, denn das Wasser lag auf der Oberfläche der ganzen Erde. Er streckte seine Hand aus, nahm sie und brachte sie zu sich in die Arche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die Sohle ihres Fußes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ
  choice: Ruheplatz
  rationale: Das Substantiv bezeichnet hier konkret einen Ort, an dem die Taube sich niederlassen und ruhen kann.
- source_word: לְכַף רַגְלָהּ
  choice: für ihre Fußsohle
  rationale: כַּף bezeichnet in Verbindung mit רֶגֶל die Fußsohle; die anschauliche hebräische Formulierung bleibt erhalten.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: Da kehrte sie zu ihm zur Arche zurück
  rationale: Die Wiedergabe bewahrt sowohl den Bezug auf Noah als auch das Ziel der Rückkehr, ohne bereits ein Hineingehen auszudrücken.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: das Wasser lag noch auf der Oberfläche der ganzen Erde
  rationale: „Auf der Oberfläche“ erhält das Bild von פְּנֵי; „noch“ verdeutlicht im Deutschen den aus dem Erzählzusammenhang gegebenen fortdauernden Zustand.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Er streckte seine Hand aus
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Wendung mit שׁלח und „Hand“.
- source_word: וַיִּקָּחֶהָ
  choice: nahm sie
  rationale: לקח bedeutet gewöhnlich „nehmen“ und bezeichnet hier knapp Noahs Aufnahme der Taube.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: holte sie zu sich in die Arche
  rationale: 'Die Formulierung gibt beide Richtungsangaben wieder: zu Noah selbst und hinein in die Arche.'
theological_decisions:
- issue: Umfang von כָל־הָאָרֶץ
  choice: der ganzen Erde
  alternative: des ganzen Landes
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Flutbericht und in Verbindung mit „Oberfläche“ ist „Erde“ die naheliegende Wiedergabe; die Übersetzung legt über den hebräischen Ausdruck hinaus keine zusätzliche geographische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Erzählfluss. Das konkrete Bild der Fußsohle und die beiden Richtungsangaben im Schlusssatz werden bewahrt.
