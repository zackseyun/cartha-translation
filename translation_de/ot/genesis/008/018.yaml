  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: de
  text: Da ging Noah hinaus, zusammen mit seinen Söhnen, seiner Frau und den Frauen seiner Söhne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da ging Noah hinaus
  rationale: Die hebräische Erzählform führt die Handlung als unmittelbare Folge des zuvor erteilten Befehls fort. „Da“ gibt diesen Zusammenhang im Deutschen natürlich wieder; „ging hinaus“ entspricht יָצָא in diesem Kontext.
- source_word: נֹחַ
  choice: Noah
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: וּבָנָיו
  choice: zusammen mit seinen Söhnen
  rationale: בָּנִים bezeichnet hier ausdrücklich die Söhne Noahs. „Zusammen mit“ bezieht das abschließende אִתּוֹ idiomatisch auf die gesamte Aufzählung.
- source_word: וְאִשְׁתּוֹ
  choice: seiner Frau
  rationale: Das Substantiv mit Suffix bedeutet wörtlich „seine Frau“. Nach „zusammen mit“ ist der Dativ im Deutschen erforderlich.
- source_word: וּנְשֵׁי בָנָיו
  choice: den Frauen seiner Söhne
  rationale: Dies bildet die hebräische Genitivverbindung genau und natürlich ab. „Schwiegertöchtern“ wäre sinngemäß, würde die Ausdrucksweise des Ausgangstextes aber stärker verändern.
- source_word: אִתּוֹ
  choice: zusammen mit
  rationale: Das hebräische „mit ihm“ steht am Ende der Aufzählung und umfasst alle Genannten. Im natürlichen Deutschen kann es vorangestellt werden, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdevolles Standarddeutsch. Die hebräische Reihenfolge der Familienmitglieder bleibt erhalten; das abschließende „mit ihm“ wird zur flüssigen deutschen Formulierung „zusammen mit“ vorgezogen.
