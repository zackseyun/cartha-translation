  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: de
  text: Das Wasser zog sich nach und nach von der Erde zurück[a], und am Ende von hundertfünfzig Tagen nahm es ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „gehend und zurückkehrend“. Die hebräische Wendung bezeichnet hier wahrscheinlich ein fortgesetztes, zunehmendes Zurückweichen des Wassers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: zog sich … zurück
  rationale: שׁוב bedeutet grundsätzlich „zurückkehren“ oder „umkehren“. Auf das Wasser bezogen gibt „sich zurückziehen“ die Bewegung idiomatisch und anschaulich wieder.
- source_word: מֵעַל הָאָרֶץ
  choice: von der Erde
  rationale: מֵעַל bezeichnet eine Bewegung von dem Bereich über beziehungsweise auf der Erde weg. „Von der Erde“ ist im Deutschen natürlich und lässt den räumlichen Bezug bestehen.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: nach und nach
  rationale: Die Verbindung zweier Infinitive beschreibt hier einen fortschreitenden Vorgang. „Nach und nach“ gibt diese progressive Bedeutung wieder, ohne im Deutschen irreführend eine wechselnde Hin-und-her-Bewegung nahezulegen.
- source_word: וַיַּחְסְרוּ
  choice: hatte es abgenommen
  rationale: חסר bezeichnet das Wenigerwerden des Wassers. Das Plusquamperfekt macht deutlich, dass die Abnahme bis zum genannten Zeitpunkt eingetreten war, und wahrt zugleich den Unterschied zum vorherigen Zurückweichen.
- source_word: מִקְצֵה
  choice: am Ende von
  rationale: Die zeitliche Wendung bezeichnet das Ende beziehungsweise den Ablauf des genannten Zeitraums. „Am Ende von“ bildet sie direkt ab.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: hundertfünfzig Tagen
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der hebräischen Kardinalzahl.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Hebräischen grammatisch pluralische „Wasser“ wird entsprechend dem üblichen deutschen Sprachgebrauch als kollektiver Singular behandelt. Die ungewöhnliche hebräische Bewegungsformel wird im Text verständlich wiedergegeben und in der Fußnote transparent gemacht.
