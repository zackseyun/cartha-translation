source:
  edition: WLC
  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: de
  text: Und im siebten Monat, am siebzehnten Tag des Monats, kam die Arche auf den Bergen von Ararat[a] zur Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Bergen von Ararat“. Gemeint ist ein Bergland beziehungsweise eine Gebirgsregion, nicht ausdrücklich ein einzelner Gipfel wie der heute so genannte Berg Ararat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: kam … zur Ruhe
  rationale: Das Wayyiqtol von נוח bezeichnet hier, dass die Arche einen Ruheplatz erreichte. „Kam zur Ruhe“ gibt den Vorgangscharakter natürlich wieder, ohne über den Text hinaus einen bestimmten mechanischen Ablauf zu behaupten.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: „Arche“ ist im Zusammenhang mit Noah die etablierte und sachlich eindeutige deutsche Entsprechung für תֵּבָה.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Die Zeitangabe mit ב wird im Deutschen idiomatisch mit „im“ wiedergegeben.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am siebzehnten Tag des Monats
  rationale: Diese Formulierung entspricht der hebräischen Datumsangabe präzise und in natürlichem Deutsch.
- source_word: עַל
  choice: auf
  rationale: Die lokale Präposition wird hier schlicht und unmittelbar mit „auf“ wiedergegeben.
- source_word: הָרֵי אֲרָרָט
  choice: den Bergen von Ararat
  rationale: הָרֵי ist eine Plural-Konstruktform. „Berge von Ararat“ bewahrt den Plural und bezeichnet das mit Ararat verbundene Bergland, ohne die Aussage auf einen einzelnen Gipfel einzuengen.
theological_decisions:
- issue: Geografischer Ausdruck הָרֵי אֲרָרָט
  choice: den Bergen von Ararat
  alternative: dem Berg Ararat
  rationale: Der hebräische Text verwendet ausdrücklich den Plural „Berge“. Die Übersetzung wahrt diese geografische Offenheit und übernimmt nicht die traditionell präzisierende Vorstellung eines einzelnen Berges.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der hebräischen Datumsfolge, bleibt aber flüssig; der Plural „Berge“ und der Vorgangscharakter von וַתָּנַח werden bewahrt.
