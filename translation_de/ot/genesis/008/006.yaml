  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: de
  text: Nach vierzig Tagen[a] öffnete Noah das Fenster der Arche, das er gemacht hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Am Ende von vierzig Tagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Relativkonstruktion kann sich sowohl auf das Fenster als auch auf die Arche beziehen. Im Deutschen bezieht sich „das“ auf das Fenster; möglich ist auch: „das Fenster der Arche, die er gemacht hatte“.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: nicht eigens wiedergegeben
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang ein. Im modernen Deutschen wird ihre Funktion natürlich durch den vorangestellten Zeitausdruck und das Präteritum vermittelt.
- source_word: מִקֵּץ
  choice: nach
  rationale: Die Verbindung bezeichnet den Zeitpunkt nach Ablauf einer Zeitspanne. „Nach“ ist im Deutschen idiomatisch; die wörtlichere Möglichkeit „am Ende von“ bleibt in der Fußnote erhalten.
- source_word: אַרְבָּעִים יוֹם
  choice: vierzig Tagen
  rationale: Die Kardinalzahl mit dem Substantiv bezeichnet schlicht eine Zeitspanne von vierzig Tagen.
- source_word: וַיִּפְתַּח
  choice: öffnete
  rationale: פתח bezeichnet hier das Öffnen des Fensters beziehungsweise der Fensteröffnung.
- source_word: חַלּוֹן
  choice: Fenster
  rationale: Das Substantiv bezeichnet gewöhnlich ein Fenster oder eine entsprechende Öffnung; „Fenster“ ist hier die naheliegende Wiedergabe.
- source_word: הַתֵּבָה
  choice: der Arche
  rationale: תֵּבָה ist in der Fluterzählung die übliche Bezeichnung für Noahs Arche.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er gemacht hatte
  rationale: Der Relativsatz bezieht sich grammatisch am naheliegendsten auf das Fenster; das Plusquamperfekt verdeutlicht, dass dessen Anfertigung vor dem Öffnen lag.
