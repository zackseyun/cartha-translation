source:
  edition: WLC
  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: de
  text: Geh aus der Arche hinaus, du und deine Frau, deine Söhne und die Frauen deiner Söhne mit dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Geh … hinaus
  rationale: Der maskuline Singularimperativ von יצא fordert Noah direkt auf, den umschlossenen Raum zu verlassen. „Geh … hinaus“ ist im Deutschen natürlich und wahrt die Bewegungsrichtung, ohne den Standort des Sprechers durch „Komm“ festzulegen.
- source_word: מִן הַתֵּבָה
  choice: aus der Arche
  rationale: מִן bezeichnet die Bewegung aus dem Inneren heraus; תֵּבָה wird in der Noaherzählung herkömmlich und sachgerecht mit „Arche“ wiedergegeben.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen nennt Noah ausdrücklich als erstes Glied der aufgezählten Gruppe und wird daher beibehalten.
- source_word: וְאִשְׁתְּךָ
  choice: und deine Frau
  rationale: אִשָּׁה bezeichnet mit Possessivsuffix in diesem Zusammenhang eindeutig Noahs Ehefrau.
- source_word: וּבָנֶיךָ
  choice: deine Söhne
  rationale: בָּנִים bezeichnet hier angesichts der parallel genannten Ehefrauen konkret die Söhne, nicht allgemein Kinder.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: und die Frauen deiner Söhne
  rationale: Die Wiedergabe folgt der hebräischen Formulierung wörtlich und bleibt zugleich klares, heutiges Deutsch. „Schwiegertöchter“ wäre sinngemäß möglich, aber weniger nah an der Ausdrucksweise des Ausgangstextes.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die abschließende Präpositionalgruppe bezeichnet die Begleitung Noahs und wird in ihrer hervorgehobenen Endstellung bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Aufzählung und das abschließende „mit dir“ bleiben erhalten, weil sie Struktur und Nachdruck des Hebräischen abbilden; „Geh“ vermeidet eine nicht ausdrücklich festgelegte deiktische Perspektive.
