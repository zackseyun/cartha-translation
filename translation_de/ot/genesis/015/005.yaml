  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: de
  text: 'Dann führte er ihn hinaus und sagte: »Blicke doch zum Himmel und zähle die Sterne, wenn du sie zählen kannst.« Und er sagte zu ihm: »So wird deine Nachkommenschaft[a] sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Same«. Das hebräische Substantiv steht im Singular, kann aber kollektiv die Nachkommen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: Dann führte er ihn hinaus
  rationale: Der Hifil von יצא bezeichnet das Hinausführen bzw. Bewirken des Hinausgehens; „führte … hinaus“ gibt die Bewegung und den kausativen Sinn natürlich wieder.
- source_word: הַבֶּט נָא
  choice: Blicke doch
  rationale: Der Imperativ fordert zum Schauen auf; נא wird hier durch das modal abtönende „doch“ wiedergegeben, das Aufforderung und Nachdruck natürlich verbindet.
- source_word: הַשָּׁמַיְמָה
  choice: zum Himmel
  rationale: Die Richtungsendung wird mit „zum“ ausgedrückt. Im Deutschen bezeichnet der kollektive Singular „Himmel“ hier natürlich den sichtbaren Himmelsraum.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: und zähle die Sterne
  rationale: ספר bedeutet in diesem Zusammenhang „zählen“; כּוֹכָבִים entspricht direkt „Sterne“.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: wenn du sie zählen kannst
  rationale: Die Bedingung stellt das Vermögen des Angesprochenen heraus und wird im modernen Deutsch knapp und vollständig wiedergegeben.
- source_word: כֹּה יִהְיֶה
  choice: So wird … sein
  rationale: Die Vergleichsformel wird nah am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: זַרְעֶךָ
  choice: deine Nachkommenschaft
  rationale: זֶרַע ist formal Singular, bezeichnet hier aber kollektiv die Nachkommen. „Nachkommenschaft“ bewahrt im Deutschen den kollektiven Singular besser als der explizite Plural „Nachkommen“.
theological_decisions:
- issue: Wiedergabe von זַרְעֶךָ in der abrahamitischen Verheißung
  choice: deine Nachkommenschaft
  alternative: dein Same; deine Nachkommen
  rationale: „Nachkommenschaft“ ist ein kollektiver Singular und lässt die im Hebräischen vorhandene Spannung zwischen grammatischem Singular und kollektiver Bedeutung bestehen. „Dein Same“ wäre formaler, wirkt im heutigen Deutsch jedoch missverständlich; „deine Nachkommen“ legt die Mehrzahl stärker fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und ohne altertümliche Verbformen gestaltet; „Blicke doch“ wahrt zugleich den gehobenen Erzählton und die Nuance von נא.
