base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: de
  text: 'Dann sagte er zu ihm: »Ich bin Jahwe, der dich aus Ur der Chaldäer herausgeführt hat, um dir dieses Land zu geben, damit du es in Besitz nimmst[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit du es erbst« oder »damit du es besitzt«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Dann sagte er zu ihm
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; »Dann« gibt diese Abfolge in natürlichem Deutsch wieder. אֵלָיו bezeichnet Abram als Adressaten.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Der im Hebräischen nominale Satz erfordert im Deutschen die Kopula »bin«. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: der dich … herausgeführt hat
  rationale: Das Relativpronomen bezieht sich auf Jahwe. Der Hifil von יצא bezeichnet das Herausführen aus einem Ort; das Perfekt entspricht hier idiomatischem Deutsch.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: aus Ur in Chaldäa
  rationale: כַשְׂדִּים bezeichnet die Chaldäer beziehungsweise ihr Gebiet. »Ur in Chaldäa« ist im Deutschen eine klare geografische Wiedergabe der hebräischen Verbindung.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: um dir dieses Land zu geben
  rationale: Der Infinitiv mit לְ drückt hier Ziel oder Absicht aus; »um … zu« bildet dies natürlich ab.
- source_word: לְרִשְׁתָּהּ
  choice: damit du es in Besitz nimmst
  rationale: ירשׁ kann je nach Zusammenhang »in Besitz nehmen«, »besitzen« oder »erben« bedeuten. Die gewählte Formulierung bezeichnet hier den tatsächlichen Erwerb des zugesagten Landes und bewahrt durch eine Fußnote die lexikalische Spannweite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Umschrift »Jahwe« macht den persönlichen Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירשׁ bei der Landverheißung
  choice: in Besitz nehmen
  alternative: erben
  rationale: Der Kontext betont, dass Abram das von Gott gegebene Land erhalten und besitzen soll. »Erben« bleibt möglich, könnte im heutigen Deutsch jedoch enger an einen Todesfall gebunden verstanden werden; die Alternative wird daher in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich natürlich formuliert; »herausgeführt« und »in Besitz nehmen« bewahren zugleich die prägenden Motive des hebräischen Textes.
