id: GEN.15.1
reference: Genesis 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: de
  text: 'Nach diesen Ereignissen erging das Wort Jahwes in einer Vision an Abram: „Hab keine Angst, Abram! Ich bin ein Schild für dich; dein Lohn wird sehr groß sein.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin dein Schild; dein Lohn ist überaus groß.“'
    reason: Das Hebräische ist knapp und ohne ausdrückliche Kopula. Daher sind sowohl „ein Schild für dich“ als auch „dein Schild“ sowie eine gegenwärtige oder zukünftige Wiedergabe der zweiten Aussage möglich.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die Wendung ist eine zeitliche Erzählformel. דְּבָרִים kann Worte, Dinge oder Begebenheiten bezeichnen; im Zusammenhang sind die zuvor berichteten Ereignisse gemeint.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die geläufige Offenbarungsformel und gibt den Gottesnamen ausdrücklich als Jahwe wieder.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: erging ... an Abram
  rationale: „Das Wort erging an“ ist im Deutschen eine natürliche, würdevolle Entsprechung der hebräischen Offenbarungsformel.
- source_word: בַּמַּחֲזֶה
  choice: in einer Vision
  rationale: מַחֲזֶה bezeichnet eine visionäre Offenbarung; der bestimmte Artikel wird hier im Deutschen idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die Funktion des hebräischen Infinitivs, die folgende Rede einzuleiten, wird im Deutschen natürlicher durch einen Doppelpunkt ausgedrückt.
- source_word: אַל תִּירָא
  choice: Hab keine Angst
  rationale: Gibt das Verbot in natürlichem, modernem Deutsch wieder, ohne den Sinn abzuschwächen.
- source_word: מָגֵן לָךְ
  choice: ein Schild für dich
  rationale: Bewahrt die hebräische Konstruktion mit לָךְ, statt sie vorschnell zu „dein Schild“ zusammenzuziehen.
- source_word: שְׂכָרְךָ
  choice: dein Lohn
  rationale: „Lohn“ deckt hier die Bedeutung von Vergütung, Belohnung oder Gegenleistung ab und bleibt im Deutschen knapp und verständlich.
- source_word: הַרְבֵּה מְאֹד
  choice: wird sehr groß sein
  rationale: Die hebräische elliptische, verblosen Aussage wird im promissorischen Zusammenhang mit einer zukünftigen Kopula natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Jahwe transliteriert, statt durch einen Titel ersetzt zu werden.
- issue: Bezug und Zeitwert von שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: dein Lohn wird sehr groß sein
  alternative: dein Lohn ist sehr groß; ich bin dein Schild, dein überaus großer Lohn
  rationale: 'Die Satzfolge legt zwei Aussagen nahe: Gott ist ein Schild für Abram, und Abrams Lohn ist beziehungsweise wird sehr groß. Wegen des Verheißungszusammenhangs steht im Haupttext das Futur; die grammatisch mögliche gegenwärtige Lesart wird in der Fußnote bewahrt.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Hab keine Angst“ ist bewusst gegenwärtig und direkt; „erging das Wort Jahwes“ wahrt den formellen Charakter der Offenbarungsformel.
