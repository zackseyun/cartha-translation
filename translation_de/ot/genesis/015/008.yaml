lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagte er“ gibt den Fortgang im modernen Deutschen natürlich wieder.
- source_word: אֲדֹנָי יֱהוִה
  choice: Herr Yahweh
  rationale: Die Anrede verbindet אֲדֹנָי („Herr“) mit dem Gottesnamen יהוה; „Herr Yahweh“ bildet beide Bestandteile transparent ab.
- source_word: בַּמָּה
  choice: woran
  rationale: Wörtlich „wodurch/aufgrund wovon“ fragt Abram nach einem erkennbaren Zeichen oder einer Grundlage der Gewissheit. Im Deutschen ist „woran soll ich erkennen“ idiomatisch und präzise.
- source_word: אֵדַע
  choice: soll ich erkennen
  rationale: Das Imperfekt in der Frage zielt darauf, wie Abram Gewissheit erlangen kann; „soll ich erkennen“ ist dafür natürlich, ohne die Art der Bestätigung vorwegzunehmen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Abram erkennen möchte.
- source_word: אִירָשֶׁנָּה
  choice: ich es in Besitz nehmen werde
  rationale: ירשׁ bezeichnet hier das Erlangen beziehungsweise Besitzen des zuvor genannten Landes. „In Besitz nehmen“ bewahrt den aktiven Bedeutungsanteil; die ebenfalls mögliche Wiedergabe „erben“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der zusammengesetzten Gottesbezeichnung אֲדֹנָי יֱהוִה
  choice: Herr Yahweh
  alternative: Herr, HERR; Herr, der HERR
  rationale: Die Wiedergabe nennt den Gottesnamen ausdrücklich und erhält zugleich die vorangestellte Anrede „Herr“, ohne beide hebräischen Bestandteile miteinander zu verschmelzen.
- issue: Bedeutung von ירשׁ im Zusammenhang der Landverheißung
  choice: in Besitz nehmen
  alternative: erben
  rationale: Beide Bedeutungen sind möglich. Der Haupttext betont den tatsächlichen Besitz des Landes; die Fußnote bewahrt die erbrechtlich-bundestheologische Nuance, ohne sie zur einzig möglichen Lesart zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und fragend; „woran soll ich erkennen“ klingt natürlich und bewahrt Abrams Bitte um eine erkennbare Bestätigung.
