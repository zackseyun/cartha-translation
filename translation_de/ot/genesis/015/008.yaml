  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: de
  text: 'Da sagte er: »Herr Yahweh, woran werde ich erkennen, dass ich es in Besitz nehmen werde?«[a]'
  philosophy: optimal-equivalence
