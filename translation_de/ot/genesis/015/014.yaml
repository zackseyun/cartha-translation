id: GEN.15.14
reference: Genesis 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: de
  text: Doch auch über das Volk, dem sie dienen werden[a], werde ich Gericht halten; danach werden sie mit großem Besitz[b] ausziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem sie als Sklaven dienen werden“. Das hebräische Verb bedeutet wörtlich „dienen“, bezeichnet hier im Zusammenhang aber erzwungenen Dienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit großem Reichtum“ beziehungsweise „mit vielen Gütern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Doch auch
  rationale: Die Verbindung führt den Gedanken fort und hebt zugleich den Gegensatz zur vorhergesagten Unterdrückung hervor.
- source_word: הַגּוֹי
  choice: das Volk
  rationale: גּוֹי bezeichnet hier die fremde Volks- und Staatsmacht; „Volk“ ist im Deutschen natürlich und wahrt die kollektive Bedeutung.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: dem sie dienen werden
  rationale: עבד bedeutet im Qal „dienen/arbeiten“. Die Formulierung bleibt nah am Wortlaut; dass es sich im Kontext um erzwungenen Dienst handelt, wird in der Fußnote erläutert.
- source_word: דָּן אָנֹכִי
  choice: werde ich Gericht halten
  rationale: Das Partizip דָּן mit dem ausdrücklichen Pronomen אָנֹכִי trägt im Kontext Zukunftsbedeutung und betont Gottes eigenes richterliches Handeln. „Gericht halten“ bewahrt den juristischen Sinn besser als das engere „bestrafen“.
- source_word: וְאַחֲרֵי כֵן
  choice: danach
  rationale: Die knappe zeitliche Angabe gibt die Abfolge natürlich und genau wieder.
- source_word: יֵצְאוּ
  choice: werden sie … ausziehen
  rationale: יצא bezeichnet das Hinausgehen; „ausziehen“ passt idiomatisch zum Verlassen eines Landes oder Herrschaftsbereichs.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: mit großem Besitz
  rationale: רְכוּשׁ meint Besitz, Habe oder Güter. „Großer Besitz“ bewahrt den konkreten Sachbezug, ohne ihn auf abstrakten Reichtum zu verengen.
theological_decisions:
- issue: Art des göttlichen Handelns am unterdrückenden Volk
  choice: Gericht halten
  alternative: bestrafen
  rationale: דָּן ist richterliche Sprache. Die gewählte Wiedergabe erhält den rechtlichen und moralischen Rahmen, ohne das Urteil vorschnell allein auf seine Strafwirkung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung betont mit „ich“ das ausdrücklich gesetzte אָנֹכִי. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
