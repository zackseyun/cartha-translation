  text: und die Amoriter, die Kanaaniter, die Girgaschiter und die Jebusiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: und / unübersetzter Akkusativmarker
  rationale: וְ führt die Aufzählung fort; אֶת kennzeichnet jeweils das bestimmte direkte Objekt und hat im Deutschen keine eigene lexikalische Entsprechung. Die wiederholte hebräische Reihung wird in natürlichem Deutsch durch Kommas und ein abschließendes „und“ wiedergegeben.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologisch singularische Volksname bezeichnet kollektiv das Volk; im Deutschen ist hier der Plural „Amoriter“ idiomatisch.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der hebräische kollektive Singular wird als deutscher pluralischer Volksname wiedergegeben.
- source_word: הַגִּרְגָּשִׁי
  choice: die Girgaschiter
  rationale: „Girgaschiter“ ist die geläufige deutsche Form des Volksnamens und entspricht dem kollektiv gebrauchten hebräischen Ethnonym.
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Der kollektiv gebrauchte hebräische Volksname wird im Deutschen idiomatisch im Plural wiedergegeben.
