  terminology: „zerteilte“, „Hälfte“ und „gegenüber“ treffen die rituell-konkrete, aber nicht weiter ausgedeutete Sprache. Es wird keine konfessionelle oder theologisch auslegende Zusatzbedeutung eingetragen. „Vögel“ gibt das kollektiv gebrauchte hebräische Singularwort im Kontext korrekt wieder.
