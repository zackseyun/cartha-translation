  source_fidelity: 'Der Entwurf gibt die Abfolge und die konkreten Handlungen des Hebräischen zuverlässig wieder: Abram bringt die in V. 9 genannten Tiere zu Gott, teilt sie in der Mitte, ordnet die Hälften einander gegenüber an und teilt die Vögel nicht. „ihm“ ist im unmittelbaren Kontext zutreffend auf Gott bezogen. Die explizite Nennung Abrams und „Tiere“ sind sinnvolle, kontextgestützte Verdeutlichungen.'
