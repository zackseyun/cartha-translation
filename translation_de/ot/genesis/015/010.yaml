base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: de
  text: Da holte Abram ihm alle diese Tiere, zerteilte sie in der Mitte und legte jeweils die eine Hälfte der anderen gegenüber. Die Vögel aber zerteilte er nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Da holte Abram ihm alle diese Tiere
  rationale: Das narrative וַיִּקַּח wird im Zusammenhang mit Gottes Aufforderung in Vers 9 idiomatisch als „holte“ wiedergegeben; לוֹ bezieht sich dabei am wahrscheinlichsten auf Gott. „Abram“ verdeutlicht im Deutschen das Subjekt, und „Tiere“ macht den Rückbezug von כָּל אֵלֶּה verständlich.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: zerteilte sie in der Mitte
  rationale: בתר bezeichnet das Zerteilen der Tiere; בַּתָּוֶךְ bedeutet wörtlich „in der Mitte“. Die konkrete Formulierung bewahrt das Bild, ohne den Bundesschluss im Vers erklärend auszudeuten.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: und legte jeweils die eine Hälfte der anderen gegenüber
  rationale: Die distributive Wendung אִישׁ ... רֵעֵהוּ wird natürlich mit „jeweils ... der anderen“ ausgedrückt. „Hälfte“ ergibt sich aus dem Zerteilen in der Mitte und beschreibt die räumliche Anordnung klar.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: Die Vögel aber zerteilte er nicht
  rationale: הַצִפֹּר steht als Kollektivbezeichnung und verweist auf die beiden in Vers 9 genannten Vögel; deshalb ist der deutsche Plural passend. Die vorangestellte Objektphrase und „aber“ bewahren den Kontrast.
theological_decisions:
- issue: Rituelle Sprache des Bundesschlusses
  choice: Die Tierhälften und ihre Anordnung werden konkret beschrieben, ohne die Bedeutung des Rituals in den Vers hineinzuerklären.
  alternative: Eine deutende Erweiterung wie „als Zeichen des Bundes“ oder eine feste Wendung wie „einen Bund schneiden“.
  rationale: Der hebräische Text schildert hier die Vorbereitung des Rituals. Die Übersetzung erhält dessen konkrete und spannungsvolle Bildsprache, ohne eine spätere theologische Erklärung vorwegzunehmen.
- issue: Bezug von לוֹ
  choice: „ihm“ mit Bezug auf Gott
  alternative: „für sich“ mit Bezug auf Abram
  rationale: Beides ist grammatisch erwägenswert, doch der unmittelbare Kontext von Vers 9, wo Gott Abram auffordert, die Tiere für ihn zu holen, stützt den Bezug auf Gott deutlich stärker.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax folgt dem Erzählfluss des Hebräischen, vermeidet jedoch unnötig wörtliche oder fachsprachliche Formulierungen. Der Name „Abram“ wird zur eindeutigen Subjektmarkierung ergänzt.
