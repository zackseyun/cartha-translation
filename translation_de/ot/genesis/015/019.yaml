  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: de
  text: die Keniter, die Kenasiter und die Kadmoniter[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name קַדְמֹנִי (qadmoni) hängt mit dem Wort für »Osten« beziehungsweise »östlich« zusammen. Da er hier in einer Liste von Völkern steht, wird er als Volksname »Kadmoniter« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Hebräisches Akkusativzeichen ohne eigene deutsche Entsprechung; die syntaktische Funktion ergibt sich aus dem übergeordneten Satz.
- source_word: הַקֵּינִי
  choice: die Keniter
  rationale: Der bestimmte, singularische Volksname bezeichnet kollektiv eine Volksgruppe; im Deutschen ist dafür der Plural üblich.
- source_word: וְאֶת
  choice: '[nur durch die Reihung wiedergegeben]'
  rationale: Die Konjunktion verbindet das zweite Glied der Aufzählung; im Deutschen wirkt eine asyndetische Reihung vor dem abschließenden »und« natürlich, während das Akkusativzeichen unübersetzt bleibt.
- source_word: הַקְּנִזִּי
  choice: die Kenisiter
  rationale: Kollektiver Volksname in einer Völkerliste; die etablierte deutsche Namensform im Plural wahrt seinen ethnonymischen Charakter.
- source_word: וְאֵת
  choice: und
  rationale: Die Konjunktion leitet das letzte Glied der Aufzählung ein; das Akkusativzeichen wird nicht gesondert übersetzt.
- source_word: הַקַּדְמֹנִי
  choice: die Kadmoniter
  rationale: Obwohl das Wort mit »Osten« beziehungsweise »östlich« zusammenhängt, fungiert es parallel zu den übrigen Bezeichnungen als Volksname.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die drei kollektiven Volksnamen stehen im deutschen Plural. Der Gedankenstrich wahrt den Fortgang der über mehrere Verse reichenden Aufzählung.
