  text: וַ/יֵּ֥רֶד הָ/עַ֖יִט עַל הַ/פְּגָרִ֑ים וַ/יַּשֵּׁ֥ב אֹתָ֖/ם אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: de
  text: Da kamen die Raubvögel auf die Tierkadaver herab[a], und Abram verscheuchte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da kam der Raubvogel auf die Tierkadaver herab.“ Das hebräische Substantiv steht im Singular, kann hier aber als Sammelbezeichnung für aasfressende Vögel verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: kamen … herab
  rationale: Das Verb ירד bezeichnet eine Abwärtsbewegung. „Kamen … herab“ gibt diese Bewegung im erzählenden Zusammenhang natürlich wieder.
- source_word: הָעַיִט
  choice: die Raubvögel
  rationale: Das formal singularische עַיִט kann kollektiv für aasfressende Raubvögel stehen. Der Plural ist im Deutschen hier am natürlichsten; eine Eingrenzung auf Geier wäre zu spezifisch.
- source_word: הַפְּגָרִים
  choice: die Tierkadaver
  rationale: פֶּגֶר bezeichnet einen Leichnam oder Kadaver. „Tierkadaver“ passt zu den zuvor geschlachteten Tieren und vermeidet das weniger genaue „Stücke“.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: verscheuchte sie
  rationale: Die Hifil-Form von שוב bedeutet hier, die Vögel zum Umkehren beziehungsweise Fortfliegen zu bringen. „Verscheuchte sie“ ist dafür eine prägnante, natürliche deutsche Wendung.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Name wird entsprechend der üblichen deutschen Bibeltradition wiedergegeben; an dieser Stelle heißt der Erzvater noch Abram.
theological_decisions: []
