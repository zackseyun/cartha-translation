  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: de
  text: 'Da sagte Abram: „Sieh doch, du hast mir keine Nachkommen[a] gegeben, und nun wird mich ein Sohn meines Hauses beerben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Samen“; hier ist damit Nachkommenschaft gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier: „Ein Sohn meines Hauses beerbt mich“; das hebräische Verb ist ein Partizip. Sinngemäß auch: „Ein Angehöriger meines Hauses wird mein Erbe sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Verbform führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: הֵן
  choice: Sieh doch
  rationale: Die Aufmerksamkeitspartikel hebt Abrams Einwand nachdrücklich hervor. „Sieh doch“ ist gegenwärtiges, verständliches Deutsch und bewahrt den appellativen Ton.
- source_word: לִי לֹא נָתַתָּה
  choice: du hast mir keine … gegeben
  rationale: Das Perfekt blickt auf Gottes Handeln bis zu Abrams gegenwärtiger Lage zurück; das deutsche Perfekt gibt die Klage idiomatisch wieder.
- source_word: זָרַע
  choice: Nachkommen
  rationale: Das wörtlich „Same“ bedeutende Kollektiv bezeichnet hier menschliche Nachkommenschaft. „Nachkommen“ ist im Deutschen natürlich und lässt offen, ob ein einzelner Sohn oder die weitere Linie im Blick steht.
- source_word: וְהִנֵּה
  choice: und nun
  rationale: Die zweite Aufmerksamkeitspartikel führt die daraus folgende, für Abram bedrückende Lage nachdrücklich vor Augen. „Und nun“ bildet diesen Übergang im modernen Deutschen natürlicher ab als das altertümliche „und siehe“.
- source_word: בֶן בֵּיתִי
  choice: ein Sohn meines Hauses
  rationale: Die bewusst nahe Wiedergabe erhält das familiäre Haushaltsbild des Hebräischen und legt nicht fest, ob damit ausdrücklich ein Sklave oder allgemeiner ein Hausangehöriger gemeint ist.
- source_word: יוֹרֵשׁ אֹתִי
  choice: wird mich … beerben
  rationale: Das Partizip bezeichnet den als Erben Eintretenden; das direkte Objekt „mich“ bleibt erhalten. „Mich beerben“ ist im Deutschen verständlich und bewahrt die knappe, leicht ungewöhnliche Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Sozialer Status des vorgesehenen Erben
  choice: „ein Sohn meines Hauses“ ohne nähere Statusbezeichnung
  alternative: „ein in meinem Haus geborener Sklave“ oder „ein Angehöriger meines Hauses“
  rationale: Der Vers nennt ausdrücklich weder einen Sklaven noch dessen Geburt im Haus. Die Übersetzung bewahrt daher die Formulierung des Textes und vermeidet eine aus dem Umfeld erschlossene Präzisierung.
- issue: Gegenstand des Erbens
  choice: „mich beerben“
  alternative: „mein Erbe sein“ oder „meinen Besitz erben“
  rationale: Das Hebräische setzt Abram selbst als direktes Objekt. Die gewählte Formulierung erhält diese Metonymie, ohne sie auf Besitz, Stellung oder Linie zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ wahrt den eindringlichen Ton, ohne das heute altertümlich wirkende „siehe“ zu verwenden. „Sohn meines Hauses“ und „mich beerben“ bleiben bewusst nahe an der hebräischen Bild- und Satzstruktur; die Fußnoten erläutern die daraus entstehende Fremdheit, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
