id: GEN.15.18
reference: Genesis 15:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: de
  text: 'An diesem Tag schloss Jahwe mit Abram einen Bund[a] und sagte: »Deinen Nachkommen habe ich dieses Land gegeben, vom Fluss Ägyptens[b] bis an den großen Fluss, den Euphrat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schnitt … einen Bund«. Das ist eine hebräische Wendung für das Schließen eines Bundes und nimmt wahrscheinlich auf das Bundesritual im unmittelbaren Zusammenhang Bezug.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch übersetzt: »vom Bach Ägyptens« oder »vom Wadi Ägyptens«. Im Hebräischen steht »Fluss Ägyptens«; welche geografische Grenze genau gemeint ist, ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An diesem Tag
  rationale: Natürliche deutsche Wiedergabe der bestimmten Zeitangabe.
- source_word: כָּרַת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Die geläufige deutsche Wendung gibt das hebräische Idiom verständlich wieder; dessen wörtliche Bedeutung wird in Fußnote [a] bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְזַרְעֲךָ
  choice: deinen Nachkommen
  rationale: זֶרַע ist eine kollektive Singularbezeichnung; das deutsche »Nachkommen« kann die Gesamtheit der Nachkommenschaft bezeichnen und klingt im Kontext natürlich.
- source_word: נָתַתִּי
  choice: habe ich ... gegeben
  rationale: Das Perfekt bewahrt den Charakter der feierlichen göttlichen Zusage als sicher gewährte Gabe, ohne sie als bloße Gegenwartsaussage umzudeuten.
- source_word: מִנְּהַר מִצְרַיִם
  choice: vom Fluss Ägyptens
  rationale: נָהָר bedeutet gewöhnlich »Fluss«; die umstrittene geografische Identifizierung wird in Fußnote [b] kenntlich gemacht.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: bis an den großen Fluss, den Euphrat
  rationale: Gibt die Grenzangabe und die appositionelle Benennung des großen Flusses klar und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, ohne einen Titel einzusetzen.
- issue: Aspekt der Landgabe in נָתַתִּי
  choice: habe ich ... gegeben
  alternative: gebe ich; gab ich
  rationale: Das hebräische Perfekt kann die im Bund zugesagte Gabe als feststehend darstellen. Das deutsche Perfekt erhält diese Spannung zwischen Zusage und sicherer Gewährung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung der Gottesrede hebt durch »Deinen Nachkommen« den Empfänger der Landzusage hervor. Die echten lexikalischen und geografischen Unsicherheiten werden in den Fußnoten offengehalten.
