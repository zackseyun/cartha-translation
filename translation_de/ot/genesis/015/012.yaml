base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: de
  text: Als die Sonne unterging, fiel ein tiefer Schlaf über Abram. Und siehe, ein großer, dunkler Schrecken fiel über ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein großer Schrecken der Finsternis“ oder „ein großer Schrecken und tiefe Dunkelheit“. Das Hebräische verbindet Schrecken und Dunkelheit in einer knappen, bildstarken Wendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Als die Sonne unterging
  rationale: Die Konstruktion leitet den zeitlichen Hintergrund ein; בוא in Verbindung mit der Sonne bezeichnet ihr Sinken beziehungsweise den nahenden Sonnenuntergang. Das deutsche Präteritum gibt den Verlauf natürlich wieder.
- source_word: תַרְדֵּמָה
  choice: ein tiefer Schlaf
  rationale: Das Substantiv bezeichnet einen ungewöhnlich tiefen Schlaf, der im Erzählzusammenhang von Gott bewirkt sein kann. „Tiefer Schlaf“ bleibt lexikalisch direkt, ohne ausdrücklich einen Trancezustand festzulegen.
- source_word: נָפְלָה עַל אַבְרָם
  choice: fiel über Abram
  rationale: Die Wendung נפל על beschreibt, wie ein Zustand jemanden überkommt. „Fiel über“ bewahrt das Bild und klingt im Deutschen bei „Schlaf“ natürlich und würdevoll.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf das Folgende. „Und siehe“ erhält diese dramatische Erzählfunktion und den gehobenen biblischen Ton.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: ein großer, dunkler Schrecken
  rationale: Die dicht gefügte hebräische Wortgruppe verbindet Schrecken, Dunkelheit und Größe. Die attributive Wiedergabe bewahrt diese Kompaktheit, ohne das Verhältnis zwischen Schrecken und Dunkelheit enger festzulegen.
- source_word: נֹפֶלֶת עָלָיו
  choice: fiel auf ihn
  rationale: Das Partizip zeichnet das Hereinbrechen anschaulich. Im natürlichen deutschen Erzählstil gibt das Präteritum die Handlung wieder, während „auf ihn“ das wiederholte Bild von נפל על erhält.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
theological_decisions:
- issue: Art des mit תַרְדֵּמָה bezeichneten Zustands
  choice: ein tiefer Schlaf
  alternative: ein tranceartiger Schlaf / eine Trance
  rationale: Obwohl der Zusammenhang offenbarungshaft ist, bezeichnet das Wort zunächst einen tiefen Schlaf. Eine ausdrückliche „Trance“ würde den Zustand stärker deuten, als der hebräische Ausdruck allein verlangt.
- issue: Verhältnis von Schrecken und Dunkelheit in אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: ein großer, dunkler Schrecken
  alternative: ein großer Schrecken der Finsternis
  rationale: Die hebräische Fügung ist grammatisch und bildlich verdichtet. Die gewählte Form bewahrt die Verbindung, ohne eindeutig zu entscheiden, ob die Dunkelheit den Schrecken näher bestimmt oder dessen Ursache beziehungsweise Begleitumstand ist.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. „Und siehe“ ist bewusst als literarischer Aufmerksamkeitsmarker erhalten. Die Wortstellung bleibt gut verständlich und wahrt zugleich die Bildsprache des Hebräischen.
