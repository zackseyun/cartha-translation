  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: de
  text: Und er glaubte dem HERRN[a], und der HERR rechnete es ihm als Gerechtigkeit an.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er vertraute auf den HERRN.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und der HERR rechnete es ihm als Gerechtigkeit zu“; auch: „und der HERR schrieb es ihm als Gerechtigkeit gut“.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Satz wird gewöhnlich so verstanden, dass der HERR Abrams Glauben als Gerechtigkeit anrechnete. Grammatisch wird seltener auch die Deutung vertreten, dass Abram das Subjekt von „rechnete an“ ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: Und er glaubte
  rationale: Der Hifil von אמן bezeichnet hier, jemandem Glauben zu schenken bzw. auf ihn zu vertrauen. „Glaubte“ ist im Deutschen direkt, verständlich und bewahrt die Verbindung zur späteren biblischen Aufnahme des Verses.
- source_word: בַּיהוָה
  choice: dem HERRN
  rationale: Bei אמן kann ב die Person bezeichnen, der man glaubt oder auf die man vertraut. „Dem HERRN glauben“ ist natürliches Deutsch; der Gottesname יהוה wird nach der vorgegebenen Konvention mit „der HERR“ wiedergegeben.
- source_word: וַיַּחְשְׁבֶהָ
  choice: und er rechnete es … an
  rationale: חשב bedeutet hier „anrechnen, zurechnen, als etwas ansehen“. Die Wendung „es ihm als Gerechtigkeit anrechnen“ gibt den Abrechnungs- bzw. Bewertungsaspekt idiomatisch wieder. „Es“ lässt den abstrakten Bezug auf Abrams Glauben bzw. Vertrauen unausgedeutet.
- source_word: לּוֹ
  choice: ihm
  rationale: ל mit Pronominalsuffix bezeichnet hier die Person, der etwas zugerechnet wird.
- source_word: צְדָקָה
  choice: als Gerechtigkeit
  rationale: צְדָקָה bezeichnet in diesem Zusammenhang Gerechtigkeit bzw. einen als gerecht geltenden Status. Die traditionelle und sachlich passende Wiedergabe bewahrt zugleich die kanonische Begriffskontinuität.
theological_decisions:
- issue: Subjekt von וַיַּחְשְׁבֶהָ („rechnete an“)
  choice: Das Pronomen „er“ bleibt im Haupttext stehen; nach der wahrscheinlichsten Lesart ist der HERR das Subjekt.
  alternative: Abram kann grammatisch als Subjekt verstanden werden.
  rationale: Der hebräische Text nennt das Subjekt des zweiten Verbs nicht ausdrücklich. Kontext und spätere biblische Aufnahme sprechen deutlich dafür, dass der HERR Abrams Glauben als Gerechtigkeit anrechnet. Die deutsche Formulierung bewahrt jedoch die formale Mehrdeutigkeit, während die Fußnote die wahrscheinlichste Deutung nennt.
- issue: Bezug des femininen Suffixes הָ in וַיַּחְשְׁבֶהָ
  choice: Wiedergabe mit dem neutralen Pronomen „es“, bezogen auf Abrams Glauben bzw. Vertrauen.
  alternative: Explizite Wiedergabe als „diesen Glauben“ oder „dieses Vertrauen“.
  rationale: Im Hebräischen kann das feminine Suffix auf den abstrakten Vorgang des Glaubens zurückweisen. „Es“ vermeidet, ein im Ausgangstext nicht ausdrücklich stehendes Substantiv einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Satzstruktur wird bewahrt. „HERR“ folgt der üblichen Wiedergabe des Gottesnamens; „Gerechtigkeit“ erhält die theologische und intertextuelle Begriffskontinuität, ohne den Vers erläuternd auszubauen.
