source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: de
  text: Und in der vierten Generation werden sie hierher zurückkehren; denn die Schuld der Amoriter[a] hat bis dahin[b] ihr volles Maß noch nicht erreicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „der Amoriter“ im Singular als Sammelbezeichnung für das Volk.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bis hierher“; zeitlich kann die Wendung „bis jetzt“ oder, vom angekündigten Zeitpunkt her gesehen, „bis dahin“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: Und in der vierten Generation
  rationale: דּוֹר bezeichnet eine Generation, רְבִיעִי ist das zugehörige Ordinaladjektiv. Die Präposition „in“ ist im Deutschen für die zeitliche Angabe erforderlich; „Und“ bewahrt den Anschluss an den vorherigen Satz.
- source_word: יָשׁוּבוּ
  choice: werden sie … zurückkehren
  rationale: שׁוּב bezeichnet hier die Rückkehr der Nachkommen Abrams in das Land. „Zurückkehren“ gibt sowohl die Bewegung als auch den Bezug auf den zuvor genannten Ausgangsort natürlich wieder.
- source_word: הֵנָּה
  choice: hierher
  rationale: Das deiktische Adverb bezeichnet bei einem Verb der Bewegung das Ziel. „Hierher“ ist im Deutschen genauer und natürlicher als das bloße „hier“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den genannten Zeitpunkt der Rückkehr ein. „Denn“ bewahrt diesen erklärenden Zusammenhang in würdigem, gegenwärtigem Deutsch.
- source_word: לֹא שָׁלֵם עֲוֹן
  choice: die Schuld … hat ihr volles Maß noch nicht erreicht
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus erwachsende Strafwürdigkeit bezeichnen; „Schuld“ lässt diese Bedeutungsbreite weitgehend offen. שָׁלֵם bezeichnet hier das Vollständig- oder Vollgewordensein. Die deutsche Wendung mit dem „vollen Maß“ gibt den Sinn natürlich wieder, ohne zu behaupten, im Hebräischen stehe ein eigenes Wort für „Maß“.
- source_word: הָאֱמֹרִי
  choice: der Amoriter
  rationale: Das hebräische Ethnonym steht morphologisch im Singular, wird hier jedoch kollektiv für die Volksgruppe gebraucht. Die deutsche Pluralbezeichnung passt zum Kontext; die Form „der Amoriter“ kann im Deutschen zugleich als Genitiv Plural gelesen werden.
- source_word: עַד הֵנָּה
  choice: bis dahin
  rationale: Wörtlich räumlich „bis hierher“, erhält die Wendung im zeitlichen Zusammenhang den Sinn „bis jetzt/bis dahin“. Da der Satz auf die künftige vierte Generation blickt, macht „bis dahin“ den Bezug im Deutschen verständlich; die deiktische Mehrdeutigkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Aufschub der Rückkehr und Gericht über die Amoriter
  choice: Die Rückkehr wird zeitlich damit begründet, dass die Schuld der Amoriter ihr volles Maß noch nicht erreicht hat.
  alternative: Den Aufschub ausdrücklich als göttliche Geduld mit den Amoritern oder vorrangig als Zeit zur Formung Israels in Ägypten auszulegen.
  rationale: Der Vers nennt die noch nicht voll gewordene Schuld der Amoriter als Grund, entfaltet aber keine umfassendere Lehre über Zweck oder Wesen des Aufschubs. Die Übersetzung belässt diese theologische Spannung.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Sünde, Vergehen oder Strafe für Schuld
  rationale: Der Kontext spricht von moralischer Verfehlung und ihrer Gerichtsreife. „Schuld“ hält den Zusammenhang zwischen bösem Handeln und Strafwürdigkeit offen, ohne die Bedeutung auf subjektives Schuldgefühl oder bereits vollzogene Strafe zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hierher zurückkehren“ ist bewusst idiomatisch und präzise; „ihr volles Maß noch nicht erreicht“ vermeidet die im Deutschen unnatürliche Formulierung „die Schuld ist nicht voll“, bewahrt aber das Bild der noch nicht eingetretenen Vollständigkeit. Das Semikolon verdeutlicht den engen Begründungszusammenhang.
