base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: de
  text: 'Und als die Sonne untergegangen war und es dunkel war, siehe: Ein rauchender Ofen[a] und eine flammende Fackel zogen zwischen diesen Stücken[b] hindurch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein rauchender Backofen“ beziehungsweise „ein rauchender Feuerbehälter“. Das hebräische Wort bezeichnet einen Ofen oder Behälter für Feuer.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die zuvor zerteilten Tierstücke des Bundesrituals (siehe 1. Mose 15,10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Und als … war
  rationale: Die Erzählungsform leitet den nächsten Vorgang ein; zusammen mit den folgenden Zustandsangaben ergibt sich im Deutschen natürlich ein temporaler Nebensatz.
- source_word: הַשֶּׁמֶשׁ בָּאָה
  choice: die Sonne untergegangen
  rationale: בוא bezeichnet bei der Sonne idiomatisch den Sonnenuntergang. „Untergegangen“ bewahrt das konkrete Bild und passt zum Vorzeitigkeitsverhältnis.
- source_word: וַעֲלָטָה הָיָה
  choice: Dunkelheit eingetreten war
  rationale: עֲלָטָה bezeichnet Dunkelheit oder Düsternis. Die Formulierung gibt den eintretenden nächtlichen Zustand klar wieder, ohne durch „tiefe“ oder „dichte“ unnötig zu verstärken.
- source_word: וְהִנֵּה
  choice: sieh
  rationale: הִנֵּה lenkt die Aufmerksamkeit nachdrücklich auf die nun sichtbar werdende Szene. „Sieh“ ist gegenwärtig verständlich und behält den feierlich-vividiven Charakter.
- source_word: תַנּוּר עָשָׁן
  choice: ein rauchender Ofen
  rationale: תַנּוּר bezeichnet einen Ofen beziehungsweise Feuerbehälter; „Ofen“ ist die direkte, historisch plausible Wiedergabe. עָשָׁן wird idiomatisch adjektivisch als „rauchend“ wiedergegeben.
- source_word: לַפִּיד אֵשׁ
  choice: eine flammende Fackel
  rationale: לַפִּיד bezeichnet eine Fackel; אֵשׁ hebt ihren Feuercharakter hervor. „Flammende Fackel“ ist natürliches Deutsch und bewahrt das Bild.
- source_word: אֲשֶׁר עָבַר
  choice: zogen … hindurch
  rationale: Der Relativsatz bezieht sich im Deutschen natürlich auf beide genannten Erscheinungen. Deshalb steht das Prädikat im Plural; „hindurchziehen“ gibt die Bewegung durch den Zwischenraum anschaulich wieder.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: zwischen diesen Stücken
  rationale: גְּזָרִים sind die zuvor zerteilten Tierstücke. „Stücke“ ist knapp und im Zusammenhang eindeutig; die demonstrative Bestimmung הָאֵלֶּה wird mit „diesen“ erhalten.
theological_decisions:
- issue: Wesen der Feuererscheinungen beim Bundesschluss
  choice: Die sichtbaren Erscheinungen werden beschrieben, ohne sie im Übersetzungstext ausdrücklich mit Gott gleichzusetzen.
  alternative: Den rauchenden Ofen und die flammende Fackel ausdrücklich als Erscheinung der Gegenwart des HERRN deuten.
  rationale: Der Zusammenhang legt eine göttliche Bundeserscheinung nahe, doch der hebräische Vers selbst benennt nur die sichtbaren Zeichen. Die beschreibende Wiedergabe wahrt diese theologische Spannung.
- issue: Singular des hebräischen Verbs עָבַר bei zwei genannten Erscheinungen
  choice: Im deutschen Haupttext steht aus grammatischen Gründen der Plural „zogen“.
  alternative: Mit einer singularischen oder umgestellten Konstruktion die beiden Bilder ausdrücklich als eine gemeinsame Erscheinung darstellen.
  rationale: Der hebräische Singular kann durch die Satzfügung beziehungsweise die Wahrnehmung der Erscheinung bedingt sein, legt aber ihre genaue Einheit nicht eindeutig fest. Natürliches Deutsch verlangt beim zusammengesetzten Subjekt den Plural; eine dogmatische Deutung wird daraus nicht abgeleitet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ bewahrt die feierliche Aufmerksamkeitsformel, ohne das altertümlichere „siehe“ zu erzwingen. Die Satzstruktur bleibt bildhaft und klar; interpretierende Identifikationen der Feuerzeichen werden vermieden.
