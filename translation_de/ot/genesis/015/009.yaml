source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: de
  text: 'Da sagte er zu ihm: »Bring mir eine dreijährige[a] junge Kuh, eine dreijährige Ziege, einen dreijährigen Widder, eine Turteltaube und eine junge Taube.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die dreimal verwendete hebräische Form wird hier traditionell als »dreijährig« verstanden; wörtlicher kann sie auch »dreifach« beziehungsweise »dreifältig« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Da sagte er zu ihm
  rationale: Die Wayyiqtol-Form führt das nächste Geschehen der Erzählung fort. »Da« gibt diese Abfolge natürlich wieder; אֵלָיו wird mit »zu ihm« direkt abgebildet.
- source_word: קְחָה לִי
  choice: Bring mir
  rationale: Wörtlich steht »Nimm für mich«. Im Zusammenhang soll Abram die genannten Tiere beschaffen und bereitstellen; »Bring mir« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: עֶגְלָה
  choice: junge Kuh
  rationale: Das Wort bezeichnet ein junges weibliches Rind. »Junge Kuh« ist allgemein verständlich und vermeidet den fachsprachlicheren Ausdruck »Färse«.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: dreijährig
  rationale: Die dreimal wiederholte Form wird in dieser Tierliste traditionell als Altersangabe verstanden. Die mögliche wörtlichere Vorstellung von »dreifach« wird in einer Fußnote offengehalten.
- source_word: עֵז
  choice: Ziege
  rationale: Das feminine Substantiv bezeichnet hier ein weibliches Tier; im Deutschen bezeichnet »Ziege« im Unterschied zum »Ziegenbock« üblicherweise das weibliche Tier.
- source_word: אַיִל
  choice: Widder
  rationale: Dies ist die übliche deutsche Bezeichnung für ein männliches Schaf.
- source_word: תֹר
  choice: Turteltaube
  rationale: Das Wort bezeichnet spezifisch eine Turteltaube und nicht nur allgemein eine Taube.
- source_word: גוֹזָל
  choice: junge Taube
  rationale: Das Wort kann allgemein einen Jungvogel bezeichnen. In der Verbindung mit der Turteltaube bezeichnet es hier am natürlichsten eine junge Taube, ohne die Art genauer als im Hebräischen festzulegen.
theological_decisions: []
