  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: de
  text: Du aber wirst in Frieden zu deinen Vätern gehen[a]; in gutem, hohem Alter wirst du begraben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinen Vorfahren“. Wörtlich steht im Hebräischen „zu deinen Vätern“, eine Redewendung für das Sterben und die Zugehörigkeit zu früheren Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt Abram gegenüber seinen zuvor genannten Nachkommen hervor. „Du aber“ gibt diesen Themenwechsel und Kontrast im Deutschen natürlich wieder.
- source_word: תָּבוֹא
  choice: wirst … gehen
  rationale: בוא bedeutet grundsätzlich „kommen“, bezeichnet hier aber zusammen mit „zu deinen Vätern“ idiomatisch Abrams Tod. Im Deutschen ist in dieser Verbindung „gehen“ natürlich und sachgerecht.
- source_word: אֶל אֲבֹתֶיךָ
  choice: zu deinen Vätern
  rationale: Die wörtliche familiäre Bildsprache des Hebräischen bleibt erhalten. Sie bezeichnet das Sterben und die Zugehörigkeit zu den früheren Generationen, ohne die Aussage auf den Ort der Bestattung zu verengen.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: 'Die knappe Wendung bewahrt das Bedeutungsspektrum von שָׁלוֹם: Frieden, Wohlergehen und Unversehrtheit.'
- source_word: תִּקָּבֵר
  choice: wirst du begraben werden
  rationale: Der Nifal von קבר bezeichnet hier eindeutig das Begrabenwerden; die deutsche Passivform entspricht Form und Sinn.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: in einem guten, hohen Alter
  rationale: שֵׂיבָה bezeichnet das graue beziehungsweise hohe Alter, טוֹבָה bewertet es positiv. Die Formulierung ist verständlich und bewahrt beide Aspekte.
theological_decisions:
- issue: Bedeutung von „zu deinen Vätern gehen“
  choice: Die überlieferte familiäre Todesformel wird wörtlich bewahrt und als Hinweis auf Abrams Tod und sein Eingehen zu den früheren Generationen verstanden.
  alternative: Die Wendung ausschließlich auf eine Bestattung bei den leiblichen Vorfahren beziehen oder als ausdrückliche Lehre über bewusste Gemeinschaft nach dem Tod auslegen.
  rationale: Abram wird nicht im Grab seiner unmittelbaren Vorfahren bestattet; daher reicht die Wendung über den bloßen Bestattungsort hinaus. Der Vers entfaltet jedoch keine nähere Lehre über den Zustand nach dem Tod. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klar und gut lesbar; die hebräische Todesformel wird beibehalten und durch eine knappe Fußnote erschlossen.
