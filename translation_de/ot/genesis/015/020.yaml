  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: de
  text: und die Hetiter und die Perisiter und die Refaïter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Riesen«. Das hebräische Wort Refaïm kann in manchen Zusammenhängen so verstanden werden; hier bezeichnet es jedoch wahrscheinlich eine Volksgruppe im Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: und
  rationale: Die Verbindung aus וְ und dem nicht eigens wiedergegebenen Objektmarker אֵת führt weitere Glieder der in den vorangehenden Versen begonnenen Völkerliste an. Im Deutschen wird sie natürlich mit »und« wiedergegeben; vor dem letzten Glied genügt ein weiteres »und«.
- source_word: הַחִתִּי
  choice: die Hetiter
  rationale: Das morphologisch singularische Gentiliz mit Artikel bezeichnet kollektiv ein Volk. Im Deutschen ist dafür die eingebürgerte plurale Volksbezeichnung »Hetiter« angemessen.
- source_word: הַפְּרִזִּי
  choice: die Perisiter
  rationale: Auch dieses singularische Gentiliz wird kollektiv gebraucht. »Perisiter« ist die geläufige deutsche Form für die Volksgruppe.
- source_word: הָרְפָאִים
  choice: die Refaïter
  rationale: Im Zusammenhang einer Liste von Völkern bezeichnet רְפָאִים am wahrscheinlichsten eine Volksgruppe. »Refaïter« gibt den Eigennamen in einer im Deutschen verständlichen Form wieder und vermeidet, die mögliche Deutung als »Riesen« in den Haupttext einzutragen.
theological_decisions:
- issue: Ob רְפָאִים als Volksname oder beschreibend wiederzugeben ist
  choice: Als Volksname »Refaïter«
  alternative: »Riesen«
  rationale: Genesis 15,19–21 zählt die Völker des Abram zugesagten Landes auf. Daher liegt hier die ethnische Bedeutung am nächsten. Die traditionelle Deutung »Riesen« bleibt als echte lexikalische Möglichkeit in einer Fußnote erhalten, ohne die Mehrdeutigkeit im Haupttext vorschnell aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die kollektiv gebrauchten hebräischen Gentilizia werden idiomatisch als deutsche Volksnamen im Plural wiedergegeben. Der Vers ist ein fortlaufendes Fragment der Völkerliste; die Zeichensetzung hält diesen Listencharakter fest.
