  verdict: revise
  source_fidelity: 'Die Aussage wird im Kern richtig wiedergegeben: Der zuvor gemeinte Mann wird nicht der Erbe Abrams sein; vielmehr wird es jemand sein, der aus Abrams Leib hervorgeht. Präziser ist jedoch die verbale Wiedergabe von יירשך als „dich beerben“ statt „dein Erbe sein“. Das bewahrt die direkte Objektbeziehung des Hebräischen und vermeidet die mögliche Lesart, der Betreffende sei selbst Abrams „Erbe“ im abstrakten Sinn. וְהִנֵּה sollte nicht durch das stärker adversative „Doch“ ersetzt werden; „Und siehe“ erhält die markierende Einleitung ohne zusätzliche logische Zuspitzung.'
  naturalness: „Dich beerben“ ist modernes, klares Standarddeutsch und passt in den würdevollen biblischen Registerton. Die Wiederholung am Satzende bildet die hebräische Antithese knapp und verständlich nach. „Und siehe“ ist hier als bewusst literarisch-biblische Markierung natürlich.
  terminology: „Das Wort des HERRN“ gibt דְבַר־יְהוָה angemessen wieder; die Kapitälchenform kennzeichnet den Gottesnamen. „Dieser“ bewahrt die Deixis von זֶה, ohne die im Hebräischen nicht ausdrücklich enthaltene Bezeichnung „Mann“ einzutragen. „Aus deinem Leib hervorgeht“ wahrt die körperliche Abstammungsmetapher, ohne die Person vorschnell als „Sohn“ zu bestimmen.
  issues:
  - severity: medium
    issue: „Doch da“ für וְהִנֵּה
    rationale: „Doch“ fügt einen ausdrücklicheren Gegensatz hinzu, als die einleitende Partikel selbst markiert. Der Kontext enthält zwar eine Gegenrede, aber „Und siehe“ gibt die hebräische Diskursmarkierung unmittelbarer wieder.
  - severity: medium
    issue: „dein Erbe sein“ für יִירָשְׁךָ / יִירָשֶׁךָ
    rationale: Das hebräische Verb bedeutet hier „dich beerben“. Die nominale Umschreibung ist verständlich, aber weniger direkt und kann semantisch diffuser sein.
  revised_text: 'Und siehe, das Wort des HERRN erging an ihn: »Dieser wird dich nicht beerben, sondern einer, der aus deinem Leib hervorgeht, wird dich beerben.«'
