  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: de
  text: 'Und siehe, das Wort des HERRN erging an ihn: »Dieser wird dich nicht beerben, sondern einer, der aus deinem Leib hervorgeht, wird dich beerben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Doch da
  rationale: Markiert den überraschenden göttlichen Einspruch und führt das neue Geschehen natürlich ein; ein wörtliches »und siehe« wäre im modernen Deutschen weniger idiomatisch.
- source_word: דְבַר יְהוָה
  choice: das Wort des HERRN
  rationale: Gibt die feste hebräische Wendung würdig wieder; HERR in Kapitälchenschreibweise vertritt den Gottesnamen JHWH.
- source_word: זֶה
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist im Kontext auf den zuvor erwähnten Hausangehörigen; die knappe Form bewahrt den deiktischen Charakter des Hebräischen.
- source_word: יִירָשְׁךָ / יִירָשֶׁךָ
  choice: dein Erbe sein
  rationale: Im Zusammenhang der Nachkommenschaft bezeichnet das Verb das Antreten des Erbes, nicht lediglich den Besitz eines einzelnen Gegenstands.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: einer, der aus deinem eigenen Leib hervorgeht
  rationale: Bewahrt das körperliche Abstammungsbild von מֵעִים, klingt zugleich in modernem Deutsch natürlich und legt nicht über den Text hinaus fest, auf welche Weise die Verheißung erfüllt wird.
theological_decisions:
- issue: Identität des verheißenen Erben
  choice: Allgemein als »einer, der aus deinem eigenen Leib hervorgeht« formuliert
  alternative: Explizit »dein eigener Sohn«
  rationale: Der hebräische Text betont leibliche Herkunft, nennt an dieser Stelle aber weder ausdrücklich »Sohn« noch den späteren Namen; die Übersetzung wahrt diese Progression.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Kennzeichnung macht den Eigennamen sichtbar, ohne eine bestimmte Rekonstruktion seiner Aussprache festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich; die Wiederholung von »dein Erbe sein« spiegelt die antithetische Struktur des Hebräischen.
