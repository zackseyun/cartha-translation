base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: de
  text: 'Doch Abram sagte[a]: »Herr Yahweh, was wirst du mir geben? Ich gehe kinderlos dahin, und der Erbe meines Hauses ist Eliëser aus Damaskus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht die ungewöhnliche und in ihrer genauen Bedeutung unsichere Wendung »Sohn des mescheq meines Hauses«. Sie kann möglicherweise »der Verwalter meines Hauses«, »der Besitzer meines Hauses« oder, wie im Text wiedergegeben, »der Erbe meines Hauses« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative wayyiqtol führt die Erzählung fort; »doch« gibt zugleich wieder, dass Abram auf die vorausgehende Verheißung mit einem Einwand beziehungsweise einer Sorge antwortet.
- source_word: אֲדֹנָי יֱהוִה
  choice: Herr Yahweh
  rationale: אֲדֹנָי ist der Hoheitstitel »Herr«, יֱהוִה der Gottesname. Die Wiedergabe bewahrt beide Bestandteile der Anrede und vermeidet die unnatürliche Doppelung »Herr HERR«.
- source_word: מַה תִּתֶּן לִי
  choice: was willst du mir geben?
  rationale: Das Imperfekt hat hier zukunftsbezogenen Sinn. Im Deutschen ist »was willst du mir geben?« eine natürliche Frage nach der noch ausstehenden Gabe, ohne ein Unvermögen Gottes anzudeuten.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: Ich gehe doch kinderlos dahin
  rationale: Die Formulierung bewahrt das Bild des gehenden Lebenswegs und gibt עֲרִירִי klar als »kinderlos« wieder. »doch« macht den begründenden beziehungsweise kontrastierenden Zusammenhang im Deutschen deutlich.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: der Erbe meines Hauses
  rationale: Die hebräische Wendung ist ungewöhnlich und in ihrer genauen Bedeutung unsicher. Im Zusammenhang bezeichnet sie offenbar den Mann, dem Abrams Haus zufallen würde; die Übersetzung bietet daher den wahrscheinlichsten Sinn, während die Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Eliëser aus Damaskus
  rationale: Die Wortgruppe identifiziert Eliëser am natürlichsten durch seine Herkunft oder Verbindung mit Damaskus. »Aus Damaskus« ist dafür im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יֱהוִה in der Anrede אֲדֹנָי יֱהוִה
  choice: Herr Yahweh
  alternative: Herr GOTT
  rationale: »Yahweh« gibt den im Ausgangstext stehenden Eigennamen wieder; »Herr« bewahrt zusätzlich den vorausgehenden Titel אֲדֹנָי.
- issue: Status Eliësers im Haus Abrams
  choice: der Erbe meines Hauses
  alternative: der Verwalter meines Hauses / der Besitzer meines Hauses
  rationale: Der unmittelbare Zusammenhang handelt von Abrams Kinderlosigkeit und der Nachfolge in seinem Haus. Weil die zugrunde liegende Wendung jedoch lexikalisch dunkel bleibt, werden andere mögliche Deutungen nicht dogmatisch ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. »dahingehen« erhält das hebräische Bild des Lebenswegs, ohne die Aussage ausdrücklich und damit stärker als der Ausgangstext auf Abrams Tod festzulegen. Die dunkle Wendung בֶן מֶשֶׁק wird im Haupttext verständlich und im Apparat transparent wiedergegeben.
