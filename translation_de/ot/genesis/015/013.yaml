  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: de
  text: 'Dann sagte er zu Abram: „Du sollst ganz gewiss wissen: Deine Nachkommen werden Fremde[a] in einem Land sein, das nicht ihr eigenes ist. Sie werden ihnen dienen, und man wird sie unterdrücken[b] – vierhundert Jahre lang.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet Menschen, die in einem Land leben, das nicht ihr eigenes ist; auch: „Beisassen“ oder „ansässige Fremde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie werden ihnen dienen, und sie werden sie unterdrücken.“ Die hebräischen Fürwörter nennen die beteiligten Gruppen nicht ausdrücklich. Die erste Aussage kann die Nachkommen als Dienende meinen; bei der Unterdrückung sind die Bewohner des fremden Landes als Handelnde naheliegend. Auch eine unpersönliche Wiedergabe ist möglich: „Man wird sie unterdrücken.“'
    reason: textual_ambiguity
  - marker: c
    text: Die Zeitangabe kann sich auf die gesamte vorausgesagte Fremdlings- und Dienstzeit beziehen oder enger auf die Unterdrückung.
    reason: scope_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Dann sagte er zu Abram
  rationale: Das narrative וַ führt die Handlung weiter. „Dann“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: יָדֹעַ תֵּדַע
  choice: Du sollst ganz gewiss wissen
  rationale: Der Infinitivus absolutus vor der finiten Form verstärkt die Aussage. Die Formulierung bewahrt Nachdruck und Gewissheit, ohne altertümlich zu klingen.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: זֶרַע ist hier ein kollektiver Singular. „Nachkommen“ ist im Deutschen natürlich und gibt den kollektiven Bezug verständlich wieder.
- source_word: גֵר יִהְיֶה
  choice: werden als Fremde leben
  rationale: גֵר bezeichnet Menschen, die ohne eigenes Heimatrecht in einem fremden Land wohnen. „Als Fremde leben“ ist verständlich und vermeidet eine zu eng gefasste moderne Rechtskategorie.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: in einem Land …, das ihnen nicht gehört
  rationale: Die Wendung bezeichnet ein Land, das nicht ihr Eigentum beziehungsweise nicht ihr eigenes Land ist. Die deutsche Relativsatzkonstruktion ist eng am Sinn und zugleich natürlich.
- source_word: וַעֲבָדוּם
  choice: Sie werden den Menschen dort dienen
  rationale: Das Qal von עבד mit Personen als Objekt bedeutet grundsätzlich „jemandem dienen“. Die pronominalen Bezüge werden für deutsches Verständnis vorsichtig als die Nachkommen und die Menschen des fremden Landes entfaltet, ohne den Dienst bereits lexikalisch auf „Versklavung“ zu verengen.
- source_word: וְעִנּוּ אֹתָם
  choice: und diese werden sie unterdrücken
  rationale: ענה im Piel bezeichnet hier bedrückende, demütigende Behandlung. „Unterdrücken“ ist im heutigen Deutsch klar und passt zum sozialen Kontext.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: vierhundert Jahre lang
  rationale: Die nachgestellte Zeitangabe nennt die Dauer. „Jahre lang“ macht ihre temporale Funktion im Deutschen deutlich, während eine Fußnote die mögliche Reichweite der Angabe offenhält.
theological_decisions:
- issue: Zuordnung der pluralischen Subjekte und Objekte in וַעֲבָדוּם וְעִנּוּ אֹתָם
  choice: Die Nachkommen dienen den Menschen des fremden Landes; diese unterdrücken anschließend die Nachkommen.
  alternative: Die Bewohner des Landes versklaven und unterdrücken die Nachkommen; oder die handelnden Unterdrücker bleiben unbestimmt.
  rationale: Die knappe hebräische Pronomenfolge lässt einen Subjektwechsel zu und wird traditionell als „sie werden ihnen dienen, und sie werden sie unterdrücken“ verstanden. Die Hauptübersetzung bildet diese syntaktische Abfolge verständlich ab; die Fußnote bewahrt die echte Mehrdeutigkeit.
- issue: Reichweite der Zeitangabe „vierhundert Jahre“
  choice: Die Zeitangabe bleibt am Satzende und wird nicht ausdrücklich allein auf die Unterdrückung beschränkt.
  alternative: Die vierhundert Jahre beziehen sich ausschließlich auf Versklavung und Unterdrückung.
  rationale: Aufgrund ihrer Endstellung kann die Zeitangabe grammatisch eng mit der Unterdrückung verbunden oder zusammenfassend auf die vorausgesagte Fremdlingszeit bezogen werden. Die Übersetzung entscheidet diese chronologische Frage nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Satz bewahrt den feierlichen Nachdruck des Hebräischen; die Hauptaussage bleibt für gewöhnliche Leser klar. Ungewohnte sozialrechtliche Fachwörter werden im Text vermieden und nur als Alternativen in der Fußnote genannt.
