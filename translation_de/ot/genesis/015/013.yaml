revisions:
- from: 'Dann sagte er zu Abram: „Du sollst ganz gewiss wissen: Deine Nachkommen werden als Fremde[a] in einem Land leben, das ihnen nicht gehört. Sie werden den Menschen dort dienen, und diese werden sie unterdrücken[b] – vierhundert Jahre lang.[c]“'
  to: 'Dann sagte er zu Abram: „Du sollst ganz gewiss wissen: Deine Nachkommen werden Fremde[a] in einem Land sein, das nicht ihr eigenes ist. Sie werden ihnen dienen, und man wird sie unterdrücken[b] – vierhundert Jahre lang.[c]“'
  rationale: Die Revision bewahrt die Bedeutung von עבד im Qal („dienen“) und vermeidet zugleich eine nicht ausdrücklich im hebräischen Text benannte Gruppe („die Menschen dort“) sowie einen festgeschriebenen Subjektwechsel. Das unpersönliche „man wird sie unterdrücken“ ist im modernen Deutsch idiomatisch und hält die im Ausgangstext knappe Referenz offen. Die Fußnote erläutert diese Entscheidung, ohne eine umstrittene syntaktische Rekonstruktion als sicheren Textsinn auszugeben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:23:11Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וַעֲבָדוּם als „den Menschen dort dienen“ trifft die Grundbedeutung des Qal von עבד besser als „versklaven“. Die explizite Einfügung „diese werden sie“ legt jedoch einen im Hebräischen nicht ausgedrückten Subjektwechsel und die konkrete Gruppe der „Menschen dort“ fest. Für וְעִנּוּ אֹתָם ist ein unpersönliches deutsches „man wird sie unterdrücken“ eine natürliche Weise, die im Kontext naheliegende, im knappen hebräischen Pronominaltext aber nicht näher bezeichnete Unterdrückergruppe wiederzugeben.
  naturalness: Der Satz ist insgesamt verständlich und würdevoll. Die Revision vermeidet die etwas künstliche und interpretativ stark festgelegte Folge „den Menschen dort dienen, und diese werden sie ...“. „Fremde sein“ ist für den Status von גֵר knapp und idiomatisch.
  terminology: „Nachkommen“, „Fremde“, „dienen“ und „unterdrücken“ sind moderne, sachgerechte Begriffe. „Beisassen“ ist als lexikalische Alternative möglich, aber historisch und heute wenig geläufig; die Fußnote kennzeichnet es ausreichend. Die Fußnote zu den Pronomina muss die syntaktische Unsicherheit präziser erklären und darf nicht behaupten, die Hauptfassung gebe eine wörtliche Form wieder, wenn sie den Subjektwechsel expliziert.
  issues:
  - severity: medium
    issue: Die Hauptfassung bestimmt mit „den Menschen dort“ und „diese“ die nicht ausgedrückten Referenten und den Subjektwechsel.
    rationale: Der hebräische Text nennt an dieser Stelle weder „Menschen“ noch „Bewohner des Landes“. Zwar ist die kontextuelle Deutung plausibel, doch die Übersetzung sollte die knappe, nicht völlig eindeutige Pronominalführung nicht stärker festlegen als nötig.
  - severity: low
    issue: Fußnote b beschreibt die Mehrdeutigkeit nicht ganz präzise.
    rationale: Die hebräische Verbform von עבד bedeutet hier zunächst „dienen“; die Unklarheit betrifft vor allem die Referenz der Pluralformen, insbesondere beim folgenden Verb „unterdrücken“, nicht eine gleichwertige lexikalische Lesart „versklaven“ für den Qal von עבד.
