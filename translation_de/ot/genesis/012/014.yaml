  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: de
  text: Als Abram nach Ägypten kam, sahen die Ägypter, dass die Frau[a] sehr schön war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ehefrau“. Das hebräische Wort אִשָּׁה kann sowohl „Frau“ als auch „Ehefrau“ bedeuten; hier bewahrt die Übersetzung die allgemeinere Formulierung des Satzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Als … kam
  rationale: Die Verbindung leitet den nächsten Erzählabschnitt ein und bezeichnet den Zeitpunkt. „Als Abram … kam“ ist natürliches modernes Deutsch und gibt die hebräische Konstruktion präzise wieder.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Das Richtungs-He bezeichnet die Bewegung auf Ägypten zu. Mit „nach Ägypten kam“ wird diese Richtung im Deutschen idiomatisch ausgedrückt.
- source_word: וַיִּרְאוּ
  choice: sahen
  rationale: ראה bedeutet hier schlicht „sehen“. Die Wiedergabe vermeidet die stärker deutende Alternative „bemerkten“.
- source_word: הַמִּצְרִים
  choice: die Ägypter
  rationale: Der bestimmte gentilizische Plural wird im Deutschen standardgemäß so wiedergegeben.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „Die Frau“ bewahrt hier die allgemeinere Formulierung des hebräischen Satzes und lässt die im Kontext bekannte eheliche Beziehung unausgesprochen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Ägypter sahen; der deutsche Inhaltssatz mit „dass“ ist natürlich und genau.
- source_word: יָפָה הִוא מְאֹד
  choice: dass die Frau sehr schön war
  rationale: יָפָה bezeichnet körperliche Schönheit, מְאֹד verstärkt das Adjektiv, und das selbstständige Pronomen הִוא wird im idiomatischen deutschen Satz durch das bereits genannte Subjekt aufgenommen.
