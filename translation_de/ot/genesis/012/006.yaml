source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: de
  text: Abram zog durch das Land bis zur Stätte von Sichem, bis zur Terebinthe von More[a]. Damals waren die Kanaaniter[b] im Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eiche von More“ beziehungsweise „großer Baum von More“. Das hebräische Wort bezeichnet einen großen Baum; die genaue Baumart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher nach der hebräischen Singularform: „der Kanaaniter“. Der singularische Volksname kann kollektiv das ganze Volk bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog durch
  rationale: Das Wayyiqtol von עבר schildert Abrams Weiterziehen durch das Land. „Zog durch“ ist im Deutschen natürlich und legt weder Route noch Reiseweise näher fest.
- source_word: בָּאָרֶץ
  choice: durch das Land / im Land
  rationale: Der bestimmte Ausdruck bezeichnet das im Zusammenhang gemeinte Land Kanaan. Die Wiederholung wird entsprechend der hebräischen Textstruktur beibehalten.
- source_word: עַד
  choice: bis zu
  rationale: Die zweimalige Präposition bezeichnet jeweils den erreichten räumlichen Endpunkt und wird in beiden Fällen parallel wiedergegeben.
- source_word: מְקוֹם שְׁכֶם
  choice: die Stätte von Sichem
  rationale: מְקוֹם bezeichnet einen Ort oder eine Stätte; die Formulierung wahrt die Verbindung mit Sichem, ohne vorauszusetzen, dass die später bekannte Stadt bereits vollständig entwickelt war.
- source_word: אֵלוֹן מוֹרֶה
  choice: die Terebinthe von More
  rationale: אֵלוֹן bezeichnet einen großen Baum, dessen genaue Art unsicher ist. „Terebinthe“ ist eine sachlich mögliche, in biblischem Deutsch verständliche Wiedergabe; die Artenunsicherheit wird in der Fußnote dokumentiert. More wird als Eigenname aufgefasst.
- source_word: וְהַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der bestimmte singularische Volksname wird kollektiv gebraucht. Der deutsche Plural gibt diese kollektive Bedeutung natürlich wieder; die formnähere Singularfassung steht in der Fußnote.
- source_word: אָז
  choice: damals
  rationale: Das Temporaladverb kennzeichnet die Verhältnisse zu jenem Zeitpunkt der Erzählung knapp und idiomatisch.
theological_decisions:
- issue: Numerus des Volksnamens וְהַכְּנַעֲנִי
  choice: 'kollektiver Plural: „die Kanaaniter waren damals im Land“'
  alternative: 'formnaher Singular: „der Kanaaniter war damals im Land“'
  rationale: Das Hebräische verwendet einen bestimmten singularischen Volksnamen, der kollektiv eine Volksgruppe bezeichnen kann. Der Plural ist im modernen Deutschen natürlicher, während die Fußnote die grammatische Form und die echte Übersetzungsalternative offenlegt.
- issue: Deutung von מוֹרֶה
  choice: Eigenname „More“
  alternative: appellativische Deutung wie „Lehrer“ oder „Weissager“
  rationale: Im Ortsausdruck אֵלוֹן מוֹרֶה ist More am besten als Eigenname beziehungsweise Ortsbezeichnung zu verstehen. Eine Bedeutungsübersetzung würde eine unsichere Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stätte“ bewahrt den örtlichen Charakter von מְקוֹם, ohne die spätere Stadtgestalt vorauszusetzen. Die Satzstruktur folgt der zweifachen Zielangabe des Hebräischen; „Damals“ vermeidet die im Deutschen schwerfällige Folge „nun … damals“.
