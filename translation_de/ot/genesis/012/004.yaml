  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: de
  text: Da ging Abram, wie Jahwe zu ihm geredet hatte, und Lot ging mit ihm. Abram war fünfundsiebzig Jahre alt, als er Haran verließ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das Wayyiqtol von הלך bezeichnet hier die einfache Fortbewegung in der Erzählfolge. „ging“ ist natürlich und fügt gegenüber „brach auf“ keinen zusätzlichen Akzent auf den Reisebeginn hinzu.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion bezeichnet die Übereinstimmung von Abrams Handeln mit Jahwes vorausgehendem Reden. „wie“ bewahrt dies knapp und idiomatisch; die Folgsamkeit ergibt sich aus dem Zusammenhang.
- source_word: דִּבֶּר אֵלָיו
  choice: zu ihm geredet hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Jahwes Reden Abrams Aufbruch vorausging. „reden zu“ gibt דבר würdig und quellenah wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Direkte und natürliche Wiedergabe der Präposition mit Pronominalsuffix.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: fünfundsiebzig Jahre alt
  rationale: Die hebräische Altersformel wird in gegenwärtigem Standarddeutsch idiomatisch wiedergegeben.
- source_word: בְּצֵאתוֹ מֵחָרָן
  choice: als er Haran verließ
  rationale: ב mit dem Infinitiv constructus bezeichnet den Zeitpunkt. „als er Haran verließ“ gibt den Ausgangspunkt und den zeitlichen Bezug natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Erzählstruktur. Das einleitende „Da“ bildet die fortlaufende wayyiqtol-Erzählung natürlich ab; unnötige Erläuterungen wurden vermieden.
