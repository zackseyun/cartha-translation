  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: de
  text: Ich werde dich zu einem großen Volk machen, dich segnen und deinen Namen groß machen, und sei ein Segen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du wirst ein Segen sein“. Die hebräische Form ist ein Imperativ („sei“), kann hier im Zusammenhang der göttlichen Verheißungen aber auch resultativ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: Ich werde dich zu einem großen Volk machen
  rationale: Die Konstruktion mit עשה und ל bezeichnet hier, dass Gott Abram zu einem großen Volk werden lässt beziehungsweise ihn als solches begründet. „Volk“ gibt גּוֹי im patriarchalischen Verheißungskontext natürlich wieder; „groß“ wahrt die direkte Aussage des Hebräischen.
- source_word: וַאֲבָרֶכְךָ
  choice: dich segnen
  rationale: ברך im Piel bedeutet hier eindeutig „segnen“. Das persönliche Objekt bleibt ausdrücklich erhalten; das Hilfsverb „werde“ wird im Deutschen aus dem ersten Glied mitverstanden.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: deinen Namen groß machen
  rationale: Die Wiedergabe hält sowohl גדל („groß machen“) als auch שֵׁם („Name“) sichtbar. „Name“ schließt Ansehen und Ruf ein, ohne die bildhafte und biblisch bedeutsame Ausdrucksweise auf diese Bedeutung zu verengen.
- source_word: וֶהְיֵה בְּרָכָה
  choice: und sei ein Segen
  rationale: וֶהְיֵה ist formal ein Imperativ der 2. Person Singular. „Sei“ bewahrt diesen Wechsel von Gottes Verheißungen zu Abrams Auftrag; „ein Segen“ gibt das indefinite Singularnomen בְּרָכָה idiomatisch wieder.
theological_decisions:
- issue: Aussagekraft von וֶהְיֵה בְּרָכָה
  choice: 'imperativisch: „und sei ein Segen“'
  alternative: 'resultativ beziehungsweise voraussagend: „und du wirst ein Segen sein“'
  rationale: Die hebräische Verbform ist ein Imperativ und soll im Haupttext nicht zu einer bloßen Vorhersage geglättet werden. Da der Satz jedoch in einer Reihe göttlicher Verheißungen steht, bleibt die resultative Deutung als echte Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung ist gegenüber einer mechanischen Wiederholung von „und ich werde“ leicht gestrafft. Das Semikolon markiert den rhetorischen Wechsel von den Verheißungen zum abschließenden Imperativ, während „und“ die hebräische Verknüpfung wahrt.
