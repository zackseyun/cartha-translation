  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: de
  text: Und Abram zog immer weiter zum Negev hin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Süden“. Das hebräische Wort kann sowohl die südliche Landschaft Negev als auch die Himmelsrichtung Süden bezeichnen; hier ist wahrscheinlich die Landschaft gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: zog … weiter
  rationale: Das Qal-Wayyiqtol von נסע bezeichnet hier das Aufbrechen und Weiterziehen. „zog weiter“ gibt die fortschreitende Reise natürlich wieder, ohne die Einzelheiten des Lagerabbruchs ausdrücklich einzutragen.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: immer weiter
  rationale: Die Verbindung der Infinitive beschreibt eine anhaltende beziehungsweise fortschreitende Bewegung. „immer weiter“ bewahrt diesen durativen Nachdruck in natürlichem modernem Deutsch, ohne das nicht ausdrücklich vorhandene „etappenweise“ einzuführen.
- source_word: הַנֶּגְבָּה
  choice: zum Negev hin
  rationale: Der Artikel und die Richtungsendung sprechen hier wahrscheinlich für die südliche Landschaft Negev als Zielrichtung. „zum Negev hin“ gibt sowohl den geografischen Bezug als auch die Bewegung in diese Richtung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Erzählungsdeutsch. Die Formulierung „immer weiter“ bildet den fortschreitenden Charakter der hebräischen Verbverbindung knapp und idiomatisch ab.
