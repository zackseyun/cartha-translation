id: GEN.12.13
reference: Genesis 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: de
  text: Sag doch, du seist meine Schwester, damit es mir deinetwegen[a] gut geht und ich durch dich am Leben bleibe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Ausdrücke, die hier mit „deinetwegen“ und „durch dich“ wiedergegeben sind, sind bedeutungsnah. Beide betonen, dass Abram von Sarais behaupteter Beziehung zu ihm günstige Behandlung und Sicherheit erwartet.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und meine Seele möge durch dich leben“. „Seele“ (hebräisch nefesch) bezeichnet hier Abrams Leben oder seine Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Sag doch
  rationale: Der feminine Singularimperativ von אמר richtet sich an Sarai; נָא mildert die Aufforderung zu einer dringlichen Bitte. „Doch“ gibt diese Nuance im heutigen Deutsch natürlich wieder.
- source_word: אֲחֹתִי אָתְּ
  choice: du seist meine Schwester
  rationale: Die indirekte Rede fügt sich im Deutschen natürlich an „Sag doch“ an. Der Konjunktiv kennzeichnet die von Sarai verlangte Aussage, ohne ihren Wahrheitsgehalt vorwegzunehmen.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion gibt den Zweck beziehungsweise das beabsichtigte Ergebnis knapp und idiomatisch wieder.
- source_word: יִיטַב לִי
  choice: es mir … gut geht
  rationale: Bewahrt die allgemeine hebräische Wendung „gut sein/gehen für jemanden“, ohne sie vorschnell auf eine bestimmte Art günstiger Behandlung einzuengen.
- source_word: בַעֲבוּרֵךְ
  choice: deinetwegen
  rationale: Gibt den kausalen Bezug auf Sarai in natürlichem Deutsch wieder.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: und ich … am Leben bleibe
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch Abrams Person beziehungsweise Leben; gemeint ist sein physisches Überleben, nicht eigens eine vom Körper getrennte Seele.
- source_word: בִּגְלָלֵךְ
  choice: durch dich
  rationale: Die zweite kausale Wendung wird von der ersten leicht unterschieden, während ihre enge Bedeutungsnähe erhalten bleibt.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: als Abrams Leben beziehungsweise Person wiedergegeben
  alternative: „meine Seele soll leben“
  rationale: Im Zusammenhang fürchtet Abram, getötet zu werden. Die idiomatische Wiedergabe vermeidet eine hier nicht geforderte anthropologische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Sag doch“ wahrt den bittenden Charakter; die indirekte Rede klingt natürlich und erhält zugleich die Distanz zur verlangten Behauptung.
