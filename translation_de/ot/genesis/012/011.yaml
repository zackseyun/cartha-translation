source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: de
  text: 'Als er im Begriff war, nach Ägypten hineinzuziehen, sagte er zu seiner Frau Sarai: »Sieh doch, ich weiß, dass du eine Frau von schönem Aussehen[a] bist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Frau, die schön anzusehen ist«; wörtlich: »schön von Ansehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet hier den zeitlichen Umstand der folgenden Rede ein. Im modernen Deutschen gibt ein einfacher temporaler Nebensatz die Funktion natürlich wieder, ohne das schwerfällige »Und es geschah, als …, da …«.
- source_word: הִקְרִיב לָבוֹא
  choice: kurz davor war, … zu kommen
  rationale: Der Hifil von קרב mit dem Infinitiv בוא bezeichnet die unmittelbare Annäherung an die bevorstehende Handlung.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Ägypten zu; mit »kommen« verlangt idiomatisches Deutsch »nach Ägypten«.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: seiner Frau Sarai
  rationale: Die natürliche deutsche Wortstellung bewahrt sowohl den Namen als auch die ausdrückliche Kennzeichnung Sarais als seine Frau.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das Folgende, während נָא die Äußerung hier gesprächsnah nuanciert. »Sieh doch« ist aktuell und nicht altertümlich.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Perfekt bezeichnet hier einen gegenwärtigen Wissensstand.
- source_word: אִשָּׁה יְפַת מַרְאֶה
  choice: eine Frau von schöner Gestalt
  rationale: Die Wendung beschreibt sichtbare Schönheit beziehungsweise ein schönes Erscheinungsbild. »Von schöner Gestalt« bleibt nahe an der attributiven hebräischen Konstruktion und klingt würdevoll.
- source_word: אָתְּ
  choice: du … bist
  rationale: Das selbstständige feminine Pronomen hebt Sarai als Angesprochene hervor; im Deutschen wird die Prädikation mit »bist« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte hebräische Erzählungsformel wird als natürlicher temporaler Satz wiedergegeben; die Bildlichkeit der Beschreibung von Sarais sichtbarer Schönheit bleibt erhalten.
