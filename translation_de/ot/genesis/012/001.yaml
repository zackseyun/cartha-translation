base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: de
  text: 'Yahweh sagte zu Abram: »Geh fort aus deinem Land, aus deiner Verwandtschaft und aus dem Haus deines Vaters in das Land, das ich dir zeigen werde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der ausdrücklich gebrauchte Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֶךְ־לְךָ
  choice: Geh fort
  rationale: Die idiomatische Verbindung bezeichnet die nachdrückliche Aufforderung, den bisherigen Ort zu verlassen; »Geh fort« ist natürlich und bewahrt den Aufbruchscharakter.
- source_word: מּוֹלַדְתְּךָ
  choice: deine Verwandtschaft
  rationale: Der Ausdruck kann Herkunft, Geburtsverband oder Sippe bezeichnen; im Kontext der gestuften Loslösung trifft »Verwandtschaft« den sozialen Bezug am besten.
- source_word: בֵּית אָבִיךָ
  choice: das Haus deines Vaters
  rationale: Die wörtliche Wendung bezeichnet sowohl den väterlichen Haushalt als auch die Großfamilie; die deutsche Form bewahrt diese Breite.
- source_word: אַרְאֶךָּ
  choice: ich dir zeigen werde
  rationale: Das Hifil von ראה mit Suffix bezeichnet, dass Yahweh Abram das Land sehen lassen beziehungsweise zeigen wird.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration wahrt diesen Unterschied gegenüber Titeln wie אֲדֹנָי.
- issue: Bedeutung von לֶךְ־לְךָ
  choice: Geh fort
  alternative: Geh für dich / Geh deinetwegen
  rationale: Die Dativform kann als idiomatische Verstärkung verstanden werden. Eine zusätzliche theologische oder motivationale Bedeutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die dreifache Herkunftsangabe bleibt in ihrer Steigerung erhalten: Land, Verwandtschaft, Vaterhaus. Die Satzverknüpfung וַיֹּאמֶר wird ohne ein künstliches einleitendes »Nun« wiedergegeben.'
