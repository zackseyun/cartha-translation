  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: de
  text: Als die hohen Beamten des Pharaos sie sahen, priesen sie sie beim Pharao[a], und die Frau wurde in das Haus des Pharaos gebracht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rühmten sie beim Pharao« beziehungsweise »empfahlen sie dem Pharao«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für »Haus« kann hier auch den königlichen Haushalt oder Hof bezeichnen, nicht nur das Gebäude.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: die hohen Beamten des Pharaos
  rationale: שָׂרִים bezeichnet hochgestellte Amtsträger, Fürsten oder Oberste. Im höfischen Zusammenhang ist »hohe Beamte« modernes, verständliches Deutsch und vermeidet die mögliche Fehlvorstellung, es handle sich um Söhne des Pharaos.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: priesen sie sie vor dem Pharao
  rationale: Das Piel von הלל bedeutet hier »preisen« oder »rühmend empfehlen«. »Vor dem Pharao preisen« gibt sowohl die positive Darstellung als auch den Adressaten natürlich wieder, ohne die Handlung stärker als ausdrückliche Empfehlung festzulegen.
- source_word: וַתֻּקַּח
  choice: wurde ... gebracht
  rationale: Die passive Verbform nennt keinen Handelnden und stellt die Frau als Objekt des Geschehens dar. Im Deutschen gibt »wurde gebracht« den Zielbezug des folgenden בֵּית klar und idiomatisch wieder; »wurde genommen« wäre zwar formnäher, klänge hier jedoch weniger natürlich.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text sagt ausdrücklich »die Frau«. Diese Wiedergabe vermeidet die kontextuell mögliche, aber lexikalisch nicht ausgedrückte Präzisierung »Ehefrau«.
- source_word: בֵּית פַּרְעֹה
  choice: in das Haus des Pharaos
  rationale: בַּיִת kann ein Gebäude, einen Haushalt oder ein Herrscherhaus bezeichnen. Die formnahe Wiedergabe »Haus des Pharaos« bewahrt diese Bedeutungsbreite; »Palast« wäre eine plausible, aber einengende Deutung.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: sie sahen
  rationale: ראה ist das gewöhnliche Verb für »sehen«; eine Erweiterung wie »sie betrachteten« ist nicht erforderlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. »Hohe Beamte« verdeutlicht den Rang der שָׂרִים; »Haus des Pharaos« bewahrt bewusst die Mehrdeutigkeit zwischen Residenz und königlichem Haushalt.
