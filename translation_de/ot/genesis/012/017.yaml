  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: de
  text: Doch Jahwe schlug den Pharao und sein Haus wegen Sarai, der Frau Abrams, mit schweren Plagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verbindet ein Verb mit der Bedeutung „schlagen/heimsuchen“ mit einem verwandten Substantiv, das „Schläge“, „Leiden“ oder „Plagen“ bedeuten kann. Auch möglich: „Jahwe suchte den Pharao und sein Haus mit schweren Leiden heim.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: schlug … mit … Plagen
  rationale: Das kausative Verb נגע bezeichnet hier das Zufügen eines schweren Übels. Zusammen mit dem stammverwandten Substantiv נְגָעִים gibt „schlug … mit … Plagen“ die eindringliche hebräische Formulierung verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Die etablierte deutsche Form des ägyptischen Herrschertitels.
- source_word: נְגָעִים גְּדֹלִים
  choice: schwere Plagen
  rationale: נְגָעִים kann Schläge, Leiden oder Plagen bezeichnen; גְּדֹלִים hebt hier ihre Schwere hervor. „Schwere Plagen“ ist im Erzählzusammenhang natürlich und prägnant.
- source_word: וְאֶת בֵּיתוֹ
  choice: und sein Haus
  rationale: „Haus“ bewahrt die Breite von בַּיִת, das hier den Haushalt beziehungsweise die Hausgemeinschaft des Pharaos bezeichnet.
- source_word: עַל דְּבַר
  choice: wegen
  rationale: Die Wendung nennt in diesem Zusammenhang den Anlass oder Grund der Plagen.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, der Frau Abrams
  rationale: Die Apposition identifiziert Sarai ausdrücklich als Abrams Frau; der deutsche Dativ folgt auf „wegen“ in natürlichem modernem Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben, ohne ihn durch den traditionellen Ersatztitel „der HERR“ zu verdecken.
- issue: Ursächlicher Bezug von עַל דְּבַר שָׂרַי
  choice: wegen Sarai
  alternative: wegen der Angelegenheit mit Sarai
  rationale: Der knappe Wortlaut benennt Sarai als Anlass der Plagen, legt aber nicht weiter aus, ob ihr Schicksal, ihre Wegnahme oder Abrams Täuschung im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den erzählerischen Gegensatz zum vorangehenden Wohlergehen Abrams. „Sein Haus“ erhält die im Hebräischen vorhandene Bedeutungsbreite und ist zugleich als Hausgemeinschaft verständlich.
