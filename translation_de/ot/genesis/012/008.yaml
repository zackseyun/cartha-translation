  naturalness: „Zog er weiter“, „ins Bergland“, „schlug sein Zelt auf“ und „rief den Namen Yahwehs an“ sind modernes, würdiges Standarddeutsch. „mit Bethel im Westen und Ai im Osten“ ist hier sowohl natürlicher als auch genauer als der konsekutive sodass-Satz.
  terminology: „Yahweh“ gibt יהוה konsistent als Eigenname wieder; „Altar“ und „den Namen Yahwehs anrufen“ sind sachgerecht. Die Fußnote bewahrt angemessen die mögliche Nuance des öffentlichen Verkündens.
