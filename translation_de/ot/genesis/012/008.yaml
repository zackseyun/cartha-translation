  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: de
  text: Von dort zog er weiter ins Bergland östlich von Bethel und schlug sein Zelt auf, mit Bethel im Westen und Ai im Osten. Dort baute er Yahweh[b] einen Altar und rief den Namen Yahwehs an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verkündete den Namen Yahwehs“. Die hebräische Wendung kann sowohl das Anrufen Yahwehs im Gottesdienst als auch das öffentliche Ausrufen seines Namens bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: zog er weiter
  rationale: Das Verb bezeichnet das Aufbrechen beziehungsweise Verlagern des Aufenthaltsortes. „Zog er weiter“ ist im deutschen Erzählstil natürlich und gibt die Bewegung wieder, ohne sie unnötig auszumalen.
- source_word: הָהָרָה
  choice: ins Bergland
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Berg- oder Hügelland hin. Im geografischen Zusammenhang ist „Bergland“ idiomatischer als ein einzelner „Berg“.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: östlich von Bethel
  rationale: קֶדֶם bezeichnet hier die Himmelsrichtung Osten und lokalisiert Abrams neuen Aufenthaltsort relativ zu Bethel.
- source_word: וַיֵּט אָהֳלֹה
  choice: schlug sein Zelt auf
  rationale: Die hebräische Wendung bezeichnet das Aufstellen eines Zeltes; die gewählte Formulierung ist die geläufige deutsche Entsprechung.
- source_word: מִיָּם
  choice: im Westen
  rationale: יָם bedeutet wörtlich „Meer“, dient aber bei geografischen Angaben häufig als Bezeichnung für den Westen, in Richtung des Mittelmeers.
- source_word: וְהָעַי מִקֶּדֶם
  choice: und Ai im Osten
  rationale: Die Formulierung bildet das Gegenstück zur Lage Bethels im Westen und beschreibt den Lagerplatz zwischen beiden Orten.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: Dies ist die etablierte und sachlich genaue deutsche Bezeichnung für eine Opfer- oder Kultstätte.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Eigenname יהוה wird als „Yahweh“ wiedergegeben, damit sein Charakter als Gottesname sichtbar bleibt.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: rief den Namen Yahwehs an
  rationale: Die Wiedergabe bewahrt den naheliegenden Sinn der gottesdienstlichen Anrufung und bleibt nahe an der hebräischen Wendung; die ebenfalls mögliche Bedeutung des öffentlichen Verkündens wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Yahweh“ gibt diesen als Namen wieder, während die traditionelle Wiedergabe „der HERR“ seinen Namenscharakter weniger unmittelbar erkennen lässt.
- issue: Bedeutung von וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: rief den Namen Yahwehs an
  alternative: verkündete den Namen Yahwehs
  rationale: Im Zusammenhang mit dem Altarbau liegt die Anrufung im Gottesdienst nahe. Da die Wendung auch öffentliches Ausrufen oder Verkünden bezeichnen kann, wird diese echte Bedeutungsbreite nicht verschwiegen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. „Bergland“ und die Richtungsangaben sind geografisch verständlich formuliert; der Gottesname bleibt als Eigenname erkennbar. Die Satzstruktur ist flüssig, ohne die knappe Abfolge des Hebräischen unnötig auszuschmücken.
