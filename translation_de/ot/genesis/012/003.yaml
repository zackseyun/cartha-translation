  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: de
  text: Und ich werde die segnen, die dich segnen; wer dich geringschätzt, den werde ich verfluchen.[a] Und in dir werden alle Familien der Erde gesegnet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „geringschätzt“ wiedergegebene hebräische Verb kann auch „entehrt“ oder „verflucht“ bedeuten. Es ist weniger stark als das folgende Verb „verfluchen“.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Durch dich werden alle Familien der Erde gesegnet werden.“ Die hebräische Form wird auch reflexiv oder medial verstanden, etwa: „In dir werden sich alle Familien der Erde segnen.“ Die Präposition kann außerdem instrumentale Bedeutung haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Und ich werde segnen
  rationale: Die Kohortativ-/Imperfektform der 1. Person Singular bringt hier Gottes Zusage zum Ausdruck; „ich werde segnen“ ist natürlich und bewahrt den Verheißungscharakter.
- source_word: מְבָרְכֶיךָ
  choice: die dich segnen
  rationale: Das substantivisch gebrauchte Partizip steht im Plural. Die deutsche Formulierung gibt diese Personengruppe klar und idiomatisch wieder.
- source_word: וּמְקַלֶּלְךָ
  choice: wer dich aber geringschätzt
  rationale: קלל kann bedeuten, jemanden gering zu achten, zu entehren oder zu verfluchen. „geringschätzt“ bewahrt den Bedeutungsunterschied zum stärkeren אָאֹר und gibt zugleich den hebräischen Singular wieder.
- source_word: אָאֹר
  choice: den werde ich verfluchen
  rationale: ארר ist das stärkere und eindeutige Verb für „verfluchen“. Die Korrelativkonstruktion „wer …, den …“ klingt im Deutschen natürlich und erhält die Hervorhebung des Betroffenen.
- source_word: וְנִבְרְכוּ
  choice: werden … gesegnet werden
  rationale: Der Nifal von ברך wird im Haupttext passiv wiedergegeben. Die mögliche reflexive beziehungsweise mediale Deutung wird in einer Fußnote offengehalten.
- source_word: בְּךָ
  choice: in dir
  rationale: Die Grundbedeutung der Präposition ב wird unmittelbar wiedergegeben; die ebenfalls mögliche instrumentale Nuance „durch dich“ wird in der Fußnote genannt.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: alle Familien der Erde
  rationale: מִשְׁפָּחוֹת bezeichnet Familien beziehungsweise größere Verwandtschaftsgruppen. „Familien“ ist allgemein verständlich; „der Erde“ bringt den universalen Umfang der Zusage zum Ausdruck.
theological_decisions:
- issue: Bedeutung der Segensformel וְנִבְרְכוּ בְךָ
  choice: 'passiv: „in dir werden … gesegnet werden“'
  alternative: 'reflexiv/medial: „durch dich werden sich … Segen wünschen“ beziehungsweise instrumental: „durch dich werden … gesegnet werden“'
  rationale: Die Nifalform lässt in diesem Zusammenhang eine passive sowie eine reflexive oder mediale Deutung zu; auch בְּךָ kann örtlich/sphärisch oder instrumental verstanden werden. Der Haupttext folgt der naheliegenden passiven Wiedergabe, während die Alternativen ausdrücklich dokumentiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „wer …, den …“ wahrt den singularischen Gegensatz zu den zuvor pluralisch bezeichneten Segnenden. „Familien“ wurde dem heute teilweise altertümlich oder missverständlich wirkenden „Geschlechter“ beziehungsweise „Sippen“ vorgezogen.
