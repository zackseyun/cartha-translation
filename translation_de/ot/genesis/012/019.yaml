  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: de
  text: 'Warum hast du gesagt: »Sie ist meine Schwester«, und ich nahm sie mir zur Frau? Und nun: Hier ist deine Frau. Nimm sie und geh!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: Warum hast du gesagt
  rationale: Die direkte Frage gibt Pharaos Vorwurf in natürlichem modernem Deutsch wieder; das Perfekt passt zur erzählten mündlichen Rede.
- source_word: אֲחֹתִי הִוא
  choice: Sie ist meine Schwester
  rationale: Die hebräische Nominalklausel wird als unmittelbar zitierte Aussage im Präsens wiedergegeben.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: sodass ich sie mir zur Frau nahm
  rationale: „Sodass“ drückt hier die aus dem Zusammenhang erkennbare Folge aus, ohne einen Zweck zu behaupten; „mir zur Frau nehmen“ entspricht der hebräischen Heiratsformel und bewahrt לִי.
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Markiert wie im Hebräischen den Übergang vom Vorwurf zur Aufforderung.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: Hier ist deine Frau
  rationale: Das deiktische הִנֵּה wird in gegenwärtigem, idiomatischem Deutsch durch „Hier ist“ ausgedrückt.
- source_word: קַח וָלֵךְ
  choice: Nimm sie und geh
  rationale: Die beiden Imperative und ihre Reihenfolge bleiben erhalten; das im Deutschen nötige Objekt „sie“ ist aus dem unmittelbaren Zusammenhang eindeutig.
