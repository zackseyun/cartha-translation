source:
  edition: WLC
  text: וַ/יְצַ֥ו עָלָ֛י/ו פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽ/יְשַׁלְּח֥וּ אֹת֛/וֹ וְ/אֶת אִשְׁתּ֖/וֹ וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: de
  text: Daraufhin erteilte der Pharao Männern Anweisungen in Bezug auf ihn,[a] und sie schickten ihn mit seiner Frau und allem, was ihm gehörte, fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung lässt offen, welchen genauen Auftrag die Männer in Bezug auf Abram erhielten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו ... עָלָיו
  choice: befahl ... sich um ihn zu kümmern
  rationale: צוה mit עַל bezeichnet hier eine Anordnung in Bezug auf Abram. Die Formulierung gibt den natürlichen Kontext wieder, ohne die genaue Art des Auftrags weiter festzulegen.
- source_word: אֲנָשִׁים
  choice: Männern
  rationale: Das Hebräische nennt ausdrücklich Männer; vermutlich waren es Beauftragte des Pharaos, doch ihre Funktion wird nicht näher bezeichnet.
- source_word: וַיְשַׁלְּחוּ אֹתוֹ
  choice: sie schickten ihn ... fort
  rationale: שלח bezeichnet in diesem Zusammenhang das Fortschicken beziehungsweise Entlassen Abrams.
- source_word: אִשְׁתּוֹ
  choice: seiner Frau
  rationale: אִשָּׁה mit Possessivsuffix bedeutet im ehelichen Zusammenhang »seine Frau«.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: allem, was ihm gehörte
  rationale: Die Wendung bezeichnet umfassend Abrams Besitz und wird im Deutschen natürlich und quellennah wiedergegeben.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ausdrücklich genannten »Männer« bleiben erhalten; ihre nicht näher bestimmte Rolle wird nicht als Diener, Wächter oder Begleiter konkretisiert.
