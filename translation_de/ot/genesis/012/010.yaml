base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: de
  text: Im Land herrschte eine Hungersnot, und Abram zog nach Ägypten hinab, um dort als Fremder zu wohnen[a], denn im Land herrschte eine schwere Hungersnot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um dort als Fremder zu leben“ oder „um dort zu wohnen“. Das hebräische Verb kann das Wohnen oder Ansässigsein als Ortsfremder bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב
  choice: herrschte eine Hungersnot
  rationale: Die Wendung führt ein neues Geschehen ein. Im Deutschen gibt „herrschte eine Hungersnot“ den Zustand natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das Land beziehungsweise die Region, in der Abram lebte, nicht die ganze Erde. Die Wiederholung am Versende bleibt erhalten.
- source_word: וַיֵּרֶד
  choice: zog … hinab
  rationale: ירד bedeutet wörtlich „hinabgehen“. „Hinabziehen“ bewahrt die hebräische Richtungsangabe für die Reise nach Ägypten und klingt im Deutschen natürlich erzählerisch.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet die Bewegung auf Ägypten zu; idiomatisches Deutsch verwendet „nach Ägypten“.
- source_word: לָגוּר שָׁם
  choice: um sich dort als Fremder aufzuhalten
  rationale: גור bezeichnet das Wohnen oder Verweilen als Ortsfremder und kann einen zeitweiligen Aufenthalt einschließen. Die Formulierung bewahrt sowohl den Fremdlingsstatus als auch den nicht notwendig dauerhaften Charakter.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier den Grund für Abrams Zug nach Ägypten ein. „Denn“ verbindet die Aussage in einem würdigen, natürlichen Erzählstil.
- source_word: כָבֵד הָרָעָב
  choice: die Hungersnot … war schwer
  rationale: כבד bedeutet wörtlich „schwer“ und beschreibt hier die große Intensität der Hungersnot. Die deutsche Wendung bewahrt das Bild und ist verständlich.
