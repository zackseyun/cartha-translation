source:
  edition: WLC
  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: de
  text: 'Da ließ der Pharao Abram rufen und sagte: »Was hast du mir da angetan? Warum hast du mir nicht gesagt, dass sie deine Frau ist?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ließ ... rufen
  rationale: קרא mit לְ und einer Person kann bedeuten, jemanden zu sich zu rufen. Die deutsche Wendung ist hier natürlicher und eindeutiger als das mögliche, aber missverständliche „rief Abram“.
- source_word: פַרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels; der bestimmte Artikel entspricht dem normalen deutschen Sprachgebrauch.
- source_word: לְאַבְרָם
  choice: Abram
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: אמר ist das gewöhnliche Verb des Sagens. Trotz der folgenden Fragen bleibt „sagte“ eine natürliche und formnahe Wiedergabe.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Was hast du mir da angetan?
  rationale: Die idiomatische deutsche Frage bewahrt den vorwurfsvollen Ton, das demonstrative זֹאת durch „da“ und den persönlichen Bezug לִּי durch „mir“.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Warum hast du mir nicht gesagt
  rationale: נגד im Hifil bedeutet hier „mitteilen/sagen“. Das deutsche Perfekt klingt in direkter Rede natürlich und bezieht sich auf Abrams unterlassene Mitteilung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Abram dem Pharao nicht mitgeteilt hatte.
- source_word: אִשְׁתְּךָ הִוא
  choice: sie deine Frau ist
  rationale: Die hebräische Nominalklausel wird im Deutschen mit Präsens und Kopula wiedergegeben; „Frau“ bezeichnet im Kontext eindeutig die Ehefrau.
- source_word: וַ
  choice: Da
  rationale: Das narrative Waw führt die Handlung fort. „Da“ markiert die zeitlich-folgernde Weiterführung in gehobenem, aber verständlichem Erzählstil.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit natürlicher direkter Rede. „Was hast du mir da angetan?“ ist idiomatisch, ohne den demonstrativen und anklagenden Gehalt des Hebräischen einzuebnen. Keine Fußnoten erforderlich.
