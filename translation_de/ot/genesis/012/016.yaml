base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: de
  text: Und er behandelte Abram ihretwegen gut[a], und Abram bekam Schafe, Rinder, männliche Esel, Sklaven, Sklavinnen, Eselinnen und Kamele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihretwillen“. Die hebräische Wendung kann sowohl den Anlass als auch ein Handeln zu jemandes Gunsten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: behandelte … gut
  rationale: Das Hifil von יטב bedeutet hier, jemandem Gutes zu tun beziehungsweise ihn günstig zu behandeln; die gewählte Formulierung ist natürlich und wahrt den Personenbezug.
- source_word: בַּעֲבוּרָהּ
  choice: ihretwegen
  rationale: Die Wendung bezeichnet hier Ursache oder Anlass. „Ihretwegen“ gibt dies knapp wieder, ohne eine Absicht zu unterstellen.
- source_word: וַיְהִי לוֹ
  choice: sodass dieser … bekam
  rationale: Die hebräische Besitzkonstruktion bezeichnet im Erzählzusammenhang den daraus folgenden Erwerb. „bekam“ bildet diese Entwicklung natürlicher ab als das statische „hatte“; „dieser“ verdeutlicht, dass Abram gemeint ist.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, oft Schafe und Ziegen. In dieser Aufzählung folgt die traditionelle konkrete Wiedergabe „Schafe“, wobei „Kleinvieh“ ebenfalls möglich wäre.
- source_word: בָקָר
  choice: Rinder
  rationale: Die Sammelbezeichnung für Rindvieh wird im Deutschen natürlich mit „Rinder“ wiedergegeben.
- source_word: חֲמֹרִים
  choice: Esel
  rationale: Der maskuline Plural bezeichnet hier männliche Esel und steht im Kontrast zu אֲתֹנֹת. Das gewöhnliche deutsche „Esel“ kann männliche Tiere bezeichnen, ohne die Aufzählung unnötig technisch zu machen.
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: In der Besitzaufzählung bezeichnet עֲבָדִים unfreie männliche Menschen; „Sklaven“ gibt den sozialen Status deutlicher wieder als „Diener“.
- source_word: שְׁפָחֹת
  choice: Sklavinnen
  rationale: Der feminine Plural bezeichnet unfreie weibliche Menschen und wird parallel zu עֲבָדִים geschlechtsspezifisch wiedergegeben.
- source_word: אֲתֹנֹת
  choice: Eselinnen
  rationale: Das Wort bezeichnet ausdrücklich weibliche Esel; „Eselinnen“ wahrt den Gegensatz zu חֲמֹרִים.
- source_word: גְמַלִּים
  choice: Kamele
  rationale: Direkte und übliche deutsche Entsprechung des Plurals.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die menschlichen Besitzkategorien werden historisch und sozial präzise als „Sklaven“ und „Sklavinnen“ bezeichnet. Die Folgekonstruktion mit „sodass“ stellt den Zusammenhang zwischen der günstigen Behandlung und Abrams Erwerb klar dar, ohne über den hebräischen Text hinauszugehen.
