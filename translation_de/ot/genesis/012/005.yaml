  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: de
  text: Abram nahm seine Frau Sarai, Lot, den Sohn seines Bruders, ihren ganzen Besitz, den sie erworben hatten, und die Menschen, die sie in Haran hinzugewonnen hatten,[a] mit. Sie brachen auf, um ins Land Kanaan zu ziehen, und kamen ins Land Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Seelen, die sie in Haran gemacht hatten“; möglicherweise: „die Personen, die sie dort erworben hatten“. Gemeint sind wahrscheinlich Menschen, die in Haran zu ihrem Hausstand hinzugekommen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: לקח bezeichnet hier das Mitnehmen der genannten Personen und Güter beim Aufbruch; die deutsche Verbklammer gibt den natürlichen Erzählsinn wieder.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: אִשָּׁה mit Possessivsuffix bezeichnet in diesem ehelichen Zusammenhang eindeutig die Ehefrau.
- source_word: בֶּן אָחִיו
  choice: den Sohn seines Bruders
  rationale: Die ausdrückliche hebräische Verwandtschaftsangabe wird bewahrt, statt sie lediglich mit „Neffe“ zusammenzufassen.
- source_word: כָּל רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: ihren ganzen Besitz, den sie erworben hatten
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise Habe; רכש bedeutet erwerben. Die Wortverwandtschaft muss im Deutschen nicht künstlich nachgebildet werden.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: die Menschen, die sie … hinzugewonnen hatten
  rationale: נפש meint hier Personen. עשה bedeutet wörtlich „machen“, bezeichnet in dieser schwierigen Verbindung aber wahrscheinlich Menschen, die ihrem Hausstand hinzugefügt worden waren. „Hinzugewonnen“ wahrt die Vorstellung des Zuwachses, ohne die Personen ausdrücklich als Eigentum zu bezeichnen.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: sie brachen auf, um … zu ziehen
  rationale: Die Verbindung aus יצא und dem Infinitiv הלך beschreibt einen Aufbruch mit Ziel beziehungsweise Absicht; die deutsche Form ist natürlich und bildet beide Elemente ab.
- source_word: אַרְצָה כְּנַעַן
  choice: ins Land Kanaan
  rationale: Die Richtungsendung an אַרְצָה und der Ortsname ergeben „in das Land Kanaan“.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנַעַן
  choice: und kamen ins Land Kanaan
  rationale: Die Wiederholung des Ziels im hebräischen Text wird beibehalten und markiert, dass das angestrebte Ziel tatsächlich erreicht wurde.
theological_decisions:
- issue: Bedeutung von הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: Menschen, die sie hinzugewonnen hatten
  alternative: Personen, die sie erworben hatten / Seelen, die sie gemacht hatten
  rationale: Die ungewöhnliche Wendung wird nicht als Aussage über die Erschaffung von Seelen gedeutet. Zugleich wird durch eine Fußnote offengelegt, dass das Verb wörtlich „machen“ heißt und auch im Sinn von „erwerben“ verstanden werden kann.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange hebräische Objektkette bleibt erkennbar, wird aber durch die deutsche Verbklammer „nahm … mit“ natürlich gestaltet. Die bewusste Wiederholung von „Land Kanaan“ wird nicht geglättet.
