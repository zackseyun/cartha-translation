  terminology: Die Namen Abram, Sarai, Lot, Haran und Kanaan sind konsistent. „Besitz“ für רְכוּשׁ und „erworben“ für רָכָשׁ sind treffend. Die Fußnote behandelt „Seelen … gemacht“ als wörtliche und „Personen … erworben“ als mögliche alternative Wiedergabe; ihre vorsichtige Erklärung als Hausstandszuwachs wahrt die lexikalische Unsicherheit.
