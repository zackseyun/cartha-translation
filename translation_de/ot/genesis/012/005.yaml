  source_fidelity: 'Die Übersetzung gibt die hebräische Objektfolge und den Bewegungsablauf zuverlässig wieder: Abram nimmt Sarai, Lot, den Besitz und die in Haran hinzugewonnenen Menschen mit; anschließend brechen sie mit dem Ziel Kanaan auf und erreichen das Land. „Den Sohn seines Bruders“ bewahrt die ausdrückliche hebräische Verwandtschaftsbezeichnung. Die Wiederholung von „Land Kanaan“ entspricht dem hebräischen Text. Die schwierige Wendung הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ ist mit „die Menschen, die sie in Haran hinzugewonnen hatten“ sachgerecht und nicht überdeutet wiedergegeben.'
