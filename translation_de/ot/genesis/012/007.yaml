  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: de
  text: 'Da erschien Jahwe Abram und sagte: »Deiner Nachkommenschaft[a] werde ich dieses Land geben.« Dort baute er einen Altar für Jahwe, der ihm erschienen war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deinem Samen«. Das hebräische Wort steht im Singular und kann kollektiv die Nachkommen als Gesamtheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier eine wahrnehmbare Erscheinung Jahwes vor Abram; »erschien« ist präzise und natürlich.
- source_word: לְזַרְעֲךָ
  choice: deinem Nachkommen
  rationale: זֶרַע ist formal Singular, kann aber kollektiv die Nachkommenschaft bezeichnen. »Nachkommen« bewahrt im Deutschen die mögliche Einzel- wie Kollektivbedeutung besser als »Nachkommen­schaft« oder »Samen«.
- source_word: אֶתֵּן
  choice: werde ich geben
  rationale: Das Imperfekt hat in der direkten Rede promissive Zukunftsbedeutung.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: אֶרֶץ bezeichnet hier im Zusammenhang der Verheißung das konkrete Land, nicht allgemein die Erde oder einen politischen Staat.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Dort baute er … einen Altar
  rationale: Die Formulierung erhält den hervorgehobenen Ortsbezug von שָׁם und führt die Erzählung natürlich fort.
- source_word: לַיהוָה
  choice: Jahwe … einen Altar
  rationale: Der Dativ ist idiomatisches Deutsch für einen Altar, der Jahwe gewidmet ist.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: der ihm erschienen war
  rationale: Das attributive Partizip kennzeichnet Jahwe als denjenigen, der Abram erschienen war; das Plusquamperfekt macht die zeitliche Vorordnung deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Einzel- oder Kollektivbezug von זֶרַע
  choice: Nachkommen
  alternative: Nachkommenschaft; Samen
  rationale: Die formal singularische, zugleich kollektiv verwendbare Bezeichnung bleibt offen und wird nicht vorschnell ausschließlich auf eine Einzelperson oder eine Mehrzahl festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch, bewahrt aber den Ortsakzent »Dort« sowie die enge Verbindung zwischen Jahwes Erscheinung, Verheißung und Abrams Altarbau.
