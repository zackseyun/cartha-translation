  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: de
  text: 'Und wenn die Ägypter dich sehen, werden sie sagen: »Das ist seine Frau.« Dann werden sie mich töten, dich aber am Leben lassen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Einleitungsformel kündigt den erwarteten Fall an. „Und wenn“ gibt sie im Deutschen natürlich und knapp wieder, ohne den Zukunftsbezug des Zusammenhangs zu verlieren.
- source_word: יִרְאוּ אֹתָךְ הַמִּצְרִים
  choice: die Ägypter dich sehen
  rationale: ראה bezeichnet hier das gewöhnliche Sehen; הַמִּצְרִים ist die bestimmte Volksbezeichnung „die Ägypter“.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Das ist seine Frau
  rationale: Die nominale Identifizierung wird idiomatisch wiedergegeben; „das“ bewahrt die demonstrative Kraft von זֹאת.
- source_word: וְהָרְגוּ אֹתִי
  choice: Dann werden sie mich töten
  rationale: הרג bedeutet direkt „töten“. „Dann“ verdeutlicht hier natürlich die erwartete Folge, ohne den Sinn zu erweitern.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: dich aber am Leben lassen
  rationale: Der Hifil von חיה bedeutet „am Leben erhalten/lassen“. „Aber“ bringt den im Hebräischen durch die Gegenüberstellung entstehenden Kontrast zu Abrams Tötung natürlich zum Ausdruck.
