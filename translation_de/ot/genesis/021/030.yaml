source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: de
  text: 'Und er sagte: »Diese sieben weiblichen Lämmer sollst du aus meiner Hand annehmen, damit dies[a] mir als Zeugnis dient, dass ich diesen Brunnen gegraben habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit sie mir als Zeugnis dienen«. Das hebräische Verb steht im Singular, obwohl unmittelbar von den sieben weiblichen Lämmern die Rede ist. Der Singular kann sie als Gesamtheit auffassen oder sich auf die Übergabe beziehungsweise die getroffene Vereinbarung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Der deutsche Erzählanschluss gibt den fortschreitenden wayyiqtol-Stil wieder, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: Diese sieben weiblichen Lämmer sollst du annehmen
  rationale: כִּי leitet hier Abrahams Antwort beziehungsweise Erklärung ein. תִּקַּח hat auffordernden Charakter; „sollst du annehmen“ ist modernes, würdiges Deutsch. כְּבָשֹׂת bezeichnet weibliche Lämmer, und „diese“ ergibt sich aus den unmittelbar zuvor genannten Tieren.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die konkrete hebräische Wendung bleibt erhalten und lässt den förmlichen Übergabevorgang erkennen.
- source_word: בַּעֲבוּר תִּהְיֶה לִּי לְעֵדָה
  choice: damit dies mir als Zeugnis dient
  rationale: בַּעֲבוּר bezeichnet hier den Zweck. Das demonstrative „dies“ wahrt den Singular von תִּהְיֶה und kann die Übergabe beziehungsweise die Gesamtheit der sieben Lämmer zusammenfassend bezeichnen. „Als Zeugnis“ erhält den rechtlich-beweisenden Sinn von עֵדָה.
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: dass ich diesen Brunnen gegraben habe
  rationale: Das zweite כִּי führt den Inhalt des Zeugnisses ein; Perfekt und Demonstrativ werden im Deutschen unmittelbar und natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Übergabeformel „aus meiner Hand“ bleibt erhalten; die grammatische Spannung zwischen den sieben Lämmern und dem singularischen Verb wird im Haupttext nicht geglättet, sondern in der Fußnote erläutert.
