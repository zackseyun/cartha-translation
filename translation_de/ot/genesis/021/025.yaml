  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: de
  text: Abraham stellte Abimelech wegen des Wasserbrunnens zur Rede, den Abimelechs Knechte an sich gerissen hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: stellte … zur Rede
  rationale: Das Hifil von יכח bezeichnet hier ein konfrontierendes Zurechtweisen beziehungsweise Vorhalten; die deutsche Wendung ist natürlich und wahrt den Ernst der Auseinandersetzung.
- source_word: עַל אֹדוֹת
  choice: wegen
  rationale: Die Präpositionalkonstruktion nennt den Anlass beziehungsweise Gegenstand der Beschwerde.
- source_word: בְּאֵר הַמַּיִם
  choice: Wasserbrunnen
  rationale: Die Wiedergabe bildet die hebräische Verbindung ausdrücklich ab und bezeichnet einen Brunnen zur Wasserversorgung.
- source_word: גָּזְלוּ
  choice: an sich gerissen hatten
  rationale: גזל bezeichnet gewaltsames oder unrechtmäßiges Wegnehmen; diese Formulierung bewahrt den Vorwurf, ohne über den genauen Ablauf hinauszugehen.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: Abimelechs Knechte
  rationale: עֲבָדִים kann Knechte, Diener oder Bedienstete bezeichnen; im patriarchalischen Erzählkontext ist „Knechte“ eine passende, allgemein verständliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung setzt Abraham als Handelnden klar an den Anfang; „zur Rede stellen“ gibt die rechtlich-konfrontative Färbung wieder, ohne zusätzliche Motive oder eine förmliche Gerichtsverhandlung anzunehmen.
