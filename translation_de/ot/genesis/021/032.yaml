base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: de
  text: So schlossen sie in Beerscheba einen Bund.[a] Dann erhoben sich Abimelech und Pichol, der Befehlshaber seines Heeres, und kehrten in das Land der Philister zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Bund schneiden«; eine hebräische Wendung für das Schließen eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: sie schlossen einen Bund
  rationale: Die hebräische Wendung lautet wörtlich »einen Bund schneiden«. Das im Deutschen übliche »einen Bund schließen« gibt ihre Bedeutung klar und würdig wieder.
- source_word: בִּבְאֵר שָׁבַע
  choice: in Beerscheba
  rationale: Die Präposition ב bezeichnet hier den Ort des Bundesschlusses. »Beerscheba« ist die im Deutschen geläufige Form des Ortsnamens.
- source_word: וַיָּקָם
  choice: machte sich … auf
  rationale: קום bedeutet zunächst »aufstehen/sich erheben«, leitet hier aber zugleich den Aufbruch und die anschließende Rückkehr ein. »Machte sich auf« ist im deutschen Erzählstil natürlich und wahrt diese Funktion.
- source_word: וּפִיכֹל
  choice: zusammen mit Pichol
  rationale: Das hebräische ו bedeutet formal »und«. Die deutsche Fügung macht deutlich, dass Pichol Abimelech beim Aufbruch begleitet und beide Subjekt des folgenden Pluralverbs sind.
- source_word: שַׂר צְבָאוֹ
  choice: dem Oberbefehlshaber seines Heeres
  rationale: שַׂר bezeichnet einen führenden Amtsträger oder Befehlshaber, צָבָא hier das Heer. Die Wiedergabe benennt Pichols militärische Leitungsfunktion klar.
- source_word: וַיָּשֻׁבוּ
  choice: sie kehrten … zurück
  rationale: שׁוב bezeichnet in diesem Zusammenhang die Rückkehr; die gewählte Form entspricht dem hebräischen Plural und natürlichem deutschem Erzählstil.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: in das Land der Philister
  rationale: Die Wiedergabe folgt der ethnogeografischen Formulierung des Hebräischen, ohne sie zum abstrakteren »Philistergebiet« zu glätten.
