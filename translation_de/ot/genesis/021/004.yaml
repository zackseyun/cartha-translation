id: GEN.21.4
reference: Genesis 21:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: de
  text: Abraham beschnitt seinen Sohn Isaak, als dieser acht Tage alt war,[a] so wie Gott es ihm geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Sohn von acht Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: beschnitt
  rationale: Das Verb מול bezeichnet spezifisch die Beschneidung; „beschnitt“ ist die präzise und im Deutschen natürliche Wiedergabe.
- source_word: אֶת יִצְחָק
  choice: Isaak
  rationale: Der hebräische Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung bleibt erhalten und bewahrt die familiäre Betonung des Hebräischen.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: als dieser acht Tage alt war
  rationale: Die wörtliche hebräische Altersangabe „ein Sohn von acht Tagen“ wird idiomatisch und eindeutig in modernes Deutsch übertragen.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Konjunktion bezeichnet hier die Übereinstimmung von Abrahams Handeln mit Gottes Gebot.
- source_word: צִוָּה אֹתוֹ
  choice: es ihm geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Gottes Gebot dem Handeln Abrahams vorausging; „es“ nimmt die geforderte Beschneidung auf.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Kontext bezeichnet אֱלֹהִים mit singularischer Aussage den einen Gott.
theological_decisions:
- issue: Zeitliche Einordnung des göttlichen Gebots
  choice: geboten hatte
  alternative: gebot
  rationale: Das Hebräische lässt eine einfache Vergangenheitsform zu. Das deutsche Plusquamperfekt bringt die im Erzählzusammenhang bereits zuvor erfolgte Anordnung klar zum Ausdruck, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Beschnitt“ ist knapp und sachlich; „als dieser“ vermeidet eine mögliche falsche Zuordnung des Alters zu Abraham. Die idiomatische Altersangabe wird durch eine Fußnote mit der hebräischen Ausdrucksweise ergänzt.
