source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: de
  text: 'Da sagte Abimelech: »Ich wusste nicht, wer das getan hatte.[a] Auch du hast es mir nicht mitgeteilt, und ich selbst hatte bis heute nichts davon gehört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wer diese Sache getan hatte«; das hebräische Wort davar kann eine Sache, Angelegenheit oder Tat bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« ist im modernen deutschen Erzählstil natürlich und wahrt den Zusammenhang.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: לֹא יָדַעְתִּי
  choice: Ich wusste nicht
  rationale: Das Qatal bezeichnet hier Abimelechs bis zu diesem Gespräch bestehende Unkenntnis; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: מִי עָשָׂה
  choice: wer ... getan hatte
  rationale: Das Plusquamperfekt macht deutlich, dass die Tat dem gegenwärtigen Gespräch vorausging, ohne den unbekannten Handelnden näher zu bestimmen.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: das
  rationale: Im Deutschen ist »das tun« für die bereits angesprochene Handlung idiomatischer als »diese Sache tun«. Eine Fußnote bewahrt die Bedeutungsbreite von דָּבָר.
- source_word: וְגַם אַתָּה
  choice: Auch du
  rationale: גַּם schließt Abraham ausdrücklich ein und setzt einen leichten Akzent auf »du«.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: hast es mir nicht mitgeteilt
  rationale: הגיד bezeichnet das Mitteilen oder Berichten; das Perfekt klingt in direkter moderner Rede natürlich.
- source_word: וְגַם אָנֹכִי
  choice: und ich selbst
  rationale: Die volle Pronomenform אָנֹכִי kann Nachdruck tragen; »ich selbst« erhält diesen Kontrast.
- source_word: לֹא שָׁמַעְתִּי
  choice: hatte ... nichts davon gehört
  rationale: Gemeint ist, dass Abimelech keine Nachricht von dem Vorfall erhalten hatte. »Davon hören« gibt dies idiomatisch wieder.
- source_word: בִּלְתִּי הַיּוֹם
  choice: bis heute
  rationale: Die Wendung grenzt den heutigen Tag als den Zeitpunkt aus, an dem die vorherige Unkenntnis endet.
theological_decisions: []
