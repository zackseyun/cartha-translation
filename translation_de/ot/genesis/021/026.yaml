  source_fidelity: 'Der Text gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Abimelechs Unkenntnis, Abrahams unterlassene Mitteilung und sein eigenes Nichthören bis zum heutigen Tag. Das Plusquamperfekt in „wer das getan hatte“ und „hatte ... gehört“ ist im deutschen Kontext stimmig und wahrt die zeitliche Vorordnung der Tat bzw. der fehlenden Kenntnis.'
  naturalness: Modernes, klares Standarddeutsch in angemessen würdigem Erzähl- und Dialogregister. „Da sagte“, „Auch du“ und „davon gehört“ sind idiomatisch; die wechselnde Verwendung von Präteritum, Perfekt und Plusquamperfekt ist in direkter Rede natürlich und verständlich.
  terminology: „Abimelech“ entspricht der üblichen deutschen Namensform. Die Wiedergabe von דָבָר durch das kontextuelle „das“ ist treffend; die Fußnote dokumentiert sachgerecht die mögliche Bedeutungsbreite. Der Nachdruck von אָנֹכִי wird mit „ich selbst“ vertretbar bewahrt, ohne eine theologische oder interpretative Zuspitzung.
