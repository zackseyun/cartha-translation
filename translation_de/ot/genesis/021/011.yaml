id: GEN.21.11
reference: Genesis 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: de
  text: Die Sache missfiel Abraham sehr wegen seines Sohnes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Sache war in Abrahams Augen sehr schlimm wegen seines Sohnes.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: missfiel
  rationale: Das Qal-Verb von רעע steht hier mit בְּעֵינֵי und bezeichnet idiomatisch, dass etwas in jemandes Urteil schlecht oder äußerst unerfreulich ist. »Missfiel« gibt diesen Sinn im Deutschen natürlich wieder, ohne die Aussage ausdrücklich als moralisches Urteil festzulegen.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Hier verweist es auf Saras unmittelbar zuvor geäußerte Forderung; »die Sache« bleibt knapp und kontextgemäß.
- source_word: מְאֹד
  choice: sehr
  rationale: Der gebräuchliche deutsche Intensivierer bewahrt die Stärke des hebräischen Ausdrucks in natürlicher Sprache.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: Abraham
  rationale: Die Wendung bedeutet wörtlich »in den Augen Abrahams«. In Verbindung mit »missfiel« wird derselbe subjektiv wertende Sinn im Deutschen idiomatisch ausgedrückt; die Bildhaftigkeit der Ausgangssprache bleibt in der Fußnote sichtbar.
- source_word: עַל אֹדוֹת
  choice: wegen
  rationale: Die Präpositionalwendung kann einen Grund oder einen Gegenstand angeben. »Wegen« lässt hier knapp erkennen, dass Abrahams Reaktion mit seinem Sohn zusammenhängt, ohne die genaue Art dieses Zusammenhangs näher auszudeuten.
- source_word: בְּנוֹ
  choice: seines Sohnes
  rationale: בֵּן bezeichnet ausdrücklich den Sohn; der pronominale Suffix verweist auf Abraham. Die Formulierung bewahrt Geschlecht und Beziehung des Ausgangstextes.
theological_decisions:
- issue: Art von Abrahams negativer Reaktion
  choice: »missfiel Abraham sehr«
  alternative: »war in Abrahams Augen sehr schlimm«
  rationale: Der Text beschreibt Abrahams Bewertung beziehungsweise sein starkes Missfallen, legt aber nicht eindeutig fest, ob »schlimm« hier ein moralisches Urteil oder persönliche Bestürzung bezeichnet. Die Hauptfassung vermeidet eine unnötige theologische Festlegung; die wörtlichere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die Hauptfassung gibt die hebräische Redewendung idiomatisch wieder; die Fußnote bewahrt ihre wörtlichere Bildsprache und die stärkere lexikalische Färbung.
