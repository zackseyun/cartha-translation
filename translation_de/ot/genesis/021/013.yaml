  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: de
  text: Auch den Sohn der Sklavin werde ich zu einem Volk machen, denn er ist dein Nachkomme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die Verbindung aus וְ und גַם setzt die Rede fort und betont, dass die Zusage ebenso für den anderen Sohn gilt; im Deutschen gibt „Auch“ diese additive Kraft natürlich wieder.
- source_word: אֶת בֶּן הָאָמָה
  choice: den Sohn der Sklavin
  rationale: בֶּן bedeutet „Sohn“, und אָמָה bezeichnet eine unfreie Dienerin beziehungsweise Sklavin. „Sklavin“ macht den im Erzählzusammenhang bedeutsamen sozialen Status deutlich, ohne ihn durch „Magd“ abzuschwächen.
- source_word: לְגוֹי
  choice: zu einem Volk
  rationale: 'Die Präposition לְ bezeichnet zusammen mit שׂים das Ergebnis: Der Sohn soll zum Ursprung beziehungsweise Träger eines Volkes gemacht werden. „Zu einem Volk machen“ ist idiomatisches Deutsch.'
- source_word: אֲשִׂימֶנּוּ
  choice: werde ich ... machen
  rationale: שׂים kann „setzen, stellen, machen“ bedeuten. Hier beschreibt es Gottes Handeln, durch das aus dem Sohn ein Volk hervorgehen wird; „machen“ gibt dies knapp und natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt den Grund für die Zusage an. „Denn“ bewahrt den kausalen Zusammenhang in würdigem, geläufigem Deutsch.
- source_word: זַרְעֲךָ
  choice: dein Nachkomme
  rationale: זֶרַע bezeichnet hier Abrahams leibliche Nachkommenschaft und bezieht sich konkret auf den genannten Sohn. „Nachkomme“ ist im Singular klarer und natürlicher als das kollektive „Nachkommenschaft“ oder das wörtliche „Same“.
- source_word: הוּא
  choice: er ist
  rationale: Das ausdrücklich gesetzte Pronomen hebt die Identität des Sohnes als Abrahams Nachkommen hervor. Die normale deutsche Form „er ist“ bewahrt dies, ohne die Betonung durch „er selbst“ zu übersteigern.
theological_decisions:
- issue: Wiedergabe von אָמָה und Hagars sozialem Status
  choice: Sklavin
  alternative: Magd / Dienerin
  rationale: Der hebräische Ausdruck bezeichnet eine Frau in einem unfreien Dienstverhältnis. Da Hagars gebundener Status für die Erzählung wesentlich ist, soll die Übersetzung diese soziale Wirklichkeit nicht beschönigen.
- issue: Wiedergabe von זֶרַע im Singular
  choice: Nachkomme
  alternative: Nachkommenschaft / Same
  rationale: Im unmittelbaren Satz bezieht sich das Wort auf den einzelnen Sohn, auch wenn es grundsätzlich kollektiv gebraucht werden kann. „Nachkomme“ erhält den familiären und leiblichen Bezug, ohne zusätzliche theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Hervorhebung durch das vorangestellte „Auch“, bleibt aber idiomatisch. „Sklavin“ ist bewusst deutlich und historisch-sozial präzise; „zu einem Volk machen“ entspricht geläufiger biblischer Ausdrucksweise, ohne archaisch zu wirken.
