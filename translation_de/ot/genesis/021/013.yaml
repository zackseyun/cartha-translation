  terminology: „Sklavin“ gibt אָמָה sozialgeschichtlich präzise wieder und vermeidet eine verharmlosende Wiedergabe. „Volk“ für גּוֹי und „Nachkomme“ für זֶרַע sind in diesem Kontext treffend. Die Entscheidung steht auch mit der englischen Audit-Trail-Entscheidung zu „slave woman“ und „offspring“ in Einklang.
