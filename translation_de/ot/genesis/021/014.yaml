- from: Da stand Abraham früh am Morgen auf, nahm Brot und einen Wasserschlauch und gab beides Hagar. Er legte es ihr auf die Schulter, gab ihr auch den Jungen[a] und schickte sie fort. Sie ging weg und irrte in der Wildnis von Beerscheba umher.
  to: Da stand Abraham früh am Morgen auf, nahm Brot und einen Wasserschlauch und gab beides Hagar. Er legte es ihr auf die Schulter, gab ihr den Jungen dazu und schickte sie fort. Sie ging und irrte in der Wildnis von Beerscheba umher.
  rationale: Die Revision erhält die natürliche deutsche Auflösung, nach der Abraham Hagar die Vorräte auf die Schulter legt und ihr den Jungen zusätzlich übergibt. Zugleich dokumentiert die Fußnote die vollständiger dargestellte, verdichtete hebräische Wortfolge und wahrt die diskutierte alternative syntaktische Zuordnung, ohne sie im Haupttext als körperlich irreführende Aussage auszulegen.
