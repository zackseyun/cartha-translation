base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: de
  text: Da stand Abraham früh am Morgen auf, nahm Brot und einen Wasserschlauch und gab beides Hagar. Er legte es ihr auf die Schulter, gab ihr den Jungen dazu und schickte sie fort. Sie ging und irrte in der Wildnis von Beerscheba umher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: stand ... früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet das frühe Aufstehen; die deutsche Wendung gibt Zeit und Handlung natürlich wieder.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung ist hier passend; eine Verallgemeinerung zu „Nahrung“ ist nicht erforderlich.
- source_word: חֵמַת מַיִם
  choice: einen Wasserschlauch
  rationale: חֵמֶת bezeichnet einen Behälter aus Tierhaut für Flüssigkeiten. „Wasserschlauch“ ist im Deutschen verständlich und sachlich genauer als „Flasche“.
- source_word: וַיִּתֵּן אֶל הָגָר
  choice: gab beides Hagar
  rationale: „Beides“ nimmt Brot und Wasserschlauch auf und macht das im Hebräischen aus dem Zusammenhang ergänzte Objekt im Deutschen ausdrücklich.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: Er legte es ihr auf die Schulter
  rationale: Das singularische „es“ fasst die mitgegebenen Vorräte als Last zusammen und bewahrt zugleich die verdichtete Syntax, ohne den Jungen eindeutig auf die Schulter zu setzen.
- source_word: וְאֶת הַיֶּלֶד
  choice: gab ihr auch den Jungen
  rationale: Die Ergänzung „gab ihr“ macht eine naheliegende syntaktische Deutung im Deutschen lesbar; die genuine Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: וַיְשַׁלְּחֶהָ
  choice: schickte sie fort
  rationale: Dies gibt das Wegsenden sachlich, idiomatisch und ohne zusätzliche Wertung wieder.
- source_word: וַתֵּתַע
  choice: irrte ... umher
  rationale: תעה kann Umherirren oder Sich-Verirren bezeichnen. „irrte ... umher“ wahrt diese Bedeutungsbreite besser als das stärker absichtsbezogene „wanderte“.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: in der Wildnis von Beerscheba
  rationale: „Wildnis“ gibt מִדְבָּר wieder, ohne auf eine Sandwüste einzuengen; „Beerscheba“ ist die geläufige deutsche Namensform.
theological_decisions:
- issue: Syntaktische Zuordnung von „dem Jungen“ zur Schulterformulierung
  choice: Die Vorräte werden Hagar auf die Schulter gelegt; der Junge wird ihr ebenfalls übergeben.
  alternative: Der hebräische Wortlaut kann formal enger als „legte es ihr auf die Schulter und den Jungen“ wiedergegeben werden und könnte so verstanden werden, als sei auch der Junge auf ihre Schulter gesetzt worden.
  rationale: Der hebräische Satz ist stark verdichtet. Die gewählte Fassung vermeidet eine im Deutschen wahrscheinlich irreführende körperliche Platzierung des Jungen, kennzeichnet die alternative syntaktische Zuordnung jedoch ausdrücklich in der Fußnote.
translation_notes:
  register: Moderne, würdige Erzählsprache. Kurze Hauptsätze folgen dem hebräischen Handlungsablauf. Die Fußnote bewahrt die syntaktische Mehrdeutigkeit, während der Haupttext in natürlichem Deutsch eine wahrscheinlich nicht beabsichtigte Vorstellung vermeidet.
