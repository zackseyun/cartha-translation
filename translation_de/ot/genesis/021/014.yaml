  naturalness: Die Erzählsprache ist modern und gut verständlich. „Gab ihr auch den Jungen“ ist idiomatisch; „dazu“ verdeutlicht im revidierten Text, dass der Junge zusätzlich zu den Vorräten genannt wird. „Sie ging und irrte ... umher“ bewahrt die zwei hebräischen Verben ohne das etwas redundante „ging weg“.
  terminology: „Wasserschlauch“, „Junge“, „Wildnis“ und „Beerscheba“ sind passende moderne deutsche Wiedergaben. „Schickte sie fort“ trifft die sachliche Erzählfunktion von וַיְשַׁלְּחֶהָ.
