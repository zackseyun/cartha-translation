source:
  edition: WLC
  text: וַ/תֵּלֶךְ֩ וַ/תֵּ֨שֶׁב לָ֜/הּ מִ/נֶּ֗גֶד הַרְחֵק֙ כִּ/מְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל אֶרְאֶ֖ה בְּ/מ֣וֹת הַ/יָּ֑לֶד וַ/תֵּ֣שֶׁב מִ/נֶּ֔גֶד וַ/תִּשָּׂ֥א אֶת קֹלָ֖/הּ וַ/תֵּֽבְךְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: de
  text: 'Dann ging sie weg und setzte sich ihm gegenüber[a] in einiger Entfernung nieder, etwa einen Bogenschuss entfernt; denn sie sagte: »Ich möchte den Tod des Jungen nicht mit ansehen.« So saß sie ihm gegenüber, erhob ihre Stimme und weinte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einiger Entfernung von ihm«.'
    reason: Das hebräische מִנֶּגֶד kann sowohl die Position gegenüber als auch den Abstand von jemandem bezeichnen.
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: ihm gegenüber
  rationale: Die Wendung bezeichnet eine Position gegenüber und zugleich auf Abstand. Der folgende Ausdruck der Entfernung verdeutlicht den räumlichen Abstand; die Wiederholung wird im Deutschen bewahrt.
- source_word: הַרְחֵק
  choice: in einiger Entfernung
  rationale: Die adverbiale Form von רחק hebt den Abstand hervor. Diese Wiedergabe ist natürliches modernes Deutsch und vermeidet eine unnötig altertümliche Formulierung.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: etwa einen Bogenschuss weit
  rationale: Die feste Entfernungsangabe wird bildhaft und knapp wiedergegeben; כִּ־ zeigt die ungefähre Distanz an.
- source_word: הַיָּלֶד
  choice: der Junge
  rationale: יֶלֶד kann einen Jungen beziehungsweise jungen Menschen bezeichnen. »Junge« passt zu Ismaels Alter besser als »kleines Kind« und klingt weniger altertümlich als »Knabe«.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Ich kann nicht mit ansehen, wie der Junge stirbt
  rationale: Die negative Wunschäußerung wird in natürlichem, emotional angemessenem Deutsch wiedergegeben. Die wörtlichere nominale Fassung bleibt in der Fußnote erhalten.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: erhob ihre Stimme
  rationale: Die hebräische Redewendung wird nah an ihrer Bildsprache wiedergegeben; das folgende »weinte« bestimmt sie als laute Klage.
- source_word: וַתֵּבְךְּ
  choice: weinte
  rationale: Das Verb bezeichnet Weinen und bleibt vom vorausgehenden Erheben der Stimme unterscheidbar.
- source_word: לָהּ
  choice: setzte sich … nieder
  rationale: Der ethische beziehungsweise reflexive Dativ lässt sich im Deutschen beim Verb »sich niedersetzen« natürlich ausdrücken; ein zusätzliches »für sich« könnte fälschlich Alleinsein statt räumlicher Trennung betonen.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die zweimalige räumliche Wendung »ihm gegenüber« bewahrt die Wiederholung des Hebräischen. Die direkte Rede ist emotional natürlich formuliert, ohne den Sinn zu erweitern; eine wörtlichere Alternative wäre: »Ich will den Tod des Jungen nicht mit ansehen.«'
