  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: de
  text: Da nahm Abraham Schafe und Rinder und gab sie Abimelech, und die beiden schlossen einen Bund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schnitten einen Bund“; eine feste hebräische Wendung für den formellen Abschluss eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Qal wayyiqtol von לקח bezeichnet hier schlicht das Nehmen; „nahm“ gibt die fortlaufende Erzählung natürlich wieder.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. Im Gegensatz zu בָּקָר ist „Schafe“ eine klare und geläufige Wiedergabe, ohne den Text unnötig zu verallgemeinern.
- source_word: וּבָקָר
  choice: und Rinder
  rationale: בָּקָר bezeichnet Großvieh, besonders Rinder; „Rinder“ bildet im Deutschen ein natürliches Begriffspaar mit „Schafe“.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: und gab sie Abimelech
  rationale: נתן bedeutet hier gewöhnlich „geben“. Das Pronomen „sie“ nimmt die genannten Tiere natürlich auf; der Dativ gibt das präfigierte ל wieder.
- source_word: וַיִּכְרְתוּ שְׁנֵיהֶם בְּרִית
  choice: und die beiden schlossen einen Bund
  rationale: כרת ברית bedeutet wörtlich „einen Bund schneiden“, ist aber eine feste hebräische Wendung für das Schließen eines Bundes. „Die beiden“ bewahrt die ausdrückliche Nennung beider Parteien.
theological_decisions:
- issue: Wiedergabe der Bundesformel כרת ברית
  choice: schlossen einen Bund
  alternative: schnitten einen Bund
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung der hebräischen Redewendung und bewahrt zugleich den wichtigen Schlüsselbegriff „Bund“. Die wörtliche Bildsprache wird in der Fußnote kenntlich gemacht, ohne sie im Haupttext künstlich wirken zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer erzählerischer Satzführung. Das semitische Idiom wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent dokumentiert.
