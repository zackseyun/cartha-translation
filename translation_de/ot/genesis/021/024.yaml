  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אָנֹכִ֖י אִשָּׁבֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: de
  text: 'Da sagte Abraham: „Ich will schwören[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich schwöre“; auch: „Ich werde einen Eid leisten.“'
    reason: Lexikalisch und im Kontext der zustimmenden Antwort kann die hebräische Verbform sowohl als unmittelbare Eideserklärung als auch als Zusage verstanden werden, einen Eid zu leisten.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitliche Abfolge im Deutschen natürlich wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Sprecher ausdrücklich hervor. Im Deutschen trägt „ich“ diese Hervorhebung hinreichend; „ich selbst“ wäre möglich, klänge hier aber unnötig betont.
- source_word: אִשָּׁבֵעַ
  choice: Ich schwöre es
  rationale: Der Nifal von שבע bedeutet „schwören, einen Eid leisten“. In dieser Antwort auf Abimelechs Aufforderung ist „Ich schwöre es“ eine natürliche deutsche Eideszusage; „es“ nimmt den aus dem Zusammenhang gegebenen Eid auf, ohne dessen Inhalt näher festzulegen.
