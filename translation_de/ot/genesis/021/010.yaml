  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: de
  text: 'Da sagte sie zu Abraham: „Vertreibe diese Sklavin und ihren Sohn! Denn der Sohn dieser Sklavin wird nicht mit meinem Sohn, mit Isaak, erben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Vertreibe
  rationale: Der Imperativ bezeichnet ein entschiedenes Fortjagen oder Ausstoßen; „vertreibe“ bewahrt diese Schärfe besser als das mildere „schick weg“.
- source_word: הָאָמָה
  choice: Sklavin
  rationale: אָמָה bezeichnet hier eine unfreie Frau. „Sklavin“ macht ihren rechtlichen und sozialen Status deutlich und wahrt zugleich Saras abwertende Distanzierung.
- source_word: בְּנָהּ
  choice: ihren Sohn
  rationale: Die Possessivkonstruktion wird direkt und natürlich wiedergegeben.
- source_word: כִּי לֹא יִירַשׁ
  choice: Denn ... soll nicht ... erben
  rationale: כִּי begründet die Forderung. Das modal gebrauchte „soll nicht“ gibt in diesem direkten Ausspruch Saras entschlossene Verweigerung des gemeinsamen Erbes wieder, ohne eine göttliche Festlegung daraus zu machen.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: der Sohn dieser Sklavin
  rationale: Die Wiederholung der vollständigen Bezeichnung und des Demonstrativs wird bewahrt; so bleibt Saras betont distanzierende Ausdrucksweise hörbar.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: zusammen mit meinem Sohn, mit Isaak
  rationale: Das zweimalige עִם wird erhalten. Die appositionelle Wiederaufnahme „mit Isaak“ wirkt im Deutschen markiert, bewahrt aber die hebräische Hervorhebung.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Da sagte sie zu Abraham
  rationale: „Da“ gibt die narrative Abfolge des Waw-Konsekutivs in natürlichem modernem Deutsch wieder; das Subjekt bleibt wie im Hebräischen pronominal.
theological_decisions:
- issue: Art der Aussage über das Erben
  choice: „soll nicht ... erben“ als Saras nachdrückliche Forderung
  alternative: „wird nicht ... erben“ als schlichte Zukunftsaussage
  rationale: Der hebräische Imperfekt kann kontextuell mehr als bloße Zukunft ausdrücken. Nach dem Imperativ liegt eine entschlossene Willensäußerung nahe. Die Übersetzung lässt den Satz als Rede Saras stehen und macht ihn nicht ausdrücklich zu einem göttlichen Urteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schroffe Wiederholung „diese Sklavin“ und die markierte Formulierung „mit meinem Sohn, mit Isaak“ sind bewusst beibehalten, um Saras Distanzierung und den Nachdruck des Hebräischen nicht zu glätten.
