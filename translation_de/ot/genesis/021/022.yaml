source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: de
  text: 'Zu jener Zeit sagten Abimelech und Pichol, der Befehlshaber seines Heeres, zu Abraham: »Gott ist mit dir bei allem, was du tust.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Zu jener Zeit
  rationale: Die hebräische Szeneneinleitung wird in natürlichem, knappem Deutsch als Zeitangabe wiedergegeben; ein zusätzliches »es geschah« wäre hier unnötig schwerfällig.
- source_word: וַיֹּאמֶר
  choice: sagten
  rationale: Obwohl das hebräische Verb formal im Singular steht, folgt ein zusammengesetztes Subjekt. Im Deutschen verlangt dieses den Plural.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Abimelech und Pichol
  rationale: Die Personennamen werden in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: שַׂר צְבָאוֹ
  choice: der Befehlshaber seines Heeres
  rationale: שַׂר bezeichnet hier den militärischen Führer, צָבָא die Streitmacht Abimelechs.
- source_word: אֶל אַבְרָהָם לֵאמֹר
  choice: 'zu Abraham:'
  rationale: Der formelhafte Infinitiv לֵאמֹר leitet die direkte Rede ein und muss im natürlichen Deutschen nicht eigens mit »indem sie sagten« wiederholt werden.
- source_word: אֱלֹהִים עִמְּךָ
  choice: Gott ist mit dir
  rationale: Im Erzählzusammenhang bezeichnet אֱלֹהִים am natürlichsten den Gott, dessen Beistand und Segen an Abraham erkennbar sind.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: bei allem, was du tust
  rationale: Die Wendung bezeichnet Gottes begleitende Gegenwart im gesamten Handeln Abrahams; »bei allem« ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Abimelechs Aussage
  choice: Gott
  alternative: ein Gott; Götter
  rationale: Die Form אֱלֹהִים kann je nach Zusammenhang unterschiedlich verstanden werden. Hier weist der Erzählzusammenhang auf den Gott hin, der Abraham begleitet und segnet; daher ist »Gott« die sachlich und sprachlich naheliegendste Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Erzählformel und das formelhafte לֵאמֹר werden zugunsten eines flüssigen deutschen Satzes nicht mechanisch abgebildet; Aussagegehalt und Erzählfunktion bleiben erhalten.
