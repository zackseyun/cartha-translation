base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: de
  text: Das Kind wuchs heran und wurde entwöhnt. An dem Tag, an dem Isaak entwöhnt wurde, veranstaltete Abraham ein großes Festmahl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: wuchs heran
  rationale: גדל bezeichnet hier die körperliche Entwicklung des Kindes. „Wuchs heran“ ist im Deutschen natürlich und gibt mehr als bloße Körpergröße wieder.
- source_word: הַיֶּלֶד
  choice: das Kind
  rationale: יֶלֶד kann „Kind“ oder „Junge“ bedeuten. „Kind“ bewahrt die im Hebräischen mögliche allgemeinere Bezeichnung und passt zum Zusammenhang des Entwöhnens.
- source_word: וַיִּגָּמַל
  choice: wurde entwöhnt
  rationale: Die Nifal-Form von גמל bezeichnet hier das Ende der Stillzeit; „wurde entwöhnt“ ist die sachlich genaue und geläufige deutsche Wiedergabe.
- source_word: וַיַּעַשׂ
  choice: veranstaltete
  rationale: עשה bedeutet grundsätzlich „machen/tun“, wird aber zusammen mit מִשְׁתֶּה im Deutschen idiomatisch mit „ein Festmahl veranstalten“ wiedergegeben.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ein großes Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein festliches Mahl, oft mit Getränken. „Großes Festmahl“ bewahrt den feierlichen Charakter und das Adjektiv גָדוֹל.
- source_word: בְּיוֹם
  choice: an dem Tag
  rationale: Die zeitliche Wendung wird nahe an der hebräischen Form wiedergegeben und nicht lediglich zu „als“ verkürzt.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: an dem Isaak entwöhnt wurde
  rationale: Der Infinitiv mit אֶת und „Isaak“ bezeichnet das Ereignis seiner Entwöhnung. Die passive deutsche Form ist natürlich und vermeidet die missverständliche Aussage, Abraham selbst habe ihn entwöhnt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „entwöhnt“ bildet die Wiederholung des hebräischen Stammes גמל ab; die Satzteilung sorgt zugleich für gute Lesbarkeit.
