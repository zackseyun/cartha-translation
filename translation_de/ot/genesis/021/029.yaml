  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: de
  text: 'Da sagte Abimelech zu Abraham: „Was sind das für sieben weibliche Lämmer, die du für sich allein hingestellt hast[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die du abgesondert hast“. Das hebräische Verb bedeutet „hinstellen“ oder „aufstellen“; die anschließende Wendung bedeutet „für sich allein“ und zeigt, dass die Tiere getrennt von den anderen standen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ ist im modernen deutschen Erzählstil natürlich.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מָה הֵנָּה
  choice: Was sollen diese
  rationale: Die Frage zielt im Zusammenhang auf Bedeutung oder Zweck der Tiere. Die idiomatische deutsche Wendung bewahrt diesen Fragesinn, ohne eine ausdrückliche Begründungsfrage daraus zu machen.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: diese sieben weiblichen Lämmer
  rationale: כְּבָשֹׂת bezeichnet hier weibliche Lämmer beziehungsweise junge Schafe; „weibliche Lämmer“ macht die im Hebräischen erkennbare Geschlechtsangabe verständlich.
- source_word: הִצַּבְתָּ לְבַדָּנָה
  choice: die du für sich allein hingestellt hast
  rationale: הִצַּבְתָּ bedeutet „hinstellen/aufstellen“, während לְבַדָּנָה die getrennte Stellung der Tiere bezeichnet. Die Formulierung gibt beides in natürlichem Deutsch wieder.
