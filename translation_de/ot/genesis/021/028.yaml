translation:
  language: de
  text: Und Abraham stellte sieben weibliche Lämmer von der Herde gesondert auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Abraham stellte sieben weibliche Lämmer von der Herde abseits auf.“ Das hebräische Verb bezeichnet ein Aufstellen an einem bestimmten Platz; im Zusammenhang kann die gesonderte Stellung auch ein Aussondern hervorheben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: stellte … auf
  rationale: Das Hifil von נצב bezeichnet hier, dass Abraham die Tiere an einen bestimmten Platz stellt. „Stellte … auf“ gibt die konkrete Handlung wieder, ohne ihren Zweck bereits auszudeuten.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: אֶת
  choice: '[Akkusativ durch Satzbau wiedergegeben]'
  rationale: Der hebräische Marker des bestimmten direkten Objekts hat keine eigenständige deutsche Entsprechung.
- source_word: שֶׁבַע
  choice: sieben
  rationale: Eindeutige Kardinalzahl zum folgenden Substantiv.
- source_word: כִּבְשֹׂת
  choice: weibliche Lämmer
  rationale: Das Wort bezeichnet Lämmer weiblichen Geschlechts. Diese Wiedergabe ist im modernen Deutsch klarer als das fachsprachlichere „Mutterlämmer“ und bewahrt sowohl Geschlecht als auch Altersangabe.
- source_word: הַצֹּאן
  choice: aus der Herde
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh. „Aus der Herde“ bezeichnet hier natürlich die Zugehörigkeit beziehungsweise Auswahl, ohne die Herde unnötig auf Schafe einzuengen.
- source_word: לְבַדְּהֶן
  choice: gesondert
  rationale: Die Form bezeichnet die räumliche Trennung dieser sieben weiblichen Tiere von den übrigen. „Gesondert“ ist präzise und natürlich.
theological_decisions:
- issue: Bedeutung der gesonderten Aufstellung im Bundesschluss
  choice: 'Der Haupttext beschreibt nur die Handlung: Abraham stellte die Tiere gesondert auf.'
  alternative: Abraham sonderte die Tiere ausdrücklich als Bundeszeichen aus.
  rationale: Der unmittelbare Kontext verleiht der Handlung Bedeutung, doch der Vers selbst nennt ihren Zweck noch nicht. Die Übersetzung vermeidet daher eine vorwegnehmende theologische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weibliche Lämmer“ ist allgemein verständlich und gibt die geschlechtsspezifische hebräische Bezeichnung präzise wieder; „gesondert aufstellen“ hält die konkrete räumliche Handlung und ihre im Kontext erkennbare besondere Funktion zusammen, ohne diese Funktion in den Vers hineinzulesen.
