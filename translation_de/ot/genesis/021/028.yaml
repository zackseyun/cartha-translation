    rationale: הַצֹּאן kennzeichnet die sieben Lämmer als „der Herde“ zugehörig; „von der Herde“ ist im Deutschen für diese Beziehung idiomatisch und semantisch zurückhaltender.
  - severity: medium
    issue: Die Fußnotenalternative „für sich allein hin“ ist bezugsmehrdeutig.
    rationale: Im Deutschen kann „für sich allein“ auf Abraham bezogen werden. לְבַדְּהֶן bezieht sich feminin plural auf die Lämmer; „gesondert“ bzw. „abseits“ macht diesen Bezug klar.
