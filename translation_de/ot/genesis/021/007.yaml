base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: de
  text: 'Und sie sagte: »Wer hätte Abraham gesagt, dass Sara Kinder stillen würde?[a] Denn ich habe ihm in seinem hohen Alter einen Sohn geboren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne stillen würde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und sie sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; die übliche deutsche Wiedergabe wahrt den hebräischen Erzählfluss.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Wer hätte Abraham gesagt
  rationale: Die rhetorische Frage drückt ungläubiges Staunen über das unerwartete Geschehen aus. Der deutsche Konjunktiv II gibt diese Nuance natürlich wieder.
- source_word: הֵינִיקָה
  choice: stillen würde
  rationale: Der Hifil von ינק bezeichnet das Stillen beziehungsweise Säugen eines Kindes; »stillen« ist die natürliche gegenwärtige deutsche Formulierung.
- source_word: בָנִים
  choice: Kinder
  rationale: Wörtlich steht der Plural »Söhne«. In Verbindung mit »stillen« bezeichnet er hier idiomatisch Nachwuchs; der folgende Satz nennt das tatsächlich geborene Kind ausdrücklich einen Sohn.
- source_word: כִּי
  choice: Denn
  rationale: כִּי begründet die vorausgehende staunende Aussage und ist hier nicht kontrastiv.
- source_word: יָלַדְתִּי בֵן
  choice: ich habe ihm … einen Sohn geboren
  rationale: Die Formulierung gibt das Perfekt und das ausdrücklich männliche Kind präzise wieder. »Ihm« nimmt Abraham als den durch לִזְקֻנָיו bezeichneten Bezugspunkt idiomatisch auf.
- source_word: לִזְקֻנָיו
  choice: noch in seinem hohen Alter
  rationale: Die Präpositionalverbindung bezieht die Geburt auf Abrahams fortgeschrittenes Alter. »Noch« bringt das im Kontext liegende Staunen hervor, ohne den sachlichen Gehalt zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Verwunderung bleibt erhalten; die erklärende Funktion von כִּי wird mit »Denn« wiedergegeben.
