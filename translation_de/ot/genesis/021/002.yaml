revisions:
- from: So wurde Sara schwanger und gebar Abraham noch in seinem hohen Alter einen Sohn – zu dem festgesetzten Zeitpunkt, von dem Gott zu ihm gesprochen hatte.[a]
  to: Da wurde Sara schwanger und gebar Abraham in seinem hohen Alter einen Sohn, zur festgesetzten Zeit, über die Gott zu ihm gesprochen hatte.[a]
  rationale: Die Revision verbessert idiomatisches modernes Deutsch und entfernt die nicht ausdrücklich im Ausgangstext enthaltene Nuance von „noch“. Zugleich bleibt die syntaktische Aussage erhalten, dass die festgesetzte Zeit Gegenstand von Gottes früherer Rede an Abraham war. Die Fußnote dokumentiert die idiomatischere, leicht explizitere Wiedergabemöglichkeit, ohne eine zusätzliche theologische Aussage einzuführen.
