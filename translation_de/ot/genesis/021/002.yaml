    rationale: Die Konstruktion ist verständlich, aber weniger natürlich als „über die Gott zu ihm gesprochen hatte“. Letzteres erhält den Bezug des Relativsatzes auf die festgesetzte Zeit und vermeidet den Eindruck, Gott habe zu jener Zeit gesprochen.
