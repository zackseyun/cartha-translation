base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: de
  text: Da wurde Sara schwanger und gebar Abraham in seinem hohen Alter einen Sohn, zur festgesetzten Zeit, über die Gott zu ihm gesprochen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur festgesetzten Zeit, die Gott ihm genannt hatte.“'
    reason: Der hebräische Relativsatz kann ausdrücklich den Zeitpunkt als Gegenstand von Gottes vorheriger Rede bezeichnen; die Alternative gibt dies idiomatischer als einen von Gott genannten Zeitpunkt wieder.
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden beziehungsweise Empfangen. „Wurde schwanger“ ist im heutigen Deutsch natürlich und eindeutig.
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: ילד bezeichnet hier die Geburt. „Gebar“ ist knapp, würdig und in einer biblischen Erzählung weiterhin gut verständlich.
- source_word: לְאַבְרָהָם בֵּן
  choice: gebar Abraham … einen Sohn
  rationale: Der Dativ gibt Abraham als Vater beziehungsweise Empfänger des verheißenen Sohnes wieder; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: לִזְקֻנָיו
  choice: noch in seinem hohen Alter
  rationale: Die Wendung bezeichnet die Lebenszeit beziehungsweise den Umstand von Abrahams fortgeschrittenem Alter. „Noch“ bringt die im Kontext auffällige späte Geburt natürlich zum Ausdruck, ohne einen Zweck anzugeben.
- source_word: לַמּוֹעֵד
  choice: zu dem festgesetzten Zeitpunkt
  rationale: מוֹעֵד bezeichnet einen bestimmten, festgelegten Zeitpunkt. Die Formulierung bewahrt den Bezug auf die zuvor angekündigte Zeit.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: von dem Gott zu ihm gesprochen hatte
  rationale: Der Relativsatz bezieht sich auf den festgesetzten Zeitpunkt und verweist auf Gottes frühere Ankündigung. Die Formulierung ist natürlich und vermeidet den Eindruck, Gott habe erst zu diesem Zeitpunkt gesprochen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die gewöhnliche hebräische Gottesbezeichnung wird hier ohne strittige Namensfrage mit „Gott“ wiedergegeben.
- source_word: וַ
  choice: So
  rationale: Das einleitende Waw führt die Erzählung fort und stellt zugleich den Zusammenhang von Ankündigung und Erfüllung her. „So“ gibt diesen Folgezusammenhang im Deutschen knapp wieder.
theological_decisions:
- issue: Erfüllung der göttlichen Zusage zur angekündigten Zeit
  choice: zu dem festgesetzten Zeitpunkt, von dem Gott zu ihm gesprochen hatte
  alternative: zu dem festgesetzten Zeitpunkt, den Gott ihm genannt hatte
  rationale: Die Übersetzung erhält den Erfüllungscharakter des Verses und den Rückbezug auf Gottes frühere Rede, ohne zusätzliche Aussagen über Verheißung, Vorsehung oder die genaue Art dieser Rede einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der hebräischen Erzählfolge, vermeidet jedoch eine im Deutschen missverständliche Relativkonstruktion. Der Gedankenstrich gliedert die Zeitangabe und hebt den Zusammenhang zwischen Ankündigung und Erfüllung hervor.
