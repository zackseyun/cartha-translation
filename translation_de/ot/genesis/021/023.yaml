source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: de
  text: Und nun schwöre mir hier bei Gott, dass du weder mich noch meine Kinder noch meine Nachkommen betrügen wirst. So wie ich dir Güte erwiesen habe, sollst auch du mir und dem Land, in dem du als Fremder gelebt hast, Güte erweisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die Verknüpfung durch וְ als auch das ausdrücklich vorhandene Zeit- und Diskursadverb עַתָּה wieder.
- source_word: אִם תִּשְׁקֹר לִי
  choice: dass du ... mich ... nicht betrügen wirst
  rationale: Die hebräische Schwurformel verwendet wörtlich »wenn du mich betrügst« als verkürzte Selbstverfluchung. Im Deutschen gibt ein negativer dass-Satz den gemeinten Schwur natürlich wieder, ohne den Inhalt zu verändern.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: meine Kinder noch meine Nachkommen
  rationale: Bewahrt die zweigliedrige Bezeichnung der nachfolgenden Generationen in verständlichem modernem Deutsch; die seltenen hebräischen Verwandtschaftswörter bezeichnen Nachkommenschaft beziehungsweise spätere Nachkommen.
- source_word: כַּחֶסֶד ... תַּעֲשֶׂה
  choice: So wie ich dir Güte erwiesen habe, sollst auch du ... Güte erweisen
  rationale: חֶסֶד bezeichnet hier wohlwollende, verlässliche Güte im Verhältnis zwischen den Beteiligten. Die Wiederholung macht den Vergleich und die geforderte Gegenseitigkeit deutlich.
- source_word: הָאָרֶץ אֲשֶׁר גַּרְתָּה בָּהּ
  choice: dem Land, in dem du als Fremder gelebt hast
  rationale: גּוּר bezeichnet den Aufenthalt als Schutzbürger oder Fremder, nicht bloß neutrales Wohnen.
theological_decisions:
- issue: Verkürzte Schwur- beziehungsweise Fluchformel אִם תִּשְׁקֹר
  choice: Als Schwurinhalt mit ausdrücklicher Verneinung wiedergegeben
  alternative: 'Wörtlich: »wenn du mich betrügst«'
  rationale: Die wörtliche Form wäre im heutigen Deutschen missverständlich, weil die im Hebräischen vorausgesetzte Selbstverfluchung unausgesprochen bleibt. Die Übersetzung bewahrt die Verpflichtung des Schwurs, ohne eine zusätzliche Fluchformel einzufügen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: Bundestreue / Loyalität
  rationale: Der Kontext verlangt erwiesenes Wohlwollen und entsprechende Gegenseitigkeit, nennt aber keinen Bund ausdrücklich. »Güte« vermeidet eine konfessionell oder systematisch verengende Deutung.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. Die Wiederholung von »Güte erweisen« entspricht der hebräischen Vergleichsstruktur und hält die gegenseitige Verpflichtung klar. »Und nun« bleibt erhalten, da עַתָּה im hebräischen Text ausdrücklich steht.
