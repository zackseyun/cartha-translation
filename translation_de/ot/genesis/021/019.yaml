base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: de
  text: Da öffnete Gott ihr die Augen, und sie sah einen Brunnen mit Wasser. Sie ging hin, füllte den Wasserschlauch[a] mit Wasser und gab dem Jungen zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein Behälter aus Tierhaut, in dem man Flüssigkeit mitführte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: öffnete
  rationale: Das Verb פקח bedeutet besonders in Verbindung mit Augen „öffnen“. Die konkrete hebräische Wendung bleibt erhalten, ohne zu erklären, auf welche Weise Gott ihr Wahrnehmung schenkte.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier den einen Gott der Erzählung und steht mit einem Verb im Singular.
- source_word: עֵינֶיהָ
  choice: ihr die Augen
  rationale: Die deutsche Formulierung gibt das hebräische „ihre Augen“ in der idiomatisch üblichen Konstruktion mit Dativ wieder.
- source_word: וַתֵּרֶא
  choice: sie sah
  rationale: Die schlichte Wiedergabe entspricht dem Erzählablauf nach dem Öffnen ihrer Augen.
- source_word: בְּאֵר מָיִם
  choice: einen Brunnen mit Wasser
  rationale: Diese Wiedergabe bewahrt sowohl בְּאֵר „Brunnen“ als auch מָיִם „Wasser“ und klingt im Deutschen natürlicher als „Wasserbrunnen“.
- source_word: וַתֵּלֶךְ
  choice: Sie ging hin
  rationale: „Ging hin“ gibt die erzählerische Bewegung natürlich wieder und leitet ihre anschließende Handlung ein.
- source_word: וַתְּמַלֵּא
  choice: füllte
  rationale: Dies ist die direkte und im Deutschen natürliche Entsprechung von מלא.
- source_word: הַחֵמֶת
  choice: den Schlauch
  rationale: חֵמֶת bezeichnet einen aus Tierhaut gefertigten Flüssigkeitsbehälter. „Schlauch“ ist knapp und im biblischen Sachzusammenhang verständlich; die Fußnote verdeutlicht die historische Bedeutung.
- source_word: מַיִם
  choice: mit Wasser
  rationale: Beim deutschen Verb „füllen“ wird der Inhalt idiomatisch mit „mit“ angeschlossen.
- source_word: וַתַּשְׁקְ
  choice: gab ... zu trinken
  rationale: Der Hifil von שׁקה bedeutet „zu trinken geben“ beziehungsweise „tränken“. Die gewählte Formulierung ist natürlich und bewahrt den kausativen Sinn.
- source_word: הַנַּעַר
  choice: dem Jungen
  rationale: נַעַר bezeichnet hier Hagars Sohn Ismael. „Junge“ ist im Kontext klar, modern und altersmäßig nicht unnötig eng festgelegt.
theological_decisions:
- issue: Ob „Gott öffnete ihr die Augen“ als ausdrückliches göttliches Handeln oder lediglich als ihr eigenes Bemerken des Brunnens wiederzugeben ist
  choice: Da öffnete Gott ihr die Augen
  alternative: Gott ließ sie den Brunnen erkennen
  rationale: Der hebräische Text schreibt Gott die Handlung ausdrücklich zu und verwendet das konkrete Bild des Augenöffnens. Die Übersetzung bewahrt diese Aussage, ohne den Vorgang psychologisch oder übernatürlich näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die hebräische Augenöffnungsformel bleibt konkret erhalten; sachgeschichtlich erklärungsbedürftig ist nur „Schlauch“, daher steht der Fußnotenmarker dort.
