  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: de
  text: Darum nannte er diesen Ort Beerscheba[a], denn dort schworen die beiden einen Eid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beerscheba klingt im Hebräischen sowohl nach „Brunnen der Sieben“ als auch nach „Brunnen des Eides“; die Erklärung hier verbindet den Namen besonders mit dem dort geschworenen Eid.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die kausal-konsekutive Wendung leitet knapp und idiomatisch die Erklärung des Ortsnamens ein.
- source_word: קָרָא
  choice: nannte
  rationale: Im Zusammenhang mit einem Ortsnamen gibt „nannte“ die Bedeutung „rufen/benennen“ natürlich und präzise wieder.
- source_word: לַמָּקוֹם הַהוּא
  choice: diesen Ort
  rationale: Der Ort ist im unmittelbaren Erzählzusammenhang präsent; „diesen Ort“ bewahrt die demonstrative Bestimmtheit.
- source_word: בְּאֵר שָׁבַע
  choice: Beerscheba
  rationale: Die im Deutschen geläufige biblische Form des Ortsnamens wird beibehalten; sein hebräisches Wortspiel wird in der Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung der Namensgebung ein; „denn“ klingt hier in modernem, würdigem Deutsch natürlich.
- source_word: שָׁם
  choice: dort
  rationale: Direkte und idiomatische Wiedergabe des lokalen Adverbs.
- source_word: נִשְׁבְּעוּ
  choice: schworen einen Eid
  rationale: Der Nifal von שבע bezeichnet das Schwören beziehungsweise Ablegen eines Eides. Die ausdrückliche Wiedergabe mit „Eid“ macht den Vorgang klar und erhält den Bezug zum Wortspiel des Ortsnamens.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form hebt die zwei beteiligten Parteien hervor; „die beiden“ ist prägnant und natürlich.
theological_decisions: []
