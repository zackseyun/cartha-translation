source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: de
  text: Jahwe wandte sich Sara zu[a], wie er gesagt hatte, und Jahwe handelte für Sara, wie er gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: suchte Sara auf. Das hebräische Verb kann ausdrücken, dass Gott jemandem seine Aufmerksamkeit zuwendet, um für diese Person zu handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Hebräischen ausdrücklich stehende Gottesbezeichnung wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: פָּקַד
  choice: wandte sich … zu
  rationale: Das Verb bezeichnet hier Gottes wirksame Aufmerksamkeit für Sara. Die Wiedergabe vermeidet den im Deutschen leicht negativen Klang von „heimsuchen“ und legt das in Vers 2 genannte Ergebnis nicht vorzeitig fest.
- source_word: כַּאֲשֶׁר אָמָר
  choice: wie er gesagt hatte
  rationale: Das Plusquamperfekt verweist natürlich auf die vorausgehende Zusage und bewahrt die schlichte Bedeutung von אָמַר.
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: und Jahwe handelte für Sara
  rationale: „Handelte“ gibt das allgemeine עָשָׂה idiomatisch wieder; „für Sara“ wahrt die benefaktive Bedeutung der Präposition לְ.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: wie er es angekündigt hatte
  rationale: Die Formulierung bewahrt die leichte stilistische Abwechslung gegenüber אָמַר und macht im Deutschen verständlich, dass Gottes früheres Reden nun wirksam erfüllt wird, ohne den Inhalt in diesem Vers auszuschreiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Namensform bewahrt dies, statt ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Handelns gegenüber Sara
  choice: wirksame Zuwendung, ohne das Ergebnis in Vers 1 ausdrücklich zu benennen
  alternative: „ließ Sara schwanger werden“
  rationale: Der Zusammenhang zeigt die Erfüllung der Verheißung, doch erst der folgende Vers benennt Saras Empfängnis. Die Übersetzung wahrt diese Erzählfolge.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Aussagen bleiben erkennbar, während schwer verständliche oder missverständliche traditionelle Wendungen wie „heimsuchen“ vermieden werden.
