source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: de
  text: Steh auf, heb den Jungen hoch und halte ihn mit deiner Hand fest[a], denn ich werde ihn zu einem großen Volk machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stütze ihn mit deiner Hand«. Die hebräische Wendung kann sowohl den festen Griff als auch die dadurch gewährte Unterstützung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Steh auf
  rationale: Der feminine Singular des Imperativs von קום richtet sich an Hagar. »Steh auf« gibt den Befehl natürlich und unmittelbar wieder.
- source_word: שְׂאִ֣י
  choice: heb … hoch
  rationale: נשׂא bezeichnet hier am ehesten das Aufheben des Jungen aus seiner hilflosen Lage; die Formulierung legt nicht unnötig fest, dass Hagar ihn anschließend tragen soll.
- source_word: הַנַּעַר
  choice: den Jungen
  rationale: נַעַר kann einen Jungen oder jungen Menschen bezeichnen. »Der Junge« ist im Erzählzusammenhang natürlich und vermeidet eine unnötig genaue Altersfestlegung.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: und halte ihn mit deiner Hand fest
  rationale: Die Wendung drückt einen festen, stützenden Griff aus. Die Übersetzung bewahrt das konkrete Bild der Hand und gibt zugleich die Kraft des Verbs חזק wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die vorausgehenden Aufforderungen ein.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: ich werde ihn zu einem großen Volk machen
  rationale: Die Verbindung von שׂים mit לְ bezeichnet hier das bewirkte Ergebnis. Die deutsche Formulierung gibt die verheißene künftige Volkswerdung klar wieder.
theological_decisions:
- issue: Gottes Verheißung über Ismaels Zukunft
  choice: Die Aussage wird unmittelbar als Gottes Verheißung wiedergegeben, den Jungen zu einem großen Volk zu machen.
  alternative: Die Verheißung durch zusätzliche bundes- oder heilsgeschichtliche Begriffe näher bestimmen.
  rationale: Der hebräische Text verheißt dem Jungen eine große nationale Zukunft, erläutert aber an dieser Stelle weder den Charakter noch die heilsgeschichtliche Einordnung dieser Verheißung. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit unmittelbaren Imperativen. Die konkrete Hand-Metapher des Hebräischen bleibt erhalten; eine Fußnote wahrt die Bedeutungsbreite zwischen Festhalten und Stützen.
