  rationale: 'Die Revision ersetzt allein die im modernen Deutsch missverständliche und unnatürliche Wendung „nahm ihm eine Frau“ durch die idiomatische kontextgerechte Formulierung „suchte ihm eine Frau ... aus“. Die doppelte Stellung von „aus“ ist grammatisch erforderlich: das erste gehört zur Herkunftsangabe, das zweite zu „suchte ... aus“. Der Fußnotenanker zu „lebte“ wird an die passende Stelle gesetzt.'
