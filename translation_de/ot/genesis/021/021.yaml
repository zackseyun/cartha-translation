  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: de
  text: Er lebte[a] in der Wüste Paran, und seine Mutter suchte ihm eine Frau[b] aus dem Land Ägypten aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wohnte in der Wüste Paran.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Ehefrau“; hebräisch אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Er lebte
  rationale: ישׁב kann „sitzen“, „wohnen“, „bleiben“ oder „leben“ bedeuten. In dieser erzählerischen Zusammenfassung bezeichnet „lebte“ natürlich den Wohnort, ohne eine dauerhafte Ansiedlung stärker anzudeuten, als der hebräische Text es verlangt.
- source_word: בְּמִדְבַּר פָּארָן
  choice: in der Wüste Paran
  rationale: מִדְבָּר bezeichnet eine Wüste beziehungsweise unbesiedelte Wildnis. „Wüste Paran“ ist im Deutschen eine natürliche und traditionelle geografische Bezeichnung; Paran wird als Ortsname transliteriert.
- source_word: וַתִּקַּח
  choice: nahm
  rationale: לקח bedeutet grundlegend „nehmen“. Hier beschreibt es, wie die Mutter eine Ehepartnerin für ihren Sohn beschaffte; „nahm ihm eine Frau“ bleibt eng am Hebräischen und ist in gehobener deutscher Erzählsprache verständlich.
- source_word: לוֹ
  choice: ihm
  rationale: 'ל mit Pronominalsuffix bezeichnet hier den Begünstigten: Die Mutter nahm beziehungsweise beschaffte für ihn eine Frau.'
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Die ausdrückliche Nennung wird entsprechend dem hebräischen Text beibehalten.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Der Zusammenhang zeigt eine Heiratsvermittlung; im Deutschen kann „jemandem eine Frau nehmen“ diesen ehelichen Sinn bewahren, während eine Fußnote die Bedeutung verdeutlicht.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung gibt אֶרֶץ ausdrücklich mit „Land“ wieder und bewahrt so die volle hebräische Wendung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. „Wüste Paran“ ist idiomatischer als „Wildnis von Paran“. Die etwas gehobene Wendung „nahm ihm eine Frau“ erhält das konkrete Verb des Ausgangstextes; die Fußnote klärt den gemeinten Ehekontext.
