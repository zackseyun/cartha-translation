  text: וַ/יָּ֧גָר אַבְרָהָ֛ם בְּ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים יָמִ֥ים רַבִּֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/034.yaml
  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: de
  text: Und Abraham lebte lange Zeit als Fremder im Land der Philister.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „viele Tage“. Das hebräische Verb kann auch mit „hielt sich als Fremder auf“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: lebte … als Fremder
  rationale: Das Verb גור bezeichnet hier den Aufenthalt als Schutzbürger, Zugezogener oder Fremder. Die Wendung gibt diesen Bedeutungsaspekt in natürlichem modernem Deutsch wieder.
- source_word: בְּאֶרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet eines Volkes; „Land“ ist die natürliche und traditionsgemäße Wiedergabe.
- source_word: פְּלִשְׁתִּים
  choice: der Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung der Volksgruppe; zusammen mit אֶרֶץ ergibt sich „Land der Philister“.
- source_word: יָמִים רַבִּים
  choice: lange Zeit
  rationale: Die wörtliche Wendung „viele Tage“ bezeichnet idiomatisch einen längeren Zeitraum. „Lange Zeit“ klingt im Deutschen natürlich und bewahrt den Sinn.
- source_word: וַ
  choice: Und
  rationale: Das vorangestellte Waw führt die hebräische Erzählung fort; „Und“ bewahrt diese Verknüpfung ohne zusätzliche zeitliche Deutung.
theological_decisions:
- issue: Abrahams Status im Land der Philister
  choice: Der Fremdlingsstatus wird ausdrücklich wiedergegeben.
  alternative: „Abraham hielt sich lange im Land der Philister auf.“
  rationale: גור kann mehr als einen bloßen Aufenthalt bezeichnen und Abrahams Stellung als nicht einheimischer Bewohner hervorheben. Die Übersetzung bewahrt diesen im Kontext wichtigen Bedeutungsaspekt, ohne daraus eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lebte … als Fremder“ ist klarer als das heute seltene „weilte als Fremdling“; „lange Zeit“ gibt die hebräische Zeitangabe idiomatisch wieder.
