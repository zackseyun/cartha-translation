  source_fidelity: Die Übersetzung gibt וַיָּגָר zutreffend als einen Aufenthalt mit betontem Fremdlingsstatus wieder. „Im Land der Philister“ entspricht בְּאֶרֶץ פְּלִשְׁתִּים, und „lange Zeit“ gibt die idiomatische Zeitangabe יָמִים רַבִּים sinnvoll wieder. Das einleitende „Und“ bewahrt den narrativen Anschluss des Waw.
  naturalness: „Und Abraham lebte lange Zeit als Fremder im Land der Philister“ ist klares, modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die Stellung von „als Fremder“ ist natürlich und verständlich.
  terminology: „Philister“ ist die etablierte deutsche Bezeichnung. „als Fremder“ vermittelt den für גור relevanten Status ohne das archaische „Fremdling“ und ohne eine über das Hebräische hinausgehende rechtliche Präzisierung.
