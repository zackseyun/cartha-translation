  text: וַ/יְהִ֧י אֱלֹהִ֛ים אֶת הַ/נַּ֖עַר וַ/יִּגְדָּ֑ל וַ/יֵּ֨שֶׁב֙ בַּ/מִּדְבָּ֔ר וַ/יְהִ֖י רֹבֶ֥ה קַשָּֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: de
  text: Gott war mit dem Jungen, und er wuchs heran. Er lebte in der Wildnis und wurde ein Bogenschütze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Gott war mit dem Jungen
  rationale: Die hebräische Wendung היה את bezeichnet hier Gottes Gegenwart und Beistand. „Gott war mit dem Jungen“ gibt die Aussage natürlich wieder, ohne ihre theologischen Folgen weiter auszudeuten.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann einen Jungen oder jungen Menschen bezeichnen. „Junge“ ist im Kontext klar, modern und passend.
- source_word: וַיִּגְדָּל
  choice: er wuchs heran
  rationale: גדל bezeichnet hier Ismaels körperliche Entwicklung und Reifung. „Wuchs heran“ klingt im Deutschen natürlicher als das isolierte „wuchs“ und bleibt nahe am Sinn.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: er lebte in der Wildnis
  rationale: ישב bezeichnet hier den dauerhaften Aufenthalt; מִדְבָּר meint unbesiedeltes oder spärlich besiedeltes Land und nicht zwingend eine Sandwüste. „Wildnis“ bewahrt diese Bedeutungsbreite.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: er wurde ein Bogenschütze
  rationale: Die ungewöhnliche Verbindung bezeichnet jemanden, der mit dem Bogen schießt. „Bogenschütze“ ist die prägnante und geläufige deutsche Wiedergabe.
theological_decisions:
- issue: Formel der göttlichen Gegenwart bei Ismael
  choice: Gott war mit dem Jungen
  alternative: Gott half dem Jungen / Gott stand dem Jungen bei
  rationale: Die Übersetzung bewahrt die ausdrückliche Aussage von Gottes Gegenwart bei Ismael und reduziert sie weder auf punktuelle Hilfe noch erweitert sie sie zu einer darüber hinausgehenden dogmatischen Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Satzfolge entsprechend dem erzählerischen Stil des Hebräischen; „Wildnis“ wahrt die geografische Bedeutungsbreite von מִדְבָּר.
