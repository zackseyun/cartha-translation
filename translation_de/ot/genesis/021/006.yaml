  text: וַ/תֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖/י אֱלֹהִ֑ים כָּל הַ/שֹּׁמֵ֖עַ יִֽצְחַק לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: de
  text: 'Und Sara sagte: »Gott hat mir ein Lachen bereitet; jeder, der davon hört, wird mit mir lachen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wird über mich lachen« oder »wird für mich lachen«. Das Hebräische lässt mehrere Bedeutungsnuancen zu; im Zusammenhang ist gemeinsames freudiges Lachen mit Sara am wahrscheinlichsten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der narrativen Verbform führt die Erzählung fort. »Und Sara sagte« bewahrt den hebräischen Erzählfluss und klingt im Deutschen natürlich.
- source_word: שָׂרָה
  choice: Sara
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: צְחֹק
  choice: ein Lachen
  rationale: Das Substantiv bezeichnet Lachen. Die nominale Wiedergabe erhält die Wortverbindung zum Namen Isaak und zum Verb יִצְחַק im zweiten Satzteil.
- source_word: עָשָׂה לִי
  choice: hat mir … bereitet
  rationale: Die Wendung bedeutet wörtlich etwa »hat für mich gemacht«. »Hat mir ein Lachen bereitet« ist natürliches modernes Deutsch, bleibt dem konkreten Ausdruck nahe und vermeidet die weniger idiomatische Formulierung »hat mir ein Lachen gemacht«.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier bezeichnet אֱלֹהִים eindeutig den einen Gott, der für Sara handelt.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: jeder, der davon hört
  rationale: Die singularische Form hat distributiven Sinn. Das ergänzte »davon« macht im Deutschen deutlich, dass es um die Nachricht von diesem Geschehen geht, ohne den Sinn unnötig einzuengen.
- source_word: יִצְחַק
  choice: wird … lachen
  rationale: Das Verb gehört zur selben Wurzel wie צְחֹק und der Name Isaak. »Lachen« bewahrt dieses beabsichtigte Wortspiel besser als deutendere Wiedergaben wie »sich freuen«.
- source_word: לִי
  choice: mit mir
  rationale: 'Die Präposition kann hier mehrere Bezüge ausdrücken: mit Sara, über Sara oder für sie lachen. Im Kontext der Freude über Isaaks Geburt ist gemeinsames freudiges Lachen am wahrscheinlichsten; die echte Mehrdeutigkeit wird in der Fußnote erhalten.'
theological_decisions:
- issue: Sinn von יִצְחַק לִי im Schlusssatz
  choice: 'gemeinsames freudiges Lachen: »wird mit mir lachen«'
  alternative: »wird über mich lachen« oder »wird für mich lachen«
  rationale: Der unmittelbare Kontext beschreibt Saras Freude über die von Gott geschenkte Geburt. Daher liegt die Beteiligung anderer an ihrer Freude näher als Spott. Da die hebräische Präposition jedoch mehrere Nuancen zulässt, werden die Alternativen nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bewahrt die Wiederholung von »Lachen/lachen« und damit das hebräische Wortspiel, bleibt aber durch »bereitet« idiomatisch. Die Mehrdeutigkeit des abschließenden לִי wird transparent in der Fußnote dokumentiert.
