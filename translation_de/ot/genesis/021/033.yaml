source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: de
  text: Abraham pflanzte in Beerscheba eine Tamariske. Dort rief er den Namen Jahwes an[a], des ewigen Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort verkündete er den Namen Jahwes“ beziehungsweise „Dort rief er den Namen Jahwes aus“. Die hebräische Wendung kann im Zusammenhang der Gottesverehrung sowohl Anrufung als auch Verkündigung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „des immerwährenden Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: pflanzte
  rationale: Das Qal von נטע bezeichnet gewöhnlich das Pflanzen; im Zusammenhang mit einem Baum ist „pflanzte“ die natürliche deutsche Entsprechung.
- source_word: אֶשֶׁל
  choice: eine Tamariske
  rationale: Das singuläre אֶשֶׁל wird wahrscheinlich als Tamariske bezeichnet; diese Wiedergabe bewahrt die botanische Spezifik besser als „Baum“ oder „Hain“.
- source_word: בִּבְאֵר שָׁבַע
  choice: in Beerscheba
  rationale: Die Präposition ב bezeichnet hier den Ort; „in Beerscheba“ ist im Deutschen idiomatisch.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: Dort rief er den Namen … an
  rationale: Die Wendung קרא בשם kann im Gottesdienst Anrufung und Verkündigung umfassen. „den Namen … anrufen“ gibt die naheliegende kultische Bedeutung wieder, während eine Fußnote die echte Bedeutungsbreite wahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ transliteriert und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֵל עוֹלָם
  choice: der ewige Gott
  rationale: עוֹלָם bezeichnet hier Gottes unbegrenzte Dauer. „der ewige Gott“ ist präzise, würdig und im modernen Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der heute üblichen deutschen Transliteration.
- issue: Bedeutung der Gottesdienstformel קרא בשם יהוה
  choice: den Namen Jahwes anrufen
  alternative: den Namen Jahwes verkünden; beim Namen Jahwes ausrufen
  rationale: Im Genesis-Kontext bezeichnet die Formel häufig die gottesdienstliche Anrufung, kann aber zugleich das öffentliche Ausrufen oder Verkünden einschließen. Die Hauptfassung wählt die natürliche deutsche Wendung und dokumentiert die Mehrdeutigkeit in der Fußnote.
- issue: Bezug von אֵל עוֹלָם
  choice: 'Apposition zu Jahwe: „Jahwes, des ewigen Gottes“'
  alternative: 'eigenständige Anrufung: „Jahwe: ‚Ewiger Gott‘“'
  rationale: Die Apposition gibt den Titelausdruck natürlich wieder, ohne ihn von Jahwe als einem anderen Referenten zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im unmittelbaren Kontext erschließbare Subjekt wird als „Abraham“ genannt, um einen im Deutschen unnatürlich isolierten Pronomenbeginn zu vermeiden. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge des Hebräischen zu verändern. Alle Fußnotenmarker stehen im Haupttext.
