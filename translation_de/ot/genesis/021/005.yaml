base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: de
  text: Abraham war hundert Jahre alt, als ihm sein Sohn Isaak geboren wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und Abraham war ein Sohn von hundert Jahren, als ihm Isaak, sein Sohn, geboren wurde.“'
    reason: Die Fußnote dokumentiert die konkrete hebräische Altersformel und macht zugleich die einleitende Verknüpfung sowie die Apposition zu Isaak sichtbar.
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Das einleitende וְ knüpft den Satz an den vorherigen Erzählzusammenhang an. Im Deutschen ist diese Verknüpfung hier auch ohne ein ausdrückliches „Und“ natürlich erkennbar.
- source_word: בֶּן מְאַת שָׁנָה
  choice: war hundert Jahre alt
  rationale: Die hebräische Wendung „Sohn von hundert Jahren“ ist eine Altersangabe und wird idiomatisch sowie genau wiedergegeben.
- source_word: בְּ/הִוָּלֶד
  choice: als … geboren wurde
  rationale: Die Präposition mit dem Infinitivus constructus des Nifal bezeichnet den Zeitpunkt und bewahrt mit „geboren wurde“ den passiven Sinn.
- source_word: ל֔/וֹ
  choice: ihm
  rationale: Der Dativ gibt unmittelbar wieder, dass Isaak Abraham geboren wurde.
- source_word: אֵת יִצְחָק
  choice: Isaak
  rationale: אֵת ist hier der nicht eigens zu übersetzende Akkusativmarker; der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: בְּנֽ/וֹ
  choice: sein Sohn
  rationale: Die Apposition bezeichnet Isaak ausdrücklich als Abrahams Sohn, ohne die zusätzliche Betonung „eigener“ einzutragen.
