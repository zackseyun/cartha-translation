  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: de
  text: 'Und Gott hörte die Stimme des Jungen[a]. Da rief der Engel Gottes vom Himmel her zu Hagar und sagte zu ihr: »Was ist mit dir, Hagar? Hab keine Angst! Denn Gott hat die Stimme des Jungen gehört, dort, wo er ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Hilferuf des Jungen«; das hebräische Wort für »Stimme« kann hier den hörbaren Ruf eines Menschen in Not bezeichnen. Entsprechend auch beim zweiten Vorkommen im Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: Und Gott hörte
  rationale: שׁמע bedeutet im Qal gewöhnlich »hören«. Die Wiedergabe wahrt die Erzählfolge, ohne Gottes Reaktion bereits als Erhörung auszudeuten.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: die Stimme des Jungen
  rationale: קוֹל bezeichnet wörtlich Stimme oder Laut und kann hier kontextuell auch den Hilferuf meinen. »Stimme« bewahrt die lexikalische Offenheit und die Wiederholung beider Vorkommen.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר bezeichnet hier Ismael als jungen männlichen Menschen; »Junge« ist natürliches modernes Deutsch.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: Da rief der Engel Gottes
  rationale: Die Konstruktverbindung wird unmittelbar wiedergegeben. »Da« markiert idiomatisch die fortschreitende hebräische Erzählfolge.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: שׁמים steht morphologisch im Plural, wird in dieser Ortsangabe im Deutschen jedoch idiomatisch mit »Himmel« wiedergegeben.
- source_word: מַה לָּךְ
  choice: Was ist mit dir?
  rationale: Die hebräische Wendung fragt nach Hagars Notlage. Die deutsche Formulierung ist wörtlich nah, natürlich und weniger vorwurfsvoll als »Was stimmt mit dir nicht?«.
- source_word: אַל תִּירְאִי
  choice: Hab keine Angst!
  rationale: Der feminine Singular richtet sich unmittelbar an Hagar. »Hab keine Angst« ist im heutigen Deutsch natürlicher als »Fürchte dich nicht«, ohne den Sinn abzuschwächen.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: Denn Gott hat ... gehört
  rationale: כִּי begründet die Aufforderung, und das Perfekt lässt sich hier mit gegenwärtigem Ergebnis als deutsches Perfekt wiedergeben.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: dort, wo er ist
  rationale: Die Formulierung bewahrt sowohl den lokativen Sinn als auch das im Hebräischen ausdrücklich vorhandene שָׁם, ohne unnötige Deutung seiner Lage.
theological_decisions:
- issue: Identität und Status von מַלְאַךְ אֱלֹהִים
  choice: der Engel Gottes
  alternative: ein Engel Gottes; Gottes Engel
  rationale: Die Übersetzung bewahrt die hebräische Bezeichnung und ihre erzählerische Bestimmtheit, ohne die enge Beziehung des Boten zu Gott christologisch oder anderweitig konfessionell festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede ist klar und gegenwärtig formuliert; die Wiederholung von »die Stimme des Jungen« sowie die Spannung zwischen Gott und dem Engel Gottes bleiben erhalten.
