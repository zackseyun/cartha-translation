  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: de
  text: Und Sara sah den Sohn Hagars, der Ägypterin, die ihn Abraham geboren hatte, lachen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „spielen“ oder „spotten“. Das hebräische Partizip kann Lachen sowie spielerisches oder spöttisches Verhalten bezeichnen; der Zusammenhang kann eine feindselige Nuance nahelegen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Und Sara sah
  rationale: Das Wayyiqtol von ראה führt das nächste Ereignis der Erzählung ein. „Und Sara sah“ wahrt die schlichte Abfolge, ohne einen nicht ausdrücklich markierten Gegensatz einzutragen.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: den Sohn Hagars, der Ägypterin
  rationale: Die Status-constructus-Verbindung mit nachgestellter Herkunftsbezeichnung identifiziert den Sohn über seine Mutter. Die Apposition „der Ägypterin“ gibt הַמִּצְרִית knapp und natürlich wieder.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: den sie Abraham geboren hatte
  rationale: Der Relativsatz erinnert an Hagars bereits zurückliegende Geburt des Sohnes für Abraham. Das Plusquamperfekt bildet die zeitliche Vorordnung ab; „Abraham geboren“ ist im Deutschen eine natürliche Wiedergabe des לְ.
- source_word: מְצַחֵק
  choice: lachen
  rationale: Das Partizip von צחק kann Lachen sowie spielerisches oder spöttisches Verhalten bezeichnen. Der Infinitiv nach „sah“ gibt die hebräische Wahrnehmungskonstruktion natürlich wieder, während „lachen“ die nicht näher bestimmte Grundbedeutung offenhält.
theological_decisions:
- issue: Deutung von Ismaels Verhalten in מְצַחֵק
  choice: Im Haupttext neutral mit „lachen“ wiedergeben
  alternative: „spotten“ oder „spielen“
  rationale: Das hebräische Partizip nennt weder ein Objekt noch macht es eine feindselige Absicht ausdrücklich. Der Zusammenhang kann eine abwertende oder feindliche Nuance nahelegen, verlangt sie lexikalisch aber nicht. Die offenere Wiedergabe bewahrt die Spannung; die kontextuell möglichen Deutungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber idiomatisch; die Mehrdeutigkeit des abschließenden Partizips wird nicht vorschnell aufgelöst.
