  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: de
  text: Abraham gab seinem Sohn, der ihm geboren worden war, den Sara ihm geboren hatte, den Namen Isaak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת־שֵׁם
  choice: gab ... den Namen
  rationale: Die Verbindung קרא mit שֵׁם bezeichnet die Namensgebung. Die deutsche Wendung „jemandem den Namen geben“ bewahrt das ausdrücklich genannte „Name“, klingt aber natürlicher als eine formale Nachbildung wie „nannte den Namen“.
- source_word: בְּנוֹ
  choice: seinem Sohn
  rationale: Das Suffix bezeichnet eindeutig Abrahams Sohn; der Dativ ergibt sich aus der deutschen Konstruktion „jemandem den Namen geben“.
- source_word: הַנּוֹלַד לוֹ
  choice: der ihm geboren worden war
  rationale: Die passive Partizipialphrase wird als Relativsatz wiedergegeben. „Ihm“ erhält den relationalen Dativ, und das Plusquamperfekt macht deutlich, dass die Geburt der Namensgebung vorausging.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: den Sara ihm geboren hatte
  rationale: Der Relativsatz nennt Sara als Mutter und bewahrt den wiederholten Dativ לוֹ. Die Formulierung ist im Deutschen gehoben, aber verständlich und dem hebräischen Ausdruck eng verbunden.
- source_word: יִצְחָק
  choice: Isaak
  rationale: Dies ist die etablierte deutsche Form des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden inhaltlich überlappenden Geburtsangaben bleiben erhalten, weil ihre Wiederholung im hebräischen Text ausdrücklich vorliegt; die Satzstellung setzt „Isaak“ wie im Ausgangstext ans Ende.
