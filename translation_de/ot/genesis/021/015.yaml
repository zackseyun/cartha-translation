  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: de
  text: Als das Wasser im Wasserschlauch aufgebraucht war, warf sie den Jungen unter einen der Sträucher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: aufgebraucht war
  rationale: כלה bezeichnet hier das Zu-Ende-Gehen beziehungsweise Erschöpftsein eines Vorrats. „Aufgebraucht war“ gibt den Sinn im Deutschen natürlich wieder.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: מַיִם ist zwar der Form nach pluralisch, wird hier aber als Stoffbezeichnung gebraucht; im Deutschen ist der Singular idiomatisch.
- source_word: מִן הַחֵמֶת
  choice: im Wasserschlauch
  rationale: חֵמֶת bezeichnet einen Behälter aus Tierhaut. Zusammen mit dem Wasser ist „Wasserschlauch“ eine klare, historisch passende Wiedergabe; das hebräische מִן markiert den Vorrat im beziehungsweise aus dem Behälter.
- source_word: וַתַּשְׁלֵךְ
  choice: warf sie
  rationale: שלך ist stärker als bloßes Hinlegen oder Absetzen und bedeutet grundsätzlich „werfen“. Die direkte Wiedergabe bewahrt die Härte und Verzweiflung der Szene.
- source_word: אֶת הַיֶּלֶד
  choice: den Jungen
  rationale: יֶלֶד kann „Kind“ oder „Junge“ bedeuten. Die maskuline und erzählerisch konkrete Wiedergabe „Junge“ ist hier natürlich.
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: unter einen der Sträucher
  rationale: תַּחַת bedeutet „unter“, und שִׂיחַ bezeichnet einen Strauch oder Busch. „Sträucher“ passt in würdige moderne Erzählsprache.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Wasserschlauch“ vermeidet das im Deutschen missverständliche bloße „Schlauch“ und macht die Funktion des aus Tierhaut gefertigten Behälters deutlich. Die starke Verbwahl „warf“ bewahrt den Wortlaut und die emotionale Härte; die Fußnote nennt die kontextuell mögliche mildere Wiedergabe.
