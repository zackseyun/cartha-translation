source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: de
  text: 'Doch Gott sagte zu Abraham: »Das soll dich nicht bekümmern wegen des Jungen und deiner Sklavin. Höre auf alles, was Sara dir sagt[a]; denn durch Isaak wird dir Nachkommenschaft zugerechnet werden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Höre auf ihre Stimme«; gemeint ist: Folge dem, was Sara sagt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Denn in Isaak wird dir Nachkommenschaft genannt werden.« Die Formulierung bezeichnet die Zuordnung bzw. Benennung der Nachkommenschaft durch Isaak.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Doch Gott sagte
  rationale: Das einleitende Waw führt die Erzählung fort; »doch« gibt hier zugleich den Gegensatz zu Abrahams Kummer im vorherigen Vers wieder.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: Lass es in deinen Augen nicht schlimm sein
  rationale: Die Formulierung bewahrt das hebräische Bild und bezeichnet etwas, das Abraham als schlimm, schmerzlich oder missfällig empfindet.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר bezeichnet hier Ismael als Jungen beziehungsweise Heranwachsenden; »der Junge« ist modern und ohne altertümlichen Klang.
- source_word: אֲמָתֶךָ
  choice: deine Sklavin
  rationale: אָמָה bezeichnet eine unfreie Dienerin. »Sklavin« wahrt den im Text relevanten rechtlichen und sozialen Status Hagars, ohne ihn zu beschönigen.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: höre auf ihre Stimme
  rationale: Die Wiedergabe erhält die konkrete hebräische Wendung, die idiomatisch bedeutet, Saras Worten Folge zu leisten.
- source_word: בְּיִצְחָק
  choice: durch Isaak
  rationale: Die Präposition bezeichnet hier Isaak als denjenigen, durch den die Abraham zugeordnete Linie bestimmt wird. »Durch« ist im Deutschen klarer als das missverständliche »in Isaak«.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: wird dir Nachkommenschaft zugerechnet werden
  rationale: Das passive קרא mit לְךָ bezeichnet hier die Benennung beziehungsweise Zuordnung von Nachkommenschaft zu Abraham. »Zugerechnet« macht diese Beziehung natürlich verständlich, ohne die Aussage auf bloße biologische Abstammung zu verengen.
- source_word: זָרַע
  choice: Nachkommenschaft
  rationale: Das deutsche Kollektivum entspricht dem kollektiven Singular זֶרַע besser als ein ausdrücklich pluralisches »Nachkommen« und klingt natürlicher als »Same«.
theological_decisions:
- issue: Sozialer Status Hagars
  choice: deine Sklavin
  alternative: deine Dienerin / deine Magd
  rationale: Der Ausgangstext bezeichnet Hagar anhand ihres unfreien Status. Die Übersetzung wahrt diese belastende soziale Realität, ohne daraus eine darüber hinausgehende Aussage abzuleiten.
- issue: Saras Worten folgen
  choice: höre auf ihre Stimme
  alternative: gehorche ihr / höre auf sie
  rationale: Die bildhafte Wendung bleibt erhalten; eine Fußnote erläutert ihre idiomatische Bedeutung. So wird die Aussage nicht unnötig zum stärkeren Begriff des Gehorsams zugespitzt.
- issue: Bestimmung der Abraham zugerechneten Linie
  choice: durch Isaak wird dir Nachkommenschaft zugerechnet werden
  alternative: in Isaak wird dir Nachkommenschaft genannt werden / durch Isaak wird deine Nachkommenschaft benannt werden
  rationale: Die Wiedergabe macht die Zuordnung der verheißenen Linie durch Isaak deutlich, ohne Abrahams biologische Beziehung zu Ismael zu verneinen. Zugleich vermeidet sie das im Deutschen missverständliche »nach dir benannt«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Bilder »in deinen Augen« und »auf ihre Stimme hören« bleiben bewusst erhalten; die ungewöhnliche Wendung im Verheißungssatz wird für heutige Leser maßvoll verdeutlicht.
