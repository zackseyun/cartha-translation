  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: de
  text: Und der Mensch[a] nannte seine Frau Eva, denn sie war die Mutter aller Lebenden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Adam«. Im Hebräischen steht hier jedoch »der Mensch« (ha’adam) mit dem bestimmten Artikel.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »Mutter aller Lebewesen« oder »Mutter aller, die leben«. Wörtlich: »Mutter aller Lebenden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם
  choice: nannte
  rationale: Die hebräische Namensgebungsformel lautet wörtlich etwa »rief den Namen seiner Frau Eva«. Im heutigen Deutschen gibt »nannte seine Frau Eva« den Vorgang natürlich und präzise wieder.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Das Substantiv steht mit dem bestimmten Artikel. Daher wird es hier beschreibend und nicht als der artikellose Eigenname »Adam« wiedergegeben.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: אִשָּׁה bezeichnet in diesem Zusammenhang die Ehefrau des Mannes; »seine Frau« ist die natürliche deutsche Entsprechung.
- source_word: חַוָּה
  choice: Eva
  rationale: »Eva« ist die im Deutschen etablierte Form des hebräischen Personennamens חַוָּה.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die Namensgebung ein. »Denn« wahrt den erklärenden Zusammenhang in gehobenem, natürlichem Deutsch.
- source_word: הָיְתָה
  choice: war
  rationale: Die Form von היה bezeichnet hier am ehesten einen Zustand; die einfache Vergangenheitsform entspricht dem hebräischen Wortlaut, ohne einen Übergang ausdrücklich hineinzulesen.
- source_word: אֵם כָּל חָי
  choice: Mutter aller Lebenden
  rationale: Die kompakte Formulierung bewahrt das substantivierte Adjektiv חָי und lässt dessen genauen Umfang ebenso offen wie das Hebräische.
theological_decisions:
- issue: Ob הָאָדָם als Eigenname »Adam« oder als Bezeichnung »der Mensch« zu verstehen ist
  choice: der Mensch
  alternative: Adam
  rationale: Der bestimmte Artikel spricht deutlich für die Bezeichnung »der Mensch«. Die Übersetzung bewahrt diese grammatische Nuance, ohne die Identität der handelnden Person zu bestreiten.
- issue: Umfang von אֵם כָּל חָי
  choice: Mutter aller Lebenden
  alternative: Mutter aller Lebewesen / Mutter jedes Lebenden
  rationale: Der hebräische Ausdruck ist knapp und lässt den Bezugsumfang offen. Die Übersetzung grenzt ihn deshalb weder ausdrücklich auf Menschen ein noch weitet sie ihn ausdrücklich auf sämtliche Lebewesen aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Namensgebungsformel »nannte seine Frau Eva« vermeidet eine unnatürliche wörtliche Nachbildung, während »der Mensch« und »Mutter aller Lebenden« die wesentlichen Formen und Offenheiten des Hebräischen bewahren.
