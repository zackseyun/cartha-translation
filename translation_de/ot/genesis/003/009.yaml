  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: de
  text: 'Da rief Jahwe Gott den Mann und sagte zu ihm: „Wo bist du?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief
  rationale: Das Qal-Wayyiqtol führt die Erzählung fort. „Da rief“ gibt sowohl die narrative Abfolge als auch die Grundbedeutung von קרא natürlich wieder.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben; zusammen mit אֱלֹהִים entsteht die klare Bezeichnung „Jahwe Gott“.
- source_word: אֶל הָאָדָם
  choice: den Mann
  rationale: Bei „jemanden rufen“ verlangt idiomatisches Deutsch den Akkusativ. הָאָדָם bezeichnet hier den konkret angesprochenen männlichen Menschen.
- source_word: וַיֹּאמֶר לוֹ
  choice: und fragte ihn
  rationale: Wörtlich steht „und sagte zu ihm“. Da unmittelbar eine direkte Frage folgt, gibt „fragte ihn“ die kommunikative Funktion im Deutschen knapp und natürlich wieder.
- source_word: אַיֶּכָּה
  choice: Wo bist du?
  rationale: Das Fragewort mit Suffix der 2. Person Singular richtet eine unmittelbare Ortsfrage an den Mann; „Wo bist du?“ entspricht Form und Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ macht diesen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Referent von הָאָדָם
  choice: den Mann
  alternative: den Menschen
  rationale: Im unmittelbaren Zusammenhang wird eine bestimmte männliche Einzelperson angesprochen. „Den Mann“ bewahrt diesen konkreten Bezug; „den Menschen“ wäre lexikalisch möglich, könnte hier aber allgemeiner verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die direkte Frage bewahren die Eindringlichkeit des hebräischen Erzähltexts.
