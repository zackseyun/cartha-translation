base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: de
  text: 'Da sagte er: »Ich hörte deine Stimme[a] im Garten. Ich bekam Angst, weil ich nackt bin, und versteckte mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deinen Laut; das hebräische Wort kann sowohl »Stimme« als auch »Laut« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Gibt das narrative Wayyiqtol in natürlichem modernem Deutsch wieder, ohne mehr als die Abfolge der Erzählung auszudrücken.
- source_word: אֶת קֹלְךָ
  choice: deine Stimme
  rationale: קוֹל kann »Stimme«, »Laut« oder »Geräusch« bezeichnen. »Deine Stimme« ist hier idiomatisches Deutsch; die breitere Bedeutung bleibt in der Fußnote sichtbar.
- source_word: שָׁמַעְתִּי בַּגָּן
  choice: Ich hörte … im Garten
  rationale: Direkte und natürliche Wiedergabe des Verbs שמע und der bereits bestimmten Ortsangabe.
- source_word: וָאִירָא
  choice: Ich bekam Angst
  rationale: Drückt das Einsetzen der Furcht im Erzählzusammenhang idiomatisch aus.
- source_word: כִּי עֵירֹם אָנֹכִי
  choice: weil ich nackt bin
  rationale: כִּי ist kausal. Das Hebräische hat einen zeitlich nicht ausdrücklich markierten Nominalsatz; das Präsens wahrt Adams weiterhin bestehenden Zustand in der direkten Rede.
- source_word: וָאֵחָבֵא
  choice: und versteckte mich
  rationale: Gibt den reflexiven Sinn des Verbs knapp und natürlich wieder, ohne die bloße Verknüpfung ausdrücklich als Folgerelation auszudeuten.
theological_decisions:
- issue: Bedeutung von קוֹל im Zusammenhang mit Gottes Gegenwart
  choice: deine Stimme
  alternative: dein Geräusch; den Laut von dir
  rationale: Der Kontext kann sowohl an eine Stimme als auch allgemeiner an ein hörbares Geräusch denken lassen. Die idiomatische Hauptübersetzung legt sich auf »Stimme« fest, während die Fußnote die echte lexikalische Offenheit des Hebräischen bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Rede. Kurze Sätze erhalten die schlichte Erzählweise; das Präsens »bin« bewahrt die zeitliche Offenheit des hebräischen Nominalsatzes.
