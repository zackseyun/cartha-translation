  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: de
  text: 'Und der Mann sagte: „Die Frau, die du mir gegeben hast und die bei mir ist – sie gab mir von der Frucht des Baumes[a], und ich aß.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Baum“. „Frucht“ ist im Hebräischen nicht ausdrücklich genannt, wird jedoch durch den Zusammenhang vorausgesetzt.'
    reason: Die Ergänzung macht die im Hebräischen vorhandene Ellipse im Deutschen eindeutig und transparent.
lexical_decisions:
- source_word: הָאָדָם
  choice: der Mann
  rationale: Im Kontext bezeichnet der Ausdruck den einzelnen männlichen Menschen, nicht die Menschheit allgemein.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Dies gibt die unmittelbare Bezeichnung der Frau direkt wieder; „Ehefrau“ wäre hier stärker festlegend als der hebräische Wortlaut.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: die du mir zur Seite gegeben hast
  rationale: Die Wendung gibt das Beisammensein idiomatisch und würdevoll wieder, ohne die im Satz liegende Anspielung auf Gottes Handeln abzuschwächen.
- source_word: הִוא
  choice: sie
  rationale: Das selbstständige Pronomen wird ausdrücklich wiedergegeben; die Satzstellung nach dem Gedankenstrich bewahrt seine Hervorhebung.
- source_word: נָתְנָה לִי מִן הָעֵץ
  choice: sie gab mir von dem Baum
  rationale: Die ungewöhnliche, aber im Deutschen verständliche Formulierung bewahrt, dass „Frucht“ im Hebräischen nicht ausdrücklich steht.
- source_word: וָאֹכֵל
  choice: und ich aß
  rationale: Die schlichte narrative Folge wird beibehalten, ohne durch „deshalb“ eine ausdrücklichere Rechtfertigung einzutragen.
theological_decisions:
- issue: Mögliche Schuldverschiebung auf die Frau und mittelbar auf Gott
  choice: „die du mir zur Seite gegeben hast“ unverändert in der Aussage stehen lassen
  alternative: „die Frau bei mir“ oder eine abschwächende Umschreibung
  rationale: Die Antwort des Mannes stellt Gottes Gabe ausdrücklich heraus. Die Übersetzung bewahrt diese Spannung, ohne den Vorwurf zu verstärken oder abzumildern.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit natürlicher Satzführung. Der Gedankenstrich macht die Hervorhebung des selbstständigen hebräischen Pronomens sichtbar. Die knappe Formulierung „von dem Baum“ folgt bewusst der Ellipse des Ausgangstextes.
