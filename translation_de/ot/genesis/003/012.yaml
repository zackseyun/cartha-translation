    issue: „Sie gab mir von dem Baum“ ist im Deutschen semantisch unklar und unnatürlich.
    rationale: Anders als im Hebräischen kann die deutsche Wendung den Baum als gegebenen Gegenstand verstehen lassen. Der Kontext meint das zum Essen Gegebene; „Frucht“ macht dies verständlich, muss aber als nicht ausdrücklich im hebräischen Wortlaut stehende Ergänzung kenntlich gemacht werden.
  - severity: low
    issue: „Die du mir zur Seite gegeben hast“ ist sprachlich holprig.
    rationale: Die Kollokation ist im heutigen Standarddeutsch weniger idiomatisch als eine explizite Wiedergabe des Beisammenseins. Die Revision erhält sowohl Gottes Geben als auch das „bei mir“ des hebräischen Ausdrucks.
