reference: Genesis 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: de
  text: Und Jahwe Gott machte für den Menschen und seine Frau Gewänder aus Fell[b][a] und bekleidete sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Adam und seine Frau“. Das hebräische אָדָם kann je nach Zusammenhang als Eigenname „Adam“ oder als Bezeichnung „Mensch“ verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Leibröcke aus Fell“. Das hebräische Wort bezeichnet ein den Körper bedeckendes Kleidungsstück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהִים steht dazu in Apposition. So bleibt der persönliche Name erhalten.
- source_word: לְאָדָם
  choice: für den Menschen
  rationale: אָדָם bezeichnet hier den einzelnen männlichen Menschen im Gegenüber zu seiner Frau. „Der Mensch“ bewahrt zugleich die im Hebräischen noch vorhandene Offenheit gegenüber dem Eigennamen Adam.
- source_word: וּלְאִשְׁתּוֹ
  choice: und seine Frau
  rationale: אִשָּׁה mit dem Suffix der 3. Person Singular bedeutet in diesem ehelichen Zusammenhang natürlich „seine Frau“.
- source_word: כָּתְנוֹת עוֹר
  choice: Gewänder aus Fell
  rationale: כָּתְנוֹת bezeichnet körperbedeckende Kleidungsstücke, während עוֹר Tierhaut oder Fell bezeichnet. Die Formulierung ist natürlich und legt die genaue Machart nicht unnötig fest.
- source_word: וַיַּעַשׂ
  choice: machte
  rationale: עשה ist das gewöhnliche Verb für „machen“; die schlichte Wiedergabe vermeidet eine unnötige Ausschmückung.
- source_word: וַיַּלְבִּשֵׁם
  choice: und bekleidete sie
  rationale: Der Hifil von לבש bedeutet, jemanden etwas tragen zu lassen beziehungsweise ihn zu bekleiden. „Bekleidete sie“ erhält den würdevollen Ton und die kausative Bedeutung.
theological_decisions:
- issue: Ist אָדָם als Eigenname oder als Gattungsbezeichnung zu verstehen?
  choice: 'Gattungsbezeichnung: „der Mensch“'
  alternative: 'Eigenname: „Adam“'
  rationale: Im unmittelbaren Zusammenhang wird der männliche Mensch seiner Frau gegenübergestellt. Zugleich kann אָדָם bereits als Eigenname verstanden werden. Der Haupttext hält die noch vorhandene literarische Offenheit fest; die alternative Lesart wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge folgt dem Hebräischen eng, bleibt aber im Deutschen natürlich. Die Fußnotenmarker stehen unmittelbar nach der mehrdeutigen Wortgruppe; ihre Reihenfolge entspricht den zugehörigen Ausdrücken.
