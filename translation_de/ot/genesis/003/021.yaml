  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und alle wesentlichen Elemente zuverlässig wieder: Jahwe Gott handelt, die Kleidung ist für den Mann/die menschliche Person und seine Frau bestimmt, sie besteht aus עור, und Gott bekleidet beide. „Für den Menschen“ bewahrt die im Kontext mögliche Spannung zwischen Gattungsbezeichnung und Eigenname angemessen.'
  naturalness: „Und Jahwe Gott machte für den Menschen und seine Frau Gewänder aus Fell und bekleidete sie“ ist natürliches modernes Standarddeutsch mit passendem zurückhaltend-biblischem Register. „Gewänder aus Fell“ ist als Wiedergabe von כָּתְנוֹת עוֹר idiomatisch und nicht übermäßig spezifizierend.
  terminology: „Jahwe Gott“ gibt יהוה אלהים sachgerecht wieder. „Seine Frau“, „Gewänder“ und „bekleidete sie“ entsprechen dem Kontext und der Bedeutung der hebräischen Ausdrücke. Die Fußnoten dokumentieren sowohl die Adam-/Mensch-Mehrdeutigkeit als auch die engere Möglichkeit „Leibröcke“ angemessen.
