  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: de
  text: Er[a] wird dir Dornen und Disteln hervorbringen[b], und du wirst die Pflanzen des Feldes[c] essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Er“ bezieht sich auf den Erdboden im vorherigen Vers.
    reason: antecedent_clarification
  - marker: b
    text: 'Auch: „wird dir Dornen und Disteln sprießen lassen“; das hebräische Verb ist kausativ.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „den Bewuchs des Feldes“; traditionell: „das Kraut des Feldes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ וְדַרְדַּר
  choice: Dornen und Disteln
  rationale: Die geläufige Wortpaarung bezeichnet zwei Arten stachligen Bewuchses, ohne botanische Arten genauer festzulegen, als es der hebräische Text erlaubt.
- source_word: תַּצְמִיחַ לָךְ
  choice: wird dir … hervorbringen
  rationale: „Hervorbringen“ gibt den kausativen Sinn des Hifil von צמח in natürlichem Deutsch wieder; „dir“ bewahrt לָךְ und unterstreicht, dass dieser Bewuchs dem Menschen zum beschwerlichen Widerstand wird.
- source_word: וְאָכַלְתָּ
  choice: und du wirst … essen
  rationale: Die Form setzt hier die angekündigte Folge fort; das deutsche Futur entspricht dem Zusammenhang und klingt natürlich.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: die Pflanzen des Feldes
  rationale: עֵשֶׂב bezeichnet allgemein pflanzlichen Bewuchs und nicht nur Gras oder Küchenkräuter. „Pflanzen“ ist verständlich und bewahrt zusammen mit „des Feldes“ die Weite des Ausdrucks.
theological_decisions:
- issue: Bezugswort des femininischen Singularverbs תַּצְמִיחַ
  choice: Das Pronomen „Er“ bezieht sich auf den Erdboden aus Vers 17.
  alternative: Das Subjekt ausdrücklich als „der Erdboden“ wiederholen oder unpersönlich formulieren.
  rationale: Die feminine Verbform verweist im Hebräischen natürlich auf הָאֲדָמָה („Erdboden“) im vorherigen Vers. Das deutsche maskuline Pronomen richtet sich nach dem grammatischen Geschlecht von „Erdboden“ und bewahrt zugleich den rückverweisenden Charakter des Originals.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und der Rückverweis auf den Erdboden bleiben erhalten; die kausative Aussage wird idiomatisch mit „hervorbringen“ ausgedrückt.
