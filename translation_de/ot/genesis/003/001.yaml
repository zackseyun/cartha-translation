base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: de
  text: 'Die Schlange aber war listiger[a] als alle Tiere des Feldes, die Jahwe Gott gemacht hatte. Sie sagte zu der Frau: »Hat Gott[b] wirklich gesagt: ›Ihr dürft von keinem Baum[c] im Garten essen‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »klüger« beziehungsweise »verschlagener«. Das hebräische Wort kann je nach Zusammenhang auch Umsicht oder Klugheit bezeichnen; hier erhält es durch die folgende Rede einen täuschenden Beiklang.'
    reason: lexical_alternative
  - marker: b
    text: Der Erzähler sagt »Jahwe Gott«, die Schlange dagegen nur »Gott«. Damit bleibt der Wechsel in der hebräischen Wortwahl erhalten.
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: »Ihr sollt nicht von jedem Baum des Gartens essen?« Die hebräische Formulierung lässt unterschiedliche Abbildungen des Skopus zu; »von keinem Baum« gibt die Übertreibung der Frage im Deutschen am natürlichsten wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Die Schlange aber
  rationale: Das Substantiv bezeichnet die Schlange. Das vorangestellte וְ verbindet mit dem Vorhergehenden; deutsches »aber« markiert hier natürlich den Szenenwechsel und den Kontrast, ohne ein nicht vorhandenes zeitliches »nun« einzuführen.
- source_word: עָרוּם
  choice: listiger
  rationale: עָרוּם kann je nach Zusammenhang klug, umsichtig, verschlagen oder listig bedeuten. Wegen der unmittelbar folgenden irreführenden Frage gibt »listig« die negative Färbung wieder; der Komparativ folgt aus מִכֹּל.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: als alle Tiere des Feldes
  rationale: Die Präposition מִן bildet mit dem Adjektiv einen Vergleich. »Tiere des Feldes« wahrt die konkrete hebräische Bezeichnung und ist im Deutschen verständlich.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Die Verbindung bewahrt sowohl den Gottesnamen יהוה als auch אֱלֹהִים und folgt der vorgegebenen Wiedergabe des Tetragramms als »Jahwe«.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Sie sagte zu der Frau
  rationale: Das grammatische Geschlecht von »Schlange« ist im Deutschen feminin; daher ist »sie« der natürliche Rückbezug. »Die Frau« bewahrt die Bezeichnung des Textes, ohne vorzeitig den Namen Eva einzusetzen.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Hat Gott wirklich gesagt
  rationale: אַף כִּי leitet hier eine skeptisch-zuspitzende Frage ein. »Wirklich« gibt deren insinuierenden Ton in natürlichem Deutsch wieder. Der Wechsel vom erzählerischen »Jahwe Gott« zum bloßen »Gott« bleibt erhalten.
- source_word: לֹא תֹאכְלוּ
  choice: ihr dürft ... nicht essen
  rationale: Die verneinte Verbform gibt das Verbot wieder. Im zitierten Fragesatz ist »dürft ... nicht« idiomatisches modernes Deutsch und erhält den Plural der hebräischen Anrede.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: von keinem Baum im Garten
  rationale: Unter der Negation wird מִכֹּל im Deutschen natürlich mit »von keinem« wiedergegeben. So tritt die Übertreibung der Schlange klar hervor; »im Garten« ist die geläufige deutsche Ortsbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, während אֱלֹהִים mit »Gott« übersetzt wird. Dadurch bleibt zugleich der auffällige Wechsel zu bloßem »Gott« in der Rede der Schlange sichtbar.
- issue: Moralische Färbung von עָרוּם
  choice: listig
  alternative: klug / verschlagen
  rationale: Das Wort ist an sich kontextabhängig und kann auch positiv verstandene Klugheit bezeichnen. Hier legt die folgende verfälschende Frage eine negative Nuance nahe, ohne zusätzliche spätere theologische Deutungen in den Vers einzutragen.
- issue: Umfang des Verbots in der Frage der Schlange
  choice: von keinem Baum
  alternative: nicht von jedem Baum
  rationale: Die hebräische Verbindung von Negation und מִכֹּל kann formal unterschiedlich abgebildet werden. Im Kontext gibt »von keinem Baum« die rhetorische Überzeichnung des ursprünglichen Gebots am klarsten wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Der Gottesname wird als »Jahwe« wiedergegeben. Die direkte Rede wahrt den Plural der Anrede und den rhetorisch-skeptischen Ton. Alle Fußnotenmarker stehen unmittelbar an der jeweils erläuterten Textstelle.
