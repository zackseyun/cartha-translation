    issue: Inkonsistente Fußnoten im englischen POB-Audit-Trail
    rationale: 'Die englischen Marker scheinen vertauscht: An [a] bei „were opened“ steht eine Alternative zu „coverings“, und an [b] bei „naked“ eine frühere Wiedergabe zu „made coverings“. Dies betrifft nicht den deutschen Entwurf; dessen Fußnote ist korrekt verankert.'
