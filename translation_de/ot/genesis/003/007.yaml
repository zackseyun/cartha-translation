  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: de
  text: Da wurden ihnen beiden die Augen geöffnet, und sie erkannten, dass sie nackt waren. Sie nähten Feigenblätter zusammen und machten sich daraus Schurze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Lendenschurze; wörtlich etwa: etwas um den Leib Gebundenes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: wurden geöffnet
  rationale: Die Nifal-Form wird passivisch wiedergegeben und bewahrt die hebräische Wendung, ohne die Art der neuen Wahrnehmung auszudeuten.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: ihnen beiden die Augen
  rationale: Diese natürliche deutsche Konstruktion erhält die ausdrückliche Betonung, dass beide betroffen sind.
- source_word: וַיֵּדְעוּ
  choice: sie erkannten
  rationale: Im Kontext bezeichnet ידע das bewusste Erfassen ihres Zustands. „Erkannten“ ist im Deutschen natürlicher als „wussten“, ohne zusätzliche Scham oder Gewissensdeutung einzutragen.
- source_word: עֵירֻמִּם
  choice: nackt
  rationale: Die direkte und übliche Entsprechung bewahrt den Bezug zu Genesis 2,25.
- source_word: וַיִּתְפְּרוּ
  choice: sie nähten ... zusammen
  rationale: „Nähen“ gibt die konkrete Handlung direkt wieder; „zusammen“ macht im Deutschen idiomatisch deutlich, dass aus den Blättern ein Kleidungsstück entstand.
- source_word: עֲלֵה תְאֵנָה
  choice: Feigenblätter
  rationale: Die deutsche Zusammensetzung ist die natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: machten sich daraus
  rationale: „Sich“ erhält den reflexiven Nutzen der hebräischen Präpositionalphrase; „daraus“ stellt natürlich den Bezug zu den zusammengenähten Blättern her.
- source_word: חֲגֹרֹת
  choice: Schurze
  rationale: Das Substantiv bezeichnet um den Körper beziehungsweise die Hüften gebundene Kleidungsstücke. „Schurze“ ist konkreter und lexikalisch näher als das unspezifische „Bedeckungen“, ohne die Form auf einen modernen Gebrauchsgegenstand festzulegen.
theological_decisions:
- issue: Verhältnis der geöffneten Augen zu Scham und moralischer Erkenntnis
  choice: 'Der Vers wird beschreibend wiedergegeben: Ihre Augen wurden geöffnet, sie erkannten ihre Nacktheit und fertigten Schurze an.'
  alternative: Ausdeutende Formulierungen wie „sie schämten sich“ oder „ihr Gewissen erwachte“.
  rationale: Scham und veränderte Selbstwahrnehmung liegen im Zusammenhang nahe, werden in diesem Vers aber nicht ausdrücklich benannt. Die Übersetzung bewahrt daher die erzählerische und theologische Spannung.
- issue: Genaue Gestalt von חֲגֹרֹת
  choice: Schurze
  alternative: Gürtel, Lendenschurze oder Bedeckungen
  rationale: Das hebräische Wort legt etwas um den Leib Gebundenes nahe, bestimmt dessen genaue Gestalt aber nicht. Die Fußnote hält die verbleibende lexikalische Bandbreite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch. „Da“ nimmt die hebräische Fortführung natürlich auf; ausdrücklich theologische oder psychologische Deutungen werden vermieden.
