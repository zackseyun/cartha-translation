  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: de
  text: Im Schweiß deines Angesichts[a] wirst du Brot essen, bis du zum Erdboden zurückkehrst; denn von ihm wurdest du genommen. Denn Staub bist du, und zum Staub wirst du zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „Im Schweiß deiner Stirn“. Wörtlich steht im Hebräischen: „im Schweiß deines Angesichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: Im Schweiß deines Angesichts
  rationale: 'Die Wendung gibt das hebräische Bild eng wieder: בְּ bezeichnet hier den begleitenden Umstand bzw. das Mittel, זֵעָה den Schweiß und אַפֶּיךָ wörtlich das Angesicht. Die geläufigere deutsche Formulierung mit „Stirn“ wird als Alternative in der Fußnote genannt.'
- source_word: תֹּאכַל לֶחֶם
  choice: wirst du Brot essen
  rationale: לֶחֶם bezeichnet wörtlich „Brot“, kann hier aber zugleich allgemein für den Lebensunterhalt stehen. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: bis du zum Erdboden zurückkehrst
  rationale: אֲדָמָה meint Boden bzw. Erde. „Erdboden“ ist im Deutschen natürlich, bezeichnet hier den Stoff und Ort der menschlichen Herkunft und bewahrt den Zusammenhang mit der Erschaffung des Menschen.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: denn von ihm bist du genommen
  rationale: Das erste כִּי leitet die Begründung für die Rückkehr zum Erdboden ein. Das Passiv „bist du genommen“ entspricht der Pual-Form לֻקָּחְתָּ; das Pronomen bezieht sich auf den im Deutschen maskulinen „Erdboden“.
- source_word: עָפָר
  choice: Staub
  rationale: „Staub“ ist die präzise und traditionsübergreifend verständliche Wiedergabe von עָפָר in der Aussage über Herkunft, Vergänglichkeit und Tod.
- source_word: תָּשׁוּב
  choice: wirst du zurückkehren
  rationale: Das Imperfekt kündigt die gewisse künftige Folge an. „Wirst du zurückkehren“ ist modernes Deutsch und bewahrt den feierlich-ernsten Ton ohne archaische Modalität.
theological_decisions:
- issue: Sterblichkeit und stoffliche Herkunft des Menschen
  choice: Der Vers kündigt die leibliche Rückkehr des Menschen zum Erdboden bzw. Staub an, von dem er genommen wurde.
  alternative: Eine ausschließlich bildliche Deutung als Erniedrigung, ohne Bezug auf den körperlichen Tod.
  rationale: Der unmittelbare Zusammenhang sowie die Verbindung von אֲדָמָה („Erdboden“) und עָפָר („Staub“) sprechen deutlich für Sterblichkeit und körperliche Rückkehr zur Erde. Weitergehende spätere Lehrentwicklungen werden nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener hebräischer Bildsprache. Die wiederholte Rückkehr-Formulierung und die beiden begründenden כִּי-Sätze werden klar und feierlich wiedergegeben; „denn“ eignet sich im Deutschen an beiden Stellen und bewahrt die argumentative Verkettung.
