    rationale: לֻקָּחְתָּ ist ein Perfekt im Passiv und verweist auf die bereits erfolgte Entnahme aus dem Erdboden. „Wurdest du genommen“ gibt diesen Bezug im modernen Deutsch klarer wieder.
  - severity: low
    issue: Formulierung der idiomatischen Fußnotenalternative
    rationale: „Mit dem Schweiß auf deiner Stirn“ ist nicht die geläufige deutsche Entsprechung. „Im Schweiß deiner Stirn“ ist idiomatischer und bewahrt die Aussage als Alternative zur bildnahen Hauptfassung.
