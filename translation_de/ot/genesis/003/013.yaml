base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: de
  text: 'Da sagte Jahwe Gott zu der Frau: „Was hast du da getan?“ Die Frau antwortete: „Die Schlange hat mich getäuscht[a], und ich habe gegessen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „irregeführt“ oder „verführt“. Das hebräische Verb bezeichnet eine Täuschung beziehungsweise Irreführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: In der Verbindung יְהוָה אֱלֹהִים ergibt „Jahwe, Gott“ eine verständliche und zugleich formal nahe Wiedergabe beider Bezeichnungen.
- source_word: לָאִשָּׁה
  choice: zu der Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten; hier entspricht „die Frau“ der fortlaufenden Erzählbezeichnung, ohne den ehelichen Aspekt unnötig hervorzuheben.
- source_word: מַה זֹּאת עָשִׂית
  choice: Was hast du da getan?
  rationale: Das idiomatische deutsche „da“ gibt die demonstrative Nuance von זֹּאת wieder, ohne die Frage kausal als „Warum?“ umzudeuten.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: „Schlange“ ist die natürliche moderne deutsche Bezeichnung und bewahrt die literarische und theologische Bedeutung der Gestalt im Kontext.
- source_word: הִשִּׁיאַנִי
  choice: hat mich getäuscht
  rationale: Das Verb bezeichnet Irreführung oder Täuschung. „Getäuscht“ ist klar, modern und weniger umgangssprachlich als „hereingelegt“.
- source_word: וָאֹכֵל
  choice: und ich habe gegessen
  rationale: Die koordinierende Folge wird ohne zusätzliche kausale Deutung wiedergegeben; das Perfekt klingt in direkter moderner Rede natürlich.
theological_decisions:
- issue: Aussage über das Handeln der Schlange
  choice: Die Schlange hat mich getäuscht
  alternative: Die Schlange hat mich verführt / irregeführt
  rationale: „Getäuscht“ bewahrt den Sinn einer irreführenden Täuschung, ohne zusätzliche sexuelle, psychologische oder konfessionell geprägte Bedeutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und erzählerisch. „Was hast du da getan?“ ist idiomatisch und erhält die nachdrückliche demonstrative Nuance des Hebräischen.
