base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: de
  text: Da schickte Jahwe Gott ihn aus dem Garten Eden fort, um den Erdboden zu bearbeiten, von dem er genommen worden war[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bebaute“. Das hebräische Verb kann „arbeiten“, „dienen“ oder in diesem Zusammenhang „bebauen/bearbeiten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: Da schickte ihn … fort
  rationale: Das Piel von שׁלח bezeichnet hier das Wegschicken aus dem Garten. „Fortschicken“ gibt die Entfernung wieder, ohne die stärkere Bedeutung „vertreiben“ vorwegzunehmen, die im folgenden Vers mit גרשׁ ausgedrückt wird.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Verbindung mit אֱלֹהִים bleibt entsprechend der hebräischen Wortfolge erhalten.
- source_word: מִגַּן עֵדֶן
  choice: aus dem Garten Eden
  rationale: מִן bezeichnet die Trennung von einem Ort. „Aus dem Garten Eden“ ist im Deutschen natürlich und bewahrt die Ortsbezeichnung.
- source_word: לַעֲבֹד
  choice: damit er … bearbeitete
  rationale: עבד kann „arbeiten“, „dienen“ oder bei einem Ackerboden „bearbeiten/bebauen“ bedeuten. Die Zweckangabe mit „damit“ gibt den Infinitiv mit לְ natürlich wieder; „bearbeiten“ bleibt nah am breiten Bedeutungsumfang.
- source_word: אֶת הָאֲדָמָה
  choice: den Erdboden
  rationale: „Erdboden“ bezeichnet hier den Boden, aus dem der Mensch genommen wurde, und erhält den erzählerischen Zusammenhang zwischen אָדָם und אֲדָמָה, soweit dies im Deutschen möglich ist.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: von dem er genommen worden war
  rationale: Der Relativsatz bezieht sich auf den Erdboden. Das Plusquamperfekt kennzeichnet die Entnahme als eine Handlung, die dem Fortschicken vorausging; die Passivform des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Verhältnis der Aufgabe zur ursprünglichen Bestimmung des Menschen
  choice: den Erdboden bearbeiten
  alternative: den Erdboden bebauen; dem Erdboden dienen
  rationale: Die Formulierung erhält die lexikalische Verbindung zur früheren Aufgabe des Menschen, ohne eine zusätzliche Aussage über Fluch, Strafe oder Erlösung in den Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da“ führt die Folgehandlung knapp ein; „fortschicken“ vermeidet eine unnötige Bedeutungsangleichung an das stärkere Verb im nächsten Vers.
