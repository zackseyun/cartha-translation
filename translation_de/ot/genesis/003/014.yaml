  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: de
  text: 'Da sagte Jahwe Gott zur Schlange: »Weil du das getan hast, bist du mehr verflucht als alles Vieh und als alle Tiere des Feldes. Auf deinem Bauch sollst du gehen, und Staub sollst du fressen, dein Leben lang[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: »Staub fressen« kann neben der konkreten Aussage auch ein Bild für Erniedrigung und Niederlage sein.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; das appositionelle »Gott« bewahrt die Verbindung beider hebräischen Bezeichnungen und klingt im Deutschen natürlich.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: »Schlange« ist die natürliche deutsche Bezeichnung und lässt offen, ob der Ausdruck darüber hinaus symbolisch verstanden wird.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Weil du das getan hast
  rationale: Die Formulierung gibt den kausalen Zusammenhang der Urteilsbegründung klar wieder.
- source_word: אָרוּר אַתָּה
  choice: bist du verflucht
  rationale: Die Nachstellung nach dem vorangestellten Kausalsatz ist im Deutschen flüssig und erhält den feierlichen Urteilston.
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: unter allem Vieh und unter allen Tieren des Feldes
  rationale: Das komparative bzw. aussondernde מן bleibt mit »unter« bewusst offen; »Vieh« bezeichnet die Haustiere, »Tiere des Feldes« die zweite Tiergruppe.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Auf deinem Bauch sollst du gehen
  rationale: »Gehen« entspricht dem allgemeinen hebräischen Verb und vermeidet die interpretierende Präzisierung »kriechen«.
- source_word: וְעָפָר תֹּאכַל
  choice: und Staub sollst du fressen
  rationale: Die konkrete Bildsprache bleibt erhalten, ohne festzulegen, ob sie ausschließlich wörtlich oder zugleich als Erniedrigungsbild zu verstehen ist.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: dein Leben lang
  rationale: Die idiomatische deutsche Wendung gibt die gesamte Lebensdauer vollständig und verständlich wieder.
theological_decisions:
- issue: Identität der Schlange
  choice: Die Schlange bleibt im Haupttext die unmittelbare narrative Adressatin.
  alternative: Eine ausdrückliche Identifizierung mit Satan in den Vers einzufügen.
  rationale: Der hebräische Vers nennt hier nur die Schlange; spätere theologische Verknüpfungen sollen nicht in den Wortlaut eingetragen werden.
- issue: Reichweite des Fluchs gegenüber den übrigen Tieren
  choice: »unter allem Vieh und unter allen Tieren des Feldes«
  alternative: »mehr als alles Vieh und alle Tiere des Feldes«
  rationale: Das hebräische מן kann vergleichend oder aussondernd verstanden werden. »Unter« bewahrt diese Spannung besser, ohne eindeutig zu behaupten, alle anderen Tiere seien ebenfalls verflucht.
- issue: Staub fressen
  choice: Das konkrete Bild steht unverändert im Haupttext.
  alternative: Die Wendung direkt als Erniedrigung oder Niederlage auszudeuten.
  rationale: Der Text erlaubt eine konkrete und eine bildhafte Dimension; die Übersetzung legt sich nicht unnötig auf nur eine davon fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll formaler Satzmelodie. Die Redeform wahrt den feierlichen Charakter des göttlichen Urteils; unnötig altertümliche Wörter werden vermieden.
