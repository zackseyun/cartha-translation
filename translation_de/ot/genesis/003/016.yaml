base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: de
  text: 'Zur Frau sagte er: „Ich werde die Mühsal deiner Schwangerschaft sehr vermehren.[a] Unter Schmerzen wirst du Kinder gebären.[b] Dein Verlangen wird deinem Mann gelten,[c] und er wird über dich herrschen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Mühsal und deine Empfängnis/Schwangerschaft“. Das hebräische Wort kann Empfängnis oder Schwangerschaft bezeichnen; die knappe Verbindung mit „Mühsal“ wird unterschiedlich verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne“; hier wahrscheinlich im allgemeinen Sinn von Kindern oder Nachkommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „dein Sehnen“. Das seltene hebräische Wort bezeichnet allgemein ein Verlangen. Manche verstehen es als Verlangen, den Mann zu beherrschen (vgl. 1. Mose 4,7), andere als relationales oder sexuelles Sehnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. In dieser Anrede innerhalb der Gerichtsszene ist „die Frau“ passend; אִישֵׁךְ bezeichnet später ausdrücklich ihren Mann.
- source_word: הַרְבָּה אַרְבֶּה
  choice: ich werde … sehr vermehren
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt die Aussage. „Sehr vermehren“ gibt diese Betonung direkt und verständlich wieder.
- source_word: עִצְּבוֹנֵךְ
  choice: deine Mühsal
  rationale: Das Substantiv kann Schmerz, Mühsal oder beschwerliche Arbeit bezeichnen. „Mühsal“ bewahrt hier die größere Bedeutungsbreite und vermeidet eine unnötige Doppelung mit dem folgenden „unter Schmerzen“.
- source_word: וְהֵרֹנֵךְ
  choice: deine Schwangerschaft
  rationale: Das seltene Wort bezeichnet Empfängnis oder Schwangerschaft. „Schwangerschaft“ ist im Deutschen die natürlichere substantivische Wiedergabe im Zusammenhang mit Geburt.
- source_word: בְּעֶצֶב
  choice: unter Schmerzen
  rationale: Die Präpositionalphrase beschreibt die Begleitumstände des Gebärens. „Unter Schmerzen“ ist eine natürliche und genaue deutsche Formulierung.
- source_word: תֵּלְדִי בָנִים
  choice: du wirst Kinder gebären
  rationale: בָּנִים bedeutet wörtlich „Söhne“, kann aber Nachkommen beziehungsweise Kinder allgemein bezeichnen. Der Zusammenhang betrifft das Gebären allgemein.
- source_word: אִישֵׁךְ
  choice: dein Mann
  rationale: In der Beziehung zur Frau bedeutet אִישׁ hier natürlich „Ehemann“; „dein Mann“ ist dafür die geläufige deutsche Ausdrucksweise.
- source_word: תְּשׁוּקָתֵךְ
  choice: dein Verlangen
  rationale: Das seltene und umstrittene Substantiv wird mit dem breiten Ausdruck „Verlangen“ wiedergegeben, ohne festzulegen, ob sexuelles, relationales oder auf Beherrschung gerichtetes Begehren gemeint ist.
- source_word: יִמְשָׁל בָּךְ
  choice: er wird über dich herrschen
  rationale: Das Verb bezeichnet Herrschen oder Regieren. Diese Wiedergabe wahrt die Aussage über das künftige Verhältnis, ohne sie durch „beherrschen“ oder „dominieren“ zusätzlich zu verschärfen.
theological_decisions:
- issue: Bedeutung des Verlangens der Frau nach ihrem Mann
  choice: Das Wort תְּשׁוּקָה wird offen mit „Verlangen“ wiedergegeben.
  alternative: Sexuelles Begehren; relationales Sehnen oder Abhängigkeit; Verlangen, den Mann zu kontrollieren, im Vergleich mit Genesis 4,7.
  rationale: Das hebräische Wort kommt nur selten vor, und der Zusammenhang erzwingt keine einzelne Deutung. Die Übersetzung bewahrt daher die exegetische und theologische Spannung.
- issue: Deskriptiver oder normativer Sinn der Herrschaft des Mannes
  choice: 'Die Formulierung beschreibt, was geschehen wird: „er wird über dich herrschen“.'
  alternative: Eine Vorschrift oder göttliche Einsetzung männlicher Autorität.
  rationale: Die hebräische Verbform sagt aus, was eintreten wird, nicht ausdrücklich, was geschehen soll. Eine normative Lehre wird deshalb nicht in den Text hineingetragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die poetisch-knappe Struktur bleibt erkennbar. Seltene und umstrittene Begriffe werden im Haupttext nicht konfessionell oder dogmatisch vereindeutigt; Alternativen stehen in den Fußnoten.
