  verdict: revise
  source_fidelity: Die Übersetzung gibt die hebräische Satzfolge, die Intensivierung von הַרְבָּה אַרְבֶּה, die zwei Begriffe für Mühsal/Schmerz sowie die offene Bedeutung von תְּשׁוּקָה im Wesentlichen treffend wieder. „Kinder“ für בָּנִים ist im Kontext vertretbar und korrekt erläutert. Die Aussage „er wird über dich herrschen“ bleibt, dem Imperfekt entsprechend, deskriptiv und macht daraus keine Vorschrift.
  naturalness: '„Deine Mühsal und deine Schwangerschaft sehr vermehren“ ist zwar eng am Hebräischen, im modernen Deutschen jedoch semantisch und idiomatisch holprig: Eine einzelne Schwangerschaft wird nicht gewöhnlich „vermehrt“. Eine behutsame Umstellung zu „die Mühsal deiner Schwangerschaft“ ergibt einen natürlichen deutschen Ausdruck, ohne die mit der knappen hebräischen Verbindung verbundene Auslegungsfrage zu verschleiern, sofern die Fußnote diese Mehrdeutigkeit ausdrücklich wahrt. „Dein Verlangen wird deinem Mann gelten“ ist im modernen Standarddeutsch klarer als „Nach deinem Mann wird dein Verlangen sein“ und erhält die offene Richtungsbeziehung.'
  terminology: „Mühsal“, „unter Schmerzen“, „Kinder“, „dein Mann“, „Verlangen“ und „über dich herrschen“ sind angemessen. Die Fußnote zu תְּשׁוּקָה wahrt die strittige Bedeutung, ohne eine Deutung festzuschreiben. Die historische Vergleichsangabe sollte in deutscher Bibelreferenzform „1. Mose 4,7“ stehen.
