source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: de
  text: Dann vertrieb er den Menschen. Östlich vom Garten Eden[a] stellte er die Kerubim und die Flamme des Schwertes auf, das sich in alle Richtungen dreht[b], um den Weg zum Baum des Lebens zu bewachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Ostseite des Gartens Eden“. Die hebräische Wendung bezeichnet den östlichen Bereich beziehungsweise die östliche Vorderseite des Gartens.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „das flammende Schwert, das sich nach allen Seiten wandte“. Wörtlicher heißt es: „die Flamme des Schwertes, das sich dreht/wendet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: vertrieb
  rationale: גרשׁ bezeichnet ein gewaltsames Forttreiben oder Ausweisen. „Vertrieb“ gibt diese nachdrückliche Handlung natürlich und ohne zusätzliche Deutung wieder.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der Ausdruck bezeichnet hier den einzelnen zuvor erschaffenen Menschen. „Den Menschen“ bewahrt zugleich den Rückbezug auf אָדָם und die für das Deutsche naheliegende Bezeichnung der menschlichen Gestalt.
- source_word: וַיַּשְׁכֵּן
  choice: stellte … auf
  rationale: Der Hifil von שכן bedeutet hier, jemanden oder etwas an einem Ort einzusetzen beziehungsweise dort seinen Platz einnehmen zu lassen. Im Zusammenhang der Bewachung ist „stellte … auf“ idiomatisch und sachgerecht.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: östlich vom Garten Eden
  rationale: Die Wendung bezeichnet räumlich den Bereich östlich vor beziehungsweise an der Ostseite des Gartens; die knappe deutsche Form bewahrt diese örtliche Aussage, ohne sie unnötig festzulegen.
- source_word: הַכְּרֻבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Wiedergabe der hebräischen Pluralform für diese himmlischen Wesen.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: die Flamme des Schwertes …, das sich in alle Richtungen dreht
  rationale: Die Wiedergabe erhält die ungewöhnliche hebräische Verbindung „Flamme des Schwertes“ und gibt das Partizip als fortdauernde, in verschiedene Richtungen gehende Bewegung wieder.
- source_word: לִשְׁמֹר
  choice: um … zu bewachen
  rationale: שׁמר bedeutet hier, den Zugang zu sichern und zu verwehren; „bewachen“ trifft diese Funktion im Kontext.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: den Weg zum Baum des Lebens
  rationale: Die hebräische Genitivverbindung bezeichnet den Weg, der zum Baum des Lebens führt. Diese Wiedergabe ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung von הָאָדָם im Erzählzusammenhang
  choice: den Menschen
  alternative: den Mann
  rationale: Gemeint ist der konkrete Mensch, der aus dem Garten vertrieben wird. „Den Menschen“ wahrt den lexikalischen Bezug von אָדָם auf den Menschen, ohne die Stelle zu einer Aussage über die Menschheit als abstraktes Kollektiv zu machen.
- issue: Bezug und Gestalt der Schwertflamme
  choice: die Flamme des Schwertes, das sich in alle Richtungen dreht
  alternative: das flammende Schwert, das sich nach allen Seiten wendet
  rationale: Die ungewöhnliche Konstruktion des Hebräischen wird nicht vorschnell zu einem bloß „flammenden Schwert“ geglättet. Der bewegte Wächter bleibt als bildhafte, nicht näher erklärte Erscheinung stehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit, ohne den Ablauf des hebräischen Textes zu verändern. „Kerubim“ und „Baum des Lebens“ bleiben als etablierte biblische Begriffe erhalten.
