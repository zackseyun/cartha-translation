  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: de
  text: 'Denn Gott weiß: An dem Tag, an dem ihr davon esst, werden euch die Augen geöffnet, und ihr werdet wie Gott[a] sein und Gut und Böse erkennen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie Götter« oder »wie göttliche Wesen«. Das hebräische Wort אֱלֹהִים kann je nach Zusammenhang diese Bedeutungen haben.'
    reason: Bewahrt die echte Mehrdeutigkeit des hebräischen Ausdrucks.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der Schlange für ihre vorherige Behauptung ein und gibt den hebräischen Diskurszusammenhang natürlich wieder.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Gott weiß
  rationale: Das hebräische Partizip bezeichnet hier idiomatisch einen gegenwärtigen Wissenszustand.
- source_word: כִּי
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen flüssig den Inhalt dessen ein, was Gott nach Aussage der Schlange weiß.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: Sobald ihr davon esst
  rationale: Die hebräische Zeitformel bezeichnet hier den Zeitpunkt des Essens und muss keinen Zeitraum von 24 Stunden meinen; „sobald“ bewahrt den unmittelbaren zeitlichen Zusammenhang in natürlichem Deutsch.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: werden euch die Augen geöffnet
  rationale: Die passive Form des Niphal und das Bild erweiterten Wahrnehmens bleiben erhalten.
- source_word: וִהְיִיתֶם
  choice: ihr werdet … sein
  rationale: Gibt den resultierenden Zustand direkt wieder, ohne stärker als der Ausgangstext ein Werden zu betonen.
- source_word: כֵּאלֹהִים
  choice: wie Gott
  rationale: Im unmittelbaren Zusammenhang ist der singularische Bezug auf Gott wahrscheinlich; die lexikalisch möglichen Alternativen werden wegen der echten Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: Gut und Böse erkennen
  rationale: Das Partizip wird als verbale Ergänzung wiedergegeben; „erkennen“ bezeichnet hier nicht bloß Faktenwissen, sondern urteilsfähige Kenntnis, ohne den genauen Umfang näher festzulegen.
theological_decisions:
- issue: Bezug von אֱלֹהִים in כֵּאלֹהִים
  choice: wie Gott
  alternative: wie Götter; wie göttliche Wesen
  rationale: Der Kontext spricht wiederholt von Gott, und die Kenntnis von Gut und Böse wird mit ihm verglichen. Da אֱלֹהִים jedoch auch pluralisch oder als Bezeichnung übermenschlicher Wesen verstanden werden kann, werden diese Möglichkeiten ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sobald“ gibt die hebräische Zeitformel verständlich wieder, ohne sie auf einen Kalendertag festzulegen. Die Konstruktion „werden euch die Augen geöffnet“ erhält Passiv und Bildsprache; die umstrittene Bedeutung von אֱלֹהִים bleibt durch die Fußnote offen.
