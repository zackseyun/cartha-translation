  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: de
  text: 'Und er sagte: »Wer hat dir gesagt, dass du nackt bist? Hast du von dem Baum gegessen, von dem ich dir verboten hatte zu essen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: »Hast du von dem Baum gegessen, von dem ich dir geboten hatte, nicht zu essen?«'
    reason: Die Hauptfassung gibt die negative Anweisung mit dem im Deutschen natürlicheren »verboten« wieder; die Fußnote zeigt die formaler an צוה, »gebieten/befehlen«, orientierte Struktur.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Der Wayyiqtol führt die Erzählung fort; das nicht ausdrücklich genannte maskuline Subjekt bleibt als Pronomen erhalten.
- source_word: מִי הִגִּיד לְךָ
  choice: Wer hat dir gesagt
  rationale: Gibt die direkte Frage und die übliche Bedeutung des Hiphil von נגד natürlich und genau wieder.
- source_word: כִּי עֵירֹם אָתָּה
  choice: dass du nackt bist
  rationale: Das Hebräische enthält keinen Vergangenheitsmarker in diesem Nominalsatz; das Präsens bewahrt die unmittelbare Zustandsaussage.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: Hast du etwa von dem Baum gegessen
  rationale: Die deutsche Perfektform ist in direkter Rede natürlich; »etwa« signalisiert die hebräische Ja-Nein-Frage, ohne ihre erwartete Antwort festzulegen.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: von dem zu essen ich dir verboten hatte
  rationale: Die negative Anweisung wird im Deutschen idiomatisch als Verbot ausgedrückt. »Von dem« gibt מִמֶּנּוּ wieder, während das Plusquamperfekt die vorausgegangene Anordnung im Erzählzusammenhang klar bezeichnet.
theological_decisions:
- issue: Identität des nicht ausdrücklich genannten Sprechers
  choice: »er«
  alternative: »Gott, der HERR«
  rationale: Der hebräische Vers nennt nur ein maskulines Singularsubjekt am Verb; die Identität ergibt sich aus dem Kontext und wird nicht innerhalb dieses Verses ergänzt.
- issue: Charakter der zweiten Frage
  choice: Als echte direkte Frage formuliert
  alternative: Als rhetorische Anklage verstärken
  rationale: Der Wortlaut fragt nach dem Essen vom verbotenen Baum. Eine ausdrücklich schärfere Deutung würde die im Hebräischen verbleibende pragmatische Offenheit unnötig festlegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstellung »von dem zu essen ich dir verboten hatte« ist leicht gehoben, hält aber den Bezug auf den Baum klar und vermeidet eine schwerfällige Wiederholung.
