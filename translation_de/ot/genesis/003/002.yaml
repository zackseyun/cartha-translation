  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: de
  text: 'Da sagte die Frau zur Schlange: „Von den Früchten der Bäume im Garten dürfen wir essen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Von der Frucht des Baumes im Garten dürfen wir essen.“ „Baum“ ist hier kollektiv zu verstehen, daher im Text „Bäume“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das narrative wayyiqtol führt die Handlung fort. „Da sagte“ gibt den Erzählfluss im modernen Deutschen natürlich wieder, ohne einen stärkeren Folgeschluss auszudrücken.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה bezeichnet hier die weibliche Hauptfigur; ihre Rolle als Ehefrau steht nicht eigens im Vordergrund.
- source_word: אֶל הַנָּחָשׁ
  choice: zur Schlange
  rationale: „Zur Schlange“ ist die natürliche deutsche Wiedergabe der Redezuweisung mit אֶל; נָחָשׁ bezeichnet eine Schlange.
- source_word: מִפְּרִי
  choice: von den Früchten
  rationale: מִן bezeichnet den Ausgangspunkt beziehungsweise das, wovon gegessen werden darf. Der deutsche Plural ist in Verbindung mit den kollektiv verstandenen Bäumen idiomatisch.
- source_word: עֵץ הַגָּן
  choice: der Bäume im Garten
  rationale: Obwohl עֵץ formal im Singular steht, ist es hier kollektiv beziehungsweise distributiv zu verstehen. Der Plural vermeidet die irreführende Aussage, nur ein einzelner Baum sei gemeint.
- source_word: נֹאכֵל
  choice: dürfen wir essen
  rationale: Der Imperfekt greift im Kontext die in Genesis 2,16 erteilte Erlaubnis auf. „Dürfen“ drückt Erlaubnis präziser aus als bloße Möglichkeit.
theological_decisions:
- issue: Umfang der erlaubten Bäume beziehungsweise Früchte
  choice: 'Allgemeine Erlaubnis: „von den Früchten der Bäume im Garten“'
  alternative: „von der Frucht des Baumes im Garten“
  rationale: Das formal singularische עֵץ kann kollektiv/distributiv gebraucht sein. Im Zusammenhang mit Genesis 2,16 und der erst im folgenden Vers genannten Ausnahme bezeichnet die Aussage die Bäume des Gartens allgemein, ohne die Spannung des folgenden Verbots vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; die kollektiv verstandene Singularform wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht.
