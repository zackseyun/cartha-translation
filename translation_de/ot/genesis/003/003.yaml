  - severity: low
    issue: »der mitten im Garten steht«
    rationale: »Steht« ist im Deutschen möglich, wird vom hebräischen Nominalsatz aber nicht verlangt. »Der mitten im Garten ist« ist näher am Wortlaut und weiterhin natürlich.
