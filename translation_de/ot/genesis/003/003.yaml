base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: de
  text: 'Aber von der Frucht des Baumes, der mitten im Garten ist,[a] hat Gott gesagt: »Ihr dürft nicht davon essen und ihn nicht berühren, sonst sterbt ihr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der inmitten des Gartens ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Aber von der Frucht
  rationale: Die Verbindung aus Konjunktion, Präposition und Substantiv setzt den Gegensatz zu Vers 2 fort. »Aber von der Frucht« gibt sowohl den adversativen Zusammenhang als auch die präpositionale Form natürlich wieder.
- source_word: הָ/עֵץ
  choice: des Baumes
  rationale: Das bestimmte Substantiv bezeichnet schlicht den bereits genannten Baum.
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: der mitten im Garten steht
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. Die Ergänzung »steht« ist im Deutschen idiomatisch und macht die räumliche Aussage deutlich, ohne ihren Sinn zu verändern.
- source_word: אָמַר אֱלֹהִים
  choice: hat Gott gesagt
  rationale: Das Qatal verweist hier auf eine zuvor ergangene Aussage. Im gegenwärtigen Redekontext ist das Perfekt im modernen Deutsch natürlich.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Ihr dürft nicht davon essen
  rationale: Der negierte Imperfekt gibt ein Verbot wieder. »Ihr dürft nicht« ist klares modernes Deutsch; »davon« bewahrt die präpositionale Beziehung von מִן.
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: und ihn nicht berühren
  rationale: נגע bedeutet hier »berühren«. Das angefügte zweite Verbot wird parallel und ohne Harmonisierung wiedergegeben.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet eine zu vermeidende beziehungsweise befürchtete Folge ein. »Sonst« ist im modernen Deutsch natürlich und bewahrt die modale Offenheit besser als eine kategorische Feststellung.
- source_word: תְּמֻתוּן
  choice: müsst ihr sterben
  rationale: Nach פֶּן bezeichnet die Form die drohende Folge. »Sonst müsst ihr sterben« gibt diese Folge idiomatisch wieder, ohne Evas Worte zu einer unabhängigen Aussage »ihr werdet sterben« umzuformen.
theological_decisions:
- issue: Evas Wiedergabe unterscheidet sich von Gottes Gebot in Genesis 2,17, da sie »und ihn nicht berühren« hinzufügt.
  choice: Evas Aussage wird so übersetzt, wie sie im hebräischen Text steht.
  alternative: Die Formulierung an Genesis 2,17 angleichen, indem das Berührungsverbot ausgelassen oder abgeschwächt wird.
  rationale: Die erzählerische und theologische Spannung gehört zum Text und darf nicht durch Harmonisierung beseitigt werden.
- issue: Die Wendung פֶּן תְּמֻתוּן kann eine befürchtete oder drohende Folge ausdrücken.
  choice: »sonst müsst ihr sterben«
  alternative: »damit ihr nicht sterbt« oder »sonst werdet ihr sterben«
  rationale: Die gewählte Fassung ist natürlich und wahrt den Folge- beziehungsweise Warncharakter, ohne die modale Spannung unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und allgemein verständlich; die Formulierung vermeidet sowohl altertümliches »auf dass ihr nicht sterbt« als auch eine Harmonisierung mit Genesis 2,17.
