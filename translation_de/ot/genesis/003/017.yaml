source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: de
  text: 'Und zu Adam[a] sagte er: „Weil du auf die Stimme deiner Frau gehört und von dem Baum gegessen hast, von dem ich dir geboten hatte: ›Du darfst nicht davon essen‹, ist der Ackerboden deinetwegen[b] verflucht. Unter Mühsal[c] wirst du dich von ihm ernähren, alle Tage deines Lebens.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dem Menschen“ beziehungsweise „zu dem Mann“. Das Hebräische kann hier als Eigenname oder als Bezeichnung des Menschen verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „um deinetwillen“ oder „deinetwegen ist der Ackerboden verflucht“. Gemeint ist, dass der Fluch Adam zum Anlass hat.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „unter Schmerzen“, „mit Kummer“ oder „unter beschwerlicher Arbeit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: zu Adam
  rationale: Der Kontext bezeichnet den einzelnen Mann in der Erzählung. Die Wiedergabe als Eigenname ist hier gut möglich; die ebenfalls mögliche Übersetzung „zu dem Menschen/Mann“ wird in einer Fußnote bewahrt.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: du auf die Stimme deiner Frau gehört hast
  rationale: Die Formulierung bewahrt das hebräische Bild von der „Stimme“, ist im Deutschen verständlich und lässt den Bedeutungsanteil des Folgeleistens erkennen, ohne ihn ausdrücklich als „gehorchen“ festzulegen.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: und von dem Baum gegessen hast
  rationale: „Von dem Baum essen“ gibt die Präposition מִן natürlich wieder; gemeint ist aus dem zugehörigen Bestand beziehungsweise von seiner Frucht zu essen.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: 'von dem ich dir geboten hatte:'
  rationale: Der Doppelpunkt führt den Inhalt des Gebots natürlich ein und vertritt funktional לֵאמֹר („indem ich sagte/mit den Worten“), ohne die deutsche Syntax zu überladen.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Du darfst nicht davon essen
  rationale: Diese Form drückt das verbindliche Verbot in modernem Standarddeutsch klar aus. „Davon“ wahrt den Rückbezug und die Präposition.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: der Ackerboden ist verflucht
  rationale: „Ackerboden“ macht den landwirtschaftlichen Zusammenhang deutlich und grenzt אֲדָמָה hier von der ganzen „Erde“ ab. Die deutsche Subjekt-Prädikativ-Stellung ist natürlich.
- source_word: בַּעֲבוּרֶךָ
  choice: deinetwegen
  rationale: Die Wiedergabe bezeichnet Adam als Anlass beziehungsweise Ursache des Fluchs und vermeidet den möglichen positiven Beiklang von „um deinetwillen“.
- source_word: בְּעִצָּבוֹן
  choice: unter Mühsal
  rationale: Das Wortfeld umfasst Schmerz, Kummer und beschwerliche Arbeit. Im Zusammenhang mit der Nahrungsgewinnung trifft „Mühsal“ die Härte der Arbeit, ohne die weiteren Nuancen auszuschließen.
- source_word: תֹּאכֲלֶנָּה
  choice: wirst du dich von ihm ernähren
  rationale: Das feminine Suffix verweist auf אֲדָמָה. Gemeint ist nicht, dass Adam Erde isst, sondern dass seine Nahrung aus dem Boden kommt; „sich von ihm ernähren“ macht diesen Bezug idiomatisch deutlich.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: alle Tage deines Lebens
  rationale: Die formnahe Wendung bewahrt den feierlich-ernsten Rhythmus und ist im Deutschen klar verständlich.
theological_decisions:
- issue: Bedeutung von אָדָם als Eigenname oder Gattungsbezeichnung
  choice: Adam
  alternative: der Mensch / der Mann
  rationale: Die Anrede gilt der konkreten männlichen Figur der Eden-Erzählung. Der hebräische Ausdruck kann dennoch auch appellativ verstanden werden; diese echte Mehrdeutigkeit wird in der Fußnote offengehalten.
- issue: Charakter des Hörens auf die Frau
  choice: auf die Stimme deiner Frau gehört
  alternative: deiner Frau gehorcht
  rationale: Der Kontext legt ein Befolgen ihrer Worte nahe, doch die Übersetzung vermeidet es, das hebräische Idiom ausschließlich auf förmlichen Gehorsam festzulegen.
- issue: Bezug des Fluchs
  choice: der Ackerboden ist deinetwegen verflucht
  alternative: verflucht ist der Ackerboden um deinetwillen
  rationale: Der Fluch trifft ausdrücklich den Boden und nicht unmittelbar Adam. „Deinetwegen“ gibt den ursächlichen Bezug wieder, ohne einen Nutzen für Adam anzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Rhythmus. Die direkte Rede bleibt klar und mündlich verständlich; „alle Tage deines Lebens“ bewahrt bewusst die feierliche Kadenz. Hebräische Mehrdeutigkeiten werden weder im Haupttext noch in den Fußnoten konfessionell verengt.
