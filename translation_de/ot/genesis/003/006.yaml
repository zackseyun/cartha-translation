  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: de
  text: Da sah die Frau, dass der Baum gut zum Essen und eine Freude für die Augen[a] war und dass der Baum begehrenswert war, um Einsicht zu gewinnen[b]. Sie nahm von seiner Frucht und aß. Dann gab sie auch ihrem Mann, der bei ihr war, davon, und er aß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Lust für die Augen“; wörtlich etwa: „ein Begehren für die Augen“. Die hebräische Wendung betont die visuelle Anziehungskraft des Baumes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um weise zu machen“. Das Hebräische kann sowohl das Erlangen von Einsicht als auch das Vermitteln von Weisheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Da sah
  rationale: Gibt das einfache narrative Sehen wieder; „da“ markiert natürlich den Fortgang der hebräischen Erzählung.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Entspricht der hebräischen Bezeichnung und legt die eheliche Rolle an dieser Stelle nicht vorzeitig in das Substantiv hinein.
- source_word: טוֹב ... לְמַאֲכָל
  choice: gut zum Essen
  rationale: Bewahrt die gewöhnliche Bedeutung von טוֹב und drückt die Eignung als Nahrung in natürlichem Deutsch aus.
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: eine Lust für die Augen
  rationale: Bewahrt die substantivische hebräische Wendung und ihre Betonung der sinnlichen, visuellen Anziehung, ohne sie ausdrücklich zu moralisieren.
- source_word: וְנֶחְמָד
  choice: begehrenswert
  rationale: Bezeichnet den Baum als anziehend beziehungsweise begehrenswert, ohne die stärkere Wertung „begehrt“ oder „begehrlich“ einzutragen.
- source_word: לְהַשְׂכִּיל
  choice: weil er Einsicht versprach
  rationale: Die Hifil-Form kann das Erlangen von Einsicht beziehungsweise Weisheit oder das Vermitteln derselben ausdrücken. Die Formulierung gibt die von der Frau wahrgenommene Eignung idiomatisch wieder, ohne die Mehrdeutigkeit im Haupttext vollständig aufzulösen.
- source_word: מִפִּרְיוֹ
  choice: von seiner Frucht
  rationale: Folgt der Präposition מן und bewahrt den kollektiven Singular „Frucht“.
- source_word: וַתִּתֵּן גַּם
  choice: Dann gab sie auch ... davon
  rationale: „Auch“ gibt גַּם wieder; „davon“ ergänzt im Deutschen natürlich das im Hebräischen ausgesparte Objekt.
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: ihrem Mann, der bei ihr war
  rationale: Ordnet עִמָּהּ syntaktisch eindeutig dem Mann zu und bewahrt die ausdrückliche Angabe seiner Anwesenheit.
theological_decisions:
- issue: Moralische Färbung der Wahrnehmung der Frau
  choice: 'Die wertenden Wörter werden ohne zusätzlich eingetragene Verurteilung wiedergegeben: „gut“, „Lust“, „begehrenswert“.'
  alternative: Stärker negativ gefärbte Wörter wie „Begierde“, „lüstern“ oder „verlockend“.
  rationale: Der hebräische Text schildert zunächst die Wahrnehmung der Frau mit positiv wirkenden Wertungen; die Übersetzung soll das theologische Urteil nicht vorwegnehmen.
- issue: Bedeutung von לְהַשְׂכִּיל
  choice: „weil er Einsicht versprach“, mit einer Fußnote zur möglichen Wiedergabe „um weise zu machen“.
  alternative: „um weise zu machen“ oder „um Einsicht zu gewinnen“.
  rationale: Die Konstruktion lässt sowohl den Erwerb von Einsicht als auch das Vermitteln von Weisheit anklingen. Der Haupttext soll idiomatisch bleiben, die echte semantische Spannung wird in der Fußnote offengelegt.
- issue: Anwesenheit des Mannes
  choice: „ihrem Mann, der bei ihr war“
  alternative: „ihrem Mann bei ihr“
  rationale: Die relative Formulierung macht die hebräische Beziehung in natürlichem Deutsch verständlich, ohne über die Aussage seiner Anwesenheit hinauszugehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nahe am Hebräischen, wird aber für gute deutsche Lesbarkeit leicht gegliedert. Beide Fußnotenmarker erscheinen an den jeweils erläuterten Wendungen im Haupttext.
