base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: de
  text: 'Da sagte Jahwe Gott: »Siehe, der Mensch ist geworden wie einer von uns[a], der Gut und Böse kennt. Und nun, damit er nicht seine Hand ausstreckt und auch vom Baum des Lebens nimmt und isst und ewig lebt –«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „uns“ steht im Plural. Es kann unter anderem auf einen himmlischen Rat, einen Plural der Selbstberatung oder eine Mehrzahl innerhalb Gottes bezogen werden; der Text legt keine dieser Deutungen ausdrücklich fest.
    reason: Bewahrung einer mehrdeutigen theologischen Formulierung des hebräischen Textes.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Bewahrt den offenbarten Gottesnamen und gibt die Apposition אֱלֹהִים natürlich mit „Gott“ wieder.
- source_word: הֵן
  choice: Siehe
  rationale: Erhält den hinweisenden, feierlichen Nachdruck des hebräischen Ausrufs in einer würdigen deutschen Erzählweise.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Bezeichnet hier den einzelnen Menschen Adam, bewahrt aber zugleich die im Hebräischen vorhandene Bedeutung „Mensch“.
- source_word: הָיָה כְּאַחַד מִמֶּנּוּ
  choice: ist geworden wie einer von uns
  rationale: Gibt den eingetretenen, nun bestehenden Zustand wieder und bewahrt den ausdrücklich pluralischen Bezug „uns“.
- source_word: לָדַעַת טוֹב וָרָע
  choice: sodass er Gut und Böse erkennt
  rationale: Versteht den Infinitiv als Erläuterung beziehungsweise Ergebnis des Gewordenseins; „erkennt“ wahrt den kognitiven und moralischen Gehalt von ידע.
- source_word: וְעַתָּה פֶּן
  choice: Und nun, damit er nicht
  rationale: Leitet eine abwehrende Zweck- beziehungsweise Befürchtungsklausel ein und ermöglicht, den im Hebräischen unvollendet abbrechenden Satz im Deutschen beizubehalten.
- source_word: יִשְׁלַח יָדוֹ
  choice: seine Hand ausstreckt
  rationale: Bewahrt das konkrete hebräische Bild in natürlichem Deutsch.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: und auch vom Baum des Lebens nimmt
  rationale: Erhält die additive Bedeutung von גַּם und die traditionelle, transparente Benennung des Baumes.
- source_word: וָחַי לְעֹלָם
  choice: und ewig lebt
  rationale: Gibt die mögliche unbegrenzte Fortdauer des Lebens knapp und unmittelbar wieder.
theological_decisions:
- issue: Plural in „wie einer von uns“
  choice: Den Plural „uns“ ohne Auslegung im Haupttext bewahren.
  alternative: Den Plural als himmlischen Rat, Hoheitsplural, Beratungsplural oder innergöttliche Mehrzahl festlegen.
  rationale: Der hebräische Text verwendet eindeutig die erste Person Plural, bestimmt deren Bezug aber nicht ausdrücklich. Die Übersetzung soll diese theologische Spannung offenhalten.
- issue: Abrupter Abbruch der Gottesrede
  choice: Den unvollendeten Satz mit einem Gedankenstrich enden lassen.
  alternative: Einen nicht ausgesprochenen Hauptsatz ergänzen oder den Gedanken glatt abschließen.
  rationale: Die hebräische Rede endet nach der Befürchtungsklausel ohne ausdrücklich formulierten Folgesatz; erst der nächste Vers berichtet Gottes Handlung. Eine Ergänzung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Siehe“ erhält den feierlichen Ton; der Gedankenstrich wahrt den auffälligen Abbruch der Rede.
