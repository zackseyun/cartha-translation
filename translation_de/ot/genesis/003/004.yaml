  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: de
  text: 'Doch die Schlange sagte zu der Frau: »Ihr werdet ganz bestimmt nicht sterben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Verneinung + Infinitivus absolutus + finite Verbform von »sterben«. Die Verbindung der beiden Verbformen verstärkt die entschiedene Verneinung: »Ihr werdet ganz bestimmt nicht sterben.«'
    reason: Erläutert die emphatische hebräische Konstruktion grammatisch präzise, ohne den Infinitivus absolutus fälschlich als Partizip (»sterbend«) wiederzugeben.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Die Erzählform führt die Handlung fort; »doch« gibt hier zugleich den klaren Widerspruch der Schlange zur zuvor ausgesprochenen Warnung wieder.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: נָחָשׁ bezeichnet eine Schlange; die übliche deutsche Wiedergabe passt zum Erzählzusammenhang und bleibt natürlich.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten. Hier bewahrt »die Frau« die wiederkehrende Bezeichnung in Genesis 2–3, ohne die relationale Bedeutung unnötig einzuengen.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: ihr werdet ganz bestimmt nicht sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. »Ganz bestimmt nicht« macht im Deutschen deutlich, dass die Schlange das Sterben entschieden bestreitet. Das Pluralpronomen »ihr« bildet die hebräische 2. Person Plural sichtbar ab.
theological_decisions:
- issue: Tragweite der Verneinung durch die Schlange
  choice: »Ihr werdet ganz bestimmt nicht sterben.«
  alternative: »Ihr werdet nicht unbedingt sterben.« / »Ihr werdet nicht sterben.«
  rationale: Der hebräische Nachdruck gehört zur entschiedenen Verneinung und bildet einen direkten Gegensatz zur Warnung in Genesis 2,17. Die Übersetzung wahrt diese Spannung, ohne zu erklären, ob unmittelbarer oder späterer Tod gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Doch« markiert den Widerspruch im Gespräch; »ganz bestimmt nicht« ist eindeutig und vermeidet die im Deutschen mögliche Abschwächung von »nicht sicher sterben«.
