  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: de
  text: Da hörten sie das Geräusch[a] von Jahwe Gott, der im Garten in der Tagesbrise[b] umherging. Der Mann[c] und seine Frau versteckten sich vor Jahwe Gott mitten unter den Bäumen des Gartens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Stimme«. Das hebräische Wort kann sowohl »Geräusch/Laut« als auch »Stimme« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Kühle des Tages«. Wörtlich: »im Wind/in der Brise des Tages«.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: »der Mensch/der Mann«; möglicherweise auch als Eigenname zu verstehen: »Adam«.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: Geräusch
  rationale: Das hebräische Wort kann sowohl »Stimme« als auch allgemeiner »Laut/Geräusch« bedeuten. Da im Vers kein Sprechen erwähnt wird, gibt »Geräusch« den unmittelbaren Zusammenhang natürlich wieder, während die Fußnote die echte Mehrdeutigkeit bewahrt.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; אֱלֹהִים steht dazu in Apposition und wird mit »Gott« übersetzt.
- source_word: מִתְהַלֵּךְ
  choice: umherging
  rationale: Die Hitpael-Form bezeichnet eine Bewegung innerhalb des Gartens. »Umherging« gibt diesen Aspekt wieder und bewahrt die konkrete anthropomorphe Darstellung.
- source_word: לְרוּחַ הַיּוֹם
  choice: in der Tagesbrise
  rationale: רוּחַ bezeichnet hier am ehesten Wind beziehungsweise Brise. »Tagesbrise« bleibt näher am hebräischen Ausdruck als die deutende traditionelle Wiedergabe »in der Kühle des Tages«.
- source_word: הָאָדָם
  choice: der Mann
  rationale: Im Zusammenhang mit »seine Frau« bezeichnet der Ausdruck hier vorrangig den einzelnen Mann, ohne seine weitergehende repräsentative Bedeutung auszuschließen.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Das hebräische Idiom bedeutet wörtlich »weg vom Angesicht/von der Gegenwart«. Das deutsche »sich vor jemandem verstecken« gibt die räumliche und relationale Aussage natürlich wieder.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: mitten unter den Bäumen des Gartens
  rationale: עֵץ steht morphologisch im Singular, kann aber kollektiv die Bäume beziehungsweise den Baumbestand bezeichnen. Der Kontext des Versteckens spricht für die kollektive Wiedergabe.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes als im Garten umhergehend
  choice: Die konkrete Formulierung »umherging« bleibt stehen.
  alternative: Die Aussage als bloßes Zeichen oder als abstrakte Gegenwart Gottes umzuformulieren.
  rationale: Der hebräische Erzähltext stellt Gottes Bewegung anschaulich dar. Die Übersetzung soll diese Spannung weder abschwächen noch systematisch erklären.
- issue: Wiedergabe von הָאָדָם
  choice: der Mann
  alternative: Adam; der Mensch
  rationale: Die Verbindung mit »seine Frau« legt hier die individuelle Bedeutung nahe. Eine Fußnote weist auf die mögliche Wiedergabe mit dem Eigennamen »Adam« hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Tagesbrise« bewahrt die Bildlichkeit des Hebräischen; »umherging« erhält die konkrete Darstellung. Die Satzfolge folgt dem hebräischen Erzählgang, ohne unnötig altertümliche Wendungen wie »vor dem Angesicht« zu verwenden.
