  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: de
  text: Und ich werde Feindschaft[a] stiften zwischen dir und der Frau und zwischen deinem Samen[b] und ihrem Samen. Er[c] wird dir den Kopf zermalmen[d], und du wirst ihm die Ferse verletzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feindseligkeit“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht an beiden Stellen „Same“. Das Wort kann kollektiv die Nachkommen oder einen repräsentativen Einzelnen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Pronomen ist maskulin Singular und folgt auf ein Kollektivnomen. Der Bezug kann kollektiv oder auf einen repräsentativen Einzelnen verstanden werden.
    reason: alternative_reading
  - marker: d
    text: Im Hebräischen steht in beiden Satzteilen dasselbe Verb. Es kann etwa „treffen“ oder „verletzen“ bedeuten; „zermalmen“ beim Kopf bringt die größere Schwere dieser Verletzung zum Ausdruck.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: Feindschaft
  rationale: Bezeichnet eine anhaltende, aktive Gegnerschaft. „Feindschaft“ bewahrt das Gewicht des hebräischen Ausdrucks; „Feindseligkeit“ ist als mögliche Alternative in der Fußnote genannt.
- source_word: אָשִׁית
  choice: werde … setzen
  rationale: Das Qal von שׂים bedeutet gewöhnlich „setzen, stellen, legen“. Die Formulierung bleibt quellennah und ist im gehobenen modernen Deutsch verständlich.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: zwischen dir und der Frau
  rationale: Gibt die relationale Präposition direkt wieder und bewahrt zusammen mit ihrer Wiederholung die parallele Struktur.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: deinem Samen … ihrem Samen
  rationale: זֶרַע bedeutet wörtlich „Same“ und kann kollektiv Nachkommen sowie einen repräsentativen Einzelnen bezeichnen. Die gleiche Wiedergabe an beiden Stellen erhält das hebräische Bild und die Mehrdeutigkeit.
- source_word: הוּא
  choice: Er
  rationale: Das Pronomen ist maskulin Singular und folgt auf das grammatisch maskuline Kollektivnomen „Same“. „Er“ bildet die hebräische Form ab, ohne die kollektive Bedeutung des Bezugsworts auszuschließen.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: wird … zermalmen … wirst … verletzen
  rationale: Im Hebräischen steht in beiden Teilsätzen dasselbe seltene Verb שׁוּף. Die unterschiedlichen deutschen Verben verdeutlichen die durch Kopf und Ferse nahegelegte unterschiedliche Schwere; die Fußnote macht die lexikalische Wiederholung transparent.
- source_word: רֹאשׁ
  choice: Kopf
  rationale: Direkte Wiedergabe der Körperteilbezeichnung.
- source_word: עָקֵב
  choice: Ferse
  rationale: Direkte Wiedergabe der Körperteilbezeichnung.
theological_decisions:
- issue: Kollektive oder individuelle Bedeutung des Samens der Frau
  choice: זֶרַע wird an beiden Stellen mit „Same“ und das folgende הוּא mit „Er“ wiedergegeben.
  alternative: Kollektiv „Nachkommen“ oder „Nachkommenschaft“ und anschließend „sie“ beziehungsweise „diese“.
  rationale: Das Hebräische wiederholt dasselbe Kollektivnomen für die Schlange und die Frau und nimmt es danach mit einem maskulinen Singularpronomen auf. Die Übersetzung hält sowohl die kollektive als auch die mögliche repräsentativ-individuelle Dimension offen, ohne eine messianische Deutung ausdrücklich in den Haupttext einzutragen.
- issue: Stärke der Wiedergabe von שׁוּף im ersten Teilsatz
  choice: Beim Kopf „zermalmen“, bei der Ferse „verletzen“.
  alternative: An beiden Stellen „treffen“, „verwunden“ oder „zermalmen“ verwenden.
  rationale: Dasselbe seltene Verb steht in beiden Teilsätzen, doch die Körperteile lassen eine unterschiedliche Schwere der Treffer erkennen. Der Haupttext macht diese Asymmetrie verständlich; die Fußnote bewahrt die formale Wiederholung des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst quellennaher Bildsprache. „Same“ und „Feindschaft setzen“ sind leicht gehoben, bewahren jedoch zentrale Wiederholungen und Mehrdeutigkeiten des Hebräischen. Die Satzstruktur hält den Parallelismus sichtbar.
