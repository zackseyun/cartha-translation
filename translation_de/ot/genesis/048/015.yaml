  terminology: „Josef“, „Abraham“ und „Isaak“ entsprechen dem deutschen Standardgebrauch. „Der Gott“ erhält die hebräische Bestimmtheit. „Als Hirte geführt“ bewahrt die aktive pastorale Metapher, ohne sie auf bloße Versorgung zu reduzieren.
