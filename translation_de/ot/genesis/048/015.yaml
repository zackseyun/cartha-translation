- from: 'Und er segnete Josef und sprach: „Der Gott, vor dessen Angesicht meine Väter Abraham und Isaak ihren Weg gingen[a], der Gott, der mich, seit ich bin[c], bis auf diesen Tag als Hirte geführt hat[b],“'
  to: 'Und er segnete Josef und sprach: „Der Gott, vor dessen Angesicht meine Väter Abraham und Isaak ihren Weg gingen[a], der Gott, der mich von meinen frühesten Tagen an bis zum heutigen Tag als Hirte geführt hat[b],“'
  rationale: Die Zeitangabe wurde idiomatisch und zugleich quellennah überarbeitet. Der Zusatz „frühesten“ bewahrt, dass מֵעוֹדִי den Beginn von Jakobs Dasein bezeichnet, ohne eine bestimmte Deutung als bloßen Geburtsmoment zu erzwingen. Die Fußnote zu dieser nun im Text hinreichend klar ausgedrückten Zeitangabe ist nicht erforderlich; die verbleibenden Fußnoten erläutern die beiden bildhaften beziehungsweise idiomatischen Hauptausdrücke direkt an ihren Ankern.
