base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: de
  text: 'Und er segnete Josef und sprach: „Der Gott, vor dessen Angesicht meine Väter Abraham und Isaak ihren Weg gingen[a], der Gott, der mich von meinen frühesten Tagen an bis zum heutigen Tag als Hirte geführt hat[b],“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „vor dem meine Väter … wandelten“. Gemeint ist ihre Lebensführung in Gottes Gegenwart.'
    reason: idiomatische_alternative
  - marker: b
    text: 'Oder: „der mich gehütet hat“ beziehungsweise „der für mich gesorgt hat“. Das hebräische Verb beschreibt die fortwährende Fürsorge eines Hirten.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת־יוֹסֵף
  choice: Und er segnete Josef
  rationale: Bewahrt den ausdrücklichen Bezug auf Josef, obwohl der Segen im Zusammenhang seinen Söhnen gilt.
- source_word: הָאֱלֹהִים
  choice: Der Gott
  rationale: Der bestimmte Artikel und die feierliche, näher bestimmende Anrufung werden im Deutschen wiedergegeben.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: vor dessen Angesicht meine Väter … ihren Weg gingen
  rationale: Bewahrt sowohl die Vorstellung eines Lebensweges als auch die bewusste Lebensführung in Gottes Gegenwart, ohne das Bild auf bloßen Gehorsam einzuengen.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham und Isaak
  rationale: Verwendet die im Deutschen üblichen Namensformen.
- source_word: הָרֹעֶה אֹתִי
  choice: der mich … als Hirte geführt hat
  rationale: Erhält das aktive Hirtenbild und bringt die bis zur Gegenwart andauernde Führung und Fürsorge natürlich zum Ausdruck. „Mich geweidet hat“ wäre formaler, klingt im heutigen Deutsch bei einer Person jedoch missverständlich.
- source_word: מֵעוֹדִי
  choice: seit ich bin
  rationale: Gibt den Ausgangspunkt der Fürsorge mit Jakobs frühestem Dasein wieder, ohne ihn enger auf Jugend oder Geburtsmoment festzulegen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf diesen Tag
  rationale: Bewahrt die feierliche zeitliche Wendung und die ununterbrochene Fortdauer bis zur Gegenwart.
theological_decisions:
- issue: Lebensführung der Erzväter vor Gott
  choice: vor dessen Angesicht meine Väter Abraham und Isaak ihren Weg gingen
  alternative: vor dem meine Väter Abraham und Isaak lebten
  rationale: Die gewählte Fassung bewahrt die relationale und bundestheologisch bedeutsame Wegmetapher sowie Gottes Gegenwart, ohne daraus eine engere dogmatische Aussage abzuleiten.
- issue: Gott als Hirte Jakobs
  choice: der mich … als Hirte geführt hat
  alternative: der mich ernährt hat
  rationale: Das Hirtenbild umfasst Führung, Schutz und Versorgung und wird daher nicht auf Ernährung oder materielle Fürsorge reduziert.
- issue: Beginn der göttlichen Fürsorge
  choice: seit ich bin
  alternative: seit meiner Geburt
  rationale: Die hebräische Wendung verweist auf Jakobs Dasein von seinem frühesten Anfang an; die Übersetzung vermeidet eine unnötige Festlegung auf den einzelnen Geburtsvorgang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor dessen Angesicht“ wahrt den feierlichen Ton, während „ihren Weg gingen“ gegenüber dem heute altertümlichen „wandelten“ verständlicher bleibt. Die abschließende Interpunktion zeigt, dass der Segensspruch im folgenden Vers weitergeht.
