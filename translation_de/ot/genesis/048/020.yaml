base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: de
  text: 'Er segnete sie an jenem Tag mit den Worten: »Mit dir[a] wird Israel segnen und sagen: ›Gott mache dich wie Efraim und wie Manasse!‹« Und er setzte Efraim vor Manasse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »An dir«. Die Wendung bezeichnet wahrscheinlich den Gebrauch dieser Namen als Segensformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: So segnete er sie
  rationale: Das Piel von ברך bedeutet hier »segnen«; das pluralische Objektsuffix bezieht sich gemeinsam auf Efraim und Manasse.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Bewahrt die zeitliche Bestimmtheit des hebräischen Ausdrucks in natürlichem Deutsch.
- source_word: לֵאמֹר
  choice: mit den Worten / und sagen
  rationale: Die beiden Vorkommen dienen als Einleitung direkter Rede; die leicht variierte Wiedergabe vermeidet unnatürliche Wiederholung, ohne die Struktur zu verlieren.
- source_word: בְּךָ
  choice: Mit dir
  rationale: 'Das ב bezeichnet hier den Bezug oder das Mittel der Segensformel: Israel wird unter Bezugnahme auf die Angesprochenen segnen. »Mit dir« wahrt die Kürze und Mehrdeutigkeit besser als eine erklärende Paraphrase.'
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: wird Israel segnen
  rationale: Der Imperfekt bezeichnet zukünftigen beziehungsweise üblichen Gebrauch. »Israel« bleibt ohne erklärende Erweiterung stehen.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Gott mache dich
  rationale: Im Kontext der Segensformel hat die Verbform Wunschcharakter; der deutsche Konjunktiv I gibt dies würdig und knapp wieder.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: wie Efraim und wie Manasse
  rationale: Das wiederholte vergleichende כ wird zur Wahrung von Rhythmus und Nachdruck zweimal mit »wie« wiedergegeben.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: So stellte er Efraim vor Manasse
  rationale: שׂים mit לִפְנֵי bezeichnet das Voranstellen und damit im Zusammenhang den Vorrang Efraims. »So« macht den folgernden Charakter der abschließenden Feststellung deutlich.
theological_decisions:
- issue: Bezug von »Israel« in der Segensformel
  choice: »Israel« bleibt unaufgelöst stehen.
  alternative: »Jakob« oder »das Volk Israel«
  rationale: Der hebräische Text nennt schlicht Israel. Im Zusammenhang kann der Name sowohl Jakob als Stammvater anklingen lassen als auch auf den künftigen Sprachgebrauch des Volkes weisen; die Übersetzung bewahrt diese Spannung.
- issue: Numerus von בְּךָ und יְשִׂמְךָ
  choice: Der hebräische Singular wird mit »dir/dich« bewahrt.
  alternative: Pluralische Wiedergabe »mit euch/euch« nach den beiden zuvor Gesegneten
  rationale: Obwohl »sie« Efraim und Manasse bezeichnet, steht die Segensformel im Hebräischen im Singular. Dieser Wechsel gehört zur Form der zitierten Segenswendung und soll nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; der knappe formelhafte Ton des hebräischen Segens bleibt erhalten. Die Namensform »Efraim« folgt gängigem modernem deutschem Bibelgebrauch.
