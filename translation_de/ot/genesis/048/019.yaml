  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: de
  text: 'Doch sein Vater weigerte sich und sagte: »Ich weiß, mein Sohn, ich weiß. Auch er wird zu einem Volk werden, und auch er wird groß werden. Doch sein jüngerer Bruder wird größer werden als er, und seine Nachkommen werden die Fülle der Völker[a] sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »eine Vielzahl von Völkern«. Das Hebräische lautet wörtlich: »die Fülle der Völker«.'
    reason: Die hebräische Wendung מְלֹא הַגּוֹיִם ist ungewöhnlich. Die Hauptfassung bewahrt ihre wörtliche, mehrdeutige Form; die Alternative gibt eine mögliche idiomatische Deutung an.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: weigerte sich
  rationale: Das Verb מאן bezeichnet eine bewusste Weigerung; im Zusammenhang weist Jakob Josefs Versuch zurück, seine Hände zu vertauschen.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Ich weiß, mein Sohn, ich weiß
  rationale: Die emphatische Wiederholung des Hebräischen bleibt erhalten und klingt im Deutschen natürlich.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Auch er wird zu einem Volk werden
  rationale: עָם wird grundlegend mit »Volk« wiedergegeben; »zu ... werden« bildet die prädikative Konstruktion mit היה angemessen ab.
- source_word: וְגַם הוּא יִגְדָּל
  choice: und auch er wird groß werden
  rationale: גדל bezeichnet hier eine künftige Zunahme an Größe, Bedeutung oder Rang; die offene Bedeutung wird nicht weiter festgelegt.
- source_word: וְאוּלָם
  choice: Doch
  rationale: Die Konjunktion markiert einen deutlichen Gegensatz, ohne in modernem Deutsch unnötig schwer zu wirken.
- source_word: אָחִיו הַקָּטֹן
  choice: sein jüngerer Bruder
  rationale: קטן bezeichnet hier im familiären Vergleich den jüngeren der Brüder.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: wird größer werden als er
  rationale: Das komparative מן drückt Ephraims größere künftige Bedeutung gegenüber Manasse aus.
- source_word: וְזַרְעוֹ
  choice: seine Nachkommen
  rationale: זרע ist kollektiv gebraucht; »Nachkommen« ist im modernen Deutsch klar und bewahrt diesen kollektiven Sinn.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: werden die Fülle der Völker sein
  rationale: Die Wiedergabe hält am lexikalischen Sinn von מְלֹא als »Fülle« fest und bewahrt die ungewöhnliche, mehrdeutige Formulierung des Hebräischen.
theological_decisions:
- issue: Deutung von מְלֹא הַגּוֹיִם
  choice: die Fülle der Völker
  alternative: eine Menge von Völkern
  rationale: Die Hauptfassung bewahrt das substantivische »Fülle« und damit mögliche intertextuelle und theologische Resonanzen, statt die Wendung eindeutig als bloße zahlenmäßige Vielheit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Ich weiß ... ich weiß« und die ungewöhnliche Wendung »die Fülle der Völker« bleiben bewusst erhalten. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Satz.
