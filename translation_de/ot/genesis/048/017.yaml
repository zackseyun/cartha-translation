source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: de
  text: Als Josef sah, dass sein Vater seine rechte Hand auf Efraims Kopf legte, missfiel es ihm[a]. Da ergriff er die Hand seines Vaters, um sie von Efraims Kopf weg auf Manasses Kopf zu legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „da war es schlecht in seinen Augen“. Gemeint ist: Es missfiel ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Als Josef sah, dass
  rationale: Die Konstruktion führt Josefs Wahrnehmung und seine anschließende Reaktion ein; „dass“ gibt den Inhalt dessen wieder, was er sah.
- source_word: יָשִׁית
  choice: legte
  rationale: Das Verb bezeichnet das Setzen oder Legen der Hand. Im Deutschen ist das Präteritum in der fortlaufenden Erzählung natürlich; die Vorzeitigkeit ergibt sich aus dem Zusammenhang.
- source_word: יַד יְמִינוֹ
  choice: seine rechte Hand
  rationale: Idiomatiche und genaue Wiedergabe der hebräischen Genitivverbindung; die für den Segensgestus bedeutsame rechte Hand bleibt ausdrücklich genannt.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: missfiel es ihm
  rationale: Die hebräische Wendung lautet wörtlich, dass es in seinen Augen schlecht war. „Missfiel es ihm“ gibt hier ihren gemeinten subjektiven Unmut natürlich wieder, ohne ein moralisches Urteil anzudeuten.
- source_word: וַיִּתְמֹךְ
  choice: Da ergriff er
  rationale: תמך kann stützen, festhalten oder ergreifen bedeuten. Hier fasst Josef die Hand seines Vaters an, um sie umzulenken; „ergriff“ ist prägnant, ohne unnötig Gewalt zu unterstellen.
- source_word: לְהָסִיר אֹתָהּ
  choice: um sie ... weg ... zu legen
  rationale: הסיר bezeichnet das Entfernen oder Wegnehmen. Zusammen mit dem Ziel עַל רֹאשׁ מְנַשֶּׁה wird die beabsichtigte Verlagerung der Hand im Deutschen als ein zusammenhängender Vorgang ausgedrückt.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: von Efraims Kopf weg auf Manasses Kopf
  rationale: Die Formulierung bewahrt sowohl den Ausgangspunkt als auch das Ziel der gerichteten Bewegung; „auf“ entspricht der beabsichtigten Platzierung auf Manasses Kopf.
