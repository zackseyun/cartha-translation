  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה אֵלַ֥/י בְּ/ל֖וּז בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יְבָ֖רֶךְ אֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: de
  text: 'Und Jakob sagte zu Josef: »Gott, der Allmächtige,[a] erschien mir in Lus im Land Kanaan und segnete mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „El Schaddai“. Traditionell mit „Gott, der Allmächtige“ wiedergegeben; die genaue Bedeutung von Schaddai ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw consecutivum führt die Erzählung fort. „Und … sagte“ bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: Die Präposition אֶל bezeichnet hier die Ausrichtung der Rede; „zu Josef“ ist die übliche deutsche Wiedergabe.
- source_word: אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  rationale: Der traditionelle deutsche Titel ist verständlich und würdig. Da die genaue Bedeutung von שַׁדַּי umstritten ist, wird die hebräische Form in einer Fußnote genannt.
- source_word: נִרְאָה אֵלַי
  choice: erschien mir
  rationale: Das Niphal von ראה bezeichnet hier eine sichtbare Erscheinung. „Erschien mir“ ist idiomatisch und fügt keine im Hebräischen unausgesprochene Deutung hinzu.
- source_word: בְּלוּז
  choice: in Lus
  rationale: Bei einem Ortsnamen ist „in Lus“ im Deutschen natürlich und gibt die lokale Präposition angemessen wieder.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Wiedergabe erhält das ausdrücklich genannte „Land“ und die geografische Bestimmung.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: und segnete mich
  rationale: Dasselbe göttliche Subjekt wird fortgeführt; im Deutschen ist kein zusätzliches Pronomen erforderlich.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El Schaddai; mächtiger Gott
  rationale: Die traditionelle Übersetzung vermittelt die übliche Bedeutung des Titels, ohne die lexikalische Unsicherheit zu verschweigen. Die hebräische Form und die umstrittene genaue Bedeutungsnuance werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am hebräischen Erzählfluss; die direkte Rede ist natürlich formuliert.
