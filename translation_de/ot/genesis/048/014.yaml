  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: de
  text: Da streckte Israel seine rechte Hand aus und legte sie auf den Kopf Ephraims, obwohl er der Jüngere war, und seine linke Hand auf den Kopf Manasses. Er legte seine Hände bewusst über Kreuz[a], denn Manasse war der Erstgeborene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er führte seine Hände mit Bedacht.“ Die hebräische Wendung kann die bewusste, geschickte Anordnung der Hände hervorheben; aus dem Zusammenhang geht hervor, dass Israel sie dabei über Kreuz legte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: streckte … aus
  rationale: Im Zusammenhang mit der Handbewegung bezeichnet das Verb ein Ausstrecken, nicht ein Senden.
- source_word: וַיָּשֶׁת
  choice: legte sie
  rationale: Das Verb beschreibt das gezielte Auflegen der Hand auf den Kopf.
- source_word: וְהוּא הַצָּעִיר
  choice: obwohl er der Jüngere war
  rationale: 'Die konzessive Formulierung gibt den Zusammenhang wieder: Ephraim erhielt trotz seines geringeren Alters die rechte Hand.'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: Er legte seine Hände bewusst über Kreuz
  rationale: Die schwierige Wendung betont eine überlegte beziehungsweise geschickte Anordnung der Hände; aus dem unmittelbaren Zusammenhang ergibt sich, dass sie dabei gekreuzt wurden.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Erklärung für die ungewöhnliche Anordnung der Hände ein.
- source_word: הַבְּכֹר
  choice: der Erstgeborene
  rationale: Bewahrt die kulturell und erzählerisch bedeutsame Aussage über die Geburtsrangfolge.
theological_decisions:
- issue: Deutung von שִׂכֵּל אֶת יָדָיו
  choice: Israel kreuzte seine Hände bewusst.
  alternative: Israel führte beziehungsweise ordnete seine Hände mit Bedacht, ohne dass das Kreuzen ausdrücklich benannt wird.
  rationale: Die Stellung der rechten Hand auf dem jüngeren Ephraim und der linken auf dem erstgeborenen Manasse zeigt im Kontext eine absichtliche Überkreuzung. „bewusst“ bewahrt zugleich den Bedeutungsaspekt des überlegten Handelns, ohne die Umkehrung der Erstgeburtsordnung weiter theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen den im Deutschen geläufigen Formen Ephraim und Manasse. Die schwierige hebräische Wendung wird im Haupttext kontextgemäß wiedergegeben; ihre lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
