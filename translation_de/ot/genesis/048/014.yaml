  terminology: „Israel“, „Ephraim“ und „Manasse“ entsprechen dem deutschen Bibelgebrauch. „Erstgeborene“ bewahrt die im Kontext relevante Geburtsrangfolge. Die Fußnote ist sachlich, verständlich und am passenden Ausdruck verankert.
