base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: de
  text: 'Josef sagte zu seinem Vater: „Das sind meine Söhne, die Gott mir hier[a] gegeben hat.“ Da sagte sein Vater: „Bring sie bitte zu mir[b], damit ich sie segne.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an diesem Ort“. Der hebräische Ausdruck kann Josefs gegenwärtigen Aufenthaltsort ausdrücklich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Nimm sie bitte zu mir“, im Sinn von: Bring sie zu mir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: Josef sagte zu seinem Vater
  rationale: Die einfache deutsche Erzählform gibt das hebräische Waw-Konsekutiv natürlich wieder; אָבִיו wird im würdigen Standardregister mit „seinem Vater“ übersetzt.
- source_word: בָּנַי הֵם
  choice: Das sind meine Söhne
  rationale: בָּנַי bezeichnet ausdrücklich männliche Nachkommen; die deiktische deutsche Formulierung ist in der vorliegenden Gesprächssituation natürlicher als „Sie sind meine Söhne“.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: die Gott mir ... gegeben hat
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit gegenwärtigem Ergebnis. אֱלֹהִים bezieht sich im Kontext auf Gott im Singular.
- source_word: בָּזֶה
  choice: hier
  rationale: Die knappe deiktische Wendung gibt den wahrscheinlich lokalen Bezug auf Josefs gegenwärtigen Aufenthaltsort idiomatisch wieder; die mögliche explizitere Wiedergabe wird in der Fußnote genannt.
- source_word: קָחֶם־נָא אֵלַי
  choice: Bring sie bitte zu mir
  rationale: Obwohl לקח häufig „nehmen“ bedeutet, verlangt die Bewegungsrichtung אֵלַי im Deutschen kontextgemäß „bringen“. נָא wird als höfliches „bitte“ wiedergegeben.
- source_word: וַאֲבָרֲכֵם
  choice: damit ich sie segne
  rationale: Nach der Aufforderung drückt die verbundene Form den beabsichtigten Zweck aus; „damit ich sie segne“ bewahrt diesen Zusammenhang natürlich.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Josefs Aussage
  choice: „Gott“ im Singular als der Geber von Josefs Söhnen
  alternative: allgemein „ein Gott“ oder pluralisch „Götter“
  rationale: Der unmittelbare patriarchalische Erzählzusammenhang weist auf den Gott Israels; die Übersetzung folgt dem klaren Kontext, ohne zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und natürlich; die hebräischen Höflichkeits- und Zwecknuancen werden ohne altertümliche Formulierungen bewahrt.
