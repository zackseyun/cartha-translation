  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: de
  text: 'Als Israel die Söhne Josefs sah, sagte er: »Wer sind diese?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als … sah
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; mit »Als … sah« wird der zeitliche Zusammenhang mit der folgenden Frage in natürlichem Deutsch wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text verwendet ausdrücklich den Bundesnamen Israel und nicht Jakob.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Die Partikel kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigenständige Entsprechung.
- source_word: בְּנֵי יוֹסֵף
  choice: die Söhne Josefs
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich »die Söhne Josefs«; diese Formulierung ist zugleich natürlich und quellennah.
- source_word: וַיֹּאמֶר
  choice: fragte er
  rationale: Wörtlich steht »und er sagte«. Da die folgende direkte Rede eine Frage ist, gibt »fragte er« die Sprechhandlung im modernen Deutsch präzise wieder; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: מִי אֵלֶּה
  choice: Wer sind diese?
  rationale: Die nominale Frage lautet wörtlich »Wer [sind] diese?«; die Kopula »sind« ist im Deutschen erforderlich.
