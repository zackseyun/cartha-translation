  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: de
  text: Israels Augen waren durch das Alter getrübt[a]; er konnte nicht sehen. Da brachte Joseph die beiden zu ihm[b], und Israel küsste und umarmte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Israels Augen waren vor Alter schwer geworden.“ Gemeint ist, dass seine Sehkraft im Alter nachgelassen hatte.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier nur „er“. Aus dem unmittelbaren Zusammenhang (V. 9) ergibt sich Joseph als derjenige, der die beiden zu Israel brachte.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Israels Augen
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich mit einem vorangestellten Eigennamen wiedergegeben. Der im Ausgangstext verwendete Name „Israel“ bleibt erhalten.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: waren vor Alter trübe geworden
  rationale: Wörtlich sind die Augen „schwer“ geworden; im Zusammenhang bezeichnet die Wendung altersbedingt beeinträchtigtes Sehvermögen. „Trübe geworden“ gibt diesen Sinn natürlich wieder, während „vor Alter“ die Ursache ausdrückt.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: er konnte nicht sehen
  rationale: Direkte und idiomatische Wiedergabe der im Hebräischen ausgedrückten Unfähigkeit.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Da brachte Joseph die beiden zu ihm
  rationale: Das Hifil von נגשׁ bedeutet „heranbringen“. Der Zusammenhang mit Vers 9 legt Joseph als handelnde Person und Israel als Ziel nahe. „Die beiden“ bezeichnet die zwei Söhne und ist im Deutschen klarer als ein bloßes „sie“.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: und Israel küsste und umarmte sie
  rationale: Die beiden Verben bezeichnen die liebevolle Begrüßung der Söhne. Die ausdrückliche Nennung Israels verhindert im Deutschen, dass Joseph fälschlich als fortgesetztes Subjekt verstanden wird.
