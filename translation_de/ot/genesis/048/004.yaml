  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: de
  text: 'Er sagte zu mir: »Sieh, ich werde dich fruchtbar machen und dich zahlreich werden lassen. Ich werde dich zu einer Versammlung von Völkern machen und dieses Land deinen Nachkommen nach dir als ewigen Besitz geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Sieh, ich werde
  rationale: Die hebräische Aufmerksamkeitsformel wird knapp und natürlich wiedergegeben; zusammen mit dem Partizip kündigt sie Gottes festes zukünftiges Handeln an.
- source_word: מַפְרְךָ
  choice: dich fruchtbar machen
  rationale: Bewahrt die Fruchtbarkeits- und Nachkommenschaftssprache der Wurzel פרה.
- source_word: וְהִרְבִּיתִךָ
  choice: dich zahlreich werden lassen
  rationale: Gibt die kausative Form von רבה wieder und vermeidet das im Deutschen missverständliche »dich vermehren«.
- source_word: לִקְהַל עַמִּים
  choice: zu einer Versammlung von Völkern
  rationale: קהל bezeichnet eine versammelte Gemeinschaft; der Plural »Völker« bleibt erhalten.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: deinen Nachkommen nach dir
  rationale: Das kollektive זרע wird im modernen Deutsch natürlich als »Nachkommen« wiedergegeben; die zeitliche Wendung bleibt ausdrücklich erhalten.
- source_word: אֲחֻזַּת עוֹלָם
  choice: als ewigen Besitz
  rationale: אֲחֻזָּה meint einen dauerhaft zugewiesenen Besitz; עוֹלָם wird entsprechend als »ewig« wiedergegeben.
theological_decisions:
- issue: Dauer der Landverheißung
  choice: ewiger Besitz
  alternative: dauerhafter Besitz
  rationale: Die starke zeitliche Aussage von עוֹלָם wird nicht abgeschwächt oder systematisch eingegrenzt.
- issue: Identität der angekündigten Gemeinschaft
  choice: Versammlung von Völkern
  alternative: Schar von Völkern
  rationale: Die Mehrzahl und kollektive Offenheit des Hebräischen bleiben bestehen, ohne die Formulierung konfessionell oder ethnisch näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; Parallelismus und Verheißungscharakter des Hebräischen bleiben erkennbar.
