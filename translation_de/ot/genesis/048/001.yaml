  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: de
  text: 'Nach diesen Ereignissen sagte jemand zu Josef: »Sieh, dein Vater ist krank.« Da nahm er seine beiden Söhne mit, Manasse und Ephraim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die Formel leitet eine neue Erzählentwicklung ein. »Nach diesen Ereignissen« gibt den zeitlichen Anschluss natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes »nun« einzufügen.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: sagte jemand zu Josef
  rationale: Das maskuline Singularsubjekt bleibt im Hebräischen ungenannt. »Jemand« wahrt diese Unbestimmtheit, statt einen Sprecher zu ergänzen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel weist nachdrücklich auf den Zustand des Vaters hin; »Sieh« ist knapp, würdig und weniger altertümlich als »siehe«.
- source_word: אָבִיךָ חֹלֶה
  choice: dein Vater ist krank
  rationale: Direkte und idiomatische Wiedergabe des gegenwärtigen Zustands.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Da nahm er seine beiden Söhne mit
  rationale: »Da« führt die Erzählung folgerichtig weiter; »mitnehmen« gibt עִמּוֹ im Deutschen natürlich wieder.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Manasse und Ephraim
  rationale: Gebräuchliche deutsche Formen der Personennamen; sie erläutern appositionell »seine beiden Söhne«.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die im Hebräischen bestehende Unbestimmtheit des Sprechers wird ausdrücklich gewahrt; keine konfessionelle Deutung wird ergänzt.
