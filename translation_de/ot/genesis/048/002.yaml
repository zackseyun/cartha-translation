base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: de
  text: 'Da teilte man Jakob mit: »Sieh, dein Sohn Josef ist zu dir gekommen.« Da nahm Israel seine Kräfte zusammen[a] und setzte sich im Bett auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »stärkte sich«.'
    reason: Die Fußnote macht die reflexive Formulierung des Hebräischen sichtbar, während der Haupttext idiomatisches Deutsch verwendet.
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: Da berichtete man Jakob und sagte
  rationale: Das Hebräische nennt den Sprecher nicht. Das unpersönliche »man« gibt dies im Deutschen natürlich wieder; zugleich bleiben beide Redeverben erhalten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird knapp und gegenwartsnah wiedergegeben, ohne das altertümliche »siehe«.
- source_word: בִּנְךָ יוֹסֵף
  choice: dein Sohn Josef
  rationale: Direkte, natürliche Wiedergabe der hebräischen Nominalgruppe; der Name folgt der üblichen deutschen Schreibweise.
- source_word: בָּא אֵלֶיךָ
  choice: ist zu dir gekommen
  rationale: Die abgeschlossene Ankunft hat unmittelbare Gegenwartsrelevanz und löst Israels Reaktion aus.
- source_word: וַיִּתְחַזֵּק
  choice: nahm seine Kräfte zusammen
  rationale: Der Hitpael von חזק bezeichnet hier angesichts von Jakobs Krankheit ein aktives Sichstärken. Die Formulierung ist idiomatischer als das wörtliche »stärkte sich«.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der bewusste Namenswechsel von Jakob zu Israel wird nicht eingeebnet.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: setzte sich im Bett auf
  rationale: Im Krankheitskontext bezeichnet ישב das Aufsetzen; »im Bett« ist im modernen Deutschen die natürliche räumliche Formulierung.
theological_decisions:
- issue: Wechsel zwischen den Namen Jakob und Israel
  choice: Den Namenswechsel des hebräischen Textes genau bewahren
  alternative: Aus stilistischen Gründen durchgehend »Jakob« verwenden
  rationale: Der Wechsel kann literarisch oder theologisch bedeutsam sein. Die Übersetzung bewahrt ihn, ohne ihn auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht formale Doppelung »berichtete … und sagte« folgt bewusst der hebräischen Erzählweise; ansonsten werden natürliche deutsche Wendungen verwendet.
