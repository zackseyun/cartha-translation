  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: de
  text: 'Und Israel sagte zu Josef: „Ich hatte nicht erwartet, dein Gesicht zu sehen. Und nun hat Gott mich sogar deine Nachkommen sehen lassen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt den fortschreitenden Erzählstil des Wayyiqtol schlicht und ohne zusätzliche zeitliche Deutung wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bewahrt den im hebräischen Text verwendeten Namen, statt ihn zu Jakob zu harmonisieren.
- source_word: רְאֹה פָנֶיךָ
  choice: dein Gesicht noch einmal zu sehen
  rationale: Bewahrt die konkrete hebräische Wendung. „Noch einmal“ macht im Deutschen den aus dem Erzählzusammenhang hervorgehenden Sinn des Wiedersehens natürlich verständlich.
- source_word: לֹא פִלָּלְתִּי
  choice: Ich hatte nicht erwartet
  rationale: Das Verb bezeichnet hier das Erwarten oder Für-möglich-Halten, nicht das Beten. Das Plusquamperfekt gibt die zeitlich vorausliegende Erwartung idiomatisch wieder.
- source_word: וְהִנֵּה
  choice: Und nun
  rationale: Vermittelt den überraschenden Umschwung der hebräischen Präsentationspartikel in natürlichem modernem Deutsch.
- source_word: הֶרְאָה אֹתִי
  choice: hat … mich … sehen lassen
  rationale: Gibt die kausative Hifil-Form von ראה direkt und zugleich idiomatisch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Entspricht dem allgemeinen Gottesnamen im Ausgangstext.
- source_word: גַּם
  choice: sogar
  rationale: 'Hebt die unerwartete Steigerung hervor: Israel sieht nicht nur Josef, sondern auch dessen Nachkommen.'
- source_word: זַרְעֶךָ
  choice: deine Nachkommen
  rationale: Gibt das kollektive Singularwort זרע in diesem Zusammenhang natürlich wieder und umfasst hier Josefs Söhne.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Erzvätererzählung
  choice: Gott
  alternative: der HERR
  rationale: Der Ausgangstext verwendet אֱלֹהִים und nicht den Gottesnamen JHWH; daher wird keine spezifischere Gottesbezeichnung eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildhaftigkeit von „dein Gesicht sehen“ bleibt erhalten; die überraschende Steigerung wird durch „Und nun“ und „sogar“ klar ausgedrückt.
