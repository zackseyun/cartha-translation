base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: de
  text: Der Engel, der mich aus allem Unheil erlöst hat[a], segne die Jungen. Sie sollen nach meinem Namen und dem Namen meiner Väter, Abraham und Isaak, genannt werden[b]. Sie sollen sich zahlreich vermehren[c] mitten im Land[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus allem Bösen«, »vor allem Schaden« oder »aus jeder Not«. Das hebräische Wort kann moralisch Böses ebenso wie Unglück und Unheil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Mein Name und der Name meiner Väter Abraham und Isaak sollen an ihnen ausgerufen werden.« Die hebräische Wendung bezeichnet, dass sie diesen Namen tragen und zur entsprechenden Familienlinie gehören.'
    reason: lexical_alternative
  - marker: c
    text: 'Das seltene hebräische Verb erinnert möglicherweise an die überreiche Vermehrung von Fischen. Daher auch: »Sie sollen zu einer großen Menge anwachsen.«'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »mitten auf der Erde«. Das hebräische Wort kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Im patriarchalischen Zusammenhang ist »Engel« die natürliche Wiedergabe, ohne seine Identität näher festzulegen.
- source_word: הַגֹּאֵל אֹתִי
  choice: der mich … erlöst hat
  rationale: Das Partizip von גאל bezeichnet den Erlöser oder Befreier. Das Perfekt im Deutschen gibt hier Jakobs rückblickende Lebenserfahrung natürlich wieder und bewahrt den Erlösungsaspekt.
- source_word: מִכָּל רָע
  choice: aus allem Unheil
  rationale: רָע umfasst sowohl moralisch Böses als auch Unglück, Schaden und Not. Im Rückblick auf Jakobs Bewahrung trifft »Unheil« den unmittelbaren Kontext, während die Bedeutungsbreite in der Fußnote erhalten bleibt.
- source_word: יְבָרֵךְ
  choice: segne
  rationale: Der Jussiv wird in der Segensformel durch den gehobenen deutschen Wunschsatz »segne« knapp und würdig wiedergegeben.
- source_word: הַנְּעָרִים
  choice: die Jungen
  rationale: Gemeint sind Ephraim und Manasse. »Die Jungen« ist modernes, konkretes Deutsch und vermeidet das veraltete »Knaben«.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: Mein Name und der Name meiner Väter … sollen in ihnen weiterleben
  rationale: Die hebräische Wendung lautet wörtlich, dass die Namen »an/über ihnen gerufen« werden. »In ihnen weiterleben« vermittelt im Deutschen verständlich die Zugehörigkeit zur Familie und die Fortführung ihres Namens, ohne die wörtliche Bildsprache unkommentiert unnatürlich wiederzugeben.
- source_word: וְיִדְגּוּ לָרֹב
  choice: Sie sollen sich zahlreich vermehren
  rationale: Das seltene Verb דגה spielt wahrscheinlich auf die reiche Vermehrung von Fischen an. Die Hauptübersetzung gibt den Sinn natürlich wieder; die mögliche Bildhaftigkeit wird in der Fußnote genannt.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: mitten im Land
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Der Zusammenhang der patriarchalischen Verheißung spricht für »Land«, doch die weitere Möglichkeit bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Identität des Engels in Jakobs Segen
  choice: »der Engel« ohne nähere Identifizierung
  alternative: eine Erscheinung Gottes oder ein geschaffenes, von Gott bevollmächtigtes Wesen
  rationale: Der Engel wird eng mit Gottes rettendem Handeln verbunden, doch der hebräische Text bestimmt seine ontologische Identität nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung des auf den Nachkommen ausgerufenen Namens
  choice: Fortleben des Familiennamens und Zugehörigkeit zur Linie Jakobs, Abrahams und Isaaks
  alternative: 'wörtlich: Die Namen sollen »an/über ihnen gerufen werden«'
  rationale: Die idiomatische Hauptfassung macht die dynastische Zugehörigkeit verständlich, ohne daraus eine weitergehende dogmatische Aussage abzuleiten; die formale Wendung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Segenssprache bleibt durch den Konjunktiv beziehungsweise die jussive Form gehoben, während »die Jungen« bewusst gegen das heute altertümliche »die Knaben« gewählt wurde. Die hebräische Namensformel wird im Haupttext verständlich idiomatisch und in der Fußnote formal transparent wiedergegeben.
