base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: de
  text: Ich aber gebe dir einen Anteil mehr als deinen Brüdern[a], den ich dem Amoriter mit meinem Schwert und meinem Bogen abgenommen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שְׁכֶם (schechem) kann „Schulter“, „Bergrücken“ oder hier „Anteil“ bedeuten und zugleich auf den Ortsnamen Sichem anspielen. Die Formulierung kann daher sowohl einen zusätzlichen Erbanteil als auch das später mit Josef verbundene Gebiet anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen hebt Jakob hervor; „aber“ gibt den Kontrast im Zusammenhang natürlich wieder, ohne das im Deutschen schwerfällige „ich selbst“ zu erzwingen.
- source_word: נָתַתִּי
  choice: gebe
  rationale: 'Die Perfektform kann in dieser testamentarischen Erklärung performativ verstanden werden: Jakob vollzieht mit seinen Worten die Zuweisung.'
- source_word: שְׁכֶם אַחַד
  choice: einen Anteil
  rationale: Im Erbkontext bezeichnet die Wendung plausibel einen zusätzlichen Anteil. Zugleich kann שְׁכֶם „Schulter“ beziehungsweise einen Bergrücken bezeichnen und auf den Ortsnamen Sichem anspielen; diese Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: עַל אַחֶיךָ
  choice: mehr als deinen Brüdern
  rationale: עַל bezeichnet hier einen Vorrang oder Zusatz gegenüber den Brüdern. Die deutsche Formulierung macht den zusätzlichen Anteil verständlich.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: den ich … abgenommen habe
  rationale: „Abgenommen“ gibt לקח zusammen mit מִיַּד idiomatisch wieder und lässt die ausdrücklich genannten Waffen als Mittel der Aneignung stehen.
- source_word: מִיַּד הָאֱמֹרִי
  choice: dem Amoriter
  rationale: Die hebräische Wendung „aus der Hand“ bezeichnet Macht oder Besitz. Der Singular „der Amoriter“ bleibt als möglicher kollektiver oder repräsentativer Singular erhalten.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: mit meinem Schwert und meinem Bogen
  rationale: Die beiden Waffen und die instrumentale Bedeutung der Präposition werden direkt wiedergegeben.
theological_decisions:
- issue: Bedeutung von שְׁכֶם und möglicher Bezug auf Sichem sowie Josefs zusätzlichen Erbanteil
  choice: Im Haupttext steht „einen Anteil“; die mögliche Wortbedeutung „Schulter/Bergrücken“ und die Anspielung auf Sichem werden in einer Fußnote genannt.
  alternative: „einen Bergrücken“ oder „Sichem als einen Anteil“
  rationale: Der Erbkontext spricht für „Anteil“, doch der hebräische Ausdruck kann zugleich ein topografisches Wortspiel und einen Ortsbezug enthalten. Die Fußnote bewahrt diese Spannung, ohne den Haupttext auf eine unsichere Deutung festzulegen.
- issue: Jakobs Aussage, das Land mit Schwert und Bogen genommen zu haben
  choice: Die Ich-Aussage und die kriegerischen Mittel werden ohne Harmonisierung direkt wiedergegeben.
  alternative: Metaphorische Deutung oder Bezug auf spätere Taten seiner Nachkommen ausdrücklich machen
  rationale: Der Vers selbst erklärt weder die historische Einordnung noch eine mögliche stellvertretende oder prophetische Bedeutung. Die Übersetzung soll diese offene Frage nicht entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich aber“ wahrt die Hervorhebung des hebräischen Pronomens auf natürliche Weise; „dem Amoriter“ erhält den auffälligen Singular des Ausgangstextes.
