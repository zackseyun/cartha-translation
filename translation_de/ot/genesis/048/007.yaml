base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: de
  text: 'Was mich betrifft: Als ich aus Paddan[a] kam, starb mir[b] Rahel im Land Kanaan unterwegs, als bis Efrat noch eine Wegstrecke zurückzulegen war; und ich begrub sie dort am Weg nach Efrat – das ist Betlehem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier nur »Paddan«; die aus verwandten Stellen bekannte längere Bezeichnung lautet »Paddan-Aram«.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Rahel starb über/bei mir«. Die hebräische Wendung kann ihre Nähe zu Jakob und zugleich die persönliche Last ihres Todes für ihn hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Was mich betrifft
  rationale: Das selbstständige Pronomen nach der Konjunktion hebt Jakob hervor und leitet seine persönliche Rückschau ein.
- source_word: מִפַּדָּן
  choice: aus Paddan
  rationale: Der masoretische Text nennt hier nur Paddan; die längere Form Paddan-Aram wird nicht aus Parallelstellen ergänzt.
- source_word: מֵתָה עָלַי רָחֵל
  choice: starb mir Rahel
  rationale: Der deutsche Dativ gibt sowohl Jakobs persönliche Betroffenheit als auch die enge Beziehung zum Geschehen wieder, ohne die mehrdeutige hebräische Wendung rein räumlich oder rein emotional festzulegen.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: als bis Efrat noch eine gewisse Wegstrecke zurückzulegen war
  rationale: כִּבְרַת אֶרֶץ bezeichnet eine verbleibende Strecke, deren genaue Länge unklar ist. Die Formulierung vermeidet falsche Präzision.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: am Weg nach Efrat
  rationale: Die Wendung bezeichnet den Ort der Bestattung an der Reiseroute nach Efrat.
- source_word: הִוא בֵּית לָחֶם
  choice: das ist Betlehem
  rationale: Die identifizierende Erläuterung des hebräischen Textes wird direkt und verständlich wiedergegeben.
theological_decisions:
- issue: Bedeutung von עָלַי in der Aussage über Rahels Tod
  choice: starb mir Rahel
  alternative: starb an meiner Seite / starb zu meinem Leidwesen
  rationale: Die knappe deutsche Wendung bewahrt die persönliche Betroffenheit, ohne zwischen einer räumlichen und einer emotionalen Deutung abschließend zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung »starb mir Rahel« lässt die persönliche Klage anklingen und erhält zugleich die Mehrdeutigkeit des Hebräischen. Geografische Namen folgen den im Deutschen üblichen Formen Efrat und Betlehem.
