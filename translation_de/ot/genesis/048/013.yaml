base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: de
  text: 'Josef nahm die beiden: Efraim in seine rechte Hand, an Israels linker Seite, und Manasse in seine linke Hand, an Israels rechter Seite, und führte sie zu ihm hin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: sodass er links von Israel war / sodass er rechts von Israel war
  rationale: Die Präposition מִן bezeichnet hier im räumlichen Zusammenhang die Position der Söhne relativ zu Israel. Die explizite Formulierung vermeidet das im Deutschen mögliche Missverständnis einer Bewegungsrichtung.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: Dann führte er sie zu Israel hin
  rationale: נגשׁ im Hifil bedeutet hier, jemanden heranzuführen. Das Pronomen bezieht sich auf Israel; die Wiederaufnahme des Namens schafft im Deutschen Klarheit.
- source_word: בִּימִינוֹ / בִשְׂמֹאלוֹ
  choice: an seiner rechten Seite / an seiner linken Seite
  rationale: Die Wiedergabe beschreibt Josefs Anordnung der beiden Söhne natürlich und bewahrt die räumliche Gegenüberstellung.
