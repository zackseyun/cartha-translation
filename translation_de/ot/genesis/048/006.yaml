base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: de
  text: Aber die Kinder, die du nach ihnen zeugen wirst, sollen dir gehören[a]. Sie sollen beim Erbbesitz ihrer Brüder unter deren Namen geführt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Sie erhalten keine eigenen Stammesgebiete, sondern werden beim Erbbesitz Ephraim und Manasse zugerechnet.'
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: deine Nachkommen
  rationale: Das Substantiv bezeichnet die von Josef Gezeugten beziehungsweise seine Nachkommenschaft. „Nachkommen“ ist im Deutschen natürlich und lässt den Umfang offen.
- source_word: אֲשֶׁר הוֹלַדְתָּ
  choice: die du … zeugst
  rationale: Der Hifil von ילד bezeichnet bei dem angesprochenen Vater das Zeugen. Das deutsche Präsens passt zur noch zukünftigen, im Relativsatz beschriebenen Möglichkeit.
- source_word: אַחֲרֵיהֶם
  choice: nach ihnen
  rationale: Der Ausdruck verweist unmittelbar auf Ephraim und Manasse und bleibt entsprechend knapp.
- source_word: לְךָ יִהְיוּ
  choice: sollen dir gehören
  rationale: Die Formulierung gibt die familiäre und rechtliche Zuordnung wieder und bewahrt den Kontrast dazu, dass Ephraim und Manasse Jakob zugerechnet werden.
- source_word: עַל שֵׁם אֲחֵיהֶם יִקָּרְאוּ
  choice: unter deren Namen geführt werden
  rationale: Wörtlich geht es darum, „nach/auf dem Namen“ ihrer Brüder genannt zu werden. Im Erbkontext macht „unter deren Namen geführt“ die gemeinte Zuordnung verständlich, ohne die Brüder ausdrücklich zu identifizieren.
- source_word: בְּנַחֲלָתָם
  choice: beim Erbbesitz ihrer Brüder
  rationale: נַחֲלָה bezeichnet hier den erblichen Stammesbesitz beziehungsweise das Landlos. Die Formulierung bindet das Pronomen natürlich an die unmittelbar genannten Brüder zurück.
theological_decisions:
- issue: Status späterer Söhne Josefs gegenüber Ephraim und Manasse
  choice: Sie gehören Josef und werden beim Erbbesitz unter den Namen ihrer Brüder geführt.
  alternative: Sie erhalten eigene, gleichrangige Stammeserbteile.
  rationale: Der hebräische Wortlaut unterscheidet ihre Zugehörigkeit von der besonderen Annahme Ephraims und Manasses und ordnet sie beim Erbe den Brüdern zu; er begründet daraus keine selbstständigen Stämme.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeugen“ wahrt die väterliche Perspektive des hebräischen Verbs; „unter deren Namen geführt werden“ vermittelt den rechtlich-genealogischen Sinn des Passivs im Erbkontext.
