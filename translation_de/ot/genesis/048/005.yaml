  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: de
  text: 'Und nun: Deine beiden Söhne, die dir im Land Ägypten geboren wurden, bevor ich zu dir nach Ägypten kam,[a] gehören mir. Ephraim und Manasse werden mir gehören wie Ruben und Simeon.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung kann formaler auch mit „bis ich zu dir nach Ägypten kam“ wiedergegeben werden. Im Zusammenhang bezeichnet sie die Söhne, die vor Jakobs Ankunft geboren wurden.
    reason: lexikalische Alternative
  - marker: b
    text: 'Das heißt: Ephraim und Manasse werden Jakobs eigenen Söhnen gleichgestellt.'
    reason: Erläuterung des sozialen und familiären Status
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an die vorausgehende Rede als auch den nachdrücklichen Übergang.
- source_word: שְׁנֵי בָנֶיךָ
  choice: deine beiden Söhne
  rationale: Gibt Zahl und Zugehörigkeit unmittelbar und in natürlichem Deutsch wieder.
- source_word: הַנּוֹלָדִים לְךָ
  choice: die dir … geboren wurden
  rationale: Entspricht dem attributiven passiven Partizip und wahrt die Beziehung zu Josef.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Behält das ausdrücklich genannte אֶרֶץ bei.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: bevor ich zu dir nach Ägypten kam
  rationale: Gibt die im Kontext gemeinte zeitliche Grenze idiomatisch wieder; die formal mögliche Wiedergabe mit „bis“ wird in der Fußnote genannt.
- source_word: לִי הֵם
  choice: gehören mir
  rationale: Drückt den Anspruch Jakobs natürlich aus, ohne einen technischen Adoptionsbegriff einzuführen.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Ephraim und Manasse
  rationale: Verwendet die im Deutschen geläufigen Namensformen.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: wie Ruben und Simeon
  rationale: Das Präfix כ markiert einen Vergleich ihres Status.
- source_word: יִהְיוּ לִי
  choice: sollen mir gehören
  rationale: Bewahrt den feierlich-festsetzenden Zukunftssinn und vermeidet zugleich altertümliches Deutsch.
theological_decisions:
- issue: Art von Jakobs Anspruch auf Ephraim und Manasse
  choice: Als Zugehörigkeits- und Statusaussage wiedergeben, ohne den Vorgang ausdrücklich „Adoption“ zu nennen.
  alternative: „Ich nehme sie als meine eigenen Söhne an.“
  rationale: Der hebräische Text sagt, dass sie Jakob gehören und ihm wie Ruben und Simeon sein sollen. Er vermittelt damit ihre Eingliederung in Jakobs eigene Nachkommenschaft, verwendet aber keinen technischen Adoptionsbegriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Ägypten“ bleibt erhalten, weil beide Ortsangaben im Hebräischen ausdrücklich stehen. „Gehören mir“ und „sollen mir gehören“ bewahren die Aussage, ohne eine technische Rechtsterminologie einzutragen.
