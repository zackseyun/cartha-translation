source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: de
  text: 'Dann sagte Israel zu Josef: „Sieh, ich stehe kurz vor dem Tod. Doch Gott wird mit euch[a] sein und euch in das Land eurer Väter zurückbringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Euch“ steht hier und bei „zurückbringen“ im Hebräischen im Plural. Die Zusage richtet sich damit nicht an Josef allein, sondern kann auch seine Familie oder seine Nachkommen einschließen. Das einleitende „Doch“ kann auch schlicht mit „Und“ übersetzt werden.
    reason: Die Pluralform ist im Deutschen erkennbar, ihr Wechsel von der Anrede Josefs kann jedoch übersehen werden; außerdem bewahrt die Anmerkung die Mehrdeutigkeit der hebräischen Konjunktion, ohne den genauen Referentenkreis festzulegen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann sagte“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text verwendet ausdrücklich den Bundesnamen Israel und nicht Jakob.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsmarker wird in würdigem, verständlichem Deutsch wiedergegeben, ohne das altertümliche „Siehe“ zu erzwingen.
- source_word: אָנֹכִי מֵת
  choice: ich werde sterben
  rationale: Die Partizipialkonstruktion bezeichnet hier den bevorstehenden Tod. Die Wiedergabe ist natürlich und vermeidet das missverständliche wörtliche „ich bin tot“.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: Doch Gott wird mit euch sein
  rationale: 'Das Waw ist formal verbindend, hat im Zusammenhang aber wahrscheinlich kontrastive Kraft: Israel stirbt, Gottes Gegenwart bleibt.'
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Das Suffix steht im Plural und weitet die Zusage über Josef als Einzelperson hinaus aus.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: und euch … zurückbringen
  rationale: 'Der Hifil von שוב ist kausativ: Gott bewirkt ihre Rückkehr.'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: in das Land eurer Väter
  rationale: Die Formulierung bleibt nahe am hebräischen Ausdruck und bezeichnet das den Erzvätern zugesagte Land.
theological_decisions:
- issue: Bezug der pluralischen Pronomen
  choice: Die Pluralformen werden mit „euch“ bewahrt.
  alternative: Die Aussage ausschließlich auf Josef als Einzelperson beziehen.
  rationale: עִמָּכֶם, אֶתְכֶם und אֲבֹתֵיכֶם sind Pluralformen; die Verheißung umfasst daher Josef zusammen mit seiner Familie beziehungsweise seinen Nachkommen.
- issue: Sinn des Waw vor Gottes Gegenwart
  choice: Kontrastiv mit „Doch“ wiedergeben.
  alternative: Formal mit „Und“ wiedergeben.
  rationale: Beide Lesarten sind sprachlich möglich; im Kontext tritt Gottes bleibende Gegenwart Israels bevorstehendem Tod gegenüber. Die Fußnote hält die formale Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ erhält den Aufmerksamkeitsruf, ohne unnötig altertümlich zu wirken. „Land eurer Väter“ bewahrt die konkrete patriarchale Ausdrucksweise des Ausgangstextes.
