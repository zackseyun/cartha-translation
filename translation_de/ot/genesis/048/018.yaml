source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: de
  text: 'Da sagte Josef zu seinem Vater: „Nicht so, mein Vater, denn dieser ist der Erstgeborene. Lege deine rechte Hand auf seinen Kopf.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da sagte“ ist im modernen deutschen Erzählstil natürlich und gibt den Fortgang wieder.
- source_word: אֶל אָבִיו
  choice: zu seinem Vater
  rationale: אֶל bezeichnet hier die Richtung der Rede; der Ausdruck mit Suffix wird idiomatisch als „zu seinem Vater“ wiedergegeben.
- source_word: לֹא כֵן
  choice: Nicht so
  rationale: Die Wendung drückt einen direkten, aber im Zusammenhang respektvollen Einspruch gegen die Handstellung aus.
- source_word: אָבִי
  choice: mein Vater
  rationale: Das Suffix der ersten Person Singular wird ausdrücklich wiedergegeben und bewahrt Josefs respektvolle Anrede.
- source_word: כִּי זֶה הַבְּכֹר
  choice: Dieser ist der Erstgeborene
  rationale: כִּי begründet den Einspruch. Im Deutschen kann die knappe Satzfolge den Begründungszusammenhang natürlich tragen; זֶה bleibt als hinweisendes „Dieser“ erhalten, und הַבְּכֹר wird als Statusbezeichnung wiedergegeben.
- source_word: שִׂים
  choice: Lege
  rationale: Beim Auflegen einer Hand auf den Kopf ist „lege“ die natürliche deutsche Wiedergabe des Imperativs.
- source_word: יְמִינְךָ
  choice: deine rechte Hand
  rationale: יָמִין bezeichnet in diesem Gestenzusammenhang eindeutig die rechte Hand; „Hand“ wird zur Klarheit ausdrücklich genannt.
- source_word: עַל רֹאשׁוֹ
  choice: auf seinen Kopf
  rationale: Die Präpositionalverbindung bezeichnet die Handauflegung auf den Kopf und wird unmittelbar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Statusbezeichnung im Zusammenhang des Segens
  choice: der Erstgeborene
  alternative: der Ältere
  rationale: הַבְּכֹר bezeichnet nicht nur das höhere Alter, sondern den familiären Status des Erstgeborenen, der für Erbrecht und Segnung bedeutsam ist. „Erstgeborene“ bewahrt diese Spannung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. „Nicht so, mein Vater!“ bewahrt zugleich Josefs entschiedenen Einspruch und seine respektvolle Anrede. Keine Fußnoten erforderlich.
