  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: de
  text: Dann führte Josef sie aus der Nähe von Jakobs Knien weg[a] und warf sich mit dem Gesicht zur Erde nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von zwischen Jakobs Knien hervor“. Der hebräische Ausdruck bezeichnet ihre unmittelbare Stellung bei Jakob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: führte ... weg
  rationale: 'Der Hifil von יצא hat hier kausative Bedeutung: Josef veranlasst die beiden, ihre Stellung bei Jakob zu verlassen. „Führte ... weg“ gibt die Bewegung im Deutschen natürlich wieder.'
- source_word: אֹתָם
  choice: die beiden
  rationale: Das Objektpronomen bezieht sich auf Efraim und Manasse; „die beiden“ macht den Bezug im Deutschen klar, ohne zusätzliche Information einzuführen.
- source_word: מֵעִם בִּרְכָּיו
  choice: von den Knien seines Vaters weg
  rationale: מֵעִם bezeichnet eine Bewegung aus unmittelbarer Nähe beziehungsweise von der Seite weg. Die Knie gehören dem Kontext nach Jakob. Die Formulierung vermeidet, die räumlich nicht völlig eindeutige Wendung im Haupttext auf „zwischen“ festzulegen.
- source_word: וַיִּשְׁתַּחוּ
  choice: verbeugte sich
  rationale: Die Form von שׁחה bezeichnet eine ehrerbietige tiefe Verbeugung beziehungsweise Niederwerfung; der folgende Ausdruck beschreibt die Körperhaltung genauer.
- source_word: לְאַפָּיו אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die feste Verbindung beschreibt eine Verbeugung, bei der das Gesicht erdwärts gerichtet ist. „Zur Erde“ bewahrt die konkrete Bildsprache und klingt würdig.
theological_decisions:
- issue: Bezugswort des Suffixes in בִּרְכָּיו („seinen Knien“)
  choice: Jakobs Knie, im Text verdeutlicht als „die Knie seines Vaters“
  alternative: Josefs Knie
  rationale: Im Zusammenhang führt Josef seine Söhne aus ihrer unmittelbaren Stellung bei Jakob weg und erweist Jakob anschließend Ehrerbietung. Daher bezieht sich das maskuline Singularsuffix am natürlichsten auf Jakob; dies ist eine kontextuelle, keine lehrmäßige Entscheidung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Seines Vaters“ klärt den im Deutschen sonst missverständlichen Pronomenbezug; die Fußnote bewahrt die räumliche Mehrdeutigkeit des Hebräischen.
