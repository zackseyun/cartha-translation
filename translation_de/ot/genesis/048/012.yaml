  verdict: revise
  source_fidelity: 'Die Grundhandlung ist richtig wiedergegeben: Josef entfernt Efraim und Manasse von Jakob und erweist ihm anschließend tiefe Ehrerbietung. „Seines Vaters“ fügt jedoch eine Verwandtschaftsbezeichnung hinzu, die im hebräischen Wortlaut nicht steht. Der Kontext macht Jakob als wahrscheinlichsten Bezug des Suffixes kenntlich, doch sollte dies nicht als zusätzliche Benennung „Vater“ formuliert werden. Die Wendung לְאַפָּיו אָרְצָה bezeichnet vollständige Niederwerfung; „verbeugte sich mit dem Gesicht zur Erde“ ist möglich, aber weniger präzise als eine Niederwerfungsformulierung.'
  naturalness: „Dann führte Josef die beiden von den Knien seines Vaters weg“ klingt im Deutschen etwas schwerfällig und kann ein tatsächliches Sitzen auf den Knien nahelegen. „führte sie aus der Nähe von Jakobs Knien weg“ ist idiomatischer und gibt die räumliche Nähe wieder. „warf sich mit dem Gesicht zur Erde nieder“ ist natürlich und entspricht der Intensität der Geste.
  terminology: „Josef“ ist die übliche deutsche Namensform. „Jakob“ ist als kontextuelle Identifizierung des wahrscheinlich gemeinten Besitzers der Knie angemessen; „seines Vaters“ sollte entfallen, da es nicht im Ausgangstext ausgedrückt ist. Die Fußnote sollte die mögliche räumliche Nuance („zwischen“) knapp dokumentieren.
  issues:
  - severity: medium
    issue: „seines Vaters“ ergänzt eine nicht ausdrücklich im hebräischen Text enthaltene Verwandtschaftsbezeichnung.
    rationale: Das Suffix an „seinen Knien“ verweist im Kontext wahrscheinlich auf Jakob, aber der Text nennt ihn hier nicht „Vater“. Eine Übersetzung sollte keine zusätzliche Bezeichnung einführen.
  - severity: low
    issue: „verbeugte sich“ kann die Niederwerfungsintensität von וַיִּשְׁתַּחוּ ... אָרְצָה abschwächen.
    rationale: Die Verbindung mit „Gesicht“ und „Erde“ beschreibt eine Prostration. „warf sich ... nieder“ gibt dies im modernen Standarddeutsch genauer wieder.
  revised_text: Dann führte Josef sie aus der Nähe von Jakobs Knien weg[a] und warf sich mit dem Gesicht zur Erde nieder.
