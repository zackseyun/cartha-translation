revisions:
- from: Dann führte Josef die beiden von den Knien seines Vaters weg[a] und verbeugte sich mit dem Gesicht zur Erde.
  to: Dann führte Josef sie aus der Nähe von Jakobs Knien weg[a] und warf sich mit dem Gesicht zur Erde nieder.
  rationale: Die Revision entfernt die nicht im Wortlaut enthaltene Ergänzung „seines Vaters“, bewahrt die kontextuell wahrscheinliche Bezugnahme auf Jakob und gibt die räumliche Wendung ohne unnötige Festlegung auf ein Sitzen „auf“ oder „zwischen“ den Knien wieder. Die abschließende Geste wird als Niederwerfung wiedergegeben, weil das Gesicht zur Erde gerichtet ist.
