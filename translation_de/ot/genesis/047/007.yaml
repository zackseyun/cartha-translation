  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: de
  text: Dann brachte Josef seinen Vater Jakob herein und stellte ihn dem Pharao vor[a]. Jakob segnete den Pharao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ließ ihn vor dem Pharao stehen« oder »stellte ihn vor den Pharao hin«.'
    reason: lexical_alternative
  - marker: b
    text: »Segnete« kann hier einen förmlich ausgesprochenen Segen bezeichnen, nicht nur eine höfliche Begrüßung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: brachte … herein
  rationale: 'Die Hifil-Form von בוא hat verursachende Bedeutung: Josef veranlasste, dass Jakob in die Gegenwart des Pharaos kam. »Brachte … herein« gibt dies in der höfischen Situation natürlich wieder.'
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Das Suffix der 3. Person Singular bezieht sich auf Josef; »seinen Vater« ist die natürliche deutsche Wiedergabe.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: stellte ihn … vor
  rationale: Das Hifil von עמד bedeutet wörtlich »ließ ihn stehen« beziehungsweise »stellte ihn hin«. Im Kontext einer Audienz bezeichnet »stellte ihn dem Pharao vor« idiomatisch die förmliche Präsentation, ohne den Grundsinn zu verdecken.
- source_word: לִפְנֵי פַרְעֹה
  choice: dem Pharao
  rationale: לִפְנֵי bezeichnet hier die Gegenwart des Pharaos. Zusammen mit »jemanden vorstellen« wird dies im Deutschen idiomatisch durch den Dativ ausgedrückt.
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: ברך bedeutet regulär »segnen«. Die Wiedergabe bewahrt die auffällige Aussage, dass Jakob den Pharao segnet, statt sie auf eine bloße Begrüßung abzuschwächen.
- source_word: פַרְעֹה
  choice: Pharao
  rationale: Dies ist die etablierte deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וַ
  choice: Dann / Satzfolge
  rationale: Das narrative Waw führt die Handlung weiter. »Dann« markiert zu Beginn die zeitliche Folge; vor dem zweiten Satz genügt im modernen Deutschen die unmittelbare Satzfolge.
theological_decisions:
- issue: Bedeutung von Jakobs Handlung gegenüber dem Pharao
  choice: Jakob segnete den Pharao tatsächlich.
  alternative: Jakob begrüßte den Pharao lediglich höflich.
  rationale: Der gewöhnliche Sinn von ברך ist »segnen«. Diese Wiedergabe erhält die theologische und gesellschaftliche Spannung, dass der Patriarch dem mächtigen König einen Segen zuspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Szene wird idiomatisch formuliert; der konkrete Grundsinn der hebräischen Verbform bleibt durch Fußnote [a] sichtbar. Die Wiederholung von »Pharao« folgt der Klarheit und dem Nachdruck des Ausgangstextes.
