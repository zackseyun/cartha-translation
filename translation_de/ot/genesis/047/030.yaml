  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: de
  text: '„Wenn ich mich zu meinen Vätern gelegt habe[a][b], dann bring mich aus Ägypten und begrabe mich in ihrer Grabstätte[c].“ Er sagte: „Ich werde tun, was du gesagt hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ich mich zu meinen Vätern lege“. Die hebräische Wendung ist eine gebräuchliche Umschreibung, die mit Tod und Bestattung verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu meinen Vorfahren“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in ihrem Grab“ beziehungsweise „in ihrer Gruft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Wenn ich mich … gelegt habe
  rationale: שׁכב bedeutet wörtlich „sich hinlegen/liegen“ und ist hier eine mit Tod und Bestattung verbundene feste Wendung. Die temporale Wiedergabe mit „wenn“ macht den Zusammenhang im Deutschen natürlich verständlich, ohne die Bildsprache schlicht durch „sterben“ zu ersetzen.
- source_word: עִם אֲבֹתַי
  choice: zu meinen Vätern
  rationale: אָבוֹת bezeichnet hier die Vorväter beziehungsweise Ahnen. „Zu meinen Vätern“ bewahrt die traditionelle familiäre Bildsprache der hebräischen Todesformel; die sachlichere Alternative „zu meinen Vorfahren“ wird in einer Fußnote genannt.
- source_word: וּנְשָׂאתַנִי
  choice: bring mich
  rationale: נשא bezeichnet hier das Tragen beziehungsweise Überführen des Leichnams. „Bring mich aus Ägypten“ klingt im modernen Deutschen natürlicher als „trage mich aus Ägypten“ und umfasst den gemeinten Transport.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מן bezeichnet die Bewegung aus einem Gebiet heraus; „aus Ägypten“ gibt dies knapp und idiomatisch wieder.
- source_word: וּקְבַרְתַּנִי
  choice: begrabe mich
  rationale: קבר bedeutet in diesem Zusammenhang eindeutig „begraben“.
- source_word: בִּקְבֻרָתָם
  choice: in ihrer Grabstätte
  rationale: קְבֻרָה kann den Ort der Bestattung bezeichnen. „Grabstätte“ lässt offen, ob ein einzelnes Grab, ein Familiengrab oder eine Grabanlage gemeint ist.
- source_word: וַיֹּאמַר
  choice: Er sagte
  rationale: Die schlichte Erzählform gibt Josefs unmittelbare Antwort wieder. Im Deutschen ist nach der direkten Rede kein zusätzliches „und“ nötig.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Ich werde tun
  rationale: Das selbstständige Pronomen אָנֹכִי hebt das Subjekt leicht hervor. Das ausdrücklich gesetzte „Ich“ trägt diese Betonung im Deutschen ausreichend.
- source_word: כִדְבָרֶךָ
  choice: was du gesagt hast
  rationale: Wörtlich lautet die Wendung „nach deinem Wort“. Die gewählte Form ist modernes, natürliches Deutsch und bezeichnet die zugesagte Erfüllung der Bitte.
theological_decisions: []
