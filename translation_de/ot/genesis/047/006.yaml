source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: de
  text: Das Land Ägypten steht dir offen.[a] Lass deinen Vater und deine Brüder im besten Teil des Landes wohnen; sie sollen im Land Goschen leben. Und wenn du weißt, dass unter ihnen tüchtige Männer sind,[b] dann setze sie als Aufseher über meinen Viehbestand ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das Land Ägypten ist vor dir.« Die hebräische Wendung besagt hier, dass Josef innerhalb Ägyptens einen Ort wählen darf.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »fähige Männer«, »kompetente Männer«; wörtlicher: »Männer von Kraft/Tüchtigkeit«. Die Wendung bezeichnet hier nicht notwendigerweise militärische Tapferkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Das Land Ägypten steht dir offen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass das Land »vor dir« ist, und gewährt Josef im Zusammenhang freie Ortswahl. »Steht dir offen« gibt den idiomatischen Sinn natürlich wieder; die Bildsprache wird in der Fußnote erläutert.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: im besten Teil des Landes
  rationale: מֵיטַב bezeichnet den besten oder vorzüglichsten Anteil. »Im besten Teil« macht im Deutschen deutlich, dass ein Gebiet innerhalb Ägyptens gemeint ist.
- source_word: הוֹשֵׁב
  choice: Lass … wohnen
  rationale: Der Hifil-Imperativ von ישׁב ist kausativ. Die deutsche Konstruktion mit »lassen« vermittelt, dass Josef seiner Familie dort Wohnraum geben beziehungsweise sie ansiedeln soll.
- source_word: יֵשְׁבוּ
  choice: sie sollen … leben
  rationale: Das Qal-Verb bezeichnet hier dauerhaftes Wohnen oder Ansässigsein. »Leben« ist in diesem Kontext natürliches modernes Deutsch.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Der ausdrücklich genannte Begriff אֶרֶץ wird als »Land« beibehalten.
- source_word: וְאִם יָדַעְתָּ
  choice: Und wenn du weißt
  rationale: Die Wiedergabe bewahrt die konditionale Form und bindet Josefs eigene Kenntnis der Männer ein.
- source_word: אַנְשֵׁי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung kann Stärke, Befähigung und erwiesene Tauglichkeit ausdrücken. Im Zusammenhang der Viehwirtschaft bezeichnet sie eher kompetente und leistungsfähige Männer als Krieger.
- source_word: וְשַׂמְתָּם
  choice: setze sie … ein
  rationale: שׂים bedeutet grundsätzlich »setzen, stellen, einsetzen«; bei der Übertragung einer Aufgabe ist »einsetzen« idiomatisch und wahrt den Ernennungscharakter.
- source_word: שָׂרֵי מִקְנֶה
  choice: Aufseher über meinen Viehbestand
  rationale: שָׂרֵי bezeichnet Verantwortliche oder Aufseher, מִקְנֶה den Bestand an Nutztieren. Die Formulierung passt zur übertragenen Verwaltungsaufgabe.
- source_word: עַל אֲשֶׁר לִי
  choice: über meinen Viehbestand
  rationale: Wörtlich heißt es »über das, was mir gehört«. Aus dem unmittelbar vorausgehenden מִקְנֶה ergibt sich, dass der Viehbestand des Pharaos gemeint ist.
