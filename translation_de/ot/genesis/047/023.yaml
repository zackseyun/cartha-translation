  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: de
  text: 'Dann sagte Josef zum Volk: »Seht, heute habe ich euch und euer Land für den Pharao gekauft.[a] Hier ist Saatgut für euch; und sät das Land ein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sowohl »kaufen« als auch allgemeiner »erwerben« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Dann« gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: הָעָם
  choice: zum Volk
  rationale: עַם bezeichnet hier die kollektiv angesprochene ägyptische Bevölkerung; »Volk« ist knapp und würdevoll.
- source_word: הֵן
  choice: Seht
  rationale: Die hervorhebende und hinweisende Partikel wird mit einem geläufigen deutschen Aufmerksamkeitssignal wiedergegeben.
- source_word: קָנִיתִי
  choice: habe ich … gekauft
  rationale: קנה bezeichnet hier im wirtschaftlich-rechtlichen Zusammenhang den Erwerb durch Kauf; die direkte Wiedergabe wahrt zugleich die Härte der Aussage.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Das Objektpronomen bezieht die Menschen selbst in die Übertragung an den Pharao ein.
- source_word: אַדְמַתְכֶם
  choice: euren Grundbesitz
  rationale: אֲדָמָה meint hier das landwirtschaftlich genutzte Land in ihrem Besitz; »Grundbesitz« unterscheidet es im Deutschen klar vom anschließend zu bestellenden Boden.
- source_word: לְפַרְעֹה
  choice: für den Pharao
  rationale: Die Präposition לְ kennzeichnet den Pharao als den Begünstigten beziehungsweise neuen Eigentümer des Erwerbs.
- source_word: הֵא לָכֶם זֶרַע
  choice: Hier habt ihr Saatgut
  rationale: Die präsentierende Partikel הֵא und die Gabe von Samen zum Aussäen werden idiomatisch und konkret wiedergegeben.
- source_word: וּזְרַעְתֶּם אֶת הָאֲדָמָה
  choice: bestellt nun das Land
  rationale: Die Verbform hat im Zusammenhang auffordernden beziehungsweise anweisenden Sinn. »Das Land bestellen« gibt das Aussäen auf dem Acker in natürlichem Deutsch wieder; »nun« markiert den anschließenden Auftrag.
theological_decisions:
- issue: Status der Menschen nach dem Erwerb
  choice: Die direkte Aussage »euch … gekauft« bleibt stehen.
  alternative: 'Abschwächend: »euch … erworben« oder eine ausdrückliche Deutung als Dienstverhältnis.'
  rationale: Der hebräische Text nennt die Menschen selbst als Objekt von קנה. Eine genauere rechtliche oder theologische Einordnung wird in diesem Vers nicht vorgenommen und darf nicht hineingelesen werden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die wirtschaftlich und menschlich harte Formulierung des Ausgangstextes wird nicht beschönigt; die Fußnote bewahrt den lexikalischen Spielraum von קנה.
