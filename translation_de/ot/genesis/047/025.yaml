  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: de
  text: 'Da sagten sie: »Du hast uns am Leben erhalten. Mögen wir in den Augen meines Herrn[a] Gunst finden, und wir werden Sklaven des Pharaos sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Augen meines Herrn Gunst finden«; die hebräische Wendung ist eine ehrerbietige Bitte um Wohlwollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das narrative Waw mit Imperfekt führt die anschließende Reaktion ein; »Da sagten sie« gibt den Erzählfluss im Deutschen natürlich wieder.
- source_word: הֶחֱיִתָנוּ
  choice: Du hast uns am Leben erhalten
  rationale: Der Hifil von חיה bezeichnet hier das Bewahren beziehungsweise Erhalten des Lebens, ohne eine geistliche oder militärische Rettung anzudeuten.
- source_word: נִמְצָא חֵן
  choice: Mögen wir Gunst finden
  rationale: Die Yiqtol-Form der 1. Person Plural hat im Zusammenhang den Charakter einer ehrerbietigen Bitte. »Mögen wir« bewahrt diesen volitiven Sinn.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: in den Augen meines Herrn
  rationale: Die geläufige hebräische Wendung für das Erlangen von Wohlwollen wird transparent beibehalten; der Singularsuffix bezeichnet die ehrerbietige Anrede an Josef.
- source_word: וְהָיִינוּ
  choice: und wir werden … sein
  rationale: Das mit Waw verbundene Perfekt drückt hier die daraus folgende Zusage beziehungsweise den künftigen Zustand aus.
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: Im wirtschaftlichen Kontext von Genesis 47 steht die rechtlich gebundene Unterordnung unter den Pharao im Vordergrund; »Sklaven« macht diesen Status deutlicher als »Diener«.
- source_word: לְפַרְעֹה
  choice: des Pharaos
  rationale: Die deutsche Genitivverbindung bezeichnet knapp und idiomatisch die Zugehörigkeit beziehungsweise Unterordnung gegenüber dem Pharao.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die hebräische Höflichkeitsformel bleibt erkennbar, während »am Leben erhalten« und »Sklaven« den konkreten wirtschaftlichen Zusammenhang klar ausdrücken.
