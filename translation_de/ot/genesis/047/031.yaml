  text: וַ/יֹּ֗אמֶר הִשָּֽׁבְעָ/ה֙ לִ֔/י וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַ/מִּטָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: de
  text: 'Er sagte: „Schwöre mir!“ Und er schwor ihm. Da verneigte sich Israel am Kopfende des Bettes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da verneigte sich Israel am Kopf seines Stabes.“ Der hebräische Konsonantentext kann auch so gelesen werden; diese Lesart findet sich in der Septuaginta und in Hebräer 11,21.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Schwöre mir!
  rationale: Die knappe Aufforderung gibt die direkte hebräische Eidesformel natürlich und bestimmt wieder.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: Und er schwor ihm
  rationale: Die Wiederholung desselben Verbstamms bleibt erhalten und entspricht gutem deutschem Erzählstil.
- source_word: וַיִּשְׁתַּחוּ
  choice: verneigte sich
  rationale: Das Verb bezeichnet hier zunächst eine körperliche Gebärde. Diese Wiedergabe legt nicht ausdrücklich fest, ob damit zugleich Anbetung gemeint ist.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der im hebräischen Text verwendete Name wird beibehalten und nicht zu „Jakob“ harmonisiert.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: am Kopfende des Bettes
  rationale: Die Formulierung gibt die räumliche Wendung idiomatisch wieder; die masoretische Vokalisierung versteht הַמִּטָּה als „das Bett“.
theological_decisions:
- issue: Die Septuaginta und Hebräer 11,21 spiegeln die Lesart „Stab“ wider, während die masoretische Vokalisierung „Bett“ ergibt.
  choice: Bett
  alternative: Stab
  rationale: Für den Haupttext ist die masoretische Gestalt des hebräischen Textes maßgeblich. Da derselbe Konsonantenbestand auch als „Stab“ vokalisiert werden kann und diese Lesart im Neuen Testament bezeugt ist, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren den knappen Erzählrhythmus; „verneigte sich“ erhält die mögliche Spannung zwischen körperlicher Gebärde und religiöser Verehrung.
