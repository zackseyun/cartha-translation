base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: de
  text: Da brachten sie ihr Vieh zu Josef, und Josef gab ihnen Brot im Tausch gegen die Pferde, die Schaf- und Ziegenherden, die Rinderherden und die Esel. Und er versorgte sie[a] in jenem Jahr mit Brot im Tausch gegen all ihr Vieh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann wörtlich „führen“ oder „leiten“ bedeuten. Im Zusammenhang der Hungersnot ist wahrscheinlich gemeint, dass Josef sie mit Brot versorgte; die anschließende Wendung bezeichnet ihr gesamtes Vieh als Tauschleistung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: ihr Vieh / all ihr Vieh
  rationale: מִקְנֶה bezeichnet den gesamten Bestand an gehaltenen Nutztieren und nicht nur Rinder. „Vieh“ ist dafür im Deutschen die natürliche umfassende Bezeichnung.
- source_word: לֶחֶם
  choice: Brot
  rationale: לֶחֶם kann allgemein Nahrung bezeichnen, doch „Brot“ bewahrt hier die konkrete Wortwahl und ist im Zusammenhang der Hungersnot als Grundnahrungsmittel verständlich.
- source_word: בַּסּוּסִים
  choice: im Tausch gegen die Pferde
  rationale: Die Präposition בְּ kennzeichnet hier die Gegenleistung des Tauschgeschäfts; die ausdrückliche Wiedergabe verhindert ein instrumentales Missverständnis.
- source_word: מִקְנֵה הַצֹּאן
  choice: die Schaf- und Ziegenherden
  rationale: צֹאן umfasst Kleinvieh, insbesondere Schafe und Ziegen. Die ausdrückliche Nennung beider Tiergruppen gibt den Umfang im modernen Deutsch klarer wieder als nur „Schafherden“.
- source_word: מִקְנֵה הַבָּקָר
  choice: die Rinderherden
  rationale: בָּקָר bezeichnet Rinder als Herdentiere; „Rinderherden“ ist präzise und bildet ein natürliches Gegenstück zu den Schaf- und Ziegenherden.
- source_word: חֲמֹרִים
  choice: die Esel
  rationale: „Esel“ ist die klare, moderne deutsche Entsprechung.
- source_word: וַיְנַהֲלֵם
  choice: So versorgte er sie
  rationale: נהל bedeutet grundsätzlich „führen, leiten“ und kann im Kontext fürsorgliches Versorgen ausdrücken. In Verbindung mit Brot und der Hungersnot bezeichnet es hier Josefs Unterhalt der Menschen, ohne die Grundbedeutung unnötig in den Haupttext zu zwingen.
- source_word: בַּלֶּחֶם
  choice: mit Brot
  rationale: Die Präposition bezeichnet das Mittel, durch das Josef sie versorgte; zugleich bleibt das wiederholte לֶחֶם sichtbar.
- source_word: בְּכָל מִקְנֵהֶם
  choice: im Tausch gegen all ihr Vieh
  rationale: Im wirtschaftlichen Zusammenhang fasst die Wendung das Tauschgeschäft zusammen. „Im Tausch gegen“ macht klar, dass das Brot für die Menschen bestimmt war und ihr Vieh die Gegenleistung bildete.
- source_word: בַּשָּׁנָה הַהִוא
  choice: in jenem Jahr
  rationale: Die Wendung bezeichnet den Zeitraum, in dem diese Versorgung stattfand; „in jenem Jahr“ ist direkt und idiomatisch.
