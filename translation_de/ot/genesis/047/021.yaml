source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: de
  text: Das Volk aber siedelte er in die Städte um, von einem Ende des ägyptischen Gebiets bis zum anderen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er versetzte das Volk in die Städte.“ Manche Übersetzungen folgen einem anderen Textverständnis und geben den Vers so wieder, dass Josef das Volk zu Knechten machte; der vorliegende hebräische Text spricht unmittelbarer von einer Umsiedlung.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: das Volk
  rationale: Der Ausdruck bezeichnet hier kollektiv die von Josefs Maßnahme betroffene Bevölkerung Ägyptens. „Das Volk“ ist im Deutschen natürlich und bewahrt den kollektiven Singular des Hebräischen.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: siedelte er … um
  rationale: Der Hifil von עבר bedeutet hier, jemanden hinüberzubringen beziehungsweise zu verlegen. „umsiedeln“ gibt die räumliche Verlagerung von Menschen idiomatisch wieder, ohne eine Versklavung in den Text hineinzulesen.
- source_word: לֶעָרִים
  choice: in die Städte
  rationale: Die Präposition ל bezeichnet hier am ehesten das Ziel der Verlagerung. „In die Städte“ ist im Deutschen eine natürliche Richtungsangabe; eine andere mögliche Auffassung wird in der Fußnote genannt.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: von einem Ende des ägyptischen Gebiets bis zum anderen
  rationale: גְבוּל bezeichnet hier eher das Gebiet als lediglich eine Grenzlinie. Die Formulierung bewahrt die hebräische Merismus-Struktur und drückt die ganze Ausdehnung Ägyptens aus.
theological_decisions:
- issue: Art von Josefs Maßnahme gegenüber der ägyptischen Bevölkerung
  choice: Umsiedlung in die Städte
  alternative: Versetzung von Stadt zu Stadt; Überführung in die Knechtschaft
  rationale: Der masoretische Text spricht am unmittelbarsten von einem Verbringen beziehungsweise Umsiedeln des Volkes. Eine Versklavung wird in diesem Wortlaut nicht ausdrücklich gesagt und deshalb nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umsiedeln“ ist verständlich und präzise; die Satzstellung mit „aber“ greift die hervorgehobene Voranstellung des Volkes im Hebräischen auf.
