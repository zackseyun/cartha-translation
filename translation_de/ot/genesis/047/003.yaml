  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל אֶחָ֖י/ו מַה מַּעֲשֵׂי/כֶ֑ם וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה רֹעֵ֥ה צֹאן֙ עֲבָדֶ֔י/ךָ גַּם אֲנַ֖חְנוּ גַּם אֲבוֹתֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: de
  text: 'Der Pharao fragte seine Brüder: „Was ist euer Beruf?[a]“ Sie antworteten dem Pharao: „Deine Diener sind Hirten von Kleinvieh[b], sowohl wir als auch unsere Väter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was ist eure Arbeit?“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Kleinvieh, besonders Schafe und Ziegen.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Was ist euer Beruf?
  rationale: מַעֲשֶׂה bezeichnet hier im höfischen Gespräch die Arbeit oder Erwerbstätigkeit. „Beruf“ gibt die gemeinte Frage im modernen Deutschen natürlich und präzise wieder.
- source_word: רֹעֵה צֹאן
  choice: Hirten von Kleinvieh
  rationale: צֹאן bezeichnet Kleinvieh, vor allem Schafe und Ziegen. Die Formulierung bildet beide hebräischen Begriffe ab und vermeidet die Verengung auf Schafe allein.
- source_word: עֲבָדֶיךָ
  choice: Deine Diener
  rationale: Im Gespräch mit dem Pharao ist dies eine ehrerbietige Selbstbezeichnung. Eine Wiedergabe mit „Sklaven“ würde hier einen nicht vorrangigen Bedeutungsaspekt hervorheben.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: wir ebenso wie unsere Vorfahren
  rationale: Die Formulierung bewahrt den durch das wiederholte גַּם betonten Zusammenhang zwischen der gegenwärtigen und der früheren Generation und klingt zugleich natürlich.
- source_word: אֶל אֶחָיו
  choice: seine Brüder
  rationale: Die Wiedergabe folgt der hebräischen Form; aus dem Zusammenhang ist Josef der Bezugspunkt des Pronomens.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höfische Selbstbezeichnung „Deine Diener“ bleibt erhalten; „Vorfahren“ ist im heutigen Deutsch natürlicher und umfassender als „Väter“.
