  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: de
  text: Im ganzen Land gab es kein Brot[a], denn die Hungersnot war überaus schwer. Ägypten und Kanaan schmachteten wegen der Hungersnot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot“; hier kann damit Nahrung allgemein gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch mit „waren erschöpft“ oder „welkten dahin“ wiedergegeben werden. Bildhaft beschreibt es die lähmende Wirkung der Hungersnot auf Ägypten und Kanaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: Brot
  rationale: Die Grundbedeutung ist „Brot“; im Zusammenhang der Hungersnot kann das Wort zugleich Nahrung allgemein bezeichnen. Die Übersetzung bewahrt das konkrete hebräische Bild, während die Fußnote den weiteren Sinn nennt.
- source_word: אֵין
  choice: gab es kein
  rationale: Die hebräische Existenzverneinung wird im erzählenden Vergangenheitskontext natürlich wiedergegeben.
- source_word: בְּכָל הָאָרֶץ
  choice: im ganzen Land
  rationale: Bezeichnet im Kontext das gesamte betroffene Gebiet, nicht notwendig die ganze Erde.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: denn die Hungersnot war überaus schwer
  rationale: כָבֵד bedeutet wörtlich „schwer“ und beschreibt hier die große Härte der Hungersnot; מְאֹד wird durch „überaus“ wiedergegeben.
- source_word: וַתֵּלַהּ
  choice: waren völlig entkräftet
  rationale: Das seltene Verb beschreibt ein Erschlaffen, Dahinschwinden oder Entkräftetwerden infolge der Hungersnot. Die personifizierende Aussage über die Länder bleibt erhalten.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: Ägypten und Kanaan
  rationale: Im Deutschen bezeichnen die Ländernamen selbst natürlich sowohl die Länder als auch ihre Bevölkerung; die inhaltliche geografische Parallelität bleibt gewahrt.
- source_word: מִפְּנֵי הָרָעָב
  choice: wegen der Hungersnot
  rationale: Natürliche kausale Wiedergabe der Präpositionalverbindung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Erzählton. Der erste Satz bewahrt „Brot“ als konkreten Ausgangsbegriff des Hebräischen; die seltene und bildhafte Verbform im zweiten Satz wird verständlich, aber nicht entpersonifizierend wiedergegeben.
