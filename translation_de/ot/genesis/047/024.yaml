  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der administrative Inhalt wird klar wiedergegeben; die hebräische Teilungsformel wird als verständliche Bruchangabe ausgedrückt. Der Doppelpunkt strukturiert die vorgesehenen Verwendungszwecke der verbleibenden Ernte.
