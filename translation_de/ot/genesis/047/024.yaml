  source_fidelity: Die Übersetzung gibt die zeitliche Einordnung von בַּתְּבוּאֹת, die verpflichtende Abgabe eines Fünftels an den Pharao sowie die Zuweisung der verbleibenden vier Fünftel zutreffend wieder. Die idiomatische hebräische Formel אַרְבַּע הַיָּדוֹת wird sachgerecht als „die übrigen vier Fünftel“ erschlossen. Die anschließenden Zwecke des Ertrags—Saatgut, Nahrung für die Adressaten und die zum Haushalt Gehörenden sowie Nahrung für die Kinder—bleiben erhalten.
  naturalness: Das Deutsch ist flüssig, modernes Standarddeutsch und dem administrativen Charakter der Rede angemessen. Der Doppelpunkt leitet die Zweckbestimmungen verständlich ein. „Wenn die Ernte eingebracht wird“ und „als Saatgut für die Felder“ sind idiomatisch.
