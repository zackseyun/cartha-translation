base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: de
  text: 'Wenn die Ernte eingebracht wird, sollt ihr dem Pharao ein Fünftel geben. Die übrigen vier Fünftel sollen euch gehören: als Saatgut für die Felder, als Nahrung für euch und die Menschen in euren Häusern und als Nahrung für eure kleinen Kinder.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Wenn die Ernte eingebracht wird
  rationale: 'תְּבוּאָה bezeichnet Ertrag oder Ernte. Mit der Präposition בְּ ist hier im Zusammenhang der Abgabe eine zeitliche Wiedergabe natürlich: wenn der Ertrag eingebracht wird.'
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: sollt ihr dem Pharao ein Fünftel geben
  rationale: חֲמִישִׁית bezeichnet eindeutig ein Fünftel; die deutsche Satzstellung ist natürlich und bewahrt den verpflichtenden Charakter der Anweisung.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: Die übrigen vier Fünftel
  rationale: Wörtlich steht »die vier Teile/Hände«. Im Zusammenhang mit dem zuvor genannten Fünftel sind damit die verbleibenden vier von fünf Teilen gemeint. »Die übrigen vier Fünftel« macht den hebräischen Ausdruck verständlich, ohne den Sinn zu verändern.
- source_word: יִהְיֶה לָכֶם
  choice: sollen euch gehören
  rationale: Die Wendung bezeichnet die Zuweisung beziehungsweise Verfügbarkeit des verbleibenden Ertrags.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: als Saatgut für die Felder
  rationale: 'Das לְ ist zweckbezogen: Ein Teil des Ertrags bleibt zum erneuten Besäen der Felder. Der deutsche Plural ist im landwirtschaftlichen Zusammenhang idiomatisch.'
- source_word: וּלְאָכְלְכֶם
  choice: als Nahrung für euch
  rationale: Die Form von אכל bezeichnet hier das, was zum Essen bestimmt ist. »Nahrung« fügt sich klar in die Aufzählung der Verwendungszwecke ein.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: für die Menschen in euren Häusern
  rationale: Das substantivierte Relativpronomen אֲשֶׁר meint hier diejenigen, die sich in den Häusern beziehungsweise Haushalten befinden. »Menschen« verdeutlicht den personalen Bezug, der im Deutschen sonst missverständlich wäre.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: als Nahrung für eure kleinen Kinder
  rationale: טַף bezeichnet besonders kleine Kinder, kann im weiteren Sinn aber auch die abhängigen Familienangehörigen umfassen. »Kleine Kinder« bewahrt hier den konkreten familiären Sinn.
theological_decisions: []
