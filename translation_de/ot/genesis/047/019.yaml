source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: de
  text: Warum sollen wir vor deinen Augen[a] sterben, wir und auch unser Land? Kauf uns und unser Land für Brot[b]; dann werden wir und unser Land Sklaven des Pharaos[c] sein. Gib Saatgut, damit wir leben und nicht sterben und das Land nicht verödet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dir“; wörtlich: „vor deinen Augen“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein kann allgemein Nahrung; wörtlich steht hier „Brot“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Knechte“ beziehungsweise „Diener“. Das hebräische Wort kann verschiedene Formen der Dienstbarkeit bezeichnen; hier steht eine durch Not und Verkauf entstandene Abhängigkeit im Vordergrund.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „verwüstet wird“ beziehungsweise „brachliegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Warum sollen wir … sterben
  rationale: Gibt die rhetorische Bitte des hebräischen Fragesatzes natürlich und zugleich eng am Wortlaut wieder.
- source_word: לְעֵינֶיךָ
  choice: vor deinen Augen
  rationale: Bewahrt das anschauliche hebräische Idiom; gemeint ist, dass dies in Josefs Gegenwart und unter seinem Blick geschieht.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: wir und auch unser Land
  rationale: Koordiniert wie das hebräische Doppel גַּם die Menschen und ihr Land, ohne die ungewöhnliche Aussage zu glätten.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Kauf uns und unser Land
  rationale: קנה bezeichnet hier den Erwerb gegen eine Gegenleistung während der Hungersnot.
- source_word: בַּלָּחֶם
  choice: für Brot
  rationale: Das ב bezeichnet hier den Preis beziehungsweise Tauschwert; „Brot“ hält den konkreten hebräischen Ausdruck fest.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: Sklaven des Pharaos
  rationale: Im wirtschaftlich-rechtlichen Zusammenhang steht der Verlust persönlicher Freiheit im Vordergrund; der Genitiv gibt die Zugehörigkeit zu Pharao idiomatisch wieder.
- source_word: וְתֶן זֶרַע
  choice: Gib Saatgut
  rationale: זרע meint in diesem landwirtschaftlichen Zusammenhang Saat zum Aussäen. Das im Hebräischen nicht ausdrücklich genannte „uns“ wird nicht ergänzt.
- source_word: תֵשָׁם
  choice: verödet
  rationale: Das Verb bezeichnet hier, dass das Land ungenutzt und öde wird; „verödet“ passt zum Zusammenhang der ausbleibenden Bewirtschaftung.
theological_decisions:
- issue: Art der mit עֲבָדִים bezeichneten Abhängigkeit
  choice: Sklaven
  alternative: Diener
  rationale: Der Verkauf der eigenen Person und des Landes gegen Nahrung weist auf eine rechtlich und wirtschaftlich gebundene Stellung hin. „Sklaven“ macht den Verlust der Freiheit deutlicher, ohne über die im Text genannte Zugehörigkeit zu Pharao hinauszugehen.
- issue: Ungewöhnliche Einbeziehung des Landes in die Aussage über die Sklaverei
  choice: „wir und unser Land [werden] Sklaven des Pharaos sein“ bleibt erhalten
  alternative: „wir werden Sklaven des Pharaos sein, und unser Land wird ihm gehören“
  rationale: Der hebräische Satz verbindet Menschen und Land gemeinsam mit עֲבָדִים. Die Übersetzung bewahrt diese auffällige rechtlich-rhetorische Personifikation, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Notlage der Sprecher bleibt spürbar. Die auffällige gemeinsame Zuordnung von Menschen und Land als „Sklaven des Pharaos“ wird bewusst nicht geglättet; das Semikolon macht den resultativen Zusammenhang nach der Aufforderung „Kauf“ deutlich.
