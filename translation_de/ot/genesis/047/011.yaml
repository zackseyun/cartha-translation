base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: de
  text: So ließ Josef seinen Vater und seine Brüder wohnen und gab ihnen Grundbesitz im Land Ägypten, im besten Teil des Landes, im Land Ramses[a], wie der Pharao befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Gebiet von Ramses.'
    reason: Die Wendung אֶרֶץ רַעְמְסֵס kann ein nach Ramses benanntes Land beziehungsweise Gebiet bezeichnen.
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: ließ … dort wohnen
  rationale: 'Der Hifil von ישׁב hat kausative Bedeutung: Josef sorgte dafür, dass sein Vater und seine Brüder dort wohnten. Die Formulierung ist natürliches Deutsch und bewahrt diesen Sinn.'
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: seinen Vater und seine Brüder
  rationale: Die ausdrücklich genannten Verwandtschaftsbezeichnungen werden beibehalten und nicht zum allgemeineren Begriff „Familie“ erweitert.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: gab ihnen Grundbesitz
  rationale: אֲחֻזָּה bezeichnet einen festen Landbesitz beziehungsweise eine Besitzung. „Grundbesitz“ gibt den konkreten Bezug auf Land wieder, ohne unnötig erbrechtliche oder bundestheologische Vorstellungen einzutragen.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: „Land“ bewahrt die wiederholte Verwendung von אֶרֶץ und den literarischen Zusammenhang des Satzes.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: im besten Teil des Landes
  rationale: מֵיטַב bezeichnet den besten oder erlesensten Teil. Diese Wiedergabe ist im Deutschen klar und idiomatisch.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: im Land Ramses
  rationale: Die Formulierung bildet die erneute Verwendung von אֶרֶץ ab; gemeint sein kann ein nach Ramses benanntes Gebiet.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: wie der Pharao befohlen hatte
  rationale: Das Plusquamperfekt verdeutlicht im deutschen Erzählzusammenhang, dass der Befehl des Pharaos vorausging.
