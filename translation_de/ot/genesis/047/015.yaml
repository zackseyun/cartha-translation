  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: de
  text: 'Als das Geld im Land Ägypten und im Land Kanaan aufgebraucht war[a], kamen alle Ägypter[b] zu Josef und sagten: »Gib uns Brot[c]! Warum sollen wir vor dir sterben? Denn das Geld ist ausgegangen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Silber … aufgebraucht war“. Das hebräische Wort כֶּסֶף kann sowohl „Silber“ als auch „Geld“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ganz Ägypten kam“. Gemeint ist die Bevölkerung Ägyptens.'
    reason: lexical_alternative
  - marker: c
    text: „Brot“ kann hier im weiteren Sinn für Nahrung stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: aufgebraucht war
  rationale: Das Verb תמם bezeichnet hier das vollständige Zu-Ende-Gehen eines Vorrats. „Aufgebraucht war“ ist im Zusammenhang mit den erschöpften Zahlungsmitteln präzise und natürlich.
- source_word: הַכֶּסֶף / כָּסֶף
  choice: das Geld
  rationale: כֶּסֶף kann „Silber“ oder „Geld“ bedeuten. Im Zusammenhang mit dem Erwerb von Nahrung bezeichnet es am ehesten das Zahlungsmittel; die konkrete Alternative „Silber“ bleibt in der Fußnote erhalten.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: im Land Ägypten und im Land Kanaan
  rationale: Obwohl מִן formal „aus/von“ bedeutet, beschreibt die Wendung hier den Bereich, in dem die Geldmittel erschöpft waren. „Im Land …“ gibt dies im Deutschen klar wieder und bewahrt die zweimalige Nennung von „Land“.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: kamen alle Ägypter
  rationale: Wörtlich steht „ganz Ägypten kam“; gemeint ist kollektiv die ägyptische Bevölkerung. Die natürliche deutsche Wiedergabe wird durch eine Fußnote transparent gemacht.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Gib uns Brot
  rationale: הָבָה hat hier auffordernde Bedeutung und richtet sich im Singular an Josef. לֶחֶם heißt konkret „Brot“, kann im Kontext einer Hungersnot aber Nahrung allgemein bezeichnen.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Warum sollen wir vor deinen Augen sterben?
  rationale: Die rhetorische Frage bringt den dringlichen Appell zum Ausdruck. „Vor deinen Augen“ gibt die räumliche und anschauliche Bedeutung von נֶגְדֶּךָ wieder.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Denn das Geld ist ausgegangen
  rationale: אָפֵס bezeichnet hier, dass nichts mehr vorhanden ist. „Ist ausgegangen“ ist natürlich und unterscheidet die Schlussformulierung leicht vom verwandten, aber nicht identischen Verb am Versanfang.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt eindringlich; der Singular „Gib“ wahrt die Anrede an Josef. Alle lexikalisch bedeutsamen Alternativen werden knapp in Fußnoten offengelegt.
