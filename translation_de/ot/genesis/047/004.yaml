  text: וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה לָ/ג֣וּר בָּ/אָרֶץ֮ בָּאנוּ֒ כִּי אֵ֣ין מִרְעֶ֗ה לַ/צֹּאן֙ אֲשֶׁ֣ר לַ/עֲבָדֶ֔י/ךָ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/עַתָּ֛ה יֵֽשְׁבוּ נָ֥א עֲבָדֶ֖י/ךָ בְּ/אֶ֥רֶץ גֹּֽשֶׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: de
  text: 'Sie sagten zum Pharao: „Wir sind gekommen, um als Fremde im Land zu leben[a], weil es keine Weide für die Herden deiner Diener gibt; denn die Hungersnot im Land Kanaan ist schwer. So lass nun bitte deine Diener im Land Goschen wohnen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um uns vorübergehend im Land aufzuhalten“.'
    reason: לָגוּר kann sowohl den Status als Fremde als auch den zeitweiligen Charakter ihres Aufenthalts hervorheben.
lexical_decisions:
- source_word: לָגוּר
  choice: um als Fremde … zu leben
  rationale: Das Verb bezeichnet den Aufenthalt als Fremder beziehungsweise zeitweiliger Bewohner und nicht unbedingt eine dauerhafte Ansiedlung. Die Formulierung bewahrt diesen sozialen und zeitlichen Bedeutungsaspekt in natürlichem Deutsch.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet Ägyptens; „Land“ entspricht dem üblichen geografischen Sprachgebrauch in Genesis.
- source_word: מִרְעֶה
  choice: Weide
  rationale: Das Substantiv bezeichnet Weideland beziehungsweise einen Ort, an dem Tiere grasen können. „Weide“ ist knapp und im Deutschen geläufig.
- source_word: לַצֹּאן
  choice: für die Herden
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Herden“ gibt den kollektiven Sinn wieder, ohne die Tierarten unnötig festzulegen.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: für die Herden deiner Diener
  rationale: Die hebräische Wendung drückt Besitz aus. Der deutsche Genitiv ist natürlich und erhält die ehrerbietige Selbstbezeichnung vor dem Pharao.
- source_word: כָבֵד הָרָעָב
  choice: die Hungersnot … ist schwer
  rationale: כָבֵד bedeutet wörtlich „schwer“ und bezeichnet bei einer Hungersnot deren große Härte beziehungsweise Heftigkeit. „Schwer“ wahrt das Bild und ist im Deutschen verständlich.
- source_word: יֵשְׁבוּ נָא
  choice: So lass nun bitte … wohnen
  rationale: Die Wunschform mit נָא drückt eine höfliche Bitte aus. „Lass … bitte“ gibt den bittenden Charakter wieder; „wohnen“ behauptet keine ausdrücklich dauerhafte Niederlassung.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עבד kann „Sklave“ oder „Diener“ bedeuten. Hier handelt es sich um eine höfische, ehrerbietige Selbstbezeichnung gegenüber dem Pharao, weshalb „Diener“ kontextgemäß ist.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Die Wiedergabe hält die geografische Bezeichnung ausdrücklich fest und entspricht der hebräischen Genitivverbindung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung „deine Diener“ und die höfliche Bitte werden bewahrt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wiedergabe von לָגוּר.
