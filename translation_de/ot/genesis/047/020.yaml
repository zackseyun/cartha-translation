base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: de
  text: Josef kaufte für den Pharao das gesamte Land Ägyptens[a], denn jeder Ägypter verkaufte sein Feld, weil die Hungersnot schwer auf ihnen lastete[b]. So wurde das Land Eigentum des Pharao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erwarb für den Pharao das gesamte Land Ägyptens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn die Hungersnot war stark über ihnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: kaufte
  rationale: קנה bezeichnet hier angesichts des ausdrücklichen Verkaufens der Felder einen entgeltlichen Erwerb; „kaufte“ ist im Deutschen direkt und natürlich.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: das gesamte Ackerland Ägyptens
  rationale: אֲדָמָה bezeichnet hier den als landwirtschaftlichen Besitz veräußerten Boden. „Ackerland“ stellt den Zusammenhang mit den einzelnen Feldern her und vermeidet den Eindruck, Josef habe das Staatsgebiet als solches gekauft.
- source_word: לְפַרְעֹה
  choice: für den Pharao
  rationale: Die Präposition לְ kennzeichnet den Empfänger beziehungsweise Begünstigten des Erwerbs; Josef handelt zugunsten des Pharaos.
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: die Ägypter verkauften jeder sein Feld
  rationale: 'Die Formulierung bewahrt die hebräische Verbindung aus kollektivem Subjekt und distributivem אִישׁ: Die Ägypter verkauften jeweils ihr eigenes Feld.'
- source_word: כִּי חָזַק עֲלֵהֶם הָרָעָב
  choice: weil die Hungersnot schwer auf ihnen lastete
  rationale: חזק bedeutet wörtlich „stark sein“; zusammen mit עַל beschreibt es hier den schweren Druck der Hungersnot. „Schwer auf ihnen lastete“ ist idiomatisch und erhält das Bild.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: So fiel das Land an den Pharao
  rationale: Die Wendung bezeichnet den eingetretenen Eigentumsübergang. „Fiel ... an“ ist eine natürliche deutsche Formulierung, ohne den Vorgang über das Hebräische hinaus rechtlich auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ackerland“ verdeutlicht den landwirtschaftlichen Eigentumskontext; „das Land“ im Schlusssatz folgt dem allgemeineren הָאָרֶץ und bewahrt die knappe Ergebnisformulierung. Die distributive Konstruktion „die Ägypter ... jeder“ hält sich bewusst eng an die hebräische Struktur.
