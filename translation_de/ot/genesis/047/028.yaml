  text: וַ/יְחִ֤י יַעֲקֹב֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְהִ֤י יְמֵֽי יַעֲקֹב֙ שְׁנֵ֣י חַיָּ֔י/ו שֶׁ֣בַע שָׁנִ֔ים וְ/אַרְבָּעִ֥ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: de
  text: Jakob lebte siebzehn Jahre im Land Ägypten. Seine Lebenszeit[a] betrug einhundertsiebenundvierzig Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Tage Jakobs, die Jahre seines Lebens“.'
    reason: Die Fußnote bewahrt die markante hebräische Apposition, die im Haupttext idiomatisch mit „Lebenszeit“ wiedergegeben wird.
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Das Verb חיה bezeichnet hier im fortlaufenden Erzählzusammenhang, dass Jakob noch diese Zeitspanne lebte; „lebte“ gibt dies schlicht und idiomatisch wieder.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Bewahrt das ausdrücklich gesetzte אֶרֶץ („Land“) und klingt zugleich natürlich auf Deutsch.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: siebzehn Jahre
  rationale: Reguläre deutsche Wiedergabe der hebräischen Zahlenangabe.
- source_word: יְמֵי יַעֲקֹב שְׁנֵי חַיָּיו
  choice: seine Lebenszeit
  rationale: Die hebräische Apposition „die Tage Jakobs, die Jahre seines Lebens“ bezeichnet Jakobs gesamte Lebensdauer. „Seine Lebenszeit“ gibt die Wendung in klarem, natürlichem Deutsch wieder; die formale Struktur wird in der Fußnote dokumentiert.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: einhundertsiebenundvierzig Jahre
  rationale: Die im Hebräischen von den Einern über die Zehner zu den Hunderten aufgebaute Zahl wird nach deutscher Konvention angeordnet und vollständig ausgeschrieben.
