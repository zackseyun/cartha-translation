    rationale: »Vom äußersten Teil seiner Brüder« ist im Deutschen schwer verständlich und klingt, als seien die Brüder selbst ein teilbares Gebiet. Die Alternative kann als mögliche Wiedergabe der hebräischen Wendung erläutert werden, während der wahrscheinliche partitive Sinn klar bleibt.
