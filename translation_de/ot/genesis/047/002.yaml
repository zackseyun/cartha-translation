  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: de
  text: Er nahm fünf Männer aus dem Kreis seiner Brüder und stellte sie dem Pharao vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »von den äußersten seiner Brüder« oder »von den angesehensten seiner Brüder«. Der hebräische Ausdruck bedeutet wörtlich »vom Ende/Rand seiner Brüder«; hier ist er wahrscheinlich partitiv zu verstehen: Josef wählte fünf aus der Gruppe seiner Brüder aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Aus der Mitte
  rationale: 'מִקְצֵה bedeutet wörtlich etwa »vom Ende/Rand her«, hat hier aber wahrscheinlich partitiven Sinn: Josef nahm einige aus der Gesamtgruppe seiner Brüder. »Aus der Mitte« gibt diesen Sinn natürlich wieder, ohne die umstrittene Deutung »die vornehmsten« festzuschreiben.'
- source_word: אֶחָיו
  choice: seiner Brüder
  rationale: Im unmittelbaren Zusammenhang sind Josefs leibliche Brüder gemeint; daher ist die konkrete Verwandtschaftsbezeichnung angemessen.
- source_word: לָקַח
  choice: nahm er
  rationale: Die Grundbedeutung von לָקַח ist »nehmen«. Im Zusammenhang schließt dies eine Auswahl ein, ohne dass »auswählen« ausdrücklich im Verb steht.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: fünf Männer
  rationale: Die Verbindung aus Zahlwort und אֲנָשִׁים wird direkt und idiomatisch mit »fünf Männer« wiedergegeben.
- source_word: וַיַּצִּגֵם
  choice: stellte sie … vor
  rationale: Der Hifil von יָצַג bezeichnet das Hinstellen oder Präsentieren. »Jemanden dem Pharao vorstellen« ist im höfischen Zusammenhang natürlich und bewahrt den Gedanken der Vorführung vor dem Herrscher.
- source_word: לִפְנֵי פַרְעֹה
  choice: dem Pharao
  rationale: In Verbindung mit »vorstellen« wird לִפְנֵי idiomatisch durch den deutschen Dativ ausgedrückt; gemeint ist die Präsentation in der Gegenwart des Pharaos.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung »stellte sie dem Pharao vor« vermeidet ein schwerfälliges »stellte sie vor den Pharao«, während die Fußnote die echte Mehrdeutigkeit von מִקְצֵה offenhält.
