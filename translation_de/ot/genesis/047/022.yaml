  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: de
  text: Nur das Land der Priester kaufte er nicht, denn die Priester erhielten von Pharao eine festgesetzte Zuteilung[a] und aßen von der Zuteilung, die Pharao ihnen gab. Deshalb verkauften sie ihr Land nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine feste Versorgung«, »einen festgelegten Anteil« oder »eine Ration«. Das hebräische Wort חֹק bezeichnet hier eine zugewiesene Versorgung, nicht in erster Linie eine Rechtsvorschrift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Ausnahme von der zuvor beschriebenen umfassenden Regelung und bewahrt die einschränkende Kraft.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: das Land der Priester
  rationale: Gibt die Konstruktverbindung als Grundbesitz der Priester klar und würdig wieder.
- source_word: קָנָה
  choice: kaufte
  rationale: Im wirtschaftlichen Zusammenhang bezeichnet das Verb den Erwerb des Landes durch Kauf.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung ein und verbindet sie im Deutschen natürlich mit dem vorangehenden Hauptsatz.
- source_word: חֹק / חֻקָּם
  choice: festgesetzte Zuteilung / Zuteilung
  rationale: Bezeichnet hier eine amtlich zugewiesene Versorgung durch den Pharao, nicht vorrangig eine Rechtsvorschrift. Die erste Wiedergabe macht den festgelegten Charakter deutlich; die Wiederholung wahrt den Zusammenhang.
- source_word: מֵאֵת פַּרְעֹה
  choice: von Pharao
  rationale: Gibt die Quelle beziehungsweise den Geber der Zuteilung idiomatisch wieder.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: und lebten von der Zuteilung
  rationale: Das hebräische »aßen« beschreibt hier, dass die Zuteilung ihren Lebensunterhalt sicherte. Die deutsche Formulierung ist natürlich, ohne die Art der Versorgung unnötig einzuengen.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: die Pharao ihnen gab
  rationale: Gibt den Relativsatz und Pharao als Geber schlicht und unmittelbar wieder.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Markiert klar die aus der Versorgung folgende Konsequenz.
- source_word: מָכְרוּ
  choice: verkauften
  rationale: Entspricht dem kommerziellen Vorgang im Erzählzusammenhang.
- source_word: אַדְמָתָם
  choice: ihr Land
  rationale: Bezeichnet ihren Grundbesitz in natürlichem modernem Deutsch.
