  to: 'Und Jakob sagte zum Pharao: „Die Tage der Jahre meines Aufenthalts in der Fremde[a] betragen hundertdreißig Jahre. Wenig und schlimm waren die Tage meiner Lebensjahre[b], und sie haben die Tage der Lebensjahre meiner Väter nicht erreicht in den Tagen ihres Aufenthalts in der Fremde.“'
