  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: de
  text: 'Und Jakob sagte zum Pharao: „Die Tage der Jahre meines Aufenthalts in der Fremde[a] betragen hundertdreißig Jahre. Wenig und schlimm waren die Tage meiner Lebensjahre[b], und sie haben die Tage der Lebensjahre meiner Väter nicht erreicht in den Tagen ihres Aufenthalts in der Fremde.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Tage der Jahre meines Aufenthalts“. Das hebräische Wort bezeichnet das Leben als zeitweilig ansässiger Fremder; auch „meine Fremdlingschaft“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Die Tage meiner Lebensjahre waren wenige und leidvoll.“ Das mit „schlimm“ wiedergegebene hebräische Wort kann auch „böse“ oder „schlecht“ bedeuten.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: als Fremder / als Fremde lebten
  rationale: Die Wendung bezeichnet das Leben als zeitweilig ansässiger Fremder. Die konkrete deutsche Formulierung ist verständlicher als das heute ungebräuchliche „Fremdlingschaft“ und vermeidet die geistliche Deutung „Pilgerschaft“.
- source_word: יְמֵי שְׁנֵי
  choice: die Tage meiner Jahre / die Tage meiner Lebensjahre
  rationale: Die auffällige Verbindung von „Tagen“ und „Jahren“ bleibt erhalten, da sie Jakobs feierlicher Rede ihre besondere sprachliche Prägung gibt.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: hundertdreißig Jahre
  rationale: Natürliche deutsche Wiedergabe der hebräischen Zahl, deren Wortstellung im Deutschen nicht nachgebildet werden muss.
- source_word: מְעַט
  choice: wenig
  rationale: Das Wort bewertet Jakobs Lebensdauer im Vergleich mit der seiner Väter als gering; die prädikative Form wahrt die hervorgehobene Stellung im Hebräischen.
- source_word: רָעִים
  choice: schlimm
  rationale: „Schlimm“ bewahrt die negative Aussage von רַע, ohne zwingend moralische Bosheit auszusagen; im Zusammenhang sind leidvolle, von Unglück geprägte Jahre gemeint.
- source_word: הִשִּׂיגוּ
  choice: haben … nicht erreicht
  rationale: Das Verb bedeutet „erreichen, einholen, erlangen“. „Nicht erreicht“ gibt den Vergleich der Lebensspannen klar und zugleich quellennah wieder.
- source_word: אֲבֹתַי
  choice: meine Väter
  rationale: Die direkte familiäre Bezeichnung bleibt erhalten und verweist hier auf Jakobs patriarchale Vorfahren.
theological_decisions:
- issue: Selbstbeschreibung des Patriarchen als ansässiger Fremder
  choice: als Fremder leben
  alternative: Pilgerschaft
  rationale: Der hebräische Ausdruck bezeichnet zunächst den rechtlich-sozialen Zustand eines zeitweilig ansässigen Fremden. Die Übersetzung lässt die heilsgeschichtliche Bedeutung bestehen, ohne sie durch das stärker geistlich geprägte „Pilgerschaft“ vorwegzunehmen.
- issue: Bedeutung der schlimmen Tage
  choice: schlimm
  alternative: böse
  rationale: רָעִים kann grundsätzlich „böse“ heißen, beschreibt hier aber die leidvolle Beschaffenheit von Jakobs Lebenstagen. „Schlimm“ erhält die Härte der Aussage, ohne den Tagen moralische Schuld zuzuschreiben.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst feierlicher Wiederholung von „Tage“ und „Jahre“. Die ungewöhnliche Formulierung im ersten Satz folgt der markanten hebräischen Ausdrucksweise, bleibt jedoch verständlich. „Als Fremder“ ist gegenwärtiger und klarer als „Fremdlingschaft“.
