  naturalness: Die vorgeschlagene Fassung verwendet modernes, würdiges Deutsch, bewahrt aber die gezielte Wiederholung von „Tagen“ und „Jahren“. „betragen“ ist hier deutlich idiomatischer als „zählen“; die Schlussformulierung erhält die hebräische Parallelstruktur ohne unnatürlich zu wirken.
  terminology: „Aufenthalt in der Fremde“ gibt מְגוּרַי/מְגוּרֵיהֶם sachlich und ohne spiritualisierende Zuspitzung wieder. „Schlimm“ ist in diesem Kontext für רָעִים angemessen; die Fußnote wahrt die mögliche, aber hier missverständliche Wiedergabe „böse“. „Väter“ ist als Bezeichnung der patriarchalen Vorfahren beizubehalten.
