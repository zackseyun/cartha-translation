  text: וַ/יָּ֣שֶׂם אֹתָ֣/הּ יוֹסֵ֡ף לְ/חֹק֩ עַד הַ/יּ֨וֹם הַ/זֶּ֜ה עַל אַדְמַ֥ת מִצְרַ֛יִם לְ/פַרְעֹ֖ה לַ/חֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַ/כֹּֽהֲנִים֙ לְ/בַדָּ֔/ם לֹ֥א הָיְתָ֖ה לְ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: de
  text: 'So machte Josef es zu einer Satzung, die bis heute für das Ackerland Ägyptens gilt: Ein Fünftel gehört dem Pharao.[a] Nur das Ackerland der Priester wurde nicht Eigentum des Pharaos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Das Fünftel ist für den Pharao.« Gemeint ist eine Abgabe von zwanzig Prozent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ יוֹסֵף לְחֹק
  choice: So machte Josef es zu einer Satzung
  rationale: שׂים mit לְחֹק bezeichnet hier das Festlegen einer verbindlichen Regelung. Das feminine Pronomen greift die zuvor beschriebene Abgabeordnung auf.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: die bis heute … gilt
  rationale: Die deutsche Relativkonstruktion macht natürlich deutlich, dass die Satzung bis in die Gegenwart des Erzählers fortgilt, ohne die Wendung an den einmaligen Akt des Erlasses zu binden.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: für das Ackerland Ägyptens
  rationale: עַל bezeichnet den Geltungsbereich der Satzung. אַדָמָה meint in diesem wirtschaftlichen Zusammenhang das bewirtschaftete Land, nicht allgemein das Staatsgebiet.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: Ein Fünftel gehört dem Pharao
  rationale: חֹמֶשׁ bezeichnet den fünften Teil, also zwanzig Prozent. Die deutsche Formulierung gibt den knappen nominalen Inhalt der Regelung verständlich wieder; לְפַרְעֹה markiert den Empfänger bzw. Anspruchsinhaber.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: Nur das Ackerland der Priester
  rationale: רַק und לְבַדָּם heben gemeinsam die Priester als einzige Ausnahme hervor. Im Deutschen drückt „nur“ diese Exklusivität ohne schwerfällige Verdopplung aus.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: wurde nicht Eigentum des Pharaos
  rationale: היה + ל beschreibt hier im Kontrast zum vorherigen Landerwerb den Besitzstand. „Wurde nicht Eigentum“ bewahrt den resultativen Sinn des narrativen Zusammenhangs.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Satzung“ wahrt den rechtlich-administrativen Ton; „Ackerland“ verdeutlicht den wirtschaftlichen Kontext. Die doppelte Exklusivmarkierung des Hebräischen wird idiomatisch durch „nur“ wiedergegeben.
