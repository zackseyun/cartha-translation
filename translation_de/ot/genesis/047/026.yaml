  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die rechtlich-administrative Aussage des Hebräischen zuverlässig wieder: Josef setzt die zuvor beschriebene Regelung als Satzung fest; sie gilt bis zur erzählerischen Gegenwart; für das Land Ägyptens steht dem Pharao ein Fünftel zu; allein das Land der Priester ging nicht in seinen Besitz über. „Ein Fünftel gehört dem Pharao“ gibt לְפַרְעֹה לַחֹמֶשׁ im wirtschaftlichen Kontext angemessen wieder, ohne eine über das Narrativ hinausgehende Deutung einzutragen.'
  naturalness: Modernes Standarddeutsch und gut lesbar. „So machte Josef es zu einer Satzung“ ist leicht bibelnah, aber im würdevollen Register idiomatisch. Die Relativkonstruktion „die bis heute … gilt“ bindet die Zeitangabe natürlich an die fortgeltende Satzung. Die einmalige Wiedergabe der hebräischen Doppelbetonung רַק … לְבַדָּם durch „Nur“ ist im Deutschen stilistisch vorzuziehen.
  terminology: „Satzung“, „Ackerland“, „Priester“, „Pharao“ und „Eigentum“ passen zum rechtlichen und agrarwirtschaftlichen Kontext. „Ackerland“ ist angesichts des unmittelbaren Kontextes der Landbewirtschaftung vertretbar. Die Fußnote erläutert die Abgabenhöhe sachlich und ohne unnötige historische oder theologische Festlegung.
