base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/005.yaml
  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: „Dein Vater und deine Brüder sind zu dir gekommen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt diese zeitlich-fortschreitende Funktion in natürlichem modernem Deutsch wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Übliche deutsche Bezeichnung für den ägyptischen Herrschertitel; der bestimmte Artikel entspricht dem natürlichen deutschen Gebrauch.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zu Josef“ ist die idiomatische deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: nicht eigens wiedergegeben
  rationale: Nach einem Verb des Sagens dient לֵאמֹר im Hebräischen regelmäßig zur Einführung direkter Rede. Eine zusätzliche Wiedergabe mit „indem er sprach“ oder „und sprach“ wäre im modernen Deutsch redundant.
- source_word: אָבִיךָ
  choice: dein Vater
  rationale: Direkte Anrede Josefs mit einem Possessivsuffix der zweiten Person Singular.
- source_word: וְאַחֶיךָ
  choice: und deine Brüder
  rationale: אַחִים bezeichnet hier die männlichen Geschwister Josefs; eine Verallgemeinerung zu „Familie“ wäre weniger genau.
- source_word: בָּאוּ
  choice: sind … gekommen
  rationale: Das Perfekt bezeichnet ein abgeschlossenes Kommen mit unmittelbarer Gegenwartsrelevanz. Das deutsche Perfekt ist in direkter Rede natürlich und bewahrt diesen Zusammenhang.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition mit Suffix bezeichnet die Bewegung auf Josef als Ziel hin; „zu dir“ gibt den Ausdruck ohne Zusatz wieder.
theological_decisions: []
