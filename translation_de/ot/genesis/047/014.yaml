base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: de
  text: Josef sammelte alles Silber ein, das im Land Ägypten und im Land Kanaan vorhanden war, für das Getreide, das sie kauften.[a] Dann brachte Josef das Silber in das Haus des Pharaos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „alles Silber“. Silber diente als Zahlungsmittel und kann daher sinngemäß auch „alles Geld“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus des Pharaos“ kann außer dem königlichen Wohnsitz auch der königliche Haushalt oder die Schatzkammer gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: sammelte … ein
  rationale: Das Verb לקט bezeichnet das Sammeln beziehungsweise Einsammeln; die trennbare Formulierung gibt hier passend das Ansammeln der Zahlungen aus vielen Käufen wieder.
- source_word: כָּל הַכֶּסֶף
  choice: alles Silber
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann als Zahlungsmittel auch Geld meinen. Die konkrete Ausdrucksweise des Hebräischen bleibt im Haupttext erhalten.
- source_word: הַנִּמְצָא
  choice: das … vorhanden war
  rationale: Das Partizip von מצא bezeichnet hier das in den beiden Ländern vorhandene Silber. „Vorhanden war“ ist im Deutschen natürlicher und genauer als das missverständliche „gefunden wurde“.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: im Land Ägypten und im Land Kanaan
  rationale: Die Wiederholung von „Land“ bewahrt die geografische Gliederung und entspricht der hebräischen Formulierung.
- source_word: בַּשֶּׁבֶר
  choice: als Bezahlung für das Getreide
  rationale: שֶׁבֶר bezeichnet in diesem Erzählzusammenhang das während der Hungersnot gekaufte Getreide; die Präposition בְּ markiert den Zusammenhang mit den dafür geleisteten Zahlungen.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: das die Menschen kauften
  rationale: שבר bedeutet hier idiomatisch „Getreide kaufen“. „Die Menschen“ gibt das hebräische Pronomen הֵם natürlich wieder, ohne dessen im Vers nicht ausdrücklich genannte Bezugsgruppe enger festzulegen.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: brachte … in das Haus des Pharaos
  rationale: Die Richtungsendung an בֵּיתָה bezeichnet eine Bewegung hinein. „Haus des Pharaos“ bewahrt die bewusst breite hebräische Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als Bezahlung“ macht die Transaktionsbeziehung natürlich verständlich; „Silber“ und „Haus des Pharaos“ bewahren zugleich die konkrete und in ihrer Reichweite offene Ausdrucksweise des Hebräischen.
