translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung am Versende wird flüssig wiedergegeben; die Fußnote bewahrt ihren Wortlaut und die echte Bedeutungsbreite zwischen Zahl und Bedarf.
