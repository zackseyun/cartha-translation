  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: de
  text: Josef versorgte seinen Vater, seine Brüder und alle Angehörigen des Hauses seines Vaters mit Nahrung[a], nach der Zahl der Kinder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Brot“. Das hebräische Wort kann hier Nahrung oder Lebensmittel im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach dem Mund der Kleinen“. Gemeint ist eine Zuteilung nach ihrer Zahl; „die Kleinen“ kann kleine Kinder oder weitere abhängige Haushaltsangehörige bezeichnen.'
    reason: idiom_and_ambiguity
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: versorgte
  rationale: Das Piel von כלכל bezeichnet hier die materielle Versorgung beziehungsweise Ernährung während der Hungersnot. „Versorgte“ ist im Deutschen natürlich und lässt zusammen mit „mit Nahrung“ den konkreten Inhalt erkennen.
- source_word: לֶחֶם
  choice: Nahrung
  rationale: לֶחֶם kann wörtlich „Brot“ bedeuten, bezeichnet in diesem Versorgungskontext aber wahrscheinlich Lebensmittel beziehungsweise Nahrung im weiteren Sinn.
- source_word: כָּל בֵּית אָבִיו
  choice: die ganze Hausgemeinschaft seines Vaters
  rationale: בַּיִת meint hier nicht das Gebäude, sondern den familiären und sozialen Haushalt. „Hausgemeinschaft“ bewahrt den Bezug auf das Vaterhaus und ist verständlicher als das wörtliche „Haus“.
- source_word: לְפִי
  choice: entsprechend dem Bedarf
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund von“ und bezeichnet hier das Maß der Zuteilung. Der Kontext erlaubt sowohl einen Bezug auf Zahl als auch auf Bedarf; „entsprechend dem Bedarf“ gibt die Versorgungssituation natürlich wieder, ohne eine bloße Kopfzählung festzulegen.
- source_word: הַטָּף
  choice: der kleinen Kinder
  rationale: טַף bezeichnet die Kleinen beziehungsweise kleinen Kinder innerhalb der Familien. Die bestimmte Form wird im Deutschen hier natürlich mit „der kleinen Kinder“ wiedergegeben.
- source_word: אָבִיו ... אֶחָיו
  choice: seinen Vater, seine Brüder
  rationale: Die Verwandtschaftsbezeichnungen sind eindeutig; „Brüder“ entspricht den männlichen Geschwistern Josefs im unmittelbaren Kontext.
