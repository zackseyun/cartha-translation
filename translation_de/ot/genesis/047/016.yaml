id: GEN.47.16
reference: Genesis 47:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: de
  text: 'Josef sagte: »Bringt euer Vieh her! Ich werde euch dafür etwas geben[a], wenn das Geld aufgebraucht ist[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich werde euch für euer Vieh geben.« Was Josef geben wird – dem Zusammenhang nach Nahrung –, bleibt im Hebräischen unausgesprochen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »da das Geld aufgebraucht ist«. Das hebräische Wort kann hier neben der Bedingung auch den Grund ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Bringt … her
  rationale: Der Imperativ fordert hier dazu auf, das Vieh zur Übergabe vorzubringen. »Bringt … her« ist im Deutschen natürlich und wahrt den administrativen Zusammenhang.
- source_word: מִקְנֵיכֶם
  choice: euer Vieh
  rationale: מִקְנֶה bezeichnet den Viehbestand beziehungsweise Herdentiere allgemein; »Vieh« ist breit genug und im Deutschen idiomatisch.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Ich werde euch … etwas geben
  rationale: Im Hebräischen bleibt das direkte Objekt unausgesprochen. »Etwas« macht den deutschen Satz grammatisch natürlich, ohne »Nahrung« ausdrücklich in den Haupttext einzutragen; aus dem Kontext ist Versorgung mit Nahrung gemeint.
- source_word: בְּמִקְנֵיכֶם
  choice: dafür
  rationale: 'Die Präposition בְּ kennzeichnet hier den Tauschgegenstand: Josef gibt ihnen etwas als Gegenleistung für ihr Vieh.'
- source_word: אִם
  choice: wenn
  rationale: אִם hat zunächst konditionalen Sinn. »Wenn« erhält diese Formulierung, während der Kontext auch eine begründende Nuance (»da/weil«) zulässt.
- source_word: אָפֵס כָּסֶף
  choice: das Geld aufgebraucht ist
  rationale: אָפֵס bezeichnet, dass etwas zu Ende gegangen beziehungsweise erschöpft ist. »Aufgebraucht« gibt dies präzise und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Redeform und der Tauschcharakter bleiben erhalten; die im Hebräischen fehlende Objektangabe sowie die Bedeutungsbreite von אִם werden nicht stillschweigend vereindeutigt.
