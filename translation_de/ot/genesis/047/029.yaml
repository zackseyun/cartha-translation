base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: de
  text: 'Als Israels Tage sich dem Tod näherten, rief er seinen Sohn Josef zu sich und sagte zu ihm: »Wenn ich Gunst in deinen Augen gefunden habe, dann leg bitte deine Hand unter meinen Schenkel[a] und erweise mir Güte und Treue[b]. Begrabe mich bitte nicht in Ägypten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Hand unter den Schenkel zu legen war in den Erzelternerzählungen eine Geste bei einem feierlichen Eid; vergleiche 1. Mose 24,2.
    reason: cultural_note
  - marker: b
    text: 'Oder: »erweise mir loyale Güte und Verlässlichkeit«. Das hebräische Wortpaar חֶסֶד וֶאֱמֶת bezeichnet gütiges, loyales und verlässliches Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Als Israels Tage sich dem Tod näherten
  rationale: Die Formulierung bewahrt das hebräische Bild von den Tagen, die näher kommen, und gibt לָמוּת im Deutschen natürlich als Annäherung an den Tod wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Ausgangstext verwendet hier Israel und nicht Jakob; diese Namensform bleibt erhalten.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: seinen Sohn Josef
  rationale: Josef ist die etablierte deutsche Form des hebräischen Namens und in modernem Standarddeutsch unmittelbar verständlich.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Wenn ich Gunst in deinen Augen gefunden habe
  rationale: Die Übersetzung bewahrt die hebräische Höflichkeitsformel und ihr Bild, ohne sie unnötig zu erklären.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: leg bitte deine Hand unter meine Hüfte
  rationale: Die konkrete, kulturell geprägte Schwurgeste wird im Haupttext beibehalten; נָא erscheint als höfliches „bitte“.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: erweise mir Güte und Treue
  rationale: „Erweisen“ gibt die idiomatische Verbindung von עָשָׂה mit עִם natürlich wieder. „Güte und Treue“ lässt die loyale, verlässliche Dimension des hebräischen Wortpaares erkennen, ohne den Bund ausdrücklich in den Text hineinzutragen.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Begrabe mich bitte nicht in Ägypten
  rationale: Die negative Bitte samt der höflichen Nuance von נָא wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חֶסֶד וֶאֱמֶת im Zusammenhang einer feierlichen Familienverpflichtung
  choice: Güte und Treue
  alternative: beständige Liebe und Treue; loyale Güte und Verlässlichkeit; Bundestreue und Wahrheit
  rationale: Das hebräische Paar bezeichnet loyales, verlässliches und gütiges Handeln. „Güte und Treue“ ist im Deutschen knapp und würdig, bewahrt die Bedeutungsbreite und vermeidet es, eine ausdrücklich bundestheologische Deutung festzuschreiben.
- issue: Beibehaltung der Geste „Hand unter die Hüfte“
  choice: Wörtliche Wiedergabe im Haupttext mit kultureller Fußnote
  alternative: Paraphrase als „schwöre mir“
  rationale: Die konkrete Geste gehört zur Erzählgestalt des Textes. Eine Fußnote erläutert ihre Funktion, ohne die bildhafte Formulierung durch eine Deutung zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht poetische Wendung „Israels Tage sich dem Tod näherten“ bewahrt das Bild des hebräischen Ausgangstextes. Die direkte Rede ist natürlich formuliert, ohne die höflichen Bitten oder die kulturell fremde Schwurgeste einzuebnen.
