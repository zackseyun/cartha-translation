  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und die wesentlichen Aussagen zuverlässig wieder: das Ende des Jahres, das Kommen im zweiten Jahr, die respektvolle singularische Anrede „mein Herr“, die Erschöpfung des Geldes, den Übergang des Viehbesitzes sowie die Ausnahme „unsere Körper und unser Land“. „Viehbestand ist an meinen Herrn übergegangen“ legt die im Kontext erkennbare Besitzübertragung von אֶל אֲדֹנִי idiomatisch dar, ohne eine weitergehende Deutung einzutragen.'
