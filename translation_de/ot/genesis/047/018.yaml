  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: de
  text: 'Als jenes Jahr zu Ende war, kamen sie im zweiten Jahr zu ihm und sagten: „Wir wollen vor meinem Herrn nichts verschweigen: Das Geld[a] ist aufgebraucht, und der Viehbestand ist an meinen Herrn übergegangen. Vor meinem Herrn ist nichts übrig geblieben außer unseren Körpern[b] und unserem Land.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Silber. Silber diente als Zahlungsmittel und kann daher für Geld stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: uns selbst. Wörtlich: unsere Körper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Als jenes Jahr zu Ende war
  rationale: תמם bezeichnet das Vollendet- oder Zu-Ende-Sein. Die Formulierung gibt den temporalen Nebensatz idiomatisch und zugleich eng am Hebräischen wieder.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: im zweiten Jahr
  rationale: Die formal entsprechende Wiedergabe bewahrt die hebräische Zählweise; der Kontext lässt erkennen, dass das auf das zuvor genannte Jahr folgende Jahr gemeint ist.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Wir wollen vor meinem Herrn nichts verschweigen
  rationale: כחד im Piel bedeutet verbergen oder verschweigen. „Vor meinem Herrn“ gibt die respektvolle Anrede mit singularischem Suffix wieder und klingt im Deutschen natürlich.
- source_word: תַּם הַכֶּסֶף
  choice: Das Geld ist aufgebraucht
  rationale: תַּם bezeichnet hier vollständige Erschöpfung; כֶּסֶף heißt wörtlich „Silber“, bezeichnet im wirtschaftlichen Zusammenhang aber das Zahlungsmittel.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: und der Viehbestand ist an meinen Herrn übergegangen
  rationale: מִקְנֵה הַבְּהֵמָה bezeichnet den Viehbesitz. Die knappe Präpositionalfügung אֶל אֲדֹנִי wird im Zusammenhang als Übergang des Viehs an Josef verstanden; „ist übergegangen“ drückt dies aus, ohne die bereits erfolgte Abgabe zu verwischen.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Vor meinem Herrn ist nichts übrig geblieben
  rationale: Die Wiedergabe bewahrt die Bildlichkeit von לִפְנֵי („vor“) und gibt נשאר mit „übrig geblieben“ idiomatisch wieder.
- source_word: בִּלְתִּי אִם
  choice: außer
  rationale: Die Partikelverbindung führt hier eine Ausnahme ein.
- source_word: גְּוִיָּתֵנוּ
  choice: unsere Körper
  rationale: גְּוִיָּה bezeichnet den Körper oder Leib. Im Zusammenhang sind die lebenden Personen in ihrer körperlichen Existenz gemeint; „Körper“ wahrt die konkrete Ausdrucksweise.
theological_decisions: []
