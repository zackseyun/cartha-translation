  to: 'Dann ging Josef zum Pharao hinein und berichtete ihm: „Mein Vater und meine Brüder sind mit ihrem Kleinvieh, ihren Rindern und ihrem ganzen Besitz aus dem Land Kanaan gekommen. Nun sind sie im Land Goschen.“'
