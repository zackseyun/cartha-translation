  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: de
  text: 'Dann ging Josef zum Pharao hinein und berichtete ihm: „Mein Vater und meine Brüder sind mit ihrem Kleinvieh, ihren Rindern und ihrem ganzen Besitz aus dem Land Kanaan gekommen. Nun sind sie im Land Goschen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging … hinein
  rationale: בוא kann je nach Perspektive „kommen“, „gehen“ oder „eintreten“ bedeuten. Im höfischen Zusammenhang bezeichnet es Josefs Gang in die Gegenwart des Pharaos; „ging … hinein“ gibt dies natürlich und quellennah wieder.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: 'berichtete ihm:'
  rationale: Die beiden aufeinanderfolgenden Verben „berichtete … und sagte“ bilden eine hebräische Redeeinleitung. Im Deutschen fasst „berichtete ihm:“ die Funktion idiomatisch zusammen, ohne einen eigenen Aussageinhalt auszulassen.
- source_word: אָבִי וְאַחַי
  choice: Mein Vater und meine Brüder
  rationale: Direkte und natürliche Wiedergabe der Possessivformen; „Brüder“ bezeichnet im Kontext Josefs männliche Geschwister.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: mit ihren Schaf- und Ziegenherden, ihren Rinderherden
  rationale: צאן bezeichnet Kleinvieh, besonders Schafe und Ziegen, בקר dagegen Rinder beziehungsweise Großvieh. Die Formulierung wahrt den Unterschied und vermeidet das im heutigen Deutsch missverständliche allgemeine Wort „Herden“.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: und ihrem ganzen Besitz
  rationale: Die Wendung meint alles, was ihnen gehört. „Ihr ganzer Besitz“ ist knapp, natürlich und vollständig.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: sind … aus dem Land Kanaan gekommen
  rationale: Das hebräische Perfekt bezeichnet die abgeschlossene Ankunft mit gegenwärtigem Ergebnis. Das deutsche Perfekt passt zu Josefs aktueller Meldung.
- source_word: וְהִנָּם
  choice: Nun sind sie
  rationale: הנה mit Suffix lenkt die Aufmerksamkeit auf ihren gegenwärtigen Aufenthaltsort. „Nun sind sie“ bewahrt die präsentische, hinweisende Funktion in natürlichem modernem Deutsch; ein feierliches „siehe“ wäre hier unnötig markiert.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: „Land“ wird entsprechend dem ausdrücklichen אֶרֶץ beibehalten; „Goschen“ ist die etablierte deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Redeeinleitung. Die Sprache bleibt nah an der hebräischen Erzählstruktur, vermeidet jedoch die im Deutschen schwerfällige Doppelung „berichtete … und sagte“. Keine sachlich notwendige textkritische oder theologische Fußnote.
