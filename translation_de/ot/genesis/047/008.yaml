  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל יַעֲקֹ֑ב כַּ/מָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: de
  text: 'Da fragte der Pharao Jakob: „Wie viele sind die Tage deiner Lebensjahre?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wie viele sind die Tage der Jahre deines Lebens?“ Gemeint ist: „Wie alt bist du?“'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da fragte
  rationale: Das narrative wayyiqtol führt die Handlung fort. Da der folgende Satz eindeutig eine Frage ist, gibt „fragte“ die Sprechhandlung im Deutschen natürlich wieder; „Da“ wahrt den Erzählfluss.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen etablierte Bezeichnung für den ägyptischen Herrschertitel.
- source_word: אֶל יַעֲקֹב
  choice: Jakob
  rationale: Bei „jemanden fragen“ steht der Angesprochene im Deutschen ohne Präposition im Akkusativ; Jakob ist die etablierte deutsche Namensform.
- source_word: כַּמָּה
  choice: Wie viele
  rationale: Leitet eine Frage nach einer zählbaren Anzahl ein und bezieht sich hier auf die Lebenstage beziehungsweise das Lebensalter.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: die Tage deiner Lebensjahre
  rationale: Bewahrt die auffällige gestufte hebräische Wendung mit „Tagen“, „Jahren“ und „Leben“, bleibt dabei im Deutschen verständlich und reduziert die Frage nicht einfach auf „Wie alt bist du?“.
