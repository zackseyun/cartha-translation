source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: de
  text: So ließ sich Israel im Land Ägypten, im Land Goschen, nieder. Sie fassten dort Fuß[a], wurden fruchtbar und vermehrten sich sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie erwarben dort Besitz“ beziehungsweise „sie wurden dort fest ansässig“. Das hebräische Verb kann sowohl das Erlangen eines festen Besitzes als auch das feste Fußfassen im Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: ישׁב bezeichnet hier nicht nur vorübergehendes Wohnen, sondern die feste Ansiedlung; die deutsche Wendung ist natürlich und bewahrt diesen Aspekt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt Israel im Singular und geht anschließend zu pluralischen Verben für seine Familie beziehungsweise Nachkommen über. Die Beibehaltung des Namens wahrt diesen repräsentativen Übergang.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ wird bewahrt und unterstreicht den territorialen Zusammenhang.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Die parallele hebräische Formulierung wird wiedergegeben und Goschen als Gebiet innerhalb Ägyptens bezeichnet.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: sie fassten dort Fuß
  rationale: Das Nifal von אחז ist mehrdeutig und kann hier das Erlangen eines festen Besitz- oder Niederlassungsrechts beziehungsweise das feste Ansässigwerden ausdrücken. „Fuß fassen“ gibt den Kern natürlich wieder, ohne Eigentum eindeutiger zu behaupten, als es der hebräische Ausdruck erlaubt.
- source_word: וַיִּפְרוּ
  choice: waren fruchtbar
  rationale: Die Wendung bewahrt das wiederkehrende Fruchtbarkeitsmotiv der Genesis und bleibt in modernem Deutsch verständlich.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: vermehrten sich sehr
  rationale: Die Wiedergabe erhält die vertraute Verbindung von Fruchtbarkeit und Vermehrung sowie die verstärkende Funktion von מְאֹד.
theological_decisions:
- issue: Repräsentative Bedeutung von „Israel“
  choice: „Israel“ im Singular beibehalten und den anschließenden Plural auf seine Familie beziehungsweise Nachkommen beziehen.
  alternative: Durchgehend „die Israeliten“ oder statt „Israel“ den Namen „Jakob“ verwenden.
  rationale: 'Der Wechsel vom singularischen Subjekt zu pluralischen Verbformen gehört zur Aussageform des hebräischen Textes: Der Stammvater steht zugleich für die aus ihm hervorgehende Gemeinschaft. Eine Vereinheitlichung würde diese Spannung auflösen.'
- issue: Bedeutung des Fußfassens im Land
  choice: Mit „fassten dort Fuß“ die feste Niederlassung beziehungsweise gesicherte Stellung ausdrücken, ohne zwingend privaten Grundbesitz festzulegen.
  alternative: „Sie erwarben dort Besitz“ oder „sie wurden dort ansässig“.
  rationale: וַיֵּאָחֲזוּ בָהּ lässt sowohl eine besitzbezogene als auch eine allgemeinere Bedeutung des festen Ansässigwerdens zu. Die Hauptfassung wahrt diese Offenheit; die Fußnote nennt die wichtigsten Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Ortsangaben bleiben parallel erhalten. Ein neuer Satz nach „nieder“ macht den Wechsel vom singularischen „Israel“ zum pluralischen „sie“ verständlich, ohne ihn inhaltlich zu glätten.
