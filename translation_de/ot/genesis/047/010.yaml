  text: וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹ֑ה וַ/יֵּצֵ֖א מִ/לִּ/פְנֵ֥י פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: de
  text: Dann segnete Jakob den Pharao und verließ dessen Gegenwart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begrüßte den Pharao“ oder „verabschiedete sich vom Pharao“. Das hebräische Verb bedeutet gewöhnlich „segnen“, kann bei einer königlichen Audienz aber zugleich einen förmlichen Gruß oder Abschied bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Das Verb ברך bedeutet gewöhnlich „segnen“. Im Zusammenhang einer königlichen Audienz kann es zugleich den Charakter eines förmlichen Grußes oder Abschieds haben; die lexikalische Grundbedeutung bleibt jedoch vorzuziehen und entspricht auch Vers 7.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens יעקב.
- source_word: אֶת
  choice: '[unübersetzte Akkusativmarkierung]'
  rationale: Die hebräische Kennzeichnung des bestimmten direkten Objekts besitzt im Deutschen keine eigene Entsprechung.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Eingebürgerte deutsche Form des ägyptischen Herrschertitels.
- source_word: וַיֵּצֵא
  choice: ging … hinaus
  rationale: יצא bezeichnet konkret das Hinausgehen beziehungsweise Verlassen eines Ortes und passt hier zum Ende der königlichen Audienz.
- source_word: מִלִּפְנֵי
  choice: aus der Gegenwart des Pharaos
  rationale: Die Wendung bedeutet wörtlich „von vor dem Angesicht“. „Aus der Gegenwart“ bewahrt den Bezug auf die Audienz und klingt im Deutschen würdevoll und verständlich.
