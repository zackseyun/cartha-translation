  naturalness: „Er erkannte ihn nicht, denn seine Hände waren behaart wie die Hände seines Bruders Esau“ ist klares, modernes Standarddeutsch. Auch „Und er segnete ihn“ ist in diesem knappen erzählerischen Kontext natürlich und bewahrt die offene Verknüpfung des Hebräischen.
  terminology: „erkannte“, „Hände“, „behaart“, „Bruder“ und „segnete“ sind treffend und registergerecht. Es bestehen keine namenkundlichen oder theologischen Probleme.
