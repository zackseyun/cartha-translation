  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: de
  text: Er erkannte ihn nicht, denn seine Hände waren behaart wie die Hände seines Bruders Esau. Und er segnete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: erkannte ihn nicht
  rationale: נכר im Hifil bedeutet hier »erkennen/identifizieren«. Isaak erkennt Jakob trotz der Prüfung durch Berührung nicht.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung dafür ein, dass Isaak Jakob nicht erkannte. »Denn« gibt den kausalen Zusammenhang in würdigem, natürlichem Deutsch wieder.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Wörtliche Wiedergabe des Plurals mit Suffix der 3. Person Singular; gemeint sind Jakobs Hände.
- source_word: כִּידֵי
  choice: wie die Hände
  rationale: Das präfigierte כ bezeichnet einen Vergleich; »wie die Hände« bildet ihn natürlich und genau ab.
- source_word: אָחִיו
  choice: seines Bruders
  rationale: Direkte Wiedergabe der Verwandtschaftsbezeichnung mit Suffix; im Kontext ist Jakob der Bezugspunkt.
- source_word: שְׂעִרֹת
  choice: behaart
  rationale: Das Adjektiv beschreibt die Hände. »Behaart« ist präzise und gibt das für die Täuschung entscheidende Tastmerkmal wieder.
- source_word: וַיְבָרְכֵהוּ
  choice: So segnete er ihn
  rationale: Die narrative Verbform führt die Handlung fort; »so« lässt zugleich den im Kontext naheliegenden Folgezusammenhang erkennen, ohne ihn stärker als der Text festzulegen.
