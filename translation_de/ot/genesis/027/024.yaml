lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er fragte
  rationale: Das gewöhnlich mit »sagen« wiedergegebene Verb leitet hier aufgrund der folgenden Frage eine direkte Frage ein; »fragte« ist im Deutschen natürlich und gibt die Sprechhandlung präzise wieder.
- source_word: אַתָּה זֶה
  choice: Bist du wirklich
  rationale: Die Verbindung aus selbstständigem Pronomen und Demonstrativum hebt die Identitätsfrage hervor. »wirklich« vermittelt diese emphatische Kraft idiomatisch, ohne den Sinn zu erweitern.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Status-constructus-Verbindung mit Suffix der ersten Person Singular wird direkt und ausdrücklich wiedergegeben.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: Er antwortete
  rationale: Obwohl das hebräische Verb wörtlich »sagte« bedeutet, bezeichnet es hier die Erwiderung auf eine Frage; »antwortete« ist natürliches modernes Deutsch.
- source_word: אָֽנִי
  choice: Ja, das bin ich
  rationale: Das selbstständige Pronomen ist eine knappe Selbstidentifikation. Im Deutschen gibt »Ja, das bin ich« die bejahende Antwort auf die Identitätsfrage natürlich wieder.
