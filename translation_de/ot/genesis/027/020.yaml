  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: de
  text: 'Da sagte Isaak zu seinem Sohn: „Wie konntest du nur so schnell etwas finden, mein Sohn?“ Er antwortete: „Weil Jahwe, dein Gott, es mir gefügt hat.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „es vor mir geschehen ließ“; sinngemäß auch: „es mir zukommen ließ“ oder „mir Erfolg gab“.'
    reason: Der Ausdruck הִקְרָה ... לְפָנַי verbindet ein kausatives Geschehenlassen mit „vor mir“ und lässt im Deutschen mehrere nahe Wiedergaben zu.
lexical_decisions:
- source_word: מַה זֶּה
  choice: Wie … nur
  rationale: Die hebräische Wendung leitet eine überraschte Frage ein. Das deutsche Modalwort „nur“ gibt Isaaks Verwunderung natürlich wieder, ohne die Wendung hölzern nachzubilden.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: hast du … so schnell etwas gefunden
  rationale: Der Ausdruck bezeichnet das schnelle Finden. Die finite deutsche Form ist idiomatisch; „etwas“ vertritt den im Hebräischen unausgesprochenen, aus dem Zusammenhang bekannten Gegenstand.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Bewahrt die besitzanzeigende Endung und die persönliche Anrede.
- source_word: כִּי
  choice: Weil
  rationale: Leitet Jakobs Begründung in direkter Rede klar und natürlich ein.
- source_word: הִקְרָה ... לְפָנַי
  choice: es mir begegnen ließ
  rationale: Gibt den kausativen Sinn von קרה sowie die Vorstellung eines vor jemanden gelangenden Ereignisses idiomatisch wieder, ohne eine ausdrückliche Bringhandlung oder einen garantierten Erfolg in den Text hineinzulesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Bewahrt die zweite Person Singular. Die auffällige Formulierung „dein Gott“ wird nicht zu „unser Gott“ oder „mein Gott“ geglättet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Göttliche Verursachung in הִקְרָה ... לְפָנַי
  choice: es mir begegnen ließ
  alternative: mir Erfolg gab; es vor mir geschehen ließ
  rationale: Die gewählte Formulierung bewahrt die Zuschreibung an Gottes Fügung, vermeidet aber eine stärkere Erfolgsaussage, als der hebräische Ausdruck zwingend enthält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wie hast du nur …?“ bildet die überraschte Frage natürlich ab. Die Spannung in „Jahwe, dein Gott“ bleibt ausdrücklich erhalten.
