  to: 'Da sagte Isaak zu seinem Sohn: „Wie konntest du nur so schnell etwas finden, mein Sohn?“ Er antwortete: „Weil Jahwe, dein Gott, es mir gefügt hat.[a]“'
  rationale: Die Revision beseitigt die unnatürliche Wendung „es mir begegnen ließ“. „Jahwe, dein Gott, hat es mir gefügt“ bewahrt die göttliche Verursachung und die auf Jakob bezogene Wendung לְפָנַי, ohne eine stärkere Aussage über Erfolg oder eine konkrete Bringhandlung festzulegen. Die Frage wurde geringfügig idiomatisiert, während ihre überraschte Nuance und das im Ausgangstext unausgesprochene Objekt erhalten bleiben.
