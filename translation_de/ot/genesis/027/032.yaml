  text: וַ/יֹּ֥אמֶר ל֛/וֹ יִצְחָ֥ק אָבִ֖י/ו מִי אָ֑תָּה וַ/יֹּ֕אמֶר אֲנִ֛י בִּנְ/ךָ֥ בְכֹֽרְ/ךָ֖ עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: de
  text: 'Da sagte sein Vater Isaak zu ihm[a]: »Wer bist du?« Er sagte: »Ich bin dein Sohn, dein Erstgeborener[b], Esau.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: »Isaak, sein Vater«; hier idiomatisch als »sein Vater Isaak« wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dein ältester Sohn«. »Dein Erstgeborener« bewahrt die Betonung der Geburtsrangfolge, die für den Zusammenhang wichtig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: Da sagte … zu ihm
  rationale: אמר ist das übliche Verb des Sagens; לֹו bezeichnet den Adressaten. »Da« gibt die fortlaufende hebräische Erzählung natürlich wieder.
- source_word: יִצְחָק אָבִיו
  choice: sein Vater Isaak
  rationale: Die hebräische Wortfolge lautet wörtlich »Isaak, sein Vater«; im modernen Deutschen ist »sein Vater Isaak« idiomatischer und bewahrt sowohl die Beziehung als auch den Namen.
- source_word: מִי אָתָּה
  choice: Wer bist du?
  rationale: Direkte und natürliche Wiedergabe der Frage aus מִי und dem Personalpronomen אַתָּה.
- source_word: אֲנִי בִּנְךָ
  choice: Ich bin dein Sohn
  rationale: Der im hebräischen Nominalsatz nicht ausgedrückte Kopulaverb wird im Deutschen mit »bin« ergänzt.
- source_word: בְכֹרְךָ
  choice: dein Erstgeborener
  rationale: בְּכוֹר bezeichnet den Erstgeborenen und trägt im Kontext die für Erstgeburt und Erstgeburtsrecht wichtige Geburtsrangfolge deutlicher als »ältester Sohn«.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeeinleitung bleibt nahe am hebräischen אמר, während die deutsche Wortstellung natürlich gestaltet ist. »Erstgeborener« erhält die erzählerisch und rechtlich bedeutsame Nuance des Ausgangsworts.
