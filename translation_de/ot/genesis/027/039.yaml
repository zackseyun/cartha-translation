base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: de
  text: 'Da antwortete sein Vater Isaak und sagte zu ihm[a]: »Siehe, fern von der Fruchtbarkeit der Erde wird dein Wohnort sein und fern vom Tau des Himmels.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehe, von der Fruchtbarkeit der Erde wird dein Wohnort sein und vom Tau des Himmels.« Die hebräische Präposition kann hier sowohl positiv (»von«, im Sinne von Anteil oder Herkunft) als auch privativ (»fern von«) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Gibt die übliche narrative Einleitung einer Erwiderung wieder und bewahrt die Dialogstruktur.
- source_word: אָבִיו
  choice: sein Vater Isaak
  rationale: Bewahrt sowohl die Verwandtschaftsbezeichnung als auch den im Hebräischen genannten Namen in natürlicher deutscher Wortstellung.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Ein würdevoller, verständlicher Aufmerksamkeitsmarker für den feierlichen Ausspruch.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: fern von der Fruchtbarkeit der Erde
  rationale: שְׁמַנִּים bezeichnet wörtlich die »Fettigkeit« beziehungsweise den Reichtum des Bodens und meint hier seine Fruchtbarkeit; מִן wird im Haupttext privativ beziehungsweise separativ verstanden.
- source_word: מוֹשָׁבֶךָ
  choice: dein Wohnort
  rationale: Gibt den örtlichen Sinn von מוֹשָׁב in natürlichem modernem Deutsch wieder.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: und fern vom Tau des Himmels
  rationale: Das zweite מִן wird parallel zum ersten privativ beziehungsweise separativ wiedergegeben.
- source_word: מֵעָל
  choice: droben
  rationale: Bewahrt die räumliche Vorstellung von dem Himmel oben, ohne das im Deutschen schwerfällige »von oben« an die bereits separative Formulierung anzuhängen.
theological_decisions:
- issue: Bedeutung der Präposition מִן in Isaaks Ausspruch an Esau
  choice: 'privativ/separativ: »fern von« der Fruchtbarkeit der Erde und dem Tau des Himmels'
  alternative: 'partitiv beziehungsweise als Herkunftsangabe: »von der Fruchtbarkeit der Erde und vom Tau des Himmels«'
  rationale: Der Kontrast zu Jakobs Segen in Vers 28 und der weitere Zusammenhang stützen die privative Lesart. Da מִן sprachlich jedoch auch eine positive Herkunfts- oder Anteilsaussage zulässt, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Siehe« trägt den feierlichen Ton; »Fruchtbarkeit« vermittelt die bildliche Bedeutung der wörtlichen »Fettigkeit« verständlich. Die syntaktische Spannung und die doppelte Deutungsmöglichkeit von מִן werden durch Haupttext und Fußnote offengehalten.
