  text: וְ/אֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽ/עִזִּ֔ים הִלְבִּ֖ישָׁה עַל יָדָ֑י/ו וְ/עַ֖ל חֶלְקַ֥ת צַוָּארָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: de
  text: Die Felle der jungen Ziegen legte sie über seine Hände und über die glatte Stelle seines Halses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: Felle
  rationale: Der Plural bezeichnet hier abgezogene Tierhäute, die als Bedeckung dienen. „Felle“ ist im Zusammenhang besonders passend, weil gerade die Behaarung der Ziegen Jakobs glatte Haut verdecken soll.
- source_word: גְּדָיֵי הָעִזִּים
  choice: der jungen Ziegen
  rationale: Die Wortverbindung bezeichnet junge Tiere aus der Gattung der Ziegen. „Junge Ziegen“ ist natürliches, allgemein verständliches Deutsch; „Zicklein“ wäre ebenfalls möglich, hebt die Altersstufe aber stärker hervor.
- source_word: הִלְבִּישָׁה
  choice: legte sie um
  rationale: Der Hifil von לבש bedeutet, jemanden zu bekleiden beziehungsweise ihm etwas anzulegen. Da die Felle Hände und Hals bedecken, gibt „legte sie um“ den konkreten Vorgang im Deutschen natürlich wieder.
- source_word: עַל יָדָיו
  choice: um seine Hände
  rationale: עַל kann hier die unmittelbare Bedeckung der Hände ausdrücken. Bei einem angelegten Fell klingt „um seine Hände“ im Deutschen natürlicher und räumlich treffender als „auf seine Hände“.
- source_word: חֶלְקַת צַוָּארָיו
  choice: die glatte Stelle seines Halses
  rationale: חֶלְקַת bezeichnet hier den glatten beziehungsweise unbehaarten Bereich. „Die glatte Stelle seines Halses“ wahrt den konkreten Gegensatz zu Esaus Behaarung, ohne zusätzliche Deutung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von „Die Felle der jungen Ziegen“ folgt der hebräischen Hervorhebung, bleibt aber gut verständlich. Keine Fußnoten erforderlich.
