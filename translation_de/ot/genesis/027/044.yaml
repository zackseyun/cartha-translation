  terminology: „Wut“ gibt die Intensität von חֵמָה gut wieder, ohne unnötig gehoben zu wirken. Die Personenbezüge und die possessive Formulierung „deines Bruders“ sind korrekt. Es sind keine theologisch oder textkritisch problematischen Festlegungen enthalten.
