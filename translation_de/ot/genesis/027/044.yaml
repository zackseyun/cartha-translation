  source_fidelity: Der Entwurf gibt die hebräische Aufforderung וְיָשַׁבְתָּ („bleib/halte dich auf“) mit dem idiomatischen Imperativ „Bleib“ angemessen wieder. „bei ihm“ trifft den vorübergehenden Aufenthalt bei Laban, und „einige Tage“ entspricht יָמִים אֲחָדִים. Die temporale Konstruktion „bis sich die Wut deines Bruders gelegt hat“ gibt die idiomatische Bedeutung von תָּשׁוּב חֲמַת אָחִיךָ wieder, nämlich das Abklingen von Esaus heftiger Wut. Das deutsche Perfekt ist in einer bis-Satz-Konstruktion natürlich und verändert den zeitlichen Sinn nicht.
