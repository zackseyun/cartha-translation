  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: de
  text: Bleib einige Tage bei ihm, bis sich die Wut deines Bruders gelegt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Bleib
  rationale: ישׁב kann „sitzen, wohnen, bleiben“ bedeuten. Hier weist Rebekka Jakob an, sich vorübergehend bei Laban aufzuhalten; „Bleib“ gibt dies im Deutschen natürlich und treffend wieder.
- source_word: עִמּוֹ
  choice: bei ihm
  rationale: עם mit Suffix bedeutet wörtlich „mit ihm“. Bei einem vorübergehenden Aufenthalt ist im Deutschen „bei ihm“ idiomatischer.
- source_word: יָמִים אֲחָדִים
  choice: einige Tage
  rationale: Die Wendung bedeutet wörtlich „Tage, einige“ und bezeichnet in Rebekkas Worten eine begrenzte, kurze Zeit.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die Verbindung leitet den Zeitpunkt ein, bis zu dem Jakob bei Laban bleiben soll.
- source_word: תָּשׁוּב
  choice: sich … gelegt hat
  rationale: שׁוב bedeutet grundsätzlich „zurückkehren, sich wenden“. Mit „Wut“ als Subjekt bezeichnet es idiomatisch deren Abklingen; die deutsche Wendung „sich legen“ gibt diesen Sinn natürlich wieder.
- source_word: חֲמַת
  choice: die Wut
  rationale: חֵמָה bezeichnet heftigen, entbrannten Zorn. „Wut“ bewahrt die Intensität und klingt zugleich modern und verständlich.
- source_word: אָחִיךָ
  choice: deines Bruders
  rationale: Die hebräische Genitivverbindung lautet „die Wut deines Bruders“ und wird im Deutschen ebenso natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wiedergabe „sich gelegt hat“ vermeidet eine unnatürliche wörtliche Formulierung, ohne den Sinn zu verändern.
