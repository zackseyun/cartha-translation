base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: de
  text: 'Esau sagte zu seinem Vater[a]: »Hast du nur einen Segen, mein Vater? Segne auch mich, mein Vater!« Dann erhob Esau seine Stimme und weinte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Ist der Segen nur einer für dich, mein Vater?« Das Hebräische bringt Esaus Verzweiflung darüber zum Ausdruck, dass Isaak anscheinend nur einen einzigen Segen zu vergeben hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Hast du nur einen Segen
  rationale: 'Die hebräische Nominalkonstruktion lautet wörtlich etwa: »Ist der Segen einer für dich?« Im Zusammenhang ist sie eine erschütterte rhetorische Frage. Die gewählte Formulierung gibt dies in natürlichem modernem Deutsch wieder, ohne zusätzlichen Inhalt einzutragen.'
- source_word: אָבִי
  choice: mein Vater
  rationale: Das Suffix der 1. Person Singular bezeichnet ausdrücklich den Vater als »meinen Vater«. Die Wiederholung bleibt erhalten und trägt Esaus eindringlicher Bitte Rechnung.
- source_word: בָּרֲכֵנִי
  choice: Segne mich
  rationale: Direkter Imperativ von ברך mit Objektsuffix der 1. Person Singular; die knappe Wiedergabe entspricht Form und Nachdruck des Hebräischen.
- source_word: גַּם אָֽנִי
  choice: auch mich
  rationale: Die Wendung verlangt, Esau neben Jakob einzubeziehen. »Auch mich« ist idiomatisches Deutsch und bewahrt den emotionalen Nachdruck.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: erhob ... seine Stimme
  rationale: Die hebräische Wendung bedeutet wörtlich »seine Stimme erheben«. Die deutsche Formulierung bewahrt das Bild des laut hörbaren Klagens und bleibt würdevoll und verständlich.
- source_word: וַיֵּבְךְּ
  choice: weinte
  rationale: Das Verb bezeichnet das Weinen. »Weinte« ist im modernen Deutsch präzise und vermeidet die mögliche Mehrdeutigkeit von »schrie« oder »rief«.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die zweimalige Anrede »mein Vater« sowie das Bild vom Erheben der Stimme wurden zur Wahrung der emotionalen Intensität und der hebräischen Wiederholung beibehalten.
