  terminology: Die Namen Jakob, Rebekka und Esau sind standardsprachlich und korrekt. „Behaart“ und „glatte Haut“ geben den lexikalischen Gegensatz sachlich wieder, ohne die Formulierung etwa zu „haarlos“ zu verengen.
