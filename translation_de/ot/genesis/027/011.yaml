base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: de
  text: 'Jakob aber sagte zu seiner Mutter Rebekka: „Sieh doch, mein Bruder Esau ist ein behaarter Mann, ich dagegen bin ein Mann mit glatter Haut.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein glatter Mann“. Gemeint ist im Gegensatz zu Esaus Behaarung glatte, nicht behaarte Haut.'
    reason: clarity_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Jakob aber sagte
  rationale: Das narrative וַ führt die Handlung fort; „aber“ gibt zugleich natürlich wieder, dass Jakob einen Einwand gegen Rebekkas Plan erhebt.
- source_word: אֶל רִבְקָה אִמּוֹ
  choice: zu seiner Mutter Rebekka
  rationale: Die deutsche Wortstellung ist natürlicher als „zu Rebekka, seiner Mutter“ und bewahrt sowohl den Namen als auch die Verwandtschaftsbezeichnung.
- source_word: הֵן
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende Partikel leitet Jakobs Einwand ein. „Sieh doch“ ist gegenwärtiges, idiomatisches Deutsch und erhält den nachdrücklichen Gesprächston.
- source_word: עֵשָׂו אָחִי
  choice: mein Bruder Esau
  rationale: Diese Wortstellung entspricht natürlichem Deutsch und gibt beide Bestandteile vollständig wieder.
- source_word: אִישׁ שָׂעִר
  choice: ein behaarter Mann
  rationale: Die Formulierung bildet die hebräische Nominalphrase eng und verständlich ab.
- source_word: וְאָנֹכִי
  choice: ich dagegen bin
  rationale: Das selbstständige Pronomen אָנֹכִי hebt Jakob hervor; „dagegen“ macht den im Satz angelegten Kontrast idiomatisch sichtbar.
- source_word: אִישׁ חָלָק
  choice: ein glatter Mann
  rationale: „Glatt“ wahrt die direkte lexikalische Gegenüberstellung zu Esaus Behaarung, ohne den Ausdruck im Haupttext erklärend auf „unbehaart“ festzulegen.
