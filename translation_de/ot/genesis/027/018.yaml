base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: de
  text: 'Da ging er zu seinem Vater hinein und sagte: „Mein Vater!“ Der antwortete: „Hier bin ich. Wer bist du, mein Sohn?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da ging er … hinein
  rationale: בוא im Wayyiqtol führt die Erzählung weiter und bezeichnet hier Jakobs Eintreten in den Raum beziehungsweise die Gegenwart seines Vaters. „Da ging er … hinein“ gibt Bewegung und Erzählfortgang natürlich wieder.
- source_word: אֶל אָבִיו
  choice: zu seinem Vater
  rationale: Die Präposition אֶל mit dem suffigierten Substantiv bezeichnet die Richtung. Der Name Isaak wird nicht ergänzt, da er im hebräischen Text nicht steht.
- source_word: וַיֹּאמֶר
  choice: und sagte / Der antwortete
  rationale: Die erste Form wird als gewöhnliche Redeeinleitung wiedergegeben. Bei der zweiten macht „Der antwortete“ den Sprecherwechsel im Deutschen natürlich deutlich; die Antwortfunktion ergibt sich aus dem Zusammenhang.
- source_word: אָבִי
  choice: Mein Vater!
  rationale: Das Substantiv mit Suffix der ersten Person Singular ist eine direkte Anrede. Das Possessiv wird entsprechend der hebräischen Form beibehalten.
- source_word: הִנֶּנִּי
  choice: Hier bin ich
  rationale: Die feste hebräische Antwortformel bezeichnet Gegenwart und Zuwendung. „Hier bin ich“ ist im modernen Deutschen natürlich und bewahrt diese Nuance.
- source_word: מִי אַתָּה
  choice: Wer bist du
  rationale: Das Fragewort mit dem Pronomen der zweiten Person Singular fragt unmittelbar nach der Identität des Angesprochenen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Das Substantiv mit Suffix der ersten Person Singular steht als persönliche Anrede; das Possessiv bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die Wiederholung des allgemeinen hebräischen Verbs ויאמר wird beim Sprecherwechsel idiomatisch mit „Der antwortete“ variiert. Keine Fußnote ist nötig, da „hineingehen“ die kontextuelle Bedeutung von בוא präzise und ohne sachlichen Zusatz wiedergibt.
