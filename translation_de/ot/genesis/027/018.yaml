  source_fidelity: Die Übersetzung gibt den hebräischen Erzählfortgang und die Bewegungsrichtung zu seinem Vater angemessen wieder. „Da ging er zu seinem Vater hinein“ ist im Kontext des Eintretens in Isaaks Gegenwart eine tragfähige Wiedergabe von וַיָּבֹא אֶל־אָבִיו. Die Anreden „Mein Vater!“ und „mein Sohn“ sowie die Identitätsfrage sind vollständig erhalten.
  naturalness: Der Text klingt in modernem Standarddeutsch flüssig und würdig. „Hier bin ich“ ist die etablierte, natürliche Entsprechung der Antwortformel הִנֶּנִּי. „Der antwortete“ verdeutlicht den Sprecherwechsel idiomatisch, ohne den Sinn zu verändern.
  terminology: Die Anredeformen und Personalbezüge sind konsequent und korrekt wiedergegeben. Es werden keine Namen oder theologischen Deutungen ergänzt. Eine Fußnote ist nicht erforderlich; die gewählte kontextuelle Wiedergabe von בוא ist im Deutschen verständlich und quellentreu.
