base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: de
  text: 'Als Rebekka berichtet wurde, was ihr älterer Sohn Esau gesagt hatte, ließ sie ihren jüngeren Sohn Jakob rufen und sagte zu ihm: »Pass auf! Dein Bruder Esau tröstet sich deinetwegen mit dem Gedanken, dich zu töten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד ... אֶת דִּבְרֵי עֵשָׂו
  choice: Als Rebekka berichtet wurde, was ... Esau gesagt hatte
  rationale: Gibt die unpersönliche Passivkonstruktion und דִּבְרֵי idiomatisch und präzise wieder.
- source_word: הַגָּדֹל / הַקָּטָן
  choice: älterer / jüngerer Sohn
  rationale: Im Zusammenhang bezeichnet das Wortpaar die relative Altersfolge der Brüder, nicht ihre Körpergröße.
- source_word: הִנֵּה
  choice: Pass auf!
  rationale: Markiert hier nachdrücklich eine dringende Warnung; die rein visuelle Wiedergabe »Sieh« wäre im Deutschen unnatürlich.
- source_word: מִתְנַחֵם לְךָ לְהָרְגֶךָ
  choice: tröstet sich deinetwegen mit dem Gedanken, dich zu töten
  rationale: Bewahrt das auffällige reflexive Verb »sich trösten« und macht zugleich den tödlichen Inhalt dieses Trostes verständlich, ohne ihn lediglich als festen Plan umzudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche und psychologisch zugespitzte Aussage, Esau tröste sich mit dem Gedanken an Jakobs Tötung, bleibt bewusst erhalten.
