source:
  edition: WLC
  text: וְ/עַתָּה֙ שָׂא נָ֣א כֵלֶ֔י/ךָ תֶּלְיְ/ךָ֖ וְ/קַשְׁתֶּ֑/ךָ וְ/צֵא֙ הַ/שָּׂדֶ֔ה וְ/צ֥וּדָ/ה לִּ֖/י צידה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: de
  text: Und nun nimm bitte deine Ausrüstung – deinen Köcher[a] und deinen Bogen –, geh hinaus aufs Feld und erjage mir Wild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete seltene hebräische Wort wird gewöhnlich als „Köcher“ verstanden; wörtlich bezeichnet es wohl etwas, das umgehängt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von וְ als auch den unmittelbaren Übergang zur folgenden Aufforderung natürlich wieder.
- source_word: שָׂא נָא
  choice: nimm bitte
  rationale: שָׂא bedeutet wörtlich „hebe auf/trage“, bezeichnet hier bei Ausrüstungsgegenständen aber idiomatisch das Mitnehmen; נָא wird als höfliche oder eindringliche Abmilderung mit „bitte“ wiedergegeben.
- source_word: כֵלֶיךָ
  choice: deine Ausrüstung
  rationale: כְּלִי ist ein Oberbegriff für Gerät, Gegenstand oder Waffe und wird anschließend durch Köcher und Bogen näher bestimmt.
- source_word: תֶּלְיְךָ
  choice: deinen Köcher
  rationale: Das seltene Substantiv bezeichnet im Zusammenhang mit dem Bogen am wahrscheinlichsten den Behälter für die Pfeile; die traditionelle Deutung wird wegen der lexikalischen Unsicherheit durch eine Fußnote kenntlich gemacht.
- source_word: וְקַשְׁתֶּךָ
  choice: und deinen Bogen
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Ausdrucks.
- source_word: וְצֵא הַשָּׂדֶה
  choice: geh hinaus aufs Feld
  rationale: Bewahrt das konkrete Bild des Hinausgehens in das unbebaute oder offene Land und klingt im Deutschen natürlich.
- source_word: וְצוּדָה לִּי צידה
  choice: und erjage mir Wild
  rationale: Das Verb bezeichnet das Jagen beziehungsweise Fangen; צידה meint hier die dabei gewonnene Jagdbeute. „Wild“ ist weniger spezifisch als „Wildbret“ und setzt keine bestimmte Tierart voraus.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Ausrüstung“ dient als natürlicher Oberbegriff; „erjage mir Wild“ hält den Jagdkontext knapp und konkret fest.
