base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: de
  text: Mögen Völker dir dienen und Nationen sich vor dir niederwerfen.[a] Sei Gebieter über deine Brüder,[b] und die Söhne deiner Mutter sollen sich vor dir niederwerfen. Wer dich verflucht, sei verflucht, und wer dich segnet, sei gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dir huldigen“. Das hebräische Verb bezeichnet das Niederwerfen vor einem Höhergestellten und kann sich je nach Zusammenhang auf einen Menschen oder auf Gott beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sei Herr über deine Brüder.“ „Gebieter“ verdeutlicht hier die menschliche Herrschaftsstellung und vermeidet eine Verwechslung mit „Herr“ als Gottesbezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: sollen dir dienen
  rationale: Das Qal von עבד mit Objektsuffix bezeichnet hier Dienst und Unterordnung. „Dir dienen“ bewahrt die Bedeutungsbreite, ohne den Ausdruck auf Erwerbsarbeit zu verengen.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural bezeichnet ethnische beziehungsweise politische Volksgruppen und bildet die erste Hälfte des poetischen Parallelismus.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: sollen sich vor dir niederwerfen
  rationale: Die Hitpael-Form bezeichnet eine körperliche Verneigung oder Prostration. Die Wiedergabe benennt die Handlung, ohne bei einem menschlichen Empfänger ausdrücklich Gottesverehrung anzunehmen.
- source_word: לְאֻמִּים
  choice: Nationen
  rationale: Das Wort steht poetisch parallel zu עַמִּים. „Nationen“ erhält die begriffliche Variation und bezeichnet größere Völkergruppen.
- source_word: הֱוֵה גְבִיר
  choice: Sei Gebieter
  rationale: הֱוֵה mit dem Prädikatsnomen גְבִיר formuliert einen Segenswunsch beziehungsweise Auftrag. „Gebieter“ bringt die Stellung der Überordnung zum Ausdruck und vermeidet hier die mögliche Verwechslung von „Herr“ mit einem Gottesnamen.
- source_word: לְאַחֶיךָ
  choice: über deine Brüder
  rationale: In Verbindung mit גְבִיר bezeichnet ל die Personen, denen gegenüber die Herrschaftsstellung gilt; idiomatisches Deutsch verlangt „über“.
- source_word: בְּנֵי אִמֶּךָ
  choice: die Söhne deiner Mutter
  rationale: Die konkrete hebräische Verwandtschaftsbezeichnung wird bewahrt und nicht zum allgemeineren „Verwandte“ abgeschwächt.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Wer dich verflucht, sei verflucht
  rationale: Die deutsche Singularform gibt die im Hebräischen kollektiv gebrauchte singularische Prädikatsform wieder und bewahrt den feierlichen Fluchstil.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: und wer dich segnet, sei gesegnet
  rationale: Die parallele Segensformel wird in derselben Struktur wie die vorausgehende Fluchformel wiedergegeben.
theological_decisions:
- issue: Huldigungsgebärde gegenüber einem Menschen
  choice: sich vor dir niederwerfen
  alternative: dir huldigen; dich anbeten
  rationale: Das hebräische Verb kann Niederwerfung vor Gott oder vor Menschen bezeichnen. Im Zusammenhang von Isaaks Segen steht menschliche politische und familiäre Überordnung im Vordergrund. Die konkrete Gebärde bleibt daher stehen, ohne sie als Gottesverehrung festzulegen.
- issue: Bezeichnung der Vorrangstellung unter den Brüdern
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: גְבִיר bezeichnet einen Menschen in einer Stellung der Herrschaft. „Gebieter“ wahrt diese Aussage, ohne durch „Herr“ unnötig an den göttlichen Titel denken zu lassen; eine Vergöttlichung des Gesegneten wird nicht in den Text hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch parallelem Satzbau. Die Wunsch- und Segenssprache wird durch „sollen“ und „sei“ erkennbar gemacht. Konkrete Verwandtschafts- und Körperbegriffe bleiben erhalten.
