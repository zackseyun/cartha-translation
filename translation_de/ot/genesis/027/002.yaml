  register: Modernes Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und natürlich; die hebräische Aufmerksamkeitsformel wird bewahrt, während »den Tag meines Todes« idiomatisch als temporaler Nebensatz wiedergegeben wird.
