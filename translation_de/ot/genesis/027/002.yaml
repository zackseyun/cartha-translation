  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: de
  text: 'Er sagte: »Sieh doch, ich bin alt geworden und weiß nicht, wann ich sterben werde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die folgende Feststellung; נָא mildert bzw. unterstreicht die Aufforderung. »Sieh doch« gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: זָקַנְתִּי
  choice: ich bin alt geworden
  rationale: Das hebräische Perfekt bezeichnet den eingetretenen Zustand des Altgewordenseins und wird entsprechend direkt wiedergegeben.
- source_word: לֹא יָדַעְתִּי יֹום מוֹתִי
  choice: ich weiß nicht, wann ich sterben werde
  rationale: Wörtlich steht »ich weiß nicht den Tag meines Todes«. Die idiomatische deutsche Wiedergabe bewahrt den Sinn, dass Isaak den Zeitpunkt seines Todes nicht kennt, ohne zu behaupten, der Tod stehe unmittelbar bevor.
theological_decisions: []
