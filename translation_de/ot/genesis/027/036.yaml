base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: de
  text: 'Er sagte[a]: »Heißt er nicht mit Recht Jakob? Nun hat er mich schon zweimal überlistet: Mein Erstgeburtsrecht hat er genommen, und jetzt hat er auch noch meinen Segen genommen!« Und er sagte: »Hast du keinen Segen für mich aufgespart?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen liegt ein Wortspiel zwischen dem Namen »Jakob« und dem hier mit »überlistet« wiedergegebenen Verb vor. Das Verb kann auch »hintergangen« oder »übervorteilt« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Heißt er nicht mit Recht Jakob?
  rationale: Die rhetorische Frage leitet Esaus bitteres Wortspiel mit dem Namen Jakob ein. Die Formulierung ist im Deutschen natürlich und bewahrt den Bezug auf die Namensgebung.
- source_word: וַיַּעְקְבֵנִי
  choice: Nun hat er mich ... überlistet
  rationale: Das Verb bezeichnet hier ein listiges Übervorteilen und bildet im Hebräischen ein Wortspiel mit יַעֲקֹב (Jakob). Da sich dieses Wortspiel im Deutschen nicht direkt nachbilden lässt, wird es in einer Fußnote erläutert.
- source_word: זֶה פַעֲמַיִם
  choice: schon zweimal
  rationale: Gibt die idiomatische Wendung knapp und mit dem vorwurfsvollen Nachdruck des Kontexts wieder.
- source_word: בְּכֹרָתִי
  choice: mein Erstgeburtsrecht
  rationale: Bezeichnet den rechtlichen und familiären Vorrang des Erstgeborenen; »Erstgeburtsrecht« ist die etablierte präzise Wiedergabe.
- source_word: וְהִנֵּה עַתָּה
  choice: und jetzt ... auch noch
  rationale: Überträgt die emotionale, hinweisende Kraft von הִנֵּה in heutiges, natürliches Deutsch, ohne das altertümliche »siehe« zu verwenden.
- source_word: לָקַח בִּרְכָתִי
  choice: hat er ... meinen Segen genommen
  rationale: Bewahrt die bewusste Wiederholung des einfachen Verbs לָקַח und den Zusammenhang zwischen Erstgeburtsrecht und Segen.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Hast du keinen Segen für mich aufgespart?
  rationale: אָצַל bezeichnet hier das Zurückbehalten oder Reservieren. Die deutsche Frage gibt Esaus flehende Hoffnung wieder, es könne noch ein Segen für ihn übrig sein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Esaus aufgewühlte Klage wird durch »schon«, »auch noch« und das Ausrufezeichen natürlich hörbar; das im Deutschen nicht reproduzierbare hebräische Wortspiel wird transparent in der Fußnote erklärt.
