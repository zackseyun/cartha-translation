  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: de
  text: Vielleicht wird mein Vater mich abtasten[a], und ich werde in seinen Augen wie ein Betrüger erscheinen[b] und einen Fluch über mich bringen und keinen Segen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich berühren“ oder „mich ertasten“. Das hebräische Verb bezeichnet ein prüfendes Ertasten mit der Hand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Spötter“ oder „wie ein Trickser“. Der hebräische Ausdruck kann jemanden bezeichnen, der andere irreführt oder zum Narren hält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Gibt Jakobs besorgte Vermutung natürlich wieder und bewahrt die Unsicherheit des hebräischen Ausdrucks.
- source_word: יְמֻשֵּׁנִי
  choice: betastet mich
  rationale: Das Verb משש bezeichnet das prüfende Berühren mit der Hand. „Betastet mich“ passt zu Isaaks körperlicher Überprüfung und ist im Deutschen präziser als das allgemeinere „berührt mich“.
- source_word: אָבִי
  choice: mein Vater
  rationale: Direkte und natürliche Wiedergabe der Possessivverbindung.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: und ich stehe in seinen Augen … da
  rationale: Bewahrt das hebräische Wahrnehmungsidiom weitgehend, klingt aber im modernen Deutschen natürlich und bezeichnet Isaaks Einschätzung Jakobs.
- source_word: כִּמְתַעְתֵּעַ
  choice: wie ein Betrüger
  rationale: Der Ausdruck kann einen irreführenden, täuschenden oder verspottenden Menschen bezeichnen. Im Zusammenhang mit Jakobs geplanter Identitätstäuschung trifft „Betrüger“ die wahrscheinlichste Bedeutung, ohne die lexikalischen Alternativen in der Fußnote zu verschweigen.
- source_word: וְהֵבֵאתִי עָלַי
  choice: Dann bringe ich … über mich
  rationale: Gibt die Hifil-Konstruktion mit עַל idiomatisch wieder. „Dann“ macht die im Zusammenhang erkennbare Folgebeziehung deutlich.
- source_word: קְלָלָה
  choice: einen Fluch
  rationale: Entspricht dem üblichen Sinn und bildet den ausdrücklichen Gegensatz zum erhofften Segen.
- source_word: וְלֹא בְרָכָה
  choice: und keinen Segen
  rationale: Bewahrt die knappe, direkte Gegenüberstellung des hebräischen Textes.
