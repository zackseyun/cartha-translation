  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: de
  text: bis sich der Zorn deines Bruders von dir abwendet und er vergisst, was du ihm getan hast. Dann werde ich jemanden schicken und dich von dort holen.[a] Warum sollte ich euch beide an einem Tag verlieren?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und dich von dort nehmen“. Gemeint ist, dass Rebekka jemanden senden und Jakob von dort holen lassen wird.'
    reason: lexical_alternative
  - marker: b
    text: Rebekka fürchtet, durch die Folgen des Konflikts beide Söhne zu verlieren. Der Text sagt nicht, dass dies auf dieselbe Weise geschehen müsste.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: bis sich der Zorn deines Bruders von dir abwendet
  rationale: שׁוב bedeutet grundsätzlich „umkehren/zurückkehren“, bezeichnet mit אַף („Zorn“) und מִן („von“) hier aber idiomatisch das Nachlassen beziehungsweise Sich-Abwenden des Zorns.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: und er vergisst, was du ihm getan hast
  rationale: Die Formulierung gibt den transparenten hebräischen Satzbau natürlich wieder, ohne die Art von Jakobs Tat zusätzlich auszudeuten.
- source_word: וְשָׁלַחְתִּי
  choice: Dann werde ich jemanden schicken
  rationale: Das Verb „schicken“ kann im Hebräischen ohne ausdrücklich genanntes Objekt stehen; im Deutschen macht „jemanden“ den gemeinten Boten natürlich verständlich. „Dann“ verdeutlicht die zeitliche Abfolge.
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: und dich von dort holen
  rationale: לקח heißt grundsätzlich „nehmen“. Zusammen mit „von dort“ bezeichnet es hier idiomatisch das Holen Jakobs; ein ausdrückliches „zurück“ wird nicht ergänzt.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Warum sollte ich euch beide an einem einzigen Tag verlieren?
  rationale: שׁכל bezeichnet den Verlust von Kindern beziehungsweise das Verwaist- oder Kinderloswerden. „Euch beide verlieren“ bewahrt den mütterlichen Bezug und klingt im modernen Deutschen natürlicher als „beider beraubt werden“.
theological_decisions:
- issue: Wie Rebekka beide Söhne verlieren könnte
  choice: Die Aussage bleibt allgemein und nennt keine bestimmte Abfolge oder Todesart.
  alternative: Die Worte ausdrücklich so erklären, dass Esau nach Jakobs Tötung hingerichtet oder anderweitig getötet würde.
  rationale: Der hebräische Text spricht lediglich davon, beide an einem Tag zu verlieren. Er legt nicht fest, dass beide auf dieselbe Weise sterben oder wie genau der doppelte Verlust eintreten würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz beginnt kleingeschrieben, weil der Vers syntaktisch an den vorhergehenden Vers anschließt. „An einem einzigen Tag“ gibt die Betonung von יוֹם אֶחָד wieder; „holen“ ist im Deutschen natürlicher als das formalere „nehmen“.
