  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: de
  text: Dann bring es deinem Vater, und er wird davon essen, damit er dich vor seinem Tod segnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Bring es dann
  rationale: Das Qal Perfekt 2. Person Maskulin Singular mit וְ setzt die Handlungsfolge fort und hat hier auffordernden Sinn. Der Imperativ mit „dann“ gibt diese sequenzielle Funktion im Deutschen natürlich wieder.
- source_word: לְאָבִיךָ
  choice: deinem Vater
  rationale: Direkte und dem würdevollen Erzählstil angemessene Wiedergabe von אָב mit Suffix der 2. Person Maskulin Singular.
- source_word: וְאָכָל
  choice: damit er davon isst
  rationale: Die Form bezeichnet in Rebekkas Plan die auf das Bringen folgende Handlung. Im Deutschen wird sie zusammen mit der anschließenden Zweckangabe natürlich in den damit-Satz einbezogen; „davon“ verdeutlicht idiomatisch den Bezug auf die zubereitete Speise.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: damit
  rationale: Die Verbindung leitet hier den Zweck des Bringens und Essens ein. „Damit“ gibt diese finale Bedeutung knapp und idiomatisch wieder.
- source_word: יְבָרֶכְךָ
  choice: dich … segnet
  rationale: Das Piel Imperfekt 3. Person Maskulin Singular mit Objektsuffix der 2. Person Maskulin Singular wird im patriarchalischen Segenskontext direkt mit „dich segnet“ wiedergegeben.
- source_word: לִפְנֵי מוֹתוֹ
  choice: vor seinem Tod
  rationale: Bewahrt die nominale Formulierung des Hebräischen und den feierlich-ernsten Ton der Szene.
