base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: de
  text: 'Auch er bereitete ein schmackhaftes Gericht zu und brachte es seinem Vater. Dann sagte er zu seinem Vater: »Mein Vater, richte dich auf und iss von dem Wildbret deines Sohnes, damit deine Seele[a] mich segnet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch »damit deine Seele mich segnet«; sinngemäß auch: »damit du mich segnest«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Auch er
  rationale: Bewahrt den additiven Nachdruck und stellt Esaus Handeln parallel zu Jakobs vorherigem Tun.
- source_word: מַטְעַמִּים
  choice: ein schmackhaftes Gericht
  rationale: Bezeichnet im Zusammenhang eine besonders zubereitete, wohlschmeckende Speise; der deutsche Singular ist hier natürlich und kann das hebräische Formplural kollektiv wiedergeben.
- source_word: וַיָּבֵא לְאָבִיו
  choice: brachte es seinem Vater
  rationale: Das im Hebräischen nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Zusammenhang ergänzt.
- source_word: יָקֻם אָבִי
  choice: Mein Vater, richte dich auf
  rationale: Der Jussiv formuliert eine ehrerbietige Aufforderung. Die Anrede in der dritten Person wird im Deutschen durch direkte Anrede natürlich wiedergegeben.
- source_word: מִצֵּיד בְּנוֹ
  choice: von dem Wildbret deines Sohnes
  rationale: צַיִד bezeichnet hier die Jagdbeute beziehungsweise das daraus zubereitete Fleisch; die Sohnesbezeichnung wird entsprechend der direkten Anrede mit »deines« wiedergegeben.
- source_word: בַּעֲבוּר
  choice: damit
  rationale: Gibt die Zweckbeziehung knapp und idiomatisch wieder.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: damit deine Seele mich segnet
  rationale: Bewahrt die ausdrückliche Nennung der נֶפֶשׁ und damit die feierliche, semitische Ausdrucksweise, statt sie stillschweigend zu »damit du mich segnest« zu glätten.
theological_decisions:
- issue: Bedeutung von נַפְשֶׁךָ beim Segnen
  choice: deine Seele mich segnet
  alternative: du mich segnest
  rationale: Die Wendung kann idiomatisch die ganze Person meinen, doch die wörtlichere Fassung erhält die genuine Ausdrucksweise und ihre mögliche Betonung des inneren Willens.
translation_notes:
  register: Moderne, würdige Standardsprache. »Wildbret« ist im Jagdkontext präzise und im Deutschen noch verständlich; »richte dich auf« wahrt den höflich-feierlichen Ton. Der einzige Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
