  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: de
  text: 'Da erzitterte Isaak über alle Maßen und sagte: „Wer war es denn, der Wild jagte und es mir brachte, und ich von allem aß, bevor du kamst, und ihn segnete? Ja, er wird gesegnet sein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: erbebte ... in überaus heftigem Zittern
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv verstärkt Isaaks körperlich-emotionale Erschütterung. Die deutsche Formulierung bewahrt die auffällige Wiederholung, ohne den Ausdruck auf bloße Angst festzulegen.
- source_word: מִי אֵפוֹא הוּא
  choice: Wer war es denn
  rationale: „Denn“ gibt die folgernde und zugleich nachdrückliche Nuance von אֵפוֹא natürlich wieder; das Präteritum passt zum rückblickenden Erzählzusammenhang.
- source_word: הַצָּד צַיִד
  choice: der Wild jagte
  rationale: „Wild“ bezeichnet das Jagdgut ohne die sachlich zu enge Festlegung auf Wildbret oder eine bestimmte Tierart.
- source_word: וַיָּבֵא לִי
  choice: und es mir brachte
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen aus dem zuvor genannten Wild ergänzt.
- source_word: וָאֹכַל מִכֹּל
  choice: sodass ich von allem aß
  rationale: „Von allem“ erhält den partitiven Sinn von מִן; „sodass“ verbindet das Bringen idiomatisch mit dem anschließenden Essen, während die Handlungsfolge erhalten bleibt.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: bevor du kamst
  rationale: Eine direkte und natürliche Wiedergabe der temporalen Aussage.
- source_word: וָאֲבָרֲכֵהוּ
  choice: und ihn segnete
  rationale: Das Subjekt „ich“ ist aus dem vorausgehenden Teilsatz eindeutig und kann im koordinierten deutschen Satz natürlich unausgesprochen bleiben.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Ja, gesegnet wird er auch bleiben
  rationale: Die Formulierung gibt גַּם als nachdrückliche Bestätigung wieder und lässt den zukünftigen beziehungsweise fortgeltenden Sinn von יִהְיֶה erkennen.
theological_decisions:
- issue: Geltung des bereits ausgesprochenen Segens
  choice: Isaak bestätigt nachdrücklich, dass der Gesegnete gesegnet bleiben wird.
  alternative: 'Isaak stellt lediglich fest: „Auch wird er gesegnet sein.“'
  rationale: Die betonte Wortstellung und גַּם tragen eine bekräftigende Aussage. „Bleiben“ macht die Fortgeltung des ausgesprochenen Segens deutlich, ohne eine weitergehende Lehre über die Wirkweise patriarchaler Segnungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Intensivierung durch Verb und stammverwandtes Substantiv wird bewusst bewahrt; ansonsten folgt der Satz einer verständlichen deutschen Erzählsyntax.
