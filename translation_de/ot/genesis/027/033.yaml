  - severity: medium
    issue: „gesegnet wird er auch bleiben“
    rationale: „Bleiben“ expliziert Fortdauer. Der hebräische Ausdruck גַּם בָּרוּךְ יִהְיֶה sagt wörtlich, dass er (auch/ja) gesegnet sein wird; die Fortgeltung kann aus dem Kontext folgen, sollte aber nicht als eigenes Verb in den Text eingetragen werden.
  - severity: low
    issue: „in überaus heftigem Zittern“
    rationale: Die beabsichtigte Wiedergabe der hebräischen Intensivierung ist verständlich, aber die deutsche Fügung ist schwerfällig und nicht idiomatisch.
