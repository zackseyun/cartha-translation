  to: 'Da erzitterte Isaak über alle Maßen und sagte: „Wer war es denn, der Wild jagte und es mir brachte, und ich von allem aß, bevor du kamst, und ihn segnete? Ja, er wird gesegnet sein.“'
  rationale: Die Revision wahrt die starke Intensivierung von חרד ... חרדה גדולה עד מאד in idiomatischem modernem Deutsch, stellt die parataktische Handlungsfolge wieder her und vermeidet mit „bleiben“ eine über den hebräischen Wortlaut hinausgehende Explizierung. Die Wiedergabe von גַּם als bekräftigendes „Ja“ bleibt möglich und wahrt die Satzfunktion ohne konfessionelle Deutung.
