base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: de
  text: 'Da trat Jakob zu seinem Vater Isaak. Der betastete ihn und sagte: »Die Stimme ist Jakobs Stimme, aber die Hände sind Esaus Hände.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat … zu
  rationale: Das Qal von נגשׁ bezeichnet das Herantreten. Die Formulierung gibt die erzählerische Bewegung im Deutschen natürlich und knapp wieder.
- source_word: וַיְמֻשֵּׁהוּ
  choice: betastete ihn
  rationale: מושׁ bezeichnet hier Isaaks gezielte Prüfung durch Berührung. „Betasten“ drückt diese untersuchende Handlung genauer aus als das allgemeinere „berühren“.
- source_word: הַקֹּל
  choice: Die Stimme
  rationale: קוֹל kann „Stimme“ oder „Laut/Klang“ bedeuten; hier wird die Person anhand ihrer Sprechstimme erkannt, daher ist „Stimme“ sachlich und idiomatisch.
- source_word: קוֹל יַעֲקֹב
  choice: Jakobs Stimme
  rationale: Die hebräische Status-constructus-Verbindung wird mit dem natürlichen deutschen Genitiv wiedergegeben; die Wiederholung von „Stimme“ bleibt zur Wahrung der rhetorischen Form erhalten.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: aber die Hände sind Esaus Hände
  rationale: Das einfache וְ verbindet hier zwei gegensätzliche Wahrnehmungen. „Aber“ macht den im Kontext klaren Kontrast natürlich sichtbar, während die markante Wiederholung von „Hände“ erhalten bleibt.
- source_word: אָבִיו
  choice: seinem Vater
  rationale: Die ausdrücklich genannte familiäre Beziehung wird beibehalten und idiomatisch auf Jakob bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählfolge und die rhetorische Wiederholung der hebräischen Nominalsätze werden bewahrt; der im Kontext adversative Sinn des Waw wird mit „aber“ wiedergegeben.
