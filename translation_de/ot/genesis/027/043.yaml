base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: de
  text: 'Und nun, mein Sohn, hör auf mich: Steh auf und flieh zu meinem Bruder Laban nach Haran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Der vorangestellte Diskursmarker leitet unmittelbar die dringende Anweisung ein; „Und nun“ bildet sowohl die Konjunktion als auch das Zeitadverb natürlich ab.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Bewahrt die familiäre und geschlechtsspezifische Anrede Rebekkas an Jakob.
- source_word: שְׁמַע בְּקֹלִי
  choice: hör auf mich
  rationale: Die hebräische Wendung bedeutet wörtlich „höre auf meine Stimme“, hat hier aber den natürlichen Sinn einer Aufforderung, auf die Sprecherin zu hören und ihrer Weisung zu folgen. „Hör auf mich“ bewahrt im Deutschen diese Spannung, ohne ausdrücklich „gehorche“ zu sagen.
- source_word: וְקוּם
  choice: Steh auf
  rationale: Gibt den Imperativ von קום in natürlichem, gegenwärtigem Deutsch wieder und erhält die Abfolge der Befehle.
- source_word: בְּרַח לְךָ
  choice: flieh
  rationale: ברח bezeichnet die Flucht. Das לְךָ muss im Deutschen nicht eigens wiedergegeben werden, da „flieh“ die dringende, auf Jakob bezogene Bewegung vollständig ausdrückt.
- source_word: אֶל לָבָן אָחִי
  choice: zu meinem Bruder Laban
  rationale: Bewahrt die appositionelle Beziehung und klingt im Deutschen natürlich.
- source_word: חָרָנָה
  choice: nach Haran
  rationale: Das lokale He bezeichnet die Richtung auf Haran hin; bei Städtenamen ist „nach Haran“ die natürliche deutsche Wiedergabe.
