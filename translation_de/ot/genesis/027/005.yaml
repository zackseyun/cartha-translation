source:
  edition: WLC
  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: de
  text: Rebekka hörte zu, als Isaak zu seinem Sohn Esau sprach.[a] Esau ging aufs Feld, um Wild zu jagen und es mitzubringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Rebekka hörte, wie Isaak zu seinem Sohn Esau sprach.“ Das hebräische Partizip hebt das andauernde Hören während des Gesprächs hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um Wild zu jagen, um es zu bringen“. Die beiden hebräischen Infinitive können im Deutschen sinngemäß als zusammengehörige Zwecke wiedergegeben werden.'
    reason: syntax_alternative
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Rebekka
  rationale: Das einleitende וְ führt die Erzählung weiter. Im Deutschen ist dafür hier kein ausdrückliches „Und“ nötig.
- source_word: שֹׁמַעַת
  choice: hörte zu
  rationale: Das Partizip beschreibt Rebekkas andauerndes Hören während Isaaks Rede. „Hörte zu“ gibt diesen Hintergrundvorgang natürlich wieder, ohne ausdrücklich heimliches Lauschen zu unterstellen.
- source_word: בְּ/דַבֵּר
  choice: als … sprach
  rationale: בְּ mit dem Infinitivus constructus bezeichnet hier eine gleichzeitig stattfindende Handlung.
- source_word: אֶל עֵשָׂו בְּנוֹ
  choice: zu seinem Sohn Esau
  rationale: אֶל bezeichnet die Richtung der Rede; die deutsche Wortstellung identifiziert Esau eindeutig als Isaaks Sohn.
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: Esau ging aufs Feld
  rationale: Die schlichte Erzählform von הלך wird mit „ging“ wiedergegeben; שׂדה bezeichnet hier das Feld beziehungsweise das offene Land.
- source_word: לָ/צוּד צַיִד
  choice: um Wild zu jagen
  rationale: צוד bezeichnet das Jagen, ציד das gejagte Wild beziehungsweise die Jagdbeute. „Wild“ vermeidet die unbelegte Einschränkung auf eine bestimmte Tierart.
- source_word: לְ/הָבִיא
  choice: und herzubringen
  rationale: Der zweite Infinitiv drückt den Zweck aus, das erjagte Wild zu Isaak zu bringen. „Herzubringen“ macht die im Zusammenhang vorausgesetzte Richtung idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung vermeidet sowohl das altertümliche „Jagdbeute erlegen“ als auch eine Deutung als ausdrücklich heimliches Belauschen.
