base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: de
  text: 'Da sagte Jakob zu seinem Vater: »Ich bin Esau, dein Erstgeborener. Ich habe getan, was du mir gesagt hast. Steh bitte auf, setz dich und iss von meinem Wildbret, damit du mich segnest.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »damit deine Seele mich segnet«. Das hebräische Wort für »Seele« beziehungsweise »Selbst« bezeichnet hier idiomatisch die Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt den Fortgang in natürlichem deutschem Erzählstil wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Ich bin Esau, dein Erstgeborener
  rationale: Die verblos formulierte Identifikation und die Apposition werden direkt wiedergegeben; Jakobs Täuschung wird weder abgeschwächt noch erklärt.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Ich habe getan, was du mir gesagt hast
  rationale: Die Formulierung ist natürliches modernes Deutsch und bewahrt den Bezug auf Isaaks vorherigen Auftrag.
- source_word: קוּם נָא שְׁבָה
  choice: Steh bitte auf, setz dich
  rationale: „Bitte“ gibt die höflich-bittende Partikel נָא wieder. Die beiden Imperative bleiben als auffällige Abfolge erhalten, werden aber idiomatisch formuliert.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: und iss von meinem Wildbret
  rationale: צַיִד bezeichnet hier die als Speise zubereitete Jagdbeute. „Wildbret“ ist im Kontext präziser als das mehrdeutige „Wild“.
- source_word: בַּעֲבוּר
  choice: damit
  rationale: Die Konjunktion gibt den Zweck der Aufforderung knapp und idiomatisch wieder.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: damit du mich segnest
  rationale: נֶפֶשׁ bezeichnet in dieser Wendung idiomatisch die Person selbst. Eine wörtliche Wiedergabe mit „Seele“ könnte im Deutschen eine eigenständige anthropologische Aussage nahelegen; die Fußnote dokumentiert die Form des Hebräischen.
theological_decisions:
- issue: Wiedergabe von נַפְשֶׁךָ in תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: 'idiomatisch: „damit du mich segnest“'
  alternative: „damit deine Seele mich segnet“ oder „damit du selbst mich segnest“
  rationale: „Seele“ ist hier keine lehrhafte Aussage über einen vom Menschen unterscheidbaren Seelenteil, sondern eine hebräische Bezeichnung für die Person beziehungsweise das Selbst. Die idiomatische Wiedergabe vermeidet eine sachfremde Festlegung; die wörtliche Form wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Wildbret“ ist kontextuell präzise und trotz seines leicht gehobenen Tons allgemein verständlich. Die ungewöhnliche Befehlsfolge „Steh … auf, setz dich“ bleibt entsprechend dem Hebräischen sichtbar.
