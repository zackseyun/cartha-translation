  terminology: „Erstgeborener“, „segnest“ und „Wildbret“ sind terminologisch passend. Der Fußnotentext erklärt „Seele“/„Selbst“ angemessen als idiomatische Personenbezeichnung. Der Fußnotenanker steht korrekt unmittelbar bei der betreffenden Wiedergabe „mich segnest“.
