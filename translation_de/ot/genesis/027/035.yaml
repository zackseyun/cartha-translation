  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: de
  text: 'Er sagte: „Dein Bruder kam mit List[a] und nahm deinen Segen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Täuschung“ oder „auf betrügerische Weise“. Im Hebräischen steht ein Substantiv („List“, „Täuschung“) mit einer Präposition; die Wendung kann sowohl die Art und Weise als auch das Mittel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Die Wayyiqtol-Form von אמר führt Isaaks Antwort im fortlaufenden Erzählzusammenhang ein; im modernen Deutschen ist die unverbundene Wiedergabe natürlich.
- source_word: בָּא
  choice: ist gekommen
  rationale: Das Qal-Perfekt bezeichnet hier das bereits vollendete Kommen Jakobs; das deutsche Perfekt passt natürlich zu Isaaks unmittelbarer Erklärung der vorausgegangenen Handlung.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die Verwandtschaftsbezeichnung mit Suffix wird direkt wiedergegeben und bewahrt ihre rhetorische Wirkung, statt Jakob namentlich zu nennen.
- source_word: בְּמִרְמָה
  choice: mit List
  rationale: Die Präposition ב mit dem Substantiv מִרְמָה bezeichnet die Art und Weise beziehungsweise das Mittel. „Mit List“ bewahrt die substantivische Form und klingt im Deutschen natürlich.
- source_word: וַיִּקַּח
  choice: und hat dir … weggenommen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Mit Dativ und „wegnehmen“ wird im Deutschen idiomatisch ausgedrückt, dass Jakob den für Esau bestimmten Segen an sich nahm, ohne eine gewaltsame Handlung zu unterstellen.
- source_word: בִּרְכָתֶךָ
  choice: deinen Segen
  rationale: Die Form bezeichnet unmittelbar „deinen Segen“, also den Esau zugedachten väterlichen Segen.
theological_decisions: []
