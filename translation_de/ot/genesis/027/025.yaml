  text: וַ/יֹּ֗אמֶר הַגִּ֤שָׁ/ה לִּ/י֙ וְ/אֹֽכְלָה֙ מִ/צֵּ֣יד בְּנִ֔/י לְמַ֥עַן תְּבָֽרֶכְ/ךָ֖ נַפְשִׁ֑/י וַ/יַּגֶּשׁ ל/וֹ֙ וַ/יֹּאכַ֔ל וַ/יָּ֧בֵא ל֦/וֹ יַ֖יִן וַ/יֵּֽשְׁתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: de
  text: 'Und er sagte: „Bring es mir; ich will von dem Wildbret meines Sohnes essen, damit meine Seele dich segne[a].“ Da brachte er es ihm, und er aß. Dann brachte er ihm Wein, und er trank.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „damit ich dich segne“. Hebräisch: „damit meine Seele dich segne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: Bring es zu mir
  rationale: Der Hifil-Imperativ von נגשׁ bezeichnet das Heranbringen oder Darreichen. „Bring es zu mir“ ist im Deutschen natürlich und bewahrt die konkrete Bewegung; das im Hebräischen unausgesprochene Objekt ergibt sich aus dem Zusammenhang.
- source_word: וְאֹכְלָה
  choice: damit ich … esse
  rationale: Der Kohortativ drückt Absicht oder Wunsch aus. Im Zusammenhang mit dem Imperativ gibt „damit ich … esse“ diese Zielrichtung im Deutschen idiomatisch wieder.
- source_word: מִצֵּיד בְּנִי
  choice: von dem Wildbret meines Sohnes
  rationale: צַיִד bezeichnet erjagtes Wild beziehungsweise dessen Fleisch; „Wildbret“ trifft im Kontext die zubereitete Jagdbeute. מִן wird partitiv mit „von“ wiedergegeben.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion kennzeichnet den Zweck. Das deutsche „damit“ gibt diese Funktion klar und knapp wieder.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: meine Seele dich segne
  rationale: Die ausdrückliche Wendung mit נֶפֶשׁ als Subjekt wird bewahrt, da sie die feierliche, persönliche Kraft des hebräischen Ausdrucks trägt; eine idiomatischere Alternative steht in der Fußnote.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: Da brachte er es zu ihm
  rationale: Die Wiedergabe nimmt den Wortlaut des vorausgehenden Befehls wieder auf und wahrt dadurch die erzählerische Wiederholung des Verbs נגשׁ.
- source_word: יַיִן
  choice: Wein
  rationale: Dies ist die direkte und kontextuell eindeutige Wiedergabe von יַיִן.
- source_word: וַיֵּשְׁתְּ
  choice: und er trank
  rationale: Der einfache Erzählfortschritt des Wayyiqtol von שׁתה wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Die Wendung „meine Seele dich segne“
  choice: Die wörtliche Subjektkonstruktion bleibt im Haupttext erhalten.
  alternative: „damit ich dich segne“
  rationale: Das Hebräische nennt ausdrücklich „meine Seele“ als Subjekt. Diese anthropologische und feierliche Ausdrucksweise soll nicht stillschweigend zu einem bloßen „ich“ eingeebnet werden; die idiomatische Deutung wird als Alternative ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wildbret“ ist hier präziser als das mehrdeutige „Wild“, bleibt aber allgemein verständlich. Die leicht ungewohnte Wendung „meine Seele dich segne“ bewahrt bewusst das hebräische Idiom; die Fußnote bietet die geläufigere deutsche Form.
