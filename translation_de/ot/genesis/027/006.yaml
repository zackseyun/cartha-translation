  terminology: Die Namensformen Rebekka, Jakob und Esau entsprechen dem üblichen deutschen Bibelgebrauch. Die expliziten Verwandtschaftsbezeichnungen „ihrem Sohn“ und „deinem Bruder“ bewahren die hebräischen Appositionen. Es sind keine theologischen Fachbegriffe oder strittigen Deutungen betroffen.
