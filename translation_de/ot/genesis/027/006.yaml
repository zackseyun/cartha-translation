  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: de
  text: 'Und Rebekka sagte zu ihrem Sohn Jakob: „Sieh, ich habe gehört, wie dein Vater zu deinem Bruder Esau sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Und Rebekka
  rationale: Das einfache „Und“ bewahrt den hebräischen Erzählfluss, ohne eine genauere zeitliche Abfolge hineinzulesen; der Name folgt der im Deutschen üblichen Form.
- source_word: אָֽמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: sagte zu ihrem Sohn Jakob
  rationale: Die appositionale Bestimmung „ihr Sohn“ bleibt erhalten; die deutsche Wortstellung klingt natürlich und macht die Beziehung eindeutig.
- source_word: לֵאמֹר
  choice: Doppelpunkt und öffnendes Anführungszeichen
  rationale: Das erste לֵאמֹר leitet direkte Rede ein und wird im Deutschen idiomatisch durch Zeichensetzung wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ erhält die aufmerksamkeitslenkende Funktion, ohne die Bedeutung ausdrücklich auf das Hören zu verengen; „Siehe“ wäre im heutigen Deutsch unnötig altertümlich.
- source_word: שָׁמַעְתִּי
  choice: ich habe gehört
  rationale: Das Perfekt entspricht in direkter, gegenwartsnaher Rede dem natürlichen modernen Deutsch und gibt die abgeschlossene Wahrnehmung wieder.
- source_word: אֶת אָבִיךָ מְדַבֵּר
  choice: wie dein Vater … sprach
  rationale: Die Konstruktion mit „wie“ gibt das Wahrnehmen der laufenden Sprechhandlung idiomatisch wieder. Das finite „sprach“ vermeidet im Deutschen eine schwerfällige Partizipialkonstruktion.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: zu deinem Bruder Esau
  rationale: „Zu“ bewahrt die Redeausrichtung von אֶל; „dein Bruder“ bleibt als appositionale Identifizierung ausdrücklich erhalten.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Das zweite לֵאמֹר kündigt den in Vers 7 folgenden Wortlaut an. Ein Doppelpunkt ist dafür im Deutschen natürlicher als das redundante „indem er sagte“.
theological_decisions: []
translation_notes:
