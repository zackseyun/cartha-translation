  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen wieder: die erzählerische Konjunktion, Rebekkas Anrede an Jakob als ihren Sohn, das aufmerksamkeitslenkende הִנֵּה, das abgeschlossene Hören sowie die an Esau gerichtete, noch nicht vollständig zitierte Rede. Die offene Konstruktion mit abschließendem Doppelpunkt bildet das zweite לֵאמֹר und den Übergang zu Vers 7 angemessen ab.'
