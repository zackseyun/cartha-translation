base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: de
  text: Da ging er, nahm sie und brachte sie seiner Mutter. Seine Mutter bereitete leckere Speisen zu, wie sein Vater sie liebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging er hin
  rationale: Die fortlaufende Erzählform führt die Handlung weiter; „Da“ gibt die zeitliche Folge im modernen Deutschen natürlich wieder.
- source_word: וַיִּקַּח
  choice: holte sie
  rationale: Das Objekt ist aus dem vorherigen Vers erschließbar (die Ziegenböckchen). Im Deutschen fasst „holte“ das Gehen und Nehmen idiomatisch zusammen, ohne den Handlungsablauf zu verändern.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: und brachte sie seiner Mutter
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang ergänzt; לְ wird beim Verb „bringen“ natürlich mit dem Dativ wiedergegeben.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: Seine Mutter bereitete daraus … zu
  rationale: עשה bedeutet allgemein „machen/tun“; bei Speisen ist „zubereiten“ die natürliche deutsche Entsprechung. „daraus“ verdeutlicht knapp den Bezug auf die gebrachten Tiere.
- source_word: מַטְעַמִּים
  choice: ein schmackhaftes Gericht
  rationale: Das Wort bezeichnet wohlschmeckende, besonders zubereitete Speise. „Ein schmackhaftes Gericht“ ist gegenwärtig, verständlich und würdevoll; der hebräische Plural kann kollektiv auf die Speise bezogen sein.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: wie sein Vater es liebte
  rationale: „liebte“ bildet אהב unmittelbar ab, während das Pronomen „es“ im Deutschen den Rückbezug auf das Gericht natürlich ausdrückt.
theological_decisions: []
translation_notes:
  register: Moderne standarddeutsche Erzählsprache mit würdigem, leicht verständlichem Ton. Die Satzfolge bleibt eng am hebräischen Handlungsablauf; kontextuell vorausgesetzte Objekte werden nur dort ergänzt, wo das Deutsche sie benötigt.
