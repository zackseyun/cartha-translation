base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: de
  text: Dann gab sie Jakob, ihrem Sohn, die schmackhaften Speisen und das Brot, die sie zubereitet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand Jakobs, ihres Sohnes«; gemeint ist, dass sie es ihm unmittelbar übergab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Dann gab sie
  rationale: Das Narrativ-Waw führt die Handlung weiter. נתן bedeutet hier im Zusammenhang mit בְּיַד, dass sie Jakob die Speisen und das Brot unmittelbar übergab.
- source_word: הַמַּטְעַמִּים
  choice: die schmackhaften Speisen
  rationale: Der Plural bezeichnet besonders zubereitete, wohlschmeckende Speisen. Diese Wiedergabe ist modern und legt nicht unnötig fest, dass es sich ausschließlich um Fleisch handelt.
- source_word: הַלֶּחֶם
  choice: das Brot
  rationale: Direkte und natürliche Wiedergabe von לֶחֶם im Kontext.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: das sie zubereitet hatte
  rationale: Das Plusquamperfekt verdeutlicht die bereits abgeschlossene Zubereitung; »zubereitet« passt im Deutschen sowohl zu den Speisen als auch zum Brot natürlicher als »gemacht«.
- source_word: בְּיַד
  choice: gab sie Jakob
  rationale: Die hebräische Wendung lautet wörtlich »in die Hand« und bezeichnet hier die unmittelbare Übergabe. Im deutschen Haupttext wird sie idiomatisch wiedergegeben; die konkrete Form bleibt in der Fußnote sichtbar.
- source_word: יַעֲקֹב בְּנָהּ
  choice: Jakob, ihrem Sohn
  rationale: Bewahrt die hebräische Reihenfolge des Namens mit nachgestellter Verwandtschaftsangabe und klingt zugleich in modernem Deutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext gibt die Übergabe idiomatisch wieder; die Fußnote bewahrt das anschauliche hebräische Körperbild.
