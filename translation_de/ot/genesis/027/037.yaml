  text: וַ/יַּ֨עַן יִצְחָ֜ק וַ/יֹּ֣אמֶר לְ/עֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥י/ו לָ/ךְ֙ וְ/אֶת כָּל אֶחָ֗י/ו נָתַ֤תִּי ל/וֹ֙ לַ/עֲבָדִ֔ים וְ/דָגָ֥ן וְ/תִירֹ֖שׁ סְמַכְתִּ֑י/ו וּ/לְ/כָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: de
  text: 'Isaak antwortete Esau: „Sieh, ich habe ihn zum Herrn über dich gemacht und ihm alle seine Brüder als Diener[a] gegeben. Mit Getreide und jungem Wein habe ich ihn versorgt.[b] Was kann ich da noch für dich tun,[c] mein Sohn?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Sklaven“. Das hebräische Wort kann je nach Zusammenhang Diener oder Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mit Getreide und jungem Wein habe ich ihn gestützt/erhalten.“ Das hebräische Verb kann sowohl Unterstützung als auch Versorgung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Und für dich nun – was kann ich tun?“'
    reason: source_structure
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete
  rationale: Die feste hebräische Erzählformel leitet eine Erwiderung ein; im Deutschen gibt „antwortete“ den Sinn natürlich wieder, ohne das redundante „antwortete und sagte“ nachzubilden.
- source_word: הֵן
  choice: Sieh
  rationale: Bewahrt den hervorhebenden und aufmerksamkeitslenkenden Charakter der Interjektion in moderner, nicht altertümlicher Sprache.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: ich habe ihn zum Herrn über dich gemacht
  rationale: Die Konstruktion bezeichnet die Einsetzung in eine übergeordnete Stellung. „Herr über dich“ bewahrt die persönliche Herrschaftsbeziehung, ohne einen göttlichen Titel zu unterstellen.
- source_word: כָּל אֶחָיו
  choice: alle seine Brüder
  rationale: Gibt die konkrete Verwandtschaftsbezeichnung wörtlich wieder; eine Erweiterung zu „Verwandten“ ist nicht nötig.
- source_word: לַעֲבָדִים
  choice: als Diener
  rationale: עבד kann je nach sozialem Kontext Diener oder Sklave bezeichnen. Im Haupttext vermeidet „Diener“ eine unnötige Festlegung; die stärkere Alternative wird in der Fußnote bewahrt.
- source_word: דָגָן וְתִירֹשׁ
  choice: Getreide und junger Wein
  rationale: דגן bezeichnet Getreideertrag; תירוש bezeichnet frischen beziehungsweise neuen Wein als landwirtschaftliches Erzeugnis.
- source_word: סְמַכְתִּיו
  choice: habe ich ihn versorgt
  rationale: סמך bedeutet grundlegend „stützen, erhalten“; zusammen mit Getreide und jungem Wein liegt die konkrete Versorgung mit Lebensmitteln nahe, ohne dass die Grundbedeutung ausgeschlossen wird.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Was kann ich da noch für dich tun
  rationale: „Da noch“ gibt die folgernde Rückwendung zu Esau idiomatisch wieder; „kann“ bringt die im Kontext ausgedrückte begrenzte Möglichkeit zur Geltung.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die direkte familiäre Anrede bleibt schlicht und mit ihrem emotionalen Gewicht erhalten.
theological_decisions:
- issue: Unwiderruflichkeit beziehungsweise verbleibende Wirksamkeit des bereits ausgesprochenen Segens
  choice: 'Die rhetorische Frage bleibt als Frage stehen: „Was kann ich da noch für dich tun?“'
  alternative: Eine ausdrückliche Aussage wie „Ich kann nichts mehr für dich tun“
  rationale: Der hebräische Text deutet Isaaks begrenzte Möglichkeit rhetorisch an, formuliert aber keine systematische Lehre über die Natur oder Unwiderruflichkeit des Segens. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte hebräische Redeformel wurde idiomatisch zu „antwortete“ verdichtet. „Sieh“ erhält den Nachdruck von הֵן ohne das altertümliche „Siehe“. Sämtliche Fußnotenmarker stehen unmittelbar an der einschlägigen Stelle im Haupttext.
