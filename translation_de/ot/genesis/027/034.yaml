    rationale: Das Hebräische verwendet sowohl das Verb »schreien« als auch das Substantiv »Schrei«. Die revidierte Formulierung erhält diese Hervorhebung, ohne ein unidiomatisches »einen Schrei schreien« zu erzeugen.
  - severity: low
    issue: Die Nachstellung von »über alle Maßen« ist stilistisch schwerfällig.
    rationale: Die Intensivierung עַד מְאֹד bezieht sich auf den großen und bitteren Schrei und ist vor dem Substantiv im Deutschen klarer und natürlicher angeschlossen.
