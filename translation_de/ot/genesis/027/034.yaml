  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: de
  text: 'Als Esau die Worte seines Vaters hörte, stieß er einen überaus lauten und bitteren Schrei aus und sagte zu seinem Vater: »Segne auch mich, mein Vater!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Als … hörte
  rationale: Der Infinitivus constructus mit כִּי bezeichnet hier den zeitlichen Umstand. »Als« gibt die Abfolge natürlich wieder, ohne besondere Unmittelbarkeit hinzuzufügen.
- source_word: דִּבְרֵי אָבִיו
  choice: die Worte seines Vaters
  rationale: Die Wiedergabe bewahrt den konkreten lexikalischen Sinn von דָּבָר und einen würdigen, gut verständlichen Stil.
- source_word: וַיִּצְעַק צְעָקָה
  choice: schrie … auf
  rationale: Die deutsche Verbfügung gibt den heftigen Ausbruch natürlich wieder. Eine formale Nachbildung als »schrie einen Schrei« wäre im modernen Deutsch schwerfällig.
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: laut und bitter … über alle Maßen
  rationale: »Laut« drückt im Zusammenhang die Größe des Schreis idiomatisch aus, »bitter« bewahrt die emotionale Qualität, und »über alle Maßen« erhält die starke Intensivierung von עַד מְאֹד.
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: Segne auch mich
  rationale: Die knappe Bitte bewahrt Imperativ, Personalsuffix und den durch גַם אָנִי hervorgehobenen Anspruch Esaus, ebenfalls gesegnet zu werden.
- source_word: אָבִי
  choice: mein Vater
  rationale: Das ausdrückliche Possessivsuffix und die eindringliche persönliche Anrede bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die emotionale Wucht wird idiomatisch vermittelt, ohne die Bitte auszudeuten oder die Spannung der Segenshandlung theologisch aufzulösen.
