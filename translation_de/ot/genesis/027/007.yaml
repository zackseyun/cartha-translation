source:
  edition: WLC
  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: de
  text: »Bring mir Wild und bereite mir schmackhafte Speisen[a] zu, damit ich davon esse und dich vor Jahwe segne, bevor ich sterbe.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Leckerbissen«. Das hebräische Wort bezeichnet besonders schmackhaft zubereitete Speisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאָה לִּי
  choice: Bring mir
  rationale: Der Hifil-Imperativ von בוא fordert dazu auf, etwas zum Sprecher zu bringen. »Bring mir« ist im Deutschen knapp und natürlich.
- source_word: צַיִד
  choice: Wildbret
  rationale: Das Wort bezeichnet Jagdbeute beziehungsweise erlegtes Wild. »Wildbret« trifft im Zusammenhang die zur Speise bestimmte Jagdbeute, ohne sie auf eine bestimmte Tierart einzugrenzen.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: und bereite mir ein schmackhaftes Essen zu
  rationale: עשה bezeichnet hier das Zubereiten, מַטְעַמִּים besonders wohlschmeckende, zubereitete Speisen. Die deutsche Formulierung ist verständlich und gibt den kulinarischen Zusammenhang wieder.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: damit ich esse und dich … segne
  rationale: Die beiden Kohortative drücken die beabsichtigte Folge der Aufforderung aus. »Damit« bewahrt diese Zielrichtung und verbindet beide Handlungen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet »vor« beziehungsweise »in der Gegenwart von«; יְהוָה ist der Gottesname JHWH, hier als »Jahwe« wiedergegeben.
- source_word: לִפְנֵי מוֹתִי
  choice: bevor ich sterbe
  rationale: Die wörtlich nominale Wendung »vor meinem Tod« wird idiomatisch als temporaler Nebensatz wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« macht den Namen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Segnung auf die Gegenwart JHWHs
  choice: dich vor Jahwe segne
  alternative: dich im Angesicht Jahwes segne
  rationale: Die knappe Wendung wahrt die Aussage, dass der Segen vor beziehungsweise in der Gegenwart JHWHs erteilt wird, ohne die theologische Bedeutung weiter auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache in direkter Rede. »Wildbret« ist ein präziser, im Jagd- und Speisekontext weiterhin verständlicher Ausdruck; die Satzstruktur bewahrt die zielgerichtete Folge von Essen und Segen.
