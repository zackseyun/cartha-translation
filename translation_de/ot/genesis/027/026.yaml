lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition mit Pronominalsuffix bezeichnet den Adressaten der Rede.
- source_word: יִצְחָק אָבִיו
  choice: sein Vater Isaak
  rationale: Die hebräische Apposition wird in natürlicher deutscher Wortstellung bewahrt und hebt zugleich die familiäre Beziehung hervor.
- source_word: גְּשָׁה נָּא
  choice: Komm doch näher
  rationale: נגשׁ bezeichnet das körperliche Herantreten; נָא mildert die Aufforderung ab. „doch“ vermittelt diese höflich-bittende Nuance idiomatisch.
- source_word: וּשְׁקָה לִּי
  choice: und küss mich
  rationale: Die Verbindung aus Verb und לִי wird im Deutschen natürlich mit einem direkten Objekt wiedergegeben.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Anrede wird wörtlich bewahrt und erhält den familiären Ton.
