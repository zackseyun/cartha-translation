  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: de
  text: Geh bitte zur Herde und hol mir von dort zwei gute junge Ziegen. Ich werde daraus für deinen Vater schmackhafte Speisen[a] zubereiten, wie er sie liebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leckerbissen“ oder „schmackhafte Gerichte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Geh bitte
  rationale: Der Imperativ לֶךְ wird durch נָא höflich beziehungsweise eindringlich abgemildert; „Geh bitte“ gibt dies in natürlichem Deutsch wieder.
- source_word: הַצֹּאן
  choice: zur Herde
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Herde“ ist hier natürlich und bleibt weit genug, bevor die Ziegen ausdrücklich genannt werden.
- source_word: וְקַח לִי מִשָּׁם
  choice: und hol mir von dort
  rationale: לקח bedeutet grundsätzlich „nehmen/holen“. Im Zusammenhang soll Jakob die Tiere aus der Herde beschaffen; „hol mir“ ist idiomatisch, ohne unnötige Einzelheiten hinzuzufügen.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: zwei Ziegenböckchen
  rationale: Die Wendung bezeichnet zwei junge Ziegen. „Ziegenböckchen“ gibt Tierart und junges Alter knapp und verständlich wieder, ohne das Geschlecht über „Böckchen“ hinaus stärker zu betonen, als es der gebräuchliche deutsche Tiername tut.
- source_word: טֹבִים
  choice: gute
  rationale: טֹבִים beschreibt hier die Qualität beziehungsweise Eignung der Tiere. „Gute“ ist die schlichte, quellennähere Entsprechung.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Ich werde daraus … ein schmackhaftes Gericht zubereiten
  rationale: מַטְעַמִּים bezeichnet wohlschmeckende Speisen oder Leckerbissen. Der deutsche Singular „ein schmackhaftes Gericht“ ist in diesem Zusammenhang natürlich; „daraus“ gibt den Bezug von אֹתָם auf die Tiere wieder.
- source_word: לְאָבִיךָ
  choice: für deinen Vater
  rationale: Die Form bezeichnet eindeutig „für deinen Vater“ und wahrt den angemessenen Erzählton.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: wie er es liebt
  rationale: Die Formulierung bleibt dem hebräischen „wie er liebt“ nahe. Das ergänzte „es“ stellt im Deutschen den Rückbezug auf das Gericht natürlich her.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höflich-eindringliche Nuance von נָא bleibt durch „bitte“ erhalten; die kulinarische Wendung wird idiomatisch wiedergegeben.
