base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: de
  text: Du wirst von deinem Schwert leben, und deinem Bruder wirst du dienen. Doch wenn du dich losreißt,[a] wirst du sein Joch von deinem Nacken abwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du unruhig wirst“. Das hebräische Verb ist in seiner Bedeutung unsicher. Der Zusammenhang mit dem Abwerfen des Jochs spricht für „dich losreißt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Von deinem Schwert wirst du leben
  rationale: עַל bezeichnet hier idiomatisch das Mittel beziehungsweise die Lebensgrundlage. Die konkrete Schwertmetapher und die Zukunftsaussage bleiben erhalten.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: und deinem Bruder wirst du dienen
  rationale: Das Qal von עבד bedeutet gewöhnlich „dienen“. Die Formulierung bewahrt die direkte Aussage, ohne die genaue politische Gestalt der Unterordnung näher festzulegen.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Doch wenn
  rationale: Die Wendung leitet einen künftigen Umstand und zugleich eine inhaltliche Wende ein; „Doch wenn“ gibt beides knapp und natürlich wieder.
- source_word: תָּרִיד
  choice: du dich losreißt
  rationale: Das schwierige Verb wird im unmittelbaren Zusammenhang mit dem Abwerfen eines Jochs als gewaltsames Sichbefreien verstanden. Die mögliche Bedeutung „unruhig werden“ wird in der Fußnote bewahrt.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: wirst du sein Joch ... brechen
  rationale: פרק bezeichnet ein gewaltsames Abbrechen oder Abwerfen. „Joch“ erhält das konkrete Bild für Herrschaft und Dienstbarkeit.
- source_word: מֵעַל צַוָּארֶךָ
  choice: von deinem Nacken
  rationale: Die natürliche deutsche Fügung bewahrt das anschauliche Bild, ohne das hebräische מֵעַל unidiomatisch nachzuahmen.
theological_decisions:
- issue: Art von Esaus künftigem Verhältnis zu Jakob
  choice: Die Aussage als Unterordnung unter den Bruder mit späterer Befreiung von dessen Herrschaft wiedergeben.
  alternative: Die Dienstbarkeit als dauerhaft deuten oder lediglich als familiäre Rücksichtnahme abschwächen.
  rationale: Der hebräische Text spricht sowohl vom Dienst als auch vom späteren Brechen des Jochs. Diese Spannung bleibt bestehen, ohne weitergehende Aussagen über Edom oder eine bestimmte Lehre in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Zukunftsstil des Spruchs bleibt erhalten; konkrete Bilder wie „Schwert“, „Joch“ und „Nacken“ werden nicht verallgemeinert.
