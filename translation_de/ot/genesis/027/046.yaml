source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: de
  text: 'Da sagte Rebekka zu Isaak: »Ich bin meines Lebens überdrüssig wegen der Töchter Hets.[a] Wenn Jakob eine Frau von den Töchtern Hets nimmt, eine wie diese, von den Töchtern des Landes – was soll mir dann noch das Leben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen der Hetiterinnen«; wörtlich: »wegen der Töchter Hets«.'
    reason: Lexikalische Alternative zur ethnischen Bezeichnung.
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Ich bin meines Lebens überdrüssig
  rationale: Die feste deutsche Wendung gibt die durch קוץ ausgedrückte tiefe Lebensmüdigkeit und Abneigung würdig und mit angemessener Stärke wieder.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund und wird im modernen Deutsch natürlich mit »wegen« wiedergegeben.
- source_word: בְּנוֹת חֵת
  choice: die Töchter Hets
  rationale: Die wörtliche Abstammungsbezeichnung bewahrt sowohl den Namen Het als auch die familiär-ethnische Ausdrucksweise des Hebräischen.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Wenn Jakob eine Frau … nimmt
  rationale: Die Formulierung bleibt nahe an der hebräischen Heiratswendung und ist im Zusammenhang verständlich.
- source_word: כָּאֵלֶּה
  choice: eine wie diese
  rationale: Die singularische Formulierung bezieht sich natürlich auf die zuvor genannte »Frau«, während der demonstrative Bezug auf die bereits bekannten Frauen erhalten bleibt.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: von den Töchtern des Landes
  rationale: Die wörtliche Wiedergabe erhält die Parallelität zu »Töchtern Hets« sowie den sozialen und geografischen Gegensatz.
- source_word: לָמָּה לִּי חַיִּים
  choice: was soll mir dann noch das Leben?
  rationale: Diese idiomatische rhetorische Frage wahrt den Sinn, dass das Leben unter dieser Bedingung für Rebekka keinen Wert mehr hätte, ohne sie als direkten Todeswunsch zu formulieren.
theological_decisions:
- issue: Ethnische Bezeichnung חֵת
  choice: »Töchter Hets« im Haupttext
  alternative: »Hetiterinnen« bzw. »Töchter der Hetiter«
  rationale: Die Hauptfassung bewahrt den hebräischen Eigennamen und die Abstammungsformel; die geläufige ethnische Deutung wird in der Fußnote genannt.
- issue: Rhetorische Schlussfrage
  choice: »was soll mir dann noch das Leben?«
  alternative: »was ist mir das Leben?« / »wozu sollte ich noch leben?«
  rationale: Die gewählte Fassung vermittelt die existenzielle Klage natürlich, ohne die knappe hebräische Frage zu einem ausdrücklichen Todeswunsch zu verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Meines Lebens überdrüssig« ist bewusst gehoben, aber allgemein verständlich; der Gedankenstrich trägt die zugespitzte Schlussfrage.
