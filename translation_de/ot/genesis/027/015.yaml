source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: de
  text: Dann nahm Rebekka die kostbaren Kleider ihres älteren Sohnes Esau[a], die bei ihr im Haus waren[b], und zog sie ihrem jüngeren Sohn Jakob an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die besten Kleider ihres älteren Sohnes Esau“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die sie im Haus hatte“; wörtlicher lautet das Hebräische: „die bei ihr im Haus waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Dann nahm
  rationale: Das waw consecutivum führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: בִּגְדֵי עֵשָׂו ... הַחֲמֻדֹת
  choice: die kostbaren Kleider ... Esaus
  rationale: בִּגְדֵי bezeichnet Kleidungsstücke; הַחֲמֻדֹת beschreibt sie als begehrt, wertvoll oder besonders geschätzt. „Kostbar“ bewahrt diesen Sinn, ohne ausdrücklich zu behaupten, es seien seine besten Kleider gewesen.
- source_word: בְּנוֹ הַגָּדֹל
  choice: ihres älteren Sohnes
  rationale: גָּדוֹל bezeichnet hier im Gegensatz zu קָטָן das Altersverhältnis der Brüder, nicht Körpergröße oder Bedeutung.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: die bei ihr im Haus waren
  rationale: Die Formulierung folgt der hebräischen Orts- beziehungsweise Besitzangabe eng und vermeidet den zusätzlichen Gedanken, Rebekka habe die Kleider dort eigens aufbewahrt.
- source_word: וַתַּלְבֵּשׁ
  choice: zog sie ... an
  rationale: Das Verb bedeutet, jemanden zu bekleiden. Mit den zuvor genannten Kleidern als Bezug ist „zog sie ihm an“ im Deutschen idiomatisch.
- source_word: בְּנוֹ הַקָּטָן
  choice: ihrem jüngeren Sohn
  rationale: קָטָן bezeichnet im familiären Gegensatz zu Esau den jüngeren Sohn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Satzstellung macht die Zugehörigkeit der Kleider zu Esau deutlich und bewahrt zugleich die wörtliche Ortsangabe „bei ihr im Haus“.
