lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Die Diskursmarkierung leitet Rebekkas unmittelbar folgende Anweisung ein. „Nun“ klingt im heutigen Deutsch natürlich; das vorangestellte וְ kann hier stilistisch mit aufgenommen werden, ohne eigens als „und“ zu erscheinen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Anrede mit Suffix der 1. Person Singular wird direkt und natürlich wiedergegeben.
- source_word: שְׁמַע בְּקֹלִי
  choice: hör auf meine Stimme
  rationale: Die konkrete hebräische Wendung bleibt erhalten. „Auf jemandes Stimme hören“ bezeichnet im Deutschen wie im Hebräischen nicht nur akustisches Hören, sondern aufmerksames Beachten; „gehorche mir“ würde diese Bedeutung stärker festlegen.
- source_word: לַאֲשֶׁר
  choice: ': auf das, was'
  rationale: 'Der Doppelpunkt gibt die erläuternde Beziehung wieder: Der folgende Befehl konkretisiert, worauf Jakob hören soll. Dadurch bleibt die hebräische Konstruktion erkennbar, ohne unnatürliches Deutsch zu erzeugen.'
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: ich dir befehle
  rationale: צוה wird mit dem kräftigen „befehlen“ wiedergegeben. Das Partizip bezeichnet die gegenwärtige, unmittelbar folgende Anweisung; im Deutschen drückt das Präsens dies idiomatisch aus.
theological_decisions:
- issue: Bedeutungsumfang von שׁמע
  choice: „hör auf meine Stimme“
  alternative: „gehorche mir“
  rationale: Gehorsam ist im Zusammenhang mitgemeint, doch die Übersetzung bewahrt das Bild der Stimme und vermeidet eine stärkere Festlegung als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die erläuternde Fortführung verständlich; die konkrete Rede von der „Stimme“ bleibt als hebräisches Sprachbild erhalten.
