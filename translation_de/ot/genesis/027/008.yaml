  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: de
  text: Nun[a], mein Sohn, hör auf mich und tu, was ich dir befehle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
