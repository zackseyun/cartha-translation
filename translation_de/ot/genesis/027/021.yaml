    issue: Die Fußnotenalternative „lass dich von mir betasten“ gibt die Handlungsperspektive verschoben wieder.
    rationale: Das hebräische וַאֲמֻשְׁךָ hat Isaak als handelndes Subjekt („und lass mich dich betasten“ bzw. „und ich werde dich betasten“). „Lass dich ... betasten“ richtet sich dagegen als Aufforderung zur Duldung an Jakob und ist daher keine präzise koordinierende Alternative.
