base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: de
  text: 'Da sagte Isaak zu Jakob: „Komm doch näher, damit ich dich betasten kann[a], mein Sohn, um festzustellen, ob du wirklich mein Sohn Esau bist oder nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Komm doch näher und lass mich dich betasten, mein Sohn.“'
    reason: Das mit וַ angeschlossene Verb kann neben der hier gewählten Zweckbeziehung auch als koordinierte Aufforderung wiedergegeben werden; diese Fassung bewahrt Isaak als handelndes Subjekt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Isaak
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: גְּשָׁה נָּא
  choice: Komm doch näher
  rationale: Der Imperativ bedeutet „nähere dich“; נָא mildert die Aufforderung ab. Das deutsche Modalwort „doch“ vermittelt hier die höflich-drängende Nuance idiomatisch.
- source_word: וַאֲמֻשְׁךָ
  choice: damit ich dich betasten kann
  rationale: מושׁ bezeichnet das tastende Berühren oder Befühlen. Im Zusammenhang prüft Isaak Jakobs Identität durch Berührung; „betasten“ drückt diese gezielte Prüfung präziser aus als das allgemeinere „berühren“.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die direkte Anrede mit Suffix der ersten Person Singular wird bewahrt und erhält den familiären Ton.
- source_word: הַאַתָּה זֶה
  choice: ob du wirklich … bist
  rationale: Die hebräische Frageform bringt Isaaks Zweifel an der Identität zum Ausdruck. „wirklich“ gibt die prüfende Zuspitzung natürlich wieder, ohne die Unsicherheit aufzulösen.
- source_word: בְּנִי עֵשָׂו
  choice: mein Sohn Esau
  rationale: Die Apposition wird im Deutschen natürlich als „mein Sohn Esau“ wiedergegeben.
- source_word: אִם לֹא
  choice: oder nicht
  rationale: Die Wendung schließt die alternative Frage ab und entspricht idiomatisch dem deutschen „oder nicht“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. „Betasten“ wahrt die konkrete körperliche Prüfung der Identität; „um festzustellen“ macht den im Zusammenhang klaren Zweck im Deutschen syntaktisch verständlich.
