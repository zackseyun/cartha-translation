base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: de
  text: Bereite mir ein schmackhaftes Essen zu[a], wie ich es gern habe, und bring es mir, damit ich davon esse und meine Seele dich segnen kann[b], bevor ich sterbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine köstliche Speise“ beziehungsweise „Leckerbissen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „meine Seele dich segnet“. Gemeint ist Isaak selbst in seinem ganzen persönlichen Sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: Bereite mir ein schmackhaftes Essen zu
  rationale: עשה ist allgemein „machen/tun“, bezeichnet hier aber im Zusammenhang mit Speisen deren Zubereitung. מַטְעַמִּים meint wohlschmeckende, besonders zubereitete Speisen; der deutsche Singular als Sammelbegriff klingt natürlich.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: wie ich es liebe
  rationale: Die Formulierung bewahrt das starke Verb „lieben“ und gibt Isaaks persönliche Vorliebe direkt wieder.
- source_word: וְהָבִיאָה לִּי
  choice: und bring es mir
  rationale: Die feminine Singularform des Verbs nimmt den als Einheit aufgefassten Speisebegriff auf; im Deutschen entspricht dem das Pronomen „es“.
- source_word: וְאֹכֵלָה
  choice: damit ich esse
  rationale: Der Kohortativ drückt Isaaks beabsichtigtes Essen aus. „Damit ich esse“ verbindet diese Absicht natürlich mit der Aufforderung, das Essen zu bringen.
- source_word: בַּעֲבוּר תְּבָרֶכְךָ נַפְשִׁי
  choice: und meine Seele dich segnet
  rationale: בַּעֲבוּר leitet den übergeordneten Zweck ein. Nach dem ersten „damit“ vermeidet die koordinierte Fortführung eine schwerfällige doppelte Zweckkonstruktion, während „meine Seele“ die ausdrückliche Subjektangabe נַפְשִׁי bewahrt.
- source_word: בְּטֶרֶם אָמוּת
  choice: bevor ich sterbe
  rationale: Die temporale Wendung wird im Deutschen direkt und idiomatisch mit einem finiten Nebensatz wiedergegeben.
theological_decisions:
- issue: Bedeutung von נַפְשִׁי in der Segensformel
  choice: meine Seele dich segnet
  alternative: ich dich segne
  rationale: Der hebräische Text nennt נַפְשִׁי ausdrücklich als Subjekt. Die wörtlichere Wiedergabe erhält die feierliche Aussage und ihre mögliche Ganz-person-Bedeutung, ohne sie auf eine bestimmte Anthropologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt quellennah, wird aber durch eine natürliche deutsche Zweckkonstruktion geglättet. Das markante „meine Seele“ bleibt im Haupttext erhalten.
