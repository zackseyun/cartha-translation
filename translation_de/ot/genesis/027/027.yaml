base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: de
  text: 'Da trat er näher und küsste ihn. Er roch den Duft seiner Kleider, segnete ihn und sagte: »Sieh, der Duft meines Sohnes ist wie der Duft eines Feldes, das Jahwe gesegnet hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Da trat er näher
  rationale: Die Wegform führt die Erzählung fort und bezeichnet eine Bewegung auf jemanden zu. »Da« gibt die Abfolge im Deutschen natürlich wieder.
- source_word: וַיִּשַּׁק לוֹ
  choice: und küsste ihn
  rationale: Gibt die Handlung ohne eine im Hebräischen nicht ausdrücklich genannte emotionale Wertung wieder.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Als er den Duft seiner Kleider roch
  rationale: »Den Duft … roch« bildet Verb und Substantiv des hebräischen Ausdrucks ab, klingt aber im Deutschen natürlicher als »den Geruch roch«. »Als« macht den engen zeitlichen Zusammenhang mit dem anschließenden Segen deutlich, ohne zusätzliche Ursache ausdrücklich zu behaupten.
- source_word: בְּגָדָיו
  choice: seiner Kleider
  rationale: Bewahrt den konkreten Plural und passt zum gehobenen, aber allgemein verständlichen Erzählton.
- source_word: וַיְבָרֲכֵהוּ
  choice: segnete er ihn
  rationale: Direkte Wiedergabe des Verbs ברך mit Objektsuffix.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt die Aufmerksamkeit auf die folgende Aussage; »Sieh« ist gegenwärtiges, würdiges Deutsch.
- source_word: רֵיחַ בְּנִי / כְּרֵיחַ שָׂדֶה
  choice: der Duft meines Sohnes / wie der Duft eines Feldes
  rationale: Die Wiederholung von רֵיחַ wird als »Duft« beibehalten. Im Zusammenhang mit Kleidern und einem gesegneten Feld bezeichnet »Duft« den angenehmen Geruch idiomatisch.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: das Jahwe gesegnet hat
  rationale: Der Relativsatz und die vollendete, in ihrer Wirkung fortbestehende Segnung werden direkt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. »Jahwe« bewahrt diese sprachliche Form, statt sie durch den traditionellen Ersatztitel zu verdecken.
- issue: Verhältnis zwischen dem Geruch der Kleider und dem Segen
  choice: zeitlicher Zusammenhang durch »Als«
  alternative: kausale Verbindung, etwa »weil er den Duft roch«
  rationale: Der Text berichtet Wahrnehmung und Segen in Folge, bezeichnet den Duft aber nicht ausdrücklich als Ursache des Segens. Die Übersetzung vermeidet deshalb eine stärkere kausale Festlegung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die dreifache Wiederaufnahme von רֵיחַ wird durch »Duft« bewahrt; unnötig altertümliche Formen und erklärende Zusätze werden vermieden.
