  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Beziehungen des Hebräischen zutreffend wieder: Isaaks Segnung Jakobs ist abgeschlossen, Jakob ist eben erst aus Isaaks Gegenwart fortgegangen, und Esau kehrt von der Jagd zurück. Die doppelte Hervorhebung durch „kaum“ verschiebt jedoch den Fokus: Das hebräische אַךְ יָצֹא יָצָא betont ausdrücklich Jakobs eben erfolgtes Hinausgehen, während כַּאֲשֶׁר zunächst neutral temporal einleitet.'
  naturalness: Die Folge „Kaum hatte …, und kaum war …, da …“ ist im modernen Standarddeutsch unnötig schwerfällig und syntaktisch nicht idiomatisch. Eine Konstruktion mit „als“ und Plusquamperfekt bildet die zeitliche Staffelung klar und natürlich ab.
  terminology: „Isaak“, „Jakob“, „Esau“, „sein Bruder“ und „von der Jagd zurück“ sind angemessen. „aus der Gegenwart seines Vaters Isaak“ gibt מֵאֵת פְּנֵי יִצְחָק אָבִיו präziser wieder als die bisherige verkürzte Fassung und bleibt zugleich natürlich.
