  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְ/בָרֵ֣ךְ אֶֽת יַעֲקֹב֒ וַ/יְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵ/אֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑י/ו וְ/עֵשָׂ֣ו אָחִ֔י/ו בָּ֖א מִ/צֵּידֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: de
  text: 'Und es geschah, als Isaak Jakob gesegnet hatte und Jakob gerade erst aus der Gegenwart seines Vaters Isaak hinausgegangen war: Da kam sein Bruder Esau von der Jagd zurück.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verstärkt „hinausgehen“ durch die Verbindung eines absoluten Infinitivs mit der finiten Verbform („hinausgehend war Jakob hinausgegangen“) und betont damit, dass Jakob eben erst fortgegangen war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Und es geschah ... da
  rationale: Die wiederholte hebräische Erzählungsform wird in natürlichem Deutsch durch eine einleitende Ereignisformel und das korrelative „da“ wiedergegeben.
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: Kaum hatte ... gesegnet
  rationale: כלה mit Infinitiv bezeichnet den Abschluss der Handlung; „kaum hatte“ bringt zugleich die äußerst enge zeitliche Abfolge zum Ausdruck.
- source_word: אַךְ יָצֹא יָצָא
  choice: kaum war ... hinausgegangen
  rationale: אַךְ zusammen mit dem Infinitivus absolutus und der finiten Form von יצא betont, dass Jakob eben erst hinausgegangen war.
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  choice: von seinem Vater Isaak
  rationale: Im Deutschen bezeichnet „von jemandem hinausgehen“ die Entfernung aus dessen unmittelbarer Gegenwart natürlich; „vor dem Angesicht“ wäre hier unnötig wörtlich und altertümlich.
- source_word: וְעֵשָׂו אָחִיו
  choice: sein Bruder Esau
  rationale: Die ausdrücklich genannte Bruderschaft bleibt erhalten und verstärkt die erzählerische Spannung.
- source_word: בָּא מִצֵּידוֹ
  choice: kam ... von der Jagd zurück
  rationale: ציד kann Jagd oder Jagdbeute bezeichnen. Mit בוא und מן liegt hier die Rückkehr von der Jagdtätigkeit nahe; „zurück“ macht die Bewegungsrichtung im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Konstruktion mit „kaum ... und kaum ... da“ bewahrt die auffällige Unmittelbarkeit und rasche Ereignisfolge des Hebräischen, ohne dessen Syntax mechanisch nachzubilden.
