  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: de
  text: Gott gebe dir vom Tau des Himmels[a] und von der Fruchtbarkeit der Erde, dazu Getreide und neuen Wein in Fülle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „etwas vom Tau des Himmels und etwas vom Reichtum der Erde“. Das Hebräische verwendet Bilder für Fruchtbarkeit und landwirtschaftliche Fülle.'
    reason: Lexikalische Alternative und Bewahrung der möglichen partitiven Bedeutung von מִן sowie des wörtlichen Bildes der „Fettigkeit“ des Landes.
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Gott gebe dir
  rationale: Der Präfixverbform mit ו kommt im Segenskontext Wunsch- bzw. Segenskraft zu. Der deutsche Konjunktiv I gibt diese feierliche Benediktion natürlich und knapp wieder.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Die Form mit Artikel bezeichnet hier idiomatisch den einen Gott; „der Gott“ wäre im Deutschen unnötig markiert.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: vom Tau des Himmels
  rationale: „Vom“ bewahrt die durch מִן ausgedrückte Herkunfts- bzw. Teilhabevorstellung, ohne das im Hebräischen nicht eigens stehende „etwas“ festzuschreiben. „Des Himmels“ erhält die hebräische Genitivfügung.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: und von der Fruchtbarkeit der Erde
  rationale: Das wörtliche Bild der „Fettigkeit“ bezeichnet bei Land die ergiebige, lebensspendende Fülle. „Fruchtbarkeit“ vermittelt diesen landwirtschaftlichen Sinn in heutigem Deutsch.
- source_word: וְרֹב
  choice: in Fülle
  rationale: רֹב bezeichnet große Menge oder Überfluss. Die nachgestellte Wendung „in Fülle“ bezieht sich natürlich auf beide folgenden Erzeugnisse und passt zum gehobenen Segensstil.
- source_word: דָּגָן
  choice: Getreide
  rationale: דָּגָן ist die allgemeine Bezeichnung für Getreideerzeugnisse; „Getreide“ ist im modernen Deutsch eindeutig.
- source_word: וְתִירֹשׁ
  choice: und jungen Wein
  rationale: תִּירוֹשׁ bezeichnet neuen bzw. jungen Wein als Erzeugnis der Ernte und wird so von allgemeineren Bezeichnungen für Wein unterschieden.
theological_decisions:
- issue: Art des Ausspruchs
  choice: 'Segenswunsch: „Gott gebe dir“'
  alternative: 'Zukunftsaussage: „Gott wird dir geben“'
  rationale: Verbform und Kontext sprechen für einen vollzogenen Segensspruch, nicht lediglich für eine sachliche Vorhersage. Der Konjunktiv bewahrt diese Funktion, ohne zusätzliche Aussagen über ihre Wirkungsweise einzutragen.
- issue: Bedeutung von מִן in den beiden Segensgaben
  choice: Offen als „vom/von der“ wiedergegeben
  alternative: 'Ausdrücklich partitativ: „etwas vom Tau … etwas von der Fruchtbarkeit“'
  rationale: מִן kann hier partitiv verstanden werden, kann aber zugleich die Quelle bezeichnen. Die deutsche Formulierung bewahrt beide Nuancen und vermeidet eine unbegründete Einschränkung der Gabe.
translation_notes:
  register: Gehobenes, aber leicht verständliches modernes Standarddeutsch. Der knappe Konjunktiv „gebe“ wahrt den feierlichen Segenscharakter; traditionelle Agrarbilder bleiben erkennbar, während die im Deutschen missverständliche wörtliche „Fettigkeit der Erde“ im Haupttext sinngemäß wiedergegeben wird.
