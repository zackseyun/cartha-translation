base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: de
  text: 'Da sagte seine Mutter zu ihm: „Dein Fluch komme über mich, mein Sohn! Hör nur auf mich[a], geh und hol sie mir[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hör auf meine Stimme“; die hebräische Wendung kann auch „Gehorche mir“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Das im Hebräischen unausgesprochene Objekt ergibt sich aus dem vorigen Vers: Gemeint sind die jungen Ziegenböcke.'
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: Da sagte seine Mutter zu ihm
  rationale: Die einfache deutsche Erzählform gibt das Wayyiqtol von אמר wieder; die familiäre Bezeichnung und das indirekte Objekt bleiben ausdrücklich erhalten.
- source_word: עָלַי קִלְלָתְךָ
  choice: Dein Fluch komme über mich
  rationale: Die deutsche Wunschform gibt die knappe, verblose hebräische Aussage natürlich wieder und bewahrt sowohl den Possessivbezug als auch die Vorstellung, dass Rebekka die Folge auf sich nimmt.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Bewahrt die Anrede mit dem Suffix der ersten Person und ihren familiären Nachdruck.
- source_word: אַךְ
  choice: nur
  rationale: 'אַךְ wirkt hier einschränkend und nachdrücklich: Jakob soll ungeachtet seiner Sorge ihrer Weisung folgen.'
- source_word: שְׁמַע בְּקֹלִי
  choice: Hör auf meine Stimme
  rationale: Die Wendung bildet das hebräische Bild transparent ab und kann im Deutschen zugleich die Bedeutung des Gehorchens anklingen lassen.
- source_word: וְלֵךְ קַח לִי
  choice: geh und hol sie mir
  rationale: Die Befehlsfolge wird idiomatisch wiedergegeben. Das im Hebräischen nicht ausgedrückte Objekt wird aus Vers 9 ergänzt und meint die jungen Ziegenböcke.
theological_decisions:
- issue: Art und Tragweite von Rebekkas Übernahme des Fluchs
  choice: Dein Fluch komme über mich
  alternative: Ich nehme deinen Fluch auf mich
  rationale: Die gewählte Fassung legt nicht fest, ob Rebekka rechtlich, stellvertretend oder lediglich rhetorisch für einen möglichen Fluch einsteht, sondern bewahrt die knappe und spannungsreiche Formulierung des Hebräischen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; die hebräische Bildsprache wird bewahrt, wo sie auf Deutsch verständlich ist.
