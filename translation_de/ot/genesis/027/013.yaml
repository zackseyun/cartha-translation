  source_fidelity: 'Der Entwurf gibt die Syntax und Aussage des Hebräischen zuverlässig wieder: Rebekka nimmt den möglichen Fluch auf sich, redet Jakob als „mein Sohn“ an, schränkt seine Aufgabe mit אַךְ ein und befiehlt ihm, die im vorherigen Vers genannten Ziegenböcke zu holen. „Dein Fluch komme über mich“ bewahrt die knappe, rhetorisch nachdrückliche hebräische Nominalsatzform, ohne die Tragweite theologisch zu präzisieren.'
  naturalness: „Hör auf meine Stimme“ ist als bewusst biblisch geprägte Wendung verständlich, wirkt im modernen Standarddeutsch aber deutlich weniger natürlich als „Hör auf mich“. Da die wörtliche Form und die mögliche Gehorsamsnuance in einer Fußnote erhalten werden können, ist die idiomatischere Form im Haupttext vorzuziehen. Die übrige Formulierung ist klar und angemessen erzählerisch.
  terminology: „Fluch“, „mein Sohn“ und „junge Ziegenböcke“ sind sachgerecht. Die Ergänzung „sie“ ist aus dem Kontext eindeutig und nötig für flüssiges Deutsch. Die Fußnote zur Stimme sollte auf die wörtliche hebräische Form bezogen sein, nicht eine im Haupttext bereits stehende deutsche Form als „wörtlich“ ausgeben.
