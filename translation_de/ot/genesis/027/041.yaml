base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: de
  text: Und Esau hegte Feindschaft gegen Jakob wegen des Segens, mit dem sein Vater ihn gesegnet hatte.[a] Esau dachte bei sich:[b] »Die Tage der Trauer um meinen Vater rücken näher.[c] Dann werde ich meinen Bruder Jakob töten.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Esau hasste Jakob.“ Das hebräische Verb bezeichnet anhaltende Feindseligkeit, nicht nur ein vorübergehendes Gefühl.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Esau sagte in seinem Herzen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Die Tage der Trauer meines Vaters rücken näher.“ Das Hebräische kann sowohl die Trauer um Isaak nach seinem Tod als auch eine Trauerzeit Isaaks selbst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: hegte Feindschaft gegen
  rationale: Das Verb שׂטם bezeichnet anhaltende Feindseligkeit, nicht nur ein vorübergehendes Gefühl. „Hegte Feindschaft“ gibt diesen fortdauernden Charakter im Deutschen wieder.
- source_word: עַל הַבְּרָכָה
  choice: wegen des Segens
  rationale: עַל bezeichnet hier den Grund oder Anlass von Esaus Feindschaft; „wegen“ ist natürlich und präzise.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: mit dem sein Vater ihn gesegnet hatte
  rationale: Die Wiedergabe bewahrt die Wiederholung von „Segen/segnen“ und macht deutlich, dass der zuvor Jakob erteilte Segen gemeint ist.
- source_word: בְּלִבּוֹ
  choice: dachte bei sich
  rationale: Die hebräische Wendung bedeutet wörtlich „sagte in seinem Herzen“ und bezeichnet inneres Reden. „Dachte bei sich“ ist im modernen Deutschen idiomatisch; die wörtliche Form wird in einer Fußnote genannt.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Die Tage der Trauer um meinen Vater rücken näher
  rationale: Diese Deutung versteht die Wortverbindung als die Trauerzeit nach Isaaks erwartetem Tod. Die grammatisch mögliche Alternative, dass von der Trauer des Vaters die Rede ist, bleibt in der Fußnote erhalten.
- source_word: וְאַהַרְגָה
  choice: Dann werde ich … töten
  rationale: Die Form drückt Esaus entschlossenen Vorsatz aus. „Dann“ gibt die im Zusammenhang naheliegende zeitliche Folge wieder, ohne das Vorhaben abzuschwächen.
- source_word: אָחִי
  choice: meinen Bruder
  rationale: Das ausdrücklich gesetzte Verwandtschaftsverhältnis wird bewahrt und unterstreicht den innerfamiliären Charakter der angekündigten Gewalt.
theological_decisions:
- issue: Bezug von אֵבֶל אָבִי
  choice: Trauer um meinen Vater
  alternative: Trauer meines Vaters
  rationale: Der Kontext legt nahe, dass Esau auf Isaaks Tod und die anschließende Trauerzeit wartet. Da die hebräische Konstruktion auch Isaaks eigene Trauer bezeichnen kann, wird diese echte Mehrdeutigkeit ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Segen/segnen“ sowie die familiäre Bezeichnung „Bruder“ bleiben erhalten. Idiomatisches inneres Reden wird im Haupttext natürlich wiedergegeben, während die wörtliche hebräische Form und die syntaktische Mehrdeutigkeit in Fußnoten dokumentiert werden.
