  to: 'Als Isaak alt geworden war und seine Augen so schwach waren, dass er nicht mehr sehen konnte, rief er Esau, seinen älteren Sohn[a], und sagte zu ihm: »Mein Sohn.« Er sagte zu ihm: »Hier bin ich.«'
