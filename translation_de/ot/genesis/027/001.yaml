  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Isaaks Alter, seine beeinträchtigte Sehfähigkeit, Esau als der ältere Sohn und die beiden Redezüge sind vorhanden. »Zu sich rief« legt jedoch zusätzlich nahe, dass Esau räumlich herbeigerufen wurde; קרא bezeichnet hier zunächst das Anrufen bzw. Rufen Esaus. Die Wiedergabe des zweiten וַיֹּאמֶר mit »antwortete« ist zwar kontextuell verständlich, glättet aber die im Hebräischen ausdrücklich wiederholte Redeeinleitung.'
  naturalness: Die Fassung ist gut verständlich und in modernem Standarddeutsch grundsätzlich natürlich. Die Wiederholung von »geworden waren« wirkt jedoch etwas schwer. Eine Apposition mit Esau vor »seinen älteren Sohn« liest sich flüssiger und folgt zugleich der hebräischen Anordnung besser.
  terminology: »Isaak«, »Esau«, »älterer Sohn«, »Mein Sohn« und »Hier bin ich« sind angemessen. Die Fußnote bietet die sinnvolle Alternative »ältesten Sohn«; sie sollte an der Stelle stehen bleiben.
  issues:
