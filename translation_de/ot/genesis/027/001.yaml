    rationale: Die Ergänzung »zu sich« kann eine Bewegung Esaus zu Isaak hin implizieren, die der Vers nicht ausdrücklich aussagt. »rief Esau« bewahrt die Offenheit von קרא.
  - severity: low
    issue: »Esau antwortete« statt der wiederholten Redeeinleitung
    rationale: Das Hebräische verwendet erneut וַיֹּאמֶר אֵלָיו. »Er sagte zu ihm« erhält die Wiederholung ohne unnatürlich zu werden.
  - severity: low
    issue: Doppelte Formulierung »geworden waren«
    rationale: Die Häufung ist stilistisch unnötig. »seine Augen so schwach waren« gibt den Zustand idiomatisch wieder, während »alt geworden war« die vorausgehende Entwicklung ausdrückt.
