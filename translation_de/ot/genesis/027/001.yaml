base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: de
  text: 'Als Isaak alt geworden war und seine Augen so schwach waren, dass er nicht mehr sehen konnte, rief er Esau, seinen älteren Sohn[a], und sagte zu ihm: »Mein Sohn.« Er sagte zu ihm: »Hier bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen ältesten Sohn.'
    reason: Lexikalische Alternative für הַגָּדֹל, das sowohl relativ »der ältere« als auch »der älteste« bezeichnen kann.
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als …
  rationale: Die hebräische Eröffnung führt den zeitlichen Umstand einer neuen Erzählszene ein. Die deutsche Als-Konstruktion gibt diese Funktion natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes »Nun« einzufügen.
- source_word: זָקֵן
  choice: alt geworden war
  rationale: Die Form bezeichnet Isaaks fortgeschrittenes Alter; im Zusammenhang mit der zeitlichen Einleitung klingt das deutsche Plusquamperfekt natürlich.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: seine Augen so schwach geworden waren, dass er nicht mehr sehen konnte
  rationale: כהה bezeichnet hier das Schwachwerden der Augen, מֵרְאֹת die dadurch eingeschränkte beziehungsweise unmögliche Sehfähigkeit. Die Formulierung bewahrt das Bild der Augen und macht die Folge im heutigen Deutsch klar.
- source_word: וַיִּקְרָא
  choice: rief … zu sich
  rationale: קרא bedeutet hier, jemanden zu rufen. »Zu sich rufen« verdeutlicht idiomatisch, dass Isaak Esau kommen ließ, ohne die Förmlichkeit von »vorladen« oder »herbeizitieren« einzutragen.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: seinen älteren Sohn Esau
  rationale: הַגָּדֹל unterscheidet Esau hier als den älteren der beiden Söhne von Jakob. »Älteren Sohn« ist präzise; »ältesten Sohn« bleibt eine mögliche Wiedergabe.
- source_word: בְּנִי
  choice: Mein Sohn!
  rationale: Die Anrede gibt das Possessivsuffix und den familiären Ton unmittelbar wieder.
- source_word: הִנֵּנִי
  choice: Hier bin ich.
  rationale: Die feste Antwortformel signalisiert Anwesenheit und Bereitschaft; »Hier bin ich« ist die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die direkte Rede ist leicht geglättet, ohne Inhalte hinzuzufügen; die Wiederholung von »sagte zu ihm … sagte zu ihm« wird idiomatisch durch »antwortete« wiedergegeben.
