revisions:
- from: Die Söhne Jakobs kamen über die Erschlagenen und plünderten die Stadt, in der man ihre Schwester entehrt hatte.[a]
  to: Die Söhne Jakobs kamen zu den Erschlagenen und plünderten die Stadt, weil man ihre Schwester geschändet hatte.[a]
  rationale: Die Revision beseitigt eine moderne deutsche Mehrdeutigkeit bei „über die Erschlagenen“ und wählt für die im Kontext sexuelle Schändung bezeichnende Form von טמא ein präziseres Wort. Das unpersönliche „man“ verhindert weiterhin den falschen Eindruck, Jakobs Söhne hätten ihre Schwester geschändet. Die Fußnote dokumentiert die komprimierte hebräische Relativsatzkonstruktion und die mögliche lokale Auslegung, ohne eine Täteridentifikation in den Haupttext einzutragen.
