review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe der Gewalttat mit „entehrt“ ist möglich, bleibt aber gegenüber טִמְּאוּ in diesem Kontext zu abgeschwächt und euphemistisch. „Geschändet“ gibt die sexuelle Verletzung sowie die mitgemeinte Verunreinigung klarer wieder. Der ungenannte hebräische Pluralsubjektbezug darf im Deutschen nicht mit einem missverständlichen „sie“ auf Jakobs Söhne bezogen werden.
  naturalness: „Über die Erschlagenen kamen“ ist im modernen Standarddeutsch missverständlich und wirkt archaisch; es kann sogar ein Gehen über die Leichen nahelegen. „Kamen zu den Erschlagenen“ ist idiomatisch und bewahrt den erzählerischen Ablauf. Die kausale Verknüpfung ist natürlich und vermeidet eine künstliche Relativsatzkonstruktion.
  terminology: „Die Söhne Jakobs“, „die Erschlagenen“, „plünderten“ und „Stadt“ sind treffend. Für טמא ist hier „geschändet“ gegenüber „entehrt“ vorzuziehen, ohne die Täter über den im Textzusammenhang erschließbaren Rahmen hinaus zu bestimmen.
  issues:
  - severity: medium
    issue: „kamen über die Erschlagenen“ ist missverständlich und unnatürlich.
    rationale: Die Präposition „über“ wird im heutigen Deutschen primär räumlich verstanden. Das hebräische בוא על kann hier ein Hinzukommen zu bzw. Herankommen an die bereits Getöteten bezeichnen; „zu den Erschlagenen kamen“ ist klarer.
  - severity: medium
    issue: „entehrt“ schwächt die Bedeutung von טִמְּאוּ im Kontext ab.
    rationale: Das Verb bezeichnet hier die durch die sexuelle Tat bewirkte Schändung/Verunreinigung. „Geschändet“ vermittelt dies genauer und ist nicht auf einen bloßen Ehrverlust reduzierbar.
  - severity: low
    issue: Die Fußnote bietet eine sprachlich unbrauchbare angeblich wörtliche Formulierung.
    rationale: „die Stadt, die sie verunreinigt hatten – ihre Schwester“ bildet die hebräische Verdichtung nicht verständlich ab. Die Anmerkung sollte die formale Relativsatzstruktur und das nicht ausdrücklich genannte Subjekt knapp erklären.
