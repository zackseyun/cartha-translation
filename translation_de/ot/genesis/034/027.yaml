  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: de
  text: Die Söhne Jakobs kamen zu den Erschlagenen und plünderten die Stadt, weil man ihre Schwester geschändet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein Relativsatz: „die Stadt, die sie ihre Schwester verunreinigt hatten“. Das Subjekt von „hatten verunreinigt“ ist im Hebräischen nicht ausdrücklich genannt; aus dem Zusammenhang sind die Bewohner der Stadt gemeint. Auch möglich: „… plünderten die Stadt, in der man ihre Schwester geschändet hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Die Söhne Jakobs
  rationale: Die hebräische Status-constructus-Verbindung wird ausdrücklich wiedergegeben und hebt Jakobs Söhne als handelnde Gruppe hervor.
- source_word: בָּאוּ עַל
  choice: kamen über
  rationale: Die Verbindung bezeichnet hier eine Bewegung hin zu beziehungsweise über die bereits Erschlagenen; die knappe Formulierung bewahrt die Härte und räumliche Bildlichkeit des Hebräischen.
- source_word: הַחֲלָלִים
  choice: die Erschlagenen
  rationale: חֲלָלִים bezeichnet im Zusammenhang gewaltsam Getötete, nicht lediglich allgemein Tote.
- source_word: וַיָּבֹזּוּ
  choice: plünderten
  rationale: בזז bedeutet Beute machen beziehungsweise gewaltsam Besitz wegnehmen; „plünderten“ ist präzise und gegenwärtiges Standarddeutsch.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Die übliche und kontextgerechte Wiedergabe von עִיר.
- source_word: אֲשֶׁר
  choice: in der
  rationale: Die Relativpartikel wird auf „die Stadt“ bezogen. Die örtliche Wiedergabe bildet den komprimierten hebräischen Relativsatz natürlich ab, ohne eine nicht ausdrücklich markierte Kausalpartikel einzusetzen.
- source_word: טִמְּאוּ
  choice: man ... entehrt hatte
  rationale: Das Piel von טמא bezeichnet hier die durch sexuelle Gewalttat bewirkte Schändung beziehungsweise Verunreinigung. „entehrt“ vermittelt die soziale und moralische Dimension; das unpersönliche „man“ vermeidet im Deutschen den falschen Bezug auf Jakobs Söhne.
- source_word: אֲחוֹתָם
  choice: ihre Schwester
  rationale: Die familiäre Beziehung und damit der erzählerische Beweggrund bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Bezug des unausgedrückten Subjekts von טִמְּאוּ
  choice: unpersönlich mit „man“ wiedergegeben
  alternative: „weil sie ihre Schwester entehrt hatten“
  rationale: Das Hebräische hat ein Verb in der 3. Person Plural, dessen Täter aus dem Zusammenhang zu erschließen sind. Ein deutsches „sie“ würde sich leicht fälschlich auf Jakobs Söhne beziehen. Die unpersönliche Form vermeidet diese Fehldeutung, ohne Täter genauer zu benennen, als es der Vers selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entehrt“ ist weniger technisch als „verunreinigt“, bewahrt hier aber die moralisch-soziale Tragweite von טמא. Die Fußnote dokumentiert sowohl die verdichtete Syntax als auch die mögliche kausale Deutung.
