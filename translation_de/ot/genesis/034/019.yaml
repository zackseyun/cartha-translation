source:
  edition: WLC
  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: de
  text: Und der junge Mann zögerte nicht, die Sache auszuführen[a], denn er hatte Gefallen an Jakobs Tochter[b]; und er war angesehener als alle im Haus seines Vaters[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „säumte nicht, dies zu tun“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn er begehrte Jakobs Tochter“; auch möglich: „denn Jakobs Tochter gefiel ihm“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und er war der Angesehenste im ganzen Haus seines Vaters“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: zögerte nicht
  rationale: Das Verb bezeichnet ein Verzögern oder Säumen. Die deutsche Wendung drückt hier aus, dass Sichem unverzüglich handelte, ohne zwingend innere Unentschlossenheit zu behaupten.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: Die Bezeichnung meint hier Sichem und wird im modernen Deutschen dem Erzählzusammenhang angemessen wiedergegeben.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: die Sache auszuführen
  rationale: Die Formulierung verweist auf die zuvor gestellte Forderung. „Ausführen“ klingt im Deutschen natürlicher als das wörtliche „die Sache tun“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für sein unverzügliches Handeln an; „denn“ verbindet die beiden Hauptsätze in gehobenem, aber gegenwärtigem Deutsch.
- source_word: חָפֵץ
  choice: hatte Gefallen an
  rationale: Die Wendung bewahrt die Bedeutungsbreite von starkem Wohlgefallen bis zu Begehren, ohne den Ausdruck ausschließlich sexuell festzulegen.
- source_word: בְּבַת יַעֲקֹב
  choice: an Jakobs Tochter
  rationale: Dies ist die natürliche deutsche Ergänzung zu „Gefallen haben“ und gibt die hebräische Präpositionalverbindung idiomatisch wieder.
- source_word: נִכְבָּד
  choice: angesehener
  rationale: Das Partizip bezeichnet eine geehrte, gewichtige oder hoch angesehene Person. Der Komparativ bildet die Vergleichskonstruktion mit מִכֹּל transparent ab.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: als alle im Haus seines Vaters
  rationale: „Haus seines Vaters“ kann Haushalt, Großfamilie oder Sippe bezeichnen. Die Wiedergabe erhält dieses soziale Bedeutungsfeld und bezieht den Vergleich auf dessen Angehörige.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während unnatürliche Wendungen wie „die Sache tun“ vermieden werden. Die Mehrdeutigkeit von חָפֵץ und die mögliche komparativische beziehungsweise superlativische Auffassung von נִכְבָּד מִכֹּל werden durch Fußnoten bewahrt.
