  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: de
  text: Und alle, die durch das Tor seiner Stadt hinausgingen[a], hörten auf Hamor und auf Sichem, seinen Sohn. Und alle Männer, alle, die durch das Tor seiner Stadt hinausgingen, wurden beschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle, die aus dem Tor seiner Stadt hinausgingen“. Gemeint sind die männlichen Stadtbewohner, die am öffentlichen Leben am Stadttor teilnahmen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: hörten auf
  rationale: Die Verbindung bedeutet hier, jemandem Gehör zu schenken und seinem Vorschlag zu folgen. „Hörten auf“ bewahrt sowohl den Höraspekt als auch die zustimmende Reaktion, ohne die stärkere Bedeutung „gehorchten“ aufzudrängen.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: alle, die zum Tor seiner Stadt hinausgingen
  rationale: Die konkrete hebräische Wendung und ihre Wiederholung bleiben erhalten. Sie bezeichnet idiomatisch die männlichen Stadtbewohner, die am öffentlichen Leben am Stadttor teilnahmen.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: 'Die natürliche deutsche Wortstellung verbindet die Bezeichnung eindeutig mit Sichem: „seinen Sohn Sichem“.'
- source_word: וַיִּמֹּלוּ
  choice: ließen sich ... beschneiden
  rationale: Der Nifal kann passiv oder reflexiv verstanden werden. Im Deutschen gibt „ließen sich beschneiden“ die freiwillige Durchführung in Reaktion auf den Vorschlag natürlich wieder, ohne zu behaupten, dass sie den Eingriff eigenhändig vollzogen.
- source_word: כָּל זָכָר
  choice: alle männlichen Einwohner
  rationale: זָכָר bezeichnet das männliche Geschlecht. Da die nachgestellte Wiederholung die am Stadttor auftretenden Stadtbewohner näher bestimmt, macht „Einwohner“ den Bezug im Deutschen verständlich; „männlichen“ bewahrt die lexikalische Aussage.
- source_word: שַׁעַר עִירוֹ
  choice: zum Tor seiner Stadt
  rationale: Die konkrete Ortsangabe bleibt bewahrt. „Zum Tor ... hinausgehen“ ist im Deutschen idiomatischer als „aus dem Tor hinausgehen“ und entspricht dem hebräischen Ausdruck für diejenigen, die durch das Stadttor ausgingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung der Wendung vom Stadttor wurde als Merkmal des hebräischen Textes beibehalten; die zweite Satzhälfte wurde durch „So“ als Folge der Zustimmung natürlich angebunden.
