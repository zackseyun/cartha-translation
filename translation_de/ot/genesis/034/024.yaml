    rationale: Die deutsche Formulierung bezeichnet ein Hinausgehen zum Tor hin. Gemeint sind Personen, die durch bzw. aus dem Stadttor hinausgehen.
  - severity: medium
    issue: „So ließen sich ... beschneiden“ expliziert Folge und Eigenveranlassung.
    rationale: Das vorangestellte „So“ ist stärker als das hebräische einfache וְ („und“), und „ließen sich beschneiden“ kann eine nicht ausdrücklich markierte freiwillige Veranlassung nahelegen. Die passive Wiedergabe wahrt die Formulierung offener.
  - severity: low
    issue: Der Fußnotenanker steht bei „Sichem“, obwohl die Anmerkung die erste Torformel erläutert.
    rationale: Der Anker sollte unmittelbar an der erläuterten Wendung stehen.
