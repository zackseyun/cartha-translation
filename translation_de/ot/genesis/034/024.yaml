  source_fidelity: Die Personenfolge und die Wiederholung der Wendung vom Stadttor sind grundsätzlich erfasst. „Zum Tor seiner Stadt hinausgingen“ bedeutet im Deutschen jedoch eher, dass sie sich zum Tor begaben, nicht dass sie durch dieses hinausgingen. Das einleitende „So“ macht zudem eine Folgerung ausdrücklich, wo das Hebräische lediglich mit „und“ fortfährt. „ließen sich ... beschneiden“ hebt eine freiwillige Veranlassung hervor; die Nifalform ist hier neutraler passiv wiederzugeben.
  naturalness: Die Satzfolge wird mit einer engeren Wiedergabe von „durch das Tor ... hinausgingen“ klar und idiomatisch. Die Wiederholung bleibt als bewusstes Stilmerkmal des hebräischen Textes erhalten.
  terminology: „Sichem“ und „Hamor“ sind korrekt. „Alle Männer“ ist im Deutschen für כָּל־זָכָר in diesem städtischen Kontext natürlich; die Fußnote erläutert die idiomatische Torformel, ohne sie in der Übersetzung zu ersetzen.
