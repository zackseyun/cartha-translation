  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: de
  text: Dann werden wir euch unsere Töchter geben und eure Töchter zu Frauen nehmen; wir werden mit euch zusammen wohnen und ein Volk werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ein Volk sein“. Das Hebräische lautet wörtlich etwa: „und wir werden zu einem Volk sein“; gemeint sein kann sowohl das Ergebnis („ein Volk werden“) als auch der Zustand („ein Volk sein“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: Dann werden wir … geben
  rationale: Das Qal Perfekt 1. Person Plural mit וְ steht im Zusammenhang der vorausgehenden Bedingung und bezeichnet deren künftige Folge; „Dann werden wir“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: euch unsere Töchter geben
  rationale: לָכֶם bezeichnet den indirekten Empfänger. Die im Deutschen übliche Stellung „euch unsere Töchter“ bewahrt die Bedeutung ohne unnötige Explizierung.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח לָנוּ
  choice: und eure Töchter für uns nehmen
  rationale: לקח bedeutet wörtlich „nehmen“; der Zusammenhang macht die Heirat deutlich. לָנוּ wird idiomatisch mit „für uns“ wiedergegeben, ohne den Heiratssinn ausdrücklich in den Text einzutragen.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: wir werden bei euch wohnen
  rationale: ישב bezeichnet hier dauerhaftes Wohnen beziehungsweise Ansiedeln. Bei Personen ist „bei euch wohnen“ im modernen Deutschen natürlicher als „mit euch wohnen“ und umfasst das Zusammenleben.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: und ein Volk werden
  rationale: Die Konstruktion mit היה und לְ kann den Eintritt in einen resultierenden Zustand ausdrücken. „Ein Volk“ gibt עַם אֶחָד wieder, ohne den modernen politischen Beiklang von „Nation“ einzuführen.
theological_decisions:
- issue: Resultat oder Zustand in וְהָיִינוּ לְעַם אֶחָד
  choice: ein Volk werden
  alternative: ein Volk sein
  rationale: Der Verhandlungszusammenhang legt einen resultierenden Zustand nahe, doch die hebräische Formulierung lässt auch die formalere Wiedergabe „ein Volk sein“ zu. Diese echte Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Verhandlungsstil, während „bei euch wohnen“ und „ein Volk werden“ natürlich deutsch formuliert sind.
