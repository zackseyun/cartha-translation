base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: de
  text: Ihre Worte gefielen Hamor und Sichem, dem Sohn Hamors.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Ihre Worte waren gut in den Augen Hamors und in den Augen Sichems, des Sohnes Hamors.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: fanden … Zustimmung
  rationale: Das Verb יטב steht hier mit דִבְרֵיהֶם als Subjekt und בְּעֵינֵי als Angabe der beurteilenden Personen. Die deutsche Wendung gibt den Sinn ‚gut beziehungsweise wohlgefällig sein‘ natürlich wieder.
- source_word: דִבְרֵיהֶם
  choice: ihre Worte
  rationale: Die Wiedergabe bewahrt den Plural von דָּבָר und vermeidet die engere, deutende Festlegung auf ‚Vorschlag‘.
- source_word: בְּעֵינֵי
  choice: Zustimmung
  rationale: Die hebräische Wendung bedeutet wörtlich ‚in den Augen von‘ und bezeichnet hier eine positive Beurteilung. Im Zusammenhang mit ‚fanden‘ ist ‚Zustimmung‘ idiomatisches modernes Deutsch.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Der Personenname wird in einer im Deutschen etablierten Umschrift wiedergegeben.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Der Personenname wird in der im Deutschen traditionell etablierten Form wiedergegeben.
- source_word: בֶּן חֲמוֹר
  choice: seines Sohnes Sichem
  rationale: Die deutsche Form bezeichnet Sichem eindeutig als Hamors Sohn und vermeidet die im Deutschen schwerfällige unmittelbare Wiederholung des Namens Hamor.
