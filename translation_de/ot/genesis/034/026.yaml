base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: de
  text: Auch Hamor und seinen Sohn Sichem töteten sie mit dem Schwert[a]; sie nahmen Dina aus Sichems Haus und gingen hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund des Schwertes«; eine hebräische Redewendung für das Töten mit dem Schwert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Auch Hamor und seinen Sohn Sichem
  rationale: Die Konjunktion verbindet den Vers mit den zuvor genannten Tötungen und hat hier additive Wirkung. Die deutsche Wortstellung gibt die Beziehung zwischen Hamor und seinem Sohn natürlich wieder.
- source_word: הָרְגוּ
  choice: töteten sie
  rationale: Direkte, gegenwartssprachliche Wiedergabe von הרג im erzählenden Kontext.
- source_word: לְפִי חָרֶב
  choice: mit dem Schwert
  rationale: Die hebräische Wendung bedeutet wörtlich »durch den Mund des Schwertes« und ist ein Idiom für das Töten mit dem Schwert; die natürliche Bedeutung steht im Haupttext, die Bildsprache in der Fußnote.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: Dann holten sie Dina
  rationale: לקח ist grundsätzlich »nehmen«. In Verbindung mit einer Person, die aus einem Haus herausgebracht wird, drückt »holten« den Vorgang im Deutschen natürlich aus, ohne die im Hebräischen nicht ausdrücklich bezeichnete Art der Handlung zu überzeichnen. »Dann« bildet die narrative Abfolge ab.
- source_word: מִבֵּית שְׁכֶם
  choice: aus Sichems Haus
  rationale: בית bezeichnet im unmittelbaren Zusammenhang am ehesten das konkrete Haus beziehungsweise die Wohnung; die deutsche Genitivkonstruktion bewahrt die Zugehörigkeit.
- source_word: וַיֵּצֵאוּ
  choice: und gingen hinaus
  rationale: Bewahrt die räumliche Bewegung von יצא und knüpft sie an das Herausholen Dinas an.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählprosa. Die Namen werden in ihren geläufigen deutschen biblischen Formen »Hamor«, »Sichem« und »Dina« wiedergegeben. Die markante hebräische Bildrede wird im Haupttext idiomatisch und in der Fußnote wörtlich vermittelt.
