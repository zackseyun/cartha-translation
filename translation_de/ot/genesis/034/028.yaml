source:
  edition: WLC
  text: אֶת צֹאנָ֥/ם וְ/אֶת בְּקָרָ֖/ם וְ/אֶת חֲמֹרֵי/הֶּ֑ם וְ/אֵ֧ת אֲשֶׁר בָּ/עִ֛יר וְ/אֶת אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה לָקָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: de
  text: Sie nahmen ihre Schafe und Ziegen, ihre Rinder und ihre Esel sowie alles, was in der Stadt war, und alles, was auf dem Feld war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: ihre Schafe und Ziegen
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, vor allem Schafe und Ziegen. Die ausgeschriebene Form ist im heutigen Deutsch klarer und natürlicher als das fachsprachlich wirkende „Kleinvieh“.
- source_word: בְּקָרָם
  choice: ihre Rinder
  rationale: בָּקָר bezeichnet kollektiv Rinder beziehungsweise Großvieh. „Rinder“ gibt die Tiergruppe präzise und in modernem Deutsch verständlich wieder.
- source_word: חֲמֹרֵיהֶם
  choice: ihre Esel
  rationale: חֲמוֹר bezeichnet den Esel; die Wiedergabe ist direkt und idiomatisch.
- source_word: אֲשֶׁר בָּעִיר
  choice: alles, was in der Stadt … war
  rationale: Die substantivierte Relativkonstruktion bezeichnet umfassend das in der Stadt Vorhandene. „Alles, was“ bringt diesen Umfang natürlich zum Ausdruck.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: alles, was … auf dem Feld war
  rationale: שָׂדֶה kann Feld, Flur oder offenes Land bezeichnen. „Auf dem Feld“ ist hier eine direkte, verständliche Wiedergabe, ohne den Bezug unnötig einzuengen.
- source_word: לָקָחוּ
  choice: Sie nahmen
  rationale: לָקַח bedeutet grundlegend „nehmen“. Der Zusammenhang macht deutlich, dass es sich um Beute handelt; eine stärker deutende Wiedergabe wie „plünderten“ ist daher nicht nötig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp; „sowie“ verbindet den umfassenden letzten Teil idiomatisch mit den ausdrücklich genannten Tiergruppen.
