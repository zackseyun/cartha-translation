  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: de
  text: Ihr könnt bei uns wohnen, und das Land steht euch offen.[a] Lasst euch darin nieder, treibt darin Handel und erwerbt darin Grundbesitz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und das Land wird vor euch sein«; das heißt, es wird euch zur Verfügung stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verschafft euch darin Besitz« beziehungsweise »sichert euch darin Besitzrechte«. Das Hebräische meint wahrscheinlich den Erwerb von Grundbesitz oder entsprechenden Besitzrechten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Ihr könnt bei uns wohnen
  rationale: Das Imperfekt von יָשַׁב hat in dieser Einladung erlaubenden Charakter. »Wohnen« gibt den gewöhnlichen Sinn natürlich wieder.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: und das Land steht euch offen
  rationale: Wörtlich heißt die Wendung, das Land werde »vor euch sein«. Im Zusammenhang bezeichnet sie dessen Verfügbarkeit; »steht euch offen« bewahrt das Bild in idiomatischem Deutsch.
- source_word: שְׁבוּ
  choice: Lasst euch darin nieder
  rationale: Der Imperativ von יָשַׁב fordert hier zur dauerhaften Ansiedlung im Land auf.
- source_word: וּסְחָרוּהָ
  choice: treibt darin Handel
  rationale: סחר bezeichnet hier Handel beziehungsweise geschäftlichen Verkehr. Die Form bezieht das Land als Bereich der Tätigkeit ein.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: und erwerbt darin Grundbesitz
  rationale: Der Niphal von אָחַז bezeichnet hier wahrscheinlich den Erwerb eines festen Besitzanteils oder von Eigentumsrechten im Land, nicht bloß ein körperliches Ergreifen.
