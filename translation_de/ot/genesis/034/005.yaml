base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: de
  text: Jakob hörte, dass Schechem seine Tochter Dina verunreinigt hatte.[a] Seine Söhne aber waren mit seinem Vieh auf dem Feld, und Jakob schwieg, bis sie kamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geschändet hatte“. Das hebräische Verb bedeutet wörtlich „verunreinigen“ oder „unrein machen“; in diesem Zusammenhang bezeichnet es die sexuelle Entehrung Dinas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hörte
  rationale: Das Verb bezeichnet hier, dass Jakob von dem Geschehen hörte; die direkte Wiedergabe passt zum hebräischen Erzählstil.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was Jakob hörte.
- source_word: טִמֵּא
  choice: verunreinigt hatte
  rationale: Der Piel-Stamm bedeutet wörtlich „verunreinigen“ oder „unrein machen“. Das Plusquamperfekt verdeutlicht im Deutschen, dass die Tat Jakobs Hören vorausging, ohne den Begriff stärker als der hebräische Text festzulegen.
- source_word: בִתּוֹ
  choice: seine Tochter
  rationale: Natürliche Wiedergabe des Substantivs mit Possessivsuffix.
- source_word: וּבָנָיו
  choice: Seine Söhne aber
  rationale: '„Aber“ gibt den leichten Gegensatz wieder: Jakob hatte davon gehört, seine Söhne waren jedoch noch auf dem Feld.'
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: waren mit seinem Vieh auf dem Feld
  rationale: Die Übersetzung wahrt die Ortsangabe und ergänzt nicht ausdrücklich, dass sie das Vieh hüteten.
- source_word: מִקְנֵהוּ
  choice: seinem Vieh
  rationale: מִקְנֶה bezeichnet hier den Viehbestand; „Vieh“ ist umfassend und im Deutschen idiomatisch.
- source_word: וְהֶחֱרִשׁ
  choice: und Jakob schwieg
  rationale: Der Hiphil bezeichnet hier, dass Jakob sich des Redens oder Reagierens enthielt. „Schwieg“ ist knapp und natürlich.
- source_word: עַד בֹּאָם
  choice: bis sie kamen
  rationale: Dies gibt den Infinitiv mit Suffix idiomatisch wieder. „Zurückkamen“ wäre kontextuell möglich, doch das Zurückkehren wird nicht ausdrücklich bezeichnet.
theological_decisions:
- issue: Bezeichnung der Tat an Dina
  choice: Die Grundbedeutung „verunreinigen“ bleibt im Haupttext erhalten und wird durch eine Fußnote kontextualisiert.
  alternative: „schänden“ oder „sexuell verletzen“ unmittelbar in den Haupttext setzen
  rationale: Der hebräische Ausdruck trägt in diesem Zusammenhang die Bedeutung sexueller Entehrung, ist aber nicht das spezifische Standardverb für Vergewaltigung. Die Übersetzung soll die Schwere des Zusammenhangs erkennbar machen, ohne den Lexembegriff stillschweigend zu verengen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge bleibt nah am Hebräischen; das Pronomen „er“ bewahrt den Rückbezug des Ausgangstextes auf den zuvor genannten Täter. Der Fußnotenmarker steht unmittelbar bei dem erklärungsbedürftigen Ausdruck.
