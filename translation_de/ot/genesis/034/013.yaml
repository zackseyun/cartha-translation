  text: וַ/יַּעֲנ֨וּ בְנֵֽי יַעֲקֹ֜ב אֶת שְׁכֶ֨ם וְ/אֶת חֲמ֥וֹר אָבִ֛י/ו בְּ/מִרְמָ֖ה וַ/יְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: de
  text: Die Söhne Jakobs antworteten Sichem, der ihre Schwester Dina verunreinigt[b] hatte, und dessen Vater Hamor mit Hinterlist[a] und sprachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Täuschung“ oder „mit Trug“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „verunreinigt“; im Zusammenhang auch: „geschändet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: antworteten
  rationale: ענה leitet hier die Reaktion auf den zuvor gemachten Vorschlag ein; „antworteten“ ist im Deutschen natürlich und genau.
- source_word: בְנֵי יַעֲקֹב
  choice: die Söhne Jakobs
  rationale: Die Genitivkonstruktion gibt das hebräische Status-constructus-Gefüge klar und würdig wieder.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: Sichem und seinem Vater Hamor
  rationale: Beide Männer sind Objekte des Antwortens; „seinem“ bezieht sich eindeutig auf Sichem und ist im modernen Deutsch natürlicher als „Hamor, seinen Vater“.
- source_word: בְּמִרְמָה
  choice: hinterlistig
  rationale: Das Substantiv מִרְמָה bezeichnet Täuschung oder Trug und wird durch die Präposition adverbial gebraucht. „Hinterlistig“ vermittelt hier sowohl Täuschungsabsicht als auch planvolles Vorgehen.
- source_word: וַיְדַבֵּרוּ
  choice: und redeten so
  rationale: דבר wird als eigener Sprechakt gegenüber ענה bewahrt. Das ergänzte „so“ verbindet das Verb im Deutschen natürlich mit der folgenden Begründung, ohne einen neuen Inhalt hinzuzufügen.
- source_word: אֲשֶׁר
  choice: weil
  rationale: אֲשֶׁר hat hier im Zusammenhang am ehesten kausale Funktion und begründet die hinterlistige Antwort.
- source_word: טִמֵּא
  choice: hatte entehrt
  rationale: Das Piel von טמא bedeutet wörtlich „unrein machen, entweihen“. Im Kontext sexueller Gewalt bringt „entehren“ die schwere soziale und moralische Verletzung verständlich zum Ausdruck; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: אֲחֹתָם
  choice: ihre Schwester
  rationale: Die Wiedergabe bewahrt die ausdrücklich genannte familiäre Beziehung als Motiv für das Handeln der Brüder.
theological_decisions:
- issue: Bedeutungsfeld von טִמֵּא im Zusammenhang der Vergewaltigung Dinas
  choice: entehrt
  alternative: verunreinigt / geschändet
  rationale: „Entehrt“ ist im heutigen Deutsch verständlich, darf jedoch nicht als bloßer Verlust gesellschaftlicher Ehre missverstanden werden. Die Fußnote bewahrt deshalb die wörtliche Reinheits- und Entweihungssprache und nennt die kontextuell schärfere Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung identifiziert Hamor eindeutig als Sichems Vater. Die beiden hebräischen Sprechverben werden unterschieden; die kausale Mehrdeutigkeit von אֲשֶׁר wird kontextgemäß mit „weil“ wiedergegeben. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
