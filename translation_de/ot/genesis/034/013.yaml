revisions:
- from: Die Söhne Jakobs antworteten Sichem und seinem Vater Hamor hinterlistig[a] und redeten so, weil er ihre Schwester Dina entehrt[b] hatte.
  to: Die Söhne Jakobs antworteten Sichem, der ihre Schwester Dina verunreinigt[b] hatte, und dessen Vater Hamor mit Hinterlist[a] und sprachen.
  rationale: Die Fassung entfernt das unbelegte „so“, ersetzt die semantisch verengende Wiedergabe „entehrt“ durch „verunreinigt“ und stellt die Satzglieder so um, dass eindeutig Sichem als derjenige bezeichnet wird, der Dina verunreinigt hatte. „Mit Hinterlist“ ist eine natürliche deutsche Wiedergabe der adverbialen Präpositionalphrase בְּמִרְמָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:04:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Satzstruktur, Adressaten, die kausale Beziehung und die familiäre Bezeichnung im Wesentlichen korrekt wieder. „so“ zu „redeten“ hat jedoch keine Entsprechung im Hebräischen. Zudem schwächt „entehrt“ טִמֵּא zu einer vorwiegend sozialen Ehrverletzung ab; „verunreinigt“ bewahrt die im Ausgangstext verwendete Sprache von Unreinheit/Entweihung.
  naturalness: „Und redeten so, weil“ ist im modernen Standarddeutsch stilistisch unnötig und wirkt syntaktisch angestrengt. „und sprachen, weil“ ist natürlich und erhält die Unterscheidung der beiden hebräischen Sprechverben. Die Umstellung zu „Sichem, der ihre Schwester Dina … hatte, und dessen Vater Hamor“ verhindert, dass das deutsche Pronomen „er“ fälschlich auf Hamor bezogen wird.
  terminology: „Mit Hinterlist“ gibt בְּמִרְמָה idiomatisch und angemessen wieder. „Verunreinigt“ entspricht dem Piel von טמא und lässt dessen moralisch-rituelle Konnotation bestehen, ohne die kontextuelle Gewalttat zu verharmlosen. Die Fußnote nennt „geschändet“ als kontextuelle Alternative.
  issues:
  - severity: medium
    issue: Das ergänzte „so“ bei „und redeten so“ ist nicht quellensprachlich gedeckt.
    rationale: וידברו bedeutet schlicht „und sie sprachen/redeten“; das demonstrative „so“ fügt eine nicht ausgedrückte Verweisfunktion hinzu und ist im Deutschen zudem unnötig.
  - severity: medium
    issue: „Entehrt“ ist für טִמֵּא zu verengend.
    rationale: Das hebräische Verb bezeichnet hier ausdrücklich ein Unreinmachen bzw. Entweihen. „Entehrt“ kann primär gesellschaftlichen Ehrverlust nahelegen und bewahrt die lexikalische Ebene des Ausgangstextes nicht ausreichend.
  - severity: low
    issue: Das Pronomen „er“ nach „Sichem und seinem Vater Hamor“ ist im Deutschen potenziell mehrdeutig.
    rationale: Obwohl der Kontext Sichem meint, kann sich das unmittelbar nach Hamor stehende maskuline Pronomen im Deutschen oberflächlich auf Hamor beziehen. Eine explizite Bezugnahme auf Sichem ist klarer.
  revised_text: Die Söhne Jakobs antworteten Sichem, der ihre Schwester Dina verunreinigt[b] hatte, und dessen Vater Hamor mit Hinterlist[a] und sprachen.
