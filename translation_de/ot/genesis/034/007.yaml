  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: de
  text: Als Jakobs Söhne davon hörten, kamen sie vom Feld. Die Männer waren bekümmert und sehr zornig, denn er hatte in Israel eine Schandtat begangen, indem er mit Jakobs Tochter schlief. So etwas tut man nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: waren tief gekränkt
  rationale: Das Verb bezeichnet hier schmerzliche Betroffenheit bzw. Kränkung; die Wiedergabe wahrt sowohl den inneren Schmerz als auch den Bezug auf die entehrende Tat.
- source_word: נְבָלָה
  choice: Schandtat
  rationale: Das Wort bezeichnet eine empörende, sittlich verwerfliche Tat. „Schandtat“ ist im Deutschen kräftig und würdevoll, ohne eine engere konfessionelle Deutung einzutragen.
- source_word: בְיִשְׂרָאֵל
  choice: in Israel
  rationale: Die auffällige, im Erzählzusammenhang vorausgreifende Bezeichnung wird formal bewahrt und nicht erklärend aufgelöst.
- source_word: לִשְׁכַּב אֶת־בַּת־יַעֲקֹב
  choice: indem er mit Jakobs Tochter schlief
  rationale: Die hebräische Infinitivkonstruktion wird als Erläuterung der Schandtat wiedergegeben; die idiomatische sexuelle Bedeutung von „liegen mit“ entspricht natürlich „mit … schlafen“.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: So etwas darf nicht getan werden
  rationale: Die unpersönliche Form und der starke normative Charakter werden bewahrt; „darf nicht“ ist im heutigen Deutsch natürlicher als ein wörtliches „wird nicht getan“.
theological_decisions:
- issue: Bewertung der Tat
  choice: Schandtat
  alternative: Torheit / schändliche Torheit
  rationale: נְבָלָה ist hier nicht bloß mangelnde Klugheit, sondern eine schwere Verletzung der sittlichen und sozialen Ordnung; die Übersetzung sollte diese Wertung deutlich ausdrücken.
- issue: Normative Stärke des Schlusssatzes
  choice: darf nicht getan werden
  alternative: sollte nicht getan werden
  rationale: Das Hebräische formuliert eine kategorische gesellschaftlich-sittliche Norm. „Darf nicht“ bewahrt diese Stärke besser als das abschwächende „sollte nicht“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge wurde leicht gegliedert, um den zeitlichen Zusammenhang natürlich auszudrücken. Die Spannung der anachronistisch wirkenden Wendung „in Israel“ bleibt ohne harmonisierende Erklärung bestehen.
