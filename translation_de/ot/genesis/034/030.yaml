revisions:
- from: 'Da sagte Jakob zu Simeon und Levi: „Ihr habt mich ins Unglück gestürzt und mich bei den Bewohnern des Landes, den Kanaanitern und den Perisitern, in Verruf gebracht.[a] Ich habe nur wenige Leute. Wenn sie sich gegen mich verbünden und mich schlagen, werde ich vernichtet, ich und mein Haus.“'
  to: 'Da sagte Jakob zu Simeon und Levi: „Ihr habt mir Unheil bereitet und mich bei den Bewohnern des Landes, bei den Kanaanitern und Perisitern, in Verruf gebracht.[a] Da ich nur wenige an Zahl bin, werden sie sich gegen mich sammeln und mich schlagen; dann werde ich zugrunde gehen, ich und mein Haus und meine Familie.“'
  rationale: Die Revision mildert die überstarke Wiedergabe von עכר, ersetzt den nicht markierten Konditionalsatz durch den im Kontext begründenden Zukunftszusammenhang und verdeutlicht bei „Haus“ den hier gemeinten Haushalt bzw. Familienverband. Die metaphorische Aussage von באש bleibt mit einer knappen, quellentreuen Fußnote dokumentiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:02:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Sinn weitgehend zutreffend wieder. Die Wiedergabe von עֲכַרְתֶּם als „ins Unglück gestürzt“ ist jedoch stärker und kausativer als „mir Unheil bereitet“ und kann nahelegen, das Unheil sei bereits eingetreten. Außerdem ist die Satzverknüpfung im Hebräischen keine ausdrückliche Bedingung („Wenn“), sondern eine befürchtete Folge: Weil Jakob zahlenmäßig gering ist, werden die Bewohner sich gegen ihn sammeln, ihn schlagen, und er wird zugrunde gehen.'
  naturalness: Modernes Standarddeutsch ist grundsätzlich erreicht. „Ich habe nur wenige Leute“ klingt etwas umständlich; „Ich bin nur wenige an Zahl“ ist idiomatisch und entspricht dem hebräischen Prädikatsausdruck. „Mein Haus“ ist verständlich, kann im heutigen Deutsch aber primär das Gebäude meinen; „mein Haus und meine Familie“ vermeidet dies, ohne den biblischen Haushaltsbegriff zu verkürzen.
  terminology: „In Verruf gebracht“ ist eine gute idiomatische Wiedergabe der metaphorischen Wendung לְהַבְאִישֵׁנִי; die Fußnote bewahrt das wörtliche Geruchsbild. Die Volksnamen „Kanaaniter“ und „Perisiter“ sind korrekt. Für בֵּיתִי sollte der Haushaltssinn im Haupttext deutlicher sein.
  issues:
  - severity: medium
    issue: „ins Unglück gestürzt“ für עֲכַרְתֶּם
    rationale: Die Formulierung kann ein bereits vollzogenes persönliches Verderben ausdrücken. Das hebräische Verb meint hier, Jakob in Bedrängnis bzw. Unheil zu bringen; „mir Unheil bereitet“ bleibt näher und wahrt die anschließende Zukunftsbefürchtung.
  - severity: medium
    issue: Ausdrückliches „Wenn“ vor „sie sich gegen mich verbünden“
    rationale: Der hebräische Text reiht die erwarteten Folgen mit we-Konjunktiven an und enthält keine Konditionalsatzmarkierung. Ein kausaler Anschluss („Da ich ... bin, werden ...“) bildet die Argumentation klarer ab.
  - severity: low
    issue: „mein Haus“ ist im modernen Deutsch mehrdeutig
    rationale: בית bezeichnet hier Jakobs Hausgemeinschaft. „mein Haus und meine Familie“ macht den gemeinten sozialen Umfang natürlich verständlich und wahrt die umfassende Haus-Metapher.
  revised_text: 'Da sagte Jakob zu Simeon und Levi: „Ihr habt mir Unheil bereitet und mich bei den Bewohnern des Landes, bei den Kanaanitern und Perisitern, in Verruf gebracht.[a] Da ich nur wenige an Zahl bin, werden sie sich gegen mich sammeln und mich schlagen; dann werde ich zugrunde gehen, ich und mein Haus und meine Familie.“'
