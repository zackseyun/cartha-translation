base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: de
  text: 'Da sagte Jakob zu Simeon und Levi: „Ihr habt mir Unheil bereitet und mich bei den Bewohnern des Landes, bei den Kanaanitern und Perisitern, in Verruf gebracht.[a] Da ich nur wenige an Zahl bin, werden sie sich gegen mich sammeln und mich schlagen; dann werde ich zugrunde gehen, ich und mein Haus und meine Familie.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mich bei den Bewohnern des Landes stinkend gemacht“; gemeint ist: mich ihnen verhasst oder anstößig gemacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: Ihr habt mich ins Unglück gestürzt
  rationale: עכר bezeichnet das Verursachen schweren Unheils oder Unglücks. Die Formulierung gibt Jakobs scharfen Vorwurf natürlich und ohne zusätzliche Deutung wieder.
- source_word: לְהַבְאִישֵׁנִי
  choice: mich … in Verruf gebracht
  rationale: 'Das Hifil von באש bedeutet wörtlich „stinkend machen“, hier bildlich: jemanden verhasst oder anstößig machen. „In Verruf bringen“ bewahrt den sozialen Sinn in natürlichem Deutsch; das konkrete hebräische Bild steht in der Fußnote.'
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: bei den Bewohnern des Landes
  rationale: Der singularische Partizipialausdruck ist kollektiv und bezeichnet die ansässige Bevölkerung.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: den Kanaanitern und den Perisitern
  rationale: Die Volksgruppen erläutern appositionell, wer mit den Bewohnern des Landes gemeint ist; „bei“ aus dem vorherigen Satzglied gilt sinngemäß weiter.
- source_word: מְתֵי מִסְפָּר
  choice: Ich habe nur wenige Leute
  rationale: Das hebräische Idiom beschreibt eine zahlenmäßig kleine Gruppe. Im Kontext meint Jakob die geringe Stärke seines Haushalts, nicht lediglich seine eigene Person.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: Wenn sie sich gegen mich verbünden
  rationale: Das Nifal von אסף bezeichnet hier feindliches Zusammenkommen. „Sich verbünden“ bringt die gemeinschaftliche feindliche Aktion idiomatisch zum Ausdruck; der konditionale Anschluss ergibt sich aus Jakobs begründeter Befürchtung.
- source_word: וְהִכּוּנִי
  choice: mich schlagen
  rationale: נכה bezeichnet schlagen, angreifen oder besiegen. „Schlagen“ bleibt nahe am breiten Bedeutungsumfang und lässt die folgende Vernichtung als Steigerung stehen.
- source_word: וְנִשְׁמַדְתִּי
  choice: werde ich vernichtet
  rationale: שמד bezeichnet vollständige Vernichtung oder Ausrottung; „vernichtet“ ist stark, klar und registergerecht.
- source_word: בֵיתִי
  choice: mein Haus
  rationale: בַּיִת bezeichnet hier Jakobs gesamte Hausgemeinschaft beziehungsweise Familie. Das deutsche „mein Haus“ bewahrt die biblische soziale Bedeutung und die knappe Form des Originals.
