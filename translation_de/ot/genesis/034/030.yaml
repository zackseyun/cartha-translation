translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche, im Deutschen jedoch leicht missverständliche Geruchsmetapher wird in der Fußnote bewahrt. Die direkte Rede bleibt knapp und von Jakobs Sorge um die zahlenmäßige Unterlegenheit geprägt.
