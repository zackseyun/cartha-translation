  naturalness: 'Der Entwurf ist insgesamt flüssiges modernes Standarddeutsch. „Diese Sache nicht tun: ... zu geben“ ist zugleich idiomatisch und näher an der hebräischen Infinitivkonstruktion. Die Formulierung „ein Mann, der eine Vorhaut hat“ ist absichtlich wörtlich und durch eine idiomatische Alternative in der Fußnote abzusichern.'
