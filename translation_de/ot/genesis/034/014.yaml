  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: de
  text: 'Sie sagten zu ihnen: „Wir können diese Sache nicht tun: unsere Schwester einem Mann zu geben, der eine Vorhaut hat[a]; denn das ist für uns eine Schande.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einem unbeschnittenen Mann. Wörtlich: „einem Mann, der eine Vorhaut hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Sie sagten zu ihnen
  rationale: Die Erzählform von אמר bezeichnet schlicht den nächsten Sprechakt; der plurale Adressat bleibt ausdrücklich erhalten.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: Wir können so etwas nicht tun
  rationale: יכל bezeichnet Fähigkeit oder Möglichkeit. Die idiomatische deutsche Wendung gibt den Sinn des hebräischen Ausdrucks natürlich wieder.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ לְאִישׁ
  choice: unsere Schwester einem … Mann geben
  rationale: נתן bedeutet wörtlich „geben“; der Zusammenhang macht die beabsichtigte Heirat deutlich, ohne dass „zur Frau geben“ ergänzt werden muss. איש wird als „Mann“ wiedergegeben.
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: einem unbeschnittenen Mann
  rationale: Wörtlich heißt die Wendung „einem Mann, der eine Vorhaut hat“. „Unbeschnitten“ ist im Deutschen die natürliche und inhaltlich genaue Bezeichnung, ohne die Bedeutung zu verändern.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: denn das wäre eine Schande für uns
  rationale: חרפה bezeichnet Schmach, Schande oder entehrende Beschämung. Der deutsche Konjunktiv „wäre“ entspricht dem hier besprochenen möglichen Handeln.
