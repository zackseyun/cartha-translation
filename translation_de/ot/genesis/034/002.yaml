  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: de
  text: Als Sichem, der Sohn Hamors – eines Hiwiters und Fürsten des Landes –, sie sah, nahm er sie, schlief mit ihr und tat ihr Gewalt an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und demütigte sie“. Das hebräische Verb kann demütigen, erniedrigen oder bedrängen; in diesem sexuellen Zusammenhang bezeichnet es eine sexuelle Verletzung. Daher übersetzen manche: „und vergewaltigte sie“. Die Bezeichnungen „Hiwiter“ und „Fürst des Landes“ können syntaktisch auch auf Sichem bezogen werden.'
    reason: Lexikalische und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: als er sie sah
  rationale: ראה hat hier im fortlaufenden Erzählzusammenhang die schlichte Bedeutung „sehen“; die deutsche Als-Konstruktion gibt den zeitlichen Zusammenhang natürlich wieder.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: Sichem, der Sohn Hamors, des Hiwiters
  rationale: Die Namen folgen geläufiger deutscher Bibelschreibung. Der Genitiv „des Hiwiters“ bezieht die Volksbezeichnung grammatisch entsprechend dem Hebräischen auf Hamor, ohne die mögliche familiäre Zuordnung übermäßig auszudeuten.
- source_word: נְשִׂיא הָאָרֶץ
  choice: des Fürsten des Landes
  rationale: נָשִׂיא bezeichnet einen führenden politischen oder gesellschaftlichen Würdenträger. „Fürst“ wahrt den Rang, ohne Königtum vorauszusetzen; die Apposition wird auf Hamor bezogen.
- source_word: וַיִּקַּח אֹתָהּ
  choice: nahm er sie
  rationale: לקח bedeutet zunächst „nehmen“. Die Übersetzung bewahrt die hebräische Abfolge; der gewaltsame Charakter wird durch den abschließenden Ausdruck deutlich.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: schlief mit ihr
  rationale: שכב mit Personenobjekt bezeichnet hier Geschlechtsverkehr. „Schlief mit ihr“ ist im heutigen Standarddeutsch natürlich und unmissverständlich, ohne einen einvernehmlichen Charakter festzulegen.
- source_word: וַיְעַנֶּהָ
  choice: tat ihr Gewalt an
  rationale: ענה im Piel kann erniedrigen, demütigen, bedrängen oder sexuell verletzen. Im Kontext bezeichnet es sexuelle Gewalt. „Tat ihr Gewalt an“ macht den Zwang deutlich und bewahrt zugleich etwas von der Breite des hebräischen Verbs.
theological_decisions:
- issue: Darstellung der sexuellen Gewalt ohne Euphemismus oder ungerechtfertigte Verengung
  choice: „nahm er sie, schlief mit ihr und tat ihr Gewalt an“
  alternative: „ergriff sie und vergewaltigte sie“ / „nahm sie und demütigte sie“
  rationale: Die Verbfolge beschreibt eine erzwungene sexuelle Handlung. Die gewählte Fassung benennt die Gewalt klar, hält aber לקח und ענה als getrennte Glieder fest und reduziert ענה nicht vollständig auf einen modernen strafrechtlichen Fachbegriff.
- issue: Bezug der Apposition „Fürst des Landes“
  choice: Bezug auf Hamor
  alternative: Bezug auf Sichem
  rationale: Nach der hebräischen Wortstellung stehen הַחִוִּי und נְשִׂיא הָאָרֶץ unmittelbar bei חֲמוֹר und lassen sich am natürlichsten als Appositionen zu Hamor lesen. Da die Syntax auch anders aufgefasst werden kann, wird die Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Fassung vermeidet sowohl beschönigende Formulierungen als auch unnötig juristische Terminologie. Der einzige Fußnotenmarker [a] steht ordnungsgemäß im Haupttext.
