  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: de
  text: 'Nur unter dieser Bedingung werden wir euch zustimmen: wenn ihr wie wir werdet, indem jeder Mann unter euch beschnitten wird.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »indem sich jeder Mann unter euch beschneiden lässt«.'
    reason: Die hebräische Passivkonstruktion kann im Deutschen auch mit einer Wendung wiedergegeben werden, die das Veranlassen der Beschneidung hervorhebt; der Haupttext wahrt den passiven Ausdruck unmittelbarer.
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Nur unter dieser Bedingung
  rationale: אַךְ schränkt die Zustimmung exklusiv ein; בְּזֹאת führt die konkrete Bedingung ein. Die deutsche Wendung gibt den Verhandlungssinn natürlich und präzise wieder.
- source_word: נֵאוֹת לָכֶם
  choice: werden wir euch zustimmen
  rationale: Das Nifal von אוה bezeichnet Bereitwilligkeit oder Zustimmung. Mit dem Dativ »euch« ist »zustimmen« im Deutschen idiomatisch und wahrt die Zielrichtung von לָכֶם.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: wenn ihr wie wir werdet
  rationale: Die Bedingung verlangt eine Veränderung hin zu ihrem Zustand beziehungsweise ihrer Praxis; daher trifft »werdet« den Zusammenhang besser als ein statisches »seid«.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: indem sich jeder Mann unter euch beschneiden lässt
  rationale: Der Infinitiv im Nifal bezeichnet das Beschnittenwerden als Mittel, durch das sie wie die Sprecher werden. »Jeder Mann unter euch« gibt den distributiven Sinn von כָּל זָכָר und die Gruppenzugehörigkeit durch לָכֶם wieder.
theological_decisions: []
