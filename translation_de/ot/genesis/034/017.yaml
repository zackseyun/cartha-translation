source:
  edition: WLC
  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: de
  text: Wenn ihr aber nicht auf uns hört und euch nicht beschneiden lasst,[a] dann nehmen wir unsere Tochter und gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »nicht auf uns hört, euch beschneiden zu lassen«. Der hebräische Infinitiv bezeichnet die verlangte Handlung, in der das Hören auf sie bestehen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet die gegensätzliche Bedingung zum vorherigen Angebot ein; die deutsche Nachstellung von »aber« gibt diesen Kontrast natürlich wieder.
- source_word: לֹא תִשְׁמְעוּ אֵלֵינוּ
  choice: ihr nicht auf uns hört
  rationale: שׁמע mit אֶל bedeutet hier »auf jemanden hören« beziehungsweise »ihn beachten«. Die gewählte Formulierung bleibt nah am Wortlaut, ohne die stärkere Deutung »gehorchen« festzuschreiben.
- source_word: לְ/הִמּוֹל
  choice: und euch nicht beschneiden lasst
  rationale: Der Infinitiv bezeichnet die verlangte Handlung, durch die sie auf die Sprecher hören würden. Die wiederholte Verneinung ist im Deutschen nötig, um eindeutig auszudrücken, dass die Beschneidung verweigert wird; »sich beschneiden lassen« bewahrt den passiven Sinn.
- source_word: וְ/לָקַחְנוּ
  choice: dann nehmen wir
  rationale: Das Perfekt mit waw bezeichnet in der Folge des Bedingungssatzes die eintretende Konsequenz. »Dann« macht diese Beziehung im Deutschen deutlich.
- source_word: אֶת בִּתֵּנוּ
  choice: unsere Tochter
  rationale: Schlichte Wiedergabe des Substantivs mit dem Suffix der ersten Person Plural; im Zusammenhang ist Dina gemeint.
- source_word: וְ/הָלָכְנוּ
  choice: und gehen
  rationale: הלך bedeutet hier weggehen beziehungsweise fortgehen. Das knappe »gehen« entspricht dem einfachen hebräischen Ausdruck und ist im Zusammenhang eindeutig.
