  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: de
  text: Werden nicht ihr Vieh, ihr Besitz und alle ihre Tiere uns gehören? Lasst uns ihnen nur zustimmen, dann werden sie bei uns wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: ihr Vieh
  rationale: מִקְנֶה bezeichnet gewöhnlich den Viehbestand. „Vieh“ ist im Deutschen umfassend und passt zum wirtschaftlichen Zusammenhang.
- source_word: קִנְיָנָם
  choice: ihr Besitz
  rationale: קִנְיָן bezeichnet erworbenes Eigentum oder Besitztümer. „Besitz“ bewahrt den materiell-wirtschaftlichen Sinn, ohne ihn unnötig einzuengen.
- source_word: כָל בְּהֶמְתָּם
  choice: alle ihre Tiere
  rationale: בְּהֵמָה ist ein weiter Begriff für Tiere, häufig Haustiere oder Nutztiere. „Tiere“ vermeidet nach „Vieh“ eine störende Wiederholung und gibt כָל ausdrücklich wieder.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Werden nicht ... uns gehören?
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Die Zukunftsform gibt hier die in Aussicht gestellte Aneignung natürlich wieder.
- source_word: אַךְ
  choice: nur
  rationale: 'אַךְ markiert hier eine einschränkende Bedingung: Es sei lediglich erforderlich, dem Vorschlag zuzustimmen.'
- source_word: נֵאֹותָה לָהֶם
  choice: Wir müssen ihnen nur zustimmen
  rationale: Die Nifalform von אוה hat den Sinn „willig sein, einwilligen, zustimmen“. Die deutsche Formulierung gibt den auffordernden beziehungsweise kohortativen Gehalt natürlich wieder.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: dann werden sie bei uns wohnen
  rationale: יָשַׁב kann „wohnen, leben, sich niederlassen“ bedeuten. „Bei uns wohnen“ wahrt den Gedanken dauerhafter gemeinsamer Ansiedlung.
theological_decisions: []
