  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und den Sinn zuverlässig wieder: Hamor richtet sich an die Angehörigen, bezeichnet Sichem als seinen Sohn, beschreibt dessen starkes Verlangen bzw. seine Bindung an ihre Tochter und bittet darum, sie ihm zur Ehefrau zu geben. „Sehnt sich nach“ ist als idiomatische Wiedergabe von חָשְׁקָה נַפְשׁוֹ vertretbar, ohne die im Ausdruck liegende Nuance unnötig einzuengen.'
