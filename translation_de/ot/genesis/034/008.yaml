source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: de
  text: 'Und Hamor redete mit ihnen und sagte: „Mein Sohn Sichem sehnt sich nach eurer Tochter.[a] Gebt sie ihm bitte zur Frau.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Die Seele meines Sohnes Sichem hängt an eurer Tochter“; auch möglich: „Mein Sohn Sichem begehrt eure Tochter.“'
    reason: Die Wendung חָשְׁקָה נַפְשׁוֹ verbindet das innere Selbst („Seele“) mit einem Verb starker Hinwendung oder starken Verlangens; der Kontext lässt sowohl emotionale Verbundenheit als auch Begehren anklingen.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: דבר bezeichnet hier das Reden bzw. Ansprechen; „redete“ wahrt zudem die Unterscheidung zum folgenden לֵאמֹר („und sagte“).
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Die Präposition אֵת mit Suffix bedeutet hier am natürlichsten „mit ihnen“ und stellt Hamors Ansprache als Gespräch mit Jakobs Familie dar.
- source_word: שְׁכֶם בְּנִי
  choice: mein Sohn Sichem
  rationale: Diese im Deutschen natürliche Wortstellung bewahrt das appositionelle Verhältnis von Eigenname und Verwandtschaftsbezeichnung.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: sehnt sich
  rationale: Wörtlich ist seine נֶפֶשׁ, sein inneres Selbst bzw. seine Seele, an ihr interessiert oder ihr zugeneigt. „Sehnt sich“ gibt die starke persönliche Hinwendung idiomatisch wieder, ohne ihre genaue Art übermäßig festzulegen.
- source_word: בְּבִתְּכֶם
  choice: nach eurer Tochter
  rationale: Das Substantiv „Tochter“ steht im Singular und meint Dina; das pluralische Possessivsuffix richtet sich an die angesprochene Familie und wird mit „eurer“ wiedergegeben.
- source_word: תְּנוּ נָא
  choice: Gebt sie ihm bitte
  rationale: Der Pluralimperativ richtet sich an mehrere Angesprochene; נָא verleiht der Aufforderung den Ton einer höflichen Bitte.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste Wendung bezeichnet die Übergabe einer Frau zur Eheschließung; „zur Frau“ ist knapp, natürlich und sachlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Redete mit ihnen und sagte“ bildet die hebräische Einleitungsformel erkennbar ab; die direkte Rede bleibt natürlich und höflich.
