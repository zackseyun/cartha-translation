base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: de
  text: Am dritten Tag, als sie Schmerzen hatten, nahmen zwei Söhne Jakobs, Simeon und Levi, Dinas Brüder, jeder sein Schwert. Sie drangen in die Stadt ein, die sich sicher wähnte[a], und töteten alles Männliche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie drangen unbesorgt in die Stadt ein.“ Das hebräische Wort kann entweder die arglose, unvorbereitete Lage der Stadt oder das sichere beziehungsweise unbesorgte Vorgehen der Angreifer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die zeitliche Angabe wird im modernen deutschen Erzählstil direkt vorangestellt; das einleitende וַיְהִי braucht dabei nicht eigens wiedergegeben zu werden.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: als sie Schmerzen hatten
  rationale: Die Infinitivkonstruktion bezeichnet einen gleichzeitigen Umstand. Die Formulierung bleibt klar und benennt die aus dem Kontext bekannte Ursache nicht zusätzlich.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: zwei Söhne Jakobs
  rationale: Die Wendung bezeichnet zwei aus der Gruppe von Jakobs Söhnen; im Deutschen gibt die unbestimmte Form dies natürlich wieder.
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: Simeon und Levi, Dinas Brüder
  rationale: Die Namen folgen der üblichen deutschen biblischen Schreibweise; die Apposition bewahrt die ausdrückliche verwandtschaftliche Zuordnung zu Dina.
- source_word: אִישׁ חַרְבּוֹ
  choice: jeder sein Schwert
  rationale: 'אִישׁ ist hier distributiv: Jeder der beiden nahm sein eigenes Schwert.'
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: sie drangen in die Stadt ein
  rationale: בוא על bezeichnet hier im Zusammenhang ein feindliches Vorgehen gegen die Stadt. „Eindringen“ ist im Deutschen natürlich und lässt den folgenden Tötungsakt als Höhepunkt stehen.
- source_word: בֶּטַח
  choice: sorglos
  rationale: Das Adverb kann entweder die sichere beziehungsweise arglose Lage der Stadt oder die unbehelligte, sichere Art des Vorgehens bezeichnen. Im Haupttext wird es kontextgemäß auf die unvorbereitete Stadt bezogen; die Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: und töteten alles Männliche
  rationale: הרג bedeutet gewöhnlich „töten“. כָּל זָכָר bezeichnet wörtlich jedes männliche Wesen und wird daher nicht auf erwachsene Männer verengt.
