base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: de
  text: Verlangt von mir einen sehr hohen Brautpreis und ein Geschenk[a]; ich werde geben, was immer ihr von mir fordert. Gebt mir nur die junge Frau zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brautpreis« ist die Zahlung gemeint, die der Bräutigam oder seine Familie an die Familie der Braut leistete; nicht die Mitgift, die von der Seite der Braut kam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Verlangt von mir einen noch so hohen
  rationale: Die pluralische Aufforderung bezeichnet hier das Auferlegen einer sehr hohen Forderung. „Einen noch so hohen“ gibt die starke Steigerung idiomatisch wieder und passt zur anschließenden uneingeschränkten Zahlungszusage.
- source_word: מֹהַר
  choice: Brautpreis
  rationale: Das Wort bezeichnet eine vom Bräutigam oder seiner Familie an die Familie der Braut geleistete Heiratszahlung; „Brautpreis“ ist sachlich genauer als „Mitgift“.
- source_word: וּמַתָּן
  choice: und ein Geschenk
  rationale: Der Ausdruck bezeichnet eine zusätzliche Gabe neben dem Brautpreis. Der Singular des hebräischen Textes bleibt erhalten.
- source_word: וְאֶתְּנָה
  choice: ich werde geben
  rationale: Die Kohortativform drückt die entschiedene Bereitschaft des Sprechers aus; im Deutschen wird dies natürlich mit einer festen Zukunftszusage wiedergegeben.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: was immer ihr von mir fordert
  rationale: Im Zusammenhang geht es um die von den Angesprochenen festzusetzende Leistung. „Fordert“ macht diesen Bezug deutlich, ohne die offene Reichweite von כַּאֲשֶׁר einzuengen.
- source_word: וּתְנוּ לִי
  choice: Gebt mir nur
  rationale: Das „nur“ bringt die zugespitzte Hauptbitte nach der weitreichenden Zahlungszusage im natürlichen Deutschen zum Ausdruck.
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: Der Ausdruck bezeichnet hier eine junge Frau im heiratsfähigen Alter. Diese Wiedergabe ist gegenwärtig und vermeidet sowohl das potenziell kindliche „Mädchen“ als auch das altertümliche „Jungfrau“.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: „Jemanden zur Frau geben“ ist eine natürliche deutsche Entsprechung der üblichen hebräischen Heiratsformel.
