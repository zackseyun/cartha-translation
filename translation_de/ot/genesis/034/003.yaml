  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: de
  text: Seine Seele hing an Dina, der Tochter Jakobs, und er liebte die junge Frau und redete ihr zu Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „redete zum Herzen der jungen Frau“; die hebräische Wendung kann freundliches, zärtliches oder beruhigendes Zureden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה
  choice: Seine Seele hing an Dina
  rationale: Die Wendung bewahrt das anschauliche hebräische Bild von נפש und דבק; „an jemandem hängen“ ist zugleich natürliches, verständliches Deutsch.
- source_word: בַּת יַעֲקֹב
  choice: der Tochter Jakobs
  rationale: Die Apposition folgt der hebräischen Form und klingt im Deutschen würdevoll und natürlich.
- source_word: וַיֶּאֱהַב
  choice: und er liebte
  rationale: אהב bezeichnet hier Liebe bzw. Zuneigung. Die schlichte Wiedergabe vermeidet sowohl romantisierende als auch moralisch wertende Zusätze.
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: נַעֲרָה kann ein Mädchen oder eine junge Frau bezeichnen; „junge Frau“ ist in diesem Zusammenhang modernes, nicht verniedlichendes Deutsch.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: und redete ihr zu Herzen
  rationale: Die deutsche Wendung gibt das hebräische Idiom „zum/über das Herz reden“ vergleichsweise formnah wieder und lässt dessen Nuance zwischen zärtlichem, freundlichem und beruhigendem Reden offen.
theological_decisions:
- issue: Gefühlssprache nach der im Zusammenhang berichteten Gewalttat
  choice: Die Aussagen über Bindung und Liebe werden ohne romantisierende oder entschuldigende Zusätze wiedergegeben.
  alternative: Die Übersetzung könnte durch ausdrücklich negative Begriffe eine moralische Bewertung in den Vers eintragen.
  rationale: Der hebräische Text berichtet hier Sichem zufolge Bindung, Liebe und ein Reden zu Dinas Herzen. Die Übersetzung soll weder die vorausgehende Tat verharmlosen noch dem vorliegenden Vers eine nicht ausdrücklich formulierte Wertung hinzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte „die junge Frau“ wird im letzten Satzglied durch das natürliche Pronomen „ihr“ aufgenommen; die Fußnote bewahrt die wörtlichere Gestalt und die Bedeutungsbreite des hebräischen Idioms.
