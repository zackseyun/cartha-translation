  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen hebräischen Ausdrücke zuverlässig wieder: נפשוֹ mit „Seine Seele“, דבק ב mit „hing an“, בת יעקב als Apposition, אהב mit „liebte“ und das Idiom דבר על־לב ohne unzulässige Einengung. Das Pronomen „ihr“ im Schlussteil bezieht sich eindeutig auf Dina bzw. die zuvor genannte junge Frau.'
