  terminology: „Dina“, „Jakob“ und „junge Frau“ sind angemessenes modernes Standarddeutsch. Die Übersetzung romantisiert die im Kontext geschilderte Situation nicht und fügt keine moralische Wertung hinzu. Die Fußnote erklärt den hebräischen Idiomcharakter ausgewogen.
