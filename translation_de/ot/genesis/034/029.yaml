base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: de
  text: Sie plünderten ihre ganze Habe und alles, was im Haus[b] war, und nahmen alle ihre kleinen Kinder[a] und ihre Frauen gefangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle ihre Kinder“; das hebräische Wort kann kleine Kinder und, weiter gefasst, abhängige Mitglieder eines Haushalts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alles, was zum Haushalt gehörte“; das hebräische Wort für „Haus“ kann auch den Haushalt samt seinem Besitz meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: ihre ganze Habe
  rationale: חַיִל kann Vermögen, Besitz oder materielle Mittel bezeichnen. „Habe“ erfasst hier den beweglichen Besitz umfassend, ohne den Ausdruck auf Vieh oder militärische Stärke einzuengen.
- source_word: טַפָּם
  choice: alle ihre kleinen Kinder
  rationale: טַף bezeichnet häufig kleine Kinder, teils auch abhängige Angehörige. „Kleine Kinder“ gibt den im Kontext naheliegenden engeren Sinn klar und natürlich wieder; die weitere Möglichkeit wird in einer Fußnote genannt.
- source_word: נְשֵׁיהֶם
  choice: ihre Frauen
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „Ihre Frauen“ bewahrt im Deutschen die kontextuell passende relationale Bedeutung, ohne unnötig festzulegen, ob ausschließlich Ehefrauen gemeint sind.
- source_word: שָׁבוּ
  choice: nahmen sie gefangen
  rationale: שָׁבָה bedeutet, Menschen gefangen zu nehmen oder als Gefangene wegzuführen. Die Wiedergabe wahrt den gewaltsamen Charakter des Geschehens.
- source_word: וַיָּבֹזּוּ
  choice: plünderten
  rationale: בזז bezeichnet das Plündern beziehungsweise das Nehmen von Beute. „Plünderten“ ist modern, deutlich und entspricht dem kriegerisch-gewaltsamen Zusammenhang.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: alles, was im Haus war
  rationale: Die Formulierung folgt dem Singular בַּבַּיִת eng. Da בַּיִת auch den Haushalt bezeichnen kann, wird diese Möglichkeit in einer Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die hebräische Abfolge der vorangestellten Objekte bleibt erhalten. Dadurch bezieht sich „nahmen sie gefangen“ grammatisch auch auf die „Habe“, wie es die ungewöhnliche Quellsyntax nahelegt; eine glättende Neuordnung wurde vermieden, um die Spannung des Ausgangstextes nicht stillschweigend aufzulösen.
