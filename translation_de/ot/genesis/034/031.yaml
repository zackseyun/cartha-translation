  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: de
  text: 'Doch sie erwiderten: „Soll er unsere Schwester wie eine Prostituierte behandeln?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Soll er unsere Schwester wie eine Prostituierte behandeln/tun?“ Das hebräische Verb bedeutet „tun/machen“ und hat hier wahrscheinlich den Sinn „behandeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Doch sie erwiderten
  rationale: Das Waw mit der Erzählform führt die scharfe Gegenrede der Brüder auf Jakobs Vorwurf ein. „Doch“ gibt den adversativen Zusammenhang wieder; „erwiderten“ klingt im Deutschen natürlicher als das wörtlichere „sagten“.
- source_word: הַכְזוֹנָה
  choice: wie eine Prostituierte
  rationale: Die Verbindung aus Fragepartikel, כ („wie/als“) und זֹנָה („Prostituierte“) wird vergleichend wiedergegeben. „Prostituierte“ ist modern und sachlich; ältere Wörter wie „Hure“ wären stärker abwertend und stilistisch anders gefärbt.
- source_word: יַעֲשֶׂה
  choice: Durfte er ... behandeln?
  rationale: עשה bedeutet grundsätzlich „tun/machen“, bezeichnet mit einer Person als Objekt hier aber wahrscheinlich die Art, wie Sichem mit Dina umging. Die rhetorische Frage erhält im Deutschen durch „durfte ... etwa“ ihre empörte, rechtfertigende Kraft.
- source_word: אֶת אֲחוֹתֵנוּ
  choice: unsere Schwester
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt und wird nicht eigenständig übersetzt. „Unsere Schwester“ bewahrt den familiären Bezug, auf den die Brüder ihre Rechtfertigung stützen.
theological_decisions:
- issue: Mögliche moralische Billigung der Vergeltung der Brüder
  choice: Die empörte rhetorische Frage wird ohne bewertenden Zusatz wiedergegeben.
  alternative: Die Antwort so formulieren, dass ihre Gewalttat ausdrücklich gerechtfertigt oder verurteilt erscheint.
  rationale: Der Vers berichtet die Selbstrechtfertigung der Brüder, spricht aber hier kein ausdrückliches abschließendes Urteil über ihre Vergeltung aus. Diese Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. „Doch sie erwiderten“ markiert den Gegensatz zum vorherigen Vorwurf. „Durfte er etwa“ gibt die rückblickende rhetorische Empörung idiomatisch wieder, ohne dem hebräischen Imperfekt eine unnötig enge Zeit- oder Modalbestimmung aufzuzwingen.
