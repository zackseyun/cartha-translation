  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: de
  text: 'Da kamen Hamor und sein Sohn Sichem zum Tor ihrer Stadt und sprachen zu den Männern ihrer Stadt[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich die männlichen Stadtbewohner, die sich am Stadttor zu öffentlichen Beratungen versammelt hatten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kamen
  rationale: Das narrative Qal-Wayyiqtol von בוא wird im Deutschen mit dem Ziel »zum Tor« natürlich durch »kamen« wiedergegeben.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Der Eigenname wird in gebräuchlicher deutscher Transkription wiedergegeben.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: und sein Sohn Sichem
  rationale: Die natürliche deutsche Wortstellung macht die Sohnschaft ausdrücklich und bewahrt die Zuordnung zu Hamor.
- source_word: אֶל שַׁעַר עִירָם
  choice: zum Tor ihrer Stadt
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Genitivverbindung und erhält den Bezug auf ihre Stadt.
- source_word: וַיְדַבְּרוּ
  choice: redeten
  rationale: דבר mit אֶל bezeichnet hier das Reden zu einer versammelten Gruppe; »redeten zu« passt zum öffentlichen Rahmen.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: zu den Männern ihrer Stadt
  rationale: אַנְשֵׁי bedeutet wörtlich »Männer von«; im Zusammenhang sind wahrscheinlich die männlichen Stadtbewohner gemeint, die am Tor über öffentliche Angelegenheiten berieten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die unmittelbar folgende Rede im modernen Deutschen natürlicher ein als das formelhafte »indem sie sagten«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Die Ortsangabe bleibt quellennah; die hebräische Redeeinleitungsformel wird idiomatisch durch einen Doppelpunkt wiedergegeben. Beide Fußnotenmarker stehen im Haupttext unmittelbar an der jeweils erklärten Stelle.
