revisions:
- from: So kamen Hamor und sein Sohn Sichem zum Tor ihrer Stadt und redeten zu den Männern ihrer Stadt[a]:[b]
  to: 'Da kamen Hamor und sein Sohn Sichem zum Tor ihrer Stadt und sprachen zu den Männern ihrer Stadt[a]:'
  rationale: „Da kamen“ erhält den narrativen Anschluss des Wayyiqtol. „sprachen zu“ ist eine natürliche, öffentliche Anredeform für דבר אל und wahrt die Richtung der Ansprache. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder; die ungenaue und nicht notwendige Fußnote dazu wird entfernt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:02:11Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Personen, das Stadttor, den Bezug auf ihre Stadt und die männlich bezeichnete Adressatengruppe zutreffend wieder. Der Doppelpunkt kann לֵאמֹר idiomatisch wiedergeben. Die Wiedergabe von וַיְדַבְּרוּ אֶל sollte jedoch im Deutschen besser als öffentliche Anrede formuliert werden.
  naturalness: „zu den Männern ... redeten“ ist im heutigen Standarddeutsch weniger idiomatisch. „zu den Männern ... sprachen“ ist sowohl natürlich als auch dem öffentlichen Anredekontakt des hebräischen דבר אל angemessen. Die Fußnote zum Doppelpunkt erklärt eine deutsche Satzzeichenentscheidung unnötig und bezeichnet לֵאמֹר zudem nicht präzise als „indem sie sagten“.
  terminology: Die Namensformen Hamor und Sichem sind gebräuchlich. „Männer ihrer Stadt“ bewahrt die explizit männliche Form אַנְשֵׁי ohne die Aussage unzulässig zu verallgemeinern.
  issues:
  - severity: medium
    issue: Unidiomatische Verbverbindung „redeten zu“
    rationale: Im modernen Deutschen ist „zu jemandem sprechen“ für eine öffentliche Ansprache die angemessenere Form. Sie bildet דבר אל genauer ab als „mit jemandem reden“, das einen Austausch nahelegen könnte.
  - severity: low
    issue: Fußnote b ist sprachlich ungenau und entbehrlich
    rationale: לֵאמֹר ist eine hebräische Redeeinleitungsformel („sagend“/„und sagte(n)“ je nach Kontext), nicht wörtlich „indem sie sagten“. Der Doppelpunkt ist hier eine reguläre deutsche Wiedergabe und braucht keine Fußnote.
  revised_text: 'Da kamen Hamor und sein Sohn Sichem zum Tor ihrer Stadt und sprachen zu den Männern ihrer Stadt[a]:'
  revised_footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich die männlichen Stadtbewohner, die sich am Stadttor zu öffentlichen Beratungen versammelt hatten.
    reason: cultural_note
