  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: de
  text: Geht Ehen mit uns ein:[a] Gebt uns eure Töchter zur Frau, und nehmt euch unsere Töchter zur Frau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verbindet euch mit uns durch Heiraten.“ Das hebräische Verb bezeichnet das gegenseitige Eingehen von Heiratsverbindungen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen hier die Verben „geben“ und „nehmen“; in diesem Zusammenhang ist jeweils die Eheschließung gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Geht Ehen mit uns ein
  rationale: Der Hitpael von חתן bezeichnet hier das gegenseitige Eingehen von Heiratsverbindungen. Die Formulierung bewahrt den wechselseitigen und gemeinschaftlichen Sinn, ohne ein einzelnes Heiratsverhältnis vorauszusetzen.
- source_word: בְּנֹתֵיכֶם תִּתְּנוּ לָנוּ
  choice: Gebt uns eure Töchter zur Frau
  rationale: נתן bedeutet wörtlich „geben“; im Zusammenhang bezeichnet es das Geben zur Ehe. „Zur Frau“ macht den im Deutschen sonst leicht missverständlichen kulturellen Sinn ausdrücklich.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: und nehmt euch unsere Töchter zur Frau
  rationale: לקח wird mit seiner konkreten Bedeutung „nehmen“ wiedergegeben; „zur Frau“ kennzeichnet den durch den Kontext bestimmten Ehesinn und erhält die parallele Struktur.
theological_decisions: []
