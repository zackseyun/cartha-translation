source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: de
  text: Dina, die Tochter Leas, die sie Jakob geboren hatte, ging hinaus, um die Töchter des Landes zu sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um die Frauen des Landes zu besuchen“. Wörtlich: „um die Töchter des Landes zu sehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: ging hinaus
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet gewöhnlich ein Hinausgehen. „Ging hinaus“ gibt die Erzählbewegung natürlich wieder, ohne einen im Hebräischen nicht genannten Ausgangsort hinzuzufügen.
- source_word: דִינָה
  choice: Dina
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בַּת לֵאָה
  choice: die Tochter Leas
  rationale: Die Konstruktverbindung bezeichnet Dina durch ihre mütterliche Abstammung; die deutsche Genitivform wahrt die appositionelle Struktur knapp und würdig.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: die sie Jakob geboren hatte
  rationale: Der Relativsatz bezieht sich grammatisch auf Lea und nennt Jakob als Vater. Das Plusquamperfekt markiert die Geburt als Hintergrundinformation; „Jakob geboren“ ist im Deutschen eine natürliche Wiedergabe des ל der Zuordnung.
- source_word: לִרְאוֹת
  choice: um ... zu sehen
  rationale: Der Infinitiv von ראה bedeutet wörtlich „sehen“. Die finale Konstruktion „um ... zu sehen“ bewahrt diese Grundbedeutung und den Zweck des Hinausgehens.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: die Töchter des Landes
  rationale: Die wörtliche Wendung bewahrt das hebräische Bild und kann die einheimischen Mädchen oder Frauen bezeichnen. Die im Zusammenhang mögliche idiomatische Bedeutung wird in der Fußnote genannt.
theological_decisions: []
