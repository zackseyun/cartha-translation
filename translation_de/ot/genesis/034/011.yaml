  naturalness: „Wenn ich doch Gunst in euren Augen finde!“ ist als Ausruf zwar verständlich, wirkt in dieser direkten Bitte jedoch syntaktisch weniger geschlossen und im modernen Standarddeutsch weniger idiomatisch. „Lasst mich Gunst in euren Augen finden“ gibt den volitiven Charakter klarer wieder. Bei „zu mir sagt“ ist im Deutschen das Dativobjekt „mir sagt“ die natürliche Entsprechung.
  terminology: „Sichem“, „Gunst“ und „in euren Augen finden“ sind für Namen, Register und die hebräische Idiomatik passend. „Brüdern“ bewahrt das maskuline Pluralwort des Ausgangstextes.
