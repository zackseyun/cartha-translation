base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: de
  text: 'Da sagte Sichem zu ihrem Vater und zu ihren Brüdern: „Lasst mich Gunst in euren Augen finden; was immer ihr mir sagt[a], werde ich geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was immer ihr von mir fordert, werde ich geben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Schreibweise wiedergegeben.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: zu ihrem Vater und zu ihren Brüdern
  rationale: Die wiederholte Präposition אֶל wird durch „zu ... und zu ...“ abgebildet; אַחֶיהָ bezeichnet ausdrücklich ihre Brüder.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Wenn ich doch Gunst in euren Augen finde!
  rationale: Die hebräische Wendung bittet um Wohlwollen. Die Formulierung bewahrt das Bild von den „Augen“ und gibt den volitiven Charakter idiomatisch wieder.
- source_word: וַאֲשֶׁר
  choice: Was immer
  rationale: Die unbestimmte Relativkonstruktion bezeichnet eine offene, uneingeschränkte Forderung.
- source_word: תֹּאמְרוּ אֵלַי
  choice: ihr zu mir sagt
  rationale: אָמַר mit אֶל bedeutet wörtlich „zu jemandem sagen“. Das kontextuell mögliche „von mir fordert“ wäre stärker auslegend und wird daher als Fußnotenalternative genannt.
- source_word: אֶתֵּן
  choice: will ich geben
  rationale: נָתַן bedeutet allgemein „geben“. „Bezahlen“ würde den Sinn unnötig auf eine Geldleistung verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Höflichkeitswendung und das Bild „Gunst in euren Augen finden“ bleiben erhalten; die im Verhandlungskontext naheliegende Deutung als Forderung steht nur in der Fußnote.
