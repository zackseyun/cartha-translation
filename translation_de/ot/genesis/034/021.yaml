  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: de
  text: Diese Männer sind uns gegenüber friedlich gesinnt[a]. Lasst sie im Land wohnen und darin Handel treiben[b]. Seht, das Land ist weit genug für sie[c]. Ihre Töchter wollen wir uns zu Frauen nehmen, und unsere Töchter wollen wir ihnen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stehen mit uns in Frieden« beziehungsweise »sind uns freundlich gesinnt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durch das Land Handel treiben«; das Hebräische kann Handel innerhalb des Landes oder durch sein Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »Das Land – seht – ist breit an beiden Seiten vor ihnen«; die hebräische Wendung besagt, dass ihnen viel Platz beziehungsweise ein weites Gebiet offensteht.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: uns gegenüber friedlich gesinnt
  rationale: Das Adjektiv bezeichnet hier ein friedliches, ungestörtes Verhältnis zu den Einwohnern der Stadt. Die Formulierung gibt den relationalen Sinn wieder, ohne besondere Zuneigung zu unterstellen.
- source_word: וְיֵשְׁבוּ
  choice: Sie sollen … wohnen
  rationale: 'Das Imperfekt hat in der auffordernden Rede einen jussivischen Sinn: Den Männern soll gestattet werden, im Land zu wohnen.'
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: darin Handel treiben
  rationale: סחר bezeichnet kommerzielle Tätigkeit; das feminine Pronomen verweist auf das Land. »Darin« versteht das Land als Bereich des Handels, während die mögliche Nuance »durch das Land« in einer Fußnote erhalten bleibt.
- source_word: הִנֵּה
  choice: seht
  rationale: Der Aufmerksamkeitsruf wird mit dem gegenwärtigen, würdevollen »seht« wiedergegeben und leitet die Begründung ein.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: bietet ihnen reichlich Raum
  rationale: Die wörtlich ungewöhnliche Wendung »weit an Händen vor ihnen« ist ein Idiom für ein weites, offen verfügbares Gebiet. Die Übersetzung gibt diesen Sinn natürlich wieder.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: wollen wir uns zu Frauen nehmen
  rationale: Das Imperfekt drückt hier einen Vorschlag beziehungsweise eine beabsichtigte gegenseitige Heiratsregelung aus. »Uns« bewahrt לָנוּ, und »zu Frauen nehmen« entspricht dem hebräischen Heiratsidiom.
- source_word: נִתֵּן לָהֶם
  choice: wollen wir ihnen geben
  rationale: Die Formulierung wahrt die Parallelität zur vorangehenden Absichtserklärung und gibt die im historischen Kontext übliche Ausdrucksweise direkt wieder.
