  source_fidelity: Die Grundbedeutung ist gut getroffen. Die hebräischen Imperfekte stehen jedoch in einer Aufforderung an die Stadtbewohner; »Lasst sie ... wohnen und ... Handel treiben« bildet diesen jussivisch-erlaubenden Sinn unmittelbarer ab als das etwas mehrdeutige »Sie sollen«. Die Verbindung mit הִנֵּה ist besser ohne das im Hebräischen nicht ausdrücklich vorhandene »denn« wiederzugeben.
  naturalness: Die Revision bleibt modernes, idiomatisches Standarddeutsch. »Seht, das Land ist weit genug für sie« ist klarer und näher am Satzbau der Vorlage als »das Land bietet ihnen reichlich Raum«, ohne den Sinn zu verengen.
  terminology: »uns gegenüber friedlich gesinnt«, »Handel treiben«, »zu Frauen nehmen« und »ihnen geben« sind sachgerecht. Die direkte Heirats- und Übergabesprache wird als historische Rede beibehalten und nicht euphemisiert.
