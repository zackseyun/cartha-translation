translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die auffordernden Imperfektformen werden durch »sollen« beziehungsweise »wollen wir« kontextgerecht unterschieden; die idiomatische Weite des Landes wird natürlich ausgedrückt, während der hebräische Wortlaut in der Fußnote sichtbar bleibt.
