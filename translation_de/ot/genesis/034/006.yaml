  yaml_path: translation/ot/genesis/034/006.yaml
  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: de
  text: Da ging Hamor, der Vater Sichems, zu Jakob hinaus, um mit ihm zu sprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da ging … hinaus
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ markiert die zeitliche Folge, und „hinausgehen“ bewahrt die Richtungsbedeutung von יצא.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: אֲבִי שְׁכֶם
  choice: der Vater Sichems
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Hamor als Sichems Vater; der deutsche Genitiv gibt sie präzise und natürlich wieder.
- source_word: אֶל יַעֲקֹב
  choice: zu Jakob
  rationale: אֶל bezeichnet hier die Bewegung auf eine Person zu; „zu Jakob“ ist die natürliche deutsche Entsprechung.
- source_word: לְדַבֵּר אִתּוֹ
  choice: um mit ihm zu sprechen
  rationale: לְ mit Infinitiv drückt den Zweck aus. „Mit ihm sprechen“ gibt den durch אִתּוֹ angezeigten Gesprächscharakter wieder; das Pronomen bezieht sich am natürlichsten auf Jakob.
theological_decisions: []
