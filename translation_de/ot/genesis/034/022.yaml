    issue: Die Bedingung wird mit „müssen“ statt als Kondition wiedergegeben.
    rationale: בְּהִמּוֹל leitet die Voraussetzung der Zustimmung ein („wenn/unter der Bedingung, dass ... beschnitten werden“). Ein deutsches Modalverb ist zwar folgerichtig, verschiebt die Formulierung aber von der genannten Bedingung zu einer direkten Forderung.
  - severity: medium
    issue: Die gemeinsame Volkswerdung ist im Deutschen nicht ausdrücklich auf die Sprecher bezogen.
    rationale: Nach „bei uns zu wohnen“ kann „ein Volk zu werden“ zwar kontextuell verstanden werden, doch „mit uns ein Volk zu werden“ gibt die in לְעַם אֶחָד ausgedrückte Vereinigung eindeutig und natürlich wieder.
