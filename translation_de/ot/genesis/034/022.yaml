base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: de
  text: 'Nur unter dieser Bedingung werden die Männer uns zustimmen[a], bei uns zu wohnen und mit uns ein Volk zu werden: wenn bei uns alle männlichen Personen beschnitten werden, so wie sie beschnitten sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns ihre Einwilligung geben“ oder „sich uns gegenüber bereit erklären“; das hebräische Verb bezeichnet Zustimmung oder Einwilligung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Nur unter dieser Bedingung
  rationale: Die Verbindung schränkt die Zustimmung auf eine einzige Voraussetzung ein; diese deutsche Wendung gibt die konditionale und begrenzende Funktion natürlich wieder.
- source_word: יֵאֹתוּ לָנוּ
  choice: werden ... uns zustimmen
  rationale: Der Niphal von אוה bezeichnet Bereitschaft beziehungsweise Einwilligung. „Uns zustimmen“ passt zum Verhandlungskontext und bewahrt die im Hebräischen offene Nuance von Zustimmung oder Einwilligung.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das maskuline Pluralnomen bezeichnet hier die Männer, um die es in der Verhandlung geht; die geschlechtsspezifische Referenz bleibt erhalten.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: bei uns zu wohnen
  rationale: ישב bezeichnet wohnen, leben oder sich niederlassen. „Bei uns zu wohnen“ ist gegenwärtiges, natürliches Deutsch und drückt das Zusammenleben aus.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: ein Volk zu werden
  rationale: Die Konstruktion beschreibt den Eintritt in eine gemeinsame soziale Identität. „Volk“ passt in diesem Sippenkontext besser als „Nation“.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: Alle männlichen Personen bei uns müssen beschnitten werden
  rationale: בְּ mit dem Infinitiv führt die notwendige Bedingung ein. זָכָר kann männliche Personen unabhängig vom Alter bezeichnen; die Formulierung vermeidet die unzutreffende Einschränkung auf erwachsene Männer.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: so wie sie beschnitten sind
  rationale: Die Vergleichsklausel stellt den verlangten Zustand dem Zustand der anderen Gruppe gleich und lässt die resultative beziehungsweise stative Nuance der hebräischen Form bestehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am argumentativen Aufbau des Hebräischen, wird aber durch Doppelpunkt und eine explizite deutsche Modalform natürlich lesbar gemacht. „Männliche Personen“ ist präziser als „Männer“, da זָכָר nicht auf Erwachsene begrenzt ist.
