  verdict: revise
  source_fidelity: 'Der Grundsinn ist getroffen: Die Zustimmung der Männer hängt von der Beschneidung aller männlichen Angehörigen der Sprechergruppe ab. Die Wiedergabe mit „müssen“ formuliert die hebräische Bedingung jedoch als selbstständige Notwendigkeit. Der Infinitiv mit בְּ ist hier besser ausdrücklich konditional wiederzugeben. Außerdem sollte die Einheit mit den Sprechern in „ein Volk“ im Deutschen durch „mit uns“ klar markiert werden.'
  naturalness: „Alle männlichen Personen bei uns“ ist verständlich, aber in dieser Satzstellung schwerfällig. „Wenn bei uns alle männlichen Personen beschnitten werden“ ist modernes Standarddeutsch und bildet die Bedingung klar ab. Die angepasste Satzfügung ist flüssiger.
  terminology: '„Männer“ für הָאֲנָשִׁים und „männliche Personen“ für כָּל־זָכָר bewahren die unterschiedliche Referenz: erstere bezeichnet die verhandelnden Männer, letztere alle Personen männlichen Geschlechts, nicht nur Erwachsene. „Beschnitten“ ist der sachlich angemessene etablierte Begriff.'
  issues:
