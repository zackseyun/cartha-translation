  text: And Shechem said to Hamor his father, “Get me this girl as a wife.”
translation:
  language: de
  text: 'Da sagte Sichem zu seinem Vater Hamor: »Hol mir dieses Mädchen zur Frau.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח־לִי
  choice: Hol mir
  rationale: Der Imperativ von לקח mit לִי fordert den Vater idiomatisch dazu auf, das Mädchen für Sichem als Ehefrau zu beschaffen; »Hol mir« bewahrt den knappen, fordernden Ton.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: dieses Mädchen
  rationale: יַלְדָּה bezeichnet hier eine junge Frau bzw. ein Mädchen; »dieses Mädchen« entspricht der demonstrativen und wenig persönlichen Ausdrucksweise des Hebräischen.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste Wendung bedeutet, eine Frau zur Ehefrau zu nehmen; das natürliche deutsche »zur Frau« gibt dies knapp wieder.
