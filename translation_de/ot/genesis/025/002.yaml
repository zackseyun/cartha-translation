  yaml_path: translation/ot/genesis/025/002.yaml
  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: de
  text: Sie gebar ihm Simran, Jokschan, Medan, Midian, Jischbak und Schuach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Sie gebar
  rationale: Das Qal-Wayyiqtol der Wurzel ילד mit femininem Subjekt berichtet knapp von der Geburt. „Sie gebar“ ist im genealogischen Zusammenhang natürlich und würdevoll, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Söhne“ hinzuzufügen.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet hier den Vater; die deutsche Wendung „sie gebar ihm“ bewahrt die knappe Beziehungsangabe des Hebräischen.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der direkte Objektmarker steht vor jedem Namen und besitzt im Deutschen keine eigene lexikalische Entsprechung.
- source_word: זִמְרָן
  choice: Simran
  rationale: Der Personenname wird in etablierter deutscher Bibelschreibung wiedergegeben.
- source_word: יָקְשָׁן
  choice: Jokschan
  rationale: Der Personenname folgt der im Deutschen gebräuchlichen biblischen Namensform.
- source_word: מְדָן
  choice: Medan
  rationale: Der Personenname wird konventionell transliteriert.
- source_word: מִדְיָן
  choice: Midian
  rationale: Die vertraute deutsche Form des Personen- und späteren Volksnamens wird beibehalten.
- source_word: יִשְׁבָּק
  choice: Jischbak
  rationale: Die Schreibweise bildet den hebräischen Namen in üblicher deutscher Transliteration verständlich ab.
- source_word: שׁוּחַ
  choice: Schuach
  rationale: Die Form gibt den abschließenden hebräischen Ach-Laut wieder und entspricht etablierter deutscher Bibeltradition.
