  source_fidelity: Die Übersetzung gibt die Toledot-Überschrift, die Identifikation Isaaks als Sohn Abrahams und das Hifil הוֹלִיד („zeugte“) sachgerecht wieder. Das einleitende „Und“ bildet die hebräische Konjunktion angemessen ab. Die singularische deutsche Konstruktion „dies ist die Geschlechterfolge“ ist bei einem kollektiven Gliederungsbegriff idiomatisch und keine sachliche Abweichung.
  naturalness: '„Und dies ist die Geschlechterfolge Isaaks, des Sohnes Abrahams: Abraham zeugte Isaak“ ist würdiges, verständliches modernes Standarddeutsch. „Zeugte“ ist in genealogischem Kontext präzise und nicht unangemessen archaisch.'
  terminology: „Geschlechterfolge“ ist als Wiedergabe von תּוֹלְדֹת tragfähig und bewahrt dessen genealogische sowie abschnittsgliedernde Offenheit. Die Fußnote benennt zulässige, nicht dogmatisch verengende Alternativen und erklärt die Genesis-spezifische Funktion des Begriffs. Die Namensformen Isaak und Abraham entsprechen dem deutschen Bibelgebrauch.
