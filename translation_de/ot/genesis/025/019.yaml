id: GEN.25.19
reference: Genesis 25:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: de
  text: 'Und dies ist die Geschlechterfolge Isaaks[a], des Sohnes Abrahams: Abraham zeugte Isaak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geschichte« beziehungsweise »Familiengeschichte«. Das hebräische Wort toledot ist ein wiederkehrender Gliederungsbegriff im Buch Genesis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies ist
  rationale: Das einleitende וְ verbindet den neuen Abschnitt mit dem Vorhergehenden; die singularische Formulierung entspricht im Deutschen dem Kollektivbegriff »Geschlechterfolge«.
- source_word: תּוֹלְדֹת
  choice: Geschlechterfolge
  rationale: Der Ausdruck ist ein wiederkehrender Gliederungsbegriff in Genesis und kann sowohl die Abstammungslinie als auch den daraus hervorgehenden Bericht bezeichnen. »Geschlechterfolge« bewahrt diese genealogische und literarische Weite besser als das engere »Nachkommen«.
- source_word: יִצְחָק
  choice: Isaak
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: בֶּן אַבְרָהָם
  choice: des Sohnes Abrahams
  rationale: Die Apposition identifiziert Isaak ausdrücklich als Abrahams Sohn und wird in natürlichem, gehobenem Deutsch wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet hier das männliche Zeugen. »Zeugte« ist präzise und in einer genealogischen Formel weiterhin verständlich.
- source_word: אֶת יִצְחָק
  choice: Isaak
  rationale: Der hebräische Akkusativmarker אֶת wird im Deutschen nicht eigens wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Toledot-Formel in Genesis
  choice: Geschlechterfolge
  alternative: Geschichte; Familiengeschichte; Nachkommen
  rationale: Die Übersetzung erhält den wiederkehrenden literarischen Gliederungsbegriff und legt nicht einseitig fest, ob nur der folgende Bericht oder nur die Nachkommenschaft gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle genealogische Formulierung »zeugte« bleibt erhalten, weil sie den hebräischen Ausdruck knapp und präzise wiedergibt.
