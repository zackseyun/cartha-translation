  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: de
  text: 'Esau sagte zu Jakob: »Lass mich doch etwas von dem Roten, dem Roten da, hinunterschlingen![a] Denn ich bin erschöpft.« Darum wurde er Edom genannt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von dem Roten, dem Roten da«. Der hebräische Text nennt die Speise nicht ausdrücklich; die Wiederholung spiegelt möglicherweise Esaus hastige, impulsive Rede wider. Oft wird ergänzend »Linsengericht« oder »Eintopf« übersetzt.'
    reason: lexical_alternative
  - marker: b
    text: Edom entspricht dem hebräischen Wort für »rot«; darin liegt ein Wortspiel.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: Lass mich ... hinunterschlingen
  rationale: Der Hifil-Imperativ von לעט bezeichnet ein gieriges oder hastiges Verschlingen. Die deutsche Formulierung bewahrt Esaus impulsive Ausdrucksweise und den Bezug des Suffixes der 1. Person Singular.
- source_word: נָא
  choice: doch
  rationale: Die Bittepartikel mildert den Imperativ ab. Im gegenwärtigen Deutsch gibt »doch« hier den drängenden, zugleich bittenden Ton natürlicher wieder als ein förmliches »bitte«.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: etwas von dem Roten da ... von dem Roten
  rationale: Der hebräische Text nennt die Speise nicht, sondern wiederholt »das Rote«. Die Übersetzung bewahrt sowohl diese Ellipse als auch die auffällige Wiederholung; »da« gibt den deiktischen Sinn von הַזֶּה wieder.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: Denn ich bin erschöpft
  rationale: עָיֵף bezeichnet starke Müdigkeit oder Erschöpfung. »Erschöpft« ist modernes, klares Deutsch, ohne den Zustand unnötig bis zur Ohnmacht zu steigern.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die knappe Folgerungsformel leitet die anschließende Namensdeutung ein.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: nannte man ihn Edom
  rationale: Das Subjekt des Verbs ist im Hebräischen nicht ausdrücklich genannt. Das unpersönliche »man« bewahrt diese Offenheit und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe der Namensformel.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der Eigenname wird transliteriert. Sein Anklang an das hebräische Wort für »rot« wird in einer Fußnote erläutert.
