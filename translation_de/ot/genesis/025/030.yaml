review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Bittepartikel, die starke Bedeutung von הַלְעִיטֵנִי, Esaus Erschöpfung und die Namensdeutung grundsätzlich treffend wieder. Die Reihenfolge der zweimaligen Farbbezeichnung ist jedoch im Haupttext gegenüber dem Hebräischen vertauscht: הָאָדֹם הָאָדֹם הַזֶּה lautet wörtlich etwa „dem Roten, dem Roten da“ und sollte in dieser Reihenfolge stehen.'
  naturalness: „Lass mich doch … hinunterschlingen“ ist als bewusst ungehobelte, dringliche Rede verständlich und angemessen. Mit den eingeschobenen Wiederholungen wird der Satz lesbarer, wenn „hinunterschlingen“ erst nach der Wiederholung steht. „Darum wurde er Edom genannt“ ist idiomatisch und vermeidet ein zusätzliches, im Hebräischen nicht benanntes Kollektivsubjekt („man“).
  terminology: Die Eigennamen Esau, Jakob und Edom sind korrekt. „das Rote“ bewahrt die im Hebräischen nicht näher bestimmte Speise und sollte nicht durch „Linsengericht“ oder „Eintopf“ im Haupttext ersetzt werden. Die Fußnote zum Wortspiel sollte präzisieren, dass Edom dem hebräischen Wort für „rot“ entspricht, nicht nur ähnlich klingt.
  issues:
  - severity: medium
    issue: Die Wiederholung von „dem Roten“ steht im Haupttext nicht in der Abfolge des hebräischen Textes.
    rationale: 'Der Entwurf bietet „von dem Roten da … von dem Roten“, während הָאָדֹם הָאָדֹם הַזֶּה die deiktische Bestimmung beim zweiten Vorkommen hat: „dem Roten, dem Roten da“.'
  - severity: low
    issue: „nannte man ihn“ fügt ein unpersönliches Kollektivsubjekt hinzu.
    rationale: Die hebräische Namensformel lässt das Subjekt offen bzw. verwendet eine knappe Erzählformel. Das Passiv „wurde er … genannt“ ist im Deutschen natürlich und wahrt diese Offenheit besser.
  - severity: low
    issue: Die Wortspiel-Fußnote formuliert die Beziehung von Edom zu „rot“ zu schwach.
    rationale: אֱדוֹם ist nicht bloß ähnlich klingend, sondern entspricht dem hebräischen Wort für „rot“; so wird das Wortspiel genauer erklärt.
  revised_text: 'Esau sagte zu Jakob: »Lass mich doch etwas von dem Roten, dem Roten da, hinunterschlingen![a] Denn ich bin erschöpft.« Darum wurde er Edom genannt.[b]'
