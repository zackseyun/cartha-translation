id: GEN.25.1
reference: Genesis 25:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧סֶף אַבְרָהָ֛ם וַ/יִּקַּ֥ח אִשָּׁ֖ה וּ/שְׁמָ֥/הּ קְטוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: de
  text: Abraham nahm noch eine Frau[a]; sie hieß Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abraham nahm wieder eine Frau.“ Wörtlich steht im Hebräischen eine additive Wendung: „Abraham fügte hinzu und nahm eine Frau.“'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: noch
  rationale: Das Verb יסף bezeichnet ein Hinzufügen oder erneutes Handeln. In der Verbindung וַיֹּסֶף ... וַיִּקַּח gibt „nahm noch eine Frau“ die additive Bedeutung natürlich wieder, ohne die hebräische Konstruktion unbeholfen nachzuahmen.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח mit אִשָּׁה ist eine übliche hebräische Wendung für das Nehmen einer Frau zur Ehe. „nahm“ bleibt nahe am Wortlaut; der Zusammenhang macht die eheliche Bedeutung deutlich.
- source_word: אִשָּׁה
  choice: Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. In Verbindung mit לקח ist hier eine Frau in ehelicher Beziehung gemeint; das deutsche „eine Frau nehmen“ bewahrt zugleich die Ausdrucksweise des Ausgangstextes.
- source_word: וּשְׁמָהּ
  choice: sie hieß
  rationale: Die knappe deutsche Namensformel gibt den Sinn von „und ihr Name war“ klar und idiomatisch wieder.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
theological_decisions:
- issue: Additive beziehungsweise wiederholende Bedeutung von וַיֹּסֶף beim Nehmen einer Frau
  choice: Abraham nahm noch eine Frau
  alternative: 'Abraham nahm wieder eine Frau; wörtlicher: Abraham fügte hinzu und nahm eine Frau'
  rationale: „noch eine Frau“ bringt die additive Bedeutung des Hebräischen deutlich zum Ausdruck, ohne festzulegen, ob der Schwerpunkt zeitlich auf „wieder“ oder numerisch auf „eine weitere“ liegt. Die Fußnote bewahrt diese echte Nuance.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Satzstruktur folgt dem hebräischen Erzählstil, während das Semikolon die beiden eng verbundenen Aussagen im Deutschen flüssig verknüpft.
