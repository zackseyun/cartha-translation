base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: de
  text: Seine Söhne Isaak und Ismael begruben ihn in der Höhle von Machpela auf dem Feld Efrons, eines Hetiters und Sohnes Zohars, das Mamre gegenüberliegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das vor Mamre liegt“ beziehungsweise „das Mamre zugewandt liegt“. Der hebräische Ausdruck kann einen Ort bezeichnen, der vor oder gegenüber einem Orientierungspunkt liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: begruben ihn
  rationale: Das Wayyiqtol von קבר führt die Erzählung mit einem vergangenen Ereignis fort; das Objektpronomen bezieht sich auf Abraham.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Seine Söhne Isaak und Ismael
  rationale: Die deutsche Wortstellung gibt die appositionelle Beziehung natürlich wieder; das Suffix bezeichnet beide als Abrahams Söhne.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: in der Höhle von Machpela
  rationale: Im Zusammenhang einer Bestattung ist deutsches „in“ idiomatisch; Machpela wird als Eigenname transliteriert.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: auf dem Feld Efrons
  rationale: Die zweite Ortsangabe präzisiert die Lage der Höhle. Bei „Feld“ ist im Deutschen „auf“ die natürliche lokale Präposition.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: des Sohnes Zohars, des Hetiters
  rationale: Die Genitiv-Apposition bewahrt die Abstammungsangabe und die ethnische Bezeichnung; „Hetiter“ ist die übliche deutsche Form.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: das Mamre gegenüberliegt
  rationale: Die geografische Wendung עַל־פְּנֵי kann eine Lage vor, gegenüber oder mit Ausrichtung auf einen Ort bezeichnen. „gegenüberliegt“ ist verständlich, ohne eine Himmelsrichtung hinzuzufügen.
