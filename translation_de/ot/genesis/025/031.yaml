  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: de
  text: 'Jakob sagte: »Verkaufe mir heute dein Erstgeburtsrecht.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verkaufe mir mit heutigem Tag dein Erstgeburtsrecht.« Die Formulierung kann eine sofort wirksame, verbindliche Übereignung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Wayyiqtol führt die Erzählung fort; im natürlichen modernen Deutsch gibt das Präteritum »sagte« dies ohne ein zusätzliches »und« wieder.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Die im Deutschen herkömmliche Namensform wird verwendet.
- source_word: מִכְרָה
  choice: Verkaufe
  rationale: Der Imperativ von מכר wird direkt und idiomatisch mit »Verkaufe« wiedergegeben; das paragogische He verlangt hier keine eigene Übersetzung.
- source_word: כַיּוֹם
  choice: noch heute
  rationale: Die Wendung kann »heute«, »noch heute« oder »mit heutigem Tag« bedeuten. »Noch heute« bringt die verlangte unmittelbare Transaktion im natürlichen Deutsch zum Ausdruck.
- source_word: אֶת
  choice: '[Akkusativmarker, unübersetzt]'
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und hat hier keine eigenständige deutsche Entsprechung.
- source_word: בְּכֹרָתְךָ
  choice: dein Erstgeburtsrecht
  rationale: בְּכֹרָה bezeichnet die mit dem Erstgeborenenstatus verbundenen Rechte und Vorrechte; »Erstgeburtsrecht« ist dafür die präzise und geläufige deutsche Bezeichnung.
- source_word: לִי
  choice: mir
  rationale: Der hebräische Ausdruck bezeichnet Jakob als Empfänger der Veräußerung; »mir« entspricht der deutschen Konstruktion »jemandem etwas verkaufen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Noch heute« ist idiomatisch und erhält den zeitlichen beziehungsweise rechtsverbindlichen Nachdruck von כַיּוֹם; die mögliche formellere Lesart wird in der Fußnote bewahrt.
