  naturalness: „Jokschan zeugte Scheba und Dedan“ ist knapp, verständlich und in einem genealogischen Bibeltext idiomatisch. Die bloße Namensaufzählung ohne Artikel ist im Deutschen bei solchen genealogischen Listen natürlich.
