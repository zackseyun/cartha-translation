base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: de
  text: Jokschan zeugte Scheba und Dedan. Die Söhne Dedans waren Assurim[a], Letuschim und Leummim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die drei Namen können Sippen- oder Volksnamen bezeichnen. Auch die Umschreibungen »Aschurim«, »Lethuschim« und »Leumim« finden sich.
    reason: Bewahrt die Unsicherheit über die Referenz der hebräischen Pluralformen und nennt gebräuchliche alternative Umschriften, ohne die Namen im Haupttext als Ethnonyme festzulegen.
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Jokschan
  rationale: Eigenname in der im Deutschen üblichen biblischen Form.
- source_word: יָלַד
  choice: zeugte
  rationale: Gibt im genealogischen Zusammenhang die männliche Abstammung knapp und präzise wieder; die traditionelle Form ist im heutigen Deutsch weiterhin verständlich.
- source_word: שְׁבָא
  choice: Scheba
  rationale: Eigenname in üblicher deutscher Bibelschreibung.
- source_word: דְּדָן
  choice: Dedan
  rationale: Eigenname in üblicher deutscher Bibelschreibung.
- source_word: בְנֵי
  choice: Söhne
  rationale: Entspricht der ausdrücklich maskulinen Pluralform; im genealogischen Kontext können auch Nachkommen oder von ihnen abstammende Gruppen gemeint sein.
- source_word: הָיוּ
  choice: waren
  rationale: Schlichte Kopula zur Einführung der Namen beziehungsweise Gruppen.
- source_word: אַשּׁוּרִם
  choice: Aschuriter
  rationale: Die Pluralform wird als Bezeichnung einer Sippe oder Volksgruppe wiedergegeben; die genaue Einordnung bleibt unsicher.
- source_word: לְטוּשִׁים
  choice: Letuschiter
  rationale: Als Sippen- oder Volksname verstanden und entsprechend in deutscher Form wiedergegeben.
- source_word: לְאֻמִּים
  choice: Leummiter
  rationale: Im Kontext als Eigenname einer Sippe oder Volksgruppe behandelt, nicht als das ähnlich klingende Gattungswort für Völker.
