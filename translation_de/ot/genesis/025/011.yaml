  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: de
  text: Nach Abrahams Tod segnete Gott Isaak, Abrahams Sohn, und Isaak wohnte bei Beer-Lahai-Roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi ist der Name eines Brunnens; der hebräische Name wurde bereits in 1. Mose 16,14 eingeführt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: Nach Abrahams Tod
  rationale: Die deutsche Zeitangabe gibt den hebräischen Erzählanschluss natürlich und knapp wieder; ein wörtliches »Und es geschah« wäre hier im modernen Deutschen unnötig schwerfällig.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: segnete Gott
  rationale: ברך bezeichnet hier eindeutig das Segnen, und אֱלֹהִים wird in diesem Erzählzusammenhang angemessen mit »Gott« wiedergegeben.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: dessen Sohn Isaak
  rationale: Das Pronomen bezieht sich auf Abraham. »Dessen Sohn Isaak« macht diesen Bezug im Deutschen eindeutig und bewahrt die ausdrückliche Kennzeichnung Isaaks als Abrahams Sohn.
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישב bezeichnet hier den Wohn- oder Aufenthaltsort Isaaks; »wohnte« ist gegenwärtiges, natürliches Standarddeutsch.
- source_word: עִם
  choice: bei
  rationale: Vor dem Ortsnamen drückt עִם räumliche Nähe aus. »Bei« ist im Deutschen idiomatisch und vermeidet das irreführende wörtliche »mit«.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Der bereits eingeführte Name des Brunnens wird transliteriert und nicht übersetzt; die Bindestriche verdeutlichen den zusammengesetzten Namen.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים im erzählenden Zusammenhang
  choice: Gott
  alternative: die Gottheit
  rationale: Der Singularbezug ist im Kontext eindeutig; »Gott« ist die klare, gewöhnliche und theologisch nicht einengende Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Erzählfluss wird ohne die im Deutschen schwerfällige Formel »Und es geschah« wiedergegeben. Die Fußnote erläutert den sonst möglicherweise undurchsichtigen Ortsnamen.
