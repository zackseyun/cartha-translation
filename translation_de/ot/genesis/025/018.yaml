id: GEN.25.18
reference: Genesis 25:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: de
  text: Sie siedelten von Hawila bis Schur, das Ägypten gegenüberliegt, auf dem Weg nach Assur[b]. Allen seinen Brüdern gegenüber ließ er sich nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist mehrdeutig. Er kann auch bedeuten: „Er lebte im Widerstreit mit allen seinen Brüdern“; wörtlicher wäre: „Er fiel vor allen seinen Brüdern.“'
    reason: alternative_reading
  - marker: b
    text: Assur kann hier auch als „Assyrien“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Sie siedelten
  rationale: Das Qal-Wayyiqtol im Plural bezeichnet das Wohnen beziehungsweise Ansiedeln; „siedelten“ passt zur Beschreibung des Siedlungsgebiets und ist im Deutschen knapp und verständlich.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: von Hawila bis Schur
  rationale: Die Bereichsformel bezeichnet die räumliche Ausdehnung des von Ismaels Nachkommen bewohnten Gebiets.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: das Ägypten gegenüberliegt
  rationale: עַל־פְּנֵי bedeutet hier räumlich „vor/gegenüber“. „Gegenüberliegt“ wahrt den geografischen Sinn, ohne eine nicht ausdrücklich genannte Himmelsrichtung festzulegen.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: auf dem Weg nach Assur
  rationale: Die Konstruktion beschreibt die Richtung der Reise nach Assur; die deutsche Wendung gibt dies natürlich wieder. Der Eigenname wird als „Assur“ beibehalten.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: allen seinen Brüdern gegenüber
  rationale: 'Die Formulierung bleibt bewusst offen: Sie kann eine räumliche Lage, ein Gegenüber oder eine feindselige Beziehung bezeichnen. Das Deutsche bewahrt diese Mehrdeutigkeit weitgehend.'
- source_word: נָפָל
  choice: ließ er sich nieder
  rationale: Obwohl נפל gewöhnlich „fallen“ bedeutet, wird es hier im Zusammenhang mit dem Siedlungsgebiet idiomatisch als Niederlassen verstanden. Der Singular nimmt wahrscheinlich Ismael als Repräsentanten seiner Nachkommen wieder auf.
theological_decisions:
- issue: Deutung von עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Allen seinen Brüdern gegenüber ließ er sich nieder.
  alternative: Er lebte im Widerstreit mit allen seinen Brüdern. / Er fiel vor allen seinen Brüdern.
  rationale: Der hebräische Ausdruck ist umstritten. Die Hauptfassung wahrt das räumliche beziehungsweise relationale „gegenüber“ und vermeidet es, aufgrund von Genesis 16,12 Feindseligkeit ausdrücklich in den Text einzutragen. Die möglichen adversativen und wörtlichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Ortsnamen folgen geläufigen deutschen Formen. Die Mehrdeutigkeit des letzten Satzes wird im Haupttext nicht einseitig auf Feindseligkeit festgelegt.
