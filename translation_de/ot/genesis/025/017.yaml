source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: de
  text: 'Dies waren die Lebensjahre Ismaels: 137 Jahre. Und er verschied[a] und starb und wurde zu seinem Volk versammelt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet hier das Verscheiden beziehungsweise Aushauchen des Lebens und ist vom folgenden „starb“ verschieden; deshalb werden beide Verben wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: „Zu seinem Volk versammelt“ ist eine hebräische Todesformel. Sie kann die Gemeinschaft mit den Vorfahren, die Bestattung bei den Angehörigen oder beides bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: Dies waren die Lebensjahre Ismaels
  rationale: Die hebräische Zusammenfassungsformel wird in natürlichem deutschem Erzähltempus wiedergegeben; „Lebensjahre“ bewahrt ihre zählende Aussage.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: 137 Jahre
  rationale: Die gestufte hebräische Zahlform wird als exakte, im Deutschen übliche Gesamtzahl wiedergegeben.
- source_word: וַיִּגְוַע
  choice: und er verschied
  rationale: „Verschied“ bezeichnet das Erlöschen des Lebens und bleibt vom unmittelbar folgenden „starb“ unterscheidbar.
- source_word: וַיָּמָת
  choice: und starb
  rationale: Das zweite Todesverb wird ausdrücklich beibehalten und nicht mit dem vorhergehenden Verb zusammengezogen.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: und wurde zu seinem Volk versammelt
  rationale: Die hebräische Todesformel bleibt als Bild erhalten, ohne sie einseitig als Bestattung oder als jenseitige Wiedervereinigung auszulegen.
theological_decisions:
- issue: Bedeutung der Formel „zu seinem Volk versammelt“
  choice: Die mehrdeutige hebräische Wendung wird wörtlich-bildhaft bewahrt.
  alternative: Deutung ausschließlich als Beisetzung bei den Angehörigen oder ausschließlich als Wiedervereinigung nach dem Tod.
  rationale: Der hebräische Text entscheidet nicht eindeutig zwischen Bestattung im Kreis der Vorfahren, Gemeinschaft mit ihnen nach dem Tod oder einer Verbindung beider Vorstellungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung der Todesverben und die bildhafte Todesformel des Hebräischen werden bewusst erhalten.
