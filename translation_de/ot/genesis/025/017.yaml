  source_fidelity: Die Übersetzung gibt die hebräische Zusammenfassungsformel, die genaue Lebensdauer und die dreigliedrige Todesnotiz vollständig wieder. „Verschied und starb“ bewahrt die bewusste Unterscheidung von וַיִּגְוַע und וַיָּמָת. „Wurde zu seinem Volk versammelt“ erhält die idiomatische und theologisch nicht weiter festgelegte Formel וַיֵּאָסֶף אֶל־עַמָּיו.
  naturalness: Modernes, würdiges Standarddeutsch. Die Verbindung „verschied und starb“ ist im alltäglichen Deutsch zwar bewusst feierlich und redundant wirkend, aber als knappe Todesformel natürlich genug und für die quellenbedingte Verbverdoppelung angemessen. Die Ziffernschreibung „137 Jahre“ ist in diesem sachlichen Kontext gut lesbar.
  terminology: „Lebensjahre“, „verschied“, „starb“ und „zu seinem Volk versammelt“ sind konsistent und registergerecht. Die Fußnoten erläutern die lexikalische Unterscheidung sowie die Mehrdeutigkeit der Todesformel, ohne deren Deutung konfessionell festzulegen. Die Anker stehen an den passenden Ausdrücken.
