source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihr: »Zwei Völker sind in deinem Mutterleib, und aus deinem Inneren werden zwei Volksstämme getrennt hervorgehen. Das eine Volk wird stärker sein als das andere, und der Ältere wird dem Jüngeren dienen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Größere wird dem Kleineren dienen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: שְׁנֵי גיים
  choice: zwei Völker
  rationale: גוי bezeichnet hier die aus den beiden Söhnen hervorgehenden ethnisch-politischen Völker.
- source_word: בְּבִטְנֵךְ
  choice: in deinem Leib
  rationale: בטן kann Bauch oder Mutterleib bezeichnen; im Schwangerschaftskontext ist „Leib“ natürlich und würdevoll.
- source_word: שְׁנֵי לְאֻמִּים
  choice: zwei Volksgemeinschaften
  rationale: Die Wiedergabe unterscheidet לְאֻמִּים von גיים und erhält zugleich den synonymen Parallelismus.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: werden sich aus deinem Inneren voneinander trennen
  rationale: מֵעַיִם bezeichnet das Innere beziehungsweise die inneren Organe; die Form von פרד drückt hier die Trennung der aus ihr hervorgehenden Gemeinschaften aus.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: Das eine Volk wird stärker sein als das andere
  rationale: Die vergleichende Gegenüberstellung und das Verb אמץ werden in natürlichem Deutsch als Überlegenheit an Stärke ausgedrückt.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: der Ältere wird dem Jüngeren dienen
  rationale: Im Zusammenhang mit den Zwillingen bezeichnen רַב und צָעִיר am natürlichsten den älteren und den jüngeren Sohn; עבד mit dem direkten Objekt bedeutet „dienen“.
theological_decisions:
- issue: Bedeutung von וְרַב יַעֲבֹד צָעִיר
  choice: der Ältere wird dem Jüngeren dienen
  alternative: der Größere wird dem Geringeren dienen
  rationale: Der unmittelbare Zusammenhang mit den Zwillingen legt die Deutung nach dem Geburtsalter nahe. Da die Adjektive auch Rang oder Größe bezeichnen können, bleibt diese weiter gefasste Lesart in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus zwischen „Völker“ und „Volksgemeinschaften“ bleibt erkennbar; die prophetische Aussage wird klar formuliert, ohne ihre lexikalische Mehrdeutigkeit zu verdecken.
