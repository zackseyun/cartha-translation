revisions:
- from: 'Und Jahwe sagte zu ihr: »Zwei Völker sind in deinem Leib, und zwei Volksgemeinschaften werden sich aus deinem Inneren voneinander trennen. Das eine Volk wird stärker sein als das andere, und der Ältere wird dem Jüngeren dienen.«[a]'
  to: 'Und Jahwe sagte zu ihr: »Zwei Völker sind in deinem Mutterleib, und aus deinem Inneren werden zwei Volksstämme getrennt hervorgehen. Das eine Volk wird stärker sein als das andere, und der Ältere wird dem Jüngeren dienen.«[a]'
  rationale: Die Revision ersetzt den historisch belasteten und unnatürlichen Ausdruck „Volksgemeinschaften“, glättet die Aussage über das getrennte Hervorgehen und präzisiert den Schwangerschaftskontext. Die alternative Wiedergabe der letzten Klausel bleibt als Fußnote erhalten und bewahrt die semantische Offenheit der hebräischen Adjektive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:25:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Aussagen geben den hebräischen Text zutreffend wieder: JHWH spricht zu Rebekka, zwei Gruppen befinden sich in ihrem Mutterleib, sie gehen auseinander hervor, eine wird stärker sein, und der Ältere dient dem Jüngeren. „Volksgemeinschaften“ ist jedoch keine neutrale, zeitgemäße Wiedergabe von לְאֻמִּים und ist wegen seiner spezifischen historischen Belastung im Deutschen ungeeignet. Die Formulierung zur Trennung kann zudem unmittelbarer an die Herkunft aus ihrem Inneren und an die Trennung der beiden Gruppen gebunden werden.'
  naturalness: „Zwei Volksstämme“ ist modernes, verständliches Standarddeutsch und bewahrt den parallelen, aber nicht völlig identischen Ausdruck gegenüber „Völker“. „Aus deinem Inneren werden zwei Volksstämme getrennt hervorgehen“ ist idiomatischer als „werden sich aus deinem Inneren voneinander trennen“. „Mutterleib“ ist im Schwangerschaftskontext präziser als das mehrdeutige „Leib“.
  terminology: „Jahwe“, „Völker“, „Mutterleib“, „Volksstämme“, „stärker“ und „dienen“ sind angemessen. Die Fußnote sollte mit „der Größere … dem Kleineren“ die lexikalische Offenheit von רַב/צָעִיר besser bewahren; „Geringeren“ verengt die Alternative unnötig auf geringeren Rang oder Wert.
  issues:
  - severity: high
    issue: „Volksgemeinschaften“
    rationale: Der Ausdruck ist im Deutschen stark durch den nationalsozialistischen Sprachgebrauch belastet und wirkt im modernen Standarddeutsch weder neutral noch natürlich. Er ist für לְאֻמִּים nicht erforderlich; „Volksstämme“ gibt die Gruppenbezeichnung passend wieder.
  - severity: medium
    issue: „werden sich aus deinem Inneren voneinander trennen“
    rationale: Die Wortstellung und die doppelte Markierung der Trennung wirken schwerfällig. Eine Formulierung mit getrenntem Hervorgehen wahrt sowohl die Herkunft aus ihrem Inneren als auch die im Niphal ausgedrückte Trennung.
  - severity: low
    issue: Fußnotenalternative „der Größere … dem Geringeren“
    rationale: „Geringer“ kann im Deutschen eine Wert- oder Rangminderung nahelegen. „Kleinerer“ hält die offene Gegenüberstellung von groß/klein beziehungsweise älter/jünger besser fest.
  revised_text: 'Und Jahwe sagte zu ihr: »Zwei Völker sind in deinem Mutterleib, und aus deinem Inneren werden zwei Volksstämme getrennt hervorgehen. Das eine Volk wird stärker sein als das andere, und der Ältere wird dem Jüngeren dienen.«[a]'
