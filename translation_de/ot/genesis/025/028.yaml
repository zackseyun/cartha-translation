base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: de
  text: Isaak liebte Esau, weil er gern Wildbret aß[a]; Rebekka aber liebte Jakob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn Wildbret war in seinem Mund“. Die Wendung bedeutet wahrscheinlich, dass Isaak gern Wildbret aß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: liebte
  rationale: Das Qal-Wayyiqtol bezeichnet hier eine vergangene Erzählhandlung; das deutsche Präteritum ist natürlich und lässt den Aspekt der Zuneigung offen.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt den Grund für Isaaks Liebe ein. „Denn“ bewahrt den erklärenden Anschluss, ohne einen nicht vorhandenen Zeitmarker einzuführen.
- source_word: צַיִד
  choice: Wildbret
  rationale: צַיִד bezeichnet erlegtes Wild beziehungsweise daraus gewonnene Nahrung. „Wildbret“ ist präziser als „Wild“, das auch lebende Tiere meinen kann, und enger am Essenskontext.
- source_word: בְּפִיו
  choice: war in seinem Mund
  rationale: Die konkrete hebräische Formulierung lautet wörtlich „in seinem Mund“. Sie wird im Haupttext bewahrt; die wahrscheinliche Bedeutung wird in der Fußnote erläutert.
- source_word: וְרִבְקָה
  choice: Rebekka aber
  rationale: Das וְ verbindet formal die Sätze, markiert hier jedoch einen deutlichen Gegensatz zwischen den Vorlieben der Eltern. Nachgestelltes „aber“ ist dafür im Deutschen natürlich.
- source_word: אֹהֶבֶת
  choice: liebte
  rationale: Das Partizip kann eine andauernde oder charakteristische Haltung ausdrücken. Im deutschen Erzählzusammenhang gibt „liebte“ dies natürlich wieder.
