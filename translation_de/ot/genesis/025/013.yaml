  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: de
  text: 'Und dies sind die Namen der Söhne Ismaels nach ihren Namen, nach ihren Abstammungslinien[a]: Ismaels Erstgeborener war Nebajot; seine weiteren Söhne waren Kedar, Adbeel und Mibsam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihren Generationen« beziehungsweise »nach ihren Familienlinien«. Das hebräische Wort bezeichnet hier genealogische Abstammungsfolgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Bewahrt die einleitende hebräische Konjunktion und gibt die Listenformel in natürlichem, würdigem Deutsch wieder.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: die Namen der Söhne Ismaels
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Genitivverbindung.
- source_word: בִּשְׁמֹתָם
  choice: nach ihren Namen
  rationale: Das präpositionale Element wird eng am Hebräischen wiedergegeben und die formelhafte Wiederholung von »Namen« bleibt erhalten.
- source_word: לְתוֹלְדֹתָם
  choice: ihren Abstammungslinien
  rationale: Im genealogischen Zusammenhang bezeichnet תוֹלְדוֹת die geordnete Abstammung beziehungsweise Familienfolge; »Abstammungslinien« ist modern und verständlich.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: Ismaels Erstgeborener
  rationale: Gibt die Genitivverbindung knapp und eindeutig wieder; das ergänzte »war« macht den deutschen Satz vollständig.
- source_word: נְבָיֹת
  choice: Nebajot
  rationale: Im Deutschen etablierte Transliteration des hebräischen Namens.
- source_word: קֵדָר
  choice: Kedar
  rationale: Im Deutschen etablierte Transliteration des hebräischen Namens.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Im Deutschen etablierte Transliteration des hebräischen Namens.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Im Deutschen etablierte Transliteration des hebräischen Namens.
