translation_notes:
  register: Moderne, würdige genealogische Prosa. Die formelhafte Wiederholung von »Namen« bleibt erhalten; bei der Namensreihe ersetzt »dann« die im Deutschen schwerfällige wiederholte Reihung mit »und«, ohne die Reihenfolge zu verändern.
