  source_fidelity: Die Übersetzung gibt die genealogische Listenformel sowie die Namensfolge grundsätzlich zutreffend wieder. Die Verbindung von בִּשְׁמֹתָם und לְתוֹלְדֹתָם sollte jedoch nicht mit einem deutschen „und“ als gleichrangige Nominalverbindung ausgelegt werden, sondern die zweigliedrige Formel erkennbar bewahren. Die Abgrenzung Nebajots als Erstgeborenem sollte syntaktisch eindeutig sein.
  naturalness: Die vorgeschlagene Revision bleibt moderne, würdige genealogische Prosa. Die klare Aufteilung des zweiten Satzes verhindert, dass Kedar, Adbeel und Mibsam grammatisch ebenfalls als „Erstgeborener“ gelesen werden könnten.
  terminology: „Ismael“, „Nebajot“, „Kedar“, „Adbeel“ und „Mibsam“ sind im Deutschen geeignete Namensformen. „Abstammungslinien“ ist im genealogischen Kontext eine angemessene Wiedergabe von תּוֹלְדֹת; die Fußnote wahrt die mögliche Alternative „Generationen“.
