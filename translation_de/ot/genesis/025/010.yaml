  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: de
  text: Das Feld, das Abraham von den Söhnen Hets[a] gekauft hatte – dort wurden Abraham und seine Frau Sara begraben.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Hetitern« statt »den Söhnen Hets«. Der hebräische Ausdruck ist wörtlich familiär beziehungsweise ethnisch und kann das Volk der Hetiter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher in der Satzform: »Dort wurde Abraham begraben und Sara, seine Frau.« Das hebräische Verb steht im Singular vor dem zusammengesetzten Subjekt.'
    reason: previous_rendering
  - marker: c
    text: 'Oder mit Satzgrenze: »Das Feld, das Abraham von den Söhnen Hets gekauft hatte. Dort …« Der erste Teil setzt den Satz aus dem vorhergehenden Vers fort.'
    reason: previous_rendering
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Der bestimmte Ausdruck bezeichnet das bereits erwähnte Grundstück; »das Feld« ist im Zusammenhang klar und quellennah.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen leitet den auf »Feld« bezogenen Relativsatz natürlich ein.
- source_word: קָנָה
  choice: gekauft hatte
  rationale: Im Zusammenhang des Grundstückserwerbs bezeichnet das Verb einen Kauf. Das Plusquamperfekt verdeutlicht im Deutschen, dass der Kauf vor der Bestattung lag.
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition kennzeichnet hier die Verkäufer beziehungsweise die Herkunft des erworbenen Grundstücks; »von« gibt dies knapp und idiomatisch wieder.
- source_word: בְּנֵי חֵת
  choice: den Söhnen Hets
  rationale: Dies bewahrt die wörtliche familiär-ethnische Ausdrucksweise und den Bezug auf den Namen Het; die ethnische Wiedergabe »Hetitern« steht in der Fußnote.
- source_word: שָׁמָּה
  choice: dort
  rationale: Das Ortsadverb verweist auf das zuvor genannte Feld als Begräbnisort.
- source_word: קֻבַּר
  choice: wurden … begraben
  rationale: Der hebräische passive Singular steht vor einem zusammengesetzten Subjekt, was im Hebräischen möglich ist. Natürliches Deutsch verlangt hier den Plural, da Abraham und Sara beide bestattet wurden.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: und seine Frau Sara
  rationale: Die deutsche Wortstellung ist natürlich und gibt sowohl Saras Namen als auch ihre Beziehung zu Abraham eindeutig wieder.
