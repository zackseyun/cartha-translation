  text: 'These are the days of the years of Abraham’s life that he lived: one hundred seventy-five years[a].'
translation:
  language: de
  text: 'Dies sind die Lebensjahre Abrahams, die er lebte: 175 Jahre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und dies sind die Tage der Jahre von Abrahams Leben, die er lebte.“'
    reason: Die Fußnote dokumentiert die im Deutschen ungebräuchliche, aber im Hebräischen ausdrücklich entfaltete Wendung für Abrahams gesamte Lebensdauer.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativ leitet eine zusammenfassende Angabe ein. Im Deutschen ist „Dies ist“ hier natürlicher als ein wörtliches „Und dies sind“.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: die Zahl der Lebensjahre Abrahams
  rationale: 'Wörtlich steht eine gestufte Genitivverbindung: „die Tage der Jahre des Lebens Abrahams“. Die gewählte Formulierung gibt idiomatisch die gemeinte Lebensdauer wieder und bewahrt den Charakter einer abschließenden Altersangabe.'
- source_word: אֲשֶׁר חָי
  choice: Er lebte
  rationale: Der Relativsatz wiederholt und betont die tatsächlich durchlebte Lebenszeit. Ein eigener kurzer Satz bildet diese Hervorhebung in natürlichem Deutsch ab.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: 175 Jahre
  rationale: Die additive hebräische Zahlenfolge 100 + 70 + 5 wird nach heutiger deutscher Schreibweise als Gesamtzahl wiedergegeben.
