  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: de
  text: Und die Söhne Midians waren Efa, Efer, Henoch[a], Abida und Eldaa. Alle diese waren Söhne Keturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Chanoch; traditionell deutsch Henoch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Und die Söhne Midians
  rationale: Die Status-constructus-Verbindung wird genealogisch präzise mit „Söhne“ wiedergegeben; der Genitiv „Midians“ ist im Deutschen natürlich und formnah.
- source_word: עֵיפָה
  choice: Efa
  rationale: Etablierte deutsche Form des hebräischen Personennamens.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Direkte, im Deutschen gut lesbare Wiedergabe des hebräischen Namens.
- source_word: וַחֲנֹךְ
  choice: Henoch[a]
  rationale: „Henoch“ ist die etablierte deutsche Bibelnamensform für חֲנֹךְ; die Fußnote macht die näher am Hebräischen liegende Umschrift transparent.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Etablierte deutsche Wiedergabe des Eigennamens.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Die Form gibt den hebräischen Eigennamen in üblicher deutscher Schreibweise wieder.
- source_word: כָּל אֵלֶּה
  choice: Alle diese
  rationale: Bewahrt die zusammenfassende und ausdrücklich umfassende Aussage des Hebräischen.
- source_word: בְּנֵי קְטוּרָה
  choice: waren Söhne Keturas
  rationale: Die Wiederholung von „Söhne“ erhält die genealogische Formulierung und den Bezug auf Ketura.
