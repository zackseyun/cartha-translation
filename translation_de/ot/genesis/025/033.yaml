  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Begriffe zutreffend wieder: Jakobs Forderung, Esaus Eid und der Verkauf des Erstgeburtsrechts. Die Ergänzung „Esau“ ist zur deutschen Bezugsklarheit vertretbar. Das Objekt „es“ bei „schwor Esau es ihm“ ist jedoch im Deutschen unnatürlich und wird vom hebräischen Verb nicht verlangt.'
  naturalness: „Schwor Esau es ihm“ ist keine idiomatische moderne deutsche Formulierung. „Da schwor Esau ihm“ ist natürlich, eindeutig und bewahrt die knappe erzählerische Folge.
  terminology: „Erstgeburtsrecht“ ist die passende etablierte Wiedergabe von בְּכֹרָה. Die Kulturnote erklärt den Begriff sachlich, ohne über den Text hinauszugehen. Die Fußnote zu „heute“ sollte keine Bedeutung wie „mit sofortiger Wirkung“ als Alternative ausgeben, da dies die zeitliche Wendung stärker ausdeutet als erforderlich.
