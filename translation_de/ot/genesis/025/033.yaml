  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: de
  text: 'Jakob sagte: „Schwöre mir heute[a]!“ Da schwor Esau ihm und verkaufte Jakob sein Erstgeburtsrecht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an diesem Tag“.'
    reason: lexical_alternative
  - marker: b
    text: Das Erstgeburtsrecht umfasste den besonderen Rang und die damit verbundenen Rechte des erstgeborenen Sohnes.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: Schwöre es mir
  rationale: Der Imperativ fordert unmittelbar einen Eid gegenüber Jakob. Das im Deutschen nötige „es“ nimmt die verlangte Zusage aus dem Zusammenhang auf, ohne ihren Inhalt auszudeuten.
- source_word: כַּיּוֹם
  choice: heute
  rationale: Die Wendung bezeichnet idiomatisch den gegenwärtigen Tag und kann zugleich die sofortige Verbindlichkeit betonen; „heute“ ist die natürlichste moderne Wiedergabe.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: Da schwor Esau es ihm
  rationale: Die Wiederholung von „schwören“ bewahrt die enge verbale Verbindung zur Forderung. Der im Hebräischen nur implizite Handelnde wird im Deutschen als Esau benannt, damit der Bezug eindeutig bleibt.
- source_word: וַיִּמְכֹּר
  choice: verkaufte
  rationale: Das Verb מכר bezeichnet ausdrücklich einen Verkauf und bewahrt den geschäftlichen Charakter der Übertragung.
- source_word: בְּכֹרָתוֹ
  choice: sein Erstgeburtsrecht
  rationale: בכרה bezeichnet den besonderen Rang und die damit verbundenen Rechte des Erstgeborenen. „Erstgeburtsrecht“ ist präzise und im Deutschen verständlich.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Die Präposition ל markiert Jakob als Empfänger; bei deutscher Satzstellung wird dies natürlich mit dem Dativ „Jakob“ ausgedrückt.
theological_decisions:
- issue: Art der Übertragung von בְּכֹרָה
  choice: verkaufte Jakob sein Erstgeburtsrecht
  alternative: verkaufte Jakob seine Rechte als Erstgeborener
  rationale: Der Text beschreibt eine konkrete, rechtsähnliche Übertragung im Rahmen eines Verkaufs. „Erstgeburtsrecht“ wahrt den familienrechtlichen Begriff, ohne spätere theologische Folgerungen in den Vers hineinzulesen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede bleibt knapp und nachdrücklich. „Esau“ wird zur eindeutigen Zuordnung des im Hebräischen enthaltenen Subjekts ausdrücklich genannt.
