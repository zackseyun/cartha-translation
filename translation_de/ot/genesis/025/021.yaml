base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: de
  text: Isaak betete zum HERRN für seine Frau[a], denn sie war unfruchtbar. Der HERR erhörte ihn[b], und Rebekka, seine Frau, wurde schwanger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seiner Frau gegenüber“. Im Zusammenhang ist ein Gebet im Blick auf sie beziehungsweise für sie gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verwendet für „betete“ und „erhörte“ dieselbe Wortwurzel: Isaak „flehte/bat inständig“, und der HERR „ließ sich von ihm erbitten“.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: betete / erhörte ihn
  rationale: 'Beide Formen gehen auf dieselbe hebräische Wurzel zurück und bilden eine bewusste Entsprechung: Isaak bittet, und der HERR lässt sich von ihm erbitten. Die deutsche Wiedergabe ist natürlich und verständlich; eine Fußnote macht die im Hebräischen engere sprachliche Verbindung sichtbar.'
- source_word: לַיהוָה / יְהוָה
  choice: zum HERRN / der HERR
  rationale: Der Gottesname JHWH wird nach verbreiteter deutscher Bibelkonvention ehrfürchtig mit HERR in Kapitälchen wiedergegeben.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: für seine Frau
  rationale: לְנֹכַח bedeutet grundsätzlich „gegenüber/vor“, bezeichnet hier im Zusammenhang des Gebets aber wahrscheinlich dessen Bezug beziehungsweise Fürsprache für seine Frau. „Für seine Frau“ gibt diesen Sinn idiomatisch wieder, ohne die wörtlich-räumliche Möglichkeit zu verschweigen.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: Das Wort bezeichnet hier die fehlende Fähigkeit, ein Kind zu empfangen. „Unfruchtbar“ ist im Deutschen präzise und im biblischen Erzählstil geläufig.
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Diese Formulierung gibt das Eintreten der Schwangerschaft klar und in natürlichem modernem Deutsch wieder.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: „Rebekka“ ist die etablierte deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Die wiederholte Wurzel עתר und Gottes Reaktion auf Isaaks Gebet
  choice: Der HERR erhörte ihn
  alternative: Der HERR ließ sich von ihm erbitten
  rationale: „Erhörte ihn“ drückt die göttliche Antwort natürlich aus, ohne einen mechanischen Zwang anzudeuten. Die formal nähere Alternative und das Wortspiel werden in der Fußnote bewahrt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ folgt der etablierten ehrfürchtigen deutschen Wiedergabekonvention. Die Übersetzung identifiziert den Ausdruck dabei nicht mit einem bloßen Titel, sondern gibt den im Ausgangstext stehenden Gottesnamen wieder.
- issue: Bezug von לְנֹכַח אִשְׁתּוֹ
  choice: für seine Frau
  alternative: seiner Frau gegenüber
  rationale: Im Gebetszusammenhang liegt Fürsprache beziehungsweise ein Gebet im Blick auf die Frau nahe. Da die Präposition auch räumlich „gegenüber“ bedeuten kann, bleibt diese echte Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Erzählung bleibt knapp; unnötige Verstärkungen wie „inständig“ werden vermieden. Die hebräische Mehrdeutigkeit und das Wortspiel werden durch Fußnoten zugänglich gemacht.
