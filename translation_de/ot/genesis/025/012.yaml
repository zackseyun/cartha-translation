  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: de
  text: Und dies ist die Geschlechterfolge Ismaels[a], des Sohnes Abrahams, den Hagar, die Ägypterin, Saras Sklavin[b], dem Abraham gebar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dies sind die Nachkommen Ismaels“ beziehungsweise „Dies ist die Familiengeschichte Ismaels“. Das hebräische Wort תּוֹלְדוֹת (toledot) ist eine wiederkehrende Gliederungsformel im Buch Genesis und kann Abstammung, Nachkommenschaft oder Familiengeschichte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Saras Magd“. Das hebräische שִׁפְחָה bezeichnet eine unfreie Dienerin beziehungsweise Sklavin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies ist
  rationale: Das וְ verbindet den neuen Abschnitt mit dem Vorangehenden; im Deutschen gibt „Und“ diese Verknüpfung ohne einen nicht ausdrücklich vorhandenen Zeitbegriff wieder. Der Singular richtet sich idiomatisch nach „Geschlechterfolge“.
- source_word: תֹּלְדֹת
  choice: Geschlechterfolge
  rationale: Der wiederkehrende Genesis-Begriff bezeichnet je nach Zusammenhang Abstammung, Nachkommenschaft oder die daraus hervorgehende Familiengeschichte. „Geschlechterfolge“ bewahrt die formelhafte und relativ weite Bedeutung.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Der Personenname wird nach der üblichen deutschen biblischen Namensform wiedergegeben.
- source_word: בֶּן אַבְרָהָם
  choice: des Sohnes Abrahams
  rationale: Die Apposition wird in natürlichem Deutsch als Genitivfügung wiedergegeben und eindeutig auf Ismael bezogen.
- source_word: אֲשֶׁר יָלְדָה
  choice: den … gebar
  rationale: Die feminine Verbform bezeichnet Hagar ausdrücklich als die Gebärende; das Relativpronomen bezieht sich auf Ismael.
- source_word: הָגָר הַמִּצְרִית
  choice: Hagar, die Ägypterin
  rationale: Die Herkunftsbezeichnung wird als substantivierte Nationalitätsbezeichnung in Apposition zu Hagar wiedergegeben.
- source_word: שִׁפְחַת שָׂרָה
  choice: Saras Sklavin
  rationale: שִׁפְחָה bezeichnet eine unfreie weibliche Person im Besitz beziehungsweise Haushalt einer Herrin. „Sklavin“ macht diesen rechtlich-sozialen Status deutlicher als das traditionell mildere „Magd“.
- source_word: לְ/אַבְרָהָם
  choice: Abraham
  rationale: Bei „jemandem ein Kind gebären“ bezeichnet לְ den Vater. Im Deutschen kann der unmarkierte Name an dieser Stelle idiomatisch als Dativ verstanden werden; die Wiederholung Abrahams bleibt wie im Hebräischen erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Überschriftsformel bleibt erkennbar; „Sklavin“ vermeidet eine beschönigende Wiedergabe des sozialen Status. Die verschachtelte Apposition folgt der feierlichen genealogischen Satzstruktur des Hebräischen, bleibt aber verständlich.
