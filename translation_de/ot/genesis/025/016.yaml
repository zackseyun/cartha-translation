base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: de
  text: 'Das sind die Söhne Ismaels, und das sind ihre Namen nach ihren Siedlungen und ihren Lagern[a]: zwölf Fürsten entsprechend ihren Volksgruppen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ihren Dörfern und in ihren Lagern«. Die hebräische Präposition kann hier entweder die Zuordnung nach Orten oder den Aufenthaltsort bezeichnen; die beiden Substantive können auch mit »Dörfer« und »befestigte Lager« wiedergegeben werden.'
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: 'Oder: »zwölf Oberhäupter nach ihren Volksgruppen«; auch »Anführer« statt »Fürsten« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Das sind
  rationale: Die demonstrative Wendung leitet hier die abschließende Zusammenfassung der vorausgehenden Namensliste ein; im Deutschen ist das Präsens natürlich.
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: die Söhne Ismaels
  rationale: Gemeint sind im unmittelbaren Zusammenhang die zuvor namentlich aufgeführten leiblichen Söhne Ismaels, nicht allgemein seine Nachkommen.
- source_word: שְׁמֹתָם
  choice: ihre Namen
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 3. Person Plural.
- source_word: בְּחַצְרֵיהֶם
  choice: nach ihren Siedlungen
  rationale: חָצֵר kann Dörfer, Gehöfte oder sonstige Siedlungen bezeichnen. „Siedlungen“ hält den Ausdruck hinreichend weit; „nach“ versteht die Präposition als Gliederung der Namen nach Orten.
- source_word: וּבְטִירֹתָם
  choice: und ihren Lagern
  rationale: טִירָה bezeichnet hier wahrscheinlich Lager oder befestigte Lagerplätze. „Lager“ ist natürlich und bewahrt den halbnomadischen Bezug, ohne eine Befestigung zwingend vorauszusetzen.
- source_word: נְשִׂיאִם
  choice: Fürsten
  rationale: נָשִׂיא bezeichnet ein Oberhaupt, einen Anführer oder Fürsten. „Fürsten“ wahrt den gehobenen Rang, ohne eine bestimmte spätere Amtsordnung einzutragen.
- source_word: לְאֻמֹּתָם
  choice: für ihre jeweiligen Völkerschaften
  rationale: אֻמָּה bezeichnet eine ethnisch oder verwandtschaftlich bestimmte Volksgruppe. „Völkerschaften“ passt zum genealogisch-tribalen Zusammenhang; „jeweiligen“ gibt die Zuordnung der Fürsten zu den Gruppen idiomatisch wieder.
theological_decisions:
- issue: Art und Rang der zwölf נְשִׂיאִם
  choice: Fürsten
  alternative: Oberhäupter / Anführer
  rationale: Der Text weist den zwölf Söhnen eine herausgehobene Leitungsstellung zu, legt aber keine bestimmte monarchische oder spätere institutionelle Ordnung fest. Die Fußnote hält die sachlich möglichen weniger herrschaftlichen Wiedergaben offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der genealogischen Zusammenfassung, vermeidet aber schwer verständliche Fachbegriffe. Die nicht völlig eindeutige Funktion der Präposition בְּ sowie die Bedeutungsbreite von חָצֵר, טִירָה, נָשִׂיא und אֻמָּה werden in den Fußnoten offengehalten.
