base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: de
  text: Den Söhnen der Nebenfrauen[a], die Abraham hatte, gab Abraham jedoch Geschenke. Noch zu seinen Lebzeiten schickte er sie von seinem Sohn Isaak fort, nach Osten in das Land des Ostens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Konkubinen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in das Land des Ostens“.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Den Söhnen … jedoch
  rationale: Die Dativkonstruktion wird gewahrt; „jedoch“ bringt den Gegensatz zu Isaak als dem Erben im vorigen Vers natürlich zum Ausdruck.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: der Nebenfrauen, die Abraham hatte
  rationale: „Nebenfrauen“ bezeichnet verständlich Frauen mit anerkannter, aber nachgeordneter ehelicher Stellung. Der Relativsatz bildet die hebräische Besitzkonstruktion transparent ab.
- source_word: נָתַן ... מַתָּנֹת
  choice: gab … Geschenke
  rationale: Die einfache Verb-Objekt-Verbindung entspricht dem Hebräischen und passt zum Zusammenhang der Nachlassregelung.
- source_word: וַיְשַׁלְּחֵם
  choice: schickte er sie … fort
  rationale: „Fortschicken“ gibt sowohl das Senden als auch die beabsichtigte räumliche Trennung wieder.
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: von seinem Sohn Isaak fort
  rationale: Die Formulierung bewahrt die ausdrückliche Trennung von Isaak, ohne den hebräischen Ausdruck unnötig zu verstärken.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: Noch zu seinen Lebzeiten
  rationale: Dies gibt klar und idiomatisch wieder, dass Abraham die Anordnung vor seinem Tod traf.
- source_word: קֵדְמָה
  choice: nach Osten
  rationale: Die Richtungsform bezeichnet eine Bewegung ostwärts.
- source_word: אֶל אֶרֶץ קֶדֶם
  choice: in das Land im Osten
  rationale: Die Wendung bezeichnet das östlich gelegene Gebiet; die Übersetzung ist im heutigen Deutsch natürlich und bewahrt zugleich die räumliche Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Osten“ bildet die hebräische Verbindung von Richtungsangabe und Gebietsbezeichnung ab; „Nebenfrauen“ ist allgemein verständlicher als das fachsprachlichere „Konkubinen“.
