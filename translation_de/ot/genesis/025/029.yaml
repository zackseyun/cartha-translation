  text: וַ/יָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַ/יָּבֹ֥א עֵשָׂ֛ו מִן הַ/שָּׂדֶ֖ה וְ/ה֥וּא עָיֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: de
  text: Jakob kochte gerade einen Eintopf[a], als Esau vom Feld kam; er war erschöpft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jakob kochte einen Eintopf.“ Das hebräische Verb kann hier speziell das Kochen durch Sieden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: kochte gerade
  rationale: Das Verb זיד bezeichnet hier die Zubereitung durch Kochen. Die Verlaufsnähe von „kochte gerade“ gibt die im Hintergrund laufende Handlung natürlich wieder.
- source_word: נָזִיד
  choice: einen Eintopf
  rationale: נָזִיד bezeichnet ein gekochtes Gericht, besonders einen Eintopf; „Eintopf“ ist im heutigen Deutsch klar und konkret.
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bedeutet kommen beziehungsweise eintreten. Mit „vom Feld kam“ ist die Ankunft im Deutschen natürlich ausgedrückt, ohne einen im Hebräischen nicht ausdrücklich genannten Zielort hinzuzufügen.
- source_word: מִן הַשָּׂדֶה
  choice: vom Feld
  rationale: שׂדה mit Artikel bezeichnet hier „das Feld“ beziehungsweise das freie Gelände; „vom Feld“ bewahrt das konkrete Bild und ist idiomatisch.
- source_word: עָיֵף
  choice: erschöpft
  rationale: עָיֵף bezeichnet Müdigkeit bis hin zu Erschöpfung. „Erschöpft“ vermittelt die für die folgende Handlung bedeutsame Intensität.
- source_word: וְהוּא
  choice: erschöpft … kam
  rationale: Die hebräische Pronominalkonstruktion wird im Deutschen idiomatisch als prädikative Zustandsangabe in den Ankunftssatz eingebunden.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzverknüpfung mit „als“ stellt Jakobs laufende Tätigkeit und Esaus Eintreffen natürlich zueinander; sie fügt keine ausdrückliche Zeitangabe wie „nun“ hinzu.
