base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: de
  text: Abraham verschied und starb in einem guten, hohen Alter, alt und lebenssatt[a], und wurde zu seinen Leuten versammelt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alt und satt“. Gemeint ist die Sättigung oder Erfülltheit eines langen Lebens; „an Tagen“ steht im Hebräischen nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu seinen Leuten versammelt“. Dies ist eine traditionelle hebräische Todesformel. Sie kann die Vereinigung mit verstorbenen Angehörigen anklingen lassen, legt aber nicht fest, auf welche Weise sie geschieht.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: verschied
  rationale: Das Verb גוע bezeichnet in Todesnotizen das Aushauchen des Lebens. „Verschied“ gibt dies würdig und knapp wieder und bleibt vom folgenden ausdrücklichen „starb“ unterscheidbar.
- source_word: וַיָּמָת
  choice: starb
  rationale: מות ist das gewöhnliche, direkte Verb für das Sterben; „starb“ vermeidet eine beschönigende Umschreibung.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: in einem guten, hohen Alter
  rationale: Die Wendung beschreibt den Tod im Zustand eines guten Greisenalters. „Gutes, hohes Alter“ ist im modernen Deutschen natürlich und bewahrt sowohl die positive Wertung als auch den Altersbezug.
- source_word: זָקֵן
  choice: alt
  rationale: Das eigenständige Adjektiv wird beibehalten, sodass die Häufung der hebräischen Altersbeschreibungen nicht eingeebnet wird.
- source_word: וְשָׂבֵעַ
  choice: und lebenssatt
  rationale: שָׂבֵעַ bedeutet „satt, gesättigt“. „Lebenssatt“ vermittelt im deutschen Todeskontext die erfüllte Sättigung eines langen Lebens, ohne das im Hebräischen nicht ausdrücklich vorhandene „an Tagen“ in den Haupttext einzufügen.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Dann wurde er mit seinen Vorfahren vereint
  rationale: Die hebräische Todesformel wird in verständlichem Deutsch wiedergegeben. „Vorfahren“ bringt hier den verwandtschaftlichen Bezug von עַמָּיו zum Ausdruck; die Passivform und die Mehrdeutigkeit hinsichtlich der Art der Vereinigung bleiben erhalten.
- source_word: עַמָּיו
  choice: seinen Vorfahren
  rationale: Wörtlich steht „seine Leute/seine Völker“. Im Zusammenhang der traditionellen Todesformel bezeichnet der Ausdruck die verstorbenen Angehörigen beziehungsweise Vorfahren, ohne dass der Vers den Vorgang genauer erklärt.
theological_decisions:
- issue: Bedeutung der Formel „zu seinen Leuten versammelt werden“
  choice: Die traditionelle Todesformel wird als „mit seinen Vorfahren vereint“ wiedergegeben, ohne die Art dieser Vereinigung festzulegen.
  alternative: 'Wörtlicher: „zu seinen Leuten versammelt“; deutend entweder Bestattung im Familiengrab oder Wiedervereinigung mit verstorbenen Angehörigen nach dem Tod.'
  rationale: Der hebräische Wortlaut lässt offen, ob vor allem an Bestattung, Zugehörigkeit zu den verstorbenen Vorfahren oder ein Weiterleben nach dem Tod gedacht ist. Die Übersetzung darf diese Spannung nicht dogmatisch auflösen; die Fußnote macht die zugrunde liegende Bildsprache sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. „Verschied und starb“ erhält die auffällige Doppelung des Hebräischen; „lebenssatt“ ist gehoben, aber allgemein verständlich. Die zweite Satzhälfte wird als eigener Satz gestaltet, um die hebräische Reihung im Deutschen flüssig wiederzugeben.
