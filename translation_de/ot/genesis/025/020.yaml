  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: de
  text: Isaak war vierzig Jahre alt, als er Rebekka zur Frau nahm[a]. Sie war die Tochter Betuëls, des Aramäers[b] aus Paddan-Aram, und die Schwester Labans, des Aramäers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »als er Rebekka heiratete«. Wörtlich heißt es im Hebräischen: »als er Rebekka … sich zur Frau nahm«.'
    reason: lexical_alternative
  - marker: b
    text: »Aramäer« gibt die hebräische Volksbezeichnung genauer wieder als die ältere traditionelle Übersetzung »Syrer«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Isaak war vierzig Jahre alt
  rationale: Die hebräische Altersangabe lautet wörtlich etwa »Isaak war ein Sohn von vierzig Jahren«. Die gewählte Form ist die natürliche moderne deutsche Entsprechung.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: als er ... zur Frau nahm
  rationale: Die Wendung bewahrt das Bild des hebräischen Verbs לקח (»nehmen«) und gibt zugleich eindeutig den Eheschluss wieder.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בְּתוּאֵל
  choice: Betuël
  rationale: Die Trema-Schreibung macht im Deutschen die getrennte Aussprache der Vokale deutlich und entspricht einer etablierten Namensform.
- source_word: הָאֲרַמִּי
  choice: der Aramäer
  rationale: אֲרַמִּי bezeichnet ethnisch einen Aramäer; dies ist genauer als die ältere traditionelle Wiedergabe »Syrer«.
- source_word: מִפַּדַּן אֲרָם
  choice: aus Paddan-Aram
  rationale: Der Ortsname wird transliteriert; die Präposition מִן wird mit »aus« wiedergegeben.
- source_word: אֲחוֹת לָבָן
  choice: die Schwester Labans
  rationale: Die Genitivkonstruktion ist im Deutschen natürlich und bewahrt die genealogische Angabe.
theological_decisions: []
