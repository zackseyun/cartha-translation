  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: de
  text: Der Erstgeborene kam rötlich zur Welt[a], am ganzen Körper wie ein Mantel aus Haaren behaart[b], und sie nannten ihn Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rot« oder »rötlich-braun«. Das hebräische Adjektiv bezeichnet ein rötliches Erscheinungsbild.'
