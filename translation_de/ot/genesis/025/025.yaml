  - marker: b
    text: 'Oder: »wie ein Haarmantel« oder »wie ein Mantel aus Haar«. Das Hebräische verwendet ein Vergleichsbild mit »Mantel« und »Haar«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: kam … zur Welt
  rationale: Im Geburtskontext gibt die natürliche deutsche Wendung das hebräische »herauskommen« verständlich wieder, ohne den Vorgang weiter auszudeuten.
- source_word: הָרִאשׁוֹן
  choice: Der Erste
  rationale: Bezeichnet knapp und eindeutig den zuerst geborenen Zwilling.
- source_word: אַדְמוֹנִי
  choice: rötlich
  rationale: Bewahrt die Farbangabe als Beschreibung seines Erscheinungsbildes und lässt den späteren Anklang an Edom erkennen, ohne ihn hier ausdrücklich einzutragen.
- source_word: כֻּלּוֹ
  choice: am ganzen Körper
  rationale: Macht den umfassenden körperlichen Bezug im Deutschen natürlich und deutlich.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: wie ein haariger Mantel
  rationale: Bewahrt das anschauliche hebräische Vergleichsbild mit einem Mantel und Haar; die ungewöhnliche Bildlichkeit des Originals bleibt bestehen.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: sie nannten ihn
  rationale: Gibt die übliche hebräische Namensformel in natürlichem modernem Deutsch wieder.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
