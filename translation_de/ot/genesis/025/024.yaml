lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Als ihre Zeit zu gebären gekommen war
  rationale: Die hebräische Wendung sagt wörtlich, dass sich ihre Tage zum Gebären erfüllt hatten. Die gewählte Formulierung gibt den Abschluss der Schwangerschaft in natürlichem modernem Deutsch wieder, ohne die Aussage zu erweitern.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Die Verbindung bewahrt den aufmerksamkeitslenkenden und überraschenden Charakter des hebräischen Diskursmarkers in einem würdevollen, biblisch vertrauten Register.
- source_word: תוֹמִם
  choice: Zwillinge
  rationale: Das Substantiv bezeichnet ein Zwillingspaar; „Zwillinge“ ist die knappe und direkte deutsche Entsprechung.
- source_word: בְּבִטְנָהּ
  choice: in ihrem Mutterleib
  rationale: בטן kann Bauch oder Leib bedeuten; im Geburtszusammenhang bezeichnet „Mutterleib“ den gemeinten Bereich präzise und natürlich.
