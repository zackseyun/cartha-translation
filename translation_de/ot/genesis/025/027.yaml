base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: de
  text: Als die Jungen heranwuchsen, wurde Esau ein erfahrener Jäger, ein Mann des Feldes; Jakob aber war ein stiller Mann[a], der in Zelten lebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „untadelig“, „rechtschaffen“, „arglos“ oder „schlicht“ bedeuten; je nach Zusammenhang bezeichnet es Ganzheit, Lauterkeit, Schlichtheit oder ruhige Unaufdringlichkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Als die Jungen heranwuchsen
  rationale: Der Zusammenhang beschreibt das Heranreifen der Zwillingssöhne; „heranwuchsen“ gibt diesen Entwicklungssinn natürlich wieder.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: ein erfahrener Jäger
  rationale: Die Wendung bezeichnet einen Mann, der sich auf die Jagd versteht; „erfahrener Jäger“ drückt die praktische Sachkenntnis idiomatisch aus.
- source_word: אִישׁ שָׂדֶה
  choice: ein Mann des freien Landes
  rationale: Die formal nahe Wendung bewahrt das Bild von Esau als einem Mann, dessen Lebensraum das offene Land ist, im Gegensatz zu Jakobs Leben in Zelten.
- source_word: אִישׁ תָּם
  choice: ein untadeliger Mann
  rationale: תָּם bezeichnet häufig Ganzheit, Redlichkeit oder Untadeligkeit. Diese Wiedergabe wahrt den naheliegenden ethisch-charakterlichen Sinn; andere mögliche Nuancen werden in der Fußnote offengehalten.
- source_word: יֹשֵׁב אֹהָלִים
  choice: der in Zelten lebte
  rationale: Das Partizip beschreibt Jakobs kennzeichnende Lebensweise. Die Formulierung ist natürlich und bewahrt den Gegensatz zum offenen Land.
theological_decisions:
- issue: Bedeutung von תָּם bei der Charakterisierung Jakobs
  choice: untadelig
  alternative: ruhig; schlicht; arglos; rechtschaffen
  rationale: Der hebräische Ausdruck kann sowohl moralische Unversehrtheit als auch Schlichtheit oder Arglosigkeit bezeichnen. „Untadelig“ gibt einen gut belegten Sinn wieder, ohne absolute Sündlosigkeit zu behaupten; die echte lexikalische Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und der Kontrast zwischen freiem Land und Zelten bleiben sichtbar; die Mehrdeutigkeit von תָּם wird nicht stillschweigend beseitigt.
