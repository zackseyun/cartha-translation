base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: de
  text: Und Jakob gab Esau Brot und ein Linsengericht. Er aß und trank und stand auf und ging davon. So verachtete Esau das Erstgeburtsrecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: behandelte das Erstgeburtsrecht geringschätzig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: gab
  rationale: Das gewöhnliche deutsche Verb gibt den schlichten Erzählstil wieder, ohne dem Austausch zusätzliche Nuancen hinzuzufügen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Neben dem ausdrücklich genannten Linsengericht liegt hier die konkrete Bedeutung „Brot“ näher als die allgemeinere Bedeutung „Nahrung“.
- source_word: נְזִיד עֲדָשִׁים
  choice: ein Linsengericht
  rationale: Die Wendung bezeichnet eine gekochte Speise aus Linsen. „Linsengericht“ ist im modernen Deutschen natürlich und lässt offen, ob sie eher als Eintopf oder als dickere Speise zu verstehen ist.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: Er aß und trank und stand auf und ging davon
  rationale: Die wiederholten Verknüpfungen bewahren die knappe Abfolge der hebräischen Erzählung; „ging davon“ gibt den Aufbruch idiomatisch wieder.
- source_word: וַיִּבֶז
  choice: verachtete
  rationale: Das Verb bezeichnet Geringschätzung oder Verachtung. „Verachtete“ ist knapp, kräftig und ohne zusätzliche Ausdeutung.
- source_word: הַבְּכֹרָה
  choice: das Erstgeburtsrecht
  rationale: Der Ausdruck bezeichnet die mit der Stellung des Erstgeborenen verbundenen Rechte und Vorzüge; „Erstgeburtsrecht“ ist die prägnante deutsche Entsprechung.
theological_decisions:
- issue: Abschließende Bewertung von Esaus Haltung zum Erstgeburtsrecht
  choice: So verachtete Esau das Erstgeburtsrecht
  alternative: Und Esau behandelte das Erstgeburtsrecht geringschätzig
  rationale: „So“ lässt den Schlusssatz als zusammenfassende Bewertung des unmittelbar zuvor geschilderten Handelns erkennen. „Verachtete“ bewahrt die deutliche moralische Wertung des hebräischen Verbs, ohne ihre Ursache oder Tragweite weiter auszulegen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Häufung von „und“ in der Handlungsfolge ist bewusst beibehalten, um den knappen Rhythmus des Hebräischen hörbar zu machen; die Sätze sind dennoch nach natürlichem deutschem Sprachgebrauch gegliedert.
