lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol von אמר wird im natürlichen deutschen Erzählstil ohne ein vorangestelltes »und« wiedergegeben.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende Partikel wird verständlich und mit ihrem nachdrücklichen Ton wiedergegeben; »siehe« wäre im heutigen Deutsch unnötig altertümlich.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen ist hervorgehoben; im Deutschen tragen Wortlaut und Ausruf den Nachdruck ausreichend.
- source_word: הוֹלֵךְ לָמוּת
  choice: bin dabei zu sterben
  rationale: Die Verbindung von הלך mit dem Infinitiv beschreibt hier das Zugehen auf den Tod. Die Formulierung gibt die behauptete Unmittelbarkeit idiomatisch wieder, ohne zu entscheiden, ob Esau wörtlich oder übertreibend spricht.
- source_word: וְלָמָּה זֶּה לִי
  choice: Was nützt mir da
  rationale: Die rhetorische Frage zieht eine Folgerung aus Esaus vorausgehender Behauptung. »Da« gibt den Zusammenhang wieder, während die Nutzenfrage die pragmatische Kraft der knappen hebräischen Wendung natürlich ausdrückt.
- source_word: בְּכֹרָה
  choice: Erstgeburtsrecht
  rationale: Der etablierte deutsche Ausdruck bezeichnet den besonderen Status und die damit verbundenen Rechte des Erstgeborenen.
theological_decisions:
- issue: Bedeutung von Esaus Aussage über seinen bevorstehenden Tod
  choice: Die Aussage wird als Behauptung unmittelbar drohenden Todes wiedergegeben, ohne festzulegen, ob Esau tatsächlich in Lebensgefahr war oder aus großem Hunger übertrieb.
  alternative: »Ich gehe dem Tod entgegen« könnte allgemeiner auf die Sterblichkeit jedes Menschen bezogen werden; »ich sterbe gleich« würde die Unmittelbarkeit stärker zuspitzen.
  rationale: Der hebräische Text lässt offen, wie wörtlich Esaus Aussage zu verstehen ist. Die Übersetzung bewahrt diese erzählerische und moralische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede klingt nachdrücklich, ohne Umgangssprache oder altertümliche Formulierungen.
