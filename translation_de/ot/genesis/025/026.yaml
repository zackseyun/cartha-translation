base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: de
  text: Danach kam sein Bruder heraus, und seine Hand hielt Esaus Ferse fest. Da gab man ihm den Namen Jakob.[a] Isaak war sechzig Jahre alt, als sie geboren wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name Jakob (Yaʿaqov) klingt an das Wort für „Ferse“ an. Später wird er außerdem mit einem Verb in Verbindung gebracht, das „verdrängen“ oder „überlisten“ bedeuten kann (siehe 27,36).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung bezeichnet die zeitliche Folge nach Esaus Geburt; „Danach“ ist knapp, natürlich und inhaltlich genau.
- source_word: יָצָא
  choice: kam … heraus
  rationale: Das Verb bedeutet wörtlich „hinausgehen/herauskommen“ und schildert hier anschaulich das Hervorkommen bei der Geburt, ohne es lediglich mit „wurde geboren“ wiederzugeben.
- source_word: אָחִיו
  choice: sein Bruder
  rationale: Der hebräische Text sagt schlicht „sein Bruder“. Dass es sich um seinen Zwillingsbruder handelt, ergibt sich aus dem Zusammenhang und wird nicht in den Ausdruck hineingetragen.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: und seine Hand hielt … fest
  rationale: Das Partizip beschreibt den anhaltenden Griff während des Hervorkommens. „Festhalten“ gibt אָחַז im Deutschen natürlich und anschaulich wieder.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: Esaus Ferse
  rationale: עָקֵב bedeutet „Ferse“; die deutsche Genitivkonstruktion gibt die Beziehung klar und idiomatisch wieder.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Da gab man ihm den Namen
  rationale: Die unpersönliche deutsche Form bewahrt die hebräische Namengebungsformel, ohne einen im Satz nicht ausdrücklich genannten Namensgeber festzulegen. „Da“ macht den erzählerischen Zusammenhang mit dem Griff an die Ferse sichtbar, ohne eine stärkere Kausalität zu behaupten.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: „Jakob“ ist die etablierte deutsche Namensform. Eine Fußnote weist auf den im Hebräischen hörbaren Zusammenhang mit „Ferse“ hin.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: war sechzig Jahre alt
  rationale: Dies ist die natürliche deutsche Wiedergabe der üblichen hebräischen Altersangabe.
- source_word: בְּלֶדֶת אֹתָם
  choice: als sie geboren wurden
  rationale: Die Form bezeichnet den Zeitpunkt ihrer Geburt. Die passive Wiedergabe vermeidet es, ein im hebräischen Ausdruck nicht ausdrücklich genanntes Subjekt hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die anschauliche Geburtsdarstellung und das hebräische Namenswortspiel bleiben erhalten; die nicht ausdrücklich bezeichnete Person, die den Namen gibt, wird nicht näher bestimmt.
