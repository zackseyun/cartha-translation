  source_fidelity: '„Abraham gab Isaak alles, was ihm gehörte“ gibt das hebräische וַיִּתֵּן … אֶת־כָּל אֲשֶׁר־לוֹ לְיִצְחָק vollständig und sachgerecht wieder: narrativisches Präteritum, Abraham als Handelnder, die Gesamtheit seines Besitzes und Isaak als Empfänger. Die Formulierung wahrt die im Hebräischen offene, umfassende Bedeutung von „alles, was ihm gehörte“ und vermeidet unbegründete rechtliche oder theologische Zuspitzungen.'
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und hat einen angemessen schlichten, würdevollen Erzählton. Die Stellung „gab Isaak alles“ ist natürlich; der Dativ ist trotz fehlender sichtbarer Kasusendung beim Namen eindeutig.
  terminology: 'Die etablierten deutschen Namensformen „Abraham“ und „Isaak“ sind korrekt. „Alles, was ihm gehörte“ ist eine präzise und natürliche Entsprechung zu כָּל אֲשֶׁר לוֹ. Die Fußnote „Oder: ‚seinen ganzen Besitz‘“ ist als lexikalisch-stilistische Alternative vertretbar, ohne den Haupttext zu belasten.'
