lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Die Wayyiqtol-Form von נתן führt die Erzählung fort; das einfache Präteritum „gab“ ist im deutschen Erzählstil natürlich und entspricht der Grundbedeutung.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch den Satzbau wiedergegeben.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: alles, was ihm gehörte
  rationale: Die Wendung bezeichnet umfassend das, was Abraham zu eigen war. Diese Übersetzung ist zugleich nah am Hebräischen und in modernem Deutsch natürlich.
- source_word: לְיִצְחָק
  choice: Isaak
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger; im Deutschen wird dieser idiomatisch durch den Dativ „Isaak“ ausgedrückt.
