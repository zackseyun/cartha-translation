base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: de
  text: 'Die Kinder rangen miteinander in ihr, und sie sagte: »Wenn es so ist, warum bin ich dann so?[a]« Da ging sie hin, um Jahwe zu befragen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch etwa: »Warum dies – ich?« Der Ausdruck ist elliptisch und kann im Zusammenhang auch als »Warum bin ich so?« oder »Warum geschieht mir das?« verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: rangen miteinander
  rationale: Die reflexiv-reziproke Form beschreibt eine heftige wechselseitige Bewegung beziehungsweise Auseinandersetzung. »Rangen miteinander« bewahrt den Konfliktcharakter, ohne die mögliche Bedeutung »zermalmten einander« zu überzeichnen.
- source_word: הַבָּנִים
  choice: die Kinder
  rationale: בָּנִים kann »Söhne« bedeuten; vor ihrer Geburt ist »Kinder« im Deutschen natürlicher. Dass es Jungen sind, wird im folgenden Vers ausdrücklich deutlich.
- source_word: בְּקִרְבָּהּ
  choice: in ihrem Innern
  rationale: Die Wendung bezeichnet wörtlich das Innere beziehungsweise die Mitte einer Person. Die Übersetzung wahrt diese Ausdrucksweise, ohne das im Kontext naheliegende, aber nicht ausdrücklich genannte Wort »Mutterleib« einzufügen.
- source_word: אִם כֵּן
  choice: Wenn es so ist
  rationale: Die konditionale Wendung leitet Rebekkas erschrockene Reaktion auf das Geschehen in ihr ein und wird im Deutschen unmittelbar und verständlich wiedergegeben.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: warum bin ich dann so?
  rationale: Der hebräische Ausdruck ist elliptisch und lässt offen, was genau ergänzt werden soll. Diese Wiedergabe ist im Zusammenhang natürlich, ohne die Aussage zu einer ausdrücklichen Klage über ihre Existenz oder zu »Warum geschieht mir das?« auszubauen.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: Jahwe zu befragen
  rationale: דָּרַשׁ mit einer Person als Objekt kann das Einholen göttlicher Auskunft bezeichnen. »Befragen« gibt diesen konkreten Vorgang präziser wieder als das allgemeinere »suchen«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Umschrift »Jahwe« bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch den Titel »der HERR« zu ersetzen.
- issue: Deutung von Rebekkas elliptischer Klage
  choice: warum bin ich dann so?
  alternative: Warum bin ich überhaupt?; Warum geschieht mir das?
  rationale: Die Übersetzung hält die grammatische Unvollständigkeit und existenzielle Spannung des Hebräischen erkennbar, legt den Satz aber nicht eindeutig als Todeswunsch oder bloße Frage nach dem Anlass ihrer Schmerzen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Rangen miteinander« vermittelt die Heftigkeit der vorgeburtlichen Auseinandersetzung; »in ihrem Innern« bleibt nahe an der Bildsprache des Hebräischen. Die direkte Rede bewahrt bewusst die schwer aufzulösende Kürze von Rebekkas Frage.
