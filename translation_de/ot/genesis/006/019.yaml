  source_fidelity: 'Der Entwurf gibt die hebräische Struktur und den Sinn zuverlässig wieder: die umfassende Formulierung „von allem Lebendigen, von allem Fleisch“, die distributive Anweisung „je zwei“, das Hineinbringen in die Arche, der kausative Zweck des Lebenerhalts und die Bestimmung „männlich und weiblich“ bleiben erhalten. Die Wiederholung von „von allem“ entspricht dem Ausgangstext und vermeidet eine unzulässige Einengung auf bestimmte Tiergruppen.'
