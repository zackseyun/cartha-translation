source:
  edition: WLC
  text: וּ/מִ/כָּל הָ֠/חַי מִֽ/כָּל בָּשָׂ֞ר שְׁנַ֧יִם מִ/כֹּ֛ל תָּבִ֥יא אֶל הַ/תֵּבָ֖ה לְ/הַחֲיֹ֣ת אִתָּ֑/ךְ זָכָ֥ר וּ/נְקֵבָ֖ה יִֽהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: de
  text: Und von allem Lebendigen, von allem Fleisch[a], sollst du je zwei in die Arche bringen, um sie mit dir am Leben zu erhalten; männlich und weiblich sollen sie sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Alles Fleisch“ ist eine hebräische Ausdrucksweise für leibliche Lebewesen.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: Und von allem Lebendigen
  rationale: Die substantivierte Form „das Lebendige“ bewahrt die breite Bedeutung des Hebräischen und legt den Ausdruck nicht vorschnell ausschließlich auf Tiere fest.
- source_word: מִכָּל בָּשָׂר
  choice: von allem Fleisch
  rationale: Die wörtliche Wendung erhält das hebräische Bild und dessen umfassenden Bezug auf leibliche Lebewesen; eine Fußnote erläutert den idiomatischen Gebrauch.
- source_word: שְׁנַיִם מִכֹּל
  choice: je zwei
  rationale: '„Je zwei“ gibt den distributiven Sinn knapp und natürlich wieder: Aus jeder hier gemeinten Gruppe sollen zwei genommen werden.'
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: sollst du … in die Arche bringen
  rationale: Das Modalverb „sollst“ vermittelt den anweisenden Charakter der Verbform; „in die Arche“ bezeichnet im Deutschen natürlich die Bewegung ins Innere.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: um sie mit dir am Leben zu erhalten
  rationale: Die Form ist kausativ und bezeichnet das Bewahren des Lebens. Das im Deutschen notwendige Objekt „sie“ bezieht sich auf die jeweils zwei Lebewesen.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: männlich und weiblich sollen sie sein
  rationale: Die Formulierung folgt der hebräischen Prädikatsstruktur, bezeichnet die beiden Geschlechter direkt und vermeidet den engeren, ausdrücklich tierbezogenen Ausdruck „Männchen und Weibchen“.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit relativ enger Bindung an die hebräische Satzstruktur. Die Wiederholung „von allem … von allem …“ bleibt erhalten, weil sie zur Ausdrucksweise des Ausgangstextes gehört; das Semikolon macht den abschließenden Satzteil im Deutschen übersichtlich.
