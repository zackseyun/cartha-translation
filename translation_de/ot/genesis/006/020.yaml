base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: de
  text: Von den Vögeln nach ihren Arten[a], vom Vieh nach seiner Art und von allem, was auf dem Erdboden kriecht, nach seiner Art, werden je zwei zu dir kommen, damit du sie am Leben erhältst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Art für Art“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: die Vögel
  rationale: עוֹף bezeichnet fliegende Tiere beziehungsweise Vögel; „Vögel“ ist hier die natürliche und kontextgerechte deutsche Bezeichnung.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: nach ihren/seinen Arten; nach seiner Art
  rationale: מִין bezeichnet eine Art oder Gruppe. Die Wiedergabe bewahrt den einteilenden Sinn, ohne moderne biologische Taxonomie vorauszusetzen; Numerus und Genus richten sich im Deutschen nach dem jeweiligen Bezugswort.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: בְּהֵמָה bezeichnet hier die Kategorie der größeren beziehungsweise domestizierten Landtiere. „Vieh“ ist knapp, geläufig und entspricht dem Gegensatz zu Vögeln und Kriechtieren.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: alles, was auf dem Erdboden kriecht
  rationale: רֶמֶשׂ bezeichnet kleine, sich am Boden bewegende beziehungsweise kriechende Tiere; „Erdboden“ gibt אֲדָמָה präziser wieder als das mehrdeutige „Erde“.
- source_word: שְׁנַיִם מִכֹּל
  choice: je zwei
  rationale: Die knappe distributive Formulierung drückt aus, dass aus jeder genannten Art zwei kommen, ohne „von allen“ im Deutschen unnötig zu verdoppeln.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: werden zu dir kommen
  rationale: Die Formulierung gibt die Bewegung auf Noah zu wieder und legt nicht ausdrücklich ein Hineingehen in die Arche fest, das nur aus dem Zusammenhang hervorgeht.
- source_word: לְהַחֲיוֹת
  choice: damit du sie am Leben erhältst
  rationale: Der Hifil-Infinitiv von חיה bezeichnet das Bewahren des Lebens; der Finalsatz gibt die Zweckangabe im heutigen Deutsch klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung und die wiederholte Einteilung nach Arten bleiben erkennbar; die Formulierung vermeidet eine Gleichsetzung des hebräischen מִין mit einem modernen biologischen Artbegriff.
