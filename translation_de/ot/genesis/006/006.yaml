  to: Und Jahwe bereute, dass er den Menschen auf der Erde gemacht hatte,[a][b] und es schmerzte ihn in seinem Herzen.[c]
  rationale: Die einzige sichere Änderung ersetzt das leicht interpretierende einleitende „Da“ durch das den hebräischen Erzählanschluss besser abbildende „Und“. Text und Fußnoten bleiben ansonsten erhalten, da sie den hebräischen Wortlaut, die Unterscheidung der beiden Verben und die theologische Offenheit zuverlässig wiedergeben.
