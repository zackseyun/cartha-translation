  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: de
  text: Und Jahwe bereute, dass er den Menschen auf der Erde gemacht hatte,[a][b] und es schmerzte ihn in seinem Herzen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „war betrübt darüber, dass er … gemacht hatte“. Das hebräische Verb bezeichnet rückblickendes Bedauern oder Reue über eine frühere Handlung. Es sagt für sich genommen nicht, dass Gott überrascht war, etwas nicht vorauswusste oder moralisch falsch gehandelt hatte.'
    reason: lexical_alternative
  - marker: b
    text: „Den Menschen“ bezeichnet hier kollektiv die Menschheit.
    reason: lexical_clarification
  - marker: c
    text: 'Wörtlich: „zu seinem Herzen“. Gemeint ist ein tiefer innerer Schmerz.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: bereute
  rationale: Das Nifal von נחם bezeichnet hier angesichts der mit כִּי genannten früheren Handlung rückblickendes Bedauern beziehungsweise Reue. „Bereute“ bewahrt diese Aussagekraft und hält sie von dem folgenden Verb für inneren Schmerz auseinander. Das Wort sagt für sich genommen weder Überraschung noch fehlendes Vorherwissen oder einen moralischen Fehler aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Wiedergabe des Gottesnamens JHWH in geläufiger deutscher Form.
- source_word: כִּי עָשָׂה
  choice: dass er … gemacht hatte
  rationale: כִּי führt den Inhalt beziehungsweise Anlass des Bereuens ein; das Plusquamperfekt macht deutlich, dass sich das Bereuen auf die vorausgehende Schöpfungshandlung bezieht.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: אָדָם ist hier kollektiv auf die Menschheit bezogen. Das deutsche „den Menschen“ erhält die repräsentative Einzahl und ist im Zusammenhang natürlich verständlich.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Gemeint ist in diesem Kontext die Erde als Lebensraum der Menschen, nicht ein bestimmtes Land.
- source_word: וַיִּתְעַצֵּב
  choice: es schmerzte ihn
  rationale: Der Hitpael von עצב bezeichnet tiefen inneren Schmerz. Die Formulierung bewahrt den Unterschied zum vorausgehenden „bereute“, statt beide Verben mit „betrübte“ wiederzugeben.
- source_word: אֶל־לִבּוֹ
  choice: in seinem Herzen
  rationale: Die idiomatische deutsche Wendung gibt den innerlichen, tiefen Schmerz natürlich wieder; das hebräische אֶל lautet formal „zu“.
theological_decisions:
- issue: Menschlich anmutende Rede von Gottes Reue und Schmerz
  choice: Die direkte Aussage, dass Jahwe bereute und inneren Schmerz empfand, bleibt stehen.
  alternative: „Jahwe war traurig darüber“ oder „Jahwe ließ sich umstimmen“
  rationale: Der hebräische Text stellt Gottes rückblickendes Bereuen und seinen Schmerz unmittelbar dar. Die Übersetzung löst die Spannung zur göttlichen Voraussicht nicht auf und trägt weder Überraschung noch moralisches Versagen in den Vers ein.
- issue: Kollektive Bedeutung von הָאָדָם
  choice: „den Menschen“ als repräsentative Einzahl
  alternative: „die Menschheit“ oder „die Menschen“
  rationale: Der Kontext betrifft die Menschheit insgesamt; die repräsentative Einzahl bewahrt zugleich die Form und den kollektiven Sinn des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bereute“ erhält bewusst die theologische Spannung des Ausgangstextes; die anschließende unpersönliche Wendung „es schmerzte ihn“ klingt natürlich und bildet das zweite, eigenständige hebräische Verb ab.
