id: GEN.6.8
reference: Genesis 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: de
  text: Doch Noah fand Gunst in den Augen Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Noah fand Gnade in den Augen Jahwes.“'
    reason: Lexikalische Alternative für חֵן; „Gnade“ ist möglich, kann im Deutschen jedoch stärker als theologischer Fachbegriff verstanden werden.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Doch Noah
  rationale: Die Konjunktion וְ kann schlicht „und“ bedeuten; hier hebt sie Noah jedoch als Gegensatz zur verdorbenen Menschheit und zum angekündigten Gericht hervor. „Doch Noah“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: מָצָא
  choice: fand
  rationale: מצא bedeutet gewöhnlich „finden“. Zusammen mit חֵן bildet es die feste Wendung „Gunst finden“ und bewahrt damit die Ausdrucksweise des Hebräischen.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן kann „Gunst“, „Wohlwollen“ oder „Gnade“ bezeichnen. „Gunst“ passt unmittelbar zur Wendung „Gunst finden“ und legt den Begriff nicht vorschnell auf eine spätere theologische Fachbedeutung fest.
- source_word: בְּ/עֵינֵי
  choice: in den Augen
  rationale: Die wörtliche Metapher ist auch im Deutschen verständlich und bewahrt das hebräische Idiom, das Gottes Sicht beziehungsweise Urteil bezeichnet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Standarddeutsch geläufigen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bedeutung von חֵן für Gottes Haltung gegenüber Noah
  choice: Gunst
  alternative: Gnade
  rationale: „Gunst“ bewahrt die idiomatische Aussage und lässt offen, wie das Verhältnis zwischen Gottes unverdientem Wohlwollen und Noahs später genannter Rechtschaffenheit genauer zu bestimmen ist.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der hebräische Text den Eigennamen verwendet, bleibt er als Gottesname sichtbar und wird nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform und die hebräische Metapher „in den Augen“ bleiben erhalten; „Doch“ macht den kontextuellen Gegensatz deutlich.
