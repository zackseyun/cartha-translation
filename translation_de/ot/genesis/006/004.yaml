source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: de
  text: Die Nephilim[a] waren in jenen Tagen auf der Erde – und auch später –, als die Söhne Gottes[b] zu den Menschentöchtern[c] eingingen und diese ihnen Kinder gebaren. Das waren die mächtigen Männer aus alter Zeit, berühmte Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »die Riesen«. Der seltene hebräische Ausdruck Nephilim ist in seiner genauen Bedeutung unsicher.'
    reason: alternative_reading
  - marker: b
    text: Die Bezeichnung »Söhne Gottes« kann auch als »göttliche Wesen« verstanden werden; andere Auslegungen beziehen die Wendung auf menschliche Herrscher oder auf die gottesfürchtige Linie Sets.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: »Töchter des Menschen«. »Mensch« ist hier kollektiv gemeint, also menschliche Frauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: die Nephilim
  rationale: Der seltene hebräische Ausdruck ist in seiner genauen Bedeutung umstritten. Die Transkription bewahrt diese Unbestimmtheit; die traditionelle Wiedergabe »Riesen« steht in der Fußnote.
- source_word: בָאָרֶץ
  choice: auf der Erde
  rationale: Im Zusammenhang der Urgeschichte ist die umfassende Bedeutung »Erde« natürlicher als »Land«.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: und auch danach
  rationale: Gibt sowohl die additive Kraft als auch den zeitlichen Bezug knapp und natürlich wieder.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: als ... zu ... eingingen
  rationale: »Als« gibt den temporalen beziehungsweise umstandsbezogenen Anschluss wieder; »eingehen zu« wahrt den verhüllenden sexuellen Sinn des hebräischen Ausdrucks.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: die Söhne Gottes
  rationale: Die formnahe Wiedergabe erhält die umstrittene Identität dieser Gruppe offen und legt weder göttliche Wesen noch Herrscher oder eine bestimmte menschliche Linie fest.
- source_word: בְּנוֹת הָאָדָם
  choice: die Menschentöchter
  rationale: Das idiomatische deutsche Kompositum bringt den kollektiven Sinn von אָדָם zum Ausdruck und bezeichnet menschliche Frauen, ohne die Wendung auf die Töchter eines einzelnen Mannes zu beziehen.
- source_word: וְיָלְדוּ לָהֶם
  choice: und diese ihnen Kinder gebaren
  rationale: »Kinder« ergänzt das im Deutschen erforderliche, im Hebräischen implizite Objekt. »Diese« macht den Bezug auf die Menschentöchter eindeutig.
- source_word: הֵמָּה הַגִּבֹּרִים
  choice: Das sind die Helden
  rationale: Der präsentische Identifikationssatz entspricht der hebräischen Nominalkonstruktion. »Helden« wahrt die breite Bedeutung von גִּבּוֹר und klingt im Deutschen natürlicher als »mächtige Männer«, ohne zwingend nur Krieger zu bezeichnen.
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: der Vorzeit
  rationale: Eine knappe, gehobene und idiomatische Wiedergabe für Menschen aus längst vergangener Zeit.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: die Männer von Ruhm
  rationale: Gibt die hebräische Wendung für Menschen mit weithin bekanntem Namen beziehungsweise Ansehen würdig wieder, ohne sie moralisch zu idealisieren.
theological_decisions:
- issue: Identität der »Söhne Gottes«
  choice: Die wörtliche Wendung »Söhne Gottes« bleibt im Haupttext stehen.
  alternative: Göttliche Wesen, Engelwesen, königliche Herrscher oder die gottesfürchtige Linie Sets.
  rationale: Der hebräische Ausdruck entscheidet in diesem Vers nicht eindeutig zwischen den verbreiteten Deutungen. Die Übersetzung bewahrt daher die theologische Spannung.
- issue: Bedeutung von הַנְּפִלִים
  choice: Im Haupttext steht die Transkription »Nephilim«.
  alternative: Riesen oder Gefallene.
  rationale: Die genaue Bedeutung und selbst die etymologische Herleitung sind unsicher. Eine ausdeutende Übersetzung würde eine umstrittene Auffassung festschreiben.
- issue: Beziehung zwischen Nephilim und Helden
  choice: Die Identifikationsformulierung »Das sind die Helden« wird beibehalten, ohne den genauen Bezug weiter zu erklären.
  alternative: Die Helden ausdrücklich als Kinder der Verbindungen oder als mit den Nephilim identische Gruppe bestimmen.
  rationale: Syntax und Bezug lassen Auslegungsfragen offen. Der deutsche Text soll keine eindeutige Genealogie ergänzen, die der hebräische Wortlaut nicht ausdrücklich formuliert.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht gehobenem Erzählton. Seltene oder theologisch umstrittene Begriffe werden nicht vereinfachend aufgelöst. »Menschentöchter«, »gebaren«, »Helden der Vorzeit« und »Männer von Ruhm« halten den feierlichen Charakter, bleiben aber für heutige Leser verständlich.
