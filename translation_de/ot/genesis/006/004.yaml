  source_fidelity: 'Die wesentlichen hebräischen Begriffe und die Auslegungsfreiheit werden gut bewahrt: Nephilim bleibt transliteriert, »Söhne Gottes« wird nicht gedeutet, und die sexuelle Umschreibung bleibt verhüllend. Die deutsche Gegenwartsform »Das sind« ist jedoch in der erzählten Vergangenheit weniger passend; zudem ist »Helden« gegenüber גִּבֹּרִים leicht idealisierend.'
  naturalness: Der Satz ist grundsätzlich idiomatisch und registergerecht. Gedankenstriche verdeutlichen besser, dass »und auch später« eine eingeschobene zeitliche Ergänzung ist. »Mächtige Männer aus alter Zeit, berühmte Männer« ist modernes, verständliches Deutsch und gibt die zwei Appositionen ohne heroische Wertung wieder.
  terminology: '»Menschentöchter«, »Söhne Gottes«, »Nephilim« und »Erde« sind angemessen. Die Fußnote zu »Söhne Gottes« benötigt eine grammatische Korrektur: Nicht die pluralische Wortgruppe, sondern »die Bezeichnung« kann als »göttliche Wesen« verstanden werden.'
