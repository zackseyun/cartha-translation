  rationale: Die Revision hält alle umstrittenen Referenten und den Sinn von Nephilim offen. Sie stellt die Satzzeit in die erzählte Vergangenheit, vermeidet eine mögliche Idealisierung durch »Helden«, macht die zeitliche Einfügung lesbarer und korrigiert die Grammatik der Fußnote, ohne den Sinngehalt oder die Fußnotenanker zu verändern.
