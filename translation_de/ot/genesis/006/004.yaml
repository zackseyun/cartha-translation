- from: Die Nephilim[a] waren in jenen Tagen auf der Erde, und auch danach, als die Söhne Gottes[b] zu den Menschentöchtern[c] eingingen und diese ihnen Kinder gebaren. Das sind die Helden der Vorzeit, die Männer von Ruhm.
