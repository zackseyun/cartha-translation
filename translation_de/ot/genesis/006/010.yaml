  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: de
  text: 'Und Noah zeugte drei Söhne: Sem, Ham und Jafet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet hier Noah als männlichen Erzeuger der genannten Söhne. „zeugte“ bewahrt den ausdrücklich väterlichen Sinn und passt zum würdevollen genealogischen Stil; das allgemeinere „hatte“ wäre weniger genau.
- source_word: שְׁלֹשָׁה בָנִים
  choice: drei Söhne
  rationale: בָנִים bezeichnet hier ausdrücklich Söhne, wie auch die anschließenden männlichen Namen bestätigen.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Ham und Jafet
  rationale: Die wiederholte Objektmarkierung אֶת wird im Deutschen nicht eigens wiedergegeben. Die Namen folgen den im Deutschen etablierten biblischen Formen.
- source_word: נֹחַ
  choice: Noah
  rationale: „Noah“ ist die etablierte deutsche Form des hebräischen Personennamens נֹחַ.
