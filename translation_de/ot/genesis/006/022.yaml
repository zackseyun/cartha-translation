  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: de
  text: 'Und Noah tat es[a]: Ganz so, wie Gott es ihm geboten hatte, tat er es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der Vers: „Und Noah tat“. Das Hebräische wiederholt das Verb „tun“ am Versende und hebt so hervor, dass Noah den Auftrag vollständig ausführte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: tat es ... tat er es
  rationale: עָשָׂה ist ein breites Verb im Sinn von „tun/machen“. Die zweimalige Wiedergabe mit „tun“ bewahrt die betonte Wiederholung des Hebräischen; das im Deutschen notwendige „es“ ist aus dem vorausgehenden Auftrag erschlossen.
- source_word: נֹחַ
  choice: Noah
  rationale: Eingebürgerte deutsche Namensform.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Formulierung drückt vollständige Übereinstimmung mit allem Gebotenen aus. „Ganz so, wie“ gibt sowohl den Vergleich als auch die umfassende Aussage in natürlichem Deutsch wieder.
- source_word: צִוָּה אֹתוֹ
  choice: es ihm geboten hatte
  rationale: צוה bezeichnet ein verbindliches Gebot. Das hebräische persönliche Objekt wird nach deutscher Syntax mit dem Dativ „ihm“ wiedergegeben; „es“ verweist auf den erteilten Auftrag.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier aufgrund des singularischen Verbs den einen Gott.
- source_word: כֵּן
  choice: so
  rationale: כֵּן nimmt die vorangehende Vergleichsaussage auf und betont die genaue Entsprechung.
theological_decisions:
- issue: Betonung von Noahs Gehorsam durch die Wiederholung von עשה
  choice: 'Beide Vorkommen werden wiedergegeben: „tat es ... tat er es“.'
  alternative: „Noah tat alles, was Gott ihm geboten hatte.“
  rationale: Die zusammengezogene Alternative wäre flüssiger, beseitigte aber die bewusste Wiederholung und damit einen Akzent des Ausgangstextes. Die gewählte Fassung bewahrt diesen Akzent, ohne Noahs Handeln theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass der zweite Satzteil den ersten erläutert. „Geboten hatte“ entspricht im erzählenden Zusammenhang natürlichem deutschem Tempusgebrauch; die hebräische Verbwiederholung bleibt sichtbar.
