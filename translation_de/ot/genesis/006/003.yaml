  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: de
  text: 'Da sagte Jahwe: »Mein Geist wird nicht für immer mit dem Menschen ringen[a], denn er ist Fleisch[b]. Seine Tage werden hundertzwanzig Jahre betragen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Geist wird nicht für immer im Menschen bleiben.« Das hebräische Verb ist in seiner Bedeutung umstritten.'
    reason: alternative_reading
  - marker: b
    text: 'Mit »der Mensch« ist hier die Menschheit gemeint; das Hebräische verwendet den generischen Singular adam. Möglich ist auch: »denn auch er ist Fleisch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen im Deutschen in der etablierten wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יָדוֹן
  choice: wird … ringen
  rationale: Das schwierige Verb wird als Auseinandersetzung bzw. Widerstand verstanden. Die ebenfalls mögliche Bedeutung „bleiben“ wird wegen der echten lexikalischen Unsicherheit in einer Fußnote bewahrt.
- source_word: רוּחִי
  choice: mein Geist
  rationale: Der Possessivausdruck im Mund Gottes legt Gottes Geist nahe; „Geist“ wahrt zugleich die Bedeutungsweite von רוּחַ, ohne spätere dogmatische Präzisierungen einzutragen.
- source_word: בָאָדָם
  choice: mit dem Menschen
  rationale: Bei der gewählten Bedeutung „ringen“ verlangt idiomatisches Deutsch „mit“. Der Singular gibt אָדָם als generische Bezeichnung der Menschheit wieder.
- source_word: לְעֹלָם
  choice: für immer
  rationale: Natürliche und genaue Wiedergabe der zeitlichen Wendung.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: denn er ist Fleisch
  rationale: Die seltene Verbindung wird kausal verstanden. „Fleisch“ bewahrt die anthropologische und theologische Bildsprache; ein isoliertes „auch“ wäre im Deutschen unklar.
- source_word: וְהָיוּ יָמָיו
  choice: Seine Tage sollen … betragen
  rationale: Bewahrt die parataktische Fortführung des Hebräischen, ohne einen im Wortlaut nicht ausdrücklich markierten Folgeschluss durch „darum“ einzutragen.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: hundertzwanzig Jahre
  rationale: Literarisch natürliche ausgeschriebene Zahlenangabe.
theological_decisions:
- issue: Bedeutung von Gottes רוּחַ in Beziehung zum Menschen
  choice: mein Geist
  alternative: mein Atem / mein Lebensatem
  rationale: Der göttliche Sprecher und das Suffix der ersten Person sprechen für Gottes Geist. Die Übersetzung vermeidet zugleich eine über den Vers hinausgehende trinitarische Festlegung.
- issue: Bedeutung des umstrittenen Verbs יָדוֹן
  choice: mit dem Menschen ringen
  alternative: im Menschen bleiben
  rationale: Die Lesart als göttliches Ringen oder Widerstreiten ist sprachlich vertretbar, doch die Bleibe-Lesart bleibt ernsthaft möglich und wird daher ausdrücklich vermerkt.
- issue: Reichweite von אָדָם
  choice: der Mensch als generischer Singular
  alternative: die Menschheit
  rationale: Der deutsche generische Singular entspricht Form und repräsentativer Funktion des hebräischen אָדָם; die Fußnote macht den kollektiven Bezug deutlich.
- issue: Bedeutung der hundertzwanzig Jahre
  choice: ohne nähere Deutung wiedergegeben
  alternative: Lebenshöchstalter oder Frist bis zur Flut
  rationale: Der Vers kann als Begrenzung menschlicher Lebenszeit oder als verbleibende Frist verstanden werden. Die Übersetzung entscheidet diese kontextuelle Frage nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzfolge, vermeidet jedoch unnatürliche Wörtlichkeit. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
