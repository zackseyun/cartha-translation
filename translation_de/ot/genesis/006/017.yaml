source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: de
  text: Und ich – siehe, ich bringe die Wasserflut über die Erde, um alles Fleisch unter dem Himmel zu vernichten, in dem Lebensatem[a] ist. Alles, was auf der Erde ist, wird umkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lebensgeist«. Das hebräische Wort רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich
  rationale: Die selbstständige erste Person ist betont und hebt Gottes Handeln hervor; die knappe Wiedergabe bewahrt diesen Nachdruck.
- source_word: הִנְנִי
  choice: siehe, ich
  rationale: Die Wendung verleiht der Ankündigung feierlichen Nachdruck und unmittelbare Gegenwärtigkeit. „Siehe“ ist im biblischen Erzählregister verständlich und würdevoll.
- source_word: מֵבִיא
  choice: ich bringe
  rationale: Das Partizip stellt das Handeln als unmittelbar bevorstehend beziehungsweise bereits im Gang dar, ohne ausdrücklich „gleich“ oder „im Begriff sein“ hinzuzufügen.
- source_word: הַמַּבּוּל מַיִם
  choice: die Wasser der Flut
  rationale: Die Formulierung gibt sowohl den besonderen Ausdruck für die Sintflut als auch das ausdrücklich genannte Wasser wieder und bleibt im Deutschen natürlich.
- source_word: עַל הָאָרֶץ
  choice: über die Erde
  rationale: „Erde“ entspricht dem umfassenden Horizont der Passage; „über“ bezeichnet hier das Hereinbrechen der Flut auf die Erde.
- source_word: לְשַׁחֵת
  choice: um ... zu vernichten
  rationale: Der Infinitiv bezeichnet den Zweck; „vernichten“ gibt die umfassende Zerstörung im Gerichtskontext deutlich wieder.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die prägnante biblische Sammelbezeichnung bleibt erhalten und wird nicht vorschnell auf Menschen oder Tiere allein eingeengt.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: in dem Lebensatem ist
  rationale: „Lebensatem“ bezeichnet hier am ehesten die belebende Atemkraft der Geschöpfe und wahrt zugleich durch eine Fußnote die mögliche Bedeutung „Lebensgeist“.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die feste räumliche Wendung bezeichnet den gesamten Bereich unter dem Himmelsgewölbe und unterstreicht den umfassenden Geltungsbereich.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Alles, was auf der Erde ist
  rationale: Die Wiedergabe erhält die zusammenfassende und uneingeschränkte Aussage des Hebräischen.
- source_word: יִגְוָע
  choice: wird umkommen
  rationale: Das Verb bezeichnet das Sterben beziehungsweise Verhauchen; „umkommen“ passt zum feierlichen Gerichtswort und benennt den Tod klar.
theological_decisions:
- issue: Bedeutung von רוּחַ in רוּחַ חַיִּים
  choice: Lebensatem
  alternative: Lebensgeist
  rationale: Im Zusammenhang der Flut bezeichnet die Wendung am natürlichsten den belebenden Atem der Geschöpfe und knüpft an die Schöpfungssprache an. Da רוּחַ auch „Geist“ bedeuten kann, wird diese echte lexikalische Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener biblischer Ausdrucksweise bei „siehe“ und „alles Fleisch“. Der Gedankenstrich trägt den emphatischen Neueinsatz von וַאֲנִי, ohne die Syntax unnötig zu glätten.
