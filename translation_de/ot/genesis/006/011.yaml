  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: de
  text: Die Erde war vor Gott verdorben[a], und die Erde war voller Gewalt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Land war in Gottes Augen verdorben.“'
    reason: 'Lexikalische Alternativen: אֶרֶץ kann „Erde“ oder „Land“ bedeuten; לִפְנֵי kann hier auch sinngemäß mit „in Gottes Augen“ wiedergegeben werden.'
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: war verdorben
  rationale: Das Nifal von שׁחת bezeichnet hier einen verdorbenen, zugrunde gerichteten Zustand. Im unmittelbaren Zusammenhang mit Bosheit und Gewalt liegt moralische Verderbtheit nahe; „war verdorben“ bewahrt zugleich den resultativen Klang.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Kontext der Fluterzählung ist „die Erde“ vorzuziehen. Die Wiederholung in beiden Satzteilen wird entsprechend dem Hebräischen beibehalten.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: לִפְנֵי bedeutet wörtlich „vor“ beziehungsweise „in der Gegenwart von“. „Vor Gott“ ist knapp, natürlich und lässt sowohl Gottes Gegenwart als auch sein Urteil anklingen, ohne die Wendung auszudeuten.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Syntax und Kontext weisen eindeutig auf den einen Gott; daher steht im Deutschen der Singular.
- source_word: וַתִּמָּלֵא
  choice: war voller
  rationale: Das Nifal von מלא beschreibt, dass die Erde von Gewalt erfüllt war. Das idiomatische deutsche „war voller“ gibt den erreichten Zustand natürlich wieder.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet Gewalt, Gewalttat und schweres Unrecht. „Gewalt“ ist hier die direkte, prägnante Wiedergabe und passt zum erzählerischen Zusammenhang.
theological_decisions:
- issue: Art des Verderbens der Erde
  choice: Moralische Verderbtheit der Erde beziehungsweise der menschlichen Gesellschaft vor Gott
  alternative: Physische Zerstörung oder Verwüstung der Erde
  rationale: Der unmittelbare Kontext nennt menschliche Bosheit und Gewalt. Dennoch wird nicht ausdrücklich „die Menschen“ eingesetzt, sondern die umfassende Aussage über „die Erde“ bewahrt.
- issue: Bedeutung von „vor Gott“
  choice: Die hebräische Wendung formal als „vor Gott“ stehen lassen
  alternative: Deutend „in Gottes Augen“
  rationale: „Vor Gott“ erhält die mögliche Spannung zwischen Gegenwart und Beurteilung Gottes, während „in Gottes Augen“ die Aussage stärker auf göttliche Bewertung festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt bewusst schlicht und bewahrt die hebräische Wiederholung von „die Erde“. „Voller Gewalt“ ist im heutigen Deutsch natürlicher als „mit Gewalt erfüllt“, ohne den Sinn abzuschwächen.
