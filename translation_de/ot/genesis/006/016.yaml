  to: Du sollst für die Arche ein Dach[a] machen und es oben bis zu einer Elle vollenden.[b] Die Tür der Arche sollst du an ihrer Seite anbringen. Mit einem unteren, einem zweiten und einem dritten Stockwerk[c] sollst du sie bauen.
  rationale: Die einzige notwendige Änderung ersetzt die im Deutschen irreführende Präposition „bis auf“ durch „bis zu“. Damit wird der schwierige hebräische Wortlaut nicht architektonisch vereindeutigt, aber genauer und verständlicher wiedergegeben. Die Fußnote bewahrt die verbleibende Auslegungsunsicherheit.
