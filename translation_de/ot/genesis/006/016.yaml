  text: צֹ֣הַר תַּֽעֲשֶׂ֣ה לַ/תֵּבָ֗ה וְ/אֶל אַמָּה֙ תְּכַלֶ֣/נָּה מִ/לְ/מַ֔עְלָ/ה וּ/פֶ֥תַח הַ/תֵּבָ֖ה בְּ/צִדָּ֣/הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּ/שְׁלִשִׁ֖ים תַּֽעֲשֶֽׂ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: de
  text: Du sollst für die Arche ein Dach[a] machen und es oben bis zu einer Elle vollenden.[b] Die Tür der Arche sollst du an ihrer Seite anbringen. Mit einem unteren, einem zweiten und einem dritten Stockwerk[c] sollst du sie bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Fenster“ oder „eine Lichtöffnung“. Das seltene hebräische Wort ist in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Wortlaut ist schwer verständlich. Möglicherweise beschreibt er, dass die Arche oben bis zu einem Maß von einer Elle fertiggestellt oder auf eine Elle verjüngt werden sollte.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Decks“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: Dach
  rationale: Das seltene Substantiv bezeichnet hier wahrscheinlich eine bauliche Vorrichtung oben an der Arche. „Dach“ passt zum architektonischen Zusammenhang; „Fenster“ oder „Lichtöffnung“ bleiben jedoch mögliche Deutungen und werden in einer Fußnote genannt.
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: und es oben bis auf eine Elle vollenden
  rationale: Die schwierige Wendung wird eng am Hebräischen wiedergegeben, ohne eine bestimmte Dachform oder Verjüngung festzulegen. „Bis auf eine Elle“ bewahrt die Unklarheit darüber, was genau das Ellenmaß beschreibt.
- source_word: פֶּתַח
  choice: Tür
  rationale: Im Bauzusammenhang bezeichnet das Wort die zum Betreten bestimmte Öffnung; „Tür“ ist dafür im Deutschen die natürlichste Wiedergabe.
- source_word: בְּצִדָּהּ
  choice: an ihrer Seite
  rationale: Die Formulierung gibt die Lage der Tür an der Seitenwand der Arche natürlich wieder.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: ein unteres, ein zweites und ein drittes Stockwerk
  rationale: Die drei Formen bezeichnen übereinanderliegende Ebenen. „Stockwerk“ ist neutraler als das stärker schifffahrtssprachliche „Deck“ und bleibt auch für die kastenförmig beschriebene Arche verständlich.
- source_word: תַּעֲשֶׂהָ
  choice: sollst du sie bauen
  rationale: Das feminine Suffix bezieht sich auf die Arche; „bauen“ ergibt im Deutschen einen natürlichen Abschluss der Bauanweisung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Anweisungsform „sollst du“ bewahrt den verbindlichen Charakter des hebräischen Textes. Die syntaktisch und sachlich schwierige Angabe zur Elle wird bewusst nicht architektonisch vereindeutigt.
