  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Oben bis auf eine Elle vollenden“ ist allerdings missverständlich; „bis zu einer Elle“ ist die nähere und idiomatischere Wiedergabe, ohne die architektonische Einzelheit festzulegen.
  terminology: „Arche“, „Dach“, „Tür“ und „Stockwerk“ sind angemessen. Die Fußnote zu צֹהַר erhält die möglichen Alternativen. „Stockwerk“ ist als neutrale Bezeichnung der drei Ebenen gut vertretbar; „Decks“ bleibt als Alternative genannt.
