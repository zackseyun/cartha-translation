  register: Modernes, würdiges Standarddeutsch. Die Maßeinheit „Elle“ bleibt zur Wahrung des antiken Bezugs unkonvertiert; die kompakte Reihe „lang, breit und hoch“ sorgt für natürliche Verständlichkeit.
