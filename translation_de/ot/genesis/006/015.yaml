  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: de
  text: 'Und so sollst du sie bauen: Die Arche soll dreihundert Ellen[a] lang, fünfzig Ellen breit und dreißig Ellen hoch sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle war ein antikes Längenmaß, ungefähr die Strecke vom Ellenbogen bis zu den Fingerspitzen.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: Und so sollst du sie bauen
  rationale: Die Wendung leitet die konkrete Bauanweisung ein. „Bauen“ gibt עשה im Zusammenhang mit der Arche natürlich wieder; das feminine Pronomen wird durch „sie“ bewahrt.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: „Arche“ ist im Deutschen die etablierte und kontextuell eindeutige Bezeichnung für Noahs Gefährt.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה אֹרֶךְ
  choice: dreihundert Ellen lang
  rationale: Die antike Maßeinheit bleibt erhalten; die prädikative deutsche Formulierung gibt die Maßangabe klar und idiomatisch wieder.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: fünfzig Ellen breit
  rationale: „Breit“ entspricht der Angabe der Breite und klingt bei Abmessungen im heutigen Deutsch natürlich.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: und dreißig Ellen hoch
  rationale: Im baulichen Zusammenhang bezeichnet קוֹמָה die Höhe; „hoch“ fügt sich idiomatisch in die parallele Maßreihe ein.
theological_decisions: []
