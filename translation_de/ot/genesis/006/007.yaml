  terminology: „Jahwe“, „Erdboden“, „Vieh“, „Kriechtiere“ und „Vögel des Himmels“ sind konsistent und quellentreu. „Den Menschen“ kann hier kollektiv verstanden werden und erhält zugleich den Zusammenhang zur anschließenden Wiederholung. Die Fußnotenmarker stehen an den passenden Textstellen und ihre Inhalte entsprechen den jeweiligen Ankern.
