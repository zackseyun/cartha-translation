id: GEN.6.7
reference: Genesis 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: de
  text: 'Da sagte Jahwe: „Ich werde den Menschen[a], den ich erschaffen habe, vom Erdboden auslöschen – vom Menschen bis zum Vieh, bis zu den Kriechtieren und bis zu den Vögeln des Himmels[c] –, denn ich bedaure, dass ich sie gemacht habe[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Menschheit“. Das hebräische adam kann die Menschheit als Ganzes bezeichnen; „den Menschen“ bewahrt hier zugleich die Wiederholung im folgenden Satzteil.
    reason: lexical_alternative
  - marker: b
    text: Oder „es tut mir leid, dass ich sie gemacht habe“ beziehungsweise „es schmerzt mich, dass ich sie gemacht habe“. Das hebräische Verb bezeichnet Bedauern oder Schmerz über eine frühere Handlung; für sich genommen sagt es nicht, dass Gott überrascht wurde, etwas nicht vorherwusste oder moralisch falsch gehandelt hatte.
    reason: alternative_reading
  - marker: c
    text: Wörtlich „Vögel des Himmels“; sinngemäß auch „Vögel am Himmel“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶמְחֶה
  choice: ich werde … auslöschen
  rationale: מחה bezeichnet ein Wegwischen oder Auslöschen. „Auslöschen“ bewahrt das konkrete Bild und verbindet sich im Deutschen natürlich mit „vom Erdboden“.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: אָדָם bezeichnet hier kollektiv die Menschheit. „Den Menschen“ lässt diesen kollektiven Sinn zu und bewahrt zugleich die Wiederholung im anschließenden „vom Menschen bis zum Vieh“.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: den ich erschaffen habe
  rationale: Die Relativkonstruktion bezieht sich auf den Menschen; das Perfekt bezeichnet Gottes abgeschlossene Schöpfungshandlung mit gegenwärtiger Bedeutung.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Erdboden
  rationale: אֲדָמָה meint hier den Erdboden beziehungsweise das Land. Die knappe deutsche Wendung gibt den Sinn der hebräischen Formulierung „von der Oberfläche des Erdbodens“ natürlich wieder.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמַיִם
  choice: vom Menschen bis zum Vieh, bis zu den Kriechtieren und bis zu den Vögeln des Himmels
  rationale: Bewahrt die gestufte Aufzählung des Hebräischen. „Vieh“ gibt בְּהֵמָה hier präzise wieder; „Kriechtiere“ ist eine verständliche Wiedergabe von רֶמֶשׂ.
- source_word: נִחַמְתִּי
  choice: ich bedaure
  rationale: Der Niphal von נחם bezeichnet hier rückblickendes Bedauern beziehungsweise schmerzliches Bereuen einer früheren Handlung. „Ich bedaure“ erhält diese Spannung, ohne Überraschung, Unwissenheit oder moralische Schuld ausdrücklich hinzuzufügen.
- source_word: כִּי עֲשִׂיתִם
  choice: dass ich sie gemacht habe
  rationale: Das Pluralsuffix verweist auf die zuvor genannten Geschöpfe. „Gemacht habe“ gibt die vollendete Handlung und ihre gegenwärtige Folge wieder.
theological_decisions:
- issue: Gottes Bedauern in נִחַמְתִּי
  choice: denn ich bedaure, dass ich sie gemacht habe
  alternative: denn es schmerzt mich, dass ich sie gemacht habe; denn es tut mir leid, dass ich sie gemacht habe
  rationale: Die Formulierung bewahrt die rückblickende Aussage des hebräischen Verbs und löst die theologische Spannung nicht vorschnell auf. Sie behauptet für sich genommen weder, Gott sei überrascht worden, noch, er habe unwissend oder moralisch falsch gehandelt.
- issue: Kollektiver Sinn von הָאָדָם
  choice: den Menschen
  alternative: die Menschheit
  rationale: „Den Menschen“ kann im Deutschen die Menschheit kollektiv bezeichnen und erhält zugleich die lexikalische Wiederholung mit „vom Menschen bis zum Vieh“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die gestufte Aufzählung und das konkrete Bild des Auslöschens bleiben erhalten; unnötig altertümliche Formen werden vermieden.
