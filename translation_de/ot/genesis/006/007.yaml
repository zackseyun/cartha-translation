  source_fidelity: 'Die Übersetzung gibt die Aussageglieder des Hebräischen vollständig und in der richtigen Beziehung wieder: JHWHs Rede, das Auslöschen vom Erdboden, die gestufte Reihe Mensch–Vieh–Kriechtiere–Vögel sowie das begründende Bedauern über das Gemacht-Haben. „Ich bedaure“ ist für נִחַמְתִּי eine sachgerechte, nicht doktrinär glättende Wiedergabe; die Fußnote wahrt die mögliche Nuance von Schmerz bzw. Bedauern, ohne Zusatzbehauptungen zum göttlichen Wissen zu machen.'
