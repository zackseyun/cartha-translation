  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: de
  text: Und du, nimm dir von jeder Art Nahrung, die gegessen werden kann[a], und sammle sie bei dir. Sie wird dir und ihnen als Nahrung dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gegessen wird“. Die hebräische Formulierung kann das bezeichnen, was tatsächlich gegessen wird, oder allgemeiner das, was zum Essen geeignet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: nimm dir
  rationale: Der Imperativ קַח wird direkt mit „nimm“ wiedergegeben; das Dativpronomen לְךָ erscheint idiomatisch und zugleich quellennah als „dir“.
- source_word: מִכָּל מַאֲכָל
  choice: von jeder Art Nahrung
  rationale: Die Formulierung bezeichnet eine Auswahl aus dem gesamten Spektrum der Nahrung. „Von jeder Art Nahrung“ drückt die umfassende Auswahl aus, ohne zu behaupten, Noah solle sämtliche vorhandene Nahrung mitnehmen.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: die gegessen werden kann
  rationale: Der Niphal von אכל lässt sich hier modal als Eignung zum Verzehr verstehen. Die Formulierung ist im modernen Deutsch natürlicher als das wörtlichere „die gegessen wird“, ohne diese Möglichkeit zu verschweigen.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: und sammle sie bei dir
  rationale: אָסַף bedeutet „sammeln“; אֵלֶיךָ bezeichnet die Zusammenführung zu Noah hin beziehungsweise die Aufbewahrung bei ihm.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: Sie soll dir und ihnen als Nahrung dienen
  rationale: Die Folgeaussage wird mit „soll … dienen“ wiedergegeben. Das wiederholte לְ unterscheidet klar zwischen Noah und den Tieren; לְאָכְלָה bezeichnet den Zweck als Nahrung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Und du“ bewahrt die Hervorhebung des hebräischen Personalpronomens. Der zweite Hauptsatz vermeidet eine schwerfällige Wiederholung von „Nahrung“, ohne den Zweck der Vorräte abzuschwächen.
