  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: de
  text: 'Aber ich werde meinen Bund mit dir aufrichten[a]. Du sollst in die Arche gehen: du, deine Söhne, deine Frau und die Frauen deiner Söhne mit dir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Bund mit dir bestätigen“. Das hebräische Verb kann in Verbindung mit einem Bund beide Bedeutungsnuancen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Aber ich werde … aufrichten
  rationale: Das Hifil von קום kann in Verbindung mit בְּרִית das Aufrichten oder Bestätigen eines Bundes bezeichnen. „Aufrichten“ bewahrt die traditionelle Bundessprache und den zukunftsbezogenen Charakter; „Aber“ gibt den Gegensatz zur zuvor angekündigten Vernichtung wieder.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die etablierte und sachlich genaue deutsche Entsprechung für בְּרִית und wahrt die kanonisch-theologische Begriffskontinuität.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die schlichte Wendung gibt sowohl die Bundesbeziehung als auch beim zweiten Vorkommen die Begleitung idiomatisch wieder.
- source_word: וּבָאתָ
  choice: Du sollst … gehen
  rationale: בוא kann je nach Perspektive „kommen“, „gehen“ oder „hineingehen“ bedeuten. Mit der Arche als Ziel ist „in die Arche gehen“ im Deutschen natürlich und klar.
- source_word: הַתֵּבָה
  choice: die Arche
  rationale: „Arche“ ist im Noahbericht die gebräuchliche und kontextuell eindeutige Wiedergabe von תֵּבָה.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen wird durch die nach dem Doppelpunkt folgende Aufzählung betont wiedergegeben.
- source_word: וּבָנֶיךָ
  choice: deine Söhne
  rationale: Der hebräische Text nennt ausdrücklich die Söhne, nicht allgemein die Kinder.
- source_word: וְאִשְׁתְּךָ
  choice: deine Frau
  rationale: Natürliche moderne Wiedergabe der familiären Bedeutung von אִשָּׁה.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: die Frauen deiner Söhne
  rationale: Die Formulierung folgt dem hebräischen Konstrukt enger als „Schwiegertöchter“ und ist zugleich verständlich.
theological_decisions:
- issue: Bedeutung der Bundesformel
  choice: „meinen Bund mit dir aufrichten“ als zukunftsbezogene Bundeszusage
  alternative: „meinen Bund mit dir bestätigen“
  rationale: Die hebräische Verbindung kann sowohl die Stiftung als auch die Bestätigung eines Bundes ausdrücken. Der Haupttext verwendet die übliche Bundessprache, während die Fußnote die echte Mehrdeutigkeit wahrt und nicht entscheidet, ob hier ein neuer Bund eingesetzt oder eine frühere göttliche Verpflichtung bekräftigt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung mit Doppelpunkt bildet die hervorgehobene Aufzählung natürlich ab; die Bundessprache bleibt bewusst traditionsnah, ohne altertümlich zu wirken.
