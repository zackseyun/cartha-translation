  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: de
  text: Dies ist die Geschichte Noahs. Noah war ein gerechter Mann, untadelig in seiner Zeit[a]. Noah ging mit Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seinen Generationen“; auch möglich: „unter seinen Zeitgenossen“.'
    reason: Der hebräische Plural בְּדֹרֹתָיו kann Noahs Zeit beziehungsweise Generationen oder die Menschen seiner Zeit bezeichnen.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Dies ist die Geschichte
  rationale: Die hebräische Überschriftsformel eröffnet einen neuen Abschnitt. „Geschichte“ gibt ihre Funktion im Deutschen natürlich wieder, ohne sie auf eine bloße Abstammungsliste einzuengen.
- source_word: נֹחַ
  choice: Noah
  rationale: Eingebürgerte deutsche Form des Eigennamens.
- source_word: אִישׁ צַדִּיק
  choice: ein gerechter Mann
  rationale: Die Formulierung gibt sowohl die männliche Personenbezeichnung als auch das ethisch und theologisch gewichtige צַדִּיק direkt wieder.
- source_word: תָּמִים
  choice: untadelig
  rationale: Im Zusammenhang bezeichnet das Wort ungeteilte Rechtschaffenheit beziehungsweise einen untadeligen Lebenswandel, nicht notwendig absolute Sündlosigkeit.
- source_word: בְּדֹרֹתָיו
  choice: unter seinen Zeitgenossen
  rationale: Die idiomatische deutsche Wiedergabe versteht den hebräischen Plural als Bezeichnung für die Menschen beziehungsweise die Zeit, in der Noah lebte. Die formnähere, mehrdeutige Wiedergabe steht in der Fußnote.
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: ging mit Gott
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom Gehen mit Gott und seine Verbindung zu Genesis 5,22–24, bleibt dabei aber in modernem Deutsch verständlich.
theological_decisions:
- issue: Bedeutung von תָּמִים als Beschreibung Noahs
  choice: „untadelig“ als Aussage über seine Rechtschaffenheit
  alternative: „vollkommen“ oder „ohne Fehl“
  rationale: „Untadelig“ erhält das starke positive Urteil, ohne dem Vers eine Aussage über absolute Sündlosigkeit aufzuzwingen.
- issue: Bedeutung von בְּדֹרֹתָיו
  choice: „unter seinen Zeitgenossen“ im Haupttext
  alternative: „in seinen Generationen“ oder „zu seiner Zeit“
  rationale: Die gewählte Form ist natürliches Deutsch und gibt eine verbreitete Deutung wieder; die Fußnote hält die formale Mehrdeutigkeit des hebräischen Plurals sichtbar.
- issue: Metaphorik von הִתְהַלֶּךְ mit Gott
  choice: „ging mit Gott“
  alternative: „lebte in Gemeinschaft mit Gott“
  rationale: Die Bildsprache und der innerbiblische Bezug bleiben erhalten, ohne die Art dieser Beziehung über den Wortlaut hinaus näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Überschriftsformel wird idiomatisch wiedergegeben; das zentrale Bild vom Gehen mit Gott bleibt bewusst erhalten.
