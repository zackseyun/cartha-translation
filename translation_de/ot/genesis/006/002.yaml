translation:
  language: de
  text: Und die Söhne Gottes[a] sahen, dass die Töchter der Menschen schön waren[b], und sie nahmen sich zu Frauen, wen immer sie auswählten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die göttlichen Wesen“. Wer mit den „Söhnen Gottes“ gemeint ist, ist umstritten. Zu den wichtigsten Deutungen gehören himmlische Wesen, menschliche Herrscher und die Linie Sets.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch einfach „gut“ bedeuten; hier bezeichnet es wahrscheinlich ihre äußere Attraktivität.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: die Söhne Gottes
  rationale: Die formnahe Wiedergabe bewahrt den mehrdeutigen hebräischen Ausdruck, ohne seine umstrittenen Referenten festzulegen.
- source_word: בְּנוֹת הָאָדָם
  choice: die Töchter der Menschen
  rationale: „Der Menschen“ gibt אָדָם hier natürlich als kollektive Bezeichnung für die Menschheit wieder und erhält den Gegensatz zu den „Söhnen Gottes“.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: dass … schön waren
  rationale: טוֹב bezeichnet in diesem Zusammenhang die wahrgenommene äußere Attraktivität. „Schön“ ist im modernen Deutsch natürlich und vermeidet eine irreführende moralische Wertung.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: sie nahmen sich Frauen
  rationale: Die Wendung kann das Nehmen von Frauen zu Ehefrauen bezeichnen. Die knappe Wiedergabe wahrt zugleich, dass נָשִׁים sowohl „Frauen“ als auch „Ehefrauen“ bedeuten kann, und bildet לָהֶם durch „sich“ ab.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: von allen, die sie auswählten
  rationale: Die Formulierung erhält die umfassende beziehungsweise uneingeschränkte Auswahl, die מִכֹּל ausdrückt, ohne zusätzliche Motive in den Text einzutragen.
theological_decisions:
- issue: Identität der „Söhne Gottes“
  choice: Der Ausdruck „Söhne Gottes“ bleibt unaufgelöst stehen.
  alternative: Göttliche beziehungsweise himmlische Wesen, menschliche Herrscher oder die Linie Sets.
  rationale: Der hebräische Text bestimmt die Identität nicht eindeutig. Die formnahe Wiedergabe bewahrt die exegetische und theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die strittige Identität der „Söhne Gottes“ und die Bedeutungsbreite von נָשִׁים werden nicht konfessionell vereindeutigt.
