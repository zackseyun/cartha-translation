  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: de
  text: Und Jahwe sah, dass die Bosheit der Menschen auf der Erde groß war und dass alles Denken und Trachten ihres Herzens allezeit nur böse war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nur böse den ganzen Tag“; sinngemäß auch: „fortwährend böse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Und … sah
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; „Und … sah“ bewahrt die hebräische Verknüpfung in natürlichem biblischem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: die Bosheit der Menschen … groß war
  rationale: רָעָה bezeichnet hier moralische Bosheit, רַבָּה deren großes Ausmaß; das kollektive הָאָדָם meint die Menschheit beziehungsweise die Menschen insgesamt.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Im Kontext der Urgeschichte bezeichnet אֶרֶץ die Erde und nicht ein bestimmtes Land.
- source_word: יֵצֶר
  choice: Sinnen
  rationale: יֵצֶר bezeichnet hier das innere Formen, Trachten oder die Ausrichtung, aus der Gedanken hervorgehen. „Sinnen“ erhält die ungewöhnliche, aber bedeutungsvolle Verbindung mit „Gedanken“.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: die Gedanken ihres Herzens
  rationale: Die Wendung bewahrt „Herz“ als Zentrum von Denken, Wollen und Begehren; der deutsche Pluralbezug entspricht dem kollektiv verstandenen הָאָדָם.
- source_word: רַק רַע כָּל־הַיּוֹם
  choice: den ganzen Tag nur böse
  rationale: Die Wiedergabe erhält sowohl die ausschließende Kraft von רַק als auch die wörtliche zeitliche Aussage von כָּל־הַיּוֹם.
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ macht diesen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Kollektive Bedeutung von הָאָדָם
  choice: der Menschen / ihres Herzens
  alternative: des Menschen / seines Herzens
  rationale: הָאָדָם bezeichnet hier die Menschheit kollektiv. Der deutsche Plural gibt den umfassenden Bezug natürlich wieder; der Singular wäre formnäher, könnte aber wie eine Aussage über einen einzelnen Menschen wirken.
- issue: Umfang der Aussage רַק רַע כָּל־הַיּוֹם
  choice: den ganzen Tag nur böse
  alternative: fortwährend böse
  rationale: Die wörtlichere Fassung bewahrt sowohl die Ausschließlichkeit als auch die zeitliche Spannung des Hebräischen, ohne die Aussage systematisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sinnen“ ist bewusst leicht gehoben, um יֵצֶר als innere Ausrichtung und nicht bloß als einzelnen Gedanken wiederzugeben. Der kollektive Sinn von אָדָם wird durch den Plural natürlich ausgedrückt.
