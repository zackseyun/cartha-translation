  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: de
  text: Als die Menschen begannen, sich auf dem Erdboden zu vermehren, und ihnen Töchter geboren wurden,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als
  rationale: Die feste Erzählkonstruktion leitet hier einen zeitlichen Nebensatz ein. Im Deutschen gibt „Als“ die Funktion natürlich wieder; ein zusätzliches „es geschah“ wäre schwerfällig.
- source_word: הֵחֵל
  choice: begannen
  rationale: Die Hifil-Form bezeichnet in dieser Konstruktion den Beginn eines Vorgangs.
- source_word: הָאָדָם
  choice: die Menschen
  rationale: Der grammatisch singularische Ausdruck ist hier kollektiv und bezeichnet die Menschheit beziehungsweise die menschliche Bevölkerung, nicht den einzelnen Adam.
- source_word: לָרֹב
  choice: sich zu vermehren
  rationale: Der Infinitiv beschreibt zahlenmäßige Zunahme; „sich vermehren“ ist im Deutschen idiomatisch und inhaltlich genau.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf der Erde
  rationale: Die hebräische Wendung meint die Oberfläche des Erdbodens. „Auf der Erde“ bewahrt den räumlichen Sinn in natürlichem modernem Deutsch.
- source_word: וּבָנוֹת
  choice: und … Töchter
  rationale: „Töchter“ ist die direkte und natürliche Entsprechung und bereitet den Fokus des folgenden Verses vor.
- source_word: יֻלְּדוּ לָהֶם
  choice: ihnen … geboren wurden
  rationale: Das Passiv von ילד mit ל bezeichnet, dass der menschlichen Bevölkerung Kinder geboren wurden; die deutsche Wortstellung ist natürlich und quellennah.
theological_decisions:
- issue: Kollektive Bedeutung von הָאָדָם
  choice: die Menschen
  alternative: der Mensch / die Menschheit
  rationale: Der Kontext spricht von einer sich vermehrenden Gesamtbevölkerung und von Töchtern, die „ihnen“ geboren werden. Die pluralische Wiedergabe macht die kollektive Bedeutung im Deutschen klar, ohne eine ausschließlich männliche Referenz einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Eröffnungsformel wurde nicht mechanisch mit „Und es geschah“ wiedergegeben, sondern als natürlicher temporaler Satzanschluss gestaltet. Das abschließende Komma hält den syntaktischen Anschluss an Vers 2 offen.
