  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: de
  text: 'Und Gott sah die Erde, und siehe: sie war verdorben[a], denn alles Fleisch hatte seinen Weg auf der Erde verdorben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugrunde gerichtet“. Das hebräische Wort kann sowohl moralisches Verderben als auch Verfall oder Zerstörung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das erzählende וַיַּרְא wird schlicht mit „sah“ wiedergegeben; dies bewahrt den Handlungsablauf, ohne eine zusätzliche wertende Nuance einzutragen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den einen Gott und wird im Deutschen natürlich mit „Gott“ wiedergegeben.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Zusammenhang der Fluterzählung ist „die Erde“ angemessener als das ebenfalls mögliche „das Land“ und lässt die umfassende Perspektive des Textes erkennen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Und siehe“ erhält den aufmerksamkeitslenkenden, anschaulichen und feierlichen Charakter von וְהִנֵּה.
- source_word: נִשְׁחָתָה
  choice: war verdorben
  rationale: „Verdorben“ kann im Deutschen sowohl moralische Verderbtheit als auch einen zugrunde gerichteten Zustand bezeichnen. So bleibt die Bedeutungsbreite der Niphal-Form von שׁחת erhalten.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier den zuvor festgestellten Zustand. „Denn“ fügt sich natürlich in den feierlichen Erzählstil ein.
- source_word: הִשְׁחִית
  choice: hatte … verdorben
  rationale: Die Wiederholung von „verdorben“ macht sichtbar, dass im Hebräischen dieselbe Wurzel שׁחת wie im vorangehenden Satzteil steht. Das Plusquamperfekt kennzeichnet die vorausliegende Handlung, die den Zustand der Erde erklärt.
- source_word: כָּל־בָּשָׂר
  choice: alles Fleisch
  rationale: Die hebräische Wendung wird beibehalten, damit ihre mögliche Reichweite nicht vorschnell auf die gesamte Menschheit oder auf alle Lebewesen festgelegt wird.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: „Seinen Weg“ bewahrt das Bild des hebräischen דֶּרֶךְ. Gemeint ist die Lebensführung, doch diese Deutung wird nicht an die Stelle der Metapher gesetzt.
- source_word: עַל־הָאָרֶץ
  choice: auf der Erde
  rationale: Die räumliche Wendung wird direkt und idiomatisch mit „auf der Erde“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von שׁחת in beiden Satzteilen
  choice: „war verdorben … hatte … verdorben“
  alternative: „war zugrunde gerichtet … hatte … zugrunde gerichtet“ oder „war zerstört … hatte … zerstört“
  rationale: „Verdorben“ hält die Wiederholung der hebräischen Wurzel sichtbar und kann sowohl moralische Zerrüttung als auch daraus erwachsenden Verfall bezeichnen. Die Übersetzung beschränkt den Text daher weder auf moralische Schuld noch auf physische Zerstörung.
- issue: Reichweite von כָּל־בָּשָׂר
  choice: „alles Fleisch“
  alternative: „alle Menschen“ oder „alle Lebewesen“
  rationale: Die hebräische Sammelbezeichnung bleibt erhalten, da der Ausdruck im Zusammenhang unterschiedlich weit verstanden werden kann. Eine engere Auslegung würde die im Wortlaut liegende Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem biblischem Erzählton. „Und siehe“ und „alles Fleisch“ erhalten die markanten hebräischen Ausdrucksweisen; der Doppelpunkt nach „siehe“ sorgt für natürliche deutsche Lesbarkeit. Die Wiederholung von „verdorben“ bildet die Wiederholung der Wurzel שׁחת ab.
