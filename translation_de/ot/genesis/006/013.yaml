source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: de
  text: 'Da sagte Gott zu Noah: „Das Ende allen Fleisches ist vor mich gekommen[a]; denn ihretwegen ist die Erde voller Gewalt. Siehe, ich werde sie mitsamt der Erde vernichten[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Ende allen Fleisches ist vor mich gekommen.“'
    reason: Die hebräische Wendung lautet wörtlich „ist vor mich gekommen“ und besagt, dass die Angelegenheit Gott zur Entscheidung vorliegt. קֵץ kann hier auch unbestimmt als „ein Ende“ verstanden werden.
  - marker: b
    text: 'Hebräisch wörtlich etwa: „Ich vernichte sie mit der Erde.“ Möglich ist auch: „Ich vernichte sie und die Erde.“'
    reason: Die Konstruktion אֶת־הָאָרֶץ nach einem Verb mit bereits genanntem Objekt ist syntaktisch mehrdeutig; sie kann komitativ verstanden oder als zweites direktes Objekt aufgefasst werden.
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: das Ende allen Fleisches
  rationale: Die formnahe Wiedergabe bewahrt den umfassenden Ausdruck und seine Bezüge innerhalb der Fluterzählung; „Fleisch“ ist hier nicht vorschnell auf die Menschheit zu verengen.
- source_word: בָּא לְפָנַי
  choice: ist vor mich gekommen
  rationale: 'Die hebräische Bildsprache bleibt erhalten und lässt zugleich den gerichtlichen Sinn erkennen: Das Ende steht als beschlossene Sache vor Gott.'
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: die Erde [ist] voller Gewalt
  rationale: חָמָס bezeichnet hier Gewalttat bzw. Gewalt; „Erde“ entspricht dem weiten Erzählrahmen besser als „Land“.
- source_word: מִפְּנֵיהֶם
  choice: ihretwegen
  rationale: Die Präposition ist hier kausal zu verstehen und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: וְהִנְנִי
  choice: Siehe, ich werde
  rationale: „Siehe“ bewahrt die nachdrückliche Selbstankündigung; mit dem Partizip bezeichnet die Wendung unmittelbar bevorstehendes Handeln.
- source_word: מַשְׁחִיתָם
  choice: sie vernichten
  rationale: Der Hifil von שׁחת bezeichnet im Gerichtszusammenhang das Vernichten; die deutsche Wortwahl ist klar, ohne den Zusammenhang mit der zuvor geschilderten Verderbnis auszulegen.
- source_word: אֶת־הָאָרֶץ
  choice: mitsamt der Erde
  rationale: Die syntaktisch schwierige Verbindung wird komitativ wiedergegeben. So wird vermieden, dass „mit der Erde“ fälschlich instrumental verstanden wird, während die Erde in das Gericht einbezogen bleibt.
theological_decisions:
- issue: Reichweite von „allem Fleisch“
  choice: Die breite, nicht allein auf Menschen beschränkte Formulierung bleibt erhalten.
  alternative: „alle Menschen“ oder „alle Lebewesen“
  rationale: Im Kontext der Fluterzählung kann כָּל־בָּשָׂר Menschen und weitere Lebewesen umfassen. Die wörtlich anschlussfähige Wendung wahrt diese Offenheit.
- issue: Bedeutung von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der universale Rahmen der Erzählung legt „Erde“ nahe, ohne die mögliche lexikalische Bedeutung „Land“ grundsätzlich zu leugnen.
- issue: Verhältnis von „sie“ und „Erde“ beim Vernichten
  choice: mitsamt der Erde
  alternative: „sie und die Erde vernichten“ oder formal „sie mit der Erde vernichten“
  rationale: Die Wiedergabe wahrt, dass sowohl die durch „sie“ Bezeichneten als auch die Erde vom angekündigten Verderben betroffen sind, und vermeidet eine instrumentale Fehldeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fleisch“ und „Siehe“ wurden wegen ihrer inhaltlichen und intertextuellen Tragweite beibehalten; „mitsamt“ sorgt an der schwierigen Schlusswendung für natürliche Klarheit.
