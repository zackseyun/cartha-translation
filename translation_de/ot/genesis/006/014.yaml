  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: de
  text: Baue dir eine Arche aus Gopherholz[a]. Statte die Arche mit Kammern[b] aus und bestreiche sie innen und außen mit Pech[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zypressenholz“. Das hebräische Wort für „Gopher“ kommt nur hier vor; die genaue Holzart ist unbekannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Abteile“; wörtlich: „Nester“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „überziehe“ beziehungsweise „dichte sie ab … mit Bitumen/Teer“. Im Hebräischen sind das Verb für das Bestreichen und das Wort für den Beschichtungsstoff miteinander verwandt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּבַת
  choice: Arche
  rationale: Das hebräische Wort bezeichnet hier das große kastenartige Wasserfahrzeug Noahs. „Arche“ ist im Deutschen die eingebürgerte und kontextuell eindeutige Wiedergabe und wahrt zugleich die Verbindung zu Genesis 6–9 und Exodus 2.
- source_word: עֲצֵי גֹפֶר
  choice: Gopherholz
  rationale: גֹפֶר kommt nur hier vor; die genaue Holzart ist unbekannt. Die lautnahe Wiedergabe vermeidet, eine unsichere Bestimmung wie „Zypressenholz“ in den Haupttext einzutragen.
- source_word: קִנִּים
  choice: Kammern
  rationale: Das Wort bedeutet wörtlich „Nester“, bezeichnet hier aber offenbar abgegrenzte Innenräume. „Kammern“ ist natürlich, anschaulich und weniger technisch als „Abteile“.
- source_word: וְכָפַרְתָּ
  choice: bestreiche sie
  rationale: In diesem nichtkultischen Zusammenhang bezeichnet das Verb das Auftragen einer Deck- oder Dichtungsschicht. „Bestreichen“ verbindet sich im Deutschen natürlich mit dem genannten Material, ohne die Funktion ausdrücklich als Abdichten auszudeuten.
- source_word: בַּכֹּפֶר
  choice: mit Pech
  rationale: כֹּפֶר bezeichnet hier einen Stoff zum Beschichten beziehungsweise Abdichten. „Pech“ ist die traditionelle, allgemein verständliche Wiedergabe; „Bitumen“ wäre technischer und möglicherweise zu spezifisch.
- source_word: מִבַּיִת וּמִחוּץ
  choice: innen und außen
  rationale: Die knappe deutsche Paarformel gibt beide Oberflächenbereiche idiomatisch und vollständig wieder.
- source_word: עֲשֵׂה לְךָ
  choice: Baue dir
  rationale: Das allgemeine Verb עשה bedeutet „machen“, bezeichnet im Zusammenhang mit der Arche jedoch einen Bauvorgang. „Baue dir“ ist im modernen Deutsch natürlicher als „Mache dir“ und bewahrt den Dativ des Nutznießers.
- source_word: תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: Statte die Arche mit Kammern aus
  rationale: Die ungewöhnliche hebräische Konstruktion lautet annähernd „Nester sollst du die Arche machen“. Die Wiedergabe drückt verständlich aus, dass die Arche innen gegliedert werden soll, ohne die „Kammern“ als bloße lose Gegenstände darzustellen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext ist klar und handlungsorientiert; die Unsicherheit bei der Holzart sowie die Bildlichkeit von קִנִּים bleiben durch Fußnoten sichtbar. „Bestreiche … mit Pech“ bewahrt die lexikalische Beziehung des Hebräischen soweit idiomatisch möglich, ohne eine kultisch-theologische Bedeutung von כפר einzutragen.
