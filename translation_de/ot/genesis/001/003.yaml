  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: de
  text: 'Und Gott sprach[a]: »Es werde Licht!« Und es wurde Licht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Möge Licht sein!« Der hebräische Jussiv drückt Willen oder Befehl aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Das Wayyiqtol von אמר führt die Erzählung weiter. »Und … sprach« bewahrt die hebräische Abfolge in würdigem, natürlichem Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl das Substantiv formal pluralisch ist, steht das Verb im Singular; im Kontext bezeichnet es den einen Schöpfer.
- source_word: יְהִי
  choice: soll entstehen
  rationale: Der Jussiv von היה drückt hier göttlichen Willen beziehungsweise einen wirksamen Befehl aus. Die Formulierung ist idiomatisch und gibt zugleich den Sinn von »sein/werden« wieder.
- source_word: אוֹר
  choice: Licht
  rationale: Die Grundbedeutung ist »Licht«; der Kontext verlangt keine Einengung auf eine bestimmte Lichtquelle oder einen bildlichen Sinn.
- source_word: וַיְהִי
  choice: Und … entstand
  rationale: Das Wayyiqtol von היה berichtet die unmittelbare Verwirklichung des gesprochenen Willens. »Entstand« spiegelt die gewählte Wiedergabe des vorausgehenden Jussivs.
- source_word: אוֹר
  choice: Licht
  rationale: Die Wiederholung von »Licht« bleibt erhalten und hebt die genaue Erfüllung des göttlichen Ausspruchs hervor.
theological_decisions:
- issue: Wiedergabe des göttlichen Schöpfungswortes
  choice: Licht soll entstehen!
  alternative: Es werde Licht! / Licht sei!
  rationale: Der hebräische Jussiv kann Wille oder Befehl ausdrücken. »Soll entstehen« wahrt diese Spannung, ohne über die Grammatik hinaus die Art des Schöpfungsvorgangs näher zu bestimmen; die geläufige Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das in Bibelübersetzungen etablierte »sprach« wahrt den feierlichen Erzählton; die kurzen, parallelen Sätze spiegeln die Prägnanz des Hebräischen.
