source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: de
  text: 'Und Gott sprach: „Das Wasser soll von Schwärmen lebender Wesen wimmeln[a], und Vögel[b] sollen über der Erde vor dem Himmelsgewölbe[c] fliegen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Das Wasser soll von Gewimmel lebender Wesen wimmeln.“ Im Hebräischen stehen ein Verb und ein stammverwandtes Substantiv; dadurch wird die Fülle des Lebens betont.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Flugtiere“. Das hebräische Wort kann weiter gefasst sein als nur „Vögel“.'
    reason: lexical_alternative
  - marker: c
    text: Auch „Himmelsfeste“ oder „Himmelsweite“. Das hebräische Wort רָקִיעַ bezeichnet etwas Ausgebreitetes und wird unterschiedlich wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Die Verbform führt die fortlaufende Erzählung weiter. „Und Gott sprach“ bewahrt den schlichten, feierlichen Erzählstil von Genesis 1.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier zusammen mit dem Verb im Singular den einen Schöpfergott.
- source_word: יִשְׁרְצוּ … שֶׁרֶץ
  choice: soll von Schwärmen … wimmeln
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv betont die Fülle und rege Bewegung des entstehenden Lebens; die deutsche Formulierung bildet diese Verstärkung verständlich nach.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Das im Hebräischen formal pluralische Wort wird im modernen Deutschen in diesem Zusammenhang idiomatisch als Kollektivsingular wiedergegeben.
- source_word: נֶפֶשׁ חַיָּה
  choice: lebende Wesen
  rationale: Die Wendung bezeichnet hier belebte Geschöpfe. „Lebende Wesen“ gibt den weiten Sinn wieder, ohne נֶפֶשׁ vorschnell als technische Aussage über eine „Seele“ zu deuten.
- source_word: וְעוֹף
  choice: und Vögel
  rationale: „Vögel“ ist im Kontext die natürliche deutsche Wiedergabe, während eine Fußnote auf den möglicherweise weiteren Bedeutungsumfang „Flugtiere“ hinweist.
- source_word: יְעוֹפֵף
  choice: sollen … fliegen
  rationale: Der Aufforderungscharakter wird mit „sollen“ ausgedrückt; „fliegen“ gibt die Bewegung unmittelbar wieder.
- source_word: עַל הָאָרֶץ
  choice: über der Erde
  rationale: Bei einer Flugbewegung bezeichnet עַל hier den Raum oberhalb der Erde.
- source_word: עַל פְּנֵי
  choice: vor
  rationale: Die Präposition mit „Angesicht/Oberfläche“ beschreibt die Flugbahn an der sichtbaren Vorderseite beziehungsweise entlang der Fläche der Himmelsweite. „Vor“ bewahrt das räumliche Bild knapp und ohne ein bestimmtes kosmologisches Modell festzulegen.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: Himmelsweite
  rationale: Die zusammengesetzte Wiedergabe ist in modernem Deutsch natürlich und lässt die Vorstellung eines ausgebreiteten Himmelsraums erkennen, ohne die umstrittene Beschaffenheit des רָקִיעַ festzulegen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Schöpfungsbericht
  choice: lebende Wesen
  alternative: lebende Seelen
  rationale: Die Wendung bezeichnet hier tierisches, belebtes Leben und trifft keine technische anthropologische Aussage über eine vom Körper getrennte Seele.
- issue: Kosmologische Bedeutung von רְקִיעַ
  choice: Himmelsweite
  alternative: Himmelsfeste oder Himmelsgewölbe
  rationale: „Himmelsweite“ bewahrt das räumliche Bild, ohne eine bestimmte materielle oder architektonische Deutung in den Text einzutragen; die gebräuchlichen Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem für Genesis 1 angemessenen feierlichen Rhythmus. „Sprach“ statt „sagte“ hält das erhöhte Register, ohne altertümlich zu wirken. Die Wortwahl vermeidet zugleich eine konfessionelle oder vorschnell kosmologische Festlegung.
