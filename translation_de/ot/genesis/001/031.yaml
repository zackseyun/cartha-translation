  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: de
  text: 'Und Gott sah alles, was er gemacht hatte, und siehe, es war sehr gut. Und es wurde Abend, und es wurde Morgen: der sechste Tag.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: ראה steht hier im erzählenden Wayyiqtol und bezeichnet Gottes Wahrnehmung, die im Zusammenhang zugleich eine Beurteilung einschließt. „Sah“ bewahrt die schlichte Formulierung des Hebräischen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv hat hier ein Verb im Singular und bezeichnet in Genesis 1 den einen Schöpfer; die übliche deutsche Wiedergabe lautet „Gott“.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: alles, was er gemacht hatte
  rationale: Die Wendung fasst die Gesamtheit dessen zusammen, was Gott geschaffen hat. Das Plusquamperfekt macht im Deutschen deutlich, dass das Machen der anschließenden Betrachtung vorausgeht.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Ergebnis. „Siehe“ erhält diese rhetorische und feierliche Wirkung, ohne den Inhalt auszudeuten.
- source_word: טוֹב מְאֹד
  choice: sehr gut
  rationale: מְאֹד verstärkt טוֹב. „Sehr gut“ ist direkt und lässt offen, ob die Güte hier vor allem moralisch, ästhetisch, zweckmäßig oder umfassend verstanden wird.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Und es wurde Abend, und es wurde Morgen
  rationale: Die wiederholte Verbindung von היה mit den Zeitbezeichnungen bildet die Tagesabschlussformel von Genesis 1. „Es wurde“ ist eine natürliche, formnahe deutsche Wiedergabe der zeitlichen Abfolge.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: der sechste Tag
  rationale: Das Substantiv mit bestimmtem Ordnungszahlwort wird direkt als „der sechste Tag“ wiedergegeben; der bestimmte Artikel bleibt erhalten.
theological_decisions:
- issue: Art der Güte der Schöpfung in טוֹב מְאֹד
  choice: sehr gut
  alternative: überaus gut
  rationale: Die Formulierung bewahrt die umfassende positive Beurteilung der Schöpfung, ohne sie ausschließlich als moralische, ästhetische oder funktionale Güte festzulegen.
- issue: Wiedergabe der Tagesformel ohne Vorentscheidung über die Schöpfungstage
  choice: 'Und es wurde Abend, und es wurde Morgen: der sechste Tag.'
  alternative: Und es war Abend, und es war Morgen, Tag sechs.
  rationale: Die Übersetzung folgt der hebräischen Formel eng und fügt keine Aussage über Länge oder literarische Funktion des Tages hinzu. Der Doppelpunkt kennzeichnet „der sechste Tag“ als abschließende Zuordnung, ohne die Deutung des Tagesbegriffs festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Ton. „Siehe“ ist bewusst als biblisch-rhetorischer Aufmerksamkeitsmarker erhalten; ansonsten vermeidet der Text unnötig altertümliche Formen.
