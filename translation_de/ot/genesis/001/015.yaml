  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: de
  text: Sie sollen in der Himmelsausdehnung als Leuchtkörper sein, um Licht auf die Erde zu geben.[a] Und so geschah es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Feste des Himmels“. Das hebräische Wort bezeichnet die ausgebreitete Himmelsfläche und wird traditionell mit „Feste“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Sie sollen … dienen
  rationale: Die Form steht innerhalb der fortgesetzten Schöpfungsrede und führt die volitive Bestimmung aus dem vorhergehenden Vers weiter. „Sie sollen … dienen“ gibt diesen anordnenden Sinn im Deutschen natürlich wieder.
- source_word: לִמְאוֹרֹת
  choice: als Leuchtkörper
  rationale: מָאוֹר bezeichnet konkrete Lichtquellen beziehungsweise lichtgebende Körper, nicht abstraktes Licht. „Leuchtkörper“ ist im Kontext der Himmelskörper präzise und allgemein verständlich.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: am Himmelsgewölbe
  rationale: רָקִיעַ bezeichnet die ausgebreitete Himmelsfläche beziehungsweise das Himmelsgewölbe. Die deutsche Zusammensetzung ist natürlich und bewahrt die räumliche Vorstellung des hebräischen Ausdrucks.
- source_word: לְהָאִיר
  choice: um Licht … zu geben
  rationale: 'Der Hifil-Infinitiv von אור ist kausativ: Licht hervorbringen beziehungsweise geben. Die Formulierung bildet sowohl Bedeutung als auch Zweckbeziehung ab.'
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: Die Präposition עַל bezeichnet hier das Ziel der Beleuchtung. „Auf die Erde“ ist idiomatisch und sachlich genau.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die feste Erfüllungsformel in Genesis 1 bestätigt die Ausführung des göttlichen Befehls. „Und so geschah es“ ist würdig, verständlich und im Deutschen idiomatisch.
theological_decisions:
- issue: Volitive Bedeutung von וְהָיוּ in der Schöpfungsrede
  choice: 'Als fortgesetzte Anordnung: „Sie sollen … dienen“'
  alternative: 'Als schlichte Zukunftsaussage: „Sie werden … sein“'
  rationale: Der unmittelbare syntaktische und literarische Zusammenhang führt den göttlichen Schöpfungsbefehl aus Vers 14 fort. Die gewählte Fassung bewahrt die Abfolge von Anordnung und Erfüllung, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leuchtkörper“ verdeutlicht den konkreten Sinn von מָאוֹר; „Himmelsgewölbe“ bewahrt die anschauliche kosmologische Ausdrucksweise, ohne die altertümliche Bezeichnung „Firmament“ in den Haupttext zu setzen.
