base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: de
  text: Und es war Abend, und es war Morgen – der dritte Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: und es wurde
  rationale: Die Form von היה führt hier jeweils einen eingetretenen Zeitabschnitt ein. „Es wurde“ ist im Deutschen natürlich, bewahrt die Wiederholung und gibt den Übergang zu Abend und Morgen passend wieder.
- source_word: עֶרֶב
  choice: Abend
  rationale: Das Substantiv bezeichnet Abend beziehungsweise Dämmerung. „Abend“ ist die klare, geläufige Wiedergabe im Schöpfungsrefrain.
- source_word: בֹּקֶר
  choice: Morgen
  rationale: Das Substantiv bezeichnet den Morgen. Die Wiedergabe bewahrt die formelhafte Entsprechung zu „Abend“.
- source_word: יוֹם
  choice: Tag
  rationale: Hier bezeichnet יוֹם den nummerierten Tag innerhalb der Abfolge des Schöpfungsberichts.
- source_word: שְׁלִישִׁי
  choice: dritte
  rationale: Das Ordinaladjektiv bedeutet eindeutig „dritte“ und bezieht sich auf „Tag“.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Und es wurde Abend, und es wurde Morgen
  rationale: Die Wiederholung von „es wurde“ erhält Aufbau und Rhythmus des hebräischen Refrains; das zweite „und“ entspricht ebenfalls der Vorlage.
theological_decisions:
- issue: Wiedergabe des Schöpfungstags, ohne eine bestimmte chronologische Auslegung vorzugeben
  choice: der dritte Tag
  alternative: dritter Tag
  rationale: Der bestimmte Ausdruck ist im Deutschen die natürliche Bezeichnung des dritten Tages in der erzählten Abfolge. Er entscheidet nicht, wie Länge oder literarische Funktion der Schöpfungstage auszulegen sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederkehrende Rhythmus der hebräischen Formel bleibt erhalten; der Gedankenstrich macht die abschließende Tageszählung gut lesbar.
