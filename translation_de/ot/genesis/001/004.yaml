base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: de
  text: Und Gott sah, dass das Licht gut war, und Gott trennte[a] das Licht von der Finsternis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schied das Licht von der Finsternis«; das hebräische Verb kann auch ausdrücken, dass zwischen zwei Dingen unterschieden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Die übliche erzählende Wiedergabe von ראה; sie lässt hier sowohl die Wahrnehmung als auch deren wertende Komponente erkennen, ohne diese weiter auszudeuten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv steht hier mit Verben im Singular und bezeichnet den einen Schöpfer.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine direkte deutsche Entsprechung; seine Funktion ergibt sich aus dem deutschen Satzbau.
- source_word: הָאוֹר
  choice: das Licht
  rationale: Der bestimmte Artikel und der Rückbezug auf das zuvor geschaffene Licht werden gewahrt.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt von Gottes Wahrnehmung ein; im Deutschen ist ein dass-Satz natürlich und genau.
- source_word: טוֹב
  choice: gut
  rationale: Die grundlegende wertende Bedeutung von טוֹב bleibt erhalten, ohne sie auf »schön«, »nützlich« oder »wohlgefällig« zu verengen.
- source_word: וַיַּבְדֵּל
  choice: trennte
  rationale: בדל bezeichnet ein Trennen, Scheiden oder Unterscheiden. »Trennte« ist klares modernes Deutsch und lässt die genaue Art der Trennung offen.
- source_word: בֵּין ... וּבֵין
  choice: von
  rationale: Nach »trennen« gibt die deutsche Konstruktion »das Licht von der Finsternis trennen« den Sinn der hebräischen Wendung idiomatisch wieder.
- source_word: הַחֹשֶׁךְ
  choice: der Finsternis
  rationale: Der bestimmte Artikel und der Rückbezug auf die bereits erwähnte Finsternis werden wiedergegeben; »Finsternis« entspricht dem würdevollen Erzählregister des Abschnitts.
theological_decisions:
- issue: Wiederholung des Subjekts אֱלֹהִים in beiden Teilsätzen
  choice: »Gott« wird in beiden Teilsätzen ausdrücklich genannt.
  alternative: 'Im zweiten Teilsatz könnte ein Pronomen stehen: »und er trennte …«'
  rationale: Die Wiederholung entspricht dem hebräischen Wortlaut und seiner feierlichen Erzählbewegung, ohne eine zusätzliche Lehraussage einzutragen.
- issue: Art der Trennung von Licht und Finsternis
  choice: »trennte« ohne nähere Bestimmung
  alternative: »schied« oder »unterschied zwischen«
  rationale: Der Text bestimmt nicht, ob die Trennung räumlich, zeitlich oder begrifflich zu verstehen ist. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die zweimalige Nennung Gottes und die bestimmten Formen »das Licht« und »die Finsternis« folgen bewusst der hebräischen Struktur.
