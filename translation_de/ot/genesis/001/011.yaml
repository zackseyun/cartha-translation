base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: de
  text: 'Und Gott sprach: »Die Erde lasse junges Grün hervorsprießen: Pflanzen, die Samen hervorbringen, und Fruchtbäume, die nach ihrer Art[a] Früchte tragen und deren Samen in ihnen ist[b], auf der Erde.« Und so geschah es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach seiner Art“; der Singular ist hier distributiv gebraucht, also jeweils für die verschiedenen Arten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dessen Samen in ihm ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: lasse … hervorsprießen
  rationale: Der Hifil-Jussiv richtet einen hervorbringenden Auftrag an die Erde; „hervorsprießen lassen“ bewahrt sowohl die kausative Nuance als auch das Bild des aufkommenden Pflanzenwuchses.
- source_word: דֶּשֶׁא
  choice: junges Grün
  rationale: Das Kollektiv bezeichnet frischen grünen Pflanzenwuchs und ist weiter als „Gras“. „Junges Grün“ gibt das anschaulich und natürlich wieder.
- source_word: עֵשֶׂב
  choice: Pflanzen
  rationale: Gemeint sind krautartige bzw. samentragende Gewächse. „Pflanzen“ ist allgemein verständlich und vermeidet die moderne kulinarische Verengung von „Kräutern“.
- source_word: מַזְרִיעַ זֶרַע
  choice: die Samen hervorbringen
  rationale: Partizip und Objekt beschreiben die charakteristische, fortdauernde Samenproduktion; die Formulierung ist im Deutschen klar und idiomatisch.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  choice: Fruchtbäume, die … Früchte tragen
  rationale: Die deutsche Klassenbezeichnung im Plural und die feste Wendung „Früchte tragen“ geben die Konstruktion natürlich wieder.
- source_word: לְמִינוֹ
  choice: nach ihrer Art
  rationale: Das morphologisch singularische Suffix wird distributiv auf die jeweils genannten Gewächse bezogen. Der deutsche Singular „Art“ bewahrt diese Struktur, während „ihrer“ dem kollektiven Bezug entspricht.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: deren Samen in ihnen ist
  rationale: Die Relativkonstruktion wird eng am Hebräischen wiedergegeben; der Plural passt im Deutschen zu den kollektiv als Mehrzahl formulierten Fruchtbäumen.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Schlichte und natürliche Wiedergabe der Ortsangabe; ihre Stellung bei den Fruchtbäumen folgt dem wahrscheinlichsten syntaktischen Anschluss.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die feste Erfüllungsformel wird würdig und idiomatisch wiedergegeben und betont, dass Gottes Wort Wirklichkeit wird.
theological_decisions:
- issue: Umfang und Bedeutung der geschaffenen Pflanzenklassen
  choice: Die Kategorien werden als breiter Pflanzenwuchs, samentragende Pflanzen und Fruchtbäume wiedergegeben.
  alternative: Die Begriffe könnten enger als „Gras, samenbringendes Kraut und Fruchtbaum“ oder pauschal als „alle Arten von Pflanzen“ übersetzt werden.
  rationale: Die Wiedergabe erhält die im Text erkennbare Ordnung, ohne moderne botanische Taxonomie einzutragen oder die hebräischen Kategorien durch eine Verallgemeinerung einzuebnen.
- issue: Bezug der Wendung „nach seiner Art“ und des Samens
  choice: Die singularischen hebräischen Formen werden im Deutschen distributiv auf die jeweiligen Bäume bzw. Klassen bezogen.
  alternative: Eine streng formale Wiedergabe wäre „nach seiner Art, dessen Samen in ihm ist“.
  rationale: Das Hebräische verwendet den Singular für jedes einzelne Glied einer Klasse. Die pluralische Anpassung im Deutschen macht diesen distributiven Sinn verständlich, ohne eine zusätzliche theologische oder naturwissenschaftliche Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählrhythmus. Der Imperativcharakter des göttlichen Wortes und die anschauliche Sprache des Pflanzenwachstums bleiben erhalten; unnötige Fachsprache und altertümliche Formen werden vermieden.
