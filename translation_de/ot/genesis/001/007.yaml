  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: de
  text: Da machte Gott die Ausdehnung[a] und trennte das Wasser, das unterhalb der Ausdehnung war, von dem Wasser, das oberhalb der Ausdehnung war. Und es geschah so.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Himmelsgewölbe“; traditionell: „Feste“.'
    reason: Lexikalische Alternativen zu רָקִיעַ; „Himmelsgewölbe“ kann eine Form stärker nahelegen, während „Feste“ traditionell, aber heute ungebräuchlich ist.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: machte
  rationale: עָשָׂה bedeutet gewöhnlich „machen“ oder „tun“. „Machte“ gibt das Verb in diesem Schöpfungszusammenhang direkt und ohne die speziellere Nuance von „formen“ wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier mit singularischer Verbform den einen Schöpfergott; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: הָרָקִיעַ
  choice: die Himmelsweite
  rationale: רָקִיעַ bezeichnet etwas Ausgebreitetes oder Ausgespanntes. „Himmelsweite“ ist im Deutschen verständlich, bewahrt den räumlichen Bildgehalt und legt die genaue kosmologische Gestalt nicht fest.
- source_word: וַיַּבְדֵּל
  choice: trennte
  rationale: בדל bedeutet „trennen“ oder „scheiden“. „Trennte“ ist modernes, natürliches Deutsch und bewahrt das ordnende Motiv des Kapitels.
- source_word: בֵּין ... וּבֵין
  choice: … von …
  rationale: Die hebräische Konstruktion unterscheidet zwei Größen. Nach „trennen“ entspricht im Deutschen die Fügung „X von Y trennen“ idiomatisch dem hebräischen „zwischen X und Y“.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: מַיִם ist formal pluralisch, wird aber als Stoffbezeichnung gebraucht. Im modernen Deutschen ist „das Wasser“ hier natürlicher als „die Wasser“, ohne den Sinn zu verändern.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: das Wasser unterhalb der Himmelsweite
  rationale: מִתַּחַת bezeichnet die Lage darunter. „Unterhalb“ gibt den vertikalen Gegensatz zu „oberhalb“ präzise und flüssig wieder.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: das Wasser oberhalb der Himmelsweite
  rationale: מֵעַל bezeichnet die Lage darüber. „Oberhalb“ bildet den klaren Gegenpol zu „unterhalb“.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die wiederkehrende Formel bestätigt die Verwirklichung des göttlichen Befehls. „Und so geschah es“ ist würdig, idiomatisch und bewahrt den refrainartigen Charakter.
theological_decisions:
- issue: Wiedergabe von רָקִיעַ und seine kosmologischen Implikationen
  choice: Himmelsweite
  alternative: Himmelsgewölbe; Feste; Ausdehnung
  rationale: „Himmelsweite“ bewahrt das Bild des Ausgebreiteten, vermeidet das heute missverständliche traditionelle „Feste“ und legt sich nicht auf die mit „Himmelsgewölbe“ stärker bezeichnete Form fest. Die genaue antike Kosmologie bleibt damit offen, soweit der Vers sie nicht ausdrücklich bestimmt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber durch die deutsche Fügung „X von Y trennen“ idiomatisch gestaltet. Der Fußnotenmarker [a] steht unmittelbar bei der ersten Wiedergabe des erklärten Begriffs.
