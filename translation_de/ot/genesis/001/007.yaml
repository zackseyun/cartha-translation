  rationale: Die Änderung ersetzt die ungebräuchliche und leicht enger deutende „Himmelsweite“ durch „Ausdehnung“. Sie wahrt damit die räumliche Bildlichkeit von רָקִיעַ, ohne eine konkrete antike Kosmologie festzuschreiben. Die übrigen Formulierungen werden nur zur klaren Abbildung der beiden hebräischen Relativbestimmungen geglättet.
