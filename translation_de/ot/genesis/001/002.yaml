id: GEN.1.2
reference: Genesis 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: de
  text: Und die Erde war wüst und leer, und Finsternis lag über der Urflut, und der Geist Gottes[a] schwebte über dem Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wind von Gott“ beziehungsweise „der Wind Gottes“.'
    reason: Alternative Lesart der mehrdeutigen Wendung רוּחַ אֱלֹהִים.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Und die Erde
  rationale: הָאָרֶץ bedeutet hier „die Erde“; das vorangestellte ו wird als „Und“ wiedergegeben und hält die Verknüpfung mit Vers 1 sichtbar.
- source_word: הָיְתָה
  choice: war
  rationale: Die Qal-Perfektform von היה dient hier am natürlichsten als Zustandsaussage. „War“ vermeidet die unbegründete Festlegung auf eine Zustandsveränderung („wurde“).
- source_word: תֹהוּ וָבֹהוּ
  choice: wüst und leer
  rationale: Die geläufige deutsche Wortverbindung ist verständlich und würdevoll und gibt die ungeordnete, öde Leere des hebräischen Ausdrucks knapp wieder.
- source_word: וְחֹשֶׁךְ
  choice: und Finsternis
  rationale: „Finsternis“ entspricht dem Substantiv חֹשֶׁךְ und passt zum gehobenen, zugleich allgemein verständlichen Erzählregister.
- source_word: עַל־פְּנֵי
  choice: über der Oberfläche
  rationale: Die Wendung bedeutet wörtlich „über/auf dem Angesicht von“. „Über der Oberfläche“ bewahrt das räumliche Bild in natürlichem Deutsch.
- source_word: תְהוֹם
  choice: der Tiefe
  rationale: תְהוֹם bezeichnet die Wassertiefe beziehungsweise Urflut. „Tiefe“ bleibt quellennah und vermeidet zusätzliche mythologische Deutungen.
- source_word: וְרוּחַ אֱלֹהִים
  choice: und der Geist Gottes
  rationale: רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten. Im Haupttext steht die starke traditionelle Lesart „Geist Gottes“; die echte Möglichkeit „ein von Gott kommender Wind“ wird in der Fußnote bewahrt.
- source_word: מְרַחֶפֶת
  choice: schwebte
  rationale: Das Partizip bezeichnet eine anhaltende Bewegung. „Schwebte“ gibt diese Nuance idiomatisch und ohne unnötige Präzisierung wieder.
- source_word: הַמָּיִם
  choice: des Wassers
  rationale: Das hebräische מַיִם hat eine formal plurale Gestalt, wird im Deutschen aber in diesem Zusammenhang natürlich als singularisches Kollektiv „Wasser“ wiedergegeben.
theological_decisions:
- issue: Zustandsaussage oder Zustandsveränderung bei הָיְתָה
  choice: war
  alternative: wurde
  rationale: Der Vers beschreibt den Zustand der Erde an diesem Punkt der Erzählung. Eine Veränderung wird grammatisch nicht verlangt; „war“ vermeidet daher eine theologische Rekonstruktion, die der Satz selbst nicht ausdrücklich macht.
- issue: Bedeutung von וְרוּחַ אֱלֹהִים
  choice: der Geist Gottes
  alternative: ein von Gott kommender Wind / der Wind Gottes
  rationale: Die hebräische Wendung ist mehrdeutig. Die personale Lesart steht im Haupttext, während die meteorologische Lesart in einer Fußnote ausdrücklich erhalten bleibt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Erzählton. „Wüst und leer“ nutzt eine weiterhin verständliche feste Wendung; „Oberfläche“ macht das räumliche Bild von עַל־פְּנֵי deutlich. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die er sich bezieht.
