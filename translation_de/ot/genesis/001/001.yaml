translation:
  language: de
  text: Am Anfang, als Gott Himmel und Erde schuf[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell wird der Vers als vollständiger Satz wiedergegeben: „Am Anfang schuf Gott Himmel und Erde.“ Das Hebräische kann wegen des artikellosen בְּרֵאשִׁית und des folgenden finiten Verbs בָּרָא auch als abhängiger Zeitsatz gelesen werden, ähnlich wie in Genesis 2,4b. Bei dieser Lesung folgt der Hauptsatz in Vers 3.'
    reason: Alternative syntaktische Lesart
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Am Anfang, als … schuf
  rationale: Das artikellose בְּרֵאשִׁית mit dem folgenden finiten Verb lässt sich am natürlichsten als einleitende Zeitangabe verstehen. Die Formulierung bewahrt zugleich die erkennbare Bedeutung von רֵאשִׁית („Anfang“).
- source_word: בָּרָא
  choice: schuf
  rationale: בָּרָא ist das übliche hebräische Verb für Gottes schöpferisches Handeln. „Schuf“ ist direkt, würdevoll und legt nicht fest, auf welche Weise das Geschaffene entstand.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl אֱלֹהִים seiner Form nach pluralisch ist, steht das zugehörige Verb בָּרָא im Singular; daher ist hier der eine Gott gemeint.
- source_word: אֵת
  choice: nicht eigens wiedergegeben
  rationale: אֵת kennzeichnet im Hebräischen das bestimmte direkte Objekt und wird im Deutschen durch Satzbau und Kasus ausgedrückt.
- source_word: הַשָּׁמַיִם
  choice: Himmel
  rationale: Im festen deutschen Ausdruck „Himmel und Erde“ bezeichnet „Himmel“ den oberen beziehungsweise himmlischen Bereich. Zusammen mit „Erde“ bildet die Wendung eine umfassende Bezeichnung der geschaffenen Welt; die künstlich wirkende Form „die Himmel“ wurde vermieden.
- source_word: הָאָרֶץ
  choice: Erde
  rationale: אָ֫רֶץ kann „Land“ oder „Erde“ bedeuten. In der Verbindung mit „Himmel“ ist die kosmische Bedeutung „Erde“ gemeint.
theological_decisions:
- issue: Satzbau des Eröffnungsverses
  choice: 'Abhängiger temporaler Einleitungssatz: „Am Anfang, als Gott Himmel und Erde schuf –“'
  alternative: 'Selbstständiger Hauptsatz: „Am Anfang schuf Gott Himmel und Erde.“'
  rationale: Das artikellose בְּרֵאשִׁית, gefolgt vom finiten Verb בָּרָא, lässt eine temporale Einleitung natürlich erscheinen; vergleichbare Eröffnungen finden sich in Genesis 2,4b und Hosea 1,2. Der Gedankenstrich zeigt an, dass der Satz weiterführt. Da die überlieferte selbstständige Lesart alt und sprachlich möglich ist, wird sie in der Fußnote ausdrücklich bewahrt, statt die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Ton. „Himmel und Erde“ ist die natürliche deutsche Gesamtformel. Der Gedankenstrich hält den in Vers 1 begonnenen Satz bewusst offen und signalisiert den Fortgang bis zum Hauptsatz in Vers 3.
