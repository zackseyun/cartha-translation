id: GEN.1.10
reference: Genesis 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: de
  text: Und Gott nannte das Trockene Land[a], und die Ansammlung des Wassers nannte er Meere. Und Gott sah, dass es gut war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erde“. Das hebräische אֶרֶץ kann „Land“ oder „Erde“ bedeuten und steht hier in einer Benennungsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: nannte
  rationale: Das Verb bezeichnet hier die Benennung. „Nannte“ ist im Deutschen natürlich und bewahrt die wiederholte Satzstruktur.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv steht hier mit singularischem Verb und bezeichnet in Genesis 1 den einen Schöpfer.
- source_word: לַיַּבָּשָׁה
  choice: das Trockene
  rationale: Das substantivierte Adjektiv gibt die trockene Fläche im Gegensatz zum gesammelten Wasser knapp und quellennah wieder.
- source_word: אֶרֶץ
  choice: Land
  rationale: „Land“ ist die natürliche deutsche Bezeichnung für das Trockene und funktioniert in der Benennungsformel als zugewiesener Name, ohne zwingend den modernen Planetenbegriff „Erde“ aufzurufen.
- source_word: מִקְוֵה הַמַּיִם
  choice: die Ansammlung des Wassers
  rationale: Das Substantiv bezeichnet das Zusammengeflossene beziehungsweise die gesammelte Wassermasse. Der deutsche Singular „Wasser“ ist idiomatisch, obwohl das Hebräische die feste Pluralform מַיִם verwendet.
- source_word: יַמִּים
  choice: Meere
  rationale: Der Plural bezeichnet die gesammelten Wassergebiete und wird als Name in der Benennungsformel wiedergegeben.
- source_word: וַיַּרְא
  choice: sah
  rationale: „Sah“ bewahrt die einfache, wiederkehrende Bewertungsformel von Genesis 1.
- source_word: כִּי טוֹב
  choice: dass es gut war
  rationale: „Gut“ erhält die breite Bedeutung von טוֹב, ohne sie auf Schönheit, Nutzen oder moralische Güte einzuengen.
theological_decisions:
- issue: Ob אֶרֶץ in der Benennungsformel als Eigenname oder als gewöhnliches Substantiv zu verstehen ist
  choice: „Land“ als benennende Bezeichnung, mit Großschreibung nach deutscher Substantivorthografie
  alternative: „Erde“, möglicherweise als Eigenname verstanden
  rationale: Der Kontext benennt das Trockene; „Land“ bildet den Gegensatz zu „Meere“ natürlich ab. Da deutsche Substantive ohnehin großgeschrieben werden, lässt sich die mögliche Eigen namensfunktion typografisch nicht eindeutig markieren; die Fußnote bewahrt die Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schlichter Satzstruktur. Die Wiederholung von „nannte“ und „Gott“ folgt dem hebräischen Erzählstil; „das Trockene“ hält die knappe Gegenüberstellung zum Wasser aufrecht.
