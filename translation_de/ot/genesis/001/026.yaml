  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: de
  text: 'Da sagte Gott: „Lasst uns den Menschen[a] als unser Bild machen, uns ähnlich[b], und sie sollen über die Fische des Meeres, über die Vögel des Himmels[c], über das Vieh, über die ganze Erde und über alles Kriechgetier herrschen[d], das sich auf der Erde regt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch אָדָם (adam) steht hier als kollektiver Singular für den Menschen beziehungsweise die Menschheit. Darum folgt anschließend die Mehrzahl „sie sollen“.
    reason: lexical_alternative
  - marker: b
    text: Die Mehrzahl in „Lasst uns“ und „uns“ entspricht dem Hebräischen. Sie wird unter anderem als göttliche Selbstberatung, als Anrede an den himmlischen Hof oder – in christlicher kanonischer Lesart – als ein mit der späteren Offenbarung der Dreieinigkeit vereinbarer Hinweis verstanden.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „die Vögel der Lüfte“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Herrschaft ausüben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Das narrative Waw führt die Handlung weiter. „Da sprach“ gibt die zeitliche Folge in würdigem, gut verständlichem Deutsch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Verb steht hier im Singular; gemeint ist Gott. „Gott“ ist daher die sachgemäße Standardwiedergabe.
- source_word: נַעֲשֶׂה
  choice: Lasst uns … machen
  rationale: Die Form ist erste Person Plural mit auffordernd-beratender Nuance. Diese Wiedergabe bewahrt sowohl den Plural als auch den offenen Charakter der Äußerung.
- source_word: אָדָם
  choice: den Menschen
  rationale: אָדָם bezeichnet hier den Menschen als Gattung und ist ein kollektiver Singular. „Den Menschen“ erhält die Einzahl und lässt zugleich den Wechsel zum pluralischen „sie“ erkennen.
- source_word: בְּצַלְמֵנוּ
  choice: in unserem Bild
  rationale: Die Formulierung bildet die Präposition ב und das Substantiv צֶלֶם eng ab, ohne die Art der Bildbeziehung näher festzulegen.
- source_word: כִּדְמוּתֵנוּ
  choice: nach unserem Gleichnis
  rationale: כ mit דְּמוּת bezeichnet Entsprechung oder Ähnlichkeit. Die Wiedergabe hält „Bild“ und „Gleichnis“ als zwei verschiedene Ausdrücke auseinander.
- source_word: וְיִרְדּוּ
  choice: und sie sollen … herrschen
  rationale: Die dritte Person Plural hat hier auffordernde beziehungsweise bestimmende Kraft. „Sie sollen herrschen“ ist natürliches modernes Deutsch und bewahrt den Numeruswechsel.
- source_word: בִדְגַת הַיָּם
  choice: über die Fische des Meeres
  rationale: Dies ist eine direkte und idiomatische Wiedergabe der hebräischen Genitivverbindung.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: über die Vögel des Himmels
  rationale: עוֹף bezeichnet hier die fliegenden Tiere, idiomatisch „Vögel“; הַשָּׁמַיִם wird im Kontext des Luftraums natürlich mit „Himmel“ wiedergegeben.
- source_word: וּבַבְּהֵמָה
  choice: über das Vieh
  rationale: בְּהֵמָה meint in dieser Aufzählung vor allem die domestizierten Landtiere. „Vieh“ ist präzise und im Deutschen geläufig.
- source_word: וּבְכָל הָאָרֶץ
  choice: über die ganze Erde
  rationale: אֶרֶץ hat im Schöpfungsbericht weltweiten Bezug; „die ganze Erde“ bewahrt diesen umfassenden Sinn.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: über alles Kriechgetier …, das sich … regt
  rationale: Die Wiedergabe bewahrt die Wortwiederholung von רמש sinngemäß, vermeidet aber die im Deutschen schwerfällige Form „das kriecht“ und erfasst auch kleine, sich bodennah bewegende Tiere.
theological_decisions:
- issue: Die pluralische Gottesrede in „Lasst uns … unserem … unserem“
  choice: Die Pluralformen bleiben im Haupttext unverändert erhalten, ohne den Angesprochenen zu bestimmen.
  alternative: Deutung als göttliche Selbstberatung, als Anrede an den himmlischen Hof oder im christlichen kanonischen Zusammenhang als Hinweis, der mit der späteren Offenbarung der Dreieinigkeit vereinbar ist.
  rationale: Der hebräische Wortlaut verwendet eindeutig die erste Person Plural, erklärt jedoch an dieser Stelle nicht, an wen die Rede gerichtet ist. Eine Übersetzung soll diese Offenheit nicht durch eine bestimmte Auslegung beseitigen.
- issue: אָדָם als kollektiver Singular mit anschließendem Plural
  choice: „den Menschen … sie“
  alternative: „die Menschheit … sie“ oder „die Menschen … sie“
  rationale: Der Wechsel von der kollektiven Einzahl zur Mehrzahl gehört zum Aussageprofil des hebräischen Textes. „Den Menschen“ bewahrt ihn besser als eine von Anfang an pluralische Wiedergabe.
- issue: Bedeutung von רדה für die Stellung des Menschen zur übrigen Schöpfung
  choice: „herrschen“
  alternative: „regieren“ oder „Herrschaft ausüben“
  rationale: רדה bezeichnet tatsächliche Herrschaft. Die Übersetzung schwächt den Begriff nicht ab, legt aber auch nicht eigenmächtig fest, ob diese Herrschaft fürsorglich oder ausbeuterisch ausgeübt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Erzählton. „Da sprach“ und „Gleichnis“ tragen dem feierlichen Stil des Schöpfungsberichts Rechnung, bleiben aber allgemein verständlich. Die ungewöhnliche Verbindung „den Menschen … sie“ ist bewusst beibehalten, weil sie den kollektiven Singular und den anschließenden hebräischen Plural sichtbar macht.
