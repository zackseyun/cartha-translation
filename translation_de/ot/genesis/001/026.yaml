  to: 'Da sagte Gott: „Lasst uns den Menschen[a] als unser Bild machen, uns ähnlich[b], und sie sollen über die Fische des Meeres, über die Vögel des Himmels[c], über das Vieh, über die ganze Erde und über alles Kriechgetier herrschen[d], das sich auf der Erde regt.“'
  rationale: Die Revision ersetzt lediglich missverständliche beziehungsweise weniger moderne deutsche Formulierungen. „als unser Bild, uns ähnlich“ gibt בצלמנו כדמותנו sinnvoll und ohne dogmatische Präzisierung wieder. Die Fußnotenanker bleiben vollständig erhalten; Fußnote b wurde an die revidierte Formulierung „uns ähnlich“ angepasst.
