  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: de
  text: Und es war Abend, und es war Morgen – der fünfte Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: und es wurde
  rationale: Die narrative Form von היה leitet hier die wiederkehrende Schöpfungsformel ein. „Und es wurde“ ist im Deutschen natürlich, bewahrt den feierlichen Rhythmus und gibt den Übergang zu Abend und Morgen treffend wieder.
- source_word: עֶרֶב
  choice: Abend
  rationale: Das Substantiv bezeichnet den Abend. „Abend“ ist die direkte, geläufige Entsprechung und erhält die feste Formel des Kapitels.
- source_word: בֹּקֶר
  choice: Morgen
  rationale: Das Substantiv bezeichnet den Morgen. „Morgen“ ist die unmittelbare Entsprechung und bewahrt den Parallelismus mit „Abend“.
- source_word: יוֹם
  choice: Tag
  rationale: יוֹם bezeichnet hier den nummerierten Schöpfungstag. „Tag“ ist die direkte lexikalische Entsprechung, ohne eine bestimmte Auslegung seiner Dauer vorwegzunehmen.
- source_word: חֲמִישִׁי
  choice: fünfte
  rationale: Das Ordinalzahlwort bestimmt „Tag“ näher; „fünfte“ ist die genaue deutsche Entsprechung.
theological_decisions:
- issue: Charakter der Formel für den Schöpfungstag
  choice: Die zeitliche Formel „Und es wurde Abend, und es wurde Morgen – der fünfte Tag“ wird beibehalten, ohne die Länge oder literarische Beschaffenheit des Tages auszulegen.
  alternative: Eine stärker deutende Wiedergabe, die entweder einen 24-Stunden-Tag oder ein Zeitalter nahelegt.
  rationale: Der hebräische Text nennt Abend, Morgen und den ordinal bestimmten Tag, entscheidet aber für sich genommen nicht spätere Lehrdebatten über Dauer oder literarische Funktion der Schöpfungstage. Die Übersetzung bewahrt daher Wortlaut und Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur und der feierliche Rhythmus der hebräischen Schöpfungsformel bleiben erhalten; der Gedankenstrich hebt die abschließende Tageszählung hervor.
