  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: de
  text: um über den Tag und über die Nacht zu herrschen und das Licht von der Dunkelheit zu trennen.[a] Und Gott sah, dass es gut war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und zwischen dem Licht und der Dunkelheit zu unterscheiden.«'
    reason: Lexikalische Alternative für לְהַבְדִּיל; das Verb kann sowohl das Trennen als auch das Unterscheiden bezeichnen.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: um … zu herrschen
  rationale: Der mit לְ gebildete Infinitiv setzt die Zweck- bzw. Funktionsangabe aus dem vorigen Vers fort. »Herrschen« gibt משל prägnant wieder, ohne den Gestirnen göttliche Eigenständigkeit zuzuschreiben.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: über den Tag und über die Nacht
  rationale: Die Präposition בְ bezeichnet hier zusammen mit משל den Bereich, über den die Herrschaft ausgeübt wird. Die parallele und bestimmte Form des Hebräischen bleibt erhalten.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: und … zu trennen
  rationale: בדל bezeichnet im Schöpfungsbericht das Herstellen bzw. Wahren einer Scheidung. »Trennen« bewahrt diesen konkreten Sinn; »unterscheiden« bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: das Licht von der Dunkelheit
  rationale: Die deutsche Verbindung »etwas von etwas trennen« gibt die hebräische Konstruktion בֵּין … וּבֵין idiomatisch wieder und bewahrt die bestimmten Substantive.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: Und Gott sah
  rationale: Die Form führt die Erzählung weiter. »Und Gott sah« erhält zugleich den wiederkehrenden Rhythmus von Genesis 1.
- source_word: כִּי טוֹב
  choice: dass es gut war
  rationale: »Gut« bewahrt die breite Bedeutung von טוֹב als gut, angemessen und der Schöpfungsordnung entsprechend, ohne sie einzuengen.
theological_decisions:
- issue: Funktion der Himmelslichter in der Schöpfung
  choice: Die Lichter sind dazu bestimmt, über Tag und Nacht zu herrschen und Licht und Dunkelheit voneinander zu trennen.
  alternative: Eine stärker personifizierende Wiedergabe könnte nahelegen, die Gestirne übten als göttliche Wesen eigenständige Herrschaft aus.
  rationale: Das Hebräische weist den Lichtern eine Funktion innerhalb der von Gott geordneten Schöpfung zu. »Herrschen« wahrt die Ausdruckskraft von משל; der Zusammenhang und Gottes abschließendes Urteil lassen Gott der souverän Handelnde und Bewertende bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als syntaktische Fortsetzung von Vers 17; daher steht am Anfang bewusst »um«. Die vertraute Wiederholungsformel »Und Gott sah, dass es gut war« bleibt erhalten.
