  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם רְבִיעִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: de
  text: 'Und es wurde Abend, und es wurde Morgen: der vierte Tag.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: und es wurde
  rationale: Das Wayyiqtol von היה gehört zur wiederkehrenden Abschlussformel der Schöpfungstage. „Es wurde“ ist im Deutschen natürlich und lässt sowohl den Eintritt als auch das Vorhandensein des bezeichneten Zeitabschnitts anklingen.
- source_word: עֶרֶב
  choice: Abend
  rationale: Die direkte und im Schöpfungsrefrain geläufige Entsprechung ist „Abend“; „Abenddämmerung“ wäre enger als der hebräische Ausdruck.
- source_word: וַיְהִי
  choice: und es wurde
  rationale: Die Wiederholung wird gleichlautend wiedergegeben, um Aufbau und Rhythmus der hebräischen Formel zu bewahren.
- source_word: בֹקֶר
  choice: Morgen
  rationale: „Morgen“ ist die direkte, natürliche Entsprechung; „Tagesanbruch“ würde die Bedeutung unnötig verengen.
- source_word: יוֹם רְבִיעִי
  choice: der vierte Tag
  rationale: Die Ordinalverbindung bezeichnet den Tag als vierten in der Folge. Der bestimmte Artikel ist im Deutschen idiomatisch, obwohl im Hebräischen kein eigener Artikel steht.
theological_decisions:
- issue: Wiedergabe des Schöpfungstagsrefrains ohne Festlegung auf eine bestimmte Chronologie oder Deutung der Länge der Schöpfungstage
  choice: 'Und es wurde Abend, und es wurde Morgen: der vierte Tag.'
  alternative: 'Und es war Abend, und es war Morgen: ein vierter Tag.'
  rationale: Die Übersetzung bewahrt die schlichte Zeitformel und die ordinal bestimmte Tagesangabe, ohne Aussagen über Art oder Dauer der Schöpfungstage hinzuzufügen. „Es wurde“ hält die mögliche dynamische Nuance von היה offen; „der vierte Tag“ entspricht natürlichem Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung und der feierliche Rhythmus des hebräischen Refrains bleiben erhalten; der Doppelpunkt markiert knapp die abschließende Tageszählung.
