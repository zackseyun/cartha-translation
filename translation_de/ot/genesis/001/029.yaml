source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: de
  text: 'Und Gott sprach: »Seht, ich habe euch alle samentragenden Pflanzen gegeben, die auf der ganzen Erde wachsen, und jeden Baum, der Früchte mit Samen trägt. Sie sollen euch zur Nahrung dienen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Der an mehrere Menschen gerichtete Aufmerksamkeitsruf wird modern und zugleich würdevoll wiedergegeben; das traditionellere »Siehe« wäre im Deutschen trotz der Mehrzahl singularisch und heute weniger natürlich.
- source_word: נָתַתִּי
  choice: ich habe euch … gegeben
  rationale: Das hebräische Perfekt bezeichnet die vollzogene Gabe mit fortdauernder Geltung.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: alle samentragenden Pflanzen
  rationale: עֵשֶׂב bezeichnet hier pflanzlichen Bewuchs allgemein; »Pflanzen« ist im heutigen Deutsch treffender als das enger oder altertümlich wirkende »Kraut«.
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: die auf der ganzen Erde wachsen
  rationale: Die räumliche Aussage wird natürlich deutsch ausgedrückt; »wachsen« ist aus dem Bezug auf Pflanzen erschlossen und vermeidet die schwerfällige Lehnwendung »auf dem Angesicht der ganzen Erde«.
- source_word: כָּל־הָעֵץ אֲשֶׁר־בּוֹ פְרִי־עֵץ זֹרֵעַ זָרַע
  choice: jeden Baum, der Früchte mit Samen trägt
  rationale: Die distributive Verbindung כָּל mit Singular wird durch »jeden« bewahrt. Die hebräische Beschreibung der Frucht wird verständlich und ohne sachliche Erweiterung wiedergegeben.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Sie sollen euch zur Nahrung dienen
  rationale: Die Pflanzen und Bäume werden im Deutschen gemeinsam im Plural aufgenommen; »zur Nahrung dienen« gibt die Bestimmung zum Essen idiomatisch wieder.
theological_decisions:
- issue: Umfang der dem Menschen gegebenen Nahrung
  choice: Die Aussage wird ohne Zusatz oder Einschränkung auf alle genannten samentragenden Pflanzen und Fruchtbäume bezogen.
  alternative: Den Vers ausdrücklich als dauerhaftes Ernährungsgebot oder als Ausschluss jeder anderen Nahrung deuten.
  rationale: Der hebräische Text beschreibt Gottes Gabe, legt hier aber weder ausdrücklich deren spätere Dauer noch alle denkbaren theologischen Folgerungen fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; veraltete Wendungen wie »siehe« und »zum Essen sein« werden vermieden.
