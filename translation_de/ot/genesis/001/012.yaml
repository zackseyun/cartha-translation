source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: de
  text: 'Und die Erde ließ frisches Grün hervorsprießen: Pflanzen, die Samen hervorbringen nach ihrer Art, und Bäume, die Früchte tragen, in denen ihr Same ist, nach ihrer Art. Und Gott sah, dass es gut war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: ließ … hervorsprießen
  rationale: Der Hifil beschreibt, dass die Erde das Pflanzenwachstum hervorbringt. Die Formulierung ist im Deutschen natürlich und bewahrt die hervorrufende, wachstumsbezogene Nuance.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der kosmische Zusammenhang von Genesis 1 spricht hier für „Erde“ statt für das enger gefasste „Land“.
- source_word: דֶּשֶׁא
  choice: frisches Grün
  rationale: Das Wort bezeichnet kollektiv junges, grünes Pflanzenwachstum und nicht nur Gras. „Frisches Grün“ gibt dieses anschaulich und verständlich wieder.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: Pflanzen, die Samen hervorbringen
  rationale: עֵשֶׂב bezeichnet hier samenbildende Pflanzen bzw. Krautgewächse. Die Wiedergabe ist modernes Deutsch und bewahrt die Aussage über ihre Fortpflanzungsfähigkeit.
- source_word: לְמִינֵהוּ
  choice: nach ihrer Art
  rationale: מִין bezeichnet eine Art oder Kategorie innerhalb der Schöpfungsordnung, ohne den modernen biologischen Fachbegriff „Spezies“ vorauszusetzen. Der deutsche Singular „ihrer Art“ entspricht der distributiven hebräischen Form.
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: und Bäume, die Früchte tragen
  rationale: עֵץ steht kollektiv; der deutsche Plural ist natürlich. „Früchte tragen“ ist die idiomatische Entsprechung für das Hervorbringen von Frucht.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: in denen ihr Same ist
  rationale: 'Die Formulierung folgt der hebräischen Relativkonstruktion und lässt deren Bezugsspannung bestehen: Grammatisch können die maskulinen Singularformen an den kollektiv verstandenen Baum bzw. dessen Frucht anschließen; sachlich befindet sich der Same in der Frucht.'
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Und Gott sah, dass es gut war
  rationale: Diese Wiedergabe bewahrt den wiederkehrenden göttlichen Bewertungsrefrain von Genesis 1 knapp und würdevoll.
theological_decisions:
- issue: Schöpfungskategorien nicht mit moderner biologischer Taxonomie gleichsetzen
  choice: nach ihrer Art
  alternative: nach ihren Spezies
  rationale: מִין benennt im antiken Text eine Art oder geschaffene Kategorie, ist aber kein technischer Begriff moderner Biologie. „Nach ihrer Art“ bewahrt die Aussage, ohne spätere wissenschaftliche oder konfessionelle Deutungen einzutragen.
- issue: Bezug des Samens in der Relativkonstruktion
  choice: in denen ihr Same ist
  alternative: mit ihrem Samen darin
  rationale: Die eng am Hebräischen bleibende Relativkonstruktion bewahrt die natürliche sachliche Zuordnung des Samens zur Frucht, ohne die grammatische Spannung des kollektiv-singularischen Ausdrucks dogmatisch oder erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frisches Grün“ vermeidet die zu enge Wiedergabe „Gras“; „nach ihrer Art“ ist verständlich, traditionsnah und nicht taxonomisch-technisch. Die Satzstruktur bleibt gehoben, ohne altertümlich zu wirken.
