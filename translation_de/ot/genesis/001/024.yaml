source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: de
  text: 'Und Gott sprach: „Die Erde soll lebende Wesen[a] hervorbringen, je nach ihrer Art: Vieh, Tiere, die sich am Boden bewegen, und Wildtiere der Erde, je nach ihrer Art.“ Und so geschah es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „lebende Geschöpfe“; wörtlich „eine lebende nefesch (Seele/Lebenskraft)“.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: soll … hervorbringen
  rationale: Der Hifil-Jussiv mit „die Erde“ als Subjekt formuliert Gottes Befehl, dass die Erde die Lebewesen hervorbringen soll. Die deutsche Fassung bewahrt sowohl den Aufforderungscharakter als auch die kausative Bedeutung.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Schöpfungszusammenhang bezeichnet אֶרֶץ den gesamten irdischen Bereich; „die Erde“ gibt diesen weiten Bezug angemessen wieder.
- source_word: נֶפֶשׁ חַיָּה
  choice: lebende Wesen
  rationale: Die Wendung bezeichnet hier beseelte beziehungsweise atmende Lebewesen allgemein. „Lebende Wesen“ ist verständlich, wahrt die Breite des Ausdrucks und vermeidet die heute leicht missverständliche Festlegung auf „Seelen“.
- source_word: לְמִינָהּ
  choice: je nach ihrer Art
  rationale: Die Form steht im Singular mit femininem Suffix und bezieht sich kollektiv auf die genannten Lebewesen. „Je nach ihrer Art“ bewahrt diesen distributiven Sinn in natürlichem Deutsch.
- source_word: בְּהֵמָה
  choice: Vieh
  rationale: Das Wort bezeichnet hier vor allem größere, domestizierte oder zahme Landtiere als Gruppe. „Vieh“ ist im Deutschen knapp und bildet den Gegensatz zu den Wildtieren deutlich ab.
- source_word: רֶמֶשׂ
  choice: Tiere, die sich am Boden bewegen
  rationale: Der Ausdruck umfasst kleine, sich am Boden fortbewegende Tiere. Diese Wiedergabe ist breiter und weniger missverständlich als „Kriechtiere“, das heute oft nur Reptilien bezeichnet.
- source_word: חַיְתוֹ אֶרֶץ
  choice: Wildtiere der Erde
  rationale: Die Wendung bezeichnet die nicht domestizierten Landtiere und unterscheidet sie vom Vieh. „Wildtiere der Erde“ gibt sowohl den Gegensatz als auch den Bezug zum irdischen Lebensraum wieder.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die knappe Erfüllungsformel von Genesis 1 wird in würdigem, natürlichem Deutsch wiedergegeben und zeigt, dass Gottes Befehl ausgeführt wurde.
theological_decisions:
- issue: Theologisch mögliche Überdeutung von נֶפֶשׁ חַיָּה
  choice: lebende Wesen
  alternative: lebende Seelen
  rationale: Im vorliegenden Zusammenhang bezeichnet die hebräische Wendung tierisches Leben und macht keine ausdrückliche Aussage über die metaphysische Beschaffenheit der Tiere. Die gewählte Fassung vermeidet daher eine nicht vom Kontext geforderte dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen Rhythmus des Hebräischen, ohne unnatürlich altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die lexikalische Anmerkung bezieht.
