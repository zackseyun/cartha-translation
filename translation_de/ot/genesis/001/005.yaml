base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: de
  text: 'Und Gott nannte das Licht Tag, und die Finsternis nannte er Nacht. Es wurde Abend, und es wurde Morgen: der erste Tag.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Tag eins“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: nannte
  rationale: קרא bezeichnet in dieser Konstruktion die Vergabe eines Namens. „Nannte“ ist im Deutschen natürlicher als „rief“ und bewahrt den Benennungsakt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv steht hier mit einem Verb im Singular und bezeichnet den einen Schöpfer; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: לָאוֹר
  choice: das Licht
  rationale: Die Präposition gehört zur hebräischen Benennungskonstruktion; idiomatisches Deutsch verwendet nach „nennen“ den Akkusativ. Der bestimmte Artikel wird wiedergegeben.
- source_word: יוֹם
  choice: Tag
  rationale: „Tag“ ist der dem Licht zugewiesene Name. Die Großschreibung ist im Deutschen ohnehin substantivisch vorgeschrieben.
- source_word: וְלַחֹשֶׁךְ
  choice: die Finsternis
  rationale: „Finsternis“ gibt חֹשֶׁךְ würdig und präzise wieder; die Benennungskonstruktion wird idiomatisch mit dem Akkusativ ausgedrückt.
- source_word: קָרָא
  choice: nannte er
  rationale: Die Wiederholung des Verbs wird beibehalten und spiegelt Parallelismus und Rhythmus des Hebräischen.
- source_word: לָיְלָה
  choice: Nacht
  rationale: „Nacht“ ist der der Finsternis zugewiesene Name und die direkte lexikalische Entsprechung.
- source_word: וַיְהִי
  choice: es wurde
  rationale: „Es wurde“ gibt den Fortgang der Erzählung natürlich wieder und bewahrt die zweimalige hebräische Formel. „Es war“ wäre ebenfalls möglich, betonte den Übergang jedoch weniger.
- source_word: עֶרֶב
  choice: Abend
  rationale: „Abend“ entspricht der Grundbedeutung; „Sonnenuntergang“ wäre unnötig enger.
- source_word: בֹקֶר
  choice: Morgen
  rationale: „Morgen“ entspricht der Grundbedeutung; „Tagesanbruch“ wäre spezifischer, als der hebräische Ausdruck verlangt.
- source_word: יוֹם אֶחָד
  choice: der erste Tag
  rationale: Wörtlich steht der Kardinalausdruck „ein Tag“. Innerhalb der sich anschließenden Zählfolge vermittelt „der erste Tag“ die Funktion im Deutschen am natürlichsten; die formale Besonderheit bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von יוֹם אֶחָד am Ende der Schöpfungstagsformel
  choice: der erste Tag
  alternative: ein Tag / Tag eins
  rationale: Das Hebräische verwendet אֶחָד („eins/einer“) und nicht die Ordinalzahl „erster“. Im deutschen Erzählzusammenhang bezeichnet die Wendung jedoch den ersten Tag der Folge. Da die wörtliche Formulierung auslegungsrelevant sein kann, wird sie nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der hebräische Parallelismus der beiden Benennungen und die wiederholte Abend-Morgen-Formel bleiben erkennbar; unnötig altertümliche Wortstellung wird vermieden.
