id: GEN.1.6
reference: Genesis 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: de
  text: 'Und Gott sprach: „Es soll eine Weite[a] mitten in den Wassern sein, und sie soll Wasser von Wasser trennen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Feste“, „Gewölbe“ oder „Himmelsgewölbe“. Das hebräische Wort רָקִיעַ bezeichnet etwas Ausgebreitetes oder Ausgespanntes. Die Übersetzungen unterscheiden sich darin, wie ausdrücklich sie die antike Vorstellung vom Aufbau der Welt wiedergeben.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zwischen Wasser und Wasser scheiden“, das heißt, eine Wassermenge von der anderen abgrenzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Und Gott sprach“ bewahrt den hebräischen Erzählfluss und entspricht dem würdevollen Register des Schöpfungsberichts.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das der Form nach plurale Substantiv steht hier mit einem Verb im Singular und bezeichnet den einen Schöpfer.
- source_word: יְהִי
  choice: Es soll … sein
  rationale: Der Jussiv von היה drückt den wirksamen göttlichen Schöpfungsbefehl aus. Die Formulierung ist im modernen Deutschen klar und bleibt eng am hebräischen Wortlaut.
- source_word: רָקִיעַ
  choice: Weite
  rationale: Das Wort bezeichnet etwas Ausgebreitetes oder Ausgespanntes. „Weite“ gibt diese Vorstellung wieder, ohne im Haupttext eine bestimmte Rekonstruktion des antiken Weltbildes festzulegen.
- source_word: בְּתוֹךְ
  choice: mitten in
  rationale: Die Wendung bezeichnet eine Lage innerhalb beziehungsweise in der Mitte der Wasser.
- source_word: הַמָּיִם
  choice: den Wassern
  rationale: Der Plural erhält das Bild der urzeitlichen Wasser und klingt in diesem poetisch-feierlichen Zusammenhang natürlich.
- source_word: וִיהִי מַבְדִּיל
  choice: und sie soll … trennen
  rationale: Der fortgesetzte Jussiv bezeichnet die vorgesehene Funktion der Weite. Das feminine Pronomen richtet sich nach dem deutschen Substantiv „Weite“.
- source_word: בֵּין מַיִם לָמָיִם
  choice: Wasser von Wasser
  rationale: Nach „trennen“ ist dies eine natürliche deutsche Wiedergabe der wörtlichen Konstruktion „zwischen Wasser und Wasser“.
theological_decisions:
- issue: Wiedergabe von רָקִיעַ im Verhältnis zum antiken Weltbild
  choice: Weite
  alternative: Feste, Gewölbe oder Himmelsgewölbe
  rationale: „Weite“ bewahrt die Grundvorstellung von etwas Ausgebreitetem, ohne die echte lexikalische und kosmologische Spannung einseitig aufzulösen. Konkretere Deutungen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht feierlichem Ton. Die Satzstruktur folgt dem hebräischen Schöpfungsbefehl, ohne unnötig altertümliche Formen zu verwenden.
