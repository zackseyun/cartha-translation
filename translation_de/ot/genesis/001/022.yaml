source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: de
  text: 'Und Gott segnete sie und sprach: »Seid fruchtbar und vermehrt euch und füllt die Meere; und die Vögel[a] sollen sich auf der Erde vermehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die fliegenden Geschöpfe“; das hebräische Wort עוֹף kann fliegende Geschöpfe allgemeiner bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Das Piel von ברך bezeichnet hier das Gewähren bzw. Aussprechen eines Segens. „Segnete“ ist die natürliche und traditionsnahe deutsche Entsprechung.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen verweist auf die im vorherigen Vers genannten Meerestiere und fliegenden Geschöpfe.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet in Genesis 1 mit singularischer Verbkongruenz den einen Schöpfer.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Die Infinitivkonstruktion leitet direkte Rede ein. Im Deutschen gibt „und sprach“ den erzählerischen Zusammenhang natürlicher wieder als das formnähere „indem er sagte“.
- source_word: פְּרוּ
  choice: Seid fruchtbar
  rationale: Der Imperativ von פרה bezeichnet Fruchtbarkeit und Fortpflanzung; die idiomatische Wendung bewahrt mehr als eine bloße numerische Zunahme.
- source_word: וּרְבוּ
  choice: und vermehrt euch
  rationale: Der Imperativ von רבה bezeichnet zahlenmäßige Zunahme und wird im Deutschen idiomatisch reflexiv ausgedrückt.
- source_word: וּמִלְאוּ
  choice: und füllt
  rationale: Der Imperativ von מלא bedeutet unmittelbar „füllen“; eine verstärkende Ergänzung wie „ganz“ ist nicht erforderlich.
- source_word: אֶת הַמַּיִם
  choice: das Wasser
  rationale: Das hebräische מַיִם steht formal im Plural, wird im modernen Standarddeutsch in diesem Sinn jedoch natürlicherweise als singularisches Kollektivum „Wasser“ wiedergegeben.
- source_word: בַּיַּמִּים
  choice: in den Meeren
  rationale: Der hebräische Plural יַמִּים wird als „Meere“ bewahrt.
- source_word: וְהָעוֹף
  choice: die Vögel
  rationale: עוֹף kann fliegende Geschöpfe allgemein bezeichnen; im Kontext ist „Vögel“ die natürliche Hauptübersetzung. Die größere Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: יִרֶב
  choice: sollen sich … vermehren
  rationale: Die deutsche Konstruktion gibt die volitive Kraft des Jussivs wieder, ohne die Aussage zu einer bloßen Zukunftsprognose zu verflachen.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אָרֶץ bezeichnet hier den irdischen Bereich, in dem die Vögel zunehmen; „auf der Erde“ ist im Kontext direkt und natürlich.
theological_decisions:
- issue: Art des Sprechakts im Segen
  choice: 'Die Imperative und der Jussiv werden als göttlicher Segen in auffordernder Form wiedergegeben: „Seid fruchtbar … die Vögel sollen sich … vermehren.“'
  alternative: Alle Formen als unmittelbare Befehle wiedergeben oder den letzten Satz als reine Zukunftsaussage („werden sich vermehren“) formulieren.
  rationale: Das Hebräische verbindet den ausdrücklich genannten Segen mit Imperativen und einem Jussiv. Die Übersetzung bewahrt die Spannung zwischen wirksamem Segen und Auftrag.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzstruktur des Hebräischen bleibt weitgehend erhalten; zugleich werden natürliche deutsche Formen wie „und sprach“, „das Wasser“ und „sich vermehren“ verwendet.
