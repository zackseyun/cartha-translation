revisions:
- from: 'Und Gott segnete sie und sprach: »Seid fruchtbar und vermehrt euch und füllt das Wasser in den Meeren; und die Vögel[a] sollen sich auf der Erde vermehren.«'
  to: 'Und Gott segnete sie und sprach: »Seid fruchtbar und vermehrt euch und füllt die Meere; und die Vögel[a] sollen sich auf der Erde vermehren.«'
  rationale: Die Revision ersetzt ausschließlich die im modernen Deutsch missverständliche Kollokation „das Wasser in den Meeren füllen“ durch „die Meere füllen“. Damit bleibt die Aussage des hebräischen Bildes erhalten und wird idiomatisch klar. Die Fußnote und ihr Anker bleiben unverändert korrekt.
  reviewer_model: gpt-5.6-terra
