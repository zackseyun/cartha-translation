  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: de
  text: Und Gott setzte sie in das Himmelsgewölbe, damit sie Licht auf die Erde geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Weite des Himmels“; traditionell: „an die Feste des Himmels“.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: setzte
  rationale: נתן bedeutet grundsätzlich „geben, setzen, stellen“. Im Zusammenhang mit der Anordnung der Himmelslichter gibt „setzte“ die bewusste Platzierung natürlich und präzise wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die zuvor genannten Lichter und Sterne.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie hier mit dem Verb im Singular den einen Schöpfer.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: an das Himmelsgewölbe
  rationale: רָקִיעַ bezeichnet etwas Ausgebreitetes beziehungsweise die sichtbare Wölbung über der Erde. „Himmelsgewölbe“ ist im Deutschen verständlich und wahrt die Bildwelt des Textes, ohne sie naturwissenschaftlich umzudeuten. Die Präposition ב kann bei einer Platzierung idiomatisch mit „an“ wiedergegeben werden.
- source_word: לְהָאִיר
  choice: damit sie Licht ... geben
  rationale: Der Hifil-Infinitiv von אור ist kausativ und bezeichnet das Erhellen beziehungsweise Lichtgeben. Die finite Zweckkonstruktion klingt im modernen Deutschen natürlich.
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: In Verbindung mit dem Lichtgeben bezeichnet עַל hier das Ziel beziehungsweise den Bereich der Beleuchtung; „auf die Erde“ ist klares, idiomatisches Deutsch.
theological_decisions:
- issue: Kosmologischer Ausdruck רָקִיעַ im Schöpfungsbericht
  choice: Himmelsgewölbe
  alternative: Himmelsraum; Feste des Himmels
  rationale: Die Wiedergabe bewahrt die anschauliche räumliche Sprache des hebräischen Textes, ohne eine moderne wissenschaftliche Kosmologie einzutragen. „Feste“ wäre traditionell, ist heute jedoch leicht missverständlich; „Himmelsraum“ schwächt den möglichen Bildgehalt von רָקִיעַ ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber durch einen natürlichen deutschen Zwecksatz geglättet. Die Fußnote erhält die echte lexikalische und präpositionale Bandbreite.
