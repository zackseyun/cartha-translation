  source_fidelity: 'Die Übersetzung gibt die drei im Hebräischen unterschiedenen Gruppen sachgerecht wieder: חַיַּת הָאָרֶץ als wilde Tiere, בְּהֵמָה als Vieh und רֶמֶשׂ הָאֲדָמָה als alles, was sich auf dem Erdboden regt. Die Unterscheidung von הָאָרֶץ („Erde“) und אֲדָמָה („Erdboden“) bleibt erhalten. „Nach ihren/seinen Arten“ gibt לְמִינָהּ bzw. לְמִינֵהוּ idiomatisch und ohne moderne taxonomische Festlegung wieder. Der abschließende Bewertungsrefrain ist genau getroffen.'
