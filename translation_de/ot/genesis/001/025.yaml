  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: de
  text: Und Gott machte die wilden Tiere der Erde nach ihren Arten, das Vieh nach seinen Arten und alles, was sich auf dem Erdboden regt, nach seiner Art.[a] Und Gott sah, dass es gut war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Art“ bezeichnet hier eine Kategorie von Geschöpfen und ist nicht ohne Weiteres mit dem modernen biologischen Begriff „Spezies“ gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: machte
  rationale: עָשָׂה bedeutet gewöhnlich „machen“ oder „tun“. „Machte“ gibt das Verb im Schöpfungszusammenhang direkt wieder, ohne eine zusätzliche Nuance wie „formte“ einzutragen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv steht hier mit einem Verb im Singular und bezeichnet in Genesis 1 den einen Schöpfer; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: חַיַּת הָאָרֶץ
  choice: die wilden Tiere der Erde
  rationale: Die Wendung bezeichnet die wild lebenden Landtiere im Unterschied zum Vieh und zu den sich am Boden bewegenden Kleintieren. „Wilde Tiere“ ist im heutigen Deutsch klarer und natürlicher als „Tiere des Feldes“ oder „Bestien“.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: nach ihren Arten / nach seiner Art
  rationale: מִין bezeichnet eine Art oder Kategorie. Die Wiedergabe bewahrt Numerus und Suffixe des Hebräischen und vermeidet die modern-biologische Fachbedeutung von „Spezies“.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: בְּהֵמָה bezeichnet hier vor allem größere, dem Menschen zugeordnete beziehungsweise domestizierte Landtiere. „Vieh“ ist eine knappe und geläufige deutsche Sammelbezeichnung.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: alles, was sich auf dem Erdboden regt
  rationale: רֶמֶשׂ bezeichnet kleinere Tiere, die sich dicht am Boden bewegen. Die verbale Formulierung klingt im modernen Deutsch natürlich und bewahrt den Bezug auf הָאֲדָמָה als Erdboden.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Und Gott sah, dass es gut war
  rationale: Diese Formulierung gibt den wiederkehrenden Bewertungsrefrain in Genesis 1 idiomatisch und eng am Hebräischen wieder.
theological_decisions:
- issue: Schöpfungskategorien ohne moderne biologische Taxonomie
  choice: Art / Arten
  alternative: Spezies
  rationale: Das hebräische מִין bezeichnet Kategorien von Geschöpfen, entspricht aber nicht notwendig dem modernen taxonomischen Begriff „Spezies“. Die Übersetzung lässt Reichweite und Abgrenzung der Kategorien offen.
- issue: Unterscheidung zwischen הָאָרֶץ und הָאֲדָמָה im selben Vers
  choice: Erde … Erdboden
  alternative: Erde … Erde
  rationale: 'Die unterschiedlichen deutschen Wörter bewahren die hebräische lexikalische Unterscheidung: הָאָרֶץ bezeichnet hier die Erde beziehungsweise das Land, הָאֲדָמָה den Boden.'
- issue: Bedeutungsumfang von חַיַּת הָאָרֶץ
  choice: wilde Tiere der Erde
  alternative: Tiere der Erde
  rationale: Im Zusammenhang steht diese Gruppe dem Vieh gegenüber. „Wilde Tiere“ macht diese wahrscheinliche Abgrenzung verständlich, ohne eine besondere zoologische Klassifikation zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. „Erdboden“ erhält die Unterscheidung von אֲדָמָה gegenüber אֶרֶץ; die Wendung „alles, was sich … regt“ vermeidet das heute missverständliche substantivierte „Gewürm“.
