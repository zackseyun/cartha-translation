  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: de
  text: 'Und Gott machte die beiden großen Lichter: das größere Licht, damit es über den Tag herrsche, und das kleinere Licht, damit es über die Nacht herrsche, und die Sterne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: »und auch die Sterne«.'
    reason: 'Lexikalische Alternative: Das koordinierende וְ kann beim knappen Nachtrag der Sterne im Deutschen durch »auch« verdeutlicht werden; der hebräische Text selbst hat jedoch kein eigenes Wort für »auch«.'
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: machte
  rationale: עָשָׂה bedeutet gewöhnlich »machen« oder »tun«. »Machte« ist hier die schlichte, textnahe Wiedergabe; »bestimmte« würde die im Kontext genannte Funktion in das Verb hineintragen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: In Genesis 1 bezeichnet אֱלֹהִים mit einem Verb im Singular den einen Gott; »Gott« ist die übliche und sachlich genaue deutsche Wiedergabe.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: die beiden großen Lichter
  rationale: מָאוֹר bezeichnet einen Lichtträger oder Himmelskörper. »Lichter« ist im Deutschen natürlich, bewahrt die Wortwahl des Hebräischen und vermeidet die nicht im Text stehenden Namen Sonne und Mond.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: das größere Licht
  rationale: Wörtlich steht »das große Licht«; im Gegensatz zum folgenden kleineren Licht gibt »das größere Licht« die beabsichtigte Gegenüberstellung im Deutschen klar und idiomatisch wieder.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: damit es über den Tag herrsche
  rationale: מֶמְשֶׁלֶת bezeichnet Herrschaft oder das Herrschen. Die finale Formulierung gibt die Funktion des Lichtes natürlich wieder, ohne den Herrschaftsbegriff abzuschwächen.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: das kleinere Licht
  rationale: קָטֹן bedeutet »klein« beziehungsweise im Vergleich »kleiner«. »Das kleinere Licht« bildet im Deutschen den passenden Gegensatz zu »das größere Licht«.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: damit es über die Nacht herrsche
  rationale: Die parallele Formulierung bewahrt sowohl die Bedeutung von מֶמְשֶׁלֶת als auch den syntaktischen Gleichklang mit der Aussage über den Tag.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: und die Sterne
  rationale: Die Konjunktion mit dem Akkusativzeichen führt ein weiteres geschaffenes Objekt knapp an. »Und die Sterne« erhält diesen nachgetragen wirkenden Anschluss; »und auch die Sterne« ist als ausdrückliche Alternative möglich.
theological_decisions:
- issue: Bezeichnung der Himmelskörper ohne die Namen Sonne und Mond
  choice: »das größere Licht« und »das kleinere Licht«
  alternative: »die Sonne« und »der Mond«
  rationale: Der hebräische Text verwendet מָאוֹר (»Licht/Lichtträger«) und nicht die gewöhnlichen Wörter für Sonne und Mond. Die gewählte Fassung bewahrt diese auffällige Ausdrucksweise und fügt keine im Ausgangstext fehlenden Namen ein.
- issue: Bedeutung von מֶמְשֶׁלֶת für die Funktion der Lichter
  choice: »über den Tag/die Nacht herrschen«
  alternative: »den Tag/die Nacht bestimmen« oder »regieren«
  rationale: »Herrschen« gibt den Herrschaftsbegriff unmittelbar wieder, ohne ihn rein funktional umzudeuten oder eine besondere theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Struktur des hebräischen Satzes bleibt erhalten. Der Konjunktiv »herrsche« markiert den Zweck und vermeidet die schwerfälligere Substantivierung »zur Herrschaft über«. Der knappe Nachtrag »und die Sterne« wird bewusst nicht geglättet.
