id: GEN.1.8
reference: Genesis 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: de
  text: 'Und Gott nannte die Ausdehnung[b] Himmel[a]. Es wurde Abend, und es wurde Morgen: der zweite Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Himmelsraum“ beziehungsweise „die Himmel“. Das hebräische שָׁמַיִם kann den sichtbaren Himmel oder die Himmel bezeichnen; hier ist es der Name, den Gott der Ausdehnung gibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Himmelsgewölbe“; traditionell „Feste“. Das hebräische רָקִיעַ bezeichnet etwas Ausgebreitetes oder Ausgespanntes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: nannte
  rationale: קרא mit ל bezeichnet hier die Benennung. „Nannte“ gibt diese Funktion im Deutschen natürlicher und eindeutiger wieder als das wörtlichere „rief“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form steht hier mit einem Verb im Singular und bezeichnet in Genesis 1 den einen Schöpfer.
- source_word: לָרָקִיעַ
  choice: die Ausdehnung
  rationale: רָקִיעַ bezeichnet etwas Ausgebreitetes oder Ausgespanntes. „Ausdehnung“ bewahrt diesen Grundgedanken, ohne mit „Feste“ eine altertümliche oder mit „Gewölbe“ eine stärker festgelegte kosmologische Vorstellung vorzugeben.
- source_word: שָׁמָיִם
  choice: Himmel
  rationale: Das Wort ist hier der Name, den Gott der Ausdehnung gibt. „Himmel“ ist im Deutschen die natürliche, würdige Wiedergabe und kann sowohl den sichtbaren Himmel als auch den weiteren Himmelsbereich bezeichnen.
- source_word: וַיְהִי
  choice: es wurde
  rationale: In der wiederkehrenden Tagesformel gibt „es wurde“ die erzählerische Abfolge idiomatisch wieder und wahrt stärker als „es war“ den Übergangscharakter.
- source_word: עֶרֶב
  choice: Abend
  rationale: Dies ist die geläufige und kontextgerechte Wiedergabe in der wiederkehrenden Schöpfungsformel.
- source_word: בֹקֶר
  choice: Morgen
  rationale: Dies ist die geläufige und kontextgerechte Wiedergabe in der wiederkehrenden Schöpfungsformel.
- source_word: יוֹם שֵׁנִי
  choice: der zweite Tag
  rationale: Obwohl שֵׁנִי keinen Artikel trägt, dient die Wendung als Ordnungsangabe innerhalb der Folge der Schöpfungstage; „der zweite Tag“ ist dafür natürliches Deutsch.
theological_decisions:
- issue: Bedeutung von שָׁמַיִם als Name der רָקִיעַ
  choice: Himmel
  alternative: Himmelsraum; die Himmel
  rationale: „Himmel“ erhält die Benennung und den gehobenen Ton, ohne festzulegen, ob ausschließlich der sichtbare Himmel oder darüber hinaus Gottes Wohnbereich gemeint ist.
- issue: Kosmologische Bildhaftigkeit von רָקִיעַ
  choice: Ausdehnung
  alternative: Feste; Himmelsgewölbe
  rationale: Die Übersetzung soll den Gedanken des Ausgebreiteten erkennen lassen, aber weder ein bestimmtes antikes Weltmodell dogmatisch festschreiben noch die konkrete Bildhaftigkeit des hebräischen Ausdrucks verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Schöpfungsformel bleibt knapp und rhythmisch. Die Fußnotenmarker wurden unmittelbar an die jeweils erläuterten Wörter gesetzt.
