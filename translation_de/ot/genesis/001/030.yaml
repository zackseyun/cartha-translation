base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: de
  text: Und allen Tieren der Erde, allen Vögeln am Himmel und allem, was sich auf der Erde regt und Leben hat, habe ich alles grüne Gewächs zur Nahrung gegeben.[a] Und so geschah es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird das Verb nicht wiederholt; es wird aus dem vorhergehenden Vers fortgeführt: „habe ich … gegeben“.'
    reason: syntactic_ellipsis
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: Tiere der Erde
  rationale: Die Wendung bezeichnet die Landtiere. „Tiere der Erde“ ist im Deutschen natürlich und legt sich nicht unnötig auf „Wildtiere“ fest.
- source_word: עוֹף הַשָּׁמַיִם
  choice: Vögel am Himmel
  rationale: עוֹף kann Flugtiere im weiteren Sinn bezeichnen; im Schöpfungsbericht ist „Vögel“ die klare, geläufige Wiedergabe. „Am Himmel“ gibt den Lebensbereich idiomatisch wieder.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: allem, was sich auf der Erde regt
  rationale: רמשׂ bezeichnet sich regende beziehungsweise kriechende Tiere. „Sich regen“ bewahrt die Breite des Ausdrucks besser als das engere „kriechen“.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: und Leben in sich hat
  rationale: נֶפֶשׁ חַיָּה bezeichnet hier ein lebendes Wesen beziehungsweise belebtes Leben. Die Formulierung gibt die Funktion des Relativsatzes natürlich wieder, ohne den Ausdruck mit נִשְׁמַת חַיִּים („Lebensatem“) aus Genesis 2,7 zu verwechseln.
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: alles grüne Pflanzenzeug
  rationale: Die Wortverbindung bezeichnet grüne, krautartige Vegetation. „Pflanzenzeug“ ist ein verständlicher Sammelbegriff und bewahrt die kollektive Bedeutung.
- source_word: לְאָכְלָה
  choice: zur Nahrung
  rationale: 'Die ל-Präposition bezeichnet den Zweck: Die Pflanzen dienen als Nahrung.'
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die feste Erfüllungsformel des Schöpfungsberichts wird in natürlichem, würdevollem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ חַיָּה bei Tieren
  choice: „Leben in sich hat“
  alternative: „in dem eine lebendige Seele ist“ / „das ein lebendes Wesen ist“
  rationale: Der Ausdruck kennzeichnet Tiere als lebende Wesen. „Leben in sich hat“ vermeidet sowohl eine dogmatische Festlegung zum Begriff „Seele“ als auch die sachlich unzutreffende Gleichsetzung mit dem anderslautenden „Lebensatem“ in Genesis 2,7.
- issue: Im Hebräischen dieses Verses ausgespartes Verb
  choice: „gebe ich“ aus Vers 29 ergänzt
  alternative: „ist ... zur Nahrung“
  rationale: Die Dativglieder und das mit אֵת markierte Objekt führen syntaktisch das Verb נָתַתִּי („ich habe gegeben“) aus Vers 29 fort. Im Deutschen ist die Ergänzung des Verbs für einen vollständigen, verständlichen Satz nötig; das Präsens entspricht dem fortlaufenden göttlichen Zuspruch.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Reihung des Hebräischen bleibt erkennbar, wird aber durch natürliche deutsche Syntax geglättet. „Lebensatem“ wurde bewusst vermieden, da im Ausgangstext נֶפֶשׁ חַיָּה und nicht נִשְׁמַת חַיִּים steht.
