revisions:
- from: Und allen Tieren der Erde, allen Vögeln am Himmel und allem, was sich auf der Erde regt und Leben in sich hat, gebe ich alles grüne Pflanzenzeug zur Nahrung.[a] Und so geschah es.
  to: Und allen Tieren der Erde, allen Vögeln am Himmel und allem, was sich auf der Erde regt und Leben hat, habe ich alles grüne Gewächs zur Nahrung gegeben.[a] Und so geschah es.
  rationale: Die Revision ersetzt das umgangssprachliche „Pflanzenzeug“ durch das kollektive, registergerechte „grüne Gewächs“. Sie gibt zudem das aus Vers 29 fortgeführte Perfekt als „habe ich … gegeben“ wieder und präzisiert die dazugehörige Fußnote. Die funktionale, nicht-dogmatische Wiedergabe von נֶפֶשׁ חַיָּה als „Leben hat“ bleibt erhalten.
  reviewer_model: gpt-5.6-terra
