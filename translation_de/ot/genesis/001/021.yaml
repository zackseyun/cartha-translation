revisions:
- from: So schuf Gott die großen Meerestiere[a] und alle lebenden Wesen, die sich regen und von denen das Wasser wimmelte, jedes nach seiner Art, und alle geflügelten Vögel, jeden nach seiner Art. Und Gott sah, dass es gut war.
  to: So schuf Gott die großen Meerestiere[a] und alle lebenden Wesen, die sich regen und von denen die Gewässer wimmelten, jedes nach seiner Art, und alle geflügelten Vögel nach ihrer Art. Und Gott sah, dass es gut war.
  rationale: Die Revision beschränkt sich auf eine grammatisch und stilistisch notwendige Glättung der zweiten Art-Formel, eine quellennähere und zugleich natürliche Wiedergabe des pluralischen „Wasser/Gewässer“ sowie eine präzisere Fußnotenformulierung. Bedeutung, Register und die offengehaltene lexikalische Ambiguität von תַּנִּינִם bleiben erhalten.
