base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: de
  text: So schuf Gott die großen Meerestiere[a] und alle lebenden Wesen, die sich regen und von denen die Gewässer wimmelten, jedes nach seiner Art, und alle geflügelten Vögel nach ihrer Art. Und Gott sah, dass es gut war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die großen Seeungeheuer“ oder „die großen Drachen“. Das hebräische Wort tanninim kann große schlangenartige oder ungeheuerartige Wesen bezeichnen; hier legt der Zusammenhang mit dem Wasser „Meerestiere“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: schuf
  rationale: Das Verb ברא wird im Schöpfungsbericht mit dem gehobenen, zugleich allgemein verständlichen deutschen Verb „schaffen“ wiedergegeben und bleibt so von allgemeineren Verben wie „machen“ unterscheidbar.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form steht hier mit einem Verb im Singular und bezeichnet den einen Gott; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: die großen Meerestiere
  rationale: תנינים kann große schlangenartige oder gewaltige Wesen bezeichnen. Der unmittelbare Zusammenhang nennt die Wasserwelt; „Meerestiere“ gibt diesen Bezug natürlich wieder, ohne mögliche Bedeutungsnuancen zu verschweigen.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: alle lebenden Wesen
  rationale: נפש חיה bezeichnet hier belebte Geschöpfe und nicht „Seele“ im späteren theologischen Sinn. „Lebende Wesen“ wahrt die Breite des Ausdrucks.
- source_word: הָרֹמֶשֶׂת
  choice: die sich regen
  rationale: רמש bezeichnet hier allgemein die Bewegung von Lebewesen. „Sich regen“ ist breit genug und passt idiomatisch zu Wasserlebewesen.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: von denen das Wasser wimmelte
  rationale: שרץ vermittelt die Vorstellung von zahlreichem, wimmelndem Leben. Die deutsche Formulierung bewahrt sowohl die Fülle als auch den Relativsatz.
- source_word: לְמִינֵהֶם
  choice: jedes nach seiner Art
  rationale: מין bezeichnet die Einordnung innerhalb der geschaffenen Vielfalt. Das distributive „jedes“ bezieht sich natürlich auf die Gesamtheit der lebenden Wesen.
- source_word: כָּל עוֹף כָּנָף
  choice: alle geflügelten Vögel
  rationale: עוף bezeichnet hier die Vogel- beziehungsweise Flugtierkategorie, während כנף die Flügel hervorhebt. „Geflügelte Vögel“ bildet beide Bestandteile ab.
- source_word: לְמִינֵהוּ
  choice: jeden nach seiner Art
  rationale: Der singularische Suffixbezug entspricht dem kollektiv-distributiven Ausdruck „jeder Vogel“; im Deutschen wird dies durch „jeden“ aufgenommen.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Und Gott sah, dass es gut war
  rationale: Die wiederkehrende Bewertungsformel wird knapp, würdig und in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe von תַּנִּינִם im Schöpfungszusammenhang mit möglichen mythologischen Anklängen
  choice: die großen Meerestiere
  alternative: die großen Seeungeheuer; die großen Drachen
  rationale: Der Vers ordnet diese Wesen ausdrücklich Gottes Schöpfung der Wasserwelt zu. „Meerestiere“ vermeidet eine unbegründete mythologische Festlegung; die kräftigeren lexikalischen Möglichkeiten werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber für natürliche deutsche Lesbarkeit leicht gegliedert. Die wiederholte Formel „nach seiner Art“ und die Schlussbewertung bleiben deutlich erkennbar.
