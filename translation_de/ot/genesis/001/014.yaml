  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: de
  text: 'Und Gott sprach: »Es sollen Lichter in der Himmelsausdehnung[a] sein, um den Tag von der Nacht zu scheiden. Sie sollen als Zeichen und zur Bestimmung von festgesetzten Zeiten sowie von Tagen und Jahren dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Himmelsgewölbe«; traditionell: »am Firmament«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: Lichter
  rationale: Das Substantiv bezeichnet Lichtträger beziehungsweise Lichtquellen. »Lichter« ist im Deutschen natürlich, verständlich und wahrt die Bildsprache des Textes.
- source_word: רָקִיעַ
  choice: Himmelsgewölbe
  rationale: Im Zusammenhang mit הַשָּׁמַיִם bezeichnet der Ausdruck den ausgebreiteten Himmelsraum. »Himmelsgewölbe« ist würdevoll und anschaulich, ohne das veraltete »Firmament« in den Haupttext zu setzen.
- source_word: לְהַבְדִּיל
  choice: um … zu scheiden
  rationale: Der Infinitiv drückt den Zweck der Lichter aus. »Scheiden« greift das wiederkehrende Motiv der Unterscheidung und Trennung in Genesis 1 prägnant auf.
- source_word: לְאֹתֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet ein Zeichen, Kennzeichen oder einen Anzeiger. Die Wiedergabe bleibt bewusst weit und legt die Funktion nicht näher fest.
- source_word: לְמוֹעֲדִים
  choice: für festgesetzte Zeiten
  rationale: מוֹעֲדִים bezeichnet bestimmte oder angesetzte Zeiten und kann andernorts auch Festzeiten meinen. Diese Wiedergabe wahrt die Breite des Ausdrucks, ohne ihn auf Jahreszeiten oder kultische Feste zu verengen.
- source_word: לְיָמִים וְשָׁנִים
  choice: für Tage und Jahre
  rationale: Die genannten Zeiteinheiten werden direkt und idiomatisch wiedergegeben.
- source_word: יְהִי ... וְהָיוּ
  choice: Es sollen … sein … Sie sollen … dienen
  rationale: Die Soll-Form gibt den göttlichen Willens- und Befehlscharakter wieder. Im zweiten Satz ist »dienen« natürliches Deutsch und bildet die funktionale לְ-Konstruktion ab.
theological_decisions:
- issue: Bedeutung von מוֹעֲדִים im Schöpfungszusammenhang
  choice: festgesetzte Zeiten
  alternative: Jahreszeiten; Festzeiten
  rationale: Der kosmische Zusammenhang betrifft die Ordnung und Bestimmung der Zeit. Zugleich bleibt mit »festgesetzte Zeiten« offen, ob auch wiederkehrende Festzeiten mitgemeint sind; eine ausschließlich klimatische oder kultische Deutung wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Soll-Form bewahrt den Charakter des göttlichen Schöpfungswortes; die Satzteilung vermeidet eine schwerfällige Reihung, ohne die Aussageglieder des Hebräischen aufzulösen.
