revisions:
- from: 'Und Gott sprach: »Es sollen Lichter am Himmelsgewölbe[a] sein, um den Tag von der Nacht zu scheiden. Sie sollen als Zeichen dienen, für festgesetzte Zeiten[b] sowie für Tage und Jahre.«'
  to: 'Und Gott sprach: »Es sollen Lichter in der Himmelsausdehnung[a] sein, um den Tag von der Nacht zu scheiden. Sie sollen als Zeichen und zur Bestimmung von festgesetzten Zeiten sowie von Tagen und Jahren dienen.«'
  rationale: Der Haupttext verwendet für רָקִיעַ eine weniger festlegende, quellennahe Wiedergabe. Die zweite Aussage wird so umgestellt, dass die drei hebräischen Zweckangaben im Deutschen verständlich und inhaltlich vollständig wiedergegeben sind. Die Fußnote zu מוֹעֲדִים bleibt als notwendige lexikalische Einordnung erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur des hebräischen Satzes ist getroffen. »Himmelsgewölbe« kann jedoch ein festes Gewölbe stärker festlegen, als רָקִיעַ hier zwingend erfordert; »Himmelsausdehnung« wahrt die räumliche Bedeutung ohne diese zusätzliche Konkretisierung. Die Formulierung »als Zeichen dienen, für ...« ist im Deutschen syntaktisch und semantisch nicht sauber: Die Lichter dienen nicht als festgesetzte Zeiten, sondern markieren bzw. bestimmen sie.'
  naturalness: Der Erzählton ist angemessen. Die notwendige Umformulierung der Zweckbestimmungen ergibt idiomatisches modernes Standarddeutsch und vermeidet die unglückliche Kommafügung nach »dienen«.
  terminology: »Lichter«, »Tag«, »Nacht« und »festgesetzte Zeiten« sind sachgerecht. »Festgesetzte Zeiten« bewahrt die Breite von מוֹעֲדִים; die Fußnote erhält die möglichen engeren Wiedergaben. »Himmelsausdehnung« ist gegenüber »Himmelsgewölbe« die neutralere und quellennähere Haupttextoption.
  issues:
  - severity: medium
    issue: »am Himmelsgewölbe« konkretisiert רָקִיעַ als Gewölbe und verschiebt die räumliche Aussage.
    rationale: Das Hebräische sagt, dass die Lichter in der rāqîaʿ der Himmel sein sollen. Eine Ausdehnungs-Wiedergabe erhält den Sinn, ohne eine Gewölbevorstellung im Haupttext festzuschreiben.
  - severity: high
    issue: »Sie sollen als Zeichen dienen, für festgesetzte Zeiten sowie für Tage und Jahre« ist fehlerhaft bzw. missverständlich konstruiert.
    rationale: Nach »als Zeichen dienen« lässt sich »für festgesetzte Zeiten« nicht gleichrangig anschließen. Der hebräische Zweck der Lichter als Marker zeitlicher Ordnungen wird mit »zur Bestimmung ... dienen« idiomatisch wiedergegeben.
