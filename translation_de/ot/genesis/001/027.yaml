source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: de
  text: Und Gott schuf den Menschen[a] nach seinem Bild; nach dem Bild Gottes schuf er ihn; männlich und weiblich schuf er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Das hebräische Wort ’adam steht hier im Singular und bezeichnet den Menschen zugleich repräsentativ als ganze Menschheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: schuf
  rationale: „Schuf“ ist die natürliche gehobene Wiedergabe des Verbs ברא und bewahrt dessen dreifache Wiederholung im Vers.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet אֱלֹהִים hier mit singularischem Verb den einen Gott.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der singularische Ausdruck bezeichnet hier den Menschen repräsentativ als Menschheit; „den Menschen“ bewahrt im Deutschen sowohl den Singular als auch den umfassenden Bezug.
- source_word: בְּצַלְמוֹ
  choice: nach seinem Bild
  rationale: Diese idiomatische deutsche Wendung gibt die durch ב ausgedrückte Entsprechung wieder; das Suffix bezieht sich auf Gott.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: nach dem Bild Gottes
  rationale: Die Wiederholung von „Bild“ erhält den Parallelismus und die Betonung des Hebräischen.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das maskuline Singularpronomen greift „den Menschen“ auf und bewahrt den beabsichtigten Übergang vom repräsentativen Singular zum Plural.
- source_word: זָכָר וּנְקֵבָה
  choice: männlich und weiblich
  rationale: Die hebräischen Wörter bezeichnen das Geschlecht und entsprechen genauer „männlich und weiblich“ als dem relationalen Ausdruck „Mann und Frau“.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pluralpronomen markiert den Übergang vom Menschen im repräsentativen Singular zu den Menschen in ihrer geschlechtlichen Verschiedenheit.
theological_decisions:
- issue: Wiedergabe von אָדָם im Sinn repräsentativer Menschheit
  choice: den Menschen
  alternative: die Menschheit / den Mann
  rationale: Der Text verwendet zunächst einen Singular mit singularischem Pronomen und wechselt danach bei „männlich und weiblich“ zum Plural. „Den Menschen“ erhält diese Bewegung, ohne den Bezug auf einen einzelnen Mann zu beschränken.
- issue: Bedeutung der Präposition ב bei צֶלֶם
  choice: nach seinem Bild
  alternative: als sein Bild / in seinem Bild
  rationale: „Nach seinem Bild“ ist im modernen Deutschen idiomatisch und wahrt die Aussage der Entsprechung. Die hebräische Präposition kann je nach Deutung auch stärker im Sinn von „als“ verstanden werden; der Text entscheidet diese bildtheologische Frage nicht vollständig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „schuf“, der Wechsel von Singular zu Plural und der Parallelismus des hebräischen Textes bleiben erhalten.
