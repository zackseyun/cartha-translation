id: GEN.1.28
reference: Genesis 1:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: de
  text: 'Und Gott segnete sie, und Gott sagte zu ihnen: „Seid fruchtbar und vermehrt euch, füllt die Erde und unterwerft sie. Herrscht[a] über die Fische im Meer, über die Vögel am Himmel und über jedes Lebewesen, das sich auf der Erde bewegt[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Übt Herrschaft aus über“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das auf der Erde kriecht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Der Piel von ברך bezeichnet hier das wirksame Schenken von Segen. „Segnete“ ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form steht hier mit einem Verb im Singular und bezeichnet im Zusammenhang von Genesis 1 den einen Gott.
- source_word: פְּרוּ
  choice: Seid fruchtbar
  rationale: Der Imperativ fordert Fruchtbarkeit beziehungsweise Nachkommenschaft. Die geläufige Wendung bewahrt das Bild und bleibt verständlich.
- source_word: וּרְבוּ
  choice: vermehrt euch
  rationale: רבה bezeichnet hier die zahlenmäßige Zunahme. Die reflexive deutsche Form ist in diesem Zusammenhang idiomatisch.
- source_word: וּמִלְאוּ
  choice: füllt
  rationale: מלא bedeutet „füllen“; die knappe Wiedergabe entspricht dem direkten Imperativ des Hebräischen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im universalen Schöpfungszusammenhang von Genesis 1 ist die ganze Erde gemeint, nicht ein begrenztes Landgebiet.
- source_word: וְכִבְשֻׁהָ
  choice: unterwerft sie
  rationale: כבש bezeichnet ein starkes Unterwerfen beziehungsweise Unter-Kontrolle-Bringen. Die Übersetzung bewahrt diese Stärke, ohne darüber hinaus eine ausbeuterische Deutung einzutragen.
- source_word: וּרְדוּ
  choice: Herrscht über
  rationale: רדה bezeichnet die Ausübung von Herrschaft. „Herrscht über“ ist direkt, gegenwärtig und wahrt den Autoritätscharakter des Verbs.
- source_word: בִּדְגַת הַיָּם
  choice: die Fische im Meer
  rationale: Der Ausdruck nennt konkret die Fische des Meeres. „Im Meer“ ist im Deutschen natürlicher als die formale Konstruktion „des Meeres“.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: die Vögel am Himmel
  rationale: עוֹף bezeichnet hier am natürlichsten Vögel; שָׁמַיִם ist in diesem Zusammenhang der Himmel beziehungsweise Luftraum.
- source_word: בְכָל חַיָּה
  choice: jedes Lebewesen
  rationale: חַיָּה kann ein Tier oder allgemeiner ein lebendes Geschöpf bezeichnen. „Jedes Lebewesen“ wahrt hier die Breite des Ausdrucks.
- source_word: הָרֹמֶשֶׂת
  choice: das sich ... bewegt
  rationale: רמש bezeichnet Bewegung auf oder nahe dem Boden und kann auch mit „kriechen“ wiedergegeben werden. „Sich bewegen“ hält den Bezug weiter und vermeidet eine unnötige Verengung auf Kriechtiere.
theological_decisions:
- issue: Stärke des menschlichen Auftrags gegenüber der Schöpfung in כבש und רדה
  choice: Die starken Herrschaftsverben werden mit „unterwerft“ und „herrscht über“ wiedergegeben.
  alternative: „Pflegt sie“, „sorgt für sie“ oder „verwaltet sie“
  rationale: Die weicheren Alternativen bringen zwar mögliche ethische Folgerungen zum Ausdruck, entsprechen aber nicht unmittelbar der Stärke der hebräischen Verben. Die Übersetzung deutet die Herrschaft weder als Ausbeutung noch schwächt sie sie zu bloßer Fürsorge ab.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der universale Schöpfungsbericht erfordert hier den globalen Sinn; ein bestimmtes Territorium ist nicht im Blick.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Nennung Gottes wurde entsprechend dem hebräischen Satzbau beibehalten. Die Imperative bleiben knapp und kraftvoll; traditionelle Wendungen werden nur dort verwendet, wo sie heute noch unmittelbar verständlich sind.
