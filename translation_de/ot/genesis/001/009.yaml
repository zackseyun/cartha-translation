  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: de
  text: 'Und Gott sprach: »Das Wasser unter dem Himmel[a] soll sich an einem einzigen Ort sammeln, und das trockene Land soll sichtbar werden.« Und so geschah es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann hier auch den sichtbaren Himmel beziehungsweise den Himmelsraum meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Und … sprach“ bewahrt den fortlaufenden Erzählstil; „sprach“ entspricht dem würdevollen Register des Schöpfungsberichts.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier zusammen mit dem Verb im Singular den einen Schöpfergott.
- source_word: יִקָּווּ הַמַּיִם
  choice: Das Wasser … soll sich … sammeln
  rationale: Der Jussiv drückt Gottes Anordnung aus. Obwohl מַיִם im Hebräischen der Form nach pluralisch ist, ist „das Wasser“ im modernen Standarddeutsch die natürliche Sammelbezeichnung; die reflexive Form gibt das Zusammenströmen treffend wieder.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: unter dem Himmel
  rationale: Die Wendung bezeichnet den Ort des Wassers unterhalb des Himmels. „Himmel“ ist im Deutschen idiomatisch und kann wie das hebräische שָׁמַיִם sowohl den sichtbaren Himmel als auch die Himmelssphäre bezeichnen.
- source_word: אֶל מָקוֹם אֶחָד
  choice: an einem Ort
  rationale: Die Formulierung gibt die gerichtete Sammlung zu einem einzigen Ort natürlich wieder, ohne אֶחָד auszulassen.
- source_word: וְתֵרָאֶה הַיַּבָּשָׁה
  choice: und das trockene Land soll sichtbar werden
  rationale: Der zweite Jussiv setzt Gottes Anordnung fort. „Sichtbar werden“ bildet die passive Bedeutung des Nifal genauer ab als eine Formulierung, die ausdrücklich ein aktives Hervortreten nahelegt.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die wiederkehrende Formel bestätigt die Ausführung des göttlichen Befehls. Diese deutsche Wendung ist prägnant, natürlich und dem feierlichen Erzählstil angemessen.
theological_decisions:
- issue: Kosmologische Bedeutung von שָׁמַיִם
  choice: Himmel
  alternative: sichtbarer Himmel / Himmelsraum
  rationale: Die Übersetzung „Himmel“ wahrt die Bedeutungsbreite des hebräischen Ausdrucks und legt kein über den Text hinausgehendes kosmologisches Modell fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die Syntax bleibt nah an der parallelen Befehlsstruktur des Hebräischen, ohne unnatürliche hebräische Pluralformen ins Deutsche zu übertragen.
