  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: de
  text: Wenn du Gutes tust, wird dann nicht dein Gesicht erhoben?[a] Wenn du aber nicht Gutes tust, kauert die Sünde an der Tür.[b] Ihr Verlangen richtet sich auf dich,[c] doch du sollst über sie herrschen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gibt es dann nicht ein Erheben?“ Gemeint sein kann, dass Kains Gesicht erhoben wird oder dass er Annahme findet.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ein Sündopfer liegt an der Tür.“ Das unmittelbare Bild spricht jedoch eher von der Sünde als einem kauernden Tier.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Ihr Begehren“ bzw. „ihr Drang“. Vergleiche die ähnliche Formulierung in Genesis 3,16.'
    reason: cross_reference
  - marker: d
    text: 'Auch möglich: „Du wirst über sie herrschen“ oder „du kannst über sie herrschen“. Das Hebräische kann als Aufforderung, Vorhersage oder Möglichkeit verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: Gutes tun
  rationale: Das Hifil von יטב bezeichnet hier rechtes bzw. gutes Handeln. „Gutes tun“ ist natürliches modernes Deutsch und bewahrt die knappe Bedingungsstruktur.
- source_word: שְׂאֵת
  choice: dein Blick wird erhoben
  rationale: שׂאת bedeutet wörtlich „Erheben/Aufheben“. Im Zusammenhang mit Kains zuvor gesenktem Gesicht liegt das Erheben seines Blicks bzw. Gesichts nahe; die Formulierung hält den konkreten Bildbezug fest, ohne die mögliche Bedeutung „Annahme“ auszuschließen.
- source_word: לַפֶּתַח
  choice: vor der Tür
  rationale: Die Wendung bezeichnet den Ort an der Tür bzw. am Eingang. „Vor der Tür“ klingt im Deutschen natürlich und bewahrt das bedrohliche Schwellenbild.
- source_word: חַטָּאת
  choice: die Sünde
  rationale: חטאת kann „Sünde“ oder „Sündopfer“ bedeuten. Das Partizip „lauert/kauert“ und der folgende Herrschaftskonflikt sprechen hier eher für personifizierte Sünde.
- source_word: רֹבֵץ
  choice: lauert
  rationale: Das Partizip beschreibt ein Tier, das sich niederkauert oder daliegt. „Lauert“ vermittelt im Deutschen knapp die im Kontext naheliegende drohende Raubtiermetapher.
- source_word: תְּשׁוּקָתוֹ
  choice: ihr Verlangen
  rationale: Das Substantiv bezeichnet Verlangen oder Begehren. Das feminine Pronomen bezieht sich im Deutschen auf „die Sünde“; „Verlangen“ bewahrt außerdem die sprachliche Verbindung zu Genesis 3,16.
- source_word: תִּמְשָׁל בּוֹ
  choice: du sollst über sie herrschen
  rationale: Das Imperfekt kann Aufforderung, Vorhersage oder Möglichkeit ausdrücken. Im warnenden Kontext gibt „sollst“ den mahnenden Sinn wieder, ohne einen sicheren künftigen Erfolg oder eine ausdrückliche Fähigkeitsaussage festzulegen.
theological_decisions:
- issue: Ob der Schlusssatz Kain die Herrschaft über die Sünde gebietet, vorhersagt oder als Möglichkeit zuspricht
  choice: „du sollst über sie herrschen“ als mahnende Aufforderung
  alternative: „du wirst über sie herrschen“ oder „du kannst über sie herrschen“
  rationale: Das hebräische Imperfekt lässt diese Nuancen offen. Der Zusammenhang ist eine göttliche Warnung und Mahnung; deshalb steht die Aufforderung im Haupttext, während die anderen Möglichkeiten in der Fußnote erhalten bleiben.
- issue: Ob חַטָּאת personifizierte Sünde oder ein Sündopfer bezeichnet
  choice: personifizierte „Sünde“, die vor der Tür lauert
  alternative: „ein Sündopfer liegt vor der Tür“
  rationale: Die Tiermetapher des Kauernden/Lauernden sowie das Verlangen und Beherrschen passen unmittelbarer zur personifizierten Sünde. Die lexikalisch mögliche Opferdeutung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Verbindung zum in Vers 6 gesenkten Gesicht wird mit „dein Blick ... erhoben“ sichtbar gemacht. Die personifizierte Sünde wird wegen ihres grammatischen Geschlechts im Deutschen mit „ihr/sie“ aufgenommen. Die umstrittenen Lesarten werden in Fußnoten bewahrt.
