id: GEN.4.4
reference: Genesis 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: de
  text: Auch Abel brachte einige von den Erstgeborenen seiner Herde und von deren Fettstücken[a]. Jahwe sah Abel und seine Opfergabe wohlwollend an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihrem Fett“; gemeint sind wahrscheinlich die wertvollen Fettstücke der dargebrachten Tiere.'
    reason: Kulturelle und lexikalische Erläuterung des opfersprachlichen Ausdrucks.
  - marker: b
    text: 'Oder: „Jahwe wandte sich Abel und seiner Opfergabe zu.“ Der hebräische Ausdruck bezeichnet hier eine wohlwollende Beachtung, ohne zu sagen, wie sie erkennbar wurde.'
    reason: Lexikalische Alternative und Bewahrung der Offenheit hinsichtlich der göttlichen Reaktion.
lexical_decisions:
- source_word: וְהֶבֶל
  choice: Auch Abel
  rationale: Das narrative וְ verbindet den Satz mit dem Vorhergehenden; zusammen mit גַם הוּא hebt es hervor, dass auch Abel eine Gabe brachte.
- source_word: הֵבִיא
  choice: brachte
  rationale: Der Hifil von בוא bedeutet hier im Zusammenhang einer Opfer- oder Gabenhandlung schlicht „bringen“.
- source_word: גַם הוּא
  choice: auch
  rationale: Die Wendung betont, dass Abel ebenso wie Kain eine Opfergabe brachte; „auch“ gibt dies natürlich wieder.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: einige von den Erstgeborenen seiner Herde
  rationale: 'Die Präposition מִן ist hier partitiv: Abel brachte Tiere aus der Gruppe der Erstgeborenen, nicht notwendig sämtliche Erstgeburt seiner Herde.'
- source_word: וּמֵחֶלְבֵהֶן
  choice: und von deren Fettstücken
  rationale: חֵלֶב bezeichnet wörtlich Fett und im Opferzusammenhang besonders die als Opferteile bestimmten Fettstücke. Die Formulierung bewahrt den konkreten kultischen Sinn.
- source_word: וַיִּשַׁע
  choice: sah … wohlwollend an
  rationale: Das Verb bezeichnet ein aufmerksames, im Kontext günstiges Hinsehen oder Sichzuwenden. Die Formulierung macht die positive Reaktion deutlich, ohne sie mit einem bestimmten sichtbaren Zeichen zu erklären.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: Abel und seine Opfergabe
  rationale: Das wiederholte אֶל bezieht die göttliche Zuwendung ausdrücklich sowohl auf Abel als auch auf seine Gabe. Beim deutschen Verb „ansehen“ stehen beide natürlich als direkte Objekte.
- source_word: מִנְחָתוֹ
  choice: seine Opfergabe
  rationale: מִנְחָה kann Gabe, Tribut oder Opfergabe bedeuten; im unmittelbaren gottesdienstlichen Zusammenhang ist „Opfergabe“ klar und angemessen.
theological_decisions:
- issue: Art der göttlichen Reaktion in וַיִּשַׁע
  choice: Jahwe sah Abel und seine Opfergabe wohlwollend an.
  alternative: Jahwe wandte sich Abel und seiner Opfergabe zu.
  rationale: Der hebräische Text beschreibt eine günstige Zuwendung, nennt jedoch weder deren sichtbare Form noch den genauen Grund dafür. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erstgeborene“ und „Opfergabe“ sind allgemein verständlich und bewahren den kultischen Zusammenhang; „Fettstücke“ wird wegen möglicher kultureller Unklarheit erläutert.
