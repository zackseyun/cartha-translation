  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: de
  text: Und Kain sagte zu seinem Bruder Abel.[a] Als sie dann auf dem Feld waren, erhob sich Kain gegen seinen Bruder Abel und tötete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische hebräische Text enthält nach „Kain sagte zu seinem Bruder Abel“ keine weiteren Worte. Alte Textzeugen, darunter die Septuaginta, der samaritanische Pentateuch und die Vulgata, ergänzen sinngemäß: „Lass uns aufs Feld gehen.“'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und Kain sagte
  rationale: אמר bedeutet gewöhnlich „sagen“. Die knappe Wiedergabe folgt dem masoretischen Wortlaut, auch wenn der Inhalt der Rede dort fehlt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Rede auf Abel; „zu“ bildet dies unmittelbar ab.
- source_word: אָחִיו
  choice: seinem Bruder
  rationale: Die zweimalige Wiedergabe bewahrt die erzählerische Betonung darauf, dass Kain seinen eigenen Bruder tötet.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Als sie dann … waren
  rationale: Die Konstruktion eröffnet einen zeitlichen Erzählrahmen. „Als … dann“ ist im modernen Deutschen natürlich und hält den Fortgang der Handlung fest.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שָׂדֶה bezeichnet ein Feld oder offenes Gelände; „auf dem Feld“ ist hier die geläufige deutsche Formulierung.
- source_word: וַיָּקָם ... אֶל
  choice: erhob sich … gegen
  rationale: Die Wendung wahrt das hebräische Bild feindlichen Aufstehens, ohne es deutend auf „griff an“ zu verengen.
- source_word: וַיַּהַרְגֵהוּ
  choice: tötete ihn
  rationale: הרג bedeutet „töten“. „Ermordete“ würde die rechtlich-moralische Einordnung stärker aussprechen als das Verb selbst.
theological_decisions:
- issue: Ob die in alten Textzeugen überlieferten Worte Kains in den Haupttext aufgenommen werden
  choice: Dem vorgelegten masoretischen Text folgen und keinen Redeinhalt ergänzen; die Variante in einer Fußnote ausweisen
  alternative: „Lass uns aufs Feld gehen.“ in den Haupttext aufnehmen
  rationale: Der hebräische Hauptzeuge bietet nur die Redeeinleitung ohne Inhalt. Mehrere alte Zeugen bewahren jedoch einen wahrscheinlich ausgefallenen Satz. Die kürzere Lesart bleibt im Haupttext erhalten, während die Fußnote die bedeutsame Textvariante transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bezeichnung Abels als Bruder und das hebräische Bild „erhob sich … gegen“ bleiben erhalten. Die abrupte Redeeinleitung des masoretischen Textes wird nicht stillschweigend geglättet.
