base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: de
  text: 'Da sagte Jahwe zu ihm: „Darum wird an jedem, der Kain tötet, siebenfache Rache genommen.[a]“ Und Jahwe gab Kain ein Zeichen[b], um zu verhindern, dass ihn jemand, der ihn fand, schlug.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „er wird siebenfach gerächt“. Das hebräische Passiv ist knapp und nennt nicht, wer die Vergeltung ausführt; im Zusammenhang richtet sich die Warnung gegen jeden, der Kain tötet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Mal“. Das hebräische Wort kann allgemein ein Zeichen oder Kennzeichen bezeichnen; welche Form es hatte, sagt der Text nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH in der im Deutschen gebräuchlichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לָכֵן
  choice: Darum
  rationale: Bewahrt den folgernden Anschluss und klingt in direkter Rede natürlich.
- source_word: כָּל הֹרֵג קַיִן
  choice: Wer Kain tötet
  rationale: Gibt die allgemein-indefinite Aussage idiomatisch und mit ihrem umfassenden Geltungsbereich wieder.
- source_word: שִׁבְעָתַיִם
  choice: siebenfache
  rationale: Bezeichnet das siebenfache Maß der angekündigten Vergeltung knapp und verständlich.
- source_word: יֻקָּם
  choice: an dem wird … Rache genommen
  rationale: Bewahrt das hebräische Passiv und verdeutlicht durch den Rückbezug, dass die Vergeltung denjenigen trifft, der Kain tötet.
- source_word: אוֹת
  choice: Zeichen
  rationale: Das Wort bezeichnet allgemein ein Zeichen; der Text legt weder dessen Gestalt noch ausdrücklich eine körperliche Kennzeichnung fest.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: damit niemand … ihn erschlug
  rationale: Gibt die negative Absicht idiomatisch wieder. נכה kann 'schlagen' bedeuten, bezeichnet in diesem Zusammenhang jedoch naheliegend ein tödliches Erschlagen.
- source_word: כָּל מֹצְאוֹ
  choice: niemand, der ihn fand
  rationale: Verbindet den universalen Ausdruck natürlich mit der verneinten Zweckangabe.
theological_decisions:
- issue: Art des Kain gegebenen Zeichens
  choice: Zeichen, ohne seine Form näher zu bestimmen
  alternative: Mal oder Kennzeichen
  rationale: Der hebräische Text nennt lediglich ein אוֹת und erlaubt keine sichere Aussage darüber, ob es körperlich sichtbar war oder welche Gestalt es hatte.
- issue: Empfänger der siebenfachen Vergeltung
  choice: Die Vergeltung trifft denjenigen, der Kain tötet
  alternative: Die kompakte Wiedergabe „er wird siebenfach gerächt“
  rationale: Das hebräische Passiv ist knapp, doch der Zusammenhang macht die Warnung an einen möglichen Töter Kains deutlich. Die deutsche Formulierung erhält das Passiv, ohne einen missverständlichen Bezug zu schaffen.
- issue: Bedeutung von נכה im Schlusssatz
  choice: erschlagen
  alternative: schlagen oder verletzen
  rationale: Das Verb hat einen breiten Bedeutungsbereich. Angesichts von Kains Furcht, getötet zu werden, ist hier tödliche Gewalt naheliegend; die Fußnote hält die lexikalisch weitere Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; „Rache nehmen“ bildet נקם sachgerecht ab. „Jahwe“ bewahrt den Eigennamen. Die Fußnoten markieren echte sprachliche Alternativen, ohne über die Beschaffenheit des Zeichens zu spekulieren.
