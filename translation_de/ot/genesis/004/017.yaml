base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: de
  text: Kain erkannte seine Frau[a], und sie wurde schwanger und gebar Henoch. Er baute gerade eine Stadt[b] und benannte sie nach seinem Sohn Henoch[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Erkannte« ist hier eine hebräische Umschreibung für Geschlechtsverkehr.
    reason: cultural_note
  - marker: b
    text: 'Die hebräische Form stellt den Städtebau als andauernden Vorgang dar; auch möglich: »Er baute eine Stadt.«'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung lautet wörtlich: »Er rief den Namen der Stadt entsprechend dem Namen seines Sohnes.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: schlief mit
  rationale: Das hebräische Verb bedeutet wörtlich »erkannte«, ist hier jedoch eine geläufige Umschreibung für Geschlechtsverkehr. »Schlief mit« gibt den Sinn in natürlichem, heutigem Deutsch wieder; die wörtliche Ausdrucksweise wird in einer Fußnote genannt.
- source_word: אִשְׁתּוֹ
  choice: seiner Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; mit dem Possessivsuffix ist »seiner Frau« hier die natürliche Wiedergabe.
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: Die Form bezeichnet das Schwangerwerden. Ein eigener deutscher Satz bildet die hebräische Erzählfolge klar und natürlich ab.
- source_word: וַתֵּלֶד אֶת חֲנוֹךְ
  choice: und brachte Henoch zur Welt
  rationale: יָלַד bedeutet hier »gebären«. »Zur Welt bringen« ist in modernem Deutsch verständlich und würdig.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: Der Personenname wird entsprechend der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Kain war dabei, eine Stadt zu bauen
  rationale: Die Verbindung von היה mit dem Partizip בֹּנֶה stellt den Bau als andauernden Vorgang dar. »War dabei ... zu bauen« bewahrt diesen progressiven Aspekt, ohne einen bereits vollendeten Bau zu behaupten. Der Name Kain wird zur eindeutigen und natürlichen deutschen Satzführung wiederholt.
- source_word: עִיר
  choice: Stadt
  rationale: »Stadt« ist die reguläre Bedeutung von עִיר; Größe oder Entwicklungsstand der Siedlung werden dadurch nicht näher festgelegt.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: und benannte sie nach seinem Sohn Henoch
  rationale: Die hebräische Wendung lautet wörtlich etwa »er nannte den Namen der Stadt nach dem Namen seines Sohnes«. Die gewählte idiomatische Form gibt den Sinn präzise und ohne schwerfällige Wiederholung wieder.
