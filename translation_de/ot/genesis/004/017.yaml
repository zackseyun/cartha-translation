translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Veraltetes oder im heutigen Deutsch missverständliches »erkannte seine Frau« steht nicht im Haupttext, bleibt aber in der Fußnote sichtbar. Die fortdauernde Aussage des hebräischen Partizips wird bewahrt; die doppelte Namensformel wird im Haupttext idiomatisch geglättet.
