  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: de
  text: Auch Set wurde ein Sohn geboren, und er gab ihm den Namen Enos. Damals begann man, den Namen Jahwes anzurufen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Damals wurde begonnen, den Namen Jahwes anzurufen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Eine Minderheitsdeutung versteht die Wendung anders: »Damals begann man, den Namen Jahwes zu entweihen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא
  choice: Auch Set
  rationale: Die Formulierung gibt die additive Aussage von גַּם und Set als Bezugsperson der Geburt natürlich wieder; הוּא verstärkt hier den Bezug auf Set.
- source_word: יֻלַּד בֵּן
  choice: wurde ein Sohn geboren
  rationale: Das Passiv bewahrt die Form des hebräischen Hofal und ist zugleich idiomatisches Deutsch.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: und er gab ihm den Namen Enos
  rationale: Die deutsche Namensgebungsformel gibt das hebräische »er nannte seinen Namen« natürlich und eindeutig wieder. Enos entspricht der im Deutschen geläufigen Form des Eigennamens אֱנוֹשׁ.
- source_word: אָז
  choice: Damals
  rationale: Das Adverb drückt den zeitlichen Bezug knapp und natürlich aus.
- source_word: הוּחַל
  choice: begann man
  rationale: Das unpersönliche deutsche »man« gibt die übliche inchoative Deutung des hebräischen Passivs idiomatisch wieder, ohne eine bestimmte Personengruppe zu benennen. Die wörtlichere Passivform und die abweichende Deutung »entweihen« werden in den Fußnoten bewahrt.
- source_word: לִקְרֹא בְּשֵׁם
  choice: den Namen … anzurufen
  rationale: Die Wendung קרא בשם bezeichnet in diesem Zusammenhang am ehesten die kultische oder gebetartige Anrufung; die deutsche Form bewahrt den Bezug auf den Namen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird in seiner im Deutschen geläufigen Umschrift wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Deutung von הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: Damals begann man, den Namen Jahwes anzurufen.
  alternative: Damals begann man, den Namen Jahwes zu entweihen.
  rationale: Die inchoative Deutung von הוּחַל und die Bedeutung »anrufen« für קרא בשם passen zum üblichen Sprachgebrauch. Da die Form auch von der Wurzel חלל im Sinn von »entweihen« her verstanden worden ist, bleibt diese Minderheitsdeutung ausdrücklich in einer Fußnote erhalten.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Gottesname יְהוָה. Die Umschrift erhält den Eigennamen, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax ist flüssig, bewahrt aber das Passiv der Geburtsnotiz. Die beiden Fußnoten stehen an der umstrittenen Schlussaussage, auf die sie sich tatsächlich beziehen.
