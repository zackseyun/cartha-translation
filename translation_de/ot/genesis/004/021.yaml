id: GEN.4.21
reference: Genesis 4:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: de
  text: Sein Bruder hieß Jubal. Er war der Vater[a] aller, die Leier und Flöte spielen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater“ kann hier Stammvater, Wegbereiter oder Begründer bedeuten; nicht unbedingt den unmittelbaren leiblichen Vater jedes Musikers.
    reason: cultural_note
  - marker: b
    text: Das mit „Flöte“ wiedergegebene hebräische Wort bezeichnet ein nicht sicher bestimmbares antikes Blasinstrument; möglich sind auch „Pfeife“ oder „Rohrflöte“. Das Verb „spielen“ bedeutet wörtlich „ergreifen“ oder „handhaben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו יוּבָל
  choice: Sein Bruder hieß Jubal
  rationale: Gibt die hebräische Namensformel in natürlichem modernem Deutsch wieder; das einleitende וְ setzt die Erzählung fort, muss hier aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: הוּא הָיָה
  choice: Er wurde
  rationale: היה kann hier im Zusammenhang mit der Entstehung kultureller Gruppen als „wurde“ verstanden werden; die Formulierung bleibt eng am hebräischen Prädikat.
- source_word: אֲבִי כָּל
  choice: der Vater all derer
  rationale: Bewahrt das hebräische Bild. Gemeint sein kann der Stammvater, Wegbereiter oder Begründer einer Gruppe, nicht zwingend die unmittelbare biologische Vaterschaft.
- source_word: תֹּפֵשׂ
  choice: spielen
  rationale: Das Partizip bedeutet wörtlich „ergreifen/handhaben“, bezeichnet bei Musikinstrumenten im Kontext jedoch deren Spielen.
- source_word: כִּנּוֹר
  choice: Leier
  rationale: „Leier“ ist organologisch genauer als die traditionelle Wiedergabe „Harfe“.
- source_word: עוּגָב
  choice: Flöte
  rationale: Bezeichnet wahrscheinlich ein Blasinstrument; seine genaue antike Bauart ist unsicher. „Flöte“ ist im Deutschen verständlich, ohne eine völlig sichere Identifizierung zu behaupten.
theological_decisions:
- issue: Bedeutung von אֲבִי („Vater von“)
  choice: Das Bild „Vater all derer“ bleibt im Haupttext erhalten.
  alternative: „Begründer“ oder „Wegbereiter“
  rationale: Die bildhafte und möglicherweise genealogische Spannung des Hebräischen soll nicht im Haupttext auf eine einzige Deutung festgelegt werden; eine Fußnote erläutert den erweiterten Sinn.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die hebräische Vater-Metapher bleibt erhalten; die Instrumentenbezeichnungen werden verständlich, aber mit Hinweis auf die sachliche Unsicherheit wiedergegeben.
