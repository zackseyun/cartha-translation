source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: de
  text: 'Da sagte Jahwe zu Kain: „Wo ist dein Bruder Abel?“ Er sagte: „Ich weiß es nicht.[a] Bin ich der Hüter meines Bruders?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich wusste es nicht.“ Die hebräische Perfektform kann als Verneinung in der Vergangenheit wiedergegeben werden; im Zusammenhang wirkt sie jedoch natürlich als gegenwärtige Behauptung, nichts zu wissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: וַיֹּאמֶר
  choice: Da sagte / Er sagte
  rationale: Die Erzählform führt die Handlung weiter. „Da“ gibt dies am Versanfang natürlich wieder; beim zweiten Vorkommen genügt im Deutschen „Er sagte“.
- source_word: אֵי
  choice: Wo ist
  rationale: Das Ortsfragewort verlangt im natürlichen Deutschen hier die Ergänzung der Kopula.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Das hebräische Substantiv und das Suffix sind maskulin singular und werden genau wiedergegeben.
- source_word: לֹא יָדַעְתִּי
  choice: Ich weiß es nicht
  rationale: Obwohl die hebräische Perfektform formal auch vergangen wiedergegeben werden kann, ist sie im Dialog am natürlichsten als gegenwärtige Behauptung fehlender Kenntnis zu verstehen; die Alternative bleibt in der Fußnote erhalten.
- source_word: הֲשֹׁמֵר
  choice: der Hüter
  rationale: Das Partizip von שמר bezeichnet jemanden, der bewacht, behütet oder achtgibt. „Hüter“ bewahrt die knappe, rhetorische und traditionsprägende Formulierung, ohne die Verantwortung näher auszudeuten.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen trägt Nachdruck; im Deutschen vermittelt bereits die rhetorische Frage „Bin ich …?“ diesen Akzent natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von Kains rhetorischer Frage
  choice: Bin ich der Hüter meines Bruders?
  alternative: Muss ich auf meinen Bruder aufpassen?
  rationale: Die substantivische und offene Form des Hebräischen wird beibehalten. So wird weder ausdrücklich eine Pflicht geleugnet noch eine bestimmte Deutung von Verantwortung in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählführung. Die bekannte Wendung „Hüter meines Bruders“ bleibt erhalten; Satzbau und Zeichensetzung sind zugleich gegenwärtig und gut verständlich.
