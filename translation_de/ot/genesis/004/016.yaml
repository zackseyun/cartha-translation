id: GEN.4.16
reference: Genesis 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: de
  text: Da ging Kain weg vom Angesicht Jahwes und ließ sich im Land Nod[a], östlich von Eden, nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Nod klingt im Hebräischen an das Wort für „unstetes Umherziehen“ an und erinnert damit an Kains zuvor angekündigtes Schicksal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … weg
  rationale: Die Form von יצא bezeichnet ein Hinaus- bzw. Weggehen. „ging … weg“ ist im modernen Deutschen natürlich und bewahrt den konkreten Bewegungssinn.
- source_word: מִלִּפְנֵי
  choice: vom Angesicht
  rationale: Die hebräische Wendung bedeutet wörtlich „von vor dem Angesicht“. „vom Angesicht“ bewahrt ihre räumlich-relationale Bildhaftigkeit und vermeidet eine vorschnelle Deutung als völlige Abwesenheit Gottes.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und hier entsprechend dem deutschen Satzbau im Genitiv verwendet, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: ישב kann „sitzen“, „wohnen“ oder „sich niederlassen“ bedeuten. Im Zusammenhang bezeichnet es die Aufnahme eines Wohnsitzes; „ließ sich nieder“ ist dafür natürlich und präzise.
- source_word: בְּאֶרֶץ נוֹד
  choice: im Land Nod
  rationale: Nod ist hier ein Ortsname und wird deshalb transliteriert. Der mögliche Anklang an das hebräische Wort für unstetes Umherziehen wird in einer Fußnote erläutert.
- source_word: קִדְמַת עֵדֶן
  choice: östlich von Eden
  rationale: Die Wendung lokalisiert das Land in östlicher Richtung von Eden. „östlich von Eden“ ist knapp, idiomatisch und gibt den Richtungssinn wieder.
- source_word: עֵדֶן
  choice: Eden
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben.
theological_decisions:
- issue: Wie Kains Weggang in seinem Verhältnis zu Gott wiederzugeben ist
  choice: ging Kain weg vom Angesicht Jahwes
  alternative: ging Kain aus der Gegenwart Jahwes fort
  rationale: „vom Angesicht Jahwes“ bleibt näher an der hebräischen Bildsprache und wahrt die Spannung zwischen räumlichem Weggang und relationaler Entfremdung, ohne eine absolute Entfernung aus Gottes Gegenwart zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die bewusst etwas bildhafte Wendung „vom Angesicht Jahwes“ erhält das hebräische Ausdrucksbild; der übrige Satz ist natürlich und gut verständlich formuliert.
