source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: de
  text: Sieh, heute hast du mich vom Erdboden vertrieben, und vor deinem Angesicht werde ich verborgen sein.[a] Ich werde ein Wanderer und Flüchtling auf der Erde sein,[b] und jeder, der mich findet, wird mich töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde mich vor deinem Angesicht verbergen“; sinngemäß auch: „Ich werde deiner Gegenwart entzogen sein.“ Das Hebräische kann hier passiv oder reflexiv verstanden werden und lautet wörtlich „vor deinem Angesicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Land“. Das hebräische אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Diskurspartikel lenkt nachdrücklich die Aufmerksamkeit auf Kains Lage. „Sieh“ ist unmittelbar, würdig und im heutigen Deutsch verständlich.
- source_word: גֵּרַשְׁתָּ
  choice: hast du mich … vertrieben
  rationale: גרשׁ bezeichnet ein gewaltsames Fort- oder Ausweisen. „Vertrieben“ bewahrt diese Stärke und klingt natürlich.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: von der Oberfläche des Erdbodens
  rationale: Die Wendung bedeutet wörtlich „von der Fläche/dem Angesicht des Erdbodens“. „Oberfläche des Erdbodens“ erhält das räumliche Bild und den Bezug zu dem zuvor verfluchten Boden, ohne im Deutschen unverständlich zu wirken.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: vor deinem Angesicht werde ich verborgen sein
  rationale: Der Nifal lässt eine passive oder reflexive Nuance zu. Die Hauptfassung wahrt sowohl das konkrete hebräische Bild vom „Angesicht“ als auch die offene Frage, ob Kain verborgen wird oder sich verbirgt.
- source_word: נָע וָנָד
  choice: ruhelos und unstet
  rationale: Das Wortpaar beschreibt ein nicht sesshaftes, umhergetriebenes Dasein. Die zwei deutschen Adjektive erhalten die Paarung, ohne sie zu einem einzigen Begriff zusammenzuziehen.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der weitere Sinn passt zum urgeschichtlichen Rahmen; die örtlichere Alternative wird in der Fußnote bewahrt.
- source_word: כָל מֹצְאִי
  choice: jeder, der mich findet
  rationale: כָל mit Partizip bezeichnet hier eine unbestimmte Gesamtheit. Die gewählte Form ist idiomatisches Deutsch und erhält den offenen Sinn.
- source_word: יַהַרְגֵנִי
  choice: wird mich töten
  rationale: הרג ist das gewöhnliche Verb für „töten“. Die schlichte moderne Wiedergabe entspricht dem direkten Ausdruck des Hebräischen.
theological_decisions:
- issue: Gottesgegenwart und die passive beziehungsweise reflexive Bedeutung von וּמִפָּנֶיךָ אֶסָּתֵר
  choice: vor deinem Angesicht werde ich verborgen sein
  alternative: ich werde mich vor deinem Angesicht verbergen / ich werde deiner Gegenwart entzogen sein
  rationale: Das konkrete Bild des göttlichen Angesichts trägt die relationale und theologische Schwere der Entfremdung, ohne „Angesicht“ vorschnell als abstrakte „Gegenwart“ auszulegen. Zugleich wird die grammatische Spannung zwischen passivem und reflexivem Verständnis nicht beseitigt; die Alternativen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Erdboden und Angesicht bleibt erhalten; ungebräuchlichere altertümliche Formen werden vermieden. Die parallelen Begriffe „ruhelos und unstet“ geben die doppelte hebräische Charakterisierung knapp und verständlich wieder.
