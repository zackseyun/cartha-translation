  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: de
  text: Wenn du den Ackerboden bearbeitest,[a] wird er dir seine Kraft nicht mehr geben.[b] Rastlos und umherirrend[c] wirst du auf der Erde[d] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wenn du den Ackerboden bearbeitest“. Die hebräische Konjunktion kann hier kausal, temporal oder konditional verstanden werden; ausdrücklich konditional wäre auch „Falls du …“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird er nicht fortfahren, dir seine Kraft zu geben“. Gemeint ist die Ertragskraft des Bodens.'
    reason: lexical_alternative
  - marker: c
    text: 'Die beiden hebräischen Wörter sind bedeutungsnah und verstärken zusammen Kains ruhelosen, unbeständigen Zustand. Auch möglich: „rastlos und unstet“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „im Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion bezeichnet hier am natürlichsten den künftigen Umstand, unter dem sich das Urteil auswirkt. Möglich sind je nach syntaktischer Deutung auch eine kausale oder anders konditionale Wiedergabe.
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  choice: du den Ackerboden bearbeitest
  rationale: עבד bezeichnet hier das Bearbeiten oder Kultivieren des Bodens. „Ackerboden“ macht den landwirtschaftlichen Zusammenhang deutlich und wahrt zugleich die wiederkehrende Bedeutung von אֲדָמָה als Erdboden.
- source_word: לֹא תֹסֵף תֵּת
  choice: wird … nicht mehr geben
  rationale: Die Verbindung von יסף mit dem Infinitiv drückt aus, dass ein bisheriges Geben nicht fortgesetzt wird. Die deutsche Formulierung bildet das Idiom klar und nah am hebräischen Wortlaut ab.
- source_word: כֹּחָהּ
  choice: seine Kraft
  rationale: Die wörtliche Metapher bezeichnet die Ertragskraft des Bodens. „Kraft“ bewahrt das Bild, ohne es ausdrücklich auf „Ertrag“ oder „Fruchtbarkeit“ festzulegen.
- source_word: נָע וָנָד
  choice: rastlos und unstet … umherziehen
  rationale: Die beiden bedeutungsnahen Wörter verstärken Kains unbeständiges, ortloses Dasein. Die Wiedergabe erhält die Doppelung und formuliert sie zugleich in verständlichem Deutsch.
- source_word: בָאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im urgeschichtlichen Zusammenhang ist „Erde“ passend, ohne eine rein örtlich begrenzte Verbannung festzuschreiben.
theological_decisions:
- issue: Tragweite von Kains Urteil
  choice: Das Urteil umfasst sowohl das Versagen des Ackerbodens als auch ein dauerhaft unbeständiges Leben.
  alternative: Nur innere Ruhelosigkeit oder ausschließlich eine geografisch begrenzte Verbannung.
  rationale: Der Vers nennt ausdrücklich beide Dimensionen. Die Übersetzung bewahrt ihre Verbindung, ohne spätere Lehrsysteme in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ackerboden“ hält den landwirtschaftlichen Bezug deutlich; „seine Kraft geben“ bewahrt die hebräische Metapher. „Unstet“ ist leicht gehoben, wird aber durch „rastlos“ und „umherziehen“ unmittelbar verständlich.
