source:
  edition: WLC
  text: וַ/יִּוָּלֵ֤ד לַֽ/חֲנוֹךְ֙ אֶת עִירָ֔ד וְ/עִירָ֕ד יָלַ֖ד אֶת מְחֽוּיָאֵ֑ל וּ/מְחִיּיָאֵ֗ל יָלַד֙ אֶת מְת֣וּשָׁאֵ֔ל וּ/מְתוּשָׁאֵ֖ל יָלַ֥ד אֶת לָֽמֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: de
  text: Dem Hanok wurde Irad geboren. Irad zeugte Mehujael[a], Mehujael zeugte Metuschael, und Metuschael zeugte Lamech.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen erscheint dieser Name in diesem Vers in zwei Schreibweisen: Mehujael und Mehijael.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: wurde geboren
  rationale: Der Niphal von ילד wird passiv wiedergegeben; die deutsche Konstruktion »Dem Hanok wurde Irad geboren« bewahrt sowohl die Verbform als auch die mit ל bezeichnete Elternbeziehung.
- source_word: לַחֲנוֹךְ
  choice: dem Hanok
  rationale: Das Präfix ל kennzeichnet hier den Vater, dem ein Sohn geboren wurde. Der Name wird unmittelbar aus dem Hebräischen als Hanok transliteriert.
- source_word: עִירָד
  choice: Irad
  rationale: Direkte, im Deutschen gut lesbare Transliteration des hebräischen Eigennamens.
- source_word: יָלַד
  choice: zeugte
  rationale: Im aktiven Qal bezeichnet ילד in dieser männlichen Genealogie das Zeugen. »Zeugte« ist knapp, präzise und im genealogischen Zusammenhang verständlich.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mehujael
  rationale: Der Vers bietet zwei Schreibweisen desselben Namens. Für einen flüssigen Haupttext wird die erste Form einheitlich verwendet; die zweite wird in einer Fußnote dokumentiert.
- source_word: מְתוּשָׁאֵל
  choice: Metuschael
  rationale: Hebräischnahe Transliteration mit deutscher Wiedergabe von שׁ als »sch«; ת wird hier als »t« wiedergegeben.
- source_word: לָמֶךְ
  choice: Lamech
  rationale: Die im Deutschen geläufige und zugleich hebräischnahe Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eröffnende Passivkonstruktion folgt bewusst der hebräischen Form; die anschließenden Glieder verwenden das natürliche genealogische Verb »zeugen«. Eigennamen werden möglichst hebräischnah und nach deutschen Lautkonventionen wiedergegeben.
