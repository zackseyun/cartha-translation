source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: de
  text: 'Da sagte er: »Was hast du getan? Die Stimme des Blutes[a] deines Bruders schreit zu mir vom Erdboden her.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »Blute«, eine Pluralform, die häufig im Zusammenhang mit Blutvergießen gebraucht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. »Da sagte er« klingt im Deutschen natürlich und markiert den Fortgang, ohne eine stärkere zeitliche Deutung einzutragen.
- source_word: מֶה עָשִׂיתָ
  choice: Was hast du getan?
  rationale: Das Perfekt gibt die abgeschlossene Tat mit ihrer gegenwärtigen Tragweite als direkte Anklage idiomatisch wieder.
- source_word: קוֹל
  choice: Die Stimme
  rationale: קוֹל kann »Stimme« oder »Laut« bedeuten. »Stimme« bewahrt hier die eindringliche Personifikation des vergossenen Blutes.
- source_word: דְּמֵי
  choice: des Blutes[a]
  rationale: Die hebräische Pluralform wird im Deutschen idiomatisch mit dem Massennomen »Blut« wiedergegeben; die formale Besonderheit wird in der Fußnote kenntlich gemacht.
- source_word: אָחִיךָ
  choice: deines Bruders
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich als nachgestellter Genitiv ausgedrückt.
- source_word: צֹעֲקִים
  choice: schreit
  rationale: Das hebräische Partizip steht wegen דְּמֵי formal im Plural. Da »Blut« im Deutschen Singular ist, folgt das Verb grammatisch im Singular; das Präsens erhält den andauernden, unmittelbar gegenwärtigen Ruf.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Richtung des Rufes auf Gott hin wird unmittelbar und ohne Zusatz wiedergegeben.
- source_word: מִן הָאֲדָמָה
  choice: vom Erdboden her
  rationale: אֲדָמָה bezeichnet in diesem Zusammenhang den bebauten beziehungsweise irdischen Boden. »Vom Erdboden her« bewahrt das für die Kain-Erzählung wichtige Bodenmotiv und gibt die Herkunft des Rufes natürlich wieder.
theological_decisions:
- issue: Personifikation des vergossenen Blutes Abels
  choice: Die bildhafte Aussage, dass die Stimme des Blutes selbst zu Gott schreit, bleibt im Haupttext erhalten.
  alternative: Die Wendung abstrakt als Ruf der Blutschuld nach Gerechtigkeit wiederzugeben.
  rationale: Der hebräische Text verwendet eine lebendige Personifikation. Sie trägt die moralische und theologische Spannung, ohne den Ruf auf eine einzelne dogmatische Erklärung festzulegen.
- issue: Bezug des Plurals דְּמֵי
  choice: Im Haupttext steht das übliche deutsche Singularwort »Blut«; der hebräische Plural wird in einer Fußnote dokumentiert.
  alternative: Wörtlich »Blute« oder deutend »Bluttaten« zu schreiben.
  rationale: Ein wörtlicher Plural wäre im modernen Deutschen unnatürlich, während »Bluttaten« bereits eine bestimmte Auslegung in den Text eintragen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Bild, während »vom Erdboden her« und die singularische Kongruenz einen natürlichen deutschen Ausdruck sichern.
