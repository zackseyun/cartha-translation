source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: de
  text: 'Adam schlief wieder mit seiner Frau. Sie gebar einen Sohn und gab ihm den Namen Set[a], denn sie sagte: »Gott hat mir anstelle Abels einen anderen Nachkommen bestimmt, weil Kain ihn getötet hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Set« klingt im Hebräischen ähnlich wie das hier verwendete Verb für »setzen, bestimmen«; damit entsteht ein Wortspiel.
    reason: Das hebräische Wortspiel zwischen שֵׁת und שָׁת lässt sich im Deutschen nicht zugleich natürlich und lautähnlich wiedergeben.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: schlief mit
  rationale: יָדַע ist hier die übliche hebräische Umschreibung für Geschlechtsverkehr. Das heutige deutsche »schlief mit« gibt den euphemistischen Sinn natürlich und verständlich wieder; »erkannte« wäre zwar formnäher, ist in dieser Bedeutung heute jedoch leicht missverständlich.
- source_word: אָדָם
  choice: Adam
  rationale: An dieser Stelle ist der Personenname gemeint, nicht die allgemeine Bezeichnung »der Mensch«.
- source_word: עוֹד
  choice: wieder
  rationale: Das Adverb kennzeichnet die erneute eheliche Vereinigung und wird im Deutschen natürlich mit »wieder« wiedergegeben.
- source_word: וַתֵּלֶד בֵּן
  choice: sie gebar einen Sohn
  rationale: Die knappe, würdevolle Formulierung entspricht ילד mit בֵּן und ist im modernen Standarddeutsch verständlich.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: gab ihm den Namen
  rationale: Die hebräische Namengebungsformel lautet wörtlich »rief seinen Namen«. Die gewählte deutsche Wendung gibt ihre Funktion idiomatisch wieder.
- source_word: שֵׁת
  choice: Set
  rationale: »Set« ist die im modernen deutschen Bibelgebrauch verbreitete Form des hebräischen Personennamens.
- source_word: שָׁת
  choice: hat … bestimmt
  rationale: Das Verb שִׁית bedeutet »setzen, stellen, bestimmen«. »Bestimmt« drückt hier Gottes Zuweisung eines anderen Nachkommen natürlich aus; die im Deutschen nicht nachbildbare Lautbeziehung zu Set wird in der Fußnote erklärt.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: זֶרַע bezeichnet wörtlich »Samen« und übertragen Nachkommenschaft beziehungsweise einen Nachkommen. Im unmittelbaren Zusammenhang ist der neugeborene Sohn gemeint; »Nachkommen« bewahrt zugleich den genealogischen Bedeutungsgehalt.
- source_word: תַּחַת
  choice: anstelle
  rationale: תַּחַת bezeichnet hier Ersatz beziehungsweise Stellvertretung, nicht eine räumliche Lage.
- source_word: הֲרָגוֹ
  choice: ihn getötet hat
  rationale: הרג ist das allgemeine Verb für »töten«. Die Übersetzung vermeidet das spezifischere »ermorden«, das den lexikalischen Umfang unnötig verengen würde.
theological_decisions:
- issue: Evas Deutung der Geburt Sets
  choice: Gott hat mir anstelle Abels einen anderen Nachkommen bestimmt
  alternative: Gott hat mir anstelle Abels einen anderen Nachkommen gesetzt/gegeben
  rationale: Die Formulierung bewahrt Gott als handelnden Geber und die Ersatzbeziehung zu Abel. »Bestimmt« liegt im Bedeutungsbereich von שִׁית, ohne eine über den Text hinausgehende Lehre über Sets Rolle einzutragen.
- issue: Wiedergabe der sexuellen Umschreibung
  choice: Adam schlief wieder mit seiner Frau
  alternative: Adam erkannte seine Frau wieder
  rationale: Das Hebräische verwendet eine konventionelle Umschreibung. »Schlief mit« wahrt den euphemistischen Charakter und ist für heutige Leser unmittelbar verständlich, während »erkannte« im modernen Deutsch ohne Vorkenntnis missverständlich wäre.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die sexuelle Umschreibung bleibt euphemistisch, wird aber nicht mit dem heute schwer verständlichen traditionellen »erkannte« wiedergegeben. Die Sätze folgen dem knappen Erzählstil des Hebräischen; das Namenswortspiel wird durch eine Fußnote sichtbar gemacht.
