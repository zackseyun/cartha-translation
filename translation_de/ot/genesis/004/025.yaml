  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: אָדָם als Eigenname, עוֹד als „wieder“, die sexuelle Umschreibung von ידע, die Geburt und Namengebung, die Ersatzrelation von תַּחַת sowie das allgemeine „töten“ für הרג. „Bestimmt“ liegt für שָׁת im möglichen Bedeutungsfeld von „setzen/zuweisen“ und ist hier im Zusammenhang der göttlichen Zuweisung eines Ersatznachkommens vertretbar.'
