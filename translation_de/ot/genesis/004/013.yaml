  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: de
  text: 'Da sagte Kain zu Jahwe: »Meine Schuld ist zu groß, als dass ich sie tragen könnte.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Strafe ist zu schwer, als dass ich sie tragen könnte.« Auch die Deutung »Meine Schuld ist zu groß, als dass sie vergeben werden könnte« ist möglich. Das hebräische Wort kann Schuld beziehungsweise Verfehlung oder deren Strafe bezeichnen; das Verb kann »tragen« und in bestimmten Zusammenhängen »vergeben« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die waw-konsekutive Erzählform führt den nächsten Vorgang ein. »Da sagte« gibt den Fortgang der Erzählung in natürlichem modernem Deutsch wieder.
- source_word: קַיִן
  choice: Kain
  rationale: Der Personenname folgt der etablierten deutschen Form.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; »zu« ist die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גָּדוֹל
  choice: zu groß
  rationale: Mit der folgenden Konstruktion מִנְּשֹׂא drückt das Adjektiv ein das Ertragbare überschreitendes Maß aus.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder die daraus folgende Strafe bezeichnen. »Schuld« bewahrt im Haupttext den moralischen Sinn, ohne die im Kontext mögliche Bedeutung »Strafe« auszuschließen; diese wird in der Fußnote genannt.
- source_word: מִנְּשֹׂא
  choice: als dass ich sie tragen könnte
  rationale: Die Präposition מִן bildet hier zusammen mit dem Infinitiv von נָשָׂא eine Vergleichs- beziehungsweise Überschreitungskonstruktion. Die gewählte Form ist idiomatisches Deutsch für »zu groß, um sie zu tragen« und erhält das Bild des Tragens.
theological_decisions:
- issue: Mehrdeutigkeit von עֲוֺנִי מִנְּשֹׂא
  choice: »Meine Schuld ist zu groß, als dass ich sie tragen könnte.«
  alternative: '»Meine Strafe ist zu schwer, als dass ich sie tragen könnte«; außerdem möglich: »Meine Schuld ist zu groß, als dass sie vergeben werden könnte.«'
  rationale: עָוֹן kann Schuld, Verfehlung oder Strafe bedeuten; נָשָׂא kann tragen und in bestimmten Verbindungen vergeben heißen. Der Haupttext gibt die naheliegende moralische Bedeutung wieder, während die kontextuell plausible Klage über die Strafe und die mögliche Vergebungslesart ausdrücklich in der Fußnote erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; die echte lexikalische und theologische Mehrdeutigkeit des Hebräischen wird nicht im Haupttext überladen, sondern in der Fußnote offengelegt.
