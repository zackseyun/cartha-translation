  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: de
  text: Und nun bist du vom Erdboden verflucht[a], der seinen Mund geöffnet hat, um das Blut[b] deines Bruders aus deiner Hand aufzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Erdboden weg verflucht« beziehungsweise »vom Erdboden verbannt«. Das Hebräische kann sowohl den Erdboden als Ausgangspunkt des Fluches als auch die Trennung von ihm anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich im Plural: »Blute«; im Hebräischen eine Ausdrucksweise für vergossenes Blut oder Blutvergießen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Konjunktion als auch den zeitlichen Übergang zur unmittelbaren Folge von Kains Tat natürlich wieder.
- source_word: אָרוּר אָתָּה
  choice: bist du … verflucht
  rationale: Die prädikative Aussage bezeichnet Kains nunmehrigen Zustand; die deutsche Wortstellung ist gegenwärtig und würdevoll.
- source_word: מִן הָאֲדָמָה
  choice: vom Erdboden her
  rationale: Bewahrt die mit מִן verbundene Offenheit zwischen Herkunft beziehungsweise Urheber der Verfluchung und Trennung vom Erdboden besser als eine eindeutig instrumentale oder räumliche Wiedergabe.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: der seinen Mund geöffnet hat
  rationale: Der Erdboden wird wie im Hebräischen personifiziert. Das Perfekt verbindet das vorausgegangene Geschehen mit Kains gegenwärtigem Urteil.
- source_word: לָקַחַת
  choice: aufzunehmen
  rationale: Im Bild des Erdbodens, der vergossenes Blut in sich aufnimmt, ist dies natürlich und hält zugleich die Bedeutung von ‚nehmen/empfangen‘ fest.
- source_word: דְּמֵי אָחִיךָ
  choice: das Blut deines Bruders
  rationale: Der hebräische Plural ‚Blute‘ bezeichnet hier idiomatisch vergossenes Blut beziehungsweise Blutschuld; der deutsche Singular ist verständlich und idiomatisch.
- source_word: מִיָּדֶךָ
  choice: aus deiner Hand
  rationale: Erhält das konkrete hebräische Bild und bringt Kains unmittelbare Verantwortung zum Ausdruck.
theological_decisions:
- issue: Verhältnis des Fluches zum Erdboden
  choice: Die Formulierung „vom Erdboden her verflucht“ lässt offen, ob der Erdboden als Ausgangspunkt des Fluches oder die Trennung von ihm im Vordergrund steht.
  alternative: „durch den Erdboden verflucht“ oder „vom Erdboden verbannt“
  rationale: מִן kann hier Herkunft beziehungsweise Ausgangspunkt oder Trennung bezeichnen. Der Haupttext soll diese exegetisch bedeutsame Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Personifikation des Erdbodens und das Bild von Kains Hand bleiben erhalten; ungewöhnliche hebräische Wendungen werden nur dort geglättet, wo das Deutsche es verlangt.
