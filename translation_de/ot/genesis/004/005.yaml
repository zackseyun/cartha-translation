  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: de
  text: Doch auf Kain und seine Opfergabe blickte er nicht wohlwollend[a]. Da wurde Kain sehr zornig, und sein Gesichtsausdruck verfinsterte sich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Kain und seine Opfergabe beachtete er nicht.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und sein Gesicht fiel“; eine hebräische Wendung für einen sichtbar niedergeschlagenen oder finsteren Gesichtsausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: Doch Kain und seine Opfergabe
  rationale: Die wiederholte Präposition אֶל kennzeichnet Kain und seine Gabe gleichermaßen als Gegenstand des ausbleibenden Ansehens. מִנְחָה wird im kultischen Zusammenhang sachgerecht mit „Opfergabe“ wiedergegeben.
- source_word: לֹא שָׁעָה
  choice: sah er nicht an
  rationale: שָׁעָה bezeichnet hier ein aufmerksames beziehungsweise wohlwollendes Ansehen. Die knappe Formulierung wahrt die Zurückhaltung des Hebräischen; das unausgesprochene Subjekt ergibt sich aus dem vorigen Vers.
- source_word: וַיִּחַר ... מְאֹד
  choice: Da wurde Kain sehr zornig
  rationale: Das hebräische Bild des Entbrennens wird in natürlichem modernem Deutsch als einsetzender, stark ausgeprägter Zorn wiedergegeben.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: er ließ den Kopf hängen
  rationale: Die deutsche Wendung vermittelt die sichtbare Niedergeschlagenheit des hebräischen Idioms natürlich; die Bildgestalt des Originals wird in der Fußnote angegeben.
theological_decisions:
- issue: Art der göttlichen Reaktion auf Kains Opfergabe
  choice: Das fehlende Ansehen wird genannt, ohne einen Grund dafür anzugeben.
  alternative: Expliziter mit „nahm nicht an“ oder „sah nicht wohlwollend an“ übersetzen.
  rationale: Der Vers erklärt nicht, weshalb Kain und seine Gabe nicht angesehen werden. Die Übersetzung soll weder einen bestimmten Opfermangel noch eine besondere innere Haltung Kains als Ursache eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Opfergabe“ hält den kultischen Zusammenhang fest; „ließ den Kopf hängen“ gibt das hebräische Idiom natürlich wieder.
