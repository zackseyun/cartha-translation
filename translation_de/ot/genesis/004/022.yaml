  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: de
  text: Zilla gebar auch Tubal-Kain[a], einen Schmied aller Schneidwerkzeuge aus Bronze und Eisen[b]. Und die Schwester Tubal-Kains war Naama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut nach »Tubal-Kain« ist schwierig. Die Übersetzung versteht ihn als Bezeichnung eines Herstellers oder Bearbeiters von Metallwerkzeugen. Möglich ist auch eine Deutung, nach der die Wortgruppe auf Bronze- und Eisenhandwerker Bezug nimmt.
    reason: alternative_reading
  - marker: b
    text: »Bronze« kann auch mit »Kupfer« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: ebenfalls
  rationale: 'Gibt die additive Bedeutung der Wortverbindung natürlich wieder: Auch Zilla gebar ein Kind.'
- source_word: יָלְדָה
  choice: gebar
  rationale: Prägnante und im genealogischen Erzählstil angemessene Wiedergabe von ילד.
- source_word: תּוּבַל קַיִן
  choice: Tubal-Kain
  rationale: Der Personenname wird nach gängiger deutscher Konvention mit Bindestrich transkribiert.
- source_word: לֹטֵשׁ
  choice: schmiedete
  rationale: Das Partizip kann das Hämmern, Schärfen oder Schmieden bezeichnen; im Zusammenhang mit Bronze und Eisen vermittelt »schmiedete« das Metallhandwerk verständlich.
- source_word: כָּל חֹרֵשׁ
  choice: alle Schneidwerkzeuge
  rationale: Die hebräische Fügung ist schwierig. Im Zusammenhang mit לֹטֵשׁ wird sie hier auf die hergestellten beziehungsweise geschärften Geräte bezogen; die mögliche Deutung als Bezeichnung von Handwerkern wird in der Fußnote bewahrt.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen. »Bronze« ist in diesem historischen Metallkontext die geläufige Wiedergabe; die lexikalische Alternative wird angemerkt.
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Direkte und eindeutige Wiedergabe der Metallbezeichnung.
- source_word: אֲחוֹת
  choice: Schwester
  rationale: Direkte Wiedergabe des Verwandtschaftsbegriffs.
- source_word: נַעֲמָה
  choice: Naama
  rationale: Der Personenname wird nach üblicher deutscher Form transkribiert.
