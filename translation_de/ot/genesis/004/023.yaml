  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: de
  text: 'Und Lamech sagte zu seinen Frauen: „Ada und Zilla, hört meine Stimme! Ihr Frauen Lamechs, hört auf mein Wort! Denn ich habe einen Mann erschlagen, weil er mich verwundet hat, und einen jungen Mann, weil er mich geschlagen hat.[a][b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man übersetzen: „Einen Mann habe ich erschlagen für meine Wunde und einen jungen Mann für meine Strieme.“'
    reason: lexical_alternative
  - marker: b
    text: 'Manche verstehen Lamechs Worte als Drohung oder allgemeine Prahlerei: „Ich würde einen Mann erschlagen …“, nicht als Bericht über eine tatsächlich begangene Tötung.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: zu seinen Frauen
  rationale: Im Zusammenhang sind Lamechs Ehefrauen gemeint. Das moderne Deutsche verwendet in dieser Anrede natürlicherweise „Frauen“; die Namen Ada und Zilla beseitigen jede Unklarheit.
- source_word: שְׁמַעַן קוֹלִי
  choice: hört meine Stimme
  rationale: Die konkrete hebräische Wendung und der poetische Parallelismus bleiben erhalten.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: hört auf mein Wort
  rationale: „Auf etwas hören“ gibt die nachdrückliche Aufforderung des Hiphil von אזן in natürlichem Deutsch wieder; „mein Wort“ bewahrt den poetischen Singular.
- source_word: הָרַגְתִּי
  choice: ich habe … erschlagen
  rationale: Das Qatal wird zunächst als Bericht einer vollzogenen Tat verstanden. „Erschlagen“ passt zum gewaltsamen Zusammenhang und zum gehobenen poetischen Register.
- source_word: לְפִצְעִי
  choice: weil er mich verwundet hat
  rationale: Die Präposition ל mit „meine Wunde“ wird idiomatisch als Anlass beziehungsweise Grund der Vergeltung wiedergegeben. Eine Fußnote bewahrt die wörtlichere Ausdrucksweise.
- source_word: יֶלֶד
  choice: einen jungen Mann
  rationale: יֶלֶד kann Kind, Junge oder junger Mensch bedeuten. Im Parallelismus mit אִישׁ bezeichnet es hier plausibel einen jüngeren männlichen Menschen, ohne zwingend ein kleines Kind zu meinen.
- source_word: לְחַבֻּרָתִי
  choice: weil er mich geschlagen hat
  rationale: חַבּוּרָה bezeichnet eine Strieme, einen Bluterguss oder eine Verletzung. Die verbale Wiedergabe drückt den Anlass idiomatisch aus und unterscheidet sich noch erkennbar von „verwundet“.
theological_decisions:
- issue: Ist Lamechs Aussage ein Bericht, eine Drohung oder eine allgemeine Prahlerei?
  choice: 'Bericht einer vollzogenen Tötung: „ich habe … erschlagen“'
  alternative: 'Modal oder allgemein: „ich würde … erschlagen“'
  rationale: Das hebräische Qatal bezeichnet am naheliegendsten eine vollzogene Handlung. Da eine drohende oder allgemeine Deutung möglich ist, wird sie in einer Fußnote genannt, statt die Spannung im Haupttext aufzulösen.
- issue: Vergeltung oder Selbstverteidigung
  choice: Die Verletzungen werden als Anlass der Tötung genannt, ohne diese ausdrücklich als Selbstverteidigung zu rechtfertigen.
  alternative: Eine kausale Formulierung könnte als ausdrückliche Notwehrbehauptung verstanden werden.
  rationale: Der hebräische Text nennt den Zusammenhang, bewertet aber Lamechs Motiv nicht eindeutig. Die Übersetzung fügt daher keine moralische Rechtfertigung hinzu.
translation_notes:
  register: Moderne, würdige Standardsprache mit erkennbarer poetischer Parallelstruktur. Die Imperative und die Wiederholung der Anrede bleiben erhalten; schwer verständliche nominale Wendungen werden im Haupttext idiomatisch und in der Fußnote wörtlicher wiedergegeben.
