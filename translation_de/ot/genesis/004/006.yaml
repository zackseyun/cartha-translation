base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: de
  text: 'Da sagte Jahwe zu Kain: „Warum bist du zornig, und warum ist dein Gesicht gesenkt?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Warum ist dein Gesicht gefallen?“ Gemeint sein kann: „Warum blickst du so niedergeschlagen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die übliche deutsche Form.
- source_word: אֶל קָיִן
  choice: zu Kain
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; der Personenname wird nach deutscher Konvention als „Kain“ wiedergegeben.
- source_word: לָמָּה
  choice: Warum
  rationale: Die Frage zielt unmittelbar auf den Grund und wird idiomatisch mit „Warum“ wiedergegeben.
- source_word: חָרָה לָךְ
  choice: bist du zornig
  rationale: Die hebräische Wendung beschreibt Zorn bildhaft als Entbrennen. „Bist du zornig“ vermittelt ihren Sinn klar und würdevoll.
- source_word: נָפְלוּ פָנֶיךָ
  choice: hat sich dein Gesicht gesenkt
  rationale: Die Formulierung bewahrt das hebräische Bild des gefallenen beziehungsweise gesenkten Gesichts, klingt im Deutschen jedoch natürlicher als eine streng wörtliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm als persönlicher Gottesname. Die Wiedergabe „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von נָפְלוּ פָנֶיךָ
  choice: hat sich dein Gesicht gesenkt
  alternative: bist du niedergeschlagen
  rationale: Die gewählte Fassung erhält das konkrete hebräische Bild und legt den damit bezeichneten Gemütszustand nicht eindeutiger fest, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die parallelen Warum-Fragen und das Bild des gesenkten Gesichts bleiben erhalten.
