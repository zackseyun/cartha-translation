base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: de
  text: Ada gebar Jabal[a]. Er war der Vater derer, die in Zelten wohnen und Vieh halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Stammvater der Zeltbewohner und Viehhalter“. Das hebräische „Vater“ kann hier einen Vorfahren, Begründer oder beispielhaften Urheber einer Lebensweise bezeichnen.'
    reason: lexikalische Alternative und Erläuterung der hebräischen Metapher
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Qal-Wajjiqtol von ילד bezeichnet in der genealogischen Erzählung knapp und idiomatisch das Gebären.
- source_word: עָדָה
  choice: Ada
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶת
  choice: '[Akkusativzeichen, unübersetzt]'
  rationale: Kennzeichnet יבל als direktes Objekt und hat hier keine eigenständige deutsche Entsprechung.
- source_word: יָבָל
  choice: Jabal
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: הוּא הָיָה
  choice: Er war
  rationale: Pronomen und היה identifizieren Jabal und beschreiben seine Rolle; „war“ gibt die prädikative Konstruktion unmittelbar wieder, ohne die mögliche Entwicklung, die „wurde“ nahelegen würde, einzutragen.
- source_word: אֲבִי
  choice: der Vater
  rationale: Die Wiedergabe bewahrt die hebräische Metapher. In diesem kulturgeschichtlichen Zusammenhang kann אָב auch Stammvater, Begründer oder archetypischer Urheber einer Lebensweise bedeuten.
- source_word: יֹשֵׁב אֹהֶל
  choice: derer, die in Zelten wohnen
  rationale: Das Partizip im Singular hat kollektive Bedeutung und bezeichnet eine Menschengruppe, deren Lebensweise vom Wohnen in Zelten geprägt ist.
- source_word: וּמִקְנֶה
  choice: und Vieh halten
  rationale: מִקְנֶה bezeichnet Vieh beziehungsweise Herden. Das ergänzte Verb „halten“ macht im Deutschen die im knappen hebräischen Ausdruck vorausgesetzte Verbindung zur Lebensweise verständlich; „Vieh“ ist weiter als „Rinder“.
theological_decisions:
- issue: Bedeutung von „Vater“ in einer kulturgeschichtlichen Herkunftsnotiz
  choice: Die Metapher „Vater“ bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: „Stammvater“ oder „Begründer“ direkt in den Haupttext setzen.
  rationale: Der hebräische Ausdruck lässt genealogische Abstammung sowie die Rolle als Begründer oder exemplarischer Ursprung einer Lebensweise zu. Die Übersetzung soll diese Mehrdeutigkeit nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe genealogische Erzählweise bleibt erhalten; der ungewöhnlich verdichtete hebräische Ausdruck wird mit „Vieh halten“ natürlich verständlich gemacht.
