base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: de
  text: Nach einiger Zeit[a] brachte Kain Jahwe eine Opfergabe von den Erträgen des Ackerbodens[b] dar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „am Ende von Tagen“; gemeint ist eine verstrichene Zeitspanne.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Früchten des Ackerbodens“.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Gottesname JHWH wird traditionell auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: '[in der fortlaufenden Erzählung nicht eigens wiedergegeben]'
  rationale: Die narrative Verbform führt das nächste Geschehen ein. Im modernen Deutschen genügt der anschließende Zeitausdruck; ein formelhaftes „Und es geschah“ wäre unnötig schwerfällig.
- source_word: מִקֵּץ יָמִים
  choice: Nach einiger Zeit
  rationale: Die Wendung bedeutet wörtlich etwa „am Ende von Tagen“, bezeichnet hier jedoch idiomatisch den Ablauf einer nicht näher bestimmten Zeitspanne.
- source_word: וַיָּבֵא
  choice: brachte
  rationale: Der Hifil von בוא bezeichnet hier das Herbeibringen beziehungsweise Darbringen einer Gabe.
- source_word: קַיִן
  choice: Kain
  rationale: Übliche deutsche Form des Personennamens.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: von den Erträgen des Ackerbodens
  rationale: פְּרִי kann Frucht oder Ertrag bedeuten; im landwirtschaftlichen Zusammenhang ist „Erträge“ natürlich. „Ackerboden“ bewahrt den Bezug zu אֲדָמָה und zu Kains Tätigkeit.
- source_word: מִנְחָה
  choice: eine Opfergabe
  rationale: מִנְחָה bezeichnet eine Gabe, Abgabe oder Opfergabe. Im Gottesdienstkontext trifft „Opfergabe“ den Sinn, ohne eine bestimmte Opferart festzulegen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל markiert hier den Empfänger beziehungsweise Adressaten der Gabe. „Für“ klingt im Deutschen natürlich und gibt das Tetragramm als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder; eine Fußnote weist auf die traditionelle Wiedergabe „der HERR“ hin.
- issue: Sinn von מִקֵּץ יָמִים
  choice: 'nicht eschatologische Zeitangabe: „Nach einiger Zeit“'
  alternative: „am Ende der Tage“
  rationale: Der Zusammenhang spricht von einer verstrichenen, nicht näher bestimmten Zeitspanne und nicht vom endzeitlichen „Ende der Tage“.
- issue: Art von Kains מִנְחָה
  choice: allgemein „Opfergabe“
  alternative: Speisopfer; Tribut; Geschenk
  rationale: Der Text benennt keine später gesetzlich definierte Opferkategorie. Die Übersetzung vermeidet daher eine anachronistische Präzisierung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählen; die Fußnoten bewahren die wörtlicheren beziehungsweise traditionellen Alternativen.
