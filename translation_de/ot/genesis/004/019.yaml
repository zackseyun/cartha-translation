base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: de
  text: Lamech nahm sich zwei Frauen zu Ehefrauen.[a] Die eine hieß Ada, die andere Zilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lamech heiratete zwei Frauen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: nahm sich
  rationale: Die Verbindung bewahrt die konkrete Ausdrucksweise von לקח mit der auf das Subjekt bezogenen Wendung לוֹ und ist im Deutschen verständlich; durch „Frauen“ wird der eheliche Sinn im Kontext deutlich.
- source_word: שְׁתֵּי נָשִׁים
  choice: zwei Frauen
  rationale: נָשִׁים kann „Frauen“ oder „Ehefrauen“ bedeuten. In Verbindung mit „nahm sich“ ist die Heiratsbeziehung erkennbar, ohne im Deutschen die schwerfälligere Formulierung „zwei Ehefrauen“ zu verlangen.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Die eine hieß …, die andere …
  rationale: Diese natürliche deutsche Namensformel gibt die Gegenüberstellung der beiden Frauen klar wieder. הַשֵּׁנִית bedeutet formal „die zweite“, bezeichnet bei einem Paar hier aber idiomatisch die andere.
- source_word: עָדָה
  choice: Ada
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: צִלָּה
  choice: Zilla
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Ob die Mehrehe ausdrücklich bewertet werden soll
  choice: Die zwei Frauen werden als eheliche Partnerinnen benannt, ohne moralischen Zusatz.
  alternative: Die Handlung ausdrücklich als Polygynie bezeichnen oder moralisch kommentieren.
  rationale: Der Vers berichtet, dass Lamech sich zwei Frauen nahm, bewertet dies an dieser Stelle jedoch nicht. Die Übersetzung soll den Sachverhalt klar wiedergeben, ohne eine Wertung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „nahm sich zwei Frauen“ hält die hebräische Ausdrucksweise sichtbar; die Fußnote bietet die ausdrücklich idiomatische Deutung als Heirat.
