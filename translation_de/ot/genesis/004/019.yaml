  verdict: revise
  source_fidelity: Die Wendung „nahm sich zwei Frauen“ bildet וַיִּקַּח לוֹ gut ab, lässt im heutigen Deutsch aber offen, ob „Frauen“ hier ausdrücklich Ehefrauen meint. Der hebräische Kontext (לקח mit נשים) bezeichnet klar die Eheschließung bzw. das Nehmen zu Ehefrauen. „zu Ehefrauen“ macht dies ohne zusätzliche Wertung deutlich.
  naturalness: „Lamech nahm sich zwei Frauen zu Ehefrauen“ ist verständliches, würdiges modernes Standarddeutsch mit bewusst leicht bibelnaher Färbung. Die Namensformel „Die eine hieß ..., die andere ...“ ist idiomatisch.
  terminology: Ada und Zilla sind im Deutschen etablierte biblische Namensformen. „die andere“ gibt הַשֵּׁנִית bei einem Paar angemessen wieder. „Ehefrauen“ trifft die kontextuelle Bedeutung von נָשִׁים präziser als das alleinstehende „Frauen“.
