  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: de
  text: Denn Kain wird siebenfach gerächt[a], und Lamech siebenundsiebzigfach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kain wird siebenfach gerächt werden.“ Das hebräische Imperfekt kann eine als gewiss dargestellte künftige Vergeltung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „siebzig und sieben“, also siebenundsiebzig; nicht „siebzigmal sieben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet Lamechs Aussage im vorangehenden Vers; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: שִׁבְעָתַיִם
  choice: siebenfach
  rationale: Die Form bezeichnet hier das siebenfache Maß der Vergeltung und wird durch „siebenfach“ knapp und idiomatisch wiedergegeben.
- source_word: יֻקַּם
  choice: wird … gerächt
  rationale: Die passive Verbform bedeutet, dass Kain gerächt wird. Das deutsche Präsenspassiv kann hier sowohl eine feststehende Aussage als auch eine sicher erwartete künftige Vergeltung ausdrücken.
- source_word: קָיִן
  choice: Kain
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וְלֶמֶךְ
  choice: und Lamech
  rationale: „Und“ wahrt die einfache hebräische Verknüpfung und den poetischen Parallelismus, ohne einen ausdrücklich adversativen Sinn hinzuzufügen.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: siebenundsiebzigfach
  rationale: Die Wendung bedeutet wörtlich „siebzig und sieben“, also siebenundsiebzig. „Siebzehnundsiebzigfach“ würde den Zahlenwert falsch wiedergeben; „siebenundsiebzigfach“ bewahrt zugleich die Parallele zu „siebenfach“.
theological_decisions:
- issue: Zahlenangabe für Lamechs Vergeltung
  choice: siebenundsiebzigfach
  alternative: siebzigmal siebenfach
  rationale: Die hebräische Konstruktion bezeichnet am natürlichsten die Zahl siebenundsiebzig und nicht siebzig mal sieben. Dadurch wird keine spätere neutestamentliche Formulierung in den Genesistext eingetragen.
- issue: Zeitbezug der Vergeltung Kains
  choice: wird … gerächt
  alternative: wird … gerächt werden
  rationale: Die imperfektive hebräische Form kann eine allgemeine beziehungsweise feststehende Aussage oder eine als gewiss dargestellte zukünftige Vergeltung bezeichnen. Die gewählte deutsche Form lässt diesen Spielraum bestehen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, knappem Satzbau. Der poetische Parallelismus und die Steigerung von Kain zu Lamech bleiben erhalten.
