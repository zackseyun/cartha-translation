  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: de
  text: 'Der Mensch erkannte Eva, seine Frau. Sie wurde schwanger und gebar Kain[b]. Sie sagte: »Ich habe einen Mann mit Jahwe erworben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „Ich habe einen Mann mit Jahwe erworben.“ Die Wendung kann auch im Sinn von „mithilfe Jahwes“ oder „von Jahwe“ verstanden werden; weniger wahrscheinlich ist: „Ich habe einen Mann erworben – Jahwe.“'
    reason: alternative_reading
  - marker: b
    text: 'Der Name Kain klingt im Hebräischen an das Verb für „erwerben“ an (qaniti: „ich habe erworben“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: Der Mensch
  rationale: Der bestimmte Ausdruck bezeichnet hier den zuvor eingeführten männlichen Menschen. Im Deutschen bewahrt „der Mensch“ die Verbindung zu אָדָם besser als der Eigenname „Adam“. Das vorangestellte וְ wird nicht eigens wiedergegeben, da der deutsche Erzählzusammenhang die Verknüpfung bereits trägt.
- source_word: יָדַע
  choice: erkannte
  rationale: Das Verb bedeutet wörtlich „erkennen/kennen“ und dient hier als verhüllender Ausdruck für den Geschlechtsverkehr. „Erkannte“ bewahrt das hebräische Bild und den würdigen literarischen Ton.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Eva, seine Frau
  rationale: Die Wortfolge gibt Name und Beziehungsbezeichnung des Hebräischen klar und natürlich wieder.
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: Natürliche moderne Wiedergabe von הרה im Zusammenhang einer Geburt.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: und gebar Kain
  rationale: „Gebar“ ist knapp, genau und dem gehobenen Erzählstil angemessen.
- source_word: קַיִן
  choice: Kain
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben; das hebräische Wortspiel wird in einer Fußnote erläutert.
- source_word: קָנִיתִי
  choice: ich habe … erworben
  rationale: קנה bedeutet gewöhnlich „erwerben/erlangen“. „Erworben“ erhält die lautliche und begriffliche Nähe zum Namen Kain eher als freiere Wiedergaben.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das Hebräische verwendet ausdrücklich אִישׁ („Mann“), obwohl ein neugeborenes männliches Kind gemeint ist. Die ungewöhnliche Ausdrucksweise bleibt erhalten.
- source_word: אֶת יְהוָה
  choice: mit Jahwe
  rationale: Die knappe Wiedergabe bewahrt die ungewöhnliche und umstrittene hebräische Verbindung, ohne sie im Haupttext vorschnell als Hilfe, Herkunft oder Gleichsetzung auszulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Gottesnamens gibt das Tetragramm als Eigennamen statt durch den Titel „der HERR“ wieder.
theological_decisions:
- issue: Deutung von אֶת־יְהוָה in Evas Aussage
  choice: mit Jahwe
  alternative: mithilfe Jahwes; von Jahwe; einen Mann – Jahwe
  rationale: Die Konstruktion ist tatsächlich mehrdeutig. Der Haupttext folgt ihrer knappen Form und lässt die Spannung stehen; die wichtigsten Deutungsmöglichkeiten werden in der Fußnote genannt, ohne eine christologische, ontologische oder konfessionelle Lesart festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. Kurze Hauptsätze halten den Erzählfluss natürlich; die ungewöhnlichen Formulierungen „erkannte“ und „einen Mann … erworben“ bleiben wegen ihrer literarischen und lexikalischen Bedeutung erhalten.
