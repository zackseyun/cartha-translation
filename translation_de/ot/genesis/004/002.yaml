source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: de
  text: Dann gebar sie noch einmal[a] seinen Bruder Abel. Abel wurde Schaf- und Ziegenhirte[b], Kain aber bearbeitete den Erdboden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine hebräische Wendung mit „hinzufügen“, die eine Wiederholung oder Fortsetzung ausdrückt: „Sie gebar wieder“ oder „sie fuhr fort zu gebären“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Kleinvieh, besonders Schafe und Ziegen.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: Dann gebar sie noch einmal
  rationale: Die Verbindung von יסף mit einem Infinitiv bezeichnet die Wiederholung oder Fortsetzung einer Handlung. „Gebar sie noch einmal“ gibt hier die erneute Geburt natürlich wieder; „dann“ nimmt den erzählerischen Anschluss des וַ auf.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: seinen Bruder Abel
  rationale: Die doppelte Objektmarkierung stellt Abel appositionell als Kains Bruder vor. Die deutsche Formulierung bewahrt diese relationale Hervorhebung, ohne die hebräische Konstruktion hölzern nachzubilden.
- source_word: הֶבֶל
  choice: Abel
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וַיְהִי הֶבֶל
  choice: Abel wurde
  rationale: היה führt hier Abels Tätigkeit beziehungsweise Lebensrolle ein. „Wurde“ gibt die erzählerische Entwicklung wieder; „war“ wäre ebenfalls möglich.
- source_word: רֹעֵה צֹאן
  choice: ein Hirte für Schafe und Ziegen
  rationale: רעה bezeichnet das Hüten oder Weiden, während צאן kollektiv Kleinvieh, besonders Schafe und Ziegen, meint. Die Formulierung ist genauer als das zu enge „Schafhirte“ und verständlicher als „Kleinviehhirte“.
- source_word: קַיִן
  choice: Kain
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: bearbeitete den Erdboden
  rationale: עבד mit אֲדָמָה bezeichnet das Bearbeiten oder Kultivieren des Bodens. Die verbale Wiedergabe ist im modernen Deutsch natürlicher als „war ein Bearbeiter des Erdbodens“ und bewahrt zugleich das Motiv des Erdbodens im Genesis-Kontext.
- source_word: אֲדָמָה
  choice: Erdboden
  rationale: „Erdboden“ bewahrt den thematischen Bezug zu Adam und zum zuvor verfluchten Boden besser als das stärker beruflich eingeengte „Acker“ oder das allgemeinere „Land“.
- source_word: וְ
  choice: aber
  rationale: Die Konjunktion bedeutet grundsätzlich „und“, kann im Kontext jedoch einen Gegensatz markieren. „Aber“ stellt die unterschiedlichen Tätigkeiten der Brüder klar gegenüber, ohne sie moralisch zu bewerten.
theological_decisions:
- issue: Darstellung der Tätigkeiten der Brüder
  choice: Die unterschiedlichen Tätigkeiten werden sachlich und ohne moralische Wertung beschrieben.
  alternative: Eine Formulierung, die das Hirtenleben oder den Ackerbau unterschwellig höher bewertet.
  rationale: Der hebräische Text nennt an dieser Stelle lediglich die verschiedenen Tätigkeiten. Eine theologische oder moralische Rangordnung wird in diesem Vers nicht ausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt erzählerisch knapp. „Erdboden“ erhält den sprachlichen und thematischen Zusammenhang der Urgeschichte; die Tätigkeiten beider Brüder werden neutral dargestellt.
