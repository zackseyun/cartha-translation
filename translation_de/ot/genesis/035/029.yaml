base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: de
  text: Da verschied Isaak und starb und wurde zu seinem Volk versammelt[a], alt und lebenssatt. Seine Söhne Esau und Jakob begruben ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung „wurde zu seinem Volk versammelt“ ist eine herkömmliche hebräische Todesformel. Auch: „wurde zu seinen Vorfahren/Angehörigen versammelt“. Sie kann möglicherweise mehr als die körperliche Bestattung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: verschied
  rationale: Das gehobene, aber geläufige deutsche Verb bezeichnet das Aushauchen des Lebens und hält die Aussage vom folgenden ausdrücklichen „starb“ unterscheidbar.
- source_word: וַיָּמָת
  choice: starb
  rationale: מות ist das gewöhnliche Verb für „sterben“; die direkte Wiedergabe bewahrt die hebräische Abfolge.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: wurde zu seinem Volk versammelt
  rationale: Die formelhafte Wendung wird möglichst direkt wiedergegeben, ohne sie eindeutig auf Bestattung, die Vorfahren oder einen Zustand nach dem Tod festzulegen.
- source_word: זָקֵן
  choice: alt
  rationale: Die schlichte Wiedergabe entspricht der direkten Altersangabe des hebräischen Textes.
- source_word: וּשְׂבַע יָמִים
  choice: lebenssatt
  rationale: Das etablierte deutsche Bibelwort gibt die hebräische Wendung „satt an Tagen“ knapp und würdig wieder, ohne sie zur bloßen Angabe eines hohen Alters abzuflachen.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: begruben ihn
  rationale: קבר bedeutet hier schlicht „begraben“; die Formulierung ist klar und natürlich.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Seine Söhne Esau und Jakob
  rationale: Die deutsche Wortstellung kennzeichnet Esau und Jakob natürlich und eindeutig als Isaaks Söhne.
theological_decisions:
- issue: Bedeutung der Todesformel „zu seinem Volk versammelt werden“
  choice: Die wörtliche Formel bleibt im Haupttext erhalten.
  alternative: „wurde mit seinen Vorfahren vereint“ oder eine ausschließliche Deutung als Beisetzung im Familiengrab
  rationale: Die hebräische Wendung lässt offen, ob vor allem Zugehörigkeit zu den Verstorbenen, eine Vereinigung mit den Vorfahren oder mehr als die körperliche Bestattung gemeint ist. Diese Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschied“ und „lebenssatt“ sind bewusst leicht gehoben, bleiben aber verständlich und bewahren die feierliche Form eines patriarchalischen Todesberichts. Der Fußnotenmarker steht nach „starb“, wie in der konsultierten englischen Fassung, und erläutert die unmittelbar folgende Todesformel.
