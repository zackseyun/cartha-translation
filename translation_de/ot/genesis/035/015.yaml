source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: de
  text: Und Jakob gab dem Ort, an dem Gott mit ihm gesprochen hatte, den Namen Bet-El.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-El bedeutet „Haus Gottes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: gab ... den Namen
  rationale: Die hebräische Wendung bedeutet, einem Ort einen Namen zu geben. Diese Wiedergabe bewahrt den ausdrücklichen Bezug auf den Namen und klingt zugleich natürlich auf Deutsch.
- source_word: הַמָּקוֹם
  choice: dem Ort
  rationale: Direkte und idiomatische Wiedergabe des bestimmten Substantivs.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: an dem Gott mit ihm gesprochen hatte
  rationale: „An dem“ gibt die hebräische Relativkonstruktion zusammen mit dem lokativen שָׁם natürlich wieder, ohne im Deutschen die schwerfällige Dopplung „an dem ... dort“ zu erzeugen. „Mit ihm“ entspricht אִתּוֹ; das Plusquamperfekt kennzeichnet das Sprechen als dem Benennen vorausgehend.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier aufgrund von Syntax und Erzählzusammenhang den einen Gott und wird daher im Singular wiedergegeben.
- source_word: בֵּית אֵל
  choice: Bet-El
  rationale: Der Ortsname wird in der im Deutschen üblichen Form transkribiert; seine Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Numerus und Referenz von אֱלֹהִים
  choice: Gott
  alternative: Götter
  rationale: Obwohl אֱלֹהִים formal eine Pluralform ist, bezieht es sich hier im narrativen Zusammenhang auf den Gott, der Jakob erschienen war und mit ihm gesprochen hatte; eine pluralische Wiedergabe wäre irreführend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Benennungsformel wird idiomatisch als „gab ... den Namen“ wiedergegeben; die Ortsangabe שָׁם ist in „an dem“ aufgenommen, um eine unnatürliche deutsche Dopplung zu vermeiden.
