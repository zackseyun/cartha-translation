base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: de
  text: 'Und die Söhne Bilhas, der Dienerin Rahels[a]: Dan und Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Magd Rahels“. Das hebräische Wort bezeichnet eine weibliche Dienstperson in untergeordneter Stellung; in manchen Zusammenhängen kann es auch „Sklavin“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Der Präfix וּ setzt die Aufzählung fort; בְנֵי ist der Konstruktplural von בֵּן und bezeichnet hier in der genealogischen Liste die Söhne.
- source_word: בִלְהָה
  choice: Bilhas
  rationale: Der Personenname wird in der im Deutschen etablierten Form „Bilha“ wiedergegeben; der Genitiv markiert das Konstruktverhältnis.
- source_word: שִׁפְחַת
  choice: Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Person in untergeordneter Dienststellung und kann je nach Kontext auch eine Sklavin meinen. „Dienerin“ ist modern und verständlich; eine Fußnote bewahrt die soziale Bedeutungsbreite.
- source_word: רָחֵל
  choice: Rahels
  rationale: Der Personenname wird in der etablierten deutschen Bibelform wiedergegeben; der Genitiv bildet die hebräische Konstruktverbindung natürlich ab.
- source_word: דָּן
  choice: Dan
  rationale: Transliteration des Personennamens in seiner etablierten deutschen Form.
- source_word: וְ/נַפְתָּלִי
  choice: und Naftali
  rationale: Die Konjunktion wird als „und“ wiedergegeben; der Personenname folgt der etablierten deutschen Schreibweise.
