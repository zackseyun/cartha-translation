  source_fidelity: 'Die Grundbedeutung ist zutreffend: Jakob errichtet einen aufgerichteten Stein als Kennzeichnung von Rahels Grab, und der Erzähler erklärt dessen Fortbestand bis zu seiner Gegenwart. „Auf ihr Grab“ kann im Deutschen jedoch unnötig konkret den Eindruck erwecken, der Stein liege unmittelbar auf dem Grab; עַל erlaubt hier die idiomatischere räumliche Wiedergabe „über ihrem Grab“.'
