  text: וַ/יַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל קְבֻרָתָ֑/הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת רָחֵ֖ל עַד הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: de
  text: Jakob stellte einen Gedenkstein über ihrem Grab[a] auf. Das ist der Gedenkstein für Rahels Grab bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihrem Grab“; auch: „ein Grabmal“.'
    reason: עַל kann die Lage „auf“ oder „über“ bezeichnen; מַצֵּבָה ist ein aufgerichteter Stein und kann im Kontext als Grabmal verstanden werden.
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: stellte … auf
  rationale: Der Hifil von נצב bedeutet hier, einen Stein aufzustellen bzw. zu errichten; „stellte … auf“ ist natürlich und wahrt die konkrete Handlung.
- source_word: מַצֵּבָה
  choice: Gedenkstein
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein. Im Zusammenhang eines Grabes gibt „Gedenkstein“ dessen Funktion verständlich wieder, ohne ein aufwendiges Bauwerk anzunehmen.
- source_word: עַל קְבֻרָתָהּ
  choice: auf ihr Grab
  rationale: עַל bezeichnet hier die Lage des Steins am bzw. über dem Grab; „auf ihr Grab“ ist im Deutschen konkret und entspricht der räumlichen Aussage.
- source_word: הִוא
  choice: Das ist
  rationale: Das Pronomen greift den zuvor genannten Gedenkstein auf und identifiziert ihn näher.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: der Gedenkstein auf Rahels Grab
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen funktional und verständlich wiedergegeben; die genaue Beziehung zwischen Stein und Grab bleibt erkennbar.
- source_word: עַד הַיּוֹם
  choice: bis zum heutigen Tag
  rationale: Die feste hebräische Wendung bezeichnet das Fortbestehen bis in die Gegenwart des Erzählers; „bis zum heutigen Tag“ ist idiomatisch und würdevoll.
theological_decisions: []
