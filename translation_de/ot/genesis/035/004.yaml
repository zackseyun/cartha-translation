  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und die wesentlichen Bedeutungen zuverlässig wieder: Jakob ist als Dativempfänger korrekt ausgedrückt; „alle fremden Götter“ entspricht כָּל אֱלֹהֵי הַנֵּכָר; die Ringe werden ohne über die Quelle hinausgehende kultische Deutung genannt; und „unter der Terebinthe bei Sichem“ bewahrt sowohl die Baumbezeichnung als auch die Ortsnähe. „Sie in ihren Händen hatten“ ist eine verständliche, quellennnahe Wiedergabe der hebräischen Besitzformel. „Verbarg“ bleibt für טמן angemessen offen und legt nicht unnötig „vergrub“ fest.'
