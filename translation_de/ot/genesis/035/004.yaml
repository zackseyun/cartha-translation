  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: de
  text: Da gaben sie Jakob alle fremden Götter, die sie in ihren Händen hatten, und die Ringe[a], die sie an den Ohren trugen. Jakob verbarg sie unter der Terebinthe[b] bei Sichem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ohrringe“. Das hebräische Wort kann Ringe an verschiedenen Körperstellen bezeichnen; hier bestimmt der folgende Ausdruck ihren Sitz an den Ohren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Eiche“. Das hebräische Wort bezeichnet wahrscheinlich genauer eine Terebinthe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Da gaben sie
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da gaben sie“ gibt die Folgewirkung im Deutschen natürlich wieder.
- source_word: אֶל יַעֲקֹב
  choice: Jakob
  rationale: Die Präposition kennzeichnet den Empfänger. Die deutsche Konstruktion „jemandem etwas geben“ verlangt hier den Dativ ohne zusätzliche Präposition.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: alle fremden Götter
  rationale: Die Wendung bezeichnet fremde beziehungsweise unerlaubte Gottheiten; die geläufige Wiedergabe bleibt nah am Hebräischen, ohne die Gegenstände näher zu bestimmen.
- source_word: אֲשֶׁר בְּיָדָם
  choice: die sie in ihren Händen hatten
  rationale: Die konkrete hebräische Formulierung „in ihrer Hand“ bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: וְאֶת הַנְּזָמִים
  choice: und die Ringe
  rationale: נְזָמִים kann Schmuckringe an unterschiedlichen Körperstellen bezeichnen. Die folgende Ortsangabe legt hier die Ohren fest, weshalb das allgemeinere „Ringe“ die Wortwahl des Ausgangstextes wahrt.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: die sie an den Ohren trugen
  rationale: Die Wiedergabe drückt die lokale Bedeutung idiomatisch aus, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „von ihren Ohren“ einzuführen.
- source_word: וַיִּטְמֹן אֹתָם
  choice: Jakob verbarg sie
  rationale: טמן bedeutet verbergen oder verstecken und kann kontextuell auch Vergraben einschließen. „Verbergen“ vermeidet eine unnötige Festlegung auf die konkrete Handlung.
- source_word: תַּחַת הָאֵלָה
  choice: unter der Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich genauer eine Terebinthe; die traditionell mögliche Wiedergabe „Eiche“ wird als Fußnotenalternative genannt.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: bei Sichem
  rationale: עִם bezeichnet mit einem Ortsnamen räumliche Nähe; „bei Sichem“ ist knapp, natürlich und quellennah.
theological_decisions:
- issue: Bedeutung der abgegebenen und verborgenen Gegenstände
  choice: Der Vers nennt fremde Götter und daneben Ohrschmuck, ohne die religiöse Bedeutung dieses Schmucks näher zu erklären.
  alternative: Die Ringe könnten gewöhnlicher Schmuck oder selbst Amulette beziehungsweise kultisch belastete Gegenstände gewesen sein.
  rationale: Nur die „fremden Götter“ werden ausdrücklich als Gottheiten bezeichnet. Ob die Ringe selbst eine kultische Funktion hatten, lässt der hebräische Text offen; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer leicht konkreten, quellennahen Ausdrucksweise. „In ihren Händen“ bewahrt das hebräische Bild; „an den Ohren trugen“ klingt natürlicher als eine rein wörtliche Ortsangabe. Die Satzfolge bleibt übersichtlich und erzählerisch.
