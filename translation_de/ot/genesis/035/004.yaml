  terminology: „Fremde Götter“, „Ringe“, „Terebinthe“ und „Sichem“ sind sachlich und registergerecht. Die Fußnoten erklären die beiden tatsächlichen lexikalischen Alternativen präzise; ihre Marker sind korrekt unmittelbar an „Ringe“ beziehungsweise „Terebinthe“ verankert.
