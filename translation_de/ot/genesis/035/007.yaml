  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: de
  text: Dort baute er einen Altar und nannte den Ort El-Bethel[a], denn dort hatte sich Gott ihm offenbart, als er vor seinem Bruder floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El-Bethel bedeutet wahrscheinlich »Gott von Bethel«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute er
  rationale: Das Qal-Wayyiqtol von בנה bezeichnet im Erzählzusammenhang gewöhnlich das Bauen; die deutsche Präteritalform entspricht dem fortlaufenden Erzählstil.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird direkt wiedergegeben; seine Wiederholung im Begründungssatz bleibt erhalten.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: מזבח ist die übliche Bezeichnung für einen Opferaltar; der unbestimmte Artikel entspricht natürlichem Deutsch.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: nannte den Ort
  rationale: קרא mit לְ bezeichnet hier die Namensgebung. „Nannte den Ort“ ist im Deutschen natürlicher als eine formale Wiedergabe mit „rief“.
- source_word: אֵל בֵּית אֵל
  choice: El-Bethel
  rationale: Die Wendung fungiert als der dem Ort gegebene Eigenname und wird daher transliteriert; ihre wahrscheinliche Bedeutung wird in einer Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Namensgebung ein; „denn“ verbindet die Sätze in würdigem, natürlichem Deutsch.
- source_word: נִגְלוּ
  choice: hatte sich … offenbart
  rationale: Das Nifal von גלה bezeichnet hier göttliche Selbstkundgabe. Das Plusquamperfekt verdeutlicht, dass das Offenbarungsgeschehen der Namensgebung vorausging.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Obwohl אֱלֹהִים formal pluralisch ist und hier mit einem pluralischen Verb steht, bezeichnet es im Zusammenhang den einen Gott, dem Jakob in Bethel begegnet war.
- source_word: אֵלָיו
  choice: ihm
  rationale: Die deutsche Dativkonstruktion „sich jemandem offenbaren“ gibt die Präpositionalverbindung idiomatisch wieder.
- source_word: בְּבָרְחוֹ
  choice: als er … floh
  rationale: Der Infinitivus constructus mit בְ bezeichnet den zeitlichen Umstand und wird natürlich als Temporalsatz wiedergegeben.
- source_word: מִפְּנֵי אָחִיו
  choice: vor seinem Bruder
  rationale: מִפְּנֵי bezeichnet bei Flucht das Entweichen vor einer Person. „Vor seinem Bruder fliehen“ ist die idiomatische deutsche Formulierung.
theological_decisions:
- issue: Pluralform אֱלֹהִים mit dem pluralischen Verb נִגְלוּ beim Bezug auf Israels Gott
  choice: 'Singularisch wiedergegeben: „Gott hatte sich ihm offenbart“'
  alternative: 'Formal pluralisch: „Götter hatten sich ihm offenbart“; knapper: „Gott war ihm erschienen“'
  rationale: Der Erzählzusammenhang verweist auf Jakobs frühere Begegnung mit dem einen Gott in Bethel. Die grammatische Pluralität darf im Deutschen nicht irreführend Polytheismus nahelegen; „sich offenbart“ bewahrt zugleich den Gedanken der Selbstkundgabe.
- issue: Übersetzung oder Transliteration von אֵל בֵּית אֵל
  choice: Der Ortsname steht als „El-Bethel“ im Haupttext.
  alternative: „Gott von Bethel“
  rationale: Da Jakob den Ort benennt, wird die Form als Eigenname bewahrt. Die wahrscheinliche Bedeutung bleibt durch die Fußnote zugänglich, ohne die Funktion als Ortsname einzuebnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürliche Hebraismen; die Wiederholung von „dort“ wird bewusst bewahrt.
