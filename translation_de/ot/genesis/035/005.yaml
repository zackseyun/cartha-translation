source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: de
  text: Da brachen sie auf. Ein Schrecken von Gott[a] kam über die Städte rings um sie, sodass sie den Söhnen Jakobs nicht nachjagten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »ein Schrecken Gottes«; möglicherweise auch: »ein gewaltiger Schrecken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Da brachen sie auf
  rationale: Das Verb נסע bezeichnet hier den Aufbruch zur Weiterreise. „Aufbrechen“ ist im modernen Deutsch natürlich und bewahrt den erzählerischen Fortgang des Waw-Konsekutivs.
- source_word: וַיְהִי ... עַל
  choice: kam über
  rationale: היה bedeutet formal „sein/geschehen/werden“; zusammen mit עַל gibt „kam über“ den ereignishaften Charakter und das hebräische Bild idiomatisch wieder.
- source_word: חִתַּת אֱלֹהִים
  choice: ein Schrecken von Gott
  rationale: חִתַּת bezeichnet Schrecken oder Entsetzen. Der Genitiv mit אֱלֹהִים kann die Herkunft von Gott ausdrücken; diese Deutung passt zum Schutz der Reisegruppe, ohne die formal mögliche Lesart „Schrecken Gottes“ zu verschweigen.
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: die Städte rings um sie
  rationale: Die knappe Formulierung gibt die umliegenden Städte natürlich wieder. „Städte“ bleibt als metonymische Bezeichnung für deren Bewohner erhalten.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: sodass sie ... nicht nachjagten
  rationale: Das Ergebnis des von Gott kommenden Schreckens wird im Deutschen durch „sodass“ verdeutlicht. רדף אחרי bedeutet „hinter jemandem herjagen/verfolgen“.
- source_word: בְּנֵי יַעֲקֹב
  choice: den Söhnen Jakobs
  rationale: Die ausdrücklich männliche Bezeichnung wird entsprechend dem hebräischen Text beibehalten.
theological_decisions:
- issue: Bedeutung der Genitivverbindung חִתַּת אֱלֹהִים
  choice: ein Schrecken von Gott
  alternative: der Schrecken Gottes; ein gewaltiger Schrecken
  rationale: Die gewählte Fassung versteht Gott als Ursprung des Schreckens und entspricht dem erzählerischen Zusammenhang göttlichen Schutzes. Da die hebräische Genitivverbindung auch formaler oder möglicherweise verstärkend verstanden werden kann, wird die genuine Mehrdeutigkeit in der Fußnote bewahrt.
- issue: Bezug von בְּנֵי יַעֲקֹב
  choice: den Söhnen Jakobs
  alternative: Jakobs Söhnen
  rationale: Der Ausdruck bezeichnet hier ausdrücklich Jakobs männliche Nachkommen; eine geschlechtsneutrale Wiedergabe würde diese Aussage abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den zügigen Erzählrhythmus; „nachjagen“ ist anschaulich und allgemein verständlich.
