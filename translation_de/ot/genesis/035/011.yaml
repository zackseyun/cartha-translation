source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: de
  text: 'Und Gott sagte zu ihm: „Ich bin Gott, der Allmächtige.[a] Sei fruchtbar und vermehre dich! Ein Volk und eine Gemeinschaft von Völkern werden von dir abstammen, und Könige werden aus deinen Lenden hervorgehen.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „El Schaddai“; traditionell „Gott, der Allmächtige“. Die genaue Bedeutung von „Schaddai“ ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Aus deinen Lenden“ ist eine hebräische Wendung für leibliche Nachkommen.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Singularform des Verbs und der Erzählzusammenhang zeigen, dass אֱלֹהִים hier als Bezeichnung für den einen Gott gebraucht wird.
- source_word: אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  rationale: Die traditionelle Bedeutungswiedergabe ist im Deutschen verständlich und würdig; die Unsicherheit der genauen Herleitung wird in einer Fußnote kenntlich gemacht.
- source_word: פְּרֵה וּרְבֵה
  choice: Sei fruchtbar und vermehre dich
  rationale: Die etablierte deutsche Wendung bildet beide Imperative ab und bewahrt den Anklang an die Schöpfungs- und Segensformel.
- source_word: גּוֹי
  choice: Volk
  rationale: Im Deutschen bezeichnet „Volk“ hier natürlicher als „Nation“ die verheißene Abstammungs- und Volksgemeinschaft.
- source_word: קְהַל גּוֹיִם
  choice: Gemeinschaft von Völkern
  rationale: קָהָל bezeichnet eine versammelte Gruppe oder Gemeinschaft. Die Wiedergabe bleibt nahe am Hebräischen und ist zugleich verständlich.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: werden von dir abstammen
  rationale: Das wörtliche „wird von dir sein“ meint im Zusammenhang genealogische Herkunft; „abstammen“ drückt dies im Deutschen klar aus.
- source_word: מְלָכִים
  choice: Könige
  rationale: Die direkte deutsche Entsprechung gibt den Begriff ohne unnötige Erweiterung wieder.
- source_word: מֵחֲלָצֶיךָ
  choice: aus deinem Leib
  rationale: Die Wendung bewahrt die körperliche Vorstellung leiblicher Abstammung, klingt im heutigen Deutsch jedoch natürlicher als „aus deinen Lenden“.
- source_word: יֵצֵאוּ
  choice: werden hervorgehen
  rationale: „Hervorgehen“ gibt im Zusammenhang das Entstammen aus der eigenen leiblichen Linie angemessen wieder.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El Schaddai
  rationale: Der Titel wird bedeutungsorientiert übersetzt, während die hebräische Form und die lexikalische Unsicherheit in der Fußnote erhalten bleiben.
- issue: Körperliche Konkretheit der Abstammungsverheißung
  choice: aus deinem Leib hervorgehen
  alternative: von dir abstammen / aus deinen Lenden hervorgehen
  rationale: Die Formulierung wahrt den Bezug auf leibliche Nachkommenschaft, ohne eine im modernen Deutsch unnötig altertümliche Wendung zu verwenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Segensformel bleibt bewusst traditionsnah; altertümliche Anatomiesprache wird im Haupttext vermieden und in der Fußnote dokumentiert.
