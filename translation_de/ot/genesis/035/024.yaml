lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktus-Pluralform von בֵּן leitet hier eine genealogische Aufzählung ein. Da unmittelbar zwei männliche Nachkommen genannt werden, ist „Söhne“ die genaue und natürliche Wiedergabe.
- source_word: רָחֵל
  choice: Rahels
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form „Rahel“ wiedergegeben; der Genitiv entspricht der hebräischen Konstruktusverbindung.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Personenname wird gemäß der üblichen deutschen biblischen Namensform wiedergegeben.
- source_word: וּ/בִנְיָמִן
  choice: und Benjamin
  rationale: Die Konjunktion וּ wird schlicht mit „und“ wiedergegeben; für בִנְיָמִן wird die etablierte deutsche Namensform „Benjamin“ verwendet.
