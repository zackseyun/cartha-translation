  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: de
  text: Während Israel in jenem Land wohnte, ging Ruben hin und schlief mit Bilha, der Nebenfrau seines Vaters. Israel hörte davon.[a] Nun waren die Söhne Jakobs zwölf an der Zahl.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Israel hörte.“ Das im Deutschen ergänzte „davon“ bezieht sich auf Rubens zuvor berichtete Tat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und die Söhne Jakobs waren zwölf.“ Der Satz dient wahrscheinlich als Übergang zur Aufzählung in den folgenden Versen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: Während … wohnte
  rationale: Die Konstruktion führt einen zeitlichen Hintergrund für die folgende Handlung ein. Die deutsche Wiedergabe mit „während“ gibt diese Funktion natürlich wieder, ohne die im heutigen Deutsch schwerfällige Formel „Und es geschah“ eigens abzubilden.
- source_word: בָּאָרֶץ הַהִוא
  choice: in jenem Land
  rationale: אֶרֶץ bezeichnet hier das betreffende Gebiet; „jenes Land“ bewahrt den rückverweisenden Charakter des hebräischen Ausdrucks.
- source_word: וַיֵּלֶךְ
  choice: ging … hin
  rationale: Das eigenständige Bewegungsverb bleibt erhalten und bildet wie im Hebräischen den Auftakt zu Rubens Handlung.
- source_word: וַיִּשְׁכַּב אֶת
  choice: schlief mit
  rationale: Dies ist im modernen Deutschen die geläufige, eindeutige Wendung für Geschlechtsverkehr. Sie wahrt die Direktheit des hebräischen Ausdrucks, ohne klinisch oder unnötig drastisch zu klingen.
- source_word: פִּילֶגֶשׁ
  choice: Nebenfrau
  rationale: „Nebenfrau“ bezeichnet verständlich eine Frau mit anerkannter, aber gegenüber einer Hauptfrau nachgeordneter Stellung im antiken Haushalt. „Konkubine“ wäre ebenfalls möglich, wirkt heute jedoch fremdsprachlicher und kann moderne Assoziationen wecken.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: Israel hörte davon
  rationale: Im Hebräischen bleibt das Gehörte unausgesprochen; „davon“ verweist im Deutschen natürlich auf Rubens unmittelbar zuvor berichtete Tat.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Nun waren die Söhne Jakobs zwölf an der Zahl
  rationale: Die Formulierung gibt die Zahlenaussage eng wieder. „Nun“ kennzeichnet den wahrscheinlichen Übergang zur anschließenden Aufzählung, ohne eine Reaktion Israels in den Text hineinzulesen.
theological_decisions:
- issue: Wiedergabe des sexuellen Ausdrucks
  choice: schlief mit
  alternative: lag bei; hatte Geschlechtsverkehr mit
  rationale: „Schlief mit“ ist gegenwärtiges, klares Standarddeutsch und verschleiert die schwere sexuelle Verfehlung nicht. „Lag bei“ klingt heute altertümlich, während „hatte Geschlechtsverkehr mit“ stärker auslegt und klinischer wirkt.
- issue: Israels Reaktion auf Rubens Tat
  choice: Nur das Hören wird berichtet
  alternative: Eine emotionale, moralische oder richterliche Reaktion Israels ergänzen
  rationale: Der hebräische Text sagt lediglich, dass Israel hörte. Die Übersetzung ergänzt deshalb keine Empörung, kein Schweigen und keine unmittelbare Sanktion.
- issue: Funktion des letzten Satzes
  choice: Als Übergang zur Liste der Söhne wiedergegeben
  alternative: Den Satz als Aussage über die Folgen von Rubens Tat deuten
  rationale: Die Klausel leitet wahrscheinlich zur folgenden Aufzählung über. Ihre Nähe zu Rubens Tat rechtfertigt keine zusätzliche theologische oder psychologische Verknüpfung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp und direkt; altertümliche Formeln wie „Und es begab sich“ und die heute weniger natürliche sexuelle Wendung „lag bei“ werden vermieden. „Nebenfrau“ wird wegen seiner Verständlichkeit gegenüber „Konkubine“ bevorzugt.
