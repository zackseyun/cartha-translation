  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: de
  text: 'Als sie schwere Wehen hatte, sagte die Hebamme zu ihr: »Hab keine Angst, denn auch dieses Kind ist dein Sohn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Als sie bei der Geburt große Mühe hatte
  rationale: Die Konstruktion bezeichnet den Zeitpunkt und die Schwierigkeit des Gebärens. Die deutsche Formulierung ist natürlich und gibt die Schwere der Geburt wieder, ohne zusätzliche medizinische Einzelheiten einzutragen.
- source_word: הַמְיַלֶּדֶת
  choice: die Hebamme
  rationale: Das substantivierte Partizip bezeichnet die Frau, die bei der Geburt hilft; »Hebamme« ist die präzise und geläufige deutsche Entsprechung.
- source_word: אַל תִּירְאִי
  choice: Hab keine Angst
  rationale: Die direkte Verneinung von ירא dient hier der Beruhigung. Diese Formulierung ist in modernem Deutsch unmittelbar und verständlich.
- source_word: כִּי גַם זֶה לָךְ בֵּן
  choice: denn auch dieses Kind ist für dich ein Sohn
  rationale: »Denn« gibt den begründenden Gebrauch von כִּי wieder. »Auch dieses Kind« bewahrt den hinweisenden und hinzufügenden Sinn von גַּם זֶה; »ist für dich ein Sohn« hält die Dativkonstruktion לָךְ בֵּן sichtbar, ohne sie als bloße Besitzangabe aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede der Hebamme ist unmittelbar und tröstend; die abschließende Formulierung bleibt bewusst näher an der hebräischen Dativkonstruktion, auch wenn sie leicht markiert klingt.
