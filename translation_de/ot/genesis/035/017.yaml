    issue: Unnatürliche und missverständliche Wiedergabe von לָךְ בֵּן
    rationale: „Auch dieses Kind ist für dich ein Sohn“ klingt im modernen Standarddeutsch markiert und kann nahelegen, das Kind sei nur in einem eingeschränkten Sinn „für“ die Mutter ein Sohn. „Auch dieses Kind ist dein Sohn“ gibt die Zugehörigkeits-/Resultatsnuance des hebräischen Dativs natürlich wieder.
  - severity: low
    issue: „Große Mühe bei der Geburt“ ist weniger idiomatisch als „schwere Wehen“
    rationale: Die hebräische Wendung bezeichnet eine schwere bzw. schwierige Geburt. „Schwere Wehen“ ist im Deutschen eine natürliche und hinreichend genaue Entsprechung, ohne medizinische Details hinzuzufügen.
