source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: de
  text: Lasst uns aufbrechen und nach Bethel hinaufziehen. Dort will ich dem Gott einen Altar bauen, der mich am Tag meiner Not erhört hat[a] und auf dem Weg, den ich gegangen bin, bei mir war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mich am Tag meiner Not erhört“. Das hebräische Partizip kann Gott auch allgemein oder fortdauernd als den beschreiben, der erhört.'
    reason: 'Lexikalisch-grammatische Alternative: Das Partizip lässt neben dem Rückblick auf ein vergangenes Ereignis auch eine charakteristische oder fortdauernde Aussage zu.'
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Lasst uns aufbrechen
  rationale: Der Kohortativ der ersten Person Plural drückt eine gemeinsame Aufforderung aus. „Aufbrechen“ gibt den Aufruf zum Losgehen in natürlichem, modernem Deutsch wieder.
- source_word: וְנַעֲלֶה
  choice: und nach Bethel hinaufziehen
  rationale: עלה bezeichnet das Hinaufgehen. „Hinaufziehen“ bewahrt die räumliche Nuance und passt idiomatisch zu einer Reisegruppe.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben und nicht als „Haus Gottes“ übersetzt.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: Dort will ich … einen Altar bauen
  rationale: עשה bedeutet allgemein „machen/tun“; bei einem Altar ist „bauen“ im Deutschen die natürliche Verbindung. „Will ich“ wahrt hier die voluntative Zukunftsaussage.
- source_word: לָאֵל
  choice: dem Gott
  rationale: Die Präposition ל bezeichnet die Widmung des Altars. Der bestimmte Ausdruck wird durch den folgenden Relativsatz näher gekennzeichnet.
- source_word: הָעֹנֶה אֹתִי
  choice: der mich … erhört hat
  rationale: Das Partizip bezeichnet Gott durch sein Antworten auf Jakob. Im rückblickenden Zusammenhang gibt das Perfekt den Bezug auf die erfahrene Hilfe natürlich wieder; „erhören“ entspricht im Deutschen dem Antworten Gottes auf einen Hilferuf.
- source_word: בְּיוֹם צָרָתִי
  choice: am Tag meiner Not
  rationale: Die Wendung bewahrt das hebräische Bild vom „Tag“ und gibt צָרָה verständlich und ohne unnötige Spezifizierung als „Not“ wieder.
- source_word: וַיְהִי עִמָּדִי
  choice: und … bei mir war
  rationale: Die einfache Vergangenheitsform gibt die erzählte Erfahrung der göttlichen Gegenwart direkt wieder.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: auf dem Weg, den ich gegangen bin
  rationale: Die Formulierung bewahrt sowohl das konkrete Wegbild von דרך als auch das Verb des Gehens, bleibt dabei aber verständliches heutiges Deutsch.
theological_decisions:
- issue: Bezug und Bestimmtheit von אֵל
  choice: dem Gott
  alternative: Gott
  rationale: Der hebräische Ausdruck ist bestimmt und wird durch den Relativsatz anhand von Gottes Handeln an Jakob identifiziert. „Dem Gott“ wahrt diese konkrete Bekenntnisaussage, ohne zusätzliche Dogmatik einzutragen.
- issue: Zeitliche Bedeutung des Partizips הָעֹנֶה
  choice: der mich … erhört hat
  alternative: der mich … erhört
  rationale: Der Zusammenhang blickt auf eine konkrete frühere Notsituation zurück. Zugleich kann das hebräische Partizip Gott allgemein oder fortdauernd als den Erhörenden kennzeichnen; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lasst uns aufbrechen“ vermeidet archaisches „Lasst uns aufstehen“, während „hinaufziehen“ die Bewegungsrichtung erhält. Der Fußnotenmarker steht unmittelbar bei der zeitlich mehrdeutigen Aussage.
