  text: וַ/תָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַ/תִּקָּבֵ֛ר מִ/תַּ֥חַת לְ/בֵֽית אֵ֖ל תַּ֣חַת הָֽ/אַלּ֑וֹן וַ/יִּקְרָ֥א שְׁמ֖/וֹ אַלּ֥וֹן בָּכֽוּת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: de
  text: Debora, Rebekkas Amme, starb und wurde unterhalb von Bethel unter der Eiche[a] begraben. Er nannte ihn Allon-Bachut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort אַלּוֹן kann eine Eiche oder eine Terebinthe bezeichnen; die genaue Baumart ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Allon-Bachut bedeutet wahrscheinlich „Eiche des Weinens“; falls אַלּוֹן eine Terebinthe bezeichnet, entsprechend „Terebinthe des Weinens“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: Amme
  rationale: Das Substantiv bezeichnet eine Frau, die ein Kind stillt und betreut. „Amme“ gibt diese Rolle im Deutschen präzise und knapp wieder und passt zu Deboras fortdauernder Verbindung mit Rebekka.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: unterhalb von Bethel
  rationale: Die Wendung bezeichnet hier eine tiefer gelegene Stelle bei Bethel, ohne zwingend eine Himmelsrichtung anzugeben.
- source_word: תַּחַת הָאַלּוֹן
  choice: unter der Eiche
  rationale: תַּחַת bedeutet „unter“. אַלּוֹן wird traditionell und wahrscheinlich zutreffend mit „Eiche“ wiedergegeben; da auch eine Terebinthe gemeint sein kann, wird die Unsicherheit in einer Fußnote bewahrt.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Er gab ihr den Namen
  rationale: Das hebräische Verb ist aktiv und hat ein unausgesprochenes männliches Subjekt. „Er“ wahrt diese Form, ohne den Handelnden ausdrücklich mit Jakob gleichzusetzen. Das feminine Pronomen bezieht sich im Deutschen natürlich auf die Eiche.
- source_word: אַלּוֹן בָּכוּת
  choice: Allon-Bachut
  rationale: Der Orts- beziehungsweise Baumname wird in deutscher Umschrift beibehalten. Seine verständliche Bedeutung wird in einer Fußnote angegeben.
- source_word: וַתִּקָּבֵר
  choice: wurde … begraben
  rationale: Die Nifalform ist passiv; die Übersetzung führt daher keine ungenannten Bestattenden ein.
- source_word: וַתָּמָת
  choice: starb
  rationale: Die direkte Formulierung entspricht der schlichten Aussage des hebräischen Verbs.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Amme“ ist hier als präzise Rollenbezeichnung beibehalten. Die aktive Namensgebung und das im Hebräischen nicht ausdrücklich genannte männliche Subjekt bleiben erhalten; die unsichere Baumart wird nicht im Haupttext ausgebreitet, sondern erläutert.
