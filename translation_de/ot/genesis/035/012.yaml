source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: de
  text: Und das Land, das ich Abraham und Isaak gegeben habe[a], werde ich dir geben; und deinen Nachkommen nach dir werde ich das Land geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das ich Abraham und Isaak gab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht ein kollektiver Singular: „deinem Samen“; gemeint sein kann die Nachkommenschaft beziehungsweise können die Nachkommen sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Verheißung an die Erzväter bezeichnet אֶרֶץ das zugesagte Land; „das Land“ ist präzise und im Deutschen natürlich.
- source_word: נָתַתִּי
  choice: ich … gegeben habe
  rationale: Das hebräische Qatal bezeichnet hier die vorausgehende Gabe beziehungsweise Zusage an Abraham und Isaak. Das deutsche Perfekt gibt den Rückbezug natürlich wieder; das Präteritum „gab“ ist ebenfalls möglich.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: Abraham und Isaak
  rationale: Bei „geben“ werden beide Empfänger im Deutschen idiomatisch ohne wiederholte Präposition genannt; der Bezug auf beide bleibt eindeutig.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: werde ich dir geben
  rationale: Das feminine Objektsuffix verweist auf „das Land“. Da dieses bereits als vorangestelltes Objekt genannt ist, ist kein zusätzliches „es“ nötig.
- source_word: זַרְעֲךָ
  choice: deinen Nachkommen
  rationale: זֶרַע ist grammatisch singularisch, kann aber kollektiv die Nachkommenschaft bezeichnen. „Nachkommen“ ist im heutigen Deutsch natürlich und lässt den kollektiven Umfang offen.
- source_word: אַחֲרֶיךָ
  choice: nach dir
  rationale: Die Wendung bezeichnet die zeitliche und generationelle Folge und lässt sich unmittelbar mit „nach dir“ wiedergeben.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: werde ich das Land geben
  rationale: Die Wiederholung von „geben“ und „das Land“ wird entsprechend dem Hebräischen bewahrt und unterstreicht die erneuerte Verheißung.
theological_decisions:
- issue: Verhältnis zwischen bereits erfolgter und künftiger Gabe des Landes
  choice: נָתַתִּי wird rückblickend mit „gegeben habe“ wiedergegeben, die folgenden Verben dagegen zukünftig mit „werde … geben“.
  alternative: „gab“ für נָתַתִּי oder eine stärker gegenwartsbezogene Wiedergabe wie „gegeben habe“ mit ausdrücklicher Betonung fortdauernder Gültigkeit.
  rationale: Der Text stellt die vorausgehende göttliche Gabe beziehungsweise Zusage an Abraham und Isaak neben die künftige Gabe an Jakob und seine Nachkommen. Diese zeitliche und theologische Spannung wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur und die Wiederholung des Landesmotivs bleiben nahe am Hebräischen, ohne unnatürlich zu wirken. Sämtliche Fußnotenmarker stehen im Haupttext.
