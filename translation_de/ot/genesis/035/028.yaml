  rationale: Eingebürgerte deutsche Namensform.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: 180 Jahre
  rationale: Das Hebräische nennt die Summe als »hundert Jahr und achtzig Jahr«. Im modernen Deutschen wird die Gesamtzahl verbunden und »Jahre« im Plural gesetzt.
