lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: Die Söhne Leas
  rationale: Der Konstruktus Plural bezeichnet hier Leas männliche Kinder, die anschließend namentlich aufgezählt werden. Der deutsche Genitiv ist knapp und natürlich.
- source_word: בְּכֹר יַעֲקֹב
  choice: Jakobs Erstgeborener
  rationale: Die Wiedergabe bewahrt sowohl den Begriff der Erstgeburt als auch die Zuordnung zu Jakob; Ruben wird in der folgenden Apposition als der Erstgeborene identifiziert.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: לֵוִי
  choice: Levi
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: וְ
  choice: Kommas und abschließendes „und“
  rationale: Die wiederholte hebräische Konjunktion bildet eine Aufzählung. Im heutigen Standarddeutsch wird sie idiomatisch durch Kommas und ein „und“ vor dem letzten Namen wiedergegeben.
