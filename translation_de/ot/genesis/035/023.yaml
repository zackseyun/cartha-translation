  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: de
  text: 'Die Söhne Leas: Jakobs Erstgeborener[a], Ruben, Simeon, Levi, Juda, Issachar und Sebulon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Förmlicher: »der Erstgeborene Jakobs, Ruben«.'
