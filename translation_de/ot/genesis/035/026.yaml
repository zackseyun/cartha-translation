source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: de
  text: 'Und die Söhne Silpas[a], der Dienerin Leas: Gad und Ascher. Das sind die Söhne Jakobs, die ihm in Paddan-Aram[b] geboren wurden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Gewichtung ihres gesellschaftlichen Status auch mit „Magd“, „Sklavin“ oder „versklavte Frau“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Die zusammenfassende Aussage, diese Söhne seien Jakob in Paddan-Aram geboren worden, steht in Spannung zu den Versen 16–18, nach denen Benjamin in Kanaan geboren wurde. Der hebräische Text nennt hier keine ausdrückliche Ausnahme.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי bezeichnet hier ausdrücklich die Söhne und führt den letzten Teil der genealogischen Aufzählung fort.
- source_word: זִלְפָּה
  choice: Silpa
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שִׁפְחַת
  choice: der Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Person in einem abhängigen Dienst- beziehungsweise Sklavereiverhältnis. „Dienerin“ ist im Haupttext natürlich und würdevoll; eine Fußnote macht die mögliche stärkere Wiedergabe transparent.
- source_word: לֵאָה
  choice: Leas
  rationale: Die hebräische Genitivverbindung wird im Deutschen knapp und idiomatisch als Genitiv des Namens wiedergegeben.
- source_word: גָּד וְאָשֵׁר
  choice: Gad und Ascher
  rationale: Die Personennamen erscheinen in den geläufigen deutschen biblischen Formen; die Konjunktion wird direkt wiedergegeben.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Das sind die Söhne Jakobs
  rationale: Die identifizierende Zusammenfassung wird in natürlichem Deutsch formuliert; „Söhne“ bewahrt die geschlechtsspezifische Bedeutung des Hebräischen.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: die ihm … geboren wurden
  rationale: Die passive Form mit לוֹ wird eng am Hebräischen wiedergegeben, ohne eine im Satz nicht ausdrücklich genannte Mutter einzuführen.
- source_word: בְּפַדַּן אֲרָם
  choice: in Paddan-Aram
  rationale: Der Ortsname wird transliteriert und entsprechend verbreiteter deutscher Schreibweise mit Bindestrich gesetzt.
theological_decisions:
- issue: Zusammenfassende Ortsangabe trotz Benjamins Geburt in Kanaan
  choice: Die Aussage des Verses wird unverändert als zusammenfassende Ortsangabe wiedergegeben und die Spannung in einer Fußnote benannt.
  alternative: Die Ortsangabe ausdrücklich auf einzelne Söhne zu beschränken oder Benjamin im Haupttext auszunehmen.
  rationale: Der hebräische Wortlaut enthält keine ausdrückliche Ausnahme. Eine solche Einschränkung im Haupttext würde die Spannung zu Genesis 35,16–18 eigenmächtig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem genealogischem Stil. Die traditionelle, aber heute weniger eindeutige Bezeichnung „Magd“ wird im Haupttext vermieden; die historische soziale Abhängigkeit bleibt durch die Fußnote sichtbar. Die Spannung der Ortsangabe wird nicht harmonisierend aufgelöst.
