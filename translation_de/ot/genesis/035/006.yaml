  text: וַ/יָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָ/ה אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית אֵ֑ל ה֖וּא וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: de
  text: Jakob kam nach Lus (das heißt Bethel[a]) im Land Kanaan, zusammen mit allen Leuten, die mit ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Lus … das ist Bethel“. Damit bleiben sowohl der ältere Ortsname als auch seine bekanntere Bezeichnung erhalten.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: So kam
  rationale: Das Qal-Wayyiqtol von בוא bezeichnet hier das Ankommen am Ziel; „kam“ entspricht dem hebräischen Erzählstil, während „so“ den Fortgang der Handlung wiedergibt.
- source_word: לוּזָה
  choice: nach Lus
  rationale: Der Ortsname לוּז mit direktionalem He bezeichnet die Bewegung auf den Ort zu; im Deutschen wird dies natürlich mit „nach Lus“ ausgedrückt.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: im Land Kanaan
  rationale: Die relative Ortsangabe wird knapp und idiomatisch an die gesamte Ortsbezeichnung angeschlossen.
- source_word: הִוא בֵּית אֵל
  choice: das ist Bethel
  rationale: Das Pronomen mit dem Ortsnamen identifiziert Lus erklärend als Bethel und bewahrt beide Namen.
- source_word: הוּא
  choice: er
  rationale: Das wiederaufnehmende Pronomen bezieht sich auf Jakob und leitet die nachgestellte Angabe zu seinen Begleitern ein.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: und alle Menschen, die bei ihm waren
  rationale: עָם bezeichnet hier Jakobs Begleitgruppe, nicht zwingend ein Volk im ethnischen Sinn; „alle Menschen“ ist im modernen Deutsch klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Klammer macht die erklärende Identifikation des Ortes deutlich; der anschließende Nachtrag „er und alle Menschen …“ bewahrt die hebräische Satzstruktur, ohne unnötig altertümlich zu wirken.
