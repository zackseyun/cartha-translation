    rationale: Die sehr nahe am Hebräischen gebildete Nachtragskonstruktion ist im modernen Standarddeutsch schwerfällig. „zusammen mit“ bewahrt den Sinn des wiederaufnehmenden Pronomenanschlusses in natürlicher Syntax.
