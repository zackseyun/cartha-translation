  source_fidelity: Der Entwurf gibt Zielbewegung, Ortsidentifikation, die Lokalisierung in Kanaan sowie Jakobs Begleitgruppe sachgerecht wieder. Das resumptive הוּא wird im Deutschen am natürlichsten durch eine Konstruktion mit „zusammen mit“ aufgenommen.
  naturalness: „Alle Menschen, die bei ihm waren“ wirkt im Deutschen etwas unidiomatisch und kann bloße räumliche Nähe ausdrücken. „Alle Leute, die mit ihm waren“ ist natürlicher. Die explizite Anschlussformulierung „zusammen mit“ verhindert zudem einen schwer lesbaren Nachtrag.
  terminology: „Lus“, „Bethel“ und „Kanaan“ sind etablierte deutsche Formen. „Das heißt Bethel“ gibt die erklärende Identifikation idiomatisch wieder, ohne mehr als die hebräische Apposition zu behaupten.
