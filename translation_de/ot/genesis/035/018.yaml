id: GEN.35.18
reference: Genesis 35:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: de
  text: Und als ihr Leben entschwand – denn sie lag im Sterben –, gab sie ihm den Namen Ben-Oni[a]; sein Vater aber nannte ihn Benjamin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Oni bedeutet wahrscheinlich »Sohn meines Schmerzes« oder »Sohn meines Leids«.
    reason: lexical_alternative
  - marker: b
    text: Benjamin bedeutet wahrscheinlich »Sohn der rechten Hand«; manche verstehen den Namen als »Sohn des Südens«.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: als ihr Leben entschwand
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang des Sterbens am natürlichsten das Leben. „Entschwand“ gibt das allmähliche Ausgehen wieder, ohne eine technische Aussage über die Seele einzutragen.
- source_word: כִּי מֵתָה
  choice: denn sie lag im Sterben
  rationale: Die Klausel erläutert das Entschwinden ihres Lebens. Die Verlaufsform wahrt, dass die Namensgebung noch während ihres Sterbens geschieht.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: gab sie ihm den Namen
  rationale: Diese natürliche deutsche Namensformel bewahrt den Sinn des hebräischen Ausdrucks und bildet einen klaren Parallelismus zur Benennung durch den Vater.
- source_word: בֶּן אוֹנִי
  choice: Ben-Oni
  rationale: Der Eigenname wird transliteriert; seine erzählerisch bedeutsame, aber nicht völlig eindeutige Bedeutung wird in einer Fußnote erläutert.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: sein Vater aber nannte ihn
  rationale: „Aber“ bringt den sachlichen Gegensatz zwischen der Benennung durch die Mutter und der Umbenennung durch den Vater natürlich zum Ausdruck.
- source_word: בִנְיָמִין
  choice: Benjamin
  rationale: Die im Deutschen etablierte Form des Eigennamens steht im Haupttext; mögliche Namensbedeutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ im Zusammenhang des Todes
  choice: Im Haupttext mit „Leben“ wiedergegeben
  alternative: Seele
  rationale: Das hebräische Wort kann das Leben beziehungsweise die lebende Person bezeichnen und muss hier keine technische Aussage über eine vom Körper ausfahrende immaterielle Seele machen. „Leben“ wahrt den erzählerischen Sinn und lässt weitergehende anthropologische Fragen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Erzählfolge, bleibt aber idiomatisch. „Entschwand“ ist leicht gehoben, jedoch allgemein verständlich und dem feierlichen Kontext angemessen.
