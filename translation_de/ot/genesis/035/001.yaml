id: GEN.35.1
reference: Genesis 35:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: de
  text: 'Dann sagte Gott zu Jakob: »Mach dich auf, zieh hinauf nach Bethel und lass dich dort nieder. Errichte dort einen Altar für den Gott, der dir erschien, als du vor deinem Bruder Esau flohst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Dann« gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort hier aufgrund des singularischen Verbs und des Kontexts den einen Gott.
- source_word: קוּם
  choice: Mach dich auf
  rationale: Der Imperativ fordert Jakob zum Aufbruch auf. »Mach dich auf« ist würdevoll, verständlich und passt zur Verbindung mit dem folgenden Bewegungsverb.
- source_word: עֲלֵה בֵית אֵל
  choice: zieh hinauf nach Bethel
  rationale: »Hinaufziehen« bewahrt die Richtungs- beziehungsweise Höhenangabe; »nach« ist bei einem Ortsnamen im Deutschen idiomatisch.
- source_word: וְשֶׁב שָׁם
  choice: und lass dich dort nieder
  rationale: ישׁב kann sitzen, bleiben oder wohnen bedeuten. Im Zusammenhang bezeichnet es einen Aufenthalt beziehungsweise eine Niederlassung in Bethel; die Formulierung bewahrt diese Bedeutungsbreite natürlicher als »wohne dort«.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Errichte dort einen Altar
  rationale: עשה bedeutet allgemein »machen/tun«; in Verbindung mit einem Altar ist »errichten« im Deutschen die natürliche und sachlich genaue Entsprechung.
- source_word: לָאֵל
  choice: für den Gott
  rationale: Die Präposition ל kennzeichnet hier die Widmung des Altars. Der bestimmte Ausdruck wird durch den folgenden Relativsatz näher bestimmt.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: der dir erschien
  rationale: Der Niphal-Ausdruck bezeichnet in diesem Theophanie-Kontext das Erscheinen Gottes, ohne durch »offenbarte sich« zusätzliche Deutung einzutragen.
- source_word: בְּבָרְחֲךָ
  choice: als du ... flohst
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand und wird idiomatisch mit einem temporalen Nebensatz wiedergegeben.
- source_word: מִפְּנֵי עֵשָׂו אָחִיךָ
  choice: vor deinem Bruder Esau
  rationale: מִפְּנֵי bedeutet wörtlich »vom Angesicht/von der Gegenwart«, ist hier aber die übliche hebräische Wendung für die Flucht vor einer Person. »Vor deinem Bruder Esau fliehen« ist im Deutschen präzise und natürlich.
theological_decisions:
- issue: Bezug von אֱלֹהִים
  choice: Der eine Gott spricht zu Jakob
  alternative: Götter oder ein Mitglied eines Götterrates
  rationale: Das Verb steht im Singular, und der Erzählzusammenhang identifiziert den Sprecher eindeutig als den Gott, der Jakob zuvor erschienen war.
- issue: Wiedergabe von בֵית אֵל
  choice: Bethel als Ortsname transliterieren
  alternative: Gotteshaus beziehungsweise Haus Gottes
  rationale: Hier fungiert der Ausdruck als etablierter Ortsname; eine Übersetzung seiner Namensbedeutung würde im Haupttext Ort und Deutung vermischen.
- issue: Bestimmte Formulierung לָאֵל הַנִּרְאֶה
  choice: für den Gott, der dir erschien
  alternative: für Gott, der dir erschien
  rationale: Der Artikel und der attributive Relativsatz identifizieren Gott anhand seines früheren Erscheinens; die deutsche bestimmte Formulierung erhält diese Struktur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Befehlsfolge bleibt klar und knapp. »Mach dich auf« und »zieh hinauf« bewahren den feierlichen Erzählton, ohne altertümlich zu wirken. Keine Fußnote ist nötig, da das deutsche »vor jemandem fliehen« den hebräischen Sinn von מִפְּנֵי vollständig und idiomatisch wiedergibt.
