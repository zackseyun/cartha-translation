  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: de
  text: Und Jakob kam zu seinem Vater Isaak nach Mamre, Kirjat-Arba (das ist Hebron), wo Abraham und Isaak als Fremde gelebt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet, sich als Fremder oder als vorübergehend Ansässiger an einem Ort aufzuhalten, nicht einfach nur dort zu wohnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das Verb בוא bezeichnet hier Jakobs Ankunft bei Isaak; „kam“ entspricht der Erzählperspektive und ist im Deutschen natürlich.
- source_word: אֶל יִצְחָק אָבִיו
  choice: zu seinem Vater Isaak
  rationale: Die Richtungsangabe und das Verwandtschaftsverhältnis werden vollständig und in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Der Ortsname wird nach den üblichen deutschen Namensformen transliteriert.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Kirjat-Arba
  rationale: Der Ortsname bleibt als Toponym erhalten; die folgende Gleichsetzung nennt den Ort Hebron.
- source_word: הִוא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die identifizierende Aussage wird knapp und verständlich als erläuternde Apposition wiedergegeben.
- source_word: אֲשֶׁר ... שָׁם
  choice: wo
  rationale: Bei einem Ortsbezug gibt „wo“ die hebräische Relativkonstruktion mit dem Ortsadverb idiomatisch wieder.
- source_word: גָּר
  choice: als Fremde gelebt hatten
  rationale: גור meint nicht bloß wohnen, sondern den Aufenthalt als Fremder beziehungsweise nicht dauerhaft Ansässiger. Das Plusquamperfekt ordnet diesen Aufenthalt vor Jakobs Ankunft ein.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham und Isaak
  rationale: Die Personennamen folgen den etablierten deutschen Bibelnamensformen.
