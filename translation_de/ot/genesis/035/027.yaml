  register: Modernes, würdiges Standarddeutsch. Die doppelte Richtungsangabe „nach Mamre, nach Kirjat-Arba“ bewahrt die knappe hebräische Ortsapposition, ohne eine nicht ausdrücklich genannte räumliche Beziehung wie „bei“ oder „in“ einzuführen.
