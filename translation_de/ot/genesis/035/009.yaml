  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: de
  text: Gott erschien[a] Jakob noch einmal, als er aus Paddan-Aram kam, und er segnete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott offenbarte sich Jakob noch einmal.“ Das hebräische Verb kann ein Erscheinen oder ein Sichzeigen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier ein Sichtbarwerden beziehungsweise eine Offenbarung. „Erschien“ ist im Deutschen natürlich und lässt die Art der göttlichen Manifestation offen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die singuläre Verbform und der Erzählzusammenhang zeigen, dass der eine Gott gemeint ist.
- source_word: עוֹד
  choice: noch einmal
  rationale: Das Adverb bezeichnet hier die Wiederholung einer früheren Erscheinung; „noch einmal“ gibt dies in natürlichem Deutsch wieder.
- source_word: בְּבֹאוֹ
  choice: als er … kam
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix hat hier temporale Bedeutung.
- source_word: מִפַּדַּן אֲרָם
  choice: aus Paddan-Aram
  rationale: Der Ortsname wird transliteriert; „aus“ gibt die Herkunftsangabe mit מִן idiomatisch wieder.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: und er segnete ihn
  rationale: ברך im Piel bedeutet „segnen“. Beide Pronomen bleiben erhalten, sodass die Subjekt-Objekt-Beziehung ausdrücklich wiedergegeben wird.
theological_decisions:
- issue: Art der göttlichen Erscheinung
  choice: Gott erschien Jakob noch einmal.
  alternative: Gott offenbarte sich Jakob noch einmal.
  rationale: Der Vers berichtet eine wirkliche göttliche Manifestation, legt deren Art aber nicht fest. „Erschien“ bewahrt diese Offenheit, ohne das Geschehen zu vergeistigen oder als Vision zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der hebräischen Abfolge, vermeidet jedoch eine unnatürlich wörtliche Wiedergabe der temporalen Infinitivkonstruktion.
