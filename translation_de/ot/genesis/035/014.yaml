  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: de
  text: Und Jakob richtete an dem Ort, an dem Gott mit ihm gesprochen hatte, ein Steinmal auf. Er goss ein Trankopfer darüber aus und goss Öl darüber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: richtete … auf
  rationale: Der Hifil von נצב bezeichnet hier das Aufstellen eines aufrecht stehenden Mals; „aufrichten“ ist im Deutschen konkret, natürlich und würdig.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: ein Steinmal
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein beziehungsweise ein steinernes Mal. „Steinmal“ gibt Gegenstand und Material knapp wieder, ohne die im Deutschen leicht architektonisch verstandene Bezeichnung „Säule“ zu erzwingen.
- source_word: בַּמָּקוֹם
  choice: an dem Ort
  rationale: Die lokative Wendung ist idiomatisches Standarddeutsch und entspricht dem hebräischen Bezug auf den Ort der Begegnung.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: wo er mit ihm gesprochen hatte
  rationale: Das Plusquamperfekt macht die zeitliche Vorordnung deutlich. Die beiden Pronomen bleiben wie im Hebräischen stehen; aus dem Kontext ist Gott als Sprecher und Jakob als Gesprächspartner erkennbar.
- source_word: וַיַּסֵּךְ … נֶסֶךְ
  choice: goss ein Trankopfer … aus
  rationale: Die Verbindung bezeichnet das rituelle Ausgießen einer Flüssigkeitsgabe. „Trankopfer“ ist verständlich und bewahrt den kultischen Sinn.
- source_word: וַיִּצֹק … שָׁמֶן
  choice: goss Öl darüber
  rationale: Das Hebräische nennt lediglich Öl; eine nähere Bestimmung als Olivenöl wäre eine sachlich plausible, aber nicht ausdrücklich gegebene Ergänzung.
theological_decisions:
- issue: Bedeutung von Jakobs Handlungen am Steinmal
  choice: Die Handlungen werden lediglich als Aufrichten, Ausgießen eines Trankopfers und Übergießen mit Öl beschrieben.
  alternative: Das Geschehen ausdrücklich als Weihehandlung oder als Errichtung eines Erinnerungsmals deuten.
  rationale: Der Vers beschreibt rituelle Handlungen, erklärt ihre theologische Bedeutung jedoch nicht ausdrücklich. Die Übersetzung fügt daher keine Deutung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die pronominale Mehrdeutigkeit des Relativsatzes wird entsprechend dem Hebräischen bewahrt; unnötige Fachsprache wird vermieden.
