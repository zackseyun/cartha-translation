  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: de
  text: Dann zog Israel weiter und schlug sein Zelt jenseits von Migdal-Eder[a] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-Eder bedeutet „Turm der Herde“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: zog … weiter
  rationale: נסע bezeichnet in der fortlaufenden Erzählung das Aufbrechen und Weiterziehen; die Formulierung gibt sowohl die Reisebewegung als auch die narrative Abfolge natürlich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text verwendet ausdrücklich den Namen Israel; er wird nicht zu Jakob harmonisiert.
- source_word: וַיֵּט
  choice: schlug … auf
  rationale: נטה bedeutet mit אֹהֶל als Objekt idiomatisch, ein Zelt aufzuschlagen bzw. auszuspannen.
- source_word: אָהֳלֹה
  choice: sein Zelt
  rationale: אֹהֶל bedeutet „Zelt“; das Suffix der 3. Person Singular maskulin wird mit „sein“ wiedergegeben.
- source_word: מֵהָלְאָה
  choice: jenseits von
  rationale: Der Ausdruck bezeichnet eine Lage weiter hinter beziehungsweise über einen Bezugspunkt hinaus; „jenseits von“ passt hier zur folgenden Ortsangabe.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-Eder
  rationale: Die Wortgruppe fungiert hier als Ortsname und wird daher transliteriert; ihre wörtliche Bedeutung wird in einer Fußnote angegeben.
