  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: de
  text: 'Da sagte Jakob zu seinem Haus und zu allen, die bei ihm waren: „Entfernt die fremden Götter, die unter euch sind, reinigt euch[a] und wechselt eure Kleider.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Reinigen kann hier eine rituelle Reinigung zur Vorbereitung auf die Begegnung mit Gott bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: seiner Hausgemeinschaft
  rationale: Das hebräische »Haus« bezeichnet hier nicht das Gebäude, sondern Jakobs häuslichen Personenverband. »Hausgemeinschaft« gibt diesen sozialen Sinn verständlich wieder.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: allen, die bei ihm waren
  rationale: Die Wendung bezeichnet sämtliche Personen, die Jakob begleiteten, und wird im Deutschen natürlich und quellennah wiedergegeben.
- source_word: הָסִרוּ
  choice: Schafft … weg
  rationale: Der Imperativ fordert die entschiedene Entfernung der betreffenden Kultgegenstände. »Wegschaffen« ist gegenwärtiges Deutsch und bewahrt die Befehlsstärke.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: die fremden Götter
  rationale: Die Konstruktverbindung kann Götter fremder Herkunft beziehungsweise fremder Verehrung bezeichnen. »Fremde Götter« wahrt diese Breite und klingt natürlich.
- source_word: בְּתֹכְכֶם
  choice: die sich unter euch befinden
  rationale: Die Formulierung bewahrt den räumlich-sozialen Sinn »in eurer Mitte/unter euch«, ohne ihn ausschließlich als persönlichen Besitz festzulegen.
- source_word: וְהִטַּהֲרוּ
  choice: reinigt euch
  rationale: Die reflexive Verbform verlangt Selbstreinigung; im Zusammenhang mit der bevorstehenden Gottesbegegnung bleibt eine rituelle Bedeutung möglich, ohne ausdrücklich ergänzt zu werden.
- source_word: וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם
  choice: wechselt eure Kleider
  rationale: Die direkte deutsche Wendung gibt sowohl das Wechseln als auch die gemeinte Kleidung klar und idiomatisch wieder.
theological_decisions:
- issue: Art der verlangten Reinigung
  choice: »reinigt euch« mit einer Fußnote zur möglichen rituellen Bedeutung
  alternative: »wascht euch« oder eine ausdrücklich zeremonielle Umschreibung
  rationale: Der Kontext legt eine kultische Vorbereitung auf die Begegnung mit Gott nahe, doch der Vers beschreibt weder die konkrete Handlung noch ein Ritual. Die Übersetzung bewahrt deshalb die theologische Bedeutungsspanne.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Hausgemeinschaft« vermeidet die Missdeutung eines Gebäudes; »fremde Götter« und »reinigt euch« bewahren die semantische beziehungsweise theologische Offenheit des Hebräischen.
