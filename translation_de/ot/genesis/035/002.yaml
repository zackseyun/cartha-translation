review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge der drei hebräischen Aufforderungen sowie die wesentlichen Bedeutungen zutreffend wieder: Entfernung der fremden Götter, Selbstreinigung und Wechsel der Kleidung. »Fremde Götter« wahrt die Bedeutung von אֱלֹהֵי הַנֵּכָר, und »reinigt euch« erhält den reflexiven sowie möglichen rituellen Sinn von וְהִטַּהֲרוּ.'
  naturalness: Die Aussage ist verständlich, doch »Schafft ... weg« und besonders »die sich unter euch befinden« wirken im knappen, würdevollen Duktus der Rede etwas umständlich. »Entfernt« und »die unter euch sind« sind idiomatischer und ebenso präzise.
  terminology: »Hausgemeinschaft« ist sachlich vertretbar, hat im heutigen Deutsch jedoch einen leicht verwaltungssprachlichen Klang. »Haus« ist im biblischen Kontext als Personenverband verständlich und bewahrt zugleich die Kürze und Offenheit des Hebräischen. Die Fußnote erklärt die mögliche rituelle Dimension angemessen, ohne sie zur einzigen Deutung zu machen.
  issues:
