    issue: Stilistisch umständliche Wiedergabe des ersten Imperativs und der Ortsangabe
    rationale: »Schafft die fremden Götter weg, die sich unter euch befinden« ist verständlich, aber weniger knapp und natürlich als »Entfernt die fremden Götter, die unter euch sind«. Die Änderung betrifft nicht die Bedeutung.
  - severity: low
    issue: Leicht technischer Klang von »Hausgemeinschaft«
    rationale: Für בֵּיתוֹ ist »Haus« im biblischen deutschen Sprachgebrauch eine natürliche Bezeichnung des Haushalts beziehungsweise Personenverbands. Es vermeidet den modern-institutionellen Beiklang von »Hausgemeinschaft«.
