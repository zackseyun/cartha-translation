  text: וַ/תָּ֖מָת רָחֵ֑ל וַ/תִּקָּבֵר֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔תָה הִ֖וא בֵּ֥ית לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: de
  text: So starb Rahel und wurde auf dem Weg nach Efrata[a] begraben (das ist Bethlehem).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efrata kann auch mit „Efrat“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: starb
  rationale: Die Form von מות bezeichnet hier unmittelbar den körperlichen Tod; „starb“ ist klar, schlicht und ohne beschönigenden Zusatz.
- source_word: רָחֵל
  choice: Rahel
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Form des Personennamens.
- source_word: וַתִּקָּבֵר
  choice: wurde … begraben
  rationale: Der Nifal von קבר wird entsprechend seiner passiven Bedeutung wiedergegeben. Ein nicht ausdrücklich vorhandenes „dort“ wird nicht ergänzt.
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: ב mit דֶּרֶךְ bezeichnet hier die Lage an beziehungsweise auf einer Reiseroute; die deutsche Wendung ist natürlich und lässt den genauen Punkt offen.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Die Endung -ָה kann bei Ortsnamen eine Richtungsangabe („nach Efrat“) oder Bestandteil der tradierten Namensform „Efrata“ sein. „Nach Efrata“ gibt den Zusammenhang natürlich wieder; die alternative Namensform wird in der Fußnote vermerkt.
- source_word: הִוא
  choice: das ist
  rationale: Das Pronomen identifiziert Efrata appositionell mit Bethlehem; „das ist“ bewahrt den erklärenden Charakter.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Die im Deutschen fest etablierte Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdevolles Standarddeutsch. Die Satzfolge des Hebräischen bleibt erkennbar, während die Ortsangabe idiomatisch als „auf dem Weg nach Efrata“ formuliert wird. Der Fußnotenmarker steht unmittelbar bei der erklärenden Wendung, entsprechend der konsultierten Fassung.
