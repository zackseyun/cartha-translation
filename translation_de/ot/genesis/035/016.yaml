  text: וַ/יִּסְעוּ֙ מִ/בֵּ֣ית אֵ֔ל וַֽ/יְהִי ע֥וֹד כִּבְרַת הָ/אָ֖רֶץ לָ/ב֣וֹא אֶפְרָ֑תָה וַ/תֵּ֥לֶד רָחֵ֖ל וַ/תְּקַ֥שׁ בְּ/לִדְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: de
  text: Dann brachen sie von Bethel auf. Als sie noch eine Wegstrecke bis Efrat[a] vor sich hatten, gebar Rahel, und sie hatte eine schwere Geburt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Efrata“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Dann brachen sie auf
  rationale: Das Verb נסע bezeichnet in der Erzählfolge häufig das Aufbrechen und Weiterziehen. „Sie brachen auf“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: מִבֵּית אֵל
  choice: von Bethel
  rationale: Der Ortsname wird nach der üblichen deutschen Form als „Bethel“ wiedergegeben.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: Als sie noch eine Wegstrecke … vor sich hatten
  rationale: Die seltene Wendung bezeichnet eine noch zurückzulegende Strecke, ohne deren genaue Länge anzugeben. „Eine Wegstrecke“ wahrt diese Unbestimmtheit.
- source_word: לָבוֹא אֶפְרָתָה
  choice: bis Efrat
  rationale: Die Infinitivverbindung bezeichnet das noch ausstehende Erreichen des Zielortes. In Verbindung mit „vor sich hatten“ ist „bis Efrat“ idiomatisch und präzise.
- source_word: אֶפְרָתָה
  choice: Efrat
  rationale: „Efrat“ ist eine geläufige deutsche Wiedergabe des Ortsnamens; die stärker formnahe Variante „Efrata“ wird in der Fußnote bewahrt.
- source_word: וַתֵּלֶד רָחֵל
  choice: gebar Rahel
  rationale: ילד mit weiblichem Subjekt bedeutet „gebären“. Die Formulierung ist knapp, klar und dem gehobenen Erzählregister angemessen.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: sie hatte eine schwere Geburt
  rationale: קשה beschreibt hier die große Schwierigkeit beim Gebären. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne zusätzliche medizinische Einzelheiten einzutragen.
