  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: de
  text: Dann stieg Gott von ihm auf an dem Ort, wo er mit ihm gesprochen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet ein Verb für „hinaufgehen“ oder „aufsteigen“ und bewahrt bei Gottes Fortgang aus der Begegnung ausdrücklich die Bewegung nach oben.
    reason: lexikalische Erläuterung
lexical_decisions:
- source_word: וַיַּעַל
  choice: fuhr … auf
  rationale: Das Qal von עלה bezeichnet ein Hinaufgehen oder Aufsteigen. „Fuhr … auf“ bewahrt die konkrete Aufwärtsbewegung und klingt in einer Gotteserscheinung würdevoll, ohne sie zum bloßen Weggehen abzuschwächen.
- source_word: מֵעָלָיו
  choice: von ihm
  rationale: Die Präposition bedeutet wörtlich etwa „von über ihm weg“. „Von ihm“ gibt den Ausgangspunkt der Bewegung im Deutschen natürlich wieder; die räumliche Aufwärtsrichtung bleibt im Verb erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch pluralisch ist, steht das Verb im Singular; im Erzählzusammenhang ist der eine Gott gemeint.
- source_word: בַּמָּקוֹם
  choice: an dem Ort
  rationale: ב mit מקום bezeichnet hier den Ort des Geschehens. „An dem Ort“ ist idiomatisches Standarddeutsch und bewahrt den ausdrücklichen Ortsbezug.
- source_word: אֲשֶׁר
  choice: wo
  rationale: Das Relativwort bezieht sich auf „Ort“; im Deutschen ist der lokale Anschluss mit „wo“ natürlich und klar.
- source_word: דִּבֶּר אִתּוֹ
  choice: mit ihm gesprochen hatte
  rationale: דבר im Piel mit אֵת bedeutet „mit jemandem sprechen“. Das Plusquamperfekt macht natürlich deutlich, dass das Gespräch der beschriebenen Auffahrt vorausging.
theological_decisions:
- issue: Räumliche beziehungsweise anthropomorphe Beschreibung von Gottes Fortgang
  choice: Die Aufwärtsbewegung wird mit „fuhr … auf“ beibehalten.
  alternative: „Gott ging von ihm fort“ oder „Gott zog sich von ihm zurück“
  rationale: Der hebräische Text verwendet gewöhnliche Sprache des Aufsteigens. Die Übersetzung bewahrt die theophanische räumliche Bildsprache, ohne Gottes Gegenwart philosophisch zu erklären oder die Bewegung zu einem bloßen Fortgehen umzudeuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem Erzählstil. „Fuhr … auf“ ist leicht gehoben, bewahrt hier aber die konkrete Aufwärtsbewegung natürlicher als das missverständliche „ging hinauf“; die Fußnote nennt die formal nähere Alternative.
