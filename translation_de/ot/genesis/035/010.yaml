source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: de
  text: 'Und Gott sagte zu ihm: »Dein Name ist Jakob. Du wirst nicht mehr Jakob heißen, sondern Israel wird dein Name sein.« Und er gab ihm den Namen Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und er nannte seinen Namen Israel«, das heißt: Er gab Jakob den Namen Israel. Auch möglich: »Und er nannte ihn Israel.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch plural ist, bezeichnet sie hier zusammen mit dem Verb im Singular eindeutig den einen Gott.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 2. Person Maskulin Singular; die Wiederholung im Hebräischen bleibt erhalten.
- source_word: לֹא יִקָּרֵא שִׁמְךָ עוֹד יַעֲקֹב
  choice: Du sollst nicht mehr Jakob heißen
  rationale: Die deutsche Wendung „heißen“ gibt das passive Benanntwerden idiomatisch wieder; „nicht mehr“ entspricht der Verbindung von לֹא und עוֹד.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Nach einer Verneinung kennzeichnet die Verbindung hier den Gegensatz und die Ersetzung: nicht Jakob, sondern Israel.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel soll dein Name sein
  rationale: Die Wortstellung bewahrt die Hervorhebung des neuen Namens; „soll“ entspricht dem erklärenden Charakter der Umbenennung und ist im modernen Deutsch nicht altertümlich.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: Und er gab ihm den Namen Israel
  rationale: Dies ist eine natürliche deutsche Wiedergabe der hebräischen Namensformel; die wörtlichere Form wird in der Fußnote dokumentiert.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Eingebürgerte deutsche Form des Personennamens.
theological_decisions:
- issue: Die Umbenennungsformel darf nicht so abgeschwächt werden, als bliebe „Jakob“ ausdrücklich gleichberechtigt, obwohl die spätere Erzählung den alten Namen weiterhin verwendet.
  choice: Du sollst nicht mehr Jakob heißen, sondern Israel soll dein Name sein.
  alternative: Man wird dich nicht mehr Jakob nennen; vielmehr wird dein Name Israel sein.
  rationale: Die gewählte Fassung bewahrt die volle Kraft der göttlichen Umbenennung, ohne die Spannung zur späteren weiteren Verwendung des Namens Jakob harmonisierend aufzulösen.
- issue: Subjekt der abschließenden Namensgebung
  choice: Und er gab ihm den Namen Israel.
  alternative: Und man nannte ihn Israel.
  rationale: Das maskuline Verb im Singular nimmt im unmittelbaren Zusammenhang am natürlichsten Gott als Subjekt auf; eine unpersönliche Deutung ist grammatisch weniger naheliegend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sagte“ ist klar und gegenwärtig; die direkte Rede bleibt feierlich. Die idiomatische Wendung „heißen“ vermeidet eine schwerfällige Passivkonstruktion, während die Fußnote die hebräische Namensformel transparent macht.
