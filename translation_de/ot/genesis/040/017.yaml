  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: de
  text: und im obersten Korb waren allerlei Speisen für den Pharao, von einem Bäcker zubereitet; und die Vögel fraßen sie aus dem Korb über meinem Kopf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: und im obersten Korb
  rationale: עֶלְיוֹן bezeichnet hier den obersten der drei Körbe; »obersten« gibt die räumliche Staffelung natürlich und genau wieder.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: waren allerlei Speisen für den Pharao
  rationale: מִכֹּל mit dem Sammelbegriff מַאֲכַל drückt eine Vielfalt von Speisen aus. Das im Hebräischen fehlende Kopulaverb wird im Deutschen ergänzt.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: Backwerk
  rationale: Wörtlich »Arbeit/Erzeugnis eines Bäckers«. »Backwerk« bezeichnet knapp und verständlich die vom Bäcker hergestellten Speisen, ohne eine bestimmte Art von Gebäck festzulegen.
- source_word: וְהָעוֹף
  choice: und die Vögel
  rationale: עוֹף ist eine kollektive Bezeichnung für fliegende Tiere beziehungsweise Vögel; der deutsche Plural passt zum Kontext.
- source_word: אֹכֵל
  choice: fraßen
  rationale: Das Partizip beschreibt die im Traum beobachtete Handlung. Das deutsche Präteritum ist in erzählender Rede natürlich; »fraßen« ist für Vögel idiomatisch.
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralsuffix verweist auf die Speisen beziehungsweise Backwaren als mehrere Gegenstände.
- source_word: מִן הַסַּל
  choice: aus dem Korb
  rationale: מִן bezeichnet den Ausgangspunkt; beim Herausfressen von Inhalt ist »aus dem Korb« im Deutschen natürlicher als »von dem Korb«.
- source_word: מֵעַל רֹאשִׁי
  choice: über meinem Kopf
  rationale: מֵעַל bezeichnet eine Lage oberhalb des Kopfes. Die Formulierung bewahrt, anders als »auf meinem Kopf«, die mögliche Offenheit hinsichtlich unmittelbaren Kontakts.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt der anschaulichen Traumdarstellung nahe; das Semikolon trennt Korbinhalt und Handlung der Vögel. »Backwerk« ist präziser und natürlicher als die schwerfällige wörtliche Wendung »Arbeit eines Bäckers«.
