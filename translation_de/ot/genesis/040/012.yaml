  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑/וֹ שְׁלֹ֨שֶׁת֙ הַ/שָּׂ֣רִגִ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: de
  text: 'Da sagte Josef zu ihm: „Das ist seine Deutung: Die drei Ranken[a] sind drei Tage.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Zweige des Weinstocks“ oder „Triebe“.
    reason: Das hebräische Wort שָׂרִיג bezeichnet einen Teil des Weinstocks; die genaue botanische Einordnung ist nicht völlig eindeutig.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Verbform mit narrativem וַ führt die Handlung fort; „Da sagte“ gibt diese zeitlich-folgernde Funktion in natürlichem Deutsch wieder.
- source_word: לוֹ
  choice: zu ihm
  rationale: Das im Hebräischen ausdrücklich stehende Pronomen bleibt erhalten, ohne den Becherträger erläuternd in den Haupttext einzusetzen.
- source_word: פִּתְרֹנוֹ
  choice: seine Deutung
  rationale: Gemeint ist die Deutung des zuvor erzählten Traums. Das maskuline Suffix wird mit „seine“ wiedergegeben und bezieht sich grammatisch passend auf „Traum“.
- source_word: שְׁלֹשֶׁת
  choice: die drei / drei
  rationale: Die Wiederholung der Zahl bleibt erhalten und bewahrt die erklärende Gleichsetzung des hebräischen Satzes.
- source_word: הַשָּׂרִגִים
  choice: Reben
  rationale: Das seltene Wort bezeichnet hier Teile des Weinstocks, wahrscheinlich Ranken, Schösslinge oder Zweige. „Reben“ ist im Kontext verständlich, bewahrt den Weinbezug und lässt die genauere botanische Bestimmung offen; Alternativen werden in der Fußnote genannt.
- source_word: יָמִים
  choice: Tage
  rationale: Die direkte Zeitangabe wird wörtlich und idiomatisch wiedergegeben.
- source_word: הֵם
  choice: sind
  rationale: Das selbstständige Pronomen unterstreicht im Hebräischen die Gleichsetzung; im Deutschen wird diese natürlich durch „sind“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Auslegungsformel und die wiederholte Dreizahl des Hebräischen bleiben erhalten.
