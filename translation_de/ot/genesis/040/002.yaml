  source_fidelity: Die Übersetzung gibt וַיִּקְצֹף angemessen als Eintritt des Zorns wieder und bewahrt die dreifache, durch עַל markierte Ausrichtung von Pharaos Zorn. „Seine beiden Hofbeamten“ trifft סָרִיסָיו im vorliegenden Verwaltungskontext, ohne den möglichen engeren Sinn „Eunuchen“ auszuschließen. Die beiden folgenden Amtsbezeichnungen sind vollständig und zutreffend wiedergegeben.
  naturalness: „Und der Pharao wurde zornig auf …“ ist modernes, verständliches Standarddeutsch mit einem angemessen würdevollen biblisch-narrativen Register. Die Wiederholung von „auf“ ist etwas formeller als eine geglättete Apposition, bildet aber die hebräische Hervorhebung klar ab und bleibt idiomatisch.
  terminology: „Pharao“, „Hofbeamte“, „oberster Mundschenk“ und „oberster Bäcker“ sind sachgerecht. Insbesondere vermeidet „Hofbeamte“ eine ungesicherte Aussage über den körperlichen Status der genannten Personen. Die Fußnote dokumentiert die lexikalische Alternative transparent und ohne Überinterpretation.
