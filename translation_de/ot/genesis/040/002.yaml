source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: de
  text: Und der Pharao wurde zornig auf seine beiden Hofbeamten[a], auf den obersten Mundschenk und auf den obersten Bäcker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine beiden Eunuchen“; das hebräische Wort kann je nach Zusammenhang sowohl Hofbeamte als auch Eunuchen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: wurde zornig
  rationale: קצף bezeichnet Zorn oder heftigen Unmut. „Wurde zornig“ gibt den Eintritt der Handlung in der Erzählfolge natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: שְׁנֵי סָרִיסָיו
  choice: seine beiden Hofbeamten
  rationale: סָרִיס kann einen Hofbeamten und je nach Zusammenhang auch einen Eunuchen bezeichnen. Die anschließend genannten Hofämter sprechen hier für die funktionsbezogene, körperlichen Status nicht behauptende Wiedergabe „Hofbeamten“.
- source_word: שַׂר הַמַּשְׁקִים
  choice: den obersten Mundschenk
  rationale: שַׂר bezeichnet hier den ranghöchsten Amtsträger, הַמַּשְׁקִים die für Getränke zuständigen Diener. „Oberster Mundschenk“ ist eine klare und etablierte deutsche Amtsbezeichnung.
- source_word: שַׂר הָאֹפִים
  choice: den obersten Bäcker
  rationale: שַׂר bezeichnet das Oberhaupt, הָאֹפִים die Bäcker. „Oberster Bäcker“ bewahrt knapp die Rang- und Berufsbezeichnung.
- source_word: עַל ... עַל ... וְעַל
  choice: auf ... auf ... und auf
  rationale: Nach einem Verb des Zorns bezeichnet עַל die Personen, gegen die sich der Zorn richtet. Die Wiederholung von „auf“ spiegelt die hebräische Struktur und kennzeichnet die folgenden Titel als nähere Bestimmung der beiden Beamten.
