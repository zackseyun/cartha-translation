  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: de
  text: Er setzte den obersten Mundschenk wieder in sein Amt ein[a], und der Mundschenk reichte dem Pharao den Becher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wieder zu seinem Mundschenkdienst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er gab den Becher in die Hand des Pharaos“. Das Subjekt ist im Hebräischen nicht ausdrücklich genannt; aus dem Zusammenhang ist der Mundschenk gemeint.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: setzte … wieder … ein
  rationale: Der Hifil von שׁוב bezeichnet hier die Wiedereinsetzung in eine frühere Stellung. Die deutsche Wendung gibt dies natürlich und präzise wieder.
- source_word: שַׂר הַמַּשְׁקִים
  choice: den obersten Mundschenk
  rationale: שַׂר bezeichnet den leitenden Amtsträger; מַשְׁקִים sind die für Getränke zuständigen Hofbediensteten. „Oberster Mundschenk“ ist die etablierte deutsche Hofbezeichnung.
- source_word: עַל מַשְׁקֵהוּ
  choice: in sein Amt
  rationale: Wörtlich geht es um seine Aufgabe als Mundschenk. „In sein Amt“ drückt die gemeinte Rückkehr in den Dienst in natürlichem Deutsch aus; die konkretere Formulierung wird in der Fußnote bewahrt.
- source_word: וַיִּתֵּן
  choice: reichte
  rationale: נתן bedeutet grundsätzlich „geben/legen“. Im Zusammenhang mit dem Dienst des Mundschenks und dem Becher in der Hand des Pharaos ist „reichte“ die natürliche deutsche Wiedergabe.
- source_word: הַכּוֹס
  choice: den Becher
  rationale: „Becher“ ist im höfischen Kontext eine geläufige und konkrete Wiedergabe von כּוֹס.
- source_word: עַל כַּף פַּרְעֹה
  choice: dem Pharao
  rationale: Die Handlung besteht darin, den Becher in die Hand des Pharaos zu geben. Beim Verb „reichen“ ist dies im Deutschen bereits idiomatisch enthalten; die wörtlichere Form steht in der Fußnote.
theological_decisions:
- issue: Subjekt von וַיִּתֵּן
  choice: Der Mundschenk wird im Haupttext ausdrücklich als Handelnder genannt.
  alternative: „und er gab den Becher in die Hand des Pharaos“
  rationale: Das Hebräische nennt nur die maskuline Verbform „und er gab“, deren Bezugswort formal unausgesprochen bleibt. Im Zusammenhang ist der wieder eingesetzte Mundschenk der sinnvolle Handelnde. Die ausdrückliche Nennung vermeidet im Deutschen den missverständlichen Eindruck, der Pharao habe sich selbst den Becher in die Hand gegeben; die sprachliche Form des Hebräischen wird in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberster Mundschenk“ bewahrt den historischen Hofkontext; „in sein Amt einsetzen“ und „den Becher reichen“ sind für heutige Leser klar und natürlich.
