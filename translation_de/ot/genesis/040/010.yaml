translation:
  language: de
  text: und am Weinstock waren drei Triebe[a]. Während er Knospen trieb, kamen seine Blüten hervor[b], und seine Trauben reiften zu Weinbeeren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „drei Ranken“ oder „drei Zweige“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und sie, wie knospend, ihre Blüte kam hervor“. Die Formulierung schildert die Abfolge von Knospung, Blüte und reifer Frucht in rascher Traumfolge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: und am Weinstock
  rationale: Die Präposition ב bezeichnet hier natürlich die Triebe am Weinstock; „am“ ist im Deutschen idiomatischer als das wörtlichere „im“.
- source_word: שָׂרִיגִם
  choice: Triebe
  rationale: Das Wort bezeichnet rankende beziehungsweise junge Auswüchse des Weinstocks. „Triebe“ ist botanisch passend und allgemein verständlich; „Ranken“ und „Zweige“ bleiben mögliche Alternativen.
- source_word: כְפֹרַחַת
  choice: Kaum trieb er Knospen
  rationale: Die Konstruktion beschreibt den Beginn des Blühens und leitet die auffallend schnelle Entwicklungsfolge ein. „Kaum“ gibt diesen unmittelbaren Übergang natürlich wieder, ohne die einzelnen Stadien zusammenzuziehen.
- source_word: עָלְתָה נִצָּהּ
  choice: kamen seine Blüten hervor
  rationale: Das Bild des Hervorkommens wird bewahrt; der hebräische Singular kann kollektiv verstanden und im Deutschen idiomatisch pluralisch wiedergegeben werden.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: seine Trauben reiften zu Weinbeeren
  rationale: אַשְׁכֹּל bezeichnet die Traube als Fruchtstand, עֲנָבִים die einzelnen Beeren. Die Formulierung erhält diese Unterscheidung und gibt die prädikative Verbindung natürlich wieder.
