base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: de
  text: Der Becher des Pharaos war in meiner Hand, und ich nahm die Trauben, presste sie in den Becher des Pharaos aus und gab den Becher in die Hand des Pharaos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ich gab den Becher auf die Handfläche des Pharaos“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: Becher
  rationale: Bezeichnet hier ein Trinkgefäß; „Becher“ ist im modernen Deutschen natürlich und passt zum höfischen Zusammenhang.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Bewahrt das anschauliche Bild des hebräischen Ausdrucks und ist im Deutschen idiomatisch.
- source_word: וָאֶקַּח
  choice: ich nahm
  rationale: Direkte und übliche Wiedergabe von לקח in der fortlaufenden Erzählung.
- source_word: הָעֲנָבִים
  choice: die Trauben
  rationale: Entspricht dem konkreten hebräischen Ausdruck mit Artikel.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: presste sie in den Becher des Pharaos aus
  rationale: שׂחט bezeichnet hier das Auspressen der Trauben; „auspressen“ macht deutlich, dass ihr Saft in den Becher gelangt.
- source_word: וָאֶתֵּן
  choice: stellte
  rationale: נתן bezeichnet in diesem Zusammenhang das konkrete Platzieren beziehungsweise Überreichen des Bechers; „stellte“ verbindet sich natürlich mit der wörtlich bewahrten Ortsangabe.
- source_word: עַל כַּף פַּרְעֹה
  choice: auf die Handfläche des Pharaos
  rationale: Gibt עַל und כַּף formal genau wieder und bewahrt das anschauliche, wenn auch ungewöhnliche Bild des Ausgangstextes; eine idiomatische Alternative wäre „in die Hand des Pharaos“.
