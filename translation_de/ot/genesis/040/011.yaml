review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Lexeme zutreffend wieder: Becher, Hand, Trauben und das Auspressen entsprechen dem Hebräischen. Die Wiedergabe von עַל־כַּף im Haupttext als „auf die Handfläche“ ist jedoch im Deutschen zu wörtlich und erzeugt ein missverständliches, unnatürliches Bild. Die hebräische Wendung bezeichnet hier das Überreichen in die Hand des Pharaos.'
  naturalness: „Presste sie in den Becher des Pharaos aus“ ist verständlich und im Kontext akzeptabel. „Stellte den Becher auf die Handfläche des Pharaos“ klingt dagegen unidiomatisch und legt nahe, der Becher sei auf einer geöffneten Hand abgestellt worden. „Gab den Becher in die Hand des Pharaos“ ist modernes, natürliches Standarddeutsch und wahrt die konkrete Handlung.
  terminology: „Becher“ ist eine passende Wiedergabe von כּוֹס. „Pharao“ und die Wendung „in die Hand“ sind registergerecht. Für וָאֶתֵּן ist „gab“ in Verbindung mit der Hand des Pharaos präziser und idiomatischer als „stellte“.
  issues:
  - severity: medium
    issue: Die Haupttextformulierung „stellte den Becher auf die Handfläche des Pharaos“ ist eine überformale und im Deutschen unnatürliche Wiedergabe der abschließenden hebräischen Wendung.
    rationale: עַל כַּף bezeichnet zwar wörtlich die Handfläche, fungiert hier aber in Verbindung mit נתן als konkrete Übergabe an den Pharao. Der Sinn sollte im Haupttext idiomatisch wiedergegeben und die wörtliche Form in einer Fußnote dokumentiert werden.
  revised_text: Der Becher des Pharaos war in meiner Hand, und ich nahm die Trauben, presste sie in den Becher des Pharaos aus und gab den Becher in die Hand des Pharaos.[a]
