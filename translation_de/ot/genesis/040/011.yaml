translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen, aufeinanderfolgenden Handlungen des Traumberichts bleiben erhalten. Die ungewöhnliche Wendung „auf die Handfläche“ steht im Haupttext, während die natürliche deutsche Bedeutung in der Fußnote genannt wird.
