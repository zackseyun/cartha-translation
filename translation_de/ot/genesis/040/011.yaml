revisions:
- from: Der Becher des Pharaos war in meiner Hand. Ich nahm die Trauben, presste sie in den Becher des Pharaos aus und stellte den Becher auf die Handfläche des Pharaos.[a]
  to: Der Becher des Pharaos war in meiner Hand, und ich nahm die Trauben, presste sie in den Becher des Pharaos aus und gab den Becher in die Hand des Pharaos.[a]
  rationale: Die Schlusswendung wird im Haupttext idiomatisch als Übergabe „in die Hand“ wiedergegeben, entsprechend der Handlung und dem audit trail. Die wörtliche Bildsprache von עַל כַּף bleibt in der Fußnote erhalten. Dadurch werden Quelltreue und natürliches modernes Deutsch verbunden, ohne den Sinn zu verändern.
