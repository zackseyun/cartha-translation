  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: de
  text: Er ließ sie im Haus des Obersten der Leibwache[a], im Gefängnis[b], in Gewahrsam nehmen – an dem Ort, an dem Josef gefangen gehalten wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »des Obersten der Schlächter«. Die Amtsbezeichnung kann im Kontext auch »Oberster der Hinrichter« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in das Haus des Eingeschlossenseins«. Die Abfolge der hebräischen Ortsangaben kann auch wiedergegeben werden: »im Haus des Obersten der Leibwache, in das Gefängnis«.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: Er ließ sie … in Gewahrsam nehmen
  rationale: נתן bedeutet hier im Zusammenhang mit מִשְׁמָר idiomatisch, jemanden in Gewahrsam zu geben bzw. nehmen zu lassen. Die deutsche Kausativform ist natürlich und lässt das Subjekt als veranlassende Autorität erkennen.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: im Haus des Obersten der Leibwache
  rationale: Die etablierte Amtsbezeichnung „Oberster der Leibwache“ passt zum ägyptischen Hofkontext; „Haus“ bewahrt die räumliche Angabe des Hebräischen.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: und zwar im Gefängnis
  rationale: בֵּית הַסֹּהַר bezeichnet das Gefängnis. „Und zwar“ macht verständlich, dass die folgende Angabe den Verwahrungsort innerhalb des Hauses bzw. Zuständigkeitsbereichs näher bestimmt, ohne eine räumliche Beziehung zu behaupten, die der knappe hebräische Satz nicht eindeutig ausführt.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: an dem Ort, an dem Josef gefangen gehalten wurde
  rationale: אָסוּר kann wörtlich „gebunden“ und im Kontext „gefangen“ heißen. „Gefangen gehalten“ gibt den andauernden Zustand idiomatisch wieder; שָׁם ist in der deutschen Relativkonstruktion „an dem“ enthalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Gewahrsam nehmen“ trifft den amtlich-rechtlichen Kontext, ohne unnötig archaisch zu wirken. Die Wiederholung „an dem Ort, an dem“ ist bewusst klar und entspricht der appositionellen Präzisierung des hebräischen Textes.
