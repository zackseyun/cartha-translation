base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: de
  text: In ein und derselben Nacht hatten der Mundschenk und der Bäcker des Königs von Ägypten, die im Gefängnis gefangen waren, beide einen Traum[a], jeder seinen eigenen, und jeder Traum hatte eine ihm entsprechende Deutung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Da träumten beide einen Traum … in einer Nacht.« Das Hebräische verbindet das Verb »träumen« mit dem gleichstämmigen Substantiv »Traum«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »jeder entsprechend der Deutung seines Traums«. Gemeint ist, dass zu jedem der beiden Träume eine eigene, ihm entsprechende Deutung gehörte.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: hatten … einen Traum
  rationale: Die hebräische figura etymologica lautet wörtlich »träumten einen Traum«. Im heutigen Deutsch gibt »hatten … einen Traum« den Sinn natürlich wieder; die Form des Hebräischen wird in Fußnote [a] kenntlich gemacht.
- source_word: שְׁנֵיהֶם
  choice: beide
  rationale: Gibt den Bezug auf die zwei zuvor genannten Beamten knapp und eindeutig wieder.
- source_word: אִישׁ חֲלֹמוֹ
  choice: jeder seinen eigenen
  rationale: 'Bewahrt die distributive Aussage: Jeder der beiden Männer hatte einen eigenen Traum.'
- source_word: בְּלַיְלָה אֶחָד
  choice: in ein und derselben Nacht
  rationale: Das Hebräische lautet formal »in einer Nacht«; im Zusammenhang hebt die Wendung hervor, dass beide Träume in derselben Nacht geschahen.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: jeder Traum hatte die ihm entsprechende Deutung
  rationale: Gibt sowohl die distributive Wiederholung von אִישׁ als auch die durch כְּ bezeichnete Entsprechung zwischen Traum und Deutung verständlich wieder, ohne die konkrete Deutung vorwegzunehmen.
- source_word: הַמַּשְׁקֶה
  choice: der Mundschenk
  rationale: Übliche und präzise deutsche Bezeichnung für den königlichen Amtsträger, der für die Getränke zuständig war; ein Rang wie »oberster« steht in diesem Vers nicht ausdrücklich.
- source_word: הָאֹפֶה
  choice: der Bäcker
  rationale: Direkte Wiedergabe der substantivierten Tätigkeitsbezeichnung; »oberster« wird aus diesem Vers nicht ergänzt.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: des Königs von Ägypten
  rationale: Der Genitiv drückt die im Hebräischen mit לְ bezeichnete amtliche Zuordnung knapp aus, ohne zwischen Zugehörigkeit und Dienstverhältnis unnötig zu entscheiden.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: die im Gefängnis gefangen waren
  rationale: אסר kann »binden«, »festhalten« oder »gefangen halten« bedeuten. Im Zusammenhang bezeichnet es die Haft; »Gefängnis« gibt בֵּית הַסֹּהַר im modernen Deutsch natürlich wieder.
