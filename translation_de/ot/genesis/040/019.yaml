  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: de
  text: Noch drei Tage, dann wird der Pharao deinen Kopf erheben – von dir weg[a] – und dich an einen Baum hängen[b]. Die Vögel werden dein Fleisch von deinem Körper fressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinen Kopf von dir weg erheben“. Die grausame Formulierung spielt wahrscheinlich mit derselben Wendung, die in der Deutung des Traums des Mundschenks positiv gebraucht wird; hier bezeichnet sie wohl die Entfernung des Kopfes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dich an ein Holz hängen“ beziehungsweise „dich an einem Pfahl aufhängen oder aufspießen“. Das hebräische Wort bedeutet „Baum“ oder „Holz“; die genaue Art der Hinrichtung bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Noch drei Tage, dann
  rationale: Gibt die verbleibende Frist im modernen Deutschen natürlich und präzise wieder.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: wird ... deinen Kopf erheben – von dir weg
  rationale: Bewahrt das Verb „erheben“ und damit den düsteren Gegensatz zur gleichlautenden positiven Wendung in Vers 13. Der Zusatz „von dir weg“ macht deutlich, dass hier die Entfernung des Kopfes gemeint ist, ohne das hebräische Wortspiel schlicht zu „enthaupten“ aufzulösen.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: und dich an einen Baum hängen
  rationale: תלה bedeutet „hängen“, עֵץ zunächst „Baum“ oder „Holz“. Die Wiedergabe bleibt lexikalisch transparent und lässt offen, ob ein Baum, Pfahl oder hölzernes Hinrichtungsgerät gemeint ist.
- source_word: וְאָכַל הָעוֹף
  choice: Die Vögel werden ... fressen
  rationale: Das singularische Kollektiv עוֹף wird im Deutschen natürlich als Plural wiedergegeben; „fressen“ ist für Vögel idiomatisch und entspricht dem schlichten, drastischen אכל.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: dein Fleisch von dir fressen
  rationale: „Fleisch“ bewahrt die konkrete Härte von בשר. „Von dir“ nimmt die wiederholte Wendung מֵעָלֶיךָ auf, ohne sie unnatürlich zu glätten.
theological_decisions:
- issue: Hinrichtungsbild und Wortspiel nicht abschwächen
  choice: Die Wendung „den Kopf erheben“ wird trotz ihres grausamen Sinnes beibehalten und durch „von dir weg“ erläutert.
  alternative: „Der Pharao wird dich enthaupten und deinen Körper an einen Pfahl hängen.“
  rationale: Die explizite Alternative wäre verständlicher, beseitigte aber die bewusste sprachliche Umkehrung gegenüber der günstigen Deutung für den Mundschenk. Der gewählte Text bewahrt literarische Spannung und Brutalität, ohne eine bestimmte Hinrichtungstechnik festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Einschaltung „von dir weg“ ist bewusst beibehalten, um das hebräische Wortspiel und die makabre Bildlichkeit sichtbar zu machen. Die drastischen Wörter „Fleisch“ und „fressen“ werden nicht abgeschwächt.
