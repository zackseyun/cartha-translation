translation:
  language: de
  text: Da wies der Oberste der Leibwache ihnen Josef zu[a], und er diente ihnen. Sie blieben einige Zeit in Gewahrsam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setzte Josef über sie“ beziehungsweise „übertrug Josef die Verantwortung für sie“. Das hebräische Verb kann eine Beauftragung mit Verantwortung bezeichnen; Josefs Stellung kann daher als Dienst für sie oder als Aufsicht über sie verstanden werden.'
    reason: lexical_alternative
  - marker: b
