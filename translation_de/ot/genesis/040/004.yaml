lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: teilte … zu
  rationale: Das Verb פקד bezeichnet hier die Übertragung einer Aufgabe oder Verantwortung. „Teil­te … zu“ gibt die Zuordnung Josefs zu den beiden Gefangenen natürlich wieder, ohne eindeutig festzulegen, ob er nur für ihre Versorgung oder auch für ihre Beaufsichtigung zuständig war.
- source_word: שַׂר הַטַּבָּחִים
  choice: der Oberste der Leibwache
  rationale: Der wörtliche Titel bezeichnet den Obersten der Schlachter beziehungsweise Hinrichter, fungiert im Erzählzusammenhang aber als Amtsbezeichnung eines hohen Sicherheitsbeamten. „Oberster der Leibwache“ ist im Deutschen verständlich und kontextgerecht.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: ihnen Josef
  rationale: Die Konstruktion ordnet Josef den Gefangenen zu. Die Formulierung vermeidet eine vorschnelle Festlegung auf bloßen Dienst oder ausdrückliche Aufsicht.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: und er bediente sie
  rationale: שרת bedeutet dienen beziehungsweise persönlich aufwarten. „Bediente sie“ bezeichnet hier sachlich Josefs Dienst an den Gefangenen und vermeidet einen religiösen Beiklang.
- source_word: וַיִּהְיוּ יָמִים
  choice: Sie blieben einige Zeit
  rationale: Die wörtliche Wendung „sie waren Tage“ ist ein hebräischer Zeitausdruck für einen nicht näher bestimmten Zeitraum. Die idiomatische deutsche Wiedergabe lautet „sie blieben einige Zeit“.
- source_word: בְּמִשְׁמָר
  choice: in Gewahrsam
  rationale: מִשְׁמָר bezeichnet bewachte Haft oder Verwahrung. „In Gewahrsam“ bewahrt diesen Schwerpunkt genauer als das allgemeinere „im Gefängnis“.
