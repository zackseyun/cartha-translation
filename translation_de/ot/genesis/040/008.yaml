  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: de
  text: 'Sie sagten zu ihm[a]: »Wir haben einen Traum geträumt, aber niemand ist da, der ihn deuten kann.« Josef sagte zu ihnen: »Sind Deutungen nicht Gottes Sache?[b] Erzählt mir bitte davon!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Einen Traum haben wir geträumt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Gehören Deutungen nicht Gott?« oder: »Kommen Deutungen nicht von Gott?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Wir haben einen Traum geträumt
  rationale: Die im Hebräischen verwendete Verbindung aus Verb und stammverwandtem Substantiv lässt sich im Deutschen natürlich und formnah mit »einen Traum träumen« wiedergeben. Das Perfekt wahrt die gegenwärtige Bedeutung des Erlebten.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: aber niemand ist da, der ihn deuten kann
  rationale: Das aktive Partizip bezeichnet einen verfügbaren Deuter. Die deutsche Relativsatzkonstruktion gibt idiomatisch wieder, dass niemand zur Deutung da ist; »aber« bringt den im Zusammenhang liegenden Gegensatz natürlich zum Ausdruck.
- source_word: הֲלוֹא לֵאלֹהִים פִּתְרֹנִים
  choice: Sind Deutungen nicht Gottes Sache?
  rationale: Die rhetorische Frage erwartet Zustimmung. »Gottes Sache« bewahrt knapp die durch ל ausgedrückte Zuordnung zu Gott, ohne genauer festzulegen, ob Besitz, Zuständigkeit oder Ursprung gemeint ist.
- source_word: פִּתְרֹנִים
  choice: Deutungen
  rationale: Der hebräische Plural wird beibehalten und bezeichnet Deutungen allgemein.
- source_word: סַפְּרוּ נָא לִי
  choice: Erzählt mir bitte davon!
  rationale: Der Pluralimperativ richtet sich an beide Männer; נָא mildert die Aufforderung höflich ab. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen durch »davon« zurückhaltend auf die Träume bezogen.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Namensform.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Josefs Aussage
  choice: Gott
  alternative: ein Gott / Götter
  rationale: Im Erzählzusammenhang bekennt Josef Gott als denjenigen, dem Traumdeutungen zukommen. Der Kontext legt keinen unbestimmten oder polytheistischen Bezug nahe.
- issue: Bedeutung der Zuordnung לֵאלֹהִים
  choice: Gottes Sache
  alternative: gehören Gott / kommen von Gott
  rationale: Die Formulierung lässt die semantische Spannung zwischen Zugehörigkeit, Zuständigkeit und göttlichem Ursprung bestehen, statt nur eine dieser Bedeutungen festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich; die hebräische Wiederholung bei »Traum geträumt« wird bewusst bewahrt. Die Gottesbezeichnung und die Aussage über die Deutung werden nicht konfessionell zugespitzt.
