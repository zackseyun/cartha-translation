base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: de
  text: Josef kam am Morgen zu ihnen und sah sie; siehe, sie waren bedrückt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verstört“, „niedergeschlagen“ oder „finster dreinblickend“. Das hebräische Wort bezeichnet einen sichtbar belasteten oder beunruhigten Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: kam zu ihnen
  rationale: Die Verbindung von בוא mit אֲלֵיהֶם bezeichnet Josefs Bewegung zu den Gefangenen hin; „kam zu ihnen“ ist im Deutschen natürlich und legt keinen genauer bezeichneten Raum fest.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die bestimmte Zeitangabe wird im modernen Standarddeutsch idiomatisch mit „am Morgen“ wiedergegeben.
- source_word: וַיַּרְא אֹתָם וְהִנָּם
  choice: sah, dass sie
  rationale: Die Konstruktion beschreibt, was Josef beim Anblick der Männer wahrnimmt. Ein eigenständiges „siehe“ wäre hier im Deutschen schwerfällig; der Aufmerksamkeitseffekt von הִנָּם wird natürlich in die Wahrnehmungskonstruktion aufgenommen.
- source_word: זֹעֲפִים
  choice: bedrückt
  rationale: Das Partizip bezeichnet hier einen äußerlich erkennbaren, belasteten Gemütszustand. „Bedrückt“ wahrt die Breite zwischen verstört, niedergeschlagen und düster, ohne die Bedeutung einseitig auf Zorn festzulegen.
theological_decisions: []
translation_notes:
  register: Natürliche, würdige moderne Erzählsprache. Die hebräische parataktische Abfolge bleibt erhalten; הִנָּם wird wegen deutscher Idiomatik nicht mit dem markierten „siehe“ wiedergegeben, sondern in „sah, dass“ integriert.
