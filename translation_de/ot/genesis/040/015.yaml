  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: de
  text: Denn ich bin aus dem Land der Hebräer verschleppt worden[a], und auch hier habe ich nichts getan, weshalb man mich in die Grube[b] gebracht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn gestohlen, ja gestohlen wurde ich“. Das Hebräische verstärkt die Verbalaussage durch einen Infinitivus absolutus.'
    reason: lexical_alternative
  - marker: b
    text: „Grube“ kann hier im Zusammenhang ein Verlies oder eine Gefängniszelle bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Josefs Begründung bzw. Erklärung gegenüber dem Mundschenk ein.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: ich bin … verschleppt worden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die passive Aussage. „Verschleppt“ bezeichnet bei einer Person natürlich die gewaltsame Wegnahme, ohne die Aussage unnötig auszudeuten.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: aus dem Land der Hebräer
  rationale: Bewahrt die ethnische Bezeichnung und legt keine präzise politische Gebietsgrenze nahe.
- source_word: וְגַם פֹּה
  choice: und auch hier
  rationale: 'Gibt die additive Hervorhebung wieder: Sowohl seine Verschleppung als auch seine Unschuld in Ägypten werden betont.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: habe ich nichts getan
  rationale: Natürliche deutsche Wiedergabe der uneingeschränkten Verneinung.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: weshalb man mich … werfen sollte
  rationale: Drückt idiomatisch aus, dass es keinen von Josef verschuldeten Grund für seine Inhaftierung gab; das unbestimmte „man“ entspricht dem nicht näher bezeichneten Subjekt der 3. Person Plural.
- source_word: בַּבּוֹר
  choice: in die Grube
  rationale: Bewahrt das konkrete hebräische Bild und die lexikalische Verbindung zu einer Grube bzw. Zisterne, obwohl hier kontextuell ein Verlies gemeint sein kann.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die hebräische Emphase wird durch Wortwahl und Fußnote vermittelt; das Bild der „Grube“ bleibt im Haupttext erhalten.
