  source_fidelity: Die Übersetzung gibt die kausale Einleitung, die betonte passive Wegnahme, die Bezeichnung „Land der Hebräer“, die additive Wendung und die Unschuldsbeteuerung insgesamt treffend wieder. בּוֹר bleibt mit „Grube“ angemessen im Text erhalten; die Fußnote erläutert den kontextuellen Gefängnissinn. Die hebräische Vergangenheitsaussage שָׂמוּ אֹתִי („sie/man hat mich hineingebracht/gesetzt“) sollte jedoch nicht durch einen hypothetischen Konjunktiv wiedergegeben werden.
