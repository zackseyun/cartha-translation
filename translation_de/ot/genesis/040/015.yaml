  terminology: „Hebräer“, „verschleppt“ und „Grube“ sind sachgerecht. „Verschleppt“ vermittelt die gewaltsame Wegnahme idiomatisch, ohne eine unzulässige historische Präzisierung vorzunehmen. Die Fußnotenmarker sind passend verankert.
