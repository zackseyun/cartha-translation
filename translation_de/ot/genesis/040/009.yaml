  text: וַ/יְסַפֵּ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת חֲלֹמ֖/וֹ לְ/יוֹסֵ֑ף וַ/יֹּ֣אמֶר ל֔/וֹ בַּ/חֲלוֹמִ֕/י וְ/הִנֵּה גֶ֖פֶן לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: de
  text: 'Da erzählte der oberste Mundschenk Josef seinen Traum und sagte zu ihm: »In meinem Traum, siehe, da war ein Weinstock vor mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: erzählte
  rationale: Das Piel von ספר bedeutet hier »erzählen« bzw. »berichten«; »erzählte« ist im Deutschen natürlich und passt zum direkten Objekt »seinen Traum«.
- source_word: שַׂר הַמַּשְׁקִים
  choice: der oberste Mundschenk
  rationale: Die Wendung bezeichnet den ranghöchsten königlichen Amtsträger, der für die Getränke zuständig war. »Oberster Mundschenk« ist präzise und im biblisch-höfischen Zusammenhang verständlich.
- source_word: אֶת חֲלֹמוֹ
  choice: seinen Traum
  rationale: Das Substantiv mit Suffix der 3. Person Singular maskulin ist eindeutig als »seinen Traum« wiederzugeben.
- source_word: לְיוֹסֵף
  choice: Josef
  rationale: Im Deutschen verlangt »jemandem etwas erzählen« den Dativ; dadurch wird die hebräische Präposition ל ohne zusätzliches »zu« natürlich wiedergegeben.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: Das ausdrücklich vorhandene Pronomen לוֹ wird beibehalten.
- source_word: בַּחֲלוֹמִי
  choice: In meinem Traum
  rationale: Dies ist die natürliche deutsche Wiedergabe der Präpositionalverbindung und leitet den Traumbericht ein.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: »Siehe« bewahrt die aufmerksamkeitslenkende und vergegenwärtigende Funktion von הִנֵּה, ohne sie zu einer bloßen Existenzangabe abzuflachen.
- source_word: גֶפֶן
  choice: ein Weinstock
  rationale: גֶפֶן bezeichnet hier die Weinrebe. »Weinstock« ist im modernen Standarddeutsch konkreter und natürlicher als das mehrdeutige »Rebe«.
- source_word: לְפָנַי
  choice: da war ... vor mir
  rationale: Die Präpositionalverbindung bedeutet »vor mir«; die im Hebräischen fehlende Kopula wird im Deutschen ergänzt. »Da war« fügt sich natürlich an »siehe« an.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Das traditionelle, weiterhin verständliche »siehe« erhält die Anschaulichkeit des Traumberichts; die höfische Amtsbezeichnung »Mundschenk« wird wegen ihrer Genauigkeit beibehalten.
