base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: de
  text: Am dritten Tag, dem Geburtstag des Pharaos, veranstaltete er ein Festmahl für alle seine Diener. Dabei erhob er inmitten seiner Diener das Haupt des obersten Mundschenks und das Haupt des obersten Bäckers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er erhob ... das Haupt des obersten Mundschenks und das Haupt des obersten Bäckers.“ Die hebräische Wendung kann bedeuten, dass der Pharao sie herausstellte oder ihrer Beachtung schenkte. Sie bleibt im Text erhalten, weil der Zusammenhang mit ihren unterschiedlichen Ausgängen spielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die hebräische Erzählungsfortsetzung wird im Deutschen natürlich durch die Zeitangabe getragen; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: dem Geburtstag des Pharaos
  rationale: Natürliche moderne Wiedergabe von „Tag der Geburt des Pharaos“.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: veranstaltete er ein Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein Fest beziehungsweise Bankett, häufig mit Trinken; „veranstaltete ein Festmahl“ ist idiomatisches und würdevolles Deutsch.
- source_word: לְכָל עֲבָדָיו
  choice: für alle seine Diener
  rationale: עֲבָדִים kann Diener, Bedienstete oder Hofangehörige bezeichnen. „Diener“ bewahrt die Breite des Ausdrucks, ohne einen Sklavenstatus vorauszusetzen.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: erhob er ... das Haupt
  rationale: Die wörtliche Wendung wird bewahrt, weil der Zusammenhang mit ihren gegensätzlichen Folgen für beide Amtsträger spielt. Eine Deutung wie „er zeichnete aus“ würde diese Spannung vorzeitig auflösen.
- source_word: שַׂר הַמַּשְׁקִים
  choice: obersten Mundschenks
  rationale: „Mundschenk“ ist die etablierte deutsche Bezeichnung für den höfischen Amtsträger im Getränkedienst; „oberster“ gibt שַׂר in diesem Titel wieder.
- source_word: שַׂר הָאֹפִים
  choice: obersten Bäckers
  rationale: Natürliche parallele Wiedergabe des höfischen Amtstitels.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: inmitten seiner Diener
  rationale: Die formnahe Wendung macht deutlich, dass die Handlung vor beziehungsweise unter den versammelten Dienern stattfand.
