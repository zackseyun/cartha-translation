  text: וְ/לֹֽא זָכַ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת יוֹסֵ֖ף וַ/יִּשְׁכָּחֵֽ/הוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: de
  text: Doch der oberste Mundschenk dachte nicht an Josef, sondern vergaß ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לֹא
  choice: Doch ... nicht
  rationale: Die Verbindung knüpft an die Erfüllung von Josefs Deutung im vorherigen Vers an und setzt zugleich einen deutlichen Gegensatz; „Doch“ gibt diese Wendung im Deutschen natürlich wieder.
- source_word: זָכַר
  choice: dachte ... an
  rationale: זכר bedeutet grundsätzlich „sich erinnern/gedenken“. In Verbindung mit einer Person ist „an jemanden denken“ hier idiomatisches modernes Deutsch und lässt offen, welche konkrete Hilfe daraus hätte folgen sollen.
- source_word: שַׂר הַמַּשְׁקִים
  choice: der oberste Mundschenk
  rationale: Der Titel bezeichnet den ranghöchsten Hofbeamten für den Getränkedienst. „Oberster Mundschenk“ ist präzise, würdig und im Erzählzusammenhang verständlich.
- source_word: אֶת יוֹסֵף
  choice: Josef
  rationale: Der direkte Objektmarker wird im Deutschen nicht eigens wiedergegeben; der Name folgt der üblichen deutschen biblischen Form.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: sondern vergaß ihn
  rationale: Das Verb bedeutet „vergessen“, das Suffix bezieht sich auf Josef. Nach der verneinten Aussage gibt „sondern“ die nachdrückliche Neuformulierung im Deutschen klar und natürlich wieder.
theological_decisions: []
