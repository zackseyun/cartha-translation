base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: de
  text: Noch drei Tage, dann wird der Pharao dein Haupt erheben[a] und dich wieder in dein Amt einsetzen. Du wirst dem Pharao den Becher in die Hand geben, wie es früher üblich war, als du sein Mundschenk warst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dein Haupt erheben«. Die Wendung weist hier auf die ehrenvolle Wiedereinsetzung hin; zugleich bereitet der gleiche Ausdruck seinen gegensätzlichen Gebrauch in Vers 19 vor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Noch drei Tage, dann
  rationale: Gibt die verbleibende Zeitspanne und den anschließenden Eintritt des Ereignisses natürlich und präzise wieder.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: wird ... dein Haupt erheben
  rationale: Bewahrt die wörtliche hebräische Wendung und damit die bewusste literarische Verbindung zum gegensätzlichen Gebrauch in Vers 19; der folgende Satzteil verdeutlicht hier die günstige Bedeutung.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: und dich wieder in dein Amt einsetzen
  rationale: כֵּן bezeichnet hier die angestammte Stellung beziehungsweise das Hofamt; die Formulierung ist im Deutschen klar und kontextgerecht.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: Du wirst dem Pharao den Becher in die Hand geben
  rationale: Gibt die konkrete, zeremonielle Handlung natürlich wieder und wahrt das Bild der Übergabe in die Hand.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: wie es früher üblich war
  rationale: מִשְׁפָּט bezeichnet in diesem Zusammenhang die zuvor geltende Sitte oder feststehende Verfahrensweise, nicht ein gerichtliches Urteil.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: als du sein Mundschenk warst
  rationale: מַשְׁקֶה bezeichnet hier das Hofamt des Mundschenks; der deutsche Amtstitel ist präzise und traditionsverständlich.
