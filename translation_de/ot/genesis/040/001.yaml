source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: de
  text: Nach diesen Ereignissen[a] versündigten sich der Mundschenk des Königs von Ägypten und der Bäcker an ihrem Herrn, dem König von Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nach diesen Dingen.« Wörtlicher lautet die hebräische Erzählformel: »Und es geschah nach diesen Dingen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die häufige hebräische Erzählformel wird in natürlichem modernem Deutsch knapp wiedergegeben. Die wörtlichere Form »Und es geschah nach diesen Dingen« bleibt in der Fußnote erhalten.
- source_word: חָטְאוּ
  choice: versündigten sich an
  rationale: חטא mit ל bezeichnet hier ein Vergehen gegen eine Person. »Sich an jemandem versündigen« bewahrt die moralische und relationale Tragweite besser als das schwächere »jemanden verärgern«.
- source_word: מַשְׁקֵה
  choice: Mundschenk
  rationale: Das Wort bezeichnet den königlichen Getränkediener beziehungsweise Mundschenk. Ein leitender Rang ist in diesem Vers nicht ausdrücklich genannt.
- source_word: הָאֹפֶה
  choice: der Bäcker
  rationale: Die bestimmte Form bedeutet direkt »der Bäcker«. Ein Possessivpronomen oder der Zusatz »königlich« wäre gegenüber dem Ausgangstext eine unnötige Ergänzung.
- source_word: לַאֲדֹנֵיהֶם
  choice: an ihrem Herrn
  rationale: אָדוֹן bezeichnet hier den menschlichen Dienstherrn. »Herr« ist im Deutschen in diesem Hofkontext natürlich; die Apposition stellt klar, dass der König gemeint ist.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: dem König von Ägypten
  rationale: Die Apposition identifiziert ihren Herrn ausdrücklich. Die Wiederholung von »König von Ägypten« bewahrt die Betonung des Hebräischen.
theological_decisions:
- issue: Moralische Stärke von חָטְאוּ
  choice: versündigten sich an
  alternative: vergingen sich gegen / machten sich schuldig gegenüber
  rationale: Die Übersetzung bewahrt den Sündenaspekt des Verbs, ohne festzulegen, worin das Vergehen bestand oder ob es ausdrücklich religiöser Art war.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mundschenk« ist ein etablierter historischer Amtsbegriff; »versündigten sich an« erhält die moralische Aussage des Hebräischen. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
