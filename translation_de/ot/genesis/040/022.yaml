source:
  edition: WLC
  text: וְ/אֵ֛ת שַׂ֥ר הָ/אֹפִ֖ים תָּלָ֑ה כַּ/אֲשֶׁ֥ר פָּתַ֛ר לָ/הֶ֖ם יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: de
  text: Den obersten Bäcker aber ließ er aufhängen[a], genauso wie Josef es ihnen gedeutet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hängen«. Das hebräische Verb bezeichnet ein Aufhängen; je nach Zusammenhang kann auch eine Pfählung oder die öffentliche Zurschaustellung eines bereits Hingerichteten gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: aber
  rationale: 'Die Konjunktion steht hier im Kontrast zum vorherigen Vers: Der oberste Mundschenk wurde wieder eingesetzt, der oberste Bäcker dagegen aufgehängt. Der Akkusativmarker wird im Deutschen nicht eigens wiedergegeben.'
- source_word: שַׂר הָאֹפִים
  choice: den obersten Bäcker
  rationale: שַׂר bezeichnet hier den ranghöchsten Amtsträger unter den Bäckern des Hofes; »oberster Bäcker« ist idiomatisch und sachlich treffend.
- source_word: תָּלָה
  choice: ließ er aufhängen
  rationale: Das Verb bedeutet »hängen/aufhängen«. Die Konstruktion mit »ließ« gibt natürlich wieder, dass der Pharao als Herrscher die Hinrichtung veranlasste, ohne die genaue Vollzugsweise enger festzulegen als der hebräische Text.
- source_word: כַּאֲשֶׁר
  choice: genauso wie
  rationale: Die Wendung kennzeichnet die genaue Entsprechung zwischen dem Geschehen und Josefs vorheriger Traumdeutung.
- source_word: פָּתַר
  choice: gedeutet hatte
  rationale: פתר bezeichnet im Zusammenhang mit Träumen deren Deutung. Das Plusquamperfekt macht im Deutschen deutlich, dass die Deutung dem Vollzug vorausging.
- source_word: לָהֶם
  choice: ihnen
  rationale: Der Plural bezieht sich auf beide Hofbeamten; »ihnen gedeutet« bewahrt diese Referenz knapp und natürlich.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Gebräuchliche deutsche Form des hebräischen Namens יוֹסֵף.
