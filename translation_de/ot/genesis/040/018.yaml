  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: de
  text: 'Josef antwortete: »Das ist seine Deutung: Die drei Körbe sind drei Tage.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete
  rationale: Die hebräische Doppelformel leitet Josefs Erwiderung ein. Im modernen Deutschen gibt »antwortete« ihre kommunikative Funktion vollständig und natürlich wieder; »antwortete und sagte« wäre unnötig schwerfällig.
- source_word: פִּתְרֹנוֹ
  choice: seine Deutung
  rationale: פִּתְרוֹן bezeichnet in diesem Traumzusammenhang die Deutung. Das Suffix bezieht sich auf den zuvor geschilderten Traum beziehungsweise Traumbericht.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: die drei Körbe
  rationale: סַל bezeichnet einen Korb. Eine genauere Materialangabe ist im Vers nicht ausdrücklich enthalten.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: sind drei Tage
  rationale: Die nominale Identifikation wird direkt wiedergegeben und bewahrt die knappe symbolische Gleichsetzung des Hebräischen.
