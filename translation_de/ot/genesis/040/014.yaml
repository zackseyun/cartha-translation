base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: de
  text: 'Doch wenn es dir gut geht, denke an mich und erweise mir bitte Güte: Erwähne mich beim Pharao und hol mich aus diesem Haus heraus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Doch wenn
  rationale: Die Verbindung leitet nach Josefs Deutung eine nachdrückliche, zugleich bedingte Bitte ein. „Doch wenn“ gibt den adversativen und konditionalen Sinn natürlich wieder.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: dann denk bitte an mich
  rationale: זכר bedeutet hier „sich erinnern/an jemanden denken“. אִתְּךָ ist in dieser Verbindung idiomatisch; eine wörtliche Wiedergabe als „bei dir“ wäre im Deutschen missverständlich. Das im folgenden Satzteil stehende נָא prägt den gesamten bittenden Appell und wird natürlich mit „bitte“ wiedergegeben.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: wenn es dir gut geht
  rationale: Die Wendung bezeichnet die erwartete Wiederherstellung und das Wohlergehen des Mundschenks. Die deutsche Formulierung bewahrt den zeitlichen Sinn und klingt gegenwärtig und natürlich.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: und erweise mir Güte
  rationale: חֶסֶד bezeichnet hier praktisch erwiesene Güte beziehungsweise loyale Zuwendung. „Güte erweisen“ wahrt die Würde und Bedeutungsbreite, ohne einen formellen Bund vorauszusetzen.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: Erwähne mich beim Pharao
  rationale: Der Hifil von זכר bedeutet in diesem Zusammenhang, Josef dem Pharao ins Gedächtnis beziehungsweise zur Kenntnis zu bringen. „Beim Pharao erwähnen“ ist präzise und idiomatisch.
- source_word: וְהוֹצֵאתַנִי מִן הַבַּיִת הַזֶּה
  choice: und hol mich aus diesem Haus heraus
  rationale: Der Hifil von יצא hat kausativen Sinn. „Hol mich ... heraus“ gibt die erbetene Befreiung natürlich wieder; „Haus“ bewahrt die konkrete Wortwahl des Hebräischen, die hier den Haftort bezeichnet.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der bittende Nachdruck wird durch „bitte“ und den Doppelpunkt verdeutlicht. „Haus“ bleibt als bewusst bildhafte beziehungsweise kontextgebundene Bezeichnung des Gefängnisses erhalten; da der Sinn aus dem Zusammenhang hervorgeht, ist keine Fußnote erforderlich.
