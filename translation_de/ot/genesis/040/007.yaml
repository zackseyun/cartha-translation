  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache der bedrückten Gesichter bleibt erhalten; zugleich wird die direkte Rede ohne schwerfällige Nachbildung des hebräischen Rede-Einleiters natürlich gestaltet.
