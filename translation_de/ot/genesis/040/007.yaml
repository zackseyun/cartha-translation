  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: de
  text: 'Da fragte er die Hofbeamten[a] des Pharao, die mit ihm im Haus seines Herrn in Gewahrsam waren: „Warum sehen eure Gesichter heute so bedrückt aus?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Eunuchen“. Das hebräische Wort kann sowohl buchstäblich Eunuchen als auch königliche Hofbeamte im weiteren Sinn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Da fragte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da fragte er“ gibt die zeitlich-folgerichtige Verbindung im Deutschen natürlich wieder.
- source_word: סְרִיסֵי פַרְעֹה
  choice: die Hofbeamten des Pharao
  rationale: סָרִיס kann sowohl einen Eunuchen als auch allgemein einen hohen königlichen Amtsträger bezeichnen. Im Kontext steht die Hofstellung im Vordergrund; die engere Bedeutung wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die mit ihm
  rationale: Das Pronomen bezieht sich im Kontext auf Josef. Die pronominale Form des Hebräischen bleibt erhalten, ohne den Namen erläuternd einzufügen.
- source_word: בְמִשְׁמַר
  choice: in Gewahrsam
  rationale: Das Substantiv bezeichnet hier den Zustand beziehungsweise Ort der Bewachung und Haft. „In Gewahrsam“ ist im Deutschen idiomatisch und passt zum Gefängniskontext.
- source_word: בֵּית אֲדֹנָיו
  choice: im Haus seines Herrn
  rationale: Gemeint ist das Haus von Josefs Herrn. „Herr“ wahrt die übliche Bedeutung von אָדוֹן und lässt den im Kontext erkennbaren Abhängigkeitsrang bestehen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Rede-Einleiter wird im natürlichen modernen Deutsch durch den Doppelpunkt vor der direkten Rede wiedergegeben; ein zusätzliches „und sagte“ wäre nach „fragte“ unnötig.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die einfache direkte Frage entspricht dem hebräischen Interrogativ.
- source_word: פְּנֵיכֶם רָעִים
  choice: sind eure Gesichter … so bedrückt
  rationale: Wörtlich sind die Gesichter „schlecht“. Gemeint ist ein sichtbar trauriger oder bekümmerter Ausdruck. Die Formulierung bewahrt das Bild der Gesichter und gibt das Idiom verständlich wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Dies ist die natürliche deutsche Entsprechung der Zeitangabe.
theological_decisions: []
