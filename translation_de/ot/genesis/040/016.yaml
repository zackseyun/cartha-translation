source:
  edition: WLC
  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: de
  text: 'Als der oberste Bäcker sah, dass Josef eine gute Deutung gegeben hatte, sagte er zu Josef: »Auch ich hatte einen Traum: Da waren drei Körbe mit Weißbrot[a] auf meinem Kopf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »drei Körbe mit Backwaren«; die Bedeutung des hebräischen Wortes חֹרִי ist unsicher. Es kann sich auf weißes Brot beziehungsweise Backwerk beziehen oder die Körbe als durchbrochen beziehungsweise geflochten beschreiben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: der oberste Bäcker
  rationale: שַׂר bezeichnet hier den ranghöchsten Amtsträger unter den Bäckern. »Der oberste Bäcker« ist im Deutschen klar und idiomatisch.
- source_word: כִּי טוֹב פָּתָר
  choice: dass Josef eine gute Deutung gegeben hatte
  rationale: Die Wendung besagt, dass die Deutung als gut beziehungsweise gelungen wahrgenommen wurde. Sie wird nicht auf »günstig« verengt, obwohl die positive Deutung des Mundschenks den Bäcker vermutlich ermutigte.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Auch ich hatte einen Traum
  rationale: 'Die hebräische Äußerung ist elliptisch (wörtlich etwa: »Auch ich – in meinem Traum«). Die deutsche Fassung ergänzt die im Zusammenhang eindeutige Aussage natürlich, ohne zusätzlichen Inhalt einzuführen.'
- source_word: וְהִנֵּה
  choice: Da waren
  rationale: הִנֵּה führt das plötzlich vor Augen stehende Traumbild ein. »Da waren« vermittelt diese präsentierende Funktion in natürlichem modernem Deutsch.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: drei Körbe mit Weißbrot
  rationale: חֹרִי ist lexikalisch unsicher. Die Hauptfassung folgt der traditionellen Deutung als weißes Brot beziehungsweise helles Backwerk; mögliche Deutungen als Bezeichnung der Körbe werden in der Fußnote bewahrt.
- source_word: עַל רֹאשִׁי
  choice: auf meinem Kopf
  rationale: Die schlichte Ortsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: יוֹסֵף
  choice: Josef
  rationale: »Josef« ist die etablierte deutsche Form des hebräischen Namens יוֹסֵף und bleibt für heutige Leser unmittelbar erkennbar.
