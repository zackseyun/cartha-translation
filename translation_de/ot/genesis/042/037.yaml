source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: de
  text: 'Da sagte Ruben zu seinem Vater: „Du darfst meine beiden Söhne töten, wenn ich ihn nicht zu dir zurückbringe. Vertraue ihn mir an,[a] und ich selbst werde ihn zu dir zurückbringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gib ihn in meine Hand.“'
    reason: Die Fußnote bewahrt die konkrete hebräische Metapher hinter der idiomatischen Wiedergabe „Vertraue ihn mir an“.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: אֶל אָבִיו
  choice: zu seinem Vater
  rationale: Die einfache Verwandtschaftsangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Bei eingeleiteter direkter Rede wäre ein zusätzliches „und sprach“ oder „mit den Worten“ im modernen Deutsch unnötig.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Du darfst meine beiden Söhne töten
  rationale: Der Hifil von מות bezeichnet das Verursachen des Todes. „Du darfst … töten“ gibt Rubens drastisches Pfand als Ermächtigung wieder, ohne die Form als bloßen Befehl misszuverstehen.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: wenn ich ihn nicht zu dir zurückbringe
  rationale: Die negative Bedingung bleibt erhalten; „zurückbringen“ ergibt sich aus dem Kontext der zugesagten Rückkehr Benjamins.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Vertraue ihn mir an
  rationale: Die wörtliche Hand-Metapher bezeichnet hier die Übergabe in Rubens Verantwortung. Die idiomatische Bedeutung steht im Haupttext; das konkrete hebräische Bild wird in der Fußnote bewahrt.
- source_word: וַאֲנִי
  choice: und ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt Nachdruck, der durch „ich selbst“ wiedergegeben wird.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: werde ihn zu dir zurückbringen
  rationale: Der Hifil von שוב bedeutet, jemanden zurückkehren zu lassen beziehungsweise zurückzubringen.
