source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: de
  text: 'Doch er sagte: »Mein Sohn wird nicht mit euch hinabziehen; denn sein Bruder ist tot, und er allein ist übrig geblieben. Sollte ihm auf dem Weg, den ihr geht, ein Unglück zustoßen, so würdet ihr mein graues Haar in Kummer ins Totenreich[a] hinabbringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Scheol; gemeint ist der Bereich der Toten, je nach Zusammenhang auch mit »Grab« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: wird nicht … hinabziehen
  rationale: ירד bezeichnet wörtlich das Hinabgehen; Reisen von Kanaan nach Ägypten werden in Genesis regelmäßig so beschrieben. »Hinabziehen« bewahrt diese Erzählgeografie und klingt im Deutschen natürlich.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die konkrete Verwandtschaftsbezeichnung בן mit Suffix der 1. Person Singular wird unmittelbar wiedergegeben.
- source_word: אָחִיו מֵת
  choice: sein Bruder ist tot
  rationale: 'Die Formulierung bewahrt Jakobs gegenwärtige Sicht: Joseph befindet sich seiner Überzeugung nach im Zustand des Totseins.'
- source_word: וְהוּא לְבַדּוֹ נִשְׁאָר
  choice: und er allein ist übrig geblieben
  rationale: »Allein« erhält die Hervorhebung von לְבַדּוֹ; »übrig geblieben« gibt נִשְׁאָר idiomatisch und nah am Hebräischen wieder.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: Sollte ihm … ein Unglück zustoßen
  rationale: Die konditionale Bedeutung ergibt sich aus dem Zusammenhang. אָסוֹן bezeichnet schweres Unheil beziehungsweise ein Unglück; die deutsche Wendung ist natürlich, ohne dessen Art festzulegen.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: auf dem Weg, den ihr geht
  rationale: Die konkrete Wegmetapher und das Verb des Gehens bleiben erhalten; zugleich ist die Formulierung in modernem Deutsch verständlich.
- source_word: וְהוֹרַדְתֶּם
  choice: so würdet ihr … hinabbringen
  rationale: Der Hifil von ירד bedeutet »hinabbringen«. Der Konjunktiv gibt die Folge des hypothetischen Unglücks wieder.
- source_word: שֵׂיבָתִי
  choice: mein graues Haar
  rationale: Die konkrete Metonymie des Hebräischen für Jakobs hohes Alter wird bewahrt, statt sie zur abstrakten Wendung »mein Alter« zu verflachen.
- source_word: בְּיָגוֹן
  choice: in Kummer
  rationale: יָגוֹן bezeichnet tiefen Kummer oder Gram. »In Kummer« erhält den emotionalen Zustand und passt zur Satzkonstruktion.
- source_word: שְׁאֹלָה
  choice: ins Totenreich
  rationale: שְׁאוֹל bezeichnet den Bereich der Toten und ist nicht in jedem Kontext mit einem einzelnen Grab gleichzusetzen. »Totenreich« ist im Deutschen verständlich und lässt die genaue Vorstellung offen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: ins Totenreich
  alternative: ins Grab / in den Scheol
  rationale: »Totenreich« bewahrt den weiteren Bedeutungsumfang von שְׁאוֹל und vermeidet die Verengung auf ein physisches Grab. Gegenüber der Transliteration »Scheol« ist es für gewöhnliche heutige Leser unmittelbar verständlich, ohne eine ausgearbeitete Jenseitslehre einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Wortwurzel ירד wird durch »hinabziehen« und »hinabbringen« erkennbar gehalten. Die syntaktische Spannung zwischen befürchtetem Unglück und dessen Folge bleibt bestehen.
