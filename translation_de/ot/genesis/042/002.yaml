source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: de
  text: 'Er sagte: „Seht, ich habe gehört, dass es in Ägypten Getreide gibt. Zieht dorthin hinab und kauft dort Getreide für uns, damit wir leben und nicht sterben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Mitteilung hervor. „Seht“ bewahrt diesen Impuls in würdigem, verständlichem Deutsch.
- source_word: שָׁמַעְתִּי
  choice: ich habe gehört
  rationale: Das Perfekt bezeichnet eine erhaltene Information, die für die gegenwärtige Lage bedeutsam ist; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: שֶׁבֶר
  choice: Getreide
  rationale: Im Zusammenhang der Hungersnot bezeichnet das Wort Getreide beziehungsweise einen zum Kauf verfügbaren Getreidevorrat, nicht allgemein nur Nahrung.
- source_word: רְדוּ
  choice: Zieht … hinab
  rationale: Die Richtungsangabe des hebräischen Verbs wird bewahrt und entspricht der Reise von Kanaan nach Ägypten.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das Richtungsadverb bezeichnet das Ziel der Bewegung und wird im Deutschen idiomatisch mit „dorthin“ wiedergegeben.
- source_word: וְשִׁבְרוּ
  choice: und kauft … Getreide
  rationale: Das Verb bezeichnet in diesem Kontext ausdrücklich den Kauf von Getreide; das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen genannt.
- source_word: לָנוּ
  choice: für uns
  rationale: Der Dativ des Vorteils wird im Deutschen klar und natürlich mit „für uns“ ausgedrückt.
- source_word: מִשָּׁם
  choice: dort
  rationale: Das Hebräische bedeutet wörtlich „von dort“. In Verbindung mit „kaufen“ gibt „dort“ im Deutschen den Herkunftsort idiomatisch wieder, ohne eine schwerfällige Formulierung zu erzeugen.
- source_word: וְנִחְיֶה
  choice: damit wir leben
  rationale: Die Verbform drückt hier den beabsichtigten Zweck beziehungsweise das erhoffte Ergebnis des Getreidekaufs aus.
- source_word: וְלֹא נָמוּת
  choice: und nicht sterben
  rationale: Die koordinierte negative Aussage bewahrt die knappe Gegenüberstellung von Leben und Sterben sowie die Dringlichkeit des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht im Plural, da Jakob zu seinen Söhnen spricht. Die räumliche Bewegung „hinab“ sowie die pointierte Gegenüberstellung „leben und nicht sterben“ bleiben erhalten.
