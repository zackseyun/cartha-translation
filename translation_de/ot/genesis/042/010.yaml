  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: de
  text: 'Doch sie sagten zu ihm: „Nein, mein Herr! Deine Diener sind gekommen, um Lebensmittel zu kaufen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Getreide zu kaufen“. Wörtlich steht im Hebräischen ein allgemeines Wort für Nahrung; im Zusammenhang mit der Hungersnot ist wahrscheinlich Getreide gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Doch sie sagten
  rationale: Das Waw führt die Erzählung fort; „doch“ gibt hier zugleich den Gegensatz zu Josefs unmittelbar vorausgehender Beschuldigung natürlich wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל mit Pronominalsuffix bezeichnet den Adressaten der Antwort, also Josef.
- source_word: לֹא
  choice: Nein
  rationale: Die Verneinung dient in der direkten Rede als entschiedener Widerspruch.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede wahrt das soziale Gefälle gegenüber dem ägyptischen Amtsträger, ohne „Herr“ hier als Gottesbezeichnung zu verstehen.
- source_word: וַעֲבָדֶיךָ
  choice: deine Diener
  rationale: עֶבֶד kann auch „Sklave“ bedeuten, ist hier aber eine höfisch-unterwürfige Selbstbezeichnung und keine Aussage über ihren Rechtsstatus.
- source_word: בָּאוּ
  choice: sind gekommen
  rationale: Das Perfekt bezeichnet ihre erfolgte Ankunft, deren Zweck für die gegenwärtige Gesprächssituation maßgeblich ist.
- source_word: לִשְׁבָּר
  choice: um … zu kaufen
  rationale: Die Infinitivkonstruktion gibt den Zweck ihres Kommens an; im Zusammenhang bezeichnet das Verb den Erwerb von Nahrung beziehungsweise Getreide.
- source_word: אֹכֶל
  choice: Lebensmittel
  rationale: אֹכֶל bedeutet allgemein Nahrung oder Essbares. „Lebensmittel“ bewahrt diese Breite, während im Hungersnotkontext besonders Getreide gemeint sein dürfte.
theological_decisions: []
