  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: de
  text: 'Da erinnerte sich Josef an die Träume, die er von ihnen geträumt hatte, und sagte zu ihnen: »Ihr seid Spione! Ihr seid gekommen, um die Blöße des Landes[a] zu sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ungeschützten/verwundbaren Stellen des Landes«. Wörtlich steht im Hebräischen »die Blöße des Landes«; gemeint sind Bereiche, die einem Angriff offenstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Da erinnerte sich
  rationale: Die Wayyiqtol-Form führt die Erzählung fort und bezeichnet Josefs Erinnerung in diesem Augenblick; „erinnerte sich“ ist im Deutschen natürlich und präzise.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: die Träume, die er … geträumt hatte
  rationale: Die Wiedergabe bewahrt die hebräische Verbindung des Nomens „Träume“ mit dem gleichstämmigen Verb und verwendet für die zeitliche Vorordnung natürliches deutsches Plusquamperfekt.
- source_word: לָהֶם
  choice: über sie
  rationale: Im Zusammenhang beziehen sich die Träume auf Josefs Brüder. „Über sie“ gibt diese Bedeutung idiomatisch wieder, ohne die im Hebräischen mögliche relationale Weite unnötig auszubauen.
- source_word: מְרַגְּלִים
  choice: Spione
  rationale: Das Partizip bezeichnet hier Personen, denen feindliche Erkundung vorgeworfen wird; „Spione“ ist die klare und übliche deutsche Entsprechung.
- source_word: לִרְאוֹת
  choice: auszukundschaften
  rationale: Das Verb bedeutet wörtlich „zu sehen“. In Verbindung mit dem Vorwurf der Spionage und dem verwundbaren Zustand des Landes drückt „auszukundschaften“ den gemeinten Zweck im Deutschen natürlicher aus.
- source_word: עֶרְוַת הָאָרֶץ
  choice: die Blöße des Landes
  rationale: Die Hauptübersetzung bewahrt das auffällige hebräische Bild. Die Fußnote erläutert, dass damit die ungeschützten oder verwundbaren Bereiche des Landes gemeint sind.
- source_word: בָּאתֶם
  choice: ihr seid gekommen
  rationale: Das deutsche Perfekt passt zur unmittelbaren Anklage und hebt die gegenwärtige Bedeutung ihres Kommens hervor.
