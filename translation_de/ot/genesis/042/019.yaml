  to: Wenn ihr ehrliche Männer seid,[a] soll einer eurer Brüder an dem Ort in Gewahrsam gehalten werden, an dem ihr festgehalten werdet.[b] Ihr aber geht und bringt Getreide für den Hunger in euren Haushalten.[c]
  rationale: Die Revision beseitigt den nicht belegten Vergangenheitsbezug beim Gewahrsam und ersetzt die dynamische Umschreibung „vom Hunger bedroht“ durch eine näher am hebräischen Text bleibende, dennoch natürliche Formulierung. Der Kontrast zwischen dem einen zurückbleibenden Bruder und den übrigen wird mit „Ihr aber“ beibehalten, ohne „anderen“ ausdrücklich in den Text einzutragen.
