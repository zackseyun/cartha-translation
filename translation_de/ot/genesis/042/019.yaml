  naturalness: Die Fassung ist gut verständlich, doch „einer von euch Brüdern“ klingt weniger idiomatisch als „einer eurer Brüder“. Die revidierte Umschreibung des Gewahrsamsorts ist natürliches modernes Standarddeutsch und vermeidet zugleich einen unmarkierten Tempuswechsel.
  terminology: „ehrliche Männer“, „Getreide“ und „Haushalte“ sind passende Wiedergaben. „Hunger in euren Haushalten“ gibt die knappe Verbindung רַעֲבוֹן בָּתֵּיכֶם ohne die zusätzliche Deutung „bedroht“ wieder. Der Begriff „Gewahrsam“ wahrt die offene Bedeutung von בית משמר, ohne ein modernes Gefängnissystem vorauszusetzen.
