  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: de
  text: Wenn ihr ehrliche Männer seid,[a] soll einer eurer Brüder an dem Ort in Gewahrsam gehalten werden, an dem ihr festgehalten werdet.[b] Ihr aber geht und bringt Getreide für den Hunger in euren Haushalten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ihr wahrhaftige Männer seid.“ Das hebräische Adjektiv kann Menschen bezeichnen, deren Worte wahr und verlässlich sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Haus eures Gewahrsams“. Gemeint ist wahrscheinlich der Ort, an dem die Brüder festgehalten werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und ihr: Geht, bringt Getreide für den Hunger eurer Häuser.“ „Häuser“ meint hier die Hausgemeinschaften bzw. Haushalte.'
    reason: literal_rendering
lexical_decisions:
- source_word: כֵּנִים
  choice: ehrliche Männer
  rationale: Das Adjektiv bezeichnet hier im Zusammenhang mit Josefs Verhör Männer, deren Aussagen wahr und verlässlich sind. „Ehrliche Männer“ ist natürliches Deutsch; die Alternative „wahrhaftig“ bleibt in der Fußnote erhalten.
- source_word: אֲחִיכֶם אֶחָד
  choice: einer von euch Brüdern
  rationale: 'Die Formulierung bewahrt den partitiven Sinn: Ein einzelner aus der Gruppe der Brüder soll zurückbleiben.'
- source_word: יֵאָסֵר
  choice: gefangen gehalten werden
  rationale: Das Niphal von אסר kann „gebunden“ oder „inhaftiert werden“ bedeuten. Hier legt der anschließende Gewahrsamsort die allgemeinere Bedeutung einer Festsetzung nahe, ohne eine bestimmte Gefängnisform vorauszusetzen.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: dort, wo ihr in Gewahrsam wart
  rationale: Wörtlich steht „im Haus eures Gewahrsams“. Der Suffixbezug meint wahrscheinlich den Ort, an dem die Brüder festgehalten wurden. Die Wiedergabe ist im Deutschen verständlich und vermeidet die unnatürliche Formulierung „Haus eures Gewahrsams“.
- source_word: וְאַתֶּם לְכוּ
  choice: Ihr anderen aber geht
  rationale: Das ausdrücklich gesetzte Pronomen hebt die übrigen Brüder gegenüber dem einen Zurückbleibenden hervor. „Ihr anderen aber“ macht diesen Kontrast natürlich sichtbar, auch wenn וְ formal eine einfache Verknüpfung ist.
- source_word: שֶׁבֶר
  choice: Getreide
  rationale: Im Josefzyklus bezeichnet שֶׁבֶר regelmäßig das während der Hungersnot beschaffte oder gekaufte Getreide.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: für eure vom Hunger bedrohten Familien
  rationale: Die knappe hebräische Verbindung bedeutet Getreide wegen des Hungers, der die Hausgemeinschaften betrifft. „Familien“ gibt בָּתִּים hier als Hausgemeinschaften wieder; „vom Hunger bedroht“ vermeidet die im Deutschen unklare Wendung „Hungersnot eurer Häuser“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Kontrast zwischen dem einen festgehaltenen Bruder und den übrigen wird durch „Ihr anderen aber“ verdeutlicht. Die ungewöhnlich knappe hebräische Verbindung am Versende wird verständlich wiedergegeben und zugleich in einer Fußnote formal offengelegt.
