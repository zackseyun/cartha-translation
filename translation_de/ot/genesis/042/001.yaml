  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: de
  text: 'Als Jakob sah, dass es in Ägypten Getreide gab, sagte er zu seinen Söhnen: »Warum schaut ihr einander an?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum zeigt ihr euch?« Das hebräische Verb lässt unterschiedliche Deutungen zu; im Zusammenhang ist wahrscheinlich gemeint, dass die Brüder einander zögernd oder ratlos ansehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Jakob erfuhr
  rationale: Das Verb bedeutet wörtlich »sehen«, kann aber auch das Wahrnehmen bzw. Erfahren einer Tatsache bezeichnen. »Als … erfuhr« gibt in diesem Zusammenhang natürlich wieder, dass Jakob von dem verfügbaren Getreide Kenntnis erhielt, und verbindet die Wahrnehmung zeitlich mit seiner anschließenden Rede.
- source_word: כִּי יֶשׁ
  choice: dass es … gab
  rationale: כִּי leitet den Inhalt von Jakobs Wahrnehmung ein, יֵשׁ bezeichnet das Vorhandensein. Im deutschen Erzähltempus ist »dass es … gab« idiomatisch.
- source_word: שֶׁבֶר
  choice: Getreide
  rationale: Im Kontext der Hungersnot bezeichnet שֶׁבֶר Getreide, das in Ägypten erhältlich bzw. zu kaufen war. »Getreide« ist präziser als das allgemeinere »Nahrung«.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Die Präposition בְּ ist hier gewöhnlich lokativ gebraucht.
- source_word: לְבָנָיו
  choice: zu seinen Söhnen
  rationale: Gemeint sind Jakobs männliche Nachkommen, die in der folgenden Handlung nach Ägypten ziehen.
- source_word: לָמָּה
  choice: Warum
  rationale: Die direkte Frage wird schlicht und idiomatisch wiedergegeben.
- source_word: תִּתְרָאוּ
  choice: seht ihr einander nur an
  rationale: 'Die Hitpael-Form von ראה wird hier am wahrscheinlichsten reziprok verstanden: Die Brüder sehen einander untätig bzw. ratlos an. Das deutsche »nur« bringt die im Kontext liegende Kritik an ihrer Untätigkeit zum Ausdruck, ohne einen Fortdaueraspekt stärker zu behaupten, als die Verbform erkennen lässt.'
