id: GEN.42.34
reference: Genesis 42:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: de
  text: Bringt euren jüngsten Bruder zu mir, damit ich weiß, dass ihr keine Spione, sondern ehrliche Männer seid. Dann werde ich euch euren Bruder zurückgeben, und ihr dürft im Land Handel treiben.[a]“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ihr dürft euch im Land frei bewegen.« Das hebräische Verb kann allgemeiner das Umherziehen bezeichnen; hier passt jedoch die kaufmännische Bedeutung »Handel treiben« am besten zum Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Bringt
  rationale: Der Hifil-Imperativ von בוא wird im Deutschen natürlich und prägnant als Aufforderung wiedergegeben.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: euren jüngsten Bruder
  rationale: הַקָּטֹן bezeichnet im Geschwisterkontext am natürlichsten den jüngsten Bruder, nicht lediglich einen kleineren oder jüngeren.
- source_word: וְאֵדְעָה
  choice: damit ich weiß
  rationale: Die Kohortativform bezeichnet hier den beabsichtigten Zweck beziehungsweise das Ergebnis der Aufforderung; ein deutscher Finalsatz gibt diesen Zusammenhang idiomatisch wieder.
- source_word: מְרַגְּלִים
  choice: Spione
  rationale: Das Partizip wird hier substantivisch gebraucht und bezeichnet Personen, die als Spione auftreten.
- source_word: כֵנִים
  choice: ehrliche Männer
  rationale: Das Wort bezeichnet Verlässlichkeit oder Redlichkeit und steht als Gegenbegriff zu »Spione«; »ehrliche Männer« wahrt den maskulinen Plural und klingt im Deutschen natürlich.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: werde ich euch euren Bruder zurückgeben
  rationale: Im Kontext ist der Bruder festgehalten worden; »zurückgeben« macht die im Hebräischen vorausgesetzte Wiederherstellung knapp und natürlich deutlich.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: und ihr dürft im Land Handel treiben
  rationale: סחר hat häufig eine kaufmännische Bedeutung. Im Zusammenhang der Getreidereise passt die Erlaubnis zum Handel am besten, während die weiter gefasste Bedeutung in einer Fußnote erhalten bleibt.
