  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: de
  text: 'Doch Benjamin, Josefs Bruder, schickte Jakob nicht mit seinen Brüdern. Denn er sagte: »Ihm könnte ein Unglück[a] zustoßen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Unheil«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Doch
  rationale: 'Die Konjunktion verbindet den Vers mit dem vorhergehenden Bericht und markiert zugleich den Gegensatz: Die anderen Söhne zogen fort, Benjamin jedoch nicht. Das Akkusativzeichen אֶת bleibt unübersetzt.'
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אֲחִי יוֹסֵף
  choice: Josefs Bruder
  rationale: Die natürliche deutsche Genitivverbindung gibt die hebräische Status-constructus-Verbindung genau wieder und hebt Benjamins Beziehung zu Josef hervor.
- source_word: לֹא שָׁלַח יַעֲקֹב
  choice: schickte Jakob nicht
  rationale: שׁלח bedeutet hier im Erzählzusammenhang »schicken«; die deutsche Wortstellung bewahrt Jakob als ausdrückliches Subjekt.
- source_word: אֶת אֶחָיו
  choice: mit seinen Brüdern
  rationale: 'Obwohl אֶת formal den Akkusativ markiert, verlangt der Zusammenhang eine komitative Wiedergabe: Benjamin wurde nicht zusammen mit seinen Brüdern geschickt.'
- source_word: כִּי אָמַר
  choice: Denn er sagte
  rationale: כִּי leitet die Begründung ein, und אמר wird ohne interpretierende Umdeutung als »sagte« wiedergegeben.
- source_word: פֶּן יִקְרָאֶנּוּ אָסוֹן
  choice: Ihm könnte ein Unglück zustoßen
  rationale: פֶּן bezeichnet eine befürchtete Möglichkeit. Die deutsche Konstruktion mit »könnte« gibt diese Sorge natürlich wieder; יִקְרָאֶנּוּ אָסוֹן ist idiomatisch als das Zustoßen eines Unglücks zu verstehen.
