  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: de
  text: Wir sind zwölf Brüder, Söhne unseres Vaters. Einer ist nicht mehr da[a], und der Jüngste ist heute bei unserem Vater im Land Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Einer ist nicht.« Die hebräische Wendung kann bedeuten, dass jemand fehlt, fort ist oder für tot gehalten wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Wir sind zwölf Brüder
  rationale: Die verblosen hebräischen Satzglieder werden im Deutschen mit »sind« natürlich verbunden; אַחִים bezeichnet hier leibliche Brüder.
- source_word: בְּנֵי אָבִינוּ
  choice: Söhne unseres Vaters
  rationale: Die appositionale Formulierung bewahrt die ausdrückliche Verwandtschaftsangabe und die Struktur des Hebräischen.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Einer ist nicht mehr da
  rationale: Das idiomatische אֵינֶנּוּ besagt wörtlich, dass er »nicht da/ nicht vorhanden« ist. Die Wiedergabe lässt offen, ob er lediglich verschwunden oder tot ist.
- source_word: וְהַקָּטֹן
  choice: und der Jüngste
  rationale: Das substantivierte »der Kleine/Junge« bezeichnet im Zusammenhang einer Geschwisterreihe idiomatisch den jüngsten Bruder.
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: ist heute bei unserem Vater
  rationale: אֶת bezeichnet hier das Zusammensein mit dem Vater; »heute« gibt הַיּוֹם direkt wieder und steht im Deutschen an natürlicher Stelle.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die ausdrückliche Bezeichnung »Land Kanaan« wird knapp und idiomatisch beibehalten.
theological_decisions:
- issue: Bedeutung von אֵינֶנּוּ im Blick auf Josef
  choice: ist nicht mehr da
  alternative: ist tot / lebt nicht mehr
  rationale: Die Brüder halten Josef zwar für verloren beziehungsweise tot, doch der hebräische Ausdruck selbst legt den Tod nicht ausdrücklich fest. Die Übersetzung bewahrt diese erzählerische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, berichtende Satzstruktur des Hebräischen bleibt erhalten; zugleich vermeidet »nicht mehr da« eine unberechtigte Festlegung auf den Tod.
