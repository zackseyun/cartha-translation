  text: And he put them in custody for three days[a].
translation:
  language: de
  text: Und er nahm sie drei Tage lang in Gewahrsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet gewöhnlich „sammeln“ oder „zusammenbringen“. In der Verbindung mit „in Gewahrsam“ bezeichnet es hier idiomatisch das Ingewahrsamnehmen bzw. Festhalten unter Bewachung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: nahm
  rationale: אָסַף bedeutet wörtlich „sammeln“ oder „zusammenbringen“, bezeichnet hier aber in Verbindung mit אֶל מִשְׁמָר idiomatisch das Verbringen in Gewahrsam. „nahm … in Gewahrsam“ ist im modernen Deutschen natürlich und bleibt nahe an der Wendung.
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralobjekt bezieht sich auf Josefs Brüder.
- source_word: אֶל מִשְׁמָר
  choice: in Gewahrsam
  rationale: Die Verbindung bezeichnet das Verbringen an einen bewachten Ort beziehungsweise in einen Zustand des Festgehaltenwerdens. „Gewahrsam“ vermeidet die nicht zwingend geforderte Festlegung auf ein Gefängnis.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Die Zeitangabe bezeichnet die Dauer; „drei Tage lang“ ist eine natürliche und genaue deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung „in Gewahrsam nehmen“ gibt das hebräische Idiom natürlich wieder, ohne מִשְׁמָר unnötig als formelles Gefängnis zu präzisieren.
