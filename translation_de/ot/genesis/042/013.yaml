  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: de
  text: 'Da sagten sie: »Wir, deine Diener, sind zwölf Brüder, Söhne ein und desselben Mannes im Land Kanaan. Und siehe, der Jüngste ist heute bei unserem Vater, und der eine ist nicht mehr da[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der eine ist nicht«. Die verhüllende Wendung kann bedeuten, dass er fort oder nicht mehr am Leben ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Gibt die fortschreitende Erzählform des Wayyiqtol in natürlichem modernem Deutsch wieder.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Die Brüder sprechen gegenüber dem ägyptischen Herrscher ehrerbietig und bezeichnen damit keine tatsächliche Versklavung.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: Wir ... sind zwölf Brüder
  rationale: Bewahrt Zahl und Verwandtschaftsangabe in idiomatischer deutscher Wortstellung.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: Söhne ein und desselben Mannes
  rationale: Die männliche Verwandtschaftsbezeichnung bleibt erhalten; die Wendung macht deutlich, dass alle denselben Vater haben.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Bewahrt das ausdrücklich genannte אֶרֶץ und entspricht geläufigem biblischem Deutsch.
- source_word: וְהִנֵּה
  choice: unmarkiert im folgenden Aussagesatz
  rationale: הִנֵּה lenkt hier die Aufmerksamkeit auf die nun erklärte Lage. Ein wörtliches »siehe« wäre im heutigen deutschen Dialog steif; die präsentierende Funktion ergibt sich natürlich aus der Satzfolge.
- source_word: הַקָּטֹן
  choice: der Jüngste
  rationale: Im familiären Zusammenhang ist nicht bloß geringe Größe, sondern der jüngste Bruder gemeint.
- source_word: אֶת אָבִינוּ
  choice: bei unserem Vater
  rationale: אֶת bezeichnet hier Begleitung bzw. Zusammensein, nicht das direkte Objekt.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und präzise Wiedergabe der Zeitangabe.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: und der eine ist nicht mehr da
  rationale: 'Bewahrt die euphemistische Unbestimmtheit: Joseph ist abwesend bzw. verloren, ohne seinen Tod ausdrücklich festzustellen.'
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftssprache
  choice: Söhne ein und desselben Mannes
  alternative: Kinder ein und desselben Mannes
  rationale: Der hebräische Text spricht ausdrücklich von männlichen Nachkommen und meint Jakobs Söhne.
- issue: Mehrdeutigkeit von Josephs Status
  choice: der eine ist nicht mehr da
  alternative: der eine lebt nicht mehr
  rationale: Die Aussage legt Verlust oder Tod nahe, erklärt Joseph aber nicht ausdrücklich für tot. Die Übersetzung wahrt diese erzählerische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung »deine Diener« bleibt erhalten; unnötig altertümliche Dialogmarker wie »siehe« werden vermieden. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Wendung, auf die er sich bezieht.
