source:
  edition: WLC
  text: וַ/יַּעַן֩ רְאוּבֵ֨ן אֹתָ֜/ם לֵ/אמֹ֗ר הֲ/לוֹא֩ אָמַ֨רְתִּי אֲלֵי/כֶ֧ם לֵ/אמֹ֛ר אַל תֶּחֶטְא֥וּ בַ/יֶּ֖לֶד וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/גַם דָּמ֖/וֹ הִנֵּ֥ה נִדְרָֽשׁ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: de
  text: 'Da antwortete Ruben ihnen: »Habe ich euch nicht gesagt: ›Versündigt euch nicht an dem Jungen‹? Aber ihr habt nicht gehört. Und seht: Auch sein Blut wird gefordert.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֶטְאוּ בַיֶּלֶד
  choice: Versündigt euch nicht an dem Jungen
  rationale: Gibt das Verb חטא und die gegen die Person gerichtete Präposition בְּ prägnant wieder, ohne die Tat näher zu bestimmen, als es der hebräische Text tut.
- source_word: דָּמוֹ ... נִדְרָשׁ
  choice: Sein Blut wird eingefordert
  rationale: Bewahrt das hebräische Bild vom Blut, für das Rechenschaft beziehungsweise Vergeltung verlangt wird, und erhält die passive Form sowie die Offenheit darüber, wer es einfordert.
- source_word: הִנֵּה
  choice: seht
  rationale: Markiert Rubens nachdrücklichen Hinweis auf die nun eingetretene Folge in einer würdigen, verständlichen Form.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: Aber ihr habt nicht gehört
  rationale: Bewahrt die konkrete Hörsprache des Hebräischen; im Kontext bedeutet sie zugleich, dass sie nicht auf Ruben hörten.
theological_decisions:
- issue: Wer das Blut einfordert
  choice: 'Passiv: »wird eingefordert«'
  alternative: »Gott fordert Rechenschaft für sein Blut«
  rationale: Das Hebräische nennt den Handelnden nicht ausdrücklich. Die passive Wiedergabe wahrt diese Offenheit und importiert keine explizite Benennung.
- issue: Bedeutung von »Blut«
  choice: Das Bild »sein Blut« bleibt stehen
  alternative: »Für seinen Tod wird Rechenschaft verlangt«
  rationale: Die bildhafte Sprache trägt die Vorstellung von Blutschuld und Verantwortlichkeit, obwohl die Brüder zu diesem Zeitpunkt Josephs tatsächliches Schicksal nicht kennen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die Wiederholung von לֵאמֹר wird nicht mechanisch doppelt als »sagen« wiedergegeben, da die direkte Rede ihre Funktion natürlich ausdrückt. Der Gedankenstrich hebt den nachdrücklichen Umschlag bei »Und nun« hervor.
