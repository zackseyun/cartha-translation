  to: 'Da antwortete Ruben ihnen: »Habe ich euch nicht gesagt: ›Versündigt euch nicht an dem Jungen‹? Aber ihr habt nicht gehört. Und seht: Auch sein Blut wird gefordert.«'
  rationale: Die Schlusszeile stellt die ausdrücklich additive Partikel וְגַם mit »auch« wieder her und gibt הִנֵּה zugleich idiomatisch durch »Seht« wieder. Das unpersönliche Passiv und die Bildsprache von Blut bleiben erhalten.
  reviewer_model: gpt-5.6-terra
