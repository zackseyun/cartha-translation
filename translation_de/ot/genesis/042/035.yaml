base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: de
  text: Als sie ihre Säcke leerten, entdeckte jeder sein Silberbündel[a] in seinem Sack. Als sie und ihr Vater ihre Silberbündel sahen, fürchteten sie sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Geldpäckchen“. Das hebräische Wort bezeichnet etwas, das zusammengebunden oder eingewickelt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Als sie … leerten
  rationale: Die Konstruktion aus וַיְהִי und Partizip bezeichnet den zeitlichen Rahmen der folgenden Entdeckung. Die deutsche Nebensatzform gibt dies natürlich wieder, ohne eine schwerfällige Ereignisformel einzufügen.
- source_word: שַׂקֵּיהֶם
  choice: ihre Säcke
  rationale: שַׂק bezeichnet hier die für Getreide und Waren verwendeten Säcke; „Säcke“ ist konkret und entspricht dem antiken Gegenstand.
- source_word: וְהִנֵּה
  choice: da fand sich
  rationale: הִנֵּה hebt die überraschende Entdeckung hervor. „Da fand sich“ vermittelt diesen plötzlichen Befund in natürlichem modernem Deutsch.
- source_word: אִישׁ
  choice: bei jedem
  rationale: אִישׁ wird distributiv gebraucht und meint jeden Einzelnen der Brüder.
- source_word: צְרוֹר כַּסְפּוֹ
  choice: sein Silberbündel
  rationale: צְרוֹר bezeichnet etwas Zusammengebundenes oder Eingewickeltes; כֶּסֶף ist hier das als Zahlungsmittel verwendete Silber. „Silberbündel“ wahrt beide Bestandteile.
- source_word: בְּשַׂקּוֹ
  choice: in seinem Sack
  rationale: Die singularische Form entspricht distributiv jedem einzelnen Bruder.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם הֵמָּה וַאֲבִיהֶם
  choice: Als sie und ihr Vater ihre Silberbündel sahen
  rationale: Die ausdrücklich genannten Wahrnehmenden werden beibehalten. Der deutsche Temporalsatz verbindet die Wahrnehmung klar mit der folgenden Reaktion.
- source_word: וַיִּירָאוּ
  choice: bekamen sie Angst
  rationale: Die Form schildert ihre Furcht als Reaktion auf die Entdeckung; „bekamen sie Angst“ ist idiomatisch und dynamisch.
