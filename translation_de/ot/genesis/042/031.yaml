  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: וַנֹּאמֶר אֵלָיו heißt „da/und wir sagten zu ihm“, כֵּנִים bezeichnet die Brüder als ehrlich bzw. aufrichtig, und מְרַגְּלִים sind „Spione“. Das Verb הָיִינוּ steht jedoch im Präteritum („wir waren nicht“). Die Formulierung „wir sind keine Spione gewesen“ ist zwar verständlich, legt im Deutschen aber leicht nahe, sie seien früher einmal Spione gewesen und inzwischen nicht mehr. „Wir waren keine Spione“ bildet die hebräische Vergangenheitsform klarer und idiomatischer ab.'
