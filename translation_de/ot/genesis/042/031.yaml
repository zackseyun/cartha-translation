  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: de
  text: 'Da sagten wir zu ihm: »Wir sind ehrliche Leute; wir waren keine Spione.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Da sagten wir
  rationale: Das Wayyiqtol führt die Erzählung fort. »Da sagten wir« gibt die zeitlich-folgernde Verbindung im natürlichen deutschen Erzählstil wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person Singular maskulin wird unmittelbar mit »zu ihm« wiedergegeben.
- source_word: כֵּנִים
  choice: ehrliche Leute
  rationale: Das Adjektiv bezeichnet die Brüder hier als redlich und vertrauenswürdig, im Gegensatz zum Vorwurf der Spionage. »Ehrliche Leute« ist im Deutschen eine natürliche Selbstbezeichnung und entspricht dem maskulinen Plural.
- source_word: אֲנָחְנוּ
  choice: wir
  rationale: Das selbstständige Personalpronomen hebt das Subjekt hervor; die deutsche Satzstellung bewahrt die klare Selbstbehauptung.
- source_word: לֹא הָיִינוּ
  choice: wir sind keine … gewesen
  rationale: Die verneinte Form von היה mit Partizip bezeichnet einen Zustand beziehungsweise eine Tätigkeit in der Vergangenheit. Das deutsche Perfekt passt zur wiedergegebenen früheren Aussage und lässt sowohl Status als auch Tätigkeit anklingen.
- source_word: מְרַגְּלִים
  choice: Spione
  rationale: Das Partizip von רגל bezeichnet in diesem Zusammenhang Personen, die als Kundschafter beziehungsweise Spione tätig sind. »Spione« ist die klare und idiomatische Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdige Erzählsprache. Die direkte Rede ist knapp gehalten; »ehrliche Leute« bildet den natürlichen Gegensatz zu »Spione«.
