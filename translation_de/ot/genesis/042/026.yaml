  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: de
  text: Dann luden sie ihr Getreide auf ihre Esel und zogen von dort weiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Vorräte“ oder „ihr gekauftes Getreide“. Das hebräische Wort kann Lebensmittelvorräte bezeichnen; in diesem Zusammenhang ist jedoch am ehesten das in Ägypten erworbene Getreide gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: luden sie
  rationale: נשׂא bedeutet grundsätzlich „heben/tragen“; mit einer Last und Reittieren gibt „laden“ den Vorgang im Deutschen natürlich und präzise wieder.
- source_word: שִׁבְרָם
  choice: ihr Getreide
  rationale: שֶׁבֶר kann Lebensmittelvorräte bezeichnen, meint in der Josefsgeschichte jedoch besonders das in Ägypten erworbene Getreide.
- source_word: עַל חֲמֹרֵיהֶם
  choice: auf ihre Esel
  rationale: Nach dem Verb „laden“ bezeichnet עַל das Aufbringen der Last; im Deutschen ist „auf ihre Esel“ idiomatisch und bewahrt den Richtungssinn.
- source_word: וַיֵּלְכוּ
  choice: zogen … weiter
  rationale: הלך ist ein allgemeines Bewegungsverb. Zusammen mit מִשָּׁם drückt „zogen von dort weiter“ die Abreise in natürlichem, würdigem Erzähldeutsch aus.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die deiktische Wendung wird direkt und verständlich mit „von dort“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit schlichtem, würdigem Erzählton. „Zogen … weiter“ vermeidet das schwerfällige „gingen von dort“ und passt zur Reise mit beladenen Eseln.
