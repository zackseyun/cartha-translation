  source_fidelity: „Dann luden sie ihr Getreide auf ihre Esel und zogen von dort weiter“ gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder. „luden“ ist für וַיִּשְׂאוּ in diesem Reisekontext idiomatisch; „ihr Getreide“ trifft שִׁבְרָם im Kontext des in Ägypten erworbenen Getreides. „auf ihre Esel“ entspricht עַל חֲמֹרֵיהֶם. „zogen von dort weiter“ gibt die Abreise mit וַיֵּלְכוּ מִשָּׁם natürlich wieder, ohne eine theologisch oder historisch weitergehende Deutung einzutragen.
