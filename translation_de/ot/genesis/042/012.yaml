  register: Modernes, würdevolles Standarddeutsch. Die wörtliche Metapher »Blöße des Landes« bleibt im Haupttext erhalten; die gemeinte militärisch-politische Verwundbarkeit und die kontextuelle Nuance des Auskundschaftens werden in den Fußnoten erläutert.
