  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: »Nein, ihr seid gekommen, um die Blöße des Landes[a] zu sehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bild bezeichnet die offenen, ungeschützten oder verwundbaren Stellen des Landes.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um … auszukundschaften«. Das hebräische Verb bedeutet wörtlich »sehen«; im Zusammenhang erhebt Josef damit jedoch den Vorwurf der Spionage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Doch er sagte zu ihnen
  rationale: Die Erzählform führt die Handlung fort; »doch« gibt hier zugleich den Gegensatz zur Zurückweisung der Brüder im vorherigen Vers natürlich wieder.
- source_word: לֹא כִּי
  choice: Nein!
  rationale: לֹא weist die Aussage der Brüder entschieden zurück; כִּי leitet die anschließende Gegenbehauptung ein. Im Deutschen vermittelt ein eigenständiges »Nein!« diese abrupte Korrektur klar, ohne ein unnatürliches »denn« einzufügen.
- source_word: עֶרְוַת הָאָרֶץ
  choice: die Blöße des Landes
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild der »Blöße« und lässt dessen metaphorische Bedeutung – ungeschützte oder verwundbare Stellen – offen erkennbar.
- source_word: בָּאתֶם לִרְאוֹת
  choice: ihr seid gekommen, um … zu sehen
  rationale: Das Perfekt bezeichnet ihr Kommen mit gegenwärtiger Relevanz; der Infinitiv ראה bedeutet wörtlich »sehen«, auch wenn der Zusammenhang ein Auskundschaften nahelegt.
