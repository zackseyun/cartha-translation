  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: de
  text: 'Er sagte zu seinen Brüdern: „Mein Silber ist zurückgegeben worden; seht, es ist sogar in meinem Sack!“ Da verließ sie der Mut[a], und sie zitterten. Sie sagten einer zum anderen[b]: „Was hat Gott uns da angetan?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr Herz ging hinaus“; auch möglich: „Ihr Herz versagte.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder Mann zu seinem Bruder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: ist zurückgegeben worden
  rationale: Das Hophal von שוב bezeichnet hier passiv, dass das Silber zurückgebracht beziehungsweise zurückgegeben wurde; das deutsche Perfekt passt zur unmittelbar festgestellten Lage.
- source_word: כַּסְפִּי
  choice: mein Silber
  rationale: כסף kann Geld bezeichnen, heißt aber konkret „Silber“. Die Wiedergabe bewahrt das historische Zahlungsmittel und bleibt im Zusammenhang verständlich.
- source_word: אַמְתַּחַת
  choice: Sack
  rationale: Das Wort bezeichnet einen Behälter für Getreide oder Reisevorräte; „Sack“ passt zum Transportzusammenhang der Erzählung.
- source_word: וְגַם הִנֵּה
  choice: seht, es ist sogar
  rationale: „Seht“ gibt den hinweisenden und überraschenden Charakter von הִנֵּה wieder; „sogar“ bewahrt die verstärkende Kraft von גַם.
- source_word: וַיֵּצֵא לִבָּם
  choice: da verließ sie der Mut
  rationale: Wörtlich heißt die Wendung „ihr Herz ging hinaus“. Im Zusammenhang bezeichnet sie einen plötzlichen Verlust von Mut oder Fassung; die natürliche deutsche Formulierung erhält den idiomatischen Sinn.
- source_word: וַיֶּחֶרְדוּ
  choice: sie zitterten
  rationale: חרד verbindet körperliches Zittern mit Angst und Bestürzung; „zitterten“ wahrt beide Dimensionen, ohne sie auszudeuten.
- source_word: אִישׁ אֶל אָחִיו
  choice: einer sagte zum anderen
  rationale: Die distributive Wendung lautet wörtlich „ein Mann zu seinem Bruder“. Im unmittelbaren Kontext sind ausschließlich die Brüder gemeint; die natürliche deutsche Form bewahrt die wechselseitige Rede, während die wörtliche Gestalt in der Fußnote genannt wird.
- source_word: מַה זֹּאת עָשָׂה ... לָנוּ
  choice: Was hat Gott uns da angetan?
  rationale: „Was ... da“ bewahrt den erstaunten Ausruf מַה זֹּאת. „Uns angetan“ gibt עשה ... לנו in dieser angstvollen Klage idiomatisch wieder, ohne Gottes Absicht näher zu bestimmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Verbform und Erzählzusammenhang weisen auf den einen Gott; „Gott“ ist daher die sachgemäße Wiedergabe.
theological_decisions:
- issue: Bezug von אֱלֹהִים in der angstvollen Frage der Brüder
  choice: Gott
  alternative: ein Gott / Götter
  rationale: Obwohl אֱלֹהִים formal pluralisch aussieht, steht das zugehörige Verb im Singular und der Erzählzusammenhang bezeichnet den einen Gott. Die Übersetzung lässt zugleich die erschrockene Deutung der Brüder stehen, ohne Gottes Beweggrund zu erklären.
- issue: Bildhafte Wendung וַיֵּצֵא לִבָּם
  choice: da verließ sie der Mut
  alternative: ihr Herz ging hinaus / ihr Herz versagte
  rationale: Die idiomatische Wiedergabe macht den Verlust von Mut und Fassung verständlich. Eine Fußnote bewahrt das ungewöhnliche hebräische Herzbild und damit die mögliche Bedeutungsweite.
- issue: Relationale Wendung אִישׁ אֶל אָחִיו
  choice: einer sagte zum anderen
  alternative: jeder Mann zu seinem Bruder
  rationale: Die Brüdergruppe ist im Kontext eindeutig männlich. Die natürliche distributive deutsche Form neutralisiert ihre Identität nicht; die Fußnote dokumentiert den wörtlichen Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher direkter Rede. Das zweimalige „Da“ beziehungsweise der Satzrhythmus bildet die rasche Abfolge von Entdeckung, Mutverlust und Zittern ab. Die Fußnotenmarker [a] und [b] stehen unmittelbar an den jeweils erläuterten Formulierungen.
