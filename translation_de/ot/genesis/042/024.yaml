  text: וַ/יִּסֹּ֥ב מֵֽ/עֲלֵי/הֶ֖ם וַ/יֵּ֑בְךְּ וַ/יָּ֤שָׁב אֲלֵ/הֶם֙ וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם וַ/יִּקַּ֤ח מֵֽ/אִתָּ/ם֙ אֶת שִׁמְע֔וֹן וַ/יֶּאֱסֹ֥ר אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: de
  text: Er wandte sich von ihnen ab und weinte. Dann kehrte er zu ihnen zurück und redete mit ihnen. Er nahm Simeon aus ihrer Mitte und fesselte ihn vor ihren Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Er wandte sich von ihnen ab
  rationale: סבב bezeichnet hier eine Wendung bzw. ein Sichabwenden; מֵעֲלֵיהֶם markiert die Entfernung aus ihrer unmittelbaren Gegenwart. Die Formulierung ist natürlich und lässt offen, wie weit Josef wegging.
- source_word: וַיֵּבְךְּ
  choice: und weinte
  rationale: בכה bezeichnet im Erzählzusammenhang eindeutig das Weinen; „weinte“ ist präzise und würdevoll.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: Dann kehrte er zu ihnen zurück
  rationale: שׁוב bedeutet zurückkehren; „dann“ gibt die erzählerische Abfolge der hebräischen Wayyiqtol-Formen natürlich wieder.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: und redete mit ihnen
  rationale: דבר im Piel bedeutet sprechen oder reden. Die Präposition אֶל kann als gerichtetes Reden verstanden werden; im Deutschen klingt „mit ihnen reden“ in dieser Szene natürlicher, ohne den Inhalt des Gesprächs festzulegen.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: Er nahm Simeon aus ihrer Mitte
  rationale: מֵאִתָּם kennzeichnet Simeon als denjenigen, der aus der Gruppe herausgenommen wird. „Aus ihrer Mitte“ bildet diese Auswahl anschaulich ab.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: und ließ ihn fesseln
  rationale: 'אסר bedeutet binden oder fesseln. Der deutsche Kausativ wahrt die mögliche administrative Rolle Josefs: Der hebräische Text schreibt ihm die Handlung zu, ohne zu verlangen, dass er sie eigenhändig ausführte.'
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die wörtlich-nahe deutsche Wendung bewahrt die Betonung, dass die Brüder die Fesselung mitansehen mussten.
