  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: de
  text: Da befahl Josef, ihre Behälter mit Getreide zu füllen, jedem sein Silber[a] in seinen Sack zurückzulegen und ihnen Wegzehrung mitzugeben. So tat man es für sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Silber“ kann hier auch „Geld“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und er tat es so für sie.“ Das Hebräische nennt den Handelnden nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: Das Verb צוה bezeichnet das Erteilen eines Befehls; die deutsche Konstruktion mit Infinitivgruppen gibt die indirekten Anweisungen natürlich wieder.
- source_word: כְּלֵיהֶם
  choice: ihre Behälter
  rationale: כְּלִי ist eine allgemeine Bezeichnung für ein Gefäß oder Behältnis. „Behälter“ wahrt den Unterschied zu שַׂק („Sack“) im selben Vers.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר bezeichnet hier das in Ägypten erworbene Getreide, ohne die Getreideart näher festzulegen.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם אִישׁ אֶל שַׂקּוֹ
  choice: jedem sein Silber in seinen Sack zurückzulegen
  rationale: כֶּסֶף bedeutet wörtlich „Silber“ und dient hier als Zahlungsmittel. אִישׁ wird distributiv mit „jedem“ wiedergegeben; שַׂק ist spezifisch ein Sack. „In“ entspricht im Deutschen dem Ziel der Handlung natürlicher als „zu“.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: ihnen Wegzehrung mitzugeben
  rationale: צֵדָה bezeichnet Reiseproviant. „Wegzehrung mitgeben“ ist knapp, idiomatisch und schließt לַדָּרֶךְ ein.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: So tat man es für sie
  rationale: Der hebräische Singular nennt das handelnde Subjekt nicht ausdrücklich. Das deutsche unpersönliche „man“ bewahrt diese Unbestimmtheit besser als eine Festlegung auf Josef.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortwahl unterscheidet bewusst den allgemeinen „Behälter“ vom später genannten „Sack“. Die abschließende unpersönliche Formulierung erhält die im Hebräischen offene Identität des Ausführenden.
