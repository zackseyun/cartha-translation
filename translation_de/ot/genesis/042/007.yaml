base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: de
  text: 'Als Josef seine Brüder sah, erkannte er sie. Aber er verhielt sich ihnen gegenüber wie ein Fremder[a] und redete hart mit ihnen. Er fragte sie: »Woher kommt ihr?« Sie antworteten: »Aus dem Land Kanaan, um Lebensmittel zu kaufen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er gab sich ihnen gegenüber als Fremder aus«; möglicherweise auch: »er machte sich ihnen unkenntlich«. Das Hebräische bezeichnet hier, dass Josef sich ihnen als fremd oder unbekannt präsentierte, ohne die Art und Weise eindeutig festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um Getreide zu kaufen«. In diesem Bericht über die Hungersnot bezieht sich das hebräische Verb häufig besonders auf den Kauf von Getreide; das hier verwendete Substantiv bedeutet allgemeiner »Nahrung« oder »Lebensmittel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Als Josef seine Brüder sah
  rationale: Die temporale Wiedergabe verbindet Josefs Sehen natürlich mit dem unmittelbar folgenden Erkennen und bildet den Erzählfortgang idiomatisch ab.
- source_word: וַיַּכִּרֵם
  choice: erkannte er sie
  rationale: Der Hifil von נכר bezeichnet hier das Wiedererkennen bzw. Identifizieren der Brüder.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: er stellte sich ihnen gegenüber fremd
  rationale: Die Form beschreibt, dass Josef sich ihnen als fremd beziehungsweise unbekannt präsentiert. Diese Wiedergabe lässt offen, auf welche Weise er sich unkenntlich machte, und legt keine körperliche Verkleidung fest.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: redete hart mit ihnen
  rationale: קָשׁוֹת bezeichnet hier die schroffe oder strenge Art seines Redens; die Präposition אִתָּם wird mit „mit ihnen“ wiedergegeben.
- source_word: מֵאַיִן בָּאתֶם
  choice: Woher kommt ihr?
  rationale: Natürliches modernes Deutsch für die Frage nach dem Herkunftsort; der vollendete Anreisevorgang ist im Kontext klar.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Aus dem Land Kanaan
  rationale: Bewahrt die ausdrückliche geografische Formulierung אֶרֶץ כְּנַעַן.
- source_word: לִשְׁבָּר אֹכֶל
  choice: um Lebensmittel zu kaufen
  rationale: שבר bedeutet in diesem Hungersnotkontext Vorräte, häufig Getreide, zu kaufen; אֹכֶל ist jedoch der allgemeinere Ausdruck für Nahrung. „Lebensmittel“ bewahrt diese Breite.
