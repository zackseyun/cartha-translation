base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: de
  text: Bringt euren jüngsten Bruder zu mir, damit sich eure Worte als wahr erweisen und ihr nicht sterbt.« Und sie taten es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: euren jüngsten Bruder
  rationale: הַקָּטֹן bezeichnet wörtlich den kleinen beziehungsweise jungen; im Zusammenhang der Geschwisterfolge ist »jüngsten Bruder« die natürliche deutsche Wiedergabe für Benjamin.
- source_word: תָּבִיאוּ אֵלַי
  choice: Bringt ... zu mir
  rationale: Der Hifil von בוא bedeutet »bringen«; אֵלַי wird unmittelbar mit »zu mir« wiedergegeben.
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: damit sich eure Worte als wahr erweisen
  rationale: Der Nifal von אמן kann hier ausdrücken, dass die Aussagen als wahr bestätigt beziehungsweise glaubwürdig werden. Die Formulierung wahrt den sachlichen Prüfungszusammenhang, ohne bloß subjektives Glauben zu unterstellen.
- source_word: וְלֹא תָמֻתוּ
  choice: und ihr nicht sterbt
  rationale: Die koordinierte Folge wird knapp bewahrt; im Deutschen fügt sie sich als zweites Ergebnis der mit »damit« eingeleiteten Konstruktion natürlich ein.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Und sie taten es
  rationale: Natürliche moderne Wiedergabe der hebräischen Erzählformel; »es« verweist auf die verlangte Handlung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt bestimmt und knapp; die lexikalische Spannweite von אמן wird im Haupttext mit »sich als wahr erweisen« kontextgerecht wiedergegeben, ohne eine unnötige Fußnote.
