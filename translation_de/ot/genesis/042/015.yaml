id: GEN.42.15
reference: Genesis 42:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: de
  text: 'Daran sollt ihr geprüft werden: So wahr der Pharao lebt: Ihr werdet diesen Ort nicht verlassen, es sei denn, euer jüngster Bruder kommt hierher.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ihr von hier fortgeht“. In dieser Schwurformel drückt „wenn“ eine nachdrückliche Verneinung aus: „Ihr werdet von hier nicht fortgehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Daran
  rationale: Das instrumentale ב mit dem Demonstrativ bezeichnet das Kriterium, an dem die Behauptung der Brüder geprüft wird. „Daran“ ist im Deutschen knapp und natürlich.
- source_word: תִּבָּחֵנוּ
  choice: sollt ihr geprüft werden
  rationale: Der Nifal von בחן bezeichnet ein Geprüft- oder Erprobtwerden. Die Formulierung gibt hier die angekündigte Prüfung angemessen wieder.
- source_word: חֵי פַרְעֹה
  choice: So wahr der Pharao lebt
  rationale: Die hebräische Schwurformel beruft sich wörtlich auf das Leben des Pharaos. Die gewählte deutsche Schwurformel bewahrt Sinn und Nachdruck.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: Ihr werdet diesen Ort nicht verlassen
  rationale: Nach einer Schwurformel hat אִם hier die Kraft einer nachdrücklichen Verneinung. „Diesen Ort“ gibt מִזֶּה idiomatisch wieder.
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Die Partikelverbindung führt die einzige Ausnahme von der vorausgehenden Verneinung ein.
- source_word: בְּבוֹא
  choice: kommt
  rationale: Der Infinitiv mit ב bezeichnet den Umstand beziehungsweise die Bedingung. Ein finites Verb ist nach „es sei denn“ natürliches Deutsch.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: euer jüngster Bruder
  rationale: הַקָּטֹן bedeutet im Geschwisterkontext den jüngsten Bruder und verweist auf Benjamin.
- source_word: הֵנָּה
  choice: hierher
  rationale: Das Adverb hat eine direktive Bedeutung und bezeichnet eine Bewegung zum Ort des Sprechers hin.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle deutsche Schwurformel „So wahr … lebt“ vermittelt die Funktion des hebräischen Ausdrucks ohne archaische Satzstellung; der Doppelpunkt erhält dessen feierlichen Nachdruck.
