base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: de
  text: 'Am dritten Tag sagte Josef zu ihnen: „Tut dies und bleibt am Leben,[a] denn ich fürchte Gott.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tut dies, damit ihr am Leben bleibt.“ Das Hebräische kann entweder eine direkte Aufforderung mit anschließender Folge oder ein beabsichtigtes Ergebnis ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: sagte Josef zu ihnen
  rationale: Die übliche deutsche Wiedergabe der Redeeinleitung mit indirektem Objekt ist natürlich und quellennah.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Entspricht der hebräischen Zeitangabe in idiomatischem Standarddeutsch.
- source_word: זֹאת עֲשׂוּ
  choice: Tut dies
  rationale: Bewahrt Demonstrativpronomen und Imperativ knapp und direkt.
- source_word: וִחְיוּ
  choice: und bleibt am Leben
  rationale: Gibt die koordinierte Imperativform wieder und macht im Deutschen den situationsbezogenen Sinn des Überlebens natürlich verständlich, ohne die mögliche Ergebnisnuance auszuschließen.
- source_word: אֶת הָאֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang bezeichnet der Ausdruck Gott; der bestimmte Artikel wird im Deutschen bei dieser Gottesbezeichnung nicht wiedergegeben.
- source_word: אֲנִי יָרֵא
  choice: denn ich fürchte
  rationale: Das partizipiale Prädikat mit ausdrücklichem Pronomen bezeichnet Josefs beständige Gottesfurcht; „denn“ verdeutlicht den begründenden Zusammenhang.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Namensform.
theological_decisions:
- issue: Bedeutung von אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Josef begründet sein Vorgehen mit seiner Ehrfurcht vor Gott.
  alternative: Josef könnte in der ägyptischen Gesprächssituation allgemein auf Gottes- oder Götterfurcht verweisen.
  rationale: Der Kontext der Genesis legt den Gott seiner Väter nahe. Die schlichte Wiedergabe „ich fürchte Gott“ bewahrt die theologische Aussage, ohne sie im Haupttext näher festzulegen oder auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bleibt am Leben“ ist in diesem Zusammenhang natürlicher als das wörtlichere „lebt“ und erhält zugleich die knappe imperativische Struktur.
