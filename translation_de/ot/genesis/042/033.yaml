source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: de
  text: 'Da sagte der Mann, der Herr des Landes, zu uns: »Daran werde ich erkennen, dass ihr ehrliche Leute seid: Lasst einen eurer Brüder bei mir, nehmt Getreide für den Hunger in euren Familien[a] mit und geht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Nehmt den Hunger eurer Häuser.« Gemeint ist, dass sie Getreide oder Vorräte gegen den Hunger ihrer Hausgemeinschaften mitnehmen sollen.'
    reason: Die hebräische Formulierung ist elliptisch; »Getreide« wird aufgrund des unmittelbaren Zusammenhangs ergänzt.
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: der Mann, der Herr des Landes
  rationale: הָאִישׁ bezeichnet schlicht den »Mann«; אֲדֹנֵי הָאָרֶץ folgt als Apposition und beschreibt seine hohe Amtsgewalt. Die Wiedergabe bewahrt beide Satzglieder.
- source_word: בְּזֹאת
  choice: Daran
  rationale: Die Präposition mit dem Demonstrativ bezeichnet das Kriterium, an dem der Sprecher ihre Ehrlichkeit erkennen will. »Daran« ist im Deutschen idiomatisch und präzise.
- source_word: אֵדַע
  choice: werde ich erkennen
  rationale: Das Yiqtol bezeichnet hier das künftige, von der Erfüllung der Forderung abhängige Erkennen.
- source_word: כֵנִים
  choice: ehrliche Leute
  rationale: Im Erzählzusammenhang steht כֵנִים für glaubwürdige, redliche Männer im Gegensatz zu Spionen. »Ehrliche Leute« klingt natürlich und gibt diesen sozialen und forensischen Sinn wieder.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: einen eurer Brüder
  rationale: Die hebräische Wendung hebt einen einzelnen Bruder aus der Gruppe heraus; diese Bedeutung wird im Deutschen idiomatisch mit »einen eurer Brüder« ausgedrückt.
- source_word: הַנִּיחוּ אִתִּי
  choice: Lasst ... bei mir
  rationale: Das Hifil von נוח bedeutet hier, jemanden zurückzulassen beziehungsweise bei jemandem bleiben zu lassen.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: Getreide für den Hunger in euren Familien
  rationale: Der hebräische Wortlaut nennt unmittelbar den »Hunger eurer Häuser« als Objekt von »nehmt«. Aus dem Zusammenhang ist das mitzunehmende Gut Getreide; »Familien« gibt die Hausgemeinschaften wieder. Die Ergänzung wird durch eine Fußnote offengelegt.
- source_word: קְחוּ וָלֵכוּ
  choice: nehmt ... mit und geht
  rationale: Die beiden Imperative werden in ihrer schlichten Abfolge bewahrt; das trennbare Verb »mitnehmen« macht den deutschen Satz natürlich.
theological_decisions: []
