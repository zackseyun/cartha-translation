base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: de
  text: Josef war der Herrscher über das Land; er war es, der dem ganzen Volk des Landes Getreide verkaufte. Josefs Brüder kamen und warfen sich vor ihm nieder[a], mit dem Gesicht zur Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verneigten sich tief vor ihm“. Das hebräische Verb kann eine tiefe Verbeugung oder eine vollständige Niederwerfung als Zeichen der Ehrerbietung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: der Machthaber
  rationale: Bezeichnet denjenigen, der Herrschaftsgewalt ausübt. „Machthaber“ gibt Josefs tatsächliche Autorität wieder, ohne ihm einen im Hebräischen nicht genannten Amtstitel wie „Statthalter“ zuzuschreiben.
- source_word: עַל הָאָרֶץ
  choice: über das Land
  rationale: אֶרֶץ bezeichnet hier das betreffende Land, nämlich Ägypten, nicht die ganze Erde.
- source_word: הַמַּשְׁבִּיר
  choice: der … Getreide verkaufte
  rationale: Das Hifil-Partizip von שׁבר bezeichnet in diesem Zusammenhang den Verkauf von Getreide während der Hungersnot. Das im Hebräischen vorausgesetzte Objekt wird im Deutschen aus Gründen der Klarheit genannt.
- source_word: לְכָל עַם הָאָרֶץ
  choice: dem ganzen Volk des Landes
  rationale: עַם ist ein kollektiver Singular. „Dem ganzen Volk“ bewahrt diese Form und gibt den umfassenden Sinn von כָּל natürlich wieder.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: warfen sich vor ihm nieder
  rationale: Das Verb bezeichnet hier eine tiefe Verbeugung beziehungsweise Niederwerfung als Zeichen der Unterordnung. Die Wiedergabe vermeidet die kultisch verengende Übersetzung „beteten ihn an“.
- source_word: אַפַּיִם אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die Wendung beschreibt die Körperhaltung bei vollständiger Niederwerfung. Die deutsche Formulierung ist anschaulich und bleibt dem hebräischen Bild nahe.
theological_decisions:
- issue: Die Handlung der Brüder gegenüber Josef
  choice: warfen sich vor ihm nieder
  alternative: verneigten sich vor ihm; beteten ihn an
  rationale: Die Szene schildert soziale Huldigung und Unterordnung und nimmt Josefs frühere Träume auf. „Niederwerfen“ bewahrt die körperliche und ehrerbietige Bedeutung, ohne dem Vorgang ausdrücklich kultische Anbetung zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Abfolge, ohne hölzern zu wirken. Ein zusätzliches einleitendes „Nun“ wurde vermieden, da im Ausgangstext kein ausdrückliches Zeitadverb steht.
