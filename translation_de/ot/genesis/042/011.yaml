id: GEN.42.11
reference: Genesis 42:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: de
  text: Wir alle sind Söhne ein und desselben Mannes. Wir sind ehrlich[a]; deine Diener sind keine Spione gewesen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufrichtig«, »redlich« oder »wahrhaftig«. Das hebräische Wort stellt sie als zuverlässig und aufrichtig dar – im Gegensatz zu dem Vorwurf, sie seien Spione.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »deine Diener sind keine Spione« oder »deine Diener waren keine Spione«. Die hebräische Konstruktion lässt sich im Deutschen je nach zeitlicher Akzentsetzung unterschiedlich wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: wir alle
  rationale: Gibt die Gesamtheit der Sprechergruppe wieder und bewahrt die natürliche deutsche Wortstellung.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: Söhne ein und desselben Mannes
  rationale: Das Hebräische bezeichnet ausdrücklich männliche Nachkommen. „Ein und desselben Mannes“ verdeutlicht idiomatisch, dass sie einen gemeinsamen Vater beanspruchen.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: wir sind
  rationale: Die selbstständigen Pronomen tragen Nachdruck. Ihre Wiederholung wird in den beiden Aussagen bewahrt; im Deutschen ist dazu die Kopula nötig.
- source_word: כֵּנִים
  choice: ehrlich
  rationale: Bezeichnet die Sprecher im Gegensatz zum Spionagevorwurf als zuverlässig, aufrichtig oder wahrhaftig. „Ehrlich“ ist im heutigen Deutsch klar und natürlich.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Hier handelt es sich um eine ehrerbietige Selbstbezeichnung gegenüber einem Machthaber, nicht vorrangig um eine Aussage über den rechtlichen Sklavenstatus.
- source_word: מְרַגְּלִים
  choice: Spione
  rationale: Im Kontext bezeichnet das Partizip Personen, die heimlich ein Land auskundschaften; „Spione“ ist die klare, idiomatische Wiedergabe.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: sind keine Spione gewesen
  rationale: 'Bewahrt die Konstruktion mit היה und Partizip sowie die zeitliche Offenheit der Zurückweisung: Sie bestreiten, als Spione tätig gewesen zu sein.'
theological_decisions: []
