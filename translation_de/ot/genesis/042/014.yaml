  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵ/כֶ֛ם לֵ/אמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: de
  text: 'Josef sagte zu ihnen: »Das ist es, was ich euch gesagt habe: Ihr seid Spione.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das wayyiqtol von אמר wird im fortlaufenden deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben; das einleitende ו wird nicht eigens als »und« ausgedrückt.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Direkte Wiedergabe der Präposition mit dem maskulinen Pluralsuffix.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Übliche deutsche Namensform.
- source_word: הוּא אֲשֶׁר
  choice: Es ist, wie
  rationale: Die betonte rückbezügliche Wendung bekräftigt Josefs frühere Aussage. »Es ist, wie« bewahrt diesen Nachdruck in natürlichem Deutsch, ohne die hebräische Konstruktion unnötig zu glätten.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: ich zu euch gesagt habe
  rationale: דבר bedeutet grundsätzlich »reden/sprechen«; mit Adressaten und anschließendem Zitat ist »zu euch gesagt habe« im Deutschen idiomatisch und inhaltlich genau.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv von אמר führt den Inhalt der Rede ein. Im natürlichen Deutschen erfüllt der Doppelpunkt dieselbe Funktion besser als das redundante »indem ich sagte«.
- source_word: מְרַגְּלִים אַתֶּם
  choice: Ihr seid Spione
  rationale: Das Partizip von רגל bezeichnet hier Menschen, die ein Land auskundschaften. Der selbstständige Pluralpronominalausdruck wird im Deutschen mit Kopula wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Wiederaufnahme von Josefs früherer Beschuldigung bleibt nachdrücklich; die hebräische Redeeinleitungsformel wird durch einen Doppelpunkt idiomatisch wiedergegeben.
