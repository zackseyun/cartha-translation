  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: de
  text: Sie wussten aber nicht, dass Josef zuhörte[a], denn der Dolmetscher war zwischen ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dass Josef hörte«; im Zusammenhang schließt dies ein, dass er verstand, was sie sagten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Sie aber
  rationale: Die Verbindung aus Konjunktion und Pronomen setzt einen erzählerischen Kontrast zum Vorhergehenden; die deutsche Nachstellung von »aber« klingt natürlich und bewahrt das ausdrückliche Subjekt.
- source_word: לֹא יָדְעוּ
  choice: wussten nicht
  rationale: Die Qatal-Form von ידע bezeichnet hier fehlendes Wissen; »wussten nicht« ist unmittelbar und idiomatisch.
- source_word: כִּי
  choice: dass
  rationale: Das erste כִּי leitet den Inhalt dessen ein, was die Brüder nicht wussten.
- source_word: שֹׁמֵעַ
  choice: sie verstand
  rationale: שׁמע bedeutet zunächst »hören« oder »zuhören«, kann aber auch das sprachliche Verstehen bezeichnen. Da ein Dolmetscher eingesetzt wurde, ist hier gemeint, dass Josef ihre Sprache verstand. Das ergänzte »sie« macht den Bezug im Deutschen natürlich deutlich.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: כִּי
  choice: denn
  rationale: Das zweite כִּי nennt den Grund dafür, dass die Brüder Josefs Sprachkenntnis nicht erkannten; »denn« gibt diese Begründung flüssig wieder.
- source_word: הַמֵּלִיץ
  choice: der Dolmetscher
  rationale: מֵלִיץ bezeichnet hier den sprachlichen Vermittler zwischen Josef und seinen Brüdern; »Dolmetscher« ist im Deutschen präziser als »Übersetzer« für mündliche Rede.
- source_word: בֵּינֹתָם
  choice: vermittelte zwischen ihnen
  rationale: Die Wendung bezeichnet nicht nur eine räumliche Position, sondern im Kontext die vermittelnde Funktion des Dolmetschers. Das Verb macht diesen Sinn im heutigen Deutsch klar.
