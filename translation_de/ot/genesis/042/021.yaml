base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: de
  text: 'Da sagten sie zueinander: „Wir haben uns wirklich an unserem Bruder schuldig gemacht. Denn wir sahen seine Seelennot[a], als er uns anflehte, aber wir hörten nicht auf ihn. Darum ist nun diese Not[b] über uns gekommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Not seiner Seele“; gemeint ist seine tiefe persönliche Qual.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht für Josefs damalige „Not“ und die jetzige „Not“ der Brüder dasselbe Wort. So wird ihre gegenwärtige Bedrängnis sprachlich mit ihrer früheren Hartherzigkeit verknüpft.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Da sagten sie zueinander
  rationale: Die Wendung ist wechselseitig gemeint; „zueinander“ gibt sie im Deutschen natürlich wieder. „Da“ führt die Handlung im Erzählfluss fort.
- source_word: אֲבָל אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: Wir sind wirklich schuldig geworden an unserem Bruder
  rationale: אֲבָל bekräftigt hier das Eingeständnis. „Schuldig geworden an“ bezeichnet verständlich sowohl ihre Schuld als auch deren Bezug auf den Bruder.
- source_word: צָרַת נַפְשׁוֹ
  choice: seine Seelennot
  rationale: Die kompakte deutsche Wendung bewahrt sowohl נֶפֶשׁ als auch die tiefe persönliche Bedrängnis des hebräischen Ausdrucks.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: als er uns um Erbarmen anflehte
  rationale: Das Hitpael von חנן bezeichnet ein inständiges Flehen um Gunst oder Erbarmen; die deutsche Formulierung macht den im Verb enthaltenen Sinn natürlich verständlich.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: aber wir hörten nicht auf ihn
  rationale: שׁמע meint hier nicht bloß akustisches Hören, sondern das Beachten und Befolgen einer Bitte.
- source_word: עַל־כֵּן בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: Darum ist nun diese Not über uns gekommen
  rationale: „Darum“ gibt die Folgerung wieder. „Not“ nimmt צָרָה erneut auf und bewahrt so die Verbindung zwischen Josefs damaliger und der gegenwärtigen Not der Brüder.
theological_decisions:
- issue: Deutung der gegenwärtigen Not als Folge ihrer Schuld
  choice: Die kausale Selbstaussage der Brüder wird unmittelbar wiedergegeben
  alternative: Die Not ausdrücklich als göttliche Vergeltung bezeichnen
  rationale: Der Vers stellt aus Sicht der Brüder einen Zusammenhang her, nennt Gott als Handelnden jedoch nicht ausdrücklich. Die Übersetzung ergänzt diese Deutung daher nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seelennot“ bewahrt das hebräische Bild, während Satzbau und Redeform für heutige Leser unmittelbar verständlich bleiben.
