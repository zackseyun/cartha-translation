  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: de
  text: Josef erkannte seine Brüder[a], aber sie erkannten ihn nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht in beiden Satzteilen dasselbe Verb: „Josef erkannte seine Brüder, aber sie erkannten ihn nicht.“'
