lexical_decisions:
- source_word: וַיַּכֵּר
  choice: erkannte
  rationale: Der Hifil von נכר bedeutet hier, eine bereits bekannte Person wiederzuerkennen. „Erkannte“ ist im Deutschen natürlich und bewahrt den Gegensatz zum Nichterkennen der Brüder.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֶת־אֶחָיו
  choice: seine Brüder
  rationale: Der maskuline Plural von אָח mit Suffix bezeichnet in diesem Zusammenhang Josefs männliche Geschwister.
- source_word: וְהֵם
  choice: aber sie
  rationale: Das ו verbindet die Sätze hier mit einem deutlichen Gegensatz; „aber“ gibt diesen adversativen Sinn idiomatisch wieder.
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Verneinung wird in der deutschen Satzstellung natürlich mit „nicht“ wiedergegeben.
- source_word: הִכִּרֻהוּ
  choice: erkannten ihn
  rationale: Dies ist dasselbe Verb נכר wie im ersten Satzteil. Die Wiederholung von „erkannten“ bewahrt den erzählerischen Kontrast und die Ironie des hebräischen Textes.
