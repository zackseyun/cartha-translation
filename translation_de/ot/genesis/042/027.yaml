  source_fidelity: 'Der Entwurf gibt die hebräischen Satzglieder und den Erzählverlauf zuverlässig wieder: Einer der Brüder öffnet am Übernachtungsort seinen Sack, um dem Esel Futter zu geben, entdeckt sein Silber und stellt überrascht fest, dass es sich an der Öffnung seines Beutels befindet. Die Unterscheidung zwischen שַׂק („Sack“) und אַמְתַּחַת („Beutel“) bleibt erhalten. „Am Nachtlager“ gibt בַּמָּלוֹן angemessen wieder, ohne ein kommerzielles Gasthaus vorauszusetzen.'
