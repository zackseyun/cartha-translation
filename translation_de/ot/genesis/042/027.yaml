id: GEN.42.27
reference: Genesis 42:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: de
  text: Da öffnete einer von ihnen am Nachtlager seinen Sack, um seinem Esel Futter zu geben. Da sah er sein Silber[a] – und siehe, es lag an der Öffnung seines Beutels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Silber« ist hier das Geld gemeint, mit dem er bezahlt hatte.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »im Mund seines Beutels«. Gemeint ist dessen Öffnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: öffnete
  rationale: Die Grundbedeutung von פתח passt im Erzählzusammenhang unmittelbar und natürlich.
- source_word: הָאֶחָד
  choice: einer von ihnen
  rationale: Wörtlich steht »der eine«; der Kontext zeigt, dass einer der Brüder gemeint ist.
- source_word: שַׂקּוֹ
  choice: seinen Sack
  rationale: שַׂק bezeichnet hier den für den Transport verwendeten Sack und bleibt so vom späteren אַמְתַּחַת unterschieden.
- source_word: לָתֵת מִסְפּוֹא
  choice: um … Futter zu geben
  rationale: מִסְפּוֹא bezeichnet Tierfutter; die deutsche Zweckkonstruktion gibt den Infinitiv natürlich wieder.
- source_word: לַחֲמֹרוֹ
  choice: seinem Esel
  rationale: Der Lamed-Ausdruck bezeichnet den Empfänger des Futters.
- source_word: בַּמָּלוֹן
  choice: am Nachtlager
  rationale: מָלוֹן meint einen Ort zum Übernachten oder eine nächtliche Rast; »Nachtlager« vermeidet die unbelegte Vorstellung eines kommerziellen Gasthauses.
- source_word: וַיַּרְא אֶת כַּסְפּוֹ
  choice: Da sah er sein Silber
  rationale: כֶּסֶף bedeutet wörtlich »Silber« und bezeichnet hier das als Zahlungsmittel verwendete Silber.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Wendung bewahrt das Überraschungsmoment und den hervorgehobenen erzählerischen Hinweis des hebräischen הִנֵּה.
- source_word: בְּפִי
  choice: an der Öffnung
  rationale: פֶּה bedeutet wörtlich »Mund«, wird bei einem Behälter aber idiomatisch für dessen Öffnung gebraucht.
- source_word: אַמְתַּחְתּוֹ
  choice: seines Beutels
  rationale: »Beutel« gibt den zweiten Behälterbegriff wieder und wahrt die sprachliche Unterscheidung vom zuvor genannten Sack.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Und siehe« bewahrt bewusst die markierte Überraschung des hebräischen Textes; »Nachtlager« vermeidet eine zu konkrete Vorstellung von einem Gasthaus.
