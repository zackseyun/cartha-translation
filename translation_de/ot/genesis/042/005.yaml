  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Söhne Israels“ wahrt den konkreten Familienbezug; „mit den anderen Ankommenden“ vermeidet eine im Deutschen schwerfällige Wiederholung.
