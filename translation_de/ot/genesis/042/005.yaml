source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: de
  text: So kamen die Söhne Israels mit den anderen Ankommenden, um Getreide zu kaufen, denn im Land Kanaan herrschte eine Hungersnot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „denn die Hungersnot war im Land Kanaan“.'
    reason: translation_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: So kamen
  rationale: Das Wayyiqtol führt die Erzählung fort; „kamen“ gibt hier die Perspektive ihrer Ankunft wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Im unmittelbaren Zusammenhang sind konkret Jakobs Söhne gemeint, nicht allgemein das Volk Israel.
- source_word: לִשְׁבֹּר
  choice: um Getreide zu kaufen
  rationale: Das Verb bedeutet grundsätzlich „kaufen“, bezeichnet im Kontext der Hungersnot und der Josefserzählung jedoch den Kauf von Getreide beziehungsweise Nahrung.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: mit den anderen Ankommenden
  rationale: Die Formulierung vermittelt natürlich, dass die Söhne Israels sich unter der größeren Gruppe der Menschen befanden, die ebenfalls ankamen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für ihr Kommen ein und passt hier zu einem würdevollen deutschen Erzählstil.
- source_word: הָיָה הָרָעָב
  choice: herrschte eine Hungersnot
  rationale: Diese idiomatische deutsche Wendung gibt den bestehenden Zustand klar wieder; die Bestimmtheit ergibt sich aus dem Erzählkontext.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Bewahrt die konkrete und erzählerisch bedeutsame hebräische Ortsbezeichnung.
theological_decisions: []
