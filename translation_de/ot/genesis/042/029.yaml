  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: de
  text: 'Dann kamen sie zu ihrem Vater Jakob ins Land Kanaan und berichteten ihm alles, was ihnen widerfahren war. Sie sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Das Wayyiqtol von בוא führt die Erzählung zeitlich weiter; „Dann kamen sie“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: zu ihrem Vater Jakob
  rationale: Die Richtungspräposition אֶל bezeichnet das Ziel; die deutsche Wortstellung „zu ihrem Vater Jakob“ klingt natürlicher als eine formnahe Nachbildung.
- source_word: אַרְצָה כְּנָעַן
  choice: ins Land Kanaan
  rationale: Die Richtungsendung an אֶרֶץ bezeichnet eine Bewegung zum beziehungsweise in das Land Kanaan. Anders als die englische Beratungsschicht kann Deutsch beide Zielangaben natürlich verbinden.
- source_word: וַיַּגִּידוּ לוֹ
  choice: und berichteten ihm
  rationale: נגד im Hifil bedeutet hier „mitteilen, berichten“. „Berichteten“ passt zum ausführlichen Wiedergeben der Erlebnisse.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: alles, was ihnen widerfahren war
  rationale: Die Form von קרה bezeichnet das, was ihnen begegnet beziehungsweise zugestoßen war. „Widerfahren“ ist präzise, verständlich und dem würdevollen Erzählregister angemessen.
- source_word: לֵאמֹר
  choice: 'Sie sagten:'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Ein eigenständiger deutscher Satz mit Doppelpunkt ist natürlicher als das partizipiale „sagend“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Zielangabe des Hebräischen wird ohne Fußnote natürlich als „zu ihrem Vater Jakob ins Land Kanaan“ wiedergegeben; dadurch bleiben sowohl die Person als auch das geografische Ziel ausdrücklich erhalten.
