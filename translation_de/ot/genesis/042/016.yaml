source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: de
  text: Schickt einen von euch los, damit er euren Bruder holt[a]; ihr anderen aber bleibt in Haft[b]. So sollen eure Aussagen geprüft werden, ob die Wahrheit bei euch ist[c]. Wenn nicht – so wahr der Pharao lebt[d] –, dann seid ihr Spione!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit er euren Bruder nimmt“. Das hebräische Verb bedeutet gewöhnlich „nehmen“, meint hier jedoch, dass der Bruder geholt und hergebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „lasst euch fesseln“ oder „bleibt unter Bewachung“. Das hebräische Verb kann sowohl das Gebundensein als auch den Gewahrsam bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ob die Wahrheit bei euch ist“, das heißt, ob ihr die Wahrheit sagt.'
    reason: lexical_alternative
  - marker: d
    text: „So wahr der Pharao lebt“ ist eine Schwurformel, die sich auf das Leben des Pharaos beruft.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Schickt einen von euch los
  rationale: Der Qal-Imperativ bezeichnet einen direkten Auftrag; מִכֶּם אֶחָד wählt einen Mann aus der Gruppe aus. „losschicken“ ist im Deutschen idiomatisch und gibt die Entsendung deutlich wieder.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: damit er euren Bruder holt
  rationale: לקח bedeutet gewöhnlich „nehmen“, bezeichnet hier aber im Zusammenhang das Holen des Bruders und seine Rückkehr zu Josef. „holt“ gibt die beabsichtigte Bewegung im Deutschen natürlich wieder.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: ihr anderen aber bleibt in Haft
  rationale: Der passive Imperativ von אסר kann Fesselung oder Gewahrsam bezeichnen. „bleibt in Haft“ trifft den situativen Sinn; „ihr anderen“ macht den Gegensatz zu dem einen Entsandten deutlich, ohne den Bezug zu verändern.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: So sollen eure Aussagen geprüft werden
  rationale: בחן im Niphal bezeichnet Prüfen oder Erproben. „Aussagen“ ist in diesem Verhörkontext natürlich und entspricht dem Sinn von דְּבָרִים, ohne es auf eine bloße „Geschichte“ zu verengen.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: ob die Wahrheit bei euch ist
  rationale: Die Wiedergabe bewahrt bewusst das hebräische Bild „die Wahrheit ist bei euch“, obwohl idiomatisches Deutsch auch „ob ihr die Wahrheit sagt“ erlauben würde.
- source_word: וְאִם לֹא
  choice: Wenn nicht
  rationale: Die Wendung führt die gegenteilige Folgerung für den Fall ein, dass sich ihre Aussagen nicht bestätigen.
- source_word: חֵי פַרְעֹה
  choice: so wahr der Pharao lebt
  rationale: Dies ist eine Schwurformel beim Leben des Pharaos. Die gewählte Form ist die natürliche, würdige deutsche Entsprechung.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: dann seid ihr Spione
  rationale: כִּי leitet hier nach dem negativen Bedingungssatz die bekräftigte Folgerung ein. „dann“ bildet diesen Zusammenhang im Deutschen klar ab; „Spione“ entspricht מְרַגְּלִים.
