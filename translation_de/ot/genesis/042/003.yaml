  text: וַ/יֵּרְד֥וּ אֲחֵֽי יוֹסֵ֖ף עֲשָׂרָ֑ה לִ/שְׁבֹּ֥ר בָּ֖ר מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: de
  text: Da zogen die zehn Brüder Josefs hinab, um Getreide aus Ägypten zu kaufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um in Ägypten Getreide zu kaufen“. Wörtlicher heißt es im Hebräischen „Getreide aus Ägypten kaufen“; damit wird die Herkunft des Getreides ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Da zogen … hinab
  rationale: Das Verb ירד bedeutet wörtlich „hinabgehen“ und bewahrt hier die geläufige geografische Perspektive auf die Reise nach Ägypten; „zogen hinab“ klingt im Deutschen natürlich und würdevoll.
- source_word: אֲחֵי יוֹסֵף
  choice: die … Brüder Josefs
  rationale: Die hebräische Status-constructus-Verbindung bedeutet unmittelbar „die Brüder Josefs“; der vorangestellte Artikel bezieht sich auf die ganze bestimmte Wortgruppe.
- source_word: עֲשָׂרָה
  choice: zehn
  rationale: Die Kardinalzahl gibt an, wie viele Brüder die Reise antraten, und steht im natürlichen Deutschen attributiv vor „Brüder“.
- source_word: לִשְׁבֹּר
  choice: um … zu kaufen
  rationale: שׁבר bezeichnet in diesem Hungersnotkontext das Kaufen beziehungsweise Beschaffen von Getreide. Die finale Infinitivkonstruktion wird idiomatisch mit „um … zu“ wiedergegeben.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר bezeichnet hier Getreide als Nahrungs- und Handelsgut; „Getreide“ ist die klare moderne deutsche Entsprechung.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Die Präposition מן bezeichnet grundsätzlich Herkunft oder Quelle. „Aus Ägypten“ erhält diesen Sinn, auch wenn im Deutschen kontextbedingt „in Ägypten“ möglich wäre.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit leicht erzählerisch-würdigem Ton. „Zogen … hinab“ bewahrt das hebräische Bewegungsverb, ohne unnatürlich wörtlich zu wirken.
