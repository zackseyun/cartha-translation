source:
  edition: WLC
  text: דִּ֠בֶּר הָ/אִ֨ישׁ אֲדֹנֵ֥י הָ/אָ֛רֶץ אִתָּ֖/נוּ קָשׁ֑וֹת וַ/יִּתֵּ֣ן אֹתָ֔/נוּ כִּֽ/מְרַגְּלִ֖ים אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: de
  text: Der Mann, der Herr des Landes, redete hart mit uns und behandelte uns wie Kundschafter, die das Land auskundschaften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: redete hart mit uns
  rationale: Gibt die hebräische Konstruktion mit אִתָּנוּ („mit uns“) und dem adverbial gebrauchten קָשׁוֹת natürlich und quellennah wieder.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: der Herr des Landes
  rationale: Bewahrt Titel und Genitivbeziehung; „Herr“ bezeichnet hier den Machthaber über das Land, nicht den Gottesnamen.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: behandelte uns wie Leute, die ... ausspionieren
  rationale: Das idiomatische נתן ... כ־ bedeutet hier, jemanden für etwas zu halten beziehungsweise entsprechend zu behandeln. Die Umschreibung vermeidet das im heutigen Deutsch missverständliche „Spione des Landes“.
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: Leute, die das Land ausspionieren
  rationale: Das Akkusativzeichen zeigt, dass „das Land“ das Objekt des Ausspionierens ist.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. „Der Herr des Landes“ bleibt als Amts- und Herrschaftsbezeichnung erhalten; der zweite Satzteil wird zur Vermeidung einer unnatürlichen oder missverständlichen Genitivfügung idiomatisch entfaltet.
