  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: de
  text: 'Da sagte ihr Vater Jakob zu ihnen: »Ihr macht mich kinderlos! Josef ist nicht mehr da, Simeon ist nicht mehr da, und nun wollt ihr auch Benjamin mitnehmen. Das alles trifft mich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: Ihr macht mich kinderlos
  rationale: Das Piel von שׁכל bezeichnet das Verursachen von Kinderlosigkeit beziehungsweise den Verlust von Kindern. Die deutsche Wendung ist natürlich, bewahrt den direkten Vorwurf und passt dazu, dass Jakob auch die drohende Wegnahme Benjamins einbezieht.
- source_word: אֵינֶנּוּ
  choice: ist nicht mehr da
  rationale: Die Wendung bezeichnet hier schmerzlich empfundene Abwesenheit, ohne ausdrücklich den Tod festzustellen; das gilt besonders für Simeon. »Nicht mehr da« bewahrt diese Offenheit.
- source_word: תִּקָּחוּ
  choice: nun wollt ihr auch … mitnehmen
  rationale: Das Imperfekt bezeichnet im Zusammenhang die beabsichtigte Wegnahme Benjamins. »Wollt … mitnehmen« gibt Jakobs empörten Blick auf den Vorschlag idiomatisch wieder; »nun« und »auch« verdeutlichen die im Hebräischen durch die Reihung erkennbare Steigerung.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Das alles trifft mich
  rationale: 'Die knappe Formulierung bewahrt den zusammenfassenden und belastenden Sinn von עָלַי: Alle genannten Vorgänge kommen über Jakob beziehungsweise richten sich nach seinem Empfinden gegen ihn.'
- source_word: אֹתִי
  choice: mich
  rationale: Das vorangestellte Objekt wird ausdrücklich wiedergegeben und trägt Jakobs Betonung seines eigenen Verlustes.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: ihr Vater Jakob
  rationale: Diese Wortstellung ist im modernen Deutschen natürlicher als »Jakob, ihr Vater« und gibt beide Angaben vollständig wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle und emotional unmittelbare Standardsprache. Die Wiederholung »ist nicht mehr da« spiegelt Jakobs klagende Reihung; die Ausrufezeichen geben den erregten Ton wieder, ohne zusätzliche Deutung einzuführen.
