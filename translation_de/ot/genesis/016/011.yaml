  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen genau wieder: die Sprecherbezeichnung, die Anrede an Hagar, den Aufmerksamkeitsruf, Schwangerschaft und künftige Geburt eines Sohnes, den Namensauftrag, Ismael sowie die Begründung durch Jahwes bereits erfolgtes Hören ihres Elends. Das Perfekt שָׁמַע ist mit „hat … gehört“ angemessen wiedergegeben. „Elend“ deckt עָנְיֵךְ im Kontext hinreichend breit ab.'
