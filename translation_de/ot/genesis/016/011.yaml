  terminology: „Der Engel Jahwes“ entspricht der etablierten deutschen biblischen Terminologie und legt keine weitergehende Identifikation fest. Die Fußnote bietet zutreffend „der Bote Jahwes“ als lexikalische Alternative. „Jahwe“ und „Ismael“ sind konsistent und im Deutschen geläufig.
