id: GEN.16.11
reference: Genesis 16:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: de
  text: 'Da sagte der Engel Jahwes zu ihr[a]: »Sieh, du bist schwanger und wirst einen Sohn gebären. Du sollst ihm den Namen Ismael geben, denn Jahwe hat dein Elend gehört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder im Kontext eines himmlischen Gesandten »Engel« bedeuten. Die geläufige Wendung »Engel Jahwes« ist hier natürlich und lässt die genaue Identität der Gestalt offen.
- source_word: הִנָּךְ הָרָה
  choice: Sieh, du bist schwanger
  rationale: הִנֵּה lenkt feierlich die Aufmerksamkeit auf die folgende Ankündigung; »Sieh« ist im heutigen Deutsch verständlicher als »Siehe«. הָרָה bezeichnet klar die Schwangerschaft.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: und wirst einen Sohn gebären
  rationale: Die Form kündigt die bevorstehende Geburt an. »Gebären« ist präzise, würdig und nah am Hebräischen.
- source_word: וְקָרָאת שְׁמוֹ
  choice: Du sollst ihm den Namen … geben
  rationale: Die deutsche Namensformel gibt den verpflichtenden Charakter der Ankündigung natürlich wieder, ohne die Bedeutung zu verändern.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform; die folgende Begründung lässt das Wortspiel mit שׁמע erkennen.
- source_word: כִּי שָׁמַע יְהוָה
  choice: denn Jahwe hat … gehört
  rationale: כִּי begründet die Namensgebung. Das Perfekt »hat gehört« stellt die bereits erfolgte göttliche Wahrnehmung mit gegenwärtiger Bedeutung heraus.
- source_word: עָנְיֵךְ
  choice: dein Elend
  rationale: עֳנִי umfasst Bedrängnis, Not und leidvolle Erniedrigung. »Elend« ist im Deutschen breit genug und passt idiomatisch zu »gehört«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: »Jahwe« gibt das Tetragramm als persönlichen Gottesnamen wieder; »der HERR« wäre eine traditionelle Ersetzung durch einen Titel.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Übersetzung bezeichnet einen göttlichen Gesandten, ohne ihn darüber hinaus etwa ausdrücklich mit Jahwe selbst oder mit Christus gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« bewahrt den Aufmerksamkeitsruf, ohne das altertümlichere »Siehe« zu verwenden. Die direkte Rede ist klar gegliedert; die traditionelle deutsche Namensform »Ismael« bleibt erhalten.
