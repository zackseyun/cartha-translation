  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung. „Sklavin“ bewahrt die für den Fortgang der Erzählung bedeutsame soziale Unfreiheit; die Fußnote nennt geläufige traditionelle Alternativen.
