  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: de
  text: Sarai, Abrams Frau, hatte ihm keine Kinder geboren, und sie hatte eine ägyptische Sklavin[a] namens Hagar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Magd“ oder „Dienerin“. Das hebräische Wort bezeichnet eine weibliche Sklavin beziehungsweise Hausdienerin in unfreier Stellung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Sarai
  rationale: Der Satz eröffnet einen neuen Erzählabschnitt. Das hebräische וְ markiert hier den Anschluss; im natürlichen Deutschen muss es nicht eigens mit „und“ wiedergegeben werden. Der Personenname bleibt transliteriert.
- source_word: אֵשֶׁת אַבְרָם
  choice: Abrams Frau
  rationale: Die hebräische Genitivverbindung wird durch die natürliche deutsche Possessivkonstruktion wiedergegeben und bezeichnet Sarais Eheverhältnis ausdrücklich.
- source_word: לֹא יָלְדָה לוֹ
  choice: hatte ihm keine Kinder geboren
  rationale: Das Verb bezeichnet hier das Gebären von Nachkommen; „Kinder“ wird im Deutschen als vom Kontext gefordertes Objekt ergänzt. Das Plusquamperfekt gibt die Hintergrundinformation des Erzählbeginns angemessen wieder.
- source_word: וְלָהּ
  choice: Sie hatte aber
  rationale: Die hebräische Besitzkonstruktion, wörtlich „ihr war“, wird idiomatisch als „sie hatte“ wiedergegeben. „aber“ macht den im Zusammenhang wahrnehmbaren Kontrast zwischen Kinderlosigkeit und dem Vorhandensein der Sklavin deutlich, ohne eine zusätzliche Sachinformation einzuführen.
- source_word: שִׁפְחָה
  choice: Sklavin
  rationale: שִׁפְחָה bezeichnet eine weibliche Person in unfreier, untergeordneter Haushaltsstellung. „Sklavin“ wahrt diesen rechtlich-sozialen Status klarer als das abschwächende „Dienerin“.
- source_word: מִצְרִית
  choice: ägyptische
  rationale: Das Herkunftsadjektiv bestimmt die Sklavin und wird im Deutschen attributiv wiedergegeben.
- source_word: וּשְׁמָהּ הָגָר
  choice: namens Hagar
  rationale: Die ausdrückliche Namensangabe wird knapp und natürlich wiedergegeben; „Hagar“ bleibt als Personenname transliteriert.
