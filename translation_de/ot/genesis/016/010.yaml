id: GEN.16.10
reference: Genesis 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: de
  text: 'Da sagte der Engel Jahwes[a] zu ihr: »Ich werde deine Nachkommen überaus zahlreich machen, sodass man sie wegen ihrer Menge nicht zählen kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexikalische Alternative zu מַלְאַךְ
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit Narrativform führt die Handlung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann „Bote“ oder „Engel“ bedeuten. In dieser wiederkehrenden Genesis-Formel ist „Engel Jahwes“ die geläufige und kontextuell passende Wiedergabe; die lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: הַרְבָּה אַרְבֶּה
  choice: überaus zahlreich machen
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt hier das Ausmaß der Vermehrung. Die Formulierung gibt diese Steigerung idiomatisch wieder, ohne sie zu einer bloßen Gewissheitsbekräftigung umzudeuten.
- source_word: זַרְעֵךְ
  choice: deine Nachkommen
  rationale: זֶרַע ist hier kollektiv gebraucht. „Nachkommen“ ist im Deutschen natürlich, verständlich und bewahrt den Bezug auf die gesamte Nachkommenschaft.
- source_word: וְלֹא יִסָּפֵר
  choice: sodass man sie … nicht zählen kann
  rationale: Der Nifal von ספר bezeichnet das Gezähltwerden; die unpersönliche deutsche Formulierung bringt die Unzählbarkeit idiomatisch zum Ausdruck. „Sodass“ verdeutlicht die im Zusammenhang erkennbare Folge.
- source_word: מֵרֹב
  choice: wegen ihrer Menge
  rationale: 'מִן mit רֹב bezeichnet hier den Grund: Die Nachkommen können aufgrund ihrer großen Zahl nicht gezählt werden.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung und Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: „Engel“ entspricht der etablierten Bezeichnung dieser Gestalt im Genesis-Kontext. Da מַלְאַךְ grundsätzlich auch „Bote“ heißen kann, bleibt diese echte lexikalische Mehrdeutigkeit in der Fußnote sichtbar, ohne die Identität der Gestalt weiter festzulegen.
- issue: Art der Verstärkung in הַרְבָּה אַרְבֶּה
  choice: 'Steigerung des Ausmaßes: „überaus zahlreich machen“'
  alternative: 'Gewissheitsbetonung: „ganz gewiss vermehren“'
  rationale: In Verbindung mit der anschließenden Aussage von der Unzählbarkeit liegt der Akzent auf der außerordentlichen Menge. Die Übersetzung vermeidet, aus der Verstärkungsform ausdrücklich eine Eides- oder Gewissheitsformel zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da sagte“ sorgt für natürlichen Erzählfluss; „überaus zahlreich machen“ ist klarer als das im Deutschen schwerfällige „sehr vermehren“. Das Pronomen „sie“ nimmt den im Deutschen pluralischen Ausdruck „Nachkommen“ auf.
