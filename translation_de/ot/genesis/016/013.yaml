revisions:
- from: 'Und sie nannte Jahwe, der zu ihr gesprochen hatte: „Du bist ein Gott, der mich sieht“[a]; denn sie sagte: „Habe ich hier wirklich noch gesehen, nachdem er mich gesehen hat?“[b]'
  to: 'Da gab sie Jahwe, der zu ihr gesprochen hatte, einen Namen: „Du bist ein Gott, der mich sieht“[a]. Denn sie sagte: „Habe ich auch hier wirklich gesehen, nachdem er mich gesehen hat?“[b]'
  rationale: Die Revision beseitigt die im Deutschen missverständliche Formulierung zur Namensgebung und entfernt die zusätzliche, im Haupttext nicht ausdrücklich belegte Implikation von Fortleben oder Weitersehen durch „noch“. Die syntaktische und semantische Schwierigkeit des hebräischen Schlusssatzes wird nicht dogmatisch aufgelöst; die naheliegende Deutung des Überlebens einer Gottesbegegnung bleibt als klar gekennzeichnete Fußnotenalternative erhalten.
