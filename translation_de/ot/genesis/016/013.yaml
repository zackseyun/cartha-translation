  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: de
  text: 'Da gab sie Jahwe, der zu ihr gesprochen hatte, einen Namen: „Du bist ein Gott, der mich sieht“[a]. Denn sie sagte: „Habe ich auch hier wirklich gesehen, nachdem er mich gesehen hat?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bist der Gott, der sieht“; oder: „Du bist ein Gott des Sehens.“'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist schwer zu deuten. Möglich ist auch: „Habe ich hier wirklich den gesehen, der mich sieht, und bin am Leben geblieben?“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: Und sie nannte Jahwe
  rationale: Die Wendung קרא שם bezeichnet hier die Vergabe einer Benennung. Im Deutschen vermeidet „sie nannte Jahwe“ das missverständliche Hebraismus „sie rief den Namen Jahwes“ und führt natürlich zur folgenden Bezeichnung über.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: der zu ihr gesprochen hatte
  rationale: Das Partizip kennzeichnet Jahwe als den, der mit Hagar redete. Das Plusquamperfekt fügt sich natürlich in den deutschen Erzählzusammenhang.
- source_word: אַתָּה אֵל רֳאִי
  choice: Du bist ein Gott, der mich sieht
  rationale: רֳאִי ist schwierig und kann das Sehen oder den mich Sehenden bezeichnen. Die Formulierung entspricht dem unmittelbaren Kontext, in dem Hagar von Gott wahrgenommen wird, ohne die mögliche Alternative zu verschweigen.
- source_word: כִּי אָֽמְרָה
  choice: denn sie sagte
  rationale: כִּי leitet hier die Begründung der Benennung ein.
- source_word: הֲגַם הֲלֹם
  choice: Habe ich hier wirklich noch
  rationale: Die Fragepartikel und גַּם drücken Erstaunen und Nachdruck aus; „wirklich noch“ vermittelt zugleich die mögliche Verwunderung darüber, nach der Gottesbegegnung sehen beziehungsweise am Leben sein zu können.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: gesehen, nachdem er mich gesehen hat
  rationale: 'Die schwierige Wortfolge wird eng an ihren Bestandteilen wiedergegeben: „ich habe gesehen“, אַחֲרֵי „nach/nachdem“ und „der mich sieht“. Die Ergänzung eines ausdrücklichen Objekts wird vermieden, sodass die Uneindeutigkeit erhalten bleibt.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von אֵל רֳאִי
  choice: ein Gott, der mich sieht
  alternative: der Gott des Sehens / der Gott, der sieht
  rationale: Die gewählte Fassung stellt Gottes Wahrnehmung Hagars heraus, wie es der Kontext nahelegt, lässt aber die lexikalische Mehrdeutigkeit in einer Fußnote sichtbar.
- issue: Deutung von רָאִיתִי אַחֲרֵי רֹאִי
  choice: Habe ich hier wirklich noch gesehen, nachdem er mich gesehen hat?
  alternative: Habe ich hier wirklich den gesehen, der mich sieht, und bin am Leben geblieben?
  rationale: Der hebräische Schluss ist syntaktisch gedrängt und unsicher. Die Hauptfassung bewahrt die Abfolge von Sehen und Gesehenwerden, ohne das Überleben ausdrücklich in den Text einzutragen; die verbreitete Deutung wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählform ist flüssig, während die auffällige und theologisch bedeutsame Mehrdeutigkeit des letzten Satzes soweit möglich gewahrt und zusätzlich in einer Fußnote kenntlich gemacht wird.
