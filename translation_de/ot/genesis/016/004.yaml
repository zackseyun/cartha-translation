  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: de
  text: Er schlief mit Hagar, und sie wurde schwanger. Als sie sah, dass sie schwanger war, verlor ihre Herrin in ihren Augen an Ansehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als ausdrückliche Deutung: „Da verachtete sie ihre Herrin.“ Wörtlich: „Ihre Herrin wurde gering in ihren Augen.“ Die hebräische Formulierung kann Sarais gesunkenes Ansehen in Hagars Einschätzung bezeichnen, ohne ausdrücklich zu sagen, wie Hagar dies zeigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: Er ging zu Hagar ein
  rationale: Die Verbindung בוא אל bezeichnet hier verhüllend den Geschlechtsverkehr. „zu … eingehen“ bewahrt die Bildsprache und den würdevollen Erzählton des Hebräischen.
- source_word: וַתַּהַר / הָרָתָה
  choice: sie wurde schwanger / sie schwanger war
  rationale: Das Verb הרה kann sowohl das Schwangerwerden als auch den Zustand der Schwangerschaft ausdrücken. Die deutsche Wiedergabe folgt den jeweiligen Satzformen natürlich.
- source_word: וַתֵּרֶא כִּי
  choice: Als sie sah, dass
  rationale: Die Formulierung erhält das Wahrnehmungsverb ראה und gibt den zeitlichen Fortgang der Erzählung idiomatisch wieder.
- source_word: וַתֵּקַל
  choice: wurde … gering geachtet
  rationale: קלל bezeichnet hier, dass Sarai in Hagars Einschätzung an Gewicht oder Ansehen verlor. Die passive deutsche Form bewahrt die mögliche Unschärfe zwischen innerer Geringschätzung und verächtlicher Behandlung.
- source_word: גְּבִרְתָּהּ
  choice: ihre Herrin
  rationale: גברת bezeichnet die weibliche Herrin beziehungsweise sozial übergeordnete Frau; „Herrin“ ist im Deutschen direkt und kontextgerecht.
- source_word: בְּעֵינֶיהָ
  choice: in ihren Augen
  rationale: Die geläufige hebräische Wendung für persönliche Einschätzung wird als verständliches deutsches Idiom beibehalten.
theological_decisions:
- issue: Art der Geringschätzung Sarais durch Hagar
  choice: „wurde ihre Herrin in ihren Augen gering geachtet“
  alternative: „verachtete sie ihre Herrin“
  rationale: Der hebräische Satz macht grammatisch die Herrin zum Subjekt des Zustands und lässt offen, ob vor allem Hagars innere Einschätzung oder auch ihr Verhalten gemeint ist. Die Übersetzung löst diese Spannung nicht zu einer ausdrücklich aktiven Handlung Hagars auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „zu Hagar eingehen“ wird wegen ihres verhüllenden Charakters und ihrer Nähe zum hebräischen Idiom beibehalten; der übrige Satz ist bewusst klar und gegenwärtig formuliert.
