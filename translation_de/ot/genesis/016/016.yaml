  text: וְ/אַבְרָ֕ם בֶּן שְׁמֹנִ֥ים שָׁנָ֖ה וְ/שֵׁ֣שׁ שָׁנִ֑ים בְּ/לֶֽדֶת הָגָ֥ר אֶת יִשְׁמָעֵ֖אל לְ/אַבְרָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: de
  text: Abram war 86 Jahre alt, als Hagar ihm[a] Ismael gebar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Abram“. Die hebräische Präposition lässt in diesem Zusammenhang beide Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben; das einleitende וְ wird im natürlichen deutschen Satzanschluss nicht eigens ausgedrückt.
- source_word: בֶּן
  choice: war … Jahre alt
  rationale: In Altersangaben bezeichnet בֶּן idiomatisch das Lebensalter; die deutsche Wendung „war … Jahre alt“ gibt dies natürlich wieder.
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: 86 Jahre alt
  rationale: Die hebräische Zahlenverbindung „achtzig Jahre und sechs Jahre“ wird als heutige deutsche Altersangabe zusammengezogen.
- source_word: בְּ/לֶדֶת
  choice: als … gebar
  rationale: Die Präposition בְּ mit dem Infinitiv constructus leitet hier einen temporalen Nebensatz ein; „als“ bildet diesen Zeitbezug idiomatisch ab.
- source_word: הָגָר
  choice: Hagar
  rationale: Der Eigenname entspricht der etablierten deutschen biblischen Schreibweise.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Ismael
  rationale: אֶת kennzeichnet das direkte Objekt und bleibt im Deutschen unübersetzt; der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: לְ/אַבְרָם
  choice: ihm
  rationale: Das Dativpronomen nimmt Abram natürlich wieder auf und gibt die Beziehung wieder, die לְ ausdrückt, ohne den Namen unnötig zu wiederholen; die mögliche Wiedergabe „für Abram“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Beziehung des Gebärens zu Abram in לְ/אַבְרָם
  choice: ihm
  alternative: für Abram
  rationale: Die hebräische Präposition לְ kann hier den Empfänger beziehungsweise die Zuordnung bezeichnen und lässt sich im Deutschen sowohl mit einem Dativ als auch mit „für“ wiedergeben. Der Haupttext wählt die natürlichere Dativkonstruktion, ohne die Alternative auszuschließen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. „Gebar“ ist knapp und entspricht dem hebräischen Verb genauer als die längere Wendung „zur Welt brachte“.
