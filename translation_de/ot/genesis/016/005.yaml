  source_fidelity: Die Anklage wegen des Sarai widerfahrenen Unrechts, die Übergabe der Sklavin, die eingetretene Schwangerschaft und der Appell an Jahwe als Richter sind sachgerecht wiedergegeben. In der Wendung וָאֵקַל בְּעֵינֶיהָ bezeichnet das Hebräische jedoch zunächst Sarais Herabsetzung in Hagars Einschätzung; „verachtete sie mich“ macht daraus eine stärkere, aktive Handlung Hagars. Der Jussiv יִשְׁפֹּט wird mit „Möge ... richten“ präziser erfasst.
  naturalness: Die Fassung ist überwiegend modernes, würdiges Standarddeutsch. „In ihren Augen galt ich nichts mehr“ ist idiomatisch und bewahrt die Perspektivformel besser als „verachtete sie mich“. „Möge Jahwe ... richten“ ist als Anrufung natürlicher und eindeutiger als „Jahwe soll ... richten“.
  terminology: „Sklavin“ gibt שִׁפְחָה sozialgeschichtlich klar wieder. „Jahwe“ entspricht der Entscheidung, den Gottesnamen sichtbar wiederzugeben. „In die Arme gegeben“ wahrt die zurückhaltende Ausdrucksweise der Vorlage.
