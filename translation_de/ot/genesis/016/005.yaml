  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: de
  text: 'Da sagte Sarai zu Abram: „Das Unrecht, das mir widerfährt, liegt auf dir! Ich selbst habe dir meine Sklavin in die Arme gegeben. Als sie aber sah, dass sie schwanger geworden war, galt ich in ihren Augen nichts mehr.[a] Möge Jahwe zwischen mir und dir richten!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da wurde ich gering in ihren Augen.“'
    reason: Die Fußnote bewahrt das hebräische Bild und die mögliche Nuance eines Statusverlusts, während der Haupttext natürliches Deutsch verwendet.
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Das Unrecht, das mir widerfährt, liegt auf dir
  rationale: חָמָס bezeichnet hier Unrecht beziehungsweise erlittene Schädigung; der Possessivsuffix kann das Sarai widerfahrene Unrecht ausdrücken. עַל weist Abram die Verantwortung dafür zu.
- source_word: שִׁפְחָתִי
  choice: meine Sklavin
  rationale: שִׁפְחָה bezeichnet eine unfreie weibliche Hausangehörige. „Sklavin“ macht ihren rechtlichen und sozialen Status deutlicher als das verharmlosende „Magd“.
- source_word: בְּחֵיקֶךָ
  choice: dir … in die Arme
  rationale: Wörtlich steht „in deinen Schoß/Bausch“. Im Zusammenhang ist dies eine zurückhaltende Wendung für intime beziehungsweise eheliche Aufnahme; „in die Arme geben“ bewahrt das Bild in natürlichem Deutsch.
- source_word: הָרָתָה
  choice: schwanger geworden war
  rationale: Die Form bezeichnet die bereits eingetretene Empfängnis; im Deutschen gibt „schwanger geworden war“ die zeitliche Folge natürlich wieder.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: verachtete sie mich
  rationale: Wörtlich wurde Sarai „gering in ihren Augen“. Die idiomatische Übersetzung benennt die Geringschätzung, ohne die Blickmetapher im Deutschen unnötig nachzuahmen.
- source_word: יִשְׁפֹּט יְהוָה
  choice: Jahwe soll … richten
  rationale: Der Jussiv ist ein Appell an die Gottheit als Richter. „Soll richten“ wahrt die nachdrückliche Aufforderungs- beziehungsweise Wunschbedeutung.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: zwischen mir und dir
  rationale: Die direkte Gegenüberstellung der beiden Streitparteien wird formal bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich gebrauchte Gottesname sichtbar bleibt.
- issue: Mehrdeutigkeit von חֲמָסִי
  choice: das Unrecht, das mir widerfährt
  alternative: mein Unrecht / meine Gewalttat
  rationale: Im Kontext klagt Sarai Abram an und weist ihm Verantwortung zu. Die gewählte Fassung versteht den Suffix als das ihr zugefügte beziehungsweise von ihr erlittene Unrecht, ohne daraus ein Schuldbekenntnis Sarais zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt scharf und anklagend. „Sklavin“ bildet den sozialen Status nüchtern ab; „in die Arme gegeben“ wahrt die zurückhaltende Körpermetaphorik des Hebräischen.
