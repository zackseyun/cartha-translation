  - severity: low
    issue: „Jahwe soll ... richten“ ist für den Jussiv weniger präzise.
    rationale: „Soll“ kann im Deutschen eine Verpflichtung oder Erwartung ausdrücken. „Möge Jahwe ... richten“ gibt den appellativen Wunschcharakter des Jussivs klar wieder.
