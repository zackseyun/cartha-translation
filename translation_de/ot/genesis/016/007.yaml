  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: de
  text: Und der Engel Jahwes[a][b] fand sie bei einer Wasserquelle in der Wüste, bei der Quelle am Weg nach Schur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort kann sowohl »Engel« als auch »Bote« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH, der Gottesname; traditionell wiedergegeben mit »der HERR«.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: fand sie
  rationale: מצא bezeichnet hier im fortlaufenden Erzählstil am natürlichsten das Finden oder Antreffen; das feminine Objektsuffix bezieht sich auf Hagar.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann sowohl »Bote« als auch »Engel« bedeuten. Im Zusammenhang mit einem göttlichen Gesandten ist »Engel« die geläufige Wiedergabe; eine Fußnote bewahrt die lexikalische Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל עֵין הַמַּיִם
  choice: bei einer Wasserquelle
  rationale: עַיִן bezeichnet hier aufgrund des Zusatzes »Wasser« und des Wüstenkontexts eindeutig eine Quelle; עַל wird örtlich idiomatisch mit »bei« wiedergegeben.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes Wüsten- oder Steppengebiet. »Wüste« ist im Deutschen natürlich und muss nicht ausschließlich Sandwüste bedeuten.
- source_word: עַל הָעַיִן
  choice: bei der Quelle
  rationale: Die bestimmte Form greift dieselbe zuvor genannte Wasserquelle wieder auf; die Wiederholung bleibt im Text erhalten.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: am Weg nach Schur
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Straße. Die Formulierung lokalisiert die Quelle an der Route in Richtung Schur.
theological_decisions:
- issue: Wiedergabe von מַלְאַךְ in der Verbindung מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: »Engel« ist für einen übernatürlichen göttlichen Gesandten kontextuell und traditionell verständlich; die Fußnote erhält die echte Bedeutungsbreite von מַלְאַךְ, ohne die Identität der Gestalt weiter festzulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname macht sichtbar, dass der hebräische Text das Tetragramm verwendet. Die traditionelle Ersetzung durch »der HERR« wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die einleitende Konjunktion »Und« bildet den fortlaufenden hebräischen Erzählzusammenhang ab. Die Wiederholung von »Quelle« wird bewahrt, weil sie die Ortsangabe präzisiert.
