  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: de
  text: Darum nannte man den Brunnen Beer-Lachai-Roi.[a] Er liegt zwischen Kadesch und Bered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lachai-Roi bedeutet möglicherweise »Brunnen des Lebendigen, der mich sieht« oder »Brunnen dessen, der lebt und mich sieht«.
    reason: Erläutert den hebräischen Ortsnamen, ohne seine syntaktische Mehrdeutigkeit zu verschweigen.
lexical_decisions:
- source_word: קָרָא
  choice: nannte man
  rationale: Die maskuline Singularform lässt das Subjekt offen. Die unpersönliche Wiedergabe bewahrt diese Offenheit natürlich im Deutschen, statt Hagar ausdrücklich als Subjekt einzusetzen.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lachai-Roi
  rationale: Der überlieferte Ortsname wird in geläufiger deutscher Umschrift wiedergegeben; seine mehrdeutige Deutung wird in einer Fußnote erläutert.
- source_word: הִנֵּה
  choice: Er liegt
  rationale: Das Präsentativ hebt hier die Lage des Brunnens hervor. Im Deutschen gibt der knappe Aussagesatz diese Funktion natürlicher wieder als ein wörtliches »Siehe«.
- source_word: קָדֵשׁ ... בָּרֶד
  choice: Kadesch ... Bered
  rationale: Die Ortsnamen werden nach geläufiger deutscher Transkription wiedergegeben.
theological_decisions:
- issue: Deutung des Namens Beer-Lachai-Roi
  choice: Name im Haupttext transliterieren und mögliche Bedeutung in der Fußnote offenhalten
  alternative: eine einzige Deutung direkt übersetzen, etwa »Brunnen des Lebendigen, der mich sieht«
  rationale: Die hebräische Namensfügung ist knapp und lässt mehr als eine syntaktische Deutung zu. Eine eindeutige Übersetzung würde die echte Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der unpersönliche Ausdruck »nannte man« vermeidet ein im Hebräischen nicht ausdrücklich genanntes Subjekt; die Lokalisierung wird knapp und idiomatisch formuliert.
