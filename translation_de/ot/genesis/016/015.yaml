  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: de
  text: Hagar gebar Abram einen Sohn, und Abram gab seinem Sohn, den Hagar geboren hatte, den Namen Ismael.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Qal von ילד mit weiblichem Subjekt bezeichnet hier das Gebären; „gebar“ ist knapp, würdevoll und im Erzählstil natürlich.
- source_word: לְאַבְרָם
  choice: Abram
  rationale: 'Der deutsche Dativ in „Abram einen Sohn gebären“ gibt die durch לְ bezeichnete Zuordnung wieder: Das Kind wird Abram als Sohn geboren.'
- source_word: בֵּן
  choice: einen Sohn
  rationale: Der unbestimmte hebräische Ausdruck wird im Deutschen idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: gab ... den Namen
  rationale: Die hebräische Benennungsformel wird in natürlichem modernem Deutsch mit „jemandem den Namen geben“ ausgedrückt, ohne ihren Sinn abzuschwächen.
- source_word: בְּנוֹ
  choice: seinem Sohn
  rationale: Das Possessivsuffix bezeichnet den Sohn Abrams und wird ausdrücklich wiedergegeben.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: den Hagar geboren hatte
  rationale: Der Relativsatz bewahrt die ausdrückliche Wiederholung Hagars; das Plusquamperfekt verdeutlicht im Deutschen die vorangegangene Geburt.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: „Ismael“ ist die etablierte deutsche Namensform.
theological_decisions: []
