  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: de
  text: 'Da sagte der Engel Jahwes[a] zu ihr: »Kehre zu deiner Herrin zurück und ordne dich ihr unter[b].«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »demütige dich« oder »lass dich demütigen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »unter ihre Hand«. Die hebräische Wendung bezeichnet Unterordnung unter ihre Gewalt oder Autorität.'
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Im Kontext dieser göttlichen Begegnung ist »Engel« die naheliegende Bezeichnung, ohne die Identität der Gestalt näher festzulegen. Der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: שׁוּבִי
  choice: Kehre … zurück
  rationale: Der feminine Singularimperativ von שוב bezeichnet hier die Rückkehr zu Sarai; die deutsche Form gibt den direkten Befehlscharakter klar wieder.
- source_word: גְּבִרְתֵּךְ
  choice: deiner Herrin
  rationale: גְּבֶרֶת bezeichnet eine weibliche Herrschafts- oder Autoritätsperson. »Herrin« bildet das soziale Verhältnis zwischen Hagar und Sarai präzise und in heutigem Deutsch ab.
- source_word: וְהִתְעַנִּי
  choice: und beuge dich
  rationale: Der Hitpael-Imperativ von ענה kann das Sichdemütigen, Sichunterordnen oder das Erdulden von Bedrängnis ausdrücken. »Beuge dich« bewahrt diese Spannung und verbindet sich natürlich mit dem folgenden Bild von der Hand.
- source_word: תַּחַת יָדֶיהָ
  choice: unter ihre Hand
  rationale: Die wörtliche Wendung lautet »unter ihre Hand« und bezeichnet bildhaft die Unterstellung unter ihre Gewalt oder Autorität. Das hebräische Bild bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt diesen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַלְאַךְ in der Verbindung מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Der Erzählkontext spricht für einen himmlischen Boten. Die Übersetzung »Engel« macht keine weitergehende dogmatische Aussage über seine genaue Identität.
- issue: Reichweite von וְהִתְעַנִּי
  choice: beuge dich
  alternative: ordne dich unter; lass dich demütigen
  rationale: Die Form kann sowohl freiwillige Unterordnung als auch das Hinnehmen von Demütigung oder Bedrängnis anklingen lassen. Die gewählte Formulierung wahrt diese unangenehme Spannung, statt sie eindeutig als bloße innere Demut oder als ausdrücklichen Befehl zum Erleiden von Misshandlung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Herrin« wahrt die antike soziale Rangordnung; »unter ihre Hand« erhält bewusst das hebräische Bild, während die Fußnote dessen Sinn erklärt.
