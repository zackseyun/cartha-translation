revisions:
- from: 'Da sagte der Engel Jahwes[a] zu ihr: »Kehre zu deiner Herrin zurück und beuge dich[b] unter ihre Hand[c].«'
  to: 'Da sagte der Engel Jahwes[a] zu ihr: »Kehre zu deiner Herrin zurück und ordne dich ihr unter[b].«[c]'
  rationale: Die Revision ersetzt die im modernen Deutsch missverständliche, körperlich klingende Wendung „beuge dich unter ihre Hand“ durch die natürliche und kontextgerechte Formulierung „ordne dich ihr unter“. Das wörtliche hebräische Bild wird in einer unmittelbar anschließenden Fußnote dokumentiert, sodass weder die Bildsprache noch die unangenehme Nuance von Erniedrigung bzw. Bedrängnis verdeckt werden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:23:15Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, den femininen Imperativ „Kehre … zurück“, das soziale Verhältnis in „deiner Herrin“ sowie die Bezeichnung „Engel Jahwes“ zutreffend wieder. Die Wiedergabe von וְהִתְעַנִּי durch „beuge dich“ kann jedoch im Deutschen vor allem eine körperliche Geste nahelegen und erschließt die hier gemeinte Unterordnung weniger klar. „Ordne dich ihr unter“ gibt den Imperativ sachgerecht wieder; die Anmerkung hält das wörtliche Bild und den möglichen Anklang von Demütigung/Bedrängnis fest.
  naturalness: „Beuge dich unter ihre Hand“ ist als wörtlich orientierte Formulierung verständlich, aber im modernen Standarddeutsch deutlich weniger idiomatisch als „ordne dich ihr unter“. Die revidierte Fassung bleibt knapp, würdig und befehlend.
  terminology: „Jahwe“, „Engel Jahwes“ und „Herrin“ sind angemessen. Die Fußnoten werden so angepasst, dass sie die lexikalische Alternative bei מַלְאָךְ, die Spannweite von וְהִתְעַנִּי und das hebräische Idiom תַּחַת יָדֶיהָ klar und ohne zusätzliche dogmatische Deutung wiedergeben.
