  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: de
  text: 'Und er sagte: »Hagar, Sarais Sklavin[a], woher kommst du, und wohin gehst du?« Sie sagte: »Ich bin auf der Flucht vor Sarai, meiner Herrin[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Magd« oder »Dienerin«; das hebräische Wort bezeichnet eine Frau in unfreier, dienender Stellung unter Sarai.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vom Angesicht Sarais, meiner Herrin« beziehungsweise »aus ihrer Gegenwart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: Sklavin
  rationale: שִׁפְחָה bezeichnet eine Frau in unfreier, dienender Stellung. »Sklavin« gibt ihren sozialen Status klarer wieder als das mildere »Dienerin« oder das altertümliche »Magd«.
- source_word: אֵי מִזֶּה
  choice: woher kommst du
  rationale: Die hebräische Wendung fragt nach dem Ausgangspunkt; diese Formulierung ist im modernen Deutschen natürlich und genau.
- source_word: וְאָנָה תֵלֵכִי
  choice: und wohin gehst du
  rationale: אָנָה mit הלך fragt nach dem Ziel. Das deutsche Präsens kann die unmittelbar bevorstehende oder gegenwärtig beabsichtigte Bewegung idiomatisch ausdrücken.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Wörtlich steht »vom Angesicht/aus der Gegenwart von«. Im Zusammenhang einer Flucht vor einer Person gibt »vor« die räumlich-soziale Trennung knapp und natürlich wieder.
- source_word: גְּבִרְתִּי
  choice: meiner Herrin
  rationale: Die feminine Form bezeichnet Hagars weibliche Herrin beziehungsweise Besitzerin und wahrt das hierarchische Verhältnis.
- source_word: אָנֹכִי בֹּרַחַת
  choice: Ich bin auf der Flucht
  rationale: Das Partizip beschreibt eine andauernde Handlung. »Ich bin auf der Flucht« bewahrt diesen durativen Sinn und klingt in der Situation natürlich.
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Der Sprecher ist aus dem vorhergehenden Vers erschließbar; da der hebräische Vers ihn hier nur durch die Verbform bezeichnet, wird sein Titel nicht erneut eingefügt.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: הָגָר
  choice: Hagar
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Hagars sozialem Status
  choice: Sklavin
  alternative: Magd; Dienerin
  rationale: Der Text kennzeichnet Hagar ausdrücklich durch ihre unfreie, Sarai untergeordnete Stellung. »Sklavin« vermeidet eine beschönigende Wiedergabe, ohne über den hebräischen Begriff hinauszugehen.
- issue: Ausdrückliche Benennung des Sprechers als Engel des HERRN
  choice: Und er sagte
  alternative: Und der Engel des HERRN sagte
  rationale: Der vorhergehende Vers macht den Bezug deutlich, doch dieser Vers wiederholt die Bezeichnung nicht. Die Übersetzung bewahrt daher die Ausdrucksweise des vorliegenden Verses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich natürlich. »Sklavin« macht den sozialen Status unbeschönigt sichtbar; »meiner Herrin« bewahrt zugleich die im Hebräischen ausdrücklich benannte Hierarchie.
