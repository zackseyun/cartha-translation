  source_fidelity: 'Der Text gibt die hebräischen Aussagen präzise wieder: שִׁפְחַת wird zutreffend und ohne Beschönigung als „Sklavin“ wiedergegeben; die Fragen nach Herkunft und Ziel sind vollständig erfasst; „Ich bin auf der Flucht vor Sarai, meiner Herrin“ vermittelt die andauernde Flucht (אָנֹכִי בֹּרַחַת) und die Beziehung zu Sarai. „Vor“ ist hier eine idiomatische, kontextgerechte Wiedergabe von מִפְּנֵי; Fußnote b dokumentiert die wörtlichere Nuance „aus ihrer Gegenwart“.'
  naturalness: Modernes Standarddeutsch, flüssige direkte Rede und angemessen knapper erzählerischer Stil. Die Anrede sowie die Fragen „woher kommst du“ und „wohin gehst du“ sind natürlich. „Ich bin auf der Flucht vor“ ist idiomatisch und bewahrt den durativen Charakter gut.
  terminology: „Sklavin“ und „Herrin“ geben Status und Hierarchie der hebräischen Ausdrücke sachgerecht wieder. Die Namen Hagar und Sarai entsprechen der im Deutschen etablierten Form. Die Fußnoten bieten sinnvolle lexikalische Alternativen und erläutern die Präsenz-/Angesichtsnuance, ohne den Haupttext zu überladen.
