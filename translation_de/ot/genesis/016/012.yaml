id: GEN.16.12
reference: Genesis 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: de
  text: 'Und er wird ein Mensch wie ein Wildesel sein[a]: Seine Hand wird gegen alle sein und die Hand aller gegen ihn. Allen seinen Brüdern gegenüber wird er wohnen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: »ein Wildesel-Mensch«. Gemeint ist ein Mensch, der einem Wildesel gleicht; das Bild bezeichnet ungebundene, schwer zu zähmende Freiheit und sagt nicht lediglich, dass er »wild« sei.'
    reason: lexical_alternative
  - marker: b
    text: »Gegenüber« kann hier auch »vor«, »im Angesicht von« oder »ihnen gegenüberstehend« bedeuten. »Brüder« kann außer leiblichen Brüdern auch nahe Verwandte oder verwandte Völker bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: ein Mensch wie ein Wildesel
  rationale: פֶּרֶא bezeichnet ausdrücklich den Wildesel. Die deutsche Vergleichsform gibt die knappe hebräische Wortfügung natürlich wieder, ohne das Tierbild zu der bloßen Aussage »ein wilder Mensch« abzuschwächen.
- source_word: אָדָם
  choice: Mensch
  rationale: Hier ist Ismael als einzelner Mensch gemeint. »Mensch« verbindet sich im Deutschen natürlich mit dem nachfolgenden Vergleich und vermeidet die mögliche Lesart, אָדָם bezeichne die Menschheit.
- source_word: יָדוֹ בַכֹּל
  choice: Seine Hand wird gegen alle sein
  rationale: Der Kontext legt feindliches oder widerständiges Handeln nahe. Das Handbild und die parallele Satzstruktur des Hebräischen bleiben erhalten.
- source_word: וְיַד כֹּל בּוֹ
  choice: und die Hand aller gegen ihn
  rationale: Die elliptische Form bewahrt die prägnante Parallelität und die wechselseitige Gegnerschaft des Ausgangstextes.
- source_word: וְעַל־פְּנֵי
  choice: gegenüber
  rationale: Die Wendung kann räumlich »vor«, »gegenüber« oder relational »im Angesicht von« bedeuten. »Gegenüber« wahrt die räumlich-relationale Offenheit und passt zu ישׁכן.
- source_word: כָּל־אֶחָיו
  choice: allen seinen Brüdern
  rationale: אָח bedeutet primär »Bruder«, kann hier aber auch Verwandte oder verwandte Volksgruppen einschließen; die Grundbedeutung bleibt im Haupttext stehen.
- source_word: יִשְׁכֹּן
  choice: wird er wohnen
  rationale: שׁכן bedeutet wohnen, sich niederlassen oder ansässig sein. »Wohnen« ist modernes, würdevolles Deutsch und lässt die genaue Siedlungsform offen.
theological_decisions:
- issue: Charakterisierung Ismaels durch פֶּרֶא אָדָם
  choice: Das Tierbild wird ausdrücklich als »ein Mensch wie ein Wildesel« wiedergegeben.
  alternative: »ein wilder Mensch«
  rationale: Das Hebräische charakterisiert Ismael mit dem Bild des frei lebenden Wildesels. Eine Verallgemeinerung zu »wild« würde das konkrete Bild beseitigen und könnte zusätzliche moralische Wertungen nahelegen.
- issue: Bedeutung von וְעַל־פְּנֵי כָל־אֶחָיו
  choice: »Allen seinen Brüdern gegenüber wird er wohnen«
  alternative: »im Angesicht all seiner Brüder«, »östlich von all seinen Brüdern« oder »allen seinen Brüdern zum Trotz«
  rationale: Die Formulierung lässt eine räumliche Lage und eine spannungsvolle Beziehung anklingen, legt aber weder eine Himmelsrichtung noch ausdrücklich Trotz fest. »Gegenüber« erhält diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, knappem Prophetenton. Die hebräische Parallelität der beiden Hand-Sätze und die Mehrdeutigkeit von עַל־פְּנֵי wurden möglichst bewahrt; altertümliche Wörter und eine unnötig moralistische Deutung des Wildeselbildes wurden vermieden.
