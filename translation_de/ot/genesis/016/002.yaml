source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: de
  text: 'Da sagte Sarai zu Abram: „Sieh doch, JHWH hat mich daran gehindert, Kinder zu gebären. Geh doch zu meiner Sklavin; vielleicht werde ich durch sie aufgebaut[a].“ Und Abram hörte auf Sarais Stimme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vielleicht werde ich durch sie aufgebaut“. Gemeint sein kann: „vielleicht bekomme ich durch sie Kinder“ oder „vielleicht werde ich durch sie als Familie beziehungsweise Haus aufgebaut“.'
    reason: Die ungewöhnliche hebräische Bau-Metapher kann auf Nachkommenschaft, den Aufbau einer Familie oder die Etablierung eines Hauses zielen. Die Fußnote erläutert diese Bedeutungsbreite, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: „Sieh“ bewahrt den aufmerksamkeitslenkenden Charakter von הִנֵּה, während „doch“ die bittende bzw. nachdrückliche Partikel נָא natürlich wiedergibt.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: JHWH hat mich daran gehindert, Kinder zu gebären
  rationale: Die Formulierung bewahrt Sarais ausdrückliche Zuschreibung an JHWH und gibt עצר als Verhinderung sowie ילד im Kontext als Kindergebären wieder.
- source_word: בֹּא נָא אֶל
  choice: Geh doch zu
  rationale: Die zurückhaltende Formulierung bewahrt den konventionellen hebräischen Euphemismus für geschlechtlichen Verkehr, ohne ihn im Haupttext expliziter zu machen als die Vorlage.
- source_word: שִׁפְחָתִי
  choice: meiner Sklavin
  rationale: „Sklavin“ bezeichnet den rechtlich und sozial unfreien Status deutlicher als die abschwächenden Alternativen „Magd“ oder „Dienerin“.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: vielleicht werde ich durch sie aufgebaut
  rationale: Die Wiedergabe erhält die Metapher des Niphal von בנה und lässt offen, ob Familiengründung, Nachkommenschaft oder gesellschaftliche Etablierung im Vordergrund steht; „durch sie“ gibt die vermittelnde Bedeutung von מִמֶּנָּה im Deutschen verständlich wieder.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: Und ... hörte auf ... Stimme
  rationale: Die Formulierung bewahrt sowohl den Sinn des Folgeleistens als auch das im Hebräischen ausdrücklich genannte „Stimme“, einschließlich möglicher innerbiblischer Anklänge.
theological_decisions:
- issue: Sarais Aussage über JHWHs Rolle bei ihrer Kinderlosigkeit
  choice: JHWH hat mich daran gehindert, Kinder zu gebären
  alternative: JHWH hat mir keine Kinder geschenkt
  rationale: Der Text schreibt die Verhinderung ausdrücklich dem Handeln JHWHs zu. Die Übersetzung schwächt diese Spannung nicht ab und ergänzt keine theologische Erklärung.
- issue: Explizitheit des Euphemismus für den Geschlechtsverkehr
  choice: Geh doch zu meiner Sklavin
  alternative: Schlaf doch mit meiner Sklavin
  rationale: Die gewählte Fassung bewahrt die euphemistische Ausdrucksweise der hebräischen Vorlage; die Alternative wäre eindeutiger, aber auch expliziter als der Ausgangstext.
- issue: Bedeutung der Bau-Metapher
  choice: vielleicht werde ich durch sie aufgebaut
  alternative: vielleicht bekomme ich durch sie Kinder
  rationale: Die wörtlichere Fassung erhält das Bild und seine mögliche Mehrdeutigkeit, statt es ausschließlich auf das Bekommen von Kindern festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text vermeidet archaisches „siehe“ und die beschönigende Standesbezeichnung „Magd“, bewahrt aber den zurückhaltenden Euphemismus und die auffällige Bau-Metapher der Vorlage.
