  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des hebräischen Textes zuverlässig wieder: Abrams Hinweis auf Hagars unfreien Status und Sarais Verfügungsgewalt, die Erlaubnis zu einem an Sarais eigenem Urteil orientierten Handeln, Sarais harte Behandlung und Hagars Flucht. »in deiner Hand« und »in deinen Augen« bewahren die hebräischen Idiome, ohne im modernen Deutsch unverständlich zu sein. »behandelte sie hart« trifft ענה im Piel angemessen, ohne eine konkrete Art der Misshandlung zu behaupten.'
  naturalness: Das Deutsch ist flüssig, modern und erzählerisch angemessen. »Sieh« ist hier ein natürlicher, knapper Aufmerksamkeitsmarker. »Tu mit ihr, was in deinen Augen gut ist« ist als bewusst bildnahe Wiedergabe verständlich und wahrt den harten Aussagegehalt.
  terminology: »Sklavin« gibt שפחה klarer und sozialgeschichtlich treffender wieder als beschönigende Alternativen. Die Fußnote zu »behandelte sie hart« dokumentiert plausible lexikalische Nuancen; ihr Anker steht korrekt bei dem erläuterten Verb.
