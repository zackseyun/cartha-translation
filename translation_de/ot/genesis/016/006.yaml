source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: de
  text: 'Da sagte Abram zu Sarai: »Sieh, deine Sklavin ist in deiner Hand. Tu mit ihr, was in deinen Augen gut ist.« Da behandelte Sarai sie hart[a], und sie floh vor ihr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »demütigte sie«, »bedrückte sie« oder »misshandelte sie«. Das hebräische Verb kann harte, erniedrigende oder bedrückende Behandlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende Kraft des hebräischen Ausdrucks in natürlichem, nicht archaischem Deutsch.
- source_word: שִׁפְחָתֵךְ
  choice: deine Sklavin
  rationale: Gibt den unfreien sozialen Status ausdrücklich wieder und schwächt das Machtverhältnis nicht zu einem allgemeinen Dienstverhältnis ab.
- source_word: בְּיָדֵךְ
  choice: ist in deiner Hand
  rationale: Bewahrt das verständliche hebräische Bild für Sarais Verfügungsgewalt.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: Tu mit ihr, was in deinen Augen gut ist
  rationale: Erhält die Bildsprache und den wertenden Ausdruck des Hebräischen, ohne im Deutschen unverständlich zu wirken.
- source_word: וַתְּעַנֶּהָ
  choice: behandelte sie hart
  rationale: Das Piel von ענה bezeichnet hier bedrückende, demütigende oder harte Behandlung. Die Formulierung ist idiomatisch und lässt die genaue Art des Misshandelns offen.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: sie floh vor ihr
  rationale: Gibt Flucht und Entfernung aus Sarais Gegenwart knapp und natürlich wieder.
theological_decisions:
- issue: Hagars sozialer Status
  choice: Sklavin
  alternative: Magd / Dienerin
  rationale: Der hebräische Begriff bezeichnet eine unfreie Frau im Haushalt. »Sklavin« macht das für die Erzählung wesentliche Machtgefälle sichtbar.
- issue: Schwere von Sarais Behandlung
  choice: behandelte sie hart
  alternative: demütigte sie / misshandelte sie / bedrückte sie
  rationale: Der hebräische Ausdruck bezeichnet tatsächliche Bedrückung oder Demütigung, legt aber die konkrete Form nicht fest. Die gewählte Fassung wahrt sowohl die Schwere als auch diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Bilder »in deiner Hand« und »in deinen Augen« bleiben erhalten; archaische Wörter wie »siehe« und beschönigende Statusbezeichnungen werden vermieden.
