  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: de
  text: Da nahm Sarai, Abrams Frau, Hagar, ihre ägyptische Sklavin, nachdem Abram zehn Jahre im Land Kanaan gewohnt hatte, und gab sie Abram, ihrem Mann, zur Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihm zur Frau“; zugleich bezeichnet der Vers Hagar als Sarais Sklavin.
    reason: Die Anmerkung macht die im Hebräischen ausdrücklich nebeneinanderstehenden Statusangaben sichtbar, ohne sie harmonisierend umzudeuten.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Da nahm
  rationale: Die gewöhnliche erzählende Bedeutung von לקח ist „nehmen“. „Da“ gibt die Fortführung der hebräischen Erzählfolge natürlich wieder.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, Abrams Frau
  rationale: Die Apposition bezeichnet Sarai durch ihre Beziehung zu Abram und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: הָגָר הַמִּצְרִית
  choice: Hagar, ihre ägyptische …
  rationale: Der Personenname wird in der üblichen Form wiedergegeben; das Gentiladjektiv bezeichnet Hagars ägyptische Herkunft.
- source_word: שִׁפְחָתָהּ
  choice: ihre … Sklavin
  rationale: שִׁפְחָה bezeichnet eine unfreie Dienerin beziehungsweise Sklavin. „Sklavin“ lässt ihren rechtlichen und sozialen Status deutlicher erkennen als das abschwächende „Magd“.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים
  choice: nachdem … zehn Jahre
  rationale: Die Wendung bezeichnet den Abschluss eines Zeitraums von zehn Jahren; ein deutscher Temporalsatz vermittelt diesen Sinn klar.
- source_word: לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: nachdem Abram zehn Jahre im Land Kanaan gewohnt hatte
  rationale: Der Infinitiv mit ל bezeichnet hier den zeitlichen Bezug auf Abrams Aufenthalt in Kanaan. Der finite deutsche Nebensatz ist verständlich und wahrt diese Beziehung.
- source_word: וַתִּתֵּן אֹתָהּ
  choice: und gab sie
  rationale: Die Erzählung wird mit Sarai als unverändertem Subjekt fortgeführt; „sie“ bezeichnet Hagar.
- source_word: לְאַבְרָם אִישָׁהּ
  choice: ihrem Mann Abram
  rationale: אִישָׁהּ bedeutet in diesem Zusammenhang „ihr Mann“. Die deutsche Wortfolge ist natürlich und eindeutig.
- source_word: לוֹ לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung „jemandem eine Frau zur Frau geben“ gibt die Zweck- beziehungsweise Statusbestimmung wieder, ohne eine vom Text nicht verwendete Bezeichnung wie „Nebenfrau“ einzuführen.
theological_decisions:
- issue: Hagars Status gegenüber Abram
  choice: „zur Frau“, während Hagar zugleich ausdrücklich als Sarais „Sklavin“ bezeichnet wird
  alternative: „zur Nebenfrau“ oder „damit sie seine Frau wurde“
  rationale: Der hebräische Text verwendet אִשָּׁה („Frau/Ehefrau“) und keinen besonderen Ausdruck für eine Nebenfrau. Zugleich nennt er Hagar שִׁפְחָה („Sklavin“). Beide Aussagen werden nebeneinander bewahrt, ohne die soziale und theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bleibt nah am hebräischen Ablauf, während der Temporalsatz idiomatisch deutsch formuliert ist.
