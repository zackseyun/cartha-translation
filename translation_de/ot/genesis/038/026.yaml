source:
  edition: WLC
  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: de
  text: 'Da erkannte Juda die Gegenstände und sagte: »Sie ist mehr im Recht als ich,[a] denn ich habe sie meinem Sohn Schela nicht zur Frau gegeben.« Und er hatte keinen weiteren Geschlechtsverkehr mit ihr.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie ist gerechter als ich.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Und er fuhr nicht fort, sie zu erkennen.« Das hebräische »erkennen« ist hier eine verhüllende Bezeichnung für Geschlechtsverkehr.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: Da erkannte Juda die Gegenstände
  rationale: Das Objekt sind nach dem unmittelbaren Zusammenhang die in Vers 25 vorgelegten Pfandgegenstände. Im Deutschen wird es zur Klarheit ausdrücklich ergänzt.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Sie ist mehr im Recht als ich
  rationale: Die Vergleichskonstruktion bezeichnet Tamar in dieser Sache als gerechter beziehungsweise stärker im Recht als Juda, ohne ein umfassendes Urteil über ihre Person zu fällen.
- source_word: כִּי עַל כֵּן
  choice: denn
  rationale: Die Wendung leitet Judas Begründung für sein Eingeständnis ein. »Denn« gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: ich habe sie meinem Sohn Schela nicht zur Frau gegeben
  rationale: Das Hebräische sagt wörtlich, Juda habe sie seinem Sohn nicht »gegeben«; aus dem Kontext ist die Ehe gemeint. Diese Bedeutung wird für heutige Leser ausdrücklich gemacht.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: Und er hatte keinen weiteren Geschlechtsverkehr mit ihr
  rationale: ידע, »erkennen«, ist hier ein Euphemismus für sexuelle Beziehungen. Die klare deutsche Wiedergabe vermeidet das heute missverständliche wörtliche »erkennen«; יָסַף עוֹד bezeichnet, dass es zu keiner weiteren Beziehung dieser Art kam.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform wird verwendet.
- source_word: שֵׁלָה
  choice: Schela
  rationale: Die im Deutschen übliche Transkription des hebräischen Personennamens wird verwendet.
theological_decisions:
- issue: Moralische Bewertung in Judas Eingeständnis
  choice: Tamar ist in dieser Angelegenheit mehr im Recht als Juda.
  alternative: Sie ist gerechter als ich.
  rationale: Die vergleichende Aussage bleibt auf die erzählte Situation bezogen. »Mehr im Recht« bewahrt die moralische Aussage, ohne Tamar absolute Sündlosigkeit zuzuschreiben oder die Spannung des Textes aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich formuliert; die sexuell-euphemistische hebräische Wendung wird im Haupttext eindeutig wiedergegeben und in der Fußnote wörtlich erläutert.
