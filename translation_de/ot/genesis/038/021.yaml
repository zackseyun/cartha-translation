base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: de
  text: 'Er fragte die Männer des Ortes: „Wo ist die Kultprostituierte[a], die bei Enajim[b] am Weg war?“ Sie antworteten: „Hier hat es keine Kultprostituierte gegeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tempelprostituierte“. Die genaue Bedeutung des hebräischen Begriffs ist umstritten; er steht wahrscheinlich mit kultischer Praxis in Zusammenhang. „Kultprostituierte“ setzt kein bestimmtes Tempelgebäude voraus.'
    reason: lexical_alternative
  - marker: b
    text: Enajim ist ein Ortsname. Die hebräische Namensform hängt mit dem Wort für „Augen“ und möglicherweise mit der Bezeichnung für „Quellen“ zusammen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Er fragte
  rationale: Die erzählende Wayyiqtol-Form von שׁאל wird im modernen Deutschen natürlich mit „Er fragte“ wiedergegeben.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: die Männer des Ortes
  rationale: Die Wendung bedeutet wörtlich „die Männer ihres Ortes“. Im Deutschen ist „des Ortes“ verständlich und vermeidet den missverständlichen Eindruck, es handle sich um den Herkunftsort der Frau.
- source_word: לֵאמֹר
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Redeintroduktor wird im Deutschen idiomatisch durch den Doppelpunkt ausgedrückt; ein zusätzliches „und sagte“ wäre schwerfällig.
- source_word: הַקְּדֵשָׁה
  choice: die Kultprostituierte
  rationale: קְדֵשָׁה bezeichnet hier eine Prostituierte mit kultischem Bezug und unterscheidet sich vom sonst in diesem Kapitel verwendeten זֹנָה. „Kultprostituierte“ behauptet kein bestimmtes Tempelgebäude.
- source_word: בָעֵינַיִם
  choice: bei Enajim
  rationale: Im Zusammenhang fungiert die Form als Ortsname (vgl. Gen 38,14). Die Umschrift bewahrt dies, statt den Namen als „Augen“ oder „Quellen“ zu übersetzen.
- source_word: עַל הַדָּרֶךְ
  choice: am Weg
  rationale: Die Präposition bezeichnet hier die Lage an oder neben dem Weg; „am Weg“ ist knapp und natürlich.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Hier hat es keine Kultprostituierte gegeben
  rationale: Die Formulierung gibt die örtliche Verneinung der Existenz beziehungsweise Anwesenheit wieder und bewahrt mit dem Perfekt die rückblickende Aussage der Ortsansässigen.
theological_decisions:
- issue: Kultischer Bezug von קְדֵשָׁה
  choice: Kultprostituierte
  alternative: Prostituierte; Tempelprostituierte
  rationale: Der besondere hebräische Ausdruck sollte gegenüber זֹנָה erkennbar bleiben. Zugleich wird mit „Kult-“ kein Tempelgebäude oder eine genauer bestimmte Institution vorausgesetzt.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der hebräische Redeintroduktor לֵאמֹר wird idiomatisch durch einen Doppelpunkt wiedergegeben. Beide Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Ausdrücken; damit wird zugleich die offenbar vertauschte Markerzuordnung der englischen Konsultationsschicht korrigiert.
