  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: de
  text: Und Juda nahm für Er, seinen Erstgeborenen, eine Frau; sie hieß Tamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet gewöhnlich „nehmen“. In der Verbindung „für jemanden eine Frau nehmen“ bezeichnet es hier, dass Juda Er eine Frau zur Ehe gab bzw. die Heirat veranlasste; die knappe Wiedergabe bewahrt die hebräische Ausdrucksweise.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Im Zusammenhang bezeichnet אִשָּׁה eine Ehefrau. Das deutsche „eine Frau nehmen“ hat hier eindeutig ehelichen Sinn und klingt natürlicher als „eine Ehefrau nehmen“.
- source_word: לְעֵר
  choice: für ... Er
  rationale: Die Präposition לְ kennzeichnet Er als denjenigen, für den Juda die Frau nahm.
- source_word: בְּכוֹרוֹ
  choice: seinen Erstgeborenen
  rationale: בְּכוֹר bezeichnet den erstgeborenen Sohn; „Erstgeborenen“ bewahrt die familiäre und mögliche erbrechtliche Nuance des hebräischen Ausdrucks.
- source_word: וּשְׁמָהּ
  choice: sie hieß
  rationale: Die idiomatische deutsche Namensformel gibt das hebräische „und ihr Name [war]“ knapp und natürlich wieder.
- source_word: תָּמָר
  choice: Tamar
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als „Tamar“ wiedergegeben.
