base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: de
  text: 'Während sie hinausgeführt wurde, schickte sie ihrem Schwiegervater eine Botschaft: »Von dem Mann, dem diese Dinge gehören, bin ich schwanger.« Dann sagte sie: »Stell bitte fest[a], wem dieses Siegel, diese Schnüre und dieser Stab gehören.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Erkenne bitte«. Das hebräische Verb kann sowohl das Wiedererkennen als auch das Feststellen der Identität bezeichnen; hier hat die Aufforderung die zugespitzte Kraft einer Beweisvorlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: während sie hinausgeführt wurde
  rationale: Das passive Partizip bezeichnet eine gerade ablaufende Handlung. „Während … wurde“ gibt diesen Verlauf und das gewaltsame Hinausführen im gerichtlichen Zusammenhang natürlich wieder.
- source_word: שָׁלְחָה אֶל חָמִיהָ לֵאמֹר
  choice: schickte sie ihrem Schwiegervater eine Botschaft
  rationale: שׁלח bedeutet „senden“; zusammen mit לֵאמֹר ist hier idiomatisch eine übermittelte Botschaft gemeint.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Von dem Mann, dem diese Dinge gehören, bin ich schwanger
  rationale: Die deutsche Formulierung bewahrt die hervorgehobene Voranstellung des Mannes und drückt die im Hebräischen gemeinte Vaterschaft klar und natürlich aus.
- source_word: הַכֶּר נָא
  choice: Stell bitte fest
  rationale: Der Imperativ von נכר fordert Juda auf, die Gegenstände zu erkennen bzw. ihren Besitzer zu bestimmen. „Stell bitte fest“ trifft hier die zugespitzte, beweisführende Funktion; die Alternative „Erkenne bitte“ wird in der Fußnote bewahrt.
- source_word: חֹתֶמֶת
  choice: Siegel
  rationale: Das Wort bezeichnet ein persönliches Siegel als Identifikationsgegenstand; ob es baulich ein Siegelring war, legt der hebräische Ausdruck nicht fest.
- source_word: פְּתִילִים
  choice: Schnüre
  rationale: Der Plural wird direkt wiedergegeben; wahrscheinlich handelt es sich um die zum Siegel gehörenden Schnüre.
- source_word: מַטֶּה
  choice: Stab
  rationale: „Stab“ ist die natürliche und sachlich offene Wiedergabe des im patriarchalischen Erzählkontext genannten persönlichen Gegenstands.
theological_decisions: []
