  text: וְ/אַחַר֙ יָצָ֣א אָחִ֔י/ו אֲשֶׁ֥ר עַל יָד֖/וֹ הַ/שָּׁנִ֑י וַ/יִּקְרָ֥א שְׁמ֖/וֹ זָֽרַח־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: de
  text: Danach kam sein Bruder heraus, an dessen Hand der scharlachrote Faden war[a], und man gab ihm den Namen Serach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „das Scharlachrote“ an seiner Hand; „Faden“ ist aus Vers 28 ergänzt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er rief seinen Namen Serach“. Wer den Namen gibt, wird im unmittelbaren Zusammenhang nicht eindeutig bezeichnet.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Die temporale Verbindung bezeichnet die unmittelbar folgende Handlung; „Danach“ ist im modernen Deutschen natürlich und präzise.
- source_word: יָצָא
  choice: kam … heraus
  rationale: Im Zusammenhang mit der Geburt gibt „herauskommen“ die gewöhnliche Bedeutung des Verbs idiomatisch wieder.
- source_word: אָחִיו
  choice: sein Bruder
  rationale: Direkte Wiedergabe des Verwandtschaftsbegriffs mit dem Suffix der 3. Person Singular maskulin.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: an dessen Hand der scharlachrote Faden war
  rationale: Der Relativsatz kennzeichnet den Bruder durch das in Vers 28 an seiner Hand befestigte Zeichen. „Faden“ wird aus dem unmittelbaren Kontext ergänzt.
- source_word: הַשָּׁנִי
  choice: der scharlachrote Faden
  rationale: Wörtlich steht hier substantiviert „das Scharlachrote“ beziehungsweise „der Scharlachstoff“; der in Vers 28 ausdrücklich genannte Faden ist hier elliptisch mitgemeint.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: und man gab ihm den Namen
  rationale: Die unbestimmte deutsche Form vermeidet es, einen im Kontext nicht eindeutig genannten männlichen Namensgeber einzuführen, und gibt die hebräische Namensgebungsformel natürlich wieder.
- source_word: זָרַח
  choice: Serach
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
