  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: de
  text: Als Juda sie sah, hielt er sie für eine Prostituierte, denn sie hatte ihr Gesicht bedeckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Als Juda sie sah
  rationale: ראה bedeutet „sehen“. Die Konstruktion mit „als“ gibt die zeitliche Abfolge der beiden Erzählverben im modernen Deutschen natürlich wieder.
- source_word: וַיַּחְשְׁבֶהָ לְזוֹנָה
  choice: hielt er sie für eine Prostituierte
  rationale: חשב mit לְ bezeichnet hier Judas Einschätzung ihrer Identität. „Jemanden für etwas halten“ ist die natürliche deutsche Entsprechung und bewahrt, dass es sich um seine Annahme handelt.
- source_word: זוֹנָה
  choice: Prostituierte
  rationale: Das Wort bezeichnet hier eine Frau, die Prostitution ausübt. „Prostituierte“ ist gegenwärtig, klar und weniger altertümlich als „Hure“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für Judas Einschätzung ein. „Denn“ verbindet die Aussage im Deutschen flüssig und eindeutig kausal.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: sie hatte ihr Gesicht bedeckt
  rationale: Das Perfekt bezeichnet den bereits bestehenden Umstand, der Judas Schlussfolgerung erklärt; das deutsche Plusquamperfekt bildet diesen zeitlichen Hintergrund passend ab.
