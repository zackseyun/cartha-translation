base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: de
  text: 'Etwa drei Monate später erhielt Juda die Nachricht: „Deine Schwiegertochter Tamar hat sich prostituiert[a], und sieh: Sie ist auch durch Prostitution schwanger[b].“ Da sagte Juda: „Führt sie hinaus! Sie soll verbrannt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat als Prostituierte gehandelt“; weiter gefasst kann der Ausdruck unerlaubtes sexuelles Verhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist infolge von Prostitution schwanger“ oder „ist durch prostitutive Handlungen schwanger“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Etwa drei Monate später
  rationale: Die Näherungsangabe mit כְּ wird durch „etwa“ wiedergegeben; „später“ stellt den natürlichen deutschen Erzählanschluss her, ohne das formelhafte וַיְהִי unnötig wörtlich abzubilden.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: wurde Juda berichtet
  rationale: Das Hophal von נגד bezeichnet eine an Juda gerichtete Mitteilung. Die passive Form und der berichtende Ton bleiben erhalten; לֵאמֹר wird durch den folgenden Doppelpunkt und die direkte Rede ausgedrückt.
- source_word: זָנְתָה
  choice: hat sich prostituiert
  rationale: Das Verb זנה verwendet ausdrücklich die Bild- und Begriffswelt der Prostitution. Die Formulierung ist in modernem Deutsch klar und gibt die gegen Tamar erhobene Anschuldigung wieder, ohne sie zu einer bloß allgemeinen Aussage über sexuelle Unmoral abzuschwächen.
- source_word: כַּלָּתֶךָ
  choice: deine Schwiegertochter
  rationale: Direkte und kontextgemäße Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: וְגַם הִנֵּה
  choice: und nun ist sie sogar
  rationale: „Sogar“ gibt die steigernde Kraft von וְגַם wieder; „nun“ vermittelt die hervorhebende, auf den überraschenden Sachverhalt lenkende Funktion von הִנֵּה in natürlichem Deutsch.
- source_word: הָרָה לִזְנוּנִים
  choice: durch Prostitution schwanger geworden
  rationale: הָרָה bezeichnet die Schwangerschaft; לִזְנוּנִים nennt die als Ursache behaupteten sexuellen Handlungen. „Durch Prostitution“ bewahrt die lexikalische Verbindung zu זָנְתָה.
- source_word: הוֹצִיאוּהָ
  choice: Führt sie hinaus!
  rationale: Der Pluralimperativ mit femininem Objektsuffix wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וְתִשָּׂרֵף
  choice: Sie soll verbrannt werden
  rationale: Die Form hat hier auffordernden beziehungsweise anordnenden Sinn. Die passive Wiedergabe erhält das Niphal und legt die ausführenden Personen nicht genauer fest.
theological_decisions:
- issue: Sexualterminologie in der gegen Tamar erhobenen Anschuldigung
  choice: Prostitutionssprache in beiden verwandten Ausdrücken beibehalten
  alternative: „sexuelle Unmoral begangen“ beziehungsweise „durch Unzucht schwanger geworden“
  rationale: זנה und זנונים gehören derselben Wortfamilie an und rufen ausdrücklich die Vorstellung von Prostitution hervor, auch wenn der Vorwurf im Kontext weiter gefasstes unerlaubtes Sexualverhalten einschließen kann. Die Übersetzung soll die Härte und lexikalische Struktur der Anschuldigung nicht glätten.
- issue: Tragweite von Judas Anordnung
  choice: „Führt sie hinaus! Sie soll verbrannt werden.“
  alternative: „Führt sie hinaus, damit sie verbrannt wird“ oder „Führt sie hinaus und verbrennt sie“
  rationale: Der hebräische Text formuliert eine unmittelbare Anordnung und verwendet für das Verb „verbrennen“ eine passive Form. Zwei kurze Sätze bewahren sowohl die Schärfe des Befehls als auch die unbestimmte Täterschaft.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und scharf. Das etwas formellere „hinausführen“ passt zur öffentlichen Vollstreckungsanordnung; archaische Wendungen wie „es begab sich“ und unnötig verhüllende Sexualterminologie werden vermieden.
