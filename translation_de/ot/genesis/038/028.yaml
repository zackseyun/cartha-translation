base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: de
  text: 'Als sie gebar, streckte einer eine Hand heraus.[a] Da nahm die Hebamme die Hand und band einen scharlachroten Faden darum. Sie sagte: »Dieser ist als Erster herausgekommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gab er eine Hand«; gemeint ist, dass die Hand eines der Kinder bei der Geburt herauskam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְלִדְתָּהּ
  choice: Als sie gebar
  rationale: Die Präposition בְּ mit dem Infinitiv und dem Suffix der 3. Person Singular feminin bezeichnet den zeitlichen Umstand. Die knappe Formulierung ist im Deutschen natürlich und beschreibt den Geburtsvorgang.
- source_word: וַיִּתֶּן יָד
  choice: streckte einer die Hand heraus
  rationale: Die Wendung bedeutet in diesem Geburtszusammenhang, dass die Hand eines der Zwillinge hervortrat. »Einer« gibt den maskulinen Singular des Verbs wieder, ohne vorschnell festzulegen, welcher Zwilling gemeint ist.
- source_word: הַמְיַלֶּדֶת
  choice: die Hebamme
  rationale: Das Partizip aus der Wurzel ילד bezeichnet die Frau, die bei der Geburt hilft; »Hebamme« ist die übliche und präzise deutsche Bezeichnung.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: band einen scharlachroten Faden um seine Hand
  rationale: שָׁנִי bezeichnet scharlachrotes Material. »Faden« ergänzt den im Deutschen erforderlichen konkreten Gegenstand; »um seine Hand« gibt die Funktion des Anbindens natürlich wieder.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Dieser ist zuerst herausgekommen
  rationale: Die Formulierung bezeichnet das Kind, das nach dem sichtbaren Hervortreten der Hand als erstes angesehen wurde. »Zuerst« bewahrt den zeitlichen Sinn, ohne den hier nicht ausdrücklich verwendeten Rechtsbegriff »Erstgeborener« einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die unbestimmte Identität des Kindes bleibt erhalten; der ungewöhnliche hebräische Ausdruck wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
