base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: de
  text: 'Da kehrte er zu Juda zurück und sagte: „Ich habe sie nicht gefunden; auch die Männer des Ortes sagten: ‚Es gab hier keine Kultprostituierte[a].‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch qedeschā, wörtlich „Geweihte“; traditionell auch „Tempelprostituierte“. Die genaue Bedeutung und der institutionelle Hintergrund des Begriffs sind umstritten; im Kontext wird er von der Bezeichnung für eine gewöhnliche Prostituierte unterschieden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Da kehrte er zurück
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitlich-folgernde Bewegung im Deutschen natürlich wieder.
- source_word: אֶל יְהוּדָה
  choice: zu Juda
  rationale: אֶל bezeichnet die Richtung auf eine Person hin; „Juda“ ist die übliche deutsche Namensform.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Natürliche deutsche Wiedergabe der hebräischen Redeeinleitung.
- source_word: לֹא מְצָאתִיהָ
  choice: Ich habe sie nicht gefunden
  rationale: Das negierte Perfekt berichtet das abgeschlossene Ergebnis der Suche; das deutsche Perfekt klingt in direkter Rede natürlich.
- source_word: וְגַם
  choice: Auch
  rationale: Bewahrt die hinzufügende Funktion und vermeidet die im Deutschen schwerfällige Verbindung „und auch“.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: die Männer des Ortes
  rationale: Entspricht der ausdrücklich maskulinen Pluralform und bezeichnet die örtlichen männlichen Bewohner.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Hier hat es keine … gegeben
  rationale: Gibt die lokale Existenzverneinung idiomatisch wieder; בָזֶה bedeutet in diesem Zusammenhang „hier/an diesem Ort“.
- source_word: קְדֵשָׁה
  choice: Kultprostituierte
  rationale: Der Ausdruck bezeichnet wörtlich eine „Geweihte“ und wird im Kontext von einer gewöhnlichen Prostituierten unterschieden. „Kultprostituierte“ bewahrt den kultischen Bezug, ohne zwingend eine feste Tempelinstitution vorauszusetzen.
theological_decisions:
- issue: Art und institutioneller Rahmen der mit קְדֵשָׁה bezeichneten Frau
  choice: Kultprostituierte
  alternative: Geweihte; Tempelprostituierte
  rationale: Die Übersetzung wahrt den im Kontext naheliegenden sexuellen und kultischen Bezug, legt sich aber nicht auf die historisch umstrittene Annahme einer institutionalisierten Tempelprostitution fest; die wörtlichere und die traditionellere Alternative werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist klar gegliedert; „Kultprostituierte“ macht den Unterschied zum sonst in der Erzählung verwendeten Wort für eine gewöhnliche Prostituierte sichtbar, während die Fußnote die lexikalische und historische Unsicherheit offenhält.
