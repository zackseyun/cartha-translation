  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: de
  text: Er, Judas erstgeborener Sohn, war böse in den Augen Jahwes, und Jahwe tötete ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »und Jahwe ließ ihn sterben«.'
    reason: Lexikalische Alternative für die kausative Verbform. Die Hauptfassung gibt die direkte göttliche Verursachung im heutigen Deutsch klarer wieder.
lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: Die narrative Verbform führt die Aussage über Er weiter. Im Deutschen genügt die Kopula »war«; ein zusätzliches »nun« oder »da« würde eine im Ausgangstext nicht ausdrücklich vorhandene Zeitangabe nahelegen.
- source_word: עֵר
  choice: Er
  rationale: Der Personenname wird in seiner etablierten deutschen Form transliteriert.
- source_word: בְּכוֹר יְהוּדָה
  choice: Judas Erstgeborener
  rationale: Die Status-constructus-Verbindung bezeichnet Er als den erstgeborenen Sohn Judas. Diese Formulierung ist knapp, natürlich und bewahrt die familiäre Zuordnung.
- source_word: רַע
  choice: böse
  rationale: Das Wort bezeichnet hier angesichts des göttlichen Urteils moralische Bosheit, nicht bloß etwas Schlechtes oder Ungünstiges.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und kennzeichnet Jahwes Beurteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיְמִתֵהוּ
  choice: brachte ihn zu Tode
  rationale: Der Hifil von מות drückt aus, dass Jahwe Er sterben ließ beziehungsweise seinen Tod bewirkte. »Brachte ihn zu Tode« wahrt die ausdrückliche göttliche Verursachung und besitzt den angemessenen feierlichen Ernst.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Göttliche Verursachung von Ers Tod
  choice: Jahwe brachte ihn zu Tode
  alternative: Jahwe ließ ihn sterben
  rationale: Der hebräische Kausativ schreibt Ers Tod ausdrücklich Jahwe zu. Die Übersetzung bewahrt diese direkte Verantwortungszuschreibung, ohne die Art und Weise oder weitere Gründe zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und das hebräische Bild »in den Augen« bleiben erhalten; unnötige erzählerische Zusätze werden vermieden.
