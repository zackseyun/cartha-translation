  terminology: „Juda“ entspricht der etablierten deutschen biblischen Namensform. „Zum Gespött werden“ gibt לָבוּז idiomatisch wieder. „Pfandstücke“ ist im Kontext der zuvor übergebenen Gegenstände genauer als das unspezifische „Sachen“.
