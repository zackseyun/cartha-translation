  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: de
  text: 'Und Juda sagte: »Sie soll die Pfandstücke behalten, damit wir nicht zum Gespött werden.[a] Sieh, ich habe dieses Ziegenjunges geschickt, aber du hast sie nicht gefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir nicht der Verachtung preisgegeben werden“ beziehungsweise „damit man uns nicht verspottet“. Der hebräische Ausdruck bezeichnet, dass jemand zum Gegenstand von Verachtung oder Spott wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Sie soll die Sachen behalten
  rationale: Die Verbform kann hier auffordernd beziehungsweise zugestehend verstanden werden. Gemeint sind die zuvor als Pfand übergebenen Gegenstände; „die Sachen“ macht diesen im Hebräischen unausgesprochenen Bezug im Deutschen natürlich verständlich.
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: damit wir nicht zum Gespött werden
  rationale: בּוּז bezeichnet Verachtung, Hohn oder Spott. „Zum Gespött werden“ gibt die befürchtete öffentliche Erniedrigung prägnant und idiomatisch wieder.
- source_word: הִנֵּה
  choice: Schließlich
  rationale: Die Partikel lenkt nachdrücklich auf Judas folgenden Hinweis. Im deutschen Zusammenhang bringt „Schließlich“ zugleich den begründenden und hervorhebenden Charakter natürlich zum Ausdruck.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: ich habe dieses Ziegenböckchen geschickt
  rationale: גְּדִי bezeichnet ein Ziegenjunges. „Ziegenböckchen“ ist klar und bewahrt den Demonstrativbezug von הַזֶּה.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: aber du hast sie nicht gefunden
  rationale: Das Waw stellt hier einen sachlichen Gegensatz her; das feminine Suffix verweist auf die gesuchte Frau.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Name wird nach der etablierten deutschen Bibeltradition wiedergegeben.
