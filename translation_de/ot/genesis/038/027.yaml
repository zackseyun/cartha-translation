  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: de
  text: Als die Zeit kam, dass sie gebären sollte, siehe, waren Zwillinge in ihrem Mutterleib.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Als ... kam
  rationale: Die narrative Verbform führt das nächste Ereignis ein; zusammen mit der Zeitangabe ergibt sich im Deutschen ein natürlicher temporaler Nebensatz.
- source_word: בְּעֵת לִדְתָּהּ
  choice: für sie die Zeit zum Gebären
  rationale: Die Präposition, das Substantiv עֵת und der Infinitiv von ילד mit femininem Suffix bezeichnen den Zeitpunkt ihrer Entbindung. Die Formulierung ist quellennah und in modernem Deutsch verständlich.
- source_word: וְהִנֵּה
  choice: da
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf den überraschenden Befund. In dieser Satzfügung vermittelt „da“ den feststellenden und hervorhebenden Erzählton natürlicher als das heute auffällige „siehe“.
- source_word: תְאוֹמִים
  choice: Zwillinge
  rationale: Das hebräische Substantiv bezeichnet unmittelbar ein Zwillingspaar.
- source_word: בְּבִטְנָהּ
  choice: in ihrem Mutterleib
  rationale: בֶּטֶן kann Bauch oder Mutterleib bedeuten; im Zusammenhang der Geburt ist „Mutterleib“ präzise und würdevoll.
theological_decisions: []
translation_notes:
