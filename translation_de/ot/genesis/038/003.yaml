  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: de
  text: Sie wurde schwanger und gebar einen Sohn, und er gab ihm den Namen Er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden bzw. Empfangen. „Sie wurde schwanger“ ist im heutigen Standarddeutsch natürlich und eindeutig.
- source_word: וַתֵּלֶד
  choice: und gebar
  rationale: ילד im Qal bedeutet hier „gebären“. Die knappe Erzählform „gebar“ bewahrt die Abfolge des hebräischen Textes und hat einen würdigen biblischen Erzählton.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בן bezeichnet hier das männliche Kind in seiner familiären Beziehung; „Sohn“ ist die übliche und genaue Wiedergabe.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: und er gab ihm den Namen
  rationale: Die hebräische Wendung lautet wörtlich „und er rief seinen Namen“. Die deutsche Formulierung „gab ihm den Namen“ ist natürlich, erhält aber durch „er“ ausdrücklich den Wechsel zum maskulinen Subjekt.
- source_word: עֵר
  choice: Er
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form „Er“ wiedergegeben.
theological_decisions:
- issue: Subjekt von וַיִּקְרָא („und er nannte/gab den Namen“)
  choice: Das maskuline Subjekt wird ausdrücklich mit „er“ wiedergegeben; im Zusammenhang ist damit am ehesten Juda gemeint.
  alternative: Manche Übersetzungen ändern zu „sie nannte ihn Er“ oder vermeiden die Angabe des Subjekts mit „er wurde Er genannt“.
  rationale: Die vorangehenden Verben sind feminin Singular, וַיִּקְרָא dagegen eindeutig maskulin Singular. Der grammatische Wechsel des Ausgangstextes soll nicht geglättet werden. Da Juda als Bezugsperson aus dem Kontext hinreichend erkennbar ist, ist keine Fußnote nötig.
translation_notes:
  register: Modernes, natürliches Standarddeutsch mit knappem, würdigem Erzählstil. „Gebar“ ist gehoben, aber allgemein verständlich; „gab ihm den Namen“ vermeidet die im Deutschen unnatürliche wörtliche Form „rief seinen Namen“, ohne den Wechsel zum männlichen Subjekt zu verlieren.
