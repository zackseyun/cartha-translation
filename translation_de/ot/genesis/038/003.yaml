  terminology: „Sohn“ und der etablierte Personenname „Er“ sind zutreffend. Die Formulierung „gab ihm den Namen“ ist eine natürliche deutsche Entsprechung der hebräischen Namensgebungsformel. Das Pronomen „er“ bewahrt die maskuline Grammatik und vermeidet eine unnötige Festlegung auf „Juda“ im eigentlichen Übersetzungstext.
