  text: וַ/יֻּגַּ֥ד לְ/תָמָ֖ר לֵ/אמֹ֑ר הִנֵּ֥ה חָמִ֛י/ךְ עֹלֶ֥ה תִמְנָ֖תָ/ה לָ/גֹ֥ז צֹאנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: de
  text: 'Und Tamar wurde gesagt: „Sieh, dein Schwiegervater zieht nach Timna hinauf, um seine Schafe zu scheren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: Und Tamar wurde berichtet
  rationale: Das Hofal bezeichnet eine passive Mitteilung; die deutsche unpersönliche Passivkonstruktion bewahrt den nicht genannten Überbringer und gibt Tamar als Empfängerin wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt und direkte Rede
  rationale: Die übliche hebräische Redeeinleitung wird im natürlichen Deutschen durch den Doppelpunkt und die folgende direkte Rede ausgedrückt; ein zusätzliches „indem man sagte“ wäre schwerfällig.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf wird mit dem gegenwärtigen, würdevollen „Sieh“ wiedergegeben, ohne das archaischere „Siehe“ zu verlangen.
- source_word: חָמִיךְ
  choice: dein Schwiegervater
  rationale: Das Verwandtschaftsverhältnis und das feminine Singularsuffix für die Anrede Tamars werden ausdrücklich beibehalten.
- source_word: עֹלֶה
  choice: zieht … hinauf
  rationale: Das Partizip bezeichnet eine bevorstehende oder bereits im Gang befindliche Bewegung; „hinaufziehen“ bewahrt die Richtungsbedeutung von עלה.
- source_word: תִמְנָתָה
  choice: nach Timna
  rationale: Der Ortsname mit Richtungsendung bezeichnet das Ziel der Bewegung und wird idiomatisch mit „nach“ wiedergegeben.
- source_word: לָגֹז
  choice: um … zu scheren
  rationale: Der Infinitiv mit ל drückt hier den Zweck der Reise aus.
- source_word: צֹאנוֹ
  choice: seine Schafe
  rationale: צאן kann Kleinvieh oder Herde bedeuten; im Zusammenhang des Scherens ist „Schafe“ die natürliche spezifische Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller Erzählweise. Die hebräische Redeeinleitungsformel wird nicht wörtlich verdoppelt, sondern idiomatisch durch Zeichensetzung wiedergegeben. Keine konfessionellen Zusätze.
