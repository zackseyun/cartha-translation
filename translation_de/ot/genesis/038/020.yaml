base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: de
  text: Dann schickte Juda das Zicklein durch seinen Freund, den Adullamiter,[a] um das Pfand aus der Hand der Frau zurückzuholen;[b] doch er fand sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand seines Freundes, des Adullamiters“. Gemeint ist, dass Juda ihn damit beauftragte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um die Sicherheit aus dem Besitz der Frau zurückzuholen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann schickte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: גְּדִי הָעִזִּים
  choice: das Ziegenböckchen
  rationale: Die Wendung bezeichnet ein junges Tier der Ziegen; „Ziegenböckchen“ ist präzise und knüpft an das zuvor versprochene Tier an.
- source_word: בְּיַד
  choice: durch
  rationale: Die wörtliche Wendung „durch die Hand“ bezeichnet hier die Vermittlung beziehungsweise Beauftragung einer Person; „durch“ ist im Deutschen idiomatisch.
- source_word: רֵעֵהוּ
  choice: seinen Freund
  rationale: Das Substantiv bezeichnet einen Freund, Gefährten oder Vertrauten; „Freund“ ist im Erzählzusammenhang natürlich und angemessen.
- source_word: הָעֲדֻלָּמִי
  choice: den Adullamiter
  rationale: Die Herkunftsbezeichnung wird mit der üblichen deutschen Form wiedergegeben.
- source_word: לָקַחַת
  choice: zurückzuholen
  rationale: Der Infinitiv bezeichnet den Zweck der Sendung; aus dem Kontext geht hervor, dass Juda das zuvor überlassene Pfand wiedererlangen will.
- source_word: הָעֵרָבוֹן
  choice: das Pfand
  rationale: Das Wort bezeichnet einen als Sicherheit hinterlegten Gegenstand; „Pfand“ ist knapp, geläufig und kontextgerecht.
- source_word: מִיַּד הָאִשָּׁה
  choice: aus der Hand der Frau
  rationale: Die konkrete hebräische Formulierung bleibt verständlich und bewahrt den Gedanken, dass sich das Pfand in ihrem Besitz befindet.
- source_word: וְלֹא מְצָאָהּ
  choice: doch er fand sie nicht
  rationale: „Doch“ macht den Gegensatz zwischen Auftrag und erfolglosem Ausgang natürlich deutlich, ohne den Inhalt zu erweitern.
