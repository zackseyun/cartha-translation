  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: de
  text: Nach langer Zeit[a] starb Judas Frau, die Tochter Schuas[b]. Nachdem Juda getröstet worden war[c], zog er mit seinem Freund Hira, dem Adullamiter, hinauf nach Timna zu den Schafscherern seiner Herde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Als die Tage zahlreich geworden waren.«'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »die Tochter Schuas«; der Ausdruck wird mitunter als Eigenname »Bat-Schua« verstanden.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: »Da wurde Juda getröstet« oder »Als Juda getröstet worden war«. Gemeint ist Trost nach der Trauerzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Nach langer Zeit
  rationale: Die Wendung bedeutet wörtlich, dass »die Tage zahlreich wurden«. »Nach langer Zeit« gibt den zeitlichen Sinn in natürlichem Deutsch wieder; die wörtlichere Nuance wird in der Fußnote bewahrt.
- source_word: וַתָּמָת
  choice: starb
  rationale: Im erzählenden Zusammenhang die übliche Wiedergabe von מות.
- source_word: בַּת שׁוּעַ
  choice: die Tochter Schuas
  rationale: Der hebräische Ausdruck ist unmittelbar als Verwandtschaftsbezeichnung verständlich und muss hier nicht als Eigenname »Bat-Schua« aufgefasst werden.
- source_word: אֵשֶׁת יְהוּדָה
  choice: Judas Frau
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Nachdem Juda getröstet worden war
  rationale: Der Nifal von נחם bezeichnet hier Trost nach einem Todesfall, nicht Reue. Die temporale Unterordnung stellt den erzählerischen Zusammenhang natürlich dar und erhält den passiven Sinn.
- source_word: וַיַּעַל
  choice: zog ... hinauf
  rationale: Bewahrt die Richtungsnuance von עלה und klingt im Zusammenhang einer Reise würdig und natürlich.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: zu den Schafscherern seiner Herde
  rationale: Die Präposition mit dem Partizip weist auf die Personen hin, die Judas Schafe schoren; die Formulierung vermeidet die interpretierende Verschiebung zu »um seine Schafe zu scheren«.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: mit seinem Freund Hira
  rationale: Gibt die Begleitung idiomatisch wieder; רֵעַ hat hier den naheliegenden Sinn »Freund«.
- source_word: הָעֲדֻלָּמִי
  choice: dem Adullamiter
  rationale: Die Herkunftsbezeichnung wird als deutsches Gentiliz wiedergegeben.
- source_word: תִּמְנָתָה
  choice: nach Timna
  rationale: Das direktionale He bezeichnet die Bewegung auf Timna zu, im Deutschen natürlich mit »nach« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namensformen »Juda«, »Hira« und »Timna« folgen gebräuchlicher deutscher Bibeltradition. Die Satzstellung macht eindeutig, dass »die Tochter Schuas« Judas verstorbene Frau bezeichnet, und bewahrt zugleich die hebräischen Mehrdeutigkeiten in den Fußnoten.
