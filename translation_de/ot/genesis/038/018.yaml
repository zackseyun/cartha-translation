  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Ausdrücke des Hebräischen zutreffend wieder: Pfand, Siegel, Schnur, Stab, die euphemistische Wendung für Geschlechtsverkehr und die durch Juda verursachte Schwangerschaft. Die Wiedergabe von וַיִּתֶּן לָּהּ mit „gab er ihr alles“ fügt jedoch eine pauschalisierende Quantifizierung hinzu, die im Deutschen weniger präzise auf die drei zuvor genannten Gegenstände verweist.'
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. „Er gab sie ihr“ ist hier die natürlichere und genauere pronominale Aufnahme der drei ausdrücklich erbetenen Gegenstände als „er gab ihr alles“.
  terminology: „Pfand“, „Siegel“, „Schnur“ und „Stab“ sind angemessen und vermeiden Überinterpretationen wie „Siegelring“. „Zu ihr eingehen“ bewahrt den registergerechten hebräischen Euphemismus. „Wurde von ihm schwanger“ ist idiomatisch und gibt לוֹ sachgerecht wieder.
