base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: de
  text: 'Er sagte: »Was soll ich dir als Pfand geben?« Sie antwortete: »Dein Siegel, deine Schnur und deinen Stab, den du in der Hand hast.« Da gab er sie ihr, ging zu ihr ein[a], und sie wurde von ihm schwanger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Zu ihr eingehen« ist eine hebräische Umschreibung für Geschlechtsverkehr.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: Pfand
  rationale: Bezeichnet einen Gegenstand, der bis zur späteren Zahlung als Sicherheit übergeben wird; »Pfand« ist im Deutschen präzise und im Erzählzusammenhang natürlich.
- source_word: חֹתָמְךָ
  choice: dein Siegel
  rationale: Das Wort bezeichnet ein Siegel beziehungsweise einen Siegelgegenstand zur Beglaubigung, ohne dessen Form als Ring festzulegen.
- source_word: וּפְתִילֶךָ
  choice: deine Schnur
  rationale: Gemeint ist wahrscheinlich die zum Siegel gehörende Schnur; die schlichte Wiedergabe vermeidet eine im Text nicht ausdrücklich vorgenommene Deutung.
- source_word: וּמַטְּךָ
  choice: deinen Stab
  rationale: »Stab« entspricht dem üblichen Bedeutungsumfang und passt zu dem persönlichen Gegenstand in Judas Hand.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: den du in der Hand hast
  rationale: Die Relativkonstruktion bezieht sich am natürlichsten auf den unmittelbar vorausgehenden Stab und bewahrt das konkrete Bild.
- source_word: וַיִּתֶּן לָּהּ
  choice: Da gab er ihr alles
  rationale: Das hebräische Objekt bleibt unausgesprochen; »alles« nimmt im Deutschen knapp und eindeutig die drei verlangten Gegenstände auf.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ging zu ihr ein
  rationale: Bewahrt den hebräischen Euphemismus für den Geschlechtsverkehr in einer würdigen, bibelsprachlich verständlichen Form.
- source_word: וַתַּהַר לוֹ
  choice: sie wurde von ihm schwanger
  rationale: Gibt sowohl das Eintreten der Schwangerschaft als auch die durch לוֹ bezeichnete Vaterschaft in natürlichem modernem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählweise. Der sexuelle Vorgang bleibt wie im Hebräischen euphemistisch formuliert; das Siegel wird nicht als Siegelring überspezifiziert.
