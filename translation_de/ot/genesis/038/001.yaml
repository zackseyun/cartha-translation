  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: de
  text: Zu jener Zeit ging Juda von seinen Brüdern hinab und wandte sich einem Mann aus Adullam zu, der Hira hieß.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und es geschah zu jener Zeit.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einem Adullamiter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Zu jener Zeit
  rationale: Die hebräische Erzählformel eröffnet einen neuen Abschnitt. Die deutsche Wiedergabe bewahrt die zeitliche Einordnung, ohne den Diskursmarker unnötig wörtlich abzubilden.
- source_word: וַיֵּרֶד ... מֵאֵת אֶחָיו
  choice: trennte sich ... von seinen Brüdern
  rationale: Das Verb bezeichnet wörtlich ein Hinabgehen; zusammen mit der Trennungsangabe steht hier jedoch Judas Weggang von seinen Brüdern im Vordergrund. Die Fußnote bewahrt die räumlich-direktionale Lesart.
- source_word: וַיֵּט עַד
  choice: begab sich zu
  rationale: נטה bezeichnet hier eine Hinwendung beziehungsweise ein Abbiegen zu einer Person. „Begab sich zu“ ist im modernen Deutschen natürlich und wahrt die Bewegung auf den Mann zu.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: einem Mann aus Adullam
  rationale: Die Wendung kennzeichnet den Mann nach seiner Herkunft. Diese Form ist verständlicher und natürlicher als das seltene deutsche Herkunftswort „Adullamiter“.
- source_word: וּשְׁמוֹ חִירָה
  choice: namens Hira
  rationale: Die knappe deutsche Namensformel gibt die hebräische Identifikation „und sein Name war Hira“ flüssig und vollständig wieder.
- source_word: חִירָה
  choice: Hira
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
