lexical_decisions:
- source_word: וַתַּהַר
  choice: sie wurde schwanger
  rationale: Das Verb הרה bezeichnet hier das Schwangerwerden. Die moderne deutsche Wendung ist natürlich und gibt den Vorgang klar wieder.
- source_word: עוֹד
  choice: wieder
  rationale: Im Zusammenhang der aufeinanderfolgenden Geburten bezeichnet עוֹד eine Wiederholung.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: Die knappe, gehobene Formulierung entspricht dem hebräischen Erzählstil und ist im modernen Standarddeutsch weiterhin verständlich.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: sie gab ihm den Namen
  rationale: Dies gibt die hebräische Namensgebungsformel idiomatisch und präzise auf Deutsch wieder; die feminine Verbform hält ausdrücklich fest, dass die Mutter den Namen gab.
- source_word: אוֹנָן
  choice: Onan
  rationale: Der Personenname wird nach der im Deutschen etablierten Form wiedergegeben.
