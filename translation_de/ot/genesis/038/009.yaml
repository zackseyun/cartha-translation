  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: de
  text: Doch Onan wusste, dass die Nachkommenschaft nicht ihm gehören würde[a]. Wann immer er mit der Frau seines Bruders schlief, verschüttete er seinen Samen auf den Boden[b], um seinem Bruder keine Nachkommenschaft zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Samen“; im Zusammenhang der Schwagerehe ist damit die Nachkommenschaft beziehungsweise ein Erbe gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Er verdarb/zerstörte [es] zur Erde.“ Das Hebräische nennt das Objekt nicht ausdrücklich; der Zusammenhang beschreibt Onans Handlung, durch die er eine Empfängnis verhinderte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: wusste
  rationale: Die übliche und direkte Wiedergabe von ידע im erzählenden Zusammenhang.
- source_word: הַזָּרַע
  choice: die Nachkommenschaft
  rationale: זֶרַע bedeutet wörtlich „Samen“, bezeichnet hier im Zusammenhang der Schwagerehe aber die rechtlich dem verstorbenen Bruder zugerechnete Nachkommenschaft.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: die Nachkommenschaft würde nicht ihm gehören
  rationale: Bewahrt die Aussage des Hebräischen, ohne über den Text hinaus ausdrücklich zu formulieren, wem ein Kind rechtlich zugerechnet würde.
- source_word: וְהָיָה אִם־בָּא
  choice: sooft er … schlief
  rationale: Die Konstruktion beschreibt hier ein wiederholtes Verhalten; „sooft“ macht diesen iterativen Sinn im Deutschen klar.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: mit der Frau seines Bruders schlief
  rationale: Natürliches, gegenwärtiges und zugleich zurückhaltendes Deutsch für den hebräischen Geschlechtsverkehrseuphemismus „zu jemandem eingehen“.
- source_word: וְשִׁחֵת אַרְצָה
  choice: ließ er seinen Samen auf dem Boden verderben
  rationale: שׁחת bedeutet „verderben, zugrunde richten“. Das im Hebräischen unausgesprochene Objekt wird zur Verständlichkeit aus dem Vorgang erschlossen, während „verderben“ die Wortbedeutung des Verbs wahrt.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: um seinem Bruder keine Nachkommenschaft zu geben
  rationale: Gibt den finalen Zweck und den rechtlich-familiären Sinn von זֶרַע wieder.
theological_decisions:
- issue: Bedeutung von זֶרַע und Art von Onans Handlung
  choice: In den rechtlichen Aussagen steht „Nachkommenschaft“, während bei der körperlichen Handlung „Samen“ als das implizite Objekt verdeutlicht wird.
  alternative: „Samen“ durchgehend verwenden oder die körperliche Handlung noch ausdrücklicher als Samenerguss bezeichnen.
  rationale: Der Vers verbindet die dem Bruder zustehende Nachkommenschaft mit Onans konkreter Verhinderung einer Empfängnis. Die differenzierte Wiedergabe macht beide Ebenen verständlich, ohne aus dem Vers eine weitergehende moraltheologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mit jemandem schlafen“ ersetzt den im heutigen Deutsch altertümlich wirkenden Ausdruck „zu jemandem eingehen“, bleibt dabei aber zurückhaltend. Die Wiederholung von „Nachkommenschaft“ spiegelt die begriffliche Verbindung der beiden rechtlichen Aussagen.
