base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: de
  text: 'Als er seine Hand zurückzog, kam sein Bruder heraus. Sie sagte: »Was für einen Durchbruch hast du dir gebahnt!«[a] Da gab man ihm den Namen Perez.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Was für einen Durchbruch hast du dir gemacht!« Im Hebräischen stehen Verb und Substantiv derselben Wortwurzel; auch der Name Perez ist davon abgeleitet.'
    reason: lexical_wordplay
  - marker: b
    text: Perez bedeutet etwa »Durchbruch« oder »Bresche«.
    reason: name_meaning
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: als er seine Hand zurückzog
  rationale: Das Hifil-Partizip von שוב bezeichnet hier im Zusammenhang mit יָד das Zurückziehen der Hand. Die konkrete Handlung bleibt in natürlichem Deutsch erhalten.
- source_word: וְהִנֵּה יָצָא אָחִיו
  choice: da kam sein Bruder heraus
  rationale: הִנֵּה hebt das überraschende Geschehen anschaulich hervor; das deutsche »da« erfüllt diese erzählerische Funktion, ohne altertümlich zu wirken. יָצָא wird im Geburtszusammenhang natürlich mit »herauskommen« wiedergegeben.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Was hast du dir einen Durchbruch gebahnt!
  rationale: Die Ausrufform und das Wortspiel mit der Wurzel פרץ bleiben durch »Durchbruch« und »gebahnt« soweit wie idiomatisch möglich erhalten. Das reflexive »dir« gibt עָלֶיךָ wieder, dessen genaue Nuance an dieser Stelle schwierig ist.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben. Eine Fußnote erläutert seinen Bezug zum vorangehenden Wortspiel.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: Da gab man ihm den Namen Perez
  rationale: Diese natürliche deutsche Namensformel lässt den im hebräischen Text nicht ausdrücklich genannten Namensgeber unbestimmt.
