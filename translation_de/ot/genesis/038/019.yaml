base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: de
  text: Dann stand sie auf und ging fort. Sie nahm ihren Schleier ab und zog ihre Witwenkleider an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: stand sie auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählhandlung fort; „stand auf“ ist im modernen Deutschen natürlich und wahrt die Bewegungsabfolge.
- source_word: וַתֵּלֶךְ
  choice: ging fort
  rationale: הלך bezeichnet hier nach dem Aufstehen das Verlassen des Ortes; „ging fort“ gibt diesen Zusammenhang knapp und eindeutig wieder.
- source_word: וַתָּסַר ... מֵעָלֶיהָ
  choice: nahm ... ab
  rationale: Die Hifil-Form von סור zusammen mit מֵעָלֶיהָ bezeichnet das Entfernen des Schleiers von ihrem Körper. Das deutsche Verb „abnehmen“ enthält diese räumliche Bedeutung bereits idiomatisch.
- source_word: צְעִיפָהּ
  choice: ihren Schleier
  rationale: צָעִיף bezeichnet hier die Kopf- oder Gesichtsverhüllung, die Tamar im unmittelbaren Kontext als Verkleidung trägt.
- source_word: וַתִּלְבַּשׁ
  choice: zog ... an
  rationale: לבש bedeutet, sich zu kleiden oder ein Kleidungsstück anzuziehen; „anziehen“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: ihre Witwenkleider
  rationale: Die Konstruktverbindung bezeichnet die Kleidung, die ihren Witwenstand kennzeichnet. „Witwenkleider“ ist würdig, verständlich und knapper als das schwerfällige „Kleider ihrer Witwenschaft“.
theological_decisions: []
