    issue: „ließ er auch ihn sterben“ ist im Deutschen semantisch mehrdeutig.
    rationale: Die Formulierung kann bedeuten, dass Jahwe Onans Tod lediglich zuließ. וַיָּמֶת steht hier jedoch im Hifil und bezeichnet, dass Jahwe seinen Tod verursachte. „tötete“ gibt diese Aussage ohne Festlegung auf eine konkrete Todesweise ausreichend direkt wieder.
  - severity: low
    issue: Das Subjekt im zweiten Satz sollte ausdrücklich genannt werden.
    rationale: Der hebräische Text nennt יהוה als Subjekt von וַיָּמֶת. Die Wiederholung von „Jahwe“ macht die Zuschreibung klar und vermeidet eine unnötige Pronomenunklarheit.
