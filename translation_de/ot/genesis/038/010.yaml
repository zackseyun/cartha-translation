  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: de
  text: Was er getan hatte, war böse in den Augen Jahwes. Deshalb tötete Jahwe auch ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: war böse
  rationale: Die stative Verwendung von רעע bewertet die Tat moralisch als böse; diese Wiedergabe vermeidet die Abschwächung zu bloßem Missfallen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher für Jahwes Urteil lässt sich im Deutschen natürlich und formnah bewahren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; die im Deutschen übliche Form lautet „Jahwe“.
- source_word: אֲשֶׁר עָשָׂה
  choice: Was er getan hatte
  rationale: Die Relativkonstruktion bezeichnet Onans unmittelbar zuvor geschilderte Tat. Das Plusquamperfekt stellt den zeitlichen Rückbezug im Deutschen klar heraus.
- source_word: וַיָּמֶת
  choice: ließ er … sterben
  rationale: Der Hifil von מות ist kausativ und schreibt Jahwe die Herbeiführung des Todes zu. „ließ … sterben“ wahrt die Kausativität, ohne über die im Verb nicht näher bezeichnete Art der Tötung hinauszugehen.
- source_word: גַּם אֹתוֹ
  choice: auch ihn
  rationale: „Auch“ verbindet Onans Tod ausdrücklich mit dem zuvor berichteten Tod seines Bruders Er.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Verursachung des Todes in וַיָּמֶת
  choice: Deshalb ließ er auch ihn sterben
  alternative: Da tötete er auch ihn
  rationale: Die gewählte Formulierung gibt die kausative Verbform und Jahwes unmittelbare Verantwortung wieder, legt die konkrete Todesweise jedoch nicht fest. „Deshalb“ macht den im Satz liegenden Zusammenhang zwischen göttlicher Bewertung und Gericht idiomatisch deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildrede „in den Augen“ bleibt erhalten; unnötige Archaismen und eine über den Ausgangstext hinausgehende Benennung der Todesart werden vermieden.
