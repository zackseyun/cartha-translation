source:
  edition: WLC
  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: de
  text: Dort sah Juda die Tochter eines kanaanitischen Mannes, der Schua hieß.[a] Er nahm sie und ging zu ihr ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen heißt es wörtlich: »und sein Name war Schua«. Gemeint ist der kanaanitische Mann, nicht seine Tochter.'
    reason: lexical_alternative
  - marker: b
    text: »Zu ihr eingehen« ist eine hebräische Umschreibung für Geschlechtsverkehr.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das gewöhnliche deutsche Äquivalent von ראה in der fortlaufenden Erzählung; „begegnete“ oder „lernte kennen“ würde mehr aussagen als der hebräische Text.
- source_word: שָׁם
  choice: dort
  rationale: Natürliche und knappe Wiedergabe des Ortsadverbs.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: die Tochter eines kanaanitischen Mannes
  rationale: Gibt die hebräische Genitivverbindung ausdrücklich wieder und lässt den Mann als Kanaaniter erkennen.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: der Schua hieß
  rationale: Das maskuline Suffix in שְׁמוֹ bezieht den Namen auf den kanaanitischen Mann, nicht auf seine Tochter.
- source_word: וַיִּקָּחֶהָ
  choice: Er nahm sie
  rationale: Bewahrt die knappe Formulierung des hebräischen Verbs. Der Zusammenhang kann eine eheliche Verbindung nahelegen, doch „heiratete sie“ wäre expliziter als der Wortlaut.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ging zu ihr ein
  rationale: Bewahrt die hebräische Wendung für Geschlechtsverkehr in einer im Deutschen bibelsprachlich verständlichen Form; die Fußnote erklärt den Sinn.
theological_decisions: []
