base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: de
  text: 'Da sagte Juda zu Onan: »Geh zu der Frau deines Bruders, erfülle ihr gegenüber deine Schwagerpflicht[a] und verschaffe deinem Bruder Nachkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist die Pflicht eines Mannes gegenüber der kinderlosen Witwe seines verstorbenen Bruders, für diesen Nachkommen zu zeugen; fachsprachlich: Leviratspflicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter. »Da sagte« gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: בֹּא אֶל
  choice: Geh zu
  rationale: Die Wendung bezeichnet hier Geschlechtsverkehr im Rahmen der Schwagerehe. »Geh zu« bewahrt den verhüllenden hebräischen Ausdruck und bleibt im Kontext verständlich.
- source_word: אֵשֶׁת אָחִיךָ
  choice: der Frau deines Bruders
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung; nach »zu« steht der Dativ.
- source_word: וְיַבֵּם אֹתָהּ
  choice: erfülle an ihr deine Schwagerpflicht
  rationale: Das Verb bezeichnet technisch die Pflicht des Schwagers gegenüber der Witwe seines verstorbenen Bruders. Die Formulierung ist knapp, verständlich und lässt die Fußnote den Rechtsbrauch erläutern.
- source_word: וְהָקֵם
  choice: verschaffe
  rationale: Mit זֶרַע bezeichnet das Verb das Hervorbringen beziehungsweise Sichern von Nachkommenschaft für den verstorbenen Bruder. »Verschaffe« gibt dieses Ziel im Deutschen idiomatisch wieder.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Der kollektive Singular זֶרַע meint hier Nachkommenschaft zur Fortführung der Linie; »Nachkommen« ist modern und klarer als das wörtliche »Samen«.
- source_word: לְאָחִיךָ
  choice: deinem Bruder
  rationale: 'Die Präposition לְ bezeichnet hier die Zuordnung beziehungsweise den Nutzen: Die Nachkommenschaft soll dem verstorbenen Bruder zugerechnet werden.'
theological_decisions:
- issue: Wiedergabe der Schwagerehe ohne spätere rechtliche oder konfessionelle Ausgestaltung
  choice: erfülle an ihr deine Schwagerpflicht
  alternative: nimm sie in Schwagerehe / übe an ihr die Leviratspflicht aus
  rationale: Das hebräische יִבֵּם ist ein technischer Ausdruck für die familiäre Pflicht gegenüber der kinderlosen Witwe eines Bruders. »Schwagerpflicht« erhält den rechtlich-familiären Sinn, ohne ihn nur auf Heirat oder Geschlechtsverkehr zu verengen; die Fußnote erklärt den Begriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verhüllende sexuelle Wendung des Hebräischen bleibt als »Geh zu« erhalten; der technische Familienrechtsbegriff wird im Haupttext zugänglich formuliert und in der Fußnote erläutert.
