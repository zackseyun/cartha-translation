  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: de
  text: 'Er sagte: „Ich werde dir ein Zicklein aus der Herde schicken.“ Sie sagte: „Wenn du mir ein Pfand[a] gibst, bis du es schickst.“'
  philosophy: optimal-equivalence
  footnotes:
