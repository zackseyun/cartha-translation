    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: Ziegenböckchen
  rationale: Die Verbindung bezeichnet ein Jungtier der Ziegen. „Ziegenböckchen“ ist im Deutschen natürlich und im Zusammenhang mit Juda als männlichem Tier gut verständlich.
- source_word: מִן הַצֹּאן
  choice: von der Herde
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. Da das Tier bereits als Ziege bestimmt ist, gibt „von der Herde“ die kollektive Herkunft idiomatisch wieder.
- source_word: עֵרָבוֹן
  choice: Pfand
  rationale: Das Wort bezeichnet einen Gegenstand, der bis zur Erfüllung einer Zusage als Sicherheit übergeben wird. „Pfand“ trifft diese Funktion im erzählten Zusammenhang prägnant.
- source_word: עַד שָׁלְחֶךָ
  choice: bis du es schickst
  rationale: Der Infinitiv mit Suffix bezeichnet Judas künftiges Schicken; das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen mit „es“ natürlich ausgedrückt.
- source_word: אִם תִּתֵּן
  choice: Nur wenn du mir … gibst
  rationale: אִם leitet hier eine Bedingung ein, unter der Tamar zustimmt. „Nur wenn“ macht den einschränkenden Sinn im natürlichen deutschen Dialog deutlich; „mir“ ist durch die Übergabesituation impliziert.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Ich werde dir … schicken
  rationale: Das selbstständige Pronomen kann Nachdruck tragen, doch eine ausdrückliche Wiedergabe mit „ich selbst“ wäre im Deutschen unnötig markiert. „dir“ verdeutlicht idiomatisch die Empfängerin der Sendung.
