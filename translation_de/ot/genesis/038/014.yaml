base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: de
  text: Da legte sie ihre Witwenkleider ab, bedeckte sich mit einem Schleier, verhüllte sich und setzte sich an den Eingang von Enajim, das am Weg nach Timna liegt. Denn sie sah, dass Schela erwachsen war, sie ihm aber nicht zur Frau gegeben worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: ihre Witwenkleider
  rationale: Gibt die konkrete hebräische Bezeichnung für die Kleidung ihres Witwenstandes knapp und natürlich wieder.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: bedeckte sich mit einem Schleier, verhüllte sich
  rationale: Bewahrt die beiden aufeinanderfolgenden hebräischen Verben, ohne sie zu einem einzigen Vorgang zusammenzuziehen. Das zweite Verb bezeichnet hier ein Sich-Verhüllen oder Einhüllen.
- source_word: בְּפֶתַח עֵינַיִם
  choice: an den Eingang von Enajim
  rationale: Versteht עֵינַיִם als Ortsnamen und פֶּתַח als dessen Eingang; die Formulierung bleibt nah am Hebräischen und ist im Deutschen verständlich.
- source_word: גָדַל שֵׁלָה
  choice: Schela erwachsen war
  rationale: Im Kontext meint das Verb, dass Schela groß beziehungsweise heiratsfähig geworden war; „erwachsen“ drückt dies natürlich aus.
theological_decisions:
- issue: Tamar wurde Schela nicht zur Frau gegeben
  choice: 'Passivform beibehalten: „sie ihm aber nicht zur Frau gegeben worden war“'
  alternative: „Juda sie Schela aber nicht zur Frau gegeben hatte“
  rationale: Das Hebräische nennt den Handelnden nicht ausdrücklich. Die Passivform bewahrt diese Zurückhaltung und fügt Juda nicht direkt in den Satz ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge der hebräischen Verben und das unpersönliche Passiv im Schlusssatz bleiben erhalten; die Ortsnamendeutung wird in einer Fußnote transparent gemacht.
