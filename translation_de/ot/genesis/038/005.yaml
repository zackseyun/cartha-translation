  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: de
  text: Sie gebar noch einen Sohn und gab ihm den Namen Schela. Er war in Kesib, als sie ihn gebar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einigen alten Textzeugen und Auslegern: „Sie war in Kesib, als sie ihn gebar.“ Im hebräischen Text steht „er war“; wer damit gemeint ist, ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Sie gebar noch einen Sohn
  rationale: Die Verbindung יסף + עוד bezeichnet eine weitere, wiederholte Handlung. Im Deutschen gibt „noch einen Sohn gebären“ den Sinn vollständig und natürlich wieder, ohne eine im Hebräischen nicht ausdrücklich genannte Empfängnis einzufügen.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: und gab ihm den Namen Schela
  rationale: Natürliches modernes Deutsch für die hebräische Namensformel „sie nannte seinen Namen“; der Personenname wird als „Schela“ transkribiert.
- source_word: וְהָיָה
  choice: Er war
  rationale: Der masoretische Text hat eine maskuline Singularform. Der mögliche Bezug bleibt jedoch unklar und wird nicht durch eine ausdrückliche Identifizierung aufgelöst.
- source_word: בִכְזִיב
  choice: in Kesib
  rationale: Der Ortsname wird nach dem hebräischen כְזִיב als „Kesib“ wiedergegeben; „in“ ist bei einem Ort im Deutschen idiomatisch.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: als sie ihn gebar
  rationale: Die Präposition ב mit dem Infinitiv constructus hat hier temporalen Sinn; die Formulierung ist knapp, natürlich und quellennah.
theological_decisions:
- issue: Subjekt von וְהָיָה
  choice: Das grammatisch maskuline „Er war“ steht im Haupttext, ohne den Mann zu identifizieren.
  alternative: 'Einige alte Textzeugen und Ausleger verstehen den Satz feminin: „Sie war in Kesib, als sie ihn gebar.“'
  rationale: Die Konsonanten und Vokalisierung des masoretischen Textes weisen auf die 3. Person maskulin Singular. Da der Bezug im Zusammenhang nicht eindeutig ist und eine alte feminine Deutung existiert, wird die Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper hebräischer Erzählweise. Die echte Unklarheit über das Subjekt von „war“ bleibt erhalten. Der englische Fußnotenhinweis zur Schreibweise des Ortsnamens wurde nicht übernommen, da er dort offenbar fälschlich an den Personennamen Schela gesetzt ist und für eine eigenständige deutsche Wiedergabe nicht nötig ist.
