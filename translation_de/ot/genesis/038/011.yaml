base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: de
  text: 'Da sagte Juda zu seiner Schwiegertochter Tamar: »Bleib als Witwe im Haus deines Vaters, bis mein Sohn Schela erwachsen ist.« Denn er sagte sich[a]: »Sonst könnte auch er sterben wie seine Brüder.« Tamar ging also fort und lebte im Haus ihres Vaters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn er sagte«; das hebräische »sagen« kann auch einen inneren Gedankengang einleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: Bleib als Witwe
  rationale: Der Imperativ von ישׁב bezeichnet hier das Verbleiben in einem Zustand und an einem Ort; „Bleib als Witwe“ ist natürliches modernes Deutsch und bewahrt den ausdrücklich genannten Witwenstand.
- source_word: בֵית אָבִיךְ
  choice: im Haus deines Vaters
  rationale: Die Wendung bezeichnet den Wohnsitz im väterlichen Haushalt; die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: bis mein Sohn Schela erwachsen ist
  rationale: גדל meint hier das Heranwachsen bis zur nötigen Reife; „erwachsen ist“ gibt dies im Deutschen klar wieder, ohne einen genaueren Zeitpunkt in den Text hineinzulesen.
- source_word: כִּי אָמַר
  choice: Denn er sagte sich
  rationale: אמר bedeutet wörtlich „sagen“, kann aber unausgesprochene innere Rede einführen. „sagte sich“ bewahrt das Rede-Motiv und macht den im Zusammenhang naheliegenden inneren Gedankengang verständlich.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: Sonst könnte auch er sterben
  rationale: פֶּן führt eine befürchtete Möglichkeit ein. Die Formulierung gibt die Sorge idiomatisch wieder, ohne den Tod als Gewissheit darzustellen.
- source_word: כְּאֶחָיו
  choice: wie seine Brüder
  rationale: Die knappe Vergleichsform des Hebräischen wird direkt bewahrt und verweist im Kontext auf Er und Onan.
- source_word: וַתֵּשֶׁב בֵּית אָבִיהָ
  choice: und lebte im Haus ihres Vaters
  rationale: ישׁב bezeichnet hier ein dauerhaftes Wohnen. „lebte“ klingt im Erzählzusammenhang natürlich und unterscheidet sich stilistisch vom vorangehenden Imperativ, ohne den Sinn zu verändern.
- source_word: כַּלָּתוֹ
  choice: seiner Schwiegertochter
  rationale: Die reguläre deutsche Verwandtschaftsbezeichnung entspricht dem eindeutigen Bezug im Kontext.
theological_decisions:
- issue: Judahs Beweggrund und innere Rede
  choice: „Denn er sagte sich“ mit Fußnote zur wörtlichen Ausdrucksweise
  alternative: „Denn er dachte“ oder wörtlich „Denn er sagte“
  rationale: Der Text schildert Judas Furcht, Schela könne wie seine Brüder sterben, ohne ausdrücklich zu erklären, wem Juda die Schuld gibt. Die Übersetzung kennzeichnet innere Rede, deutet aber keine zusätzliche theologische oder moralische Begründung hinein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Direkte Rede wird natürlich wiedergegeben; „Schela“ folgt einer geläufigen deutschen Umschrift. Die Sorge Judas bleibt als seine Befürchtung formuliert, ohne sie erzählerisch zu bestätigen.
