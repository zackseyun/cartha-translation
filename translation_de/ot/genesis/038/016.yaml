  text: וַ/יֵּ֨ט אֵלֶ֜י/הָ אֶל הַ/דֶּ֗רֶךְ וַ/יֹּ֨אמֶר֙ הָֽבָ/ה נָּא֙ אָב֣וֹא אֵלַ֔יִ/ךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖/וֹ הִ֑וא וַ/תֹּ֨אמֶר֙ מַה תִּתֶּן לִּ֔/י כִּ֥י תָב֖וֹא אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: de
  text: 'Da bog er zu ihr am Weg ab und sagte: „Bitte, lass mich zu dir kommen[a]!“ Denn er wusste nicht, dass sie seine Schwiegertochter war. Sie fragte: „Was gibst du mir[b] dafür, dass du zu mir kommst?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zu dir kommen“ und „zu mir kommen“ sind hier verhüllende Ausdrücke für Geschlechtsverkehr.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Was zahlst du mir …?“ Wörtlich steht im Hebräischen: „Was gibst du mir …?“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: Da bog er am Weg zu ihr ab
  rationale: נטה bezeichnet hier das Abweichen von der bisherigen Richtung auf Tamar zu. „abbiegen“ bewahrt diese Bewegung; „am Weg“ gibt den Ort wieder, ohne den im Hebräischen nicht ausdrücklich genannten „Straßenrand“ in den Haupttext einzutragen.
- source_word: הָבָה נָּא
  choice: Bitte, lass mich
  rationale: Die Verbindung drückt hier eine auffordernde Bitte aus. Diese Formulierung ist in modernem Deutsch natürlich und wahrt den bittenden Nachdruck von נָּא.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלָי
  choice: zu dir kommen / zu mir kommst
  rationale: בוא אל ist hier ein sexueller Euphemismus. Die wörtlich-nahe deutsche Wendung erhält die verhüllende Ausdrucksweise; eine Fußnote erläutert die gemeinte sexuelle Beziehung.
- source_word: כִּי לֹא יָדַע
  choice: Denn er wusste nicht
  rationale: כִּי leitet die erzählerische Begründung für Judas Verhalten ein; „denn“ gibt diese Funktion knapp und natürlich wieder.
- source_word: כִּי כַלָּתוֹ הִוא
  choice: dass sie seine Schwiegertochter war
  rationale: כַלָּה bezeichnet in diesem Zusammenhang eindeutig die Schwiegertochter; die deutsche Identifikationskonstruktion entspricht dem Sinn des hebräischen Nominalsatzes.
- source_word: מַה תִּתֶּן לִּי
  choice: Was gibst du mir
  rationale: Der Haupttext bewahrt das allgemeine Verb נתן („geben“), obwohl der Zusammenhang eine Bezahlung meint. Die wirtschaftliche Bedeutung wird als Übersetzungsalternative in der Fußnote genannt.
- source_word: כִּי תָבוֹא אֵלָי
  choice: dafür, dass du zu mir kommst
  rationale: „dafür, dass“ stellt im Deutschen den Zusammenhang zwischen Gegenleistung und Handlung natürlich her, ohne den sexuellen Euphemismus ausdrücklich aufzulösen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der sexuelle Vorgang wird wie im Hebräischen euphemistisch ausgedrückt; die Fußnote schafft Klarheit. Die direkte Rede bleibt knapp und alltagstauglich.
