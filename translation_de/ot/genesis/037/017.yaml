  rationale: Die Ortsangabe wird von „bei Dotan“ zu „in Dotan“ präzisiert, damit die hebräische Lokalangabe nicht zu einer bloßen Näheangabe wird. Die Fußnote bleibt am Wahrnehmungsausdruck verankert, formuliert die mögliche Wiedergabe aber ohne eine nicht zwingende progressive Zusatznuance. Alle übrigen Formulierungen können beibehalten werden.
