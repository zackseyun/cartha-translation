  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des hebräischen Textes zutreffend wieder: Aufbruch von diesem Ort, begründende Hörensauskunft, Kohortativ „Lasst uns“, Bewegung nach Dotan, Josefs Folgen und sein Finden der Brüder. „Bei Dotan“ schwächt jedoch die Ortsangabe בְּדֹתָן unnötig zu einer Lage in der Nähe der Stadt ab; hier ist „in Dotan“ die genauere Wiedergabe.'
  naturalness: Der Stil ist klares, modernes Standarddeutsch. Die direkte Rede und „seinen Brüdern nachziehen“ sind idiomatisch. „In Dotan“ ist ebenso natürlich und vermeidet die im Deutschen mit „bei“ verbundene Nähe- oder Umgebungsbedeutung.
  terminology: „Josef“ und „Dotan“ entsprechen etabliertem deutschem Bibelgebrauch. Es liegen keine besonderen theologischen Fachbegriffe vor. Die Fußnote ist als lexikalische Alternative angemessen verankert, sollte aber keine zusätzliche Aspektnuance („gerade“) behaupten, die das hebräische Partizip hier nicht zwingend ausdrückt.
  issues:
  - severity: medium
    issue: „bei Dotan“ für בְּדֹתָן
    rationale: Die Präposition בְּ lokalisiert die Brüder in/an Dotan. Deutsch „bei Dotan“ legt eher eine Position außerhalb beziehungsweise in der Umgebung Dotans nahe. „in Dotan“ wahrt die Ortsangabe ohne diese zusätzliche Abschwächung.
  - severity: low
    issue: Fußnotenalternative „ich hörte sie gerade sagen“
    rationale: Das Partizip אֹמְרִים kann die Wahrnehmungskonstruktion mit „sagen“ ausdrücken, verlangt aber nicht die ausdrücklich progressive Nuance „gerade“. Eine Alternative ohne „gerade“ ist neutraler.
