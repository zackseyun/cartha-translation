  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: de
  text: 'Der Mann sagte: „Sie sind von hier weitergezogen, denn ich hörte sie sagen[a]: ‚Lasst uns nach Dotan gehen.‘“ Da zog Josef seinen Brüdern nach und fand sie in Dotan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich hörte sie sagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: Sie sind von hier weitergezogen
  rationale: נסע bezeichnet häufig das Aufbrechen und Weiterziehen; die Formulierung gibt den Ortswechsel natürlich wieder, ohne das Abbrechen eines Lagers ausdrücklich vorauszusetzen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für die Auskunft des Mannes ein; „denn“ klingt in direkter Rede natürlich und wahrt den kausalen Zusammenhang.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: ich hörte sie sagen
  rationale: Das Subjekt des Partizips ist aus dem Kontext als Josefs Brüder zu erschließen. „Ich hörte sie sagen“ bildet die hebräische Wahrnehmungskonstruktion knapp und idiomatisch ab.
- source_word: נֵלְכָה
  choice: Lasst uns … gehen
  rationale: Der Kohortativ der ersten Person Plural drückt eine gemeinsame Aufforderung beziehungsweise einen Entschluss aus.
- source_word: דֹּתָיְנָה
  choice: nach Dotan
  rationale: Die lokale Richtungsendung bezeichnet die Bewegung auf Dotan zu; im Deutschen wird dies idiomatisch mit „nach“ ausgedrückt.
- source_word: אַחַר אֶחָיו
  choice: seinen Brüdern nach
  rationale: Die Wendung bezeichnet das Folgen hinter Personen her; die deutsche Formulierung ist präzise und natürlich.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: und fand sie bei Dotan
  rationale: מצא bedeutet im Erzählzusammenhang „finden“. בְּ bezeichnet den Ort; „bei Dotan“ lässt offen, ob sie sich innerhalb des Ortes oder in dessen Umgebung befanden.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die deutsche Namensform „Dotan“ folgt der im deutschsprachigen Bibelgebrauch üblichen Transkription. Die Richtungsendung in דֹּתָיְנָה wird unmittelbar durch „nach Dotan“ wiedergegeben und benötigt daher keine eigene Sachfußnote.
