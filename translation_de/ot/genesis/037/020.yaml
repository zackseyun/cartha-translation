source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: de
  text: 'Und nun: Kommt, wir wollen ihn töten und in eine der Gruben[a] werfen. Dann sagen wir: »Ein wildes Tier[b] hat ihn gefressen.« Dann werden wir sehen, was aus seinen Träumen wird!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zisternen«. Das hebräische Wort kann je nach Zusammenhang eine Grube oder eine Zisterne bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein gefährliches wildes Tier«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an das Vorhergehende als auch die Dringlichkeit des Vorschlags.
- source_word: לְכוּ
  choice: kommt
  rationale: Der pluralische Imperativ dient hier idiomatisch als auffordernder Zuruf an die Gruppe, nicht als Befehl wegzugehen.
- source_word: וְנַהַרְגֵהוּ
  choice: wir wollen ihn töten
  rationale: Gibt die kohortative, auf gemeinsames Handeln zielende Form natürlich und würdevoll wieder.
- source_word: וְנַשְׁלִכֵהוּ
  choice: und ... werfen
  rationale: Das Verb bezeichnet das Werfen oder Hineinwerfen; die deutsche Form ist direkt und gegenwärtig.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: in eine der Gruben
  rationale: בּוֹר kann Grube oder Zisterne bezeichnen. Der allgemeinere Ausdruck »Grube« wahrt die lexikalische Breite; die Alternative steht in der Fußnote.
- source_word: וְאָמַרְנוּ
  choice: Dann sagen wir
  rationale: Gibt den nächsten geplanten Schritt in der Rede idiomatisch wieder, ohne die hebräische Abfolge unnötig zu glätten.
- source_word: חַיָּה רָעָה
  choice: ein wildes Tier
  rationale: Im Kontext ist ein gefährliches Tier der Wildnis gemeint. »Wildes Tier« ist natürlich und vermeidet eine übermäßige Festlegung von רָעָה auf »bösartig«.
- source_word: אֲכָלָתְהוּ
  choice: hat ihn gefressen
  rationale: Für ein Tier ist »fressen« die direkte und idiomatische Entsprechung von »essen«; sie bewahrt das drastische Bild, ohne das stärkere »verschlingen« zwingend einzutragen.
- source_word: וְנִרְאֶה
  choice: Dann werden wir sehen
  rationale: Bewahrt die mögliche futurische beziehungsweise kohortative Nuance und den spöttisch herausfordernden Folgesinn.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: was aus seinen Träumen wird
  rationale: Natürliche deutsche Wiedergabe der absichtsvoll offenen Frage nach dem Ausgang beziehungsweise der Verwirklichung seiner Träume.
theological_decisions:
- issue: Status und Ausgang von Josefs Träumen
  choice: was aus seinen Träumen wird
  alternative: was seine Träume sein werden
  rationale: Die idiomatische Form lässt offen, ob die Brüder nach Erfüllung, Fortbestand oder Ergebnis der Träume fragen, und löst die erzählerische Spannung nicht vorzeitig auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit direkter, würdevoller Erzählsprache. Die Rede bleibt knapp und bedrohlich; der Schlusssatz ist als Teil der Rede der Brüder wiedergegeben.
