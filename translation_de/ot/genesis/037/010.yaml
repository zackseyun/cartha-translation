base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: de
  text: 'Er erzählte es seinem Vater und seinen Brüdern. Da wies ihn sein Vater zurecht und sagte zu ihm: »Was ist das für ein Traum, den du geträumt hast? Werden wir wirklich kommen – ich, deine Mutter und deine Brüder –, um uns vor dir zur Erde niederzuwerfen[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet eine tiefe Verbeugung oder das Niederwerfen als Zeichen der Unterordnung; hier ist nicht notwendigerweise Anbetung gemeint.
    reason: lexikalische Bedeutungsbreite
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Er erzählte es
  rationale: Das Piel von ספר bedeutet hier »erzählen« oder »berichten«. Das Pronomen »es« nimmt den Traum aus dem Zusammenhang auf, wie es auch im Hebräischen vorausgesetzt ist.
- source_word: וַיִּגְעַר בּוֹ
  choice: wies ihn zurecht
  rationale: גער bezeichnet einen deutlichen verbalen Tadel. »Wies ihn zurecht« ist in modernem Deutsch natürlich und bewahrt den Nachdruck, ohne unnötig altertümlich zu klingen.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Was ist das für ein Traum, den du geträumt hast?
  rationale: Die Formulierung erhält die rhetorische Frage und die hebräische Wiederholung von »Traum« und »träumen«, bleibt dabei aber verständliches Deutsch.
- source_word: הֲבוֹא נָבוֹא
  choice: Werden wir wirklich kommen
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt das Verb. »Wirklich« gibt diese Hervorhebung wieder; die Frageform lässt zugleich Jakobs ungläubigen Einwand erkennen.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: ich, deine Mutter und deine Brüder
  rationale: Die drei im Hebräischen ausdrücklich genannten Subjekte werden vollständig und in derselben Reihenfolge wiedergegeben.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: um uns vor dir bis zur Erde niederzuwerfen
  rationale: שׁחה bezeichnet hier eine tiefe Unterwerfungsgeste; אָרְצָה gibt die Richtung zur Erde beziehungsweise zum Boden an. Die Wiedergabe bewahrt sowohl die Körperbewegung als auch den sozialen Sinn.
theological_decisions:
- issue: Bedeutung von השתחוה außerhalb eines kultischen Zusammenhangs
  choice: uns vor dir bis zur Erde niederzuwerfen
  alternative: dich anzubeten
  rationale: Das Verb kann in anderen Zusammenhängen Anbetung bezeichnen. Hier geht es jedoch um die Unterordnung von Familienangehörigen, die im Traum durch das Niederbeugen dargestellt wird. Die Übersetzung vermeidet daher eine nicht erforderliche kultische Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt rhetorisch zugespitzt; Gedankenstriche machen die nachgestellte Aufzählung der Personen gut lesbar.
