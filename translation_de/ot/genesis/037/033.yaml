  text: וַ/יַּכִּירָ֤/הּ וַ/יֹּ֨אמֶר֙ כְּתֹ֣נֶת בְּנִ֔/י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: de
  text: 'Er erkannte es und sagte: »Das ist das Gewand meines Sohnes! Ein gefährliches wildes Tier hat ihn gefressen. Josef ist ganz gewiss in Stücke gerissen worden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit hebräischer Verstärkung: »Zerrissen, ja zerrissen wurde Josef.«'
    reason: Die Fußnote macht die Form des absoluten Infinitivs mit anschließender finiter Passivform sichtbar.
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Er erkannte es
  rationale: נכר im Hifil bedeutet hier »erkennen/identifizieren«; das feminine Objektsuffix bezieht sich auf כְּתֹנֶת, wird im Deutschen aber mit dem sächlichen Pronomen für »Gewand« wiedergegeben.
- source_word: כְּתֹנֶת בְּנִי
  choice: das Gewand meines Sohnes
  rationale: כְּתֹנֶת bezeichnet ein am Körper getragenes längeres Kleidungsstück. »Gewand« ist im Deutschen natürlich und im erzählerischen Kontext angemessen; die Genitivfügung gibt die hebräische Constructusverbindung klar wieder.
- source_word: חַיָּה רָעָה
  choice: ein wildes Tier
  rationale: חַיָּה bezeichnet hier ein wild lebendes Tier; רָעָה charakterisiert es im Kontext als gefährlich oder verderbenbringend, nicht als moralisch böse. »Ein wildes Tier« vermittelt die gemeinte Gefahr idiomatisch, ohne sie überdeutlich auszulegen.
- source_word: אֲכָלָתְהוּ
  choice: hat ihn gefressen
  rationale: Bei einem Tier ist »fressen« die natürliche deutsche Entsprechung von אכל. Das Perfekt drückt Jakobs Schluss über das bereits Geschehene aus.
- source_word: טָרֹף טֹרַף
  choice: ist ganz gewiss zerrissen worden
  rationale: Der absolute Infinitiv vor der finiten Passivform verstärkt die Aussage. »Ganz gewiss« bildet die emphatische Gewissheit ab; »zerrissen worden« bewahrt das Passiv und den gewaltsamen Sinn.
- source_word: יוֹסֵף
  choice: Josef
  rationale: »Josef« ist die etablierte moderne deutsche Form des hebräischen Namens יוֹסֵף und bleibt für deutschsprachige Leser unmittelbar erkennbar.
theological_decisions:
- issue: Jakobs Schlussfolgerung über Josefs Schicksal
  choice: Als bestimmte Aussage in direkter Rede wiedergegeben
  alternative: Durch »wohl« oder »offenbar« als Vermutung abschwächen
  rationale: Die hebräische Aussage enthält keine ausdrückliche Abschwächung; vielmehr verstärkt טָרֹף טֹרַף Jakobs Überzeugung. Die Übersetzung bewahrt zugleich die erzählerische Spannung, da sie Jakobs Schluss wiedergibt, ohne dessen Wahrheit durch einen Erzählerkommentar zu bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. »Gewand« wahrt den erzählerisch-biblischen Ton, ohne altertümlich zu wirken; »gefressen« ist im Zusammenhang mit einem Tier idiomatischer als »verzehrt«.
