  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: de
  text: Als Josef zu seinen Brüdern kam, zogen sie ihm sein Gewand aus, das besondere Gewand[a], das er trug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das langärmelige Gewand“, „das reich verzierte Gewand“ oder traditionell „das bunte Gewand“. Die genaue Bedeutung des hebräischen Ausdrucks כְּתֹנֶת הַפַּסִּים ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählformel leitet das nächste Geschehen zeitlich ein. Im Deutschen gibt „Als“ diese Funktion natürlich wieder, ohne die Wendung hölzern nachzubilden.
- source_word: בָּא יוֹסֵף אֶל אֶחָיו
  choice: Josef zu seinen Brüdern kam
  rationale: „Kam“ entspricht der schlichten Bewegungsangabe; אֶחָיו bezeichnet im Zusammenhang Josefs männliche Geschwister.
- source_word: וַיַּפְשִׁיטוּ אֶת יוֹסֵף
  choice: zogen sie ihm … aus
  rationale: Das Verb bezeichnet das Entkleiden beziehungsweise gewaltsame Abnehmen eines Kleidungsstücks. Die deutsche Dativkonstruktion ist natürlich und bewahrt Josef als Betroffenen der Handlung.
- source_word: כֻּתָּנְתּוֹ
  choice: sein Gewand
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes, tunikaartiges Kleidungsstück. „Gewand“ ist im Deutschen verständlich und stilistisch angemessen, ohne eine allzu genaue historische Schnittform vorzugeben.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: das besondere Gewand[a]
  rationale: Die genaue Bedeutung von פַּסִּים ist unsicher. „Besonders“ kennzeichnet das Gewand als auffällig oder ausgezeichnet, ohne zwischen den umstrittenen Deutungen „langärmelig“, „reich verziert“ oder „bunt“ zu entscheiden.
- source_word: אֲשֶׁר עָלָיו
  choice: das er trug
  rationale: Die idiomatische deutsche Formulierung gibt genau an, dass Josef dieses Gewand in jenem Augenblick anhatte.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Gewand“ bildet die erläuternde Apposition des Hebräischen ab; die lexikalische Unsicherheit wird nicht im Haupttext einseitig aufgelöst, sondern in der Fußnote offengelegt.
