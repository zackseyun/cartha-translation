  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen präzise wieder: Ruben hört den Plan, bewahrt Josef vor der Gewalt seiner Brüder und spricht sich gegen eine tödliche Misshandlung aus. »aus ihrer Hand« bewahrt die hebräische Bildsprache von Gewalt und Verfügungsgewalt. »Wir wollen ihn nicht totschlagen« gibt לֹא נַכֶּנּוּ נָפֶשׁ idiomatisch wieder und erhält zugleich den Anklang an das Schlagen.'
