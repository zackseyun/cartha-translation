  text: וַ/יִּשְׁמַ֣ע רְאוּבֵ֔ן וַ/יַּצִּלֵ֖/הוּ מִ/יָּדָ֑/ם וַ/יֹּ֕אמֶר לֹ֥א נַכֶּ֖/נּוּ נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: de
  text: 'Als Ruben das hörte, rettete er ihn aus ihrer Hand und sagte: »Wir wollen ihn nicht totschlagen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als … das hörte
  rationale: שׁמע bedeutet grundsätzlich »hören«. Das ergänzte »das« verweist natürlich auf den zuvor geäußerten Plan; »als« gibt den zeitlichen Fortgang der Erzählung wieder.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Form des Personennamens.
- source_word: וַיַּצִּלֵהוּ
  choice: rettete er ihn
  rationale: Das Hifil von נצל bezeichnet hier das Retten oder Befreien aus unmittelbarer Gefahr.
- source_word: מִיָּדָם
  choice: aus ihrer Hand
  rationale: Die Wiedergabe bewahrt das hebräische Bild für die Gewalt beziehungsweise Verfügungsgewalt der Brüder und ist auch im Deutschen verständlich.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Natürliche deutsche Wiedergabe der üblichen hebräischen Einleitung direkter Rede.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Wir wollen ihn nicht totschlagen
  rationale: נכה bedeutet »schlagen«; zusammen mit נָפֶשׁ bezeichnet die Wendung einen tödlichen Schlag. »totschlagen« erhält sowohl das Bild des Schlagens als auch den tödlichen Sinn und klingt als Aufforderung in der ersten Person Plural natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählprosa. Die hebräische Bildsprache »aus ihrer Hand« bleibt erhalten; die Schlusswendung wird idiomatisch und zugleich bildnah wiedergegeben.
