source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב יַעֲקֹ֔ב בְּ/אֶ֖רֶץ מְגוּרֵ֣י אָבִ֑י/ו בְּ/אֶ֖רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: de
  text: Jakob wohnte in dem Land, in dem sich sein Vater als Fremder aufgehalten hatte[a], im Land Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „im Land der Fremdlingsaufenthalte seines Vaters“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Jakob wohnte
  rationale: Das Verb ישׁב bezeichnet hier das Wohnen bzw. Sich-Niederlassen. „Wohnte“ ist natürliches modernes Deutsch und behauptet keine stärkere Dauerhaftigkeit, als der Kontext erkennen lässt. Das narrative וַ wird nicht eigens mit „nun“ wiedergegeben.
- source_word: בְּאֶרֶץ
  choice: in dem Land
  rationale: אֶרֶץ bezeichnet in diesem geografischen Zusammenhang ein Land bzw. Gebiet. „Land“ bewahrt den biblisch-geografischen Charakter.
- source_word: מְגוּרֵי אָבִיו
  choice: in dem sich sein Vater als Fremder aufgehalten hatte
  rationale: מְגוּרִים bezeichnet den Aufenthalt als Schutzbürger oder Fremder, nicht bloß neutrales Wohnen. Die Relativsatzkonstruktion gibt den hebräischen Genitiv in verständlichem modernem Deutsch wieder; „sein Vater“ bezieht sich auf Isaak.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die zweite Nennung von אֶרֶץ bleibt erhalten und identifiziert das zuvor genannte Gebiet ausdrücklich als Kanaan.
theological_decisions:
- issue: Status Isaaks im Land
  choice: als Fremder aufgehalten hatte
  alternative: gewohnt hatte
  rationale: 'Die Übersetzung bewahrt die in מְגוּרֵי enthaltene Spannung: Isaak lebte im verheißenen Land, besaß es aber noch nicht in der Weise eines ansässigen Landesherrn. Sie zieht daraus keine weitergehende theologische Folgerung.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Land“ folgt dem Hebräischen; die etwas schwer verständliche wörtliche Konstruktion wird im Haupttext durch einen natürlichen Relativsatz wiedergegeben.
