source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: de
  text: Da zogen midianitische Männer, Händler, vorbei. Sie[a] zogen Josef hoch und hoben ihn aus der Grube; dann verkauften sie Josef für zwanzig Silberstücke[b] an die Ismaeliter. Anschließend brachten sie Josef nach Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Verben stehen im Plural („sie zogen“, „sie hoben“, „sie verkauften“, „sie brachten“). Da sowohl midianitische Händler als auch Ismaeliter genannt werden, bleibt teilweise offen, welche Gruppe jeweils handelt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „für zwanzig Silber“; die Gewichtseinheit wird im Hebräischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: Da kamen … vorbei
  rationale: עבר bezeichnet hier das Vorbeiziehen am Ort. „Kamen … vorbei“ ist im modernen Deutschen natürlich und gibt die erzählerische Bewegung wieder, ohne bloße Ankunft auszudrücken.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: midianitische Männer, Händler
  rationale: Die Wiedergabe erhält sowohl אֲנָשִׁים („Männer“) als auch die Bezeichnung סֹחֲרִים („Händler“) und bleibt nahe an der hebräischen Apposition.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: zogen Josef hoch und holten ihn aus der Grube
  rationale: Die beiden hebräischen Verben werden unterschieden wiedergegeben, zugleich aber in eine natürliche deutsche Bewegungsfolge gefasst.
- source_word: מִן הַבּוֹר
  choice: aus der Grube
  rationale: בּוֹר kann Grube oder Zisterne bezeichnen. „Grube“ ist im Erzählzusammenhang verständlich und lässt die genaue bauliche Form offen.
- source_word: וַיִּמְכְּרוּ אֶת יוֹסֵף לַיִּשְׁמְעֵאלִים
  choice: verkauften sie Josef … an die Ismaeliter
  rationale: Das direkte Objekt und die ausdrücklich genannten Ismaeliter als Empfänger des Verkaufs werden bewahrt.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: für zwanzig Silberstücke
  rationale: Wörtlich steht „für zwanzig Silber“; „Silberstücke“ ist eine verständliche deutsche Ergänzung, ohne die nicht ausdrücklich genannte Einheit als Schekel festzulegen.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: brachten sie Josef nach Ägypten
  rationale: Die Kausativ-/Bewegungsbedeutung von בוא und die Richtungsendung bei מִצְרַיְמָה werden idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug der pluralischen Verben nach der Erwähnung der midianitischen Händler und der Ismaeliter
  choice: Das unbestimmte Pronomen „sie“ wird beibehalten und nicht über den hebräischen Wortlaut hinaus auf eine Gruppe festgelegt.
  alternative: Alle Handlungen den midianitischen Händlern zuschreiben oder Verkauf und Transport ausdrücklich den Ismaelitern zuschreiben.
  rationale: Die hebräische Abfolge lässt eine Spannung darüber bestehen, welche Gruppe bei den einzelnen Handlungen gemeint ist. Die Übersetzung erklärt diese Spannung nicht durch eine eingefügte Harmonisierung auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die appositionelle Form „midianitische Männer, Händler“ hält die ungewöhnliche hebräische Ausdrucksweise sichtbar; die Handlungsfolge wird flüssig formuliert, ohne die Mehrdeutigkeit der handelnden Gruppe aufzulösen.
