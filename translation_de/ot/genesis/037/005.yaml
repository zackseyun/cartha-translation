base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: de
  text: Josef hatte einen Traum[a]. Er erzählte seinen Brüdern davon, und sie hassten ihn noch mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Josef träumte einen Traum.«'
    reason: Die Fußnote bewahrt die im Hebräischen verwendete Verbindung aus Verb und stammverwandtem Substantiv.
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Josef hatte einen Traum
  rationale: Die hebräische figura etymologica bedeutet wörtlich »Josef träumte einen Traum«. Die idiomatische deutsche Wendung »hatte einen Traum« gibt denselben Sachverhalt natürlich wieder; die formale Besonderheit wird in der Fußnote dokumentiert.
- source_word: וַיַּגֵּד
  choice: Er erzählte ihn
  rationale: נגד im Hifil bedeutet hier »mitteilen, erzählen«. Das Pronomen »ihn« nimmt den unmittelbar zuvor genannten Traum auf.
- source_word: לְאֶחָיו
  choice: seinen Brüdern
  rationale: Die Form bezeichnet eindeutig Josefs Brüder und bewahrt die konkrete familiäre Beziehung.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: noch mehr
  rationale: Die Verbindung von יסף und עוד drückt eine weitere Steigerung aus. »Noch mehr« ist im Deutschen knapp und idiomatisch.
- source_word: שְׂנֹא אֹתוֹ
  choice: sie hassten ihn
  rationale: Der Infinitiv nach יסף ergibt sinngemäß eine Zunahme ihres Hasses; im Deutschen wird dies natürlich mit einem finiten Verb und »noch mehr« ausgedrückt.
