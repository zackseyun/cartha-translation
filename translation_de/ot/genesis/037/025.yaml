  to: 'Dann setzten sie sich hin, um zu essen. Als sie aufblickten, sahen sie: Da kam eine Karawane von Ismaelitern aus Gilead. Ihre Kamele trugen Tragantgummi[a], Balsam[b] und Ladanum[c]; die Karawane war unterwegs, um die Waren nach Ägypten hinunterzubringen.'
