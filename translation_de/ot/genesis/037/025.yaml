base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: de
  text: 'Dann setzten sie sich hin, um zu essen. Als sie aufblickten, sahen sie: Da kam eine Karawane von Ismaelitern aus Gilead. Ihre Kamele trugen Tragantgummi[a], Balsam[b] und Ladanum[c]; die Karawane war unterwegs, um die Waren nach Ägypten hinunterzubringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung des hebräischen Ausdrucks ist unsicher; wahrscheinlich ist Tragant oder ein ähnliches aromatisches Pflanzenharz gemeint.
    reason: Das seltene Wort נְכֹאת lässt sich botanisch nicht mit letzter Sicherheit bestimmen.
  - marker: b
    text: Gemeint ist ein kostbares aromatisches oder heilkräftiges Harz, für das Gilead bekannt war.
    reason: צְרִי bezeichnet einen Balsamstoff, dessen genaue botanische Herkunft unsicher ist.
  - marker: c
    text: Ladanum ist ein duftendes Harz von Zistrosen; traditionell wird hier teilweise »Myrrhe« übersetzt.
    reason: Die Wiedergabe von לֹט ist traditionsgeschichtlich unterschiedlich; die Fußnote bewahrt Transparenz, ohne die wahrscheinlichere botanische Bestimmung im Haupttext aufzugeben.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: um zu essen
  rationale: Wörtlich »um Brot zu essen«; im Hebräischen bezeichnet »Brot essen« häufig allgemein das Einnehmen einer Mahlzeit. Die natürliche deutsche Wiedergabe wahrt den Sinn ohne einen ungewollten Akzent auf die Speiseart.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: eine Karawane von Ismaelitern
  rationale: אֹרְחָה bezeichnet eine Reisegesellschaft beziehungsweise Karawane; die Genitivfügung gibt die Zugehörigkeit klar und natürlich wieder.
- source_word: נְכֹאת
  choice: Tragantgummi
  rationale: Das seltene Handelsgut wird häufig als aromatisches Pflanzenharz beziehungsweise Tragant bestimmt. »Tragantgummi« ist sachlich genauer als das unspezifische »Gewürz«; die verbleibende Unsicherheit wird in der Fußnote offengelegt.
- source_word: צְרִי
  choice: Balsam
  rationale: Das Wort bezeichnet ein geschätztes heilkräftiges oder aromatisches Harz aus der Region Gilead. »Balsam« ist die eingebürgerte und verständliche deutsche Bezeichnung.
- source_word: לֹט
  choice: Ladanum
  rationale: Gemeint ist wahrscheinlich das aromatische Harz von Zistrosen. »Ladanum« unterscheidet dieses Produkt von Myrrhe, die im Hebräischen gewöhnlich anders bezeichnet wird.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: nach Ägypten hinunterzubringen
  rationale: Die Richtungsangabe »hinunter« gehört ausdrücklich zum hebräischen Verb und wird bewahrt; das Objekt sind sinngemäß die zuvor genannten Waren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. »Sahen sie plötzlich« vermittelt die aufmerksamkeitslenkende Wirkung von וְהִנֵּה natürlich, ohne das heute markierte »siehe« zu erzwingen. Die Wiederholung des hebräischen »und« wird zugunsten flüssiger deutscher Syntax maßvoll gegliedert.
