  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: de
  text: Sie sahen ihn von Weitem, und noch bevor er zu ihnen kam, schmiedeten sie einen Plan gegen ihn, um ihn zu töten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verschworen sie sich gegen ihn«. Das hebräische Verb kann ein listiges oder heimtückisches Vorgehen bezeichnen; die folgende Wendung macht deutlich, dass ihr Plan darauf zielte, ihn zu töten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ
  choice: Sie sahen ihn
  rationale: Das Qal wayyiqtol von ראה bezeichnet in der fortlaufenden Erzählung das Sehen; אֹתוֹ ist das direkte Objekt »ihn«.
- source_word: מֵרָחֹק
  choice: schon von Weitem
  rationale: Gibt die räumliche Distanz idiomatisch und in modernem Standarddeutsch wieder; »schon« verdeutlicht natürlich, dass sie ihn erblickten, bevor er nahe herankam.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: und noch bevor er zu ihnen kam
  rationale: בְּטֶרֶם leitet eine zeitliche Vorzeitigkeit ein; קרב im Qal bedeutet, sich zu nähern bzw. nahe zu kommen.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: schmiedeten sie gegen ihn einen Plan
  rationale: Der Hitpael von נכל bezeichnet hier ein feindseliges, heimtückisches Planen. Die Formulierung bewahrt die Ausrichtung gegen Josef und klingt im Deutschen natürlich.
- source_word: לַהֲמִיתוֹ
  choice: um ihn zu töten
  rationale: 'Der Hiphil-Infinitiv von מות mit Suffix bezeichnet das Ziel ihres Plans: Sie wollten seinen Tod herbeiführen.'
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdevolles Erzählregister. »Von Weitem« und »einen Plan schmieden« sind allgemein verständlich; die Satzstruktur hält den engen zeitlichen Zusammenhang des Hebräischen fest.
