  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: de
  text: Da zerriss Jakob seine Kleider, legte sich Sacktuch um die Hüften und trauerte viele Tage um seinen Sohn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: zerriss
  rationale: Das Verb קרע bezeichnet hier das Zerreißen von Kleidung als sichtbares Zeichen der Trauer; „zerriss“ gibt die konkrete Handlung natürlich und präzise wieder.
- source_word: שִׂמְלֹתָיו
  choice: seine Kleider
  rationale: שִׂמְלָה ist eine allgemeine Bezeichnung für Kleidung. „Seine Kleider“ ist im modernen Deutschen klar und weniger gehoben als „seine Gewänder“.
- source_word: שַׂק
  choice: Sacktuch
  rationale: שַׂק bezeichnet den groben Stoff, der als Trauerkleidung getragen wurde. „Sacktuch“ bewahrt den biblischen Sachbezug, ohne die Bedeutung nur umschreibend wiederzugeben.
- source_word: בְּמָתְנָיו
  choice: um die Hüften
  rationale: מָתְנַיִם bezeichnet den Hüft- beziehungsweise Lendenbereich. „Um die Hüften“ ist eine natürliche deutsche Ortsangabe und passt zum Anlegen des Sacktuchs.
- source_word: וַיִּתְאַבֵּל
  choice: trauerte
  rationale: Der Hitpael von אבל bezeichnet anhaltende beziehungsweise rituell sichtbare Trauer. „Trauerte“ trifft im Deutschen sowohl den Zustand als auch den Trauervollzug.
- source_word: עַל־בְּנוֹ
  choice: um seinen Sohn
  rationale: Bei Trauerverben wird עַל im Deutschen idiomatisch mit „um“ wiedergegeben.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Die wörtliche Wendung „viele Tage“ ist auch im Deutschen verständlich und bewahrt die unbestimmte Zeitangabe des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die kulturspezifische Bezeichnung „Sacktuch“ bleibt erhalten; „um die Hüften“ gibt den gemeinten Körperbereich natürlich wieder. Da keine für das Verständnis wesentliche echte Alternative ausgelagert werden muss, ist keine Fußnote gesetzt.
