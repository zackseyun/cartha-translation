lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Und er sagte zu ihnen
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; die Präposition mit Suffix bezeichnet die Brüder als Adressaten. Die Formulierung bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: שִׁמְעוּ נָא
  choice: Hört euch bitte … an
  rationale: Der Imperativ Plural fordert zum aufmerksamen Zuhören auf; נָא mildert die Aufforderung höflich ab. Die trennbare Wendung ist im modernen Deutschen natürlich.
- source_word: הַחֲלוֹם הַזֶּה
  choice: diesen Traum
  rationale: Der bestimmte Artikel mit Demonstrativpronomen wird idiomatisch als „diesen Traum“ wiedergegeben.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: den ich geträumt habe
  rationale: Der Relativsatz bleibt erhalten, ebenso die im Hebräischen beabsichtigte Wiederholung des Wortstamms für „Traum/träumen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hört euch … an“ klingt natürlicher als das isolierte „Hört“, während „bitte“ die höflich drängende Funktion von נָא wiedergibt. Die hebräische Stammwiederholung wird bewusst bewahrt.
