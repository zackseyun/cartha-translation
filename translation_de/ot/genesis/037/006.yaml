  language: de
  text: 'Und er sagte zu ihnen: „Hört euch bitte diesen Traum an, den ich geträumt habe.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen das Substantiv und das verwandte Verb nebeneinander: wörtlich „diesen Traum, den ich geträumt habe“.'
