base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: de
  text: Dann nahmen sie ihn und warfen ihn in die Grube[a]. Die Grube war leer; es war kein Wasser darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zisterne“. Das hebräische Wort kann eine Grube oder eine Zisterne bezeichnen; dazu passt die anschließende Bemerkung, dass kein Wasser darin war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Dann nahmen sie ihn
  rationale: Das Narrativ-Waw führt die Handlung fort. „Nahmen“ gibt לקח schlicht wieder, ohne wie „packten“ oder „ergriffen“ die Aussage unnötig zu verstärken.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: und warfen ihn
  rationale: השליך bezeichnet das Werfen beziehungsweise Hineinwerfen; „warfen“ ist im modernen Deutsch natürlich und bewahrt die Gewaltsamkeit der Handlung, ohne sie zu überzeichnen.
- source_word: הַבֹּרָה
  choice: in die Grube
  rationale: בּוֹר kann eine Grube, Zisterne oder einen brunnenartigen Hohlraum bezeichnen. „Grube“ wahrt die Bedeutungsbreite; die kontextuell plausible Übersetzung „Zisterne“ wird in der Fußnote genannt.
- source_word: וְהַבּוֹר רֵק
  choice: Die Grube aber war leer
  rationale: Das Waw leitet hier eine erläuternde Hintergrundangabe ein. „Aber“ verbindet sie natürlich mit dem Geschehen und hebt den bemerkenswerten Zustand der Grube hervor, ohne einen starken Gegensatz zu erzwingen.
- source_word: אֵין בּוֹ מָיִם
  choice: es war kein Wasser darin
  rationale: Die Formulierung gibt die hebräische Existenzverneinung idiomatisch wieder und behält die ausdrückliche Erwähnung des Wassers bei.
