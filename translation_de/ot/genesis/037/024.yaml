translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die knappe Wiederholung von „Grube“ folgt der Hervorhebung im Hebräischen; das Semikolon bewahrt die enge erläuternde Verbindung der beiden letzten Aussagen.
