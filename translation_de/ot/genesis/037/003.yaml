  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: de
  text: Israel liebte Josef mehr als jeden seiner anderen Söhne, denn er war der Sohn seines hohen Alters. Und er machte ihm ein besonderes Gewand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »ein buntes Gewand«. Der hebräische Ausdruck ist nicht sicher zu deuten; gemeint sein könnte auch ein kostbar verziertes oder bis zu den Handgelenken und Knöcheln reichendes Gewand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israel
  rationale: Der im Hebräischen verwendete Name bleibt erhalten; das einleitende וְ wird im natürlichen deutschen Erzählstil nicht eigens wiedergegeben.
- source_word: אָהַב
  choice: liebte
  rationale: Das gewöhnliche Verb für »lieben« wird direkt übersetzt, ohne die im Zusammenhang erkennbare Bevorzugung bereits lexikalisch einzutragen.
- source_word: מִכָּל בָּנָיו
  choice: mehr als alle seine anderen Söhne
  rationale: Die Vergleichskonstruktion mit מִן wird im Deutschen eindeutig wiedergegeben; »anderen« macht klar, dass Josef selbst zu Israels Söhnen gehört.
- source_word: כִּי בֶן זְקֻנִים הוּא לוֹ
  choice: denn er war ihm im hohen Alter geboren worden
  rationale: Die deutsche Formulierung gibt den idiomatischen Sinn eines Sohnes wieder, der Israel in dessen hohem Alter geboren wurde, und bewahrt durch »ihm« den relationalen Zug von לוֹ.
- source_word: וְעָשָׂה לוֹ
  choice: Und er ließ ihm … anfertigen
  rationale: Im Deutschen kann »machen« bei einem Kleidungsstück unbeholfen oder zu spezifisch wirken. »anfertigen lassen« gibt das Veranlassen oder Bereitstellen natürlich wieder, ohne zu behaupten, Israel habe es eigenhändig genäht.
- source_word: כְּתֹנֶת פַּסִּים
  choice: ein besonderes Gewand
  rationale: Die genaue Bedeutung von פַּסִּים ist unsicher. Die Hauptfassung vermeidet eine unbelegte Festlegung auf Farben, Schmuck oder Schnitt; die möglichen konkreteren Deutungen stehen in der Fußnote.
