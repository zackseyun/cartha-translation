base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: de
  text: 'Sie sagten zueinander: »Seht, da kommt dieser Träumer[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Herr/Besitzer der Träume«. Die Bezeichnung ist spöttisch und meint jemanden, der durch seine Träume bekannt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sie sagten
  rationale: Das Wayyiqtol von אמר führt die nächste Handlung der Erzählung fort; im Deutschen genügt dafür die natürliche Vergangenheitsform.
- source_word: אִישׁ אֶל אָחִיו
  choice: zueinander
  rationale: Die wörtliche Wendung »ein Mann zu seinem Bruder« wird hier reziprok gebraucht und bedeutet idiomatisch »zueinander«.
- source_word: הִנֵּה
  choice: Seht, da
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf den herankommenden Josef. »Seht, da« gibt diesen deiktischen Ausruf in natürlichem, würdigem Deutsch wieder.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: Herr der Träume
  rationale: Die wörtlich-nahe Wendung bewahrt die bildhafte und spöttische Bezeichnung der Brüder. בעל kann einen Herrn, Besitzer oder jemanden bezeichnen, der durch etwas charakterisiert ist.
- source_word: הַלָּזֶה
  choice: dieser
  rationale: Das Demonstrativpronomen hebt Josef hervor und kann im Zusammenhang geringschätzig klingen.
- source_word: בָּא
  choice: kommt
  rationale: Das Partizip von בוא bezeichnet hier Josefs gerade stattfindendes Herankommen; das deutsche Präsens ist dafür idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit knapper, lebendiger direkter Rede. Die ungewöhnliche hebräische Bezeichnung wird im Haupttext bewahrt und in der Fußnote erläutert, damit Spott und Bildhaftigkeit nicht auf das neutralere »Träumer« verengt werden.
