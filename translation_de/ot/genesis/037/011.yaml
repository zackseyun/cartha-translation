  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: de
  text: Da wurden seine Brüder eifersüchtig auf ihn; sein Vater aber behielt die Sache im Gedächtnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „bewahrte das Wort“ oder „behielt die Aussage“; das heißt, er merkte sich Josefs Bericht und dachte weiter darüber nach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ ב֖וֹ
  choice: Da wurden ... eifersüchtig auf ihn
  rationale: קנא mit ב bezeichnet hier die auf Josef gerichtete Eifersucht bzw. den Neid. „Eifersüchtig auf ihn“ ist im modernen Deutsch natürlich; „wurden“ gibt die erzählerische Reaktion wieder.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Der maskuline Plural bezeichnet im Erzählzusammenhang Josefs Brüder.
- source_word: וְאָבִיו
  choice: sein Vater aber
  rationale: Das hebräische וְ bedeutet formal „und“, markiert hier jedoch den Gegensatz zwischen der Reaktion der Brüder und derjenigen des Vaters. Die Nachstellung von „aber“ wahrt einen würdigen, natürlichen deutschen Erzählstil.
- source_word: שָׁמַר
  choice: behielt ... im Gedächtnis
  rationale: שׁמר bedeutet grundsätzlich „bewahren, hüten“. In Verbindung mit דָּבָר bezeichnet es hier das aufmerksame Festhalten und weitere Bedenken des Gesagten.
- source_word: אֶת־הַדָּבָר
  choice: die Sache
  rationale: דָּבָר kann „Wort“, „Aussage“ oder „Sache“ bedeuten. „Die Sache“ umfasst hier sowohl Josefs Bericht als auch die mögliche Bedeutung seines Traums, ohne die Mehrdeutigkeit unnötig einzuengen.
theological_decisions:
- issue: Art der Reaktion des Vaters
  choice: behielt die Sache im Gedächtnis
  alternative: bewahrte das Wort
  rationale: Die Übersetzung stellt weder ausdrücklichen Glauben noch Unglauben des Vaters fest, sondern lässt die im Hebräischen vorhandene nachdenkliche Zurückhaltung bestehen.
translation_notes:
  register: Modernes Standarddeutsch mit natürlichem, würdigem Erzählton. Das Semikolon bildet den Kontrast der beiden Reaktionen klar ab; „im Gedächtnis behalten“ erschließt das hebräische Idiom, während die Fußnote dessen wörtlichere Möglichkeiten bewahrt.
