  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Satzglieder zuverlässig wieder: Die Brüder reagieren mit קנא ב („eifersüchtig auf ihn“), während der Vater das dābār bewahrt bzw. im Gedächtnis behält. Der durch „aber“ ausgedrückte Kontrast ist im Kontext idiomatisch und wahrt die Bedeutung von וְ.'
