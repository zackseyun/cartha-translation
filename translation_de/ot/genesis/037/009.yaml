base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: de
  text: 'Dann träumte er noch einen anderen Traum, erzählte ihn seinen Brüdern und sagte: »Seht, ich habe noch einen Traum geträumt: die Sonne, der Mond und elf Sterne warfen sich vor mir nieder[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verneigten sich tief vor mir«. Das hebräische Verb kann eine tiefe Huldigung bezeichnen; hier geht es um Ehrerbietung, nicht um göttliche Anbetung.'
    reason: lexikalische Alternative und Abgrenzung des kontextuellen Sinns
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Dann träumte er noch einen anderen Traum
  rationale: Das narrative וַ leitet den nächsten Handlungsschritt ein. »Noch einen anderen Traum« gibt sowohl עוֹד als auch אַחֵר wieder und bewahrt die betonte Wiederholung.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: und erzählte ihn seinen Brüdern
  rationale: סִפֵּּר bezeichnet das Erzählen oder Berichten; die Formulierung ist im modernen Deutschen klar und entspricht dem erzählerischen Zusammenhang.
- source_word: הִנֵּה
  choice: Seht
  rationale: הִנֵּה lenkt die Aufmerksamkeit der Zuhörer auf das Folgende. »Seht« bewahrt diese Funktion in würdiger, verständlicher Sprache.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: ich habe noch einen Traum geträumt
  rationale: Die deutsche Formulierung bewahrt die hebräische figura etymologica aus Verb und stammverwandtem Substantiv sowie die Wiederholung durch עוֹד.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Das zweite הִנֵּה führt das Traumbild ein. Im Deutschen übernimmt der Doppelpunkt diese präsentierende Funktion natürlich, ohne den Aufmerksamkeitsruf schwerfällig zu wiederholen.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: die Sonne, der Mond und elf Sterne
  rationale: Die Himmelskörper und die Zahl werden direkt und idiomatisch wiedergegeben.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: warfen sich vor mir nieder
  rationale: Das Partizip stellt die Handlung als im Traumbild ablaufend dar. »Sich vor jemandem niederwerfen« gibt die tiefe Huldigung wieder, ohne kultische Anbetung zu behaupten.
theological_decisions:
- issue: Bedeutung von מִשְׁתַּחֲוִים in Josefs Traum
  choice: 'nichtkultische Huldigung: »warfen sich vor mir nieder«'
  alternative: »beteten mich an« oder schwächer »verneigten sich vor mir«
  rationale: Der unmittelbare Zusammenhang handelt von familiärer Unterordnung und der späteren Huldigung vor Josef, nicht ausdrücklich von göttlicher Anbetung. Die gewählte Wendung bewahrt die körperliche Intensität des hebräischen Verbs, ohne eine kultische Aussage einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung von »Traum/träumen« bleibt erhalten; die beiden Vorkommen von הִנֵּה werden funktional, aber nicht mechanisch gleich wiedergegeben.
