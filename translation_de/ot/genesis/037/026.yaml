  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: de
  text: 'Da sagte Juda zu seinen Brüdern: »Was haben wir davon, wenn wir unseren Bruder töten und sein Blut verbergen[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sein Blut bedecken«. Die Wendung bezeichnet das Verheimlichen der Bluttat oder der Schuld daran.'
    reason: Erläuterung der hebräischen Bildrede und Bewahrung der wörtlichen Alternative.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: Der maskuline Plural bezeichnet im Kontext Josefs anwesende Brüder.
- source_word: מַה בֶּצַע
  choice: Was haben wir davon
  rationale: בֶּצַע bezeichnet Gewinn oder Vorteil. Die idiomatische deutsche Frage bewahrt Judas eigennützige, pragmatische Überlegung.
- source_word: כִּי נַהֲרֹג
  choice: wenn wir ... töten
  rationale: כִּי leitet hier den Sachverhalt der rhetorischen Frage ein; die konditionale Wiedergabe ist im Deutschen natürlich.
- source_word: אָחִינוּ
  choice: unseren Bruder
  rationale: Direkte Wiedergabe; die Verwandtschaftsbezeichnung trägt das moralische Gewicht der Aussage.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: und sein Blut verbergen
  rationale: Die hebräische Wendung bedeutet wörtlich, das Blut zu bedecken, und meint im Zusammenhang das Verheimlichen der Bluttat. »Sein Blut verbergen« erhält das Bild und bleibt im Deutschen verständlich.
