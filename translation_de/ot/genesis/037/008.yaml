  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: de
  text: 'Seine Brüder sagten zu ihm: »Willst du etwa als König über uns herrschen? Willst du wirklich über uns gebieten?« Und sie hassten ihn noch mehr wegen seiner Träume und wegen seiner Worte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Willst du etwa als König über uns herrschen?
  rationale: Der Infinitivus absolutus mit finitem Verb verstärkt die Aussage; die rhetorische Frage drückt ungläubige Ablehnung aus. „Als König herrschen“ bewahrt den Bezug zur Königsherrschaft von מלך.
- source_word: אִם מָשׁוֹל תִּמְשֹׁל
  choice: Willst du wirklich über uns gebieten?
  rationale: Auch hier verstärkt die Verbwiederholung die rhetorische Frage. „Gebieten“ unterscheidet משל sprachlich von מלך und gibt die Ausübung von Herrschaft natürlich wieder.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: Und sie hassten ihn noch mehr
  rationale: Die idiomatische deutsche Wiedergabe erfasst die hebräische Konstruktion „sie fügten hinzu, ihn noch zu hassen“.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: wegen seiner Träume und wegen seiner Worte
  rationale: Die doppelte Präposition wird beibehalten und „Worte“ lässt offen, ob seine Traumberichte oder sein Reden allgemein gemeint sind.
theological_decisions:
- issue: Art und Umfang von Josefs künftiger Herrschaft
  choice: Die beiden rhetorischen Fragen bleiben als Vorwurf seiner Brüder formuliert.
  alternative: Die Fragen als sichere prophetische Aussage oder als ausdrückliche Ankündigung eines Königtums deuten.
  rationale: Der Vers berichtet die Reaktion der Brüder; er entscheidet an dieser Stelle nicht ausdrücklich, in welcher genauen Form sich der Traum erfüllen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Etwa“ und „wirklich“ vermitteln die verstärkten, spöttisch-ungläubigen Fragen, ohne Umgangssprache zu verwenden; die parallelen Herrschaftsverben bleiben unterschieden.
