source:
  edition: WLC
  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: de
  text: 'Ein Mann fand ihn, als er auf dem Feld umherirrte. Der Mann fragte ihn: „Was suchst du?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: fand ihn
  rationale: מצא im Qal bedeutet gewöhnlich „finden“. Die direkte Wiedergabe passt zum erzählenden Zusammenhang.
- source_word: אִישׁ
  choice: ein Mann
  rationale: איש bezeichnet hier eine einzelne männliche Person; „ein Mann“ bewahrt den konkreten Bezug.
- source_word: וְהִנֵּה תֹעֶה
  choice: als er … umherirrte
  rationale: הנה lenkt den Blick auf die vorgefundene Situation, während תעה ein Umherirren beziehungsweise Sich-Verirren bezeichnet. Die deutsche Konstruktion gibt die anschauliche Situationsangabe natürlich wieder, ohne ausdrücklich festzulegen, dass Josef völlig verloren war.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שדה bezeichnet Feld oder offenes Land. Im Deutschen ist „auf dem Feld“ die natürliche örtliche Angabe.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: fragte ihn
  rationale: שאל bedeutet „fragen“ oder „sich erkundigen“; „fragte ihn“ ist hier idiomatisch und präzise.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt wiedergegeben
  rationale: Die hebräische Formel führt direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als ein zusätzliches „und sagte“ oder „mit den Worten“.
- source_word: מַה תְּבַקֵּשׁ
  choice: Was suchst du?
  rationale: בקש bedeutet „suchen“ beziehungsweise „nach etwas suchen“. „Was suchst du?“ ist knapp, gegenwartsbezogen und im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzählweise wird natürlich wiedergegeben; das auffordernde הנה wird nicht mechanisch mit dem heute auffälligen „siehe“ übersetzt. Keine Fußnote ist nötig, da „Was suchst du?“ die lexikalische Spannweite im Deutschen angemessen abdeckt.
