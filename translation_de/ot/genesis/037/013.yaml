base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: de
  text: 'Da sagte Israel zu Josef: „Hüten deine Brüder nicht bei Sichem die Herde?[a] Komm, ich will dich zu ihnen schicken.“ Er antwortete ihm: „Hier bin ich.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Weiden deine Brüder nicht bei Sichem die Herde?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt hier ausdrücklich den Namen Israel und nicht Jakob.
- source_word: הֲלוֹא
  choice: Hüten … nicht
  rationale: Die Formulierung bewahrt die rhetorische Frage, bei der Zustimmung erwartet wird, und klingt im Deutschen natürlich.
- source_word: אַחֶיךָ
  choice: deine Brüder
  rationale: Die maskuline Pluralform mit Suffix der zweiten Person Singular bezeichnet konkret Josefs Brüder.
- source_word: רֹעִים
  choice: hüten … die Herde
  rationale: Das Partizip von רעה bezeichnet das Weiden beziehungsweise Beaufsichtigen von Herdentieren. Die Ergänzung „die Herde“ macht den im Hebräischen kontextuell vorausgesetzten Gegenstand im Deutschen idiomatisch deutlich.
- source_word: בִּשְׁכֶם
  choice: bei Sichem
  rationale: ב kann hier „in“ oder „bei“ bedeuten. „Bei Sichem“ ist für das Weidegebiet um den Ort im Deutschen natürlich, ohne den Aufenthaltsort unnötig eng festzulegen.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ dient als Aufforderung und wird direkt wiedergegeben, ohne das zusätzliche „nun“ einzuführen.
- source_word: וְאֶשְׁלָחֲךָ
  choice: ich will dich … schicken
  rationale: Die voluntative Nuance der Form nach dem Imperativ wird durch „ich will“ angemessen ausgedrückt.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Das Pronomen verweist unmittelbar auf die zuvor genannten Brüder.
- source_word: הִנֵּנִי
  choice: Hier bin ich
  rationale: Dies ist die geläufige und würdige deutsche Wiedergabe der hebräischen Bereitschafts- und Präsenzformel.
