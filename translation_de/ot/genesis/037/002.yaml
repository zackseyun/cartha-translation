  terminology: „Geschichte Jakobs“ ist als funktionale Wiedergabe der Genesis-Formel mit der vorhandenen Fußnote vertretbar. Die üblichen deutschen Namen Josef, Bilha und Silpa sind konsistent. „Herde“ trifft בַּצֹּאן besser als die bloßen Tiere „Schafe“.
