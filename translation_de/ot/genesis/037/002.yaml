  to: Dies ist die Geschichte Jakobs:[a] Josef war siebzehn Jahre alt und hütete mit seinen Brüdern die Herde. Als junger Mann war er bei den Söhnen Bilhas und den Söhnen Silpas, den Ehefrauen seines Vaters. Josef brachte ihrem Vater einen schlechten Bericht über sie.[b]
