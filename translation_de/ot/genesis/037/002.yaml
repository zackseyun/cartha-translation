  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: de
  text: Dies ist die Geschichte Jakobs:[a] Josef war siebzehn Jahre alt und hütete mit seinen Brüdern die Herde. Als junger Mann war er bei den Söhnen Bilhas und den Söhnen Silpas, den Ehefrauen seines Vaters. Josef brachte ihrem Vater einen schlechten Bericht über sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dies sind die Geschlechterfolgen Jakobs.“ Die hebräische Wendung leitet in Genesis häufig einen neuen Abschnitt ein und kann die Geschichte bezeichnen, die von einer Person ausgeht.'
    reason: lexical_alternative
  - marker: b
    text: „Schlechter Bericht“ kann eine ungünstige Mitteilung oder Nachrede bezeichnen. Der hebräische Ausdruck legt nicht eindeutig fest, ob Josefs Mitteilung wahr oder verleumderisch war.
    reason: ambiguity
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: Geschichte
  rationale: Das Wort dient in Genesis als Gliederungsformel und bezeichnet hier die von Jakob ausgehende Familiengeschichte. „Geschichte“ ist im heutigen Deutsch natürlicher als „Geschlechterfolge“, während eine Fußnote die formelhafte Mehrdeutigkeit bewahrt.
- source_word: הָיָה רֹעֶה
  choice: hütete
  rationale: Die Konstruktion bezeichnet eine fortdauernde Tätigkeit. „Hütete“ ist die natürliche deutsche Bezeichnung für die Arbeit an der Herde.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: hütete mit seinen Brüdern die Schafe
  rationale: Die schwierige Fügung wird sachgerecht als gemeinsame Arbeit Josefs mit seinen Brüdern an der Herde verstanden, nicht als Hüten seiner Brüder.
- source_word: נַעַר
  choice: junger Mann
  rationale: Da Josef ausdrücklich siebzehn Jahre alt ist, gibt „junger Mann“ den altersbezogenen Sinn angemessen wieder, ohne ihn als kleines Kind darzustellen.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: bei den Söhnen Bilhas und den Söhnen Silpas
  rationale: Die syntaktisch schwierige Wendung beschreibt Josefs Gemeinschaft mit diesen Brüdern. „Bei“ bleibt zurückhaltend und idiomatisch.
- source_word: נְשֵׁי אָבִיו
  choice: der Frauen seines Vaters
  rationale: „Frauen“ ist hier die natürliche deutsche Wiedergabe von נָשִׁים im Sinn von Ehefrauen und vermeidet eine unnötig erklärende Formulierung.
- source_word: דִּבָּתָם רָעָה
  choice: eine schlechte Nachricht über sie
  rationale: Die Wendung bezeichnet eine ungünstige beziehungsweise belastende Mitteilung. „Schlechte Nachricht“ bleibt nahe am Wortlaut, ohne vorwegzunehmen, ob der Bericht wahr oder verleumderisch war.
- source_word: אֶל אֲבִיהֶם
  choice: ihrem Vater
  rationale: Der hebräische Pluralsuffix bedeutet ausdrücklich „ihrem Vater“ und schließt Josef mit seinen Brüdern als Söhne desselben Vaters zusammen.
theological_decisions:
- issue: Moralische Bewertung von Josefs Bericht
  choice: schlechte Nachricht
  alternative: böse Nachrede
  rationale: Der hebräische Ausdruck lässt offen, ob Josef wahrheitsgemäß Schlechtes meldete oder verleumderisch redete. Die Übersetzung soll diese moralische Spannung nicht entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze lösen die dichte hebräische Syntax lesbar auf. Die Namen folgen den im Deutschen üblichen Formen Bilha und Silpa; die Mehrdeutigkeit der Gliederungsformel und des Berichts wird durch Fußnoten bewahrt.
