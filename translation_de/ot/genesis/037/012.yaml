base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/012.yaml
  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: de
  text: Seine Brüder zogen los, um die Herde ihres Vaters bei Sichem[a] zu weiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Sichem“. Die hebräische Präposition kann sowohl einen Ort innerhalb der Stadt als auch bei ihr oder in ihrer Umgebung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: zogen los
  rationale: Das Wayyiqtol von הלך führt das nächste Ereignis der Erzählung ein. „Zogen los“ gibt die Ortsveränderung natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Der Ausdruck bezeichnet im Kontext Josefs männliche Geschwister; „Brüder“ ist daher präzise und natürlich.
- source_word: לִרְעוֹת
  choice: um … zu weiden
  rationale: 'Der Infinitiv von רעה bezeichnet hier den Zweck ihres Weggehens: die Herde zu hüten beziehungsweise grasen zu lassen. „Die Herde weiden“ ist eine geläufige deutsche Wiedergabe.'
- source_word: אֶת
  choice: '[nicht wiedergegebener Akkusativmarker]'
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigenständige Entsprechung.
- source_word: צֹאן
  choice: Herde
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Herde“ wahrt diese Offenheit, ohne die Tierart unnötig einzugrenzen.
- source_word: אֲבִיהֶם
  choice: ihres Vaters
  rationale: Die Constructusverbindung mit Pronominalsuffix drückt Besitz aus; der deutsche Genitiv ist hier knapp und idiomatisch.
- source_word: בִּשְׁכֶם
  choice: bei Sichem
  rationale: Die Präposition ב kann einen Ort innerhalb der Siedlung oder bei ihr beziehungsweise in ihrer Umgebung bezeichnen. Im Zusammenhang des Weidens passt „bei Sichem“, während die Alternative „in Sichem“ in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt erzählerisch knapp; „Sichem“ folgt der im Deutschen etablierten biblischen Namensform. Der Fußnotenmarker steht unmittelbar beim mehrdeutigen Ortsausdruck.
