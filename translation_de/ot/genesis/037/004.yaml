  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: de
  text: Als seine Brüder sahen, dass ihr Vater ihn mehr liebte als jeden seiner Brüder, hassten sie ihn und konnten nicht freundlich mit ihm reden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »konnten nicht in Frieden mit ihm reden«, das heißt, sie konnten nicht freundlich mit ihm sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Als ... sahen
  rationale: Das narrative Wayyiqtol wird hier natürlich als temporaler Nebensatz wiedergegeben und verbindet die Wahrnehmung der Brüder mit ihrer Reaktion.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was die Brüder sahen.
- source_word: אָהַב
  choice: liebte
  rationale: Das gewöhnliche Verb für »lieben« bleibt erhalten; die Bevorzugung ergibt sich aus dem Vergleich.
- source_word: אֲבִיהֶם
  choice: ihr Vater
  rationale: Das Suffix der dritten Person maskulin Plural bezieht sich auf die Brüder insgesamt.
- source_word: מִכָּל אֶחָיו
  choice: mehr ... als alle seine Brüder
  rationale: Die Vergleichskonstruktion mit מִן und כָּל wird eng am Hebräischen wiedergegeben, ohne das nicht ausdrücklich vorhandene »anderen« einzufügen.
- source_word: וַיִּשְׂנְאוּ אֹתוֹ
  choice: hassten sie ihn
  rationale: שׂנא bezeichnet direkt Hass; die schlichte deutsche Vergangenheitsform passt zur Erzählung.
- source_word: וְלֹא יָכְלוּ דַּבְּרוֹ
  choice: und konnten nicht ... mit ihm reden
  rationale: Die Konstruktion drückt Unfähigkeit aus; »mit ihm reden« ist im Deutschen natürlich und lässt sowohl Anrede als auch Gespräch zu.
- source_word: לְשָׁלֹם
  choice: friedlich
  rationale: Die Wendung bezeichnet ein Reden in Frieden beziehungsweise auf freundschaftlicher Grundlage; »friedlich« bewahrt den Bezug zu שָׁלוֹם.
