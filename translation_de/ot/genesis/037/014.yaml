  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: de
  text: 'Er sagte zu ihm: »Geh bitte und sieh nach dem Wohlergehen deiner Brüder und dem Wohlergehen der Herde[a], und bring mir Nachricht.« Dann schickte er ihn aus dem Tal von Hebron los, und er kam nach Sichem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »sieh nach, ob es deinen Brüdern und der Herde gut geht«. Das Hebräische gebraucht in beiden Satzteilen schalom (»Frieden, Wohlergehen, unversehrter Zustand«).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Geh bitte
  rationale: Der Imperativ לֶךְ bedeutet »geh«; נָא mildert die Aufforderung ab oder verleiht ihr einen bittenden Ton. »Geh bitte« gibt beides natürlich wieder.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: sieh nach dem Wohlergehen
  rationale: ראה heißt wörtlich »sehen«, bezeichnet hier aber das Erkundigen nach dem Zustand der Brüder und der Herde. »Nach dem Wohlergehen sehen« wahrt sowohl das konkrete Verb als auch den Sinn von שׁלום.
- source_word: שְׁלוֹם
  choice: Wohlergehen
  rationale: שׁלום bezeichnet hier den guten, unversehrten Zustand beziehungsweise das Wohlergehen. Die Wiederholung im Hebräischen wird auch im Deutschen beibehalten.
- source_word: אַחֶיךָ
  choice: deiner Brüder
  rationale: Die maskuline Pluralform bezieht sich im Zusammenhang ausdrücklich auf Josefs Brüder.
- source_word: הַצֹּאן
  choice: der Herde
  rationale: צאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. »Herde« ist eine natürliche Sammelbezeichnung, ohne die Tierart unnötig einzuengen.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: und bring mir Nachricht
  rationale: Die Wendung bedeutet, dass Josef mit einer Meldung zurückkommen soll. »Bring mir Nachricht« bleibt nahe am Bild des hebräischen Ausdrucks und klingt im Deutschen natürlich.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: aus dem Tal von Hebron
  rationale: עֵמֶק bedeutet »Tal«; die Konstruktion ordnet das Tal Hebron zu, ohne nur Hebron selbst als Ausgangspunkt zu nennen.
- source_word: שְׁכֶמָה
  choice: nach Sichem
  rationale: Das Richtungs-ה am Ortsnamen bezeichnet eine Bewegung auf Sichem zu; im Deutschen wird dies regulär mit »nach Sichem« ausgedrückt.
