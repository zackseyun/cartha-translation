  text: וַ/יָּ֥שָׁב אֶל אֶחָ֖י/ו וַ/יֹּאמַ֑ר הַ/יֶּ֣לֶד אֵינֶ֔/נּוּ וַ/אֲנִ֖י אָ֥נָה אֲנִי בָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: de
  text: 'Er kehrte zu seinen Brüdern zurück und sagte: »Der Junge ist weg! Und ich – wohin soll ich gehen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Er kehrte zurück
  rationale: שׁוב bezeichnet hier in der fortlaufenden Erzählung Rubens Rückkehr; »kehrte zurück« ist präzise und natürlich.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: אֶל bezeichnet die Richtung, אֶחָיו seine leiblichen Brüder im unmittelbaren Kontext.
- source_word: הַיֶּלֶד
  choice: der Junge
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten; für Josef passt »der Junge« und bewahrt die emotionale Unmittelbarkeit.
- source_word: אֵינֶנּוּ
  choice: ist weg
  rationale: Die Wendung bezeichnet Josefs Abwesenheit. »Ist weg« gibt dies idiomatisch wieder, ohne seinen Tod zu behaupten.
- source_word: וַאֲנִי
  choice: Und ich –
  rationale: Das ausdrücklich gesetzte Pronomen hebt Rubens persönliche Not hervor; der Gedankenstrich erhält den abgebrochenen, erregten Ton.
- source_word: אָנָה אֲנִי בָא
  choice: wohin soll ich gehen?
  rationale: Wörtlich steht etwa »Wohin komme ich?«; im Zusammenhang fragt Ruben verzweifelt, wohin er nun gehen beziehungsweise was er tun soll. »Wohin soll ich gehen?« bewahrt das Richtungswort und klingt natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, aufgewühlte Rede Rubens bleibt durch Ausruf und Gedankenstrich erhalten; die idiomatische Frage wird nicht zu »Was soll ich tun?« aufgelöst, damit das Bild des Gehens aus dem Hebräischen sichtbar bleibt.
