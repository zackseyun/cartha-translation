  source_fidelity: 'Der Text gibt die hebräische Abfolge und den Sinn präzise wieder: Ruben kehrt zu seinen Brüdern zurück, stellt Josefs Abwesenheit fest und äußert seine persönliche verzweifelte Frage. »Der Junge ist weg« wahrt, anders als eine Todesaussage, die im Hebräischen bestehende Unbestimmtheit über Josefs Verbleib. »Wohin soll ich gehen?« ist eine natürliche deutsche Wiedergabe der hebräischen Bewegungsfrage אָנָה אֲנִי בָא.'
