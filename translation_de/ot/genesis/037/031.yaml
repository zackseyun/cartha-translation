source:
  edition: WLC
  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: de
  text: Dann nahmen sie Josefs Gewand[a], schlachteten einen Ziegenbock und tauchten das Gewand in das Blut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tunika“; das hebräische Wort bezeichnet ein tunikaartiges Kleidungsstück.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Dann nahmen sie
  rationale: Das Wayyiqtol führt die Erzählfolge weiter. „Dann“ gibt diesen Fortgang im modernen Deutschen natürlich wieder.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: Josefs Gewand
  rationale: כְּתֹנֶת bezeichnet ein tunikaartiges Kleidungsstück. „Gewand“ ist verständlich, würdevoll und vermeidet die moderne Assoziation eines Mantels; die genauere Sachbedeutung wird in der Fußnote genannt.
- source_word: וַיִּשְׁחֲטוּ
  choice: schlachteten
  rationale: Das Verb bezeichnet das fachgerechte Töten beziehungsweise Schlachten eines Tieres und ist hier genauer als das allgemeinere „töteten“.
- source_word: שְׂעִיר עִזִּים
  choice: einen Ziegenbock
  rationale: Die Wendung bezeichnet ein männliches Tier der Ziegengattung. „Ziegenbock“ bewahrt diese Spezifizierung in natürlichem Deutsch.
- source_word: וַיִּטְבְּלוּ
  choice: tauchten
  rationale: Das Verb bedeutet „eintauchen“. Mit der Ergänzung „in das Blut“ ist „tauchten“ im Deutschen natürlich und gibt die Handlung präzise wieder.
- source_word: הַכֻּתֹּנֶת
  choice: das Gewand
  rationale: Die Wiederholung desselben deutschen Ausdrucks entspricht der Wiederholung des hebräischen Substantivs und hält den Bezug eindeutig.
- source_word: בַּדָּם
  choice: in das Blut
  rationale: Die Präposition ב kann bei einer gerichteten Eintauchbewegung im Deutschen idiomatisch mit „in“ plus Akkusativ wiedergegeben werden; der Artikel verweist auf das Blut des gerade geschlachteten Ziegenbocks.
