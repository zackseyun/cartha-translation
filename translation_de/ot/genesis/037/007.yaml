  to: 'Und seht: Wir banden mitten auf dem Feld Garben. Und seht: Meine Garbe richtete sich auf und stand auch aufrecht. Und seht: Eure Garben stellten sich rings um meine Garbe und verneigten sich vor ihr.'
  rationale: Die Überarbeitung bewahrt die dreifache Traumformel und das Bild der Garben. Sie gibt וְגַם ohne zusätzliche Steigerung oder Aspektbedeutung als „auch“ wieder und macht die von תְסֻבֶּינָה bezeichnete Bewegung rings um Josefs Garbe im Haupttext deutlich. Die Fußnoten bleiben an den jeweiligen lexikalischen Alternativen verankert.
