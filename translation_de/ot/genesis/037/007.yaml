base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: de
  text: 'Und seht: Wir banden mitten auf dem Feld Garben. Und seht: Meine Garbe richtete sich auf und stand auch aufrecht. Und seht: Eure Garben stellten sich rings um meine Garbe und verneigten sich vor ihr.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und seht
  rationale: Die dreimal wiederholte Erzählpartikel wird einheitlich und anschaulich wiedergegeben. „Seht“ bewahrt die Unmittelbarkeit des Traumberichts, ohne das altertümliche „siehe“ zu verwenden; „und“ nimmt jeweils das vorangestellte Waw auf.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: beim Garbenbinden
  rationale: Verb und verwandtes Substantiv bezeichnen das Binden von Getreide zu Garben. Die deutsche Zusammensetzung gibt den landwirtschaftlichen Vorgang natürlich und präzise wieder.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: mitten auf dem Feld
  rationale: „Mitten auf“ bewahrt die räumliche Nuance von בְּתוֹךְ und ist im Deutschen idiomatischer als „inmitten des Feldes“.
- source_word: קָמָה
  choice: richtete sich auf
  rationale: Die Form bezeichnet die aufwärts gerichtete Bewegung der Garbe und leitet natürlich zum anschließenden aufrechten Stehen über.
- source_word: וְגַם נִצָּבָה
  choice: und blieb sogar aufrecht stehen
  rationale: נצב beschreibt hier den festen, aufrechten Stand nach dem Aufrichten. „Sogar“ gibt die hervorhebende Verbindung וְגַם wieder; „blieb“ macht den Übergang vom Aufrichten zum Stehen im Deutschen klar.
- source_word: תְסֻבֶּינָה
  choice: stellten sich ringsum
  rationale: Das Verb bezeichnet ein Sich-Wenden oder Herumgehen. Im Traumzusammenhang bringt „stellten sich ringsum“ die umgebende Anordnung anschaulich zum Ausdruck, ohne eine feindliche Absicht einzutragen.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: verneigten sich
  rationale: Das Verb bezeichnet das tiefe Sich-Niederbeugen. „Verneigten sich“ ist klares modernes Deutsch und bewahrt die im Kontext erkennbare Unterordnung, ohne zusätzliche politische oder kultische Bedeutung festzulegen.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: meine Garbe / eure Garben
  rationale: „Garbe“ entspricht dem landwirtschaftlichen Zusammenhang und hält die symbolische Gegenüberstellung von Josefs Garbe und den Garben seiner Brüder deutlich.
theological_decisions:
- issue: Bedeutungsstärke der Verbeugung
  choice: verneigten sich
  alternative: warfen sich nieder
  rationale: Die Übersetzung lässt offen, ob die Traumhandlung als Ehrbezeugung, Unterwerfung oder beides verstanden wird. Die stärkere körperliche Nuance wird in einer Fußnote angeboten, statt sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die dreifache Wiederholung von „Und seht“ erhält die eindringliche, parataktische Form des hebräischen Traumberichts; kurze Hauptsätze verhindern dabei einen schwerfälligen Satzbau.
