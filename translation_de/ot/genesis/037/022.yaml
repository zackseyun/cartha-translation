  - severity: low
    issue: Idiomatiche Verneinung bei „Hand anlegen“
    rationale: Für die Gewaltwendung ist „Legt keine Hand an ihn“ im modernen Standarddeutsch die geläufigere Form und bewahrt die Bildsprache des Hebräischen.
