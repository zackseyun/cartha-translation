base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: de
  text: 'Und Ruben sagte zu ihnen: „Vergießt kein Blut! Werft ihn in diese Grube[a], die in der Steppe liegt, aber legt keine Hand an ihn!“ – um ihn aus ihrer Hand zu retten und ihn zu seinem Vater zurückzubringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zisterne“. Das hebräische Wort kann eine Grube bezeichnen, die zum Auffangen von Wasser dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Vergießt kein Blut
  rationale: Die Wiedergabe bewahrt die hebräische Wendung vom Blutvergießen und ihren Bezug zu tödlicher Gewalt, ohne sie vorschnell zu „Tötet ihn nicht“ zu verdeutlichen.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Werft ihn
  rationale: Der Imperativ bezeichnet ein tatsächliches Hineinwerfen und wird in natürlichem, modernem Deutsch wiedergegeben.
- source_word: הַבּוֹר
  choice: Grube
  rationale: בּוֹר kann eine Grube oder Zisterne bezeichnen. „Grube“ ist im Haupttext die breitere, kontextuell passende Bezeichnung; die genauere Möglichkeit wird in einer Fußnote genannt.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: hier in der Steppe
  rationale: מִדְבָּר bezeichnet häufig unbesiedeltes, trockenes Weide- oder Steppenland und nicht notwendig eine Sandwüste. „Hier“ gibt den deiktischen Sinn von „diese“ im Zusammenhang natürlich wieder.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: aber legt nicht Hand an ihn
  rationale: Die deutsche idiomatische Wendung bewahrt das Bild der Hand und bezeichnet hier, dass die Brüder Joseph nicht selbst Gewalt antun sollen.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: ihn aus ihrer Hand retten
  rationale: „Aus ihrer Hand“ bewahrt das verständliche hebräische Bild für Gewalt und Verfügungsgewalt.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: zu seinem Vater zurückbringen
  rationale: Der Hifil von שׁוב bezeichnet hier das Veranlassen der Rückkehr; „zurückbringen“ ist dafür natürliches modernes Deutsch.
theological_decisions:
- issue: Bezug und Funktion des mit לְמַעַן eingeleiteten Zwecksatzes
  choice: „So wollte er …“ als erzählerische Erklärung von Rubens Absicht
  alternative: „… – um ihn aus ihrer Hand zu retten …“
  rationale: Der Satzteil gehört nicht zu Rubens direkter Rede, sondern erläutert aus Erzählerperspektive seine verborgene Absicht. Die Formulierung macht den Wechsel deutlich, ohne die Aussage theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die anschließende Erzählerbemerkung wird klar von ihr abgesetzt. Das Bild des Blutvergießens und der rettenden Hand bleibt erhalten.
