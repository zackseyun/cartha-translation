  to: 'Und Ruben sagte zu ihnen: „Vergießt kein Blut! Werft ihn in diese Grube[a], die in der Steppe liegt, aber legt keine Hand an ihn!“ – um ihn aus ihrer Hand zu retten und ihn zu seinem Vater zurückzubringen.'
  rationale: Die Revision stellt die Relativbestimmung von אֲשֶׁר ausdrücklich dar, vermeidet das zusätzlich eingeführte „hier“ und verwendet die natürliche deutsche Wendung „keine Hand an ihn legen“. Der Gedankenstrich mit dem anschließenden Infinitivsatz kennzeichnet die hebräische Zweckangabe als Erzählerkommentar zu Rubens Absicht, ohne sie als Teil seiner direkten Rede auszugeben.
