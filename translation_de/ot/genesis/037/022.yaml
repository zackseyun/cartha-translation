  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Ruben verbietet Blutvergießen, schlägt vor, Josef in die Grube zu werfen, untersagt weitere Gewalt und verfolgt dabei die Absicht, ihn zu retten und zum Vater zurückzubringen. Die Zweckangabe ist richtig als Erzählerkommentar außerhalb der direkten Rede verstanden. „Hier in der Steppe“ gibt jedoch die Relativbestimmung („die in der Steppe ist“) weniger präzise wieder und fügt ein nicht erforderliches lokales „hier“ hinzu.'
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Legt nicht Hand an ihn“ ist zwar verständlich und bibelnah, aber die im heutigen Deutsch übliche feste Wendung lautet „Legt keine Hand an ihn.“ Die explizite Relativkonstruktion bei der Grube ist zugleich natürlicher und quellennäher.
  terminology: „Ruben“, „Blut vergießen“, „Grube“, „Steppe“, „aus ihrer Hand retten“ und „zu seinem Vater zurückbringen“ sind passende, registergerechte Entscheidungen. Die Fußnote zu „Zisterne“ bewahrt die relevante lexikalische Alternative für בּוֹר.
