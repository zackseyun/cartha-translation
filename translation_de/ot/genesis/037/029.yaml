  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: de
  text: 'Als Ruben zur Grube[a] zurückkehrte, sah er: Josef war nicht in der Grube. Da zerriss er seine Kleider[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zisterne“. Das hebräische Wort kann sowohl eine Grube als auch eine Zisterne bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Zerreißen der eigenen Kleider war ein üblicher Ausdruck von Trauer, Schock oder tiefer Bestürzung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: zurückkehrte
  rationale: Das Verb שׁוב bezeichnet hier Rubens Rückkehr an den zuvor genannten Ort; „zurückkehrte“ gibt die Bewegungsrichtung natürlich und genau wieder.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: die Grube / in der Grube
  rationale: בּוֹר kann eine Grube oder eine Zisterne bezeichnen. „Grube“ ist im Deutschen allgemein verständlich und passt zu dem Ort, in den Josef geworfen wurde; „Zisterne“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- source_word: וְהִנֵּה
  choice: 'sah er:'
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die überraschende Feststellung. Die Formulierung „sah er:“ vermittelt diese plötzliche Wahrnehmung in natürlichem modernem Deutsch, ohne das etwas altertümliche „siehe“ zu verwenden.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Josef war nicht in der Grube
  rationale: אֵין drückt hier Abwesenheit aus. Die gewählte Formulierung bleibt eng am Wortlaut und vermeidet die zusätzliche Deutung, Josef sei „verschwunden“.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: Da zerriss er seine Kleider
  rationale: Das Zerreißen der Kleider ist die im Hebräischen beschriebene konventionelle Gebärde heftiger Trauer, Bestürzung oder Verzweiflung. „Kleider“ ist würdig und zugleich geläufig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Aufmerksamkeitsmarker הִנֵּה wird durch die pointierte Wahrnehmungsformel „sah er:“ wiedergegeben; die Wiederholung von „Grube“ bleibt erhalten, um der hebräischen Erzählstruktur zu folgen.
