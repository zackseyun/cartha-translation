  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: de
  text: Kommt, wir wollen ihn an die Ismaeliter verkaufen; und wir wollen nicht Hand an ihn legen, denn er ist unser Bruder, unser eigenes Fleisch. Und seine Brüder hörten auf ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und seine Brüder stimmten ihm zu.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Imperativ Plural von הלך dient hier als auffordernder Gesprächsauftakt; „Kommt“ gibt ihn knapp und natürlich wieder.
- source_word: וְנִמְכְּרֶנּוּ
  choice: wir wollen ihn verkaufen
  rationale: Die Kohortativform drückt einen gemeinsamen Vorschlag aus. „Wir wollen“ bewahrt diesen auffordernden Willenscharakter.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: an die Ismaeliter
  rationale: Die Präposition mit dem bestimmten Völkernamen bezeichnet die Käufer; „an die Ismaeliter verkaufen“ ist idiomatisches Deutsch.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: doch wir wollen nicht Hand an ihn legen
  rationale: Die deutsche Wendung bewahrt das Bild der Hand und vermittelt zugleich natürlich, dass sie ihm nicht selbst Gewalt antun sollen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet Judas Begründung ein.
- source_word: אָחִינוּ
  choice: unser Bruder
  rationale: Direkte Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: בְשָׂרֵנוּ
  choice: unser eigenes Fleisch
  rationale: Die konkrete hebräische Verwandtschaftsmetapher bleibt erhalten; „eigenes“ verdeutlicht ihre Aussage über die enge Blutsverwandtschaft.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: Und seine Brüder hörten auf ihn
  rationale: שמע kann hören, zuhören oder gehorchend Folge leisten bedeuten. „Auf ihn hören“ bewahrt die lexikalische Bildlichkeit und zeigt im Kontext, dass sie seinen Vorschlag annahmen.
