  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: de
  text: 'Da erhoben sich alle seine Söhne und alle seine Töchter, um ihn zu trösten; doch er weigerte sich, sich trösten zu lassen, und sagte: »Denn ich werde trauernd zu meinem Sohn in die Scheol hinabsteigen.« Und sein Vater beweinte ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da standen … auf
  rationale: Das narrative Qal von קום wird natürlich und bewegungsnah wiedergegeben.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: alle seine Söhne und alle seine Töchter
  rationale: Die ausdrücklich genannten männlichen und weiblichen Nachkommen bleiben erhalten.
- source_word: לְנַחֲמוֹ / לְהִתְנַחֵם
  choice: um ihn zu trösten / sich nicht trösten lassen
  rationale: Die aktive Piel-Form und die medial-passive Hitpael-Form werden im Deutschen idiomatisch aufeinander bezogen.
- source_word: וַיְמָאֵן
  choice: er wollte … nicht
  rationale: Gibt die entschiedene Weigerung in natürlichem modernem Deutsch wieder.
- source_word: כִּי
  choice: Nein
  rationale: In diesem Zusammenhang bekräftigt כִּי Jakobs ablehnende Antwort und leitet seine Begründung ein; deutsches »Nein« stellt den Anschluss an die verweigerte Tröstung natürlich her.
- source_word: אֵרֵד
  choice: werde ich … hinabsteigen
  rationale: Bewahrt sowohl den Zukunftsbezug als auch die räumliche Abwärtsbewegung von ירד.
- source_word: אֶל־בְּנִי
  choice: zu meinem Sohn
  rationale: Die normale Zielbedeutung von אֶל bleibt ohne erklärenden Zusatz erhalten.
- source_word: אָבֵל
  choice: trauernd
  rationale: Gibt Jakobs Zustand knapp und idiomatisch wieder und bewahrt den Bezug zum Hinabsteigen.
- source_word: שְׁאֹלָה
  choice: ins Totenreich
  rationale: Bezeichnet im Deutschen verständlich den Bereich der Toten, ohne den Ausdruck auf das einzelne Grab zu verengen oder eine spätere Höllenvorstellung einzutragen.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: Und sein Vater beweinte ihn
  rationale: Bewahrt Jakob als ausdrücklich bezeichnetes Subjekt und Josef als Objekt; »beweinte« passt zum Trauerkontext.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: »Totenreich« ist verständlich und semantisch weiter als »Grab«. Es vermeidet zugleich, die alttestamentliche Vorstellung mit einer ausgebauten Lehre von Hölle oder Jenseits gleichzusetzen.
- issue: Bezug von אָבֵל im Satz
  choice: »trauernd« bezieht sich auf Jakobs Hinabsteigen
  alternative: »Ich werde trauernd ins Totenreich zu meinem Sohn hinabsteigen«
  rationale: Der hebräische Sinn bleibt erhalten; die gewählte deutsche Stellung ist klar und natürlich, ohne die syntaktische Zuordnung dogmatisch zu überfrachten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt emotional knapp. »Totenreich« macht den hebräischen Begriff verständlich, während die Fußnote die Form »Scheol« und die engere Alternative »Grab« dokumentiert.
