review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Satzglieder sind korrekt erfasst: die ausdrücklich unterschiedenen Söhne und Töchter, der Trostversuch, Jakobs Weigerung, das Hinabsteigen zu seinem Sohn und das Weinen des Vaters. »Nein« für כִּי ist jedoch nicht quellentreu; כִּי leitet hier die Begründung bzw. den Inhalt seiner Weigerung ein und ist mit »Denn« wiederzugeben. Die Wiedergabe von שְׁאוֹל als »Totenreich« ist zwar vertretbar, legt den Begriff aber stärker aus als nötig; die Transliteration »Scheol« erhält die im Hebräischen bewusst nicht weiter bestimmte Vorstellung besser.'
  naturalness: Der Entwurf ist überwiegend natürliches modernes Standarddeutsch. »Er wollte sich nicht trösten lassen« ist idiomatisch, doch »er weigerte sich, sich trösten zu lassen« gibt die Entschiedenheit von וַיְמָאֵן genauer wieder. Die direkte Rede bleibt mit der korrigierten Einleitung knapp und würdig.
  terminology: »Scheol« sollte im Haupttext stehen, da der hebräische Ausdruck weder auf ein einzelnes Grab noch eindeutig auf ein ausgearbeitetes »Totenreich« festgelegt ist. Die Fußnote kann »ins Grab« als engere mögliche Wiedergabe nennen, ohne die Bedeutung von Scheol definitorisch festzulegen.
  issues:
  - severity: medium
    issue: »Nein« gibt כִּי wieder.
    rationale: Das hebräische כִּי ist hier keine eigenständige Verneinung, sondern begründet bzw. erläutert Jakobs Weigerung. »Nein« fügt eine im Ausgangstext nicht ausgedrückte Zurückweisung hinzu.
  - severity: low
    issue: »Totenreich« im Haupttext interpretiert שְׁאוֹל.
    rationale: Die Wiedergabe ist semantisch möglich, aber die Transliteration »Scheol« bewahrt die historische und theologische Offenheit des hebräischen Begriffs besser.
  revised_text: 'Da erhoben sich alle seine Söhne und alle seine Töchter, um ihn zu trösten; doch er weigerte sich, sich trösten zu lassen, und sagte: »Denn ich werde trauernd zu meinem Sohn in die Scheol hinabsteigen.« Und sein Vater beweinte ihn.'
  revised_footnotes:
