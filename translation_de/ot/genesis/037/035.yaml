revisions:
- from: 'Da standen alle seine Söhne und alle seine Töchter auf, um ihn zu trösten. Doch er wollte sich nicht trösten lassen und sagte: »Nein, trauernd werde ich zu meinem Sohn ins Totenreich[a] hinabsteigen.« Und sein Vater beweinte ihn.'
  to: 'Da erhoben sich alle seine Söhne und alle seine Töchter, um ihn zu trösten; doch er weigerte sich, sich trösten zu lassen, und sagte: »Denn ich werde trauernd zu meinem Sohn in die Scheol hinabsteigen.« Und sein Vater beweinte ihn.'
  rationale: Die Revision ersetzt das nicht gedeckte »Nein« durch das begründende »Denn« und transliteriert Scheol im Haupttext, um weder »Grab« noch eine näher bestimmte Jenseitsvorstellung vorwegzunehmen. Die übrigen Anpassungen sind vorsichtige stilistische Präzisierungen bei unverändertem Sinn und Register.
