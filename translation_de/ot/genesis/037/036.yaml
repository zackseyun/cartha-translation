  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: de
  text: Die Medaniter[a] verkauften ihn nach Ägypten an Potifar, einen Hofbeamten[b] des Pharaos, den Obersten der Leibwache[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Medaniter“. Im Zusammenhang der Erzählung werden sie häufig mit den Midianitern gleichgesetzt; so verstehen es auch alte Übersetzungen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einen Eunuchen“ beziehungsweise „einen königlichen Beamten“. Das hebräische Wort kann einen tatsächlichen Eunuchen oder allgemein einen Hofbeamten bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Oberster der Schlachter“; möglicherweise ist der Befehlshaber der Henker oder der königlichen Leibwache gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Die Medaniter
  rationale: Der masoretische Text bezeichnet die Gruppe ausdrücklich als Medaniter. Das einleitende וְ setzt die Erzählung fort; im Deutschen ist dafür keine eigene Konjunktion nötig. Die Identifizierung mit den Midianitern wird wegen des Zusammenhangs in einer Fußnote genannt.
- source_word: מָכְרוּ אֹתוֹ
  choice: verkauften ihn
  rationale: Das Qal-Perfekt wird in der fortlaufenden Erzählung natürlich mit dem Präteritum wiedergegeben; das Objektpronomen bezieht sich auf Josef.
- source_word: אֶל מִצְרָיִם
  choice: nach Ägypten
  rationale: אֶל bezeichnet hier die Richtung beziehungsweise das Ziel. „Nach Ägypten“ ist die natürliche deutsche Wiedergabe und lässt offen, ob der Verkauf auf dem Weg oder erst dort abgeschlossen wurde.
- source_word: לְפוֹטִיפַר
  choice: an Potifar
  rationale: Die Präposition לְ kennzeichnet Potifar als Käufer; „an jemanden verkaufen“ ist idiomatisches Deutsch.
- source_word: סְרִיס פַּרְעֹה
  choice: einen Hofbeamten des Pharaos
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. „Hofbeamter“ gibt die Amtsfunktion wieder, ohne eine körperliche Bedeutung festzulegen.
- source_word: שַׂר הַטַּבָּחִים
  choice: den Obersten der Leibwache
  rationale: Wörtlich ist dies der „Oberste der Schlachter/Henker“. Im königlichen Zusammenhang bezeichnet die Wendung wahrscheinlich den Befehlshaber einer Leibwache mit Vollstreckungsaufgaben.
