base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: de
  text: 'Er sagte: „Ich suche meine Brüder. Sag mir bitte, wo sie die Herde weiden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Das narrative Wayyiqtol von אמר wird im modernen deutschen Erzählstil natürlich ohne ein zusätzliches „und“ wiedergegeben.
- source_word: אֶת אַחַי
  choice: meine Brüder
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt; אַחַי bezeichnet im Kontext Josefs männliche Geschwister.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Ich suche
  rationale: Das selbstständige Pronomen mit Partizip bezeichnet eine gegenwärtig andauernde Suche. Das deutsche Präsens gibt diesen Verlauf idiomatisch wieder.
- source_word: הַגִּידָה נָּא לִי
  choice: Sag mir bitte
  rationale: Der Hifil-Imperativ von נגד mit נָא formuliert eine höfliche Bitte; „Sag mir bitte“ bewahrt Aufforderung und Höflichkeit in natürlichem Deutsch.
- source_word: אֵיפֹה הֵם רֹעִים
  choice: wo sie die Herde weiden
  rationale: רֹעִים ist das Qal-Partizip von רעה und bezeichnet hier das Hüten beziehungsweise Weiden von Tieren. Im Deutschen verlangt die natürliche Formulierung meist ein Objekt; „die Herde“ ist aus dem unmittelbaren Kontext erschlossen.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdevoller Erzählstil. Die direkte Rede klingt natürlich; „Brüder“ und die höfliche Bitte bleiben ausdrücklich erhalten.
