base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: de
  text: 'Dann schickten sie das langärmelige Gewand[a] und brachten es zu ihrem Vater. Sie sagten: „Das hier haben wir gefunden. Erkenne bitte[b], ob es das Gewand deines Sohnes ist oder nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch „langes Gewand“ oder „verziertes Gewand“ möglich; traditionell: „buntes Gewand“. Der hebräische Ausdruck ist in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stell bitte fest“. Das hebräische Verb kann „erkennen“ oder „identifizieren“ bedeuten. Das Motiv des Erkennens und Nichterkennens kehrt in der Erzählung bedeutsam wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Dann schickten sie
  rationale: Das Piel von שׁלח bedeutet hier im Erzählzusammenhang natürlich „schicken/senden“; „Dann“ gibt die narrative Abfolge wieder.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: das langärmelige Gewand
  rationale: כְּתֹנֶת bezeichnet ein Gewand bzw. Untergewand. Die genaue Bedeutung von פַּסִּים ist unsicher; wahrscheinlich ist ein bis zu Handflächen oder Fußsohlen reichendes und damit langes, möglicherweise langärmeliges Kleidungsstück gemeint. Die traditionelle Farbangabe ist lexikalisch nicht gesichert.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: und ließen es ihrem Vater bringen
  rationale: In Verbindung mit dem vorausgehenden „schickten“ kann die Verbfolge bedeuten, dass die Brüder das Gewand übersandten und durch Boten zum Vater bringen ließen. Diese Wiedergabe vermeidet im Deutschen den Eindruck, dieselben Personen hätten es zugleich geschickt und selbst gebracht.
- source_word: זֹאת מָצָאנוּ
  choice: Das hier haben wir gefunden
  rationale: Die Formulierung bewahrt die knappe, täuschend schlichte Aussage und hebt wie das vorangestellte Demonstrativ im Hebräischen den vorgelegten Gegenstand hervor.
- source_word: הַכֶּר נָא
  choice: Sieh bitte nach
  rationale: Das Hifil von נכר bedeutet „erkennen, identifizieren“. „Sieh bitte nach“ klingt in modernem Deutsch natürlich, wahrt den auffordernden Charakter und führt passend zur indirekten Frage.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: ob es das Gewand deines Sohnes ist oder nicht
  rationale: Die indirekte Entscheidungsfrage gibt אִם לֹא („ob … oder nicht“) genau wieder. „Deines Sohnes“ bewahrt die auffällige Distanzierung der Brüder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die etwas manipulative Höflichkeit der Brüder bleibt durch „bitte“ erhalten. Die lexikalische Unsicherheit der Gewandbezeichnung sowie das wiederkehrende Erkennungsmotiv werden in einer Fußnote offengelegt.
