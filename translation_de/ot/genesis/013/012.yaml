  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: de
  text: Abram wohnte im Land Kanaan, Lot aber wohnte in den Städten der Ebene und schlug seine Zelte bis nach Sodom hin auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und zeltete bis nach Sodom hin“. Das hebräische Verb kann das Zelten oder das Aufschlagen eines Zeltes bezeichnen. Gemeint ist, dass Lot sein Lager bis in Richtung Sodom ausdehnte; der Vers sagt nicht zwingend, dass er damals schon in der Stadt selbst wohnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: wohnte
  rationale: Das Verb bezeichnet hier das Wohnen oder den dauerhafteren Aufenthalt. „Wohnte“ ist modernes, natürliches Deutsch und bewahrt die Parallelität der beiden Aussagen über Abram und Lot.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei und entspricht zugleich dem üblichen deutschen Namen.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: in den Städten der Ebene
  rationale: כִּכָּר bezeichnet hier die Ebene beziehungsweise das ebene Gebiet im Jordantal. „Ebene“ bleibt nah am hebräischen Ausdruck, ohne den im Vers nicht ausdrücklich genannten Jordan einzufügen.
- source_word: וַיֶּאֱהַל
  choice: und zeltete
  rationale: Das von אֹהֶל („Zelt“) abgeleitete Verb bezeichnet das Zelten beziehungsweise Aufschlagen eines Zeltes. „Zeltete“ gibt dies knapp und ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt wieder.
- source_word: עַד סְדֹם
  choice: bis nach Sodom hin
  rationale: עַד bezeichnet die räumliche Ausdehnung oder Grenze. Die Formulierung beschreibt Lots Bewegung beziehungsweise Lagerplätze in Richtung Sodom, ohne eindeutig zu behaupten, dass er zu diesem Zeitpunkt bereits in der Stadt wohnte.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לוֹט
  choice: Lot
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: סְדֹם
  choice: Sodom
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben.
