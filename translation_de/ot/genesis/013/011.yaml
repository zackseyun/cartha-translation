  source_fidelity: 'Der Text gibt die hebräische Abfolge und die wesentlichen Elemente zuverlässig wieder: Lots persönliche Wahl („für sich“), die gesamte Jordanebene, sein Aufbrechen/Ziehen sowie die gegenseitige Trennung. „Nach Osten“ ist eine gut vertretbare Hauptlesart für מִקֶּדֶם; die alternative Deutung wird korrekt in der Fußnote erhalten.'
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen sachlichem Erzählton. „Da wählte“, „zog“ und „sie trennten sich voneinander“ sind idiomatisch. Die Wiederholung von „Lot“ entspricht der hebräischen Erzählweise, ohne im Deutschen störend zu wirken.
  terminology: „Jordanebene“ ist eine natürliche und hinreichend genaue Wiedergabe von כִּכַּר הַיַּרְדֵּן. „Für sich“ bildet den hebräischen Dativ sinnvoll ab. „Voneinander“ gibt den gegenseitigen Sinn von אִישׁ מֵעַל אָחִיו idiomatisch wieder; die explizite Verwandtschaftsbezeichnung wird dabei zwar nicht reproduziert, ist in diesem Kontext jedoch keine für den Versinhalt erforderliche zusätzliche Aussage.
