  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: de
  text: Da wählte Lot für sich die ganze Jordanebene. Dann zog Lot nach Osten[a], und sie trennten sich voneinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Osten her“. Die hebräische Wendung kann entweder die Bewegungsrichtung oder den Ausgangspunkt angeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: wählte … für sich
  rationale: Das Verb בחר bedeutet „wählen“; der Dativ לוֹ wird als „für sich“ wiedergegeben und hebt Lots eigene Wahl hervor.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: die ganze Jordanebene
  rationale: כִּכָּר bezeichnet hier die ebene Landschaft im Jordangebiet. „Jordanebene“ ist im Deutschen natürlich und geografisch hinreichend präzise.
- source_word: וַיִּסַּע
  choice: zog
  rationale: נסע bezeichnet häufig das Aufbrechen beziehungsweise Weiterziehen eines Lagers. „zog“ passt knapp und natürlich in die Erzählung.
- source_word: מִקֶּדֶם
  choice: nach Osten
  rationale: Die Präposition kann hier eine Bewegungsrichtung („nach Osten“) oder einen Ausgangspunkt („von Osten her“) bezeichnen. Der Kontext legt die Richtung nach Osten näher.
- source_word: וַיִּפָּרְדוּ
  choice: sie trennten sich
  rationale: Der Nifal von פרד beschreibt die gegenseitige Trennung klar und idiomatisch.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: voneinander
  rationale: Die distributive hebräische Wendung lautet wörtlich etwa „ein Mann von seinem Bruder weg“, bezeichnet hier aber idiomatisch die gegenseitige Trennung Abrams und Lots. „voneinander“ gibt den Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Verwandtschaftssprache in אִישׁ מֵעַל אָחִיו
  choice: voneinander
  alternative: jeder von seinem Bruder
  rationale: Die wörtliche Verwandtschaftssprache wird nicht eigens abgebildet, weil die deutsche Formulierung „jeder von seinem Bruder“ an dieser Stelle schwerfällig und potenziell missverständlich wäre. Der wechselseitige Sinn bleibt vollständig erhalten.
- issue: Richtungsmehrdeutigkeit von מִקֶּדֶם
  choice: nach Osten
  alternative: von Osten her
  rationale: Im Zusammenhang mit Lots Wahl der Jordanebene ist die Bewegungsrichtung nach Osten am plausibelsten. Die grammatisch mögliche Herkunftsangabe bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am hebräischen Narrativ; das wiederholte „Lot“ wird bewusst erhalten.
