  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: de
  text: Abram war sehr reich an Vieh, Silber und Gold.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Das ו führt die Erzählung fort. Im Deutschen ist an dieser Stelle kein ausdrücklich wiedergegebenes „und“ nötig; der Anschluss ergibt sich natürlich aus dem Kontext. Der Personenname bleibt als Abram erhalten.
- source_word: כָּבֵד מְאֹד
  choice: sehr reich
  rationale: כָּבֵד bedeutet wörtlich „schwer“, bezeichnet hier zusammen mit den aufgeführten Gütern aber idiomatisch großen Reichtum. מְאֹד verstärkt die Aussage und wird natürlich mit „sehr“ wiedergegeben.
- source_word: בַּ/מִּקְנֶה
  choice: an Vieh
  rationale: מִקְנֶה bezeichnet erworbenen Besitz, besonders Herden beziehungsweise Nutztiere. „Vieh“ ist hier prägnant und im patriarchalischen Kontext sachgerecht.
- source_word: בַּ/כֶּסֶף
  choice: Silber
  rationale: כֶּסֶף bezeichnet hier Silber als eine Kategorie von Abrams Reichtum. Die einmalige deutsche Konstruktion „reich an“ erstreckt sich natürlich auf alle drei Glieder.
- source_word: וּ/בַ/זָּהָב
  choice: und Gold
  rationale: זָהָב wird direkt mit „Gold“ wiedergegeben; das ו verbindet das letzte Glied der Aufzählung mit „und“.
