translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „beieinander wohnen konnten“ wird entsprechend der markanten hebräischen Wiederholung bewahrt; „tragen“ erhält das konkrete Bild der begrenzten Tragfähigkeit des Landes.
