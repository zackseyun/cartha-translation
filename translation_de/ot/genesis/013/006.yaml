  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: de
  text: Und das Land reichte nicht aus, damit sie beieinander wohnen konnten, denn ihr Besitz war so groß, dass sie nicht beieinander wohnen konnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: tragen
  rationale: Das hebräische Verb bedeutet wörtlich „tragen“ und bezeichnet hier die Tragfähigkeit des Landes für beide Haushalte und ihre Herden. Die natürliche deutsche Wendung bewahrt zugleich das Bild des Ausgangstextes.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: beieinander wohnen
  rationale: יָשַׁב bezeichnet hier dauerhaftes Wohnen bzw. Ansässigsein; יַחְדָּו meint das räumliche Zusammenleben. „Beieinander wohnen“ gibt dies idiomatisch wieder, ohne völlige Haushaltsgemeinschaft zu unterstellen.
- source_word: רְכוּשָׁם רָב
  choice: ihr Besitz war so groß
  rationale: רְכוּשׁ umfasst Habe, Vermögen und insbesondere den umfangreichen Viehbestand. „Besitz“ ist breit genug; „so groß, dass“ bildet die im Kontext ausgedrückte Folge natürlich ab.
