  terminology: „Eichen Mamres“ ist als Hauptlesart vertretbar, sofern die mögliche Deutung als Terebinthen in der Fußnote erhalten bleibt. „Jahwe“ gibt יהוה als Eigenname angemessen wieder; „Altar“ ist der etablierte Ausdruck für מִזְבֵּחַ.
