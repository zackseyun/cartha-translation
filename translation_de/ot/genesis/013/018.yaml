base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: de
  text: Abram zog mit seinem Zelt weiter. Er kam zu den Eichen Mamres[a] in Hebron und ließ sich dort nieder. Dort baute er Jahwe[b] einen Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Terebinthen Mamres«. Das hebräische Wort kann große Bäume wie Eichen oder Terebinthen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH (יהוה); der Gottesname wird traditionell auch mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: zog … mit seinem Zelt weiter
  rationale: Das von אהל abgeleitete Verb bezeichnet hier das Zelten beziehungsweise das Weitersetzen des Zeltes. Die Formulierung gibt die Bewegung im Zusammenhang natürlich wieder, ohne das anschließende Kommen und Niederlassen vorwegzunehmen.
- source_word: וַיָּבֹא
  choice: Er kam
  rationale: Das häufige Bewegungsverb בוא wird schlicht und entsprechend der hebräischen Erzählfolge wiedergegeben.
- source_word: וַיֵּשֶׁב
  choice: ließ sich dort nieder
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise Ansässigwerden. „Sich niederlassen“ ist modernes, natürliches Deutsch und passt zu Abrams Aufenthalt mit seinem Zelt.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: zu den Eichen Mamres
  rationale: אֵלֹנֵי bezeichnet große Bäume und kann speziell Eichen oder Terebinthen meinen. „Eichen“ ist eine klare, geläufige Wiedergabe; die botanische Unsicherheit wird in einer Fußnote bewahrt.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: bei Hebron
  rationale: Die knappe Ortsangabe gibt den lokalisierenden Relativsatz idiomatisch wieder, ohne einen zeitlichen Unterschied zwischen „sind“ und „waren“ einzutragen.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Dort baute er … einen Altar
  rationale: Die Stellung von „Dort“ bewahrt die örtliche Hervorhebung durch שָׁם; מִזְבֵּחַ ist der übliche Ausdruck für einen Altar.
- source_word: לַיהוָה
  choice: Jahwe einen Altar
  rationale: Die deutsche Dativkonstruktion gibt die Ziel- beziehungsweise Widmungsbeziehung von לְ natürlich wieder. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname; die in deutschen Bibeln verbreitete Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Bestimmung der Baumart in אֵלֹנֵי מַמְרֵא
  choice: Eichen Mamres
  alternative: Terebinthen Mamres / große Bäume Mamres
  rationale: Die genaue Baumart ist lexikalisch nicht sicher. Der Haupttext verwendet die geläufige Wiedergabe „Eichen“, während die echte Unsicherheit in der Fußnote sichtbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Erzählsätzen. Die hebräische Handlungsfolge bleibt erkennbar; unnötig altertümliche Wörter wie „wohnte“ im Sinne von „weilte“ werden vermieden. Die botanische Unsicherheit und die ausdrückliche Verwendung des Gottesnamens werden transparent gemacht.
