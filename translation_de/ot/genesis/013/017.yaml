  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: de
  text: Mach dich auf und durchzieh[a] das Land seiner Länge und Breite nach; denn dir werde ich es geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geh im Land umher, seiner Länge und Breite nach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּם
  choice: Mach dich auf
  rationale: Der Imperativ von קום fordert Abram zum Aufstehen und Handeln auf. „Mach dich auf“ ist im Deutschen würdevoll und natürlich, ohne das Verb auf eine bloße Körperbewegung zu verengen.
- source_word: הִתְהַלֵּ֣ךְ בָּאָ֔רֶץ
  choice: durchzieh das Land
  rationale: Der Hitpael-Imperativ von הלך bezeichnet hier ein Umhergehen beziehungsweise Durchwandern. „Durchzieh das Land“ gibt im Zusammenhang mit Länge und Breite die Bewegung durch sein ganzes Gebiet prägnant wieder.
- source_word: לְאָרְכָּ֖הּ וּלְרָחְבָּ֑הּ
  choice: seiner Länge und Breite nach
  rationale: Die gepaarte Wendung beschreibt die gesamte Ausdehnung des Landes. Die deutsche Fügung bewahrt beide räumlichen Begriffe und klingt zugleich idiomatisch.
- source_word: כִּ֥י
  choice: denn
  rationale: כִּי leitet hier die Begründung für den vorausgehenden Befehl ein.
- source_word: לְךָ֖ אֶתְּנֶֽנָּה
  choice: dir werde ich es geben
  rationale: Die vorangestellte Empfängerangabe לְךָ wird durch „dir“ hervorgehoben; das feminine Objektsuffix bezieht sich auf das Land, und der Imperfekt hat im Kontext Verheißungscharakter.
theological_decisions:
- issue: Bezug des femininen Objektsuffixes in אֶתְּנֶנָּה
  choice: „es“ bezieht sich auf das Land, das Gott Abram zu geben verheißt.
  alternative: 'Das Bezugswort ausdrücklich wiederholen: „denn dir werde ich das Land geben“.'
  rationale: Das feminine Singularsuffix verweist grammatisch unmittelbar auf אֶרֶץ. Das Pronomen bewahrt die Form des Ausgangstextes, ohne über die Verheißung hinaus zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller, knapper Befehlssprache. Das Semikolon verdeutlicht den Übergang vom Auftrag zu seiner Begründung.
