  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: de
  text: Liegt nicht das ganze Land vor dir? Bitte trenn dich von mir. Gehst du nach links[a], so gehe ich nach rechts; und gehst du nach rechts, so gehe ich nach links.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedingungssätze sind im Hebräischen verkürzt; wörtlich etwa: „Wenn links, dann will ich nach rechts gehen; und wenn rechts, dann will ich nach links gehen.“ Das Verb „gehen“ ist in der Übersetzung zum besseren Verständnis ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Liegt nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet; zusammen mit לְפָנֶיךָ ergibt sich im Deutschen die natürliche räumliche Formulierung.
- source_word: כָל הָאָרֶץ
  choice: das ganze Land
  rationale: אָרֶץ bezeichnet hier das zur Ansiedlung vor ihnen liegende Gebiet, nicht die gesamte Erde.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Bewahrt das räumliche Bild des Hebräischen und ist im Deutschen idiomatisch.
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: Trenn dich doch von mir
  rationale: Der Nifal-Imperativ wird im Deutschen natürlich reflexiv wiedergegeben; „doch“ vermittelt hier die höflich-bittende Nuance von נָא, ohne einen schroffen Befehl zu formulieren.
- source_word: אִם הַשְּׂמֹאל
  choice: Gehst du nach links
  rationale: Die hebräische Bedingung ist elliptisch; das Bewegungsverb wird für klares, natürliches Deutsch aus dem Zusammenhang ergänzt.
- source_word: וְאֵימִנָה
  choice: so gehe ich nach rechts
  rationale: Die Richtungsform von ימין bezeichnet die Bewegung zur rechten Seite; „so“ kennzeichnet den Folgesatz.
- source_word: וְאִם הַיָּמִין
  choice: und gehst du nach rechts
  rationale: Die parallele elliptische Wendung wird ebenso durch ein aus dem Zusammenhang ergänztes Bewegungsverb verständlich gemacht.
- source_word: וְאַשְׂמְאִילָה
  choice: so gehe ich nach links
  rationale: Die Richtungsform von שׂמאל bezeichnet Abrams entsprechende Bewegung zur linken Seite und wahrt den Parallelismus.
