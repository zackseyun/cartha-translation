  text: וְ/גַם לְ/ל֔וֹט הַ/הֹלֵ֖ךְ אֶת אַבְרָ֑ם הָיָ֥ה צֹאן וּ/בָקָ֖ר וְ/אֹהָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: de
  text: Und auch Lot, der mit Abram zog, hatte Kleinvieh[a], Rinder und Zelte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Kleinvieh, besonders Schafe und Ziegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Die Verbindung aus Konjunktion und Adverb knüpft an den vorherigen Vers an und hebt hervor, dass auch Lot Besitz hatte.
- source_word: לְלוֹט ... הָיָה
  choice: Lot ... hatte
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich etwa »für Lot war«; im natürlichen Deutschen wird sie mit »Lot hatte« wiedergegeben.
- source_word: הַהֹלֵךְ אֶת־אַבְרָם
  choice: der mit Abram zog
  rationale: Das Partizip beschreibt Lot als Abrams Begleiter; »mit Abram zog« bewahrt den fortdauernden Begleitsinn in knapper, idiomatischer Form.
- source_word: צֹאן
  choice: Kleinvieh
  rationale: Der Sammelbegriff bezeichnet vor allem Schafe und Ziegen; »Kleinvieh« gibt den Umfang genauer wieder als das möglicherweise nur auf Schafe bezogene »Schafe«.
- source_word: וּבָקָר
  choice: Rinder
  rationale: Der Ausdruck bezeichnet Rindvieh und bildet die sachlich passende Ergänzung zu »Kleinvieh«.
- source_word: וְאֹהָלִים
  choice: und Zelte
  rationale: Der Plural bezeichnet unmittelbar Zelte, die hier zum Besitz und Hausverband Lots gehören.
