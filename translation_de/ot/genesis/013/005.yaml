  source_fidelity: 'Die Übersetzung gibt alle wesentlichen hebräischen Elemente angemessen wieder: וְגַם als anschließendes und additives „Und auch“, die possessive Konstruktion לְלוֹט ... הָיָה idiomatisch als „Lot ... hatte“, das attributive Partizip als Begleitung Abrams sowie die drei Besitzkategorien צֹאן, בָּקָר und אֹהָלִים. „Kleinvieh“ bewahrt den weiteren Umfang von צֹאן besser als eine Beschränkung auf Schafe.'
  naturalness: „Und auch Lot, der mit Abram zog, hatte Kleinvieh, Rinder und Zelte“ ist klares, modernes Standarddeutsch und wahrt einen knappen erzählerischen Bibelregisterton. Die Satzstellung ist leicht traditionell gefärbt, aber natürlich und passend zum narrativen Anschluss.
