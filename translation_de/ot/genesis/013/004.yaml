source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: de
  text: zu der Stelle des Altars, den er dort früher errichtet hatte. Dort rief Abram den Namen Jahwes an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch bedeuten: „den Namen Jahwes verkünden“ oder „Jahwe beim Namen anrufen“. Hebräisch: JHWH; traditionell „der HERR“.'
    reason: Bewahrt die Bedeutungsbreite der Wendung und nennt die traditionelle Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: Stelle des Altars
  rationale: „Stelle“ bezeichnet hier natürlich den konkreten Ort des bereits erwähnten Altars.
- source_word: אֲשֶׁר עָשָׂה שָׁם
  choice: den er dort errichtet hatte
  rationale: Bei einem Altar ist „errichten“ im Deutschen idiomatischer als das wörtliche „machen“; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: בָּרִאשֹׁנָה
  choice: früher
  rationale: Das Adverb verweist auf Abrams früheren Aufenthalt und klingt im modernen Deutschen natürlicher als „zuerst“.
- source_word: וַיִּקְרָא שָׁם אַבְרָם בְּשֵׁם יְהוָה
  choice: Dort rief Abram den Namen Jahwes an
  rationale: Die Formulierung bewahrt den hebräischen Namensbezug und gibt den kultischen Sinn des Anrufens wieder, ohne ihn auf Gebet oder Verkündigung einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens macht das Tetragramm als Eigennamen erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; „Jahwe“ bewahrt ihn als Eigennamen, während die traditionelle Wiedergabe „der HERR“ in der Fußnote genannt wird.
- issue: Bedeutung der Wendung קרא בשם יהוה
  choice: den Namen Jahwes anrufen
  alternative: den Namen Jahwes verkünden / Jahwe beim Namen anrufen
  rationale: Die hebräische Wendung kann Anrufung und Verkündigung anklingen lassen. Der Haupttext gibt den wahrscheinlichen kultischen Sinn wieder; die Fußnote hält die weitere Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „dort“ bleibt entsprechend dem hebräischen Text erhalten; „Altar“ wahrt die kultische Präzision.
