  register: Modernes, würdiges Standarddeutsch. Die markierte hebräische Bewegungsrichtung »hinauf« und die knappe aufzählende Struktur wurden beibehalten; die Mehrdeutigkeit von נֶגֶב wird durch die Fußnote offengehalten.
