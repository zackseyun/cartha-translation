  text: וַ/יַּעַל֩ אַבְרָ֨ם מִ/מִּצְרַ֜יִם ה֠וּא וְ/אִשְׁתּ֧/וֹ וְ/כָל אֲשֶׁר ל֛/וֹ וְ/ל֥וֹט עִמּ֖/וֹ הַ/נֶּֽגְבָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: de
  text: Da zog Abram aus Ägypten hinauf, er und seine Frau und alles, was ihm gehörte, und Lot mit ihm, in den Negev.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Süden«. Das hebräische Wort Negev kann sowohl die südliche Region dieses Namens als auch allgemeiner den Süden beziehungsweise das Südland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: Bewahrt die Grundbedeutung von עלה und die biblisch-geografische Ausdrucksweise für den Weg aus Ägypten in das Land, ohne das Verb zum bloßen »verließ« abzuflachen.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Gibt die Präposition מן mit dem Ortsnamen unmittelbar und idiomatisch wieder.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: er und seine Frau
  rationale: Bewahrt das selbstständige Pronomen und die aufzählende Satzstruktur in natürlichem Deutsch.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: und alles, was ihm gehörte
  rationale: Erfasst den weiten Sinn der Wendung, ohne ihn ausschließlich auf Sachbesitz einzuengen.
- source_word: וְלוֹט עִמּוֹ
  choice: und Lot mit ihm
  rationale: Bewahrt die knappe, nachgestellte Nennung Lots als Reisebegleiter.
- source_word: הַנֶּגְבָּה
  choice: in den Negev
  rationale: Versteht נֶגֶב hier vorrangig als geografische Region und gibt die Richtungsendung mit einer natürlichen deutschen Zielangabe wieder; die allgemeinere Bedeutung »nach Süden« bleibt in der Fußnote erhalten.
theological_decisions: []
