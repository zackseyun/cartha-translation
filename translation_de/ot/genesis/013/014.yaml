  terminology: „Jahwe“ ist eine sachgerechte deutsche Wiedergabe von יהוה und wahrt den Eigennamen. „Abram“ entspricht dem hebräischen Namenstand in diesem Abschnitt. Es wurden keine theologisch einengenden Zusätze eingeführt.
