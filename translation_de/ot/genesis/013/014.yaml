source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: de
  text: 'Und Jahwe sagte zu Abram, nachdem Lot sich von ihm getrennt hatte: »Erhebe doch deine Augen und sieh von dem Ort, an dem du bist, nach Norden und nach Süden, nach Osten und nach Westen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Das Waw wahrt den Erzählanschluss; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: אָמַר אֶל־אַבְרָם
  choice: sagte zu Abram
  rationale: Natürliche und direkte Wiedergabe der üblichen hebräischen Redeeinleitung.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: nachdem Lot sich von ihm getrennt hatte
  rationale: Die Verbindung mit אַחֲרֵי bezeichnet Vorzeitigkeit; der Nifal von פרד hat hier intransitiv-reflexiven Sinn.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Erhebe doch deine Augen
  rationale: Die bildhafte Wendung bleibt erhalten; »doch« gibt die abmildernde bzw. auffordernde Nuance von נָא natürlich wieder.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der Imperativ bezeichnet das bewusste Hinsehen und lässt sich knapp mit »sieh« wiedergeben.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם
  choice: von dem Ort, an dem du bist
  rationale: Gibt den Standort als Ausgangspunkt des Blicks wieder, ohne das im Hebräischen nicht ausdrücklich enthaltene »stehst« hinzuzufügen.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: nach Norden und nach Süden, nach Osten und nach Westen
  rationale: Die Richtungsformen mit lokalem He werden idiomatisch mit »nach« wiedergegeben; die vierfache Reihung bleibt gewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den Eigennamen transparent wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Bildrede »die Augen erheben« bleibt wegen ihrer Klarheit und Nähe zum Hebräischen erhalten; die Himmelsrichtungen werden idiomatisch formuliert.
