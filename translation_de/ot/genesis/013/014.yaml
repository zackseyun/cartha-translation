  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des hebräischen Textes präzise wieder: den narrativen Anschluss, den Gottesnamen, Abram, Lots bereits vollzogene Trennung von Abram, die höflich abgemilderte Aufforderung, die Blickposition und die vier Richtungsangaben. Die Richtungsformen werden korrekt als Richtung („nach Norden …“) verstanden.'
