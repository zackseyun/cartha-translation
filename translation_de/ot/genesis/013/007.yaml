  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: de
  text: Da kam es zum Streit zwischen den Hirten von Abrams Vieh und den Hirten von Lots Vieh. Damals lebten die Kanaaniter und die Perisiter[a] im Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Kanaaniter und der Perisiter“. Die hebräischen Einzahlformen bezeichnen die Volksgruppen kollektiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam es
  rationale: Die Wayyiqtol-Form von היה führt das nächste Geschehen der Erzählung ein. „Da kam es“ ist im Deutschen natürlich und bewahrt den ereignishaften Übergang.
- source_word: רִיב
  choice: Streit
  rationale: Das Substantiv bezeichnet eine Auseinandersetzung oder einen Konflikt. „Streit“ ist präzise, geläufig und dem erzählerischen Zusammenhang angemessen.
- source_word: רֹעֵי
  choice: Hirten
  rationale: Gemeint sind die Männer, die Abrams beziehungsweise Lots Tierbestand hüten. „Hirten“ ist im Deutschen die natürliche Berufsbezeichnung und wird durch „Vieh“ hinreichend weit gefasst.
- source_word: מִקְנֵה
  choice: Vieh
  rationale: Das Wort bezeichnet den Tierbestand aus Herden und Herdenvieh. „Vieh“ ist hier ein idiomatischer deutscher Sammelbegriff.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Die wiederholte Präposition grenzt die beiden Konfliktparteien klar voneinander ab; die deutsche Paarform gibt diese Struktur genau wieder.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: die Kanaaniter und die Perisiter
  rationale: Die hebräischen Einzahlformen sind Kollektivbezeichnungen für Volksgruppen. Im modernen Deutschen ist der Plural verständlicher; die formale Besonderheit wird in einer Fußnote kenntlich gemacht.
- source_word: אָז
  choice: Damals
  rationale: Das Temporaladverb verortet die Aussage in der damaligen Erzählzeit. Die Satzanfangsstellung klingt im Deutschen natürlich.
- source_word: יֹשֵׁב
  choice: lebten
  rationale: Das Partizip beschreibt einen andauernden Aufenthalt. Beim kollektiv verstandenen zusammengesetzten Subjekt ist im Deutschen der Plural erforderlich; „lebten“ ist hier natürlicher als „wohnten“ und deckt den Sinn ab.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: „Land“ bewahrt sowohl die geografische Bedeutung als auch die mögliche, im Genesisbuch mitschwingende Verheißungsbedeutung, ohne sie ausdrücklich auszudeuten.
theological_decisions:
- issue: Möglicher verheißungsgeschichtlicher Klang von הָאָרֶץ
  choice: im Land
  alternative: in dem Gebiet
  rationale: „Land“ lässt die für Genesis mögliche Bundes- und Verheißungsresonanz bestehen, während „Gebiet“ diese unnötig abschwächen würde. Zugleich fügt die Übersetzung keine ausdrückliche theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Wortstellung ist idiomatisch; unnötige altertümliche Formen und konfessionell geprägte Zusätze werden vermieden.
