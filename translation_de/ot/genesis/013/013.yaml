  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: de
  text: Die Männer von Sodom aber waren sehr böse und sündigten schwer gegen Jahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Jahwe“.'
    reason: Lexikalisch und syntaktisch mögliche alternative Deutung von לַיהוָה.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי
  choice: Die Männer von … aber
  rationale: אַנְשֵׁי ist der Konstruktplural von אִישׁ und bezeichnet hier die männlichen Einwohner Sodoms. Das vorangestellte וְ wird als „aber“ wiedergegeben, weil der Satz im Kontext einen kontrastierenden, erläuternden Hinweis zu Lots Wahl bildet.
- source_word: סְדֹם
  choice: Sodom
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: רָעִים
  choice: böse
  rationale: Das Wort bezeichnet hier moralische Verwerflichkeit, nicht bloß etwas Schlechtes oder Unangenehmes.
- source_word: וְ/חַטָּאִים
  choice: und sündigten
  rationale: Das hebräische Prädikatswort charakterisiert die Männer als Sünder beziehungsweise als Menschen, die sündigen. Die verbale Wiedergabe ist im heutigen Deutsch natürlicher und bewahrt den parallelen Gedanken.
- source_word: לַ/יהוָה
  choice: gegen Jahwe
  rationale: In Verbindung mit der Sündenaussage kann ל denjenigen bezeichnen, gegen den sich die Verfehlung richtet. Die alternative Deutung „vor Jahwe“ bleibt in der Fußnote erhalten.
- source_word: מְאֹד
  choice: schwer
  rationale: Der Intensivierer hebt das Ausmaß ihrer Bosheit und Sünde hervor. „schwer sündigten“ gibt diese starke moralische Zuspitzung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen im deutschen Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לַיהוָה bei חַטָּאִים
  choice: gegen Jahwe
  alternative: vor Jahwe
  rationale: Die Präposition kann die Zielrichtung der Sünde gegen Gott bezeichnen, aber auch ausdrücken, dass die Bosheit vor ihm beziehungsweise in seinen Augen besteht. Die Hauptfassung wählt die relationale Bedeutung; die echte Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die verbale Formulierung „sündigten schwer“ vermeidet das im heutigen Deutsch schwerfällige „waren … sündig gegen“. Das einleitende „aber“ gibt die kontextuelle Kontrastfunktion des hebräischen וְ wieder.
