  source_fidelity: 'Die Grundbedeutung ist zutreffend: Es geht um die männlichen Einwohner Sodoms, ihre moralische Bosheit, ihre Sünde gegen Jahwe und eine starke Intensivierung. Die Fassung „böse und sündigten schwer“ verschiebt jedoch die hebräische doppelte prädikative Charakterisierung („böse und Sünder/sündig“) teilweise zu einer Aussage über eine Handlung und lässt die Intensivierung im Deutschen primär nur bei „sündigten schwer“ hören.'
