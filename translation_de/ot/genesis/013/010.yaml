revisions:
- from: Lot blickte auf und sah, dass die ganze Jordanebene[a] überall gut bewässert war – bevor Jahwe Sodom und Gomorra vernichtete –, wie der Garten Jahwes[b] und wie das Land Ägypten, bis nach Zoar hin.[c]
  to: Lot erhob den Blick und sah die ganze Jordanebene[a], die überall gut bewässert war – ehe Jahwe Sodom und Gomorra vernichtete –, wie der Garten Jahwes[b], wie das Land Ägypten, in Richtung Zoar.[c]
  rationale: Die Revision beseitigt die deutsche Redundanz, verdeutlicht, dass die Vergleiche die Bewässerung der Ebene beschreiben, und gibt die hebräische Richtungsangabe zu Zoar ohne die stärkere Aussage einer räumlichen Endgrenze wieder. Der zeitliche Erzählerhinweis und die vorsichtige Eden-Fußnote bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:22:42Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die zeitliche Einordnung vor der Vernichtung Sodoms und Gomorras, die Bewässerung der Jordanebene sowie die beiden Vergleiche grundsätzlich zutreffend wieder. „Bis nach Zoar hin“ legt jedoch eher eine räumliche Ausdehnung bis Zoar fest, während בֹּאֲכָה צֹעַר eine Richtungs- bzw. Annäherungsangabe ist. Die Stellung der Vergleiche wird klarer an das Prädikat der Bewässerung gebunden.
  naturalness: „Die ganze … überall“ ist im Deutschen unnötig doppelt. Eine Relativkonstruktion stellt den beschreibenden Satz natürlich dar und ermöglicht es, die Vergleiche ohne syntaktische Schwebe anzuschließen. „Erhob den Blick“ ist ein modernes, würdiges und idiomatisches Äquivalent des hebräischen Blickidioms.
  terminology: „Jahwe“, „Jordanebene“, „Garten Jahwes“, „Land Ägypten“, „Sodom“ und „Gomorra“ sind angemessen. Die Fußnote zu כִּכָּר sollte „Kreis“ statt des etwas ungenauen „Umkreis“ verwenden. Die Eden-Anspielung bleibt zu Recht als vorsichtige Fußnotenerläuterung gekennzeichnet.
  issues:
  - severity: medium
    issue: „bis nach Zoar hin“ als Wiedergabe von בֹּאֲכָה צֹעַר
    rationale: Die Formulierung bezeichnet im Deutschen vor allem einen Endpunkt oder eine Erstreckung. Die hebräische Wendung markiert dagegen die Richtung bzw. das Herankommen nach Zoar. „in Richtung Zoar“ bewahrt dies besser.
  - severity: low
    issue: Redundanz in „die ganze Jordanebene überall“
    rationale: „Die ganze“ und „überall“ überlappen semantisch. Die Relativkonstruktion bewahrt die Aussage, dass die gesamte Gegend gut bewässert war, ohne die deutsche Formulierung zu belasten.
  - severity: low
    issue: 'Fußnote a: „Umkreis“'
    rationale: כִּכָּר bezeichnet hier einen Kreis bzw. eine rundliche Gegend/Region, nicht primär einen Umkreis im Sinn einer Grenzlinie oder Umgebung.
