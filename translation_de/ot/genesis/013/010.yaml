source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: de
  text: Lot erhob den Blick und sah die ganze Jordanebene[a], die überall gut bewässert war – ehe Jahwe Sodom und Gomorra vernichtete –, wie der Garten Jahwes[b], wie das Land Ägypten, in Richtung Zoar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Jordansenke“; wörtlicher: „den ganzen Kreis des Jordan“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Garten Jahwes“ erinnert wahrscheinlich an die üppige Fruchtbarkeit des Gartens Eden.
    reason: cross_reference
  - marker: c
    text: 'Wörtlicher: „wenn man nach Zoar kommt“ beziehungsweise „in Richtung Zoar“. Die hebräische Wendung bezeichnet die Richtung oder Annäherung an Zoar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: blickte auf
  rationale: Die hebräische Wendung bedeutet, den Blick zu heben bzw. auf etwas zu richten. „Blickte auf“ gibt das Idiom in natürlichem, modernem Deutsch wieder.
- source_word: כָּל־כִּכַּר הַיַּרְדֵּן
  choice: die ganze Jordanebene
  rationale: כִּכָּר bezeichnet hier die ausgedehnte, flache Jordangegend; „Jordanebene“ ist verständlich und geografisch passend, während eine Fußnote die wörtlichere Bildlichkeit bewahrt.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: dass ... überall gut bewässert war
  rationale: Die Konstruktion beschreibt, was Lot an der gesamten Gegend wahrnahm. „Überall gut bewässert“ gibt sowohl כֻלָּהּ als auch den reichen Wasserbestand von מַשְׁקֶה idiomatisch wieder.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: bevor Jahwe ... vernichtete
  rationale: לִפְנֵי ist zeitlich zu verstehen; שׁחת bezeichnet im Kontext die Vernichtung der beiden Städte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Wiedergabe des Namens und ersetzt ihn nicht durch einen Titel.
- source_word: כְּגַן יְהוָה
  choice: wie der Garten Jahwes
  rationale: Die formnahe Wendung bewahrt den Vergleich und seine wahrscheinliche Anspielung auf den Garten Eden.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: wie das Land Ägypten
  rationale: „Land Ägypten“ bildet אֶרֶץ ab und erhält den geografisch-landschaftlichen Charakter des Vergleichs.
- source_word: בֹּאֲכָה צֹעַר
  choice: bis nach Zoar hin
  rationale: Die idiomatische hebräische Richtungsangabe wird in flüssigem Deutsch als räumliche Erstreckung in Richtung Zoar wiedergegeben; die mögliche wörtlichere Fassung steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da im Ausgangstext der Eigenname JHWH steht, wird er als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- issue: Bezug des Gartens Jahwes
  choice: Der Ausdruck bleibt als „Garten Jahwes“ stehen
  alternative: der Garten Eden
  rationale: Eine Anspielung auf Eden ist wahrscheinlich, doch der Vers nennt Eden nicht ausdrücklich. Die Übersetzung bewahrt daher die Formulierung und erläutert die mögliche Verbindung nur in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das hebräische Blick-Idiom wird natürlich wiedergegeben; die Parenthese wahrt den zeitlichen Erzählerhinweis, ohne die beiden landschaftlichen Vergleiche aufzulösen.
