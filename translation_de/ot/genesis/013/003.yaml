base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: de
  text: Er zog in Etappen vom Negev bis nach Bet-El, zu der Stelle, wo sein Zelt anfangs gestanden hatte, zwischen Bet-El und Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach seinen Reiseabschnitten“; gemeint ist ein Zug in aufeinanderfolgenden Etappen von Lagerplatz zu Lagerplatz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Dann zog er
  rationale: הלך bezeichnet allgemein das Gehen oder Ziehen; im Zusammenhang einer längeren Reise mit Lagerplätzen gibt „zog“ die erzählerische Bewegung natürlich und knapp wieder. Das waw consecutivum wird im fortlaufenden deutschen Erzählstil mit „Dann“ wiedergegeben.
- source_word: לְמַסָּעָיו
  choice: in Etappen
  rationale: מַסָּע bezeichnet eine Reisestation beziehungsweise einen durch Aufbruch gegliederten Reiseabschnitt. Der Plural mit ל beschreibt hier wohl das Reisen in aufeinanderfolgenden Abschnitten; „in Etappen“ ist idiomatisch und bewahrt diesen Sinn.
- source_word: מִנֶּגֶב
  choice: vom Negev
  rationale: נֶגֶב kann „Süden“ oder die Landschaft Negev bedeuten. In diesem geografischen Zusammenhang liegt die Gebietsbezeichnung nahe.
- source_word: וְעַד בֵּית אֵל
  choice: bis nach Bet-El
  rationale: עַד bezeichnet die räumliche Grenze oder das Ziel. Bei einem Ortsnamen ist „bis nach“ im Deutschen natürlich.
- source_word: עַד הַמָּקוֹם
  choice: zu der Stelle
  rationale: Das zweite עַד präzisiert das Reiseziel. „Zu der Stelle“ vermeidet eine schwerfällige Wiederholung von „bis“ und gibt הַמָּקוֹם hier als konkrete frühere Lagerstelle wieder.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: an der sein Zelt … gestanden hatte
  rationale: Die Wendung verweist rückblickend auf den früheren Standort des Zeltes. Das Plusquamperfekt bildet diese Vorzeitigkeit ab; שָׁם ist idiomatisch in der relativen Ortsangabe enthalten.
- source_word: בַּתְּחִלָּה
  choice: am Anfang
  rationale: Die Formulierung verweist auf Abrams frühere Ankunft und Lagerung an dieser Stelle und wird bewusst nah am hebräischen Ausdruck wiedergegeben.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: zwischen Bet-El und Ai
  rationale: Die Korrelationsformel בֵּין … וּבֵין lokalisiert die Stelle zwischen zwei Orten. Der Artikel bei הָעָי wird als Bestandteil der hebräischen Namensform nicht gesondert übersetzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Bet-El“ macht die Bestandteile des hebräischen Ortsnamens im Deutschen transparent und entspricht einer verbreiteten deutschen Schreibweise. Die ungewöhnliche syntaktische Folge der beiden Zielangaben wird natürlich gegliedert, ohne die geografische Präzisierung aufzulösen.
