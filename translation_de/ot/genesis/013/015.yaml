source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: de
  text: Denn das ganze Land, das du siehst, werde ich dir und deinen Nachkommen[a] für immer geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinem Samen“. Das hebräische Wort זֶרַע kann als Sammelbegriff „Same“, „Nachkommenschaft“ oder „Nachkommen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion knüpft die Zusage begründend an die vorausgehende Aufforderung an; „Denn“ bewahrt diesen Zusammenhang, ohne eine stärkere Kausalität einzutragen.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: Die Wendung bezeichnet die Gesamtheit des Landes, das Abram vor Augen liegt. „Das ganze Land“ gibt כָּל mit dem kollektiven Singular אֶרֶץ natürlich wieder.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: das du siehst
  rationale: Der einfache deutsche Präsenssatz gibt die hebräische Relativkonstruktion mit Partizip idiomatisch und genau wieder.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: werde ich dir … geben
  rationale: לְךָ bezeichnet den Empfänger; das Imperfekt von נתן drückt hier die göttliche Zukunftszusage aus.
- source_word: וּלְזַרְעֲךָ
  choice: und deinen Nachkommen
  rationale: זֶרַע ist eine kollektive Bezeichnung für die aus Abram hervorgehende Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich, ohne Anzahl oder Generationen unnötig festzulegen; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte beziehungsweise dauerhafte Zeitspanne. „Für immer“ bewahrt in diesem Verheißungskontext ihr volles Gewicht, ohne ein bestimmtes theologisches Deutungssystem vorzugeben.
theological_decisions:
- issue: Dauer der Landverheißung in עַד עוֹלָם
  choice: für immer
  alternative: auf unabsehbare Zeit; dauerhaft
  rationale: „Für immer“ entspricht dem unmittelbaren Sinn der hebräischen Dauerformel und erhält die theologische Spannung der Verheißung, ohne deren heilsgeschichtliche oder eschatologische Erfüllung auszulegen.
- issue: Kollektive Bedeutung von זֶרַע
  choice: Nachkommen
  alternative: Same; Nachkommenschaft
  rationale: Der deutsche Plural „Nachkommen“ bezeichnet hier kollektiv Abrams Nachkommenschaft. Er entscheidet nicht über spätere mögliche individuelle oder gemeinschaftliche Bezugnahmen des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „werde ich dir und deinen Nachkommen … geben“ hält die beiden Empfänger eng zusammen und bewahrt den feierlichen Charakter der Zusage.
