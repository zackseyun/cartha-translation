source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: de
  text: 'Da sagte Abram zu Lot: „Bitte, es soll keinen Streit geben zwischen mir und dir und zwischen meinen Hirten und deinen Hirten; denn wir sind Verwandte.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Denn wir sind Männer, Brüder.“ Das hebräische Wort für „Brüder“ kann auch nahe Verwandte oder Angehörige derselben Familie bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Abram
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Da sagte“ gibt die zeitlich-folgernde Erzählbewegung im Deutschen natürlich wieder.
- source_word: אַל נָא תְהִי
  choice: Bitte, es soll keinen … geben
  rationale: אַל mit Jussiv formuliert eine verneinte Aufforderung; נָא verleiht ihr einen höflich-bittenden Ton. Die gewählte Formulierung bewahrt beides in natürlichem Deutsch.
- source_word: מְרִיבָה
  choice: Streit
  rationale: Das Wort bezeichnet Streit, Auseinandersetzung oder Zwist. „Streit“ ist gegenwärtig, verständlich und deckt sowohl den persönlichen Konflikt als auch den Streit der Viehhirten ab.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: zwischen mir und dir
  rationale: Die ausdrückliche Gegenüberstellung des Hebräischen wird erhalten, statt sie zum bloßen „zwischen uns“ zu verkürzen.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: meinen Hirten … deinen Hirten
  rationale: Die substantivierten Partizipien von רעה bezeichnen Menschen, die Weidetiere hüten. „Hirten“ ist im Deutschen nicht auf Schafe beschränkt und klingt natürlicher als „Viehhirten“ oder „Herdenbetreuer“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Abrams Bitte ein; „denn“ gibt diese erklärende Funktion knapp wieder.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: wir sind Verwandte
  rationale: Obwohl אַחִים wörtlich „Brüder“ lautet, bezeichnet es hier angesichts des Verhältnisses zwischen Abram und Lot Angehörige derselben Familie. „Verwandte“ vermittelt den gemeinten Verwandtschaftsbezug idiomatisch; die auffällige hebräische Formulierung wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von אַחִים für das Verhältnis zwischen Abram und Lot
  choice: Verwandte
  alternative: Brüder; Männer, die Brüder sind
  rationale: Lot ist Abrams Neffe, nicht sein leiblicher Bruder. Das hebräische אָח kann einen weiteren Verwandtschaftsbegriff ausdrücken. „Verwandte“ vermeidet daher eine sachlich irreführende Verengung, ohne Abrams Appell an ihre familiäre Zusammengehörigkeit abzuschwächen. Die wörtliche Bild- und Wortebene bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „zwischen … und zwischen …“ bewahrt die paarweise Struktur des Hebräischen; „Bitte“ erhält Abrams beschwichtigenden, höflichen Ton.
