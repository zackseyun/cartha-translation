  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: de
  text: Und ich werde deine Nachkommen[a] so zahlreich machen wie den Staub der Erde. Wenn jemand den Staub der Erde zählen kann, dann können auch deine Nachkommen gezählt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: dein Same. Das hebräische Wort bezeichnet hier kollektiv deine Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Und ich werde … so zahlreich machen
  rationale: שׂוּם bedeutet grundsätzlich „setzen, machen“. Zusammen mit dem Vergleich „wie der Staub der Erde“ bezeichnet es hier idiomatisch das Hervorbringen einer unermesslich großen Nachkommenschaft; „so zahlreich machen“ verdeutlicht den im Vergleich enthaltenen Sinn.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: זֶרַע ist hier ein kollektiver Singular für Abrams Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch natürlich und lässt die kollektive Bedeutung erkennen; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: wie den Staub der Erde
  rationale: Die Formulierung bewahrt das konkrete Bild und den ausdrücklichen Vergleich des Hebräischen.
- source_word: אֲשֶׁר אִם
  choice: Wenn
  rationale: Die Verbindung leitet eine hypothetische Folgerung aus dem vorangehenden Vergleich ein. Im Deutschen gibt ein neuer Konditionalsatz den Sinn klar und natürlich wieder.
- source_word: אִישׁ
  choice: jemand
  rationale: אִישׁ steht hier im maskulinen Singular, hat im Kontext aber generische Bedeutung. Das deutsche „jemand“ gibt diese uneingeschränkte Referenz natürlich und präzise wieder.
- source_word: לִמְנוֹת
  choice: zählen
  rationale: מנה bezeichnet hier das Zählen oder zahlenmäßige Erfassen.
- source_word: גַּם
  choice: auch
  rationale: „Auch“ markiert die Entsprechung zwischen dem Zählen des Erdenstaubs und dem Zählen der Nachkommen.
- source_word: יִמָּנֶה
  choice: können … gezählt werden
  rationale: Der Nifal-Imperfekt steht in der Folge eines hypothetischen Bedingungssatzes und drückt hier die Möglichkeit des Gezähltwerdens aus, nicht eine Vorhersage.
theological_decisions:
- issue: Wiedergabe des kollektiven Nomens זֶרַע in der Verheißung an Abram
  choice: deine Nachkommen
  alternative: dein Same; deine Nachkommenschaft
  rationale: Der Vers spricht kollektiv von Abrams künftiger Nachkommenschaft. Die Übersetzung vermeidet es, an dieser Stelle eine ausschließlich individuelle oder ausdrücklich messianische Deutung in den Text einzutragen, während die Fußnote die Form des hebräischen Ausdrucks dokumentiert.
- issue: Generischer Gebrauch von אִישׁ
  choice: jemand
  alternative: ein Mann
  rationale: Obwohl das hebräische Substantiv grammatisch maskulin ist, bezeichnet es hier ohne Einschränkung eine beliebige Person. „Jemand“ bewahrt diese generische Aussage im natürlichen modernen Deutsch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei hebräischen Satzglieder werden als zwei deutsche Sätze wiedergegeben, damit die hypothetische Folgerung klar und natürlich klingt. Das Bild vom Staub der Erde bleibt unverändert erhalten.
