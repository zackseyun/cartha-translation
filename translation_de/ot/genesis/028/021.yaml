  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: de
  text: und ich wohlbehalten zum Haus meines Vaters zurückkehre[a], dann wird Jahwe mein Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Frieden zum Haus meines Vaters zurückkehre“. Der hebräische Ausdruck kann auch eine sichere Rückkehr und umfassendes Wohlergehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: und ich … zurückkehre
  rationale: שׁוב bedeutet „zurückkehren“. Im fortlaufenden Bedingungssatz aus dem vorigen Vers gibt der deutsche Konjunktiv Präsens die zukunftsbezogene Bedingung natürlich wieder.
- source_word: בְשָׁלוֹם
  choice: wohlbehalten
  rationale: שָׁלוֹם bezeichnet hier Frieden, Wohlergehen und Unversehrtheit. „Wohlbehalten“ bringt im Zusammenhang der Rückkehr den Sinn idiomatisch zum Ausdruck; die wörtlichere Wiedergabe wird in der Fußnote genannt.
- source_word: אֶל בֵּית אָבִי
  choice: zum Haus meines Vaters
  rationale: Die Formulierung bewahrt den konkreten familiären und haushaltsbezogenen Sinn der hebräischen Genitivverbindung.
- source_word: וְהָיָה
  choice: und … sein wird
  rationale: Die hebräische Konjunktion wird direkt mit „und“ wiedergegeben. Der Satz bleibt dadurch in die Bedingungs- und Gelübdestruktur der vorhergehenden Verse eingebunden, ohne ein nicht ausdrücklich vorhandenes „dann“ einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִי לֵאלֹהִים
  choice: mein Gott
  rationale: Wörtlich steht „mir zum Gott“. „Mein Gott“ ist die natürliche deutsche Entsprechung und bewahrt den relationalen Sinn.
theological_decisions:
- issue: Ob Jakobs Aussage die bedingte Folge seines Gelübdes oder ein uneingeschränktes Bekenntnis ausdrückt
  choice: Die Aussage bleibt durch die Satzform an die vorausgehende Bedingung gebunden, ohne ein zusätzliches „dann“ einzufügen.
  alternative: „Dann wird Jahwe mein Gott sein“ oder eine vom Bedingungssatz gelöste, uneingeschränkte Bekräftigung.
  rationale: וְהָיָה steht innerhalb der seit Vers 20 fortlaufenden Bedingungs- und Gelübdestruktur. Das schlichte „und“ entspricht der hebräischen Verknüpfung und bewahrt zugleich die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohlbehalten“ ist allgemein verständlich und bildet den kontextuellen Sinn von בְשָׁלוֹם prägnant ab; die Fußnote bewahrt die formale Bildlichkeit. Der Versanfang bleibt kleingeschrieben, weil er syntaktisch den in Vers 20 begonnenen Satz fortsetzt.
