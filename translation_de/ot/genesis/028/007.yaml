  text: וַ/יִּשְׁמַ֣ע יַעֲקֹ֔ב אֶל אָבִ֖י/ו וְ/אֶל אִמּ֑/וֹ וַ/יֵּ֖לֶךְ פַּדֶּ֥נָֽ/ה אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: de
  text: und dass Jakob auf seinen Vater und seine Mutter hörte[a] und nach Paddan-Aram ging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Vater und seiner Mutter gehorchte“. Das hebräische Verb kann in diesem Zusammenhang sowohl Hören als auch Befolgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte auf
  rationale: שׁמע mit אֶל bezeichnet hier das Hören auf jemanden und schließt im Kontext das Befolgen elterlicher Weisung ein. Die deutsche Wendung „auf jemanden hören“ bewahrt beide Nuancen natürlich.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: auf seinen Vater und seine Mutter
  rationale: Die wiederholte Präposition אֶל wird im Deutschen in der koordinierten Wendung nur einmal ausgedrückt; das Possessivpronomen wird bei beiden Elternteilen beibehalten.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך ist das gewöhnliche Verb für „gehen“; „ging“ ist hier direkt und idiomatisch.
- source_word: פַּדֶּנָה אֲרָם
  choice: nach Paddan-Aram
  rationale: Der Ortsname wird transliteriert; die Richtungsendung an פַּדֶּנָה wird durch „nach“ wiedergegeben.
- source_word: וַ
  choice: und
  rationale: Das Waw führt die vom vorherigen Kontext abhängige Satzreihe fort und wird daher mit „und“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der syntaktische Anschluss mit „und dass“ bleibt erhalten, da der Vers vom vorausgehenden Satz abhängt. Die Formulierung „auf … hörte“ bewahrt die Bedeutungsbreite zwischen Zuhören und Gehorchen.
