  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: de
  text: Er gebe dir den Segen Abrahams, dir und deinen Nachkommen mit dir, damit du das Land, in dem du als Fremder lebst, in Besitz nimmst[a], das Gott Abraham gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit du das Land erbst, in dem du als Fremder lebst«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Er gebe
  rationale: Die Jussivform steht im Zusammenhang eines Segens und wird im Deutschen natürlich als Wunsch mit dem Konjunktiv I wiedergegeben. Das vorangestellte וְ führt den Segensspruch fort, muss aber nicht eigens mit »und« übersetzt werden.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: den Segen Abrahams
  rationale: Die hebräische Status-constructus-Verbindung wird transparent wiedergegeben und bewahrt den Bezug auf die Abrahamverheißung.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: dir und deinen Nachkommen mit dir
  rationale: זֶרַע ist grammatisch singularisch, bezeichnet hier jedoch kollektiv die Nachkommenschaft. »Nachkommen« ist im heutigen Deutsch natürlich; das ungewöhnliche »mit dir« bleibt entsprechend dem Hebräischen erhalten.
- source_word: לְרִשְׁתְּךָ
  choice: damit du … in Besitz nimmst
  rationale: Der Infinitiv mit לְ bezeichnet Zweck oder Folge. Das Verb ירש kann im Zusammenhang mit Land sowohl »in Besitz nehmen« als auch »erben« bedeuten.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: das Land, in dem du als Fremder lebst
  rationale: מָגוּר bezeichnet den Aufenthalt als Fremder beziehungsweise ansässiger Fremder. Die Relativsatzform ist gegenwärtiges, verständliches Deutsch und bewahrt das patriarchale Motiv des Fremdseins im verheißenen Land.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: das Gott Abraham gegeben hat
  rationale: Der Relativsatz und אֱלֹהִים werden direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bundestheologischer Bezug der Abrahamverheißung
  choice: Die ausdrückliche Formulierung »den Segen Abrahams« sowie die Landgabe bleiben erhalten.
  alternative: »den Abraham verheißenen Segen« oder eine abstrakte Umschreibung des Segens
  rationale: Der Wortlaut stellt Isaaks Segen über Jakob unmittelbar in den Zusammenhang der Abrahamverheißung; eine erklärende Paraphrase würde mehr festlegen, als der hebräische Text sagt.
- issue: Bedeutung von ירש im Zusammenhang mit dem Land
  choice: »in Besitz nehmen« im Haupttext
  alternative: »erben«
  rationale: Beide Bedeutungsnuancen sind möglich. »In Besitz nehmen« gibt den unmittelbaren Sinn des Erlangens und Besitzens des Landes wieder; »erben« hebt stärker den Bundes- und Erbschaftsaspekt hervor und wird daher in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch wird knapp mit dem Konjunktiv I formuliert. Das im Hebräischen auffällige »mit dir« bleibt erhalten, ohne die kollektive Bedeutung von זֶרַע künstlich durch »Same« abzubilden.
