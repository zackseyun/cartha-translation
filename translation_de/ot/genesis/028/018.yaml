base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: de
  text: Am frühen Morgen stand Jakob auf, nahm den Stein, den er an sein Kopfende gelegt hatte, stellte ihn als aufgerichteten Stein hin[a] und goss Öl auf seine Oberseite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als Stele.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: auf seinem Kopf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: Am frühen Morgen stand Jakob auf
  rationale: Die Formulierung gibt sowohl das frühe Aufstehen als auch die Zeitangabe idiomatisch und ohne unnötige Doppelung wieder.
- source_word: הָאֶבֶן
  choice: den Stein
  rationale: Das bestimmte Substantiv wird schlicht und direkt wiedergegeben.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: den er an sein Kopfende gelegt hatte
  rationale: מְרַאֲשׁוֹתָיו bezeichnet den Bereich bei seinem Kopf. »An sein Kopfende« wahrt dies, ohne das im Hebräischen nicht ausdrücklich bezeichnete »unter« einzutragen.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: richtete ihn als Steinmal auf
  rationale: Die Wiedergabe erfasst sowohl das Aufrichten als auch die Funktion des Steins als aufgerichtetes Mal; sie ist im Deutschen anschaulicher als das missverständliche »Säule«.
- source_word: מַצֵּבָה
  choice: Steinmal
  rationale: Das Wort bezeichnet hier einen aufgerichteten Stein. »Steinmal« vermittelt Gegenstand und Erinnerungsfunktion, ohne die Handlung kultisch zu überdeuten; »aufgerichteter Stein« bleibt als wörtlichere Alternative in der Fußnote.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: goss Öl
  rationale: Die Übersetzung bleibt beim ausdrücklich genannten Ausgießen und ersetzt es nicht interpretierend durch »salbte«.
- source_word: עַל רֹאשָׁהּ
  choice: oben darauf
  rationale: Wörtlich steht »auf seinen Kopf«. Bei einem Stein ist »oben darauf« natürliches Deutsch und bezeichnet dessen obere Seite.
theological_decisions:
- issue: Mögliche kultische Bedeutung von מַצֵּבָה und des Ausgießens von Öl
  choice: Die Handlung wird beschreibend als Aufrichten eines Steinmals und Ausgießen von Öl wiedergegeben.
  alternative: Interpretierende Wiedergabe als »Gedenkstein« beziehungsweise »salbte ihn«
  rationale: Der Vers selbst bewertet Jakobs Handlung nicht ausdrücklich. Eine beschreibende Übersetzung vermeidet es, spätere positive oder negative Beurteilungen solcher Steinmale in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählfolge. Die Reihung der hebräischen Wayyiqtol-Formen wird durch eine gemeinsame Subjektkonstruktion wiedergegeben. »Kopfende« vermeidet die ungesicherte Festlegung, der Stein habe unmittelbar unter Jakobs Kopf gelegen.
