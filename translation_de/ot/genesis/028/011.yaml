translation_notes:
  register: Modernes Standarddeutsch mit würdigem, flüssigem Erzählton. Die wiederholte Ortsbezeichnung wurde bewusst erhalten. Bei מְרַאֲשֹׁתָיו wurde die räumlich offenere Wiedergabe „an sein Kopfende“ gewählt, um nicht eindeutig festzulegen, dass der Stein unmittelbar als Kopfkissen diente.
