base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: de
  text: Er kam an einen bestimmten Ort und blieb dort über Nacht[a], denn die Sonne war untergegangen. Er nahm einen der Steine des Ortes[b], legte ihn an seinen Kopf[c] und legte sich an jenem Ort nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht bei der ersten Nennung „an den Ort“. „An einen bestimmten Ort“ gibt im Deutschen natürlich wieder, dass dieser Ort im weiteren Verlauf besondere Bedeutung gewinnt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er nahm einige von den Steinen des Ortes.“ Die hebräische Wendung kann partitiv auf einen einzelnen Stein oder kollektiv auf mehrere Steine bezogen werden.'
    reason: alternative_reading
  - marker: c
    text: 'Das hebräische Wort bezeichnet den Bereich beim Kopf oder den Kopfplatz; möglich ist daher auch: „legte ihn unter seinen Kopf“ beziehungsweise „benutzte ihn als Kopfstütze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע
  choice: Er kam an
  rationale: פגע mit בַּמָּקוֹם bezeichnet hier im Reisebericht das Erreichen eines Ortes. „Kam an“ ist natürlich und behauptet nicht unnötig, Jakob sei zufällig darauf gestoßen.
- source_word: בַּמָּקוֹם
  choice: an einen bestimmten Ort
  rationale: Der hebräische Text hat bei der ersten Nennung den Artikel („der Ort“). „Einen bestimmten Ort“ klingt im Deutschen natürlich und deutet zugleich die spätere erzählerische Bedeutung des Ortes an.
- source_word: וַיָּלֶן
  choice: blieb dort über Nacht
  rationale: לון bezeichnet das Übernachten. Diese Formulierung ist gegenwärtig und verständlich, ohne den gehobenen Erzählton zu verlieren.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: denn die Sonne war untergegangen
  rationale: בוא bezeichnet in Verbindung mit der Sonne ihren Untergang. Das Plusquamperfekt macht deutlich, warum Jakob dort übernachtete.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Er nahm einen von den Steinen dieses Ortes
  rationale: Die Verbindung von מִן mit dem Plural „Steine“ lässt sich partitiv als „einen von den Steinen“ verstehen. Die mögliche kollektive beziehungsweise plurale Auffassung bleibt in einer Fußnote erhalten.
- source_word: מְרַאֲשֹׁתָיו
  choice: an sein Kopfende
  rationale: Das Wort bezeichnet den Bereich beim Kopf beziehungsweise den Kopfplatz. „An sein Kopfende“ bewahrt diese räumliche Offenheit besser als das stärker deutende „unter seinen Kopf“ oder „als Kopfkissen“.
- source_word: וַיִּשְׁכַּב
  choice: legte sich ... nieder
  rationale: שכב bezeichnet hier das Sich-Hinlegen. „Schlief“ würde über die unmittelbar geschilderte Handlung hinausgehen.
- source_word: בַּמָּקוֹם הַהוּא
  choice: an jenem Ort
  rationale: Die Wiederholung von „Ort“ wird bewahrt, weil sie dessen erzählerische Bedeutung hervorhebt.
