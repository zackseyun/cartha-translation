  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzglieder des Hebräischen vollständig und in ihrer Reihenfolge sachgerecht wieder: der von Jakob als מַצֵּבָה aufgerichtete Stein, seine Bestimmung als „Gottes Haus“, der umfassende Bezug „von allem“ und die an Gott gerichtete, nachdrücklich formulierte Zusage eines Zehntels. „Ganz gewiss“ bildet die Verstärkung von Infinitivus absolutus mit finitem Verb (עַשֵּׂר אֲעַשְּׂרֶנּוּ) angemessen ab. Die Aussage lässt offen, in welchem Sinn der Stein beziehungsweise der damit markierte Ort Gottes Haus sein wird.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Steinmal“ ist eine leicht gehobene, aber in diesem kultisch-erzählenden Kontext passende Bezeichnung für einen aufgerichteten Stein; die Wiederaufnahme von „Stein“ macht den Bezug transparent. Die Formulierung „Von allem, was du mir gibst“ ist idiomatisch und verdeutlicht den Bezugsumfang des versprochenen Anteils.
  terminology: „Gottes Haus“ trifft בֵּית אֱלֹהִים direkt und ohne spätere Tempeltheologie einzutragen. Die Großschreibung von „Gott“ ist durch den unmittelbaren Kontext gerechtfertigt. „Den zehnten Teil geben“ ist gegenüber einem institutionell klingenden „den Zehnten entrichten“ neutraler und bewahrt den Charakter eines persönlichen Gelübdes. Die Fußnote bietet die mögliche unbestimmte deutsche Wiedergabe, ohne sie als vorzugswürdig auszugeben.
