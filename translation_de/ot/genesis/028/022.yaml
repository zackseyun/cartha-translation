source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: de
  text: Und dieser Stein, den ich als Steinmal aufgerichtet habe, wird Gottes Haus sein[a]. Von allem, was du mir gibst, werde ich dir ganz gewiss den zehnten Teil geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Haus Gottes“.'
    reason: Das Hebräische בֵּית אֱלֹהִים kann im Deutschen je nach Zusammenhang bestimmt („Gottes Haus“) oder unbestimmt („ein Haus Gottes“) wiedergegeben werden.
lexical_decisions:
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי מַצֵּבָה
  choice: dieser Stein, den ich als Steinmal aufgerichtet habe
  rationale: „Steinmal“ bezeichnet einen aufgerichteten Stein als sichtbares Zeichen, ohne den Zweck vorschnell als bloßes Gedenken oder als ausgeformten Schrein festzulegen. „Aufgerichtet“ gibt die Handlung im Kontext natürlich wieder.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: wird Gottes Haus sein
  rationale: Die Formulierung bewahrt die starke Aussage des Hebräischen und bleibt im Deutschen natürlich. Sie deutet den Stein beziehungsweise den bezeichneten Ort nicht vorschnell im Licht späterer Tempelvorstellungen aus.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang von Jakobs Gottesbegegnung bezeichnet אֱלֹהִים den einen Gott und nicht unbestimmt einen Gott.
- source_word: וְכֹל אֲשֶׁר תִּתֶּן לִי
  choice: Von allem, was du mir gibst
  rationale: Die einfache Verbform passt innerhalb des Gelübdes zu dem, was Gott Jakob künftig geben wird. Die deutsche Formulierung macht den Bezugsbereich des versprochenen Zehntels klar.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: werde ich dir ganz gewiss den zehnten Teil geben
  rationale: Infinitivus absolutus und finites Verb derselben Wurzel verstärken die Zusage. „Ganz gewiss“ erhält diesen Nachdruck; „den zehnten Teil geben“ ist heute transparenter als das seltene Verb „verzehnten“.
- source_word: לָךְ
  choice: dir
  rationale: Der Dativ gibt Gott unmittelbar als Empfänger des versprochenen Zehntels wieder.
theological_decisions:
- issue: Bedeutung des Steins als Gottes Haus
  choice: Die Aussage wird unmittelbar als „Gottes Haus“ wiedergegeben, ohne näher zu bestimmen, auf welche Weise der Stein oder der dadurch bezeichnete Ort diese Funktion erfüllt.
  alternative: „ein Haus Gottes“ oder eine ausdeutende Wiedergabe als Heiligtum beziehungsweise Vorankündigung eines späteren Tempels
  rationale: Der hebräische Wortlaut verbindet das Steinmal mit בֵּית אֱלֹהִים, erklärt aber nicht näher, wie diese Beziehung zu verstehen ist. Die Übersetzung wahrt diese Spannung und vermeidet spätere theologische Eintragungen.
- issue: Jakobs Zusage des Zehntels
  choice: Die Aussage wird als betonte Zusage wiedergegeben, Gott von allem Empfangenen den zehnten Teil zu geben.
  alternative: Verwendung institutionell geprägter Zehnt-Terminologie, die spätere gesetzliche oder kirchliche Ordnungen nahelegen könnte
  rationale: Der Vers beschreibt Jakobs persönliches Gelübde. Die Übersetzung bewahrt den Anteil und den Nachdruck, ohne spätere Regelwerke in den Text zurückzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Steinmal“ hält das konkrete Bild eines aufgerichteten Kult- oder Erinnerungszeichens fest, ohne seine Funktion enger zu bestimmen. Der Nachdruck der hebräischen Verbverbindung wird idiomatisch mit „ganz gewiss“ ausgedrückt.
