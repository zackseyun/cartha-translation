id: GEN.28.13
reference: Genesis 28:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: de
  text: 'Und sieh: Jahwe stand über ihr[a] und sagte: »Ich bin Jahwe, der Gott Abrahams, deines Vaters, und der Gott Isaaks. Das Land, auf dem du liegst, werde ich dir und deiner Nachkommenschaft[b] geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei ihm« beziehungsweise »über ihm«, falls sich das Pronomen auf Jakob und nicht auf die Himmelsstiege bezieht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »deinem Samen«; das hebräische Wort ist eine Kollektivbezeichnung für die Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und vergegenwärtigende Wirkung der hebräischen Partikel in verständlichem, gehobenem Gegenwartsdeutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נִצָּב
  choice: stand
  rationale: Das Partizip bezeichnet hier den in der Vision wahrgenommenen anhaltenden Zustand; deutsches „stand“ drückt dies natürlich aus.
- source_word: עָלָיו
  choice: über ihr
  rationale: Das maskuline hebräische Pronomen bezieht sich am ehesten auf die im vorigen Vers genannte Himmelsstiege; wegen des grammatischen Geschlechts von „Stiege“ lautet das deutsche Pronomen „ihr“. Die mögliche Beziehung auf Jakob bleibt in der Fußnote erhalten.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: der Gott Abrahams, deines Vaters
  rationale: Folgt der hebräischen Fügung eng und lässt „Vater“ im weiteren Sinn eines Vorfahren stehen, ohne die Formulierung unnötig umzudeuten.
- source_word: הָאָרֶץ
  choice: Das Land
  rationale: Im Zusammenhang der Verheißung ist das zugesagte Land gemeint, nicht nur der Boden unmittelbar unter Jakob.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: auf dem du liegst
  rationale: Gibt sowohl die gegenwärtige, andauernde Handlung als auch den räumlichen Bezug von עַל natürlich wieder.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: werde ich dir geben
  rationale: Der Imperfekt hat im Kontext der göttlichen Zusage futurische Bedeutung.
- source_word: וּלְזַרְעֶךָ
  choice: und deiner Nachkommenschaft
  rationale: „Nachkommenschaft“ bewahrt den kollektiven Singular von זֶרַע und klingt im Deutschen natürlicher als das wörtliche „Same“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diese persönliche Benennung.
- issue: Bezug von עָלָיו in der Vision
  choice: über ihr, bezogen auf die Himmelsstiege
  alternative: bei ihm oder über ihm, bezogen auf Jakob
  rationale: Die Himmelsstiege ist im unmittelbaren Kontext der naheliegende Bezug, doch das hebräische Pronomen lässt auch Jakob als Bezug zu. Diese echte Mehrdeutigkeit wird in einer Fußnote offengehalten.
- issue: Bezeichnung Abrahams als Jakobs Vater
  choice: Abraham, dein Vater
  alternative: Abraham, dein Vorfahr
  rationale: „Vater“ entspricht אָב und kann im Hebräischen auch einen Vorfahren bezeichnen. Die Übersetzung bewahrt die ursprüngliche Verwandtschaftsbezeichnung, ohne sie auf die unmittelbare Vaterschaft zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Erzählton. „Und sieh“ erhält die Anschaulichkeit des hebräischen Diskursmarkers; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
