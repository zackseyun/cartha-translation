source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: de
  text: Und Esau sah, dass die Töchter Kanaans seinem Vater Isaak missfielen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in den Augen seines Vaters Isaak schlecht [oder: böse] waren“. Gemeint ist hier wahrscheinlich, dass Isaak die kanaanitischen Frauen als Ehepartnerinnen ablehnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Und … sah
  rationale: Das Narrativ-Waw führt die Handlung fort; ראה wird mit seiner gewöhnlichen Bedeutung „sehen“ wiedergegeben, ohne die Folgerung durch „erkannte“ ausdrücklich zu machen.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Form.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Esau wahrnahm.
- source_word: רָעוֹת … בְּעֵינֵי
  choice: missfielen
  rationale: Die Verbindung aus „schlecht/böse“ und „in den Augen von“ bezeichnet hier eine negative Beurteilung. „Missfielen“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne zwingend ein moralisches Urteil über die Frauen selbst auszudrücken.
- source_word: בְּנוֹת כְּנָעַן
  choice: die Töchter Kanaans
  rationale: Die Formulierung bewahrt die familiär-ethnische Ausdrucksweise des Hebräischen und ist im Deutschen verständlich.
- source_word: יִצְחָק אָבִיו
  choice: seinem Vater Isaak
  rationale: Die deutsche Wortstellung ist natürlich und bewahrt sowohl die Verwandtschaftsbezeichnung als auch den Namen.
theological_decisions:
- issue: Charakter der negativen Bewertung der kanaanitischen Frauen
  choice: „missfielen“ gibt Isaaks ablehnende Beurteilung wieder
  alternative: „waren böse/schlecht in den Augen seines Vaters Isaak“
  rationale: Der Kontext betrifft ihre Beurteilung als Ehepartnerinnen. Die Übersetzung vermeidet es, aus dem Adjektiv allein ein umfassendes moralisches Urteil abzuleiten; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Bewertungsformel wird idiomatisch wiedergegeben; ihre wörtliche Gestalt und lexikalische Spannweite werden in der Fußnote bewahrt.
