  - severity: medium
    issue: 'Fußnote b: „über ihm“'
    rationale: Die Präposition בְּ mit Suffix erlaubt in diesem Zusammenhang primär eine Beziehung „an/auf ihm bzw. ihr“, nicht ohne Weiteres „über ihm“. Die Fußnote sollte die mögliche Deutung auf Jakob präzise und ohne zusätzliche räumliche Auslegung formulieren.
