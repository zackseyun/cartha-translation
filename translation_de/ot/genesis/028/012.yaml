  source_fidelity: Der Haupttext gibt die hebräische Satzfolge, das visionäre „siehe“, die Leiter als auf der Erde aufgerichtete Struktur, ihre bis zum Himmel reichende Spitze sowie das Auf- und Niedersteigen der Engel zutreffend wieder. „Auf der Erde aufgestellt“ bezeichnet den resultativen räumlichen Zustand idiomatischer als „auf die Erde gestellt“.
  naturalness: Die Revision bleibt modernes Standarddeutsch mit bewusst biblisch gehobenem, aber verständlichem Register. „Auf ihr hinauf und herab“ ist eine natürliche knappe Entsprechung für die koordinierte Bewegungsdarstellung.
  terminology: „Leiter“, „Engel Gottes“, „Himmel“ und „Siehe“ sind angemessen. Die Fußnote zu b soll die diskutierte Personenreferenz nicht mit „über ihm“ erweitern, da dies keine unmittelbare Wiedergabe von בּוֹ ist.
