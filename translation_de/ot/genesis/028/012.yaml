base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: de
  text: 'Und er träumte: Siehe, eine Leiter[a] war auf der Erde aufgestellt, und ihre Spitze reichte bis an den Himmel; und siehe, Engel Gottes stiegen auf ihr hinauf und herab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch allgemeiner eine Treppe, Rampe oder andere Vorrichtung zum Hinaufsteigen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: an ihm; dann wäre Jakob gemeint. Im unmittelbaren Zusammenhang liegt jedoch der Bezug auf die Leiter näher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Und er träumte
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; die knappe Wiedergabe bewahrt den hebräischen Erzählfluss.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Die Präsentationspartikel vergegenwärtigt die Traumszene. „Siehe“ erhält ihre rhetorische Kraft in einem würdigen biblischen Register.
- source_word: סֻלָּם
  choice: Leiter
  rationale: Das nur hier belegte hebräische Wort bezeichnet eine Vorrichtung zum Hinauf- und Hinabsteigen, ohne deren Bauart eindeutig festzulegen. „Leiter“ ist die verständliche und traditionsnahe Hauptwiedergabe; die mögliche breitere Bedeutung wird in einer Fußnote erhalten.
- source_word: מֻצָּב אַרְצָה
  choice: war auf die Erde gestellt
  rationale: Das passive Partizip beschreibt die Leiter als fest hingestellt beziehungsweise aufgerichtet; „auf die Erde“ wahrt den räumlichen Gegensatz zum Himmel.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: und ihre Spitze reichte bis an den Himmel
  rationale: „Spitze“ gibt den übertragenen Gebrauch von רֹאשׁ natürlich wieder; „reichte bis an“ drückt die Ausdehnung zum Himmel aus, ohne einen darüber hinausgehenden Kontakt zu behaupten.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: Engel Gottes
  rationale: Im Zusammenhang der Vision sind übernatürliche Boten gemeint; „Engel“ ist dafür die klare deutsche Bezeichnung.
- source_word: עֹלִים וְיֹרְדִים
  choice: stiegen hinauf und herab
  rationale: Die beiden Partizipien schildern die fortdauernde Bewegung innerhalb der Vision; die verbale Wendung ist im Deutschen anschaulich und natürlich.
- source_word: בּוֹ
  choice: auf ihr
  rationale: Der Suffixbezug gilt am natürlichsten der Leiter. Das deutsche Genus richtet sich dabei nach „Leiter“; die grammatisch mögliche Beziehung auf eine männliche Person wird in der Fußnote genannt.
theological_decisions:
- issue: Bildgehalt von סֻלָּם
  choice: Leiter
  alternative: Treppe, Rampe oder allgemeiner eine Vorrichtung zum Aufstieg
  rationale: Das seltene Wort legt die genaue Bauform nicht fest. Die Hauptübersetzung folgt der verständlichen traditionellen Bildsprache, während die Fußnote die echte lexikalische Offenheit bewahrt.
- issue: Bezugswort von בּוֹ
  choice: auf ihr, bezogen auf die Leiter
  alternative: an ihm beziehungsweise über ihm, bezogen auf Jakob
  rationale: Die Leiter ist im unmittelbaren Satzbau das nächstliegende Bezugswort. Da das maskuline hebräische Suffix auch anders gedeutet werden kann, wird diese Möglichkeit nicht verschwiegen, aber auch nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. „Siehe“ wird bewusst als rhetorisches Signal der lebhaft geschauten Traumszene beibehalten. Die Satzstruktur folgt dem Hebräischen, ohne im Deutschen unnötig schwerfällig zu wirken.
