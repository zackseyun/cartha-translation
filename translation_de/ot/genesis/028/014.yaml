  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: de
  text: Deine Nachkommen werden wie der Staub der Erde sein, und du wirst dich nach Westen und Osten, nach Norden und Süden ausbreiten. Und in dir und in deinen Nachkommen werden alle Sippen der Erde gesegnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und in dir und in deinen Nachkommen werden sich alle Sippen der Erde segnen.“ Das hebräische Verb kann auch reflexiv oder medial verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: Deine Nachkommen werden … sein
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. Das natürliche deutsche Pluralwort „Nachkommen“ gibt diesen Sinn verständlich wieder; das Verb steht im Verheißungskontext futurisch.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: wie der Staub der Erde
  rationale: Die Wendung ist ein Vergleich für die unzählbare Menge und wird bildhaft sowie quellennah wiedergegeben.
- source_word: וּפָרַצְתָּ
  choice: du wirst dich … ausbreiten
  rationale: פרץ hat die Grundvorstellung des Hervor- oder Durchbrechens; im Zusammenhang der räumlichen Ausdehnung ist „sich ausbreiten“ im Deutschen natürlich und treffend.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: nach Westen und Osten, nach Norden und Süden
  rationale: Die Richtungsformen bezeichnen Bewegung in alle vier Himmelsrichtungen. נֶגֶב bedeutet in dieser Reihe eindeutig „Süden“.
- source_word: וְנִבְרֲכוּ
  choice: werden … gesegnet werden
  rationale: Der Niphal von ברך lässt sich in dieser Verheißungsformel gut passiv verstehen. Die mögliche reflexive beziehungsweise mediale Deutung wird in der Fußnote bewahrt.
- source_word: בְךָ … וּבְזַרְעֶךָ
  choice: in dir und in deinen Nachkommen
  rationale: „In“ bildet die zweimalige Präposition ב formal ab und vermeidet die stärker deutende Wiedergabe „durch“.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: alle Sippen der Erde
  rationale: מִשְׁפָּחוֹת meint größere Familienverbände oder Sippen. „Sippen“ bewahrt diese soziale Bedeutung besser als das im Deutschen leicht auf Kernfamilien beschränkte „Familien“; „Erde“ gibt den universalen Umfang wieder.
theological_decisions:
- issue: Bedeutung der Segensformel mit ברך im Niphal
  choice: 'Passiv: „alle Sippen der Erde werden gesegnet werden“'
  alternative: 'Reflexiv/medial: „alle Sippen der Erde werden sich … Segen wünschen“ beziehungsweise „sich … segnen“'
  rationale: Die passive Deutung ist im Kontext der patriarchalischen Verheißung naheliegend. Da die hebräische Form auch reflexiv oder medial verstanden werden kann und dies die Art der vermittelten Segenswirkung berührt, wird die Alternative nicht beseitigt, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Verheißungsformel, wird aber durch einen Punkt gegliedert. „Nachkommen“ ist bewusst natürlich-deutsch, während „in dir“ die Mehrdeutigkeit der hebräischen Präposition bewahrt.
