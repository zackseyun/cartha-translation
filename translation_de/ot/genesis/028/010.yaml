  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: de
  text: Jakob zog von Beerscheba fort und ging nach Haran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „nach/auf Haran zu“; der Ortsname trägt eine Endung, die die Bewegungsrichtung angibt.'
