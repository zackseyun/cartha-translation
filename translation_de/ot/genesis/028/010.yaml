lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … fort
  rationale: יצא bezeichnet das Hinausgehen beziehungsweise Aufbrechen von einem Ort. In Verbindung mit „von Beerscheba“ gibt „zog … fort“ die Abreise natürlich und würdig wieder.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Die im Deutschen etablierte biblische Namensform.
- source_word: מִבְּאֵר שָׁבַע
  choice: von Beerscheba
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt; „Beerscheba“ ist die geläufige deutsche Form des Ortsnamens.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך ist das gewöhnliche Verb für „gehen“. „Ging“ bleibt nah am Hebräischen und vermeidet die zusätzliche Nuance von „reiste“.
- source_word: חָרָנָה
  choice: nach Haran
  rationale: Die Richtungsendung -ָה bezeichnet eine Bewegung auf Haran zu. Bei Ortsnamen drückt das deutsche „nach“ diese Richtung idiomatisch aus.
