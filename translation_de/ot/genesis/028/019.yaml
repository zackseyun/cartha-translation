  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֵּֽית אֵ֑ל וְ/אוּלָ֛ם ל֥וּז שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: de
  text: Und er nannte jenen Ort Bethel[a]; zuvor aber hieß die Stadt Lus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bethel bedeutet »Haus Gottes«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: er nannte
  rationale: Die Verbindung bedeutet im Deutschen natürlich „nennen/benennen“. Anders als die wörtliche Nachbildung „er nannte den Namen“ vermeidet „er nannte“ eine im modernen Deutsch schwerfällige hebräische Redewendung.
- source_word: הַמָּקוֹם הַהוּא
  choice: jenen Ort
  rationale: „Ort“ gibt מָקוֹם wieder; „jenen“ bewahrt den rückverweisenden Demonstrativcharakter.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben; seine transparente hebräische Bedeutung wird in der Fußnote erklärt.
- source_word: וְאוּלָם
  choice: aber
  rationale: Die Partikel leitet eine kontrastierende Klarstellung zur früheren Bezeichnung ein.
- source_word: לוּז
  choice: Lus
  rationale: „Lus“ ist die gebräuchliche deutsche Form des hebräischen Ortsnamens.
- source_word: שֵׁם הָעִיר לָרִאשֹׁנָה
  choice: zuvor hieß die Stadt
  rationale: Diese idiomatische deutsche Form gibt sowohl „der Name der Stadt“ als auch den zeitlichen Sinn „anfangs/früher“ knapp und klar wieder.
theological_decisions: []
