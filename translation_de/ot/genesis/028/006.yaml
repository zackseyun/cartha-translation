  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: de
  text: 'Esau sah, dass Isaak Jakob gesegnet und ihn nach Paddan-Aram geschickt hatte, um sich von dort eine Frau zu nehmen, und dass Isaak ihm, als er ihn segnete, geboten hatte: »Du sollst dir keine Frau von den Töchtern Kanaans[a] nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von kanaanitischen Frauen«. Wörtlich: »von den Töchtern Kanaans«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: Esau sah
  rationale: Das Wayyiqtol von ראה führt die Erzählung weiter. Ein zusätzliches »Nun« ist im Hebräischen nicht ausdrücklich vorhanden und wird daher nicht eingefügt.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: dass Isaak Jakob gesegnet ... hatte
  rationale: Der mit כִּי eingeleitete Inhalt bezeichnet, was Esau wahrnahm. Das Plusquamperfekt verdeutlicht im Deutschen, dass der Segen Esau bereits vor seiner Wahrnehmung bekannt wurde.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: und ihn nach Paddan-Aram geschickt hatte
  rationale: Die koordinierte Handlung gehört ebenfalls zum Inhalt von Esaus Wahrnehmung. Der Ortsname wird in einer gebräuchlichen deutschen Umschrift wiedergegeben.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: damit er sich dort eine Frau nahm
  rationale: Die Formulierung gibt den Zweck des Sendens wieder und bewahrt mit »sich« die reflexive Nuance von לוֹ. »Dort« entspricht מִשָּׁם in natürlichem Deutsch.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: Als Isaak ihn segnete
  rationale: Die Präposition בְּ bezeichnet hier den zeitlichen beziehungsweise begleitenden Umstand. Die Wiederaufnahme des Namens Isaak beseitigt eine im Deutschen unnötige Pronomenmehrdeutigkeit.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: hatte er ihm geboten
  rationale: צוה bezeichnet ein verbindliches Gebot. Die hebräische Einleitungsformel לֵאמֹר wird im Deutschen idiomatisch durch den Doppelpunkt vor der direkten Rede ausgedrückt.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Du sollst dir keine Frau ... nehmen
  rationale: Der verneinte Imperfekt hat hier die Kraft eines Verbots. »Du sollst ... keine« wahrt dessen verbindlichen, aber im Deutschen natürlichen Ton.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: von den Töchtern Kanaans
  rationale: Die Wiedergabe folgt dem hebräischen Ausdruck eng und bleibt verständlich; die idiomatischere Bedeutungsalternative wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die zeitlichen Beziehungen der hebräischen Verbformen bleiben durch das Plusquamperfekt erkennbar. Die direkte Rede ist knapp und verbindlich formuliert.
