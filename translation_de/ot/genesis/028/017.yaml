  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: de
  text: 'Da fürchtete er sich und sagte: »Wie ehrfurchtgebietend[a] ist dieser Ort! Dies ist nichts anderes als das Haus Gottes, und dies ist das Tor des Himmels[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Wie furchterregend ist dieser Ort!« Das hebräische Wort kann Furcht, Schrecken oder ehrfürchtiges Staunen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Tor der Himmel«; im Deutschen bezeichnet »Himmel« gewöhnlich den göttlichen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Da fürchtete er sich
  rationale: Die Form von ירא schildert Jakobs unmittelbare Reaktion. »Sich fürchten« bewahrt den wirklichen Furchtaspekt und legt ihn nicht einseitig als bloße Ehrfurcht aus.
- source_word: מַה נּוֹרָא
  choice: Wie ehrfurchtgebietend
  rationale: Die Ausrufekonstruktion מַה und das von ירא abgeleitete Adjektiv bezeichnen etwas, das Furcht und ehrfürchtiges Staunen hervorruft. »Ehrfurchtgebietend« bewahrt diese Spannung in würdigem, verständlichem Deutsch.
- source_word: הַמָּקוֹם הַזֶּה
  choice: dieser Ort
  rationale: Direkte und natürliche Wiedergabe der hebräischen Nominalgruppe mit Demonstrativpronomen.
- source_word: אֵין זֶה כִּי אִם
  choice: Dies ist nichts anderes als
  rationale: Die deutsche Wendung gibt die nachdrückliche ausschließende Identifikation des hebräischen Idioms wieder.
- source_word: בֵּית אֱלֹהִים
  choice: das Haus Gottes
  rationale: Die Genitivkonstruktion bildet die hebräische Status-constructus-Verbindung transparent ab und wahrt ihren feierlichen Ton, ohne an dieser Stelle bereits einen gebauten Tempel vorauszusetzen.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: das Tor des Himmels
  rationale: »Himmel« ist im Deutschen die natürliche Bezeichnung für den göttlichen Bereich; die Tor-Metapher bleibt vollständig erhalten.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im Kontext
  choice: Gott
  alternative: Götter
  rationale: Trotz der äußerlich pluralischen Form bezeichnet אֱלֹהִים hier nach Vision und Bundeszusammenhang eindeutig den einen Gott.
- issue: Bedeutungsspanne von נוֹרָא angesichts der göttlichen Gegenwart
  choice: ehrfurchtgebietend
  alternative: furchterregend
  rationale: Das Wort umfasst Furcht, Schrecken und ehrfürchtiges Staunen. Die gewählte Formulierung wahrt den sakralen Zusammenhang, während die Fußnote die stärker angstbetonte Möglichkeit offenhält.
- issue: Numerus von הַשָּׁמָיִם
  choice: des Himmels
  alternative: der Himmel
  rationale: Das hebräische שָׁמַיִם besitzt eine pluralisch beziehungsweise dualisch erscheinende Form. Im Deutschen bezeichnet der Singular »Himmel« den hier gemeinten göttlichen Bereich idiomatisch, ohne mehrere göttliche Sphären festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Anschluss wird mit »Da« natürlich erzählt; die direkte Rede verwendet deutsche Anführungszeichen. Die Spannung zwischen Angst und heiliger Ehrfurcht wird im Haupttext und in der Fußnote bewahrt.
