  text: וַ/יִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵ/אמֹ֑ר אִם יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗/י וּ/שְׁמָרַ֨/נִי֙ בַּ/דֶּ֤רֶךְ הַ/זֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְ/נָֽתַן לִ֥/י לֶ֛חֶם לֶ/אֱכֹ֖ל וּ/בֶ֥גֶד לִ/לְבֹּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: de
  text: 'Da legte Jakob ein Gelübde ab und sagte: »Wenn Gott mit mir ist, mich auf diesem Weg, den ich gehe, behütet und mir Brot zu essen und Kleidung zum Anziehen gibt,«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Da legte Jakob ein Gelübde ab
  rationale: Die Verbindung aus dem Verb נדר und dem gleichstämmigen Substantiv נֶדֶר bezeichnet einen förmlichen Gelübdeakt. »Ein Gelübde ablegen« ist dafür die natürliche, gehobene deutsche Wendung.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Leitet den Inhalt des Gelübdes ein; im modernen Deutschen klingt die finite Form natürlicher als eine Nachbildung mit »sprechend«.
- source_word: אִם
  choice: Wenn
  rationale: Bewahrt die Bedingungsform des hebräischen Textes, ohne sie als Gewissheit oder Zweifel auszudeuten.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Gott mit mir ist
  rationale: Gibt die Aussage über Gottes Gegenwart schlicht und direkt wieder.
- source_word: וּשְׁמָרַנִי
  choice: mich … behütet
  rationale: שׁמר umfasst bewahren, beschützen und über jemanden wachen. »Behüten« verbindet diese Bedeutungsanteile idiomatisch und würdevoll.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: auf diesem Weg, den ich gehe
  rationale: Bewahrt sowohl das konkrete Bild des Weges als auch den Relativsatz und bleibt im Deutschen natürlich.
- source_word: וְנָתַן לִי
  choice: und mir … gibt
  rationale: Die deutsche Präsensform steht regelgerecht im mit »wenn« eingeleiteten Bedingungssatz und gibt die erwartete zukünftige Handlung wieder.
- source_word: לֶחֶם לֶאֱכֹל
  choice: Brot zu essen
  rationale: Behält das konkrete hebräische Wort »Brot« bei; eine allgemeinere Bedeutung »Nahrung« muss nicht in den Haupttext eingetragen werden.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: und Kleidung zum Anziehen
  rationale: בֶּגֶד bezeichnet ein Kleidungsstück beziehungsweise Kleidung. Der Infinitivzweck wird in natürlichem Deutsch mit »zum Anziehen« ausgedrückt.
theological_decisions:
- issue: Charakter von Jakobs bedingtem Gelübde
  choice: Die Bedingung wird mit »Wenn« wiedergegeben.
  alternative: »Da Gott mit mir ist« oder »Falls Gott mit mir sein wird«
  rationale: אִם ist eine echte Konditionalpartikel. »Wenn« bewahrt die Spannung zwischen Vertrauen und möglicher Unsicherheit, ohne Jakobs Haltung dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Die Satzstruktur bleibt bewusst offen, da der Bedingungssatz und das Gelübde in den folgenden Versen fortgesetzt werden.
