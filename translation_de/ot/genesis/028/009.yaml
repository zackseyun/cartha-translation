base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: de
  text: Da ging Esau zu Ismael und nahm sich zusätzlich zu seinen Frauen[a] Mahalat, die Tochter Ismaels, des Sohnes Abrahams, die Schwester Nebajots, zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neben seinen Frauen“. Die hebräische Wendung besagt hier, dass Mahalat als weitere Frau hinzukam und die bisherigen Frauen nicht ersetzte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging
  rationale: Das Wayyiqtol führt die Erzählung mit der nächsten Handlung fort. „Da ging“ gibt diesen narrativen Anschluss in natürlichem Deutsch wieder.
- source_word: אֶל יִשְׁמָעֵאל
  choice: zu Ismael
  rationale: Die Präposition אֶל bezeichnet hier die Bewegung zu einer Person hin; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: וַיִּקַּח ... לוֹ לְאִשָּׁה
  choice: nahm sich ... zur Frau
  rationale: Die deutsche Wendung bewahrt das hebräische Verb „nehmen“, bringt durch „zur Frau“ den ehelichen Sinn klar zum Ausdruck und gibt mit „sich“ die Funktion von לוֹ wieder.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Der Personenname wird in einer im Deutschen üblichen, dem Hebräischen nahen Form transliteriert.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: die Tochter Ismaels, des Sohnes Abrahams
  rationale: Die Formulierung bildet die Abstammungsangabe genau ab und vermeidet zugleich eine mögliche falsche Zuordnung im Deutschen.
- source_word: אֲחוֹת נְבָיוֹת
  choice: die Schwester Nebajots
  rationale: Die appositionelle Identifizierung wird direkt und verständlich wiedergegeben; נְבָיוֹת wird als „Nebajot“ transliteriert.
- source_word: עַל נָשָׁיו
  choice: zusätzlich zu seinen Frauen
  rationale: 'עַל bezeichnet hier am wahrscheinlichsten eine Hinzufügung: Mahalat wurde neben den bereits vorhandenen Frauen Esaus zur Frau genommen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogischen Appositionen bleiben vollständig erhalten; die Satzstellung folgt dem Deutschen, ohne Angaben des hebräischen Textes auszulassen.
