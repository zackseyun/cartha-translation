  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: de
  text: Sieh, ich bin bei dir. Ich werde dich behüten, wohin du auch gehst, und dich in dieses Land zurückbringen. Denn ich werde dich nicht verlassen, bis ich getan habe, was ich dir gesagt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und vergegenwärtigende Funktion der hebräischen Partikel in natürlichem, heutigem Deutsch.
- source_word: אָנֹכִי עִמָּךְ
  choice: Ich bin mit dir
  rationale: Gibt die Zusage der persönlichen Gegenwart Gottes schlicht und direkt wieder; das selbstständige Pronomen erhält durch die Satzstellung ausreichendes Gewicht.
- source_word: וּשְׁמַרְתִּיךָ
  choice: Ich werde dich behüten
  rationale: „Behüten“ umfasst Schutz und fürsorgliches Bewahren und entspricht dem Bedeutungsfeld von שׁמר in diesem Zusammenhang.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: wohin du auch gehst
  rationale: Natürliche deutsche Wiedergabe der distributiven Wendung; sie bezeichnet jeden Ort, an den Jakob gehen wird.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: dich zurückbringen
  rationale: 'Gibt die kausative Form von שוב idiomatisch wieder: Gott bewirkt Jakobs Rückkehr.'
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: in dieses Land
  rationale: אֲדָמָה kann „Erdboden“ bedeuten, bezeichnet hier aber das Gebiet, auf dem Jakob liegt und zu dem Gott ihn zurückführen wird; „Land“ trifft den geografischen Zusammenhang.
- source_word: לֹא אֶעֱזָבְךָ
  choice: ich werde dich nicht verlassen
  rationale: Bewahrt die breite Bedeutung von עזב in gegenwärtigem Deutsch, ohne sie durch „im Stich lassen“ oder das traditionellere „verlassen/forsaken“ stärker emotional oder intertextuell festzulegen.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: bis ich getan habe
  rationale: Die hebräische Verbindung bezeichnet den Zeitpunkt, zu dem das angekündigte Handeln vollendet sein wird; das deutsche Perfekt nach „bis“ ist idiomatisch.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: was ich dir gesagt habe
  rationale: Bleibt beim ausdrücklich verwendeten Verb „reden/sagen“. „Versprochen“ wäre im Kontext sachlich naheliegend, würde die Formulierung aber interpretierend verengen.
theological_decisions:
- issue: Dauer der Zusage „bis ich getan habe“
  choice: Die zeitliche Formulierung des Hebräischen wird unverändert als „bis“ wiedergegeben.
  alternative: Explizit formulieren, Gottes Gegenwart ende auch nach der Erfüllung nicht.
  rationale: Das „bis“ setzt den Schwerpunkt auf die sichere Erfüllung von Gottes Wort und behauptet nicht ausdrücklich, dass seine Gegenwart danach endet. Eine erklärende Erweiterung würde über den Vers hinausgehen.
- issue: Göttliche Gegenwart, Schutz und Treue
  choice: Die Zusagen werden persönlich und unmittelbar wiedergegeben, ohne zusätzliche bundestheologische Terminologie.
  alternative: Durch traditionelle Formulierungen wie „nicht preisgeben“ oder durch ausdrückliche Bezeichnung als Bund stärker theologisch profilieren.
  rationale: Der Text selbst verbindet Gottes Gegenwart, Bewahrung, Rückführung und Erfüllung seines Wortes. Diese Spannung und Reichweite bleiben ohne dogmatische Ergänzung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und sieh“ erhält die Lebendigkeit von וְהִנֵּה, ohne das altertümlichere „siehe“. Kurze Hauptsätze lassen die göttliche Zusage klar und eindringlich wirken.
