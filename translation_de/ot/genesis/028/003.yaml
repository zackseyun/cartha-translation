source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: de
  text: Gott der Allmächtige segne dich[a], mache dich fruchtbar und mehre dich, sodass du zu einer Gemeinschaft von Völkern wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »El Schaddai«; traditionell: »Gott, der Allmächtige«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  rationale: Die etablierte deutsche Wiedergabe übersetzt den Gottestitel und bewahrt durch die Apposition sowohl אֵל („Gott“) als auch שַׁדַּי („der Allmächtige“).
- source_word: יְבָרֵךְ
  choice: segne
  rationale: Der hebräische Imperfekt hat im Segensspruch jussivische Bedeutung; der deutsche Konjunktiv I gibt den Wunsch angemessen und würdig wieder.
- source_word: וְיַפְרְךָ
  choice: mache dich fruchtbar
  rationale: Die Hifil-Form von פרה ist kausativ; diese Formulierung wahrt den Sinn und klingt im Deutschen natürlich.
- source_word: וְיַרְבֶּךָ
  choice: mehre dich
  rationale: Die Hifil-Form von רבה bezeichnet hier die zahlenmäßige Vermehrung, besonders durch Nachkommen. „Mehre dich“ ist knapp und im Kontext eines Segens verständlich.
- source_word: וְהָיִיתָ
  choice: sodass du … wirst
  rationale: Die Form bezeichnet in dieser Segensfolge die erwartete Folge der vorausgehenden Segnungen; „sodass“ macht diesen Zusammenhang deutlich, ohne ihn als bloße Zukunftsaussage wiederzugeben.
- source_word: לִקְהַל עַמִּים
  choice: zu einer Gemeinschaft von Völkern
  rationale: קהל bezeichnet eine versammelte oder zusammengehörige Gemeinschaft. „Völker“ bewahrt den Plural עַמִּים und damit den Bezug auf mehrere Völker.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El Schaddai
  rationale: Der Titel wird im Haupttext übersetzt, damit seine Bedeutung unmittelbar verständlich ist; die Umschrift bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Der Konjunktiv I („segne“, „mache“, „mehre“) bewahrt den Charakter eines Segenswunsches. Die Satzstruktur bleibt flüssig und folgt zugleich eng der hebräischen Segensfolge.
