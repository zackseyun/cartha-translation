  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: de
  text: 'Dann rief Isaak Jakob zu sich, segnete ihn und befahl ihm: »Nimm dir keine Frau von den Töchtern Kanaans[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Töchtern Kanaans“; gemeint sind kanaanitische Frauen.'
    reason: Das hebräische Idiom wird im Haupttext beibehalten und für heutige Leser erläutert.
lexical_decisions:
- source_word: וַיִּקְרָא יִצְחָק אֶל־יַעֲקֹב
  choice: Dann rief Isaak Jakob zu sich
  rationale: קרא mit אֶל bezeichnet hier das Rufen beziehungsweise Herbeirufen einer Person. „Zu sich rufen“ gibt den Sinn in natürlichem modernem Deutsch wieder; „Dann“ markiert die erzählerische Abfolge des einleitenden וַ.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: segnete ihn
  rationale: ברך ist das übliche Verb für „segnen“; das Objektpronomen wird direkt wiedergegeben.
- source_word: וַיְצַוֵּהוּ וַיֹּאמֶר לוֹ
  choice: und befahl ihm
  rationale: צוה bezeichnet einen verbindlichen Befehl. Der anschließende Doppelpunkt führt den mit ויאמר לו eingeleiteten Wortlaut idiomatisch ein, ohne die hebräische Verbfolge im Deutschen schwerfällig zu wiederholen.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Nimm dir keine Frau
  rationale: Die negierte Verbform hat hier die Kraft eines Verbots. לקח אשה bezeichnet in diesem Zusammenhang das Nehmen einer Frau zur Ehe; die deutsche Wendung „sich eine Frau nehmen“ bewahrt diesen Sinn.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: von den Töchtern Kanaans
  rationale: Die formal nahe Wiedergabe erhält das hebräische Bild und ist im Deutschen verständlich; gemeint sind Frauen aus der kanaanitischen Bevölkerung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe erzählerische Abfolge bleibt erhalten; der Doppelpunkt vermeidet eine im Deutschen unnötig schwerfällige Wiedergabe von „und befahl ihm und sagte zu ihm“.
