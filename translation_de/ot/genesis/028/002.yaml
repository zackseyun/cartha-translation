base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: de
  text: Mach dich auf und geh nach Paddan-Aram zum Haus Betuëls, des Vaters deiner Mutter, und nimm dir von dort eine Frau, eine von Labans Töchtern, des Bruders deiner Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idiomatischer: „deines Großvaters mütterlicherseits“ und „deines Onkels“. Der Haupttext gibt die hebräischen Verwandtschaftsbezeichnungen ausdrücklich wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Mach dich auf
  rationale: Der Imperativ von קום fordert zum Aufbruch auf. „Mach dich auf“ gibt den Übergang zur folgenden Aufforderung „geh“ würdig und im Deutschen idiomatisch wieder.
- source_word: לֵךְ
  choice: geh
  rationale: Der gewöhnliche Imperativ von הלך wird schlicht und natürlich mit „geh“ wiedergegeben.
- source_word: פַּדֶּנָה אֲרָם
  choice: nach Paddan-Aram
  rationale: Das Richtungs-He wird durch „nach“ ausgedrückt; der Ortsname wird in etablierter deutscher Umschrift wiedergegeben.
- source_word: בֵּיתָה בְתוּאֵל
  choice: zum Haus Betuëls
  rationale: בַּיִת bezeichnet hier Haus beziehungsweise Haushalt als Ziel. Die Formulierung bewahrt die hebräische Struktur und den Richtungssinn.
- source_word: אֲבִי אִמֶּךָ
  choice: des Vaters deiner Mutter
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten, statt sie im Haupttext mit „Großvater mütterlicherseits“ zusammenzufassen.
- source_word: וְקַח לְךָ
  choice: und nimm dir
  rationale: לקח bedeutet „nehmen“; das ethische Dativpronomen לְךָ wird im natürlichen deutschen „dir“ bewahrt.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die ausdrücklich vorhandene Präposition מן wird wiedergegeben.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Im Zusammenhang der Heirat bezeichnet אִשָּׁה eine Frau als Ehefrau; das deutsche „eine Frau nehmen“ trägt hier eindeutig diesen Sinn.
- source_word: מִבְּנוֹת לָבָן
  choice: aus den Töchtern Labans
  rationale: Die partitive Konstruktion wird eng am Hebräischen und zugleich verständlich wiedergegeben.
- source_word: אֲחִי אִמֶּךָ
  choice: des Bruders deiner Mutter
  rationale: Die ausdrückliche hebräische Verwandtschaftsformulierung bleibt erhalten; die idiomatische Kurzform wird in der Fußnote genannt.
