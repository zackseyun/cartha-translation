source:
  edition: WLC
  text: וַ/יִּיקַ֣ץ יַעֲקֹב֮ מִ/שְּׁנָת/וֹ֒ וַ/יֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהוָ֔ה בַּ/מָּק֖וֹם הַ/זֶּ֑ה וְ/אָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: de
  text: 'Da erwachte Jakob aus seinem Schlaf und sagte: »Tatsächlich ist Jahwe an diesem Ort, und ich wusste es nicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: erwachte
  rationale: Das Verb bezeichnet das Erwachen aus dem Schlaf; »erwachte« ist im Deutschen präzise und erzählerisch natürlich.
- source_word: מִשְּׁנָתוֹ
  choice: aus seinem Schlaf
  rationale: Die Wendung gibt den hebräischen Ausdruck direkt und idiomatisch wieder.
- source_word: אָכֵן
  choice: Tatsächlich
  rationale: Die Partikel kennzeichnet eine nachdrückliche, überraschende Erkenntnis. »Tatsächlich« bringt Jakobs plötzliches Erkennen in natürlichem modernem Deutsch zum Ausdruck.
- source_word: יֵשׁ
  choice: ist
  rationale: Die Existenzpartikel bezeichnet hier Gegenwart beziehungsweise Anwesenheit; zusammen mit der Ortsangabe ist »ist … an diesem Ort« die natürliche deutsche Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Formulierung bezeichnet konkret den Ort, an dem Jakob geschlafen und den Traum empfangen hat; »an diesem Ort« ist präzise und idiomatisch.
- source_word: וְאָנֹכִי
  choice: und ich
  rationale: Das selbstständige Pronomen hebt Jakob hervor und stellt seine bisherige Unwissenheit der Gegenwart Jahwes gegenüber; die koordinierende Form bewahrt den hebräischen Satzanschluss.
- source_word: לֹא יָדָעְתִּי
  choice: ich wusste es nicht
  rationale: Die Perfektform blickt auf Jakobs bisherige Unkenntnis zurück. Das deutsche »es« nimmt den zuvor ausgesprochenen Sachverhalt auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Gegenwart Jahwes an diesem Ort
  choice: ist Jahwe an diesem Ort
  alternative: Jahwe ist an diesem Ort gegenwärtig
  rationale: Die knappe Form wahrt die Aussage des hebräischen Textes, ohne näher zu bestimmen, in welchem Sinn Jahwe dort gegenwärtig ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung mit vorangestelltem »Tatsächlich« unterstreicht Jakobs plötzliches Erkennen; der Satz bleibt bewusst knapp und deutet die Art der göttlichen Gegenwart nicht weiter aus.
