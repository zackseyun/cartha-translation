base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: de
  text: Da schickte Isaak Jakob fort, und er ging nach Paddan-Aram zu Laban, dem Sohn Betuëls, des Aramäers, und Bruder Rebekkas, der Mutter Jakobs und Esaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte … fort
  rationale: Das Verb שׁלח bezeichnet hier das Entsenden beziehungsweise Fortschicken Jakobs; die Formulierung gibt sowohl Isaaks Veranlassung als auch den Aufbruch natürlich wieder.
- source_word: וַיֵּלֶךְ
  choice: und dieser ging
  rationale: הלך ist das gewöhnliche Verb für »gehen«. Das Demonstrativpronomen »dieser« macht im Deutschen eindeutig, dass Jakob das Subjekt ist.
- source_word: פַּדֶּנָה אֲרָם
  choice: nach Paddan-Aram
  rationale: Der Ortsname wird transliteriert; die Richtungsendung wird idiomatisch mit »nach« wiedergegeben.
- source_word: בֶּן בְּתוּאֵל
  choice: dem Sohn Betuëls
  rationale: Die hebräische Abstammungsangabe wird in natürlichem Deutsch als »Sohn Betuëls« wiedergegeben.
- source_word: הָאֲרַמִּי
  choice: des Aramäers
  rationale: אֲרַמִּי bezeichnet präzise einen Aramäer; »Syrer« wäre eine ältere, historisch weniger genaue Wiedergabe.
- source_word: אֲחִי רִבְקָה
  choice: dem Bruder Rebekkas
  rationale: Die Apposition bleibt eng am hebräischen Satzbau und ist zugleich idiomatisches Deutsch.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: der Mutter Jakobs und Esaus
  rationale: Die erklärende Apposition zu Rebekka wird vollständig bewahrt.
