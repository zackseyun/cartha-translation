base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: de
  text: 'Sie hatten die Stadt verlassen und waren noch nicht weit gekommen, da sagte Josef zu seinem Hausverwalter[a]: „Auf! Jage den Männern nach. Wenn du sie eingeholt hast, sag zu ihnen: ›Warum habt ihr Böses für Gutes vergolten?‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu dem, der über seinem Haus war“. Gemeint ist der Verwalter seines Haushalts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: Sie hatten die Stadt verlassen und waren noch nicht weit gekommen
  rationale: Die Vorzeitigkeit gegenüber Josefs anschließendem Befehl wird im Deutschen natürlich mit dem Plusquamperfekt ausgedrückt. הִרְחִיקוּ bezeichnet hier das Sich-Entfernen beziehungsweise Weitkommen.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: zu seinem Hausverwalter[a]
  rationale: Die Wendung bedeutet wörtlich „zu dem, der über sein Haus gesetzt war“ und bezeichnet den verantwortlichen Verwalter des Haushalts. „Hausverwalter“ ist knapp und in diesem Zusammenhang verständlich; die wörtliche Form steht in der Fußnote.
- source_word: קוּם
  choice: Auf!
  rationale: Der Imperativ leitet einen dringlichen Handlungsbefehl ein. „Auf!“ bewahrt diese knappe, antreibende Kraft in würdigem modernem Deutsch.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: Jage den Männern nach
  rationale: רָדַף mit אַחֲרֵי bezeichnet das Verfolgen oder Nachjagen. Die Formulierung hält den Bezug auf die ausdrücklich genannten Männer fest.
- source_word: וְהִשַּׂגְתָּם
  choice: Wenn du sie eingeholt hast
  rationale: Der Hifil von נשׂג bedeutet „erreichen, einholen“. Die temporale Wiedergabe mit „wenn“ macht die Abfolge der Befehle im Deutschen idiomatisch deutlich.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: Warum habt ihr Gutes mit Bösem vergolten?
  rationale: Der Piel von שׁלם bedeutet hier „vergelten“. Die deutsche Verbindung „Gutes mit Bösem vergelten“ gibt den ethischen Gegensatz und die Bedeutung von תַּחַת natürlich wieder.
