  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: de
  text: 'Sieh doch: Das Silber, das wir an den Öffnungen unserer Säcke gefunden haben,[a] brachten wir dir aus dem Land Kanaan zurück. Wie sollten wir da Silber oder Gold aus dem Haus deines Herrn stehlen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Mund unserer Säcke“; gemeint sind die Öffnungen der Säcke.'
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Sieh doch
  rationale: Die Diskurspartikel lenkt nachdrücklich die Aufmerksamkeit auf das folgende Argument. „Sieh doch“ klingt im modernen Deutschen natürlich und bewahrt den appellativen Nachdruck.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Das Wort bezeichnet wörtlich Silber und im Kontext zugleich Zahlungsmittel. „Silber“ bewahrt die konkrete Formulierung und den späteren Gegensatz zu Gold.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: oben in unseren Säcken
  rationale: Wörtlich steht „im Mund unserer Säcke“, eine Bezeichnung für deren Öffnung beziehungsweise oberen Bereich. Die Übersetzung gibt den gemeinten Ort natürlich wieder; die Fußnote bewahrt das hebräische Bild.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: brachten wir dir … zurück
  rationale: Der Hifil von שוב bezeichnet hier das Zurückbringen. Die deutsche Formulierung ist idiomatisch und macht die bewusste Rückgabe deutlich.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: aus dem Land Kanaan
  rationale: Natürliche moderne Wiedergabe der geografischen Herkunftsangabe.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Wie sollten wir da … stehlen?
  rationale: Die rhetorische Frage zieht eine Folgerung aus dem zuvor genannten Verhalten. „Da“ gibt diesen argumentativen Zusammenhang wieder, während „sollten“ die modale Kraft der Frage natürlich ausdrückt.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: aus dem Haus deines Herrn
  rationale: אדון bezeichnet hier den menschlichen Vorgesetzten des Verwalters. „Herr“ ist in diesem antiken Dienstverhältnis angemessen; „Haus“ bewahrt die metonymisch offene Formulierung des Hebräischen.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: Silber oder Gold
  rationale: Die konkrete Wortpaarung wird beibehalten und nimmt das zuvor erwähnte Silber erneut auf.
