  source_fidelity: 'Der deutsche Text gibt die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: Juda wird ausdrücklich vor seinen Brüdern genannt; die Bewegung in Josefs Haus wird erfasst; Josefs fortdauernde Anwesenheit wird klar ausgedrückt; und die Niederwerfung vor ihm „zur Erde“ ist sachgerecht wiedergegeben. „Mit seinen Brüdern“ ist eine idiomatische deutsche Wiedergabe der hebräischen Koordination, ohne die hervorgehobene Nennung Judas aufzuheben.'
  naturalness: „Da kam Juda mit seinen Brüdern in Josefs Haus. Josef war noch dort, und sie warfen sich vor ihm zu Boden.“ ist modernes, flüssiges Standarddeutsch mit angemessen würdigem Erzählregister. Die Satzteilung macht die situative Angabe zu Josef klar, ohne den narrativen Zusammenhang zu verlieren.
  terminology: Die Namensformen Juda und Josef sind im deutschen Bibelgebrauch üblich. „Sie warfen sich vor ihm zu Boden“ gibt die im Kontext erkennbare Geste der Unterwerfung bzw. Huldigung natürlich wieder, ohne eine weitergehende theologische Deutung einzutragen.
