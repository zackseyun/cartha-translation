base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: de
  text: Da kam Juda mit seinen Brüdern in Josefs Haus. Josef war noch dort, und sie warfen sich vor ihm zu Boden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da kam“ ist in deutscher Erzählprosa natürlich und gibt die Bewegung zum Ziel wieder.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Juda mit seinen Brüdern
  rationale: Der hebräische Wortlaut nennt Juda ausdrücklich zuerst und hebt ihn damit als führende Person hervor; „mit“ klingt im Deutschen bei einem singularischen Verb natürlich.
- source_word: בֵּיתָה יוֹסֵף
  choice: in Josefs Haus
  rationale: Die Richtungsendung an בֵּיתָה bezeichnet eine Bewegung auf das Haus zu beziehungsweise hinein; der Kontext legt den Eintritt nahe.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Josef war noch dort
  rationale: Das Pronomen bezieht sich eindeutig auf Josef. Die Wiederaufnahme seines Namens verhindert im Deutschen eine mögliche Verwechslung mit Juda; עוֹדֶנּוּ bezeichnet das Fortdauern seiner Anwesenheit.
- source_word: וַיִּפְּלוּ לְפָנָיו אָרְצָה
  choice: sie warfen sich vor ihm zu Boden
  rationale: נפל bedeutet grundsätzlich „fallen“, bezeichnet hier mit „vor ihm“ und der Richtungsangabe „zur Erde“ jedoch eine bewusste Niederwerfung. Die deutsche Wendung gibt Handlung, Richtung und Huldigung natürlich wieder.
