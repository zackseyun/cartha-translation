base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: de
  text: Ist das nicht der Becher, aus dem mein Herr trinkt und mit dem er gewiss Wahrsagung betreibt?[a] Ihr habt böse gehandelt, indem ihr dies getan habt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und mit dem er ganz sicher wahrsagt«. Im Hebräischen verstärkt ein Infinitivus absolutus das finite Verb.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische wiederholt das Verb »tun«: »Ihr habt Böses getan, das ihr getan habt.«'
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Ist das nicht der Becher
  rationale: Die rhetorische Frage erwartet Zustimmung. Das im Kontext gemeinte Bezugswort »Becher« wird im Deutschen zur natürlichen und eindeutigen Formulierung ergänzt.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: aus dem mein Herr trinkt
  rationale: ב bei »trinken« wird idiomatisch mit »aus« wiedergegeben. »Mein Herr« bezeichnet hier Joseph als den Herrn des Verwalters und bewahrt den gesellschaftlichen Titel.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: und mit dem er gewiss Wahrsagung betreibt
  rationale: Das zweite בּוֹ bezeichnet wahrscheinlich das Mittel der Wahrsagung. Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; »gewiss« bildet diese Hervorhebung ab.
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: Ihr habt böse gehandelt, als ihr dies getan habt
  rationale: Die Form von רעע bezeichnet böses beziehungsweise verwerfliches Handeln. Der Relativsatz wird natürlich wiedergegeben, ohne seinen Bezug auf die konkrete Tat zu verlieren.
theological_decisions:
- issue: Ob Joseph tatsächlich Wahrsagung betrieb oder ob die Aussage nur zu seiner Rolle im Prüfgeschehen gehörte
  choice: 'Die Aussage des Verwalters wird ohne Abschwächung als Behauptung innerhalb der Figurenrede übersetzt: »er ... Wahrsagung betreibt«.'
  alternative: Die Formulierung so abzuschwächen, dass sie nur einen Ruf, eine Fähigkeit oder einen Vorwand bezeichnet.
  rationale: Der hebräische Wortlaut der Figurenrede behauptet die Wahrsagung ausdrücklich. Die Übersetzung entscheidet nicht, ob diese Behauptung außerhalb der Figurenrede historisch zutrifft oder Teil von Josephs Täuschungsmanöver ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Wahrsagung betreiben« bewahrt den ausdrücklich divinatorischen Sinn, während »gewiss« die hebräische Verstärkung wiedergibt. Die Wiederholung im Schlusssatz wird im Haupttext leicht geglättet und in der Fußnote formal sichtbar gemacht.
