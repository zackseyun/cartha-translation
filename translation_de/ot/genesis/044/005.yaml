  verdict: revise
  source_fidelity: Der Becher, das Trinken daraus und die Wahrsagung mithilfe des Bechers sind zutreffend wiedergegeben. Die Verstärkung durch Infinitivus absolutus wird mit »gewiss« angemessen markiert. Im Schlusssatz gibt »als« jedoch primär einen zeitlichen Zusammenhang wieder, während der hebräische Relativsatz die konkrete Tat als den Anlass bzw. Inhalt des bösen Handelns bestimmt.
  naturalness: Der Hauptsatz ist modernes, würdiges Standarddeutsch. »Böse gehandelt, indem ihr dies getan habt« ist gegenüber der zeitlichen Formulierung genauer und bleibt verständlich; die leichte Wiederaufnahme von »getan« spiegelt zugleich die hebräische Wiederholung. Die bisherige Fußnote b behauptet mit »wörtlicher« eine Konstruktion mit »mit«, die im Hebräischen nicht steht.
  terminology: »Mein Herr« ist als gesellschaftliche Anrede im erzählerischen Kontext passend. »Wahrsagung betreibt« gibt den divinatorischen Sinn von נחש sachgerecht wieder, ohne über die Figurenrede hinaus eine Aussage über Joseph zu treffen.
  issues:
  - severity: medium
    issue: Der Schlusssatz verwendet »als ihr dies getan habt«.
    rationale: »Als« bedeutet hier vor allem »zu der Zeit, als«. Der hebräische Relativsatz אֲשֶׁר עֲשִׂיתֶם bezieht die Verurteilung auf die begangene Tat selbst. »Indem ihr dies getan habt« bildet diesen Zusammenhang genauer ab.
  - severity: low
    issue: Fußnote b bezeichnet eine Wiedergabe mit »mit dem« als wörtlich.
    rationale: Im hebräischen Schlusssatz steht keine Präposition, die »mit« entspräche. Die Fußnote sollte stattdessen die Verbwiederholung erläutern.
