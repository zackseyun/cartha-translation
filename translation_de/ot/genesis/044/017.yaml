  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: de
  text: 'Doch er sagte: »Es sei fern von mir, so etwas zu tun! Der Mann, in dessen Hand der Becher gefunden wurde – er soll mein Sklave sein. Ihr aber zieht in Frieden zu eurem Vater hinauf.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Es sei fern von mir
  rationale: Die feste hebräische Wendung drückt entschiedene Zurückweisung und Abscheu aus. Die deutsche Formulierung bewahrt Bild und Nachdruck und ist in gehobener, aber verständlicher Sprache geläufig.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: so etwas zu tun
  rationale: Gibt die abgelehnte Handlung natürlich wieder; »so etwas« nimmt den unmittelbar zuvor vorgeschlagenen Vollzug auf.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Der Mann, in dessen Hand der Becher gefunden wurde
  rationale: Bewahrt bewusst das konkrete hebräische Bild »in seiner Hand«, das hier Besitz beziehungsweise Gewahrsam bezeichnet.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: er soll mein Sklave sein
  rationale: עָבֶד kann »Diener« oder »Sklave« bedeuten. Da hier als Strafe dauerhafte persönliche Unfreiheit angedroht wird, bringt »Sklave« den Zwangscharakter klarer zum Ausdruck.
- source_word: וְאַתֶּם עֲלוּ
  choice: Ihr aber zieht … hinauf
  rationale: Der Imperativ Plural entlässt die übrigen Brüder und steht im Kontrast zum Schicksal des Beschuldigten. »Hinaufziehen« entspricht der räumlichen Erzählperspektive der Reise nach Kanaan.
- source_word: לְשָׁלוֹם
  choice: in Frieden
  rationale: Die idiomatische Wendung bezeichnet eine unbehelligte, sichere Rückkehr und bleibt im Deutschen verständlich und würdevoll.
- source_word: אֶל אֲבִיכֶם
  choice: zu eurem Vater
  rationale: Direkte und natürliche Wiedergabe des Ziels der Rückreise.
theological_decisions: []
