base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: de
  text: 'Doch wir sagten: »Wir können nicht hinabziehen. Wenn unser jüngster Bruder bei uns ist, werden wir hinabziehen; denn wir können nicht vor dem Mann erscheinen, wenn unser jüngster Bruder nicht bei uns ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Doch wir sagten
  rationale: Das Waw führt die Erzählung weiter; „doch“ gibt im Zusammenhang zugleich den leichten Gegensatz zu der zuvor genannten Forderung wieder. אמר bedeutet schlicht „sagen“.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Wir können nicht hinabziehen
  rationale: יכל bezeichnet die Fähigkeit oder Möglichkeit. ירד wird als „hinabziehen“ wiedergegeben, da die Reise nach Ägypten im Hebräischen räumlich als Abstieg beschrieben wird.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: Wenn unser jüngster Bruder bei uns ist
  rationale: Die positive Bedingung wird entsprechend der hebräischen Satzstruktur bewahrt. הקטן bezeichnet im Familienzusammenhang den jüngsten Bruder, nicht lediglich einen kleinen oder jüngeren Bruder.
- source_word: וְיָרַדְנוּ
  choice: werden wir hinabziehen
  rationale: Die Form bezeichnet hier die Folge der vorangehenden Bedingung. Das deutsche Futur macht diese Folgerung klar, ohne sie in den ersten Satz einzubauen.
- source_word: כִּי
  choice: denn
  rationale: כי leitet die Begründung für die Weigerung ein. „Denn“ entspricht dem würdigen Erzählregister und lässt die argumentative Verbindung deutlich werden.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: dem Mann unter die Augen treten
  rationale: Die wörtliche Wendung „das Gesicht des Mannes sehen“ ist hier idiomatisch im Sinn von vor ihm erscheinen oder in seine Gegenwart kommen. Die deutsche Redewendung bewahrt das Bild der Augen beziehungsweise des Gesichts und vermittelt den Sinn natürlich.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Das Hebräische verwendet hier keine Amtsbezeichnung, sondern schlicht „der Mann“, obwohl Josef in amtlicher Stellung gemeint ist.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: wenn unser jüngster Bruder nicht bei uns ist
  rationale: Das Hebräische reiht die negative Umstandsangabe mit Waw an. Im Deutschen bringt ein Konditionalsatz den gemeinten Zusammenhang natürlich und genau zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „hinabziehen“ und die zweistufige Aussage – zunächst die Weigerung, dann die Bedingung – bleiben entsprechend der hebräischen Struktur erhalten. Die idiomatische Wendung wird im Haupttext natürlich deutsch wiedergegeben und in der Fußnote wörtlich erläutert.
