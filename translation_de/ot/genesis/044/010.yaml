  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: de
  text: 'Und er sagte: „Nun gut, es soll so sein, wie ihr gesagt habt. Derjenige, bei dem der Becher gefunden wird, wird mein Sklave[a] sein, ihr aber werdet frei von Schuld sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Knecht“. Das hebräische Wort kann einen Knecht oder einen Sklaven bezeichnen; hier steht der als Strafe auferlegte unfreie Status im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Nun gut
  rationale: Die Wendung leitet hier die unmittelbare Antwort und grundsätzliche Zustimmung ein. „Nun gut“ gibt diese Funktion im modernen Deutschen idiomatisch wieder, ohne eine unnatürliche wörtliche Zeitangabe zu erzwingen.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: es soll so sein, wie ihr gesagt habt
  rationale: Die hebräische Formulierung bestätigt die zuvor vorgeschlagenen Bedingungen grundsätzlich. Die deutsche Soll-Form wahrt den festsetzenden Charakter der Antwort.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Bei wem er gefunden wird
  rationale: Das nicht eigens genannte Objekt ist im Zusammenhang der Becher. Das Pronomen „er“ nimmt im Deutschen dessen grammatisches Geschlecht auf und hält die relative Konstruktion knapp.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: der soll mein Sklave sein
  rationale: עֶבֶד bezeichnet hier eine unfreiwillige, als Strafe auferlegte Abhängigkeit. „Sklave“ bildet diesen Zwangsstatus genauer ab als das heute oft freiwillig verstandene „Diener“.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: ihr aber sollt frei von Schuld sein
  rationale: נָקִי bezeichnet hier Freiheit von Schuld beziehungsweise Haftung. „Frei von Schuld“ bewahrt die rechtliche Bedeutung, während „aber“ den Gegensatz zum Schicksal des Finders natürlich ausdrückt.
