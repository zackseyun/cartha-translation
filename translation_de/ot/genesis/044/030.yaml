source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹאִ/י֙ אֶל עַבְדְּ/ךָ֣ אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתָּ֑/נוּ וְ/נַפְשׁ֖/וֹ קְשׁוּרָ֥ה בְ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: de
  text: 'Und nun: Wenn ich zu deinem Diener, meinem Vater, komme und der Junge nicht bei uns ist – sein Leben ist mit dem Leben des Jungen verbunden –'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den Übergang zum nächsten Schritt in Judas Bitte.
- source_word: כְּבֹאִי
  choice: wenn ich … komme
  rationale: Die Präposition כְּ mit Infinitiv constructus und Suffix der 1. Person Singular hat hier temporalen Sinn.
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: zu deinem Diener, meinem Vater
  rationale: Gibt Judas ehrerbietige Bezeichnung Jakobs gegenüber Josef wieder; das Komma macht die Apposition im Deutschen deutlich.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Entspricht der familiären und emotionalen Perspektive der Rede, ohne Benjamin als kleines Kind festzulegen.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: nicht bei uns ist
  rationale: Natürliche und genaue Wiedergabe der hebräischen Negativ-Existenzkonstruktion.
- source_word: וְנַפְשׁוֹ קְשׁוּרָה בְנַפְשׁוֹ
  choice: sein Leben aber ist mit dessen Leben verbunden
  rationale: נֶפֶשׁ bezeichnet hier das Leben bzw. die ganze Person. „Dessen“ lässt den kontextuellen Bezug des zweiten Pronomens auf den Jungen erkennen, ohne den hebräischen Ausdruck unnötig auszudeuten.
theological_decisions:
- issue: Bezug des zweiten Suffixes in בְנַפְשׁוֹ
  choice: Bezug auf den Jungen Benjamin („dessen Leben“)
  alternative: 'wörtlich und formal mehrdeutig: „mit seinem Leben“'
  rationale: Der Kontext unterscheidet das Leben des Vaters vom Leben des Jungen; eine reflexive Deutung ergäbe hier keinen sinnvollen Gegensatz.
- issue: Verhältnis des letzten Satzteils zum Vorangehenden
  choice: als begleitender bzw. erläuternder Umstand, mit „aber“ und Gedankenstrichen
  alternative: 'ausdrücklich kausal: „denn/da sein Leben …“'
  rationale: Die Partizipialkonstruktion beschreibt den Zustand, ohne die logische Beziehung ausdrücklich als kausal festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im Hebräischen unvollendet und führt unmittelbar in Vers 31 weiter. Gedankenstriche markieren den erläuternden Umstand, ohne ihn ausdrücklich kausal festzulegen.
