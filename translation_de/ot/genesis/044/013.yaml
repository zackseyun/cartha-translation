source:
  edition: WLC
  text: וַֽ/יִּקְרְע֖וּ שִׂמְלֹתָ֑/ם וַֽ/יַּעֲמֹס֙ אִ֣ישׁ עַל חֲמֹר֔/וֹ וַ/יָּשֻׁ֖בוּ הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: de
  text: Da zerrissen sie ihre Kleider[a]. Jeder belud seinen Esel, und sie kehrten in die Stadt zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gewänder“. Das hebräische Wort kann allgemein äußere Kleidungsstücke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: sie zerrissen
  rationale: Das Verb קרע bezeichnet das Zerreißen; im Zusammenhang mit Kleidung ist die Handlung ein sichtbarer Ausdruck von Bestürzung und Verzweiflung. „Zerrissen“ gibt die konkrete Handlung natürlich und genau wieder.
- source_word: שִׂמְלֹתָם
  choice: ihre Kleider
  rationale: שִׂמְלָה bezeichnet Kleidung beziehungsweise ein äußeres Kleidungsstück. „Kleider“ ist im biblischen Erzählzusammenhang eine geläufige, würdige und umfassende Wiedergabe.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: Jeder belud seinen Esel
  rationale: עמס bedeutet „beladen“ oder „eine Last auflegen“. Das singularische אִישׁ wird distributiv gebraucht und bezeichnet jeden Einzelnen aus der zuvor genannten Gruppe.
- source_word: אִישׁ
  choice: jeder
  rationale: Das Wort hat hier distributive Funktion. Da ausschließlich die Brüder gemeint sind, gibt „jeder“ den Sinn im Deutschen knapp und eindeutig wieder, ohne die männliche Referenz zu verwischen.
- source_word: חֲמֹרוֹ
  choice: seinen Esel
  rationale: חֲמוֹר ist die gewöhnliche Bezeichnung für einen Esel; das Possessivsuffix wird mit „seinen“ wiedergegeben.
- source_word: וַיָּשֻׁבוּ
  choice: sie kehrten … zurück
  rationale: שׁוב bedeutet hier, an den zuvor verlassenen Ort zurückzukehren. Die deutsche Verbklammer „kehrten … zurück“ entspricht dem natürlichen Erzählstil.
- source_word: הָעִירָה
  choice: in die Stadt
  rationale: Das Richtungs-he bezeichnet eine Bewegung auf die Stadt zu. Im Deutschen ist bei „zurückkehren“ die Formulierung „in die Stadt“ idiomatisch und präzise.
