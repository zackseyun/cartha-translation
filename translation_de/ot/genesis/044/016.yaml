  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: de
  text: 'Da sagte Juda: »Was sollen wir meinem Herrn sagen? Was sollen wir vorbringen? Und wie könnten wir uns rechtfertigen?[a] Gott hat die Schuld deiner Knechte aufgedeckt.[b] Sieh, wir sind Sklaven meines Herrn[c] – sowohl wir als auch der, in dessen Hand der Becher gefunden wurde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie könnten wir uns für unschuldig erklären?« Das hebräische Verb kann bedeuten, sich als im Recht zu erweisen oder sich zu rechtfertigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Gott hat die Schuld deiner Knechte gefunden.« Gemeint sein kann, dass Gott verborgene Schuld ans Licht gebracht hat.'
    reason: lexical_alternative
  - marker: c
    text: »Knechte« ist zunächst eine ehrerbietige Selbstbezeichnung gegenüber einem Höhergestellten; »Sklaven« bezeichnet danach den Status der Unfreiheit, den die Brüder anbieten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: meinem Herrn / meines Herrn
  rationale: Die höfische Anrede richtet sich an Josef als Autoritätsperson, nicht an Gott. »Herr« wahrt den ehrerbietigen Ton besser als das flachere »mein Gebieter«.
- source_word: נֹאמַר / נְדַבֵּר
  choice: sagen / vorbringen
  rationale: Die beiden Verben werden im Deutschen unterschieden; »vorbringen« lässt beim zweiten Verb den Gedanken einer Verteidigung anklingen, ohne es auf ein förmliches Plädoyer festzulegen.
- source_word: נִצְטַדָּק
  choice: uns rechtfertigen
  rationale: Der Hitpael von צדק bezeichnet hier, sich als im Recht zu erweisen oder sich zu rechtfertigen. Die Fußnote bewahrt die naheliegende Alternative »uns für unschuldig erklären«.
- source_word: מָצָא אֶת־עֲוֹן
  choice: hat die Schuld aufgedeckt
  rationale: Wörtlich steht »hat die Schuld gefunden«; im Zusammenhang geht es darum, dass verborgene Schuld ans Licht gebracht wurde.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: deine Knechte / Sklaven meines Herrn
  rationale: Das erste Vorkommen ist eine ehrerbietige Selbstbezeichnung vor einem Höhergestellten; das zweite bezeichnet den angebotenen tatsächlichen Status der Unfreiheit. Die unterschiedliche Wiedergabe erhält diesen pragmatischen Gegensatz.
- source_word: הִנֶּנּוּ
  choice: Sieh, wir sind nun
  rationale: »Sieh« gibt die präsentierende und hingebende Funktion der Partikel wieder; »nun« macht im Deutschen den Übergang in den angebotenen Sklavenstatus natürlich deutlich.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: sowohl wir als auch der, in dessen Hand der Becher gefunden wurde
  rationale: Die doppelte Inklusionsformel גַּם … גַּם wird mit »sowohl … als auch« wiedergegeben; »in dessen Hand« bewahrt die konkrete und rechtlich gefärbte hebräische Formulierung.
- source_word: הַגָּבִיעַ
  choice: der Becher
  rationale: »Becher« ist im modernen Deutschen natürlich und bezeichnet das Gefäß genauer als das allgemeinere »Gefäß«.
theological_decisions:
- issue: Bezug von הָאֱלֹהִים in Judas Bekenntnis
  choice: Juda schreibt die Aufdeckung ihrer Schuld Gott zu.
  alternative: Eine unbestimmte göttliche Macht habe ihr Vergehen aufgedeckt.
  rationale: Der Artikel, die Erzählwelt der Genesis und Judas Aussage sprechen hier für den einen Gott. Welche konkrete frühere Schuld Juda meint, wird nicht ausdrücklich festgelegt und daher nicht in den Text hineingedeutet.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Vergehen; Sünde; Schuldstrafe
  rationale: »Schuld« wahrt die mögliche Verbindung von schuldhaftem Tun und daraus erwachsender Verantwortlichkeit, ohne Judas Aussage ausschließlich auf den Becherfund oder ausdrücklich auf den Verkauf Josefs festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit hörbarer höfischer Unterordnung. Die rhetorische Dreierfolge bleibt erhalten; zwischen respektvoller Selbstbezeichnung und tatsächlicher Versklavung wird sprachlich unterschieden. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
