  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: de
  text: »Und lege meinen Becher, den silbernen Becher, oben in den Sack des Jüngsten, zusammen mit dem Silber für sein Getreide.« Und er tat, was Josef ihm gesagt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: meinen Becher, den silbernen Becher
  rationale: גְּבִיעַ bezeichnet einen Becher oder Pokal. „Becher“ ist im modernen Deutsch natürlich; die appositionelle Wiederholung des Hebräischen bleibt erhalten.
- source_word: תָּשִׂים
  choice: legst du
  rationale: שׂים bedeutet „setzen, legen, tun“. Im Zusammenhang mit einem Gegenstand in einem Sack ist „legen“ idiomatisch; die deutsche Präsensform gibt die direkt angeschlossene Anweisung wieder.
- source_word: בְּפִי אַמְתַּחַת
  choice: oben in den Sack
  rationale: Wörtlich steht „in die Mündung/den Mund des Sacks“. Gemeint ist der obere beziehungsweise offene Bereich des Sacks. Die Wiedergabe vermeidet im Deutschen das missverständliche Bild eines Sackmundes und bewahrt die räumliche Angabe.
- source_word: הַקָּטֹן
  choice: des Jüngsten
  rationale: Wörtlich „des Kleinen/Jungen“; im Erzählzusammenhang ist der jüngste Bruder gemeint. Die substantivierte Superlativform ist knapp und natürlich.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: das Silber für sein Getreide
  rationale: כֶּסֶף ist hier das als Zahlungsmittel verwendete Silber; שִׁבְרוֹ bezeichnet in den Hungersnot-Erzählungen sein gekauftes Getreide beziehungsweise dessen Kauf. Die Formulierung erhält den konkreten Silberbezug und den Handelssinn.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: Und er tat, was Josef ihm gesagt hatte
  rationale: Die natürliche deutsche Form gibt „er tat gemäß dem Wort Josefs, das er gesprochen hatte“ vollständig wieder. Das im Deutschen ergänzte „ihm“ macht den Adressatenbezug deutlich, der aus dem Kontext hervorgeht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Wiederholung „meinen Becher, den silbernen Becher“ bleibt erhalten; unnötig hölzerne Hebraismen werden zugunsten verständlicher Erzählprosa idiomatisch wiedergegeben.
