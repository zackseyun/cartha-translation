  text: וַ/יֹּ֖אמֶר אָבִ֑י/נוּ שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: de
  text: 'Da sagte unser Vater: »Kehrt zurück und kauft uns ein wenig zu essen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge im modernen Deutsch natürlich wieder.
- source_word: אָבִינוּ
  choice: unser Vater
  rationale: Gemeint ist hier eindeutig Jakob als unmittelbarer Vater der Brüder.
- source_word: שֻׁבוּ
  choice: Geht noch einmal hin
  rationale: Das Imperativverb שוב fordert die Brüder auf, die Reise erneut anzutreten. Diese Formulierung ist im Zusammenhang natürlicher als ein isoliertes »Kehrt zurück«.
- source_word: שִׁבְרוּ
  choice: kauft
  rationale: שבר bezeichnet in der Josefgeschichte den Kauf von Getreide beziehungsweise Nahrung; da das Objekt ausdrücklich folgt, genügt »kauft«.
- source_word: לָנוּ
  choice: uns
  rationale: Der Dativ gibt die benefaktive Bedeutung der Präposition ל idiomatisch wieder.
- source_word: מְעַט
  choice: ein wenig
  rationale: Die Wendung bewahrt die Aussage einer kleinen Menge knapp und natürlich.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: אֹכֶל ist ein allgemeiner Ausdruck für Nahrung. »Nahrung« bewahrt diese Breite, ohne den Ausdruck aufgrund des Kontexts auf »Getreide« einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Rede. »Geht noch einmal hin« gibt die kontextuelle Wiederholung der Reise idiomatisch wieder; »Nahrung« wahrt die lexikalische Allgemeinheit des hebräischen אֹכֶל.
