  source_fidelity: 'Die Übersetzung gibt die Abfolge, den Befehl, die Mengenangabe und die distributive Formulierung zum Silber zutreffend wieder. „Oben in seinen Sack“ ist jedoch keine genaue Wiedergabe von בְּפִי אַמְתַּחְתּוֹ: Gemeint ist die Sacköffnung, nicht eine allgemeine obere Stelle im Sack.'
