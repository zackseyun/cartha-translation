  terminology: „Nahrung“, „Säcke“, „Silber“ und „eines jeden“ sind sachgerecht. „Hausverwalter“ bezeichnet die Funktion, ohne über den hebräischen Ausdruck hinaus eine theologische oder institutionelle Deutung einzutragen.
