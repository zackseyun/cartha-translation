  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: de
  text: 'Dann befahl er seinem Hausverwalter: „Fülle die Säcke der Männer mit Nahrung, so viel sie tragen können, und lege das Silber eines jeden in die Öffnung seines Sackes[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Mund seines Sackes“.'
    reason: Die hebräische Wendung „Mund des Sackes“ bezeichnet dessen Öffnung.
lexical_decisions:
- source_word: וַיְצַו
  choice: Dann befahl er
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: dem, der über sein Haus gesetzt war
  rationale: Die Formulierung bleibt nahe bei der hebräischen Wendung für den Verwalter von Josefs Haus, ohne einen spezifischeren Amtstitel einzutragen.
- source_word: מַלֵּא אֶת אַמְתְּחֹת הָאֲנָשִׁים אֹכֶל
  choice: Fülle die Säcke der Männer mit Nahrung
  rationale: „Säcke“ entspricht den Reise- und Vorratsbehältern; „Nahrung“ bewahrt den allgemeinen Sinn von אֹכֶל, statt ihn kontextuell auf Getreide zu verengen.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: so viel sie tragen können
  rationale: Die natürliche deutsche Wendung gibt sowohl die Fähigkeit als auch die Traglast wieder.
- source_word: כֶּסֶף אִישׁ
  choice: das Silber eines jeden
  rationale: „Silber“ bewahrt den Wortlaut, während „eines jeden“ die distributive Bedeutung von אִישׁ ausdrückt.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: oben in seinen Sack
  rationale: Gemeint ist die Sacköffnung. Im modernen deutschen Haupttext wird die räumliche Bedeutung natürlich wiedergegeben; die wörtliche Metapher steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anweisung ist direkt und gut verständlich; die hebräische Körpermetapher bei der Sacköffnung wird zur Klarheit im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
