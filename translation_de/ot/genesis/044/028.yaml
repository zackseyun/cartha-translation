base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: de
  text: 'Der eine ging von mir fort, und ich sagte: »Er ist bestimmt in Stücke gerissen worden!« Seitdem habe ich ihn nicht mehr gesehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Der eine ging von mir fort
  rationale: Gibt das wörtliche »der eine« und die räumliche Trennung von Jakob wieder, ohne den im Hebräischen nicht ausdrücklich genannten Tod vorwegzunehmen.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Er ist bestimmt in Stücke gerissen worden!
  rationale: »Bestimmt« bildet die bekräftigende Partikel אַךְ ab; die Verbindung aus Infinitivus absolutus und finitem Verb wird durch eine nachdrückliche, natürliche deutsche Formulierung wiedergegeben.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: Seitdem habe ich ihn nicht mehr gesehen
  rationale: Natürliche deutsche Wiedergabe des bis zum gegenwärtigen Zeitpunkt andauernden Nichtsehens; der Kontextbezug von »seitdem« entspricht hier עַד הֵנָּה.
