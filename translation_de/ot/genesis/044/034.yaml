    issue: Die Wiedergabe von פֶּן und אֶרְאֶה als „Ich könnte es nicht mit ansehen“ verschiebt die befürchtete Konsequenz zu einer Aussage über Judas Fähigkeit bzw. Belastbarkeit.
    rationale: פֶּן leitet hier die abzuwendende Folge ein („sonst/damit ich nicht“), und אֶרְאֶה besagt, dass Juda das Unglück sehen würde. „Sonst müsste ich mit ansehen“ bringt diese Folge im Deutschen klar und quellennah zum Ausdruck.
  revised_text: Denn wie könnte ich zu meinem Vater hinaufziehen, wenn der Junge nicht bei mir ist? Sonst müsste ich mit ansehen, wie das Unglück meinen Vater trifft.
