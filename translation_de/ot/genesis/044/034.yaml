base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: de
  text: Denn wie könnte ich zu meinem Vater hinaufziehen, wenn der Junge nicht bei mir ist? Sonst müsste ich mit ansehen, wie das Unglück meinen Vater trifft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: hinaufziehen
  rationale: Das Verb עלה bezeichnet hier die Rückreise von Ägypten nach Kanaan als Hinaufziehen und wird mit der traditionellen räumlichen Perspektive natürlich wiedergegeben.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נער kann einen Jungen oder jungen Mann bezeichnen; im familiären Kontext Benjamins ist »der Junge« natürlich und bewahrt Judas Perspektive.
- source_word: בָרָע אֲשֶׁר יִמְצָא אֶת אָבִי
  choice: wenn das Unglück meinen Vater trifft
  rationale: מצא mit רעה beschreibt ein Unglück, das jemanden ereilt. »trifft« gibt die idiomatische Bedeutung im modernen Deutsch klar wieder.
theological_decisions:
- issue: Bedeutung von פֶּן und אֶרְאֶה
  choice: Ich könnte es nicht mit ansehen, wenn …
  alternative: damit ich nicht das Unglück sehe, das meinen Vater treffen wird
  rationale: פֶּן leitet die gefürchtete Folge ein; אֶרְאֶה bedeutet wörtlich »ich sehe«. Die Fassung bewahrt Judas persönliche Furcht, Zeuge des väterlichen Unglücks zu werden, ohne eine unnötig starre Zukunftsaussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die emotionale Zuspitzung des hebräischen Satzes bleiben erhalten; die zweite Satzhälfte ist idiomatisch formuliert, ohne den Sinn abzuschwächen.
