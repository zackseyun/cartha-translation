  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: de
  text: Wenn ihr auch diesen von mir wegnehmt und ihm ein Unglück zustößt, dann werdet ihr mein graues Haar in Kummer in den Scheol[a] hinabbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Totenreich“ oder „das Grab“.
    reason: Lexikalische Bedeutungsalternativen zu שְׁאוֹל.
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: wenn ihr ... wegnehmt
  rationale: Das mit ו eingeleitete Perfekt setzt hier die Bedingungsfolge in Jakobs Rede fort. Die deutsche Wenn-Konstruktion gibt diesen Zusammenhang natürlich wieder.
- source_word: גַּם
  choice: auch
  rationale: Das Wort kennzeichnet die zusätzliche drohende Wegnahme Benjamins nach dem Verlust der anderen Söhne.
- source_word: מֵעִם פָּנַי
  choice: von mir
  rationale: Die Wendung bezeichnet die Trennung von Jakobs Gegenwart. „Von mir“ ist im heutigen Deutsch natürlich und wahrt den Sinn, ohne die hebräische Ausdrucksweise steif nachzubilden.
- source_word: וְקָרָהוּ אָסוֹן
  choice: und ihm ein Unglück zustößt
  rationale: קר״ה bezeichnet ein Geschehen oder Widerfahren; אָסוֹן ist ein schweres Unglück. Die feste deutsche Wendung „ein Unglück stößt ihm zu“ bildet beides treffend ab.
- source_word: וְהוֹרַדְתֶּם
  choice: dann bringt ihr ... hinab
  rationale: Der Hifil von ירד ist kausativ. „Hinabbringen“ bewahrt das räumliche Bild des Abstiegs in den Scheol.
- source_word: שֵׂיבָתִי
  choice: mein graues Haar
  rationale: Die wörtliche Bildsprache bezeichnet metonymisch Jakobs Alter. Sie wird beibehalten, da sie im Erzählzusammenhang wiederkehrt.
- source_word: בְּרָעָה
  choice: voller Kummer
  rationale: רָעָה bezeichnet hier nicht moralische Bosheit, sondern leidvolle Not beziehungsweise Kummer. Die Formulierung beschreibt Jakobs Zustand beim Tod natürlich.
- source_word: שְׁאֹלָה
  choice: in den Scheol
  rationale: Das Richtungs-he bezeichnet die Bewegung zum Scheol. Die Transliteration bewahrt den alttestamentlichen Begriff, ohne ihn vorschnell auf das Grab zu verengen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich oder Grab
  rationale: „Scheol“ erhält die Eigenart und Bedeutungsbreite des hebräischen Begriffs. Die Fußnote nennt verständliche Annäherungen, ohne eine spätere oder engere Jenseitsvorstellung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bedingungsfolge ist klar und natürlich formuliert; die wiederkehrenden Bilder vom grauen Haar und vom Hinabsteigen in den Scheol bleiben erhalten.
