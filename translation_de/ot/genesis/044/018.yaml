  naturalness: „Vor den Ohren meines Herrn“ ist im modernen Standarddeutsch keine natürliche Wendung. „In Gegenwart meines Herrn“ vermittelt die hebräische Hörensidiomatik idiomatisch und bewahrt den feierlich-höfischen Registerton. Auch „trat ... an ihn heran“ ist für die konkrete Annäherung natürlicher als „trat ... zu ihm“.
