base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: de
  text: 'Da trat Juda an ihn heran und sagte: „Bitte, mein Herr, lass deinen Diener in Gegenwart meines Herrn ein Wort sagen[a], und dein Zorn entbrenne nicht gegen deinen Diener[b]; denn du bist wie der Pharao.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Ohren meines Herrn“; gemeint ist: so sprechen, dass mein Herr es hört.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „und sei deinem Diener nicht böse“. Das Hebräische gebraucht das Bild eines entbrennenden Zorns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: Da trat Juda zu ihm
  rationale: נגשׁ bezeichnet hier Judas konkretes, bewusstes Herantreten an Josef. „Trat zu ihm“ ist natürlich, würdevoll und bewahrt die räumliche Bewegung.
- source_word: בִּי אֲדֹנִי
  choice: Bitte, mein Herr
  rationale: בִּי ist eine ehrerbietige Einleitungsbitte; „Bitte“ gibt sie in modernem Deutsch knapp und angemessen wieder. אֲדֹנִי bleibt als höfische Anrede „mein Herr“ erhalten.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: lass deinen Diener ein Wort … sagen
  rationale: Die höfliche Aufforderung mit נָא wird durch „lass“ ausgedrückt. Judas Selbstbezeichnung als „dein Diener“ und der Singular „ein Wort“ bleiben erhalten.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: vor den Ohren meines Herrn
  rationale: Die konkrete hebräische Wendung wird bewahrt und ist im Deutschen verständlich; gemeint ist, dass der Herr die Bitte persönlich anhören möge.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: und dein Zorn entbrenne nicht gegen deinen Diener
  rationale: „Entbrenne“ erhält das hebräische Bild des brennenden Zorns, ohne die zugrunde liegende Körpermetapher von der „Nase“ unnatürlich wörtlich wiederzugeben.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: denn du bist wie der Pharao
  rationale: Die doppelte Vergleichskonstruktion wird direkt wiedergegeben. Sie bezeichnet Josefs pharaonengleiche Stellung und Autorität, ohne vollständige Gleichrangigkeit ausdrücklich zu behaupten.
