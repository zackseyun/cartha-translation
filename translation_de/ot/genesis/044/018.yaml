translation_notes:
  register: Moderne, würdige Standardsprache mit höfischem Ton. Die wiederholten Selbst- und Ehrenbezeichnungen („dein Diener“, „mein Herr“) sowie das Bild des entbrennenden Zorns werden als prägende Merkmale von Judas ehrerbietiger Bitte bewahrt.
