  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: de
  text: Wenn er nun sieht, dass der Junge nicht da ist, wird er sterben, und deine Diener werden das graue Haar deines Dieners, unseres Vaters, in Kummer in den Scheol[a] hinabbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ins Grab« oder »in das Totenreich«. Hebräisch: Scheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: dann
  rationale: Die Wendung leitet hier die Folge der vorausgehenden Bedingung ein; „dann“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: כִּרְאוֹתוֹ
  choice: wenn er sieht
  rationale: Der Infinitiv mit כ und Suffix bezeichnet den zeitlichen Umstand; der Inhalt des Sehens folgt im nächsten Satzteil.
- source_word: כִּי אֵין הַנַּעַר
  choice: dass der Junge nicht da ist
  rationale: אֵין bezeichnet hier die erwartete, aber fehlende Anwesenheit Benjamins; „nicht da“ vermeidet die mögliche Todeskonnotation von „fort“.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann einen Jungen oder jungen Mann bezeichnen; „der Junge“ bewahrt in diesem familiären Zusammenhang Judas Perspektive auf Benjamin.
- source_word: וָמֵת
  choice: wird er sterben
  rationale: Die Verbform setzt die geschilderte Folge fort und bezieht sich im Kontext auf den künftigen Tod des Vaters.
- source_word: וְהוֹרִידוּ
  choice: So werden ... hinabbringen
  rationale: Der Hifil von ירד bedeutet „hinabbringen“; „So“ macht den Folgezusammenhang im Deutschen deutlich, ohne die Bildsprache abzuschwächen.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: In der ehrerbietigen Selbstdarstellung vor einem Herrscher ist „Diener“ die natürliche Entsprechung, ohne hier einen rechtlichen Sklavenstatus in den Vordergrund zu rücken.
- source_word: שֵׂיבַת
  choice: das graue Haar
  rationale: Die konkrete hebräische Metapher für das hohe Alter bleibt erhalten.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: deines Dieners, unseres Vaters
  rationale: Die Apposition wahrt beide Bezeichnungen Jakobs und verdeutlicht durch Kommas ihre Beziehung.
- source_word: בְּיָגוֹן
  choice: voll Kummer
  rationale: יָגוֹן bezeichnet tiefen Kummer oder Gram; „voll Kummer“ ist idiomatisches Deutsch und beschreibt den Zustand, in dem der Vater stirbt.
- source_word: שְׁאֹלָה
  choice: ins Totenreich
  rationale: „Totenreich“ bewahrt den Bezug auf Scheol als Bereich der Toten besser als das engere „Grab“ und ist für heutige deutsche Leser unmittelbar verständlich.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: „Totenreich“ erhält die größere Bedeutungsbreite des hebräischen Begriffs, ohne ihn auf eine Grabstätte zu verengen oder eine bestimmte spätere Jenseitslehre einzutragen. Die Fußnote nennt sowohl die Transliteration als auch die engere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „das graue Haar ... hinabbringen“ bewahrt bewusst die hebräische Bildsprache; „voll Kummer“ sorgt innerhalb dieses Bildes für natürliche deutsche Lesbarkeit.
