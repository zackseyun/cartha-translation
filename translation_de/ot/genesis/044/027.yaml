source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר עַבְדְּ/ךָ֥ אָבִ֖/י אֵלֵ֑י/נוּ אַתֶּ֣ם יְדַעְתֶּ֔ם כִּ֥י שְׁנַ֖יִם יָֽלְדָה לִּ֥/י אִשְׁתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: de
  text: 'Da sagte dein Diener, mein Vater, zu uns: »Ihr wisst, dass meine Frau mir zwei Söhne[a] geboren hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwei«. Dass Söhne gemeint sind, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: עַבְדְּךָ אָבִי
  choice: dein Diener, mein Vater
  rationale: Die appositionale Formulierung bewahrt sowohl Judas ehrerbietige Selbstunterordnung gegenüber Josef als auch die Identifizierung des Gemeinten als sein Vater.
- source_word: אֵלֵינוּ
  choice: zu uns
  rationale: Dies entspricht der üblichen Bedeutung der Präposition mit dem Suffix der ersten Person Plural.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Ihr wisst
  rationale: Das ausdrücklich gesetzte Personalpronomen verleiht der Aussage Nachdruck. Das Präsens passt, weil es um ein im zitierten Gespräch weiterhin bestehendes Wissen geht.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Angeredeten wissen.
- source_word: שְׁנַיִם
  choice: zwei Söhne
  rationale: Im Hebräischen steht nur »zwei«; aus dem Zusammenhang sind jedoch die beiden Söhne Josef und Benjamin gemeint. Das Substantiv wird für klares, natürliches Deutsch ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: יָלְדָה לִּי
  choice: mir … geboren hat
  rationale: Die Formulierung gibt das Verb ילד mit dem indirekten Objekt idiomatisch und präzise wieder.
- source_word: אִשְׁתִּי
  choice: meine Frau
  rationale: אִשָּׁה mit dem Suffix der ersten Person Singular bezeichnet in diesem Zusammenhang eindeutig die Ehefrau.
