  terminology: „Dein Diener“ bewahrt die demütige Selbstbezeichnung ohne unangemessene Modernisierung. „Meine Frau“ ist im Kontext die zutreffende Wiedergabe. Es gibt keine strittigen theologischen oder namensbezogenen Begriffe.
