  source_fidelity: 'Der Text gibt die Satzfolge und die wesentlichen Beziehungen des Hebräischen zuverlässig wieder: Judas bezeichnet seinen Vater gegenüber Josef als „dein Diener“ und berichtet dessen Rede an die Brüder. „Ihr wisst, dass“ entspricht der Inhaltseinleitung mit כִּי; „meine Frau“ und „mir ... geboren hat“ geben אִשְׁתִּי und יָלְדָה לִּי angemessen wieder. Die Ergänzung „Söhne“ ist kontextuell zutreffend und wird transparent als Ergänzung markiert.'
