  - severity: medium
    issue: Die Fußnote b enthält eine grammatisch fehlerhafte und sachlich unklare wörtliche Wiedergabe.
    rationale: »gegen meinem Vater gegenüber« ist nicht korrektes Deutsch; zudem sollte die Fußnote die offene Beziehung von לְאָבִי als „meinem Vater gegenüber/gegen meinen Vater“ erklären, statt widersprüchliche Präpositionen zu verbinden.
