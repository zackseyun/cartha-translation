revisions:
- from: 'Denn dein Diener hat sich meinem Vater gegenüber für den Jungen verbürgt[a] und gesagt: »Wenn ich ihn nicht zu dir zurückbringe, werde ich mein Leben lang vor meinem Vater schuldig sein.«[b]'
  to: 'Denn dein Diener hat sich meinem Vater gegenüber für den Jungen verbürgt[a] und gesagt: »Wenn ich ihn nicht zu dir bringe, werde ich mein Leben lang meinem Vater gegenüber schuldig sein.«[b]'
