base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: de
  text: 'Denn dein Diener hat sich meinem Vater gegenüber für den Jungen verbürgt[a] und gesagt: »Wenn ich ihn nicht zu dir bringe, werde ich mein Leben lang meinem Vater gegenüber schuldig sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat meinem Vater für den Jungen garantiert« oder »hat sich für den Jungen verpflichtet«. Das hebräische Verb bezeichnet die Übernahme der Verantwortung als Bürge.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »werde ich alle Tage meinem Vater gegenüber gesündigt haben«; die hebräische Formulierung bezeichnet hier andauernde Schuld oder Verantwortlichkeit gegenüber dem Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Judas Begründung gegenüber Josef ein und verbindet den Vers natürlich mit seiner vorausgehenden Bitte.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Bewahrt die ehrerbietige Selbstbezeichnung in der höfischen Rede, ohne hier unnötig den Status eines rechtlosen Sklaven hervorzuheben.
- source_word: עָרַב אֶת הַנַּעַר מֵעִם אָבִי
  choice: hat sich meinem Vater gegenüber für den Jungen verbürgt
  rationale: Das Verb bezeichnet die Übernahme persönlicher Verantwortung als Bürge; die Formulierung gibt zugleich den Jungen als Gegenstand und den Vater als Empfänger der Zusage klar wieder.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: Entspricht der familiären Perspektive auf Benjamin und bewahrt die Wortwahl des Hebräischen, obwohl Benjamin kein kleines Kind ist.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Wenn ich ihn nicht zu dir zurückbringe
  rationale: Das im Kontext naheliegende Zurückbringen wird im Deutschen idiomatisch ausgedrückt; das Konditionalgefüge bleibt erhalten.
- source_word: וְחָטָאתִי לְאָבִי כָּל הַיָּמִים
  choice: werde ich mein Leben lang vor meinem Vater schuldig sein
  rationale: Bewahrt deutlicher als eine reine Schuldzuweisung den hebräischen Begriff des Sündigens beziehungsweise Schuldigwerdens und gibt die lebenslange Dauer natürlich wieder.
theological_decisions:
- issue: Bedeutung von וְחָטָאתִי im Verhältnis zum Vater
  choice: vor meinem Vater schuldig sein
  alternative: gegen meinen Vater gesündigt haben / die Schuld vor meinem Vater tragen
  rationale: Die Formulierung erhält die moralische und relationale Schuldspannung des hebräischen Verbs, ohne sie ausschließlich als subjektiven Vorwurf oder als technisch-theologische Sünde festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung »dein Diener« und die rechtlich gefärbte Wendung »sich verbürgen« bewahren den Ton von Judas eindringlicher Rede. Die zweite Fußnote erläutert die ungewöhnliche hebräische Schuldformulierung.
