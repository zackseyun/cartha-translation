source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: de
  text: Als wir dann zu deinem Diener, meinem Vater,[a] hinaufkamen, erzählten wir ihm die Worte meines Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinem Vater, deinem Diener“. Die hebräische Wortfolge lautet: „zu deinem Diener, meinem Vater“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als … dann
  rationale: Die Wendung leitet das nächste Ereignis in der Erzählfolge ein. „Als … dann“ gibt den zeitlichen und fortlaufenden Zusammenhang in natürlichem Deutsch wieder, ohne das schwerfällige „Und es geschah, als“.
- source_word: עָלִינוּ
  choice: wir … hinaufkamen
  rationale: עלה bezeichnet das Hinaufziehen von Ägypten nach Kanaan. „Hinaufkamen“ bewahrt die geografische Perspektive und passt idiomatisch zum Ziel bei Jakobs Aufenthaltsort.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier das Ziel der Bewegung; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: עַבְדְּךָ אָבִי
  choice: deinem Diener, meinem Vater
  rationale: Die Wiedergabe folgt der hebräischen Reihenfolge und bewahrt Judas ehrerbietige Bezeichnung Jakobs als Diener Josephs. Das Komma macht die Apposition im Deutschen verständlich.
- source_word: וַנַּגֶּד
  choice: erzählten wir
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten, erzählen“. „Erzählten“ ist hier natürlich und gibt die Weitergabe von Josephs Worten wieder.
- source_word: לוֹ
  choice: ihm
  rationale: Der pronominale indirekte Gegenstand wird im Deutschen idiomatisch mit dem Dativ „ihm“ ausgedrückt.
- source_word: אֵת דִּבְרֵי
  choice: die Worte
  rationale: Die formnahe Wiedergabe erhält den ausdrücklichen Bezug auf die zuvor gesprochenen Worte; „Botschaft“ oder ein Nebensatz wäre stärker interpretierend.
- source_word: אֲדֹנִי
  choice: meines Herrn
  rationale: אֲדֹנִי ist hier eine ehrerbietige menschliche Anrede beziehungsweise Bezeichnung für Joseph, nicht der Gottesname. „Mein Herr“ bewahrt Judas unterwürfig-höflichen Ton.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ehrerbietige Hofsprache Judas wird mit „deinem Diener“ und „meines Herrn“ bewahrt; die Syntax bleibt trotz Nähe zur hebräischen Reihenfolge gut verständlich.
