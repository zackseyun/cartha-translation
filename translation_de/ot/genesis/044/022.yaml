  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: de
  text: 'Da sagten wir zu meinem Herrn: »Der Junge kann seinen Vater nicht verlassen; denn wenn er seinen Vater verließe, würde er sterben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und er verlässt seinen Vater, und er stirbt“. Das Hebräische nennt das Subjekt von „stirbt“ nicht ausdrücklich; dem Zusammenhang nach ist wahrscheinlich der Vater gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Da sagten wir
  rationale: Das Wayyiqtol führt Judas Rückblick in der erzählerischen Abfolge fort; „Da sagten wir“ klingt im modernen Deutschen natürlich.
- source_word: אֶל אֲדֹנִי
  choice: zu meinem Herrn
  rationale: Die ehrerbietige Anrede gegenüber Josef wird mit „mein Herr“ angemessen und ohne unnötig dienerhafte Zuspitzung wiedergegeben.
- source_word: לֹא יוּכַל הַנַּעַר
  choice: Der Junge kann … nicht
  rationale: יכל bezeichnet Fähigkeit oder Möglichkeit. נער wird hier aus der familiären Perspektive als „Junge“ wiedergegeben, obwohl auch „junger Mann“ möglich ist.
- source_word: לַעֲזֹב אֶת אָבִיו
  choice: seinen Vater … verlassen
  rationale: עזב bedeutet hier, sich vom Vater zu trennen beziehungsweise ihn zurückzulassen; „verlassen“ bewahrt die Wiederholung des hebräischen Ausdrucks.
- source_word: וְעָזַב אֶת אָבִיו
  choice: Wenn er seinen Vater verließe
  rationale: Die verbundene Perfektform wird im Zusammenhang als hypothetische Bedingung verstanden und idiomatisch im Konjunktiv wiedergegeben.
- source_word: וָמֵת
  choice: würde dieser sterben
  rationale: Das maskuline Singularsubjekt bleibt im Hebräischen unausgesprochen und ist grammatisch mehrdeutig. Im Kontext ist wahrscheinlich der Vater gemeint; „dieser“ macht diese Zuordnung im Haupttext kenntlich, während die Fußnote die Formnähe und Mehrdeutigkeit dokumentiert.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וָמֵת
  choice: 'Im Haupttext auf den Vater bezogen: „würde dieser sterben“'
  alternative: 'Auf den Jungen bezogen: „würde er sterben“; oder formal: „und er stirbt“'
  rationale: Der weitere Kontext von Jakobs möglichem Tod aus Kummer (Gen 44,29–31) spricht deutlich für den Vater. Da das Hebräische das Subjekt jedoch nicht ausdrücklich nennt und die deutsche Pronomenfolge sonst leicht auf den Jungen bezogen würde, wird die Entscheidung transparent in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Wiederholung von „seinen Vater“ entspricht dem Hebräischen. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
