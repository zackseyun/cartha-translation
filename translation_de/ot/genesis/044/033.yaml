id: GEN.44.33
reference: Genesis 44:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: de
  text: Und nun lass bitte deinen Diener anstelle des jungen Mannes als Sklaven meines Herrn hierbleiben; der junge Mann aber soll mit seinen Brüdern hinaufziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hinaufziehen“ ist eine im Hebräischen übliche Bezeichnung für die Reise von Ägypten nach Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende als auch die zeitlich-diskursive Funktion und leitet Judas abschließende Bitte natürlich ein.
- source_word: יֵשֶׁב נָא
  choice: lass bitte … hierbleiben
  rationale: Der Jussiv mit נָא formuliert eine höfliche, dringliche Bitte. „Hierbleiben“ gibt im Kontext das Zurückbleiben bei Josef klar wieder.
- source_word: עַבְדְּךָ
  choice: deinen Diener
  rationale: Hier gebraucht Juda עבד als demütige Selbstbezeichnung gegenüber Josef; „Diener“ entspricht diesem höfischen Sprachgebrauch besser als „Sklave“.
- source_word: תַּחַת הַנַּעַר
  choice: anstelle des jungen Mannes
  rationale: תחת bezeichnet hier eindeutig die angebotene Stellvertretung, nicht eine räumliche Lage.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: Benjamin ist kein kleines Kind. „Junger Mann“ vermeidet die im heutigen Deutschen naheliegende Fehlvorstellung eines Kindes und bewahrt dennoch Judas fürsorgliche Bezeichnung.
- source_word: עֶבֶד לַאדֹנִי
  choice: als Sklaven meines Herrn
  rationale: Anders als bei Judas höflicher Selbstbezeichnung meint עבד hier den tatsächlich angedrohten unfreien Status in Josefs Haus; daher steht bewusst „Sklave“.
- source_word: וְהַנַּעַר יַעַל
  choice: der junge Mann aber soll … hinaufziehen
  rationale: „Soll“ führt den bittenden Jussiv fort. „Hinaufziehen“ bewahrt עלה und die übliche geographische Perspektive einer Reise von Ägypten nach Kanaan.
- source_word: עִם אֶחָיו
  choice: mit seinen Brüdern
  rationale: Wörtliche und im Zusammenhang eindeutige Wiedergabe der familiären Beziehung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unterschiedliche Wiedergabe von עבד als „Diener“ in Judas höflicher Selbstbezeichnung und als „Sklave“ für den angebotenen unfreien Status bildet den jeweiligen Kontext ab. Der Kontrast der beiden Satzhälften wird durch „aber“ natürlich hervorgehoben.
