  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: de
  text: 'Da sagten wir zu meinem Herrn: »Wir haben einen alten Vater und einen jungen Sohn, der ihm im hohen Alter geboren wurde.[a] Sein Bruder ist tot, und er ist seiner Mutter als Einziger geblieben,[b] und sein Vater liebt ihn.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Kind seines Alters, klein/jung«. Die hebräische Wendung bezeichnet ein Kind, das dem Vater in dessen hohem Alter geboren wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Er ist der einzige noch lebende Sohn seiner Mutter.'
    reason: clarification
lexical_decisions:
- source_word: אֲדֹנִי
  choice: meinem Herrn
  rationale: Die respektvolle Anrede wahrt das soziale Gefälle gegenüber Josef und entspricht der wiederkehrenden Erzählweise.
- source_word: זָקֵן
  choice: alt
  rationale: Das schlichte deutsche Wort bezeichnet Jakobs fortgeschrittenes Alter natürlich und würdevoll.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: einen jungen Sohn, der ihm im hohen Alter geboren wurde
  rationale: Die Wiedergabe bringt sowohl die Jugend Benjamins als auch die hebräische Wendung für ein im hohen Alter des Vaters geborenes Kind zum Ausdruck.
- source_word: וְאָחִיו מֵת
  choice: Dessen Bruder ist tot
  rationale: Der Zustandsausdruck bezeichnet den gegenwärtig relevanten Tod des Bruders; »dessen« vermeidet im Deutschen einen unklaren Bezug.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: sodass er als Einziger von seiner Mutter übrig geblieben ist
  rationale: Die Formulierung macht verständlich, dass Benjamin der einzige noch lebende Sohn seiner Mutter ist, ohne den relationalen Sinn des לְ in eine Betreuungssituation umzudeuten.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: und sein Vater liebt ihn
  rationale: Die direkte Wiedergabe bewahrt die klare Aussage über die besondere Zuneigung des Vaters.
