  naturalness: Der Text ist insgesamt modernes, verständliches Standarddeutsch. »Sein Bruder« ist in diesem Zusammenhang natürlicher als das etwas distanzierte »Dessen Bruder«. Die revidierte Formulierung zu der Mutter ist klarer als »von seiner Mutter übrig geblieben«.
  terminology: »mein Herr«, »alter Vater« und »sein Vater liebt ihn« sind angemessen. »Junger Sohn« ist im Kontext vertretbar. Die Fußnote sollte nicht »Sohn« als wörtlichen hebräischen Ausdruck ausgeben, da ילד zunächst »Kind/Junge« bedeutet.
