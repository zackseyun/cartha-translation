base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: de
  text: 'Und Josef sagte zu ihnen: »Was ist das für eine Tat, die ihr getan habt? Wusstet ihr nicht, dass ein Mann wie ich ganz gewiss wahrsagt?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass ein Mann wie ich sicherlich wahrsagt«, »dass ein Mann wie ich durch Wahrsagung so etwas gewiss herausfindet« oder »dass ein Mann wie ich ganz gewiss Wahrsagung betreibt«. Im Hebräischen verstärkt eine Wiederholung des Verbs für Wahrsagung die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה אֲשֶׁר עֲשִׂיתֶם
  choice: Was habt ihr da getan?
  rationale: Die natürliche deutsche Frage gibt den vorwurfsvollen Sinn von »Was ist diese Tat, die ihr getan habt?« prägnant wieder; »da« verweist auf die beanstandete Handlung.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Wusstet ihr nicht
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung und bleibt in dieser direkten Wiedergabe erhalten.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: sich sehr wohl auf Wahrsagung versteht
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Begriff der Wahrsagung. Die idiomatische Formulierung bewahrt sowohl die emphatische Aussage als auch eine mögliche Nuance von Fähigkeit, ohne zu entscheiden, ob Josef tatsächlich Wahrsagung betrieb.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: ein Mann wie ich
  rationale: Direkte, natürliche Wiedergabe der generischen maskulinen Singularform.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Übliche deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Ob Josefs Aussage über Wahrsagung als tatsächliches Bekenntnis, Fähigkeit oder bloße Rolle zu verstehen ist
  choice: Die Rede ausdrücklich mit »Wahrsagung« wiedergeben und durch »sich sehr wohl darauf verstehen« die Aussage nicht auf tatsächliche Ausübung verengen.
  alternative: »ein Mann wie ich wahrsagt ganz gewiss« oder »ein Mann wie ich würde es durch Wahrsagung gewiss herausfinden«
  rationale: Der hebräische Text verwendet die Wurzel נחש emphatisch, erklärt aber nicht, ob Josef wirklich wahrsagte oder im Rahmen seiner ägyptischen Rolle sprach. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt natürlich und behält den scharfen Vorwurf bei; der Schlüsselbegriff »Wahrsagung« wird nicht abgeschwächt.
