lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: als es am Morgen hell wurde
  rationale: Die Wendung gibt den zeitlichen Nebensatz und die verbale Bedeutung von אור als Einsetzen des Tageslichts natürlich und zugleich quellennah wieder.
- source_word: וְהָאֲנָשִׁים
  choice: die Männer
  rationale: Die bestimmte Pluralform wird direkt wiedergegeben; die hebräische Konjunktion geht im deutschen Satzanschluss natürlich auf.
- source_word: שֻׁלְּחוּ
  choice: wurden fortgeschickt
  rationale: Das Passiv der Pual-Form und das Wegschicken zur Abreise bleiben erhalten.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: sie und ihre Esel
  rationale: Die appositionale Gruppierung des selbstständigen Pronomens mit den Eseln wird formal bewahrt, ohne eine nicht ausdrücklich vorhandene Präposition einzufügen.
