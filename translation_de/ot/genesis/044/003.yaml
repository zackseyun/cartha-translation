  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: de
  text: Als es am Morgen hell wurde[a], wurden die Männer fortgeschickt, sie und ihre Esel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als der Morgen anbrach« oder »Als es morgens hell war«.'
