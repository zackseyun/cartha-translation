  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: de
  text: 'Und du hast zu deinen Dienern gesagt: »Wenn euer jüngster Bruder nicht mit euch herabkommt, dürft ihr nicht wieder vor mir erscheinen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mein Angesicht sehen«.'
    reason: Das Hebräische verwendet eine feste Wendung für das Erscheinen vor einer hochgestellten Person; der Haupttext gibt ihre idiomatische Bedeutung wieder.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und du hast ... gesagt
  rationale: Das Wayyiqtol von אמר führt die Erzählung fort. Im deutschen Rückblick Judas auf Josephs frühere Aussage ist das Perfekt natürlich; »Und« bewahrt die Verknüpfung mit dem Kontext.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: עבד kann »Sklave« oder »Diener« bedeuten. Hier dient es als höfliche, unterwürfige Selbstbezeichnung vor einem hochgestellten Amtsträger; »Diener« gibt diese Hofsprache wieder, ohne einen rechtlichen Sklavenstatus hervorzuheben.
- source_word: אִם לֹא
  choice: Wenn ... nicht
  rationale: Die negative Bedingung wird entsprechend der hebräischen Form klar und unmittelbar wiedergegeben.
- source_word: יֵרֵד
  choice: herabkommt
  rationale: ירד bezeichnet eine Bewegung nach unten. »Herabkommt« wahrt sowohl die Richtung nach Ägypten als auch die Perspektive des dort sprechenden Joseph.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: euer jüngster Bruder
  rationale: Der artikulierte Ausdruck bezeichnet im Zusammenhang den jüngsten der Brüder, nicht nur einen jüngeren Bruder.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Die Begleitung wird im Deutschen direkt und idiomatisch ausgedrückt.
- source_word: לֹא תֹסִפוּן
  choice: nicht wieder
  rationale: יסף mit Infinitiv bezeichnet hier eine weitere beziehungsweise erneute Handlung. »Nicht wieder« gibt das Verbot einer erneuten Audienz natürlich wieder.
- source_word: לִרְאוֹת פָּנָי
  choice: mir ... unter die Augen treten
  rationale: Wörtlich heißt die Wendung »mein Angesicht sehen«, idiomatisch jedoch »vor mir erscheinen«. Die deutsche Wendung bewahrt das Bild des Angesichts und vermittelt zugleich den gemeinten Zutritt zu Joseph.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die höfisch-unterwürfige Selbstbezeichnung bleibt erhalten. Die Schlusswendung wird als geläufiges deutsches Idiom wiedergegeben, das das hebräische Gesichtsbild noch erkennen lässt; daher ist keine Fußnote nötig.
