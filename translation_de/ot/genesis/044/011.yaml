  source_fidelity: Der Entwurf gibt die Abfolge und die distributive Struktur im Wesentlichen richtig wieder. Allerdings ist „ließ seinen Sack auf die Erde hinunter“ im heutigen Standarddeutsch unidiomatisch. „senkte seinen Sack zu Boden“ gibt den kausativen Sinn von וַיּוֹרִדוּ im Kontext präzise und natürlich wieder. Die Wiederholung von „seinen Sack“ bildet die Wiederholung von אִישׁ אַמְתַּחְתּוֹ angemessen ab.
  naturalness: „Da beeilten sie sich, und jeder senkte seinen Sack zu Boden und öffnete seinen Sack“ ist modernes, flüssiges Standarddeutsch. Die Wiederholung des Nomens ist hier als quellensprachlich begründete Betonung vertretbar und nicht störend.
