base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: de
  text: Da beeilten sie sich, und jeder senkte seinen Sack zu Boden und öffnete seinen Sack.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: sie beeilten sich
  rationale: Die Pluralform bezeichnet ihr unverzügliches Handeln. „Sie beeilten sich“ ist natürliches modernes Deutsch und wahrt den Wechsel vom kollektiven zum distributiven Subjekt.
- source_word: וַיּוֹרִדוּ
  choice: ließ ... hinunter
  rationale: Der Hifil von ירד bedeutet hier „hinunterbringen/absenken“. Zusammen mit „auf die Erde“ gibt „ließ ... hinunter“ die Bewegung des Sacks idiomatisch wieder.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: jeder ... seinen Sack
  rationale: אִישׁ wird distributiv gebraucht. „Jeder ... seinen Sack“ bewahrt die Betonung der individuellen Handlung, ohne das im Deutschen schwerfällige „jeder Mann“.
- source_word: אַמְתַּחַת
  choice: Sack
  rationale: Das Wort bezeichnet hier den Behälter für Getreide oder Reisevorräte; „Sack“ passt zum erzählerischen und historischen Kontext.
- source_word: אָרְצָה
  choice: auf die Erde
  rationale: Die Richtungsform bezeichnet eine Bewegung zur Erde bzw. zum Boden hin. „Auf die Erde“ ist in Verbindung mit dem Hinunterlassen natürlich und konkret.
- source_word: וַיִּפְתְּחוּ
  choice: öffnete
  rationale: פתח bedeutet schlicht „öffnen“. Der deutsche Singular richtet sich nach dem distributiven „jeder“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satzteil bewahrt mit „sie“ die hebräische Pluralform; anschließend gibt „jeder“ die zweimalige distributive Wendung אִישׁ ... אַמְתַּחְתּוֹ wieder. Im Haupttext wird die zweite Wiederholung aus natürlichem deutschem Stil durch das Pronomen „ihn“ aufgenommen und in der Fußnote offengelegt.
