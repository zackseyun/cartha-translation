    rationale: Der revidierte Haupttext zeigt die relevante Wiederholung bereits. Zudem steht אִישׁ im Hebräischen nicht „vor beiden Handlungen“, sondern jeweils in den distributiven Ausdrücken nach den betreffenden Verben; „seinen eigenen“ verstärkt den bloßen Possessivbezug unnötig.
