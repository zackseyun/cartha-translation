base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: de
  text: Er durchsuchte das Gepäck, angefangen beim Ältesten bis zum Jüngsten, und der Becher[a] wurde in Benjamins Sack gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kelch“. Das hebräische Wort kann einen Becher oder einen Kelch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: Er durchsuchte alles
  rationale: Das Verb חפשׂ bezeichnet hier das gründliche Durchsuchen des Gepäcks. Das ergänzte „alles“ macht im Deutschen den nicht eigens genannten Gegenstand der Suche natürlich verständlich, ohne den Sinn einzuengen.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: angefangen beim Ältesten
  rationale: גדול und החל markieren im Zusammenhang den Beginn der Suche beim altersmäßig ältesten Bruder.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: bis hin zum Jüngsten
  rationale: קטן steht im familiären Kontext im Gegensatz zum Ältesten und bezeichnet den jüngsten Bruder; כלה kennzeichnet den Endpunkt der geordneten Suche.
- source_word: וַיִּמָּצֵא
  choice: wurde ... gefunden
  rationale: Die passive Wiedergabe bewahrt die Nifal-Form und vermeidet, den Suchenden ausdrücklich als grammatisches Subjekt des Findens einzusetzen.
- source_word: הַגָּבִיעַ
  choice: der Becher
  rationale: גביע bezeichnet ein Trinkgefäß und kann je nach Form als Becher oder Kelch wiedergegeben werden. „Becher“ ist hier natürlich und knüpft an den Erzählzusammenhang an.
- source_word: בְּאַמְתַּחַת
  choice: in ... Getreidesack
  rationale: אַמְתַּחַת bezeichnet den Reisesack beziehungsweise Vorratssack. „Getreidesack“ verdeutlicht im unmittelbaren Kontext die Art des Gepäckstücks.
- source_word: בִּנְיָמִן
  choice: Benjamins
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
