base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Warum redet mein Herr solche Worte? Es liegt deinen Dienern fern, so etwas zu tun.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Da sagten sie zu ihm
  rationale: Der Wayyiqtol führt die unmittelbare Antwort der Brüder in der Erzählfolge ein; „Da sagten sie“ klingt im modernen Deutschen natürlich und bleibt nah am schlichten hebräischen Erzählausdruck.
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: Warum redet mein Herr so?
  rationale: Die Frage und die ehrerbietige menschliche Anrede werden bewahrt. „Mein Herr“ gibt den singularischen Suffixbezug wieder und bezeichnet hier keine göttliche Anrede.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: so
  rationale: Im Deutschen fasst „so reden“ die Wendung „Worte wie diese reden“ idiomatisch zusammen, ohne den Inhalt der empörten Rückfrage zu verändern.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: Es liegt deinen Dienern fern
  rationale: Die feste deutsche Wendung vermittelt die starke Zurückweisung des hebräischen Ausrufs und erhält zugleich die höfische Selbstbezeichnung „deine Diener“.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: so etwas zu tun
  rationale: Die natürliche deutsche Formulierung gibt den Rückbezug auf die unterstellte Tat präzise wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die höfische Distanz zwischen den Brüdern und dem Verwalter bleibt durch „mein Herr“ und „deine Diener“ erhalten; der zweite Satz bewahrt die nachdrückliche Entrüstung ohne altertümliches Pathos.
