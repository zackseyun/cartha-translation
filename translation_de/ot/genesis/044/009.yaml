source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: de
  text: Bei wem von deinen Dienern der Becher gefunden wird, der soll sterben; und auch wir werden meinem Herrn zu Sklaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht für „Diener“ und „Sklaven“ dasselbe Wort. Zuerst ist es eine ehrerbietige Selbstbezeichnung, am Ende bezeichnet es tatsächliche Unfreiheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Bei wem von deinen Dienern der Becher gefunden wird
  rationale: Die unbestimmte Relativkonstruktion und das partitive מִן werden in natürlichem Deutsch als Auswahl aus der angesprochenen Gruppe wiedergegeben. „Der Becher“ nimmt den im Zusammenhang eindeutigen, im Hebräischen aber nur mitgedachten Gegenstand auf.
- source_word: וָמֵת
  choice: der soll sterben
  rationale: Die Verbform bezeichnet hier die als Folge vorgeschlagene Todesstrafe. „Soll sterben“ bewahrt diesen verpflichtenden beziehungsweise volitiven Sinn, ohne ihn unnötig zu verschärfen.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: und auch wir werden
  rationale: „Auch“ erhält die steigernde Hinzufügung einer weiteren Folge; „werden“ gibt den Eintritt in den vorgesehenen Zustand natürlich wieder.
- source_word: לַאדֹנִי
  choice: meinem Herrn
  rationale: Der Ausdruck ist eine ehrerbietige Anrede für einen menschlichen Ranghöheren; das Suffix der ersten Person Singular wird mit „meinem“ bewahrt.
- source_word: לַעֲבָדִים
  choice: zu Sklaven
  rationale: Hier ist tatsächliche, als Strafe angebotene Unfreiheit gemeint. „Zu Sklaven werden“ bringt diesen Status deutlicher zum Ausdruck als „Diener werden“.
theological_decisions:
- issue: Wiedergabe von עבד in den beiden Vorkommen
  choice: zuerst „Diener“, danach „Sklaven“
  alternative: beide Male „Diener“ oder beide Male „Sklaven“
  rationale: Dasselbe hebräische Wort dient zunächst der ehrerbietigen Selbstbezeichnung gegenüber einem Amtsträger, bezeichnet am Versende jedoch ausdrücklich die angebotene Versklavung. Die unterschiedliche Wiedergabe bildet die jeweilige Funktion im Kontext ab, ohne einen rechtlichen Status in das erste Vorkommen hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt der feierlichen Strafzusage angemessen, ist aber unmittelbar verständlich. Das Semikolon verdeutlicht die zwei vorgeschlagenen Folgen.
