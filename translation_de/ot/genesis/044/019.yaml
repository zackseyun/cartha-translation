  text: אֲדֹנִ֣/י שָׁאַ֔ל אֶת עֲבָדָ֖י/ו לֵ/אמֹ֑ר הֲ/יֵשׁ לָ/כֶ֥ם אָ֖ב אוֹ אָֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: de
  text: 'Mein Herr fragte seine Diener: »Habt ihr einen Vater oder einen Bruder?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mein Herr
  rationale: Die ehrerbietige Anrede an den ägyptischen Machthaber wird gewahrt; »Mein Herr« entspricht dem höfischen Ton besser als das modernere »mein Gebieter«.
- source_word: שָׁאַל
  choice: fragte
  rationale: Das Verb bezeichnet hier das Stellen einer Frage; »fragte« ist im Deutschen natürlich und präzise.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Die Brüder bezeichnen sich in höfischer Selbsterniedrigung als Diener des Angeredeten. »Diener« bewahrt diese Redeweise, ohne hier unnötig einen rechtlichen Sklavenstatus festzulegen.
- source_word: לֵאמֹר
  choice: durch direkte Rede wiedergegeben
  rationale: Der Infinitiv leitet den Inhalt der Frage ein. Im natürlichen modernen Deutsch genügt nach »fragte« der Doppelpunkt; ein zusätzliches »und sagte« wäre schwerfällig.
- source_word: הֲיֵשׁ לָכֶם
  choice: Habt ihr noch
  rationale: Die Konstruktion drückt das Vorhandensein beziehungsweise den Besitz aus. Das kontextuell naheliegende »noch« macht deutlich, dass nach lebenden beziehungsweise vorhandenen Familienangehörigen gefragt wird, ohne die Satzbedeutung zu verändern.
- source_word: אָב
  choice: einen Vater
  rationale: Der Akkusativ mit unbestimmtem Artikel ist die natürliche deutsche Form der Existenzfrage.
- source_word: אָח
  choice: einen Bruder
  rationale: Der Singular und die Parallelität zu »einen Vater« werden bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die höfische Hofrede bleibt durch »Mein Herr« und »seine Diener« erkennbar; die formelhafte hebräische Redeeinleitung wird zugunsten natürlichen deutschen Satzbaus nicht mechanisch nachgebildet.
