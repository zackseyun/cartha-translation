lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagtest du
  rationale: Das Wayyiqtol führt Judas Rückblick erzählerisch weiter. »Da« gibt die zeitliche Abfolge in natürlichem, würdigem Deutsch wieder.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: Im höfischen Zusammenhang bezeichnet עבד die Joseph untergeordneten Männer in ihrer Rolle als Diener; »Sklaven« würde hier den rechtlichen Status unnötig in den Vordergrund rücken.
- source_word: הוֹרִדֻהוּ אֵלַי
  choice: Bringt ihn zu mir herab
  rationale: Der Hifil-Imperativ mit Objektsuffix bedeutet, ihn herunterzubringen. »Herab« bewahrt die in Genesis übliche Richtungsangabe für die Reise nach Ägypten.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: damit ich mein Auge auf ihn richte
  rationale: Die Wiedergabe bewahrt das hebräische Bild und lässt dessen Bedeutungsbreite zwischen Ansehen, Prüfen und besonderer Zuwendung offen.
