  text: He caught up with them and spoke these words to them:[a]
translation:
  language: de
  text: Er holte sie ein und sagte diese Worte zu ihnen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er erreichte sie und sagte zu ihnen diese Worte.“'
    reason: Lexikalische Alternative für וַיַּשִּׂגֵם und alternative, idiomatische Wortstellung für die Redeeinleitung.
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Er holte sie ein
  rationale: Die Hifil-Form von נשׂג mit dem Suffix der 3. Person Plural bezeichnet hier, dass der Verwalter die Brüder auf ihrem Weg einholt. „holte sie ein“ ist im modernen Deutschen natürlich und entspricht dem Verfolgungskontext.
- source_word: וַיְדַבֵּר
  choice: und sagte
  rationale: דבר bedeutet grundsätzlich „reden/sprechen“. In Verbindung mit dem direkten Objekt „diese Worte“ ist „sagte diese Worte“ im Deutschen natürlicher als „sprach diese Worte“, während die hebräische Konstruktion erkennbar bleibt.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Die Präposition אֶל bezeichnet die Richtung der Rede auf die Brüder hin; „zu ihnen“ gibt dies unmittelbar wieder.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Die Wendung bedeutet wörtlich „diese Worte“ und leitet die unmittelbar folgende Rede ein. Diese Wiedergabe ist präzise, würdig und im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die leicht formelle Wendung „diese Worte“ bewahrt die Nähe zum hebräischen Ausdruck.
