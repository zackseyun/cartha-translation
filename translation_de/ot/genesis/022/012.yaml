source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: de
  text: 'Und er sagte: »Strecke deine Hand nicht gegen den Jungen aus und tu ihm nichts an! Denn jetzt weiß ich, dass du Gott fürchtest, weil du mir deinen Sohn, deinen einzigen[a], nicht vorenthalten[b] hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »deinen Sohn, deinen einzigen«. Die Bezeichnung bezieht sich im Erzählzusammenhang auf Isaak.'
    reason: Die Anmerkung erläutert den Bezug angesichts Ismaels, ohne den Ausdruck durch eine über den Wortlaut hinausgehende theologische Kategorie festzulegen.
  - marker: b
    text: 'Oder: »nicht verschont« beziehungsweise »nicht zurückgehalten«.'
    reason: חשׂך umfasst die Bedeutungen vorenthalten, zurückhalten und verschonen.
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: strecke deine Hand nicht gegen … aus
  rationale: Die deutsche Wendung bildet das hebräische Bild eng nach und bezeichnet im Kontext einen gewaltsamen Zugriff, ohne die Aussage auf eine bestimmte Art der Verletzung einzuengen.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann Junge, Jugendlicher oder junger Mann bedeuten; »Junge« ist hier im Erzählzusammenhang natürlich und vermeidet das altertümliche »Knabe«.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: tu ihm nichts an
  rationale: Diese idiomatische deutsche Formulierung gibt das umfassende Verbot natürlich wieder und lässt im Kontext klar erkennen, dass Abraham dem Jungen keinerlei Schaden zufügen soll.
- source_word: עַתָּה יָדַעְתִּי
  choice: jetzt weiß ich
  rationale: Die direkte Formulierung bewahrt die Aussage des hebräischen Textes und glättet ihre theologische Spannung nicht.
- source_word: יְרֵא אֱלֹהִים
  choice: du Gott fürchtest
  rationale: Die traditionelle und weiterhin verständliche Wendung bleibt eng am Hebräischen; »fürchten« kann hier ehrfürchtige Gottesfurcht einschließen.
- source_word: חָשַׂכְתָּ
  choice: nicht vorenthalten
  rationale: חשׂך bedeutet zurückhalten, vorenthalten oder verschonen. »Vorenthalten« passt zur Konstruktion mit »mir« und wahrt den Opfer- und Prüfungskontext.
- source_word: יְחִידְךָ
  choice: deinen einzigen
  rationale: Das substantivierte Adjektiv bewahrt die emphatische Apposition »deinen Sohn, deinen einzigen« und vermeidet eine im Hebräischen nicht ausdrücklich enthaltene Wiedergabe als »geliebten«.
- source_word: מִמֶּנִּי
  choice: mir
  rationale: Beim deutschen Verb »vorenthalten« steht die Person im Dativ; »mir … nicht vorenthalten« entspricht funktional dem hebräischen »nicht von mir zurückgehalten«.
theological_decisions:
- issue: Anthropomorphe beziehungsweise relationale Aussage göttlichen Wissens in עַתָּה יָדַעְתִּי
  choice: »jetzt weiß ich« unverändert beibehalten
  alternative: »jetzt sehe ich« oder »jetzt ist erwiesen«
  rationale: Der hebräische Text sagt ausdrücklich »jetzt weiß ich«. Die Übersetzung erklärt die daraus entstehende Spannung zur Lehre von Gottes Wissen nicht weg.
- issue: Bedeutung von יְחִידְךָ angesichts Ismaels Existenz
  choice: »deinen einzigen« mit erläuternder Fußnote
  alternative: »deinen einzigen Sohn« oder »deinen einzigartigen Sohn«
  rationale: Die Formulierung wahrt die emphatische Bezeichnung Isaaks im vorliegenden Verheißungs- und Erzählzusammenhang, ohne zu behaupten, Abraham habe biologisch nur einen Sohn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und eindringlich. »Strecke deine Hand … aus« bewahrt das hebräische Bild; »tu ihm nichts an« ist natürliches Gegenwartsdeutsch. Die Satzverknüpfung mit Doppelpunkt macht den begründenden Zusammenhang von Gottesfurcht und Abrahams Handeln deutlich.
