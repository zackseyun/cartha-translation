base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: de
  text: 'Da erhob Abraham den Blick und sah: Hinter ihm[a] war ein Widder, der sich mit seinen Hörnern im Dickicht verfangen hatte. Abraham ging hin, nahm den Widder und brachte ihn anstelle seines Sohnes[b] als Brandopfer dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinter“. Im Hebräischen wird nicht ausdrücklich gesagt, worauf sich „hinter“ bezieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „statt seines Sohnes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: erhob den Blick
  rationale: Die hebräische Wendung bezeichnet das Anheben der Augen beziehungsweise des Blicks. „Erhob den Blick“ bewahrt das Bild in natürlichem modernem Deutsch.
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Verb bezeichnet hier die anschließende Wahrnehmung und wird zusammen mit der vorausgehenden Blickbewegung wiedergegeben.
- source_word: וְהִנֵּה
  choice: Da … war
  rationale: Die Konstruktion lenkt die Aufmerksamkeit auf die überraschende Wahrnehmung. „Da … war“ gibt diese präsentierende Funktion in aktuellem, würdigem Deutsch wieder.
- source_word: אַיִל
  choice: Widder
  rationale: „Widder“ ist die präzise und im Opferzusammenhang übliche deutsche Bezeichnung für ein männliches Schaf.
- source_word: אַחַר
  choice: hinter ihm
  rationale: Das Wort wird hier am wahrscheinlichsten räumlich verstanden. Das ergänzte Pronomen macht den Bezug im Deutschen deutlich, obwohl es im hebräischen Konsonantentext nicht ausdrücklich steht.
- source_word: נֶאֱחַז
  choice: hatte sich … verfangen
  rationale: Die resultative Passivform beschreibt den Widder als festgehalten beziehungsweise gefangen; die deutsche Formulierung bezeichnet natürlich den eingetretenen Zustand.
- source_word: בַּסְּבַךְ
  choice: im Dickicht
  rationale: Das Wort bezeichnet dichtes, ineinander verwachsenes Gestrüpp, in dem das Tier festgehalten wurde.
- source_word: בְּקַרְנָיו
  choice: mit seinen Hörnern
  rationale: Die Präposition kennzeichnet die Hörner als den Körperteil, mit dem der Widder im Dickicht festhing.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: brachte ihn … als Brandopfer dar
  rationale: Im Opferkontext bezeichnet die Verbindung das Darbringen des Tieres als vollständig verbranntes Opfer. „Als Brandopfer darbringen“ ist präzise und idiomatisch.
- source_word: תַּחַת בְּנוֹ
  choice: anstelle seines Sohnes
  rationale: תַּחַת drückt in diesem Zusammenhang eindeutig Ersatz beziehungsweise Stellvertretung aus, ohne dass darüber hinausgehende Lehraussagen in den Vers hineingetragen werden.
theological_decisions:
- issue: Substitutionale Bedeutung von תַּחַת בְּנוֹ
  choice: anstelle seines Sohnes
  alternative: statt seines Sohnes
  rationale: Beide Formulierungen drücken den Ersatz aus. „Anstelle seines Sohnes“ bewahrt den deutlichen substitutionalen Sinn des hebräischen Textes, ohne ihn über die Aussage des Verses hinaus theologisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Hebräische Bildsprache wird bewahrt, wo sie im Deutschen natürlich bleibt; das aufmerksamkeitslenkende וְהִנֵּה wird ohne das heute gehoben-archaisch wirkende „siehe“ wiedergegeben.
