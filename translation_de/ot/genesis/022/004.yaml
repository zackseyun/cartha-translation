  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: de
  text: Am dritten Tag erhob Abraham seine Augen und sah den Ort von fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus der Ferne« / »von Weitem«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die temporale Präpositionalphrase mit bestimmtem Artikel und Ordinalzahl wird direkt und idiomatisch wiedergegeben; eine Ergänzung wie »der Reise« wäre interpretierend.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: erhob Abraham seine Augen
  rationale: Die hebräische Wendung wird in ihrer bildhaften Erzählweise bewahrt. »Blickte auf« wäre natürlicher, würde das konkrete Idiom jedoch stärker glätten.
- source_word: וַיַּרְא
  choice: und sah
  rationale: Das narrative Verb bezeichnet die anschließende Wahrnehmung und wird als fortlaufende Handlung wiedergegeben.
- source_word: הַמָּקוֹם
  choice: den Ort
  rationale: Das gewöhnliche bestimmte Substantiv wird transparent wiedergegeben, ohne den von Gott bezeichneten Zielort näher auszudeuten.
- source_word: מֵרָחֹק
  choice: von fern
  rationale: Die adverbiale Wendung bezeichnet räumliche Entfernung. »Von fern« ist knapp, würdevoll und im modernen Standarddeutsch verständlich; »aus der Ferne« ist ebenfalls möglich.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Die im Deutschen etablierte Form des Personennamens.
