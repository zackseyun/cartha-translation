  source_fidelity: 'Die Übersetzung gibt alle Elemente des hebräischen Textes präzise wieder: die Zeitangabe („Am dritten Tag“), Abrahams idiomatisches „Erheben der Augen“, die anschließende Wahrnehmung, den bestimmten „Ort“ und die räumliche Angabe מֵרָחֹק („von fern“). Sie fügt insbesondere nicht interpretierend „der Reise“ hinzu.'
