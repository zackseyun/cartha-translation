base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: de
  text: Dann kamen sie an den Ort, den Gott ihm angegeben hatte.[a] Dort baute Abraham den Altar[b] und ordnete das Holz an. Er band seinen Sohn Isaak und legte ihn auf den Altar, oben auf das Holz.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Ort, von dem Gott zu ihm gesagt hatte“. Gemeint ist der Ort, den Gott ihm zuvor angegeben hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Altar“. Im Hebräischen steht „der Altar“; dies kann den für dieses Opfer errichteten Altar meinen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „oberhalb des Holzes“, das heißt oben auf dem angeordneten Holz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; „Dann“ gibt die zeitliche Abfolge natürlich wieder, und der Plural bleibt erhalten.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: den Gott ihm genannt hatte
  rationale: Im Zusammenhang bezeichnet die Wendung den zuvor von Gott angegebenen Ort. „Genannt hatte“ ist im Deutschen idiomatisch und wahrt den Vorzeitigkeitsbezug.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: Dort baute Abraham den Altar
  rationale: Der bestimmte Artikel des Hebräischen wird bewahrt; gemeint ist der für dieses Opfer vorgesehene Altar.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: und schichtete das Holz darauf
  rationale: ערך bezeichnet das geordnete Anordnen. „Schichtete“ ist bei Brennholz natürlich; „darauf“ erschließt sich aus dem unmittelbar genannten Altar, ohne die Handlung auszudeuten.
- source_word: וַיַּעֲקֹד
  choice: Er band
  rationale: Die direkte Wiedergabe bewahrt die Schwere und die konkrete Art der Handlung.
- source_word: יִצְחָק בְּנוֹ
  choice: seinen Sohn Isaak
  rationale: Diese Wortstellung ist im modernen Deutschen natürlicher und erhält sowohl Namen als auch Verwandtschaftsbezeichnung.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: und legte ihn auf den Altar
  rationale: שים ist ein allgemeines Verb des Platzierens; bei einer Person auf einer Fläche ist „legte“ im Deutschen natürlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: מִמַּעַל לָעֵצִים
  choice: oben auf das Holz
  rationale: Die Formulierung gibt die räumliche Lage über beziehungsweise auf dem angeordneten Holz klar wieder.
theological_decisions:
- issue: Bestimmtheit des Opferaltars
  choice: den Altar
  alternative: einen Altar
  rationale: Der hebräische Text verwendet den bestimmten Artikel. Die Übersetzung bewahrt diese Bestimmtheit, ohne dem Altar eine über den Kontext hinausgehende Symbolik zuzuschreiben.
- issue: Bezeichnung der Bindung Isaaks
  choice: Er band seinen Sohn Isaak
  alternative: Er fesselte seinen Sohn Isaak
  rationale: „Band“ entspricht dem hebräischen Verb unmittelbar und vermeidet eine unnötige Verstärkung oder Abschwächung der Handlung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze bewahren die ernste, schrittweise Folge der hebräischen Erzählung. Alle Fußnotenmarker stehen an der sachlich zugehörigen Stelle.
