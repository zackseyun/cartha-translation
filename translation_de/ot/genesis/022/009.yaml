revisions:
- from: Dann kamen sie an den Ort, den Gott ihm genannt hatte.[a] Dort baute Abraham den Altar[b] und schichtete das Holz darauf. Er band seinen Sohn Isaak und legte ihn auf den Altar, oben auf das Holz.[c]
  to: Dann kamen sie an den Ort, den Gott ihm angegeben hatte.[a] Dort baute Abraham den Altar[b] und ordnete das Holz an. Er band seinen Sohn Isaak und legte ihn auf den Altar, oben auf das Holz.[c]
  rationale: Die Revision entfernt die nicht ausdrücklich ausgedrückte Ergänzung „darauf“, klärt die Bezugnahme auf Gottes vorherige Anweisung und repariert die grammatisch unvollständige Fußnote. Die knappe, ernste Erzählweise sowie die im hebräischen Text vorhandene Bestimmtheit und räumliche Relation bleiben erhalten.
