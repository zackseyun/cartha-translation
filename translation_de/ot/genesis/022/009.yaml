review_pass:
  verdict: revise
  source_fidelity: Die Abfolge, der Plural bei der Ankunft, Gottes Bezeichnung, die Bindung Isaaks und seine Position auf dem Altar über dem Holz sind grundsätzlich zutreffend wiedergegeben. „Schichtete das Holz darauf“ ergänzt jedoch einen im Satz selbst nicht ausdrücklich genannten Ortsbezug („darauf“ = auf den Altar). Das hebräische וַיַּעֲרֹךְ bezeichnet zunächst das Anordnen des Holzes. Außerdem ist „den Gott ihm genannt hatte“ im Deutschen mehrdeutig und kann nahelegen, Gott habe den Ort benannt, statt ihn Abraham bezeichnet bzw. angegeben zu haben.
  naturalness: Die Erzählung ist klar und dem modernen Standarddeutsch angemessen. „Das Holz anordnen“ ist eine natürliche, präzise Wiedergabe ohne die zusätzliche Ortsangabe. „Den Gott ihm angegeben hatte“ ist idiomatisch und trifft den Kontext besser.
  terminology: „Gott“, „Altar“, „Holz“, „band“ und „seinen Sohn Isaak“ sind sachgerecht. Der bestimmte Artikel bei „den Altar“ kann im Deutschen beibehalten werden, ohne eine über den Text hinausgehende theologische Deutung vorzunehmen.
  issues:
  - severity: medium
    issue: Zusätzliche Ortsangabe bei der Anordnung des Holzes
    rationale: „… schichtete das Holz darauf“ macht explizit, dass Abraham das Holz auf den Altar schichtete. Der hebräische Satz sagt hier nur, dass er das Holz anordnete; die räumliche Zuordnung wird erst durch die anschließende Platzierung Isaaks „oberhalb des Holzes“ im Gesamtbild nahegelegt.
  - severity: medium
    issue: Mehrdeutige Wiedergabe von אֲשֶׁר אָמַר לוֹ
    rationale: „Den Gott ihm genannt hatte“ kann im heutigen Deutsch bedeuten, Gott habe dem Ort einen Namen gegeben. „Angegeben hatte“ gibt die Bezugnahme auf den zuvor von Gott bezeichneten Ort klarer wieder.
  - severity: low
    issue: Fußnote a ist grammatisch unvollständig
    rationale: Die Formulierung „von dem Gott zu ihm gesagt hatte“ lässt das Bezugsobjekt der deutschen Konstruktion offen. Die Fußnote sollte die hebräische Formulierung verständlich erläutern.
