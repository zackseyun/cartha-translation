base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: de
  text: 'Nach diesen Ereignissen prüfte Gott Abraham und sagte zu ihm: »Abraham!« Er antwortete: »Hier bin ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die Formel leitet einen neuen Erzählabschnitt ein und verknüpft ihn zeitlich mit dem Vorhergehenden. »Ereignisse« gibt דְּבָרִים im narrativen Zusammenhang natürlich wieder; וַיְהִי muss im modernen Deutschen nicht eigens mit »und es geschah« ausgedrückt werden.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Kontext bezeichnet אֱלֹהִים den einen Gott. Der Artikel verlangt im idiomatischen Deutschen nicht die Wiedergabe »der Gott«.
- source_word: נִסָּה
  choice: prüfte
  rationale: Der Piel-Stamm von נסה bezeichnet hier ein Prüfen oder Auf-die-Probe-Stellen, nicht ein Verleiten zum Bösen. »Prüfte« ist prägnant und wahrt den Ernst der Aussage.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Er sagte zu ihm
  rationale: Natürliche moderne Wiedergabe der Redeeinleitung; das Pronomen bezieht sich eindeutig auf Gott.
- source_word: אַבְרָהָם
  choice: Abraham!
  rationale: Der Name steht als direkte Anrede; das Ausrufezeichen macht den Rufcharakter sichtbar.
- source_word: הִנֵּנִי
  choice: Hier bin ich
  rationale: Die hebräische Antwortsformel drückt aufmerksame Gegenwart und Bereitschaft aus. »Hier bin ich« ist die natürliche und etablierte deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von נסה bei Gott als Subjekt
  choice: Gott prüfte Abraham
  alternative: Gott versuchte Abraham / stellte Abraham auf die Probe
  rationale: »Prüfen« entspricht dem kontextuellen Sinn, ohne die Handlung als Verleitung zum Bösen zu deuten. Zugleich wird die theologische Spannung der erzählten Prüfung nicht durch zusätzliche Erklärungen abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise und der direkte Ruf-Antwort-Wechsel des Hebräischen bleiben erhalten; archaische Formeln wie »Und es geschah« werden vermieden.
