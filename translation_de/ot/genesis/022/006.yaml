  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: de
  text: Da nahm Abraham das Holz für das Brandopfer und legte es seinem Sohn Isaak auf. Er nahm das Feuer und das Messer in die Hand. So gingen die beiden miteinander weiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: das Holz für das Brandopfer
  rationale: Die hebräische Status-constructus-Verbindung lautet wörtlich „das Holz des Brandopfers“. Die Wiedergabe mit „für“ ist im Deutschen idiomatisch und bezeichnet klar den Zweck des Holzes.
- source_word: וַיָּשֶׂם עַל
  choice: legte ... auf
  rationale: שׂים mit עַל bezeichnet hier das Auflegen einer Last; „legte ... auf“ bewahrt das konkrete Bild.
- source_word: יִצְחָק בְּנוֹ
  choice: seinem Sohn Isaak
  rationale: Diese im Deutschen natürliche Wortfolge gibt sowohl die Verwandtschaftsbezeichnung als auch den Namen ausdrücklich wieder.
- source_word: בְּיָדוֹ
  choice: in die Hand
  rationale: Der hebräische Text nennt wörtlich seine einzelne „Hand“. In Verbindung mit „nahm“ ist im Deutschen die Richtung „in die Hand“ idiomatisch.
- source_word: הָאֵשׁ
  choice: das Feuer
  rationale: Der Text nennt lediglich „das Feuer“ und spezifiziert weder Glut noch ein Gefäß; diese Offenheit bleibt erhalten.
- source_word: הַמַּאֲכֶלֶת
  choice: das Messer
  rationale: Das Substantiv bezeichnet ein zum Schlachten verwendetes Messer. „Messer“ ist klar und lässt die konkrete Funktion aus dem Opferkontext hervorgehen.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: die beiden miteinander
  rationale: „Die beiden“ bewahrt den ausdrücklichen Bezug auf das Paar; „miteinander“ gibt יַחְדָּו natürlich wieder und kann sowohl räumliches Zusammensein als auch gemeinsames Handeln ausdrücken.
- source_word: וַיֵּלְכוּ
  choice: gingen ... weiter
  rationale: הלך kann „gehen“ oder „laufen“ bedeuten. Das deutsche „weitergehen“ markiert hier passend die Fortsetzung des bereits begonnenen Weges.
theological_decisions:
- issue: Opferbezeichnung עֹלָה
  choice: Brandopfer
  alternative: Aufstiegsopfer
  rationale: עֹלָה ist hier die etablierte Bezeichnung für ein vollständig verbranntes Opfer. „Brandopfer“ ist die verständliche deutsche Sachbezeichnung, ohne die mögliche Wortassoziation des Aufsteigens als eigenständige Deutung in den Haupttext einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzteilung erhöht die Verständlichkeit, ohne den Ablauf oder die wiederholte Hervorhebung dessen zu verändern, was Abraham trägt. „Er selbst“ verdeutlicht den im hebräischen Subjektwechsel angelegten Kontrast dazu, dass das Holz Isaak auferlegt wird.
