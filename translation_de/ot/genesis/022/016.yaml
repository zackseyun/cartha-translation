  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: de
  text: 'und sagte: „Bei mir selbst habe ich geschworen, spricht Jahwe, weil du dies getan und deinen Sohn, deinen einzigen, nicht zurückgehalten hast,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: und sprach
  rationale: Das Narrativverb führt die vorangehende Redeformel fort; das im Kontext eindeutige Subjekt muss im Deutschen nicht eigens wiederholt werden.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Bei mir selbst habe ich geschworen
  rationale: בִּי bezeichnet in der Schwurformel den Sprecher selbst als Schwurgaranten; das Perfekt wird als vollzogener, weiterhin gültiger Schwur wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche Offenbarungsformel נְאֻם bleibt als substantivische Formel erkennbar; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die gehäufte hebräische Kausalformel wird in natürlichem Deutsch knapp, aber mit klarer Begründungsfunktion ausgedrückt.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: du dies getan hast
  rationale: דָּבָר verweist hier auf die vollzogene Handlung; „dies getan“ ist idiomatischer als „diese Sache getan“ und bewahrt den demonstrativen Bezug.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: und nicht zurückgehalten hast
  rationale: חָשַׂךְ bedeutet hier vorenthalten oder zurückhalten. „Zurückgehalten“ wahrt die konkrete Grundbedeutung, ohne die mögliche Deutung „verschont“ in den Text einzutragen.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: deinen Sohn, deinen einzigen
  rationale: Die appositionale Wiederaufnahme wird bewahrt. „Deinen einzigen“ bezieht sich eindeutig auf „Sohn“ und lässt die lexikalische Spannung von יָחִיד als einzig beziehungsweise einzigartig bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Transkription und ersetzt den Namen nicht durch einen Titel.
- issue: Bedeutungsumfang von יְחִידְךָ
  choice: deinen einzigen
  alternative: deinen einzigen Sohn / deinen einzigartigen Sohn
  rationale: Die Formulierung wahrt die appositionale Struktur und den möglichen Bedeutungsumfang „einzig, einzigartig“, ohne spätere theologische Bezüge stärker auszuformulieren als der hebräische Text.
- issue: Semantik von חָשַׂךְ
  choice: zurückgehalten
  alternative: verschont
  rationale: „Zurückgehalten“ folgt der Grundbedeutung und lässt offen, ob im Kontext zusätzlich der Gedanke des Verschonens mitschwingt.
translation_notes:
  register: Feierliches, aber heutiges Standarddeutsch. Die markierte Schwur- und Offenbarungsformel bleibt erkennbar; die Satzstruktur wahrt, dass der Vers in den folgenden Vers hinein weiterläuft.
