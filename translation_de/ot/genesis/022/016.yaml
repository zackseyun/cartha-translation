  source_fidelity: Der Entwurf gibt die Schwurformel בִּי נִשְׁבַּעְתִּי, die Kausalität und die appositionale Betonung von Sohn und יָחִיד insgesamt zuverlässig wieder. „Deinen einzigen“ bewahrt sinnvoll die im hebräischen Wort liegende Spannung zwischen „einzig“ und „einzigartig“ und sollte nicht zu „einzigen Sohn“ ausgeweitet werden. „Nicht zurückgehalten“ ist als Wiedergabe von וְלֹא חָשַׂכְתָּ vertretbar und vermeidet die stärker kontextualisierende Festlegung „verschont“.
