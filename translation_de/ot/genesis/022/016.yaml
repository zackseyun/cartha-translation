  terminology: „Jahwe“ ist für יְהוָה konsistent und fachsprachlich etabliert. „Spricht Jahwe“ gibt נְאֻם יְהוָה als Offenbarungs-/Deklarationsformel idiomatisch wieder, ohne eine überzogene Deutung einzutragen. Es sind keine Fußnotenanker im deutschen Text vorhanden und keine Fußnoten erforderlich.
