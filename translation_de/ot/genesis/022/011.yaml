  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: de
  text: 'Da rief der Engel Jahwes vom Himmel her zu ihm und sagte: „Abraham, Abraham!“ Er sagte: „Hier bin ich.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: Da rief ... zu ihm
  rationale: קרא mit אֶל bezeichnet hier einen an Abraham gerichteten mündlichen Ruf. „Rief ... zu ihm“ gibt die Richtung und die Dringlichkeit natürlich wieder.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Da der Sprecher vom Himmel her ruft, ist „Engel“ im Deutschen die naheliegende Wiedergabe; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Das morphologisch pluralische שָׁמַיִם wird in diesem Zusammenhang im Deutschen idiomatisch mit dem Singular „Himmel“ wiedergegeben. „her“ verdeutlicht die Richtung des Rufes.
- source_word: וַיֹּאמֶר
  choice: Er antwortete
  rationale: אָמַר bedeutet wörtlich „sagen“. Beim zweiten Vorkommen ist „antwortete“ im Deutschen kontextgerecht, da Abrahams Äußerung unmittelbar auf den Ruf folgt.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abraham! Abraham!
  rationale: Die Wiederholung des Namens wird bewahrt und durch Ausrufezeichen als dringlicher, persönlicher Ruf gekennzeichnet.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Die feste Antwortformel drückt Anwesenheit und Bereitschaft aus; „Hier bin ich“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben. „Jahwe“ ist die im modernen Deutschen verbreitete wissenschaftliche Form; die genaue antike Aussprache bleibt unsicher.
- issue: Deutung von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die Übersetzung bezeichnet die Gestalt entsprechend dem himmlischen Kontext als Engel, ohne sie darüber hinaus mit Jahwe selbst gleichzusetzen oder eine bestimmte christologische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzählungsfolge wird mit „Da“ flüssig aufgenommen. Die direkte Rede bleibt knapp und eindringlich; unnötige Erklärungen werden nicht in den Vers eingefügt.
