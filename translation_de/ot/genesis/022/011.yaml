    rationale: Das hebräische Verb אָמַר bedeutet hier ohne zusätzliche Markierung „sagen“. Zwar fungiert Abrahams Rede pragmatisch als Antwort, doch „sagte“ bewahrt die sprachliche Zurückhaltung des Ausgangstextes besser.
  revised_text: 'Da rief der Engel Jahwes vom Himmel her zu ihm und sagte: „Abraham, Abraham!“ Er sagte: „Hier bin ich.“'
