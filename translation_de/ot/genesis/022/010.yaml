  text: וַ/יִּשְׁלַ֤ח אַבְרָהָם֙ אֶת יָד֔/וֹ וַ/יִּקַּ֖ח אֶת הַֽ/מַּאֲכֶ֑לֶת לִ/שְׁחֹ֖ט אֶת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: de
  text: Da streckte Abraham seine Hand aus und nahm das Messer, um seinen Sohn zu schlachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist genauer als ein allgemeines Wort für »töten« und kann einen opferbezogenen Beiklang haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: streckte … aus
  rationale: In Verbindung mit »Hand« bezeichnet das Verb hier das Ausstrecken der Hand; diese Wiedergabe ist im Deutschen natürlich und bildet die konkrete Bewegung genau ab.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Direkte Wiedergabe des Singulars mit Possessivsuffix.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das häufige Verb wird schlicht mit »nahm« wiedergegeben, ohne die Art des Zugreifens unnötig zu verstärken.
- source_word: הַמַּאֲכֶלֶת
  choice: das Messer
  rationale: Das Substantiv bezeichnet ein Schneidewerkzeug zum Schlachten; »Messer« ist die klare und natürliche deutsche Entsprechung.
- source_word: לִשְׁחֹט
  choice: um … zu schlachten
  rationale: »Schlachten« ist spezifischer als »töten« und bewahrt die mögliche kultisch-opferbezogene Färbung des hebräischen Verbs.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: Direkte Wiedergabe des Substantivs mit Possessivsuffix.
- source_word: וַ
  choice: Da … und
  rationale: »Da« führt den nächsten Erzählschritt ein; das zweite וַ wird mit »und« wiedergegeben. So bleibt die fortschreitende Abfolge in natürlichem Deutsch erhalten.
theological_decisions:
- issue: Wiedergabe von שָׁחַט mit einem opferbezogen gefärbten Ausdruck
  choice: schlachten
  alternative: töten
  rationale: Im Kontext der Bindung Isaaks und aufgrund des üblichen Gebrauchs des Verbs für das Schlachten, auch von Opfertieren, bewahrt »schlachten« die rituelle und emotionale Wucht, ohne spätere theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. »Streckte … aus« entspricht dem konkreten hebräischen Ausdruck; eine zusätzliche Variantenfußnote ist im Deutschen nicht nötig. Der härtere, spezifische Ausdruck »schlachten« bleibt bewusst erhalten.
