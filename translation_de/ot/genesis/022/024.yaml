base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: de
  text: Und seine Nebenfrau[a], die Reuma hieß, gebar ebenfalls Tebach, Gaham, Tahasch und Maacha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und seine Konkubine“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auch sie gebar“, mit ausdrücklicher Betonung des Pronomens im Hebräischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Und seine Nebenfrau
  rationale: פִּילֶגֶשׁ bezeichnet eine Frau mit einem gegenüber der Hauptfrau nachgeordneten sozialen und rechtlichen Status. „Nebenfrau“ ist im modernen Deutschen verständlich und vermeidet die heute leicht abwertenden Nebenbedeutungen von „Konkubine“.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: die Reuma hieß
  rationale: Die hebräische Koordination lautet wörtlich „und ihr Name war Reuma“; der Relativsatz gibt die Beziehung im Deutschen natürlich wieder, ohne den Sinn zu verändern.
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: ילד bezeichnet hier das Gebären; „gebar“ ist knapp, würdig und für einen genealogischen Zusammenhang passend.
- source_word: גַּם הִוא
  choice: ebenfalls
  rationale: Die Wendung betont, dass auch Reuma – neben Milka im vorausgehenden Zusammenhang – Kinder gebar. „Ebenfalls“ gibt diesen Anschluss idiomatisch wieder; die ausdrücklich gesetzte feminine Pronomenform wird in einer Fußnote sichtbar gemacht.
- source_word: טֶבַח וְגַחַם וְתַחַשׁ וְמַעֲכָה
  choice: Tebach, Gaham, Tahasch und Maacha
  rationale: Die Personennamen werden nach gängiger deutscher Bibeltransliteration wiedergegeben und als natürliche Aufzählung verbunden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Satzführung. „Nebenfrau“ wahrt die soziale Unterscheidung des hebräischen Begriffs, ohne unnötig archaisch oder abwertend zu klingen. Die Namensformen orientieren sich an gebräuchlicher deutscher biblischer Wiedergabe.
