lexical_decisions:
- source_word: ע֥וּץ
  choice: Uz
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Bibelschreibung wiedergegeben.
- source_word: בְּכֹר֖וֹ
  choice: seinen Erstgeborenen
  rationale: בכור bezeichnet den erstgeborenen Sohn und kann neben der Geburtsreihenfolge auch dessen besondere Stellung anklingen lassen.
- source_word: בּ֣וּז
  choice: Bus
  rationale: Der Eigenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: אָחִ֑יו
  choice: seinen Bruder
  rationale: Die direkte Wiedergabe bewahrt den Bezug des männlichen Suffixes; im unmittelbaren Zusammenhang ist Bus als Bruder des zuvor genannten Uz gemeint.
- source_word: קְמוּאֵ֖ל
  choice: Kemuël
  rationale: Diese Schreibweise gibt den Eigenname verständlich wieder und markiert durch das Trema die getrennte Aussprache der Vokale.
- source_word: אֲבִ֥י
  choice: den Vater von
  rationale: אָב bedeutet zunächst „Vater“, kann in genealogischen Zusammenhängen jedoch auch einen Vorfahren oder Stammvater bezeichnen; die direkte Bedeutung bleibt im Haupttext erhalten.
- source_word: אֲרָֽם
  choice: Aram
  rationale: Der Eigenname wird transliteriert, ohne ihn über den Wortlaut hinaus ethnisch oder geografisch auszudeuten.
theological_decisions:
- issue: Genealogische Bedeutung von אֲבִי אֲרָם
  choice: Kemuël, den Vater Arams
  alternative: Kemuël, den Vorfahren oder Stammvater Arams
