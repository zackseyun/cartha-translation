source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: de
  text: dass ich dich ganz gewiss segnen und deine Nachkommenschaft[a] überaus zahlreich machen werde wie die Sterne am Himmel und wie den Sand, der am Meeresufer liegt, und deine Nachkommenschaft wird das Tor ihrer Feinde in Besitz nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinen Samen“. Das hebräische Wort steht im Singular, kann aber die Nachkommen als Gesamtheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische behält den grammatischen Singular bei: „seiner Feinde“. Auch „wird das Tor seiner Feinde erben“ ist möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: dass
  rationale: Im Zusammenhang mit dem in Vers 16 eingeleiteten Schwur führt כִּי den Inhalt der göttlichen Erklärung ein.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: ich dich ganz gewiss segnen werde
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage; „ganz gewiss“ gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: überaus zahlreich machen werde
  rationale: Die zweite emphatische Infinitivkonstruktion bezeichnet hier eine außerordentliche Vermehrung. Die Wiedergabe ist idiomatischer als eine wörtliche Verbwiederholung.
- source_word: זַרְעֲךָ
  choice: deine Nachkommenschaft
  rationale: זֶרַע ist ein grammatisch singularisches Kollektiv. „Nachkommenschaft“ bezeichnet die Gesamtheit der Nachkommen und bewahrt im Deutschen den kollektiven Singular besser als der Plural „Nachkommen“.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: wie die Sterne am Himmel
  rationale: Dies ist die natürliche deutsche Entsprechung und bewahrt das Vergleichsbild vollständig.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: wie den Sand, der am Meeresufer liegt
  rationale: Der Relativsatz bildet אֲשֶׁר ausdrücklich ab; „Meeresufer“ gibt die hebräische Wendung „Lippe/Rand des Meeres“ idiomatisch wieder.
- source_word: וְיִרַשׁ
  choice: wird … in Besitz nehmen
  rationale: יָרַשׁ kann erben, besitzen oder in Besitz nehmen bedeuten. Beim Tor der Feinde steht die Erlangung von Herrschaft im Vordergrund.
- source_word: שַׁעַר
  choice: das Tor
  rationale: Die konkrete Bildsprache bleibt erhalten; das Stadttor kann dabei stellvertretend für Macht und Kontrolle über eine Stadt stehen.
- source_word: אֹיְבָיו
  choice: ihrer Feinde
  rationale: Das hebräische Suffix steht im maskulinen Singular und bezieht sich auf das singularische Kollektiv זֶרַע. Wegen des femininen deutschen Kollektivums „Nachkommenschaft“ lautet der entsprechende Singularbezug „ihrer“.
theological_decisions:
- issue: Kollektiver Singular זֶרַע und singularisches Pronomen in der Schlussaussage
  choice: „deine Nachkommenschaft … ihrer Feinde“ als singularisches Kollektiv
  alternative: „deine Nachkommen … ihrer Feinde“ oder „dein Same … seiner Feinde“
  rationale: „Nachkommenschaft“ bewahrt den kollektiven Singular, ohne den Ausdruck ausdrücklich auf nur eine Person oder ausschließlich auf eine Vielzahl festzulegen. Eine Fußnote macht sichtbar, dass im Hebräischen auch das anschließende Pronomen singularisch ist.
- issue: Bedeutung des Tores der Feinde
  choice: Das Bild wörtlich als „das Tor … in Besitz nehmen“ stehen lassen
  alternative: 'Deutend: „über ihre Feinde siegen“ oder „die Städte ihrer Feinde beherrschen“'
  rationale: Die wörtliche Bildsprache lässt sowohl den konkreten militärisch-politischen als auch den metonymischen Herrschaftsaspekt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommenschaft“ ist leicht gehoben, aber allgemein verständlich und dient dazu, den kollektiven Singular der Vorlage zu bewahren. Die emphatischen hebräischen Verbkonstruktionen werden idiomatisch durch „ganz gewiss“ und „überaus“ wiedergegeben.
