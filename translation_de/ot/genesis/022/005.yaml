base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: de
  text: 'Da sagte Abraham zu seinen jungen Männern: „Bleibt ihr hier beim Esel. Der Junge und ich wollen dorthin gehen, uns niederwerfen[a] und zu euch zurückkehren[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anbeten“. Das hebräische Verb bezeichnet wörtlich ein Sich-Niederwerfen und wird häufig für eine Anbetungshandlung gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Abraham spricht im Plural: „Wir wollen zu euch zurückkehren.“ Der Text erklärt nicht, ob er damit etwas verheimlicht, eine Erwartung ausdrückt oder auf Gottes Versorgung vertraut.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: seinen Knechten
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Im Kontext sind die beiden mitreisenden Bediensteten gemeint; „Knechte“ ist im würdigen modernen Erzählstil verständlich und unterscheidet sie vom später genannten Isaak.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Bleibt ihr hier
  rationale: יָשַׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Hier gibt Abraham die Anweisung, nicht weiter mitzugehen; „Bleibt ihr hier“ gibt das idiomatisch wieder und bildet den betonten Gegensatz zu „ich aber und der Junge“ ab.
- source_word: עִם הַחֲמוֹר
  choice: bei dem Esel
  rationale: Die Präposition עִם bedeutet grundsätzlich „mit“. In dieser deutschen Aufforderung ist „bei dem Esel bleiben“ die natürliche Formulierung und bewahrt den Sinn.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Ich aber und der Junge
  rationale: נַעַר bezeichnet hier Isaak aus Abrahams Perspektive. „Der Junge“ ist natürlich und vermeidet eine unnötige Festlegung seines Alters; das „aber“ verdeutlicht den im Hebräischen angelegten Subjektkontrast.
- source_word: נֵלְכָה עַד כֹּה
  choice: wollen dorthin gehen
  rationale: Die Kohortativform bezeichnet die beabsichtigte Handlung; עַד־כֹּה weist auf den bezeichneten Ort. „Wollen dorthin gehen“ gibt beides in natürlichem Deutsch wieder.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: uns niederwerfen
  rationale: שׁחה bezeichnet körperliches Niederwerfen, häufig als Anbetungshandlung. Die konkrete Wiedergabe bewahrt das Bild und den kultischen Zusammenhang, ohne die Handlung auf einen abstrakten Begriff zu reduzieren.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: und zu euch zurückkehren
  rationale: Die hebräische Form steht in der ersten Person Plural. Die Übersetzung erhält ausdrücklich Abrahams Aussage, dass beide zurückkehren werden, ohne ihre Absicht oder Erfüllung zu deuten.
theological_decisions:
- issue: Plural in Abrahams Aussage über die Rückkehr
  choice: „zu euch zurückkehren“ mit einem gemeinsamen pluralischen Subjekt
  alternative: Die Aussage als Verheimlichung, Hoffnung oder Glaubensgewissheit ausdrücklich deuten
  rationale: Die hebräischen Verben für Niederwerfen und Zurückkehren stehen beide in der ersten Person Plural. Der Wortlaut wird beibehalten; ob Abraham etwas verbirgt, eine Erwartung äußert oder auf Gottes Versorgung vertraut, erklärt der Vers nicht.
- issue: Bedeutung der kultischen Handlung
  choice: „uns niederwerfen“
  alternative: „anbeten“
  rationale: Das Niederwerfen kann hier klar eine Anbetungshandlung bezeichnen. Die konkrete Bedeutung wahrt zugleich die körperliche und religiöse Dimension des hebräischen Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt schlicht und erzählerisch. „Knechte“ kennzeichnet die Begleiter kontextgemäß, während „der Junge“ Isaak bezeichnet. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
