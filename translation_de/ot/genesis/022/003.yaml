base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: de
  text: Abraham stand früh am Morgen auf, sattelte seinen Esel und nahm zwei seiner jungen Männer[a] und seinen Sohn Isaak mit. Er spaltete Holz für ein Brandopfer, machte sich auf und ging zu dem Ort, den Gott ihm genannt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei seiner Diener“ beziehungsweise „zwei seiner Begleiter“. Das hebräische Wort kann je nach Zusammenhang junge Männer oder männliche Bedienstete beziehungsweise Begleiter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abraham stand früh am Morgen auf
  rationale: Die Verbindung bezeichnet frühes Aufstehen; die deutsche Formulierung bewahrt sowohl den zeitlichen Nachdruck als auch den natürlichen Erzählstil.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: sattelte seinen Esel
  rationale: חבש bezeichnet hier das Herrichten des Esels zur Reise, idiomatisch das Satteln beziehungsweise Befestigen der Ausrüstung.
- source_word: שְׁנֵי נְעָרָיו
  choice: zwei seiner jungen Männer
  rationale: נַעַר kann einen jungen Mann oder einen männlichen Diener beziehungsweise Begleiter bezeichnen. Die Hauptfassung wahrt die lexikalische Offenheit; die kontextuell möglichen Funktionsbezeichnungen stehen in der Fußnote.
- source_word: יִצְחָק בְּנוֹ
  choice: seinen Sohn Isaak
  rationale: Natürliches modernes Deutsch, das die ausdrücklich genannte Sohnschaft klar erhält.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: Er spaltete Holz für ein Brandopfer
  rationale: בקע bedeutet spalten; עֹלָה bezeichnet die Opferart Brandopfer. Ein unbestimmter Artikel gibt die artikellose hebräische Konstruktion angemessen wieder.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: machte sich auf und ging
  rationale: Die Wiedergabe erhält beide aufeinanderfolgenden Verben und klingt zugleich in würdigem modernem Deutsch natürlich.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: zu dem Ort, den Gott ihm genannt hatte
  rationale: אמר mit indirektem Objekt verweist hier auf Gottes frühere Mitteilung des Zielorts. Das Plusquamperfekt bildet diese Vorzeitigkeit im Deutschen klar ab.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs עֹלָה
  choice: Brandopfer
  alternative: Ganzbrandopfer
  rationale: „Brandopfer“ ist der etablierte, verständliche deutsche Fachbegriff und bezeichnet die Opferart, ohne zusätzliche Auslegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählbewegung. Die Wiederholung der hebräischen Satzanfänge mit וַ wird teilweise durch Satzteilung und deutsche Koordination wiedergegeben, ohne Handlungsschritte auszulassen.
