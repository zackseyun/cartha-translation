base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: de
  text: 'Nach diesen Ereignissen wurde Abraham berichtet: »Sieh, auch Milka hat deinem Bruder Nahor Söhne geboren:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die feste Erzählformel bezeichnet hier die vorausgegangenen Geschehnisse; »Ereignisse« ist im modernen Deutsch natürlicher als das wörtliche »Dinge«.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: 'wurde Abraham berichtet:'
  rationale: Das unpersönliche Passiv bleibt erhalten; das hebräische לֵאמֹר leitet den folgenden Wortlaut ein und wird im Deutschen idiomatisch durch den Doppelpunkt wiedergegeben.
- source_word: הִנֵּה
  choice: Auch Milka …
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die Nachricht. Ein zusätzliches »Sieh« oder »Siehe« wäre in dieser indirekten Mitteilung im modernen Deutsch schwerfällig; die Hervorhebung ergibt sich aus Satzstellung und Kontext.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Etablierte deutsche Wiedergabe des Eigennamens.
- source_word: גַם הִוא
  choice: Auch Milka
  rationale: Die emphatische Verbindung bedeutet, dass Milka ihrerseits ebenfalls Kinder geboren hat; »auch« bewahrt diesen Bezug ohne ein unnatürliches »auch sie«.
- source_word: בָּנִים
  choice: Söhne
  rationale: Das maskuline Pluralwort bezeichnet hier die anschließend namentlich aufgeführten Söhne.
- source_word: לְנָחוֹר אָחִיךָ
  choice: deinem Bruder Nahor
  rationale: Bewahrt die Zuordnung zu Nahor und seine Verwandtschaftsbeziehung zu Abraham in natürlicher deutscher Wortfolge.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die formelhafte hebräische Einleitung wird natürlich wiedergegeben; der abschließende Doppelpunkt bleibt stehen, weil Vers 21 die Liste der Söhne fortsetzt.
