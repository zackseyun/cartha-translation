    issue: Zeitform der Ortsbezeichnung
    rationale: יִרְאֶה ist ein Imperfekt („wird sehen“). „Der HERR sieht vor“ ersetzt die Zukunftsform durch eine gegenwärtige, im Deutschen zudem idiomatisch problematische Wendung.
  - severity: medium
    issue: Zu spezifische Wiedergabe von יֵרָאֶה
    rationale: „wird er sich sehen lassen“ kann eine absichtliche Selbstoffenbarung ausdrücken. Das Nifal lässt auch die weniger festgelegten Wiedergaben „wird gesehen werden“ oder „wird erscheinen“ zu.
