base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: de
  text: 'Und Abraham gab jenem Ort den Namen: »Der HERR wird sehen.«[a] Wie man bis heute sagt: »Auf dem Berg des HERRN wird er gesehen werden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn des Zusammenhangs: »Der HERR wird vorsorgen« oder »Der HERR wird ersehen«. Wörtlich: »Der HERR wird sehen«.'
    reason: Bewahrt die Zukunftsform und das Seh-Motiv des hebräischen Ortsnamens, dokumentiert aber die kontextuelle Deutung als göttliche Vorsorge.
  - marker: b
    text: 'Das Hebräische kann auch bedeuten: »Auf dem Berg des HERRN wird er erscheinen.« Traditionell wird der Spruch zudem im Sinn von Gottes Vorsorge verstanden: »Auf dem Berg des HERRN wird vorgesorgt werden.«'
    reason: Das Nifal יֵרָאֶה ist zwischen Gesehenwerden und Erscheinen mehrdeutig; die Versorgungsdeutung ist kontextuell möglich, aber nicht die einzig festgelegte Lesart.
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: Der HERR sieht vor
  rationale: יִרְאֶה bedeutet formal »wird sehen«, bezeichnet im Kontext aber Gottes fürsorgliches Ersehen und Bereitstellen. »sieht vor« bewahrt im Deutschen sowohl das Motiv des Sehens als auch den Sinn des Versorgens.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens mit »der HERR« ist im deutschen Bibelgebrauch verständlich und würdig.
- source_word: יֵרָאֶה
  choice: wird er sich sehen lassen
  rationale: Die Form ist ein Nifal von ראה und kann »wird gesehen/erscheinen« bedeuten. Die Wiedergabe wahrt den Wechsel vom aktiven יִרְאֶה zum passiven beziehungsweise medialen יֵרָאֶה, statt beide Formen einheitlich als »versorgen« wiederzugeben.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם
  choice: Deshalb sagt man noch heute
  rationale: Idiomatiche deutsche Wiedergabe der unpersönlichen Passivkonstruktion; אֲשֶׁר wird im Zusammenhang folgernd verstanden.
theological_decisions:
- issue: Zusammenhang von Gottes Sehen, Vorsorge und Erscheinen
  choice: Die Ortsbezeichnung wird mit »Der HERR sieht vor« wiedergegeben; der überlieferte Spruch bleibt mit »wird er sich sehen lassen« näher an der hebräischen Passiv-/Medialform.
  alternative: »Der HERR wird versorgen … Auf dem Berg des HERRN wird dafür gesorgt werden.«
  rationale: Der Kontext stützt den Gedanken göttlicher Vorsorge, doch die unterschiedliche Stimme der beiden hebräischen Verbformen ist theologisch und literarisch bedeutsam und soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »sieht vor« ist knapp und erhält das hebräische Seh-Motiv. Die zweite Vershälfte wird bewusst nicht vollständig an die Versorgungsdeutung angeglichen.
