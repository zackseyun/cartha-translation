source:
  edition: WLC
  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: de
  text: Und Betuël zeugte Rebekka. Diese acht gebar Milka dem Nahor, dem Bruder Abrahams.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: Und Betuël
  rationale: Das ו führt die Aufzählung fort und wird schlicht mit „Und“ wiedergegeben; „Betuël“ entspricht der üblichen deutschen Namensform.
- source_word: יָלַד
  choice: zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet das Verb hier die Vaterschaft. „Zeugte“ ist prägnant und im genealogischen Zusammenhang verständlich.
- source_word: אֶת רִבְקָה
  choice: Rebekka
  rationale: Die Akkusativpartikel אֶת bleibt unübersetzt; „Rebekka“ ist die etablierte deutsche Namensform.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Diese acht
  rationale: Die betonte hebräische Formulierung und ihre knappe Wortstellung bleiben erhalten; „Kinder“ muss nicht ergänzt werden.
- source_word: יָלְדָה
  choice: gebar
  rationale: Beim weiblichen Subjekt Milka gibt „gebar“ die konkrete Bedeutung des Verbs knapp und würdig wieder.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Verwendet wird die etablierte deutsche biblische Namensform.
- source_word: לְנָחוֹר
  choice: dem Nahor
  rationale: 'Das ל der genealogischen Wendung wird idiomatisch mit dem deutschen Dativ wiedergegeben: Milka gebar sie Nahor.'
- source_word: אֲחִי אַבְרָהָם
  choice: dem Bruder Abrahams
  rationale: Die Apposition bezieht sich auf Nahor und wird in natürlichem, zugleich würdigem Deutsch wiedergegeben.
theological_decisions: []
