  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und die genealogischen Aussagen zuverlässig wieder: Betuël ist Subjekt von יָלַד mit Rebekka als Objekt; die nachfolgende Wendung nimmt mit „Diese acht“ die zuvor genannten acht Nachkommen auf. Milka ist Subjekt von יָלְדָה, Nahor wird durch den Dativ idiomatisch als derjenige wiedergegeben, dem sie diese acht gebar, und „dem Bruder Abrahams“ steht zutreffend in Apposition zu Nahor.'
