  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: de
  text: 'Da sagte Isaak zu seinem Vater Abraham: „Mein Vater!“ Er sagte: „Hier bin ich, mein Sohn.“ Isaak sagte: „Das Feuer und das Holz sind da – aber wo ist das Schaf[a] für das Brandopfer?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemeiner ein einzelnes Tier aus dem Kleinvieh bezeichnen, etwa ein Schaf oder eine junge Ziege.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte / antwortete
  rationale: Das gewöhnliche hebräische Erzählverb אמר wird grundsätzlich mit „sagte“ wiedergegeben. Beim Erwiderungssatz entspricht „antwortete“ dem natürlichen deutschen Dialogfluss, ohne zusätzliche Aussage einzutragen.
- source_word: אָבִיו
  choice: seinem Vater
  rationale: Bewahrt die ausdrückliche Verwandtschaftsbezeichnung und den würdevollen Erzählton.
- source_word: אָבִי
  choice: Mein Vater!
  rationale: Die Anrede mit Suffix der ersten Person wird unmittelbar als „Mein Vater!“ wiedergegeben.
- source_word: הִנֶּנִי
  choice: Hier bin ich
  rationale: Bewahrt die feste hebräische Bereitschafts- und Anwesenheitsformel sowie ihren literarischen Widerhall im Kapitel.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Gibt das Possessivsuffix und den persönlichen, zugewandten Ton wieder.
- source_word: הִנֵּה
  choice: Das Feuer und das Holz sind da
  rationale: Die aufmerksamkeitslenkende Partikel wird in dieser konkreten Feststellung natürlich deutsch wiedergegeben; das Vorhandensein der sichtbaren Gegenstände tritt deutlich hervor.
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: das Feuer und das Holz
  rationale: Die bestimmten Formen werden beibehalten; der hebräische Plural von עֵץ wird im Deutschen kontextgerecht mit dem Sammelbegriff „Holz“ wiedergegeben.
- source_word: אַיֵּה
  choice: wo ist
  rationale: Direkte und idiomatische Wiedergabe der Ortsfrage.
- source_word: הַשֶּׂה
  choice: das Schaf
  rationale: שֶׂה bezeichnet ein einzelnes Stück Kleinvieh und legt nicht eindeutig ein Lamm fest. „Schaf“ ist im Haupttext knapper und lexikalisch weniger verengend als „Lamm“; die mögliche Einbeziehung einer jungen Ziege wird in der Fußnote bewahrt.
- source_word: לְעֹלָה
  choice: für das Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für עֹלָה, das vollständig verbrannte Opfer; die Präposition לְ wird natürlich mit „für“ wiedergegeben.
theological_decisions:
- issue: Bestimmung des Opfertiers in הַשֶּׂה
  choice: das Schaf
  alternative: das Lamm; das Stück Kleinvieh
  rationale: Der hebräische Ausdruck ist weiter als „Lamm“ und kann je nach Zusammenhang ein Tier aus der Schaf- oder Ziegenherde bezeichnen. Der Haupttext vermeidet daher eine christologisch naheliegende, aber lexikalisch zu enge Festlegung auf „Lamm“; die verbleibende Breite wird durch die Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „sagte“ bleibt weitgehend erhalten, während „antwortete“ einmal den deutschen Dialogfluss glättet. Der Gedankenstrich bildet den spannungsvollen Gegensatz in Isaaks Frage ab, ohne ihn theologisch auszudeuten.
