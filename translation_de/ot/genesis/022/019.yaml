  source_fidelity: 'Der deutsche Text gibt die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: Abraham allein kehrt zu seinen נְעָרִים zurück; anschließend brechen sie gemeinsam nach Beerscheba auf; Abraham bleibt dort. Isaak wird im Haupttext nicht ergänzt. „Blieb“ ist für וַיֵּשֶׁב im Kontext vertretbar und vermeidet eine überstarke Festlegung auf dauerhaften Wohnsitz.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Erzählregister. Die Aufteilung in drei kurze Sätze ist idiomatisch und bildet die parataktische Fortschreitung des Hebräischen nachvollziehbar ab. „Sie machten sich auf“ ist eine natürliche Wiedergabe des narrativen Aufbruchs.
  terminology: „Junge Männer“ wahrt die lexikalische Offenheit von נְעָרָיו, ohne ungesichert „Diener“ einzutragen. „Beerscheba“ ist die etablierte deutsche Namensform. Die Fußnote ist klar, korrekt verankert und bewahrt die erzählerische Spannung ohne Auslegung als Textaussage auszugeben.
