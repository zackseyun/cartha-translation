base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: de
  text: So kehrte Abraham zu seinen jungen Männern zurück[a]. Sie machten sich auf und gingen gemeinsam nach Beerscheba. Abraham blieb in Beerscheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht ausdrücklich nur: »Abraham kehrte zu seinen jungen Männern zurück.« Isaak wird in diesem Satzteil nicht erwähnt, obwohl er in der vorangehenden Erzählung anwesend ist.'
    reason: Bewahrung einer möglichen erzählerischen und theologischen Spannung des hebräischen Textes, ohne Isaak ergänzend in den Haupttext einzufügen.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Das Qal von שׁוב bezeichnet hier in der fortlaufenden Erzählung die Rückkehr zu den zuvor zurückgelassenen Begleitern.
- source_word: נְעָרָיו
  choice: seinen jungen Männern
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Die jungen Männer dienen Abraham hier offenbar als Begleiter, doch die Übersetzung bewahrt die allgemeine lexikalische Bedeutung, ohne ihren Status stärker festzulegen als der hebräische Text.
- source_word: וַיָּקֻמוּ
  choice: sie machten sich auf
  rationale: קום markiert in Erzählungen häufig den Beginn einer Handlung. „Sie machten sich auf“ ist im modernen Deutschen natürlich und gibt den Aufbruch wieder, ohne ein bloß körperliches Aufstehen in den Vordergrund zu rücken.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: gingen gemeinsam
  rationale: הלך mit יַחְדָּו bezeichnet hier gemeinsame Fortbewegung. „Gingen gemeinsam“ ist knapp und bewahrt den im Hebräischen ausdrücklich genannten Gemeinschaftsaspekt.
- source_word: בְּאֵר שָׁבַע
  choice: Beerscheba
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben und nicht übersetzt.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten. Im vorliegenden Zusammenhang gibt „blieb“ den Aufenthalt in Beerscheba natürlich wieder, ohne ausdrücklich einen dauerhaften Wohnsitz oder eine neue Ansiedlung zu behaupten.
theological_decisions:
- issue: Nur Abraham wird ausdrücklich als der vom Berg Zurückkehrende genannt, obwohl Isaak zuvor in der Erzählung anwesend ist.
  choice: Im Haupttext wird nur Abraham als zurückkehrende Person genannt; Isaak wird nicht ergänzt.
  alternative: Man kann annehmen, dass Isaak ebenfalls zurückkehrte und Abraham lediglich als Hauptfigur genannt wird.
  rationale: Der hebräische Text nennt ausdrücklich Abraham als Subjekt von וַיָּשָׁב. Eine Ergänzung Isaaks würde die Spannung des Textes interpretierend auflösen; die Übersetzung bewahrt daher die Aussageform des Originals.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze entsprechen dem fortschreitenden hebräischen Erzählstil. „Junge Männer“ wahrt die Offenheit von נְעָרָיו; „machten sich auf“ vermeidet sowohl altertümliches „erhoben sich“ als auch das umgangssprachlichere „standen auf“.
