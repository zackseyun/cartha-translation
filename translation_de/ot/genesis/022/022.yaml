lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Kesed
  rationale: Personenname in einer Namensliste; nach im Deutschen üblicher biblischer Umschrift wiedergegeben. Die Form bewahrt den hebräischen Konsonantenbestand, ohne den Namen zu übersetzen.
- source_word: חֲזוֹ
  choice: Haso
  rationale: Personenname; die deutsche Form gibt den hebräischen Namen in natürlicher biblischer Namensform wieder.
- source_word: פִּלְדָּשׁ
  choice: Pildasch
  rationale: Personenname; שׁ wird entsprechend deutscher Aussprachekonvention mit „sch“ wiedergegeben.
- source_word: יִדְלָף
  choice: Jidlaf
  rationale: Personenname; anlautendes י wird in deutscher Umschrift mit „J“ und פ ohne Dagesch mit „f“ wiedergegeben.
- source_word: בְּתוּאֵל
  choice: Betuël
  rationale: Personenname; die Trema-Schreibung macht kenntlich, dass u und e getrennt gesprochen werden.
- source_word: וְאֶת / וְאֵת
  choice: und; sonst nicht eigens wiedergegeben
  rationale: Die wiederholte Verbindung aus וְ und dem Akkusativmarker אֵת führt die einzelnen Namen der Reihe an. Im natürlichen Deutschen bleibt der nicht übersetzbare Objektmarker unausgedrückt; die Reihung wird durch Kommas und ein abschließendes „und“ markiert.
