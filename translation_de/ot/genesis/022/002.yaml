base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: de
  text: 'Da sagte er: »Nimm doch deinen Sohn, deinen Einzigen[a], den du liebst, Isaak, und geh in das Land Morija. Bring ihn dort auf einem der Berge, die ich dir nennen werde, als Brandopfer dar.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinen einzigen Sohn«. Das hebräische Wort יְחִידְךָ kann den Einzigen oder einen Einzigartigen bezeichnen; hier hebt es Isaaks besondere Stellung in diesem Befehl hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: doch
  rationale: Die Modalpartikel mildert die Aufforderung und gibt den bittenden beziehungsweise eindringlichen Ton im natürlichen modernen Deutsch wieder, ohne נָא fälschlich zeitlich als »jetzt« zu verstehen.
- source_word: בִּנְךָ
  choice: deinen Sohn
  rationale: Direkte und idiomatische Wiedergabe von בֵּן mit dem Suffix der 2. Person Maskulin Singular.
- source_word: יְחִידְךָ
  choice: deinen Einzigen
  rationale: Das substantivierte »Einzigen« bewahrt den Gedanken einer einzigartigen oder alleinigen Stellung, ohne angesichts Ismaels Existenz ausdrücklich eine rein biologische Aussage festzulegen.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: den du liebst
  rationale: Das hebräische Perfekt bezeichnet hier natürlich Abrahams bestehende Liebe zu Isaak; das deutsche Präsens gibt diesen Zustand angemessen wieder.
- source_word: וְלֶךְ לְךָ
  choice: und geh
  rationale: Der Imperativ gibt die Aufforderung natürlich wieder. Eine wörtliche Ergänzung wie »geh für dich« wäre im Deutschen missverständlich und unidiomatisch.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: das Land Morija
  rationale: »Land« entspricht אֶרֶץ unmittelbar; »Morija« ist die etablierte deutsche Form des Ortsnamens.
- source_word: וְהַעֲלֵהוּ ... לְעֹלָה
  choice: Bring ihn ... als Brandopfer dar
  rationale: Im Opferkontext bezeichnet der Hifil von עלה zusammen mit עֹלָה das Darbringen eines Brandopfers. Die deutsche Wendung ist klar und erhält den kultischen Fachbegriff.
- source_word: עַל אַחַד הֶהָרִים
  choice: auf einem der Berge
  rationale: הַר wird gewöhnlich mit »Berg« wiedergegeben; die Formulierung bezeichnet einen noch nicht bestimmten Berg aus einer Mehrzahl.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: den ich dir nennen werde
  rationale: אמר mit indirektem Objekt bedeutet wörtlich »dir sagen«. Im Zusammenhang mit der Auswahl eines Berges ist »dir nennen« die natürliche deutsche Entsprechung, ohne das abweichende Verb »zeigen« einzuführen.
theological_decisions:
- issue: Bedeutung von יְחִידְךָ für Isaak trotz der Existenz Ismaels
  choice: deinen Einzigen
  alternative: deinen einzigen Sohn
  rationale: Die Hauptfassung erhält Isaaks einzigartige Stellung in diesem Befehl und lässt offen, ob der Nachdruck vor allem relational, verheißungsgeschichtlich oder in einem anderen Sinn gemeint ist. Sie bestreitet Ismaels Existenz nicht. Die traditionelle und sprachlich mögliche Wiedergabe »deinen einzigen Sohn« wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nimm doch« bildet den abgemilderten, zugleich eindringlichen Imperativ natürlich ab. Die Anredefolge des Hebräischen bleibt weitgehend erhalten; »als Brandopfer darbringen« verwendet den verständlichen traditionellen Opferbegriff.
