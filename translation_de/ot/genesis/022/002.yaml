  verdict: revise
  source_fidelity: Die Übersetzung gibt die Imperative, die Anredefolge, die Partikel נָא mit „doch“, die Bezeichnung „Brandopfer“ sowie die Lokalisierung in Morija sachgerecht wieder. „deinen Einzigen“ bewahrt die beabsichtigte Offenheit von יְחִידְךָ angemessen.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Der Relativsatz muss jedoch im Plural an „Berge“ anschließen; die vorliegende Singularform „den ich dir nennen werde“ ist grammatisch fehlerhaft und kann den Bezug unnötig auf den einen ausgewählten Berg verengen.
  terminology: „Brandopfer“ ist der etablierte und genaue kultische Begriff für עֹלָה. „Morija“ ist die gebräuchliche deutsche Namensform. Die Fußnote dokumentiert die traditionelle Alternative, ohne die Bedeutung konfessionell festzulegen.
