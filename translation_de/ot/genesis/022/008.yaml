  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: de
  text: 'Und Abraham sagte: „Gott wird sich das Lamm zum Brandopfer bereitstellen[a], mein Sohn.“ So gingen die beiden zusammen weiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Gott wird für sich nach dem Lamm zum Brandopfer sehen, mein Sohn.“ Das hebräische Verb bedeutet „sehen“, kann hier aber idiomatisch auch „dafür sorgen“ oder „bereitstellen“ meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Narrativ-Waw führt die Erzählung weiter; „Und … sagte“ bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der allgemeine hebräische Gottesbegriff bezeichnet hier in Abrahams Rede Gott und wird im Deutschen natürlich mit „Gott“ wiedergegeben.
- source_word: יִרְאֶה לּוֹ
  choice: wird sich … ersehen
  rationale: ראה bedeutet wörtlich „sehen“, kann hier aber idiomatisch „ersehen, dafür sorgen, bereitstellen“ ausdrücken. „Sich … ersehen“ bewahrt sowohl das Seh-Motiv als auch den Bezug des Pronomens לוֹ auf Gott, ohne die Aussage stärker festzulegen als der hebräische Text.
- source_word: הַשֶּׂה
  choice: das Lamm
  rationale: שֶׂה bezeichnet ein Stück Kleinvieh, also ein Schaf oder eine Ziege, häufig ein Jungtier. Im Opferkontext und im Anschluss an Isaaks Frage ist „Lamm“ die natürliche Wiedergabe.
- source_word: לְעֹלָה
  choice: zum Brandopfer
  rationale: עֹלָה ist der übliche Ausdruck für das vollständig verbrannte Opfer; „zum Brandopfer“ ist knapp, verständlich und sachlich genau.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die direkte Anrede bewahrt sowohl das Verwandtschaftsverhältnis als auch den eindringlichen, liebevollen Ton.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: So gingen die beiden miteinander weiter
  rationale: Die Formulierung erhält die Betonung ihres gemeinsamen Weges und gibt zugleich den Fortgang der Handlung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von Abrahams Aussage über Gottes Handeln
  choice: Gott wird sich das Lamm zum Brandopfer ersehen
  alternative: Gott wird für sich das Lamm zum Brandopfer bereitstellen
  rationale: Die gewählte Formulierung wahrt das im hebräischen Verb enthaltene Motiv des Sehens und lässt zugleich dessen idiomatischen Sinn des Vorsorgens anklingen. Sie entscheidet nicht, ob Abraham ausweichend, vertrauensvoll, prophetisch oder in mehrfacher Hinsicht spricht, und erhält so die Spannung der Erzählung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ersehen“ ist leicht gehoben, aber verständlich und hier bewusst gewählt, um die hebräische Mehrdeutigkeit zwischen „sehen“ und „vorsorgen/bereitstellen“ zu bewahren.
