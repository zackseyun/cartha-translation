review_pass:
  verdict: revise
  source_fidelity: Die Aussage יִרְאֶה לּוֹ ist im Kontext idiomatisch zutreffend als Gottes Vorsorge bzw. Bereitstellung wiederzugeben; לּוֹ wird durch „sich“ angemessen abgebildet. „Das Lamm“ ist im unmittelbaren Kontext eine vertretbare, natürliche Konkretisierung von שֶׂה. Die Schlussformel ist treffend wiedergegeben.
  naturalness: „Sich das Lamm ersehen“ ist im modernen Standarddeutsch zwar verständlich, bedeutet aber gewöhnlich „sich etwas auswählen/auswählen“ und nicht „etwas vorsehen oder bereitstellen“. Dadurch entsteht eine irreführende Bedeutungsverschiebung. „Sich ... bereitstellen“ ist hier klar und natürlich.
  terminology: „Brandopfer“ gibt עֹלָה sachgerecht wieder. „Mein Sohn“ und „die beiden ... zusammen“ bewahren Anrede, Ton und die hervorgehobene Gemeinsamkeit. Der revidierte Wortlaut vermeidet die problematische Sonderbedeutung von „ersehen“, ohne die narrative oder theologische Mehrdeutigkeit unzulässig aufzulösen.
  issues:
  - severity: medium
    issue: „sich das Lamm ersehen“
    rationale: Diese deutsche Wendung bezeichnet üblicherweise ein Auswählen. Sie gibt weder die Grundbedeutung „sehen“ noch den kontextuellen idiomatischen Sinn „dafür sorgen/bereitstellen“ zuverlässig wieder und kann nahelegen, Gott wähle ein bereits vorhandenes Lamm aus.
