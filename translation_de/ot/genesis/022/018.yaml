  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: de
  text: Und in deiner Nachkommenschaft werden alle Völker der Erde gesegnet werden[a], weil du meiner Stimme gehorcht hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sich selbst segnen“. Das hebräische Verb kann hier reflexiv verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: werden gesegnet werden
  rationale: Der Hitpael von ברך kann in dieser Verheißungsformel passiv beziehungsweise resultativ oder reflexiv verstanden werden. Die passive Wiedergabe passt zum Zusammenhang der Segensverheißung; die echte reflexive Deutungsmöglichkeit bleibt in der Fußnote erhalten.
- source_word: בְזַרְעֲךָ
  choice: in deinem Nachkommen
  rationale: זֶרַע bezeichnet kollektiv die Nachkommenschaft, kann aber zugleich auf einen Nachkommen bezogen werden. „Nachkommen“ wahrt diese Offenheit besser als „Samen“; „in“ bildet die Präposition ב ab, ohne eine instrumentale Bedeutung festzulegen.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen. „Völker der Erde“ ist im Deutschen natürlich und bewahrt die weltweite Reichweite der Aussage.
- source_word: עֵקֶב אֲשֶׁר
  choice: weil
  rationale: Die Wendung gibt den Grund für die bestätigte Verheißung an; „weil“ bringt diesen kausalen Sinn knapp und idiomatisch zum Ausdruck.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: du auf meine Stimme gehört hast
  rationale: שׁמע בקול bezeichnet nicht bloß akustisches Hören, sondern bereitwilliges Befolgen. Die deutsche Wendung „auf meine Stimme hören“ bewahrt sowohl das Bild des hebräischen Ausdrucks als auch seinen Gehorsamssinn.
theological_decisions:
- issue: Bedeutung des Verbs ברך im Hitpael innerhalb der abrahamitischen Verheißung
  choice: Die Völker empfangen in Abrahams Nachkommen Segen („werden gesegnet werden“).
  alternative: Die Völker segnen sich selbst beziehungsweise wünschen sich unter Berufung auf Abrahams Nachkommen Segen.
  rationale: Der Verheißungszusammenhang stützt eine passive oder resultative Lesart, ohne dass daraus im Vers selbst weitergehende dogmatische Folgerungen gezogen werden. Da die hebräische Verbform auch reflexiv verstanden werden kann, wird diese Alternative ausdrücklich in einer Fußnote bewahrt.
- issue: Bezug und Zahl von זֶרַע
  choice: „Nachkommen“ bleibt grammatisch und semantisch offen für einen einzelnen Nachkommen oder die kollektive Nachkommenschaft.
  alternative: „Nachkommenschaft“ würde die kollektive Bedeutung stärker festlegen; „Samen“ wäre formaler, im heutigen Deutsch jedoch missverständlich.
  rationale: Das hebräische Kollektivnomen kann je nach Zusammenhang kollektiv oder auf einen Repräsentanten bezogen werden. Die Übersetzung soll diese im Ausgangstext vorhandene Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „in deinem Nachkommen“ bewahrt bewusst die Präposition und die mögliche kollektive wie individuelle Bedeutung; „auf meine Stimme gehört“ ist zugleich anschaulich und im Deutschen als Gehorsamswendung verständlich.
