revisions:
- from: Und in deinem Nachkommen werden alle Völker der Erde gesegnet werden[a], weil du auf meine Stimme gehört hast.
  to: Und in deiner Nachkommenschaft werden alle Völker der Erde gesegnet werden[a], weil du meiner Stimme gehorcht hast.
  rationale: Die Revision wahrt die passive Hauptlesart und die dokumentierte reflexive Alternative. „Nachkommenschaft“ gibt den kollektiven Charakter von זֶרַע wieder, ohne den Vers auf eine einzelne Person festzulegen. „Meiner Stimme gehorcht“ übersetzt das hebräische Gehorsamsidiom präziser und natürlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: Die passive Wiedergabe von וְהִתְבָּרֲכוּ als „werden ... gesegnet werden“ ist als eine gut begründete Lesart vertretbar; die reflexive Alternative ist zutreffend in der Fußnote vermerkt. „Alle Völker der Erde“ gibt כָּל־גּוֹיֵי הָאָרֶץ angemessen wieder. Die Formulierung „auf meine Stimme gehört hast“ kann Gehorsam andeuten, ist im heutigen Deutsch jedoch nicht so eindeutig wie das hebräische Idiom שׁמע בקול, das hier Gehorsam ausdrückt. Außerdem legt „deinem Nachkommen“ einen einzelnen Nachkommen nahe, während זַרְעֲךָ ein Kollektivnomen ist.
  naturalness: „In deiner Nachkommenschaft“ ist in diesem feierlichen Verheißungssatz idiomatischer als „in deinem Nachkommen“ und vermeidet dessen unnatürliche, individualisierende Wirkung. „Meiner Stimme gehorcht hast“ ist klares modernes Standarddeutsch und wahrt zugleich die Bildlichkeit des hebräischen Ausdrucks.
  terminology: „Nachkommenschaft“ gibt זֶרַע als Kollektivbegriff zuverlässig wieder. Es verzichtet allerdings auf eine künstliche Singularisierung, die der deutsche Ausdruck „Nachkomme“ erzeugen würde. „Völker“, „Erde“ und „gesegnet“ sind angemessen. Die Fußnote sollte bei der reflexiven Alternative bleiben, ohne eine stärker spezifizierende Formel des Sich-Segnen-Wünschens in den Text einzutragen.
