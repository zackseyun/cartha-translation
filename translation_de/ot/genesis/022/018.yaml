    rationale: Das hebräische זֶרַע ist grammatisch Singular, aber ein Kollektivnomen für Nachkommenschaft. Der deutsche Dativ Singular „deinem Nachkommen“ wird gewöhnlich als Bezug auf eine einzelne Person gelesen und engt die Aussage stärker ein als der Ausgangstext.
  - severity: medium
    issue: „auf meine Stimme gehört hast“ gibt den Gehorsamssinn nicht eindeutig wieder
    rationale: שָׁמַע בְּקוֹל bezeichnet in diesem Kontext gehorsames Hören bzw. Befolgen. „Meiner Stimme gehorcht hast“ bringt diesen Sinn im heutigen Deutsch klarer zum Ausdruck.
