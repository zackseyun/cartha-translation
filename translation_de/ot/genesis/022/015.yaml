  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des hebräischen Verses zutreffend wieder: das erzählfortführende „Und“, den „Engel Jahwes“, die Anrede an Abraham, „ein zweites Mal“ und die Herkunftsangabe „vom Himmel her“. „Rief … zu“ ist für וַיִּקְרָא אֶל idiomatisch und behauptet keine im Hebräischen nicht ausgedrückte Lautstärke.'
  naturalness: „Und der Engel Jahwes rief Abraham ein zweites Mal vom Himmel her zu:“ ist natürliches, würdevolles modernes Standarddeutsch. Die Stellung von „vom Himmel her“ ist klar und der Doppelpunkt bereitet die folgende direkte Rede sachgerecht vor.
  terminology: „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. „Engel“ ist im Kontext die naheliegende Wiedergabe von מַלְאָךְ; die Fußnote bewahrt korrekt die lexikalische Alternative „Bote“, ohne eine theologische Identifikation vorzunehmen.
