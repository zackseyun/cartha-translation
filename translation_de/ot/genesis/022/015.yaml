  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: de
  text: Und der Engel Jahwes rief Abraham ein zweites Mal vom Himmel her zu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Bote Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zu
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; „jemandem zurufen“ gibt קרא bei unmittelbarer Anrede im Deutschen natürlich wieder, ohne eine besondere Lautstärke oder förmliche Verkündigung vorauszusetzen.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. In dieser wiederkehrenden Genesis-Wendung für ein himmlisches Wesen ist „Engel“ die natürliche Hauptübersetzung; die lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל אַבְרָהָם
  choice: Abraham … zu
  rationale: אֶל bezeichnet den Angeredeten; die deutsche Verbfügung „Abraham zurufen“ bringt dies idiomatisch zum Ausdruck.
- source_word: שֵׁנִית
  choice: ein zweites Mal
  rationale: Diese Wiedergabe erhält die ausdrückliche Ordnungsbedeutung genauer als das mögliche „wieder“.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Obwohl שָׁמַיִם formal pluralisch ist, bezeichnet die Wendung hier idiomatisch den Himmel als Herkunftsort der himmlischen Stimme; „her“ macht die Richtung im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Hauptübersetzung folgt dem üblichen Sprachgebrauch für ein himmlisches Wesen, ohne zu entscheiden, ob damit ein geschaffenes Wesen oder eine besondere Erscheinungsweise Gottes gemeint ist. Die mögliche Bedeutung „Bote“ bleibt als Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt den Erzählfluss; „vom Himmel her“ klingt natürlich und bewahrt den erhöhten, aber verständlichen Ton.
