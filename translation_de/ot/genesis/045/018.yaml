source:
  edition: WLC
  text: וּ/קְח֧וּ אֶת אֲבִי/כֶ֛ם וְ/אֶת בָּתֵּי/כֶ֖ם וּ/בֹ֣אוּ אֵלָ֑/י וְ/אֶתְּנָ֣ה לָ/כֶ֗ם אֶת טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְ/אִכְל֖וּ אֶת חֵ֥לֶב הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: de
  text: Nehmt euren Vater und eure Familien und kommt zu mir. Ich werde euch das Beste des Landes Ägypten geben, und ihr sollt vom Fett des Landes essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Besten des Landes«. Das hebräische Bild vom »Fett des Landes« bezeichnet seinen reichsten und erlesensten Ertrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Nehmt
  rationale: Der Qal-Imperativ Plural von לקח fordert die Brüder auf, ihren Vater und ihre Angehörigen mitzunehmen. »Nehmt« gibt die Grundbedeutung direkt wieder; »bringt« wäre im Zusammenhang möglich, fügt aber stärker die Perspektive des Zielorts hinzu.
- source_word: אֲבִיכֶם
  choice: euren Vater
  rationale: Die Singularform mit Suffix der 2. Person Plural bezeichnet Jakob.
- source_word: בָּתֵּיכֶם
  choice: eure Familien
  rationale: בַּיִת bedeutet wörtlich »Haus«, kann aber wie hier die zum Haus gehörenden Menschen bezeichnen. »Familien« ist im modernen Deutsch natürlicher als »Hausgemeinschaften« und meint im Kontext die Angehörigen der Brüder.
- source_word: וּבֹאוּ אֵלַי
  choice: und kommt zu mir
  rationale: Der Imperativ von בוא mit אֶל bezeichnet schlicht das Kommen zum Sprecher. Ein »zurück« ist im Hebräischen nicht ausdrücklich enthalten.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Ich werde euch … geben
  rationale: Die kohortativische Form von נתן schließt an die Aufforderungen an und drückt hier die Zusage des Pharaos aus. Das deutsche Futur vermittelt diesen versprechenden Sinn klar.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: das Beste des Landes Ägypten
  rationale: טוּב kann das Gute, den Reichtum oder das Beste eines Landes bezeichnen. Die Formulierung gibt die zugesagte bevorzugte Versorgung prägnant wieder.
- source_word: וְאִכְלוּ
  choice: und ihr sollt … essen
  rationale: Die Imperativform setzt die Zusage als gewährte Möglichkeit beziehungsweise Folge fort. »Ihr sollt essen« bewahrt den auffordernd-zusichernden Ton, ohne sie lediglich als Zukunftsprognose wiederzugeben.
- source_word: חֵלֶב הָאָרֶץ
  choice: vom Fett des Landes
  rationale: חֵלֶב bedeutet wörtlich »Fett« und bildlich den reichsten oder erlesensten Anteil. Die bildhafte Wendung bleibt im Haupttext erhalten; eine Fußnote erläutert ihre Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die anschauliche hebräische Wendung »Fett des Landes« bleibt bewusst erhalten und wird in der Fußnote erklärt; »Familien« gibt den kontextuellen Sinn von »Häuser« natürlich wieder.
