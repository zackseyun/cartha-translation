  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: de
  text: 'Als man im Haus des Pharaos die Nachricht hörte: »Josefs Brüder sind gekommen«, gefiel es dem Pharao und seinen Dienern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: Als man … die Nachricht hörte
  rationale: הַקֹּל bezeichnet hier im Zusammenhang mit dem folgenden Inhalt die Nachricht bzw. Kunde. Die unpersönliche aktive Form ist im modernen Deutschen natürlicher als »die Nachricht wurde gehört« und gibt den Sinn des hebräischen Passivs zuverlässig wieder.
- source_word: בֵּית פַּרְעֹה
  choice: im Haus des Pharaos
  rationale: Direkte und verständliche Wiedergabe des Konstruktausdrucks; sie lässt offen, ob der Palast, der Hof oder der Haushalt gemeint ist.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Das hebräische Einleitungswort markiert den Inhalt der Nachricht. Im Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als ein wörtliches »indem man sagte«.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Josefs Brüder sind gekommen
  rationale: 'Das Perfekt bezeichnet ein abgeschlossenes Kommen mit gegenwärtigem Ergebnis: Die Brüder sind nun da.'
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: gefiel es
  rationale: Die deutsche Wendung gibt das hebräische Idiom »es war gut in den Augen von« natürlich und präzise wieder, ohne den Sinn zu erweitern.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: »Diener« ist die lexikalisch direkte Wiedergabe und legt den möglichen Rang als Hofbeamte nicht unnötig fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist natürlich, bleibt aber eng an Inhalt und Struktur des Hebräischen. Die mögliche kollektive Bedeutung von »Haus des Pharaos« und die soziale Stellung der »Diener« werden nicht interpretierend verengt.
