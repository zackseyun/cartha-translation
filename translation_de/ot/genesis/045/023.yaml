revisions:
- from: 'Seinem Vater aber schickte er Folgendes: zehn Esel, beladen mit den besten Erzeugnissen Ägyptens,[a] und zehn Eselinnen, beladen mit Getreide, Brot und Reisevorrat für seinen Vater.'
  to: 'Seinem Vater aber schickte er Folgendes: zehn Esel, beladen mit einigen der besten Güter Ägyptens,[a] und zehn Eselinnen, beladen mit Getreide, Brot und Vorräten für die Reise seines Vaters.'
  rationale: Die Revision stellt die partitive Nuance von מִן in der Hauptfassung wieder her, vermeidet mit »Güter« eine unnötige sachliche Einengung von טוּב und macht den abschließenden Bezug der Vorräte auf die Reise des Vaters explizit. Sie bewahrt die Reihenfolge, den Kontrast zwischen Eseln und Eselinnen sowie die offene Bedeutung des Ausgangstextes.
