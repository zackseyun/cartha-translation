source:
  edition: WLC
  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: de
  text: 'Seinem Vater aber schickte er Folgendes: zehn Esel, beladen mit einigen der besten Güter Ägyptens,[a] und zehn Eselinnen, beladen mit Getreide, Brot und Vorräten für die Reise seines Vaters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Besten Ägyptens«; auch: »mit Gütern aus Ägyptens Reichtum«.'
    reason: Die Verbindung מִטּוּב מִצְרָיִם kann partitiv als »einige der besten Güter« verstanden werden; die knappe Wendung »das Beste Ägyptens« sowie die weitere Bedeutung »Reichtum/Überfluss Ägyptens« bleiben mögliche Wiedergaben.
lexical_decisions:
- source_word: כְּזֹאת
  choice: Folgendes
  rationale: Die Wendung führt idiomatisch die anschließende Aufzählung dessen ein, was Josef seinem Vater schickte.
- source_word: חֲמֹרִים
  choice: Esel
  rationale: Die geläufige, moderne deutsche Bezeichnung; das grammatische Geschlecht der Tiere wird hier anders als im folgenden אֲתֹנֹת nicht ausdrücklich spezifiziert.
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: beladen mit
  rationale: Die Partizipien bezeichnen hier, was die Tiere transportierten. »Beladen mit« ist im Deutschen bei Lasttieren natürlich und kontextgemäß.
- source_word: מִטּוּב מִצְרָיִם
  choice: mit den besten Erzeugnissen Ägyptens
  rationale: טוּב bezeichnet hier das Gute, Beste oder den Reichtum des Landes. »Erzeugnisse« bleibt sachlich breit, während die Präposition מִן auch partitiv als »mit etwas vom Besten« verstanden werden kann; diese Nuance wird in der Fußnote bewahrt.
- source_word: אֲתֹנֹת
  choice: Eselinnen
  rationale: Das Hebräische bezeichnet ausdrücklich weibliche Esel; »Eselinnen« gibt diesen Unterschied knapp und natürlich wieder.
- source_word: בָּר
  choice: Getreide
  rationale: Der Ausdruck bezeichnet hier allgemein Getreide und legt keine bestimmte Getreideart sicher fest.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung passt in die Aufzählung und sollte nicht zum allgemeineren »Nahrung« verflacht werden.
- source_word: מָזוֹן
  choice: Reisevorrat
  rationale: Im Zusammenhang bezeichnet das Wort Nahrung beziehungsweise Vorräte für unterwegs. Die zusammengesetzte Wiedergabe verbindet es natürlich mit לַדָּרֶךְ und vermeidet eine schwerfällige Wiederholung.
- source_word: לַדָּרֶךְ
  choice: Reise-
  rationale: 'Der Dativausdruck bezeichnet den Zweck der Vorräte: Sie sind für die Reise bestimmt. Im Deutschen wird dies idiomatisch im Kompositum »Reisevorrat« ausgedrückt.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seinem Vater aber« erhält die vorangestellte Hervorhebung des hebräischen Satzes. Die parallele Struktur der beiden Tiergruppen bleibt erkennbar; »Reisevorrat« gibt den abschließenden Zweckbezug kompakt und natürlich wieder.
