  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: de
  text: 'Da konnte Josef sich vor all denen, die bei ihm standen, nicht länger beherrschen. Er rief: „Schickt alle hinaus, weg von mir!“ So blieb niemand bei ihm, als Josef sich seinen Brüdern zu erkennen gab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: konnte ... sich nicht länger beherrschen
  rationale: Die Verbindung bezeichnet die Unfähigkeit zur weiteren Selbstbeherrschung. „Nicht länger“ ergibt sich natürlich aus dem Fortgang der Szene, ohne die Art seiner Gefühle näher festzulegen.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: vor all denen, die bei ihm standen
  rationale: Die Wiedergabe bewahrt sowohl die räumlich-relationale Bedeutung von עַל als auch den partizipialen Sinn von נצב, ohne die Anwesenden vorschnell als Diener oder Hofbeamte zu bestimmen.
- source_word: וַיִּקְרָא
  choice: Er rief
  rationale: קרא bezeichnet hier hörbares, an die Anwesenden gerichtetes Rufen. „Rief“ ist präzise und vermeidet eine nicht ausdrücklich bezeichnete emotionale Nuance von „schrie“.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Schickt alle hinaus, weg von mir!
  rationale: Der kausative Imperativ verlangt, dass die Angesprochenen jeden Anwesenden hinausbringen beziehungsweise hinausschicken. „Alle“ gibt כָל אִישׁ idiomatisch wieder; „weg von mir“ bewahrt die Perspektive des hebräischen מֵעָלָי.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: So blieb niemand bei ihm
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet hier im Zusammenhang jedoch das Verbleiben in Josefs Gegenwart. „Blieb“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: als Josef sich seinen Brüdern zu erkennen gab
  rationale: Der Hitpael-Infinitiv von ידע bezeichnet hier das Sich-zu-erkennen-Geben. Die deutsche Formulierung wahrt die reflexive Bedeutung und den zeitlichen beziehungsweise begleitenden Wert der Präposition בְּ.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die Anwesenden werden nicht interpretierend als „Diener“ bezeichnet; Josefs Gefühlszustand wird über die ausdrücklich genannte mangelnde Selbstbeherrschung hinaus nicht näher bestimmt.
