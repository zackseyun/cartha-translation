  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: de
  text: Jedem von ihnen gab er einen Satz Kleidung, Benjamin aber gab er dreihundert Silberstücke[a] und fünf Sätze Kleidung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dreihundert Silber«; eine bestimmte Gewichts- oder Währungseinheit wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: Jedem von ihnen
  rationale: 'Die beiden distributiven Ausdrücke werden in natürlichem Deutsch zusammengefasst: Jeder aus der gesamten Gruppe erhielt ein Gewand.'
- source_word: נָתַן
  choice: gab er
  rationale: Die schlichte, im Erzählzusammenhang passende Wiedergabe von נתן.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: Wechselgewand / Wechselgewänder
  rationale: Die Wendung bezeichnet zusätzliche beziehungsweise zum Wechseln bestimmte Kleidung. Der Singular im ersten Satzteil gibt die Verteilung eines Gewandes an jeden Einzelnen wieder; bei Benjamin steht entsprechend der Plural.
- source_word: וּלְבִנְיָמִן
  choice: Benjamin aber
  rationale: Das hebräische ו verbindet die Satzteile, während der Kontext einen deutlichen Kontrast zwischen den Gaben an die Brüder und der besonderen Gabe an Benjamin erkennen lässt.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: dreihundert Silberstücke
  rationale: Wörtlich steht nur „dreihundert Silber“; da keine konkrete Gewichtseinheit genannt wird, vermeidet „Silberstücke“ die unbelegte Festlegung auf Schekel.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: und fünf Wechselgewänder
  rationale: Die gleiche Kleidungsbezeichnung wird innerhalb des Verses konsequent wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wechselgewand“ ist knapp und bibelerzählerisch passend, ohne die Kleidung als Festkleid zu deuten. Die hebräische distributive Doppelung wird idiomatisch zusammengezogen.
