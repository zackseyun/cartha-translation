  source_fidelity: 'Die Grundstruktur und die meisten Lexeme werden treffend wiedergegeben. „Holt euren Vater“ ist jedoch enger als וּנְשָׂאתֶם: Es legt das Abholen als eigene Handlung nahe, während der hebräische Ausdruck das Mitnehmen/Herbringen des Vaters mit dem bereitgestellten Transport bezeichnet. „Kommt her“ expliziert zudem die deiktische Richtung stärker als das schlichte וּבָאתֶם („kommt“).'
  naturalness: Der Text ist insgesamt idiomatisches modernes Standarddeutsch. „Bringt euren Vater mit und kommt“ ist natürlich und bewahrt den knappen Befehlscharakter.
  terminology: „Wagen“, „kleine Kinder“ und „Frauen“ passen im Familien- und Transportzusammenhang. Die Fußnote zu טַף erklärt die spezifischere Bedeutung angemessen.
