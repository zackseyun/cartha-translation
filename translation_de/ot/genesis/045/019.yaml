    rationale: Das hebräische Verb lautet lediglich „kommt“. Die Richtung nach Ägypten ergibt sich aus dem Kontext und kann in der Fußnote erläutert werden, sollte aber nicht zusätzlich durch „her“ im Haupttext festgelegt werden.
