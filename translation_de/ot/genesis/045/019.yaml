- from: 'Dir aber ist befohlen: »Tut Folgendes: Nehmt euch Wagen aus dem Land Ägypten für eure kleinen Kinder[a] und eure Frauen, holt euren Vater und kommt her[b].«'
  to: 'Dir aber ist befohlen: »Tut Folgendes: Nehmt euch Wagen aus dem Land Ägypten für eure kleinen Kinder[a] und eure Frauen, bringt euren Vater mit und kommt[b].«'
  rationale: Die Änderung von „holt“ zu „bringt ... mit“ gibt die Bedeutung von נשא im Kontext des Transports mit den Wagen genauer wieder. Die Streichung von „her“ bewahrt die im hebräischen Grundtext nicht näher bestimmte Form von „kommt“, während die kontextuell erwartete Zielrichtung in der Fußnote verbleibt.
