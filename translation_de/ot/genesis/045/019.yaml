  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: de
  text: 'Dir aber ist befohlen: »Tut Folgendes: Nehmt euch Wagen aus dem Land Ägypten für eure kleinen Kinder[a] und eure Frauen, bringt euren Vater mit und kommt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für eure Kleinen“; gemeint sind besonders die kleinen Kinder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und kommt“. Aus dem Zusammenhang ist die Ankunft in Ägypten gemeint; daher kann man auch übersetzen: „und kommt zurück“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה צֻוֵּיתָה
  choice: Dir aber ist befohlen
  rationale: Das passive Pual von צוה bezeichnet einen an den Angesprochenen ergangenen Befehl. Das vorangestellte Pronomen wird durch „Dir aber“ hervorgehoben; der Kontext weist auf den Pharao als Befehlenden.
- source_word: זֹאת עֲשׂוּ
  choice: Tut Folgendes
  rationale: Gibt die knappe hebräische Anweisungsformel natürlich und mit ihrem Imperativcharakter wieder.
- source_word: קְחוּ לָכֶם
  choice: Nehmt euch
  rationale: Bewahrt die durch לָכֶם ausgedrückte Bezugs- beziehungsweise Nutznießernuance, ohne im Deutschen schwerfällig zu klingen.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Gibt אֶרֶץ ausdrücklich wieder und entspricht der gehobenen, aber verständlichen biblischen Ortsbezeichnung.
- source_word: עֲגָלוֹת
  choice: Wagen
  rationale: Bezeichnet hier Transportfahrzeuge für Menschen und Besitz; „Wagen“ ist im Deutschen weiter und natürlicher als eine unnötig genaue technische Festlegung.
- source_word: לְטַפְּכֶם
  choice: für eure kleinen Kinder
  rationale: טַף bezeichnet besonders die kleinen Kinder beziehungsweise die nicht selbstständig reisenden Kleinen; „kleine Kinder“ ist klarer als das heute teils unbestimmte „die Kleinen“.
- source_word: וְלִנְשֵׁיכֶם
  choice: und eure Frauen
  rationale: Im Familienzusammenhang sind die Ehefrauen gemeint; „eure Frauen“ ist im modernen Deutschen natürlich und relational eindeutig.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: holt euren Vater
  rationale: נשא hat den Grundsinn „tragen/aufnehmen“, bezeichnet hier aber das Mitnehmen und Herbringen des Vaters. „Holt“ gibt den situativen Sinn natürlich wieder, ohne anzudeuten, er müsse körperlich getragen werden.
- source_word: וּבָאתֶם
  choice: und kommt her
  rationale: Das Verb bedeutet schlicht „kommen“. „her“ macht im Deutschen die deiktische Richtung zum Sprecher beziehungsweise nach Ägypten deutlich; die im Kontext liegende Rückkehr wird nicht ausdrücklich in den Verbstamm hineingelesen.
