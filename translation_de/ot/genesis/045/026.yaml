base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: de
  text: 'Sie berichteten ihm: „Josef lebt noch, und er herrscht über ganz Ägypten.“ Da erstarrte sein Herz[a], denn er glaubte ihnen nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da wurde sein Herz kraftlos“ oder „Da wurde sein Herz wie betäubt.“ Die hebräische Wendung beschreibt Jakobs erschütterte, geschwächte innere Reaktion auf die Nachricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: 'Sie berichteten ihm:'
  rationale: Das Hifil von נגד bezeichnet ein Mitteilen oder Berichten. Der Doppelpunkt gibt die hebräische Redeeinleitung לֵאמֹר im natürlichen modernen Deutsch wieder.
- source_word: עוֹד יוֹסֵף חַי
  choice: Josef lebt noch!
  rationale: עוֹד bezeichnet hier das Fortbestehen des Lebens; „lebt noch“ ist im Deutschen natürlicher als „ist noch lebendig“ und trägt die überraschende Nachricht angemessen.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: Er herrscht sogar
  rationale: מֹשֵׁל bezeichnet die Ausübung von Herrschaft, ohne ein bestimmtes ägyptisches Amt festzulegen. „Sogar“ bringt die hier steigernde Kraft der weiteren Nachricht idiomatisch zum Ausdruck, ohne den Sachgehalt zu verändern.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: über ganz Ägypten
  rationale: Die Präposition בְּ bezeichnet mit משל den Herrschaftsbereich. „Über ganz Ägypten“ ist prägnantes, natürliches Deutsch für das gesamte Land Ägypten.
- source_word: וַיָּפָג לִבּוֹ
  choice: Da erstarrte sein Herz
  rationale: פוג kann ein Schwach-, Kraftlos- oder Regungsloswerden ausdrücken. „Sein Herz erstarrte“ bewahrt das Körperbild und vermittelt Jakobs schockierte innere Reaktion, ohne die mehrdeutige Wendung vollständig festzulegen.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: denn er glaubte ihnen nicht
  rationale: כִּי begründet Jakobs Reaktion. „Denn“ erhält den kausalen Zusammenhang in gehobenem, aber allgemein verständlichem Erzähldeutsch.
