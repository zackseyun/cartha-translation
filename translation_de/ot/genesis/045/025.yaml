base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: de
  text: So zogen sie aus Ägypten hinauf und kamen in das Land Kanaan zu ihrem Vater Jakob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen … hinauf
  rationale: Das Verb עלה bedeutet wörtlich „hinaufgehen/hinaufziehen“. In der geografischen Reiseformel von Ägypten nach Kanaan bewahrt „hinaufziehen“ die räumliche Perspektive und klingt im Deutschen natürlich.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt; bei Ländern ist „aus Ägypten“ die idiomatische deutsche Wiedergabe.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: בוא bedeutet gewöhnlich „kommen“ oder „hineingehen“. „Kamen“ gibt die anschließende Ankunft wieder, ohne den Vorgang unnötig zu präzisieren.
- source_word: אֶרֶץ כְּנַעַן
  choice: das Land Kanaan
  rationale: Die Wiedergabe erhält das ausdrücklich genannte אֶרֶץ („Land“) und entspricht einer geläufigen, würdigen deutschen Form.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: zu ihrem Vater Jakob
  rationale: אֶל bezeichnet die Bewegung auf eine Person zu; die im Deutschen natürliche Wortstellung „zu ihrem Vater Jakob“ bewahrt sowohl die Beziehung als auch den Eigennamen.
