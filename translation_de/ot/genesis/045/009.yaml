  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen präzise wieder: die dringlichen Pluralimperative („Beeilt euch“, „zieht hinauf“), die Botenformel, Josefs Selbstbezeichnung als Sohn, Gottes Einsetzung Josefs zum Herrn über Ägypten sowie die abschließende Aufforderung an den Vater, unverzüglich nach Ägypten hinabzukommen. Die geografischen Richtungen „hinauf“ nach Kanaan und „herab“ nach Ägypten bleiben erhalten.'
