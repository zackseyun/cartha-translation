source:
  edition: WLC
  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: de
  text: 'Beeilt euch und zieht hinauf zu meinem Vater. Sagt zu ihm: »So spricht dein Sohn Josef: Gott hat mich zum Herrn über ganz Ägypten gemacht. Komm zu mir herab; zögere nicht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Halte dich nicht auf; wörtlicher: Bleib nicht stehen.'
    reason: lexikalische Alternative und Bewahrung der wörtlichen Bildsprache von עמד
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Beeilt euch
  rationale: Der pluralische Imperativ drückt Dringlichkeit aus; die Wendung ist im heutigen Deutsch natürlich und bewahrt die Befehlsform.
- source_word: וַעֲלוּ
  choice: zieht hinauf
  rationale: עלה bezeichnet das Hinaufziehen; die in Genesis übliche geografische Perspektive auf die Reise nach Kanaan bleibt erhalten.
- source_word: אֶל אָבִי
  choice: zu meinem Vater
  rationale: Die Richtungsangabe wird ohne erläuternde Erweiterung wiedergegeben.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: Sagt zu ihm
  rationale: Die mit der vorherigen Aufforderung verbundene Anweisung wird als natürlicher deutscher Imperativ formuliert.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird knapp und würdevoll wiedergegeben.
- source_word: בִּנְךָ יוֹסֵף
  choice: dein Sohn Josef
  rationale: Die hebräische Wortfolge und die Betonung der familiären Identität Josefs bleiben erhalten.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Gott hat mich ... gemacht
  rationale: שים bezeichnet hier das Einsetzen in eine Stellung; „gemacht“ ist idiomatisch und verbindet sich natürlich mit der folgenden Amtsbezeichnung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Syntax hat singularischen Sinn, und Josef schreibt seine Stellung dem einen Gott zu.
- source_word: לְאָדוֹן
  choice: zum Herrn
  rationale: אָדוֹן bezeichnet einen Inhaber umfassender Autorität. „Herr“ wahrt den Statusbegriff, ohne ein bestimmtes politisches Amt hineinzulesen.
- source_word: לְכָל מִצְרָיִם
  choice: über ganz Ägypten
  rationale: Die Präposition bezeichnet hier den Bereich, über den sich Josefs Herrschaft erstreckt.
- source_word: רְדָה אֵלַי
  choice: Komm zu mir herab
  rationale: ירד bewahrt die geografische Abwärtsbewegung nach Ägypten; wegen Josef als Ziel ist „komm“ im Deutschen die natürliche deiktische Wahl.
- source_word: אַל תַּעֲמֹד
  choice: zögere nicht
  rationale: עמד bedeutet wörtlich „stehen“, hat in diesem Verbot aber den kontextuellen Sinn, sich nicht aufzuhalten oder zu säumen. Die Fußnote bewahrt die wörtlichere Bildsprache.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in Josefs Erklärung
  choice: Gott
  alternative: ein Gott
  rationale: Verbalsinn und Kontext sind singularisch, und Josef führt seine Erhöhung auf Gott zurück. Die Wiedergabe folgt der naheliegenden Aussage des Hebräischen, ohne zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. „Zieht hinauf“ und „komm ... herab“ bewahren die geografische Perspektive des Hebräischen; die direkte Rede verwendet die traditionelle, weiterhin verständliche Botenformel „So spricht“.
