  terminology: „Gott“ entspricht dem singularischen Bezug von אֱלֹהִים im Kontext. „zum Herrn über ganz Ägypten“ gibt אָדוֹן wieder, ohne ein spezifisches Amt wie König oder Wesir einzutragen. Der Name „Josef“ ist die übliche moderne deutsche Form.
