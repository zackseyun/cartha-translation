  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Direktive des hebräischen Textes zuverlässig wieder: Pharaos Aufforderung an Josef, seinen Brüdern den Befehl auszurichten, das Beladen der Tiere sowie Aufbruch und Bewegung nach Kanaan. „Lasttiere“ ist im gegebenen Transport- und Reisekontext eine angemessene, präzisierende Wiedergabe von בְּעִירְכֶם. „Brecht auf und zieht“ bewahrt die zwei aufeinanderfolgenden Imperative וּלְכוּ בֹאוּ idiomatischer als eine künstliche wörtliche Entsprechung.'
