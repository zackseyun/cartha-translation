base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: »Sag deinen Brüdern: ›Tut Folgendes: Beladet eure Lasttiere, brecht auf und zieht ins Land Kanaan.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Sag deinen Brüdern
  rationale: Die Aufforderung an Josef, seinen Brüdern die folgende Anweisung mitzuteilen, wird direkt und idiomatisch wiedergegeben.
- source_word: זֹאת עֲשׂוּ
  choice: Tut Folgendes
  rationale: Natürliche deutsche Einleitung einer konkreten Handlungsanweisung; sie bewahrt den Demonstrativbezug.
- source_word: טַעֲנוּ
  choice: Beladet
  rationale: Das Verb bezeichnet hier das Beladen von Tieren für den Transport.
- source_word: בְּעִירְכֶם
  choice: eure Lasttiere
  rationale: בְּעִיר bezeichnet Haustiere beziehungsweise Vieh; der Reisekontext legt Tiere nahe, die Lasten tragen. „Lasttiere“ ist präziser als das sehr allgemeine „Tiere“ und natürlicher als „Lastvieh“.
- source_word: וּלְכוּ בֹאוּ
  choice: brecht auf und zieht
  rationale: Die beiden aufeinanderfolgenden Imperative bezeichnen Aufbruch und Wegbewegung mit dem Ziel Kanaan. Die Wiedergabe erhält zwei verbale Handlungen, ohne das im Deutschen missverständliche räumliche Gegensatzpaar „geht, kommt“ zu erzwingen.
- source_word: אַרְצָה כְּנָעַן
  choice: ins Land Kanaan
  rationale: Die Richtungsendung wird durch „ins“ ausgedrückt; „Land Kanaan“ bewahrt das ausdrücklich genannte אֶרֶץ.
