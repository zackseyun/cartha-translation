  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: de
  text: 'Und nun: Seid nicht bekümmert und nicht zornig auf euch selbst[a], weil ihr mich hierher verkauft habt; denn um Leben zu erhalten[b], hat Gott mich euch vorausgesandt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Lasst es nicht in euren Augen brennen“; eine Redewendung für Zorn oder Missfallen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zur Erhaltung des Lebens“ oder „damit Menschen am Leben bleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlich-diskursiven Übergang von עַתָּה.
- source_word: אַל תֵּעָצְבוּ
  choice: Seid nicht bekümmert
  rationale: עצב bezeichnet hier seelischen Schmerz oder Betrübnis; „bekümmert“ ist verständlich, würdig und im Zusammenhang natürlich.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: und nicht zornig auf euch selbst
  rationale: Die wörtliche Wendung vom Brennen „in euren Augen“ ist ein Idiom für Zorn oder Missfallen. Im Kontext richtet sich dieses gegen die Brüder selbst.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: weil ihr mich hierher verkauft habt
  rationale: כִּי begründet die Aufforderung; הֵנָּה bezeichnet die Bewegung an den gegenwärtigen Ort und wird daher natürlich mit „hierher“ wiedergegeben.
- source_word: לְמִחְיָה
  choice: um Leben zu erhalten
  rationale: Das Substantiv bezeichnet Lebenserhaltung beziehungsweise Bewahrung am Leben; die Zweckformulierung gibt die Funktion von לְ klar wieder, ohne festzulegen, wessen Leben gemeint ist.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: hat Gott mich ... vorausgesandt
  rationale: Das deutsche Perfekt passt zur gegenwärtigen Deutung eines zurückliegenden Geschehens. „Gesandt“ wahrt die ausdrücklich aktive Zuschreibung an Gott.
- source_word: לִפְנֵיכֶם
  choice: euch voraus
  rationale: 'Gibt die räumliche und zeitliche Vorrangstellung idiomatisch wieder: Josef wurde vor der Ankunft seiner Brüder dorthin gesandt.'
theological_decisions:
- issue: Göttliche Vorsehung und menschliches Handeln
  choice: Sowohl die schuldhafte Handlung der Brüder („ihr mich ... verkauft habt“) als auch Gottes zielgerichtetes Handeln („hat Gott mich ... vorausgesandt“) bleiben ungeschmälert nebeneinander stehen.
  alternative: Das Verkaufen abschwächen oder Gottes Handeln lediglich als Zulassen ausdrücken.
  rationale: Der hebräische Text stellt beide Handlungsebenen ausdrücklich nebeneinander und löst ihre Spannung nicht auf.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der Doppelpunkt nach „Und nun“ markiert Josefs eindringlichen Übergang zur Aufforderung; das Semikolon hält menschliches und göttliches Handeln eng beieinander.
