  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: de
  text: Die Söhne Israels taten es. Josef gab ihnen auf Befehl des Pharaos Wagen und gab ihnen Reisevorrat mit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten es
  rationale: Gibt die hebräische Wendung knapp und idiomatisch wieder und verweist auf die zuvor erteilte Anweisung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bezeichnet im unmittelbaren Zusammenhang ausdrücklich die männlichen Nachkommen Jakobs beziehungsweise Israels.
- source_word: עֲגָלוֹת
  choice: Wagen
  rationale: Bezeichnet Fahrzeuge zum Transport von Personen und Gütern; „Wagen“ ist im Deutschen natürlich und kontextgerecht.
- source_word: עַל פִּי פַרְעֹה
  choice: auf Befehl des Pharaos
  rationale: Gibt die hebräische Redewendung wörtlich „nach dem Mund des Pharaos“ klar und idiomatisch als autoritative Anordnung wieder.
- source_word: צֵדָה לַדָּרֶךְ
  choice: Reisevorrat
  rationale: Die kompakte deutsche Zusammensetzung bezeichnet die für den Weg benötigte Verpflegung beziehungsweise Versorgung, ohne den Ausdruck unnötig auf Nahrung zu verengen.
theological_decisions: []
