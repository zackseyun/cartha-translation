  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: de
  text: 'Da sagte Josef zu seinen Brüdern: „Ich bin Josef! Lebt mein Vater noch?“ Doch seine Brüder konnten ihm nicht antworten, denn sie waren vor ihm bestürzt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn bei seinem Anblick erschraken sie“ beziehungsweise „denn seine Gegenwart versetzte sie in Schrecken“. Wörtlich steht hier eine hebräische Wendung mit „vor seinem Angesicht“; das Verb kann Bestürzung, Erschrecken oder Angst ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Da“ gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: אֶל bezeichnet hier die Adressaten der Rede; „Brüder“ entspricht dem familiären Kontext.
- source_word: אֲנִי יוֹסֵף
  choice: Ich bin Josef!
  rationale: Die ausdrückliche Selbstidentifikation wird direkt wiedergegeben. Das Ausrufezeichen vermittelt die dramatische Enthüllung, ohne dem Wortlaut eine zusätzliche Aussage hinzuzufügen.
- source_word: הַעוֹד אָבִי חָי
  choice: Lebt mein Vater noch?
  rationale: Die deutsche Wortstellung gibt die Frage nach dem Fortbestehen des Lebens idiomatisch und vollständig wieder.
- source_word: וְלֹא יָכְלוּ אֶחָיו לַעֲנוֹת אֹתוֹ
  choice: Doch seine Brüder konnten ihm nicht antworten
  rationale: „Doch“ bringt den sachlichen Gegensatz natürlich zum Ausdruck; יכל mit Infinitiv wird genau und idiomatisch durch „konnten … nicht“ wiedergegeben.
- source_word: כִּי נִבְהֲלוּ
  choice: denn sie waren … bestürzt
  rationale: Der Nifal von בהל bezeichnet starkes Erschrecken, Verstörtsein oder Bestürzung. „Bestürzt“ wahrt die Intensität, ohne die mögliche Bedeutung unnötig auf Todesangst einzuengen.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die knappe deutsche Wendung bewahrt das hebräische Bild von der unmittelbaren Gegenwart beziehungsweise dem Angesicht Josefs; die Bedeutungsbreite wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. „Josef“ folgt der im Deutschen üblichen biblischen Namensform. Die knappe Haupttextfassung erhält das hebräische Gegenwartsbild; die Fußnote macht dessen idiomatische und lexikalische Spannweite sichtbar.
