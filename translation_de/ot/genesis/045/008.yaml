source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: de
  text: 'Und nun: Nicht ihr habt mich hierhergeschickt, sondern Gott. Er hat mich zu einem Vater für den Pharao[a], zum Herrn über das ganze Haus des Pharao und zum Herrscher über das ganze Land Ägypten gemacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom „Vater“ kann hier einen hochgestellten Beschützer, Ratgeber oder Wohltäter bezeichnen.
    reason: Die wörtlich bewahrte hebräische Metapher אָב bezeichnet hier keine leibliche Vaterschaft, sondern Josefs einflussreiche und fürsorgliche Stellung gegenüber dem Pharao.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von וְ als auch die zeitliche und folgernde Diskursfunktion von עַתָּה knapp und natürlich wieder.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: Nicht ihr habt mich hierhergeschickt
  rationale: Die Voranstellung von „Nicht ihr“ bewahrt die Hervorhebung des ausdrücklichen Pronomens אַתֶּם; „hierher“ entspricht dem deiktischen הֵנָּה.
- source_word: כִּי הָאֱלֹהִים
  choice: sondern Gott
  rationale: 'Nach der Verneinung hat כִּי hier kontrastierende Kraft: nicht ihr, sondern Gott.'
- source_word: וַיְשִׂימֵנִי
  choice: Er hat mich … gemacht
  rationale: Das Perfekt bezeichnet Gottes vergangenes Handeln mit gegenwärtigem Ergebnis; die deutsche Satzklammer ermöglicht eine natürliche Reihung der drei Ämter.
- source_word: לְאָב לְפַרְעֹה
  choice: zu einem Vater für den Pharao
  rationale: Die Vatermetapher bleibt erhalten, ohne sie auf die engere Bedeutung „Berater“ zu reduzieren. „Für den Pharao“ vermeidet ein mögliches biologisches Missverständnis von „Vater des Pharaos“.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: zum Herrn über sein ganzes Haus
  rationale: „Herr“ gibt die übertragene Autorität von אָדוֹן wieder; „Haus“ bewahrt die Breite des hebräischen Ausdrucks für Haushalt, Hof und Besitzbereich.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: und zum Herrscher über das ganze Land Ägypten
  rationale: „Herrscher“ entspricht dem partizipialen מֹשֵׁל, ohne die Funktion unnötig auf einen bestimmten Verwaltungstitel wie „Statthalter“ einzuengen.
theological_decisions:
- issue: Göttliche Souveränität und menschliches Handeln
  choice: Die starke Gegenüberstellung „Nicht ihr …, sondern Gott“ bleibt erhalten.
  alternative: Eine abschwächende Formulierung, die entweder die Verantwortung der Brüder oder Gottes lenkendes Handeln ausdrücklich relativiert.
  rationale: Josef hebt hier Gottes entscheidendes, lenkendes Handeln hervor, obwohl der Zusammenhang das tatsächliche Handeln der Brüder nicht leugnet. Die Übersetzung bewahrt diese Spannung, ohne sie durch ein theologisches System auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die emphatische Wortstellung und die dreigliedrige Amtsbeschreibung des Hebräischen bleiben erhalten; die Vatermetapher wird im Haupttext nicht aufgelöst.
