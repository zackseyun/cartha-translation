  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: de
  text: Du sollst im Land Goschen wohnen und mir nahe sein – du und deine Söhne und die Söhne deiner Söhne, deine Schafe und Ziegen, deine Rinder und alles, was dir gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Du sollst … wohnen
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen beziehungsweise Sich-Niederlassen. „Wohnen“ ist im modernen Deutsch natürlich und bewahrt den Gedanken eines festen Aufenthalts.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: אֶרֶץ bezeichnet hier ein geografisches Gebiet. „Land Goschen“ gibt die hebräische Verbindung knapp und traditionsgemäß wieder.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: und mir nahe sein
  rationale: Die Verbindung aus היה und קָרוֹב drückt räumliche Nähe aus, die im Kontext zugleich persönliche Nähe ermöglicht. Die Übersetzung lässt diese beiden Aspekte offen.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֵי בָנֶיךָ
  choice: du und deine Söhne und deine Enkel
  rationale: Das selbstständige Pronomen leitet die erläuternde Aufzählung betont ein. בנים ist hier männlich, und בְּנֵי בָנֶיךָ bedeutet wörtlich „die Söhne deiner Söhne“; „Enkel“ ist die natürliche deutsche Entsprechung, ohne ein Geschlecht ausdrücklich zu ergänzen, das der deutsche Sammelbegriff nicht markiert.
- source_word: וְצֹאנְךָ
  choice: deine Schafe und Ziegen
  rationale: צֹאן ist ein Sammelbegriff für Kleinvieh, vor allem Schafe und Ziegen. Die ausdrückliche Benennung ist für heutige Leser klarer als „Kleinvieh“.
- source_word: וּבְקָרְךָ
  choice: deine Rinder
  rationale: בָּקָר bezeichnet Großvieh, besonders Rinder. „Rinder“ wahrt den Gegensatz zu den zuvor genannten Schafen und Ziegen.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: und alles, was dir gehört
  rationale: Die Wendung umfasst den gesamten Besitz Jakobs. „Alles, was dir gehört“ ist präzise und idiomatisch.
theological_decisions: []
