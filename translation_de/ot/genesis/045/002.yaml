  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: de
  text: Er weinte laut[a], und die Ägypter hörten es[b]; auch das Haus des Pharaos[c] hörte es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er gab seine Stimme im Weinen“; eine hebräische Ausdrucksweise für lautes Weinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ägypten hörte es“, wenn das Land beziehungsweise sein Volk kollektiv gemeint ist. Das Verb steht jedoch im Plural und spricht daher für „die Ägypter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „das Haus des Pharaos“. Gemeint sein können der königliche Haushalt oder der Hof des Pharaos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: brach er in lautes Weinen aus
  rationale: Die wörtliche Wendung „seine Stimme im Weinen geben“ ist ein hebräisches Idiom für lautes, hörbares Weinen. Die gewählte Formulierung gibt den Sinn natürlich und würdevoll wieder.
- source_word: וַיִּשְׁמְעוּ
  choice: hörten es
  rationale: שׁמע bezeichnet hier die Wahrnehmung des lauten Weinens; das Pronomen „es“ macht den Bezug im Deutschen klar.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Obwohl die Form auch „Ägypten“ bedeuten kann, spricht das pluralische Verb für die kollektive Personenbezeichnung „die Ägypter“.
- source_word: וַיִּשְׁמַע בֵּית פַּרְעֹה
  choice: auch im Haus des Pharaos wurde es bekannt
  rationale: Der singularische Verbalausdruck mit „Haus des Pharaos“ bezeichnet kollektiv den königlichen Haushalt oder Hof. Die unpersönliche deutsche Form wahrt diesen kollektiven Sinn und passt dazu, dass nicht bloß unmittelbare Schallwahrnehmung, sondern auch das Bekanntwerden gemeint sein kann.
