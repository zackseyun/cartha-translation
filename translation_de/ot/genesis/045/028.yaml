  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: de
  text: 'Da sagte Israel: »Genug![a] Mein Sohn Josef lebt noch. Ich will gehen und ihn sehen, bevor ich sterbe.«'
  philosophy: optimal-equivalence
  footnotes:
