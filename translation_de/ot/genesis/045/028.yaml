  source_fidelity: 'Die Übersetzung gibt den hebräischen Text vollständig und ohne sachliche Ergänzungen wieder: Israel bleibt als Name erhalten; רַב wird als knapper Ausruf der Genüge abgebildet; עוֹד ... חָי ist zutreffend mit „lebt noch“ wiedergegeben. „Ich will gehen“ vermittelt den entschlossenen Kohortativ angemessen, und „bevor ich sterbe“ trifft die temporale Aussage von בְּטֶרֶם אָמוּת.'
