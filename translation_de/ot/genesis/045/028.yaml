lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Der Wayyiqtol führt die Erzählung weiter; »Da sagte« gibt den Fortgang im modernen Deutschen natürlich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel und nicht Jakob.
- source_word: רַב
  choice: Genug!
  rationale: רַב ist hier ein knapper Ausruf der Genüge bzw. Gewissheit; »Genug!« bewahrt seine abrupte emotionale Kraft.
- source_word: עוֹד יוֹסֵף בְּנִי חָי
  choice: Mein Sohn Josef lebt noch
  rationale: עוֹד bezeichnet hier das Fortbestehen des Lebens; die Wortstellung klingt natürlich und bewahrt die familiäre Betonung.
- source_word: אֵלְכָה
  choice: Ich will gehen
  rationale: Die Kohortativform drückt Israels festen Entschluss aus, ohne eine Verpflichtung hinzuzufügen.
- source_word: וְאֶרְאֶנּוּ
  choice: und ihn sehen
  rationale: Direkte und idiomatische Wiedergabe des Verbs ראה mit maskulinem Objektsuffix.
- source_word: בְּטֶרֶם אָמוּת
  choice: bevor ich sterbe
  rationale: Klare Wiedergabe des temporalen Verhältnisses und der noch bevorstehenden Handlung.
