source:
  edition: WLC
  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: de
  text: Berichtet meinem Vater von all meinem Ansehen in Ägypten und von allem, was ihr gesehen habt.[a] Beeilt euch und bringt meinen Vater hierher hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von all meiner Herrlichkeit in Ägypten“. Das hebräische Wort kann Ansehen, Ehre, Herrlichkeit oder Pracht bezeichnen; hier geht es um Josefs hohe Stellung in Ägypten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: Berichtet
  rationale: Der Hifil von נגד bedeutet hier, etwas mitzuteilen oder zu berichten. „Berichtet“ passt zur Aufforderung, dem Vater ausführlich Nachricht zu geben.
- source_word: כָּל כְּבוֹדִי
  choice: all meinem Ansehen
  rationale: כבוד bezeichnet hier Josefs hohe Stellung, Würde und öffentliches Ansehen am ägyptischen Hof. „Ansehen“ ist im Deutschen natürlich und vermeidet unnötig religiöse Untertöne von „Herrlichkeit“.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Die Präpositionalverbindung ist eindeutig örtlich zu verstehen.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: allem, was ihr gesehen habt
  rationale: Die Formulierung gibt die umfassende Aussage des Hebräischen idiomatisch und zugleich eng am Wortlaut wieder.
- source_word: וּמִהַרְתֶּם
  choice: Beeilt euch
  rationale: Das Verb drückt eine dringliche Aufforderung aus; der deutsche Imperativ bewahrt diese Dringlichkeit.
- source_word: וְהוֹרַדְתֶּם
  choice: bringt ... hinab
  rationale: Der Hifil von ירד bedeutet „hinabbringen“. Die Richtungsangabe wird bewahrt, da Reisen nach Ägypten in Genesis regelmäßig als Hinabziehen beschrieben werden.
- source_word: הֵנָּה
  choice: hierher
  rationale: Das deiktische Adverb bezeichnet eine Bewegung zum Aufenthaltsort des Sprechers; „hierher“ gibt Zielrichtung und Perspektive präzise wieder.
theological_decisions:
- issue: Bedeutung von כָּבוֹד im Blick auf Josef
  choice: Ansehen
  alternative: Herrlichkeit
  rationale: Der Kontext spricht von Josefs erhöhter gesellschaftlicher und amtlicher Stellung in Ägypten. „Herrlichkeit“ ist lexikalisch möglich, kann im heutigen Deutschen jedoch stärker religiös oder majestätisch klingen; die Alternative wird deshalb in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „von“ bildet die beiden parallelen Objekte des hebräischen Verbs klar ab. „Hierher hinab“ bewahrt sowohl das Ziel beim Sprecher als auch die im Hebräischen ausdrücklich bezeichnete Abwärtsbewegung.
