  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: de
  text: Und sorgt euch nicht um euren Besitz[a], denn das Beste des ganzen Landes Ägypten gehört euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Euer Auge soll euren Besitz nicht schonen«; gemeint ist, dass sie dem zurückgelassenen Besitz nicht bedauernd nachsehen oder sich um ihn sorgen sollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס עַל
  choice: Und trauert … nicht nach
  rationale: Die hebräische Wendung lässt wörtlich das »Auge« den Besitz schonen beziehungsweise mitleidig ansehen. Im Zusammenhang fordert sie dazu auf, dem zurückgelassenen Eigentum nicht bedauernd nachzusehen. »Trauert … nicht nach« gibt diesen Sinn in natürlichem modernem Deutsch wieder; das Bild wird in der Fußnote bewahrt.
- source_word: כְּלֵיכֶם
  choice: eurem Besitz
  rationale: כְּלִי kann Geräte, Gegenstände, Hausrat oder sonstiges Eigentum bezeichnen. »Besitz« ist hier weit genug und passt zum bevorstehenden Umzug.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die vorangehende Aufforderung ein.
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: das Beste des ganzen Landes Ägypten
  rationale: טוּב bezeichnet hier konkret das Beste beziehungsweise die guten Erzeugnisse und Güter, die das gesamte Land zu bieten hat, nicht abstrakte Güte.
- source_word: לָכֶם הוּא
  choice: gehört euch
  rationale: Die Konstruktion mit ל und Pronomen drückt hier nachdrücklich Zugehörigkeit beziehungsweise Verfügbarkeit für die Angesprochenen aus.
