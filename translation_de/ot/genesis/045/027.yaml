base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: de
  text: Und sie berichteten ihm alle Worte Josefs, die er zu ihnen gesagt hatte, und er sah die Wagen, die Josef geschickt hatte, um ihn zu holen. Da lebte der Geist ihres Vaters Jakob wieder auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da kehrte die Lebenskraft ihres Vaters Jakob zurück.“'
    reason: Die hebräische Wendung kann bildhaft das Wiederaufleben von Kraft, Mut und Lebensfreude bezeichnen.
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף
  choice: Und sie berichteten ihm alles, was Josef … gesagt hatte
  rationale: „Berichteten“ gibt den Mitteilungsakt von דבר אל im Kontext natürlich wieder. „Alles, was Josef … gesagt hatte“ überträgt כָּל דִּבְרֵי idiomatisch, ohne Inhalt hinzuzufügen.
- source_word: אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: was Josef zu ihnen gesagt hatte
  rationale: Das Plusquamperfekt kennzeichnet im Deutschen die Worte Josefs als dem Bericht der Brüder vorausgehend; „zu ihnen gesagt“ ist natürlich und wahrt den Bezug auf die Adressaten.
- source_word: הָעֲגָלוֹת
  choice: die Wagen
  rationale: עֲגָלוֹת bezeichnet Transportfahrzeuge; „Wagen“ ist im Deutschen sachlich, verständlich und für den erzählten Zusammenhang passend.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: die Josef geschickt hatte, um ihn zu holen
  rationale: נשא bedeutet wörtlich „tragen/befördern“. Bei Wagen bezeichnet die Wendung hier den Zweck, Jakob abzuholen und zu transportieren; „um ihn zu holen“ ist natürliches Deutsch.
- source_word: וַתְּחִי רוּחַ
  choice: lebte der Geist … wieder auf
  rationale: Die Formulierung bewahrt das Lebensmotiv von חיה und gibt zugleich die idiomatische Bedeutung erneuerter Lebenskraft beziehungsweise neuen Mutes wieder.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: ihres Vaters Jakob
  rationale: Die deutsche Namensform „Jakob“ ist die etablierte Wiedergabe des hebräischen יַעֲקֹב; die Genitivfügung klingt im Satz natürlich.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Wendung וַתְּחִי רוּחַ
  choice: Geist … lebte wieder auf
  alternative: Lebensmut/Lebenskraft kehrte zurück
  rationale: „Geist“ lässt die semantische Weite von רוּחַ bestehen und bewahrt die Bildsprache des Hebräischen, ohne die Wendung auf eine psychologische oder physiologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange hebräische Satzkette ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
