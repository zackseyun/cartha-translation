  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: de
  text: Gott sandte mich vor euch her, um euch einen Rest im Land zu erhalten[a] und euch durch eine große Rettung am Leben zu erhalten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um euch Überlebende im Land zu erhalten“ beziehungsweise „um eure Nachkommenschaft im Land zu bewahren“. Das hebräische Wort kann einen Rest, Überlebende oder die fortbestehende Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und euch am Leben zu erhalten, sodass viele von euch überleben“. Die hebräische Wendung kann eine große Rettung beziehungsweise ein großes Entrinnen oder die daraus hervorgehenden Überlebenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: sandte mich
  rationale: Das Wayyiqtol führt die Erzählung in der Vergangenheit fort. Das schlichte Präteritum entspricht dem hebräischen Erzählstil und klingt im Deutschen würdig und natürlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier eindeutig den einen Gott, dessen Wirken Josef in den Ereignissen erkennt.
- source_word: לִפְנֵיכֶם
  choice: vor euch her
  rationale: Die Wendung bedeutet wörtlich „vor euch“ und bezeichnet hier, dass Josef zeitlich früher nach Ägypten gelangte. „Vor euch her“ bewahrt zugleich das räumliche Bild.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: um euch … einen Rest zu erhalten
  rationale: שׂים bedeutet grundsätzlich „setzen, hinstellen, bestimmen“; mit שְׁאֵרִית bezeichnet die Wendung hier Gottes Absicht, für Josefs Familie einen überlebenden Rest bestehen zu lassen. „Erhalten“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: שְׁאֵרִית
  choice: einen Rest
  rationale: „Rest“ bewahrt die Grundbedeutung dessen, was übrig bleibt, sowie die biblische Motivsprache. Im Kontext sind die Überlebenden beziehungsweise die fortbestehende Nachkommenschaft gemeint.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang mit der Hungersnot und Ägypten ist der örtliche Sinn „Land“ naheliegend.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: und euch … am Leben zu bewahren
  rationale: Der Hifil von חיה bedeutet „am Leben erhalten“. Die deutsche Formulierung ist gegenwärtig, klar und eng am hebräischen Sinn.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: als eine große Schar Geretteter
  rationale: פְּלֵיטָה kann sowohl die Rettung beziehungsweise das Entrinnen als auch die Entronnenen bezeichnen. Im Parallelismus mit dem Bewahren des Lebens lässt sich die Wendung natürlich auf die große Zahl der Überlebenden beziehen; die Ereignislesart bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Ob שְׁאֵרִית als „Rest“, „Überlebende“ oder „Nachkommenschaft“ wiederzugeben ist
  choice: Rest
  alternative: Überlebende; Nachkommenschaft
  rationale: „Rest“ ist lexikalisch nah am Hebräischen und bewahrt die innerbiblische Motivsprache, ohne den unmittelbaren Bezug auf das Überleben von Jakobs Familie zu verdecken.
- issue: Ob לִפְלֵיטָה גְּדֹלָה die Geretteten oder den Vorgang beziehungsweise das Ergebnis der Rettung bezeichnet
  choice: eine große Schar Geretteter
  alternative: eine große Rettung; ein großes Entrinnen
  rationale: Das Nomen lässt beide Deutungen zu. Die personenbezogene Wiedergabe passt unmittelbar zu „euch am Leben zu bewahren“ und ergibt natürliches modernes Deutsch; die sachbezogene Deutung wird ausdrücklich als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor euch her“ bewahrt das Bild des hebräischen Ausdrucks; „Rest“ erhält seine biblische Resonanz. Die etwas erklärendere Formulierung „eine große Schar Geretteter“ sorgt im Haupttext für Verständlichkeit, während die sachbezogene Deutung in der Fußnote offenbleibt.
