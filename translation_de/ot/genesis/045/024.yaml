  text: וַ/יְשַׁלַּ֥ח אֶת אֶחָ֖י/ו וַ/יֵּלֵ֑כוּ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַֽל תִּרְגְּז֖וּ בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: de
  text: 'Dann ließ er seine Brüder ziehen, und sie brachen auf. Er sagte zu ihnen: »Streitet euch nicht unterwegs.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid unterwegs nicht aufgeregt«, »nicht zornig« oder »nicht ängstlich«. Das hebräische Verb kann verschiedene Arten innerer Erregung bezeichnen. »Streitet euch nicht« passt zum unmittelbaren Zusammenhang der Brüder, die nach Josefs Offenbarung gemeinsam nach Hause reisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: ließ ... ziehen
  rationale: Das Piel von שׁלח bezeichnet hier, dass Josef seine Brüder aus seiner Gegenwart entlässt und auf den Weg schickt. „Ließ ... ziehen“ ist natürlich und erfasst den Aufbruchskontext.
- source_word: אֶת־אֶחָיו
  choice: seine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung entspricht dem Erzählzusammenhang.
- source_word: וַיֵּלֵכוּ
  choice: sie brachen auf
  rationale: הלך bedeutet grundsätzlich „gehen“; nach dem Entlassen der Brüder gibt „brachen auf“ die fortschreitende Handlung idiomatisch wieder.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Er sagte zu ihnen
  rationale: Transparente Wiedergabe der üblichen hebräischen Redeeinleitung.
- source_word: אַל
  choice: nicht
  rationale: Die Negationspartikel mit der folgenden Verbform drückt hier ein Verbot beziehungsweise eine warnende Aufforderung aus.
- source_word: תִּרְגְּזוּ
  choice: streitet euch
  rationale: רגז kann unterschiedliche Formen innerer oder äußerer Erregung bezeichnen, darunter Zittern, Angst, Zorn und Unruhe. Im Zusammenhang der gemeinsam heimreisenden Brüder passt die zwischenmenschliche Bedeutung „streiten“ gut; die echte lexikalische Mehrdeutigkeit bleibt in der Fußnote erhalten.
- source_word: בַּדָּרֶךְ
  choice: unterwegs
  rationale: דרך bezeichnet hier den Weg beziehungsweise die Reise nach Kanaan; „unterwegs“ ist im Deutschen knapp und idiomatisch.
theological_decisions:
- issue: Art der von Josef untersagten Erregung
  choice: Streitet euch nicht unterwegs
  alternative: Seid unterwegs nicht aufgeregt / zornig / ängstlich
  rationale: Der hebräische Ausdruck legt die genaue Art der Erregung nicht eindeutig fest. Der unmittelbare Erzählzusammenhang macht gegenseitigen Streit plausibel, doch alternative Bedeutungen werden nicht ausgeschlossen und deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren das Erzähltempo; „unterwegs“ und „streitet euch nicht“ sind allgemein verständlich. Die Fußnote bewahrt die semantische Breite des hebräischen Verbs.
