  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: de
  text: Dort werde ich dich versorgen, denn noch fünf Jahre wird Hungersnot herrschen, damit du nicht samt deinem Haus und allem, was dir gehört, verarmst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: Dort werde ich dich versorgen
  rationale: Das Verb כלכל bezeichnet hier das Unterhalten beziehungsweise Versorgen mit dem Lebensnotwendigen; die direkte Anrede im Singular bleibt erhalten.
- source_word: כִּי עוֹד חָמֵשׁ שָׁנִים רָעָב
  choice: denn die Hungersnot wird noch fünf Jahre dauern
  rationale: Die nominale hebräische Wendung wird in natürlichem Deutsch verbal wiedergegeben; כִּי begründet Josefs Zusage.
- source_word: פֶּן תִּוָּרֵשׁ
  choice: Sonst verarmst du
  rationale: פֶּן bezeichnet die abzuwendende Folge; ירשׁ im Nifal bedeutet hier verarmen beziehungsweise mittellos werden.
- source_word: אַתָּה וּבֵיתְךָ וְכָל אֲשֶׁר לָךְ
  choice: du samt deinem Haus und allem, was dir gehört
  rationale: „Haus“ bewahrt die konkrete und zugleich haushaltsbezogene Ausdrucksweise des Hebräischen; „samt“ verbindet den singularischen Verbbezug idiomatisch mit den Mitbetroffenen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Zusage und die anschließende Warnung bleiben erhalten; „Haus“ wahrt die mögliche Breite von Familie und Hausgemeinschaft.
