lexical_decisions:
- source_word: וַיִּפֹּל עַל צַוְּארֵי
  choice: Dann fiel er … um den Hals
  rationale: Die Wendung bezeichnet eine Umarmung am Hals. „Jemandem um den Hals fallen“ ist im modernen Deutschen idiomatisch und bewahrt zugleich das konkrete Verb נפל.
- source_word: בִנְיָמִן אָחִיו
  choice: seinem Bruder Benjamin
  rationale: Die natürliche deutsche Wortstellung erhält die ausdrückliche Bezeichnung Benjamins als Bruder.
- source_word: וַיֵּבְךְּ
  choice: und weinte
  rationale: בכה bezeichnet Weinen; die schlichte Wiedergabe passt zum würdevollen Erzählton.
- source_word: וּבִנְיָמִן
  choice: auch Benjamin
  rationale: Das deutsche „auch“ gibt in diesem Zusammenhang natürlich wieder, dass Benjamin seinerseits weinte, ohne eine sachfremde Hervorhebung einzutragen.
- source_word: בָּכָה עַל צַוָּארָיו
  choice: weinte an seinem Hals
  rationale: Die Formulierung hält die Körperangabe des Hebräischen fest und macht deutlich, dass Benjamin Joseph umarmte.
