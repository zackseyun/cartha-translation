source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: de
  text: Denn seit zwei Jahren herrscht die Hungersnot im Land, und noch fünf Jahre stehen bevor, in denen weder gepflügt noch geerntet wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Josefs Begründung dafür ein, dass Gott ihn vorausgesandt hat, und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: זֶה שְׁנָתַיִם
  choice: seit zwei Jahren
  rationale: Die hebräische Wendung bezeichnet idiomatisch den bis zur Gegenwart verstrichenen Zeitraum von zwei Jahren.
- source_word: הָרָעָב
  choice: die Hungersnot
  rationale: Der bestimmte Ausdruck verweist auf die im Erzählzusammenhang bereits bekannte Hungersnot.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: im Land
  rationale: בְּקֶרֶב bedeutet wörtlich »inmitten«, dient hier aber natürlich zur räumlichen Angabe innerhalb des betroffenen Landes; »im Land« ist im Deutschen klar und idiomatisch.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: und es kommen noch fünf Jahre
  rationale: Bringt verständlich zum Ausdruck, dass vom Standpunkt des Sprechers weitere fünf Jahre bevorstehen.
- source_word: אֲשֶׁר אֵין
  choice: in denen weder … noch … wird
  rationale: Der Relativsatz beschreibt die noch kommenden Jahre; die deutsche Zukunftsbedeutung ergibt sich im Zusammenhang trotz Präsensform.
- source_word: חָרִישׁ
  choice: gepflügt
  rationale: Bezeichnet das Pflügen beziehungsweise die Bodenbestellung; die verbale Form klingt in der Paarung natürlich.
- source_word: קָצִיר
  choice: geerntet
  rationale: Bezeichnet Ernte beziehungsweise Ernten und bildet mit »gepflügt« eine klare, idiomatische Paarung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Zeitangabe »seit zwei Jahren« und die aktive Zustandsformulierung »herrscht« geben den hebräischen Sinn natürlich wieder; die landwirtschaftliche Wortpaarung bleibt konkret erhalten.
