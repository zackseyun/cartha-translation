revisions:
- from: Und er küsste alle seine Brüder und weinte an ihnen. Danach redeten seine Brüder mit ihm.
  to: Und er küsste alle seine Brüder und weinte über ihnen. Danach redeten seine Brüder mit ihm.
  rationale: Eine sichere sprachliche Korrektur ersetzt das unidiomatische „an ihnen“ durch „über ihnen“. Die übrige Übersetzung folgt dem hebräischen Satzbau und Sinngehalt natürlich und präzise; eine Fußnote ist nicht erforderlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:05:14Z'
review_pass:
  verdict: revise
  source_fidelity: Der hebräische Text besagt, dass Josef alle seine Brüder küsste und über/auf ihnen weinte. Das direkte Objekt von „weinen“ wird im Deutschen nicht mit „an“ wiedergegeben. „Über ihnen weinte“ erhält die räumlich-körperliche Bildlichkeit von עֲלֵיהֶם, ohne eine Umarmung hinzuzufügen.
  naturalness: „An ihnen weinte“ ist im modernen Standarddeutsch unidiomatisch und kann missverständlich sein. „Weinte über ihnen“ ist verständlich, narrativ angemessen und dem Bild des Ausgangstextes nahe. „Danach redeten ... mit ihm“ ist natürlich, wenn auch „sprachen“ etwas gehobener wäre.
  terminology: „Brüder“, „küsste“ und „weinte“ sind treffend. „Redeten mit ihm“ gibt דִּבְּרוּ ... אִתּוֹ angemessen als wechselseitiges Sprechen wieder. Keine theologisch belasteten Begriffe liegen vor.
  issues:
  - severity: medium
    issue: „weinte an ihnen“
    rationale: Diese Verbindung ist im modernen Standarddeutsch nicht idiomatisch und gibt עֲלֵיהֶם nicht klar wieder. Der Ausdruck beschreibt hier das Weinen Josefs über seinen Brüdern in körperlicher Nähe; „weinte über ihnen“ bewahrt dies am besten.
  revised_text: Und er küsste alle seine Brüder und weinte über ihnen. Danach redeten seine Brüder mit ihm.
  revised_footnotes: []
