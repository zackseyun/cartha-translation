  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: de
  text: Und er küsste alle seine Brüder und weinte über ihnen. Danach redeten seine Brüder mit ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: er küsste
  rationale: Das Piel von נשׁק bezeichnet hier den liebevollen Kuss im Rahmen der Versöhnung. „Er küsste“ ist im Deutschen natürlich und vermeidet eine unbelegte Hervorhebung wiederholter Küsse.
- source_word: לְכָל אֶחָיו
  choice: alle seine Brüder
  rationale: כָּל mit dem Plural umfasst die Gesamtheit von Josefs Brüdern; „alle seine Brüder“ gibt dies idiomatisch wieder.
- source_word: וַיֵּבְךְּ
  choice: und weinte
  rationale: בכה bedeutet „weinen“ oder „klagen“; „weinte“ entspricht dem emotionalen und zugleich würdigen Ton der Versöhnungsszene.
- source_word: עֲלֵיהֶם
  choice: an ihnen
  rationale: עַל kann hier körperliche Nähe beim Weinen ausdrücken. „An ihnen weinen“ bewahrt diese Vorstellung im Deutschen natürlicher als das missverständliche „über sie weinen“.
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung markiert die zeitliche Abfolge knapp und klar.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: seine Brüder redeten mit ihm
  rationale: דבר mit אֵת bezeichnet hier ein Reden mit jemandem und legt in diesem Versöhnungskontext ein Gespräch nahe. „Redeten mit ihm“ klingt im modernen Deutschen natürlicher als „sprachen mit ihm“.
