  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: de
  text: 'Und seht: Eure Augen und die Augen meines Bruders Benjamin sehen, dass es mein Mund ist, der zu euch spricht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „… dass mein Mund der zu euch Sprechende ist.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und seht
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das unmittelbar Wahrnehmbare. „Seht“ ist im modernen Deutsch natürlich und bewahrt die deiktische Eindringlichkeit.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: Eure eigenen Augen sehen es
  rationale: Die konkrete Körperteilformulierung bleibt erhalten und betont die unmittelbare Bestätigung durch eigene Wahrnehmung. „eigenen“ gibt den emphatischen Sinn im Deutschen idiomatisch wieder; „es“ ergänzt das im Deutschen erwartete Objekt.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: ebenso die Augen meines Bruders Benjamin
  rationale: Die elliptische Fortführung des Verbs „sehen“ und die parallele Nennung der Augen bleiben erkennbar; „ebenso“ macht die Koordination im Deutschen klar.
- source_word: כִּי
  choice: ':'
  rationale: כִּי führt hier den Inhalt dessen ein, was die Augen feststellen. Ein Doppelpunkt gibt diese erläuternde Beziehung im Deutschen natürlicher wieder als ein schwerfälliger dass-Satz.
- source_word: פִי
  choice: Mein eigener Mund
  rationale: Die konkrete hebräische Wendung „mein Mund“ wird bewahrt, weil sie Josephs persönliches Sprechen im Gegensatz zu einem Dolmetscher hervorhebt. „eigener“ verdeutlicht diese Emphase, ohne die Aussage zu paraphrasieren.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: spricht zu euch
  rationale: Das substantivierte Partizip bezeichnet das gegenwärtige, unmittelbare Sprechen. Das deutsche Präsens gibt dies klar und natürlich wieder.
