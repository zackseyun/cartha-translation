  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: de
  text: 'Da sagte Josef zu seinen Brüdern: „Kommt doch näher zu mir!“ Sie kamen näher. Da sagte er: „Ich bin Josef, euer Bruder, den ihr nach Ägypten verkauft habt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: אֶל־אֶחָיו
  choice: zu seinen Brüdern
  rationale: אָח im Plural mit Suffix der 3. Person Singular bezeichnet eindeutig Josefs Brüder.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Kommt doch näher zu mir
  rationale: נגשׁ bezeichnet das Herantreten oder Näherkommen; נָא mildert die Aufforderung ab. Das deutsche „doch“ vermittelt hier eine eindringliche, freundliche Bitte natürlicher als ein förmliches „bitte“.
- source_word: וַיִּגָּשׁוּ
  choice: Sie kamen näher
  rationale: Die Wiederholung von „näher“ bewahrt die sprachliche Entsprechung zwischen Aufforderung und Reaktion im Hebräischen.
- source_word: אֲנִי יוֹסֵף
  choice: Ich bin Josef
  rationale: Der hebräische Nominalsatz wird im Deutschen idiomatisch mit der Kopula „bin“ wiedergegeben; „Josef“ ist die etablierte deutsche Namensform.
- source_word: אֲחִיכֶם
  choice: euer Bruder
  rationale: Der Singular mit Suffix der 2. Person Plural bezeichnet Josef als den Bruder aller Angesprochenen.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: den ihr ... verkauft habt
  rationale: Der Relativsatz bleibt direkt und anklagend; das maskuline Akkusativpronomen „den“ bezieht sich eindeutig auf Josef als Bruder.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Das direktionale He bezeichnet die Bewegung zum Ziel Ägypten. Bei Ländernamen ohne Artikel ist „nach Ägypten“ die natürliche deutsche Richtungsangabe.
