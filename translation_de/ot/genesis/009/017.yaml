  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: de
  text: 'Und Gott sagte zu Noah: »Dies ist das Zeichen des Bundes, den ich zwischen mir und allem Fleisch[a] auf der Erde aufgerichtet habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »allen Lebewesen«. Wörtlich: »allem Fleisch«; der hebräische Ausdruck bezeichnet hier umfassend das beseelte irdische Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Narrativ-Waw führt die Erzählung weiter. »Und … sagte« bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier den einen Gott, der zu Noah spricht; »Gott« ist die sachgemäße Standardwiedergabe.
- source_word: אֶל נֹחַ
  choice: zu Noah
  rationale: Die Präposition bezeichnet den Adressaten; »Noah« entspricht der etablierten deutschen Namensform.
- source_word: זֹאת
  choice: Dies ist
  rationale: Das Demonstrativpronomen eröffnet einen Identifikationssatz; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: אוֹת
  choice: Zeichen
  rationale: אוֹת bezeichnet ein wahrnehmbares Zeichen oder Kennzeichen und passt zum Bundeszeichen des vorausgehenden Zusammenhangs.
- source_word: הַבְּרִית
  choice: des Bundes
  rationale: בְּרִית ist der feste biblische Begriff für eine verbindliche Bundesbeziehung; der Genitiv ist nach »Zeichen« idiomatisch.
- source_word: הֲקִמֹתִי
  choice: aufgerichtet habe
  rationale: Das Hifil von קום bezeichnet bei einem Bund dessen Aufrichtung beziehungsweise Bestätigung. »Aufgerichtet habe« wahrt die etablierte biblische Ausdrucksweise und die abgeschlossene Handlung mit fortdauernder Geltung.
- source_word: בֵּינִי וּבֵין
  choice: zwischen mir und
  rationale: Die Wendung bezeichnet die beiden Seiten der Bundesbeziehung und lässt sich direkt und natürlich wiedergeben.
- source_word: כָּל בָּשָׂר
  choice: allem Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die breite und leicht spannungsvolle hebräische Bezeichnung für beseeltes irdisches Leben, ohne sie auf Menschen einzuengen.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Relativbestimmung wird im Deutschen kompakt an »alles Fleisch« angeschlossen. »Erde« entspricht dem universalen Zusammenhang besser als »Land«.
theological_decisions:
- issue: Umfang von כָּל בָּשָׂר im Noahbund
  choice: alles Fleisch
  alternative: alle Lebewesen; alle Menschen
  rationale: Der Ausdruck umfasst im Kontext mehr als die Menschheit. Die formnahe Wiedergabe erhält diese Weite und vermeidet eine theologische Verengung; die Fußnote erläutert den heutigen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. »Alles Fleisch« wird wegen seiner quellengetreuen theologischen Weite im Haupttext beibehalten und durch eine verständliche Fußnote erschlossen.
