  yaml_path: translation/ot/genesis/009/029.yaml
  text: So all the days of Noah were nine hundred and fifty years, and he died.
translation:
  language: de
  text: So betrug Noahs gesamte Lebenszeit neunhundertfünfzig Jahre; und er starb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: So betrug Noahs gesamte Lebenszeit
  rationale: Die hebräische Zusammenfassungsformel bezeichnet die Gesamtzahl von Noahs Lebenstagen. Die natürliche deutsche Wiedergabe bewahrt den summierenden Charakter, ohne das weniger idiomatische »alle Tage Noahs waren« nachzuahmen.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: neunhundertfünfzig Jahre
  rationale: Das Hebräische verbindet »neunhundert Jahre« und »fünfzig Jahre« koordinierend; im modernen Standarddeutsch wird die Gesamtzahl idiomatisch als ein Zahlwort wiedergegeben.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Das Verb schließt die Lebensnotiz narrativ ab. »Dann« gibt die fortschreitende Funktion des וַ wieder, und das im Deutschen notwendige Pronomen bezieht sich eindeutig auf Noah.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem genealogischem Stil. Die semikolonische Gliederung markiert den Übergang von der Zusammenfassung der Lebenszeit zum Tod.
