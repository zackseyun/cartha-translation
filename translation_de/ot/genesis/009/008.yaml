  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: de
  text: 'Dann sagte Gott zu Noah und zu seinen Söhnen, die bei ihm waren:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Dann sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier bezeichnet אֱלֹהִים den einen Gott, der zu Noah spricht; „Gott“ ist die eindeutige Standardwiedergabe.
- source_word: אֶל־נֹחַ
  choice: zu Noah
  rationale: אֶל kennzeichnet hier den Adressaten der Rede; der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: וְאֶל־בָּנָיו
  choice: und zu seinen Söhnen
  rationale: Die Verbindung koordiniert die weiteren Adressaten; בָּנִים bezeichnet hier ausdrücklich Noahs männliche Nachkommen.
- source_word: אִתּוֹ
  choice: die bei ihm waren
  rationale: Die attributive Wiedergabe macht im Deutschen natürlich und eindeutig, dass sich die Wendung auf Noahs Söhne bezieht.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt dieselbe Diskursfunktion natürlicher als das schwerfällige „und sprach“ oder „indem er sagte“.
