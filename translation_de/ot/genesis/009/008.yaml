  source_fidelity: 'Die Übersetzung gibt sämtliche Sinnelemente des Hebräischen angemessen wieder: die erzählfortführende Verbform („Dann sagte“), Gott als Sprecher, Noah und seine Söhne als Adressaten sowie die nähere Bestimmung אִתּוֹ („die bei ihm waren“). Der Doppelpunkt leitet die folgende Rede idiomatisch ein und erfüllt die Funktion von לֵאמֹר ohne unnötige Schwerfälligkeit.'
  naturalness: „Dann sagte Gott zu Noah und zu seinen Söhnen, die bei ihm waren:“ ist natürliches, modernes Standarddeutsch. Der Relativsatz ist klar auf die Söhne bezogen und bewahrt die knappe, würdevolle Erzählprosa.
