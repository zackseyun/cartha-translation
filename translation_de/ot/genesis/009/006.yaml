id: GEN.9.6
reference: Genesis 9:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: de
  text: Wer das Blut eines Menschen vergießt, dessen Blut wird durch Menschen vergossen[a]; denn Gott hat den Menschen als sein Bild gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „dessen Blut soll durch Menschen vergossen werden“. Das Hebräische kann hier als feierliche Feststellung oder als rechtliche Setzung verstanden werden.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Wer … vergießt
  rationale: Das Qal-Partizip formuliert eine allgemeine, sprichwortartig-rechtliche Aussage. Die deutsche Konstruktion „Wer …“ gibt diese generische Funktion natürlich wieder.
- source_word: דַּם הָאָדָם
  choice: das Blut eines Menschen
  rationale: „Blut vergießen“ ist die sachlich und stilistisch entsprechende deutsche Wendung für gewaltsames Töten. הָאָדָם bezeichnet hier einen Menschen im allgemeinen Sinn.
- source_word: בָּאָדָם
  choice: durch Menschen
  rationale: Die Präposition ב wird instrumental beziehungsweise agentiv verstanden. Der Plural „Menschen“ macht den generischen Sinn im Deutschen deutlich, ohne die Aussage auf Männer zu beschränken.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: dessen Blut wird … vergossen
  rationale: Der pronominale Bezug wird durch „dessen“ klar aufgenommen; das Nifal wird passiv wiedergegeben. „Wird“ wahrt gegenüber „soll“ die formale Offenheit zwischen Feststellung und rechtlicher Setzung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung der vorausgehenden Aussage ein.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: als Gottes Bild
  rationale: Diese idiomatische deutsche Formulierung bewahrt die Aussage, dass der Mensch Gottes Bild ist, ohne das weniger natürliche „im Bild Gottes“ zu erzwingen.
- source_word: עָשָׂה אֶת־הָאָדָם
  choice: hat er den Menschen gemacht
  rationale: עָשָׂה bedeutet hier „machen“. „Den Menschen“ bezeichnet die Menschheit repräsentativ und stellt den Bezug zu den vorherigen Vorkommen von אָדָם her.
theological_decisions:
- issue: Bedeutung von אָדָם in der Rechtssentenz
  choice: Mensch beziehungsweise Menschen
  alternative: Mann
  rationale: אָדָם ist hier generisch und bezeichnet einen Menschen beziehungsweise die Menschheit, nicht ausschließlich männliche Personen. Das moderne Deutsche gibt diesen Umfang mit „Mensch“ präzise wieder.
- issue: Menschliche Mitwirkung oder bloße Vorhersage der Vergeltung
  choice: durch Menschen
  alternative: unter Menschen
  rationale: Die agentive beziehungsweise instrumentale Deutung von בָּאָדָם passt am besten zur Syntax. Der Text benennt damit Menschen als Ausführende, ohne die Aussage zu einem ausgearbeiteten Lehrsatz über staatliche Strafgewalt zu erweitern.
- issue: Modalität von יִשָּׁפֵךְ
  choice: wird vergossen
  alternative: soll vergossen werden
  rationale: Das hebräische Imperfekt enthält kein eigenes Wort für „sollen“. Die Hauptfassung lässt die Spannung zwischen feierlicher Feststellung und rechtlicher Setzung bestehen; die mögliche modale Wiedergabe wird in der Fußnote genannt.
- issue: Formulierung der Gottebenbildlichkeit
  choice: als Gottes Bild hat er den Menschen gemacht
  alternative: im Bild Gottes hat er den Menschen gemacht
  rationale: Die gewählte Form ist natürliches Deutsch und wahrt die theologische Aussage des hebräischen בְּצֶלֶם אֱלֹהִים, ohne sie auszudeuten.
translation_notes:
  register: Knapp, feierlich und rechtsspruchartig. „Mensch“ wird im heutigen generischen Sinn verwendet; die wiederholte Blutvergießen-Formulierung bewahrt den Parallelismus des Hebräischen.
