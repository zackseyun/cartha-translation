    rationale: 'Das Hebräische nennt אֱלֹהִים als ausdrückliches Subjekt: „denn im Bild Gottes machte er den Menschen“. Da im deutschen Vordersatz nur „Gottes“ im Genitiv steht, ist „er“ stilistisch und referenziell unnötig unklar. Gott sollte als Subjekt genannt werden.'
