revisions:
- from: Wer das Blut eines Menschen vergießt, dessen Blut wird durch Menschen vergossen[a]; denn als Gottes Bild hat er den Menschen gemacht.
  to: Wer das Blut eines Menschen vergießt, dessen Blut wird durch Menschen vergossen[a]; denn Gott hat den Menschen als sein Bild gemacht.
  rationale: Die Revision benennt Gott ausdrücklich als Handelnden und ersetzt damit das im Deutschen unklar anschließende „er“. Die Aussage, dass der Mensch Gottes Bild ist, sowie die knappe, rechtsspruchartige Struktur bleiben erhalten. Die bestehende Fußnote bleibt sachgerecht am passiven Imperfekt verankert.
