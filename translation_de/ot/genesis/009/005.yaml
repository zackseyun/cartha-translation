revisions:
- from: Doch euer Blut, das heißt euer Leben, werde ich einfordern.[a] Von jedem Tier werde ich es einfordern und vom Menschen – von einem jeden für das Leben seines Bruders – werde ich das Leben des Menschen einfordern.[b]
  to: Doch euer Blut für euer Leben werde ich einfordern.[a] Von jedem Tier werde ich es einfordern und vom Menschen – von jedem Menschen, seinem Bruder – werde ich das Leben des Menschen einfordern.[b]
  rationale: Die Revision bewahrt die zwei im Hebräischen genannten Begriffe „Blut“ und „Leben“, ohne sie definitorisch gleichzusetzen. Sie entfernt die nicht im Ausgangstext enthaltene Wendung „für das Leben“ und gibt die wiederholte Rechenschaftsformel sowie die knappe Bruder-Apposition möglichst transparent wieder. Die Gedankenstriche markieren die im Hebräischen eingeschobene nähere Bestimmung.
