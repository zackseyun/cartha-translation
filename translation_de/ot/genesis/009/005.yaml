    rationale: דָּם und נֶפֶשׁ werden zwar im Kontext eng verknüpft, aber als unterschiedliche Wörter genannt. Die Übersetzung sollte dies nicht stärker auslegen als der hebräische Wortlaut.
  - severity: high
    issue: „von einem jeden für das Leben seines Bruders“ fügt „für das Leben“ ein und verändert die Konstruktion.
    rationale: Im Hebräischen steht erneut מִיַּד („aus/von der Hand“) vor אִישׁ אָחִיו. Die Aussage betrifft das Einfordern von Rechenschaft vom Menschen, nicht ausdrücklich ein Handeln „für“ das Leben des Bruders.
