source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: de
  text: Doch euer Blut für euer Leben werde ich einfordern.[a] Von jedem Tier werde ich es einfordern und vom Menschen – von jedem Menschen, seinem Bruder – werde ich das Leben des Menschen einfordern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „euer Blut für eure Leben“. Die Formulierung verbindet Blut eng mit dem Leben; auch möglich: „euer Lebensblut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und von der Hand des Menschen, von der Hand eines Mannes, seines Bruders, werde ich das Leben des Menschen einfordern“. „Sein Bruder“ bezeichnet hier den anderen Menschen; die Wiederholung von „von der Hand“ betont die Rechenschaftspflicht.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַךְ
  choice: Doch
  rationale: אַךְ setzt hier einen nachdrücklichen Vorbehalt gegenüber der vorausgehenden Erlaubnis zum Verzehr von Tieren; „Doch“ gibt diesen Kontrast in natürlichem Deutsch wieder.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: euer Blut, das heißt euer Leben
  rationale: Der hebräische Ausdruck nennt Blut und Leben gesondert, verbindet sie aber eng. Die erläuternde Wiedergabe bewahrt beide Begriffe, ohne die unnatürliche Doppelung „Lebensblut für euer Leben“.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: werde ich einfordern
  rationale: 'דרשׁ hat hier einen rechtlich-rechenschaftlichen Sinn: Gott fordert vergossenes Blut beziehungsweise genommenes Leben vom Verantwortlichen ein.'
- source_word: מִיַּד
  choice: von
  rationale: Wörtlich steht „aus/von der Hand“. Im modernen Deutschen bezeichnet schlichtes „von“ die verantwortliche Instanz natürlicher; die wiederholte Verantwortungsstruktur bleibt erhalten.
- source_word: כָּל חַיָּה
  choice: jedem Tier
  rationale: חַיָּה bezeichnet hier im Gegensatz zum Menschen ein Tier; „Tier“ ist gegenwärtig, klar und nicht unnötig archaisch.
- source_word: אִישׁ אָחִיו
  choice: von einem jeden für das Leben seines Bruders
  rationale: Die knappe hebräische Wortfolge ist syntaktisch mehrdeutig. Diese Wiedergabe versteht אִישׁ distributiv und אָחִיו als den Mitmenschen, für dessen Leben Rechenschaft gefordert wird.
- source_word: נֶפֶשׁ הָאָדָם
  choice: das Leben des Menschen
  rationale: נֶפֶשׁ bezeichnet im Zusammenhang mit Blut und Tötung das konkrete Leben, nicht ausdrücklich eine vom Körper getrennte Seele. הָאָדָם wird als repräsentative Bezeichnung des Menschen wiedergegeben.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang mit Blutvergießen
  choice: „Leben“
  alternative: „Seele“
  rationale: Der unmittelbare Zusammenhang verknüpft נֶפֶשׁ mit Blut und mit der Verantwortung für Tötung. „Seele“ würde im heutigen Deutsch leicht eine metaphysische Aussage eintragen, die hier nicht im Vordergrund steht.
- issue: Reichweite menschlicher Verantwortlichkeit in אִישׁ אָחִיו
  choice: Jeder Mensch wird für das Leben seines Bruders beziehungsweise Mitmenschen zur Rechenschaft gezogen
  alternative: „von der Hand jedes Mannes, seines Bruders“ als möglichst formale Apposition
  rationale: „Bruder“ wird beibehalten, damit die im Hebräischen ausgedrückte zwischenmenschliche Verbundenheit nicht zu „Mitmensch“ verflacht. Eine Fußnote weist auf die ungewöhnliche wörtliche Konstruktion hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einfordern“ erhält den gerichtlichen Ton, ohne die im Deutschen schwerfällige Wendung „aus der Hand fordern“. Die Gedankenstriche kennzeichnen die nähere Bestimmung der menschlichen Verantwortlichkeit.
