  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: de
  text: 'Und ich werde meinen Bund mit euch aufrichten: Nie wieder wird alles Fleisch durch die Wasser der Flut vernichtet werden[a], und nie wieder wird es eine Flut geben, um die Erde zu vernichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „abgeschnitten werden“. „Alles Fleisch“ bezeichnet hier umfassend Menschen und Tiere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ich werde … aufrichten
  rationale: Das Hifil von קום bezeichnet in Verbindung mit בְּרִית das Aufrichten bzw. Bestätigen eines Bundes. Die Zukunftsform entspricht dem Verheißungszusammenhang; „aufrichten“ bewahrt den feierlichen Bundesstil, ohne die Frage nach Neueinsetzung oder Bestätigung abschließend festzulegen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die etablierte und sachlich angemessene deutsche Wiedergabe von בְּרִית und bewahrt die literarische sowie theologische Bedeutung des Begriffs.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Die Wendung gibt die pluralische Anrede direkt und natürlich wieder.
- source_word: יִכָּרֵת
  choice: ausgerottet werden
  rationale: Das Nifal von כרת bedeutet wörtlich „abgeschnitten werden“, bezeichnet hier aber idiomatisch die Vernichtung durch die Flut. „Ausgerottet werden“ ist im Deutschen verständlich und wahrt das Bild stärker als das allgemeinere „vernichtet werden“.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die formnahe Wendung bewahrt den umfassenden Bezug auf Menschen und Tiere, statt ihn auf die Menschheit einzuengen.
- source_word: עוֹד
  choice: nie wieder
  rationale: In Verbindung mit der Verneinung drückt עוֹד hier idiomatisch die dauerhafte Zusage „nie wieder“ aus.
- source_word: מִמֵּי הַמַּבּוּל
  choice: durch die Wasser der Flut
  rationale: Die Wiedergabe versteht מן als Angabe des Mittels bzw. der verursachenden Gewalt und bleibt zugleich nah an der hebräischen Formulierung.
- source_word: מַבּוּל
  choice: Flut
  rationale: „Flut“ ist die natürliche Standardwiedergabe für מַבּוּל im Noahbericht.
- source_word: לְשַׁחֵת
  choice: um … zu vernichten
  rationale: Der Infinitiv von שׁחת bezeichnet hier den zerstörerischen Zweck bzw. die zerstörerische Wirkung der Flut; „vernichten“ gibt dies direkt wieder.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im universalen Zusammenhang der Fluterzählung ist „Erde“ angemessener als das räumlich enger wirkende „Land“.
theological_decisions:
- issue: Umfang von כָּל בָּשָׂר
  choice: „alles Fleisch“ als umfassende Bezeichnung
  alternative: „alle Menschen“ oder „alle Lebewesen“
  rationale: Der Zusammenhang schließt Menschen und Tiere ein. Die formnahe Wiedergabe bewahrt diese Breite, ohne den Ausdruck erklärend zu verengen.
- issue: Bundesformel mit קום
  choice: „meinen Bund … aufrichten“
  alternative: „meinen Bund bestätigen“ oder „meinen Bund aufrechterhalten“
  rationale: „Aufrichten“ erhält den feierlichen Bundeswortlaut und lässt die mögliche Nuance zwischen Einsetzung und Bestätigung bestehen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die Satzstruktur folgt der feierlichen zweifachen Verheißung des Hebräischen. „Alles Fleisch“ bleibt als biblisch geprägte, aber verständliche Wendung erhalten und wird in der Fußnote erläutert.
