  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: de
  text: Die Söhne Noahs, die aus der Arche herauskamen, waren Sem, Ham und Jafet; und Ham war der Vater Kanaans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: Die Wayyiqtol-Form von היה dient hier als einfache Kopula in der Vergangenheit; „waren“ ist im Deutschen natürlich und setzt keinen Zustandswechsel voraus.
- source_word: בְנֵי נֹחַ
  choice: die Söhne Noahs
  rationale: Die hebräische Konstruktverbindung wird mit einem idiomatischen deutschen Genitiv wiedergegeben.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: die aus der Arche herauskamen
  rationale: Das artikulierte Partizip ist attributiv. „Herauskamen“ gibt zusammen mit „aus“ das Verlassen des umschlossenen Raums klar und natürlich wieder.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Sem, Ham und Jafet
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufigen Namensformen.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: Ham war der Vater Kanaans
  rationale: Die Nominalklausel wird als klare Hintergrundangabe wiedergegeben. Der deutsche Genitiv bewahrt die familiäre Beziehung in gehobenem, natürlichem Stil.
theological_decisions:
- issue: Genealogischer Hinweis auf Ham und Kanaan
  choice: Die ausdrückliche Angabe „Ham war der Vater Kanaans“ bleibt als eigener Satz im Haupttext stehen.
  alternative: Die Angabe als beiläufigen Einschub stilistisch abschwächen.
  rationale: Der hebräische Text hebt Hams Beziehung zu Kanaan ausdrücklich hervor und bereitet damit den folgenden Erzählabschnitt vor, ohne selbst weitergehende ethnische oder theologische Folgerungen zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die vorbereitende genealogische Angabe klar, ohne sie stärker auszulegen als der hebräische Text.
