revisions:
- from: Dann werde ich an meinen Bund denken, der zwischen mir und euch und jedem lebenden Wesen unter allem Fleisch[a] besteht. Nie wieder wird das Wasser zu einer Flut werden, um alles Fleisch zu vernichten.
  to: Und ich werde mich an meinen Bund erinnern, der zwischen mir und euch und jedem lebenden Wesen, allem Fleisch, besteht. Nie wieder wird das Wasser zu einer Flut werden, um alles Fleisch zu vernichten.
  rationale: Die Revision ersetzt die missverständliche Wiedergabe „unter allem Fleisch“ durch die eng am Hebräischen orientierte Apposition „allem Fleisch“ und setzt die Fußnotenmarke an diese Stelle. Außerdem wird die einleitende Verbindung neutral mit „Und“ wiedergegeben und das explizite Erinnerungsverb im Deutschen direkt formuliert. Die Wiederholung von „alles Fleisch“ sowie die Aussage über die Flut bleiben erhalten.
