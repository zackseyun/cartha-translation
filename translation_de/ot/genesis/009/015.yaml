  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: de
  text: Und ich werde mich an meinen Bund erinnern, der zwischen mir und euch und jedem lebenden Wesen, allem Fleisch, besteht. Nie wieder wird das Wasser zu einer Flut werden, um alles Fleisch zu vernichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Dann werde ich … denken
  rationale: Das Qal-Perfekt mit וְ hat in Gottes Rede Zukunftssinn. Die Wendung „an meinen Bund denken“ bewahrt die ausdrückliche Sprache des Erinnerns, klingt im Deutschen aber natürlicher als „meinen Bund erinnern“.
- source_word: בְּרִיתִי
  choice: mein Bund
  rationale: „Bund“ ist die sachlich und theologisch angemessene Standardwiedergabe von בְּרִית.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: jedes lebende Wesen
  rationale: נֶפֶשׁ חַיָּה bezeichnet hier ein belebtes Wesen und schließt im Zusammenhang auch Tiere ein; „Wesen“ vermeidet eine Verengung auf Menschen.
- source_word: בְּכָל בָּשָׂר
  choice: unter allem Fleisch
  rationale: Die Formulierung erhält den umfassenden, körperliches Leben bezeichnenden Ausdruck כָּל־בָּשָׂר und gibt בְּ in seiner zuordnenden beziehungsweise einschließenden Funktion wieder.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: Nie wieder wird … werden
  rationale: „Nie wieder“ gibt die dauerhafte Verneinung durch לֹא … עוֹד idiomatisch wieder.
- source_word: הַמַּיִם לְמַבּוּל
  choice: das Wasser wird zu einer Flut
  rationale: Der deutsche Kollektivsingular „das Wasser“ entspricht dem hebräischen הַמַּיִם; לְמַבּוּל wird als resultatives Werden zu einer Flut verstanden.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: um alles Fleisch zu vernichten
  rationale: Der Infinitiv mit לְ wird als Zweck beziehungsweise Folge der Flut wiedergegeben; die Wiederholung von „alles Fleisch“ bleibt erhalten.
theological_decisions:
- issue: Anthropomorphe Rede vom Erinnern Gottes
  choice: „Dann werde ich an meinen Bund denken“
  alternative: „Dann werde ich gemäß meinem Bund handeln“
  rationale: Der hebräische Text spricht ausdrücklich vom Erinnern beziehungsweise Gedenken. Eine rein handlungsbezogene Paraphrase würde die theologische Spannung vorzeitig erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und kontextuell umfassende Wendung „alles Fleisch“ bleibt erhalten, ohne sie auf Menschen zu beschränken; eine Fußnote erläutert die ungewohnte hebräische Zuordnung.
