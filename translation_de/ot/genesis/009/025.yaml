  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: de
  text: 'Und er sagte: „Verflucht ist Kanaan; ein Sklave von Sklaven soll er seinen Brüdern sein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Wayyiqtol-Form führt in der hebräischen Erzählfolge die direkte Rede ein; „Und er sagte“ bildet diese Verknüpfung schlicht und natürlich ab.
- source_word: אָרוּר
  choice: Verflucht sei
  rationale: Das prädikativ gebrauchte Partizip bezeichnet Kanaan als verflucht. Im Zusammenhang eines Fluchspruchs gibt der deutsche Jussiv „Verflucht sei“ die feierliche Aussagekraft wieder, ohne eine zusätzliche Handlung zu ergänzen.
- source_word: כְּנָעַן
  choice: Kanaan
  rationale: Der im hebräischen Text ausdrücklich genannte Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: עֶבֶד עֲבָדִים
  choice: Ein Sklave von Sklaven
  rationale: Die wörtlich bewahrte Wiederholung gibt die scharfe Sprache der Unterwerfung wieder. Die Genitivverbindung wirkt verstärkend und bezeichnet äußerste Knechtschaft.
- source_word: יִהְיֶה
  choice: soll er … sein
  rationale: Das Imperfekt drückt hier die künftige Folge des Fluchspruchs aus. „Soll … sein“ passt zum feierlichen Ausspruch und vermeidet das altertümliche „wird … sein“ nicht, sondern bewahrt zugleich den Verkündigungscharakter.
- source_word: לְאֶחָיו
  choice: seinen Brüdern
  rationale: Die Form bedeutet wörtlich „seinen Brüdern“. Der Dativ ist im Deutschen bei „jemandem ein Sklave sein“ idiomatisch und bewahrt den familiären beziehungsweise stammesbezogenen Ausdruck.
theological_decisions:
- issue: Adressat beziehungsweise Gegenstand des Fluchs
  choice: Kanaan wird ausdrücklich als der Verfluchte genannt.
  alternative: Den Fluch unmittelbar auf Ham zu beziehen.
  rationale: Der hebräische Text nennt Kanaan, nicht Ham. Die Übersetzung darf diese Aussage nicht aufgrund späterer Deutungstraditionen verschieben.
- issue: Wiedergabe der Knechtschaftssprache
  choice: „Sklave von Sklaven“
  alternative: „Diener der Diener“ oder deutend „der niedrigste Sklave“
  rationale: „Sklave“ wahrt in diesem Fluchkontext die Härte der bezeichneten Unterwerfung. Die hebräische Verstärkungsform bleibt im Haupttext sichtbar; ihre Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Fluchspruch bleibt knapp und feierlich; die ungewöhnliche hebräische Verstärkungsform wird im Haupttext bewahrt und nicht vorschnell geglättet.
