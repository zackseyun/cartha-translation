  naturalness: „Ein Sklave von Sklaven soll er seinen Brüdern sein“ ist im feierlichen Kontext verständlich und bewahrt die hebräische Formel, auch wenn die Konstruktion absichtlich ungewohnt klingt. Ein Semikolon gliedert die zwei Aussagesätze klar. Das Ausrufezeichen ist hier nicht erforderlich.
  terminology: „Sklave“ bildet die harte Unterwerfungssemantik von עֶבֶד in diesem Kontext angemessen ab. „Brüdern“ ist die genaue Wiedergabe von לְאֶחָיו. Die Fußnote zur Verstärkungsform sollte sie erklären, ohne eine einzige deutsche Deutung als den Wortlaut auszugeben.
