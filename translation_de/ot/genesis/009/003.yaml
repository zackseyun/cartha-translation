  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: de
  text: Alles, was sich regt und lebt, soll euch zur Nahrung dienen. Wie die grünen Pflanzen habe ich euch alles gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alles Kriechende, das lebt, soll euch zur Nahrung dienen.« Das hebräische Wort kann kriechende oder schwärmende Tiere bezeichnen, wird hier im Zusammenhang aber wahrscheinlich umfassender gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Alles, was sich regt
  rationale: Die Wendung gibt den umfassenden Sinn von כָּל wieder und bewahrt zugleich die Bewegungsbedeutung von רֶמֶשׂ, ohne sie unnötig auf Kriech- oder Schwarmtiere zu verengen.
- source_word: אֲשֶׁר הוּא חַי
  choice: und lebt
  rationale: Die knappe deutsche Formulierung bezeichnet lebende Wesen und fügt sich natürlich an »was sich regt« an.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: soll euch zur Nahrung dienen
  rationale: Dies bildet die prädikative Konstruktion würdig und idiomatisch ab und lässt sowohl Gewährung als auch Bestimmung erkennen.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: Wie die grünen Pflanzen
  rationale: »Grüne Pflanzen« gibt den kollektiven Bezug auf pflanzliche Nahrung in modernem Deutsch wieder; כְּ markiert den Vergleich mit der früheren Gabe.
- source_word: נָתַתִּי
  choice: gebe ich
  rationale: Das hebräische Perfekt bezeichnet hier eine wirksame göttliche Gewährung. Das deutsche Präsens klingt in der direkten Zusage natürlich und schließt die nun erweiterte Gabe ein.
- source_word: אֶת כֹּל
  choice: alles
  rationale: Die kollektive und umfassende Aussage wird im Deutschen knapp und deutlich wiedergegeben.
theological_decisions:
- issue: Umfang der Nahrungserlaubnis nach der Flut
  choice: Der Vers gewährt grundsätzlich alles Lebendige, das sich bewegt, als Nahrung.
  alternative: רֶמֶשׂ ausschließlich als kleine kriechende oder schwärmende Tiere zu verstehen.
  rationale: Obwohl רֶמֶשׂ andernorts enger gebraucht werden kann, sprechen der Kontext und das abschließende אֶת כֹּל für einen umfassenden Sinn. Die Übersetzung bewahrt mit »was sich regt« die lexikalische Bildlichkeit, ohne die Erlaubnis künstlich einzuengen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, vermeidet jedoch altertümliche Wendungen.
