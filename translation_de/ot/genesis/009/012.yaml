base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: de
  text: 'Und Gott sagte: »Dies ist das Zeichen des Bundes, den ich zwischen mir und euch und allen Lebewesen, die mit euch sind, stifte[a] – für alle künftigen Generationen[b]:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gebe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für Generationen auf Dauer«; die Wendung bezeichnet fortdauernde Geltung über die Generationen hinweg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und Gott sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. »Und … sagte« gibt die Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אוֹת הַבְּרִית
  choice: das Zeichen des Bundes
  rationale: אוֹת bezeichnet hier ein sichtbares Zeichen; בְּרִית wird als der in Genesis zentrale Begriff konsequent mit »Bund« wiedergegeben.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: den ich … stifte
  rationale: נֹתֵן bedeutet wörtlich »gebe«. Im Zusammenhang bezeichnet es die Gewährung beziehungsweise Einsetzung des Bundes; »einen Bund stiften« ist im Deutschen verständlicher als »einen Bund geben«, ohne die Aussage mit dem technischeren »schließen« zu überformen.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: zwischen mir und euch und
  rationale: Die wiederholte Präposition benennt die Bundesparteien. Die deutsche Formulierung bewahrt alle Beteiligten, ohne die Wiederholung unnötig schwerfällig abzubilden.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: jedem Lebewesen
  rationale: Die Wendung umfasst hier die mit Noah verbundenen Tiere. »Lebewesen« wahrt den breiten Bezug und vermeidet die im Deutschen missverständliche Wiedergabe »lebende Seele«.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: bei euch
  rationale: Die knappe Formulierung gibt die Zugehörigkeits- beziehungsweise Begleitangabe natürlich wieder.
- source_word: לְדֹרֹת עוֹלָם
  choice: für alle kommenden Generationen
  rationale: Die Wendung bezeichnet eine unbegrenzt fortdauernde Geltung über die Generationen hinweg. Die gewählte Formulierung ist modern und verständlich und erhält sowohl den Generationenbezug als auch die Dauerhaftigkeit.
theological_decisions:
- issue: Bezug und Wiedergabe von אֲשֶׁר אֲנִי נֹתֵן
  choice: den ich … stifte
  alternative: das ich … gebe; den ich … gebe; den ich … schließe
  rationale: Der Relativsatz wird auf »Bund« bezogen, was dem unmittelbaren Bezugswort und dem Bundeszusammenhang entspricht. »Stiften« vermittelt die begründende Kraft von נֹתֵן, während die Fußnote dessen wörtliche Bedeutung offenlegt. »Schließen« wäre idiomatisch, entspräche aber eher der hebräischen Wendung כרת ברית.
- issue: Umfang von נֶפֶשׁ חַיָּה
  choice: jedem Lebewesen
  alternative: jeder lebenden Seele; jedem lebenden Geschöpf
  rationale: Im Kontext schließt die Wendung Tiere ein. »Lebewesen« vermeidet eine anthropologische oder dualistische Verengung des Wortes נֶפֶשׁ.
- issue: Zeitliche Reichweite von לְדֹרֹת עוֹלָם
  choice: für alle kommenden Generationen
  alternative: für ewige Generationen; durch alle Generationen hindurch
  rationale: Die Übersetzung bringt die fortdauernde Geltung zum Ausdruck, ohne עוֹלָם vorschnell als philosophische Aussage über abstrakte Ewigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sagte« ist allgemein verständlich; »stifte« wahrt einen gehobenen, aber nicht altertümlichen Ton. Der Gedankenstrich gliedert die lange Aufzählung und macht den abschließenden Zeitbezug klar erkennbar.
