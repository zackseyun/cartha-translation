  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: de
  text: Er trank von dem Wein[a], wurde betrunken und entblößte sich[b] in seinem Zelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dem Wein“; die Wendung kann hier im Sinn von „etwas von dem Wein“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lag entblößt“ beziehungsweise „war entblößt“. Die hebräische Verbform kann auch eher zustandsbezogen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Er trank
  rationale: Das Qal-Wayyiqtol von שׁתה bezeichnet die nächste Handlung der Erzählung. Die fortlaufende Verbindung wird im Deutschen durch die Satzfolge hinreichend wiedergegeben.
- source_word: מִן הַיַּיִן
  choice: von dem Wein
  rationale: מִן mit dem bestimmten Substantiv hat hier wahrscheinlich partitiven Sinn. „Von dem Wein“ bewahrt die hebräische Ausdrucksweise und klingt im Deutschen natürlich.
- source_word: וַיִּשְׁכָּר
  choice: wurde betrunken
  rationale: Das Qal von שׁכר bezeichnet hier den Eintritt in den Zustand der Trunkenheit; „wurde betrunken“ gibt diesen ing ressiven Sinn in würdigem, modernem Deutsch wieder.
- source_word: וַיִּתְגַּל
  choice: entblößte sich
  rationale: Die Hitpael-Form von גלה lässt sich reflexiv verstehen. „Entblößte sich“ erhält diese Nuance, ohne über den Text hinaus eine sexuelle Deutung einzutragen.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: in seinem Zelt
  rationale: בְּתוֹךְ bezeichnet das Innere eines Ortes. Im Deutschen gibt „in seinem Zelt“ den räumlichen Sinn klar und idiomatisch wieder.
theological_decisions:
- issue: Moralische und theologische Bewertung von Noahs Trunkenheit und Entblößung
  choice: Der Vers wird rein berichtend übersetzt, ohne eine ausdrückliche moralische Wertung hinzuzufügen.
  alternative: „Er lag nackt in seinem Zelt“ oder „Er lag entblößt in seinem Zelt“.
  rationale: Der hebräische Text berichtet Trinken, Trunkenheit und Entblößung, spricht an dieser Stelle aber kein ausdrückliches moralisches Urteil aus. Die reflexive Wiedergabe wahrt den möglichen Handlungscharakter, während die Fußnote die stativere Deutung offenhält.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Erzählfolge des Hebräischen bleibt erhalten; echte lexikalische Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
