  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: de
  text: 'und mit allen Lebewesen, die bei euch sind: mit den Vögeln, dem Vieh und allen Wildtieren der Erde bei euch, mit allem, was aus der Arche gekommen ist – allen Wildtieren der Erde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlussteil ist schwer zu deuten. Wörtlicher: „von allem, was aus der Arche gekommen ist, für alle Wildtiere der Erde“. Die letzten Worte können auch als zusammenfassende Wiederaufnahme verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: Lebewesen
  rationale: Die Wendung bezeichnet hier umfassend belebte Geschöpfe, besonders Tiere. „Lebewesen“ ist natürlich und bewahrt den weiten Bedeutungsumfang.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: die bei euch sind
  rationale: Die Relativkonstruktion wird im Deutschen idiomatisch im Plural an „alle Lebewesen“ angeschlossen.
- source_word: בָּעוֹף
  choice: mit den Vögeln
  rationale: עוֹף kann fliegende Tiere allgemein bezeichnen; im Kontext der Tiergruppen ist „Vögel“ die klare, übliche Wiedergabe.
- source_word: בַּבְּהֵמָה
  choice: dem Vieh
  rationale: בְּהֵמָה bezeichnet hier die domestizierten Landtiere; „Vieh“ ist prägnant und grenzt sie von den Wildtieren ab.
- source_word: וּבְכָל חַיַּת הָאָרֶץ
  choice: und allen Wildtieren der Erde
  rationale: חַיַּת הָאָרֶץ bezeichnet im Gegensatz zum Vieh die wilden Landtiere. „Wildtiere“ erhält diese sachliche Unterscheidung.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: mit allem, was aus der Arche gekommen ist
  rationale: Die Präposition מִן bezeichnet hier wahrscheinlich die Gruppe beziehungsweise ihren Umfang. Das wiederholte „mit“ bindet die Wendung im Deutschen an die in Vers 9 begonnene Bundesformel an.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: mit allen Tieren der Erde
  rationale: Die Schlusswendung ist syntaktisch schwierig und wirkt resümierend. „Tiere“ vermeidet eine unnatürliche unmittelbare Wiederholung von „Wildtieren“, ohne die umfassende Aussage einzuengen.
theological_decisions:
- issue: Umfang und Syntax der tierischen Bundespartner
  choice: Alle bei Noah befindlichen Tiere werden einbezogen; die Schlusswendung wird als resümierende Bekräftigung wiedergegeben.
  alternative: 'Formaler: „für alle Wildtiere der Erde“; möglich ist auch eine unmittelbar appositionelle Wiederholung „alle Wildtiere der Erde“.'
  rationale: Der hebräische Satz ist gedrängt und wiederholt חַיַּת הָאָרֶץ. Die gewählte Fassung bewahrt den umfassenden Geltungsbereich und kennzeichnet durch eine Fußnote die syntaktische Unsicherheit, ohne eine einzelne Deutung als sicher auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt eng am hebräischen Wortlaut; der Gedankenstrich macht die wahrscheinlich resümierende Schlusswendung lesbar. Der Fußnotenmarker steht im Haupttext.
