source:
  edition: WLC
  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: de
  text: Noah, ein Landwirt, begann, einen Weinberg anzulegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Noah, ein Landwirt, war der Erste, der einen Weinberg anlegte.« Der hebräische Wortlaut ist knapp; manche verstehen »begann« im Sinn von »war der Erste«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: begann
  rationale: Das Hifil von חלל bedeutet hier im erzählerischen Zusammenhang am natürlichsten »beginnen«. Der Sinn setzt sich im folgenden Verb fort.
- source_word: נֹחַ
  choice: Noah
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אִישׁ הָאֲדָמָה
  choice: ein Mann des Ackerbodens
  rationale: Die enge Wiedergabe bewahrt die appositionelle hebräische Wendung und ihren landwirtschaftlichen Bezug. »Ackerboden« klingt im Deutschen natürlicher und konkreter als »Mann des Bodens«.
- source_word: וַיִּטַּע
  choice: anzulegen
  rationale: נטע bedeutet »pflanzen«. In Verbindung mit einem Weinberg ist »einen Weinberg anlegen« die natürliche deutsche Ausdrucksweise; der Infinitiv gibt die Beziehung zu »begann« wieder.
- source_word: כָּרֶם
  choice: einen Weinberg
  rationale: Sachlich genaue und im Deutschen übliche Entsprechung für eine mit Weinreben bepflanzte Anlage.
theological_decisions:
- issue: Deutung der verkürzten Abfolge וַיָּחֶל ... וַיִּטַּע
  choice: Noah begann, einen Weinberg anzulegen
  alternative: Noah war der Erste, der einen Weinberg anlegte
  rationale: Die hebräische Formulierung ist knapp. »Begann« mit dem folgenden Pflanzvorgang zu verbinden, entspricht dem naheliegenden Erzählfluss, ohne eine ausdrückliche Aussage über Noah als den ersten Weinbauern einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Einen Weinberg anlegen« ist idiomatischer als »einen Weinberg pflanzen«; »Mann des Ackerbodens« bewahrt zugleich die markante hebräische Apposition.
