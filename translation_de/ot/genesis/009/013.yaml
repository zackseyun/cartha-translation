source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: de
  text: Meinen Bogen habe ich in die Wolke gesetzt[a], und er wird ein Zeichen des Bundes zwischen mir und der Erde sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinen Regenbogen«. Wörtlich steht im Hebräischen »meinen Bogen«; im Zusammenhang ist der Regenbogen in der Wolke gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: meinen Bogen
  rationale: קֶשֶׁת bezeichnet gewöhnlich einen Bogen, auch als Waffe. Im Zusammenhang mit der Wolke ist der Regenbogen gemeint; der Haupttext bewahrt jedoch das hebräische Bild, während die Fußnote den kontextuellen Sinn nennt.
- source_word: נָתַתִּי
  choice: habe ich … gesetzt
  rationale: נתן kann „geben“, „stellen“ oder „setzen“ bedeuten. „In die Wolke gesetzt“ gibt die Platzierung natürlich wieder; das Perfekt wird mit gegenwärtiger Geltung als deutsches Perfekt übersetzt.
- source_word: בֶּעָנָן
  choice: in die Wolke
  rationale: Das hebräische Substantiv steht im Singular. Nach dem deutschen Verb „setzen“ bezeichnet der Akkusativ die zielgerichtete Platzierung; „die Wolke“ wahrt den generischen Singular.
- source_word: וְהָיְתָה
  choice: und er wird … sein
  rationale: Die Form bezeichnet hier die künftige beziehungsweise resultierende Funktion des Bogens. Das maskuline Pronomen richtet sich im Deutschen nach „Bogen“.
- source_word: לְאוֹת בְּרִית
  choice: ein Zeichen des Bundes
  rationale: אוֹת bezeichnet ein Zeichen oder Merkzeichen. Der Genitiv „des Bundes“ ist im Deutschen natürlich und macht die Zuordnung zum im Kontext bereits bestimmten Bund deutlich.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: zwischen mir und der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der universale Zusammenhang der Fluterzählung spricht hier für „Erde“.
theological_decisions:
- issue: Bezug von קַשְׁתִּי im Bundeskontext
  choice: Das wörtliche Bild „mein Bogen“ bleibt im Haupttext erhalten und wird im Kontext als Regenbogen verstanden.
  alternative: „mein Regenbogen“
  rationale: Das Hebräische verwendet das gewöhnliche Wort für „Bogen“. Die Übersetzung bewahrt damit die mögliche Waffenbildlichkeit, ohne den sichtbaren Bezug zum Regenbogen zu verschweigen; dieser wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hebt „meinen Bogen“ entsprechend dem hebräischen Satzanfang hervor. Das Bild des Bogens wird nicht durch eine rein erklärende Wiedergabe ersetzt.
