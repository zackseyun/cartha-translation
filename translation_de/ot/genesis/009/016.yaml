- from: Der Bogen wird in der Wolke sein[a]. Ich werde ihn sehen und an den ewigen Bund denken, der zwischen Gott und jedem lebenden Wesen unter allem Fleisch auf der Erde besteht.
  to: Der Bogen wird in der Wolke sein[a]. Ich werde ihn sehen und mich an den ewigen Bund erinnern, der zwischen Gott und jedem lebenden Wesen, allem Fleisch auf der Erde, besteht.
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen: „mich … erinnern“ gibt לִזְכֹּר präziser wieder, und „allem Fleisch auf der Erde“ behandelt בְּכָל־בָּשָׂר als die im Hebräischen naheliegende spezifizierende Apposition. Die Aussageweite und die anthropomorphe Rede von Gottes Erinnern bleiben unverändert.'
