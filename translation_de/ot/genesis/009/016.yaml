  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: de
  text: Der Bogen wird in der Wolke sein[a]. Ich werde ihn sehen und mich an den ewigen Bund erinnern, der zwischen Gott und jedem lebenden Wesen, allem Fleisch auf der Erde, besteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Regenbogen“. Das hebräische Wort bedeutet wörtlich „Bogen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird … sein
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt in dieser zukunftsbezogenen Gottesrede die Aussage fort; das deutsche Futur gibt dies klar wieder.
- source_word: הַקֶּשֶׁת
  choice: der Bogen
  rationale: Das hebräische Wort bezeichnet wörtlich einen Bogen. Im Kontext ist der Himmels- beziehungsweise Regenbogen gemeint; die Bildsprache des Ausgangstextes bleibt im Haupttext erhalten.
- source_word: בֶּעָנָן
  choice: in der Wolke
  rationale: Der hebräische Ausdruck steht im Singular mit Artikel; die entsprechende deutsche Form ist natürlich und formnah.
- source_word: וּרְאִיתִיהָ
  choice: Ich werde ihn sehen
  rationale: Das Suffix der dritten Person feminin Singular bezieht sich auf קֶשֶׁת; im Deutschen ist das Pronomen wegen des maskulinen Genus von „Bogen“ ebenfalls maskulin.
- source_word: לִזְכֹּר
  choice: und an … denken
  rationale: Der Infinitiv mit ל bezeichnet hier Zweck oder Folge. Die koordinierte deutsche Form gibt den Zusammenhang idiomatisch wieder, ohne Gottes Erinnern erklärend umzudeuten.
- source_word: בְּרִית עוֹלָם
  choice: den ewigen Bund
  rationale: עוֹלָם bezeichnet hier die unbegrenzte beziehungsweise generationenübergreifende Dauer des Bundes; „ewiger Bund“ ist eine klare, etablierte Wiedergabe.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: der zwischen Gott und … besteht
  rationale: Die im Hebräischen wiederholte Präposition „zwischen … und zwischen …“ wird im Deutschen idiomatisch nur einmal ausgedrückt; „besteht“ verdeutlicht natürlich den Anschluss des Bundes, ohne einen neuen Sachgehalt einzuführen.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: jedem lebenden Wesen
  rationale: נֶפֶשׁ bezeichnet hier ein lebendes Wesen und nicht speziell eine vom Körper getrennte Seele. Die Wiedergabe schließt Menschen und Tiere ein.
- source_word: בְּכָל בָּשָׂר
  choice: unter allem Fleisch
  rationale: Die Präposition בְּ bezeichnet hier die Zuordnung beziehungsweise den Bereich der lebenden Wesen. Die bewusst etwas formnahe Wendung bewahrt den umfassenden biblischen Ausdruck „alles Fleisch“.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Der Relativsatz bestimmt umfassend die auf der Erde befindlichen Lebewesen; „Erde“ passt besser als das engere „Land“.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Erinnern
  choice: „Ich werde ihn sehen und an den ewigen Bund denken“ beibehalten
  alternative: „Ich werde ihn sehen und meinem Bund entsprechend handeln“
  rationale: Der Ausgangstext spricht ausdrücklich von Gottes Erinnern. Die Übersetzung wahrt diese anthropomorphe und bundestheologische Ausdrucksweise, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, während die Abfolge der hebräischen Aussagen erhalten bleibt. „Alles Fleisch“ bewahrt bewusst die umfassende biblische Ausdrucksweise.
