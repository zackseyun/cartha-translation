  - severity: medium
    issue: Die Fußnote nennt „jüngst“ als mögliche Bedeutung.
    rationale: „Jüngst“ bedeutet im heutigen Deutsch in der Regel „kürzlich“ und kann das hebräische Adjektiv hier nicht angemessen wiedergeben. Die lexikalischen Möglichkeiten sind vielmehr etwa „klein“, „jung“, „jünger“ und kontextuell „jüngst/der Jüngste“ im Sinn von „jüngster“.
