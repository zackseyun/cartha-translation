base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: de
  text: Als Noah von seinem Wein erwachte, erfuhr er, was sein jüngster Sohn[a] ihm angetan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein jüngerer Sohn“. Das hebräische Adjektiv kann je nach Zusammenhang „klein“, „jung“, „jünger“ oder „jüngster“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: erwachte
  rationale: יקץ bezeichnet das Erwachen aus dem Schlaf. Die Übersetzung bleibt beim einfachen Wortsinn und deutet das Verb nicht als „wurde nüchtern“.
- source_word: מִיֵּינוֹ
  choice: aus seinem Weinrausch
  rationale: Wörtlich steht „von/aus seinem Wein“. Im Deutschen gibt „aus seinem Weinrausch erwachte“ die gemeinte weinbedingte Bewusstlosigkeit natürlich wieder, ohne das Erwachen selbst als Ernüchterung umzudeuten.
- source_word: וַיֵּדַע
  choice: erfuhr er
  rationale: ידע bedeutet grundsätzlich „wissen/erkennen“, kann im Erzählzusammenhang jedoch den Eintritt des Wissens bezeichnen. „Erfuhr“ ist hier idiomatischer als „wusste“, ohne festzulegen, auf welchem Weg Noah Kenntnis erhielt.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: was ... ihm angetan hatte
  rationale: Die Formulierung bewahrt den unbestimmten Inhalt der Handlung. Das Plusquamperfekt kennzeichnet sie als dem Erwachen und Erfahren vorausgehend; „angetan“ entspricht dem Betroffenenbezug von לוֹ, ohne die Tat näher zu bestimmen.
- source_word: בְּנוֹ הַקָּטָן
  choice: sein jüngster Sohn
  rationale: קָטָן kann „klein“, „jung/jünger“ oder „jüngst“ bedeuten. Im familiären Zusammenhang ist „jüngster Sohn“ eine natürliche Wiedergabe; die mögliche komparative Lesart wird in der Fußnote erhalten.
theological_decisions:
- issue: Art der an Noah begangenen Handlung
  choice: 'Die Handlung bleibt allgemein: „was ... ihm angetan hatte“.'
  alternative: Die Handlung ausdrücklich als das Sehen und Weitersagen von Noahs Nacktheit oder als einen schwereren sexuellen Übergriff bestimmen.
  rationale: Der hebräische Vers benennt die Handlung nicht ausdrücklich. Die Übersetzung bewahrt diese tatsächliche Unbestimmtheit und trägt keine bestimmte Deutung in den Text ein.
- issue: Bezug und Altersrang von „sein jüngster Sohn“
  choice: Im Haupttext steht „sein jüngster Sohn“, ohne den Sohn namentlich zu identifizieren.
  alternative: „sein jüngerer Sohn“ oder eine ausdrückliche Identifizierung mit Ham beziehungsweise Kanaan.
  rationale: Die hebräische Formulierung nennt lediglich Noahs בְּנוֹ הַקָּטָן. Sie legt in diesem Vers weder den Namen ausdrücklich fest noch beseitigt sie die lexikalische Möglichkeit „jünger“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Weinrausch“ vermeidet die im Deutschen unnatürliche Wendung „aus seinem Wein erwachen“; die eigentliche Handlung bleibt bewusst unbestimmt.
