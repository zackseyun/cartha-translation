  terminology: „Seid fruchtbar und vermehrt euch“ ist für diese feste biblische Wendung treffend und bewahrt den Anklang an Genesis 1. Die Wiederholung von „vermehrt euch“ entspricht dem Hebräischen. Die Fußnote erläutert die Bildsprache von שׁרץ, ohne eine dogmatische Deutung einzutragen.
