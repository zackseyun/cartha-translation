base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: de
  text: 'Ihr aber: Seid fruchtbar und vermehrt euch; wimmelt[a] auf der Erde und vermehrt euch auf ihr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »breitet euch in großer Zahl auf der Erde aus«. Das hebräische Verb vermittelt das Bild eines zahlreichen Wimmelns und einer überreichen Vermehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt die Angeredeten gegenüber dem vorher Gesagten hervor. »Ihr aber« gibt diesen Nachdruck knapp und natürlich wieder.
- source_word: פְּרוּ
  choice: Seid fruchtbar
  rationale: Die feste Verbindung mit רבה bezeichnet hier Fruchtbarkeit und Nachkommenschaft. Die vertraute Formulierung bewahrt zugleich den Anklang an den Schöpfungsauftrag.
- source_word: וּרְבוּ
  choice: und vermehrt euch
  rationale: Das Verb bezeichnet zahlenmäßige Zunahme. Die Wiederholung am Versende wird beibehalten, weil sie im Hebräischen ausdrücklich steht und den Auftrag verstärkt.
- source_word: שִׁרְצוּ
  choice: wimmelt
  rationale: Das Verb zeichnet das starke Bild einer überreichen, sich ausbreitenden Vermehrung. Das ungewöhnliche, aber verständliche »wimmelt« bewahrt diese Bildkraft besser als das neutralere »breitet euch aus«.
- source_word: בָאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ bezeichnet hier im Zusammenhang nach der Flut die Erde als Lebensraum der Menschen. Im Deutschen ist bei dieser räumlichen Vorstellung »auf der Erde« idiomatisch.
- source_word: וּרְבוּ בָהּ
  choice: und vermehrt euch auf ihr
  rationale: Das weibliche Suffix verweist auf »Erde« zurück. »Auf ihr« stellt diesen Bezug natürlich her und bewahrt die Wiederholung von רבה.
theological_decisions:
- issue: Verhältnis zum Schöpfungsauftrag und zum Segen nach der Flut
  choice: Der Wortlaut wird als erneuerter göttlicher Auftrag an Noah und seine Söhne wiedergegeben, ohne ihn im Haupttext dogmatisch auszudeuten.
  alternative: Den Vers ausdrücklich nur als Wiederholung von 1. Mose 1,28 oder als erweiterte Bundesformel auslegen.
  rationale: Die imperativische Segenssprache erinnert deutlich an 1. Mose 1,28; die Übersetzung sollte diesen Anklang erhalten, aber keine über den hebräischen Wortlaut hinausgehende Lehrdeutung einfügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach »Ihr aber« macht die Hervorhebung des selbstständigen Pronomens hörbar. Das bewusst kräftige »wimmelt« erhält das ungewöhnliche Bild des hebräischen Verbs; die Fußnote bietet eine natürlichere, weniger bildhafte Alternative.
