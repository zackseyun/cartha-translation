  source_fidelity: 'Der Text gibt die emphatische Anrede וְאַתֶּם mit „Ihr aber“ angemessen wieder und bewahrt beide Imperativpaare: „Seid fruchtbar und vermehrt euch“ für פְּרוּ וּרְבוּ sowie die erneute Aufforderung zur Vermehrung am Schluss. „wimmelt“ bildet שִׁרְצוּ bewusst bildhaft und quellennahe ab. „auf der Erde“ und „auf ihr“ sind im Deutschen idiomatische Wiedergaben der Ortsbezüge zu אֶרֶץ.'
