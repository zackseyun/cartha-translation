  source_fidelity: Die Übersetzung gibt אַךְ als einschränkenden Gegensatz („Doch“) angemessen wieder und bewahrt בָּשָׂר als „Fleisch“. „Mit seinem Leben – seinem Blut –“ bildet die knappe hebräische Verbindung von נַפְשׁוֹ und דָּמוֹ als erläuternde Apposition ab, ohne „Seele“ oder eine weitergehende theologische Deutung einzutragen. „Dürft ihr nicht essen“ ist für die verneinte imperfektische Verbform im rechtlich-normativen Kontext sachgerecht.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die vorangestellte Objektgruppe und die Gedankenstriche sind leicht markiert, passen aber zum knappen, gesetzesartigen Register und machen den appositionellen Nachtrag verständlich.
  terminology: „Leben“ und „Blut“ sind terminologisch treffend. Die Wiedergabe vermeidet die hier missverständliche Übertragung von נֶפֶשׁ mit „Seele“. Die Fußnote bietet mit „Nur“ eine legitime, stärker restriktiv klingende Alternative zu „Doch“ und ist korrekt verankert.
