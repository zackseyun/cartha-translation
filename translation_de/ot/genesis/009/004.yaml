source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: de
  text: Doch Fleisch mit seinem Leben – seinem Blut – dürft ihr nicht essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und ebenfalls möglich: „Nur Fleisch mit seinem Leben – seinem Blut – sollt ihr nicht essen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Das Wort schränkt die vorausgehende Erlaubnis ein und setzt dazu einen klaren Gegensatz. „Doch“ gibt diese restriktive Funktion in natürlichem Deutsch wieder.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: „Fleisch“ entspricht dem konkreten hebräischen Ausdruck und passt zum Zusammenhang von Tier, Leben und Blut.
- source_word: בְּנַפְשׁוֹ
  choice: mit seinem Leben
  rationale: נֶפֶשׁ bezeichnet hier das Leben des Lebewesens, nicht eine vom Körper getrennte „Seele“. Die Präposition wird als begleitendes „mit“ wiedergegeben.
- source_word: דָמוֹ
  choice: seinem Blut
  rationale: דָם bedeutet unmittelbar „Blut“. Die eigenständige Wiedergabe bewahrt die knappe Zuordnung von Leben und Blut.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: mit seinem Leben – seinem Blut
  rationale: Der Gedankenstrich gibt die knappe, erläuternde Apposition des Hebräischen wieder, ohne sie durch ein ausdrücklich ergänztes „das heißt“ vollständig festzulegen.
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nicht essen
  rationale: Die verneinte Verbform drückt hier ein verbindliches Verbot aus. „Dürft ihr nicht“ klingt im modernen Deutschen natürlich und wahrt den rechtlichen Ton.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Verhältnis zum Blut
  choice: „Leben“ statt „Seele“
  alternative: „Seele“
  rationale: Im Zusammenhang bezeichnet נֶפֶשׁ das belebende Leben des Tieres. „Seele“ könnte hier eine spätere anthropologische Unterscheidung in den Text hineintragen.
- issue: Verhältnis von „Leben“ und „Blut“
  choice: Knappe Apposition mit Gedankenstrichen
  alternative: 'Ausdrückliche Erklärung: „das heißt: sein Blut“'
  rationale: Die hebräische Wortfolge stellt Leben und Blut eng nebeneinander. Die Zeichensetzung lässt den erläuternden beziehungsweise gleichsetzenden Bezug sichtbar, ohne ihn stärker auszuformulieren als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt das verbotene Objekt hervor; die Gedankenstriche bewahren die knappe und leicht mehrdeutige hebräische Apposition.
