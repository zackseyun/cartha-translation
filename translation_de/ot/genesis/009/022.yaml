id: GEN.9.22
reference: Genesis 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: de
  text: Und Ham, der Vater Kanaans, sah die Blöße seines Vaters[a] und erzählte es draußen seinen beiden Brüdern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Blöße seines Vaters“. In manchen Zusammenhängen des Alten Testaments kann diese Wendung als sexueller Euphemismus dienen. Hier bleibt durch die wörtliche Wiedergabe offen, ob eine solche Bedeutung mitschwingt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Verb ראה bezeichnet hier in der fortlaufenden Erzählung schlicht das Sehen; eine stärker deutende Wiedergabe wäre nicht durch das Verb selbst begründet.
- source_word: חָם
  choice: Ham
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֲבִי כְנַעַן
  choice: der Vater Kanaans
  rationale: Die hebräische Status-constructus-Verbindung kennzeichnet Ham ausdrücklich als Vater Kanaans; die Apposition bleibt erhalten.
- source_word: עֶרְוַת אָבִיו
  choice: die Blöße seines Vaters
  rationale: Diese formal nahe und im Deutschen verständliche Wiedergabe bewahrt die hebräische Ausdrucksweise, ohne vorschnell eine bestimmte sexuelle Handlung anzunehmen.
- source_word: וַיַּגֵּד
  choice: erzählte es
  rationale: נגד im Hifil bedeutet mitteilen, erzählen oder berichten. Das ergänzte Pronomen „es“ macht den Bezug im natürlichen Deutschen deutlich, ohne neue Sachinformation hinzuzufügen.
- source_word: לִשְׁנֵי אֶחָיו
  choice: seinen beiden Brüdern
  rationale: Die Formulierung gibt die ausdrücklich genannte Zahl zwei idiomatisch deutsch wieder.
- source_word: בַּחוּץ
  choice: draußen
  rationale: Das Wort bezeichnet den Ort außerhalb und bildet wahrscheinlich den Gegensatz zum Inneren des Zeltes; „draußen“ ist knapp und natürlich.
theological_decisions:
- issue: Bedeutung von „die Blöße seines Vaters“ in dieser Erzählung
  choice: Die hebräische Wendung wird wörtlich als „die Blöße seines Vaters“ wiedergegeben, ohne über das Sehen des entblößten Noah hinaus eine bestimmte sexuelle Handlung festzulegen.
  alternative: Die Wendung könnte als Euphemismus für ein schwereres sexuelles Vergehen oder im Licht späterer Gesetzestexte für einen mit der Mutter verbundenen Inzest verstanden werden.
  rationale: In manchen alttestamentlichen Zusammenhängen kann die Wendung sexuelle Nebenbedeutungen tragen. Dieser Vers sagt jedoch ausdrücklich, dass Ham sah und anschließend seinen Brüdern davon erzählte; der unmittelbare Zusammenhang handelt von Noahs Entblößung. Haupttext und Fußnote bewahren daher die Auslegungsfrage, statt sie zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung setzt „draußen“ unmittelbar vor die Empfänger der Mitteilung und lässt wie im Hebräischen offen, ob die Ortsangabe vor allem die Brüder oder den Vorgang des Erzählens näher bestimmt.
