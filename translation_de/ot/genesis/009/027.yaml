source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: de
  text: Gott schaffe Jafet weiten Raum[a], und er wohne in den Zelten Sems; und Kanaan sei ihnen ein Sklave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott mache Jafet weit.« Bei »und er wohne« bleibt im Hebräischen das Subjekt unausgesprochen; gemeint sein kann: »Gott wohne in den Zelten Sems« oder: »Jafet wohne in den Zelten Sems.«'
    reason: Der erste Satz erlaubt eine wörtlichere Wiedergabe, und das unausgesprochene Subjekt des folgenden Verbs schafft eine echte Mehrdeutigkeit zwischen Gott und Jafet.
lexical_decisions:
- source_word: יַפְתְּ
  choice: schaffe … weiten Raum
  rationale: Der Jussiv bezeichnet hier wahrscheinlich das Weiten beziehungsweise Raum-Schaffen und bildet ein Wortspiel mit dem Namen Jafet. Die idiomatische deutsche Formulierung bewahrt den räumlichen Sinn, auch wenn der Lautanklang nur begrenzt nachgebildet werden kann.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt ist wegen des singularischen Verbs und des Kontextes der eine Gott gemeint.
- source_word: לְיֶפֶת
  choice: Jafet
  rationale: Die Präposition ל wird in der deutschen Konstruktion »Jafet weiten Raum schaffen« idiomatisch wiedergegeben.
- source_word: וְיִשְׁכֹּן
  choice: und er wohne
  rationale: Der Jussiv von שכן wird volitiv wiedergegeben. Das maskuline Singularpronomen lässt den im Hebräischen nicht ausdrücklich genannten Bezug auf Gott oder Jafet offen.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: in den Zelten Sems
  rationale: Die konkrete Zeltmetaphorik und die direkte Ortsangabe werden bewahrt.
- source_word: וִיהִי
  choice: aber sei
  rationale: Der Jussiv von היה setzt den Segens- und Fluchspruch fort; »sei« ist im Deutschen knapp und würdig. »Aber« markiert den inhaltlichen Übergang zur Unterordnung Kanaans.
- source_word: כְנַעַן
  choice: Kanaan
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Die erzwungene Unterordnung ist hier zentral; »Sklave« gibt den Status deutlicher wieder als das abschwächende »Diener«.
- source_word: לָמוֹ
  choice: ihnen
  rationale: Die pronominale Form wird entsprechend ihrem hier naheliegenden pluralischen Gebrauch wiedergegeben und bezieht sich im Zusammenhang auf Sem und Jafet.
theological_decisions:
- issue: Subjekt von »und er wohne in den Zelten Sems«
  choice: Das Subjekt bleibt im Haupttext durch »er« unbestimmt.
  alternative: Ausdrücklich entweder »Gott wohne in den Zelten Sems« oder »Jafet wohne in den Zelten Sems«.
  rationale: Das hebräische Verb hat kein ausdrücklich genanntes Subjekt; sowohl Gott als auch Jafet kommen im Kontext als Bezug infrage. Die echte Auslegungsambiguität wird daher nicht aufgelöst, sondern in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die jussivische Spruchform wird mit Konjunktiv I wiedergegeben. Konkrete Bilder wie »Zelte« bleiben erhalten; »Sklave« vermeidet eine sachlich unangemessene Abschwächung.
