base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: de
  text: Da nahmen Sem und Jafet das Gewand[a], legten es sich beide auf die Schultern, gingen rückwärts und bedeckten die Blöße ihres Vaters. Ihre Gesichter waren abgewandt, und die Blöße ihres Vaters sahen sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Mantel; gemeint ist ein äußeres Kleidungsstück, mit dem Noah bedeckt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahmen
  rationale: Das erzählende Wayyiqtol von לקח bezeichnet hier schlicht das Ergreifen beziehungsweise Nehmen des Gewandes; das deutsche Präteritum führt die Handlung natürlich fort.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem und Jafet
  rationale: Die Namen folgen den im modernen Deutschen üblichen biblischen Formen.
- source_word: הַשִּׂמְלָה
  choice: das Gewand
  rationale: שׂמלה bezeichnet ein Kleidungsstück, häufig ein Obergewand oder einen Mantel. „Gewand“ bleibt konkret, würdevoll und vermeidet eine unnötige Festlegung auf eine bestimmte Form.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: legten es sich beide auf die Schultern
  rationale: Die hebräische Wendung lautet annähernd „legten es auf die Schulter ihrer beiden“. Die deutsche Fassung gibt verständlich wieder, dass beide das Gewand gemeinsam auf ihren Schultern trugen.
- source_word: אֲחֹרַנִּית
  choice: rückwärts / nach hinten gewandt
  rationale: Das Adverb beschreibt zunächst ihre rückwärtige Bewegung und danach die abgewandte Ausrichtung ihrer Gesichter. Im Deutschen erfordert der jeweilige Satzbau unterschiedliche, aber inhaltlich entsprechende Formulierungen.
- source_word: וַיְכַסּוּ
  choice: bedeckten
  rationale: כסה bedeutet in diesem konkreten Zusammenhang „bedecken“.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: die Blöße ihres Vaters
  rationale: „Blöße“ bewahrt die konkrete Bedeutung der entblößten Nacktheit sowie den mit Scham und Würde verbundenen Unterton des hebräischen Ausdrucks.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Ihre Gesichter waren dabei nach hinten gewandt
  rationale: Der hebräische Nominalsatz wird im Deutschen mit „waren … gewandt“ ergänzt. Die Orientierung weg vom Vater bleibt ausdrücklich erhalten.
- source_word: לֹא רָאוּ
  choice: sahen sie nicht
  rationale: Das negierte Verb ראה wird ohne zusätzliche Deutung schlicht mit „nicht sehen“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „die Blöße ihres Vaters“
  choice: Noahs entblößter Körper, den Sem und Jafet respektvoll bedecken
  alternative: Eine euphemistische sexuelle Bedeutung, wie sie bestimmte Wendungen mit „Blöße“ in späteren Texten haben können
  rationale: 'Die unmittelbare Handlung ist konkret: Die Söhne nehmen ein Gewand, gehen rückwärts, bedecken ihren Vater und vermeiden es, ihn anzusehen. Die Übersetzung behält dennoch die hebräische Wendung „die Blöße ihres Vaters“ bei und legt keine weitergehende sexuelle Deutung in den Text hinein.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „die Blöße ihres Vaters“ wird entsprechend dem Hebräischen beibehalten; zugleich wird die hebräische Satzstruktur behutsam idiomatisch geglättet.
