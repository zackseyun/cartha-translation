base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: de
  text: Diese drei waren die Söhne Noahs, und von ihnen her wurde die ganze Erde bevölkert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und von diesen her zerstreute sich die ganze Erde“ oder „… breitete sich die ganze Erde aus“. Gemeint sind die Menschen, die die Erde bewohnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה בְּנֵי נֹחַ
  choice: Diese drei waren die Söhne Noahs
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. Im erzählenden Zusammenhang ergänzt das Deutsche natürlich „waren“; die vorangestellte Wendung „Diese drei“ bewahrt die Hervorhebung.
- source_word: וּמֵאֵלֶּה
  choice: und von ihnen aus
  rationale: מִן mit dem Demonstrativ bezeichnet den Ausgangspunkt. „Von ihnen aus“ verweist idiomatisch und eindeutig auf die drei genannten Söhne.
- source_word: נָפְצָה
  choice: breitete sich … aus
  rationale: Das Verb נפץ hat den Grundsinn des Zerstreuens bzw. Sich-Ausbreitens. Die Wiedergabe wahrt dieses Bild, ohne die Erde selbst missverständlich als handelnde Landmasse erscheinen zu lassen; gemeint ist im Kontext ihre Bevölkerung.
- source_word: כָל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im universalen Zusammenhang nach der Flut und vor der Völkertafel ist „die ganze Erde“ am wahrscheinlichsten.
theological_decisions:
- issue: Bezug von נָפְצָה כָל הָאָרֶץ
  choice: Die ganze Erde steht metonymisch für ihre sich ausbreitende Bevölkerung.
  alternative: Die ganze Erde wurde bevölkert.
  rationale: Die Übersetzung erhält die konkrete Bildsprache des hebräischen Verbs und macht durch eine Fußnote transparent, dass die Menschen bzw. Bevölkerung der Erde gemeint sind, ohne die Aussage auf eine bloße Bevölkerungsangabe zu reduzieren.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der zusammenfassende nachsintflutliche und genealogische Kontext spricht für den weltweiten Horizont; die lexikalisch mögliche lokale Lesart wird hier nicht bevorzugt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Bildsprache, während die Fußnote die gemeinte Bevölkerung ausdrücklich erläutert.
