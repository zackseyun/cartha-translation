  source_fidelity: 'Der Entwurf gibt alle Sinnelemente des Hebräischen vollständig und in ihrer Reihenfolge wieder: Gottes Segnung Noahs und seiner Söhne, die Anrede an sie sowie die dreigliedrige Imperativfolge. »Seid fruchtbar, vermehrt euch und füllt die Erde« bewahrt zudem angemessen den sprachlichen Bezug zu Genesis 1,28. »Die Erde« ist im Kontext eine gut begründete Wiedergabe von הָאָרֶץ, ohne die mögliche Bedeutung »Land« zu verschweigen.'
