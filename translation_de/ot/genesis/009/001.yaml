  terminology: Die Namenform »Noah«, die Gottesbezeichnung »Gott« und die zentralen Begriffe »segnete«, »fruchtbar«, »vermehrt euch« und »Erde« sind terminologisch stimmig. Es wird keine konfessionell einengende Deutung eingeführt.
