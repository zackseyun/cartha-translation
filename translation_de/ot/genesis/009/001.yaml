id: GEN.9.1
reference: Genesis 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: de
  text: 'Und Gott segnete Noah und seine Söhne und sagte zu ihnen: »Seid fruchtbar, vermehrt euch und füllt die Erde.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch »das Land« bedeuten; hier passt wegen des Zusammenhangs nach der Flut und des Anklangs an 1. Mose 1,28 am besten »die Erde«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Das Piel von ברך bezeichnet hier die wirksame Zuwendung beziehungsweise Verleihung des Segens; »segnete« ist präzise, natürlich und im biblischen Zusammenhang etabliert.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang bezeichnet אֱלֹהִים den einen Gott.
- source_word: נֹחַ
  choice: Noah
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich Noahs Söhne, nicht allgemein seine Kinder.
- source_word: וַיֹּאמֶר לָהֶם
  choice: und sagte zu ihnen
  rationale: Die schlichte Erzählformel wird ohne zusätzliche interpretierende Aussagekraft wiedergegeben.
- source_word: פְּרוּ
  choice: Seid fruchtbar
  rationale: Die traditionelle und zugleich verständliche Wendung bewahrt den bewussten sprachlichen Rückbezug auf Genesis 1,28.
- source_word: וּרְבוּ
  choice: vermehrt euch
  rationale: Die reflexive Form ist im Deutschen die natürliche Wiedergabe des Imperativs und bezeichnet zahlenmäßige Zunahme.
- source_word: וּמִלְאוּ
  choice: füllt
  rationale: מלא bedeutet hier »füllen«; eine stärker deutende Umschreibung wie »bevölkert« ist nicht nötig.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Zusammenhang nach der Flut ist die ganze Erde gemeint; zugleich bleibt so der Anklang an Genesis 1,28 erhalten.
theological_decisions:
- issue: Beziehung zum Schöpfungsauftrag in Genesis 1,28
  choice: Die Formulierung »Seid fruchtbar, vermehrt euch und füllt die Erde« wird beibehalten.
  alternative: »Habt viele Nachkommen und bevölkert die Erde.«
  rationale: Die hebräische Wortfolge greift gezielt die Sprache des ursprünglichen Schöpfungssegens auf. Eine eng entsprechende Formulierung bewahrt die theologische Kontinuität, ohne sie erklärend auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Imperativfolge bleibt knapp und einprägsam; »Seid fruchtbar« bewahrt bewusst den biblischen Rückbezug, ohne altertümlich zu wirken.
