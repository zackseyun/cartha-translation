  - severity: low
    issue: Die Fußnote eröffnet eine nicht vom masoretischen Wortlaut geforderte Singularlesart.
    rationale: לָמוֹ ist formal „ihnen“. Ohne Angabe einer konkreten abweichenden Textüberlieferung würde die Fußnote unnötig Zweifel an der klar übersetzten Form wecken.
