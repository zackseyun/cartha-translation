  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: de
  text: 'Und er sagte: »Gepriesen sei der HERR, der Gott Sems! Kanaan sei ihnen ein Diener.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die Segensformel preist hier den HERRN; die deutsche Wunschform bewahrt den poetischen und feierlichen Ton.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
- source_word: אֱלֹהֵי שֵׁם
  choice: der Gott Sems
  rationale: Der Status constructus wird natürlich und präzise durch den deutschen Genitiv wiedergegeben.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im Zusammenhang mit Kanaans Unterordnung bezeichnet das Wort nicht bloß einen freiwilligen Diener; »Sklave« gibt die Härte der Aussage deutlich wieder.
- source_word: לָמוֹ
  choice: ihnen
  rationale: Die Form ist ihrem gewöhnlichen grammatischen Wert nach pluralisch; zugleich wird die mögliche poetisch-singularische Deutung in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezugsgröße des pronominalen Suffixes לָמוֹ
  choice: ihnen
  alternative: ihm
  rationale: Der hebräische Wortlaut verwendet formal eine pluralische Form, deren Bezug im unmittelbaren Satz nicht ausdrücklich aufgelöst wird. Die Übersetzung folgt dieser Form, ohne die überlieferte singularische Deutung auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. »Sems« ist der geläufige deutsche Genitiv des Namens Sem; »sei« erhält den Segens- und Spruchcharakter.
