source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: de
  text: Furcht vor euch und Schrecken vor euch werden auf jedem Tier der Erde und auf jedem Vogel des Himmels liegen, auf allem, was auf dem Erdboden kriecht, und auf allen Fischen des Meeres. In eure Hand sind sie gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In eure Hand gegeben“ bedeutet: eurer Macht oder Verfügungsgewalt übergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם
  choice: Furcht vor euch
  rationale: מוֹרָא bezeichnet hier die von den Menschen ausgelöste Furcht. „Furcht vor euch“ gibt den objektiven Genitiv im Deutschen klar und natürlich wieder.
- source_word: חִתְּכֶם
  choice: Schrecken vor euch
  rationale: חִתָּה bezeichnet Schrecken oder Entsetzen. „Schrecken“ wahrt die Steigerung gegenüber „Furcht“, ohne die Aussage unnötig zu verschärfen.
- source_word: יִהְיֶה
  choice: werden … liegen
  rationale: Das Imperfekt beschreibt den künftig bzw. fortan bestehenden Zustand. Die deutsche Wendung „auf … liegen“ bewahrt zugleich die hebräische Konstruktion mit עַל.
- source_word: חַיַּת הָאָרֶץ
  choice: allen Tieren der Erde
  rationale: חַיָּה bezeichnet in diesem umfassenden Zusammenhang Landtiere. „Tiere“ ist im modernen Deutsch natürlicher als „Getier“ oder „Bestien“ und vermeidet eine unbegründete Beschränkung auf wilde Tiere.
- source_word: עוֹף הַשָּׁמָיִם
  choice: allen Vögeln des Himmels
  rationale: עוֹף wird kontextgemäß mit „Vögel“ wiedergegeben; „Himmel“ bewahrt die gewöhnliche biblische Bedeutung von שָׁמַיִם und ist auch im modernen Deutsch verständlich.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: auf allem, was sich auf dem Erdboden regt
  rationale: רמשׂ kann kriechen oder sich regen/bewegen bezeichnen. „Sich regt“ erhält den kollektiven und relativ weiten Sinn; „Erdboden“ unterscheidet אֲדָמָה von dem zuvor stehenden אֶרֶץ.
- source_word: דְּגֵי הַיָּם
  choice: allen Fischen des Meeres
  rationale: Die Wendung bezeichnet umfassend die Fische des Meeres und fügt sich parallel in die Aufzählung ein.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: In eure Hand sind sie gegeben
  rationale: Die wörtlich bewahrte Hand-Metapher bezeichnet die Übergabe in menschliche Macht oder Verfügungsgewalt. Das Passiv bleibt erhalten und wird nicht durch eine stärkere Deutung ersetzt.
theological_decisions:
- issue: Menschliche Herrschaft über die Tiere nach der Flut
  choice: Die Tiere werden in die Hand der Menschen gegeben und fürchten sich vor ihnen.
  alternative: 'Explizit deutend: „Sie sind eurer Herrschaft unterstellt.“'
  rationale: Die Formulierung bewahrt das reale Macht- und Verfügungsverhältnis, das die hebräische Hand-Metapher ausdrückt, ohne daraus weitergehende ethische oder dogmatische Folgerungen in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Doppelung „Furcht vor euch und Schrecken vor euch“ bewahrt die hebräische Parallelität und Intensivierung. Die Satzfolge folgt dem hebräischen Gedankengang, während die Verbklammer für natürliches Deutsch angepasst ist.
