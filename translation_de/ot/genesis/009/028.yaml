  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: de
  text: Nach der Flut lebte Noah dreihundertfünfzig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: Das Wayyiqtol von חיה beschreibt hier die weitere Lebensdauer Noahs nach der Flut. „Lebte … noch“ gibt den zeitlichen Fortbestand im Deutschen natürlich wieder, ohne wie „überlebte“ die Rettung statt der Dauer hervorzuheben.
- source_word: נֹחַ
  choice: Noah
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens נֹחַ.
- source_word: אַחַר
  choice: nach
  rationale: Die Präposition bezeichnet die zeitliche Folge; „nach“ ist die schlichte und idiomatische deutsche Entsprechung.
- source_word: הַמַּבּוּל
  choice: der Flut
  rationale: Der bestimmte Ausdruck verweist auf die aus dem Zusammenhang bekannte Flut. „Flut“ ist im heutigen Deutsch klarer und natürlicher als „Sintflut“, dessen Vorsilbe missverständlich als Bezug auf Sünde verstanden werden kann.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: dreihundertfünfzig Jahre
  rationale: Die beiden hebräischen Zahlenglieder ergeben zusammen 350 Jahre. Die Zusammenschreibung entspricht der deutschen Rechtschreibung und die Pluralform „Jahre“ dem deutschen Sprachgebrauch.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Die Satzstellung setzt wie der hebräische Text die Zeitangabe an den Anfang; „noch“ verdeutlicht idiomatisch, dass die genannte Lebenszeit auf die Flut folgte.
