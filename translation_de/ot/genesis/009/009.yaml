  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: de
  text: Und ich – siehe, ich richte meinen Bund mit euch und mit euren Nachkommen, die nach euch kommen, auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „mit eurem Samen“. Das hebräische Wort ist ein Kollektivbegriff und kann die Nachkommenschaft beziehungsweise die Nachkommen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Gottes eigenes Handeln hervor. „Und ich“ bewahrt diese Betonung in natürlichem Deutsch; der Gedankenstrich markiert den leichten Neuansatz.
- source_word: הִנְנִי
  choice: sieh
  rationale: Die Partikel lenkt feierlich und nachdrücklich die Aufmerksamkeit auf das folgende Handeln. „Sieh“ ist gegenwärtig verständlich und weniger altertümlich als „siehe“.
- source_word: מֵקִים
  choice: ich richte … auf
  rationale: Das Hifil-Partizip von קום bezeichnet hier das Inkraftsetzen bzw. Aufrichten des Bundes. Die deutsche Präsensform gibt den performativen, unmittelbar vollzogenen Akt angemessen wieder, ohne eine bloße Bestätigung vorauszusetzen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die etablierte und sachlich passende Wiedergabe von בְּרִית im Verhältnis Gottes zu Menschen.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Die Präposition bezeichnet unmittelbar die am Bund Beteiligten und wird idiomatisch mit „mit euch“ wiedergegeben.
- source_word: וְאֶת זַרְעֲכֶם
  choice: und mit euren Nachkommen
  rationale: זֶרַע ist ein Kollektivbegriff für die aus ihnen hervorgehende Nachkommenschaft. „Nachkommen“ ist in modernem Deutsch natürlich; das zweite „mit“ wird aus der parallelen Konstruktion ergänzt.
- source_word: אַחֲרֵיכֶם
  choice: nach euch
  rationale: Die knappe Wendung bewahrt die zeitliche Generationenfolge des Hebräischen.
theological_decisions:
- issue: Bundesterminologie im Verhältnis Gottes zu Menschen
  choice: meinen Bund
  alternative: meine Vereinbarung / meinen Vertrag
  rationale: „Bund“ bewahrt die biblische Beziehungskategorie, ohne zusätzliche konfessionelle Deutungen einzutragen.
- issue: Bedeutung von מֵקִים für den Bund
  choice: richte … auf
  alternative: bestätige / erhalte aufrecht
  rationale: Der Kontext spricht vom Einsetzen des Bundes. „Aufrichten“ lässt den feierlichen Vollzugscharakter erkennen, ohne eine frühere Bundesschließung oder bloße Fortführung vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ erhält den feierlichen Aufmerksamkeitsruf ohne das stärker altertümliche „siehe“. Die Wortstellung und der Gedankenstrich bewahren die Hervorhebung des göttlichen „Ich“.
