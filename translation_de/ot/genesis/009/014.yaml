  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: de
  text: Und wenn ich Wolken über die Erde bringe, wird der Bogen[a] in der Wolke sichtbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Regenbogen“. Das Hebräische verwendet das gewöhnliche Wort für einen Bogen; im Zusammenhang bezeichnet es den Regenbogen als Zeichen des Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und wenn
  rationale: Die Konstruktion leitet einen zukünftigen zeitlichen Umstand ein. „Und wenn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: בְּעַנְנִי עָנָן
  choice: ich Wolken … aufziehen lasse
  rationale: Das denominative Verb ענן bezeichnet hier das Bedecken mit Wolken; das folgende singularische עָנָן kann kollektiv verstanden werden. „Wolken aufziehen lassen“ ist idiomatisch und bewahrt Gottes Verursachung des Vorgangs.
- source_word: עַל הָאָרֶץ
  choice: über der Erde
  rationale: „Erde“ entspricht im Zusammenhang des universalen Flutbundes besser dem umfassenden Sinn als das örtlichere „Land“.
- source_word: וְנִרְאֲתָה
  choice: wird … sichtbar
  rationale: Der Nifal von ראה bezeichnet das Gesehenwerden beziehungsweise Sichtbarwerden; die Formulierung bewahrt diesen Sinn in natürlichem Deutsch.
- source_word: הַקֶּשֶׁת
  choice: der Bogen
  rationale: קֶשֶׁת ist das gewöhnliche hebräische Wort für einen Bogen. Im Zusammenhang bezeichnet es den Regenbogen, doch „der Bogen“ erhält das Bild des Ausgangstextes.
- source_word: בֶּעָנָן
  choice: in der Wolke
  rationale: Der hebräische Ausdruck steht im Singular mit Artikel und wird entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe von קֶשֶׁת als Bundeszeichen
  choice: der Bogen
  alternative: der Regenbogen
  rationale: Die wörtliche Benennung bewahrt die mögliche Bildbeziehung zum gewöhnlichen Bogen, ohne den im Kontext klaren Bezug auf den Regenbogen zu bestreiten; dieser wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen zeitlichen Gefüge, während „Wolken aufziehen lassen“ eine natürliche deutsche Wiedergabe des Verbalbildes bietet.
