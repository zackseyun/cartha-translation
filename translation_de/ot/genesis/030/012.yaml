lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Wayyiqtol von ילד führt das nächste Ereignis der Erzählung ein. „Gebar“ ist in diesem Geburtsbericht knapp, natürlich und würdevoll.
- source_word: זִלְפָּה
  choice: Silpa
  rationale: Der Personenname wird in der im Deutschen bibelsprachlich etablierten Form wiedergegeben.
- source_word: שִׁפְחַת לֵאָה
  choice: Leas Dienerin
  rationale: Die Statusbezeichnung שִׁפְחָה meint eine Le(a) zugeordnete weibliche Dienerin beziehungsweise Sklavin. „Dienerin“ ist verständlich und idiomatisch; die Fußnote macht die stärkere soziale Abhängigkeit des hebräischen Ausdrucks sichtbar.
- source_word: בֵּן שֵׁנִי
  choice: einen zweiten Sohn
  rationale: Die Formulierung bezeichnet den zweiten Sohn, den Silpa Jakob in diesem Erzählzusammenhang gebar.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Die Präposition לְ kennzeichnet in der Geburtsformel den Vater beziehungsweise den Begünstigten. Die deutsche Konstruktion „jemandem einen Sohn gebären“ gibt dies knapp wieder.
