  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: de
  text: Und Silpa, Leas Dienerin[a], gebar Jakob einen zweiten Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leas Sklavin“. Das hebräische Wort bezeichnet eine Frau in einem abhängigen Dienst- oder Sklavenverhältnis, die Lea zugeordnet war.'
