  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: de
  text: Da dachte Gott an Rahel[a]. Gott hörte sie[b] und öffnete ihren Mutterleib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da nahm Gott Rahel wahr“ beziehungsweise „Da wandte Gott sich Rahel zu“. Das hebräische „an jemanden denken“ bezeichnet hier Gottes wohlwollende Zuwendung, die zum Handeln führt; es bedeutet nicht, dass Gott Rahel vergessen hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erhörte sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Da dachte … an
  rationale: Die Wendung bewahrt das hebräische Erinnerungsidiom in natürlichem Deutsch. Im Zusammenhang bezeichnet es Gottes wirksame, wohlwollende Zuwendung, ohne vorauszusetzen, dass Gott Rahel zuvor vergessen hatte.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier mit Verben im Singular und bezeichnet eindeutig den einen Gott.
- source_word: אֶת רָחֵל
  choice: Rahel
  rationale: אֶת kennzeichnet Rahel als direktes Objekt; die geläufige deutsche Namensform wird verwendet.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: Gott hörte auf sie
  rationale: שׁמע mit אֶל drückt aufmerksames, wirksames Hören aus. „Auf sie hören“ bewahrt diese relationale und responsive Nuance, ohne das Ergebnis als ausdrückliche Gebetserhörung auszudeuten.
- source_word: וַיִּפְתַּח
  choice: öffnete
  rationale: Die konkrete Bedeutung von פתח und das bildhafte hebräische Idiom bleiben erhalten.
- source_word: רַחְמָהּ
  choice: ihren Mutterleib
  rationale: רֶחֶם bedeutet „Mutterleib“. Die konkrete biblische Ausdrucksweise wird nicht durch eine erklärende Umschreibung wie „machte sie empfängnisfähig“ ersetzt.
- source_word: וַ
  choice: Da / und
  rationale: Das erste וַ führt den nächsten Handlungsschritt ein und wird idiomatisch mit „Da“ wiedergegeben; vor der letzten Handlung wahrt „und“ die fortlaufende Reihung. Der zweite Satz vermeidet eine schwerfällige dreifache Und-Kette.
theological_decisions:
- issue: Anthropomorphe Aussage, dass Gott an Rahel „dachte“
  choice: Das biblische Erinnerungsidiom bleibt im Haupttext als „dachte … an“ erhalten.
  alternative: „wandte sich Rahel zu“ oder „nahm Rahel wahr“
  rationale: זכר bezeichnet hier nicht bloß mentale Erinnerung, sondern Gottes wohlwollende Zuwendung, die zum Handeln führt. Eine rein erklärende Wiedergabe würde das wiederkehrende biblische Idiom einebnen; die Fußnote schützt zugleich vor dem Missverständnis, Gott habe Rahel vergessen.
- issue: Bedeutung von Gottes Hören
  choice: „hörte auf sie“
  alternative: „hörte sie“ oder „erhörte sie“
  rationale: Die Formulierung hält die Spannung zwischen aufmerksamem Hören und wirksamer Reaktion fest. „Erhörte“ wäre im Deutschen theologisch stärker festgelegt, als die hebräische Konstruktion für sich genommen verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mutterleib“ erhält das konkrete biblische Bild; „Da dachte Gott an Rahel“ klingt natürlicher als das missverständliche „Gott erinnerte sich an Rahel“. Beide Fußnotenmarker stehen an den jeweils erläuterten Wendungen im Haupttext.
