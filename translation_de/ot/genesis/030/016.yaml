base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: de
  text: 'Als Jakob am Abend vom Feld kam, ging Lea hinaus, um ihm entgegenzugehen, und sagte: »Du musst zu mir kommen, denn ich habe dich gegen die Alraunen meines Sohnes gemietet.[a]« Und er schlief in jener Nacht mit ihr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verstärkt die Aussage durch die Verbindung von »mieten« mit einer Form desselben Verbs: sinngemäß »ich habe dich tatsächlich gemietet«. Die Alraunen werden als Preis beziehungsweise Gegenleistung der Vereinbarung genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה ... בָּעֶרֶב
  choice: Als Jakob am Abend vom Feld kam
  rationale: Die Zeit- und Ortsangaben werden in natürlicher deutscher Satzstellung wiedergegeben; בוא bezeichnet hier Jakobs Rückkehr vom Feld.
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: ging Lea hinaus, ihm entgegen
  rationale: Die Bewegungsrichtung von יצא und die feste Verbindung לִקְרָאתוֹ bleiben erhalten, ohne das Hebräische unnötig zu glätten.
- source_word: אֵלַי תָּבוֹא
  choice: Du sollst zu mir kommen
  rationale: Die Formulierung bewahrt das Bewegungsverb und gibt Leas bestimmten, beanspruchenden Ton wieder. Der sexuelle Sinn ergibt sich aus dem Zusammenhang, ohne expliziter zu werden als der Ausgangstext.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: ich habe dich ... gemietet
  rationale: Das Verb שׂכר wird lexikalisch direkt mit „mieten“ wiedergegeben. Die hebräische Verstärkung durch Infinitivus absolutus und finites Verb lässt sich im Deutschen nicht ohne stilistische Überzeichnung wörtlich verdoppeln; sie wird durch Leas bestimmte Aussage im Zusammenhang vermittelt und in der Fußnote erläutert.
- source_word: בְּדוּדָאֵי בְנִי
  choice: für die Liebesäpfel meines Sohnes
  rationale: דּוּדָאִים bezeichnet hier die traditionell als Alraunen beziehungsweise deren Früchte verstandenen „Liebesäpfel“. „Für“ gibt בְּ als Preis beziehungsweise Gegenleistung der Vereinbarung natürlich wieder.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: er schlief ... mit ihr
  rationale: „Mit jemandem schlafen“ ist im modernen Deutschen die natürliche, würdige Entsprechung des hebräischen sexuellen Euphemismus.
- source_word: בַּלַּיְלָה הוּא
  choice: in jener Nacht
  rationale: Das rückweisende Pronomen הוּא wird idiomatisch durch „jener“ aufgenommen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Liebesäpfel“ bewahrt die traditionelle, kontextuell aussagekräftige Bezeichnung; die heute geläufigere botanische Bezeichnung lautet „Alraunen“. Die direkte Rede bleibt bestimmt, ohne den im Hebräischen nur kontextuell ausgedrückten sexuellen Sinn unnötig zu explizieren.
