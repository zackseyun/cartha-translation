  source_fidelity: 'Der Entwurf gibt alle Satzglieder des Hebräischen wieder: Jakobs Rückkehr vom Feld am Abend, Leas Hinausgehen zur Begegnung, ihre nachdrückliche Forderung, die Gegenleistung in den Dudaim und das Beilager in derselben Nacht. Die Wiedergabe von שׂכר durch „mieten“ ist semantisch vertretbar, wirkt mit einer Person als Objekt im Deutschen jedoch unnötig sachlich und missverständlich. „Gegen die Alraunen meines Sohnes gemietet“ macht die im Kontext gemeinte Tauschgegenleistung klar, ohne über den Text hinauszugehen. Der Infinitivus absolutus vor dem finiten Verb signalisiert Nachdruck; die Fußnote beschreibt dies angemessen, ohne eine zwingende deutsche Verstärkungsform zu behaupten.'
