base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: de
  text: Gib mir meine Ehefrauen und meine Kinder[a], für die ich dir gedient habe, damit ich gehen kann; denn du weißt, welchen Dienst ich dir geleistet habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen derer ich dir gedient habe“. Die feminine Pluralform kann sich besonders auf die Ehefrauen beziehen, nicht notwendigerweise auf die ganze zuvor genannte Familie.'
    reason: lexical_alternative
  - marker: b
    text: „Dienst“ kann auch mit „Arbeit“ oder „Mühe“ wiedergegeben werden. Das hebräische Substantiv gehört zu demselben Wortstamm wie das zuvor mit „gedient“ übersetzte Verb.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Gib mir
  rationale: Der Imperativ von נתן ist an Laban gerichtet; das im Zusammenhang vorausgesetzte indirekte Objekt wird im Deutschen natürlich mit „mir“ ausgedrückt.
- source_word: נָשַׁי
  choice: meine Frauen
  rationale: Der Kontext bezeichnet Jakobs Ehefrauen. „Meine Frauen“ ist im heutigen Deutsch natürlich und entspricht dem Plural mit Suffix.
- source_word: יְלָדַי
  choice: meine Kinder
  rationale: „Kinder“ ist hier die gewöhnliche und kontextgemäße Wiedergabe für Jakobs Nachkommen.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: für die ich dir gedient habe
  rationale: Die Wendung bezeichnet die Frauen beziehungsweise die zuvor genannte Familie als Anlass oder Gegenstand von Jakobs Dienst. Die grammatische Rückbeziehung bleibt in einer Fußnote erläutert.
- source_word: וְאֵלֵכָה
  choice: damit ich gehen kann
  rationale: Der Kohortativ bringt Jakobs beabsichtigten Aufbruch zum Ausdruck; die deutsche Formulierung ist natürlich und bewahrt den volitiven Sinn.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Jakobs Forderung ein.
- source_word: יָדַעְתָּ
  choice: du weißt
  rationale: Das Perfekt hat hier gegenwärtige Relevanz und wird idiomatisch im deutschen Präsens wiedergegeben.
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: welchen Dienst ich dir geleistet habe
  rationale: „Dienst“ bewahrt die Verbindung zum Stamm עבד; „geleistet“ vermeidet im Deutschen die schwerfällige Wiederholung „Dienst, mit dem ich dir gedient habe“, ohne den Sinn zu verändern.
