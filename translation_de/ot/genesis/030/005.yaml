  text: וַ/תַּ֣הַר בִּלְהָ֔ה וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/005.yaml
  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: de
  text: Bilha wurde schwanger und gebar Jakob einen Sohn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden beziehungsweise Empfangen. „Wurde schwanger“ ist im heutigen Deutsch natürlich und bewahrt den einsetzenden Vorgang der hebräischen Formulierung.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: ילד bedeutet in diesem Zusammenhang „gebären“ beziehungsweise „zur Welt bringen“. „Gebar“ ist knapp, würdig und passt zur erzählenden Ausdrucksweise.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Die Präposition ל bezeichnet hier die Zuordnung des Kindes zu Jakob. Der deutsche Dativ in „gebar Jakob einen Sohn“ gibt dies idiomatisch wieder, ohne das mögliche „für Jakob“ unnötig zu überbetonen.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בֵּן bedeutet „Sohn“; der unbestimmte Artikel und der Akkusativ sind durch die deutsche Syntax erforderlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die parallele Abfolge „wurde schwanger und gebar“ bildet die beiden hebräischen Verben klar ab; eine Fußnote ist nicht erforderlich.
