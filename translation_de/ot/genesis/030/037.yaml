base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: de
  text: Da nahm sich Jakob frische Stäbe von Pappel[a], Mandelbaum und Platane und schälte an ihnen weiße Streifen ab, indem er das Weiße freilegte, das an den Stäben war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Storaxbaum“; welche Baumart mit dem hebräischen Wort gemeint ist, lässt sich nicht sicher bestimmen. Häufig wird es mit „Pappel“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: Zweige
  rationale: Gemeint sind abgeschnittene, noch frische Hölzer. „Zweige“ ist im Deutschen konkreter und natürlicher als „Stäbe“ und passt zum Abschälen der Rinde.
- source_word: לִבְנֶה לַח
  choice: frische Zweige von der Pappel
  rationale: לַח bezeichnet frisches beziehungsweise noch feuchtes, grünes Holz. לִבְנֶה wird häufig als Pappel bestimmt, doch die genaue Baumart bleibt unsicher.
- source_word: לוּז
  choice: Mandelbaum
  rationale: Die botanisch wahrscheinlichere Bestimmung ist Mandelbaum; die traditionelle Wiedergabe „Hasel“ ist weniger wahrscheinlich.
- source_word: עֶרְמוֹן
  choice: Platane
  rationale: Das hebräische Wort wird am ehesten als Platane verstanden; ältere Wiedergaben wie „Kastanie“ gelten als weniger wahrscheinlich.
- source_word: וַיְפַצֵּל
  choice: schälte
  rationale: Im Zusammenhang bezeichnet das Verb das stellenweise Entfernen der Rinde.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: weiße Streifen
  rationale: Die abgeschälten Stellen erscheinen als weiße Streifen; diese Wiedergabe vermittelt das sichtbare Ergebnis idiomatisch.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: legte so das Weiße … frei
  rationale: Die Formulierung bewahrt den Gedanken des Freilegens und macht verständlich, dass durch das Schälen das helle Holz sichtbar wurde.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: an den Zweigen
  rationale: „An“ gibt עַל hier natürlich wieder und bezeichnet das Weiße, das durch das Entfernen der Rinde an den Zweigen sichtbar wurde.
