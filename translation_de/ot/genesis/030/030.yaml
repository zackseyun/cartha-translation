base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: de
  text: 'Denn das Wenige, das du vor meiner Ankunft hattest, hat sich stark vermehrt, und Jahwe hat dich bei meinem Kommen[a] gesegnet. Und nun: Wann werde auch ich für meinen eigenen Haushalt sorgen?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »zu meinem Fuß«; die Wendung kann »bei meinem Kommen« oder »um meinetwillen/durch mich« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wann werde auch ich etwas für mein eigenes Haus tun?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: das Wenige, das du vor meiner Ankunft hattest
  rationale: לְפָנַי bedeutet formal „vor mir“, bezeichnet hier im zeitlichen Kontrast aber den Besitz Labans vor Jakobs Ankunft. Die Wiedergabe macht diesen im Kontext klaren Bezug natürlich verständlich.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: hat sich zu einer großen Menge vermehrt
  rationale: פרץ bezeichnet hier eine starke, geradezu durchbrechende Zunahme; לָרֹב benennt das Ergebnis als große Menge beziehungsweise Fülle.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְרַגְלִי
  choice: durch mein Kommen
  rationale: Wörtlich „an meinem Fuß“. Die idiomatische Wendung kann die mit Jakobs Ankunft verbundene oder durch ihn bewirkte Segnung bezeichnen. „Durch mein Kommen“ bewahrt im Deutschen sowohl den situativen als auch den kausalen Zusammenhang möglichst knapp.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: Wann soll auch ich für meinen eigenen Haushalt sorgen?
  rationale: עשה mit לְבֵיתִי meint hier, zugunsten des eigenen Hauses tätig zu werden. „Für ... sorgen“ gibt den wirtschaftlichen Sinn idiomatisch wieder, während „auch ich“ den Kontrast zu Labans Förderung bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bildet ihn erkennbar als Eigennamen ab, ohne ihn durch den Titel „Herr“ zu ersetzen.
- issue: Art des durch Jakob vermittelten Segens
  choice: durch mein Kommen
  alternative: bei meiner Ankunft / um meinetwillen
  rationale: לְרַגְלִי lässt eine zeitlich-begleitende und eine ursächliche Nuance zu. Der Haupttext bringt den naheliegenden Zusammenhang zum Ausdruck; die Fußnote hält die echte Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haushalt“ bezeichnet Jakobs Hausgemeinschaft und wirtschaftliche Verantwortung; die Satzstellung „auch ich“ erhält den betonten Kontrast des Hebräischen.
