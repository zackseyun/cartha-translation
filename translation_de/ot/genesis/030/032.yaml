source:
  edition: WLC
  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: de
  text: 'Lass mich heute durch deine ganze Herde gehen und daraus Folgendes aussondern[a]: jedes gesprenkelte und gefleckte Tier, jedes dunkel gefärbte unter den Schafen[b] und jedes gefleckte und gesprenkelte unter den Ziegen[c]. Das soll mein Lohn sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Form kann auch als direkte Aufforderung an Laban verstanden werden: „Sondere daraus … aus.“'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „braun“. Das hebräische Wort חוּם bezeichnet bei den Schafen eine dunkle oder braune Färbung.'
    reason: lexical_alternative
  - marker: c
    text: „Gesprenkelt“ (נָקֹד) und „gefleckt“ (טָלוּא) bezeichnen beide eine gemusterte Fellfärbung; ihre genaue Abgrenzung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: Lass mich … gehen
  rationale: Der Qal-Imperfekt der 1. Person Singular kann hier im Rahmen von Jakobs Vorschlag volitiv verstanden werden. Die Formulierung gibt diesen verhandelnden, auffordernden Sinn natürlich wieder, ohne eine bloße Zukunftsaussage zu erzwingen.
- source_word: בְּכָל צֹאנְךָ
  choice: durch deine ganze Herde
  rationale: צֹאן bezeichnet kollektiv das Kleinvieh, besonders Schafe und Ziegen. „Herde“ ist im Deutschen natürlich und lässt die anschließende Unterscheidung der Tierarten offen.
- source_word: הַיּוֹם
  choice: heute
  rationale: Gibt die temporale Angabe unmittelbar und in modernem Standarddeutsch wieder.
- source_word: הָסֵר מִשָּׁם
  choice: und daraus … aussondern
  rationale: סור im Hifil bezeichnet hier das Entfernen beziehungsweise Absondern bestimmter Tiere. Die deutsche Satzverbindung gibt die begleitende Handlung flüssig wieder; die grammatisch mögliche Auffassung als direkte Aufforderung wird in einer Fußnote bewahrt.
- source_word: שֶׂה
  choice: Schaf / Ziege
  rationale: שֶׂה kann allgemein ein einzelnes Stück Kleinvieh bezeichnen. Da der Vers die Tiere anschließend ausdrücklich den Schafen beziehungsweise Ziegen zuordnet, wird im Deutschen jeweils die passende Tierart genannt.
- source_word: נָקֹד
  choice: gesprenkelt
  rationale: Das Wort bezeichnet eine Zeichnung mit kleinen Flecken oder Punkten. „Gesprenkelt“ hält einen sinnvollen Unterschied zu טָלוּא aufrecht.
- source_word: טָלוּא
  choice: gefleckt
  rationale: Das Wort beschreibt eine fleckige oder scheckige Zeichnung. „Gefleckt“ ist verständlich und würdevoll, ohne die genaue Musterung zu stark festzulegen.
- source_word: חוּם
  choice: dunkel gefärbt
  rationale: Das Adjektiv bezeichnet eine dunkle, möglicherweise braune Färbung. „Dunkel gefärbt“ vermeidet eine ungesicherte Festlegung auf einen exakt modernen Farbton.
- source_word: בַּכְּשָׂבִים
  choice: Schaf
  rationale: כְּשָׂבִים bezeichnet Schafe beziehungsweise Lämmer. Im Herdenkontext ist „Schaf“ die natürliche Gattungsbezeichnung und bildet den Gegensatz zu den Ziegen.
- source_word: בָּעִזִּים
  choice: Ziege
  rationale: עִזִּים bezeichnet Ziegen; der Singular nach „jede“ ist im Deutschen idiomatisch.
- source_word: וְהָיָה שְׂכָרִי
  choice: Das soll mein Lohn sein
  rationale: שָׂכָר bezeichnet Lohn oder Entgelt. „Soll … sein“ passt zu Jakobs Vorschlag und gibt die Funktion der ausgesonderten Tiere als Vergütung klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kollektive Herdenbezeichnung bleibt erhalten, während die einzelnen Tiere entsprechend dem hebräischen Gegensatz als Schafe und Ziegen benannt werden. Die syntaktische Mehrdeutigkeit bei הָסֵר und die nicht völlig sichere Unterscheidung der Farbmuster werden nicht stillschweigend aufgelöst.
