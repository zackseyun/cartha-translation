base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: de
  text: 'Da fragte er: „Was soll ich dir geben?“ Jakob antwortete: „Du brauchst mir gar nichts zu geben. Wenn du Folgendes für mich tust, werde ich deine Herde wieder weiden und bewachen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich zurückkehren, deine Herde weiden und bewachen“. Das hebräische Verb kann sowohl die Rückkehr als auch die Wiederaufnahme der Arbeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Was soll ich dir geben?
  rationale: Die Frage erkundigt sich danach, welche Gegenleistung Laban Jakob geben soll. „Was soll ich dir geben?“ gibt Angebot und Erwartung im heutigen Deutsch natürlich wieder.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Du brauchst mir gar nichts zu geben
  rationale: Die mit לֹא verneinte Verbform drückt hier keine bloße Zukunftsaussage, sondern Jakobs Ablehnung einer unmittelbaren Entlohnung aus. „Gar nichts“ bringt die verstärkende Wirkung von מְאוּמָה im negativen Satz zum Ausdruck.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Wenn du Folgendes für mich tust
  rationale: Die Wendung verweist voraus auf die anschließend genannte Vereinbarung. „Folgendes“ ist im Deutschen natürlicher als das wörtliche „diese Sache“ und bewahrt den vorausweisenden Charakter.
- source_word: אָשׁוּבָה
  choice: wieder
  rationale: שׁוב kann hier die Wiederaufnahme der bisherigen Tätigkeit bezeichnen. Die adverbiale Wiedergabe „wieder“ passt zum folgenden Hüten der Herde; die mögliche Bedeutung einer Rückkehr wird in der Fußnote bewahrt.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: deine Herde weiden
  rationale: רעה bezeichnet im Zusammenhang mit צֹאן das Versorgen und Weiden von Kleinvieh. „Herde“ ist die übliche knappe Sammelbezeichnung für die gemeinten Schafe und Ziegen.
- source_word: אֶשְׁמֹר
  choice: bewachen
  rationale: שׁמר ergänzt das Weiden um den Schutz und die sorgfältige Aufsicht über die Herde. „Bewachen“ hält diesen eigenständigen Aspekt fest.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Fragte“ und „antwortete“ geben die Gesprächsfunktion des wiederholten hebräischen וַיֹּאמֶר idiomatisch wieder. Die echte Mehrdeutigkeit von אָשׁוּבָה bleibt durch die Fußnote erhalten.
