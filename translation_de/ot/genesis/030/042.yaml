base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: de
  text: Wenn aber die Tiere der Herde schwach waren, legte er die Zweige nicht vor sie.[a] So gehörten die schwachen Tiere Laban und die kräftigen Jakob.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „setzte er nicht“; gemeint sind die Zweige, die Jakob nach den vorhergehenden Versen vor die Tiere legte.'
    reason: cross_reference
  - marker: b
    text: Für „die schwachen“ und „die kräftigen“ stehen ungewöhnliche hebräische Ausdrücke. Sie können schwache beziehungsweise kräftige Tiere bezeichnen; beim ersten ist möglicherweise auch eine Nuance wie „spät zur Paarung kommend“ gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: Wenn aber die schwachen Tiere der Herde brünstig waren
  rationale: Die Präposition ב mit dem Infinitiv bildet eine temporale Angabe. עטף bezeichnet hier im Gegensatz zu קְשֻׁרִים offenbar die schwächeren Tiere; die genaue züchterische Nuance bleibt unsicher. Der Paarungskontext wird im Deutschen durch „brünstig waren“ natürlich ausgedrückt.
- source_word: לֹא יָשִׂים
  choice: legte er die Zweige nicht hin
  rationale: שׂים bedeutet „setzen, legen, platzieren“. Das im Hebräischen ausgelassene Objekt ergibt sich eindeutig aus den vorangehenden Versen; seine Aufnahme verhindert im Deutschen einen unklaren Satz.
- source_word: וְהָיָה הָעֲטֻפִים לְלָבָן
  choice: So gehörten die schwachen Tiere Laban
  rationale: והיה bezeichnet hier den daraus folgenden Zustand, und ל markiert Zugehörigkeit beziehungsweise Zuteilung.
- source_word: וְהַקְּשֻׁרִים לְיַעֲקֹב
  choice: und die kräftigen Jakob
  rationale: קְשֻׁרִים ist in dieser Verwendung ungewöhnlich, bezeichnet im Kontrast aber die robusteren Tiere. „kräftig“ bewahrt diesen Gegensatz, ohne eine genauere physiologische Bedeutung festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tiere der Herde“ macht den kollektiven Sinn von צֹאן verständlich; „brünstig“ ist im Viehzuchtkontext präzise und allgemein verständlich. Die elliptische zweite Satzhälfte bleibt stilistisch knapp.
