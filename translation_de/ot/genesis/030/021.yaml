  text: וְ/אַחַ֖ר יָ֣לְדָה בַּ֑ת וַ/תִּקְרָ֥א אֶת שְׁמָ֖/הּ דִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/021.yaml
  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: de
  text: Danach gebar sie eine Tochter und gab ihr den Namen Dina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Danach
  rationale: Die Verbindung markiert die zeitliche Abfolge nach den zuvor berichteten Geburten; „Danach“ ist im modernen deutschen Erzählstil natürlich und präzise.
- source_word: יָלְדָה
  choice: gebar sie
  rationale: Das Qal Perfekt 3. Person Femininum Singular von ילד bezeichnet hier mit dem ausdrücklichen Objekt בַּת das Gebären; „gebar sie eine Tochter“ ist knapp, würdig und quellennah.
- source_word: בַּת
  choice: eine Tochter
  rationale: Das unbestimmte singularische Substantiv ist Objekt zu „gebar“; im Deutschen ist der unbestimmte Artikel erforderlich.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: und gab ihr den Namen
  rationale: Die hebräische Wendung bedeutet wörtlich „und sie nannte ihren Namen“. „Gab ihr den Namen“ gibt den Sinn idiomatisch und zugleich mit ausdrücklichem Bezug auf den Namen wieder.
- source_word: דִּינָה
  choice: Dina
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
theological_decisions: []
