source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: de
  text: 'Da sagte sie: »Hier ist meine Dienerin Bilha. Geh zu ihr ein, damit sie auf meinen Knien gebiert[a] und auch ich durch sie aufgebaut werde[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf meinen Knien gebiert«. Gemeint ist wahrscheinlich ein damaliger Brauch, durch den das von einer Dienerin geborene Kind symbolisch als Kind der Herrin angenommen wurde.'
    reason: cultural_note
  - marker: b
    text: 'Oder sinngemäß: »und auch ich durch sie zu Kindern komme«. Das Hebräische sagt wörtlich »aufgebaut werde« und gebraucht damit ein Bild für den Aufbau einer Familie durch Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: meine Dienerin
  rationale: אמה bezeichnet eine sozial untergeordnete Dienerin beziehungsweise Sklavin. „Dienerin“ ist im Deutschen natürlich und vermeidet eine unnötig altertümliche Ausdrucksweise.
- source_word: בֹּא אֵלֶיהָ
  choice: Geh zu ihr ein
  rationale: Die hebräische Wendung ist ein verhüllender Ausdruck für Geschlechtsverkehr. Die idiomnahe Form bewahrt diese Zurückhaltung und ist aus dem Zusammenhang verständlich.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: damit sie auf meinen Knien gebiert
  rationale: Die wörtliche, kulturell geprägte Wendung wird bewahrt; wahrscheinlich bezeichnet sie die symbolische Annahme des von der Dienerin geborenen Kindes durch Rahel.
- source_word: וְאִבָּנֶה
  choice: und auch ich … aufgebaut werde
  rationale: Der Nifal von בנה bedeutet wörtlich „aufgebaut werden“ und spielt hier bildhaft auf die Begründung beziehungsweise Mehrung einer Familie durch Nachkommen an.
- source_word: מִמֶּנָּה
  choice: durch sie
  rationale: Die Präposition kennzeichnet Bilha als diejenige, durch die Rahel zu Kindern beziehungsweise zum Aufbau ihrer Familie gelangen will.
- source_word: גַם אָנֹכִי
  choice: auch ich
  rationale: Die Formulierung erhält die ausdrückliche Betonung Rahels und ihren Wunsch, trotz ihrer Kinderlosigkeit ebenfalls eine Familie aufzubauen.
theological_decisions:
- issue: Status des durch Bilha geborenen Kindes
  choice: Die kulturelle Wendung „auf meinen Knien“ bleibt im Haupttext stehen und wird nur in der Fußnote erläutert.
  alternative: Die Wendung unmittelbar als rechtliche oder soziale Annahme des Kindes paraphrasieren.
  rationale: Der hebräische Text benennt den genauen rechtlichen Vorgang nicht ausdrücklich; die Übersetzung soll diese historische Unschärfe nicht durch eine eindeutige Deutung beseitigen.
- issue: Metapher des Aufgebautwerdens
  choice: Die Baumetapher wird als „aufgebaut werde“ bewahrt.
  alternative: „Kinder bekomme“ oder „eine Familie gründe“.
  rationale: Die wörtliche Metapher trägt das Wortspiel zwischen Bauen und Familienaufbau und sollte nicht vollständig eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Nähe zu den markanten hebräischen Bildern. „Geh zu ihr ein“ ist eine leicht gehobene, aber verständliche Wiedergabe des verhüllenden hebräischen Ausdrucks. Die ungewöhnlichen Bilder „auf meinen Knien“ und „aufgebaut werde“ werden wegen ihrer kulturellen und literarischen Bedeutung beibehalten und in Fußnoten erläutert.
