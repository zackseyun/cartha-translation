source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: de
  text: 'Da sagte Rahel: „Gott hat mir Recht verschafft[a]; er hat auch auf meine Stimme gehört und mir einen Sohn gegeben.“ Darum gab sie ihm den Namen Dan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Dan klingt wie das hebräische Verb für „richten“ beziehungsweise „Recht verschaffen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: hat mir Recht verschafft
  rationale: Die Form bezeichnet Gottes richterliches Handeln an Rahel beziehungsweise in ihrer Sache. Die deutsche Wendung bewahrt den Rechtsgedanken und passt zum Namenswortspiel, ohne das missverständliche „hat mich gerichtet“ zu verwenden.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Prädikat steht im Singular; im Erzählzusammenhang ist der eine Gott gemeint.
- source_word: שָׁמַע בְּקֹלִי
  choice: hat auch auf meine Stimme gehört
  rationale: Die Formulierung erhält das im Hebräischen ausdrücklich genannte „meine Stimme“ und gibt zugleich die Bedeutung des erhörenden Hörens natürlich wieder.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: und mir einen Sohn gegeben
  rationale: Gibt נתן mit indirektem Objekt und das ausdrücklich männliche בֵּן genau und idiomatisch wieder.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Eine natürliche, knappe deutsche Entsprechung der folgernden Wendung, welche die Namensgebung einleitet.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: gab sie ihm den Namen Dan
  rationale: Die idiomatische deutsche Namensformel ist verständlicher als eine wörtliche Wiedergabe und erhält durch die Nennung des Namens das Wortspiel.
- source_word: דָּן
  choice: Dan
  rationale: Die geläufige deutsche Form des Eigennamens; seine Verbindung zum hebräischen Verb für „richten/Recht verschaffen“ wird in der Fußnote erläutert.
theological_decisions:
- issue: Rahels Aussage über Gottes richterliches Handeln
  choice: Gott hat mir Recht verschafft
  alternative: Gott hat mich gerichtet
  rationale: Die gewählte Fassung wahrt die gerichtliche Bildsprache und lässt erkennen, dass Rahel Gottes Entscheidung als zu ihren Gunsten versteht. Sie vermeidet zugleich die im Deutschen naheliegende, aber hier irreführende Vorstellung eines Strafgerichts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und persönlich; „auf meine Stimme gehört“ bewahrt bewusst die hebräische Ausdrucksweise, während die Namensformel idiomatisch deutsch wiedergegeben wird.
