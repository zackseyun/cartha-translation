  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzbau und die wesentlichen Elemente zuverlässig wieder: Rahels Rede, Gottes richterliches Handeln zu ihren Gunsten, das Hören ihrer Stimme, die Gabe eines Sohnes sowie die daraus folgende Namensgebung. „hat mir Recht verschafft“ ist für דָּנַנִּי im Kontext des Namenswortspiels eine angemessene, idiomatische Wiedergabe und überzieht die Aussage nicht.'
