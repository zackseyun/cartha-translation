  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-semantische Verbesserungen: »neidisch« präzisiert die von der Fruchtbarkeit der Schwester ausgelöste Reaktion, und »geboren hatte« ist in diesem erzählerischen Zusammenhang idiomatischer. Die direkte, verzweifelte Rede sowie die kontextuelle Wiedergabe von בָּנִים als »Kinder« bleiben erhalten.'
