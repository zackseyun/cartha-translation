review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den erzählenden Zusammenhang, Rahels Kinderlosigkeit gegenüber Jakob, ihre Reaktion auf die Schwester sowie ihre verzweifelte Forderung insgesamt treffend wieder. »Kinder« ist im Kontext eine vertretbare Wiedergabe von בָּנִים. Für קנא mit Bezug auf die Fruchtbarkeit der Schwester ist jedoch »neidisch« im Deutschen semantisch genauer als »eifersüchtig«.
  naturalness: Der Text ist modernes, klares Standarddeutsch. Die Vergangenheitsform »gebar« ist zwar nicht falsch, klingt in der Konstruktion »Als Rahel sah, dass …« aber weniger natürlich als das Plusquamperfekt »geboren hatte«, das die bereits feststehende Kinderlosigkeit bei ihrer Wahrnehmung ausdrückt.
  terminology: Die Namen Rahel und Jakob sind korrekt. »Neidisch auf ihre Schwester« vermeidet die im heutigen Deutsch häufig partnerschaftlich-besitzanzeigende Nebenbedeutung von »eifersüchtig« und trifft den hier durch die Fruchtbarkeit der Schwester ausgelösten Neid.
  issues:
  - severity: low
    issue: »wurde sie eifersüchtig auf ihre Schwester«
    rationale: קנא kann sowohl Eifersucht als auch Neid bezeichnen. In diesem Kontext ist Rahels Reaktion auf die Kinder ihrer Schwester gemeint; »wurde neidisch auf ihre Schwester« ist im modernen Deutsch präziser und weniger missverständlich.
  - severity: low
    issue: »dass sie Jakob keine Kinder gebar«
    rationale: Die Form ist grammatisch möglich, doch das Plusquamperfekt »geboren hatte« klingt nach »sah, dass« idiomatischer und gibt die vorausliegende Tatsache ihrer bisherigen Kinderlosigkeit klar wieder.
  revised_text: 'Als Rahel sah, dass sie Jakob keine Kinder geboren hatte, wurde sie neidisch auf ihre Schwester. Sie sagte zu Jakob: »Gib mir Kinder, sonst sterbe ich!«'
