base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: de
  text: 'Als Rahel sah, dass sie Jakob keine Kinder geboren hatte, wurde sie neidisch auf ihre Schwester. Sie sagte zu Jakob: »Gib mir Kinder, sonst sterbe ich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: Als Rahel sah, dass sie Jakob keine Kinder gebar
  rationale: Die Konstruktion verbindet Rahels Wahrnehmung zeitlich mit ihrer Reaktion. יָלַד bezeichnet bei einer Frau das Gebären; der im Hebräischen unausgesprochene Gegenstand wird im Deutschen kontextgemäß als »Kinder« wiedergegeben. Der Dativ »Jakob« bildet לְיַעֲקֹב natürlich und knapp ab.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: wurde sie eifersüchtig auf ihre Schwester
  rationale: קנא bezeichnet hier Eifersucht beziehungsweise Neid angesichts der Fruchtbarkeit ihrer Schwester. »wurde eifersüchtig auf« ist modernes, idiomatisches Deutsch und gibt die einsetzende Gefühlsreaktion wieder; das wiederholte »Rahel« wird zur natürlichen deutschen Satzverknüpfung durch ein Pronomen ersetzt.
- source_word: הָבָה לִּי בָנִים
  choice: Gib mir Kinder!
  rationale: בָּנִים bedeutet formal »Söhne«, kann aber im Zusammenhang mit Nachkommenschaft Kinder allgemein bezeichnen. Rahels Verlangen gilt dem Gebären von Nachwuchs, weshalb »Kinder« die kontextuelle Bedeutung ohne unnötige Festlegung auf männliche Nachkommen wiedergibt.
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  choice: Sonst sterbe ich!
  rationale: וְאִם אַיִן führt die drohende Alternative ein. »Sonst« ist im Deutschen knapp und nachdrücklich. מֵתָה אָנֹכִי wird als unmittelbare, verzweifelte Aussage bewahrt, ohne sie psychologisch auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter emotionaler Kraft. Die kurzen Ausrufe spiegeln Rahels Verzweiflung. Es sind keine Fußnoten nötig, da die kontextuelle Wiedergabe von בָּנִים als »Kinder« im Deutschen sachgerecht und ohne Verlust verständlich ist.
