base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: de
  text: 'Da sagte Rahel: »In Ringen Gottes[a] habe ich mit meiner Schwester gerungen, und ich habe auch gesiegt.« Darauf nannte sie ihn Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ringen Gottes«. Der Ausdruck kann auch »göttliche Ringen« oder, als Verstärkung, »gewaltige Ringen« bedeuten. Im Hebräischen besteht zudem ein Wortspiel zwischen »gerungen« und dem Namen Naftali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: in Kämpfen Gottes
  rationale: Die formale Wiedergabe bewahrt die ungewöhnliche hebräische Genitivverbindung und lässt offen, ob ausdrücklich auf Gott verwiesen wird oder אֱלֹהִים verstärkend im Sinn von »gewaltig« gebraucht ist.
- source_word: נִפְתַּלְתִּי
  choice: habe ich … gerungen
  rationale: »Ringen« gibt das Bild des hebräischen Verbs natürlich wieder und erhält die Wortspielbeziehung zum Namen Naftali so weit wie im Deutschen möglich.
- source_word: עִם אֲחֹתִי
  choice: mit meiner Schwester
  rationale: Dies entspricht der Grundbedeutung der Präposition; der Zusammenhang des Ringens lässt zugleich die gegnerische Komponente erkennen.
- source_word: גַּם יָכֹלְתִּי
  choice: und ich habe auch gesiegt
  rationale: Im Zusammenhang der Rivalität bezeichnet יכל erfolgreiches Überwinden; »gesiegt« ist im Deutschen klarer als das wörtlichere, aber unbestimmte »ich konnte«.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Darauf nannte sie ihn Naftali
  rationale: Die natürliche deutsche Namensformel gibt den erzählerischen Anschluss wieder und verbindet Rahels Erklärung mit der Namensgebung.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention transliteriert; seine lautliche Beziehung zu נפתל bleibt teilweise erkennbar.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים in נַפְתּוּלֵי אֱלֹהִים
  choice: Die direkte Form »Kämpfe Gottes« steht im Haupttext.
  alternative: »gewaltige Kämpfe« beziehungsweise »göttliche Kämpfe«
  rationale: Der hebräische Ausdruck ist mehrdeutig. Die Übersetzung entscheidet nicht stillschweigend, ob Rahel Gott unmittelbar als Beteiligten nennt oder ob אֱלֹהִים als Verstärkung dient; die idiomatische Möglichkeit wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst ungewöhnliche Wendung »Kämpfe Gottes« bewahrt die Mehrdeutigkeit des Ausgangstextes; der übrige Satzbau ist natürlich und gut verständlich.
