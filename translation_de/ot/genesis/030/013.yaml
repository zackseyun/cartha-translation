  source_fidelity: 'Die Übersetzung trifft die Aussage im Wesentlichen: בנות kann hier idiomatisch „Frauen“ bedeuten, und die Namensgebung wird korrekt wiedergegeben. „Glücklich preisen“ ist jedoch im modernen Deutsch weniger präzise, da es leicht ein lobendes Preisen statt eines Glücklich-Nennens nahelegt. „Glücklich nennen“ gibt אִשְּׁרוּנִי unmittelbarer wieder und erhält das Wortspiel.'
