  - severity: low
    issue: Die idiomatische Wiedergabe von בנות als „Frauen“ ist nicht erläutert.
    rationale: Da der hebräische Wortlaut wörtlich „Töchter“ lautet, sollte die Entscheidung für die kontextuelle Bedeutung „Frauen“ durch eine Fußnote transparent gemacht werden.
