  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: de
  text: 'Da sagte Lea: »Was für ein Glück für mich! Die Frauen werden mich glücklich nennen.«[a][b] Und sie gab ihm den Namen Ascher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Ascher klingt im Hebräischen ähnlich wie die Wörter für »Glück« und »glücklich nennen« in Leas Aussage.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Töchter«. Das Wort kann hier idiomatisch Frauen im Allgemeinen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Was für ein Glück für mich!
  rationale: Die exklamative Wendung gibt Leas Freude natürlich wieder und bewahrt den Bedeutungsanklang von Glück beziehungsweise Glücklichsein.
- source_word: אִשְּׁרוּנִי
  choice: werden mich glücklich preisen
  rationale: Das Piel von אשר bedeutet, jemanden glücklich zu nennen oder zu preisen. Diese Formulierung wahrt die Wortverbindung mit בְּאָשְׁרִי und dem Namen Ascher.
- source_word: בָּנוֹת
  choice: die Frauen
  rationale: Wörtlich bedeutet der Plural »Töchter«, kann hier jedoch idiomatisch Frauen allgemein bezeichnen; »die Frauen« ist im modernen Deutsch natürlich und im Kontext klar.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Und sie gab ihm den Namen Ascher
  rationale: Die deutsche Namensformel gibt die hebräische Wendung idiomatisch wieder, ohne ihren erzählerischen Gehalt zu verändern.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; sein Bedeutungsanklang wird durch den Kontext und die Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Bedeutung von בָּנוֹת wird im Haupttext als »Frauen« wiedergegeben; das hebräische Wort lautet wörtlich »Töchter«. Der Wortklang der hebräischen Namensgebung wird in einer Fußnote erläutert.
