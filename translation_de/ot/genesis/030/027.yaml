  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: de
  text: 'Da sagte Laban zu ihm: „Wenn ich Gunst in deinen Augen gefunden habe, bleib bitte.[a] Ich habe durch Wahrsagung erfahren,[b] dass Jahwe mich deinetwegen gesegnet hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text formuliert nach „Wenn ich Gunst in deinen Augen gefunden habe“ keine ausdrückliche Bitte; „bleib bitte“ ist aus dem Zusammenhang ergänzt.
    reason: textual_ellipsis
  - marker: b
    text: 'Oder: „Ich habe es durch das Deuten von Vorzeichen erkannt.“ Weniger wahrscheinlich: „Ich habe aus Erfahrung erkannt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Wenn ich Gunst in deinen Augen gefunden habe, bleib bitte
  rationale: Die feste Wendung ‚Gunst in jemandes Augen finden‘ bewahrt das hebräische Bild und ist im Deutschen verständlich. נָא verleiht der Bitte einen höflich-drängenden Ton. Da der hebräische Bedingungssatz ohne ausdrücklich formulierten Hauptsatz abbricht, wird aus dem Zusammenhang knapp ‚bleib bitte‘ ergänzt.
- source_word: נִחַשְׁתִּי
  choice: Ich habe durch Wahrsagung erfahren
  rationale: Das Piel von נחשׁ bezeichnet gewöhnlich Wahrsagung beziehungsweise das Deuten von Vorzeichen. Die Formulierung gibt sowohl den Erkenntnisgewinn als auch das verwendete Mittel wieder, ohne den stärkeren lexikalischen Sinn zu ‚aus Erfahrung gelernt‘ abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen Standarddeutsch als ‚Jahwe‘ wiedergegeben und nicht durch einen Titel wie ‚der HERR‘ ersetzt.
- source_word: וַיְבָרֲכֵנִי
  choice: mich gesegnet hat
  rationale: Das deutsche Perfekt bezeichnet passend den gegenwärtig erkennbaren Erfolg einer vorausgehenden Segnung.
- source_word: בִּגְלָלֶךָ
  choice: deinetwegen
  rationale: Die Präposition bezeichnet hier Ursache oder Anlass; ‚deinetwegen‘ ist eine natürliche, knappe deutsche Entsprechung.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im Ausgangstext steht der Eigenname Gottes. ‚Jahwe‘ bewahrt ihn als Namen und entspricht der im modernen Deutschen üblichen wissenschaftlichen Umschrift.
- issue: Labans Erkenntnisweise
  choice: durch Wahrsagung erfahren
  alternative: aus Erfahrung erkannt
  rationale: Der Text stellt die Spannung zwischen Labans Wahrsagung und seiner Aussage über Jahwes Segen unaufgelöst nebeneinander. Die Übersetzung wahrt diese Spannung, statt Labans Vorgehen zu verharmlosen oder theologisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute biblische Redewendung „Gunst in deinen Augen finden“ bleibt erhalten; die elliptische Bitte wird für heutige Leser behutsam vervollständigt.
