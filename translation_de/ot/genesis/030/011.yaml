  text: וַ/תֹּ֥אמֶר לֵאָ֖ה ב/גד וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ גָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: de
  text: 'Und Lea sagte[a]: »Glück!« Da gab sie ihm den Namen Gad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form בגד ist schwer zu deuten. Sie kann als Ausruf »Glück!« verstanden werden; traditionell wird auch »Eine Schar!« übersetzt. Der Name Gad entspricht dem hebräischen Wort גד, auf dem das Wortspiel beruht.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und … sagte
  rationale: Das Wayyiqtol von אמר führt die nächste Handlung der Erzählung ein; »Und … sagte« bewahrt die hebräische Abfolge, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: לֵאָה
  choice: Lea
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: בגד
  choice: Glück!
  rationale: Die schwierige hebräische Form wird als Ausruf verstanden, der mit גד, »Glück«, zusammenhängt. Die knappe Wiedergabe klingt im Deutschen natürlich und erhält den Bezug zur Namensgebung, auch wenn das hebräische Lautspiel nicht vollständig nachgebildet werden kann.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Da gab sie ihm den Namen
  rationale: In diesem Namensgebungskontext gibt die natürliche deutsche Wendung die hebräische Formel »sie nannte seinen Namen« sinngenau wieder; »Da« markiert den Fortgang und den Zusammenhang mit Leas Ausruf.
- source_word: גָּד
  choice: Gad
  rationale: Die etablierte Umschrift des Eigennamens wird beibehalten. Im Hebräischen klingt der Name wie das Wort im vorausgehenden Ausruf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Namensformel ist natürlich idiomatisiert; die echte textliche und lexikalische Unsicherheit wird in der Fußnote offengehalten.
