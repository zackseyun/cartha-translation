  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: de
  text: An jenem Tag sonderte er die gestreiften[a] und gefleckten Ziegenböcke aus sowie alle gesprenkelten und gefleckten Ziegen – alle, die Weiß an sich hatten – und alle braunen[b] Lämmer. Er gab sie in die Obhut seiner Söhne.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gebänderten“; das hebräische Wort bezeichnet eine band- oder streifenartige Fellzeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dunkelbraune“ oder „dunkelfarbige“. Das hebräische Wort bezeichnet eine braune bis dunkle Färbung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Er gab sie in die Hand seiner Söhne“; damit ist gemeint, dass er sie ihrer Aufsicht und Verfügungsgewalt unterstellte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: sonderte er … aus
  rationale: Die Hifil-Form von סור bezeichnet hier das Entfernen beziehungsweise Absondern bestimmter Tiere aus der Herde. „Aussondern“ gibt die Handlung natürlich und präzise wieder.
- source_word: הַתְּיָשִׁים
  choice: die Ziegenböcke
  rationale: תיש bezeichnet ausdrücklich männliche Ziegen; „Ziegenböcke“ ist im Deutschen eindeutig und idiomatisch.
- source_word: הָעֲקֻדִּים
  choice: die gestreiften
  rationale: Das Wort bezeichnet band- oder streifenartige Fellzeichnungen. „Gestreift“ ist verständlich, ohne die genaue Form der Zeichnung unnötig festzulegen.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: gefleckt
  rationale: Die Formen bezeichnen fleckige oder scheckige Fellzeichnung. Die einheitliche Wiedergabe erhält die lexikalische Wiederholung des Hebräischen.
- source_word: הָעִזִּים הַנְּקֻדּוֹת
  choice: die gesprenkelten … Ziegen
  rationale: נקוד bezeichnet kleinere punkt- oder sprenkelartige Zeichnungen. „Gesprenkelt“ unterscheidet den Ausdruck von טלא, das mit „gefleckt“ wiedergegeben wird.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: jedes Tier, an dem etwas Weiß war
  rationale: Die Formulierung bewahrt den distributiven Sinn von כֹּל und die Aussage, dass irgendein weißer Anteil am Fell genügte.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: und jedes dunkelbraune Tier unter den Lämmern
  rationale: חוּם bezeichnet eine braune beziehungsweise dunkle Färbung; „dunkelbraun“ vereint beide Bedeutungsaspekte. כְּשָׂבִים wird hier entsprechend seiner Bezeichnung für junge Schafe mit „Lämmer“ wiedergegeben.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: Er übergab sie der Obhut seiner Söhne
  rationale: Die Wendung „in die Hand geben“ bezeichnet hier die Übertragung von Aufsicht und Verfügungsgewalt. „Der Obhut übergeben“ gibt diesen idiomatischen Sinn in würdigem, natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die verschiedenen hebräischen Bezeichnungen für Fellzeichnungen werden durch „gestreift“, „gesprenkelt“ und „gefleckt“ unterscheidbar gehalten. Der Wechsel zu einem neuen Satz vor „Er übergab“ verbessert die Lesbarkeit, ohne die Abfolge oder den Sinn des hebräischen Satzes zu verändern.
