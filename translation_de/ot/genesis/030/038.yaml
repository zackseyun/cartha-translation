- from: Er stellte die Stäbe, die er geschält hatte, in die Rinnen, in die Wassertröge[a], zu denen die Herde zum Trinken kam, und zwar vor die Tiere. Wenn die Herde zum Trinken kam, wurde sie brünstig[b].
  to: Er stellte die Stäbe, die er geschält hatte, in die Rinnen, in die Wassertröge[a], zu denen die Herde zum Trinken kam, vor die Herde. Und die Tiere wurden brünstig, wenn sie zum Trinken kamen[b].
  rationale: Die Revision korrigiert den unnatürlichen und gegenüber dem hebräischen Plural weniger genauen Singularausdruck „die Herde wurde brünstig“ zu „die Tiere wurden brünstig“. Sie erhält zugleich die im Ausgangstext und im englischen Audit Trail markierte lexikalische Offenheit des Verbs durch die Fußnote. Die doppelte Ortsbeschreibung und die explizite Stellung der Stäbe vor der Herde bleiben bestehen.
