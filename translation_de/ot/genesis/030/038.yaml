base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: de
  text: Er stellte die Stäbe, die er geschält hatte, in die Rinnen, in die Wassertröge[a], zu denen die Herde zum Trinken kam, vor die Herde. Und die Tiere wurden brünstig, wenn sie zum Trinken kamen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Ausdrücke können Rinnen, Tröge oder Tränkstellen bezeichnen. Wahrscheinlich beschreiben sie den Tränkbereich näher, nicht zwei völlig getrennte Orte.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „paarten sie sich“. Das hebräische Verb bedeutet wörtlicher, in Hitze zu kommen beziehungsweise brünstig zu werden; im Zusammenhang kann das Paaren mitgemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: Er stellte
  rationale: Das Verb bezeichnet das gezielte Aufstellen oder Platzieren eines Gegenstands.
- source_word: הַמַּקְלוֹת אֲשֶׁר פִּצֵּל
  choice: die Stäbe, die er geschält hatte
  rationale: מַקְלוֹת sind hier die zuvor bearbeiteten Zweige beziehungsweise Stäbe; פִּצֵּל beschreibt im Kontext das Abschälen der Rinde, durch das helle Streifen sichtbar wurden.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: in die Rinnen, in die Wassertröge
  rationale: Die beiden verwandten Ortsangaben werden nicht eingeebnet. Sie beschreiben wahrscheinlich näher bestimmend denselben Tränkbereich.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: Das Kollektiv bezeichnet Kleinvieh und kann Schafe wie Ziegen umfassen; „Herde“ bewahrt diesen Umfang.
- source_word: לְנֹכַח הַצֹּאן
  choice: vor die Tiere
  rationale: Die Wendung bezeichnet eine Position unmittelbar vor beziehungsweise gegenüber der Herde; die pronominale Umschreibung vermeidet im Deutschen eine schwerfällige Wiederholung.
- source_word: וַיֵּחַמְנָה
  choice: wurde sie brünstig
  rationale: Das Verb bedeutet wörtlich, heiß beziehungsweise brünstig zu werden. Diese Wiedergabe wahrt die lexikalische Bedeutung, ohne die im Kontext mögliche Folge des Paarens ausdrücklich in das Verb hineinzulesen.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: Wenn die Herde zum Trinken kam
  rationale: Die Infinitivkonstruktion gibt den zeitlichen Umstand an.
