base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: de
  text: 'Da sagte Lea: „Gott hat mir meinen Lohn gegeben, weil ich meinem Mann meine Sklavin gegeben habe.“ Darauf nannte sie ihn Issachar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Issachar wird hier mit dem hebräischen Wort für „Lohn“ in Verbindung gebracht und greift damit Leas Begründung auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Gott hat mir … gegeben
  rationale: Das Perfekt gibt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung in Leas Namensdeutung natürlich wieder; das Dativpronomen entspricht dem in שְׂכָרִי enthaltenen Besitzbezug.
- source_word: שְׂכָרִי
  choice: meinen Lohn
  rationale: „Lohn“ bewahrt sowohl den konkreten Vergeltungsgedanken als auch den im Hebräischen erkennbaren Anklang an den Namen Issachar.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Die Relativpartikel hat hier im Zusammenhang begründende Funktion; „weil“ macht diesen Sinn in klarem modernem Deutsch deutlich.
- source_word: נָתַתִּי
  choice: ich … gegeben habe
  rationale: Im deutschen weil-Satz ist das Perfekt eine natürliche Wiedergabe der vorausgehenden Handlung.
- source_word: שִׁפְחָתִי
  choice: meine Dienerin
  rationale: „Dienerin“ ist gegenwärtiges, verständliches Deutsch und lässt die im hebräischen Begriff enthaltene rechtlich-soziale Spannweite offen, ohne ein Alter zu unterstellen.
- source_word: לְאִישִׁי
  choice: meinem Mann
  rationale: אִישׁ bezeichnet hier aufgrund der ehelichen Beziehung eindeutig Leas Mann.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Und sie gab ihm den Namen
  rationale: Diese natürliche deutsche Wendung gibt die hebräische Namensgebungsformel und den fortlaufenden Erzählanschluss wieder.
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Der Personenname wird nach geläufiger deutscher Konvention transkribiert; sein Wortanklang wird in einer Fußnote erläutert.
theological_decisions:
- issue: Leas Deutung der Geburt als göttlicher Lohn
  choice: Leas Aussage wird unmittelbar als ihre eigene Deutung wiedergegeben, ohne sie zu bestätigen oder zu kritisieren.
  alternative: שְׂכָרִי abstrakter mit „Belohnung“ wiederzugeben und so den vergeltenden beziehungsweise geschäftlichen Ton abzuschwächen.
  rationale: Der hebräische Text legt Lea diese Deutung in den Mund. Die Übersetzung sollte ihre Rede vom göttlichen Lohn bewahren, ohne eine zusätzliche theologische Bewertung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da sagte“ markiert den Erzählfortgang idiomatisch; „Dienerin“ vermeidet sowohl das veraltete „Magd“ als auch eine übermäßig festlegende Wiedergabe des sozialen Status.
