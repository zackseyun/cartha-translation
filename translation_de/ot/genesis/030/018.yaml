    rationale: „klingt ... an“ kann eine sprachwissenschaftlich eindeutige Etymologie suggerieren. Der Text selbst stellt Issachar durch Leas Erklärung mit „Lohn“ in Verbindung; dies sollte die Fußnote präzise ausdrücken.
