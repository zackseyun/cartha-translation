  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: de
  text: Und Silpa, Leas Dienerin, gebar Jakob einen Sohn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Und … gebar
  rationale: Das Wayyiqtol von ילד führt das nächste Ereignis der Erzählfolge ein. „Gebar“ gibt den Geburtsvorgang prägnant und natürlich wieder.
- source_word: זִלְפָּה
  choice: Silpa
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שִׁפְחַת
  choice: Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Hausbedienstete in untergeordneter Stellung. „Dienerin“ ist gegenwärtiges, verständliches Deutsch, ohne Alter oder den genauen Rechtsstatus über den Kontext hinaus festzulegen.
- source_word: לֵאָה
  choice: Leas
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich durch den Genitiv ausgedrückt.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Die Präposition ל kennzeichnet in dieser Konstruktion den Vater beziehungsweise Empfänger; im Deutschen steht „Jakob“ idiomatisch als Dativobjekt ohne sichtbaren Artikel.
- source_word: בֵּן
  choice: einen Sohn
  rationale: Das unbestimmte singularische Substantiv wird im Deutschen als Akkusativobjekt mit „einen“ wiedergegeben.
