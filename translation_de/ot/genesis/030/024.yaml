base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: de
  text: 'Und sie gab ihm den Namen Josef[a] und sagte: »Jahwe füge mir einen weiteren Sohn hinzu.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Josef spielt auf das hebräische Verb für »hinzufügen« an.
    reason: Das hebräische Wortspiel zwischen יוֹסֵף (Josef) und יֹסֵף (»möge er hinzufügen«) lässt sich im Deutschen nicht unmittelbar wiedergeben.
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Und sie gab ihm den Namen
  rationale: Die hebräische Namensgebungsformel lautet wörtlich »sie nannte seinen Namen«. Die gewählte deutsche Wendung ist natürlich und bewahrt die ausdrückliche Benennung.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Das quotative לֵאמֹר leitet Rahels anschließende Worte ein; »und sagte« ist im modernen Deutschen idiomatisch.
- source_word: יֹסֵף
  choice: Möge ... schenken
  rationale: Die Hifil-Form von יסף bedeutet »hinzufügen, vermehren«. Im Kontext drückt sie einen Wunsch aus. »Noch ... schenken« gibt den Sinn im Deutschen natürlich wieder und hält durch die Fußnote das Wortspiel mit Josef sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname in der gebräuchlichen deutschen Form »Jahwe« wiedergegeben.
- source_word: לִי בֵּן אַחֵר
  choice: mir noch einen Sohn
  rationale: בן bezeichnet ausdrücklich einen Sohn; אַחֵר meint hier einen weiteren. »Mir noch einen Sohn« entspricht dem Sinn der hebräischen Konstruktion in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Modalität von יֹסֵף
  choice: Möge Jahwe ... schenken
  alternative: Jahwe wird ... schenken
  rationale: Rahels Aussage kann formal als nicht abgeschlossenes Verb verstanden werden; im Namensgebungskontext liegt ein Wunsch oder Gebet nahe. Die Wunschform bewahrt diesen Zusammenhang, ohne daraus eine sichere Vorhersage zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die natürliche deutsche Namensgebungsformel ersetzt eine schwerfällige wörtliche Nachbildung; das hebräische Wortspiel wird durch die unmittelbar am Namen gesetzte Fußnote bewahrt.
