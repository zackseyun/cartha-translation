lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: erhörte
  rationale: Die Verbindung שׁמע אֶל bezeichnet hier nicht bloß akustisches Hören, sondern aufmerksames, günstiges Hören mit einer folgenden Antwort. „Erhörte“ gibt diese Nuance im Deutschen knapp und idiomatisch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet in diesem Erzählzusammenhang den einen Gott Israels; „Gott“ ist die natürliche deutsche Wiedergabe.
- source_word: לֵאָה
  choice: Lea
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition als „Lea“ wiedergegeben.
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: Diese moderne, klare Formulierung gibt הרה natürlich wieder und vermeidet das heute gehoben oder fachsprachlich wirkende „empfing“.
- source_word: וַתֵּלֶד
  choice: und gebar
  rationale: „Gebar“ entspricht der knappen Erzählweise des Hebräischen und ist in einem würdigen bibelerzählerischen Register verständlich.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Beim deutschen Verb „jemandem einen Sohn gebären“ wird der Dativ ohne Präposition idiomatisch ausgedrückt.
- source_word: בֵּן חֲמִישִׁי
  choice: einen fünften Sohn
  rationale: Die Ordinalzahl bestimmt „Sohn“; der unbestimmte Artikel ist im Deutschen erforderlich und wahrt die Bedeutung, dass dies ein weiterer, nun fünfter Sohn für Jakob ist.
theological_decisions:
- issue: Göttliche Zuwendung in שׁמע אֶל
  choice: „Gott erhörte Lea“ als günstiges, wirksames Hören
  alternative: „Gott hörte auf Lea“ oder „Gott hörte Lea“
  rationale: Der hebräische Ausdruck kann formal mit „hören“ wiedergegeben werden, legt im Zusammenhang jedoch eine wohlwollende Reaktion nahe. „Erhörte“ macht dies sichtbar, ohne den nicht ausdrücklich genannten Inhalt einer Bitte oder eines Gebets zu ergänzen; die formalere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes Standarddeutsch in einem knappen, würdigen Erzählstil. Der erste hebräische Satz wird zur besseren natürlichen Lesbarkeit in zwei deutsche Sätze gegliedert. „Erhörte“ bewahrt die responsive Nuance des Idioms; die Fußnote dokumentiert die formalere Alternative.
