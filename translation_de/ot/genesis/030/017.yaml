  naturalness: „Und Gott hörte Lea. Sie wurde schwanger und gebar Jakob einen fünften Sohn.“ ist modernes, gut verständliches Standarddeutsch mit angemessen knappem Erzählerregister. Die Aufteilung in zwei Sätze ist idiomatisch.
  terminology: Die etablierten deutschen Namensformen „Lea“ und „Jakob“ sowie „Gott“, „schwanger“, „gebar“ und „fünften Sohn“ sind passend. Die Fußnotenalternative muss als echte lexikalisch-kontextuelle Alternative formuliert sein; „hörte auf Lea“ bedeutete im heutigen Deutsch eher „gehorchte Lea“ und ist daher unzutreffend.
