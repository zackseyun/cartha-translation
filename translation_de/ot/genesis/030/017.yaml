    rationale: „Auf jemanden hören“ bedeutet gewöhnlich, jemandes Rat oder Anweisung zu befolgen, nicht jemanden akustisch oder aufmerksam zu hören. Sie kann daher die Aussage des hebräischen Textes verfälschen.
