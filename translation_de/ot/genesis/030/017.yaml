  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: de
  text: Und Gott hörte Lea[a]. Sie wurde schwanger und gebar Jakob einen fünften Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott erhörte Lea.“'
