  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: de
  text: Bilha[a], Rahels Sklavin, wurde wieder schwanger und gebar Jakob einen zweiten Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerin“. Das hebräische Wort bezeichnet eine unfreie Dienerin beziehungsweise Sklavin von niedrigem sozialem Rang; „Sklavin“ macht den gebundenen Status ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden bzw. Empfangen. „Wurde schwanger“ ist im heutigen Deutsch natürlich und eindeutig.
- source_word: עוֹד
  choice: wieder
  rationale: Im Zusammenhang der aufeinanderfolgenden Geburten kennzeichnet עוֹד die Wiederholung des Geschehens.
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: ילד im Qal bedeutet hier „gebären“. „Gebar“ bewahrt die knappe, würdige Erzählweise des Hebräischen.
- source_word: שִׁפְחַת
  choice: Sklavin
  rationale: שִׁפְחָה bezeichnet eine unfreie Dienerin beziehungsweise Sklavin. „Sklavin“ macht ihren rechtlich und sozial gebundenen Status deutlich.
- source_word: בֵּן שֵׁנִי
  choice: einen zweiten Sohn
  rationale: Die Wendung bedeutet wörtlich „einen zweiten Sohn“ und lässt sich ebenso natürlich ins Deutsche übertragen.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Das ל bezeichnet hier die Zuordnung zum Vater; die deutsche Konstruktion „jemandem einen Sohn gebären“ gibt dies knapp wieder.
- source_word: בִּלְהָה ... רָחֵל
  choice: Bilha, Rahels Sklavin,
  rationale: Die Apposition identifiziert Bilha durch ihr Verhältnis zu Rahel. Die Kommas bewahren diese Struktur in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper und würdiger Erzählweise. Die traditionelle deutsche Namensform „Bilha“ folgt dem hebräischen בִּלְהָה; „Sklavin“ vermeidet eine Verharmlosung ihres sozialen Status.
