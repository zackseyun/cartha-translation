revisions:
- from: Jakob sonderte die Lämmer aus. Er richtete die Herde auf die gestreiften und alle dunkel gefärbten Tiere in Labans Herde aus.[a] Dann stellte er für sich eigene Herden zusammen und brachte sie nicht mit Labans Herde zusammen.
  to: Jakob sonderte die Lämmer aus. Er richtete die Herde auf die gestreiften und alle dunkel gefärbten Tiere in Labans Herde aus.[a] Dann hielt er für sich gesonderte Herden und brachte sie nicht mit Labans Herde zusammen.
  rationale: Die Revision ersetzt lediglich die potenziell missverständliche Wendung „stellte ... Herden zusammen“ durch „hielt ... gesonderte Herden“. Damit kommen sowohl die Zuordnung zu Jakob als auch die Absonderung der Herden klar zum Ausdruck. Die vorsichtig formulierte Fußnote zur umstrittenen Funktion von בְּ bleibt erhalten.
