source:
  edition: WLC
  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: de
  text: Jakob sonderte die Lämmer aus. Er richtete die Herde auf die gestreiften und alle dunkel gefärbten Tiere in Labans Herde aus.[a] Dann hielt er für sich gesonderte Herden und brachte sie nicht mit Labans Herde zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Labans Herde“. Die hebräische Wendung kann hier möglicherweise die Herkunft der Tiere bezeichnen; gewöhnlich bedeutet sie „in Labans Herde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: die Lämmer
  rationale: כְּשָׂבִים bezeichnet hier Lämmer beziehungsweise junge Schafe; „Lämmer“ gibt den gegenüber צֹאן spezifischeren Ausdruck natürlich wieder.
- source_word: הִפְרִיד
  choice: sonderte … aus
  rationale: Der Hifil von פרד bezeichnet das Trennen oder Absondern. Die trennbare deutsche Wendung ist präzise und im Zusammenhang der Herdenaufteilung idiomatisch.
- source_word: פְּנֵי הַצֹּאן אֶל
  choice: richtete die Herde auf … aus
  rationale: Wörtlich steht „die Gesichter der Herde“. Gemeint ist die Ausrichtung der Tiere; die gewählte Formulierung bewahrt die Handlung, ohne im Deutschen unnatürlich zu klingen.
- source_word: עָקֹד
  choice: die gestreiften
  rationale: עָקֹד bezeichnet Tiere mit streifen- oder bandförmiger Zeichnung. „Gestreift“ ist die klare, moderne deutsche Entsprechung.
- source_word: כָל חוּם
  choice: alle dunkel gefärbten Tiere
  rationale: חוּם kann eine braune oder allgemein dunkle Färbung bezeichnen. „Dunkel gefärbt“ vermeidet eine nicht zwingende Festlegung auf Braun.
- source_word: בְּצֹאן לָבָן
  choice: in Labans Herde
  rationale: Die Präposition בְּ wird zunächst in ihrem gewöhnlichen lokalen Sinn wiedergegeben. Da im Kontext auch ein Herkunftssinn erwogen wird, bleibt diese Möglichkeit in einer Fußnote sichtbar.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: Dann stellte er für sich eigene Herden zusammen
  rationale: Die Formulierung gibt sowohl das Bilden beziehungsweise Aufstellen von Herden als auch ihre Absonderung für Jakob verständlich wieder.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: und brachte sie nicht mit Labans Herde zusammen
  rationale: עַל bezeichnet hier die Zuordnung oder Verbindung mit Labans Herde. Der deutsche Ausdruck macht deutlich, dass die für Jakob gebildeten Herden getrennt blieben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche wörtliche Wendung „die Gesichter der Herde setzen“ wird als Ausrichtung der Herde wiedergegeben. Die syntaktisch und erzählerisch relevante Mehrdeutigkeit von בְּצֹאן לָבָן bleibt durch die Fußnote erhalten.
