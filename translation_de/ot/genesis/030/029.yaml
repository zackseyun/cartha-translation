  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Du selbst weißt, wie ich dir gedient habe und wie es deinem Vieh bei mir ergangen ist.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und was dein Vieh bei mir gewesen ist“. Die Wendung kann sich auf den Zustand und das Gedeihen von Labans Vieh unter Jakobs Obhut beziehen, nicht nur darauf, wo es sich befand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Er sagte zu ihm
  rationale: Gibt die fortlaufende hebräische Erzählform im Deutschen natürlich wieder; das einleitende וַ kann ohne eigenes „und“ ausgedrückt werden.
- source_word: אַתָּה יָדַעְתָּ
  choice: Du weißt
  rationale: Das selbstständige Pronomen ist im Deutschen bereits durch die ausdrückliche Setzung von „du“ hinreichend vertreten; das Perfekt von ידע bezeichnet hier einen gegenwärtigen Wissensstand.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: wie ich dir gedient habe
  rationale: עבד bezeichnet hier Jakobs Dienst beziehungsweise Arbeit für Laban; „gedient“ bewahrt auch das Unterordnungsverhältnis.
- source_word: מִקְנְךָ
  choice: deinem Vieh
  rationale: מִקְנֶה ist eine Sammelbezeichnung für gehaltene Herdentiere; „Vieh“ ist breit, geläufig und dem Kontext angemessen.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: wie es deinem Vieh bei mir ergangen ist
  rationale: Die Wendung bezeichnet wahrscheinlich Zustand und Entwicklung des Viehs unter Jakobs Obhut. „Bei mir“ bewahrt אִתִּי, während „ergangen ist“ den idiomatischen Sinn natürlich ausdrückt.
