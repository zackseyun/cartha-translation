id: GEN.30.41
reference: Genesis 30:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: de
  text: Und immer wenn die kräftigeren Tiere der Herde[a] brünstig waren, legte Jakob die Stäbe vor den Augen der Herde in die Tränkrinnen[b], damit die Tiere sich bei den Stäben paarten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die robusteren“ beziehungsweise „die widerstandsfähigeren Tiere“; das hebräische Wort bezeichnet hier offenbar die kräftigeren Tiere im Gegensatz zu den schwachen im folgenden Vers.
    reason: lexical_alternative
  - marker: b
    text: Oder „in die Tröge“ beziehungsweise „in die Rinnen“; gemeint sind die Wasserstellen, an denen die Tiere tranken.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: Und immer wenn
  rationale: Die Verbindung leitet im Erzählzusammenhang einen regelmäßig wiederkehrenden Vorgang ein; „immer wenn“ gibt diesen iterativen Sinn natürlich wieder.
- source_word: יַחֵם
  choice: brünstig waren
  rationale: Das Verb bezeichnet bei Tieren das Brünstigsein beziehungsweise die Paarungsbereitschaft. Die Formulierung ist im Deutschen präzise und dem Viehzuchtkontext angemessen.
- source_word: הַצֹּאן
  choice: die Herde / die Tiere der Herde
  rationale: צאן bezeichnet kollektiv Kleinvieh und kann Schafe wie Ziegen einschließen. „Herde“ vermeidet eine unnötige Festlegung auf eine einzelne Tierart.
- source_word: הַמְקֻשָּׁרוֹת
  choice: die kräftigeren Tiere
  rationale: Das seltene Wort bezeichnet hier im Gegensatz zu den schwachen Tieren im folgenden Vers offenbar die robusteren beziehungsweise kräftigeren Tiere.
- source_word: וְשָׂם
  choice: legte Jakob
  rationale: שׂים bedeutet „setzen, legen, hinstellen“. Das deutsche Präteritum steht innerhalb der mit „immer wenn“ gekennzeichneten wiederholten Handlung.
- source_word: הַמַּקְלוֹת
  choice: die Stäbe
  rationale: Gemeint sind die zuvor geschälten Holzstücke oder Zweige, die Jakob als Stäbe verwendete; „Stäbe“ ist knapp und kontextgerecht.
- source_word: לְעֵינֵי הַצֹּאן
  choice: vor den Augen der Herde
  rationale: Die bildhafte hebräische Wendung kann im Deutschen verständlich und nahezu wörtlich beibehalten werden.
- source_word: בָּרֳהָטִים
  choice: in die Tränkrinnen
  rationale: Das Wort bezeichnet hier Rinnen oder Tröge an der Tränke. „Tränkrinnen“ verbindet Form und Funktion ohne die Tierart näher festzulegen.
- source_word: לְיַחְמֶנָּה
  choice: damit die Tiere sich … paarten
  rationale: לְ drückt den Zweck aus; im Zusammenhang bezeichnet der verwandte Stamm den Fortpflanzungsvorgang. Die Formulierung unterscheidet natürlich zwischen der vorausgehenden Paarungsbereitschaft und der beabsichtigten Paarung.
- source_word: בַּמַּקְלוֹת
  choice: bei den Stäben
  rationale: 'Die Präposition beschreibt hier am ehesten die begleitende beziehungsweise örtliche Situation: Die Paarung sollte dort stattfinden, wo die Stäbe vor den Tieren lagen.'
theological_decisions:
- issue: Verhältnis zwischen Jakobs Vorgehen und dem Zuchterfolg
  choice: Der Vers formuliert nur Jakobs Absicht („damit“), ohne die Wirksamkeit der Stäbe zu behaupten.
  alternative: Eine kausale Formulierung wie „um sie durch die Stäbe zur Paarung zu bringen“.
  rationale: Die hebräische Zweckkonstruktion beschreibt Jakobs Ziel. Eine Aussage darüber, ob oder wie die Stäbe den späteren Erfolg bewirkten, sollte nicht in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortwahl bleibt nah am Bild des hebräischen Textes, erläutert seltene Begriffe in Fußnoten und vermeidet eine Festlegung auf Schafe oder Ziegen sowie eine über den Wortlaut hinausgehende kausale Deutung.
