base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: de
  text: 'Als Rahel Josef geboren hatte, sagte Jakob zu Laban: »Lass mich ziehen, damit ich zu meinem Ort und in mein Land gehen kann.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Lass mich ziehen
  rationale: Das Verb שׁלח bedeutet hier, jemanden aus einem Dienst- oder Abhängigkeitsverhältnis zu entlassen beziehungsweise ziehen zu lassen. Die natürliche deutsche Wendung bewahrt diesen Sinn.
- source_word: וְאֵלְכָה
  choice: damit ich ... zurückkehren kann
  rationale: Formal bedeutet die Form »und ich will gehen«. Im Erzählzusammenhang ist Jakobs Ziel die Rückkehr in seine Heimat; »zurückkehren« macht diese Bewegungsrichtung im Deutschen natürlich deutlich, ohne eine zusätzliche theologische Aussage einzuführen.
- source_word: אֶל מְקוֹמִי וּלְאַרְצִי
  choice: an meinen Ort und in mein Land
  rationale: Die zwei parallelen Zielangaben des Hebräischen bleiben erhalten. »Mein Ort« ist bewusst nicht zu »meiner Heimat« geglättet, damit die Abstufung gegenüber »mein Land« gewahrt bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die hebräische Eröffnungsformel ויהי כאשר wird idiomatisch als temporaler Nebensatz wiedergegeben; ein schwerfälliges »Und es geschah« ist hier nicht nötig. Die direkte Rede bleibt knapp und bestimmt.
