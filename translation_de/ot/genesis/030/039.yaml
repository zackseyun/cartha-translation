base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: de
  text: So paarte sich die Herde vor den Stäben, und die Herde brachte gestreifte[a], gesprenkelte[b] und gefleckte Junge zur Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gebänderte“; ältere Übersetzungen geben den Ausdruck teils mit „ringgestreifte“ wieder.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Abgrenzung zwischen „gesprenkelt“ (נְקֻדִּים) und „gefleckt“ (טְלֻאִים) ist unsicher; das zweite Wort kann auch „scheckig“, „fleckig“ oder „bunt gescheckt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: paarte sich
  rationale: Das Verb bezeichnet bei Tieren das Brünstigwerden beziehungsweise den Paarungsvorgang. Im Zusammenhang ist „paarte sich“ klar und natürlich, ohne bereits ausdrücklich die Empfängnis auszudrücken.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: צאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Die Herde“ bewahrt den kollektiven Sinn und die Wiederholung des Hebräischen.
- source_word: אֶל הַמַּקְלוֹת
  choice: vor den Stäben
  rationale: אֶל bedeutet grundsätzlich „zu/auf … hin“; im beschriebenen Zuchtvorgang gibt „vor den Stäben“ die räumliche Situation verständlich wieder, ohne den Stäben ausdrücklich eine kausale Wirkung zuzuschreiben.
- source_word: וַתֵּלַדְןָ
  choice: brachte … Junge zur Welt
  rationale: ילד bedeutet „gebären“. Da im Hebräischen kein ausdrückliches Substantiv für den Nachwuchs steht, wird „Junge“ zur natürlichen deutschen Verständlichkeit ergänzt.
- source_word: עֲקֻדִּים
  choice: gestreifte
  rationale: Das Wort bezeichnet Tiere mit streifen- oder bandartigen Zeichnungen. „Gestreift“ ist die verständlichste moderne Wiedergabe; die mögliche Nuance „gebändert“ wird in einer Fußnote erhalten.
- source_word: נְקֻדִּים
  choice: gesprenkelte
  rationale: Der Ausdruck verweist auf kleine Punkte oder Sprenkel. „Gesprenkelt“ unterscheidet diese feinere Zeichnung von der folgenden Bezeichnung.
- source_word: וּטְלֻאִים
  choice: gefleckte
  rationale: Das Wort bezeichnet eine fleckige oder scheckige Zeichnung. „Gefleckt“ ist im Deutschen natürlich; die genaue Abgrenzung von נְקֻדִּים bleibt unsicher und wird in der Fußnote erläutert.
theological_decisions:
- issue: Mögliche kausale Wirkung der Stäbe
  choice: Räumlich mit „vor den Stäben“ wiedergegeben
  alternative: „durch die Stäbe“ oder eine andere ausdrücklich kausale Formulierung
  rationale: Der hebräische Satz berichtet die räumliche Zuordnung mit אֶל, erklärt aber hier nicht ausdrücklich, auf welche Weise die Zeichnung der Jungen verursacht wurde. Die Übersetzung vermeidet daher eine zusätzliche kausale Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung von „die Herde“ bleibt erhalten. „Junge“ ist als für das Deutsche notwendige Ergänzung ohne eigene Markierung eingefügt; die Fußnotenmarker stehen unmittelbar bei den betreffenden Farbbezeichnungen.
