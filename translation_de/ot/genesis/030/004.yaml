  source_fidelity: 'Der Text bildet alle Elemente des Hebräischen angemessen ab: Die erzählfortführende Verbform wird mit „Da gab sie“ natürlich wiedergegeben; „ihm“, Bilha, „ihre Magd“, „zur Frau“ und die abschließende Nennung Jakobs entsprechen dem Ausgangstext. „Ging zu ihr ein“ bewahrt den euphemistischen Charakter von וַיָּבֹא אֵלֶיהָ, ohne den Sinn zu verändern.'
  naturalness: „Da gab sie ihm ihre Magd Bilha zur Frau, und Jakob ging zu ihr ein“ ist flüssiges, würdiges modernes Bibeldeutsch. „Magd“ und „zu ihr eingehen“ sind bewusst bibelsprachlich geprägt, im Kontext jedoch verständlich und stilistisch passend.
  terminology: Die etablierte deutsche Namensform „Bilha“ ist korrekt. „Magd“ gibt שִׁפְחָה knapp wieder und legt den im Wort selbst nicht vollständig bestimmten sozialen bzw. rechtlichen Status nicht unzulässig fest. „Zur Frau“ entspricht לְאִשָּׁה und vermeidet die zusätzliche Festlegung auf „Nebenfrau“.
