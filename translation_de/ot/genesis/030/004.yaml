  text: וַ/תִּתֶּן ל֛/וֹ אֶת בִּלְהָ֥ה שִׁפְחָתָ֖/הּ לְ/אִשָּׁ֑ה וַ/יָּבֹ֥א אֵלֶ֖י/הָ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: de
  text: Da gab sie ihm ihre Magd Bilha zur Frau, und Jakob ging zu ihr ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Da gab sie
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ gibt die zeitlich-folgernde Bewegung im Deutschen natürlich wieder.
- source_word: לּוֹ
  choice: ihm
  rationale: Der indirekte Gegenstand wird im Deutschen idiomatisch mit dem Dativ wiedergegeben.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: שִׁפְחָתָהּ
  choice: ihre Magd
  rationale: שִׁפְחָה bezeichnet eine weibliche Dienerin in untergeordneter, oft unfreier Stellung. „Magd“ ist knapp, verständlich und lässt den genauen rechtlichen Status offen.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die Wendung bezeichnet hier die Übergabe in eine eheähnliche beziehungsweise eheliche Verbindung; „zur Frau“ bildet die hebräische Formulierung ab, ohne den Status weiter festzulegen.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ging zu ihr ein
  rationale: Die traditionelle deutsche Wendung bewahrt den verhüllenden hebräischen Ausdruck für den Geschlechtsverkehr, ohne ihn expliziter als die Vorlage zu formulieren.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Verwendet wird die etablierte deutsche Form des Personennamens.
theological_decisions:
- issue: Status Bilhas in der Verbindung mit Jakob
  choice: „zur Frau“
  alternative: „zur Nebenfrau“
  rationale: לְאִשָּׁה sagt wörtlich „zur Frau“ und bezeichnet die Verbindung, nennt Bilha hier aber nicht ausdrücklich eine Nebenfrau. Die Übersetzung bewahrt diese Spannung und ergänzt keine präzisierende soziale oder rechtliche Kategorie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Erzählform. „Magd“ ist leicht traditionell, im biblischen Kontext jedoch geläufig und prägnanter als „weibliche Dienerin“. Die verhüllende Wendung „ging zu ihr ein“ ist bewusst quellennah.
