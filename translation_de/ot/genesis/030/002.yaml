base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: de
  text: 'Da wurde Jakob zornig auf Rahel[a] und sagte: „Bin ich etwa an Gottes Stelle, der dir die Frucht des Mutterleibs[b] vorenthalten hat?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da entbrannte Jakobs Zorn gegen Rahel.“'
    reason: lexical_alternative
  - marker: b
    text: Eine hebräische Wendung für Kinder oder Nachkommen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יַעֲקֹב בְּרָחֵל
  choice: Da wurde Jakob zornig auf Rahel
  rationale: Die hebräische Wendung beschreibt wörtlich das Entbrennen des Zorns. „Wurde zornig auf“ gibt Beginn, Stärke und Zielrichtung in natürlichem modernem Deutsch wieder.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Bin ich etwa an Gottes Stelle?
  rationale: תַּחַת bezeichnet hier Stellvertretung beziehungsweise das Einnehmen der Stellung eines anderen. Die rhetorische Frage verneint, dass Jakob über Gottes Stellung und Macht verfügt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Kontext und das folgende singularische Verb weisen auf Gott im Singular.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: Er ist es, der dir … vorenthalten hat
  rationale: Der Relativsatz bezieht sich auf Gott und bezeichnet ihn ausdrücklich als den Handelnden. Die eigenständige deutsche Satzkonstruktion vermeidet einen missverständlichen Anschluss des Relativpronomens an „Stelle“, ohne die Aussage abzuschwächen.
- source_word: פְּרִי בָטֶן
  choice: die Frucht des Mutterleibs
  rationale: Die konkrete hebräische Metapher für Kinder beziehungsweise Nachkommenschaft bleibt erhalten und ist im Deutschen verständlich.
theological_decisions:
- issue: Göttliches Handeln bei Rahels Kinderlosigkeit
  choice: Jakob bezeichnet Gott ausdrücklich als denjenigen, der Rahel die Fruchtbarkeit vorenthalten hat.
  alternative: Jakobs Worte lediglich als rhetorische Abwehr ohne Aussage über Gottes Handeln wiederzugeben.
  rationale: Der Relativsatz אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן weist Gott grammatisch und inhaltlich die Handlung zu. Die Übersetzung bewahrt diese Spannung, ohne sie zu erklären oder abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und emotional. „Frucht des Mutterleibs“ bewahrt die biblische Metapher; die erläuternde Fußnote sichert die unmittelbare Verständlichkeit.
