  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: de
  text: Und der Mann wurde überaus wohlhabend; er bekam zahlreiche Herden, Sklavinnen und Sklaven, Kamele und Esel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: wurde überaus wohlhabend
  rationale: פרץ bezeichnet bildhaft ein machtvolles Sich-Ausbreiten beziehungsweise Anwachsen; zusammen mit der doppelten Verstärkung und der anschließenden Besitzliste gibt „wurde überaus wohlhabend“ den resultativen Sinn natürlich und nachdrücklich wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Bewahrt die Bezeichnung des hebräischen Textes; im Kontext ist Jakob gemeint, ohne dass sein Name hier ausdrücklich wiederholt wird.
- source_word: וַיְהִי לוֹ
  choice: er bekam
  rationale: Die Konstruktion bezeichnet entstehenden Besitz. „Er bekam“ bildet diese Entwicklung knapper und natürlicher ab als das statische „er hatte“.
- source_word: צֹאן רַבּוֹת
  choice: große Herden
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen; רַבּוֹת hebt den großen Umfang hervor. „Große Herden“ ist im Deutschen idiomatisch.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: Sklavinnen und Sklaven
  rationale: Die Wörter können je nach Kontext auch mit „Mägde“ und „Knechte“ beziehungsweise „Dienerinnen“ und „Diener“ wiedergegeben werden. In dieser Aufzählung erworbenen Besitzes macht die gewählte Form den unfreien sozialen Status sichtbar und bewahrt zugleich die Geschlechterpaarung.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: Kamele und Esel
  rationale: Direkte, moderne Standardbezeichnungen der genannten Tiere.
theological_decisions:
- issue: Sklavensprache oder Dienstbotensprache für שְׁפָחוֹת und עֲבָדִים
  choice: Sklavinnen und Sklaven
  alternative: Mägde und Knechte; Dienerinnen und Diener
  rationale: Die Begriffe decken ein Spektrum abhängiger Hausarbeit ab. Da die Menschen hier in einer Reihe mit Jakobs erworbenem Besitz genannt werden, bildet „Sklavinnen und Sklaven“ die soziale Unfreiheit deutlicher ab, ohne sie zu beschönigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon gliedert die Folge von Jakobs starkem Wohlstandszuwachs und der konkretisierenden Besitzliste. Die kumulative Aufzählung bleibt ohne unnötige Zusätze erhalten.
