base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: de
  text: 'Zur Zeit der Weizenernte ging Ruben und fand auf dem Feld Alraunen[a]. Er brachte sie seiner Mutter Lea. Da sagte Rahel zu Lea: »Bitte gib mir einige von den Alraunen deines Sohnes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Liebesäpfel«. Das hebräische Wort bezeichnet eine Pflanze, die traditionell als Alraune identifiziert und im Zusammenhang dieser Erzählung mit Fruchtbarkeit in Verbindung gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Zur Zeit der Weizenernte
  rationale: Die Wendung bezeichnet den Zeitraum der Weizenernte. Die deutsche Formulierung ist natürlich und bewahrt den zeitlichen sowie landwirtschaftlichen Rahmen.
- source_word: וַיֵּלֶךְ
  choice: ging hinaus
  rationale: הלך bedeutet grundsätzlich »gehen«. Im Kontext des anschließenden Fundes auf dem Feld macht »ging hinaus« die Bewegung dorthin idiomatisch deutlich, ohne ein bestimmtes Ausgangsziel hinzuzufügen.
- source_word: דּוּדָאִים
  choice: Alraunen
  rationale: Dies ist die traditionelle und im Deutschen geläufigste botanische Zuordnung. Da die genaue Identifikation nicht völlig sicher ist, wird die Unsicherheit in einer Fußnote kenntlich gemacht.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שׂדה bezeichnet hier ein Feld beziehungsweise offenes Land; »auf dem Feld« ist im Deutschen die naheliegende kontextuelle Wiedergabe.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: Er brachte sie seiner Mutter Lea
  rationale: Der Hifil von בוא bedeutet »bringen«. Die deutsche Wortstellung gibt Beziehung und Namen natürlich wieder.
- source_word: תְּנִי נָא לִי
  choice: Bitte gib mir
  rationale: Die Partikel נָא kennzeichnet hier eine höfliche oder eindringliche Bitte; »bitte« bewahrt diesen Ton.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: einige von den Alraunen deines Sohnes
  rationale: מִן ist partitiv gebraucht. »Einige von« gibt diesen Sinn im Deutschen klar wieder; der Singular בְּנֵךְ verweist auf Leas Sohn Ruben.
