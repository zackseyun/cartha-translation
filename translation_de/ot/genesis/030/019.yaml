  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: de
  text: Lea wurde wieder schwanger und gebar Jakob einen sechsten Sohn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet hier die Empfängnis beziehungsweise das Eintreten einer Schwangerschaft. „Wurde schwanger“ ist im heutigen Deutsch natürlich und eindeutig.
- source_word: עוֹד
  choice: wieder
  rationale: 'עוֹד kennzeichnet in dieser Erzählfolge die Wiederholung: Lea wurde erneut schwanger.'
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: ילד bedeutet in dieser Form „gebären“. „Gebar“ ist knapp, würdevoll und in biblischen Geburtserzählungen gut verständlich.
- source_word: בֵּן
  choice: Sohn
  rationale: בֵּן bedeutet hier unmittelbar „Sohn“.
- source_word: שִׁשִּׁי
  choice: einen sechsten
  rationale: Die Ordnungszahl bestimmt „Sohn“ und bezeichnet ihn als Leas sechsten Sohn für Jakob. Der unbestimmte Artikel entspricht der hebräischen Konstruktion und natürlichem Deutsch.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Das Präfix לְ bezeichnet in der Wendung die Beziehung zu Jakob. Die deutsche Konstruktion „Jakob einen Sohn gebären“ gibt dies idiomatisch und knapp wieder.
