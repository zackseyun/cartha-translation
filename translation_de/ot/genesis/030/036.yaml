  yaml_path: translation/ot/genesis/030/036.yaml
  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: de
  text: Und er legte einen Abstand von drei Tagesreisen zwischen sich und Jakob; Jakob aber hütete die übrige Herde Labans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: er legte eine Entfernung von drei Tagereisen
  rationale: Die Wendung bezeichnet einen räumlichen Abstand, der einer Reise von drei Tagen entspricht. „Drei Tagereisen“ gibt das idiomatische Maß im Deutschen natürlich und präzise wieder.
- source_word: רֹעֶה
  choice: hütete
  rationale: Das Partizip beschreibt Jakobs fortdauernde Tätigkeit als Hirt; im erzählenden deutschen Kontext ist das Präteritum idiomatisch.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: die übrigen Schafe Labans
  rationale: צֹאן bezeichnet Kleinvieh beziehungsweise eine Herde aus Schafen und Ziegen. „Schafe“ ist hier eine verständliche, traditionelle Sammelbezeichnung; הַנּוֹתָרֹת meint den nach der Aussonderung verbliebenen Teil.
