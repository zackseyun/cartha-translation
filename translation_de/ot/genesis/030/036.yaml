  register: Moderne, würdige Erzählsprache. Der Gegensatz zwischen Labans räumlicher Trennung und Jakobs fortdauernder Hirtentätigkeit wird durch „aber“ klar wiedergegeben, ohne zusätzliche Deutung einzutragen.
