- from: 'So wird meine Redlichkeit künftig für mich Zeugnis ablegen[a], wenn du kommst, um meinen Lohn zu überprüfen[b]: Jede Ziege bei mir, die nicht gesprenkelt und gefleckt ist, und jedes Schaf, das nicht dunkel gefärbt ist[c], gilt als gestohlen[d].'
  to: 'Später wird meine Redlichkeit für mich Zeugnis ablegen[a], wenn du kommst, um meinen Lohn zu überprüfen[b]: Jede Ziege, die nicht gesprenkelt und gefleckt ist, und jedes Lamm, das nicht dunkel gefärbt ist[c], gilt, wenn es sich bei mir findet, als gestohlen[d].'
