    rationale: Das abschließende אִתִּי („bei mir“) bezieht sich auf jedes Tier, das die genannten Kriterien nicht erfüllt, also auf Ziegen und Lämmer. Die deutsche Satzstellung soll diese Reichweite kenntlich machen.
  - severity: low
    issue: „künftig“ kann ein fortdauerndes „von nun an“ ausdrücken.
    rationale: בְּיוֹם מָחָר bezeichnet wörtlich den folgenden Tag und kann kontextuell einen späteren Prüfzeitpunkt meinen. „Später“ bewahrt diese punktuelle zeitliche Offenheit besser.
