source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: de
  text: 'Später wird meine Redlichkeit für mich Zeugnis ablegen[a], wenn du kommst, um meinen Lohn zu überprüfen[b]: Jede Ziege, die nicht gesprenkelt und gefleckt ist, und jedes Lamm, das nicht dunkel gefärbt ist[c], gilt, wenn es sich bei mir findet, als gestohlen[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Gerechtigkeit« beziehungsweise »meine Aufrichtigkeit wird für mich antworten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »am morgigen Tag, wenn du wegen meines Lohnes vor dich kommst«. Die Zeitangabe kann »morgen« oder allgemeiner einen späteren Zeitpunkt meinen, an dem Laban die Herde überprüft.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »braun«. Das hebräische Wort bezeichnet bei den Lämmern eine dunkle Färbung.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: »Jedes, das unter den Ziegen nicht gesprenkelt und gefleckt und unter den Lämmern nicht dunkel ist, ist bei mir gestohlen.«'
    reason: literal_rendering
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: wird für mich Zeugnis ablegen
  rationale: Das hebräische Idiom bezeichnet hier eine Antwort beziehungsweise ein Zeugnis zugunsten Jakobs. Die deutsche Formulierung bewahrt das Bild und ist im Zusammenhang verständlich.
- source_word: צִדְקָתִי
  choice: meine Redlichkeit
  rationale: Im Zusammenhang der Lohnvereinbarung geht es um Jakobs nachprüfbare Aufrichtigkeit. „Redlichkeit“ wahrt den ethischen Gehalt von צדקה, ohne hier vorschnell einen ausschließlich theologischen Sinn festzulegen.
- source_word: בְּיוֹם מָחָר
  choice: künftig
  rationale: Wörtlich steht „am morgigen Tag“; die Wendung kann jedoch allgemein auf einen späteren Zeitpunkt der Überprüfung weisen. „Künftig“ gibt diese zeitliche Offenheit natürlich wieder.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: wenn du kommst, um meinen Lohn zu überprüfen
  rationale: Der Kontext legt eine künftige Kontrolle von Jakobs Lohnbestand durch Laban nahe. Das im Deutschen redundante „vor dir“ wird nicht eigens wiederholt, da Labans persönliche Prüfung bereits ausgedrückt ist.
- source_word: נָקֹד וְטָלוּא
  choice: gesprenkelt und gefleckt
  rationale: Die beiden Bezeichnungen für unterschiedliche Zeichnungen werden mit zwei unterscheidbaren, geläufigen deutschen Wörtern wiedergegeben.
- source_word: חוּם
  choice: dunkel gefärbt
  rationale: Das Wort bezeichnet wahrscheinlich eine dunkle beziehungsweise braune Färbung. Die breitere Wiedergabe vermeidet eine nicht sichere Festlegung auf einen genauen Farbton.
- source_word: בָּעִזִּים / בַּכְּשָׂבִים
  choice: Ziege / Schaf
  rationale: Die beiden Tiergruppen werden im Deutschen idiomatisch als Ziegen und Schafe bezeichnet; כשבים kann Lämmer oder Schafe meinen, bezeichnet hier aber die entsprechende Gruppe innerhalb der Herde.
- source_word: גָּנוּב הוּא אִתִּי
  choice: gilt als gestohlen
  rationale: Der knappe hebräische Satz legt fest, dass jedes nicht vereinbarungsgemäß gefärbte Tier in Jakobs Besitz als gestohlen anzusehen ist.
theological_decisions:
- issue: Bedeutung von צִדְקָתִי
  choice: Redlichkeit
  alternative: Gerechtigkeit
  rationale: „Redlichkeit“ entspricht dem konkreten Kontext einer überprüfbaren Lohnvereinbarung, während die Fußnote die wörtlichere und theologisch weiter gefasste Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zeugnis-Metapher des hebräischen Textes bleibt erhalten; zugleich werden die Lohnkontrolle und die rechtliche Folge idiomatisch verständlich formuliert. Sämtliche Fußnotenmarker stehen an inhaltlich passenden Stellen im Haupttext.
