base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: de
  text: Als Lea sah, dass sie aufgehört hatte, Kinder zu gebären, nahm sie ihre Dienerin[a] Silpa und gab sie Jakob zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sklavin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als Lea sah
  rationale: Das narrative Waw führt die Handlung weiter; mit „Als“ wird der zeitliche Zusammenhang mit der folgenden Handlung in natürlichem Deutsch wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt von Leas Wahrnehmung ein, nicht eine Begründung.
- source_word: עָמְדָה מִלֶּדֶת
  choice: aufgehört hatte, Kinder zu gebären
  rationale: Die Verbindung עמד + מן + Infinitiv bedeutet, mit einer Tätigkeit aufzuhören. Der deutsche Ausdruck gibt den idiomatischen Sinn und den Geburtskontext klar wieder.
- source_word: שִׁפְחָתָהּ
  choice: ihre Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Hausdienerin beziehungsweise Sklavin. „Dienerin“ ist gegenwärtiges, würdiges Deutsch; eine Fußnote weist auf die mögliche stärkere Wiedergabe hin.
- source_word: זִלְפָּה
  choice: Silpa
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Das ל markiert in der Konstruktion das indirekte Objekt; im Deutschen steht dieses idiomatisch im Dativ ohne Präposition.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste Verbindung נתן ל... לאשה bezeichnet die Übergabe in eine eheliche Stellung. „Zur Frau“ bewahrt die ausdrückliche Eheterminologie.
theological_decisions:
- issue: Silpas Stellung im Haushalt und die Ehebezeichnung
  choice: Silpa wird als Leas „Dienerin“ bezeichnet und Jakob „zur Frau“ gegeben.
  alternative: „Sklavin“ beziehungsweise „Nebenfrau“
  rationale: Der Vers hält Silpas untergeordnete Stellung als שִׁפְחָה und zugleich die ausdrückliche Bezeichnung לְאִשָּׁה zusammen. „Nebenfrau“ wäre eine interpretierende Statusbestimmung, die hier nicht ausdrücklich steht; „Sklavin“ bleibt als lexikalische Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge und die Spannung zwischen Silpas abhängiger Stellung und ihrer Bezeichnung als Frau werden bewahrt.
