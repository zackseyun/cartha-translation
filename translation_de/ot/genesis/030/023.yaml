  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: de
  text: 'Sie wurde schwanger und gebar einen Sohn. Da sagte sie: »Gott hat meine Schande[a] weggenommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Schmach« beziehungsweise »meine Entehrung«.'
    reason: Lexikalische Alternativen für חֶרְפָּה, das öffentliche Beschämung und gesellschaftliche Herabsetzung bezeichnen kann.
lexical_decisions:
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: הרה bezeichnet das Schwangerwerden beziehungsweise Empfangen. „Sie wurde schwanger“ ist im modernen Deutsch natürlich und eindeutig.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: ילד mit בֵּן bedeutet, einen Sohn zur Welt zu bringen. „Gebar“ wahrt den knappen, würdevollen Erzählstil.
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Die Wayyiqtol-Form setzt die Erzählfolge fort; „Da“ gibt den zeitlich-folgernden Anschluss im Deutschen natürlich wieder.
- source_word: אָסַף
  choice: hat ... weggenommen
  rationale: אָסַף hat hier im Zusammenhang mit Schande die Bedeutung „beseitigen/wegnehmen“. Das Perfekt bringt das erreichte Ergebnis in der direkten Rede zum Ausdruck.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier aufgrund des singularischen Verbs und des Kontextes den einen Gott.
- source_word: חֶרְפָּתִי
  choice: meine Schande
  rationale: חֶרְפָּה bezeichnet Schmach, Schande oder gesellschaftliche Herabsetzung. „Meine Schande“ ist modern verständlich und bewahrt die soziale Dimension der Kinderlosigkeit im Kontext.
theological_decisions:
- issue: Singularische Wiedergabe von אֱלֹהִים
  choice: Gott
  alternative: Götter
  rationale: Das singularische Prädikat אָסַף und der Kontext verlangen einen singularischen Bezug; eine weitergehende theologische Ausdeutung ist nicht nötig.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die knappe Satzstruktur des Hebräischen bleibt erhalten; „Schande“ wird durch eine Fußnote lexikalisch präzisiert.
