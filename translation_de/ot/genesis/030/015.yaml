  naturalness: Der Dialog ist flüssig, modern und dem vorwurfsvollen beziehungsweise sachlichen Ton angemessen. „Mit dir schlafen“ ist im Deutschen die natürliche Entsprechung der hier verwendeten ehelichen Umschreibung und macht den vereinbarten Sinn klar, ohne zusätzlichen Kommentar einzutragen.
