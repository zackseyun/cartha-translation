  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: de
  text: 'Doch sie antwortete ihr: „Ist es dir nicht genug, dass du mir meinen Mann genommen hast? Willst du nun auch noch die Alraunen meines Sohnes nehmen?“ Rahel sagte: „Dann darf er heute Nacht mit dir schlafen – im Austausch für die Alraunen deines Sohnes.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Ist es dir nicht genug
  rationale: Die rhetorische Frage bedeutet wörtlich etwa „Ist es zu wenig?“; die gewählte deutsche Wendung gibt den vorwurfsvollen Sinn natürlich und klar wieder.
- source_word: קַחְתֵּךְ אֶת־אִישִׁי
  choice: dass du mir meinen Mann genommen hast
  rationale: Bewahrt das Verb „nehmen“ und macht durch „mir“ den im Kontext empfundenen Entzug deutlich, ohne weitere Motive einzutragen.
- source_word: דּוּדָאִים
  choice: Alraunen
  rationale: Übliche und botanisch plausible Wiedergabe des hebräischen Pflanzennamens; die mögliche kulturelle Bedeutung wird nicht in den Haupttext hineingedeutet.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: darf er … bei dir schlafen
  rationale: Gibt den idiomatischen Ausdruck würdig und verständlich wieder; im Erzählkontext bezeichnet er das eheliche Beisammensein, ohne expliziter als der Ausgangstext zu werden.
- source_word: תַּחַת
  choice: im Austausch für
  rationale: Drückt hier die vereinbarte Gegenleistung klarer aus als das missverständliche wörtliche „anstelle von“.
theological_decisions:
- issue: Bewertung der Vereinbarung zwischen Lea und Rahel
  choice: Die Erzählung wird ohne ausdrückliche moralische oder theologische Wertung wiedergegeben.
  alternative: Die Handlung als Billigung oder Verurteilung des Tauschs auslegen.
  rationale: Der Vers berichtet die Abmachung, formuliert an dieser Stelle aber keine ausdrückliche göttliche oder erzählerische Bewertung.
- issue: Bedeutung der Alraunen
  choice: Nur die Pflanze wird benannt.
  alternative: Eine angebliche fruchtbarkeitsfördernde oder magische Funktion ausdrücklich nennen.
  rationale: Solche kulturellen Assoziationen sind möglich, werden in diesem Vers jedoch nicht ausdrücklich ausgesagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Dialog. Der scharfe Vorwurf Leas und der sachliche Charakter von Rahels Tauschvorschlag bleiben erhalten; keine Fußnoten erforderlich.
