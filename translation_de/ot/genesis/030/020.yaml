base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: de
  text: 'Und Lea sagte: »Gott hat mich mit einer guten Gabe beschenkt. Diesmal wird mein Mann mich ehren[a], denn ich habe ihm sechs Söhne geboren.« Und sie gab ihm den Namen Sebulon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird bei mir wohnen«. Das seltene hebräische Verb klingt an den Namen Sebulon an; möglicherweise schwingen sowohl Ehre als auch das Wohnen oder Bleiben bei Lea mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: hat mich mit einer guten Gabe beschenkt
  rationale: Die Verbindung von »beschenkt« und »Gabe« gibt die Wiederholung desselben hebräischen Wortstamms זבד in natürlichem Deutsch annähernd wieder.
- source_word: הַפַּעַם
  choice: Diesmal
  rationale: Idiomatiches und kontextgerechtes Deutsch für Leas Erwartung einer nun eintretenden Veränderung.
- source_word: יִזְבְּלֵנִי
  choice: wird ... mich ehren
  rationale: Die seltene Verbform ist unsicher. »Mich ehren« passt zu Leas Hoffnung auf größere Wertschätzung durch Jakob; die ebenfalls mögliche Bedeutung »bei mir wohnen« wird in der Fußnote bewahrt.
- source_word: אִישִׁי
  choice: mein Mann
  rationale: Im ehelichen Zusammenhang ist dies die natürliche deutsche Entsprechung.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: ich habe ihm sechs Söhne geboren
  rationale: Bewahrt sowohl Leas Gebären als auch den indirekten Bezug auf ihren Mann.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: sie gab ihm den Namen Sebulon
  rationale: Gibt die hebräische Namensformel in flüssigem modernem Deutsch wieder; »Sebulon« entspricht der üblichen deutschen Namensform.
theological_decisions:
- issue: Bedeutung des seltenen Verbs יִזְבְּלֵנִי
  choice: im Haupttext »wird mich ehren«
  alternative: »wird bei mir wohnen« beziehungsweise »bei mir bleiben«
  rationale: Der Kontext legt Leas Hoffnung auf veränderte Anerkennung nahe, doch die lexikalische Unsicherheit und das Wortspiel mit Sebulon dürfen nicht eingeebnet werden; deshalb steht die Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Doppelung »Gabe beschenkt« macht das hebräische Stammwortspiel verständlich, ohne im Deutschen gekünstelt zu wirken. Die Ambiguität des seltenen Verbs bleibt durch die Fußnote ausdrücklich erhalten.
