  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: de
  text: 'Dann sagte er: „Nenne deinen Lohn, und ich werde ihn dir zahlen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Dann sagte er
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann“ gibt die zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: נָקְבָה
  choice: Bestimme
  rationale: נקב bedeutet hier, etwas ausdrücklich zu benennen oder festzusetzen. Bei einer Lohnvereinbarung ist „bestimme“ im Deutschen natürlich und präzise.
- source_word: שְׂכָרְךָ
  choice: deinen Lohn
  rationale: שָׂכָר bezeichnet hier die Vergütung für geleistete Arbeit. Der deutsche Singular „Lohn“ entspricht dem hebräischen Singular und passt zum Arbeitsverhältnis zwischen Laban und Jakob.
- source_word: עָלַי
  choice: den ich dir zahlen soll
  rationale: Wörtlich „auf mich“ bezeichnet עָלַי hier die Verpflichtung, die Laban übernimmt. Die Relativkonstruktion gibt diese idiomatische Bedeutung verständlich wieder, ohne die Präposition unnatürlich nachzubilden.
- source_word: וְאֶתֵּנָה
  choice: zahlen soll
  rationale: נתן heißt grundsätzlich „geben“; bei „Lohn“ ist „zahlen“ die natürliche deutsche Verbindung. Die Form drückt Labans Bereitschaft beziehungsweise Zusage aus, den festgelegten Lohn zu leisten.
