  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: de
  text: 'Da sagte Josef zum Pharao: „Die Träume des Pharaos sind eins[a]. Was Gott tut[b], hat er dem Pharao mitgeteilt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der Traum des Pharaos ist einer.“ Obwohl im Hebräischen „Traum“ im Singular steht, bezieht sich Josef im Zusammenhang auf die beiden Träume als eine einzige zusammengehörige Botschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, dem Zusammenhang entsprechend: „Was Gott tun wird“ oder „Was Gott zu tun im Begriff ist“. Das hebräische Partizip kann gegenwärtiges oder bevorstehendes Handeln bezeichnen; hier weist der Zusammenhang auf das hin, was Gott herbeiführen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Erzählform führt die Handlung weiter; „Da sagte“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Der Traum des Pharaos ist ein einziger
  rationale: Die singularische Form des Hebräischen bleibt erhalten. Zugleich macht „ein einziger“ deutlich, dass die beiden Traumbilder als eine zusammengehörige Botschaft gelten, ohne dies als bloß gleiche Bedeutung zu paraphrasieren.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte hebräische Ausdruck bezeichnet hier Gott; im Deutschen ist „Gott“ die natürliche Form.
- source_word: עֹשֶׂה
  choice: tut
  rationale: Das Partizip wird möglichst direkt wiedergegeben. Die im Zusammenhang mögliche prospektive Bedeutung wird nicht stillschweigend in den Haupttext eingebaut, sondern in einer Fußnote genannt.
- source_word: הִגִּיד
  choice: hat ... mitgeteilt
  rationale: Der Hifil von נגד bezeichnet das Bekanntmachen oder Mitteilen. Diese Wiedergabe ist klar, würdig und vermeidet eine unnötige theologische Zuspitzung.
- source_word: לְפַרְעֹה
  choice: dem Pharao
  rationale: Natürliche deutsche Wiedergabe des indirekten Objekts.
theological_decisions:
- issue: Bezeichnung הָאֱלֹהִים
  choice: Gott
  alternative: der Gott
  rationale: „Gott“ entspricht hier sowohl dem bestimmten Bezug des Hebräischen als auch dem natürlichen deutschen Sprachgebrauch, ohne zusätzliche dogmatische Aussage.
- issue: Zeitbezug des Partizips עֹשֶׂה
  choice: tut
  alternative: tun wird / im Begriff ist zu tun
  rationale: Das hebräische Partizip bezeichnet Gottes Handeln, lässt den genauen Zeitbezug aber formal offen. Der Kontext weist auf bevorstehendes Handeln, doch diese Nuance wird wegen der grammatischen Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „Pharao“ folgt dem Hebräischen. Die Satzteilung wahrt den engen Gedankenzusammenhang, ohne eine schwerfällige semikolonartige Konstruktion zu erzwingen.
