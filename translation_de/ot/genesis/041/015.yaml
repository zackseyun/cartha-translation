  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: de
  text: 'Der Pharao sagte zu Josef: »Ich habe einen Traum gehabt, aber niemand kann ihn deuten. Nun habe ich über dich sagen hören, dass du einen Traum hören und ihn deuten kannst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Ich habe einen Traum gehabt
  rationale: Die hebräische figura etymologica lautet wörtlich »Ich habe einen Traum geträumt«; die gewählte idiomatische deutsche Form bewahrt den Inhalt ohne unnatürliche Wiederholung.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: aber niemand kann ihn deuten
  rationale: Die Konstruktion besagt, dass kein Deuter für den Traum vorhanden ist; im Deutschen drückt die personale Form den Sinn natürlich aus.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: habe ich über dich sagen hören
  rationale: Bewahrt sowohl das Hörensagen als auch den Bezug auf Josef.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: dass du einen Traum nur zu hören brauchst, um ihn zu deuten
  rationale: 'Gibt die knappe hebräische Aussage idiomatisch wieder: Josef müsse einen Traum hören und sei dann imstande, ihn zu deuten. Das ergänzte »nur« bringt die im Zusammenhang liegende Behauptung des Pharaos zum Ausdruck.'
theological_decisions:
- issue: Quelle von Josefs Fähigkeit zur Traumdeutung
  choice: Der Vers gibt ausschließlich die Einschätzung des Pharaos wieder und schreibt Josef die Fähigkeit sprachlich zu.
  alternative: Schon hier ausdrücklich sagen, dass Gott die Deutung gibt.
  rationale: Eine ausdrückliche Zuschreibung an Gott würde Vers 16 vorwegnehmen und Information eintragen, die in Vers 15 selbst nicht steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Pharao« wird mit bestimmtem Artikel gebraucht, wie es im Deutschen für den Herrschertitel natürlich ist. Die direkte Rede bleibt flüssig und allgemein verständlich.
