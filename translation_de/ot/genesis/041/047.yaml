  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: de
  text: In den sieben Jahren des Überflusses brachte das Land reichen Ertrag[a] hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in Handvoll(en)“ oder „handvollweise“. Das hebräische Wort bezeichnet „Handvoll(en)“ oder „Faustvoll(en)“ und beschreibt den außerordentlich reichen Ertrag des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: brachte … hervor
  rationale: Das Verb עשה bedeutet grundsätzlich „machen/tun“; mit „das Land“ als Subjekt bezeichnet es hier idiomatisch das Hervorbringen landwirtschaftlichen Ertrags.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das Ackerland Ägyptens gemeint, nicht die gesamte Erde.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: in den sieben Jahren des Überflusses
  rationale: Die Wendung bezeichnet die zuvor angekündigte Zeit reichen Ertrags; „Überfluss“ gibt שׂבע natürlich und prägnant wieder.
- source_word: לִקְמָצִים
  choice: in Hülle und Fülle
  rationale: קְמָצִים bedeutet wörtlich „Handvoll(en)“. Die adverbiale Wendung beschreibt hier offenbar die außergewöhnliche Menge; das deutsche Idiom vermittelt dies natürlich, während die Fußnote das konkrete hebräische Bild bewahrt.
