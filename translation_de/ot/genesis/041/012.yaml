  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: de
  text: Dort war bei uns ein junger Hebräer, ein Sklave des Obersten der Leibwache.[a] Wir erzählten ihm unsere Träume, und er deutete sie uns; er deutete jedem entsprechend seinem Traum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Amtsbezeichnung lautet wörtlich etwa „Oberster der Schlachter“; im Kontext kann sie eine Leibwache oder Scharfrichtertruppe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: ein junger Hebräer
  rationale: נַעַר bezeichnet hier einen jungen Mann; im Deutschen bringt das substantivierte „junger Hebräer“ Alter und ethnische Zuordnung knapp und natürlich zum Ausdruck.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Josephs rechtlich gebundener Status und seine Zugehörigkeit zum Obersten werden im Kontext ausdrücklich hervorgehoben; „Sklave“ gibt dies deutlicher wieder als das weiter gefasste „Diener“.
- source_word: שַׂר הַטַּבָּחִים
  choice: Oberster der Leibwache
  rationale: Die Wortgruppe ist eine ägyptische Amtsbezeichnung. „Oberster der Leibwache“ ist im Erzählzusammenhang verständlich und wahrt den militärisch-höfischen Rang; die wörtlichere Deutung wird in der Fußnote genannt.
- source_word: וַנְּסַפֶּר לוֹ
  choice: Wir erzählten ihm unsere Träume
  rationale: Das Objekt ist aus dem folgenden „unsere Träume“ eindeutig zu ergänzen. Die Einfügung vermeidet im Deutschen ein unnatürliches absolutes „wir erzählten ihm“.
- source_word: וַיִּפְתָּר לָנוּ
  choice: er deutete sie uns
  rationale: פתר bezeichnet im Zusammenhang mit Träumen deren Deutung; das Pronomen „sie“ greift die Träume natürlich wieder auf.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: jedem deutete er seinen Traum entsprechend
  rationale: 'Die Formulierung bewahrt den distributiven Sinn: Jeder erhielt eine Deutung, die seinem eigenen Traum entsprach, ohne die hebräische Satzstellung im Deutschen steif nachzubilden.'
