  text: Siehe, sieben Jahre mit großem Überfluss kommen im ganzen Land Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel hebt die unmittelbar bevorstehende Ankündigung hervor; „Siehe“ ist im biblischen Erzählstil würdig und verständlich.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre
  rationale: Direkte Wiedergabe der Zeitangabe.
- source_word: בָּאוֹת
  choice: kommen
  rationale: Das feminine Pluralpartizip stimmt mit „Jahre“ überein und stellt die kommende Zeit anschaulich als herannahend dar.
- source_word: שָׂבָע גָּדוֹל
  choice: mit großem Überfluss
  rationale: שָׂבָע bezeichnet hier die Fülle an Nahrung und Ertrag; „großer Überfluss“ gibt die intensive Versorgungslage wieder. „Mit“ ordnet die knappe hebräische Apposition im Deutschen natürlich den Jahren zu.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Wendung bezeichnet die gesamte Ausdehnung des ägyptischen Landes.
