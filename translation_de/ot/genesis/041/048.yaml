  rationale: Die Überarbeitung beseitigt eine im modernen Deutschen unnatürliche, überliteralistische Relativformulierung und gibt das kollektive אוכל einheitlich als „Nahrung“ wieder. Die Satzfolge und die betonte Wiederaufnahme des hebräischen Originals bleiben erhalten. Der Fußnotenanker bleibt am Schluss der betreffenden Aussage.
