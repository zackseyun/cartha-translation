base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: de
  text: Und er sammelte alle Nahrung aus den sieben Jahren in Ägypten und brachte die Nahrung in die Städte. In jede Stadt brachte er die Nahrung von den Feldern rings um sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Die Nahrung vom Feld der Stadt, das rings um sie lag, brachte er in sie.“ Das Hebräische wiederholt „Nahrung“ und nimmt die Satzkonstruktion zur Hervorhebung wieder auf.'
    reason: Macht die hebräische Wiederholung sowie die resumptive Konstruktion („… brachte er in sie“) sichtbar; „sie“ bezeichnet die Stadt.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: er sammelte
  rationale: קבץ bezeichnet das Zusammentragen oder Sammeln; „sammelte“ ist im erzählenden Zusammenhang natürlich und quellennah.
- source_word: כָּל אֹכֶל
  choice: alle Nahrungsmittel
  rationale: אֹכֶל bedeutet allgemein „Nahrung“ oder „Lebensmittel“. Der Plural „Nahrungsmittel“ passt zum eingesammelten Ertrag, ohne den Begriff vorschnell auf Getreide einzuengen.
- source_word: שֶׁבַע שָׁנִים
  choice: den sieben Jahren
  rationale: Die bestimmten sieben Jahre sind aus dem vorausgehenden Zusammenhang bekannt.
- source_word: אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: die im Land Ägypten waren
  rationale: Die bewusst schlichte Wiedergabe folgt dem hebräischen „die ... waren“ und erhält dessen ungewöhnliche zeitliche Formulierung.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: brachte die Nahrungsmittel in die Städte
  rationale: נתן bedeutet wörtlich „geben/setzen/legen“. Im Zusammenhang des Einsammelns ist „brachte ... in“ natürlich, ohne das deutendere „lagerte“ in den Haupttext einzuführen.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: die Nahrungsmittel von den Feldern rings um sie
  rationale: Die Konstruktion bezeichnet den Ertrag des Feldlands, das die jeweilige Stadt umgab. „rings um sie“ bezieht das feminine Suffix wie im Hebräischen auf die Stadt.
- source_word: נָתַן בְּתוֹכָהּ
  choice: In jede Stadt brachte er
  rationale: Die distributive Neuformulierung gibt das resumptive hebräische Satzgefüge verständlich wieder; בְּתוֹכָהּ bezeichnet das Innere der jeweiligen Stadt.
