  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: de
  text: Und siehe, sieben dünne, vom Ostwind versengte Ähren sprossen nach ihnen hervor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt den anschaulichen Erzählmarker, der das neue Traumbild unvermittelt vor Augen stellt; die leicht gehobene Form passt zum würdevollen biblischen Erzählstil.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sieben Ähren
  rationale: שִׁבֳּלִים bezeichnet hier die korntragenden Ähren, nicht die ganzen Halme.
- source_word: דַּקּוֹת
  choice: dünne
  rationale: Gibt die kümmerliche, wenig gefüllte Gestalt der Ähren direkt und natürlich wieder.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: vom Ostwind versengte
  rationale: Das Partizip beschreibt die schädigende Wirkung des heißen Ostwinds; »versengt« ist im Deutschen anschaulich und präzise.
- source_word: צֹמְחוֹת
  choice: sprossen … hervor
  rationale: Gibt das partizipiale, im Traumbild fortschreitende Aufwachsen lebendig und idiomatisch wieder.
- source_word: אַחֲרֵיהֶן
  choice: nach ihnen
  rationale: Bezieht sich auf die sieben Ähren des vorherigen Verses und wahrt die mögliche zeitliche beziehungsweise räumliche Folge.
