  naturalness: Der Satzbau ist flüssiges modernes Standarddeutsch. Die Formulierung „sie dem Pharao deuten“ ist wegen des absichtlich bewahrten pluralischen Rückbezugs leicht markiert, aber verständlich und wird sachgerecht durch die Fußnote erklärt.
