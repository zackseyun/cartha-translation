base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: de
  text: Am Morgen war sein Geist beunruhigt. Da ließ er alle Magier Ägyptens und alle Weisen des Landes rufen. Der Pharao erzählte ihnen seinen Traum, doch niemand konnte sie dem Pharao deuten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht hier ein Mehrzahlpronomen: „sie deuten“. Zuvor steht jedoch „seinen Traum“ in der Einzahl. Die Mehrzahl kann sich auf die einzelnen Traumbilder oder auf die beiden Traumerlebnisse beziehen.'
    reason: Bewahrt und erläutert den Numeruswechsel im hebräischen Text, ohne ihn stillschweigend aufzulösen.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Am Morgen
  rationale: Eine natürliche deutsche Zeitangabe, die den Fortgang der Erzählung wiedergibt.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: war sein Geist beunruhigt
  rationale: „Geist“ bewahrt רוּחַ, während „beunruhigt“ die innere Erregung des Verbs פעמ idiomatisch ausdrückt.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: ließ er … rufen
  rationale: 'Die deutsche Kausativkonstruktion gibt den Zusammenhang der beiden Verben natürlich wieder: Der Pharao sandte Boten aus und bestellte die betreffenden Personen zu sich.'
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: Zauberpriester Ägyptens
  rationale: Der Ausdruck bezeichnet ägyptische Kult- und Geheimkunstkundige; „Zauberpriester“ macht sowohl ihre religiöse als auch ihre magische Funktion deutlich.
- source_word: כָּל חֲכָמֶיהָ
  choice: alle Weisen des Landes
  rationale: Das Suffix bezieht sich auf Ägypten. „Des Landes“ vermeidet im Deutschen den möglichen falschen Bezug eines Pronomens auf den Pharao.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Der Pharao erzählte ihnen seinen Traum
  rationale: Der masoretische Text hat ausdrücklich den Singular „seinen Traum“; dieser wird trotz des folgenden pluralischen Pronomens beibehalten.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: doch niemand konnte dem Pharao das Geträumte deuten
  rationale: „Deuten“ ist im Deutschen die natürliche Bezeichnung für die Auslegung eines Traums. „Das Geträumte“ lässt offen, ob der pluralische Rückverweis die Traumbilder, Einzelheiten oder beide Traumerlebnisse zusammenfasst.
