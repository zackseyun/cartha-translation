base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: de
  text: 'Da sprach der oberste Mundschenk zum Pharao: »Heute erinnere ich an meine Verfehlungen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Sünden«, »meine Vergehen« oder »meine Fehler«. Das hebräische Wort kann allgemein schuldhaftes Verhalten bezeichnen, sowohl in moralischer als auch in amtlicher Hinsicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter. »Da sagte« gibt den Fortgang im modernen Deutschen natürlich wieder; דבר leitet hier die Rede ein.
- source_word: שַׂר הַמַּשְׁקִים
  choice: der oberste Mundschenk
  rationale: Der Ausdruck bezeichnet den ranghöchsten Hofbeamten, der für die Getränke des Pharaos zuständig war. »Oberster Mundschenk« ist im Deutschen verständlich und wahrt den historischen Hofkontext.
- source_word: אֶת־פַּרְעֹה
  choice: zum Pharao
  rationale: Obwohl אֶת das direkte Objekt kennzeichnet, verlangt idiomatisches Deutsch bei »sagen« hier die Präposition »zu«.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Der Infinitiv leitet den Inhalt der direkten Rede ein. Ein Doppelpunkt ist im Deutschen natürlicher als das wörtliche und redundante »indem er sagte«.
- source_word: אֶת חֲטָאַי
  choice: meine Verfehlungen
  rationale: חטא kann Sünden, Vergehen oder Fehler bezeichnen. »Verfehlungen« bewahrt die moralische wie auch die amtlich-rechtliche Bedeutungsbreite, ohne den Kontext vorschnell zu verengen.
- source_word: אֲנִי מַזְכִּיר
  choice: ich erinnere mich an
  rationale: Der Hifil von זכר kann »in Erinnerung bringen«, »erwähnen« oder kontextuell »sich ins Gedächtnis rufen« bedeuten. Die reflexive deutsche Formulierung gibt hier den natürlichen Sinn wieder.
- source_word: הַיּוֹם
  choice: Heute
  rationale: »Heute« ist die direkte, idiomatische Wiedergabe und erhält die zeitliche Hervorhebung.
theological_decisions:
- issue: Bedeutungsumfang von חֲטָאַי
  choice: Verfehlungen
  alternative: Sünden; Fehler; Vergehen
  rationale: Der höfische Zusammenhang legt Vergehen gegen den Pharao nahe, doch das hebräische Wort kann auch moralische Schuld bezeichnen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historische Amtsbezeichnung »Mundschenk« bleibt erhalten; Satzbau und Redeeinleitung sind für heutige Leser natürlich gestaltet.
