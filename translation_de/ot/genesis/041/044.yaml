  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: „Ich bin der Pharao. Ohne dich[a] soll im ganzen Land Ägypten niemand auch nur eine Hand oder einen Fuß rühren[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unabhängig von dir“ beziehungsweise „ohne deine Zustimmung“. Gemeint ist, dass in Ägypten niemand ohne Josefs Vollmacht handeln darf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine Hand und seinen Fuß erheben“; eine Redewendung dafür, überhaupt etwas zu tun oder sich zu bewegen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativpräteritum mit waw consecutivum führt die Handlung weiter; „Da sagte“ gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels steht mit bestimmtem Artikel.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: Natürliche deutsche Wiedergabe des angesprochenen Adressaten; „Josef“ entspricht der etablierten deutschen Namensform.
- source_word: אֲנִי פַרְעֹה
  choice: Ich bin der Pharao
  rationale: Die nominale Selbstidentifikation wird unmittelbar wiedergegeben und bewahrt den Nachdruck der souveränen Erklärung, ohne ihn durch Zusätze zu überdeuten.
- source_word: וּבִלְעָדֶיךָ
  choice: Ohne dich
  rationale: Die Form bezeichnet Ausschluss beziehungsweise Handeln nicht unabhängig von Josef; „ohne dich“ bewahrt die knappe Ausdrucksweise und die mögliche Bedeutungsbreite.
- source_word: לֹא יָרִים אִישׁ
  choice: soll ... niemand ... rühren
  rationale: Im Kontext einer königlichen Verfügung gibt „soll niemand“ den normativen Sinn angemessen wieder. Das Verb ist Teil der folgenden Körperteil-Redewendung.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: auch nur eine Hand oder einen Fuß rühren
  rationale: Die idiomatische deutsche Formulierung vermittelt, dass niemand irgendeine Handlung oder Bewegung ohne Josefs Zustimmung unternehmen darf; „auch nur“ macht die umfassende Verneinung natürlich deutlich.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Nahe und zugleich idiomatische Wiedergabe der territorialen Wendung.
