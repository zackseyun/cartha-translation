  register: Modernes, würdevolles Standarddeutsch. Die konkrete hebräische Redewendung wird durch eine geläufige deutsche Körperteil-Redewendung wiedergegeben; die Fußnote hält den Wortlaut transparent. Die generische Aussage mit אִישׁ erscheint natürlich als „niemand“.
