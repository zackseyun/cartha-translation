  source_fidelity: Der Text gibt die hebräische Abfolge, die nachdrückliche Selbstidentifikation des Pharao und die umfassende Einschränkung des Handelns in ganz Ägypten zutreffend wieder. „Ohne dich“ bewahrt die Kürze und den möglichen Bezug auf Josefs Autorisierung; „niemand auch nur eine Hand oder einen Fuß rühren“ gibt die idiomatische Aussage angemessen wieder, auch wenn das Hebräische wörtlich „Hand und Fuß erheben“ lautet.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung „Da sagte“ ist im erzählenden Kontext natürlich; „auch nur eine Hand oder einen Fuß rühren“ ist eine geläufige deutsche Entsprechung für die hebräische Totalitätsformel.
  terminology: „Pharao“, „Josef“ und „Land Ägypten“ entsprechen dem üblichen deutschen biblischen Sprachgebrauch. Die Fußnoten erläutern die autorisierungsbezogene Nuance und die zugrunde liegende Körperteil-Redewendung sachgerecht, ohne eine konfessionelle Deutung aufzudrängen.
