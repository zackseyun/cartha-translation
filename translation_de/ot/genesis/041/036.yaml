  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: de
  text: Diese Nahrung soll dem Land als Vorrat[a] für die sieben Jahre der Hungersnot dienen, die im Land Ägypten kommen werden, damit das Land durch die Hungersnot nicht zugrunde geht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „als Rücklage“ oder „zur Aufbewahrung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht abgeschnitten wird“; gemeint ist hier, dass das Land durch die Hungersnot nicht vernichtet wird oder zugrunde geht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: Diese Nahrung soll … dienen
  rationale: Die futurisch-zweckhafte Aussage beschreibt das vorgesehene Ergebnis der angeordneten Sammlung. „Diese Nahrung“ verweist natürlich auf die im vorherigen Vers gesammelten Erträge, ohne das allgemeinere אֹכֶל auf „Getreide“ zu verengen.
- source_word: לְפִקָּדוֹן
  choice: als Vorrat
  rationale: Das Wort bezeichnet hier etwas, das für einen späteren Bedarf sicher verwahrt wird. „Vorrat“ ist im administrativen Zusammenhang natürlich und wahrt den Gedanken der Reserve.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: für die sieben Jahre der Hungersnot
  rationale: Die bestimmte Form verweist auf die sieben bereits angekündigten Hungerjahre. Die Wiedergabe bleibt nahe an der hebräischen Konstruktverbindung.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: die im Land Ägypten kommen werden
  rationale: Der Relativsatz bezieht sich grammatisch auf die zukünftigen Jahre. „Kommen werden“ gibt ihr bevorstehendes Eintreten in natürlichem Deutsch wieder, während „Land Ägypten“ die wiederholte Verwendung von אֶרֶץ bewahrt.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: damit das Land durch die Hungersnot nicht zugrunde geht
  rationale: Der finale Zusammenhang wird im Deutschen mit „damit“ klar ausgedrückt. „Zugrunde geht“ vermittelt den kontextuellen Sinn des Niphal von כרת, während eine Fußnote das wörtliche Bild „abgeschnitten werden“ erhält.
