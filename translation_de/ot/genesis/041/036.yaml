  source_fidelity: 'Die Übersetzung gibt die futurisch-zweckhafte Aussage angemessen wieder: Die gesammelte Nahrung soll als Vorrat für die sieben Hungerjahre dienen. „Diese Nahrung“ nimmt den zuvor genannten Ertrag auf, ohne אֹכֶל unzulässig auf Getreide einzuengen. „Zugrunde geht“ trifft den kontextuellen Sinn von וְלֹא תִכָּרֵת הָאָרֶץ; die Fußnote bewahrt zu Recht die wörtliche Bildsprache „abgeschnitten wird“.'
