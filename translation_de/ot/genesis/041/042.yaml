  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: de
  text: Da nahm der Pharao seinen Siegelring[a] von seiner Hand und steckte ihn Josef an die Hand. Dann kleidete er ihn in Gewänder aus feinem Leinen[b] und legte ihm eine goldene Kette[c] um den Hals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ring“. Das hebräische Wort kann allgemein einen Ring bezeichnen; in diesem königlichen Zusammenhang ist wahrscheinlich der Siegelring des Pharaos gemeint, ein Zeichen übertragener Vollmacht.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hochwertiges Leinen, das mit Reichtum und Ehre verbunden war.
    reason: cultural_note
  - marker: c
    text: 'Oder: „goldenen Halsschmuck“ beziehungsweise „goldenen Halsreif“. Die genaue Form des bezeichneten Schmuckstücks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: nahm … von der Hand
  rationale: Das Verb bezeichnet das Entfernen oder Abnehmen. Die Formulierung ist im Deutschen natürlich und gibt die zeremonielle Handlung klar wieder.
- source_word: טַבַּעְתּוֹ
  choice: seinen Siegelring
  rationale: Das Substantiv kann allgemein einen Ring bezeichnen; im königlichen Verwaltungskontext ist jedoch wahrscheinlich der Siegelring als Zeichen übertragener Vollmacht gemeint.
- source_word: מֵעַל יָדוֹ
  choice: von der Hand
  rationale: Dies bildet die räumliche Aussage des Hebräischen eng ab, ohne die schwerfällige wörtliche Formulierung „von über seiner Hand“ zu übernehmen.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: steckte ihn Josef an den Finger
  rationale: נתן bedeutet häufig „geben“, bezeichnet hier aber zusammen mit dem Ring und der Hand Josefs das Anstecken. Im Deutschen wird ein Ring idiomatisch an den Finger gesteckt; der Finger ist im hebräischen Ausdruck „Hand“ mitgemeint.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: kleidete er ihn
  rationale: „Kleidete“ bewahrt den förmlichen Charakter der Einsetzung besser als das alltäglichere „zog ihm … an“.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: Gewänder aus feinem Leinen
  rationale: שֵׁשׁ bezeichnet hochwertiges Leinen, das mit Reichtum und Ehre verbunden war. „Gewänder“ passt zum feierlichen Kontext.
- source_word: רְבִד הַזָּהָב
  choice: eine goldene Kette
  rationale: Das Wort bezeichnet einen goldenen Halsschmuck, dessen genaue Form unsicher ist. „Goldene Kette“ ist eine natürliche, im Kontext passende Wiedergabe.
- source_word: עַל צַוָּארוֹ
  choice: um den Hals
  rationale: Bei Halsschmuck ist „um den Hals“ die natürliche deutsche Entsprechung des wörtlichen „auf seinen Hals“.
