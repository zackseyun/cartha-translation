  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: de
  text: Da fraßen die Kühe, die hässlich aussahen und mager waren, die sieben Kühe, die schön aussahen und wohlgenährt waren.[a] Da wachte der Pharao auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die schlecht aussahen … die schön aussahen und gesund oder kräftig waren“; die hebräischen Wörter können wörtlicher mit „schlecht“ und mit „gesund, kräftig“ wiedergegeben werden. Der Gegensatz zu „mager“ legt hier „wohlgenährt“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Da fraßen
  rationale: Das feminine pluralische Wayyiqtol führt das nächste Ereignis der Traumfolge ein. „Fraßen“ gibt אכל schlicht und für Tiere idiomatisch wieder; „da“ markiert den Fortgang der Erzählung.
- source_word: הַפָּרוֹת
  choice: die Kühe
  rationale: פָּרוֹת ist der feminine Plural von „Kuh“ und bezeichnet die Tiere genauer als das allgemeinere „Rinder“.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: die hässlich aussahen
  rationale: Wörtlich steht „schlecht an Aussehen“. Im Zusammenhang bezeichnet die Wendung das unansehnliche Äußere; die verbale Formulierung klingt im modernen Deutschen natürlich.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: und mager waren
  rationale: Die hebräische Wendung bedeutet wörtlich „dünn an Fleisch“. „Mager“ bewahrt den körperlichen Gegensatz und ist idiomatischer als „dünn an Fleisch“.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: die sieben Kühe
  rationale: Der Akkusativmarker mit Zahlwort und Substantiv bezeichnet eindeutig das direkte Objekt.
- source_word: יְפֹת הַמַּרְאֶה
  choice: die schön aussahen
  rationale: Die Wiedergabe erhält den parallelen Gegensatz zu den hässlich aussehenden Kühen und formuliert ihn natürlich.
- source_word: וְהַבְּרִיאֹת
  choice: und wohlgenährt waren
  rationale: בְּרִיאֹת kann „fett, wohlgenährt, gesund“ bedeuten. Im Gegensatz zu den mageren Kühen bezeichnet es hier am ehesten den kräftigen Ernährungszustand; „wohlgenährt“ vermeidet zugleich eine unnötig abwertende Färbung.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: Da wachte der Pharao auf
  rationale: Die Form setzt die Erzählung fort und bedeutet, dass der Pharao aus dem Schlaf erwachte. „Da … auf“ ist klares, gegenwärtiges Erzählungsdeutsch.
