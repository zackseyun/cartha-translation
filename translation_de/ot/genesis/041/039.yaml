  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: „Weil Gott dir dies alles bekannt gemacht hat,[a] gibt es niemanden, der so verständig und weise ist wie du.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem Gott dir dies alles bekannt gemacht hat“. Das hebräische Wort bedeutet wörtlicher „nachdem“, bezeichnet hier aber zugleich die Grundlage für die Schlussfolgerung des Pharaos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Verbform führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: אַחֲרֵי
  choice: Weil
  rationale: Das Wort bedeutet formal „nachdem“, bezeichnet hier aber zugleich den Grund für die Schlussfolgerung des Pharaos. „Weil“ macht diesen Zusammenhang im Deutschen klar; die formnähere Alternative wird in der Fußnote bewahrt.
- source_word: הוֹדִיעַ
  choice: bekannt gemacht hat
  rationale: Der Hifil von ידע bedeutet „wissen lassen, bekannt machen“; die Formulierung bewahrt die verursachende Bedeutung und klingt im Deutschen natürlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Verbform und Kontext weisen hier auf einen singularischen Bezug; „Gott“ ist daher die sachgemäße Wiedergabe.
- source_word: אֶת כָּל זֹאת
  choice: dies alles
  rationale: Knappe, natürliche Wiedergabe der gesamten Angelegenheit, die Josef ausgelegt und erklärt hat.
- source_word: אֵין
  choice: gibt es niemanden
  rationale: Idiomhafte moderne Wiedergabe der hebräischen Existenzverneinung.
- source_word: נָבוֹן
  choice: verständig
  rationale: Bezeichnet Einsicht und Urteilsvermögen und passt zu Josefs erwiesener Fähigkeit, den Traum zu deuten und daraus Folgerungen zu ziehen.
- source_word: וְחָכָם
  choice: und weise
  rationale: 'Bewahrt die Verbindung zweier sich ergänzender Eigenschaften: Einsicht und Weisheit.'
- source_word: כָּמוֹךָ
  choice: wie du
  rationale: Natürliche deutsche Vergleichsform nach „niemanden, der so … ist“.
theological_decisions:
- issue: Bezug von אֱלֹהִים in der Rede des Pharaos
  choice: Gott
  alternative: die Götter
  rationale: Obwohl אֱלֹהִים je nach Kontext auch pluralisch gebraucht werden kann, bezieht sich die Aussage hier auf die Gottheit, die Josef die Deutung erkennen ließ. Der singularische Gebrauch entspricht Syntax und unmittelbarem Zusammenhang, ohne darüber hinaus die Gottesvorstellung des Pharaos näher zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. „Verständig und weise“ erhält die beiden hebräischen Begriffe als unterscheidbare, aber eng verbundene Eigenschaften.
