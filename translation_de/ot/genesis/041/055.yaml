  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: de
  text: 'Als das ganze Land Ägypten Hunger litt, schrie das Volk zum Pharao um Brot. Da sagte der Pharao zu allen Ägyptern: »Geht zu Josef. Was er euch sagt, das tut.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: Hunger litt
  rationale: Das Verb רעב bezeichnet hier das Erleben von Hunger; »Hunger litt« gibt den einsetzenden Notstand natürlich wieder, ohne ausdrücklich das Substantiv »Hungersnot« in den Text einzutragen.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: das ganze Land Ägypten
  rationale: Bewahrt das ausdrücklich genannte אֶרֶץ und klingt im modernen Deutschen natürlich.
- source_word: וַיִּצְעַק הָעָם
  choice: schrie das Volk
  rationale: צעק bezeichnet einen dringlichen Hilferuf aus Bedrängnis; »schrie« wahrt dessen Stärke.
- source_word: לַלָּחֶם
  choice: um Brot
  rationale: לֶחֶם bedeutet wörtlich »Brot« und kann zugleich Nahrung insgesamt bezeichnen; die konkrete Wiedergabe bleibt textnah und verständlich.
- source_word: לְכָל מִצְרַיִם
  choice: zu allen Ägyptern
  rationale: Der Ortsname steht kollektiv für die Bevölkerung; im Deutschen bezeichnet »zu allen Ägyptern« die angeredeten Menschen klarer als das unnatürliche »zu ganz Ägypten«.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Geht zu Josef
  rationale: Direkte und natürliche Wiedergabe des Imperativs; »Josef« ist die etablierte deutsche Namensform.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: Was er euch sagt, das tut
  rationale: Die vorangestellte Objektkonstruktion und ihre Betonung bleiben erhalten, während der Satz im Deutschen klar und würdig klingt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge und der Nachdruck des abschließenden Befehls werden gewahrt, ohne eine im Deutschen unnötig sperrige Formulierung zu wählen.
