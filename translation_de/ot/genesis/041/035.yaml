  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: de
  text: Sie sollen alle Nahrungsmittel dieser kommenden guten Jahre sammeln, das Getreide unter der Verfügungsgewalt des Pharaos[a] als Nahrung in den Städten einlagern und es bewahren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter der Hand des Pharaos“; gemeint ist unter seiner Verfügungsgewalt oder Kontrolle.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hüten“ oder „sichern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Sie sollen … sammeln
  rationale: Der imperfektische Verbgebrauch hat im Zusammenhang von Josefs Vorschlag auffordernden Charakter. „Sie sollen“ gibt dies im Deutschen natürlich wieder.
- source_word: כָּל אֹכֶל
  choice: alle Lebensmittel
  rationale: אֹכֶל bezeichnet hier umfassend die Nahrungsmittel beziehungsweise Erzeugnisse der ertragreichen Jahre.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: dieser kommenden guten Jahre
  rationale: Die Formulierung bewahrt sowohl den demonstrativen Bezug von הָאֵלֶּה als auch den Hinweis auf die bevorstehenden Jahre.
- source_word: וְיִצְבְּרוּ
  choice: lagern
  rationale: Das Verb bezeichnet das Anhäufen oder Einlagern größerer Mengen; „lagern“ passt zum administrativen Vorratskontext.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר bezeichnet hier gedroschenes beziehungsweise zur Lagerung bestimmtes Getreide, ohne die Getreideart näher einzugrenzen.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: unter der Aufsicht des Pharaos
  rationale: Die Wendung lautet wörtlich „unter der Hand des Pharaos“ und bezeichnet seine Verfügungsgewalt oder behördliche Aufsicht.
- source_word: אֹכֶל בֶּעָרִים
  choice: als Vorrat in den Städten
  rationale: Das zweite אֹכֶל beschreibt funktional die eingelagerten Nahrungsmittel. „Als Vorrat“ vermeidet im Deutschen eine schwerfällige Wiederholung und verdeutlicht den Zweck.
- source_word: וְשָׁמָרוּ
  choice: und bewahren
  rationale: שׁמר kann „bewahren“, „hüten“ oder „sichern“ bedeuten. Im Zusammenhang geht es darum, das eingelagerte Getreide für den späteren Bedarf zu erhalten.
