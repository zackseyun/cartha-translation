  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: de
  text: 'Und die dünnen Ähren[a] verschlangen die sieben kräftigen[b] und vollen Ähren. Da erwachte der Pharao, und siehe: Es war ein Traum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Kornähren“. Das hebräische Wort bezeichnet den körnertragenden Teil des Getreides, nicht den ganzen Halm.
    reason: lexical_alternative
  - marker: b
    text: Oder „gesunden“ beziehungsweise „wohlgenährten“. Das hebräische Adjektiv bezeichnet einen gesunden, gut genährten oder kräftigen Zustand.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: verschlangen
  rationale: Das Verb בלע bedeutet wörtlich „verschlingen“ bzw. „hinunterschlucken“. „Verschlangen“ bewahrt das eindringliche, unnatürliche Traumbild, ohne den zusätzlichen Beiklang eines räuberischen Fressens einzutragen.
- source_word: הַשִּׁבֳּלִים
  choice: Ähren
  rationale: שִׁבֹּלֶת bezeichnet hier den körnertragenden oberen Teil des Getreides, nicht den ganzen Halm. „Ähren“ ist im Deutschen präzise und geläufig.
- source_word: הַדַּקּוֹת
  choice: dünnen
  rationale: Das Adjektiv bezeichnet etwas Dünnes oder Feines. „Dünn“ gibt die Beschaffenheit der Ähren unmittelbar wieder.
- source_word: שֶׁבַע
  choice: sieben
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַבְּרִיאוֹת
  choice: kräftigen
  rationale: Das Adjektiv kann „gesund“, „wohlgenährt“ oder „kräftig“ bedeuten. Bei Ähren ist „kräftig“ natürlich und lässt die Vorstellung eines guten, robusten Zustands erkennen.
- source_word: וְהַמְּלֵאוֹת
  choice: und vollen
  rationale: מלא bedeutet „voll“. Im Zusammenhang sind mit Körnern gefüllte Ähren gemeint; die knappe Wiedergabe „voll“ bleibt nahe am Hebräischen.
- source_word: וַיִּיקַץ
  choice: erwachte
  rationale: Eine natürliche, würdevolle Wiedergabe des Erzählverbs für das Aufwachen aus dem Schlaf.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf eine plötzliche Wahrnehmung oder Erkenntnis. „Und siehe“ bewahrt diese literarische Signalwirkung.
- source_word: חֲלוֹם
  choice: Es war ein Traum
  rationale: 'Der hebräische Nominalsatz lautet knapp „und siehe: ein Traum“. Im Deutschen wird die Kopula ergänzt; die abrupte Erkenntnis bleibt durch die Satzgestaltung erhalten.'
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit leicht gehobenem Erzählton. „Und siehe“ erhält bewusst die markante Aufmerksamkeitspartikel des Hebräischen; der Doppelpunkt bildet die knappe Erkenntnis des hebräischen Nominalsatzes nach.
