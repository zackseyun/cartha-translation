  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: de
  text: Da begannen die sieben Hungerjahre, wie Josef gesagt hatte. In allen Ländern herrschte Hunger, doch im ganzen Land Ägypten gab es Brot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gab es Nahrung“. Das hebräische Wort für „Brot“ kann auch allgemein Nahrung oder Lebensmittel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה שֶׁבַע שְׁנֵי הָרָעָב לָבוֹא
  choice: Da begannen die sieben Hungerjahre
  rationale: Die Verbindung aus dem inchoativen Verb und לָבוֹא bezeichnet das Eintreten der angekündigten Jahre. Natürliches Deutsch braucht hier kein wörtliches „begannen zu kommen“; „begannen“ bewahrt den zeitlichen Einsatz klar.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: wie Josef gesagt hatte
  rationale: כַּאֲשֶׁר bezeichnet die Übereinstimmung mit Josefs früherer Ankündigung; das Plusquamperfekt macht die zeitliche Abfolge im Deutschen deutlich.
- source_word: וַיְהִי רָעָב
  choice: herrschte Hunger
  rationale: Die existentielle Wendung wird idiomatisch wiedergegeben. „Hunger herrschte“ ist in diesem Zusammenhang natürlich und bewahrt die sachliche Aussage.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: in allen Ländern
  rationale: Der Plural אֲרָצוֹת bezeichnet hier die umliegenden Länder oder Gebiete. „Länder“ ist verständlich und im Deutschen weniger auffällig als „Lande“.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: doch im ganzen Land Ägypten
  rationale: 'Das ו ist formal koordinierend, trägt im Kontext jedoch einen klaren Gegensatz: allgemeiner Hunger gegenüber vorhandener Nahrung in Ägypten. „doch“ bildet diesen Kontrast natürlich ab.'
- source_word: הָיָה לָחֶם
  choice: gab es Brot
  rationale: לֶחֶם bedeutet konkret „Brot“, kann aber weiter gefasst Nahrung oder Vorräte bezeichnen. Der Haupttext bewahrt das konkrete Bild; die Bedeutungsweite wird in der Fußnote genannt.
