source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: de
  text: Dass der Traum dem Pharao zweimal wiederholt wurde, liegt daran, dass die Sache von Gott fest beschlossen ist[a] und Gott sich beeilt, sie auszuführen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass die Sache von Gott her feststeht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und Gott wird sie bald ausführen« oder »Gott steht kurz davor, sie auszuführen«.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Dass … liegt daran
  rationale: Gibt die einleitende Bezugnahme und den anschließenden Begründungszusammenhang in natürlichem Deutsch wieder.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: der Traum … wiederholt wurde
  rationale: Bewahrt den passiven Sinn des Infinitivs und bezeichnet klar die Wiederholung des Traums.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: dem Pharao zweimal
  rationale: Der Dativ ist im Deutschen bei »wiederholen« idiomatisch; »zweimal« gibt die Dualform prägnant wieder.
- source_word: כִּי
  choice: liegt daran, dass
  rationale: Macht die kausale Erklärung der Wiederholung deutlich, ohne zusätzlichen Inhalt einzutragen.
- source_word: נָכוֹן הַדָּבָר
  choice: die Sache … feststeht
  rationale: Gibt die Festigkeit und Gewissheit des angekündigten Geschehens wieder; »Sache« lässt die Bedeutungsbreite von דָּבָר bestehen.
- source_word: מֵעִם הָאֱלֹהִים
  choice: bei Gott
  rationale: Bewahrt die relationale Formulierung und vermeidet, die mögliche Nuance »von Gott her festgesetzt« stillschweigend auf nur eine Deutung zu verengen.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: und Gott sich beeilt
  rationale: Die partizipiale Form wird als gegenwärtig bevorstehendes, beschleunigtes Handeln wiedergegeben.
- source_word: לַעֲשֹׂתוֹ
  choice: sie auszuführen
  rationale: Das Pronomen bezieht sich im Deutschen auf »die Sache«; »ausführen« bezeichnet passend das Verwirklichen des angekündigten Geschehens.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים in Josefs Erklärung
  choice: Gott
  alternative: die Götter
  rationale: Syntax und Zusammenhang beziehen die Bezeichnung eindeutig auf den einen Gott, der Pharao das Kommende offenbart.
- issue: Art der göttlichen Festlegung
  choice: bei Gott feststeht
  alternative: von Gott fest beschlossen ist
  rationale: Die Hauptfassung bewahrt die Spannung der Präposition מֵעִם zwischen göttlicher Herkunft, Festsetzung und der Gewissheit bei Gott; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng am hebräischen Begründungszusammenhang, verwendet jedoch eine im Deutschen natürliche Konstruktion. Die Fußnoten bewahren die Bedeutungsbreite von מֵעִם und die aspektuelle Spannung des Partizips מְמַהֵר.
