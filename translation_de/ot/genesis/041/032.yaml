  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Die zweimalige Wiederholung wird begründet, דָּבָר wird sinnvoll mit „Sache“ wiedergegeben, und das feminine Pronomen bezieht sich klar darauf. „bei Gott feststeht“ gibt מֵעִם jedoch nicht idiomatisch und nur unzureichend als göttliche Festlegung bzw. Bestätigung wieder.'
