base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: de
  text: 'Und ich sah in meinem Traum: Siehe, sieben volle und gute Ähren[a] wuchsen an einem einzigen Halm empor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sieben Fruchtstände von Getreide. Das hebräische Wort kann die Ähre beziehungsweise den Fruchtstand des Getreides bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Und ich sah
  rationale: Das Qal-Wayyiqtol von ראה führt die Erzählung des Pharaos fort; „Und ich sah“ bewahrt sowohl die Ich-Perspektive als auch den erzählerischen Anschluss.
- source_word: בַּחֲלֹמִי
  choice: in meinem Traum
  rationale: Die Präposition mit dem Substantiv und dem Suffix der 1. Person Singular bedeutet natürlich „in meinem Traum“.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: הִנֵּה stellt das Traumbild anschaulich und unmittelbar vor Augen. „Siehe“ wahrt diesen hervorgehobenen Präsentationscharakter in würdigem Deutsch.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sieben Ähren
  rationale: שִׁבֹּלֶת bezeichnet hier den ährenförmigen Fruchtstand des Getreides. „Ähren“ ist im Deutschen die präzise und natürliche Entsprechung.
- source_word: עֹלֹת
  choice: wuchsen … empor
  rationale: Das feminine Partizip Plural von עלה zeichnet den Vorgang im Traum als im Gang befindlich. „Wuchsen … empor“ gibt das Bild im Getreidekontext natürlicher wieder als das allgemeinere „stiegen auf“.
- source_word: בְּקָנֶה אֶחָד
  choice: an einem einzigen Halm
  rationale: קָנֶה bezeichnet hier den Stängel beziehungsweise Halm. „An einem einzigen Halm“ gibt die ungewöhnliche Traumerscheinung klar wieder und betont אֶחָד.
- source_word: מְלֵאֹת וְטֹבוֹת
  choice: voll und gut
  rationale: Die beiden Adjektive werden bewusst schlicht und quellennah wiedergegeben. „Voll“ beschreibt den reichen Kornansatz; „gut“ bewahrt die breite Bedeutung von טוֹב, ohne sie auf „gesund“ oder „prächtig“ einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelanschluss „und … und siehe“ wurde durch einen Doppelpunkt geglättet, ohne die lebhafte Präsentationsfunktion von וְהִנֵּה aufzugeben. Die Adjektivstellung „voll und gut“ bewahrt die knappe Wertung des Hebräischen.
