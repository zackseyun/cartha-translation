  source_fidelity: 'Die Grundstruktur ist richtig: Josef weist die Deutung nicht sich selbst zu und schreibt die Antwort Gott zu. „Das liegt nicht bei mir“ verschiebt בִּלְעָדָי jedoch in Richtung Zuständigkeit; die knappe, emphatische Selbstverneinung des Hebräischen sollte unmittelbarer wiedergegeben werden. Die Wiedergabe von שְׁלוֹם mit „Wohl“ bewahrt sinnvoll die Bedeutung von Wohlergehen bzw. günstigem Ausgang, ohne sie auf bloßes inneres Friedenempfinden zu reduzieren.'
