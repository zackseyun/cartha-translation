  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: de
  text: 'Josef antwortete dem Pharao: „Nicht ich; Gott wird dem Pharao eine Antwort zu seinem Wohl geben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die übliche erzählerische Bedeutung von ענה bei der Einleitung einer Erwiderung.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֶת־פַּרְעֹה
  choice: dem Pharao
  rationale: Das Verb „antworten“ verlangt im natürlichen Deutschen den Dativ.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Die hebräische Redeeinleitungsformel wird im Deutschen durch Doppelpunkt und direkte Rede natürlich ausgedrückt.
- source_word: בִּלְעָדָי
  choice: Das liegt nicht bei mir
  rationale: Bewahrt Josefs Zurückweisung eigener Zuständigkeit oder Fähigkeit, ohne die knappe Wendung auf ein bloßes „Nicht ich“ zu verengen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier mit dem singularischen Verb Gott im Singular.
- source_word: יַעֲנֶה
  choice: wird … eine Antwort … geben
  rationale: Die deutsche Umschreibung gibt die Verbindung des Verbs „antworten“ mit dem ungewöhnlichen direkten Objekt שְׁלוֹם verständlich wieder.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: dem Pharao eine Antwort zu seinem Wohlergehen
  rationale: שָׁלוֹם bezeichnet hier Wohlergehen, Heil oder einen günstigen Ausgang. Die Formulierung lässt offen, ob die Antwort das Wohlergehen betrifft oder günstig ausfällt.
theological_decisions:
- issue: Ursprung der Traumdeutung
  choice: Josef weist die Fähigkeit beziehungsweise Zuständigkeit von sich und schreibt die entscheidende Antwort Gott zu.
  alternative: „Nicht ich; Gott wird dem Pharao eine Heilsantwort geben.“
  rationale: Der Gegensatz zwischen בִּלְעָדָי und אֱלֹהִים bleibt ausdrücklich erhalten, ohne eine weitergehende Lehrdeutung einzutragen.
- issue: Bedeutung von שְׁלוֹם
  choice: „Wohlergehen“ wird als Ziel oder Gegenstand der göttlichen Antwort formuliert.
  alternative: „eine günstige Antwort“ oder „eine Antwort zum Frieden“
  rationale: Der hebräische Ausdruck ist idiomatisch und kann Wohlergehen, Heil oder einen günstigen Ausgang bezeichnen; die Übersetzung soll diese Spannung nicht vorschnell auf eine sichere günstige Vorhersage festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp gehalten; „Pharao“ wird entsprechend dem hebräischen Gebrauch ohne Artikel angeredet beziehungsweise genannt.
