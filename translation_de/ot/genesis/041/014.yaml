base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: de
  text: Da schickte der Pharao nach Josef und ließ ihn rufen. Man holte ihn eilig aus der Grube.[a] Er rasierte sich, wechselte seine Kleidung und kam zum Pharao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Kerker“. Das hebräische Wort bedeutet wörtlich „Grube“ und kann hier ein grubenartiges Gefängnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת־יוֹסֵף
  choice: schickte ... nach Josef und ließ ihn rufen
  rationale: Die Wiedergabe bildet beide hebräischen Verben ab und klingt zugleich im modernen Deutschen als zusammengehörige Aufforderung zur Vorführung Josefs natürlich.
- source_word: וַיְרִיצֻהוּ
  choice: Man holte ihn eilig
  rationale: Die kausative Verbform bezeichnet, dass nicht näher genannte Personen Josef schnell herausbringen. Das unpersönliche „man“ bewahrt den im Hebräischen impliziten Subjektwechsel und die Eile.
- source_word: מִן־הַבּוֹר
  choice: aus der Grube
  rationale: בּוֹר bedeutet wörtlich „Grube“ und kann eine Zisterne oder ein grubenartiges Gefängnis bezeichnen. „Grube“ wahrt den Bezug zu den früheren Ereignissen in Josefs Geschichte.
- source_word: וַיְגַלַּח
  choice: Er rasierte sich
  rationale: Die aktive, knappe Form wird im Deutschen idiomatisch reflexiv wiedergegeben, ohne zusätzliche Einzelheiten über die Rasur einzutragen.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: wechselte seine Kleider
  rationale: Die Formulierung gibt den Kleidungswechsel klar, würdig und nah am hebräischen Wortlaut wieder.
- source_word: וַיָּבֹא אֶל־פַּרְעֹה
  choice: kam zum Pharao
  rationale: Die einfache Bewegungsangabe entspricht בוא אל, ohne eine besondere Hofzeremonie oder ein Betreten des Audienzsaals vorauszusetzen.
