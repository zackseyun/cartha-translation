  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Lexeme des Hebräischen treffend wieder: Die mageren und schlecht anzusehenden Kühe sind Subjekt, die zuerst erschienenen sieben kräftigen/wohlgenährten Kühe Objekt. „Fraßen … auf“ ist im Traumkontext eine natürliche und mit der englischen Audit-Trail-Entscheidung übereinstimmende Wiedergabe von וַתֹּאכַלְנָה.'
  naturalness: „Und die mageren, hässlichen Kühe fraßen die ersten sieben wohlgenährten Kühe auf.“ ist flüssiges modernes Standarddeutsch. Die Stellung von „auf“ am Satzende ist idiomatisch. „Hässlich“ ist hier als äußerliche Erscheinungsbeschreibung verständlich; die Fußnote bietet die weniger wertende, näher am Kontext liegende Alternative „schlecht aussehend“.
  terminology: „Kühe“ wahrt das feminine Genus von פָּרוֹת. „Mager“ und „wohlgenährt“ stellen den körperlichen Kontrast klar dar, ohne die Bedeutung von בְּרִיאוֹת unnötig auf „fett“ zu verengen. Die Fußnote dokumentiert die vertretbaren engeren Alternativen „dürr“, „schlecht aussehend“ und „fett“.
