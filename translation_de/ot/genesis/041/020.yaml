  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: de
  text: Und die mageren, hässlichen Kühe fraßen die ersten sieben wohlgenährten Kühe auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dürren, schlecht aussehenden Kühe … die ersten sieben fetten Kühe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: fraßen ... auf
  rationale: Die Form von אכל bezeichnet das Fressen; bei Tieren ist „auffressen“ natürlich und vermittelt hier die vollständige Aufnahme der anderen Kühe, ohne die stärkere Bildhaftigkeit von „verschlingen“ einzutragen.
- source_word: הַפָּרוֹת
  choice: Kühe
  rationale: Der feminine Plural bezeichnet weibliche Rinder; „Kühe“ ist daher genauer als das allgemeinere „Rinder“.
- source_word: הָרַקּוֹת
  choice: mageren
  rationale: Das Adjektiv beschreibt die dürre, abgemagerte Gestalt der Kühe. „Mager“ ist im modernen Deutschen klar und passt zum Gegensatz der wohlgenährten Kühe.
- source_word: וְהָרָעוֹת
  choice: hässlichen
  rationale: רעות bezeichnet hier im Traum das schlechte Aussehen, nicht moralische Bosheit. „Hässlich“ gibt diesen visuellen Sinn knapp und idiomatisch wieder.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: die sieben ... Kühe
  rationale: Der direkte Objektmarker mit Zahlwort und Substantiv wird geradlinig als bestimmtes Objekt wiedergegeben.
- source_word: הָרִאשֹׁנוֹת
  choice: die ersten
  rationale: Das Wort kennzeichnet diese Kühe als die zuerst erschienene Gruppe im Ablauf des Traums.
- source_word: הַבְּרִיאֹת
  choice: wohlgenährten
  rationale: Das Adjektiv bezeichnet einen kräftigen, gesunden beziehungsweise gut genährten Zustand. „Wohlgenährt“ bewahrt den körperlichen Bildgehalt besser als das allgemeinere „gesund“, ohne ausschließlich „fett“ festzulegen.
theological_decisions: []
