  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: de
  text: Josef gab seinem Erstgeborenen den Namen Manasse[a], denn Gott hat mich all meine Mühsal[b] und mein ganzes Vaterhaus[c] vergessen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manasse klingt im Hebräischen an das Wort für „vergessen lassen“ an.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all meine Plage“ beziehungsweise „all meine Mühe“.'
    reason: lexical_alternative
  - marker: c
    text: „Vaterhaus“ bezeichnet im Hebräischen die väterliche Familie oder Hausgemeinschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: gab ... den Namen
  rationale: Die hebräische Namensgebungsformel wird in natürlichem modernem Deutsch wiedergegeben; „nannte“ wäre ebenfalls möglich, doch „gab ... den Namen“ bewahrt das ausdrücklich genannte שֵׁם.
- source_word: הַבְּכוֹר
  choice: seinem Erstgeborenen
  rationale: „Erstgeborener“ hält die im Hebräischen ausdrücklich genannte und erzählerisch bedeutsame Stellung fest; das Possessivpronomen ergibt sich im Deutschen aus dem Kontext.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Verwendet die im Deutschen etablierte biblische Namensform; der Anklang an נַשַּׁנִי wird durch eine Fußnote erläutert.
- source_word: כִּי
  choice: denn er sagte
  rationale: כִּי leitet die Begründung der Namensgebung ein. „Er sagte“ macht die im Hebräischen implizite Erklärung im Deutschen idiomatisch deutlich.
- source_word: נַשַּׁנִי
  choice: hat mich ... vergessen lassen
  rationale: Die kausative Bedeutung „veranlasste mich zu vergessen“ wird präzise und natürlich ausgedrückt und bewahrt zugleich den Bezug zum Namen Manasse.
- source_word: כָּל עֲמָלִי
  choice: all meine Mühsal
  rationale: עָמָל umfasst Mühe, Plage und leidvolle Bedrängnis. „Mühsal“ hält diese Bedeutungsbreite in würdigem, verständlichem Deutsch offen.
- source_word: כָּל בֵּית אָבִי
  choice: mein ganzes Vaterhaus
  rationale: „Vaterhaus“ bewahrt den hebräischen Verwandtschafts- und Haushaltsausdruck und lässt die Aussage bewusst in ihrer Spannung stehen.
theological_decisions:
- issue: Josefs Aussage, Gott habe ihn sein ganzes Vaterhaus vergessen lassen
  choice: Die Aussage wird ohne Abschwächung als Josefs eigene Begründung der Namensgebung wiedergegeben.
  alternative: Sinngemäß auf das Vergessen des Schmerzes über seine Familie oder auf ein bloßes Verblassen der Erinnerung einschränken.
  rationale: Der hebräische Text nennt ausdrücklich sowohl Josefs Mühsal als auch sein ganzes Vaterhaus. Eine psychologische oder harmonisierende Deutung würde die echte Spannung des Textes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensgebungsformel ist idiomatisch formuliert, während „Mühsal“ und „Vaterhaus“ die Bedeutungsbreite und kulturelle Eigenart des hebräischen Textes bewahren.
