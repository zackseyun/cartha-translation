translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beratende Aufforderung wird mit »soll« wiedergegeben. Die im Hebräischen knappe Aussage wird durch »Erträge« kontextuell verdeutlicht; die echte lexikalische Mehrdeutigkeit von וְחִמֵּשׁ bleibt in der Fußnote sichtbar.
