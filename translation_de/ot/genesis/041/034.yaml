  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: de
  text: 'Der Pharao soll Folgendes tun: Er soll Aufseher über das Land einsetzen und während der sieben Jahre des Überflusses ein Fünftel der Erträge des Landes Ägypten einziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land Ägypten während der sieben Jahre des Überflusses in Fünftel einteilen«. Das seltene hebräische Verb kann hier als Einziehen eines Fünftels verstanden werden; auch eine organisatorische Einteilung in Fünftel ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Der Pharao soll Folgendes tun
  rationale: Das breite Verb עשה bedeutet »tun/machen«. Im Zusammenhang erteilt Josef einen Rat; die deutsche Soll-Form gibt den auffordernden Sinn natürlich wieder. »Folgendes« verweist auf die unmittelbar anschließende Maßnahme.
- source_word: וְיַפְקֵד
  choice: Er soll … einsetzen
  rationale: Der Hifil von פקד bezeichnet hier die Einsetzung von Personen in ein verantwortliches Amt. »Einsetzen« passt zum administrativen Zusammenhang.
- source_word: פְּקִדִים
  choice: Aufseher
  rationale: Das Substantiv bezeichnet beauftragte Amtsträger. »Aufseher« vermittelt ihre überwachende Verwaltungsaufgabe klar und ohne militärischen Beiklang.
- source_word: עַל הָאָרֶץ
  choice: über das Land
  rationale: ארץ bezeichnet hier das ägyptische Herrschaftsgebiet; עַל drückt die Zuständigkeit der eingesetzten Aufseher aus.
- source_word: וְחִמֵּשׁ
  choice: ein Fünftel … einziehen
  rationale: Der Piel von חמשׁ wird in diesem Zusammenhang am wahrscheinlichsten als Erhebung beziehungsweise Einziehung eines Fünftels verstanden. Die seltene Form lässt jedoch eine gewisse lexikalische Unsicherheit zu, die in der Fußnote kenntlich gemacht wird.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: der Erträge des Landes Ägypten
  rationale: Wörtlich ist »das Land Ägypten« das direkte Objekt des Verbs. Da im Zusammenhang Vorräte aus den reichen Ernten gesammelt werden, macht »Erträge« den sachlich vorausgesetzten Bezug verständlich, ohne zu behaupten, ein Teil des Territoriums werde genommen.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: während der sieben Jahre des Überflusses
  rationale: שׂבע bezeichnet Fülle oder Sättigung und meint in der Erzählung die Jahre reicher Ernten. »Überfluss« ist hier eine natürliche und kontextgerechte Wiedergabe.
