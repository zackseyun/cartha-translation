base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: de
  text: Die Hungersnot lag über der ganzen Erde. Josef öffnete alle Vorratsspeicher[a] und verkaufte den Ägyptern Getreide. Die Hungersnot im Land Ägypten wurde immer härter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alles, was in ihnen war«. Der hebräische Text lässt offen, worauf sich »ihnen« bezieht; aus dem Zusammenhang sind Speicher oder Lagerstätten zu erschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: die Hungersnot
  rationale: רָעָב bezeichnet hier die weitreichende Versorgungskrise, nicht nur persönlichen Hunger.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: breitete sich über das ganze Land aus
  rationale: Die hebräische Wendung bedeutet wörtlich »war über der ganzen Oberfläche des Landes/der Erde«. Im Kontext bezeichnet אֶרֶץ zunächst das betroffene Land beziehungsweise Gebiet; die natürliche deutsche Formulierung gibt die flächendeckende Ausdehnung wieder, ohne vorschnell die gesamte Erde festzulegen.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: öffnete ... alle Vorratsspeicher
  rationale: Der hebräische Text ist elliptisch und lautet formal »öffnete alles, worin/in ihnen [etwas war]«. Gemeint sind aus dem Zusammenhang die Lagerstätten; »Vorratsspeicher« macht den im Hebräischen vorausgesetzten Gegenstand verständlich.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: verkaufte den Ägyptern Getreide
  rationale: שׁבר bedeutet in diesem Versorgungskontext idiomatisch »Getreide verkaufen«. לְמִצְרַיִם kann kollektiv auf die Bevölkerung Ägyptens bezogen werden.
- source_word: וַיֶּחֱזַק
  choice: wurde immer härter
  rationale: חזק bedeutet wörtlich »stark werden«; von einer Hungersnot gesagt bezeichnet es ihre zunehmende Schwere.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe erhält die volle hebräische Gebietsbezeichnung und den erzählerischen Stil.
