revisions:
- from: Die Hungersnot breitete sich über das ganze Land aus. Da öffnete Josef alle Vorratsspeicher[a] und verkaufte den Ägyptern Getreide. Doch die Hungersnot im Land Ägypten wurde immer härter.
  to: Die Hungersnot lag über der ganzen Erde. Josef öffnete alle Vorratsspeicher[a] und verkaufte den Ägyptern Getreide. Die Hungersnot im Land Ägypten wurde immer härter.
  rationale: Die Revision vermeidet die mögliche Beschränkung der ersten Aussage auf Ägypten und entfernt einen nicht ausdrücklich markierten Gegensatz. Die verständliche Auflösung der hebräischen Ellipse im Haupttext bleibt erhalten; die Fußnote dokumentiert deren offenen Wortlaut.
