  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: de
  text: 'Nach Ablauf von zwei vollen Jahren träumte der Pharao: Siehe, er stand am Nil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Fluss«; im ägyptischen Zusammenhang ist damit der Nil gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Nach Ablauf von
  rationale: Die narrative Einleitung mit וַיְהִי wird zusammen mit der Zeitangabe natürlich wiedergegeben; מִקֵּץ bezeichnet das Ende des genannten Zeitraums.
- source_word: שְׁנָתַיִם יָמִים
  choice: zwei vollen Jahren
  rationale: Die wörtliche Wendung »zwei Jahre von Tagen« unterstreicht einen vollständig verstrichenen Zweijahreszeitraum.
- source_word: פַרְעֹה
  choice: der Pharao
  rationale: Der ägyptische Herrschertitel wird nach üblichem deutschem Sprachgebrauch mit bestimmtem Artikel wiedergegeben.
- source_word: חֹלֵם
  choice: träumte
  rationale: Das Partizip schildert den Traumvorgang; im deutschen Erzählstil gibt das Präteritum die Handlung natürlicher wieder als »war am Träumen«.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Der aufmerksamkeitslenkende Ausdruck markiert den anschaulichen Übergang zum Traumbild und behält bewusst einen würdevoll-literarischen Ton.
- source_word: עֹמֵד
  choice: er stand
  rationale: Das Partizip zeichnet den im Traum vor Augen stehenden Zustand; »stand« ist im Deutschen idiomatisch und anschaulich.
- source_word: עַל הַיְאֹר
  choice: am Nil
  rationale: עַל bezeichnet hier die Lage am beziehungsweise beim Fluss. יְאֹר bezieht sich im ägyptischen Kontext auf den Nil.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Siehe« bewahrt die markierte Anschaulichkeit des hebräischen הִנֵּה; der Doppelpunkt stellt klar heraus, dass das Folgende den Trauminhalt schildert.
