base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: de
  text: Der Vorschlag fand die Zustimmung des Pharaos und aller seiner Diener[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Sache war gut in den Augen des Pharaos und in den Augen aller seiner Diener.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: fand die Zustimmung
  rationale: Die Verbindung mit בְּעֵינֵי bezeichnet hier, dass etwas nach dem Urteil der Genannten gut, passend oder annehmbar war. „Fand die Zustimmung“ gibt diese Bewertung in natürlichem Deutsch wieder, ohne das Subjekt zu wechseln.
- source_word: הַדָּבָר
  choice: der Vorschlag
  rationale: דָּבָר ist grundsätzlich „Sache“, „Wort“ oder „Angelegenheit“; im unmittelbaren Zusammenhang bezeichnet es Josephs soeben vorgetragenen Rat. „Vorschlag“ macht diesen Bezug im Deutschen klar.
- source_word: פַרְעֹה
  choice: Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: כָּל עֲבָדָיו
  choice: alle seine Diener
  rationale: עֲבָדִים kann Diener, Untergebene, Sklaven oder Hofbeamte bezeichnen. Am königlichen Hof ist „Diener“ eine breite Wiedergabe, die den möglichen Amtscharakter nicht unnötig verengt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wendung „gut sein in den Augen von“ wird im Haupttext idiomatisch wiedergegeben; die Fußnote bewahrt die Bildsprache und die breitere Bedeutung von דָּבָר.
