  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: de
  text: Und die dünnen Ähren verschlangen die sieben guten Ähren.[a] Da erzählte ich es den Traumdeutern,[b] aber niemand konnte es mir erklären.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Getreideähren“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet im ägyptischen Kontext Ritualspezialisten, die unter anderem Träume deuteten.
    reason: cultural_note
  - marker: c
    text: 'Oder: „aber niemand konnte ihn mir deuten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: verschlangen
  rationale: Das Verb בלע bezeichnet ein Verschlingen und bewahrt hier das eindrückliche, unwirkliche Bild des Traums.
- source_word: שִׁבֳּלִים
  choice: Ähren
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Wort die Ähren beziehungsweise Fruchtstände des Getreides; „Ähren“ ist im Deutschen knapp und natürlich.
- source_word: הַדַּקֹּת
  choice: die dünnen
  rationale: „Dünn“ gibt die Grundbedeutung des Adjektivs wieder, ohne die Beschaffenheit der Ähren stärker auszudeuten.
- source_word: הַטֹּבוֹת
  choice: die guten
  rationale: Die breite Bedeutung von טוב bleibt erhalten; „guten“ legt sich nicht unnötig auf „vollen“ oder „gesunden“ fest.
- source_word: וָאֹמַר אֶל
  choice: Da erzählte ich es
  rationale: Wörtlich steht „da sagte ich zu“. Im Zusammenhang ist gemeint, dass der Pharao den Traum berichtete; „erzählte ich es“ ist natürliches Deutsch und macht den impliziten Bezug verständlich.
- source_word: הַחַרְטֻמִּים
  choice: den ägyptischen Traumdeutern
  rationale: Der Ausdruck bezeichnet ägyptische Ritual- und Deutungsspezialisten. „Traumdeuter“ trifft ihre Funktion in diesem Zusammenhang besser als das im heutigen Deutsch leicht irreführende „Zauberer“; „ägyptischen“ ist aus dem Kontext erschlossen.
- source_word: וְאֵין מַגִּיד לִי
  choice: aber niemand konnte es mir erklären
  rationale: נגד bedeutet hier, die Bedeutung des Traums kundzutun. Die Formulierung gibt den kontextuellen Sinn idiomatisch wieder, ohne ausschließlich den Fachausdruck „deuten“ festzuschreiben.
