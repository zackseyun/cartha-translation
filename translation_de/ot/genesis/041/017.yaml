source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: »In meinem Traum – sieh, da stand ich am Ufer des Nils[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »des Flusses«. Im ägyptischen Zusammenhang der Genesis bezeichnet dieser Ausdruck gewöhnlich den Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sagte
  rationale: Das Verb bedeutet formal »sprechen«; zur Einleitung direkter Rede ist »sagte« im modernen deutschen Erzählstil die natürliche Entsprechung. »Da« gibt die fortschreitende Erzählfolge von וַ wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Form des ägyptischen Herrschertitels.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: אֶל bezeichnet hier den Adressaten der Rede; »zu Josef« ist die natürliche deutsche Wiedergabe. »Josef« entspricht der etablierten deutschen Namensform.
- source_word: בַּחֲלֹמִי
  choice: In meinem Traum
  rationale: Die Präposition בְּ mit dem Substantiv und dem Suffix der 1. Person Singular ergibt unmittelbar »in meinem Traum«.
- source_word: הִנְנִי
  choice: sieh, da
  rationale: Die Präsentativpartikel macht das Traumbild lebendig und lenkt die Aufmerksamkeit darauf. »Sieh, da« bewahrt diese Funktion in natürlichem, würdigem Deutsch.
- source_word: עֹמֵד
  choice: stand ich
  rationale: Das Partizip beschreibt den Pharao im Stehen. Im Rahmen eines berichteten Traums ist das deutsche Präteritum idiomatisch.
- source_word: עַל שְׂפַת
  choice: am Ufer
  rationale: שָׂפָה bedeutet wörtlich »Lippe/Rand« und bezeichnet bei einem Gewässer das Ufer. »Am Ufer« gibt die räumliche Wendung עַל שְׂפַת idiomatisch wieder.
- source_word: הַיְאֹר
  choice: des Nil
  rationale: Das Wort bezeichnet wörtlich den »Strom/Fluss«, im ägyptischen Zusammenhang der Genesis jedoch gewöhnlich den Nil. Der Haupttext nennt den klaren Referenten; die Fußnote bewahrt die formale lexikalische Alternative.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich bildet den lebhaften Übergang zum gesehenen Traumbild ab; »sieh, da« erhält den präsentierenden Charakter von הִנְנִי, ohne das im Deutschen deutlich feierlichere »siehe« zu verwenden.
