  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: de
  text: 'Da sagte der Pharao zu Josef: »Sieh, ich habe dich über das ganze Land Ägypten gesetzt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt diesen Fortgang im modernen Deutschen natürlich wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: Die Präposition bezeichnet den Adressaten der Rede; „Josef“ ist die gängige deutsche Namensform.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt die Aufmerksamkeit auf die feierliche Erklärung. „Sieh“ bewahrt diese Funktion knapp und würdevoll.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: ich setze dich über
  rationale: נתן bedeutet grundsätzlich „geben“, bezeichnet hier zusammen mit עַל jedoch die Einsetzung in eine Autoritätsstellung. Das hebräische Perfekt vollzieht beziehungsweise erklärt die Ernennung; das deutsche Präsens klingt in dieser performativen Rede natürlich und unmittelbar.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: das ganze Land Ägypten
  rationale: „Das ganze“ wahrt den umfassenden Geltungsbereich, und „Land Ägypten“ gibt אֶרֶץ מִצְרַיִם direkt und idiomatisch wieder.
