  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: de
  text: Die sieben guten Kühe sind sieben Jahre, und die sieben guten Ähren sind sieben Jahre. Es ist ein einziger Traum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: Kühe
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich weibliche Rinder und entspricht der Bildsprache von Pharaos Traum.
- source_word: הַטֹּבֹת
  choice: guten
  rationale: Die Grundbedeutung »gut« wird beibehalten, ohne sie enger als »gesund« oder »schön« auszulegen.
- source_word: שָׁנִים
  choice: Jahre
  rationale: Direkte und eindeutige Entsprechung; Josef deutet die Traumbilder ausdrücklich als Jahre.
- source_word: שִׁבֳּלִים
  choice: Ähren
  rationale: »Ähren« bezeichnet im modernen Deutschen klar den körnertragenden oberen Teil eines Getreidehalms.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: Es ist ein einziger Traum
  rationale: Die Formulierung wahrt den Singular und hebt hervor, dass beide Bildfolgen eine zusammengehörige Traumbotschaft bilden.
- source_word: הֵנָּה
  choice: sind
  rationale: Das feminine Pluralpronomen dient hier als Kopula und wird im Deutschen natürlich mit »sind« wiedergegeben.
