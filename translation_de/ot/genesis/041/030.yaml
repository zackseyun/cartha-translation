  terminology: „Hungerjahre“, „Überfluss“, „Hungersnot“ und „aufzehren“ sind kontextgerecht und erhalten sowohl den landesweiten Charakter als auch die Bildlichkeit des Hebräischen. Die Fußnote zu וְכִלָּה bietet eine tragfähige lexikalische Alternative, ohne den Haupttext zu überladen.
