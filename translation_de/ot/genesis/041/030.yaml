source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: de
  text: Danach werden sieben Hungerjahre kommen, und aller Überfluss im Land Ägypten wird vergessen sein, und die Hungersnot wird das Land aufzehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Hungersnot wird das Land zugrunde richten.“ Das hebräische Verb kann vollständiges Aufzehren oder Vernichten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: Danach werden … kommen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw bezeichnet in diesem prophetisch-vorausschauenden Zusammenhang die zeitlich folgende Zukunft. „Kommen“ ist im heutigen Deutsch für Jahre natürlicher als „sich erheben“.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: sieben Hungerjahre
  rationale: Die hebräische Constructusverbindung bezeichnet sieben von Hungersnot geprägte Jahre; „Hungerjahre“ ist knapp, natürlich und kontextgenau.
- source_word: אַחֲרֵיהֶן
  choice: Danach
  rationale: Das feminine Pluralsuffix verweist auf die sieben Jahre des Überflusses im vorherigen Vers. „Danach“ gibt diese zeitliche Folge idiomatisch wieder.
- source_word: וְנִשְׁכַּח
  choice: wird vergessen sein
  rationale: Der Nifal von שׁכח hat passiven Sinn. Die Formulierung bewahrt die Aussage, dass die frühere Fülle wegen der folgenden Not nicht mehr im Gedächtnis sein wird.
- source_word: כָּל הַשָּׂבָע
  choice: aller Überfluss
  rationale: שָׂבָע bezeichnet Sättigung, Fülle oder Überfluss. „Überfluss“ wahrt den breiten Sinn und beschränkt ihn nicht auf Getreidevorräte.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die geografische Wendung wird vollständig und in natürlichem Standarddeutsch wiedergegeben.
- source_word: וְכִלָּה
  choice: wird … aufzehren
  rationale: Das Piel von כלה kann vollständiges Verbrauchen, Vernichten oder Zugrunderichten ausdrücken. „Aufzehren“ passt bildhaft zur Hungersnot und bewahrt die Intensität.
- source_word: הָרָעָב
  choice: die Hungersnot
  rationale: Der bestimmte Ausdruck greift die zuvor genannten Hungerjahre auf; „Hungersnot“ bezeichnet die landesweite Not präziser als bloß „Hunger“.
- source_word: אֶת הָאָרֶץ
  choice: das Land
  rationale: אָרֶץ meint hier das zuvor genannte Land Ägypten; „das Land“ erhält den Rückbezug und den umfassenden räumlichen Sinn.
theological_decisions: []
