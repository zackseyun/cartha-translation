  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: de
  text: Der Pharao gab Josef den Namen Zafenat-Paneach[a] und gab ihm Asenat, die Tochter Potiferas, des Priesters von On[b], zur Frau. Dann zog Josef durch das Land Ägypten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Zafenat-Paaneach«. Bedeutung und genaue Wiedergabe dieses ägyptischen Namens sind unsicher.'
    reason: lexical_alternative
  - marker: b
    text: On ist die ägyptische Stadt, die später unter ihrem griechischen Namen Heliopolis bekannt war.
    reason: cultural_note
  - marker: c
    text: 'Oder: »über das Land Ägypten«. Die Wendung kann neben der Bewegung durch das Land auch Josefs Zuständigkeit anklingen lassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף
  choice: Der Pharao gab Josef den Namen
  rationale: קרא mit שׁם bezeichnet hier den formellen Akt der Namensgebung. Die deutsche Wendung ist natürlich und bewahrt diesen ausdrücklich.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Zafenat-Paneach
  rationale: Der ägyptische Name wird nach seiner hebräischen Überlieferungsform transliteriert; seine Bedeutung ist unsicher und wird daher nicht übersetzt.
- source_word: וַיִּתֶּן לוֹ ... לְאִשָּׁה
  choice: gab ihm ... zur Frau
  rationale: Die deutsche Fügung gibt die Heiratsverbindung knapp und idiomatisch wieder.
- source_word: אָסְנַת
  choice: Asenat
  rationale: Der Personenname wird in einer im Deutschen geläufigen, an der hebräischen Form orientierten Schreibweise wiedergegeben.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: die Tochter Potiferas
  rationale: Die Genitivkonstruktion gibt das hebräische Abstammungsverhältnis natürlich wieder; Potifera wird als Eigenname transliteriert.
- source_word: כֹּהֵן אֹן
  choice: des Priesters von On
  rationale: כֹּהֵן bedeutet hier Priester; On bleibt als hebräische Ortsnamensform im Haupttext erhalten.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: Dann zog Josef durch das Land Ägypten
  rationale: יצא bezeichnet das Hinausziehen; עַל kann im Kontext die Bewegung über beziehungsweise durch das Gebiet ausdrücken. Die Formulierung ist natürlich, ohne die mögliche Nuance seiner Amtsgewalt ausdrücklich festzulegen.
theological_decisions:
- issue: Bedeutung des ägyptischen Namens צָפְנַת פַּעְנֵחַ
  choice: Der Name wird transliteriert und nicht gedeutet.
  alternative: Eine vorgeschlagene Bedeutung wie »Gott spricht, und er lebt« oder »Enthüller der Geheimnisse« in den Haupttext aufnehmen.
  rationale: Die Etymologie und Bedeutung sind umstritten; eine Übersetzung würde eine unsichere Deutung festschreiben.
- issue: Reichweite und Nuance von עַל אֶרֶץ מִצְרָיִם
  choice: durch das Land Ägypten
  alternative: über das Land Ägypten
  rationale: Der Kontext kann sowohl räumliche Bewegung als auch Josefs neu verliehene Zuständigkeit anklingen lassen. Der Haupttext gibt die Reisebewegung natürlich wieder; die formnähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die natürliche deutsche Namensgebungsformel ersetzt eine unidiomatische wörtliche Nachbildung. Eigennamen und der alte Ortsname On bleiben erkennbar; Unsicherheiten werden in den Fußnoten offengelegt.
