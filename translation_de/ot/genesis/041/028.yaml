  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: de
  text: 'Das ist, was ich dem Pharao gesagt habe: Was Gott tut, hat er dem Pharao gezeigt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was Gott zu tun im Begriff ist, hat er dem Pharao gezeigt.“ Das hebräische Partizip kann gegenwärtiges oder bevorstehendes Handeln bezeichnen; hier geht es um die in den Träumen angekündigten Ereignisse.'
    reason: lexikalische und zeitliche Alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Das ist es
  rationale: Die hebräische Identifikationsformel wird im Deutschen natürlich wiedergegeben und verweist auf die zuvor erklärte Bedeutung der Träume.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: was ich zum Pharao gesagt habe
  rationale: Das Relativpronomen und דבר werden in diesem Rückverweis idiomatisch mit „was … gesagt habe“ wiedergegeben; אֶל bezeichnet den Adressaten.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier Gott als den Handelnden; der hebräische Artikel verlangt im Deutschen keinen Artikel.
- source_word: עֹשֶׂה
  choice: tut
  rationale: Das Partizip bezeichnet eine gegenwärtig dargestellte beziehungsweise bevorstehende Handlung. Die knappe Wiedergabe bewahrt diese zeitliche Offenheit.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: hat er den Pharao sehen lassen
  rationale: Der Hifil von ראה bedeutet wörtlich „sehen lassen“ und bezeichnet hier Gottes Offenbarung an den Pharao.
theological_decisions:
- issue: Zeitbezug von Gottes Handeln
  choice: was Gott tut
  alternative: was Gott tun wird / zu tun im Begriff ist
  rationale: Das hebräische Partizip kann gegenwärtiges oder unmittelbar bevorstehendes Handeln ausdrücken. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die kontextuell naheliegende Zukunftsdeutung.
- issue: Bezeichnung הָאֱלֹהִים in Josefs Rede
  choice: Gott
  alternative: der Gott
  rationale: „Gott“ ist die natürliche deutsche Wiedergabe des bestimmten hebräischen Ausdrucks, ohne zusätzliche konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „sehen lassen“ bleibt näher an der hebräischen Kausativform als das glattere „gezeigt“, während die Fußnote eine idiomatische Alternative bietet.
