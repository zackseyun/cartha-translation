  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: de
  text: Und siehe, aus dem Nil stiegen sieben Kühe herauf, kräftig am Leib[a] und schön von Gestalt, und sie weideten im Riedgras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wohlgenährt“ oder „fleischig“; wörtlich beschreibt das Hebräische die Kühe als gesund beziehungsweise voll an Fleisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „im Schilf“, „zwischen den Binsen“ oder „im Sumpfgras“; gemeint ist Feuchtlandvegetation am Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt den anschaulichen hebräischen Hinweismarker und die Unmittelbarkeit des Traumberichts in natürlichem modernem Deutsch.
- source_word: מִן הַיְאֹר
  choice: aus dem Nil
  rationale: יְאֹר bezeichnet im ägyptischen Kontext der Erzählung am natürlichsten den Nil, nicht bloß einen unbestimmten Fluss.
- source_word: עֹלֹת
  choice: stiegen … herauf
  rationale: Gibt das Partizip als sich entfaltenden Vorgang wieder und passt idiomatisch zum Auftauchen der Kühe aus dem Nil.
- source_word: שֶׁבַע פָּרוֹת
  choice: sieben Kühe
  rationale: פָּרוֹת bezeichnet ausdrücklich weibliche Rinder; „Kühe“ ist präzise und allgemein verständlich.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: kräftig am Leib
  rationale: Die Wendung beschreibt körperliche Gesundheit beziehungsweise Fülle. „Kräftig am Leib“ bewahrt den körperlichen Bezug, ohne ihn ausschließlich als Fettsein oder gute Fütterung auszulegen.
- source_word: וִיפֹת תֹּאַר
  choice: schön von Gestalt
  rationale: Entspricht der hebräischen Formulierung für eine schöne, wohlgeformte Erscheinung und klingt im Deutschen würdig und natürlich.
- source_word: וַתִּרְעֶינָה
  choice: sie weideten
  rationale: רעה bezeichnet hier das Grasen beziehungsweise Weiden der Tiere.
- source_word: בָּאָחוּ
  choice: im Riedgras
  rationale: אָחוּ verweist auf feuchte Ufer- oder Sumpfvegetation. „Riedgras“ erhält diesen landschaftlichen Bezug besser als das allgemeinere „Wiese“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ erhält die lebendige Erzählweise, während „kräftig am Leib“ und „Riedgras“ die konkrete Bildsprache des Hebräischen bewahren.
