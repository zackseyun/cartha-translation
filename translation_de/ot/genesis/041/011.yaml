id: GEN.41.11
reference: Genesis 41:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: de
  text: Und wir träumten in ein und derselben Nacht[a], ich und er; jeder von uns träumte entsprechend der Deutung seines Traumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einer Nacht«; gemeint ist die eine Nacht, in der beide träumten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: Und wir träumten
  rationale: Die Verbindung aus dem Verb חָלַם und dem gleichstämmigen Substantiv חֲלוֹם lautet wörtlich »wir träumten einen Traum«. Im Deutschen genügt hier zunächst das natürliche »wir träumten«; das abschließende חָלָמְנוּ nimmt das Verb erneut auf.
- source_word: בְּלַיְלָה אֶחָד
  choice: in ein und derselben Nacht
  rationale: Wörtlich steht »in einer Nacht«. Im Zusammenhang bezeichnet אֶחָד die eine gemeinsame Nacht, in der beide Männer träumten; die gewählte Formulierung macht diese Gleichzeitigkeit idiomatisch deutlich, ohne den Singular aufzugeben.
- source_word: אֲנִי וָהוּא
  choice: ich und er
  rationale: Die ungewöhnliche Nachstellung und die Reihenfolge des Hebräischen werden bewahrt, da sie beide Beteiligten nach dem Pluralverb ausdrücklich hervorheben.
- source_word: אִישׁ
  choice: jeder von uns
  rationale: 'אִישׁ wird hier distributiv gebraucht: Jeder der beiden Männer hatte seinen eigenen Traum. »Jeder von uns« gibt diese Funktion im Deutschen klar wieder.'
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: entsprechend der Deutung seines Traumes
  rationale: Die Präposition כְּ bezeichnet eine Entsprechung zwischen dem jeweiligen Traum und seiner Deutung. Die Formulierung lässt offen, wie diese Deutung später erkannt oder mitgeteilt wird.
- source_word: חָלָמְנוּ
  choice: träumte
  rationale: Das hebräische Verb steht zwar in der ersten Person Plural, gehört aber zu der distributiven Konstruktion mit אִישׁ. Deutsch gibt den Sinn natürlich im Singular nach »jeder von uns« wieder.
theological_decisions: []
