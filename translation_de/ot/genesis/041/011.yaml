  register: Modernes, würdiges Standarddeutsch. Die semitische Nachstellung »ich und er« sowie die enge Beziehung zwischen Traum und Deutung bleiben bewusst sichtbar; unnötige Glättung oder theologische Auslegung wurde vermieden.
