  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: de
  text: Du sollst über mein Haus gesetzt sein, und deinem Befehl soll mein ganzes Volk gehorchen.[a] Nur auf dem Thron werde ich größer sein als du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und nach deinem Mund soll mein ganzes Volk küssen.“ Gemeint ist hier wahrscheinlich, dass das Volk Josefs Anordnungen gehorchen oder ihm Huldigung erweisen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: über mein Haus gesetzt sein
  rationale: Die Wendung bezeichnet Autorität und Aufsicht über den königlichen Haushalt beziehungsweise die gesamte Hausverwaltung. „Haus“ bewahrt die Bild- und Bedeutungsbreite des Hebräischen.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: deinem Befehl soll … gehorchen
  rationale: Wörtlich stehen hier „auf deinen Mund hin“ und „küssen“. Im Zusammenhang der übertragenen Regierungsgewalt bezeichnet die Wendung wahrscheinlich Gehorsam oder Huldigung auf Josefs Anordnung hin; die ungewöhnliche wörtliche Lesart bleibt in der Fußnote sichtbar.
- source_word: כָּל־עַמִּי
  choice: mein ganzes Volk
  rationale: Dies ist die direkte und im Deutschen natürliche kollektive Bezeichnung.
- source_word: רַק
  choice: Nur
  rationale: Das Wort führt die einzige Einschränkung von Josefs Vollmacht ein.
- source_word: הַכִּסֵּא
  choice: der Thron
  rationale: Der Thron steht konkret und zugleich metonymisch für Pharaos königliches Amt und seine verbleibende Vorrangstellung.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: werde ich größer sein als du
  rationale: Die Formulierung bewahrt den hebräischen Vergleich. Durch „durch den Thron“ wird deutlich, dass es um Rang und Amtsstellung geht.
