base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: de
  text: Der Pharao war zornig über seine Diener und nahm mich und den obersten Bäcker im Haus des Obersten der Leibwache[b] in Gewahrsam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter Bewachung“. Das hebräische Wort bezeichnet eine bewachte Verwahrung und muss kein förmliches Gefängnisgebäude meinen.'
    reason: lexical_alternative
  - marker: b
    text: „Oberster der Leibwache“ gibt einen Hoftitel wieder, der wörtlicher „Oberster der Schlachter/Henker“ lautet.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: war zornig
  rationale: Das Verb bezeichnet Zorn oder heftigen Unwillen. „War zornig“ gibt den Sinn natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Gemeint sind hier königliche Amtsträger. „Diener“ bewahrt zugleich den Beziehungsaspekt des hebräischen עבד und legt nicht einseitig „Sklaven“ fest.
- source_word: בְּמִשְׁמַר
  choice: in Gewahrsam
  rationale: Der Ausdruck bezeichnet bewachte Verwahrung oder Haft, ohne zwingend ein förmliches Gefängnisgebäude vorauszusetzen.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: im Haus des Obersten der Leibwache
  rationale: Die Wendung bezeichnet im Erzählzusammenhang den Amtssitz beziehungsweise Haushalt eines hohen königlichen Funktionärs. „Oberster der Leibwache“ ist als Hoftitel verständlich, während die wörtlichere Bedeutung von טבחים in einer Fußnote erhalten bleibt.
- source_word: שַׂר הָאֹפִים
  choice: der oberste Bäcker
  rationale: Die Verbindung bezeichnet den Leiter der königlichen Bäcker und wird im Deutschen knapp und verständlich wiedergegeben.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: mich und den obersten Bäcker
  rationale: Die koordinierte deutsche Formulierung bewahrt beide Personen als Gegenstand der Inhaftierung und klingt natürlicher als eine Nachbildung der hebräischen Wiederaufnahme.
