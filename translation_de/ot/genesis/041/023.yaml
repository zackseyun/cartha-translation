  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: de
  text: 'Und siehe: sieben verkümmerte, dünne und vom Ostwind versengte Ähren sprossen nach ihnen auf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Bewahrt die lebhafte, hinweisende Kraft der Wendung im Traumbericht und klingt zugleich natürlich und würdevoll.
- source_word: שֶׁבַע
  choice: sieben
  rationale: Entspricht unmittelbar der Kardinalzahl.
- source_word: שִׁבֳּלִים
  choice: Ähren
  rationale: Bezeichnet hier die fruchttragenden Getreideähren, nicht allgemein die Halme.
- source_word: צְנֻמוֹת
  choice: verkümmerte
  rationale: Gibt den seltenen Ausdruck als Beschreibung kümmerlicher bzw. eingeschrumpfter Ähren wieder und lässt ihn nicht mit dem folgenden Adjektiv zusammenfallen.
- source_word: דַּקּוֹת
  choice: dünne
  rationale: Bewahrt die eigenständige Beschreibung der Ähren als dünn oder mager.
- source_word: שְׁדֻפוֹת קָדִים
  choice: vom Ostwind versengte
  rationale: Drückt die Schädigung durch den heißen, trockenen Ostwind anschaulich und im Deutschen idiomatisch aus.
- source_word: צֹמְחוֹת
  choice: wuchsen empor
  rationale: Der Partizipialausdruck schildert das Hervorkommen als Teil der sich entfaltenden Traumszene; „emporwachsen“ passt zu Ähren besser als „sprießen“.
- source_word: אַחֲרֵיהֶם
  choice: nach ihnen
  rationale: Bezieht sich auf die zuvor genannten sieben Ähren und wahrt die zeitlich-räumliche Folge.
