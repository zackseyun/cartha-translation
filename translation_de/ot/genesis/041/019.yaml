base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: de
  text: Und siehe, sieben andere Kühe stiegen hinter ihnen herauf, kümmerlich, von sehr hässlicher Gestalt und mager am Leib. Kühe von so übler Gestalt hatte ich im ganzen Land Ägypten noch nie gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von solcher Elendigkeit“; das Hebräische bewertet die Kühe allgemein als außergewöhnlich schlecht oder jämmerlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt das lebhafte hebräische Aufmerksamkeitssignal in einer würdigen, weiterhin verständlichen Erzählweise.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: sieben andere Kühe
  rationale: פָּרוֹת bezeichnet hier weibliche Rinder; אֲחֵרוֹת beschreibt eine weitere Gruppe von sieben Kühen.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: stiegen hinter ihnen herauf
  rationale: Gibt sowohl die aufwärtsgerichtete Bewegung als auch die Folgebeziehung wieder; die finite Verbform ist im deutschen Traumbericht natürlich.
- source_word: דַּלּוֹת
  choice: kümmerlich
  rationale: Bezeichnet den schwachen, dürftigen Zustand der Tiere, ohne die später ausdrücklich genannte Magerkeit vorwegzunehmen.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: äußerst hässlich anzusehen
  rationale: רָעוֹת beschreibt zusammen mit תֹּאַר das sehr schlechte äußere Erscheinungsbild, nicht moralische Bosheit.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: mager am Leib
  rationale: Gibt die körperliche Auszehrung idiomatisch wieder und bleibt nahe am Bild des dünnen Fleisches.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: So hässliche hatte ich … noch nie gesehen
  rationale: Natürliche deutsche Wiedergabe des rückblickenden Vergleichs; „noch nie“ bringt die im Zusammenhang gemeinte Einmaligkeit klar zum Ausdruck.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: im ganzen Land Ägypten
  rationale: Entspricht der umfassenden geografischen Formulierung des Hebräischen.
- source_word: לָרֹעַ
  choice: so hässliche
  rationale: Bezieht die abschließende Bewertung im Kontext auf das außergewöhnlich schlechte Aussehen der Kühe; die breitere Bedeutung wird in der Fußnote offengehalten.
