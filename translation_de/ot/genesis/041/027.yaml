  text: וְ/שֶׁ֣בַע הַ֠/פָּרוֹת הָֽ/רַקּ֨וֹת וְ/הָ/רָעֹ֜ת הָ/עֹלֹ֣ת אַחֲרֵי/הֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִׁבֳּלִים֙ הָ/רֵק֔וֹת שְׁדֻפ֖וֹת הַ/קָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: de
  text: Und die sieben mageren und hässlichen Kühe, die nach ihnen heraufkamen, sind sieben Jahre, und die sieben leeren, vom Ostwind versengten Ähren werden sieben Hungerjahre sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: mageren
  rationale: Das Adjektiv bezeichnet bei den Kühen ihre abgemagerte, dürftige körperliche Verfassung. »Mager« ist im heutigen Deutsch natürlich und entspricht dem Traumbild.
- source_word: וְהָרָעֹת
  choice: schlechten
  rationale: רַע beschreibt hier den schlechten Zustand beziehungsweise das unerfreuliche Aussehen der Kühe, nicht moralische Bosheit. »Schlecht« bewahrt die breite Bedeutung.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: die nach ihnen heraufkamen
  rationale: Die Wendung bezeichnet das spätere Heraufkommen der Kühe im Traum und bewahrt zugleich das im Hebräischen verwendete Verb des Heraufsteigens.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: sind sieben Jahre
  rationale: Die Formulierung gibt Josefs symbolische Gleichsetzung der Kühe mit sieben Jahren direkt wieder.
- source_word: הַשִׁבֳּלִים
  choice: Ähren
  rationale: Das Substantiv bezeichnet die Ähren beziehungsweise Fruchtstände des Getreides. »Ähren« ist die präzise und allgemein verständliche deutsche Bezeichnung.
- source_word: הָרֵקוֹת
  choice: leeren
  rationale: Bei Ähren bezeichnet das Wort fehlende Füllung beziehungsweise fehlende Körner; »leer« gibt dieses Bild unmittelbar wieder.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: vom Ostwind versengten
  rationale: Das passive Partizip beschreibt die durch den heißen Ostwind verursachte Schädigung. »Versengt« ist anschaulich und im Deutschen idiomatisch.
- source_word: יִהְיוּ
  choice: werden … sein
  rationale: Der Imperfekt blickt in Josefs Deutung auf die bevorstehenden Hungerjahre voraus; die deutsche Futurform bewahrt diesen Vorwärtsbezug.
- source_word: שְׁנֵי רָעָב
  choice: Hungerjahre
  rationale: Das deutsche Kompositum gibt die hebräische Konstruktverbindung »Jahre des Hungers/der Hungersnot« knapp, natürlich und kontextgerecht wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit engem Anschluss an Satzbau und Bildwelt des Hebräischen. Die wiederholte Zahl Sieben und der Wechsel von gegenwärtiger symbolischer Gleichsetzung (»sind«) zu zukünftiger Erfüllung (»werden … sein«) bleiben erhalten.
