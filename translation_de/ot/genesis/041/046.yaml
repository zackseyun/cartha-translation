  text: וְ/יוֹסֵף֙ בֶּן שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּ/עָמְד֕/וֹ לִ/פְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יֵּצֵ֤א יוֹסֵף֙ מִ/לִּ/פְנֵ֣י פַרְעֹ֔ה וַֽ/יַּעְבֹ֖ר בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: de
  text: Josef war dreißig Jahre alt, als er vor dem Pharao, dem König von Ägypten, stand. Dann verließ Josef die Gegenwart des Pharao und zog durch das ganze Land Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: war dreißig Jahre alt
  rationale: Die hebräische Altersangabe wird im modernen Deutschen idiomatisch wiedergegeben.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: als er vor dem Pharao … stand
  rationale: Die Präposition mit Infinitiv bezeichnet den Zeitpunkt; »vor dem Pharao stehen« bewahrt zugleich die höfische Bedeutung der Gegenwart vor dem Herrscher.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: dem König von Ägypten
  rationale: Die Apposition wird im Deutschen durch Kommas und den dem Bezugswort angepassten Kasus natürlich kenntlich gemacht.
- source_word: וַיֵּצֵא … מִלִּפְנֵי פַרְעֹה
  choice: Dann ging Josef vom Pharao hinaus
  rationale: »hinausgehen« wahrt die konkrete Bewegungsrichtung; »vom Pharao« gibt das Verlassen seiner Gegenwart in natürlichem Deutsch wieder.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: und zog durch das ganze Land Ägypten
  rationale: »zog durch« bezeichnet umfassende Bewegung durch das Land, ohne den im Kontext naheliegenden Verwaltungszweck ausdrücklich in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung ist natürlich gestaltet; »Dann« gibt den Fortgang der hebräischen Erzählfolge wieder, ohne ein nicht vorhandenes zeitliches »nun« am Versanfang einzuführen. Keine Fußnoten erforderlich.
