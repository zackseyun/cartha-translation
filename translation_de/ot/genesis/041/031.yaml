  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: de
  text: Und der Überfluss im Land wird wegen jener darauffolgenden Hungersnot nicht mehr erkennbar sein[a], denn sie wird sehr schwer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird der Überfluss im Land nicht mehr bekannt sein«; das hebräische Verb kann »bekannt sein«, »wahrgenommen werden« oder »erkennbar sein« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: wird … nichts mehr zu erkennen sein
  rationale: Das Nifal von ידע kann hier »bekannt sein«, »wahrgenommen werden« oder »erkennbar sein« bedeuten. Die gewählte Formulierung drückt natürlich aus, dass der frühere Überfluss angesichts der Hungersnot nicht mehr wahrnehmbar sein wird, ohne die Bedeutung auf bloßes Vergessen festzulegen.
- source_word: הַשָּׂבָע
  choice: der Überfluss
  rationale: Das Substantiv bezeichnet im Zusammenhang den reichen Ertrag beziehungsweise die Fülle der guten Jahre. »Überfluss« ist im Deutschen verständlich und wahrt den Gegensatz zur Hungersnot.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Gemeint ist das von den Ereignissen betroffene Gebiet, im Kontext besonders Ägypten, nicht notwendig die ganze Erde.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund dafür, dass der frühere Überfluss nicht mehr erkennbar sein wird.
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: danach wegen jener Hungersnot
  rationale: Die Formulierung bewahrt sowohl die zeitliche Folge als auch die demonstrative Rückverweisung des Hebräischen. Die Stellung von »danach« bleibt sachlich mehrdeutig genug, kann aber natürlich auf die später eintretende Hungersnot bezogen werden.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: denn sie wird sehr schwer sein
  rationale: כבד bedeutet wörtlich »schwer« und beschreibt eine Hungersnot idiomatisch als äußerst drückend beziehungsweise heftig. »Sehr schwer« erhält das Bild und klingt im Deutschen natürlich.
