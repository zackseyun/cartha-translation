  source_fidelity: 'Der Entwurf gibt die Aussage insgesamt zutreffend wieder: Der frühere Überfluss wird angesichts der nachfolgenden Hungersnot nicht mehr wahrnehmbar sein, weil diese äußerst schwer sein wird. Die Stellung von »danach« vor »wegen« ist jedoch im Deutschen syntaktisch und semantisch weniger klar; sie kann den ganzen Hauptsatz statt die Hungersnot näher bestimmen. Die hebräische Wortgruppe הָרָעָב הַהוּא אַחֲרֵי כֵן bezeichnet die später eintretende Hungersnot.'
