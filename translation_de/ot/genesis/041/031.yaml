  terminology: »Überfluss«, »Land«, »Hungersnot« und »sehr schwer« sind sachgerecht. »Sehr schwer« gibt כָבֵד ... מְאֹד angemessen wieder, ohne die bildhafte Sprache unnötig zu ersetzen. Die Fußnote erhält die lexikalische Spannweite des Nifal von ידע und ist am betreffenden Ausdruck verankert.
