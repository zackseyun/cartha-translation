  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: de
  text: Noch bevor das Hungerjahr begann[a], wurden Josef zwei Söhne geboren, die ihm Asenat, die Tochter Potiferas, des Priesters von On[b], gebar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bevor das Jahr des Hungers kam«. Der hebräische Text verwendet hier die Einzahl »Jahr« und bezeichnet damit den Beginn der Hungerzeit.'
    reason: lexical_alternative
  - marker: b
    text: On war eine ägyptische Stadt, die später unter ihrem griechischen Namen Heliopolis bekannt war.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף יֻלַּד
  choice: wurden Josef … geboren
  rationale: Die passive Form von ילד bezeichnet zusammen mit לְיוֹסֵף, dass Josef Söhne geboren wurden. Die deutsche Konstruktion gibt dieses Verhältnis natürlich wieder und stimmt im Numerus mit »zwei Söhne« überein.
- source_word: שְׁנֵי בָנִים
  choice: zwei Söhne
  rationale: Direkte und im genealogischen Zusammenhang angemessene Wiedergabe der gezählten männlichen Nachkommen.
- source_word: בְּטֶרֶם
  choice: Noch bevor
  rationale: Die temporale Konjunktion bezeichnet eindeutig die Zeit vor dem folgenden Ereignis; »noch bevor« klingt im Deutschen natürlich und hebt den zeitlichen Vorrang hervor.
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: das Hungerjahr begann
  rationale: Wörtlich kommt das »Jahr des Hungers«. Im Zusammenhang bezeichnet die singuläre Wendung den Beginn der Hungerzeit; »begann« gibt diesen Sinn in natürlichem Deutsch wieder, während die Fußnote die hebräische Bildform offenlegt.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: die ihm … gebar
  rationale: Der Relativsatz bezieht sich auf die beiden Söhne und bewahrt sowohl das Geburtsverb als auch den Bezug auf Josef.
- source_word: אָסְנַת
  choice: Asenat
  rationale: Der ägyptische Personenname wird in einer im Deutschen etablierten, quellennahen Form wiedergegeben.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: die Tochter Potiferas
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Asenats Abstammung. Der deutsche Genitiv ist knapp und idiomatisch.
- source_word: כֹּהֵן אֹון
  choice: Priester von On
  rationale: כֹּהֵן bezeichnet einen Priester; On ist der Ortsname und wird transliteriert.
