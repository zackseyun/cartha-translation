  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: de
  text: Und nun soll der Pharao nach einem verständigen und weisen Mann suchen[a] und ihn über das Land Ägypten einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll der Pharao einen verständigen und weisen Mann auswählen“. Das hebräische Verb kann hier das Sehen, Finden oder Auswählen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Kennzeichnet den Übergang von Josefs Traumdeutung zu seinem praktischen Rat und bewahrt zugleich die hebräische Verknüpfung.
- source_word: יֵרֶא
  choice: soll ... suchen
  rationale: Der Jussiv von ראה bezeichnet hier kontextgemäß nicht bloß das Sehen, sondern das Aussuchen beziehungsweise Finden eines geeigneten Mannes.
- source_word: פַרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels.
- source_word: אִישׁ
  choice: einem ... Mann
  rationale: Gibt das grammatisch männliche Singularwort im Kontext eines männlichen Amtsträgers konkret wieder.
- source_word: נָבוֹן
  choice: verständigen
  rationale: Bezeichnet Einsicht und gutes Urteilsvermögen; die geläufige Verbindung „verständig und weise“ ist natürlich und würdig.
- source_word: וְחָכָם
  choice: und weisen
  rationale: Gibt Weisheit im Sinn von Urteilskraft und praktischer Befähigung wieder.
- source_word: וִישִׁיתֵהוּ
  choice: und ihn ... einsetzen
  rationale: שׂים bedeutet setzen oder stellen; „einsetzen“ drückt im administrativen Zusammenhang die Übertragung einer Leitungsfunktion natürlich aus.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: über das Land Ägypten
  rationale: Bewahrt sowohl die durch עַל bezeichnete Autorität als auch die hebräische Wendung „Land Ägypten“.
