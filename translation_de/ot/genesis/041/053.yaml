  text: Da gingen die sieben Jahre des Überflusses zu Ende, der im Land Ägypten geherrscht hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: Da gingen … zu Ende
  rationale: Das Wayyiqtol von כלה führt die Erzählung fort und bezeichnet den Abschluss des Zeitraums. „Da gingen … zu Ende“ ist natürliches, würdevolles Deutsch.
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: die sieben Jahre des Überflusses
  rationale: Die hebräische Konstruktverbindung wird mit dem Genitiv wiedergegeben. „Überfluss“ bezeichnet hier die vorausgesagte Zeit reicher Erträge.
- source_word: אֲשֶׁר הָיָה
  choice: die … gewesen waren
  rationale: Der Relativsatz blickt aus der Perspektive ihres Endes auf den bereits bestehenden Zeitraum zurück; der deutsche Plusquamperfekt bildet diese zeitliche Beziehung klar ab.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: „Land“ gibt אֶרֶץ ausdrücklich wieder; „im Land Ägypten“ ist eine geläufige biblische und zugleich verständliche deutsche Formulierung.
