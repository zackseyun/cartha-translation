  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: de
  text: Sie gelangten in das Innere der mageren Kühe[a]; doch man konnte nicht erkennen, dass sie in das Innere der mageren Kühe gelangt waren. Ihr Aussehen war schlecht wie am Anfang. Da wachte ich auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihr Inneres“. Im Zusammenhang sind die mageren Kühe gemeint; möglich ist auch „in ihren Bauch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: Sie kamen in deren Leib
  rationale: בוא mit אֶל bezeichnet hier das Hineingelangen in das Innere. „Deren“ macht im Deutschen deutlich, dass die gefressenen Kühe in den Leib der mageren Kühe kamen, ohne den Bezug durch zusätzliche Substantive auszudeuten.
- source_word: וְלֹא נוֹדַע
  choice: doch man konnte nicht erkennen
  rationale: Das unpersönliche Passiv des Niphal wird idiomatisch wiedergegeben und bezeichnet hier fehlende Sichtbarkeit beziehungsweise Wahrnehmbarkeit, nicht mangelndes Wissen im abstrakten Sinn.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: dass sie in deren Leib gekommen waren
  rationale: Die Wiederholung des hebräischen Ausdrucks bleibt erhalten; das Plusquamperfekt ist im deutschen Nebensatz nach der vorausgehenden Erzählhandlung natürlich.
- source_word: וּמַרְאֵיהֶן רַע
  choice: Ihr Aussehen war so schlecht
  rationale: מַרְאֶה bezeichnet das sichtbare Erscheinungsbild; רַע bleibt mit „schlecht“ bewusst allgemein. „so“ führt im Deutschen natürlich zur folgenden Vergleichsangabe hin.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: wie zuvor
  rationale: Gemeint ist ihr Aussehen vor dem Fressen. „Wie zuvor“ gibt den zeitlichen Vergleich im Kontext knapp und idiomatisch wieder.
- source_word: וָאִיקָץ
  choice: Da wachte ich auf
  rationale: Der Wayyiqtol schließt den Traumbericht als nächstes Ereignis ab; „Da“ drückt diese Folge in natürlichem deutschem Erzählstil aus.
