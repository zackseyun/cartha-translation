translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kollektive Personifikation »die ganze Welt kam« bewahrt die rhetorische Weite des Hebräischen; »Getreide« wird als im Verb impliziertes Objekt ergänzt.
