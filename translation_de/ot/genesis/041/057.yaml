  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: de
  text: Aus aller Welt kamen Menschen nach Ägypten zu Josef, um Getreide zu kaufen, denn die Hungersnot war in der ganzen Welt schwer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Und die ganze Welt
  rationale: אֶרֶץ kann »Erde«, »Land« oder »Gebiet« bedeuten. »Die ganze Welt« bewahrt die umfassende, erzählerisch überhöhende Ausdrucksweise und lässt die kollektive Wendung als Bezeichnung für die Menschen der betroffenen Länder stehen.
- source_word: בָּאוּ
  choice: kam
  rationale: בוא bezeichnet das Kommen beziehungsweise Eintreten. Das singularische »kam« entspricht im Deutschen dem kollektiven Subjekt »die ganze Welt«.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Ägypten zu; »nach Ägypten« ist die natürliche deutsche Form.
- source_word: לִשְׁבֹּר
  choice: um Getreide zu kaufen
  rationale: שׁבר bezeichnet in diesem Hungersnotkontext den Erwerb von Getreide; das Objekt wird im Deutschen zur Klarheit ausdrücklich genannt.
- source_word: אֶל יוֹסֵף
  choice: zu Josef
  rationale: Die Präposition אֶל bedeutet wörtlich »zu«. Die Wiedergabe wahrt Josefs Rolle als zuständiger Verwalter, ohne sie weiter auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das Kommen nach Ägypten ein; »denn« verbindet die beiden Aussagen natürlich und würdevoll.
- source_word: חָזַק הָרָעָב
  choice: die Hungersnot war … schwer
  rationale: חזק bedeutet wörtlich »stark sein«; bei einer Hungersnot gibt »schwer« die Intensität idiomatisch wieder.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Die zweite Verwendung von אֶרֶץ wird mit »Erde« wiedergegeben, um den räumlichen Umfang deutlich zu machen. Die Variation zu »Welt« ist im Deutschen idiomatisch, ohne den breiten Geltungsbereich einzuengen.
