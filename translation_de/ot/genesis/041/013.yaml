  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: de
  text: 'Und es geschah genau so, wie er uns die Träume gedeutet hatte: Mich setzte er wieder in mein Amt ein[a], ihn aber hängte er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung bezeichnet die Wiederherstellung in seine frühere amtliche Stellung.
