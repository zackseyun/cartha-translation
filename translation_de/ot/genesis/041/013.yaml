lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: Und es geschah genau so, wie ...
  rationale: Die Formulierung bewahrt die betonte genaue Entsprechung zwischen Deutung und tatsächlichem Ausgang, ohne die im Deutschen schwerfällige Wiederholung von »geschehen« und »sein« nachzubilden.
- source_word: פָּתַר לָנוּ
  choice: er uns die Träume gedeutet hatte
  rationale: פתר bezeichnet hier das Deuten von Träumen. Das im Hebräischen nicht wiederholte Objekt wird aus dem unmittelbaren Kontext ergänzt; das Plusquamperfekt gibt das zeitliche Verhältnis im Deutschen natürlich wieder.
- source_word: אֹתִי הֵשִׁיב
  choice: Mich setzte er wieder ... ein
  rationale: Die Voranstellung von »Mich« erhält den deutlichen Kontrast zum anschließenden »ihn«.
- source_word: עַל כַּנִּי
  choice: in mein Amt
  rationale: Die hebräische Wendung bezeichnet hier die Rückkehr in die frühere amtliche Stellung; »in mein Amt einsetzen« gibt den Sinn idiomatisch und präzise wieder.
- source_word: וְאֹתוֹ תָלָה
  choice: ihn aber ließ er hängen
  rationale: »Aber« verdeutlicht den scharfen Gegensatz der beiden Ausgänge. תלה wird mit dem üblichen »hängen« wiedergegeben, ohne die genaue Hinrichtungsweise über den Wortlaut hinaus festzulegen.
