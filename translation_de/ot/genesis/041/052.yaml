id: GEN.41.52
reference: Genesis 41:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: de
  text: Und den zweiten nannte er Efraim[a], denn Gott hat mich im Land meines Elends fruchtbar gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efraim klingt im Hebräischen ähnlich wie die Wendung »hat mich fruchtbar gemacht«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי
  choice: Und den zweiten nannte er
  rationale: Die hebräische Wendung lautet wörtlich etwa »und den Namen des zweiten«; im modernen Deutschen gibt »und den zweiten nannte er« die Namensgebung natürlich wieder und bewahrt die einleitende Verbindung וְ.
- source_word: קָרָא
  choice: nannte er
  rationale: קרא bezeichnet in diesem Zusammenhang die Vergabe eines Namens; »nannte« ist im Deutschen idiomatisch und präzise.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention transliteriert.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet Josefs Erklärung der Namensgebung ein; »denn« bewahrt den begründenden Charakter.
- source_word: הִפְרַנִי
  choice: hat mich fruchtbar gemacht
  rationale: Die Hifil-Form von פרה bedeutet »fruchtbar machen« und erhält zugleich den sprachlichen Anklang an den Namen Efraim.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das syntaktische Umfeld weist auf den einen Gott als Handelnden; daher ist die singularische Wiedergabe sachgemäß.
- source_word: בְּאֶרֶץ
  choice: im Land
  rationale: »Land« gibt אֶרֶץ in diesem geografischen Zusammenhang knapp und bibelsprachlich angemessen wieder.
- source_word: עָנְיִי
  choice: meines Elends
  rationale: עֳנִי bezeichnet Bedrängnis, Leid oder Elend. »Elend« ist verständlich, gewichtig und lässt den genauen Umfang von Josefs Leiden offen.
theological_decisions:
- issue: Deutung von Josefs Erklärung des Namens
  choice: Josef schreibt seine Fruchtbarkeit Gottes Wirken zu und bezeichnet zugleich das Land als Ort seines Elends.
  alternative: Die Wendung könnte ausschließlich auf seine früheren Leiden in Ägypten oder umfassender auf sein Leiden einschließlich der Trennung von seiner Familie bezogen werden.
  rationale: Der Vers verbindet Gottes Segen mit der fortbestehenden Erinnerung an das Leid. Die Übersetzung bewahrt diese Spannung und legt den zeitlichen oder sachlichen Umfang des Elends nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nah an der hebräischen Satzstruktur, ohne unnatürlich zu wirken; das Wortspiel wird im Text erhalten und in der Fußnote erläutert.
