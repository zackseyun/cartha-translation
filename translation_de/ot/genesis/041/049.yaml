  text: וַ/יִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּ/ח֥וֹל הַ/יָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי חָדַ֥ל לִ/סְפֹּ֖ר כִּי אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: de
  text: Und Josef häufte Getreide an, wie Sand am Meer, in sehr großer Menge, bis er aufhörte zu zählen, denn es war nicht zu zählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn es gab keine Zahl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: häufte … auf
  rationale: צבר bezeichnet das Anhäufen beziehungsweise Ansammeln großer Vorräte. „häufte … auf“ bewahrt das konkrete Bild und passt zum Verwaltungskontext.
- source_word: יוֹסֵף
  choice: Josef
  rationale: „Josef“ ist die im Deutschen etablierte und unmittelbar erkennbare Form des hebräischen Namens יוֹסֵף.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר bezeichnet hier Getreide allgemein, nicht zwingend eine bestimmte Getreideart.
- source_word: כְּחוֹל הַיָּם
  choice: wie den Sand am Meer
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild einer unermesslichen Menge.
- source_word: הַרְבֵּה מְאֹד
  choice: in sehr großer Menge
  rationale: Die Formulierung gibt sowohl die Mengenangabe als auch die Verstärkung durch מְאֹד natürlich wieder.
- source_word: עַד כִּי
  choice: bis
  rationale: „bis“ bezeichnet den erreichten Endpunkt beziehungsweise die Folge des Anhäufens knapp und idiomatisch.
- source_word: חָדַל לִסְפֹּר
  choice: er aufhörte zu zählen
  rationale: Der Singular wird am natürlichsten auf Josef bezogen; die Formulierung bleibt nah am hebräischen Wortlaut.
- source_word: כִּי אֵין מִסְפָּר
  choice: denn es war nicht mehr zu zählen
  rationale: Diese natürliche deutsche Wiedergabe vermittelt die hebräische Wendung „denn es gab keine Zahl“ als Aussage über eine nicht mehr erfassbare Menge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das doppelte Mengenbild des Hebräischen – Sand am Meer und sehr große Menge – bleibt erhalten; die abschließende hebräische Redewendung wird verständlich wiedergegeben und durch eine Fußnote wörtlich dokumentiert.
