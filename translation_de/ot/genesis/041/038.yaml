  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: de
  text: 'Da sagte der Pharao zu seinen Dienern: „Können wir einen Mann wie diesen finden, in dem Gottes Geist[a] ist?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Geist Gottes“, „der Geist Gottes“ oder „ein göttlicher Geist“. Die hebräische Wendung רוּחַ אֱלֹהִים lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung fort; „Da“ gibt die zeitlich-folgernde Bewegung im heutigen Deutsch natürlich wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Gebräuchliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: Die direkte lexikalische Wiedergabe lässt offen, ob Hofbeamte oder andere königliche Diener gemeint sind.
- source_word: הֲנִמְצָא
  choice: Könnten wir ... finden
  rationale: Die Frage ist rhetorisch und erwägend; der Konjunktiv II klingt im modernen Deutsch natürlich, ohne die Möglichkeit einer Suche zu stark zu behaupten.
- source_word: כָזֶה אִישׁ
  choice: einen Mann wie diesen
  rationale: Bewahrt sowohl das männliche Bezugswort als auch die demonstrative Bezugnahme auf Josef.
- source_word: אֲשֶׁר ... בּוֹ
  choice: in dem ... ist
  rationale: Die relative Formulierung erhält die lokative Aussage des hebräischen בּוֹ („in ihm“).
- source_word: רוּחַ אֱלֹהִים
  choice: Gottes Geist
  rationale: Die deutsche Genitivverbindung bildet die hebräische Constructus-Verbindung knapp ab. Die Schreibung mit großem „Geist“ ist orthografisch regulär und entscheidet nicht zwischen bestimmter, unbestimmter oder qualitativer Deutung; diese Mehrdeutigkeit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Ob רוּחַ אֱלֹהִים den Geist Gottes, einen Geist von Gott oder einen göttlichen Geist bezeichnet
  choice: Gottes Geist
  alternative: ein Geist Gottes; der Geist Gottes; ein göttlicher Geist
  rationale: Die artikellose hebräische Constructus-Verbindung und die Rede aus der Perspektive des Pharaos lassen mehrere Nuancen zu. „Gottes Geist“ ist im Deutschen idiomatisch und quellennah, ohne im Haupttext durch einen Artikel eine Eindeutigkeit zu erzwingen; die möglichen Deutungen bleiben in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Diener“ bleibt bewusst weiter als „Beamte“ oder „Hofleute“. Die rhetorische Frage wird flüssig wiedergegeben, während „in dem ... ist“ die hebräische Struktur wahrt.
