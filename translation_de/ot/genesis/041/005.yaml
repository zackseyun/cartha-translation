base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: de
  text: 'Dann schlief er und träumte ein zweites Mal. Und siehe: Sieben Ähren[a] wuchsen an einem einzigen Halm empor, voll[b] und gut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet die körnertragende Ähre beziehungsweise den Fruchtstand des Getreides.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kräftig“ beziehungsweise „gut gefüllt“. Das hebräische Adjektiv beschreibt hier volle, gut entwickelte Ähren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Dann schlief er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Folge natürlich wieder; „schlief“ bewahrt den einfachen Sinn des Verbs, ohne ein erneutes Einschlafen ausdrücklich in den Text hineinzulesen.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: und träumte ein zweites Mal
  rationale: שֵׁנִית bedeutet adverbial „ein zweites Mal“. Die Formulierung bildet dies genau und idiomatisch ab.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה vergegenwärtigt die Traumszene und lenkt die Aufmerksamkeit auf das nun Erscheinende. „Und siehe“ bewahrt diese Erzählfunktion in würdigem Deutsch.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sieben Ähren
  rationale: שִׁבֳּלִים bezeichnet die körnertragenden Ähren beziehungsweise Fruchtstände des Getreides. „Ähren“ ist im Deutschen die natürliche und präzise Wiedergabe.
- source_word: עֹלֹת
  choice: wuchsen … empor
  rationale: Das Partizip stellt den Vorgang anschaulich als im Verlauf dar. „Wuchsen … empor“ gibt sowohl die aufwärtsgerichtete Bewegung als auch das Wachstum im landwirtschaftlichen Bild wieder.
- source_word: בְּקָנֶה אֶחָד
  choice: an einem einzigen Halm
  rationale: קָנֶה bezeichnet hier den stängelartigen Halm. Die Präposition בְּ wird in diesem Zusammenhang im Deutschen idiomatisch mit „an“ wiedergegeben; „einzigen“ hebt die Zahl אֶחָד hervor.
- source_word: בְּרִיאוֹת
  choice: voll
  rationale: Das Adjektiv bezeichnet bei Getreide einen fetten, kräftigen beziehungsweise gut gefüllten Zustand. „Voll“ ist sachgemäß und natürlich, ohne die für Ähren unpassende wörtliche Wiedergabe „fett“ zu verwenden.
- source_word: וְטֹבוֹת
  choice: und gut
  rationale: טוֹב ist ein breites Werturteil und bedeutet hier „gut“ im Sinn guter Beschaffenheit. Die direkte Wiedergabe lässt diese Bedeutungsbreite bestehen.
