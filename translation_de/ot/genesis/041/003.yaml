  naturalness: „Und siehe“ ist als leicht gehobener Erzählmarker in modernem Standarddeutsch gut möglich. „hässlich anzusehen und dünn am Leib“ ist verständlich und angemessen. „standen neben den Kühen am Ufer des Nils“ ist idiomatisch und zugleich quellennäher als die vorliegende Formulierung.
