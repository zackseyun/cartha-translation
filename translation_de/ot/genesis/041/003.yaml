  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: de
  text: Und siehe, sieben andere Kühe stiegen nach ihnen aus dem Nil[a] herauf, hässlich anzusehen und dünn am Leib[b], und standen neben den Kühen am Ufer des Nils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Fluss“ (יְאֹר); im ägyptischen Zusammenhang ist damit der Nil gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „von schlechtem Aussehen und dünn an Fleisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die lebhafte, aufmerksamkeitslenkende Funktion des hebräischen Erzählmarkers und die Unmittelbarkeit der Traumszene.
- source_word: פָּרוֹת אֲחֵרוֹת
  choice: andere Kühe
  rationale: Die feminine Pluralform bezeichnet weibliche Rinder; „andere“ kennzeichnet die zweite, von der ersten unterschiedene Gruppe.
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: stiegen nach ihnen … herauf
  rationale: Gibt sowohl die Bewegung aus dem Fluss als auch die zeitliche Abfolge natürlich und quellennah wieder.
- source_word: הַיְאֹר
  choice: der Nil
  rationale: יְאֹר bezeichnet im ägyptischen Kontext der Erzählung den Nil; die konkrete Benennung macht den Bezug für heutige Leser unmittelbar verständlich.
- source_word: רָעוֹת מַרְאֶה
  choice: hässlich anzusehen
  rationale: Die Wendung beschreibt das abstoßende äußere Erscheinungsbild, nicht moralische Bosheit.
- source_word: דַקּוֹת בָּשָׂר
  choice: dünn am Leib
  rationale: Bewahrt das körperliche Bild des Hebräischen deutlicher als das allgemeinere „mager“, bleibt aber in modernem Deutsch verständlich.
- source_word: וַתַּעֲמֹדְנָה אֵצֶל
  choice: Sie stellten sich neben
  rationale: Die Form schildert den nächsten Handlungsschritt; „stellten sich“ ist im Deutschen natürlicher und dynamischer als das bloße „standen“.
- source_word: שְׂפַת הַיְאֹר
  choice: Ufer des Nils
  rationale: „Ufer“ ist für die wörtliche „Lippe“ beziehungsweise den Rand eines Flusses die idiomatische deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erhöhter Erzählfärbung durch „Und siehe“. Die konkrete und bildhafte Sprache des Hebräischen bleibt erhalten, ohne unnatürlich archaisch zu wirken.
