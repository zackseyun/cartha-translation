  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: de
  text: 'Er ließ ihn auf dem Wagen zweiten Ranges fahren, den er besaß, und man rief vor ihm her: »Abrek!«[a] So setzte er ihn über das ganze Land Ägypten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Abrek« ist ein schwer verständlicher Ausdruck von unsicherer Bedeutung, möglicherweise ein ägyptischer oder hebräischer Huldigungsruf. Viele verstehen ihn etwa im Sinn von: »Beugt das Knie!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: Er ließ ihn … fahren
  rationale: Der Hifil von רכב drückt Veranlassung aus; die deutsche Konstruktion mit »ließ« gibt diesen kausativen Sinn natürlich wieder.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: auf seinem zweitrangigen Wagen
  rationale: מִשְׁנֶה bezeichnet hier wahrscheinlich den zweiten Rang, also den Wagen unmittelbar nach dem eigenen königlichen Wagen. »Zweitrangig« wahrt diese Rangordnung, ohne bloß eine numerische Reihenfolge zu behaupten.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: und man rief vor ihm her
  rationale: Das unbestimmte Subjekt im Plural lässt sich im Deutschen idiomatisch mit »man« wiedergeben; »vor ihm her« bezeichnet den öffentlichen Ruf vor dem fahrenden Josef.
- source_word: אַבְרֵךְ
  choice: Abrech
  rationale: Das Wort ist etymologisch und semantisch unsicher, möglicherweise ein ägyptischer oder hebräischer Zuruf. Daher bleibt es im Haupttext transliteriert; eine verbreitete Deutung steht in der Fußnote.
- source_word: וְנָתוֹן אֹתוֹ
  choice: So setzte er ihn
  rationale: Die ungewöhnliche Konstruktion mit dem Infinitivus absolutus wird als folgernder Hauptsatz wiedergegeben. »Setzte … über« bewahrt die Einsetzungs- und Vollmachtsvorstellung.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: über das ganze Land Ägypten
  rationale: עַל bezeichnet Josefs Herrschaftsbereich; »Land Ägypten« erhält den territorialen Ausdruck אֶרֶץ.
