  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Und siehe“ erhält die Unmittelbarkeit der Traumszene; ungebräuchlichere oder stärker wörtliche Bedeutungsnuancen werden knapp in Fußnoten erschlossen.
