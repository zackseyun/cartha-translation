id: GEN.41.2
reference: Genesis 41:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: de
  text: Und siehe, aus dem Nil[a] stiegen sieben Kühe herauf, schön anzusehen und wohlgenährt[b], und sie weideten im Riedgras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Strom“; im ägyptischen Zusammenhang ist der Nil gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „kräftig/fett am Fleisch“.'
    reason: literal_rendering
  - marker: c
    text: 'Oder: „zwischen dem Schilf“ beziehungsweise „im Sumpfgras“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt den lebhaften, die Aufmerksamkeit lenkenden Erzählmarker der Traumdarstellung in würdigem, verständlichem Deutsch.
- source_word: הַיְאֹר
  choice: der Nil
  rationale: Im ägyptischen Zusammenhang bezeichnet das hebräische Wort konkret den Nil; die kontextuelle Wiedergabe ist klarer als das bloße „der Strom“.
- source_word: עֹלֹת
  choice: stiegen … herauf
  rationale: Gibt die aufwärts gerichtete Bewegung aus dem Wasser natürlich wieder; der hebräische Partizipialcharakter dient der anschaulichen Szenenschilderung.
- source_word: פָּרוֹת
  choice: Kühe
  rationale: Das Substantiv bezeichnet weibliche Rinder; „Kühe“ ist die direkte und allgemein verständliche Entsprechung.
- source_word: יְפוֹת מַרְאֶה
  choice: schön anzusehen
  rationale: Gibt die angenehme äußere Erscheinung idiomatisch wieder und bleibt nahe an der hebräischen Formulierung.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: wohlgenährt
  rationale: Drückt die körperliche Fülle der Tiere in natürlichem modernem Deutsch aus; die wörtlichere Bildsprache wird in einer Fußnote bewahrt.
- source_word: וַתִּרְעֶינָה
  choice: sie weideten
  rationale: Bezeichnet sachgerecht das Grasen der Kühe und passt zum schildernden Erzählfluss.
- source_word: בָּאָחוּ
  choice: im Riedgras
  rationale: Das Wort bezeichnet sumpfige, schilfartige Vegetation am Nil; „Riedgras“ wahrt diesen konkreten Schauplatz besser als „Wiese“.
theological_decisions: []
