  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und den Sinngehalt zuverlässig wieder: Melchisedek wird als König von Salem vorgestellt, bringt Brot und Wein heraus und wird anschließend als Priester Gottes, des Höchsten, bezeichnet. „brachte … heraus“ entspricht dem Hifil von יצא, ohne den Zweck der Gaben zu interpretieren. Die Genitivkonstruktion „Priester Gottes, des Höchsten“ ist eine angemessene deutsche Wiedergabe von לְאֵל עֶלְיוֹן und wahrt den titulären Charakter der Bezeichnung.'
