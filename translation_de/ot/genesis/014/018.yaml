  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: de
  text: Und Melchisedek, der König von Salem, brachte Brot und Wein heraus. Er war Priester Gottes, des Höchsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: El Eljon, das heißt: „Gott, der Höchste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melchisedek
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben und nicht nach seiner möglichen Bedeutung übersetzt.
- source_word: מֶלֶךְ שָׁלֵם
  choice: der König von Salem
  rationale: Die Apposition wird im Deutschen mit Artikel und der natürlichen Ortsbeziehung „von Salem“ formuliert; Salem bleibt als Ortsname transliteriert.
- source_word: הוֹצִיא
  choice: brachte … heraus
  rationale: Der Hifil von יצא bezeichnet hier das Herausbringen. Die konkrete, idiomatische Wiedergabe vermeidet sowohl eine altertümliche Formulierung als auch eine interpretierende Angabe zum Zweck der Speisen.
- source_word: לֶחֶם וָיָיִן
  choice: Brot und Wein
  rationale: Beide gewöhnlichen Nomen werden direkt wiedergegeben; der Text selbst erklärt ihre Funktion nicht.
- source_word: כֹהֵן
  choice: Priester
  rationale: Die Bezeichnung für einen Kultamtsträger wird mit dem üblichen deutschen Begriff übersetzt, ohne spätere israelitische Amtsstrukturen einzutragen.
- source_word: אֵל עֶלְיוֹן
  choice: Gott, der Höchste
  rationale: Die Gottesbezeichnung wird sinngemäß übersetzt. Im Satz steht wegen des Genitivanschlusses „Gottes, des Höchsten“; so bleiben sowohl „Gott“ als auch der Titel „der Höchste“ erkennbar.
- source_word: וְהוּא
  choice: Er war
  rationale: Die hervorgehobene neue Aussage über Melchisedek wird in natürlichem Deutsch als eigener Satz wiedergegeben.
theological_decisions:
- issue: Mögliche spätere sakramentale Deutung von Brot und Wein
  choice: Die schlichte Erzählung „brachte Brot und Wein heraus“ bleibt ohne sakramentale Erweiterung stehen.
  alternative: Eine Formulierung, die Brot und Wein ausdrücklich als Opfergabe oder eucharistische Vorabbildung deutet.
  rationale: Genesis 14,18 nennt Brot und Wein, erklärt hier aber weder ihre kultische Funktion noch eine spätere typologische Bedeutung. Die Übersetzung wahrt diese Offenheit.
- issue: אֵל עֶלְיוֹן als übersetzter Titel oder unübersetzter Eigenname
  choice: „Gott, der Höchste“
  alternative: „El Eljon“ oder „der höchste Gott“
  rationale: Die Wendung kann als Gottesbezeichnung beziehungsweise Titel verstanden werden. Die Übersetzung macht ihren Sinn zugänglich, während die Fußnote die hebräische Form nennt und die mögliche Namensnähe sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung folgt dem hebräischen Aussagewechsel; die Formulierung bleibt konkret und verzichtet auf spätere theologische Ausdeutung.
