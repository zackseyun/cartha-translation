  source_fidelity: 'Der Text gibt die drei hebräischen Wayyiqtol-Handlungen sachgerecht wieder: Die Angreifer nahmen den gesamten Besitz sowie sämtliche Nahrung von Sodom und Gomorra und gingen fort. Die zweimalige Totalität von כָּל bleibt mit „gesamten“ und „alle“ erhalten. „zogen davon“ ist für וַיֵּלֵכוּ im Kontext idiomatisch, ohne den Vorgang unnötig auszudeuten.'
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen knappem Erzählton. „Den gesamten Besitz von Sodom und Gomorra“ und „zogen davon“ sind flüssig. „Nahrungsmittel“ ist etwas sachsprachlicher als „Nahrung“ oder „Lebensmittel“, aber korrekt und im gegebenen Register gut vertretbar.
  terminology: Die etablierten deutschen Ortsnamen „Sodom und Gomorra“ sind korrekt. „Besitz“ deckt רְכֻשׁ angemessen breit ab. Die Fußnote bewahrt die mögliche, kontextuell naheliegende Lesart von אָכְלָם als „Vorräte“, ohne sie in den Haupttext zu verlagern.
