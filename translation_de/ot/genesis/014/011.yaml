  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: de
  text: Dann nahmen sie den gesamten Besitz von Sodom und Gomorra sowie alle ihre Nahrungsmittel[a] und zogen davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Vorräte“. Das hebräische Wort kann Nahrung allgemein oder mitgeführte beziehungsweise bereitgestellte Vorräte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Dann nahmen sie
  rationale: Das narrative Wayyiqtol von לקח wird direkt mit „nahmen“ wiedergegeben; „Dann“ bildet die Erzählfolge natürlich ab, ohne das militärische Ergreifen stärker auszudeuten.
- source_word: כָּל רְכֻשׁ
  choice: den gesamten Besitz
  rationale: רְכֻשׁ bezeichnet Besitz beziehungsweise bewegliche Güter; „gesamter Besitz“ bewahrt die umfassende Aussage von כָּל und ist im Deutschen klar und idiomatisch.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom und Gomorra
  rationale: Die im modernen Deutschen etablierten Formen der Ortsnamen werden verwendet.
- source_word: וְאֶת כָּל אָכְלָם
  choice: sowie alle ihre Nahrungsmittel[a]
  rationale: אָכְלָם bedeutet wörtlich ihre Nahrung beziehungsweise ihre Lebensmittel. „Nahrungsmittel“ ist verständlich und lässt den Umfang offen; die mögliche Bedeutung „Vorräte“ wird in der Fußnote erhalten.
- source_word: וַיֵּלֵכוּ
  choice: und zogen davon
  rationale: הלך bezeichnet hier den Aufbruch nach der Plünderung. „zogen davon“ ist natürlich, würdig und gibt die Abreise im militärischen Erzählzusammenhang wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte umfassende Aussage („gesamten“, „alle“) und die knappe Abfolge der hebräischen Erzählung bleiben erhalten.
