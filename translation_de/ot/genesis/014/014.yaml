  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: de
  text: Als Abram hörte, dass sein Bruder[a] gefangen genommen worden war, bot er seine ausgebildeten Männer auf[b], die in seinem Haus geboren waren, dreihundertachtzehn an der Zahl, und verfolgte sie bis nach Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Bruder“ kann auch einen nahen männlichen Verwandten bezeichnen; hier ist Lot gemeint, Abrams Neffe.
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende hebräische Verb kann auch im Sinn von „führte hinaus“ oder möglicherweise „bewaffnete“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: gefangen genommen worden war
  rationale: Das Nifal von שׁבה bezeichnet hier die Gefangennahme im Krieg; die deutsche Formulierung gibt diesen Vorgang klar wieder.
- source_word: אָחִיו
  choice: sein Bruder
  rationale: אָח bezeichnet wörtlich den Bruder, kann aber auch einen nahen männlichen Verwandten meinen. Die Übersetzung bewahrt die Ausdrucksweise des Hebräischen; der weitere Sinn wird in einer Fußnote erläutert.
- source_word: וַיָּרֶק
  choice: bot ... auf
  rationale: Das schwierige Verb bezeichnet im Zusammenhang das Mobilisieren oder Herausführen der Männer zur Verfolgung. „bot ... auf“ wahrt den militärischen Zusammenhang, ohne sich eindeutig auf „bewaffnete“ oder „führte hinaus“ festzulegen.
- source_word: חֲנִיכָיו
  choice: seine kampferprobten Männer
  rationale: Das Wort bezeichnet Männer, die unter Abrams Autorität ausgebildet beziehungsweise eingeübt waren. „kampferprobt“ ist im militärischen Kontext natürlich, ohne sie ausdrücklich als Sklaven oder Diener zu bestimmen.
- source_word: יְלִידֵי בֵיתוֹ
  choice: die in seinem Haus geboren waren
  rationale: Die Wendung bezeichnet hausgeborene Angehörige von Abrams Haushalt und wird nah an der hebräischen Form wiedergegeben.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: dreihundertachtzehn
  rationale: Die ausgeschriebene Kardinalzahl entspricht dem hebräischen Text und einem würdigen deutschen Bibelstil.
- source_word: וַיִּרְדֹּף
  choice: Dann verfolgte er sie
  rationale: רדף bezeichnet hier eine militärische Verfolgung. Das im Deutschen ergänzte Objekt „sie“ ergibt sich aus dem Zusammenhang.
- source_word: עַד דָּן
  choice: bis nach Dan
  rationale: עַד bezeichnet die räumliche Grenze der Verfolgung; „bis nach Dan“ ist dafür idiomatisches modernes Deutsch.
theological_decisions:
- issue: Verwandtschaftsbezeichnung für Lot
  choice: „sein Bruder“ im Haupttext
  alternative: „sein Verwandter“
  rationale: Obwohl Lot Abrams Neffe ist, verwendet der hebräische Text אָחִיו. Da אָח auch einen nahen Verwandten bezeichnen kann, wird die konkrete Ausdrucksweise im Haupttext bewahrt und die kontextuelle Bedeutung in der Fußnote erklärt.
- issue: Bedeutung von וַיָּרֶק
  choice: „bot ... auf“
  alternative: „führte ... hinaus“ oder „bewaffnete“
  rationale: Die genaue Nuance des seltenen Verbs ist umstritten. Die gewählte Formulierung hält die militärische Mobilisierung fest, ohne die lexikalische Mehrdeutigkeit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ enger Bindung an die hebräische Satzfolge. Der Doppelpunkt vor der Zahl macht deutlich, dass dreihundertachtzehn die Anzahl der aufgebotenen Männer bezeichnet. Die beiden echten lexikalischen Spannungen werden nicht stillschweigend geglättet, sondern im Haupttext beziehungsweise in den Fußnoten bewahrt.
