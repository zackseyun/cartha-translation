revisions:
- from: Da zog der König von Sodom Abram bis zum Tal Schawe entgegen – das ist das Königstal –, nachdem dieser Kedor-Laomer und die Könige, die mit ihm waren, besiegt hatte und zurückgekehrt war.
  to: Nach Abrams Rückkehr, nachdem er Kedor-Laomer und die Könige, die mit ihm waren, besiegt hatte, zog der König von Sodom aus, um ihm zum Tal Schawe, dem Königstal, entgegenzugehen.
  rationale: Die Revision ersetzt die zu enge Zielangabe „bis zum“ durch „zum“, macht das Hinausziehen des Königs ausdrücklich und ordnet die deutsche Syntax so, dass Abram eindeutig als der Zurückkehrende und Sieger erkennbar ist. Die erklärende Identifikation des Tals bleibt als Apposition erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:23:07Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Beteiligten, die zeitliche Abfolge und die militärische Aussage im Wesentlichen zutreffend wieder. „Bis zum“ ist für אֶל jedoch zu begrenzend; der hebräische Ausdruck bezeichnet das Ziel bzw. die Richtung zum Tal, nicht lediglich ein Herankommen bis an dessen Grenze. Zudem sollte das ausdrücklich vorhandene „hinausgehen“ besser erkennbar bleiben.
  naturalness: Die Satzführung ist grundsätzlich verständlich und modern. Eine Umstellung mit „Nach Abrams Rückkehr“ und „zog ... aus“ macht die zeitliche Beziehung sowie die Bewegungsrichtung im Deutschen klarer und flüssiger.
  terminology: „Sodom“, „Abram“, „Kedor-Laomer“ und „Königstal“ sind hier angemessen. „Die Könige, die mit ihm waren“ bewahrt die sachlich offene hebräische Formulierung. Keine theologisch geprägte Zuspitzung liegt vor.
  issues:
  - severity: low
    issue: „bis zum Tal Schawe“
    rationale: אֶל עֵמֶק שָׁוֵה bezeichnet die Bewegung zum Tal hin. „Bis zu“ kann im Deutschen eine Grenze oder einen Endpunkt nahelegen und ist daher enger als der Ausgangstext.
  - severity: low
    issue: Das Hinausgehen des Königs ist nur indirekt enthalten.
    rationale: „zog ... entgegen“ vermittelt die Begegnungsabsicht, aber וַיֵּצֵא bedeutet ausdrücklich, dass der König hinauszog. „zog ... aus“ bildet dies klarer ab.
  revised_text: Nach Abrams Rückkehr, nachdem er Kedor-Laomer und die Könige, die mit ihm waren, besiegt hatte, zog der König von Sodom aus, um ihm zum Tal Schawe, dem Königstal, entgegenzugehen.
