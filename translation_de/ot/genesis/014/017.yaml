base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: de
  text: Nach Abrams Rückkehr, nachdem er Kedor-Laomer und die Könige, die mit ihm waren, besiegt hatte, zog der König von Sodom aus, um ihm zum Tal Schawe, dem Königstal, entgegenzugehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da zog … entgegen
  rationale: Die Erzählform führt die Handlung weiter. „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder; zusammen mit לִקְרָאתוֹ bezeichnet „zog … entgegen“ das Hinausgehen zum Empfang.
- source_word: מֶלֶךְ סְדֹם
  choice: der König von Sodom
  rationale: Die hebräische Genitivverbindung wird im Deutschen unmittelbar und idiomatisch wiedergegeben.
- source_word: לִקְרָאתוֹ
  choice: Abram … entgegen
  rationale: Die Wendung bedeutet, jemandem zum Zweck der Begegnung entgegenzugehen. Der pronominale Bezug wird nach dem unmittelbaren Kontext mit „Abram“ wiedergegeben, damit die deutsche Satzstruktur nicht fälschlich den König von Sodom als den Zurückkehrenden erscheinen lässt.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: nachdem dieser … zurückgekehrt war
  rationale: Die Vorzeitigkeit von Abrams Rückkehr wird durch das Plusquamperfekt ausgedrückt. „Dieser“ nimmt Abram auf und verhindert eine irreführende Zuordnung zum König von Sodom.
- source_word: מֵהַכּוֹת
  choice: besiegt hatte
  rationale: נכה bezeichnet hier im militärischen Zusammenhang die Niederlage der Gegner; „besiegen“ ist präzise und natürlich, ohne unnötig eine bestimmte Art der Gewalteinwirkung festzulegen.
- source_word: כְּדָרלָעֹמֶר
  choice: Kedor-Laomer
  rationale: Der Personenname wird in einer im Deutschen transparenten, eng am Hebräischen orientierten Form wiedergegeben; der Bindestrich unterstützt die Lesbarkeit.
- source_word: וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: und die Könige, die mit ihm waren
  rationale: Die relative Konstruktion wird formal nah wiedergegeben. Die Formulierung bewahrt die offene Art ihrer Verbindung zu Kedor-Laomer, statt ausdrücklich ein Bündnis zu ergänzen.
- source_word: אֶל־עֵמֶק שָׁוֵה
  choice: bis zum Tal Schawe
  rationale: אֶל hat hier richtungsbezogene Kraft. „Bis zum“ verbindet das Ziel im Deutschen natürlich mit dem Entgegenziehen und vermeidet die bloß statische Angabe „im Tal“.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: das ist das Königstal
  rationale: Die identifizierende Erläuterung wird direkt wiedergegeben und durch Gedankenstriche als erklärender Einschub kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Syntax wurde zur eindeutigen Zuordnung der handelnden Personen behutsam geordnet; die sachliche Offenheit von „die mit ihm waren“ bleibt erhalten. Keine Fußnote ist erforderlich.
