source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: de
  text: 'Ich nehme nichts – außer dem, was die jungen Männer verzehrt haben,[a] und dem Anteil der Männer, die mit mir gezogen sind: Aner, Eschkol und Mamre. Sie sollen ihren Anteil nehmen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was die Diener / Gefolgsleute verzehrt haben“. Das hebräische Wort kann je nach Zusammenhang junge Männer oder Bedienstete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie werden ihren Anteil nehmen.“ Die hebräische Verbform kann auch als einfache Zukunftsaussage verstanden werden; im Zusammenhang liegt eine Einräumung nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Ich nehme nichts – außer
  rationale: Der hebräische Ausnahmeausdruck knüpft an Abrams Verzicht im vorhergehenden Vers an. Das ergänzte „Ich nehme nichts“ ergibt im Deutschen einen vollständigen, natürlichen Satz; „außer“ gibt die durch רַק verstärkte Einschränkung wieder, ohne eine schwerfällige Doppelung zu erzeugen.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: was die jungen Männer verzehrt haben
  rationale: נְעָרִים kann junge Männer oder Diener beziehungsweise Gefolgsleute bezeichnen. „Junge Männer“ bewahrt die lexikalische Offenheit; eine Fußnote nennt die kontextuell mögliche Alternative. „Verzehrt“ passt natürlich zu bereits verbrauchten Vorräten.
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: und dem Anteil der Männer
  rationale: חֵלֶק bezeichnet hier den zustehenden Anteil an der Beute. Der Dativ „dem Anteil“ wird im Deutschen von „außer“ verlangt.
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: die mit mir gezogen sind
  rationale: Die Wendung bewahrt die Bewegungsbedeutung von הלך und klingt im Zusammenhang eines Kriegszugs natürlich.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aner, Eschkol und Mamre
  rationale: Die Personennamen werden in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Sie sollen ihren Anteil nehmen
  rationale: Der hebräische Imperfekt kann hier als Erlaubnis beziehungsweise Einräumung verstanden werden. „Sollen“ lässt zugleich den möglichen futurisch-modal gefärbten Sinn erkennen und wirkt weniger missverständlich als eine bloße Zukunftsaussage.
theological_decisions:
- issue: Unausgesprochene Fortsetzung von Abrams Verzicht aus Vers 23
  choice: Das sinngemäß vorausgesetzte Verb wird als „Ich nehme nichts“ ergänzt.
  alternative: 'Ein abhängiges Satzfragment: „Außer nur dem, was …“'
  rationale: בִּלְעָדַי eröffnet einen Ausnahmeausdruck, der syntaktisch vom vorherigen Vers abhängt. Die Ergänzung macht diesen Zusammenhang in idiomatischem Deutsch deutlich, ohne Abrams Aussage inhaltlich zu erweitern.
- issue: Modalität von יִקְחוּ
  choice: „Sie sollen ihren Anteil nehmen“ als Einräumung des Anteils
  alternative: „Sie werden ihren Anteil nehmen“ als einfache Zukunftsaussage
  rationale: Im Kontext unterscheidet Abram seinen eigenen Verzicht vom Anspruch seiner Verbündeten. Daher liegt eine erlaubende beziehungsweise einräumende Nuance nahe; die alternative Lesart wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert die eng begrenzte Ausnahme von Abrams Verzicht; der Doppelpunkt führt die namentliche Erläuterung der Männer ein. Lexikalische und modale Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern in den Fußnoten transparent bewahrt.
