base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: de
  text: In der Nacht teilte er sich mit seinen Knechten gegen sie auf, schlug sie und verfolgte sie bis nach Hoba, das nördlich von Damaskus liegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Linken von Damaskus“; das bezeichnet hier Norden.'
    reason: Die Fußnote bewahrt die hebräische Richtungsangabe, während der Haupttext ihre geografische Bedeutung idiomatisch wiedergibt.
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: teilten ... sich gegen sie auf
  rationale: Die Formulierung bewahrt das reflexive Verb und den Gedanken eines aufgeteilten nächtlichen Angriffs, ohne taktische Einzelheiten hinzuzufügen.
- source_word: עֲבָדָיו
  choice: seine Knechte
  rationale: „Knechte“ gibt den Status der zu Abrams Haus gehörenden Männer genauer wieder als das moderne, stärker dienstleistungsbezogene „Diener“.
- source_word: וַיַּכֵּם
  choice: schlugen sie
  rationale: Das hebräische נכה bezeichnet hier das Schlagen beziehungsweise Besiegen der Gegner; „schlugen sie“ erhält die knappe Ausdrucksweise und legt nicht fest, dass alle getötet wurden.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: nördlich von Damaskus
  rationale: Wörtlich steht „links von Damaskus“; bei der üblichen Orientierung nach Osten bezeichnet die linke Seite den Norden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählprosa. Die ungewöhnliche Satzstellung „teilten er und seine Knechte sich“ folgt dem hebräischen Singular „er teilte sich“ mit nachgetragenem „er und seine Knechte“, bleibt im Deutschen jedoch verständlich.
