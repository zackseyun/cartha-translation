    issue: „die bei ihm waren“ für אֲשֶׁר אִתּוֹ
    rationale: Die hebräische Präposition bedeutet unmittelbar „mit ihm“. „bei ihm“ ist möglich, kann aber eher räumliche Nähe oder Zugehörigkeit nahelegen. „mit ihm waren“ bewahrt die Formulierung genauer.
  - severity: low
    issue: „Susim“ für הַזּוּזִים
    rationale: Die hebräische Schreibung beginnt mit ז (z). „Zuzim“ bildet die Form transparenter ab und passt zur sonst quellennahen Transliteration der Passage.
