  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: de
  text: Im vierzehnten Jahr kam Kedorlaomer mit den Königen, die mit ihm waren. Sie besiegten die Refaïm[a] in Aschterot-Karnajim, die Zuzim in Ham und die Emim in Schawe-Kirjatajim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Refaïm werden manchmal als »Riesen« bezeichnet; hier steht im Hebräischen der Name einer Volksgruppe.
    reason: lexical_alternative
  - marker: b
    text: Schawe-Kirjatajim kann auch als »die Ebene von Kirjatajim« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: Im vierzehnten Jahr
  rationale: Die Präposition mit der Zeitangabe wird im Deutschen natürlich als temporale Bestimmung wiedergegeben. Das einleitende וּ ist durch den fortlaufenden Erzählzusammenhang hinreichend erkennbar und muss nicht eigens mit „und“ ausgedrückt werden.
- source_word: בָּא
  choice: kam
  rationale: Das Qal von בוא bedeutet grundsätzlich „kommen“. Die militärische Situation rechtfertigt keine engere Wiedergabe wie „marschierte“.
- source_word: כְדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Der Personenname wird möglichst lautnah nach der hebräischen Form transliteriert.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: mit den Königen, die bei ihm waren
  rationale: Die Formulierung bewahrt sowohl die Koordination als auch die Aussage der Zugehörigkeit beziehungsweise Begleitung, ohne das Verhältnis näher als „Verbündete“ auszudeuten.
- source_word: וַיַּכּוּ
  choice: Sie besiegten
  rationale: נכה kann „schlagen“ bedeuten; in dieser Aufzählung militärischer Erfolge gibt „besiegen“ die kontextuelle Bedeutung in gegenwärtigem Deutsch klar wieder.
- source_word: רְפָאִים
  choice: die Refaïm
  rationale: Die Bezeichnung wird als Name einer Volksgruppe transliteriert. Die Schreibung mit Trema macht kenntlich, dass a und i getrennt gesprochen werden.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: in Aschterot-Karnajim
  rationale: Die Präposition bezeichnet hier den Ort; der zusammengesetzte Ortsname wird transliteriert und zur besseren Lesbarkeit mit Bindestrich geschrieben.
- source_word: הַזּוּזִים
  choice: die Susim
  rationale: Der Volksname wird in einer dem Deutschen angepassten Transliteration wiedergegeben; der hebräische Artikel bleibt erhalten.
- source_word: בְּהָם
  choice: in Ham
  rationale: הָם wird im Zusammenhang der geografischen Aufzählung als Ortsname verstanden und transliteriert.
- source_word: הָאֵימִים
  choice: die Emim
  rationale: Der Name der Volksgruppe wird transliteriert und mit dem im Hebräischen vorhandenen Artikel wiedergegeben.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: in Schawe-Kirjatajim
  rationale: Die Wortfolge wird entsprechend den übrigen Ortsangaben als zusammengesetzter Ortsname behandelt. Eine Fußnote hält die mögliche appellativische Deutung von שָׁוֵה als „Ebene“ offen.
theological_decisions:
- issue: Deutung der Refaïm als „Riesen“
  choice: Der Volksname wird als „Refaïm“ beibehalten.
  alternative: „Riesen“
  rationale: Im unmittelbaren Zusammenhang bezeichnet רְפָאִים eine besiegte Volksgruppe. Die Übersetzung „Riesen“ würde eine traditionsgeschichtlich geprägte Deutung in den Haupttext eintragen, die der Satz selbst nicht ausdrücklich festlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge des hebräischen Satzes zu verändern. Personen-, Volks- und Ortsnamen werden deutsch lesbar und zugleich quellennah transliteriert.
