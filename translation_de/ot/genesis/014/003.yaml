id: GEN.14.3
reference: Genesis 14:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל אֵ֨לֶּה֙ חָֽבְר֔וּ אֶל עֵ֖מֶק הַ/שִּׂדִּ֑ים ה֖וּא יָ֥ם הַ/מֶּֽלַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: de
  text: Sie alle schlossen sich im Tal Siddim zusammen – das ist[a] das Salzmeer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach späterer Bezeichnung: das Tote Meer.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Sie alle
  rationale: Die kollektive Wendung wird natürlich mit „sie alle“ wiedergegeben. „Alle diese Könige“ wäre zwar aus dem Zusammenhang verständlich, fügte aber ein im hebräischen Vers nicht vorhandenes Substantiv hinzu.
- source_word: חָבְרוּ
  choice: schlossen sich … zusammen
  rationale: Das Qal von חבר bezeichnet das Sichverbinden oder Zusammenkommen. Die gewählte Formulierung bewahrt den Grundsinn, ohne ausdrücklich ein förmliches Bündnis vorauszusetzen.
- source_word: אֶל
  choice: im
  rationale: Obwohl אֶל häufig eine Richtung bezeichnet, benennt es hier bei einem Verb des Zusammenkommens idiomatisch den Ort der Zusammenkunft.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Tal Siddim
  rationale: עֵמֶק bedeutet gewöhnlich „Tal“; Siddim wird als Ortsname transliteriert. Die deutsche Namensfügung kommt ohne ein ergänztes „von“ aus.
- source_word: הוּא
  choice: das ist
  rationale: Das Pronomen führt eine erklärende Gleichsetzung beziehungsweise geografische Identifizierung ein.
- source_word: יָם הַמֶּלַח
  choice: das Salzmeer
  rationale: Die Wiedergabe folgt unmittelbar der hebräischen Bezeichnung „Salzmeer“, statt im Haupttext den später geläufigen Namen „Totes Meer“ einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich gehalten; der Gedankenstrich kennzeichnet die erklärende geografische Gleichsetzung. Der Fußnotenmarker steht unmittelbar bei „das ist“, entsprechend der gelieferten Referenzfassung.
