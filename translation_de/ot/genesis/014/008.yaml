translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung und die Wiederholung von „der König“ bleiben erhalten; der zweite Satz verhindert eine schwerfällige Satzklammer und macht den militärischen Vorgang klar. Gedankenstriche kennzeichnen die erklärende Gleichsetzung von Bela und Zoar.
