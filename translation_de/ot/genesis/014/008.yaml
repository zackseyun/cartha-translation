  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: de
  text: Da zogen der König von Sodom, der König von Gomorra, der König von Adma, der König von Zebojim und der König von Bela – das ist Zoar – aus. Im Tal Siddim stellten sie sich ihnen zum Kampf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sie stellten mit ihnen eine Schlachtordnung auf.« Das hebräische »mit ihnen« kann im Kampfzusammenhang auch im Sinn von »gegen sie« verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da zogen … aus
  rationale: Das Narrativ-Waw führt die Handlung weiter. Obwohl das hebräische Verb im Singular steht und dem ersten Glied der nachfolgenden Aufzählung entspricht, verlangt das zusammengesetzte Subjekt im natürlichen Deutschen den Plural.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die Wiederholung des Herrschertitels wird entsprechend der feierlich-formalen Struktur des Hebräischen beibehalten.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: Sodom / Gomorra / Adma / Zebojim
  rationale: Gebräuchliche deutsche Formen beziehungsweise lautnahe Wiedergaben der Ortsnamen.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Bela – das ist Zoar –
  rationale: Die hebräische Identifizierung wird als erklärender Einschub wiedergegeben, ohne sie als spätere Umbenennung auszudeuten.
- source_word: וַיַּעַרְכוּ
  choice: stellten sie sich … zum Kampf
  rationale: ערך bezeichnet im militärischen Zusammenhang das Ordnen beziehungsweise Aufstellen zur Schlacht. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt den militärischen Sinn.
- source_word: אִתָּם
  choice: ihnen
  rationale: Das hebräische אֵת mit Suffix bedeutet formal „mit ihnen“; im Kampfzusammenhang bezeichnet es die gegnerische Beziehung. Der deutsche Dativ nach „sich jemandem zum Kampf stellen“ gibt den Kontext idiomatisch wieder, während die Fußnote die formale Ambiguität sichtbar hält.
- source_word: מִלְחָמָה
  choice: zum Kampf
  rationale: In Verbindung mit ערך bezeichnet das Substantiv die bevorstehende militärische Auseinandersetzung; „zum Kampf“ ist präzise und idiomatisch.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: Im Tal Siddim
  rationale: עֵמֶק wird zeitgemäß mit „Tal“ wiedergegeben; Siddim bleibt als Ortsname transliteriert.
