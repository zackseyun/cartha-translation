  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: de
  text: 'dass ich nichts nehmen werde, vom Faden bis zum Sandalenriemen[a], gar nichts von allem, was dir gehört, damit du nicht sagst: »Ich habe Abram reich gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht eine verkürzte Schwurformel, wörtlich etwa: »wenn vom Faden bis zum Sandalenriemen und wenn ich von allem nehme, was dir gehört …« Gemeint ist eine beschworene, vollständige Weigerung.'
    reason: Die Fußnote dokumentiert die formale Ellipse des hebräischen Schwurs und die gegenüber dem Wortlaut verdeutlichende Wiedergabe im Haupttext.
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: dass ich nichts nehmen werde ... überhaupt nichts
  rationale: Im Zusammenhang mit Abrams erhobener Hand in Vers 22 bildet אִם eine verkürzte Schwurformel. Die ausdrückliche Verneinung gibt den gemeinten Schwur im Deutschen verständlich wieder.
- source_word: מִחוּט
  choice: vom Faden
  rationale: חוּט bezeichnet einen Faden oder eine Schnur; »Faden« bewahrt das konkrete Bild eines geringfügigen Gegenstands.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: bis zum Sandalenriemen
  rationale: Die Wiedergabe entspricht der antiken Fußbekleidung und erhält die bildhafte Spannweite der hebräischen Formulierung.
- source_word: אֶקַּח
  choice: ich ... nehmen werde
  rationale: Das Imperfekt bezeichnet im Rahmen des Schwurs Abrams feste Weigerung, etwas anzunehmen.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: überhaupt nichts von allem, was dir gehört
  rationale: Die Formulierung bewahrt sowohl die umfassende Bedeutung von כָּל als auch das Besitzverhältnis und klingt im Deutschen natürlich.
- source_word: וְלֹא תֹאמַר
  choice: damit du nicht sagen kannst
  rationale: Der Satz nennt den beabsichtigten Zweck von Abrams Verzicht. »Sagen kannst« gibt sinngemäß wieder, dass dem König jeder Anlass zu dieser Behauptung genommen werden soll.
- source_word: הֶעֱשַׁרְתִּי
  choice: Ich habe ... reich gemacht
  rationale: Der Hifil-Stamm von עשר bedeutet »reich machen«; das Perfekt passt zur möglichen späteren Behauptung des Königs.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird nach gängiger deutscher Bibelkonvention wiedergegeben.
theological_decisions:
- issue: Verkürzte Schwurformel
  choice: 'Als feierliche, kategorische Weigerung wiedergegeben: »dass ich nichts nehmen werde«'
  alternative: 'Wörtlich-konditional: »wenn vom Faden ... und wenn ich etwas nehme«'
  rationale: Das Hebräische lässt die Selbstverwünschung der Schwurformel unausgesprochen. Der Kontext aus Vers 22 macht deutlich, dass Abram schwört, nichts anzunehmen; die deutsche Fassung macht den Sinn verständlich, ohne eine konkrete Strafandrohung zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung »vom Faden bis zum Sandalenriemen« bleibt erhalten; »überhaupt nichts« verdeutlicht die umfassende Verweigerung. Die direkte Rede verwendet deutsche Anführungszeichen.
