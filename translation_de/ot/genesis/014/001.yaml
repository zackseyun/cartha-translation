lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Erzählform von היה mit vorangestelltem ו führt den zeitlichen Rahmen ein. „Und es geschah“ bewahrt die hebräische Eröffnung und bleibt in gehobenem modernem Deutsch verständlich.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Die Konstruktverbindung bezeichnet die Zeit, in der die genannten Könige herrschten. Die formnahe Wendung ist im Deutschen klar und trägt den feierlichen Erzählton.
- source_word: אַמְרָפֶל
  choice: Amrafel
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: des Königs von Schinar
  rationale: מֶלֶךְ bedeutet „König“; Schinar ist ein Ortsname. Der deutsche Genitiv fügt den Titel als Apposition zu Amrafel.
- source_word: אַרְיוֹךְ
  choice: Arjoch
  rationale: Der Personenname wird in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: des Königs von Ellasar
  rationale: Die hebräische Konstruktverbindung aus Herrschertitel und Ortsname wird direkt wiedergegeben.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Die Transkription folgt dem hebräischen Namen und einer etablierten deutschen Wiedergabe, ohne ihn zu deuten.
- source_word: מֶלֶךְ עֵילָם
  choice: des Königs von Elam
  rationale: Titel und Ortsname werden als klare deutsche Genitivapposition wiedergegeben.
- source_word: וְתִדְעָל
  choice: und Tidals
  rationale: Die Konjunktion wird erhalten; der Genitiv des Namens entspricht der Satzkonstruktion mit „in den Tagen“.
- source_word: מֶלֶךְ גּוֹיִם
  choice: des Königs von Gojim
  rationale: גּוֹיִם bedeutet gewöhnlich „Völker“, kann hier aber parallel zu den übrigen Herrschaftsgebieten als Orts- oder Gebietsbezeichnung fungieren. Die Transkription bewahrt diese Möglichkeit; die gewöhnliche Wortbedeutung steht in der Fußnote.
