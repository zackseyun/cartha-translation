  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: de
  text: 'Und es geschah in den Tagen Amrafels, des Königs von Schinar, Arjochs, des Königs von Ellasar, Kedorlaomers, des Königs von Elam, und Tidals, des Königs von Gojim[a]:'
