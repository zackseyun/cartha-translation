base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: de
  text: 'Und er segnete ihn und sagte: »Gesegnet sei Abram von Gott, dem Höchsten, dem Besitzer[a] von Himmel und Erde[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Schöpfer von Himmel und Erde«. Das hebräische Partizip kann »Besitzer«, »Eigentümer« oder in diesem Zusammenhang »Schöpfer« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Himmeln und der Erde«. Die hebräische Form für »Himmel« ist formal pluralisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: Und er segnete ihn
  rationale: Die Wayyiqtol-Form mit Objektsuffix führt die Erzählung in der Vergangenheit fort; »und« bewahrt den hebräischen Erzählfluss.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die koordinierte finite Verbform wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: בָּרוּךְ
  choice: Gesegnet sei
  rationale: Der prädikative passive Partizipialausdruck gehört zu einer Segensformel; der Konjunktiv »sei« bewahrt deren feierlichen, benediktorischen Charakter.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird an dieser Stelle als »Abram« wiedergegeben, da die Umbenennung in Abraham erst später erfolgt.
- source_word: לְאֵל
  choice: von Gott
  rationale: Das לְ kann in dieser Segensformel Gott als Ursprung des Segens kennzeichnen; »von Gott« gibt diese Beziehung knapp wieder, ohne den Satz unnötig auszudeuten.
- source_word: אֵל עֶלְיוֹן
  choice: Gott, dem Höchsten
  rationale: Die Apposition bewahrt den göttlichen Titel und klingt im Deutschen natürlicher als eine starre Nachbildung der hebräischen Wortfolge.
- source_word: קֹנֵה
  choice: Besitzer
  rationale: Das Partizip von קנה kann besitzen, erwerben oder kontextabhängig erschaffen bezeichnen. »Besitzer« hält im Haupttext den Besitzaspekt fest; die mögliche Bedeutung »Schöpfer« wird in einer Fußnote bewahrt.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste deutsche Wortverbindung gibt den Merismus für die Gesamtheit der Welt natürlich und würdig wieder.
theological_decisions:
- issue: Bedeutung von קֹנֵה im Gottestitel
  choice: dem Besitzer von Himmel und Erde
  alternative: dem Schöpfer von Himmel und Erde
  rationale: קנה lässt hier sowohl eine Deutung als »besitzen« als auch, besonders im Zusammenhang mit Himmel und Erde, als »erschaffen« zu. Der Haupttext entscheidet die theologische Spannung nicht stillschweigend; die verbreitete Schöpfer-Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die wiederholte Apposition »Gott, dem Höchsten, dem Besitzer …« bildet den hebräischen Gottestitel transparent ab. Beide Fußnotenmarker stehen unmittelbar nach der Wendung, auf die sich die jeweiligen lexikalischen Alternativen beziehen.
