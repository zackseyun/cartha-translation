  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: de
  text: Er brachte den gesamten Besitz zurück; auch Lot, seinen Verwandten[a], und dessen Besitz brachte er zurück, ebenso die Frauen und das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „seinen Bruder“. Das hebräische Wort kann auch einen nahen männlichen Verwandten bezeichnen; Lot ist nach dem Erzählzusammenhang Abrams Neffe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: brachte … zurück
  rationale: Beide Formen gehören zum Hifil von שׁוב und bezeichnen hier das Zurückbringen der erbeuteten Güter und gefangenen Menschen. Die Wiederholung des Verbs wird wie im Hebräischen beibehalten.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: den gesamten Besitz / dessen Besitz
  rationale: רְכוּשׁ bezeichnet Habe, Güter oder Besitz. „Besitz“ ist umfassend, natürlich und an beiden Stellen konsistent; „dessen“ macht im Deutschen eindeutig, dass der zweite Besitz Lot gehört.
- source_word: וְגַם
  choice: auch / ebenso
  rationale: Die zweimalige additive Hervorhebung wird erhalten. Die Variation „auch … ebenso“ gibt den Sinn in natürlichem Deutsch wieder, ohne die Aufzählung unnötig schwerfällig zu machen.
- source_word: לוֹט אָחִיו
  choice: Lot, seinen Bruder
  rationale: אָחִיו bedeutet wörtlich „seinen Bruder“, kann im Hebräischen aber auch einen weiteren männlichen Verwandten bezeichnen. Die formnahe Wiedergabe bewahrt diese Ausdrucksweise; eine Fußnote erläutert die Beziehung im Erzählzusammenhang.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: נָשִׁים bezeichnet allgemein Frauen und darf hier nicht ohne zwingenden Kontext auf Ehefrauen verengt werden.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet die betroffene Bevölkerung beziehungsweise Personengruppe insgesamt. „Das Volk“ wahrt die kollektive und geschlechtsübergreifende Bedeutung.
