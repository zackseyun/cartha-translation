  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: de
  text: Zwölf Jahre lang hatten sie Kedorlaomer gedient, doch im dreizehnten Jahr lehnten sie sich gegen ihn auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Zwölf Jahre lang
  rationale: Die hebräische Zeitangabe bezeichnet eine Dauer. „Zwölf Jahre lang“ gibt sie im Deutschen natürlich und präzise wieder.
- source_word: עָבְדוּ
  choice: hatten sie … gedient
  rationale: עבד bezeichnet hier den politischen Dienst beziehungsweise die Unterordnung tributpflichtiger Vasallen. „Dienen“ bewahrt die Grundbedeutung; das Plusquamperfekt verdeutlicht das vorausgehende Verhältnis vor dem Aufstand.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Kedor-Laomer
  rationale: Der Personenname wird aus dem Hebräischen transliteriert. Der Bindestrich macht die Namensglieder für deutschsprachige Leser gut erkennbar.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: doch im dreizehnten Jahr
  rationale: Wörtlich steht eine mit „und“ angeschlossene Jahresangabe. Im Zusammenhang bezeichnet sie das dreizehnte Jahr der Herrschaft und leitet den Gegensatz zum vorherigen Dienst ein; „doch“ bildet diese narrative Wendung natürlich ab.
- source_word: מָרָדוּ
  choice: lehnten sie sich gegen ihn auf
  rationale: מרד bedeutet „rebellieren, sich auflehnen“. Die deutsche Wendung ist klar und bringt den politischen Widerstand gegen den zuvor genannten Oberherrn zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe historische Erzählweise des Hebräischen bleibt erhalten; das ergänzte „gegen ihn“ macht den im Deutschen naheliegenden Bezug auf Kedor-Laomer ausdrücklich, ohne neue Sachinformation einzuführen.
