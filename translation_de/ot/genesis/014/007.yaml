  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: de
  text: Dann kehrten sie um und kamen nach En-Mischpat[a], das ist Kadesch, und schlugen das ganze Gebiet der Amalekiter[b] sowie die Amoriter, die in Hazezon-Tamar[c] wohnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Mischpat bedeutet »Quelle des Rechts« oder »Quelle des Gerichts«.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »das ganze Feld des Amalekiters«; gemeint ist wahrscheinlich das von den Amalekitern bewohnte Land.'
    reason: lexical_alternative
  - marker: c
    text: Hazezon-Tamar wird in 2. Chronik 20,2 mit En-Gedi gleichgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Dann kehrten sie um
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; שוב bezeichnet hier angesichts der Marschroute eine Umkehr.
- source_word: וַיָּבֹאוּ אֶל
  choice: und kamen nach
  rationale: בוא mit אֶל bezeichnet das Gelangen zu einem Ort; bei Ortsnamen ist „nach“ im Deutschen idiomatisch.
- source_word: עֵין מִשְׁפָּט
  choice: En-Mischpat
  rationale: Der Ausdruck fungiert als Ortsname und wird daher transliteriert; seine wörtliche Bedeutung wird in einer Fußnote erläutert.
- source_word: הִוא קָדֵשׁ
  choice: das ist Kadesch
  rationale: Die Formulierung identifiziert En-Mischpat ausdrücklich mit Kadesch, ohne das Verhältnis darüber hinaus zu erklären.
- source_word: וַיַּכּוּ
  choice: und schlugen
  rationale: נכה kann schlagen, angreifen oder besiegen bedeuten. „schlugen“ bleibt nah am Hebräischen und legt den Ausgang nicht genauer fest als der Text.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: das ganze Gebiet der Amalekiter
  rationale: שׂדה bedeutet wörtlich „Feld“, bezeichnet hier aber wahrscheinlich das von der Volksgruppe bewohnte Land beziehungsweise Gebiet. Der singularische Gentilname wird kollektiv pluralisch wiedergegeben.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: sowie die Amoriter
  rationale: „sowie“ gibt die additive Verbindung וְגַם natürlich wieder; der singularische Gentilname hat kollektive Bedeutung.
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: die in Hazezon-Tamar wohnten
  rationale: Das Partizip bezeichnet die Amoriter als dort ansässige Bevölkerung; die Vergangenheitsform fügt sich natürlich in die Erzählung ein.
theological_decisions: []
