source:
  edition: WLC
  text: וְ/אֶת הַ/חֹרִ֖י בְּ/הַרְרָ֣/ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל הַ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: de
  text: und die Horiter in ihrem Bergland Seïr bis nach El-Paran[a], das an der Wüste liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »El Paran«; möglicherweise »Eiche von Paran« oder »Terebinthe von Paran«, wenn der Name etymologisch und nicht als fester Ortsname verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: und die
  rationale: Die Konjunktion mit dem Akkusativzeichen setzt die Reihe der besiegten Völker aus dem vorherigen Vers fort; das Verb bleibt wie im Hebräischen aus dem Kontext ergänzt.
- source_word: הַחֹרִי
  choice: die Horiter
  rationale: Die Form bezeichnet kollektiv das als Horiter bekannte Volk; die im Deutschen gebräuchliche Namensform wahrt den erzählerischen Stil.
- source_word: בְּהַרְרָם
  choice: in ihrem Bergland
  rationale: Der Plural »ihre Berge« bezeichnet hier idiomatisch das von ihnen bewohnte Gebirgsgebiet; »Bergland« gibt diesen regionalen Sinn natürlich wieder.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Der Ortsname steht in enger Beziehung zu »ihrem Bergland«; die deutsche Form mit Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: עַד
  choice: bis nach
  rationale: Die Präposition bezeichnet die räumliche Ausdehnung des Feldzugs bis zu einem benannten Ort.
- source_word: אֵיל פָּארָן
  choice: El-Paran
  rationale: Die Wiedergabe als zusammengesetzter Ortsname vermeidet, אֵיל im Haupttext vorschnell etymologisch als Baumbezeichnung auszulegen.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: das am Rand der Wüste liegt
  rationale: Die Formulierung gibt die räumliche Lagebeziehung von עַל idiomatisch und geografisch verständlich wieder, ohne eine Lage mitten in der Wüste zu behaupten.
