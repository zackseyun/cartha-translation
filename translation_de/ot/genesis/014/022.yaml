source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: de
  text: 'Abram aber sagte zum König von Sodom: »Ich habe meine Hand zu Jahwe, dem höchsten Gott, dem Besitzer von Himmel und Erde[b], erhoben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Erheben der Hand war eine Schwurgeste; Abram leistet hier einen Eid.
    reason: cultural_note
  - marker: b
    text: 'Oder: »dem Schöpfer von Himmel und Erde«. Das hebräische Wort kann hier »Besitzer« beziehungsweise »Eigentümer«, möglicherweise aber auch »Schöpfer« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: aber sagte
  rationale: Das Waw führt die Erzählung fort; »aber« gibt hier zugleich den Gegensatz zwischen dem Angebot des Königs und Abrams Antwort natürlich wieder.
- source_word: הֲרִימֹתִי יָדִי
  choice: Ich habe meine Hand … erhoben
  rationale: Die konkrete hebräische Wendung und ihre Perfektform bleiben erhalten; die Bedeutung als Schwurgeste wird in einer Fußnote erklärt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in seiner im Deutschen etablierten Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵל עֶלְיוֹן
  choice: der höchste Gott
  rationale: Dies ist eine natürliche und genaue deutsche Wiedergabe des Gottesprädikats; die Apposition bezieht sich auf Jahwe.
- source_word: קֹנֵה
  choice: Besitzer
  rationale: Das Partizip von קנה kann Besitz beziehungsweise Eigentum ausdrücken, lässt in diesem Kontext aber auch die Deutung »Schöpfer« zu. Der Haupttext bewahrt die primäre Besitzbedeutung, die Fußnote die wichtige Alternative.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste deutsche Wortverbindung gibt den Merismus für die gesamte geschaffene Welt angemessen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Wiedergabe als »Jahwe« bewahrt diesen Unterschied gegenüber einem bloßen Hoheitstitel.
- issue: Bedeutung von קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: Besitzer von Himmel und Erde
  alternative: Schöpfer von Himmel und Erde
  rationale: Das hebräische קֹנֵה umfasst einen Bedeutungsbereich von Erwerben und Besitzen und kann hier auch schöpferisches Hervorbringen bezeichnen. Die Übersetzung entscheidet diese Spannung nicht stillschweigend, sondern nennt die alternative Deutung in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält die Schwurformel verständlich zusammen; die konkreten Bilder und die lexikalische Mehrdeutigkeit des Hebräischen bleiben erhalten.
