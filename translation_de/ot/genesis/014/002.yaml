source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: de
  text: Sie führten Krieg gegen Bera, den König von Sodom, Birscha, den König von Gomorra, Schinab, den König von Adma, Schemeber, den König von Zebojim, und den König von Bela, das ist Zoar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: Sie führten Krieg
  rationale: Die hebräische Wendung bedeutet wörtlich »Krieg machen«. »Krieg führen« ist die natürliche, gehobene deutsche Entsprechung und bewahrt den handlungsbezogenen Sinn.
- source_word: אֶת ... וְאֶת
  choice: gegen
  rationale: Die Objektmarkierung bezeichnet hier die Gegner, gegen die Krieg geführt wurde. Ein einmaliges »gegen« regiert im Deutschen klar die gesamte folgende Aufzählung.
- source_word: בֶּרַע
  choice: Bera
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ סְדֹם
  choice: den König von Sodom
  rationale: Die hebräische Status-constructus-Verbindung wird natürlich als Titel mit Ortsangabe wiedergegeben.
- source_word: בִּרְשַׁע
  choice: Birscha
  rationale: Der Personenname wird nach deutscher biblischer Schreibtradition transliteriert.
- source_word: עֲמֹרָה
  choice: Gomorra
  rationale: Verwendet wird die etablierte deutsche Form des Ortsnamens.
- source_word: שִׁנְאָב
  choice: Schinab
  rationale: Der Personenname wird lautnah und gemäß deutscher Schreibkonvention transliteriert.
- source_word: אַדְמָה
  choice: Adma
  rationale: Der Ortsname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: שֶׁמְאֵבֶר
  choice: Schemeber
  rationale: Der Personenname wird lautnah und gemäß deutscher Schreibkonvention transliteriert.
- source_word: צביים
  choice: Zebojim
  rationale: »Zebojim« ist eine verbreitete deutsche biblische Wiedergabe und bildet die hebräische Lautgestalt angemessen ab.
- source_word: מֶלֶךְ בֶּלַע
  choice: den König von Bela
  rationale: Anders als bei den vorherigen Gliedern nennt der hebräische Text hier keinen Personennamen, sondern nur den Herrscher der Stadt; diese Unbestimmtheit bleibt erhalten.
- source_word: הִיא צֹעַר
  choice: das ist Zoar
  rationale: Das Pronomen mit dem Ortsnamen identifiziert Bela erklärend mit Zoar. Die knappe deutsche Formel bewahrt diese Funktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fünf gegnerischen Könige werden als eine parallele, von »gegen« abhängige Aufzählung wiedergegeben. Die Appositionen mit wiederholtem Artikel machen die jeweiligen Titel eindeutig, ohne die hebräische Liste unnötig auszubauen.
