id: GEN.14.20
reference: Genesis 14:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: de
  text: Und gepriesen sei Gott, der Höchste, der deine Feinde in deine Hand ausgeliefert hat! Und er gab ihm den zehnten Teil von allem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische nennt das Subjekt von „gab“ nicht erneut. Dem Zusammenhang nach gab Abram Melchisedek den zehnten Teil von allem. Traditionell wird „den zehnten Teil“ auch mit „den Zehnten“ wiedergegeben.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Und gepriesen sei
  rationale: Die passive Partizipialform steht in einer Segensformel. Der deutsche Jussiv „gepriesen sei“ gibt den feierlichen Segensspruch natürlich wieder; „und“ bewahrt die Verknüpfung.
- source_word: אֵל עֶלְיוֹן
  choice: Gott, der Höchste
  rationale: אֵל bezeichnet hier Gott, עֶלְיוֹן ist der Hoheitstitel „der Höchste“. Die Apposition ist im modernen Deutschen klar und würdevoll.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen leitet den Gott näher bestimmenden Satz ein.
- source_word: מִגֵּן
  choice: ausgeliefert hat
  rationale: Das Verb bedeutet hier im militärischen Zusammenhang „übergeben/ausliefern“, nicht „beschirmen“. „In deine Hand ausgeliefert“ bewahrt zugleich die hebräische Bildsprache.
- source_word: צָרֶיךָ
  choice: deine Feinde
  rationale: Die Form bezeichnet die feindlichen Gegner Abrams; „Feinde“ ist die klare und geläufige Entsprechung.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die Wendung bezeichnet die Übergabe in jemandes Gewalt. Die konkrete hebräische Redeweise ist auch auf Deutsch verständlich.
- source_word: וַיִּתֶּן
  choice: Und er gab
  rationale: Die narrative Verbform führt die Handlung fort. Da das Hebräische das Subjekt nicht ausdrücklich wiederholt, bleibt auch die Übersetzung pronominal.
- source_word: לוֹ
  choice: ihm
  rationale: Das indirekte Objekt bezieht sich im Kontext am natürlichsten auf Melchisedek.
- source_word: מַעֲשֵׂר
  choice: den zehnten Teil
  rationale: Das Wort bezeichnet wörtlich einen Zehntelanteil. Diese Wiedergabe ist transparent und vermeidet, dem Vers spätere institutionelle Vorstellungen aufzuerlegen.
- source_word: מִכֹּל
  choice: von allem
  rationale: Die Präposition mit כֹּל bezeichnet die Gesamtheit, aus der der Zehntelanteil gegeben wurde.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von וַיִּתֶּן
  choice: Die Übersetzung wahrt mit „er“ die grammatische Unbestimmtheit; im Kontext ist Abram als Geber und Melchisedek als Empfänger am wahrscheinlichsten.
  alternative: Melchisedek könnte rein grammatisch als Subjekt verstanden werden.
  rationale: Der unmittelbare Erzählzusammenhang und die spätere Aufnahme in Hebräer 7 sprechen deutlich für Abram als Geber. Da der hebräische Satz das Subjekt jedoch nicht erneut nennt, wird es im Haupttext nicht durch „Abram“ ersetzt; die Fußnote erläutert die verbleibende formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Segensformel bleibt feierlich, die Bildrede „in deine Hand“ wird bewahrt. Die genuine grammatische Mehrdeutigkeit beim Subjekt von „gab“ wird im Haupttext nicht aufgelöst und in der Fußnote erläutert.
