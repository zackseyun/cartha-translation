base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: de
  text: Da kam ein Entkommener und berichtete Abram davon. Abram wohnte damals bei den Eichen Mamres[a], des Amoriters, der ein Bruder Eschkols und ein Bruder Aners war[b]. Sie waren mit Abram verbündet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei den Terebinthen Mamres“. Das hebräische Wort kann große Bäume bezeichnen, die häufig als Eichen oder Terebinthen bestimmt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der ein Verwandter Eschkols und ein Verwandter Aners war“. Das hebräische Wort für „Bruder“ kann auch einen entfernteren Verwandten bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sie waren Besitzer eines Bundes mit Abram“, das heißt, sie waren durch einen Vertrag mit ihm verbunden.'
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: ein Entkommener
  rationale: Das Substantiv bezeichnet jemanden, der einer Gefahr oder Schlacht entkommen ist. „Ein Entkommener“ bewahrt diesen Vorgang deutlicher als „ein Überlebender“ und klingt im Deutschen weniger kriminalisierend als „ein Flüchtling“.
- source_word: וַיַּגֵּד
  choice: berichtete es
  rationale: Das Verb bedeutet „mitteilen, berichten“. Das im Deutschen idiomatische „es“ nimmt den aus dem Zusammenhang erschließbaren Bericht über das Geschehen auf.
- source_word: הָעִבְרִי
  choice: dem Hebräer
  rationale: Die übliche ethnische beziehungsweise soziale Bezeichnung Abrams wird direkt und ohne nähere Deutung wiedergegeben.
- source_word: שֹׁכֵן
  choice: wohnte damals
  rationale: Das Partizip beschreibt Abrams andauernden Aufenthaltszustand zu jener Zeit. „Wohnte damals“ gibt diesen durativen und zeitlichen Sinn natürlich wieder.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: bei den Eichen Mamres
  rationale: אֵלֹנֵי bezeichnet große Bäume und wird häufig als „Eichen“ oder „Terebinthen“ verstanden. Die vertraute Wiedergabe „Eichen“ steht im Text; die botanische Alternative bleibt in der Fußnote erhalten.
- source_word: הָאֱמֹרִי
  choice: des Amoriters
  rationale: Die ethnische Bezeichnung bestimmt Mamre appositionell näher und wird in einer natürlichen deutschen Genitivfügung wiedergegeben.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: der ein Bruder Eschkols und Aners war
  rationale: אָח bedeutet grundsätzlich „Bruder“, kann aber auch einen weiteren Verwandten bezeichnen. Der Haupttext wahrt die Grundbedeutung, während die mögliche weitere Verwandtschaft in der Fußnote genannt wird.
- source_word: בַּעֲלֵי בְרִית אַבְרָם
  choice: Sie waren mit Abram verbündet
  rationale: Die wörtliche Wendung „Herren/Besitzer eines Bundes mit Abram“ bezeichnet Männer, die durch einen Bund beziehungsweise Vertrag an Abram gebunden waren. „Mit Abram verbündet“ vermittelt diese politische Bundesbeziehung klar und idiomatisch.
