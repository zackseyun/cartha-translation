source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: de
  text: Kedor-Laomer, der König von Elam, Tidal, der König von Gojim,[a] Amrafel, der König von Schinar, und Arjoch, der König von Ellasar – vier Könige gegen die fünf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tidal, der König der Völker«. Das hebräische Wort גּוֹיִם (gojim) bedeutet gewöhnlich »Völker«, kann hier aber auch als Orts- oder Gebietsname verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: gegen
  rationale: Im Zusammenhang der Schlacht bezeichnet die Konstruktion die gegnerischen Parteien. Das Deutsche benötigt hier eine ausdrückliche Verhältnisangabe; »gegen« gibt den Sinn knapp und natürlich wieder.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedor-Laomer
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; der Bindestrich macht seine Bestandteile lesbar.
- source_word: מֶלֶךְ עֵילָם
  choice: der König von Elam
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich mit »König von« wiedergegeben.
- source_word: תִדְעָל
  choice: Tidal
  rationale: Der Personenname wird transliteriert.
- source_word: גּוֹיִם
  choice: Gojim
  rationale: In der Königsbezeichnung ist wahrscheinlich ein Orts- oder Gebietsname gemeint. Die Transliteration bewahrt diese Möglichkeit, ohne die ebenfalls mögliche Bedeutung »Völker« zu verdecken; diese steht in der Fußnote.
- source_word: אַמְרָפֶל
  choice: Amrafel
  rationale: Der Personenname wird in geläufiger deutscher Form wiedergegeben.
- source_word: שִׁנְעָר
  choice: Schinar
  rationale: Der hebräische Ortsname bleibt erhalten und wird nicht durch eine historische Gleichsetzung wie »Babylonien« ersetzt.
- source_word: אַרְיוֹךְ
  choice: Arjoch
  rationale: Der Personenname wird in geläufiger deutscher Form transliteriert.
- source_word: אֶלָּסָר
  choice: Ellasar
  rationale: Der Ortsname wird transliteriert, ohne eine unsichere geografische Identifizierung einzutragen.
- source_word: אַרְבָּעָה מְלָכִים
  choice: vier Könige
  rationale: Die Zahlwort-Nomen-Verbindung wird direkt wiedergegeben.
- source_word: הַחֲמִשָּׁה
  choice: die fünf
  rationale: Im Hebräischen steht wörtlich »die fünf«; »Könige« ist aus dem unmittelbaren Zusammenhang zu ergänzen. Die knappe Form ist auch auf Deutsch verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Apposition »der König von« hält die Aufzählung klar und folgt der Struktur des Hebräischen. Der Gedankenstrich hebt die abschließende Zusammenfassung der beiden Parteien hervor.
