  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: de
  text: Sie nahmen Lot[a], Abrams Neffen, und seinen Besitz mit und zogen davon. Er wohnte in Sodom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn von Abrams Bruder“.'
