lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Sie nahmen … mit
  rationale: Das Qal-Wayyiqtol von לקח bedeutet gewöhnlich „nehmen“. Im Zusammenhang mit einem Gefangenen und geraubtem Besitz gibt „mitnehmen“ den Vorgang im Deutschen natürlich wieder, ohne die stärkere Bedeutung „ergreifen“ oder „verschleppen“ in das Verb hineinzulesen.
- source_word: רְכֻשׁוֹ
  choice: seinen Besitz
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise Habe, besonders bewegliches Eigentum. „Besitz“ ist im heutigen Deutsch klar und passt zum Zusammenhang der Kriegsbeute.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: Abrams Neffen
  rationale: Wörtlich steht „Sohn von Abrams Bruder“. „Abrams Neffe“ gibt die Verwandtschaftsbeziehung natürlich und eindeutig wieder; die wörtliche Ausdrucksweise bleibt in der Fußnote erhalten.
- source_word: וַיֵּלֵכוּ
  choice: und zogen davon
  rationale: הלך bedeutet grundsätzlich „gehen“. Nach der Mitnahme Lots und seines Besitzes bringt „zogen davon“ das Verlassen des Ortes idiomatisch zum Ausdruck, ohne zusätzliche Zielangabe.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Er wohnte zu dieser Zeit in Sodom
  rationale: Das Partizip יֹשֵׁב bezeichnet hier Lots andauernden Wohnaufenthalt. Die Formulierung gibt die erläuternde Hintergrundinformation natürlich wieder, ohne sie ausdrücklich kausal als „denn“ festzulegen.
