  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: de
  text: Das Siddimtal war voller Bitumengruben[a]. Die Könige von Sodom und Gomorra flohen und fielen dort[b]; die Übrigen aber flohen ins Bergland[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Asphaltgruben“ beziehungsweise „Erdpechgruben“; das hebräische Wort bezeichnet Gruben mit Bitumen.'
    reason: lexical_alternative
  - marker: b
    text: Möglicherweise fielen sie dort im Siddimtal in die Bitumengruben. Der hebräische Text nennt die Gruben hier jedoch nicht ausdrücklich als Ziel ihres Fallens.
    reason: ambiguity_preservation
  - marker: c
    text: 'Oder: „in die Berge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: das Siddimtal
  rationale: Die deutsche Zusammensetzung gibt die als Ortsname verwendete Verbindung natürlich und knapp wieder.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: war voller Bitumengruben
  rationale: Die Wiederholung von בֶּאֱרֹת bezeichnet eine große Zahl von Gruben; „voller“ gibt dies idiomatisch wieder. חֵמָר ist präzise mit „Bitumen“ bezeichnet.
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: Gängige und kontextgerechte Wiedergabe von נוס in einer Erzählung.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: die Könige von Sodom und Gomorra
  rationale: Obwohl מֶלֶךְ formal im Singular steht, zeigen die beiden Städtenamen, die Pluralverben und der Kontext, dass die jeweiligen Könige beider Städte gemeint sind.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: fielen dort
  rationale: Die knappe Wiedergabe wahrt die Mehrdeutigkeit des Hebräischen und ergänzt nicht ausdrücklich, dass sie in die Gruben fielen.
- source_word: וְהַנִּשְׁאָרִים
  choice: die Übrigen
  rationale: Natürliche Wiedergabe derer, die nach dem Fall der anderen noch übrig waren; „Überlebenden“ wäre stärker ausdeutend.
- source_word: הֶרָה
  choice: ins Bergland
  rationale: Gibt הַר mit der Richtungsendung idiomatisch wieder; je nach geografischer Auffassung ist auch „in die Berge“ möglich.
- source_word: נָסוּ
  choice: flohen
  rationale: Die Wiederholung desselben deutschen Verbs entspricht der Wiederholung der hebräischen Wurzel נוס.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewohnte Formulierung „fielen dort“ wurde bewusst beibehalten, um die knappe und nicht vollständig ausgedeutete Aussage des Hebräischen nicht durch „fielen in die Gruben“ oder „wurden dort besiegt“ festzulegen.
