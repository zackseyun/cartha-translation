base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: de
  text: 'Da sagte der König von Sodom zu Abram: »Gib mir die Menschen[a], und nimm den Besitz für dich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Seele« (Einzahl); hier kollektiv für die zurückgewonnenen Menschen beziehungsweise Personen gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: מֶלֶךְ סְדֹם
  choice: der König von Sodom
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen unmittelbar und idiomatisch wiedergegeben.
- source_word: אֶל אַבְרָם
  choice: zu Abram
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten; »Abram« ist die im Deutschen übliche Namensform.
- source_word: תֶּן לִי
  choice: Gib mir
  rationale: Der Imperativ mit pronominalem Ausdruck wird knapp und idiomatisch wiedergegeben.
- source_word: הַנֶּפֶשׁ
  choice: die Menschen
  rationale: נֶפֶשׁ steht grammatisch im Singular, bezeichnet hier aber kollektiv die zurückgewonnenen Personen. »Die Menschen« ist verständlich und bewahrt den Gegensatz zum Besitz.
- source_word: וְהָרְכֻשׁ
  choice: und den Besitz
  rationale: רְכוּשׁ bezeichnet Habe, Güter oder Besitz, besonders bewegliches Eigentum. »Besitz« ist im Kontext natürlich und umfassend.
- source_word: קַח לָךְ
  choice: kannst du für dich nehmen
  rationale: Der Imperativ קַח mit לָךְ erlaubt Abram, den Besitz zu seinem eigenen Nutzen zu nehmen. Die deutsche Formulierung gibt diese freigebende Aufforderung natürlich wieder, ohne ein zusätzliches Objekt einzuführen.
theological_decisions: []
translation_notes:
