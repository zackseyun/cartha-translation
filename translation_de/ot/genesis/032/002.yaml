  text: וְ/יַעֲקֹ֖ב הָלַ֣ךְ לְ/דַרְכּ֑/וֹ וַ/יִּפְגְּעוּ ב֖/וֹ מַלְאֲכֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: de
  text: Und Jakob zog seines Weges weiter, da begegneten ihm Engel Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Boten Gottes“. Das hebräische Wort kann sowohl Boten als auch Engel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲקֹב
  choice: Und Jakob
  rationale: Die Konjunktion וְ führt die Erzählung schlicht fort; „Und“ bewahrt diesen Anschluss, ohne einen stärkeren Diskurswechsel einzutragen.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: zog seines Weges weiter
  rationale: Die Wendung bezeichnet idiomatisch die Fortsetzung von Jakobs Reise. „Zog … weiter“ klingt im Deutschen natürlich und würdevoll; „seines Weges“ bewahrt das Bild des hebräischen דֶּרֶךְ.
- source_word: וַיִּפְגְּעוּ בוֹ
  choice: da begegneten ihm
  rationale: פגע mit ב bezeichnet hier ein Zusammentreffen. „Begegneten ihm“ lässt offen, ob die Begegnung unerwartet war, und trägt weder Feindseligkeit noch Zufälligkeit unnötig ein.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: Engel Gottes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Der folgende Hinweis auf Gottes Lager stützt hier die Wiedergabe als himmlische Wesen; die deutsche Genitivverbindung bildet den hebräischen Status constructus transparent ab.
theological_decisions:
- issue: Referenz von מַלְאֲכֵי אֱלֹהִים
  choice: Engel Gottes
  alternative: Boten Gottes
  rationale: Der unmittelbare Kontext, besonders Jakobs Bezeichnung des Ortes als „Gottes Lager“ im folgenden Vers, spricht für himmlische Wesen. Die lexikalisch mögliche Bedeutung „Boten“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit leicht gehobenem Erzählton. Die Inversion „da begegneten ihm“ gibt den Fortgang der hebräischen Erzählung natürlich wieder; auf eine unnötig altertümliche Satzgestaltung wurde verzichtet.
