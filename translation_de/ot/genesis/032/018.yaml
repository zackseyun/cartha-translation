  text: וַ/יְצַ֥ו אֶת הָ/רִאשׁ֖וֹן לֵ/אמֹ֑ר כִּ֣י יִֽפְגָּשְׁ/ךָ֞ עֵשָׂ֣ו אָחִ֗/י וִ/שְׁאֵֽלְ/ךָ֙ לֵ/אמֹ֔ר לְ/מִי אַ֨תָּה֙ וְ/אָ֣נָה תֵלֵ֔ךְ וּ/לְ/מִ֖י אֵ֥לֶּה לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: de
  text: 'Und er befahl dem Ersten: „Wenn mein Bruder Esau dir begegnet und dich fragt: ‚Zu wem gehörst du, wohin gehst du, und wem gehören diese da vor dir?‘ …“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: dem Ersten
  rationale: Die substantivierte Ordnungszahl gibt den ersten Knecht beziehungsweise den Anführer der ersten Herde wieder, ohne eine im Vers nicht ausdrücklich genannte Bezeichnung einzufügen.
- source_word: לְמִי אַתָּה
  choice: Zu wem gehörst du?
  rationale: Die knappe hebräische Zugehörigkeitsfrage wird im Deutschen natürlich und inhaltlich genau wiedergegeben.
- source_word: וְאָנָה תֵלֵךְ
  choice: wohin gehst du?
  rationale: Direkte, idiomatische Wiedergabe der Frage nach dem Ziel.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: und wem gehören diese da vor dir?
  rationale: Die elliptische Zugehörigkeitsfrage wird im Deutschen verständlich ergänzt; „diese da vor dir“ bewahrt den deiktischen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das wiederholte לֵאמֹר wird nicht doppelt mit „sagen“ abgebildet, da die direkte Rede die Funktion im Deutschen bereits ausdrückt. Das Satzende bleibt offen, weil der Vers syntaktisch in Vers 19 weitergeführt wird.
