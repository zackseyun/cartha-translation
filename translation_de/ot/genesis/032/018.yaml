  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und den Sinn zuverlässig wieder: Jakob befiehlt dem ersten Vorausgesandten; die Begegnung mit Esau und dessen dreigliedrige Frage werden vollständig erfasst. „Zu wem gehörst du?“ entspricht לְמִי אַתָּה idiomatisch und präzise. Die Ellipse in „wem gehören diese da vor dir?“ ist im Deutschen sinnvoll aufgelöst und bewahrt den Bezug auf die vor dem Boten befindlichen Tiere bzw. die Herde.'
  naturalness: Modernes, klares Standarddeutsch mit angemessen würdigem Erzählregister. Die Auslassung des zweiten hebräischen לֵאמֹר ist im Deutschen stilistisch natürlich; die direkte Rede macht die Funktion deutlich. Der offene Schluss mit Auslassungspunkten entspricht dem versübergreifenden Satzanschluss.
  terminology: „Mein Bruder Esau“, „der Erste“ und die Zugehörigkeitsfragen sind treffend. „Der Erste“ wahrt die quellsprachliche Unbestimmtheit, ohne einen im Vers nicht genannten Knecht oder Herdenführer ausdrücklich einzutragen. Es sind keine problematischen theologischen oder namensbezogenen Entscheidungen erkennbar.
