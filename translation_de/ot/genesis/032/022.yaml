source:
  edition: WLC
  text: וַ/תַּעֲבֹ֥ר הַ/מִּנְחָ֖ה עַל פָּנָ֑י/ו וְ/ה֛וּא לָ֥ן בַּ/לַּֽיְלָה הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: de
  text: So zog das Geschenk vor ihm her[a]; er selbst aber blieb in jener Nacht im Lager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gabe“. Das hebräische Wort מִנְחָה kann ein Geschenk, eine Abgabe oder eine Opfergabe bezeichnen; hier ist Jakobs Geschenk für Esau gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: zog … her
  rationale: Das Wayyiqtol von עבר bezeichnet hier die Weiterbewegung des Geschenks. Zusammen mit „vor ihm“ gibt „zog … vor ihm her“ die Bewegung im Kontext natürlich wieder, ohne einen im Satz nicht ausdrücklich genannten Übergang anzunehmen.
- source_word: הַמִּנְחָה
  choice: das Geschenk
  rationale: מִנְחָה bezeichnet hier die Gabe, die Jakob Esau entgegenschickte, nicht ein kultisches Opfer. „Geschenk“ ist im modernen Deutsch klar und idiomatisch.
- source_word: עַל־פָּנָיו
  choice: vor ihm her
  rationale: Die Wendung bedeutet wörtlich „vor seinem Angesicht“, bezeichnet hier aber räumlich, dass das Geschenk Jakob vorauszog.
- source_word: וְהוּא
  choice: er selbst aber
  rationale: Das ausdrücklich gesetzte Pronomen hebt Jakob hervor und bildet einen Gegensatz zu dem vorausziehenden Geschenk. „Er selbst aber“ macht diesen Kontrast sichtbar.
- source_word: לָן
  choice: blieb
  rationale: Das Verb לון/לין bedeutet übernachten oder die Nacht verbringen. Mit „in jener Nacht“ ist „blieb“ knapp, natürlich und inhaltlich eindeutig.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Die Formulierung gibt die zeitliche Rückverweisung würdig und idiomatisch wieder.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: מַחֲנֶה bezeichnet ein Lager beziehungsweise Nachtlager. „Lager“ ist hier die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den Kontrast zwischen dem vorausziehenden Geschenk und Jakob, der im Lager bleibt.
