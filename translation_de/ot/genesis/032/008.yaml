base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: de
  text: Da fürchtete sich Jakob sehr, und ihm wurde bange. Er teilte die Menschen, die bei ihm waren, und die Schaf- und Ziegenherden und die Rinder und die Kamele in zwei Lager[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in zwei Gruppen«. Das hebräische Wort kann ein Lager oder eine organisierte Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  choice: fürchtete sich ... sehr
  rationale: Gibt das Verb ירא und seine Verstärkung durch מְאֹד unmittelbar und in natürlichem Deutsch wieder.
- source_word: וַיֵּצֶר לוֹ
  choice: ihm wurde bange
  rationale: Die hebräische Wendung bezeichnet innere Bedrängnis oder Beklemmung; die deutsche Formulierung bewahrt die vom vorangehenden Fürchten unterschiedene Empfindung.
- source_word: וַיַּחַץ
  choice: teilte ... in zwei
  rationale: חצה bezeichnet hier Jakobs bewusstes Aufteilen seiner Reisegemeinschaft.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: die Menschen, die bei ihm waren
  rationale: עָם meint in diesem Zusammenhang die zu Jakobs Gemeinschaft gehörenden Menschen, nicht ein Volk im ethnischen Sinn.
- source_word: הַצֹּאן
  choice: die Schaf- und Ziegenherden
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen; die ausdrückliche Wiedergabe ist für heutige Leser klar.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר bezeichnet kollektiv das Rindvieh.
- source_word: הַגְּמַלִּים
  choice: die Kamele
  rationale: Direkte Wiedergabe der eindeutigen Tierbezeichnung.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: in zwei Lager
  rationale: מַחֲנוֹת kann sowohl Lager als auch organisierte Gruppen bezeichnen; „Lager“ bewahrt zudem die Erzählterminologie des folgenden Verses.
