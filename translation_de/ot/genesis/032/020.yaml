base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: de
  text: 'Auch dem Zweiten, dem Dritten und allen, die hinter den Herden hergingen, befahl er: »Genau so sollt ihr zu Esau sprechen, wenn ihr auf ihn trefft.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gemäß diesem Wort sollt ihr zu Esau sprechen, wenn ihr ihn findet.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl er
  rationale: Das Piel von צוה bezeichnet eine verbindliche Anweisung. „Befahl“ bewahrt diese Nachdrücklichkeit besser als das schwächere „wies an“.
- source_word: הַשֵּׁנִי … הַשְּׁלִישִׁי
  choice: dem Zweiten, dem Dritten
  rationale: Die substantivierten Ordnungszahlen werden ohne ergänztes Bezugswort wiedergegeben; „Diener“ steht in diesem Vers nicht ausdrücklich.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: allen, die hinter den Herden hergingen
  rationale: Die partizipiale Form bezeichnet die gesamte nachfolgende Gruppe. „Herden“ gibt עדרים im Zusammenhang mit den nacheinander ziehenden Tiergruppen natürlich wieder.
- source_word: כַּדָּבָר הַזֶּה
  choice: Genau so
  rationale: Die Wendung bedeutet wörtlich „gemäß diesem Wort/dieser Sache“ und verweist auf die zuvor festgelegte Botschaft. „Genau so“ ist im Deutschen idiomatisch und bewahrt den Gedanken einer vorgeschriebenen Formulierung.
- source_word: תְּדַבְּרוּן אֶל־עֵשָׂו
  choice: sollt ihr zu Esau sprechen
  rationale: „Sprechen“ entspricht דבר, während „sollt“ die anweisende Funktion der Verbform wiedergibt.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: wenn ihr auf ihn trefft
  rationale: Die Konstruktion bezeichnet den Zeitpunkt des Zusammentreffens. „Auf ihn trefft“ ist im Kontext natürlich; die wörtlichere Wiedergabe „ihn findet“ wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bündelt die drei Empfängergruppen natürlich; die substantivierten Ordnungszahlen bleiben erhalten, ohne ein im Hebräischen nicht genanntes Substantiv wie „Diener“ einzufügen.
