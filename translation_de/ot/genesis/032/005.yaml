  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: de
  text: 'Und er befahl ihnen: „So sollt ihr zu meinem Herrn Esau sagen: ‚So spricht dein Diener Jakob: Ich habe mich bei Laban als Fremder aufgehalten und bin bis jetzt dort geblieben.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: er befahl
  rationale: Das Verb צוה bezeichnet einen verbindlichen Auftrag oder Befehl; „befahl“ bewahrt die Stärke der Anweisung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im natürlichen modernen Deutsch durch einen Doppelpunkt wiedergegeben; ein zusätzliches „und sprach“ wäre hier schwerfällig.
- source_word: כֹּה תֹאמְרוּן
  choice: So sollt ihr ... sagen
  rationale: כֹּה leitet die genau zu übermittelnde Botschaft ein; diese Wendung bewahrt den Botenstil und klingt zugleich verständlich.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: zu meinem Herrn Esau
  rationale: „Herr“ ist hier eine ehrerbietige gesellschaftliche Anrede, kein Gottesname. Esau steht als nähere Bestimmung dazu.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Botenformel entspricht dem hebräischen Ausdruck und gibt dessen gegenwärtige Übermittlungsfunktion angemessen wieder.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Hier handelt es sich um Jakobs ehrerbietige Selbstbezeichnung gegenüber Esau, nicht notwendig um wörtliche Knechtschaft.
- source_word: גַּרְתִּי
  choice: ich habe mich ... als Fremder aufgehalten
  rationale: גור bezeichnet das Wohnen oder Verweilen als Ortsfremder. Die Übersetzung macht diese im Kontext bedeutsame Nuance deutlich.
- source_word: וָאֵחַר
  choice: und bin ... dort geblieben
  rationale: אחר bezeichnet hier das Fortdauern des Aufenthalts bis zur Gegenwart, nicht bloß ein Zuspätkommen oder eine Verzögerung.
- source_word: עַד עָתָּה
  choice: bis jetzt
  rationale: Dies ist die natürliche moderne deutsche Entsprechung der Zeitangabe.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die doppelte Botenformel „So sollt ihr ... sagen: So spricht ...“ bleibt erhalten. Die verschachtelte direkte Rede wird durch Doppelpunkt und einfache Anführungszeichen übersichtlich gegliedert; die Fremdlingsnuance von גור wird im Haupttext ausdrücklich bewahrt.'
