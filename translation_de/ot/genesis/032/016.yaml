  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: de
  text: dreißig säugende Kamelstuten samt ihren Jungen, vierzig Kühe und zehn Stiere, zwanzig Eselinnen und zehn junge Esel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zehn Eselfohlen“; das hebräische Wort bezeichnet einen jungen Esel und kann dabei besonders an ein männliches Tier denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: säugende Kamelstuten
  rationale: Das Partizip bezeichnet weibliche Kamele, die ihre Jungen säugen. „Kamelstuten“ macht das im Deutschen natürlich und präzise deutlich.
- source_word: וּבְנֵיהֶם
  choice: samt ihren Jungen
  rationale: Wörtlich steht „und ihre Söhne/Kinder“; bei Tieren ist „ihre Jungen“ die natürliche deutsche Wiedergabe. „Samt“ verbindet die Jungen klar mit den dreißig Muttertieren.
- source_word: פָּרוֹת
  choice: Kühe
  rationale: Das Wort bezeichnet weibliche Rinder; „Kühe“ ist hier die übliche und verständliche Bezeichnung.
- source_word: וּפָרִים
  choice: und zehn Stiere
  rationale: פָרִים bezeichnet männliche Rinder, hier passend als „Stiere“ wiedergegeben.
- source_word: אֲתֹנֹת
  choice: Eselinnen
  rationale: Das hebräische Wort bezeichnet ausdrücklich weibliche Esel; „Eselinnen“ ist knapp und idiomatisch.
- source_word: וַעְיָרִם
  choice: und zehn junge Esel
  rationale: עַיִר kann einen jungen Esel, insbesondere einen Eselhengst beziehungsweise ein männliches Jungtier, bezeichnen. „Junge Esel“ bewahrt die Altersangabe, ohne das Geschlecht stärker festzulegen, als es für moderne Leser sicher erkennbar ist.
