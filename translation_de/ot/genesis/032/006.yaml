base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: de
  text: Ich habe Rinder und Esel, Kleinvieh sowie Diener und Dienerinnen[a]. Ich habe Boten gesandt, um meinem Herrn dies mitzuteilen, damit ich Gunst in deinen Augen finde.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklaven und Sklavinnen«. Die hebräischen Wörter bezeichnen männliche und weibliche Angehörige eines Haushalts in einem Abhängigkeitsverhältnis und können auch versklavte Menschen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Ich habe
  rationale: Die Verbindung von היה mit ל drückt Besitz aus; das deutsche Präsens gibt Jakobs gegenwärtigen Besitz natürlich wieder.
- source_word: שׁוֹר וַחֲמוֹר
  choice: Rinder und Esel
  rationale: Die singularischen Kollektivbezeichnungen benennen Tiergattungen. »Rinder« ist im Deutschen für den Gesamtbestand natürlicher und weniger eng als »Ochsen«.
- source_word: צֹאן
  choice: Schafe und Ziegen
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, vor allem Schafe und Ziegen. Die ausdrückliche Wiedergabe ist für heutige Leser klarer als »Kleinvieh«.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: Knechte und Mägde
  rationale: Die beiden Wörter unterscheiden männliche und weibliche abhängige Angehörige des Haushalts. Die traditionelle, noch verständliche Paarung bewahrt diese Unterscheidung; die mögliche Bedeutung »Sklaven und Sklavinnen« wird in einer Fußnote genannt.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: Nun habe ich Boten gesandt, um es … mitzuteilen
  rationale: Das Verb »senden« hat hier im Kontext der ausgesandten Boten ein erschließbares Objekt. »Nun« verbindet den berichteten Besitz mit dem Zweck der gerade erfolgten Sendung.
- source_word: לַאדֹנִי
  choice: meinem Herrn
  rationale: Dies ist eine ehrerbietige Bezeichnung Esaus, kein Gottesname.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: damit ich Gunst in deinen Augen finde
  rationale: Die geläufige hebräische Wendung wird bildgetreu und zugleich verständlich wiedergegeben.
theological_decisions:
- issue: Sozialer Status bei עֶבֶד und שִׁפְחָה
  choice: Knechte und Mägde mit Fußnote
  alternative: Sklaven und Sklavinnen
  rationale: Der Besitzkatalog weist auf ein Abhängigkeitsverhältnis hin, doch die hebräischen Begriffe legen dessen genaue rechtliche Ausgestaltung hier nicht eindeutig fest. Die Hauptfassung wahrt die traditionelle Haushaltsbezeichnung, während die Fußnote die stärkere mögliche Wiedergabe offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Knechte und Mägde« ist bewusst als feste Paarung gewählt; die Fußnote verhindert, dass der mögliche Zwangs- und Besitzstatus sprachlich verdeckt wird. Die direkte Rede endet mit einem schließenden Anführungszeichen, da der Vers Teil der in Genesis 32,5 begonnenen Botschaft ist.
