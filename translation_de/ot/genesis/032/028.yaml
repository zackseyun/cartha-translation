  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו מַה שְּׁמֶ֑/ךָ וַ/יֹּ֖אמֶר יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/028.yaml
  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: de
  text: 'Da sagte er zu ihm: »Wie heißt du?« Er sagte: »Jakob.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Die Wayyiqtol-Form von אמר führt die Erzählung weiter. »Da sagte er« gibt diesen narrativen Fortgang in natürlichem Deutsch wieder, ohne eine stärkere zeitliche Nuance einzutragen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person Singular maskulin bezeichnet die Richtung auf eine männliche Bezugsperson.
- source_word: מַה שְּׁמֶךָ
  choice: Wie heißt du?
  rationale: Wörtlich steht »Was ist dein Name?«; die gewählte Form ist die natürliche moderne deutsche Entsprechung derselben Frage.
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Auch beim zweiten Vorkommen wird das gewöhnliche Verb אמר mit »sagen« wiedergegeben. »Er antwortete« wäre im Zusammenhang möglich, würde die Funktion jedoch stärker ausdeuten als der hebräische Wortlaut.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
