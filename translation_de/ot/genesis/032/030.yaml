  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: de
  text: 'Da fragte Jakob: »Sag mir doch deinen Namen!« Er aber sagte: »Warum fragst du nach meinem Namen?« Und er segnete ihn dort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Da fragte Jakob
  rationale: Die beiden hebräischen Redeeinleitungen werden im natürlichen Deutschen zu einer Einleitung zusammengezogen; der Sinn des Fragens und Sprechens bleibt durch das folgende Zitat vollständig erhalten.
- source_word: הַגִּידָה נָּא
  choice: Sag mir doch
  rationale: Der Hifil-Imperativ von נגד bedeutet „mitteilen, sagen, kundtun“. Die Partikel נָא macht die Aufforderung höflicher; das deutsche „doch“ gibt diesen bittenden Ton idiomatisch wieder.
- source_word: שְׁמֶךָ
  choice: deinen Namen
  rationale: Dies ist die unmittelbare lexikalische Entsprechung. Eine weitergehende Deutung des Namens als Wesen oder Identität wird nicht in den Haupttext eingetragen.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Warum fragst du nach meinem Namen?
  rationale: „Nach jemandes Namen fragen“ ist die natürliche deutsche Wiedergabe von שאל לְשֵׁם. Das leicht verstärkende זֶה lässt sich hier nicht ohne unnatürliche Schwere eigens abbilden; der knappe, abweisende Fragesatz bewahrt die kommunikative Wirkung.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: Und er segnete ihn dort
  rationale: Die Formulierung folgt dem Hebräischen eng, einschließlich des hervorgehobenen Ortsadverbs „dort“ und der unausgesprochenen Identität des Subjekts.
theological_decisions:
- issue: Identität dessen, der seinen Namen nicht nennt und Jakob segnet
  choice: Die mehrdeutigen Pronomen „er“ und „ihn“ bleiben erhalten.
  alternative: Das Subjekt ausdrücklich als „der Mann“, „Gott“ oder „der Engel“ benennen.
  rationale: Der unmittelbare hebräische Vers nennt das Subjekt nicht ausdrücklich. Der weitere Zusammenhang legt Deutungen nahe, doch die Übersetzung soll die im Vers bestehende Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Doppelung „fragte … und sagte“ wird idiomatisch gestrafft; die Bitte wird durch „doch“ natürlich wiedergegeben. Keine konfessionell geprägte Identifizierung des ungenannten Sprechers.
