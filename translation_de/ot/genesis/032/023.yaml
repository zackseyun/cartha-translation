base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: de
  text: In jener Nacht stand er auf, nahm seine beiden Frauen, seine beiden Dienerinnen[a] und seine elf Kinder und überquerte die Furt des Jabbok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine beiden Sklavinnen“. Das hebräische Wort bezeichnet Frauen in einem untergeordneten Haushaltsstatus und kann ein rechtliches Abhängigkeitsverhältnis bis hin zur Sklaverei einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand er auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier das Aufstehen; „stand er auf“ ist im modernen deutschen Erzählstil natürlich.
- source_word: בַּלַּיְלָה הוּא
  choice: In jener Nacht
  rationale: Die Wendung setzt die Handlung in die betreffende Nacht; das hervorgehobene Pronomen wird idiomatisch durch „jener“ berücksichtigt.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet gewöhnlich „nehmen“. Der Zusammenhang lässt das Mitnehmen und Führen der Familie erkennen, ohne dass dies ausdrücklich ergänzt werden muss.
- source_word: שְׁתֵּי נָשָׁיו
  choice: seine beiden Frauen
  rationale: נָשִׁים bezeichnet hier eindeutig Jakobs Ehefrauen; „Frauen“ ist im Deutschen die natürliche kontextuelle Bezeichnung.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: seine beiden Dienerinnen
  rationale: שִׁפְחָה bezeichnet eine Frau in untergeordnetem Haushaltsstatus und kann auch eine Sklavin meinen. „Dienerinnen“ ist klar und gegenwärtig; die stärkere soziale Bedeutung bleibt in der Fußnote erhalten.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: seine elf Kinder
  rationale: יְלָדִים bedeutet „Kinder/Nachkommen“, nicht ausdrücklich „Söhne“. Die Übersetzung bewahrt den Wortlaut, ohne die Zählung harmonisierend auszulegen.
- source_word: וַיַּעֲבֹר
  choice: überquerte
  rationale: עבר bezeichnet in diesem Reisebericht das Hinübergehen beziehungsweise Überqueren.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: die Furt des Jabbok
  rationale: מַעֲבַר bezeichnet eine Übergangsstelle oder Furt; „die Furt des Jabbok“ ist präzise und idiomatisch.
- source_word: יַבֹּק
  choice: Jabbok
  rationale: Der herkömmliche deutsche Name des Flusses wird beibehalten.
