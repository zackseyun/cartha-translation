source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: de
  text: 'Dann sollst du sagen: »Sie gehören deinem Diener Jakob. Es ist eine Gabe[a], die an meinen Herrn Esau geschickt wurde. Und sieh, auch er ist hinter uns[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geschenk“ oder „Huldigungsgabe“. Das hebräische Wort minḥah bezeichnet hier eine Gabe, mit der Jakob Esau versöhnlich stimmen will.
    reason: lexical_alternative
  - marker: b
    text: Oder „kommt hinter uns her“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָ
  choice: Dann sollst du sagen
  rationale: Das Waw mit Perfekt setzt Jakobs Anweisung fort. „Dann sollst du sagen“ gibt die zeitliche Folge und den anweisenden Charakter in natürlichem Deutsch wieder.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: Sie gehören deinem Diener Jakob
  rationale: Die knappe hebräische Dativfügung antwortet auf Esaus im vorigen Vers gestellte Frage nach dem Besitzer der Herden. Das im Deutschen ergänzte „Sie gehören“ macht die Ellipse verständlich und bewahrt Jakobs demütige Selbstbezeichnung.
- source_word: מִנְחָה
  choice: Gabe
  rationale: Im Erzählzusammenhang bezeichnet das Wort eine zur Versöhnung bestimmte Gabe an Esau, nicht ein kultisches Opfer. „Gabe“ lässt sowohl den Geschenk- als auch den möglichen Tributaspekt offen.
- source_word: שְׁלוּחָה
  choice: geschickt wurde
  rationale: Das passive Partizip beschreibt die Gabe als abgesandt. Die deutsche Relativkonstruktion gibt diesen passiven Sinn idiomatisch wieder.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: an meinen Herrn Esau
  rationale: „Herr“ bewahrt die respektvolle, unterwürfige Anrede Jakobs. „Esau“ steht als nähere Bestimmung dazu; im Deutschen ist die Verbindung ohne Komma natürlich.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Aufmerksamkeitsformel wird direkt, aber ohne das heute altertümlich wirkende „siehe“ wiedergegeben.
- source_word: גַם הוּא
  choice: auch er
  rationale: Die additive Hervorhebung zeigt, dass Jakob selbst zusätzlich zu seiner vorausgeschickten Gabe folgt.
- source_word: אַחֲרֵינוּ
  choice: ist hinter uns
  rationale: Die räumliche Aussage wird unmittelbar wiedergegeben; aus dem Zusammenhang kann zugleich die Bewegung hinter den Knechten her verstanden werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Besitzerangabe wird anhand der unmittelbar vorausgehenden Frage als elliptischer Satz wiedergegeben; die respektvolle Selbsterniedrigung Jakobs gegenüber Esau bleibt erhalten.
