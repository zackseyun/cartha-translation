  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: de
  text: 'Aber du hast gesagt: »Ich werde dir ganz gewiss Gutes tun und deine Nachkommen[a] wie den Sand am Meer machen, der vor Menge nicht gezählt werden kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deinen Samen«; das hebräische Wort ist eine Einzahl mit kollektiver Bedeutung und bezeichnet hier die Nachkommenschaft als Ganze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: Aber du hast gesagt
  rationale: Die Verbindung aus Konjunktion und ausdrücklich gesetztem Pronomen hebt Gottes frühere Zusage gegenüber der gegenwärtigen Gefahr hervor. Das Perfekt wird im deutschen Gebetskontext natürlich mit »hast gesagt« wiedergegeben.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Ich werde dir ganz gewiss Gutes tun
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage. »Ganz gewiss« bewahrt diesen Nachdruck; »dir Gutes tun« gibt die idiomatische Verbindung mit עִם natürlich wieder.
- source_word: וְשַׂמְתִּי
  choice: und … machen
  rationale: שׂים bedeutet hier im Zusammenhang mit der Vermehrung der Nachkommenschaft idiomatisch »machen«.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: זֶרַע ist hier ein kollektiver Singular. »Nachkommen« ist im modernen Deutschen natürlich und bezeichnet die gesamte Nachkommenschaft, ohne das missverständliche wörtliche »Samen« zu verwenden.
- source_word: כְּחוֹל הַיָּם
  choice: wie den Sand am Meer
  rationale: Die Formulierung bewahrt den hebräischen Vergleich und ist zugleich eine geläufige, natürliche deutsche Wendung.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: der vor Menge nicht gezählt werden kann
  rationale: Der Relativsatz bezieht sich grammatisch auf den Sand. Die passive Form bezeichnet praktische Unzählbarkeit; מֵרֹב nennt die große Menge als Ursache.
