base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: de
  text: 'Als Jakob sie sah, sagte er: »Das ist Gottes Lager.« Und er nannte jenen Ort Mahanaim[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahanaim ist die hebräische Dualform zu „Lager“ und spielt auf „zwei Lager“ an; vgl. Jakobs Worte: »Das ist Gottes Lager.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: Als Jakob sie sah
  rationale: כַּאֲשֶׁר hat hier zeitliche Bedeutung. Das Suffix in רָאָם ist maskulin Plural und verweist auf die im vorherigen Vers genannten Engel Gottes.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: Gottes Lager
  rationale: מַחֲנֶה bezeichnet ein Lager oder Heerlager. Das knappe „Lager“ ist natürlich, verständlich und bewahrt den sprachlichen Bezug zum Ortsnamen Mahanajim.
- source_word: זֶה
  choice: Das ist
  rationale: Das Demonstrativpronomen steht prädikativ; im Deutschen wird die Kopula ergänzt.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Darum nannte er jenen Ort
  rationale: Die hebräische Wendung lautet wörtlich „er rief den Namen jenes Ortes“. „Nannte er jenen Ort“ gibt die Benennung im modernen Deutschen idiomatisch wieder; „Darum“ macht den im Kontext erkennbaren Folgezusammenhang deutlich.
- source_word: מַחֲנָיִם
  choice: Mahanajim
  rationale: Der Ortsname wird in einer im Deutschen geläufigen Form wiedergegeben. Seine mögliche dualische Bedeutung wird in der Fußnote erklärt, statt den Eigennamen im Haupttext zu übersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählweise. „Lager“ erhält das hebräische Wortspiel; der Ortsname bleibt unübersetzt und wird in der Fußnote erläutert.
