  rationale: Die Änderung von „schlägt“ zu „angreift“ ist eine sichere idiomatische Anpassung für die im Kontext gemeinte Gewalt gegen ein Lager. Die Fußnote bewahrt die wörtlichere nominale Konstruktion von לִפְלֵיטָה und erläutert sie ohne den Grundtext zu überinterpretieren.
