translation:
  language: de
  text: 'Er sagte: „Wenn Esau zu dem einen Lager kommt und es angreift, dann wird das übrig gebliebene Lager entkommen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Das übrig gebliebene Lager wird zum Entrinnen sein“, das heißt: Es wird überleben oder der Vernichtung entgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Das Wayyiqtol von אמר wird im deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben; die einleitende Konjunktion muss nicht eigens übersetzt werden.
- source_word: אִם
  choice: Wenn
  rationale: Leitet eine reale, aber noch ungewisse Bedingung ein. Im Deutschen ist „wenn“ hier natürlicher als „falls“, ohne die Bedingtheit aufzuheben.
- source_word: יָבֹא
  choice: kommt
  rationale: Gibt die Grundbedeutung von בוא wieder; die feindliche Handlung folgt erst mit נכה.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: zu dem einen Lager
  rationale: Bewahrt אֶל als Richtungsangabe und bezeichnet mit Artikel und Zahl eines der zuvor gebildeten zwei Lager.
- source_word: וְהִכָּהוּ
  choice: und es schlägt
  rationale: נכה bedeutet grundlegend „schlagen“. Das maskuline Suffix bezieht sich am ehesten auf das im Hebräischen maskuline מַחֲנֶה als kollektive Einheit; im Deutschen steht daher „es“.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: das übrig gebliebene Lager
  rationale: נשאר bezeichnet das, was verbleibt beziehungsweise übrig bleibt. Die Formulierung ist im modernen Deutsch klar und wahrt den resultativen Sinn.
- source_word: לִפְלֵיטָה
  choice: wird entkommen
  rationale: Das Substantiv פְלֵיטָה bezeichnet Entrinnen beziehungsweise Überleben. Die verbale Wiedergabe ist idiomatisches Deutsch und drückt das erwartete Ergebnis aus.
