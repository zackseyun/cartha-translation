review_pass:
  verdict: revise
  source_fidelity: Die Bedingung, die Bezugnahme auf eines der beiden Lager und die Folgerung für das verbleibende Lager werden zutreffend wiedergegeben. Für נכה ist „schlägt“ zwar formal nah, bezogen auf ein Lager im modernen Deutschen jedoch missverständlich bzw. unnatürlich; „angreift“ gibt die hier gemeinte feindliche Handlung zuverlässig wieder. Die Fußnote wahrt die nominale hebräische Wendung לִפְלֵיטָה.
  naturalness: „Wenn Esau zu dem einen Lager kommt und es schlägt“ klingt im modernen Standarddeutsch hölzern, besonders „ein Lager schlagen“. Mit „angreift“ bleibt der Satz klar und würdig. „übrig gebliebene Lager“ ist verständlich und idiomatisch.
  terminology: Die Eigennamen- und Lagerterminologie sind angemessen. „Entrinnen“ ist für die Fußnote eine passende, nicht doktrinär aufgeladene Wiedergabe von פְלֵיטָה.
  issues:
  - severity: medium
    issue: „und es schlägt“ ist im Deutschen bei einem Lager nicht idiomatisch.
    rationale: Das hebräische נכה kann hier die gewaltsame Attacke auf das Lager bezeichnen. „angreift“ vermittelt diese Bedeutung in natürlichem modernen Deutsch, ohne den bloßen Ankunftsverb יָבֹא zu überladen.
  - severity: low
    issue: Die Fußnote gibt die wörtliche Alternative ohne explizites Subjekt wieder.
    rationale: Eine vollständige alternative Satzform macht klarer, dass sich die nominale Wendung auf das verbleibende Lager bezieht.
