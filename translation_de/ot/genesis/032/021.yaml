base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: de
  text: 'Und sagt auch: »Siehe, dein Diener Jakob ist hinter uns.« Denn er sagte sich: »Ich will ihn mit dem Geschenk, das mir vorausgeht, besänftigen[a]. Danach will ich sein Angesicht sehen; vielleicht nimmt er mich freundlich auf[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich will sein Angesicht mit dem Geschenk besänftigen.“ Das hebräische Verb steht in Zusammenhang mit der Sprache der Sühne, bezeichnet hier aber das Beschwichtigen Esaus.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Redewendung: „Vielleicht erhebt er mein Angesicht“, das heißt: Vielleicht nimmt er mich an oder erweist mir Gunst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם גַּם
  choice: Und sagt auch
  rationale: Die Pluralform richtet sich weiterhin an die vorausgesandten Knechte. Die knappe Formulierung gibt sowohl die Aufforderung als auch גַּם („auch“) wieder.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel wird mit dem im würdevollen modernen Bibeldeutsch weiterhin verständlichen „Siehe“ wiedergegeben.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Jakob bezeichnet sich in unterwürfig-höflicher Rede gegenüber Esau als dessen Diener; „Sklave“ wäre hier sozial und kontextuell zu stark.
- source_word: אַחֲרֵינוּ
  choice: kommt hinter uns
  rationale: Die Wendung bezeichnet Jakobs Position hinter den vorausziehenden Boten und lässt zugleich erkennen, dass die ganze Gruppe unterwegs ist.
- source_word: אֲכַפְּרָה פָנָיו
  choice: ich will ihn … besänftigen
  rationale: כפר bezeichnet hier in einer zwischenmenschlichen, nicht kultischen Situation das Beschwichtigen Esaus. Natürliches Deutsch steht im Haupttext; die wörtliche Wendung und ihre Nähe zur Sühneterminologie werden in der Fußnote offengelegt.
- source_word: מִנְחָה
  choice: Geschenk
  rationale: Gemeint ist Jakobs beschwichtigende Gabe an Esau. „Opfergabe“ klänge in diesem Zusammenhang unnötig kultisch, „Tribut“ zu politisch festgelegt.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: das vor mir herzieht
  rationale: Die partizipiale Form bezeichnet die Gabe beziehungsweise die sie bildenden Herden als gerade vorausziehend.
- source_word: אֶרְאֶה פָנָיו
  choice: ich will sein Angesicht sehen
  rationale: Die wörtliche und im Deutschen verständliche Form bewahrt das wiederholte Motiv des „Angesichts“.
- source_word: אוּלַי יִשָּׂא פָנָי
  choice: vielleicht nimmt er mich freundlich auf
  rationale: Die hebräische Redewendung „mein Angesicht erheben“ bezeichnet eine günstige Aufnahme. Die Unsicherheit von אוּלַי bleibt durch „vielleicht“ erhalten; die Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von כפר in einer nicht kultischen Begegnung
  choice: besänftigen
  alternative: Sühne leisten / sein Angesicht bedecken
  rationale: Jakob versucht, Esau durch ein Geschenk günstig zu stimmen. Daher ist die zwischenmenschliche Bedeutung maßgeblich, ohne die lexikalische Verbindung zur Sühnesprache zu leugnen; diese wird in der Fußnote genannt.
- issue: Wiedergabe von יִשָּׂא פָנָי
  choice: nimmt er mich freundlich auf
  alternative: erhebt er mein Angesicht
  rationale: Die natürliche deutsche Wiedergabe vermittelt die erhoffte Annahme, ohne eine besondere theologische Deutung einzutragen. Die zugrunde liegende hebräische Bildrede bleibt per Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ und „Angesicht“ erhalten den feierlichen Erzählton und einen Teil des hebräischen Leitwortspiels; schwer verständliche hebräische Idiome werden im Haupttext natürlich wiedergegeben und in Fußnoten transparent gemacht.
