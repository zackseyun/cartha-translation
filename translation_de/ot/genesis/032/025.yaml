source:
  edition: WLC
  text: וַ/יִּוָּתֵ֥ר יַעֲקֹ֖ב לְ/בַדּ֑/וֹ וַ/יֵּאָבֵ֥ק אִישׁ֙ עִמּ֔/וֹ עַ֖ד עֲל֥וֹת הַ/שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: de
  text: Und Jakob blieb allein zurück. Da rang ein Mann mit ihm, bis die Morgendämmerung heraufzog.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zum Heraufziehen der Morgendämmerung“; auch: „bis zum Tagesanbruch“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „ein Mann“. Der weitere Zusammenhang und Hosea 12,4 tragen zur näheren Bestimmung dieser Gestalt bei.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: blieb … zurück
  rationale: Das Nifal bezeichnet, dass Jakob nach dem Hinüberbringen der anderen allein zurückblieb. Die deutsche Formulierung gibt den resultativen beziehungsweise passiven Sinn natürlich wieder.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: Die knappe Wiedergabe betont wie das Hebräische Jakobs Abgeschiedenheit.
- source_word: וַיֵּאָבֵק
  choice: rang
  rationale: Das seltene Verb bezeichnet hier einen körperlichen Ringkampf; „rang“ ist präziser als das allgemeinere „kämpfte“.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Der Vers bezeichnet die geheimnisvolle Gestalt ausdrücklich zunächst als Mann und lässt ihre genauere Identität offen.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Präpositionalverbindung bezeichnet Jakob als denjenigen, mit dem der Mann rang.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: bis die Morgendämmerung heraufzog
  rationale: Die Formulierung bewahrt das Bild vom Heraufziehen beziehungsweise Aufsteigen der Morgendämmerung und klingt zugleich natürlich und würdevoll.
theological_decisions:
- issue: Identität des אִישׁ im Ringkampf
  choice: Im Haupttext „ein Mann“, ohne nähere Identifizierung
  alternative: ein Engel; Gott beziehungsweise der HERR in menschlicher Erscheinung
  rationale: Dieser Vers selbst nennt die Gestalt lediglich „einen Mann“. Der weitere Kontext und Hosea 12 tragen zu ihrer näheren Deutung bei, doch die Übersetzung soll die erzählerische und theologische Spannung an dieser Stelle nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet eine schwerfällige Reihung; „Da“ gibt den hebräischen Erzählfortgang natürlich wieder. Die Fußnotenmarker stehen nach dem jeweils einschlägigen Satzteil in der Reihenfolge a, b.
