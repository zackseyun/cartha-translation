  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: de
  text: Ich bin all der beständigen Liebe und all der Treue nicht wert, die du deinem Diener erwiesen hast.[a] Denn mit meinem Stab zog ich über diesen Jordan, und nun bin ich zu zwei Lagern geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich bin geringer als all die beständige Liebe und all die Treue.“ Die hebräische Wendung bringt Demut angesichts von Gottes großzügigem Handeln zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Ich bin … nicht wert
  rationale: Das Verb bedeutet wörtlich „ich bin klein“ beziehungsweise „ich bin geringer geworden“. Im Zusammenhang drückt es demütige Unzulänglichkeit angesichts von Gottes Güte aus; „nicht wert sein“ gibt dieses Idiom in natürlichem Deutsch wieder.
- source_word: הַחֲסָדִים
  choice: all der beständigen Liebe
  rationale: חסד bezeichnet hier Gottes verlässliche, bleibende Zuwendung. Der hebräische Plural kann auf ihre vielfältigen Erweise hinweisen; im Deutschen wird der Sammelbegriff idiomatisch im Singular gebraucht.
- source_word: הָאֱמֶת
  choice: all der Treue
  rationale: In der Verbindung mit חסד bezeichnet אמת eher Verlässlichkeit und Treue als abstrakte Wahrheit.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: die du deinem Diener erwiesen hast
  rationale: Wörtlich steht „die du an/mit deinem Diener getan hast“. Bei Liebe und Treue ist „erwiesen hast“ eine natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: בְמַקְלִי
  choice: mit meinem Stab
  rationale: Die knappe Wiedergabe entspricht dem Hebräischen. Das im Zusammenhang naheliegende „nur“ wird nicht in den Haupttext aufgenommen, weil es nicht ausdrücklich dasteht.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: zog ich über diesen Jordan
  rationale: „Über den Jordan ziehen“ ist im Deutschen idiomatisch; „diesen“ bewahrt die im Hebräischen ausgedrückte unmittelbare Bezugnahme.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: bin ich zu zwei Lagern geworden
  rationale: Die Formulierung bewahrt das konkrete Bild und die ungewöhnliche Aussage des Hebräischen, dass Jakob nun zu zwei Lagern geworden ist.
theological_decisions:
- issue: Wiedergabe von חסד und אמת als Beschreibung von Gottes Handeln an Jakob
  choice: beständige Liebe und Treue
  alternative: Güte und Wahrheit; Bundestreue und Treue
  rationale: Die gewählte Wortverbindung hält die beiden hebräischen Begriffe auseinander und bringt zugleich ihre relationale Bedeutung zum Ausdruck, ohne den Bundesbezug stärker festzulegen, als es der Vers selbst verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt persönlich und schlicht. Die auffällige Wendung „zu zwei Lagern geworden“ wurde bewusst beibehalten, um das Bild und die Spannung des hebräischen Textes nicht zu glätten.
