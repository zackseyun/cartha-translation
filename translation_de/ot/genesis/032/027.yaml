  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: de
  text: 'Da sagte er: »Lass mich los[a], denn die Morgenröte ist aufgegangen[b].« Doch er sagte[c]: »Ich lasse dich nicht los, es sei denn, du segnest mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Lass mich frei« oder »Schick mich fort.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »denn der Tag bricht an.«'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen werden die Sprecher in diesem Vers nicht ausdrücklich benannt; wer jeweils spricht, ergibt sich aus dem Erzählzusammenhang.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Lass mich los
  rationale: Der Imperativ von שׁלח mit Suffix der 1. Person Singular bedeutet hier »lass mich los/frei«; im Zusammenhang des Ringens ist dies im Deutschen natürlich und bewahrt zugleich den Bezug zum wiederholten Verb.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: denn die Morgenröte ist aufgegangen
  rationale: כִּי wird kausal mit »denn« wiedergegeben; עָלָה bezeichnet das Aufgehen, und הַשָּׁחַר die Morgenröte. Die Formulierung erhält das Bild des hebräischen Textes.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Ich lasse dich nicht los
  rationale: Der negierte Imperfekt drückt hier eine entschiedene Weigerung aus. Die Wiederholung von »loslassen« bewahrt das Wortspiel mit שַׁלְּחֵנִי.
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Die Partikelverbindung führt eine ausschließende Bedingung ein; »es sei denn« ist eine natürliche und präzise deutsche Entsprechung.
- source_word: בֵּרַכְתָּנִי
  choice: du segnest mich
  rationale: Das Perfekt steht nach der Bedingungsformel für die noch verlangte, vor dem Loslassen zu vollziehende Handlung. Im Deutschen gibt der Präsensausdruck diesen Sinn idiomatisch wieder.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Da sagte er ... Doch er sagte
  rationale: Beide hebräischen Formen lauten gleichartig »und er sagte«. »Doch« macht beim zweiten Sprecher den Gegensatz natürlich erkennbar, ohne seine Identität im Vers festzulegen.
theological_decisions:
- issue: Identität der Sprecher
  choice: Im Haupttext bleiben beide Sprecher mit »er« unbestimmt.
  alternative: Die Sprecher ausdrücklich als den Mann/Engel und Jakob oder als Gott und Jakob benennen.
  rationale: Der hebräische Vers nennt die Sprecher nicht ausdrücklich, sondern enthält nur Verbalformen mit implizitem maskulinem Singularsubjekt. Eine Benennung würde die Deutung aus dem weiteren Erzählzusammenhang in diesen Vers eintragen und seine erzählerische sowie theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Wendung »die Morgenröte ist aufgegangen« bleibt nahe am Hebräischen; die direkte Rede klingt zugleich natürlich. Die ungenannten Sprecher werden nicht interpretierend identifiziert.
