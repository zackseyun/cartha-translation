  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: de
  text: 'Bitte rette mich aus der Hand meines Bruders, aus der Hand Esaus! Denn ich fürchte mich vor ihm: Er könnte kommen und mich erschlagen – Mutter samt Kindern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mutter auf Kindern“. Die hebräische Wendung bezeichnet das Erschlagen einer Mutter zusammen mit ihren Kindern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Rette mich doch
  rationale: Der Hifil-Imperativ von נצל mit dem Suffix der 1. Person Singular bedeutet „rette/befreie mich“. „doch“ gibt die bittende Partikel נָא in natürlichem modernem Deutsch wieder.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die konkrete hebräische Wendung bezeichnet die Gewalt oder Verfügungsgewalt eines Menschen und ist auch im Deutschen verständlich; ihre Wiederholung wird beibehalten.
- source_word: אָחִי
  choice: meines Bruders
  rationale: Die Verwandtschaftsbezeichnung samt Possessivbezug bleibt erhalten und unterstreicht die Spannung, dass die Gefahr vom eigenen Bruder ausgeht.
- source_word: יָרֵא אָנֹכִי אֹתוֹ
  choice: ich fürchte mich vor ihm
  rationale: Natürliche deutsche Wiedergabe der gegenwärtigen Furcht; das ausdrücklich gesetzte Pronomen אָנֹכִי wird nicht unnatürlich hervorgehoben.
- source_word: פֶּן יָבוֹא
  choice: Er könnte kommen
  rationale: פֶּן leitet eine befürchtete Möglichkeit ein. Die Konstruktion mit „könnte“ ist im modernen Deutsch natürlicher als „damit nicht“ oder das gehobene „auf dass nicht“.
- source_word: וְהִכַּנִי
  choice: und mich erschlagen
  rationale: נכה bezeichnet einen gewaltsamen Schlag und kann im Kontext tödliches Niederschlagen meinen. „erschlagen“ wahrt die Gewalt und passt zur folgenden Formel, ohne ein bestimmtes Tatmittel festzulegen.
- source_word: אֵם עַל בָּנִים
  choice: die Mutter samt den Kindern
  rationale: Die idiomatische Wendung bezeichnet die gemeinsame Vernichtung von Mutter und Kindern. „samt“ gibt das einschließende Verhältnis knapp und würdig wieder; eine Fußnote dokumentiert die ungewöhnliche hebräische Bildform.
theological_decisions:
- issue: Bezug und Bedeutung von אֵם עַל בָּנִים
  choice: die Mutter samt den Kindern
  alternative: Mutter über Kindern / Mutter und Kinder
  rationale: Die Wendung wird als idiomatische Erweiterung des befürchteten Angriffs verstanden, nicht als Identifikation Jakobs mit der Mutter. Die Übersetzung bewahrt das Familienbild und vermeidet zugleich eine konfessionelle oder weitergehende Auslegung.
- issue: Stärke von וְהִכַּנִי
  choice: mich erschlagen
  alternative: mich schlagen / mich angreifen
  rationale: Im Zusammenhang mit der Tötungsformel für Mutter und Kinder ist tödliche Gewalt wahrscheinlich. „Erschlagen“ bildet diese Kontextstärke ab, ohne über den Text hinaus eine konkrete Todesart zu bestimmen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Wiederholung „aus der Hand“ erhält Nachdruck und Rhythmus des Hebräischen. Kurze Sätze machen die Bitte und Jakobs Angst unmittelbar verständlich; die ungewöhnliche Schlussformel bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
