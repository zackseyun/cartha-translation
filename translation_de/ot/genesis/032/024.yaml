  text: וַ/יִּקָּחֵ֔/ם וַ/יַּֽעֲבִרֵ֖/ם אֶת הַ/נָּ֑חַל וַֽ/יַּעֲבֵ֖ר אֶת אֲשֶׁר ל/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: de
  text: Er nahm sie und brachte sie über den Wasserlauf[a]. Dann brachte er hinüber, was ihm gehörte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Bach«, »das Wadi« beziehungsweise »das Bachtal«. Das hebräische Wort נחל kann einen Bach, eine Schlucht oder einen nur zeitweise wasserführenden Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »was ihm war«, das heißt: was ihm gehörte beziehungsweise sein Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Er nahm sie
  rationale: לקח bedeutet hier im fortlaufenden Erzählstil schlicht »nehmen«. Der Bezug auf die zuvor genannten Personen bleibt wie im Hebräischen durch das Pronomen erhalten.
- source_word: וַיַּעֲבִרֵם
  choice: ließ sie … überqueren
  rationale: 'Die Hifil-Form von עבר ist kausativ: Jakob bewirkte, dass sie hinübergingen. »Ließ sie … überqueren« gibt diesen Sinn in natürlichem Deutsch wieder.'
- source_word: הַנָּחַל
  choice: den Wasserlauf
  rationale: נחל kann einen Bach, einen zeitweise wasserführenden Wadi oder das entsprechende Bachbett bezeichnen. »Wasserlauf« ist allgemein verständlich und legt die genaue Beschaffenheit nicht unnötig fest.
- source_word: וַיַּעֲבֵר
  choice: brachte … hinüber
  rationale: Auch hier steht die kausative Hifil-Form von עבר. Bei Jakobs Habe ist »brachte … hinüber« idiomatisch und bewahrt die aktive Veranlassung.
- source_word: אֲשֶׁר לוֹ
  choice: was ihm gehörte
  rationale: Die Wendung lautet wörtlich etwa »was ihm war« und bezeichnet in diesem Zusammenhang Jakobs Besitz. Die gewählte Form bleibt nah an der hebräischen Relativkonstruktion und klingt zugleich natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der beiden kausativen Formen wird erkennbar gehalten, ohne die hebräische Syntax unnatürlich nachzubilden. »Wasserlauf« bewahrt die topografische Offenheit von נחל.
