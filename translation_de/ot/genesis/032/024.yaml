  source_fidelity: Die beiden Hifil-Formen von עבר bezeichnen jeweils, dass Jakob die betreffende Gruppe beziehungsweise seine Habe hinüberbrachte. „ließ sie ... überqueren“ kann im Deutschen zwar kausativ verstanden werden, legt aber auch ein bloßes Erlauben nahe und ist daher weniger präzise.
  naturalness: „Er nahm sie und brachte sie über den Wasserlauf“ sowie die parallele Wiederaufnahme „brachte er ... hinüber“ sind modernes, natürliches Standarddeutsch und bilden die Handlung klar ab.
  terminology: „Wasserlauf“ ist für נחל angemessen weit. Die Alternativangabe wird mit dem im Deutschen üblichen sächlichen „das Wadi“ vereinheitlicht. „Was ihm gehörte“ gibt אֲשֶׁר לוֹ idiomatisch und kontextgerecht wieder.
