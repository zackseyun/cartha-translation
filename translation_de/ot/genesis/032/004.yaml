base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: de
  text: Jakob sandte Boten vor sich her zu seinem Bruder Esau ins Land Seïr, in das Gebiet Edoms[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in das Feld Edoms“; wahrscheinlich ist damit das Gebiet oder die Landschaft Edom gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die narrative Verbform von שלח bezeichnet hier schlicht eine Handlung in der Vergangenheit; „sandte“ ist im würdevollen Erzählstil natürlich.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Das Wort kann „Boten“ oder „Engel“ bedeuten. Da Jakob sie zu Esau schickt, sind hier menschliche Boten gemeint.
- source_word: לְפָנָיו
  choice: vor sich her
  rationale: Wörtlich „vor seinem Angesicht“; die deutsche Wendung macht deutlich, dass Jakob die Boten vorausschickte.
- source_word: עֵשָׂו אָחִיו
  choice: seinem Bruder Esau
  rationale: Die Verwandtschaftsbezeichnung und der Eigenname bleiben erhalten; diese Wortstellung klingt im Deutschen natürlicher als die hebräische Reihenfolge.
- source_word: אַרְצָה שֵׂעִיר
  choice: ins Land Seïr
  rationale: Die Richtungsendung an אַרְצָה bezeichnet eine Bewegung hin zu einem Land; „ins Land Seïr“ gibt sowohl Richtung als auch Gebietsbezeichnung wieder.
- source_word: שְׂדֵה אֱדֹם
  choice: in das Gebiet Edom
  rationale: Wörtlich steht „Feld Edoms“. Im Zusammenhang fungiert die Wendung wahrscheinlich als regionale Bezeichnung; „Gebiet Edom“ ist verständlich und bewahrt den Ortsnamen als Apposition.
theological_decisions: []
translation_notes:
