  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: de
  text: 'Er vertraute seinen Dienern Herde für Herde an, jede für sich,[a] und sagte zu seinen Dienern: »Zieht vor mir her und lasst zwischen den einzelnen Herden Abstand.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er gab Herde für Herde, jede für sich, in die Hand seiner Diener.« »In die Hand geben« bedeutet hier, etwas ihrer Verantwortung oder Obhut zu überlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: vertraute … an
  rationale: Die Verbindung bedeutet wörtlich »gab in die Hand«, bezeichnet hier aber idiomatisch die Übergabe in die Verantwortung oder Obhut der Diener. »Vertraute … an« gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד kann je nach Zusammenhang »Sklave« oder »Diener« bezeichnen. Hier stehen die Angehörigen von Jakobs Hausverband in ihrer Aufgabe als seine Beauftragten im Vordergrund; »Diener« ist daher kontextgemäß.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: Herde für Herde, jede für sich
  rationale: Die Wiederholung von עֵדֶר hat distributive Bedeutung, während לְבַדּוֹ die getrennte Anordnung jeder Tiergruppe hervorhebt. Die deutsche Formulierung bewahrt beides.
- source_word: עִבְרוּ לְפָנַי
  choice: Zieht vor mir her
  rationale: עָבַר bezeichnet ein Vorüber- oder Hinüberziehen. Im Reisegeschehen weist Jakob die Diener an, ihm vorauszuziehen, ohne dass zwingend eine bestimmte Überquerung gemeint ist.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: lasst … Abstand
  rationale: רֶוַח bezeichnet einen freien Raum oder Zwischenraum. »Abstand lassen« ist die natürliche deutsche Verbindung und entspricht dem angeordneten räumlichen Abstand.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: zwischen den einzelnen Herden
  rationale: Die hebräische Wiederholung betont den Abstand von einer Herde zur nächsten. »Zwischen den einzelnen Herden« bringt diese distributive Bedeutung klar und idiomatisch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive Wiederholung des Hebräischen wird mit »Herde für Herde« bewahrt; die idiomatische Wendung »in die Hand geben« wird im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.
