  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: de
  text: Darum essen die Israeliten[a] bis zum heutigen Tag nicht den Sehnenstrang an der Hüfte[b], der am Hüftgelenk liegt; denn er hatte Jakobs Hüftgelenk an diesem Sehnenstrang berührt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue anatomische Bedeutung des hebräischen Ausdrucks ist unsicher. Gemeint ist ein Sehnen- oder Nervenstrang im Hüft- beziehungsweise Oberschenkelbereich; traditionell wird er teils mit dem Ischiasnerv oder einer zugehörigen Sehne gleichgesetzt.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die kausal-folgernde Wendung knapp und idiomatisch wieder.
- source_word: לֹא יֹאכְלוּ
  choice: essen ... nicht
  rationale: Das negierte Imperfekt beschreibt hier einen bis in die Gegenwart fortbestehenden Brauch.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Im modernen Deutschen die natürliche Bezeichnung für die Angehörigen des Volkes Israel; die wörtliche Form steht in der Fußnote.
- source_word: גִּיד הַנָּשֶׁה
  choice: Hüftsehnenstrang
  rationale: Bewahrt den Bezug zur Hüftregion und bleibt gegenüber der unsicheren genaueren anatomischen Bestimmung als Ischiasnerv oder Sehne zurückhaltend.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: der am Hüftgelenk liegt
  rationale: כַּף הַיָּרֵךְ bezeichnet hier den Gelenk- beziehungsweise Pfannenbereich von Hüfte und Oberschenkel; die Formulierung ist anatomisch verständlich, ohne unnötig technisch zu werden.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Entspricht der zeitlichen Formel und kennzeichnet die Fortdauer des Brauchs.
- source_word: כִּי נָגַע
  choice: denn ... hatte er ... berührt
  rationale: נגע wird in seiner gewöhnlichen Bedeutung »berühren« wiedergegeben; das Plusquamperfekt stellt den vorausliegenden Anlass des Brauchs klar heraus.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: dort, am Hüftsehnenstrang, hatte er Jakob am Hüftgelenk berührt
  rationale: Die örtlichen Bezüge und die Wiederholung des anatomischen Ausdrucks bleiben erhalten; »dort« macht im Deutschen den Bezug der Präpositionalphrase verständlich.
