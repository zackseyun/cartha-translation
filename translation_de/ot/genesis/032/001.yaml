  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: de
  text: Am Morgen stand Laban früh auf, küsste seine Söhne und seine Töchter[a] und segnete sie. Dann ging Laban fort und kehrte an seinen Ort zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Bezeichnungen „Söhne“ und „Töchter“ können hier weiter gefasst auch Nachkommen einschließen. Gemeint sind wahrscheinlich Labans Töchter und Enkelkinder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: stand … früh auf
  rationale: Das Hifil von שׁכם bezeichnet gewöhnlich frühes Aufstehen oder Aufbrechen. Zusammen mit בַּבֹּקֶר gibt „Am Morgen stand … früh auf“ die zeitliche Betonung natürlich und genau wieder.
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die Präpositionalverbindung bedeutet wörtlich „am Morgen“. Die Voranstellung ergibt im Deutschen einen flüssigen Erzählbeginn.
- source_word: וַיְנַשֵּׁק
  choice: küsste
  rationale: נשׁק bezeichnet hier den familiären Abschiedskuss; „küsste“ ist die direkte, natürliche Wiedergabe.
- source_word: לְבָנָיו
  choice: seine Söhne
  rationale: Der hebräische Text verwendet ausdrücklich den männlichen Verwandtschaftsbegriff. Da „Söhne“ biblisch-hebräisch auch Nachkommen bezeichnen kann, wird die mögliche weitere Bedeutung in der Fußnote erläutert.
- source_word: וְלִבְנוֹתָיו
  choice: seine Töchter
  rationale: Der hebräische Text nennt ausdrücklich „seine Töchter“. Die geschlechtsspezifische Form bleibt erhalten; eine mögliche Einbeziehung weiterer Nachkommen wird nicht in den Haupttext hineingedeutet.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: und segnete sie
  rationale: ברך bedeutet hier „segnen“. Der Abschiedskontext rechtfertigt keine Abschwächung zu bloßem Verabschieden.
- source_word: וַיֵּלֶךְ
  choice: Dann ging Laban fort
  rationale: הלך ist ein allgemeines Bewegungsverb. „ging … fort“ macht im Deutschen deutlich, dass Laban den Ort verließ, ohne dem Text zusätzliche Einzelheiten hinzuzufügen.
- source_word: וַיָּשָׁב
  choice: und kehrte … zurück
  rationale: שׁוב trägt die klare Bedeutung „zurückkehren“ und wird entsprechend direkt wiedergegeben.
- source_word: לִמְקֹמוֹ
  choice: an seinen Ort
  rationale: מקום bedeutet wörtlich „Ort“ oder „Platz“. „An seinen Ort“ wahrt die offene Formulierung des Hebräischen; „nach Hause“ wäre zwar naheliegend, aber spezifischer als der Ausgangstext.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnungen
  choice: seine Söhne und seine Töchter
  alternative: seine Kinder / seine Enkelkinder
  rationale: Der hebräische Text nennt beide Verwandtschaftsbezeichnungen ausdrücklich. Die Übersetzung bewahrt diese Form und damit auch die mögliche Spannung zwischen unmittelbaren Kindern und weiter gefassten Nachkommen. Die kontextuelle Möglichkeit, dass Enkelkinder eingeschlossen sind, wird in einer Fußnote erläutert, nicht im Haupttext festgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge folgt dem hebräischen Handlungsablauf; „an seinen Ort“ bewahrt bewusst die knappe und offene Ausdrucksweise des Ausgangstextes.
