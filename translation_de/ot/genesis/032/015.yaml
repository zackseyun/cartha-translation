  text: two hundred female goats and twenty male goats[b][a], two hundred ewes and twenty rams.
translation:
  language: de
  text: zweihundert Ziegen und zwanzig Ziegenböcke, zweihundert Mutterschafe und zwanzig Widder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: Ziegen
  rationale: Das Substantiv bezeichnet hier im Gegensatz zu den ausdrücklich genannten Ziegenböcken weibliche Ziegen. Im Deutschen wird „Ziegen“ in einer solchen Paarung natürlich geschlechtsspezifisch verstanden; „weibliche Ziegen“ wäre zwar eindeutiger, aber schwerfälliger.
- source_word: מָאתַיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: תְיָשִׁים
  choice: Ziegenböcke
  rationale: Das Wort bezeichnet männliche Ziegen. „Ziegenböcke“ ist die klare, natürliche und genaue deutsche Entsprechung.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: רְחֵלִים
  choice: Mutterschafe
  rationale: Das Wort bezeichnet weibliche Schafe. „Mutterschafe“ bewahrt den Geschlechtsunterschied zu den Widdern und ist allgemein verständlicher als das fachsprachliche „Auen“.
- source_word: אֵילִים
  choice: Widder
  rationale: Das Wort bezeichnet männliche Schafe. „Widder“ ist die übliche präzise deutsche Bezeichnung und erhält die Paarstruktur der Aufzählung.
