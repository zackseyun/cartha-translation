source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: de
  text: 'Und Jakob nannte den Ort Pniël[a]: »Denn ich habe Gott[b] von Angesicht zu Angesicht gesehen, und mein Leben wurde gerettet.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pniël bedeutet »Angesicht Gottes« und greift Jakobs Erklärung auf: »Ich habe Gott von Angesicht zu Angesicht gesehen.«'
    reason: cultural_note
  - marker: b
    text: »Gott« kann hier sprachlich auch als »ein göttliches Wesen« verstanden werden; der Zusammenhang spricht jedoch für »Gott«.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich auch: »meine Seele wurde gerettet«; »Seele« meint hier das Leben oder die eigene Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: nannte den Ort
  rationale: קרא mit שֵׁם bezeichnet hier die Namensgebung. Die natürliche deutsche Wendung gibt die hebräische Benennungsformel sinngenau wieder, ohne das schwerfällige »nannte den Namen des Ortes«.
- source_word: פְּנִיאֵל
  choice: Pniël
  rationale: Der Ortsname wird nach seiner Form an dieser Stelle transliteriert; die Schreibung mit Trema verdeutlicht die getrennte Aussprache und bewahrt den Anklang an פָּנִים und אֵל.
- source_word: כִּי
  choice: denn
  rationale: »Denn« führt Jakobs Begründung für die Namensgebung ein und erhält die kausale Verknüpfung.
- source_word: רָאִיתִי אֱלֹהִים
  choice: Ich habe Gott gesehen
  rationale: אֱלֹהִים wird im unmittelbaren Erzählzusammenhang am natürlichsten auf Gott bezogen, obwohl das Wort je nach Kontext auch ein göttliches Wesen bezeichnen kann.
- source_word: פָּנִים אֶל פָּנִים
  choice: von Angesicht zu Angesicht
  rationale: Die geläufige, würdige deutsche Wendung bezeichnet eine unmittelbare persönliche Begegnung und bewahrt das Wortspiel mit dem Ortsnamen.
- source_word: וַתִּנָּצֵל
  choice: wurde gerettet
  rationale: Die passive Verbform von נצל drückt aus, dass Jakob aus der lebensgefährlichen Begegnung bewahrt beziehungsweise gerettet wurde.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ meint hier konkret Jakobs Leben beziehungsweise ihn selbst, nicht ausdrücklich eine vom Körper getrennte Seele.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים in Jakobs Aussage
  choice: Gott
  alternative: ein göttliches Wesen
  rationale: Der Erzählzusammenhang legt eine direkte Bezugnahme auf Gott nahe. Die alternative lexikalische Möglichkeit bleibt in einer Fußnote sichtbar, ohne die Spannung des Textes aufzulösen.
- issue: Aussage über Jakobs Überleben der Gottesbegegnung
  choice: mein Leben wurde gerettet
  alternative: meine Seele wurde gerettet
  rationale: Die Wiedergabe vermeidet eine später geprägte Leib-Seele-Deutung und bezeichnet sachgerecht das erstaunliche Überleben Jakobs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von der Erzählung zur direkten Ich-Aussage wird nach dem kausalen »denn« durch einen Doppelpunkt und Anführungszeichen kenntlich gemacht, ohne ein nicht im Hebräischen stehendes »sagte er« einzufügen. Die traditionelle Wendung »von Angesicht zu Angesicht« erhält Wortspiel und feierlichen Ton.
