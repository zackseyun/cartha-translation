id: GEN.32.29
reference: Genesis 32:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: de
  text: 'Und er sagte: „Du sollst nicht mehr Jakob heißen, sondern Israel; denn du hast mit Gott[a] und mit Menschen[b] gerungen und dich durchgesetzt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „göttlichen Wesen“. Das hebräische אֱלֹהִים kann je nach Zusammenhang Gott, Götter oder himmlische Wesen bezeichnen. Hier spricht der Erzählzusammenhang für „Gott“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Männern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: sollst … heißen
  rationale: Die passive Namensformel wird im Deutschen idiomatisch mit „heißen“ wiedergegeben; der deklarative Charakter bleibt durch „sollst“ erhalten.
- source_word: עוֹד
  choice: nicht mehr
  rationale: עוֹד bezeichnet hier das Ende der bisherigen Namensbezeichnung.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'In der Gegenüberstellung der beiden Namen hat die Wendung adversative Bedeutung: nicht Jakob, sondern Israel.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Personenname wird in seiner eingebürgerten deutschen Form wiedergegeben; das folgende Verb trägt das hebräische Wortspiel zumindest teilweise weiter.
- source_word: שָׂרִיתָ
  choice: hast … gerungen
  rationale: „Ringen“ gibt den Gedanken eines intensiven Streitens oder Kämpfens wieder und lässt zugleich die Anspielung der Namensdeutung erkennen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im unmittelbaren Erzählzusammenhang ist die singularische Deutung „Gott“ am wahrscheinlichsten; die mögliche weitere Bedeutung des hebräischen Ausdrucks wird in einer Fußnote bewahrt.
- source_word: אֲנָשִׁים
  choice: Menschen
  rationale: „Menschen“ bildet den rhetorischen Gegensatz zu Gott natürlich und gegenwartssprachlich ab. Das hebräische Wort kann kontextabhängig auch spezifischer „Männer“ bezeichnen.
- source_word: וַתּוּכָל
  choice: und dich durchgesetzt
  rationale: Die Form von יכל bezeichnet hier den erfolgreichen Ausgang des Ringens. „Sich durchsetzen“ bewahrt diesen Erfolg, ohne einen vollständigen Sieg über Gott unnötig zuzuspitzen.
theological_decisions:
- issue: Bezug von אֱלֹהִים in der Namensdeutung
  choice: Gott
  alternative: göttliche Wesen / ein göttliches Wesen
  rationale: Der Erzählzusammenhang deutet Jakobs geheimnisvolle Begegnung als Begegnung mit Gott. Die Fußnote hält die lexikalische und erzählerische Mehrdeutigkeit offen.
- issue: Bedeutung des erfolgreichen Ausgangs in וַתּוּכָל
  choice: dich durchgesetzt
  alternative: obsiegt / standgehalten
  rationale: Die Übersetzung bringt Jakobs Erfolg zum Ausdruck, ohne die theologische Spannung so aufzulösen, als habe er Gott schlechthin besiegt.
- issue: Wiedergabe von אֲנָשִׁים
  choice: Menschen
  alternative: Männer
  rationale: Im Gegensatz zu Gott bezeichnet der Plural hier am natürlichsten menschliche Gegenüber allgemein; die morphologisch mögliche engere Wiedergabe wird vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformel ist idiomatisch formuliert; „gerungen“ erhält den gehobenen Ton und die Verbindung zur Namensdeutung. Die Satzstruktur bleibt knapp und nah am Hebräischen.
