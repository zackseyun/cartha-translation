  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: de
  text: 'Die Boten kehrten zu Jakob zurück[a] und sagten: »Wir sind zu deinem Bruder Esau gekommen. Auch er ist unterwegs, dir entgegen, und vierhundert Mann sind bei ihm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, in diesem Zusammenhang weniger wahrscheinlich: »Die Engel kehrten zu Jakob zurück.« Das hebräische Wort kann sowohl »Boten« als auch »Engel« bedeuten; hier sind die Abgesandten gemeint, die Jakob zu Esau geschickt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kehrten … zurück
  rationale: Das Wayyiqtol von שׁוב bezeichnet in der Erzählfolge eine abgeschlossene Rückkehr; die deutsche Verbklammer ist idiomatisch.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָכִים kann Boten oder Engel bezeichnen. Hier verweist der Kontext auf die menschlichen Abgesandten, die Jakob zuvor zu Esau geschickt hatte.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Der Infinitiv leitet direkte Rede ein; im heutigen Deutsch gibt eine finite koordinierte Form die hebräische Erzählstruktur natürlich wieder.
- source_word: בָּאנוּ אֶל אָחִיךָ אֶל עֵשָׂו
  choice: Wir sind zu deinem Bruder Esau gekommen
  rationale: בוא wird direkt mit „kommen“ wiedergegeben. Das zweite אֶל identifiziert den Bruder appositionell als Esau; im Deutschen ist die unmarkierte Apposition ohne wiederholtes „zu“ natürlicher.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Auch er ist unterwegs, dir entgegen
  rationale: גם hebt als weitere, bemerkenswerte Nachricht Esau selbst hervor. Das Partizip הֹלֵךְ beschreibt eine laufende Bewegung; „ist unterwegs“ bewahrt diesen Aspekt, während „dir entgegen“ die gerichtete Bedeutung von לִקְרָאתְךָ wiedergibt, ohne die Absicht der Begegnung vorwegzunehmen.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: und vierhundert Mann sind bei ihm
  rationale: Die eigenständige hebräische Nominalangabe wird als deutscher Satz formuliert. „Mann“ ist nach einer Zahl idiomatisch und bezeichnet hier die männliche Begleitgruppe; „bei ihm“ bewahrt die neutrale Aussage von עִמּוֹ.
theological_decisions:
- issue: Bedeutung von מַלְאָכִים
  choice: Boten im Haupttext
  alternative: Engel
  rationale: Obwohl dasselbe Wort auch übernatürliche Engel bezeichnen kann, sind hier aufgrund des unmittelbaren Zusammenhangs Jakobs menschliche Gesandte gemeint. Die lexikalische Mehrdeutigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und spannungsvoll. „Dir entgegen“ erhält die Neutralität des Hebräischen hinsichtlich Esaus Absicht; „vierhundert Mann“ wahrt die auffällige Größenangabe der Begleitung.
