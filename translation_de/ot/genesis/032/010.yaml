base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: de
  text: 'Und Jakob sagte: „Gott meines Vaters Abraham und Gott meines Vaters Isaak, Jahwe, der du zu mir gesagt hast: ›Kehre zurück in dein Land und zu deiner Verwandtschaft, und ich werde dir Gutes tun[a]‹,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde gut mit dir handeln“; gemeint ist, dass Jahwe Jakob Gutes erweisen oder wohl mit ihm verfahren wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter; „Und ... sagte“ bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Gott meines Vaters Abraham und Gott meines Vaters Isaak
  rationale: Die beiden Status-constructus-Verbindungen werden direkt wiedergegeben; der Gebetskontext macht die Anrede auch ohne zusätzliches „o“ eindeutig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאֹמֵר אֵלַי
  choice: der du zu mir gesagt hast
  rationale: Das artikulierte Partizip bezeichnet Jahwe als den, der zu Jakob sprach. Wegen der unmittelbaren Anrede ist die zweite Person im Deutschen natürlicher als eine distanzierende Relativkonstruktion in der dritten Person.
- source_word: שׁוּב
  choice: Kehre zurück
  rationale: Der Imperativ bezeichnet die Rückkehr in das Herkunftsland; „kehre zurück“ erhält den geografischen und formellen Gehalt.
- source_word: לְאַרְצְךָ
  choice: in dein Land
  rationale: Bei einer gerichteten Bewegung ist „in dein Land“ idiomatisches Deutsch und bewahrt den räumlichen Sinn von אֶרֶץ.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: und zu deiner Verwandtschaft
  rationale: מוֹלֶדֶת kann Herkunftsort oder Sippenverband bezeichnen. „Verwandtschaft“ passt hier zur familiären Herkunft, ohne den Ausdruck auf den Geburtsort zu verengen.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: dann werde ich dir Gutes tun
  rationale: Der Hifil von יטב mit עִם drückt wohltätiges, günstiges Handeln aus. Die deutsche Formulierung ist idiomatisch; „dann“ gibt den Anschluss der Zusage an den vorausgehenden Imperativ wieder, ohne eine strenge Bedingung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Aufforderung und Verheißung in וְאֵיטִיבָה
  choice: dann werde ich dir Gutes tun
  alternative: und ich werde dir Gutes tun
  rationale: Das Waw verbindet die göttliche Zusage mit dem Imperativ. „Dann“ klingt im Deutschen natürlich, soll aber keine über den Text hinausgehende verdienstliche Bedingung ausdrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt gebetssprachlich, aber ohne altertümliches „o“. Der Vers endet entsprechend dem fortlaufenden Gebet mit Komma und schließendem Anführungszeichen.
