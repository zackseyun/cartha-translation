base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: de
  text: 'So verbrachte er jene Nacht dort. Von dem, was ihm zur Hand war, nahm er ein Geschenk für seinen Bruder Esau:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּלֶן
  choice: verbrachte er ... die Nacht
  rationale: לון bezeichnet das Übernachten beziehungsweise Verbringen der Nacht; die deutsche Wendung ist natürlich und gibt den zeitlichen Sinn präzise wieder.
- source_word: שָׁם
  choice: dort
  rationale: Direkte Wiedergabe des lokalen Adverbs.
- source_word: בַּלַּיְלָה הַהוּא
  choice: jene Nacht
  rationale: Gibt den Rückverweis des hebräischen Ausdrucks idiomatisch und in würdigem modernem Deutsch wieder.
- source_word: וַיִּקַּח
  choice: nahm er
  rationale: לקח bedeutet gewöhnlich „nehmen“; im Kontext bezeichnet es das Herausnehmen beziehungsweise Auswählen der Gabe.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: von dem, was ihm zur Hand war
  rationale: Die hebräische Wendung ist wörtlich etwa „von dem, was in seine Hand kam“ und meint hier das, was verfügbar oder in seinem Besitz war. Die gewählte Formulierung bewahrt das Bild der Hand und ist zugleich verständlich.
- source_word: מִנְחָה
  choice: ein Geschenk
  rationale: מִנְחָה bezeichnet hier eine persönliche Gabe an Esau, nicht primär ein kultisches Opfer. „Geschenk“ ist im Zusammenhang klar, ohne die politische Nuance von „Tribut“ aufzuzwingen.
- source_word: לְעֵשָׂו אָחִיו
  choice: für seinen Bruder Esau
  rationale: Das לְ kennzeichnet den Empfänger; die deutsche Wortstellung benennt die familiäre Beziehung flüssig und ausdrücklich.
