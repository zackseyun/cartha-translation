  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: de
  text: Die Sonne ging über ihm auf, als er an Pnuël[a] vorbeiging, und er hinkte an seiner Hüfte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname lautet hier im Hebräischen Pnuël; an anderen Stellen erscheint auch die Form Pniël.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an seinem Oberschenkel“. Das hebräische Wort kann Hüfte oder Oberschenkel bezeichnen; die Präposition kann die betroffene Körperstelle oder den Grund des Hinkens ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח
  choice: ging … auf
  rationale: זרח bezeichnet bei der Sonne ihr Aufgehen beziehungsweise Hervorstrahlen; „ging auf“ ist die natürliche deutsche Wendung.
- source_word: לוֹ
  choice: über ihm
  rationale: Die Präposition ל bezeichnet hier idiomatisch die Person, über der die Sonne aufgeht. Die Formulierung wahrt die Perspektive des Hebräischen.
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: כַּאֲשֶׁר
  choice: als
  rationale: Die Konjunktion führt hier einen zeitlichen Begleitumstand ein.
- source_word: עָבַר אֶת פְּנוּאֵל
  choice: an Pnuël vorüberzog
  rationale: עבר kann ein Vorübergehen oder Überschreiten bezeichnen. Im Deutschen gibt „an … vorüberzog“ die Bewegung an dem genannten Ort natürlich wieder, ohne eine nicht ausdrücklich genannte Grenze oder Furt einzutragen.
- source_word: פְּנוּאֵל
  choice: Pnuël
  rationale: Der Ortsname wird nach der in diesem Vers bezeugten Form wiedergegeben und nicht an die abweichende Form Pniël angeglichen.
- source_word: וְהוּא צֹלֵעַ
  choice: und er hinkte
  rationale: Das Partizip beschreibt Jakobs anhaltenden Zustand beziehungsweise seine fortdauernde Bewegung; das deutsche Präteritum gibt dies im Erzählzusammenhang idiomatisch wieder.
- source_word: עַל יְרֵכוֹ
  choice: wegen seiner Hüfte
  rationale: עַל kann hier kausal verstanden werden. יָרֵךְ bezeichnet den Bereich von Hüfte beziehungsweise Oberschenkel. Die Hauptfassung drückt den im Kontext naheliegenden Grund seines Hinkens natürlich aus; die wörtlichere und anatomisch alternative Wiedergabe wird in der Fußnote bewahrt.
