  rationale: 'Die Revision behebt die deutsche Fehlzuordnung, die durch das reflexiv verstandene Possessivpronomen entstehen kann, und glättet die Verletzungsbeschreibung. Sie bewahrt zugleich die im Hebräischen und im englischen Audit Trail geforderte Zurückhaltung hinsichtlich der Identität des Gegners: »er« und »ihn« werden nicht mit einer benannten Gestalt identifiziert. Die Ankerfolge [b][c] bleibt erhalten.'
