  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: de
  text: Als er sah, dass er ihn nicht überwältigen konnte[a], berührte er ihn an der Hüftpfanne[b][c], und Jakobs Hüftpfanne wurde ausgerenkt, während er mit ihm rang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er ihn nicht bezwingen konnte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »die Höhlung seines Schenkels«; traditionell: »die Höhlung seiner Hüfte«.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräischen Pronomen bleiben mehrdeutig; der Vers nennt Jakobs Gegner nicht noch einmal ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als er sah
  rationale: Die Erzählform führt die Handlung fort; der temporale Anschluss »Als er sah« gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: לֹא יָכֹל לוֹ
  choice: dass er ihn nicht überwältigen konnte
  rationale: יכל mit ל bezeichnet hier das Unvermögen gegenüber dem Gegner; »überwältigen« passt zum Ringkampf, ohne eine darüber hinausgehende absolute Unfähigkeit zu behaupten.
- source_word: וַיִּגַּע
  choice: berührte
  rationale: נגע bedeutet gewöhnlich »berühren«. Trotz der heftigen Wirkung bleibt die auffällig leichte Ausdrucksweise des Hebräischen erhalten.
- source_word: בְּכַף יְרֵכוֹ
  choice: seine Hüftpfanne
  rationale: כף ירך bezeichnet hier den vertieften Gelenkbereich an Hüfte beziehungsweise Oberschenkel; »Hüftpfanne« ist verständlich und anatomisch passend.
- source_word: וַתֵּקַע
  choice: renkte sich … aus
  rationale: Das Verb beschreibt in diesem Zusammenhang, dass das Gelenk aus seiner Lage gerät. Die deutsche Konstruktion gibt den resultierenden Zustand wieder, ohne einen zusätzlichen Handelnden einzuführen.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: Jakobs Hüftpfanne
  rationale: Die Formulierung wahrt die lexikalische Übereinstimmung mit dem ersten Vorkommen und übernimmt die ausdrückliche Nennung Jakobs.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: während er mit ihm rang
  rationale: Die Präposition mit dem Infinitiv bezeichnet eine gleichzeitige Handlung. Die Pronomen bleiben wie im Hebräischen formal mehrdeutig.
theological_decisions:
- issue: Bezug der Pronomen in der Ringszene
  choice: Die hebräischen Pronomen werden beibehalten, ohne Jakobs Gegner in diesem Vers ausdrücklich zu identifizieren.
  alternative: Den Handelnden ausdrücklich als den Mann, einen Engel oder Gott bezeichnen.
  rationale: Der hebräische Vers nennt das Subjekt nicht erneut. Die fortschreitende Offenlegung der Identität von Jakobs Gegner und die damit verbundene theologische Spannung sollen nicht vorzeitig aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hüftpfanne« sorgt für Klarheit, während die Pronomen die Mehrdeutigkeit des hebräischen Erzähltexts bewahren.
