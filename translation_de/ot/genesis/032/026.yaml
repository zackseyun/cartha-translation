  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Der nicht näher identifizierte Gegner kann Jakob nicht überwältigen, berührt den Bereich der Hüfte, und Jakobs Hüftgelenk wird beim Ringen ausgerenkt. In der vorliegenden Fassung ist jedoch »berührte er seine Hüftpfanne« im Deutschen reflexiv naheliegend und kann daher fälschlich die eigene Hüftpfanne des Handelnden bezeichnen. Die Umformulierung mit »ihn an der Hüftpfanne« gibt den erzählten Bezug klar und idiomatisch wieder, ohne die Identität der beiden Personen festzulegen. »wurde ausgerenkt« bildet den resultativen Sinn von וַתֵּקַע angemessener ab als das scheinbar spontane »renkte sich aus«.'
  naturalness: Die Revision verwendet modernes, würdiges Standarddeutsch. »An der Hüftpfanne berühren« ist idiomatisch; die Wiederholung von »ihn« ist für die deutsche Satzführung klarer als ein reflexiv missverständliches Possessivpronomen.
