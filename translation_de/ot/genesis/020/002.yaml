  source_fidelity: Der Text gibt die hebräische Erzählfolge und die zurückhaltende Wortwahl zuverlässig wieder. »über seine Frau Sara« ist im Kontext eine gut begründete Wiedergabe von אֶל; die Fußnote erhält die formal nähere Möglichkeit »zu seiner Frau Sara«. »sandte nach ihr und nahm Sara zu sich« gibt וַיִּשְׁלַח … וַיִּקַּח angemessen wieder, ohne den im Vers nicht ausdrücklich genannten Status Saras näher zu bestimmen.
  naturalness: Modernes, flüssiges Standarddeutsch in würdigem Erzählregister. Die Apposition »Abimelech, der König von Gerar« und die direkte Rede sind idiomatisch.
  terminology: Die Namensform »Sara« entspricht üblichem deutschem Bibelgebrauch. »Schwester«, »König« und die zurückhaltende Formulierung »nahm … zu sich« sind terminologisch und semantisch passend; eine eheliche oder sexuelle Beziehung wird nicht in den Haupttext eingetragen.
