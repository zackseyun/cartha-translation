source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: de
  text: 'Abraham sagte über seine Frau Sara[a]: »Sie ist meine Schwester.« Da sandte Abimelech, der König von Gerar, nach ihr und nahm Sara zu sich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abraham sagte zu seiner Frau Sara«. Die hebräische Präposition kann so verstanden werden; der Zusammenhang spricht jedoch eher dafür, dass Abraham über Sara sprach.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »sandte und nahm Sara«. Gemeint ist, dass Abimelech nach Sara schicken und sie zu sich bringen ließ.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche und natürliche Wiedergabe des hebräischen Erzählverbs אמר im modernen Deutschen.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: über seine Frau Sara
  rationale: אֶל bedeutet häufig »zu«, kann hier im Zusammenhang mit אמר aber die Person bezeichnen, über die gesprochen wird. Die folgende Aussage »Sie ist meine Schwester« spricht im Kontext für diese Wiedergabe.
- source_word: אֲחֹתִי הִוא
  choice: Sie ist meine Schwester
  rationale: Direkte, idiomatische Wiedergabe des hebräischen Nominalsatzes mit dem Suffix der ersten Person Singular.
- source_word: וַיִּשְׁלַח
  choice: sandte nach ihr
  rationale: שלח bedeutet grundsätzlich »senden«. Da kein ausdrückliches Objekt genannt wird und anschließend Saras Ergreifen berichtet wird, gibt »nach ihr senden« den Vorgang im Deutschen natürlich wieder, ohne die ausgesandten Personen eigens zu ergänzen.
- source_word: מֶלֶךְ גְּרָר
  choice: der König von Gerar
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung als Apposition zu Abimelech.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: nahm Sara zu sich
  rationale: לקח bedeutet »nehmen«. »Zu sich nehmen« ist hier idiomatisch, bleibt aber zurückhaltender als die kontextuell mögliche Ausdeutung »zur Frau nehmen«.
theological_decisions:
- issue: Mögliche interpretierende Erweiterung von Abimelechs Handlung
  choice: nahm Sara zu sich
  alternative: nahm Sara zur Frau
  rationale: Der weitere Erzählzusammenhang legt eine beabsichtigte eheliche Verbindung nahe, doch dieser Vers sagt lediglich, dass Abimelech Sara »nahm«. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Die direkte Rede wird natürlich wiedergegeben; erklärende Ergänzungen und eine über den hebräischen Wortlaut hinausgehende Festlegung auf eine Eheschließung werden vermieden.
