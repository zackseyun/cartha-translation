  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: de
  text: 'Nun gib die Frau des Mannes zurück, denn er ist ein Prophet. Er wird für dich beten, und du wirst am Leben bleiben. Wenn du sie aber nicht zurückgibst, dann wisse: Du wirst ganz gewiss sterben, du und alle, die zu dir gehören.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du und alles, was dir gehört“ beziehungsweise „du und alles, was du hast“. Der hebräische Ausdruck ist weit gefasst und kann sowohl Angehörige des Haushalts als auch Abimelechs gesamten Besitz einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Die Wendung markiert den dringlichen Übergang zum gebotenen Handeln; „Nun“ gibt dies im Deutschen natürlich und würdig wieder.
- source_word: הָשֵׁב
  choice: gib … zurück
  rationale: Der Hifil-Imperativ von שוב fordert die Wiederherstellung des rechtmäßigen Zustands. „Zurückgeben“ ist mit einer Person als Objekt im heutigen Deutsch idiomatisch.
- source_word: אֵשֶׁת הָאִישׁ
  choice: die Frau des Mannes
  rationale: Bewahrt die ausdrückliche hebräische Genitivverbindung, ohne voreilig einen Namen oder ein Pronomen einzusetzen.
- source_word: כִּי נָבִיא הוּא
  choice: denn er ist ein Prophet
  rationale: כִּי begründet hier das Gebot; „denn“ erhält diesen erklärenden Zusammenhang.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: Er wird für dich beten
  rationale: Der Yiqtol bezeichnet hier die erwartete Folge; בַּעַד trägt den Sinn des Betens zugunsten eines anderen, der durch „für dich beten“ verständlich wiedergegeben wird.
- source_word: וֶחְיֵה
  choice: und du wirst am Leben bleiben
  rationale: Die Form ist morphologisch ein Imperativ, wirkt im Zusammenhang jedoch als zugesagte Folge des Gebets. Die deutsche Zukunftsform gibt diesen resultativen Sinn natürlich wieder.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Wenn du sie aber nicht zurückgibst
  rationale: Die negierte Partizipialkonstruktion bezeichnet die verweigerte Handlung. Das Objekt „sie“ wird aus dem eindeutigen Kontext aufgenommen.
- source_word: דַּע
  choice: dann wisse
  rationale: Der direkte Imperativ leitet eine feierliche Warnung ein; „dann“ verdeutlicht im Deutschen den Bedingungszusammenhang.
- source_word: מוֹת תָּמוּת
  choice: Du wirst ganz gewiss sterben
  rationale: Infinitivus absolutus und finites Verb verstärken die Gewissheit. „Ganz gewiss“ bildet die Intensivierung in modernem Deutsch ab.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: du und alle, die zu dir gehören
  rationale: Die breite hebräische Wendung kann Haushaltsangehörige und Besitz umfassen. Im Kontext einer Todesandrohung rückt die personenbezogene Wiedergabe den Haushalt in den Vordergrund, während eine Fußnote die weitere Bedeutung offenhält.
theological_decisions:
- issue: Reichweite des angedrohten Gerichts in אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: „du und alle, die zu dir gehören“
  alternative: „du und alles, was dir gehört“ / „du und dein ganzer Besitz“
  rationale: Der Erzählzusammenhang spricht für eine Ausweitung auf Abimelechs Haushalt. Da אֲשֶׁר לָךְ aber weiter gefasst sein und auch Besitz einschließen kann, wird diese Mehrdeutigkeit in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Warnung bleibt knapp und nachdrücklich; genuine semantische Breite wird nicht im Haupttext überladen, sondern in der Fußnote offengehalten.
