  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: de
  text: Da stand Abimelech früh am Morgen auf, rief alle seine Diener zusammen[a] und sagte ihnen all diese Dinge. Die Männer fürchteten sich sehr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »berief alle seine Diener ein«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Die Männer hatten große Angst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: stand ... früh am Morgen auf
  rationale: Die Verbindung gibt die hebräische Wendung für frühes Aufstehen natürlich und zeitlich genau wieder.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: rief alle seine Diener zusammen
  rationale: קרא mit ל bezeichnet hier das Herbeirufen; עֲבָדִים sind im königlichen Kontext Diener beziehungsweise Amtsträger, ohne dass der Status als Sklaven betont wird.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: berichtete ihnen alles, was geschehen war
  rationale: Wörtlich steht »sprach all diese Dinge/Worte«; im Zusammenhang bezeichnet die Wendung den Inhalt des zuvor Erlebten. Die gewählte Formulierung ist im Deutschen natürlich, macht jedoch die kontextuelle Auslegung kenntlich.
- source_word: בְּאָזְנֵיהֶם
  choice: ihnen
  rationale: Die wörtliche Wendung »in ihre Ohren« bedeutet idiomatisch, dass Abimelech es ihnen zu hören gab beziehungsweise mitteilte.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: Da fürchteten sich die Männer sehr
  rationale: Die Wiedergabe bewahrt das ausdrücklich männliche הָאֲנָשִׁים und die starke Intensivierung durch מְאֹד.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das erzählende »Da« bildet die hebräische Ereignisfolge ab, ohne altertümlich zu wirken. Die idiomatische Haupttextfassung vermeidet das im Deutschen unnatürliche »sprach alle diese Dinge in ihre Ohren«.
