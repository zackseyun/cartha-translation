lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt die aufmerksamkeitslenkende Partikel knapp und würdig wieder.
- source_word: אַרְצִי לְפָנֶיךָ
  choice: mein Land steht dir offen
  rationale: 'Gibt die idiomatische Bedeutung des wörtlichen Ausdrucks »mein Land ist vor dir« natürlich wieder: Das Land steht Abraham zur freien Wahl.'
- source_word: שֵׁב
  choice: Lass dich nieder
  rationale: Der Imperativ von ישׁב bezeichnet im Kontext das Wohnen beziehungsweise Ansiedeln, nicht bloß das Sitzen.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: wo es dir gefällt
  rationale: Natürliche deutsche Wiedergabe der hebräischen Wendung »an dem Ort, der in deinen Augen gut ist«, ohne den Sinn einzuengen.
