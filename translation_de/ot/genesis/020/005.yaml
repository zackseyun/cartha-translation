source:
  edition: WLC
  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: de
  text: 'Hat er nicht selbst zu mir gesagt: »Sie ist meine Schwester«? Und auch sie selbst hat gesagt: »Er ist mein Bruder.« Mit aufrichtigem Herzen und unschuldigen Händen[a] habe ich das getan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in der Lauterkeit meines Herzens und in der Reinheit meiner Hände«. Das Hebräische gebraucht moralisch-rechtliche Wendungen für Aufrichtigkeit und Unschuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hat er nicht ...?
  rationale: Die hebräische Frage erwartet Zustimmung; die deutsche negative Frage gibt diese rhetorische Kraft natürlich wieder.
- source_word: הוּא
  choice: er ... selbst
  rationale: Das selbstständige Pronomen hebt den Sprecher der Aussage ausdrücklich hervor.
- source_word: אָמַר לִי
  choice: zu mir gesagt
  rationale: Entspricht אמר mit indirektem Adressaten und ist im Deutschen idiomatisch.
- source_word: אֲחֹתִי הִוא
  choice: Sie ist meine Schwester
  rationale: Direkte und unmarkierte Wiedergabe der Verwandtschaftsbehauptung.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: Und auch sie selbst hat gesagt
  rationale: »auch« gibt גם wieder, »selbst« die zusätzliche Hervorhebung durch das unabhängige Pronomen.
- source_word: אָחִי הוּא
  choice: Er ist mein Bruder
  rationale: Direkte Wiedergabe der hebräischen Aussage.
- source_word: בְּתָם לְבָבִי
  choice: Mit aufrichtigem Herzen
  rationale: תָם bezeichnet hier Lauterkeit beziehungsweise ungeteilte Aufrichtigkeit; die deutsche Wendung ist verständlich und wahrt den moralischen Sinn.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: und unschuldigen Händen
  rationale: Die wörtliche Metapher der Hände bleibt erhalten; נִקְיֹן bezeichnet Reinheit beziehungsweise Schuldlosigkeit hinsichtlich des Handelns.
- source_word: עָשִׂיתִי זֹאת
  choice: habe ich das getan
  rationale: Das Perfekt bezeichnet die bereits vollzogene und nun verteidigte Handlung; das deutsche Perfekt passt zur direkten Rede.
theological_decisions:
- issue: Moralisch-rechtliche Selbstverteidigung Abimelechs
  choice: Die gekoppelten Wendungen werden als Aufrichtigkeit des Herzens und Unschuld der Hände wiedergegeben.
  alternative: »In der Lauterkeit meines Herzens und in der Reinheit meiner Hände«
  rationale: Abimelech beansprucht im Blick auf diese konkrete Tat redliche Absicht und fehlende Schuld. Die Formulierung macht daraus keine Behauptung völliger Sündlosigkeit und bewahrt zugleich die forensisch-moralische Bildsprache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »selbst« bewahrt die hebräische Hervorhebung; die Schlussformulierung ist natürlich, erhält aber durch »Hände« das Bild des hebräischen Textes.
