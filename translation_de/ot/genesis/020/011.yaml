  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: de
  text: 'Abraham sagte: „Denn ich sagte: Gewiss gibt es an diesem Ort keine Gottesfurcht[a], und man wird mich wegen meiner Frau töten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht vor Gott“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Abrahams Begründung ein und entspricht dem kausalen Sinn im Deutschen natürlich.
- source_word: אָמַרְתִּי
  choice: ich dachte
  rationale: Das gewöhnliche Verb bedeutet wörtlich „ich sagte“, bezeichnet hier aber idiomatisch Abrahams innere Überlegung; „ich dachte“ ist im modernen Deutsch natürlich.
- source_word: רַק
  choice: Gewiss
  rationale: Gibt die einschränkend-bekräftigende Kraft der Partikel in Abrahams Annahme wieder.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: es gibt keine Gottesfurcht
  rationale: Bewahrt die biblische Rede von der Furcht Gottes und ihre religiös-ethische Bedeutung.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Ortsangabe.
- source_word: וַהֲרָגוּנִי
  choice: und man wird mich töten
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit „man“ wiedergegeben; das Futur drückt Abrahams erwartete Folge aus.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: wegen meiner Frau
  rationale: Klare moderne Wiedergabe der kausalen Wendung „aufgrund meiner Frau“.
theological_decisions:
- issue: Wiedergabe von יִרְאַת אֱלֹהִים
  choice: Gottesfurcht
  alternative: Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ bewahrt den biblischen Ausdruck und seine Spannung zwischen Furcht, Ehrfurcht und sittlicher Verantwortlichkeit, ohne ihn im Haupttext einseitig abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und knapp; „Gottesfurcht“ erhält die traditionelle biblische Begrifflichkeit, während die Fußnote eine natürliche Bedeutungsalternative nennt.
