  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: de
  text: Von dort brach Abraham in Richtung des Negev[a] auf und ließ sich zwischen Kadesch und Schur nieder; in Gerar lebte er als Fremder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Süden«. Das hebräische Wort kann sowohl die südliche Region Negev als auch allgemein die Richtung Süden bezeichnen; im Haupttext steht die wahrscheinlichere geografische Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: brach … auf
  rationale: Das Qal Wayyiqtol von נסע bezeichnet hier das Aufbrechen beziehungsweise Weiterziehen und gibt die erzählerische Bewegung in natürlichem Deutsch wieder.
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Wendung verweist knapp und idiomatisch auf Abrahams bisherigen Aufenthaltsort zurück.
- source_word: אַרְצָה הַנֶּגֶב
  choice: in Richtung Negev
  rationale: Das direktive He an אַרְצָה zeigt eine Bewegung in Richtung eines Ziels an; הַנֶּגֶב bezeichnet wahrscheinlich die geografische Region Negev, kann aber auch allgemein die südliche Richtung meinen.
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: ישב bezeichnet hier ein Wohnen beziehungsweise Ansiedeln in dem Gebiet zwischen den genannten Orten; die Formulierung ist gegenwärtig und natürlich.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: zwischen Kadesch und Schur
  rationale: Die doppelte Konstruktion mit בֵּין lokalisiert Abraham zwischen zwei benannten Orten; die Namen folgen geläufigen deutschen Schreibweisen.
- source_word: וַיָּגָר
  choice: lebte … als Fremder
  rationale: גור meint den Aufenthalt als Fremder beziehungsweise Schutzbürger ohne angestammtes Heimatrecht. Die Formulierung bewahrt diese Nuance klarer als bloßes „wohnte“.
- source_word: בִּגְרָר
  choice: in Gerar
  rationale: Die Präposition בְּ ist hier lokal; „in Gerar“ ist die natürliche deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lebte als Fremder“ gibt den rechtlich-sozialen Beiklang von גור verständlich wieder, ohne auf das heute altertümliche „weilte als Fremdling“ zurückzugreifen.
