id: GEN.20.18
reference: Genesis 20:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: de
  text: Denn Jahwe hatte jeden Mutterleib im Haus Abimelechs völlig verschlossen[a] – wegen Sara, der Frau Abrahams.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ganz sicher verschlossen“ beziehungsweise „vollständig verschlossen“; im Hebräischen wird das Verb durch einen vorangestellten absoluten Infinitiv nachdrücklich verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet erklärend das Geschehen des vorangehenden Verses; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: עָצֹר עָצַר
  choice: hatte … völlig verschlossen
  rationale: Der absolute Infinitiv zusammen mit dem finiten Verb verstärkt die Aussage. Das Plusquamperfekt verdeutlicht den vorausliegenden Zustand im erzählerischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: jeden Mutterleib im Haus Abimelechs
  rationale: „Mutterleib“ bewahrt das konkrete Bild von רֶחֶם; „Haus“ bezeichnet hier die Hausgemeinschaft Abimelechs und ist im Deutschen auch in diesem Sinn verständlich.
- source_word: עַל דְּבַר
  choice: wegen
  rationale: Die Wendung bezeichnet hier den Anlass beziehungsweise Grund des göttlichen Eingreifens.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: der Frau Abrahams
  rationale: Die Apposition identifiziert Sara knapp und würdevoll anhand ihrer für den Erzählzusammenhang entscheidenden Beziehung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Art der Unfruchtbarkeit im Haus Abimelechs
  choice: jeden Mutterleib … verschlossen
  alternative: alle Frauen unfruchtbar gemacht
  rationale: Die konkrete und umfassende Formulierung des Hebräischen bleibt erhalten, ohne genauer festzulegen, welche körperliche Auswirkung bei jeder Betroffenen vorlag.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Körpermetapher „Mutterleib“ und der Eigenname „Jahwe“ werden bewahrt; der Gedankenstrich hebt die nachgestellte Begründung hervor.
