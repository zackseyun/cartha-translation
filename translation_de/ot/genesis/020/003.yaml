    rationale: Die Wendung ist zwar feierlich, bedeutet im Deutschen jedoch häufig „dem Tod verfallen/des Todes schuldig“ und kann damit ein rechtliches Urteil statt der hebräischen Aussage „du bist tot“ bzw. „du wirst gewiss sterben“ nahelegen.
  - severity: low
