  source_fidelity: 'Die Grundstruktur folgt dem Hebräischen zuverlässig: Gottes Erscheinen im nächtlichen Traum, die direkte Warnung, der Grund („wegen der Frau“) und ihr bestehender Ehestatus sind vorhanden. „Du bist des Todes“ verschiebt jedoch die prädikative Todesansage מֵת in eine im heutigen Deutsch primär rechtlich-archaisch klingende Formel („des Todes schuldig/verfallen“).'
  naturalness: „Nachts im Traum“ ist verständlich, aber „in der Nacht in einem Traum“ ist klarer und idiomatischer. „Du bist ein toter Mann“ gibt die unmittelbar drohende, sichere Todesansage in würdigem modernem Standarddeutsch deutlich wieder, ohne die missverständliche Rechtsformel „des Todes“ zu verwenden.
  terminology: „Gott“, „Abimelech“, „genommen“ und „verheiratet“ sind angemessen. Die Fußnote zu בְּעֻלַת בָּעַל sollte die hebräische Formulierung nicht als „die Frau eines Ehemannes“ paraphrasieren; treffender ist die Erklärung, dass sie bereits einen Ehemann hat bzw. einem Ehemann angetraut ist.
