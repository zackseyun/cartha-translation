  rationale: Die Revision ersetzt eine im modernen Deutsch potenziell anders verstandene Rechtsformel durch die idiomatische Warnung „du bist ein toter Mann“. Sie verdeutlicht zugleich die nächtliche Traumoffenbarung und korrigiert die Fußnotenerklärung zur hebräischen Eheformel, ohne deren Aussage über den bestehenden Ehestatus zu erweitern.
