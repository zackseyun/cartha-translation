base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: de
  text: 'Doch Gott kam in der Nacht in einem Traum zu Abimelech und sagte zu ihm: »Sieh, du bist ein toter Mann[a] wegen der Frau, die du genommen hast; denn sie ist verheiratet[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sieh, du bist tot«; möglich ist auch: »Sieh, du wirst sterben.« Das Hebräische bezeichnet den Tod als sicher und unmittelbar drohend.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich etwa: »sie ist einem Ehemann angetraut«; das heißt, sie hat bereits einen Ehemann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das Qal-Wayyiqtol von בוא führt die Erzählung fort. „Kam“ gibt die Begegnung wieder, ohne ein körperliches Eintreten in einen Ort anzunehmen.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: nachts im Traum
  rationale: Die natürliche deutsche Wendung bewahrt sowohl die Traumoffenbarung als auch ihren nächtlichen Zeitpunkt.
- source_word: הִנְּךָ מֵת
  choice: Sieh, du bist des Todes
  rationale: Die feierliche Warnformel und das partizipiale מֵת bezeichnen einen sicheren, unmittelbar drohenden Tod. Die deutsche Wendung wahrt die Spannung zwischen gegenwärtigem Todesurteil und bevorstehendem Sterben.
- source_word: עַל הָאִשָּׁה
  choice: wegen der Frau
  rationale: עַל nennt hier den Grund des angedrohten Todes.
- source_word: לָקַחְתָּ
  choice: die du genommen hast
  rationale: „Genommen“ entspricht dem allgemeinen Verb לקח und unterstellt weder Gewalt noch weitere, im Text nicht ausdrücklich genannte Umstände.
- source_word: בְּעֻלַת בָּעַל
  choice: sie ist verheiratet
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet klar ihre bestehende Bindung an einen Ehemann, ohne die possessive Formulierung des Hebräischen unnatürlich nachzuahmen.
theological_decisions:
- issue: Zeitliche und rechtliche Kraft von הִנְּךָ מֵת
  choice: du bist des Todes
  alternative: du bist tot / du wirst sterben
  rationale: Die gewählte Wendung erhält die Gewissheit des göttlichen Urteils und lässt zugleich offen, ob die hebräische Form stärker als gegenwärtiger Status oder als unmittelbar bevorstehende Folge verstanden wird.
- issue: Bedeutung von בְּעֻלַת בָּעַל
  choice: sie ist verheiratet
  alternative: sie hat einen Ehemann / sie gehört einem Ehemann
  rationale: „Verheiratet“ gibt den bestehenden ehelichen Status natürlich und sachlich wieder. „Gehört einem Ehemann“ könnte im heutigen Deutsch eine weitergehende Eigentumsaussage nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ bewahrt die eindringliche Warnfunktion von הִנֵּה, während „du bist des Todes“ die feierliche Urteilssprache natürlich wiedergibt. Alle Fußnotenmarker stehen an der jeweils erklärten Stelle.
