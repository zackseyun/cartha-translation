  to: 'Darauf sagte Gott zu ihm im Traum[a]: »Ja, ich weiß, dass du dies mit aufrichtigem Herzen getan hast. Auch ich habe dich davor bewahrt, gegen mich zu sündigen. Deshalb habe ich nicht zugelassen, dass du sie berührst.[b]«'
