  terminology: »Mit aufrichtigem Herzen« gibt die moralische Lauterkeit von תֹּם wieder, ohne vollständige Unschuld zu behaupten. »Gegen mich zu sündigen« bildet מֵחֲטֹא לִי angemessen ab. »Berühren« bewahrt die zurückhaltende sexuelle Umschreibung des Hebräischen.
