  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: de
  text: 'Darauf sagte Gott zu ihm im Traum[a]: »Ja, ich weiß, dass du dies mit aufrichtigem Herzen getan hast. Auch ich habe dich davor bewahrt, gegen mich zu sündigen. Deshalb habe ich nicht zugelassen, dass du sie berührst.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »in einem Traum«. Der hebräische Artikel spricht in diesem Zusammenhang eher für den bestimmten Traum.'
    reason: lexical_alternative
  - marker: b
    text: »Sie berühren« ist hier eine zurückhaltende Umschreibung für sexuellen Kontakt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹום
  choice: im Traum
  rationale: Der Artikel weist im Erzählzusammenhang auf den bereits erwähnten konkreten Traum zurück; im Deutschen ist »im Traum« zugleich die natürliche Formulierung.
- source_word: גַּם אָנֹכִי יָדַעְתִּי
  choice: Ja, ich weiß
  rationale: גַּם אָנֹכִי hebt Gottes bestätigende Antwort hervor. »Ja, ich« gibt diese Betonung im heutigen Deutsch natürlich wieder.
- source_word: בְתָם לְבָבְךָ
  choice: mit ungeteiltem Herzen
  rationale: תֹּם bezeichnet Ganzheit, Lauterkeit oder Integrität. »Mit ungeteiltem Herzen« wahrt das Bild des hebräischen Ausdrucks, ohne eine umfassende Schuldlosigkeit Abimelechs zu behaupten.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: Auch ich habe dich davor bewahrt
  rationale: חָשַׂךְ bezeichnet hier das Zurückhalten beziehungsweise Verhindern einer Handlung; »bewahrt« ist verständlich und bringt Gottes aktives Eingreifen zum Ausdruck.
- source_word: מֵחֲטוֹ לִי
  choice: davor, gegen mich zu sündigen
  rationale: מִן mit dem Infinitiv bezeichnet die verhinderte Handlung; לִי kennzeichnet Gott als den, gegen den sich die Sünde gerichtet hätte.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Die Wendung führt die konkrete Folge beziehungsweise Erläuterung des göttlichen Bewahrens ein.
- source_word: לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ
  choice: habe ich dich sie nicht berühren lassen
  rationale: נָתַן mit Infinitiv bedeutet hier »zulassen«. »Berühren« bewahrt die zurückhaltende Ausdrucksweise des Ausgangstextes.
theological_decisions:
- issue: Die Sünde als Sünde gegen Gott
  choice: »gegen mich zu sündigen«
  alternative: »mir gegenüber schuldig zu werden«
  rationale: Das hebräische לִי stellt die beabsichtigte Tat ausdrücklich als Vergehen gegen Gott dar. Die Übersetzung wahrt diese Aussage, ohne die ebenfalls betroffenen Menschen aus dem Kontext auszuschließen.
- issue: Abimelechs תֹּם לֵבָב und Gottes Eingreifen
  choice: Abimelechs aufrichtige Absicht wird anerkannt, zugleich wird die verhinderte Tat Gottes Bewahren zugeschrieben.
  alternative: תֹּם als vollständige moralische oder rechtliche Unschuld wiederzugeben
  rationale: Der Vers hält menschliche Integrität und göttliches Verhindern nebeneinander. »Ungeteiltes Herz« vermeidet es, diese Spannung zugunsten völliger Schuldlosigkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und natürlich; die zurückhaltende sexuelle Ausdrucksweise und die Wiederholung des betonten göttlichen »ich« werden gewahrt.
