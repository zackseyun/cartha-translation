source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: de
  text: 'Abimelech aber hatte sich ihr nicht genähert.[a] Da sagte er: »Herr, willst du sogar ein gerechtes Volk[b] töten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »sich ihr nähern« meint hier, dass Abimelech keinen Geschlechtsverkehr mit Sara gehabt hatte.
    reason: cultural_note
  - marker: b
    text: 'Oder: »eine gerechte Nation«. Das hebräische Wort bezeichnet kollektiv ein Volk oder eine Nation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: hatte sich ihr noch nicht genähert
  rationale: Die Formulierung bewahrt das hebräische Bild vom Sich-Nähern. Im Zusammenhang ist damit gemeint, dass Abimelech keinen Geschlechtsverkehr mit Sara gehabt hatte; eine Fußnote macht diese Bedeutung deutlich, ohne sie im Haupttext auszudeuten.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Abimelech redet Gott im Traum mit einem Hoheitstitel an. »Herr« ist im Deutschen natürlich und fügt weder »mein« noch »Gott« hinzu.
- source_word: גּוֹי
  choice: Volk
  rationale: Das hebräische Wort bezeichnet kollektiv ein Volk beziehungsweise eine Nation. »Volk« klingt in dieser direkten Bitte natürlich und wahrt den gemeinschaftlichen Umfang der drohenden Strafe.
- source_word: גַּם
  choice: sogar
  rationale: 'In der rhetorischen Frage verstärkt גַּם Abimelechs Einwand: Die behauptete Gerechtigkeit des Volkes macht dessen Tötung für ihn besonders unbegreiflich.'
- source_word: צַדִּיק
  choice: gerecht
  rationale: »Gerecht« bewahrt die zentrale biblische Wortverbindung und lässt zugleich die kontextuelle Bedeutung »unschuldig in dieser Sache« mitschwingen.
- source_word: תַּהֲרֹג
  choice: willst du … töten
  rationale: Die direkte Frage gibt den hebräischen Imperfekt natürlich wieder. »Töten« ist modern und weniger archaisch als »erschlagen«.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Abimelech aber … Da sagte er
  rationale: »Aber« markiert den sachlichen Gegensatz zur drohenden Gefahr, während »Da sagte er« den Fortgang der Erzählung wiedergibt, ohne ein nicht ausdrücklich vorhandenes Zeitadverb einzuführen.
theological_decisions:
- issue: Kollektiver Umfang von Abimelechs Bitte
  choice: גּוֹי wird als »Volk« wiedergegeben und nicht auf Abimelech allein oder nur auf sein Haus eingeengt.
  alternative: »Nation« oder eine ausdrückliche Eingrenzung auf Abimelechs Haushalt
  rationale: Der hebräische Kollektivbegriff lässt den genauen politischen und sozialen Umfang offen. »Volk« erhält sowohl die gemeinschaftliche Dimension als auch diese Offenheit.
- issue: Bedeutungsumfang von צַדִּיק
  choice: »gerecht«
  alternative: »unschuldig«
  rationale: »Unschuldig« würde den Ausdruck eindeutig auf den konkreten Vorwurf beschränken. »Gerecht« bewahrt die breitere moralisch-theologische Spannung der Aussage, ohne auszuschließen, dass Abimelech hier vor allem Schuldlosigkeit in dieser Sache geltend macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtlich-bildhafte Wendung »sich ihr nähern« bleibt erhalten und wird in der Fußnote erklärt. »Volk« ist im Deutschen natürlicher als »Nation«, ohne den kollektiven Sinn zu verengen.
