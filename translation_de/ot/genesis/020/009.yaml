  source_fidelity: 'Der Sinn des Verses wird insgesamt zuverlässig wiedergegeben: Abimelechs Vorwurf, die gegen ihn und sein Königreich gebrachte schwere Sünde sowie die abschließende normative Missbilligung sind erhalten. Das zusätzliche verstärkende »so« bei »eine so große Sünde« hat jedoch keine ausdrückliche Entsprechung im Hebräischen. Außerdem ist das hebräische Pluralwort מַעֲשִׂים genauer als »Dinge« wiederzugeben.'
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch. »Abraham zu sich rufen« und »mir antun« passen zum vorwurfsvollen Kontext. Mit »Dinge, die man nicht tun darf« wird der Schlusssatz zugleich idiomatisch und näher an der pluralischen Vorlage.
  terminology: »Sünde« gibt חֲטָאָה angemessen wieder, ohne die im Kontext mögliche Nuance von Schuld oder Vergehen einseitig festzulegen. »Königreich« ist für מַמְלַכְתִּי möglich und verständlich. Es sind keine Fußnoten erforderlich.
