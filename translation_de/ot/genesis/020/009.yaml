  to: 'Da rief Abimelech Abraham zu sich und sagte zu ihm: »Was hast du uns angetan? Und was habe ich gegen dich gesündigt, dass du über mich und mein Königreich eine große Sünde gebracht hast? Dinge, die man nicht tun darf, hast du mir angetan.«'
