  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: de
  text: 'Da rief Abimelech Abraham zu sich und sagte zu ihm: »Was hast du uns angetan? Und was habe ich gegen dich gesündigt, dass du über mich und mein Königreich eine große Sünde gebracht hast? Dinge, die man nicht tun darf, hast du mir angetan.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: Da rief Abimelech Abraham zu sich
  rationale: קרא mit לְ bei einer Person kann das Rufen oder Herbeirufen bezeichnen. »Rief ... zu sich« ist im Deutschen natürlich und gibt den situativen Sinn wieder, ohne eine förmliche Vorladung vorauszusetzen.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Was hast du uns angetan?
  rationale: Das deutsche »antun« gibt hier den vorwurfsvollen Charakter und die gegen die Betroffenen gerichtete Handlung treffend wieder.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Und was habe ich gegen dich gesündigt
  rationale: Die Wiedergabe bewahrt die ausdrücklich moralische Bedeutung von חטא sowie das unbestimmte Fragewort מֶה, ohne es zu »wie« umzudeuten.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt beziehungsweise die Folge des vorangehenden Vorwurfs ein; »dass« verbindet die rhetorische Frage idiomatisch mit dem Folgesatz.
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: du über mich und mein Königreich ... gebracht hast
  rationale: Die Kausativform von בוא wird mit »bringen« wiedergegeben; »über ... bringen« ist die natürliche deutsche Verbindung für drohendes Unheil, Schuld oder Sünde.
- source_word: חֲטָאָה גְדֹלָה
  choice: eine so große Sünde
  rationale: »Sünde« erhält das moralisch-religiöse Gewicht von חטאה. Das verstärkende »so« passt zum empörten Ton, ohne den Sachgehalt zu verändern.
- source_word: מַמְלַכְתִּי
  choice: mein Königreich
  rationale: »Königreich« bezeichnet klar Abimelechs Herrschaftsbereich und entspricht der üblichen Bedeutung des Nomens.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: Was man nicht tun darf
  rationale: Die unpersönliche Passivform bezeichnet hier nicht nur ungebräuchliche, sondern unzulässige Handlungen. Die deutsche Wendung gibt diese normative Kraft knapp und natürlich wieder.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: hast du mir angetan
  rationale: עשה עם bezeichnet hier das Handeln an beziehungsweise gegenüber einer Person. »Mir angetan« bewahrt den persönlichen Vorwurf und bildet mit dem vorangestellten Relativsatz einen idiomatischen deutschen Satz.
theological_decisions:
- issue: Bedeutung von חֲטָאָה im Blick auf Abimelech und sein Reich
  choice: eine so große Sünde
  alternative: eine so große Schuld / ein so schweres Vergehen
  rationale: Der Text lässt offen, ob vor allem die drohende Tat, die daraus entstehende Schuld oder deren Folgen gemeint sind. »Sünde« bewahrt diese theologische Spannung besser als eine rein rechtliche oder folgenbezogene Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, eindringlicher Anklage. Die Wiederholung von »angetan« verbindet Anfang und Schluss wie im hebräischen Vorwurf; die ungewöhnlichere Formulierung »was habe ich gegen dich gesündigt« hält die Nähe zum Ausgangstext aufrecht.
