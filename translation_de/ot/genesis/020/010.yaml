  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: de
  text: 'Darauf sagte Abimelech zu Abraham: »Was hast du gesehen[a], dass du das getan hast?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was hattest du im Sinn, dass du das getan hast?« Wörtlich heißt es im Hebräischen: »Was hast du gesehen …?« Das Verb »sehen« kann hier idiomatisch bezeichnen, was jemand wahrnahm, erwog oder vor Augen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Darauf sagte
  rationale: Das narrative Waw führt die Handlung weiter. »Darauf« gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל־אַבְרָהָם
  choice: zu Abraham
  rationale: Die Präposition bezeichnet den Adressaten der Rede; »zu Abraham« ist die natürliche deutsche Konstruktion nach »sagte«.
- source_word: מָה רָאִיתָ
  choice: Was hast du gesehen
  rationale: Die Übersetzung bewahrt das hebräische Bild des Sehens. Gemeint sein kann, was Abraham wahrnahm, erwog oder im Sinn hatte; diese idiomatische Bedeutungsweite wird in einer Fußnote kenntlich gemacht.
- source_word: כִּי
  choice: dass
  rationale: Hier verbindet כִּי die Frage nach Abrahams Wahrnehmung oder Beweggrund mit seiner daraus hervorgegangenen Handlung. »Dass« erhält die auffällige hebräische Verknüpfung.
- source_word: עָשִׂיתָ
  choice: du getan hast
  rationale: »Tun« entspricht dem allgemeinen hebräischen Verb, ohne die Handlung durch »handeln« oder eine moralisch stärker gefärbte Formulierung auszudeuten.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: das
  rationale: Im Deutschen verweist das substantivierte Pronomen natürlich auf die bereits bekannte Handlung. Ein wörtliches »diese Sache« wäre möglich, klänge hier aber weniger idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die ungewöhnliche hebräische Wendung »Was hast du gesehen?« bleibt im Haupttext erhalten; ihre idiomatische Bedeutung wird erläutert. Die direkte Rede folgt der im Deutschen üblichen Zeichensetzung.
