  source_fidelity: 'Die Übersetzung gibt die kausative Aussage von הִתְעוּ angemessen wieder: Gott ist der Handelnde, Abraham derjenige, der aus dem Haus seines Vaters zum Umherziehen veranlasst wurde. Die distributive Ortsangabe, die Bitte um erwiesene חסד und die Aussage »Er ist mein Bruder« bleiben erhalten. Die Wiedergabe wahrt die im Hebräischen bestehende Spannung, ohne ein moralisches Abirren zu unterstellen.'
