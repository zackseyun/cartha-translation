source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: de
  text: 'Und als Gott mich aus dem Haus meines Vaters umherziehen ließ[a], sagte ich zu ihr: »Diese Güte[b] sollst du mir erweisen: An jedem Ort, an den wir kommen, sag von mir: ›Er ist mein Bruder.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „umherirren ließ“ oder „zum Umherwandern brachte“. Das hebräische Verb ist kausativ und kann Umherziehen, Umherirren oder Abirren bezeichnen; hier muss damit kein moralisches Fehlgehen gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann außer „Güte“ auch treue Zuwendung oder loyale Liebe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: ließ mich … umherziehen
  rationale: Die Hifil-Form von תעה bezeichnet ein Veranlassen zum Umherziehen oder Umherirren. „Umherziehen ließ“ wahrt die kausative Aussage und vermeidet zugleich den unnötigen moralischen Beiklang von „in die Irre führen“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet אֱלֹהִים hier im Kontext den einen Gott Abrahams; die deutsche Singularform gibt den Bezug angemessen wieder.
- source_word: מִבֵּית אָבִי
  choice: aus dem Haus meines Vaters
  rationale: Die Formulierung bewahrt das hebräische Familien- und Haushaltsbild und ist im Deutschen klar verständlich.
- source_word: חַסְדֵּךְ
  choice: diese Güte
  rationale: חסד kann Güte, treue Zuwendung oder Loyalität bezeichnen. Im unmittelbaren Zusammenhang einer persönlichen Bitte ist „Güte“ natürlich und lässt die weitere Bedeutungsbreite offen.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: sollst du mir erweisen
  rationale: Wörtlich steht eine Wendung wie „mit mir tun“. In Verbindung mit „Güte“ entspricht „mir erweisen“ natürlichem und gehobenem Deutsch.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: An jedem Ort, an den wir kommen
  rationale: Die distributive Aussage über jeden erreichten Ort bleibt erhalten, ohne sie zum allgemeineren „wohin wir auch gehen“ abzuschwächen.
- source_word: אִמְרִי לִי
  choice: sag von mir
  rationale: Das hebräische „sage zu/für mich“ meint im Kontext, was Sara gegenüber anderen über Abraham sagen soll. „Sag von mir“ gibt dies knapp wieder.
- source_word: אָחִי הוּא
  choice: Er ist mein Bruder
  rationale: Die direkte Behauptung wird ohne Verallgemeinerung zu „Verwandter“ beibehalten, da die Erzählung gerade an der Bezeichnung als Bruder hängt.
theological_decisions:
- issue: Gottes Rolle bei Abrahams Weggang und unstetem Umherziehen
  choice: Gott ließ Abraham aus dem Haus seines Vaters umherziehen
  alternative: Gott gestattete Abraham umherzuziehen; die Götter ließen Abraham umherziehen
  rationale: Der hebräische Text nennt אֱלֹהִים als Subjekt einer kausativen Verbform. Die Übersetzung erhält diese göttliche Veranlassung, ohne sie zu bloßer Erlaubnis abzuschwächen oder durch „in die Irre führen“ moralisch zuzuspitzen. Eine pluralische Wiedergabe als „Götter“ ist formal denkbar, im Erzählzusammenhang aber nicht naheliegend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sag“ erhält die direkte persönliche Rede und ist trotz seiner Schlichtheit nicht salopp. Die Satzstruktur bleibt nahe am Hebräischen, wird aber idiomatisch geglättet.
