source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: de
  text: 'Außerdem ist sie tatsächlich meine Schwester: Sie ist die Tochter meines Vaters, aber nicht die Tochter meiner Mutter. Und sie wurde meine Frau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Außerdem
  rationale: Die Verbindung aus Konjunktion und additiver Partikel führt einen weiteren Punkt in Abrahams Rechtfertigung ein; »Außerdem« gibt diese Gesprächsfunktion im modernen Deutsch natürlich wieder.
- source_word: אָמְנָה
  choice: tatsächlich
  rationale: Das Adverb bekräftigt den Wahrheitsgehalt der Aussage; »tatsächlich« ist klar, gegenwärtig und dem würdigen Erzählton angemessen.
- source_word: אֲחֹתִי
  choice: meine Schwester
  rationale: Direkte Wiedergabe der Verwandtschaftsbezeichnung mit Suffix der ersten Person Singular.
- source_word: בַת אָבִי
  choice: die Tochter meines Vaters
  rationale: Die appositionelle Formulierung erklärt, in welchem Sinn Sara Abrahams Schwester ist, und bewahrt die Parallelität zum folgenden Ausdruck.
- source_word: הִוא
  choice: sie ist
  rationale: Der selbstständige Ausdruck steht in einem hebräischen Nominalsatz; im Deutschen entspricht ihm hier natürlich das Präsens mit Kopula.
- source_word: אַךְ לֹא
  choice: aber nicht
  rationale: Die Partikel schränkt die vorangehende Aussage ein. »Aber nicht« bewahrt den klaren Gegensatz, ohne zusätzliche Deutung einzutragen.
- source_word: בַת אִמִּי
  choice: die Tochter meiner Mutter
  rationale: Parallele und genaue Wiedergabe der familiären Bestimmung.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: Und sie wurde meine Frau
  rationale: Die Konstruktion mit היה und ל bezeichnet den Eintritt in die Ehe; »wurde meine Frau« bewahrt diesen ereignishaften Sinn idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Die verwandtschaftliche Aussage wird ohne harmonisierende oder konfessionelle Zusätze wiedergegeben; der Doppelpunkt macht die nachfolgende Erläuterung im Deutschen transparent.
