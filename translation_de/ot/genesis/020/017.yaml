base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: de
  text: Da betete Abraham zu Gott, und Gott heilte Abimelech, seine Frau und seine Dienerinnen[a], und seine Frau und seine Dienerinnen gebaren Kinder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklavinnen«; das hebräische Wort kann weibliche Bedienstete oder versklavte Frauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und sie gebaren«; »Kinder« ist im Deutschen sinngemäß ergänzt.'
    reason: translation_clarity
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: betete
  rationale: Das Hitpael von פלל bedeutet hier schlicht „beten“. Der Zusammenhang zeigt eine Fürbitte, doch diese Bedeutungsnuance muss nicht ausdrücklich in den Haupttext aufgenommen werden.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Die natürliche deutsche Wendung lautet „zu Gott beten“; der hebräische Artikel wird vor dem Eigennamen „Gott“ nicht eigens wiedergegeben.
- source_word: וַיִּרְפָּא
  choice: heilte
  rationale: רפא bedeutet „heilen“. Die Wiedergabe bleibt bei der direkten lexikalischen Bedeutung, ohne die Art des Leidens näher festzulegen.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der Personenname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Natürliche und genaue Wiedergabe der possessiven Nominalverbindung.
- source_word: אַמְהֹתָיו
  choice: seine Dienerinnen
  rationale: אָמָה bezeichnet eine weibliche Dienerin beziehungsweise Sklavin. „Dienerinnen“ ist verständliches modernes Deutsch; die mögliche stärkere Statusbezeichnung wird in der Fußnote bewahrt.
- source_word: וַיֵּלֵדוּ
  choice: und sie gebaren Kinder
  rationale: Das Verb ילד bezeichnet das Gebären. „Kinder“ ist im Hebräischen nicht ausdrücklich genannt, im Deutschen hier jedoch eine natürliche Ergänzung. Das einfache „und“ erhält die formale Offenheit des hebräischen Anschlusses.
theological_decisions:
- issue: Verhältnis des letzten Verbs zur Heilung
  choice: Die Schlussaussage wird mit „und sie gebaren Kinder“ angeschlossen.
  alternative: „sodass sie Kinder gebaren“
  rationale: Der Kontext, besonders Vers 18, legt ein Ergebnis der Heilung nahe. Das hebräische וַ־ bezeichnet hier jedoch nicht ausdrücklich einen Zwecksatz; „und“ bewahrt sowohl die narrative Abfolge als auch den im Kontext erkennbaren Ergebniszusammenhang.
- issue: Sozialer Status bei אָמָה
  choice: Im Haupttext steht „Dienerinnen“.
  alternative: „Sklavinnen“ oder „Mägde“
  rationale: „Dienerinnen“ ist modern und würdevoll, während „Mägde“ altertümlich wirkt. Da אָמָה auch eine versklavte Frau bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der Satzbau folgt der knappen hebräischen Erzählweise. Die traditionelle Form „gebaren“ ist hier präzise und weiterhin verständlich; eine stärker deutende Ergebnisformulierung wurde vermieden.
