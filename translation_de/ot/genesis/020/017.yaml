  terminology: „Gott“, „Abimelech“, „Frau“, „Dienerinnen“ und „heilte“ sind angemessen. „Dienerinnen“ ist als moderne Haupttextwiedergabe von אמהות vertretbar; die Fußnote macht die mögliche Bedeutung „Sklavinnen“ ausreichend kenntlich. Die Fußnotenmarker stehen im deutschen Text bei den jeweils erläuterten Ausdrücken.
