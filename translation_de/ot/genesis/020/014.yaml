  text: וַ/יִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּ/בָקָ֗ר וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/יִּתֵּ֖ן לְ/אַבְרָהָ֑ם וַ/יָּ֣שֶׁב ל֔/וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: de
  text: Da nahm Abimelech Schafe und Rinder, Sklaven und Sklavinnen und gab sie Abraham. Dann gab er Abraham seine Frau Sara zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die gewöhnliche Bedeutung von לקח bewahrt die schlichte Erzählfolge, ohne eine nicht ausdrücklich vorhandene Nuance hinzuzufügen.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן kann Kleinvieh einschließlich Schafen und Ziegen bezeichnen; in der Paarung mit בָקָר ist „Schafe“ eine knappe, natürliche Wiedergabe.
- source_word: בָקָר
  choice: Rinder
  rationale: בָקָר bezeichnet Rindvieh als Sammelbegriff; „Rinder“ ist im modernen Deutschen präzise und idiomatisch.
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: עֶבֶד kann je nach Kontext Diener oder Sklave bedeuten. Da Menschen hier zusammen mit Vieh übergeben werden, macht „Sklaven“ den unfreiwilligen beziehungsweise rechtlich abhängigen Status sichtbar.
- source_word: שְׁפָחוֹת
  choice: Sklavinnen
  rationale: שִׁפְחָה bezeichnet eine weibliche Sklavin beziehungsweise unfreie Hausangehörige. „Sklavinnen“ wahrt die ausdrücklich weibliche Form und entspricht dem Übergabekontext.
- source_word: וַיִּתֵּן
  choice: gab sie
  rationale: נתן bedeutet schlicht „geben“; das ergänzte Pronomen „sie“ nimmt im Deutschen natürlich die zuvor genannten Tiere und Menschen auf.
- source_word: וַיָּשֶׁב
  choice: gab … zurück
  rationale: Der Hifil von שוב bedeutet „zurückbringen“ oder „wiederherstellen“. „gab … zurück“ ist eine natürliche deutsche Wiedergabe der transitiven Konstruktion.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Das Suffix bezieht sich auf Abraham. Die deutsche Formulierung „seine Frau Sara“ bezeichnet die im Hebräischen ausgedrückte Beziehung klar.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen verweist auf Abraham; „ihm“ ist nach dessen Nennung eindeutig und bildet die hebräische Pronominalform knapp ab.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die koordinierenden hebräischen Verbfolgen werden in zwei deutsche Sätze gegliedert, um den möglichen falschen Bezug von „seine Frau“ auf Abimelech zu vermeiden. „Sklaven und Sklavinnen“ benennt den im Übergabekontext erkennbaren unfreien Status, ohne ihn durch „Diener“ abzuschwächen.
