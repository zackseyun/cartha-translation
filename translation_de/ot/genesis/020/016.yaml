  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: de
  text: 'Zu Sara sagte er: »Sieh, ich habe deinem Bruder tausend Silberstücke gegeben. Sieh, es ist für dich eine Bedeckung der Augen[a] für alle, die bei dir sind; und vor allen bist du als im Recht erwiesen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Verhüllung der Augen«. Die ungewöhnliche Wendung meint wahrscheinlich eine öffentliche Wiedergutmachung, die das geschehene Unrecht zudeckt und Saras Ansehen wiederherstellt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von jedem Vorwurf befreit« beziehungsweise »vor allen zurechtgewiesen«. Der hebräische Schlusssatz ist sehr schwer zu deuten und kann auch im Sinn von »damit ist die Sache vor allen geklärt« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: tausend Silberstücke
  rationale: Wörtlich steht »tausend Silber«. »Silberstücke« bezeichnet natürlich eine nicht näher bestimmte Silberzahlung, ohne die im Hebräischen nicht ausdrücklich genannte Einheit Schekel einzutragen.
- source_word: לְאָחִיךְ
  choice: deinem Bruder
  rationale: Die wörtliche Bezeichnung bewahrt den Rückbezug auf Saras und Abrahams Darstellung sowie die darin liegende Ironie.
- source_word: כְּסוּת עֵינַיִם
  choice: eine Bedeckung der Augen
  rationale: Die seltene und schwierige Wendung wird als Metapher bewahrt, statt im Haupttext auf nur eine Deutung wie Wiedergutmachung, Ehrenschutz oder Schleier festgelegt zu werden.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: für alle, die bei dir sind
  rationale: Die Präposition לְ wird direkt wiedergegeben; die Formulierung lässt offen, wie genau die Zahlung auf Saras Umfeld bezogen ist.
- source_word: וְאֵת כֹּל
  choice: und vor allen
  rationale: Die knappe, syntaktisch schwierige Formulierung wird im Zusammenhang als Ausweitung auf die öffentliche Wahrnehmung wiedergegeben, ohne die hebräische Uneindeutigkeit zu verschweigen.
- source_word: וְנֹכָחַת
  choice: bist du ins Recht gesetzt
  rationale: Die Wiedergabe erfasst den möglichen Nifal-Sinn von יכח als öffentliches Erweisen beziehungsweise Anerkennen des Rechts, vermeidet aber die stärker dogmatisch besetzte Formulierung »gerechtfertigt«.
theological_decisions:
- issue: Bedeutung des abschließenden וְנֹכָחַת
  choice: ins Recht gesetzt
  alternative: zurechtgewiesen; von jedem Vorwurf befreit; die Sache ist geklärt
  rationale: Form und Zusammenhang erlauben mehrere Deutungen. Im Kontext der öffentlichen Zahlung liegt eine Wiederherstellung von Saras Recht beziehungsweise Ansehen nahe; die Fußnote hält die abweichenden Verständnisse ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« wahrt den wiederholten deiktischen Nachdruck von הִנֵּה; die schwer verständliche Augen-Metapher und die Mehrdeutigkeit des Schlusssatzes bleiben erhalten und werden durch Fußnoten erläutert.
