base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: de
  text: 'Das sind die Söhne Hams[a]: nach ihren Sippen, nach ihren Sprachen, in ihren Ländern, in ihren Völkern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Söhne« kann in diesem genealogischen Zusammenhang auch Nachkommen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְנֵי חָם
  choice: Das sind die Söhne Hams
  rationale: Die identifizierende Zusammenfassungsformel wird natürlich und zugleich formnah wiedergegeben. »Söhne« bewahrt die genealogische Ausdrucksweise des Hebräischen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Präposition לְ kennzeichnet hier eine Gliederung nach Gruppen. »Sippen« bezeichnet größere verwandtschaftliche Verbände genauer als »Familien«.
- source_word: לִלְשֹׁנֹתָם
  choice: nach ihren Sprachen
  rationale: לָשׁוֹן bedeutet wörtlich »Zunge«, bezeichnet hier aber idiomatisch die Sprache; »nach« erhält den gliedernden Sinn der Präposition.
- source_word: בְּאַרְצֹתָם
  choice: in ihren Ländern
  rationale: בְּ ist hier örtlich zu verstehen. »Länder« gibt den Plural von אֶרֶץ wieder, ohne zwingend moderne Nationalstaaten anzudeuten.
- source_word: בְּגוֹיֵהֶם
  choice: nach ihren Völkern
  rationale: Obwohl בְּ formal auch mit »in« wiedergegeben werden kann, dient die Wendung in dieser Zusammenfassungsformel der Einteilung nach Völkern. »Nach« ist im Deutschen klar und natürlich; die formale Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Reichweite von בְּנֵי (»Söhne«) in der Völkertafel
  choice: Söhne
  alternative: Nachkommen
  rationale: Die formale genealogische Bezeichnung bleibt im Haupttext erhalten, ohne auszuschließen, dass sie im Kontext auch spätere Nachkommen umfasst.
- issue: Funktion der Präposition בְּ in בְּגוֹיֵהֶם
  choice: nach ihren Völkern
  alternative: in ihren Völkern
  rationale: Der Kontext ist eine Gliederungsformel; dennoch bleibt die örtliche beziehungsweise zugehörigkeitsanzeigende Lesart grammatisch möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Gliederung mit »nach« ist für heutige Leser verständlich; die abweichende örtliche Formulierung »in ihren Ländern« bewahrt den Wechsel der hebräischen Präpositionen.
