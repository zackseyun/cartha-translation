  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: de
  text: Und Eber wurden zwei Söhne geboren. Der eine hieß Peleg, denn zu seiner Zeit wurde die Erde[a] geteilt; sein Bruder hieß Joktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Land. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: Und Eber wurden
  rationale: Die Verbindung aus Konjunktion und Präposition leitet den nächsten genealogischen Eintrag ein; die deutsche Konstruktion mit Dativ bildet die hebräische Wendung natürlich ab.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: wurden zwei Söhne geboren
  rationale: Das passive Verb steht mit dem pluralischen Subjekt „zwei Söhne“; „wurden geboren“ gibt Form und Sinn genau wieder.
- source_word: שֵׁם הָאֶחָד
  choice: Der eine hieß
  rationale: Die idiomatische deutsche Form bewahrt den Gegensatz zwischen dem einen Sohn und seinem Bruder, ohne aus „der eine“ ausdrücklich „der erste“ zu machen.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition transliteriert.
- source_word: כִּי בְיָמָיו
  choice: denn zu seiner Zeit
  rationale: כִּי führt die Erklärung des Namens ein; „zu seiner Zeit“ gibt die temporale Wendung בְיָמָיו in natürlichem Deutsch wieder.
- source_word: נִפְלְגָה
  choice: wurde geteilt
  rationale: Der Nifal von פלג bezeichnet hier ein Geteiltwerden und bewahrt zugleich die lautliche Beziehung zum Namen Peleg, soweit dies in der Transliteration erkennbar bleibt.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im weltweiten Horizont der Völkertafel ist „Erde“ im Haupttext passend; die echte lexikalische Alternative wird in der Fußnote erhalten.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: sein Bruder hieß Joktan
  rationale: Diese idiomatische deutsche Fassung gibt die hebräische Namensformel knapp und klar wieder.
theological_decisions:
- issue: Reichweite von הָאָרֶץ bei der Erklärung des Namens Peleg
  choice: die Erde
  alternative: das Land
  rationale: Der Zusammenhang der Völkertafel legt den umfassenden Sinn „Erde“ nahe, ohne die Art der Teilung näher festzulegen. Da das hebräische Wort ebenso „Land“ bezeichnen kann, bleibt diese Möglichkeit ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die genealogische Formel wurde leicht idiomatisch geglättet; die Ambiguität von הָאָרֶץ bleibt durch die Fußnote sichtbar.
