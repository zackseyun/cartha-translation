  text: וַֽ/יְהִ֥י מוֹשָׁבָ֖/ם מִ/מֵּשָׁ֑א בֹּאֲ/כָ֥ה סְפָ֖רָ/ה הַ֥ר הַ/קֶּֽדֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: de
  text: Und ihr Siedlungsgebiet reichte von Mescha bis nach Sefar[a], dem Bergland im Osten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Und ihr Siedlungsgebiet reichte von Mescha bis nach Sefar, bis zum Bergland im Osten.'
    reason: Die genaue syntaktische Beziehung von „Bergland im Osten“ zu Sefar beziehungsweise zur Begrenzung des Siedlungsgebiets ist nicht völlig eindeutig.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … lag
  rationale: Das Wayyiqtol von היה führt den Satz erzählerisch weiter. Zusammen mit der Gebietsangabe gibt „lag“ im Deutschen den Zustand natürlich und quellennah wieder, ohne ausdrücklich eine Ausdehnung in den Verbalsinn hineinzulesen.
- source_word: מוֹשָׁבָם
  choice: ihr Siedlungsgebiet
  rationale: מוֹשָׁב bezeichnet hier im Zusammenhang der Völkertafel den bewohnten Raum beziehungsweise das Siedlungsgebiet einer Gruppe, nicht nur eine einzelne Wohnung.
- source_word: מִמֵּשָׁא
  choice: von Mescha aus
  rationale: Der Ortsname wird nach deutscher Bibeltradition als „Mescha“ wiedergegeben; die Präposition מן bezeichnet den räumlichen Ausgangspunkt.
- source_word: בֹּאֲכָה
  choice: in Richtung
  rationale: Die mit בוא gebildete geografische Richtungsformel bezeichnet den Weg beziehungsweise die Richtung auf einen Ort zu. „In Richtung“ ist im modernen Deutschen knapp und natürlich.
- source_word: סְפָרָה
  choice: Sefar
  rationale: Der Ortsname wird deutsch als „Sefar“ transliteriert; das direktionale ה ist bereits durch „in Richtung“ ausgedrückt.
- source_word: הַר
  choice: Bergland
  rationale: הַר kann in einer geografischen Grenzbeschreibung einen gebirgigen Landstrich und nicht nur einen einzelnen Berg bezeichnen. „Bergland“ bewahrt diesen regionalen Sinn.
- source_word: הַקֶּדֶם
  choice: des Ostens
  rationale: קֶדֶם bezeichnet hier den Osten beziehungsweise das östliche Gebiet. Die Formulierung lässt offen, ob ein bestimmtes östliches Bergland oder allgemein das Bergland im Osten gemeint ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Siedlungsgebiet“ passt zur geografisch-ethnischen Aufzählung; „lag … in Richtung“ hält sich eng an היה und vermeidet eine unnötig starke Aussage über exakt festgelegte Grenzen.
