    rationale: Die hebräische Wortstellung erlaubt zumindest auch, „das Bergland im Osten“ als nähere Bezeichnung zu Sefar zu lesen. Die Hauptfassung sollte diese Möglichkeit nicht ausschließen; eine Fußnote kann die alternative Abgrenzung angeben.
