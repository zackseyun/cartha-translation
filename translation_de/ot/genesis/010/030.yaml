- from: Und ihr Siedlungsgebiet lag von Mescha aus in Richtung Sefar[a], im Bergland des Ostens.
  to: Und ihr Siedlungsgebiet reichte von Mescha bis nach Sefar[a], dem Bergland im Osten.
  rationale: Die Revision gibt die räumliche Ausdehnung der hebräischen Richtungsformel mit „von … bis nach“ wieder und behandelt die abschließende geographische Bezeichnung in der Hauptfassung als Apposition. Die Fußnote bewahrt die mögliche Lesart, nach der das Bergland einen weiteren Ziel- bzw. Grenzpunkt bezeichnet.
