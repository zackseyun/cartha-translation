source:
  edition: WLC
  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: de
  text: 'Die Söhne Sems: Elam, Assur, Arpachschad[a], Lud und Aram[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem Hebräischen: Arpachschad; die traditionelle Form „Arphaxad“ ist durch die griechische und lateinische Überlieferung geprägt.'
    reason: lexical_alternative
  - marker: b
    text: Die Namen Assur und Aram werden später auch mit den entsprechenden Völkern und Gebieten verbunden; hier stehen sie innerhalb einer genealogischen Namensliste.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי שֵׁם
  choice: die Söhne Sems
  rationale: Die Constructusverbindung bezeichnet in diesem genealogischen Zusammenhang unmittelbar die Söhne Sems. Die knappe Nominalform des Hebräischen bleibt ohne ergänztes Verb erhalten.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname wird in seiner im Deutschen gebräuchlichen, hebräisch nahen Form wiedergegeben.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Assur ist die etablierte deutsche Form des hebräischen Eigennamens. Die Wiedergabe als „Assyrien“ würde die genealogische Namensliste vorschnell geografisch deuten.
- source_word: אַרְפַּכְשַׁד
  choice: Arpachschad
  rationale: Diese deutsche Umschrift folgt den Konsonanten des hebräischen Namens enger als die griechisch-lateinisch beeinflusste Form „Arphaxad“.
- source_word: לוּד
  choice: Lud
  rationale: Der singularische Eigenname wird direkt transliteriert; „Luditer“ oder „Ludim“ wäre interpretierend beziehungsweise entspräche einer anderen Namensform.
- source_word: אֲרָם
  choice: Aram
  rationale: Der Eigenname bleibt erhalten. „Syrien“ wäre eine spätere geografische Zuordnung und in dieser genealogischen Liste weniger genau.
theological_decisions: []
