base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: de
  text: und die Arwaditer, die Zemariter und die Hamatiter. Danach wurden die Sippen der Kanaaniter zerstreut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Sippen des Kanaaniters«. Der hebräische Singular »des Kanaaniters« bezeichnet hier kollektiv das Volk der Kanaaniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: die Arwaditer
  rationale: Das singularische hebräische Volksadjektiv bezeichnet in dieser Völkerliste kollektiv eine Volksgruppe; der deutsche Plural gibt dies natürlich wieder.
- source_word: הַצְּמָרִי
  choice: die Zemariter
  rationale: Wie die benachbarten Bezeichnungen ist der Ausdruck kollektiv gebraucht; die pluralische Volksbezeichnung entspricht dem Sinn.
- source_word: הַחֲמָתִי
  choice: die Hamatiter
  rationale: Der kollektive Gentilname wird im Deutschen idiomatisch als pluralische Volksbezeichnung wiedergegeben.
- source_word: וְאַחַר
  choice: Danach
  rationale: Die Wendung markiert eine zeitliche Folge; »Danach« ist knapp, natürlich und erhält diese Abfolge.
- source_word: נָפֹצוּ
  choice: zerstreuten sich
  rationale: Der Niphal kann hier eine intransitive beziehungsweise resultative Zerstreuung ausdrücken. Die reflexive deutsche Form bewahrt den Vorgang, ohne einen ungenannten Handelnden einzuführen.
- source_word: מִשְׁפְּחוֹת
  choice: die Sippen
  rationale: Im genealogisch-ethnografischen Zusammenhang sind größere verwandtschaftliche Gruppen gemeint; »Sippen« ist hier treffender als moderne Kleinfamilien.
- source_word: הַכְּנַעֲנִי
  choice: der Kanaaniter
  rationale: Der hebräische Ausdruck steht formal im Singular, bezeichnet aber kollektiv das kanaanitische Volk; zusammen mit »Sippen« ist im Deutschen der pluralische Genitiv natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ethnischen Bezeichnungen folgen der im Deutschen üblichen Pluralbildung; »Sippen« hält den genealogisch-ethnografischen Zusammenhang fest.
