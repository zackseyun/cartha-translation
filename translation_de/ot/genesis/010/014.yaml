  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: de
  text: und die Patrositer und die Kasluhiter – von dort gingen die Philister hervor[a] – und die Kaftoriter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dort gingen die Philister hervor“. Der hebräische Wortlaut kann so verstanden werden, dass sich „dort“ auf die unmittelbar zuvor genannten Kasluhiter bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Patrositer
  rationale: Volksname, der von Patros abgeleitet ist; die im Deutschen gebräuchliche Namensform wird mit der Endung -iter wiedergegeben.
- source_word: כַּסְלֻחִים
  choice: Kasluhiter
  rationale: Die außerbiblische Zuordnung ist unsicher; eine lautnahe Umschrift bewahrt den hebräischen Volksnamen, ohne eine nicht belegte Bedeutung einzutragen.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: von dort gingen ... hervor
  rationale: Diese Wiedergabe bewahrt das adverbiale מִשָּׁם („von dort“) und vermeidet es, den möglichen Bezug auf die unmittelbar zuvor genannten Kasluhiter im Haupttext eindeutig festzulegen.
- source_word: פְּלִשְׁתִּים
  choice: Philister
  rationale: Eingebürgerte deutsche Bezeichnung des Volkes.
- source_word: כַּפְתֹּרִים
  choice: Kaftoriter
  rationale: Der von Kaftor abgeleitete Volksname wird in einer im Deutschen verständlichen, lautnahen Form wiedergegeben.
- source_word: וְאֶת
  choice: und
  rationale: Der wiederholte Akkusativmarker bleibt unübersetzt; die Konjunktion verbindet die Glieder der Völkerliste.
theological_decisions:
- issue: Bezug des Relativsatzes אֲשֶׁר יָצְאוּ מִשָּׁם zur Herkunft der Philister
  choice: Die adverbiale Formulierung „von dort gingen die Philister hervor“ bleibt im Haupttext erhalten.
  alternative: „von denen die Philister abstammten“, mit den Kasluhitern als ausdrücklichem Bezugswort.
  rationale: Das Hebräische sagt wörtlich „die von dort hervorgingen“ und lässt den genauen Bezug von „dort“ weniger ausdrücklich erscheinen als die alternative genealogische Deutung. Die Übersetzung bewahrt diese Spannung; die Fußnote nennt den naheliegenden Bezug auf die Kasluhiter.
translation_notes:
  register: Moderne, würdige Standardsprache. Die eingebürgerten deutschen Volksnamen werden verwendet; die knappe Reihungsstruktur des hebräischen Völkerverzeichnisses bleibt erhalten.
