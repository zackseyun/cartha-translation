  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: de
  text: Von diesen gingen die Küstenländer der Völker hervor, in ihren Ländern, jeweils nach Sprache, Sippen und Völkern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Inseln der Völker«. Das hebräische Wort kann Inseln oder Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Von diesen aus
  rationale: 'Die Präposition מִן mit dem Demonstrativpronomen bezeichnet den Ausgangspunkt: Die genannten Gruppen beziehungsweise Gebiete gingen von den zuvor aufgeführten Nachkommen aus.'
- source_word: נִפְרְדוּ
  choice: teilten sich … auf
  rationale: Der Nifal von פרד bezeichnet Trennung oder Aufteilung. Die reflexive deutsche Form gibt die Verteilung in voneinander unterschiedene Gruppen und Gebiete natürlich wieder, ohne ausdrücklich ein handelndes Subjekt einzuführen.
- source_word: אִיֵּי הַגּוֹיִם
  choice: die Küstenländer der Völker
  rationale: אִיִּים kann Inseln ebenso wie Küsten- oder maritime Gebiete bezeichnen. »Küstenländer« bewahrt hier den geografischen Sinn und die hebräische Genitivverbindung; die Alternative »Inseln« wird in der Fußnote genannt.
- source_word: בְּאַרְצֹתָם
  choice: in ihren Ländern
  rationale: אֶרֶץ bezeichnet hier die jeweiligen Länder oder Gebiete der genannten Gruppen. Die bewusst wörtliche Wiedergabe wahrt die parallele Gliederung des Verses.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: jedes nach seiner Sprache
  rationale: אִישׁ wird distributiv gebraucht, also »jedes« beziehungsweise »jeweils eines«. Das Neutrum richtet sich im Deutschen nach »Küstenländer« und vermeidet die irreführend individuelle Form »jeder Mann«.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im genealogisch-ethnischen Zusammenhang eher eine größere Verwandtschaftsgruppe oder Sippe als die moderne Kernfamilie.
- source_word: בְּגוֹיֵהֶם
  choice: in ihren Völkern
  rationale: גּוֹי bezeichnet ein Volk beziehungsweise eine ethnisch-politische Gruppe. »In ihren Völkern« erhält die Präposition und die knappe, aufzählende Struktur des Hebräischen.
theological_decisions:
- issue: Bezug von אִיֵּי הַגּוֹיִם und נִפְרְדוּ
  choice: Die geografische Formulierung »die Küstenländer der Völker teilten sich … auf« wird im Haupttext bewahrt.
  alternative: »Die Völker der Küstenländer breiteten sich aus«
  rationale: Die Alternative macht Menschen ausdrücklich zum Subjekt und ist idiomatischer, kehrt jedoch die hebräische Genitivverbindung um und legt die Referenz stärker fest. Der Haupttext bewahrt daher die echte Spannung zwischen geografischer und ethnischer Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzstruktur. »Sippen« ist im genealogischen Zusammenhang verständlicher und genauer als »Familien«. Die Folge Singular »jedes … seiner« und Plural »ihren« entspricht dem Wechsel zwischen distributiver Betrachtung und Gesamtgruppen im Hebräischen.
