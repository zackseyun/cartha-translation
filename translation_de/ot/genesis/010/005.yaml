revisions:
- from: Von diesen aus teilten sich die Küstenländer der Völker in ihren Ländern auf,[a] jedes nach seiner Sprache,[b] nach ihren Sippen, in ihren Völkern.
  to: Von diesen gingen die Küstenländer der Völker hervor, in ihren Ländern, jeweils nach Sprache, Sippen und Völkern.[a]
  rationale: Die Revision ersetzt die missverständliche reflexive Aufteilungsform durch eine im Kontext des Völkertableaus natürliche Herkunftsformulierung. Sie wahrt die geographisch-ethnische Offenheit von »Küstenländer der Völker«, erhält die Abfolge der hebräischen Gruppierungsangaben und beschränkt die Fußnote auf die echte lexikalische Alternative.
