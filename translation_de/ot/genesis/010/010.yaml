source:
  edition: WLC
  text: וַ/תְּהִ֨י רֵאשִׁ֤ית מַמְלַכְתּ/וֹ֙ בָּבֶ֔ל וְ/אֶ֖רֶךְ וְ/אַכַּ֣ד וְ/כַלְנֵ֑ה בְּ/אֶ֖רֶץ שִׁנְעָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: de
  text: Der Anfang seines Königreichs war Babel[a], Erech, Akkad und Kalne[b] im Land Schinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Babylon.'
    reason: lexical_alternative
  - marker: b
    text: Erech wird gewöhnlich mit dem antiken Uruk identifiziert; Akkad mit der gleichnamigen antiken Stadt. Die Lage von Kalne ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: waren
  rationale: Die Form von היה dient hier als Vergangenheitskopula. Wegen der folgenden Aufzählung mehrerer Städte ist im natürlichen Deutschen der Plural »waren« angemessen, obwohl das Hebräische grammatisch an das singularische רֵאשִׁית anschließt.
- source_word: רֵאשִׁית
  choice: Der Anfang
  rationale: רֵאשִׁית kann Anfang, ersten Teil oder Vorrang bezeichnen. »Der Anfang« bewahrt hier am besten die Aussage über den ursprünglichen Kern beziehungsweise die früheste Ausdehnung des Königreichs, ohne daraus ausdrücklich Hauptstädte zu machen.
- source_word: מַמְלַכְתּוֹ
  choice: seines Königreichs
  rationale: מַמְלָכָה kann Königreich, Königsherrschaft oder Herrschaftsgebiet bedeuten. Da Städte aufgezählt werden, ist »Königreich« klar und idiomatisch.
- source_word: בָּבֶל
  choice: Babel
  rationale: Die hebräische Namensform wird beibehalten; zugleich bleibt dadurch die literarische Verbindung zu Genesis 11 sichtbar. Die historische Stadt wird auch Babylon genannt.
- source_word: אֶרֶךְ
  choice: Erech
  rationale: Der hebräische Ortsname wird in deutscher Umschrift wiedergegeben. Die Stadt wird gewöhnlich mit dem antiken Uruk identifiziert.
- source_word: אַכַּד
  choice: Akkad
  rationale: »Akkad« ist die im modernen Deutschen übliche historische Namensform und gibt den hebräischen Ortsnamen verständlich wieder.
- source_word: כַלְנֵה
  choice: Kalne
  rationale: Die masoretische Lesung כַלְנֵה wird als »Kalne« wiedergegeben, ohne sie mit einem anderen Ortsnamen gleichzusetzen.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: im Land Schinar
  rationale: Die Formulierung bewahrt sowohl אֶרֶץ als geografische Gebietsbezeichnung als auch den Eigennamen Schinar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen folgen überwiegend den im Deutschen geläufigen biblischen beziehungsweise historischen Formen. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten.
