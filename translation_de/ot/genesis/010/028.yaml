lexical_decisions:
- source_word: וְ/אֶת
  choice: und; der Akkusativmarker bleibt unübersetzt
  rationale: וְ verbindet die Namen mit »und«. אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt, hat hier aber keine eigene deutsche Entsprechung. Natürliches Deutsch wiederholt die Verbindung nicht vor jedem Namen.
- source_word: עוֹבָל
  choice: Obal
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben, nicht übersetzt.
- source_word: אֲבִימָאֵל
  choice: Abimaël
  rationale: Der Eigenname wird transliteriert; der Trema zeigt, dass a und e getrennt gesprochen werden.
- source_word: שְׁבָא
  choice: Saba
  rationale: Für שְׁבָא wird die etablierte deutsche biblische Namensform »Saba« verwendet; sie ist von Seba zu unterscheiden.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch für eine genealogische Aufzählung. Die dreifache hebräische Folge וְאֶת wird idiomatisch wiedergegeben, ohne die im Deutschen schwerfällige Wiederholung von »und« vor jedem Namen.
