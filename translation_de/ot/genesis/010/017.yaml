  yaml_path: translation/ot/genesis/010/017.yaml
  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: de
  text: und die Hiwiter[a], die Arkiter und die Siniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sippe der Hiwiter, die Sippe der Arkiter und die Sippe der Siniter“. Im Hebräischen stehen singularische Volksbezeichnungen mit Artikel, die hier kollektiv Völker oder Sippen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: und
  rationale: Die Verbindung aus וְ und dem im Deutschen nicht wiederzugebenden Akkusativmarker אֶת führt in der genealogischen Aufzählung ein weiteres Glied ein.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Die singularische Gentilform mit Artikel bezeichnet hier kollektiv die Volks- oder Sippengruppe der Hiwiter; der etablierte deutsche pluralische Volksname gibt dies natürlich wieder.
- source_word: הָעַרְקִי
  choice: die Arkiter
  rationale: Die Gentilform bezeichnet kollektiv die mit Arka verbundene Bevölkerungs- oder Sippengruppe. „Arkiter“ bewahrt den Eigennamencharakter und passt zur Reihe der Völkernamen.
- source_word: הַסִּינִי
  choice: die Siniter
  rationale: Die singularische Gentilform bezeichnet kollektiv eine Volks- oder Sippengruppe. „Siniter“ erhält den Eigennamencharakter und entspricht der Form der übrigen Gruppenbezeichnungen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die herkömmlichen deutschen Völkernamen werden pluralisch gebraucht, während die Fußnote die singularische Form und kollektive Funktion des Hebräischen transparent macht.
