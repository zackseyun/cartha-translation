lexical_decisions:
- source_word: וְ/אֶת
  choice: und; vor weiteren Namen teilweise durch deutsche Aufzählungsstruktur wiedergegeben
  rationale: אֵת ist hier der nicht übersetzbare direkte Objektmarker; וְ verbindet die Namen. Im Deutschen wird die Reihung natürlich mit Kommas und einem abschließenden „und“ gestaltet.
- source_word: הֲדוֹרָם
  choice: Hadoram
  rationale: Der Eigenname wird nach seiner hebräischen Form in geläufiger deutscher Schreibweise transliteriert.
- source_word: אוּזָל
  choice: Usal
  rationale: Der Eigenname wird transliteriert; „s“ gibt den hebräischen Zischlaut in moderner deutscher Schreibkonvention verständlich wieder.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Der Eigenname wird nach der hebräischen Form transliteriert; ein nicht gesprochenes englisches Schluss-h wird im Deutschen vermieden.
