source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: de
  text: Auch Sem wurden Kinder geboren. Er war der Vater aller Söhne Ebers und der ältere Bruder Jafets.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Bruder des älteren Jafet“. Das hebräische Adjektiv kann sich entweder auf Sem oder auf Jafet beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... גַּם הוּא
  choice: Auch Sem
  rationale: Die Voranstellung und „auch“ bewahren den anschließenden, additiven Charakter der hebräischen Genealogie, ohne im Deutschen ein unnatürliches „auch er“ zu erzwingen.
- source_word: יֻלַּד
  choice: wurden Kinder geboren
  rationale: Die passive Singularform von ילד führt hier idiomatisch Nachkommen ein. Im Deutschen macht „Kinder“ den genealogischen Sinn natürlich und eindeutig.
- source_word: אֲבִי כָּל־בְּנֵי־עֵבֶר
  choice: der Vater aller Söhne Ebers
  rationale: „Vater“ und „Söhne Ebers“ bilden die hebräische Ausdrucksweise formal ab. „Vater“ kann im genealogischen Zusammenhang zugleich den Stammvater bezeichnen.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: der ältere Bruder Jafets
  rationale: Im Verwandtschaftszusammenhang bezeichnet גָּדוֹל wahrscheinlich das höhere Alter. Der Haupttext bezieht das Adjektiv auf Sem; die ebenfalls mögliche Beziehung auf Jafet wird in der Fußnote erhalten.
theological_decisions:
- issue: Syntaktischer Bezug von הַגָּדוֹל auf Sem oder Jafet
  choice: 'Das Adjektiv wird auf Sem bezogen: „der ältere Bruder Jafets“.'
  alternative: 'Das Adjektiv wird auf Jafet bezogen: „der Bruder des älteren Jafet“.'
  rationale: Die hebräische Wortfolge lässt beide Bezüge zu. Der Haupttext wählt eine plausible Lesart, während die echte syntaktische Mehrdeutigkeit ausdrücklich in einer Fußnote bewahrt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Folge von Einschüben, ohne die genealogischen Aussagen oder ihre Reihenfolge zu verändern.
