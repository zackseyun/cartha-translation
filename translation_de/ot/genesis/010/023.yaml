lexical_decisions:
- source_word: וּבְנֵי
  choice: Die Söhne
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet hier in der genealogischen Formel die Söhne beziehungsweise unmittelbaren Nachkommen. „Die Söhne“ gibt die Form direkt und im Deutschen natürlich wieder; das vorangestellte וּ wird nicht eigens wiedergegeben, da der Vers als neuer Eintrag innerhalb der fortlaufenden Liste formuliert ist.
- source_word: אֲרָם
  choice: Arams
  rationale: Der Eigenname wird nach üblicher deutscher Form als „Aram“ wiedergegeben; der Genitiv macht die hebräische Genitivverbindung natürlich verständlich.
- source_word: עוּץ
  choice: Uz
  rationale: Der Eigenname wird in der etablierten deutschen biblischen Form „Uz“ wiedergegeben.
- source_word: חוּל
  choice: Hul
  rationale: Der Eigenname wird nah an der hebräischen Lautgestalt und entsprechend gängiger deutscher Bibeltradition als „Hul“ transliteriert.
- source_word: גֶתֶר
  choice: Geter
  rationale: Der Eigenname wird in einer für das Deutsche natürlichen Transliteration als „Geter“ wiedergegeben.
- source_word: מַשׁ
  choice: Masch
  rationale: Der masoretische Text von Genesis 10,23 liest מַשׁ; „Masch“ bildet diese Lesart im Deutschen unmittelbar ab. Die abweichende Form in 1. Chronik 1,17 wird in einer Fußnote dokumentiert.
