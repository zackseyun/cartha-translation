source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: de
  text: Aus jenem Land zog Assur aus und baute Ninive[a], Rehobot-Ir und Kalach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von jenem Land zog er nach Assyrien und baute Ninive, Rehobot-Ir und Kalach.“ Dabei wird Nimrod aus dem vorherigen Vers als Subjekt verstanden und אַשּׁוּר als das Gebiet Assyrien statt als die Person Assur.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָ/אָ֥רֶץ הַ/הִ֖וא
  choice: Aus jenem Land
  rationale: מִן bezeichnet den Ausgangspunkt, und אֶרֶץ meint hier ein Gebiet. „Aus jenem Land“ gibt die räumliche Herkunft natürlich und knapp wieder.
- source_word: יָצָ֣א
  choice: zog … aus
  rationale: יצא bedeutet gewöhnlich „hinausgehen/ausziehen“. Die getrennte Verbform „zog … aus“ ist im Deutschen idiomatisch und bewahrt die Bewegung aus dem zuvor genannten Land.
- source_word: אַשּׁ֑וּר
  choice: Assur
  rationale: Der Eigenname kann sowohl die Person Assur als auch das Gebiet Assyrien bezeichnen. Im Haupttext wird er als ausdrückliches Subjekt verstanden; die geografische Deutung bleibt in der Fußnote erhalten.
- source_word: וַ/יִּ֨בֶן֙
  choice: baute
  rationale: בנה ist das gewöhnliche Verb für „bauen“. „Gründete“ wäre enger und stärker deutend.
- source_word: נִ֣ינְוֵ֔ה
  choice: Ninive
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: רְחֹבֹ֥ת עִ֖יר
  choice: Rehobot-Ir
  rationale: In der durch wiederholtes אֶת gekennzeichneten Aufzählung wird die Verbindung am ehesten als Ortsname verstanden. Die Umschrift bewahrt diese Deutung, ohne eine unsichere Identifizierung einzuführen.
- source_word: כָּֽלַח
  choice: Kelach
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
theological_decisions:
- issue: Subjekt und Bedeutung von אַשּׁוּר
  choice: 'Assur ist das Subjekt: „Assur zog aus“'
  alternative: „Von jenem Land zog er nach Assyrien und baute …“, wobei Nimrod aus dem vorherigen Vers das unausgesprochene Subjekt ist.
  rationale: Der hebräische Konsonantentext lässt beide Lesarten zu, weil אַשּׁוּר entweder die Person Assur oder das Gebiet Assyrien bezeichnen kann. Die unmittelbare Syntax legt nahe, Assur als ausdrücklich genanntes Subjekt nach dem Verb zu lesen. Die echte, alte Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen folgen gebräuchlichen deutschen Formen beziehungsweise einer gut lesbaren Umschrift. Die syntaktische und geografische Mehrdeutigkeit des Hebräischen wird nicht stillschweigend aufgelöst, sondern in einer Fußnote offengelegt.
