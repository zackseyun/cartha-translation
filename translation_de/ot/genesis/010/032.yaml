  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: de
  text: Das sind die Sippen der Söhne Noahs nach ihren Abstammungslinien und ihren Völkern. Von ihnen trennten sich die Völker auf der Erde nach der Sintflut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von ihnen aus verteilten sich die Völker nach der Sintflut über die Erde.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Das Wort bezeichnet verwandtschaftlich bestimmte Gruppen. „Sippen“ gibt diese Ebene im genealogischen Zusammenhang genauer wieder als das heute oft auf den engsten Haushalt bezogene „Familien“.
- source_word: לְתוֹלְדֹתָם
  choice: nach ihren Abstammungslinien
  rationale: תּוֹלְדוֹת kann Generationen, Nachkommen oder genealogische Linien bezeichnen. Im Rückblick auf die Völkertafel macht „Abstammungslinien“ den genealogischen Sinn natürlich verständlich.
- source_word: בְּגוֹיֵהֶם
  choice: und ihren Völkern
  rationale: Die Präposition ב kennzeichnet hier neben לְתוֹלְדֹתָם eine weitere Gliederung. Die koordinierte deutsche Formulierung bewahrt die beiden Einteilungsgrößen, ohne ein unnatürliches „in ihren Völkern“ zu erzwingen.
- source_word: נִפְרְדוּ
  choice: haben sich … verteilt
  rationale: Der Nifal von פרד bezeichnet ein Sich-Trennen beziehungsweise Auseinandergehen. „Sich über die Erde verteilen“ gibt im Kontext sowohl die Trennung als auch die räumliche Ausbreitung idiomatisch wieder; die engere Alternative wird in der Fußnote genannt.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם bezeichnet hier die aus Noahs Söhnen hervorgegangenen Völkergruppen; „Völker“ ist im Deutschen kontextuell angemessener als „Nationen“.
- source_word: בָּאָרֶץ
  choice: über die Erde
  rationale: Im zusammenfassenden Rahmen der Völkertafel ist אֶרֶץ universal zu verstehen. Mit „sich über die Erde verteilen“ wird die hebräische Ortsangabe natürlich wiedergegeben.
- source_word: אַחַר הַמַּבּוּל
  choice: nach der Sintflut
  rationale: „Sintflut“ ist die geläufige und eindeutige deutsche Bezeichnung für die zuvor erzählte Flut; die Zeitangabe wird direkt wiedergegeben.
theological_decisions:
- issue: Reichweite von אֶרֶץ in der Zusammenfassung der Verteilung nach der Flut
  choice: die Erde
  alternative: das Land
  rationale: Genesis 10 fasst die Herkunft und Verteilung der Völker aus den Söhnen Noahs zusammen. Der universale Zusammenhang spricht für „Erde“, ohne die Aussage auf ein bestimmtes Land einzuengen.
- issue: Bedeutung von נִפְרְדוּ
  choice: haben sich … verteilt
  alternative: trennten sich / wurden voneinander getrennt
  rationale: Die Form bezeichnet Trennung beziehungsweise Auseinandergehen, lässt aber offen, ob primär der Vorgang oder sein räumliches Ergebnis betont ist. Die Hauptübersetzung ist im Deutschen natürlich; die Fußnote erhält die engere Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei kurze Sätze vermeiden die schwerfällige englische Semikolon-Struktur. „Sippen“ und „Abstammungslinien“ halten den genealogischen Charakter fest; die Fußnote bewahrt die engere Bedeutung von נִפְרְדוּ.
