  terminology: „Sippen“, „Abstammungslinien“, „Völker“, „Erde“ und „Sintflut“ sind im genealogischen und erzählerischen Kontext passend. „Sippen“ bewahrt gegenüber „Familien“ sinnvoll die weitere verwandtschaftliche Gruppierung. Die alternative Wiedergabe „verteilten sich“ kann in der Fußnote stehen.
