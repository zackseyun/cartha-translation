lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Die Wiedergabe bewahrt die genealogische Form des hebräischen Ausdrucks. „Nachkommen“ wäre kontextuell möglich, würde den Wortlaut aber stärker auslegen.
- source_word: יָוָן
  choice: Jawan
  rationale: Der Eigenname wird in der im Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: אֱלִישָׁה
  choice: Elischa
  rationale: Der Eigenname beziehungsweise Völker- oder Ortsname wird deutsch transliteriert.
- source_word: וְ/תַרְשִׁישׁ
  choice: Tarschisch
  rationale: Der Eigenname beziehungsweise Völker- oder Ortsname wird in einer am Hebräischen orientierten deutschen Form wiedergegeben.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Die Pluralform des Völker- beziehungsweise Ortsnamens bleibt als Eigenname erhalten.
- source_word: וְ/דֹדָנִים
  choice: Dodanim
  rationale: Der Haupttext folgt dem masoretischen Text der WLC mit דֹדָנִים. Die wichtige Lesart „Rodanim“ wird in einer Fußnote dokumentiert.
