  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: de
  text: Und die Grenze der Kanaaniter verlief von Sidon in Richtung Gerar bis Gaza und in Richtung Sodom, Gomorra, Adma und Zebojim bis Lascha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lescha“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … verlief
  rationale: Die narrative Form von היה verbindet den Satz mit dem vorausgehenden Zusammenhang. Zusammen mit „Grenze“ gibt „verlief“ die gemeinte geografische Ausdehnung im Deutschen natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Substantiv bezeichnet hier die Grenzlinie beziehungsweise territoriale Begrenzung; „Grenze“ ist präzise und idiomatisch.
- source_word: הַכְּנַעֲנִי
  choice: der Kanaaniter
  rationale: Das morphologisch singularische Volksadjektiv wird kollektiv gebraucht. Der deutsche Plural bezeichnet die Volksgruppe natürlich.
- source_word: מִצִּידֹן
  choice: von Sidon
  rationale: Die Präposition kennzeichnet den Ausgangspunkt der Grenzbeschreibung; „Sidon“ ist die übliche deutsche Namensform.
- source_word: בֹּאֲכָה
  choice: in Richtung
  rationale: Die in Grenzbeschreibungen verwendete Wendung bezeichnet die Ausrichtung beziehungsweise den Verlauf auf einen Ort zu. „In Richtung“ bewahrt diesen Sinn ohne eine tatsächlich reisende Person vorauszusetzen.
- source_word: גְרָרָה
  choice: Gerar
  rationale: Der Ortsname wird in der üblichen deutschen Form wiedergegeben; das he locale ist durch „in Richtung“ ausgedrückt.
- source_word: עַד
  choice: bis
  rationale: Die Präposition bezeichnet jeweils den Endpunkt oder die äußerste Ausdehnung der beschriebenen Grenze.
- source_word: עַזָּה
  choice: Gaza
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodom, Gomorra, Adma und Zebojim
  rationale: Die Ortsnamen werden in geläufigen deutschen Schreibweisen wiedergegeben. Die deutsche Aufzählungszeichensetzung bildet die hebräische Ortsfolge natürlich ab.
- source_word: לָשַׁע
  choice: Lascha
  rationale: „Lascha“ bildet die masoretische Vokalisierung לָשַׁע unmittelbar ab; die verbreitete Variante „Lescha“ wird in einer Fußnote bewahrt.
