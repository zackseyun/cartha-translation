  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: de
  text: 'Und die Söhne Hams waren: Kusch, Mizrajim[a], Put[b] und Kanaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Mizrajim“; viele Übersetzungen geben den Namen mit „Ägypten“ wieder. In dieser Geschlechtsliste wird die hebräische Form als Personen- beziehungsweise Ahnenname behandelt.
    reason: alternative_reading
  - marker: b
    text: Die Schreibweise „Phut“ findet sich auch in einigen Übersetzungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne … waren
  rationale: Das ו wird als „Und“ wiedergegeben, um den Zusammenhang der Geschlechtsliste zu bewahren. בְנֵי ist der Konstruktplural „Söhne von“; im Deutschen wird zur natürlichen Einleitung der Namensliste „waren“ ergänzt.
- source_word: חָם
  choice: Ham
  rationale: Der Eigenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Die übliche deutsche Transliteration gibt den hebräischen Eigennamen angemessen wieder.
- source_word: וּ/מִצְרַיִם
  choice: Mizrajim[a]
  rationale: Da מִצְרַיִם hier innerhalb einer Genealogie als Personen- beziehungsweise Ahnenname erscheint, wird der Name transliteriert und nicht mit „Ägypten“ übersetzt.
- source_word: וּ/פוּט
  choice: Put[b]
  rationale: „Put“ ist eine direkte und im modernen Deutschen gebräuchliche Transliteration des Eigennamens.
- source_word: וּ/כְנָעַן
  choice: und Kanaan
  rationale: Der Eigenname steht in seiner etablierten deutschen Form; die Konjunktion wird beim letzten Glied der Aufzählung ausdrücklich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle genealogische Formulierung „Söhne Hams“ bleibt erhalten; das ergänzte „waren“ macht die Aufzählung idiomatisch. Eigennamen folgen etablierten deutschen Formen beziehungsweise einer transparenten Transliteration.
