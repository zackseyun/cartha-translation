  yaml_path: translation/ot/genesis/010/002.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: de
  text: 'Die Söhne Jafets: Gomer, Magog, Madai, Jawan[a], Tubal, Meschech und Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In späterem Sprachgebrauch können einige Namen auch Völker oder Gebiete bezeichnen: „Madai“ = „die Meder“ und „Jawan“ = „Ionien“ oder „die Griechen“. Der Haupttext bewahrt die genealogischen Namen in transliterierter Form.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural leitet eine genealogische Namensliste ein. „Söhne“ gibt die männliche genealogische Rahmung direkt wieder, ohne sie zu „Nachkommen“ zu erweitern.
- source_word: יֶפֶת
  choice: Jafet
  rationale: Personenname in der im Deutschen üblichen biblischen Form.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Eigenname; in gebräuchlicher deutscher Transliteration wiedergegeben.
- source_word: מָגוֹג
  choice: Magog
  rationale: In dieser Genealogie als Eigenname wiedergegeben, auch wenn der Name später ethnisch oder geografisch gebraucht werden kann.
- source_word: מָדַי
  choice: Madai
  rationale: Die hebräische Namensform bleibt erhalten; eine Deutung als „Meder“ wird nicht in den Haupttext eingetragen.
- source_word: יָוָן
  choice: Jawan
  rationale: Die traditionelle deutsche Wiedergabe des hebräischen Eigennamens bewahrt die genealogische Darstellungsweise; mögliche Bezüge auf Ionien oder die Griechen werden in der Fußnote genannt.
- source_word: תֻבָל
  choice: Tubal
  rationale: Eigenname in gebräuchlicher deutscher Form.
- source_word: מֶשֶׁךְ
  choice: Meschech
  rationale: Eigenname in einer dem Hebräischen und dem deutschen Lautsystem entsprechenden Form.
- source_word: תִירָס
  choice: Tiras
  rationale: Eigenname; transliteriert statt gedeutet.
theological_decisions: []
translation_notes:
  register: Knappe, würdige genealogische Listenform ohne ergänzendes Verb, entsprechend dem hebräischen Nominalsatz. Die Eigennamen folgen gängigen modernen deutschen Bibelformen; die Konjunktion vor dem letzten Namen wird natürlich mit „und“ wiedergegeben.
