  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: de
  text: Das sind die Söhne Sems, nach ihren Sippen, nach ihren Sprachen, in ihren Ländern, nach ihren Völkern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die hebräische verblosen Aussage wird im natürlichen Deutschen mit der Kopula „sind“ wiedergegeben.
- source_word: בְנֵי שֵׁם
  choice: die Söhne Sems
  rationale: Die formale genealogische Ausdrucksweise des Hebräischen bleibt erhalten; „Nachkommen Sems“ wäre weiter gefasst, ist hier aber nicht erforderlich.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im stammesgeschichtlichen Zusammenhang eine Sippe beziehungsweise einen Clan; „Sippen“ ist verständliches, traditionsangemessenes Deutsch. Die Präposition לְ kennzeichnet hier die Gliederung.
- source_word: לִלְשֹׁנֹתָם
  choice: nach ihren Sprachen
  rationale: לָשׁוֹן bedeutet wörtlich auch „Zunge“, bezeichnet hier jedoch eindeutig die sprachliche Zuordnung.
- source_word: בְּאַרְצֹתָם
  choice: in ihren Ländern
  rationale: Die Präposition בְ bezeichnet den räumlichen Bereich. „Länder“ wahrt die geografische Bedeutung, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: לְגוֹיֵהֶם
  choice: nach ihren Völkern
  rationale: גּוֹי bezeichnet hier Völker beziehungsweise Nationen; „Völker“ vermeidet moderne staatsrechtliche Nebenbedeutungen. Das wiederholte לְ wird wie zuvor als Gliederungsangabe mit „nach“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „nach ihren …“ bewahrt den formelhaften, klassifizierenden Rhythmus des hebräischen Satzes; „in ihren Ländern“ bildet den Wechsel zur räumlichen Präposition ausdrücklich ab.
