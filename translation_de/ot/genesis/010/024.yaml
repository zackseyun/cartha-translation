  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: de
  text: Arpachschad zeugte Schelach[a], und Schelach zeugte Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Überlieferungs- und Übersetzungstraditionen verwenden für diese Namen teils die Formen „Arphaxad“ und „Salah“. Der Text folgt den hebräischen Formen „Arpachschad“ und „Schelach“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpachschad
  rationale: Der Eigenname wird eng nach der hebräischen Form אַרְפַּכְשַׁד und in einer für deutsche Leser gut aussprechbaren Schreibweise wiedergegeben; das anlautende וְ wird im Deutschen am Versanfang nicht eigens ausgedrückt.
- source_word: יָלַד
  choice: zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet יָלַד in Geschlechtsregistern das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, würdig und im Deutschen für genealogische Formeln geläufig.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: שָׁלַח / שֶׁלַח
  choice: Schelach
  rationale: Die Schreibweise folgt möglichst unmittelbar der hebräischen Namensform und gibt sowohl den sch-Laut als auch den Schlusslaut wieder.
- source_word: וְ/שֶׁלַח
  choice: und Schelach
  rationale: Die Konjunktion וְ wird mit „und“ wiedergegeben; der wiederholte Eigenname bleibt einheitlich „Schelach“.
- source_word: עֵבֶר
  choice: Eber
  rationale: „Eber“ ist die etablierte deutsche Wiedergabe des hebräischen Eigennamens עֵבֶר; der hebräische Anlaut ע wird dabei nicht durch einen zusätzlichen deutschen Konsonanten markiert.
