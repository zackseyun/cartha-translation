  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: de
  text: und die Jebusiter[a], die Amoriter und die Girgaschiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen die Volksbezeichnungen im Singular („der Jebusiter“, „der Amoriter“, „der Girgaschiter“); in diesem Völkerverzeichnis sind sie jedoch kollektiv gemeint und werden deshalb im Deutschen im Plural wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Die hebräische singularische Volksbezeichnung mit Artikel ist hier kollektiv gebraucht. Im Deutschen bezeichnet der Plural das aufgezählte Volk natürlich und eindeutig.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Wie die benachbarten Volksbezeichnungen steht die singularische Form kollektiv für eine Volksgruppe; daher ist im Deutschen der Plural angemessen.
- source_word: הַגִּרְגָּשִׁי
  choice: die Girgaschiter
  rationale: Die singularische Volksbezeichnung hat kollektive Bedeutung. „Girgaschiter“ ist die übliche deutsche Wiedergabe des Volksnamens.
- source_word: וְאֶת / וְאֵת
  choice: und / unübersetzt
  rationale: וְ führt die Aufzählung aus dem vorigen Vers fort; אֵת ist der direkte Objektmarker und wird im Deutschen nicht eigens wiedergegeben. Innerhalb der deutschen Reihung wird die Konjunktion nur dort gesetzt, wo sie idiomatisch erforderlich ist.
