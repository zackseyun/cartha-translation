  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: de
  text: 'Dies ist die Geschlechterfolge[a] der Söhne Noahs: Sem, Ham und Jafet. Und nach der Flut wurden ihnen Söhne geboren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dies sind die Nachkommen der Söhne Noahs.« Das hebräische Wort der Überschriftsformel kann die Abstammungslinie oder allgemeiner das bezeichnen, was aus einer Person hervorgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies ist
  rationale: Die Wendung eröffnet einen neuen Abschnitt. Im Deutschen ergibt die Überschriftformel mit dem singularischen »Geschlechterfolge« natürlich »Dies ist«; die verbindende Funktion des ו wird nicht künstlich als zeitliches »Nun« wiedergegeben.
- source_word: תּוֹלְדֹת
  choice: Geschlechterfolge
  rationale: Das Wort gehört zur wiederkehrenden Gliederungsformel der Genesis und kann Abstammung, Nachkommenschaft und das aus einer Person Hervorgehende bezeichnen. »Geschlechterfolge« bewahrt den genealogischen und formelhaften Charakter, ohne die Bedeutung auf eine bloße Namensliste zu beschränken.
- source_word: בְּנֵי נֹחַ
  choice: der Söhne Noahs
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und würdig wieder.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Ham und Jafet
  rationale: Verwendet werden die im modernen Deutschen geläufigen biblischen Namensformen.
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: Und … wurden ihnen Söhne geboren
  rationale: Die passive Form von ילד wird als »wurden geboren« wiedergegeben; לָהֶם bezeichnet die Zuordnung zu den Vätern. »Söhne« erhält die ausdrücklich männliche Bezeichnung בָּנִים.
- source_word: אַחַר הַמַּבּוּל
  choice: nach der Flut
  rationale: Dies ist die klare und im Genesis-Kontext übliche deutsche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe der Genesis-Formel תּוֹלְדֹת
  choice: Geschlechterfolge
  alternative: Nachkommen; Geschichte der Nachkommen
  rationale: Die gewählte Fassung bewahrt die wiederkehrende literarische Formel und lässt deren Bedeutungsbreite erkennbar, statt sie ausschließlich als Personenliste oder Erzählbericht festzulegen.
- issue: Geschlechtsspezifische Wiedergabe von בָּנִים
  choice: Söhne
  alternative: Kinder
  rationale: Der hebräische Text verwendet hier eine männliche Pluralform, und die anschließende Völkertafel nennt die männlichen Nachkommen. »Kinder« würde dieses Merkmal einebnen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die formelhafte Struktur der Genesis wird durch »Geschlechterfolge« bewahrt; die zweite Satzhälfte folgt natürlicher deutscher Wortstellung und erhält das einleitende »Und« des Hebräischen.
