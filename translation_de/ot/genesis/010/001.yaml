  source_fidelity: Die Übersetzung gibt die hebräische Überschriftsformel und den anschließenden Satz vollständig wieder. Das singularische deutsche Formelwort „Geschlechterfolge“ rechtfertigt idiomatisch „Dies ist“, obwohl אֵלֶּה formal Plural ist. „Söhne“ gibt בָּנִים präzise wieder; „wurden ihnen Söhne geboren“ bewahrt die passive Konstruktion und die Zuordnung durch לָהֶם. „nach der Flut“ entspricht אַחַר הַמַּבּוּל.
