source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: de
  text: 'Er war ein gewaltiger Jäger vor Jahwe[a]. Darum sagt man: »Wie Nimrod, ein gewaltiger Jäger vor Jahwe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Jahwe zum Trotz«, falls die Wendung im weiteren Zusammenhang feindselig verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: gewaltiger Jäger
  rationale: Die Verbindung bezeichnet idiomatisch einen Menschen von außergewöhnlicher Jagdkraft oder Jagdtüchtigkeit. »Gewaltiger Jäger« bewahrt den kräftigen, würdevollen Ton und klingt im Deutschen natürlich.
- source_word: לִפְנֵי
  choice: vor
  rationale: »Vor« gibt den grundlegenden räumlich-relationalen Sinn wieder und bewahrt zugleich die mögliche Mehrdeutigkeit der Wendung im Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל כֵּן יֵאָמַר
  choice: Darum sagt man
  rationale: Die unpersönliche deutsche Formulierung gibt die sprichwörtliche Einleitung des hebräischen Passivs natürlich wieder.
- source_word: כְּנִמְרֹד
  choice: Wie Nimrod
  rationale: Die Vergleichspartikel wird idiomatisch und knapp mit »wie« wiedergegeben.
theological_decisions:
- issue: Deutung von לִפְנֵי יְהוָה in Bezug auf Nimrod
  choice: vor Jahwe
  alternative: Jahwe zum Trotz / in Auflehnung gegen Jahwe
  rationale: Der hebräische Ausdruck bedeutet grundsätzlich »vor« beziehungsweise »in der Gegenwart von«. Eine feindselige Bedeutung ist möglich, aber nicht ausdrücklich markiert; deshalb bleibt die Hauptübersetzung offen, während die stärker deutende Alternative in der Fußnote erscheint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gewaltiger Jäger« wahrt die prägnante, sprichwörtliche Wiederholung des Hebräischen. Der Fußnotenmarker [a] steht unmittelbar bei der Einleitungsformel, auf deren Verständnis sich die Anmerkung auswirkt.
