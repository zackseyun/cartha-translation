  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: de
  text: Und die Söhne Kuschs[a] waren Seba, Hawila, Sabta, Ragma und Sabtecha[b]. Und die Söhne Ragmas waren Saba und Dedan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann in biblischen Stammbäumen auch Nachkommen oder die Ursprünge von Sippen und Völkern bezeichnen, nicht nur unmittelbare leibliche Söhne.
    reason: cultural_note
  - marker: b
    text: Mehrere Namen in diesem Vers können Personen, Völker oder Gebiete bezeichnen; der Text legt dies nicht in jedem Fall eindeutig fest.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Und die Söhne Kuschs
  rationale: Die genealogische Formel wird eng am Hebräischen wiedergegeben. „Söhne“ kann hier unmittelbare Söhne, Nachkommen oder aus Kusch hervorgegangene Volksgruppen bezeichnen; der Genitiv „Kuschs“ ist im Deutschen natürlich.
- source_word: סְבָא
  choice: Seba
  rationale: Der Eigenname wird nach etablierter deutscher Bibeltradition transkribiert, ohne ihn ethnografisch festzulegen.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Eigennamens.
- source_word: סַבְתָּה
  choice: Sabta
  rationale: Die Form gibt den hebräischen Namen knapp und in deutscher Schreibkonvention wieder.
- source_word: רַעְמָה
  choice: Regma
  rationale: „Regma“ ist eine im Deutschen etablierte Wiedergabe des Namens; sie vermeidet die für deutsche Leser missverständliche englische Umschrift „Raamah“.
- source_word: סַבְתְּכָא
  choice: Sabtecha
  rationale: Die Schreibweise bildet die Konsonantenfolge des hebräischen Eigennamens in einer geläufigen deutschen Form ab.
- source_word: וּבְנֵי רַעְמָה
  choice: Die Söhne Regmas
  rationale: Die wiederholte genealogische Formel bleibt erhalten. Das zweite ו wird im Deutschen nicht eigens mit „und“ wiedergegeben, da der neue Satz den Anschluss bereits klar ausdrückt.
- source_word: שְׁבָא
  choice: Saba
  rationale: Etablierte deutsche Namensform für hebräisch שְׁבָא.
- source_word: דְדָן
  choice: Dedan
  rationale: Direkte, im Deutschen geläufige Transkription des Eigennamens.
theological_decisions:
- issue: Bedeutungsumfang von „Söhne“ in der Völkertafel
  choice: „Söhne“ im Haupttext beibehalten und die weitere Bedeutung in einer Fußnote erläutern
  alternative: „Nachkommen“ oder „Völker“ unmittelbar in den Haupttext setzen
  rationale: Das bewahrt die konkrete genealogische Ausdrucksweise des Hebräischen, ohne die mögliche Beziehung auf Nachkommen, Sippen oder Völker auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ergänzte Kopula „waren“ macht die hebräischen Nominalsätze im Deutschen flüssig lesbar. Die Eigennamen folgen überwiegend etablierten deutschen Bibelformen; echte Unbestimmtheit hinsichtlich Person, Volk oder Gebiet bleibt durch die Fußnoten erhalten.
