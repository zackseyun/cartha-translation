id: GEN.10.13
reference: Genesis 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: de
  text: Und Mizrajim zeugte die Luditer[a], die Anamiter, die Lehabiter[b] und die Naftuhiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachte … hervor« beziehungsweise »wurde zum Stammvater von«. Das hebräische Verb ist die übliche genealogische Bezeichnung für das Hervorbringen von Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: Diese Namen werden als Volksbezeichnungen lautnah wiedergegeben; ihre Gleichsetzung mit später bekannten Völkern oder Gebieten ist teilweise unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizrajim
  rationale: Der Name wird in der Völkertafel als Eigenname des Stammvaters transliteriert, statt mit »Ägypten« wiedergegeben.
- source_word: יָלַד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet das Verb das Hervorbringen von Nachkommen beziehungsweise Völkern; »zeugte« bewahrt diese traditionelle genealogische Aussage knapp und klar.
- source_word: אֶת
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine selbstständige Entsprechung; seine Funktion ergibt sich aus dem Satzbau.
- source_word: לוּדִים
  choice: die Luditer
  rationale: Die hebräische pluralische Volksbezeichnung wird als deutsches Ethnonym auf -iter wiedergegeben.
- source_word: עֲנָמִים
  choice: die Anamiter
  rationale: Die Form wird als Volksbezeichnung verstanden und in einer natürlichen deutschen Ethnonymform wiedergegeben.
- source_word: לְהָבִים
  choice: die Lehabiter
  rationale: Die hebräische Namensform bleibt erkennbar; unsichere spätere ethnische Identifizierungen werden nicht in den Haupttext aufgenommen.
- source_word: נַפְתֻּחִים
  choice: die Naftuhiter
  rationale: Die pluralische Volksbezeichnung wird lautnah und in einer im Deutschen verständlichen Ethnonymform wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet Mizrajim mit dem Prädikat sowie die Glieder der Aufzählung; im Deutschen wird sie nach natürlichem Satzbau wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die deutschen Ethnonyme auf -iter machen deutlich, dass hier Volksgruppen beziehungsweise Nachkommenschaften gemeint sind, während die hebräischen Namensformen erkennbar bleiben.
