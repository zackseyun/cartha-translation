id: GEN.10.12
reference: Genesis 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: de
  text: und Resen zwischen Ninive und Kalach[a]; das ist die große Stadt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Kalhu“, entsprechend der assyrischen Form des Ortsnamens, der traditionell mit „Kalach“ wiedergegeben wird.
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „das ist die große Stadt“ kann sich speziell auf Resen oder auf den größeren städtischen Raum zwischen Ninive und Kalach beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion führt zusammen mit dem nicht eigens übersetzten Objektmarker einen weiteren Ort in der Aufzählung ein.
- source_word: רֶסֶן
  choice: Resen
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Dies entspricht der korrelativen Präposition, die Resens Lage im Verhältnis zu Ninive und Kalach angibt.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Die im Deutschen etablierte Form des Ortsnamens.
- source_word: כָּלַח
  choice: Kalach
  rationale: Die traditionelle deutsche Wiedergabe des hebräischen Ortsnamens wird im Haupttext beibehalten; die assyrische Namensform Kalhu steht in der Fußnote.
- source_word: הִוא
  choice: das ist
  rationale: Das selbstständige Pronomen hat hier eine wiederaufnehmende beziehungsweise kopulative Funktion. „Das ist“ klingt im Deutschen natürlich und legt den Bezug der Schlussaussage nicht unnötig fest.
- source_word: הָעִיר הַגְּדֹלָה
  choice: die große Stadt
  rationale: Die bestimmten Formen werden direkt wiedergegeben. „Groß“ kann sowohl räumliche Größe als auch Bedeutung anklingen lassen.
theological_decisions:
- issue: Bezugswort von „das ist die große Stadt“
  choice: Die Schlussaussage bleibt ohne eindeutige Zuordnung stehen.
  alternative: Sie kann sich speziell auf Resen oder auf den größeren städtischen Raum zwischen Ninive und Kalach beziehen.
  rationale: Der hebräische Satzbau legt den genauen Bezug nicht zweifelsfrei fest; die Übersetzung bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten; das Semikolon markiert die abschließende Erläuterung, ohne ihren mehrdeutigen Bezug aufzulösen.
