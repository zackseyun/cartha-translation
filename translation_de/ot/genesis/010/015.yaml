  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: de
  text: Und Kanaan zeugte Sidon, seinen Erstgeborenen, und Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Het gilt im Zusammenhang dieses Völkerstammbaums als Stammvater der Hethiter.
