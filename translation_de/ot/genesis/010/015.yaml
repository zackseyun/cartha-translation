lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Und Kanaan
  rationale: Die Konjunktion ו wird mit „Und“ wiedergegeben, um die fortlaufende genealogische Reihe zu bewahren; כנען erscheint in der im Deutschen üblichen Namensform „Kanaan“.
- source_word: יָלַד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד das Hervorbringen von Nachkommen durch den Vater. „zeugte“ ist präzise, knapp und in biblischen Stammbäumen weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: צִידֹן
  choice: Sidon
  rationale: Der Eigenname wird in der etablierten deutschen Form „Sidon“ wiedergegeben.
- source_word: בְּכֹר/וֹ
  choice: seinen Erstgeborenen
  rationale: Das Substantiv mit Suffix der 3. Person Singular bezeichnet Sidon als Kanaans Erstgeborenen. Der Akkusativ „seinen Erstgeborenen“ bezieht sich eindeutig auf Sidon.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion verbindet das zweite Objekt mit dem ersten; der Akkusativmarker selbst bleibt unübersetzt.
- source_word: חֵת
  choice: Het
  rationale: Der Personenname wird entsprechend der verbreiteten deutschen biblischen Namensform als „Het“ wiedergegeben; eine Deutung als Stammvater wird nicht in den Haupttext eingefügt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper genealogischer Satzstruktur. „Zeugte“ wahrt die konkrete väterliche Bedeutung des hebräischen Verbs, ohne zusätzliche Erläuterungen in den Haupttext einzutragen.
