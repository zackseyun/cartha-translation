base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: de
  text: Joktan zeugte Almodad, Schelef, Hazarmawet und Jerach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und Joktan zeugte Almodad und Schelef und Hazarmawet und Jerach.“ Im Hebräischen steht „und“ vor jedem Namen.'
    reason: Die wiederholten hebräischen Konjunktionen werden für eine natürliche deutsche Aufzählung stilistisch geglättet.
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Joktan
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben. Das einleitende וְ verbindet den Vers mit dem vorherigen Zusammenhang, muss aber in der natürlichen deutschen Aufzählungsfolge nicht eigens mit „Und“ wiedergegeben werden.
- source_word: יָלַד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד die männliche Zeugung beziehungsweise Abstammung. „zeugte“ ist knapp, verständlich und entspricht dem formelhaften Charakter des Stammbaums.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige lexikalische Entsprechung; seine Funktion wird durch den Satzbau ausgedrückt.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Transliteration des Eigennamens in der geläufigen deutschen biblischen Form.
- source_word: שָׁלֶף
  choice: Schelef
  rationale: Transliteration des Eigennamens; שׁ wird entsprechend deutscher Schreibkonvention mit „sch“ wiedergegeben.
- source_word: חֲצַרְמָוֶת
  choice: Hazarmawet
  rationale: Transliteration des Eigennamens in einer deutschen Form; „w“ gibt den Lautwert des hebräischen ו in dieser Position nach deutscher Konvention wieder.
- source_word: יָרַח
  choice: Jerach
  rationale: Transliteration des Eigennamens nach deutscher biblischer Schreibkonvention; das abschließende ח wird mit „ch“ wiedergegeben.
