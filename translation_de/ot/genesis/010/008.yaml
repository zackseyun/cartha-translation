source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: de
  text: Und Kusch zeugte Nimrod. Er begann, ein mächtiger Mann[a] auf der Erde[b] zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gewaltiger“, „ein Held“ oder „ein Krieger“. Das hebräische Wort kann allgemein einen mächtigen oder starken Mann und spezieller einen Helden oder Krieger bezeichnen.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Oder: „im Land“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְ/כּוּשׁ
  choice: Und Kusch
  rationale: Die Konjunktion führt das Geschlechtsregister schlicht weiter; der Personenname wird in der im Deutschen üblichen biblischen Form „Kusch“ wiedergegeben.
- source_word: יָלַד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד die männliche Zeugung beziehungsweise Vaterschaft. „Zeugte“ ist präzise und in deutschen Geschlechtsregistern geläufig.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion zeigt sich in „zeugte Nimrod“.
- source_word: נִמְרֹד
  choice: Nimrod
  rationale: Der Personenname wird nach etablierter deutscher Bibelkonvention wiedergegeben.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen nimmt Nimrod erneut als Subjekt auf. „Er“ bewahrt diese Wiederaufnahme, ohne eine stärkere Betonung hinzuzufügen.
- source_word: הֵחֵל לִ/הְיוֹת
  choice: begann, … zu sein
  rationale: Die Verbindung bedeutet unmittelbar „begann zu sein“. Diese Wiedergabe wahrt die Anfangsbedeutung, ohne die nicht zwingende Deutung „war der Erste“ einzutragen.
- source_word: גִּבֹּר
  choice: ein mächtiger Mann
  rationale: גִּבּוֹר kann einen mächtigen, starken, heldenhaften oder kriegerischen Mann bezeichnen. „Mächtiger Mann“ erhält die lexikalische Breite und legt den militärischen Sinn nicht vorschnell fest.
- source_word: בָּ/אָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im weltweiten Rahmen der Völkertafel ist „Erde“ naheliegend; „auf“ entspricht hier natürlichem deutschen Sprachgebrauch.
theological_decisions:
- issue: Bedeutungsumfang von אֶרֶץ
  choice: Erde (weiter beziehungsweise weltweiter Bezug)
  alternative: Land (regionaler Bezug)
  rationale: Der Zusammenhang der Völkertafel legt den weiteren Sinn nahe, doch die regionale Bedeutung bleibt sprachlich möglich und wird deshalb in einer Fußnote genannt.
- issue: Bedeutung von הֵחֵל לִהְיוֹת
  choice: Er begann, … zu sein
  alternative: Er war der Erste, der … wurde
  rationale: Die formnahe Wiedergabe bewahrt die Aussage vom Beginn eines Zustands, ohne aus dem Text ausdrücklich eine zeitliche Vorrangstellung Nimrods abzuleiten.
- issue: Bedeutung von גִּבּוֹר
  choice: mächtiger Mann
  alternative: Held, Krieger oder Gewaltiger
  rationale: Der Kontext kann eine kriegerische Nuance zulassen, verlangt sie in diesem Vers aber nicht eindeutig. Die breitere Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt dem knappen Stil eines Geschlechtsregisters. Die zweite Aussage bleibt bewusst nahe am Hebräischen und vermeidet die interpretative Erweiterung „war der Erste“. Sämtliche Fußnotenmarker stehen im Haupttext.
