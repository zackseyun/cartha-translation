  source_fidelity: Die Übersetzung gibt die kollektive Bedeutung von יוֹשֵׁב sowie die appositionale Kennzeichnung als Kanaaniter zutreffend wieder. „Trauer bei der Tenne von Atad“, „eine schwere Trauer für die Ägypter“, die unpersönliche Namensformel und „jenseits des Jordan“ entsprechen dem hebräischen Sinn und bewahren die perspektivabhängige Ortsangabe.
  naturalness: Modernes, würdiges Standarddeutsch. „Bewohner des Landes, die Kanaaniter“ ist verständlich und angemessen; „schwere Trauer“ ist idiomatisch genug und erhält die Bildlichkeit von כָּבֵד. Die Aufteilung des abschließenden Relativsatzes in einen selbständigen Satz ist flüssig und verändert die Aussage nicht.
  terminology: „Tenne“, „Trauer“, „Kanaaniter“, „Ägypter“ und die Transkription „Abel-Mizrajim“ sind sachgerecht. Die Fußnote zu Abel-Mizrajim erläutert das hebräische Wortspiel ohne es im Haupttext zu nivellieren. Die Fußnote zu „jenseits“ wahrt die geographische Perspektivabhängigkeit.
