  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: de
  text: 'Als die Bewohner des Landes, die Kanaaniter, die Trauer bei der Tenne von Atad sahen, sagten sie: »Das ist eine schwere Trauer für die Ägypter.« Darum gab man dem Ort den Namen Abel-Mizrajim[a]; er liegt jenseits des Jordan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-Mizrajim klingt im Hebräischen wie »Trauer Ägyptens« oder »Trauer der Ägypter«.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: auf der anderen Seite des Jordan; die Ortsangabe hängt vom jeweiligen Standpunkt ab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: die Bewohner des Landes, die Kanaaniter
  rationale: Der singularische Partizipialausdruck wird kollektiv verstanden; die Apposition הַכְּנַעֲנִי identifiziert die Bewohner als Kanaaniter. Die deutsche Wiedergabe bewahrt diese Struktur und klingt natürlich.
- source_word: הָאֵבֶל
  choice: die Trauer
  rationale: אֵבֶל bezeichnet hier die Trauer einschließlich der Totenklage und Trauerriten. „Trauer“ passt zum Bestattungskontext und ermöglicht den Hinweis auf das Wortspiel im Ortsnamen.
- source_word: בְּגֹרֶן הָאָטָד
  choice: bei der Tenne von Atad
  rationale: גֹרֶן ist eine Tenne; בְּ bezeichnet hier den Ort. „Von Atad“ lässt offen, ob Atad ein Eigenname ist oder mit „Dornstrauch“ zusammenhängt.
- source_word: אֵבֶל כָּבֵד
  choice: eine schwere Trauer
  rationale: כָּבֵד bedeutet wörtlich „schwer“ und bezeichnet hier die große Intensität der Trauer. Die wörtliche Verbindung ist auch im Deutschen idiomatisch.
- source_word: לְמִצְרָיִם
  choice: für die Ägypter
  rationale: Der Ortsname „Ägypten“ steht im Kontext für die ägyptische Trauergesellschaft. Die personenbezogene Wiedergabe ist im Deutschen natürlich.
- source_word: עַל כֵּן קָרָא שְׁמָהּ
  choice: Darum gab man dem Ort den Namen
  rationale: Die unpersönliche Form „gab man“ bewahrt den nicht genannten Namengeber. „Dem Ort“ macht den Bezug des femininen Suffixes im Deutschen verständlich, ohne eine konkrete Person als Subjekt einzuführen.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel-Mizrajim
  rationale: Der Ortsname wird transliteriert; sein Anklang an אֵבֶל („Trauer“) und seine Bedeutung werden in einer Fußnote erläutert.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet die andere Seite des Jordan aus einer vom Erzählstandpunkt abhängigen Perspektive. „Jenseits“ erhält diese Perspektivabhängigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Apposition „die Bewohner des Landes, die Kanaaniter“ und die Bildnähe von „schwere Trauer“ bewahren die hebräische Ausdrucksweise, ohne unnatürlich zu wirken. Der Ortsname bleibt transliteriert; das Wortspiel wird in der Fußnote erklärt.
