  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: de
  text: Für ihn vergingen vierzig Tage, denn so lange dauert die Einbalsamierung[a]. Und die Ägypter beweinten ihn siebzig Tage lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „denn so werden die Tage der Einbalsamierung vollendet“; möglich auch: „die Tage der Einbalsamierten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Vierzig Tage wurden für ihn vollendet
  rationale: Die Formulierung bewahrt den Fokus des Hebräischen auf dem Ablauf der festgesetzten Zeit und gibt לוֹ ausdrücklich mit »für ihn« wieder.
- source_word: כִּי כֵּן
  choice: denn so
  rationale: Die Wendung leitet die Erklärung für die Dauer von vierzig Tagen ein.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: so viele Tage nimmt die Einbalsamierung in Anspruch
  rationale: Im Kontext von Vers 2 bezeichnet חֲנֻטִים den Vorgang der Einbalsamierung. Die natürliche deutsche Formulierung vermittelt, dass dafür die genannte Zeitspanne erforderlich beziehungsweise üblich war.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: beweinten ihn
  rationale: »Beweinen« gibt בכה samt direktem Objekt prägnant wieder, ohne daraus ausdrücklich förmliche Trauerriten zu machen.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Der Ortsname »Ägypten« steht im Hebräischen kollektiv für dessen Einwohner. Im Deutschen benennt »die Ägypter« den gemeinten Handlungsträger natürlich und eindeutig.
- source_word: שִׁבְעִים יוֹם
  choice: siebzig Tage lang
  rationale: »Lang« kennzeichnet im natürlichen Deutschen die Dauer des Weinens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bleibt bewusst nah an der hebräischen Ausdrucksweise; die erklärende zweite Hälfte wird idiomatisch wiedergegeben. Die kollektive Ortsbezeichnung »Ägypten« wird zur Vermeidung einer unnatürlichen Personifizierung als »die Ägypter« übersetzt.
