base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: de
  text: 'Josef sagte zu seinen Brüdern: „Ich sterbe. Aber Gott wird sich ganz gewiss eurer annehmen[a] und euch aus diesem Land hinaufführen in das Land, das er Abraham, Isaak und Jakob zugeschworen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wird sich euch ganz gewiss zuwenden“. Das hebräische Verb kann Gottes entschlossene Aufmerksamkeit und sein Eingreifen zugunsten seines Volkes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: seinen Brüdern
  rationale: Das grammatisch maskuline Pluralnomen mit Suffix bezeichnet im Erzählzusammenhang Josefs leibliche Brüder.
- source_word: אָנֹכִי מֵת
  choice: Ich werde sterben
  rationale: Die Partizipialkonstruktion bezeichnet hier den unmittelbar bevorstehenden Tod; die deutsche Zukunftsform gibt dies natürlich und eindeutig wieder.
- source_word: וֵאלֹהִים
  choice: Aber Gott
  rationale: Das Waw stellt Josefs bevorstehenden Tod dem gewissen Handeln Gottes gegenüber und wird deshalb im Deutschen adversativ wiedergegeben.
- source_word: פָּקֹד יִפְקֹד
  choice: wird sich ganz gewiss eurer annehmen
  rationale: Infinitivus absolutus und Imperfekt desselben Verbs drücken nachdrückliche Gewissheit aus. „Sich einer Person annehmen“ bewahrt die Bandbreite von Gottes aufmerksamer, wirksamer Zuwendung, ohne sie auf einen bloßen Besuch zu verengen.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: und euch … hinaufführen
  rationale: Der Hifil von עלה bezeichnet ein Hinaufbringen oder Hinaufführen. „Hinaufführen“ erhält die Richtungsangabe und klingt im Deutschen natürlich.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: aus diesem Land
  rationale: Die Wendung bezeichnet Ägypten aus Josefs gegenwärtiger Perspektive.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: in das Land, das er … zugeschworen hat
  rationale: „Zugeschworen“ erhält den ausdrücklichen Eidcharakter von נשבע, ohne ein im Hebräischen nicht ausdrücklich genanntes Verb wie „geben“ in den Haupttext einzufügen.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die drei Namen werden in der feierlichen patriarchalischen Formel vollständig beibehalten; die deutsche Verbfügung macht eine Wiederholung der Präposition unnötig.
theological_decisions:
- issue: Art des in פָּקֹד יִפְקֹד zugesagten Handelns Gottes
  choice: Gott wird sich ganz gewiss seines Volkes annehmen und wirksam zu dessen Gunsten handeln.
  alternative: Gott wird ganz gewiss nach euch sehen / euch heimsuchen.
  rationale: Die hebräische Konstruktion versichert Gottes entschlossene Zuwendung und sein Eingreifen. Die Übersetzung vermeidet sowohl die Abschwächung zu einem bloßen Besuch als auch die heute meist negative Bedeutung von „heimsuchen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich eurer annehmen“ ist leicht gehoben, aber allgemein verständlich und entspricht der feierlichen Abschiedsrede; „ganz gewiss“ bildet die hebräische Verstärkung ausdrücklich ab.
