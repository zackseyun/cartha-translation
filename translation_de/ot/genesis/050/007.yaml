base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: de
  text: Da zog Josef hinauf, um seinen Vater zu begraben.[a] Mit ihm zogen alle Diener des Pharaos hinauf, die Ältesten des Haushalts des Pharaos und alle Ältesten des Landes Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „hinaufziehen“ entspricht der üblichen Ausdrucksweise für eine Reise von Ägypten nach Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: עָלָה bezeichnet wörtlich ein Hinaufgehen. Die Formulierung bewahrt die hebräische geografische Redeweise für die Reise von Ägypten nach Kanaan und klingt im Deutschen erzählerisch natürlich.
- source_word: לִקְבֹּר
  choice: um … zu begraben
  rationale: Der Infinitiv von קָבַר bedeutet schlicht „begraben“; die deutsche Finalkonstruktion gibt seine Funktion im Satz klar wieder.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Die einfache Possessivform entspricht dem hebräischen Suffix, ohne eine nicht vorhandene Hervorhebung einzuführen.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: Mit ihm zogen … hinauf
  rationale: Die Wiederholung von עָלָה bleibt erhalten und bewahrt Rhythmus sowie geografische Perspektive des hebräischen Textes.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: alle Diener des Pharaos
  rationale: עֶבֶד kann „Diener“ oder „Sklave“ bedeuten. Im königlichen Hofkontext ist „Diener“ eine natürliche, hinreichend breite Wiedergabe, die keinen bestimmten Rang voraussetzt.
- source_word: זִקְנֵי בֵיתוֹ
  choice: die Ältesten seines Hofes
  rationale: זִקְנֵי bedeutet „Älteste“, während בֵיתוֹ hier den königlichen Haushalt beziehungsweise Hof des Pharaos bezeichnet. „Hof“ ist im modernen Deutschen natürlicher als „Haus“ und verdeutlicht den institutionellen Kontext.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: und alle Ältesten des Landes Ägypten
  rationale: Die Wiedergabe bewahrt sowohl זִקְנֵי („Älteste“) als auch אֶרֶץ („Land“) und unterscheidet die landesweite Führung vom engeren Hof des Pharaos.
