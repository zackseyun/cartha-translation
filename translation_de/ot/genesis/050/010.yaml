id: GEN.50.10
reference: Genesis 50:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: de
  text: Als sie zur Tenne von Atad[a] kamen, die jenseits des Jordan[b] liegt, hielten sie dort eine große und sehr schwere Totenklage[c]. Und er hielt sieben Tage lang Trauer um seinen Vater[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Atad kann mit einem Wort für „Dornstrauch“ oder „Dorngestrüpp“ zusammenhängen; hier ist er Bestandteil eines Ortsnamens.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „auf der anderen Seite des Jordan“. Die hebräische Wendung legt für sich allein die geografische Blickrichtung nicht eindeutig fest.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „eine große und sehr schwere Klage“. „Schwer“ ist ein hebräisches Bild für die außergewöhnliche Heftigkeit der Trauer.'
    reason: cultural_note
  - marker: d
    text: Das hebräische Verb steht im Singular („er hielt Trauer“), wahrscheinlich mit Bezug auf Josef. Manche Übersetzungen beziehen die Handlung auf die ganze Gruppe und schreiben „sie“.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: Tenne
  rationale: Bezeichnet den festgelegten Platz, an dem Getreide gedroschen wurde; „Tenne“ ist die knappe, herkömmliche deutsche Entsprechung.
- source_word: הָאָטָד
  choice: Atad
  rationale: Im Ausdruck גֹּרֶן הָאָטָד fungiert das Wort als Ortsname. Die mögliche Bedeutung „Dornstrauch“ wird in einer Fußnote genannt.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Bewahrt die räumliche Ausdrucksweise des Hebräischen, ohne die geografische Perspektive genauer festzulegen, als es der Ausgangstext tut.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: hielten ... eine Totenklage
  rationale: ספד und das verwandte Substantiv bezeichnen hier die öffentliche, förmliche Klage um einen Verstorbenen. „Totenklage halten“ gibt diese Bedeutung im Deutschen würdig und verständlich wieder.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: große und sehr schwere
  rationale: Die Formulierung bewahrt das hebräische Bild der Schwere und die starke Intensivierung, auch wenn sie im Deutschen bewusst etwas markant klingt.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: hielt ... Trauer
  rationale: Das Verb עשה bildet mit אֵבֶל eine idiomatische Wendung für das Einhalten beziehungsweise Abhalten einer Trauerzeit; eine wörtliche Wiedergabe mit „machen“ wäre im Deutschen missverständlich.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Gibt die Dauer der Trauerzeit in natürlichem Deutsch ausdrücklich wieder.
theological_decisions:
- issue: Subjektwechsel vom Plural zum Singular bei וַיַּעַשׂ
  choice: „Und er hielt ...“; der Singular des masoretischen Textes bleibt erhalten.
  alternative: „Und sie hielten ...“ als auf die gesamte Trauergesellschaft bezogene Angleichung.
  rationale: Nach den pluralischen Verben „sie kamen“ und „sie hielten Totenklage“ steht im Hebräischen ausdrücklich ein Verb im Singular. Wahrscheinlich ist Josef gemeint, doch da sein Name in diesem Vers nicht erneut genannt wird, wahrt der Haupttext mit „er“ sowohl die grammatische Form als auch eine gewisse Bezugsunschärfe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tenne“ und „Totenklage“ sind traditionelle, aber weiterhin verständliche Begriffe für den antiken landwirtschaftlichen beziehungsweise funerären Kontext. Die etwas markante Verbindung „große und sehr schwere Totenklage“ erhält bewusst die Bildsprache und Intensität des Hebräischen.
