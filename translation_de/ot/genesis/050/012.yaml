  text: So his sons did for him as he had commanded them.
translation:
  language: de
  text: Seine Söhne handelten für ihn so, wie er ihnen geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: taten
  rationale: עשה bedeutet allgemein „tun/machen“. Hier bezeichnet es die Ausführung von Jakobs Anweisungen; „taten“ gibt dies knapp und natürlich wieder.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: בָּנִים bezeichnet hier ausdrücklich Jakobs Söhne; die konkrete Geschlechtsangabe bleibt erhalten.
- source_word: לוֹ
  choice: für ihn
  rationale: לֹו bezeichnet in diesem Zusammenhang das Handeln zu Jakobs Gunsten beziehungsweise in seiner Angelegenheit.
- source_word: כֵּן
  choice: '[im Satzbau mit „wie“ wiedergegeben]'
  rationale: כֵּן verweist auf die Art und Weise ihres Handelns. Im Deutschen wird die Verbindung כֵּן כַּאֲשֶׁר idiomatisch und vollständig durch „wie“ ausgedrückt; ein zusätzliches „so“ wäre möglich, aber schwerfälliger.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Partikel leitet den Vergleich ein und zeigt, dass das Handeln der Söhne Jakobs Anweisung entsprach.
- source_word: צִוָּם
  choice: er ihnen geboten hatte
  rationale: צוה bedeutet „gebieten/anweisen“. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Jakobs Gebot ihrem Handeln vorausging.
theological_decisions: []
