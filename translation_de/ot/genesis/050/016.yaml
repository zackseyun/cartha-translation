translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten hebräischen Redeeinleitungen werden funktional durch die Ausrichtungskonstruktion und den Doppelpunkt wiedergegeben; der Satz bleibt bewusst offen, weil der angekündigte Befehl im folgenden Vers steht.
