  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: de
  text: 'Da ließen sie Josef Folgendes ausrichten[a]: »Dein Vater befahl vor seinem Tod:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Da geboten sie Josef und sagten: …« Das hebräische Verb bedeutet meist »befehlen«, bezeichnet hier aber wahrscheinlich, dass sie Josef eine Botschaft übermitteln ließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Da ließen sie … ausrichten
  rationale: Das Verb צוה bedeutet gewöhnlich »befehlen«; mit אֶל יוֹסֵף und der anschließenden Botschaft bezeichnet es hier wahrscheinlich die Veranlassung einer Mitteilung. Die Formulierung ist idiomatisches modernes Deutsch und bewahrt diese kontextuelle Bedeutung.
- source_word: אֶל יוֹסֵף
  choice: Josef
  rationale: Josef ist der Empfänger der ausgerichteten Botschaft; die deutsche Konstruktion »jemandem etwas ausrichten lassen« gibt die durch אֶל bezeichnete Zielrichtung ohne eigene Präposition wieder.
- source_word: לֵאמֹר
  choice: ausrichten / Doppelpunkt
  rationale: Der erste Redeeinleiter wird in die deutsche Mitteilungskonstruktion integriert; der Doppelpunkt eröffnet die direkte Rede natürlich.
- source_word: אָבִיךָ
  choice: dein Vater
  rationale: Direkte Anrede Josefs mit Possessivsuffix der zweiten Person Singular.
- source_word: צִוָּה
  choice: hat … befohlen
  rationale: Bewahrt die gewöhnliche und starke Bedeutung von צוה und unterscheidet sie von der kontextuellen Wiedergabe desselben Stammes am Versanfang.
- source_word: לִפְנֵי מוֹתוֹ
  choice: vor seinem Tod
  rationale: Hier ist לִפְנֵי eindeutig temporal; die Wendung entspricht natürlichem und genauem Deutsch.
- source_word: לֵאמֹר
  choice: 'Folgendes … :'
  rationale: Der zweite Redeeinleiter kündigt den Wortlaut des Befehls im nächsten Vers an. »Folgendes« mit Doppelpunkt bewahrt diese Funktion, ohne das im Deutschen schwerfällige doppelte »sagte«.
