  text: וְ/כֹל֙ בֵּ֣ית יוֹסֵ֔ף וְ/אֶחָ֖י/ו וּ/בֵ֣ית אָבִ֑י/ו רַ֗ק טַפָּ/ם֙ וְ/צֹאנָ֣/ם וּ/בְקָרָ֔/ם עָזְב֖וּ בְּ/אֶ֥רֶץ גֹּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: de
  text: Und das ganze Haus Josefs[a], seine Brüder und das Haus seines Vaters zogen mit hinauf; nur ihre kleinen Kinder[b], ihre Schafe und Ziegen[c] und ihre Rinder ließen sie im Land Goschen zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Haus« ist hier die Familie oder Hausgemeinschaft gemeint, nicht ein Gebäude. Das gilt auch für das »Haus seines Vaters«.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet kleine Kinder.
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: ihr Kleinvieh; damit sind besonders Schafe und Ziegen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: und das ganze
  rationale: Die Verbindung וְ führt die Aufzählung aus dem vorherigen Vers fort; כֹל bezeichnet die Gesamtheit.
- source_word: בֵּית יוֹסֵף
  choice: das Haus Josefs
  rationale: בַּיִת bezeichnet hier nicht ein Gebäude, sondern die zu Josef gehörende Familie beziehungsweise Hausgemeinschaft. Die im Deutschen biblisch geläufige Wendung bewahrt zugleich die Bildlichkeit des Hebräischen; eine Fußnote klärt den Sinn.
- source_word: וְאֶחָיו
  choice: seine Brüder
  rationale: Der maskuline Plural von אָח bezeichnet hier Josefs Brüder.
- source_word: וּבֵית אָבִיו
  choice: und das Haus seines Vaters
  rationale: Wie בֵּית יוֹסֵף meint die Wendung die Familie beziehungsweise Hausgemeinschaft des Vaters und nicht ein Gebäude.
- source_word: רַק
  choice: Nur
  rationale: רַק grenzt die anschließend genannten Personen und Tiere als diejenigen ein, die zurückblieben.
- source_word: טַפָּם
  choice: ihre kleinen Kinder
  rationale: טַף bezeichnet besonders die kleinen, noch abhängigen Kinder; die Wiedergabe ist im modernen Deutsch klarer als das substantivierte »die Kleinen«.
- source_word: וְצֹאנָם
  choice: ihre Schafe und Ziegen
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, vor allem Schafe und Ziegen. Die konkrete Wiedergabe vermeidet die im Deutschen mögliche Beschränkung von »Herden« auf eine unbestimmte Tierart.
- source_word: וּבְקָרָם
  choice: ihre Rinder
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh; »Rinder« ist präzise und natürlich.
- source_word: עָזְבוּ
  choice: ließen sie … zurück
  rationale: עזב bedeutet hier, etwas an einem Ort zurückzulassen, nicht es preiszugeben oder im Stich zu lassen. Die deutsche Satzstellung erhält die Hervorhebung der durch »nur« begrenzten Gruppe.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Die Wiedergabe bewahrt das ausdrücklich genannte אֶרֶץ und verwendet die etablierte deutsche Namensform Goschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anfangskonjunktion und die nominale Aufzählung bleiben erhalten, weil der Vers syntaktisch an den vorherigen Vers anschließt. »Haus« wahrt die hebräische Ausdrucksweise, wird aber zur Vermeidung eines räumlichen Missverständnisses erklärt. Die Nachstellung von »ließen sie … zurück« hebt wie im Hebräischen die begrenzte Ausnahme hervor, ohne im Deutschen unverständlich zu werden.
