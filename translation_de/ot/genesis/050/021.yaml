  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּירָ֔אוּ אָנֹכִ֛י אֲכַלְכֵּ֥ל אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם וַ/יְנַחֵ֣ם אוֹתָ֔/ם וַ/יְדַבֵּ֖ר עַל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: de
  text: »Und nun habt keine Angst. Ich selbst werde für euch und eure kleinen Kinder sorgen.« So tröstete er sie und sprach ihnen Mut zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sprach zu ihrem Herzen«; das heißt, er redete ihnen freundlich und beruhigend zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlich-folgernden Sinn von עַתָּה in natürlichem Deutsch.
- source_word: אַל תִּירָאוּ
  choice: habt keine Angst
  rationale: Gibt die verneinte Aufforderung idiomatisch und mit dem beruhigenden Ton des Zusammenhangs wieder.
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Macht die Betonung durch das selbstständige Personalpronomen sichtbar und unterstreicht Josefs persönliche Zusage.
- source_word: אֲכַלְכֵּל
  choice: werde für … sorgen
  rationale: Bezeichnet hier die fortdauernde materielle Versorgung, besonders mit Nahrung; die deutsche Wendung ist klar und kontextgerecht.
- source_word: טַפְּכֶם
  choice: eure kleinen Kinder
  rationale: Gibt den Bezug auf die Kleinen der Familien genauer wieder als das allgemeinere »Kinder« und ist im modernen Deutsch natürlicher als »eure Kleinen«.
- source_word: וַיְנַחֵם אֹתָם
  choice: So tröstete er sie
  rationale: Gibt die zusammenfassende Erzählform und die tröstende Wirkung von Josefs Worten natürlich wieder.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: sprach ihnen Mut zu
  rationale: Überträgt die hebräische Wendung idiomatisch als herzliches, beruhigendes Zureden; das Bild des Herzens bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
