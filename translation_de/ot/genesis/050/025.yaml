  source_fidelity: 'Die Grundbedeutung ist gut getroffen: וַיַּשְׁבַּע als „ließ ... schwören“, die Intensivierung פָּקֹד יִפְקֹד als sichere Zuwendung Gottes und וְהַעֲלִתֶם als verpflichtende Aufforderung zum Hinaufbringen der Gebeine. Allerdings bleibt לֵאמֹר („indem er sagte“/„und sagte“) in der Fassung unberücksichtigt. Das zweite „Dann“ legt zudem eine zeitliche Abfolge nahe, die das einfache verbindende וְ nicht verlangt.'
  naturalness: „Dann“ am Satzanfang und nochmals im Zitat wirkt im Deutschen unnötig wiederholend. „Da ... und sagte“ sowie „und ihr sollt“ sind flüssig, modern und bewahren den Zusammenhang.
  terminology: „Josef“, „Söhne Israels“ und „Gebeine“ sind angemessen. „Gott wird sich gewiss um euch kümmern“ gibt die hier kontextuell fürsorglich-rettende Aussage von פקד natürlich wieder, ohne die Handlung übermäßig zu spezifizieren.
  issues:
