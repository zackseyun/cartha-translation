  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: de
  text: 'Da ließ Josef die Söhne Israels schwören und sagte: „Gott wird sich gewiss um euch kümmern, und ihr sollt meine Gebeine von hier hinaufbringen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: ließ … schwören
  rationale: Die Hifil-Form bezeichnet, dass Josef die Söhne Israels einen Eid leisten ließ; diese deutsche Wendung gibt die Veranlassung natürlich und präzise wieder.
- source_word: פָּקֹד יִפְקֹד
  choice: wird sich ganz gewiss um … kümmern
  rationale: Infinitivus absolutus plus finites Verb verstärkt die Aussage. Im Zusammenhang meint פקד Gottes fürsorgliches Eingreifen zugunsten Israels; „ganz gewiss“ bewahrt die emphatische Konstruktion.
- source_word: וְהַעֲלִתֶם
  choice: Dann sollt ihr … hinaufbringen
  rationale: Die Hifil-Form bedeutet „hinaufbringen“. Im Rahmen des auferlegten Eides hat die Verbform verpflichtenden Sinn; „sollt“ gibt diesen wieder, ohne unnötig ein ausdrückliches Muss in den hebräischen Wortlaut einzutragen.
- source_word: עַצְמֹתַי
  choice: meine Gebeine
  rationale: „Gebeine“ ist im Deutschen eine natürliche, würdige Bezeichnung für die sterblichen Knochen eines Verstorbenen.
theological_decisions:
- issue: Bedeutung der intensivierten Wendung פָּקֹד יִפְקֹד
  choice: Gott wird sich ganz gewiss um euch kümmern
  alternative: Gott wird euch gewiss heimsuchen / besuchen
  rationale: Die Übersetzung hält Gottes sicheres Eingreifen fest und macht im Kontext dessen fürsorgliche, rettende Ausrichtung verständlich. Sie legt jedoch nicht genauer fest, auf welche Weise Gott handeln wird.
- issue: Verpflichtende Kraft von וְהַעֲלִתֶם
  choice: Dann sollt ihr meine Gebeine … hinaufbringen
  alternative: Ihr müsst meine Gebeine … hinaufbringen
  rationale: Der Eid verleiht dem Satz verpflichtende Kraft. „Sollt“ bildet diese angemessen ab und bleibt näher an der nicht ausdrücklich modal markierten hebräischen Verbform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebeine“ wahrt den feierlichen Zusammenhang, während „sich um euch kümmern“ die kontextuelle Bedeutung von פקד allgemein verständlich ausdrückt. Keine Fußnoten erforderlich.
