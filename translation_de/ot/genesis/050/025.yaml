    rationale: Der hebräische Text kennzeichnet die anschließenden Worte ausdrücklich als Josefs Rede. Die deutsche Fassung sollte dies mit „und sagte“ oder einer gleichwertigen Form kenntlich machen.
  - severity: low
    issue: Das zweite „Dann“ ist als temporale Einordnung zu stark und stilistisch redundant.
    rationale: וְהַעֲלִתֶם verbindet die Verpflichtung mit der vorangehenden Versicherung; „und ihr sollt“ ist näher am Satzverlauf und natürlicher.
