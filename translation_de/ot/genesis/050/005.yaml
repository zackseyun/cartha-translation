  to: 'Mein Vater ließ mich schwören und sagte: »Sieh, ich sterbe. In meinem Grab, das ich mir im Land Kanaan gegraben habe, dort sollst du mich begraben.« Nun lass mich bitte hinaufziehen und meinen Vater begraben; danach werde ich zurückkehren.'
