base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: de
  text: 'Mein Vater ließ mich schwören und sagte: »Sieh, ich sterbe. In meinem Grab, das ich mir im Land Kanaan gegraben habe, dort sollst du mich begraben.« Nun lass mich bitte hinaufziehen und meinen Vater begraben; danach werde ich zurückkehren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: ließ mich schwören
  rationale: Die Hifil-Form bezeichnet, dass der Vater Josef einen Eid ablegen ließ; die deutsche Wendung gibt dies natürlich und genau wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der hebräischen Partikel in würdiger, verständlicher Sprache.
- source_word: כָּרִיתִי
  choice: ausgehauen habe
  rationale: Das Verb bedeutet wörtlich »graben/ausheben«; bei einem Felsengrab ist »aushauen« im Kontext treffend, ohne den gemeinten Besitz des Grabes abzuschwächen.
- source_word: אֶעֱלֶה נָּא
  choice: lass mich bitte hinaufziehen
  rationale: »Hinaufziehen« erhält das hebräische Bewegungsverb und »bitte« gibt die höfliche Partikel נָא wieder.
- source_word: וְאָשׁוּבָה
  choice: danach werde ich zurückkehren
  rationale: Gibt Josefs ausdrückliches Versprechen der Rückkehr klar wieder; »danach« drückt die Abfolge des waw im Deutschen natürlich aus.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die räumliche Wiederaufnahme durch שָׁמָּה wird mit »dort« bewahrt; keine konfessionellen oder auslegungsspezifischen Zusätze.
