review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist angezeigt: אָנֹכִי מֵת steht als Partizip und bezeichnet den gegenwärtig bevorstehenden Tod („ich sterbe“), nicht schlicht ein zukünftiges Ereignis („ich werde sterben“). כָּרִיתִי bedeutet primär „gegraben/ausgehoben“; „ausgehauen“ legt ohne ausdrücklichen Anhalt im Vers ein Felsengrab nahe.'
  naturalness: Die überarbeitete Fassung bleibt moderne, würdige Standardsprache. „Sieh, ich sterbe“ ist in direkter Rede klar und behält die aufmerksamkeitslenkende Nuance von הִנֵּה. Die Satzfolge im Schlusssatz ist flüssig und wahrt Josefs Bitte sowie seine Rückkehrzusage.
  terminology: „ließ mich schwören“ gibt die kausative hebräische Verbform präzise wieder. „Grab“, „begraben“, „Kanaan“ und „hinaufziehen“ sind sachgerecht. „gegraben“ bewahrt die lexikalische Offenheit des Hebräischen besser als das spezifischere „ausgehauen“.
  issues:
  - severity: medium
    issue: „ich werde sterben“
    rationale: Das hebräische מֵת ist hier ein Partizip mit gegenwartsnaher Aussage („ich sterbe“/„ich liege im Sterben“). Die Futurform schwächt diese Nuance ab.
  - severity: low
    issue: „ausgehauen“
    rationale: Das Verb כּרה bezeichnet „graben/ausheben“. „Aushauen“ kann zwar bei einem Felsengrab passen, ist jedoch eine nicht im Wortlaut geforderte Konkretisierung.
  revised_text: 'Mein Vater ließ mich schwören und sagte: »Sieh, ich sterbe. In meinem Grab, das ich mir im Land Kanaan gegraben habe, dort sollst du mich begraben.« Nun lass mich bitte hinaufziehen und meinen Vater begraben; danach werde ich zurückkehren.'
