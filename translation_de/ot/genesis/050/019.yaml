  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: de
  text: 'Doch Josef sagte zu ihnen: »Habt keine Angst! Stehe ich denn an Gottes Stelle?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stehe ich unter Gott?« Die hebräische Wendung kann auch so verstanden werden; im Zusammenhang bedeutet sie jedoch wahrscheinlich: »Stehe ich an Gottes Stelle?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen Wayyiqtol von אמר.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: אל mit Pronominalsuffix bezeichnet die Angesprochenen.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Entspricht der etablierten deutschen Namensform.
- source_word: אַל תִּירָאוּ
  choice: Habt keine Angst
  rationale: Gibt die verneinte Aufforderung idiomatisch und in modernem Standarddeutsch wieder.
- source_word: כִּי
  choice: nicht gesondert wiedergegeben
  rationale: כִּי leitet hier die rhetorische Begründung der Beruhigung ein; im Deutschen wird dieser Zusammenhang durch die unmittelbar folgende rhetorische Frage natürlich ausgedrückt.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: Bin ich etwa an Gottes Stelle?
  rationale: Die idiomatische Wendung bezeichnet hier am ehesten die Anmaßung von Gottes Rolle; »etwa« kennzeichnet die erwartete verneinende Antwort der rhetorischen Frage.
theological_decisions:
- issue: Aussagekraft von Josefs rhetorischer Frage über Gottes Vorrecht
  choice: Josef weist zurück, an Gottes Stelle zu stehen und dessen Rolle als Richter oder Vergelter einzunehmen.
  alternative: Josef fragt, ob er unter Gott steht.
  rationale: Im Zusammenhang mit der Furcht der Brüder vor Vergeltung bedeutet תַּחַת אֱלֹהִים am ehesten »an Gottes Stelle«. Die alternative, wörtlich mögliche Auffassung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; die rhetorische Schärfe und die echte Mehrdeutigkeit der hebräischen Wendung bleiben erhalten.
