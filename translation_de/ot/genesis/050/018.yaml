  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: de
  text: 'Dann kamen auch seine Brüder, warfen sich vor ihm nieder und sagten: »Hier sind wir; wir sind deine Sklaven.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Diener«. Das hebräische Wort עֲבָדִים kann sowohl Diener als auch Sklaven bezeichnen; hier bringt »Sklaven« die starke Unterwerfung der Brüder zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: kamen
  rationale: הלך bedeutet grundsätzlich »gehen«, doch aus der Perspektive Josefs und für die Bewegung auf ihn zu ist im Deutschen »kamen« idiomatisch.
- source_word: גַּם אֶחָיו
  choice: auch seine Brüder
  rationale: גַּם bezeichnet hier die zusätzliche persönliche Ankunft der Brüder nach der zuvor übermittelten Botschaft.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: warfen sich vor ihm nieder
  rationale: Die Verbindung נפל + לפני beschreibt hier eine körperliche Geste der Unterwerfung; »sich niederwerfen« gibt dies im Deutschen klar wieder.
- source_word: הִנֶּנּוּ
  choice: Hier sind wir
  rationale: Die hebräische Selbstpräsentationsformel wird natürlich und ohne altertümliches »Siehe« wiedergegeben.
- source_word: לְךָ לַעֲבָדִים
  choice: wir sind deine Sklaven
  rationale: Die Konstruktion bezeichnet den angebotenen Status gegenüber Josef. עֲבָדִים kann »Diener« oder »Sklaven« bedeuten; die starke Unterwerfung in diesem Zusammenhang spricht für »Sklaven«.
theological_decisions:
- issue: Wiedergabe von עֲבָדִים bei freiwillig erklärter völliger Unterordnung
  choice: Sklaven
  alternative: Diener
  rationale: Der Ausdruck ist lexikalisch mehrdeutig. Im Kontext bieten die Brüder jedoch nicht bloß Dienstleistung an, sondern erklären eine umfassende Unterordnung unter Josef. »Sklaven« bewahrt diese Stärke, während die Fußnote die ebenfalls mögliche Wiedergabe »Diener« festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Warfen sich … nieder« macht die Unterwerfungsgeste deutlich; der semantische Spielraum von עֲבָדִים bleibt durch die Fußnote erhalten.
