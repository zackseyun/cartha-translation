    issue: Unnatürliche und potenziell missverständliche Wiedergabe von בְּאָזְנֵי פַרְעֹה
    rationale: „Vor den Ohren des Pharaos“ ist im Deutschen keine übliche Wendung. Der hebräische Ausdruck bedeutet hier, dass die angesprochenen Hofleute dem Pharao die folgende Botschaft zu Gehör bringen bzw. vortragen sollen.
  - severity: low
    issue: Die Höflichkeitsnuance des ersten נָא fehlt
    rationale: Das nachgestellte „bitte“ gibt das zweite נָא bei דַּבְּרוּ wieder, aber nicht die einleitende höflich-bittende Formel אִם־נָא. „doch“ kann diese Nuance im Deutschen zurückhaltend und natürlich abbilden.
