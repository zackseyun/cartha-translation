base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: de
  text: 'Nachdem die Tage des Weinens um ihn vorüber waren, sprach Josef zum Hofstaat des Pharaos: »Wenn ich doch Gunst in euren Augen gefunden habe, dann richtet bitte dem Pharao aus:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: vorüber waren
  rationale: Das Verb עבר bezeichnet hier das Verstreichen eines Zeitraums; das Plusquamperfekt ordnet dessen Ende zeitlich vor Josefs anschließendem Reden ein.
- source_word: יְמֵי בְכִיתוֹ
  choice: die Tage, in denen man um ihn weinte
  rationale: בכי bezeichnet wörtlich das Weinen. Die Formulierung bewahrt den Bezug des Suffixes auf den Verstorbenen und vermeidet die mögliche Fehlauffassung, es handle sich um Josefs eigenes Trauern.
- source_word: וַיְדַבֵּר
  choice: sagte
  rationale: דבר bedeutet »reden/sprechen«; vor der folgenden direkten Rede ist »sagte« im Deutschen natürlich.
- source_word: אֶל בֵּית פַּרְעֹה
  choice: zum Hofstaat des Pharaos
  rationale: בית bezeichnet hier die zum königlichen Haus gehörenden Personen, die Josefs Bitte an den Pharao weitergeben können; »Hofstaat« macht diesen sozialen Bezug klar.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Wenn ich Gunst in euren Augen gefunden habe
  rationale: Die geläufige hebräische Höflichkeitsformel und ihr Bild werden bewahrt. נָא trägt zum bittenden Ton bei, der im Deutschen durch den Gesamtsatz und das folgende »bitte« ausgedrückt wird.
- source_word: דַּבְּרוּ נָא
  choice: dann redet bitte
  rationale: Der Pluralimperativ richtet sich an mehrere Angehörige des Hofstaats; נָא wird ausdrücklich mit »bitte« wiedergegeben.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: vor den Ohren des Pharaos
  rationale: Die anschauliche hebräische Wendung wird formal bewahrt und ist im Deutschen verständlich; eine Fußnote erläutert ihre idiomatische Bedeutung.
- source_word: לֵאמֹר
  choice: und sagt
  rationale: Der zweite Zitationsmarker leitet die im nächsten Vers folgende Botschaft ein; »und sagt« ergibt einen natürlichen, offenen Satzanschluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der höfische Kontext wird durch »Hofstaat« deutlich; die hebräische Körpermetapher bei der Bitte an den Pharao bleibt erhalten und wird erläutert. Der Doppelpunkt zeigt an, dass Josefs auszurichtende Worte im folgenden Vers weitergehen.
