  rationale: Die Revision ersetzt die unidiomatische Körpermetapher durch eine natürliche deutsche Aufforderung zum Übermitteln der Botschaft an den Pharao. Sie erhält den offenen Satzanschluss zum folgenden Vers, den Plural der angesprochenen Hofleute und die doppelte höflich-bittende Prägung der hebräischen Formulierung. Da keine nicht im Text ausdrückbare Alternative verbleibt, ist keine Fußnote erforderlich.
