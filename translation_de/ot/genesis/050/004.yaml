review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den zeitlichen Ablauf, das Weinen um den Verstorbenen, die Anrede an die Angehörigen des pharaonischen Hofes und den offenen Anschluss an Vers 5 grundsätzlich zutreffend wieder. Die Formulierung „vor den Ohren des Pharaos“ ist jedoch keine natürliche deutsche Entsprechung von בְּאָזְנֵי פַרְעֹה und wirkt missverständlich; der Sinn ist, dass die Hofleute die Bitte dem Pharao vortragen sollen. Auch die bittende Nuance des ersten נָא sollte im Deutschen erkennbar sein.
  naturalness: „Vor den Ohren des Pharaos“ ist im modernen Standarddeutsch nicht idiomatisch. „Richtet bitte dem Pharao aus“ ist natürlich, klar und lässt den durch die hebräische Wendung bezeichneten Adressatenbezug erkennen.
  terminology: „Josef“, „Pharao“, „Gunst in euren Augen“ und „Hofstaat“ sind im gegebenen Register angemessen. „Tage des Weinens um ihn“ bewahrt den Bezug auf den Verstorbenen, ohne das hebräische Suffix fälschlich als Josefs eigenes Weinen aufzufassen.
  issues:
