- from: 'Als die Tage, in denen man um ihn weinte, vorüber waren, sagte Josef zum Hofstaat des Pharaos: »Wenn ich Gunst in euren Augen gefunden habe, dann redet bitte vor den Ohren des Pharaos[a] und sagt:'
