source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: de
  text: 'So sollt ihr zu Josef sagen: »Ach, vergib doch deinen Brüdern ihr Vergehen und ihre Sünde, denn sie haben dir Böses angetan. Und nun vergib doch das Vergehen der Diener des Gottes deines Vaters.« Als sie so zu ihm redeten, weinte Josef.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: vergib doch
  rationale: Wörtlich »hebe/trage doch«; im Zusammenhang ist das idiomatische Bitten um Vergebung gemeint. »Doch« gibt die eindringliche Partikel נָא natürlich wieder.
- source_word: פֶּשַׁע ... וְחַטָּאתָם
  choice: Vergehen und ihre Sünde
  rationale: 'Die beiden unterschiedlichen Schuldbegriffe bleiben erhalten: פֶּשַׁע bezeichnet ein schweres Vergehen bzw. Aufbegehren, חַטָּאת Sünde.'
- source_word: רָעָה גְמָלוּךָ
  choice: sie haben dir Böses angetan
  rationale: Natürliches Deutsch für die Aussage, dass sie Josef mit Bösem behandelten; vermeidet das im Deutschen missverständliche »Böses vergolten«.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: die Diener des Gottes deines Vaters
  rationale: Bewahrt sowohl die Selbstbezeichnung als Diener als auch den Bezug auf den Gott des gemeinsamen Vaters.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: als sie so zu ihm redeten
  rationale: Gibt die temporale Konstruktion flüssig wieder; »so« verweist auf die unmittelbar zitierte Botschaft.
theological_decisions:
- issue: Verhältnis von Vergehen und Sünde
  choice: Beide Begriffe werden getrennt wiedergegeben.
  alternative: Zusammenfassend nur »Schuld«
  rationale: Der hebräische Text setzt פֶּשַׁע und חַטָּאת nebeneinander; die begriffliche Spannung soll nicht eingeebnet werden.
- issue: Bezeichnung der Brüder als Diener Gottes
  choice: Die Formulierung »Diener des Gottes deines Vaters« bleibt ohne erklärende Erweiterung stehen.
  alternative: »Wir dienen doch demselben Gott wie unser Vater«
  rationale: Eine ausdeutende Fassung würde Motive und theologische Folgerungen in den Text eintragen, die der Wortlaut nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bitte »vergib doch« erhält den eindringlichen Ton; »Ach« bildet das einleitende אָנָּא ab. Der Name wird in der im Deutschen etablierten Form »Josef« geschrieben.
