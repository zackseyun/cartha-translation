  source_fidelity: 'Der Text gibt die hebräische Syntax und Aussage zuverlässig wieder: die zweimalige Bitte um Vergebung (שָׂא נָא), die Unterscheidung von פשע und חטאת sowie die Begründung, dass die Brüder Josef Böses angetan haben. Die Selbstbezeichnung als „Diener des Gottes deines Vaters“ bleibt ohne interpretierende Ergänzung erhalten. „Als sie so zu ihm redeten“ gibt die abschließende temporale Wendung idiomatisch wieder; „so“ verweist lediglich auf die zuvor übermittelte Bitte.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert. „Ach, vergib doch“ bildet den bittenden und eindringlichen Charakter von אָנָּא … נָא angemessen ab, ohne künstlich wörtlich zu werden.
  terminology: „Josef“ ist die im Deutschen übliche Namensform. „Vergehen“ und „Sünde“ bewahren die im Hebräischen nebeneinanderstehenden Schuldbegriffe; „Diener des Gottes deines Vaters“ ist terminologisch präzise und registergerecht.
