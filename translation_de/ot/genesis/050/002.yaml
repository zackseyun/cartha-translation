  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: de
  text: Dann befahl Josef seinen Dienern[a], den Ärzten, seinen Vater einzubalsamieren. Die Ärzte balsamierten Israel[b] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Sklaven“; das hebräische Wort kann je nach Zusammenhang Diener oder Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Israel“, das heißt Jakob.'
    reason: name_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: Das Verb צוה bezeichnet hier eine mit Autorität erteilte Anweisung; „befahl“ bewahrt diese Aussagekraft im Deutschen.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד kann je nach Zusammenhang Diener oder Sklaven bezeichnen. Hier steht die Funktion des Personals in Josefs Dienst im Vordergrund; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: הָרֹפְאִים
  choice: den Ärzten / die Ärzte
  rationale: Die substantivierte Partizipialform von רפא bezeichnet Heilkundige. „Ärzte“ ist im modernen Standarddeutsch klar und würdig und passt auch zum ägyptischen Hofkontext.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: einzubalsamieren / balsamierten … ein
  rationale: חנט bezeichnet in diesem ägyptischen Bestattungskontext die Einbalsamierung eines Leichnams. Die Wiederholung desselben Verbs bleibt erkennbar.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Direkte und natürliche Wiedergabe der Possessivverbindung.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel und nicht Jakob; diese Namenswahl wird bewahrt.
theological_decisions:
- issue: Wiedergabe von עבד im Haushalts- und Hofkontext
  choice: Diener
  alternative: Sklaven
  rationale: Der unmittelbare Zusammenhang hebt die Aufgabe der betreffenden Personen als Ärzte in Josefs Dienst hervor, nicht ihren rechtlichen Status. Da עבד dennoch auch „Sklave“ bedeuten kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
- issue: Wechsel der Bezeichnung von „seinem Vater“ zu „Israel“
  choice: Israel im Haupttext beibehalten
  alternative: Jakob
  rationale: Die Variation des hebräischen Textes wird nicht harmonisiert; dadurch bleibt die erzählerisch und theologisch bedeutsame Namenswahl erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem hebräischen Ablauf, ohne unnatürlich zu wirken; das wiederholte „die Ärzte“ und der Name „Israel“ bleiben bewusst erhalten.
