  source_fidelity: Die Übersetzung gibt die parallele Gegenüberstellung von menschlicher böser Absicht und Gottes guter Absicht treffend wieder. »um zu bewirken, was heute vor Augen steht« gibt die Zweckbestimmung und den deiktischen Charakter von כַּיּוֹם הַזֶּה idiomatisch wieder. »ein zahlreiches Volk« ist jedoch enger als עַם רָב, das hier eine große Zahl von Menschen bezeichnen kann und nicht zwingend ein einzelnes Volk im modernen ethnisch-politischen Sinn.
