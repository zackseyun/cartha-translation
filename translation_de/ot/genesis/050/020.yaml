source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: de
  text: 'Ihr hattet Böses gegen mich beabsichtigt, aber Gott beabsichtigte es zum Guten, um zu bewirken, was heute vor Augen steht[a]: viele Menschen am Leben zu erhalten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »um zu tun, wie es an diesem Tag ist«. Die hebräische Wendung weist auf das heute sichtbare Ergebnis hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: hattet … beabsichtigt / beabsichtigte es
  rationale: Die Wiederholung desselben Verbs bewahrt die bewusst gesetzte Parallele zwischen der bösen Absicht der Brüder und Gottes guter Absicht.
- source_word: עָלַי רָעָה
  choice: Böses gegen mich
  rationale: עַל hat hier feindliche Bedeutung; רָעָה bezeichnet angesichts der Schuld der Brüder nicht nur Schaden, sondern moralisch Böses.
- source_word: לְטֹבָה
  choice: zum Guten
  rationale: Die knappe Formulierung erhält den deutlichen Gegensatz zu »Böses«.
- source_word: לְמַעַן עֲשֹׂה
  choice: um zu bewirken
  rationale: לְמַעַן bezeichnet den Zweck; עשה meint in diesem Zusammenhang das Herbeiführen eines geschichtlichen Ergebnisses.
- source_word: כַּיּוֹם הַזֶּה
  choice: was heute vor Augen steht
  rationale: Die hebräische Wendung verweist auf das gegenwärtige, nun sichtbar gewordene Ergebnis.
- source_word: לְהַחֲיֹת
  choice: am Leben zu erhalten
  rationale: Der Hifil von חיה bezeichnet hier das Bewahren beziehungsweise Erhalten von Leben.
- source_word: עַם רָב
  choice: ein zahlreiches Volk
  rationale: Die kollektive Wendung wird formal bewahrt; sie kann eine große Menschengruppe bezeichnen, ohne hier zwingend eine bestimmte ethnische Zuordnung festzulegen.
theological_decisions:
- issue: Göttliche Vorsehung und menschliches Böses in der Wiederholung von חשב
  choice: Für beide Subjekte dasselbe Kernverb »beabsichtigen« verwenden
  alternative: Bei den Brüdern »beabsichtigen«, bei Gott »zum Guten wenden«
  rationale: Der hebräische Parallelismus schreibt den Brüdern eine wirklich böse und Gott eine wirklich gute Absicht zu. Die gleiche Verbwahl erhält diese Spannung, ohne Gott bloß als nachträglich Reagierenden darzustellen oder ihn mit der moralischen Schuld der Brüder gleichzusetzen.
- issue: Moralische Bedeutung von רָעָה
  choice: »Böses«
  alternative: »Schaden«
  rationale: Der Kontext handelt von schuldhaftem Tun der Brüder. »Böses« bewahrt die moralische Tragweite und den Gegensatz zum Guten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Parallelismus, löst die Spannung zwischen menschlicher Schuld und Gottes guter Absicht nicht auf und erklärt die deiktische Zeitwendung nur behutsam. Der Fußnotenmarker [a] steht im Haupttext.
