  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: de
  text: Seine Söhne trugen ihn ins Land Kanaan und begruben ihn in der Höhle auf dem Feld Machpela, gegenüber von Mamre. Dieses Feld hatte Abraham von Ephron, dem Hetiter, als Begräbnisbesitz gekauft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor Mamre« beziehungsweise »Mamre gegenüber«.'
    reason: Die hebräische Ortsangabe עַל־פְּנֵי lässt sowohl eine Wiedergabe mit „vor“ als auch mit „gegenüber“ zu.
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: brachten ihn
  rationale: נשׂא bezeichnet hier das Tragen beziehungsweise Überführen von Jakobs Leichnam. „Brachten ihn“ ist im Deutschen natürlich und umfasst den Transport im erzählerischen Zusammenhang.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Der hebräische Text nennt ausdrücklich seine Söhne.
- source_word: אַרְצָה כְּנַעַן
  choice: ins Land Kanaan
  rationale: Die Richtungsendung und אֶרֶץ werden mit „ins Land Kanaan“ klar und quellennah wiedergegeben.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: in der Höhle auf dem Feld von Machpela
  rationale: Die hebräische Konstruktverbindung bezeichnet die zum Feld von Machpela gehörende Höhle. „Auf dem Feld“ ist im modernen Deutsch verständlicher als das schwerfällige „in der Höhle des Feldes“.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: Abraham hatte dieses Feld … gekauft
  rationale: Die hebräische Relativkonstruktion nimmt mit אֶת הַשָּׂדֶה ausdrücklich „das Feld“ als Kaufgegenstand wieder auf. Ein neuer Satz löst die Konstruktion eindeutig und natürlich auf.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: als Grundbesitz für eine Grabstätte
  rationale: אֲחֻזָּה bezeichnet einen rechtmäßig erworbenen, dauerhaften Besitz; die Formulierung bewahrt sowohl den Eigentums- als auch den Bestattungsaspekt.
- source_word: עֶפְרֹן הַחִתִּי
  choice: Ephron, dem Hetiter
  rationale: „Hetiter“ ist die etablierte moderne deutsche Bezeichnung für חִתִּי.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: gegenüber von Mamre
  rationale: Die Wendung beschreibt die räumliche Lage vor beziehungsweise gegenüber einem Ort, ohne bloße Nähe auszudrücken.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die komplexe hebräische Relativkonstruktion wurde in zwei Sätze aufgelöst, damit eindeutig bleibt, dass Abraham das Feld kaufte. Der rechtliche Besitzcharakter von אֲחֻזָּה bleibt ausdrücklich erhalten.
