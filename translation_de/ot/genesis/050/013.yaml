    reason: Die hebräische Ortsangabe עַל־פְּנֵי lässt sowohl eine Wiedergabe mit „vor“ als auch mit „gegenüber“ zu.
  revision_rationale: Die Revision fasst die Ortsbeschreibung beim Feld Machpela zusammen und setzt anschließend klar das Feld als Kaufgegenstand Abrahams. Damit wird die hebräische resumptive Konstruktion sachgerecht und ohne Mehrdeutigkeit in modernes Deutsch übertragen. Die Fußnotenmarke bleibt an der Aussage über Mamre verankert; die im Satz vorgezogene Stellung der Ortsangabe verändert ihren Bezug nicht.
