revisions:
- from: Seine Söhne brachten ihn ins Land Kanaan und begruben ihn in der Höhle auf dem Feld von Machpela. Abraham hatte dieses Feld von Ephron, dem Hetiter, als Grundbesitz für eine Grabstätte gekauft; es lag gegenüber von Mamre.[a]
  to: Seine Söhne trugen ihn ins Land Kanaan und begruben ihn in der Höhle auf dem Feld Machpela, gegenüber von Mamre. Dieses Feld hatte Abraham von Ephron, dem Hetiter, als Begräbnisbesitz gekauft.[a]
  rationale: Die Revision fasst die Ortsbeschreibung beim Feld Machpela zusammen und setzt anschließend klar das Feld als Kaufgegenstand Abrahams. Damit wird die hebräische resumptive Konstruktion sachgerecht und ohne Mehrdeutigkeit in modernes Deutsch übertragen. Die Fußnotenmarke bleibt an der Aussage über Mamre verankert; die im Satz vorgezogene Stellung der Ortsangabe verändert ihren Bezug nicht.
  reviewer_model: gpt-5.6-terra
