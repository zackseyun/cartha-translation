review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die wesentlichen Handlungselemente, die Söhne, Kanaan, die Höhle, das Feld, Ephron den Hetiter und die Lage bei Mamre zutreffend wieder. Die Auflösung der hebräischen resumptiven Relativkonstruktion in einen neuen Satz ist grundsätzlich legitim. Allerdings lässt „Abraham hatte dieses Feld ... gekauft; es lag ...“ das Bezugsverhältnis der Ortsangabe weniger eng an der Grabstätte/Feldbezeichnung erkennen, und „auf dem Feld von Machpela“ ist gegenüber der Benennung des Feldes als „Feld Machpela“ etwas unnötig umschreibend.
  naturalness: „Brachte ihn“ ist verständlich, doch „trugen ihn“ entspricht dem konkreten Transportvorgang und ist in würdevoller deutscher Erzählsprache ebenso natürlich. Die revidierte Satzfolge macht deutlich und idiomatisch, dass das Feld der Kaufgegenstand war, ohne die hebräische Wiederaufnahme des Wortes „Feld“ missverständlich nachzuahmen.
  terminology: „Hetiter“ ist die übliche deutsche Bezeichnung. „Begräbnisbesitz“ bewahrt den rechtlichen Besitzcharakter von אֲחֻזָּה und die Zweckbestimmung durch קֶבֶר besser als „Grundbesitz für eine Grabstätte“, das im Deutschen eher nach einer allgemeinen Grundstücksart klingt. „Gegenüber von Mamre“ ist als vorsichtige Wiedergabe von עַל־פְּנֵי vertretbar.
  issues:
  - severity: medium
    issue: Die Zugehörigkeit der Ortsangabe ist im zweiten Satz gelockert.
    rationale: Im Hebräischen steht עַל־פְּנֵי מַמְרֵא unmittelbar in der Beschreibung des erworbenen Feldes beziehungsweise der Grabstätte. Nach dem Semikolon kann „es“ zwar das Feld meinen, die räumliche Bestimmung wird aber weniger transparent an die Ortsbeschreibung gebunden.
  - severity: low
    issue: „Grundbesitz für eine Grabstätte“ ist semantisch möglich, aber weniger präzise als eine Besitzbezeichnung für Bestattungszwecke.
    rationale: אֲחֻזַּת קֶבֶר bezeichnet einen erworbenen bzw. dauerhaften Besitz als Begräbnisstätte; „Begräbnisbesitz“ bringt beide Bestandteile knapp zum Ausdruck.
  revised_text: Seine Söhne trugen ihn ins Land Kanaan und begruben ihn in der Höhle auf dem Feld Machpela, gegenüber von Mamre. Dieses Feld hatte Abraham von Ephron, dem Hetiter, als Begräbnisbesitz gekauft.[a]
  revised_footnotes:
