    issue: »warf sich« ist gegenüber dem hebräischen Verb interpretativ verstärkt.
    rationale: נפל bedeutet primär „fallen“. Zwar kann der Kontext eine bewusste Bewegung nahelegen, doch »warf sich« fügt Intensität und Absicht hinzu, die der hebräische Wortlaut nicht ausdrücklich markiert.
  - severity: low
    issue: Die Fußnote ist derzeit an »küsste ihn« statt an »weinte über ihm« verankert.
    rationale: Die Anmerkung behandelt die Bedeutung von וַיֵּבְךְ עָלָיו und muss daher beim entsprechenden deutschen Ausdruck stehen.
