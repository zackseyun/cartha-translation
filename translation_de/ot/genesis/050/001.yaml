  verdict: revise
  source_fidelity: Die Wiedergabe der Abfolge sowie von »weinte« und »küsste ihn« ist quellentreu. »warf sich« verstärkt jedoch gegenüber וַיִּפֹּל („fiel“) die willentliche, energische Bewegung; »fiel« bewahrt die konkrete und zugleich offene Bildlichkeit des Hebräischen besser.
  naturalness: Die vorgeschlagene Fassung ist in würdiger biblischer Erzählsprache natürlich. »fiel auf das Gesicht seines Vaters« ist bewusst körperlich und im Kontext verständlich, ohne die Bildlichkeit zu paraphrasieren. Die Fußnotenziffer steht unmittelbar bei dem Wortlaut, den die Anmerkung erläutert.
  terminology: »Josef« ist die gebräuchliche deutsche Namensform. »weinte über ihm« lässt sowohl die räumliche Vorstellung als auch die Trauerhandlung anklingen; die Alternative »weinte um ihn« ist sinnvoll als Fußnote gesichert.
  issues:
