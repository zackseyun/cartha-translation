  yaml_path: translation/ot/genesis/050/001.yaml
  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: de
  text: Da fiel Josef auf das Gesicht seines Vaters, weinte über ihm[a] und küsste ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weinte um ihn“. Das Hebräische kann hier sowohl die räumliche Haltung über dem Vater als auch die Trauer um ihn ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: warf sich
  rationale: Das Wayyiqtol von נפל bezeichnet die nächste abgeschlossene Handlung. Im Deutschen gibt „warf sich“ die bewusste körperliche Bewegung in diesem Trauerzusammenhang natürlicher wieder als das missverständliche „fiel“.
- source_word: עַל פְּנֵי אָבִיו
  choice: auf das Gesicht seines Vaters
  rationale: Die konkrete hebräische Wendung wird bewahrt. Sie beschreibt Josefs unmittelbare körperliche Nähe zum Gesicht seines verstorbenen Vaters, ohne die Szene zu einer bloß allgemeinen Umarmung zu verflachen.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: weinte über ihm
  rationale: בכה bedeutet „weinen“. עַל mit dem Pronomen kann hier sowohl die räumliche Haltung über dem Toten als auch die Klage um ihn anklingen lassen; „über ihm“ bewahrt in diesem Satz vorrangig die räumliche Bildlichkeit.
- source_word: וַיִּשַּׁק לוֹ
  choice: küsste ihn
  rationale: נשק im Qal bedeutet gewöhnlich „küssen“; das hebräische ל wird im Deutschen idiomatisch durch ein direktes Objekt wiedergegeben.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Gebräuchliche deutsche Namensform.
