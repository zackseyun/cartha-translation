base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: de
  text: Josef blieb in Ägypten[a], zusammen mit dem Haushalt seines Vaters. Josef wurde 110 Jahre alt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Josef wohnte in Ägypten, zusammen mit dem Haushalt seines Vaters.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann »sitzen«, »wohnen« oder »bleiben« bedeuten. Im erzählerischen Rückblick bezeichnet »blieb« passend Josefs fortgesetzten Aufenthalt in Ägypten nach Jakobs Tod.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Die Präpositionalverbindung ist eine eindeutige Ortsangabe.
- source_word: הוּא וּבֵית אָבִיו
  choice: er und das Haus seines Vaters
  rationale: בֵּית אָבִיו bezeichnet das väterliche Haus als Familien- und Haushaltsverband. Die formnahe Wiedergabe bewahrt diese soziale Bedeutung und die mögliche Weite des Ausdrucks.
- source_word: וַיְחִי
  choice: wurde … alt
  rationale: In Verbindung mit einer abschließenden Lebensjahresangabe gibt das idiomatische Deutsche »wurde 110 Jahre alt« den Sinn von חיה natürlich und genau wieder.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 Jahre
  rationale: Die genaue Altersangabe wird für moderne Lesbarkeit mit Ziffern wiedergegeben.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
theological_decisions: []
