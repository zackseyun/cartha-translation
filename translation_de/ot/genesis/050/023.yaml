  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: de
  text: Josef sah Ephraims Nachkommen bis in die dritte Generation.[a] Die Kinder Machirs, des Sohnes Manasses, wurden ebenfalls auf Josefs Knien geboren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Josef erlebte Ephraims Nachkommen bis in die dritte Generation.“ Wörtlich heißt es im Hebräischen: „Josef sah“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „auf Josefs Knien geboren“ kann auf die familiäre Anerkennung, Aufnahme oder besondere Annahme der Kinder hindeuten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Gibt das hebräische Verb wörtlich wieder und lässt im genealogischen Zusammenhang zugleich erkennen, dass Josef lange genug lebte, um diese Nachkommen zu erleben.
- source_word: לְאֶפְרַיִם
  choice: Ephraims
  rationale: Das ל in der Abstammungsformel wird im Deutschen natürlich als possessive Zuordnung der Nachkommen zu Ephraim wiedergegeben.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: Nachkommen bis in die dritte Generation
  rationale: Gibt die genealogische Reichweite verständlich wieder, ohne einen genaueren Verwandtschaftsgrad festzulegen, als der hebräische Ausdruck erkennen lässt.
- source_word: גַּם
  choice: Auch
  rationale: Kennzeichnet schlicht die Ergänzung und Parallelität des zweiten Satzteils.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: die Kinder Machirs, des Sohnes Manasses
  rationale: „Kinder“ lässt die mögliche weitere Bedeutung von בְּנֵי zu; der Genitivzusatz identifiziert Machir eindeutig als Sohn Manasses.
- source_word: יֻלְּדוּ
  choice: wurden geboren
  rationale: Direkte und natürliche Wiedergabe der passiven Form von ילד.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: auf Josefs Knien
  rationale: Bewahrt das konkrete hebräische Bild und legt seine kulturelle Bedeutung nicht einseitig fest.
theological_decisions:
- issue: Bedeutung der Geburt „auf Josefs Knien“
  choice: Das Bild bleibt wörtlich im Haupttext stehen und wird in einer Fußnote erläutert.
  alternative: Die Wendung als Annahme, Anerkennung oder Adoption der Kinder paraphrasieren.
  rationale: Die genaue soziale oder rechtliche Tragweite des Ausdrucks ist nicht sicher; die Übersetzung soll diese Mehrdeutigkeit bewahren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Nachkommen“ ist in der ersten Klausel natürlicher und genealogisch weiter als „Kinder“; die konkrete Wendung „auf Josefs Knien“ bleibt bewusst erhalten.
