  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: de
  text: 'Als Josefs Brüder sahen, dass ihr Vater tot war, sagten sie: »Vielleicht hegt Josef Groll gegen uns und wird uns gewiss all das Böse vergelten, das wir ihm angetan haben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: Was, wenn Josef uns feindlich gesinnt ist
  rationale: לוּ leitet hier eine besorgte Möglichkeit ein; שׂטם bezeichnet anhaltende Feindschaft oder Hass. Die Formulierung gibt die Sorge natürlich wieder, ohne die Möglichkeit als Tatsache festzulegen.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: und uns … voll und ganz vergilt
  rationale: Der absolute Infinitiv mit finitem Verb verstärkt die Aussage. „Voll und ganz“ bildet diese emphatische Konstruktion ab; „vergelten“ passt zum Kontext der befürchteten Gegenleistung.
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: all das Böse, das wir ihm angetan haben
  rationale: רָעָה wird moralisch klar als „Böses“ wiedergegeben. גמל mit Objekt bezeichnet hier das Zufügen beziehungsweise Erweisen; idiomatisches Deutsch verlangt „angetan haben“.
theological_decisions:
- issue: Ob Josef tatsächlich feindselig ist oder ob nur die Brüder dies befürchten
  choice: als offene, ängstliche Möglichkeit formuliert
  alternative: „Josef wird uns gewiss hassen“
  rationale: Die Partikel לוּ und der Zusammenhang geben die Sorge der Brüder wieder, nicht eine bestätigte innere Haltung Josefs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt natürlich und bewahrt zugleich die emphatische Vergeltungsaussage des Hebräischen.
