    rationale: Das Verb שׂטם bezeichnet hier feindseligen Hass bzw. das Hegen eines Grolls. Eine entsprechend aktivere Formulierung ist quellennäher und im Deutschen idiomatischer.
  - severity: low
    issue: Die befürchtete Vergeltung sollte als zukünftige Folge formuliert werden.
    rationale: Die hebräischen Imperfektformen schildern die von den Brüdern befürchtete Möglichkeit. „wird … vergelten“ macht dies im Deutschen deutlich; „gewiss“ wahrt die emphatische Verbkonstruktion.
