  verdict: revise
  source_fidelity: Der Entwurf trifft die besorgte Möglichkeit, die feindselige Haltung und die nachdrücklich erwartete Vergeltung im Wesentlichen. „Feindlich gesinnt ist“ ist jedoch eine etwas abgeschwächte und statische Wiedergabe von יִשְׂטְמֵנוּ („uns hassen / Groll gegen uns hegen“). Die finite Zukunftsform im Deutschen bildet die befürchtete Folge klarer ab.
  naturalness: Der Satz ist verständlich und würdevoll. „Was, wenn … feindlich gesinnt ist“ klingt jedoch weniger idiomatisch als eine mit „Vielleicht“ eingeleitete Befürchtung; „Groll gegen uns hegt“ ist im Kontext der Brüder natürlicher.
  terminology: „Böse(s)“, „vergelten“ und „angetan haben“ sind treffend. „Gewiss“ gibt die Verstärkung durch den Infinitiv absolut in וְהָשֵׁב יָשִׁיב angemessen wieder, ohne über die Aussage hinauszugehen.
  issues:
