base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: de
  text: 'Da sagte der Pharao: „Zieh hinauf und begrabe deinen Vater, wie er dich hat schwören lassen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung fort. „Da sagte“ gibt den Erzählfluss im modernen Deutschen natürlich wieder, ohne die zeitliche oder logische Beziehung stärker festzulegen als der Kontext.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Herrscherbezeichnung; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: עלה bezeichnet wörtlich das Hinaufziehen. Im Kontext geht es um die Reise von Ägypten nach Kanaan; „zieh hinauf“ bewahrt diese bedeutsame Richtungsangabe und klingt bei einer Reisegruppe natürlich.
- source_word: וּקְבֹר
  choice: und begrabe
  rationale: קבר bedeutet direkt „begraben“. Das folgende Objekt „deinen Vater“ wird ohne Ergänzung oder gehobene Umschreibung wiedergegeben.
- source_word: אֶת אָבִיךָ
  choice: deinen Vater
  rationale: Die Akkusativpartikel mit dem Substantiv und dem Suffix der 2. Person Singular wird idiomatisch als „deinen Vater“ übersetzt.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion bezeichnet hier Art und Entsprechung und verbindet die Erlaubnis des Pharaos mit dem zuvor auferlegten Schwur.
- source_word: הִשְׁבִּיעֶךָ
  choice: er dich hat schwören lassen
  rationale: 'Der Hifil von שׁבע ist kausativ: Der Vater veranlasste Josef zu schwören. „Hat schwören lassen“ bewahrt diese Bedeutung in natürlichem, würdigem Deutsch.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Richtungsangabe „hinauf“ und die kausative Bedeutung des Schwurverbs bleiben erhalten; eine Fußnote ist nicht nötig, da der Haupttext beides klar ausdrückt.
