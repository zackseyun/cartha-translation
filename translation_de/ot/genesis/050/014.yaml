source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: de
  text: Nachdem Josef seinen Vater begraben hatte, kehrte er nach Ägypten zurück, zusammen mit seinen Brüdern und allen, die mit ihm hinaufgezogen waren[a], um seinen Vater zu begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Hinaufziehen« ist die übliche biblische Ausdrucksweise für die Reise von Ägypten nach Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Die Erzählform von שׁוב bezeichnet hier Josefs abgeschlossene Rückkehr nach Ägypten. Die deutsche Verbklammer gibt dies natürlich wieder.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Das Richtungs-ה bezeichnet eine Bewegung auf Ägypten zu; nach »zurückkehren« ist »nach Ägypten« die idiomatische deutsche Form.
- source_word: הוּא וְאֶחָיו
  choice: zusammen mit seinen Brüdern
  rationale: Das selbstständige Pronomen hebt Josef als Hauptperson hervor. Die mitgekehrte Gruppe wird im Deutschen natürlich mit »zusammen mit« angeschlossen.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: und allen, die mit ihm hinaufgezogen waren
  rationale: Das Partizip von עלה bewahrt die biblische Vorstellung des Hinaufziehens von Ägypten nach Kanaan; das Plusquamperfekt macht deutlich, dass diese Reise vor der Rückkehr lag.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: um seinen Vater zu begraben
  rationale: Der Infinitiv mit ל bezeichnet den Zweck des Hinaufziehens.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: Nachdem Josef seinen Vater begraben hatte
  rationale: אַחֲרֵי kennzeichnet die zeitliche Folge. Der maskuline Singularsuffix bezieht sich im Zusammenhang am natürlichsten auf Josef. Die Voranstellung des Nebensatzes ergibt einen klaren, flüssigen deutschen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für bessere Verständlichkeit umgestellt; die im Hebräischen wiederholte Wendung »seinen Vater begraben« bleibt erhalten.
