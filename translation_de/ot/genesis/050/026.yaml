  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: de
  text: Josef starb im Alter von hundertzehn Jahren. Man balsamierte ihn ein und legte ihn in Ägypten in einen Sarg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: מות bezeichnet unmittelbar das Sterben; „starb“ ist die klare, natürliche deutsche Entsprechung ohne beschönigenden Euphemismus.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: im Alter von hundertzehn Jahren
  rationale: Die hebräische Altersangabe lautet wörtlich „ein Sohn von hundertzehn Jahren“. Die gewählte Form gibt diese idiomatisch und vollständig auf Deutsch wieder.
- source_word: וַיַּחַנְטוּ אֹתוֹ
  choice: Man balsamierte ihn ein
  rationale: חנט bezeichnet hier im ägyptischen Zusammenhang das Einbalsamieren. „Einbalsamieren“ bleibt näher am Verb als das stärker kulturell ausdeutende „mumifizieren“. Das unbestimmte „man“ gibt das nicht näher bezeichnete Subjekt der 3. Person Plural natürlich wieder.
- source_word: וַיִּישֶׂם
  choice: legte
  rationale: שׂים bedeutet „setzen, legen, stellen“. Bei einer Person, die in einen Sarg kommt, ist „legte“ im Deutschen natürlich und würdevoll.
- source_word: בָּאָרוֹן
  choice: in einen Sarg
  rationale: אָרוֹן kann „Kasten“, „Lade“ oder im Bestattungskontext „Sarg“ bedeuten. Der Zusammenhang mit dem Einbalsamieren bestimmt hier die Bedeutung. Obwohl das Hebräische den Artikel trägt, verlangt der deutsche Einführungskontext idiomatisch den unbestimmten Artikel.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Dies ist die übliche deutsche Wiedergabe des Ortsnamens.
- source_word: וַ
  choice: ohne gesondertes einleitendes Wort
  rationale: Das eröffnende narrative Waw verbindet den Satz mit dem Vorhergehenden. Im modernen Deutschen kann diese Fortführung durch die Satzfolge selbst ausgedrückt werden; ein zusätzliches „Und“ wäre möglich, aber stilistisch weniger natürlich.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Erzählprosa. Die hebräische Satzreihe wird in zwei deutsche Hauptsätze gegliedert, damit der Vers natürlich lesbar bleibt, ohne Inhalt oder Reihenfolge zu verändern.
