source:
  edition: WLC
  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: de
  text: Mit ihm zogen außerdem Streitwagen[a] und Reiter hinauf, und der Zug war sehr groß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Streitwagen“ in der Einzahl, hier aber als Sammelbezeichnung für die Streitwagenabteilung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und das Lager war sehr schwer“; gemeint sein kann, dass der Zug sehr groß, bedeutend oder eindrucksvoll war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עִמּוֹ
  choice: Mit ihm zogen … hinauf
  rationale: Bewahrt die übliche Richtungsbedeutung von עלה und gibt עִמּוֹ unmittelbar wieder; im Reisebericht bezeichnet der Ausdruck das Hinaufziehen von Ägypten nach Kanaan.
- source_word: גַּם ... גַּם
  choice: außerdem … und
  rationale: Die wiederholte Partikel fügt Streitwagen und Reiter gemeinsam als weitere Begleiter hinzu. Die gewählte Formulierung ist im Deutschen natürlich und erhält den additiven Nachdruck.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: Das grammatisch singularische Wort wird hier kollektiv für die Streitwagenabteilung gebraucht; der deutsche Plural gibt diesen Sinn natürlich wieder.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Bezeichnet berittene Männer; „Reiter“ ist klar, würdig und weniger modern-militärisch als „Kavallerie“.
- source_word: הַמַּחֲנֶה
  choice: der Zug
  rationale: Im Zusammenhang ist die gesamte reisende Begleitung gemeint. „Zug“ passt zu einem großen Leichenzug und vermeidet die Vorstellung eines ortsfesten Lagers.
- source_word: כָּבֵד מְאֹד
  choice: war sehr groß
  rationale: Wörtlich steht „war sehr schwer“. Auf eine Menschengruppe bezogen drückt das Idiom beträchtliche Größe, Stärke oder Eindruck aus; „sehr groß“ vermittelt den naheliegenden Sinn, während die Bildsprache in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Zug“ bezeichnet hier die gesamte reisende Gesellschaft; die wörtlicheren, aber im Kontext missverständlichen Ausdrücke „Lager“ und „schwer“ werden in der Fußnote dokumentiert.
