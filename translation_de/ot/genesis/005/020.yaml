lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: So betrug … die gesamte Lebenszeit
  rationale: Die hebräische genealogische Zusammenfassung bezeichnet die Gesamtdauer des Lebens. Die deutsche Formulierung gibt sowohl den zusammenfassenden Charakter als auch den erzählerischen Anschluss natürlich wieder.
- source_word: יֶרֶד
  choice: Jered
  rationale: Die im Deutschen übliche Form gibt den hebräischen Namen angemessen wieder.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 962 Jahre
  rationale: Die beiden hebräischen Zahlengruppen werden in der im modernen Deutschen üblichen Reihenfolge als Gesamtzahl wiedergegeben.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Die Wendung bewahrt die schlichte Abschlussformel des Geschlechtsregisters; „dann“ bringt die erzählerische Folge des hebräischen Wayyiqtol natürlich zum Ausdruck.
