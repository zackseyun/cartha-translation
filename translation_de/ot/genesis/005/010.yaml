  text: וַֽ/יְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: de
  text: Und nachdem Enosch Kenan[a] gezeugt hatte, lebte er noch 815 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Kenan“; in von der griechischen Form beeinflusster Überlieferung auch „Kainan“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: חיה bezeichnet in der genealogischen Formel das Weiterleben nach der Zeugung; „noch“ macht den zeitlichen Bezug im Deutschen natürlich deutlich, ohne zusätzliche Dauer hinzuzufügen.
- source_word: אֱנוֹשׁ
  choice: Enosch
  rationale: „Enosch“ gibt die hebräische Namensform אֱנוֹשׁ im Deutschen unmittelbar und nach gängigen Umschriftkonventionen wieder.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: nachdem … gezeugt hatte
  rationale: Die temporale Konstruktion wird idiomatisch wiedergegeben; das Hifil von ילד bezeichnet im genealogischen Zusammenhang das Zeugen eines Nachkommen.
- source_word: אֶת קֵינָן
  choice: Kenan
  rationale: Der Name wird direkt aus dem Hebräischen wiedergegeben; אֶת ist der nicht zu übersetzende Akkusativmarker.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 815 Jahre
  rationale: Die hebräische Summe 15 + 800 wird in der im Deutschen üblichen Zahlenfolge knapp und eindeutig wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Das wiederholte ילד wird entsprechend seinem genealogischen Sinn mit „zeugen“ übersetzt; dies ist präziser als das allgemeinere „Kinder haben“.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen bleibt erhalten.
