lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Das Verb חיה bezeichnet in der genealogischen Altersformel die Lebensjahre bis zum jeweils folgenden Ereignis; „lebte“ gibt die hebräische Form knapp und idiomatisch wieder.
- source_word: שֵׁת
  choice: Set
  rationale: „Set“ ist die im Deutschen etablierte, unmittelbar auf den hebräischen Namen bezogene Form.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 Jahre
  rationale: Die hebräische Zahlenfolge lautet wörtlich „fünf Jahre und hundert Jahr“ und bezeichnet eindeutig 105 Jahre. Die Ziffernschreibung ist im modernen Deutschen klar und natürlich.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist präzise, knapp und in einer Abstammungsliste angemessen.
- source_word: אֶת אֱנוֹשׁ
  choice: Enosch
  rationale: Die Akkusativpartikel אֶת wird im Deutschen nicht eigens wiedergegeben. „Enosch“ bildet den hebräischen Namen אֱנוֹשׁ unmittelbar und nach deutscher Lautkonvention ab.
