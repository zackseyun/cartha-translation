  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: de
  text: Jared war 162 Jahre alt und zeugte Henoch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In der genealogischen Altersformel gibt die Verbindung von חיה mit einer Jahreszahl idiomatisch das erreichte Lebensalter an; im Deutschen ist „war … Jahre alt“ natürlicher als „lebte … Jahre“ und verbindet sich klar mit dem folgenden Zeugungsereignis.
- source_word: יֶרֶד
  choice: Jered
  rationale: „Jered“ ist die im Deutschen etablierte biblische Namensform und bildet den hebräischen Namen angemessen ab.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: 162 Jahre
  rationale: Die hebräische Zahlenfolge bezeichnet insgesamt 162 Jahre; die Ziffernschreibung ist im modernen deutschen Fließtext knapp und eindeutig.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד die männliche Elternschaft. „zeugte“ ist präzise, knapp und im Deutschen weiterhin verständlich, ohne die Aussage zu erweitern.
- source_word: אֶת חֲנוֹךְ
  choice: Henoch
  rationale: Die Objektmarkierung אֶת bleibt unübersetzt; „Henoch“ ist die etablierte deutsche Namensform.
