base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: de
  text: Nachdem Mahalalel Jered gezeugt hatte, lebte er noch 830 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: Das Verb חיה bezeichnet in der genealogischen Formel die weitere Lebenszeit nach der Geburt des genannten Sohnes; „lebte … noch“ gibt diesen zeitlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Nachdem … gezeugt hatte
  rationale: Die temporale Verbindung mit dem Hifil von ילד bezeichnet den Zeitraum nach der Zeugung; die deutsche Nebensatzkonstruktion gibt dies klar und idiomatisch wieder.
- source_word: יֶרֶד
  choice: Jered
  rationale: „Jered“ entspricht der in deutschen Bibelübersetzungen üblichen Transliteration des hebräischen Namens.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 830 Jahre
  rationale: Die hebräische Zahlenfolge lautet wörtlich „dreißig Jahre und achthundert Jahre“. Die Ziffernschreibung wahrt den Gesamtwert und ist in modernem Deutsch leicht erfassbar.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Das Hifil von ילד mit männlichem Subjekt bedeutet „zeugen“. Die Wiederholung bewahrt die lexikalische Verbindung zum ersten Vorkommen.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen wird beibehalten.
