  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Altersformel vermeidet das im Deutschen schwerfällige „lebte 65 Jahre und zeugte“, ohne den zeitlichen Bezug der hebräischen Genealogie zu verändern.
