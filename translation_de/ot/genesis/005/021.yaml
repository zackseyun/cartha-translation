  yaml_path: translation/ot/genesis/005/021.yaml
  text: Enoch lived sixty-five years and fathered Methuselah.
translation:
  language: de
  text: Henoch war 65 Jahre alt, als er Metuschelach zeugte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In der genealogischen Altersformel bezeichnet חיה die bis zur Zeugung erreichten Lebensjahre. Die deutsche Wendung „war … Jahre alt“ gibt diese Funktion natürlich und präzise wieder.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: 65 Jahre
  rationale: Die Zahl wird in der natürlichen deutschen Reihenfolge wiedergegeben; Ziffern erleichtern in der genealogischen Aufzählung die Erfassung.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד mit männlichem Subjekt bezeichnet im genealogischen Zusammenhang das Zeugen eines Kindes. „zeugte“ ist knapp, sachlich und im heutigen Deutsch verständlich.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung und wird durch den Satzbau ausgedrückt.
- source_word: מְתוּשָׁלַח
  choice: Metuschelach
  rationale: Die Form gibt den hebräischen Namen nachvollziehbar wieder und entspricht einer gebräuchlichen deutschen Transkription.
