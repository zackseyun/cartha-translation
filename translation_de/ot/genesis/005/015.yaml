base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: de
  text: Als Mahalalel 65 Jahre alt war, zeugte er Jered.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Als … Jahre alt war
  rationale: Die genealogische Formel bezeichnet hier die bis zur Zeugung erreichte Lebenszeit. Die deutsche Altersangabe mit „als … Jahre alt war“ gibt den zeitlichen Zusammenhang natürlich und genau wieder.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert und nicht übersetzt.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: 65 Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich „fünf Jahre und sechzig Jahre“. Modernes Deutsch ordnet die Zahl als 65, ohne ihren Wert zu verändern.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד die männliche Zeugung. „Zeugte“ ist präzise, knapp und im Deutschen für Stammbäume weiterhin verständlich.
- source_word: אֶת יָרֶד
  choice: Jered
  rationale: Die Akkusativmarkierung אֶת bleibt unübersetzt. Der Name יָרֶד wird in der etablierten deutschen Form „Jered“ wiedergegeben.
