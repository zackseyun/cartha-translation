  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: de
  text: 'Und er gab ihm den Namen Noah[a] und sagte: »Dieser wird uns Erleichterung bringen von unserer Arbeit und von der Mühsal unserer Hände, die uns der Erdboden verursacht, den Jahwe verflucht hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Noah klingt im Hebräischen an Wörter für »Ruhe« oder »Erleichterung« an; das hier verwendete Verb bedeutet eigentlich »trösten«.
    reason: Das hebräische Wortspiel verbindet ähnlich klingende, aber nicht identische Wortwurzeln und lässt sich im Deutschen nicht vollständig nachbilden.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: Und er gab ihm den Namen
  rationale: Die deutsche Namensformel gibt die hebräische Konstruktion natürlich wieder, ohne ihren Sinn zu verkürzen.
- source_word: נֹחַ
  choice: Noah
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: זֶה
  choice: Dieser
  rationale: Bewahrt die demonstrative Hervorhebung des Kindes.
- source_word: יְנַחֲמֵנוּ
  choice: wird uns Trost schenken
  rationale: Gibt die Grundbedeutung von נחם als trösten wieder und lässt zugleich das lautliche Wortspiel mit Noah anklingen, ohne eine strenge Etymologie zu behaupten.
- source_word: מִמַּעֲשֵׂנוּ
  choice: bei unserer Arbeit
  rationale: Der Kontext bezeichnet menschliche Arbeit. Das hebräische מִן markiert hier den Bereich beziehungsweise Anlass des erhofften Trostes; idiomatisches Deutsch verwendet dafür „bei“.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: und bei der Mühsal unserer Hände
  rationale: „Mühsal“ umfasst Schmerz und beschwerliche Arbeit und bewahrt die Anspielung auf Genesis 3,17; „unserer Hände“ erhält das konkrete hebräische Bild.
- source_word: מִן־הָאֲדָמָה
  choice: auf dem Erdboden
  rationale: Ordnet den Erdboden idiomatisch dem Arbeitszusammenhang zu und bewahrt das Leitwort אֲדָמָה aus dem Fluchbericht.
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: den … verflucht hat
  rationale: Gibt den Relativsatz und den resultativen Sinn der vollendeten Handlung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wortspiel zwischen Noah (נֹחַ) und יְנַחֲמֵנוּ
  choice: Im Haupttext „wird uns Trost schenken“; die Fußnote erläutert die lautliche Verbindung zu Ruhe und Erleichterung.
  alternative: „wird uns Erleichterung verschaffen“ oder „wird uns Ruhe geben“
  rationale: Das Verb bedeutet eigentlich „trösten“, während der Name Noah lautlich eher an „Ruhe“ erinnert. Die Formulierung bewahrt diese Spannung, ohne aus dem Wortspiel eine genaue etymologische Ableitung zu machen.
- issue: Bezug der Präpositionalgruppen מִן … מִן־הָאֲדָמָה
  choice: Trost „bei“ Arbeit und Mühsal „auf“ dem Erdboden
  alternative: Trost „von“ unserer Arbeit und Mühsal, „von“ dem Erdboden
  rationale: Eine mechanische Wiederholung von „von“ wäre im Deutschen missverständlich. Die gewählte Syntax bildet den wahrscheinlichen Sinn ab, dass die verfluchte Erde die beschwerliche Handarbeit verursacht, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erdboden“ bewahrt die begriffliche Verbindung zum Fluch über die אֲדָמָה in Genesis 3; „Mühsal“ ist gehoben, aber allgemein verständlich. Direkte Rede mit deutschen Anführungszeichen.
