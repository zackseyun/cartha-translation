  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: de
  text: Dies ist das Buch der Geschlechterfolge Adams.[a] Als Gott den Menschen schuf,[b] machte er ihn Gott ähnlich.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Verzeichnis der Nachkommen Adams“ beziehungsweise „die Familiengeschichte Adams“. Das hebräische Wort kann die Generationen, die Nachkommen oder den von ihnen handelnden Bericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an dem Tag, als Gott den Menschen schuf“. Die hebräische Wendung kann hier allgemein zeitlich verstanden und mit „als“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „in der Ähnlichkeit Gottes“.'
    reason: formal_equivalence
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Dies ist das Buch
  rationale: Die nominale Überschrift wird im Deutschen natürlich mit „ist“ wiedergegeben; „Buch“ bewahrt den konkreten und feierlichen Charakter eines schriftlichen Verzeichnisses.
- source_word: תּוֹלְדֹת
  choice: Geschlechterfolge
  rationale: Der für Genesis prägende Ausdruck kann Generationen, Nachkommen oder deren Geschichte bezeichnen. „Geschlechterfolge“ eignet sich hier als genealogische Überschrift, ohne den Begriff auf eine bloße Namensliste zu verengen.
- source_word: אָדָם (erste Stelle)
  choice: Adam
  rationale: In der genealogischen Überschrift bezeichnet das Wort den namentlich genannten Stammvater.
- source_word: בְּיוֹם בְּרֹא
  choice: An dem Tag, an dem … schuf
  rationale: Die Formulierung bewahrt die Bildlichkeit des hebräischen Zeitausdrucks; eine Fußnote weist darauf hin, dass die Wendung auch allgemein „als“ bedeuten kann.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht hier mit singularischem Sinn und wird standardgemäß mit „Gott“ wiedergegeben.
- source_word: אָדָם (zweite Stelle)
  choice: den Menschen
  rationale: Hier bezeichnet אָדָם im Rückblick auf die Schöpfung den Menschen repräsentativ beziehungsweise die Menschheit, nicht ausschließlich die Person mit dem Eigennamen Adam.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: Gott ähnlich
  rationale: Die natürliche deutsche Wendung gibt die Bedeutung „in der Ähnlichkeit Gottes“ wieder, ohne דְּמוּת mit dem anderen hebräischen Begriff für „Bild“ gleichzusetzen.
- source_word: עָשָׂה אֹתוֹ
  choice: machte er ihn
  rationale: „Machte“ unterscheidet עשה von dem zuvor verwendeten „schuf“; „ihn“ bewahrt den singularischen Rückbezug auf „den Menschen“.
theological_decisions:
- issue: Die zwei Bedeutungsnuancen von אָדָם im selben Vers
  choice: In der Überschrift „Adam“, im Schöpfungssatz „der Mensch“
  alternative: An beiden Stellen „Adam“ oder an der zweiten Stelle „die Menschheit“
  rationale: Die Überschrift eröffnet die Genealogie des Stammvaters Adam, während der folgende Satz die Schöpfungsaussage über den Menschen aufgreift. Die unterschiedliche Wiedergabe macht den Kontextwechsel sichtbar, ohne die Verbindung beider Verwendungen zu leugnen.
- issue: Verhältnis von דְּמוּת zur Schöpfungssprache in Genesis
  choice: „ähnlich“ als Wiedergabe von „Ähnlichkeit“
  alternative: „im Bild Gottes“
  rationale: Der Text verwendet דְּמוּת („Ähnlichkeit“), nicht צֶלֶם („Bild“). Die Übersetzung vermeidet daher eine stillschweigende Harmonisierung mit benachbarten Formulierungen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Überschrift bleibt bewusst etwas feierlich und strukturell; der anschließende Satz ist klar und idiomatisch. Die Fußnoten bewahren die Bedeutungsbreite von תּוֹלְדֹת, die zeitliche Nuance von בְּיוֹם und die substantivische Form von דְּמוּת.
