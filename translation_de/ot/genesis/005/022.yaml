  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: de
  text: Henoch ging, nachdem er Metuschelach gezeugt hatte, dreihundert Jahre lang mit Gott[a] und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lebte in Gemeinschaft mit Gott“. Wörtlich: „ging mit Gott“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: ging … mit
  rationale: Die reflexiv-intensive Form von הלך beschreibt hier bildhaft Henochs Lebensführung. „Ging mit“ bewahrt die Metapher, während „dreihundert Jahre lang“ die zeitliche Dauer im Deutschen eindeutig macht.
- source_word: אֶת הָאֱלֹהִים
  choice: mit Gott
  rationale: אֶת bezeichnet in dieser Verbindung die Gemeinschaft bzw. enge Beziehung zu Gott. Der Gottesname wird im Deutschen idiomatisch ohne Artikel wiedergegeben.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: nachdem er Metuschelach gezeugt hatte
  rationale: Die finite Nebensatzform ist natürliches modernes Deutsch und gibt die zeitliche Abfolge sowie die ausdrücklich väterliche Perspektive des Hifil von ילד wieder.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: dreihundert Jahre lang
  rationale: „Lang“ kennzeichnet eindeutig die Dauer von Henochs Gehen mit Gott und verhindert eine falsche Zuordnung der Zeitangabe zum Zeugen Metuschelachs.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: und zeugte Söhne und Töchter
  rationale: „Zeugte“ wahrt die männliche Elternperspektive des Hifil von ילד; „Söhne und Töchter“ bildet die ausdrücklich genannten beiden Gruppen vollständig ab.
theological_decisions:
- issue: Bedeutung der Aussage, Henoch sei „mit Gott gegangen“
  choice: Die relationale Wegmetapher bleibt im Haupttext erhalten.
  alternative: Henoch lebte in Gemeinschaft mit Gott.
  rationale: Der hebräische Ausdruck bezeichnet Henochs Lebensführung in Beziehung zu Gott, lässt aber deren genaue Art bildhaft offen. Eine rein erklärende Wiedergabe würde diese theologische Aussage enger festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung macht eindeutig, dass die dreihundert Jahre Henochs Gehen mit Gott bezeichnen; die Fußnote erläutert die hebräische Metapher, ohne sie im Haupttext aufzulösen.
