  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: de
  text: Und Jered lebte, nachdem er Henoch[a] gezeugt hatte, achthundert Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name lautet Chanokh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Das Verb חיה bezeichnet in der genealogischen Formel die Lebenszeit während des angegebenen Zeitraums; „lebte“ ist natürlich und präzise.
- source_word: יֶרֶד
  choice: Jered
  rationale: „Jered“ gibt die hebräische Namensform im Deutschen direkt und nach üblichen Transliterationskonventionen wieder.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: nachdem er … gezeugt hatte
  rationale: Die temporale Konstruktion bezeichnet die Zeit nach der Zeugung Henochs; der deutsche Nebensatz bildet das Zeitverhältnis klar ab.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: „Henoch“ ist die im Deutschen fest etablierte biblische Namensform und entspricht der hebräischen Aussprache hinreichend, ohne eine englisch geprägte Transliteration zu übernehmen.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: achthundert Jahre
  rationale: Die Zahlphrase bezeichnet eine Zeitdauer; im Deutschen steht idiomatisch der Plural „Jahre“.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Das Hifil von ילד bezeichnet in dieser Genealogie ausdrücklich die männliche Elternschaft; „zeugte“ ist präziser als das allgemeinere „hatte“.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die Übersetzung bewahrt die ausdrückliche Nennung männlicher und weiblicher Nachkommen.
