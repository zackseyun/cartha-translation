- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 187 Jahre
  rationale: Die hebräische Zahlenfolge bezeichnet einhundertsiebenundachtzig Jahre; die Ziffernschreibung ist in einer modernen deutschen Übersetzung klar und gut lesbar.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem Stammbaum das männliche Hervorbringen eines Nachkommen. „Zeugte“ ist prägnant, sachlich und im genealogischen Zusammenhang verständlich.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: לָמֶךְ
  choice: Lamech
  rationale: Der Personenname wird in seiner gebräuchlichen deutschen biblischen Form wiedergegeben.
