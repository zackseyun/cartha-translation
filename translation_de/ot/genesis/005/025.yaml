lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Das Verb חיה steht hier in der genealogischen Formel und wird im Deutschen natürlich und quellennah mit „lebte“ wiedergegeben.
- source_word: מְתוּשֶׁלַח
