  text: וַ/יִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת הָֽ/אֱלֹהִ֑ים וְ/אֵינֶ֕/נּוּ כִּֽי לָקַ֥ח אֹת֖/וֹ אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: de
  text: Henoch lebte in Gemeinschaft mit Gott; dann war er nicht mehr da,[a] denn Gott nahm ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und er war nicht«. Die hebräische Wendung besagt, dass Henoch nicht mehr anwesend war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: lebte in Gemeinschaft
  rationale: Der Hitpael von הלך beschreibt hier nicht bloß körperliches Gehen, sondern Henochs fortdauernde Lebensführung. Die deutsche Wendung gibt den relationalen Sinn der hebräischen Redeweise natürlich wieder.
- source_word: אֶת הָאֱלֹהִים
  choice: mit Gott / in Gemeinschaft mit Gott
  rationale: אֶת bezeichnet bei הלך die Begleitung. »In Gemeinschaft mit Gott« macht die im Hebräischen idiomatisch ausgedrückte Nähe verständlich, ohne eine bestimmte Lehrdeutung hinzuzufügen.
- source_word: וְאֵינֶנּוּ
  choice: dann war er nicht mehr da
  rationale: Wörtlich heißt die Wendung »und er war nicht«. Die gewählte Formulierung bezeichnet Henochs Abwesenheit, ohne deren Art näher festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Henochs Abwesenheit ein. »Denn« bewahrt den knappen, erzählerischen Anschluss.
- source_word: לָקַח אֹתוֹ
  choice: hatte ihn zu sich genommen
  rationale: לקח bedeutet grundsätzlich »nehmen«. Das im Deutschen idiomatische »zu sich nehmen« bewahrt die göttliche Initiative, legt aber weder Zielort noch genaue Art des Geschehens fest.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang bezeichnet אֱלֹהִים den einen Gott.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, Henoch sei nicht gestorben oder in den Himmel aufgenommen worden
  choice: 'Die zurückhaltende Aussage des hebräischen Textes bleibt erhalten: Er war nicht mehr da, denn Gott hatte ihn zu sich genommen.'
  alternative: »Henoch starb nicht« oder »Gott nahm ihn in den Himmel auf«
  rationale: Der Vers deutet ein außergewöhnliches göttliches Handeln an, nennt aber weder ausdrücklich den Himmel als Ziel noch verneint er hier ausdrücklich Henochs Tod. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung »wandelte mit Gott« wurde vermieden, weil »wandeln« heute altertümlich wirkt. »Lebte in Gemeinschaft mit Gott« vermittelt die idiomatische Bedeutung verständlich; die zweite Satzhälfte bleibt bewusst knapp und theologisch zurückhaltend.
