  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: de
  text: Nachdem Lamech Noah gezeugt hatte, lebte er noch fünfhundertfünfundneunzig Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: Im genealogischen Zusammenhang bezeichnet חיה die weitere Lebenszeit nach dem genannten Ereignis. „Lebte er noch“ gibt diesen zeitlichen Fortbestand im Deutschen natürlich wieder.
- source_word: אַֽחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: Nachdem Lamech Noah gezeugt hatte
  rationale: Die temporale Beziehung wird durch einen idiomatischen deutschen Nebensatz ausgedrückt; ילד im Hifil bezeichnet hier das Zeugen durch den Vater.
- source_word: נֹחַ
  choice: Noah
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאֹת שָׁנָה
  choice: fünfhundertfünfundneunzig Jahre
  rationale: Das Hebräische nennt 95 + 500 Jahre; die deutsche Zahlform ordnet die Bestandteile idiomatisch und bewahrt die Gesamtsumme 595.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das genealogische ילד im Hifil hat einen männlichen Elternteil als Subjekt; „zeugte“ bewahrt die spezifisch väterliche Bedeutung.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen wird beibehalten und nicht zum allgemeineren „Kinder“ verflacht.
theological_decisions: []
