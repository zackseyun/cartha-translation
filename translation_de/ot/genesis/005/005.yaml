  text: וַ/יִּֽהְי֞וּ כָּל יְמֵ֤י אָדָם֙ אֲשֶׁר חַ֔י תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וּ/שְׁלֹשִׁ֖ים שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/005.yaml
  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: de
  text: So betrug Adams gesamte Lebenszeit neunhundertdreißig Jahre[a], und er starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort Adam kann in anderen Zusammenhängen auch »Mensch« oder »Menschheit« bedeuten; hier bezeichnet es in der Genealogie die einzelne Person Adam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי אָדָם אֲשֶׁר חַי
  choice: So betrug Adams gesamte Lebenszeit
  rationale: Die deutsche Wendung gibt die genealogische Summenformel natürlich und präzise wieder. Das hebräische Bild von »allen Tagen« wird in verständliches modernes Deutsch übertragen, ohne den Sinn zu erweitern.
- source_word: אָדָם
  choice: Adam
  rationale: Im genealogischen Zusammenhang bezeichnet das Wort den einzelnen Namensträger Adam und nicht allgemein den Menschen oder die Menschheit.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וּשְׁלֹשִׁים שָׁנָה
  choice: neunhundertdreißig Jahre
  rationale: Die ausgeschriebene Zahl entspricht dem würdevollen Erzählregister und gibt die hebräische Gesamtzahl genau wieder.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die knappe Formulierung bewahrt den wiederkehrenden, eindringlichen Abschluss der genealogischen Angaben.
theological_decisions:
- issue: Bedeutung von אָדָם
  choice: Adam als Personenname
  alternative: Mensch oder Menschheit
  rationale: Der unmittelbare Kontext ist eine Genealogie und fasst die Lebenszeit der zuvor genannten Einzelperson Adam zusammen. Die mögliche allgemeinere Bedeutung des hebräischen Wortes wird in einer Fußnote transparent gemacht.
- issue: Bewahrung der Sterbeformel
  choice: und er starb
  alternative: dann starb er
  rationale: Das einfache »und« folgt der hebräischen Verknüpfung und vermeidet eine zusätzliche zeitliche Akzentuierung. Zugleich bleibt das Gewicht der wiederholten Aussage über die menschliche Sterblichkeit erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Gesamte Lebenszeit« vermeidet die im Deutschen schwerfällige wörtliche Formulierung »alle Tage Adams, die er lebte«, während die knappe Schlussformel bewusst erhalten bleibt.
