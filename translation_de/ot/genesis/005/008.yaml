lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: So lebte … insgesamt
  rationale: Die hebräische genealogische Summenformel bezeichnet die gesamte Lebenszeit. Die deutsche Wendung gibt den Sinn natürlich und würdig wieder, ohne die Formel unnötig auszubauen.
- source_word: שֵׁת
  choice: Set
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 912 Jahre
  rationale: Die hebräische Zahlenfolge lautet wörtlich »zwölf Jahre und neunhundert Jahre« und bezeichnet idiomatisch 912 Jahre; die Ziffernschreibung ist im modernen Deutschen unmittelbar verständlich.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Die Form schließt den genealogischen Eintrag als nächstes Erzählereignis ab. »Dann starb er« bewahrt die schlichte, feierliche Wiederholung der Formel.
