id: GEN.5.2
reference: Genesis 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: de
  text: Männlich und weiblich schuf er sie. Er segnete sie und gab ihnen den Namen »Mensch«[a] an dem Tag, als sie geschaffen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Adam. Das Wort kann kollektiv »Mensch« oder »Menschheit« bedeuten und ist zugleich der Eigenname Adam.
    reason: Bewahrt die Mehrdeutigkeit zwischen der kollektiven Bezeichnung der Menschheit und dem Eigennamen Adam.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: Männlich und weiblich
  rationale: Die adjektivische Form bewahrt die symmetrische Bezeichnung der beiden Geschlechter und entspricht der prädikativen Funktion im Hebräischen besser als »Mann und Frau«.
- source_word: בְּרָאָם
  choice: schuf er sie
  rationale: Das Qal Perfekt mit dem Suffix der 3. Person Plural bezeichnet Gottes Erschaffung beider; das deutsche Präteritum passt zum erzählenden Rückblick.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: Er segnete sie
  rationale: Direkte und idiomatische Wiedergabe der göttlichen Segenshandlung.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: gab ihnen den Namen
  rationale: Diese natürliche deutsche Namensformel bewahrt sowohl den gemeinsamen Namen als auch den Bezug auf beide Menschen.
- source_word: אָדָם
  choice: Mensch
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Wort Mann und Frau gemeinsam. Der Singular »Mensch« erhält die kollektive Kraft des einen Namens; die zugleich mögliche Lesart als Eigenname »Adam« wird in der Fußnote bewahrt.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: an dem Tag, als sie geschaffen wurden
  rationale: Die Formulierung erhält den zeitlichen Ausdruck und den passiven Sinn des hebräischen Niphal.
theological_decisions:
- issue: Wiedergabe von אָדָם als gemeinsamer Bezeichnung für Mann und Frau
  choice: Mensch
  alternative: Adam; Menschheit
  rationale: Da Gott in diesem Vers beiden Geschlechtern zusammen einen Namen gibt, steht der kollektive Sinn im Vordergrund. Die hebräische Form ist jedoch mit dem Eigennamen Adam identisch; diese echte Mehrdeutigkeit wird nicht aufgelöst, sondern in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wendung »Männlich und weiblich« wahrt die formale Paarung des Hebräischen; »gab ihnen den Namen« klingt im Deutschen natürlicher als die wörtliche Form »nannte ihren Namen«.
