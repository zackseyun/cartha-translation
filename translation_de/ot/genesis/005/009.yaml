base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: de
  text: Als Enosch 90 Jahre alt war, zeugte er Kenan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche Übersetzungen nennen ihn „Kainan“; der hebräische Text hat Kenan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: Als Enosch 90 Jahre alt war
  rationale: In der genealogischen Altersformel bezeichnet חיה mit der Zeitangabe das erreichte Lebensalter. Die deutsche Nebensatzform gibt den zeitlichen Zusammenhang mit der folgenden Geburt natürlich und genau wieder.
- source_word: אֱנוֹשׁ
  choice: Enosch
  rationale: Die Umschrift folgt unmittelbar der hebräischen Namensform und gibt den Schlusskonsonanten שׁ im Deutschen als „sch“ wieder.
- source_word: תִּשְׁעִים שָׁנָה
  choice: 90 Jahre alt
  rationale: Die hebräische Altersangabe wird idiomatisch in modernes Deutsch übertragen.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in männlichen Genealogien das Zeugen eines Nachkommen. „Zeugte“ ist präzise, knapp und im Deutschen weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der Akkusativmarker besitzt hier keine eigene lexikalische Bedeutung; seine grammatische Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: קֵינָן
  choice: Kenan
  rationale: Die Namensform wird direkt aus dem masoretischen hebräischen Text übernommen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die traditionelle genealogische Formulierung „zeugte“ bewahrt die genaue Vater-Kind-Aussage des hebräischen Verbs, ohne altertümliches „begat“-Äquivalent. Die Ziffer 90 ist für eine heutige Bibelausgabe gut lesbar.
