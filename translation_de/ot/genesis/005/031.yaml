  choice: Die Altersangabe wird ohne interpretierende Einschränkung als zusammenfassende Lebensdauer wiedergegeben.
  alternative: Die Zahl bereits in der Übersetzung symbolisch oder nichtwörtlich deuten.
  rationale: Der hebräische Text nennt unmittelbar eine Zahl und anschließend den Tod Lamechs; weitergehende Deutungen gehören nicht in den Übersetzungstext.
