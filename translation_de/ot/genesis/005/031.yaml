lexical_decisions:
- source_word: וַיְהִי כָּל יְמֵי
  choice: So lebte ... insgesamt
  rationale: Die hebräische Zusammenfassungsformel bezeichnet die gesamte Lebenszeit. Die deutsche Wendung gibt den fortschreitenden Erzählanschluss und den Gesamtsinn natürlich wieder.
- source_word: לֶמֶךְ
  choice: Lamech
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: '777'
  rationale: Die hebräische Zahlenfolge ergibt 777; die Ziffernschreibung ist im modernen Deutsch unmittelbar verständlich und vermeidet eine schwerfällige Formulierung.
- source_word: שָׁנָה
  choice: Jahre
  rationale: Nach der Zahl verlangt idiomatisches Deutsch den Plural.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Die Formulierung bewahrt die narrative Abfolge und den wiederkehrenden, gewichtigen Abschluss der genealogischen Formel.
