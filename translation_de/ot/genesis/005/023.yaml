  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: de
  text: Henochs gesamte Lebenszeit betrug 365 Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: So betrug
  rationale: Die mit וַ eingeleitete Verbform führt die zusammenfassende Angabe innerhalb des Geschlechtsregisters fort. „So betrug“ gibt diesen folgernden Erzählzusammenhang in natürlichem Deutsch wieder.
- source_word: כָּל יְמֵי
  choice: gesamte Lebenszeit
  rationale: Wörtlich „alle Tage“. In der genealogischen Formel bezeichnet die Wendung die vollständige Lebensdauer; „gesamte Lebenszeit“ ist die natürliche moderne deutsche Entsprechung.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: Die im Deutschen etablierte biblische Namensform wird beibehalten.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: '365'
  rationale: Die hebräische Zahlenfolge lautet wörtlich „fünf und sechzig und dreihundert“. Die Ziffernschreibung gibt den Gesamtwert in der im modernen Deutschen üblichen, klaren Form wieder.
- source_word: שָׁנָה ... שָׁנָה
  choice: Jahre
  rationale: Obwohl im Hebräischen bei den Zahlengliedern jeweils der Singular steht, verlangt idiomatisches Deutsch für die gesamte Altersangabe den Plural.
theological_decisions: []
translation_notes:
