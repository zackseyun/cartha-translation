  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ יְמֵי אָדָ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֵׁ֔ת שְׁמֹנֶ֥ה מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: de
  text: Nachdem Adam Set gezeugt hatte, lebte er noch achthundert Jahre[a] und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und die Tage Adams, nachdem er Set gezeugt hatte, waren achthundert Jahre.«'
    reason: Die Fußnote macht die formale hebräische Zeitformel sichtbar, während der Haupttext sie in natürliches Deutsch überträgt.
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Adam lebte
  rationale: Die hebräische Wendung lautet formal »die Tage Adams waren«, bezeichnet hier aber idiomatisch seine Lebenszeit. »Adam lebte« gibt diesen Sinn in natürlichem modernem Deutsch wieder.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֵׁת
  choice: Nachdem Adam Set gezeugt hatte
  rationale: אַחֲרֵי bezeichnet die zeitliche Folge; der Hifil von ילד meint hier die männliche Zeugung beziehungsweise das Vaterwerden. »Gezeugt« ist im genealogischen Zusammenhang präzise und würdevoll.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: noch achthundert Jahre
  rationale: Die Zeitangabe bezeichnet die achthundert Jahre nach Sets Zeugung. »Noch« macht diesen im Satzbau enthaltenen Fortbestand im Deutschen klar, ohne den Zahlenwert zu verändern.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Die erneute Form derselben Wurzel ילד wird zur lexikalischen Einheitlichkeit ebenfalls mit »zeugen« wiedergegeben.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Der hebräische Text nennt männliche und weibliche Nachkommen ausdrücklich; die konkrete Formulierung wird nicht zum allgemeineren »Kinder« eingeebnet.
- source_word: אָדָם
  choice: Adam
  rationale: Im genealogischen Zusammenhang ist אָדָם der Eigenname der genannten Person, nicht die allgemeine Bezeichnung für Mensch oder Menschheit.
theological_decisions:
- issue: Deutung von אָדָם
  choice: Adam als Eigenname
  alternative: Mensch beziehungsweise der Mensch
  rationale: Der unmittelbare genealogische Zusammenhang nennt den individuellen Träger des Namens Adam und beschreibt seine Nachkommen. Daher wird der Name transliteriert, ohne eine allgemein-anthropologische Bedeutung in den Vers einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. »Zeugte« bewahrt die genealogische und männliche Bedeutung des hebräischen Verbs; die idiomatische Lebenszeitformel wird natürlich wiedergegeben.
