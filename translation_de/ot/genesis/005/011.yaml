lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: So betrug … gesamte Lebenszeit
  rationale: Die hebräische genealogische Zusammenfassungsformel bezeichnet die gesamte Lebensdauer. Diese Wiedergabe ist im modernen Deutschen natürlich und bewahrt die zusammenfassende Funktion des Satzes.
- source_word: אֱנוֹשׁ
  choice: Enosch
  rationale: „Enosch“ gibt die hebräische Namensform im Deutschen direkt und nach gängigen Transliterationskonventionen wieder.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 905 Jahre
  rationale: Die hebräische Zahlenfolge nennt zunächst fünf und danach neunhundert Jahre; im Deutschen wird die Summe idiomatisch als 905 Jahre angegeben.
- source_word: וַיָּמֹת
  choice: Dann starb er
  rationale: Das hebräische Wayyiqtol schließt den genealogischen Eintrag mit dem folgenden Ereignis ab. „Dann“ gibt diese Abfolge natürlich wieder, ohne zusätzliche Deutung einzutragen.
