  text: וַֽ/יְחִ֣י מְתוּשֶׁ֗לַח אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת לֶ֔מֶךְ שְׁתַּ֤יִם וּ/שְׁמוֹנִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: de
  text: Nachdem Metuschelach Lamech gezeugt hatte, lebte er noch 782 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: Das Verb חיה bezeichnet in der genealogischen Formel die weitere Lebenszeit nach der Geburt des genannten Sohnes. „noch“ gibt den durch אַחֲרֵי bestimmten Fortgang natürlich wieder.
- source_word: מְתוּשֶׁלַח
  choice: Metuschelach
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen, hebräisch nahen Umschrift wiedergegeben.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת לֶמֶךְ
  choice: Nachdem Metuschelach Lamech gezeugt hatte
  rationale: Die temporale Konstruktion wird als natürlicher deutscher Nebensatz wiedergegeben; der Hifil von ילד bezeichnet hier die männliche Zeugung.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 Jahre
  rationale: Die hebräische Zahlenfolge „zwei und achtzig … und siebenhundert“ wird ohne Bedeutungsverlust in der üblichen deutschen Zahlenordnung zusammengefasst.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Die Wiederholung von ילד wird entsprechend der genealogischen Formel und ihrem männlich-spezifischen Sinn mit „zeugen“ wiedergegeben.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Formel bleibt knapp; „zeugen“ wahrt den männlich-spezifischen Aussagegehalt des hebräischen Verbs, während „lebte er noch“ im Deutschen den anschließenden Lebensabschnitt idiomatisch bezeichnet.
