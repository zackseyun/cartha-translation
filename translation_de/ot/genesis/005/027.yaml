  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: de
  text: Methuschelachs gesamte Lebenszeit betrug 969 Jahre, und er starb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: So betrug … die gesamte Lebenszeit
  rationale: Die hebräische genealogische Summenformel bedeutet wörtlich etwa „Und alle Tage … waren“. Die gewählte Formulierung gibt sie in natürlichem, würdevollem Deutsch wieder; „So“ markiert den zusammenfassenden Anschluss.
- source_word: מְתוּשֶׁלַח
  choice: Methuschelach
  rationale: Der Personenname wird nach einer im Deutschen etablierten bibelnahen Umschrift wiedergegeben.
- source_word: תֵּשַׁע וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 969 Jahre
  rationale: Die hebräische Zahlenfolge lautet ihrer Struktur nach „neunundsechzig Jahre und neunhundert Jahre“. Die Ziffernschreibung ist im modernen Deutschen klar und entspricht der Gesamtsumme; der Plural „Jahre“ ist idiomatisch.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Das narrative וַ wird hier als zeitliche Fortführung wiedergegeben. „Dann starb er“ bewahrt die knappe Schlussformel des Stammbaums.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Erzählprosa. Die idiomatische Wendung „gesamte Lebenszeit“ vermittelt den Sinn von כָּל יְמֵי, ohne die genealogische Summenfunktion zu verlieren.
