  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: de
  text: Als Lamech 182 Jahre gelebt hatte, zeugte er einen Sohn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hatte … gelebt
  rationale: In der genealogischen Formel bezeichnet חיה die Lebenszeit bis zum folgenden Ereignis. Der deutsche Temporalsatz gibt diesen Zusammenhang natürlich und präzise wieder.
- source_word: לֶמֶךְ
  choice: Lamech
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 182 Jahre
  rationale: Die hebräische Zahlenfolge bedeutet 182 Jahre. Die Ziffernschreibung ist in einer genealogischen Altersangabe klar und modern.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד mit männlichem Subjekt bedeutet hier, ein Kind zu zeugen beziehungsweise dessen Vater zu werden. „Zeugte“ ist knapp, sachlich und für eine Genealogie angemessen.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בֵּן bedeutet „Sohn“. Der unbestimmte Artikel ist im Deutschen natürlich, da der Sohn erst im folgenden Vers benannt wird.
