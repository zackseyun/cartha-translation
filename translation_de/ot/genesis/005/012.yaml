lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In Verbindung mit der Zeitangabe und dem folgenden Zeugungsverb bezeichnet die genealogische Formel Kenans Alter bei der Zeugung. Die deutsche Altersformulierung gibt dies natürlich und präzise wieder.
- source_word: קֵינָן
  choice: Kenan
  rationale: Der Personenname wird entsprechend der hebräischen Form direkt und in der im Deutschen geläufigen biblischen Schreibweise wiedergegeben.
- source_word: שִׁבְעִים שָׁנָה
  choice: 70 Jahre alt
  rationale: Die Zeitangabe nennt Kenans Alter bei der Zeugung; diese Funktion wird im Deutschen durch „70 Jahre alt“ eindeutig ausgedrückt.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד das männliche Zeugen eines Nachkommen. „zeugte“ ist knapp, sachlich und näher am Hebräischen als das allgemeinere „bekam“.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt und besitzt keine eigene deutsche Entsprechung.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Der Personenname wird direkt nach der hebräischen Form transliteriert.
