lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: So betrug … gesamte Lebenszeit
  rationale: Die hebräische genealogische Summenformel wird in natürlichem, würdigem Deutsch wiedergegeben. „Lebenszeit“ bündelt das idiomatische „alle Tage“, ohne dessen umfassenden Sinn zu verlieren.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form transliteriert.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: achthundertfünfundneunzig Jahre
  rationale: Die beiden hebräischen Zahlenglieder werden entsprechend dem natürlichen deutschen Zahlenausdruck zu einer Gesamtzahl verbunden.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Das konsekutive וַ wird in der abschließenden genealogischen Formel als zeitliche Folge ausgedrückt; die wiederkehrende, feierlich-knappe Todesnotiz bleibt erhalten.
