  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: de
  text: So betrug Kenans gesamte Lebenszeit 910 Jahre, und er starb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: So betrug
  rationale: Das Waw mit der Verbform führt die genealogische Zusammenfassung fort. „So betrug“ stellt den natürlichen Zusammenhang her und passt im Deutschen zu einer Zeitangabe.
- source_word: כָּל יְמֵי
  choice: gesamte Lebenszeit
  rationale: Wörtlich steht „alle Tage“. In der wiederkehrenden genealogischen Formel bezeichnet die Wendung die vollständige Lebensdauer; „gesamte Lebenszeit“ gibt diesen Sinn in natürlichem, klarem Deutsch wieder.
- source_word: קֵינָן
  choice: Kenan
  rationale: „Kenan“ gibt die hebräische Namensform קֵינָן unmittelbar und entsprechend der im Deutschen üblichen biblischen Schreibweise wieder.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 910 Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich „zehn Jahre und neunhundert Jahre“. Die Ziffernform gibt die Zahl im Deutschen eindeutig und idiomatisch wieder.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die schlichte genealogische Schlussformel wird direkt wiedergegeben; das deutsche Pronomen macht das Subjekt natürlich deutlich.
