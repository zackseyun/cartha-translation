  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: de
  text: Adam war 130 Jahre alt, als er einen Sohn zeugte, der ihm ähnlich war und seinem Bild entsprach.[a] Er gab ihm den Namen Set.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „ihm ähnlich … seinem Bild“ greifen die Ausdrucksweise aus 1. Mose 1,26–27 auf.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: war 130 Jahre alt
  rationale: In der genealogischen Altersformel bezeichnet חיה die bis zur Zeugung erreichte Lebenszeit. Die deutsche Konstruktion mit „als“ gibt diesen zeitlichen Zusammenhang natürlich wieder.
- source_word: אָדָם
  choice: Adam
  rationale: Das Wort steht hier als Eigenname des ersten Menschen innerhalb der Genealogie.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 130 Jahre
  rationale: Die Zahlphrase wird in moderner deutscher Schreibweise wiedergegeben; „Jahre“ entspricht dem ausdrücklich vorhandenen שָׁנָה.
- source_word: וַיּוֹלֶד
  choice: zeugte einen Sohn
  rationale: Die Hifil-Form von ילד mit männlichem Subjekt bezeichnet das Zeugen. „Einen Sohn“ macht den im Zusammenhang eindeutig vorausgesetzten männlichen Nachkommen auf Deutsch ausdrücklich.
- source_word: בִּדְמוּתוֹ
  choice: der ihm ähnlich war
  rationale: דְּמוּת bezeichnet Ähnlichkeit oder Entsprechung. Die Relativsatzform ist im modernen Deutsch natürlicher als die wörtliche Wendung „in seiner Ähnlichkeit“.
- source_word: כְּצַלְמוֹ
  choice: seinem Bild entsprach
  rationale: צֶלֶם wird mit „Bild“ wiedergegeben; „entsprach“ bildet das Präfix כ ab und bewahrt zugleich die Unterscheidung gegenüber דְּמוּת.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: Er gab ihm den Namen Set
  rationale: Dies ist eine natürliche deutsche Wiedergabe des hebräischen Benennungsidioms „er rief seinen Namen“.
- source_word: שֵׁת
  choice: Set
  rationale: Der Eigenname wird gemäß der etablierten deutschen Bibeltradition als „Set“ wiedergegeben.
theological_decisions:
- issue: Beziehung des Sohnes zu Adams Ähnlichkeit und Bild
  choice: Die Aussage wird als Ähnlichkeit mit Adam wiedergegeben, wobei der Anklang an Genesis 1,26–27 erhalten bleibt.
  alternative: Die Formulierung ausdrücklich als Verlust oder Abschwächung des Bildes Gottes nach dem Sündenfall deuten.
  rationale: Der Vers greift die Sprache von Genesis 1,26–27 erkennbar auf, erklärt aber nicht, welche weitergehenden theologischen Folgerungen daraus zu ziehen sind. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Alterskonstruktion und der Relativsatz vermeiden unnatürliche Hebraismen, während die beiden Begriffe „ähnlich“ und „Bild“ sowie ihr theologischer Anklang bewahrt bleiben.
