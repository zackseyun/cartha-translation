  text: וַֽ/יְחִי שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: de
  text: Nachdem Set Enos gezeugt hatte, lebte er noch 807 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: Das Verb חיה bezeichnet hier in der genealogischen Formel die weitere Lebenszeit Sets nach der Geburt des Enos; „noch“ macht diesen zeitlichen Fortbestand im Deutschen natürlich deutlich.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  choice: Nachdem Set Enos gezeugt hatte
  rationale: Die temporale Konstruktion mit אַחֲרֵי und dem Hifil von ילד wird idiomatisch als vorzeitiger Nebensatz wiedergegeben. Der Name Set wird zur eindeutigen Subjektangabe aus dem Kontext aufgenommen.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform wird verwendet.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 807 Jahre
  rationale: Die hebräische Zahlenfolge nennt zunächst sieben und dann achthundert; die Ziffernschreibung gibt die Gesamtsumme klar und natürlich wieder.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Das Hifil von ילד bezeichnet in der männlichen Genealogielinie das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist präzise und im Deutschen weiterhin verständlich.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen wird gegenüber dem allgemeineren „Kinder“ bewahrt.
