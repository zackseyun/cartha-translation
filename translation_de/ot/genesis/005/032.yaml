  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: de
  text: Als Noah fünfhundert Jahre alt war, zeugte er Sem, Ham und Jafet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Reihenfolge „Sem, Ham und Jafet“ entspricht dem hebräischen Text. Sie bezeichnet nicht notwendigerweise die Geburtsreihenfolge und besagt auch nicht, dass alle drei im selben Jahr geboren wurden.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Als ... war
  rationale: Die Verbform leitet hier einen zeitlichen Umstand ein. „Als Noah … alt war“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: fünfhundert Jahre alt
  rationale: Die hebräische Wendung בן + Zahl + שנה bezeichnet das Lebensalter; die gewählte Form ist die übliche deutsche Entsprechung.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד mit einem Mann als Subjekt bedeutet „zeugen“. Der Ausdruck ist präzise und in einem würdigen modernen Bibelregister verständlich.
- source_word: נֹחַ
  choice: Noah
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: שֵׁם
  choice: Sem
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: חָם
  choice: Ham
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: יָפֶת
  choice: Jafet
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Ham und Jafet
  rationale: Die direkten Objektmarker bleiben unübersetzt; die Namensreihe wird nach natürlicher deutscher Syntax verbunden.
theological_decisions:
- issue: Mögliche Aussage über die Geburtsreihenfolge und das Geburtsjahr der drei Söhne
  choice: Die hebräische Namensfolge bleibt erhalten, ohne zu behaupten, alle drei seien in Noahs fünfhundertstem Lebensjahr oder in dieser Reihenfolge geboren worden.
  alternative: Die Namen nach einer erschlossenen Geburtsreihenfolge umstellen oder den Satz so formulieren, als seien alle drei im selben Jahr geboren worden.
  rationale: Der Vers nennt Noahs Alter und anschließend seine drei Söhne, legt aber weder zwingend ihre Geburtsreihenfolge noch eine Geburt aller drei im selben Jahr fest. Die Anmerkung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. „Zeugte“ bewahrt die präzise Vater-Kind-Aussage des hebräischen Verbs; die Wiederholung des Namens Noah wird im Hauptsatz durch das natürliche Pronomen „er“ vermieden.
