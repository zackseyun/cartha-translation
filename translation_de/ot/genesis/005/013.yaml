  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: de
  text: Und nachdem Kenan Mahalalel gezeugt hatte, lebte er noch achthundertvierzig Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: חיה bezeichnet in dieser genealogischen Formel die weitere Lebenszeit. Das idiomatische deutsche „lebte ... noch“ macht deutlich, dass die genannte Zeitspanne auf Mahalalels Zeugung folgt.
- source_word: קֵינָן
  choice: Kenan
  rationale: Direkte, im Deutschen gebräuchliche Umschrift der hebräischen Namensform קֵינָן.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: nachdem Kenan Mahalalel gezeugt hatte
  rationale: Die temporale Beziehung und der männliche Subjektbezug des Hifil von ילד werden klar und natürlich wiedergegeben; der direkte Objektmarker אֶת bleibt unübersetzt.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: achthundertvierzig Jahre
  rationale: Die im Hebräischen als vierzig plus achthundert ausgedrückte Summe wird nach natürlicher deutscher Zahlenfolge wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Das Hifil von ילד mit männlichem Subjekt bedeutet „zeugen“. Die Wiederholung wahrt die lexikalische Verbindung zum ersten Vorkommen.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen bleibt erhalten.
theological_decisions: []
