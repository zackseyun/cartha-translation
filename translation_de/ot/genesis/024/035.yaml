  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: de
  text: Und Jahwe hat meinen Herrn sehr gesegnet, und er ist groß geworden. Er hat ihm Kleinvieh und Rinder, Silber und Gold, Diener und Dienerinnen[a], Kamele und Esel gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklaven und Sklavinnen“. Die hebräischen Begriffe können je nach Zusammenhang Hausbedienstete oder versklavte Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in seiner geläufigen deutschen Form wieder.
- source_word: בֵּרַךְ ... מְאֹד
  choice: hat ... sehr gesegnet
  rationale: Bewahrt die starke Intensivierung und bringt zugleich die bis in die Gegenwart reichende Wirkung natürlich zum Ausdruck.
- source_word: אֲדֹנִי
  choice: meinen Herrn
  rationale: Bezeichnet hier Abraham als menschlichen Hausherrn; „Herr“ ist in diesem historischen Dienstverhältnis idiomatisch und würdevoll.
- source_word: וַיִּגְדָּל
  choice: sodass er reich und angesehen geworden ist
  rationale: Das Verb bedeutet wörtlich „groß werden“ und umfasst im Kontext sowohl Besitz als auch gesellschaftliches Ansehen; die deutsche Formulierung macht diesen kontextuellen Umfang verständlich.
- source_word: צֹאן
  choice: Schafe und Ziegen
  rationale: Der hebräische Kollektivbegriff bezeichnet Kleinvieh, insbesondere Schafe und Ziegen; die explizite Wiedergabe ist im modernen Deutsch klarer als „Kleinvieh“.
- source_word: בָּקָר
  choice: Rinder
  rationale: Bezeichnet kollektiv Rindvieh; „Rinder“ ist die natürliche moderne Entsprechung.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: Knechte und Mägde
  rationale: Die Begriffe können je nach sozialem Kontext Dienende oder versklavte Personen bezeichnen. Die traditionelle, knappe Paarform bewahrt die Geschlechtsunterscheidung; die stärkere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sozialer Status von עֲבָדִם und שְׁפָחֹת
  choice: Knechte und Mägde
  alternative: Sklaven und Sklavinnen
  rationale: Die hebräischen Wörter decken ein Spektrum abhängiger Dienst- und Besitzverhältnisse ab. Der Vers allein legt den genauen Rechtsstatus nicht eindeutig fest; deshalb bleibt die Hauptfassung zurückhaltend und dokumentiert die stärkere Lesart in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Aufzählung bleibt rhythmisch und konkret; genuine soziale Mehrdeutigkeit wird nicht eingeebnet.
