    issue: Interpretierende Kausalität und Überbestimmung von ויגדל
    rationale: „sodass“ stellt den Segen als ausdrücklich formulierte Folge dar, während das hebräische ו lediglich fortführt. „reich und angesehen“ kann den Kontext treffend erläutern, legt aber die offene Wendung „er wurde groß“ zu stark aus.
  - severity: low
    issue: Unnötige Spezifizierung von צאן
    rationale: צאן bezeichnet kollektiv Kleinvieh, gewöhnlich Schafe und/oder Ziegen. „Schafe und Ziegen“ kann im Deutschen beide Arten ausdrücklich behaupten; „Kleinvieh“ bewahrt die Kollektivität und Offenheit.
  - severity: low
    issue: Historisierende Personenbezeichnung
    rationale: „Knechte und Mägde“ passt zu älteren Bibelregistern, ist aber für modernes Standarddeutsch weniger natürlich. Die Bedeutungsalternative Sklaverei bleibt in der Fußnote sichtbar.
