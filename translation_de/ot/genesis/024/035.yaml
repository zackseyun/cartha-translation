revisions:
- from: Und Jahwe hat meinen Herrn sehr gesegnet, sodass er reich und angesehen geworden ist. Er hat ihm Schafe und Ziegen, Rinder, Silber und Gold, Knechte und Mägde[a], Kamele und Esel gegeben.
  to: Und Jahwe hat meinen Herrn sehr gesegnet, und er ist groß geworden. Er hat ihm Kleinvieh und Rinder, Silber und Gold, Diener und Dienerinnen[a], Kamele und Esel gegeben.
  rationale: Die Überarbeitung folgt die beiden hebräischen Verbalaussagen ohne zusätzliche Kausalverknüpfung und lässt die umfassende Bedeutung von „groß geworden“ offen. „Kleinvieh“ gibt den kollektiven, nicht weiter spezifizierten Begriff צאן wieder. Die Personenbezeichnungen sind modernisiert; die umstrittene beziehungsweise kontextabhängige Statusfrage bleibt durch die Fußnote transparent.
