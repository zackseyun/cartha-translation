review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Besitzliste entsprechen dem Hebräischen. Die Formulierung „sodass er reich und angesehen geworden ist“ macht jedoch aus ויגדל eine kausale Folgerung und entfaltet „groß werden“ stärker, als der Text festlegt. Auch „Schafe und Ziegen“ expliziert den Kollektivbegriff צאן unnötig.
  naturalness: „Knechte und Mägde“ ist verständlich, wirkt im modernen Standarddeutsch jedoch deutlich historisierend. „Diener und Dienerinnen“ ist gegenwärtiger und erhält die geschlechtliche Paarung.
  terminology: „Jahwe“ gibt יהוה angemessen wieder; „mein Herr“ ist für אדני im Kontext eines menschlichen Vorgesetzten möglich. Die Fußnote soll die im Besitzverzeichnis naheliegende, aber nicht zwingend festgelegte Bedeutung „Sklaven“ als Alternative bewahren.
