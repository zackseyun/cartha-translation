  naturalness: Die vorgeschlagene neutrale Formulierung ist modernes, klares Standarddeutsch. „Die Kamele wurden versorgt“ wäre zu allgemein; „man nahm den Kamelen die Lasten ab“ und „man gab“ bewahren die konkreten Handlungen verständlich, ohne einen im Hebräischen nicht erneut genannten Handelnden zu benennen.
  terminology: „Der Mann“ wahrt die Bezeichnung des Ausgangstextes und vermeidet die interpretierende Identifizierung als Diener. „Stroh und Futter“ ist sachlich und idiomatisch. „Lasten abnehmen“ gibt das in diesem Kontext idiomatische פתח angemessen wieder; die Fußnote erhält die wörtliche und alternative Nuance. Die Fußnotenanker stehen an den jeweils einschlägigen Stellen.
