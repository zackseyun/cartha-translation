revisions:
- from: Da kam der Mann ins Haus. Er nahm den Kamelen das Gepäck ab[a], gab ihnen Stroh und Futter und brachte Wasser zum Waschen seiner Füße und der Füße der Männer, die bei ihm waren.[b]
