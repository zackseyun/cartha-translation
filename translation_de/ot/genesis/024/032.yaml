base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: de
  text: Da kam der Mann ins Haus. Man nahm den Kamelen die Lasten ab[a] und gab ihnen Stroh und Futter sowie Wasser zum Waschen der Füße des Mannes und der Männer, die bei ihm waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Man öffnete die Kamele«; gemeint ist wahrscheinlich, dass man ihre Last oder Ausrüstung löste beziehungsweise abnahm.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt bei den Handlungen nach dem Eintritt kein neues Subjekt. Formal kann damit weiterhin der Mann gemeint sein; im Erzählzusammenhang kann jedoch auch Laban als Gastgeber handeln.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: Da kam der Mann ins Haus
  rationale: בוא mit dem Direktivsuffix an הַבַּיְתָה bezeichnet die Bewegung in das Haus hinein. „Der Mann“ bewahrt die ausdrückliche Bezeichnung des Hebräischen, statt deutend „der Diener“ zu setzen.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: Er nahm den Kamelen das Gepäck ab
  rationale: פתח bedeutet wörtlich „öffnen“, bezeichnet bei den Kamelen hier aber idiomatisch das Lösen beziehungsweise Abnehmen ihrer Ausrüstung oder Last nach der Ankunft. Die Formulierung ist im modernen Deutsch verständlich und vermeidet das missverständliche wörtliche „öffnete die Kamele“.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: Stroh und Futter
  rationale: תֶּבֶן bezeichnet Stroh beziehungsweise Häcksel, מִסְפּוֹא Tierfutter. „Stroh und Futter“ ist sachlich und allgemein verständlich.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: Wasser zum Waschen seiner Füße und der Füße der Männer, die bei ihm waren
  rationale: Die Zweckangabe des Infinitivs und die ausdrücklich genannten Füße des Mannes sowie seiner Begleiter bleiben erhalten.
- source_word: וַיִּתֵּן
  choice: gab ihnen … und brachte Wasser
  rationale: Das hebräische Verb bedeutet „geben“. Im Deutschen wird die zweite Gabe idiomatisch mit „brachte Wasser“ ausgedrückt; dies erhält den Sinn und vermeidet die schwerfällige Wiederholung von „gab“.
theological_decisions:
- issue: Subjekt der auf den Eintritt folgenden Verben
  choice: Im Haupttext wird das grammatisch naheliegende fortlaufende Subjekt „der Mann“ mit „Er“ wiedergegeben.
  alternative: Die Verben können im Erzählzusammenhang auch Laban als Gastgeber zugeschrieben werden, obwohl sein Name in diesem Vers nicht erneut genannt wird.
  rationale: Die hebräischen Verben stehen in der 3. Person Singular, ohne ein neues ausdrückliches Subjekt. Die unmittelbare Syntax spricht für „der Mann“, während der Kontext einen unausgesprochenen Subjektwechsel zu Laban zulässt. Die Fußnote macht diese echte Spannung sichtbar, ohne „Laban“ in den Ausgangstext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klar gegliederte Erzählprosa; altertümliche Wörter wie „Futterstroh“ oder „Proviant“ werden vermieden. Die mögliche Subjektverschiebung wird nicht stillschweigend aufgelöst.
