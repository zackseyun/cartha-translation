  rationale: Die Revision vermeidet die im Deutschen durch „Er“ unvermeidlich eindeutige Zuweisung der Handlungen an den Mann. Die unpersönliche deutsche Formulierung hält den Handlungssinn fest, ohne Laban entgegen dem Wortlaut ausdrücklich einzusetzen oder eine kontextuell mögliche Subjektverschiebung auszuschließen. Die Fußnote beschreibt die verbleibende syntaktisch-kontextuelle Spannung transparent.
