  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: de
  text: Sieh, ich stehe an der Wasserquelle, und die Töchter der Männer der Stadt[a] kommen heraus, um Wasser zu schöpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck „Töchter der Männer der Stadt“ bezeichnet die jungen Frauen der Stadt.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt lebhaft die Aufmerksamkeit auf die gegenwärtige Situation; „Sieh“ ist würdig und im modernen Deutsch verständlich.
- source_word: אָנֹכִי נִצָּב
  choice: ich stehe hier
  rationale: Das selbstständige Pronomen und das Partizip bezeichnen die gegenwärtige Stellung des Sprechers. „hier“ macht den deiktischen Ortsbezug natürlich deutlich, ohne eine besondere Betonung des Ichs zu erzwingen.
- source_word: עַל עֵין הַמָּיִם
  choice: an der Wasserquelle
  rationale: עַל bezeichnet hier die Lage bei einer Wasserstelle. עֵין הַמָּיִם meint eine natürliche Quelle und nicht den sonst gewöhnlich mit בְּאֵר bezeichneten Brunnen.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: und die Töchter der Männer der Stadt
  rationale: Die hebräische soziale und familiäre Ausdrucksweise wird bewusst bewahrt; gemeint sind die jungen Frauen beziehungsweise Töchter der Stadtbewohner.
- source_word: יֹצְאֹת
  choice: kommen heraus
  rationale: Das feminine Pluralpartizip beschreibt aus der Perspektive des an der Quelle Wartenden ein gerade stattfindendes oder unmittelbar bevorstehendes Herauskommen.
- source_word: לִשְׁאֹב מָיִם
  choice: um Wasser zu schöpfen
  rationale: „Wasser schöpfen“ ist die natürliche deutsche Entsprechung für die Tätigkeit an einer Quelle oder Wasserstelle.
