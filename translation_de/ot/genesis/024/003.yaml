  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: de
  text: Und ich werde dich bei Jahwe[a], dem Gott des Himmels und dem Gott der Erde, schwören lassen, dass du für meinen Sohn keine Frau von den Töchtern der Kanaaniter nimmst, unter denen ich wohne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der persönliche Name Gottes; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und seiner traditionellen Wiedergabe.
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: und ich werde dich … schwören lassen
  rationale: 'Der Hifil von שׁבע ist kausativ: Abraham veranlasst den Knecht zu einem Schwur. Die Formulierung bildet diese Bedeutung natürlich und genau ab.'
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition בְּ bezeichnet hier denjenigen, bei dem geschworen wird; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: dem Gott des Himmels und dem Gott der Erde
  rationale: Die Wiederholung von אֱלֹהֵי wird bewahrt. Im Gegensatzpaar mit „Himmel“ bezeichnet אֶרֶץ hier die Erde im umfassenden Sinn.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: dass du … keine … nimmst
  rationale: Der Satz nennt den Inhalt des verlangten Schwurs. Das deutsche Präsens nach „dass“ vermittelt die bindende Verpflichtung ohne unnötig altertümlichen Klang.
- source_word: אִשָּׁה לִבְנִי
  choice: für meinen Sohn keine Frau
  rationale: Im Heiratszusammenhang bezeichnet אִשָּׁה eine Ehefrau; im Deutschen ist „eine Frau für meinen Sohn nehmen“ idiomatisch verständlich.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: von den Töchtern der Kanaaniter
  rationale: Die hebräische Volksgruppenformel „Töchter der …“ bleibt erhalten; der singularische Kollektivbegriff הַכְּנַעֲנִי wird natürlich als „die Kanaaniter“ wiedergegeben.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: in deren Mitte ich wohne
  rationale: Die Wendung bezeichnet Abrahams fortdauerndes Wohnen unter diesem Volk. „In deren Mitte“ bewahrt das Bild von בְּקִרְבּוֹ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausative Schwurformel und die doppelte Gottesbezeichnung werden eng am Hebräischen bewahrt; „in deren Mitte ich wohne“ ist formal, aber weiterhin allgemein verständlich.
