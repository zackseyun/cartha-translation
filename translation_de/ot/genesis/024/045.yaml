base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: de
  text: 'Noch bevor ich in meinem Herzen zu Ende gesprochen hatte,[a] kam auf einmal Rebekka mit ihrem Krug auf der Schulter heraus. Sie ging zur Quelle hinab und schöpfte Wasser. Da sagte ich zu ihr: »Bitte gib mir zu trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu meinem Herzen gesprochen«; gemeint ist inneres Reden, hier wohl ein stilles Gebet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Noch bevor ich ... zu Ende gesprochen hatte
  rationale: טֶרֶם bezeichnet hier eine am Bezugspunkt noch nicht abgeschlossene Handlung; die Formulierung gibt die Vorzeitigkeit im Deutschen natürlich wieder.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: in meinem Herzen ... gesprochen
  rationale: Die wörtliche Wendung lautet »zu meinem Herzen sprechen« und bezeichnet hier inneres Reden beziehungsweise ein stilles Gebet. Die gewählte Form bewahrt das Bild, ohne im Deutschen unverständlich zu wirken.
- source_word: וְהִנֵּה
  choice: kam auf einmal ... heraus
  rationale: הִנֵּה hebt das plötzliche, anschauliche Eintreten hervor. »Auf einmal« vermittelt diese Erzählwirkung in natürlichem modernem Deutsch.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: Dies ist die im Deutschen herkömmliche Namensform.
- source_word: יֹצֵאת
  choice: kam ... heraus
  rationale: Das Partizip nach הִנֵּה stellt den Vorgang unmittelbar und anschaulich dar; im deutschen Erzählzusammenhang ist das Präteritum passend.
- source_word: כַדָּהּ
  choice: ihren Krug
  rationale: כַּד bezeichnet ein Gefäß zum Wasserholen; »Krug« ist knapp, geläufig und kontextgerecht.
- source_word: עַל־שִׁכְמָהּ
  choice: auf der Schulter
  rationale: Die räumliche Angabe wird direkt und idiomatisch wiedergegeben.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Sie ging zur Quelle hinab
  rationale: עַיִן bezeichnet hier eine natürliche Quelle und ist von בְּאֵר »Brunnen« zu unterscheiden. Das Richtungs-he wird durch »zur ... hinab« wiedergegeben.
- source_word: וַתִּשְׁאָב
  choice: schöpfte Wasser
  rationale: Das Verb bezeichnet das Schöpfen von Wasser; das im Hebräischen implizite Objekt wird im Deutschen natürlich ergänzt.
- source_word: הַשְׁקִינִי נָא
  choice: Bitte gib mir zu trinken
  rationale: Der Hifil-Imperativ bedeutet »zu trinken geben«; נָא wird durch die höfliche Bitte wiedergegeben.
theological_decisions:
- issue: Art des inneren Redens
  choice: Das Bild »in meinem Herzen gesprochen« bleibt im Haupttext erhalten.
  alternative: »bei mir selbst gesprochen« oder ausdrücklich »gebetet«
  rationale: Der Zusammenhang legt ein stilles Gebet nahe, doch der hebräische Wortlaut benennt die Äußerung als inneres Reden. Die Übersetzung vermeidet, diese mögliche Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Herz-Metapher bleibt erhalten und wird in einer Fußnote erläutert. הִנֵּה wird funktional mit »auf einmal« wiedergegeben, um die plötzliche, anschauliche Erzählwirkung ohne altertümliches »siehe« zu bewahren.
