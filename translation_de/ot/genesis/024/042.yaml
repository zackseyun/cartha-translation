  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: de
  text: 'Heute kam ich zu der Quelle und sagte: »Jahwe, Gott meines Herrn Abraham, wenn du doch meinem Weg, den ich gehe, Gelingen schenkst —«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Heute kam ich
  rationale: Die Erzählform bezeichnet eine vergangene Handlung; הַיּוֹם wird adverbial wiedergegeben und behält die zeitliche Betonung.
- source_word: הָעָיִן
  choice: zu der Quelle
  rationale: עַיִן bezeichnet hier eine natürliche Quelle bzw. Wasserstelle; „Quelle“ ist genauer als das allgemeinere „Brunnen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Gott meines Herrn Abraham
  rationale: אֲדֹנִי bezeichnet Abraham als den menschlichen Herrn des Knechtes; „Herr“ bewahrt diese Beziehung in natürlichem Deutsch.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: wenn du doch … gelingen lässt
  rationale: Die elliptische Wenn-Konstruktion bleibt offen; נָא erhält durch „doch“ ihren bittenden Ton, und der Hifil-Ausdruck wird kausativ als „gelingen lässt“ wiedergegeben.
- source_word: דַּרְכִּי
  choice: den Weg
  rationale: „Weg“ entspricht der Grundbedeutung und umfasst im Kontext sowohl Reise als auch Auftrag; der deutsche Artikel genügt, weil der folgende Relativsatz den Weg eindeutig als den des Sprechers kennzeichnet.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: auf dem ich unterwegs bin
  rationale: Die hebräische Wendung lautet wörtlich etwa „auf dem ich gehe“; „unterwegs bin“ ist idiomatisch und bewahrt den gegenwärtigen Verlauf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Quelltext gebraucht das Tetragramm als Eigennamen. „Jahwe“ wahrt dies, ohne einen Titel einzusetzen.
- issue: Offene Gebetsformel mit אִם
  choice: wenn du doch … gelingen lässt —
  alternative: wenn du meinen Weg gelingen lassen willst
  rationale: Die Bedingungsform bleibt grammatisch und gedanklich offen; der Gedankenstrich bewahrt den im Vers nicht abgeschlossenen Satz, ohne die Bitte dogmatisch oder syntaktisch auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Gebetsform und der versübergreifend offene Satz werden bewusst erhalten. Keine Fußnoten sind nötig, da „Quelle“, „Herr“ und „Weg“ den hebräischen Wortlaut verständlich und hinreichend genau wiedergeben.
