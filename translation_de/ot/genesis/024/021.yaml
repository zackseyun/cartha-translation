  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: de
  text: Der Mann beobachtete sie schweigend[a], um zu erfahren, ob Jahwe die Reise des Mannes zum Erfolg geführt hatte oder nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Mann blickte sie staunend und schweigend an, um zu erfahren, ob Jahwe seinen Weg zum Erfolg geführt hatte oder nicht.“'
    reason: Die seltene Form מִשְׁתָּאֵה kann neben aufmerksamem Beobachten auch Staunen oder Verwunderung ausdrücken; דֶּרֶךְ kann wörtlicher mit „Weg“ wiedergegeben werden.
lexical_decisions:
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Das hebräische אִישׁ bezeichnet hier ausdrücklich den Mann; seine aus dem Kontext bekannte Rolle als Diener wird nicht in den Wortlaut eingetragen.
- source_word: מִשְׁתָּאֵה
  choice: beobachtete
  rationale: Das Partizip bezeichnet ein anhaltendes, aufmerksames Betrachten und kann zugleich Staunen oder Verwunderung anklingen lassen. „Beobachtete“ ist natürlich und legt die emotionale Nuance nicht einseitig fest.
- source_word: לָהּ
  choice: sie
  rationale: Die Präposition mit dem pronominalen Suffix bezeichnet die Frau als Gegenstand seiner aufmerksamen Beobachtung; im Deutschen ist „sie beobachten“ idiomatisch.
- source_word: מַחֲרִישׁ
  choice: schweigend
  rationale: Das Partizip von חרשׁ bezeichnet das Stillsein beziehungsweise Schweigen und wird hier natürlich als begleitende Handlung wiedergegeben.
- source_word: לָדַעַת
  choice: um zu erkennen
  rationale: Der Infinitiv drückt den Zweck seiner schweigenden Beobachtung aus. „Erkennen“ bewahrt den Bezug zu ידע und passt zum noch ausstehenden Urteil über den Ausgang.
- source_word: הַהִצְלִיחַ
  choice: gelingen ließ
  rationale: 'Der Hifil von צלח ist kausativ: Jahwe bewirkt den Erfolg. „Gelingen ließ“ gibt diese Kausalität in natürlichem Deutsch wieder.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דַּרְכּוֹ
  choice: seine Reise
  rationale: דֶּרֶךְ bedeutet wörtlich „Weg“, bezeichnet im Erzählzusammenhang aber die unternommene Reise beziehungsweise Mission.
- source_word: אִם לֹא
  choice: oder nicht
  rationale: 'Die Wendung schließt die indirekte Entscheidungsfrage idiomatisch ab: „ob … oder nicht“.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Syntax, klingt aber natürlich; die mögliche Nuance des Staunens wird wegen der lexikalischen Unsicherheit in der Fußnote bewahrt.
