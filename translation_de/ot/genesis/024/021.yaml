  revision_rationale: Die Revision stellt die abgeschlossene göttliche Führung mit dem deutschen Plusquamperfekt deutlicher dar und vermeidet eine mögliche possessive Mehrdeutigkeit. Die alternative Lesart wahrt weiterhin sowohl die unsichere Nuance von מִשְׁתָּאֵה als auch die wörtlichere Wiedergabe von דֶּרֶךְ.
