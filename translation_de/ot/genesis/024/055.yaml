base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: de
  text: 'Doch ihr Bruder und ihre Mutter sagten: „Die junge Frau soll noch einige Tage oder zehn Tage bei uns bleiben; danach kann sie gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch ... sagten
  rationale: Das Waw führt die nächste Rede ein; wegen des Gegensatzes zur dringenden Bitte des Dieners im vorigen Vers gibt „Doch“ den Zusammenhang natürlich wieder. Obwohl das hebräische Verb formal im Singular steht, verlangt das zusammengesetzte Subjekt im Deutschen den Plural „sagten“.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: ihr Bruder und ihre Mutter
  rationale: Bewahrt Reihenfolge, Singular und die weiblichen Possessivbezüge des Hebräischen.
- source_word: תֵּשֵׁב
  choice: Lass ... bleiben
  rationale: ישב kann sitzen, wohnen oder bleiben bedeuten. Im Zusammenhang eines Aufschubs der Abreise ist „bleiben“ die natürliche deutsche Entsprechung.
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet hier eine junge weibliche Person; „junge Frau“ ist modern und würdevoll, ohne das altertümliche „Jungfrau“ oder das potenziell kindliche „Mädchen“.
- source_word: אִתָּנוּ
  choice: bei uns
  rationale: Im Deutschen bezeichnet „bei uns bleiben“ den gemeinten Aufenthalt idiomatischer als das wörtlichere „mit uns bleiben“.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: noch einige Tage, vielleicht zehn
  rationale: Wörtlich steht „Tage oder zehn“. Die genaue Beziehung der beiden Angaben ist nicht völlig eindeutig; die Formulierung gibt den wahrscheinlichen Sinn einer kurzen Frist von möglicherweise zehn Tagen in natürlichem Deutsch wieder.
- source_word: אַחַר
  choice: danach
  rationale: Gibt die zeitliche Folge knapp und idiomatisch wieder.
- source_word: תֵּלֵךְ
  choice: kann sie gehen
  rationale: Das Verb bezieht sich im Kontext eindeutig auf die junge Frau. „Kann sie gehen“ wahrt den erlaubenden beziehungsweise auffordernden Sinn, ohne ihn als bloße Zukunft festzulegen.
