- from: 'Doch ihr Bruder und ihre Mutter sagten: „Lass die junge Frau noch einige Tage, vielleicht zehn, bei uns bleiben; danach kann sie gehen.“'
  to: 'Doch ihr Bruder und ihre Mutter sagten: „Die junge Frau soll noch einige Tage oder zehn Tage bei uns bleiben; danach kann sie gehen.“'
  rationale: Die Zeitangabe wird näher am hebräischen Wortlaut als Alternative wiedergegeben, statt sie durch „vielleicht“ zu harmonisieren. Die jussivische Bitte wird mit einer natürlichen deutschen Soll-Konstruktion formuliert. Ein Fußnotenanker nach „zehn Tage“ ist vorzusehen.
