base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: de
  text: 'Der Diener lief ihr entgegen und sagte: »Bitte lass mich ein wenig Wasser aus deinem Krug trinken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ
  choice: lief
  rationale: Das Verb רוץ bezeichnet hier in der fortlaufenden Erzählung schlicht das Laufen und vermittelt die Unmittelbarkeit der Handlung.
- source_word: הָעֶבֶד
  choice: der Diener
  rationale: עֶבֶד kann je nach Kontext »Diener« oder »Sklave« bedeuten. Hier handelt es sich um Abrahams bevollmächtigten Hausdiener; sein rechtlicher Status steht in diesem Vers nicht im Vordergrund.
- source_word: לִקְרָאתָהּ
  choice: ihr entgegen
  rationale: Die Verbindung mit קראת bezeichnet eine Bewegung auf jemanden zu, um ihm zu begegnen. »Ihr entgegen« ist im Deutschen natürlich und präzise.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Dies ist die übliche deutsche Wiedergabe der hebräischen Einführung direkter Rede im Erzählstil.
- source_word: הַגְמִיאִינִי
  choice: lass mich trinken
  rationale: Der Hifil-Imperativ von גמא mit dem Suffix der ersten Person kann bedeuten, jemanden trinken zu lassen oder ihm zu trinken zu geben. »Lass mich trinken« bewahrt die hebräische Konstruktion und ergibt mit נָא eine höfliche Bitte.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel kennzeichnet hier eine höfliche Bitte; »bitte« ist die natürliche moderne Entsprechung.
- source_word: מְעַט מַיִם
  choice: ein wenig Wasser
  rationale: Die Wendung bezeichnet eine geringe Menge Wasser und unterstreicht die Bescheidenheit der Bitte.
- source_word: מִכַּדֵּךְ
  choice: aus deinem Krug
  rationale: כַּד bezeichnet ein Gefäß zum Schöpfen und Tragen von Wasser. »Krug« ist in diesem Zusammenhang eine klare und geläufige deutsche Wiedergabe; das Possessivpronomen wahrt das feminine Singularsuffix.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, flüssigem Erzählton. Die Bitte ist höflich formuliert; die mögliche Wiedergabe »gib mir ein wenig Wasser zu trinken« ist semantisch mitgemeint, erfordert im Deutschen aber keine Fußnote, da keine sachlich bedeutsame Mehrdeutigkeit entsteht.
