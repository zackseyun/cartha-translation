  text: וַ/יְסַפֵּ֥ר הָ/עֶ֖בֶד לְ/יִצְחָ֑ק אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: de
  text: Und der Diener erzählte Isaak alles, was er getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Sklave“. Das hebräische Wort kann sowohl „Diener“ als auch „Sklave“ bedeuten; hier steht seine Aufgabe im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: erzählte
  rationale: Das Piel von ספר bezeichnet hier das ausführliche Berichten beziehungsweise Erzählen der abgeschlossenen Unternehmung. „Erzählte“ ist natürlich und bewahrt diesen rückblickenden Charakter.
- source_word: הָעֶבֶד
  choice: der Diener
  rationale: עֶבֶד kann sowohl einen Diener als auch einen Sklaven bezeichnen. Im Zusammenhang steht seine Aufgabe im Haushalt Abrahams im Vordergrund; „Diener“ ist daher die passende kontextuelle Wiedergabe.
- source_word: לְיִצְחָק
  choice: Isaak
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alles
  rationale: דְּבָרִים kann Worte, Angelegenheiten oder Geschehnisse bezeichnen. Hier umfasst es den gesamten Bericht über die Reise und ihre Vorgänge; das idiomatische „alles“ gibt diese Breite wieder.
- source_word: אֲשֶׁר עָשָׂה
  choice: was er getan hatte
  rationale: Der Relativsatz bezieht sich auf die bereits abgeschlossenen Handlungen des Dieners. Das Plusquamperfekt macht die zeitliche Abfolge im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Erzählweise bleibt erhalten; „alles“ vermeidet eine unnatürliche Festlegung von דְּבָרִים auf bloße Worte oder einzelne Dinge.
