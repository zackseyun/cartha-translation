base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: de
  text: 'Als sie ihm zu trinken gegeben hatte, sagte sie: »Ich werde auch für deine Kamele Wasser schöpfen, bis sie mit dem Trinken fertig sind.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Als sie ihm genug zu trinken gegeben hatte
  rationale: Das Verb כלה bezeichnet hier den Abschluss des Tränkens. Die natürliche deutsche Wendung »genug zu trinken gegeben hatte« gibt den erreichten Abschluss idiomatisch wieder, ohne das im Deutschen bei Menschen unpassende »tränken« zu verwenden.
- source_word: וַתֹּאמֶר
  choice: sagte sie
  rationale: Gibt das gewöhnliche hebräische Erzählverb אמר und die anschließende Handlung in natürlicher deutscher Satzfolge wieder.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: auch für deine Kamele
  rationale: »Auch« bewahrt die additive Bedeutung von גַּם; die Präposition לְ bezeichnet hier die Kamele als Nutznießer des Wasserschöpfens.
- source_word: אֶשְׁאָב
  choice: Ich werde … Wasser schöpfen
  rationale: שאב bedeutet Wasser aus einem Brunnen oder einer Quelle zu schöpfen. »Wasser« wird entsprechend dem eindeutigen Kontext ausdrücklich genannt.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: bis sie genug getrunken haben
  rationale: עַד אִם leitet den Endpunkt ein. כלה mit dem Infinitiv שתה bezeichnet den Abschluss des Trinkens; »genug getrunken haben« ist dafür eine natürliche deutsche Wiedergabe.
