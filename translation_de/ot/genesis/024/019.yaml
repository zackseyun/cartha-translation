review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Rebekka beendet das Trinkenlassen des Mannes, bietet zusätzlich an, Wasser für seine Kamele zu schöpfen, und nennt deren Beendigung des Trinkens als Endpunkt. Das zweimalige »genug« ist jedoch im Hebräischen nicht ausdrücklich vorhanden. כּלה bezeichnet jeweils das Beenden/Vollenden der Handlung, nicht ausdrücklich das Erreichen einer ausreichenden Menge.'
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch und der Erzählton passt. »Bis sie mit dem Trinken fertig sind« ist ebenso natürlich und gibt den hebräischen Abschlussgedanken genauer wieder als »bis sie genug getrunken haben«.
  terminology: »Wasser schöpfen« ist für אֶשׁאָב treffend. »Für deine Kamele« gibt לִגְמַלֶּיךָ idiomatisch wieder; »auch« bewahrt die additive Partikel גַּם. Für den menschlichen Empfänger ist »ihm zu trinken geben« angemessen.
  issues:
  - severity: medium
    issue: Die Wiedergabe enthält zweimal »genug«.
    rationale: Weder bei לְהַשְׁקֹתוֹ noch bei כִּלּוּ לִשְׁתּוֹת steht ein Ausdruck für »genug«. Der Kontext kann nahelegen, dass der Mann bzw. die Kamele ihren Bedarf gedeckt haben, doch die Übersetzung sollte den ausdrücklich markierten Abschluss der Trinkhandlung ohne diese zusätzliche Nuance wiedergeben.
  revised_text: 'Als sie ihm zu trinken gegeben hatte, sagte sie: »Ich werde auch für deine Kamele Wasser schöpfen, bis sie mit dem Trinken fertig sind.«'
  revised_footnotes: []
