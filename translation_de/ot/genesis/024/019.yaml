- from: 'Als sie ihm genug zu trinken gegeben hatte, sagte sie: »Ich werde auch für deine Kamele Wasser schöpfen, bis sie genug getrunken haben.«'
  to: 'Als sie ihm zu trinken gegeben hatte, sagte sie: »Ich werde auch für deine Kamele Wasser schöpfen, bis sie mit dem Trinken fertig sind.«'
  rationale: Die Revision entfernt die nicht ausdrücklich ausgedrückte Quantitätsnuance »genug«. »Als sie ihm zu trinken gegeben hatte« gibt den Abschluss der vorangehenden Handlung natürlich wieder; »bis sie mit dem Trinken fertig sind« bildet den terminativen Abschluss von עַד אִם כִּלּוּ לִשְׁתּוֹת idiomatisch und quellentreu ab.
