  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: de
  text: 'Sie fragte den Diener: „Wer ist der Mann dort, der uns auf dem Feld entgegenkommt?“ Der Diener antwortete: „Das ist mein Herr.“ Da nahm sie den Schleier und verhüllte sich damit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da nahm sie den Schleier und bedeckte sich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: der Diener
  rationale: עֶבֶד kann einen Diener oder Sklaven bezeichnen. Im unmittelbaren Erzählzusammenhang steht seine Funktion als Beauftragter seines Herrn im Vordergrund; „Diener“ ist daher natürlich, ohne den historischen Abhängigkeitsstatus zu leugnen.
- source_word: הָאִישׁ הַלָּזֶה
  choice: der Mann dort
  rationale: אִישׁ bezeichnet den sichtbaren männlichen Einzelnen; הַלָּזֶה weist auf ihn hin. Das moderne deutsche „der Mann dort“ gibt die deiktische Bedeutung idiomatisch wieder.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: der uns auf dem Feld entgegenkommt
  rationale: Das Partizip von הלך beschreibt die Bewegung, während לִקְרָאתֵנוּ die Richtung auf die Gruppe zu angibt. „entgegenkommt“ verbindet beides im Deutschen natürlich und präzise.
- source_word: הוּא אֲדֹנִי
  choice: Das ist mein Herr
  rationale: אֲדֹנִי bezeichnet hier den menschlichen Herrn des Dieners. „mein Herr“ wahrt die soziale Anrede- und Autoritätsbeziehung; der Kontext verhindert eine Deutung als Gottesbezeichnung.
- source_word: הַצָּעִיף
  choice: den Schleier
  rationale: צָעִיף bezeichnet hier eine weibliche Bedeckung. „Schleier“ ist im Deutschen die klare und in diesem Zusammenhang geläufige Wiedergabe.
- source_word: וַתִּתְכָּס
  choice: verhüllte sich damit
  rationale: Die reflexive Verbform besagt, dass Rebekka sich selbst bedeckte. „damit“ macht den Bezug auf den zuvor genannten Schleier ausdrücklich und natürlich.
theological_decisions:
- issue: Bedeutung von אֲדֹנִי
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Gemeint ist Isaak als menschlicher Herr des Dieners, nicht Gott. „Herr“ bewahrt die traditionelle soziale Bezeichnung, ohne im Kontext eine göttliche Bedeutung nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und natürlich; „der Mann dort“ bewahrt die hinweisende Funktion des hebräischen Demonstrativs. Das historische Dienstverhältnis wird weder modernisiert noch unnötig zugespitzt.
