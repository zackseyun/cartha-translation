base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: de
  text: Schnell leerte sie ihren Krug in die Tränke[a], lief wieder zum Brunnen, um Wasser zu schöpfen, und schöpfte für alle seine Kamele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goss ihren Krug in den Wassertrog aus“.'
    reason: 'Lexikalische Alternative: וַתְּעַר kann ausdrücklich als „goss … aus“ wiedergegeben werden, und הַשֹּׁקֶת kann konkreter „Wassertrog“ bedeuten.'
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Schnell
  rationale: Das Verb bezeichnet eiliges oder schnelles Handeln. Die adverbiale Wiedergabe klingt im Deutschen natürlich und bewahrt Rebekkas unverzügliches Handeln.
- source_word: וַתְּעַר
  choice: leerte
  rationale: ערה bezeichnet hier das Ausleeren beziehungsweise Ausgießen des Kruginhalts. „Leerte … in“ verbindet sich im Deutschen natürlich mit dem Gefäß als direktem Objekt.
- source_word: כַּדָּהּ
  choice: ihren Krug
  rationale: כַּד bezeichnet ein Gefäß zum Holen von Wasser; „Krug“ ist im Erzählzusammenhang eine klare und geläufige Wiedergabe.
- source_word: הַשֹּׁקֶת
  choice: die Tränke
  rationale: Das Wort bezeichnet einen Trog beziehungsweise eine Wasserstelle für Tiere. „Tränke“ ist im Deutschen prägnant und wird durch die erwähnten Kamele eindeutig verstanden.
- source_word: וַתָּרָץ עוֹד
  choice: lief wieder
  rationale: רוץ bezeichnet schnelles Laufen, während עוֹד hier die Wiederholung der Handlung ausdrückt. „Lief wieder“ gibt beides knapp und idiomatisch wieder.
- source_word: הַבְּאֵר
  choice: zum Brunnen
  rationale: בְּאֵר bezeichnet gewöhnlich einen Brunnen und ist in dieser Erzählung entsprechend wiederzugeben.
- source_word: לִשְׁאֹב
  choice: um Wasser zu schöpfen
  rationale: Das Verb bedeutet, Wasser aus einem Brunnen zu schöpfen. „Wasser“ wird zur natürlichen deutschen Verdeutlichung des im Kontext enthaltenen Objekts ergänzt.
- source_word: וַתִּשְׁאַב
  choice: und schöpfte
  rationale: Die finite Verbform führt die erzählte Handlung fort. Die knappe koordinierte Form bewahrt die hebräische Abfolge ohne unnötige Wiederholung des Subjekts.
- source_word: לְכָל גְּמַלָּיו
  choice: für alle seine Kamele
  rationale: Die Wiedergabe erhält sowohl den Bezug auf den Besitzer als auch die durch כָּל ausgedrückte Gesamtheit.
