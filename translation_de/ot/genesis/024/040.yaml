  source_fidelity: 'Der Entwurf gibt die hebräische Aussage vollständig und zutreffend wieder: Der Gottesname bleibt als „Jahwe“ erhalten; Abrahams Lebensführung „vor“ Jahwe wird idiomatisch wiedergegeben; Jahwe sendet seinen Engel mit dem Knecht und bewirkt das Gelingen seines Weges; die Frau soll aus Abrahams Sippe und aus dem Haus seines Vaters kommen. Die Zukunftsaussagen sind angemessen als Zusage formuliert.'
