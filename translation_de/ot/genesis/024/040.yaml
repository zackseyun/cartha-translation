source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: de
  text: 'Da sagte er zu mir: »Jahwe, vor dessen Angesicht ich gelebt habe, wird seinen Engel mit dir senden und deine Reise gelingen lassen. Du wirst für meinen Sohn eine Frau aus meiner Sippe und aus dem Haus meines Vaters nehmen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen im modernen deutschen Sprachgebrauch wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: vor dessen Angesicht ich gelebt habe
  rationale: Bewahrt das biblische Bild eines vor Gott geführten Lebens und klingt im Deutschen natürlicher als die wörtliche Formulierung »vor dem ich gewandelt bin«.
- source_word: מַלְאָכוֹ
  choice: seinen Engel
  rationale: Im Zusammenhang ist ein von Gott gesandtes himmlisches Wesen gemeint; »Engel« ist daher treffender als das allgemeinere »Bote«.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: deine Reise gelingen lassen
  rationale: Gibt die kausative Bedeutung von צלח und das Weg-Motiv verständlich wieder.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: du wirst … eine Frau … nehmen
  rationale: Bewahrt den hebräischen Heiratsausdruck in einer würdigen, verständlichen deutschen Form.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: aus meiner Sippe
  rationale: Bezeichnet hier einen weiteren Verwandtschaftsverband und nicht nur die unmittelbare Familie.
- source_word: וּמִבֵּית אָבִי
  choice: aus dem Haus meines Vaters
  rationale: Bewahrt die konkrete patriarchale Haushalts- und Abstammungsbezeichnung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar gehalten und nicht durch einen Herrschaftstitel ersetzt.
- issue: Bedeutung von הִתְהַלַּכְתִּי לְפָנָיו
  choice: vor dessen Angesicht ich gelebt habe
  alternative: dem ich treu gedient habe
  rationale: Die bildhafte Aussage über Abrahams Leben in Gottes Gegenwart bleibt erhalten, ohne die Treue ausdrücklich hinzuzufügen und damit die Aussage enger auszulegen.
- issue: Aussage über den Erfolg der Sendung
  choice: wird … deine Reise gelingen lassen
  alternative: möge … deine Reise gelingen lassen
  rationale: Die hebräische Verbform drückt hier im Rahmen von Abrahams Zusage eine bestimmte Zukunftserwartung aus, nicht lediglich einen Wunsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, aber ohne veraltete Wendungen wie »wandeln« oder »Weib«. »Sippe« unterscheidet den weiteren Verwandtschaftsverband vom engeren »Haus meines Vaters«.
