  text: וַ/יַּבְרֵ֧ךְ הַ/גְּמַלִּ֛ים מִ/ח֥וּץ לָ/עִ֖יר אֶל בְּאֵ֣ר הַ/מָּ֑יִם לְ/עֵ֣ת עֶ֔רֶב לְ/עֵ֖ת צֵ֥את הַ/שֹּׁאֲבֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: de
  text: Er ließ die Kamele außerhalb der Stadt am Brunnen niederknien, gegen Abend, zu der Zeit, als die Frauen[a] hinausgingen, um Wasser zu schöpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Partizip steht im Femininum Plural und bezeichnet ausdrücklich Frauen, die Wasser schöpfen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: ließ … niederknien
  rationale: Die Hifil-Form von ברך bezeichnet hier das Veranlassen des Niederkniens. Die deutsche Wendung gibt die konkrete, kausative Handlung natürlich wieder.
- source_word: הַגְּמַלִּים
  choice: die Kamele
  rationale: Direkte Wiedergabe des bestimmten Plurals; gemeint sind die bereits erwähnten Karawanentiere.
- source_word: מִחוּץ לָעִיר
  choice: außerhalb der Stadt
  rationale: מִחוּץ bezeichnet den Raum außerhalb; עִיר kann Stadt oder Ortschaft bedeuten. „Stadt“ ist die übliche, kontextuell passende Wiedergabe.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: am Brunnen
  rationale: אֶל bezeichnet die Bewegung zum Brunnen hin; nach dem Niederknien ist im Deutschen die resultierende Lage mit „am Brunnen“ idiomatisch ausgedrückt. בְּאֵר הַמָּיִם ist wörtlich ein Wasserbrunnen, doch „Brunnen“ enthält diese Bedeutung bereits.
- source_word: לְעֵת עֶרֶב
  choice: gegen Abend
  rationale: Die Wendung bezeichnet die Abendzeit. „Gegen Abend“ ist natürliches modernes Deutsch und lässt den zeitlichen Übergangsbereich offen.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: zu der Zeit, wenn die Frauen hinausgingen, um Wasser zu schöpfen
  rationale: צֵאת bezeichnet das Hinausgehen, und das feminine Pluralpartizip הַשֹּׁאֲבֹת verweist ausdrücklich auf weibliche Personen, die Wasser schöpfen. Die Formulierung bewahrt beide Angaben in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die doppelte Zeitangabe des Hebräischen bleibt erkennbar, ohne im Deutschen schwerfällig zu wirken; „Wasserbrunnen“ wurde als unnötig redundant vermieden.
