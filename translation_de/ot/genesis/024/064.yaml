translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Namensform „Rebekka“ wird verwendet. Der erste hebräische Ausdruck bleibt bewusst bildhaft; beim Absteigen erhält der Haupttext dagegen eine natürliche deutsche Formulierung, während die auffällige Wörtlichkeit in der Fußnote bewahrt wird.
