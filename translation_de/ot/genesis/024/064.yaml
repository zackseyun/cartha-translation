lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: Rebekka erhob ihre Augen
  rationale: Die hebräische Wendung bedeutet wörtlich „die Augen erheben“. Sie bleibt im Deutschen verständlich und bewahrt den erzählerischen Ausdruck; „blickte auf“ wäre glatter, aber weniger formnah.
- source_word: וַתֵּרֶא
  choice: sah
  rationale: ראה bezeichnet hier schlicht das Sehen; „sah“ ist die direkte und natürliche Wiedergabe.
- source_word: אֶת יִצְחָק
  choice: Isaak
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: Da stieg sie vom Kamel ab
  rationale: נפל bedeutet gewöhnlich „fallen“, wird hier aber wahrscheinlich idiomatisch für ein rasches Herabsteigen oder Absteigen gebraucht. Die Haupttextfassung vermittelt den wahrscheinlichen Sinn, ohne im Deutschen einen unbeabsichtigten Unfall nahezulegen; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
