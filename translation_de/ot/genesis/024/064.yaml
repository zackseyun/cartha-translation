  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: de
  text: Rebekka erhob ihre Augen, sah Isaak und stieg vom Kamel ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und sie fiel vom Kamel herab.“ Wahrscheinlich bezeichnet „fallen“ hier idiomatisch das Absteigen.'
