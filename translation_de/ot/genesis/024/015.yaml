  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: de
  text: Und noch bevor er zu Ende gesprochen hatte, siehe, da kam Rebekka heraus, die Betuël geboren worden war, dem Sohn Milkas, der Frau Nahors, des Bruders Abrahams, und ihren Krug auf der Schulter hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und
  rationale: Die deutsche Erzählverknüpfung gibt die Funktion des Wayyiqtol natürlich wieder; ein zusätzliches „es geschah“ wäre zusammen mit dem folgenden Zeitsatz schwerfällig.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: noch bevor er zu Ende gesprochen hatte
  rationale: „Noch bevor“ bewahrt die zeitliche Zuspitzung von טֶרֶם; das Plusquamperfekt bildet die Vorzeitigkeit und den Abschlussgedanken von כִּלָּה angemessen ab.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: „Siehe“ erhält den aufmerksamkeitslenkenden, anschaulichen Erzählton von הִנֵּה; „da“ bindet die Wendung idiomatisch in den deutschen Satz ein.
- source_word: יֹצֵאת
  choice: kam … heraus
  rationale: Das Partizip schildert Rebekkas Hervortreten als gerade wahrgenommenes Geschehen. Das deutsche Präteritum mit „siehe, da“ vermittelt diese lebendige Unmittelbarkeit natürlicher als eine Verlaufsform.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: Sie war Betuël geboren worden
  rationale: Die passive Form und die Abstammungsangabe mit לְ bleiben erhalten, ohne ausdrücklich „Tochter“ in den Text einzufügen.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: dem Sohn Milkas, der Frau Nahors, des Bruders Abrahams
  rationale: 'Die vollständige genealogische Apposition des Hebräischen bleibt in derselben Zuordnung erhalten: Betuël ist Milkas Sohn; Milka ist Nahors Frau; Nahor ist Abrahams Bruder.'
- source_word: כַּדָּהּ עַל שִׁכְמָהּ
  choice: trug ihren Krug auf der Schulter
  rationale: Die Besitz- und Ortsangaben werden klar und idiomatisch wiedergegeben. „Trug“ macht die im hebräischen Nominalsatz vorausgesetzte Situation im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht gehobenem „siehe“, das die narrative Signalwirkung des hebräischen הִנֵּה bewahrt. Die genealogische Formulierung bleibt eng am Ausgangstext, ohne zusätzliche Auslegung.
