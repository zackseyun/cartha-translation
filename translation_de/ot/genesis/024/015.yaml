  source_fidelity: 'Die Grundelemente sind vorhanden: die zeitliche Vorordnung, das aufmerksamkeitslenkende הִנֵּה, Rebekkas Hervorkommen, die vollständige Genealogie und der Krug auf ihrer Schulter. Die genealogische Beziehung wird jedoch durch die Satztrennung und die Formulierung „Sie war Betuël geboren worden“ weniger klar an Rebekka gebunden als im Hebräischen.'
