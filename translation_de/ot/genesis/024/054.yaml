  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֗וּ ה֛וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר עִמּ֖/וֹ וַ/יָּלִ֑ינוּ וַ/יָּק֣וּמוּ בַ/בֹּ֔קֶר וַ/יֹּ֖אמֶר שַׁלְּחֻ֥/נִי לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: de
  text: 'Dann aßen und tranken er und die Männer, die bei ihm waren, und sie blieben dort über Nacht. Als sie am Morgen aufstanden, sagte er: »Lasst mich zu meinem Herrn[a] ziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist Abraham, dem der Diener unterstand; auch möglich: »zu meinem Gebieter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: aßen und tranken
  rationale: Die knappe Abfolge der beiden Wayyiqtol-Formen wird durch zwei einfache deutsche Vergangenheitsformen bewahrt.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: er und die Männer, die bei ihm waren
  rationale: Die ausdrückliche Subjektgruppe des Hebräischen bleibt vollständig erhalten; »er« bezeichnet Abrahams Diener.
- source_word: וַיָּלִינוּ
  choice: sie blieben dort über Nacht
  rationale: לון/לין bezeichnet das Übernachten. »Dort über Nacht bleiben« ist natürliches modernes Deutsch und gibt den lokalen Sinn im Zusammenhang wieder.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: Als sie am Morgen aufstanden
  rationale: Die zeitliche Verknüpfung mit dem folgenden Sprechen wird im Deutschen idiomatisch mit »als« ausgedrückt.
- source_word: שַׁלְּחֻנִי
  choice: Lasst mich … ziehen
  rationale: Der Imperativ von שׁלח fordert die Gastgeber auf, ihn zur Abreise freizugeben. Die deutsche Wendung gibt dies natürlicher wieder als das missverständliche »sendet mich weg«.
- source_word: לַאדֹנִי
  choice: zu meinem Herrn
  rationale: אָדוֹן bezeichnet hier Abraham als den menschlichen Herrn des Dieners. »Herr« bewahrt die mögliche Bedeutungsbreite und passt zur historischen sozialen Beziehung.
theological_decisions:
- issue: Wiedergabe von אָדוֹן mit Bezug auf Abraham
  choice: meinem Herrn
  alternative: meinem Gebieter / meinem Dienstherrn
  rationale: Der Bezug gilt eindeutig Abraham und nicht Gott. »Herr« wahrt die gewöhnliche personale Anrede- und Verhältnisbezeichnung, während die Fußnote die historische Dienstbeziehung verdeutlicht, ohne eine theologische Lesart einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählsyntax. Die direkte Rede bleibt bestimmt, ohne durch »wegschicken« eine unerwünschte abweisende Nebenbedeutung zu erhalten.
