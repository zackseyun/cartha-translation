  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: de
  text: 'Sieh, Rebekka steht vor dir. Nimm sie und geh! Sie soll die Frau des Sohnes deines Herrn werden[a], wie Jahwe es gesagt hat.


    [a] Oder: »Sie soll die Frau des Sohnes deines Herrn sein.« Das Hebräische kann hier sowohl das Eintreten in die Ehe als auch den daraus hervorgehenden Stand ausdrücken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie soll die Frau des Sohnes deines Herrn sein.« Das Hebräische kann hier sowohl das Eintreten in die Ehe als auch den daraus hervorgehenden Stand ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt die Aufmerksamkeit lebhaft auf die unmittelbar anwesende Rebekka. »Sieh« ist knapp, würdig und im heutigen Deutsch verständlich.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: Verwendet die im Deutschen etablierte Form des hebräischen Personennamens.
- source_word: לְפָנֶיךָ
  choice: steht vor dir
  rationale: Gibt die wörtliche räumliche Wendung natürlich wieder und vermittelt zugleich, dass Rebekka anwesend und zur Übergabe bereit ist.
- source_word: קַח וָלֵךְ
  choice: Nimm sie und geh!
  rationale: Bewahrt die beiden aufeinanderfolgenden Imperative. Das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen als »sie« ergänzt.
- source_word: וּתְהִי אִשָּׁה
  choice: Sie soll … die Frau … werden
  rationale: Der Jussiv drückt Zustimmung beziehungsweise Bestimmung aus. »Werden« passt zum bevorstehenden Eheschluss; die mögliche Wiedergabe mit »sein« bleibt in der Fußnote erhalten.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: des Sohnes deines Herrn
  rationale: Die Genitivkonstruktion ist im Deutschen die natürliche Wiedergabe der durch לְ bezeichneten ehelichen Zuordnung. »Herr« entspricht dem Verhältnis zwischen dem Knecht und Abraham.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: wie … es gesagt hat
  rationale: »Wie« drückt die Übereinstimmung mit Jahwes zuvor ergangenem Wort aus; das Perfekt klingt im modernen Deutsch natürlich und wahrt dessen gegenwärtige Relevanz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen und verwendet seine etablierte deutsche Form.
- issue: Bedeutung des Jussivs וּתְהִי in der Heiratsformel
  choice: Sie soll … werden
  alternative: Sie soll … sein
  rationale: Der Zusammenhang blickt auf den bevorstehenden Eheschluss, weshalb »werden« naheliegt. Da die Form auch den ehelichen Stand mit »sein« bezeichnen kann, wird diese echte Nuance in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Erzählprosa. Die direkten Aufforderungen bleiben lebendig; unnötig altertümliche Formen werden vermieden.
