  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו גַּם תֶּ֥בֶן גַּם מִסְפּ֖וֹא רַ֣ב עִמָּ֑/נוּ גַּם מָק֖וֹם לָ/לֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: de
  text: 'Dann sagte sie zu ihm: »Wir haben reichlich Stroh und Futter und auch einen Platz zum Übernachten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Dann sagte sie
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Direkte Wiedergabe der Präposition mit dem pronominalen Suffix.
- source_word: גַּם ... גַּם ... גַּם
  choice: … und … und auch
  rationale: Die wiederholte Partikel kennzeichnet eine kumulative Aufzählung. Die gewählte deutsche Form bewahrt diese Steigerung, ohne schwerfällig zu wirken.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: Im Zusammenhang mit der Versorgung von Tieren ist „Stroh“ die klare und übliche Entsprechung.
- source_word: מִסְפּוֹא
  choice: Futter
  rationale: Das Wort bezeichnet Tierfutter; „Futter“ ist präzise und im heutigen Deutsch geläufig.
- source_word: רַב
  choice: reichlich
  rationale: Das Adjektiv bezeichnet hier die große verfügbare Menge an Stroh und Futter; „reichlich“ gibt dies knapp und idiomatisch wieder.
- source_word: עִמָּנוּ
  choice: wir haben
  rationale: Wörtlich „bei/mit uns“; im Deutschen wird vorhandener Besitz in diesem Zusammenhang natürlich mit „wir haben“ ausgedrückt.
- source_word: מָקוֹם
  choice: einen Platz
  rationale: „Platz“ bewahrt die allgemeine Bedeutung und legt anders als „Zimmer“ keine bestimmte Art der Unterkunft fest.
- source_word: לָלוּן
  choice: zum Übernachten
  rationale: Der Infinitiv bezeichnet das Verbringen der Nacht; „zum Übernachten“ ist natürliches, modernes Deutsch.
theological_decisions: []
