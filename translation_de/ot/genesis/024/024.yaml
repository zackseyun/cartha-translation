translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer genealogischer Syntax. Die traditionelle deutsche Namensform »Betuël« verhindert eine missverständliche einsilbige Aussprache; »Milka« und »Nahor« folgen gebräuchlicher deutscher Bibelnamenschreibung.
