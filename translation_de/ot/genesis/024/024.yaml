  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: de
  text: 'Sie sagte zu ihm: »Ich bin die Tochter Betuëls, des Sohnes Milkas, den sie Nahor gebar.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Sie sagte zu ihm
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung ein; im natürlichen deutschen Erzählstil genügt das Präteritum. אֵלָיו bezeichnet den männlichen Gesprächspartner.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Ich bin die Tochter Betuëls
  rationale: Die hebräische verblos gebildete Identifikation wird im Deutschen idiomatisch mit »Ich bin« wiedergegeben. Der Genitiv bewahrt die eindeutige Abstammungsangabe.
- source_word: בְּתוּאֵל
  choice: Betuël
  rationale: Der Personenname wird in einer im Deutschen etablierten, die Vokaltrennung kenntlich machenden Form transliteriert.
- source_word: בֶּן מִלְכָּה
  choice: des Sohnes der Milka
  rationale: Die Apposition ordnet Betuël als Sohn Milkas ein; der deutsche Genitiv macht die genealogische Beziehung klar.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: den sie Nahor geboren hat
  rationale: Das Relativpronomen bezieht sich auf Betuël. ילד mit לְ bezeichnet in dieser Geburtsformel Nahor als Vater; die deutsche Konstruktion »jemandem ein Kind gebären« bildet dies knapp und genau ab.
