  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Gott meines Herrn Abraham“ bewahrt sowohl die Gottesbezeichnung als auch das soziale Verhältnis des Sprechers zu Abraham. „Güte erweisen“ ist für חֶסֶד im Haupttext vertretbar; die Fußnote erläutert die weitergehenden Nuancen loyaler Güte und treuer Liebe, ohne sie dogmatisch zu verengen.
