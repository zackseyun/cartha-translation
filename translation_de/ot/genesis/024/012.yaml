  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: de
  text: 'Er sagte: „Jahwe, Gott meines Herrn Abraham, lass es mir heute doch gelingen[a] und erweise meinem Herrn Abraham Güte[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Lass es doch heute vor mir geschehen.“ Gemeint ist die Bitte, Gott möge das erhoffte Geschehen herbeiführen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch loyale Güte, treue Liebe oder Bundestreue bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Gott meines Herrn Abraham
  rationale: Die Genitivverbindung bezeichnet Abrahams Gott; „mein Herr“ gibt das Verhältnis des Knechtes zu Abraham in natürlichem Deutsch wieder.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: lass mein Vorhaben doch heute gelingen
  rationale: Der Hifil-Imperativ von קרה bittet Gott, das erhoffte Geschehen herbeizuführen. Die kontextbezogene Wiedergabe ist im Deutschen natürlich; „doch“ nimmt den höflich-bittenden Ton von נָא auf.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: erweise … Güte
  rationale: Die feste Verbindung aus עשה und חֶסֶד wird idiomatisch mit „Güte erweisen“ wiedergegeben. Eine Fußnote bewahrt das Bedeutungsspektrum loyaler Liebe und Treue.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: meinem Herrn Abraham
  rationale: Obwohl עִם wörtlich „mit“ bedeutet, verlangt die deutsche Wendung „jemandem Güte erweisen“ den Dativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Transliteration bewahrt diese Unterscheidung gegenüber bloßen Herrschaftstiteln.
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: treue Liebe; Bundestreue
  rationale: „Güte“ passt zu der konkreten Bitte, ohne חֶסֶד vorschnell auf einen theologischen Fachbegriff festzulegen. Die loyale und treue Dimension wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsanrede bleibt unmittelbar; „mein Herr Abraham“ ist aus der Perspektive des Knechtes formuliert. Die leicht erklärende Wendung „mein Vorhaben“ sorgt für natürliche Verständlichkeit, während die Fußnote die ungewöhnlich konkrete hebräische Formulierung bewahrt.
