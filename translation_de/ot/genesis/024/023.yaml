  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: de
  text: 'Dann sagte er: »Wessen Tochter bist du? Sag es mir bitte. Gibt es im Haus deines Vaters Platz für uns zum Übernachten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann fragte er
  rationale: Das wayyiqtol führt die Erzählung weiter. Da eine direkte Frage folgt, ist im Deutschen »fragte« natürlicher und sachlich genauer als das allgemeinere »sagte«.
- source_word: בַּת מִי אַתְּ
  choice: Wessen Tochter bist du?
  rationale: Gibt die hebräische Frage nach der familiären Herkunft idiomatisch und ohne inhaltliche Erweiterung wieder.
- source_word: הַגִּידִי נָא לִי
  choice: Sag es mir bitte.
  rationale: Der Imperativ wird durch נָא zu einer höflichen Bitte gemildert; »bitte« bildet diese Nuance natürlich ab. Das Pronomen »es« nimmt die vorausgehende Frage auf.
- source_word: הֲיֵשׁ
  choice: Gibt es
  rationale: Entspricht der hebräischen Existenzfrage in natürlichem modernem Deutsch.
- source_word: בֵּית אָבִיךְ
  choice: im Haus deines Vaters
  rationale: Bewahrt die konkrete Bezeichnung des väterlichen Hauses beziehungsweise Haushalts, ohne sie zu »Zuhause« zu verflachen.
- source_word: מָקוֹם
  choice: Platz
  rationale: Bezeichnet hier verfügbaren Raum zur Beherbergung; »Platz« ist im Deutschen in diesem Zusammenhang natürlich und wahrt den konkreten Sinn.
- source_word: לָנוּ
  choice: für uns
  rationale: 'Bewahrt den Plural: Der Knecht fragt für sich und seine Begleitung.'
- source_word: לָלִין
  choice: zum Übernachten
  rationale: 'Gibt den Zweck des erbetenen Platzes klar und gegenwartssprachlich wieder: die Nacht dort zu verbringen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt höflich und natürlich; die knappe Erzählbewegung und der Bezug auf das väterliche Haus bleiben erhalten.
