  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Hebräischen zuverlässig wieder: den Knecht, die Möglichkeitseinleitung, die Bereitschaft der Frau, das Folgen in dieses Land sowie die nachdrücklich formulierte Frage nach dem Zurückbringen des Sohnes. Das hebräische Imperfekt תֹאבֶה ist jedoch zukunftsbezogen; „nicht bereit ist“ kann zwar in deutschem Gegenwartsgebrauch zukunftsbezogen verstanden werden, aber „nicht bereit sein wird“ bildet die Perspektive eindeutiger ab. „fortgezogen bist“ ist als Wiedergabe von יָצָאתָ מִשָּׁם vertretbar.'
