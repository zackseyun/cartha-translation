  terminology: „Knecht“ ist im biblisch-erzählenden Register möglich und wahrt das Abhängigkeitsverhältnis, ohne den rechtlichen Status übermäßig festzulegen. „Frau“, „Land“ und „zurückbringen“ sind angemessen. „Zurückbringen“ bewahrt bewusst die auffällige שוב-Terminologie, ohne die erzählerische Spannung aufzulösen.
