base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: de
  text: 'Da sagte der Knecht zu ihm: „Vielleicht wird die Frau nicht bereit sein, mir in dieses Land zu folgen. Soll ich dann deinen Sohn wirklich zurückbringen[a] in das Land, aus dem du fortgezogen bist?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stärker hervorgehoben: „Soll ich deinen Sohn dann tatsächlich zurückbringen?“ Das Hebräische verbindet den Infinitiv mit dem finiten Verb, um die Handlung zu betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: der Knecht
  rationale: עֶבֶד bezeichnet einen Diener beziehungsweise Unfreien. „Knecht“ bewahrt hier das hierarchische Abhängigkeitsverhältnis und passt zum würdevollen Erzählstil; „Sklave“ würde den rechtlichen Status stärker festlegen, als es dieser Vers erfordert.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Gibt die vom Knecht erwogene Möglichkeit beziehungsweise Unsicherheit natürlich und genau wieder.
- source_word: לֹא תֹאבֶה
  choice: nicht bereit ist
  rationale: אָבָה bezeichnet Willigkeit oder Einverständnis. Die deutsche Präsensform ist in der indirekt vorausblickenden Aussage idiomatisch und bewahrt den Sinn des hebräischen Imperfekts.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text sagt schlicht „die Frau“ und bezeichnet sie hier weder ausdrücklich als Braut noch als junge Frau.
- source_word: לָלֶכֶת אַחֲרַי
  choice: mir … zu folgen
  rationale: Entspricht dem wörtlichen „hinter mir herzugehen“ in natürlichem modernem Deutsch.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: in dieses Land
  rationale: אֶרֶץ wird kontextgerecht mit „Land“ wiedergegeben; bei der Bewegung auf ein Ziel zu ist „in dieses Land“ im Deutschen natürlich.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Soll ich dann … wirklich … zurückbringen?
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt שׁוב. „wirklich“ macht die Hervorhebung sichtbar, während „Soll ich“ die abwägende Frage wiedergibt, ohne eine zwingende Pflicht zu unterstellen.
- source_word: אֶת בִּנְךָ
  choice: deinen Sohn
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: in das Land, aus dem du fortgezogen bist
  rationale: יָצָא bedeutet wörtlich „hinausgehen“. „fortgezogen bist“ ist im patriarchalischen Reisekontext natürlich und bewahrt die Bewegung weg vom Herkunftsland.
theological_decisions:
- issue: Ob Isaak tatsächlich „zurückgebracht“ werden kann, obwohl er dort nicht geboren wurde
  choice: zurückbringen
  alternative: hinbringen
  rationale: Die Formulierung bewahrt das auffällige שׁוב des hebräischen Textes und löst die mögliche Spannung nicht durch eine glättende Übersetzung auf.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Knecht“ ist bewusst traditioneller als „Diener“, bleibt aber allgemein verständlich und wahrt das soziale Gefälle. Die Satzstellung ist natürlich deutsch; die Betonung der hebräischen Verbverbindung wird durch „wirklich“ und eine Fußnote erhalten.
