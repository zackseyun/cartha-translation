  to: 'Da sagte der Knecht zu ihm: „Vielleicht wird die Frau nicht bereit sein, mir in dieses Land zu folgen. Soll ich dann deinen Sohn wirklich zurückbringen[a] in das Land, aus dem du fortgezogen bist?“'
