  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: de
  text: 'Da sagte Abraham zu seinem Diener, dem Ältesten seines Hauses, der über alles herrschte, was ihm gehörte: »Lege bitte deine Hand unter meine Hüfte[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Legen der Hand unter die Hüfte war eine altorientalische Geste beim Schwören eines Eides und unterstrich vermutlich dessen feierliche Verbindlichkeit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die fortlaufende hebräische Erzählform im Deutschen natürlich wieder, ohne eine stärkere zeitliche Folgerung festzulegen.
- source_word: עַבְדּוֹ
  choice: seinem Diener
  rationale: עבד kann »Diener« oder »Sklave« bezeichnen. Hier steht die Funktion des vertrauten Hausverwalters im Vordergrund; »Diener« wahrt den Bedeutungsraum, ohne einen rechtlichen Status zu behaupten.
- source_word: זְקַן בֵּיתוֹ
  choice: dem Ältesten seines Hauses
  rationale: Die Formulierung bewahrt die mögliche Bedeutung von Alter und Rang beziehungsweise Seniorität, statt sie eindeutig auf »den ältesten Diener« zu verengen.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר לוֹ
  choice: der über seinen ganzen Besitz eingesetzt war
  rationale: 'Gibt die leitende Verfügungs- und Verwaltungsfunktion idiomatisch wieder; wörtlicher wäre: »der über alles herrschte, was ihm gehörte«.'
- source_word: שִׂים נָא
  choice: Lege bitte
  rationale: Der Imperativ mit נָא wird als höfliche beziehungsweise nachdrückliche Bitte wiedergegeben.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Direkte Entsprechung des hebräischen Ausdrucks.
- source_word: תַּחַת יְרֵכִי
  choice: unter meine Hüfte
  rationale: Bewahrt die konkrete, kulturell geprägte Wendung des Hebräischen; ihre Bedeutung wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Haus« bleibt als Bezeichnung für den gesamten Haushalt erhalten; die leitende Stellung des Dieners wird zugleich natürlich ausgedrückt. Die kulturell fremde Eidgeste wird nicht paraphrasiert, sondern knapp erläutert.
