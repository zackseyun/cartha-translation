  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: de
  text: Da legte der Diener seine Hand unter den Oberschenkel Abrahams, seines Herrn, und schwor ihm in dieser Sache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Unter den Oberschenkel« gibt den hebräischen Ausdruck wörtlich wieder und beschreibt eine feierliche Eidgeste. Manche verstehen die Geste symbolisch im Zusammenhang mit den Lenden oder mit Nachkommen im Rahmen des Bundes.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: der Diener
  rationale: עֶבֶד kann »Diener« oder »Sklave« bezeichnen. Hier steht seine Aufgabe im Haushalt Abrahams im Vordergrund; »Diener« wahrt das Abhängigkeitsverhältnis, ohne den Akzent unnötig auf den Rechtsstatus zu legen.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: legte seine Hand
  rationale: שׂוּם bedeutet »setzen, legen, stellen«. Im Deutschen ist »die Hand legen« für diese konkrete Handlung natürlich und quellennah.
- source_word: תַּחַת יֶרֶךְ
  choice: unter die Hüfte
  rationale: יָרֵךְ bezeichnet Hüfte beziehungsweise Oberschenkel. »Unter die Hüfte« entspricht der in deutschen Bibelübersetzungen verständlichen, konkreten Wiedergabe und deutet die mögliche Symbolik nicht im Haupttext aus.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Abrahams, seines Herrn
  rationale: אֲדוֹן bezeichnet hier den menschlichen Hausherrn. »Herr« gibt das Autoritätsverhältnis in natürlichem, würdigem Deutsch wieder; der Name wird als Genitivattribut angeschlossen.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: schwor ihm ... den Eid
  rationale: Das Nifal von שׁבע bedeutet »schwören, einen Eid leisten«. Die deutsche Wendung macht den persönlichen Bezug von לוֹ deutlich und klingt in Verbindung mit »in dieser Sache« idiomatisch.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Hier verweist es auf Abrahams zuvor erteilten Auftrag; »in dieser Sache« ist präzise und natürlich.
theological_decisions:
- issue: Wörtliche Wiedergabe oder symbolische Deutung der Eidgeste
  choice: Die konkrete Geste wird als »unter die Hüfte« wiedergegeben; mögliche Symbolik steht nur in der Fußnote.
  alternative: Die Geste deutend auf Lenden, Geschlechtsorgane oder Bundesnachkommenschaft beziehen.
  rationale: Der hebräische Text beschreibt die Handlung, erklärt ihre Bedeutung aber nicht. Eine konkrete Wiedergabe bewahrt diese Offenheit und vermeidet eine konfessionell oder exegetisch festgelegte Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Erzählstil, ist aber flüssig lesbar. Die Fußnotenmarke steht unmittelbar nach dem Satz.
