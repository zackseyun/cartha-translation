revisions:
- from: Da legte der Diener seine Hand unter die Hüfte Abrahams, seines Herrn, und schwor ihm in dieser Sache den Eid.[a]
  to: Da legte der Diener seine Hand unter den Oberschenkel Abrahams, seines Herrn, und schwor ihm in dieser Sache.[a]
  rationale: Die Revision ersetzt die weniger genaue Körperbezeichnung „Hüfte“ durch „Oberschenkel“, strafft die deutsche Eidesformel und formuliert die kulturelle Anmerkung so, dass sie die umstrittene Symbolik als Deutung kennzeichnet, statt sie in den Text einzutragen.
