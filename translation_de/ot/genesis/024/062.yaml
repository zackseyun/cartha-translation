  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: de
  text: Isaak war von Beer-Lahai-Roï[b][a] gekommen und wohnte im Land des Negev.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Isaak kam von Beer-Lahai-Roï.“ Die hebräische Konstruktion kann statt mit dem Plusquamperfekt auch einfacher mit dem Präteritum wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Beer-Lahai-Roï ist ein Ort, der zuvor mit Hagar in Verbindung gebracht wurde (siehe 1. Mose 16,14).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: war … gekommen
  rationale: Das Qal-Perfekt bezeichnet eine abgeschlossene Bewegung. Im Erzählzusammenhang gibt das Plusquamperfekt den vorausliegenden Vorgang natürlich wieder; auch das Präteritum ist möglich.
- source_word: מִבּוֹא
  choice: von
  rationale: Die verdichtete Verbindung aus מִן und dem Infinitiv von בוא bezeichnet hier am natürlichsten den Ausgangspunkt der Bewegung.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roï
  rationale: Der Ortsname wird gemäß der Projektpraxis transliteriert, nicht übersetzt. Bindestriche machen den zusammengesetzten Namen erkennbar; das Trema verdeutlicht im Deutschen die getrennte Aussprache von o und i.
- source_word: יוֹשֵׁב
  choice: wohnte
  rationale: Das Partizip beschreibt einen andauernden Zustand beziehungsweise gewöhnlichen Aufenthalt. Das deutsche „wohnte“ gibt dies natürlich und verständlich wieder.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: im Land des Negev
  rationale: „Negev“ bezeichnet die südliche Trockenzone und dient zugleich als geografischer Eigenname. „Land“ bewahrt das ausdrückliche אֶרֶץ.
- source_word: וְהוּא
  choice: und
  rationale: Die hebräische Fügung führt eine Hintergrundangabe über Isaak fort. Im Deutschen ist das Subjekt bereits eindeutig; eine erneute Wiedergabe mit „er“ wäre möglich, aber weniger flüssig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt bildet den erzählerischen Vorlauf ab, ohne die mögliche einfachere Vergangenheitslesart zu verschweigen. Kein nicht ausdrücklich vorhandenes zeitliches „Nun“ wurde ergänzt.
