source:
  edition: WLC
  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: de
  text: 'Und nun: Wenn ihr meinem Herrn Güte und Treue erweisen wollt[a], sagt es mir; wenn aber nicht, sagt es mir, damit ich mich nach rechts oder nach links wende.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beständige Liebe und Treue«. Das hebräische Wortpaar bezeichnet häufig loyale, verlässliche Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Wendung leitet die unmittelbare Folgerung aus der bisherigen Rede ein; „Und nun“ wahrt sowohl den Anschluss als auch den Übergang zur anstehenden Entscheidung.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: Wenn ihr … erweisen wollt
  rationale: Die hebräische Verbindung aus יֵשׁ mit Personalbezug und Partizip bezeichnet hier die Bereitschaft zu einer bevorstehenden Handlung. „Erweisen wollt“ gibt diesen willentlichen, zukunftsbezogenen Sinn im Deutschen natürlich wieder.
- source_word: חֶסֶד וֶאֱמֶת
  choice: Güte und Treue
  rationale: Das Wortpaar bezeichnet wohlwollende, loyale Zuwendung und verlässliches Handeln. „Güte und Treue“ ist verständlich und bewahrt beide Bedeutungsaspekte, ohne die relationale Aussage vorschnell ausschließlich als Bundessprache festzulegen.
- source_word: אֶת אֲדֹנִי
  choice: meinem Herrn
  rationale: 'Der von אֵת bezeichnete Bezug der Handlung wird im Deutschen idiomatisch mit dem Dativ ausgedrückt: Jemandem Güte und Treue erweisen.'
- source_word: הַגִּידוּ לִי
  choice: sagt es mir
  rationale: Der Imperativ verlangt eine klare Antwort. Das ergänzte „es“ ist im Deutschen idiomatisch und bezieht sich auf die geforderte Entscheidung.
- source_word: וְאִם לֹא
  choice: wenn aber nicht
  rationale: „Aber“ macht den im Kontext deutlichen Gegensatz zwischen Zustimmung und Ablehnung natürlich sichtbar.
- source_word: וְאֶפְנֶה
  choice: damit ich mich … wende
  rationale: Die Kohortativform bezeichnet die vom Bescheid abhängige beabsichtigte Folge. „Damit ich mich … wende“ erhält diesen Ziel- beziehungsweise Folgesinn.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: nach rechts oder nach links
  rationale: Die konkrete Richtungsmetapher wird beibehalten; sie ist auch im Deutschen verständlich und bezeichnet hier die Wahl eines anderen Weges beziehungsweise Vorgehens.
theological_decisions:
- issue: Möglicher bundestheologischer Gehalt von חֶסֶד וֶאֱמֶת
  choice: Güte und Treue
  alternative: beständige Liebe und Treue
  rationale: Der relationale Gehalt des Wortpaars bleibt erhalten, ohne an dieser Stelle eine ausschließlich bundestheologische Deutung festzuschreiben; die weiterführende Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt bestimmt und klar; die hebräische Richtungsmetapher wird nicht aufgelöst.
