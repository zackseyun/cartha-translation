  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: de
  text: 'Da sagte er: »Komm herein, du Gesegneter Jahwes[a]! Warum stehst du draußen? Ich habe im Haus Platz gemacht und einen Platz für die Kamele vorbereitet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du von Jahwe Gesegneter«; auch: »du, der du von Jahwe gesegnet bist«.'
    reason: Die knappe hebräische Verbindung בְּרוּךְ יְהוָה kann den Gesegneten als „Gesegneter Jahwes“ bezeichnen oder den von Jahwe bewirkten Segen ausdrücklich machen; sie fungiert hier als Anrede.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Der Wayyiqtol führt die Erzählung weiter; „Da sagte er“ gibt diesen Fortgang in natürlichem deutschem Erzählstil wieder.
- source_word: בּוֹא
  choice: Komm herein
  rationale: Der Imperativ bedeutet im Zusammenhang der Gastaufnahme, das Haus zu betreten; „herein“ macht die im Hebräischen vorausgesetzte Richtung idiomatisch deutlich.
- source_word: בְּרוּךְ יְהוָה
  choice: du von Jahwe Gesegneter
  rationale: Das passive Partizip mit dem Gottesnamen dient hier als Anrede. Die Formulierung wahrt sowohl den Segensgedanken als auch die direkte Anrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Warum stehst du draußen?
  rationale: Die direkte Frage und die örtliche Bedeutung von עמד mit בחוץ werden knapp und natürlich wiedergegeben.
- source_word: פִּנִּיתִי הַבַּיִת
  choice: Ich habe das Haus hergerichtet
  rationale: פנה bezeichnet hier das Freimachen beziehungsweise Bereitmachen des Hauses für den Gast. „Hergerichtet“ vermittelt das gemeinte Ergebnis, ohne unnötige Einzelheiten hinzuzufügen.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: und einen Platz für die Kamele
  rationale: Die schlichte Wiedergabe lässt wie der hebräische Text offen, wie der Platz genau ausgestattet war.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung in בְּרוּךְ יְהוָה
  choice: von Jahwe Gesegneter
  alternative: Gesegneter Jahwes
  rationale: Die hebräische Fügung kann als von Jahwe bewirkter Segen oder knapper als Zugehörigkeitsform verstanden werden. Der Haupttext gibt die naheliegende Urheberschaft wieder; die Fußnote bewahrt die sprachliche Alternative.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede klingt gastfreundlich und bestimmt; weder altertümliche Formen noch zusätzliche Erklärungen zur Unterbringung der Kamele wurden eingeführt.
