base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: de
  text: Als Abrahams Diener ihre Worte hörte, warf er sich bis zur Erde vor Jahwe[a] nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „zu Jahwe“; bei einer ehrfürchtigen Niederwerfung kann dies im Deutschen natürlich mit „vor Jahwe“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beugte er sich vor Jahwe bis zur Erde nieder“; das hebräische Verb kann eine ehrfürchtige, anbetende Niederwerfung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet das folgende Geschehen ein. Im Deutschen gibt „Als“ die zeitliche Verknüpfung natürlich wieder, ohne die Formel hölzern nachzubilden.
- source_word: שָׁמַע
  choice: hörte
  rationale: Das Verb bezeichnet hier unmittelbar das Hören des Gesagten.
- source_word: עֶבֶד אַבְרָהָם
  choice: Abrahams Diener
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder. „Diener“ bezeichnet hier den bevollmächtigten Hausangehörigen, ohne die mögliche soziale Bedeutung von עֶבֶד unnötig in den Vordergrund zu rücken.
- source_word: דִּבְרֵיהֶם
  choice: ihre Worte
  rationale: Die Wendung bewahrt die konkrete lexikalische Bedeutung von דְּבָרִים und ist im Deutschen verständlich und würdig.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf er sich … nieder
  rationale: Die Form bezeichnet eine tiefe Verbeugung oder Niederwerfung, hier in ehrfürchtiger Ausrichtung auf Gott. Die Wiedergabe ist natürlich und lässt offen, ob der Akzent auf Körperhaltung oder ausdrücklicher Anbetung liegt.
- source_word: אַרְצָה
  choice: bis zur Erde
  rationale: Die Richtungsform bezeichnet die Bewegung erdwärts. „Bis zur Erde“ macht die körperliche Tiefe der Niederwerfung anschaulich.
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Die Präposition ל steht beim Verb der Niederwerfung für den Adressaten der ehrfürchtigen Handlung. „Vor Jahwe“ ist im Deutschen idiomatisch; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Ob וַיִּשְׁתַּחוּ ausdrücklich mit „anbeten“ wiederzugeben ist
  choice: warf er sich … nieder
  alternative: betete er Jahwe an
  rationale: Das Verb kann eine anbetende Niederwerfung bezeichnen, doch אַרְצָה hebt zugleich die körperliche Handlung hervor. Die gewählte Fassung bewahrt diese Verbindung und legt die theologische Nuance nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdevollem Erzählstil. Die Wortstellung hält die zeitliche Abfolge klar; „warf sich … nieder“ bewahrt sowohl die sichtbare Körperhaltung als auch deren ehrfürchtigen Charakter.
