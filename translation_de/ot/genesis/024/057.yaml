  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: de
  text: 'Da sagten sie: »Lasst uns die junge Frau rufen und sie selbst fragen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihren Mund fragen«; gemeint ist, ihre eigene Antwort unmittelbar von ihr zu hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das narrative Wayyiqtol wird im Deutschen natürlich mit „Da sagten sie“ wiedergegeben; es führt ihre Reaktion im Erzählfluss ein.
- source_word: נִקְרָא
  choice: Rufen wir
  rationale: Die Kohortativform drückt einen gemeinsamen Vorschlag aus. „Rufen wir“ ist direkt und gegenwärtig; „herbeirufen“ wäre ebenfalls möglich, aber stärker explizierend.
- source_word: לַנַּעֲרָ
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet hier Rebekka als junge Frau im heiratsfähigen Alter. Die Wiedergabe ist modern und vermeidet sowohl das möglicherweise kindlich klingende „Mädchen“ als auch das altertümliche „Jungfrau“.
- source_word: וְנִשְׁאֲלָה
  choice: und fragen wir
  rationale: Auch diese Kohortativform setzt den gemeinsamen Vorschlag fort. „fragen“ ist die klare, natürliche Entsprechung.
- source_word: אֶת־פִּיהָ
  choice: sie selbst
  rationale: Wörtlich steht „ihren Mund fragen“. Die idiomatische Wendung betont, dass ihre eigene, unmittelbar geäußerte Antwort eingeholt werden soll; „sie selbst“ bewahrt diesen Akzent in natürlichem Deutsch.
