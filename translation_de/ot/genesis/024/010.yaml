  naturalness: Die Erzählung ist flüssig und modern verständlich. Die Verbindung des ersten Reiseverbs mit der Angabe der mitgeführten Güter in einem Satz ist im Deutschen natürlicher als die abgesetzte Ergänzung mit „Dabei hatte er“.
