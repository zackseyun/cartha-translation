base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: de
  text: Dann nahm der Knecht zehn von den Kamelen seines Herrn und zog los, mit allen wertvollen Gütern seines Herrn bei sich.[a] Er machte sich auf und zog nach Aram-Naharajim,[b] zur Stadt Nahors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und alles Gute seines Herrn war in seiner Hand“. Die Wendung kann bedeuten, dass er über die wertvollen Güter seines Herrn verfügte oder sie mit sich führte.'
    reason: lexical_alternative
  - marker: b
    text: Traditionell auch „Mesopotamien“; der hebräische Name Aram-Naharajim bedeutet etwa „Aram der zwei Flüsse“.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: der Knecht
  rationale: עֶבֶד kann einen Knecht, Diener oder Sklaven bezeichnen. Im patriarchalischen Haushalt und angesichts seiner verantwortungsvollen Stellung ist „Knecht“ eine natürliche, historisch passende Wiedergabe, ohne den rechtlichen Status genauer festzulegen.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: zehn von den Kamelen seines Herrn
  rationale: Die מן-Konstruktion bezeichnet eine Auswahl aus dem Kamelbestand des Herrn. Die deutsche Form bewahrt diesen partitiven Sinn ohne die im Hebräischen mögliche, im Deutschen aber schwerfällige Wiederholung von „Kamelen“.
- source_word: אֲדֹנָיו
  choice: seines Herrn
  rationale: אָדוֹן bezeichnet hier den Hausherrn des Knechtes. „Herr“ ist im Deutschen kontextgemäß und stellt an dieser Stelle keinen Gottesnamen dar.
- source_word: וַיֵּלֶךְ
  choice: zog los
  rationale: הלך bezeichnet das Gehen beziehungsweise Reisen. „Zog los“ gibt hier den Beginn der längeren Reise natürlich wieder.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: Dabei hatte er allerlei kostbare Dinge seines Herrn bei sich
  rationale: טוּב meint in diesem Zusammenhang wertvolle Güter oder Gaben. בְּיָדוֹ bedeutet wörtlich „in seiner Hand“, kann aber idiomatisch Besitz, Verfügung oder Obhut ausdrücken. Die Hauptfassung gibt den wahrscheinlichen Reisesinn verständlich wieder; eine stärker formale Alternative steht in der Fußnote.
- source_word: וַיָּקָם
  choice: Er machte sich auf
  rationale: קום leitet vor einem Bewegungsverb häufig entschlossenes Aufbrechen ein. „Er machte sich auf“ bewahrt diese Funktion und den eigenen Erzählakzent des Verbs.
- source_word: אֶל אֲרַם נַהֲרַיִם
  choice: nach Aram-Naharajim
  rationale: Der hebräische Ortsname wird transliteriert, statt durch das traditionelle, geografisch weiter gefasste „Mesopotamien“ ersetzt zu werden.
- source_word: אֶל עִיר נָחוֹר
  choice: zur Stadt Nahors
  rationale: Die Constructusverbindung kann eine Stadt bezeichnen, die Nahor zugeordnet oder mit ihm verbunden ist. „Stadt Nahors“ lässt die genaue Art dieser Beziehung offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Knecht“ wahrt den historischen Haushaltskontext, während „zog los“ und „machte sich auf“ die aufeinanderfolgenden hebräischen Bewegungsverben unterscheidbar und natürlich wiedergeben. Der Ortsname bleibt in transliterierter Form erhalten.
