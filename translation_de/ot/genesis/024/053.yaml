  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: de
  text: Dann holte der Diener silberne und goldene Gegenstände und Kleider hervor und gab sie Rebekka. Auch ihrem Bruder und ihrer Mutter gab er erlesene Geschenke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kostbare Dinge“; das hebräische Wort kann besonders wertvolle oder ausgesuchte Gaben und in manchen Zusammenhängen auch Delikatessen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: holte … hervor
  rationale: Die Hifil-Form von יצא bezeichnet hier das Herausbringen von Gegenständen; „holte … hervor“ ist im modernen Deutschen konkret und natürlich.
- source_word: הָעֶבֶד
  choice: der Knecht
  rationale: עֶבֶד kann einen Diener oder Sklaven bezeichnen. „Knecht“ bewahrt den historischen Erzählton und passt zu Abrahams ranghohem Hausdiener, ohne den Status genauer festzulegen, als es der Kontext erlaubt.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: silberne und goldene Kostbarkeiten
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät oder Gefäß. Da es sich hier um wertvolle Brautgeschenke handelt und nicht ausdrücklich um Gefäße, gibt „Kostbarkeiten“ die Funktion und den Wert natürlich wieder, ohne eine bestimmte Gegenstandsart festzulegen.
- source_word: וּבְגָדִים
  choice: und Kleider
  rationale: בְּגָדִים bezeichnet Kleidung; „Kleider“ ist in diesem Erzählzusammenhang würdig und allgemein verständlich.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: und gab sie Rebekka
  rationale: Das ergänzte Pronomen „sie“ nimmt im Deutschen natürlich die zuvor genannten Gegenstände und Kleider auf.
- source_word: וּמִגְדָּנֹת
  choice: erlesene Geschenke
  rationale: מִגְדָּנוֹת bezeichnet ausgesuchte oder kostbare Gaben und kann je nach Zusammenhang auch Delikatessen meinen. „Erlesene Geschenke“ passt zum Heiratskontext, ohne ausschließlich Geldwert oder Speisen zu unterstellen.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: ihrem Bruder und ihrer Mutter
  rationale: Die deutschen Dativformen geben die beiden mit לְ markierten Empfänger klar und flüssig wieder.
