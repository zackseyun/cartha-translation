  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: de
  text: Wenn die Frau aber nicht bereit ist, hinter dir herzugehen[a], bist du von diesem meinem Eid entbunden[b]. Nur meinen Sohn darfst du nicht dorthin zurückbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dir zu gehen“ beziehungsweise „dir zu folgen“; wörtlich: „hinter dir herzugehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bist du von diesem meinem Eid frei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die nachgestellte Partikel „aber“ gibt den bedingenden Gegensatz zum vorherigen Auftrag in natürlichem Deutsch wieder.
- source_word: לֹא תֹאבֶה
  choice: nicht bereit ist
  rationale: Die Formulierung bewahrt den Willens- und Zustimmungsaspekt des Verbs, ohne eine ausdrückliche Weigerung zu unterstellen.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Die betreffende Frau ist noch nicht Isaaks Ehefrau; „Frau“ ist daher sachlich und zeitlich angemessen.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: hinter dir herzugehen
  rationale: Dies bildet die räumliche Wendung אַחֲרֶיךָ eng ab. Im Reisekontext bedeutet sie sinngemäß auch „mit dir zu gehen“ oder „dir zu folgen“.
- source_word: וְנִקִּיתָ
  choice: bist du … entbunden
  rationale: Der Nifal bezeichnet hier die Befreiung von der bindenden Verpflichtung des Eides; „entbunden“ ist im Deutschen idiomatisch und rechtlich klar.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: von diesem Eid, den ich dir abgenommen habe
  rationale: Die Wendung macht in natürlichem Deutsch deutlich, dass Abraham diesen Eid vom Diener verlangt und ihm abgenommen hat, und bewahrt zugleich den demonstrativen Bezug „diesem“.
- source_word: רַק
  choice: Nur
  rationale: „Nur“ markiert prägnant die weiterhin geltende Einschränkung.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: meinen Sohn darfst du nicht dorthin zurückbringen
  rationale: „Zurückbringen“ gibt den kausativen Hifil von שׁוב wieder; „darfst … nicht“ drückt das Verbot natürlich und eindeutig aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klar und mündlich verständlich; die rechtlich-feierliche Sprache des Eides wird mit „entbunden“ bewahrt. Die hebräische Bewegungsmetapher steht im Haupttext und wird in der Fußnote idiomatisch erläutert.
