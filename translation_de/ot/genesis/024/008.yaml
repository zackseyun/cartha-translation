  terminology: „Eid“, „entbunden“ und „zurückbringen“ geben die rechtlich-bindende Aussage, den Nifal von נקה und den kausativen Charakter von שוב angemessen wieder. „Frau“ vermeidet die vorzeitige Bezeichnung als Ehefrau.
