base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: de
  text: 'Dann fragte ich sie[c]: »Wessen Tochter bist du?« Sie antwortete: »Ich bin die Tochter Betuëls, des Sohnes Nahors, den Milka ihm geboren hat.« Dann legte ich ihr den Ring[a] an die Nase und die Armreifen um die Handgelenke[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Nasenring“. Das hebräische Wort kann allgemein einen Ring bezeichnen; die folgende Angabe „an die Nase“ bestimmt hier seine Verwendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an ihre Hände“. Das hebräische Wort kann je nach Zusammenhang auch den Bereich der Handgelenke oder Arme einschließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Dann fragte ich sie und sagte“.'
    reason: source_form
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Dann fragte ich sie
  rationale: Die beiden aufeinanderfolgenden Verben bedeuten wörtlich „ich fragte sie und sagte“. Im Deutschen gibt „fragte ich sie“ den Sprechakt natürlich wieder; die wörtlichere Form bleibt in Fußnote [c] erhalten.
- source_word: בַּת מִי אַתְּ
  choice: Wessen Tochter bist du?
  rationale: Idiomhafte, genaue Wiedergabe der hebräischen Verwandtschaftsfrage unter Beibehaltung von בַּת („Tochter“).
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Ich bin die Tochter Betuëls, des Sohnes Nahors
  rationale: Die genealogische Zuordnung bleibt erhalten. „Ich bin“ wird für eine natürliche deutsche Antwort aus dem Zusammenhang ergänzt.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: den Milka ihm geboren hat
  rationale: Das Relativpronomen bezieht sich auf Betuël; „ihm“ gibt לּוֹ wieder und bezeichnet Nahor als Vater.
- source_word: הַנֶּזֶם
  choice: den Ring
  rationale: נֶזֶם kann allgemein einen Ring beziehungsweise Schmuckring bezeichnen; seine Verwendung als Nasenschmuck wird durch die folgende Ortsangabe bestimmt.
- source_word: עַל אַפָּהּ
  choice: an die Nase
  rationale: אַפַּיִם beziehungsweise אַף bezeichnet hier die Nase. Die Formulierung wahrt den konkreten Ort des Schmucks und ist im Deutschen verständlich.
- source_word: וְהַצְּמִידִים
  choice: und die Armreifen
  rationale: צְמִידִים bezeichnet paarweise getragene Reifen oder Bänder an Handgelenken beziehungsweise Armen; „Armreifen“ ist eine klare moderne Bezeichnung.
- source_word: עַל יָדֶיהָ
  choice: um die Handgelenke
  rationale: יָד kann Hand und den angrenzenden Arm umfassen. Bei Armreifen bezeichnet „um die Handgelenke“ im Deutschen den natürlichen Trageort; die formnähere Lesart steht in Fußnote [b].
