  source_fidelity: Die Übersetzung gibt die hebräische Erzählfolge, die Frage nach der Abstammung, die Genealogie Betuëls sowie die Platzierung von Ring und Armreifen zuverlässig wieder. Die Ergänzung „Ich bin“ ist im Deutschen für die elliptische hebräische Antwort natürlich und ohne Bedeutungszuwachs. „an die Nase“ wahrt die ausdrückliche Ortsangabe, ohne die genaue technische Art des Anlegens zu überbestimmen.
