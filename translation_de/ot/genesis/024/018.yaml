base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: de
  text: 'Sie sagte: »Trinkt, mein Herr[a]!« Dann senkte sie rasch ihren Krug auf ihre Hand und gab ihm zu trinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herr«. Hebräisch wörtlich: »mein Herr«; eine respektvolle Anrede an einen Mann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Trink
  rationale: Der Imperativ 2. Person Maskulin Singular von שׁתה wird knapp und unmittelbar wiedergegeben.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die Wendung bezeichnet hier eine höfliche, ehrerbietige Anrede an einen Mann, nicht einen göttlichen Titel. »Mein Herr« bewahrt die Form des Hebräischen; die im heutigen Deutsch natürlichere Entsprechung wird in der Fußnote genannt.
- source_word: וַתְמַהֵר
  choice: Schnell
  rationale: Das Verb drückt Eile aus. Die adverbiale Wiedergabe verbindet die Eile natürlich mit dem folgenden Herablassen des Kruges.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: ließ sie ihren Krug … hinab
  rationale: Die Formulierung bewahrt die Abwärtsbewegung des Kruges, ohne einen im Vers nicht ausdrücklich genannten Ausgangspunkt wie die Schulter einzufügen.
- source_word: עַל יָדָהּ
  choice: auf ihre Hand
  rationale: Die konkrete hebräische Ortsangabe wird formal bewahrt. Sie beschreibt vermutlich, wie der Krug zum Tränken in eine geeignete Position gebracht wurde.
- source_word: וַתַּשְׁקֵהוּ
  choice: gab ihm zu trinken
  rationale: Der Hifil von שׁקה bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Die gewählte Wendung ist natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzfolge. Die ungewöhnlich konkrete Wendung »auf ihre Hand« bleibt erhalten, um keine aus dem Kontext erschlossene Schulterposition in den Vers einzutragen.
