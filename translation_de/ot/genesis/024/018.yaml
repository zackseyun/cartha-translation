  naturalness: »Schnell ließ sie ihren Krug auf ihre Hand hinab« ist im modernen Standarddeutsch syntaktisch und idiomatisch holprig. »Sie senkte rasch ihren Krug auf ihre Hand« ist klarer, ohne die knappe und etwas ungewöhnliche Bildlichkeit des Ausgangstextes zu glätten. Bei der ehrerbietigen Anrede ist »Trinkt, mein Herr!« im Deutschen registergerecht.
