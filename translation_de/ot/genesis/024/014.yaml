source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: de
  text: 'Und es soll so sein: Die junge Frau, zu der ich sage: »Neige doch deinen Krug, damit ich trinken kann«, und die antwortet: »Trink! Auch deine Kamele will ich tränken« – sie soll diejenige sein, die du für deinen Knecht Isaak[a] bestimmt hast. An ihr[b] werde ich erkennen, dass du meinem Herrn treue Güte erwiesen hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »für deinen Knecht, für Isaak«. Nach dieser Gliederung könnte »dein Knecht« den betenden Diener Abrahams bezeichnen und »für Isaak« als eigene Ergänzung folgen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Daran werde ich erkennen«. Wörtlich steht im Hebräischen »an ihr« beziehungsweise »durch sie«; gemeint sein kann die junge Frau als Zeichen oder ihr geschildertes Verhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es soll so sein
  rationale: Die Wendung leitet im Gebetszusammenhang die erbetene Festlegung eines Zeichens ein. Die deutsche Form bewahrt den Wunschcharakter, ohne unnötig altertümlich zu klingen.
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: Das Wort bezeichnet hier eine junge weibliche Person im heiratsfähigen Alter. »Junge Frau« ist gegenwärtig, würdevoll und weniger missverständlich als »Mädchen«.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Neige doch deinen Krug
  rationale: הטה bezeichnet ein Neigen oder Herablassen; נָא verleiht der Bitte einen höflichen Ton, der im Deutschen natürlich durch »doch« wiedergegeben wird.
- source_word: וְאֶשְׁתֶּה
  choice: damit ich trinken kann
  rationale: Die deutsche Finalkonstruktion gibt den begehrenden Sinn der Kohortativform im Zusammenhang der Bitte natürlich wieder.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: Auch deine Kamele will ich tränken
  rationale: Der Hifil von שׁקה bedeutet, jemandem oder Tieren zu trinken zu geben. »Tränken« ist im Deutschen für Kamele präzise und idiomatisch.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: sie soll diejenige sein, die du … bestimmt hast
  rationale: הוכיח bezeichnet hier im Zusammenhang des erbetenen Zeichens das Auswählen oder Bestimmen. Die Formulierung verbindet dies natürlich mit dem einleitenden Wunsch.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: für deinen Knecht Isaak
  rationale: Isaak erläutert in verzögerter Apposition, wer mit »deinem Knecht« gemeint ist. Das entspricht dem Handlungsziel, eine Frau für Isaak zu finden; die formale Mehrdeutigkeit der doppelten ל-Konstruktion wird in einer Fußnote bewahrt.
- source_word: וּבָהּ אֵדַע
  choice: An ihr werde ich erkennen
  rationale: Das feminine Suffix verweist grammatisch am unmittelbarsten auf die junge Frau. »An ihr« erhält diesen konkreten Bezug und lässt zugleich erkennen, dass ihr Verhalten als Zeichen dient.
- source_word: חֶסֶד
  choice: treue Güte
  rationale: Die Verbindung gibt sowohl die wohlwollende Güte als auch die verlässliche, loyale Beziehungsdimension von חֶסֶד wieder, ohne den Ausdruck auf einen technischen Bundesbegriff einzuengen.
- source_word: עִם אֲדֹנִי
  choice: meinem Herrn
  rationale: Obwohl עִם wörtlich »mit« bedeutet, verlangt die deutsche Verbindung »jemandem Güte erweisen« den Dativ.
theological_decisions:
- issue: Bezug von »dein Knecht« in לְעַבְדְּךָ לְיִצְחָק
  choice: 'Isaak ist durch eine verzögerte Apposition als Gottes Knecht bezeichnet: »für deinen Knecht Isaak«.'
  alternative: »für deinen Knecht, für Isaak«, wobei »dein Knecht« auf den betenden Diener Abrahams bezogen wird.
  rationale: Im Erzählzusammenhang soll die Frau für Isaak bestimmt werden, nicht für den betenden Diener. Die Wiederholung der Präposition ל kann Isaak als nachgestellte nähere Bestimmung kennzeichnen. Da die hebräische Folge formal auch anders gegliedert werden kann, wird die Alternative ausdrücklich vermerkt.
- issue: Bezug des femininen Suffixes in וּבָהּ
  choice: '»An ihr«: Die junge Frau selbst beziehungsweise ihr Verhalten ist das Erkenntniszeichen.'
  alternative: '»Daran«: Die gesamte geschilderte Begebenheit ist das Zeichen.'
  rationale: Das feminine Suffix nimmt am natürlichsten die junge Frau wieder auf. Sachlich fungiert ihr Verhalten als Zeichen; die alternative, stärker auf den Vorgang bezogene Wiedergabe bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Güte
  alternative: Güte; Liebe; Bundestreue
  rationale: »Treue Güte« bewahrt die Verbindung von Zuwendung und Verlässlichkeit, ohne eine bestimmte Bundestheologie in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt schlicht und mündlich; »Krug«, »Kamele tränken« und »treue Güte« sind verständlich, zugleich aber dem biblischen Erzählregister angemessen. Die echte syntaktische Mehrdeutigkeit bei לְעַבְדְּךָ לְיִצְחָק und die Bezugsmöglichkeit von וּבָהּ werden nicht stillschweigend beseitigt, sondern durch knappe Fußnoten offengehalten.
