base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: de
  text: Die junge Frau war sehr schön anzusehen. Sie war eine Jungfrau, und kein Mann hatte mit ihr geschlafen.[a] Sie ging zur Quelle hinunter,[b] füllte ihren Krug und kam herauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich heißt es im Hebräischen: »Kein Mann hatte sie erkannt.« »Erkennen« ist hier eine Umschreibung für Geschlechtsverkehr.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Quelle; manche Übersetzungen geben es mit »Brunnen« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person, hier im heiratsfähigen Alter. »Junge Frau« ist im modernen Deutschen natürlicher und weniger altertümlich als »Jungfrau« oder »Magd« und weniger kindlich als »Mädchen«.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: sehr schön anzusehen
  rationale: Die Wendung beschreibt ausdrücklich ihr Aussehen und wird durch מְאֹד verstärkt. »Sehr schön anzusehen« gibt dies idiomatisch und ohne unnötige Erweiterung wieder.
- source_word: בְּתוּלָה
  choice: eine Jungfrau
  rationale: בְּתוּלָה bezeichnet hier eine Frau, die noch keinen Geschlechtsverkehr hatte. »Jungfrau« ist die direkte und kontextgerechte deutsche Entsprechung.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: und kein Mann hatte sie erkannt
  rationale: יָדַע, »erkennen/kennen«, dient hier als zurückhaltender Euphemismus für Geschlechtsverkehr. Die wörtlich nahe Wiedergabe bewahrt die Ausdrucksweise des Hebräischen; die Fußnote erläutert den gemeinten Sinn.
- source_word: הָעַיְנָה
  choice: zur Quelle hinunter
  rationale: עַיִן bezeichnet hier eine natürliche Wasserquelle. »Quelle« ist genauer als »Brunnen«, da nicht das übliche Wort בְּאֵר steht; die Richtungsendung und ירד werden durch »zur … hinunter« wiedergegeben.
- source_word: כַדָּהּ
  choice: ihren Krug
  rationale: כַּד ist ein Gefäß zum Schöpfen und Tragen von Wasser. »Krug« ist im Deutschen knapp, geläufig und dem erzählerischen Umfeld angemessen.
- source_word: וַתָּעַל
  choice: und kam wieder herauf
  rationale: עלה bildet den räumlichen Gegensatz zum vorherigen Hinuntergehen. »Kam wieder herauf« macht diese Bewegung im Deutschen natürlich deutlich; »wieder« bezeichnet dabei die Rückbewegung.
theological_decisions:
- issue: Bedeutung von »kein Mann hatte sie erkannt«
  choice: Das hebräische Erkenntnis-Euphemismus wird im Haupttext bewahrt und in einer Fußnote erklärt.
  alternative: »Kein Mann hatte Geschlechtsverkehr mit ihr.«
  rationale: Die gewählte Fassung erhält die literarische Zurückhaltung und die enge Verbindung zum hebräischen Wortlaut, ohne den sexuellen Sinn zu verschleiern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Sätze vermeiden eine schwerfällige Reihung, während »erkannt« die zurückhaltende Ausdrucksweise des hebräischen Textes bewahrt.
