  source_fidelity: 'Die Grundbedeutung ist zutreffend: Rebekka läuft und gibt die vorausgehenden Ereignisse weiter. „Lief ... davon“ fügt jedoch die Nuance des Weglaufens bzw. Sich-Entfernens hinzu, die רוץ hier nicht ausdrückt. Außerdem macht „im Haus ihrer Mutter“ die hebräische Empfänger-/Richtungsangabe unnötig zu einer bloßen Ortsangabe.'
  naturalness: „Da lief die junge Frau zum Haus ihrer Mutter und erzählte dort von diesen Dingen“ ist flüssiges modernes Standarddeutsch. Es vermeidet die missverständliche Konnotation von „davonlief“ und stellt den Erzählablauf klar dar.
  terminology: „Junge Frau“ ist für הַנַּעֲרָ angemessen. „Haus ihrer Mutter“ bewahrt die im Hebräischen mögliche Bedeutung von Haus beziehungsweise Haushalt; die Fußnote benennt die Alternative idiomatisch als „Haushalt ihrer Mutter“. „Diesen Dingen“ gibt כַּדְּבָרִים הָאֵלֶּה offen und kontextgerecht wieder.
