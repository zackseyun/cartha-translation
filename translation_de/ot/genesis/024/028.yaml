    issue: „im Haus ihrer Mutter“
    rationale: Die Präposition לְ kennzeichnet hier das Haus bzw. den Haushalt der Mutter als Ziel oder Adressaten. Die deutsche Ortsangabe „im“ verschiebt die Beziehung und lässt den Bewegungsablauf weniger klar hervortreten.
  - severity: low
    issue: Fußnotenformulierung „ihrem mütterlichen Haushalt“
    rationale: „Mütterlicher Haushalt“ klingt im modernen Deutschen unnötig unidiomatisch. „Haushalt ihrer Mutter“ ist klarer und entspricht der möglichen Bedeutung von בַּיִת.
