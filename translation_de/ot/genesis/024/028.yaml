  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: de
  text: Da lief die junge Frau zum Haus ihrer Mutter und erzählte dort von diesen Dingen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Haushalt ihrer Mutter“. Der hebräische Ausdruck kann sowohl das Haus als Gebäude als auch den Haushalt oder Familienkreis ihrer Mutter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: lief ... davon
  rationale: Das Verb רוץ bezeichnet schnelles Laufen. In der deutschen Erzählung gibt „lief ... davon“ die Bewegung vom bisherigen Schauplatz natürlich wieder.
- source_word: הַנַּעֲרָ
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person. „Junge Frau“ ist modern und vermeidet sowohl das möglicherweise kindlich wirkende „Mädchen“ als auch das altertümliche „Jungfrau“.
- source_word: וַתַּגֵּד
  choice: erzählte
  rationale: Der Hifil von נגד bedeutet „mitteilen, berichten“. „Erzählte“ passt hier natürlich zum Weitergeben des gerade Erlebten.
- source_word: לְבֵית אִמָּהּ
  choice: im Haus ihrer Mutter
  rationale: בַּיִת kann sowohl das Gebäude als auch den zugehörigen Haushalt beziehungsweise Familienkreis bezeichnen. Die formnahe Wiedergabe bewahrt diese Mehrdeutigkeit; die Fußnote erläutert sie.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: was geschehen war
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Im Kontext geht es um die vorausgehenden Ereignisse; die deutsche Formulierung gibt diesen Erzählgehalt idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählweise. Die mögliche Doppelbedeutung von „Haus“ wird nicht im Haupttext aufgelöst, sondern in der Fußnote offengelegt.
