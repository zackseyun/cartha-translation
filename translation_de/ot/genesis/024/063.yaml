base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: de
  text: 'Isaak ging gegen Abend hinaus, um auf dem Feld nachzusinnen.[a] Er erhob seine Augen und sah: Da kamen Kamele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um auf dem Feld umherzugehen«, »zu sinnen«, »sich zu unterhalten« oder möglicherweise »zu beten«. Das hebräische Verb ist selten; seine genaue Bedeutung an dieser Stelle ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging hinaus
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet eine Bewegung nach draußen und führt die Erzählung fort; »ging hinaus« ist im modernen Deutschen natürlich.
- source_word: יִצְחָק
  choice: Isaak
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: לָשׂוּחַ
  choice: nachzusinnen
  rationale: Das seltene Verb שׂוח ist in seiner genauen Bedeutung umstritten. »Nachsinnen« gibt eine besinnliche Tätigkeit wieder, ohne sie ausdrücklich als Gebet festzulegen; andere mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שׂדה bezeichnet ein Feld oder offenes Land; »auf dem Feld« ist hier direkt und idiomatisch.
- source_word: לִפְנוֹת עָרֶב
  choice: gegen Abend
  rationale: Die Wendung bezeichnet die Zeit, in der der Abend naht; »gegen Abend« ist knapp und natürlich.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Als er seine Augen erhob
  rationale: Die hebräische Wendung beschreibt das Erheben beziehungsweise Ausrichten des Blicks. Die bildhafte Ausdrucksweise bleibt erhalten.
- source_word: וַיַּרְא
  choice: und hinsah
  rationale: ראה bezeichnet hier nach dem Erheben der Augen den bewussten Blick; »hinsah« bewahrt die Abfolge, ohne die Wahrnehmung doppelt auszudrücken.
- source_word: וְהִנֵּה
  choice: da
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf eine plötzlich wahrgenommene Szene. Das hervorhebende »da« gibt diese narrative Lebendigkeit in natürlichem Deutsch wieder.
- source_word: גְמַלִּים בָּאִים
  choice: kamen Kamele näher
  rationale: Das Partizip בָּאִים schildert die Kamele als in Bewegung und im Herankommen begriffen; »kamen … näher« gibt diesen fortschreitenden Vorgang idiomatisch wieder.
theological_decisions:
- issue: Möglicher Gebetsbezug von לָשׂוּחַ
  choice: Die Hauptübersetzung lautet »nachzusinnen« und legt kein ausdrückliches Gebet fest.
  alternative: »zu beten«
  rationale: Da das seltene hebräische Verb mehrere Deutungen zulässt, soll eine mögliche geistliche Tätigkeit nicht ausgeschlossen, aber auch nicht als sicher behauptet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge ist leicht geglättet, während das Bild vom Erheben der Augen und die hervorhebende Funktion von וְהִנֵּה erhalten bleiben. Die echte lexikalische Unsicherheit bei לָשׂוּחַ wird ausdrücklich in der Fußnote bewahrt.
