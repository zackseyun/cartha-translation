  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: de
  text: Sondern du sollst zum Haus meines Vaters und zu meiner Sippe[a] gehen und für meinen Sohn eine Frau nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu meiner Familie“ beziehungsweise „zu meinen Verwandten“. Das hebräische Wort bezeichnet einen größeren Familien- und Verwandtschaftsverband, nicht nur den unmittelbaren Haushalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sondern
  rationale: Im Zusammenhang mit Abrahams vorhergehendem Verbot hat die Wendung korrektiv-adversative Kraft. „Sondern“ gibt diesen Gegensatz im Deutschen natürlich wieder, ohne eine gewöhnliche Bedingung („wenn nicht“) zu unterstellen.
- source_word: בֵּית אָבִי
  choice: Haus meines Vaters
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Konstruktverbindung und lässt sowohl den örtlichen als auch den haushaltsbezogenen Sinn anklingen.
- source_word: תֵּלֵךְ
  choice: du sollst … gehen
  rationale: Das Imperfekt trägt hier im Rahmen des Auftrags verpflichtenden Charakter; „sollst“ wahrt den direktiven und würdigen Ton.
- source_word: מִשְׁפַּחְתִּי
  choice: meine Sippe
  rationale: „Sippe“ bezeichnet hier passend den weiteren Verwandtschaftsverband und ist weniger leicht auf die unmittelbare Kernfamilie beschränkt als „Familie“.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: und … eine Frau nehmen
  rationale: לקח bedeutet grundlegend „nehmen“; אִשָּׁה kann „Frau“ oder „Ehefrau“ heißen. Im Heiratskontext ist „eine Frau nehmen“ im Deutschen als Heiratsformulierung verständlich und bleibt zugleich quellennah.
- source_word: לִבְנִי
  choice: für meinen Sohn
  rationale: Die Präposition ל bezeichnet hier Ziel beziehungsweise Begünstigten der Heiratsvermittlung; „für meinen Sohn“ ist idiomatisch und präzise.
theological_decisions: []
