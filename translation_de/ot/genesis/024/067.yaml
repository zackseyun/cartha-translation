  text: וַ/יְבִאֶ֣/הָ יִצְחָ֗ק הָ/אֹ֨הֱלָ/ה֙ שָׂרָ֣ה אִמּ֔/וֹ וַ/יִּקַּ֧ח אֶת רִבְקָ֛ה וַ/תְּהִי ל֥/וֹ לְ/אִשָּׁ֖ה וַ/יֶּאֱהָבֶ֑/הָ וַ/יִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: de
  text: Isaak brachte sie in das Zelt seiner Mutter Sara. Er nahm Rebekka zu sich, sie wurde seine Frau, und er liebte sie. So fand Isaak Trost nach dem Tod seiner Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach seiner Mutter“. Gemeint ist die Zeit nach ihrem Tod; das Wort „Tod“ steht im Hebräischen nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: brachte sie
  rationale: Der Hifil von בוא mit femininem Objektsuffix bezeichnet, dass Isaak sie hineinbringt; „brachte sie“ gibt die Handlung klar und unmittelbar wieder.
- source_word: הָאֹהֱלָה
  choice: in das Zelt
  rationale: Das Richtungs-He bezeichnet eine Bewegung zum Zelt hin beziehungsweise hinein; der Zusammenhang legt den Eintritt in das Zelt nahe.
- source_word: שָׂרָה אִמּוֹ
  choice: seiner Mutter Sara
  rationale: Die appositionale Fügung identifiziert Sara als Isaaks Mutter. Die deutsche Wortstellung ist natürlich und bewahrt den Sinn der hebräischen Konstruktion.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: Er nahm Rebekka zu sich
  rationale: לקח bedeutet grundsätzlich „nehmen“ und hat hier ehelichen Bezug. „Zu sich nehmen“ klingt im modernen Deutschen vollständig, ohne die folgende Aussage, dass sie seine Frau wurde, vorwegzunehmen.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: sie wurde seine Frau
  rationale: Die Konstruktion היה + ל + אשה bezeichnet den Eintritt in den Ehestand und wird so knapp und idiomatisch wiedergegeben.
- source_word: וַיֶּאֱהָבֶהָ
  choice: er liebte sie
  rationale: אהב ist das gewöhnliche Verb für „lieben“; die schlichte Wiedergabe bewahrt Aussage und Ton.
- source_word: וַיִּנָּחֵם
  choice: fand Trost
  rationale: Der Nifal von נחם bezeichnet hier das Getröstetwerden. „Fand Trost“ ist im Deutschen natürlich und wahrt den intransitiven Sinn.
- source_word: אַחֲרֵי אִמּוֹ
  choice: nach dem Tod seiner Mutter
  rationale: Wörtlich steht „nach seiner Mutter“. Im erzählerischen Zusammenhang ist die Zeit nach ihrem Tod gemeint; die Ergänzung macht den deutschen Satz verständlich, wird aber in einer Fußnote als kontextuelle Verdeutlichung ausgewiesen.
