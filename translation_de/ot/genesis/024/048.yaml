revisions:
- from: Da verneigte ich mich, warf mich vor Jahwe nieder und pries Jahwe, den Gott meines Herrn Abraham, der mich auf einem verlässlichen Weg geführt hatte, um die Tochter des Bruders meines Herrn für dessen Sohn zu nehmen.
  to: Da verneigte ich mich, warf mich vor Jahwe nieder und pries Jahwe, den Gott meines Herrn Abraham, der mich auf dem Weg der Wahrheit[a] geführt hatte, um die Tochter des Bruders meines Herrn für den Sohn meines Herrn zu nehmen.
  rationale: Die Revision klärt den Bezug des Possessivpronomens bei „Sohn“ und ergänzt zur umstrittenen bzw. mehrschichtigen Wendung בְּדֶרֶךְ אֱמֶת eine Fußnote. Die Hauptfassung bleibt eng am hebräischen Wortlaut, während die Anmerkung die im Kontext mögliche Nuance von Treue und Verlässlichkeit bewahrt.
