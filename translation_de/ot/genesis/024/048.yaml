base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: de
  text: Da verneigte ich mich, warf mich vor Jahwe nieder und pries Jahwe, den Gott meines Herrn Abraham, der mich auf dem Weg der Wahrheit[a] geführt hatte, um die Tochter des Bruders meines Herrn für den Sohn meines Herrn zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einem Weg der Wahrheit“. Die Wendung kann auch einen treuen oder verlässlichen Weg bezeichnen und hebt Gottes zuverlässige Führung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: Da verneigte ich mich
  rationale: Das Verb bezeichnet das körperliche Beugen; „sich verneigen“ bewahrt die Geste, ohne ein Knien vorauszusetzen.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: warf mich vor Jahwe nieder
  rationale: Das Hitpael bezeichnet hier eine ehrfürchtige Niederwerfung vor Gott und wird als körperlicher Akt wiedergegeben, der zugleich Anbetung ausdrückt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche wissenschaftliche Wiedergabe des göttlichen Eigennamens bewahrt den Tetragrammaton als Namen statt ihn durch einen Titel zu ersetzen.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: und pries Jahwe
  rationale: ברך mit Gott als Objekt bedeutet, ihn segnend zu rühmen; „pries“ ist dafür im heutigen Deutsch natürlicher als „segnete“.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: den Gott meines Herrn Abraham
  rationale: אֲדֹנִי bezeichnet Abraham als den menschlichen Herrn des Knechtes; „Herr“ bewahrt das historische Dienstverhältnis.
- source_word: הִנְחַנִי
  choice: der mich … geführt hatte
  rationale: Der Hifil von נחה bedeutet „führen/leiten“. Das Plusquamperfekt macht den rückblickenden Bezug auf die bereits erfahrene Führung deutlich.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: auf einem verlässlichen Weg
  rationale: Die Wendung lautet wörtlich „auf einem Weg der Wahrheit/Treue“. „Verlässlich“ bewahrt hier die Bedeutung von אֱמֶת als Zuverlässigkeit und treuer Führung, ohne sie bloß als richtige Richtung zu deuten.
- source_word: לָקַחַת
  choice: um … zu nehmen
  rationale: Der Infinitiv bezeichnet den Zweck der Führung. „Nehmen“ wahrt die knappe Ausdrucksweise und lässt den im Zusammenhang gegebenen Heiratszweck unausgesprochen.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: die Tochter des Bruders meines Herrn
  rationale: Die Wiedergabe folgt der hebräischen Verwandtschaftsangabe, ohne den Namen des Bruders ergänzend einzutragen.
- source_word: לִבְנוֹ
  choice: für dessen Sohn
  rationale: „Dessen“ bezieht das Suffix eindeutig auf den unmittelbar genannten Herrn Abraham zurück.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den göttlichen Eigennamen. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutung von בְּדֶרֶךְ אֱמֶת
  choice: auf einem verlässlichen Weg
  alternative: auf dem wahren Weg
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bezeichnen. Im Zusammenhang mit Gottes Führung hebt „verlässlich“ deren zuverlässigen Charakter hervor, ohne eine besondere Heilswegslehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden unterschiedlichen Körperverben werden unterscheidbar wiedergegeben. „Herr“ bezeichnet hier klar den menschlichen Dienstherrn Abraham; „Jahwe“ den göttlichen Eigennamen.
