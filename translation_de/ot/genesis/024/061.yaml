base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: de
  text: Da machten sich Rebekka und ihre jungen Begleiterinnen[a] auf, bestiegen die Kamele und zogen hinter dem Mann her. Der Diener nahm Rebekka mit und zog weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihre Mägde“ beziehungsweise „ihre jungen Frauen“. Das hebräische Wort bezeichnet junge Frauen; in diesem Zusammenhang sind wahrscheinlich Rebekkas weibliche Begleiterinnen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: machten sich … auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet wörtlich das Aufstehen. Im Zusammenhang des Reiseantritts gibt „sich aufmachen“ die Handlung natürlich wieder, ohne sie mit dem folgenden Fortbewegungsverb gleichzusetzen.
- source_word: נַעֲרֹתֶיהָ
  choice: ihre jungen Frauen
  rationale: נַעֲרָה bezeichnet zunächst eine junge Frau; aus dem Zusammenhang ergibt sich wahrscheinlich, dass es sich um Rebekkas weibliche Begleiterinnen handelt. Die Übersetzung bewahrt den lexikalischen Kern, ohne einen ausdrücklich dienenden Status vorauszusetzen.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: bestiegen die Kamele
  rationale: רכב mit עַל kann das Aufsteigen auf ein Reittier bezeichnen. „Bestiegen“ bildet hier den Beginn des Rittes vor der anschließenden Reise ab.
- source_word: אַחֲרֵי הָאִישׁ
  choice: zogen hinter dem Mann her
  rationale: אַחֲרֵי bedeutet „hinter/nach“. Die Formulierung gibt natürlich wieder, dass die Frauen dem Mann auf der Reise folgten.
- source_word: הָאִישׁ
  choice: dem Mann
  rationale: Obwohl der Mann aus dem Zusammenhang als Abrahams Diener bekannt ist, steht im Hebräischen ausdrücklich „der Mann“. Dieser Wechsel der Bezeichnung bleibt erhalten.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: Der Diener nahm Rebekka mit
  rationale: לקח bedeutet „nehmen“. Das im Deutschen ergänzte „mit“ verdeutlicht im Reisekontext idiomatisch, dass der Diener Rebekka mit sich führte, ohne eine zusätzliche Rolle wie „begleiten“ oder „eskortieren“ festzulegen.
- source_word: הָעֶבֶד
  choice: der Diener
  rationale: עֶבֶד kann „Sklave“ oder „Diener“ bedeuten. Hier steht Abrahams bevollmächtigter Hausdiener im Blick; „Diener“ ist im Kontext die passende, nicht überbestimmende Wiedergabe.
- source_word: וַיֵּלַךְ
  choice: zog weiter
  rationale: הלך bedeutet „gehen/ziehen“. „Zog weiter“ entspricht im Deutschen natürlich der Fortsetzung der bereits begonnenen Reise.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Die wiederholten hebräischen Erzählverknüpfungen werden in natürlichem deutschem Satzfluss wiedergegeben; der Wechsel zwischen „Mann“ und „Diener“ bleibt entsprechend dem Ausgangstext erhalten.
