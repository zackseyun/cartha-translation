  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: de
  text: 'Jahwe, der Gott des Himmels, der mich aus dem Haus meines Vaters und aus meinem Geburtsland weggeführt hat, der zu mir geredet und mir geschworen hat: »Deinen Nachkommen werde ich dieses Land geben« – er wird dir seinen Engel[a] vorausschicken, und du sollst von dort eine Frau für meinen Sohn nehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen Boten. Das hebräische Wort מַלְאָךְ kann sowohl einen Boten als auch einen Engel bezeichnen; hier ist wahrscheinlich ein himmlischer Bote gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Transliteration des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: der Gott des Himmels
  rationale: Die natürliche deutsche Wendung gibt die hebräische Konstruktverbindung treffend wieder.
- source_word: לְקָחַנִי
  choice: mich ... geholt hat
  rationale: „Holen“ gibt hier Gottes Herausnahme Abrahams aus seiner bisherigen Heimat natürlich wieder; das wörtlich mögliche „genommen“ wäre im Deutschen missverständlich.
- source_word: מִבֵּית אָבִי
  choice: aus dem Haus meines Vaters
  rationale: Bewahrt die konkrete familiäre und haushaltsbezogene Ausdrucksweise des Hebräischen.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: und aus dem Land meiner Geburt
  rationale: Bleibt nahe am mehrdeutigen מוֹלֶדֶת, ohne es einseitig als Verwandtschaft oder Heimat auszulegen.
- source_word: דִּבֶּר לִי
  choice: zu mir geredet
  rationale: Gibt das einfache Verb „reden“ wieder und zieht die folgende Verheißung nicht vorweg.
- source_word: נִשְׁבַּע לִי
  choice: mir geschworen
  rationale: Direkte und idiomatische Wiedergabe der Eidformel.
- source_word: לְזַרְעֲךָ
  choice: deinen Nachkommen
  rationale: Das deutsche Wort kann die kollektive Bedeutung von זֶרַע natürlich ausdrücken, ohne das altertümliche „Samen“ zu verwenden.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: er wird seinen Engel vor dir hersenden
  rationale: „Engel“ ist im Kontext göttlicher Führung am wahrscheinlichsten; „Bote“ bleibt als echte lexikalische Alternative in der Fußnote erhalten. „Vor dir hersenden“ bildet לְפָנֶיךָ eng und verständlich ab.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: und du sollst ... eine Frau für meinen Sohn nehmen
  rationale: Bewahrt den verpflichtenden Ton des Auftrags und bleibt nahe am hebräischen Verb, ohne die Frau als bloßes Objekt des „Holens“ darzustellen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von מַלְאָכוֹ
  choice: seinen Engel
  alternative: seinen Boten
  rationale: Ein himmlischer Bote ist in diesem Zusammenhang wahrscheinlicher; da מַלְאָךְ jedoch auch einen menschlichen Boten bezeichnen kann, wird die Alternative nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mehrfachen Relativsätze spiegeln die feierliche Begründung des hebräischen Satzes, bleiben aber gut verständlich. Der Gedankenstrich hebt das betonte הוּא („er“) und den Übergang zur Zusicherung hervor.
