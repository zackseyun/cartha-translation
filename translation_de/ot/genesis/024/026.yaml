  terminology: „Jahwe“ ist eine konsistente Wiedergabe des Tetragramms. „Sich niederwerfen“ wahrt die konkrete körperliche Bedeutung des zweiten Verbs besser als eine ausschließlich abstrakte Wiedergabe mit „anbeten“. Die Fußnote erläutert Referent und mögliche sinngemäße Alternative hinreichend.
