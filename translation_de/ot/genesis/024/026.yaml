source:
  edition: WLC
  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: de
  text: Da verneigte sich der Mann und warf sich vor Jahwe nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der Mann“ bezeichnet hier Abrahams Diener. Die Wendung kann auch sinngemäß mit „betete Jahwe an“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: verneigte sich
  rationale: קָדַד bezeichnet das Beugen oder Senken des Körpers. „Sich verneigen“ gibt die erste körperliche Bewegung natürlich wieder und unterscheidet sie von der folgenden, stärkeren Niederwerfung.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der hebräische Text bezeichnet Abrahams Diener hier ausdrücklich als „den Mann“; die Übersetzung bewahrt diese Formulierung, statt den Bezug im Haupttext auszudeuten.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: Die Form von שׁחה bezeichnet ein ehrerbietiges Niederwerfen. Die körperlich konkrete Wiedergabe bewahrt die Bildlichkeit; die Ausrichtung auf Jahwe macht den Charakter als Anbetung aus dem Satz selbst deutlich.
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Die Präposition ל markiert hier die Ausrichtung der Huldigung auf Jahwe; „vor Jahwe“ ist im Deutschen bei „sich niederwerfen“ idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich gebrauchte Gottesname erkennbar bleibt.
- issue: Konkrete Niederwerfung oder abstrakte Wiedergabe als Anbetung
  choice: warf sich vor Jahwe nieder
  alternative: betete Jahwe an
  rationale: Die konkrete Handlung des Verbs bleibt erhalten, ohne ihre religiöse Bedeutung zu leugnen. Da sie auf Jahwe gerichtet ist, ist der Akt zugleich als Anbetung verständlich; eine rein abstrakte Wiedergabe würde die Körperhaltung einebnen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die zwei aufeinanderfolgenden hebräischen Verben werden als abgestufte Bewegungen wiedergegeben: erst das Verneigen, dann das Niederwerfen.'
