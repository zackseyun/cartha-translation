  source_fidelity: 'Der Entwurf bildet die beiden hebräischen Verben abgestuft und treffend ab: וַיִּקֹּד als „verneigte sich“ und וַיִּשְׁתַּחוּ als „warf sich … nieder“. „Der Mann“ bewahrt die im Hebräischen verwendete Bezeichnung הָאִישׁ, ohne den Bezug auf Abrahams Diener in den Haupttext einzutragen. „vor Jahwe“ gibt die auf יהוה gerichtete Niederwerfung idiomatisch und sachgerecht wieder.'
