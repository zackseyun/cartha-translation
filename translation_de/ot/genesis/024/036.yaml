  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: de
  text: Und Sara, die Frau meines Herrn, gebar meinem Herrn einen Sohn, nachdem sie alt geworden war.[a] Und er gab ihm alles, was er besaß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach ihrem Alter“. Die Wendung bezeichnet, dass Sara bereits alt war.'
    reason: Die hebräische Zeitangabe ist wörtlich im Deutschen ungewöhnlich; die Anmerkung dokumentiert sie, ohne eine zusätzliche, nicht klar abgegrenzte Alternative einzuführen.
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Qal-Wajjiqtol von ילד bezeichnet in der fortlaufenden Erzählung die Geburt; „gebar“ ist knapp, würdig und im Deutschen idiomatisch.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: die Frau meines Herrn
  rationale: Die Status-constructus-Verbindung bedeutet „Frau meines Herrn“ und bewahrt die ehrerbietige Redeweise des Knechtes.
- source_word: בֵן לַאדֹנִי
  choice: meinem Herrn einen Sohn
  rationale: Der deutsche Dativ gibt die durch ל bezeichnete Beziehung natürlich wieder; der unbestimmte Artikel entspricht der hebräischen Form ohne Artikel.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: nachdem sie alt geworden war
  rationale: Die wörtlich ungewöhnliche Wendung „nach ihrem Alter“ bezeichnet den Zeitpunkt nach Eintritt ihres Alters. Die gewählte Form ist verständliches modernes Deutsch und erhält den zeitlichen Akzent.
- source_word: וַיִּתֶּן לוֹ
  choice: Und er gab ihm
  rationale: Das Wajjiqtol setzt die vergangene Erzählfolge fort. Die Pronomen bleiben wie im Hebräischen stehen, ohne ihre Bezüge ausdrücklich einzusetzen.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: alles, was er besaß
  rationale: Die umfassende Besitzformel wird natürlich wiedergegeben und wahrt die Aussage der Gesamtheit.
theological_decisions:
- issue: Bezug der Pronomen in „er gab ihm“
  choice: Die Pronomen werden unverändert beibehalten.
  alternative: „Abraham gab seinem Sohn“
  rationale: Im Zusammenhang beziehen sie sich wahrscheinlich auf Abraham und Isaak; der hebräische Text nennt beide hier jedoch nicht ausdrücklich. Die Übersetzung soll diese textliche Form nicht unnötig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Herr“ bewahrt die ehrerbietige Anrede des Knechtes; Satzbau und Wortwahl bleiben nahe am Hebräischen, ohne unnatürlich zu wirken.
