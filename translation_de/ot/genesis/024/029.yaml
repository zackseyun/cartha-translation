  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/רִבְקָ֥ה אָ֖ח וּ/שְׁמ֣/וֹ לָבָ֑ן וַ/יָּ֨רָץ לָבָ֧ן אֶל הָ/אִ֛ישׁ הַ/ח֖וּצָ/ה אֶל הָ/עָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: de
  text: Rebekka hatte einen Bruder namens Laban. Laban lief hinaus zu dem Mann an der Quelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann der Schluss auch wiedergegeben werden: »Laban lief zu dem Mann hinaus, zur Quelle.«'
    reason: Die beiden mit אֶל eingeleiteten Wendungen können als parallele Zielangaben verstanden werden; im Deutschen liegt kontextuell die natürlichere Ortsangabe »bei/an der Quelle« nahe.
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: Rebekka hatte einen Bruder
  rationale: 'Die hebräische Konstruktion mit לְ bezeichnet hier Besitz: wörtlich etwa »Rebekka war ein Bruder«, idiomatisch auf Deutsch »Rebekka hatte einen Bruder«. Das einleitende וּ verbindet den Satz mit dem Kontext, erfordert hier aber kein eigenes deutsches Verbindungswort.'
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: namens Laban
  rationale: Die hebräische Namensformel »und sein Name war Laban« wird knapp und natürlich wiedergegeben, ohne ihren Inhalt zu verändern.
- source_word: וַ/יָּרָץ
  choice: lief
  rationale: Das Verb רוץ bedeutet hier »laufen/rennen«. »Lief« ist im erzählenden Zusammenhang natürlich und bewahrt die schnelle Bewegung; die Richtung nach draußen wird gesondert durch »hinaus« wiedergegeben.
- source_word: אֶל הָ/אִישׁ
  choice: zu dem Mann
  rationale: אֶל bezeichnet die Bewegung auf eine Person zu. Der generische Ausdruck »der Mann« bleibt erhalten, statt ihn erklärend als Abrahams Diener zu benennen.
- source_word: הַ/חוּצָ/ה
  choice: hinaus
  rationale: Die Richtungsform bedeutet »nach draußen« bzw. »hinaus« und wird als deutsches Richtungsadverb zu »lief« gestellt.
- source_word: אֶל הָ/עָיִן
  choice: an der Quelle
  rationale: עַיִן bezeichnet hier eine natürliche Quelle und wird von בְּאֵר »Brunnen« unterschieden. Im Zusammenhang beschreibt die Wendung natürlich den Standort des Mannes; die formal mögliche Lesart als weiteres Bewegungsziel wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die knappe Formulierung »namens Laban« vermeidet eine unnötig schwerfällige Nachbildung der hebräischen Namensformel. »Quelle« wahrt die lexikalische Unterscheidung gegenüber »Brunnen«.
