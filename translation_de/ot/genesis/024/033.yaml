base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: de
  text: 'Da wurde ihm Essen vorgesetzt. Doch er sagte: »Ich werde nicht essen, bevor ich gesagt habe, was ich zu sagen habe.« Darauf sagte er: »Sprich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: Da wurde ihm Essen vorgesetzt
  rationale: Das Verb שׂים bedeutet »setzen, stellen, legen«. Da das Subjekt nicht ausdrücklich genannt und für die Aussage unerheblich ist, gibt das unpersönliche Passiv den Vorgang im Deutschen natürlich wieder. לְפָנָיו לֶאֱכֹל wird idiomatisch durch »ihm Essen« ausgedrückt; der Zweck des Vorsetzens ist dabei eindeutig.
- source_word: לֹא אֹכַל
  choice: Ich werde nicht essen
  rationale: Das Imperfekt drückt hier den festen Entschluss des Knechtes aus. Das Futur mit »werde« bewahrt diese Bestimmtheit.
- source_word: עַד אִם
  choice: bevor
  rationale: Die Verbindung markiert die Handlung, die zuerst abgeschlossen sein muss. Nach einem verneinten Hauptsatz ist »nicht … bevor« im modernen Deutsch idiomatisch und entspricht sinngemäß »nicht … bis«.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: ich gesagt habe, was ich zu sagen habe
  rationale: Wörtlich steht »ich meine Worte geredet habe«. Die gewählte deutsche Wendung gibt den Sinn — sein Anliegen beziehungsweise seine Botschaft vorzutragen — natürlich wieder, ohne zusätzlichen Inhalt einzuführen.
- source_word: דַּבֵּר
  choice: Sprich!
  rationale: Der knappe Imperativ entspricht Form und Nachdruck des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt; die hebräische Wendung דִּבַּרְתִּי דְּבָרָי wird idiomatisch statt künstlich wörtlich wiedergegeben.
