  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וְ/הָיָ֤ה הָֽ/עַלְמָה֙ הַ/יֹּצֵ֣את לִ/שְׁאֹ֔ב וְ/אָמַרְתִּ֣י אֵלֶ֔י/הָ הַשְׁקִֽי/נִי נָ֥א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: de
  text: 'Sieh, ich stehe an der Wasserquelle. Und so soll es sein: Die junge Frau[a], die herauskommt, um Wasser zu schöpfen, und zu der ich sage: »Lass mich bitte ein wenig Wasser aus deinem Krug trinken«, [b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine junge Frau im heiratsfähigen Alter; es bedeutet nicht schon für sich allein ausdrücklich »Jungfrau«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gib mir bitte ein wenig Wasser aus deinem Krug zu trinken.«'
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel vergegenwärtigt die Szene. „Sieh“ bewahrt diese Unmittelbarkeit in würdigem, verständlichem Deutsch.
- source_word: אָנֹכִי נִצָּב
  choice: ich stehe hier
  rationale: Das selbstständige Pronomen und das Partizip bezeichnen die gegenwärtige Position des Sprechers. „Hier“ macht die deiktische Situation natürlich deutlich, ohne eine unangebrachte emphatische Selbstbetonung einzuführen.
- source_word: עַל עֵין הַמָּיִם
  choice: an der Wasserquelle
  rationale: עֵין bezeichnet hier eine Quelle beziehungsweise einen natürlichen Wasseraustritt, nicht bloß allgemein einen Brunnen.
- source_word: וְהָיָה
  choice: Und so soll es sein
  rationale: Die Form leitet im Zusammenhang des Gebets das erbetene Zeichen ein. Die deutsche Fassung erhält den prospektiven und leicht volitiven Sinn.
- source_word: הָעַלְמָה
  choice: die junge Frau
  rationale: עַלְמָה bezeichnet eine junge Frau im heiratsfähigen Alter, ohne für sich allein ausdrücklich Jungfräulichkeit festzustellen.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: die herauskommt, um Wasser zu schöpfen
  rationale: Das Partizip beschreibt die erwartete Frau; der Infinitiv nennt den Zweck ihres Herauskommens. „Wasser“ wird im Deutschen zur natürlichen Verdeutlichung ergänzt.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: und zu der ich sage
  rationale: Die relative Konstruktion bindet die Aussage im Deutschen flüssig an „die junge Frau“ an und bewahrt die Abfolge des hebräischen Satzes.
- source_word: הַשְׁקִינִי נָא
  choice: Lass mich bitte … trinken
  rationale: Der Hifil von שׁקה bedeutet, jemandem zu trinken zu geben. Diese Formulierung gibt die Bitte im modernen Deutsch natürlich wieder; נָא wird mit „bitte“ ausgedrückt.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: ein wenig Wasser aus deinem Krug
  rationale: Die Formulierung bildet Menge, Stoff und Herkunft des Wassers schlicht und genau ab.
theological_decisions:
- issue: Bedeutung von עַלְמָה
  choice: junge Frau
  alternative: junge Frau im heiratsfähigen Alter; traditionell auch „Jungfrau“ oder „Mädchen“
  rationale: Der hebräische Ausdruck bezeichnet hier eine junge Frau, legt aber für sich genommen ihren sexuellen Status nicht ausdrücklich fest. Die Übersetzung vermeidet daher, eine über den Wortlaut hinausgehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt am Versende bewusst offen und endet mit einem Komma, da die Bedingung in Vers 44 fortgesetzt wird. „Wasserquelle“ erhält das konkrete Bild des hebräischen עֵין; „Brunnen“ wurde deshalb vermieden.
