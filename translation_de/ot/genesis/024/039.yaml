  source_fidelity: 'Die Übersetzung gibt Satzbau und die wesentlichen Bedeutungen zutreffend wieder: Der Knecht berichtet, was er zu Abraham, seinem menschlichen Herrn, sagte. Die Verbindung von הָלַךְ mit אַחֲרַי ist idiomatisch korrekt mit „folgen“ wiedergegeben. Das deutsche Modalverb „will“ verengt jedoch die offene Zukunftsaussage des hebräischen Imperfekts auf eine mögliche mangelnde Bereitschaft bzw. Verweigerung.'
