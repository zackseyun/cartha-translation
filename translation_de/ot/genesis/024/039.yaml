  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: de
  text: 'Da sagte ich zu meinem Herrn: »Vielleicht wird die Frau mir nicht folgen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Wayyiqtol führt die Erzählung in der Vergangenheit weiter; »da« gibt die zeitlich-fortschreitende Verknüpfung im Deutschen natürlich wieder.
- source_word: אֶל אֲדֹנִי
  choice: zu meinem Herrn
  rationale: אָדוֹן mit Suffix bezeichnet hier Abraham als den menschlichen Herrn des Knechtes. »Herr« wahrt die damalige soziale Beziehung und ist im Kontext nicht als Gottesbezeichnung missverständlich.
- source_word: אֻלַי
  choice: Vielleicht
  rationale: Die Partikel drückt eine Möglichkeit beziehungsweise Unsicherheit aus; »vielleicht« ist gegenwärtiges, angemessen würdevolles Deutsch.
- source_word: לֹא תֵלֵךְ ... אַחֲרָי
  choice: will ... mir nicht folgen
  rationale: הלך mit אַחֲרֵי bedeutet wörtlich »hinter jemandem hergehen« und idiomatisch »jemandem folgen«. Die Konstruktion mit »will« lässt offen, ob die erwartete Nichtteilnahme auf mangelnder Bereitschaft beruht, wie es der Kontext nahelegt.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Das Substantiv bezeichnet schlicht »die Frau«; die kontextuelle Rolle als mögliche Braut wird nicht in den Wortlaut eingetragen.
