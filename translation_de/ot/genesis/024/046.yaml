base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: de
  text: 'Sie nahm rasch ihren Krug von ihrer Schulter herunter[a] und sagte: »Trink! Auch deinen Kamelen werde ich Wasser geben.« Da trank ich, und sie gab auch den Kamelen Wasser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von auf ihr«. Der Körperteil wird hier nicht ausdrücklich genannt; nach dem Zusammenhang trug sie den Krug wohl auf der Schulter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Sie nahm schnell
  rationale: מהר bezeichnet rasches, unverzügliches Handeln. Die adverbiale Wiedergabe mit dem folgenden Verb ist im Deutschen natürlich und bewahrt den erzählerischen Nachdruck.
- source_word: וַתּוֹרֶד כַּדָּהּ
  choice: nahm ... ihren Krug ... herab / nahm ihren Krug von ...
  rationale: Das Hifil von ירד bedeutet hier, etwas herunterzubringen. In Verbindung mit dem Krug ist »nahm ... von der Schulter« natürlicher als das technischere »senkte ... herab«.
- source_word: מֵעָלֶיהָ
  choice: von der Schulter[a]
  rationale: Wörtlich steht »von über/auf ihr«; der Körperteil wird nicht genannt. Aus dem Kontext (vgl. Gen 24,15.18) ist die Schulter sehr wahrscheinlich, weshalb sie im Haupttext zur Verständlichkeit genannt und die formale Unbestimmtheit in der Fußnote bewahrt wird.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: Auch deinen Kamelen werde ich Wasser geben
  rationale: Das Hifil von שׁקה bedeutet »trinken lassen, zu trinken geben«. »Wasser geben« ist klares modernes Deutsch und gibt die Tätigkeit präzise wieder.
- source_word: וָאֵשְׁתְּ
  choice: Da trank ich
  rationale: Die Erzählform führt die Handlung als unmittelbare Folge ihrer Aufforderung weiter; »Da« bildet diesen Zusammenhang knapp und natürlich ab.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: und sie gab auch den Kamelen Wasser
  rationale: Die Form von שׁקה wird parallel zur direkten Rede wiedergegeben und bewahrt das wiederholte »auch« (גּם).
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede und die Wiederholung von »auch« bleiben erhalten; die im Hebräischen nicht ausdrücklich genannte Schulter wird transparent als kontextuelle Präzisierung gekennzeichnet.
