base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: de
  text: Als die Kamele zu Ende getrunken hatten, nahm der Mann einen goldenen Ring[a], der einen Beka[b] wog, und zwei Armreifen für ihre Handgelenke, die zusammen zehn Schekel Gold wogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „einen goldenen Nasenring“ beziehungsweise „Ohrring“. Das hebräische Wort kann einen Ring bezeichnen, der in der Nase oder am Ohr getragen wird.'
    reason: lexical_alternative
  - marker: b
    text: Ein Beka war eine Gewichtseinheit von einem halben Schekel.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Als die Kamele ausgetrunken hatten
  rationale: Die Konstruktion bezeichnet den Zeitpunkt der folgenden Handlung; „ausgetrunken hatten“ gibt den Abschluss des Trinkens natürlich und präzise wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der hebräische Text bezeichnet ihn hier ausdrücklich als „den Mann“, nicht als „den Diener“; die Übersetzung bewahrt diese Benennung.
- source_word: נֶזֶם זָהָב
  choice: einen goldenen Ring
  rationale: נֶזֶם kann einen Nasen- oder Ohrring bezeichnen. Das allgemeinere „Ring“ erhält die lexikalische Offenheit; die möglichen Trageorte werden in der Fußnote genannt.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: der einen Beka wog
  rationale: Beka wird als antike Gewichtseinheit beibehalten; eine Fußnote erklärt sein Verhältnis zum Schekel.
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: und zwei Armreifen für ihre Handgelenke
  rationale: „Zwei“ entspricht der ausdrücklichen Zahl; „Armreifen“ ist im Deutschen die natürliche Bezeichnung für diesen Schmuck. „Für ihre Handgelenke“ verdeutlicht idiomatisch den mit „an ihren Händen“ bezeichneten Trageort.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: die zusammen zehn Schekel Gold wogen
  rationale: Die Gewichtsangabe bezieht sich auf beide Armreifen gemeinsam. „Schekel“ ist die im Hebräischen sinngemäß vorausgesetzte Gewichtseinheit und wird zur Verständlichkeit ergänzt.
