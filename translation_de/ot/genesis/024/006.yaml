  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו אַבְרָהָ֑ם הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תָּשִׁ֥יב אֶת בְּנִ֖/י שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/006.yaml
  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: de
  text: 'Abraham sagte zu ihm: „Hüte dich davor, meinen Sohn dorthin zurückzubringen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: sagte zu ihm
  rationale: Die Erzählform von אמר wird im Deutschen natürlich mit dem Präteritum wiedergegeben; אֵלָיו bezeichnet den Adressaten.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Der Nifal-Imperativ mit לְךָ formuliert eine eindringliche persönliche Warnung. „Hüte dich davor“ ist idiomatisch, würdevoll und leitet den folgenden Inhalt natürlich ein.
- source_word: פֶּן
  choice: davor, … zu
  rationale: פֶּן führt eine negative Warnung ein. Die deutsche Konstruktion „Hüte dich davor, … zu“ gibt diese Funktion ohne das altertümliche „damit nicht“ oder „auf dass nicht“ wieder.
- source_word: תָּשִׁיב
  choice: zurückzubringen
  rationale: 'Der Hifil von שוב ist kausativ: jemanden zurückkehren lassen beziehungsweise zurückbringen. „Zurückzubringen“ bewahrt diese Kausativität und lässt offen, ob der Diener den Sohn begleitet oder anderweitig dorthin gelangen lässt.'
- source_word: אֶת־בְּנִי
  choice: meinen Sohn
  rationale: Direktes Objekt mit Possessivsuffix der ersten Person Singular.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das Richtungsadverb bezeichnet eine Bewegung zu dem bereits erwähnten Ort; „dorthin“ bildet diese direktionale Bedeutung präzise ab.
