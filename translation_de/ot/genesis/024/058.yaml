base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: de
  text: 'Da riefen sie Rebekka und fragten sie: „Willst du mit diesem Mann gehen?“ Sie antwortete: „Ich werde gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: Da riefen sie Rebekka
  rationale: קרא mit ל bezeichnet hier das Herbeirufen einer Person. „Riefen“ gibt dies natürlich und ohne die stärkere amtliche Färbung von „vorladen“ wieder. Der Name wird in der im Deutschen üblichen biblischen Form „Rebekka“ wiedergegeben.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: und fragten sie
  rationale: Wörtlich steht „und sagten zu ihr“. Da unmittelbar eine direkte Frage folgt, ist „fragten sie“ im modernen Deutschen die natürliche und inhaltlich genaue Wiedergabe.
- source_word: הֲתֵלְכִי
  choice: Willst du … gehen?
  rationale: Die Fragepartikel הֲ kennzeichnet die Entscheidungsfrage; הלך bedeutet hier schlicht „gehen“. Im Deutschen bringt „Willst du … gehen?“ die an Rebekka gerichtete persönliche Entscheidung angemessen zum Ausdruck, ohne „bist du bereit“ ausdrücklich hinzuzufügen.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: mit diesem Mann
  rationale: אִישׁ bedeutet „Mann“. Obwohl Abraham Abrahams Diener gemeint ist, bezeichnet der hebräische Text ihn hier nicht als Diener; diese Formulierung bleibt daher erhalten.
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: 'Sie antwortete: „Ich werde gehen.“'
  rationale: וַתֹּאמֶר heißt formal „und sie sagte“; nach einer Frage ist „sie antwortete“ im Deutschen idiomatisch. אֵלֵךְ ist eine entschiedene Aussage in der ersten Person und wird direkt mit „Ich werde gehen“ wiedergegeben.
