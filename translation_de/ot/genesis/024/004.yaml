  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: de
  text: sondern du sollst in mein Land und zu meiner Verwandtschaft[a] gehen und für meinen Sohn Isaak eine Frau nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu meinem Geburtsort“. Das hebräische Wort kann sowohl die Herkunft beziehungsweise den Geburtsort als auch den Verwandtschaftsverband bezeichnen. Der Zusammenhang spricht hier eher für die Verwandtschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sondern
  rationale: Die Partikel steht hier im Gegensatz zum Verbot aus Vers 3. Nach der verneinten Alternative gibt „sondern“ diesen adversativen Anschluss im Deutschen natürlich wieder.
- source_word: אֶל אַרְצִי
  choice: in mein Land
  rationale: אֶרֶץ bezeichnet hier Abrahams Herkunftsland. „Land“ bewahrt den geografischen Sinn, ohne einen modernen Nationalstaat anzudeuten.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: und zu meiner Verwandtschaft
  rationale: מוֹלֶדֶת kann die Herkunft beziehungsweise den Geburtsort oder die Sippe bezeichnen. Da der Knecht aus diesem Umfeld eine Frau holen soll, ist hier der Verwandtschaftsverband wahrscheinlich gemeint; die räumliche Alternative bleibt in der Fußnote erhalten.
- source_word: תֵּלֵךְ
  choice: du sollst … gehen
  rationale: Das Imperfekt hat im Schwurauftrag verpflichtende beziehungsweise anweisende Kraft, die „sollst“ angemessen ausdrückt.
- source_word: וְלָקַחְתָּ
  choice: und dort … eine Frau nehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“ und bezeichnet in diesem Heiratszusammenhang das Auswählen beziehungsweise Holen einer Ehefrau. „dort“ macht im Deutschen den örtlichen Bezug idiomatisch deutlich, ohne eine neue sachliche Aussage einzuführen.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Mit „für meinen Sohn … eine Frau nehmen“ ist der Heiratszweck im Deutschen eindeutig.
- source_word: לִבְנִי לְיִצְחָק
  choice: für meinen Sohn Isaak
  rationale: Die wiederholte Präposition kennzeichnet Isaak als nähere Bestimmung zu „meinem Sohn“. Die einfache deutsche Apposition ist natürlich und inhaltlich genau.
