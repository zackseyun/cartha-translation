base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: de
  text: 'und die zu mir sagt: »Trink auch du, und auch für deine Kamele will ich Wasser schöpfen«, dann ist sie die Frau, die Jahwe für den Sohn meines Herrn bestimmt hat[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ausgewählt hat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: und die zu mir sagt
  rationale: Das Qal-Perfekt steht innerhalb der wiedergegebenen Bedingung beziehungsweise des erbetenen Zeichens. Das deutsche Präsens gibt diesen Zusammenhang natürlich wieder; das Relativpronomen »die« knüpft an die im vorausgehenden Vers genannte junge Frau an.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Trink auch du
  rationale: Die Wortstellung bewahrt den Nachdruck von גַּם zusammen mit dem selbstständigen Pronomen אַתָּה und gibt den Imperativ direkt wieder.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: und auch für deine Kamele will ich Wasser schöpfen
  rationale: שׁאב bedeutet »schöpfen«; »Wasser« wird dem Kontext entsprechend ergänzt. »will ich« gibt die in אֶשְׁאָב ausgedrückte Bereitschaft in natürlichem Deutsch wieder, ohne einen bloßen Zukunftsablauf zu erzwingen.
- source_word: הִוא הָאִשָּׁה
  choice: dann ist sie die Frau
  rationale: Die hebräische Nominalklausel ist eine Identifikationsaussage. »Dann« verdeutlicht den Bedingungszusammenhang mit dem vorausgehenden erbetenen Zeichen, ohne aus dem Satz ausdrücklich einen Jussiv zu machen.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: die … bestimmt hat
  rationale: Der Hifil von יכח kann hier Gottes Entscheidung, Bestimmung oder Erweis der ausgewählten Frau bezeichnen. »bestimmt hat« ist im Kontext prägnant und idiomatisch; die Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: לְבֶן אֲדֹנִי
  choice: für den Sohn meines Herrn
  rationale: Die Formulierung bildet die durch לְ bezeichnete Zuordnung ab. »Herr« gibt אֲדֹנִי im Verhältnis des Dieners zu Abraham würdig und verständlich wieder.
theological_decisions:
- issue: Aussageweise von הִוא הָאִשָּׁה im Gebets- und Zeichenkontext
  choice: dann ist sie die Frau
  alternative: dann soll sie die Frau sein
  rationale: Der Kontext hat Gebetscharakter, doch die hebräische Nominalklausel selbst ist formal eine Identifikationsaussage und enthält keine ausdrückliche Jussivform. Die gewählte Fassung bewahrt diese Form, während »dann« ihre Funktion im erbetenen Zeichen erkennen lässt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration wahrt die Unterscheidung zwischen Eigenname und Herrschaftstitel.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird idiomatisch formuliert; die Struktur des hebräischen Bedingungs- und Identifikationszusammenhangs bleibt erkennbar.
