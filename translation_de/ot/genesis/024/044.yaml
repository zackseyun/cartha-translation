    rationale: Diese Wendung ist im Deutschen syntaktisch und semantisch missverständlich und legt eine Bedeutung von »als richtig erweisen« nahe, die in diesem Kontext nicht als gleichwertige Übersetzungsalternative zu Gottes Bestimmung/Einsetzung formuliert werden sollte. Zudem steht der Anker am Satzende statt unmittelbar bei dem erläuterten Verb.
