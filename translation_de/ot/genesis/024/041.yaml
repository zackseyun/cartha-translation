  variant: modern standard German
source:
  edition: WLC
  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: de
  text: Dann bist du von meinem Eid[a] entbunden, wenn du zu meiner Verwandtschaft kommst; und wenn sie sie dir nicht geben, bist du von meinem Eid entbunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von meinem Fluch“; das hebräische Wort kann einen Eid mit der darin eingeschlossenen Fluchandrohung oder Sanktion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: bist du … entbunden
  rationale: Beide Formen von נקה bezeichnen hier die Befreiung von der durch den Eid auferlegten Verpflichtung, nicht allgemein moralische Unschuld. Die einheitliche Wiedergabe wahrt die Parallelität.
- source_word: מֵאָלָתִי
  choice: von meinem Eid
  rationale: אָלָה bezeichnet einen verpflichtenden Eid, der eine Fluchandrohung oder Sanktion einschließen kann. Im Erzählzusammenhang steht die eidliche Verpflichtung des Dieners im Vordergrund.
- source_word: כִּי
  choice: wenn
  rationale: „Wenn“ bewahrt den hier möglichen zeitlich-bedingenden Sinn, ohne ihn einseitig als rein zeitlich oder rein hypothetisch festzulegen.
- source_word: מִשְׁפַּחְתִּי
  choice: meine Verwandtschaft
  rationale: מִשְׁפָּחָה meint hier den weiteren Familienverband. „Verwandtschaft“ ist im modernen Deutsch natürlich und weiter gefasst als die Kernfamilie.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: und wenn sie sie dir nicht geben
  rationale: Das feminine Objekt ist im Hebräischen unausgesprochen, ergibt sich aber aus dem Zusammenhang. Im Deutschen wird es durch das erste „sie“ als Pronomen ergänzt; das zweite „sie“ bezeichnet die Angehörigen.
theological_decisions:
- issue: Wiedergabe von אָלָה im Kontext der eidlichen Verpflichtung
  choice: Eid
  alternative: Fluch / Flucheid
  rationale: Der Begriff kann die mit einem Eid verbundene Fluchfolge einschließen. Hier geht es vorrangig darum, ob der Diener von seiner beschworenen Verpflichtung entbunden ist; die zusätzliche Bedeutungsnuance wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entbunden“ gibt den rechtlich-verpflichtenden Zusammenhang präzise und verständlich wieder; „Verwandtschaft“ vermeidet das im heutigen Deutsch teils altertümlich oder sozial markiert wirkende „Sippe“.
