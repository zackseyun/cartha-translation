  text: וַֽ/יְשַׁלְּח֛וּ אֶת רִבְקָ֥ה אֲחֹתָ֖/ם וְ/אֶת מֵנִקְתָּ֑/הּ וְ/אֶת עֶ֥בֶד אַבְרָהָ֖ם וְ/אֶת אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: de
  text: Da ließen sie ihre Schwester Rebekka und ihre Amme sowie Abrahams Diener und seine Männer ziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: ließen … ziehen
  rationale: Die Piel-Form bezeichnet hier, dass Rebekka und ihre Begleiter zur Reise entlassen werden. „Ließen … ziehen“ gibt dies im Deutschen natürlich wieder, ohne eine Vertreibung anzudeuten.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: אֲחֹתָם
  choice: ihre Schwester
  rationale: 'אָחוֹת bedeutet hier im unmittelbaren Familienzusammenhang konkret „Schwester“; das Suffix ist pluralisch: „ihre“.'
- source_word: מֵנִקְתָּהּ
  choice: ihre Amme
  rationale: Das Partizip von ינק bezeichnet eine Frau, die ein Kind stillt. „Amme“ ist im Deutschen präzise und im erzählerischen Zusammenhang verständlich.
- source_word: עֶבֶד אַבְרָהָם
  choice: Abrahams Diener
  rationale: Die Statusbezeichnung עֶבֶד kann auch „Sklave“ bedeuten; hier steht jedoch seine Aufgabe als bevollmächtigter Diener Abrahams im Vordergrund. Die deutsche Genitivkonstruktion bildet den hebräischen Status constructus natürlich ab.
- source_word: אֲנָשָׁיו
  choice: seine Männer
  rationale: אֲנָשִׁים bedeutet wörtlich „Männer“. Das Suffix bezieht sich am nächsten und sachlich passend auf Abrahams Diener; ihre genauere Funktion wird nicht festgelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. „Amme“ bewahrt den spezifischen Sinn des hebräischen Ausdrucks, sodass keine erläuternde Fußnote nötig ist. „Sowie“ macht die Aufzählung übersichtlich, ohne die gleichrangigen Reisegefährten inhaltlich umzudeuten.
