  source_fidelity: 'Der Entwurf gibt die hebräische Aussage vollständig und präzise wieder: Der menschliche Dienstherr verpflichtet den Sprecher zum Eid; das Verbot betrifft die Wahl einer Ehefrau für den Sohn aus den Töchtern der Kanaaniter; und der ausdrücklich landbezogene Relativsatz bleibt erhalten. Die kollektive singularische Form הַכְּנַעֲנִי wird angemessen pluralisch wiedergegeben.'
