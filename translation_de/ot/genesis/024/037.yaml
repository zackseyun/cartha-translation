base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: de
  text: 'Mein Herr ließ mich schwören: »Du sollst für meinen Sohn keine Frau von den Töchtern der Kanaaniter nehmen, in deren Land ich wohne.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen im Singular: „des Kanaaniters, in dessen Land ich wohne“. „Der Kanaaniter“ ist hier eine Sammelbezeichnung. Sinngemäß kann die Wendung auch heißen: „unter denen ich wohne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: ließ mich schwören
  rationale: Der Hifil von שׁבע bedeutet hier, jemanden schwören zu lassen bzw. unter Eid zu stellen. „Ließ mich schwören“ ist im modernen Deutsch natürlich und bewahrt den verpflichtenden Charakter.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Gemeint ist der menschliche Dienstherr des Sprechers, Abraham. „Mein Herr“ entspricht der Erzählperspektive und ist im Deutschen verständlich, ohne einen Gottesnamen einzutragen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die einleitende Infinitivform wird im Deutschen idiomatisch durch einen Doppelpunkt vor der direkten Rede wiedergegeben; ein zusätzliches „indem er sagte“ wäre schwerfällig.
- source_word: לֹא תִקַּח
  choice: Du sollst ... keine ... nehmen
  rationale: Die Form hat im Kontext des Eides verbietende und verpflichtende Kraft. „Du sollst … keine … nehmen“ wahrt den feierlichen Auftrag.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Im Zusammenhang mit der Brautsuche bezeichnet אִשָּׁה eine Frau als Ehefrau; die deutsche Wendung „eine Frau für meinen Sohn nehmen“ macht den Heiratskontext deutlich.
- source_word: לִבְנִי
  choice: für meinen Sohn
  rationale: Dies gibt den hebräischen Wortlaut wieder, ohne den im Kontext bekannten Namen Isaak ausdrücklich hinzuzufügen.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: von den Töchtern der Kanaaniter
  rationale: Die Wiedergabe erhält die familiär-ethnische Ausdrucksweise. Der hebräische Singular „der Kanaaniter“ ist kollektiv; im Deutschen ist der Plural „der Kanaaniter“ natürlich.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: in deren Land ich wohne
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf das Land. Das singularische Kollektiv des Hebräischen wird im Deutschen passend pluralisch aufgenommen.
