base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: de
  text: 'Und sie segneten Rebekka und sagten zu ihr: „Unsere Schwester, werde zu Tausenden von Zehntausenden[a], und deine Nachkommenschaft nehme das Tor derer in Besitz, die sie hassen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu unzählbaren Scharen“; wörtlich: „zu Tausenden von Zehntausenden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Tor war der befestigte Zugang einer Stadt und konnte sinnbildlich für ihre Stärke und Beherrschung stehen. Wörtlich lautet der hebräische Wortlaut: „das Tor derer, die ihn hassen“; das männliche Singularsuffix bezieht sich auf das Kollektivwort „Nachkommenschaft“.'
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: sie segneten
  rationale: Das Piel von ברך bezeichnet hier das Aussprechen eines Segens über Rebekka; die direkte Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: רִבְקָה
  choice: Rebekka
  rationale: Dies entspricht der im Deutschen etablierten biblischen Namensform.
- source_word: אֲחֹתֵנוּ
  choice: Unsere Schwester
  rationale: Die Anrede wird idiomatisch und unter Wahrung der familiären Beziehung wiedergegeben.
- source_word: הֲיִי
  choice: werde
  rationale: Der Imperativ steht in einer Segensformel und drückt einen Wunsch aus; im Deutschen trägt „werde“ diesen feierlichen Wunschcharakter.
- source_word: לְאַלְפֵי רְבָבָה
  choice: zu Tausenden von Zehntausenden
  rationale: Die Wiedergabe bewahrt das markante hebräische Zahlenbild, das eine unermesslich große Nachkommenschaft bezeichnet.
- source_word: וְיִירַשׁ
  choice: nehme ... in Besitz
  rationale: ירש bezeichnet hier nicht bloß ein Erben, sondern siegreiches Erlangen und Beherrschen; „in Besitz nehmen“ gibt dies klar wieder.
- source_word: זַרְעֵךְ
  choice: deine Nachkommenschaft
  rationale: Das deutsche Kollektivsingular bewahrt den kollektiven Charakter von זרע, ohne das heute missverständliche „Same“ zu verwenden.
- source_word: שַׁעַר
  choice: das Tor
  rationale: Das konkrete Bild bleibt erhalten; das Stadttor steht zugleich für Zugang, Stärke und Herrschaft über eine Stadt.
- source_word: שֹׂנְאָיו
  choice: die sie hassen
  rationale: Das hebräische Suffix ist grammatisch singular und bezieht sich auf den Kollektivsingular „Nachkommenschaft“. Im Deutschen wird dieser jedoch gewöhnlich mit femininem Singular wiederaufgenommen; so bleiben Zahl und kollektiver Bezug erhalten.
theological_decisions:
- issue: Kollektivsingular bei „Nachkommenschaft“ und pronominaler Rückbezug
  choice: deine Nachkommenschaft ... die sie hassen
  alternative: deine Nachkommen ... die sie hassen; dein Same ... die ihn hassen
  rationale: Der hebräische Text verwendet זרע als Kollektivsingular und nimmt ihn mit einem singularischen Suffix wieder auf. „Nachkommenschaft ... sie“ bewahrt diese Struktur in natürlichem Deutsch, ohne den Text ausdrücklich auf einen einzelnen Nachkommen oder auf eine Mehrzahl festzulegen.
- issue: Bedeutung des Tores
  choice: das Tor ... in Besitz nehmen
  alternative: über die Stadt der Feinde herrschen
  rationale: Das Bild des Tores bleibt bewusst stehen, während „in Besitz nehmen“ seine Aussage von Sieg und Kontrolle erkennen lässt, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Segensformel bleibt knapp und feierlich; das hebräische Zahlenbild und die Tormetapher werden bewahrt. Der Kollektivsingular „Nachkommenschaft“ erhält die genuine Offenheit des Ausgangstextes.
