  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: de
  text: 'Und er sagte: »Gepriesen sei Jahwe, der Gott meines Herrn Abraham, der meinem Herrn seine beständige Liebe und seine Treue nicht entzogen hat. Was mich betrifft, so hat Jahwe mich auf dem Weg zum Haus der Brüder[a] meines Herrn geführt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Brüder“; im Zusammenhang kann dies Abrahams männliche Verwandte beziehungsweise seine Familienlinie bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die deutsche Segens- und Lobpreisformel gibt den prädikativen Ausruf natürlich und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: der Gott meines Herrn Abraham
  rationale: Die hebräische Genitivverbindung bleibt transparent; אֲדֹנִי bezeichnet Abraham aus der Sicht seines Dieners.
- source_word: לֹא עָזַב
  choice: hat … nicht entzogen
  rationale: Mit מֵעִם bezeichnet das Verb hier, dass Jahwe seinem Gegenüber Liebe und Treue nicht vorenthielt oder von ihm zurückzog; die deutsche Formulierung vermeidet das unnatürliche Bild, Eigenschaften zu verlassen.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: seine beständige Liebe und seine Treue
  rationale: Das Wortpaar bezeichnet verlässliche, loyale Zuwendung; die Übersetzung bewahrt den relationalen und theologischen Gehalt, ohne ausdrücklich einen Bund vorauszusetzen.
- source_word: אָנֹכִי
  choice: Mich
  rationale: Das selbständige, vorangestellte Pronomen wird durch die Voranstellung des Objekts betont, ohne im Deutschen schwerfällig zu wirken.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: hat … auf dem Weg … geführt
  rationale: Die Wendung bezeichnet Jahwes konkrete Führung während der Reise und klingt im modernen Deutsch natürlich.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: zum Haus der Brüder meines Herrn
  rationale: בֵּית wird als Ziel der Führung verstanden; אֲחֵי bleibt im Haupttext formal als »Brüder« erhalten, kann hier aber weitere männliche Verwandtschaft bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Transliteration wahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Bedeutung des Wortpaars חֶסֶד וֶאֱמֶת
  choice: beständige Liebe und Treue
  alternative: Güte und Wahrheit
  rationale: Im Beziehungskontext hebt das Paar verlässliche, loyale Zuwendung hervor. »Wahrheit« wäre möglich, könnte jedoch fälschlich nur als sachliche Richtigkeit verstanden werden.
- issue: Bezugsweite von אֲחֵי
  choice: Brüder
  alternative: Verwandte
  rationale: Die Übersetzung bewahrt die maskuline Verwandtschaftsbezeichnung des Ausgangstextes; eine Fußnote erklärt, dass hier die männliche Verwandtschaft beziehungsweise Familienlinie gemeint sein kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede folgt dem hebräischen Lobpreischarakter. Die betonte Stellung von אָנֹכִי wird durch »Mich« am Satzanfang aufgenommen. Der Fußnotenmarker steht nach dem Satz, auf den sich die Erklärung zu »Brüder« bezieht.
