base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: de
  text: 'Als er den Nasenring und die Armreifen an den Händen seiner Schwester sah und hörte, wie seine Schwester Rebekka sagte: »So hat der Mann zu mir gesprochen«, ging er zu dem Mann. Und siehe, er stand bei den Kamelen an der Quelle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Als …
  rationale: Die narrative Formel leitet hier zusammen mit den folgenden Temporalsätzen das Ereignis ein. Im Deutschen ist die integrierte Als-Konstruktion natürlicher als ein zusätzliches »Und es geschah«.
- source_word: הַנֶּזֶם
  choice: den Nasenring
  rationale: נֶזֶם kann allgemein einen Ring bezeichnen; Genesis 24,47 bestimmt ihn in diesem Zusammenhang ausdrücklich als Schmuck für die Nase.
- source_word: הַצְּמִדִים
  choice: die Armreifen
  rationale: Das Wort bezeichnet paarweise getragenen Arm- oder Handgelenkschmuck; »Armreifen« ist im Deutschen anschaulich und idiomatisch.
- source_word: עַל יְדֵי אֲחֹתוֹ
  choice: an den Händen seiner Schwester
  rationale: Bewahrt die konkrete hebräische Ausdrucksweise, ohne die anatomische Angabe stillschweigend zu »Handgelenken« zu ändern.
- source_word: וּכְשָׁמְעוֹ אֶת דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: und hörte, wie seine Schwester Rebekka erzählte
  rationale: Gibt das Hören ihrer Worte samt der Redeeinleitung in natürlichem modernem Deutsch wieder und vermeidet die schwerfällige Doppelung »die Worte … sagen hörte«.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: So hat der Mann zu mir gesprochen
  rationale: »So« erhält die demonstrative Kraft von כֹּה; das Perfekt entspricht natürlicher deutscher Erzählrede.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: ging er zu dem Mann
  rationale: בוא mit אֶל bezeichnet hier Labans Bewegung zu dem draußen wartenden Mann; »ging« entspricht dem deutschen Erzählstandpunkt.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die hervorhebende, anschaulich präsentierende Funktion der hebräischen Partikel.
- source_word: עֹמֵד עַל הַגְּמַלִּים
  choice: er stand bei den Kamelen
  rationale: Das Partizip bezeichnet einen andauernden Zustand; עַל hat hier räumlich die Bedeutung »bei/neben«, nicht »auf«.
- source_word: עַל הָעָיִן
  choice: an der Quelle
  rationale: עַיִן bezeichnet hier eine natürliche Wasserquelle; »Quelle« ist genauer als »Brunnen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzperiode wurde beibehalten, aber durch eine natürliche deutsche Als-Konstruktion geglättet. »Und siehe« erhält bewusst die erzählerische Hervorhebung des Originals.
