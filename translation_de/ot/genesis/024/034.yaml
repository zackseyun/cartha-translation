lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Da sagte er
  rationale: Das Waw mit der narrativen Verbform führt die Handlung fort. „Da sagte er“ gibt den schlichten Erzählfluss im modernen Deutschen natürlich wieder, ohne einen stärkeren logischen Zusammenhang einzutragen.
- source_word: עֶבֶד
  choice: Diener
  rationale: עֶבֶד kann je nach sozialem Zusammenhang „Diener“ oder „Sklave“ bedeuten. Hier stellt sich der Mann als Angehöriger von Abrahams Haushalt und Beauftragter vor; „Diener“ passt zum unmittelbaren Kontext, während die mögliche rechtliche Unfreiheit in einer Fußnote erhalten bleibt.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אָנֹכִי
  choice: Ich bin
  rationale: 'Das selbstständige Pronomen dient der ausdrücklichen Selbstvorstellung. Im Deutschen ist mit dem nominalen Prädikat die Kopula erforderlich: „Ich bin Abrahams Diener.“'
