base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: de
  text: 'Da antworteten Laban und Betuël und sagten: „Die Sache ist von Jahwe ausgegangen. Wir können dir weder Böses noch Gutes sagen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wir können zu dir nicht Böses oder Gutes reden.“ Die Wendung besagt hier wohl, dass sie der von Jahwe bestimmten Sache weder widersprechen noch etwas daran ändern können.'
    reason: Erläuterung der hebräischen Redewendung und ihrer wörtlichen Form.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: antworteten ... und sagten
  rationale: Die beiden Verben der hebräischen Redeeinleitung werden beibehalten. Trotz der leichten Redundanz ist die Formulierung im gehobenen deutschen Erzählstil verständlich.
- source_word: מֵיְהוָה
  choice: von Jahwe
  rationale: Die Präposition bezeichnet den Ursprung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: יָצָא הַדָּבָר
  choice: Die Sache ist ... ausgegangen
  rationale: דָּבָר bezeichnet hier die zur Verhandlung stehende Angelegenheit. „Ist ... ausgegangen“ bildet die Herkunftsaussage von יצא angemessen und natürlich ab.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: Wir können dir ... nicht sagen
  rationale: Die deutsche Konstruktion mit „sagen“ gibt das an den Knecht gerichtete Reden idiomatisch wieder; zusammen mit „weder ... noch“ wird die Verneinung natürlich ausgedrückt.
- source_word: רַע אוֹ טוֹב
  choice: weder Böses noch Gutes
  rationale: Die Reihenfolge „Böses ... Gutes“ bleibt erhalten. Die substantivierten Adjektive bewahren die knappe, umfassende Gegenüberstellung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „weder Böses noch Gutes sagen“
  choice: Die hebräische Gegenüberstellung bleibt im Haupttext erhalten.
  alternative: „Wir können dagegen nichts einwenden oder daran ändern.“
  rationale: Die idiomatische Aussage deutet an, dass Laban und Betuël die von Jahwe ausgehende Sache weder ablehnen noch abändern können. Die bildhafte und potenziell weitere Formulierung des Ausgangstextes wird jedoch nicht stillschweigend auf eine einzige Deutung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Redeeinleitung folgt bewusst der hebräischen Erzählweise; die idiomatische Polaritätsformel wird im Haupttext knapp und verständlich bewahrt.
