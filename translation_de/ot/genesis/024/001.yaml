source:
  edition: WLC
  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: de
  text: Abraham war alt und hochbetagt[a], und Jahwe hatte Abraham in allem gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Tage gekommen“; eine hebräische Redewendung für ein weit fortgeschrittenes Alter.'
    reason: Die Fußnote macht das Bild der hebräischen Wendung בָּא בַּיָּמִים sichtbar, das in der idiomatischen Übersetzung „hochbetagt“ nicht direkt erkennbar ist.
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Das Waw eröffnet beziehungsweise verbindet den neuen Erzählabschnitt. Im Deutschen ist kein zusätzliches einleitendes „Nun“ nötig; die Verbindung wird durch den Satzbau und den Kontext hinreichend deutlich.
- source_word: זָקֵן
  choice: war alt
  rationale: Die Form bezeichnet Abrahams hohes Alter unmittelbar und lässt sich natürlich und genau mit „war alt“ wiedergeben.
- source_word: בָּא בַּ/יָּמִים
  choice: hochbetagt
  rationale: Die hebräische Wendung bedeutet wörtlich, dass jemand „in die Tage gekommen“ ist, und bezeichnet ein weit fortgeschrittenes Alter. „Hochbetagt“ gibt den idiomatischen Sinn knapp und würdig wieder.
- source_word: וַֽ/יהוָה
  choice: und Jahwe
  rationale: Das Waw verbindet die Aussage mit der vorhergehenden Beschreibung; der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben.
- source_word: בֵּרַךְ
  choice: hatte gesegnet
  rationale: Das Perfekt beschreibt hier die bereits bestehende Segnung als Hintergrund der folgenden Erzählung; das deutsche Plusquamperfekt bildet diese zeitliche Einordnung natürlich ab.
- source_word: בַּ/כֹּל
  choice: in allem
  rationale: Die Wendung bezeichnet eine umfassende Segnung. „In allem“ ist nah am Hebräischen, natürlich im Deutschen und beschränkt den Segen nicht auf materiellen Besitz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich der Gottesname יהוה. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der Segnung בַּכֹּל
  choice: in allem
  alternative: mit allem
  rationale: „In allem“ wahrt die umfassende und nicht näher eingegrenzte Aussage des Hebräischen. „Mit allem“ könnte den Sinn unnötig auf Güter oder Besitz verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Doppelbeschreibung „alt und hochbetagt“ bewahrt die hebräische Verstärkung, ohne künstlich oder altertümlich zu wirken.
