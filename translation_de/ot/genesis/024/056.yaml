  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: „Haltet mich nicht auf, denn Yahweh hat meine Reise gelingen lassen. Lasst mich ziehen, damit ich zu meinem Herrn gehen kann.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Doch er sagte zu ihnen
  rationale: Das narrative וַ kann hier aufgrund des Gegensatzes zum gewünschten Aufschub natürlich mit „Doch“ wiedergegeben werden; אֲלֵהֶם bezeichnet die Angesprochenen.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Haltet mich nicht auf
  rationale: Die mit אַל verneinte Hifil-Form von אחר fordert dazu auf, den Diener nicht zu verzögern oder zurückzuhalten. „Aufhalten“ ist im modernen Deutschen idiomatisch und wahrt beide Nuancen.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: hat meine Reise gelingen lassen
  rationale: Das Hifil von צלח drückt verursachten Erfolg aus. דֶּרֶךְ bedeutet wörtlich „Weg“, bezeichnet hier aber die unternommene Reise beziehungsweise Mission.
- source_word: שַׁלְּחוּנִי
  choice: Lasst mich ziehen
  rationale: Der Piel-Imperativ von שלח mit Suffix bittet um Freigabe zur Abreise. „Lasst mich ziehen“ ist natürlich und vermeidet den im Deutschen missverständlichen Klang von „Schickt mich weg“.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: damit ich zu meinem Herrn zurückkehren kann
  rationale: Der Kohortativ bezeichnet die beabsichtigte Folge der Freigabe. Das Ziel ist Abrahams Aufenthaltsort; „zurückkehren“ macht den im Kontext vorhandenen Rückweg natürlich deutlich. אֲדֹנִי bezeichnet den menschlichen Herrn des Dieners.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Yahweh“ transliteriert, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֲדֹנִי
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Hier ist Abraham als menschlicher Herr des Dieners gemeint. Die Kleinschreibung des Possessivpronomens und der Kontext unterscheiden die Bezeichnung vom Gottesnamen beziehungsweise einem göttlichen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich; idiomatische Formulierungen wie „aufhalten“ und „ziehen lassen“ vermitteln den hebräischen Sinn ohne konfessionelle Zusätze.
