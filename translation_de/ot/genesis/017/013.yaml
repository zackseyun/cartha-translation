  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: de
  text: Der in deinem Haus Geborene und der für dein Geld Gekaufte müssen unbedingt beschnitten werden.[a][b][c] So soll mein Bund in eurem Fleisch als ewiger Bund sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollen ganz gewiss beschnitten werden“. Im Hebräischen wird die Verbform durch einen vorangestellten Infinitiv derselben Wurzel nachdrücklich verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der in deinem Haus Geborene“ und „der für dein Geld Gekaufte“. Gemeint sind Angehörige von Abrahams Hausgemeinschaft, sowohl dort Geborene als auch durch Kauf Erworbene.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „Wer in deinem Haus geboren und wer für dein Geld gekauft wurde, muss unbedingt beschnitten werden.“'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: muss unbedingt beschnitten werden
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt die Aussage. Im Zusammenhang drückt sie nachdrückliche Verpflichtung aus; „muss unbedingt“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: יְלִיד בֵּיתְךָ
  choice: wer in deinem Haus geboren wurde
  rationale: Die Wendung bedeutet wörtlich einen im Haus Geborenen. Die Übersetzung wahrt den Personenbezug, ohne den im Zusammenhang erkennbaren sozialen Status stärker auszuformulieren, als es die Wendung selbst tut.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: wer für dein Geld gekauft wurde
  rationale: Die Konstruktion bezeichnet eine durch Kauf erworbene Person. „Für dein Geld gekauft“ ist verständlich und bewahrt den wirtschaftlichen Sinn; das hebräische כֶּסֶף kann Silber oder Geld bezeichnen.
- source_word: בְרִיתִי
  choice: mein Bund
  rationale: Dies ist die sachlich und theologisch angemessene Standardwiedergabe von בְּרִית mit Suffix der ersten Person.
- source_word: בִּבְשַׂרְכֶם
  choice: an eurem Fleisch
  rationale: Das Präfix ב kann hier lokal als „an/in“ verstanden werden. Im Deutschen bezeichnet „an eurem Fleisch“ natürlich den körperlich getragenen Beschneidungsbund, ohne die Beziehung zwischen Zeichen und Bund abzuschwächen.
- source_word: לִבְרִית עוֹלָם
  choice: ein ewiger Bund
  rationale: In der Konstruktion mit „sein/werden“ lässt sich לִבְרִית idiomatisch prädikativ wiedergeben. עוֹלָם bezeichnet hier unbegrenzte beziehungsweise dauerhafte Geltung; „ewiger Bund“ bewahrt die etablierte biblische Bundessprache.
theological_decisions:
- issue: Verhältnis des körperlichen Zeichens zum Bund
  choice: „So wird mein Bund an eurem Fleisch ein ewiger Bund sein“ hält die unmittelbare Identifikation von Bund und körperlichem Zeichen sprachlich fest.
  alternative: Man könnte das Zeichen ausdrücklich nur als Symbol oder Kennzeichen des Bundes bezeichnen.
  rationale: Der hebräische Text sagt direkt, der Bund werde am beziehungsweise im Fleisch sein. Die Übersetzung fügt keine spätere sakramentale oder rein symbolische Deutung hinzu und bewahrt so die theologische Spannung.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Wechsel von „deinem“ zu „eurem“ folgt dem hebräischen Text: Zunächst wird Abraham im Singular angesprochen, danach die gesamte betroffene Gemeinschaft im Plural. Die Wiederholung von „wer“ hält beide Personengruppen klar auseinander; die emphatische Verpflichtung bleibt erhalten.'
