  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: de
  text: 'Im Alter von acht Tagen[a] soll jede männliche Person bei euch beschnitten werden, von Generation zu Generation: sowohl wer im Haus geboren wurde als auch wer für Silber[b] von einem Fremden gekauft wurde, der nicht zu deiner Nachkommenschaft gehört.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Sohn von acht Tagen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für Geld«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »von jedem Sohn eines Fremden, der nicht von deinem Samen ist«; »Samen« bedeutet hier Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: Im Alter von acht Tagen
  rationale: Die hebräische Wendung lautet wörtlich »ein Sohn von acht Tagen« und bezeichnet ein acht Tage altes Kind. Die gewählte Formulierung gibt die verbindliche Altersangabe in natürlichem modernem Deutsch wieder.
- source_word: יִמּוֹל
  choice: soll … beschnitten werden
  rationale: Der Niphal-Imperfekt hat hier passiven Sinn und dient als verbindliche Anweisung. »Soll … beschnitten werden« wahrt sowohl die Passivform als auch den rechtlich-feierlichen Ton.
- source_word: לָכֶם כָּל זָכָר
  choice: bei euch alles Männliche
  rationale: כָּל זָכָר bezeichnet umfassend jede männliche Person; לָכֶם ordnet sie der angesprochenen Gemeinschaft zu. »Alles Männliche« ist quellennah und schließt nicht fälschlich nur leibliche Nachkommen ein.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die Wendung bezeichnet die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: יְלִיד בָּיִת
  choice: der im Haus Geborene
  rationale: Die substantivierte Formulierung bildet den hebräischen Ausdruck für eine im eigenen Haus beziehungsweise Haushalt geborene Person knapp und verständlich ab.
- source_word: וּמִקְנַת כֶּסֶף
  choice: der für Silber … Gekaufte
  rationale: מִקְנַת bezeichnet hier durch Kauf erworbenen Besitz, כֶּסֶף konkret Silber und in wirtschaftlichem Gebrauch auch Geld. »Für Silber gekauft« bewahrt das konkrete Bild des Ausgangstextes.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: von irgendeinem Fremden
  rationale: Wörtlich steht »von jedem Sohn eines Fremden«. Die idiomatische deutsche Wiedergabe »von irgendeinem Fremden« vermittelt den Sinn, ohne eine im Deutschen missverständliche Abstammungsformel in den Haupttext zu setzen.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: der nicht von deinen Nachkommen ist
  rationale: זֶרַע bedeutet wörtlich »Same« und bezeichnet hier die leibliche Nachkommenschaft. Die Formulierung hält die Abgrenzung gegenüber Abrahams Abstammungslinie fest.
theological_decisions:
- issue: Umfang des Beschneidungsgebots innerhalb von Abrahams Bundeshaushalt
  choice: Das Gebot umfasst neben der leiblichen Linie auch die im Haus Geborenen und die von Fremden Gekauften.
  alternative: Das Gebot vorwiegend oder ausschließlich auf Abrahams leibliche Nachkommen zu beschränken.
  rationale: Der hebräische Text nennt ausdrücklich Hausgeborene und Gekaufte und stellt fest, dass der betreffende Fremde nicht aus Abrahams Nachkommenschaft stammt. Die Übersetzung bewahrt diese Reichweite, ohne daraus weitergehende theologische Folgerungen abzuleiten.
- issue: Bezug des Relativsatzes אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: Der Relativsatz wird auf den unmittelbar vorausgehenden Fremden bezogen.
  alternative: Der Relativsatz könnte im weiteren Sinn die gekaufte männliche Person als nicht von Abraham abstammend kennzeichnen.
  rationale: Numerus und Genus lassen beide männlichen Singularbezüge grundsätzlich zu; die unmittelbare Stellung nach בֶּן נֵכָר und der Satzbau sprechen jedoch für den Fremden als Bezugswort. Die Fußnote macht die wörtliche Struktur sichtbar, ohne die mögliche Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-feierlichem Ton. Die substantivierten Wendungen »der im Haus Geborene« und »der … Gekaufte« halten die knappe Struktur des Hebräischen fest. »Alles Männliche« bewahrt den umfassenden Geltungsbereich und vermeidet die irreführende Einschränkung auf Söhne oder Nachkommen.
