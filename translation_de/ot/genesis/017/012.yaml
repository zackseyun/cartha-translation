review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zeitliche Vorgabe, den passiven Anweisungscharakter, die fortdauernde Geltung und die Einbeziehung Hausgeborener sowie durch Kauf Erworbener grundsätzlich zutreffend wieder. Der Ausdruck »alles Männliche« ist jedoch im heutigen Deutsch unpersönlich und weniger präzise als das hebräische כָּל־זָכָר. Zudem ist »der nicht von deinen Nachkommen ist« semantisch und idiomatisch missglückt; der hebräische Ausdruck bezeichnet die Zugehörigkeit zu Abrahams Nachkommenschaft.
  naturalness: Der Entwurf ist überwiegend verständlich, doch »alles Männliche« sowie die elliptische Reihung »der im Haus Geborene ebenso wie der ... Gekaufte« wirken steif. Eine Formulierung mit »jede männliche Person« und »sowohl ... als auch« ist modernes Standarddeutsch und wahrt den formellen Registerton.
  terminology: »beschnitten werden«, »Silber«, »im Haus geboren« und »Nachkommenschaft« sind angemessen. »Nachkommenschaft« gibt זֶרַע hier klarer wieder als die missverständliche Wendung »von deinen Nachkommen«. Die Fußnote bewahrt die wörtliche, im Deutschen sonst sperrige Formulierung »Sohn eines Fremden«.
  issues:
