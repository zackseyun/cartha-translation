    issue: »alles Männliche«
    rationale: Die substantivierte Sachbezeichnung ist im modernen Deutsch unnatürlich und kann eher eine Kategorie als die einzelnen betroffenen Personen bezeichnen. כָּל־זָכָר meint jede männliche Person innerhalb des angesprochenen Bereichs.
  - severity: high
    issue: »der nicht von deinen Nachkommen ist«
    rationale: Diese Formulierung ist im Deutschen weder idiomatisch noch inhaltlich klar. Das hebräische מִזַּרְעֲךָ bezeichnet Abstammung bzw. Zugehörigkeit zu Abrahams Nachkommenschaft; »der nicht zu deiner Nachkommenschaft gehört« gibt dies verständlich wieder.
