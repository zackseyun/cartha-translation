    issue: Elliptische Kategorienauflistung
    rationale: Die Konstruktion »der ... ebenso wie der ...« ist zwar nachvollziehbar, aber schwerfällig. »Sowohl wer ... als auch wer ...« macht den Umfang der Anweisung klar, ohne den Sinn zu verändern.
