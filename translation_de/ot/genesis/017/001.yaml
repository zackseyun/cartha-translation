language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: de
  text: 'Als Abram 99 Jahre alt war, erschien Jahwe ihm und sagte: »Ich bin Gott, der Allmächtige[a]. Lebe vor mir und sei untadelig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: El-Schaddai. Die genaue Bedeutung von Schaddai ist umstritten; traditionell wird der Titel mit »Gott, der Allmächtige« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Als Abram 99 Jahre alt war
  rationale: Die hebräische Altersangabe wird idiomatisch wiedergegeben; וַיְהִי leitet hier den zeitlichen Rahmen der Erzählung ein.
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Im narrativen Nifal bezeichnet das Verb hier das Sichtbarwerden Jahwes gegenüber Abram.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird in der im Deutschen üblichen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  rationale: Diese Wiedergabe vermittelt die traditionelle Bedeutung des Gottestitels in natürlichem Deutsch; da die genaue Bedeutung von שַׁדַּי umstritten ist, wird die hebräische Form in einer Fußnote genannt.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Lebe vor mir
  rationale: Der Hitpael-Imperativ von הלך bezeichnet hier die gesamte Lebensführung. Die Formulierung bewahrt die Vorstellung eines Lebens vor Gottes Angesicht, ohne im Deutschen unnatürlich zu klingen.
- source_word: וֶהְיֵה תָמִים
  choice: und sei untadelig
  rationale: תָמִים bezeichnet in diesem Zusammenhang Integrität und ungeteilte Lauterkeit, nicht zwingend absolute Vollkommenheit oder Sündlosigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. »Jahwe« bewahrt diesen Charakter und entspricht der üblichen modernen deutschen Umschrift.
- issue: Wiedergabe des Gottestitels אֵל שַׁדַּי
  choice: Gott, der Allmächtige
  alternative: El-Schaddai
  rationale: Die traditionelle Bedeutungswiedergabe ist für heutige Leser verständlich; die umstrittene genaue Nuance des hebräischen Titels wird durch die Fußnote offengehalten.
- issue: Bedeutungsumfang von תָמִים
  choice: untadelig
  alternative: ungeteilt; vollkommen
  rationale: »Untadelig« wahrt die ethische und bundestheologische Forderung, ohne sie ausdrücklich als metaphysische oder absolute Vollkommenheit auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede und der verpflichtende Ton des hebräischen Textes bleiben erhalten; »Lebe vor mir« gibt die hebräische Weg-Metapher sinngemäß als umfassende Lebensführung wieder.
