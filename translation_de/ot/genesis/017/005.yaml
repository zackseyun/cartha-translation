  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: de
  text: Dein Name soll nicht mehr Abram lauten, sondern Abraham; denn ich habe dich zum Vater einer Vielzahl von Völkern gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn zum Vater einer Vielzahl von Völkern habe ich dich gegeben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: soll … lauten
  rationale: Das Nifal von קרא steht hier in einer Namensformel. „Lauten“ gibt die passive Benennung im modernen Deutschen natürlich wieder, ohne den Sinn zu verändern.
- source_word: עוֹד
  choice: nicht mehr
  rationale: Zusammen mit לֹא bezeichnet עוֹד das Ende des bisherigen Zustands von diesem Zeitpunkt an.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 2. Person Singular maskulin.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וְהָיָה
  choice: sondern
  rationale: Das hebräische „und [er] soll sein“ bildet hier den Gegensatz zwischen altem und neuem Namen. „Sondern“ drückt diesen Zusammenhang im Deutschen idiomatisch aus.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Namensänderung ein.
- source_word: אַב
  choice: Vater
  rationale: Die gewöhnliche Bedeutung passt sowohl zur Erklärung des neuen Namens als auch zum Bundeskontext.
- source_word: הֲמוֹן
  choice: eine Vielzahl
  rationale: Das Wort bezeichnet Fülle oder Menge. „Eine Vielzahl“ bewahrt die nominale Aussage und klingt im Deutschen natürlich.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Im Bundeskontext von Genesis sind damit Völker beziehungsweise Nationen gemeint. „Völker“ ist hier natürlich und vermeidet die anachronistische Wiedergabe „Heiden“.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … gemacht
  rationale: Wörtlich steht „ich habe dich gegeben“. In der prädikativen Konstruktion gibt „jemanden zu etwas machen“ den Sinn idiomatisch wieder; das Perfekt bewahrt die abgeschlossene beziehungsweise deklarative Aussageform.
theological_decisions:
- issue: Abgeschlossene Aussageform der göttlichen Ernennung
  choice: ich habe dich zum Vater einer Vielzahl von Völkern gemacht
  alternative: ich werde dich zum Vater einer Vielzahl von Völkern machen
  rationale: Das hebräische Perfekt נְתַתִּיךָ wird nicht in eine Zukunftsform geglättet. So bleibt die Spannung erhalten, dass Gott die verheißene Wirklichkeit als bereits vollzogen ausspricht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformel ist knapp und verständlich gehalten; das Semikolon bewahrt den engen Begründungszusammenhang. Die ungewöhnlichere wörtliche Bedeutung von נתן wird in der Fußnote offengelegt.
