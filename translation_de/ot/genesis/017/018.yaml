  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: de
  text: 'Und Abraham sagte zu Gott: »Ach, möge Ismael vor dir[a] leben!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deiner Gegenwart“; möglicherweise auch: „unter deiner Gunst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Verbform führt die Erzählung weiter; „Und … sagte“ gibt den Anschluss schlicht und angemessen wieder.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Bei einem Verb des Sprechens bezeichnet אֶל den Adressaten. Der bestimmte Ausdruck הָאֱלֹהִים meint hier den im Kontext bekannten Gott; im Deutschen steht dafür idiomatisch „Gott“ ohne Artikel.
- source_word: לוּ
  choice: Ach, möge
  rationale: לוּ leitet hier keinen gewöhnlichen Bedingungssatz, sondern einen eindringlichen Wunsch ein. „Ach, möge“ bewahrt sowohl den Wunschcharakter als auch den emotionalen Nachdruck.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: יִחְיֶה
  choice: leben
  rationale: Im Zusammenhang mit der Wunschpartikel wird die Imperfektform durch die deutsche Wunschkonstruktion „möge … leben“ ausgedrückt.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „vor deinem Angesicht“ und kann Gegenwart, Zuwendung oder Anerkennung einschließen. „Vor dir“ hält diese Bedeutungsbreite offen.
theological_decisions:
- issue: Bedeutungsumfang von Abrahams Wunsch für Ismael vor Gott
  choice: „vor dir“
  alternative: „in deiner Gegenwart“ oder „unter deiner Gunst“
  rationale: Der hebräische Ausdruck kann ein Leben in Gottes Gegenwart und Gunst andeuten, legt den genauen theologischen Gehalt hier aber nicht ausdrücklich fest. Die knappe Wiedergabe bewahrt diese Spannung und trägt keine weiter ausgeführte Bundes- oder Segensvorstellung in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschform „Ach, möge …“ ist gehoben, aber allgemein verständlich und entspricht dem emotionalen Ton des Hebräischen. Die direkte Formulierung „vor dir“ bewahrt die bildhafte Kürze des Ausgangstextes.
