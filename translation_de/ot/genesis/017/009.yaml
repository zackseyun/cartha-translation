  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: de
  text: 'Und Gott sprach zu Abraham: »Du aber sollst meinen Bund halten, du und deine Nachkommen[a] nach dir, über alle ihre Generationen hinweg.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »dein Same«; das hebräische Wort steht in der Einzahl, wird hier aber kollektiv für die Nachkommenschaft gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Und … sprach“ gibt dies in einem würdigen deutschen Erzählstil angemessen wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Dies ist in diesem Zusammenhang die direkte und übliche Wiedergabe.
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Das vorangestellte Pronomen hebt Abraham hervor und leitet seine Verpflichtung gegenüber Gottes Bundeszusage ein. „Du aber“ bewahrt diesen Kontrast, ohne einen schärferen Gegensatz zu behaupten.
- source_word: אֶת־בְּרִיתִי
  choice: meinen Bund
  rationale: Die Form bezeichnet unmittelbar „meinen Bund“ und bewahrt den zentralen Bundesbegriff.
- source_word: תִשְׁמֹר
  choice: sollst … halten
  rationale: שׁמר bedeutet hier, den Bund zu halten beziehungsweise zu wahren. „Sollst … halten“ drückt die verbindliche Anweisung natürlich aus.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: du und deine Nachkommen
  rationale: זֶרַע ist grammatisch eine kollektive Einzahl („Same“), bezeichnet hier jedoch Abrahams Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch klar und natürlich; die wörtlichere Alternative wird in der Fußnote erhalten.
- source_word: אַחֲרֶיךָ
  choice: nach dir
  rationale: Die Wendung bezeichnet die zeitliche und genealogische Folge und lässt sich direkt mit „nach dir“ wiedergeben.
- source_word: לְדֹרֹתָם
  choice: über alle ihre Generationen hinweg
  rationale: Die Formulierung bewahrt den Bezug auf die Generationen der Nachkommen und bringt die fortdauernde Geltung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Verbindlichkeit der Bundespflicht ohne zusätzliche rechtliche oder sakramentale Deutung
  choice: Du aber sollst meinen Bund halten
  alternative: Du aber musst meinen Bund halten / Du aber sollst meinen Bund bewahren
  rationale: „Sollst … halten“ gibt die im Hebräischen ausgesprochene Verpflichtung wieder und bewahrt die Bundesterminologie, ohne eine konfessionell geprägte Zusatzbedeutung einzutragen.
- issue: Kollektive Bedeutung von זֶרַע
  choice: deine Nachkommen
  alternative: dein Same
  rationale: Der Kontext spricht von Abrahams fortdauernder Nachkommenschaft. Die moderne kollektive Wiedergabe bleibt im Text verständlich, während die formale Einzahl und das Bildwort in der Fußnote kenntlich gemacht werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die emphatische Satzstellung und die Wiederholung von „du“ bleiben erhalten; altertümliche Wörter wie „Geschlechter“ werden vermieden.
