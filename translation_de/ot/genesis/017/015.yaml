base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: de
  text: 'Dann sagte Gott zu Abraham: „Was Sarai, deine Frau, betrifft: Du sollst sie nicht Sarai nennen, denn Sarah ist ihr Name.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das waw consecutivum führt die Erzählung weiter; „Dann sagte“ gibt die zeitlich-sequenzielle Funktion in natürlichem modernem Deutsch wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Kontext bezeichnet אֱלֹהִים den einen Gott und wird daher standardgemäß im Singular wiedergegeben.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: Sarai, deine Frau
  rationale: Die Apposition identifiziert Sarai durch ihre Beziehung zu Abraham; die deutschen Namensformen unterscheiden Sarai und Sarah klar.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ שָׂרָי
  choice: Du sollst sie nicht mehr Sarai nennen
  rationale: Das Imperfekt mit לֹא hat hier direktiven Charakter. „Nicht mehr“ macht im Deutschen den durch die Umbenennung vorausgesetzten Wechsel idiomatisch deutlich; „sie … nennen“ gibt die hebräische Namensformel natürlich wieder.
- source_word: כִּי
  choice: ;
  rationale: כִּי leitet die Begründung beziehungsweise Erklärung ein. Im Deutschen trägt der Semikolonanschluss diese Beziehung natürlich, ohne die mögliche Nuance vorschnell auf „denn“ oder „sondern“ festzulegen.
- source_word: שָׂרָה שְׁמָהּ
  choice: Sarah ist ihr Name
  rationale: Die verblos formulierte Erklärung wird als nominaler Satz wiedergegeben und bewahrt die Betonung des neuen Namens, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Futur einzuführen.
theological_decisions:
- issue: Wiedergabe der Umbenennungsformel
  choice: „Du sollst sie nicht mehr Sarai nennen; Sarah ist ihr Name.“
  alternative: „Du sollst ihren Namen nicht Sarai nennen, denn Sarah ist ihr Name.“
  rationale: Die gewählte Fassung bewahrt Verbot und Namensdeklaration, klingt aber im heutigen Deutschen natürlicher. Sie fügt keine lehrmäßige Deutung hinzu; „nicht mehr“ verdeutlicht lediglich den im Kontext vollzogenen Namenswechsel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält den feierlichen Charakter der göttlichen Namensgebung, vermeidet jedoch die im Deutschen schwerfällige wörtliche Formel „ihren Namen Sarai nennen“.
