  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: de
  text: Da nahm Abraham seinen Sohn Ismael, alle, die in seinem Haus geboren waren, und alle, die er mit seinem Geld gekauft hatte[a], jeden männlichen Angehörigen von Abrahams Haushalt, und beschnitt noch an eben diesem Tag[b] das Fleisch ihrer Vorhaut, genau wie Gott zu ihm geredet hatte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alle, die mit seinem Silber erworben waren“; gemeint sind Personen, die durch Kauf in Abrahams Hausverband gekommen waren.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „an eben diesem Tag“ betont, dass Abraham das Gebot unverzüglich noch am selben Tag ausführte.
    reason: idiom_explanation
  - marker: c
    text: 'Oder: „genau wie Gott mit ihm geredet hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm Abraham
  rationale: לקח bedeutet in erzählenden Texten gewöhnlich „nehmen“. Die Form leitet Abrahams unmittelbare Ausführung des zuvor ergangenen Gebots ein.
- source_word: יְלִידֵי בֵיתוֹ
  choice: alle, die in seinem Haus geboren waren
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Hebräischen, ohne den rechtlichen oder sozialen Status dieser Hausangehörigen im Haupttext stärker festzulegen als die Formulierung selbst.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: alle, die er mit seinem Geld gekauft hatte
  rationale: Die Wendung bezeichnet Personen, die durch Kauf in Abrahams Hausverband gelangt waren. „Mit seinem Geld gekauft“ ist klar und gibt den wirtschaftlichen Sinn wieder.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: jeden männlichen Angehörigen von Abrahams Haus
  rationale: „Männlichen“ gibt זָכָר ausdrücklich wieder; „Angehörigen von Abrahams Haus“ vermeidet im Deutschen die schwerfällige Doppelung „jeden Mann unter den Männern“, ohne den männlichen Bezug zu verwischen.
- source_word: וַיָּמָל
  choice: beschnitt
  rationale: Dies ist das übliche und genaue deutsche Verb für die Durchführung der Beschneidung.
- source_word: בְּשַׂר עָרְלָתָם
  choice: das Fleisch ihrer Vorhaut
  rationale: Die konkrete körperliche Ausdrucksweise des Hebräischen und die Terminologie des umliegenden Bundesabschnitts bleiben erhalten.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: noch an eben diesem Tag
  rationale: Die idiomatische Wendung hebt hervor, dass Abraham das Gebot unverzüglich an genau diesem Tag ausführte. „Noch“ macht diese zeitliche Unmittelbarkeit im Deutschen natürlich erkennbar.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: genau wie Gott zu ihm geredet hatte
  rationale: דבר mit אֵת kann je nach Zusammenhang „zu jemandem reden“ oder „mit jemandem reden“ heißen. Der Haupttext verwendet die hier natürliche deutsche Form; die dialogische Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים
  choice: Gott
  alternative: keine sachlich passende Alternative in diesem Kontext
  rationale: In Genesis 17 bezeichnet אֱלֹהִים eindeutig den einen Gott, der mit Abraham den Bund aufrichtet.
- issue: Geschlechtsspezifische Sprache beim Hausverband
  choice: jeden männlichen Angehörigen von Abrahams Haus
  alternative: jeden Mann unter den Männern von Abrahams Haus
  rationale: Das ausdrücklich männliche זָכָר bleibt erhalten. Zugleich wird die hebräische Wendung in verständliches, nicht unnötig redundantes Deutsch übertragen.
- issue: Richtung oder Gegenseitigkeit des göttlichen Redens
  choice: wie Gott zu ihm geredet hatte
  alternative: wie Gott mit ihm geredet hatte
  rationale: Beide Nuancen sind aufgrund der Konstruktion möglich. Der Haupttext betont das an Abraham gerichtete Wort, während die Fußnote die dialogische Lesart offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem fortlaufenden hebräischen Handlungsablauf, wird aber durch natürliche deutsche Relativsätze lesbar gehalten. Konkrete Bundes- und Körperterminologie bleibt ungemildert erhalten.
