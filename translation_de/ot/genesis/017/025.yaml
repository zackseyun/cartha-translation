  text: וְ/יִשְׁמָעֵ֣אל בְּנ֔/וֹ בֶּן שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/הִ֨מֹּל֔/וֹ אֵ֖ת בְּשַׂ֥ר עָרְלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: de
  text: Und Ismael, sein Sohn, war dreizehn Jahre alt, als ihm das Fleisch seiner Vorhaut beschnitten wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Und Ismael
  rationale: Das narrative ו wird schlicht mit „Und“ wiedergegeben; der Eigenname folgt der im Deutschen üblichen Form „Ismael“.
- source_word: בְּנ֔/וֹ
  choice: sein Sohn
  rationale: Das Nomen mit Suffix bezeichnet Ismael unmittelbar als Abrahams Sohn; die Apposition ist im Deutschen klar und natürlich.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: war dreizehn Jahre alt
  rationale: Die hebräische Altersformel wird idiomatisch und bedeutungsgetreu ins Deutsche übertragen.
- source_word: בְּ/הִמֹּל/וֹ
  choice: als ihm … beschnitten wurde
  rationale: Die Präposition mit dem Infinitiv constructus hat temporale Bedeutung. Das Suffix bezieht den Vorgang auf Ismael; der deutsche Dativ „ihm“ hält ihn als betroffene Person im Blick.
- source_word: אֵת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: das Fleisch seiner Vorhaut
  rationale: Die konkrete Formulierung des Hebräischen wird bewahrt, statt den Satz lediglich zu „als er beschnitten wurde“ zu verkürzen.
theological_decisions: []
translation_notes:
