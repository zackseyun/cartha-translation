  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: de
  text: 'Da fiel Abraham auf sein Gesicht und lachte und sagte sich: »Soll einem Hundertjährigen ein Sohn geboren werden? Und soll Sara mit neunzig Jahren gebären?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... עַל־פָּנָיו
  choice: fiel ... auf sein Angesicht
  rationale: Die Verbindung bezeichnet das Niederfallen mit dem Gesicht zur Erde. Die leicht gehobene, im Deutschen geläufige biblische Wendung bewahrt Bild und Körperhaltung des Hebräischen.
- source_word: וַיִּצְחָק
  choice: lachte
  rationale: צחק bedeutet hier schlicht „lachen“. Eine Deutung als ungläubiges oder freudiges Lachen wird nicht in den Text eingetragen; zugleich bleibt die lautliche Verbindung zum Namen Isaak erkennbar.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: Er sagte in seinem Herzen
  rationale: Die konkrete hebräische Redeweise wird bewahrt und macht deutlich, dass Abraham unausgesprochen bei sich redet.
- source_word: הַלְּבֶן
  choice: Soll ... noch ein Sohn geboren werden?
  rationale: בֵּן bezeichnet ausdrücklich einen Sohn. „Noch“ gibt in natürlichem Deutsch den durch Alter und rhetorische Frage ausgedrückten Erwartungsbruch wieder, ohne die Möglichkeit zu verneinen.
- source_word: מֵאָה שָׁנָה
  choice: einem Hundertjährigen
  rationale: Die kompakte deutsche Altersbezeichnung entspricht der hebräischen Angabe „einem von hundert Jahren“ und erhält den Bezug auf Abraham.
- source_word: וְאִם
  choice: Und soll
  rationale: אם leitet hier im Zusammenhang eine zweite rhetorische Frage ein; „und“ verbindet beide parallelen Fragen natürlich.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: Sara, eine Neunzigjährige
  rationale: Wörtlich steht „eine Tochter von neunzig Jahren“, eine hebräische Altersformel. Die substantivierte deutsche Altersangabe ist prägnant und fügt keine sachliche Information hinzu.
- source_word: תֵּלֵד
  choice: gebären
  rationale: Das Qal von ילד mit Sara als Subjekt bedeutet „gebären“. Das Verb ist im modernen Standarddeutsch verständlich, präzise und stilistisch würdig.
theological_decisions:
- issue: Bedeutung von Abrahams Lachen
  choice: Das Lachen wird neutral als „lachte“ wiedergegeben.
  alternative: „lachte ungläubig“ oder „lachte vor Freude“
  rationale: Der hebräische Text benennt weder ausdrücklich Unglauben noch Freude. Die Übersetzung bewahrt diese theologische und erzählerische Spannung.
- issue: Kraft der rhetorischen Fragen
  choice: Die Fragen werden mit „soll ... noch“ formuliert.
  alternative: „Kann ...?“ oder eine als Aussage formulierte Verneinung
  rationale: Die hebräischen Fragesätze drücken Staunen über die Geburt in hohem Alter aus, ohne Gottes Zusage ausdrücklich für unmöglich zu erklären.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Auf sein Angesicht“ und „in seinem Herzen“ bewahren die anschaulichen hebräischen Wendungen; „Hundertjähriger“ und „Neunzigjährige“ sorgen für natürliche, knappe Altersangaben. Keine Fußnote ist nötig, da בֵּן im Haupttext genau als „Sohn“ wiedergegeben wird.
