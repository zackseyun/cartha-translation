  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Das verbindende ו führt die Erzählung fort; im Deutschen ist am Einzelversanfang kein ausdrückliches „Und“ nötig, da der Zusammenhang auch ohne Konjunktion natürlich weitergeführt wird.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: war 99 Jahre alt
  rationale: Die hebräische Altersangabe, wörtlich „ein Sohn von 99 Jahren“, wird idiomatisch und genau ins moderne Deutsche übertragen.
- source_word: בְּ/הִמֹּל/וֹ
  choice: als ... beschnitten wurde
  rationale: ב mit Infinitivus constructus und pronominalem Suffix bezeichnet hier den Zeitpunkt; die passive Form entspricht dem hebräischen Sinn und klingt im Deutschen natürlich.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: das Fleisch seiner Vorhaut
  rationale: Die konkrete hebräische Verbindung wird bewusst bewahrt und nicht zum allgemeineren „als er beschnitten wurde“ verkürzt.
