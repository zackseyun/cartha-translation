base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: de
  text: 'Was mich betrifft[a]: Siehe, mein Bund ist mit dir, und du wirst zum Vater einer Vielzahl von Völkern werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich – siehe, mein Bund ist mit dir.“ Das vorangestellte Pronomen und die folgende Hinweispartikel sind im Hebräischen betont.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und du sollst Vater einer Vielzahl von Völkern sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Was mich betrifft
  rationale: Das selbstständige Personalpronomen steht betont am Anfang. „Was mich betrifft“ gibt diesen Redeakzent im Deutschen natürlicher wieder als ein unmarkiertes „Ich“.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die hinweisende Partikel lenkt feierlich und nachdrücklich die Aufmerksamkeit auf die folgende Bundeserklärung. „Siehe“ bewahrt diese Funktion und den würdigen Ton.
- source_word: בְרִיתִי
  choice: mein Bund
  rationale: בְּרִית ist der maßgebliche Ausdruck für den Bund in der Abraham-Erzählung. „Bund“ ist im Deutschen sachlich genau und theologisch nicht überdeutend.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die Präposition mit Suffix bedeutet unmittelbar „mit dir“. Eine Erweiterung zu „zwischen mir und dir“ wäre kontextuell möglich, steht hier aber nicht ausdrücklich.
- source_word: וְהָיִיתָ
  choice: und du wirst … werden
  rationale: Die Verbform hat in dieser Bundeszusage zukünftige beziehungsweise resultative Bedeutung. „Wirst … werden“ bringt den Übergang in die verheißene Stellung deutlicher zum Ausdruck als das statische „wirst … sein“.
- source_word: לְאָב
  choice: zum Vater
  rationale: Die Konstruktion mit לְ bezeichnet hier das Werden zu einer bestimmten Stellung oder Rolle. „Zum Vater“ gibt dies idiomatisch und präzise wieder.
- source_word: הֲמוֹן
  choice: einer Menge
  rationale: הֲמוֹן bezeichnet eine große Menge oder Vielzahl. „Menge“ bewahrt die quantitative Aussage und den Wortbezug zur Namensdeutung im folgenden Vers.
- source_word: גּוֹיִם
  choice: von Völkern
  rationale: גּוֹיִם meint hier allgemein Völker beziehungsweise Nationen, nicht „Heiden“ in einem späteren fachsprachlichen Sinn. „Völker“ ist in diesem Abstammungszusammenhang natürlich und genau.
theological_decisions:
- issue: Bundesformulierung und Abrahams Rolle
  choice: 'Die Aussage wird als unmittelbare göttliche Bundeserklärung und Verheißung wiedergegeben: „Mein Bund ist mit dir, und du wirst zum Vater einer Menge von Völkern werden.“'
  alternative: 'Deutender wäre: „Ich schließe meinen Bund mit dir“ oder „du wirst der Stammvater vieler Völker sein“.'
  rationale: Der hebräische Text stellt das Bestehen des Bundes und die verheißene Folge nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne den Bundesschluss als Handlung hinzuzufügen oder „Vater“ auf „Stammvater“ einzuengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. „Siehe“ bleibt wegen der ausdrücklichen hebräischen Hinweisp­artikel erhalten; die übrige Syntax ist natürlich deutsch gestaltet.
