source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: de
  text: 'Dies ist mein Bund, den ihr halten sollt, zwischen mir und euch und deinen Nachkommen[a] nach dir: Jede männliche Person unter euch soll beschnitten werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort זֶרַע steht im Singular, wird aber häufig kollektiv gebraucht und kann »Nachkommenschaft« oder »Nachkommen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Dies ist mein Bund
  rationale: Die feminine Demonstrativform bezieht sich auf בְּרִית; das im Hebräischen fehlende Kopulaverb wird im Deutschen natürlich mit »ist« ergänzt. »Bund« ist die sachlich und traditionsgeschichtlich angemessene Wiedergabe.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: den ihr halten sollt
  rationale: Der Relativsatz mit Imperfekt bezeichnet die verbindliche Verpflichtung. »Halten sollt« wahrt den Bundescharakter und klingt zugleich gegenwärtig.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: zwischen mir und euch und deinen Nachkommen nach dir
  rationale: Der Wechsel vom pluralischen »euch« zum singularischen »deinen … dir« wird entsprechend dem Hebräischen bewahrt. זֶרַע ist kollektiv und wird hier natürlich mit »Nachkommen« wiedergegeben; »nach dir« bezeichnet die Generationenfolge.
- source_word: הִמּוֹל לָכֶם כָּל זָכָר
  choice: Alles unter euch, was männlich ist, soll beschnitten werden
  rationale: Der Infinitivus absolutus formuliert hier die verbindliche Bundesforderung. Die passive Wiedergabe entspricht der auf jeden männlichen Angehörigen bezogenen Aussage; »unter euch« gibt die kontextuelle Funktion von לָכֶם wieder.
theological_decisions:
- issue: Geschlechtsspezifischer Umfang des Bundesgebots
  choice: Alles unter euch, was männlich ist, soll beschnitten werden
  alternative: Ihr alle sollt beschnitten werden
  rationale: כָּל זָכָר nennt ausdrücklich das männliche Geschlecht. Die Übersetzung verallgemeinert das Gebot daher nicht auf alle Personen.
- issue: Numeruswechsel in der Bundesformulierung
  choice: euch und deinen Nachkommen nach dir
  alternative: euch und euren Nachkommen nach euch
  rationale: Der hebräische Text wechselt bewusst vom Plural in der Anrede der Gruppe zum Singular in der Anrede Abrahams. Dieser mögliche Bedeutungsakzent bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die covenantale Formulierung bleibt nah an der hebräischen Struktur; unnötig altertümliche Wendungen werden vermieden.
