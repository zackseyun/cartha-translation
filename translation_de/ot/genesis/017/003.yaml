  text: וַ/יִּפֹּ֥ל אַבְרָ֖ם עַל פָּנָ֑י/ו וַ/יְדַבֵּ֥ר אִתּ֛/וֹ אֱלֹהִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: de
  text: 'Da fiel Abram mit dem Gesicht zu Boden, und Gott sprach mit ihm:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: fiel
  rationale: Das Qal-Wayyiqtol von נפל bezeichnet eine abgeschlossene Handlung in der Erzählfolge. Zusammen mit »auf sein Angesicht« vermittelt »fiel« bereits die Niederwerfung, ohne sie erklärend auszudeuten.
- source_word: עַל פָּנָיו
  choice: auf sein Angesicht
  rationale: Die hebräische Wendung beschreibt eine körperliche Niederwerfung. Die bildhafte, würdige deutsche Formulierung bewahrt den Ausdruck des Ausgangstextes.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird nach üblicher deutscher Konvention wiedergegeben; die Umbenennung in Abraham erfolgt erst später im Kapitel.
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Piel-Wayyiqtol von דבר bedeutet hier »reden/sprechen«. »Redete« verbindet sich im Deutschen natürlich mit »mit ihm« und unterscheidet das Verb von der anschließenden Redeeinleitung לֵאמֹר.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Die Präposition אֵת mit Suffix wird formal als »mit ihm« bewahrt; dies ist im Deutschen verständlich und erhält die relationale Nuance.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der morphologisch pluralischen Form bezeichnet אֱלֹהִים hier aufgrund des singularischen Verbs und des Kontexts den einen Gott.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv לֵאמֹר führt die folgende direkte Rede ein. Das idiomatische deutsche »und sprach« bewahrt die Funktion der hebräischen Redeeinleitung, ohne die im Deutschen schwerfällige Folge »redete … und sagte«.
- source_word: וַ
  choice: Da
  rationale: Das einleitende Waw mit Wayyiqtol kennzeichnet die fortschreitende Erzählfolge. »Da« ist dafür eine natürliche, knappe deutsche Wiedergabe.
theological_decisions:
- issue: Referent und Numerus von אֱלֹהִים
  choice: Singular »Gott«
  alternative: »Götter« aufgrund der äußeren Pluralform
  rationale: Das zugehörige Verb steht im Singular, und im Zusammenhang spricht der Bundesgott zu Abram. Eine pluralische Übersetzung wäre grammatisch und kontextuell nicht begründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. »Auf sein Angesicht« ist bewusst etwas gehobener als »mit dem Gesicht zu Boden«, bleibt aber geläufig und textnah. Der Doppelungscharakter von וַיְדַבֵּר … לֵאמֹר wird durch die traditionelle, verständliche Formel »redete … und sprach« erhalten.
