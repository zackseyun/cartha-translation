id: GEN.17.21
reference: Genesis 17:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: de
  text: Doch meinen Bund werde ich mit Isaak[a] aufrichten, den Sara dir nächstes Jahr um diese Zeit gebären wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und meinen Bund werde ich mit Isaak aufrichten.“ Die hebräische Konjunktion kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang liegt jedoch ein Gegensatz zur vorausgehenden Verheißung über Ismael nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Doch
  rationale: 'Das einleitende Waw verbindet den Satz mit Vers 20 und hat im Zusammenhang eine kontrastive Funktion: Ismael wird gesegnet, doch der Bund wird mit Isaak aufgerichtet.'
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: בְּרִית bezeichnet hier den von Gott gesetzten Bund; das Suffix der ersten Person Singular wird mit „meinen“ wiedergegeben.
- source_word: אָקִים
  choice: werde ich … aufrichten
  rationale: Das Hifil von קום bedeutet im Bundeskontext „aufrichten“ beziehungsweise „fest begründen“. „Einen Bund aufrichten“ ist im Deutschen würdig und sachlich präzise.
- source_word: אֶת יִצְחָק
  choice: mit Isaak
  rationale: Obwohl אֵת formal den direkten Gegenstand markiert, verlangt die natürliche deutsche Wendung beim Bund die Präposition „mit“ und bezeichnet Isaak als Bundespartner.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: den Sara dir … gebären wird
  rationale: Der Relativsatz bestimmt Isaak als den verheißenen Sohn; „dir gebären“ bewahrt die Bedeutung von לְךָ knapp und verständlich.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: nächstes Jahr um diese Zeit
  rationale: Die Gesamtwendung bezeichnet denselben festgesetzten Zeitpunkt im folgenden Jahr. „Nächstes Jahr um diese Zeit“ ist im modernen Deutschen natürlich und gibt den Zeitbezug präzise wieder.
theological_decisions:
- issue: Bundeslinie durch Isaak im Unterschied zu Ismael
  choice: Gott wird seinen Bund mit Isaak aufrichten.
  alternative: Die vorherige Zusage an Ismael ebenfalls als Bundeszusage zu formulieren.
  rationale: Der Vers unterscheidet den Bund mit Isaak von der in Vers 20 zugesagten Segnung Ismaels, ohne daraus weitergehende theologische Folgerungen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und im Bundeskontext präzise Wendung „einen Bund aufrichten“ bleibt erhalten; die Zeitangabe wird natürlich als „nächstes Jahr um diese Zeit“ formuliert.
