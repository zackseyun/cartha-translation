  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: de
  text: Und ich werde meinen Bund aufrichten zwischen mir und dir und zwischen deiner Nachkommenschaft[a] nach dir, für alle ihre Generationen, als ewigen Bund, um dir und deiner Nachkommenschaft nach dir Gott zu sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort steht im kollektiven Singular und kann auch mit „Same“ oder „Nachkommen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß: „um dein Gott und der Gott deiner Nachkommenschaft nach dir zu sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ich werde … aufrichten
  rationale: הקים bezeichnet in Verbindung mit בְּרִית das Aufrichten, Bestätigen oder Inkraftsetzen eines Bundes. „Aufrichten“ ist im Deutschen würdig, verständlich und näher an der hebräischen Wendung als ein bloßes „aufrechterhalten“.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: Gibt das Substantiv בְּרִית samt Possessivsuffix unmittelbar wieder.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: zwischen mir und dir und
  rationale: Bewahrt die Reihung der Bundespartner weitgehend, ohne im Deutschen unnötig schwerfällig zu werden.
- source_word: זַרְעֲךָ
  choice: deiner Nachkommenschaft
  rationale: זֶרַע ist grammatisch ein kollektiver Singular. „Nachkommenschaft“ bewahrt diesen Kollektivcharakter besser als das eindeutig pluralische „Nachkommen“ und ist im heutigen Deutsch verständlicher als „Same“.
- source_word: אַחֲרֶיךָ
  choice: nach dir
  rationale: Die Wendung bezeichnet die zeitlich-genealogische Folge und wird direkt wiedergegeben.
- source_word: לְדֹרֹתָם
  choice: durch alle ihre Generationen hindurch
  rationale: Bringt die Fortdauer über die aufeinanderfolgenden Generationen der Nachkommenschaft natürlich und ausdrücklich zum Ausdruck.
- source_word: לִבְרִית עוֹלָם
  choice: als ewigen Bund
  rationale: עוֹלָם bezeichnet hier unbegrenzte beziehungsweise dauerhafte Geltung. „Ewig“ ist die geläufige, kontextgemäße Wiedergabe; „als“ bildet die prädikative לְ-Konstruktion idiomatisch ab.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: um dir … Gott zu sein
  rationale: Bewahrt die auffällige relationale Bundesformel des Hebräischen genauer als die glattere Formulierung „um dein Gott zu sein“.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: und deiner Nachkommenschaft nach dir
  rationale: Die wiederholte Verheißung wird terminologisch konsequent wiedergegeben.
theological_decisions:
- issue: Bundessprache in Bezug auf Abrahams זֶרַע
  choice: Nachkommenschaft
  alternative: Same; Nachkommen
  rationale: Der hebräische Ausdruck ist ein kollektiver Singular und kann eine Vielheit als Einheit bezeichnen. „Nachkommenschaft“ legt den Text weder ausschließlich auf einen pluralischen Sinn noch auf eine einzelne repräsentative Person fest.
- issue: Wortlaut der Bundesformel
  choice: dir … Gott zu sein
  alternative: dein Gott zu sein
  rationale: Die gewählte Form hält die relationale, feierliche Konstruktion des Hebräischen offen, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Zeitliche Tragweite von עוֹלָם
  choice: ewiger Bund
  alternative: dauerhafter Bund; immerwährender Bund
  rationale: „Ewig“ entspricht der traditionellen und im Kontext naheliegenden Bedeutung, ohne im Vers selbst philosophische Einzelheiten über die Art dieser Dauer zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Bundesklang. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch geläufige deutsche Wortstellung und die Zweckkonstruktion mit „um … zu“ verständlich gehalten.
