id: GEN.17.8
reference: Genesis 17:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: de
  text: Und ich werde dir und deinen Nachkommen nach dir das Land geben, in dem du als Fremder lebst[a] – das ganze Land Kanaan – als ewigen Besitz[b]; und ich werde ihr Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „das Land deiner Fremdlingsaufenthalte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu ewigem Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: Das Qal-Perfekt mit vorangestelltem ו steht in einer Bundeszusage und wird im Deutschen natürlich als Zukunftsversprechen wiedergegeben.
- source_word: לְךָ
  choice: dir
  rationale: Der einfache Dativ bezeichnet Abraham persönlich als Empfänger.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: und deinen Nachkommen nach dir
  rationale: זֶרַע ist ein Kollektivbegriff. „Nachkommen“ ist im heutigen Deutsch natürlich und bewahrt zusammen mit „nach dir“ den Gedanken der Generationenfolge.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: das Land, in dem du als Fremder lebst
  rationale: מְגוּרִים bezeichnet den Aufenthaltsort eines Fremdlings beziehungsweise Beisassen. Die Formulierung gibt den fremdenrechtlichen und vorläufigen Status verständlich wieder.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: das ganze Land Kanaan
  rationale: Die zweite Akkusativfügung erläutert appositionell das zuvor genannte Land; כָּל wird umfassend mit „das ganze“ wiedergegeben.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: als ewigen Besitz
  rationale: אֲחֻזָּה bezeichnet dauerhaften Grundbesitz beziehungsweise ein Besitzrecht; עוֹלָם trägt hier den Sinn bleibender, unbefristeter Dauer.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: und ich werde ihr Gott sein
  rationale: Die knappe deutsche Form bewahrt die geläufige Bundesformel und drückt eine zugesagte Beziehung aus, nicht eine Veränderung von Gottes Wesen.
theological_decisions:
- issue: Wiedergabe der Bundesformel ohne spätere dogmatische Zusätze
  choice: und ich werde ihr Gott sein
  alternative: und ich werde ihnen Gott sein
  rationale: Die gewählte Fassung ist idiomatisches Deutsch und bewahrt den Beziehungscharakter der hebräischen Bundesformel, ohne zusätzliche Lehraussagen einzutragen.
- issue: Zeitliche Tragweite von עוֹלָם
  choice: ewigen
  alternative: dauerhaften
  rationale: „Ewig“ erhält die starke, offene Dauerformulierung des Bundeswortes. Die Übersetzung legt nicht zusätzlich fest, wie diese Dauer heilsgeschichtlich zu bestimmen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am Hebräischen, wird aber durch Gedankenstriche gegliedert. „Als Fremder lebst“ vermeidet das heute ungebräuchliche „Fremdlingschaft“, während die Fußnote die formale Struktur erkennen lässt.
