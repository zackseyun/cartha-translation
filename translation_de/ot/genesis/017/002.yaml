lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: Und ich werde … schließen
  rationale: נתן bedeutet wörtlich „geben/setzen“. In Verbindung mit בְּרִית bezeichnet die Wendung hier idiomatisch das Schließen bzw. Setzen eines Bundes; „einen Bund schließen“ ist im modernen Deutschen natürlich und bewahrt den Handlungssinn.
- source_word: בְרִיתִי
  choice: meinen Bund
  rationale: „Bund“ gibt den gewichtigen Beziehungs- und Verpflichtungsbegriff בְּרִית angemessen wieder; das Suffix der 1. Person Singular wird mit „meinen“ ausgedrückt.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Direkte und natürliche Wiedergabe der wechselseitigen Beziehungsformel.
- source_word: וְאַרְבֶּה
  choice: und … zahlreich machen
  rationale: Der Hifil von רבה drückt verursachte starke Vermehrung aus. „Zahlreich machen“ ist im Deutschen hier natürlicher als das transitive „vermehren“ und lässt den Angeredeten als direktes Objekt bestehen.
- source_word: אֹתְךָ
  choice: dich
  rationale: Das hebräische Objekt steht in der 2. Person maskulin Singular und richtet die Verheißung unmittelbar an Abram; die implizierten Nachkommen werden nicht erklärend in den Haupttext eingefügt.
- source_word: בִּמְאֹד מְאֹד
  choice: überaus
  rationale: Das doppelte מְאֹד verstärkt die Aussage nachdrücklich. „Überaus“ vermittelt diese intensive Steigerung in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Bundesformel נתן + ברית
  choice: meinen Bund … schließen
  alternative: meinen Bund … geben/setzen
  rationale: Die wörtliche Bedeutung des Verbs bleibt in einer Fußnote sichtbar. Im Haupttext bezeichnet „einen Bund schließen“ den Bundesschluss idiomatisch, ohne den Bund als bloß übertragenen Gegenstand erscheinen zu lassen.
- issue: Bezug von „dich zahlreich machen“
  choice: Abram bleibt als direkt Angeredeter im Text
  alternative: deine Nachkommen zahlreich machen
  rationale: Obwohl die Verheißung sachlich seine Nachkommenschaft einschließt, steht im Hebräischen ausdrücklich „dich“. Die Übersetzung löst diese verdichtete Aussage nicht erklärend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen eng, während die Bundesformel idiomatisch deutsch wiedergegeben wird; die wörtlichere Alternative steht in der Fußnote.
