  source_fidelity: 'Die Wiedergabe von בְּרִית als „Bund“, von „zwischen mir und dir“ sowie der direkten Anrede „dich“ ist quellentreu. „Überaus zahlreich machen“ gibt die emphatische Verdopplung von מְאֹד angemessen wieder. Die Haupttextformulierung „meinen Bund … schließen“ ist jedoch keine genaue Entsprechung für נתן („geben/setzen“): Sie verschiebt den Akzent zum beiderseitigen Vertragsabschluss, während der Text Gottes „meinen Bund“ als seine Setzung/Aufrichtung formuliert.'
