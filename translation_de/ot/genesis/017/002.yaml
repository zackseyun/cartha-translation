  terminology: „Bund“ ist als zentraler Begriff beizubehalten. „Aufrichten“ ist in diesem Kontext eine etablierte, verständliche und quellennahe deutsche Wiedergabe, ohne die Fußnotenalternative „geben/setzen“ zu ersetzen.
