  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: de
  text: Und ich werde meinen Bund zwischen mir und dir aufrichten[a] und dich überaus zahlreich machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „meinen Bund zwischen mir und dir geben/setzen“.'
