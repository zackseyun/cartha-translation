  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: de
  text: An ebendiesem Tag wurden Abraham und sein Sohn Ismael beschnitten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Noch an diesem selben Tag
  rationale: Die feste Zeitangabe betont, dass die Beschneidung genau an dem zuvor genannten Tag geschah. „Noch an diesem selben Tag“ gibt diese Hervorhebung in natürlichem Deutsch wieder.
- source_word: נִמּוֹל
  choice: wurden … beschnitten
  rationale: Die passive Verbform wird beibehalten. Obwohl das hebräische Verb im Singular steht und dem zusammengesetzten Subjekt vorausgeht, verlangt das Deutsche hier den Plural.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Eingebürgerte deutsche Namensform.
- source_word: וְיִשְׁמָעֵאל
  choice: und … Ismael
  rationale: Die Konjunktion wird direkt wiedergegeben; „Ismael“ ist die eingebürgerte deutsche Namensform.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Substantiv mit Suffix bezeichnet Ismael ausdrücklich als Abrahams Sohn; die natürliche deutsche Entsprechung lautet „sein Sohn“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Zeitangabe wird deutlich, aber idiomatisch formuliert; die passive Aussage des Hebräischen bleibt erhalten.
