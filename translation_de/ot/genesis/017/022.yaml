  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: de
  text: Als er aufgehört hatte, mit ihm zu reden, stieg Gott von Abraham hinauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet das Verb „hinaufsteigen“ und schildert das Ende der Gotteserscheinung als eine Bewegung nach oben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Als er aufgehört hatte
  rationale: Die Wayyiqtol-Form von כלה bezeichnet hier den Abschluss des Redens. Der deutsche temporale Nebensatz verbindet diesen Abschluss natürlich mit der folgenden Haupthandlung.
- source_word: לְדַבֵּר
  choice: zu reden
  rationale: Der Infinitiv von דבר bildet mit כלה die Wendung „aufhören/fertig sein zu reden“. „Zu reden“ ist im Deutschen idiomatisch.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Die Präposition mit Suffix bezeichnet hier das Gegenüber im Gespräch. Das Pronomen bezieht sich im Kontext auf Abraham; die pronominale Form des Hebräischen bleibt jedoch erhalten.
- source_word: וַיַּעַל
  choice: fuhr … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Fuhr hinauf“ bewahrt die konkrete räumliche Darstellung und klingt in einer Gotteserscheinung würdig, ohne sie abstrakt als bloßes Weggehen wiederzugeben.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt steht das Verb im Singular; Syntax und Kontext verlangen die übliche singularische Wiedergabe „Gott“.
- source_word: מֵעַל
  choice: von Abraham
  rationale: מֵעַל bedeutet wörtlich „von über/oberhalb von“. In Verbindung mit dem Hinauffahren bezeichnet es den Ausgangspunkt der göttlichen Bewegung; „von Abraham“ ist natürliches Deutsch, während die räumliche Richtung bereits im Verb erhalten bleibt.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Übliche deutsche Form des Personennamens.
theological_decisions:
- issue: Räumliche beziehungsweise anthropomorphe Darstellung des Endes der Gotteserscheinung
  choice: „fuhr Gott von Abraham hinauf“
  alternative: „ging Gott von Abraham weg“ / „zog Gott sich von Abraham zurück“
  rationale: Der hebräische Text verwendet ausdrücklich das Verb für Hinaufgehen. Die Übersetzung bewahrt diese räumliche Bildsprache, ohne daraus eine Aussage über eine räumliche Begrenztheit Gottes abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gut verständlich; „fuhr … hinauf“ bewahrt die konkrete Bildsprache des Hebräischen. Das Pronomen „ihm“ erhält die Ausdrucksweise des Ausgangstextes, obwohl aus dem Zusammenhang Abraham gemeint ist.
