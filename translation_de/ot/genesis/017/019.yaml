  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: de
  text: 'Und Gott sagte: „Nein, sondern deine Frau Sara wird dir einen Sohn gebären, und du sollst ihm den Namen Isaak[a] geben. Ich werde meinen Bund mit ihm aufrichten als einen ewigen Bund für seine Nachkommen nach ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Isaak klingt im Hebräischen wie das Verb für „er lacht“ oder „er wird lachen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Nein, sondern
  rationale: Im Zusammenhang korrigiert Gott Abrahams unmittelbar vorausgehende Bitte bezüglich Ismaels. „Nein, sondern“ gibt diese berichtigende und zugleich kontrastierende Kraft natürlich wieder.
- source_word: יֹלֶדֶת
  choice: wird … gebären
  rationale: Das Partizip hat hier im Kontext der Verheißung futurische Bedeutung.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: du sollst ihm den Namen … geben
  rationale: Die deutsche Namensformel klingt natürlich und bewahrt den verpflichtenden Charakter der hebräischen Formulierung.
- source_word: יִצְחָק
  choice: Isaak
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: וַהֲקִמֹתִי
  choice: Ich werde … aufrichten
  rationale: „Einen Bund aufrichten“ bildet die Vorstellung ab, den Bund wirksam und beständig einzusetzen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die sachlich und theologisch angemessene deutsche Entsprechung, ohne den Aussageumfang einzuengen.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Die Präposition bezeichnet Isaak selbst als Bundespartner.
- source_word: לִבְרִית עוֹלָם
  choice: als einen ewigen Bund
  rationale: „Als“ gibt die Bestimmung beziehungsweise das Ergebnis der Aufrichtung wieder; „ewig“ bewahrt die zeitlich offene Dauerbedeutung von עוֹלָם.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: für seine Nachkommen nach ihm
  rationale: „Nachkommen“ gibt den kollektiven Singular זֶרַע verständlich wieder; „nach ihm“ erhält die ausdrückliche Generationenfolge.
theological_decisions:
- issue: Umfang und Fortdauer der Bundesverheißung
  choice: Der Bund wird mit Isaak aufgerichtet und gilt seinen Nachkommen nach ihm.
  alternative: Die Aussage ausschließlich national-ethnisch zu verengen oder unmittelbar durch spätere christliche Bundestheologien zu definieren.
  rationale: Der deutsche Text gibt die Aussage des hebräischen Verses direkt wieder, ohne ihren theologischen Umfang durch spätere Systeme zu erweitern oder einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nein, sondern“ markiert die kontextuelle Korrektur klar; „einen Bund aufrichten“ erhält die prägnante Bundessprache. Der Fußnotenmarker steht unmittelbar beim Namen, auf den die Wortspielerklärung Bezug nimmt.
