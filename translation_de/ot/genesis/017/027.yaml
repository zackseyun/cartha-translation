source:
  edition: WLC
  text: וְ/כָל אַנְשֵׁ֤י בֵית/וֹ֙ יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֖סֶף מֵ/אֵ֣ת בֶּן נֵכָ֑ר נִמֹּ֖לוּ אִתּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: de
  text: Und alle Männer seines Haushalts – die im Haus Geborenen und die von einem Fremden für Geld Gekauften – wurden zusammen mit ihm beschnitten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל
  choice: Und alle
  rationale: Das וְ verbindet den Vers mit dem vorhergehenden Geschehen; כָל bezeichnet die Gesamtheit.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: Männer seines Haushalts
  rationale: Die Wendung bezeichnet die männlichen Angehörigen seines Hauses beziehungsweise Haushalts. „Haushalt“ gibt den sozialen Umfang natürlicher wieder als das bloße „Haus“.
- source_word: יְלִיד בָּיִת
  choice: die im Haus Geborenen
  rationale: Die Formulierung bewahrt den Gedanken, dass diese Personen innerhalb des Haushalts geboren worden waren, ohne eine altertümliche deutsche Zusammensetzung zu verwenden.
- source_word: וּמִקְנַת כֶּסֶף
  choice: und die … für Geld Gekauften
  rationale: Die Konstruktverbindung bezeichnet durch Kauf erworbene Personen. Die Übersetzung erhält den ausdrücklich wirtschaftlichen und sozialgeschichtlichen Gehalt des Ausdrucks.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: von einem Fremden
  rationale: בֶּן נֵכָר ist eine hebräische Bezeichnung für einen Fremden beziehungsweise Außenstehenden und wird im Deutschen idiomatisch wiedergegeben.
- source_word: נִמֹּלוּ
  choice: wurden … beschnitten
  rationale: Die Nifal-Form wird hier im narrativen Zusammenhang sachgerecht als Passiv verstanden.
- source_word: אִתּוֹ
  choice: zusammen mit ihm
  rationale: Der Ausdruck bezeichnet die Zugehörigkeit zu Abraham bei der Beschneidung und wahrscheinlich zugleich deren gemeinsamen Zeitpunkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Gedankenstriche gliedern die beiden näher bestimmenden Gruppen, ohne die umfassende Aussage über alle Männer des Haushalts zu verdunkeln.
