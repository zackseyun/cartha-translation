base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: de
  text: Und ich werde dich überaus fruchtbar machen[a], und ich werde aus dir Völker machen, und Könige werden von dir abstammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sehr, sehr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Und ich werde dich … fruchtbar machen
  rationale: Der Hifil von פרה drückt aus, dass Gott Fruchtbarkeit bewirkt. „Fruchtbar machen“ gibt diesen kausativen Sinn präzise und natürlich wieder.
- source_word: בִּמְאֹד מְאֹד
  choice: überaus
  rationale: Die Verdoppelung von מְאֹד verstärkt die Zusage nachdrücklich. „Überaus“ bewahrt die starke Intensivierung in würdigem, natürlichem Deutsch; die wörtlichere Form steht in der Fußnote.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: Ich werde dich zu Völkern machen
  rationale: 'נתן mit לְ bezeichnet hier das bewirkte Ergebnis: Abraham soll zum Ursprung mehrerer Völker werden. Die Formulierung bleibt nahe an der hebräischen Konstruktion und ist im Deutschen verständlich.'
- source_word: לְגוֹיִם
  choice: Völkern
  rationale: גּוֹיִם bezeichnet hier nationale beziehungsweise ethnische Gemeinschaften, die aus Abraham hervorgehen. „Völker“ ist im Deutschen natürlicher als „Nationen“ und vermeidet die unzutreffende Einschränkung auf Nichtjuden.
- source_word: וּמְלָכִים
  choice: und Könige
  rationale: מְלָכִים bedeutet konkret „Könige“; das allgemeinere „Herrscher“ wäre weniger genau.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: werden von dir abstammen
  rationale: יצא bedeutet wörtlich „herausgehen“, bezeichnet hier jedoch genealogische Herkunft. „Von dir abstammen“ macht diesen Zusammenhang im Deutschen klar, ohne zusätzliche theologische Deutung einzutragen.
theological_decisions:
- issue: Umfang der Abraham zugesagten Nachkommenschaft
  choice: Der Vers verheißt Abraham, dass aus ihm mehrere Völker und Könige hervorgehen werden.
  alternative: Die Wendung könnte abstrakter als Einsetzung Abrahams für beziehungsweise unter Völkern verstanden werden.
  rationale: Der unmittelbare Bundeskontext handelt von Nachkommen und Abstammung. „Zu Völkern machen“ und „von dir abstammen“ geben diesen genealogischen Schwerpunkt wieder, ohne spätere theologische Systeme einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verhindert eine schwerfällige Reihung. „Überaus“ bewahrt die starke hebräische Intensivierung; „Völker“ und „abstammen“ verdeutlichen den genealogischen Zusammenhang für heutige Leser.
