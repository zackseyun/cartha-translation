  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: de
  text: 'Ein unbeschnittener Mann aber, der nicht am Fleisch seiner Vorhaut beschnitten wird: Dieser Mensch soll von seinem Volk abgeschnitten werden[a]; er hat meinen Bund gebrochen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Dieser Mensch soll von seinem Volk abgeschnitten werden.« Die Wendung bezeichnet ein schweres Bundesgericht; ob damit Ausschluss aus der Gemeinschaft, Tod oder eine andere Folge gemeint ist, wird hier nicht näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: ein unbeschnittener Mann
  rationale: עָרֵל bezeichnet einen Unbeschnittenen; זָכָר bestimmt ihn als männliche Person. „Mann“ ist im Deutschen hier natürlicher als „männliche Person“, während „unbeschnitten“ das Bundeszeichen klar benennt.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: der nicht … beschnitten wird
  rationale: Der Niphal von מול hat hier passiven Sinn. Das Präsens entspricht der allgemein formulierten Rechtsbestimmung.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: am Fleisch seiner Vorhaut
  rationale: Die konkrete anatomische Formulierung des Hebräischen bleibt erhalten. „Am“ verbindet sie im Deutschen natürlich mit dem Passiv „beschnitten wird“.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: Dieser Mensch soll … ausgerottet werden
  rationale: נֶפֶשׁ bezeichnet hier die von der Bundessanktion betroffene Person, nicht ausdrücklich einen immateriellen Seelenteil. „Ausgerottet werden“ bewahrt die Schärfe und Bildlichkeit des כרת-Idioms, ohne die genaue Art der Sanktion festzulegen.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix stimmt grammatisch mit נֶפֶשׁ überein; sachlich ist der genannte Mann gemeint. עַם wird als „Volk“ wiedergegeben und bezeichnet die Bundesgemeinschaft.
- source_word: אֶת בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die etablierte und theologisch gewichtige Entsprechung von בְּרִית im Zusammenhang von Genesis 17.
- source_word: הֵפַר
  choice: er hat … gebrochen
  rationale: הפר kann einen Bund brechen, verletzen oder zunichtemachen bezeichnen. „Gebrochen“ ist im Deutschen klar, idiomatisch und lässt die volle Bedeutungsbreite des Verbs im Kontext bestehen.
theological_decisions:
- issue: Bedeutung der Bundessanktion כרת („abschneiden/ausrotten“)
  choice: Das Idiom wird mit „soll aus seinem Volk ausgerottet werden“ wiedergegeben, ohne die Sanktion näher zu bestimmen.
  alternative: „soll aus der Bundesgemeinschaft ausgeschlossen werden“ oder „soll getötet werden“
  rationale: Der Vers selbst entscheidet nicht ausdrücklich, ob Ausschluss aus der Gemeinschaft, Tod oder ein anderes schweres Bundesgericht gemeint ist. Die Übersetzung bewahrt diese Spannung; die Fußnote weist auf die Deutungsbreite hin.
- issue: Wiedergabe von נֶפֶשׁ
  choice: „Mensch“
  alternative: „Seele“ oder „Person“
  rationale: נֶפֶשׁ bezeichnet in dieser Rechtsbestimmung den ganzen betroffenen Menschen. „Mensch“ vermeidet eine nicht vom Text geforderte Trennung von Leib und Seele und klingt zugleich würdig und natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-feierlichem Satzbau. Die konkrete Körperbezeichnung und die Schärfe der Bundessanktion bleiben erhalten; unnatürliche Hebraismen werden nur dort geglättet, wo der Sinn nicht verändert wird.
