source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: de
  text: Ihr sollt das Fleisch eurer Vorhaut beschneiden, und es soll ein Zeichen des Bundes[a] zwischen mir und euch sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Bundeszeichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Ihr sollt … beschneiden
  rationale: Das Qal Perfekt mit vorangestelltem וּ hat in dieser Bundesanweisung auffordernde bzw. zukünftige Kraft. Die aktive Wiedergabe entspricht der grammatischen Form und dem erwarteten Handeln in Abrahams Haus.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: das Fleisch eurer Vorhaut
  rationale: בָּשָׂר bedeutet hier konkret „Fleisch“, עָרְלָה im anatomischen Zusammenhang „Vorhaut“. Die singularische Form mit Suffix wird im Deutschen kollektiv auf die angesprochene Mehrzahl bezogen.
- source_word: וְהָיָה
  choice: und es soll … sein
  rationale: Das Pronomen „es“ greift die soeben angeordnete Beschneidung auf; „soll … sein“ bewahrt sowohl den zukünftigen als auch den bestimmenden Ton der Aussage.
- source_word: לְאוֹת בְּרִית
  choice: ein Zeichen des Bundes
  rationale: אוֹת bezeichnet ein Zeichen oder Kennzeichen. בְּרִית verweist im Kontext auf den bestimmten Bund, den Gott mit Abraham aufrichtet.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: zwischen mir und euch
  rationale: Die Form nennt unmittelbar Gott und die angesprochene Mehrzahl als die beiden Seiten; weitergehende Bezüge werden nicht in diesen Satz hineingetragen.
theological_decisions:
- issue: Wesen der Beschneidung als Bundeszeichen
  choice: ein Zeichen des Bundes
  alternative: ein Bundeszeichen
  rationale: Die Formulierung gibt אוֹת בְּרִית wieder, ohne über den Text hinaus festzulegen, in welchem theologischen Sinn das Zeichen wirkt oder zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die körperlich-konkrete Wendung „das Fleisch eurer Vorhaut“ bleibt wegen der ausdrücklichen hebräischen Formulierung erhalten; die Satzstellung ist zugleich natürlich lesbar.
