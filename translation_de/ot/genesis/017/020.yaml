base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: de
  text: 'Und was Ismael betrifft: Ich habe dich erhört. Sieh, ich habe ihn gesegnet und werde ihn fruchtbar machen und überaus zahlreich werden lassen. Zwölf Fürsten wird er zeugen, und ich werde ihn zu einem großen Volk machen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַעְתִּיךָ
  choice: Ich habe dich erhört
  rationale: Das Verb שׁמע bedeutet hier im Zusammenhang mit Abrahams Bitte nicht nur akustisches Hören, sondern gnädiges Erhören.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und bekräftigenden Charakter der hebräischen Partikel in würdigem, verständlichem Deutsch.
- source_word: בִּמְאֹד מְאֹד
  choice: überaus zahlreich
  rationale: Die verdoppelte Verstärkung wird idiomatisch wiedergegeben und auf das unmittelbar vorausgehende Vermehren bezogen.
- source_word: נְשִׂיאִם
  choice: Fürsten
  rationale: נָשִׂיא bezeichnet hier führende Stammesoberhäupter; „Fürsten“ ist knapp, traditionell verständlich und dem Rang angemessen.
- source_word: גּוֹי גָּדוֹל
  choice: großes Volk
  rationale: Gibt die kollektive, ethnisch-politische Bedeutung von גּוֹי wieder, ohne unnötig den modernen Nationalstaatsbegriff einzutragen.
theological_decisions:
- issue: Verhältnis von Gebetserhörung und Bundesverheißung
  choice: „Ich habe dich erhört“ wird ausdrücklich auf Ismael bezogen, ohne seine Segnung mit der Bundeslinie Isaaks gleichzusetzen.
  alternative: „Ich habe von dir gehört“ oder eine Formulierung, die Ismael in den Bund mit Isaak einordnet.
  rationale: Der unmittelbare Kontext unterscheidet Gottes Zusage für Ismael von der in Vers 21 genannten Aufrichtung des Bundes mit Isaak.
- issue: Zeitform von „ich habe ihn gesegnet“
  choice: 'Perfekt: „ich habe ihn gesegnet“'
  alternative: 'Futurisch: „ich werde ihn segnen“'
  rationale: Das hebräische Perfekt wird formal bewahrt; im prophetischen Zusagekontext stellt es die Segnung als fest beschlossen dar, während die folgenden Formen ausdrücklich zukünftig sind.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klarem Bibelton. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; „Sieh“ bewahrt die Diskursmarkierung, ohne das heute stärker altertümliche „siehe“ zu verwenden.
