  naturalness: „Sie wird zu Völkern werden“ ist im modernen Standarddeutsch unnatürlich, weil eine Einzelperson nicht zu mehreren Völkern wird. „Sie wird Völkern zur Mutter werden“ ist würdig, gut verständlich und bewahrt die knappe, prädikative Struktur.
  terminology: „Segnen“, „Sohn“, „Völker“ und „Könige von Völkern“ sind angemessen. Die Formulierung „Völkern zur Mutter werden“ ergänzt kein sektiererisches Deutungsmuster, sondern expliziert die im Kontext erforderliche relationale Bedeutung von לְגוֹיִם.
