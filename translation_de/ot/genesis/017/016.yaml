source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: de
  text: Ich werde sie segnen und dir auch durch sie einen Sohn geben. Ich werde sie segnen, und sie wird Völkern zur Mutter werden[a]; Könige von Völkern werden aus ihr hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sie wird für Völker sein/werden.“ Gemeint ist: Sie wird zur Mutter von Völkern werden.'
    reason: Die hebräische Wendung beschreibt Saras Verhältnis zu den Völkern, die von ihr abstammen. Die Anmerkung macht die ungewohnte Konstruktion transparent, während der Haupttext sie in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Ich werde sie segnen / Ich werde sie segnen
  rationale: „Segnen“ bewahrt das Gewicht der göttlichen Bundesverheißung; die Wiederholung des hebräischen Verbs bleibt zur Betonung erhalten.
- source_word: וְגַם
  choice: und ... auch
  rationale: Die Verbindung gibt die hinzufügende und leicht verstärkende Funktion der Partikel in natürlichem Deutsch wieder.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: dir durch sie einen Sohn geben
  rationale: Das Perfekt bezeichnet im Zusammenhang der Verheißung ein fest zugesagtes zukünftiges Geschehen. „Durch sie“ macht idiomatisch deutlich, dass Sara die Mutter des verheißenen Sohnes sein wird.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: sie wird zu Völkern werden
  rationale: Die bewusst auffällige Formulierung folgt eng dem Hebräischen und bewahrt die Aussage, dass aus Sara mehrere Völker entstehen, ohne das nicht ausdrücklich genannte Wort „Mutter“ in den Haupttext einzufügen.
- source_word: מַלְכֵי עַמִּים
  choice: Könige von Völkern
  rationale: Die Wiedergabe unterscheidet עַמִּים („Völker“) nicht künstlich von גּוֹיִם, erhält aber die wörtliche Genitivbeziehung und vermeidet eine Einengung auf bloße Herrscher.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: werden aus ihr hervorgehen
  rationale: Die Formulierung gibt die Herkunfts- und Abstammungsaussage des wörtlichen „werden von ihr sein“ in natürlichem Deutsch wieder.
theological_decisions:
- issue: Die Verheißung über Saras Nachkommenschaft
  choice: sie wird zu Völkern werden; Könige von Völkern werden aus ihr hervorgehen
  alternative: Aus ihr werden Völker hervorgehen; Könige von Völkern werden von ihr abstammen
  rationale: Die gewählte Fassung bewahrt die ungewöhnliche korporative Aussage des Hebräischen und den eigenständigen ersten Satzteil. Sie fügt „Mutter“ nicht erklärend in den Text ein und lässt den weiten bundesgeschichtlichen Umfang der Verheißung stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und gut vorlesbar; die auffällige Wendung „zu Völkern werden“ wird wegen ihrer quellensprachlichen Prägnanz beibehalten und durch eine Fußnote erläutert.
