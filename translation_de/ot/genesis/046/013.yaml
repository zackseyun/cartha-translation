  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: de
  text: 'Und die Söhne Issachars: Tola, Puwa[a], Job[b] und Schimron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Puwa wird in manchen deutschen Übersetzungen und Traditionen auch Pua geschrieben.
    reason: lexical_alternative
  - marker: b
    text: In 1. Chronik 7,1 steht anstelle von Job der Name Jaschub.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Die konstruktusgebundene Pluralform בְּנֵי bezeichnet in dieser genealogischen Liste die »Söhne«; das vorangestellte וּ wird als »Und« wiedergegeben und bewahrt den Listenanschluss.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Der Personenname wird transliteriert; »Tola« ist die geläufige deutsche Form.
- source_word: וּ/פֻוָּה
  choice: Puwa
  rationale: Die Form gibt den Konsonanten ו als w-Laut gemäß deutscher Transliteration wieder; »Pua« ist eine verbreitete alternative Schreibweise und wird in der Fußnote genannt.
- source_word: וְ/י֥וֹב
  choice: Job
  rationale: Der masoretische Text dieses Verses liest יוֹב. »Job« bildet diesen Namen ab und unterscheidet ihn vom deutschen Namen »Hiob« (אִיּוֹב). Die abweichende Form in 1. Chronik 7,1 wird in einer Fußnote bewahrt.
- source_word: וְ/שִׁמְרֽוֹן
  choice: und Schimron
  rationale: Der Personenname wird nach deutscher Lautkonvention mit »Sch« wiedergegeben; die vorangestellte Konjunktion erscheint als »und«.
