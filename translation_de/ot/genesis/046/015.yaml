base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: de
  text: Das sind die Söhne Leas, die sie Jakob in Paddan-Aram gebar, sowie seine Tochter Dina. Zusammen zählten seine Söhne und Töchter dreiunddreißig Personen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alle Personen seiner Söhne und Töchter: dreiunddreißig.“'
    reason: Dokumentiert die hebräische Zählformel mit כָּל נֶפֶשׁ („alle Personen“), die im Haupttext idiomatisch wiedergegeben ist.
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: die Söhne Leas
  rationale: בְּנֵי bezeichnet ausdrücklich die Söhne und dient hier als genealogische Überschrift; die später eigens genannte Dina rechtfertigt nicht die Verallgemeinerung zu „Kinder“.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: die sie Jakob … gebar
  rationale: Das Qal von יָלַד mit weiblichem Subjekt bedeutet „gebären“. Die Formulierung ist im Deutschen knapp, würdig und bewahrt den Bezug zu Jakob.
- source_word: בְּפַדַּן אֲרָם
  choice: in Paddan-Aram
  rationale: Der Ortsname wird entsprechend seiner hebräischen Form transliteriert und nicht etymologisch übersetzt.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: sowie seine Tochter Dina
  rationale: „sowie“ gibt die additive Nennung Dinas nach der genealogischen Überschrift natürlich wieder; das Possessivsuffix bezieht sich grammatisch auf Jakob.
- source_word: כָּל נֶפֶשׁ
  choice: Insgesamt waren es … Personen
  rationale: נֶפֶשׁ bezeichnet in diesem genealogischen Zählkontext Personen, nicht „Seelen“ im theologischen Sinn. Die deutsche Fassung gibt die idiomatische Gesamtzahl natürlich wieder.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: seine Söhne und seine Töchter
  rationale: Die ausdrückliche Unterscheidung beider Gruppen wird beibehalten und nicht zu „Kinder“ verallgemeinert.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: dreiunddreißig
  rationale: Direkte Wiedergabe der Kardinalzahl in deutscher Standardschreibung.
theological_decisions:
- issue: Bezug der Gesamtzahl dreiunddreißig
  choice: Die Formulierung bewahrt die Aussage des masoretischen Textes, dass seine Söhne und Töchter zusammen dreiunddreißig Personen ergeben.
  alternative: Die Zahl durch harmonisierende Erläuterungen zur vorausgehenden Namensliste einschränken oder anders berechnen.
  rationale: Der Vers nennt ausdrücklich die Gesamtzahl; mögliche rechnerische Fragen im Kontext dürfen nicht durch eine unbelegte Harmonisierung im Haupttext aufgelöst werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „gebar“ ist gegenüber „brachte zur Welt“ knapper und für einen biblisch-genealogischen Zusammenhang angemessen, ohne altertümlich zu wirken. Der Fußnotenmarker steht im Haupttext.
