  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: de
  text: 'Wenn der Pharao euch zu sich ruft und fragt: »Was ist euer Beruf?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn
  rationale: Die hebräische Verbindung leitet hier einen erwarteten zukünftigen Fall ein. Das deutsche »Wenn« gibt die zeitliche Bedeutung natürlich und prägnant wieder.
- source_word: יִקְרָא לָכֶם
  choice: euch zu sich ruft
  rationale: קרא mit ל kann »rufen« oder »herbeirufen« bedeuten. Im höfischen Zusammenhang bezeichnet es eine Aufforderung, vor dem Pharao zu erscheinen; »zu sich ruft« ist natürlich, ohne die Förmlichkeit von »vorladen« einzutragen.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Im Deutschen steht der Herrschertitel idiomatisch mit bestimmtem Artikel.
- source_word: וְאָמַר
  choice: und fragt
  rationale: Wörtlich steht »und sagt«. Da unmittelbar eine Frage folgt, ist »fragt« im Deutschen die natürliche Wiedergabe der Sprechhandlung, ohne ihren Inhalt zu verändern.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Was ist euer Beruf?
  rationale: מַעֲשֵׂיכֶם bezeichnet hier die Arbeit beziehungsweise Erwerbstätigkeit der Brüder. »Beruf« gibt die im Kontext gemeinte Tätigkeit in modernem Deutsch klar wieder.
