  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: de
  text: 'Und er sagte: »Ich bin Gott, der Gott deines Vaters. Hab keine Angst, nach Ägypten hinabzuziehen, denn dort werde ich dich zu einem großen Volk machen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: Gott
  rationale: Die Selbstvorstellung wird im Deutschen natürlich mit »Ich bin Gott« wiedergegeben. Der Artikel im Hebräischen hebt die Identität des Sprechers hervor; »der Gott« wäre an dieser Stelle alleinstehend unidiomatisch.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: der Gott deines Vaters
  rationale: Die Konstruktion wird direkt wiedergegeben und bewahrt den Singular »deines Vaters« sowie die Verbindung zur väterlichen Verheißungslinie.
- source_word: אַל תִּירָא מֵרְדָה
  choice: Hab keine Angst, … hinabzuziehen
  rationale: Die Verbindung aus verneintem ירא und Infinitiv bezeichnet die Angst vor einer Handlung. Diese Fassung ist modernes, natürliches Deutsch und erhält zugleich das räumliche »hinabziehen«.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Die Direktivendung bezeichnet die Bewegung auf Ägypten zu; »nach Ägypten« ist dafür die idiomatische deutsche Entsprechung.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: werde ich dich zu einem großen Volk machen
  rationale: שׂים mit לְ bezeichnet hier das Herstellen beziehungsweise Konstituieren als etwas. »Zu einem großen Volk machen« gibt diesen resultativen Sinn klar wieder.
- source_word: שָׁם
  choice: dort
  rationale: Das Adverb verweist auf Ägypten als den Ort, an dem die Verheißung erfüllt werden soll.
theological_decisions:
- issue: Bezeichnung des Vorfahren in Gottes Selbstvorstellung
  choice: der Gott deines Vaters
  alternative: der Gott deiner Väter
  rationale: Der hebräische Text steht ausdrücklich im Singular. Dieser wird bewahrt, damit die unmittelbare väterliche und bundestheologische Zuordnung nicht deutend erweitert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede verwendet die allgemein verständliche Anrede »Hab keine Angst«; »hinabzuziehen« bewahrt die geographische Ausdrucksweise des Hebräischen.
