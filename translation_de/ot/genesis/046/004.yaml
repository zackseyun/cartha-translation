base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: de
  text: Ich selbst werde mit dir nach Ägypten hinabziehen, und ich selbst werde dich auch gewiss heraufführen; und Josef wird dir die Augen schließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Josef wird seine Hand auf deine Augen legen.“ Gemeint ist, dass Josef bei Jakobs Tod anwesend sein und ihm die Augen schließen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte und wiederholte selbstständige Pronomen trägt Nachdruck; „ich selbst“ bewahrt ihn im Deutschen.
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: werde mit dir nach Ägypten hinabziehen
  rationale: ירד bezeichnet die Abwärtsbewegung nach Ägypten; „hinabziehen“ ist im Reise- und Erzählkontext natürlich und wahrt das Richtungsbild.
- source_word: אַעַלְךָ גַם עָלֹה
  choice: werde dich auch gewiss wieder heraufführen
  rationale: Der Hifil von עלה ist kausativ, während der Infinitivus absolutus die Zusage verstärkt. „Auch gewiss“ gibt גַם und die Verstärkung wieder; „wieder“ macht im Deutschen die Rückbewegung verständlich, ohne deren genaue Erfüllung festzulegen.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: wird dir die Augen schließen
  rationale: Die wörtliche Wendung „seine Hand auf deine Augen legen“ bezeichnet hier idiomatisch das Schließen der Augen beim Tod. Die natürliche deutsche Formulierung vermittelt den gemeinten Vorgang; das konkrete hebräische Bild steht in der Fußnote.
theological_decisions:
- issue: Bedeutung der Zusage, Jakob aus Ägypten heraufzuführen
  choice: Die offene Formulierung „dich ... wieder heraufführen“ bleibt erhalten.
  alternative: Die Aussage ausdrücklich nur auf Jakobs Leichnam, seine persönliche lebende Rückkehr oder den späteren Auszug seiner Nachkommen beziehen.
  rationale: Der knappe hebräische Wortlaut legt nicht fest, auf welche Weise die Zusage erfüllt wird. Die Übersetzung bewahrt diese Mehrdeutigkeit und theologische Spannung.
- issue: Josefs Hand auf Jakobs Augen
  choice: Als idiomatische Aussage über Josefs Anwesenheit bei Jakobs Tod wiedergegeben.
  alternative: Das Bild im Haupttext wörtlich als „seine Hand auf deine Augen legen“ wiedergeben.
  rationale: Im Zusammenhang bezeichnet die Wendung das Schließen der Augen eines Verstorbenen. Die Fußnote bewahrt zugleich die konkrete Bildsprache des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung „ich selbst“ sowie die Richtungsbilder „hinabziehen“ und „heraufführen“ bleiben erhalten. Das Sterbeidiom wird im Haupttext natürlich und in der Fußnote wörtlich wiedergegeben.
