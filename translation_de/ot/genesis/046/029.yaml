base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: de
  text: Da ließ Josef seinen Wagen anspannen und zog hinauf, um seinem Vater Israel in Goschen entgegenzugehen. Als er vor ihm erschien, fiel er ihm um den Hals und weinte lange an seinem Hals.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher könnte der Schluss heißen: „und weinte noch an seinem Hals“. Das hebräische עוֹד kann „noch“, „weiter“ oder „wieder“ bedeuten; im Zusammenhang liegt anhaltendes Weinen nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר יוֹסֵף מֶרְכַּבְתּוֹ
  choice: Da ließ Josef seinen Wagen anspannen
  rationale: אָסַר bedeutet grundsätzlich „binden“; mit מֶרְכָּבָה bezeichnet es das Anschirren bzw. Bereitmachen des Wagens. Die kausative deutsche Wendung ist sachgerecht und natürlich.
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: Bewahrt die Bewegungsrichtung des hebräischen עלה und passt zum würdevollen Erzählstil.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: um seinem Vater Israel entgegenzugehen
  rationale: לִקְרַאת drückt eine Begegnungsbewegung aus. Die deutsche Wortstellung macht eindeutig, dass Israel Josefs Vater ist, und bewahrt den im Text verwendeten Namen.
- source_word: גֹּשְׁנָה
  choice: in Goschen
  rationale: Die Endung -ָה kann eine Richtung nach Goschen anzeigen; im Zusammenhang lokalisiert die Form zugleich die Begegnung. „In Goschen“ ergibt im Deutschen mit „entgegenzugehen“ den klarsten Satz.
- source_word: וַיֵּרָא אֵלָיו
  choice: Als er vor ihm erschien
  rationale: Der Niphal von ראה bedeutet hier, dass Josef für seinen Vater sichtbar wurde bzw. vor ihn trat. „erschien vor ihm“ ist natürlicher als ein reflexives „zeigte sich ihm“, ohne den Vorgang übermäßig auszudeuten.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: fiel er ihm um den Hals
  rationale: Die hebräische Wendung schildert eine innige Umarmung. Das deutsche Idiom bewahrt Bild und Emotionalität besser als das unnatürliche „fiel auf seinen Hals“.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: weinte lange an seinem Hals
  rationale: Die Wiederholung von עַל צַוָּארָיו hält die körperliche Nähe der Szene fest. עוֹד bezeichnet hier am ehesten das Fortdauern des Weinens; „lange“ gibt dies idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte Erzählweise und die wiederholte Erwähnung des Halses bleiben erhalten; hebräische Idiome werden dort natürlich deutsch wiedergegeben, wo eine formale Übertragung missverständlich oder unidiomatisch wäre.
