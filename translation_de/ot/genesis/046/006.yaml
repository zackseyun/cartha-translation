source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: de
  text: 'Sie nahmen ihr Vieh und ihren Besitz, den sie im Land Kanaan erworben hatten, und kamen nach Ägypten: Jakob und alle seine Nachkommen[a] mit ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „sein ganzer Same“; das hebräische Wort bezeichnet hier die Nachkommenschaft beziehungsweise die Nachkommen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Sie nahmen
  rationale: Das Qal-Wayyiqtol von לקח führt die Erzählung fort. Im Deutschen gibt „Sie nahmen“ den Vorgang natürlich wieder; die Abfolge wird durch den Satzbau deutlich.
- source_word: מִקְנֵיהֶם
  choice: ihr Vieh
  rationale: מִקְנֶה bezeichnet den Tierbestand beziehungsweise Nutztiere insgesamt. „Vieh“ ist hier die übliche, umfassende deutsche Entsprechung.
- source_word: רְכוּשָׁם
  choice: ihren Besitz
  rationale: רְכוּשׁ bezeichnet erworbenes Gut oder Eigentum. „Besitz“ ist verständlich und unterscheidet die übrigen Güter vom zuvor genannten Vieh.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: den sie … erworben hatten
  rationale: Das Relativpronomen bezieht sich grammatisch auf „Besitz“. Das Plusquamperfekt macht deutlich, dass der Erwerb der Reise vorausging.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: im Land Kanaan
  rationale: Die ausdrückliche Bezeichnung אֶרֶץ כְּנַעַן wird als „Land Kanaan“ bewahrt und nicht zur bloßen Ortsangabe „in Kanaan“ verkürzt.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: und kamen nach Ägypten
  rationale: בוא mit dem Richtungshe auf מִצְרַיִם bezeichnet die Bewegung nach Ägypten. „Kamen nach Ägypten“ wahrt die Perspektive des hebräischen Verbs, ohne einen Grenzübertritt eigens auszudeuten.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Jakob und alle seine Nachkommen mit ihm
  rationale: זֶרַע ist ein kollektiver Singular und bezeichnet hier Jakobs leibliche Nachkommenschaft. „Alle seine Nachkommen“ ist idiomatisches modernes Deutsch; die Schlussstellung „mit ihm“ folgt der hebräischen Hervorhebung.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt kennzeichnet „Jakob und alle seine Nachkommen“ als nachgestellte nähere Bestimmung des zuvor im Plural genannten Subjekts. Die kollektive Bedeutung von זֶרַע bleibt durch die Fußnote sichtbar.
