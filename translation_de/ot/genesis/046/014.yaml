  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: de
  text: 'Und die Söhne Sebulons: Sered, Elon und Jachleel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Jachleel kann auch Jahleel oder Yahleel geschrieben werden.
