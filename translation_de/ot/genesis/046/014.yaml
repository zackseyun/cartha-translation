lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Konstruktus Plural von »Sohn« und bezeichnet in dieser genealogischen Liste die Söhne; das vorangestellte ו wird als »Und« wiedergegeben, um die Listenstruktur zu bewahren.
- source_word: זְבוּלֻן
  choice: Sebulons
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als »Sebulon« transliteriert und wegen der deutschen Konstruktion in den Genitiv gesetzt.
- source_word: סֶרֶד
  choice: Sered
  rationale: Der Personenname wird lautnah und entsprechend der üblichen deutschen Form transliteriert.
- source_word: וְ/אֵלוֹן
  choice: Elon
  rationale: Hier liegt ein Personenname vor, nicht das gleichlautende Wort für eine große Baumart; die Konjunktion wird in der deutschen Aufzählung vor dem letzten Glied gebündelt.
- source_word: וְ/יַחְלְאֵל
  choice: Jachleel
  rationale: Der Personenname wird in der geläufigen deutschen Bibelform »Jachleel« wiedergegeben; diese bildet den anlautenden Jod-Laut mit J und den hebräischen Kehllaut ח mit ch ab.
theological_decisions: []
