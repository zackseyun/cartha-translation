  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: de
  text: Die Männer sind Schafhirten,[a] denn sie sind Viehzüchter. Ihr Kleinvieh, ihre Rinder und alles, was ihnen gehört, haben sie mitgebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Männer waren Schafhirten, denn sie waren Viehzüchter. Ihr Kleinvieh, ihre Rinder und alles, was ihnen gehörte, brachten sie mit.“ Die hebräischen Verbformen können hier auch durch die deutsche Vergangenheit wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Die Männer
  rationale: Der bestimmte Plural bezeichnet die bereits genannten Brüder Josefs. Das einleitende וְ muss im Deutschen innerhalb der angekündigten Rede nicht eigens mit „und“ wiedergegeben werden.
- source_word: רֹעֵי צֹאן
  choice: Schafhirten
  rationale: Die Konstruktverbindung bezeichnet Hirten von Kleinvieh. „Schafhirten“ ist idiomatisch und hält den Bezug zu צֹאן deutlicher fest als das allgemeinere „Hirten“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier eine begründende Erläuterung ihrer Tätigkeit ein.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: Viehzüchter
  rationale: Wörtlich „Männer des Viehbesitzes“; gemeint sind Menschen, deren dauerhafte Tätigkeit die Haltung und Aufzucht von Nutztieren ist. „Viehzüchter“ ist natürliches modernes Deutsch und beschränkt מִקְנֶה nicht auf Rinder.
- source_word: הָיוּ
  choice: sind
  rationale: Das hebräische Perfekt beschreibt ihren bis zur gegenwärtigen Situation bestehenden Beruf bzw. Stand. Im Deutschen gibt das Präsens diese fortdauernde Geltung natürlich wieder.
- source_word: וְצֹאנָם
  choice: Ihre Schafe und Ziegen
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, vor allem Schafe und Ziegen. Die ausdrückliche Wiedergabe vermeidet, den Begriff auf Schafe allein zu verengen.
- source_word: וּבְקָרָם
  choice: ihre Rinder
  rationale: בָּקָר bezeichnet Rindvieh; „Rinder“ bewahrt die sachliche Unterscheidung vom zuvor genannten Kleinvieh.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: und alles, was ihnen gehört
  rationale: Die Formulierung gibt den umfassenden Besitzbezug nah und zugleich idiomatisch wieder.
- source_word: הֵבִיאוּ
  choice: haben sie mitgebracht
  rationale: 'Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtigem Ergebnis: Die Tiere und der Besitz befinden sich nun bei ihnen. „Mitgebracht“ passt zum Ortswechsel nach Ägypten.'
