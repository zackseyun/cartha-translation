translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Aufzählung und die doppelte Begleitangabe des Hebräischen bleiben erkennbar; „sie alle“ verdeutlicht im Deutschen, dass das Verb die gesamte aufgezählte Familie umfasst.
