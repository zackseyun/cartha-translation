base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: de
  text: Seine Söhne und seine Enkelsöhne[a] brachte er mit sich, seine Töchter und seine Enkeltöchter sowie alle seine Nachkommen[b] nach Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne seiner Söhne«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sein ganzer Same«; gemeint ist seine gesamte Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Da anschließend die Töchter eigens genannt werden, bezeichnet בָּנָיו hier die männlichen Nachkommen und nicht allgemein die Kinder.
- source_word: וּבְנֵי בָנָיו
  choice: und seine Enkelsöhne
  rationale: Wörtlich steht „und die Söhne seiner Söhne“. „Enkelsöhne“ gibt die genealogische Beziehung im Deutschen natürlich und genau wieder.
- source_word: אִתּוֹ
  choice: bei ihm / mit sich
  rationale: Die erste Wiedergabe bezeichnet die bei Jakob befindlichen Söhne und Enkelsöhne; beim Verb wird das erneut vorkommende אִתּוֹ idiomatisch mit „mit sich“ wiedergegeben.
- source_word: בְּנֹתָיו
  choice: seine Töchter
  rationale: Die Bezeichnung meint ausdrücklich die weiblichen Nachkommen und steht im Gegensatz zu den zuvor genannten Söhnen.
- source_word: וּבְנוֹת בָּנָיו
  choice: und seine Enkeltöchter
  rationale: Wörtlich „und die Töchter seiner Söhne“. „Enkeltöchter“ ist die natürliche deutsche Entsprechung, ohne die Abstammungsbeziehung zu verwischen.
- source_word: וְכָל זַרְעוֹ
  choice: sowie alle seine Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv Jakobs gesamte Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch klar und dem Kontext angemessen.
- source_word: הֵבִיא
  choice: brachte er
  rationale: Der Hifil von בוא hat hier die kausative Bedeutung „bringen“.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet die Bewegung auf Ägypten zu; „nach Ägypten“ ist dafür die idiomatische deutsche Form.
