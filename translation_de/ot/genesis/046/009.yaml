  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: de
  text: 'Und die Söhne Rubens: Henoch, Pallu, Hezron und Karmi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: Und die Söhne Rubens
  rationale: Das einleitende וּ führt die fortlaufende genealogische Aufzählung weiter und wird mit „Und“ wiedergegeben. Die deutsche Genitivform „Rubens“ entspricht dem hebräischen Konstruktus „Söhne Rubens“ und klingt in diesem Register natürlich.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: „Henoch“ ist die im Deutschen etablierte biblische Namensform für חֲנוֹךְ; sie vermeidet eine unnötige Übernahme englischer Transliterationskonventionen.
- source_word: וּ/פַלּוּא
  choice: Pallu
  rationale: „Pallu“ gibt den hebräischen Personennamen פַלּוּא in einer geläufigen deutschen Umschrift wieder. Die Konjunktion wird durch die deutsche Listenstruktur aufgenommen.
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: „Hezron“ ist die etablierte deutsche Form des hebräischen Namens חֶצְרוֹן. Die vorangestellte Konjunktion wird in der Aufzählung idiomatisch behandelt.
- source_word: וְ/כַרְמִי
  choice: Karmi
  rationale: „Karmi“ entspricht der üblichen deutschen Umschrift von כַרְמִי; das hebräische וְ wird durch das abschließende „und“ wiedergegeben.
