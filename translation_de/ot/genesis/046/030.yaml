lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel; der Name wird nicht zu Jakob harmonisiert.
- source_word: אָמֻתָה הַפָּעַם
  choice: Nun kann ich sterben
  rationale: Der Kohortativ drückt hier persönliche Bereitschaft beziehungsweise inneres Einverständnis aus. »Kann ich sterben« vermittelt idiomatisch, dass Israel nun zufrieden sterben kann, ohne eine Bitte um Erlaubnis einzutragen.
- source_word: אַחֲרֵי רְאוֹתִי אֶת־פָּנֶיךָ
  choice: nachdem ich dein Gesicht gesehen habe
  rationale: Die Infinitivkonstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben; »dein Gesicht« bewahrt das anschauliche hebräische Bild.
- source_word: כִּי עוֹדְךָ חָי
  choice: und weiß, dass du noch lebst
  rationale: כִּי kann hier die aus dem Sehen gewonnene Gewissheit beziehungsweise den erklärenden Umstand einführen. Die Ergänzung »weiß« macht diesen Zusammenhang im Deutschen verständlich; die formnähere Fassung bleibt in der Fußnote sichtbar.
