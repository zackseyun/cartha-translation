  language: de
  text: 'Da sagte Israel zu Josef: »Nun kann ich sterben, nachdem ich dein Gesicht gesehen habe – denn du lebst noch.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
