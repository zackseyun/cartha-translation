  source_fidelity: Die Hauptfassung fügt mit »und weiß« ein im Hebräischen nicht ausdrücklich vorhandenes Erkenntnisverb hinzu. Die Aussage, dass Josef noch lebt, wird dort direkt mit כִּי eingeführt und sollte im Deutschen als begründender bzw. erläuternder Nachsatz stehen. »Nun kann ich sterben« gibt den Kohortativ in diesem Kontext angemessen als erfüllte Bereitschaft wieder.
