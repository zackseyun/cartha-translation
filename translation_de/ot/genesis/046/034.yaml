base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: de
  text: 'Dann sollt ihr sagen: »Deine Diener sind von unserer Jugend an bis heute Viehhalter gewesen, sowohl wir als auch unsere Väter«, damit ihr im Land Goschen wohnen könnt; denn jeder Schafhirte ist den Ägyptern ein Gräuel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Dann sollt ihr sagen
  rationale: Das Waw mit Perfekt führt im Zusammenhang Josefs nächste Anweisung fort; die deutsche Soll-Form gibt den direktiven und sequenziellen Sinn natürlich wieder.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: Viehzüchter
  rationale: Der Ausdruck bezeichnet Männer, deren Tätigkeit in der Haltung und Aufzucht von Vieh besteht. „Viehzüchter“ ist im Deutschen natürlich und vermeidet die schwerfällige wörtliche Form „Männer des Viehs“.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Vor dem Pharao ist dies eine ehrerbietige Selbstbezeichnung und betont hier nicht den rechtlichen Status von Sklaven.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: von unserer Jugend an bis heute
  rationale: Die Formulierung bewahrt den zeitlichen Verlauf von früher Jugend bis zur Gegenwart und klingt in modernem Deutsch natürlich.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: sowohl wir als auch unsere Väter
  rationale: Die Paarform gibt die wiederholte Hervorhebung durch גַּם wieder und wahrt die generationenübergreifende Aussage.
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: So könnt ihr euch … niederlassen
  rationale: בַּעֲבוּר bezeichnet hier Zweck beziehungsweise beabsichtigte Folge; ישׁב meint im Zusammenhang die dauerhafte Ansiedlung in einem Gebiet.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Die ausdrückliche Gebietsbezeichnung אֶרֶץ wird beibehalten.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: gilt den Ägyptern als abscheulich
  rationale: Die prädikative deutsche Wendung vermittelt die starke Abscheu des hebräischen תּוֹעֵבָה, ohne das im heutigen Deutsch häufig kultisch oder konfessionell gefärbte „Gräuel“ zwingend in den Haupttext zu setzen.
- source_word: כָּל רֹעֵה צֹאן
  choice: jeder Schafhirte
  rationale: „Schafhirte“ gibt sowohl רֹעֵה als auch צֹאן kompakt wieder; anders als das allgemeinere „Hirte“ macht es die Art der Herde ausdrücklich.
