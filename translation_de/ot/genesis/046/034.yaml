  terminology: „Diener“ wahrt die höfische Selbstbezeichnung. „Viehhalter“ vermeidet die sachliche Einengung auf Viehzucht. „Schafhirte“ ist als kompakte Wiedergabe von רֹעֵה צֹאן vertretbar. „Ein Gräuel“ gibt die starke Wertung wieder, ohne eine konfessionelle Deutung hinzuzufügen.
