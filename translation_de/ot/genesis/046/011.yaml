  text: וּ/בְנֵ֖י לֵוִ֑י גֵּרְשׁ֕וֹן קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: de
  text: 'Und die Söhne Levis: Gerschon, Kehat und Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Das ו führt die genealogische Aufzählung fort und wird mit „Und“ wiedergegeben. בְנֵי ist der Status constructus im Plural und bezeichnet ausdrücklich die Söhne.
- source_word: לֵוִי
  choice: Levis
  rationale: Der Personenname Levi steht nach „Söhne“ in einer natürlichen deutschen Genitivkonstruktion.
- source_word: גֵּרְשׁוֹן
  choice: Gerschon
  rationale: Die im Deutschen geläufige biblische Namensform gibt das hebräische גֵּרְשׁוֹן wieder und unterscheidet den Namen von Gerschom.
- source_word: קְהָת
  choice: Kehat
  rationale: „Kehat“ ist die etablierte deutsche Form des hebräischen Namens קְהָת.
- source_word: וּ/מְרָרִי
  choice: und Merari
  rationale: Das Präfix ו wird vor dem letzten Glied der Reihe mit „und“ wiedergegeben; „Merari“ ist die geläufige deutsche Namensform.
