  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: de
  text: Er schickte Juda vor sich her zu Josef, damit er Jakob den Weg nach Goschen weise.[a] So kamen sie in das Land Goschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „um vor ihm nach Goschen zu weisen“. Der hebräische Satz ist knapp; „den Weg weisen“ kann auch allgemeiner Orientierung oder Anweisung für die Reise nach Goschen bezeichnen.'
    reason: Bewahrt die Kürze und den Bedeutungsumfang von לְהוֹרֹת, ohne die weniger wahrscheinliche Deutung, Josef sei derjenige, von dem Juda Weisung empfangen solle, als gleichwertig darzustellen.
lexical_decisions:
- source_word: שָׁלַח
  choice: schickte
  rationale: Die übliche und natürliche Wiedergabe des Verbs im erzählenden Zusammenhang.
- source_word: לְפָנָיו
  choice: vor sich her
  rationale: 'Gibt die räumliche und zeitliche Bedeutung wieder: Juda wird vor Jakob vorausgesandt.'
- source_word: לְהוֹרֹת
  choice: den Weg … weisen
  rationale: Das Hifil von ירה kann »anweisen«, »leiten« oder »zeigen« bedeuten. Im Zusammenhang einer Reise bringt »den Weg weisen« die konkrete Richtungsangabe natürlich zum Ausdruck.
- source_word: גֹּשְׁנָה
  choice: nach Goschen
  rationale: Das Richtungs-he bezeichnet eine Bewegung auf Goschen zu; im Deutschen ist »nach Goschen« idiomatisch.
- source_word: וַיָּבֹאוּ
  choice: So kamen sie
  rationale: Bewahrt den erzählerischen Fortgang und den Bewegungsaspekt des hebräischen Verbs.
- source_word: אַרְצָה גֹּשֶׁן
  choice: in das Land Goschen
  rationale: Die Richtungsform von אֶרֶץ bezeichnet das Hineingelangen in das Gebiet Goschen.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Juda / Josef / Goschen
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufigen Namensformen.
