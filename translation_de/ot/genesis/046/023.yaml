lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das וּ führt die genealogische Aufzählung additiv fort. בְנֵי ist der Konstruktplural von „Sohn“; die Wiedergabe bewahrt den auffälligen Plural des Hebräischen.
- source_word: דָן
  choice: Dans
  rationale: Der Personenname „Dan“ steht nach בְנֵי in einer Zugehörigkeitsbeziehung; im Deutschen wird dies knapp durch den Genitiv „Dans“ ausgedrückt.
- source_word: חֻשִׁים
  choice: Huschim
  rationale: Der hebräische Personenname wird nach üblicher deutscher Lautentsprechung transliteriert. Trotz seiner pluralisch wirkenden Form bezeichnet er hier einen einzelnen Nachkommen. Die knappe, verblose Formulierung des Ausgangstextes bleibt erhalten.
theological_decisions: []
