base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: de
  text: Da brach Jakob von Beerscheba auf[a]. Die Söhne Israels transportierten ihren Vater Jakob, ihre kleinen Kinder[b] und ihre Frauen mit den Wagen, die der Pharao gesandt hatte, um ihn zu transportieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da stand Jakob von Beerscheba auf.“ Im Zusammenhang einer Reise bezeichnet die hebräische Wendung den Aufbruch.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet besonders kleine Kinder, kann aber auch die nicht erwachsenen Angehörigen insgesamt einschließen.
    reason: lexical_scope
lexical_decisions:
- source_word: וַיָּקָם
  choice: brach ... auf
  rationale: Das Verb bedeutet wörtlich „stand auf“, bezeichnet hier mit מן und einem Ortsnamen jedoch idiomatisch den Aufbruch zu einer Reise.
- source_word: מִבְּאֵר שָׁבַע
  choice: von Beerscheba
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; „Beerscheba“ ist die etablierte deutsche Form des Ortsnamens.
- source_word: וַיִּשְׂאוּ
  choice: ließen ... fahren
  rationale: נשׂא bedeutet grundsätzlich „tragen/befördern“. Da die Personen ausdrücklich in Wagen sind, gibt diese Formulierung den gemeinten Transport im Deutschen natürlich wieder, ohne zu suggerieren, die Söhne hätten sie körperlich getragen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Im unmittelbaren Zusammenhang sind Jakobs männliche Nachkommen gemeint; die konkrete Wiedergabe ist genauer als das traditionssprachliche „Kinder Israels“.
- source_word: אֲבִיהֶם
  choice: ihren Vater
  rationale: Direkte Wiedergabe der Possessivkonstruktion; der Bezug auf Jakob bleibt ausdrücklich erhalten.
- source_word: טַפָּם
  choice: ihre kleinen Kinder
  rationale: טַף bezeichnet besonders die kleinen Kinder beziehungsweise die nicht erwachsenen Angehörigen; „kleine Kinder“ bewahrt diese Nuance in heutigem Deutsch.
- source_word: נְשֵׁיהֶם
  choice: ihre Frauen
  rationale: Im Familienzusammenhang sind die Ehefrauen gemeint; „ihre Frauen“ ist dafür eine natürliche deutsche Ausdrucksweise.
- source_word: בָּעֲגָלוֹת
  choice: in den Wagen
  rationale: עֲגָלוֹת bezeichnet Transportwagen; „in den Wagen“ entspricht der Präposition und dem erzählten Zusammenhang.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: die der Pharao geschickt hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Schicken der Wagen dem Aufbruch vorausging, ohne zusätzliche Information einzuführen.
- source_word: לָשֵׂאת אֹתוֹ
  choice: um ihn zu befördern
  rationale: Der Zweckinfinitiv bedeutet „um ihn zu tragen/befördern“. Das maskuline Singularsuffix bezieht sich am natürlichsten auf Jakob; „befördern“ passt zum Transport im Wagen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, während „brach ... auf“ und „ließen ... fahren“ die Reisehandlung idiomatisch und klar ausdrücken.
