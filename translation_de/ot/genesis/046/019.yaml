  text: בְּנֵ֤י רָחֵל֙ אֵ֣שֶׁת יַֽעֲקֹ֔ב יוֹסֵ֖ף וּ/בִנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: de
  text: 'Die Söhne Rahels, der Frau Jakobs: Josef und Benjamin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktus-Pluralform bezeichnet hier in der genealogischen Aufzählung Rahels unmittelbare männliche Kinder; „Söhne“ ist daher präziser als „Kinder“ oder „Nachkommen“.
- source_word: רָחֵל
  choice: Rahels
  rationale: Der Personenname wird in der im Deutschen biblisch etablierten Form wiedergegeben und entsprechend der hebräischen Zuordnung im Genitiv verwendet.
- source_word: אֵשֶׁת יַעֲקֹב
  choice: der Frau Jakobs
  rationale: אִשָּׁה bedeutet in dieser Beziehungskonstruktion „Frau“ im Sinn von Ehefrau. Die knappe Genitivform bewahrt die Struktur und den würdigen Ton des Hebräischen.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Personenname wird nach der üblichen deutschen biblischen Namensform wiedergegeben.
- source_word: וּבִנְיָמִן
  choice: und Benjamin
  rationale: Die Konjunktion וּ wird mit „und“ wiedergegeben; der Personenname folgt der etablierten deutschen Form.
theological_decisions: []
translation_notes:
  register: Knappes, genealogisches Standarddeutsch mit enger Anlehnung an die hebräische Satzstruktur. „Frau“ ist im Deutschen natürlich und bezeichnet im Kontext eindeutig Jakobs Ehefrau.
