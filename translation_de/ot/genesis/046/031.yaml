source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: de
  text: 'Da sagte Josef zu seinen Brüdern und zum Haus seines Vaters[a]: »Ich werde hinaufgehen und dem Pharao berichten. Ich werde zu ihm sagen: ›Meine Brüder und das Haus meines Vaters, die im Land Kanaan waren, sind zu mir gekommen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Hausgemeinschaft seines Vaters“. Das hebräische „Haus seines Vaters“ bezeichnet hier die Familie als soziale Einheit, nicht nur ein Wohngebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: Im Kontext sind Josefs männliche Brüder gemeint.
- source_word: וְאֶל בֵּית אָבִיו
  choice: und zum Haus seines Vaters
  rationale: „Haus“ bewahrt das hebräische Familien- und Haushaltsbild; gemeint ist hier nicht nur ein Gebäude, sondern die väterliche Hausgemeinschaft.
- source_word: אֶעֱלֶה
  choice: Ich werde hinaufgehen
  rationale: Die Richtungsangabe des Verbs עלה wird erhalten, obwohl modernes Deutsch auch schlicht „gehen“ zuließe.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: und dem Pharao berichten
  rationale: Das Hifil von נגד bezeichnet ein Bekanntmachen oder Berichten und passt zum höfischen Zusammenhang.
- source_word: וְאֹמְרָה אֵלָיו
  choice: Ich werde zu ihm sagen
  rationale: Die beabsichtigte nächste Handlung Josefs bleibt in der ersten Person ausdrücklich erhalten.
- source_word: אַחַי
  choice: Meine Brüder
  rationale: Bezeichnet in diesem Zusammenhang Josefs leibliche Brüder.
- source_word: וּבֵית אָבִי
  choice: und das Haus meines Vaters
  rationale: Die Wendung wird parallel zur ersten Nennung wiedergegeben und wahrt das hebräische Bild der Familien- beziehungsweise Hausgemeinschaft.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: die im Land Kanaan waren
  rationale: Im Hebräischen steht kein ausdrückliches finites Verb; die Vergangenheitsform macht im Deutschen den früheren Aufenthaltsort vor ihrer Ankunft deutlich.
- source_word: בָּאוּ אֵלַי
  choice: sind zu mir gekommen
  rationale: Das Perfekt bezeichnet die abgeschlossene Ankunft mit gegenwärtiger Relevanz; das deutsche Perfekt gibt dies natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Wiederholung von „Haus seines Vaters“ und das Richtungsverb „hinaufgehen“ bleiben bewusst nahe am Hebräischen; die Fußnote erläutert den sozialen Sinn von „Haus“.
