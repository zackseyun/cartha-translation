base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: de
  text: Das sind die Söhne Bilhas, die Laban seiner Tochter Rahel gab. Bilha gebar Jakob diese, insgesamt sieben Personen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Seele(n): sieben«; eine hebräische Zählformel für insgesamt sieben Personen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Das sind die Söhne Bilhas
  rationale: Die identifizierende Wendung wird im Deutschen natürlich mit »Das sind« wiedergegeben; בְּנֵי bezeichnet hier im genealogischen Zusammenhang Bilhas männliche Nachkommen.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: die Laban seiner Tochter Rahel gegeben hatte
  rationale: Das Plusquamperfekt macht das zeitliche Verhältnis zur anschließenden Geburt im Deutschen klar, ohne den Sinn zu verändern. Die Wortstellung »seiner Tochter Rahel« ist natürlich und bewahrt beide Angaben.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Bilha gebar sie Jakob
  rationale: Der im Hebräischen durch die feminine Verbform bezeichnete Rückbezug auf Bilha wird zur Klarheit mit ihrem Namen ausgedrückt. »gebar sie Jakob« bewahrt die knappe genealogische Geburtsformel.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: insgesamt sieben Personen
  rationale: נֶפֶשׁ bezeichnet in dieser Zählformel einzelne Menschen; die idiomatische deutsche Wiedergabe vermeidet das in diesem Kontext missverständliche »Seelen«.
theological_decisions: []
