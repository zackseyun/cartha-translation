  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: de
  text: 'Das waren die Söhne Rahels, die Jakob geboren wurden: insgesamt vierzehn Personen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Personen/Seelen: vierzehn“; die hebräische Wendung bezeichnet die Gesamtzahl der Personen.'
