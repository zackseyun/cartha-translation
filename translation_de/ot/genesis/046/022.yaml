lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Die Vergangenheitsform fügt die zusammenfassende Aussage natürlich in den erzählenden Zusammenhang ein; das hebräische Demonstrativ bleibt klar erkennbar.
- source_word: בְּנֵי רָחֵל
  choice: die Söhne Rahels
  rationale: Bewahrt die konkrete genealogische Formulierung „Söhne“ und gibt den hebräischen Genitiv knapp und würdig wieder.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: die Jakob geboren wurden
  rationale: Gibt die passive Form von ילד und die durch לְ bezeichnete Elternbeziehung wieder, ohne den Satz aktiv umzudeuten.
- source_word: כָּל נֶפֶשׁ
  choice: insgesamt … Personen
  rationale: נֶפֶשׁ bezeichnet in diesem genealogischen Zählzusammenhang einzelne Menschen; „Personen“ vermeidet die hier irreführende theologische Nebenbedeutung von „Seelen“.
- source_word: אַרְבָּעָה עָשָׂר
  choice: vierzehn
  rationale: Direkte Wiedergabe der Kardinalzahl.
