  text: וּ/בְנֵ֖י נַפְתָּלִ֑י יַחְצְאֵ֥ל וְ/גוּנִ֖י וְ/יֵ֥צֶר וְ/שִׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: de
  text: 'Und die Söhne Naftalis: Jachzeel[a], Guni, Jezer und Schillem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird je nach Umschrift auch »Jahzeel« oder »Jachziel« geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְנֵי ist die Konstruktus-Pluralform von »Sohn«; in einer genealogischen Liste ist »die Söhne« die natürliche Wiedergabe. Das vorangestellte וּ wird als »Und« beibehalten und führt die Aufzählung fort.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Personenname wird nach einer im modernen Deutschen üblichen bibelsprachlichen Form wiedergegeben.
- source_word: יַחְצְאֵל
  choice: Jachzeel
  rationale: Die Schreibung bildet die hebräischen Konsonanten י־ח־צ־א־ל in einer für deutsche Leser nachvollziehbaren Form ab; besonders wird ח durch »ch« kenntlich gemacht.
- source_word: וְגוּנִי
  choice: Guni
  rationale: Der Personenname wird transliteriert; die vorangestellte Konjunktion erscheint im Deutschen durch die Aufzählungsstruktur.
- source_word: וְיֵצֶר
  choice: Jezer
  rationale: Der Personenname wird in einer geläufigen deutschen Form wiedergegeben; das anlautende J entspricht dem hebräischen Jod.
- source_word: וְשִׁלֵּם
  choice: Schillem
  rationale: »Sch« gibt שׁ deutschsprachig wieder; »ll« bildet die durch den Dagesch angezeigte Konsonantenverdopplung ab.
theological_decisions: []
