  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: de
  text: 'Die Söhne Aschers: Jimna, Jischwa, Jischwi und Beria; und ihre Schwester Serach. Die Söhne Berias: Heber und Malkiël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Die Söhne Aschers
  rationale: בְּנֵי ist der Konstruktplural „Söhne von“. Im Deutschen ist der Genitiv in einer genealogischen Aufzählung knapp und natürlich. Das vorangestellte וּ wird nicht eigens wiedergegeben, da der Vers als Listeneintrag flüssiger ohne einleitendes „und“ beginnt.
- source_word: יִמְנָה
  choice: Jimna
  rationale: Der Personenname wird nach gängiger deutscher Wiedergabe hebräischer Namen mit J für anlautendes Jod und ohne stummes Schluss-h transkribiert.
- source_word: וְיִשְׁוָה וְיִשְׁוִי וּבְרִיעָה
  choice: Jischwa, Jischwi und Beria
  rationale: Die Eigennamen werden in geläufiger deutscher Form wiedergegeben; die hebräischen Konjunktionen werden entsprechend deutscher Aufzählungssyntax gestaltet.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: dazu ihre Schwester Serach
  rationale: Das Hebräische ist eine knappe Apposition, wörtlich „und Serach, ihre Schwester“. „Dazu ihre Schwester Serach“ bewahrt den ergänzenden genealogischen Hinweis, ohne ein im Ausgangstext fehlendes Verb einzufügen.
- source_word: וּבְנֵי בְרִיעָה
  choice: Die Söhne Berias
  rationale: Der zweite genealogische Unterabschnitt wird im Deutschen als neuer Satz formuliert. Der Zusammenhang bleibt durch die unmittelbare Folge erkennbar, sodass das hebräische וּ nicht ausdrücklich mit „und“ wiedergegeben werden muss.
- source_word: חֶבֶר וּמַלְכִּיאֵל
  choice: Heber und Malkiël
  rationale: Die Namen folgen etablierten deutschen Transkriptionsformen. Das Trema in „Malkiël“ macht die getrennte Aussprache der Vokale sichtbar; die Konjunktion wird natürlich mit „und“ wiedergegeben.
