  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֣י גָ֔ד צִפְי֥וֹן וְ/חַגִּ֖י שׁוּנִ֣י וְ/אֶצְבֹּ֑ן עֵרִ֥י וַֽ/אֲרוֹדִ֖י וְ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: de
  text: 'Und die Söhne Gads: Zifjon[a], Haggi, Schuni, Ezbon, Eri, Arodi und Areli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch צִפְיוֹן (Zifjon); in 4. Mose 26,15 steht die abweichende Namensform צְפוֹן (Zefon).
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Und die Söhne Gads
  rationale: בְּנֵי bezeichnet in der genealogischen Liste die »Söhne«; das vorangestellte וּ wird als »Und« wiedergegeben, um die fortlaufende Listenstruktur zu bewahren. Der hebräische Genitiv wird im Deutschen natürlich durch »Gads« ausgedrückt.
- source_word: צִפְיוֹן
  choice: Zifjon
  rationale: Der Personenname wird nach der masoretischen Form dieses Verses ins Deutsche übertragen. Die Schreibung »Zifjon« bildet sowohl den anlautenden צ-Laut als auch das vorhandene י ab.
- source_word: וְחַגִּי
  choice: Haggi
  rationale: Der Eigenname wird in einer im Deutschen lesbaren, quellennahen Form wiedergegeben; das Dagesch wird durch den Doppelkonsonanten angezeigt.
- source_word: שׁוּנִי
  choice: Schuni
  rationale: Der hebräische שׁ-Laut wird der deutschen Orthografie entsprechend mit »Sch« wiedergegeben.
- source_word: וְאֶצְבֹּן
  choice: Ezbon
  rationale: Quellennahe Wiedergabe des Eigennamens in deutscher Schreibweise.
- source_word: עֵרִי
  choice: Eri
  rationale: Der Personenname wird knapp und quellennah transliteriert.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Der Eigenname wird nach der masoretischen Vokalisierung wiedergegeben; die Konjunktion wird durch die deutsche Aufzählungsstruktur ausgedrückt.
- source_word: וְאַרְאֵלִי
  choice: Areli
  rationale: Der Eigenname wird direkt aus der hebräischen Form übertragen; das vorangestellte וְ erscheint als abschließendes »und« der deutschen Aufzählung.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. Die Eigennamen folgen soweit möglich der hebräischen Form und deutscher Lautkonvention; die Doppelpunkte erhalten die elliptische Syntax des genealogischen Eintrags.
