source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: de
  text: 'Und dies sind die Namen der Söhne Israels, die nach Ägypten kamen: Jakob und seine Söhne. Jakobs Erstgeborener war Ruben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das verbindende וְ wird als „Und“ wiedergegeben; zusammen mit dem Demonstrativ leitet es die folgende Namensliste in der für genealogische Erzählungen typischen Form ein.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Die Pluralkonstruktform führt die namentliche Aufzählung ein.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: „Söhne“ entspricht dem maskulinen בְּנֵי und passt zur unmittelbar folgenden Liste der männlichen Nachkommen; „Israel“ bleibt als Name Jakobs erhalten.
- source_word: הַבָּאִים
  choice: die … kamen
  rationale: Das artikulierte Partizip bezeichnet rückblickend diejenigen, die nach Ägypten kamen; im Deutschen ist das Präteritum hier natürlich.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung -ה bezeichnet die Bewegung auf Ägypten zu; „nach Ägypten“ ist die idiomatische deutsche Wiedergabe.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Jakob und seine Söhne
  rationale: Die Wortgruppe wird eng am Hebräischen wiedergegeben. Der Doppelpunkt lässt ihre appositionelle beziehungsweise erläuternde Beziehung zum vorangehenden Satz bewusst offen genug erkennen.
- source_word: בְּכֹר יַעֲקֹב
  choice: Jakobs Erstgeborener
  rationale: Die Konstruktverbindung bezeichnet Jakobs Erstgeborenen und bewahrt die genealogische Betonung der Geburtsfolge.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
theological_decisions:
- issue: Bezug von „Jakob und seine Söhne“
  choice: Wiedergabe nach einem Doppelpunkt, ohne die syntaktische Beziehung weiter auszudeuten
  alternative: „die nach Ägypten kamen, nämlich Jakob und seine Söhne“
  rationale: Der knappe hebräische Wortlaut ist appositionell und kann bei expliziter deutscher Ausformulierung leicht stärker festgelegt werden, als es die Vorlage erlaubt. Der Doppelpunkt erhält die Spannung zwischen Überschrift, Erläuterung und Listenbeginn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Listenformel „Und dies sind die Namen“ bewahrt den erzählerisch-genealogischen Anschluss, ohne ein zeitliches „Nun“ einzuführen. Der Satz bleibt nah an der knappen hebräischen Struktur.
