  - severity: low
    issue: Der Fußnotenanker steht nach dem Satzschluss, obwohl die Anmerkung nur die Wortgruppe „Jakob und seine Söhne“ betrifft.
    rationale: Auch unabhängig vom Inhalt der Fußnote ist die Verankerung weniger präzise als eine unmittelbare Platzierung nach der betroffenen Wortgruppe.
