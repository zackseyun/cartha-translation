  source_fidelity: 'Die lexikalischen Entsprechungen sind überwiegend treffend: „Söhne Israels“, „nach Ägypten“, „Jakobs Erstgeborener“ und „Ruben“ geben den hebräischen Wortlaut angemessen wieder. Die knappe Schlussgruppe יַעֲקֹב וּבָנָיו ist jedoch am besten als näher bestimmende Gesamtangabe zur Einwanderungsgruppe zu verstehen; der Doppelpunkt ist hierfür im Deutschen möglich, sollte aber nicht durch eine sachlich unzutreffende Fußnote über eine angeblich nicht vorgegebene Interpunktion erklärt werden.'
  naturalness: „Und dies sind die Namen“ ist als bewusst traditionsnahe genealogische Einleitungsformel in modernem, würdevollem Standarddeutsch gut verständlich. Der Doppelpunkt macht die folgende Gruppenangabe lesbar. Eine Fußnote mit einer bloßen alternativen Zeichensetzung verbessert das Verständnis nicht.
  terminology: Die etablierten deutschen Namensformen „Jakob“ und „Ruben“ sind richtig. „Erstgeborener“ trifft בְּכוֹר präzise. „Söhne Israels“ wahrt die Formulierung der Vorlage; die anschließende Gesamtangabe „Jakob und seine Söhne“ sollte nicht stärker harmonisiert oder theologisch ausgedeutet werden.
