  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֧ל וְ/יָמִ֛ין וְ/אֹ֖הַד וְ/יָכִ֣ין וְ/צֹ֑חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: de
  text: 'Und die Söhne Simeons: Jemuel, Jamin, Ohad, Jachin, Zohar und Schaul, der Sohn der Kanaaniterin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Und die Söhne Simeons
  rationale: Die Verbindung mit וּ führt die genealogische Aufzählung fort; der deutsche Genitiv gibt die hebräische Status-constructus-Verbindung natürlich und genau wieder.
- source_word: יְמוּאֵל
  choice: Jemuël
  rationale: Die im Deutschen geläufige biblische Namensform gibt die hebräische Lautgestalt angemessen wieder; der Trema-Punkt verdeutlicht die getrennte Aussprache der Vokale.
- source_word: וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר
  choice: Jamin, Ohad, Jachin, Zohar
  rationale: Die Eigennamen werden in ihren etablierten deutschen biblischen Formen wiedergegeben; die hebräische Reihung wird durch deutsche Kommas und das abschließende „und“ natürlich abgebildet.
- source_word: וְשָׁאוּל
  choice: und Schaul
  rationale: „Schaul“ entspricht der hebräischen Namensform שָׁאוּל und ist im Deutschen eine transparente Transliteration; eine Fußnote ist nicht nötig, da „Saul“ hier keine für das Verständnis erforderliche Textalternative darstellt.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: der Sohn der Kanaaniterin
  rationale: Das feminine Ethnikon bezeichnet ausdrücklich eine kanaanitische Frau. „Kanaaniterin“ bewahrt diese Information knapp und idiomatisch.
