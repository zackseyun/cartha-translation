base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: de
  text: Alle zu Jakob gehörenden Personen, die nach Ägypten kamen und von ihm abstammten[a] – die Frauen der Söhne Jakobs nicht mitgerechnet –, waren insgesamt sechsundsechzig Personen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die aus seiner Hüfte hervorgingen«; eine hebräische Redewendung für leibliche Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »Seele« oder »Leben« bedeuten, bezeichnet bei solchen Zählungen aber Personen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Alle Personen
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang einer Aufzählung einzelne Menschen. »Personen« gibt diesen Zählsinn im heutigen Deutsch natürlich wieder.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: die zu Jakob gehörten und nach Ägypten kamen
  rationale: Das לְ bei Jakob kennzeichnet hier die Zuordnung zu Jakob; die Formulierung vermeidet die unnötige Festlegung, dass ausschließlich die gemeinsame Reisebewegung gemeint sei. מִצְרַיְמָה enthält die Richtungsangabe »nach Ägypten«.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: von ihm abstammten
  rationale: Die wörtliche Wendung »aus seiner Hüfte hervorgegangen« ist ein hebräisches Körperidiom für leibliche Nachkommen. Die Haupttextfassung vermittelt den Sinn klar; die konkrete Bildsprache bleibt in der Fußnote erhalten.
- source_word: מִלְּבַד
  choice: nicht mitgerechnet
  rationale: Die Präposition schließt die anschließend genannte Gruppe aus der Zahl aus. »Nicht mitgerechnet« passt unmittelbar zu der folgenden Gesamtsumme.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: die Frauen der Söhne Jakobs
  rationale: Die Formulierung bildet die Genitivbeziehungen eindeutig und in natürlichem modernem Deutsch ab.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: waren insgesamt sechsundsechzig Personen
  rationale: Die deutsche Satzstellung gibt die hebräische Gesamtsumme flüssig wieder und übersetzt נֶפֶשׁ im gleichen Zählsinn wie zu Beginn des Verses.
