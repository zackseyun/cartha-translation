  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: de
  text: 'Und Gott redete in nächtlichen Visionen zu Israel und sagte: »Jakob, Jakob!« Er antwortete: »Hier bin ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: redete … und sagte / antwortete
  rationale: אמר bedeutet grundsätzlich »sagen«. Beim ersten und zweiten Vorkommen bewahrt »redete … und sagte« die zweigliedrige hebräische Erzählungsform; beim dritten macht »antwortete« die natürliche Funktion der Erwiderung deutlich, ohne ihren Inhalt zu verändern.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier eindeutig den einen Gott und steht im Kontext mit singularischer Aussage.
- source_word: לְיִשְׂרָאֵל
  choice: zu Israel
  rationale: Der Erzähltext nennt ausdrücklich Israel; diese Bezeichnung wird nicht mit dem anschließend verwendeten Namen Jakob harmonisiert.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: in nächtlichen Visionen
  rationale: Die Wiedergabe erhält den Plural von מַרְאֹת und bringt den nächtlichen Zusammenhang in natürlichem Deutsch zum Ausdruck.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Jakob, Jakob
  rationale: Die eindringliche, persönliche Wiederholung des Namens bleibt vollständig erhalten.
- source_word: הִנֵּנִי
  choice: Hier bin ich
  rationale: Dies ist die geläufige deutsche Entsprechung der Bereitschaft und Aufmerksamkeit ausdrückenden Antwortformel.
theological_decisions:
- issue: Wechsel zwischen den Namen Israel und Jakob
  choice: Im Erzählteil »Israel«, in der göttlichen Anrede »Jakob«
  alternative: Zur Vereinheitlichung an beiden Stellen denselben Namen verwenden
  rationale: Der hebräische Text wechselt bewusst von Israel zu Jakob. Die Übersetzung bewahrt diese literarische und mögliche theologische Spannung, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Erzählungsverknüpfung mit »Und« und die direkte Namenswiederholung bleiben erhalten; »nächtliche Visionen« ist natürlicher als das schwerfälligere »Visionen der Nacht«.
