  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: de
  text: Und die Söhne Judas waren Er, Onan, Schela, Perez und Serach. Er und Onan aber starben[a] im Land Kanaan. Die Söhne des Perez waren Hezron und Hamul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht bei dem zusammengesetzten Subjekt „Er und Onan“ ein Verb im Singular. Das ist eine im Hebräischen mögliche Konstruktion; dem Sinn nach ist der Plural gemeint: „Er und Onan starben“.'
    reason: Erläuterung einer grammatischen Besonderheit des hebräischen Ausgangstextes.
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Und die Söhne Judas
  rationale: Die Konstruktverbindung bezeichnet Judas Söhne; das vorangestellte „Und“ bewahrt die Verknüpfung mit der genealogischen Aufzählung.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Er, Onan, Schela, Perez und Serach
  rationale: Die Personennamen werden in geläufigen deutschen Bibelformen wiedergegeben.
- source_word: וַיָּמָת
  choice: starben
  rationale: Obwohl die hebräische Verbform im Singular steht, folgt ihr das zusammengesetzte Subjekt „Er und Onan“; im Deutschen ist deshalb der Plural sachgemäß und natürlich.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: im Land Kanaan
  rationale: Bewahrt das ausdrücklich genannte אֶרֶץ („Land“) und entspricht natürlichem deutschen Sprachgebrauch.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Die Söhne des Perez waren
  rationale: In diesem genealogischen Zusammenhang führt היה die namentliche Bestimmung der Söhne ein; „waren“ gibt dies klar wieder.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hezron und Hamul
  rationale: Wiedergabe der Personennamen in etablierten deutschen Bibelformen.
