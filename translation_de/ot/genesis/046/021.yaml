source:
  edition: WLC
  text: וּ/בְנֵ֣י בִנְיָמִ֗ן בֶּ֤לַע וָ/בֶ֨כֶר֙ וְ/אַשְׁבֵּ֔ל גֵּרָ֥א וְ/נַעֲמָ֖ן אֵחִ֣י וָ/רֹ֑אשׁ מֻפִּ֥ים וְ/חֻפִּ֖ים וָ/אָֽרְדְּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: de
  text: 'Und die Söhne Benjamins: Bela, Becher, Aschbel, Gera, Naaman, Ehi[a], Rosch, Muppim[b], Huppim und Ard[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 4. Mose 26,38 steht in einer parallelen benjaminitischen Geschlechtsliste „Ahiram“, während dieser Vers „Ehi“ liest.
    reason: cross_reference
  - marker: b
    text: In verwandten genealogischen Überlieferungen begegnet anstelle von „Muppim“ eine abweichende Namensform wie „Schuppim“; hier folgt die Übersetzung dem masoretischen Text.
    reason: textual_variant
  - marker: c
    text: In 1. Chronik 8,3 steht in einer benjaminitischen Geschlechtsliste die verwandte Namensform „Addar“; dieser Vers liest „Ard“.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Und die Söhne Benjamins
  rationale: Die hebräische Konstruktverbindung wird natürlich als Genitiv wiedergegeben; „Und“ bewahrt den fortführenden Charakter der genealogischen Aufzählung. Da der hebräische Text keinen ausdrücklichen Verbalsatz enthält, folgt unmittelbar der Doppelpunkt.
- source_word: בֶּלַע
  choice: Bela
  rationale: Personenname in der im Deutschen üblichen, dem Hebräischen nahen Form.
- source_word: בֶּכֶר
  choice: Becher
  rationale: Personenname; „Becher“ ist die etablierte deutsche Wiedergabe und bildet den spirantisierten Konsonanten כ angemessen ab.
- source_word: אַשְׁבֵּל
  choice: Aschbel
  rationale: Personenname; „sch“ entspricht der üblichen deutschen Wiedergabe von שׁ.
- source_word: גֵּרָא
  choice: Gera
  rationale: Personenname in gebräuchlicher deutscher Form.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Personenname in gebräuchlicher deutscher Form; die zwei Vokale bleiben getrennt lesbar.
- source_word: אֵחִי
  choice: Ehi
  rationale: Die Übersetzung folgt der Namensform des masoretischen Textes dieser Stelle, ohne sie an die abweichende Parallelüberlieferung in 4. Mose 26,38 anzugleichen.
- source_word: רֹאשׁ
  choice: Rosch
  rationale: In der Namensliste ist das Wort als Personenname zu transliterieren, nicht als das gleichlautende gewöhnliche Substantiv „Kopf“ oder „Haupt“ zu übersetzen.
- source_word: מֻפִּים
  choice: Muppim
  rationale: Die Namensform des masoretischen Textes wird beibehalten; abweichende Formen verwandter genealogischer Überlieferungen werden nicht in den Haupttext übernommen.
- source_word: חֻפִּים
  choice: Huppim
  rationale: Personenname in einer dem masoretischen Text entsprechenden deutschen Umschrift.
- source_word: אָרְדְּ
  choice: Ard
  rationale: Die Übersetzung folgt der Namensform dieser Stelle und gleicht sie nicht an „Addar“ in 1. Chronik 8,3 an.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller genealogischer Listenstil in modernem Standarddeutsch. Die deutschen Namensformen folgen üblichen Transliterationskonventionen; echte Unterschiede zu parallelen Genealogien werden in Fußnoten offengelegt, ohne den Haupttext zu harmonisieren.
