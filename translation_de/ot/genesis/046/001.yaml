id: GEN.46.1
reference: Genesis 46:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: de
  text: So brach Israel mit allem, was ihm gehörte,[a] auf und kam nach Beerscheba. Dort brachte er dem Gott seines Vaters Isaak Opfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit allem, was er hatte“. Die hebräische Wendung kann umfassend alles bezeichnen, was zu seinem Hausstand gehörte, einschließlich der Menschen und des Besitzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: brach … auf
  rationale: נסע bezeichnet hier das Aufbrechen zu einer Reise. Die deutsche Wendung ist natürlich und bewahrt den Aspekt des Reisebeginns.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text verwendet ausdrücklich den Namen Israel; er wird nicht zu Jakob harmonisiert.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: mit allem, was ihm gehörte
  rationale: Die Formulierung lässt den umfassenden Bezug auf Israels gesamten Hausstand einschließlich Menschen und Besitz offen, ohne ihn auf Sachbesitz zu verengen.
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא wird im Zusammenhang mit dem genannten Ziel schlicht und idiomatisch mit „kam“ wiedergegeben.
- source_word: בְּאֵרָה שָּׁבַע
  choice: nach Beerscheba
  rationale: Die Richtungsendung wird im Deutschen durch „nach“ ausgedrückt; „Beerscheba“ ist die geläufige deutsche Schreibung des Ortsnamens.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: brachte … Opfer dar
  rationale: Die hebräische Verbindung aus stammverwandtem Verb und Objekt wird idiomatisch wiedergegeben. „Opfer darbringen“ bezeichnet den kultischen Vorgang klar, ohne die unnatürliche Wiederholung „opferte Opfer“.
- source_word: לֵאלֹהֵי
  choice: dem Gott
  rationale: Der Dativ bei „darbringen“ gibt den durch ל bezeichneten Empfänger des Opfers natürlich wieder.
- source_word: אָבִיו יִצְחָק
  choice: seines Vaters Isaak
  rationale: Die Formulierung identifiziert Isaak ausdrücklich als Israels Vater und folgt der knappen hebräischen Konstruktion.
theological_decisions:
- issue: Bezeichnung Gottes als „Gott seines Vaters Isaak“
  choice: Die konkrete patriarchalische Bezeichnung wird unverändert beibehalten.
  alternative: „Gott seiner Väter“ oder eine erklärende Erweiterung
  rationale: Der hebräische Text nennt ausschließlich Isaak. Diese bewusste Verknüpfung mit Israels Vater und dessen Geschichte in Beerscheba darf weder verallgemeinert noch ausgeweitet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Beerscheba“ folgt der etablierten deutschen Namensform. „Dort“ macht den Szenenfortgang im Deutschen flüssig, ohne zusätzliche inhaltliche Aussage.
