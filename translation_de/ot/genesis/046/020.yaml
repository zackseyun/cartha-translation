  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: de
  text: Josef wurden im Land Ägypten Manasse und Ephraim geboren. Asenat, die Tochter Potiferas, des Priesters von On[a], gebar sie ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On ist die ägyptische Stadt, die später unter ihrem griechischen Namen Heliopolis bekannt war.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: Josef wurden … geboren
  rationale: Das Nifal von ילד bezeichnet hier das Geborenwerden. Trotz der morphologischen Singularform verlangt das zusammengesetzte Subjekt Manasse und Ephraim im natürlichen Deutschen den Plural.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Gibt אֶרֶץ ausdrücklich wieder und bewahrt den leicht feierlichen, quellenahen Ausdruck.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: Asenat … gebar sie ihm
  rationale: Bewahrt die aktive Aussage über die Mutter und den Bezug auf beide Söhne. Die Aufteilung in zwei Sätze ist im Deutschen klarer als eine schwerfällige Relativkonstruktion.
- source_word: אָסְנַת
  choice: Asenat
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: die Tochter Potiferas
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: כֹּהֵן אֹן
  choice: Priester von On
  rationale: כֹּהֵן wird als „Priester“ wiedergegeben; der Ortsname אֹן bleibt im Haupttext transliteriert.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manasse und Ephraim
  rationale: Die Akkusativmarker bleiben unübersetzt; die Namen folgen den etablierten deutschen Bibelformen.
