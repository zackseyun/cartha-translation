  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: de
  text: Und die Söhne Josefs, die ihm in Ägypten geboren wurden, waren zwei Personen.[a] Alle Personen des Hauses Jakob, die nach Ägypten kamen, waren siebzig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen in beiden Zählformulierungen „Seele“; in diesem Zusammenhang ist jeweils eine einzelne Person gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: Und die Söhne Josefs
  rationale: בְּנֵי bezeichnet hier die bereits genannten männlichen Nachkommen Josefs; der deutsche Genitiv ist natürlich und präzise.
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: die ihm in Ägypten geboren wurden
  rationale: Die passive Form von ילד mit ל wird syntaktisch nah und zugleich verständlich wiedergegeben.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: zwei Personen
  rationale: נֶפֶשׁ bezeichnet in diesem genealogischen Zählzusammenhang einzelne Personen; die ungewöhnliche hebräische Konstruktion wird in idiomatisches Deutsch überführt.
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: Insgesamt waren es ... Personen aus dem Haus Jakobs
  rationale: כָּל הַנֶּפֶשׁ gibt die Gesamtzahl der zum Haus Jakobs gehörenden Personen an. „Insgesamt“ macht die zusammenfassende Funktion im Deutschen klar.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: die nach Ägypten kamen
  rationale: Das kollektiv gebrauchte Partizip wird als natürlicher deutscher Relativsatz wiedergegeben; die Richtungsendung wird durch „nach“ ausgedrückt.
- source_word: שִׁבְעִים
  choice: siebzig
  rationale: Die verblöse hebräische Zählaussage wird mit „waren es siebzig“ idiomatisch ausgedrückt.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in der genealogischen Zählung
  choice: Personen
  alternative: Seelen
  rationale: Der Vers zählt Angehörige des Hauses Jakobs und trifft keine lehrmäßige Aussage über die Seele. „Personen“ bewahrt den kontextuellen Sinn ohne unnötige anthropologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Aussage bleibt bewusst nahe an der hebräischen Zählformulierung; die zweite wird mit „Insgesamt“ als abschließende Gesamtsumme kenntlich gemacht.
