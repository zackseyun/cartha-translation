  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: de
  text: 'Das sind die Söhne Silpas, die Laban seiner Tochter Lea gegeben hatte und die sie Jakob gebar: sechzehn Personen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sechzehn Seelen“. Das hebräische Wort näfäsch bezeichnet hier bei der Zählung einzelne Personen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Der pluralische Demonstrativausdruck leitet die zusammenfassende Aufzählung ein; das Präsens entspricht dem hebräischen Listenstil und klingt im Deutschen natürlich.
- source_word: בְּנֵי זִלְפָּה
  choice: die Söhne Silpas
  rationale: בְּנֵי wird seiner Grundbedeutung entsprechend mit „Söhne“ wiedergegeben. Der Genitiv „Silpas“ ist im Deutschen knapp und idiomatisch.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: die Laban seiner Tochter Lea gegeben hatte
  rationale: Der Relativsatz bezieht sich auf Silpa. Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass die Übergabe vor den Geburten lag, ohne den Aussagegehalt zu erweitern.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Sie gebar sie Jakob
  rationale: 'Die knappe Geburtsformel bleibt erhalten: Das erste „sie“ bezeichnet Silpa, das zweite verweist auf die zuvor genannte Gruppe; „Jakob“ gibt לְיַעֲקֹב als Vaterangabe idiomatisch wieder.'
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: insgesamt sechzehn Personen
  rationale: נֶפֶשׁ dient hier idiomatisch zur Zählung von Menschen. „Personen“ vermeidet die im modernen Deutschen mögliche Fehlvorstellung körperloser Seelen; „insgesamt“ macht die abschließende Summenfunktion deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzführung. Die Wiederholung der Pronomen in „Sie gebar sie Jakob“ bewahrt die Struktur des Hebräischen; der Fußnotenmarker steht bei dem tatsächlich erläuterten Ausdruck „Personen“.
