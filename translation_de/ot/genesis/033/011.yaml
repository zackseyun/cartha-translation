- from: Nimm doch mein Geschenk an, das dir überbracht worden ist; denn Gott ist mir gnädig gewesen, und ich habe alles, was ich brauche. So drängte er ihn, bis er es annahm.
  to: Nimm doch mein Geschenk an, das dir gebracht worden ist; denn Gott ist mir gnädig gewesen, und ich habe alles. Er drängte ihn, und er nahm es an.
  rationale: Die Revision entfernt nicht markierte Einengungen und syntaktische Explikationen, behält aber die kontextuell angemessene Übersetzung „Geschenk“ bei. Die zweimalige Pronominalform im Schlusssatz erhält die im hebräischen Text vorhandene Referenzknappheit; der Erzählkontext identifiziert die Handelnden.
