  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: de
  text: Nimm doch mein Geschenk an, das dir gebracht worden ist; denn Gott ist mir gnädig gewesen, und ich habe alles. Er drängte ihn, und er nahm es an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: mein Geschenk
  rationale: Wörtlich »mein Segen«; im Zusammenhang bezeichnet das Wort jedoch die Gabe, die Jakob Esau überreichen will. »Geschenk« vermittelt hier die gemeinte Funktion natürlich und ohne einen Segensakt Esaus anzudeuten.
- source_word: חַנַּנִי אֱלֹהִים
  choice: Gott ist mir gnädig gewesen
  rationale: Bewahrt die ausdrückliche theologische Begründung und gibt die vollendete Wohltat Gottes idiomatisch wieder.
- source_word: יֶשׁ לִי כֹל
  choice: ich habe alles, was ich brauche
  rationale: Das hebräische כֹל lautet formal »alles«; im Kontext ist ausreichender Besitz gemeint, nicht buchstäblich der Besitz aller Dinge.
- source_word: וַיִּפְצַר בּוֹ
  choice: So drängte er ihn
  rationale: Gibt das beharrliche Zureden Jakobs wieder und lässt das männliche Pronomen wie im Hebräischen stehen.
- source_word: וַיִּקָּח
  choice: bis er es annahm
  rationale: Das Objekt ist aus dem Kontext die Gabe. »Annehmen« ist im Deutschen für das Entgegennehmen eines Geschenks natürlicher als »nehmen«.
theological_decisions:
- issue: בִּרְכָתִי als »Segen« oder »Geschenk«
  choice: Geschenk
  alternative: Segen
  rationale: Obwohl der Grundsinn »Segen« ist, bezeichnet der Ausdruck hier metonymisch Jakobs Gabe an Esau. Die Übersetzung folgt der konkreten Bedeutung im Erzählzusammenhang, ohne die Herkunft des Begriffs theologisch auszubauen.
- issue: Umfang von יֶשׁ לִי כֹל
  choice: alles, was ich brauche
  alternative: alles
  rationale: Die idiomatische Wiedergabe vermeidet die sachlich unnötige Vorstellung absoluten Besitzes und bewahrt Jakobs Aussage, dass Gott ihn ausreichend versorgt hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nimm doch … an« bildet die höflich-drängende Partikel נָא ab. Der Schlusssatz wird für natürlichen deutschen Erzählfluss mit »bis« verbunden; dadurch wird deutlich, dass Esaus Annahme auf Jakobs beharrliches Zureden folgt.
