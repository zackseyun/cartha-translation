base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: de
  text: Und Jakob zog nach Sukkot[a]. Dort baute er sich ein Haus, und für sein Vieh machte er Hütten. Darum nannte er den Ort Sukkot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Sukkot entspricht dem hebräischen Wort für „Hütten“ oder „Schutzunterstände“.
    reason: Erläutert das hebräische Wortspiel zwischen dem Ortsnamen סֻכּוֹת und dem gleichlautenden gewöhnlichen Substantiv, ohne die kultische Nebenbedeutung von „Laubhütten“ einzutragen.
lexical_decisions:
- source_word: נָסַע
  choice: zog
  rationale: Das Verb bezeichnet das Aufbrechen und Weiterziehen. „zog“ ist im deutschen Erzählstil natürlich und gibt die Ortsveränderung knapp wieder.
- source_word: סֻכֹּתָה
  choice: nach Sukkot
  rationale: Das angefügte Richtungszeichen bezeichnet die Bewegung auf den Ort zu; im Kontext ist „nach Sukkot“ die idiomatische deutsche Wiedergabe.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: Dort baute er sich ein Haus
  rationale: Der Dativ לוֹ wird natürlich mit „sich“ wiedergegeben. „Dort“ verdeutlicht ohne Sinnänderung den Bezug zum zuvor genannten Zielort.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: Das Substantiv meint hier den Tierbestand beziehungsweise die Herden Jakobs. „Vieh“ ist breit genug und im Deutschen geläufig.
- source_word: עָשָׂה סֻכֹּת
  choice: machte er Hütten
  rationale: סֻכּוֹת bezeichnet einfache, vorübergehende Schutzbauten. „Hütten“ passt zum Unterbringen von Vieh und erhält die lautliche Verbindung zum Ortsnamen Sukkot, die in der Fußnote erklärt wird.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung leitet die Begründung der Ortsbenennung ein. „Darum“ ist prägnant, natürlich und wahrt den kausalen Zusammenhang.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: nannte er den Ort
  rationale: Die wörtliche hebräische Formel „er rief den Namen des Ortes“ wird in natürlichem modernem Deutsch idiomatisch als „nannte er den Ort“ wiedergegeben.
- source_word: סֻכּוֹת
  choice: Sukkot
  rationale: Der Ortsname wird transliteriert. Seine Verbindung mit dem gleichlautenden hebräischen Wort für Hütten wird durch eine Fußnote kenntlich gemacht.
