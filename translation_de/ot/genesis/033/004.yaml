base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: de
  text: Esau lief ihm entgegen, umarmte ihn, fiel ihm um den Hals, küsste ihn[a] und sie weinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »küsste ihn« übersetzte Verb ist im masoretischen Text ungewöhnlicherweise mit übergesetzten Punkten versehen. Manche Ausleger verstehen dies als Zeichen des Zweifels oder der Hervorhebung; der schlichte Sinn des hebräischen Wortes ist hier jedoch »küsste ihn«.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: lief
  rationale: רוץ bezeichnet das Laufen; »lief« gibt die rasche, unmittelbare Bewegung natürlich wieder.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: לִקְרָאתוֹ
  choice: ihm entgegen
  rationale: Die Wendung לקראת bezeichnet die Bewegung auf jemanden zu, gewöhnlich um ihm zu begegnen; »ihm entgegen« ist idiomatisch und passt zur folgenden Umarmung.
- source_word: וַיְחַבְּקֵהוּ
  choice: umarmte ihn
  rationale: חבק bedeutet »umarmen«; die Formulierung ist klar, gegenwärtig und dem Erzählstil angemessen.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: fiel ihm um den Hals
  rationale: Die deutsche Redewendung bewahrt das anschauliche Bild und gibt zugleich den emotionalen Gestus des hebräischen Ausdrucks natürlich wieder.
- source_word: וַיִּשָּׁקֵהוּ
  choice: küsste ihn
  rationale: נשק bedeutet hier eindeutig »küssen«. Die ungewöhnliche masoretische Kennzeichnung wird in einer Fußnote erläutert, ohne den klaren Wortsinn im Haupttext zu verändern.
- source_word: וַיִּבְכּוּ
  choice: sie weinten
  rationale: Die Pluralform schließt beide Männer ein; »weinten« entspricht dem würdevollen Erzählton.
theological_decisions:
- issue: Deutung von Esaus Verhalten gegenüber Jakob
  choice: Die Abfolge wird ihrem unmittelbaren Wortsinn entsprechend als herzliches Verhalten wiedergegeben.
  alternative: Den Kuss aufgrund späterer Auslegungstraditionen als zweifelhaft oder unaufrichtig kennzeichnen.
  rationale: Der hebräische Erzähltext reiht mehrere Gesten der Zuneigung aneinander. Eine misstrauische Deutung soll nicht in den Haupttext eingetragen werden; die textgeschichtliche Besonderheit wird sachlich in der Fußnote genannt.
translation_notes:
  register: Modernes, natürliches und zugleich würdevolles Standarddeutsch. »Fiel ihm um den Hals« ist eine geläufige deutsche Entsprechung, die das lebendige Bild des Hebräischen erhält. Die rasche Folge der Handlungen bleibt durch die knappe Satzstruktur gewahrt.
