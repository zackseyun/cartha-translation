base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: de
  text: 'Da sagte Esau: „Lass mich doch einige der Leute, die bei mir sind, bei dir zurücklassen.“ Er aber sagte: „Wozu das? Lass mich Gunst in den Augen meines Herrn finden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא עִמְּךָ
  choice: Lass mich doch … bei dir zurücklassen
  rationale: Das Hifil von יצג bezeichnet hier das Zurück- bzw. Bereitstellen einiger Begleiter bei Jakob; „doch“ gibt die höfliche Partikel נָא natürlich wieder.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: einige von den Leuten, die bei mir sind
  rationale: 'מִן ist partitiver Gebrauch: Esau bietet einen Teil seiner Leute an.'
- source_word: לָמָּה זֶּה
  choice: Wozu das?
  rationale: Die knappe Frage weist Esaus Angebot zurück und fragt sinngemäß nach dessen Zweck, ohne eine Begründung hinzuzufügen.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Möge ich Gunst finden in den Augen meines Herrn
  rationale: Die traditionelle Wendung wird nahe am Hebräischen bewahrt; „mein Herr“ ist hier Jakobs ehrerbietige Anrede an Esau.
theological_decisions:
- issue: Bezug von „mein Herr“
  choice: 'Kleinschreibung: „meines Herrn“'
  alternative: „meines HERRN“ als Gottesbezeichnung
  rationale: Im unmittelbaren Dialog bezeichnet Jakob Esau als אֲדֹנִי; es handelt sich nicht um den Gottesnamen.
- issue: Funktion von „Gunst finden“
  choice: Als höfliche Bitte um Esaus Wohlwollen stehen lassen
  alternative: Ausdrücklich ergänzen, dass Esau ohne Begleitschutz weiterziehen soll
  rationale: Der hebräische Text formuliert Jakobs Folgerung nicht ausdrücklich; die knappe, spannungsvolle Höflichkeitsformel bleibt daher unaufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfliche Verhandlungssprache und die Wiederholung von „sagte“ wurden entsprechend dem hebräischen Erzählstil bewahrt.
