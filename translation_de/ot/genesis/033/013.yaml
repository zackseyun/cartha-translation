base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: de
  text: 'Doch er sagte zu ihm: »Mein Herr weiß, dass die Kinder empfindlich sind. Auch das Kleinvieh und die Rinder, die ihre Jungen säugen, stehen unter meiner Obhut.[a] Wenn man sie auch nur einen Tag zu hart antreibt, wird das ganze Kleinvieh sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch das Kleinvieh und die Rinder mit ihren säugenden Jungen lasten auf mir.« Die hebräische Wendung ist schwierig und kann sowohl die säugenden Tiere als auch Jakobs Verantwortung für sie ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mein Herr
  rationale: Die ehrerbietige Anrede gilt hier Esau und bezeichnet nicht Gott. »Mein Herr« bewahrt Höflichkeit und Rangverhältnis.
- source_word: הַיְלָדִים רַכִּים
  choice: die Kinder noch empfindlich sind
  rationale: רַכִּים beschreibt Zartheit und körperliche Anfälligkeit. »Noch empfindlich« klingt im Reisekontext natürlich und vermeidet die stärkere Aussage »schwach«.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: das Kleinvieh und die Rinder
  rationale: צֹאן ist ein Sammelbegriff für Schafe und Ziegen, בָּקָר bezeichnet Großvieh, besonders Rinder. Die Wiedergabe unterscheidet beide Tiergruppen.
- source_word: עָלוֹת עָלָי
  choice: die ihre Jungen säugen, sind meiner Fürsorge anvertraut
  rationale: Die schwierige idiomatische Verbindung umfasst wahrscheinlich sowohl den Zustand säugender Muttertiere als auch die auf Jakob liegende Verantwortung. Die Übersetzung bringt beide Aspekte zum Ausdruck, ohne sie miteinander gleichzusetzen.
- source_word: וּדְפָקוּם
  choice: Wenn man sie … zu hart antreibt
  rationale: Das Verb bezeichnet hier ein übermäßig hartes Antreiben von Tieren. Das unpersönliche »man« entspricht dem nicht ausdrücklich genannten Handelnden.
- source_word: יוֹם אֶחָד
  choice: auch nur einen Tag
  rationale: Die Formulierung gibt die Zeitdauer wieder und hebt idiomatisch hervor, dass bereits ein einziger Tag verhängnisvoll wäre.
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: wird das ganze Kleinvieh sterben
  rationale: Der kollektive Singular צֹאן wird präzise als »das ganze Kleinvieh« wiedergegeben; so bleibt die engere Bezeichnung des hebräischen Schlusses erhalten.
