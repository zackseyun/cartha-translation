base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: de
  text: Auch Lea und ihre Kinder kamen näher[a] und verneigten sich. Danach kamen Josef und Rahel näher und verneigten sich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „traten heran“; ebenso im zweiten Satz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warfen sich nieder“; das hebräische Verb kann eine tiefe Ehrerbietung durch Niederwerfen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: kamen näher
  rationale: נגשׁ bezeichnet das Herantreten oder Näherkommen. „Kamen näher“ gibt die Bewegung auf Esau zu natürlich wieder, ohne die Art der Annäherung näher festzulegen.
- source_word: גַּם
  choice: auch
  rationale: גַּם kennzeichnet Leas Gruppe als weiteres Glied in der Abfolge vor Esau.
- source_word: וִילָדֶיהָ
  choice: und ihre Kinder
  rationale: יְלָדִים bezeichnet allgemein Kinder und ist hier nicht auf Söhne beschränkt.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: verneigten sich
  rationale: Die Verbform von שׁחה beschreibt hier eine ehrerbietige körperliche Verbeugung. „Verneigten sich“ ist im heutigen Deutsch natürlich und lässt den genauen Grad des Niederwerfens offen.
- source_word: וְאַחַר
  choice: Danach
  rationale: וְאַחַר markiert die zeitliche Folge der Gruppen klar und knapp.
- source_word: יוֹסֵף וְרָחֵל
  choice: Josef und Rahel
  rationale: Die Reihenfolge des Hebräischen wird beibehalten.
