  text: וַ/יַּצֶּב שָׁ֖ם מִזְבֵּ֑חַ וַ/יִּ֨קְרָא ל֔/וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: de
  text: Dort errichtete er einen Altar und nannte ihn El-Elohe-Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort errichtete er einen Altar und rief: ‚Gott, der Gott Israels!‘“, beziehungsweise: „… und verkündete über dem Altar: ‚Gott ist der Gott Israels.‘“ Das Hebräische kann entweder die Benennung des Altars oder eine Anrufung beziehungsweise Verkündigung über Gott ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: El-Elohe-Israel bedeutet „Gott, der Gott Israels“ oder „El, Gott Israels“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: errichtete
  rationale: Das Hifil von נצב bezeichnet hier das Aufstellen oder Errichten. Bei einem Altar ist „errichtete“ im Deutschen natürlich und präzise.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird direkt und idiomatisch mit „dort“ wiedergegeben.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: „Altar“ ist die übliche und sachlich genaue deutsche Entsprechung.
- source_word: וַיִּקְרָא לוֹ
  choice: und nannte ihn
  rationale: קרא mit ל kann in diesem Zusammenhang die Benennung des zuvor genannten Altars ausdrücken; das maskuline Pronomen „ihn“ bezieht sich auf „Altar“. Da auch eine Anrufung oder Verkündigung möglich ist, wird diese Mehrdeutigkeit in Fußnote [a] bewahrt.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Elohe-Israel
  rationale: Da die Wortgruppe im Haupttext als Name des Altars verstanden wird, bleibt sie als hebräischer Name transliteriert. Ihre übersetzbare Bedeutung wird in Fußnote [b] angegeben.
theological_decisions:
- issue: Ob die Schlussformulierung der Name des Altars oder eine Anrufung beziehungsweise Verkündigung über Gott ist
  choice: Die Formulierung wird als Name verstanden, den Jakob dem Altar gab.
  alternative: 'Jakob rief Gott als „Gott, den Gott Israels“ an oder verkündete über dem Altar: „Gott ist der Gott Israels.“'
  rationale: Nach der Errichtung des Altars liegt syntaktisch eine Benennungsformel nahe, wie sie auch sonst in Genesis vorkommt. Die knappe hebräische Konstruktion lässt jedoch eine Anrufungs- oder Verkündigungsdeutung zu; diese wird deshalb nicht ausgeschlossen, sondern in Fußnote [a] festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Errichtete“ passt idiomatisch zu einem Altar; der hebräische Name bleibt im Haupttext erhalten, während Bedeutung und echte syntaktische Mehrdeutigkeit in den Fußnoten erläutert werden.
