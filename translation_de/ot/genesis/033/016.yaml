  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: de
  text: Da kehrte Esau an jenem Tag auf seinen Weg nach Seïr zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: machte sich … wieder auf den Weg
  rationale: שׁוב bezeichnet hier Esaus Wiederaufnahme beziehungsweise Umkehr zu seiner Reise. Zusammen mit לְדַרְכּוֹ gibt die deutsche Wendung den Bewegungsvorgang natürlich wieder, ohne ein Ziel zu ergänzen, das im Text nicht genannt wäre.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Wendung bedeutet wörtlich „an jenem Tag“. Im unmittelbaren Erzählzusammenhang drückt „noch am selben Tag“ den zeitlichen Anschluss idiomatisch und ohne sachliche Bedeutungsänderung aus.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: לְדַרְכּוֹ
  choice: auf den Weg
  rationale: Wörtlich „zu seinem Weg“. In Verbindung mit שׁוב bezeichnet die Formulierung idiomatisch das erneute Antreten beziehungsweise Fortsetzen des Weges.
- source_word: שֵׂעִירָה
  choice: nach Seïr
  rationale: Das Richtungs-he kennzeichnet eine Bewegung auf Seïr zu. Im Deutschen wird dies natürlich mit „nach Seïr“ ausgedrückt.
