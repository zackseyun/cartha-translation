  register: Moderne, klare und zugleich erzählerisch würdevolle Standardsprache. Die kombinierte Wiedergabe von וַיָּשָׁב und לְדַרְכּוֹ vermeidet das im Deutschen schwerfällige „kehrte zu seinem Weg zurück“.
