  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: de
  text: Und er kaufte das Stück Land, auf dem er sein Zelt aufgeschlagen hatte, von den Söhnen Hamors, des Vaters Sichems, für hundert Kesita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Kesita; ein altes Zahlungsmittel oder eine Werteinheit, deren genauer Wert unbekannt ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: kaufte
  rationale: קנה bezeichnet im Zusammenhang mit dem genannten Kaufpreis den Erwerb durch Kauf; „kaufte“ ist im modernen Deutsch klar und natürlich.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: das Stück Land
  rationale: חֶלְקָה bezeichnet ein abgegrenztes Stück beziehungsweise einen Anteil; zusammen mit שׂדה ist „das Stück Land“ natürlich, ohne eine genauere rechtliche Kategorie vorauszusetzen.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: auf dem er sein Zelt aufgeschlagen hatte
  rationale: נטה mit אֹהֶל ist die übliche Wendung für das Aufschlagen eines Zeltes. Das Plusquamperfekt macht deutlich, dass dies vor dem Kauf geschehen war.
- source_word: מִיַּד
  choice: von
  rationale: Das wörtliche „aus der Hand von“ bezeichnet hier den Übergang aus dem Besitz oder der Verfügungsgewalt der Verkäufer. Im Deutschen gibt „von“ die Kaufbeziehung idiomatisch und ohne Bedeutungsverlust wieder.
- source_word: בְּנֵי חֲמוֹר
  choice: die Söhne Hamors
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: אֲבִי שְׁכֶם
  choice: des Vaters von Sichem
  rationale: Die Apposition identifiziert Hamor als den Vater Sichems. Die Formulierung bewahrt diese Zuordnung ausdrücklich.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: für hundert Kesita
  rationale: קְשִׂיטָה bezeichnet ein altes Zahlungsmittel beziehungsweise eine Werteinheit unbekannten genauen Werts. Die Transliteration vermeidet eine unbelegte Gleichsetzung mit Münzen, Silberstücken oder einem modernen Gewicht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Erzählstil, während „von“ statt der im Deutschen schwerfälligen wörtlichen Wendung „aus der Hand von“ idiomatische Verständlichkeit gewährleistet. Der unbestimmbare Zahlungsbegriff wird transliteriert und in der Fußnote erläutert.
