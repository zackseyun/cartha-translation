lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: kamen … näher
  rationale: Das Wayyiqtol der 3. Person Plural feminin von נגשׁ bezeichnet die nächste Handlung im Erzählablauf und eine Annäherung; „kamen näher“ ist natürliches modernes Deutsch.
- source_word: הַשְּׁפָחוֹת
  choice: die Dienerinnen
  rationale: שִׁפְחָה bezeichnet weibliche Bedienstete beziehungsweise unfreie Frauen. „Dienerinnen“ gibt Geschlecht und soziale Unterordnung verständlich wieder, ohne altertümlich zu klingen.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: die Dienerinnen und ihre Kinder
  rationale: Das selbstständige Pronomen הֵנָּה hebt die Dienerinnen hervor und verbindet sie appositionell mit ihren Kindern. Im Deutschen gibt die koordinierte Form den gemeinsamen Handlungsträger am natürlichsten wieder.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: warfen sich nieder
  rationale: Die Form bezeichnet eine tiefe körperliche Verbeugung als Ehrerbietung. „Sich niederwerfen“ bringt den stärkeren körperlichen Gestus genauer zum Ausdruck als bloßes „sich verbeugen“.
