  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Erzählung präzise wieder: Die Dienerinnen treten mit ihren Kindern heran und vollziehen anschließend eine Geste der Ehrerbietung. „Kamen näher“ entspricht נגשׁ angemessen; die zusammenfassende deutsche Subjektgruppe gibt die hebräische appositionelle Verbindung „die Dienerinnen, sie und ihre Kinder“ idiomatisch wieder. „Warfen sich nieder“ deckt den in השתחוה ausgedrückten tiefen Huldigungsakt zuverlässig ab.'
