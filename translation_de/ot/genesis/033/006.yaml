translation:
  language: de
  text: Dann kamen die Dienerinnen und ihre Kinder näher und warfen sich nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbeugten sich tief“.'
