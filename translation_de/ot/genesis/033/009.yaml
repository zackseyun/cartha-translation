  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: de
  text: 'Doch Esau sagte[a]: „Ich habe viel, mein Bruder. Was dir gehört, soll dir gehören.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da sagte Esau: Ich habe genug, mein Bruder. Was dir gehört, soll dir gehören.“'
    reason: 'Lexikalische und syntaktische Alternative: Das einleitende ו kann neutral mit „da“ wiedergegeben werden; רָב kann im Kontext „genug“ bedeuten. Die Schlussformulierung gibt den Jussiv von היה formnah wieder.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; „doch“ gibt zugleich den milden Gegensatz wieder, da Esau Jakobs Gabe zunächst ablehnt.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: יֶשׁ לִי רָב
  choice: Ich habe reichlich
  rationale: Die Besitzkonstruktion יֵשׁ לִי mit רָב bezeichnet vorhandenen Überfluss beziehungsweise eine große Menge. „Ich habe reichlich“ klingt natürlich und bewahrt diesen Akzent stärker als das bloße „genug“.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Die Anrede mit Suffix der ersten Person wird wörtlich und natürlich wiedergegeben und bewahrt den warmen Beziehungston.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: Behalte, was dir gehört
  rationale: Der Jussiv von היה hat hier im Zusammenhang die höflich erlaubende Bedeutung, dass Jakob seinen Besitz behalten soll. Die deutsche Formulierung gibt diese Funktion natürlich wieder, ohne den Sinn von Dauer ausdrücklich hinzuzufügen.
