  register: Modernes, würdiges Standarddeutsch. „Behalte“ ist idiomatisch und bildet die höfliche Ablehnung der Gabe im Kontext ab; die Fußnote bewahrt eine formnähere Wiedergabe und die Alternative „genug“.
