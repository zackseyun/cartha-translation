  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: de
  text: 'Da fragte Esau: „Was hat es mit diesem ganzen Zug auf sich, dem ich begegnet bin?“ Jakob antwortete: „Um die Gunst meines Herrn zu gewinnen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Gunst in den Augen meines Herrn zu finden“. „Mein Herr“ ist hier Jakobs ehrerbietige Anrede an Esau.'
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: Was soll
  rationale: Die Wendung fragt hier im Zusammenhang nicht nach der Identität, sondern nach Sinn und Zweck des vorausgeschickten Zuges.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: dieser ganze Zug
  rationale: מַחֲנֶה kann „Lager“ bedeuten, bezeichnet hier aber die gesamte vorausgeschickte Gruppe aus Herden und Knechten. „Zug“ gibt den bewegten Verband im Deutschen natürlich wieder.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: dem ich begegnet bin
  rationale: פָּגַשׁ bedeutet „begegnen“ oder „antreffen“; die Formulierung entspricht Esaus Zusammentreffen mit dem vorausgeschickten Zug.
- source_word: לִמְצֹא חֵן
  choice: sollte mir die Gunst … sichern
  rationale: Der Infinitiv mit לְ bezeichnet den Zweck. „Gunst sichern“ gibt die idiomatische Bedeutung von „Gunst finden“ in natürlichem Deutsch wieder.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: meines Herrn
  rationale: Wörtlich heißt die Wendung „in den Augen meines Herrn“. Gemeint ist die wohlwollende Beurteilung Esaus; אֲדֹנִי ist hier eine ehrerbietige Anrede an Esau, kein Gottesname.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausdrücklich genannten Sprecher ersetzen das wiederholte hebräische „er sagte“, um die Zuordnung im Deutschen klar und flüssig zu machen. Die soziale Ehrerbietung Jakobs bleibt durch „meines Herrn“ erhalten.
