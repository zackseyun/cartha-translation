base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: de
  text: 'Er blickte auf und sah die Frauen und die Kinder. Da fragte er: »Wer sind diese bei dir?« Jakob antwortete: »Es sind die Kinder, die Gott deinem Diener aus Gnade geschenkt hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: Er erhob seine Augen
  rationale: Die hebräische Wendung bezeichnet das Aufblicken. Die bildhafte Form bleibt erhalten und ist im Deutschen verständlich.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: Der Ausgangstext verwendet den allgemeinen Ausdruck »Frauen« und bezeichnet sie hier nicht ausdrücklich als Ehefrauen.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: Dies ist in diesem Zusammenhang die natürliche Wiedergabe und passt zu beiden Vorkommen im Vers.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Wer sind diese bei dir?
  rationale: Das לָּךְ lautet wörtlich »dir/für dich«; idiomatisch wird nach der Identität beziehungsweise Beziehung der Personen gefragt, die Jakob begleiten.
- source_word: חָנַן
  choice: aus Gnade geschenkt hat
  rationale: Das Verb bezeichnet eine gnädige Zuwendung oder Gunst. »Aus Gnade geschenkt« bewahrt sowohl den Geschenkcharakter als auch die Nuance göttlicher Gunst.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: Jakob verwendet eine ehrerbietige Selbstbezeichnung gegenüber Esau. »Diener« gibt diese Höflichkeitsform angemessen wieder, ohne hier einen Sklavenstatus festzulegen.
theological_decisions:
- issue: Göttliche Gunst bei der Gabe der Kinder
  choice: Die Kinder werden als Geschenk bezeichnet, das Gott Jakob aus Gnade zugewandt hat.
  alternative: »die Gott deinem Diener gegeben hat«
  rationale: חָנַן trägt ausdrücklich die Bedeutung gnädiger Zuwendung. Die gewählte Fassung bewahrt diese Aussage, ohne sie dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel von »er« zu »Jakob« im zweiten Redeeinleiter klärt den Sprecher, da das Deutsche bei zwei männlichen Gesprächspartnern sonst unnötig mehrdeutig wäre. Die Wiederholung »und er sagte« wird dabei natürlich wiedergegeben.
