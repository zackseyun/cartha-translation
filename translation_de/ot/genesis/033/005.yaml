  rationale: Die einzige sichere Verbesserung betrifft die idiomatische Wiedergabe von וַיִּשָּׂא אֶת־עֵינָיו. Die Sprecherklärung „Jakob antwortete“ bleibt bestehen, weil sie die referentielle Klarheit im Deutschen verbessert. Es sind keine Fußnoten erforderlich; die gewählte Fassung behandelt weder eine textkritische Unsicherheit noch eine für die Übersetzung notwendige, nicht im Text ausdrückbare Alternative.
