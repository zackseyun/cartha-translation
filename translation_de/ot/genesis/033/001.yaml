    issue: Die lebhafte Hinweispartikel וְהִנֵּה ist nur indirekt durch einen Doppelpunkt wiedergegeben.
    rationale: Der Doppelpunkt kann die Präsentation andeuten, doch „Da kam Esau“ gibt die unvermittelte, aufmerksamkeitslenkende Darstellung im modernen Deutsch klarer wieder.
  - severity: medium
    issue: „verteilte Jakob die Kinder auf Lea, Rahel und die beiden Dienerinnen“ ist syntaktisch und idiomatisch problematisch.
    rationale: Im Deutschen werden Kinder nicht natürlich „auf“ Personen verteilt. Das Hebräische meint ihre Zuteilung zu den jeweiligen Frauen bzw. Gruppen.
  revised_text: 'Jakob blickte auf und sah: Da kam Esau, und bei ihm waren vierhundert Männer. Dann teilte er die Kinder Lea, Rahel und den beiden Dienerinnen zu.'
