  verdict: revise
  source_fidelity: Die Grundbedeutung wird weitgehend getroffen. Die präsentierende Partikel וְהִנֵּה sollte jedoch deutlicher als bloßer Doppelpunkt hervortreten; außerdem bezeichnet die abschließende Konstruktion die Zuordnung der Kinder zu den drei Frauengruppen, nicht einfach ein Verteilen „auf“ Personen.
  naturalness: „Die Kinder auf Lea, Rahel und die beiden Dienerinnen verteilen“ ist im heutigen Standarddeutsch nicht idiomatisch. „Lea, Rahel und den beiden Dienerinnen zuteilen“ ist klar und natürlich.
  terminology: „Jakob“, „Esau“, „Lea“ und „Rahel“ sind korrekt. „Dienerinnen“ ist als moderne, nicht überpräzisierende Wiedergabe von שְׁפָחוֹת vertretbar.
  issues:
