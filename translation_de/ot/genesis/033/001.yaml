base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: de
  text: 'Jakob blickte auf und sah: Da kam Esau, und bei ihm waren vierhundert Männer. Dann teilte er die Kinder Lea, Rahel und den beiden Dienerinnen zu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Dann blickte Jakob auf und sah
  rationale: Die hebräische Wendung bezeichnet das Erheben des Blicks. „Blickte … auf und sah“ gibt sowohl die Blickbewegung als auch das anschließende Wahrnehmen natürlich wieder.
- source_word: וְהִנֵּה
  choice: Doppelpunkt nach „sah“
  rationale: Der Doppelpunkt übernimmt hier die präsentierende und Aufmerksamkeit weckende Funktion von הִנֵּה, ohne das im heutigen Deutsch stark altertümliche „siehe“ zu verwenden.
- source_word: בָּא
  choice: kam
  rationale: Das Partizip zeigt Esau im Herankommen. Im erzählenden deutschen Kontext kann „kam“ diesen gerade wahrgenommenen Vorgang knapp und natürlich ausdrücken.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: und bei ihm waren vierhundert Männer
  rationale: Die Formulierung bewahrt die Begleitung Esaus und die auffällige Größe der Gruppe.
- source_word: וַיַּחַץ
  choice: verteilte
  rationale: Das Verb bezeichnet hier die Aufteilung der Kinder in Gruppen, die den jeweiligen Frauen zugeordnet werden.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: Dies ist im Zusammenhang mit Jakobs Familie die klare und übliche deutsche Entsprechung.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: auf Lea, Rahel und die beiden Dienerinnen
  rationale: Das wiederholte עַל bezeichnet hier die Verteilung beziehungsweise Zuordnung der Kinder zu den Frauen. „Dienerinnen“ ist verständlich und lässt den genauen sozialen und rechtlichen Status offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte Präsentation durch וְהִנֵּה wird syntaktisch mit einem Doppelpunkt wiedergegeben; unnötig altertümliche Bibelsprache wird vermieden.
