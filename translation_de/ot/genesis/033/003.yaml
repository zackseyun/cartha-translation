  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: de
  text: Er selbst aber ging ihnen voraus und verbeugte sich siebenmal bis zur Erde[a], bis er seinem Bruder nahe kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warf sich nieder“; das hebräische Verb kann eine vollständige Niederwerfung als Ehrerweisung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Er selbst aber
  rationale: Das selbstständige Pronomen hebt Jakob als Handelnden hervor; „selbst“ bewahrt diese Betonung, während „aber“ den Übergang von der vorausgehenden Gruppe zu Jakob natürlich markiert.
- source_word: עָבַר לִפְנֵיהֶם
  choice: ging ihnen voraus
  rationale: Im Zusammenhang bezeichnet die Wendung, dass Jakob vor seine Familie tritt und die Führung übernimmt; die Formulierung ist zugleich präzise und natürlich.
- source_word: וַיִּשְׁתַּחוּ
  choice: verbeugte sich
  rationale: Das Verb kann eine tiefe Verbeugung bis hin zum Niederwerfen als Ehrerweisung bezeichnen. „Verbeugte sich“ vermeidet eine religiöse Überdeutung; die Ergänzung „bis zur Erde“ verdeutlicht die Tiefe der Bewegung.
- source_word: אַרְצָה
  choice: bis zur Erde
  rationale: Die Richtungsform bezeichnet eine Bewegung erdwärts. „Bis zur Erde“ gibt das konkrete Ziel idiomatisch wieder.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Direkte und natürliche Wiedergabe der Zahlenangabe.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: bis er nahe zu seinem Bruder gekommen war
  rationale: Die Konstruktion bezeichnet den Endpunkt des wiederholten Verbeugens während Jakobs Annäherung. Die Wiedergabe erhält den Aspekt des Nahens, ohne das zweite עַד unnatürlich zu verdoppeln.
