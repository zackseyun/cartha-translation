  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: de
  text: Er stellte die Sklavinnen und ihre Kinder an die Spitze[a], Lea und ihre Kinder dahinter und Rahel und Josef ganz nach hinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Dienerinnen«; das hebräische Wort bezeichnet weibliche Hausbedienstete und kann insbesondere Frauen in unfreier Stellung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte
  rationale: שׂוּם bedeutet hier »stellen, platzieren, anordnen«; »stellte« passt natürlich zur räumlichen Anordnung der Personen.
- source_word: הַשְּׁפָחוֹת
  choice: die Mägde
  rationale: שִׁפְחָה bezeichnet weibliche Hausbedienstete von niedrigem, teils unfreien Status. »Mägde« ist im biblischen Erzählzusammenhang verständlich, ohne den rechtlichen Status stärker festzulegen als der Ausdruck selbst.
- source_word: יַלְדֵיהֶן
  choice: ihre Kinder
  rationale: יֶלֶד ist hier geschlechtsübergreifend und wird daher nicht auf »Söhne« verengt.
- source_word: רִאשֹׁנָה
  choice: nach vorn
  rationale: Die adverbial gebrauchte Form bezeichnet die erste beziehungsweise vorderste Stellung in der räumlichen Reihenfolge.
- source_word: וְאֶת לֵאָה וִילָדֶיהָ אַחֲרֹנִים
  choice: Lea und ihre Kinder dahinter
  rationale: אַחֲרֹנִים bezeichnet bei der mittleren Gruppe die Stellung hinter der ersten Gruppe; »dahinter« gibt die räumliche Staffelung klar wieder.
- source_word: וְאֶת רָחֵל וְאֶת יוֹסֵף אַחֲרֹנִים
  choice: Rahel und Josef ganz nach hinten
  rationale: Beim letzten Glied der dreiteiligen Anordnung bezeichnet אַחֲרֹנִים die hinterste Position; »ganz nach hinten« macht dies idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die räumliche Reihenfolge wird durch »nach vorn – dahinter – ganz nach hinten« natürlich und präzise wiedergegeben.
