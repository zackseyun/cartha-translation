  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: de
  text: 'Jakob sagte: „Nein, bitte! Wenn ich Gunst in deinen Augen gefunden habe, dann nimm mein Geschenk aus meiner Hand an. Denn ich habe dein Angesicht gesehen, als sähe ich Gottes Angesicht[a], und du hast mich wohlwollend angenommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „das Angesicht eines Gottes“. Im Zusammenhang mit Jakobs vorausgehender Gottesbegegnung bei Penuël liegt jedoch „Gottes Angesicht“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: Gunst
  rationale: Die feste Wendung „Gunst in jemandes Augen finden“ bewahrt das hebräische Bild und bezeichnet hier persönliche wohlwollende Annahme, ohne einen stärker dogmatisch geprägten Begriff einzutragen.
- source_word: מִנְחָתִי
  choice: mein Geschenk
  rationale: Im Zusammenhang ist Jakobs versöhnlich gemeinte Gabe an Esau bezeichnet. „Geschenk“ ist verständlich und vermeidet die kultische Nebenbedeutung von „Opfergabe“.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die konkrete hebräische Ausdrucksweise passt zur persönlichen Übergabe und ist im Deutschen verständlich.
- source_word: כִּי עַל־כֵּן
  choice: Denn
  rationale: Die Verbindung leitet hier die Begründung für Jakobs Bitte ein. Das schlichte „Denn“ gibt die Diskursfunktion in natürlichem Deutsch wieder, ohne die schwierige hebräische Fügung künstlich nachzubilden.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: wie man Gottes Angesicht sieht
  rationale: Die Formulierung erhält den Vergleich sowie das wiederholte Motiv des Angesichts. Im Erzählzusammenhang, besonders nach Penuël, ist „Gott“ der wahrscheinlichste Bezug.
- source_word: וַתִּרְצֵנִי
  choice: du hast mich wohlwollend angenommen
  rationale: Die Wiedergabe umfasst sowohl Annahme als auch Wohlgefallen und schließt inhaltlich an die zuvor genannte Gunst an.
- source_word: אַל נָא אִם נָא
  choice: Nein, bitte! Wenn
  rationale: Dies gibt Jakobs höfliche, aber nachdrückliche Ablehnung und die anschließende Bitte in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezug von אֱלֹהִים im Vergleich
  choice: Gott
  alternative: ein Gott / ein göttliches Wesen
  rationale: Obwohl אֱלֹהִים einen weiteren Bedeutungsumfang haben kann, spricht der unmittelbare Erzählzusammenhang nach Jakobs Gottesbegegnung in Penuël deutlich für „Gott“. Der auffällige Vergleich wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ wurde statt „Gesicht“ gewählt, um die wiederholte פָּנִים-Bildsprache und die feierliche theologische Resonanz zu bewahren; die übrige Syntax bleibt gegenwärtig und gut verständlich.
