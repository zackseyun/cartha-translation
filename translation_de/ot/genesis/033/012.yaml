  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: de
  text: 'Da sagte er: „Lass uns aufbrechen und weiterziehen; ich werde vor dir hergehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte er“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: נִסְעָה
  choice: Lass uns aufbrechen
  rationale: Die Kohortativform der 1. Person Plural drückt einen Vorschlag aus; „aufbrechen“ passt zum Reisekontext.
- source_word: וְנֵלֵכָה
  choice: und weiterziehen
  rationale: הלך bezeichnet hier das Fortbewegen auf einer Reise. „Weiterziehen“ gibt dies idiomatisch wieder und vermeidet die schwerfällige Wiederholung „aufbrechen und gehen“.
- source_word: וְאֵלְכָה
  choice: ich werde … hergehen
  rationale: Die Form der 1. Person Singular bezeichnet im Zusammenhang Esaus angekündigte eigene Bewegung; die Zukunftsform wahrt dies besser als eine Aufforderung wie „lass mich gehen“.
- source_word: לְנֶגְדֶּךָ
  choice: vor dir
  rationale: נגד kann „vor“, „gegenüber“ oder „in Entsprechung zu“ bedeuten. Im Reisekontext ist „vor dir“ eine naheliegende räumliche Wiedergabe, ohne die im Hebräischen nicht völlig eindeutige Nuance stärker auszubauen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Reiseaufforderung bleibt erhalten; „weiterziehen“ ist idiomatisch und kontextgerecht. Die räumliche Wendung wird knapp als „vor dir“ wiedergegeben.
