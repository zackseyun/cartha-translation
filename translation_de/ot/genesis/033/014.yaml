base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: de
  text: Mein Herr möge doch seinem Diener vorausziehen. Ich aber will langsam weiterziehen, nach dem Schritt des Viehs, das vor mir ist,[a] und nach dem Schritt der Kinder, bis ich zu meinem Herrn nach Seïr komme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Vieh“ übersetzte hebräische Wort bedeutet sonst oft „Arbeit“, „Besitz“ oder „Habe“; hier sind wahrscheinlich die mitgeführten Tiere gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: möge doch … vorausziehen
  rationale: Der Jussiv mit נָא formuliert eine höfliche Bitte; „möge doch“ bewahrt den ehrerbietigen Ton, „vorausziehen“ die Bewegungsrichtung.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Jakob redet Esau ehrerbietig an. „Mein Herr“ erhält diese soziale Anrede, ohne einen Gottesbezug nahezulegen.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: seinem Diener voraus
  rationale: Die räumliche Wendung bedeutet hier, dass Esau vor Jakob weiterziehen soll; die Selbstbezeichnung als Diener bleibt erhalten.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: ich will langsam weiterziehen
  rationale: Das Hitpael von נהל kann ein behutsames, geregeltes Weiterziehen bezeichnen. Die Übersetzung vermeidet die Überfestlegung, Jakob werde ausdrücklich andere führen.
- source_word: לְרֶגֶל
  choice: nach dem Schritt
  rationale: Wörtlich „nach dem Fuß“ bezeichnet die Wendung ein Tempo, das sich am Gang der Tiere und Kinder ausrichtet. „Nach dem Schritt“ erhält das konkrete Bild.
- source_word: הַמְּלָאכָה
  choice: das Vieh
  rationale: מְלָאכָה bedeutet häufig „Arbeit“, „Besitz“ oder „Habe“, bezeichnet im Hirtenkontext aber wahrscheinlich den mitgeführten Tierbestand.
- source_word: אֲשֶׁר לְפָנַי
  choice: das vor mir herzieht
  rationale: Die räumliche Aussage wird natürlich wiedergegeben; „herzieht“ ergibt sich aus dem Reise- und Herdentriebkontext.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: Die gewöhnliche und kontextgemäße Bezeichnung für Jakobs mitreisende Kinder.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: bis ich zu meinem Herrn nach Seïr komme
  rationale: „Zu meinem Herrn“ bewahrt אֶל אֲדֹנִי; „nach Seïr“ gibt die Richtungsendung des Ortsnamens wieder und lässt offen, ob Esau oder Seïr syntaktisch stärker als Ziel hervorgehoben ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ehrerbietige Selbstbezeichnung „Diener“ und die wiederholte Anrede „mein Herr“ bleiben erhalten. Das konkrete hebräische Bild „nach dem Schritt“ wird gegenüber dem glatteren „im Tempo“ bevorzugt.
