  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: de
  text: Jakob kam wohlbehalten zur Stadt Sichem[a] im Land Kanaan, als er aus Paddan-Aram kam, und lagerte vor der Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jakob kam nach Salem, einer Stadt Sichems.« Das hebräische Wort שָׁלֵם (schalem) kann entweder »wohlbehalten/in Frieden« bedeuten oder als Ortsname »Salem« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Die narrative Wayyiqtol-Form von בוא bezeichnet Jakobs Ankunft; »kam« ist im Deutschen schlicht und idiomatisch.
- source_word: שָׁלֵם
  choice: wohlbehalten
  rationale: Als prädikativ beziehungsweise adverbial gebrauchtes Adjektiv bezeichnet das Wort hier am ehesten Jakobs unversehrte, sichere Ankunft. Die mögliche Lesung als Ortsname wird in einer Fußnote bewahrt.
- source_word: עִיר שְׁכֶם
  choice: zur Stadt Sichem
  rationale: Die Verbindung aus עִיר und dem Eigennamen שְׁכֶם bezeichnet natürlich die Stadt Sichem; »zur« ergibt sich aus dem deutschen Ausdruck »zu einer Stadt kommen«.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: im Land Kanaan
  rationale: Der Relativsatz lokalisiert Sichem. Die knappe attributive Fassung ist natürliches Deutsch und bewahrt die geografische Aussage.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: als er aus Paddan-Aram kam
  rationale: 'ב mit Infinitivus constructus und Suffix hat temporale Bedeutung: »als/bei seinem Kommen«. Die Wiederholung von »kam« spiegelt die Wiederholung der hebräischen Wurzel בוא und bleibt im Deutschen verständlich.'
- source_word: פַּדַּן אֲרָם
  choice: Paddan-Aram
  rationale: Der geografische Eigenname wird in geläufiger deutscher Transliteration mit Bindestrich wiedergegeben.
- source_word: וַיִּחַן
  choice: lagerte
  rationale: Das Verb bedeutet hier, ein Lager aufzuschlagen beziehungsweise zu lagern; »lagerte« ist knapp, würdig und natürlich.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: vor der Stadt
  rationale: Die Wendung bezeichnet den Bereich vor beziehungsweise gegenüber der Stadt; »vor der Stadt« gibt den räumlichen Sinn idiomatisch wieder.
