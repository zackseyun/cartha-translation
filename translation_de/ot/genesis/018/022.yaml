  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: de
  text: Da wandten sich die Männer von dort ab und gingen nach Sodom; Abraham aber stand noch vor Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige alte Textzeugen lesen: „Yahweh aber stand noch vor Abraham.“ Der masoretische hebräische Text lautet: „Abraham aber stand noch vor Yahweh.“'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: wandten sich … von dort ab
  rationale: פנה bezeichnet hier im Zusammenhang mit מִשָּׁם die Richtungsänderung und das Fortgehen. Die deutsche Wendung gibt die erzählerische Bewegung natürlich wieder.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Wort bezeichnet sie an der Textoberfläche schlicht als Männer; ihre weitergehende Identität wird nicht in die Übersetzung eingetragen.
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: gingen in Richtung Sodom
  rationale: Die Richtungsendung an סְדֹמָה bezeichnet eine Bewegung auf Sodom zu. „In Richtung Sodom“ bewahrt diese Nuance, ohne bereits die Ankunft auszudrücken.
- source_word: וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד
  choice: Abraham aber stand noch
  rationale: עוֹדֶנּוּ zusammen mit dem Partizip bezeichnet einen fortdauernden Zustand. „Stand noch“ ist im deutschen Erzählstil knapp und natürlich; וְ markiert hier den Gegensatz zur Bewegung der Männer.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition kann sowohl die räumliche Stellung als auch die Gegenwart einer Person ausdrücken. „Vor“ erhält diese Bedeutungsbreite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der hebräische Text bietet den Gottesnamen יהוה. Die Wiedergabe als „Yahweh“ erhält ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Yahweh“ gibt den persönlichen Gottesnamen wieder, während „der HERR“ eine traditionelle Ersatzlesung ist.
- issue: Textform des letzten Satzteils
  choice: Abraham stand noch vor Yahweh
  alternative: Yahweh stand noch vor Abraham
  rationale: Der vorgegebene masoretische Text lautet eindeutig „Abraham … stand vor Yahweh“. Die abweichende alte Überlieferung wird wegen ihrer textkritischen Bedeutung in der Fußnote bewahrt, nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit „Abraham aber“ macht den erzählerischen Gegensatz deutlich. Der Haupttext folgt dem WLC; die echte textkritische Alternative bleibt in der Fußnote sichtbar.
