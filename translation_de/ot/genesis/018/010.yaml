base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: de
  text: 'Da sagte er: »Ich werde ganz gewiss um diese Zeit im nächsten Jahr[a] wieder zu dir kommen; und siehe: Deine Frau Sara wird einen Sohn haben.« Sara aber hörte am Eingang des Zeltes zu; dieser lag hinter ihm.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um die Zeit des Lebens«; gemeint ist offenbar die entsprechende Zeit im folgenden Jahr.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte hebräische Satzteil lautet knapp: »und er/es war hinter ihm«. Das Pronomen kann sich auf den Zelteingang oder das Zelt beziehen; die räumliche Zuordnung ist daher nicht völlig eindeutig.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative Wayyiqtol wird in natürlichem deutschem Erzählstil wiedergegeben; das unbestimmte männliche Subjekt bleibt erhalten.
- source_word: שׁוֹב אָשׁוּב
  choice: Ich werde ganz gewiss … wiederkommen
  rationale: Infinitivus absolutus und Imperfekt desselben Verbs verstärken die Zusage; »ganz gewiss« bildet den Nachdruck idiomatisch ab.
- source_word: כָּעֵת חַיָּה
  choice: um diese Zeit im nächsten Jahr
  rationale: Die feste Wendung bezeichnet im Kontext die entsprechende Zeit des folgenden Jahres. Die idiomatische Wiedergabe ist verständlich, während eine Fußnote die ungewöhnliche hebräische Formulierung erkennen lässt.
- source_word: וְהִנֵּה
  choice: dann
  rationale: Die Aufmerksamkeitspartikel leitet hier den angekündigten, bei der Rückkehr vorliegenden Sachverhalt ein. »Dann« gibt ihre präsentierende Funktion im modernen Deutschen natürlich wieder, ohne ein altertümliches »siehe« zu erzwingen.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: deine Frau Sara wird einen Sohn haben
  rationale: Das ל bezeichnet hier den Besitz beziehungsweise das Zuteilwerden in der Geburtsverheißung; die deutsche Satzstruktur drückt dies klar aus.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Sara aber hörte … zu
  rationale: Das Partizip schildert eine gleichzeitig andauernde Handlung. »Zuhören« passt zur Szene besser als das bloße Wahrnehmen mit »hören«.
- source_word: פֶּתַח הָאֹהֶל
  choice: am Eingang des Zeltes
  rationale: Die Constructusverbindung bezeichnet den Ort an der Zeltöffnung und wird nah am Hebräischen, aber idiomatisch wiedergegeben.
- source_word: וְהוּא אַחֲרָיו
  choice: hinter ihm
  rationale: Im Satzzusammenhang bezeichnet die Wendung Saras beziehungsweise des Zelteingangs Lage hinter dem Sprecher. Die knappe Hauptfassung bewahrt den räumlichen Sinn; die grammatische Mehrdeutigkeit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Identität des Sprechers
  choice: Das Subjekt bleibt »er«.
  alternative: »Der HERR sagte« oder »Einer der Männer sagte«
  rationale: Der hebräische Vers nennt hier nur ein unausgedrücktes männliches Singularsubjekt. Eine genauere Benennung würde die Identität aus dem weiteren Zusammenhang in diesen Satz eintragen.
- issue: Bezug von וְהוּא אַחֲרָיו
  choice: Die räumliche Aussage wird als »hinter ihm« an Saras Standort angeschlossen.
  alternative: »und er war hinter ihm« beziehungsweise »und es war hinter ihm«
  rationale: Die hebräischen Pronomen sind äußerst knapp, und der Bezug von הוּא ist nicht völlig eindeutig. Die Hauptfassung gibt den wahrscheinlichen Szenensinn wieder, ohne die formale Mehrdeutigkeit in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die emphatische Zusage bleibt hörbar; ungewohnte hebräische Idiomatik und die Pronomenmehrdeutigkeit werden nicht dogmatisch aufgelöst, sondern in Fußnoten dokumentiert.
