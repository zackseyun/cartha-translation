base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: de
  text: '„Lasst mich etwas Brot[a] holen, damit ihr euch stärken könnt[b]. Danach könnt ihr weiterziehen; denn deshalb seid ihr bei eurem Diener vorbeigekommen.“ Sie sagten: „Ja, mach es so, wie du gesagt hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ein Bissen Brot“. Die hebräische Wendung ist im Zusammenhang der Gastfreundschaft eine bescheidene Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „stützt/stärkt euer Herz“. Die hebräische Redewendung meint, sich durch Essen zu stärken.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Ich will … holen
  rationale: Der Kohortativ drückt Abrahams höfliches Anerbieten aus. „Ich will … holen“ gibt diesen Willens- und Angebotscharakter in natürlichem Deutsch wieder.
- source_word: פַת לֶחֶם
  choice: ein Stück Brot
  rationale: Die Wendung bezeichnet eine kleine Portion Brot und wirkt im Rahmen der Gastfreundschaft bewusst bescheiden. „Ein Stück Brot“ ist modern, klar und wahrt diese Untertreibung.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: damit ihr euer Herz stärkt
  rationale: Die hebräische Redeweise spricht wörtlich vom Stützen oder Stärken des Herzens und meint die Kräftigung durch Nahrung. Die Übersetzung bewahrt das Körperbild, ohne den Sinn zu verdecken.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: Danach könnt ihr weiterziehen
  rationale: עבר bezeichnet hier die Fortsetzung der Reise. „Weiterziehen“ ist im Deutschen kontextgerecht und gibt die erlaubende Nuance passend wieder.
- source_word: כִּי עַל כֵּן
  choice: denn darum
  rationale: Die Verbindung begründet Abrahams Einladung. „Denn darum“ erhält die knappe, etwas zugespitzte Begründung, ohne sie weiter auszudeuten.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: seid ihr bei eurem Diener vorbeigekommen
  rationale: Die Formulierung hält sich eng an das Verb עבר und bewahrt Abrahams ehrerbietige Selbstbezeichnung als „euer Diener“.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: Ja, mach es so, wie du gesagt hast
  rationale: כֵּן bringt knappe Zustimmung zum Ausdruck und wird zugleich durch „so“ aufgenommen. Die Formulierung klingt als unmittelbare Antwort natürlich.
