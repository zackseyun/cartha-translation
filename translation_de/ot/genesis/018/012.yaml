base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: de
  text: 'Da lachte Sara in sich hinein und sagte sich: »Sollte ich, nachdem ich verblüht bin, noch Lust empfinden[a], und mein Herr ist alt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wonne erleben«; möglicherweise ist erneute sexuelle Lust oder jugendliche Lebenskraft gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: lachte
  rationale: צחק bedeutet im Qal gewöhnlich „lachen“. Der Zusammenhang beschreibt Saras innere Reaktion, ohne das Lachen ausdrücklich als Spott festzulegen.
- source_word: בְּקִרְבָּהּ
  choice: in sich hinein
  rationale: Wörtlich „in ihrem Inneren“. Die deutsche Wendung vermittelt natürlich, dass Saras Lachen und anschließende Rede innerlich bleiben.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv leitet die direkte Rede ein. Dass sie innerlich spricht, ist bereits durch „in sich hinein“ angezeigt.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Nachdem ich verbraucht bin
  rationale: בלה bezeichnet das Abgenutzt- oder Verbrauchtsein. Diese Wiedergabe bewahrt die körperliche Bildhaftigkeit und unterscheidet Saras Zustand von Abrahams ausdrücklich genanntem Alter.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: sollte ich noch Lust empfinden
  rationale: Die seltene Wendung bezeichnet Lust, Wonne oder Wohlgefühl und kann hier körperliche, eheliche oder erneuerte vitale Freude einschließen. Die Formulierung bleibt bewusst breit.
- source_word: עֶדְנָה
  choice: Lust
  rationale: „Lust“ wahrt die wahrscheinlichen körperlich-ehelichen Anklänge, ohne den seltenen Ausdruck ausschließlich als sexuelle Lust oder Fruchtbarkeit auszulegen.
- source_word: וַאדֹנִי
  choice: obwohl auch mein Herr
  rationale: „Mein Herr“ gibt Saras respektvolle Bezeichnung für Abraham wieder, nicht einen Gottestitel. „Obwohl auch“ macht den kontextuellen Gegensatz natürlich sichtbar; das einleitende ו kann hier adversativ verstanden werden.
- source_word: זָקֵן
  choice: alt ist
  rationale: Direkte und gegenwärtig verständliche Wiedergabe des prädikativen Adjektivs.
theological_decisions:
- issue: Bedeutungsumfang von עֶדְנָה
  choice: Breite Wiedergabe „Lust empfinden“
  alternative: „sexuelle Lust empfinden“ oder „wieder jugendliche Lebenskraft haben“
  rationale: Der hebräische Ausdruck hat wahrscheinlich körperliche und eheliche Obertöne, legt sich aber nicht eindeutig auf Sexualgenuss, Verjüngung oder Fruchtbarkeit fest. Der Haupttext bewahrt diese Offenheit; die Fußnote nennt mögliche Nuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In sich hinein lachen“ ist idiomatisch; „verbraucht“ erhält die starke körperliche Metapher des Hebräischen. Die ungewöhnliche Formulierung ist bewusst nicht zu bloßem „alt“ geglättet.
