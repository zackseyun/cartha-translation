- from: 'Da lachte Sara in sich hinein und sagte: »Nachdem ich verbraucht bin, sollte ich noch Lust empfinden[a], obwohl auch mein Herr alt ist?«'
  to: 'Da lachte Sara in sich hinein und sagte sich: »Sollte ich, nachdem ich verblüht bin, noch Lust empfinden[a], und mein Herr ist alt?«'
