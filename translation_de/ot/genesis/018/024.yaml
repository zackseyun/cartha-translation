  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: de
  text: Vielleicht gibt es fünfzig Gerechte mitten in der Stadt.[a] Willst du die Stadt wirklich hinwegfegen und den Ort nicht verschonen um der fünfzig Gerechten willen, die mitten in ihr sind?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Angenommen, es gibt fünfzig Gerechte mitten in der Stadt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: und dem Ort nicht vergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: Vielleicht gibt es
  rationale: Die Verbindung drückt eine vorsichtig vorgebrachte Möglichkeit aus. Die deutsche Formulierung ist natürlich und bewahrt den hypothetischen Charakter von Abrahams Bitte.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: fünfzig Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet gerechte Menschen, ohne die Aussage auf Männer zu beschränken. „Gerechte“ ist im Deutschen knapp, verständlich und bibelsprachlich angemessen.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in der Stadt
  rationale: Die Wendung gibt die Lage innerhalb der Stadt wieder und bewahrt den Nachdruck des hebräischen Ausdrucks.
- source_word: הַאַף תִּסְפֶּה
  choice: Willst du die Stadt wirklich hinwegfegen
  rationale: „Wirklich“ erhält die verstärkende Kraft der rhetorischen Frage. „Hinwegfegen“ gibt das bildhafte Vernichten im Gericht wieder; „die Stadt“ macht im Deutschen den aus dem Zusammenhang erschlossenen Gegenstand eindeutig.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: und den Ort nicht verschonen
  rationale: Im unmittelbaren Gegensatz zur Vernichtung bedeutet נשׂא hier, den Ort vom drohenden Gericht auszunehmen. „Verschonen“ trifft diesen Zusammenhang, ohne die Aussage unnötig auf einen bestimmten Begriff von Vergebung festzulegen.
- source_word: לְמַעַן
  choice: um ... willen
  rationale: Die Formulierung bezeichnet die Gerechten als Grund dafür, den Ort zu verschonen, und wahrt zugleich einen würdigen, geläufigen Stil.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: die mitten in ihr sind
  rationale: Die Relativkonstruktion und der erneute Hinweis auf den Aufenthalt innerhalb der Stadt werden ausdrücklich wiedergegeben.
theological_decisions:
- issue: Bedeutung von נשׂא in der Bitte, den Ort nicht zu vernichten
  choice: verschonen
  alternative: vergeben
  rationale: Der erzählerische Gegensatz besteht zwischen dem Hinwegfegen der Stadt und dem Absehen von ihrer Vernichtung. „Verschonen“ gibt diesen gerichtlichen Sinn am unmittelbarsten wieder; die mögliche Vergebungsnuance wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Eindringlichkeit bleibt erhalten; traditionelle, aber weiterhin verständliche Wendungen wie „um ... willen“ verbinden Genauigkeit mit einem gehobenen Erzählton.
