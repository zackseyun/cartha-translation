  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: de
  text: 'Da sagte er: »Mein Herr, werde bitte nicht zornig![a] Nur noch dieses eine Mal will ich reden. Vielleicht finden sich dort zehn.« Er antwortete: »Um dieser zehn willen werde ich sie nicht vernichten.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Bitte möge mein Herr nicht zornig werden.«'
    reason: Die hebräische Formulierung steht in der dritten Person als ehrerbietige Anrede.
  - marker: b
    text: 'Im Hebräischen steht kein ausdrückliches Objekt: »werde ich nicht vernichten«. Gemeint ist aus dem Zusammenhang die Stadt.'
    reason: Das im deutschen Haupttext verwendete Pronomen ist eine kontextbedingte Ergänzung.
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Mein Herr, werde bitte nicht zornig!
  rationale: Die hebräische Wendung beschreibt aufkommenden beziehungsweise entbrennenden Zorn. Die direkte Bitte ist im heutigen Deutschen natürlich und bewahrt durch „mein Herr“ Abrahams ehrerbietige Anrede; נָא wird mit „bitte“ wiedergegeben.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: Nur noch dieses eine Mal will ich reden
  rationale: Der Kohortativ drückt Abrahams Absicht beziehungsweise Bitte aus, noch einmal zu sprechen. אַךְ begrenzt diese letzte Bitte ausdrücklich auf dieses eine Mal.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: Vielleicht finden sich dort zehn
  rationale: אוּלַי bezeichnet eine Möglichkeit; der Nifal von מצא wird mit dem idiomatischen deutschen „sich finden“ wiedergegeben. Die nicht näher bezeichneten zehn Personen bleiben wie im Hebräischen unausgesprochen.
- source_word: לֹא אַשְׁחִית
  choice: werde ich sie nicht vernichten
  rationale: Der Hifil von שׁחת bedeutet hier „vernichten“. Das im Hebräischen nicht genannte Objekt wird im Deutschen durch das aus dem Kontext erschließbare Pronomen „sie“ aufgenommen, das sich auf die Stadt bezieht.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: um dieser zehn willen
  rationale: Die Formulierung gibt den Grund beziehungsweise die schonende Rücksicht auf die zehn wieder und bewahrt den feierlichen Ton der Fürbitte.
theological_decisions:
- issue: Bezug und Wiedergabe von לַאדֹנָי
  choice: mein Herr
  alternative: der Herr
  rationale: Der Kontext ist eine göttliche Erscheinung, doch das Wort ist hier eine ehrerbietige Anrede und nicht der Gottesname JHWH. „Mein Herr“ bewahrt diese sprachliche Form, ohne die Identität des Angeredeten durch die Übersetzung stärker festzulegen als der Ausdruck selbst.
- issue: Ungenanntes Objekt von לֹא אַשְׁחִית
  choice: sie nicht vernichten
  alternative: nicht vernichten
  rationale: Das Hebräische lässt das Objekt aus. Das feminine Pronomen stellt im Deutschen den kontextuellen Bezug auf die Stadt her, ohne ein zusätzliches Substantiv in den Haupttext einzutragen; die Fußnote macht die Ergänzung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt feierlich, aber ohne altertümliche Verbformen. „Um dieser zehn willen“ bewahrt bewusst den gehobenen Ton und die Logik der Fürbitte.
