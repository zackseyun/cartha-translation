  text: וַ/יְמַהֵ֧ר אַבְרָהָ֛ם הָ/אֹ֖הֱלָ/ה אֶל שָׂרָ֑ה וַ/יֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַ/עֲשִׂ֥י עֻגֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: de
  text: 'Da eilte Abraham ins Zelt zu Sara und sagte: »Schnell! Nimm drei Sea[a] feines Mehl[b], knete es und mach Fladen daraus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Sea war ein altes Hohlmaß für trockene Waren. Drei Sea entsprechen ungefähr 20–22 Litern.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »Mehl, Feinmehl«; gemeint ist hochwertiges, fein gemahlenes Mehl.'
    reason: lexical_note
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: eilte
  rationale: Das Verb bezeichnet schnelles, dringliches Handeln; »eilte« ist natürlich und bewahrt das Erzähltempo.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: ins Zelt zu Sara
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Zelt hin; der Zusammenhang legt nahe, dass Abraham zu Sara ins Zelt geht.
- source_word: מַהֲרִי
  choice: Schnell!
  rationale: Der feminine Singular des Imperativs richtet sich an Sara. Der knappe Ausruf gibt die Dringlichkeit idiomatisch wieder.
- source_word: שְׁלֹשׁ סְאִים
  choice: drei Sea
  rationale: Sea ist die konkrete antike Maßeinheit. Ihre Beibehaltung wahrt die historische Anschaulichkeit; eine Fußnote erklärt die ungefähre Menge.
- source_word: קֶמַח סֹלֶת
  choice: feines Mehl
  rationale: Die Wortverbindung bezeichnet hochwertiges, fein gemahlenes Mehl; »feines Mehl« gibt dies klar und ohne unnötige Überbestimmung wieder.
- source_word: לוּשִׁי
  choice: knete es
  rationale: Das Verb bezeichnet das Kneten. Das Pronomen und das zuvor ergänzte »Nimm« ergeben im Deutschen eine natürliche Anweisung, ohne den Sinn zu verändern.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: mach Fladen daraus
  rationale: עֻגוֹת bezeichnet geformte, wohl flache Brotlaibe oder Fladen. »Fladen« vermeidet die im heutigen Deutschen irreführende Vorstellung von süßem Kuchen.
theological_decisions: []
