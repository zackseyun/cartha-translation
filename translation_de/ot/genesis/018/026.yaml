  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: de
  text: 'Da sagte Jahwe: „Wenn ich in Sodom fünfzig Gerechte mitten in der Stadt finde, werde ich um ihretwillen den ganzen Ort verschonen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich dem ganzen Ort um ihretwillen vergeben“. Das hebräische Verb kann hier ausdrücken, Schuld wegzutragen beziehungsweise vom Gericht abzusehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner gebräuchlichen wissenschaftlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die hebräische Erzählfolge in natürlichem modernem Deutsch wieder.
- source_word: אִם אֶמְצָא
  choice: Wenn ich ... finde
  rationale: Bewahrt die einfache reale Bedingung des hebräischen Satzes.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: fünfzig Gerechte
  rationale: Die substantivierte Personenbezeichnung ist im Deutschen natürlich und legt das grammatische Maskulinum nicht unnötig auf ausschließlich männliche Personen fest.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in der Stadt
  rationale: Gibt die räumliche Bedeutung von בְּתוֹךְ klar und idiomatisch wieder.
- source_word: וְנָשָׂאתִי
  choice: werde ich ... verschonen
  rationale: Im Gerichtskontext bezeichnet das Verb hier das Absehen von der Vernichtung; die mögliche Bedeutung des Vergebens wird in der Fußnote bewahrt.
- source_word: לְכָל הַמָּקוֹם
  choice: den ganzen Ort
  rationale: Bewahrt Umfang und lokalen Bezug des hebräischen Ausdrucks.
- source_word: בַּעֲבוּרָם
  choice: um ihretwillen
  rationale: Gibt den Gedanken wieder, dass der Ort wegen der Gerechten verschont wird, in würdigem und verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn und entspricht der üblichen deutschen Transkription.
- issue: Bedeutung von נָשָׂא im Gerichtskontext
  choice: verschonen
  alternative: vergeben
  rationale: Der unmittelbare Zusammenhang betrifft die drohende Vernichtung Sodoms; „verschonen“ macht diese kontextuelle Wirkung deutlich, während die semantische Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählstil; „um ihretwillen“ hält einen leicht gehobenen, für biblische Rede passenden Ton.
