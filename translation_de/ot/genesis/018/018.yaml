source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: de
  text: Abraham wird ganz gewiss zu einem großen und mächtigen Volk werden, und in ihm werden alle Völker der Erde gesegnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Völker der Erde werden sich mit Abraham segnen“, das heißt, Abraham in einer Segensformel nennen. Die hebräische Verbform kann auch reflexiv verstanden werden; der Haupttext gibt sie passiv wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: wird ganz gewiss … werden
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt die Aussage. „Ganz gewiss“ gibt diese Bekräftigung in natürlichem Deutsch wieder; „werden“ erfasst zusammen mit לְגוֹי den Übergang zu einem Volk.
- source_word: לְגוֹי
  choice: zu einem … Volk
  rationale: גוי bezeichnet hier eine größere Volksgemeinschaft. „Volk“ ist im Deutschen natürlicher als „Nation“, da Letzteres leicht an einen modernen Nationalstaat denken lässt.
- source_word: גָּדוֹל
  choice: großen
  rationale: „Groß“ bewahrt sowohl den zahlenmäßigen als auch den hohen Rang betreffenden Bedeutungsumfang.
- source_word: וְעָצוּם
  choice: und mächtigen
  rationale: עצום kann Stärke, Macht und große Bedeutung ausdrücken. „Mächtig“ wahrt diesen Umfang und bildet eine natürliche Verbindung mit „groß“.
- source_word: וְנִבְרְכוּ
  choice: werden … gesegnet werden
  rationale: 'Der Nifal von ברך lässt sich hier gut passiv verstehen: Die Völker empfangen in Verbindung mit Abraham Segen. Die mögliche reflexive Deutung bleibt in der Fußnote erhalten.'
- source_word: בוֹ
  choice: in ihm
  rationale: Die Präposition ב bezeichnet hier am knappsten den Bereich beziehungsweise die Verbindung, in der der Segen erfolgt. „Durch ihn“ wäre möglich, legt die vermittelnde Funktion aber stärker aus, als es der hebräische Wortlaut allein verlangt.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: Die Wendung hat hier universalen Umfang. „Völker“ entspricht dem Plural von גוי und „Erde“ gibt diesen umfassenden Bezug besser wieder als „Land“.
theological_decisions:
- issue: Deutung der abrahamitischen Segensformel
  choice: 'Die Völker werden in Verbindung mit Abraham als Empfänger des Segens dargestellt: „in ihm … gesegnet werden“.'
  alternative: Die Völker werden sich durch Abraham Segen wünschen beziehungsweise ihn in einer Segensformel als Vorbild nennen.
  rationale: Der Nifal von ברך ist in den Verheißungstexten an die Erzväter umstritten. Die passive Wiedergabe passt gut in den weiteren Zusammenhang, doch die sprachlich mögliche reflexive Deutung wird nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Volk/Völker“ vermeidet die staatsrechtlichen Nebenbedeutungen von „Nation/Nationen“. Die betonte Gewissheit des Hebräischen wird idiomatisch mit „ganz gewiss“ ausgedrückt.
