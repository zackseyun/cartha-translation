  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: de
  text: Dann ging Jahwe[a] fort, nachdem er zu Abraham zu Ende gesprochen hatte, und Abraham kehrte an seinen Ort zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Andere deutsche Wiedergaben sind „der HERR“ oder „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging fort
  rationale: הלך bezeichnet hier im Erzählzusammenhang den Aufbruch nach Abschluss der Begegnung. „Ging fort“ ist natürlich und bewahrt die Bewegungsbedeutung, ohne zusätzliche Einzelheiten einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: nachdem er aufgehört hatte
  rationale: Die Verbindung bezeichnet, dass das Reden vollständig beendet war, bevor Jahwe fortging. Das Plusquamperfekt bildet diese zeitliche Abfolge im Deutschen natürlich ab.
- source_word: לְדַבֵּר אֶל אַבְרָהָם
  choice: mit Abraham zu reden
  rationale: אֶל bedeutet wörtlich „zu“, doch idiomatisches Deutsch verwendet bei einer solchen Gesprächssituation „mit jemandem reden“. Dies gibt den Sinn natürlich wieder, ohne eine einseitige Redeform zwingend festzulegen.
- source_word: שָׁב
  choice: kehrte … zurück
  rationale: שׁוב bezeichnet hier die Rückkehr Abrahams nach Abschluss der Begegnung.
- source_word: לִמְקֹמוֹ
  choice: an seinen Ort
  rationale: Die relativ offene Bezeichnung מָקוֹם wird als „Ort“ bewahrt; „nach Hause“ wäre konkreter, als der hebräische Text erkennen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die Fußnote weist auf die hebräische Form und verbreitete alternative Wiedergaben hin.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Ging fort“ vermeidet das im Deutschen unnatürliche wörtliche „ging seines Weges“. „An seinen Ort“ erhält bewusst die Unbestimmtheit des Hebräischen.
