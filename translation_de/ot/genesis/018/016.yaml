  source_fidelity: 'Der Text gibt die Abfolge und die wesentlichen Nuancen des Hebräischen zuverlässig wieder: Die gewöhnliche Bezeichnung „die Männer“ wird nicht theologisch ausgedeutet; „von dort“ entspricht מִשָּׁם; „blickten auf Sodom hinab“ gibt die Blickrichtung und die naheliegende Perspektive von erhöhtem Standort angemessen wieder. „ging mit ihnen“ ist eine natürliche Wiedergabe des begleitenden Partizips הֹלֵךְ, und „um ihnen das Geleit zu geben“ trifft לְשַׁלְּחָם im gastfreundschaftlichen Kontext.'
