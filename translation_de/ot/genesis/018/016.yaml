source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: de
  text: Da brachen die Männer von dort auf und blickten auf Sodom hinab[a]. Abraham ging mit ihnen, um ihnen das Geleit zu geben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »blickten in Richtung Sodom« beziehungsweise »blickten über Sodom hin«. Das hebräische Verb kann einen Blick von einem erhöhten Standort aus bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um sie zu verabschieden« beziehungsweise »um sie ein Stück zu begleiten«. Gemeint ist, aufbrechenden Gästen das Geleit zu geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: brachen ... auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet wörtlich das Aufstehen. Im Zusammenhang leitet es zugleich den Aufbruch nach der Mahlzeit ein; „brachen auf“ gibt diese natürliche Erzählbewegung im Deutschen wieder.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der hebräische Text verwendet die gewöhnliche Bezeichnung für Männer. Diese Wiedergabe bewahrt die erzählerische Spannung und legt ihre Identität nicht vorzeitig aus.
- source_word: וַיַּשְׁקִפוּ
  choice: blickten ... hinab
  rationale: שׁקף bezeichnet häufig den Blick von einem erhöhten Standort aus. „hinabblicken“ bewahrt diese räumliche Nuance.
- source_word: עַל־פְּנֵי סְדֹם
  choice: auf Sodom
  rationale: Die Wendung bezeichnet hier die Blickrichtung auf beziehungsweise in Richtung Sodom; zusammen mit „hinab“ entsteht eine natürliche deutsche Formulierung.
- source_word: הֹלֵךְ עִמָּם
  choice: ging mit ihnen
  rationale: Das Partizip beschreibt Abrahams begleitendes, andauerndes Mitgehen. Im deutschen Erzählstil gibt „ging mit ihnen“ dies natürlich wieder.
- source_word: לְשַׁלְּחָם
  choice: um ihnen das Geleit zu geben
  rationale: Im Kontext der Gastfreundschaft meint die Wendung, aufbrechende Gäste ein Stück zu begleiten und sie weiterziehen zu lassen. „das Geleit geben“ erfasst diesen Sinn würdig und idiomatisch.
theological_decisions:
- issue: Identität der הָאֲנָשִׁים im Kontext
  choice: Im Haupttext „die Männer“
  alternative: „die Besucher“ oder „die Engel“
  rationale: Der Vers selbst nennt sie mit dem gewöhnlichen hebräischen Wort „Männer“. Eine ausdrücklich übernatürliche Bezeichnung würde die Identität hier vorzeitig festlegen und die Spannung der Erzählung auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Das Geleit geben“ ist leicht gehoben, aber im Kontext antiker Gastfreundschaft klar und präzise; die Fußnote bietet geläufigere Alternativen.
