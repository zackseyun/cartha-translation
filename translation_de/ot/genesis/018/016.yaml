  terminology: „Männer“ wahrt die hebräische narrative Offenheit. Die Formulierung zum Geleit vermeidet sowohl eine unzureichende Reduktion auf bloßes Verabschieden als auch eine Überinterpretation als ausschließliches Eskortieren.
