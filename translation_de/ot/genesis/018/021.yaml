- from: Ich will nun hinabgehen und sehen, ob sie ganz dem Klageschrei entsprechend gehandelt haben, der zu mir gedrungen ist.[a] Wenn nicht, will ich es wissen.[b]
  to: Ich will nun hinabgehen und sehen, ob sie ganz dem Klageschrei entsprechend gehandelt haben,[a] der zu mir gekommen ist; und wenn nicht,[b] will ich es wissen.
  rationale: Die Revision stellt die hebräische Verknüpfung „und wenn nicht“ wieder her, rückt beide Anmerkungsanker an die jeweils erläuterten Textstellen und ersetzt die leicht verstärkende Formulierung „zu mir gedrungen“ durch die nähere Entsprechung „zu mir gekommen“. Die umstrittene hebräische Wendung bleibt in einer natürlichen, zurückhaltend interpretierenden deutschen Vergleichskonstruktion wiedergegeben.
