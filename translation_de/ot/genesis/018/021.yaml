  naturalness: „Ich will nun hinabgehen und sehen“ sowie „ganz dem Klageschrei entsprechend gehandelt haben“ sind modernes, würdiges Standarddeutsch. „Will ich es wissen“ ist im narrativen Kontext als zukunftsgerichtete Willensbekundung verständlich und bewahrt die knappe Aussage besser als eine stärker interpretierende Wiedergabe wie „werde ich es herausfinden“.
  terminology: „Klageschrei“ ist für צְעָקָה passend. „Zu mir gekommen ist“ bildet בָּאָה אֵלַי unmittelbarer ab als „zu mir gedrungen ist“, ohne den Sinn zu verändern. Die Anmerkung wahrt zutreffend die mögliche Beziehung des femininen Suffixes auf Sodom bzw. das betroffene Gebiet.
