base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: de
  text: Ich will nun hinabgehen und sehen, ob sie ganz dem Klageschrei entsprechend gehandelt haben,[a] der zu mir gekommen ist; und wenn nicht,[b] will ich es wissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ob sie ganz entsprechend ihrem Klageschrei, der zu mir gekommen ist, gehandelt haben“. Das hebräische Suffix kann sich auf Sodom beziehungsweise das betroffene Gebiet beziehen; der Klageschrei kann zugleich als Klage über dessen Unrecht verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist knapp und lässt den Gegenstand von „wissen“ unausgesprochen: „und wenn nicht, will ich wissen“.'
    reason: source_form
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Ich will nun hinabgehen
  rationale: Der Kohortativ bezeichnet den Entschluss des Sprechers; נָא markiert hier Nachdruck oder Unmittelbarkeit und wird natürlich mit „nun“ wiedergegeben.
- source_word: וְאֶרְאֶה
  choice: und sehen
  rationale: „Sehen“ bewahrt die anschauliche Ausdrucksweise des Hebräischen und hat im Zusammenhang den Sinn des Prüfens oder Feststellens.
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: dem Klageschrei entsprechend …, der zu mir gedrungen ist
  rationale: צְעָקָה bezeichnet einen Hilfs- oder Klageschrei, häufig angesichts schweren Unrechts. Das Verb בוא bedeutet wörtlich „kommen“; „zu mir gedrungen“ ist im Deutschen die natürliche Verbindung mit „Klageschrei“.
- source_word: עָשׂוּ כָּלָה
  choice: ob sie ganz … entsprechend gehandelt haben
  rationale: Die schwierige Wendung verbindet das pluralische „sie haben getan/gehandelt“ mit כָּלָה, „Ganzheit/Vollendung“. Die Fassung gibt den wahrscheinlichen Sinn wieder, dass ihr Handeln dem Klageschrei in vollem Maß entspricht, ohne das Idiom dogmatisch festzulegen.
- source_word: וְאִם לֹא אֵדָעָה
  choice: Wenn nicht, will ich es wissen
  rationale: Die knappe Bedingung und der abschließende Kohortativ bleiben erhalten. „Es“ ist im Deutschen zur natürlichen Ergänzung von „wissen“ erforderlich.
theological_decisions:
- issue: Anthropomorphe Darstellung der göttlichen Untersuchung
  choice: Gottes Hinabgehen, Sehen und Wissen werden ohne erklärende Abschwächung wiedergegeben.
  alternative: Die Aussage als „Ich werde prüfen und richten“ paraphrasieren.
  rationale: Der hebräische Erzähltext spricht anschaulich in menschlichen Kategorien von Gottes Untersuchung. Die Übersetzung bewahrt diese theologische Spannung, statt sie durch eine systematische Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige hebräische Vergleichskonstruktion wird maßvoll geglättet; die anthropomorphe Erzählweise und die knappe Schlusswendung bleiben erhalten.
