  - severity: low
    issue: „Zu mir gedrungen“ ist gegenüber dem hebräischen „gekommen“ leicht verstärkend.
    rationale: Das Verb בוא bedeutet hier schlicht „kommen“. „Zu mir gekommen“ ist idiomatisch und quellentreuer.
