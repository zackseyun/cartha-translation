id: GEN.18.1
reference: Genesis 18:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: de
  text: Und Jahwe erschien ihm bei den Eichen von Mamre[a], während er in der Hitze des Tages am Eingang des Zeltes saß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei den Terebinthen von Mamre«. Das hebräische Wort kann große Bäume wie Eichen oder Terebinthen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Das Nifal von ראה bezeichnet hier eine sichtbare Erscheinung. »Erschien« gibt dies im deutschen Erzählstil unmittelbar und ohne zusätzliche Deutung wieder.
- source_word: אֵלָיו
  choice: ihm
  rationale: Gibt die Präposition mit Suffix der 3. Person Singular wieder; der Rückbezug auf Abraham ergibt sich aus dem Kontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בְּאֵלֹנֵי
  choice: bei den Eichen von
  rationale: אֵלוֹן kann große Bäume, insbesondere Eichen oder Terebinthen, bezeichnen. »Eichen« ist verständlich und traditionell; die botanische Unsicherheit wird in einer Fußnote bewahrt.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וְהוּא יֹשֵׁב
  choice: während er … saß
  rationale: Die Partizipialkonstruktion zeichnet den begleitenden Hintergrund der Erscheinung. Die deutsche Nebensatzform gibt diese Funktion natürlich wieder.
- source_word: פֶּתַח הָאֹהֶל
  choice: am Eingang des Zeltes
  rationale: פֶּתַח bezeichnet eine Öffnung beziehungsweise einen Eingang; die gewählte Formulierung ist konkret und idiomatisch.
- source_word: כְּחֹם הַיּוֹם
  choice: in der Hitze des Tages
  rationale: Die Wendung bezeichnet die heiße Tageszeit, ohne eine genaue Stunde festzulegen. Die Übersetzung bewahrt diese Offenheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die Satzstellung bleibt flüssig, während die sichtbare Erscheinung, der Schauplatz und die begleitende Situation eng am Hebräischen wiedergegeben werden.
