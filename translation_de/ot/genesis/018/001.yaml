  source_fidelity: 'Der Entwurf gibt den hebräischen Satz vollständig und sachgerecht wieder: die Erscheinung Jahwes für Abraham, den Ort bei den Bäumen von Mamre sowie die begleitende Szene am Zelteingang in der Hitze des Tages. Die Wahl „Eichen“ ist als mögliche Bedeutung von אֵלֹנֵי vertretbar; die Fußnote bewahrt die botanische Unsicherheit mit „Terebinthen“.'
