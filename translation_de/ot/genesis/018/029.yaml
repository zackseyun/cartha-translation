source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֜וֹד לְ/דַבֵּ֤ר אֵלָי/ו֙ וַ/יֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם אַרְבָּעִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּ/עֲב֖וּר הָ/אַרְבָּעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: de
  text: 'Er sprach noch einmal zu ihm: »Vielleicht finden sich dort vierzig.« Da sagte er: »Um der vierzig willen werde ich es nicht tun.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Ich werde die Stadt um der vierzig willen nicht vernichten.« Im Hebräischen steht nur: »Ich werde es nicht tun«; die gemeinte Handlung ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: Er sprach noch einmal
  rationale: Die Verbindung von יסף, עוד und Infinitiv bezeichnet eine wiederholte beziehungsweise fortgesetzte Handlung. »Noch einmal« gibt hier den erneuten Schritt in Abrahams Fürbitte natürlich und prägnant wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל bezeichnet hier die Richtung der Rede auf den Angesprochenen hin.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: אוּלַי führt eine vorsichtig formulierte Möglichkeit ein und passt zum respektvollen Ton der Fürbitte.
- source_word: יִמָּצְאוּן
  choice: finden sich
  rationale: Der Nifal von מצא bedeutet »gefunden werden«. Die idiomatische deutsche Wendung »sich finden« bewahrt den passiven Sinn, ohne schwerfällig zu wirken.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird unmittelbar und natürlich mit »dort« wiedergegeben.
- source_word: אַרְבָּעִים
  choice: vierzig
  rationale: Die Kardinalzahl wird direkt übersetzt; aus dem Zusammenhang ist klar, dass vierzig Gerechte gemeint sind.
- source_word: לֹא אֶעֱשֶׂה
  choice: werde ich es nicht tun
  rationale: Das hebräische Verb bleibt hinsichtlich seines Objekts elliptisch. Das Pronomen »es« ist im Deutschen nötig, ohne die gemeinte Handlung im Haupttext ausdrücklich als Vernichtung festzulegen.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: um der vierzig willen
  rationale: בַּעֲבוּר drückt hier den verschonenden Grund zugunsten der vierzig aus. Die Wendung ist würdevoll, verständlich und entspricht dem Fürbittekontext.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt der göttlichen Handlung in לֹא אֶעֱשֶׂה
  choice: Die Ellipse mit »es nicht tun« bewahren.
  alternative: »Ich werde die Stadt nicht vernichten.«
  rationale: Der hebräische Text nennt die angedrohte Handlung an dieser Stelle nicht erneut. Die zurückhaltende Wiedergabe bewahrt diese Offenheit und vermeidet eine erklärende Erweiterung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Um der vierzig willen« trägt den feierlichen Fürbitteton, bleibt aber allgemein verständlich. Die beiden Sprecher werden wie im hebräischen Vers nur durch Pronomen bezeichnet.
