  text: וְ/אַבְרָהָ֤ם וְ/שָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּ/יָּמִ֑ים חָדַל֙ לִ/הְי֣וֹת לְ/שָׂרָ֔ה אֹ֖רַח כַּ/נָּשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: de
  text: Abraham und Sara waren alt und hochbetagt; Sara hatte keine Monatsblutung mehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Bei Sara hatte der Weg der Frauen aufgehört« – eine verhüllende hebräische Wendung dafür, dass Sara nicht mehr menstruierte.'
    reason: Bewahrung der wörtlichen Bildsprache und Erläuterung des hebräischen Euphemismus.
lexical_decisions:
- source_word: זְקֵנִים
  choice: alt
  rationale: Das Adjektiv bezeichnet ein hohes Lebensalter. »Alt« ist im modernen Deutsch die natürliche und genaue Entsprechung.
- source_word: בָּאִים בַּיָּמִים
  choice: hochbetagt
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »in den Tagen vorangekommen« und verstärkt die Aussage über das hohe Alter. »Hochbetagt« gibt ihren Sinn würdevoll und verständlich wieder, ohne eine im Deutschen unnatürliche Formulierung zu erzwingen.
- source_word: חָדַל לִהְיוֹת
  choice: hatte … nicht mehr
  rationale: Die Konstruktion bezeichnet das Aufhören eines zuvor bestehenden Zustands. Im Deutschen gibt »hatte keine … mehr« diesen rückblickenden Aspekt natürlich wieder.
- source_word: אֹרַח כַּנָּשִׁים
  choice: Monatsblutung
  rationale: Die wörtliche Wendung »Weg der Frauen« ist ein verhüllender Ausdruck für die Menstruation. »Monatsblutung« macht die gemeinte körperliche Gegebenheit für heutige Leserinnen und Leser klar; die Bildsprache des Hebräischen wird in der Fußnote bewahrt.
- source_word: לְשָׂרָה
  choice: Sara hatte
  rationale: Die Präposition bezeichnet hier, dass der genannte Zustand bei Sara nicht mehr bestand. Die Umformung zum deutschen Subjektssatz ist idiomatisch und erhält den Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die knappe Parallelität der Altersangabe bleibt erhalten; der verhüllende hebräische Ausdruck wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
