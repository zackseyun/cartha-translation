  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: de
  text: 'Er sagte: »Mein Herr[a], wenn ich Gunst in deinen Augen gefunden habe, dann geh bitte nicht an deinem Diener vorüber.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herr«, wenn Abraham sich mit dieser Anrede ausdrücklich an Gott und nicht lediglich ehrerbietig an den Besucher wendet.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Er sagte
  rationale: Das narrative Wayyiqtol leitet Abrahams Rede ein. Im Deutschen gibt die einfache Erzählform den Fortgang natürlich wieder; ein zusätzliches »Und« ist nicht erforderlich.
- source_word: אֲדֹנָי
  choice: Mein Herr
  rationale: Die Anrede gilt einem einzelnen, höhergestellten Gegenüber, wie die folgenden Suffixe der zweiten Person Singular zeigen. »Mein Herr« bewahrt sowohl die ehrerbietige Anrede als auch die Möglichkeit, dass Abraham Gott anspricht.
- source_word: אִם נָא
  choice: wenn
  rationale: Die Bedingung gehört zu einer höflichen Bittenformel. Die bittende Nuance von נָא wird im deutschen Gesamtsatz durch »bitte« beim Verbot ausgedrückt, ohne sie unnatürlich zu verdoppeln.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ich Gunst in deinen Augen gefunden habe
  rationale: Die geläufige hebräische Wendung wird bildnah und zugleich verständlich wiedergegeben. »Gnade« könnte hier stärkere theologische Nebenbedeutungen eintragen, als der Zusammenhang verlangt.
- source_word: אַל נָא
  choice: bitte nicht
  rationale: Die verneinende Aufforderung und die Partikel der inständigen Bitte werden in natürlichem, höflichem Deutsch zusammen wiedergegeben.
- source_word: תַעֲבֹר מֵעַל
  choice: geh … an … vorüber
  rationale: Verb und Präposition bezeichnen das Weitergehen an jemandem vorbei. Die Formulierung ist im Deutschen idiomatisch und erhält das Bewegungsbild.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: עבד dient hier als ehrerbietige Selbstbezeichnung gegenüber einem höhergestellten oder geehrten Gast. »Sklave« würde einen rechtlichen Status in den Vordergrund rücken, der hier nicht gemeint sein muss.
theological_decisions:
- issue: Ob אֲדֹנָי als Gottesbezeichnung oder als ehrerbietige Anrede zu verstehen ist
  choice: Mein Herr
  alternative: Herr
  rationale: Genesis 18 beschreibt eine Erscheinung des HERRN, doch Abraham redet hier einen einzelnen Besucher unmittelbar und ehrerbietig an. Die hebräische Überlieferung kann eine göttliche Anrede nahelegen, während die Gesprächssituation auch die respektvolle Anrede »mein Herr« zulässt. Der Haupttext entscheidet diese Spannung daher nicht durch eine eindeutig göttliche Titelform; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede und die Selbstbezeichnung bewahren den höflich-ehrerbietigen Ton; die Bildsprache »Gunst in deinen Augen« bleibt erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Anrede.
