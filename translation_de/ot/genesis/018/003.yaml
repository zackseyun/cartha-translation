  source_fidelity: 'Der Entwurf gibt die hebräische Bittenformel genau wieder: die ehrerbietige Singularanrede, die Bedingung »wenn ich Gunst in deinen Augen gefunden habe« sowie die höfliche Bitte, nicht am Sprecher vorüberzugehen. Die Selbstbezeichnung »deinem Diener« entspricht עַבְדֶּךָ in ihrer hier kontextgemäßen deferenziellen Funktion.'
