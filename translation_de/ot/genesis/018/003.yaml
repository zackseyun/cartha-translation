  terminology: »Mein Herr« bewahrt die im Kontext bestehende Ambiguität von אֲדֹנָי, ohne die Anrede vorzeitig als Gottesnamen festzulegen. Die Fußnote bietet sachgerecht »Herr« als alternative, auf Gott bezogene Deutung. »Diener« ist für die ehrerbietige Selbstbezeichnung treffender als »Sklave«.
