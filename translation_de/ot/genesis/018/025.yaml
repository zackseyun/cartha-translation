source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: de
  text: 'Es sei fern von dir, so etwas zu tun: den Gerechten zusammen mit dem Schuldigen zu töten, sodass es dem Gerechten ebenso ergeht wie dem Schuldigen. Das sei fern von dir! Sollte der Richter der ganzen Erde nicht Recht üben?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: Es sei fern von dir
  rationale: Die idiomatische Wendung bringt die starke Zurückweisung und Abscheu des hebräischen Ausrufs würdig zum Ausdruck; die Wiederholung bleibt erhalten.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: so etwas zu tun
  rationale: Eine natürliche deutsche Wiedergabe des Infinitivgefüges nach חָלִילָה, die auf die als undenkbar bezeichnete Handlung verweist.
- source_word: לְהָמִית
  choice: zu töten
  rationale: Der Hifil von מות bezeichnet hier das Töten beziehungsweise den Tod herbeiführen. Im Deutschen ist „töten“ präzise und natürlicher als „zu Tode bringen“.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Bewahrt den moralisch-forensischen Sinn und den singularischen, typisierenden Gegensatz zu רָשָׁע.
- source_word: רָשָׁע
  choice: der Schuldige
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Wort den im Unrecht befindlichen beziehungsweise schuldigen Menschen. „Schuldige“ macht den forensischen Kontrast zu „Gerechte“ im modernen Deutsch deutlich.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: sodass es dem Gerechten ebenso ergeht wie dem Schuldigen
  rationale: Die knappe Vergleichsformel ist syntaktisch mehrdeutig. Diese Wiedergabe bezieht sie natürlich auf das gleiche Todesgeschick, ohne eine moralische Gleichsetzung beider Gruppen zu behaupten.
- source_word: הֲשֹׁפֵט כָּל־הָאָרֶץ
  choice: der Richter der ganzen Erde
  rationale: Das substantivierte Partizip fungiert als Gottesbezeichnung; „ganze Erde“ bewahrt den universalen Umfang.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Das Wort umfasst hier gerechtes richterliches Handeln. Die feste deutsche Verbindung „Recht üben“ bewahrt sowohl den juristischen als auch den ethischen Gehalt.
theological_decisions:
- issue: Abrahams rhetorische Berufung auf Gottes Gerechtigkeit
  choice: Sollte der Richter der ganzen Erde nicht Recht üben?
  alternative: Wird der Richter der ganzen Erde nicht gerecht handeln?
  rationale: Die Frage erwartet Zustimmung und bewahrt zugleich Abrahams kühne Anrede. „Recht üben“ hält den direkten Bezug auf מִשְׁפָּט aufrecht, ohne die Spannung durch eine abschwächende Paraphrase aufzulösen.
- issue: Verhältnis des Gerechten zum Schuldigen
  choice: sodass es dem Gerechten ebenso ergeht wie dem Schuldigen
  alternative: sodass der Gerechte wie der Schuldige wäre
  rationale: Der Kontext betrifft das gemeinsame Todesgeschick. Die gewählte Fassung vermeidet die mögliche Fehlannahme, Abraham setze den moralischen Status des Gerechten mit dem des Schuldigen gleich, während sie den Vergleich des hebräischen Textes wahrt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die feierliche Wendung „Es sei fern von dir“ erhält die nachdrückliche Wiederholung des Hebräischen; „Recht üben“ klingt gehoben, bleibt aber allgemein verständlich.
