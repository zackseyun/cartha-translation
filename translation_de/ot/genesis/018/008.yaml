  to: Dann nahm er geronnene Milch[a] und Milch und das Kalb, das er zubereitet hatte, und setzte es ihnen vor. Er selbst stand bei ihnen[b] unter dem Baum, während sie aßen.
  rationale: Die Revision entfernt die nicht im hebräischen Wortlaut enthaltene kausative Nuance bei der Zubereitung des Kalbs. Außerdem ersetzt sie die im heutigen Deutsch vergleichsweise eng bestimmte Produktbezeichnung „Dickmilch“ durch „geronnene Milch“ und bewahrt die lexikalische Unsicherheit durch die Fußnote. Die übrigen Formulierungen bleiben erhalten, da sie Sinn, Register und erzählerische Funktion des hebräischen Textes angemessen wiedergeben.
