  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: de
  text: Dann nahm er geronnene Milch[a] und Milch und das Kalb, das er zubereitet hatte, und setzte es ihnen vor. Er selbst stand bei ihnen[b] unter dem Baum, während sie aßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Rahm“ oder „Butter“; das hebräische Wort bezeichnet ein eingedicktes Milchprodukt, dessen genaue Art hier nicht sicher bestimmbar ist.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „stand über ihnen“; gemeint ist wahrscheinlich, dass Abraham als Gastgeber bei ihnen stand und sie bediente.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: Dickmilch
  rationale: Das Wort bezeichnet ein eingedicktes Milchprodukt; im Hirtenmilieu passt „Dickmilch“ besser als moderne Tafelbutter. Die genaue Art des Milchprodukts bleibt jedoch unsicher.
- source_word: חָלָב
  choice: Milch
  rationale: Direkte und natürliche Wiedergabe des gewöhnlichen Nomens.
- source_word: וּבֶן הַבָּקָר
  choice: das Kalb
  rationale: Wörtlich „Sohn des Rindes/der Herde“, eine Bezeichnung für ein junges Rind; der bestimmte Artikel verweist auf das in Vers 7 ausgewählte Tier.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er hatte zubereiten lassen
  rationale: Im Speisekontext bedeutet עשה „zubereiten“. Da nach Vers 7 der Knecht die Zubereitung ausführt, gibt die kausative deutsche Form den Zusammenhang präzise wieder, ohne den knappen hebräischen Ausdruck umzudeuten.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: und setzte es ihnen vor
  rationale: Die Wendung bezeichnet das Vorsetzen von Speisen und klingt im Deutschen natürlich.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Er selbst stand bei ihnen
  rationale: Das Hebräische lautet räumlich „über/bei ihnen“ und schildert Abraham als anwesenden, aufwartenden Gastgeber. „Bei ihnen“ vermeidet im Deutschen den irreführenden Eindruck, er habe unmittelbar über ihnen gestanden.
- source_word: תַּחַת הָעֵץ
  choice: unter dem Baum
  rationale: Direkte, idiomatische Wiedergabe.
- source_word: וַיֹּאכֵלוּ
  choice: während sie aßen
  rationale: Die deutsche temporale Einordnung verbindet ihr Essen natürlich mit Abrahams fortdauerndem Dabeistehen; formal steht im Hebräischen „und sie aßen“.
theological_decisions:
- issue: Ob die Identität der Besucher durch theologisch aufgeladene Sprache hervorgehoben werden soll
  choice: Der Vers wird als schlichte Erzählung von Abrahams Gastfreundschaft wiedergegeben.
  alternative: Die Sprache des Bedienens oder der Anwesenheit so zu erhöhen, dass sie ausdrücklich auf einen göttlichen oder trinitarischen Status der Besucher deutet.
  rationale: Der hebräische Vers erzählt hier unmittelbar das Bewirten der Gäste. Spätere theologische Deutungen sollen nicht in die Übersetzung dieses Satzes eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dickmilch“ bewahrt den pastoral geprägten Charakter, während die Fußnote die lexikalische Unsicherheit offenlegt. „Er selbst“ bildet das ausdrücklich gesetzte Pronomen הוּא ab und hebt Abrahams persönliche Anwesenheit zurückhaltend hervor.
