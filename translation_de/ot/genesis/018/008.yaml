  terminology: „Kalb“, „Milch“, „setzte es ihnen vor“ und „bei ihnen“ sind passend. Für חֶמְאָה bleibt die genaue Milchart unsicher; die Fußnote wahrt die einschlägigen Alternativen Rahm und Butter.
