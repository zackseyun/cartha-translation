  variant: modern standard German
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: de
  text: 'Doch Sara leugnete es[a] und sagte: »Ich habe nicht gelacht«, denn sie hatte Angst. Er aber sagte: »Nein, du hast sehr wohl gelacht.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch Sara log und sagte …« Das hebräische Verb kann sowohl das Leugnen als auch falsches Reden bezeichnen; hier bestreitet Sara, gelacht zu haben.'
    reason: lexical_alternative
  - marker: b
    text: Der Sprecher wird in diesem Satz nicht ausdrücklich genannt; im umgebenden Erzählzusammenhang ist er mit dem HERRN verbunden.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: leugnete es
  rationale: כחשׁ im Piel kann Leugnen oder falsches Reden bezeichnen. Im Zusammenhang bestreitet Sara, gelacht zu haben; »leugnete es« gibt dies natürlich wieder, ohne die moralische Wertung im Haupttext unnötig zu verstärken.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der quotative Infinitiv führt Saras direkte Rede ein. Im modernen deutschen Erzählstil ist die koordinierte Wiedergabe »und sagte« natürlich und klar.
- source_word: לֹא צָחַקְתִּי
  choice: Ich habe nicht gelacht
  rationale: Die negierte Perfektform der ersten Person Singular wird direkt und idiomatisch wiedergegeben.
- source_word: כִּי יָרֵאָה
  choice: denn sie hatte Angst
  rationale: כִּי nennt hier den Grund für Saras Leugnen. »Denn« wahrt den würdevollen Erzählton und drückt den kausalen Zusammenhang klar aus.
- source_word: וַיֹּאמֶר
  choice: Er aber sagte
  rationale: Die Verbform führt die Erzählung fort; »aber« macht den Gegensatz zwischen Saras Leugnen und der Erwiderung deutlich. Das Subjekt bleibt entsprechend dem Hebräischen als Pronomen ausgedrückt.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Nein, du hast sehr wohl gelacht
  rationale: Das erste לֹא weist Saras Aussage zurück; כִּי verstärkt beziehungsweise kontrastiert die folgende Feststellung. »Sehr wohl« vermittelt die nachdrückliche Widerlegung idiomatisch, ohne einen zusätzlichen inhaltlichen Gedanken einzuführen.
theological_decisions:
- issue: Identität des Sprechers bei וַיֹּאמֶר
  choice: »Er aber sagte«; der Sprecher wird im Vers nicht ausdrücklich benannt.
  alternative: »Der HERR aber sagte« oder »Einer der Männer aber sagte«
  rationale: Die unmittelbare Klausel enthält nur ein maskulines Verb im Singular und wiederholt das Subjekt nicht. Der weitere Zusammenhang verbindet den Sprecher mit dem HERRN, doch die Übersetzung bewahrt die formale Unbestimmtheit dieses Satzes; die Fußnote weist auf die kontextuelle Identifikation hin.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede ist natürlich formuliert; »sehr wohl« gibt die nachdrückliche Widerlegung wieder. Sämtliche Fußnotenmarker stehen im Haupttext.
