lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Man soll doch … bringen
  rationale: Der passive Jussiv mit נָא formuliert eine höfliche Bitte. Die unpersönliche deutsche Wendung bewahrt den passiven Sinn und klingt als gastfreundliches Angebot natürlich.
- source_word: מְעַט מַיִם
  choice: ein wenig Wasser
  rationale: Gibt die geringe Menge und die bescheidene Form des Angebots unmittelbar wieder.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: wascht euch die Füße
  rationale: Der Imperativ und das Körperteil mit Suffix werden im Deutschen idiomatisch mit reflexivem Dativ wiedergegeben.
- source_word: וְהִשָּׁעֲנוּ
  choice: ruht euch … aus
  rationale: Das Nifal von שען bezeichnet wörtlich ein Sich-Anlehnen beziehungsweise Sich-Niederlassen; im gastfreundlichen Zusammenhang ist die Aufforderung zum Ausruhen gemeint.
- source_word: תַּחַת הָעֵץ
  choice: unter dem Baum
  rationale: Die Präposition und der bestimmte Artikel werden direkt wiedergegeben; gemeint ist ein bestimmter Baum am Ort.
