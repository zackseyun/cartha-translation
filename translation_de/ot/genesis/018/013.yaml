    issue: Die Wiedergabe »ein Kind bekommen« ist für אֵלֵד zu unspezifisch.
    rationale: Das hebräische ילד in dieser Form bezeichnet Saras eigenes Gebären. »Ein Kind bekommen« kann im heutigen Deutsch auch Adoption oder allgemeine Elternschaft einschließen; »ein Kind zur Welt bringen« bewahrt den konkreten Sinn bei natürlichem Register.
