  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: de
  text: 'Da sagte der HERR zu Abraham: »Warum hat Sara gelacht und gesagt: ›Soll ich wirklich noch ein Kind zur Welt bringen, obwohl ich alt bin?‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit HERR in Kapitälchen entspricht dem konsultierten POB-Text und ist im modernen Bibeldeutsch gut verständlich.
- source_word: הַאַף אֻמְנָם
  choice: Sollte ich wirklich
  rationale: Die Verbindung verstärkt die skeptische Frage. »Wirklich« gibt אֻמְנָם natürlich wieder; »sollte ich« bewahrt den fragenden, zweifelnden Ton.
- source_word: אֵלֵד
  choice: ein Kind bekommen
  rationale: Wörtlich bedeutet das Verb »gebären«. In direkter Rede klingt »ein Kind bekommen« im heutigen Standarddeutsch natürlicher, ohne den Sinn zu verändern.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: obwohl ich alt bin
  rationale: Die hebräische Satzverknüpfung stellt Saras Alter als Einwand gegen die erwartete Geburt dar. »Obwohl« macht diesen im Kontext vorhandenen Gegensatz idiomatisch deutlich.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: »der HERR« folgt der etablierten jüdisch-christlichen Lesetradition und dem englischen POB, ohne eine unsichere Aussprache des Gottesnamens festzulegen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit natürlicher deutscher direkter Rede. Die verschachtelten Anführungszeichen bilden Saras zitierte Worte innerhalb der Rede des HERRN ab.
