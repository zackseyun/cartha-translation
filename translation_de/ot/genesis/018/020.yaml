  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: de
  text: 'Da sagte Jahwe: »Das Klagegeschrei über Sodom und Gomorra[a] ist groß, und ihre Sünde wiegt sehr schwer[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Das Klagegeschrei Sodoms und Gomorras ist groß.« So lässt sich die hebräische Genitivverbindung formnäher wiedergeben; der Haupttext verdeutlicht, dass sich das Klagegeschrei auf die Städte und ihr Unrecht bezieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ihre Sünde ist sehr schwerwiegend.« Wörtlich heißt es im Hebräischen, dass ihre Sünde »sehr schwer ist« – ein Bild für ihren großen Ernst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. »Da sagte« gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt. »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: זַעֲקַת
  choice: das Klagegeschrei über
  rationale: זְעָקָה bezeichnet einen dringlichen Aufschrei, oft angesichts schweren Unrechts. »Klagegeschrei« erfasst diesen Charakter; »über« macht den im Zusammenhang naheliegenden Bezug auf die Städte deutlich, ohne die hebräische Konstruktion unnötig eng festzulegen.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom und Gomorra
  rationale: Dies sind die etablierten deutschen Formen der Ortsnamen.
- source_word: כִּי רָבָּה
  choice: ist groß
  rationale: Das feminine Prädikat bezieht sich auf זַעֲקַת. »Ist groß« gibt das Ausmaß des Klagegeschreis schlicht und unmittelbar wieder.
- source_word: וְחַטָּאתָם
  choice: und ihre Sünde
  rationale: חַטָּאת bezeichnet hier die Sünde beziehungsweise das schuldhafte Handeln der Bewohner kollektiv. Der Singular des Hebräischen bleibt erhalten.
- source_word: כִּי כָבְדָה מְאֹד
  choice: wiegt sehr schwer
  rationale: כבד bedeutet wörtlich »schwer sein« und bezeichnet hier die außerordentliche moralische Schwere. Die deutsche Wendung bewahrt sowohl das Bild als auch den idiomatischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm als persönlicher Gottesname. Die Transliteration bewahrt den Eigenname-Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Klagegeschreis
  choice: Klagegeschrei über Sodom und Gomorra
  alternative: Klagegeschrei Sodoms und Gomorras
  rationale: Die Constructusverbindung kann formal als Genitiv wiedergegeben werden; der Zusammenhang legt jedoch nahe, dass ein Klagegeschrei wegen des Unrechts der Städte gemeint ist. Die Fußnote erhält die formnähere Alternative und damit die sprachliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Klagegeschrei« vermittelt stärker als das neutralere »Ruf« die Not und die Anklage, die זְעָקָה im Kontext ausdrückt. Die Formulierung »wiegt sehr schwer« ist idiomatisch und bewahrt zugleich das hebräische Bild.
