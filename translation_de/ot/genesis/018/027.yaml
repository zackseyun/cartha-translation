source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: de
  text: 'Da antwortete Abraham und sagte: »Sieh doch, ich habe es gewagt, zu meinem Herrn[a] zu reden, obwohl ich Staub und Asche bin.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „zu meinem Herrn“. Die Form kann auch als ehrerbietige Anrede eines menschlichen Höhergestellten verstanden werden; der Zusammenhang weist jedoch darauf hin, dass Abraham den Besucher anspricht, der mit dem HERRN identifiziert wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: antwortete ... und sagte
  rationale: Die beiden Erzählverben werden entsprechend der hebräischen Dialogformel beibehalten; die Formulierung ist im Deutschen bewusst leicht feierlich.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: „Sieh“ gibt den aufmerksamkeitslenkenden Ausdruck הִנֵּה wieder, während „doch“ hier die höflich-bittende Nuance von נָא natürlich ausdrückt.
- source_word: הוֹאַלְתִּי
  choice: ich habe es gewagt
  rationale: Im ehrerbietigen Zusammenhang bezeichnet das Verb das Wagnis, etwas auf sich zu nehmen; „gewagt“ bewahrt Abrahams zugleich kühne und demütige Haltung.
- source_word: לְדַבֵּר אֶל
  choice: zu ... zu reden
  rationale: Die Wendung gibt das Sprechen zu einem Gegenüber idiomatisch und quellentreu wieder.
- source_word: אֲדֹנָי
  choice: meinem Herrn
  rationale: Die Form bedeutet „mein Herr“ und kann ehrerbietige Anrede sein. Die Großschreibung folgt der Identifikation des Angeredeten mit dem HERRN im Kontext, ohne den hebräischen Ausdruck durch den Gottesnamen zu ersetzen.
- source_word: וְאָנֹכִי
  choice: obwohl ich ... bin
  rationale: Das hebräische „und ich“ hat hier im Kontrast zwischen Abrahams Redewagnis und seiner Niedrigkeit eine konzessive Funktion.
- source_word: עָפָר וָאֵפֶר
  choice: Staub und Asche
  rationale: Die feste Wendung bezeichnet Sterblichkeit und Geringheit; im Deutschen ist „Staub und Asche“ die natürliche Entsprechung.
theological_decisions:
- issue: Deutung von אֲדֹנָי in Abrahams Anrede
  choice: meinem Herrn
  alternative: meinem herrn / meinem Gebieter
  rationale: Die hebräische Form lässt grundsätzlich eine ehrerbietige Anrede zu. Der unmittelbare Erzählzusammenhang verbindet den Angeredeten jedoch mit dem HERRN. Die Großschreibung signalisiert diese kontextuelle Identifikation; die Fußnote bewahrt die sprachliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählton. „Sieh doch“ vermeidet das altertümliche „Siehe“ und erhält dennoch Aufforderung und Höflichkeit. Die Doppelung „antwortete ... und sagte“ spiegelt bewusst die hebräische Erzählweise.
