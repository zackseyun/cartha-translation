  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: de
  text: 'Da sagte Abraham: „Sieh doch, ich habe es gewagt, zu meinem Herrn zu reden. Vielleicht finden sich dort zwanzig.“ Er sagte: „Um der zwanzig willen werde ich sie nicht vernichten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Verbindung dient als höfliche, nachdrückliche Einleitung. „Sieh doch“ gibt beide Partikeln knapp und in natürlichem Deutsch wieder.
- source_word: הוֹאַלְתִּי
  choice: ich habe es gewagt
  rationale: Im Zusammenhang bringt das Verb Abrahams ehrfürchtige Kühnheit zum Ausdruck; „gewagt“ ist natürlicher und treffender als das sachlichere „unternommen“.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: zu meinem Herrn zu reden
  rationale: Die Formulierung folgt dem Hebräischen eng. „Herrn“ wird als Anrede des göttlichen Gegenübers großgeschrieben, ohne אֲדֹנָי mit dem Gottesnamen gleichzusetzen.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt den vorsichtigen, respektvollen Ton von Abrahams Fürbitte.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: finden sich dort zwanzig
  rationale: Das deutsche reflexive „sich finden“ gibt den passiven Sinn des hebräischen Nifal idiomatisch wieder.
- source_word: לֹא אַשְׁחִית
  choice: werde ich die Stadt nicht vernichten
  rationale: „Vernichten“ entspricht dem kausativen Gebrauch von שׁחת. „Die Stadt“ macht das im Hebräischen unausgesprochene, aus dem Kontext erschließbare Objekt verständlich.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: Um der zwanzig willen
  rationale: Die traditionelle, weiterhin verständliche Wendung bewahrt den Fürbittegedanken und gibt den bestimmten Artikel bei „den zwanzig“ wieder.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי in Abrahams Anrede
  choice: mein Herr
  alternative: mein Herr (als rein menschliche Höflichkeitsanrede)
  rationale: Im weiteren Erzählzusammenhang ist Abrahams Gegenüber göttlich. Die Übersetzung als Titel „mein Herr“ wahrt dies, ohne an dieser Stelle den nicht vorkommenden Gottesnamen JHWH einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sprecher werden zur Klarheit als „Abraham“ und „er“ bezeichnet; „die Stadt“ wird als kontextuell erschlossenes Objekt ergänzt. Keine Fußnoten erforderlich.
