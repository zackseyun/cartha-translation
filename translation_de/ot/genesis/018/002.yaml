base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: de
  text: 'Er erhob seine Augen und sah: Siehe, drei Männer standen nahe bei ihm[a]. Als er sie sah, lief er vom Eingang des Zeltes aus ihnen entgegen und verneigte sich bis zur Erde[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „standen bei ihm“ oder „standen über ihm“. Die hebräische Präposition kann Nähe oder eine räumliche Position in Bezug auf ihn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „warf sich zur Erde nieder“. Das Verb bezeichnet eine tiefe Ehrbezeugung, bedeutet für sich allein aber nicht zwingend „anbeten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Er erhob seine Augen
  rationale: Die Wiedergabe bewahrt das anschauliche hebräische Idiom und bleibt in einem würdevollen deutschen Erzählstil verständlich.
- source_word: וַיַּרְא
  choice: und sah / Als er sie sah
  rationale: Die erste Form schließt unmittelbar an das Erheben der Augen an; die zweite leitet Abrahams Reaktion natürlich ein, ohne die Wiederholung des hebräischen Verbs zu beseitigen.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Der Ausdruck markiert eine lebhafte, überraschende Wahrnehmung. „Siehe“ erhält diese Erzählwirkung besser als eine bloße Feststellung.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: drei Männer
  rationale: Das Hebräische bezeichnet ausdrücklich drei Männer; eine neutralere Wiedergabe würde die konkrete Darstellung abschwächen.
- source_word: נִצָּבִים עָלָיו
  choice: standen nahe bei ihm
  rationale: Die Präposition kann räumliche Nähe oder eine Position in Bezug auf Abraham ausdrücken. „Nahe bei ihm“ ist im Zusammenhang natürlich und vermeidet die vorschnelle Vorstellung, die Männer hätten bedrohlich über ihm gestanden.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: lief er ihnen ... entgegen
  rationale: Das Verb bezeichnet tatsächlich ein Laufen und unterstreicht Abrahams eilige, bereitwillige Reaktion.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: vom Eingang des Zeltes
  rationale: Die Formulierung gibt die räumliche Ausgangsposition klar und natürlich wieder.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: verneigte sich bis zur Erde
  rationale: Die Wendung beschreibt eine tiefe körperliche Ehrbezeugung. Diese Übersetzung lässt offen, ob darüber hinaus religiöse Anbetung gemeint ist.
theological_decisions:
- issue: Ob Abrahams Niederbeugung ausdrücklich als Anbetung eines göttlichen Wesens zu übersetzen ist
  choice: verneigte sich bis zur Erde
  alternative: betete an; warf sich zur Erde nieder
  rationale: Das hebräische Verb kann sowohl eine ehrerbietige Verbeugung vor Menschen als auch Anbetung vor Gott bezeichnen. Da der Vers die Besucher zunächst als „drei Männer“ vorstellt, würde „betete an“ die theologische Deutung vorzeitig festlegen. Die gewählte Formulierung bewahrt die Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener hebräischer Bildhaftigkeit. „Siehe“ dient als verständlicher literarischer Erzählmarker; die zweimalige Wahrnehmungsformulierung folgt der Struktur des Ausgangstextes.
