  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: de
  text: Denn ich kenne ihn[a], damit er seinen Söhnen[b] und seinem Haus nach ihm gebietet, den Weg Jahwes[c] zu bewahren, indem sie Gerechtigkeit und Recht üben, damit Jahwe das über Abraham kommen lässt, was er über ihn gesagt hat[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich habe ihn erwählt.“ Das hebräische Verb bedeutet gewöhnlich „kennen“, kann hier aber besondere Zuwendung und Erwählung einschließen.'
    reason: alternative_reading
  - marker: b
    text: Das Hebräische hat „seinen Söhnen“. Gemeint sein können auch seine männlichen Nachkommen; durch „sein Haus“ wird der angesprochene Kreis erweitert.
    reason: lexical_alternative
  - marker: c
    text: Der „Weg Jahwes“ bezeichnet die von Jahwe geforderte Lebensführung.
    reason: cultural_note
  - marker: d
    text: 'Sinngemäß auch: „was er ihm zugesagt hat“. Wörtlicher heißt es: „was er über ihn gesagt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den erklärenden Zusammenhang.
- source_word: יְדַעְתִּיו
  choice: ich kenne ihn
  rationale: ידע bedeutet zunächst „kennen“. Das Perfekt beschreibt hier eine bestehende, besondere Beziehung; „erwählt“ ist kontextuell möglich, würde die Deutung im Haupttext jedoch stärker festlegen.
- source_word: לְמַעַן אֲשֶׁר
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Folgerelation knapp und natürlich wieder.
- source_word: יְצַוֶּה
  choice: gebietet
  rationale: Das Piel von צוה bezeichnet verbindliches Anweisen oder Gebieten; „gebietet“ bewahrt diese Stärke in würdigem Deutsch.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Wort ist hier maskuliner Plural und bezeichnet unmittelbar Abrahams Söhne beziehungsweise männliche Nachkommen; der anschließende Ausdruck „sein Haus“ erweitert den Personenkreis.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: „Haus“ bezeichnet hier nicht das Gebäude, sondern Abrahams Hausgemeinschaft. Die traditionelle deutsche Wendung bleibt verständlich und bildet das hebräische Bild ab.
- source_word: וְשָׁמְרוּ
  choice: zu bewahren
  rationale: שמר bezeichnet das treue Einhalten oder Befolgen. Die deutsche Infinitivkonstruktion bindet die Hausgemeinschaft natürlich in Abrahams Gebot ein.
- source_word: דֶּרֶךְ יְהוָה
  choice: den Weg Jahwes
  rationale: Bewahrt das ethische Bild für die von Jahwe geforderte Lebensführung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: indem sie Gerechtigkeit und Recht üben
  rationale: Der Infinitiv erläutert, wie der Weg Jahwes bewahrt wird. „Gerechtigkeit und Recht“ hält die beiden verwandten, aber unterscheidbaren Begriffe zusammen.
- source_word: הָבִיא יְהוָה עַל אַבְרָהָם
  choice: Jahwe über Abraham kommen lässt
  rationale: Bildet die Konstruktion mit הביא und על möglichst eng ab, ohne sie vorschnell auf „erfüllen“ zu reduzieren.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: was er über ihn gesagt hat
  rationale: Gibt den Wortlaut „gesprochen über ihn“ direkt wieder; im Zusammenhang kann es sich um eine Zusage handeln.
theological_decisions:
- issue: Ob ידע mit „kennen“ oder mit erwählender Bedeutung wiederzugeben ist
  choice: ich kenne ihn
  alternative: ich habe ihn erwählt
  rationale: Die besondere Zuwendung und Erwählung kann im Kontext mitschwingen, doch das Verb lautet „kennen“. Der Haupttext bewahrt daher die lexikalische Offenheit; die stärker deutende Wiedergabe steht in der Fußnote.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen Abrahams Gebieten und dem Bewahren des Weges Jahwes
  choice: Infinitivkonstruktion mit pluralischem Subjekt in der Ausführung
  alternative: zwei beigeordnete finite Zwecksätze
  rationale: Das Hebräische wechselt von Abrahams singularischem Gebieten zum pluralischen Bewahren durch Söhne und Haus. Die Formulierung lässt diesen Sinn erkennen, ohne die Zweck-/Folgerelation dogmatisch zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Bildsprache. „Gebietet“, „sein Haus“ und „Recht üben“ bewahren einen leicht gehobenen biblischen Klang, bleiben aber allgemein verständlich. Die Fußnotenmarker erscheinen jeweils an der sachlich zugehörigen Stelle.
