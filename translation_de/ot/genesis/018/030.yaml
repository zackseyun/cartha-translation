source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: de
  text: 'Da sagte er: „Mein Herr[a], werde bitte nicht zornig; ich will weiterreden. Vielleicht finden sich dort dreißig.“ Er sagte: „Ich werde es nicht tun, wenn ich dort dreißig finde.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische kann hier auch als respektvolle Anrede „mein Herr“ verstanden werden. Im Zusammenhang wird der Angeredete als Gott verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: werde bitte nicht zornig
  rationale: Die Verbindung aus Verneinung, Höflichkeitspartikel und dem Verb חרה bittet ehrerbietig darum, nicht zornig zu werden. Die Formulierung ist im modernen Deutsch natürlich und wahrt den bittenden Ton.
- source_word: לַאדֹנָי
  choice: mein Herr
  rationale: Die Form ist eine ehrerbietige Anrede mit Suffix der ersten Person Singular. Im Kontext richtet Abraham sie an den göttlichen Gesprächspartner; die Großschreibung von „Herr“ kennzeichnet diesen Bezug, ohne den nicht verwendeten Gottesnamen einzutragen.
- source_word: וַאֲדַבֵּרָה
  choice: wenn ich weiterrede
  rationale: Der Kohortativ drückt hier Abrahams zurückhaltende Bitte aus, noch weiter sprechen zu dürfen. Im Zusammenhang mit der vorausgehenden Bitte ist die deutsche Konditionalform natürlich und gibt den pragmatischen Sinn wieder.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: „Vielleicht“ bewahrt den vorsichtigen, hypothetischen Ton der Fürsprache.
- source_word: יִמָּצְאוּן
  choice: finden sich
  rationale: Der Nifal von מצא bezeichnet hier, dass die dreißig Personen dort vorgefunden werden. „Finden sich“ gibt dies idiomatisch wieder, ohne einen ungenannten Suchenden hervorzuheben.
- source_word: שָׁם
  choice: dort
  rationale: Das schlichte Ortsadverb wird unmittelbar und natürlich mit „dort“ wiedergegeben.
- source_word: שְׁלֹשִׁים
  choice: dreißig
  rationale: Die Kardinalzahl wird direkt wiedergegeben; aus dem Kontext ist ersichtlich, dass dreißig gerechte Menschen gemeint sind, ohne dass dies im Vers ausdrücklich wiederholt wird.
- source_word: לֹא אֶעֱשֶׂה
  choice: Ich werde es nicht tun
  rationale: Das Objekt bleibt im Hebräischen unausgesprochen und ergibt sich aus dem Kontext als das angekündigte Gericht. Das neutrale „es“ erhält diese Knappheit.
- source_word: אִם אֶמְצָא
  choice: wenn ich ... finde
  rationale: Die gewöhnliche Bedingungskonstruktion wird klar und direkt wiedergegeben.
theological_decisions:
- issue: Deutung der Anrede אֲדֹנָי
  choice: Mein Herr
  alternative: mein Herr
  rationale: Der Kontext legt nahe, dass Abraham den göttlichen Gesprächspartner anredet. Die Großschreibung macht diesen Bezug im Deutschen sichtbar; eine Fußnote bewahrt zugleich die grammatisch mögliche respektvolle Anrede „mein Herr“ ohne ausdrückliche Kennzeichnung des göttlichen Referenten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Abrahams ehrerbietige Zurückhaltung bleibt durch „bitte“, die Anrede und die vorsichtige Formulierung „Vielleicht“ erhalten. Die Wiederholung von „dreißig“ und „dort“ folgt der pointierten hebräischen Dialogstruktur.
