    issue: „wenn ich weiterrede“ für וַאֲדַבֵּרָה
    rationale: Die deutsche Konditionalsatzkonstruktion stellt das Weiterreden als Bedingung der vorausgehenden Bitte dar. Der hebräische Kohortativ hat hier vorwärtsweisend-deferentielle Kraft („und ich will/möchte weiterreden“), nicht die Form einer solchen Bedingung.
  - severity: low
    issue: Begründung der Großschreibung in der Fußnote
    rationale: Die Großschreibung von „Herr“ unterscheidet im Deutschen die göttliche Anrede nicht verlässlich von der respektvollen menschlichen Anrede „mein Herr“. Die Fußnote soll die mögliche Lesart des hebräischen Titels erklären, ohne eine nicht vorhandene orthographische Unterscheidung zu behaupten.
