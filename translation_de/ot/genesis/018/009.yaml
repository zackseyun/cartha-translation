  source_fidelity: 'Der Entwurf gibt den hebräischen Text sachgerecht wieder: וַיֹּאמְרוּ אֵלָיו wird idiomatisch als „Da fragten sie ihn“ wiedergegeben; die direkte Ortsfrage und Abrahams knappe Antwort entsprechen dem Sinn von אַיֵּה ... הִנֵּה בָאֹהֶל. „Dort, im Zelt“ bewahrt die deiktische und elliptische Kürze von הִנֵּה.'
  naturalness: Modernes, natürliches Standarddeutsch. „Da fragten sie ihn“ und „Er antwortete“ sind flüssig und dem narrativen Register angemessen. Die elliptische Antwort „Dort, im Zelt“ ist verständlich und stilistisch tragfähig.
  terminology: „Sara“ ist die im deutschen Bibelgebrauch übliche Namensform. „deine Frau“ trifft אִשְׁתֶּךָ präzise. „Zelt“ ist die reguläre und sachgerechte Wiedergabe von אֹהֶל. Keine theologisch belasteten Begriffe sind betroffen.
