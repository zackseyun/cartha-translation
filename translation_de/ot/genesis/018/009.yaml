  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: de
  text: 'Da fragten sie ihn: „Wo ist Sara, deine Frau?“ Er antwortete: „Dort, im Zelt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da fragten sie
  rationale: Der Wayyiqtol führt die nächste Handlung der Erzählung ein. Im Deutschen gibt „Da“ den Fortgang natürlich wieder; „fragten“ ist wegen der folgenden direkten Frage idiomatischer als das allgemeinere „sagten“.
- source_word: אֵלָיו
  choice: ihn
  rationale: Die Präposition אֶל mit Suffix bezeichnet Abraham als Adressaten. Beim deutschen Verb „fragen“ steht die angesprochene Person ohne Präposition im Akkusativ.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Das Frageadverb fragt nach dem Aufenthaltsort; im Deutschen ist die Ergänzung der Kopula erforderlich.
- source_word: שָׂרָה
  choice: Sara
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch üblichen Form wiedergegeben.
- source_word: אִשְׁתֶּךָ
  choice: deine Frau
  rationale: Die Konstruktform mit Suffix der zweiten Person maskulin Singular bezeichnet eindeutig Abrahams Ehefrau.
- source_word: וַיֹּאמֶר
  choice: Er antwortete
  rationale: Wörtlich steht „und er sagte“. Da die Äußerung unmittelbar auf eine Frage folgt, gibt „antwortete“ die Gesprächsfunktion im Deutschen präzise und natürlich wieder.
- source_word: הִנֵּה
  choice: Dort
  rationale: Die deiktische Partikel lenkt in der knappen Ortsangabe die Aufmerksamkeit auf Saras Aufenthaltsort. „Dort“ bewahrt diese Zeigefunktion besser als eine vollständig ergänzte Aussage wie „Sie ist“.
- source_word: בָאֹהֶל
  choice: im Zelt
  rationale: ב mit dem bestimmten Substantiv אֹהֶל bedeutet „in dem Zelt“, im Deutschen natürlich zusammengezogen zu „im Zelt“.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die knappe Antwort „Dort, im Zelt“ bewahrt die Prägnanz und deiktische Wirkung des Hebräischen. Die masoretischen Sonderpunkte über אֵלָיו beeinflussen den übersetzbaren Konsonantentext nicht und werden daher nicht eigens angemerkt.
