id: GEN.18.14
reference: Genesis 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: de
  text: Ist für Jahwe irgendetwas zu schwer?[a] Zur festgesetzten Zeit werde ich zu dir zurückkehren, etwa um diese Zeit im nächsten Jahr,[b] und Sara wird einen Sohn haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist für Jahwe irgendetwas zu wunderbar?“ Das hebräische Verb kann etwas Außergewöhnliches oder das menschliche Vermögen Übersteigendes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um die Zeit des Lebens“. Die hebräische Wendung meint hier wahrscheinlich dieselbe Zeit beziehungsweise Jahreszeit im folgenden Jahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: Ist … irgendetwas zu schwer?
  rationale: Das Nifal von פלא kann etwas Außergewöhnliches, Wunderbares oder die eigenen Fähigkeiten Übersteigendes bezeichnen. In der rhetorischen Frage gibt „zu schwer“ den Gedanken verständlich wieder, ohne ihn mit „unmöglich“ unnötig zu verstärken; die Bedeutungsalternative wird in der Fußnote bewahrt.
- source_word: מֵיְהוָה
  choice: für Jahwe
  rationale: 'Die Präposition מן bezeichnet hier bei פלא die Grenze der Fähigkeit: etwas wäre „zu schwer für“ jemanden. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.'
- source_word: דָּבָר
  choice: irgendetwas
  rationale: דבר bezeichnet hier allgemein eine Sache oder Angelegenheit. Im Deutschen ist „irgendetwas“ in dieser rhetorischen Frage natürlich und umfassend.
- source_word: לַמּוֹעֵד
  choice: Zur festgesetzten Zeit
  rationale: מועד bezeichnet einen bestimmten, festgelegten Zeitpunkt. „Zur festgesetzten Zeit“ bewahrt diese Präzision in natürlichem Deutsch.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: werde ich zu dir zurückkehren
  rationale: שוב bezeichnet hier die Rückkehr; אליך richtet die Aussage im maskulinen Singular an Abraham. Die deutsche Wiedergabe bleibt nah an Form und Sinn.
- source_word: כָּעֵת חַיָּה
  choice: etwa um diese Zeit im nächsten Jahr
  rationale: Die schwierige hebräische Wendung bedeutet im Kontext offenbar dieselbe Jahreszeit im folgenden Jahr. Die idiomatische Übersetzung macht den zeitlichen Bezug verständlich; die wörtlichere Form wird in der Fußnote genannt.
- source_word: וּלְשָׂרָה בֵן
  choice: und Sara wird einen Sohn haben
  rationale: Die hebräische Nominalkonstruktion ist im Zusammenhang als zukünftige Zusage zu verstehen. Diese Wiedergabe ist im Deutschen natürlich, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft der rhetorischen Frage
  choice: Ist für Jahwe irgendetwas zu schwer?
  alternative: Ist für Jahwe irgendetwas zu wunderbar?; Ist für Jahwe irgendetwas unmöglich?
  rationale: „Zu schwer“ bringt Gottes Fähigkeit, die Zusage zu erfüllen, klar zum Ausdruck. Es vermeidet sowohl die mögliche moderne Fehlbedeutung von „zu wunderbar“ als auch die stärkere philosophische Verallgemeinerung durch „unmöglich“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt knapp und kraftvoll; schwierige lexikalische Möglichkeiten werden nicht im Haupttext aufgelöst, sondern in Fußnoten offengelegt.
