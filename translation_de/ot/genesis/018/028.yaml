  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: de
  text: 'Was, wenn von den fünfzig Gerechten fünf fehlen? Willst du wegen dieser fünf die ganze Stadt vernichten? Er antwortete: »Ich werde sie nicht vernichten, wenn ich dort fünfundvierzig finde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Was, wenn
  rationale: Leitet Abrahams hypothetische, vorsichtige Nachfrage in natürlichem modernem Deutsch ein und bewahrt den Möglichkeitscharakter.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: von den fünfzig Gerechten fünf fehlen
  rationale: 'Gibt die zahlenmäßige Unterschreitung idiomatisch wieder: Statt fünfzig werden nur fünfundvierzig Gerechte vorausgesetzt.'
- source_word: הַצַּדִּיקִם
  choice: die Gerechten
  rationale: Bewahrt den moralischen und rechtlichen Gehalt des hebräischen Begriffs und entspricht dem etablierten deutschen Bibelwortschatz.
- source_word: הֲתַשְׁחִית
  choice: Willst du … vernichten?
  rationale: Der Hifil von שׁחת bezeichnet hier das Vernichten; die direkte Frage passt zu Abrahams eindringlicher Fürbitte.
- source_word: בַּחֲמִשָּׁה
  choice: wegen dieser fünf
  rationale: Versteht die Präposition kausal und nimmt die unmittelbar zuvor genannten fünf fehlenden Gerechten auf, ohne die rhetorische Zuspitzung abzuschwächen.
- source_word: אֶת כָּל הָעִיר
  choice: die ganze Stadt
  rationale: Natürliche deutsche Wiedergabe, die die im Hebräischen betonte Gesamtheit wahrt.
- source_word: וַיֹּאמֶר
  choice: Er antwortete
  rationale: Im Dialog bezeichnet das allgemeine Verb אמר hier funktional eine Antwort; die Wiedergabe vermeidet ein schwerfälliges wiederholtes „sagte“.
- source_word: לֹא אַשְׁחִית
  choice: Ich werde sie nicht vernichten
  rationale: Wiederholt dasselbe deutsche Verb wie in Abrahams Frage; das Pronomen „sie“ bezieht sich eindeutig auf die Stadt.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: wenn ich dort fünfundvierzig finde
  rationale: Bewahrt Bedingung, Ortsangabe und Zahl in natürlicher deutscher Wortstellung.
theological_decisions:
- issue: Wiedergabe von צַדִּיקִים
  choice: Gerechte
  alternative: rechtschaffene Menschen
  rationale: „Gerechte“ hält die moralische und zugleich rechtliche Spannung des Begriffs offen und legt keine engere konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte hypothetische Frage lässt Abrahams vorsichtige Fürbitte erkennen; die Wiederholung von „vernichten“ bildet die hebräische Verknüpfung zwischen Frage und Antwort ab.
