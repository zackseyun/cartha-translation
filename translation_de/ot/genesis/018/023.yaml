  text: וַ/יִּגַּ֥שׁ אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הַ/אַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: de
  text: 'Da trat Abraham näher und sagte: »Willst du wirklich den Gerechten zusammen mit dem Gottlosen hinwegraffen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vernichten« oder »wegfegen«; das hebräische Verb bezeichnet hier das Beseitigen im Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat näher
  rationale: נגשׁ bezeichnet das Herantreten oder Näherkommen. »trat näher« bewahrt sowohl die räumliche Bewegung als auch Abrahams rhetorisches Vortreten zur Fürsprache.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Die im Deutschen eingebürgerte Form des Personennamens.
- source_word: וַיֹּאמַר
  choice: sagte
  rationale: אמר ist das gewöhnliche hebräische Verb für »sagen« und wird im modernen deutschen Erzählstil natürlich mit »sagte« wiedergegeben.
- source_word: הַאַף
  choice: wirklich
  rationale: Die Verbindung der Fragepartikel mit אַף verstärkt die Frage. »wirklich« gibt Abrahams erstaunten und eindringlichen Einspruch in natürlichem Deutsch wieder.
- source_word: תִּסְפֶּה
  choice: hinwegraffen
  rationale: ספה meint hier das Beseitigen im Gericht. »hinwegraffen« bewahrt das kraftvolle Bild eines gemeinsamen Untergangs, ohne bereits eine bestimmte Art der Vernichtung festzulegen.
- source_word: צַדִּיק
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv steht im Singular, hat hier jedoch allgemeingültige, repräsentative Kraft. Der deutsche Singular bewahrt diese Form und die moralisch-rechtliche Kategorie.
- source_word: עִם
  choice: zusammen mit
  rationale: עִם bedeutet »mit«; »zusammen mit« hebt die für Abrahams Frage entscheidende gemeinsame Behandlung im Gericht hervor.
- source_word: רָשָׁע
  choice: dem Gottlosen
  rationale: Der substantivierte Singular bezeichnet repräsentativ den moralisch Schuldigen im Gegensatz zum Gerechten. »Gottloser« ist eine geläufige, würdevolle Wiedergabe von רָשָׁע und bewahrt den moralischen Gegensatz.
theological_decisions:
- issue: Allgemeingültige moralische Kategorien im Singular
  choice: צַדִּיק und רָשָׁע werden als »der Gerechte« und »der Gottlose« wiedergegeben.
  alternative: Pluralische Klassenbezeichnungen wie »die Gerechten« und »die Gottlosen« oder individualisierend »ein gerechter Mensch« und »ein gottloser Mensch«.
  rationale: Der hebräische Singular formuliert anhand repräsentativer Kategorien einen Grundsatz göttlicher Gerechtigkeit. Der deutsche substantivierte Singular bewahrt diese grammatische und theologische Spannung, ohne sie zu kollektivieren oder auf zwei konkrete Einzelpersonen zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. »Da trat … näher« bildet die hebräische Erzählfolge natürlich ab; die direkte Frage bleibt knapp und eindringlich.
