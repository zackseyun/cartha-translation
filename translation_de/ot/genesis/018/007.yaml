  text: וְ/אֶל הַ/בָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַ/יִּקַּ֨ח בֶּן בָּקָ֜ר רַ֤ךְ וָ/טוֹב֙ וַ/יִּתֵּ֣ן אֶל הַ/נַּ֔עַר וַ/יְמַהֵ֖ר לַ/עֲשׂ֥וֹת אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: de
  text: Abraham lief zur Herde, nahm ein zartes, gutes Kalb und gab es dem jungen Mann[a]. Der beeilte sich, es zuzubereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dem Diener“ oder „dem Jungen“. Das hebräische Wort הַנַּעַר kann je nach Zusammenhang einen Jungen, einen jungen Mann oder einen Diener bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: zur Herde
  rationale: Der Ausdruck bezeichnet hier kollektiv den Rinderbestand, aus dem Abraham ein Tier auswählt. „Herde“ ist im Deutschen natürlich und kontextgerecht.
- source_word: רָץ
  choice: lief
  rationale: Das Verb bezeichnet ausdrücklich das Laufen und bewahrt die lebendige Dringlichkeit der gastfreundlichen Vorbereitungen.
- source_word: בֶּן־בָּקָר
  choice: ein Kalb
  rationale: Die wörtliche Verbindung „Sohn des Rindes“ ist eine idiomatische Bezeichnung für ein junges Rind; „Kalb“ ist hier die klare deutsche Entsprechung.
- source_word: רַךְ וָטוֹב
  choice: zartes, gutes
  rationale: „Zart“ gibt רַךְ direkt wieder; „gut“ bewahrt die offene Qualitätsangabe von טוֹב, ohne sie enger als „ausgesucht“ oder „prächtig“ zu bestimmen.
- source_word: הַנַּעַר
  choice: dem jungen Mann
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. „Junger Mann“ wahrt den Grundsinn, ohne die im Kontext mögliche, aber nicht ausdrücklich bezeichnete Dienerrolle in den Haupttext einzutragen.
- source_word: וַיְמַהֵר
  choice: Der beeilte sich
  rationale: Der Numerus des hebräischen Verbs ist eindeutig Singular, sein Subjekt ist jedoch nicht ausdrücklich genannt. Die deutsche Formulierung bezieht es im natürlichen Satzanschluss auf den jungen Mann und gibt die Eile klar wieder.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: es zuzubereiten
  rationale: עשה bedeutet allgemein „machen/tun“, bezeichnet in diesem Zusammenhang jedoch idiomatisch die Zubereitung des Kalbes als Speise.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei deutschen Sätze vermeiden eine missverständliche Zuordnung von „er“ zu Abraham und machen zugleich den naheliegenden Subjektwechsel zum jungen Mann transparent. Die offene Bedeutung von הַנַּעַר wird durch die Fußnote erhalten.
