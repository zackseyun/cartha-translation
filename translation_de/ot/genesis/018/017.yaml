source:
  edition: WLC
  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: de
  text: 'Und Jahwe sagte: »Sollte ich vor Abraham verbergen, was ich tue?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Verberge ich vor Abraham, was ich tue?«'
    reason: Lexikalische und syntaktische Alternative zur abwägenden Wiedergabe der Fragepartikel mit Partizip.
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: Und Jahwe
  rationale: Die Erzählform wird mit »Und« fortgeführt; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אָמָר
  choice: sagte
  rationale: Das Wayyiqtol führt die Erzählung in der einfachen Vergangenheit weiter.
- source_word: הַֽ/מְכַסֶּה
  choice: Sollte ich … verbergen
  rationale: Die Fragepartikel mit Partizip wird als abwägende rhetorische Selbstfrage wiedergegeben; die wörtlichere präsentische Lesart bleibt in der Fußnote erhalten.
- source_word: מֵֽ/אַבְרָהָם
  choice: vor Abraham
  rationale: Bei »verbergen« bezeichnet מִן die Person, der etwas verborgen bleibt; »vor Abraham verbergen« ist im Deutschen idiomatisch.
- source_word: אֲשֶׁר
  choice: was
  rationale: Das Relativpronomen wird in der substantivierten Verbindung natürlich mit »was« wiedergegeben.
- source_word: אֲנִי עֹשֶׂה
  choice: was ich tue
  rationale: Die präsentische Form wahrt den unmittelbaren Wortlaut und legt die im Kontext mögliche bevorstehende Handlung nicht ausdrücklich fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« transliteriert, sodass der im hebräischen Text ausdrücklich gebrauchte Bundesname als Name erkennbar bleibt.
- issue: Zeitlicher Bezug von אֲנִי עֹשֶׂה
  choice: was ich tue
  alternative: was ich tun werde / was ich zu tun im Begriff bin
  rationale: Das hebräische Partizip kann im Zusammenhang auf unmittelbar bevorstehendes Handeln weisen. Die Übersetzung bewahrt jedoch die formal präsentische und dadurch offenere Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Selbstfrage klingt natürlich, ohne ihren abwägenden Charakter oder die zeitliche Offenheit des hebräischen Partizips zu beseitigen.
