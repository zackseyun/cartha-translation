  naturalness: '„Und Jahwe sagte: »Sollte ich vor Abraham verbergen, was ich tue?«“ ist idiomatisches, würdiges modernes Standarddeutsch. „Vor Abraham verbergen“ ist bei diesem Verb natürlich und präzise.'
