source:
  edition: WLC
  text: וַ/תַּבֵּ֥ט אִשְׁתּ֖/וֹ מֵ/אַחֲרָ֑י/ו וַ/תְּהִ֖י נְצִ֥יב מֶֽלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: de
  text: Doch seine Frau blickte hinter ihm zurück[a], und sie wurde zu einer Salzsäule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „blickte von hinter ihm“; die hebräische Wendung kann sowohl ihre Position hinter Lot als auch die Richtung ihres Blicks hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: blickte … zurück
  rationale: נבט bedeutet „blicken, schauen“. Im Zusammenhang mit מֵאַחֲרָיו gibt „zurückblicken“ die Handlung im Deutschen natürlich wieder, ohne ein Motiv hinzuzufügen.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Das Substantiv mit Suffix der 3. Person Maskulin Singular bezeichnet Lots Frau.
- source_word: מֵאַחֲרָיו
  choice: hinter ihm
  rationale: Die Wendung bedeutet wörtlich etwa „von hinter ihm“. „Hinter ihm“ bewahrt die räumliche Beziehung zu Lot; die mögliche engere Verbindung mit dem Blick wird in der Fußnote offengehalten.
- source_word: וַתְּהִי
  choice: sie wurde
  rationale: היה bezeichnet hier in der fortlaufenden Erzählung am natürlichsten das Eintreten eines neuen Zustands.
- source_word: נְצִיב מֶלַח
  choice: zu einer Salzsäule
  rationale: נְצִיב bezeichnet etwas Aufgerichtetes oder Feststehendes; zusammen mit מֶלַח ist „Salzsäule“ die prägnante und herkömmliche deutsche Wiedergabe.
theological_decisions:
- issue: Art der Verwandlung von Lots Frau
  choice: „sie wurde zu einer Salzsäule“ als unmittelbare Erzählbehauptung
  alternative: „sie wurde wie eine Salzsäule“ oder „sie stand da als Salzsäule“
  rationale: Im Hebräischen fehlt ein Vergleichssignal. Die Übersetzung schwächt die Aussage daher nicht zu einem Gleichnis ab und fügt zugleich keine Erklärung des Vorgangs hinzu.
- issue: Bezug von מֵאַחֲרָיו
  choice: räumlich als „hinter ihm“, bei zugleich erkennbarem Zurückblicken
  alternative: „sie blickte von hinter ihm“ oder „sie blickte hinter sich“
  rationale: Die hebräische Form kann ihre Position hinter Lot hervorheben, ist im Zusammenhang aber eng mit dem Blick zurück verbunden. Die Hauptfassung bleibt verständlich und die Fußnote bewahrt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ markiert den Gegensatz zur vorausgehenden Fluchtanweisung; die knappe Satzstruktur erhält die Eindringlichkeit des Hebräischen.
