source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: de
  text: 'Sieh doch: Dein Diener hat Gunst in deinen Augen gefunden, und du hast mir große Güte erwiesen, indem du mein Leben bewahrt hast. Aber ich kann mich nicht ins Bergland retten; sonst holt mich das Unheil[a] ein, und ich sterbe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Böse«; gemeint ist hier das drohende Unheil beziehungsweise die Katastrophe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das Folgende; נָא verleiht der Äußerung den Ton einer dringlichen, höflichen Bitte. „Sieh doch“ gibt beides in natürlichem Deutsch wieder.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: Gunst in deinen Augen gefunden
  rationale: Die geläufige hebräische Wendung bezeichnet wohlwollende Zuwendung. Die Bildsprache „in deinen Augen“ bleibt erhalten.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Hier handelt es sich um eine ehrerbietige Selbstbezeichnung gegenüber einem Höhergestellten; „Sklave“ würde einen in diesem Zusammenhang nicht hervorgehobenen Rechtsstatus nahelegen.
- source_word: וַתַּגְדֵּל חַסְדְּךָ אֲשֶׁר עָשִׂיתָ עִמָּדִי
  choice: du hast mir große Güte erwiesen
  rationale: Die deutsche Wendung gibt sowohl die Intensivierung durch וַתַּגְדֵּל als auch die konkret erwiesene חֶסֶד natürlich wieder, ohne eine unidiomatische Formulierung wie „du hast deine Güte groß gemacht“ zu erzwingen.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: indem du mein Leben bewahrt hast
  rationale: נֶפֶשׁ bezeichnet hier Lots Leben beziehungsweise seine Person. Die Formulierung drückt das bewirkte Weiterleben aus, ohne zusätzliche soteriologische Bedeutung einzutragen.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: mich ins Bergland retten
  rationale: הָהָרָה bezeichnet in diesem Erzählzusammenhang die bergige Gegend als Ziel der Flucht. „Bergland“ ist im Deutschen natürlicher und räumlich passender als der möglicherweise auf einen einzelnen Gipfel bezogene Ausdruck „der Berg“.
- source_word: פֶּן תִּדְבָּקַנִי הָרָעָה
  choice: sonst holt mich das Unheil ein
  rationale: פֶּן leitet die befürchtete Folge ein; דבק bedeutet hier idiomatisch „einholen/erreichen“. רָעָה bezeichnet in diesem Kontext die drohende Katastrophe, nicht moralische Bosheit.
theological_decisions:
- issue: Wiedergabe von חֶסֶד in Lots Bitte an die göttlichen Boten
  choice: Güte
  alternative: beständige Liebe; Barmherzigkeit; Treue
  rationale: חֶסֶד umfasst loyale, gnädige und tätige Zuwendung. Im unmittelbaren Kontext steht die erwiesene Rettungsgüte im Vordergrund. „Güte“ bewahrt diese Breite, ohne hier eine ausdrücklich technische Bundesformel anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ehrerbietige und dringliche Bitte bleibt hörbar; hebräische Bildsprache wird dort bewahrt, wo sie im Deutschen verständlich ist.
