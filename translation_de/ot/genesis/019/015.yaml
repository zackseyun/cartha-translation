base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: de
  text: 'Als die Morgendämmerung heraufzog, drängten die Engel Lot: »Steh auf, nimm deine Frau und deine beiden Töchter, die hier sind, damit du nicht wegen der Schuld der Stadt[a] weggerafft wirst!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Bestrafung der Stadt«; wörtlicher auch: »in der Verfehlung der Stadt«. Das hebräische Wort kann die Verfehlung, die Schuld oder die daraus folgende Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Als die Morgendämmerung heraufzog
  rationale: Gibt die zeitliche Funktion von כְּמוֹ und das Bild des aufgehenden Tages natürlich und würdevoll wieder.
- source_word: וַיָּאִיצוּ
  choice: drängten
  rationale: Das Verb bezeichnet nachdrückliches Antreiben zu schnellem Handeln; »drängten« bewahrt die Dringlichkeit.
- source_word: הַמַּלְאָכִים
  choice: die Engel
  rationale: Im Kontext sind himmlische Boten gemeint; »Engel« ist dafür die übliche und klare deutsche Bezeichnung.
- source_word: קוּם קַח
  choice: Steh auf, nimm
  rationale: Beide Imperative werden gesondert und in natürlichem modernem Deutsch wiedergegeben.
- source_word: הַנִּמְצָאֹת
  choice: die hier sind
  rationale: Das Partizip bedeutet wörtlich etwa »die sich vorfinden/anwesend sind«; die Formulierung bezeichnet natürlich die bei Lot befindlichen Töchter.
- source_word: פֶּן תִּסָּפֶה
  choice: damit du nicht … weggerafft wirst
  rationale: Die Konstruktion drückt eine warnende Vermeidung aus; der Nifal von ספה bezeichnet hier das gemeinsame Hinweggerafftwerden im Gericht.
- source_word: בַּעֲוֺן הָעִיר
  choice: wegen der Schuld der Stadt
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Gerichtsfolge bezeichnen. »Wegen der Schuld« verbindet die Ursache mit dem drohenden Gericht, ohne die Bedeutungsbreite zu verdecken.
theological_decisions:
- issue: Bedeutung von עָוֹן im Gerichtskontext
  choice: wegen der Schuld der Stadt
  alternative: bei der Bestrafung der Stadt; in der Verfehlung der Stadt
  rationale: Der hebräische Ausdruck kann die Verfehlung, die daraus erwachsende Schuld oder deren Strafe bezeichnen. Der Haupttext formuliert idiomatisch die Schuld als Ursache des drohenden Gerichts; die Fußnote bewahrt die weiteren möglichen Nuancen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und dringlich; genuine Mehrdeutigkeit bei עָוֹן wird durch eine Fußnote offengehalten.
