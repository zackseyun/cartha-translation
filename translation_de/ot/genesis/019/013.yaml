source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: de
  text: Denn wir sind im Begriff, diesen Ort zu vernichten, weil ihr Geschrei vor Yahweh groß geworden ist[a]. Yahweh hat uns gesandt, ihn zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Geschrei über sie“. Die hebräische Form bedeutet wörtlich „ihr Geschrei“, kann im Zusammenhang aber als das über die Bewohner dieses Ortes erhobene Geschrei verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: sind im Begriff, … zu vernichten
  rationale: Das pluralische Hifil-Partizip bezeichnet hier im Rahmen der angekündigten Gerichtshandlung eine unmittelbar bevorstehende Tat. Die Formulierung gibt diesen futurisch-imminenten Sinn natürlich wieder.
- source_word: הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: מָקוֹם bedeutet hier schlicht „Ort“; das Demonstrativum wird durch „diesen“ bewahrt.
- source_word: גָדְלָה
  choice: ist … groß geworden
  rationale: Das Qal-Perfekt beschreibt eine eingetretene Zunahme mit gegenwärtigem Ergebnis.
- source_word: צַעֲקָתָם
  choice: das Geschrei über sie
  rationale: צְעָקָה bezeichnet einen lauten Hilferuf, Klageschrei oder Protest. Der pronominale Ausdruck kann formal als „ihr Geschrei“ wiedergegeben werden; im Kontext von Genesis 18,20 liegt jedoch „das Geschrei über sie“ nahe. Die formale Alternative bleibt in der Fußnote erhalten.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: vor Yahweh
  rationale: Die idiomatische Verbindung bedeutet „vor/in der Gegenwart von“ und wird im Deutschen natürlich mit „vor“ wiedergegeben.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: hat uns gesandt
  rationale: Die abgeschlossene Sendung begründet den gegenwärtigen Auftrag; das deutsche Perfekt stellt diesen Zusammenhang natürlich dar.
- source_word: לְשַׁחֲתָהּ
  choice: ihn zu vernichten
  rationale: Der Infinitiv gibt den Zweck der Sendung an. Das feminine Suffix bezieht sich sinngemäß auf die Stadt beziehungsweise den Ort; im Deutschen richtet sich das Pronomen nach dem maskulinen „Ort“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Yahweh“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von צַעֲקָתָם
  choice: das Geschrei über sie
  alternative: ihr Geschrei
  rationale: Der Kontext legt einen gegen die Bewohner gerichteten Klage- oder Hilfeschrei nahe, doch die hebräische Suffixform lässt sich formal auch als „ihr Geschrei“ verstehen. Diese echte Mehrdeutigkeit wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Begriff sein“ markiert die unmittelbar bevorstehende Handlung; „vernichten“ hält die Wiederholung desselben hebräischen Verbalstamms fest. Der Gottesname erscheint konsequent als „Yahweh“.
