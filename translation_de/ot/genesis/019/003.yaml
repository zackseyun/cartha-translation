  text: וַ/יִּפְצַר בָּ֣/ם מְאֹ֔ד וַ/יָּסֻ֣רוּ אֵלָ֔י/ו וַ/יָּבֹ֖אוּ אֶל בֵּית֑/וֹ וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וּ/מַצּ֥וֹת אָפָ֖ה וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: de
  text: Doch er drängte sie sehr[a]. Da kehrten sie bei ihm ein und kamen in sein Haus. Er bereitete ihnen ein Festmahl, backte ungesäuertes Brot[b], und sie aßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er setzte ihnen sehr zu“ / „er bestand nachdrücklich darauf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch im Plural: „ungesäuerte Brote“ oder „ungesäuerte Fladen“; gemeint ist ohne Sauerteig zubereitetes Brot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: er drängte sie sehr
  rationale: פצר bezeichnet nachdrückliches Drängen; מְאֹד verstärkt die Handlung. Die Formulierung ist quellennah und im modernen Deutschen verständlich.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: sie kehrten bei ihm ein
  rationale: סור bezeichnet ein Abbiegen bzw. Sich-Hinwenden. Im Kontext der angebotenen Unterkunft gibt „bei ihm einkehren“ die Bewegung und die gastliche Aufnahme natürlich wieder.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: kamen in sein Haus
  rationale: Die einfache Bewegungsangabe בוא mit אֶל־בֵּיתוֹ wird direkt und idiomatisch wiedergegeben.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: Das Wort kann ein Mahl oder Gelage einschließlich Trinken bezeichnen. „Festmahl“ bewahrt den feierlichen Charakter, ohne Alkohol eigens hervorzuheben.
- source_word: מַצּוֹת אָפָה
  choice: backte ungesäuertes Brot
  rationale: מַצּוֹת bezeichnet ungesäuerte Brote bzw. Fladen; die übliche deutsche Sammelbezeichnung „ungesäuertes Brot“ ist klar und natürlich. אָפָה wird ausdrücklich mit „backte“ wiedergegeben.
- source_word: וַיֹּאכֵלוּ
  choice: und sie aßen
  rationale: Die knappe abschließende Erzählhandlung und die hebräische Satzverknüpfung bleiben erhalten.
