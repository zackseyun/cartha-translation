base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: de
  text: 'Als sie sie hinausgebracht hatten, sagte er: »Flieh um dein Leben! Sieh nicht zurück und bleib nirgends in der ganzen Ebene stehen. Flieh ins Bergland[a], sonst wirst du weggerafft[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Berg« oder »ins Gebirge«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sonst wirst du vernichtet« beziehungsweise »sonst kommst du um«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: hinaus
  rationale: Der Richtungsadverb bezeichnet die Bewegung aus der Stadt beziehungsweise aus dem Inneren nach draußen; „hinausbringen“ ist im Deutschen natürlich und präzise.
- source_word: הִמָּלֵט
  choice: Flieh
  rationale: Der Nifal-Imperativ fordert dringend zur Rettung durch Flucht auf. „Flieh“ ist knapp, verständlich und lässt sich an beiden Stellen wiederholen.
- source_word: עַל נַפְשֶׁךָ
  choice: um dein Leben
  rationale: Die Wendung bezeichnet die Rettung des eigenen Lebens. „Flieh um dein Leben“ gibt den idiomatischen Sinn und die Dringlichkeit natürlich wieder.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Sieh dich nicht um
  rationale: Die hebräische Wendung meint, nicht nach hinten beziehungsweise zurückzublicken. Die deutsche Formulierung ist idiomatisch, ohne die Richtung des Blicks zu verändern.
- source_word: וְאַל תַּעֲמֹד
  choice: und bleib … nicht stehen
  rationale: עמד bezeichnet hier im Zusammenhang der Flucht das Anhalten oder Verweilen, nicht lediglich eine Körperhaltung.
- source_word: בְּכָל הַכִּכָּר
  choice: nirgends in der ganzen Ebene
  rationale: כִּכָּר bezeichnet hier die Ebene beziehungsweise den ebenen Umkreis; die Formulierung gibt die ausschließende, distributive Kraft von בְּכָל idiomatisch wieder.
- source_word: הָהָרָה
  choice: ins Bergland
  rationale: Die Richtungsform kann den Berg, das Gebirge oder das bergige Land bezeichnen. „Ins Bergland“ bildet den topografischen Gegensatz zur Ebene natürlich ab, ohne einen einzelnen Gipfel festzulegen.
- source_word: פֶּן תִּסָּפֶה
  choice: sonst wirst du weggerafft
  rationale: Der Nifal von ספה kann bedeuten, in einer Katastrophe weggerafft, vernichtet oder mit anderen beseitigt zu werden. „Weggerafft“ bewahrt das Bild eines drohenden Gerichts, ohne die Art des Untergangs näher zu bestimmen.
theological_decisions:
- issue: Identität des Sprechers
  choice: „sagte er“
  alternative: „sagten sie“ nach dem Sinn oder ausdrücklich „der Engel sagte“
  rationale: Das hebräische Verb steht im Singular. Die Übersetzung bewahrt diese grammatische Angabe, ohne zu entscheiden, welcher der Boten spricht oder ob einer die Gruppe vertritt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knappen Imperativen und würdigem Erzählton. Die Wiederholung von „Flieh“ bildet die Wiederholung des hebräischen Imperativs ab; die doppelte Akkusativfolge „sie sie“ ist grammatisch nötig und im Zusammenhang eindeutig.
