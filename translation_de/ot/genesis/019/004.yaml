base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: de
  text: Noch bevor sie sich niederlegten, umstellten[a] die Männer der Stadt, die Männer von Sodom, das Haus – vom Jungen bis zum Alten, das ganze Volk aus allen Teilen der Stadt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „versammelten sich rings um das Haus“. Das hebräische Verb kann sowohl das Umringen als auch das Sichversammeln rings um etwas bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „vom Rand/Ende her“. Im Zusammenhang bedeutet dies wahrscheinlich „aus allen Teilen der Stadt“ oder „aus jedem Viertel der Stadt“.'
    reason: source_ambiguity
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Noch bevor sie sich niederlegten
  rationale: Die Wendung bezeichnet den Zeitpunkt vor dem Niederlegen zur Nacht. „Sich niederlegten“ bewahrt den konkreten Sinn von שׁכב, ohne „schlafen gingen“ ausdrücklich in den Text einzutragen.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: die Männer der Stadt, die Männer von Sodom
  rationale: Die appositionale Wiederholung des hebräischen Textes bleibt erhalten; אַנְשֵׁי bezeichnet hier ausdrücklich Männer.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: umstellten das Haus
  rationale: נסב mit עַל beschreibt ein Sich-ringsum-Stellen oder Sich-ringsum-Sammeln. „Umstellten“ gibt in diesem Zusammenhang die einschließende Wirkung der Menge knapp und natürlich wieder.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: vom Jungen bis zum Alten
  rationale: Die formelhafte Spannweite vom jungen bis zum alten männlichen Angehörigen der Gruppe wird bewahrt; sie unterstreicht deren umfassende Zusammensetzung.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: עָם ist ein Kollektivbegriff. „Das ganze Volk“ wahrt die umfassende Aussage, ohne den zuvor ausdrücklich genannten männlichen Bezug umzudeuten.
- source_word: מִקָּצֶה
  choice: aus allen Teilen der Stadt
  rationale: Wörtlich bezeichnet קָצֶה ein Ende oder einen Rand. In diesem Kontext wird die Wendung räumlich und idiomatisch als Herkunft aus sämtlichen Teilen der Stadt verstanden; die im Hebräischen nur implizite Stadt wird für verständliches Deutsch ergänzt.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Menge
  choice: Die ausdrückliche Bezeichnung als „Männer“ wird beibehalten; כָּל הָעָם folgt als „das ganze Volk“.
  alternative: Alle Ausdrücke einheitlich und geschlechtsneutral als „Leute“ oder „Bewohner“ wiederzugeben.
  rationale: Der hebräische Text beginnt zweimal mit dem spezifischen אַנְשֵׁי („Männer von“) und verwendet danach den kollektiven Begriff עָם. Die Übersetzung erhält diese sprachliche Spannung, statt sie zu vereinheitlichen.
- issue: Umfang von מִקָּצֶה
  choice: 'Räumlich: „aus allen Teilen der Stadt“.'
  alternative: 'Distributiv: „bis auf den Letzten“ oder enger wörtlich: „vom Rand her“.'
  rationale: Im Zusammenhang mit den Männern der Stadt liegt eine räumliche Herkunftsangabe nahe. Da die knappe hebräische Formulierung auch anders aufgefasst werden kann, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionale Wiederholung und die umfassende Aufzählung des Hebräischen bleiben erhalten; nur die für natürliches Deutsch nötige Präzisierung „der Stadt“ wird ergänzt.
