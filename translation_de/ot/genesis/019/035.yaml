  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: de
  text: So gaben sie ihrem Vater auch in jener Nacht Wein zu trinken. Dann stand die Jüngere auf und legte sich zu ihm. Er aber merkte weder, wann sie sich hinlegte, noch wann sie aufstand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: gaben … Wein zu trinken
  rationale: Der Hifil von שׁקה bezeichnet das Zu-trinken-Geben beziehungsweise Tränken. Die Formulierung bewahrt die kausative Bedeutung, ohne bereits im Verb ausdrücklich Trunkenheit zu behaupten.
- source_word: גַּם
  choice: auch
  rationale: Das Wort knüpft an die vorausgehende Nacht an und markiert die Wiederholung des Geschehens.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Eine natürliche deutsche Zeitangabe, die den Rückbezug des hebräischen Demonstrativums wahrt.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: Dann stand die Jüngere auf
  rationale: הַצְּעִירָה bezeichnet die jüngere weibliche Person, im Kontext die jüngere Tochter. „Die Jüngere“ ist knapp und eindeutig; „dann“ gibt die fortlaufende Erzählfolge natürlich wieder.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: und legte sich zu ihm
  rationale: Die Wendung bezeichnet im Kontext den Geschlechtsverkehr. „Sich zu ihm legen“ bleibt dem hebräischen Bild nahe und ist im Deutschen verständlich, ohne unnötig expliziter zu werden.
- source_word: וְלֹא יָדַע
  choice: Er aber merkte … nicht
  rationale: ידע bezeichnet hier Wahrnehmung beziehungsweise Bewusstsein. „Merkte nicht“ gibt den kontextuellen Sinn im modernen Deutsch natürlicher wieder als das missverständliche „wusste nicht“.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: weder, wann sie sich hinlegte, noch wann sie aufstand
  rationale: Die beiden mit ב gebildeten Infinitivkonstruktionen sind zeitlich zu verstehen. Die parallele weder-noch-Fassung bewahrt ihre Symmetrie und den Umfang seiner Unwissenheit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit enger Bindung an die hebräische Satzfolge. Die sexuelle Wendung wird weder verhüllt noch unnötig expliziert. Keine Fußnote nötig, da die zeitliche Deutung der beiden Infinitivkonstruktionen im Haupttext klar und quellentreu wiedergegeben ist.
