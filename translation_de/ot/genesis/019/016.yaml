base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: de
  text: Doch er zögerte. Da packten die Männer[a] ihn, seine Frau und seine beiden Töchter an der Hand, weil Jahwe Erbarmen mit ihm hatte. Sie führten ihn hinaus und setzten ihn außerhalb der Stadt ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die beiden Besucher, die im Zusammenhang als Engel beziehungsweise Boten Gottes erkennbar sind; hier nennt der hebräische Text sie „die Männer“.
    reason: Kontextuelle Identifizierung bei Bewahrung der ausdrücklichen Bezeichnung des Verses.
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: er zögerte
  rationale: Das Verb bezeichnet ein Säumen oder Verzögern. „Er zögerte“ ist im Deutschen natürlich und bewahrt angesichts der gebotenen Eile die erzählerische Spannung, ohne das Motiv für sein Verhalten festzulegen.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der hebräische Vers nennt die Besucher ausdrücklich „die Männer“. Ihre aus dem Kontext erkennbare Identität als Engel wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
- source_word: וַיַּחֲזִקוּ ... בְּיָד
  choice: packten ... an der Hand
  rationale: Die Konstruktion bezeichnet ein festes Ergreifen. „Packten“ vermittelt die Dringlichkeit der Rettung; „an der Hand“ gibt die konkrete Handlung idiomatisch wieder.
- source_word: בְּיָדוֹ וּבְיַד אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: ihn, seine Frau und seine beiden Töchter an der Hand
  rationale: Der hebräische Text wiederholt die Hand-Bezeichnung, verwendet beim letzten Glied jedoch grammatisch den Singular. Die deutsche Sammelformulierung ist natürlich und lässt erkennen, dass alle vier Personen ergriffen wurden, ohne eine unnatürliche anatomische Aussage zu erzeugen.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: weil Jahwe Erbarmen mit ihm hatte
  rationale: Die Präposition wird hier kausal verstanden; חֶמְלָה bezeichnet Erbarmen, Mitleid oder Schonung. Die Formulierung macht Gottes rettendes Motiv ausdrücklich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּצִאֻהוּ
  choice: sie brachten ihn hinaus
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszubringen, und beschreibt hier die aktive Rettung Lots.
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: ließen ihn außerhalb der Stadt stehen
  rationale: Der Hifil von נוח bezeichnet hier das Absetzen beziehungsweise Zur-Ruhe-Bringen an einem Ort. Die deutsche Wendung gibt das Ende der Bewegung natürlich wieder, ohne unnötig anzudeuten, Lot sei endgültig verlassen worden.
theological_decisions:
- issue: Bezeichnung der Retter
  choice: die Männer
  alternative: die Engel / die Boten
  rationale: Obwohl der weitere Zusammenhang die beiden Gestalten als Engel beziehungsweise göttliche Boten erkennen lässt, hält dieser Vers an der erzählerischen Bezeichnung „die Männer“ fest. Der Haupttext bewahrt diese Wortwahl.
- issue: Grund der Rettung
  choice: weil Jahwe Erbarmen mit ihm hatte
  alternative: in Jahwes Erbarmen über ihn
  rationale: Die kausale Wiedergabe macht deutlich, dass Lots Rettung auf Jahwes Erbarmen beruht. Sie legt nicht fest, ob sich dieses Erbarmen ausschließlich auf Lot oder mittelbar auch auf seine Familie erstreckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Kurze Hauptsätze bewahren die Dringlichkeit. „Packten“ ist kräftig, aber nicht umgangssprachlich; „Erbarmen“ trägt den theologischen Gehalt von חֶמְלָה angemessen.
