source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: de
  text: Am Abend kamen die beiden Engel nach Sodom. Lot saß im Stadttor von Sodom.[a] Als Lot sie sah, stand er auf, ging ihnen entgegen und warf sich mit dem Gesicht zur Erde nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war nicht nur ein Durchgang, sondern ein öffentlicher Ort, an dem auch städtische und rechtliche Angelegenheiten behandelt wurden.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „verneigte sich tief, mit dem Gesicht zur Erde“. Das Hebräische beschreibt eine sehr tiefe Verbeugung oder ein Sich-Niederwerfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Die Erzählform von בוא bezeichnet hier die Ankunft beziehungsweise Bewegung zu einem Ort; „kamen nach Sodom“ ist im Deutschen natürlich und gibt die Richtungsangabe wieder.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: die beiden Engel
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Im Zusammenhang mit den himmlischen Besuchern des vorangehenden Abschnitts ist „Engel“ die naheliegende Wiedergabe.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Die Zeitangabe wird im modernen Standarddeutsch idiomatisch mit „am Abend“ wiedergegeben.
- source_word: יֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt Lots bereits andauernde Haltung als Hintergrund der folgenden Handlung.
- source_word: בְּשַׁעַר סְדֹם
  choice: im Stadttor von Sodom
  rationale: Gemeint ist der Torbereich der Stadt, nicht nur eine Türöffnung. „Stadttor“ macht dies für heutige Leser verständlich, während „im“ den räumlichen Charakter des Torbereichs wahrt.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: stand er auf, ging ihnen entgegen
  rationale: 'Die deutsche Formulierung entfaltet die knappe hebräische Wendung natürlich: Lot erhebt sich und bewegt sich den Besuchern entgegen.'
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: verneigte sich tief, mit dem Gesicht zur Erde
  rationale: Die Wendung beschreibt eine sehr tiefe Ehrenbezeugung bis zur Erde. Diese Wiedergabe bewahrt das konkrete Bild, ohne die Handlung vorschnell als Anbetung zu deuten.
theological_decisions:
- issue: Ob וַיִּשְׁתַּחוּ als Anbetung oder als ehrerbietiges Niederbeugen wiederzugeben ist
  choice: ehrfurchtsvolle tiefe Verneigung
  alternative: „betete sie an“ oder „warf sich vor ihnen nieder“
  rationale: שׁחה kann je nach Kontext Anbetung oder eine tiefe Ehrenbezeugung bezeichnen. Der Vers selbst verlangt nicht die theologisch stärkere Aussage „anbeten“. Die gewählte Formulierung lässt die intensive Geste erkennen, ohne mehr festzulegen, als der Zusammenhang hergibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah an der hebräischen Szenengestaltung; kulturgebundene und semantisch mehrdeutige Einzelheiten werden knapp in Fußnoten erläutert.
