revisions:
- from: Am Abend kamen die beiden Engel nach Sodom. Lot saß im Stadttor von Sodom.[a] Als Lot sie sah, stand er auf, ging ihnen entgegen und verneigte sich tief, mit dem Gesicht zur Erde.[b]
  to: Am Abend kamen die beiden Engel nach Sodom. Lot saß im Stadttor von Sodom.[a] Als Lot sie sah, stand er auf, ging ihnen entgegen und warf sich mit dem Gesicht zur Erde nieder.[b]
  rationale: Die Schlusswendung wurde zu „warf sich mit dem Gesicht zur Erde nieder“ revidiert, damit die volle, körperliche Geste des Hebräischen klar wiedergegeben wird. Die Formulierung legt keine Anbetung fest und erhält somit die im Kontext bestehende semantische Offenheit. Die Fußnotenanker bleiben an ihren jeweiligen Bezugsstellen korrekt gesetzt.
