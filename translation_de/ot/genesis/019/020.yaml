  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: de
  text: Sieh doch, diese Stadt ist nah genug, um dorthin zu fliehen, und sie ist klein. Lass mich doch dorthin entkommen. Sie ist doch klein, nicht wahr? Dann bleibe ich am Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und meine Seele/mein Leben wird leben“; die hebräische Wendung bedeutet hier: „Dann werde ich am Leben bleiben.“'
    reason: Die Fußnote gibt die hebräische Formulierung korrekt wieder und erläutert ihre idiomatische Bedeutung, ohne נֶפֶשׁ als vom Körper getrennten Seelenteil festzulegen.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה fordert Aufmerksamkeit, während נָא die dringliche Bitte abmildert. „Sieh doch“ gibt beides in natürlichem modernem Deutsch wieder.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Direkte Wiedergabe des Nomens mit Demonstrativpronomen; „Stadt“ entspricht עִיר.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: ist nahe genug, um dorthin zu fliehen
  rationale: Die Formulierung bringt die Nähe als Voraussetzung für die Flucht idiomatisch zum Ausdruck und bewahrt שָׁמָּה als Richtungsangabe.
- source_word: וְהִיא מִצְעָר
  choice: und sie ist klein
  rationale: מִצְעָר bezeichnet hier geringe Größe beziehungsweise Bedeutung. „Klein“ bewahrt zugleich die Wiederholung im folgenden rhetorischen Satz.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Lass mich doch dorthin entkommen
  rationale: Der Kohortativ mit נָא drückt Lots dringliche Bitte aus. „Entkommen“ erfasst die Rettung aus der Gefahr, ohne einen passiven göttlichen Urheber ausdrücklich einzutragen.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: ist sie nicht klein?
  rationale: Die rhetorische Frage und die lexikalische Wiederholung von מִצְעָר bleiben erhalten.
- source_word: וּתְחִי נַפְשִׁי
  choice: damit ich am Leben bleibe
  rationale: נֶפֶשׁ steht hier idiomatisch für die Person selbst; nach dem Kohortativ bezeichnet die mit ו angeschlossene Klausel Zweck oder Folge. Die deutsche Wendung gibt den Sinn klar wieder, ohne das missverständliche „meine Seele“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das zweimalige „doch“ bildet die beiden Vorkommen von נָא ab und erhält den eindringlich-bittenden Ton. Der Gedankenstrich markiert Lots eingeschobene rhetorische Begründung.
