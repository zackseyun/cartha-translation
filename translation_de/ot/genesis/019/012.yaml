  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: de
  text: 'Da sagten die Männer zu Lot: »Wen hast du sonst noch hier? Einen Schwiegersohn[a], deine Söhne, deine Töchter und alle, die in der Stadt zu dir gehören[b] – bring sie aus diesem Ort hinaus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Bräutigam«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »alles, was dir in der Stadt gehört«; im Zusammenhang sind offenbar die Menschen gemeint, die zu Lot gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Substantiv bezeichnet hier wörtlich »die Männer«. Obwohl der Erzählzusammenhang sie als Engel erkennen lässt, wird diese Deutung nicht in den Wortlaut des Verses eingetragen.
- source_word: עֹד מִי לְךָ פֹה
  choice: Wen hast du sonst noch hier?
  rationale: Die idiomatische Frage erkundigt sich nach weiteren Personen, die zu Lot gehören; die deutsche Fassung ist natürlich und bewahrt den persönlichen Bezug.
- source_word: חָתָן
  choice: einen Schwiegersohn
  rationale: Das Wort kann einen Schwiegersohn oder Bräutigam bezeichnen. Im Zusammenhang sind am wahrscheinlichsten die vorgesehenen oder bereits bestehenden Schwiegersöhne Lots gemeint; der hebräische Singular bleibt erhalten.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: deine Söhne, deine Töchter
  rationale: Die possessiven Pluralformen werden unmittelbar und unverändert wiedergegeben.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: alle, die in der Stadt zu dir gehören
  rationale: Wörtlich steht »alles, was dir in der Stadt gehört«. Da der Zusammenhang von zu rettenden Menschen handelt, gibt die persönliche Formulierung den gemeinten Sinn klar wieder, ohne ihn enger als Familie oder Hausstand festzulegen.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: bring sie aus diesem Ort hinaus
  rationale: Der maskuline Singularimperativ richtet sich an Lot. Das im Deutschen nötige Objekt »sie« wird aus der vorangehenden Personenliste aufgenommen; »diesem Ort« gibt den kontextuell bestimmten Ort natürlich wieder.
theological_decisions:
- issue: Identifizierung der Männer als Engel
  choice: Im Haupttext steht »die Männer«.
  alternative: »die Engel« oder »die Boten«
  rationale: Der weitere Erzählzusammenhang identifiziert die Besucher als Engel, doch dieser Vers verwendet das gewöhnliche hebräische Wort für Männer. Die Übersetzung bewahrt daher die Ausdrucksweise des Ausgangstextes.
- issue: Personenkreis von »alle, die zu dir gehören«
  choice: Die Formulierung bleibt relational und umfasst alle Lot zugehörigen Personen in der Stadt.
  alternative: Beschränkung auf Familie oder Hausstand
  rationale: Der Kontext legt Personen nahe, doch der hebräische Ausdruck bestimmt nicht ausdrücklich, ob nur Verwandte oder der gesamte Hausstand gemeint sind.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist dringlich, ohne zusätzliche dramatische Elemente. Der lexikalisch mögliche Sinn »Bräutigam« bei חָתָן wird nicht in einer Fußnote ausgebreitet, da »Schwiegersohn« im unmittelbaren Familienkontext deutlich wahrscheinlicher ist.
