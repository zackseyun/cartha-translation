  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: de
  text: 'Und er sagte: „Bitte, meine Herren[a], kehrt doch im Haus eures Dieners ein. Übernachtet dort und wascht euch die Füße. Morgen könnt ihr früh aufstehen und euren Weg fortsetzen.“ Sie aber sagten: „Nein, sondern wir werden auf dem Platz[b] übernachten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Herr“, falls die hebräische Form als ehrende Anrede im Singular verstanden wird. Im unmittelbaren Zusammenhang spricht Lot jedoch die beiden Besucher an.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet eine offene öffentliche Fläche der Stadt, etwa einen Platz oder einen breiten öffentlichen Raum.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Bitte
  rationale: Die Verbindung dient hier als höfliche, eindringliche Einleitung. „Bitte“ gibt diese Funktion im modernen Deutschen natürlich wieder.
- source_word: אֲדֹנַי
  choice: meine Herren
  rationale: Lot spricht die beiden Besucher respektvoll an. Die nachfolgenden Pluralformen sprechen im unmittelbaren Zusammenhang für eine Anrede im Plural.
- source_word: סוּרוּ נָא אֶל בֵּית עַבְדְּכֶם
  choice: kehrt doch im Haus eures Dieners ein
  rationale: „Einkehren“ gibt sowohl das Abbiegen vom Weg als auch die Einladung ins Haus idiomatisch wieder; „doch“ bewahrt den höflich-drängenden Ton von נָא.
- source_word: וְלִינוּ
  choice: übernachtet dort
  rationale: Das Verb bezeichnet das Verbringen der Nacht. „Dort“ verdeutlicht im Deutschen den Bezug auf Lots Haus, ohne den Sinn zu erweitern.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: wascht euch die Füße
  rationale: Die direkte Wiedergabe bewahrt den konkreten Brauch der Gastfreundschaft und klingt zugleich natürlich.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: Morgen könnt ihr früh aufstehen
  rationale: Das Verb bezeichnet das frühe Aufstehen. „Morgen“ macht den im Übernachten enthaltenen zeitlichen Bezug im Deutschen natürlich deutlich; „könnt“ entspricht dem einladenden, nicht befehlenden Zusammenhang.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: euren Weg fortsetzen
  rationale: Dies ist eine natürliche deutsche Entsprechung für das Weiterziehen auf dem eigenen Weg.
- source_word: בָרְחוֹב
  choice: auf dem Stadtplatz
  rationale: רְחוֹב bezeichnet hier wahrscheinlich eine breite, offene öffentliche Fläche der Stadt und nicht lediglich eine Straße.
- source_word: נָלִין
  choice: wir werden ... übernachten
  rationale: Die Wiedergabe wahrt die lexikalische Verbindung zum zuvor verwendeten Verb derselben hebräischen Wurzel.
theological_decisions:
- issue: Ob אֲדֹנַי als Gottesbezeichnung oder als menschliche Anrede zu verstehen ist
  choice: 'menschliche Anrede im Plural: „meine Herren“'
  alternative: 'singuläre Ehrenanrede: „mein Herr“'
  rationale: Lot wendet sich im Erzählzusammenhang an die beiden Besucher; die Verben und Pronomen im Plural stützen die pluralische menschliche Anrede. Die alternative morphologische Deutung bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfliche Dringlichkeit der Einladung wird mit „Bitte“ und „doch“ wiedergegeben, ohne die beiden hebräischen Höflichkeitspartikeln unnatürlich zu verdoppeln. Kurze Sätze sorgen für gute Verständlichkeit; die respektvolle Selbstbezeichnung „euer Diener“ bleibt erhalten.
