  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: de
  text: So wurden beide Töchter Lots von ihrem Vater schwanger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: wurden … schwanger
  rationale: Die Form von הרה bezeichnet, dass beide Frauen schwanger wurden. Diese Wiedergabe ist im modernen Deutschen natürlich und klar; „empfingen“ wäre möglich, klingt hier aber gehobener und weniger unmittelbar.
- source_word: שְׁתֵּי
  choice: beide
  rationale: Die Zahlform vor „Töchter Lots“ hebt hervor, dass beide Töchter gemeint sind. „Beide“ gibt dies idiomatisch wieder.
- source_word: בְנוֹת לוֹט
  choice: Töchter Lots
  rationale: Die hebräische Status-constructus-Verbindung wird knapp und würdig mit dem deutschen Genitiv wiedergegeben.
- source_word: מֵאֲבִיהֶן
  choice: von ihrem Vater
  rationale: Die Präposition מִן bezeichnet hier Herkunft beziehungsweise Vaterschaft. „Von ihrem Vater schwanger“ ist natürliches Deutsch und bewahrt zugleich die im Hebräischen ausgedrückte Herkunft.
