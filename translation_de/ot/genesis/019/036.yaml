translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Das einleitende „So“ nimmt die Folge der vorausgehenden Ereignisse auf. Die knappe Aussage des Hebräischen bleibt erhalten.
