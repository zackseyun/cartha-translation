source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר הַ/בְּכִירָ֛ה אֶל הַ/צְּעִירָ֖ה אָבִ֣י/נוּ זָקֵ֑ן וְ/אִ֨ישׁ אֵ֤ין בָּ/אָ֨רֶץ֙ לָ/ב֣וֹא עָלֵ֔י/נוּ כְּ/דֶ֖רֶךְ כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: de
  text: 'Da sagte die Erstgeborene zu der Jüngeren: »Unser Vater ist alt, und es gibt keinen Mann im Land, der zu uns eingehen könnte[a], wie es in aller Welt üblich ist[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: mit uns geschlechtlich verkehren. Das Hebräische gebraucht die verhüllende Wendung »zu uns eingehen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nach der Weise der ganzen Erde«. Gemeint ist wahrscheinlich der allgemein menschliche Brauch, besonders die geschlechtliche Verbindung und die Fortführung einer Familie.'
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Bewahrt die ausdrückliche Geburtsrangfolge des Hebräischen und bildet den Gegensatz zu »der Jüngeren« ab.
- source_word: הַצְּעִירָה
  choice: die Jüngere
  rationale: Gibt das substantivierte Vergleichsadjektiv natürlich wieder; aus dem Zusammenhang ist klar, dass die jüngere Schwester gemeint ist.
- source_word: אָבִינוּ זָקֵן
  choice: Unser Vater ist alt
  rationale: Die knappe deutsche Prädikatskonstruktion entspricht dem verblosen hebräischen Satz und ist idiomatisch.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: und es gibt keinen Mann im Land
  rationale: Bewahrt sowohl den männlichen Bezug von אִישׁ als auch die räumliche Formulierung בָאָרֶץ, ohne sie zu »niemand« zu verallgemeinern.
- source_word: לָבוֹא עָלֵינוּ
  choice: der zu uns eingehen könnte
  rationale: Bewahrt den sexuellen Euphemismus des Hebräischen. Der Relativsatz schließt natürlich an »keinen Mann« an; »könnte« gibt die durch ל־ mit Infinitiv ausgedrückte verfügbare Möglichkeit im Kontext wieder.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: wie es in aller Welt üblich ist
  rationale: Gibt die idiomatische Bedeutung »nach der allgemein menschlichen Sitte/Weise« in verständlichem modernem Deutsch wieder, ohne den sexuellen und auf Fortpflanzung bezogenen Kontext ausdrücklich festzulegen.
theological_decisions:
- issue: Reichweite der Aussage »kein Mann im Land«
  choice: Die uneingeschränkte Formulierung der Sprecherin bleibt stehen.
  alternative: Die Aussage auf die unmittelbare Umgebung oder auf geeignete Männer einzuschränken.
  rationale: Der hebräische Text formuliert absolut; ob dies die tatsächliche Lage oder die Wahrnehmung der Tochter wiedergibt, wird nicht entschieden.
- issue: Bedeutung von »wie es in aller Welt üblich ist«
  choice: Die allgemeine Wendung bleibt im Haupttext idiomatisch, aber nicht vollständig ausgedeutet.
  alternative: Ausdrücklich von Ehe, Geschlechtsverkehr oder Nachkommenschaft zu sprechen.
  rationale: Im Kontext zielt die Wendung auf die gewöhnliche sexuelle Verbindung und Familienfortführung, doch der hebräische Ausdruck selbst bleibt euphemistisch und allgemein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hebräische sexuelle Euphemismus bleibt im Haupttext erhalten und wird in der Fußnote erläutert; die stark idiomatische Schlusswendung wird verständlich wiedergegeben, während ihre wörtliche Form in der Fußnote dokumentiert ist.
