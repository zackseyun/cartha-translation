  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: de
  text: Und er stürzte jene Städte um[a] und die ganze Jordanebene[b], alle Bewohner der Städte und alles, was auf dem Erdboden wuchs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zerstörte jene Städte«. Das hebräische Verb kann ein katastrophales Umstürzen oder Zerstören bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist hier der Bezirk der Jordanebene.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: kehrte … um
  rationale: Das Verb הפך bezeichnet hier ein katastrophales Umkehren beziehungsweise Umstürzen. Die konkrete Bildsprache bleibt erhalten, ohne sie auf das allgemeinere »vernichten« zu reduzieren.
- source_word: הֶעָרִים הָאֵל
  choice: jene Städte
  rationale: Das Demonstrativum verweist auf die zuvor genannten Städte; »jene Städte« ist im deutschen Erzählzusammenhang natürlich.
- source_word: כָּל הַכִּכָּר
  choice: die ganze Jordanebene
  rationale: כִּכָּר bezeichnet in diesem Zusammenhang den Bezirk der Jordanebene. Die Verdeutlichung mit »Jordan-« macht den geografischen Bezug verständlich.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: alle Bewohner der Städte
  rationale: Die substantivierte Partizipialform bezeichnet alle, die in den Städten wohnten; »Bewohner« ist knapp und präzise.
- source_word: צֶמַח הָאֲדָמָה
  choice: alles, was auf dem Erdboden wuchs
  rationale: Die Wendung bezeichnet den Pflanzenwuchs des Bodens. Die natürliche deutsche Formulierung bewahrt sowohl den umfassenden Sinn als auch den Bezug zum Erdboden.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs im Singular
  choice: Das Subjekt wird als »er« wiedergegeben, ohne es im Vers ausdrücklich als Gott oder den HERRN zu benennen.
  alternative: »Der HERR kehrte … um« beziehungsweise »Gott vernichtete …«
  rationale: Im hebräischen Vers steht ein Verb in der dritten Person Singular ohne ausdrücklich genanntes Subjekt. Der vorausgehende Zusammenhang identifiziert den Handelnden, doch die Übersetzung bewahrt die Ausdrucksweise dieses Verses.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des hebräischen Verbs wird bewahrt; »ebenso« gibt die koordinierende Reihung natürlich wieder. Die Fußnotenmarker [a] und [b] stehen an den jeweils einschlägigen Stellen im Haupttext.
