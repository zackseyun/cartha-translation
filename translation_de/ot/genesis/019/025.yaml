revisions:
- from: Und er kehrte jene Städte um[a], ebenso die ganze Jordanebene[b], alle Bewohner der Städte und alles, was auf dem Erdboden wuchs.
  to: Und er stürzte jene Städte um[a] und die ganze Jordanebene[b], alle Bewohner der Städte und alles, was auf dem Erdboden wuchs.
  rationale: Die Revision ersetzt die im Deutschen missverständliche Wendung »kehrte ... um« durch »stürzte ... um«, das die konkrete katastrophale Bildsprache von הפך wahrt. Die koordinierende Reihung wird mit »und« wiedergegeben. Die übrigen Entscheidungen einschließlich der Zurückhaltung beim impliziten Subjekt bleiben erhalten.
