  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: de
  text: 'Und es geschah[a], als Gott die Städte der Ebene vernichtete: Gott erinnerte sich an Abraham[b] und schickte Lot aus der Mitte der Zerstörung hinaus[c], als er die Städte zerstörte, in denen Lot gewohnt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Als Gott die Städte der Ebene vernichtete, geschah es, dass …“'
    reason: Die hebräische Erzählungsformel וַיְהִי leitet hier einen zeitlichen Nebensatz und anschließend die Haupthandlung ein.
  - marker: b
    text: „Gott erinnerte sich an Abraham“ ist eine hebräische Ausdrucksweise für Gottes treue, im Handeln wirksame Zuwendung; sie bedeutet nicht, dass Gott Abraham zuvor vergessen hätte.
    reason: Die kulturell-theologische Bedeutung der wörtlich bewahrten Erinnerungsformel kann im modernen Deutschen missverstanden werden.
  - marker: c
    text: 'Wörtlicher etwa: „aus der Mitte der Umstürzung“. Das hebräische Substantiv ist mit dem folgenden hebräischen Verb „umstürzen“ verwandt und bezeichnet hier den katastrophalen Untergang der Städte.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild und das Wortspiel, die in der natürlichen deutschen Formulierung nur teilweise sichtbar sind.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die erzählerische Einleitungsformel wird erkennbar wiedergegeben, ohne das altertümliche „es begab sich“ zu verwenden.
- source_word: בְּשַׁחֵת אֱלֹהִים
  choice: als Gott … vernichtete
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand. „Vernichten“ gibt שׁחת kräftig wieder und unterscheidet es im Deutschen von der späteren Wortverbindung „Zerstörung/zerstörte“.
- source_word: עָרֵי הַכִּכָּר
  choice: die Städte der Ebene
  rationale: כִּכָּר bezeichnet hier die Ebene beziehungsweise den Bezirk am Jordan; „Ebene“ ist knapp, verständlich und kontextgemäß.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Gott erinnerte sich an Abraham
  rationale: Die hebräische Redeweise bleibt im Haupttext erhalten, statt sie durch eine deutende Aussage über Gottes Beweggrund zu ersetzen.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: schickte Lot … hinaus
  rationale: Die Grundbedeutung von שׁלח („senden, schicken“) und die Bewegung aus dem Gefahrenbereich bleiben gewahrt; das stärker deutende „rettete“ wird vermieden.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: mitten aus der Zerstörung hinaus
  rationale: „Mitten aus“ bildet תּוֹךְ deutlich ab. „Zerstörung“ ist im Deutschen natürlicher als „Umstürzung“ und lässt sich mit dem folgenden Verb verbinden.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: als er die Städte zerstörte
  rationale: Die zweite Infinitivkonstruktion wird ebenfalls temporal wiedergegeben. Die Wiederholung „Zerstörung/zerstörte“ spiegelt die hebräische Verbindung von הֲפֵכָה und הפך, auch wenn deren Bild des Umstürzens im Haupttext geglättet wird.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: in denen Lot gewohnt hatte
  rationale: Der Pluralbezug auf die Städte und die gegenüber dem Erzählzeitpunkt vorausliegende Wohnzeit Lots werden bewahrt.
theological_decisions:
- issue: Bedeutung von „Gott erinnerte sich an Abraham“
  choice: Die hebräische Erinnerungsformel bleibt stehen und wird in einer Fußnote erläutert.
  alternative: „Gott handelte Abraham zuliebe“ oder „Gott dachte an Abraham“
  rationale: Bei göttlichem Erinnern bezeichnet זכר häufig treue, wirksame Zuwendung. Eine solche Deutung unmittelbar in den Haupttext einzubauen, würde den Wortlaut verengen und die genuine Bildsprache beseitigen.
- issue: Verhältnis von Abrahams Erwähnung zu Lots Bewahrung
  choice: Der Satz stellt wie der hebräische Text einen Zusammenhang her, ohne dessen genaue theologische Art weiter auszudeuten.
  alternative: Ausdrückliche Formulierungen wie „wegen Abrahams Fürbitte“
  rationale: Der Vers nennt Abraham, sagt aber an dieser Stelle nicht ausdrücklich, ob allein seine Fürbitte, die Verheißung oder eine umfassendere treue Rücksicht Gottes gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die auffällige hebräische Erzählungsformel und die wiederholte Schilderung des Untergangs fest, vermeidet aber archaische Wendungen wie „es begab sich“, „gedachte“ oder „wohnte darinnen“.
