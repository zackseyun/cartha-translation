  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: de
  text: 'Und er sagte: »Bitte, meine Brüder, handelt nicht böse!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא
  choice: Bitte … nicht / nichts
  rationale: Die höflich-eindringliche Negativpartikel wird im Deutschen natürlich durch »Bitte« zusammen mit der Verneinung wiedergegeben.
- source_word: אַחַי
  choice: meine Brüder
  rationale: Bewahrt die wörtliche Anrede; im Kontext ist sie eine beschwichtigende Anrede an die Männer der Stadt, nicht zwingend eine Aussage über leibliche Verwandtschaft.
- source_word: תָּרֵעוּ
  choice: tut nichts Böses
  rationale: Die Hifil-Form von רעע bezeichnet hier böses beziehungsweise schlimmes Handeln. »Tut nichts Böses« ist idiomatisch und entspricht der offenen moralischen Wertung des Hebräischen.
theological_decisions:
- issue: Art und Ausmaß des angekündigten bösen Handelns
  choice: allgemein »tut nichts Böses«
  alternative: »handelt nicht so böse« / »begeht kein solches Unrecht«
  rationale: Der Vers selbst benennt die Tat nur allgemein; die Übersetzung wahrt diese Offenheit und lässt die nähere Bestimmung beim Kontext.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede klingt eindringlich, ohne altertümliche Formen. »Brüder« bleibt als kulturell geprägte Anrede erhalten.
