id: GEN.19.22
reference: Genesis 19:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: de
  text: »Beeil dich, rette dich dorthin! Denn ich kann nichts tun, bis du dort angekommen bist.« Darum nannte er die Stadt Zoar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zoar klingt ähnlich wie das hebräische Wort für »klein« oder »unbedeutend«; siehe 1. Mose 19,20.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: »Er nannte den Namen der Stadt Zoar.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Beeil dich
  rationale: Der Imperativ drückt unmittelbare Dringlichkeit aus; die Wendung ist natürliches, modernes Deutsch.
- source_word: הִמָּלֵט
  choice: rette dich
  rationale: Der Niphal-Imperativ von מלט fordert dazu auf, sich in Sicherheit zu bringen. »Rette dich« bewahrt die reflexive Aussage, ohne die Wendung unnötig auszubauen.
- source_word: שָׁמָּה
  choice: dorthin / dort
  rationale: Das Richtungsadverb bezeichnet beim Entkommen das Ziel (»dorthin«) und beim Ankommen den Ort (»dort«).
- source_word: כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר
  choice: Denn ich kann nichts tun
  rationale: Die Übersetzung gibt die ausdrücklich formulierte Unfähigkeit und die unbestimmte, umfassende Bedeutung von דָּבָר direkt wieder.
- source_word: עַד בֹּאֲךָ
  choice: bis du dort angekommen bist
  rationale: Die Infinitivkonstruktion mit Suffix bezeichnet Lots Ankunft am Ziel; das deutsche Perfekt macht deutlich, dass das Eintreffen abgeschlossen sein muss.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die gebräuchliche deutsche Folgerungsformel verbindet das Geschehen mit der anschließenden Namenserklärung.
- source_word: קָרָא שֵׁם הָעִיר
  choice: nannte er die Stadt
  rationale: Die aktive Form mit einem nicht eigens benannten männlichen Subjekt bleibt erhalten; zugleich ist die Formulierung im Deutschen natürlich.
- source_word: צֹעַר
  choice: Zoar
  rationale: Der Ortsname wird in seiner geläufigen deutschen Transliteration wiedergegeben; das hebräische Wortspiel wird in einer Fußnote erläutert.
theological_decisions:
- issue: Aussage der Unfähigkeit im Zusammenhang des Gerichts
  choice: »ich kann nichts tun«
  alternative: »ich darf nichts tun« oder »ich kann dies nicht tun«
  rationale: לֹא אוּכַל bezeichnet unmittelbar ein Nichtkönnen. Die Übersetzung bewahrt die theologische Spannung und erklärt weder die Identität des Sprechers noch die Art dieser Begrenzung.
- issue: Nicht ausdrücklich genanntes Subjekt der Namensgebung
  choice: »er«
  alternative: 'unpersönlich-passiv: »die Stadt wurde Zoar genannt«'
  rationale: Das hebräische Verb steht im maskulinen Singular. Das Pronomen bewahrt diese grammatische Form, ohne den Handelnden näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Dringlichkeit. Die beiden Imperative bleiben erhalten; die Aussage »ich kann nichts tun« wird nicht theologisch abgeschwächt. Die Anführungszeichen setzen die bereits zuvor begonnene direkte Rede fort.
