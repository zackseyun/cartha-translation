  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: de
  text: Da ließ Jahwe Schwefel und Feuer auf Sodom und Gomorra regnen – von Jahwe her, aus dem Himmel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebräisch: „von Jahwe her, aus dem Himmel“. Die auffällige Wiederholung des Gottesnamens entspricht dem Ausgangstext und wird nicht vereinfacht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Da ließ Jahwe
  rationale: Das narrative וַ wird idiomatisch mit „Da“ wiedergegeben. Der Gottesname יהוה bleibt als „Jahwe“ erkennbar; zusammen mit dem kausativen Verb ergibt sich natürliches modernes Deutsch.
- source_word: הִמְטִיר
  choice: ließ … regnen
  rationale: Die Hifil-Form bezeichnet das Veranlassen beziehungsweise Herabregnenlassen. „ließ … regnen“ bewahrt die Bildsprache und bildet die Kausativform deutlicher ab als das im Deutschen ungewöhnliche transitive „regnete“.
- source_word: גָּפְרִית
  choice: Schwefel
  rationale: „Schwefel“ ist die präzise und gegenwärtig verständliche Bezeichnung des Stoffes; ältere traditionelle Ausdrücke sind nicht nötig.
- source_word: וָאֵשׁ
  choice: und Feuer
  rationale: Die koordinierte Wortgruppe wird direkt und verständlich wiedergegeben.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: auf Sodom und Gomorra
  rationale: Die wiederholte Präposition markiert beide Städte als Ziel des Gerichts. Im natürlichen Deutschen genügt eine gemeinsame Präposition.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe her
  rationale: Die Wendung bezeichnet Herkunft oder Ausgangspunkt. „von Jahwe her“ erhält die ausdrücklich wiederholte Nennung des Gottesnamens, ohne sie erklärend aufzulösen.
- source_word: מִן הַשָּׁמָיִם
  choice: aus dem Himmel
  rationale: שָׁמַיִם hat im Hebräischen eine feste Pluralform, wird im Deutschen in diesem räumlichen Sinn jedoch idiomatisch mit dem Kollektivsingular „Himmel“ wiedergegeben. „aus“ bewahrt die Vorstellung der Herkunft von oben.
theological_decisions:
- issue: Wiederholung des Gottesnamens in „Jahwe … von Jahwe her“
  choice: Die Wiederholung bleibt im Haupttext erhalten.
  alternative: „Da ließ Jahwe … aus dem Himmel regnen“ oder „Da ließ Jahwe … von sich aus dem Himmel regnen“
  rationale: Der hebräische Text nennt יהוה ausdrücklich zweimal. Die Übersetzung harmonisiert diese auffällige Formulierung nicht und legt weder eine bloß stilistische Wiederholung noch eine besondere Unterscheidung der Handelnden fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die ungewöhnliche Herkunftsangabe, ohne sie syntaktisch oder theologisch aufzulösen. Die Gottesnamensform „Jahwe“ bewahrt die Eigennamefunktion von יהוה.
