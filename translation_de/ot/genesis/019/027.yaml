  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: de
  text: Abraham stand früh am Morgen auf und begab sich zu dem Ort, an dem er vor Jahwe[a] gestanden hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor dem Angesicht Jahwes«; eine hebräische Wendung für »vor Jahwe« oder »in Jahwes Gegenwart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: machte sich früh … auf
  rationale: Das Hifil von שׁכם bezeichnet frühes Aufstehen beziehungsweise frühes Beginnen. Zusammen mit dem ausdrücklich genannten Ziel אֶל הַמָּקוֹם legt der Zusammenhang nahe, dass Abraham früh aufbricht; die deutsche Wendung ist natürlich und bewahrt den zeitlichen Nachdruck.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: בֹּקֶר bedeutet »Morgen«. In Verbindung mit וַיַּשְׁכֵּם ergibt sich die natürliche Formulierung »früh am Morgen«.
- source_word: אֶל הַמָּקוֹם
  choice: zu dem Ort
  rationale: מָקוֹם ist die gewöhnliche Bezeichnung für einen Ort. Die Präposition אֶל gibt die Richtung auf diesen bereits bekannten Ort an.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: an dem er … gestanden hatte
  rationale: Der Relativsatz verweist auf Abrahams früheres Stehen an diesem Ort. Das Plusquamperfekt macht diesen Rückbezug im Deutschen deutlich; שָׁם wird idiomatisch durch »an dem« aufgenommen.
- source_word: אֶת־פְּנֵי
  choice: vor
  rationale: In der Verbindung עמד אֶת־פְּנֵי bezeichnet die Wendung das Stehen vor jemandem beziehungsweise in dessen Gegenwart. »Vor« gibt das Idiom knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm ist im hebräischen Text ein Eigenname. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt seinen Charakter als Eigenname, ohne eine konfessionelle Auslegung in den Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Bewegungsangabe »ging« macht die durch אֶל ausgedrückte Zielrichtung im Deutschen syntaktisch natürlich; sie folgt aus der Konstruktion, ohne den Ort näher auszudeuten.
