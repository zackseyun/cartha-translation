base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: de
  text: Die Erstgeborene gebar einen Sohn und nannte ihn Moab.[a] Er ist bis zum heutigen Tag der Stammvater der Moabiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Vater Moabs“. Gemeint ist der Ahnherr der Moabiter.'
    reason: Die Fußnote erläutert die im Hebräischen singuläre, auf das Volk bezogene Formulierung, ohne eine nicht ausdrücklich im Text erklärte Namensetymologie zu behaupten.
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Qal von ילד bezeichnet hier das Gebären eines Kindes. „Gebar“ ist knapp, würdevoll und im erzählenden Zusammenhang natürlich.
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Die feminine substantivierte Form bedeutet „die Erstgeborene“ beziehungsweise „die Ältere“. Die gewählte Wiedergabe bewahrt die Bezeichnung des Hebräischen und ist aus dem Kontext als Lots ältere Tochter verständlich.
- source_word: בֵּן
  choice: einen Sohn
  rationale: Die Akkusativform mit unbestimmtem Artikel entspricht natürlichem Deutsch.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: nannte ihn
  rationale: Die hebräische Wendung lautet wörtlich „rief seinen Namen“. „Nannte ihn“ gibt die Namensgebung in modernem Deutsch idiomatisch wieder.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Eigenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Pronomen nimmt den soeben genannten Sohn wieder auf.
- source_word: אֲבִי מוֹאָב
  choice: der Stammvater Moabs
  rationale: Wörtlich steht „der Vater Moabs“. Gemeint ist der Ahnherr des Volkes; „Stammvater“ drückt diese genealogische Bedeutung natürlich aus, ohne Moab als geografisches Gebiet misszuverstehen.
- source_word: עַד הַיּוֹם
  choice: bis zum heutigen Tag
  rationale: Die feste hebräische Wendung bezeichnet das Fortbestehen bis in die Gegenwart des Erzählers; die gewählte deutsche Form ist idiomatisch und bewahrt den zeitlichen Bezug.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Die Erstgeborene“ bewahrt die formale Bezeichnung des Ausgangstextes; „Stammvater Moabs“ vermittelt die gemeinte genealogische Beziehung klar.
