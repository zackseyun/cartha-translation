base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: de
  text: 'Am nächsten Tag sagte die Erstgeborene zu der Jüngeren: »Sieh, ich habe letzte Nacht mit meinem Vater geschlafen. Geben wir ihm auch heute Nacht Wein zu trinken. Dann komm und schlaf mit ihm, damit wir von unserem Vater Nachkommen erhalten.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »damit wir Samen von unserem Vater am Leben erhalten«; »Samen« bezeichnet hier Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Erzählungsformel leitet den nächsten Handlungsschritt ein. Im modernen Deutschen wird sie hier natürlich durch die Zeitangabe wiedergegeben, ohne das altertümliche »Und es geschah«.
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Bewahrt die ausdrückliche Betonung der Geburtsfolge und bezeichnet im Kontext die ältere Tochter.
- source_word: הַצְּעִירָה
  choice: die Jüngere
  rationale: Gibt das substantivisch gebrauchte Adjektiv knapp wieder und entspricht dem Kontrast zur Erstgeborenen.
- source_word: הֵן
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der Partikel in würdigem, noch verständlichem Deutsch.
- source_word: שָׁכַבְתִּי אֶת־אָבִי
  choice: ich habe bei meinem Vater gelegen
  rationale: Das Verb ist hier ein sexueller Euphemismus. »Bei ... gelegen« wahrt die verhüllende Ausdrucksweise und den ernsten Ton des Hebräischen.
- source_word: אֶמֶשׁ
  choice: gestern Nacht
  rationale: Bezeichnet im Kontext die unmittelbar vorausgegangene Nacht; diese Wiedergabe ist klar und idiomatisch.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: Geben wir ihm ... Wein zu trinken
  rationale: Gibt die kausative Verbform natürlich wieder, ohne über das Hebräische hinaus ausdrücklich Zwang zu behaupten.
- source_word: גַּם הַלַּיְלָה
  choice: auch heute Nacht
  rationale: Bewahrt sowohl den nächtlichen Zeitpunkt als auch den additiven Gedanken der Wiederholung.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: Dann komm und leg dich zu ihm
  rationale: Gibt die Folge der Imperative natürlich wieder und bewahrt beim zweiten Verb erneut den sexuellen Euphemismus.
- source_word: וּנְחַיֶּה
  choice: damit wir ... erhalten
  rationale: Die Piel-Form bedeutet hier, etwas am Leben zu erhalten beziehungsweise fortbestehen zu lassen. Mit »Nachkommen erhalten« wird der Zweck im Deutschen verständlich ausgedrückt.
- source_word: מֵאָבִינוּ זָרַע
  choice: durch unseren Vater Nachkommen
  rationale: זֶרַע bedeutet wörtlich »Samen«, bezeichnet hier aber Nachkommenschaft. Das מן kann die Herkunft beziehungsweise Vermittlung ausdrücken; »durch unseren Vater« ist im Deutschen in diesem Fortpflanzungskontext natürlich.
