revisions:
- from: 'Am nächsten Tag sagte die Erstgeborene zu der Jüngeren: »Sieh, ich habe gestern Nacht bei meinem Vater gelegen. Geben wir ihm auch heute Nacht Wein zu trinken. Dann komm und leg dich zu ihm, damit wir durch unseren Vater Nachkommen erhalten.«[a]'
  to: 'Am nächsten Tag sagte die Erstgeborene zu der Jüngeren: »Sieh, ich habe letzte Nacht mit meinem Vater geschlafen. Geben wir ihm auch heute Nacht Wein zu trinken. Dann komm und schlaf mit ihm, damit wir von unserem Vater Nachkommen erhalten.«[a]'
  rationale: Die Revision macht die im Hebräischen euphemistisch, aber eindeutig gemeinte sexuelle Handlung im modernen Deutschen verständlich, ohne klinisch oder wertend zu formulieren. Zugleich wird die Herkunftsnuance von מֵאָבִינוּ mit „von unserem Vater“ genauer wiedergegeben. Die Fußnote erläutert weiterhin die idiomatische Übertragung von זֶרַע.
