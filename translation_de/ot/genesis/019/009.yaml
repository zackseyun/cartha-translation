  register: Moderne, würdige Standardsprache mit deutlich feindseligem Dialog. Die abwertende Haltung gegenüber Lot und die eskalierende körperliche Bedrohung bleiben erhalten; altertümliche Wörter wie „weilen“ oder „Fremdling“ werden vermieden.
