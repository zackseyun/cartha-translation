base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: de
  text: 'Da sagten sie: »Zurück![a]« Dann sagten sie: »Dieser da ist hergekommen, um hier als Fremder zu leben, und nun spielt er sich auch noch als Richter auf![b] Jetzt werden wir dir noch Schlimmeres antun als ihnen.[c]« Und sie drängten heftig gegen den Mann, gegen Lot,[d] und rückten vor, um die Tür aufzubrechen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geh aus dem Weg!«'
    reason: Die Wendung גֶּשׁ הָלְאָה kann als Befehl verstanden werden, zurückzutreten oder Platz zu machen.
  - marker: b
    text: 'Wörtlicher: »Dieser da kam, um als Fremder zu wohnen, und nun richtet er wirklich/ausdrücklich!«'
    reason: Die Verbindung von Verb und Infinitivus absolutus verstärkt die Aussage und kann hier als nachdrückliche Feststellung oder als spöttischer Vorwurf verstanden werden.
  - marker: c
    text: 'Wörtlich: »Jetzt werden wir dir mehr Böses antun als ihnen.« Gemeint ist die Drohung, Lot noch schlimmer zu behandeln als seine Gäste.'
    reason: Die Fußnote bewahrt die konkrete hebräische Redeweise und erläutert den Vergleich.
  - marker: d
    text: 'Wörtlich: »Sie drängten sehr gegen den Mann, gegen Lot.«'
    reason: Die ungewöhnliche Wiederholung der Präposition und die Stellung des Intensivwortes werden transparent gemacht.
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Zurück!
  rationale: Die knappe Aufforderung gibt den feindseligen Befehl idiomatisch wieder, sich zurückzuziehen bzw. Platz zu machen.
- source_word: הָאֶחָד
  choice: Dieser eine
  rationale: Die demonstrative Formulierung bewahrt den abschätzigen Ton, ohne ein stärker gefärbtes Schimpfwort hinzuzufügen.
- source_word: בָּא לָגוּר
  choice: ist hergekommen, um hier als Fremder zu leben
  rationale: גור bezeichnet das Wohnen eines nicht einheimischen Schutz- oder Beisassen; die Wiedergabe ist modern und macht Lots gesellschaftlichen Außenseiterstatus deutlich.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: will er sich auch noch zum Richter aufspielen
  rationale: Finite Verbform plus Infinitivus absolutus verstärkt den Vorwurf. Die Formulierung bewahrt die richterliche Bedeutung und den höhnisch-empörten Ton.
- source_word: נָרַע לְךָ מֵהֶם
  choice: werden wir dir noch Schlimmeres antun als ihnen
  rationale: Das Hifil von רעע bezeichnet hier das Zufügen von Bösem oder Schaden; der Vergleich und die Drohung bleiben ausdrücklich erhalten.
- source_word: וַיִּפְצְרוּ ... מְאֹד
  choice: drängten heftig gegen
  rationale: Im körperlichen Zusammenhang bezeichnet פצר starken Druck; מְאֹד intensiviert diesen Vorgang. „Heftig“ vermeidet eine unbegründete Präzisierung der Gewaltform.
- source_word: בָאִישׁ בְּלוֹט
  choice: gegen den Mann, gegen Lot
  rationale: Die wiederholte Präposition und die Apposition werden bewahrt und rücken Lot nachdrücklich in den Mittelpunkt des Angriffs.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: rückten vor, um die Tür aufzubrechen
  rationale: נגשׁ mit Infinitiv beschreibt ein zielgerichtetes Heranrücken; „aufbrechen“ gibt das gewaltsame Zerbrechen der Tür natürlich wieder.
