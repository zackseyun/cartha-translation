  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge, die gegen Lot gerichtete Drohung, das körperliche Bedrängen und den Versuch, die Tür aufzubrechen, zuverlässig wieder. Die Wiedergabe von פצר als körperlichem Drängen und von שבר als „aufbrechen“ ist im Kontext treffend. Die Verstärkung bei שָׁפוֹט bleibt als höhnischer Vorwurf erkennbar.
  naturalness: „Dieser eine“ ist im heutigen Standarddeutsch außerhalb stark künstlicher, übersetzungsnaher Sprache nicht idiomatisch. „Dieser da“ vermittelt die demonstrativ-abwertende Redeweise natürlich, ohne den Ton unnötig zu verschärfen. Die übrige Syntax ist klar und angemessen.
  terminology: „Als Fremder zu leben“, „sich als Richter aufspielen“, „heftig drängen“ und „die Tür aufbrechen“ sind moderne und kontextgerechte Wiedergaben. Die Fußnote zu b sollte die hebräische Verstärkung nicht als bloßes „tatsächlich“ festlegen, sondern als nachdrücklichen bzw. spöttischen Vorwurf erklären.
