  to: In jener Nacht gaben sie ihrem Vater Wein zu trinken. Die Erstgeborene ging hinein und legte sich zu ihrem Vater. Er wusste nicht, wann sie sich hinlegte und wann sie aufstand.[a]
  rationale: Die Revision ersetzt die semantisch engere Wiedergabe „bemerkte“ durch „wusste nicht“ und glättet die Satzstellung für modernes Deutsch. Der Euphemismus und die im Hebräischen nicht weiter erklärte Unkenntnis bleiben erhalten. Die Fußnote gibt die präpositionale, nominalere Form der hebräischen Schlusswendung wieder.
