base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: de
  text: In jener Nacht gaben sie ihrem Vater Wein zu trinken. Die Erstgeborene ging hinein und legte sich zu ihrem Vater. Er wusste nicht, wann sie sich hinlegte und wann sie aufstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bei ihrem Hinlegen und ihrem Aufstehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: gaben sie … Wein zu trinken
  rationale: Der Hifil von שׁקה bezeichnet das Veranlassen oder Ermöglichen des Trinkens. Die gewählte Wendung bewahrt den kausativen Sinn in natürlichem Deutsch.
- source_word: יַיִן
  choice: Wein
  rationale: Dies ist die übliche und kontextuell passende Wiedergabe von יין.
- source_word: בַּלַּיְלָה הוּא
  choice: in jener Nacht
  rationale: Die temporale Wendung verweist auf die betreffende Nacht; „in jener Nacht“ ist idiomatisch und wahrt den bestimmten Rückbezug.
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Die feminine Form bezeichnet wörtlich die zuerst geborene Tochter. „Die Erstgeborene“ erhält die Betonung der Geburtsfolge, ohne „Tochter“ ausdrücklich zu ergänzen.
- source_word: וַתָּבֹא
  choice: ging … hinein
  rationale: בוא bezeichnet hier das Hineingehen zu ihrem Vater. „ging hinein“ ist im Deutschen narrativ natürlich und vermeidet eine unnötige explizite Deutung.
- source_word: וַתִּשְׁכַּב אֶת
  choice: legte sich zu
  rationale: Die Konstruktion ist im Kontext ein sexueller Euphemismus. „legte sich zu ihrem Vater“ bewahrt die verhüllende Ausdrucksweise und klingt im modernen Deutsch natürlicher als „lag bei“.
- source_word: וְלֹא יָדַע
  choice: Er bemerkte weder
  rationale: ידע bezeichnet hier fehlende Wahrnehmung oder Kenntnis. Mit „bemerkte weder … noch“ lässt sich die folgende doppelte Zeitangabe natürlich und präzise anschließen.
- source_word: בְּשִׁכְבָהּ
  choice: als sie sich hinlegte
  rationale: Der Infinitiv mit בְּ und Suffix bezeichnet den Zeitpunkt beziehungsweise Begleitumstand ihres Hinlegens. Der Text ergänzt an dieser Stelle nicht ausdrücklich „zu ihm“.
- source_word: וּבְקוּמָהּ
  choice: als sie aufstand
  rationale: Die parallele Infinitivkonstruktion bezeichnet den Zeitpunkt ihres Aufstehens; die Formulierung wahrt die syntaktische Entsprechung.
