  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: de
  text: Lot ging zu ihnen hinaus, an den Eingang, und schloss die Tür hinter sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging hinaus
  rationale: Das Wayyiqtol von יצא führt die Erzählung mit einer abgeschlossenen Handlung fort. »ging hinaus« gibt die nach außen gerichtete Bewegung natürlich wieder.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: אֶל mit dem Suffix der 3. Person maskulin Plural bezeichnet die Bewegung auf die Männer draußen zu.
- source_word: לוֹט
  choice: Lot
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: הַפֶּתְחָה
  choice: an den Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang; das angefügte Richtungs-He zeigt eine Bewegung dorthin an. »Eingang« bleibt bewusst von der anschließend genannten Tür unterschieden.
- source_word: וְהַדֶּלֶת
  choice: die Tür
  rationale: דֶּלֶת bezeichnet hier die Tür selbst und wird dadurch von פֶּתַח, dem Eingang beziehungsweise der Öffnung, unterschieden.
- source_word: סָגַר
  choice: schloss
  rationale: סגר bedeutet »schließen«; »schloss die Tür« ist im modernen Standarddeutsch die natürliche Verbindung.
- source_word: אַחֲרָיו
  choice: hinter sich
  rationale: 'Die Wendung hat hier räumlichen Sinn: Lot schließt die Tür, nachdem er nach draußen getreten ist, hinter seinem eigenen Rücken.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Die knappe Satzstruktur des Hebräischen bleibt erhalten; »Eingang« und »Tür« werden lexikalisch klar unterschieden.
