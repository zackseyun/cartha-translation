  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen räumlichen Bezüge des Hebräischen zutreffend wieder: Lot geht zu den vor dem Haus stehenden Männern hinaus, zum Eingang/der Öffnung, und schließt die Tür hinter sich. Die Unterscheidung von פֶּתַח (Eingang/Öffnung) und דֶּלֶת (Tür) bleibt erhalten.'
  naturalness: „an den Eingang“ ist als Zielangabe zwar verständlich, wirkt in der vorliegenden Stellung („ging zu ihnen hinaus an den Eingang“) im modernen Standarddeutsch jedoch etwas gedrängt. Durch Kommas als nachgestellte Orts- bzw. Zielangabe wird der knappe Erzählstil bewahrt und der Satz leichter lesbar.
