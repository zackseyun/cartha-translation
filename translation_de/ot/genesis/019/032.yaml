base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: de
  text: Komm, lass uns unserem Vater Wein zu trinken geben und mit ihm schlafen, damit wir durch unseren Vater Nachkommen bekommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Kommt
  rationale: Die erstarrte Aufforderungsform von הלך dient hier als antreibender Zuruf. Da eine Frau ihre Schwester anspricht, gibt der deutsche Plural „Kommt“ die Aufforderung natürlich wieder.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: wir wollen unserem Vater Wein zu trinken geben
  rationale: Der Hifil von שקה ist kausativ. Diese Formulierung bewahrt den Sinn, dass sie ihm Wein geben und ihn dadurch trinken lassen, ohne unnötig zu unterstellen, dass sie ihn mit Zwang dazu bringen.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: und bei ihm liegen
  rationale: שכב mit עִם ist hier ein sexueller Euphemismus. „Bei ihm liegen“ bewahrt die verhüllende, zugleich verständliche Ausdrucksweise des Hebräischen und passt in ein würdiges modernes Register.
- source_word: וּנְחַיֶּה
  choice: damit wir … erhalten
  rationale: Der Piel-Kohortativ von חיה bezeichnet das Erhalten beziehungsweise Fortbestehenlassen. Mit „damit“ wird die im Zusammenhang erkennbare Absicht natürlich ausgedrückt.
- source_word: מֵאָבִינוּ זָרַע
  choice: durch unseren Vater Nachkommen
  rationale: זָרַע bezeichnet hier Nachkommenschaft, nicht wörtlichen Samen. מן markiert den Ursprung; im Deutschen drückt „durch unseren Vater“ in diesem Zusammenhang die Abstammung idiomatisch aus.
theological_decisions:
- issue: Art und moralische Bewertung des Plans
  choice: Die sexuelle Absicht wird durch „bei ihm liegen“ erkennbar, aber nicht erläutert oder ausdrücklich bewertet.
  alternative: Eine explizite Formulierung wie „Geschlechtsverkehr mit ihm haben“ oder ein wertender Zusatz.
  rationale: Der hebräische Text gebraucht einen Euphemismus und berichtet den Plan ohne eingeschobenen moralischen Kommentar. Die Übersetzung bewahrt beides.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der antreibende Auftakt und die beiden aufeinander bezogenen Vorhaben bleiben erhalten; unnötig archaische Wendungen und eine übermäßig explizite Sexualsprache werden vermieden.
