- from: Kommt, wir wollen unserem Vater Wein zu trinken geben und bei ihm liegen, damit wir durch unseren Vater Nachkommen erhalten.
  to: Komm, lass uns unserem Vater Wein zu trinken geben und mit ihm schlafen, damit wir durch unseren Vater Nachkommen bekommen.
