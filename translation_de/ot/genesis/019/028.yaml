  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: de
  text: 'Er schaute auf Sodom und Gomorra und über das ganze Gebiet der Ebene hinab. Da sah er: Rauch stieg vom Land auf wie der Rauch eines Ofens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eines Brennofens; auch: eines Ofens/Kilns.'
    reason: Lexikalische Alternative für כִּבְשָׁן; die genaue Art des Ofens ist im Hebräischen nicht festgelegt.
lexical_decisions:
- source_word: וַיַּשְׁקֵף עַל־פְּנֵי
  choice: blickte … hinab
  rationale: שׁקף im Hifil bezeichnet hier den Blick von einem erhöhten Standort auf das darunterliegende Gebiet. Die deutsche Wendung gibt diese räumliche Perspektive natürlich wieder.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom und Gomorra
  rationale: Im Deutschen übliche Namensformen.
- source_word: כָּל־פְּנֵי אֶרֶץ הַכִּכָּר
  choice: das ganze Land der Jordanebene
  rationale: כִּכָּר bezeichnet in diesem Zusammenhang die Ebene beziehungsweise den Bezirk am Jordan. Die Präzisierung „Jordanebene“ macht den geografischen Bezug im Deutschen verständlich, ohne den Umfang näher festzulegen.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'Da sah er:'
  rationale: וְהִנֵּה lenkt die Aufmerksamkeit auf den plötzlich wahrgenommenen Anblick. Der Doppelpunkt bewahrt die anschauliche Hervorhebung in natürlichem modernem Deutsch.
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: Rauch stieg vom Land auf
  rationale: קִיטֹר bezeichnet Rauch oder Dampf; im Vergleich mit einem Ofen ist „Rauch“ die naheliegende Bedeutung. עָלָה beschreibt sein Aufsteigen.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: wie der Rauch eines Schmelzofens
  rationale: כִּבְשָׁן kann einen Brenn-, Schmelz- oder Kalkofen bezeichnen. „Schmelzofen“ vermittelt das Bild eines großen, stark rauchenden Ofens; die allgemeinere Alternative wird in der Fußnote erhalten.
