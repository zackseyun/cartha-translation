translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die hebräische Blickrichtung und die dramatische Wahrnehmungsfolge bleiben erhalten; das altertümliche „siehe“ wird durch eine pointierte deutsche Satzgestaltung wiedergegeben.
