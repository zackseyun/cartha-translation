  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: de
  text: 'Doch Lot sagte zu ihnen: „Nein, bitte, meine Herren!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nein, bitte, mein Herr!“ Die hebräische Form אֲדֹנָי kann auch als respektvolle Anrede im Singular verstanden werden; der Pluralkontext („zu ihnen“) spricht hier jedoch eher für „meine Herren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative וַ führt die Handlung fort; wegen Lots Einwand gegen die vorausgehende Anweisung gibt „doch“ den Gegensatz im Deutschen natürlich wieder.
- source_word: לוֹט
  choice: Lot
  rationale: Der Eigenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person maskulin Plural bedeutet unmittelbar „zu ihnen“. Der pronominale Bezug auf die beiden Besucher wird nicht erklärend erweitert.
- source_word: אַל
  choice: Nein
  rationale: Das sonst für Verbote gebrauchte Negationswort steht hier ohne Verb und weist die vorausgehende Aufforderung entschieden zurück; idiomatisches Deutsch verlangt „Nein“.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel kennzeichnet eine dringliche, höfliche Bitte und wird in aktuellem Deutsch treffend mit „bitte“ wiedergegeben.
- source_word: אֲדֹנָי
  choice: meine Herren
  rationale: Der Pluralkontext („zu ihnen“) legt eine Anrede an die beiden Besucher nahe. „Meine Herren“ bewahrt den pluralischen Sinn und klingt im modernen Deutschen natürlicher als „meine Gebieter“.
theological_decisions:
- issue: Ist אֲדֹנָי als Anrede an die beiden Besucher oder als singulärer Gottestitel zu verstehen?
  choice: 'Pluralische Anrede: „meine Herren“'
  alternative: 'Singuläre Anrede: „mein Herr“'
  rationale: Das pluralische „zu ihnen“ und die zwei angesprochenen Besucher sprechen im unmittelbaren Kontext für eine pluralische Anrede. Da die hebräische Form jedoch auch als respektvolle Singularanrede beziehungsweise traditionell als Gottesbezeichnung verstanden werden kann, bleibt diese Lesart in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ macht Lots widersprechende Reaktion deutlich; „meine Herren“ ist eine verständliche respektvolle Anrede, ohne die mögliche Singularlesart zu verschweigen.
