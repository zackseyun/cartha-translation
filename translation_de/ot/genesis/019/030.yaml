  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: de
  text: Da zog Lot von Zoar hinauf und wohnte im Bergland; seine beiden Töchter waren bei ihm. Denn er fürchtete sich, in Zoar zu wohnen. So wohnte er in einer Höhle[a], er und seine beiden Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Höhle“. Der bestimmte Artikel kann die Höhle als diejenige kennzeichnen, die Lot bezog; bei ihrer ersten Erwähnung ist im Deutschen jedoch „in einer Höhle“ natürlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: zog von Zoar hinauf
  rationale: עלה bezeichnet eine aufwärts gerichtete Bewegung. „Zog … hinauf“ bewahrt sowohl den Ortswechsel als auch die topografische Richtung.
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישב bezeichnet hier das Wohnen beziehungsweise den Aufenthalt, nicht bloß das Sitzen. „Wohnte“ ist gegenwärtiges, natürliches Deutsch und lässt offen, wie dauerhaft der Aufenthalt war.
- source_word: בָּהָר
  choice: im Bergland
  rationale: Das singularische הַר kann eine gebirgige Landschaft als topografischen Bereich bezeichnen. „Im Bergland“ gibt dies im Deutschen natürlich wieder, ohne einen einzelnen Berg oder einen im Hebräischen nicht ausdrücklich vorhandenen Plural festzulegen.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: seine beiden Töchter waren bei ihm
  rationale: Der hebräische Nominalsatz wird im Deutschen mit „waren“ vervollständigt; „bei ihm“ bewahrt die schlichte Aussage der Begleitung.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: Denn er fürchtete sich, in Zoar zu wohnen
  rationale: כִּי nennt den Grund für Lots Aufenthalt im Bergland. Die reflexive Wendung „fürchtete sich“ gibt den stativen Sinn von ירא idiomatisch wieder.
- source_word: בַּמְּעָרָה
  choice: in einer Höhle
  rationale: Im Hebräischen steht der bestimmte Artikel, doch bei der ersten Erwähnung einer zuvor nicht näher bezeichneten Höhle ist im Deutschen der unbestimmte Artikel natürlicher. Die formale Alternative wird in der Fußnote dokumentiert.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: er und seine beiden Töchter
  rationale: Die abschließende Wiederaufnahme wird beibehalten, weil sie im Hebräischen die Bewohner der Höhle ausdrücklich hervorhebt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholungen von „Zoar“, „wohnte“ und „seine beiden Töchter“ bleiben erhalten, da sie die schlichte, betonte Erzählweise des Hebräischen prägen. Der Semikolonanschluss vermeidet einen schwerfälligen deutschen Satz, ohne die enge Verbindung der Aussagen zu lösen.
