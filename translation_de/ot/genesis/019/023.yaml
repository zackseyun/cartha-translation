  text: הַ/שֶּׁ֖מֶשׁ יָצָ֣א עַל הָ/אָ֑רֶץ וְ/ל֖וֹט בָּ֥א צֹֽעֲרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: de
  text: Die Sonne war über dem Land[a] aufgegangen, und Lot war nach Zoar gekommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „über der Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Sonne ging über dem Land auf, und Lot kam nach Zoar.“ Die hebräischen Perfektformen können hier auch mit dem deutschen Präteritum wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Das bestimmte Substantiv bezeichnet die Sonne; dies ist die natürliche und genaue deutsche Wiedergabe.
- source_word: יָצָא
  choice: war … aufgegangen
  rationale: יצא bedeutet wörtlich „hinausgehen/hervorkommen“, bezeichnet bei der Sonne aber idiomatisch ihr Aufgehen. Das Plusquamperfekt gibt hier den bereits erreichten zeitlichen Hintergrund für das folgende Geschehen wieder.
- source_word: עַל הָאָרֶץ
  choice: über dem Land
  rationale: עַל bezeichnet hier die Lage „über“, während אֶרֶץ sowohl „Land“ als auch „Erde“ bedeuten kann. Im örtlichen Erzählzusammenhang ist „Land“ am natürlichsten; die Alternative wird in einer Fußnote bewahrt.
- source_word: וְלוֹט
  choice: und Lot
  rationale: Die einfache Verbindung וְ wird mit „und“ wiedergegeben; der Personenname erscheint in seiner üblichen deutschen Form.
- source_word: בָּא
  choice: war … gekommen
  rationale: Das Qal-Perfekt von בוא bedeutet „kommen/eintreten“. Das Plusquamperfekt stellt Lots Ankunft als abgeschlossen dar, bevor die unmittelbar folgende Handlung einsetzt.
- source_word: צֹעֲרָה
  choice: nach Zoar
  rationale: Der Ortsname trägt das richtungsweisende He und bezeichnet daher eine Bewegung auf Zoar zu; im Deutschen wird dies idiomatisch mit „nach Zoar“ ausgedrückt.
theological_decisions: []
