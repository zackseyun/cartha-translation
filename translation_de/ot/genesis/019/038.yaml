base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: de
  text: Auch die Jüngere gebar einen Sohn und gab ihm den Namen Ben-Ammi[a]. Er ist der Stammvater der Ammoniter[b] bis auf den heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Ammi bedeutet wahrscheinlich »Sohn meines Volkes« oder »Sohn meines Verwandten«.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Ammons«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: Auch die Jüngere
  rationale: Das substantivierte Adjektiv bezieht sich im Kontext auf Lots jüngere Tochter; „die Jüngere“ ist knapp und natürlich.
- source_word: גַם הִוא
  choice: Auch
  rationale: Die Partikelverbindung hebt hervor, dass die jüngere Tochter ebenso wie die ältere einen Sohn gebar.
- source_word: יָלְדָה בֵּן
  choice: gebar einen Sohn
  rationale: Direkte, im gehobenen modernen Erzählstil verständliche Wiedergabe der hebräischen Geburtsformel.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: gab ihm den Namen
  rationale: Natürliche deutsche Wiedergabe der hebräischen Namensgebungsformel, ohne deren Sinn zu verändern.
- source_word: בֶּן עַמִּי
  choice: Ben-Ammi
  rationale: Der Personenname wird transkribiert; seine im Zusammenhang bedeutsame mögliche Bedeutung wird in einer Fußnote erläutert.
- source_word: הוּא אֲבִי
  choice: Er ist der Stammvater
  rationale: „Stammvater“ gibt die genealogische Bedeutung von אָב hier klarer wieder als das im Deutschen missverständliche bloße „Vater“.
- source_word: בְנֵי עַמּוֹן
  choice: der Ammoniter
  rationale: Die idiomatische Volksbezeichnung entspricht dem wörtlichen Ausdruck „Söhne Ammons“; die Formulierung wird in einer Fußnote transparent gemacht.
- source_word: עַד הַיּוֹם
  choice: bis auf den heutigen Tag
  rationale: Geläufige und würdige deutsche Wiedergabe der hebräischen Zeitformel, bezogen auf die Zeit des Erzählers.
