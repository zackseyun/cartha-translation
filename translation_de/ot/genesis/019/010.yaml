- from: Doch die Männer[a] streckten ihre Hände[b] aus, holten Lot zu sich ins Haus und schlossen die Tür.
  to: Doch die Männer[a] streckten ihre Hände[b] aus, brachten Lot zu sich ins Haus und schlossen die Tür.
  rationale: Eine geringfügige lexikalische Präzisierung ersetzt „holten“ durch „brachten“. Die Übersetzung erhält die rasche Handlungsfolge, die adversative Einleitung, die hebräische Bezeichnung „Männer“ und die im Deutschen idiomatische Wiedergabe der singularischen hebräischen Kollektiv-/Besitzkonstruktion durch „ihre Hände“ samt Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:23:37Z'
review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die hebräische Handlungsfolge und die Bezeichnung „die Männer“ treffend wieder. Die Wendung וַיִּשְׁלְחוּ אֶת־יָדָם hat jedoch im Hebräischen ein Singularobjekt („ihre Hand“); eine deutsche idiomatische Pluralisierung ist zwar möglich, die vorhandene Fußnote dokumentiert dies korrekt. „Holten Lot zu sich ins Haus“ ist verständlich, kann aber im Deutschen stärker den Beginn einer Abholung nahelegen als das unmittelbare Hereinbringen; „brachten Lot zu sich ins Haus“ entspricht וַיָּבִיאוּ präziser.
  naturalness: „Doch die Männer streckten ihre Hände aus, holten Lot zu sich ins Haus und schlossen die Tür“ ist flüssiges modernes Standarddeutsch. Mit „brachten“ wird der Satz ebenso natürlich und semantisch unmittelbarer.
  terminology: „Männer“, „Haus“ und „Tür“ sind sachgerecht. Die Fußnote zu den Männern wahrt die im Vers verwendete Bezeichnung und erläutert den Kontext ohne ihn in den Haupttext einzutragen. „Engelboten“ ist verständlich, aber „Boten Gottes“ wäre interpretativer; die vorhandene Formulierung ist als knappe Kontextinformation vertretbar.
