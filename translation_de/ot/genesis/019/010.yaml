    issue: „holten“ für וַיָּבִיאוּ
    rationale: Das Verb bedeutet hier kausativ „brachten/hineinbrachten“. „Holten“ ist nicht falsch, kann aber im gegenwärtigen Deutsch eher eine Bewegung zum Abholen als das anschließende Hereinbringen betonen. „Brachte[n] ... ins Haus“ ist enger am hebräischen Verb und am unmittelbaren Ablauf.
