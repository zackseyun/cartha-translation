  text: וַ/יִּשְׁלְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת יָדָ֔/ם וַ/יָּבִ֧יאוּ אֶת ל֛וֹט אֲלֵי/הֶ֖ם הַ/בָּ֑יְתָ/ה וְ/אֶת הַ/דֶּ֖לֶת סָגָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: de
  text: Doch die Männer[a] streckten ihre Hände[b] aus, brachten Lot zu sich ins Haus und schlossen die Tür.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der weitere Zusammenhang identifiziert diese Männer als Engelboten.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihre Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Substantiv bezeichnet hier ausdrücklich „die Männer“. Obwohl der weitere Zusammenhang sie als Engelboten erkennen lässt, bleibt die Bezeichnung des Verses im Haupttext erhalten.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: streckten ihre Hände aus
  rationale: Die Verbindung von שׁלח mit „Hand“ bezeichnet das körperliche Ausstrecken der Hand. Der deutsche Plural ist bei einem mehrzahligen Subjekt idiomatisch; die wörtliche Singularform wird in einer Fußnote vermerkt.
- source_word: וַיָּבִיאוּ
  choice: holten
  rationale: Der Hifil von בוא bedeutet „bringen/hineinbringen“. „Holten ... zu sich ins Haus“ gibt Bewegungsrichtung und Ziel im Deutschen natürlich wieder, ohne die stärkere Deutung „zerrten“ einzutragen.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: zu sich ins Haus
  rationale: אֲלֵיהֶם bezeichnet die Bewegung zu den Männern hin; die Richtungsendung an הַבָּיְתָה zeigt die Bewegung ins Haus. Die Formulierung bewahrt beide Aspekte.
- source_word: הַדֶּלֶת
  choice: die Tür
  rationale: דֶּלֶת ist die gewöhnliche Bezeichnung für eine Tür; eine erläuternde Erweiterung ist nicht erforderlich.
- source_word: סָגָרוּ
  choice: schlossen
  rationale: „Schlossen“ ist die natürliche standarddeutsche Wiedergabe des Verbs und passt zur raschen Handlungsfolge.
- source_word: וַ
  choice: Doch
  rationale: Das Waw führt die Erzählung fort und markiert hier zugleich den Gegensatz zum unmittelbar vorausgehenden Angriff der Menge. „Doch“ bringt diese Funktion knapp zum Ausdruck.
theological_decisions:
- issue: Ob הָאֲנָשִׁים im Haupttext ausdrücklich als Engel bezeichnet werden soll
  choice: „die Männer“ im Haupttext beibehalten
  alternative: „die Engel“ oder „die Boten“
  rationale: Der Erzählzusammenhang identifiziert die Gestalten als Engelboten, doch dieser Vers nennt sie „die Männer“. Die Übersetzung bewahrt die konkrete Wortwahl des hebräischen Textes und erläutert die Identität in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei aufeinanderfolgenden Handlungen stehen als gemeinsames Prädikatgefüge, wodurch das schnelle Erzähltempo des Hebräischen erhalten bleibt.
