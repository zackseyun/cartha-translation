  source_fidelity: 'Der Text gibt die Abfolge und die wesentlichen Elemente des Hebräischen genau wieder: das Zurufen an Lot, die Ortsfrage nach den männlichen Besuchern, deren Ankunft in jener Nacht, die Aufforderung, sie herauszubringen, und ידע in bewusst nicht explizierter Form. „Heute Nacht“ ist im unmittelbaren Erzählkontext eine angemessene moderne Wiedergabe von הַלָּיְלָה.'
