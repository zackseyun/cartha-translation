  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: de
  text: 'Da riefen sie Lot zu und sagten zu ihm: »Wo sind die Männer, die heute Nacht zu dir gekommen sind? Bring sie zu uns heraus, damit wir sie erkennen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Zusammenhang nach deutlicher: »damit wir mit ihnen Geschlechtsverkehr haben«. Wörtlich steht im Hebräischen: »damit wir sie erkennen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: Da riefen sie Lot zu
  rationale: קרא אל bezeichnet hier das Rufen zu einer Person. „Lot zurufen“ gibt die direkte Anrede natürlich wieder, ohne die nicht ausdrücklich bezeichnete Lautstärke durch „schreien“ zu verstärken.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: Wo sind die Männer
  rationale: אַיֵּה fragt nach dem Aufenthaltsort; אֲנָשִׁים bezeichnet hier die männlichen Besucher und wird daher geschlechtsgenau mit „Männer“ wiedergegeben.
- source_word: אֲשֶׁר בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: die heute Nacht zu dir gekommen sind
  rationale: Die Formulierung identifiziert die Besucher durch ihre Ankunft in derselben Nacht. „Heute Nacht“ ist im modernen Deutsch natürlich und im Erzählzusammenhang eindeutig.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Bring sie zu uns heraus
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszubringen. Die Wortstellung ist im Deutschen idiomatisch und bewahrt sowohl die Richtung nach draußen als auch das Ziel „zu uns“.
- source_word: וְנֵדְעָה אֹתָם
  choice: damit wir sie erkennen
  rationale: ידע bedeutet grundsätzlich „kennen/erkennen“ und kann im Kontext ein sexueller Euphemismus sein. „Erkennen“ bewahrt die hebräische Ausdrucksweise und ihre Spannung; die wahrscheinliche sexuelle Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Ob die sexuelle Absicht von וְנֵדְעָה אֹתָם im Haupttext ausdrücklich benannt werden soll
  choice: Die wörtliche Ausdrucksweise „damit wir sie erkennen“ bleibt im Haupttext erhalten; die sexuelle Bedeutung wird in einer Fußnote erklärt.
  alternative: „damit wir mit ihnen Geschlechtsverkehr haben“ oder, unter stärkerer Einbeziehung des feindseligen Kontexts, „damit wir sie sexuell missbrauchen“
  rationale: Der Kontext legt eine feindselige sexuelle Absicht nahe, doch das Hebräische verwendet das gewöhnliche Verb ידע, „kennen/erkennen“. Eine ausdrückliche Formulierung im Haupttext würde die kontextuelle Deutung festschreiben und die sprachliche Gestalt des Ausgangstextes aufgeben. Haupttext und Fußnote bilden Bedeutung und Mehrdeutigkeit gemeinsam ab.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Erkennen“ ist bewusst bibelnah und wird wegen seiner im heutigen Deutsch nicht ohne Weiteres erkennbaren sexuellen Bedeutung durch eine Fußnote erläutert.
