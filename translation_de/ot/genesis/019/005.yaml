  terminology: „Männer“ gibt אֲנָשִׁים geschlechtsgenau wieder. „Erkennen“ bewahrt die wörtliche und im Deutschen bibelsprachlich etablierte Ausdrucksweise für ידע; die Fußnote erläutert den im Kontext wahrscheinlichen sexuellen Sinn, ohne ihn im Haupttext als alleinige Übersetzung festzuschreiben.
