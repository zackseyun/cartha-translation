  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: de
  text: 'Da ging Lot hinaus und redete mit seinen Schwiegersöhnen[a], die seine Töchter heiraten sollten, und sagte: „Steht auf und verlasst diesen Ort! Denn Jahwe ist dabei, die Stadt zu vernichten.“ Doch seinen Schwiegersöhnen schien er nur zu scherzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit seinen Schwiegersöhnen, die seine Töchter geheiratet hatten“. Die hebräische Wendung kann sowohl bereits verheiratete Männer als auch die künftigen Ehemänner der Töchter bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Doch in den Augen seiner Schwiegersöhne war er wie einer, der scherzt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: seinen Schwiegersöhnen
  rationale: חָתָן kann einen Bräutigam oder Schwiegersohn bezeichnen. „Schwiegersöhne“ ist im Deutschen natürlich; die folgende Partizipialwendung erläutert die Beziehung, ohne die im Hebräischen offene Frage nach dem genauen Ehestatus stillschweigend festzulegen.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: die seine Töchter heiraten sollten
  rationale: Wörtlich bezeichnet die Wendung Männer, die Lots Töchter „nahmen“, hier im Sinn der Eheschließung. Die prospektive Wiedergabe passt zum Erzählzusammenhang, während eine Fußnote die ebenfalls mögliche Deutung als bereits verheiratete Männer festhält.
- source_word: קוּמוּ צְּאוּ
  choice: Steht auf und verlasst
  rationale: Die zwei Imperative werden knapp und dringlich wiedergegeben. „Steht auf“ bewahrt קוּמוּ eigenständig; „verlasst“ klingt in modernem Standarddeutsch natürlicher als „geht hinaus aus“.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Zusammen mit „verlasst“ gibt der Akkusativ „diesen Ort“ die hebräische Herkunftsangabe idiomatisch und mit ihrer deiktischen Bestimmtheit wieder.
- source_word: מַשְׁחִית
  choice: wird … vernichten
  rationale: Das Hifil-Partizip bezeichnet hier die unmittelbar bevorstehende Vernichtung. Das deutsche Futur drückt die angekündigte, noch ausstehende Handlung klar aus, ohne anzudeuten, sie habe bereits begonnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִמְצַחֵק
  choice: wie einer, der Scherze macht
  rationale: Die Formulierung bewahrt sowohl den Vergleich mit כְּ als auch den Sinn einer Person, deren Worte nicht ernst genommen werden. Sie legt nicht unnötig fest, ob צחק hier Scherzen, Spotten oder Lachen bezeichnet.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: in den Augen seiner Schwiegersöhne
  rationale: Die hebräische Wahrnehmungsformel wird bewusst formal bewahrt und macht deutlich, dass es um das Urteil der Schwiegersöhne geht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Ehestatus der als חֲתָנָיו bezeichneten Männer
  choice: Schwiegersöhne, die seine Töchter heiraten sollten
  alternative: Schwiegersöhne, die seine Töchter geheiratet hatten
  rationale: Das Partizip לֹקְחֵי erlaubt im Kontext eine prospektive beziehungsweise inchoative Deutung, doch eine bereits vollzogene Ehe ist sprachlich nicht ausgeschlossen. Die Hauptübersetzung folgt dem Erzählzusammenhang; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, dringlichen Imperativen. Der Gottesname erscheint als „Jahwe“. Die ungewöhnlichere Schlussformulierung „in den Augen … wie einer“ hält die Bildgestalt und Wahrnehmungsperspektive des Hebräischen fest; die Fußnote bietet die geläufigere deutsche Sinnwiedergabe.
