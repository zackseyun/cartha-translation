  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: de
  text: 'Da sagte er zu ihm: „Sieh, auch in dieser Sache komme ich dir entgegen:[a] Ich werde die Stadt, von der du gesprochen hast, nicht vernichten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich habe dein Gesicht auch in dieser Sache erhoben“; eine hebräische Redewendung dafür, jemandem Gunst zu erweisen beziehungsweise seine Bitte zu gewähren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion der Partikel in einer würdigen, noch verständlichen deutschen Form.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: komme ich dir entgegen
  rationale: Die Wendung bedeutet wörtlich, jemandes Gesicht zu erheben, und bezeichnet hier die Gewährung einer Bitte. „Dir entgegenkommen“ gibt den idiomatischen Sinn natürlich wieder, ohne die folgende Sache selbst als „Gunst“ zu bezeichnen.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: auch in dieser Sache
  rationale: Gibt sowohl die additive Kraft von גַּם als auch die breite Bedeutung von דָּבָר wieder; im Kontext ist Lots Bitte gemeint.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: Ich werde … nicht vernichten
  rationale: Die Konstruktion nennt den Inhalt des gewährten Entgegenkommens. הפך bedeutet wörtlich „umkehren/umstürzen“, bezeichnet hier aber die katastrophale Zerstörung der Stadt; „vernichten“ ist im modernen Deutschen natürlich und kontextgerecht.
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: die Stadt, von der du gesprochen hast
  rationale: Folgt der hebräischen Relativkonstruktion eng und bleibt im Deutschen klar und feierlich.
