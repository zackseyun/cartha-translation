  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: de
  text: Und sie schlugen die Männer, die am Eingang des Hauses waren, mit Blindheit[a], vom Geringsten bis zum Größten; und sie mühten sich ab, den Eingang zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer Blendung“ oder „mit Sehverwirrung“; das seltene hebräische Wort kann mehr als gewöhnliche Blindheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: schlugen sie
  rationale: Der Hifil von נכה bedeutet gewöhnlich „schlagen“ oder „mit etwas treffen“. Die Formulierung bewahrt das kräftige hebräische Verb und ist im Deutschen mit „mit Blindheit schlagen“ verständlich.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: אֲנָשִׁים bezeichnet hier die männliche Menge vor Lots Haus; „Männer“ ist sachlich und kontextgenau.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: am Eingang des Hauses
  rationale: Die knappe Ortsangabe gibt die elliptische hebräische Wendung natürlich wieder, ohne eine Tür als Gegenstand vorauszusetzen.
- source_word: בַּסַּנְוֵרִים
  choice: mit Blindheit
  rationale: Das seltene Wort bezeichnet eine übernatürlich bewirkte Störung des Sehens. „Blindheit“ gibt den klaren Hauptsinn wieder; mögliche Nuancen werden in der Fußnote bewahrt.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die Merismusformel umfasst die ganze Gruppe und bezieht sich eher auf Rang oder Bedeutung als ausdrücklich auf das Alter.
- source_word: וַיִּלְאוּ
  choice: sie mühten sich ab
  rationale: לָאָה bezeichnet Ermüdung und Erschöpfung. „Sich abmühen“ verbindet die Anstrengung idiomatisch mit dem folgenden Infinitiv.
- source_word: לִמְצֹא
  choice: zu finden
  rationale: Der Infinitiv bezeichnet das Ziel ihrer erfolglosen Anstrengung.
- source_word: הַפָּתַח
  choice: den Eingang
  rationale: פֶּתַח meint die Öffnung beziehungsweise den Zugang. Die Wiederholung von „Eingang“ spiegelt die Wiederholung desselben hebräischen Wortes im Vers.
theological_decisions:
- issue: Art der durch סַנְוֵרִים bezeichneten Beeinträchtigung
  choice: übernatürlich bewirkte Blindheit
  alternative: blendende Benommenheit oder Verwirrung des Sehens
  rationale: Der seltene Ausdruck kann mehr als gewöhnliche Blindheit bezeichnen. Der Haupttext nennt den klaren narrativen Effekt, während die Fußnote die lexikalische Unschärfe offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „mit Blindheit schlagen“ bewahrt die Bildkraft des Hebräischen; „vom Geringsten bis zum Größten“ erhält die inklusive Formel. „Vergeblich“ macht den im Zusammenhang eindeutigen Misserfolg natürlich deutlich.
