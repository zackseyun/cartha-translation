  rationale: Eine vollständige Korrektur ist notwendig, weil der Entwurf die grammatischen Rollen des hebräischen Satzes umkehrt. Die Revision stellt die vorausgesetzten Handelnden als „sie“ und die Männer vor dem Haus als Betroffene wieder her. Sie erhält die bewusste Zurückhaltung bei der seltenen Bezeichnung der Sehstörung sowie die inklusive Formel und die erschöpfende Suche nach dem Eingang.
