  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: de
  text: 'Sieh doch: Ich habe zwei Töchter, die noch mit keinem Mann Verkehr hatten.[a] Lasst mich sie bitte zu euch herausbringen. Tut mit ihnen, was in euren Augen gut ist. Nur diesen Männern tut nichts an, denn sie sind in den Schatten meines Daches gekommen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die keinen Mann erkannt haben“; gemeint ist, dass sie mit keinem Mann Geschlechtsverkehr hatten. Traditionell wird dies als „die Jungfrauen sind“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: „In den Schatten meines Daches“ ist ein Bild für den Schutz, der Gästen im Haus ihres Gastgebers zustand.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה fordert nachdrücklich Aufmerksamkeit; נָא verleiht dem Ruf hier einen bittenden Ton. „Sieh doch“ ist gegenwärtiges, eindringliches Deutsch.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: die noch mit keinem Mann Verkehr hatten
  rationale: יָדַע ist hier ein hebräischer Ausdruck für Geschlechtsverkehr. Eine rein wörtliche Wiedergabe mit „erkennen“ wäre im heutigen Deutsch leicht missverständlich; „Verkehr hatten“ gibt den Sinn klar und ohne beschönigende Umdeutung wieder.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Ich will sie zu euch herausbringen
  rationale: Der Kohortativ bezeichnet Lots entschlossenen Vorschlag beziehungsweise seine angebotene Handlung. Das erneute נָא prägt den bittenden Ton des Zusammenhangs, ohne im Deutschen zwingend ein zweites „bitte“ zu erfordern.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: Tut mit ihnen, was in euren Augen gut ist
  rationale: Die Formulierung bewahrt das hebräische Bild „gut in euren Augen“ und mildert den verstörenden Inhalt nicht ab.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Nur diesen Männern tut nichts an
  rationale: „Nur“ erhält die starke Einschränkung durch רַק. „Nichts antun“ ist eine natürliche deutsche Wiedergabe des absoluten Verbots und passt zum drohenden Gewaltkontext.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: denn sie sind … gekommen
  rationale: Die kausale Verbindung wird verständlich wiedergegeben, ohne עַל כֵּן übermäßig festzulegen oder eine zusätzliche Zweckaussage einzutragen.
- source_word: בְּצֵל קֹרָתִי
  choice: unter den Schatten meines Daches
  rationale: Die Wiedergabe erhält das konkrete Schutzbild des Hebräischen. Die ungewohnte Wendung wird in einer Fußnote kulturell erläutert.
theological_decisions:
- issue: Ob Lots schockierendes Angebot aus Gründen moralischer Lesbarkeit abgeschwächt werden soll
  choice: Die ungeschönte Aussage des hebräischen Textes bleibt erhalten
  alternative: Eine abschwächende Umschreibung wie „Behandelt sie, wie es euch gefällt“
  rationale: Der Text berichtet Lots Angebot, ohne dass die Übersetzung es gutheißt. Seine Härte darf weder durch Euphemismen gemildert noch durch einen wertenden Zusatz kommentiert werden.
- issue: Bedeutung des Schutzbildes vom Schatten des Daches
  choice: Das Bild im Haupttext bewahren und den Gastschutz in der Fußnote erläutern
  alternative: Im Haupttext deutend mit „unter meinen Schutz“ übersetzen
  rationale: Die bildhafte und kulturelle Spannung des Ausgangstextes bleibt sichtbar; zugleich erklärt die Fußnote die im Kontext gemeinte Verpflichtung des Gastgebers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und verstörend, ohne Archaismen oder moralische Glättung. Die ungewöhnliche Dach-Schatten-Metapher wird bewusst bewahrt und knapp erläutert.
