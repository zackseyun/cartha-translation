  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב אֶל לָבָן֙ הָבָ֣/ה אֶת אִשְׁתִּ֔/י כִּ֥י מָלְא֖וּ יָמָ֑/י וְ/אָב֖וֹאָה אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: de
  text: 'Da sagte Jakob zu Laban: „Gib mir meine Frau, denn meine Zeit ist erfüllt, damit ich zu ihr eingehen kann[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „zu ihr eingehen“, eine übliche verhüllende Redeweise für die Vollziehung der Ehe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Gib mir
  rationale: Die Aufforderungsformel richtet sich an Laban; „Gib mir“ macht das im Deutschen erforderliche indirekte Objekt deutlich und passt zum Zusammenhang der vereinbarten Eheschließung.
- source_word: אֶת אִשְׁתִּי
  choice: meine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Hier bezeichnet Jakob Rahel als die ihm nach der vereinbarten Dienstzeit zustehende Ehefrau.
- source_word: כִּי מָלְאוּ יָמָי
  choice: denn meine Zeit ist erfüllt
  rationale: Wörtlich sind Jakobs „Tage voll geworden“; gemeint ist die vollendete vereinbarte Dienstzeit. „Meine Zeit ist erfüllt“ bewahrt das Bild in natürlichem, würdigem Deutsch.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: damit ich zu ihr eingehen kann
  rationale: בוא אל ist hier eine verhüllende Redeweise für den ehelichen Geschlechtsverkehr. Die Formulierung wahrt die hebräische Zurückhaltung; „damit“ gibt die zielgerichtete Nuance wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „zu ihr eingehen“ wurde wegen ihrer Nähe zum hebräischen Euphemismus beibehalten und durch eine Fußnote erklärt.
