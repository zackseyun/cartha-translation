  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: de
  text: So ging er auch zu Rahel ein[a]; er liebte auch Rahel mehr als Lea und diente bei Laban noch weitere sieben Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So kam er auch zu Rahel.“ Die hebräische Wendung umschreibt in diesem Zusammenhang euphemistisch die eheliche Vereinigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: So ging er auch zu Rahel ein
  rationale: Die Verbindung בוא אֶל bezeichnet in diesem Ehekontext idiomatisch das Eingehen zur Frau und schließt die eheliche Vereinigung ein. Die traditionelle deutsche Wendung bewahrt die verhüllte Ausdrucksweise des Hebräischen; גַּם wird mit „auch“ wiedergegeben.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: Er liebte Rahel
  rationale: אָהַב ist das gewöhnliche Verb für „lieben“. Das zweite גַּם hebt Rahel im Zusammenhang erneut hervor, muss im Deutschen aber nicht nochmals ausdrücklich wiedergegeben werden, da „auch“ sonst eine missverständliche Gleichordnung mit Lea nahelegen könnte.
- source_word: מִלֵּאָה
  choice: mehr als Lea
  rationale: מִן hat nach einem Verb der Zuneigung hier am natürlichsten vergleichende Bedeutung.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: diente bei Laban
  rationale: עבד bezeichnet dienen beziehungsweise arbeiten. עִמּוֹ heißt wörtlich „bei/mit ihm“; die Nennung Labans macht den Bezug im Deutschen klar, während „bei“ das Dienstverhältnis natürlich ausdrückt.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: noch weitere sieben Jahre
  rationale: עוֹד zusammen mit אֲחֵרוֹת bezeichnet einen zusätzlichen Zeitraum; die Formulierung ist im modernen Deutschen klar und idiomatisch.
theological_decisions:
- issue: Vergleich oder ausschließlicher Gegensatz in מִלֵּאָה
  choice: mehr als Lea
  alternative: anstatt Lea
  rationale: Der Kontext spricht am ehesten für einen Gradvergleich der Zuneigung. Die mögliche alternative Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Rahel eingehen“ bewahrt bewusst den zurückhaltenden biblischen Euphemismus; die übrige Satzgestaltung ist natürlich und gut verständlich.
