  text: וַ/יְהִ֣י בָ/עֶ֔רֶב וַ/יִּקַּח֙ אֶת לֵאָ֣ה בִתּ֔/וֹ וַ/יָּבֵ֥א אֹתָ֖/הּ אֵלָ֑י/ו וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: de
  text: Als es Abend geworden war, nahm Laban seine Tochter Lea und brachte sie zu Jakob. Und er ging zu ihr ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „zu ihr eingehen“ bezeichnet hier Geschlechtsverkehr.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Als es Abend geworden war
  rationale: Die Zeitangabe leitet das nächste Ereignis der Erzählung ein. Diese Formulierung gibt den Eintritt des Abends in natürlichem, modernem Deutsch wieder.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: nahm Laban seine Tochter Lea
  rationale: Das im Hebräischen nur durch die vorangehende Erzählung bezeichnete Subjekt wird als „Laban“ verdeutlicht; „seine Tochter Lea“ ist im Deutschen die natürliche Apposition.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: und brachte sie zu Jakob
  rationale: Der Hifil von בוא bedeutet hier „bringen“. Der pronominale Bezug „zu ihm“ wird zur besseren Verständlichkeit als „zu Jakob“ ausgedrückt.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Und er ging zu ihr ein
  rationale: Die herkömmliche deutsche Wendung bewahrt den verhüllenden Charakter des hebräischen Ausdrucks für Geschlechtsverkehr, ohne ihn im Haupttext ausdrücklich auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Eigennamen ersetzen an zwei Stellen eindeutige Pronomen, um die wechselnden männlichen Bezugspersonen Laban und Jakob unmissverständlich zu kennzeichnen. Die traditionelle Wendung „zu ihr eingehen“ bleibt wegen ihrer Nähe zum hebräischen Euphemismus erhalten und wird in der Fußnote erklärt.
