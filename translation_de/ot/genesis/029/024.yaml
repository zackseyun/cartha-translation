  source_fidelity: 'Der Text gibt die Abfolge und die Funktionen des Hebräischen treffend wieder: Laban ist der Handelnde, Silpa wird als seine שִׁפְחָה bezeichnet und Lea, seiner Tochter, in der Rolle einer שִׁפְחָה gegeben. Die Auflösung des pronominalen Empfängers durch „seiner Tochter Lea“ ist im Deutschen klar und entspricht der anschließenden Apposition im Ausgangstext.'
  naturalness: „Und Laban gab Silpa, seine Dienerin, seiner Tochter Lea als Dienerin“ ist modernes, verständliches Standarddeutsch. Die Wiederholung von „Dienerin“ ist hier weder störend noch unnötig, sondern bildet die wiederholte Rollenbezeichnung des Hebräischen nachvollziehbar ab.
  terminology: „Silpa“ ist die etablierte deutsche Namensform. „Dienerin“ ist eine angemessene moderne Wiedergabe von שִׁפְחָה; die Fußnote nennt mit „Magd“ eine traditionelle Alternative und erläutert die wahrscheinlich unfreie Abhängigkeitsstellung, ohne den hebräischen Ausdruck übermäßig zu verengen.
