  text: וַ/יִּתֵּ֤ן לָבָן֙ לָ֔/הּ אֶת זִלְפָּ֖ה שִׁפְחָת֑/וֹ לְ/לֵאָ֥ה בִתּ֖/וֹ שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: de
  text: Und Laban gab Silpa, seine Dienerin, seiner Tochter Lea als Dienerin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Magd“. Das hebräische Wort bezeichnet eine weibliche Person in abhängiger, wahrscheinlich unfreier Dienststellung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das Verb נתן bezeichnet hier schlicht das Geben beziehungsweise Überlassen; „gab“ bewahrt die knappe Erzählweise, ohne die rechtliche oder soziale Art des Vorgangs näher festzulegen.
- source_word: זִלְפָּה
  choice: Silpa
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: שִׁפְחָתוֹ
  choice: seine Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Person in abhängiger, wahrscheinlich unfreier Dienststellung. „Dienerin“ ist heute verständlich und gibt Geschlecht und Funktion wieder; eine Fußnote weist auf den sozialen Status und die traditionelle Alternative „Magd“ hin.
- source_word: לְלֵאָה בִתּוֹ
  choice: seiner Tochter Lea
  rationale: Die Präposition לְ kennzeichnet Lea als Empfängerin; בִתּוֹ steht als Apposition dazu. Die deutsche Wortstellung verbindet beides natürlich.
- source_word: שִׁפְחָה
  choice: als Dienerin
  rationale: Das abschließende Substantiv bezeichnet die Rolle, in der Silpa Lea gegeben wurde. Die Wiederholung von „Dienerin“ entspricht der Wiederholung desselben hebräischen Wortes und bleibt im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die zweimalige Wiedergabe von שִׁפְחָה mit „Dienerin“ bewahrt die bewusste lexikalische Wiederholung des Hebräischen; die Kommas machen die appositionale Bestimmung „seine Dienerin“ deutlich.
