  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: de
  text: Jakob teilte Rahel mit, dass er mit ihrem Vater verwandt und Rebekkas Sohn war.[a] Da lief sie zu ihrem Vater und erzählte es ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Bruder ihres Vaters“. Das hebräische Wort für „Bruder“ kann auch einen nahen männlichen Verwandten bezeichnen; Jakob war Labans Neffe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: sagte
  rationale: Der Hifil von נגד bedeutet hier, jemandem etwas mitzuteilen. Mit dem folgenden dass-Satz ist „sagte“ im modernen deutschen Erzählstil natürlich.
- source_word: כִּי
  choice: dass
  rationale: Beide Vorkommen leiten den Inhalt dessen ein, was Jakob Rahel mitteilt.
- source_word: אֲחִי אָבִיהָ
  choice: mit ihrem Vater verwandt
  rationale: Wörtlich steht „Bruder ihres Vaters“. אָח kann jedoch auch einen männlichen Verwandten bezeichnen; Jakob ist Labans Neffe, nicht sein leiblicher Bruder. Die Formulierung gibt den gemeinten Verwandtschaftsgrad natürlich wieder, ohne eine falsche genaue Beziehung zu behaupten.
- source_word: בֶן רִבְקָה
  choice: ein Sohn Rebekkas
  rationale: Die einfache Abstammungsangabe wird im Deutschen klar und idiomatisch wiedergegeben.
- source_word: וַתָּרָץ
  choice: Da lief sie
  rationale: רוץ bezeichnet tatsächliches Laufen. „Da“ wahrt den raschen Fortgang der hebräischen Erzählung.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: erzählte es ihrem Vater
  rationale: Das Verb נגד erscheint erneut und bedeutet hier „mitteilen/erzählen“. Das Pronomen „es“ macht im Deutschen natürlich deutlich, dass Rahel ihrem Vater die Nachricht überbringt.
