id: GEN.29.26
reference: Genesis 29:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: de
  text: 'Laban sagte: »Bei uns[a] ist es nicht üblich, die Jüngere vor der Erstgeborenen[c] zur Frau zu geben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „an unserem Ort“; gemeint ist der örtliche Brauch. Möglich ist auch: „in unserer Gegend“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier nur „geben“; dass es um das Geben zur Frau, also um die Verheiratung, geht, ergibt sich aus dem Zusammenhang.
    reason: lexical_alternative
  - marker: c
    text: Oder „der Älteren“ beziehungsweise „der älteren Tochter“. „Erstgeborene“ bewahrt die Betonung der Geburtsfolge im Hebräischen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen wayyiqtol von אמר ist „sagte“.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: ist es nicht üblich
  rationale: Die unpersönliche Form bezeichnet hier eine örtliche Sitte oder gesellschaftlich anerkannte Praxis, nicht bloß etwas, das nicht geschieht.
- source_word: בִּמְקוֹמֵנוּ
  choice: bei uns
  rationale: Das wörtliche „an unserem Ort“ bezieht sich idiomatisch auf den örtlichen Brauch; „bei uns“ gibt dies in natürlichem Deutsch wieder.
- source_word: לָתֵת
  choice: zur Frau zu geben
  rationale: Das Verb bedeutet wörtlich „geben“; aus dem Hochzeitskontext ergibt sich, dass die Tochter einem Mann zur Frau gegeben wird.
- source_word: הַצְּעִירָה
  choice: die Jüngere
  rationale: Das feminine Adjektiv wird substantivisch gebraucht; „Tochter“ ist im Kontext klar, steht aber nicht ausdrücklich im hebräischen Text.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier den Vorrang in der Reihenfolge; „vor“ ist die direkte und natürliche Entsprechung.
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Die feminine Form bezeichnet die erstgeborene beziehungsweise ältere Tochter und betont ausdrücklich die Geburtsfolge.
theological_decisions: []
