  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: de
  text: 'Lea wurde schwanger und gebar einen Sohn. Sie gab ihm den Namen Ruben[a], denn sie sagte: »Weil Jahwe meine Not gesehen hat, wird mein Mann mich jetzt lieben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Ruben klingt im Hebräischen ähnlich wie »Seht, ein Sohn!« und wird hier zugleich durch Leas Aussage »Jahwe hat meine Not gesehen« erklärt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden bzw. Empfangen. »Wurde schwanger« ist im modernen Deutschen natürlich und eindeutig.
- source_word: וַתֵּלֶד בֵּן
  choice: gebar einen Sohn
  rationale: Die knappe Formulierung bewahrt den erzählerischen Stil des Hebräischen und ist in würdigem modernem Deutsch verständlich.
- source_word: וַתִּקְרָא שְׁמוֹ רְאוּבֵן
  choice: Sie gab ihm den Namen Ruben
  rationale: Diese natürliche deutsche Namensformel erhält den Zusammenhang mit der anschließenden Namensdeutung; die hebräischen Wortklänge werden in der Fußnote erläutert.
- source_word: כִּי אָמְרָה
  choice: denn sie sagte
  rationale: כִּי führt hier die Begründung für die Namensgebung ein; »denn« gibt diese erzählerische Funktion idiomatisch wieder.
- source_word: כִּי רָאָה יְהוָה בְּעָנְיִי
  choice: Jahwe hat mein Elend gesehen
  rationale: ראה wird mit »gesehen« wiedergegeben und bewahrt so den Wortklang zur Namensdeutung. עֳנִי bezeichnet Leas bedrückende Notlage; »Elend« ist prägnant und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי
  choice: nun wird mein Mann mich lieben
  rationale: Die Formulierung bewahrt Leas aus der Geburt abgeleitete Hoffnung. אִישִׁי bedeutet in diesem ehelichen Zusammenhang »mein Mann«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; »Jahwe« wahrt den Charakter als persönlicher Gottesname.
- issue: Leas Erwartung nach der Geburt
  choice: nun wird mein Mann mich lieben
  alternative: nun liebt mich mein Mann
  rationale: Der hebräische Imperfekt יֶאֱהָבַנִי drückt hier ihre auf die Zukunft gerichtete Erwartung aus, nicht die Feststellung einer bereits eingetretenen Veränderung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die emotionale Spannung in Leas Hoffnung wird bewahrt, ohne anzudeuten, dass ihr Mann sie tatsächlich lieben werde.
