base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: de
  text: 'Und sie wurde wieder schwanger und gebar einen Sohn. Sie sagte: »Diesmal will ich Jahwe preisen.« Darum gab sie ihm den Namen Juda.[a] Dann hörte sie auf zu gebären.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Juda klingt im Hebräischen ähnlich wie ein Verb, das »preisen« oder »danken« bedeutet.
    reason: Das hebräische Wortspiel zwischen אוֹדֶה und יְהוּדָה lässt sich im Deutschen nicht unmittelbar wiedergeben.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: sie wurde wieder schwanger
  rationale: הרה bezeichnet das Schwangerwerden; עוֹד markiert in der Geburtenfolge die Wiederholung. Die Formulierung ist im heutigen Deutschen natürlich.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: Die Wendung bezeichnet die Geburt eines Sohnes. „Gebar“ bewahrt den knappen, würdevollen Erzählstil.
- source_word: הַפַּעַם
  choice: Diesmal
  rationale: Die Formulierung hebt diesen Anlass gegenüber den vorangegangenen Geburten hervor, ohne zusätzliche Gefühlsnuancen einzutragen.
- source_word: אוֹדֶה
  choice: will ich … preisen
  rationale: Das Hifil von ידה kann „preisen“ oder „danken“ bedeuten. „Preisen“ erhält den Zusammenhang der Namensdeutung und lässt zugleich die Dankbedeutung als lexikalische Alternative offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ
  choice: Darum gab sie ihm den Namen
  rationale: Die kausale Namensformel wird idiomatisch und vollständig ins Deutsche übertragen.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Dies ist die gebräuchliche deutsche Form des Personennamens; eine Fußnote erklärt das hebräische Wortspiel.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Danach gebar sie keine Kinder mehr
  rationale: עמד mit מן und Infinitiv bezeichnet das Aufhören einer Tätigkeit. Die deutsche Formulierung gibt den Sinn natürlich wieder; „danach“ markiert die Erzählfolge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von אוֹדֶה
  choice: preisen
  alternative: danken
  rationale: Beide Bedeutungen sind möglich. „Preisen“ bildet die im Kontext beabsichtigte lautliche und etymologische Beziehung zum Namen Juda besonders klar ab; die Alternative wird nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Erzählton. Die Namensformel ist idiomatisch formuliert; der Gottesname bleibt als Eigenname erhalten.
