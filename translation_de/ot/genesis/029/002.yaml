  terminology: »Brunnen«, »Schafherden«, »tränkte man« und »Öffnung des Brunnens« sind sachgerecht. Die Fußnoten vermerken sinnvoll die wörtliche räumliche Formulierung und die idiomatische Wendung »Mund des Brunnens«.
