base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: de
  text: 'Er sah: Da war ein Brunnen auf dem Feld, und dort lagen drei Schafherden bei ihm[a], denn aus diesem Brunnen tränkte man die Herden. Der Stein auf der Öffnung des Brunnens[b] war groß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf ihm«; gemeint ist: beim Brunnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf dem Mund des Brunnens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Er sah sich um
  rationale: Die Form führt die Erzählung weiter und leitet Jakobs Wahrnehmung der Szene ein. »Er sah« wäre wörtlicher, klingt hier im Deutschen jedoch weniger natürlich.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: und da war ... Dort lagen
  rationale: Die beiden Aufmerksamkeitspartikel werden in natürlichem modernem Deutsch durch die vor Augen tretende Darstellung wiedergegeben. Eine zweimalige Wiedergabe mit »siehe« wäre formaler, klänge aber deutlich altertümlicher.
- source_word: בְּאֵר
  choice: Brunnen
  rationale: Dies ist die übliche und im Zusammenhang ausreichend genaue Bedeutung.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: »Feld« gibt שָׂדֶה direkt wieder; die deutsche Präposition »auf« ist hier idiomatisch.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: drei Schafherden
  rationale: עֵדֶר bezeichnet eine Herde, צֹאן Kleinvieh, besonders Schafe und Ziegen. »Schafherden« ist im pastoralen Zusammenhang klar und natürlich.
- source_word: רֹבְצִים
  choice: lagen
  rationale: Das Partizip beschreibt Tiere, die liegen oder lagern. »Lagen« bewahrt das konkrete Bild.
- source_word: עָלֶיהָ
  choice: neben ihm
  rationale: Wörtlich steht eine räumliche Wendung wie »auf/bei ihm«; beim Brunnen bezeichnet sie idiomatisch die unmittelbare Nähe.
- source_word: כִּי
  choice: denn
  rationale: Die Partikel führt die Erklärung dafür ein, weshalb die Herden dort lagen.
- source_word: מִן הַבְּאֵר הַהִוא
  choice: aus diesem Brunnen
  rationale: Der Demonstrativ verweist auf den gerade sichtbaren und genannten Brunnen; im Deutschen ist »diesem« in dieser Erzählsituation natürlich.
- source_word: יַשְׁקוּ
  choice: tränkte man
  rationale: Der Hifil von שׁקה bedeutet »zu trinken geben, tränken«. Die dritte Person Plural hat hier einen unbestimmten menschlichen Bezug, den das deutsche »man« idiomatisch ausdrückt; die Vergangenheitsform beschreibt die übliche Praxis.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: Der Stein auf der Öffnung des Brunnens war groß
  rationale: Die Wiedergabe bewahrt die beschreibende Nominalkonstruktion und versteht פִּי bildlich als die Öffnung des Brunnens.
