source:
  edition: WLC
  text: וַ/יֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת רָחֵ֑ל וַ/יֹּ֗אמֶר אֶֽעֱבָדְ/ךָ֙ שֶׁ֣בַע שָׁנִ֔ים בְּ/רָחֵ֥ל בִּתְּ/ךָ֖ הַ/קְּטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: de
  text: 'Jakob liebte Rahel[a] und sagte: »Ich will dir sieben Jahre für deine jüngere Tochter Rahel dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher mit der fortführenden Konjunktion: »Und Jakob liebte Rahel.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: liebte
  rationale: Das Verb אָהַב bezeichnet unmittelbar Liebe. »Liebte« ist präzise und natürlich; »war verliebt in« würde eine zusätzliche emotionale Nuance eintragen.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: אמר ist die gewöhnliche Einleitung direkter Rede und wird ohne unnötige Präzisierung mit »sagte« wiedergegeben.
- source_word: אֶעֱבָדְךָ
  choice: ich will dir … dienen
  rationale: עבד bezeichnet hier den Dienst beziehungsweise die Arbeit für Laban. »Dir dienen« bewahrt sowohl den Arbeits- als auch den persönlichen Verpflichtungscharakter.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre
  rationale: Direkte und eindeutige Wiedergabe der Zahl mit dem Substantiv.
- source_word: בְּרָחֵל
  choice: für … Rahel
  rationale: Die Präposition ב bezeichnet hier den Gegenstand beziehungsweise die Grundlage des vereinbarten Dienstes. »Für Rahel« ist knapp und idiomatisch, ohne den Austauschcharakter übermäßig auszudeuten.
- source_word: בִּתְּךָ
  choice: deine Tochter
  rationale: Direkte Wiedergabe des Constructus mit maskulinem Suffix der zweiten Person Singular.
- source_word: הַקְּטַנָּה
  choice: jüngere
  rationale: Das Adjektiv bedeutet wörtlich »klein«; im Vergleich von Geschwistern bezeichnet es idiomatisch die jüngere Tochter.
- source_word: וַ
  choice: und
  rationale: Das Waw führt die Erzählung fort. Im Deutschen gibt »und« diese Verknüpfung formal und natürlich wieder.
