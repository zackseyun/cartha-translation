  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: de
  text: Dann küsste Jakob Rahel[a], erhob seine Stimme und weinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begrüßte Rahel mit einem Kuss“. Das hebräische Verb bedeutet gewöhnlich „küssen“; hier kann der Kuss zugleich eine verwandtschaftliche Begrüßung sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: küsste
  rationale: Das Qal von נשׁק bedeutet gewöhnlich „küssen“. Im Zusammenhang handelt es sich um einen wirklichen Kuss, der zugleich als verwandtschaftliche Begrüßung zu verstehen sein kann.
- source_word: לְרָחֵל
  choice: Rahel
  rationale: 'Die Präposition ל kennzeichnet hier die Person, die geküsst wird. Im natürlichen Deutschen steht sie als direktes Objekt: „Rahel“. Der Name folgt der im Deutschen üblichen biblischen Form.'
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: erhob seine Stimme
  rationale: Die hebräische Wendung bezeichnet eine vernehmbare, oft laute Gefühlsäußerung. Die relativ formnahe deutsche Wendung bewahrt den literarischen Ausdruck und bleibt gut verständlich.
- source_word: וַיֵּבְךְּ
  choice: weinte
  rationale: בכה bedeutet „weinen“ oder „wehklagen“. „Weinte“ ist hier die natürliche, kontextgerechte Wiedergabe, ohne die Art des Weinens näher festzulegen.
- source_word: וַ
  choice: Dann
  rationale: Das narrative Waw führt die Handlung weiter. „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die hebräische Wendung „seine Stimme erheben“ bleibt erhalten; „weinte“ klingt im heutigen Deutsch natürlicher als das gehobenere „weinte laut“ oder „brach in Tränen aus“, die den Ausgangstext stärker auslegen würden.
