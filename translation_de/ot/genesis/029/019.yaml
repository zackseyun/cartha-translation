  text: וַ/יֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣/י אֹתָ֣/הּ לָ֔/ךְ מִ/תִּתִּ֥/י אֹתָ֖/הּ לְ/אִ֣ישׁ אַחֵ֑ר שְׁבָ֖/ה עִמָּדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: de
  text: 'Laban sagte: »Es ist besser, dass ich sie dir gebe, als dass ich sie einem anderen Mann gebe. Bleib bei mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe der narrativen Form von אמר, die direkte Rede einleitet.
- source_word: טוֹב
  choice: es ist besser
  rationale: In der Vergleichskonstruktion mit מִן bezeichnet טוֹב, dass die erste Möglichkeit der zweiten vorzuziehen ist; »es ist besser … als …« ist natürliches modernes Deutsch.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: dass ich sie dir gebe
  rationale: Der Infinitiv mit Suffix der ersten Person Singular wird im Deutschen lesbar und sinngemäß als Nebensatz wiedergegeben.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: als dass ich sie einem anderen Mann gebe
  rationale: Das vergleichende מִן und der Infinitiv bilden den zweiten Teil des Vergleichs; die parallele Satzform erhält die Struktur des Hebräischen.
- source_word: אִישׁ אַחֵר
  choice: einem anderen Mann
  rationale: Entspricht dem ausdrücklichen Wortlaut; »einem anderen Ehemann« würde eine im Kontext mögliche, aber nicht ausdrücklich bezeichnete Rolle ergänzen.
- source_word: שְׁבָה
  choice: Bleib
  rationale: Der Imperativ von ישׁב bedeutet hier, weiterhin an einem Ort beziehungsweise bei jemandem zu bleiben; »Bleib« ist klar und idiomatisch.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: Im Deutschen bezeichnet »bei mir« den hier gemeinten fortgesetzten Aufenthalt natürlicher als das wörtlichere »mit mir«.
