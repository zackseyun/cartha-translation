  text: וּ/לְ/לָבָ֖ן שְׁתֵּ֣י בָנ֑וֹת שֵׁ֤ם הַ/גְּדֹלָה֙ לֵאָ֔ה וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה רָחֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: de
  text: Laban hatte zwei Töchter. Die ältere hieß Lea, und die jüngere hieß Rahel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und dem Laban [waren] zwei Töchter; der Name der Älteren war Lea, und der Name der Jüngeren war Rahel.«'
    reason: Die Fußnote zeigt die hebräische Besitzkonstruktion mit לְ („dem Laban“) sowie die wiederholte Namensformel, die im Haupttext idiomatisch wiedergegeben sind.
lexical_decisions:
- source_word: וּלְלָבָן
  choice: Laban hatte
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich »und Laban [waren]« und wird im modernen Deutschen natürlich mit »Laban hatte« wiedergegeben. Das Waw erfordert hier keinen ausdrücklichen temporalen Diskursmarker.
- source_word: שְׁתֵּי בָנוֹת
  choice: zwei Töchter
  rationale: Direkte und natürliche Wiedergabe der Zahlwort-Nomen-Verbindung.
- source_word: שֵׁם הַגְּדֹלָה לֵאָה
  choice: Die ältere hieß Lea
  rationale: Das wörtliche »der Name der Älteren war Lea« wird idiomatisch wiedergegeben, ohne den parallelen Aufbau oder die Altersrelation zu verändern.
- source_word: וְשֵׁם הַקְּטַנָּה רָחֵל
  choice: und die jüngere hieß Rahel
  rationale: Bewahrt die Parallelität der beiden Namensangaben; קְטַנָּה bezeichnet im Zusammenhang der Schwestern die Jüngere, nicht körperliche Kleinheit.
- source_word: לֵאָה / רָחֵל
  choice: Lea / Rahel
  rationale: Verwendet die im Deutschen etablierten biblischen Namensformen.
