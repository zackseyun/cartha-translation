base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: de
  text: 'Am Morgen, siehe da, war es Lea. Da sagte Jakob zu Laban: »Was hast du mir da angetan? Habe ich nicht für Rahel bei dir gearbeitet? Warum hast du mich dann getäuscht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: sieh da
  rationale: Bewahrt das hebräische Überraschungs- und Enthüllungssignal in natürlichem, zugleich erzählerisch gehobenem Deutsch.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: habe ich ... bei dir gearbeitet
  rationale: Gibt den Dienst bei Laban idiomatisch wieder, ohne das Verhältnis unnötig als Sklavendienst festzulegen.
- source_word: רִמִּיתָנִי
  choice: hast du mich getäuscht
  rationale: Entspricht dem Vorwurf vorsätzlicher Irreführung; „betrogen“ wäre ebenfalls möglich, kann im Deutschen hier aber unerwünschte zusätzliche Assoziationen wecken.
- source_word: וְלָמָּה
  choice: Warum ... dann
  rationale: Das „dann“ bildet den folgernden Anschluss an die vorausgehende rhetorische Frage ab.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die emphatische Überraschung des hebräischen וְהִנֵּה bleibt erhalten. Der im Hebräischen nicht ausdrücklich genannte Sprecher wird zur Klarheit als Jakob bezeichnet; der Kontext identifiziert ihn eindeutig.
