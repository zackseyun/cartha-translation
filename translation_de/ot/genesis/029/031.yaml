  text: וַ/יַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַ/יִּפְתַּ֖ח אֶת רַחְמָ֑/הּ וְ/רָחֵ֖ל עֲקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: de
  text: Als der HERR sah, dass Lea gehasst wurde, öffnete er ihren Mutterleib; Rahel aber war unfruchtbar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: gehasst wurde
  rationale: Die passive Form und die starke Bedeutung des hebräischen Wortes werden bewahrt; das mildere „nicht geliebt“ würde die Spannung des Ausgangstextes abschwächen.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: öffnete er ihren Mutterleib
  rationale: Die konkrete hebräische Wendung wird in verständlichem, würdigem Deutsch wiedergegeben und nicht deutend zu „machte sie fruchtbar“ umformuliert.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: Dies ist die natürliche und sachlich genaue deutsche Entsprechung für die im Text bezeichnete Kinderlosigkeit aufgrund ausbleibender Empfängnis.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den besonderen Gottesnamen, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- issue: Stärke der Aussage über Lea
  choice: gehasst wurde
  alternative: nicht geliebt wurde / weniger geliebt wurde
  rationale: Der hebräische Text verwendet das starke שׂנא. Eine relationale Abschwächung ist im weiteren Erzählzusammenhang denkbar, soll aber nicht stillschweigend in den Vers hineingelesen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der adversative Gegensatz wird durch „Rahel aber“ klar markiert; das Semikolon bildet die hebräische Satzgliederung natürlich ab.
