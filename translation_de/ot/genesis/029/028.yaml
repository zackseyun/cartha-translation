  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: de
  text: Jakob tat es so und vollendete diese Woche[a]. Dann gab Laban ihm seine Tochter Rahel zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Hochzeitswoche«. Das hebräische Wort bezeichnet wörtlich einen Zeitraum von sieben; hier meint es wahrscheinlich die Woche des Hochzeitsfestes.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Jakob tat es so
  rationale: Die Wendung gibt den Rückbezug auf Labans Aufforderung im vorherigen Vers knapp und natürlich wieder, ohne die Handlung näher zu bestimmen als der hebräische Text.
- source_word: וַיְמַלֵּא
  choice: vollendete
  rationale: Das Piel von מלא bezeichnet hier das vollständige Durchlaufen eines Zeitraums; »vollendete« bewahrt diesen Sinn in würdigem, verständlichem Deutsch.
- source_word: שְׁבֻעַ זֹאת
  choice: diese Woche
  rationale: שְׁבֻעַ bezeichnet einen Siebenerzeitraum und meint im Kontext wahrscheinlich die Hochzeitswoche. Die knappe Wiedergabe bewahrt den Wortlaut; die kulturelle Einordnung steht in der Fußnote.
- source_word: וַיִּתֶּן לוֹ
  choice: Dann gab Laban ihm
  rationale: Das fortlaufende Narrativ legt Laban als unausgesprochenes Subjekt nahe. Seine ausdrückliche Nennung verhindert im Deutschen eine irreführende Mehrdeutigkeit; »Dann« verdeutlicht die zeitliche Folge.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: seine Tochter Rahel
  rationale: Die deutsche Wortstellung gibt die Beziehung und den Namen natürlich und eindeutig wieder.
- source_word: לוֹ לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung entspricht der hebräischen Konstruktion für die Übergabe einer Frau zur Eheschließung, ohne altertümlich zu wirken.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge bleibt erkennbar, während die Nennung Labans die im Deutschen sonst entstehende Subjektmehrdeutigkeit vermeidet.
