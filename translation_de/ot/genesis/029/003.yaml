base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: de
  text: Dort kamen jeweils alle Herden zusammen. Dann wälzte man den Stein von der Öffnung des Brunnens, tränkte das Kleinvieh und legte den Stein wieder an seinen Platz auf die Öffnung des Brunnens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: kamen jeweils … zusammen
  rationale: Das imperfektive Verb beschreibt im Zusammenhang einen wiederkehrenden Vorgang. „Jeweils“ macht diesen gewohnheitsmäßigen Charakter im Deutschen deutlich.
- source_word: כָל הָעֲדָרִים
  choice: alle Herden
  rationale: עֲדָרִים bezeichnet hier die einzelnen Herden von Kleinvieh, die am Brunnen zusammenkommen.
- source_word: וְגָלֲלוּ
  choice: wälzte man
  rationale: „Wälzen“ bewahrt das konkrete Bild des rollenden Bewegens. Das unpersönliche „man“ gibt den nicht ausdrücklich genannten menschlichen Handlungsträger natürlich wieder und vermeidet den missverständlichen Bezug von „sie“ auf die Herden.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: von der Öffnung des Brunnens
  rationale: פִּי הַבְּאֵר bedeutet wörtlich „Mund des Brunnens“, ist hier aber die gewöhnliche Bezeichnung für dessen Öffnung. Die natürliche deutsche Wiedergabe lautet „Öffnung des Brunnens“.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: tränkte die Schafe
  rationale: Der Hifil von שׁקה bedeutet „zu trinken geben“. צֹאן ist eine kollektive Bezeichnung für Kleinvieh; im unmittelbaren Zusammenhang ist „die Schafe“ eine klare und natürliche Wiedergabe.
- source_word: וְהֵשִׁיבוּ
  choice: legte … wieder
  rationale: Der Hifil von שוב bezeichnet hier das Zurückbringen des Steins. „Wieder … legen“ drückt dies im Deutschen idiomatisch aus.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: an seinen Platz über der Brunnenöffnung
  rationale: Die Formulierung bewahrt sowohl die Rückkehr an den vorgesehenen Platz als auch die Lage des Steins über der Öffnung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Handlung wird ausdrücklich kenntlich gemacht; der im Hebräischen nicht genannte menschliche Handlungsträger bleibt durch „man“ unbestimmt.
