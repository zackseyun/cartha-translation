    issue: „die Schafe“ verengt צֹאן
    rationale: צֹאן bezeichnet kollektiv Kleinvieh bzw. eine Herde und schließt im biblisch-hebräischen Gebrauch nicht nur Schafe, sondern gegebenenfalls auch Ziegen ein. Eine offenere deutsche Kollektivbezeichnung bewahrt den Umfang des Ausgangstextes.
  - severity: low
    issue: „über der Brunnenöffnung“ kann eine bloße Lage oberhalb bezeichnen
    rationale: Im Kontext wird der Stein wieder auf die Öffnung gelegt und verschließt sie. „Auf die Öffnung des Brunnens“ gibt עַל konkret und im Deutschen eindeutiger wieder.
