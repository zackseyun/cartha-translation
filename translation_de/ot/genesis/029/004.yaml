base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: de
  text: 'Jakob sagte zu ihnen: »Meine Brüder,[b] woher kommt ihr?«[a] Sie sagten: »Wir kommen aus Haran.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Woher seid ihr?«'
    reason: lexical_alternative
  - marker: b
    text: »Meine Brüder« ist hier eine höfliche, brüderliche Anrede und bezeichnet nicht unbedingt leibliche Verwandtschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: Jakob sagte zu ihnen
  rationale: Die Wortfolge wird im Deutschen natürlich wiedergegeben; אמר bleibt als allgemeines Redeverb mit »sagte« erhalten, ohne es durch »fragte« enger auszulegen.
- source_word: אַחַי
  choice: Meine Brüder
  rationale: Die wörtliche Anrede wird bewahrt. Im Zusammenhang ist sie als freundliche, brüderliche Anrede unbekannter männlicher Hirten zu verstehen, nicht zwingend als Aussage über leibliche Verwandtschaft.
- source_word: מֵאַיִן אַתֶּם
  choice: woher kommt ihr?
  rationale: מֵאַיִן fragt nach Herkunft. »Woher kommt ihr?« ist im modernen Deutsch idiomatisch und bildet zugleich den Herkunftssinn präzise ab.
- source_word: וַיֹּאמְרוּ
  choice: Sie sagten
  rationale: Das gewöhnliche Redeverb אמר wird formal nah wiedergegeben; »sie antworteten« wäre kontextuell möglich, ist aber stärker ausdeutend.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Wir kommen aus Haran
  rationale: Die hebräische Nominalantwort lautet wörtlich etwa »Aus Haran sind wir«. Die deutsche Fassung ergänzt idiomatisch »kommen« und verwendet bei Herkunft aus einer Stadt »aus«.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdiger direkter Rede. Die wörtliche Anrede »meine Brüder« bleibt erhalten und wird durch eine Kulturfußnote erläutert. Die Fußnotenmarker stehen jeweils nach dem vollständigen Satz, auf den sich die Anmerkung bezieht.
