  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: de
  text: Als Laban die Nachricht von Jakob, dem Sohn seiner Schwester, hörte, lief er ihm entgegen, umarmte und küsste ihn und brachte ihn in sein Haus. Dann erzählte Jakob Laban all das.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all diese Dinge“, „all diese Angelegenheiten“ oder „all diese Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Als … hörte
  rationale: כ mit dem Infinitivus constructus bildet hier einen temporalen Nebensatz. „Als … hörte“ gibt die Erzählfolge natürlich wieder, ohne eine besondere Unmittelbarkeit zu behaupten.
- source_word: שֵׁמַע יַעֲקֹב
  choice: die Nachricht von Jakob
  rationale: שֵׁמַע bezeichnet hier eine Nachricht beziehungsweise einen Bericht über Jakob. Die deutsche Formulierung lässt wie das Hebräische offen, welchen genauen Inhalt die Nachricht hatte.
- source_word: בֶּן אֲחֹתוֹ
  choice: dem Sohn seiner Schwester
  rationale: Die ausdrückliche hebräische Verwandtschaftsbezeichnung wird bewahrt; „Neffen“ wäre knapper, aber weniger quellennah.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: lief er ihm entgegen
  rationale: לִקְרָאתוֹ bezeichnet die Bewegung auf jemanden zu, um ihm zu begegnen. „Ihm entgegenlaufen“ ist im Deutschen natürlich und präzise.
- source_word: וַיְחַבֶּק לוֹ וַיְנַשֶּׁק לוֹ
  choice: umarmte und küsste ihn
  rationale: Die beiden Verben bezeichnen die übliche herzliche Begrüßung unter Verwandten; die schlichte Wiedergabe fügt keine weiteren Konnotationen hinzu.
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  choice: brachte ihn in sein Haus
  rationale: Der Hifil von בוא bedeutet „bringen“. Bei einem Haus ist „in sein Haus“ idiomatisches Deutsch und bezeichnet das Hineinführen.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Dann erzählte Jakob Laban
  rationale: Das nicht eigens genannte Subjekt ist dem Zusammenhang nach Jakob. Die ausdrückliche Nennung vermeidet nach der längeren Folge von Handlungen Labans eine falsche Zuordnung.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alles, was geschehen war
  rationale: דְּבָרִים kann Worte, Angelegenheiten oder Geschehnisse bezeichnen. Im Zusammenhang berichtet Jakob offenbar die vorausgegangenen Vorgänge; die Wiedergabe ist im Deutschen natürlicher als „alle diese Dinge“, wird aber wegen der semantischen Breite in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die kurzen aufeinanderfolgenden Handlungen des hebräischen Textes bleiben erkennbar, werden im Deutschen aber flüssig verbunden. Die Verwandtschaftsbezeichnung wird ausdrücklich statt mit „Neffe“ wiedergegeben.
