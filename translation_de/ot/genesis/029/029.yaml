  text: וַ/יִּתֵּ֤ן לָבָן֙ לְ/רָחֵ֣ל בִּתּ֔/וֹ אֶת בִּלְהָ֖ה שִׁפְחָת֑/וֹ לָ֖/הּ לְ/שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: de
  text: Und Laban gab seiner Tochter Rahel seine Dienerin Bilha als ihre Dienerin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder an beiden Stellen: „Sklavin“. Das hebräische Wort שִׁפְחָה kann eine weibliche Dienerin oder Sklavin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Und … gab
  rationale: Die Wayyiqtol-Form von נתן erzählt eine abgeschlossene Handlung weiter; „Und … gab“ gibt dies schlicht und idiomatisch wieder.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Schreibweise wiedergegeben.
- source_word: לְרָחֵל בִּתּוֹ
  choice: seiner Tochter Rahel
  rationale: לְ kennzeichnet die Empfängerin, und בִּתּוֹ bezeichnet sie als Labans Tochter. Die deutsche Wortstellung ist natürlich und bewahrt beide Angaben.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Schreibweise wiedergegeben.
- source_word: שִׁפְחָתוֹ
  choice: seine Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Dienerin beziehungsweise Sklavin. „Dienerin“ ist gegenwärtiges, würdevolles Deutsch und lässt die genaue rechtliche Stellung offen.
- source_word: לָהּ לְשִׁפְחָה
  choice: als Dienerin
  rationale: Die Verbindung bezeichnet Bilhas Rolle für Rahel. „als Dienerin“ ist im Deutschen idiomatisch; Rahel als Bezugsgröße ist bereits durch die Empfängerangabe eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit leicht gehobenem biblischem Erzählton. Die Wiederholung von „Dienerin“ bildet die Wiederholung des hebräischen שִׁפְחָה ab; die Fußnote wahrt die soziale und rechtliche Bedeutungsbreite.
