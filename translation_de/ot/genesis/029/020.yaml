  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: de
  text: Jakob diente sieben Jahre für Rahel, und sie kamen ihm wegen seiner Liebe zu ihr wie wenige Tage vor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: diente
  rationale: עבד kann sowohl „dienen“ als auch „arbeiten“ bedeuten. „Diente“ bewahrt hier den persönlichen und vertraglichen Charakter von Jakobs Arbeitsdienst für Laban.
- source_word: בְּרָחֵל
  choice: für Rahel
  rationale: Die Präposition ב bezeichnet in diesem Zusammenhang die Person, für die beziehungsweise um derentwillen der Dienst geleistet wird. „Für Rahel“ ist im Deutschen natürlich und bleibt gegenüber „als Brautpreis für Rahel“ angemessen zurückhaltend.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: sie kamen ihm … vor
  rationale: Die hebräische Wendung „sie waren in seinen Augen“ bezeichnet Jakobs subjektive Wahrnehmung. „Sie kamen ihm … vor“ gibt dieses Idiom in modernem Deutsch treffend wieder.
- source_word: כְּיָמִים אֲחָדִים
  choice: wie wenige Tage
  rationale: Die Wendung bedeutet wörtlich ungefähr „wie einige/wenige Tage“. „Wie wenige Tage“ bewahrt das Vergleichsbild und die empfundene Kürze, ohne ein nicht ausdrücklich vorhandenes „nur“ einzufügen.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: weil er sie liebte
  rationale: Die nominale hebräische Form „wegen/in seiner Liebe zu ihr“ wird als natürlicher deutscher Kausalsatz wiedergegeben; Bedeutung und persönliche Ausrichtung bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nahe am hebräischen Bild, formuliert die Idiome jedoch natürlich. „Doch“ bringt den überraschenden Gegensatz zwischen sieben Jahren und wenigen empfundenen Tagen zum Ausdruck, ohne die Aussage theologisch auszudeuten.
