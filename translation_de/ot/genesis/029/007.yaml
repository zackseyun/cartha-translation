source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: de
  text: 'Da sagte er: »Seht, der Tag ist noch lang.[a] Es ist noch nicht Zeit, das Vieh zusammenzutreiben. Tränkt die Herde[b] und geht und weidet sie!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es ist noch heller Tag.« Wörtlich heißt die hebräische Wendung: »Der Tag ist noch groß.« Gemeint ist, dass noch viel vom Tag übrig ist.'
    reason: lexical_alternative
  - marker: b
    text: »Vieh« gibt eine allgemeine Sammelbezeichnung für domestizierte Herdentiere wieder; »Herde« bezeichnet hier genauer das Kleinvieh, besonders Schafe und Ziegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel wird als gegenwärtiger, gut verständlicher Hinweis wiedergegeben; »Siehe« wäre im modernen Deutsch unnötig altertümlich.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: der Tag ist noch lang
  rationale: Die hebräische Wendung besagt, dass noch viel vom Tag beziehungsweise Tageslicht übrig ist, und bleibt so bildnah verständlich.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: Es ist noch nicht Zeit, das Vieh zusammenzutreiben
  rationale: מִקְנֶה ist eine Sammelbezeichnung für Nutz- beziehungsweise Herdentiere. Die aktive deutsche Form gibt den Sinn der hebräischen Passivkonstruktion natürlich wieder.
- source_word: הַשְׁקוּ
  choice: Tränkt
  rationale: Der Hifil-Imperativ bezeichnet das Geben von Wasser an Tiere; »tränken« ist dafür das präzise und idiomatische deutsche Verb.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen; »Herde« bewahrt den kollektiven und nicht ausschließlich auf Schafe begrenzten Sinn.
- source_word: וּלְכוּ רְעוּ
  choice: geht wieder mit ihr auf die Weide
  rationale: רעה meint hier das Weiden beziehungsweise Hüten der Tiere. Die Formulierung drückt idiomatisch aus, dass die Hirten nach dem Tränken weiter hinausgehen und die Herde grasen lassen sollen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, natürlicher Rede. Die Imperative stehen im Plural. »Wieder« macht den im Zusammenhang naheliegenden Rückgang zur Weide idiomatisch deutlich, ohne den zeitlichen Ablauf der Befehle zu verändern.
