base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: de
  text: 'Dann wurde sie wieder schwanger und gebar einen Sohn. Sie sagte: »Weil Jahwe gehört hat, dass ich gehasst werde[a], hat er mir auch diesen gegeben.« Sie nannte ihn Simeon[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »dass ich ungeliebt bin« oder »dass ich weniger geliebt werde«. Das hebräische Wort bedeutet wörtlich »gehasst«, kann im Zusammenhang aber auch Zurücksetzung oder vergleichsweise geringere Liebe ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Der Name Simeon klingt ähnlich wie das hebräische Wort für »hören«.
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Dann wurde sie wieder schwanger
  rationale: Die Wendung führt die Erzählung weiter; עוֹד bezeichnet die Wiederholung. »Wurde wieder schwanger« ist im heutigen Deutsch natürlich und eindeutig.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: Die knappe Geburtsformel bleibt erhalten; »gebar« ist standardsprachlich, würdevoll und nah am Hebräischen.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Weil Jahwe gehört hat
  rationale: כִּי begründet hier Leas Aussage. Das Perfekt »hat gehört« bezeichnet eine vollendete Handlung mit gegenwärtiger Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: dass ich gehasst bin
  rationale: שְׂנוּאָה trägt die starke Grundbedeutung »gehasst«. Die bewusst harte Formulierung bewahrt die Spannung des Ausgangstextes; mögliche kontextuelle Abschwächungen stehen in der Fußnote.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: hat er mir auch diesen gegeben
  rationale: »Diesen« bezieht sich auf den gerade geborenen Sohn; die Formulierung bewahrt sowohl גַּם als auch den demonstrativen Ausdruck, ohne »Sohn« unnötig zu wiederholen.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Darum gab sie ihm den Namen
  rationale: Die hebräische Namensgebungsformel wird in natürlichem modernem Deutsch wiedergegeben. »Darum« macht den im Zusammenhang erkennbaren Folgerungsbezug deutlich.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: »Simeon« ist die etablierte deutsche Namensform; der Anklang an das hebräische Verb für »hören« wird durch eine Fußnote erläutert.
theological_decisions:
- issue: Leas Beschreibung ihrer Stellung gegenüber Jakob
  choice: dass ich gehasst bin
  alternative: dass ich ungeliebt bin / dass ich weniger geliebt werde
  rationale: Das Hebräische verwendet das starke Wort שְׂנוּאָה. Obwohl es im Zusammenhang Zurücksetzung oder vergleichsweise geringere Liebe bezeichnen kann, wird seine lexikalische Schärfe im Haupttext nicht abgeschwächt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der im Ausgangstext stehende Eigenname wird als »Jahwe« wiedergegeben, damit der persönliche Gottesname sichtbar bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Härte von »gehasst« und das Wortspiel bei der Namensgebung bleiben erhalten; erläuternde Alternativen werden ausschließlich in den Fußnoten genannt.
