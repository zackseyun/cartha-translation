  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם הַ/יְדַעְתֶּ֖ם אֶת לָבָ֣ן בֶּן נָח֑וֹר וַ/יֹּאמְר֖וּ יָדָֽעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Kennt ihr Laban, den Sohn[a] Nahors?“ Sie antworteten: „Wir kennen ihn[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Sohn“ kann auch „Nachkomme“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wir kennen“; „ihn“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Er sagte zu ihnen
  rationale: Die Erzählform führt die Handlung fort. Im Deutschen ist eine zusätzliche Wiedergabe des einleitenden וְ mit „und“ nicht nötig; לָהֶם bezeichnet die angesprochenen Personen.
- source_word: הֲיְדַעְתֶּם
  choice: Kennt ihr
  rationale: יָדַע bezeichnet hier die persönliche Bekanntschaft mit einem Menschen. Das deutsche „kennen“ gibt diesen Sinn natürlicher und genauer wieder als „wissen“.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigene Entsprechung.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: בֶּן נָחוֹר
  choice: den Sohn Nahors
  rationale: בֶּן bedeutet zunächst „Sohn“. Die deutsche Apposition mit Artikel ist idiomatisch; da das Wort auch eine weitere Abstammungsbeziehung bezeichnen kann, wird die Alternative in einer Fußnote genannt.
- source_word: וַיֹּאמְרוּ
  choice: Sie antworteten
  rationale: Im Kontext leitet das Verb die unmittelbare Antwort auf eine Frage ein. „Antworteten“ ist natürliches Deutsch und bewahrt die Gesprächsfunktion, auch wenn das Hebräische wörtlich „sie sagten“ lautet.
- source_word: יָדָעְנוּ
  choice: Wir kennen ihn
  rationale: Die Übersetzung wiederholt wie das Hebräische denselben Erkenntnisbegriff aus der Frage. „Ihn“ ist im Hebräischen nicht ausdrücklich gesetzt, im Deutschen aber als aus dem Kontext erschlossenes Objekt natürlich.
theological_decisions:
- issue: Verwandtschaftsbezeichnung בֶּן נָחוֹר
  choice: den Sohn Nahors
  alternative: den Nachkommen Nahors / aus Nahors Familie
  rationale: Die wörtliche Bedeutung „Sohn“ bleibt im Haupttext erhalten. Zugleich wird nicht verschwiegen, dass בֶּן im Hebräischen auch eine weitere Abstammung ausdrücken kann; dies ist angesichts der genealogischen Angaben zu Laban sachlich relevant.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und natürlich; die Wiederholung von „kennen“ bildet die hebräische Wortwiederholung ab.
