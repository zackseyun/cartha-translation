  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: de
  text: Als Jakob Rahel sah, die Tochter Labans, des Bruders seiner Mutter,[a] und die Herde Labans, des Bruders seiner Mutter, trat Jakob heran, wälzte den Stein von der Öffnung des Brunnens und tränkte die Herde Labans, des Bruders seiner Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wird die Wendung „der Bruder seiner Mutter“ in diesem Vers dreimal wiederholt. Dadurch wird Jakobs familiäre Verbindung zu Laban hervorgehoben.
    reason: Die auffällige Wiederholung der Verwandtschaftsbezeichnung ist im Deutschen bewahrt und wird als bewusstes Merkmal des Ausgangstextes erläutert.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die zeitliche Erzählformel leitet das folgende Geschehen ein. „Als“ gibt die Funktion im modernen Deutschen flüssig wieder, ohne das schwerfällige „Und es geschah, als“.
- source_word: רָאָה
  choice: sah
  rationale: Das Verb bezeichnet hier schlicht die visuelle Wahrnehmung; „sah“ ist direkt und natürlich.
- source_word: בַּת לָבָן
  choice: die Tochter Labans
  rationale: Die Apposition benennt Rahels familiäre Zugehörigkeit und lässt sich im Deutschen klar mit dem Genitiv wiedergeben.
- source_word: אֲחִי אִמּוֹ
  choice: des Bruders seiner Mutter
  rationale: Diese ausdrückliche Verwandtschaftsbezeichnung bewahrt die dreifache Wiederholung des Hebräischen genauer als das knappere „seines Onkels“.
- source_word: צֹאן
  choice: Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh und kann Schafe sowie Ziegen umfassen. „Herde“ erhält diese Offenheit.
- source_word: וַיִּגַּשׁ
  choice: trat ... heran
  rationale: Die Form bezeichnet Jakobs Annäherung an den Brunnen und die bevorstehende Handlung; „trat heran“ ist anschaulich und idiomatisch.
- source_word: וַיָּגֶל
  choice: wälzte
  rationale: Das Verb bezeichnet ein rollendes Bewegen. „Wälzte“ bewahrt das konkrete Bild des schweren Steins.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: von der Öffnung des Brunnens
  rationale: Wörtlich steht „vom Mund des Brunnens“. „Öffnung des Brunnens“ gibt die Bedeutung im Deutschen klar wieder, ohne eine hier ungebräuchliche Metapher zu erzwingen.
- source_word: וַיַּשְׁקְ
  choice: tränkte
  rationale: Der Hifil von שׁקה bedeutet, Menschen oder Tieren Wasser zu geben. „Tränkte“ ist für eine Herde präzise und natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die dreifache Verwandtschaftsformel bleibt trotz ihrer stilistischen Schwere erhalten; die bildhafte Wendung „Mund des Brunnens“ wird dagegen zugunsten des natürlichen deutschen Ausdrucks „Öffnung des Brunnens“ sinngemäß wiedergegeben.
