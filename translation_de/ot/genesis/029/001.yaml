lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: Dann brach Jakob auf
  rationale: Die hebräische Wendung bedeutet wörtlich, dass Jakob »seine Füße erhob«; idiomatisch bezeichnet sie hier das entschlossene Weiterziehen. »Brach auf« gibt den Sinn in natürlichem Deutsch wieder.
- source_word: אַרְצָה בְנֵי קֶדֶם
  choice: in das Land der Söhne des Ostens
  rationale: Bewahrt die konkrete hebräische Bezeichnung בְּנֵי קֶדֶם und damit ihre mögliche ethnisch-geografische Weite, statt sie enger als bloßes »Ostland« oder allgemeiner als »Menschen des Ostens« wiederzugeben.
