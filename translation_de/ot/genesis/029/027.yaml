  register: Modernes, würdevolles Standarddeutsch. Die passive Form in der Hauptzeile wahrt die grammatische Mehrdeutigkeit des Hebräischen; die Fußnote nennt die kontextuell naheliegende aktive Wiedergabe. Der kulturelle Ausdruck „Hochzeitswoche“ wird zur unmittelbaren Verständlichkeit verwendet und zugleich wörtlich erläutert.
