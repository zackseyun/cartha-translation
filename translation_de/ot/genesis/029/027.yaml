  terminology: „Hochzeitswoche“, „Dienst“ und „Dienst leisten“ sind hier tragfähige Begriffe. Die Fußnote zu „dienen“ beziehungsweise „arbeiten“ hält die lexikalische Spannweite von עבד transparent. Die Bezeichnung „dieser Frau“ dient lediglich der nötigen Referenzklärung auf Lea und führt keine theologische oder konfessionelle Deutung ein.
