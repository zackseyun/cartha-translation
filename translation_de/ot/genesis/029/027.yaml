  source_fidelity: Die Übersetzung gibt den Imperativ מַלֵּא angemessen wieder und versteht שְׁבֻעַ זֹאת im erzählerischen Kontext zutreffend als Hochzeitswoche Leas. Die passive Wiedergabe „wird dir … gegeben“ bewahrt die formal dritte feminine Singularform von וְנִתְּנָה, ohne die kontextuelle Verheißung Labans zu verfälschen. „Für den Dienst, den du mir … leisten wirst“ bildet die bedingende Gegenleistung von בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי sachgerecht ab. „Noch weitere sieben Jahre“ gibt die additive und fortführende Zeitangabe wieder.
