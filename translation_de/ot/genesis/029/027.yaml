source:
  edition: WLC
  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: de
  text: Vollende die Hochzeitswoche dieser Frau[a]; dann wird dir auch diese gegeben[b] – für den Dienst, den du mir noch weitere sieben Jahre leisten wirst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vollende die Woche dieser.“ Gemeint ist die damals übliche Hochzeitswoche.'
    reason: cultural_note
  - marker: b
    text: 'Oder sinngemäß: „dann werden wir dir auch diese geben“. Die hebräische Form steht formal in der dritten Person Singular feminin.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für die Arbeit, die du noch weitere sieben Jahre bei mir verrichten wirst“. Das hebräische Verb kann je nach Zusammenhang „dienen“ oder „arbeiten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Vollende
  rationale: Der Imperativ fordert Jakob auf, den festgelegten Zeitraum vollständig zu Ende zu bringen. „Vollende“ bewahrt den Aufforderungscharakter und passt würdevoll zu einer Hochzeitswoche.
- source_word: שְׁבֻעַ זֹאת
  choice: die Hochzeitswoche dieser Frau
  rationale: Wörtlich steht „die Woche dieser“. Im Zusammenhang bezeichnet שְׁבֻעַ die übliche siebentägige Hochzeitsfeier, und das feminine זֹאת verweist auf Lea. Die explizite Wiedergabe mit „Frau“ macht diesen Bezug im Deutschen verständlich.
- source_word: וְנִתְּנָה לְךָ
  choice: dann wird dir auch diese gegeben
  rationale: Die formal feminine Singularform wird passivisch wiedergegeben. So bleibt die grammatische Gestalt des Hebräischen sichtbar, ohne Labans inhaltliches Versprechen zu verdunkeln.
- source_word: גַּם אֶת זֹאת
  choice: auch diese
  rationale: Die Wendung verweist auf die andere Tochter, Rahel, und bewahrt den demonstrativen sowie additiven Nachdruck knapp und natürlich.
- source_word: בַּעֲבֹדָה
  choice: für den Dienst
  rationale: Die Präposition mit עֲבֹדָה bezeichnet hier die Gegenleistung beziehungsweise Bedingung der Vereinbarung. „Für den Dienst“ erhält zugleich die Wortverbindung mit dem folgenden Verb עבד.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: den du mir … leisten wirst
  rationale: עבד kann „arbeiten“ oder „dienen“ bedeuten. „Dienst leisten“ ist im Deutschen für das Arbeitsverhältnis natürlich; „mir“ gibt die kontextuelle Richtung wieder, obwohl עִמָּדִי formal „bei/mit mir“ lautet.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: noch weitere sieben Jahre
  rationale: Die Formulierung gibt sowohl den Zusatz durch עוֹד als auch die weiteren, gesonderten sieben Jahre durch אֲחֵרוֹת wieder.
theological_decisions: []
