  text: עוֹדֶ֖/נּוּ מְדַבֵּ֣ר עִמָּ֑/ם וְ/רָחֵ֣ל בָּ֗אָה עִם הַ/צֹּאן֙ אֲשֶׁ֣ר לְ/אָבִ֔י/הָ כִּ֥י רֹעָ֖ה הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: de
  text: Während er noch mit ihnen redete, kam Rahel mit der Herde ihres Vaters, denn sie war Hirtin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Während er noch … redete
  rationale: Die Verbindung aus עוֹדֶנּוּ und Partizip bezeichnet eine noch andauernde Handlung; die deutsche Konstruktion gibt die zeitliche Überschneidung natürlich wieder.
- source_word: עִמָּם
  choice: mit ihnen
  rationale: Entspricht der Präposition mit Suffix und verweist auf die zuvor angesprochenen Hirten.
- source_word: וְרָחֵל בָּאָה
  choice: kam Rahel
  rationale: Das Verb בוא führt die Erzählung mit Rahels Eintreffen weiter; „kam“ ist hier schlicht und idiomatisch.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: mit der Herde ihres Vaters
  rationale: Die Relativkonstruktion bezeichnet die Zugehörigkeit der Herde zum Vater; der deutsche Genitiv bewahrt den Sinn in natürlicher Form.
- source_word: כִּי
  choice: denn
  rationale: Leitet die erzählerische Begründung dafür ein, weshalb Rahel mit der Herde kam.
- source_word: רֹעָה הִוא
  choice: sie war Hirtin
  rationale: Die feminine Form bezeichnet Rahels Aufgabe beziehungsweise Beruf. „Hirtin“ bildet Geschlecht und Rollenbezeichnung im Deutschen klar und knapp ab.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Redete“ hält einen leicht gehobenen biblischen Erzählton, ohne altertümlich zu wirken; „Hirtin“ ist die direkte und heute verständliche feminine Rollenbezeichnung.
