  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: de
  text: Da versammelte Laban alle Männer des Ortes und veranstaltete ein Festmahl.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Leute des Ortes“. Wörtlicher steht im Hebräischen „alle Männer des Ortes“; wahrscheinlich sind die männlichen Ortsbewohner gemeint, die zur Hochzeitsfeier eingeladen wurden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ein festliches Mahl und kann einschließen, dass dabei Wein oder andere Getränke getrunken wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אסף bezeichnet hier das Zusammenbringen von Menschen. „Versammelte“ ist im Deutschen natürlich und gibt die konkrete Handlung präzise wieder.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: alle Männer des Ortes
  rationale: אַנְשֵׁי ist die maskuline Plural-Konstruktform von אִישׁ. Die Wiedergabe bewahrt die männliche Form und lässt zugleich offen, um welche Art von Ort oder Siedlung es sich handelt.
- source_word: וַיַּעַשׂ
  choice: veranstaltete
  rationale: עשה bedeutet allgemein „tun, machen“. In Verbindung mit einem Festmahl entspricht „veranstaltete“ natürlichem modernem Deutsch und beschreibt idiomatisch, dass Laban das Mahl ausrichtete.
- source_word: מִשְׁתֶּה
  choice: ein Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein festliches Mahl beziehungsweise Gelage, bei dem typischerweise auch getrunken wurde. „Festmahl“ passt zum Hochzeitszusammenhang, ohne den Trinkaspekt stärker hervorzuheben als der Kontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ führt die nächste Handlung der Erzählung flüssig fort; „veranstaltete ein Festmahl“ ist idiomatischer als das formal nähere „machte ein Festmahl“.
