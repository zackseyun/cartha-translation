  text: וַ/יֹּ֤אמֶר ל/וֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה וַ/יֵּ֥שֶׁב עִמּ֖/וֹ חֹ֥דֶשׁ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: de
  text: 'Da sagte Laban zu ihm: „Du bist wahrhaftig mein Gebein und mein Fleisch.“[a] Und Jakob blieb einen Monat lang bei ihm.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mein Gebein und mein Fleisch“; eine hebräische Wendung für einen nahen Verwandten.'
    reason: cultural_note
  - marker: b
    text: Die hebräische Wendung kann auch mit „einen vollen Monat“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: אַךְ
  choice: wahrhaftig
  rationale: אַךְ bekräftigt hier Labans Feststellung der Verwandtschaft und ist nicht einschränkend im Sinn von „nur“ zu verstehen.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mein Gebein und mein Fleisch
  rationale: Die wörtliche Bildsprache der hebräischen Verwandtschaftsformel bleibt erhalten. „Gebein“ ist im heutigen Deutsch gehoben, aber verständlich und wahrt den biblischen Anklang.
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: Und Jakob blieb ... bei ihm
  rationale: ישׁב bezeichnet hier den zeitweiligen Aufenthalt bei Laban. Der Name „Jakob“ verdeutlicht den Bezug des im Hebräischen nur aus dem Zusammenhang erkennbaren Subjekts.
- source_word: חֹדֶשׁ יָמִים
  choice: einen Monat lang
  rationale: Die hebräische Zeitangabe wird im Deutschen idiomatisch als Dauer ausgedrückt; die Wendung kann zugleich den Gedanken eines ganzen Monats tragen.
