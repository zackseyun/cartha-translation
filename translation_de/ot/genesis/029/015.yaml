base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: de
  text: 'Da sagte Laban zu Jakob[a]: »Nur weil du mein Verwandter bist, sollst du etwa umsonst für mich arbeiten? Sag mir, wie hoch dein Lohn sein soll.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mein Bruder«; hier im weiteren Sinn von »Verwandter« gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Nur weil
  rationale: Die Verbindung leitet den Grund der rhetorischen Frage ein. »Nur weil« gibt natürlich wieder, dass die Verwandtschaft kein Grund für unbezahlte Arbeit sein soll.
- source_word: אָחִי
  choice: mein Verwandter
  rationale: אָחִי bedeutet wörtlich »mein Bruder«, bezeichnet hier aber den weiteren Verwandtschaftsgrad; Jakob ist Labans Neffe.
- source_word: וַעֲבַדְתַּנִי
  choice: sollst du mir etwa dienen
  rationale: עבד bezeichnet hier Arbeit bzw. Dienst für Laban. Das rhetorische »sollst du … etwa« entspricht dem Zusammenhang; »dienen« bewahrt zugleich den breiteren Bedeutungsumfang des hebräischen Verbs.
- source_word: חִנָּם
  choice: umsonst
  rationale: Das Wort bezeichnet hier Arbeit ohne Entlohnung; »umsonst« ist im Deutschen idiomatisch und wird durch die anschließende Frage nach dem Lohn eindeutig.
- source_word: הַגִּידָה לִּי
  choice: Sag mir
  rationale: Die Aufforderung mit indirektem Objekt wird in natürlichem modernem Deutsch knapp und treffend wiedergegeben.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: welchen Lohn du haben möchtest
  rationale: מַשְׂכֹּרֶת bezeichnet Lohn oder Entgelt. Die Formulierung gibt die im Kontext beabsichtigte Festlegung der Vergütung als natürliche indirekte Frage wieder, ohne ein bereits bestehendes Lohnverhältnis vorauszusetzen.
theological_decisions: []
