  terminology: »Verwandter« ist für אָחִי im gegebenen Verwandtschaftsverhältnis angemessen; die Fußnote bewahrt die wörtliche Lesart »mein Bruder«. »Lohn« trifft מַשְׂכֻּרְתֶּךָ präzise. »Für mich arbeiten« ist im Arbeits- und Lohnkontext unmittelbarer und weniger potenziell missverständlich als »mir dienen«.
