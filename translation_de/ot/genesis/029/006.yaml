  terminology: „Rahel“ entspricht der etablierten deutschen Namensform; „Herde“ gibt צֹאן als Kollektivbegriff für Kleinvieh angemessen wieder. „Geht es ihm gut?“ und „Ihm geht es gut“ treffen die hier gemeinte Bedeutung von שָׁלוֹם.
