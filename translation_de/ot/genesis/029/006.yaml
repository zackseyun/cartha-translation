  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: de
  text: 'Er fragte sie: „Geht es ihm gut?“ Sie antworteten: „Ihm geht es gut. Und sieh, seine Tochter Rahel kommt mit der Herde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Geht es ihm gut?
  rationale: שָׁלוֹם bezeichnet hier Labans Wohlergehen. Die deutsche Wendung ist natürlich und gibt die Frage nach seinem Befinden präzise wieder.
- source_word: שָׁלוֹם
  choice: Ja, es geht ihm gut
  rationale: Die knappe hebräische Antwort bestätigt Labans Wohlergehen. „Ja“ und „es geht ihm gut“ ergänzen im Deutschen das zum natürlichen Verständnis Erforderliche.
- source_word: וְהִנֵּה
  choice: Sieh nur, da
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die unmittelbar sichtbare Ankunft Rahels. „Sieh nur, da“ bewahrt diese hinweisende Kraft in gegenwärtigem, würdigem Deutsch.
- source_word: רָחֵל
  choice: Rahel
  rationale: Der Personenname wird nach etablierter deutscher Bibeltradition als „Rahel“ wiedergegeben.
- source_word: בִּתּוֹ
  choice: seine Tochter
  rationale: Das Suffix bezieht sich auf Laban und kennzeichnet Rahel ausdrücklich als dessen Tochter.
- source_word: בָּאָה
  choice: kommt
  rationale: Die Form beschreibt die gerade sichtbare, gegenwärtige Bewegung Rahels; das deutsche Präsens passt zum unmittelbaren Hinweis mit הִנֵּה.
- source_word: עִם הַצֹּאן
  choice: mit der Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, insbesondere Schafe und Ziegen. „Herde“ wahrt diesen weiteren Sinn besser als „Schafe“.
