base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: de
  text: 'Und sie wurde wieder schwanger und gebar einen Sohn. Sie sagte: »Nun, dieses Mal wird sich mein Mann mir anschließen,[a] denn ich habe ihm drei Söhne geboren.« Darum wurde er Levi genannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch »sich verbinden« oder »sich zugesellen« bedeuten und klingt ähnlich wie der Name Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Und sie wurde wieder schwanger
  rationale: Gibt הרה und עוֹד in natürlichem modernem Deutsch wieder und hält den erneuten Vorgang ausdrücklich fest.
- source_word: וַתֵּלֶד בֵּן
  choice: und gebar einen Sohn
  rationale: Die knappe, würdige deutsche Erzählform entspricht der üblichen Geburtsformel.
- source_word: עַתָּה הַפַּעַם
  choice: Nun, dieses Mal
  rationale: Bewahrt beide hervorhebenden Elemente und lässt Leas gesteigerte Hoffnung erkennen.
- source_word: יִלָּוֶה ... אֵלַי
  choice: wird sich ... mir anschließen
  rationale: Das reflexive »sich anschließen« gibt den Niphal und die Richtung zu Lea hin wieder; zugleich bleibt die Bedeutungsverbindung zum Namen Levi erkennbar.
- source_word: אִישִׁי
  choice: mein Mann
  rationale: Im ehelichen Zusammenhang ist dies die natürliche deutsche Entsprechung.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: denn ich habe ihm drei Söhne geboren
  rationale: Bewahrt Begründung, Dativbezug und Gegenwartsrelevanz der vollendeten Handlung.
- source_word: עַל כֵּן קָרָא שְׁמוֹ
  choice: Darum nannte man ihn
  rationale: Das unpersönliche »man« wahrt die im Hebräischen nicht ausdrücklich genannte Identität des Benennenden und klingt im Deutschen natürlicher als eine Passivformel.
- source_word: לֵוִי
  choice: Levi
  rationale: Verwendet die geläufige deutsche Namensform und bewahrt den hebräischen Namen.
theological_decisions:
- issue: Wortspiel zwischen יִלָּוֶה und לֵוִי
  choice: »wird sich mein Mann mir anschließen« im Haupttext; Erläuterung des Wortspiels in der Fußnote
  alternative: »wird sich mein Mann mit mir verbinden« oder »wird mein Mann mir zugetan sein«
  rationale: »Sich anschließen« bewahrt die Grundbedeutung von לוה, ohne Leas Hoffnung psychologisch stärker festzulegen, als der hebräische Text es tut. Die Fußnote macht das im Deutschen nicht vollständig nachbildbare Klangspiel transparent.
- issue: Nicht genannter Handelnder bei קָרָא
  choice: 'unpersönlich: »nannte man ihn«'
  alternative: »sie nannte ihn« oder »er nannte ihn«
  rationale: Das maskuline Singularverb nennt kein ausdrückliches Subjekt. Die deutsche unpersönliche Form vermeidet eine unbelegte Festlegung auf Lea oder Jakob.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und emotional nachvollziehbar; die syntaktische und semantische Mehrdeutigkeit der Namensgebung wird nicht voreilig aufgelöst.
