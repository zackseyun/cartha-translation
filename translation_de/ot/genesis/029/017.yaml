  text: וְ/עֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְ/רָחֵל֙ הָֽיְתָ֔ה יְפַת תֹּ֖אַר וִ/יפַ֥ת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: de
  text: Leas Augen waren zart[a], Rahel aber war schön von Gestalt und schön anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weich«, »sanft« oder »schwach«. Das hebräische Adjektiv kann Weichheit oder Zartheit bezeichnen; die genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Augen
  rationale: Der hebräische Konstruktplural bezeichnet ausdrücklich Leas Augen, nicht ihren allgemeinen Anblick.
- source_word: רַכּוֹת
  choice: sanft
  rationale: Das Adjektiv bezeichnet grundlegend etwas Weiches, Zartes oder Sanftes. »Sanft« bewahrt im Deutschen die positive oder neutrale Deutungsmöglichkeit, ohne die unsichere Nuance vorschnell als körperliche Schwäche festzulegen.
- source_word: יְפַת תֹּאַר
  choice: schön von Gestalt
  rationale: Die Wendung beschreibt Rahels körperliche Form oder Figur. Die gewählte Formulierung ist würdig, verständlich und bleibt nah am Hebräischen.
- source_word: וִיפַת מַרְאֶה
  choice: schön anzusehen
  rationale: מַרְאֶה bezeichnet die sichtbare Erscheinung. »Schön anzusehen« unterscheidet diesen Aspekt von der zuvor genannten Gestalt und gibt die zweiteilige Beschreibung natürlich wieder.
- source_word: וְ
  choice: aber
  rationale: Die formal koordinierende Konjunktion stellt Lea und Rahel hier einander gegenüber; »aber« macht diesen kontextuellen Kontrast im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von »schön« bildet die parallele hebräische Beschreibung ab, während »von Gestalt« und »anzusehen« deren zwei Aspekte unterscheidet.
