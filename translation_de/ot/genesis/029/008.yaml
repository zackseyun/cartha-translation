source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: de
  text: 'Sie sagten: „Wir können das erst, wenn alle Herden zusammengekommen sind und man den Stein von der Öffnung des Brunnens weggerollt hat; dann tränken wir die Schafe[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kleinvieh“. Das hebräische Wort kann kollektiv Schafe und Ziegen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נוּכַל עַד אֲשֶׁר
  choice: Wir können das erst, wenn
  rationale: Die deutsche Konstruktion gibt die wörtliche Verneinung „wir können nicht, bis“ idiomatisch wieder, ohne die ausgesagte Unmöglichkeit vor Eintritt der Bedingung abzuschwächen.
- source_word: יֵאָסְפוּ כָּל הָעֲדָרִים
  choice: alle Herden zusammengekommen sind
  rationale: Das Nifal von אסף bezeichnet hier das Zusammenkommen beziehungsweise Zusammengebrachtwerden der Herden. Die Formulierung lässt offen, ob der Vorgang aktiv oder passiv veranlasst wird.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: und man den Stein … weggerollt hat
  rationale: גלל bedeutet „rollen“. Das unpersönliche „man“ gibt das nicht ausdrücklich benannte Subjekt der 3. Person Plural im Deutschen natürlich wieder; „wegrollen“ verdeutlicht die durch מֵעַל bezeichnete Entfernung.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: von der Öffnung des Brunnens
  rationale: פִּי heißt wörtlich „Mund“, bezeichnet hier aber idiomatisch die Brunnenöffnung. „Öffnung“ ist im modernen Deutschen klar und bewahrt den räumlichen Sinn.
- source_word: וְהִשְׁקִינוּ
  choice: dann tränken wir
  rationale: Der Hifil von שקה bedeutet, Tieren Wasser zu geben. „Tränken“ ist die natürliche deutsche Bezeichnung; „dann“ macht die Abfolge deutlich.
- source_word: הַצֹּאן
  choice: die Schafe
  rationale: צאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen. „Schafe“ passt zum Kontext, während die mögliche weitere Bedeutung in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konditionale Zeitfolge wird idiomatisch mit „erst, wenn“ ausgedrückt; das unbestimmte handelnde Subjekt beim Wegrollen des Steins bleibt durch „man“ unbestimmt.
