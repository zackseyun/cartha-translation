  source_fidelity: 'Die Übersetzung gibt die Abfolge und Aussage des Hebräischen zuverlässig wieder: Die Sprecher können erst handeln, wenn sämtliche Herden versammelt sind und der Stein von der Brunnenöffnung entfernt wurde; anschließend tränken sie das Kleinvieh. Das unpersönliche „man“ ist eine natürliche deutsche Wiedergabe des im Kontext nicht näher bestimmten pluralischen Handelnden.'
  naturalness: Modernes, gut verständliches Standarddeutsch. „Wir können das erst, wenn …; dann tränken wir die Schafe“ bildet die im Hebräischen ausgedrückte Bedingung und Folge idiomatisch ab. Das Semikolon ist hier zulässig, da es die nachfolgende selbstständige Folgerung abtrennt.
  terminology: „Herden“ für עֲדָרִים, „Öffnung des Brunnens“ für die idiomatische hebräische Wendung „Mund des Brunnens“ und „tränken“ für den Hifil von שקה sind treffend. „Schafe“ ist im Kontext vertretbar; die Fußnote bewahrt den weiteren Bedeutungsumfang von צאן als Kleinvieh einschließlich Ziegen.
