  source_fidelity: 'Der Haupttext gibt die Abfolge und die zentralen hebräischen Ausdrücke zutreffend wieder: Abschluss des Anweisens, Bewegung der Füße zum Bett, Verscheiden und das idiomatische Versammeltwerden zu seinem Volk. Eine kleine stilistisch-semantische Präzisierung ist bei וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה angebracht: »auf das Bett zog« ist verständlich, aber »an sich zog und aufs Bett legte« bzw. »auf das Bett zog« kann die Sammelbewegung weniger klar abbilden. »Zog seine Füße aufs Bett« ist jedoch idiomatisch und ausreichend. Die Fußnote a enthält dagegen eine ungenaue wörtliche Angabe: אֶל bedeutet hier »zu/an/auf ... hin«, nicht schlicht die ungewöhnliche deutsche Konstruktion »zum Bett« als feste wörtliche Entsprechung; zudem ist die erläuternde Behauptung »wieder« nicht im Text markiert.'
