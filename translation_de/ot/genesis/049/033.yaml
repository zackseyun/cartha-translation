base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: de
  text: Als Jakob damit fertig war, seinen Söhnen Anweisungen zu geben, zog er seine Füße aufs Bett[a], verschied und wurde zu seinem Volk versammelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sammelte seine Füße zum Bett hin«. Gemeint ist, dass Jakob seine Füße zu sich zog und aufs Bett legte.'
    reason: lexical_alternative
  - marker: b
    text: »Zu seinem Volk versammelt werden« ist eine hebräische Wendung im Zusammenhang mit dem Tod. Sie ist nicht einfach mit der Bestattung gleichzusetzen; Jakobs Bestattung wird erst im folgenden Kapitel berichtet.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: damit fertig war
  rationale: Die Wendung gibt den Abschluss von Jakobs vorausgehender Rede natürlich wieder und bewahrt den erzählerischen Ablauf.
- source_word: לְצַוֹּת
  choice: Anweisungen zu geben
  rationale: צוה kann »befehlen«, »anweisen« oder »auftragen« bedeuten. Im Zusammenhang mit Jakobs feierlichen letzten Worten ist »Anweisungen geben« natürlich und wahrt die Autorität des Ausdrucks, ohne den gesamten vorhergehenden Segen auf Befehle zu verengen.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Der hebräische Text bezeichnet ausdrücklich Jakobs Söhne, die im unmittelbaren Zusammenhang angesprochen werden.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: zog er seine Füße auf das Bett
  rationale: Wörtlich steht hier »sammelte er seine Füße zum Bett«. Die gewählte Formulierung gibt die gemeinte Körperbewegung in natürlichem Deutsch wieder und lässt durch die Fußnote das hebräische Bild erkennen.
- source_word: הַמִּטָּה
  choice: das Bett
  rationale: מִטָּה kann Bett oder Liege bezeichnen; »Bett« ist in dieser Sterbeszene die klarste und geläufigste Wiedergabe.
- source_word: וַיִּגְוַע
  choice: verschied
  rationale: גוע bezeichnet das Verscheiden beziehungsweise Aushauchen des Lebens. »Verschied« bewahrt diese Nuance und unterscheidet die Aussage von der folgenden idiomatischen Wendung.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: wurde zu seinem Volk versammelt
  rationale: Die wörtlich-nahe Wiedergabe erhält die wiederkehrende hebräische Todesformel und ihre Bedeutungsspannung, statt sie auf Tod oder Bestattung zu reduzieren.
theological_decisions:
- issue: Bedeutung von »zu seinem Volk versammelt«
  choice: Die hebräische Wendung bleibt im Haupttext erhalten und wird nicht auf eine Bestattung reduziert.
  alternative: »wurde bei seinen Vorfahren bestattet« oder »vereinigte sich nach dem Tod mit seinen Vorfahren«
  rationale: Jakobs Bestattung erfolgt erst später. Die Formulierung ist daher mehr als eine bloße Bestattungsnotiz; zugleich legt der Text hier nicht im Einzelnen fest, was die Sammlung zu seinem Volk bedeutet. Die wörtlich-nahe Wiedergabe bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch. »Verschied« ist leicht gehoben, aber allgemein verständlich und entspricht der besonderen Nuance von גוע.
