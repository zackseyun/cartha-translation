  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: de
  text: Dan wird sein Volk richten wie einer der Stämme Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dan wird seinem Volk Recht schaffen.“ Das hebräische Verb kann sowohl richten und regieren als auch für das Recht eines Menschen eintreten oder ihm zu seinem Recht verhelfen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dan
  rationale: Der Eigenname des Sohnes Jakobs und des nach ihm benannten Stammes wird in der üblichen deutschen Form wiedergegeben. Der Anklang an das folgende Verb דין bleibt im Deutschen nur teilweise erkennbar.
- source_word: יָדִין
  choice: wird … Recht schaffen
  rationale: Das Qal-Imperfekt von דין ist hier zukunftsbezogen. „Recht schaffen“ bewahrt die Spannweite zwischen richten, Recht sprechen und für jemanden eintreten, ohne die Aussage auf bloßes Verurteilen einzuengen.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: עם mit Suffix der 3. Person Singular bedeutet wörtlich „sein Volk“. Gemeint sind im Zusammenhang wohl die Menschen, die zu Dan beziehungsweise seinem Stamm gehören.
- source_word: כְּאַחַד
  choice: wie einer
  rationale: Die Verbindung aus vergleichendem כ und אחד bezeichnet Dan als einen unter den Stämmen Israels und betont seine gleichberechtigte Zugehörigkeit.
- source_word: שִׁבְטֵי
  choice: der Stämme
  rationale: Der Status constructus Plural von שֵׁבֶט bezeichnet hier eindeutig die Stämme Israels, nicht „Stäbe“ oder „Zepter“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von Dans Tätigkeit im Segen
  choice: Dan wird seinem Volk Recht schaffen und dabei als vollwertiger Stamm Israels handeln.
  alternative: Dan wird sein Volk richten beziehungsweise regieren.
  rationale: דין kann richten, Recht sprechen, regieren oder jemandem zu seinem Recht verhelfen bedeuten. „Recht schaffen“ hält die rechtliche und gegebenenfalls schützende Dimension offen; die Fußnote nennt die direktere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt knapp und poetisch; „Recht schaffen“ ist allgemein verständlich und erhält die Bedeutungsbreite des hebräischen Verbs.
