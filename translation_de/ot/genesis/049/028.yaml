base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: de
  text: 'Dies alles sind die zwölf Stämme Israels, und dies ist es, was ihr Vater zu ihnen sagte; er segnete sie: Jeden segnete er nach seinem Segen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jeden nach seinem Segen segnete er sie.“'
    reason: Die Fußnote dokumentiert die hebräische distributive Wortstellung und die Wiederholung von „segnen“.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Dies alles
  rationale: Gibt die zusammenfassende demonstrative Wendung knapp und natürlich wieder.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: die zwölf Stämme Israels
  rationale: Die deutsche Wortstellung verbindet die Zahl idiomatisch mit dem bestimmten Ausdruck und wahrt die Apposition des Hebräischen.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Das ist es, was ihr Vater zu ihnen sagte
  rationale: „Sagte“ ist im modernen Standarddeutsch natürlicher als „sprach“, während „zu ihnen“ die Zielrichtung von לָהֶם erhält.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: als er sie segnete
  rationale: Die temporale Unterordnung gibt den Zusammenhang mit der vorangehenden Rede flüssig wieder, ohne den Segensakt auszulassen.
- source_word: אִישׁ
  choice: Jeden
  rationale: Die distributive Bedeutung ist im Kontext gemeint; „jeden Mann“ wäre unnötig schwerfällig.
- source_word: כְּבִרְכָתוֹ
  choice: mit dem Segen, der ihm entsprach
  rationale: Gibt „gemäß seinem Segen“ verständlich wieder und bewahrt, dass der Segen jeweils auf den Einzelnen bezogen ist.
- source_word: בֵּרַךְ אֹתָם
  choice: segnete er
  rationale: Erhält die Wiederholung der Wurzel ברך und den abschließenden zusammenfassenden Charakter.
theological_decisions:
- issue: Verhältnis der einzelnen Segenssprüche zu den Söhnen beziehungsweise Stämmen
  choice: „mit dem Segen, der ihm entsprach“
  alternative: „gemäß seinem Segen“
  rationale: Die Formulierung bezeichnet eine je eigene Zuordnung, ohne festzulegen, ob jeder Ausspruch ausschließlich Verheißung, Lob oder auch prophetische Charakterisierung ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung von „segnen“ bleibt erhalten; die abschließende Wendung wird für natürliche Verständlichkeit leicht idiomatisiert.
