  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Jakob ruft seine Söhne herbei, fordert sie zur Versammlung auf und kündigt an, ihnen mitzuteilen, was ihnen künftig begegnen wird. Die Zeitformel בְּאַחֲרִית הַיָּמִים bleibt im Haupttext zutreffend offen; die Fußnote bewahrt ihre mögliche stärker eschatologische Nuance.'
  naturalness: „In künftigen Tagen“ ist verständlich, wirkt im heutigen Standarddeutsch jedoch etwas ungebräuchlich und kann nach einem nahen, kalendarisch bestimmten Zeitraum klingen. „In späteren Tagen“ ist idiomatischer und bildet zugleich die wörtliche Grundbedeutung von אַחֲרִית besser ab. Der übrige Satz ist flüssig und angemessen würdevoll.
  terminology: „Jakob“, „seine Söhne“, „Versammelt euch“, „verkünden“ und „widerfahren“ sind kontextgerecht. „Verkünden“ und „widerfahren“ haben einen gehobenen, aber noch modernen erzählerisch-prophetischen Registerwert. Die Fußnote sollte die Alternativen als Übersetzungsmöglichkeiten, nicht als voneinander unabhängig belegte Zeitstufen, kenntlich machen.
