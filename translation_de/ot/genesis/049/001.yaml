  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: de
  text: 'Dann rief Jakob seine Söhne zu sich und sagte: »Versammelt euch, und ich will euch verkünden, was euch in späteren Tagen[a] widerfahren wird.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Ende der Tage« oder »in den letzten Tagen«. Die hebräische Wendung kann allgemein auf eine spätere Zeit verweisen, in manchen Zusammenhängen aber auch einen endzeitlichen Sinn haben.'
    reason: Bewahrt formnähere und möglicherweise eschatologische Wiedergaben der mehrdeutigen hebräischen Wendung.
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב אֶל בָּנָיו
  choice: Dann rief Jakob seine Söhne zu sich
  rationale: קרא אל bezeichnet hier das Herbeirufen. »Zu sich rufen« ist im modernen Deutschen natürlich und gibt die Zielrichtung der Präposition אֶל wieder; בָּנָיו meint im Kontext ausdrücklich Jakobs Söhne.
- source_word: הֵאָסְפוּ
  choice: Versammelt euch
  rationale: Der Nifal-Imperativ von אסף fordert die Söhne auf, zusammenzukommen. Die reflexive deutsche Form bewahrt sowohl den Sinn als auch den feierlichen Ton.
- source_word: וְאַגִּידָה לָכֶם
  choice: und ich will euch verkünden
  rationale: Die Kohortativform drückt Jakobs Absicht aus. »Ich will euch verkünden« bewahrt diese Willensnuance und passt zum feierlichen Charakter der folgenden Aussprüche.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: was euch … widerfahren wird
  rationale: קרה bedeutet in dieser Wendung »geschehen, widerfahren«. »Widerfahren« ist präzise, verständlich und gibt wieder, dass das Geschehen die Angesprochenen treffen wird.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: in künftigen Tagen
  rationale: Die Wendung blickt auf eine spätere Zeit voraus und kann je nach Kontext auch endzeitliche Bedeutung tragen. »In künftigen Tagen« lässt den Zukunftsbezug offen, ohne die mögliche eschatologische Nuance im Haupttext festzuschreiben; die wörtlichere Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Ob בְּאַחֲרִית הַיָּמִים ausdrücklich endzeitlich wiederzugeben ist
  choice: in künftigen Tagen
  alternative: am Ende der Tage / in den letzten Tagen
  rationale: Im unmittelbaren Zusammenhang kündigt Jakob an, was seinen Söhnen beziehungsweise den aus ihnen hervorgehenden Stämmen künftig widerfahren wird. Die hebräische Wendung kann jedoch auch einen endzeitlichen Klang haben. Der Haupttext vermeidet eine vorschnelle Festlegung, während die Fußnote die formnähere und möglicherweise eschatologische Lesart nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Verkünden« und »widerfahren« tragen dem feierlichen Charakter von Jakobs Rede Rechnung, ohne unnötig altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Zeitangabe.
