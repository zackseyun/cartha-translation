  text: הִקָּבְצ֥וּ וְ/שִׁמְע֖וּ בְּנֵ֣י יַעֲקֹ֑ב וְ/שִׁמְע֖וּ אֶל יִשְׂרָאֵ֥ל אֲבִי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: de
  text: Versammelt euch und hört, ihr Söhne Jakobs; hört auf Israel, euren Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Versammelt euch
  rationale: Der Nifal-Imperativ im Plural fordert die Söhne auf, sich zusammenzufinden. Die reflexive Formulierung gibt die hebräische Verbform knapp und natürlich wieder.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ verlangt aufmerksames Hören. „Hört“ bewahrt zugleich die bewusste Wiederholung des hebräischen Verbs.
- source_word: בְּנֵי יַעֲקֹב
  choice: ihr Söhne Jakobs
  rationale: Der Ausdruck bezeichnet ausdrücklich Jakobs männliche Nachkommen. Das eingefügte „ihr“ kennzeichnet im Deutschen die Anrede natürlich.
- source_word: שִׁמְעוּ אֶל
  choice: hört auf
  rationale: Mit אֶל bezeichnet die zweite Aufforderung das aufmerksame Hören auf die sprechende Person. „Hört auf“ gibt diese Ausrichtung idiomatisch wieder, ohne die Wiederholung des Verbs aufzugeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten und steht poetisch parallel zu „Jakob“.
- source_word: אֲבִיכֶם
  choice: euren Vater
  rationale: Die Apposition identifiziert Israel als den Vater der Angeredeten; der Akkusativ folgt der deutschen Wendung „auf jemanden hören“.
theological_decisions:
- issue: Parallele Verwendung der Namen Jakob und Israel
  choice: 'Beide Namen bleiben unterschieden: „Söhne Jakobs … Israel, euren Vater“'
  alternative: Beide Satzhälften zur Glättung mit demselben Namen wiedergeben
  rationale: Der hebräische Text setzt die beiden Namen bewusst parallel. Die Übersetzung bewahrt diese poetische und mögliche bundestheologische Spannung, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „hört“ und die parallelen Namen bleiben erhalten; die Wortstellung ist für eine mündliche väterliche Aufforderung natürlich.
