source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: de
  text: Verflucht sei ihr Zorn[a], denn er ist heftig, und ihr Grimm, denn er ist hart. Ich werde sie in Jakob verteilen und sie in Israel zerstreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verflucht ist ihr Zorn … und ihr Grimm, denn er ist grausam.“'
    reason: Die hebräische Fluchformel kann als Zustandsaussage oder als Fluchausspruch wiedergegeben werden; קָשָׁתָה kann im Zusammenhang auch „grausam“ bedeuten.
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht sei
  rationale: Das passive Partizip steht prädikativ und formuliert einen Fluch. „Verflucht sei“ bewahrt den Ausspruchscharakter und richtet den Fluch auf die nachfolgend genannten Affekte.
- source_word: אַפָּם
  choice: ihr Zorn
  rationale: Das Substantiv bezeichnet wörtlich auch „Nase/Nasenloch“, ist hier jedoch idiomatisch als Zorn zu verstehen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet jeweils den Fluch und passt zum gehobenen poetischen Stil.
- source_word: עָז
  choice: heftig
  rationale: Das Adjektiv bedeutet „stark, mächtig, heftig“. Bei Zorn bezeichnet „heftig“ dessen zerstörerische Intensität, ohne eine zusätzliche moralische Bewertung einzutragen.
- source_word: וְעֶבְרָתָם
  choice: und ihr Grimm
  rationale: עֶבְרָה bezeichnet überströmende Wut. „Grimm“ ist im Deutschen natürlich, würdevoll und unterscheidet das Wort von אַף („Zorn“).
- source_word: קָשָׁתָה
  choice: ist hart
  rationale: Die feminine Verbform bezieht sich auf עֶבְרָה und drückt Härte bzw. Unerbittlichkeit aus. „Hart“ bleibt quellennah und vermeidet die stärkere interpretierende Festlegung „grausam“.
- source_word: אֲחַלְּקֵם
  choice: Ich werde sie verteilen
  rationale: Das Piel-Imperfekt mit Objektsuffix kündigt an, dass sie innerhalb Jakobs aufgeteilt werden. „Verteilen“ bewahrt den Unterschied zum folgenden „zerstreuen“.
- source_word: בְּיַעֲקֹב
  choice: in Jakob
  rationale: „Jakob“ bezeichnet hier korporativ das von Jakob abstammende Volk. Die direkte Wiedergabe erhält den Parallelismus.
- source_word: וַאֲפִיצֵם
  choice: und sie zerstreuen
  rationale: Das Hiphil bezeichnet das Verursachen einer Zerstreuung. „Zerstreuen“ gibt dieses Gerichtsbild idiomatisch wieder.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die direkte Wiedergabe erhält die poetische Parallele „in Jakob / in Israel“.
theological_decisions:
- issue: Gegenstand des Fluches
  choice: Der Fluch gilt ausdrücklich dem Zorn und Grimm Simeons und Levis, nicht unmittelbar ihren Personen.
  alternative: Simeon und Levi selbst werden verflucht.
  rationale: Im Hebräischen sind אַפָּם und עֶבְרָתָם ausdrücklich die Gegenstände der Fluchaussage. Die Übersetzung bewahrt diese theologisch bedeutsame Unterscheidung.
- issue: Bedeutung von קָשָׁתָה
  choice: „hart“ als formnahe Beschreibung des Grimms
  alternative: „grausam“ als kontextuell-moralische Zuspitzung
  rationale: Der Quellenausdruck bezeichnet Härte oder Schwere. Der Kontext gewalttätigen Grimms lässt „grausam“ zu, erzwingt diese moralisch explizitere Wiedergabe jedoch nicht.
translation_notes:
  register: Poetisch, würdevoll und zugleich in modernem Standarddeutsch verständlich. Die Parallelismen „Zorn/Grimm“ und „in Jakob/in Israel“ sowie der Unterschied zwischen „verteilen“ und „zerstreuen“ bleiben erhalten.
