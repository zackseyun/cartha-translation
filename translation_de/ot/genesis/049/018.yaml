base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: de
  text: Auf deine Rettung warte ich[a], Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf deine Befreiung habe ich gehofft, Jahwe.“ Das hebräische Wort kann „Rettung“ oder „Befreiung“ bedeuten; die Verbform lässt sich auch mit „habe ich gehofft“ wiedergeben.'
    reason: Lexikalische und aspektuelle Alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: auf deine Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung, Befreiung oder Hilfe. „Rettung“ bewahrt hier den umfassenden Sinn; die Präposition ל wird im Deutschen idiomatisch durch die Verbindung „auf … warten“ wiedergegeben.
- source_word: קִוִּיתִי
  choice: warte ich
  rationale: קוה bezeichnet erwartungsvolles Warten und Hoffen. Trotz der hebräischen Perfektform bringt das deutsche Präsens in diesem poetischen Ausruf die fortdauernde Erwartung natürlich zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen JHWH. Die Wiedergabe „Jahwe“ erhält diesen Unterschied gegenüber dem Titel „Herr“.
- issue: Zeitbezug von קִוִּיתִי
  choice: warte ich
  alternative: habe ich gewartet
  rationale: Die Perfektform kann ein bereits bestehendes und bis in die Gegenwart reichendes hoffendes Warten ausdrücken. Das Präsens wahrt den Charakter des eingeschobenen Vertrauensbekenntnisses, ohne einen ausschließlich rückblickenden Sinn festzulegen.
translation_notes:
  register: Kurzer, würdevoller poetischer Ausruf. Die Voranstellung von „Auf deine Rettung“ bewahrt die Betonung des hebräischen Satzes; die direkte Anrede bleibt ohne zusätzliches „o“ im heutigen Standarddeutsch natürlich.
