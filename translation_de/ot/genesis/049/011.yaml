  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: de
  text: 'Er bindet seinen jungen Esel[a] an den Weinstock

    und das Fohlen seiner Eselin an die ausgesuchte Rebe[b].

    Er wäscht sein Gewand in Wein

    und sein Oberkleid im Blut der Trauben.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Eselfohlen“. Das hebräische Wort bezeichnet einen jungen Esel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die edle Rebe“. Das hebräische Wort bezeichnet eine ausgesuchte, hochwertige Rebe.'
    reason: lexical_alternative
  - marker: c
    text: „Blut der Trauben“ ist ein hebräisches poetisches Bild für Traubensaft oder Wein; die Bildsprache wird hier beibehalten.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Er bindet
  rationale: Das qal-Partizip zeichnet die Handlung anschaulich. Im Deutschen gibt ein finites Präsens diese lebendige poetische Szene natürlicher wieder als eine isolierte Partizipialkonstruktion.
- source_word: לַגֶּפֶן
  choice: an den Weinstock
  rationale: גֶּפֶן bezeichnet den Weinstock beziehungsweise die Weinrebe. Der bestimmte Artikel wird gewahrt; „Weinstock“ ist im Deutschen für die Pflanze eindeutig und idiomatisch.
- source_word: עִירֹה
  choice: seinen jungen Esel
  rationale: עִיר bezeichnet einen jungen Esel oder ein Eselfohlen. „Junger Esel“ wahrt die Bedeutung und vermeidet eine unnötige Wiederholung von „Fohlen“ im parallelen Versglied.
- source_word: וְלַשֹּׂרֵקָה
  choice: und … an die Edelrebe
  rationale: שֹׂרֵקָה bezeichnet eine ausgewählte, hochwertige Rebe. „Edelrebe“ vermittelt diese Qualitätsnuance knapp und poetisch.
- source_word: בְּנִי אֲתֹנוֹ
  choice: das Fohlen seiner Eselin
  rationale: Wörtlich steht „der Sohn seiner Eselin“. Die gewählte Formulierung gibt Abstammungsverhältnis, Tierart und weibliches Muttertier natürlich wieder.
- source_word: כִּבֵּס
  choice: Er wäscht
  rationale: Das Perfekt kann in diesem poetischen Segensspruch eine anschaulich dargestellte beziehungsweise vorausblickende Handlung bezeichnen. Das deutsche Präsens bewahrt den Charakter eines lebendigen Bildes, ohne den Zeitbezug enger festzulegen.
- source_word: בַּיַּיִן
  choice: in Wein
  rationale: Die Präposition ב wird räumlich mit „in“ wiedergegeben und erhält so das kühne Bild, nach dem Wein im Überfluss wie Waschwasser verwendet wird.
- source_word: לְבֻשׁוֹ
  choice: sein Gewand
  rationale: לְבוּשׁ bezeichnet Kleidung beziehungsweise ein Gewand. Der Singular entspricht der Form des hebräischen Textes und bildet ein natürliches poetisches Paar mit „Oberkleid“.
- source_word: וּבְדַם עֲנָבִים
  choice: und … im Blut der Trauben
  rationale: Die konkrete hebräische Metapher wird bewahrt, statt sie auf „Traubensaft“ oder „Wein“ zu reduzieren.
- source_word: סוּתוֹ
  choice: sein Oberkleid
  rationale: סוּת bezeichnet ein Kleidungs- oder Hüllgewand und steht parallel zu לְבוּשׁ. „Oberkleid“ bleibt anschaulich, ohne eine nicht belegte genauere Kleidungsart festzulegen.
theological_decisions:
- issue: Messianische oder stammesgeschichtliche Bedeutung des Segens über Juda
  choice: Die Übersetzung belässt es bei dem poetischen Bild außergewöhnlicher Fülle und Vornehmheit.
  alternative: Den Vers ausdrücklich als messianische Weissagung oder ausschließlich als Beschreibung des späteren Wohlstands des Stammes Juda formulieren.
  rationale: Der weitere Juda-Spruch ist theologisch vielfältig gedeutet worden, doch dieser Vers selbst nennt keine Deutung ausdrücklich. Die Übersetzung bewahrt deshalb die Bildsprache, ohne die Spannung zugunsten einer bestimmten Lehrtradition aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen, parallel gebauten Verszeilen. Die üppige und bewusst übersteigerte Bildsprache bleibt erhalten. „Edelrebe“ und „Oberkleid“ geben dem poetischen Register eine gehobene, aber allgemein verständliche Färbung.
