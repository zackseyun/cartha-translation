  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: de
  text: Vom Wein sind seine Augen gerötet,[a] und von der Milch seine Zähne weiß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder vergleichend: „Seine Augen sind dunkler als Wein und seine Zähne weißer als Milch.“ Das seltene hebräische Wort für „gerötet“ kann auch eine dunkle oder glänzende Färbung bezeichnen; zudem kann die Präposition sowohl „von/durch“ als auch „als“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: gerötet
  rationale: Das seltene Adjektiv bezeichnet wahrscheinlich eine rötliche oder dunkel glänzende Erscheinung der Augen. Im Zusammenhang mit dem Weinüberfluss in Vers 11 und angesichts der verwandten Form in Sprüche 23,29 gibt „gerötet“ die naheliegende Bedeutung wieder, ohne Trunkenheit ausdrücklich hinzuzufügen.
- source_word: עֵינַיִם
  choice: Augen
  rationale: Direkte Wiedergabe des hebräischen Dualnomens.
- source_word: מִיָּיִן
  choice: vom Wein
  rationale: מִן wird hier als Angabe der Ursache beziehungsweise Herkunft verstanden. Das passt zum Weinüberfluss des unmittelbaren Zusammenhangs; die mögliche vergleichende Deutung bleibt in der Fußnote erhalten.
- source_word: וּלְבֶן
  choice: und ... weiß
  rationale: Das Adjektiv wird prädikativ wiedergegeben. Die parallele Satzstellung bewahrt die knappe poetische Form.
- source_word: שִׁנַּיִם
  choice: Zähne
  rationale: Direkte Wiedergabe des hebräischen Dualnomens.
- source_word: מֵחָלָב
  choice: von der Milch
  rationale: 'Wie im ersten Halbvers wird מִן kausal beziehungsweise als Herkunftsangabe verstanden: Milch macht die Zähne weiß und steht im Kontext für Überfluss.'
