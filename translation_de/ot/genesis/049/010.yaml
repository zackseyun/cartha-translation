  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: de
  text: Das Zepter wird nicht von Juda weichen, noch wird der Herrscherstab zwischen seinen Füßen verschwinden, bis Schilo kommt[a]; und ihm gilt der Gehorsam der Völker[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis der kommt, dem es zusteht“. Das hebräische Wort Schilo ist schwer zu deuten; es wurde auch als Titel, Ortsname oder als Hinweis auf Tribut verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und bei ihm werden sich die Völker sammeln“ oder „und ihm werden sich die Völker unterwerfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: Im königlich-poetischen Zusammenhang und parallel zu מְחֹקֵק bezeichnet das Wort hier am ehesten das Herrschaftszeichen, nicht den Stamm Juda oder einen gewöhnlichen Stab.
- source_word: מִיהוּדָה
  choice: von Juda
  rationale: Die Präposition bezeichnet Trennung beziehungsweise Ausgangspunkt; „Juda“ ist die im Deutschen eingebürgerte Namensform.
- source_word: מְחֹקֵק
  choice: Herrscherstab
  rationale: Das Wort kann einen Gebietenden oder das Zeichen seiner Herrschaft bezeichnen. Der Parallelismus mit „Zepter“ und die Ortsangabe „zwischen seinen Füßen“ sprechen hier für den Stab als Herrschaftsinsignie.
- source_word: מִבֵּין רַגְלָיו
  choice: zwischen seinen Füßen
  rationale: Das konkrete hebräische Bild bleibt erhalten. Es kann an einen sitzenden Herrscher und möglicherweise auch an Nachkommenschaft denken lassen, wird aber im Haupttext nicht deutend erweitert.
- source_word: עַד כִּי
  choice: bis
  rationale: Die Wortverbindung bezeichnet den Zeitpunkt, bis zu dem die vorherige Aussage gilt; „bis“ ist im Deutschen knapp und idiomatisch.
- source_word: שילה
  choice: Schilo
  rationale: Die hebräische Form ist textlich und semantisch stark umstritten. Der Haupttext folgt der traditionellen Lesung als Eigenname und bewahrt die wichtigsten Alternativen in der Fußnote.
- source_word: וְלוֹ
  choice: ihm
  rationale: Wenn שילה im Haupttext als personale Bezeichnung beziehungsweise Eigenname verstanden wird, liegt der personale Bezug nahe, ohne die Identität dieser Gestalt näher festzulegen.
- source_word: יִקְּהַת
  choice: Gehorsam
  rationale: Das seltene Wort ist umstritten. Im Zusammenhang königlicher Herrschaft gibt „Gehorsam“ die Unterordnung der Völker gut wieder; mögliche Bedeutungen wie „Sammlung“ und „Unterwerfung“ werden in der Fußnote genannt.
- source_word: עַמִּים
  choice: die Völker
  rationale: „Völker“ entspricht unmittelbar dem Plural und wahrt die über Juda hinausreichende ethnische Weite der Aussage.
theological_decisions:
- issue: Identität und Wiedergabe von שילה in einem traditionell messianisch verstandenen Text
  choice: „Schilo“ bleibt im Haupttext als umgeschriebene Namensform stehen, ohne die Gestalt ausdrücklich mit dem Messias gleichzusetzen.
  alternative: „bis der kommt, dem es gehört“; „bis ihm Tribut gebracht wird“; „bis er nach Schilo kommt“
  rationale: So bleibt die schwierige hebräische Lesart sichtbar, ohne eine umstrittene Deutung dogmatisch festzuschreiben. Zugleich bleibt eine messianische Auslegung im größeren biblischen Zusammenhang möglich.
- issue: Königliche beziehungsweise messianische Aussagekraft des Verses
  choice: Die königlichen Bilder werden mit „Zepter“, „Herrscherstab“ und „Gehorsam der Völker“ wiedergegeben, ohne eine weitergehende Lehrformulierung einzufügen.
  alternative: Eine rein dynastisch-politische Wiedergabe oder eine ausdrücklich messianisch-christologische Paraphrase
  rationale: Der hebräische Text verbindet Juda klar mit Herrschaft. Die Übersetzung bewahrt diese Aussage und ihre theologische Spannung, ohne den Bezug im Haupttext über das Gesagte hinaus zu bestimmen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrtem poetischem Parallelismus. „Verschwinden“ vermeidet eine schwer verständliche Ellipse nach „weichen“, während das konkrete Bild „zwischen seinen Füßen“ erhalten bleibt. Die umstrittenen Stellen werden nicht im Haupttext vereindeutigt, sondern knapp in Fußnoten dokumentiert.
