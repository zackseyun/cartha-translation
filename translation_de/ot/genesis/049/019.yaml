  source_fidelity: 'Die Grundbedeutung ist richtig erfasst: Gad wird von einer Räuberschar angegriffen und reagiert seinerseits. Die Wiedergabe „wird ihnen auf den Fersen sein“ schwächt jedoch das ausdrücklich wiederholte Verb גדד („überfallen/angreifen“) im zweiten Halbvers. Eine Wiederholung von „überfallen“ gibt die hebräische Paronomasie und die reziproke Handlung besser wieder. „Von hinten“ ist eine mögliche idiomatische Auslegung von עָקֵב; die wörtliche Bildsprache und die Deutungsunsicherheit sollen in der Anmerkung stehen bleiben.'
  naturalness: „Gad – eine Räuberschar wird ihn überfallen; doch er wird sie von hinten überfallen“ ist modernes, verständliches Standarddeutsch und bewahrt den knappen, poetischen Charakter des Spruchs. Die Wiederholung ist hier stilistisch angemessen, weil sie die absichtliche Wortwiederholung des Hebräischen nachzeichnet.
  terminology: „Gad“ und „Räuberschar“ sind angemessen. „Überfallen“ eignet sich für beide Formen von גדד besser als der Wechsel zu „auf den Fersen sein“. Die Anmerkung wird präzisiert, damit sie sowohl die dreiwortige Laut- und Wortspielreihe als auch die Mehrdeutigkeit von עָקֵב korrekt dokumentiert.
