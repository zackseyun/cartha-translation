  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: de
  text: Gad[a] – eine Räuberschar wird ihn überfallen; doch er wird sie von hinten überfallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht ein Wortspiel mit „Gad“, „Räuberschar“ und den beiden Verben für „überfallen“ (gad / gedud / yegudennu / yagud). Wörtlich lautet der Schluss „er wird [an] der Ferse überfallen“; dies kann einen Angriff von hinten oder eine Verfolgung im Rücken bezeichnen.
    reason: Das Wortspiel lässt sich im Deutschen nicht vollständig nachbilden. Die Fußnote bewahrt außerdem die mit „Ferse“ verbundene Mehrdeutigkeit der hebräischen Schlusswendung.
lexical_decisions:
- source_word: גָּד
  choice: Gad
  rationale: Der Eigenname des Sohnes Jakobs und des nach ihm benannten Stammes wird in der geläufigen deutschen Form wiedergegeben.
- source_word: גְּדוּד
  choice: eine Räuberschar
  rationale: Das Substantiv bezeichnet eine Schar, die zu feindlichen Streifzügen oder Überfällen auszieht. „Räuberschar“ ist im Deutschen klar und bewahrt mit „überfallen“ zumindest einen Teil des hebräischen Wortspiels.
- source_word: יְגוּדֶנּוּ
  choice: wird ihn überfallen
  rationale: Das Verb beschreibt hier, im Zusammenhang mit גְּדוּד, einen feindlichen Überfall. Das Suffix der 3. Person Singular wird mit „ihn“ ausdrücklich wiedergegeben.
- source_word: וְהוּא
  choice: doch er
  rationale: Das Waw kann schlicht „und“ bedeuten; der inhaltliche Umschwung von erlittenem Angriff zu Gegenwehr wird im Deutschen jedoch natürlich mit „doch“ ausgedrückt.
- source_word: יָגֻד
  choice: wird ihnen auf den Fersen sein
  rationale: Das Verb gehört derselben Wortwurzel wie das vorherige an. Zusammen mit עָקֵב ergibt sich wahrscheinlich das Bild eines Gegenangriffs oder einer Verfolgung von hinten; eine wörtliche Wiederholung von „überfallen“ wäre mit dieser Ergänzung im Deutschen unnatürlich.
- source_word: עָקֵב
  choice: auf den Fersen
  rationale: Wörtlich „Ferse“. Die Wendung kann einen Angriff von hinten oder eine Verfolgung im Rücken bezeichnen. „Auf den Fersen sein“ wahrt das Körperbild und bleibt idiomatisch.
