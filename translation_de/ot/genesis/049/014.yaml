  source_fidelity: 'Die Übersetzung gibt die hebräische Nominalsatzstruktur und die Bilder treffend wieder: Issachar wird als kräftig bzw. robust gebauter Esel beschrieben, der zwischen den im Hebräischen lexikalisch umstrittenen מִשְׁפְּתַיִם lagert. „kräftig gebaut“ vermittelt die bei גָּרֶם wahrscheinlich gemeinte robuste Körperlichkeit besser als ein missverständlich negatives „knochig“.'
