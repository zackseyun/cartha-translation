  text: יִשָּׂשכָ֖ר חֲמֹ֣ר גָּ֑רֶם רֹבֵ֖ץ בֵּ֥ין הַֽ/מִּשְׁפְּתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: de
  text: Issachar ist ein kräftig gebauter Esel, der zwischen den Hürden[a] lagert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen den Satteltaschen“. Das hebräische Wort ist selten, und seine Bedeutung ist umstritten; „Hürden“ entspricht der traditionellen und im pastoralen Zusammenhang wahrscheinlichen Deutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: חֲמֹר
  choice: Esel
  rationale: Dies ist die klare und natürliche deutsche Entsprechung; das Geschlecht muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: גָּרֶם
  choice: kräftig gebaut
  rationale: Das Substantiv „Knochen“ beschreibt hier attributiv den robusten Körperbau des Esels. „Kräftig gebaut“ vermittelt den wahrscheinlichen Sinn natürlich, ohne das Bild als bloße Magerkeit misszuverstehen.
- source_word: רֹבֵץ
  choice: lagert
  rationale: Das Partizip bezeichnet ein Tier, das sich niedergelegt hat oder ruht. „lagert“ ist knapp, gegenwärtig verständlich und dem poetisch-pastoralen Bild angemessen.
- source_word: בֵּין
  choice: zwischen
  rationale: Die Präposition wird in ihrer gewöhnlichen räumlichen Bedeutung wiedergegeben.
- source_word: הַמִּשְׁפְּתָיִם
  choice: den Hürden
  rationale: Das seltene und umstrittene Wort wird im Haupttext gemäß der traditionellen pastoralen Deutung als Vieh- beziehungsweise Schafhürden verstanden. Die mögliche Bedeutung „Satteltaschen“ bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die Satzstruktur bleibt knapp und bildhaft; die seltene hebräische Bezeichnung wird nicht scheinbar eindeutig gemacht, sondern durch eine Fußnote abgesichert.
