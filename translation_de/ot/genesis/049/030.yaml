base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: de
  text: in der Höhle, die auf dem Feld von Machpela liegt, gegenüber Mamre im Land Kanaan, dem Feld, das Abraham von Efron, dem Hetiter, als Grabgrundstück kaufte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: in der Höhle
  rationale: Die Präposition ב mit bestimmtem Substantiv bezeichnet den Ort; „Höhle“ ist die natürliche und sachlich passende deutsche Entsprechung.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: auf dem Feld von Machpela
  rationale: Im Deutschen steht man idiomatisch „auf“ einem Feld. Der Relativsatz wird knapp als Präpositionalfügung wiedergegeben, ohne die räumliche Zuordnung der Höhle zum Feld zu verändern.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: gegenüber von Mamre
  rationale: Die Wendung bezeichnet hier die Lage in Beziehung zu Mamre. „Gegenüber von“ bewahrt den räumlichen Sinn, ohne bloße Nähe zu unterstellen.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Dies ist die übliche und genaue deutsche Wiedergabe der geografischen Angabe.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: dem Feld, das Abraham … kaufte
  rationale: אֶת הַשָּׂדֶה ist das direkte Objekt von „kaufte“. Die appositive Wiederaufnahme macht die hebräische Konstruktion im Deutschen klar und vermeidet die sachlich falsche Wiedergabe „zusammen mit dem Feld“.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: von Efron, dem Hetiter
  rationale: מֵאֵת bezeichnet beim Kauf den Verkäufer beziehungsweise die Herkunft des erworbenen Grundstücks; das Gentiliz wird als Apposition wiedergegeben.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: als Grundbesitz für eine Grabstätte
  rationale: אֲחֻזָּה bezeichnet rechtmäßig gehaltenen Besitz, während קֶבֶר den Bestattungszweck angibt. Die Formulierung wahrt sowohl den rechtlichen als auch den funktionalen Aspekt.
theological_decisions: []
