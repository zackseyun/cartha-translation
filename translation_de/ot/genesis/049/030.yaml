  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet die appositive Wiederaufnahme des Feldes und löst die lange hebräische Relativkonstruktion verständlich auf, ohne ihr Bezugsverhältnis umzudeuten.
