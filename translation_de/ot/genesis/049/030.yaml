  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Ortsangaben sowie den Kauf durch Abraham grundsätzlich. Die vorliegende Gedankenstrich-Apposition („im Land Kanaan – dem Feld“) ist jedoch syntaktisch nicht sauber angebunden. Eine explizite Relativsatzlösung macht deutlich, dass die Höhle auf dem Feld liegt und dass „das Feld“ das Objekt von „kaufte“ ist.
  naturalness: Die Revision verwendet modernes, würdiges Standarddeutsch. „Gegenüber Mamre“ ist idiomatischer und knapper als „gegenüber von Mamre“. „Grabgrundstück“ gibt den Besitz- und Bestattungszweck verständlich wieder.
  terminology: Machpela, Mamre, Kanaan, Abraham und Efron sind konsistent wiedergegeben; „der Hetiter“ entspricht dem hebräischen Gentiliz. „Grabgrundstück“ wahrt bei לַאֲחֻזַּת קָבֶר die rechtliche Besitznuance besser als eine bloße „Grabstätte“.
  issues:
