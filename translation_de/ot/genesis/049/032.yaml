  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: de
  text: Das Feld und die Höhle darin wurden von den Söhnen Hets[a] erworben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von den Hetitern«. Wörtlich steht im Hebräischen: »von den Söhnen Hets«.'
