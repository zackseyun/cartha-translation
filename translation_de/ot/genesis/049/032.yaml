  - marker: b
    text: 'Wörtlicher: »Der Erwerb des Feldes und der Höhle darin stammte von den Söhnen Hets.«'
    reason: formal_alternative
lexical_decisions:
- source_word: מִקְנֵה
  choice: wurden … erworben
  rationale: Das Substantiv bezeichnet hier den Erwerb beziehungsweise das durch Kauf Erworbene. Die verbale Wiedergabe ist im Deutschen natürlich und macht den knappen hebräischen Nominalsatz verständlich.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Entspricht dem üblichen Sinn von שָׂדֶה im Zusammenhang mit Landbesitz.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: und die Höhle darin
  rationale: Gibt die räumliche Beziehung der Höhle zum Feld knapp und natürlich wieder.
- source_word: מֵאֵת
  choice: von
  rationale: Kennzeichnet die Herkunft des Erwerbs; die idiomatische deutsche Entsprechung ist „von“.
- source_word: בְּנֵי חֵת
  choice: die Söhne Hets
  rationale: Bewahrt die wörtliche, für Genesis charakteristische Volksbezeichnung; „Hetiter“ wird als verständliche Alternative in der Fußnote genannt.
