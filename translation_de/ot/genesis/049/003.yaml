base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: de
  text: Ruben, du bist mein Erstgeborener, meine Kraft und der Anfang meiner Manneskraft[a], überragend an Hoheit und überragend an Macht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Erstling meiner Kraft“. Die hebräische Wendung bezeichnet hier das erste Hervortreten der Zeugungskraft eines Vaters.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an Würde und an Stärke allen überlegen“. Das mit „Hoheit“ wiedergegebene hebräische Wort kann auch Erhebung, Rang, Würde oder Ehre bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: mein Erstgeborener
  rationale: Die Bezeichnung wahrt sowohl die Geburtsreihenfolge als auch den besonderen Rang des erstgeborenen Sohnes.
- source_word: כֹּחִי
  choice: meine Kraft
  rationale: Die Grundbedeutung und die knappe poetische Parallelführung werden direkt wiedergegeben.
- source_word: רֵאשִׁית אוֹנִי
  choice: der Anfang meiner Manneskraft
  rationale: Die Formulierung bewahrt רֵאשִׁית als Anfang beziehungsweise erstes Hervortreten und gibt den hier mitschwingenden zeugungsbezogenen Sinn von אוֹן würdig und verständlich wieder.
- source_word: יֶתֶר שְׂאֵת
  choice: überragend an Hoheit
  rationale: יֶתֶר bezeichnet Überlegenheit oder Vorrang; שְׂאֵת kann Erhebung, hohen Rang, Würde oder Ehre bezeichnen. „Hoheit“ erhält das Bild der Erhöhung, ohne die Bedeutung auf bloße gesellschaftliche Ehre zu verengen.
- source_word: יֶתֶר עָז
  choice: überragend an Macht
  rationale: Die Wiederholung von „überragend“ bildet das zweimalige יֶתֶר ab; „Macht“ gibt עָז wieder und vermeidet eine unmittelbare Wiederholung von „Kraft“.
- source_word: אַתָּה
  choice: du bist
  rationale: Das ausdrücklich gesetzte Pronomen wird in der direkten, betonten Anrede natürlich wiedergegeben.
theological_decisions:
- issue: Generative Bedeutung von אוֹן
  choice: Manneskraft
  alternative: Kraft
  rationale: Im Zusammenhang mit dem Erstgeborenen bezeichnet die Wendung wahrscheinlich Jakobs Zeugungskraft. „Manneskraft“ macht diesen Bezug erkennbar, während die Fußnote die allgemeinere Wiedergabe offenhält.
- issue: Bedeutungsbreite von שְׂאֵת
  choice: Hoheit
  alternative: Ehre oder Würde
  rationale: Der hebräische Ausdruck lässt Erhebung, Rang, Würde und Ehre anklingen. Der Haupttext entscheidet sich nicht für eine eng konfessionelle oder theologische Deutung; die Alternativen werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Parallelität. Die zweimalige Wiedergabe von יֶתֶר durch „überragend“ erhält die formale Struktur des hebräischen Verses.
