  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Bilder des Hebräischen im Wesentlichen treffend wieder: der standhafte Bogen, die durch die Hände des Mächtigen Jakobs bewirkten Arme sowie „Hirte“ und „Stein Israels“. Die Wendung „Arme“ ist als idiomatische Wiedergabe von „Arme seiner Hände“ vertretbar. Für וַיָּפֹזּוּ ist „beweglich“ jedoch etwas zu allgemein; „geschmeidig“ trifft die häufig angenommene Nuance von Beweglichkeit/Gewandtheit genauer. Am Schluss steht im Hebräischen kein finites Verb. „von dort her ist“ fügt zwar nur eine Kopula ein, erzeugt im Deutschen aber eine unnötig bestimmte und zugleich unnatürliche Satzkonstruktion. Ein Doppelpunkt bewahrt die knappe, umstrittene syntaktische Verbindung besser.'
