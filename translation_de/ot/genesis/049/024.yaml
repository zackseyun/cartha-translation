  text: וַ/תֵּ֤שֶׁב בְּ/אֵיתָן֙ קַשְׁתּ֔/וֹ וַ/יָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑י/ו מִ/ידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִ/שָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: de
  text: "Doch sein Bogen blieb fest,\nund seine Arme wurden geschmeidig\n durch die Hände des Mächtigen Jakobs;\nvon dort: der Hirte,\nder Stein Israels.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Halbvers ist im Hebräischen äußerst knapp und in seinem Satzbau mehrdeutig; wörtlich etwa: „von dort: Hirte, Stein Israels“. Die genaue syntaktische Anbindung der Titel bleibt umstritten.'
    reason: Die Fußnote erläutert die tatsächliche Ellipse und Mehrdeutigkeit des hebräischen Schlusses, ohne die Titel eindeutig auf den Mächtigen Jakobs oder auf Josef zu beziehen.
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: fest
  rationale: Die Wendung bezeichnet Beständigkeit und ungebrochene Stärke; „blieb fest“ gibt zusammen mit וַתֵּשֶׁב den fortdauernden sicheren Zustand des Bogens natürlich wieder.
- source_word: וַיָּפֹזּוּ
  choice: wurden beweglich
  rationale: Das seltene Verb beschreibt Beweglichkeit, Geschmeidigkeit oder Gewandtheit. Die Formulierung wahrt diesen Sinn und lässt die mit מִידֵי bezeichnete göttliche Befähigung erkennen.
- source_word: אֲבִיר יַעֲקֹב
  choice: der Mächtige Jakobs
  rationale: אֲבִיר ist hier ein Gottesprädikat mit dem Sinn „der Mächtige/Starke“; die Genitivverbindung mit Jakob bleibt erhalten.
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: der Stein Israels
  rationale: Die konkrete Metapher „Stein“ wird bewahrt und nicht deutend zu „Fels“ oder „Beschützer“ erweitert.
theological_decisions:
- issue: Bezug der Titel „Hirte“ und „Stein Israels“
  choice: Die beiden Ausdrücke stehen parallel als Titel, ohne ihren Bezug ausdrücklich festzulegen.
  alternative: Sie ausdrücklich auf den Mächtigen Jakobs oder auf Josef beziehen.
  rationale: Der knappe hebräische Nominalsatz lässt den syntaktischen Anschluss offen; die Übersetzung vermeidet eine konfessionell oder theologisch motivierte Vereindeutigung.
- issue: Deutung von מִשָּׁם
  choice: „von dort her ist“
  alternative: „von ihm kommt“ oder „von dort kommt“
  rationale: Die lokale Formulierung des überlieferten Textes wird möglichst eng wiedergegeben. Ein Bewegungsverb wie „kommt“ steht nicht ausdrücklich im Hebräischen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Zeilengliederung. Die ungewöhnliche Wendung „von dort her ist“ bleibt bewusst etwas markiert, weil auch der hebräische Schluss knapp und schwer zu deuten ist.
