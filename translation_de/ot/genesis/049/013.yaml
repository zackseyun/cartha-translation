  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: de
  text: 'Sebulon wird an der Küste der Meere wohnen,


    und er wird an der Küste der Schiffe sein,


    und seine Flanke liegt in Richtung Sidon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Seite«, »sein Randgebiet« oder »sein äußerster Bereich liegt in Richtung Sidon«. Das hebräische Wort kann in geografischem Zusammenhang Seite, Flanke oder äußerstes Gebiet bezeichnen; auch die genaue räumliche Beziehung zu Sidon bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Der Personen- und Stammesname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לְחוֹף יַמִּים
  choice: an der Küste der Meere
  rationale: Die Wendung bewahrt sowohl die räumliche Bedeutung von לְחוֹף als auch den hebräischen Plural יַמִּים. Das Deutsche kann diesen poetischen Plural verständlich wiedergeben.
- source_word: יִשְׁכֹּן
  choice: wird … wohnen
  rationale: Das Qal-Imperfekt bezeichnet hier das künftige Wohnen bzw. Siedeln und passt zur prophetischen Segensrede.
- source_word: וְהוּא לְחוֹף אֳנִיּוֹת
  choice: an der Küste der Schiffe wird er sein
  rationale: Die konkrete, ungewöhnliche Bildsprache des Hebräischen wird erhalten; eine Deutung als »Hafen« wird nicht in den Haupttext eingetragen.
- source_word: וְיַרְכָתוֹ
  choice: seine Flanke
  rationale: יַרְכָה kann Seite, Flanke oder äußersten Rand bezeichnen. »Flanke« bewahrt die körperliche Metapher, die hier geografisch auf das Stammesgebiet bezogen ist.
- source_word: עַל צִידֹן
  choice: nach Sidon hin liegen
  rationale: עַל bezeichnet hier wahrscheinlich die Ausrichtung oder Erstreckung in Richtung Sidon. Die Ergänzung »liegen« macht den geografischen Sinn im Deutschen natürlich, ohne eine genaue Grenzlage festzulegen.
theological_decisions: []
translation_notes:
  register: Poetisch gehobenes, aber modernes Standarddeutsch. Der Parallelismus und der auffällige Plural »Meere« bleiben erhalten. Die Wiederholung von »Küste« bildet die hebräische Struktur ab; die geografische Aussage wird nicht zu einer präzisen historischen Grenzbeschreibung ausgeweitet.
