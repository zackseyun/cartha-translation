  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: de
  text: Benjamin ist ein reißender Wolf; am Morgen frisst er Beute[a], und am Abend verteilt er das Raubgut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Beute“ kann auch weiter gefasst „Raubgut“ oder „Plündergut“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Der Eigenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: זְאֵב יִטְרָף
  choice: ein reißender Wolf
  rationale: זְאֵב bezeichnet den Wolf; יִטְרָף beschreibt sein Zerreißen beziehungsweise Reißen von Beute. Die knappe deutsche Wendung bewahrt das Raubtierbild und den poetischen Stil.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Natürliche deutsche Wiedergabe der temporalen Präpositionalphrase und passende Entsprechung zu „am Abend“.
- source_word: יֹאכַל
  choice: frisst
  rationale: Das gewöhnliche Verb „essen“ steht hier von einem Wolf; „frisst“ ist im Deutschen die natürliche, bildkräftige Bezeichnung, ohne die Bedeutung unnötig zu verstärken.
- source_word: עַד
  choice: Beute
  rationale: Das seltene Substantiv kann Beute beziehungsweise Raubgut bezeichnen. Im ersten Halbvers passt „Beute“ besonders zum Wolfsbild, doch die weiter gefasste Bedeutung bleibt in der Fußnote sichtbar.
- source_word: וְלָעֶרֶב
  choice: und am Abend
  rationale: Bewahrt die zeitliche Parallelität mit „am Morgen“ und gibt die Konjunktion neutral wieder.
- source_word: יְחַלֵּק
  choice: verteilt
  rationale: Das Piel von חלק bedeutet hier teilen oder verteilen; „verteilt“ wirkt mit „Raub“ natürlich und lässt an die Aufteilung gewonnener Güter denken.
- source_word: שָׁלָל
  choice: Raub
  rationale: Das Wort bezeichnet im Kampf erbeutetes Gut. „Raub“ ist knapp und poetisch; „Beute“ oder „Raubgut“ sind ebenfalls möglich.
theological_decisions:
- issue: Bildhafte Aussage von Jakobs Spruch über Benjamin
  choice: Die Zeile bleibt eine knappe Metapher für räuberische Kraft und die Verteilung der gewonnenen Beute.
  alternative: Sie ausdrücklich auf spätere kriegerische Ereignisse in der Geschichte des Stammes Benjamin beziehen.
  rationale: Der hebräische Text nennt keine konkrete spätere Erfüllung. Die Übersetzung bewahrt daher das Bild, ohne einen historischen oder konfessionellen Deutungsrahmen einzutragen.
translation_notes:
  register: Moderne, würdige und knappe poetische Sprache. „Reißender Wolf“ ist im heutigen Standarddeutsch verständlich und bildet die im Hebräischen auf Substantiv und Verb verteilte Raubtiercharakterisierung idiomatisch ab. Der Fußnotenmarker steht nach dem Satz, da die Anmerkung zwei eng verwandte Beutebegriffe betrifft.
