source:
  edition: WLC
  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: de
  text: Josef ist ein fruchtbarer Sohn[a], ein fruchtbarer Sohn an einer Quelle; Töchter[b] schreiten über die Mauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Josef ist ein fruchtbarer Zweig, ein fruchtbarer Zweig an einer Quelle.“ Das Hebräische ist poetisch verdichtet; die traditionelle Wiedergabe mit „Zweig“ deutet das Pflanzenbild ausdrücklicher aus.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Töchter“. Das Wort kann hier bildhaft Zweige oder Triebe bezeichnen, die über eine Mauer hinauswachsen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: Sohn
  rationale: Die Grundbedeutung ist „Sohn“. Die Wiedergabe bewahrt den komprimierten poetischen Wortlaut; „Zweig“ deutet das Pflanzenbild bereits aus.
- source_word: פֹּרָת
  choice: fruchtbar
  rationale: Das Wort gehört zur Wurzel פרה („fruchtbar sein, sich mehren“) und bezeichnet hier Fruchtbarkeit, ohne selbst ausdrücklich „Zweig“ zu bedeuten.
- source_word: בֵּן פֹּרָת
  choice: ein fruchtbarer Sohn
  rationale: Diese Wiedergabe erhält die lexikalischen Werte beider Wörter und lässt die ungewöhnliche, poetisch verdichtete Bildsprache stehen.
- source_word: עֲלֵי עָיִן
  choice: an einer Quelle
  rationale: עַיִן kann „Auge“ oder „Quelle“ bedeuten. Im Zusammenhang des Fruchtbarkeits- und Pflanzenbildes ist „Quelle“ die naheliegende kontextuelle Bedeutung; עֲלֵי wird lokal wiedergegeben.
- source_word: בָּנוֹת
  choice: Töchter
  rationale: Das Wort bedeutet wörtlich „Töchter“. Es kann im poetischen Bild für Zweige oder Triebe stehen, doch die Übersetzung bewahrt die Metapher, statt sie im Haupttext aufzulösen.
- source_word: צָעֲדָה
  choice: schreiten
  rationale: Das Verb bezeichnet ein Schreiten oder Ausschreiten. Der hebräische Singular kann sich kollektiv auf „Töchter“ beziehen; im Deutschen ist der Plural grammatisch erforderlich.
- source_word: עֲלֵי שׁוּר
  choice: über die Mauer
  rationale: שׁוּר bezeichnet hier am wahrscheinlichsten eine Mauer; die Präposition zeichnet eine Bewegung über deren Begrenzung hinweg.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst bewahrter poetischer Verdichtung. „Schreiten“ hält den gehobenen poetischen Ton, ohne altertümlich zu wirken; die schwer auflösbare Verbindung von Sohn-, Fruchtbarkeits- und Pflanzenbild bleibt sichtbar.
