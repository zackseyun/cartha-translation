  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: de
  text: Er sah, dass der Ruheplatz gut war[a] und dass das Land angenehm war. Da beugte er seine Schulter, um Lasten zu tragen, und wurde zum Fronarbeiter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass die Ruhe gut war«. Das hebräische Wort kann sowohl »Ruhe« als auch »Ruheplatz« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wurde zu einem tributpflichtigen Diener«; auch: »wurde zum Sklavenarbeiter«. Der hebräische Ausdruck bezeichnet wahrscheinlich auferlegten Frondienst, seine genaue soziale Bedeutung ist jedoch umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: Ruheplatz
  rationale: Das Substantiv kann sowohl »Ruhe« als auch einen konkreten »Ruheplatz« bezeichnen. Parallel zu »Land« passt hier die konkrete Bedeutung gut; die echte Mehrdeutigkeit bleibt in einer Fußnote erhalten.
- source_word: טוֹב
  choice: gut
  rationale: Die schlichte, weit gefasste Wertung des Hebräischen wird direkt wiedergegeben und nicht durch eine speziellere Deutung ersetzt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang des Stammesspruchs bezeichnet das Wort am natürlichsten das Stammesgebiet.
- source_word: נָעֵמָה
  choice: angenehm
  rationale: Das Wort beschreibt etwas Anziehendes oder Wohltuendes. »Angenehm« ist gegenwärtiges, zurückhaltendes Deutsch und vermeidet eine unnötige Steigerung.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: da beugte er seine Schulter
  rationale: Die körperliche Bildsprache des Hebräischen bleibt erhalten und deutet zugleich die Unterordnung unter eine Last an.
- source_word: לִסְבֹּל
  choice: um Lasten zu tragen
  rationale: Das Verb bezeichnet das Tragen beziehungsweise Ertragen einer Last. Die Ergänzung »Lasten« macht das im Deutschen natürlich verständlich, ohne das Bild zu verändern.
- source_word: לְמַס עֹבֵד
  choice: wurde zum Fronarbeiter
  rationale: מַס bezeichnet häufig Frondienst oder eine auferlegte Arbeitsleistung; עֹבֵד beschreibt den Dienenden beziehungsweise Arbeitenden. »Fronarbeiter« gibt die erzwungene Arbeitsleistung knapp und idiomatisch wieder, ohne ausdrücklich Sklaverei im engeren Sinn zu behaupten.
theological_decisions:
- issue: Art der Unterwerfung Issachars im Schlusssatz
  choice: wurde zum Fronarbeiter
  alternative: wurde zu einem tributpflichtigen Diener / wurde zum Sklavenarbeiter
  rationale: Der poetische Ausdruck kann Frondienst, tributäre Dienstbarkeit oder stärker versklavte Arbeit bezeichnen. Da מַס häufig eine auferlegte Arbeitsleistung meint, steht »Fronarbeiter« im Haupttext; die weiter gehenden oder anders gewichteten Deutungen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Körpermetapher bleibt erhalten; ungebräuchliche Archaismen werden vermieden. Der Rhythmus wird durch zwei Sätze gegliedert, ohne die logische Folge des hebräischen Textes aufzulösen.
