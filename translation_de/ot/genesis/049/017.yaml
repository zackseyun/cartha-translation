  source_fidelity: 'Der Jussiv „Dan sei“ und die Bildfolge Schlange/Viper, Weg/Pfad sowie der resultative Sturz geben den hebräischen poetischen Segensspruch insgesamt treffend wieder. Die Wiedergabe von עִקְּבֵי סוּס muss jedoch im Deutschen den Dativ des betroffenen Pferdes verwenden: Gemeint sind die Fersen des Pferdes, nicht ein idiomatisches Beißen „das Pferd in die Fersen“.'
