source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: de
  text: Dan sei eine Schlange am Weg, eine Viper am Pfad[a], die dem Pferd in die Fersen beißt, sodass sein Reiter rückwärts fällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort שְׁפִיפֹן bezeichnet eine gefährliche Schlange; die genaue Art ist unsicher. Auch „Otter“ wird als Übersetzung vorgeschlagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Qal-Jussiv von היה hat im Segensspruch den Charakter eines Wunsches beziehungsweise einer feierlichen Erklärung. „Sei“ bewahrt diese Nuance und passt zum poetischen Register.
- source_word: דָן
  choice: Dan
  rationale: Der Eigenname von Jakobs Sohn und dem nach ihm benannten Stamm wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: נָחָשׁ
  choice: Schlange
  rationale: Das Wort bezeichnet allgemein eine Schlange. „Schlange“ ist im heutigen Deutsch natürlich und bildet den Oberbegriff zum folgenden, selteneren Ausdruck.
- source_word: עֲלֵי דֶרֶךְ
  choice: am Weg
  rationale: Die Wendung verortet die Schlange am beziehungsweise beim Weg. „Am Weg“ ist knapp, idiomatisch und erhält das Bild eines Tieres, das dort auf Beute lauert.
- source_word: שְׁפִיפֹן
  choice: Viper
  rationale: Das seltene Wort bezeichnet offenbar eine gefährliche Schlangenart, deren genaue zoologische Bestimmung unsicher ist. „Viper“ vermittelt die Gefahr, ohne eine bestimmte Art festzulegen.
- source_word: עֲלֵי אֹרַח
  choice: am Pfad
  rationale: „Am Pfad“ steht parallel zu „am Weg“ und bewahrt die poetische Variation zwischen דֶרֶךְ und אֹרַח.
- source_word: הַנֹּשֵׁךְ
  choice: die ... beißt
  rationale: Das Partizip beschreibt die Schlange durch ihre Handlung. Der Relativsatz ist im Deutschen flüssig und erhält den beschreibenden Charakter.
- source_word: עִקְּבֵי סוּס
  choice: das Pferd in die Fersen
  rationale: Die Konstruktion bezeichnet den Fersen- beziehungsweise hinteren Fußbereich eines Pferdes. Die idiomatische deutsche Wendung „jemanden in die Fersen beißen“ gibt das Bild genau und verständlich wieder.
- source_word: וַיִּפֹּל
  choice: sodass ... fällt
  rationale: Die Verbfolge schildert den Sturz als Folge des Bisses. „Sodass“ macht diesen im Kontext klaren Ergebniszusammenhang natürlich sichtbar.
- source_word: רֹכְבוֹ
  choice: sein Reiter
  rationale: Das Suffix bezieht sich am natürlichsten auf das unmittelbar zuvor genannte Pferd. „Sein Reiter“ ist im Deutschen eindeutig und idiomatisch.
- source_word: אָחוֹר
  choice: rückwärts
  rationale: Das Adverb bezeichnet die Richtung des Sturzes. „Rückwärts“ ist die natürliche moderne Wiedergabe.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, dabei in modernem Standarddeutsch unmittelbar verständlich. Der Parallelismus „Schlange am Weg / Viper am Pfad“ bleibt erhalten; die zoologische Unsicherheit wird in der Fußnote offengelegt.
