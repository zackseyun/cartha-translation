  terminology: „Dan“, „Schlange“ und „Viper“ sind angemessen. Da שְׁפִיפֹן selten ist und die genaue zoologische Zuordnung unsicher bleibt, ist eine Fußnote sinnvoll. Die traditionelle Alternative „Otter“ sollte als Übersetzungsalternative, nicht als gesicherte Artbestimmung, formuliert werden.
