source:
  edition: WLC
  text: וַֽ/יְמָרֲרֻ֖/הוּ וָ/רֹ֑בּוּ וַֽ/יִּשְׂטְמֻ֖/הוּ בַּעֲלֵ֥י חִצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: de
  text: Sie setzten ihm erbittert zu, beschossen ihn[a] und feindeten ihn an – die Bogenschützen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „griffen ihn an“ beziehungsweise „stritten gegen ihn“. Das zugrunde liegende hebräische Verb ist an dieser Stelle schwer zu deuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: sie setzten ihm erbittert zu
  rationale: Das Piel von מרר mit Objektsuffix kann bedeuten, jemanden bitter zu machen oder ihm bitter zuzusetzen. Die gewählte idiomatische Formulierung bewahrt sowohl den Bitterkeitsaspekt als auch den feindseligen Zusammenhang.
- source_word: וָרֹבּוּ
  choice: beschossen ihn
  rationale: Die Form und Bedeutung sind schwierig. Im poetischen Zusammenhang mit בַּעֲלֵי חִצִּים („Bogenschützen“) liegt die traditionelle Deutung als Beschießen nahe; die allgemeineren Deutungen „gegen ihn streiten“ oder „ihn angreifen“ bleiben in der Fußnote erhalten.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: feindeten ihn an
  rationale: שטם bezeichnet Hass, Feindschaft oder anhaltende feindselige Haltung. „Feindeten ihn an“ gibt die aktive Feindschaft im Zusammenhang prägnant wieder, ohne sie auf ein bloß inneres Gefühl zu beschränken.
- source_word: בַּעֲלֵי חִצִּים
  choice: die Bogenschützen
  rationale: Wörtlich „Besitzer/Herren von Pfeilen“; die hebräische Verbindung bezeichnet idiomatisch Bogenschützen. Die Endstellung als nachgetragene Benennung der Angreifer wird bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischer Satzstellung. Der Gedankenstrich erhält die nachgestellte, betonte Benennung „die Bogenschützen“; „erbittert“ nimmt das Wortspiel mit der hebräischen Wurzel für Bitterkeit auf.
