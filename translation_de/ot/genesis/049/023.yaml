  source_fidelity: Die Übersetzung gibt die drei feindseligen Verben und die nachgestellte Benennung der Angreifer angemessen wieder. „Sie setzten ihm erbittert zu“ ist eine idiomatische Wiedergabe von וַיְמָרֲרֻהוּ; „beschossen ihn“ folgt einer in diesem poetischen Kontext gut begründbaren traditionellen Deutung von וָרֹבּוּ. Die Fußnote macht die sachlich notwendige Unsicherheit dieser Deutung transparent. „Feindeten ihn an“ deckt die feindselig-hasserfüllte Bedeutung von וַיִּשְׂטְמֻהוּ ab. „Die Bogenschützen“ entspricht dem idiomatischen בַּעֲלֵי חִצִּים und bewahrt dessen nachgestellte Stellung.
