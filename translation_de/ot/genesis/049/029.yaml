base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: de
  text: 'Dann wies er sie an und sagte zu ihnen: »Ich werde nun zu meinem Volk versammelt.[a] Begrabt mich bei meinen Vätern in der Höhle auf dem Feld Efrons, des Hethiters.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde gerade zu meinem Volk versammelt.« Die hebräische Wendung bezeichnet den bevorstehenden Tod und die Vereinigung mit den eigenen Angehörigen beziehungsweise Vorfahren im Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: wies er sie an
  rationale: צוה bezeichnet eine verbindliche Anweisung oder einen Auftrag. „Wies … an“ bewahrt die Ernsthaftigkeit der Verfügung und klingt im modernen Deutschen natürlicher als das stärkere „befahl“.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: und sagte zu ihnen
  rationale: Die gewöhnliche Redeeinleitung wird nah an der hebräischen Erzählstruktur wiedergegeben.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Ich werde nun zu meinem Volk versammelt
  rationale: Die passive hebräische Wendung bleibt als Bild erhalten. „Nun“ bringt im Kontext das unmittelbar Bevorstehende zum Ausdruck, ohne die Aussage auf „ich sterbe“ zu verkürzen.
- source_word: עַמִּי
  choice: meinem Volk
  rationale: „Volk“ entspricht dem hebräischen עַם und wahrt die familiäre sowie theologische Mehrdeutigkeit der Todesformel.
- source_word: קִבְרוּ אֹתִי
  choice: Begrabt mich
  rationale: Direkte und natürliche Wiedergabe des pluralischen Imperativs mit Objektsuffix.
- source_word: אֶל־אֲבֹתָי
  choice: bei meinen Vätern
  rationale: Das Deutsche verwendet bei einer Bestattung idiomatisch „bei“; „Väter“ bewahrt den patriarchalischen Bezug auf die Vorfahren.
- source_word: הַמְּעָרָה
  choice: der Höhle
  rationale: Das Substantiv bedeutet schlicht „Höhle“; der Bestattungszweck ist bereits aus dem Zusammenhang ersichtlich.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: auf dem Feld Efrons
  rationale: „Auf dem Feld“ ist die natürliche deutsche Ortsangabe; der Genitiv gibt die Zugehörigkeit zu Efron prägnant wieder.
- source_word: הַחִתִּי
  choice: des Hetiters
  rationale: Übliche deutsche Wiedergabe der ethnischen Bezeichnung; die Apposition steht passend im Genitiv.
theological_decisions:
- issue: Bedeutung von „zu meinem Volk versammelt“
  choice: Die übertragene Todesformel wird beibehalten.
  alternative: „Ich werde nun sterben.“
  rationale: Die Wendung bezeichnet den bevorstehenden Tod, lässt aber zugleich die Vorstellung der Zugehörigkeit beziehungsweise Vereinigung mit den Verstorbenen anklingen. Die bildhafte Aussage bleibt erhalten, ohne daraus eine weitergehende Jenseitslehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, wird jedoch idiomatisch geglättet. Die traditionelle Wendung „bei meinen Vätern“ und das Bild des Versammeltwerdens bleiben wegen ihrer inhaltlichen Resonanz erhalten.
