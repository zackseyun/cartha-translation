base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: de
  text: Unstet wie Wasser[a] wirst du keinen Vorrang haben, denn du bist auf das Bett deines Vaters gestiegen. Da hast du mein Lager entweiht – er stieg darauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Haltlos wie Wasser«. Glatter lässt sich der letzte Satz wiedergeben: »Da hast du mein Lager entweiht – du bist darauf gestiegen.« Im Hebräischen wechselt die letzte Wendung unvermittelt in die dritte Person: »er stieg darauf«. Gemeint sein kann ein ausrufartiger Rückverweis auf Ruben.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: Unbeherrscht
  rationale: Das Substantiv bezeichnet ungezügelte Impulsivität, Haltlosigkeit oder Unbeständigkeit. »Unbeherrscht« verbindet den Charaktervorwurf natürlich mit dem folgenden Wasservergleich.
- source_word: כַּמַּיִם
  choice: wie Wasser
  rationale: Gibt den direkten Vergleich idiomatisch wieder und lässt das Bild von ungebändigter, nicht festzuhaltender Bewegung offen.
- source_word: אַל תּוֹתַר
  choice: wirst du keinen Vorrang haben
  rationale: יתר bezeichnet hier im Zusammenhang mit Rubens Erstgeburtsstellung den verlorenen Vorrang. Die verneinte Zukunftsaussage gibt die Wirkung des hebräischen Ausdrucks im väterlichen Spruch natürlich wieder.
- source_word: כִּי עָלִיתָ
  choice: denn du bist … gestiegen
  rationale: Bewahrt sowohl die begründende Funktion von כִּי als auch das im Hebräischen verwendete, sexuell anspielende Bewegungsverb.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: auf das Bett deines Vaters
  rationale: Der hebräische Plural kann Bettstatt oder Lager bezeichnen; im Deutschen vermittelt der idiomatische Singular den Bezug auf das Ehebett klar.
- source_word: אָז
  choice: Damals
  rationale: Bezeichnet den Zeitpunkt der Tat. »Damals« passt im Deutschen besser zur rückblickenden Aussage als ein rein konsekutives »dann«.
- source_word: חִלַּלְתָּ
  choice: hast du es entweiht
  rationale: חלל bedeutet profanieren oder entweihen. »Entweiht« bewahrt das starke moralische Gewicht und kann sich natürlich auf das zuvor genannte Bett beziehen.
- source_word: יְצוּעִי
  choice: mein Lager
  rationale: Das Wort bezeichnet Bett, Lager oder Liegestatt. »Mein Lager« wahrt den Wechsel zur ersten Person und vermeidet eine mechanische Wiederholung von »Bett«.
- source_word: עָלָה
  choice: er stieg auf
  rationale: Die masoretische Form ist dritte Person Singular. Ihre Beibehaltung bewahrt den abrupten Personenwechsel und die echte syntaktische Schwierigkeit des Versschlusses.
theological_decisions:
- issue: Sexuelle Umschreibung und moralische Bewertung von Rubens Tat
  choice: Die bildhafte Formulierung »auf das Bett deines Vaters gestiegen« und das wertende »entweiht« bleiben erhalten.
  alternative: 'Explizit paraphrasieren: »mit der Nebenfrau deines Vaters geschlafen«.'
  rationale: Der hebräische Text formuliert euphemistisch, aber verständlich. Die Übersetzung macht die Anklage nicht expliziter als der Vers selbst und fügt keine Einzelheiten aus Genesis 35,22 ein.
- issue: Abrupter Wechsel zur dritten Person in עָלָה
  choice: Im Haupttext steht entsprechend dem masoretischen Wortlaut »er stieg auf«.
  alternative: 'Glätten zu: »Damals hast du mein Lager entweiht – du bist darauf gestiegen.«'
  rationale: Der Personenwechsel ist textlich bezeugt und möglicherweise eine ausrufartige Wiederaufnahme mit Bezug auf Ruben. Da die Konstruktion mehrdeutig bleibt, wird sie nicht stillschweigend harmonisiert; die glattere Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wasservergleich bleibt knapp; die sexuelle Anspielung wird weder verschleiert noch ausgedeutet. Der ungewöhnliche Personenwechsel am Versende bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
