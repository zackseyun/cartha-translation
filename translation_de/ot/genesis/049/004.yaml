  to: Unstet wie Wasser[a] wirst du keinen Vorrang haben, denn du bist auf das Bett deines Vaters gestiegen. Da hast du mein Lager entweiht – er stieg darauf.
  rationale: Die Revision stellt „mein Lager“ unmittelbar zu „entweiht“ und bewahrt zugleich die masoretische dritte Person im letzten Teilsatz. „Darauf“ macht den Bezug des elliptischen Schlusses auf das Lager deutlich, ohne die syntaktische Spannung aufzulösen. „Unstet“ ist für פַּחַז im Bildvergleich weiter und idiomatischer.
