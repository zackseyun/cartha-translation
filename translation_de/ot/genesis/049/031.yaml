  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: de
  text: Dort begruben sie Abraham und seine Frau Sara; dort begruben sie Isaak und seine Frau Rebekka; und dort begrub ich Lea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: dort
  rationale: Das Ortsadverb verweist auf die zuvor genannte Grabstätte zurück. „Dort“ ist im modernen Deutschen natürlich und bewahrt die dreifache Wiederholung.
- source_word: קָבְרוּ
  choice: sie begruben
  rationale: Der Qal Perfekt 3. Person Plural hat ein nicht näher bezeichnetes menschliches Subjekt. Die aktive Wiedergabe entspricht der hebräischen Form.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Das Substantiv mit Suffix der 3. Person Singular maskulin wird idiomatisch mit „seine Frau“ wiedergegeben; die Wiederholung bei Sara und Rebekka bewahrt die Struktur des Hebräischen.
- source_word: קָבַרְתִּי
  choice: ich begrub
  rationale: Der Qal Perfekt 1. Person Singular bezeichnet Jakobs eigene vergangene Handlung. Das Präteritum passt zur würdevollen Erzählrede.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: begruben ... begruben ... begrub
  rationale: Die durchgängige Verwendung desselben deutschen Verbs bewahrt die auffällige Wiederholung der hebräischen Wurzel קבר.
- source_word: לֵאָה
  choice: Lea
  rationale: Der Personenname wird nach der etablierten deutschen Bibel- und Namenskonvention wiedergegeben.
