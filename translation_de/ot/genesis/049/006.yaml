  rationale: Die Revision bevorzugt „Rat“ als die im Kontext von סוֹד genauere Entsprechung und glättet den deutschen Parallelismus, ohne die poetische Selbstbezeichnung „meine Seele“ aufzugeben. Die konkrete Handlung bei עקר wird im Haupttext wiedergegeben; die textlich beziehungsweise lexikalisch umstrittene Deutung als „Mauer“ bleibt eindeutig als Alternative markiert. Alle Fußnotenanker stehen bei der jeweils erläuterten Formulierung.
