source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: de
  text: In ihren Rat komme meine Seele nicht[a], mit ihrer Versammlung vereine sich meine Ehre nicht[b]. Denn in ihrem Zorn töteten sie einen Mann, und in ihrer Willkür durchtrennten sie einem Stier die Kniesehnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihren geheimen Rat“. Das hebräische Wort kann einen vertraulichen Rat oder einen engen, eingeweihten Kreis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Herrlichkeit vereine sich nicht mit ihrer Versammlung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Nach einer anderen Deutung der Konsonanten lautet der Satz: „rissen sie eine Mauer nieder“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: in ihren vertrauten Kreis
  rationale: סוֹד bezeichnet einen vertraulichen Rat oder einen engen, eingeweihten Kreis. „Vertrauter Kreis“ bewahrt sowohl den gemeinschaftlichen als auch den vertraulichen Aspekt und steht passend neben „Versammlung“.
- source_word: תָּבֹא נַפְשִׁי
  choice: Meine Seele soll nicht … kommen
  rationale: Die Konstruktion mit אַל drückt hier einen nachdrücklichen Wunsch der Distanzierung aus. „Meine Seele“ erhält das hebräische poetische Selbstverständnis, statt es zu einem bloßen „ich“ zu glätten.
- source_word: בִּקְהָלָם
  choice: ihrer Versammlung
  rationale: קָהָל bezeichnet eine versammelte Gemeinschaft. „Versammlung“ ist gegenwärtiges Standarddeutsch und erhält den Parallelismus zu סוֹד.
- source_word: תֵּחַד כְּבֹדִי
  choice: meine Ehre sich nicht … vereinen
  rationale: יחד wird hier als sich vereinigen oder anschließen verstanden. כָּבוֹד kann „Ehre“ oder „Herrlichkeit“ bedeuten; „Ehre“ passt zur persönlichen Lossagung von der Gewalttat.
- source_word: בְאַפָּם
  choice: in ihrem Zorn
  rationale: אַף bezeichnet idiomatisch Zorn. „In ihrem Zorn“ gibt die Präposition und den starken Affekt knapp wieder.
- source_word: הָרְגוּ אִישׁ
  choice: töteten sie einen Mann
  rationale: Der Singular אִישׁ bleibt erhalten und wird nicht verallgemeinert; die Formulierung kann poetisch kollektiv beziehungsweise auf das Geschehen um Sichem bezogen sein.
- source_word: וּבִרְצֹנָם
  choice: aus Willkür
  rationale: רָצוֹן bezeichnet Wille, Wohlgefallen oder Belieben. Im negativen Kontext drückt „aus Willkür“ eigenmächtiges, ungezügeltes Handeln natürlich aus.
- source_word: עִקְּרוּ
  choice: lähmten
  rationale: עקר bezeichnet bei einem Tier das Durchtrennen oder Verletzen der Sehnen. „Lähmten“ ist verständlicher als das fachsprachlichere „durchschnitten die Kniesehnen“, lässt die konkrete Art der Verstümmelung aber etwas allgemeiner.
- source_word: שׁוֹר
  choice: einen Stier
  rationale: Die masoretische Vokalisierung שׁוֹר bezeichnet ein Rind, besonders Stier oder Ochse. „Stier“ ist im modernen Deutschen natürlich und vermeidet die enger auf ein kastriertes Zugtier festgelegte Bedeutung von „Ochse“.
theological_decisions:
- issue: Bedeutung von כְּבֹדִי in Jakobs poetischer Lossagung
  choice: meine Ehre
  alternative: meine Herrlichkeit
  rationale: „Ehre“ bezeichnet hier plausibel Jakobs persönliche Würde beziehungsweise sein Ansehen und vermeidet, dem Ausdruck ohne textlichen Zwang einen späteren theologischen Sinn von „Herrlichkeit“ zu geben. Die Alternative bleibt wegen des Bedeutungsumfangs von כָּבוֹד in einer Fußnote sichtbar.
- issue: Deutung von שׁוֹר im Schlussglied
  choice: einen Stier
  alternative: eine Mauer
  rationale: Der masoretische Text liest שׁוֹר als Rind/Stier, und עקר passt zur Verstümmelung eines Tieres. Eine abweichende Deutung der Konsonanten als „Mauer“ ist beachtenswert, aber textlich weniger unmittelbar und wird daher nur in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Parallelismus der beiden ersten Satzglieder wird erhalten. „Vertrauter Kreis“ und „Versammlung“ unterscheiden die parallelen Gemeinschaftsbegriffe; „aus Willkür“ formuliert den negativen Sinn von רָצוֹן idiomatisch. Sämtliche Fußnotenmarker stehen an der jeweils erläuterten Stelle.
