  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: de
  text: vom Gott deines Vaters,[a] der dir helfen wird, und vom Allmächtigen, der dich segnen wird mit Segnungen des Himmels oben, mit Segnungen der Tiefe, die unten liegt,[b] mit Segnungen der Brüste und des Mutterleibs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Gott deines Vaters … und mit dem Allmächtigen“ oder: „vom Gott deines Vaters, nämlich dem Allmächtigen“. Die hebräische Verbindung der beiden Gottesbezeichnungen ist syntaktisch stark verdichtet; sie kann Quelle, Begleitung oder enge Apposition ausdrücken.'
    reason: syntaktische Alternative
  - marker: b
    text: 'Oder: „die unten kauert“. Das hebräische Wort kann „liegen“ oder „kauern“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: vom Gott deines Vaters
  rationale: Das hebräische מִן ist in der verdichteten Syntax mehrdeutig und kann Quelle oder Vermittlung ausdrücken. „Vom Gott deines Vaters“ bewahrt die Quellenangabe und bleibt im Deutschen natürlich.
- source_word: יַעְזְרֶךָ
  choice: der dir hilft
  rationale: Der Relativsatz macht Gott als Subjekt deutlich. Das deutsche Präsens hat in einem Segensspruch zukunftsbezogene Geltung, ohne die Verbform unnötig festzulegen.
- source_word: וְאֵת שַׁדַּי
  choice: und vom Allmächtigen
  rationale: Das ungewöhnliche אֵת wird als koordinierende beziehungsweise appositionelle Fortführung verstanden. Die Wiederholung von „vom“ ergibt eine klare Parallele, während eine Fußnote die syntaktische Unsicherheit festhält.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der Gottesbeiname wird entsprechend seiner üblichen Bedeutung übersetzt statt transliteriert.
- source_word: וִיבָרְכֶךָ
  choice: der dich segnet
  rationale: Ein paralleler Relativsatz gibt das männliche Subjekt und die Segenshandlung klar wieder; das Präsens passt zur performativen Sprache des Segens.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: Segnungen des Himmels droben
  rationale: Die Formulierung erhält die Genitivverbindung und den poetischen Gegensatz von oben und unten. „Droben“ ist gehoben, aber im biblisch-poetischen Register verständlich.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: die Tiefe, die unten lagert
  rationale: תְּהוֹם bezeichnet die wässrige Tiefe. רֹבֶצֶת kann sowohl ruhendes Lagern als auch Kauern ausdrücken; „lagert“ erhält das Bild, ohne es auf eine einzige Körperhaltung zu verengen.
- source_word: שָׁדַיִם וָרָחַם
  choice: Brüste und Mutterleib
  rationale: Die konkreten Körperbegriffe und ihre Fruchtbarkeits- und Nährsymbolik werden unverhüllt und würdig wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Die Übersetzung als Titel vermittelt die traditionelle Bedeutungsrichtung im modernen Deutsch, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Verhältnis zwischen „Gott deines Vaters“ und „dem Allmächtigen“
  choice: parallele Bezeichnungen für den helfenden und segnenden Gott
  alternative: 'enge Apposition: „vom Gott deines Vaters, nämlich dem Allmächtigen“'
  rationale: Die hebräische Verbindung ist syntaktisch gedrängt. Der Haupttext wahrt die Parallelität, während die Fußnote auch Quelle, Begleitung und Apposition als mögliche Beziehungen nennt.
translation_notes:
  register: Poetisch-gehobenes, aber modernes Standarddeutsch. Die vertikale Bildfolge „Himmel droben“ und „Tiefe unten“ sowie die konkreten Fruchtbarkeitsbilder bleiben erhalten. Die einzige Fußnotenmarke [a] steht unmittelbar bei der einschlägigen Wendung.
