revisions:
- from: Die Segnungen deines Vaters sind mächtiger als die Segnungen meiner Eltern[a]; sie reichen bis an die äußersten Grenzen der uralten Hügel.[b] Sie sollen auf Josephs Haupt kommen und auf den Scheitel dessen, der von seinen Brüdern abgesondert ist.[c]
  to: Die Segnungen deines Vaters übertreffen die Segnungen meiner Vorfahren bis zu dem, was an den uralten Hügeln begehrenswert ist.[a] Mögen sie auf Josephs Haupt ruhen und auf dem Scheitel dessen, der von seinen Brüdern abgesondert ist.[b]
  rationale: Die Revision bewahrt die überlieferte Lesung „deines Vaters“ und gibt הוֹרַי mit dem im Kontext natürlicheren „meiner Vorfahren“ wieder. Sie erhält die Unsicherheit von תַּאֲוַת durch eine wortnähere Hauptfassung und eine klar markierte räumliche Alternative. Der Segenswunsch wird als solcher formuliert, und die mehrdeutige Bezeichnung נְזִיר אֶחָיו bleibt ohne konfessionelle oder institutionelle Festlegung übersetzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:06:14Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Grundstruktur des hebräischen Segensspruchs überwiegend richtig wieder. Allerdings schwächt „Sie sollen … kommen“ die jussivisch-segenspendende Aussage von תִּהְיֶיןָ ab und entfernt sich von „auf dem Haupt/Scheitel sein“. Die Deutung von תַּאֲוַת als räumliche Grenze ist möglich, aber unsicher und sollte nicht durch eine zusätzliche, nicht im Hebräischen ausgedrückte Satzhandlung („sie reichen“) zu stark festgelegt werden. Die Anmerkung zu „meiner Eltern“ behandelt eine abweichende Lesart wie eine bloße Deutung und ist für den vorliegenden hebräischen Text nicht hinreichend präzise.
  naturalness: Die Sprache ist im Allgemeinen natürlich und angemessen gehoben. „Mögen … ruhen“ ist in einem deutschen Segensspruch idiomatischer und präziser als „Sie sollen … kommen“. „Vorfahren“ vermeidet zudem den im heutigen Deutsch leicht irreführenden Eindruck, es seien nur Jakobs unmittelbare Eltern gemeint.
  terminology: „Segnungen“, „Haupt“, „Scheitel“ und „abgesondert“ sind passend. „Von seinen Brüdern abgesondert“ bewahrt die Bedeutung von נְזִיר ohne eine spätere technische Nasiräer-Institution einzutragen. Die Alternative „Fürst unter seinen Brüdern“ bleibt als Auslegungsmöglichkeit in der Fußnote kenntlich.
