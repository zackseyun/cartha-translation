  - severity: medium
    issue: Die Wendung „Sie sollen auf Josephs Haupt kommen“ gibt תִּהְיֶיןָ לְרֹאשׁ nicht optimal wieder.
    rationale: Der Imperfekt hat hier die Kraft eines Segenswunsches; die Segnungen sollen auf Josephs Haupt sein. „Mögen … ruhen“ gibt sowohl Wunschcharakter als auch das Bild der aufliegenden Segnungen wieder.
  - severity: medium
    issue: Die Hauptübersetzung legt תַּאֲוַת mit „äußersten Grenzen“ fest und formuliert zusätzlich „sie reichen“.
    rationale: Die poetische Wendung ist semantisch umstritten; „Begehrenswertes/Schönstes“ ist eine weiterhin mögliche, näher am Wortlaut liegende Deutung. Die räumliche Deutung soll als Alternative in der Fußnote stehen.
  - severity: low
    issue: Fußnote a bezeichnet die Wiedergabe „uralte Berge“ bei הוֹרַי als „andere Deutung“.
    rationale: Sie betrifft, wenn überhaupt, eine abweichende Textlesung beziehungsweise Überlieferungsfrage, nicht einfach eine Deutung des vokalisierten WLC-Textes. Da sie für die Übersetzung des vorliegenden Textes nicht erforderlich ist, wird sie entfernt.
