source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: de
  text: Die Segnungen deines Vaters übertreffen die Segnungen meiner Vorfahren bis zu dem, was an den uralten Hügeln begehrenswert ist.[a] Mögen sie auf Josephs Haupt ruhen und auf dem Scheitel dessen, der von seinen Brüdern abgesondert ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis an die äußersten Grenzen der ewigen Hügel«; die genaue Bedeutung der hebräischen poetischen Wendung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »des Fürsten unter seinen Brüdern« beziehungsweise »dessen, der unter seinen Brüdern geweiht ist«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: die Segnungen deines Vaters
  rationale: Der Plural bezeichnet die Fülle der zugesprochenen Wohltaten; das Suffix der überlieferten Lesung richtet die Aussage unmittelbar an Joseph.
- source_word: גָּבְרוּ עַל
  choice: sind mächtiger als
  rationale: Das Verb bezeichnet Überlegenheit an Kraft oder Größe; die deutsche Vergleichsform gibt den poetischen Gedanken klar wieder.
- source_word: בִּרְכֹת הוֹרַי
  choice: die Segnungen meiner Eltern
  rationale: Nach der masoretischen Vokalisierung bedeutet הוֹרַי „meine Erzeuger/Eltern“. Die konsonantische Gestalt lässt jedoch im schwierigen poetischen Zusammenhang auch einen Bezug auf Berge erwägen; diese Unsicherheit wird in der Fußnote bewahrt.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: sie reichen bis an die äußersten Grenzen der uralten Hügel
  rationale: Die schwierige Wendung wird räumlich als äußerste Ausdehnung verstanden. „Uralte Hügel“ gibt עוֹלָם hier als seit unvordenklicher Zeit bestehend wieder, ohne die mögliche Bedeutung „ewig“ auszuschließen.
- source_word: תִּהְיֶיןָ לְרֹאשׁ יוֹסֵף
  choice: Sie sollen auf Josephs Haupt kommen
  rationale: Der Imperfekt hat im Segensspruch wünschend-zusprechende Kraft; „sollen … kommen“ klingt im Deutschen würdig und lässt den performativen Charakter erkennen.
- source_word: קָדְקֹד
  choice: Scheitel
  rationale: Das Wort bezeichnet den obersten Teil des Kopfes und bewahrt knapp den Parallelismus zu „Haupt“.
- source_word: נְזִיר אֶחָיו
  choice: der von seinen Brüdern abgesondert ist
  rationale: נְזִיר bezeichnet grundlegend einen Geweihten oder Abgesonderten. Die Formulierung wahrt sowohl Josephs Trennung von seinen Brüdern als auch seine besondere Stellung, ohne die spätere Institution des Nasiräers vorauszusetzen.
theological_decisions:
- issue: Deutung von Josephs Bezeichnung נְזִיר אֶחָיו
  choice: der von seinen Brüdern abgesondert ist
  alternative: der Fürst unter seinen Brüdern; der Geweihte unter seinen Brüdern
  rationale: „Abgesondert“ erhält die lexikalische Grundbedeutung und die Spannung zwischen erlittenem Getrenntsein, besonderer Erwählung und herausgehobener Stellung. Eine rein politische oder institutionell-kultische Festlegung wird vermieden.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischem Parallelismus. „Haupt“ und „Scheitel“ bewahren die feierliche Bildsprache; die schwierigen hebräischen Wendungen werden lesbar wiedergegeben, während echte Alternativen in den Fußnoten sichtbar bleiben.
