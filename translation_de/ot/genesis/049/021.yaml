  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: de
  text: Naftali ist eine freigelassene Hirschkuh[a]; er gibt schöne Worte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine losgelassene Hinde“. Das hebräische Bild zeigt ein weibliches Tier aus der Familie der Hirsche, das freigelassen wurde und frei laufen kann.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist in alter und neuer Auslegung unterschiedlich verstanden worden. Möglich sind unter anderem „der wohlklingende Aussprüche gibt“ oder – wenn die letzten Wörter anders gedeutet werden – „der schöne Jungtiere zur Welt bringt“.
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Personen- und Stammesname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אַיָּלָה
  choice: Hirschkuh
  rationale: Das hebräische Substantiv bezeichnet ein weibliches Tier aus der Familie der Hirsche. „Hirschkuh“ bewahrt das weibliche Bild und ist im heutigen Deutsch verständlicher als das altertümliche „Hinde“.
- source_word: שְׁלֻחָה
  choice: freigelassen
  rationale: Das passive Partizip von שלח zeichnet das Bild eines Tieres, das losgelassen wurde und sich frei bewegen kann. „Freigelassen“ gibt sowohl die passive Form als auch den Gedanken der Freiheit knapp wieder.
- source_word: הַנֹּתֵן
  choice: er gibt
  rationale: Das hebräische Partizip ist maskulin Singular und kann sich daher auf Naftali statt grammatisch auf die feminine Hirschkuh beziehen. Der neue Hauptsatz bewahrt diese Formunterscheidung und die knappe poetische Aussage.
- source_word: אִמְרֵי
  choice: Worte
  rationale: Der Konstruktplural bezeichnet Worte, Äußerungen oder Aussprüche; „Worte“ ist breit, natürlich und ohne unnötige Festlegung.
- source_word: שָׁפֶר
  choice: schöne
  rationale: Das Wort bezeichnet Schönheit oder Wohlgefälligkeit. „Schöne“ ist eine klare und poetisch passende Wiedergabe.
theological_decisions:
- issue: Bezug und Deutung des abschließenden Partizipialsatzes
  choice: „er gibt schöne Worte“ wird auf Naftali bezogen und folgt der masoretischen Punktierung.
  alternative: Der Schluss kann auf andere Weise mit dem Bild der Hirschkuh verbunden oder aufgrund einer anders angesetzten Bedeutung als Aussage über „schöne Junge“ verstanden werden.
  rationale: Der hebräische Vers ist äußerst knapp und poetisch. Das maskuline הַנֹּתֵן legt einen Rückbezug auf Naftali nahe, während die Bildsprache und abweichende alte wie neuere Deutungen eine Restunsicherheit lassen. Die Hauptfassung folgt dem masoretischen Text; die Fußnote bewahrt die echte Auslegungsbreite.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzform. Der Wechsel zu „er“ bildet bewusst das maskuline hebräische Partizip nach und verhindert, dass sein Bezug stillschweigend auf die feminine Hirschkuh festgelegt wird.
