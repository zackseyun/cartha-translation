source:
  edition: WLC
  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: de
  text: Juda[a], deine Brüder werden dich preisen. Deine Hand wird auf dem Nacken deiner Feinde liegen; die Söhne deines Vaters werden sich vor dir niederbeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann auch „dir danken“ oder „dich anerkennen“ bedeuten. „Dich preisen“ passt hier zum Segen und zum Wortspiel mit dem Namen Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname wird nach der etablierten deutschen Bibeltradition wiedergegeben; zugleich bleibt das hebräische Wortspiel mit יוֹדוּךָ zumindest erkennbar.
- source_word: יוֹדוּךָ
  choice: werden dich preisen
  rationale: Der Hifil von ידה bezeichnet hier ehrendes Preisen bzw. Anerkennen. „Preisen“ passt zum Segenskontext und zum Wortspiel mit dem Namen Juda.
- source_word: אַחֶיךָ
  choice: deine Brüder
  rationale: Die maskuline Pluralform mit Suffix bezeichnet im unmittelbaren Zusammenhang Jakobs Söhne und wird daher konkret als „Brüder“ wiedergegeben.
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: Deine Hand wird auf dem Nacken deiner Feinde liegen
  rationale: Die konkrete Körpermetapher für Sieg und Herrschaft bleibt erhalten. Das ergänzte „liegen“ ergibt im Deutschen einen natürlichen vollständigen Satz, ohne die Bildsprache aufzulösen.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: werden sich vor dir niederbeugen
  rationale: Die Wendung beschreibt hier Unterwerfung und Ehrerbietung gegenüber Juda. „Sich niederbeugen“ bewahrt die körperliche Handlung, ohne vorschnell kultische Verehrung auszudrücken.
- source_word: בְּנֵי אָבִיךָ
  choice: die Söhne deines Vaters
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten. Sie bezeichnet Judas Brüder, trägt aber eine feierlich-poetische Hervorhebung, die nicht eingeebnet werden sollte.
theological_decisions:
- issue: Bedeutung der Huldigungsformel יִשְׁתַּחֲווּ לְךָ
  choice: 'menschliche Unterwerfung und Ehrerbietung: „sich vor dir niederbeugen“'
  alternative: „dich anbeten“ bzw. eine ausdrücklich kultische Wiedergabe
  rationale: Im Rahmen von Jakobs Segen ist Juda der menschliche Adressat. Die Übersetzung bewahrt den königlichen Herrschaftsklang, ohne eine im unmittelbaren Text nicht ausdrücklich ausgesagte göttliche Verehrung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Parallelität. Die konkrete Bildsprache und die feierliche Wendung „Söhne deines Vaters“ bleiben erhalten.
