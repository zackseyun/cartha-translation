  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: de
  text: Von Ascher kommt reichhaltige Nahrung, und er wird königliche Köstlichkeiten geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: Von Ascher kommt
  rationale: Die Präposition מִן bezeichnet Herkunft oder Quelle. Das im Hebräischen fehlende Verb wird für einen natürlichen deutschen Satz mit „kommt“ ergänzt.
- source_word: שְׁמֵנָה
  choice: reichhaltige
  rationale: Das Adjektiv bezeichnet wörtlich Fettigkeit und im Zusammenhang üppige, gehaltvolle Nahrung; „reichhaltig“ vermittelt dies im heutigen Deutsch natürlich.
- source_word: לַחְמוֹ
  choice: Nahrung
  rationale: לֶחֶם bedeutet häufig „Brot“, kann aber auch Nahrung oder Lebensmittel insgesamt bezeichnen. Der weitere Zusammenhang mit Köstlichkeiten legt hier den umfassenderen Ausdruck nahe.
- source_word: וְהוּא
  choice: und er
  rationale: Das selbstständige Pronomen nimmt Ascher betont als Subjekt wieder auf.
- source_word: יִתֵּן
  choice: wird ... liefern
  rationale: נָתַן bedeutet grundsätzlich „geben“; bei Erzeugnissen oder Speisen gibt „liefern“ die Vorstellung des Hervorbringens beziehungsweise Bereitstellens idiomatisch wieder.
- source_word: מַעֲדַנֵּי מֶלֶךְ
  choice: königliche Köstlichkeiten
  rationale: Die Konstruktverbindung bedeutet wörtlich „Köstlichkeiten eines Königs“. Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Form des Segensspruchs bleibt erhalten; die Herkunftsformulierung „Von Ascher“ folgt der hebräischen Präposition genauer als eine reine Besitzkonstruktion.
