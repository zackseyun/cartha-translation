  language: de
  text: Simeon und Levi sind Brüder; ihre Schwerter[a] sind Waffen der Gewalt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier mit „Schwerter“ übersetzte seltene hebräische Wort ist in seiner Bedeutung unsicher. Möglich ist auch: „ihre Geräte“ oder „ihre Werkzeuge“; ältere Übersetzungen haben „ihre Wohnstätten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: וְלֵוִי
  choice: und Levi
  rationale: Die Konjunktion und der Eigenname werden direkt wiedergegeben; „Levi“ ist die geläufige deutsche Namensform.
- source_word: אַחִים
  choice: sind Brüder
  rationale: Das Substantiv bezeichnet hier zunächst leibliche Brüder und zugleich ihre Verbundenheit im folgenden Urteil. Für den hebräischen Nominalsatz wird im Deutschen „sind“ ergänzt.
- source_word: כְּלֵי
  choice: Werkzeuge
  rationale: כְּלִי kann Geräte, Werkzeuge oder Waffen bezeichnen. „Werkzeuge“ bewahrt die Bildsprache und ergibt zusammen mit „der Gewalt“ eine natürliche deutsche Wendung.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet Gewalt beziehungsweise gewaltsames Unrecht; „Gewalt“ ist hier die direkte und kontextgerechte Wiedergabe.
- source_word: מְכֵרֹתֵיהֶם
  choice: ihre Schwerter
  rationale: Das seltene Wort ist in seiner Bedeutung unsicher. „Schwerter“ passt zum Kontext der gewaltsamen Tat, doch die lexikalische Unsicherheit wird ausdrücklich in einer Fußnote offengehalten.
