base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: de
  text: Juda ist ein Löwenjunges. Von der Beute bist du heraufgestiegen, mein Sohn. Er kauerte, er lag da wie ein Löwe und wie eine Löwin[a] – wer wird ihn aufscheuchen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein starker Löwe“. Das hier verwendete hebräische Wort unterscheidet sich vom vorherigen Wort für „Löwe“ und kann als Bezeichnung einer Löwin oder eines ausgewachsenen, kräftigen Löwen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Das Löwenbild für Juda wird häufig typologisch mit späterer königlicher und messianischer Hoffnung verbunden. Unmittelbar spricht der Vers jedoch in Jakobs Segenswort von Juda.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: Löwenjunges
  rationale: Die Konstruktverbindung bezeichnet das Junge eines Löwen. „Löwenjunges“ ist im heutigen Deutsch natürlich und bewahrt das Bild ohne archaische Färbung.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Personen- und Stammesname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מִטֶּרֶף
  choice: vom Raub
  rationale: טֶרֶף bezeichnet die von einem Raubtier gerissene oder erbeutete Beute. „Vom Raub“ hält das Bild knapp und offen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Form wird als direkte Anrede Jakobs an Juda verstanden; die Stellung nach dem ersten Satzteil erhält die poetische Zäsur.
- source_word: עָלִיתָ
  choice: bist du heraufgestiegen
  rationale: Die konkrete Aufwärtsbewegung bleibt erhalten, ohne näher festzulegen, wohin Juda beziehungsweise der im Bild vorgestellte Löwe steigt.
- source_word: כָּרַע
  choice: er duckte sich
  rationale: Im Zusammenhang mit dem Löwenbild bezeichnet das Verb ein Sich-Niederbeugen oder Kauern. „Duckte sich“ ist anschaulich und vermeidet eine kultische Nebenbedeutung.
- source_word: רָבַץ
  choice: er lagerte sich
  rationale: Das Verb wird häufig für ein Tier gebraucht, das sich niederlegt und ruht. „Sich lagern“ passt zum poetischen Register.
- source_word: כְּאַרְיֵה
  choice: wie ein Löwe
  rationale: Direkte vergleichende Wiedergabe des gebräuchlichen Wortes für „Löwe“.
- source_word: וּכְלָבִיא
  choice: und wie eine Löwin
  rationale: לָבִיא bezeichnet ein ausgewachsenes, kraftvolles Tier aus der Löwenfamilie und wird teils als „Löwin“, teils als „starker Löwe“ verstanden. „Löwin“ wahrt im Haupttext die lexikalische Abwechslung gegenüber אַרְיֵה; die andere Deutung wird in einer Fußnote genannt.
- source_word: מִי יְקִימֶנּוּ
  choice: wer wird ihn aufscheuchen?
  rationale: Der Hifil von קום bedeutet hier, jemanden zum Aufstehen zu bringen beziehungsweise aufzurütteln. „Aufscheuchen“ ist im Tierbild idiomatisch, ohne das nicht ausdrücklich vorhandene „wer wagt es“ einzufügen.
theological_decisions:
- issue: Tribal-königliche oder ausdrücklich messianische Deutung des Löwenbildes
  choice: Der Haupttext gibt unmittelbar Jakobs Segenswort über Juda wieder und macht keine ausdrückliche messianische Aussage.
  alternative: Das Löwenbild kann im Licht späterer königlicher und messianischer Hoffnung typologisch gelesen werden.
  rationale: Der hebräische Vers beschreibt Juda poetisch mit Löwenbildern. Eine spätere typologische Entfaltung ist möglich, soll aber nicht als ausdrückliche Aussage in die Übersetzung eingetragen werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. Der Wechsel von der direkten Anrede („du“) zur dritten Person („er“) wird entsprechend dem Hebräischen bewahrt. Die knappen, aufeinanderfolgenden Verben erhalten die Ruhe und latente Bedrohlichkeit des Löwenbildes.
