source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: de
  text: 'Und es geschah zu der Zeit, als die Herde brünstig war: Ich erhob meine Augen und sah in einem Traum – und siehe, die Ziegenböcke, die die Herde besprangen, waren gestreift[a], gesprenkelt und gescheckt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ringförmigen Streifen“. Das hebräische Wort bezeichnet eine band- oder streifenartige Zeichnung der Tiere.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bunt gefleckt“. Die drei hebräischen Bezeichnungen meinen wahrscheinlich unterschiedliche Fellzeichnungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Und es geschah zu der Zeit
  rationale: Bewahrt die hebräische Erzählformel und den zeitlichen Rahmen in würdigem, verständlichem Deutsch.
- source_word: יַחֵם הַצֹּאן
  choice: als die Herde brünstig war
  rationale: יחם bezeichnet hier die Paarungsbereitschaft der Tiere. „Brünstig war“ gibt den biologischen Sinn präziser wieder als eine bereits vollzogene Paarung.
- source_word: וָאֶשָּׂא עֵינַי
  choice: Ich erhob meine Augen
  rationale: Die geläufige hebräische Wendung wird bildhaft und dennoch verständlich wiedergegeben.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: und sah in einem Traum
  rationale: Kennzeichnet den Traum als Medium der Wahrnehmung, ohne eine im Deutschen unbegründete Bestimmtheit einzuführen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Erhält die lebhafte, Aufmerksamkeit weckende Präsentationsformel des Hebräischen.
- source_word: הָעַתֻּדִים
  choice: die Ziegenböcke
  rationale: Bezeichnet hier männliche Ziegen; „Ziegenböcke“ ist präzise und im modernen Deutsch natürlich.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: die die Herde besprangen
  rationale: עלה על beschreibt in diesem Zuchtzusammenhang konkret das Besteigen zur Paarung. „Besprangen“ ist der passende deutsche Ausdruck für Tiere.
- source_word: עֲקֻדִּים
  choice: gestreift
  rationale: Das Wort bezeichnet band- oder streifenartige Fellzeichnungen; „gestreift“ ist allgemein verständlich.
- source_word: נְקֻדִּים
  choice: gesprenkelt
  rationale: Gibt eine punkt- oder fleckenartige Zeichnung wieder und bleibt von den benachbarten Musterbezeichnungen unterscheidbar.
- source_word: וּבְרֻדִּים
  choice: gescheckt
  rationale: Bezeichnet wahrscheinlich eine verschiedenfarbige oder unregelmäßig gefleckte Fellzeichnung; „gescheckt“ ist idiomatisch, ohne übermäßige Präzisierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Erzählformel und die lebhafte Wendung „und siehe“ bleiben erhalten; die Ausdrücke zur Tierzucht sind konkret, sachlich und allgemein verständlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Farbbezeichnungen.
