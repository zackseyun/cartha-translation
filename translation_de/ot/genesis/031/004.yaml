    rationale: Sie ist für die übertragene Hauptübersetzung erforderlich geworden, klärt aber den hebräischen Satz nicht besser. Die revidierte Hauptübersetzung kann beide Verben selbst wiedergeben; eine Fußnote ist daher nicht nötig.
