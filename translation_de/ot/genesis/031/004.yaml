  rationale: Die Revision gibt die beiden hebräischen Verben als „schickte nach“ und „rief“ wieder, ohne die nicht ausdrücklich genannte Person eines Boten einzutragen. Die beiden Zielangaben bleiben erhalten; „zu seiner Herde aufs Feld“ ist im Deutschen natürlich und lässt die wahrscheinlich präzisierende Funktion der zweiten Ortsangabe erkennen.
