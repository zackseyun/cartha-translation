lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא
  choice: ließ ... rufen
  rationale: Die Verbindung der beiden Verben beschreibt, dass Jakob jemanden aussandte, um Rahel und Lea zu sich rufen zu lassen. Die deutsche Wendung gibt den Vorgang natürlich und knapp wieder, ohne anzudeuten, Jakob habe selbst vom Feld aus laut nach ihnen gerufen.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: Rahel und Lea
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: Das Substantiv bezeichnet Feld oder offenes Land; der Kontext und die Richtungsangabe sprechen hier für „aufs Feld“.
- source_word: אֶל צֹאנוֹ
  choice: zu seiner Herde
  rationale: צֹאן bezeichnet eine Kleinviehherde. אֶל drückt hier die Richtung beziehungsweise den genauer bestimmten Treffpunkt aus; „zu seiner Herde“ wahrt diese räumliche Beziehung.
