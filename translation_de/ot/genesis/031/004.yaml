  source_fidelity: Die Wendung „ließ ... rufen“ gibt den Sinn einer Veranlassung zwar idiomatisch wieder, fasst aber die zwei hebräischen Verben וַיִּשְׁלַח („sandte/schickte“) und וַיִּקְרָא („rief“) zu stark zu einem einzigen Vorgang zusammen. Die Revision erhält beide erzählerischen Schritte.
  naturalness: „Da schickte Jakob nach Rahel und Lea und rief sie zu seiner Herde aufs Feld“ ist modernes, flüssiges Standarddeutsch. Die Stellung „zu seiner Herde aufs Feld“ macht deutlich, dass die Herde den Treffpunkt im Feld näher bestimmt.
  terminology: „Jakob“, „Rahel“, „Lea“ und „Herde“ entsprechen den im Deutschen üblichen biblischen Formen und dem Sinn von צֹאן als Kleinviehherde. Keine theologisch geprägte Terminologie ist betroffen.
