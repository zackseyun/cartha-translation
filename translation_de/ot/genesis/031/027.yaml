base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: de
  text: Warum hast du dich versteckt, um zu fliehen, und dich mir entzogen[a], ohne mir etwas zu sagen? Ich hätte dich doch mit Freude und Liedern, mit Handtrommel und Leier verabschiedet!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und du hast mich gestohlen“. Die ungewöhnliche hebräische Wendung meint, dass Jakob sich Laban heimlich entzog bzw. sich davongestohlen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Die übliche und natürliche Wiedergabe der Frage nach dem Grund.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: hast du dich heimlich davongemacht, bist ... geflohen
  rationale: נחבא bezeichnet das Sichverbergen beziehungsweise heimliche Handeln, ברח ausdrücklich das Fliehen. Die Formulierung gibt beide Aussagen in natürlichem Deutsch wieder.
- source_word: וַתִּגְנֹב אֹתִי
  choice: vor mir geflohen
  rationale: Wörtlich lautet die ungewöhnliche hebräische Wendung »du hast mich gestohlen«; im Zusammenhang bezeichnet sie ein heimliches Entkommen. Die gewählte Fassung vermeidet im Deutschen eine irreführende Aussage und verbindet den Gedanken mit ברח.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: und hast mir nichts gesagt
  rationale: Natürliche deutsche Wiedergabe des Hifil von נגד mit dem negierten Inhalt.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Ich hätte dich doch ... verabschiedet
  rationale: Der Zusammenhang beschreibt eine nicht verwirklichte Möglichkeit. »Verabschiedet« entspricht hier dem feierlichen Geleit beim Weggang besser als das missverständliche »weggeschickt«.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: mit Freude und Gesang
  rationale: שירים kann konkrete Lieder oder Gesang bezeichnen; »Gesang« ist im Deutschen in der Verbindung mit Musikinstrumenten flüssig.
- source_word: בְּתֹף
  choice: mit Handtrommel
  rationale: תֹף bezeichnet ein mit der Hand gespieltes Rahmentrommelinstrument. »Handtrommel« ist modern und verständlich.
- source_word: וּבְכִנּוֹר
  choice: und Leier
  rationale: כִּנּוֹר bezeichnet ein leierartiges Saiteninstrument; »Leier« ist genauer als »Harfe«.
