base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: de
  text: Der Gott Abrahams und der Gott Nahors, der Gott ihres Vaters, mögen zwischen uns richten.[a] Und Jakob schwor bei der Furcht seines Vaters Isaak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Benennungen können auch so verstanden werden, dass durchgehend derselbe Gott gemeint ist: „Der Gott Abrahams und der Gott Nahors, der Gott ihres Vaters, möge zwischen uns richten.“ Im Hebräischen steht das Verb jedoch im Plural: „mögen … richten“.'
    reason: alternative_reading
  - marker: b
    text: „Die Furcht seines Vaters Isaak“ ist eine ungewöhnliche Bezeichnung für Gott. Das hebräische Wort bedeutet wörtlich „Furcht“ oder „Schrecken“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר
  choice: der Gott Abrahams und der Gott Nahors
  rationale: Die wiederholte hebräische Konstruktverbindung wird formal parallel wiedergegeben. Da das Deutsche durch Groß- oder Kleinschreibung von „Gott“ die Identität der Gottheit stärker festlegen würde als das Hebräische, bleibt die Formulierung einheitlich; die mögliche Unterscheidung wird in der Fußnote erläutert.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: der Gott ihres Vaters
  rationale: Die Phrase wird als erklärender Einschub zur vorangehenden Anrufung verstanden. Der Gedankenstrich bewahrt ihre syntaktische Mehrdeutigkeit als Apposition oder nachgetragene Bestimmung.
- source_word: יִשְׁפְּטוּ
  choice: mögen … richten
  rationale: Der Imperfekt in der Anrufungsformel wird als Wunsch beziehungsweise Aufforderung wiedergegeben. Der Plural „mögen … richten“ entspricht ausdrücklich der hebräischen Verbform und erhält damit die Spannung zwischen mehreren Benennungen und möglicher gemeinsamer Identität.
- source_word: בֵינֵינוּ
  choice: zwischen uns
  rationale: Direkte und im Deutschen natürliche Wiedergabe der wechselseitigen Formulierung.
- source_word: וַיִּשָּׁבַע יַעֲקֹב
  choice: Und Jakob schwor
  rationale: Die fortführende Erzählform wird schlicht mit Präteritum wiedergegeben.
- source_word: בְּפַחַד אָבִיו יִצְחָק
  choice: bei dem Schrecken seines Vaters Isaak
  rationale: „Schrecken“ gibt פַחַד als ungewöhnliche Gottesbezeichnung möglichst unmittelbar wieder. Die Substantivierung bleibt erhalten, ohne sie erklärend zu „dem Gott, den … fürchtete“ aufzulösen.
theological_decisions:
- issue: Ob die Gottheiten Abrahams, Nahors und ihres Vaters ausdrücklich als identisch oder verschieden zu kennzeichnen sind
  choice: Einheitliche Großschreibung „Gott“, bei gleichzeitig bewahrtem Plural des Verbs und erläuternder Fußnote
  alternative: „der Gott Abrahams und der gott Nahors“ beziehungsweise eine vereinheitlichende Singularform „möge richten“
  rationale: Im Deutschen wäre die Kleinschreibung von „gott“ orthografisch auffällig und würde eine polytheistische Deutung stärker festlegen, als der hebräische Wortlaut erlaubt. Der grammatische Plural „mögen … richten“ bewahrt die genuine Spannung des Textes.
- issue: Deutung von פַחַד als Gottesbezeichnung
  choice: „der Schrecken seines Vaters Isaak“
  alternative: „der Gott, den sein Vater Isaak fürchtete“ oder „der Ehrfurchtgebietende seines Vaters Isaak“
  rationale: Die ungewöhnliche nominale Gottesbezeichnung bleibt sichtbar; eine interpretierende Umschreibung würde ihre Härte und theologische Eigenart glätten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Plural des hebräischen Verbs wird bewusst erhalten, obwohl er im Deutschen wegen der möglichen appositionellen Lesart ungewöhnlich klingt. Gedankenstriche markieren die syntaktisch mehrdeutige Bestimmung „der Gott ihres Vaters“.
