  terminology: „Vergehen“ und „Sünde“ geben פשע und חטאת als rhetorisches Begriffspaar angemessen wieder. Die Namen Jakob und Laban sind korrekt. Die Fußnote erläutert die Bildlichkeit des Verbs, ohne sie dem Haupttext aufzuzwingen.
