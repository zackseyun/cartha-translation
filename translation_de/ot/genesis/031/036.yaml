  source_fidelity: 'Die Satzfolge und die zentralen Begriffe geben den hebräischen Text zuverlässig wieder: Jakob wird zornig, gerät mit Laban in Streit und fragt nach seinem Vergehen und seiner Sünde. Für דלק אחריו ist jedoch „erbittert verfolgen“ zu spezifisch, da „erbittert“ einen im Verb nicht ausgedrückten feindseligen Beweggrund nahelegt. Die intensive bzw. eifrige Verfolgung sollte ohne diese zusätzliche Wertung formuliert werden.'
