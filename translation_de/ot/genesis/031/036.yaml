  text: וַ/יִּ֥חַר לְ/יַעֲקֹ֖ב וַ/יָּ֣רֶב בְּ/לָבָ֑ן וַ/יַּ֤עַן יַעֲקֹב֙ וַ/יֹּ֣אמֶר לְ/לָבָ֔ן מַה פִּשְׁעִ/י֙ מַ֣ה חַטָּאתִ֔/י כִּ֥י דָלַ֖קְתָּ אַחֲרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: de
  text: 'Da wurde Jakob zornig und stritt mit Laban. Jakob antwortete und sagte zu Laban: »Was ist mein Vergehen, was ist meine Sünde, dass du mich so eifrig verfolgt hast[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch »brennen« bedeuten und beschreibt hier ein hitziges oder eifriges Verfolgen. Auch möglich: »dass du mir so hitzig nachgejagt bist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Da wurde Jakob zornig
  rationale: Die Wendung bezeichnet das Aufkommen beziehungsweise Entbrennen von Zorn. »Wurde zornig« gibt den Vorgang in natürlichem modernem Deutsch wieder.
- source_word: וַיָּרֶב בְּלָבָן
  choice: und stritt mit Laban
  rationale: ריב bezeichnet hier eine unmittelbare Auseinandersetzung. »Stritt mit« ist klar und wahrt den wechselseitig-konfrontativen Charakter, ohne eine förmliche Anklage oder Zurechtweisung vorauszusetzen.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Jakob antwortete und sagte zu Laban
  rationale: Die beiden hebräischen Erzählverben werden beibehalten. Die leicht feierliche Formulierung bleibt verständlich und zeigt, dass Jakobs Rede eine Antwort auf Labans Vorgehen ist.
- source_word: מַה פִּשְׁעִי
  choice: Was ist mein Vergehen?
  rationale: פשע bezeichnet einen schuldhaften Verstoß und kann auch den Gedanken bewusster Auflehnung tragen. »Vergehen« bewahrt hier den moralisch-rechtlichen Ton, ohne eine bestimmte Art von Schuld festzulegen.
- source_word: מַה חַטָּאתִי
  choice: Was ist meine Sünde?
  rationale: חטאת bezeichnet Sünde beziehungsweise Schuld. Die direkte Wiedergabe erhält die rhetorische Steigerung und Parallelität zu »Vergehen«.
- source_word: כִּי
  choice: dass
  rationale: כִּי verbindet hier die beiden Fragen mit Labans Verfolgung als dem Verhalten, das eine entsprechende Schuld Jakobs vorauszusetzen scheint. Die deutsche Konstruktion mit »dass« ist idiomatisch.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: du mich so erbittert verfolgt hast
  rationale: דלק kann das Brennen und übertragen ein eifriges oder hitziges Hinterherjagen bezeichnen. »Erbittert verfolgt« bringt die Intensität natürlich zum Ausdruck; die konkrete Bildhaftigkeit wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Schuldbegriffe »Vergehen« und »Sünde« sowie die doppelte Redeeinleitung wurden zur Wahrung der hebräischen Rhetorik beibehalten; die ungewöhnliche Bildkraft des Verfolgungsverbs wird durch Haupttext und Fußnote vermittelt.
