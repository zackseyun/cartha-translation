  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Ich sehe, dass euer Vater mir nicht mehr so zugewandt ist wie früher.[a] Doch der Gott meines Vaters ist mit mir gewesen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie gestern und vorgestern“; eine hebräische Wendung mit der Bedeutung „wie früher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Und er sagte zu ihnen
  rationale: Der narrative Wayyiqtol wird mit einer üblichen deutschen Erzählform wiedergegeben. „Ihnen“ bezieht sich auf Rahel und Lea; das feminine Genus des hebräischen Pronomens ist im Deutschen hier nicht eigens markiert.
- source_word: רֹאֶה אָנֹכִי
  choice: Ich sehe
  rationale: Partizip und selbstständiges Pronomen bezeichnen Jakobs gegenwärtige Wahrnehmung; das deutsche Präsens gibt dies natürlich wieder.
- source_word: אֶת פְּנֵי אֲבִיכֶן כִּי אֵינֶנּוּ אֵלַי
  choice: dass euer Vater mir nicht mehr so zugewandt ist
  rationale: Das hebräische Bild vom „Gesicht“, das nicht mehr auf Jakob gerichtet ist, bezeichnet die veränderte Haltung Labans. „Zugewandt“ bewahrt die räumliche Bildlichkeit, ohne im Deutschen unnatürlich zu wirken.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: wie früher
  rationale: Die wörtlich zeitliche Wendung ist ein hebräisches Idiom für den bisherigen oder früheren Zustand. Die Fußnote bewahrt die konkrete Ausdrucksweise.
- source_word: וֵאלֹהֵי אָבִי
  choice: Doch der Gott meines Vaters
  rationale: Das einleitende Waw erhält wegen des Gegensatzes zwischen Labans veränderter Haltung und Gottes Beistand adversative Bedeutung. Die Konstruktion „der Gott meines Vaters“ entspricht eng dem hebräischen Genitivverhältnis.
- source_word: הָיָה עִמָּדִי
  choice: ist mit mir gewesen
  rationale: Das Perfekt fasst Gottes bis in die Gegenwart wirksamen Beistand zusammen. Das deutsche Perfekt erhält sowohl den Rückblick als auch die gegenwärtige Relevanz.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֱלֹהֵי אָבִי
  choice: der Gott meines Vaters
  alternative: der Gott meines Vaters / meines Vaters Gott
  rationale: Die gewählte Form ist modernes, natürliches Deutsch und bewahrt zugleich den familiären Bundesbezug der hebräischen Konstruktion, ohne ihn dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „zugewandt“ bewahrt einen Teil des hebräischen Bildes vom Gesicht beziehungsweise von der Ausrichtung, vermeidet aber die im Deutschen schwerfällige Formulierung „das Gesicht eures Vaters ist nicht zu mir“.
