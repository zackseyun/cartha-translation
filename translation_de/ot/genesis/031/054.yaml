base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: de
  text: Dann brachte Jakob auf dem Berg ein Schlachtopfer dar und rief seine Brüder[a] zusammen, um Brot zu essen. Sie aßen Brot und verbrachten die Nacht auf dem Berg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Verwandten“; das hebräische Wort für „Brüder“ kann in diesem Zusammenhang auch männliche Verwandte oder Gefährten bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: brachte ... ein Schlachtopfer dar
  rationale: Die figura etymologica aus Verb und Substantiv bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. Die deutsche Wendung ist natürlich und bewahrt den kultischen Sinn, ohne die schwerfällige Wiederholung „opferte ein Opfer“.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: הַר kann „Berg“ oder „Bergland“ bedeuten; die bestimmte, zweimal wiederholte Ortsangabe wird hier direkt als „auf dem Berg“ wiedergegeben.
- source_word: וַיִּקְרָא
  choice: rief ... zusammen
  rationale: קרא bedeutet grundsätzlich „rufen“. Mit Personen und dem anschließenden Zweck des Essens bezeichnet es hier ein Zusammenrufen; diese Wiedergabe bleibt quellennah und ist im Deutschen idiomatisch.
- source_word: לְאֶחָיו
  choice: seine Brüder
  rationale: אָח bezeichnet wörtlich einen Bruder, kann im Kontext aber auch weitere männliche Verwandte oder Gefährten einschließen. Der Haupttext bewahrt die konkrete Verwandtschaftsbezeichnung.
- source_word: לֶאֱכָל לָחֶם
  choice: um Brot zu essen
  rationale: Die Wendung bedeutet wörtlich „Brot essen“ und kann idiomatisch allgemein eine Mahlzeit bezeichnen. Die wörtliche Form bewahrt Ausdruck und Wiederholung des Hebräischen.
- source_word: וַיֹּאכְלוּ לֶחֶם
  choice: Sie aßen Brot
  rationale: Die Wiederholung von לֶחֶם wird beibehalten und lässt zugleich den Charakter einer gemeinsamen Mahlzeit erkennen, ohne ihn erklärend in den Text einzutragen.
- source_word: וַיָּלִינוּ
  choice: verbrachten die Nacht
  rationale: לון bezeichnet das Übernachten oder Verweilen über Nacht. „Verbrachten die Nacht“ ist klares, modernes Standarddeutsch.
theological_decisions:
- issue: Bedeutung von „seine Brüder“ im Bundeskontext
  choice: Im Haupttext steht „seine Brüder“.
  alternative: „seine Verwandten“ oder „seine Angehörigen/Gefährten“
  rationale: Das Hebräische verwendet die familiäre Bezeichnung אָח, deren Bezug hier weiter als auf leibliche Brüder reichen kann. Die direkte Wiedergabe erhält die Mehrdeutigkeit; die mögliche weitere Bedeutung wird in der Fußnote genannt.
- issue: Verhältnis von Opfer und anschließender Mahlzeit
  choice: Das Opfer und das Brotessen werden als aufeinanderfolgende Handlungen wiedergegeben.
  alternative: „Schlachtmahl“ oder „Opfermahl“
  rationale: Ein gemeinsames Opfermahl ist im Kontext möglich, wird jedoch vom Vers nicht ausdrücklich mit einem einzigen Fachausdruck bezeichnet. Die Übersetzung vermeidet daher eine theologische beziehungsweise kultische Präzisierung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung „Brot essen“ bleibt erhalten; die ungewöhnliche figura etymologica beim Opfer wird zugunsten einer natürlichen deutschen Opferformel geglättet. Der Fußnotenmarker steht unmittelbar nach der einschlägigen Aussage.
