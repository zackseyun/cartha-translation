    issue: Die kausale Funktion des ersten כִּי bleibt im Entwurf nur implizit.
    rationale: „Ich hatte Angst“ ist zwar im Kontext verständlich, doch „Denn ich hatte Angst“ bildet die ausdrückliche Begründung des Grundtexts vollständiger ab.
  revised_text: 'Da antwortete Jakob Laban: „Denn ich hatte Angst; ich dachte, du könntest mir deine Töchter entreißen.“'
