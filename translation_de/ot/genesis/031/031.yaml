  to: 'Da antwortete Jakob Laban: „Denn ich hatte Angst; ich dachte, du könntest mir deine Töchter entreißen.“'
  rationale: Die Revision fügt die explizite kausale Einleitung „Denn“ ein und ordnet die beiden Begründungssätze im Deutschen natürlich. „Entreissen“ trägt die semantische Stärke von גזל („gewaltsam bzw. widerrechtlich an sich reißen“) ohne die möglicherweise zu enge Festlegung „mit Gewalt“ im Sinn physischer Gewalt. Die Redeformel wird weiterhin idiomatisch verdichtet.
