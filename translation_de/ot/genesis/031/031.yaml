base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: de
  text: 'Da antwortete Jakob Laban: „Denn ich hatte Angst; ich dachte, du könntest mir deine Töchter entreißen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Da antwortete
  rationale: Die deutsche Redeformel „antwortete“ gibt die dialogische Funktion beider hebräischen Verben natürlich wieder; „antwortete und sagte“ wäre im modernen Deutschen unnötig schwerfällig.
- source_word: כִּי יָרֵאתִי
  choice: Ich hatte Angst
  rationale: Das erste כִּי begründet Jakobs heimliches Handeln. Im Deutschen ergibt sich der kausale Zusammenhang bereits aus der Antwort; „Ich hatte Angst“ ist klar und idiomatisch.
- source_word: כִּי אָמַרְתִּי
  choice: denn ich dachte
  rationale: אמר bezeichnet hier naheliegend Jakobs inneres Sprechen. „Ich dachte“ vermittelt diese Funktion natürlich, ohne den Aussagegehalt zu verändern.
- source_word: פֶּן
  choice: Du könntest
  rationale: פֶּן führt den befürchteten möglichen Ausgang ein. Der deutsche Konjunktiv mit „könntest“ drückt diese Befürchtung natürlicher aus als das gehobene „damit nicht“ oder „auf dass nicht“.
- source_word: תִּגְזֹל
  choice: mit Gewalt wegnehmen
  rationale: גזל bezeichnet ein gewaltsames oder widerrechtliches Entreißen. „Mit Gewalt wegnehmen“ bewahrt diese stärkere Bedeutung und passt zum familiären Kontext besser als „rauben“.
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: mir deine Töchter ... wegnehmen
  rationale: Der deutsche Dativ „mir“ zusammen mit „wegnehmen“ gibt die Trennung aus Jakobs Gemeinschaft idiomatisch wieder; „deine Töchter“ bewahrt die Perspektive der Anrede an Laban.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte hebräische Redeeinleitung wird idiomatisch verdichtet. Der innere Sprechakt wird als „dachte“ wiedergegeben, während die gewaltsame Nuance von גזל ausdrücklich erhalten bleibt.
