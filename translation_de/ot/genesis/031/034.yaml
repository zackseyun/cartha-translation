base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: de
  text: Rahel hatte die Terafim[a] genommen, sie in das Sattelkissen des Kamels[b] gelegt und sich daraufgesetzt. Laban tastete das ganze Zelt ab, fand sie aber nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hausgötter“ oder „Götzenbilder“. Der hebräische Ausdruck bezeichnet häusliche Kultgegenstände.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Kamelsattel“. Gemeint ist wahrscheinlich ein gepolsterter Teil der Reitausrüstung des Kamels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: die Terafim
  rationale: Die Transliteration bewahrt den spezifischen, in seiner genauen Gestalt nicht völlig sicheren hebräischen Begriff für häusliche Kultgegenstände; eine verständliche Erklärung steht in der Fußnote.
- source_word: בְּכַר הַגָּמָל
  choice: in das Sattelkissen des Kamels
  rationale: כַּר bezeichnet ein Kissen oder Polster; im Zusammenhang mit dem Kamel ist ein gepolsterter Teil der Reitausrüstung gemeint.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: und sich daraufgesetzt
  rationale: Die Form führt die vorausliegende Handlung weiter; das zusammengesetzte Perfekt fügt sich im Deutschen natürlich in die mit Plusquamperfekt eingeleitete Hintergrundsequenz ein.
- source_word: וַיְמַשֵּׁשׁ
  choice: tastete ... ab
  rationale: מששׁ bezeichnet eine Suche durch Berühren und wird damit genauer wiedergegeben als durch das allgemeine „durchsuchte“.
- source_word: כָּל הָאֹהֶל
  choice: das ganze Zelt
  rationale: Natürliche und genaue Wiedergabe der Gesamtheit des bestimmten Zeltes.
- source_word: וְלֹא מָצָא
  choice: fand sie aber nicht
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus dem Kontext ergänzt; „aber“ gibt den Gegensatz zwischen Suchen und erfolglosem Finden natürlich wieder.
- source_word: וְרָחֵל
  choice: Rahel aber
  rationale: Das Waw markiert hier den Übergang zur erklärenden Hintergrundhandlung; „aber“ stellt zugleich den Gegensatz zu Labans Suche heraus, ohne ein nicht vorhandenes Zeitadverb einzuführen.
theological_decisions:
- issue: Bezeichnung der תְּרָפִים
  choice: Terafim
  alternative: Hausgötter / Götzenbilder
  rationale: Die Transliteration vermeidet eine vorschnelle Festlegung darauf, ob der Ausdruck primär Gottheiten, ihre Bilder oder andere häusliche Kultobjekte bezeichnet. Die Fußnote erschließt die Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge macht die vorausliegende Verbergung durch das Plusquamperfekt deutlich. „Tastete ... ab“ erhält die konkrete Bedeutung der Suche durch Berührung.
