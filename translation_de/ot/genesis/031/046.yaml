source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: de
  text: 'Da sagte Jakob zu seinen Brüdern[a]: »Sammelt Steine!« Sie nahmen Steine und errichteten einen Steinhaufen. Dort aßen sie bei dem Steinhaufen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brüdern« können hier auch Jakobs männliche Verwandte oder Gefährten gemeint sein, nicht nur leibliche Brüder.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Dort aßen sie auf dem Steinhaufen.« Das hebräische Verhältniswort kann wörtlicher mit »auf« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: zu seinen Brüdern
  rationale: אָח bedeutet gewöhnlich »Bruder«, kann aber auch männliche Verwandte oder Gefährten bezeichnen. Die quellennähere Wiedergabe bleibt im Haupttext; die weitere Bedeutung wird in einer Fußnote erläutert.
- source_word: לִקְטוּ אֲבָנִים
  choice: Sammelt Steine!
  rationale: Der Imperativ von לקט bezeichnet das Auflesen oder Zusammentragen; »sammelt« ist im Deutschen natürlich und präzise.
- source_word: וַיַּעֲשׂוּ גָל
  choice: errichteten einen Steinhaufen
  rationale: גַּל bezeichnet hier einen Haufen aus Steinen. »Steinhaufen« macht das Material ausdrücklich und liest sich natürlicher als das bloße »Haufen«.
- source_word: עַל הַגָּל
  choice: bei dem Steinhaufen
  rationale: עַל kann örtlich »auf«, aber je nach Zusammenhang auch »bei/an« bedeuten. »Bei« ergibt eine natürliche Szene, ohne die mögliche wörtliche Lesart »auf« auszuschließen; diese wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Erzähl- und Befehlssätze folgen dem hebräischen Ablauf; »errichteten« gibt das Anlegen des als Denkzeichen dienenden Steinhaufens idiomatisch wieder.
