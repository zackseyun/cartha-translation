base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: de
  text: 'Da antwortete Laban und sagte zu Jakob: „Die Töchter sind meine Töchter, die Söhne sind meine Söhne, die Herde ist meine Herde, und alles, was du siehst, gehört mir. Doch was kann ich heute für diese meine Töchter tun oder für ihre Kinder, die sie geboren haben[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Söhnen, die sie geboren haben“. Das hebräische Wort kann hier entweder Söhne im engeren Sinn oder Kinder allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Da antwortete Laban und sagte zu Jakob
  rationale: Bewahrt die hebräische Doppelung „antwortete und sagte“ in einer im Deutschen verständlichen, würdevollen Erzählform.
- source_word: הַבָּנוֹת בְּנֹתַי וְהַבָּנִים בָּנַי
  choice: Die Töchter sind meine Töchter, die Söhne sind meine Söhne
  rationale: Die wiederholte Substantivform erhält Labans nachdrückliche familiäre und besitzanzeigende Ansprüche; בָּנִים wird hier parallel zu „Töchter“ als „Söhne“ wiedergegeben.
- source_word: וְהַצֹּאן צֹאנִי
  choice: die Herde ist meine Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh; „Herde“ wahrt den Kollektivsinn und die rhetorische Wiederholung.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: und alles, was du siehst, gehört mir
  rationale: Die deutsche Besitzkonstruktion ist natürlich und gibt Labans umfassenden Anspruch deutlich wieder.
- source_word: מָה אֶעֱשֶׂה ... לְ
  choice: was könnte ich ... antun
  rationale: Die Präposition לְ kann hier die von einer Handlung betroffenen Personen markieren. Im Kontext seiner bestrittenen Ansprüche und der anschließenden Bundesvereinbarung ist die rhetorische Frage sinnvoll als Erklärung zu verstehen, dass Laban seinen Töchtern und Enkeln nichts antun könne beziehungsweise wolle; „könnte“ bewahrt den modalen Gehalt.
- source_word: הַיּוֹם
  choice: heute
  rationale: Natürliche moderne Wiedergabe des temporalen Adverbs, ohne unnötig altertümliches „an diesem Tag“.
- source_word: לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: ihren Kindern, die sie geboren haben
  rationale: בְּנֵיהֶן kann enger „ihren Söhnen“ oder allgemein „ihren Kindern“ bedeuten. Im Bezug auf die Nachkommen der Töchter ist „Kinder“ im Deutschen kontextuell natürlich; die engere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nachdrücklichen Wiederholungen in Labans Rede bleiben erhalten. „Diesen meinen Töchtern“ spiegelt die betonte hebräische Form, ohne den Satz unnötig zu glätten; die Fußnote bewahrt die echte Bedeutungsbreite von בְּנֵיהֶן.
