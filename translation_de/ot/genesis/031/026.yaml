  register: Moderne, würdige Standardsprache. Die direkte Rede bewahrt Labans scharfen Vorwurf. Missverständliche Wörtlichkeit wird im Haupttext idiomatisch wiedergegeben, während die hebräischen Bilder in den Fußnoten dokumentiert sind.
