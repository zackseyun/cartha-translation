  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַ/תִּגְנֹ֖ב אֶת לְבָבִ֑/י וַ/תְּנַהֵג֙ אֶת בְּנֹתַ֔/י כִּ/שְׁבֻי֖וֹת חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: de
  text: 'Da sagte Laban zu Jakob: »Was hast du getan? Du hast mich hintergangen[a] und meine Töchter fortgetrieben wie Kriegsgefangene[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mein Herz gestohlen«. Gemeint ist, dass Jakob heimlich und hinter Labans Rücken gehandelt hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »wie Gefangene des Schwertes«, also wie Frauen, die im Krieg gefangen genommen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Was hast du getan?
  rationale: Die anklagende Frage wird im Deutschen natürlich und mit fortwirkender Gegenwartsrelevanz im Perfekt wiedergegeben.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Du hast mich hintergangen
  rationale: Die Wendung lautet wörtlich »du hast mein Herz gestohlen«, bezeichnet hier aber ein heimliches Handeln hinter Labans Rücken. Die wörtliche deutsche Formulierung würde vor allem romantisch verstanden und den Sinn irreführend verschieben; die Fußnote bewahrt das hebräische Bild.
- source_word: לְבָבִי
  choice: mich
  rationale: Das hebräische »mein Herz« ist Bestandteil der idiomatischen Wendung und wird im Haupttext durch deren deutschen Sinn wiedergegeben.
- source_word: וַתְּנַהֵג
  choice: fortgetrieben
  rationale: Das Verb kann »führen« oder »treiben« bedeuten; angesichts des folgenden Bildes von Kriegsgefangenen bringt »fortgetrieben« den von Laban behaupteten Zwang zum Ausdruck.
- source_word: בְּנֹתַי
  choice: meine Töchter
  rationale: Die familiäre Bezeichnung und Labans Besitzanspruch in der direkten Rede bleiben unverändert erhalten.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: wie Kriegsgefangene
  rationale: Die wörtliche Wendung »Gefangene des Schwertes« meint Frauen, die im Krieg gefangen genommen wurden. »Kriegsgefangene« vermittelt dieses Bild im modernen Deutschen klar; die wörtliche Form steht in der Fußnote.
theological_decisions: []
