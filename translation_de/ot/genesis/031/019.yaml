source:
  edition: WLC
  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: de
  text: Laban war weggegangen, um seine Herde zu scheren, und Rahel stahl die Hausgötzen[a], die ihrem Vater gehörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Terafim; auch mit „Hausgötter“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: war weggegangen
  rationale: Das hebräische Qatal liefert hier Hintergrundinformation zur folgenden Haupthandlung. Das Plusquamperfekt gibt wieder, dass Laban bereits fort war, als Rahel handelte; „weggegangen“ macht seine Abwesenheit natürlich deutlich.
- source_word: לִגְזֹז
  choice: um … zu scheren
  rationale: Der Infinitiv bezeichnet das Scheren von Tieren einer Herde; „scheren“ ist die präzise und geläufige deutsche Entsprechung.
- source_word: צֹאנוֹ
  choice: seine Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen. „Herde“ ist im Deutschen idiomatisch und wahrt den möglichen Umfang des Begriffs.
- source_word: וַתִּגְנֹב
  choice: stahl
  rationale: גנב bedeutet eindeutig „stehlen“. Die moralisch-rechtliche Aussage wird nicht zu einem bloßen heimlichen Nehmen abgeschwächt.
- source_word: הַתְּרָפִים
  choice: die Hausgötzen
  rationale: תְּרָפִים bezeichnet häusliche Kultbilder. „Hausgötzen“ vermittelt sowohl den häuslichen Zusammenhang als auch ihren Charakter als verehrte Bilder; die Transliteration und eine weitere geläufige Wiedergabe stehen in der Fußnote.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: die ihrem Vater gehörten
  rationale: Die Wendung bezeichnet Besitz. Diese Formulierung ist klares, natürliches modernes Deutsch.
- source_word: וְ / וַ
  choice: und
  rationale: Die hebräische Satzverknüpfung wird schlicht mit „und“ wiedergegeben, ohne einen nicht ausdrücklich vorhandenen Zeitmarker wie „nun“ einzuführen.
theological_decisions:
- issue: Wiedergabe von תְּרָפִים als Bezeichnung häuslicher Kultgegenstände
  choice: Hausgötzen
  alternative: Terafim; Hausgötter
  rationale: „Hausgötzen“ ist verständlich und macht die religiöse Funktion der Gegenstände sichtbar, ohne eine besondere konfessionelle Deutung einzutragen. Die lexikalischen Alternativen werden zur Wahrung der kulturellen Eigenart in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt kennzeichnet Labans Fortgang als Hintergrund der anschließenden Handlung. Der Fußnotenmarker steht unmittelbar bei „Hausgötzen“, auf das sich die Anmerkung bezieht.
