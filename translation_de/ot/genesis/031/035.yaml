base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: de
  text: 'Da sagte sie zu ihrem Vater: »Mein Herr möge mir nicht böse sein, weil ich vor dir nicht aufstehen kann; denn ich habe meine Tage.« Da suchte er, fand aber die Hausgötter[a] nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: die Terafim; gemeint sind Hausgötter beziehungsweise häusliche Kultbilder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Mein Herr möge mir nicht böse sein
  rationale: Die hebräische Wendung bezeichnet hier höflich das Erzürnen bzw. Missfallen des Angesprochenen. Die deutsche Formulierung ist idiomatisch und bewahrt Rachels ehrerbietige Anrede; אֲדֹנִי meint hier keine Gottesbezeichnung.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: weil ich vor dir nicht aufstehen kann
  rationale: Gibt sowohl die körperliche Bedeutung von קום als auch die Gegenwarts- und Höflichkeitsnuance von מִפָּנֶיךָ natürlich wieder.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: denn ich habe meine Tage
  rationale: Die hebräische Umschreibung bezeichnet die Menstruation. »Ich habe meine Tage« wahrt den euphemistischen Ton und ist im modernen Deutschen unmittelbar verständlich.
- source_word: וַיְחַפֵּשׂ
  choice: Da suchte er weiter
  rationale: Der Zusammenhang zeigt, dass Laban seine Suche fortsetzt. »Weiter« macht den fortlaufenden Handlungsgang im Deutschen deutlich, ohne einen neuen Inhalt einzuführen.
- source_word: הַתְּרָפִים
  choice: die Hausgötter
  rationale: תְּרָפִים bezeichnet häusliche Kultgegenstände oder Götterbilder. »Hausgötter« ist knapp, verständlich und lässt die genaue Gestalt der Gegenstände offen; die alternative Bezeichnung wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von תְּרָפִים
  choice: Hausgötter
  alternative: Terafim; Hausgötzen; häusliche Götterbilder
  rationale: Der Ausdruck bezeichnet Gegenstände eines häuslichen Kultes, deren genaue Form und Funktion nicht völlig sicher sind. »Hausgötter« vermittelt den religiösen und häuslichen Bezug, ohne eine präzisere Gestalt vorzutäuschen, als der Quellenausdruck erkennen lässt.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Rachels ehrerbietige Anrede bleibt erhalten; die Menstruation wird entsprechend dem hebräischen Euphemismus zurückhaltend, aber verständlich ausgedrückt.
