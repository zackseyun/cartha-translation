  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: de
  text: Denn der ganze Reichtum, den Gott unserem Vater weggenommen hat[a], gehört uns und unseren Kindern. Tu nun alles, was Gott dir gesagt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerettet“ beziehungsweise „befreit hat“. Das hebräische Verb bezeichnet häufig Rettung oder Befreiung; hier geht es darum, dass Gott den Reichtum Laban entzogen und Jakobs Familie zukommen lassen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung ein, mit der Rahel und Lea ihre Zustimmung zu Jakobs Vorhaben erklären.
- source_word: כָל הָעֹשֶׁר
  choice: der ganze Reichtum
  rationale: עֹשֶׁר bezeichnet Reichtum beziehungsweise Vermögen; „Reichtum“ ist hier natürlich und umfasst im Erzählzusammenhang besonders den Viehbesitz.
- source_word: הִצִּיל
  choice: entrissen hat
  rationale: Das Hifil von נצל bezeichnet häufig Retten oder Befreien, kann aber auch das Entziehen aus der Gewalt oder dem Besitz eines anderen ausdrücken. „Entrissen“ bewahrt diesen kräftigen Beiklang und passt zur Übertragung von Labans Reichtum auf Jakobs Haus.
- source_word: מֵאָבִינוּ
  choice: unserem Vater
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt des Entziehens; im Deutschen verlangt „entreißen“ den Dativ.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: gehört uns und unseren Kindern
  rationale: Gibt die hebräische Zugehörigkeitskonstruktion idiomatisch und eindeutig wieder.
- source_word: וְעַתָּה
  choice: also jetzt
  rationale: Markiert den Übergang von der Begründung zur daraus folgenden Aufforderung und bewahrt sowohl das folgernde als auch das zeitliche Moment.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: alles, was Gott dir gesagt hat
  rationale: Bewahrt die Totalität der hebräischen Wendung כֹּל אֲשֶׁר in natürlichem Deutsch.
- source_word: עֲשֵׂה
  choice: Tu
  rationale: Der knappe Imperativ entspricht der Prägnanz des Hebräischen; sein Objekt steht bereits im vorangehenden Relativsatz.
theological_decisions:
- issue: Gottes Handeln am Reichtum Labans
  choice: „entrissen hat“
  alternative: „gerettet/befreit hat“ oder „weggenommen hat“
  rationale: Die Grundbedeutung des Verbs kann Rettung oder Befreiung ausdrücken, doch hier ist Reichtum das Objekt und Laban derjenige, dem er entzogen wird. „Entrissen“ erhält die Vorstellung einer Befreiung aus fremder Gewalt, ohne die Handlung vorschnell als bloße Wegnahme oder als Diebstahl zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „Tu also jetzt“ klingt natürlich, hält die abschließende Aufforderung knapp und gibt die Folgerung aus der vorausgehenden Begründung wieder.
