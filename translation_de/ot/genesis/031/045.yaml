  text: וַ/יִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַ/יְרִימֶ֖/הָ מַצֵּבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: de
  text: Da nahm Jakob einen Stein und stellte ihn als Steinmal[a] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Steinsäule“, „als Gedenkstein“ oder „als aufgerichteten Stein“. Das hebräische Wort מַצֵּבָה bezeichnet ein aufgerichtetes steinernes Mal oder eine Säule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Qal-Wayyiqtol von לקח bedeutet gewöhnlich „nehmen“; die Vergangenheitsform gibt die fortlaufende hebräische Erzählung im Deutschen natürlich wieder.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Gebräuchliche deutsche Namensform.
- source_word: אָבֶן
  choice: einen Stein
  rationale: Der Singular bezeichnet einen einzelnen Stein; der unbestimmte Artikel ist im Deutschen erforderlich und natürlich.
- source_word: וַיְרִימֶהָ
  choice: stellte ihn … auf
  rationale: Die Verbform mit femininem Objektsuffix bezieht sich auf אֶבֶן. „Aufstellen“ gibt das Errichten des Steins idiomatisch und präzise wieder.
- source_word: מַצֵּבָה
  choice: als Steinmal
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein beziehungsweise ein steinernes Mal. „Steinmal“ bewahrt den konkreten Charakter und legt weder ausschließlich eine kultische noch ausschließlich eine erinnernde Funktion fest.
theological_decisions:
- issue: Wiedergabe von מַצֵּבָה bei möglichen erinnernden oder kultischen Bezügen
  choice: Steinmal
  alternative: Steinsäule; Gedenkstein; aufgerichteter Stein
  rationale: Der Vers beschreibt zunächst das Errichten eines Steins, ohne dessen genaue Funktion ausdrücklich festzulegen. „Steinmal“ wahrt diese Offenheit und vermeidet eine vorschnelle kultische oder rein memoriale Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bildet den knappen Fortgang der hebräischen Erzählung natürlich ab.
