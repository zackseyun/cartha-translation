  text: וַ/תַּ֤עַן רָחֵל֙ וְ/לֵאָ֔ה וַ/תֹּאמַ֖רְנָה ל֑/וֹ הַ/ע֥וֹד לָ֛/נוּ חֵ֥לֶק וְ/נַחֲלָ֖ה בְּ/בֵ֥ית אָבִֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: de
  text: 'Da antworteten Rahel und Lea und sagten zu ihm: „Haben wir noch Anteil und Erbbesitz im Haus unseres Vaters?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus unseres Vaters“ kann außer dem eigentlichen Haushalt auch die Familie und ihren Besitz bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: Da antworteten
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da“ gibt den erzählerischen Anschluss und den Antwortcharakter natürlich wieder.
- source_word: רָחֵל וְלֵאָה
  choice: Rahel und Lea
  rationale: Die Namen folgen den etablierten deutschen Bibelnamensformen.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: und sagten zu ihm
  rationale: Der Plural und das ausdrücklich genannte indirekte Objekt werden beibehalten.
- source_word: הַעוֹד לָנוּ
  choice: Haben wir noch
  rationale: Die deutsche Besitzkonstruktion gibt den Dativ לָנוּ idiomatisch wieder; „noch“ bewahrt die zeitliche Nuance.
- source_word: חֵלֶק
  choice: Anteil
  rationale: „Anteil“ bezeichnet im Zusammenhang mit Familienvermögen einen zustehenden Teil und ist im modernen Deutsch natürlich.
- source_word: וְנַחֲלָה
  choice: und Erbbesitz
  rationale: „Erbbesitz“ gibt die Bedeutung eines ererbten beziehungsweise erblich zustehenden Besitzes genauer wieder als das auch abstrakt verstandene „Erbe“.
- source_word: בְּבֵית אָבִינוּ
  choice: im Haus unseres Vaters
  rationale: Die formal nahe Wendung bewahrt die Bedeutungsweite von בֵּית, das Haus, Hausgemeinschaft, Familie oder Familienbesitz bezeichnen kann.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die doppelte Vermögensbezeichnung „Anteil und Erbbesitz“ bleiben erhalten; die kulturelle Bedeutungsweite von „Haus“ wird nicht im Haupttext vereindeutigt.
