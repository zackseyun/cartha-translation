  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des Hebräischen zutreffend wieder: Gott kommt zu Laban, dem Aramäer, in einem nächtlichen Traum und warnt ihn hinsichtlich Jakobs. Die polare Wendung מִטּוֹב עַד רָע wird zu Recht als umfassendes Redeverbot verstanden, ohne eine bestimmte Art von Aussage einzuengen.'
