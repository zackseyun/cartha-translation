  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: de
  text: 'Doch Gott kam zu Laban, dem Aramäer, in einem nächtlichen Traum und sagte zu ihm: „Hüte dich davor, mit Jakob zu reden, sei es zum Guten oder zum Bösen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Guten bis zum Bösen“; die Wendung meint hier alles, ob günstig oder ungünstig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier im erzählenden Zusammenhang Gottes Kommen zu Laban; „erschien“ wäre stärker auslegend, da kein ausdrückliches Erscheinungsverb steht.
- source_word: לָבָן הָאֲרַמִּי
  choice: Laban, dem Aramäer
  rationale: אֲרַמִּי ist die ethnische Bezeichnung „Aramäer“; „Syrer“ folgt älterer Tradition, entspricht dem hebräischen Ethnonym aber weniger genau.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: nachts in einem Traum
  rationale: Die Wiedergabe drückt sowohl das Traummedium als auch den Zeitpunkt natürlich und präzise aus.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich
  rationale: Die deutsche Warnformel gibt den reflexiven Imperativ mit לְךָ knapp, würdig und mit angemessener Dringlichkeit wieder.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: zu Jakob irgendetwas zu sagen
  rationale: פֶּן formuliert eine Warnung vor der Handlung. Das im Kontext implizierte „irgendetwas“ macht die Reichweite der folgenden meristischen Wendung im Deutschen verständlich.
- source_word: מִטּוֹב עַד רָע
  choice: sei es Gutes oder Böses
  rationale: Wörtlich steht „vom Guten bis zum Bösen“. Als meristische Wendung umfasst sie hier das gesamte Spektrum möglicher Äußerungen.
theological_decisions:
- issue: Identität von אֱלֹהִים
  choice: Gott
  alternative: Götter / ein göttliches Wesen
  rationale: Das Verb steht im Singular, und der unmittelbare Erzählzusammenhang bezeichnet eindeutig Gott als handelndes Subjekt, ohne dass eine dogmatische Ergänzung nötig ist.
- issue: Reichweite des Verbots מִטּוֹב עַד רָע
  choice: Laban soll Jakob überhaupt nichts sagen, weder Gutes noch Böses
  alternative: Laban soll lediglich keine gute oder böse Wertung äußern
  rationale: Die polare Formel „vom Guten bis zum Bösen“ ist hier umfassend zu verstehen. Die Übersetzung wahrt die Pole und verdeutlicht zugleich ihre idiomatische Gesamtbedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Hüte dich“ bewahrt die Eindringlichkeit der hebräischen Warnformel, ohne altertümlich zu wirken.
