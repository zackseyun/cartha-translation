  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: de
  text: 'Und nun komm: Lass uns einen Bund schließen, ich und du; er soll als Zeuge zwischen mir und dir dienen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht bei »einen Bund schließen«: »einen Bund schneiden«. Das ist die übliche hebräische Wendung für das Schließen oder Errichten eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt die verbindende Fortführung und leitet zugleich den nächsten Schritt im Gespräch natürlich ein.
- source_word: לְכָה
  choice: komm
  rationale: Die formal von הלך abgeleitete Aufforderung dient hier idiomatisch als Einladung beziehungsweise Aufruf; »komm« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: נִכְרְתָה בְרִית
  choice: Lass uns einen Bund schließen
  rationale: כרת mit בְּרִית ist die feste hebräische Wendung für das Schließen eines Bundes. Die natürliche deutsche Entsprechung »einen Bund schließen« bewahrt sowohl den Bundbegriff als auch das Bild des verbindlichen Abschlusses.
- source_word: אֲנִי וָאָתָּה
  choice: ich und du
  rationale: Die ausdrückliche Nennung beider Parteien und die hebräische Reihenfolge bleiben erhalten; die Formulierung setzt einen bewussten bilateralen Akzent.
- source_word: וְהָיָה לְעֵד
  choice: er soll als Zeuge dienen
  rationale: Das maskuline Verb kann sich grammatisch auf den Bund beziehen. »soll … dienen« gibt den volitiven Sinn und לְ als Funktionsangabe idiomatisch wieder.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Folgt der ausdrücklichen persönlichen Formulierung und der Reihenfolge des Hebräischen.
theological_decisions:
- issue: Bezug von וְהָיָה (»er soll … sein«)
  choice: Der Bund wird im Haupttext als Zeuge bezeichnet.
  alternative: Ein später errichtetes Zeichen beziehungsweise der Steinhaufen ist als Zeuge gemeint.
  rationale: Im unmittelbaren Satz ist בְרִית (»Bund«, maskulin) das naheliegende grammatische Bezugswort. Der weitere Erzählverlauf konkretisiert die Zeugenfunktion durch Steinhaufen und Gedenkstein, doch sollte diese spätere Präzisierung nicht rückwirkend in den Vers eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die auffordernde Gesprächsbewegung ab; das Semikolon hält die eng verbundenen Aussagen zusammen. »Bund« bleibt als bedeutungsstarker biblischer Rechts- und Beziehungsbegriff erhalten.
