  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: de
  text: Er trieb all sein Vieh vor sich her und nahm seinen gesamten Besitz mit, den er erworben hatte – das Vieh, das er in Paddan-Aram erworben hatte –, um zu seinem Vater Isaak ins Land Kanaan[a] zu ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Richtungsform: „kanaanwärts“ beziehungsweise „zum Land Kanaan hin“.'
    reason: Die hebräische direktive Form אַרְצָה bezeichnet ausdrücklich die Bewegung auf Kanaan zu.
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: trieb … vor sich her
  rationale: נהג bezeichnet hier das Antreiben und Fortbewegen von Herdentieren. Die Formulierung gibt den Hirtenkontext natürlich und präzise wieder.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: מִקְנֶה ist eine Sammelbezeichnung für Nutz- und Herdentiere. „Vieh“ ist im Deutschen breit genug und in diesem Zusammenhang geläufig.
- source_word: רְכֻשׁוֹ
  choice: seinen gesamten Besitz
  rationale: רְכוּשׁ bezeichnet erworbenes, insbesondere bewegliches Eigentum. „Besitz“ wahrt den weiten Sinn; „gesamten“ entspricht כָּל.
- source_word: רָכָשׁ
  choice: erworben hatte
  rationale: Die wirtschaftliche Bedeutung des Verbs und seine Wiederholung im hebräischen Satz bleiben erhalten.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: das Vieh, das er … erworben hatte
  rationale: Die schwerfällige hebräische Verbindung bezeichnet Vieh als erworbenen Besitz. Die Wiedergabe erhält die erläuternde Wiederaufnahme, ohne eine im Deutschen unnatürliche Nominalhäufung zu erzeugen.
- source_word: בְּפַדַּן אֲרָם
  choice: in Paddan-Aram
  rationale: Der Ortsname wird in einer etablierten deutschen Umschrift wiedergegeben.
- source_word: לָבוֹא
  choice: um … zu ziehen
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise das Ziel der Bewegung. „Ziehen“ passt zu Jakobs Reise mit Hausstand und Herden.
- source_word: אַרְצָה כְּנָעַן
  choice: ins Land Kanaan
  rationale: Die direktive Endung bezeichnet eine Bewegung auf Kanaan zu. „Ins Land Kanaan“ drückt dieses Ziel im Deutschen idiomatisch aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Beim Vieh wird das konkrete Antreiben ausgedrückt; für den übrigen Besitz wird das Verb idiomatisch mit „nahm … mit“ ergänzt. Der Gedankenstrich bewahrt die erläuternde Wiederaufnahme und die auffällige Wiederholung des Erwerbens.
