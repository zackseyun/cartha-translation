base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: de
  text: Und Laban holte Jakob ein.[a] Jakob hatte sein Zelt im Bergland aufgeschlagen, und Laban schlug mit seinen Verwandten[b] sein Lager im Bergland von Gilead auf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erreichte Jakob« beziehungsweise »überholte Jakob«. Das Verb bezeichnet das Erreichen eines Verfolgten, nicht notwendig seine Gefangennahme.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit seinen Brüdern«; gemeint sind hier wahrscheinlich Verwandte oder Angehörige seiner Sippe.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »am Berg Gilead« beziehungsweise »im Gebirge Gileads«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: holte … ein
  rationale: Das Verb נשׂג bezeichnet hier das Einholen eines Verfolgten; die deutsche Wendung bewahrt den Verfolgungszusammenhang, ohne eine Gefangennahme auszusagen.
- source_word: תָּקַע אֶת־אָהֳלוֹ
  choice: hatte sein Zelt … aufgeschlagen
  rationale: תקע mit אהל ist die übliche Verbindung für das Aufschlagen eines Zeltes. Das Plusquamperfekt macht deutlich, dass Jakob bei Labans Eintreffen bereits lagerte.
- source_word: בָּהָר
  choice: im Bergland
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen. Der regionale Sinn passt hier zum Reise- und Lagerkontext.
- source_word: תָּקַע אֶת־אֶחָיו
  choice: schlug mit seinen Verwandten sein Lager … auf
  rationale: Die hebräische Formulierung ist knapp und elliptisch. Natürliches Deutsch ergänzt das aus dem Parallelglied erschließbare Lagern, ohne ausdrücklich mehrere Zelte in den Text einzutragen.
- source_word: אֶחָיו
  choice: seinen Verwandten
  rationale: אָח kann über leibliche Brüder hinaus Angehörige der weiteren Verwandtschaft oder Sippe bezeichnen; bei Labans Begleitern ist dieser weitere Sinn wahrscheinlich.
- source_word: בְּהַר הַגִּלְעָד
  choice: im Bergland Gilead
  rationale: Die Wendung kann einen Berg oder die gebirgige Landschaft Gileads bezeichnen. Die regionale Wiedergabe ist im Kontext natürlich, während die engere Möglichkeit in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Bergland« folgt der Struktur des Hebräischen. »Sein Lager aufschlagen« gibt die elliptische zweite Klausel idiomatisch wieder; die Fußnoten bewahren die wörtlicheren und geografisch engeren Lesarten.
