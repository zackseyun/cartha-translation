  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: de
  text: 'Und er sagte: »Sieh doch auf und schau: Alle Ziegenböcke, die die Herde bespringen, sind gestreift[a], gesprenkelt und gefleckt; denn ich habe alles gesehen, was Laban dir antut.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »gestreift« wiedergegebene hebräische Wort wird traditionell auch mit »ringgestreift« übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: Sieh doch auf und schau
  rationale: Die Wendung mit »Augen erheben« bedeutet idiomatisch aufzusehen; »doch« gibt die höflich-auffordernde Partikel נָא natürlich wieder, während »schau« den erneuten visuellen Imperativ ausdrückt.
- source_word: הָעַתֻּדִים
  choice: die Ziegenböcke
  rationale: עַתּוּד bezeichnet hier männliche Ziegen; »Ziegenböcke« ist eindeutig und in modernem Deutsch geläufig.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: die die Herde bespringen
  rationale: עלה על ist im Zusammenhang der Tierzucht eine Umschreibung für das Besteigen zur Paarung. »Bespringen« ist im Deutschen der präzise und natürliche Fachausdruck.
- source_word: עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים
  choice: gestreift, gesprenkelt und gefleckt
  rationale: Die drei Bezeichnungen unterschiedlicher Fellzeichnungen bleiben durch drei verständliche deutsche Ausdrücke voneinander unterschieden; עֲקֻדִּים kann auch traditionell als »ringgestreift« verstanden werden.
- source_word: כִּי רָאִיתִי
  choice: denn ich habe … gesehen
  rationale: »Denn« bewahrt den begründenden Sinn von כִּי; das Perfekt gibt die vollendete Wahrnehmung mit gegenwärtiger Bedeutung wieder.
- source_word: כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: alles, was Laban dir antut
  rationale: Das Partizip bezeichnet fortdauerndes Handeln. Im Kontext drückt לְ eine gegen Jakob gerichtete Behandlung aus; »antut« macht diesen nachteiligen Sinn idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der tierzüchterische Ausdruck »bespringen« ist sachlich und präzise; unnötig wörtliche Hebraismen werden vermieden.
