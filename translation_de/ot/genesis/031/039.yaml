base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: de
  text: Ein von Raubtieren gerissenes Tier brachte ich dir nicht; ich selbst kam dafür auf.[a] Für Tiere, die am Tag gestohlen wurden, ebenso wie für solche, die in der Nacht gestohlen wurden, verlangtest du von mir Ersatz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich selbst ersetzte es“ beziehungsweise „ich selbst musste dafür aufkommen“. Das hebräische Verb bezeichnet hier wahrscheinlich das Tragen der Haftung für den Verlust.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרֵפָה
  choice: ein von Raubtieren gerissenes Tier
  rationale: Das Wort bezeichnet hier im Zusammenhang der Herdenhaltung ein Nutztier, das von wilden Tieren gerissen wurde. Die Übersetzung macht den Bezug ausdrücklich und bewahrt das konkrete Bild.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: brachte ich dir nicht
  rationale: ביא mit אֶל bezeichnet das Bringen zu einer Person. Die deutsche Formulierung gibt die hebräische Aussage direkt und natürlich wieder.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: ich selbst kam für den Verlust auf
  rationale: Das selbstständige Pronomen אָנֹכִי betont Jakob. Das Piel von חטא bezeichnet hier wahrscheinlich das Tragen der Haftung beziehungsweise das Ersetzen eines Verlustes, nicht eine moralische Sünde.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: fordertest du von mir zurück
  rationale: Die Wendung bedeutet, jemanden persönlich haftbar zu machen oder Ersatz von ihm zu verlangen. Die idiomatische deutsche Formulierung vermittelt diesen Sinn, ohne die im Deutschen missverständliche Wendung „aus meiner Hand“ wörtlich zu übernehmen.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: was am Tag gestohlen wurde und was in der Nacht gestohlen wurde
  rationale: Die additive Parallelstruktur mit ו wird bewahrt. Dadurch erscheinen die gestohlenen Tiere als eigene Verlustkategorie und werden nicht irrtümlich mit dem zuvor erwähnten gerissenen Tier gleichgesetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „was … gestohlen wurde“ bildet die hebräische Parallelstruktur ab und vermeidet die sachlich missverständliche Verknüpfung „ob am Tag oder in der Nacht“ mit dem gerissenen Tier.
