  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: de
  text: So nahm Gott eurem Vater das Vieh weg und gab es mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entriss“ oder „befreite“. Das hebräische Verb kann ausdrücken, dass etwas der einen Seite entzogen und einer anderen übertragen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: nahm … weg
  rationale: Das Hifil von נצל kann entreißen, retten oder jemandem etwas entziehen bedeuten. Im Zusammenhang bezeichnet es die Wegnahme von Labans Vieh mit anschließender Übertragung an Jakob; „nahm … weg“ gibt dies natürlich wieder, ohne unnötig eine Rettung aus Gefahr oder besondere Gewaltsamkeit anzudeuten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die übliche und kontextgerechte Wiedergabe der Bezeichnung für den handelnden Gott.
- source_word: מִקְנֵה
  choice: Vieh
  rationale: מִקְנֶה bezeichnet Besitz, besonders Nutz- und Herdentiere. Im Hirtenkontext ist „Vieh“ präzise, idiomatisch und bewahrt den kollektiven Singular.
- source_word: אֲבִיכֶם
  choice: eurem Vater
  rationale: 'Das Substantiv steht im Singular mit einem Suffix der 2. Person maskulin Plural: Jakob spricht Rahel und Lea gemeinsam auf ihren einen Vater Laban an.'
- source_word: וַיִּתֶּן לִי
  choice: gab es mir
  rationale: נתן bezeichnet die Übertragung an Jakob. Das Pronomen „es“ greift den kollektiven Singular „Vieh“ auf und macht den im Deutschen erforderlichen Gegenstand ausdrücklich.
theological_decisions:
- issue: Göttliches Handeln bei Jakobs Wohlstand
  choice: Der Vers schreibt Gott unmittelbar zu, Laban das Vieh weggenommen und es Jakob gegeben zu haben.
  alternative: Eine abgeschwächte Formulierung, die lediglich Gottes allgemeinen Segen oder seine Vorsehung hervorhebt.
  rationale: Die beiden Verben וַיַּצֵּל und וַיִּתֶּן benennen Gottes Handeln ausdrücklich. Die Übersetzung bewahrt diese starke Aussage, ohne sie erklärend abzuschwächen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „So“ bindet den Satz folgernd an Jakobs vorausgehende Darstellung an; „Vieh“ ist ein natürlicher kollektiver Singular.
