base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: de
  text: Er floh mit allem, was ihm gehörte. Er brach auf, überquerte den Strom[a] und wandte sich dem Bergland von Gilead zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „der Strom“; wahrscheinlich ist der Euphrat gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: So floh er
  rationale: ברח bezeichnet ein Fliehen oder Davonlaufen. „Floh“ bewahrt den narrativen Druck, ohne zusätzliche Motive einzutragen.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: mit allem, was ihm gehörte
  rationale: Die Wendung umfasst Jakobs gesamten Besitz und Haushalt, ohne den Bezug unnötig auf Sachen oder Personen einzuengen.
- source_word: וַיָּקָם
  choice: Er brach auf
  rationale: קום leitet hier den nächsten Handlungsschritt ein. Das natürliche deutsche „brach auf“ gibt die Funktion im Erzählzusammenhang besser wieder als das wörtliche, aber missverständliche „stand auf“.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: überquerte den Strom
  rationale: עבר bedeutet „hinübergehen/überqueren“. „Der Strom“ erhält die bestimmte, wahrscheinlich konventionelle geografische Bezeichnung, ohne den Eigennamen in den Haupttext einzusetzen.
- source_word: הַנָּהָר
  choice: der Strom
  rationale: Der Ausdruck bezeichnet im Kontext wahrscheinlich den Euphrat. Die Übersetzung wahrt jedoch die Formulierung des Hebräischen; die wahrscheinliche Identifizierung steht in der Fußnote.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: wandte sich … zu
  rationale: Das hebräische Idiom bedeutet wörtlich „sein Gesicht richten“ und drückt eine bewusste Ausrichtung aus. Die deutsche Formulierung ist natürlich und bewahrt diese Zielgerichtetheit.
- source_word: הַר הַגִּלְעָד
  choice: dem Bergland von Gilead
  rationale: הַר kann nicht nur einen einzelnen Berg, sondern auch ein Gebirge oder Bergland bezeichnen. Hier passt die regionale Bedeutung zur Geografie.
