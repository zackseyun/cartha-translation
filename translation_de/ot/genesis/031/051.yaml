base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: de
  text: 'Darauf sagte Laban zu Jakob: „Sieh diesen Steinhaufen[a], und sieh das Steinmal[b], das ich zwischen mir und dir aufgerichtet habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Steinhügel“. Gemeint ist der als Zeuge aufgeschichtete Steinhaufen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufgerichteter Stein“ beziehungsweise „Steinpfeiler“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Darauf sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Darauf“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel weist nachdrücklich auf die sichtbaren Gegenstände hin. „Sieh“ bewahrt diese deiktische Funktion ohne archaisches „siehe“.
- source_word: הַגַּל הַזֶּה
  choice: diesen Steinhaufen
  rationale: גַּל bezeichnet hier den im Zusammenhang aufgeschichteten Steinhaufen, der als Zeuge dienen soll. Die ausdrückliche Nennung von „Stein“ vermeidet die Unbestimmtheit von „Haufen“.
- source_word: וְהִנֵּה
  choice: und sieh
  rationale: Die Wiederholung gibt den parallelen und betonten Aufbau des Hebräischen wieder.
- source_word: הַמַצֵּבָה
  choice: das Steinmal
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein. „Steinmal“ ist knapp, würdig und unterscheidet ihn klar vom Steinhaufen.
- source_word: יָרִיתִי
  choice: ich ... aufgerichtet habe
  rationale: Im Zusammenhang mit dem Steinmal bezeichnet das Verb dessen Aufstellung. „Aufgerichtet“ ist im Deutschen sachlich und anschaulich.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Die relationale Wendung wird unmittelbar und formal entsprechend wiedergegeben.
