base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: de
  text: Bei wem du deine Götter findest, der soll nicht am Leben bleiben. Stell vor unseren Brüdern[a] fest, was von deinem Besitz bei mir ist, und nimm es dir. Jakob wusste aber nicht, dass Rahel sie gestohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier auch männliche Verwandte oder Angehörige der anwesenden Gruppe bezeichnen, nicht nur leibliche Brüder.
    reason: cultural_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Bei wem du … findest
  rationale: Die indefinite Relativkonstruktion wird im Deutschen natürlich und zugleich eng am aktiven hebräischen Wortlaut wiedergegeben.
- source_word: אֱלֹהֶיךָ
  choice: deine Götter
  rationale: Dies entspricht dem ausdrücklichen Plural des Ausgangstextes; die nähere Bestimmung als Hausgötter wird nicht in den Haupttext eingetragen.
- source_word: לֹא יִחְיֶה
  choice: der soll nicht am Leben bleiben
  rationale: Die Formulierung bewahrt die starke Todesdrohung, ohne sie eindeutig als Rechtsspruch, Wunsch oder Vorhersage festzulegen.
- source_word: נֶגֶד אַחֵינוּ
  choice: vor unseren Brüdern
  rationale: Die räumlich-soziale Bedeutung von נֶגֶד und die wörtliche Verwandtschaftsbezeichnung bleiben erhalten.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: Stell … fest, was von deinem Besitz bei mir ist
  rationale: Das Verb fordert zur Prüfung und Identifizierung auf; der elliptische Besitzbezug wird aus dem Kontext verständlich ergänzt.
- source_word: וְקַח לָךְ
  choice: und nimm es an dich
  rationale: Die Wendung gibt sowohl das Nehmen als auch den auf Laban bezogenen Dativ idiomatisch wieder.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Jakob wusste aber nicht
  rationale: Das einleitende ו markiert hier passend den Gegensatz zwischen Jakobs Aussage und seinem fehlenden Wissen.
- source_word: גְּנָבָתַם
  choice: sie gestohlen hatte
  rationale: Das pluralische Suffix verweist auf die Götter; das Plusquamperfekt zeigt die bereits vorausgegangene Handlung.
theological_decisions:
- issue: Art der Aussage לֹא יִחְיֶה
  choice: der soll nicht am Leben bleiben
  alternative: der wird nicht am Leben bleiben
  rationale: Die gewählte Fassung lässt die modale Spannung zwischen Drohung, Fluch und Urteil bestehen und vermeidet eine rein prädiktive Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die erzählerische Spannung und Jakobs Unwissen werden bewahrt.
