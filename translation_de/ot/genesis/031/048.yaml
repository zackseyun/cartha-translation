  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: de
  text: 'Und Laban sagte: »Dieser Steinhaufen ist heute Zeuge zwischen mir und dir.« Deshalb nannte er ihn Galed[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Galed bedeutet auf Hebräisch »Steinhaufen des Zeugen«; der Name ist aus gal (»Steinhaufen«) und ed (»Zeuge«) gebildet.
    reason: Die Fußnote erläutert die hebräische Namensbildung und das im Deutschen nicht vollständig wiedergegebene Wortspiel präzise.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; »Und ... sagte« bewahrt die Abfolge in natürlichem deutschem Erzählstil.
- source_word: לָבָן
  choice: Laban
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: הַגַּל הַזֶּה
  choice: dieser Steinhaufen
  rationale: גַּל bezeichnet hier im Kontext den aus Steinen errichteten Haufen; »Steinhaufen« ist anschaulich und eindeutig.
- source_word: עֵד
  choice: Zeuge
  rationale: Der Steinhaufen dient als bezeugendes Zeichen der Vereinbarung; »Zeuge« erhält die rechtlich-bundestheologische Personifikation.
- source_word: בֵּינִי וּבֵינְךָ
  choice: zwischen mir und dir
  rationale: Die ausdrückliche Nennung beider Parteien im Singular wird bewahrt.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die schlichte temporale Angabe entspricht dem Hebräischen und ist modernes Standarddeutsch.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Die Formel leitet unmittelbar die ätiologische Namensgebung ein.
- source_word: קָרָא שְׁמוֹ
  choice: nannte er ihn
  rationale: Die idiomatische deutsche Namensformel gibt das aktive Verb und den Bezug auf den Steinhaufen natürlich wieder.
- source_word: גַּלְעֵד
  choice: Galed
  rationale: Der Name wird transliteriert; sein Wortspiel mit גַּל (»Steinhaufen«) und עֵד (»Zeuge«) wird in der Fußnote erklärt.
