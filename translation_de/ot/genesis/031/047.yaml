  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: de
  text: Laban nannte ihn Jegar-Sahaduta[a], Jakob aber nannte ihn Gal-Ed[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jegar-Sahaduta ist Aramäisch und bedeutet »Zeugenhaufen« oder »Zeugnishügel«.
    reason: lexical_alternative
  - marker: b
    text: Gal-Ed ist Hebräisch und bedeutet »Zeugenhaufen« oder »Zeugnishügel«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: nannte ihn
  rationale: קרא mit ל und Suffix bezeichnet hier die Benennung. Das maskuline Pronomen greift im Zusammenhang den Steinhaufen auf und kann im Deutschen natürlich mit „ihn“ wiedergegeben werden.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Jegar-Sahaduta
  rationale: Der aramäische Name wird transliteriert, damit der Wechsel zwischen Labans aramäischer und Jakobs hebräischer Benennung sichtbar bleibt; seine Bedeutung steht in der Fußnote.
- source_word: וְיַעֲקֹב
  choice: Jakob aber
  rationale: Das ו verbindet die Satzteile, markiert hier jedoch zugleich den Kontrast zwischen den beiden Benennungen; „aber“ gibt diesen Zusammenhang natürlich wieder.
- source_word: גַּלְעֵד
  choice: Gal-Ed
  rationale: Der hebräische Name wird transliteriert, um den Benennungsakt und das Wortspiel zu bewahren; seine Bedeutung wird in der Fußnote erläutert.
