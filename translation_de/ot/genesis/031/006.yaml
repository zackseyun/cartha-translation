  text: וְ/אַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּ/כָל כֹּחִ֔/י עָבַ֖דְתִּי אֶת אֲבִי/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: de
  text: Ihr selbst wisst, dass ich eurem Vater mit meiner ganzen Kraft gedient habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für euren Vater gearbeitet habe“. Das hebräische Verb kann sowohl „dienen“ als auch „arbeiten“ bedeuten; beides passt zu Jakobs jahrelanger Arbeit bei Laban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: Ihr selbst
  rationale: Das selbstständige Pronomen der 2. Person Feminin Plural hebt Rahel und Lea ausdrücklich hervor. Der hebräische Anschluss mit וְ wird im Deutschen durch den natürlichen Satzanschluss und das bekräftigende „ja“ wiedergegeben.
- source_word: יְדַעְתֶּן
  choice: wisst
  rationale: Das Qal Perfekt bezeichnet hier einen bestehenden Wissensstand; im modernen Deutschen ist dafür das Präsens idiomatisch.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was Rahel und Lea wissen.
- source_word: בְּכָל־כֹּחִי
  choice: mit meiner ganzen Kraft
  rationale: Die Wendung bezeichnet den vollen Einsatz von Jakobs Kraft und Leistungsvermögen.
- source_word: עָבַדְתִּי
  choice: gedient habe
  rationale: עבד kann sowohl „dienen“ als auch „arbeiten“ bedeuten. Mit einer Person als direktem Objekt bewahrt „dienen“ die relationale Bedeutung und schließt die geleistete Arbeit ein.
- source_word: אֶת־אֲבִיכֶן
  choice: eurem Vater
  rationale: Bei „dienen“ verlangt modernes Standarddeutsch den Dativ; das feminine Pluralsuffix bezeichnet den gemeinsamen Vater der beiden angesprochenen Frauen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ihr selbst“ erhält die betonte Anrede an Rahel und Lea; „ja“ macht den bekräftigenden Zusammenhang natürlich hörbar. Die Fußnote bewahrt die Bedeutungsbreite von עבד.
