source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: de
  text: 'Wenn er sagte: »Die Gesprenkelten sollen dein Lohn sein«, brachte die ganze Herde gesprenkelte Junge zur Welt; und wenn er sagte: »Die Gestreiften sollen dein Lohn sein«, brachte die ganze Herde gestreifte Junge zur Welt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: die Gesprenkelten / gesprenkelte
  rationale: Bezeichnet Tiere mit punkt- oder fleckenartiger Zeichnung; »gesprenkelt« gibt die sichtbare Fellzeichnung natürlich und präzise wieder.
- source_word: עֲקֻדִּים
  choice: die Gestreiften / gestreifte
  rationale: Bezeichnet hier Tiere mit streifen- oder bandartiger Zeichnung; »gestreift« ist im Deutschen verständlich und unterscheidet sie klar von den Gesprenkelten.
- source_word: שְׂכָרֶךָ
  choice: dein Lohn
  rationale: Gibt die vereinbarte Vergütung für Jakobs Arbeit direkt wieder.
- source_word: וְיָלְדוּ
  choice: brachte … Junge zur Welt
  rationale: Das feminine Pluralverb bezieht sich kollektiv auf die Tiere der Herde; die idiomatische deutsche Formulierung macht deutlich, dass Nachwuchs mit der genannten Zeichnung geboren wurde.
- source_word: כֹּה
  choice: nicht gesondert wiedergegeben
  rationale: In der Formel אִם כֹּה יֹאמַר leitet כֹּה den Inhalt der folgenden direkten Rede ein. Das Deutsche drückt dies natürlich durch Doppelpunkt und direkte Rede aus; ein zusätzliches »so« oder »dies« wäre unnötig steif.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Satzbau des Hebräischen bleibt erhalten; die substantivierten Farbbezeichnungen in der Lohnvereinbarung und die entsprechenden Adjektive beim Nachwuchs werden klar unterschieden.
