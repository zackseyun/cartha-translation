source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: de
  text: 'Da sagte der Engel Gottes im Traum[a] zu mir: »Jakob!« Und ich sagte: »Hier bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einem Traum«. Im Hebräischen steht der bestimmte Artikel: »im Traum«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter. »Da sagte« gibt die zeitliche Abfolge natürlich wieder, ohne die einfache Aussage semantisch zu erweitern.
- source_word: אֵלַי
  choice: zu mir
  rationale: Direkte Wiedergabe der Präposition mit dem Suffix der 1. Person Singular.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: der Engel Gottes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; im erzählerischen Zusammenhang ist ein himmlisches Wesen gemeint. »Der Engel Gottes« bewahrt die Bezeichnung des hebräischen Textes, ohne seine Identität weitergehend festzulegen.
- source_word: בַּחֲלוֹם
  choice: im Traum
  rationale: Die Verbindung enthält im Hebräischen den bestimmten Artikel. Das deutsche »im Traum« gibt diese Form knapp und idiomatisch wieder; die mögliche unbestimmte Wiedergabe wird in der Fußnote genannt.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Die Wiederholung von אמר wird beibehalten; »und« entspricht der schlichten erzählerischen Verknüpfung.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Natürliche deutsche Wiedergabe der hebräischen Bereitschafts- und Antwortformel.
theological_decisions:
- issue: Die mögliche Identität des מַלְאַךְ הָאֱלֹהִים mit Gott
  choice: der Engel Gottes
  alternative: der Bote Gottes
  rationale: Der Vers bezeichnet die Gestalt als »Engel Gottes«, klärt aber weitergehende Fragen nach ihrem Verhältnis zu Gott nicht. Die Übersetzung bewahrt diese theologische Spannung, ohne sie aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird klar gegliedert; die Wiederholung von »sagte« wahrt die Form des Ausgangstextes.
