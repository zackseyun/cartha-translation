base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: de
  text: Da nahm er seine Verwandten mit sich[a], verfolgte ihn sieben Tagesreisen weit und holte ihn im Bergland Gilead ein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Brüder«; das hebräische Wort kann sowohl Brüder im engeren Sinn als auch Verwandte beziehungsweise Sippenangehörige bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »am Berg Gilead«; das Hebräische kann einen einzelnen Berg oder das Bergland der Region Gilead meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: seine Verwandten
  rationale: אָח kann enger »Bruder« und weiter einen Angehörigen der Sippe bezeichnen. Im Zusammenhang sammelt Laban offenbar Mitglieder seines Familienverbandes; »Verwandte« gibt dies im modernen Deutsch natürlich wieder.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: verfolgte ihn
  rationale: רדף mit אַחַר bezeichnet das Verfolgen einer Person. Das einfache »verfolgte ihn« ist im Deutschen idiomatisch und bewahrt den vollen Sinn der hebräischen Wendung.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: sieben Tagereisen weit
  rationale: דֶּרֶךְ bezeichnet hier adverbial die zurückgelegte Wegstrecke. »Sieben Tagereisen weit« bewahrt gegenüber »sieben Tage lang« den räumlichen Aspekt und klingt natürlich.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: holte ihn … ein
  rationale: דבק bezeichnet in diesem Verfolgungszusammenhang das Erreichen beziehungsweise Einholen des Verfolgten, nicht das sonst häufige »anhaften«.
- source_word: בְּהַר הַגִּלְעָד
  choice: im Bergland Gilead
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen. Der regionale Sinn passt hier gut; die Formulierung lässt die geographische Bezeichnung knapp und verständlich erscheinen.
