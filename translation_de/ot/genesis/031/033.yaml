base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: de
  text: So ging Laban in Jakobs Zelt, in Leas Zelt und in das Zelt der beiden Sklavinnen, fand sie aber nicht.[a] Dann kam er aus Leas Zelt heraus und ging in Rachels Zelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: „fand nicht“. Das nicht genannte Objekt sind nach dem Zusammenhang die Hausgötter, die Laban suchte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: ging ... in ... Zelt
  rationale: בוא mit בְּ bezeichnet die Bewegung in einen Ort hinein. „ging ... in“ ist im deutschen Erzählstil natürlich und bewahrt die Bewegungsrichtung.
- source_word: אֹהֶל
  choice: Zelt
  rationale: Die konkrete Grundbedeutung „Zelt“ passt zum patriarchalischen Kontext und soll nicht zu „Wohnung“ verallgemeinert werden.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: die beiden Dienerinnen
  rationale: אָמָה bezeichnet eine weibliche Dienerin beziehungsweise unfreie Frau. „Dienerinnen“ ist modernes, verständliches Deutsch; der soziale Status wird dabei nicht stärker festgelegt, als es der unmittelbare Suchbericht verlangt.
- source_word: וְלֹא מָצָא
  choice: fand sie aber nicht
  rationale: Das Objekt bleibt im Hebräischen unausgesprochen und ergibt sich aus dem Kontext als die gesuchten Hausgötter. Das Pronomen „sie“ macht den deutschen Satz idiomatisch; die Fußnote weist auf die Ellipse hin. „aber“ gibt den kontextuellen Gegensatz wieder.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Dann kam er aus Leas Zelt heraus
  rationale: יצא bedeutet „hinausgehen/herauskommen“. „kam ... heraus“ ist natürliches Deutsch; „Dann“ gibt die Erzählfolge wieder.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: und ging in Rachels Zelt
  rationale: Die wiederholte Bewegungsformulierung bildet die schrittweise Suche ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die wiederholte Zelt-Terminologie und das implizite Objekt des hebräischen Textes bleiben erkennbar; die Fußnote erklärt die für gutes Deutsch ergänzte Objektangabe.
