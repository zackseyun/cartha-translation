  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: de
  text: 'Und Mizpa[a], denn er sagte: »Yahweh wache zwischen mir und dir, wenn wir voreinander verborgen sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mizpa klingt an das hebräische Wort für »Wachturm« oder »Aussichtspunkt« an; so entsteht ein Wortspiel mit »Yahweh wache«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: Und Mizpa
  rationale: Der Ausdruck bezeichnet hier im Zusammenhang der Benennung einen Ortsnamen. »Mizpa« bewahrt den Namen und das im Hebräischen hörbare Wortspiel mit יִצֶף, »Wache halten«.
- source_word: אֲשֶׁר אָמַר
  choice: denn er sagte
  rationale: Der Relativsatz erläutert die Benennung. »Denn er sagte« gibt diese begründende Funktion natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes »er nannte es« einzufügen.
- source_word: יִצֶף
  choice: halte Wache
  rationale: Die Jussivform von צפה drückt hier einen Wunsch aus. »Halte Wache« ist im Deutschen idiomatisch und lässt die Verbindung zum Namen Mizpa erkennen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Die Formulierung bewahrt Reihenfolge und Bedeutung des hebräischen Ausdrucks und ist im Deutschen natürlich.
- source_word: כִּי
  choice: wenn
  rationale: כִּי bezeichnet hier den Umstand beziehungsweise Zeitpunkt, für den Yahwehs Wachen erbeten wird.
- source_word: נִסָּתֵר
  choice: wir verborgen sind
  rationale: Der Niphal von סתר bedeutet »verborgen sein«. Die Übersetzung erhält dieses Bild, statt es lediglich als Abwesenheit zu umschreiben.
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: voreinander
  rationale: Wörtlich steht eine reziproke Wendung wie »einer vor seinem Gefährten«. »Voreinander« gibt die gegenseitige Beziehung knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als persönlichen Gottesnamen. »Yahweh« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Funktion des göttlichen Wachens
  choice: 'als Wunsch formuliert: »Yahweh halte Wache«'
  alternative: 'als Feststellung: »Yahweh hält Wache«'
  rationale: Die Verbform יִצֶף hat hier jussivische Kraft. Der Text äußert eine Bitte beziehungsweise einen Wunsch und keine bloße Tatsachenbehauptung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markante Wendung »zwischen mir und dir« bewahrt die räumlich-rechtliche Bildsprache des Bundeskontexts; »voreinander verborgen« erhält die echte Bildlichkeit und mögliche Spannung des Hebräischen.
