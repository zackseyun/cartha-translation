  text: Am dritten Tag wurde Laban mitgeteilt, dass Jakob geflohen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Der Hofal von נגד bezeichnet hier passiv die Übermittlung einer Nachricht. „Wurde berichtet“ wahrt den ungenannten Überbringer und klingt im Deutschen natürlich.
- source_word: לְלָבָן
  choice: Laban
  rationale: Die Präposition ל kennzeichnet den Empfänger der Nachricht; im Deutschen wird dies mit „Laban wurde berichtet“ wiedergegeben.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die Zeitangabe wird direkt wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „danach“ hinzuzufügen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt der Meldung ein und wird daher als „dass“ wiedergegeben.
- source_word: בָרַח
  choice: geflohen war
  rationale: ברח bedeutet „fliehen“. Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass Jakobs Flucht der Meldung vorausging.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personenname wird in seiner gebräuchlichen deutschen biblischen Form wiedergegeben.
