base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: de
  text: Diese zwanzig Jahre war ich in deinem Haus. Vierzehn Jahre habe ich dir für deine beiden Töchter gedient und sechs Jahre für deine Herde. Und du hast meinen Lohn zehnmal geändert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ
  choice: Diese zwanzig Jahre war ich nun in deinem Haus
  rationale: Die deutsche Formulierung gibt die vorangestellte Zeitangabe und den deiktischen Charakter von זֶה natürlich wieder. „In deinem Haus“ bewahrt die konkrete Bedeutung von בַּיִת, die hier zugleich den Haushalt einschließen kann.
- source_word: עֲבַדְתִּיךָ
  choice: habe ich dir … gedient
  rationale: „Dienen“ bewahrt sowohl den Arbeits- als auch den persönlichen Dienstcharakter von עבד; der Dativ ist im Deutschen idiomatisch.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: vierzehn Jahre … für deine beiden Töchter
  rationale: „Für“ bezeichnet knapp und verständlich die Brautdienstvereinbarung, ohne zusätzliche Erklärung in den Vers einzutragen.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: und sechs Jahre für deine Herde
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen; „Herde“ ist umfassender und hier natürlicher als das engere „Schafe“.
- source_word: וַתַּחֲלֵף אֶת מַשְׂכֻּרְתִּי
  choice: Doch du hast meinen Lohn … geändert
  rationale: „Geändert“ entspricht dem kausativen Sinn von חלף. „Doch“ macht den im Zusammenhang klaren Gegensatz idiomatisch sichtbar, ohne den Inhalt zu verändern.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: zehnmal
  rationale: Die idiomatische Wendung bezeichnet wiederholte Änderungen; das natürliche deutsche Äquivalent ist „zehnmal“.
