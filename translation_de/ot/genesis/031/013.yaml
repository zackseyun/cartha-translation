- from: Ich bin der Gott von Bethel[a], wo du einen Gedenkstein gesalbt und mir ein Gelübde abgelegt hast. Nun mach dich auf, zieh aus diesem Land fort und kehre in das Land deiner Herkunft zurück.
  to: Ich bin der Gott von Bethel[a], wo du eine Steinsäule gesalbt hast und wo du mir ein Gelübde abgelegt hast. Nun mach dich auf, geh aus diesem Land fort und kehre in das Land deiner Herkunft zurück.
  rationale: Ausschließlich die Wiedergabe von מַצֵּבָה wird von „Gedenkstein“ zu „Steinsäule“ präzisiert. Dadurch bleibt die Darstellung des aufgerichteten Steins quellentreu, ohne eine nicht ausdrücklich genannte Erinnerungsfunktion hinzuzufügen. Die übrigen Formulierungen und der korrekt verankerte Bethel-Hinweis können bestehen bleiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:23Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Selbstidentifikation, die Salbung, das Gelübde, die drei Bewegungsaufforderungen und das Ziel der Rückkehr insgesamt zutreffend wieder. „Gedenkstein“ legt jedoch eine Erinnerungs- bzw. Denkmalfunktion nahe, die מַצֵּבָה hier nicht ausdrücklich bezeichnet; gemeint ist ein aufgerichteter Stein bzw. eine Steinsäule.
  naturalness: Der Satz ist gut verständlich und hat einen angemessen würdigen, modernen biblischen Ton. „Mach dich auf“ und „kehr(e) ... zurück“ sind idiomatisch. Die Wiederholung von „wo“ folgt der hebräischen Relativsatzstruktur und bleibt im Deutschen flüssig.
  terminology: „Der Gott von Bethel“, „salben“, „Gelübde ablegen“, „Land“ und „Land deiner Herkunft“ sind sachgerecht. „Steinsäule“ ist für מַצֵּבָה genauer und zugleich modernes Standarddeutsch. Die Fußnote zu Bethel ist korrekt am Ortsnamen verankert. Die im englischen Audit vorhandene Fußnote b ist inhaltlich Bethel zugeordnet, aber dort falsch bei „land“ verankert; sie sollte nicht übernommen werden.
