  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: de
  text: Ich bin der Gott von Bethel[a], wo du eine Steinsäule gesalbt hast und wo du mir ein Gelübde abgelegt hast. Nun mach dich auf, geh aus diesem Land fort und kehre in das Land deiner Herkunft zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bethel bedeutet „Haus Gottes“; hier ist es der Name eines Ortes.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: der Gott von Bethel
  rationale: Der Artikel bestimmt אֵל, und בֵּית אֵל ist hier der geläufige Ortsname. Die Formulierung verbindet den Sprecher mit Jakobs früherer Gottesbegegnung in Bethel.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: wo du einen Gedenkstein gesalbt hast
  rationale: מָשַׁח bezeichnet das Salben; מַצֵּבָה ist ein aufgerichteter Stein. „Gedenkstein“ ist im Deutschen verständlicher als das missverständliche „Säule“ und entspricht dem Gegenstand aus Genesis 28,18.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: mir ein Gelübde abgelegt hast
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv wird idiomatisch wiedergegeben. „Mir“ bewahrt den hebräischen Dativ, ohne die im Deutschen unnatürliche Form „ein Gelübde geloben“ zu erzwingen.
- source_word: קוּם
  choice: mach dich auf
  rationale: Der Imperativ leitet hier die unmittelbar folgenden Bewegungsbefehle ein. „Mach dich auf“ ist natürlich, würdig und idiomatischer als ein isoliertes „steh auf“.
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: zieh aus diesem Land fort
  rationale: צֵא mit מִן bezeichnet das Verlassen eines Gebiets. „Zieh … fort“ gibt die Reisebewegung präzise und in natürlichem Deutsch wieder.
- source_word: וְשׁוּב
  choice: und kehre … zurück
  rationale: שׁוב bezeichnet im Reisekontext die Rückkehr an einen früheren Ort.
- source_word: אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: in das Land deiner Herkunft
  rationale: מוֹלֶדֶת kann Geburt, Herkunft oder den Verwandtschaftsverband bezeichnen. Zusammen mit אֶרֶץ lässt „Land deiner Herkunft“ die sachgemäße Bedeutungsbreite besser erkennen als eine Beschränkung auf den Geburtsort oder die Verwandten.
theological_decisions:
- issue: Selbstbezeichnung des Sprechers als הָאֵל בֵּית אֵל
  choice: Ich bin der Gott von Bethel
  alternative: Ich bin Gott in Bethel
  rationale: Die gewählte Fassung versteht die Verbindung als Identifikation des Sprechers mit Jakobs Begegnung am Ort Bethel. Sie macht Gott weder zu einer bloßen Ortsgottheit noch ergänzt sie eine im Hebräischen nicht ausgesprochene Erklärung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der hebräische Nachdruck der Verbindung „ein Gelübde geloben“ wird zugunsten einer natürlichen deutschen Formulierung nicht mechanisch nachgebildet. Der Fußnotenmarker [a] steht unmittelbar beim Ortsnamen, auf den sich die Anmerkung bezieht.
