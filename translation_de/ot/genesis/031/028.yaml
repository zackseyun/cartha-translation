  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: de
  text: Und du hast mir nicht erlaubt, meine Söhne und meine Töchter zu küssen.[a] Jetzt hast du töricht gehandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du hast mich nicht zurückgelassen, um meine Söhne und meine Töchter zu küssen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: du hast mir nicht erlaubt
  rationale: נטשׁ bedeutet grundsätzlich „verlassen, zurücklassen“. Mit dem folgenden Infinitiv bezeichnet die Wendung hier idiomatisch die verwehrte Gelegenheit oder Erlaubnis; „hast mir nicht erlaubt“ gibt Labans Vorwurf in natürlichem Deutsch wieder.
- source_word: לְנַשֵּׁק
  choice: zum Abschied zu küssen
  rationale: Das Verb bedeutet „küssen“. Der Abschiedssinn ist durch den Kontext eindeutig nahegelegt; die deutsche Wendung macht die Funktion des Kusses natürlich verständlich, ohne eine zusätzliche Handlung einzuführen.
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: meine Söhne und meine Töchter
  rationale: Der hebräische Text nennt beide Gruppen ausdrücklich; die Übersetzung bewahrt diese Formulierung, statt sie zu „meine Kinder“ zusammenzufassen.
- source_word: עַתָּה
  choice: Damit
  rationale: עַתָּה heißt wörtlich „nun/jetzt“, leitet hier aber die Bewertung der gerade genannten Handlung ein. „Damit“ stellt diesen Folgerungsbezug in idiomatischem Deutsch her.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: hast du töricht gehandelt
  rationale: Die Konstruktion bezeichnet törichtes Handeln. Diese Wiedergabe ist präzise, würdig und im modernen Standarddeutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Klage Labans bleibt erhalten; „zum Abschied“ verdeutlicht den kontextuell implizierten Sinn des Kusses. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
