id: GEN.31.1
reference: Genesis 31:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: de
  text: 'Er hörte, wie Labans Söhne sagten: »Jakob hat alles genommen, was unserem Vater gehörte, und aus dem Besitz unseres Vaters hat er sich all diesen Reichtum[a] verschafft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all diese Herrlichkeit«. Das hebräische Wort kann Ehre, Herrlichkeit, Ansehen oder materiellen Reichtum bezeichnen; hier bezieht es sich auf Jakobs sichtbaren Wohlstand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Er hörte
  rationale: Das Wayyiqtol führt die Erzählung fort. Das Subjekt Jakob ergibt sich aus dem Zusammenhang; ein zusätzliches »nun« ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: wie Labans Söhne sagten
  rationale: Die natürliche deutsche Konstruktion gibt sowohl die gehörten Worte als auch die hebräische Zitateinleitung wieder, ohne das schwerfällige »die Worte …, indem sie sagten«.
- source_word: לָקַח
  choice: hat … genommen
  rationale: Das Perfekt passt zu der gegenwärtig erhobenen Beschuldigung über eine abgeschlossene Handlung. »An sich gerissen« würde die Aussage unnötig verschärfen.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: alles …, was unserem Vater gehörte
  rationale: Die Lamed-Konstruktion bezeichnet hier Besitz; der Relativsatz ist im Deutschen klar und idiomatisch.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: und aus dem Besitz unseres Vaters
  rationale: מִן bezeichnet die Quelle. Die sachliche Wiederholung des väterlichen Besitzes bleibt erhalten, wird aber idiomatisch formuliert.
- source_word: עָשָׂה
  choice: hat er sich … verschafft
  rationale: עָשָׂה bedeutet grundsätzlich »machen/tun«, bezeichnet mit כָּבוֹד als Objekt hier aber das Erlangen beziehungsweise Aufbauen des sichtbaren Wohlstands. Die Formulierung wahrt zugleich den anklagenden Ton der Söhne.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: all diesen Reichtum
  rationale: כָּבוֹד kann Ehre, Herrlichkeit, Ansehen oder materiellen Wohlstand bezeichnen. Im Zusammenhang mit Jakobs Besitz ist »Reichtum« die naheliegende Bedeutung; die wörtlichere Alternative wird in der Fußnote bewahrt.
