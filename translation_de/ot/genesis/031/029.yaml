source:
  edition: WLC
  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: de
  text: 'Es liegt in meiner Macht, euch Schaden zuzufügen. Aber der Gott eures Vaters sagte gestern Nacht zu mir: »Hüte dich, mit Jakob Gutes oder Böses zu reden!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Guten bis zum Bösen«. Die hebräische Wendung kann den ganzen Bereich umfassen und somit bedeuten, überhaupt nichts zu sagen, sei es günstig oder ungünstig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: Ich hätte die Macht
  rationale: Die hebräische Wendung bezeichnet die Fähigkeit beziehungsweise Verfügungsgewalt zu einer Handlung. Die deutsche Formulierung ist natürlich und gibt im Kontext Labans behauptete, jedoch durch Gottes Warnung begrenzte Möglichkeit wieder.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: euch Schaden zuzufügen
  rationale: רָע bezeichnet hier konkret eine schädigende Handlung gegen Jakob und seine Begleiter; „Schaden zufügen“ ist idiomatisches, gegenwärtiges Deutsch.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: Aber der Gott eures Vaters
  rationale: Das ו leitet hier einen deutlichen Gegensatz zu Labans Machtanspruch ein. Der Pluralsuffix wird mit „eures“ bewahrt, während אָבִיכֶם grammatisch „Vater“ im Singular ist.
- source_word: אֶמֶשׁ
  choice: gestern Nacht
  rationale: Das Wort verweist in diesem Zusammenhang auf die vorausgegangene Nacht. „Gestern Nacht“ ist im modernen Standarddeutsch klar und natürlich.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich
  rationale: Der Imperativ enthält eine eindringliche Warnung. „Hüte dich“ bewahrt deren Stärke und passt zu der folgenden Konstruktion mit מִן.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: mit Jakob … zu reden
  rationale: Nach הִשָּׁמֶר drückt מִן die zu unterlassende Handlung aus. עִם wird mit „mit“ wiedergegeben, ohne einseitig nur ein Reden „zu“ Jakob anzunehmen.
- source_word: מִטּוֹב עַד רָע
  choice: Gutes oder Böses
  rationale: Die polare Wendung wird nah am Hebräischen wiedergegeben. Sie kann den gesamten Bereich möglicher Äußerungen bezeichnen; diese idiomatische Tragweite wird in der Fußnote erläutert, ohne die Bildlichkeit im Haupttext aufzulösen.
theological_decisions:
- issue: Bezeichnung Gottes als אֱלֹהֵי אֲבִיכֶם
  choice: der Gott eures Vaters
  alternative: der Gott deiner Väter
  rationale: Der masoretische Text hat ein pluralisches Possessivsuffix, aber „Vater“ im Singular. Die Übersetzung bildet diese Form ab und vermeidet es, die Wendung zu einer später geläufigen Bundesformel umzugestalten.
- issue: Umfang der göttlichen Warnung מִטּוֹב עַד רָע
  choice: Gutes oder Böses zu reden
  alternative: überhaupt etwas zu sagen
  rationale: Die wörtliche Polarität lässt offen, wie die umfassende Redewendung im Einzelnen auf Labans Gespräch anzuwenden ist. Der Haupttext bewahrt diese Spannung; die idiomatische Bedeutung wird lediglich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. Der Wechsel vom pluralischen „euch/eures“ zur singularischen Warnung an Laban entspricht den hebräischen Anredeformen.
