  terminology: „Lohn“ ist für מַשְׂכֻּרֶת passend. „Gott“ entspricht dem Bezug von אֱלֹהִים in Jakobs Rede. Die Alternativen in Anmerkung a bewahren die semantische Spannweite von התל; Anmerkung b markiert zutreffend den möglichen idiomatischen Charakter der Zahl; Anmerkung c erläutert die hebräische Idiomatik sachgerecht.
