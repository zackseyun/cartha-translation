  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: de
  text: Doch euer Vater hat mich getäuscht[a] und meinen Lohn zehnmal[b] geändert. Aber Gott hat ihm nicht erlaubt, mir zu schaden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat seinen Spott mit mir getrieben“ beziehungsweise „hat mich hintergangen“. Das hebräische Verb kann täuschendes oder spöttisches Verhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zehn Male“. Die Wendung kann zahlreiche wiederholte Änderungen bezeichnen und muss nicht als genaue Zahl gemeint sein.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: „Gott gab es ihm nicht, mir zu schaden“, das heißt, Gott gestattete ihm nicht, mir Schaden zuzufügen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: hat mich getäuscht
  rationale: Das Hifil von התל bezeichnet täuschendes oder spöttisch-hinterlistiges Handeln. Im Zusammenhang konkretisiert der wiederholt geänderte Lohn die Täuschung; „getäuscht“ ist daher im modernen Deutschen treffend und natürlich.
- source_word: וְהֶחֱלִף
  choice: geändert
  rationale: Das Hifil von חלף bezeichnet hier das wiederholte Abändern der vereinbarten Vergütung.
- source_word: מַשְׂכֻּרְתִּי
  choice: meinen Lohn
  rationale: מַשְׂכֹּרֶת bezeichnet die für Arbeit geschuldete Vergütung; im Deutschen passt der Singular „Lohn“ in diesem Arbeitsverhältnis am besten.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: zehnmal
  rationale: Die Wendung bedeutet „zehn Mal“ und kann als runde Zahl wiederholte Änderungen ausdrücken, ohne zwingend eine exakte Zählung zu verlangen.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: Aber Gott hat ihm nicht erlaubt
  rationale: Wörtlich heißt es etwa „Gott gab es ihm nicht“; idiomatisch ist gemeint, dass Gott ihm keine Möglichkeit oder Erlaubnis zum schädigenden Handeln gab.
- source_word: לְהָרַע עִמָּדִי
  choice: mir zu schaden
  rationale: Die Konstruktion mit רעע und עִם bedeutet, jemandem übel mitzuspielen beziehungsweise Schaden zuzufügen.
theological_decisions:
- issue: Gottes Verhinderung des von Laban ausgehenden Schadens
  choice: Gott hat ihm nicht erlaubt, Jakob zu schaden
  alternative: Gott ließ ihn mit seinem Versuch, Jakob zu schaden, keinen Erfolg haben
  rationale: Die Übersetzung bewahrt Gottes aktive Begrenzung von Labans Handeln, ohne genauer festzulegen, ob Erlaubnis, Gelegenheit oder Erfolg verweigert wurde.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ nimmt den Gegensatz zum vorherigen Zusammenhang auf; der neue Satz vor „Aber Gott“ hebt Gottes Eingreifen klar hervor.
