  source_fidelity: 'Die Übersetzung gibt die hebräischen Satzglieder und ihre Beziehung zuverlässig wieder: הֵתֶל ist mit „hat mich getäuscht“ im Kontext der manipulierten Vergütung treffend erfasst; „meinen Lohn zehnmal geändert“ entspricht וְהֶחֱלִף אֶת־מַשְׂכֻּרְתִּי עֲשֶׂרֶת מֹנִים; und „Gott hat ihm nicht erlaubt, mir zu schaden“ vermittelt idiomatisch und ohne unangemessene Ausdeutung die Wendung וְלֹא נְתָנוֹ אֱלֹהִים לְהָרַע עִמָּדִי.'
