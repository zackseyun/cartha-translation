  terminology: „Brüder“ bewahrt die hebräische Bezeichnung angemessen. „Entscheiden“ ist für die nicht näher institutionalisierte forensische Funktion von וְיוֹכִיחוּ passend; die Fußnote bietet die gerichtliche Alternative korrekt an.
