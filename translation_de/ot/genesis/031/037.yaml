  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: de
  text: 'Da du nun meinen ganzen Besitz durchsucht hast: Was hast du von deinem gesamten Hausbesitz gefunden? Lege es hier vor meine Brüder und deine Brüder, und sie sollen zwischen uns beiden entscheiden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie sollen zwischen uns beiden Recht sprechen.“ Das hebräische Verb kann hier einen richterlichen oder schiedsrichterlichen Sinn haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: durchsucht hast
  rationale: מששׁ bezeichnet ursprünglich das Betasten, meint hier aber das gründliche Durchsuchen von Jakobs Besitz. „Durchsucht“ gibt den kontextuellen Sinn natürlich wieder.
- source_word: כָּל כֵּלַי
  choice: all meine Sachen
  rationale: כְּלִי kann Gefäß, Gerät, Gegenstand oder beweglichen Besitz bezeichnen. „Sachen“ ist im Deutschen breit genug für den gesamten persönlichen Besitz und wahrt die Wiederholung mit כְּלֵי im folgenden Satzteil.
- source_word: מַה מָּצָאתָ מִכֹּל כְּלֵי בֵיתֶךָ
  choice: Was hast du von all den Sachen deines Hauses gefunden?
  rationale: 'מִן wird hier partitiv verstanden: Gefragt wird, welchen Gegenstand aus dem Besitz von Labans Haus er gefunden hat. Die Formulierung bleibt eng am Hebräischen und erhält die rhetorische Schärfe.'
- source_word: שִׂים כֹּה
  choice: Lege es hier
  rationale: Der Imperativ verlangt, einen etwa gefundenen Gegenstand öffentlich vorzulegen. Das im Deutschen nötige Objekt „es“ greift den vorausgesetzten Fund auf.
- source_word: נֶגֶד
  choice: vor
  rationale: נֶגֶד bezeichnet hier die Vorlage in Gegenwart und vor den Augen der Anwesenden; „vor“ ist knapp und natürlich.
- source_word: אַחַי וְאַחֶיךָ
  choice: meine Brüder und deine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten. Im Kontext kann sie auch weitere männliche Verwandte oder Angehörige der jeweiligen Gruppe einschließen, ohne dass dies im Haupttext festgelegt werden muss.
- source_word: וְיוֹכִיחוּ
  choice: sie sollen … entscheiden
  rationale: Der Hifil von יכח hat hier einen forensischen beziehungsweise schiedsrichterlichen Sinn. „Entscheiden“ ist modernes, verständliches Deutsch und lässt offen, ob die Männer als Richter oder Schlichter auftreten.
- source_word: בֵּין שְׁנֵינוּ
  choice: zwischen uns beiden
  rationale: Die ausdrückliche Zweizahl des Hebräischen wird bewahrt und hebt den Streit zwischen Jakob und Laban hervor.
theological_decisions:
- issue: Forensische Bedeutung von וְיוֹכִיחוּ
  choice: entscheiden
  alternative: richten / Recht sprechen
  rationale: Der Kontext verlangt eine Entscheidung im Streit, legt aber kein formal institutionalisiertes Gericht fest. „Entscheiden“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Sachen“ bildet die Wiederholung von כְּלִי ab; die direkte Rede bleibt scharf und rhetorisch. Der Fußnotenmarker [a] steht unmittelbar nach der betroffenen Aussage.
