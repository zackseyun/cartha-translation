source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: de
  text: 'Und nun: Du bist tatsächlich fortgegangen, weil du dich so sehr nach dem Haus deines Vaters gesehnt hast. Warum hast du meine Götter[a] gestohlen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Hausgötter“. Im Hebräischen steht hier wörtlich „meine Götter“; im Zusammenhang sind Labans häusliche Götterbilder gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlich-diskursiven Übergang durch עַתָּה.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: du bist tatsächlich fortgegangen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; „tatsächlich“ gibt diese Hervorhebung in natürlichem Deutsch wieder.
- source_word: כִּי
  choice: weil
  rationale: Leitet den von Laban eingeräumten Grund für Jakobs Weggang ein.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: du dich so sehr … gesehnt hast
  rationale: Die wiederholte Verbalwurzel dient der Intensivierung; „so sehr“ bewahrt den Nachdruck, ohne den Sinn durch eine engere Umschreibung wie „Heimweh haben“ festzulegen.
- source_word: לְבֵית אָבִיךָ
  choice: nach dem Haus deines Vaters
  rationale: Gibt die Konstruktion direkt wieder und lässt den familiären beziehungsweise haushaltsbezogenen Umfang von „Haus“ bestehen.
- source_word: לָמָּה
  choice: Warum
  rationale: Entspricht der direkten Frage, mit der Laban seinen Vorwurf erhebt.
- source_word: גָנַבְתָּ
  choice: hast du … gestohlen
  rationale: Das deutsche Perfekt ist in einer direkten mündlichen Frage natürlich und bezeichnet die bereits vollzogene Handlung.
- source_word: אֶת אֱלֹהָי
  choice: meine Götter
  rationale: Der hebräische Wortlaut lautet schlicht „meine Götter“. Die kontextuelle Identifizierung als Hausgötter wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe von אֱלֹהָי in Labans Rede
  choice: meine Götter
  alternative: meine Hausgötter
  rationale: Der Haupttext bewahrt die unverhüllte Bezeichnung in Labans eigener Rede. Dass damit im Zusammenhang häusliche Götterbilder gemeint sind, ist wahrscheinlich, steht in diesem Vers aber nicht ausdrücklich und wird daher nur in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Intensivkonstruktionen werden mit „tatsächlich“ und „so sehr“ hörbar gemacht. Der Doppelpunkt nach „Und nun“ kennzeichnet den diskursiven Übergang, ohne einen zusätzlichen Gegensatz einzuführen.
