language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: de
  text: Wäre der Gott meines Vaters, der Gott Abrahams und die Furcht Isaaks[a], nicht für mich gewesen, dann hättest du mich jetzt gewiss mit leeren Händen fortgeschickt. Gott hat mein Elend und die Mühe meiner Hände gesehen und gestern Nacht Recht gesprochen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Furcht Isaaks“. Gemeint sein kann auch: „der, den Isaak fürchtet“. Dies ist ein ungewöhnlicher Titel für Gott.'
    reason: Bewahrt und erläutert die Mehrdeutigkeit des ungewöhnlichen hebräischen Gottesnamens.
  - marker: b
    text: 'Oder: „und gestern Nacht zurechtgewiesen“. Das hebräische Verb kann auch „entscheiden“, „Recht verschaffen“ oder „zurechtweisen“ bedeuten; ein Objekt wird nicht ausdrücklich genannt.'
    reason: Kennzeichnet die lexikalische und syntaktische Mehrdeutigkeit von וַיּוֹכַח.
lexical_decisions:
- source_word: לוּלֵי ... הָיָה לִי
  choice: Wäre ... nicht für mich gewesen
  rationale: Gibt die irreale Bedingung und den Gedanken göttlichen Beistands wieder, ohne das hebräische לִי unnötig auf bloße Anwesenheit festzulegen.
- source_word: אֱלֹהֵי אָבִי
  choice: der Gott meines Vaters
  rationale: Natürliche und transparente Wiedergabe der Status-constructus-Verbindung; im Kontext bezeichnet „mein Vater“ Isaak.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: der Gott Abrahams
  rationale: Formnahe, im Deutschen geläufige Wiedergabe.
- source_word: וּפַחַד יִצְחָק
  choice: und der Schrecken Isaaks
  rationale: Bewahrt den ungewöhnlichen Gottesnamen und die kräftige Bedeutung von פַחַד. Eine deutende Auflösung wird nur in der Fußnote angeboten.
- source_word: כִּי עַתָּה
  choice: dann ... jetzt gewiss
  rationale: Verbindet die Folge der irrealen Bedingung mit zeitlicher und verstärkender Nuance.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: Die natürliche deutsche Entsprechung für eine Entlassung ohne Besitz oder Lohn.
- source_word: עָנְיִי
  choice: mein Elend
  rationale: Bezeichnet hier Jakobs Bedrängnis und erlittene Not umfassend.
- source_word: יְגִיעַ כַּפַּי
  choice: die Mühe meiner Hände
  rationale: Bewahrt das hebräische Körperbild und bezeichnet Jakobs mühevolle eigene Arbeit.
- source_word: וַיּוֹכַח
  choice: und ... Recht gesprochen
  rationale: Gibt die forensische Bedeutung „entscheiden/rechtlich zurechtweisen“ wieder und vermeidet ein nicht ausdrücklich genanntes Objekt wie „dich“.
- source_word: אָמֶשׁ
  choice: gestern Nacht
  rationale: Im Zusammenhang mit Labans nächtlichem Traum ist dies die natürliche zeitliche Wiedergabe.
theological_decisions:
- issue: Der Gottesname וּפַחַד יִצְחָק
  choice: der Schrecken Isaaks
  alternative: der, den Isaak fürchtet; die Furcht Isaaks
  rationale: Die eigentümliche Titelform bleibt im Haupttext erhalten, damit ihre Mehrdeutigkeit und theologische Spannung nicht durch eine erklärende Paraphrase beseitigt werden.
- issue: Die Handlung Gottes in וַיּוֹכַח
  choice: Recht gesprochen
  alternative: zurechtgewiesen; entschieden; Recht verschafft
  rationale: Das Verb kann richterliches Entscheiden wie auch Zurechtweisung ausdrücken. Die gewählte Form wahrt die forensische Weite und lässt das im Hebräischen fehlende Objekt unausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung bildet die irreale Bedingung klar ab. Ungewöhnliche theologische Sprache wird nicht geglättet; erklärungsbedürftige Mehrdeutigkeiten stehen in knappen Fußnoten.
