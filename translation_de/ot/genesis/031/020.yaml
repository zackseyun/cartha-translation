  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: de
  text: Und Jakob täuschte Laban, den Aramäer, indem er ihm nicht sagte, dass er floh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jakob stahl das Herz Labans, des Aramäers.“ Das ist eine hebräische Redewendung dafür, jemanden zu täuschen oder zu überrumpeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב … אֶת־לֵב
  choice: täuschte
  rationale: Die wörtliche Verbindung „das Herz stehlen“ ist hier eine hebräische Redewendung für heimliches Handeln, durch das jemand getäuscht oder überrascht wird. „Täuschte“ gibt den Sinn im Deutschen verständlich wieder, ohne fälschlich an Zuneigung zu denken.
- source_word: הָאֲרַמִּי
  choice: den Aramäer
  rationale: „Aramäer“ entspricht der ethnisch-geografischen Bezeichnung des hebräischen Textes genauer als das traditionelle „Syrer“.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: indem er ihm nicht sagte
  rationale: Die Formulierung bezeichnet hier die Art und Weise beziehungsweise das Mittel der Täuschung und wird so in natürlichem Deutsch wiedergegeben.
- source_word: כִּי בֹרֵחַ הוּא
  choice: dass er auf der Flucht war
  rationale: Das Partizip בֹרֵחַ stellt die Flucht als gegenwärtigen beziehungsweise bereits im Gang befindlichen Vorgang dar. „Auf der Flucht war“ bewahrt diesen Aspekt besser als eine bloße Absichtsangabe wie „fliehen wollte“.
