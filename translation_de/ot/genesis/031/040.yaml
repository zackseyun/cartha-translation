source:
  edition: WLC
  text: הָיִ֧יתִי בַ/יּ֛וֹם אֲכָלַ֥/נִי חֹ֖רֶב וְ/קֶ֣רַח בַּ/לָּ֑יְלָה וַ/תִּדַּ֥ד שְׁנָתִ֖/י מֵֽ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: de
  text: Am Tag verzehrte mich die Hitze und in der Nacht der Frost; der Schlaf floh mir aus den Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher beginnt das Hebräische: »Ich war: Am Tag verzehrte mich die Hitze und in der Nacht der Frost.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[in die Satzkonstruktion aufgenommen]'
  rationale: Das einleitende »ich war« beschreibt Jakobs andauernden Zustand. Im natürlichen Deutschen wird seine Aussage durch die anschließenden Umstandsangaben vollständig ausgedrückt, ohne ein schwerfälliges ausdrückliches »ich war«.
- source_word: בַיּוֹם
  choice: Am Tag
  rationale: Die Zeitangabe steht im klaren Gegensatz zu »in der Nacht« und bezeichnet die Bedingungen während des Tages.
- source_word: אֲכָלַנִי
  choice: verzehrte mich
  rationale: Das Verb bedeutet wörtlich »fraß mich« und beschreibt bildhaft, wie die widrigen Bedingungen Jakob zusetzten. »Verzehrte mich« bewahrt das starke Bild in würdigem, natürlichem Deutsch.
- source_word: חֹרֶב
  choice: die Hitze
  rationale: Im Gegensatz zum nächtlichen Frost bezeichnet das Wort hier trockene, sengende Tageshitze.
- source_word: וְקֶרַח
  choice: und ... der Frost
  rationale: Das Substantiv bezeichnet Eis oder Frost. Im Zusammenhang mit der nächtlichen Kälte ist »Frost« präzise und idiomatisch.
- source_word: בַּלָּיְלָה
  choice: in der Nacht
  rationale: Die Zeitangabe bildet das natürliche deutsche Gegenstück zu »am Tag«.
- source_word: וַתִּדַּד
  choice: floh
  rationale: Das seltene Verb drückt ein Fortgehen oder Fliehen aus. Mit »der Schlaf« als Subjekt bewahrt »floh« die Personifikation des Hebräischen.
- source_word: שְׁנָתִי
  choice: der Schlaf
  rationale: Gemeint ist Jakobs Schlaf als Zustand; der bestimmte Ausdruck ist in der deutschen Wendung »der Schlaf floh mir aus den Augen« natürlich.
- source_word: מֵעֵינָי
  choice: mir aus den Augen
  rationale: Die hebräische Wendung beschreibt Schlaflosigkeit bildhaft. Die dativische deutsche Formulierung gibt »mein Schlaf ... aus meinen Augen« idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz zwischen Tag und Nacht sowie die beiden starken Personifikationen — die Hitze verzehrt, der Schlaf flieht — bleiben erhalten. Das einleitende הָיִיתִי wird zugunsten eines natürlichen deutschen Satzbaus implizit wiedergegeben.
