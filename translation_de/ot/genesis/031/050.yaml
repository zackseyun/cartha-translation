  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: de
  text: 'Wenn du meine Töchter schlecht behandelst oder neben meinen Töchtern noch andere Frauen heiratest – kein Mensch ist bei uns –, sieh: Gott ist Zeuge zwischen mir und dir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: schlecht behandelst
  rationale: Das Piel von ענה bezeichnet hier die Zufügung von Leid beziehungsweise schlechte Behandlung im ehelichen Verhältnis. „Schlecht behandeln“ ist gegenwärtig, verständlich und weniger missverständlich als „demütigen“.
- source_word: בְּנֹתַי
  choice: meine Töchter
  rationale: Die klare Possessivform wird an beiden Stellen wiedergegeben, um die Wiederholung und den Nachdruck des Hebräischen zu bewahren.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: dir neben meinen Töchtern noch andere Frauen nimmst
  rationale: Die Wendung meint zusätzliche Ehefrauen neben Labans Töchtern, nicht deren Ersetzung. „sich Frauen nehmen“ bewahrt zugleich den semitischen Ausdruck in natürlichem Deutsch.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: auch wenn kein Mensch bei uns ist
  rationale: 'Die konzessive Einordnung passt zum Zusammenhang: Obwohl kein menschlicher Zeuge anwesend ist, bleibt Gott Zeuge. „Mensch“ gibt den hier allgemein-menschlichen Sinn von אִישׁ idiomatisch und präzise wieder.'
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt in feierlicher Direktheit die Aufmerksamkeit auf Gott als Zeugen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Bundeskontext bezeichnet אֱלֹהִים den einen als Zeugen angerufenen Gott.
- source_word: עֵד
  choice: Zeuge
  rationale: Das Prädikatsnomen wird in der feierlichen Formel knapp und ohne unbestimmten Artikel wiedergegeben.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Die übliche deutsche Wiedergabe bezeichnet die gegenseitige Verantwortlichkeit der beiden Bundesparteien.
theological_decisions:
- issue: Allgemein-menschlicher Sinn von אִישׁ
  choice: kein Mensch bei uns ist
  alternative: kein Mann bei uns ist / niemand bei uns ist
  rationale: Im Zusammenhang geht es nicht speziell um das Geschlecht eines fehlenden Zeugen, sondern darum, dass kein menschlicher Zeuge anwesend ist. „Mensch“ erhält den Kontrast zu Gott und vermeidet die mögliche Fehlannahme, Frauen seien anwesend.
- issue: Funktion von אֵין אִישׁ עִמָּנוּ
  choice: 'konzessiv: „auch wenn kein Mensch bei uns ist“'
  alternative: 'als selbstständige Feststellung: „Kein Mensch ist bei uns“'
  rationale: Die konzessive Lesart macht den Gedankengang deutlich, ohne die echte syntaktische Mehrdeutigkeit zu verschweigen; die formalere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Bundeswarnung und die feierliche Zeugenformel bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
