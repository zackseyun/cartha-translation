  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: de
  text: Jakob sah Labans Gesicht, und siehe, es war Jakob gegenüber nicht mehr wie früher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und siehe, es war nicht mit ihm wie gestern und vorgestern.“ Die Zeitformel bedeutet: wie zuvor; die Wendung bezieht sich auf Labans sichtbare Haltung gegenüber Jakob.'
    reason: Bewahrt die hebräische Beziehungs- und Zeitformel und erläutert knapp den idiomatischen Bezug auf Labans Gesicht.
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Qal-Wayyiqtol von ראה ist das gewöhnliche Erzählverb für eine unmittelbare Wahrnehmung; „sah“ bewahrt diese Schlichtheit.
- source_word: פְּנֵי לָבָן
  choice: Laban ins Gesicht
  rationale: Die deutsche Wendung gibt das konkrete hebräische Bild natürlich wieder; das Gesicht lässt zugleich Labans erkennbare Haltung oder Stimmung hervortreten.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Siehe“ erhält den aufmerksamkeitslenkenden und vergegenwärtigenden Erzählton von הִנֵּה.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: Er war ihm nicht mehr so zugewandt
  rationale: Wörtlich heißt die Wendung „er war nicht mit ihm“. Im Zusammenhang bezeichnet sie Labans veränderte Haltung gegenüber Jakob; „zugewandt“ macht diesen Beziehungssinn verständlich, ohne ihn unnötig weiter auszudeuten.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: wie früher
  rationale: Die wörtliche Zeitformel „wie gestern und vorgestern“ ist ein Idiom für den bisherigen oder früheren Zustand. „Wie früher“ entspricht natürlichem modernem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Wahrnehmung von Labans Gesicht und das erzählerische „siehe“ bleiben erhalten; die hebräische Beziehungswendung wird für heutige Leser behutsam verdeutlicht.
