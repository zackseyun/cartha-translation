id: GEN.31.3
reference: Genesis 31:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Jakob: „Kehre zurück in das Land deiner Väter und zu deiner Verwandtschaft[a], und ich werde mit dir sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinem Geburtsort“ beziehungsweise „in dein Heimatland“. Das hebräische Wort kann sowohl die Verwandtschaft als auch den Herkunftsort bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ־ führt die Handlung fort; „Da sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שׁוּב
  choice: Kehre zurück
  rationale: Der Imperativ von שוב bezeichnet hier die Rückkehr in das Herkunftsland; „Kehre zurück“ ist präzise und dem würdigen Ton angemessen.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: in das Land deiner Väter
  rationale: Die Formulierung bildet die hebräische Genitivverbindung eng ab und bewahrt die konkrete Rede von den „Vätern“.
- source_word: וּלְמוֹלַדְתֶּךָ
  choice: und zu deiner Verwandtschaft
  rationale: מוֹלֶדֶת kann die Sippe beziehungsweise Verwandtschaft oder den Herkunftsort bezeichnen. Im Parallelismus mit dem Land der Väter ist „Verwandtschaft“ plausibel, ohne die örtliche Alternative zu verschweigen.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: und ich werde mit dir sein
  rationale: Die Wendung gibt die Zusage der göttlichen Gegenwart direkt und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im Ausgangstext steht der Tetragrammaton als Gottes Eigenname. „Jahwe“ bewahrt diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מוֹלֶדֶת
  choice: Verwandtschaft
  alternative: Geburtsort; Heimatland
  rationale: Der Ausdruck ist semantisch mehrdeutig und kann eine Verwandtschaftsgruppe oder den Herkunftsort meinen. Der Haupttext wählt im Kontext die personale Bedeutung; die Fußnote erhält die echte lexikalische Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und feierlich; der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
