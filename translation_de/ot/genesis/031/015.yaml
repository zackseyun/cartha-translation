source:
  edition: WLC
  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: de
  text: Gelten wir ihm nicht als Fremde? Denn er hat uns verkauft und sogar unser Geld völlig aufgezehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »hat sogar unser Silber völlig aufgegessen«. Das Hebräische gebraucht hier das Bild des Essens; גַּם und ein Infinitivus absolutus verstärken die Aussage und drücken vollständigen Verbrauch aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: nicht …?
  rationale: Leitet eine rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird; die deutsche Formulierung bewahrt diese Funktion.
- source_word: נָכְרִיּוֹת
  choice: Fremde
  rationale: Bezeichnet hier Frauen, die wie Außenstehende und nicht wie Angehörige der eigenen Familie behandelt werden.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: Gelten wir ihm
  rationale: Gibt das passive נחשבנו mit der Beziehung zu לוֹ in natürlichem modernem Deutsch wieder, ohne den Sinn des Beurteilens zu verlieren.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende rhetorische Frage ein.
- source_word: מְכָרָנוּ
  choice: er hat uns verkauft
  rationale: Bewahrt die abgeschlossene Handlung mit ihrer fortdauernden Bedeutung für die Klage der Töchter.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: vollständig aufgezehrt
  rationale: Das Verb mit Infinitivus absolutus und גַּם verstärkt die Aussage. „Aufgezehrt“ erhält das hebräische Bild des Essens und bezeichnet zugleich verständlich den völligen Verbrauch.
- source_word: אֶת כַּסְפֵּנוּ
  choice: unser Geld
  rationale: כֶּסֶף kann „Silber“ oder „Geld“ bedeuten; im wirtschaftlichen Zusammenhang ist „Geld“ die klare kontextuelle Wiedergabe.
