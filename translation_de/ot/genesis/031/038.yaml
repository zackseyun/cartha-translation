base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: de
  text: Nun bin ich seit zwanzig Jahren bei dir. Deine Mutterschafe und deine Ziegen haben keine Jungen verloren[a], und die Widder deiner Herde habe ich nicht gegessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben keine Fehlgeburt gehabt“. Das hebräische Verb kann allgemein bedeuten, des Nachwuchses beraubt zu werden; im Zusammenhang der Viehhaltung kann es eine Fehlgeburt oder den Verlust von Jungtieren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Diese zwanzig Jahre … nun
  rationale: Die hebräische Zeitangabe hebt die gesamte zurückliegende Dauer hervor; die deutsche Formulierung mit „nun“ gibt diesen demonstrativen Nachdruck natürlich wieder.
- source_word: אָנֹכִי עִמָּךְ
  choice: bin ich bei dir gewesen
  rationale: Der verblosen hebräischen Aussage wird im Deutschen durch das Perfekt eine über zwanzig Jahre bis zur Sprechsituation reichende Dauer gegeben.
- source_word: רְחֵלֶיךָ
  choice: deine Mutterschafe
  rationale: Das Substantiv bezeichnet weibliche Schafe; „Mutterschafe“ bewahrt hier die für Fortpflanzung und Jungtierverlust wichtige Geschlechtsspezifik.
- source_word: וְעִזֶּיךָ
  choice: deine Ziegen
  rationale: Das hebräische Wort bezeichnet weibliche Ziegen. Im heutigen Deutschen wird „Ziege“ gewöhnlich bereits für das weibliche Tier gebraucht, sodass „weibliche Ziegen“ unnötig schwerfällig wäre.
- source_word: לֹא שִׁכֵּלוּ
  choice: haben keine Jungen verloren
  rationale: Das Verb bezeichnet das Verlieren beziehungsweise Beraubtwerden von Nachwuchs. Die breitere Wiedergabe wahrt, dass im Herdenkontext sowohl Fehlgeburten als auch der Verlust bereits geborener Jungtiere gemeint sein kann.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: die Widder deiner Herde
  rationale: אֵילִים bezeichnet ausdrücklich Widder; die Genitivverbindung gibt die Zugehörigkeit zur Herde präzise wieder.
- source_word: לֹא אָכָלְתִּי
  choice: habe ich nicht gegessen
  rationale: Das deutsche Perfekt fasst Jakobs Verhalten während des gesamten zurückliegenden Dienstzeitraums zusammen.
