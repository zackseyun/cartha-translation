base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: de
  text: Da machte sich Jakob auf und setzte seine Söhne und seine Frauen auf die Kamele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hob seine Söhne und seine Frauen auf die Kamele“. Das hebräische Verb bedeutet wörtlich „heben“ oder „tragen“; hier ist wahrscheinlich das Hinaufsetzen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: Die Wegyiqtol-Form von קום führt die Erzählung fort und bezeichnet hier das Sich-Erheben zum Handeln. „Machte sich auf“ ist im Deutschen natürlich, würdevoll und kontextgemäß.
- source_word: וַיִּשָּׂא
  choice: setzte
  rationale: נשׂא bedeutet wörtlich „heben/tragen“; mit עַל und den Kamelen bezeichnet es hier idiomatisch, dass Jakob seine Angehörigen auf die Kamele setzte.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural בנים wird formgetreu und im Kontext passend mit „Söhne“ wiedergegeben.
- source_word: נָשָׁיו
  choice: seine Frauen
  rationale: Der Plural von אשה mit Jakob als Besitzer bezeichnet seine Ehefrauen. „Seine Frauen“ ist im modernen Deutschen eine natürliche Bezeichnung für mehrere Ehefrauen und bewahrt die knappe Form des Hebräischen.
- source_word: עַל הַגְּמַלִּים
  choice: auf die Kamele
  rationale: עַל kann in dieser Bewegungskonstruktion im Deutschen richtungsbezogen mit „auf die Kamele“ wiedergegeben werden; der Akkusativ macht das Hinaufsetzen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Da“ bildet den fortschreitenden hebräischen Erzählstil ab, ohne unnötig altertümlich zu wirken.
