  terminology: „Steinhaufen“, „Steinsäule“, „Zeuge/Zeugin“ und die personifizierende Zeugenfunktion sind angemessen. „Schaden anzurichten“ trifft die Bedeutung von לְרָעָה neutraler als „Böses zu tun“. Die Fußnote zu עֵדָה sollte nicht „Zeugnis“ als wörtliche Alternative ausgeben, da die parallele Zeugenfunktion gemeint ist.
