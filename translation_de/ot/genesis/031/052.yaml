base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: de
  text: 'Dieser Steinhaufen ist Zeuge[a], und diese Steinsäule ist Zeugin: Weder werde ich über diesen Steinhaufen hinweg zu dir gehen[b], noch wirst du über diesen Steinhaufen und diese Steinsäule hinweg zu mir gehen – um Schaden anzurichten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser Steinhaufen ist Zeuge, und diese Steinsäule ist Zeuge.“ Im Hebräischen wird die Zeugenfunktion beider Grenzzeichen parallel ausgedrückt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „überqueren“; gemeint ist das Überschreiten der durch die Steinzeichen markierten Grenze.'
    reason: lexical_alternative
  - marker: c
    text: „Um Schaden anzurichten“ bezeichnet schädliche oder feindselige Absicht, nicht jedes Betreten der anderen Seite. Die Schlussbestimmung steht im Hebräischen am Ende der zweiten Teilaussage und kann im Rahmen der wechselseitigen Abrede beide Verbote kennzeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד
  choice: Zeuge
  rationale: Das Prädikatsnomen bezeichnet die Funktion des Steinhaufens als bestätigenden Grenz- und Erinnerungszeugen.
- source_word: גַּל
  choice: Steinhaufen
  rationale: Im unmittelbaren Zusammenhang handelt es sich um den aufgeschichteten Steinhaufen, der als Grenzzeichen dient; die Ergänzung „Stein-“ macht das Bild im Deutschen eindeutig.
- source_word: וְעֵדָה
  choice: und die Steinsäule ist Zeugin
  rationale: Die Form steht parallel zu עֵד und weist der Steinsäule dieselbe Zeugenfunktion zu. Die feminine Form „Zeugin“ erhält die Parallelität und stimmt mit dem grammatischen Geschlecht von „Steinsäule“ überein.
- source_word: מַצֵּבָה
  choice: Steinsäule
  rationale: Gemeint ist ein aufgerichteter Stein als Denk- und Grenzzeichen; „Steinsäule“ ist anschaulich und im heutigen Deutsch verständlich.
- source_word: אִם ... לֹא
  choice: weder ... noch
  rationale: In diesem Schwur- und Bundeskontext leitet אִם nicht bloß eine offene Bedingung ein, sondern die bezeugten Verpflichtungen. Die deutsche Korrelativkonstruktion gibt die beiden parallelen negativen Festlegungen klar wieder.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: überschreiten
  rationale: Das Verb bezeichnet hier das Überschreiten der durch die Steinzeichen markierten Grenze. „Überschreiten“ bewahrt den räumlichen Sinn präzise.
- source_word: אֵלֶיךָ / אֵלַי
  choice: zu dir hin / zu mir hin
  rationale: Die Richtungsangabe wird ausdrücklich erhalten, ohne bereits Feindseligkeit in die Präposition hineinzulesen.
- source_word: לְרָעָה
  choice: um Böses zu tun
  rationale: Die Wendung bezeichnet einen schädlichen oder feindseligen Zweck. Die Formulierung ist natürlich, bewahrt aber die offene Breite von רָעָה.
theological_decisions:
- issue: Geltungsbereich von לְרָעָה
  choice: Die Zweckangabe gilt für beide Überschreitungsverbote.
  alternative: Die Zweckangabe nur auf das zweite Verbot beziehen.
  rationale: Ihre Endstellung kann formal zunächst an die zweite Aussage anschließen; in der symmetrischen Bundesabrede bezeichnet sie jedoch am natürlichsten die feindselige Absicht, die beiden Parteien beim Überschreiten untersagt ist. Der Gedankenstrich markiert sie als gemeinsame Schlussbestimmung, ohne sie in beide Glieder einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Rede von Steinhaufen und Steinsäule als Zeugen bleibt erhalten. „Weder ... noch“ macht die parallelen Verpflichtungen flüssig lesbar; der Gedankenstrich lässt die abschließende Zweckangabe erkennbar auf beide Verbote bezogen sein.
