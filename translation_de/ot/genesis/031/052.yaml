  to: 'Dieser Steinhaufen ist Zeuge[a], und diese Steinsäule ist Zeugin: Weder werde ich über diesen Steinhaufen hinweg zu dir gehen[b], noch wirst du über diesen Steinhaufen und diese Steinsäule hinweg zu mir gehen – um Schaden anzurichten[c].'
