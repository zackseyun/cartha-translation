  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: de
  text: Ich bin ein Fremder und wohne als Zugezogener bei euch. Gebt mir bei euch ein Grabgrundstück[a], damit ich meine Tote begraben und aus meinem Blickfeld entfernen kann[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Begräbnisplatz als Eigentum“. Das hebräische Wort bezeichnet einen festen Besitz oder ein Grundstück, nicht bloß eine Stelle für ein einzelnes Grab.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von vor meinem Angesicht weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: Fremder
  rationale: Das Wort bezeichnet jemanden, der außerhalb seines angestammten Landes und seiner Sippe lebt und dort keinen vollen einheimischen Rechts- und Landbesitzstatus hat. „Fremder“ ist verständlich und bewahrt Abrahams Außenseiterstellung.
- source_word: וְתוֹשָׁב
  choice: und wohne als Zugezogener
  rationale: תּוֹשָׁב bezeichnet einen ansässigen Nicht-Einheimischen. Die verbale Wiedergabe vermeidet das heute wenig verständliche „Beisasse“, bewahrt aber gegenüber גֵּר den zusätzlichen Gedanken des Wohnens ohne vollen einheimischen Besitzstatus.
- source_word: עִמָּכֶם
  choice: bei euch
  rationale: „Bei euch“ gibt die soziale und räumliche Zugehörigkeit in beiden Vorkommen natürlich wieder, ohne volle Gleichstellung oder Eigentum anzudeuten.
- source_word: תְּנוּ לִי
  choice: Gebt mir
  rationale: Der Imperativ von נתן ist unmittelbar und kann im Deutschen ebenso direkt wiedergegeben werden.
- source_word: אֲחֻזַּת קֶבֶר
  choice: Grabgrundstück
  rationale: אֲחֻזָּה bezeichnet hier nicht nur eine Grabstelle, sondern einen rechtlich verfügbaren Landbesitz. „Grabgrundstück“ verbindet den Bestattungszweck mit dem für das Kapitel wichtigen Eigentumsaspekt.
- source_word: וְאֶקְבְּרָה
  choice: damit ich … begrabe
  rationale: Der Kohortativ nach der Bitte drückt Zweck beziehungsweise beabsichtigte Folge aus; „damit“ bildet dies in natürlichem Deutsch ab.
- source_word: מֵתִי
  choice: meine Tote
  rationale: Die substantivierte Form steht im Singular und bezeichnet hier die verstorbene Angehörige. Das feminine „meine Tote“ entspricht dem Kontext mit Sara, ohne ihren Namen in den Vers einzufügen.
- source_word: מִלְּפָנַי
  choice: aus meinen Augen schaffe
  rationale: Die Wendung bedeutet wörtlich „von vor meinem Angesicht“. Die deutsche Formulierung bewahrt das Bild des Entfernens aus Abrahams Sicht- und Gegenwartsbereich und verbindet es verständlich mit der Bestattung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das geläufige „Fremder“ wird mit der verständlichen Umschreibung „wohne als Zugezogener“ verbunden, da „Beisasse“ die soziale Doppelbezeichnung zwar knapp, heute aber für viele Leser unverständlich wiedergibt. „Grabgrundstück“ hält den im Kapitel entscheidenden Besitzaspekt fest.
