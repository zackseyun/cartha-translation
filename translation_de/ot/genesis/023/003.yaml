lexical_decisions:
- source_word: וַיָּקָם
  choice: Dann stand Abraham … auf
  rationale: Das Wayyiqtol führt die Erzählung fort; „Dann“ markiert die zeitliche Folge, während „stand … auf“ die konkrete Bewegung von קום wiedergibt.
- source_word: מֵעַל פְּנֵי
  choice: von … auf
  rationale: Die Wendung bezeichnet hier das Aufstehen beziehungsweise Sich-Entfernen aus der unmittelbaren Nähe der Toten. Im Deutschen gibt „von seiner Toten aufstehen“ die Szene natürlicher wieder als ein wörtliches „vor dem Angesicht“.
- source_word: מֵתוֹ
  choice: seiner Toten
  rationale: Das substantivierte Adjektiv mit Suffix heißt knapp „seine Tote“. Die feminine Form ist durch den Kontext eindeutig und bewahrt die nüchterne Ausdrucksweise des Hebräischen, ohne „Frau“ ausdrücklich hinzuzufügen.
- source_word: וַיְדַבֵּר אֶל
  choice: und redete zu
  rationale: דבר mit אֶל bezeichnet das Reden zu bestimmten Adressaten. „Redete zu“ bewahrt zudem die formale Verbindung zur folgenden direkten Rede.
- source_word: בְּנֵי חֵת
  choice: den Söhnen Hets
  rationale: Dies entspricht der hebräischen Formulierung „Söhne Hets“ und bewahrt den Eigennamen; die geläufige ethnische Bezeichnung wird in der Fußnote genannt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den im nächsten Vers folgenden Redeinhalt ein. Ein Doppelpunkt erfüllt diese Funktion im heutigen Deutsch natürlicher als das formelhafte „und sprach:“ oder „indem er sagte“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und eindringliche Bezeichnung „seiner Toten“ bleibt erhalten; der Doppelpunkt verbindet den Vers natürlich mit der folgenden Rede.
