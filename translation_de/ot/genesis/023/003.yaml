  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: de
  text: 'Dann erhob sich Abraham von seiner Toten und sprach zu den Söhnen Hets[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Hetitern“; wörtlich: „den Söhnen Hets“.'
