lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand Abraham auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet das Aufstehen; „Da“ gibt die erzählerische Abfolge des waw consecutivum natürlich wieder.
- source_word: וַיִּשְׁתַּחוּ
  choice: verneigte sich
  rationale: Die Form von שׁחה bezeichnet ein ehrerbietiges Niederbeugen. „Verneigte sich“ wahrt die körperliche Geste, ohne eine vollständige Prostration zwingend vorauszusetzen.
- source_word: לְעַם הָאָרֶץ
  choice: vor dem Volk des Landes
  rationale: ל kennzeichnet hier die Bezugsgruppe der Verneigung; im Deutschen ist „sich vor jemandem verneigen“ idiomatisch. Die konkrete Formulierung „Volk des Landes“ bleibt erhalten.
- source_word: לִבְנֵי חֵת
  choice: vor den Söhnen Hets
  rationale: Die Wiederholung von „vor“ bildet die parallele hebräische Konstruktion verständlich ab. „Söhne Hets“ bewahrt die genealogische Gruppenbezeichnung des Ausgangstextes.
- source_word: חֵת
  choice: Het
  rationale: Der Eigenname wird nach geläufiger deutscher biblischer Namensform wiedergegeben; im Genitiv steht „Hets“.
