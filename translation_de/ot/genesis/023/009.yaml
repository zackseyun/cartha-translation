base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: de
  text: Möge er mir die Höhle von Machpela geben, die ihm gehört und am Rand seines Feldes liegt.[a] Für den vollen Preis in Silber möge er sie mir unter euch als Grabbesitz geben.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Ende seines Feldes«. Das hebräische Wort kann den Rand, das Ende oder den äußersten Bereich des Feldes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »für volles Silber«; gemeint ist die Zahlung des vollständigen Preises.'
    reason: lexical_alternative
  - marker: c
    text: »Grabbesitz« bezeichnet einen rechtlich gesicherten Besitz zum Begräbnis, nicht nur das Recht, die Stelle dafür zu nutzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Er soll mir … geben
  rationale: Der Imperfekt steht hier im Kontext einer höflichen Bitte und wird im Deutschen natürlich mit „soll“ wiedergegeben.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: die Höhle von Machpela
  rationale: Die Status-constructus-Verbindung mit dem Eigennamen wird in der geläufigen deutschen Form wiedergegeben.
- source_word: אֲשֶׁר לוֹ
  choice: die ihm gehört
  rationale: Gibt die Besitzangabe klar wieder und bewahrt den rechtlichen Zusammenhang der Verhandlung.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: am Rand seines Feldes liegt
  rationale: קָצֶה bezeichnet Rand, Ende oder äußersten Bereich; „am Rand“ ist räumlich natürlich, ohne die Lage unnötig zu präzisieren.
- source_word: בְּכֶסֶף מָלֵא
  choice: zum vollen Preis in Silber
  rationale: Die Wendung bedeutet die vollständige Bezahlung in Silber und schließt Geschenk oder Preisnachlass aus.
- source_word: יִתְּנֶנָּה
  choice: soll er sie mir … überlassen
  rationale: נתן bedeutet wörtlich „geben“; beim zweiten Vorkommen macht „überlassen“ den Eigentumsübergang in idiomatischem Deutsch deutlich, ohne ausdrücklich „verkaufen“ einzutragen.
- source_word: בְּתוֹכְכֶם
  choice: in eurer Mitte
  rationale: Bewahrt die räumlich-soziale Formulierung und lässt zugleich die öffentliche Anerkennung des Geschäfts anklingen.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: als Eigentum für eine Grabstätte
  rationale: אֲחֻזָּה bezeichnet einen rechtlich gesicherten Besitz; die Formulierung unterscheidet Eigentum von einem bloßen Nutzungsrecht.
