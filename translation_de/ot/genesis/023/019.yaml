source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: de
  text: Danach begrub Abraham seine Frau Sara in der Höhle auf dem Feld von Machpela, gegenüber von Mamre[a] (das ist Hebron), im Land Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Mamre“. Der hebräische Ausdruck bezeichnet eine Lage vor beziehungsweise gegenüber von Mamre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung markiert eine zeitliche Folge. „Danach“ ist im modernen Deutschen knapp und natürlich.
- source_word: קָבַר
  choice: begrub
  rationale: Das Verb bedeutet eindeutig „begraben“ und wird im Deutschen idiomatisch mit dem Präteritum „begrub“ wiedergegeben.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: seine Frau Sara
  rationale: Diese im Deutschen natürliche Wortstellung gibt sowohl die familiäre Beziehung als auch den Namen klar wieder.
- source_word: אֶל מְעָרַת
  choice: in der Höhle
  rationale: Obwohl אֶל grundsätzlich eine Bewegung auf etwas zu oder hinein ausdrücken kann, bezeichnet es hier beim Verb „begraben“ idiomatisch den Ort der Bestattung.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: die Höhle auf dem Feld von Machpela
  rationale: Die Formulierung gibt die Zugehörigkeit der Höhle zum Feld verständlich wieder, ohne Machpela unnötig eindeutig dem Feld oder einer Person zuzuordnen.
- source_word: הַמַּכְפֵּלָה
  choice: Machpela
  rationale: Der Ortsname wird in gebräuchlicher deutscher Form transliteriert; der hebräische Artikel wird bei einem Eigennamen nicht eigens wiedergegeben.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: gegenüber von Mamre
  rationale: Der räumliche Ausdruck bezeichnet eine Lage vor beziehungsweise gegenüber einem Ort. „Gegenüber von Mamre“ ist natürlich und legt keine unbelegte Himmelsrichtung fest.
- source_word: הִוא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die Wendung identifiziert beziehungsweise erläutert den zuvor genannten Ort in knapper, idiomatischer Form.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: „Land“ wird beibehalten, weil es im Hebräischen ausdrücklich steht und zur geografischen Ausdrucksweise der Genesis gehört.
