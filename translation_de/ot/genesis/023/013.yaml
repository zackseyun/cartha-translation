base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: de
  text: 'Und er sprach zu Efron im Beisein der Leute des Landes und sagte: »Wenn du doch auf mich hören wolltest! Ich gebe[a] das Silber für das Feld; nimm es von mir an, damit ich meine Verstorbene dort begraben kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Ich habe das Silber für das Feld gegeben“; das Perfekt bezeichnet hier wahrscheinlich ein förmliches, performatives Angebot in der Verhandlung. Möglich ist auch: „Ich werde das Silber für das Feld geben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und er redete
  rationale: „Redete“ bewahrt gegenüber einem bloßen „sagte“ den etwas förmlicheren Ton von דבר und passt zur öffentlichen Verhandlung.
- source_word: בְּאָזְנֵי
  choice: vor den Ohren
  rationale: Die im Deutschen verständliche Wendung bleibt nahe am hebräischen Bild und bezeichnet das öffentliche Sprechen in Gegenwart der Gemeinschaft.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die formelle Bezeichnung für die örtliche Bevölkerung beziehungsweise Gemeinschaft wird ohne vorschnelle soziale oder politische Präzisierung bewahrt.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Wenn du doch auf mich hören wolltest!
  rationale: Die idiomatische, elliptische Verbindung drückt eine höfliche, nachdrückliche Bitte aus. Die Wiedergabe ist im Deutschen natürlich und bewahrt die Wunschkomponente von לוּ.
- source_word: נָתַתִּי
  choice: Ich gebe
  rationale: Das hebräische Perfekt kann hier im Rahmen der Verhandlung performativ eine verbindliche gegenwärtige Offerte ausdrücken. „Ich gebe“ vermittelt diese Funktion; die formnähere und futurische Möglichkeit wird in der Fußnote genannt.
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: das Silber für das Feld
  rationale: „Silber“ erhält die konkrete wirtschaftliche Ausdrucksweise; „für das Feld“ gibt die Genitivverbindung idiomatisch wieder.
- source_word: קַח מִמֶּנִּי
  choice: nimm es von mir an
  rationale: Das aus dem Kontext erschlossene Pronomen bezieht sich auf das Silber. „Annehmen“ gibt in der Verhandlung den Sinn des geforderten Entgegennehmens natürlich wieder.
- source_word: וְאֶקְבְּרָה
  choice: damit ich … begraben kann
  rationale: Die Kohortativform bezeichnet Abrahams beabsichtigten Zweck beziehungsweise das angestrebte Ergebnis der Zahlung.
- source_word: מֵתִי
  choice: meine Tote
  rationale: Der substantivierte Ausdruck bleibt nahe am Hebräischen und macht im Deutschen das grammatische Geschlecht der hier gemeinten Verstorbenen erkennbar, ohne ihren Namen ergänzend einzufügen.
- source_word: שָׁמָּה
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des lokativen Adverbs.
