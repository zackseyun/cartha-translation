  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: de
  text: Da verbeugte sich Abraham vor dem Volk des Landes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »warf sich Abraham vor dem Volk des Landes nieder«.'
    reason: 'Lexikalische Alternative: Das hebräische Verb kann eine tiefere Verbeugung bis hin zum Niederwerfen bezeichnen.'
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: verbeugte sich
  rationale: Die Form bezeichnet hier eine körperliche Geste der Ehrerbietung. Im Zusammenhang der Verhandlung gibt »verbeugte sich« den Sinn natürlich wieder, ohne religiöse Anbetung anzudeuten.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Verbindung bedeutet idiomatisch »vor« beziehungsweise »in Gegenwart von«; »vor« ist knapp und natürlich.
- source_word: עַם
  choice: Volk
  rationale: Das Wort bezeichnet die örtliche Bevölkerung als soziale Gemeinschaft und Zeugen der Verhandlung.
- source_word: הָאָרֶץ
  choice: des Landes
  rationale: In der festen Verbindung עַם הָאָרֶץ bewahrt »Volk des Landes« die Ausdrucksweise und den Bezug auf die Bewohner der Gegend.
- source_word: וַ
  choice: Da
  rationale: Das vorangestellte Waw mit der Erzählform führt die Handlung weiter; »Da« vermittelt die zeitliche Abfolge in natürlichem Deutsch.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Form.
theological_decisions: []
