base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: de
  text: 'Da hörte Abraham auf Efron und wog Efron das Silber ab, das Efron vor den Söhnen Hets[a] genannt hatte: vierhundert Schekel Silber nach handelsüblichem Gewicht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Hetiter«; wörtlich: »die Söhne Hets«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von den Händlern anerkannt«; die Wendung kann sich auf im Handel gültiges Silber oder auf ein übliches Handelsgewicht beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: hörte ... auf
  rationale: Die hebräische Wendung bezeichnet hier, dass Abraham Efrons Forderung Gehör schenkte und entsprechend handelte, ohne das Verb ausdrücklich als »zustimmen« auszudeuten.
- source_word: וַיִּשְׁקֹל
  choice: wog ... ab
  rationale: Das Verb bezeichnet konkret das Abwiegen des noch nicht geprägten Silbers und bewahrt so den historischen Zahlungsvorgang.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: Die Wiedergabe behält sowohl den Werkstoff als auch seine Funktion als Zahlungsmittel bei.
- source_word: אֲשֶׁר דִּבֶּר
  choice: von dem er ... gesprochen hatte
  rationale: Die Formulierung bleibt eng beim allgemeinen Verb »sprechen«; aus dem Zusammenhang ergibt sich, dass Efron den Betrag genannt hatte.
- source_word: בְּאָזְנֵי
  choice: vor den Ohren
  rationale: Die im Deutschen verständliche wörtliche Wendung bewahrt den öffentlichen und bezeugten Charakter der Preisangabe.
- source_word: בְנֵי חֵת
  choice: die Söhne Hets
  rationale: Die genealogisch geprägte hebräische Bezeichnung wird im Haupttext erhalten; die geläufige Volksbezeichnung steht in der Fußnote.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: vierhundert Schekel Silber
  rationale: Die Formulierung gibt Maß und Material knapp und historisch sachgerecht wieder.
- source_word: עֹבֵר לַסֹּחֵר
  choice: wie es bei den Händlern gebräuchlich war
  rationale: Die idiomatische Wendung bezeichnet wahrscheinlich im Handel gängiges beziehungsweise anerkanntes Silber; die Übersetzung ist verständlich, ohne die genauere Nuance abschließend festzulegen.
