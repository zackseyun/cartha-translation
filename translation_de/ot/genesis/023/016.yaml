revisions:
- from: 'Da hörte Abraham auf Efron und wog ihm das Silber ab, von dem er vor den Ohren der Söhne Hets[a] gesprochen hatte: vierhundert Schekel Silber, wie es bei den Händlern gebräuchlich war.[b]'
  to: 'Da hörte Abraham auf Efron und wog Efron das Silber ab, das Efron vor den Söhnen Hets[a] genannt hatte: vierhundert Schekel Silber nach handelsüblichem Gewicht.[b]'
  rationale: Die Revision beseitigt die deutsche Bezugsunklarheit, ersetzt eine unidiomatische wörtliche Formulierung durch natürliches modernes Deutsch und präzisiert die Handelsformel, ohne ihre lexikalisch diskutierte Nuance festzulegen. Namen, Maßangabe, Silberzahlung und die öffentliche Nennung des Preises bleiben erhalten.
