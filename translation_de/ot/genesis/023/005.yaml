lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: antworteten
  rationale: Das Qal-Wayyiqtol von ענה bezeichnet im Dialog eine Antwort; „antworteten“ ist im Deutschen die natürliche narrative Wiedergabe.
- source_word: בְנֵי חֵת
  choice: die Söhne Hets
  rationale: Die wörtliche Wiedergabe bewahrt den hebräischen Verwandtschaftsausdruck und den Personennamen Het. Die kontextuelle Gruppenbezeichnung „die Hetiter“ bleibt als Fußnotenalternative erhalten.
- source_word: אֶת אַבְרָהָם
  choice: Abraham
  rationale: אֶת kennzeichnet Abraham als bestimmtes direktes Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: לֵאמֹר לוֹ
  choice: ':'
  rationale: Die Formel „um zu sagen zu ihm“ leitet die unmittelbar folgende wörtliche Rede ein. Im natürlichen modernen Deutsch erfüllt hier der Doppelpunkt dieselbe Diskursfunktion, ohne den Inhalt zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Abstammungsbezeichnung wird formal bewahrt; die Redeeinleitungsformel wird idiomatisch durch einen Doppelpunkt wiedergegeben.
