  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: de
  text: 'Die Söhne Hets antworteten Abraham[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hethiter“. Hebräisch: „die Söhne Hets“.'
