  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: de
  text: '»Mein Herr, hören Sie mich an: Ein Stück Land für vierhundert Schekel Silber – was ist das schon zwischen mir und Ihnen? Bestatten Sie Ihre Tote.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und elliptischer: »Land – vierhundert Schekel Silber – was ist das zwischen mir und Ihnen?« In der Verhandlung wird der Preis rhetorisch als unbedeutend dargestellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mein Herr
  rationale: Respektvolle Anrede an Efron, nicht Gottesbezeichnung; bewahrt die soziale Höflichkeit des Singulars.
- source_word: שְׁמָעֵנִי
  choice: hören Sie mich an
  rationale: Der Imperativ bezeichnet hier eine höfliche, aber direkte Aufforderung. Die Sie-Anrede entspricht dem respektvollen Ton.
- source_word: אֶרֶץ
  choice: ein Stück Land
  rationale: Im Verhandlungskontext ist ein konkretes Grundstück gemeint; die Wiedergabe bleibt gegenüber dem spezifischeren »Feld« zurückhaltend.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: für vierhundert Schekel Silber
  rationale: Gibt den elliptisch genannten Preis beziehungsweise Wert idiomatisch wieder, ohne »wert« ausdrücklich in den Haupttext einzufügen.
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: was ist das schon zwischen mir und Ihnen?
  rationale: Bewahrt die persönliche Formulierung und macht mit »schon« die rhetorische Verharmlosung des Betrags natürlich verständlich.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Bestatten Sie Ihre Tote
  rationale: Das substantivierte מֵת steht hier feminin singular und bezieht sich im Kontext auf Sara. »Bestatten« ist würdig und natürlich; das vorangestellte Objekt wird im Deutschen nicht künstlich nachgebildet.
