revisions:
- from: 'Und er redete mit ihnen und sagte: »Wenn es euer Wille ist, dass ich meine Verstorbene begrabe und sie so aus meinem Blick nehme, dann hört auf mich und legt bei Efron, dem Sohn Zohars, Fürsprache für mich ein.[a]«'
  to: 'Und er redete mit ihnen und sagte: »Wenn es euer Wille ist, dass ich meine Verstorbene aus meinem Blickfeld begrabe, dann hört mich an und setzt euch für mich bei Efron, dem Sohn Zohars, ein.[a]«'
  rationale: Die Revision hält die Bestattungsbitte und die idiomatische Bedeutung von „von vor mir weg“ in einer einzigen, dem hebräischen Satzbau näheren Infinitivphrase zusammen. „Hört mich an“ ist im modernen Standarddeutsch eindeutiger. Für die Bitte an die Anwesenden wird eine natürliche, kontextgerechte Formulierung gewählt, während die Fußnote die breitere lexikalische Möglichkeit transparent macht.
