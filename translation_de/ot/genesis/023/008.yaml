  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: de
  text: 'Und er redete mit ihnen und sagte: »Wenn es euer Wille ist, dass ich meine Verstorbene aus meinem Blickfeld begrabe, dann hört mich an und setzt euch für mich bei Efron, dem Sohn Zohars, ein.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wendet euch für mich an Efron, den Sohn Zohars«. Das hebräische Verb kann sowohl das Herantreten an jemanden als auch das bittende Eintreten bei ihm bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: Und er redete mit ihnen und sagte
  rationale: דבר mit אֵת bezeichnet hier das Reden mit den Angesprochenen; לֵאמֹר leitet die direkte Rede ein. Die Formulierung bildet die hebräische Erzählstruktur in natürlichem Deutsch ab.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Wenn es euer Wille ist
  rationale: Die Wendung mit נֶפֶשׁ bezeichnet idiomatisch den Willen oder Wunsch der Angesprochenen, nicht bloß die »Seele« im engeren Sinn.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: dass ich meine Verstorbene begrabe
  rationale: Das Subjekt des Begrabens ergibt sich aus dem Zusammenhang. »Meine Verstorbene« wahrt den substantivischen Ausdruck »meine Tote/mein Toter« und gibt im Deutschen das aus dem Kontext bekannte Geschlecht Saras natürlich wieder, ohne die Bezeichnung »Frau« einzufügen.
- source_word: מִלְּפָנַי
  choice: und sie so aus meinem Blick nehme
  rationale: Wörtlich steht »von meinem Angesicht/vor mir weg«. Im Bestattungskontext bezeichnet die Wendung, dass die Verstorbene durch das Begräbnis nicht länger vor Abraham liegt. Die gewählte Formulierung vermeidet die im Deutschen oft abweisend klingende Redensart »aus den Augen schaffen«.
- source_word: שְׁמָעוּנִי
  choice: hört auf mich
  rationale: Der Imperativ fordert hier dazu auf, Abrahams Bitte Gehör zu schenken; »hört auf mich« ist verständlich und bewahrt die Aufforderung.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: und legt bei Efron … Fürsprache für mich ein
  rationale: פגע mit ב kann neben Begegnung oder Herantreten auch das dringliche Bitten beziehungsweise Eintreten bei jemandem ausdrücken. Im Verhandlungskontext bittet Abraham die Leute, sich seinetwegen an Efron zu wenden.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Efron, dem Sohn Zohars
  rationale: Die Eigennamen werden in geläufiger deutscher Umschrift wiedergegeben; בן wird transparent mit »Sohn« übersetzt.
