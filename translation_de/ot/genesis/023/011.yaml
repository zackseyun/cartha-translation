  source_fidelity: Die Übersetzung gibt die performativen hebräischen Perfektformen treffend mit Präsens wieder und bewahrt die dreifache Gabeformel. „Das Feld gebe ich dir“ sowie die anschließende Gabe der Höhle entsprechen der Satzstruktur und dem Besitztransfer des Ausgangstextes. „Vor den Augen“ erhält den öffentlichen Zeugencharakter von לְעֵינֵי. „Begrabe deine Tote“ macht den im Kontext auf Sara bezogenen singularischen Ausdruck מֵתֶךָ angemessen wieder.
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch und wahrt zugleich einen würdigen erzählerisch-biblischen Registerton. Die leicht hervorgehobene Wortstellung in „Das Feld gebe ich dir“ ist im Kontext einer feierlichen öffentlichen Erklärung natürlich.
  terminology: „Mein Herr“ gibt die respektvolle Anrede אֲדֹנִי sachgerecht wieder, ohne eine stärkere soziale Abhängigkeit hineinzulesen. „Angehörigen meines Volkes“ ist eine idiomatische Wiedergabe von בְנֵי עַמִּי; sie trägt die Bedeutung der versammelten Gemeinschaft beziehungsweise öffentlichen Zeugen, ohne eine unvertretbar enge biologische oder ausschließlich männliche Lesart festzuschreiben.
