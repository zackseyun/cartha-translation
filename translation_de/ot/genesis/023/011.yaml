  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: de
  text: '„Nein, mein Herr, hör mir zu: Das Feld gebe ich dir, und die Höhle, die darin ist, gebe ich dir. Vor den Augen der Angehörigen meines Volkes gebe ich sie dir. Begrabe deine Tote.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: Nein
  rationale: Die Negation dient hier als höflicher Widerspruch beziehungsweise als Zurückweisung von Abrahams Vorschlag; „Nein“ ist im modernen Deutschen natürlich und prägnant.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede bewahrt die soziale Höflichkeit der Verhandlung, ohne ein Herr-Knecht-Verhältnis zu unterstellen.
- source_word: שְׁמָעֵנִי
  choice: hör mir zu
  rationale: Der Imperativ von שׁמע fordert Abraham nachdrücklich, aber höflich zum Zuhören auf; diese Wendung ist gegenwärtiges, natürliches Deutsch.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: שׂדה bezeichnet hier das zur Höhle gehörende Grundstück beziehungsweise Feld; „Feld“ ist die direkte und kontextgerechte Entsprechung.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: gebe ich dir / gebe ich sie dir
  rationale: 'Die Perfektformen haben in dieser öffentlichen Verhandlung performative Kraft: Mit den Worten vollzieht Efron die angebotene Übereignung. Das deutsche Präsens gibt dies angemessen wieder.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: die Höhle, die darin ist
  rationale: Die Formulierung hält die räumliche Beziehung zum Feld ausdrücklich fest und bleibt zugleich verständlich.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Vor den Augen der Angehörigen meines Volkes
  rationale: „Vor den Augen“ bewahrt das hebräische Bild einer öffentlichen Erklärung vor Zeugen; „Angehörige meines Volkes“ gibt בְּנֵי עַמִּי idiomatisch wieder, ohne eine ausschließlich männliche Gruppe zu behaupten.
- source_word: קְבֹר מֵתֶךָ
  choice: Begrabe deine Tote
  rationale: Das substantivierte Singularwort מֵתֶךָ bezieht sich im Kontext konkret auf Sara. Die feminine Form macht diesen eindeutigen Bezug im Deutschen natürlich sichtbar.
theological_decisions: []
