  yaml_path: translation/ot/genesis/023/014.yaml
  text: And Ephron answered Abraham, saying to him,
translation:
  language: de
  text: 'Efron antwortete Abraham:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Das Wayyiqtol von ענה bezeichnet im erzählenden Dialog eine Erwiderung. „Antwortete“ gibt die Gesprächsfolge unmittelbar und idiomatisch wieder.
- source_word: עֶפְרוֹן
  choice: Efron
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Schreibweise wiedergegeben.
- source_word: אֶת אַבְרָהָם
  choice: Abraham
  rationale: אֶת ist der unübersetzte Akkusativmarker; Abraham ist hier das Objekt beziehungsweise der Angesprochene.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nach einem Verb des Antwortens leitet לֵאמֹר die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sagte“.
- source_word: לוֹ
  choice: Abraham
  rationale: Das Pronomen bezieht sich auf Abraham. Da das Deutsche bei „jemandem antworten“ bereits den Adressaten nennt, ist seine Funktion in „antwortete Abraham“ enthalten und wird nicht redundant als „ihm“ wiederholt.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Erzählsprache. Die hebräische Doppelung aus „antwortete“ und „sagend zu ihm“ wird funktional durch das deutsche Redeeinleitungsmuster mit Doppelpunkt wiedergegeben.
