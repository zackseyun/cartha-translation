- from: So wurden das Feld und die Höhle darin Abraham von den Söhnen Hets[a] rechtsgültig als Begräbnisbesitz[b] übereignet.
  to: So wurden das Feld und die darin liegende Höhle Abraham von den Söhnen Hets[a] als Begräbnisbesitz[b] übereignet.
  rationale: Die Revision beseitigt die stilistische Redundanz von „rechtsgültig“ neben „übereignet“ und glättet die deutsche Formulierung der zugehörigen Höhle. Die rechtliche Übertragung, der Bestattungszweck und die formnahe Volksbezeichnung bleiben erhalten.
