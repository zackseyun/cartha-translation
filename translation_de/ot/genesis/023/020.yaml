base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: de
  text: So wurden das Feld und die darin liegende Höhle Abraham von den Söhnen Hets[a] als Begräbnisbesitz[b] übereignet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Hetitern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „als Eigentum für eine Grabstätte“. Das hebräische Wort bezeichnet einen rechtlich gesicherten Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: wurden … rechtsgültig übereignet
  rationale: Das Verb קום bezeichnet in diesem Kaufzusammenhang die rechtliche Bestätigung beziehungsweise Übertragung des Grundstücks. Die gewählte Formulierung gibt diese Rechtswirkung in natürlichem Deutsch wieder.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Direkte und kontextgemäße Wiedergabe des erworbenen Grundstücks.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: und die Höhle darin
  rationale: Gibt den Relativausdruck knapp und natürlich wieder; das Suffix bezieht sich auf das Feld.
- source_word: לְאַבְרָהָם
  choice: Abraham
  rationale: Kennzeichnet Abraham als Empfänger und neuen rechtmäßigen Eigentümer; im deutschen Satz wird kein zusätzliches „an“ benötigt.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: als Begräbnisbesitz
  rationale: Bewahrt sowohl den Bestattungszweck als auch den rechtlichen Besitzcharakter von אֲחֻזָּה.
- source_word: מֵאֵת
  choice: von
  rationale: Natürliche deutsche Kennzeichnung der veräußernden Partei.
- source_word: בְּנֵי חֵת
  choice: die Söhne Hets
  rationale: Formnahe Wiedergabe der hebräischen Volksbezeichnung; die geläufige kontextuelle Entsprechung „Hetiter“ steht in der Fußnote.
