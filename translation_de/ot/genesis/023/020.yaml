  source_fidelity: 'Der Entwurf gibt die Bestandteile des hebräischen Rechtssatzes zuverlässig wieder: Feld und zugehörige Höhle, Abraham als Begünstigter, der Besitzcharakter für ein Grab sowie die Söhne Hets als veräußernde Partei. „Übereignet“ trifft die im Kontext rechtlich bestätigte Eigentumsübertragung von וַיָּקָם angemessen.'
  naturalness: „Begräbnisbesitz“ ist verständlich und bewahrt die juristische Nuance, wirkt aber leicht verdichtend. Die Verbindung „rechtsgültig ... übereignet“ ist redundant, da „übereignet“ selbst bereits eine rechtliche Eigentumsübertragung bezeichnet. „Die darin liegende Höhle“ klingt im modernen Standarddeutsch etwas flüssiger als die nachgestellte Kurzform „die Höhle darin“.
  terminology: „Söhne Hets“ ist eine zulässige formnahe Wiedergabe von בְּנֵי־חֵת; die Fußnote mit „Hetitern“ bietet die geläufige ethnische Entsprechung. „Begräbnisbesitz“ bewahrt den Besitz- bzw. Holding-Aspekt von אֲחֻזַּת קָבֶר besser als ein bloßes „Grabstätte“.
