  source_fidelity: Die Orts- und Besitzangaben sowie die vollständige Aufzählung des Grundstücks, der Höhle und der Bäume sind grundsätzlich zutreffend. Für וַיָּקָם ist im Kaufkontext ein rechtlicher Bestätigungs-/Übereignungssinn angemessen. „Rechtskräftig“ fügt jedoch die spezielle Vorstellung der formellen Unanfechtbarkeit einer gerichtlichen oder behördlichen Entscheidung hinzu, die der hebräische Text nicht ausdrückt.
  naturalness: Der Satz ist insgesamt verständlich und dem formellen Inventarstil angemessen. „Innerhalb seiner gesamten ringsum verlaufenden Grenze“ ist jedoch schwerfällig und syntaktisch unnatürlich. „Innerhalb seines gesamten Grenzverlaufs“ bewahrt den umfassenden Umfang der Grundstücksgrenze in idiomatischerem Deutsch.
  terminology: „Als Eigentum bestätigt“ gibt den rechtlichen Kontext von קום zurück, ohne die nicht ausdrücklich genannte Übertragungsmodalität näher festzulegen. Machpela und Mamre sind sachgerecht wiedergegeben. Die explizite Wiederholung von „das Feld und die Höhle“ entspricht besser der hebräischen Inventarform als die zusammenfassende Formulierung mit „samt“.
  issues:
