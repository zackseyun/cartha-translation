  text: וַ/יָּ֣קָם שְׂדֵ֣ה עֶפְר֗וֹן אֲשֶׁר֙ בַּ/מַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִ/פְנֵ֣י מַמְרֵ֑א הַ/שָּׂדֶה֙ וְ/הַ/מְּעָרָ֣ה אֲשֶׁר בּ֔/וֹ וְ/כָל הָ/עֵץ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה אֲשֶׁ֥ר בְּ/כָל גְּבֻל֖/וֹ סָבִֽיב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: de
  text: So wurde Efrons Feld bei Machpela, das vor Mamre lag – das Feld und die Höhle darin und alle Bäume auf dem Feld innerhalb seines gesamten Grenzverlaufs – als Eigentum bestätigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde begründet“ oder „wurde übertragen“. Das hebräische Verb hat hier im Zusammenhang des Kaufs wahrscheinlich einen rechtlichen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: wurde … rechtskräftig übertragen
  rationale: קום bezeichnet hier im Zusammenhang des Grundstückskaufs nicht das körperliche Aufstehen, sondern das rechtswirksame Zustandekommen beziehungsweise die Bestätigung der Eigentumsübertragung. Die Formulierung gibt diesen juristischen Sinn im Deutschen natürlich wieder.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: Efrons Feld
  rationale: Die hebräische Genitivverbindung wird im Deutschen knapp und natürlich als Besitzverhältnis wiedergegeben.
- source_word: בַּמַּכְפֵּלָה
  choice: bei Machpela
  rationale: Machpela wird als Ortsname transkribiert; „bei“ bezeichnet die Lage des Feldes, ohne den räumlichen Bezug unnötig einzuengen.
- source_word: אֲשֶׁר לִפְנֵי מַמְרֵא
  choice: das vor Mamre lag
  rationale: „Vor Mamre“ bewahrt die räumliche Ausdrucksweise von לִפְנֵי, ohne eine bestimmte Himmelsrichtung festzulegen.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: das Feld samt der Höhle darin
  rationale: „Samt“ macht deutlich, dass die Höhle als Bestandteil des genau bezeichneten Grundstücks mit eingeschlossen war, und bildet die juristische Aufzählung verständlich ab.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: und allen Bäumen auf dem Feld
  rationale: Das kollektive Singularwort עֵץ mit כָל wird im Deutschen idiomatisch als Gesamtheit der einzelnen Bäume wiedergegeben.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: innerhalb seiner gesamten ringsum verlaufenden Grenze
  rationale: Die Wiedergabe erhält sowohl den umfassenden Charakter von כָל als auch den Hinweis auf die das Grundstück ringsum umschließende Grenzlinie.
