revisions:
- from: So wurde Efrons Feld bei Machpela, das vor Mamre lag – das Feld samt der Höhle darin und allen Bäumen auf dem Feld innerhalb seiner gesamten ringsum verlaufenden Grenze – rechtskräftig übertragen.[a]
  to: So wurde Efrons Feld bei Machpela, das vor Mamre lag – das Feld und die Höhle darin und alle Bäume auf dem Feld innerhalb seines gesamten Grenzverlaufs – als Eigentum bestätigt.[a]
  rationale: Die Revision vermeidet die im Deutschen zu spezifische rechtstechnische Nuance von „rechtskräftig“, erhält aber den im Kontext wahrscheinlichen rechtlichen Sinn des hebräischen Verbs. Zudem wird die Grundstücksbeschreibung näher an ihrer hebräischen Aufzählungsstruktur und zugleich in natürlicherem modernem Standarddeutsch wiedergegeben.
