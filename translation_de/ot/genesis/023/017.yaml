    issue: „rechtskräftig übertragen“
    rationale: „Rechtskräftig“ ist ein enger deutscher Rechtsbegriff und legt eine finale, nicht mehr anfechtbare Entscheidung nahe. Der hebräische Ausdruck bezeichnet hier eher die rechtliche Bestätigung bzw. das Zustandekommen des Eigentumsstatus.
  - severity: low
