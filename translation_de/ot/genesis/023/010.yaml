  variant: modern standard German
source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: de
  text: Efron saß mitten unter den Söhnen Hets.[a] Da antwortete Efron, der Hetiter, Abraham in Hörweite der Söhne Hets und vor allen, die durch das Tor seiner Stadt kamen:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Hetitern“; wörtlich steht hier und beim zweiten Vorkommen „Söhne Hets“.'
    reason: lexical_alternative
  - marker: b
    text: Das Stadttor war der öffentliche Ort, an dem Rechts- und Handelsgeschäfte vor Zeugen verhandelt wurden.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt Efrons gegenwärtige Haltung beziehungsweise Position in der Szene. Das deutsche Präteritum „saß“ gibt diesen Hintergrundzustand natürlich wieder, ohne ein im Hebräischen nicht vorhandenes Zeitadverb einzuführen.
- source_word: בְּתוֹךְ
  choice: mitten unter
  rationale: Die Wendung bezeichnet Efrons Anwesenheit innerhalb der versammelten Gruppe; „mitten unter“ ist anschaulich und im Deutschen natürlich.
- source_word: בְּנֵי חֵת
  choice: die Söhne Hets
  rationale: Die formal nähere Wiedergabe bewahrt die hebräische Sippenbezeichnung und unterscheidet sie von der anschließenden Volksbezeichnung „der Hetiter“. Eine verständlichere ethnische Alternative wird in der Fußnote genannt.
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: „Antwortete“ ist die übliche Wiedergabe im Dialog. „Da“ bildet den erzählerischen Fortgang des Waw-Konsekutivs ab, ohne ein ausdrückliches „jetzt“ einzuführen.
- source_word: הַחִתִּי
  choice: der Hetiter
  rationale: Der bestimmte Artikel wird durch die bestimmte ethnische Bezeichnung wiedergegeben.
- source_word: בְּאָזְנֵי
  choice: in Hörweite
  rationale: Die hebräische Wendung bedeutet, dass die Aussage öffentlich und für die Anwesenden hörbar gemacht wurde. „In Hörweite“ bewahrt den Bezug auf das Hören und klingt im modernen Deutschen natürlich.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: vor allen, die durch das Tor seiner Stadt kamen
  rationale: Die Formulierung bezeichnet die Öffentlichkeit und die Zeugen am Stadttor; sie folgt zugleich eng der räumlichen Bildsprache des Hebräischen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen die im nächsten Vers folgende direkte Rede natürlicher ein als ein zusätzliches „und sagte“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sippenbezeichnung bleibt formal erhalten; der öffentliche und rechtliche Charakter der Szene wird durch „in Hörweite“ und „vor allen“ deutlich. Der Satz endet mit einem Doppelpunkt, weil die direkte Rede in Vers 11 folgt.
