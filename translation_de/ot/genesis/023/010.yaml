  source_fidelity: 'Die Übersetzung gibt die hebräische Szenenführung und die syntaktischen Beziehungen zuverlässig wieder: Efron befindet sich innerhalb der Gruppe der Söhne Hets, antwortet Abraham öffentlich und die Rede wird in den folgenden Vers eingeleitet. „Saß“ ist für das situationsbeschreibende Partizip angemessen; „Da antwortete“ gibt den erzählerischen Fortgang natürlich wieder.'
