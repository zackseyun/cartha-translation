source:
  edition: WLC
  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: de
  text: Und Sara starb in Kirjat-Arba – das ist Hebron[a] – im Land Kanaan, und Abraham kam, um Sara zu beklagen und über sie zu weinen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirjat-Arba wird hier mit Hebron gleichgesetzt.
    reason: cross_reference
  - marker: b
    text: „Sara beklagen“ kann auch „für Sara Totenklage halten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: starb
  rationale: מות bezeichnet hier unmittelbar den Tod; „starb“ gibt die schlichte Aussage des Hebräischen ohne beschönigende Umschreibung wieder.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: in Kirjat-Arba
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, quellenahen Form transliteriert; der Bindestrich macht die Namenseinheit lesbar.
- source_word: הִוא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die hebräische Apposition identifiziert Kirjat-Arba mit Hebron. „Das ist Hebron“ bewahrt diese erklärende Gleichsetzung knapp und natürlich.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Da אֶרֶץ ausdrücklich steht, bleibt „Land“ erhalten; „Kanaan“ ist die etablierte deutsche Namensform.
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: בוא kann je nach Perspektive „kommen“ oder „gehen“ bedeuten. „Da kam“ folgt der Erzählperspektive und gibt zugleich die fortschreitende Handlung wieder.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: um Sara zu beklagen
  rationale: ספד bezeichnet die Totenklage beziehungsweise das öffentliche oder rituelle Beklagen. „Beklagen“ ist hier präziser als das allgemeinere „trauern“ und bleibt in modernem Deutsch verständlich.
- source_word: וְלִבְכֹּתָהּ
  choice: und um sie zu weinen
  rationale: בכה bedeutet „weinen“. Die Formulierung bewahrt den pronominalen Bezug auf Sara und unterscheidet das Weinen von der zuvor genannten Totenklage.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die beiden Ausdrücke für die Trauerhandlung werden unterschieden: zunächst die Totenklage, dann das Weinen. Die Satzfolge bleibt nah am hebräischen Erzählstil, wird aber durch einen Punkt für heutige Leser gegliedert.'
