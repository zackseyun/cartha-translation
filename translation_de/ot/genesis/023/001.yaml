- source_word: שְׁנֵי חַיֵּי שָׂרָה
  choice: das waren die Lebensjahre Saras
  rationale: Die abschließende hebräische Wiederholung bleibt erhalten, statt als vermeintlich überflüssig ausgelassen zu werden.
