  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: de
  text: »Höre uns an, mein Herr! Du bist ein Fürst Gottes[a] in unserer Mitte. Bestatte deine Tote in einem unserer besten Gräber. Keiner von uns wird dir sein Grab vorenthalten, sodass du deine Tote nicht bestatten könntest.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein mächtiger Fürst«. Die hebräische Wendung »Fürst Gottes« kann auch verstärkend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Höre uns an
  rationale: Der Imperativ mit Suffix der 1. Person Plural ist als unmittelbare, respektvolle Aufforderung wiedergegeben; „anhören“ ist im Deutschen hier natürlicher als das isolierte „hören“.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Bewahrt die ehrerbietige Anrede und das soziale Gefälle, ohne ein modernes Amtsprädikat einzuführen.
- source_word: נְשִׂיא אֱלֹהִים
  choice: ein Fürst Gottes
  rationale: Gibt die hebräische Genitivverbindung zunächst formal wieder und bewahrt ihre Mehrdeutigkeit zwischen Gottesbezug und verstärkender Bedeutung.
- source_word: בְּתוֹכֵנוּ
  choice: in unserer Mitte
  rationale: Natürliche, würdige Wiedergabe der räumlich-sozialen Zugehörigkeit.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: im besten unserer Gräber
  rationale: מִבְחָר bezeichnet das Ausgewählte beziehungsweise Beste; der Singular im Deutschen entspricht der konkreten Wahl aus den verfügbaren Gräbern.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Bestatte deine Tote
  rationale: Im Kontext ist Sarah gemeint; das deutsche feminine Substantiv macht den Bezug natürlich deutlich, während das Hebräische allgemein „deine Tote/deinen Toten“ sagt.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Keiner von uns
  rationale: Die negierte distributive Wendung bedeutet idiomatisch „nicht einer von uns“.
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: wird dir sein Grab vorenthalten
  rationale: Gibt sowohl den individuellen Besitzbezug als auch den Sinn des Zurückhaltens oder Verweigerns prägnant wieder.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: sodass du deine Tote nicht bestatten könntest
  rationale: Die Präposition מִן mit Infinitiv bezeichnet hier die verhinderte Handlung; die deutsche Konstruktion macht diesen Präventivsinn verständlich.
theological_decisions:
- issue: Bedeutung von נְשִׂיא אֱלֹהִים
  choice: ein Fürst Gottes
  alternative: ein mächtiger Fürst
  rationale: Die Hauptfassung bewahrt den ausdrücklichen Gottesbezug und lässt offen, ob die Wendung eine Beziehung zu Gott bezeichnet oder idiomatisch verstärkend gebraucht ist; die alternative Deutung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit höflich-feierlichem Ton. Die direkte Rede bleibt knapp und der förmlichen Grundstücks- und Bestattungsverhandlung angemessen.
