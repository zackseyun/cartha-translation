  to: »Höre uns an, mein Herr! Du bist ein Fürst Gottes[a] in unserer Mitte. Bestatte deine Tote in einem unserer besten Gräber. Keiner von uns wird dir sein Grab vorenthalten, sodass du deine Tote nicht bestatten könntest.«
  rationale: Die Revision korrigiert die Wiedergabe der Wendung »in der Auswahl unserer Gräber« zu einer im Deutschen natürlichen Form, die die angebotene Auswahl mehrerer hervorragender Grabstätten bewahrt. Die übrige Formulierung kann bleiben; insbesondere ist »deine Tote« angesichts des unmittelbaren Kontextes mit Sarah eine natürliche kontextuelle Konkretisierung.
  reviewer_model: gpt-5.6-terra
