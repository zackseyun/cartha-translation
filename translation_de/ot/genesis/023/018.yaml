  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: de
  text: für Abraham als Eigentum, vor den Augen der Hetiter[a], vor allen, die durch das Tor seiner Stadt kamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: den Söhnen Hets.'
