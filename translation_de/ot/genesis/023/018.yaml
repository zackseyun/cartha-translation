lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: für Abraham
  rationale: Das Präfix ל bezeichnet hier im Zusammenhang der rechtsgültigen Übertragung den Empfänger; im Deutschen ist „für Abraham“ natürlich und sachgerecht.
- source_word: לְמִקְנָה
  choice: als Eigentum
  rationale: מִקְנָה bezeichnet erworbenen Besitz. „Als Eigentum“ gibt hier das Ergebnis des Kaufs und den rechtlichen Charakter der Übertragung wieder.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die hebräische Wendung bezeichnet öffentliche Sichtbarkeit und Zeugenschaft; „vor den Augen“ bewahrt zugleich das Bild des Ausgangstextes.
- source_word: בְנֵי חֵת
  choice: die Hetiter
  rationale: Wörtlich steht „Söhne Hets“. Im heutigen Deutsch ist „Hetiter“ die verständliche ethnische Bezeichnung; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: בְּכֹל בָּאֵי
  choice: vor allen, die … kamen
  rationale: Die Formulierung bezeichnet die Gesamtheit der öffentlich anwesenden Zeugen. Das Partizip בָּאֵי wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: שַׁעַר עִירוֹ
  choice: das Tor seiner Stadt
  rationale: Die Wiedergabe folgt der hebräischen Genitivverbindung und erhält den städtischen sowie rechtlichen Schauplatz am Tor.
