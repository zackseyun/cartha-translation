  yaml_path: translation/ot/genesis/011/016.yaml
  text: Eber lived thirty-four years and fathered Peleg.
translation:
  language: de
  text: Eber war 34 Jahre alt, als er Peleg zeugte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In dieser genealogischen Formel bezeichnet חיה die bis zur Zeugung erreichten Lebensjahre. Die deutsche Altersangabe gibt den Sinn natürlich wieder und vermeidet den falschen Eindruck, Eber habe insgesamt nur 34 Jahre gelebt.
- source_word: עֵבֶר
  choice: Eber
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: 34 Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich „vier und dreißig Jahre“; die Ziffernschreibung ist im modernen Deutsch klar und bewahrt die genaue Zahl.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד bezeichnet bei einem männlichen Subjekt in einem Geschlechtsregister das Zeugen eines Kindes. „Zeugte“ ist präzise, geläufig und dem würdigen Register angemessen.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch die deutsche Satzstruktur ausgedrückt.
- source_word: פָּלֶג
  choice: Peleg
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
