  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: de
  text: Nachdem Arpachschad Schelach gezeugt hatte, lebte er noch 403 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: In der genealogischen Formel bezeichnet חיה die weitere Lebenszeit nach der Geburt des genannten Sohnes. „lebte er noch“ ist im Deutschen natürlich und gibt diesen zeitlichen Fortgang klar wieder.
- source_word: אַרְפַּכְשַׁד
  choice: Arpachschad
  rationale: Die Namensform folgt dem Hebräischen möglichst direkt und entspricht einer geläufigen deutschen Umschrift.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Nachdem … gezeugt hatte
  rationale: Die Konstruktion bezeichnet die Zeit nach der Zeugung des genannten Sohnes. „zeugen“ bewahrt den männlich-kausativen Sinn der Hifil-Form von ילד und passt zum genealogischen Zusammenhang.
- source_word: שֶׁלַח
  choice: Schelach
  rationale: Der Personenname wird unmittelbar aus der hebräischen Form ins Deutsche übertragen; der Akkusativmarker אֶת bleibt unübersetzt.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 Jahre
  rationale: Die im Hebräischen als drei und vierhundert angegebene Zahl wird in natürlicher deutscher Reihenfolge wiedergegeben; Ziffern sorgen für gute Lesbarkeit.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד mit dem männlichen Subjekt das Hervorbringen von Nachkommen. „zeugte“ ist präzise und stilistisch würdig.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die Übersetzung bewahrt die ausdrückliche Nennung männlicher und weiblicher Nachkommen, statt sie zum allgemeineren „Kinder“ zusammenzufassen.
