source:
  edition: WLC
  text: וַֽ/יְחִי תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֨וֹלֶד֙ אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: de
  text: Terach war siebzig Jahre alt, als er Abram, Nahor und Haran zeugte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit „wurde der Vater von“ wiedergegeben werden. Die Aufzählung besagt nicht zwingend, dass die Söhne in genau dieser Reihenfolge oder gleichzeitig geboren wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In dieser genealogischen Altersangabe bezeichnet חיה mit der folgenden Jahreszahl das erreichte Lebensalter. Die deutsche Wendung „war siebzig Jahre alt“ gibt den Sinn natürlicher und eindeutiger wieder als das wörtlichere „lebte siebzig Jahre“.
- source_word: שִׁבְעִים שָׁנָה
  choice: siebzig Jahre alt
  rationale: Die Altersangabe lautet wörtlich „siebzig Jahre“; im modernen Deutschen wird zur Bezeichnung des Lebensalters idiomatisch „siebzig Jahre alt“ gesagt.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet hier im genealogischen Zusammenhang das Vaterwerden beziehungsweise Zeugen. „Zeugte“ ist präzise, knapp und im biblisch-genealogischen Stil weiterhin verständlich.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Abram, Nahor und Haran
  rationale: Die wiederholten Akkusativmarker heben die einzelnen Namen hervor; eine gewöhnliche deutsche Aufzählung bewahrt den Inhalt natürlich.
- source_word: תֶּרַח
  choice: Terach
  rationale: Der Personenname wird nach etablierter deutscher Bibeltradition und in Nähe zur hebräischen Lautgestalt wiedergegeben.
- source_word: אַבְרָם
  choice: Abram
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הָרָן
  choice: Haran
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben; das anlautende ה gehört hier zum Namen und ist kein zu übersetzender Artikel.
theological_decisions:
- issue: Genealogische Reihenfolge und Altersangabe
  choice: 'Der Vers wird als genealogische Notiz wiedergegeben: Mit siebzig Jahren zeugte Terach die genannten Söhne; ihre Aufzählung wird nicht als ausdrückliche Festlegung der Geburtsreihenfolge verstanden.'
  alternative: Die Namen geben zwingend die genaue Geburtsreihenfolge an, oder alle drei Söhne wurden zugleich geboren.
  rationale: Der hebräische Wortlaut nennt Terachs Alter und die drei Söhne, klärt aber weder ausdrücklich ihre Geburtsreihenfolge noch, ob sie gleichzeitig geboren wurden. Die Übersetzung lässt diese chronologischen Fragen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zeugte“ ist in genealogischem Zusammenhang präzise und verständlich; die idiomatische Altersformulierung vermeidet das im Deutschen missverständliche „lebte siebzig Jahre“.
