  text: וַֽ/יְחִי עֵ֗בֶר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת פֶּ֔לֶג שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: de
  text: Nachdem Eber Peleg gezeugt hatte, lebte er noch 430 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: In der genealogischen Formel bezeichnet חיה die weitere Lebenszeit nach der Geburt des genannten Sohnes. „Lebte … noch“ gibt diesen zeitlichen Zusammenhang im Deutschen natürlich und präzise wieder.
- source_word: עֵבֶר
  choice: Eber
  rationale: „Eber“ ist die im Deutschen herkömmliche Wiedergabe dieses Personennamens in den Genesis-Genealogien.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: Nachdem Eber Peleg gezeugt hatte
  rationale: Die Konstruktion bezeichnet die Zeit nach der Zeugung Pelegs. Ein vorangestellter Nachdem-Satz entspricht natürlichem modernem Deutsch und bewahrt den genealogischen Sinn von הוליד.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 430 Jahre
  rationale: Die hebräische Zahlenfolge lautet wörtlich „dreißig Jahre und vierhundert Jahre“. Die Ziffernschreibweise gibt die Gesamtdauer im Deutschen klar und ohne Bedeutungsverlust wieder.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Verb ילד in der kausativen Form bezeichnet in diesem väterlichen Stammbaumkontext das Zeugen von Nachkommen. „Zeugte“ ist präzise und nicht altertümlich.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Das Hebräische nennt männliche und weibliche Nachkommen ausdrücklich; die konkrete Wiedergabe ist genauer als das allgemeinere „Kinder“.
