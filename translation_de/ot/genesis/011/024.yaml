  yaml_path: translation/ot/genesis/011/024.yaml
  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: de
  text: Nahor war 29 Jahre alt, als er Terach zeugte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In der genealogischen Altersformel gibt die Verbindung mit der Jahreszahl das Alter Nahors beim folgenden Ereignis an; die idiomatische deutsche Wiedergabe vermeidet das missverständliche „lebte 29 Jahre“.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: 29 Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich „neun und zwanzig“; modernes Deutsch verwendet „neunundzwanzig“. Die Ziffernschreibung ist klar und natürlich.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד bezeichnet in dieser Genealogie die männliche Elternschaft. „Zeugte“ ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine eigenständige Entsprechung.
- source_word: תָּרַח
  choice: Terach
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
