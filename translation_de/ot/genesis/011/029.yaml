  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: de
  text: Abram und Nahor nahmen sich Frauen.[a] Abrams Frau hieß Sarai, und Nahors Frau hieß Milka. Sie war die Tochter Harans, des Vaters von Milka und Jiska.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nahmen sich Frauen“; gemeint ist: Sie heirateten.'
    reason: Die Fußnote erläutert die hebräische Heiratswendung, deren wörtliche Wiedergabe im Deutschen missverstanden werden könnte.
lexical_decisions:
- source_word: וַיִּקַּח ... לָהֶם נָשִׁים
  choice: nahmen sich Frauen
  rationale: Die Wendung bewahrt das hebräische Bild von לקח mit dem reflexiven לָהֶם, klingt im Deutschen aber verständlich. נָשִׁים bezeichnet im Heiratskontext Frauen beziehungsweise Ehefrauen.
- source_word: שֵׁם אֵשֶׁת ...
  choice: Abrams Frau hieß … / Nahors Frau hieß …
  rationale: Das idiomatische deutsche „hieß“ gibt die hebräische Namensformel natürlich wieder, ohne ihren Inhalt zu verändern.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Gebräuchliche deutsche Transliteration des hebräischen Personennamens.
- source_word: בַּת הָרָן
  choice: die Tochter Harans
  rationale: בַּת ist der gewöhnliche Ausdruck für eine Tochter; der Genitiv gibt die genealogische Beziehung knapp und klar wieder.
- source_word: אֲבִי מִלְכָּה וַאֲבִי יִסְכָּה
  choice: des Vaters von Milka und Jiska
  rationale: Die Apposition wird auf Haran bezogen; die im Hebräischen wiederholte Bezeichnung „Vater“ kann im Deutschen ohne Bedeutungsverlust zusammengezogen werden.
- source_word: יִסְכָּה
  choice: Jiska
  rationale: Direkte, im Deutschen passende Transliteration des hebräischen Namens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die erste Satzhälfte bleibt nahe an der hebräischen Ausdrucksweise; die Namensformeln werden idiomatisch mit „hieß“ wiedergegeben. Das Pronomen „Sie“ verdeutlicht natürlich, dass Milka die Tochter Harans war.
