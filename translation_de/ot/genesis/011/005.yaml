base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: de
  text: Da kam Jahwe herab, um die Stadt und den Turm zu sehen, die die Menschen[a] gebaut hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Menschen“; die hebräische Wendung bezeichnet hier Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Da kam … herab
  rationale: Das Verb ירד bezeichnet ein Hinabgehen. „Da kam … herab“ gibt die fortlaufende Erzählung natürlich wieder und bewahrt die konkrete, anthropomorphe Bewegung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִרְאֹת
  choice: um … zu sehen
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck. „Sehen“ wahrt den schlichten Wortlaut und die erzählerische Ironie, ohne vorschnell „prüfen“ oder „besichtigen“ einzutragen.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Direkte und geläufige Wiedergabe von עִיר.
- source_word: הַמִּגְדָּל
  choice: den Turm
  rationale: Direkte und kontextgerechte Wiedergabe von מִגְדָּל.
- source_word: בָּנוּ
  choice: gebaut hatten
  rationale: Das deutsche Plusquamperfekt macht natürlich deutlich, dass der Bau dem beschriebenen Herabkommen vorausliegt.
- source_word: בְּנֵי הָאָדָם
  choice: die Menschen
  rationale: Die wörtliche Form „Söhne des Menschen/Adams“ ist im Hebräischen eine Sammelbezeichnung für Menschen. Im modernen Deutschen gibt „die Menschen“ den gemeinten Umfang klar und natürlich wieder; die formnähere Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Anthropomorphe Beschreibung des Herabkommens Jahwes
  choice: Die konkrete Aussage „kam Jahwe herab“ bleibt erhalten.
  alternative: „Jahwe blickte hinab“ oder „Jahwe wandte seine Aufmerksamkeit darauf“
  rationale: Der hebräische Text beschreibt Jahwes Handeln in räumlich-menschlicher Redeweise. Eine Abstraktion würde die literarische und theologische Spannung abschwächen.
- issue: Wiedergabe von בְּנֵי הָאָדָם
  choice: „die Menschen“ im Haupttext
  alternative: „die Söhne des Menschen“ oder „die Söhne Adams“
  rationale: Die Wendung ist maskulin formuliert, bezeichnet hier aber die am Bau beteiligten Menschen kollektiv. Die idiomatische Haupttextfassung vermeidet im Deutschen die mögliche Fehlvorstellung, nur männliche Nachkommen seien gemeint; die hebräische Bildform wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt das konkrete „Herabkommen“ und die schlichte Zweckangabe „um … zu sehen“. „Die Menschen“ ist idiomatischer als eine im Deutschen missverständliche wörtliche Nachbildung; die Ausgangsform wird durch die Fußnote sichtbar gehalten.
