source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: de
  text: 'Da sagte einer zum anderen: »Kommt, lasst uns Ziegel herstellen und sie gründlich brennen!« So dienten ihnen Ziegel als Steine und Bitumen[a] als Mörtel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bitumen ist natürliches Erdpech, ein asphaltartiger Stoff, der beim Bauen als Bindemittel verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: einer zum anderen
  rationale: Die hebräische distributive Wendung bezeichnet wechselseitiges Reden innerhalb der Gruppe. »Einer zum anderen« gibt sie im modernen Deutschen natürlich und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: הָבָה
  choice: Kommt
  rationale: Die Partikel leitet eine gemeinsame Aufforderung ein. »Kommt« ist gegenwärtig, verständlich und weniger altertümlich als »Wohlan«.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: lasst uns Ziegel herstellen
  rationale: Das denominative Verb bedeutet, Ziegel zu machen. »Herstellen« ist natürlich und lässt offen, welche einzelnen Arbeitsschritte gemeint sind.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: und sie gründlich brennen
  rationale: Die Verbindung mit dem stammverwandten Infinitiv verstärkt den Vorgang. Im Zusammenhang der Ziegelherstellung ist »brennen« der passende Fachausdruck; »gründlich« bildet die Intensivierung ab.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: So dienten ihnen Ziegel als Steine
  rationale: היה mit ל drückt hier funktionalen Ersatz aus. Die deutsche Formulierung bewahrt den Gegensatz zwischen künstlich hergestellten Ziegeln und Natursteinen, ohne eine stoffliche Verwandlung anzudeuten.
- source_word: הַחֵמָר
  choice: Bitumen
  rationale: חֵמָר bezeichnet hier natürliches Erdpech beziehungsweise asphaltartigen Teer, der als Bindemittel beim Bauen verwendet wurde. »Bitumen« ist präzise und im modernen Deutschen gebräuchlich.
- source_word: לַחֹמֶר
  choice: als Mörtel
  rationale: חֹמֶר kann Lehm oder eine mörtelartige Masse bezeichnen. Hier steht die Funktion als Bindemittel im Vordergrund, daher ist »Mörtel« kontextgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt lebendig, während »dienten … als« die funktionale Materialersetzung des Hebräischen klar und ohne missverständliche Verwandlungssprache wiedergibt.
