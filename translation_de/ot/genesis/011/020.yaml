lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Die Wayyiqtol-Form von חיה wird in der genealogischen Formel natürlich mit „lebte“ wiedergegeben und bezeichnet hier das Alter bis zur Zeugung des genannten Sohnes.
- source_word: רְעוּ
  choice: Reu
  rationale: Der Personenname wird gemäß der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: zweiunddreißig Jahre
  rationale: Die genaue Altersangabe wird in der natürlichen deutschen Zahlenfolge wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem genealogischen Zusammenhang das männliche Zeugen; „zeugte“ ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigene lexikalische Entsprechung und wird durch die Satzsyntax ausgedrückt.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
