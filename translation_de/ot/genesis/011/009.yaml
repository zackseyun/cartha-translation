  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: de
  text: Darum nannte man sie Babel[a], denn dort verwirrte Jahwe die Sprache der ganzen Erde, und von dort zerstreute Jahwe sie über die ganze Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Babel“ wird im Hebräischen mit dem Verb balal („verwirren“ oder „vermischen“) durch ein Wortspiel in Verbindung gebracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die natürliche deutsche Folgerungsformel bewahrt den kausalen Zusammenhang zwischen dem Geschehen und der Namensgebung.
- source_word: קָרָא שְׁמָהּ
  choice: nannte man die Stadt
  rationale: Die unbestimmte Verbform des Hebräischen wird im Deutschen idiomatisch mit „man“ wiedergegeben. Das Bezugswort „Stadt“ wird zur Klarheit aus dem unmittelbaren Kontext aufgenommen.
- source_word: בָּבֶל
  choice: Babel
  rationale: Der überlieferte deutsche Eigenname bleibt erhalten; das hebräische Wortspiel mit בָּלַל wird in einer Fußnote erläutert.
- source_word: כִּי שָׁם
  choice: denn dort
  rationale: „Denn“ führt die Namenserklärung würdig und natürlich ein; „dort“ hält den Ortsbezug fest.
- source_word: בָּלַל
  choice: verwirrte
  rationale: Das Verb bezeichnet hier das Durcheinanderbringen der gemeinsamen Sprache und lässt zugleich den Bezug zum Namen Babel erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: die Sprache der ganzen Erde
  rationale: שָׂפָה bedeutet wörtlich „Lippe“, bezeichnet hier aber idiomatisch die Sprache. Die kollektive Formulierung des Hebräischen bleibt erhalten.
- source_word: הֱפִיצָם
  choice: zerstreute ... die Menschen
  rationale: Der Hifil bezeichnet das Verstreuen über ein geografisches Gebiet. Das Pronomen wird zur eindeutigen und natürlichen deutschen Bezugnahme als „die Menschen“ ausgedrückt.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: über die ganze Erde
  rationale: Die Bedeutung der hebräischen Wendung wird in natürlichem Deutsch wiedergegeben; die Wiederholung von „ganze Erde“ bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname wahrt diese Unterscheidung, ohne einen bloßen Titel einzusetzen.
- issue: Bezugsweite von שְׂפַת כָּל הָאָרֶץ
  choice: die Sprache der ganzen Erde
  alternative: die Sprache aller Menschen auf der Erde
  rationale: Die gewählte Fassung erhält die knappe kollektive Ausdrucksweise und die Spannung der umfassenden Aussage, statt sie interpretierend auf einzelne Sprecher aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Namensformel wird idiomatisch wiedergegeben, das Wortspiel jedoch durch eine Fußnote bewahrt. Die Wiederholung von „ganze Erde“ und des Gottesnamens bleibt entsprechend der rhetorischen Struktur des Ausgangstextes erhalten.
