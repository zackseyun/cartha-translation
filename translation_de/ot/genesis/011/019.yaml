  text: וַֽ/יְחִי פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: de
  text: Und Peleg lebte, nachdem er Reu gezeugt hatte, noch 209 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: In der genealogischen Formel bezeichnet חיה die nach der genannten Geburt verbleibende Lebenszeit. Das deutsche „noch“ macht diesen zeitlichen Fortbestand natürlich deutlich.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־רְעוּ
  choice: nachdem er Reu gezeugt hatte
  rationale: Die temporale Präposition אַחֲרֵי mit dem Infinitiv von ילד wird im Deutschen idiomatisch als temporaler Nebensatz wiedergegeben; „zeugen“ bewahrt den ausdrücklich väterlichen Sinn.
- source_word: רְעוּ
  choice: Reu
  rationale: Der Personenname wird in der üblichen deutschen Transliteration wiedergegeben.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 209 Jahre
  rationale: Die hebräische Zahlenfolge lautet wörtlich „neun Jahre und zweihundert Jahre“; im modernen Deutschen wird die Zahl idiomatisch als 209 wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד bezeichnet in dieser Genealogie das Zeugen von Nachkommen. Die Wiederholung von „zeugte“ erhält die lexikalische Verbindung zum ersten Vorkommen.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Der hebräische Text nennt männliche und weibliche Nachkommen ausdrücklich; die konkrete Formulierung wird statt des allgemeineren „Kinder“ bewahrt.
