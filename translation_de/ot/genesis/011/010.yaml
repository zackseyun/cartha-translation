base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: de
  text: 'Dies ist die Geschlechterfolge Sems: Sem war hundert Jahre alt, als er Arpachschad[a] zeugte, zwei Jahre nach der Flut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In manchen Übersetzungen lautet der Name nach der griechischen Namensform „Arphaxad“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: Dies ist die Geschlechterfolge Sems
  rationale: Die feste Toledot-Formel gliedert das Buch Genesis und leitet hier die von Sem ausgehende genealogische Linie ein. Der deutsche Singular „Dies ist“ stimmt idiomatisch mit „Geschlechterfolge“ überein, während „Geschlechterfolge“ den genealogischen Sinn wahrt.
- source_word: בֶּן מְאַת שָׁנָה
  choice: war hundert Jahre alt
  rationale: Das hebräische Altersidiom, wörtlich „ein Sohn von hundert Jahren“, wird in natürlichem Deutsch als Altersangabe wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das männliche Zeugen. „Zeugte“ ist präzise, knapp und im heutigen gehobenen Bibeldeutsch verständlich.
- source_word: אַרְפַּכְשָׁד
  choice: Arpachschad
  rationale: Die Namensform wird unmittelbar aus dem Hebräischen transliteriert; die traditionelle deutsche Form „Arpachschad“ bildet die Konsonantenfolge angemessen ab.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: zwei Jahre nach der Flut
  rationale: Der Dual bezeichnet genau zwei Jahre; „die Flut“ ist im Kontext die natürliche Bezeichnung für die zuvor erzählte Flut.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle genealogische Wendung „Geschlechterfolge“ bewahrt die Funktion der Toledot-Formel; der Satzbau macht idiomatisch deutlich, dass Sem bei der Zeugung hundert Jahre alt war.
