base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: de
  text: 'Und sie sagten: „Auf, lasst uns eine Stadt und einen Turm für uns bauen, dessen Spitze im Himmel ist[a], und lasst uns uns einen Namen machen, damit wir nicht über die ganze Erde zerstreut werden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Spitze bis an den Himmel reicht“. Wörtlich: „und seine Spitze im Himmel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sonst werden wir über die ganze Erde zerstreut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Auf
  rationale: Die Aufforderung leitet ein gemeinsames Vorhaben ein. „Auf“ gibt den hortativen Ton knapp, natürlich und ohne zusätzliche Betonung wieder.
- source_word: נִבְנֶה לָּנוּ
  choice: lasst uns … bauen
  rationale: Die Kohortativform drückt eine gemeinsame Aufforderung beziehungsweise Entschlossenheit aus. Das Deutsche benötigt das dativische לָּנוּ hier nicht ausdrücklich, da der Eigenbezug aus dem Zusammenhang und dem folgenden „uns einen Namen machen“ klar hervorgeht.
- source_word: עִיר וּמִגְדָּל
  choice: eine Stadt und einen Turm
  rationale: Dies sind die gewöhnlichen und kontextgemäßen deutschen Entsprechungen; eine militärische Funktion des Turms wird im Text nicht ausdrücklich bezeichnet.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: dessen Spitze im Himmel ist
  rationale: Die Formulierung bewahrt das anschauliche hebräische Ortsbild möglichst direkt. „Spitze“ ist bei einem Turm natürlicher als das wörtliche „Kopf“; „Himmel“ ist im Deutschen trotz der formalen Pluralgestalt des hebräischen Wortes die übliche idiomatische Wiedergabe.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: lasst uns einen Namen machen
  rationale: Die Wendung hält das Bild des hebräischen Ausdrucks fest und vermeidet die erklärende Verengung auf „Ruhm“ oder „Ansehen“.
- source_word: פֶּן נָפוּץ
  choice: damit wir nicht … zerstreut werden
  rationale: פֶּן bezeichnet hier einen abzuwehrenden Ausgang oder eine negative Absicht. Die passive Form „zerstreut werden“ entspricht dem Nifal und wahrt, dass der Verursacher nicht genannt wird.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: über die ganze Erde
  rationale: Die natürliche deutsche Wendung gibt die weltweite Ausbreitung im urgeschichtlichen Zusammenhang wieder, ohne das hebräische Bild unnötig mit „über das Angesicht“ nachzubilden.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ in der Babelerzählung
  choice: Erde
  alternative: Land
  rationale: Im urgeschichtlichen Rahmen geht es um die Verteilung der Menschheit über die bewohnte Welt; „Erde“ passt daher besser als das örtlich begrenztere „Land“.
- issue: Nicht genannter Urheber des Zerstreuens
  choice: 'Passiv: „zerstreut werden“'
  alternative: 'Reflexiv: „uns zerstreuen“'
  rationale: Das hebräische Nifal lässt den Urheber offen. Die passive Wiedergabe bewahrt diese Offenheit und nimmt Gottes späteres Handeln nicht vorweg.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufforderung „Auf“ und die parallelen Formen „lasst uns“ erhalten den rhetorischen Schwung. Die ungewöhnliche Wendung „dessen Spitze im Himmel ist“ bleibt bewusst nahe am hebräischen Bild und wird durch eine Fußnote erläutert.
