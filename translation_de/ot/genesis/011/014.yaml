  text: וְ/שֶׁ֥לַח חַ֖י שְׁלֹשִׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת עֵֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/014.yaml
  text: Shelah lived thirty years and fathered Eber[a][b].
translation:
  language: de
  text: Als Schelach dreißig Jahre alt war, zeugte er Eber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Schelach
  rationale: Der Eigenname שֶׁלַח wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: חַי שְׁלֹשִׁים שָׁנָה
  choice: Als Schelach dreißig Jahre alt war
  rationale: Die hebräische genealogische Altersformel lautet wörtlich etwa »Schelach lebte dreißig Jahre«; die temporale deutsche Formulierung gibt natürlich und eindeutig das Alter beim folgenden Ereignis an.
- source_word: וַ/יּוֹלֶד
  choice: zeugte er
  rationale: Der Hifil von ילד bezeichnet in dieser genealogischen Formel die männliche Zeugung beziehungsweise Vaterschaft. »Zeugte« ist präzise und im biblisch-genealogischen Register verständlich.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen kein selbstständiges Äquivalent; seine Funktion wird durch den Satzbau ausgedrückt.
- source_word: עֵבֶר
  choice: Eber
  rationale: »Eber« gibt den hebräischen Eigennamen עֵבֶר unmittelbar wieder und ist zugleich die etablierte deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die temporale Altersformel klingt natürlicher als eine wörtliche Nachbildung; »zeugte« bewahrt die knappe genealogische Ausdrucksweise.
