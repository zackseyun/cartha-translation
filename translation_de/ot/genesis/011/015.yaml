base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: de
  text: Und Schelach lebte, nachdem er Eber gezeugt hatte, noch 403 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: In der genealogischen Formel bezeichnet חיה hier die weitere Lebenszeit nach der Zeugung Ebers. „lebte … noch“ gibt diesen zeitlichen Bezug im Deutschen natürlich wieder.
- source_word: שֶׁלַח
  choice: Schelach
  rationale: Die Namensform folgt dem Hebräischen und der im Deutschen üblichen lautnahen Umschrift.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: nachdem er Eber gezeugt hatte
  rationale: Die Kausativform von ילד bezeichnet im genealogischen Zusammenhang das Zeugen eines Nachkommen. Der Temporalsatz bildet die Vorzeitigkeit eindeutig und idiomatisch ab.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 Jahre
  rationale: Die hebräische Zahlenfolge bedeutet idiomatisch 403 Jahre; die moderne Ziffernschreibung ist klar und knapp.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet ילד in dieser genealogischen Zusammenfassung das Zeugen weiterer Nachkommen.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die Übersetzung bewahrt die ausdrückliche Nennung beider Gruppen und verallgemeinert sie nicht zu „Kinder“.
