  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: de
  text: Die ganze Erde hatte eine einzige Sprache und dieselben Worte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und einen gemeinsamen Wortschatz“ beziehungsweise „und dieselbe Rede“. Wörtlich steht im Hebräischen: „und Worte, gleiche/einheitliche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: hatte
  rationale: Die Erzählform von היה führt den bestehenden Zustand ein. Im modernen Deutschen wird dies natürlich durch das Präteritum „hatte“ ausgedrückt, ohne die altertümliche Formel „Und es geschah“.
- source_word: כָל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang der Erzählung ist die gesamte Menschheit im Blick; daher passt „die ganze Erde“ am besten.
- source_word: שָׂפָה אֶחָת
  choice: eine einzige Sprache
  rationale: שָׂפָה bedeutet wörtlich „Lippe“, bezeichnet hier aber idiomatisch die Sprache. „Eine einzige Sprache“ gibt sowohl den Sinn als auch die durch אֶחָת betonte Einheit klar wieder.
- source_word: וּדְבָרִים אֲחָדִים
  choice: und dieselben Worte
  rationale: דְּבָרִים bezeichnet gewöhnlich „Worte“ oder „Dinge/Angelegenheiten“. Zusammen mit „eine einzige Sprache“ hebt die Wendung wahrscheinlich den gemeinsamen Wortbestand oder eine einheitliche Ausdrucksweise hervor. „Dieselben Worte“ bewahrt die lexikalische Eigenständigkeit der Wendung.
theological_decisions: []
