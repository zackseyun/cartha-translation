  register: Modernes, würdiges Standarddeutsch. „Eine einzige Sprache“ klingt natürlich und macht die betonte Einheit sichtbar; „dieselben Worte“ bewahrt die mögliche Unterscheidung zwischen Sprache und gemeinsamem Wortbestand.
