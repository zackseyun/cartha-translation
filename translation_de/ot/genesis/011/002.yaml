source:
  edition: WLC
  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: de
  text: Als sie von Osten her weiterzogen[a], fanden sie eine Ebene im Land Schinar und ließen sich dort nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als sie ostwärts zogen“. Die hebräische Wendung מִקֶּדֶם kann entweder die Herkunft („von Osten her“) oder die Richtung („ostwärts“) bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Als sie … weiterzogen
  rationale: Die Einleitungsformel mit dem Infinitiv bezeichnet den zeitlichen Umstand der folgenden Handlung. „Weiterzogen“ gibt נסע im Zusammenhang einer Wanderbewegung natürlich wieder, ohne die im Deutschen schwerfällige Formel „Und es geschah“ beizubehalten.
- source_word: מִקֶּדֶם
  choice: von Osten her
  rationale: Die Präposition מִן legt zunächst eine Herkunftsangabe nahe. Da die Wendung auch als Richtungsangabe „ostwärts“ verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: וַיִּמְצְאוּ
  choice: fanden sie
  rationale: מצא bedeutet hier unmittelbar „finden“; die schlichte Wiedergabe passt zum erzählenden Kontext.
- source_word: בִקְעָה
  choice: eine Ebene
  rationale: בִקְעָה bezeichnet eine weite Ebene oder ein breites Tal. „Ebene“ ist für die Landschaft Schinars sachgemäß und im Deutschen idiomatisch.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: im Land Schinar
  rationale: אֶרֶץ wird als geografische Bezeichnung mit „Land“ wiedergegeben; der Ortsname שִׁנְעָר wird als „Schinar“ transliteriert.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: und ließen sich dort nieder
  rationale: ישב kann „wohnen“, „sitzen“ oder „sich niederlassen“ bedeuten. Im Kontext des Weiterziehens bringt „sich niederlassen“ das Ende der Wanderbewegung klar zum Ausdruck.
theological_decisions: []
