  text: וַֽ/יְחִי פֶ֖לֶג שְׁלֹשִׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת רְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/018.yaml
  text: Peleg lived thirty years and fathered Reu.
translation:
  language: de
  text: Peleg war 30 Jahre alt, da zeugte er Regu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: war … Jahre alt
  rationale: In der genealogischen Altersformel bezeichnet חיה zusammen mit der Jahresangabe das erreichte Lebensalter vor dem folgenden Ereignis. Die deutsche Wendung „war 30 Jahre alt“ gibt dies natürlich und präzise wieder.
- source_word: פֶלֶג
  choice: Peleg
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: 30 Jahre
  rationale: Die hebräische Altersangabe lautet wörtlich „dreißig Jahr“; im Deutschen wird sie idiomatisch als „30 Jahre alt“ formuliert.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in dieser männlichen Abstammungslinie das Zeugen eines Nachkommen. „Zeugte“ ist knapp, eindeutig und für einen würdevollen genealogischen Text weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: Die Partikel kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigene Entsprechung.
- source_word: רְעוּ
  choice: Regu
  rationale: „Regu“ ist die etablierte deutsche Namensform für רְעוּ und vermeidet eine unnötig englisch geprägte Transliteration.
theological_decisions: []
translation_notes:
  register: Knappes, modernes Standarddeutsch in der traditionellen Form einer Genealogie. Die Satzfügung „da zeugte er“ bewahrt die Abfolge der beiden hebräischen Wayyiqtol-Formen, ohne schwerfällig zu wirken.
