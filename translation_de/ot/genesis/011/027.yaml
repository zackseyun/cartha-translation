  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: de
  text: 'Und dies ist die Geschlechterfolge Terachs: Terach zeugte Abram, Nahor und Haran; und Haran zeugte Lot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies ist
  rationale: Das einleitende וְ wird als schlichte Verknüpfung mit „Und“ wiedergegeben; „dies ist“ bewahrt die demonstrative Formel ohne einen nicht ausdrücklich vorhandenen Zeitbezug.
- source_word: תּוֹלְדֹת
  choice: die Geschlechterfolge
  rationale: Der Ausdruck bezeichnet in Genesis eine wiederkehrende Gliederungsformel für die aus einer Person hervorgehende Linie beziehungsweise Geschichte. „Geschlechterfolge“ erhält den genealogischen Charakter und bleibt weiter als bloß „Nachkommen“.
- source_word: תֶּרַח
  choice: Terach
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention transliteriert.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet im genealogischen Zusammenhang das Zeugen beziehungsweise Hervorbringen eines Kindes. „Zeugte“ ist knapp, präzise und im Deutschen als genealogische Formulierung verständlich.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Abram, Nahor und Haran
  rationale: Die Akkusativmarker werden im Deutschen nicht eigens wiedergegeben; die Namen werden nach geläufiger deutscher Bibelkonvention transliteriert.
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: und Haran zeugte Lot
  rationale: Die Konjunktion wird unmittelbar als „und“ wiedergegeben, und das genealogische Verb wird konsistent mit „zeugte“ übersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst formelhafter genealogischer Sprache. Die Wiederholung von „Terach“ und „Haran“ bleibt entsprechend dem hebräischen Satzbau erhalten.
