  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: de
  text: Nachdem Sem Arpachschad gezeugt hatte, lebte er noch fünfhundert Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: חיה bezeichnet in der genealogischen Formel das weitere Leben während des genannten Zeitraums. „noch“ gibt im Deutschen den durch אַחֲרֵי markierten Fortbestand natürlich wieder.
- source_word: שֵׁם
  choice: Sem
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Nachdem … gezeugt hatte
  rationale: Die temporale Konstruktion bezeichnet die Zeit nach der Zeugung Arpachschads. Der deutsche Nebensatz bildet das Verhältnis klar und idiomatisch ab.
- source_word: אֶת אַרְפַּכְשָׁד
  choice: Arpachschad
  rationale: Der direkte Objektmarker bleibt unübersetzt; der Personenname folgt der etablierten deutschen biblischen Schreibweise.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: fünfhundert Jahre
  rationale: Direkte und natürliche Wiedergabe der Zeitdauer.
- source_word: וַיּוֹלֶד
  choice: und zeugte
  rationale: Der Hifil von ילד bezeichnet im genealogischen Zusammenhang die männliche Zeugung. „zeugte“ ist präziser als das allgemeinere „hatte“.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung männlicher und weiblicher Nachkommen bleibt erhalten.
