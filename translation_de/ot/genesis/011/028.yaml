base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: de
  text: Haran starb vor seinem Vater Terach[a] im Land seiner Geburt, in Ur der Chaldäer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Angesicht seines Vaters Terach“. Die hebräische Wendung kann „vor seinem Vater“, also noch zu dessen Lebzeiten, oder „in Gegenwart seines Vaters“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מות bezeichnet im Erzählzusammenhang schlicht ein vergangenes Ereignis; „starb“ ist die natürliche deutsche Wiedergabe.
- source_word: עַל־פְּנֵי
  choice: noch zu Lebzeiten
  rationale: Die Wendung bedeutet hier, dass Haran starb, während sein Vater noch lebte. Die Fußnote bewahrt die mögliche räumlich-konkrete Nuance „vor den Augen/in Gegenwart“.
- source_word: תֶּרַח אָבִיו
  choice: seines Vaters Terach
  rationale: Die Form mit Pronominalsuffix bezeichnet Terach eindeutig als Harans Vater; die deutsche Wortstellung ist natürlich und klar.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: in seinem Geburtsland
  rationale: מוֹלֶדֶת bezeichnet das Land der Geburt beziehungsweise Herkunft; „Geburtsland“ gibt dies knapp und verständlich wieder.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: in Ur in Chaldäa
  rationale: אוּר ist der Ortsname Ur; כַּשְׂדִּים kann in dieser Ortsangabe das Land beziehungsweise Gebiet der Chaldäer bezeichnen. „Ur in Chaldäa“ ist im modernen Deutschen natürlich, ohne die Identifizierung weiter auszulegen.
