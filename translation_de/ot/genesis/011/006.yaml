  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: de
  text: 'Und Jahwe sagte: »Sieh, sie sind ein Volk, und sie alle haben eine Sprache, und dies ist, was sie zu tun begonnen haben. Nun wird ihnen nichts von allem, was sie zu tun planen, unmöglich sein.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nun wird ihnen nichts von allem, was sie zu tun planen, vorenthalten werden.«'
    reason: Die Wendung לֹא יִבָּצֵר מֵהֶם kann sowohl im Sinn von »für sie nicht unmöglich bzw. unzugänglich sein« als auch von »ihnen nicht vorenthalten werden« verstanden werden.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֵן
  choice: Sieh doch
  rationale: Bewahrt den hinweisenden und aufmerksamkeitslenkenden Charakter in natürlichem, würdigem Deutsch.
- source_word: עַם אֶחָד
  choice: ein einziges Volk
  rationale: עַם bezeichnet hier eine zusammengehörige Menschengruppe; »Volk« ist genauer als das politischere »Nation«.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: sie alle haben eine einzige Sprache
  rationale: שָׂפָה bedeutet wörtlich »Lippe«, bezeichnet hier aber idiomatisch die gemeinsame Sprache; לְכֻלָּם wird durch »sie alle« bewahrt.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Das ist erst der Anfang ihres Tuns
  rationale: הַחִלָּם bezeichnet ihr Beginnen. Die Formulierung gibt den Zusammenhang wieder, in dem das gegenwärtige Unternehmen als Anfang weiterer Vorhaben erscheint, ohne den Satz unnötig auszubauen.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: wird ihnen nichts unerreichbar sein
  rationale: Die Niphal-Form von בצר kann »vorenthalten«, »unzugänglich« oder »unmöglich sein« ausdrücken. »Unerreichbar« hält die Bedeutungsbreite zwischen äußerem Vorenthalten und fehlender Fähigkeit eher offen.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: was sie zu tun planen
  rationale: יזם bezeichnet das Planen, Ersinnen oder Beabsichtigen; »planen« ist klar und gegenwärtig.
theological_decisions:
- issue: Reichweite der Aussage über menschliche Möglichkeiten
  choice: Die Aussage wird auf die geeinten und gemeinsam planenden Menschen in dieser Erzählung bezogen, ohne ihre Vorhaben gutzuheißen oder absolute menschliche Allmacht zu behaupten.
  alternative: Die Aussage als bloße Übertreibung wiedergeben oder ausdrücklich so verstehen, dass Gott ihnen nichts vorenthalten werde.
  rationale: Der hebräische Text formuliert eine starke Folge ihrer Einheit und gemeinsamen Sprache. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch zu erweitern oder abzuschwächen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. »Sieh doch« ist zugänglich, ohne altertümlich zu wirken; »ein einziges« hebt die im Hebräischen wiederholte Einheit hervor. Der Gottesname wird als »Jahwe« wiedergegeben.
