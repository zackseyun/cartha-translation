base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: de
  text: Nachdem Nahor Terach gezeugt hatte, lebte er noch hundertneunzehn Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: In der genealogischen Formel bezeichnet חיה die weitere Lebenszeit nach der Geburt des genannten Sohnes; „lebte … noch“ gibt diesen Fortgang im Deutschen natürlich wieder.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: Nachdem Nahor Terach gezeugt hatte
  rationale: Die Konstruktion bezeichnet den Zeitraum nach der Zeugung beziehungsweise Geburt Terachs. „zeugen“ bewahrt den aktiven, genealogischen Sinn von ילד und passt zum würdevollen Register.
- source_word: תֶּרַח
  choice: Terach
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als „Terach“ wiedergegeben.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: hundertneunzehn Jahre
  rationale: Das Hebräische nennt neunzehn plus hundert Jahre; die deutsche Wortstellung setzt die Hunderterzahl zuerst. Die ausgeschriebene Zahl entspricht dem biblischen Erzählstil.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Wiederholung von ילד wird lexikalisch konsistent wiedergegeben; „zeugte“ ist präziser als das allgemeinere „bekam“.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung beider Geschlechter bleibt erhalten und wird nicht zu „Kinder“ verallgemeinert.
