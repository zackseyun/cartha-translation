  text: וַ/יְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥/וֹ אֶת נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: de
  text: Und nachdem Serug Nahor gezeugt hatte, lebte er noch zweihundert Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: חיה bezeichnet in der genealogischen Formel die weitere Lebenszeit nach der Geburt des genannten Sohnes; „lebte … noch“ gibt diesen zeitlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: nachdem … gezeugt hatte
  rationale: Die Präposition אַחֲרֵי mit dem Hifil-Infinitiv von ילד bezeichnet die Zeit nach der Zeugung beziehungsweise Vaterschaft; die deutsche Nebensatzkonstruktion bildet das Verhältnis klar ab.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מָאתַיִם שָׁנָה
  choice: zweihundert Jahre
  rationale: Die hebräische Zahlenkonstruktion bezeichnet eine Zeitdauer; im Deutschen steht idiomatisch der Plural „Jahre“.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Das Hifil von ילד bezeichnet beim männlichen Subjekt in dieser Genealogie das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist präzise und bewahrt die Wiederholung des hebräischen Verbs.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung beider Geschlechter wird beibehalten und nicht zum allgemeineren „Kinder“ zusammengezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Formel bleibt knapp; „zeugte“ ist hier sachlich und genauer als das allgemeinere „hatte Kinder“.
