  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: de
  text: Da zerstreute Jahwe sie von dort über die ganze Erde[a], und sie hörten auf, die Stadt zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über das Angesicht der ganzen Erde“; auch: „über die ganze Erde hinweg“. Das hebräische אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: zerstreute
  rationale: Das Hifil von פוץ bezeichnet hier das Auseinandertreiben bzw. Zerstreuen von Menschen. „Zerstreute“ ist im Deutschen natürlich und bewahrt den Gerichtskontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die knappe Ortsangabe verweist auf den zuvor genannten Ort zurück und wird unmittelbar und idiomatisch wiedergegeben.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: über die ganze Erde
  rationale: Die Wendung bezeichnet hier die weiträumige Verteilung über die Erde. Die natürliche deutsche Formulierung gibt den Sinn wieder; das wörtliche Bild „über die Oberfläche“ wird in der Fußnote dokumentiert.
- source_word: וַיַּחְדְּלוּ
  choice: sie hörten auf
  rationale: חדל bedeutet „aufhören, ablassen“. Mit dem folgenden Infinitiv ist „sie hörten auf“ klares, modernes Deutsch.
- source_word: לִבְנֹת
  choice: zu bauen
  rationale: Der hebräische Infinitiv lässt sich nach „aufhören“ im Deutschen natürlich mit „zu bauen“ wiedergeben.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der bestimmte Ausdruck verweist auf die im unmittelbaren Zusammenhang im Bau befindliche Stadt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen und entspricht der heute üblichen wissenschaftlichen und allgemeinsprachlichen deutschen Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Erzählstil, während „über die ganze Erde“ und „hörten auf, … zu bauen“ idiomatisch formuliert sind.
