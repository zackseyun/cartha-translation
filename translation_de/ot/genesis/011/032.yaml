  yaml_path: translation/ot/genesis/011/032.yaml
  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: de
  text: Terachs Lebenszeit betrug 205 Jahre, und Terach starb in Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Terachs Lebenszeit betrug
  rationale: Die hebräische Wendung »die Tage Terachs waren« bezeichnet zusammenfassend seine gesamte Lebensdauer. Die gewählte Formulierung ist im modernen Deutsch natürlich und bewahrt den sachlichen Charakter der genealogischen Notiz.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 205 Jahre
  rationale: Die hebräische Zahlenfolge »fünf Jahre und zweihundert Jahre« wird nach üblicher deutscher Zahlenstellung wiedergegeben; die Ziffernschreibung ist klar und entspricht modernem Gebrauch.
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Verb מות bedeutet direkt »sterben« und wird ohne beschönigenden Ausdruck übersetzt. »Dann« gibt die fortführende Erzählungsform וַ wieder, ohne eine stärkere zeitliche Aussage einzutragen.
- source_word: תֶרַח
  choice: Terach
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בְּחָרָן
  choice: in Haran
  rationale: Die Präposition ב bezeichnet hier den Ort des Todes und wird natürlich mit »in« wiedergegeben; der Ortsname folgt der etablierten deutschen Form.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die idiomatische Wiedergabe »Lebenszeit« vermeidet die im Deutschen ungebräuchliche wörtliche Form »die Tage Terachs«, während die knappe genealogische Aussage erhalten bleibt.
