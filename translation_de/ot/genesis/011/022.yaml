lexical_decisions:
- source_word: וַיְחִי
  choice: lebte
  rationale: Das Verb חיה steht hier in der genealogischen Altersformel. „Lebte“ gibt die hebräische Erzählform knapp und natürlich wieder.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: dreißig Jahre
  rationale: Die hebräische Altersangabe lautet wörtlich „dreißig Jahr“; „dreißig Jahre“ ist die natürliche deutsche Entsprechung, wobei der Altersbezug aus der genealogischen Formel hervorgeht.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in dieser Genealogie die männliche Zeugung beziehungsweise Abstammung. „Zeugte“ ist präzise, knapp und im Deutschen für biblische Geschlechtsregister weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht eigens übersetzt]'
  rationale: Der direkte Objektmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion wird durch die Satzstellung ausgedrückt.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
