  text: וַ/יְחִ֣י רְע֗וּ אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שְׂר֔וּג שֶׁ֥בַע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: de
  text: Und nachdem Reu Serug gezeugt hatte, lebte er noch 207 Jahre und zeugte Söhne und Töchter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte er noch
  rationale: In der genealogischen Formel bezeichnet חיה die weitere Lebenszeit nach der zuvor genannten Geburt; »lebte … noch« gibt diesen zeitlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: רְעוּ
  choice: Reu
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird beibehalten.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: nachdem Reu Serug gezeugt hatte
  rationale: Die temporale Konstruktion wird durch einen deutschen Nebensatz wiedergegeben. »zeugen« bewahrt die männliche Perspektive des Hifil von ילד und passt zur genealogischen Formel.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 207 Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich »sieben Jahre und zweihundert Jahre«; die deutsche Zahlenfolge wird idiomatisch als 207 wiedergegeben.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet ילד im Hifil in dieser Genealogie das Zeugen von Nachkommen; »zeugte« ist präzise und knapp.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die Übersetzung erhält die ausdrückliche Nennung männlicher und weiblicher Nachkommen.
