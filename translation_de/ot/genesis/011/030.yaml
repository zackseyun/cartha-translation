lexical_decisions:
- source_word: וַתְּהִי
  choice: war
  rationale: Die Form führt die Erzählung weiter und bezeichnet hier einen Zustand. Im Deutschen ist „war“ ohne zusätzlichen, im Hebräischen nicht ausdrücklich vorhandenen Zeitmarker natürlich und genau.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: Das Adjektiv bezeichnet hier die Unfähigkeit, Kinder zu gebären. „Unfruchtbar“ ist präzise, knapp und vermeidet die Wiederholung von „kinderlos“ vor dem erklärenden zweiten Satzteil.
- source_word: אֵין לָהּ
  choice: sie hatte kein
  rationale: Die hebräische verneinte Existenzkonstruktion mit Präposition wird im Deutschen idiomatisch als verneinter Besitz ausgedrückt.
- source_word: וָלָד
  choice: Kind
  rationale: Das Substantiv bezeichnet das Geborene beziehungsweise einen Nachkommen; im unmittelbaren Zusammenhang ist „Kind“ die natürliche und konkrete Wiedergabe.
