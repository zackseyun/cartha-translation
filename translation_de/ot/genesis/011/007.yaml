source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: de
  text: Auf, lasst uns hinabsteigen und dort ihre Sprache verwirren, sodass keiner die Sprache seines Nächsten versteht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Auf
  rationale: Die Aufforderung leitet eine gemeinsame Handlung ein; „Auf“ ist im Deutschen natürlich und bewahrt den auffordernden Ton.
- source_word: נֵרְדָה
  choice: lasst uns hinabsteigen
  rationale: Der Kohortativ der 1. Person Plural wird direkt wiedergegeben; „hinabsteigen“ bewahrt die räumliche Bewegung.
- source_word: וְנָבְלָה
  choice: und … verwirren
  rationale: Auch hier liegt ein Kohortativ vor. „Verwirren“ gibt die beabsichtigte Störung der Verständigung klar wieder.
- source_word: שְׂפָתָם
  choice: ihre Sprache
  rationale: שָׂפָה bedeutet wörtlich „Lippe“, bezeichnet hier aber idiomatisch die Sprache.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: keiner mehr die Sprache des anderen
  rationale: Die distributive hebräische Wendung bedeutet sinngemäß, dass jeweils einer die Sprache seines Mitmenschen nicht versteht; die deutsche Formulierung ist natürlich und geschlechtsübergreifend.
theological_decisions:
- issue: Plural der göttlichen Selbstaufforderung
  choice: lasst uns
  alternative: ich will
  rationale: Der hebräische Plural wird bewahrt und nicht theologisch aufgelöst; seine genaue Deutung bleibt offen.
- issue: Ziel oder Folge der Sprachverwirrung
  choice: sodass
  alternative: damit
  rationale: אֲשֶׁר mit der Verneinung kann hier die beabsichtigte Folge ausdrücken. „Sodass“ lässt das Verhältnis von Ziel und Ergebnis etwas offener als „damit“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufforderungsstruktur und der göttliche Plural bleiben erhalten; unnötig männlich markierte Wiedergaben werden vermieden.
