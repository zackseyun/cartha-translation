lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Und Arpachschad
  rationale: Die Konjunktion וְ wird als „Und“ wiedergegeben, um die fortlaufende genealogische Reihe zu bewahren. Der Personenname wird in einer im Deutschen etablierten, hebräischen Transliteration wiedergegeben.
- source_word: חַי
  choice: lebte
  rationale: In der genealogischen Altersformel bezeichnet חיה das Erreichen beziehungsweise Durchleben eines bestimmten Alters; „lebte“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: fünfunddreißig Jahre
  rationale: Die hebräische Reihenfolge lautet wörtlich „fünf und dreißig Jahre“; die zusammengeschriebene deutsche Zahlform ist bedeutungsgleich und idiomatisch.
- source_word: וַ/יּוֹלֶד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in dieser väterlichen Geschlechtsfolge das Zeugen eines Nachkommen. „Zeugte“ ist im Deutschen präzise, würdig und verständlich.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und besitzt hier keine eigene deutsche Entsprechung; seine Funktion ergibt sich aus dem deutschen Satzbau.
- source_word: שָׁלַח
  choice: Schelach
  rationale: „Schelach“ gibt den masoretischen hebräischen Namen שָׁלַח in üblicher deutscher Transliteration wieder.
