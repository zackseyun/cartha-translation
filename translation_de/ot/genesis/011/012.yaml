  register: Moderne standarddeutsche, zugleich würdige genealogische Formulierung. „Zeugte“ bewahrt die biologische und genealogische Präzision des hebräischen Verbs. Eine Fußnote zur wörtlichen Zahlenreihenfolge ist im Deutschen unnötig, da „fünfunddreißig“ selbst der entsprechenden Bildungsweise folgt.
