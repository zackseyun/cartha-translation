source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: de
  text: Terach nahm seinen Sohn Abram mit, dazu Lot, den Sohn Harans, seinen Enkel[a], und seine Schwiegertochter Sarai, die Frau seines Sohnes Abram. Sie zogen gemeinsam[b] aus Ur in Chaldäa fort, um ins Land Kanaan zu ziehen. Sie kamen bis nach Haran und ließen sich dort nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Lot, den Sohn Harans, den Sohn seines Sohnes«; Lot war also Terachs Enkel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und sie zogen mit ihnen hinaus«. Die Bezüge von »sie« und »ihnen« sind im hebräischen Text nicht eindeutig voneinander abzugrenzen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: לקח bedeutet grundsätzlich »nehmen«. Bei Personen, die auf eine Reise geführt werden, ist »mitnehmen« im Deutschen die natürliche Entsprechung.
- source_word: לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ
  choice: Lot, den Sohn Harans, seinen Enkel
  rationale: Die Formulierung benennt zunächst Lots Vater und gibt dann idiomatisch sein Verhältnis zu Terach wieder. Die wörtlichere Struktur bleibt in Fußnote [a] sichtbar.
- source_word: כַּלָּתוֹ
  choice: seine Schwiegertochter
  rationale: כַּלָּה bezeichnet hier Terachs Schwiegertochter; die anschließende Apposition erklärt, dass Sarai Abrams Frau ist.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: Sie zogen gemeinsam … fort
  rationale: Der masoretische Text hat wörtlich »sie zogen mit ihnen hinaus«, obwohl sich die bezeichneten Gruppen offenbar überschneiden. Die Haupttextfassung gibt den naheliegenden Sinn verständlich wieder; Fußnote [b] bewahrt die auffällige Formulierung.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: aus Ur in Chaldäa
  rationale: כַּשְׂדִּים kann die Chaldäer beziehungsweise ihr Gebiet bezeichnen. »Ur in Chaldäa« ist eine klare, gegenwärtige deutsche Ortsangabe.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: um ins Land Kanaan zu ziehen
  rationale: Der Infinitiv bezeichnet das Reiseziel beziehungsweise die Absicht; die Richtungsendung an אֶרֶץ wird durch »ins Land« natürlich wiedergegeben.
- source_word: וַיָּבֹאוּ עַד־חָרָן
  choice: Sie kamen bis nach Haran
  rationale: עַד hebt hervor, dass die Reisenden bis Haran gelangten; die schlichte Satzfolge entspricht der hebräischen Erzählweise, ohne einen nicht ausdrücklich markierten Gegensatz einzuführen.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: und ließen sich dort nieder
  rationale: ישׁב kann »wohnen«, »bleiben« oder »sich niederlassen« bedeuten. Im Zusammenhang einer Wanderung trifft »sich niederlassen« den Sinn prägnant.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die familiären Beziehungen werden klar und ohne altertümliche Genitivketten ausgedrückt. Die ungewöhnliche hebräische Formulierung וַיֵּצְאוּ אִתָּם wird im Haupttext lesbar wiedergegeben, ihre echte Unschärfe jedoch in einer Fußnote offengelegt.
