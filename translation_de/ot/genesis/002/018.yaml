  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: de
  text: 'Da sagte Jahwe Gott: »Es ist nicht gut, dass der Mann allein ist. Ich will eine Hilfe für ihn machen, die ihm als Gegenüber entspricht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »eine Hilfe, die zu ihm passt«, »ein ihm entsprechendes Gegenüber« oder »eine Hilfe, die ihm entspricht«. Der hebräische Ausdruck bezeichnet jemanden, der ihm gegenübersteht und ihm entspricht; er besagt nicht, dass diese Hilfe einen niedrigeren Rang hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: In der Verbindung יְהוָה אֱלֹהִים bezeichnet אֱלֹהִים den allgemeinen Gottestitel neben dem Eigennamen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: »Sagte« gibt den Sprechakt wieder; »Da« markiert in natürlichem Deutsch den Fortgang der Erzählung.
- source_word: לֹא טוֹב
  choice: Es ist nicht gut
  rationale: Die wertende Aussage wird unmittelbar und ohne Abschwächung wiedergegeben.
- source_word: הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: dass der Mensch allein ist
  rationale: Die deutsche dass-Konstruktion gibt den hebräischen Infinitivsatz idiomatisch wieder. »Der Mensch« wahrt hier zugleich die Bezeichnung der konkreten menschlichen Gestalt und das Wortspiel mit אָדָם im Kontext.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Ich will ihm … machen
  rationale: Der Imperfekt drückt hier Jahwes Absicht aus; »ich will« bewahrt diesen voluntativen Zug.
- source_word: עֵזֶר
  choice: eine Hilfe
  rationale: Das feminine deutsche Substantiv »Hilfe« gibt die Funktion wieder, ohne von sich aus einen untergeordneten Status zu behaupten.
- source_word: כְּנֶגְדּוֹ
  choice: die ihm entspricht
  rationale: Die Formulierung bewahrt den Gedanken eines Gegenübers, das zu ihm passt beziehungsweise ihm korrespondiert, ohne Hierarchie in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe von הָאָדָם im Zusammenhang
  choice: der Mensch
  alternative: der Mann
  rationale: Der hebräische Ausdruck bezeichnet die einzelne menschliche Gestalt im Garten, bleibt hier aber lexikalisch אָדָם. »Der Mensch« wahrt diese Bezeichnung; die geschlechtliche Konkretisierung ergibt sich im weiteren Erzählverlauf.
- issue: Mögliches hierarchisches Missverständnis von עֵזֶר כְּנֶגְדּוֹ
  choice: eine Hilfe, die ihm entspricht
  alternative: eine passende Helferin für ihn
  rationale: Der hebräische Text stellt Hilfe und Entsprechung heraus, behauptet aber weder Unterlegenheit noch Überlegenheit. Die gewählte Formulierung lässt diese Spannung bestehen.
- issue: Modalität von אֶעֱשֶׂה
  choice: Ich will … machen
  alternative: Ich werde … machen
  rationale: Im Kontext kündigt Gott nicht nur eine Zukunft an, sondern äußert seine Absicht. »Ich will« bildet diesen Zug im Deutschen knapp ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt schlicht und erzählerisch. »Jahwe« bewahrt den Gottesnamen; »eine Hilfe, die ihm entspricht« ist verständlich und lässt die relationale Aussage des Hebräischen offen.
