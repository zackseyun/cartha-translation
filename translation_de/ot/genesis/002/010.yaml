source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: de
  text: Ein Fluss strömte aus Eden hervor, um den Garten zu bewässern. Von dort teilte er sich und wurde zu vier Hauptarmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu vier Köpfen“; gemeint sind hier die vier Hauptarme des Flusses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Ein Fluss
  rationale: נָהָר bezeichnet einen Fluss. Das vorangestellte וְ verbindet den Satz mit dem Kontext, muss im natürlichen deutschen Erzählstil hier aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: יֹצֵא מֵעֵדֶן
  choice: ging von Eden aus
  rationale: Das Partizip יֹצֵא beschreibt den aus Eden hervorgehenden Verlauf des Flusses; „ging … aus“ gibt die fortdauernde Bewegung in würdigem, natürlichem Deutsch wieder.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: um den Garten zu bewässern
  rationale: Der Infinitiv bezeichnet den Zweck. „Bewässern“ ist im Zusammenhang mit einem Garten präzise und allgemein verständlich.
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: Von dort teilte er sich
  rationale: מִשָּׁם markiert den Ausgangspunkt der Teilung; das Nifal von פרד kann ein intransitives Sich-Teilen bezeichnen.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: und wurde zu vier Hauptarmen
  rationale: היה mit לְ bezeichnet hier den entstandenen Zustand. רָאשִׁים bedeutet wörtlich „Köpfe“, meint im Flusszusammenhang jedoch die vier maßgeblichen Abzweigungen; „Hauptarme“ vermeidet die irreführende Vorstellung von vier Quellen.
