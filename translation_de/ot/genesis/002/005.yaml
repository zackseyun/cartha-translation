source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: de
  text: Noch gab es auf der Erde keinen Strauch des Feldes, und noch war keine Pflanze des Feldes hervorgesprossen; denn Jahwe Gott[a] hatte es nicht auf die Erde regnen lassen, und es gab keinen Menschen, der den Erdboden bearbeitete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell wiedergegeben mit „der HERR“.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: Feldstrauch
  rationale: שִׂיחַ bezeichnet einen Strauch oder Busch. „Feldstrauch“ bewahrt die Unterscheidung von עֵשֶׂב und gibt die hebräische Verbindung knapp und natürlich wieder.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: noch gab es auf der Erde keinen
  rationale: טֶרֶם bezeichnet einen noch nicht eingetretenen Zustand. Die Existenzformulierung mit היה und בארץ wird im Deutschen idiomatisch mit „noch gab es … keinen“ wiedergegeben.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: Feldpflanze
  rationale: עֵשֶׂב bezeichnet krautartige Vegetation. „Feldpflanze“ ist allgemein genug und hält die lexikalische Unterscheidung zum Feldstrauch aufrecht.
- source_word: טֶרֶם יִצְמָח
  choice: noch war … hervorgesprossen
  rationale: צמח bezeichnet das Sprossen oder Hervorwachsen. Das Plusquamperfekt passt zum rückblickend erklärenden Zusammenhang.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das Fehlen der Feldvegetation ein; „denn“ verbindet die Aussagen in würdigem, natürlichem Deutsch.
- source_word: הִמְטִיר
  choice: hatte es … regnen lassen
  rationale: Die Hifil-Form von מטר ist kausativ. „Regnen lassen“ bildet diese Bedeutung im Deutschen ausdrücklich und idiomatisch ab.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben; אֱלֹהִים steht dazu als „Gott“.
- source_word: וְאָדָם אַיִן
  choice: und es gab keinen Menschen
  rationale: אָדָם bezeichnet hier den Menschen als Gattungswesen beziehungsweise den menschlichen Bearbeiter des Bodens. „Mensch“ bewahrt diese repräsentative Bedeutung ohne unnötige geschlechtliche Verengung.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: der den Erdboden bearbeitete
  rationale: עבד bedeutet in diesem Zusammenhang bearbeiten oder kultivieren; אֲדָמָה bezeichnet den bearbeitbaren Erdboden. Der Relativsatz ist im Deutschen natürlicher als eine reine Infinitivkonstruktion.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: Erde / Erdboden
  rationale: Die Übersetzung unterscheidet אֶרֶץ als Erde beziehungsweise Land von אֲדָמָה als dem zu bearbeitenden Erdboden und erhält damit die bewusste Wortwahl des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersatzlesung wird in der Fußnote genannt, ohne sie in den Haupttext einzutragen.
- issue: Bedeutung von אָדָם an dieser Stelle
  choice: Mensch
  alternative: Mann
  rationale: Im unmittelbaren Zusammenhang geht es um das Fehlen eines menschlichen Bearbeiters des Bodens. „Mensch“ erhält den generischen Sinn und lässt zugleich die folgende Erzählung von Adam offen, ohne sie vorwegnehmend festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die parallele Struktur der beiden Anfangsaussagen und die Unterscheidung zwischen Erde und Erdboden bleiben erhalten. Ein nicht im Hebräischen vorhandenes einleitendes „Nun“ wurde vermieden.
