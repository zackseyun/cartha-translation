source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: de
  text: Da formte Jahwe Gott den Menschen aus Staub vom Erdboden[a] und blies den Lebensatem in seine Nasenlöcher. So wurde der Mensch zu einem lebendigen Wesen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Staub vom Erdboden“. Im Hebräischen klingen die Wörter für „Mensch“ (adam) und „Erdboden“ (adamah) ähnlich.'
    reason: wordplay
  - marker: b
    text: 'Oder: „zu einem lebenden Geschöpf“; traditionell: „zu einer lebendigen Seele“. Gemeint ist der Mensch als lebendes Wesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der unmittelbar folgende allgemeine Titel als „Gott“.
- source_word: וַיִּיצֶר
  choice: formte
  rationale: Das Verb bezeichnet konkretes Formen oder Gestalten und bewahrt hier das anschauliche Bild handwerklichen Formens.
- source_word: הָאָדָם
  choice: den Menschen / der Mensch
  rationale: Der Ausdruck bezeichnet hier den einzelnen Menschen der Erzählung; „Mensch“ gibt zugleich die weitere menschheitliche Bedeutung wieder, ohne vorzeitig den Eigennamen Adam einzusetzen.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: aus Staub vom Erdboden
  rationale: Die Formulierung bewahrt sowohl das Material „Staub“ als auch dessen Herkunft vom Erdboden und lässt den hebräischen Anklang zwischen adam und adamah teilweise erkennen.
- source_word: בְּאַפָּיו
  choice: in seine Nase
  rationale: Die hebräische Form bezeichnet im Zusammenhang die Nase beziehungsweise Nasenöffnungen; die deutsche Singularform klingt natürlich und bleibt körperlich konkret.
- source_word: נִשְׁמַת חַיִּים
  choice: den Lebensatem
  rationale: Das Kompositum gibt den idiomatischen Sinn „Atem des Lebens“ knapp und natürlich wieder; der hebräische Plural חַיִּים wird nicht künstlich nachgebildet.
- source_word: וַיְהִי ... לְ
  choice: So wurde ... zu
  rationale: Die Konstruktion bezeichnet den Übergang in einen Zustand; „wurde zu“ bildet diesen Vorgang präzise ab.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: zu einem lebendigen Wesen
  rationale: נֶפֶשׁ bezeichnet hier das ganze belebte Wesen, nicht ausdrücklich eine vom Körper trennbare Seele. „Lebendiges Wesen“ ist im Deutschen natürlich und wahrt diese Offenheit.
theological_decisions:
- issue: Bedeutung von הָאָדָם
  choice: der Mensch
  alternative: der Mann; Adam
  rationale: Der Kontext spricht von dem individuell geformten Menschen, während der hebräische Ausdruck zugleich „Mensch“ bedeutet. Die Übersetzung vermeidet sowohl eine unnötige geschlechtliche Verengung als auch die vorzeitige Behandlung als Eigenname.
- issue: Bedeutung von לְנֶפֶשׁ חַיָּה
  choice: ein lebendiges Wesen
  alternative: eine lebendige Seele; ein lebendes Geschöpf
  rationale: Der Ausdruck beschreibt den Menschen als lebendes, beseeltes Ganzes. „Seele“ könnte im heutigen Deutsch eine vom Körper getrennte Substanz nahelegen, die der Vers nicht ausdrücklich behauptet; „Geschöpf“ ist möglich, bezeichnet aber stärker das Geschaffensein als die hier ausgesagte Belebtheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen, wird aber durch „So“ idiomatisch gegliedert. „Jahwe“ bewahrt den Gottesnamen; „Lebensatem“ und „lebendiges Wesen“ sind verständlich, ohne spätere anthropologische Kategorien in den Text einzutragen.
