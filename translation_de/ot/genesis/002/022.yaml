  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: de
  text: Und aus der Seite, die der HERR, der Gott, vom Menschen genommen hatte, baute er eine Frau und brachte sie zu dem Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Rippe …“. Das hebräische Wort kann „Seite“ oder „Flanke“ bedeuten und wird in diesem Zusammenhang auch als „Rippe“ verstanden.'
    reason: Bewahrt die im Kontext von צֵלָע bestehende lexikalische und auslegungsgeschichtliche Offenheit, ohne einer anatomischen Deutung den Vorrang zu geben.
lexical_decisions:
- source_word: צֵלָע
  choice: Seite
  rationale: Das hebräische Wort bezeichnet gewöhnlich eine Seite oder Seitenpartie; „Rippe“ ist möglich, aber enger als der Ausdruck im Ausgangstext.
- source_word: וַיִּבֶן
  choice: baute
  rationale: Bewahrt das auffällige Bild des hebräischen Verbs „bauen“ statt es zu „machen“ abzuschwächen.
- source_word: יְהוָה אֱלֹהִים
  choice: der HERR, Gott
  rationale: Gibt den Gottesnamen gemäß deutscher Bibeltradition mit „HERR“ wieder und lässt zugleich die Verbindung mit אֱלֹהִים erkennen.
- source_word: הָאָדָם
  choice: dem Menschen
  rationale: Der Ausdruck ist hier mit Artikel gebraucht und bezeichnet den Menschen; eine Wiedergabe als Eigenname „Adam“ würde die im Hebräischen bestehende Wortbeziehung verengen.
- source_word: לְאִשָּׁה
  choice: eine Frau
  rationale: 'Die Konstruktion bezeichnet das Ergebnis des Bauens: Die genommene Seite wird zu einer Frau gestaltet.'
theological_decisions:
- issue: Anatomische Bestimmung von צֵלָע
  choice: Seite
  alternative: Rippe
  rationale: Die allgemeinere Bedeutung wird im Haupttext erhalten; die traditionelle anatomische Deutung wird in einer Fußnote genannt, ohne die genuine lexikalische Offenheit aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bau-Metapher des Hebräischen bleibt bewusst erhalten. Die Wortstellung folgt natürlichem Deutsch, ohne die Abfolge der Handlungen zu verändern.
