reference: Genesis 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: de
  text: Und Jahwe Gott ließ aus dem Erdboden allerlei Bäume wachsen, begehrenswert anzusehen und gut zu essen, dazu den Baum des Lebens mitten im Garten und den Baum der Erkenntnis von Gut und Böse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „Erkenntnis von Gut und Böse“ bleibt wörtlich wiedergegeben. Ob sie besonders moralisches Urteilsvermögen, Reife oder umfassende Erkenntnis bezeichnet, ist umstritten.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: ließ … wachsen
  rationale: Der Hifil-Wayyiqtol von צמח ist kausativ; die deutsche Konstruktion „ließ … wachsen“ gibt dies natürlich und genau wieder.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהִים steht dazu als „Gott“.
- source_word: מִן הָאֲדָמָה
  choice: aus dem Erdboden
  rationale: אֲדָמָה bezeichnet hier den Boden, aus dem die Bäume wachsen; „Erdboden“ ist im Deutschen anschaulich und wahrt den Zusammenhang mit dem Menschen aus dem Boden.
- source_word: כָּל עֵץ
  choice: allerlei Bäume
  rationale: Das Hebräische bezeichnet distributiv die Gesamtheit der Bäume. „Allerlei Bäume“ ist natürlich und vermeidet die im Deutschen mögliche Fehlvorstellung, buchstäblich jeder einzelne Baum sei gemeint.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: begehrenswert anzusehen
  rationale: נחמד drückt nicht nur angenehmes Aussehen, sondern Begehrenswürdigkeit aus; die Formulierung bewahrt diese Nuance und klingt dennoch verständlich.
- source_word: וְטוֹב לְמַאֲכָל
  choice: und gut zu essen
  rationale: Natürliche deutsche Wiedergabe der Eignung als Nahrung.
- source_word: וְעֵץ הַחַיִּים
  choice: dazu den Baum des Lebens
  rationale: Die traditionelle und transparente Wiedergabe der Constructusverbindung; „dazu“ bindet die besonders genannten Bäume natürlich an den Satz an.
- source_word: בְּתוֹךְ הַגָּן
  choice: mitten im Garten
  rationale: Gibt die räumliche Bedeutung von בְּתוֹךְ knapp, idiomatisch und mit möglicher Zentralitätsnuance wieder.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: und den Baum der Erkenntnis von Gut und Böse
  rationale: Die wörtliche, theologisch offene Wendung wird bewahrt, ohne „Erkenntnis“ auf moralisches Urteilsvermögen, Reife oder umfassendes Wissen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von דַּעַת טוֹב וָרָע
  choice: Erkenntnis von Gut und Böse
  alternative: moralische Erkenntnis; umfassendes Wissen; Erkenntnis dessen, was nützt und schadet
  rationale: Die hebräische Formulierung bleibt wörtlich erhalten, weil ihre genaue Reichweite umstritten ist und der Text sie hier nicht erklärt.
- issue: Zuordnung von בְּתוֹךְ הַגָּן
  choice: unmittelbar beim Baum des Lebens belassen
  alternative: auf beide besonders genannten Bäume beziehen
  rationale: Die Wortstellung verbindet „mitten im Garten“ unmittelbar mit dem Baum des Lebens. Ob damit zugleich die Lage des Erkenntnisbaums bezeichnet wird, bleibt syntaktisch offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, wird aber durch „dazu“ lesbar gegliedert. „Begehrenswert anzusehen“ erhält die stärkere Nuance von נֶחְמָד; die umstrittene Erkenntnisformel wird nicht interpretierend aufgelöst.
