  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: de
  text: Darum verlässt ein Mann seinen Vater und seine Mutter und hält an seiner Frau fest[a], und sie werden zu einem Fleisch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bindet sich fest an“ oder „schließt sich seiner Frau an“. Das hebräische Verb bezeichnet eine starke, beständige Bindung.'
    reason: lexical_alternative
  - marker: b
    text: „Ein Fleisch“ ist eine hebräische Wendung, die sowohl die körperliche Vereinigung als auch die Entstehung einer neuen verwandtschaftlichen Bindung einschließt.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Erzählung; „Darum“ ist natürlich und bewahrt den begründenden Zusammenhang.
- source_word: יַעֲזָב
  choice: verlässt
  rationale: Das Yiqtol formuliert hier eine allgemeine, normativ geprägte Aussage. Das deutsche Präsens gibt eine solche allgemeine Regel natürlich wieder, ohne einen ausdrücklichen Befehl einzutragen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt den ausdrücklich maskulinen Singular und seine repräsentative Funktion in der Eheformulierung.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: seinen Vater und seine Mutter
  rationale: Gibt beide im Hebräischen eigens genannten Elternteile wieder, statt sie zu „seine Eltern“ zusammenzufassen.
- source_word: וְדָבַק
  choice: und hält … fest
  rationale: „An jemandem festhalten“ vermittelt die starke, dauerhafte Bindung des Verbs דבק in natürlichem, würdigem Deutsch.
- source_word: בְּאִשְׁתּוֹ
  choice: an seiner Frau
  rationale: אִשָּׁה bezeichnet mit dem Suffix in diesem Zusammenhang die Ehefrau; die Präposition ב wird passend zur deutschen Wendung „an jemandem festhalten“ wiedergegeben.
- source_word: וְהָיוּ
  choice: und sie werden
  rationale: Bewahrt die resultative Aussage des Hebräischen in knapper deutscher Form.
- source_word: לְבָשָׂר אֶחָד
  choice: ein Fleisch
  rationale: Erhält die prägnante hebräische Wendung mit ihrer körperlichen und verwandtschaftlich-relationalen Bedeutung, ohne sie interpretierend einzuengen.
theological_decisions:
- issue: Geschlechtsspezifische repräsentative Sprache in der Eheformulierung
  choice: ein Mann
  alternative: ein Mensch; jemand
  rationale: Das Hebräische verwendet ausdrücklich den maskulinen Singular אִישׁ; eine geschlechtsneutrale Glättung würde diese Form beseitigen.
- issue: Art der Aussage
  choice: allgemeiner, normativ geprägter Grundsatz im Präsens
  alternative: direkter Befehl; bloße Beschreibung einer vergangenen Sitte
  rationale: Die hebräischen Verbformen formulieren einen aus der Schöpfungserzählung abgeleiteten allgemeinen Grundsatz, ohne einen ausdrücklichen Imperativ zu verwenden.
- issue: Bedeutungsumfang von „ein Fleisch“
  choice: Bildsprache unverändert bewahren und knapp erläutern
  alternative: nur sexuelle Vereinigung; ausschließlich rechtlich-bundhafte Einheit
  rationale: Die Wendung umfasst körperliche Vereinigung und die Entstehung einer neuen verwandtschaftlichen Bindung; der Haupttext soll diese Spannung nicht auf nur einen Aspekt reduzieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Das Präsens wirkt im Deutschen natürlicher als eine Zukunftsform und bewahrt den Charakter eines allgemeinen Grundsatzes. Die traditionelle Wendung „ein Fleisch“ bleibt wegen ihrer Prägnanz und Bedeutungsbreite erhalten; Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
