  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: de
  text: So wurden der Himmel und die Erde vollendet[a] und ihr ganzes Heer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Abschluss gebracht“.'
    reason: lexical_alternative
  - marker: b
    text: „Heer“ bezeichnet hier die gesamte geordnete Fülle dessen, was Himmel und Erde erfüllt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: wurden vollendet
  rationale: Die passive Wayyiqtol-Form von כלה bezeichnet das Erreichen der Vollständigkeit. „Wurden vollendet“ bewahrt sowohl den passiven als auch den resultativen Sinn und klingt im Deutschen würdig und natürlich.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: שָׁמַיִם hat im Hebräischen eine pluralische Form; in der festen deutschen Wendung „Himmel und Erde“ bezeichnet der Singular „Himmel“ jedoch natürlich den gesamten himmlischen Bereich, nicht nur den sichtbaren Luftraum.
- source_word: וְהָאָרֶץ
  choice: und die Erde
  rationale: Im Schöpfungszusammenhang bezeichnet אֶרֶץ die Erde als geschaffenen irdischen Bereich und nicht ein begrenztes Land.
- source_word: וְכָל
  choice: und ... ganzes
  rationale: Die Verbindung aus Konjunktion und Totalitätsbegriff wird direkt wiedergegeben; „ganzes“ bezieht die vollständige Fülle ein.
- source_word: צְבָאָם
  choice: ihr ganzes Heer
  rationale: צָבָא bezeichnet ein Heer, eine geordnete Schar oder Gesamtheit. Das kollektive Singularwort mit pluralischem Suffix wird durch „ihr ganzes Heer“ knapp und bildhaft wiedergegeben, ohne den Bezug auf Sterne oder andere Geschöpfe einzuengen.
theological_decisions:
- issue: Umfang von „ihr ganzes Heer“
  choice: Die Formulierung bleibt umfassend und bezeichnet die gesamte geordnete Fülle dessen, was zu Himmel und Erde gehört.
  alternative: Eine engere Deutung ausschließlich auf Sterne beziehungsweise Himmelskörper oder eine stärkere Betonung militärischer Heerscharen.
  rationale: Der unmittelbare Zusammenhang fasst die Vollendung der gesamten Schöpfungsordnung zusammen. Die wörtliche Bildsprache bleibt erhalten, ohne eine mögliche Bedeutung vorschnell festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die geläufige Paarformel „der Himmel und die Erde“ wird beibehalten; „Heer“ bewahrt das hebräische Kollektivbild und wird durch eine Fußnote erläutert.
