  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: de
  text: Doch vom Baum der Erkenntnis von Gut und Böse sollst du nicht essen; denn an dem Tag, an dem du davon isst,[a] wirst du ganz gewiss sterben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »an dem Tag, an dem du davon isst« kann idiomatisch auch »wenn du davon isst« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch mit verstärkender Verbkonstruktion; wörtlich etwa: »Sterben wirst du sterben«.'
    reason: source_form
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: Doch vom Baum
  rationale: Die Verbindung aus Konjunktion und Präposition lautet wörtlich etwa »und vom Baum«. Im Zusammenhang bildet sie jedoch einen deutlichen Gegensatz zu der zuvor erteilten Erlaubnis; »doch« gibt diese Diskursfunktion natürlich wieder.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: der Erkenntnis von Gut und Böse
  rationale: דַּעַת bezeichnet Erkenntnis beziehungsweise Wissen. »Gut und Böse« bewahrt die feste hebräische Wortverbindung und ihr moralisches sowie unterscheidendes Gewicht.
- source_word: לֹא תֹאכַל
  choice: sollst du nicht essen
  rationale: Der negierte Imperfekt drückt hier ein Verbot aus. »Sollst du nicht essen« ist im Deutschen klar und feierlich, ohne übermäßig altertümlich zu wirken.
- source_word: מִמֶּנּוּ
  choice: davon
  rationale: Das hebräische מִן bezeichnet die Herkunft beziehungsweise Entnahme. Das idiomatische deutsche »davon« gibt »von ihm/daraus« knapp und genau wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für das Verbot ein; »denn« bildet diese Funktion präzise ab.
- source_word: בְּיוֹם אֲכָלְךָ מִמֶּנּוּ
  choice: an dem Tag, an dem du davon isst
  rationale: Die Formulierung hält sich eng an das hebräische Zeitidiom und bewahrt dessen Spannung, statt es ausschließlich als allgemeines »wenn« auszulegen.
- source_word: מוֹת תָּמוּת
  choice: wirst du ganz gewiss sterben
  rationale: Der Infinitivus absolutus vor dem finiten Verb verstärkt die Aussage und betont die Gewissheit des Sterbens. »Ganz gewiss« gibt diese Intensivierung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Zeitliche Bedeutung von בְּיוֹם im Verhältnis zur angekündigten Todesfolge
  choice: Die Wendung wird als »an dem Tag, an dem« wiedergegeben.
  alternative: Dynamisch »wenn« oder deutend als sofortige Vollstreckung des körperlichen Todes übersetzen.
  rationale: Das Hebräische kann sowohl konkret »an dem Tag« als auch idiomatisch »wenn« bedeuten. Die gewählte Fassung bewahrt die zeitliche Spannung des Textes und entscheidet nicht, ob sofortiger körperlicher Tod, der Eintritt der Sterblichkeit oder ein verbindliches Todesurteil gemeint ist.
- issue: Art der Verstärkung in מוֹת תָּמוּת
  choice: Die Konstruktion wird als Gewissheitsaussage »wirst du ganz gewiss sterben« wiedergegeben.
  alternative: Wörtlich-formal »sterbend wirst du sterben« wiedergeben.
  rationale: Die hebräische Verdopplung intensiviert die Aussage; eine wörtliche Nachbildung wäre im modernen Deutschen missverständlich und unnatürlich. Die Übersetzung legt dabei nicht näher fest, wie oder wann sich der Tod verwirklicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Klang. Die Wortstellung wahrt den Kontrast zum vorherigen Vers; unnötig schwerfällige Wiederholungen der hebräischen Topikalisierung werden vermieden. Die zeitliche und theologische Spannung bleibt ausdrücklich offen.
