source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: de
  text: Dann nahm Jahwe Gott den Menschen und setzte ihn[a] in den Garten Eden, um ihn zu bearbeiten und zu bewahren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »setzte ihn« wiedergegebene Verb kann auch »ließ ihn ruhen« oder »ließ ihn sich niederlassen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um ihn zu bebauen und zu hüten«. Die hebräischen Verben können »arbeiten/bearbeiten/bebauen« und »bewahren/hüten/bewachen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: In der Verbindung יְהוָה אֱלֹהִים bewahrt »Jahwe Gott« sowohl den persönlichen Namen als auch die Gottesbezeichnung.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der Ausdruck bezeichnet hier das zuvor gebildete einzelne menschliche Wesen. »Den Menschen« entspricht dem Hebräischen und klingt im modernen Deutschen natürlicher als eine vorzeitige Verwendung des Eigennamens Adam.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bezeichnet in diesem Erzählzusammenhang schlicht das Nehmen; eine ausführlichere Wiedergabe wäre interpretierend.
- source_word: וַיַּנִּחֵהוּ
  choice: setzte ihn
  rationale: Der Hifil von נוח kann »ruhen lassen«, »niederlassen« oder »hinsetzen/bringen« bedeuten. »Setzte ihn« gibt im Kontext die Versetzung in den Garten natürlich wieder, ohne die mögliche Ruhe-Nuance in den Haupttext einzutragen.
- source_word: בְּגַן עֵדֶן
  choice: in den Garten Eden
  rationale: Die etablierte deutsche Wendung behandelt Eden als Eigennamen und gibt die Zielrichtung des kontextuell verstandenen Hineinsetzens idiomatisch wieder.
- source_word: לְעָבְדָהּ
  choice: damit er ihn bearbeitete
  rationale: עבד kann »arbeiten«, »dienen« oder bei Land »bearbeiten« bedeuten. »Bearbeiten« passt zum Garten, ohne die Tätigkeit ausschließlich als Landwirtschaft auszudeuten.
- source_word: וּלְשָׁמְרָהּ
  choice: und bewahrte
  rationale: שמר umfasst »bewahren«, »hüten«, »beaufsichtigen« und »schützen«. »Bewahren« hält die Bedeutung weit und vermeidet eine unnötig militärische Zuspitzung.
theological_decisions:
- issue: Aufgabe des Menschen im Garten Eden
  choice: Der Vers beschreibt die Aufgabe des Menschen mit den gewöhnlichen Bedeutungen »bearbeiten« und »bewahren«.
  alternative: Die Verben könnten vorrangig priesterlichen Dienst und das Hüten eines Heiligtums oder ausschließlich landwirtschaftlichen Anbau bezeichnen.
  rationale: עבד und שמר erlauben solche weiterführenden Bezüge, doch der Vers legt keine spezielle typologische oder konfessionelle Deutung zwingend fest. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname erscheint in der im Deutschen üblichen Form »Jahwe«. Die Pronomen beziehen sich grammatisch auf den maskulinen »Garten«; die Fußnoten bewahren die lexikalischen Alternativen und die Ruhe-Nuance von נוח.
