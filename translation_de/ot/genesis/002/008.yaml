base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: de
  text: Und Jahwe Gott pflanzte einen Garten in Eden, im Osten.[a] Dort setzte er den Menschen hinein, den er geformt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ostwärts“. Die hebräische Wendung kann entweder eine Lage im Osten oder eine Ausrichtung beziehungsweise Richtung nach Osten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: pflanzte
  rationale: נטע bezeichnet hier das Anpflanzen; „pflanzte“ gibt das Bild eines Gartens unmittelbar und idiomatisch wieder.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהִים steht appositionell dazu als „Gott“.
- source_word: גַּן
  choice: einen Garten
  rationale: גַּן bezeichnet einen Garten beziehungsweise ein umfriedetes, kultiviertes Gelände; „Garten“ ist im Kontext die klare Standardentsprechung.
- source_word: בְעֵדֶן
  choice: in Eden
  rationale: עֵדֶן ist hier ein Ortsname und wird daher als „Eden“ transliteriert.
- source_word: מִקֶּדֶם
  choice: im Osten
  rationale: Die Wendung kann eine östliche Lage oder eine ostwärts gerichtete Ausrichtung bezeichnen. Im Haupttext wird die verbreitete räumliche Deutung gewählt, die Alternative aber in einer Fußnote bewahrt.
- source_word: וַיָּשֶׂם שָׁם
  choice: Dort setzte er … hinein
  rationale: שׂים bedeutet „setzen, stellen, legen“ und שָׁם „dort“. „hinein“ stellt im Deutschen den natürlichen Bezug zum zuvor genannten Garten her.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der bestimmte Singular bezeichnet hier den zuvor geformten einzelnen Menschen. „den Menschen“ wahrt zugleich das Wortspiel und den sprachlichen Zusammenhang mit אָדָם besser als eine vorschnelle Namensdeutung.
- source_word: אֲשֶׁר יָצָר
  choice: den er geformt hatte
  rationale: יצר bedeutet „formen, gestalten“. Das Plusquamperfekt verdeutlicht im Deutschen, dass dieses Formen bereits vorausgegangen war.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von הָאָדָם
  choice: der Mensch
  alternative: der Mann
  rationale: Im unmittelbaren Kontext bezeichnet הָאָדָם den einzelnen aus Erde geformten Menschen. „der Mensch“ erhält die lexikalische Verbindung und legt an dieser Stelle weniger fest als „der Mann“.
- issue: Deutung von מִקֶּדֶם
  choice: im Osten
  alternative: ostwärts
  rationale: Die hebräische Wendung lässt sowohl eine Ortsangabe als auch eine Richtungsangabe zu. Die Ortsdeutung steht im Haupttext; die echte Mehrdeutigkeit wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne den erzählerischen Zusammenhang zu verändern. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Ortsangabe.
