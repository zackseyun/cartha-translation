source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: de
  text: Jahwe Gott formte aus dem Erdboden alle Tiere des Feldes und alle Vögel des Himmels und brachte sie zum Menschen, um zu sehen, welchen Namen er ihnen geben würde. Jede Bezeichnung, die der Mensch einem Lebewesen gab, war sein Name.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֶר
  choice: formte
  rationale: Das Wayyiqtol wird seinem normalen Erzählwert entsprechend als einfaches Präteritum wiedergegeben. Ein Plusquamperfekt ist kontextuell möglich, aber morphologisch nicht ausdrücklich markiert.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; zusammen mit אֱלֹהִים ergibt sich die natürliche Verbindung „Jahwe Gott“.
- source_word: מִן הָאֲדָמָה
  choice: aus dem Erdboden
  rationale: „Erdboden“ bezeichnet den Boden als Stoff und bewahrt den sprachlichen Zusammenhang zwischen אֲדָמָה und הָאָדָם.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: alle Tiere des Feldes
  rationale: Die traditionelle, zugleich verständliche Wendung erhält den Bezug auf das Feld beziehungsweise freie Land, ohne die Tiere enger als ausdrücklich „wild“ zu bestimmen.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: alle Vögel des Himmels
  rationale: „Vögel des Himmels“ gibt die hebräische Zuordnung natürlich und quellennah wieder.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: und brachte sie zu dem Menschen
  rationale: Das im Deutschen nötige Objekt „sie“ wird aus den vorausgehenden Tiergruppen ergänzt. הָאָדָם bleibt wegen des Artikels und des Wortspiels mit אֲדָמָה eine Gattungsbezeichnung.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: um zu sehen, wie er sie nennen würde
  rationale: Der Zweckinfinitiv wird direkt wiedergegeben. „Wie ... nennen“ ist idiomatisches Deutsch für die Frage nach der Benennung und bewahrt den offenen Ausgang.
- source_word: נֶפֶשׁ חַיָּה
  choice: Lebewesen
  rationale: Hier bezeichnet die Wendung ein lebendes Geschöpf. „Lebewesen“ vermeidet die missverständliche Wiedergabe „lebendige Seele“.
- source_word: הוּא שְׁמוֹ
  choice: so war sein Name
  rationale: Die verblos formulierte Feststellung wird idiomatisch mit „war“ wiedergegeben; das grammatische Maskulinum nimmt „Lebewesen“ auf.
theological_decisions:
- issue: Erzählzeit von וַיִּצֶר im Verhältnis zur Schöpfungsfolge
  choice: einfaches Präteritum „formte“
  alternative: Plusquamperfekt „hatte geformt“
  rationale: Die hebräische Verbform führt gewöhnlich die Erzählung fort und kennzeichnet keine Vorvergangenheit. Daher bleibt der Haupttext beim Präteritum, ohne die mögliche kontextuelle Einordnung ausdrücklich zu harmonisieren.
- issue: הָאָדָם als Gattungsbezeichnung oder Eigenname
  choice: „der Mensch“
  alternative: „Adam“
  rationale: Der Artikel und der unmittelbare Wortzusammenhang mit אֲדָמָה sprechen hier für die Gattungsbezeichnung. So bleibt zugleich der sprachliche Bezug zum Erdboden sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzführung. Das einfache Präteritum bewahrt die genuine zeitliche Offenheit des hebräischen Erzähltempus; „Tiere des Feldes“ vermeidet eine unnötige Einengung auf ausschließlich wilde Tiere.
