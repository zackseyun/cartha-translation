id: GEN.2.12
reference: Genesis 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/זֲהַ֛ב הָ/אָ֥רֶץ הַ/הִ֖וא ט֑וֹב שָׁ֥ם הַ/בְּדֹ֖לַח וְ/אֶ֥בֶן הַ/שֹּֽׁהַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: de
  text: Und das Gold jenes Landes ist gut. Dort gibt es Bedolach[a] und Onyxstein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise „aromatisches Harz“; welche Substanz mit dem hebräischen Wort gemeint ist, lässt sich nicht sicher bestimmen.
    reason: lexical_alternative
  - marker: b
    text: Oder möglicherweise ein anderer Edelstein, etwa Beryll; welcher Stein mit dem hebräischen שֹׁהַם gemeint ist, lässt sich nicht sicher bestimmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: Und das Gold
  rationale: Das Waw verbindet den Satz mit der vorausgehenden Beschreibung; זָהָב bezeichnet eindeutig Gold. Der bestimmte Ausdruck passt im Deutschen natürlich zur folgenden Herkunftsangabe.
- source_word: הָאָרֶץ הַהִוא
  choice: jenes Landes
  rationale: אֶרֶץ bedeutet hier „Land“, und das rückverweisende הַהִוא nimmt das im vorigen Vers genannte Hawila auf. „Jenes“ gibt den deiktischen Rückverweis knapp und würdig wieder.
- source_word: טוֹב
  choice: ist gut
  rationale: טוֹב bewertet hier wahrscheinlich die Beschaffenheit des Goldes. Die schlichte Wiedergabe „ist gut“ bewahrt die Ausdrucksweise des Hebräischen, ohne eine genauere Qualitätsaussage hinzuzufügen.
- source_word: שָׁם
  choice: Dort gibt es
  rationale: שָׁם bezeichnet den genannten Ort. „Dort gibt es“ führt die beiden dort vorkommenden Stoffe im modernen Deutschen natürlich ein.
- source_word: הַבְּדֹלַח
  choice: Bedolach
  rationale: Die genaue Substanz, die בְּדֹלַח bezeichnet, ist unsicher. Die eingedeutschte Umschrift vermeidet eine unbegründet genaue Identifizierung; eine wahrscheinliche Deutung steht in der Fußnote.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: und Onyxstein
  rationale: אֶבֶן bedeutet ausdrücklich „Stein“, während שֹׁהַם traditionell als Onyx verstanden wird. „Onyxstein“ bewahrt beides; die unsichere mineralogische Bestimmung wird durch eine Fußnote kenntlich gemacht.
theological_decisions: []
