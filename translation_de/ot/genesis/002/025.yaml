  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: de
  text: Und der Mann und seine Frau waren beide nackt, und sie schämten sich nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: sie waren
  rationale: Die Form von היה verbindet den Satz mit der Erzählung und bildet hier zusammen mit dem prädikativen Adjektiv eine Zustandsaussage.
- source_word: שְׁנֵיהֶם
  choice: beide
  rationale: „Beide“ gibt die auf das Paar bezogene Betonung des hebräischen Ausdrucks natürlich und präzise wieder.
- source_word: עֲרוּמִּים
  choice: nackt
  rationale: Das Adjektiv bezeichnet das Unbekleidetsein. „Nackt“ ist im modernen Deutschen klar und bewahrt soweit möglich die lautliche Nähe zum folgenden עָרוּם („listig“), ohne sie künstlich nachzubilden.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: הָאָדָם bezeichnet die zuvor geschaffene menschliche Gestalt, die hier seiner Frau gegenübergestellt wird. „Der Mensch“ wahrt die wiederkehrende Bezeichnung im Kontext; das maskuline Possessivpronomen bei „seine Frau“ macht den konkreten Bezug deutlich.
- source_word: וְאִשְׁתּוֹ
  choice: und seine Frau
  rationale: אִשָּׁה mit dem Suffix der 3. Person Singular bedeutet hier im Zusammenhang der in Vers 24 beschriebenen Verbindung natürlich „seine Frau“.
- source_word: לֹא
  choice: nicht
  rationale: Direkte Wiedergabe der hebräischen Verneinung.
- source_word: יִתְבֹּשָׁשׁוּ
  choice: sie schämten sich
  rationale: Die reflexive deutsche Wendung gibt das Erleben von Scham idiomatisch wieder und ist stärker und treffender als „sie waren nicht verlegen“.
theological_decisions:
- issue: Wiedergabe von הָאָדָם im unmittelbaren Kontext
  choice: der Mensch
  alternative: der Mann
  rationale: „Der Mensch“ bewahrt die lexikalische und erzählerische Kontinuität von הָאָדָם in Genesis 2. Zugleich lässt „seine Frau“ erkennen, dass hier der einzelne männliche Mensch gemeint ist. „Der Mann“ wäre kontextuell möglich, würde jedoch die wiederkehrende Bezeichnung stärker variieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Anlehnung an Wortfolge und Wiederholung des Hebräischen. Die Apposition „der Mensch und seine Frau“ bewahrt die nachgestellte Präzisierung des Subjekts; wegen ihrer Klarheit ist keine Fußnote erforderlich.
