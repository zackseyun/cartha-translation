source:
  edition: WLC
  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: de
  text: Der erste heißt Pischon. Er umfließt[a] das ganze Land Hawila, wo es Gold gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er zieht rings um das ganze Land Hawila« beziehungsweise »Er umgibt das ganze Land Hawila«.'
    reason: Das hebräische Partizip kann allgemein eine Bewegung rings um etwas oder ein Umgeben bezeichnen; »umfließt« macht den Flusszusammenhang im Deutschen ausdrücklich.
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Der erste heißt
  rationale: Die hebräische Namensformel lautet wörtlich »Der Name des ersten ist«. Im Deutschen gibt »Der erste heißt« die Bedeutung natürlich und vollständig wieder; הָאֶחָד bezeichnet im Zusammenhang der vier Flüsse den ersten.
- source_word: פִּישׁוֹן
  choice: Pischon
  rationale: Der Eigenname des Flusses wird nach üblicher deutscher Transkription wiedergegeben.
- source_word: הוּא הַסֹּבֵב
  choice: Er umfließt
  rationale: Das Partizip von סבב bezeichnet eine Bewegung rings um etwas. Bei einem Fluss gibt »umfließt« den geografischen Zusammenhang idiomatisch wieder, ohne die mögliche Grundbedeutung »umgibt/zieht rings um« zu verschweigen.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: das ganze Land Hawila
  rationale: כָּל wird mit »das ganze« ausgedrückt; אֶרֶץ bezeichnet hier ein benanntes Land oder Gebiet. Hawila ist die übliche deutsche Form des Ortsnamens.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: wo es Gold gibt
  rationale: Die Ortsangabe שָׁם wird ausdrücklich wiedergegeben. Trotz des Artikels bei זָהָב ist die unbestimmte deutsche Existenzformulierung »es gibt Gold« idiomatisch.
