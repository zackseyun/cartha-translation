source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: de
  text: 'Und Jahwe Gott gebot dem Menschen: „Von jedem Baum im Garten darfst du essen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du darfst gewiss essen.“ Das Hebräische verbindet einen Infinitiv mit derselben finiten Verbform, um die Aussage nachdrücklich zu verstärken.'
    reason: Die emphatische hebräische Konstruktion verstärkt die im Kontext erteilte Erlaubnis; „gewiss“ ist eine mögliche sinngemäße Wiedergabe, nicht eine wörtliche Übersetzung.
lexical_decisions:
- source_word: וַיְצַו
  choice: gebot
  rationale: Das Verb צוה bezeichnet hier eine verbindliche Anordnung. „Gebot“ gibt die autoritative Aussage knapp und in würdigem, verständlichem Deutsch wieder.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהִים folgt als „Gott“. Die feste Verbindung bleibt ohne eingefügten Artikel erhalten.
- source_word: עַל הָאָדָם
  choice: dem Menschen
  rationale: Mit צוה bezeichnet עַל den Empfänger des Gebots. הָאָדָם meint den einzelnen, zuvor geschaffenen Menschen; „dem Menschen“ bewahrt zugleich die lexikalische Verbindung zu אָדָם und legt die Bezeichnung noch nicht stärker als nötig auf „Mann“ fest.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Zitateinleiter wird im natürlichen Deutschen durch einen Doppelpunkt vor der direkten Rede ausgedrückt; ein zusätzliches „und sprach“ wäre möglich, aber stilistisch schwerfälliger.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: von jedem Baum im Garten
  rationale: מִן bezeichnet, wovon gegessen werden darf; „im Garten“ gibt die Zugehörigkeit des Konstruktausdrucks im Deutschen idiomatisch wieder.
- source_word: אָכֹל תֹּאכֵל
  choice: darfst du frei essen
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam das Verb. Im Zusammenhang wird eine weitreichende Erlaubnis erteilt; „frei essen“ verbindet diese Modalität mit der hebräischen Hervorhebung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von הָאָדָם
  choice: der Mensch
  alternative: der Mann; Adam
  rationale: Die Form bezeichnet hier das einzelne, aus Erde geschaffene menschliche Wesen. „Der Mensch“ bewahrt die im Hebräischen noch vorhandene Verbindung zwischen Gattungsbezeichnung und individueller Figur; „Adam“ als eindeutiger Eigenname oder „der Mann“ wäre an dieser Stelle stärker festlegend.
- issue: Funktion von אָכֹל תֹּאכֵל
  choice: Erlaubnis mit Nachdruck
  alternative: Befehl zu essen; bloße, unbetonte Erlaubnis
  rationale: Die Verbverbindung ist emphatisch, doch der unmittelbare Zusammenhang beschreibt, wovon der Mensch essen darf. Die Übersetzung vermeidet daher, daraus einen Befehl zum Essen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Zitateinleiter לֵאמֹר wird idiomatisch durch den Doppelpunkt wiedergegeben. „Frei essen“ ist allgemein verständlich und hält den Nachdruck der hebräischen Konstruktion präsent, ohne die Aussage als Essensgebot misszuverstehen.
