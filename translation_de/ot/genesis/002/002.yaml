  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: de
  text: Bis zum siebten Tag hatte Gott sein Werk vollendet, das er getan hatte.[a] Und am siebten Tag ruhte er von all seinem Werk, das er getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Am siebten Tag vollendete Gott sein Werk, das er getan hatte.“ Die hebräische Formulierung wird häufig so wiedergegeben; „Bis zum siebten Tag“ im Haupttext drückt den im Zusammenhang wahrscheinlichen Sinn aus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: hatte … vollendet
  rationale: כלה bezeichnet das Abschließen oder Vollenden. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass Gottes Werk beim Eintritt des siebten Tages vollendet war.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form steht hier mit einem Verb im Singular und bezeichnet im Zusammenhang den einen Gott.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: bis zum siebten Tag / am siebten Tag
  rationale: Die erste Wiedergabe drückt den wahrscheinlichen Zeitsinn im Zusammenhang aus; in der zweiten Satzhälfte bezeichnet dieselbe hebräische Wendung eindeutig den Tag, an dem Gott ruhte. Die formal nähere Alternative der ersten Hälfte wird in der Fußnote bewahrt.
- source_word: מְלַאכְתּוֹ
  choice: sein Werk
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder Werk. „Werk“ passt zum Schöpfungszusammenhang und klingt im Deutschen natürlich und würdig.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er getan hatte
  rationale: עשה ist ein breites Verb für tun oder machen. Die Wiedergabe mit „tun“ erhält diese semantische Breite und die Wiederholung des hebräischen Textes.
- source_word: וַיִּשְׁבֹּת
  choice: ruh­te
  rationale: שבת bedeutet grundlegend aufhören oder von einer Tätigkeit ablassen. „Ruhte“ ist hier die etablierte, kontextgerechte Wiedergabe und bezeichnet das Aufhören mit dem Werk, nicht notwendigerweise Erholung von Ermüdung.
- source_word: מִכָּל
  choice: von all
  rationale: Die Verbindung von מן und כָּל bezeichnet das Ablassen von der Gesamtheit des Werkes und wird direkt mit „von all“ wiedergegeben.
theological_decisions:
- issue: Ob der Text besagt, dass Gott noch am siebten Tag arbeitete
  choice: „Bis zum siebten Tag hatte Gott sein Werk vollendet“ stellt die Vollendung als beim Eintritt des siebten Tages bereits erreicht dar.
  alternative: „Am siebten Tag vollendete Gott sein Werk“ folgt der hebräischen Formulierung enger und kann so verstanden werden, dass die Vollendung am siebten Tag geschah.
  rationale: Die hebräische Zeitangabe lautet formal „am siebten Tag“, steht aber unmittelbar neben der Aussage, dass Gott am siebten Tag ruhte. Die Hauptfassung gibt den wahrscheinlichen Sinn im Zusammenhang wieder, während die Fußnote die echte formale Alternative offenlegt, ohne die Spannung stillschweigend zu beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung „das er getan hatte“ wurde trotz ihrer Schwere beibehalten, weil sie die auffällige Wiederholung des hebräischen Verses abbildet. Der Fußnotenmarker [a] steht unmittelbar nach der betroffenen ersten Aussage.
