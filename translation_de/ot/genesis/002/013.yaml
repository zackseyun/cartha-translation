base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: de
  text: Und der zweite Fluss heißt Gihon; er fließt um das ganze Land Kusch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er umgibt das ganze Land Kusch«. Kusch ist ein alter Ortsname, der traditionell mit Gebieten südlich von Ägypten verbunden wird.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: Und der zweite Fluss heißt
  rationale: Die nominale Wendung »und der Name des zweiten Flusses« wird im Deutschen natürlich und inhaltlich gleichwertig mit »der zweite Fluss heißt« wiedergegeben; וְ führt die Aufzählung fort.
- source_word: גִּיחוֹן
  choice: Gihon
  rationale: Der Eigenname wird nach seiner hebräischen Form transliteriert und nicht gedeutet.
- source_word: הוּא הַ/סּוֹבֵב
  choice: er fließt um
  rationale: Das Pronomen nimmt den Fluss wieder auf. Das Partizip von סבב bezeichnet hier ein Sich-herum-Bewegen; »fließt um« ist im Zusammenhang eines Flusses natürlich, ohne zwingend ein vollständiges Umschließen festzulegen.
- source_word: אֵת כָּל אֶרֶץ
  choice: das ganze Land
  rationale: כָּל אֶרֶץ bezeichnet die Gesamtheit des Landes beziehungsweise Gebiets; »das ganze Land« ist idiomatisches modernes Deutsch.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der alte Ortsname wird bewahrt. Eine Wiedergabe mit »Äthiopien« wäre geografisch interpretierend und könnte anachronistisch wirken.
