  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: de
  text: Doch ein Dunst stieg aus der Erde auf und bewässerte die ganze Oberfläche des Erdbodens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Quelle«, »Wasserstrom« oder »Wasserfluss«. Das seltene hebräische Wort kann statt »Dunst« Wasser bezeichnen, das aus dem Boden hervortritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Doch ein Dunst
  rationale: אֵד ist selten und in seiner Bedeutung umstritten. „Dunst“ passt zur Aufwärtsbewegung und bewahrt die traditionelle Deutung, ohne die möglichen hydrologischen Bedeutungen auszuschließen. וְ wird kontrastiv mit „Doch“ wiedergegeben, da zuvor das Ausbleiben des Regens beschrieben wird.
- source_word: יַעֲלֶה
  choice: stieg immer wieder … auf
  rationale: Das Qal-Imperfekt von עלה bezeichnet in diesem beschreibenden Vergangenheitszusammenhang wahrscheinlich einen wiederkehrenden oder charakteristischen Vorgang.
- source_word: מִן הָ/אָ֑רֶץ
  choice: aus der Erde
  rationale: אֶרֶץ bezeichnet hier im umfassenden Schöpfungszusammenhang die Erde; „aus“ gibt die Herkunft der aufsteigenden Feuchtigkeit natürlich wieder.
- source_word: וְ/הִשְׁקָה
  choice: und bewässerte
  rationale: Das Hifil von שקה bedeutet „zu trinken geben, bewässern“. Die Vergangenheitsform schließt sich an den wiederkehrenden Vorgang des Aufsteigens an.
- source_word: אֶת כָּל פְּנֵי
  choice: die ganze Oberfläche
  rationale: Die hebräische Wendung bezeichnet die gesamte sichtbare Fläche und wird so in natürlichem modernem Deutsch wiedergegeben.
- source_word: הָֽ/אֲדָמָֽה
  choice: des Erdbodens
  rationale: אֲדָמָה bezeichnet den Boden beziehungsweise die Erdkrume und bleibt damit von אֶרֶץ („Erde“) unterschieden.
theological_decisions:
- issue: Deutung von אֵד
  choice: Dunst
  alternative: Wasserstrom, Quellwasser oder aufsteigendes Grundwasser
  rationale: Die Aufwärtsbewegung stützt „Dunst“, doch das seltene Wort kann auch einen aus der Erde kommenden Wasserfluss bezeichnen. Die Hauptübersetzung entscheidet die lexikalische Unsicherheit daher nicht endgültig; die Alternativen werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stieg immer wieder … auf“ macht den wahrscheinlich gewohnheitsmäßigen Aspekt des hebräischen Imperfekts deutlich; „Erde“ und „Erdboden“ bewahren die Unterscheidung zwischen אֶרֶץ und אֲדָמָה.
