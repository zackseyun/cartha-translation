  text: אֵ֣לֶּה תוֹלְד֧וֹת הַ/שָּׁמַ֛יִם וְ/הָ/אָ֖רֶץ בְּ/הִבָּֽרְאָ֑/ם בְּ/י֗וֹם עֲשׂ֛וֹת יְהוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְ/שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: de
  text: Dies ist die Geschichte[a] des Himmels und der Erde, als sie geschaffen wurden, zu der Zeit,[b] als Jahwe[c] Gott Erde und Himmel machte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort toledot kann je nach Zusammenhang „Generationen“, „Nachkommen“, „Ursprünge“, „Geschichte“ oder „Bericht“ bedeuten und dient in Genesis mehrfach als Abschnittsüberschrift.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an dem Tag, als“. Die hebräische Wendung kann allgemein „als“ oder „zu der Zeit, als“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht der Gottesname JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Dies ist die Geschichte
  rationale: Die hebräische Formel leitet einen neuen Abschnitt der Genesis ein. Das grammatisch pluralische אֵלֶּה תוֹלְדוֹת wird im Deutschen idiomatisch mit dem singularischen Sammelbegriff „Geschichte“ wiedergegeben; eine wörtliche Form wie „Dies sind die Generationen“ wäre hier missverständlich und unnatürlich.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: des Himmels und der Erde
  rationale: Die feste deutsche Paarformel „Himmel und Erde“ bezeichnet wie das hebräische Merisma die gesamte geschaffene Welt. Obwohl שָׁמַיִם formal pluralisch ist, ist im modernen Standarddeutsch in dieser Wendung der Singular „Himmel“ üblich.
- source_word: בְּהִבָּרְאָם
  choice: als sie geschaffen wurden
  rationale: Die Präposition ב mit dem Infinitiv im Nifal und dem pluralischen Suffix wird temporal und passiv wiedergegeben. Das Pronomen „sie“ bezieht sich auf Himmel und Erde.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: zu der Zeit, als … machte
  rationale: בְּיוֹם ist hier eine Zeitangabe im Sinn von „als“ beziehungsweise „zu der Zeit, als“, nicht zwingend die Festlegung auf einen einzelnen Kalendertag. Die Wiedergabe bleibt verständlich und bewahrt zugleich den zeitlichen Ausdruck.
- source_word: עֲשׂוֹת
  choice: machte
  rationale: Das Verb עשה wird direkt und im Kontext idiomatisch mit „machen“ wiedergegeben.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: Erde und Himmel
  rationale: Die gegenüber der ersten Vershälfte umgekehrte Reihenfolge wird als literarisches Merkmal bewahrt. Entsprechend dem artikellosen Hebräisch stehen die Substantive hier ohne Artikel.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben; אֱלֹהִים steht daneben als „Gott“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ macht diesen sichtbar, während „der HERR“ die traditionelle Ersatzlesung wiedergibt. Die alternative Tradition wird in der Fußnote genannt, ohne den Eigennamen im Haupttext zu verdecken.
- issue: Zeitlicher Sinn von בְּיוֹם
  choice: zu der Zeit, als
  alternative: an dem Tag, als
  rationale: Die hebräische Wendung kann idiomatisch einen Zeitpunkt oder Zeitraum bezeichnen. Die Übersetzung legt daher nicht unnötig fest, dass ausschließlich ein einzelner Kalendertag gemeint sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Paarung „Himmel und Erde“ beziehungsweise „Erde und Himmel“ und ihre umgekehrte Reihenfolge bleiben erhalten. „Geschichte“ ist als verständliche Abschnittsformel gewählt; die breitere Bedeutung des schwer eindeutig festzulegenden תוֹלְדוֹת wird in der Fußnote offengehalten.
