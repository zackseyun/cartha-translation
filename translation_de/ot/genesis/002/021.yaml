base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: de
  text: Da ließ Jahwe, der Gott, einen tiefen Schlaf über den Mann fallen, und er schlief. Dann nahm er eine seiner Rippen[a] und verschloss die Stelle mit Fleisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine seiner Seiten« beziehungsweise »einen Teil seiner Seite«. Das hebräische Wort kann eine Rippe, eine Seite oder einen Seitenteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: ließ … fallen
  rationale: Der Hifil von נפל ist kausativ. Die deutsche Konstruktion bewahrt das hebräische Bild und klingt zugleich natürlich.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben; אֱלֹהִים steht dazu als Gottesbezeichnung. Das Komma macht die Verbindung im Deutschen lesbar, ohne den Namen durch einen Titel zu ersetzen.
- source_word: תַּרְדֵּמָה
  choice: einen tiefen Schlaf
  rationale: Das Substantiv bezeichnet einen schweren, hier von Gott herbeigeführten Schlaf; »tiefer Schlaf« ist klar und kontextgerecht.
- source_word: הָאָדָם
  choice: den Mann
  rationale: Im unmittelbaren Erzählzusammenhang ist ein bestimmter männlicher Mensch gemeint, nicht die Menschheit im Allgemeinen.
- source_word: וַיִּישָׁן
  choice: sodass er einschlief
  rationale: Die Folge des verursachten tiefen Schlafs wird in natürlichem Deutsch ausgedrückt. Das Resultatverhältnis ist im hebräischen Erzählablauf angelegt.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: eine von seinen Rippen
  rationale: צֵלָע kann »Rippe«, »Seite« oder »Seitenteil« bedeuten. Die körperliche Entnahme und das anschließende Verschließen mit Fleisch sprechen hier für »Rippe«; die echte Alternative bleibt in der Fußnote erhalten.
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: verschloss ihre Stelle mit Fleisch
  rationale: Wörtlich steht etwa »er verschloss Fleisch unter/an ihrer Stelle«. Die gewählte Formulierung gibt den kontextuellen Sinn idiomatisch wieder, ohne eine zusätzliche Handlung einzuführen.
theological_decisions:
- issue: Bedeutung von אָדָם im Kontext
  choice: der Mann
  alternative: der Mensch / das Menschenwesen
  rationale: Der Vers spricht von dem einzelnen Mann, aus dessen Körper im folgenden Vers die Frau gebaut wird. Daher ist die konkrete männliche Referenz vorrangig.
- issue: Bedeutung von צֵלָע
  choice: Rippe
  alternative: Seite / Seitenteil
  rationale: Die anatomische Handlung und das Verschließen der Entnahmestelle stützen »Rippe«. Da »Seite« lexikalisch möglich und auslegungsgeschichtlich bedeutsam ist, wird diese Möglichkeit ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Der Gottesname wird als »Jahwe« wiedergegeben. Die Formulierung bleibt nahe am hebräischen Bild, vermeidet jedoch unnatürliche deutsche Syntax.
