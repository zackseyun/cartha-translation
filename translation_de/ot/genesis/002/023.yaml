  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: de
  text: 'Da sagte der Mann: »Diesmal ist sie Knochen von meinen Knochen und Fleisch von meinem Fleisch! Sie soll ›Frau‹[a] heißen, denn vom Mann wurde sie genommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen hier die ähnlich klingenden Wörter ischah (»Frau«) und isch (»Mann«); das Wortspiel lässt sich im Deutschen nicht nachbilden.
    reason: Wortspiel im Ausgangstext
lexical_decisions:
- source_word: הָאָדָם
  choice: der Mann
  rationale: In diesem Vers bezeichnet אָדָם den männlichen Menschen und leitet zum Wortspiel אִשָּׁה/אִישׁ über; »der Mann« entspricht daher dem unmittelbaren Kontext.
- source_word: זֹאת הַפַּעַם
  choice: Diesmal ist sie
  rationale: הַפַּעַם bedeutet wörtlich »diesmal« bzw. »bei dieser Gelegenheit«; die Formulierung bewahrt den demonstrativen Nachdruck und klingt im Deutschen als freudiger Ausruf natürlich.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: Bein von meinem Bein
  rationale: »Bein« bezeichnet hier die Knochensubstanz und bewahrt zusammen mit »Fleisch« die hebräische Paarformel; »von« gibt die Herkunftsbeziehung von מִן wieder.
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: und Fleisch von meinem Fleisch
  rationale: Die parallele Wiedergabe mit »von« erhält sowohl die Präposition מִן als auch den poetischen Gleichklang mit der ersten Vershälfte.
- source_word: לְזֹאת יִקָּרֵא
  choice: Sie soll … heißen
  rationale: Die deutsche Benennungsformel »soll … heißen« gibt das passive יִקָּרֵא natürlich wieder; das feminine Pronomen nimmt den betonten Demonstrativbezug auf.
- source_word: אִשָּׁה … אִישׁ
  choice: Frau … Mann
  rationale: Dies sind die üblichen deutschen Entsprechungen. Das lautliche hebräische Wortspiel lässt sich im Deutschen nicht vollständig nachbilden und wird deshalb in einer Fußnote erläutert.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: denn vom Mann wurde sie genommen
  rationale: »Denn« führt den Begründungssatz würdig und natürlich ein; das Passiv und die Herkunftsangabe werden eng am Hebräischen bewahrt.
theological_decisions:
- issue: Bedeutung von אָדָם im Kontext
  choice: der Mann
  alternative: der Mensch
  rationale: Obwohl אָדָם auch den Menschen allgemein bezeichnen kann, verlangt der unmittelbare Übergang zu אִישׁ und אִשָּׁה hier eine männlich bestimmte Referenz, ohne darüber hinausgehende anthropologische Aussagen einzutragen.
- issue: Wiedergabe von אִישׁ und אִשָּׁה
  choice: Mann und Frau
  alternative: Ehemann und Ehefrau
  rationale: Der Vers spricht mit den Grundbezeichnungen für Mann und Frau. Eine Wiedergabe als Ehepartner würde den lexikalischen Sinn unnötig verengen.
- issue: Ausdruck der Herkunfts- und Wesensgemeinschaft
  choice: Bein von meinem Bein und Fleisch von meinem Fleisch
  alternative: Gebein von meinem Gebein und Fleisch von meinem Fleisch
  rationale: Die Formel bezeugt engste leibliche Verwandtschaft; »Bein« ist verständlicher als das altertümliche »Gebein« und lässt die Aussage theologisch offen, ohne sie auszudeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Ausruf wird durch »Diesmal« und das Ausrufezeichen als freudige Erkenntnis hörbar; altertümliche Formen wie »Gebein« werden vermieden. Die zentrale hebräische Klangfigur wird transparent in einer Fußnote erklärt.
