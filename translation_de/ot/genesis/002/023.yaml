  source_fidelity: Die Wiedergabe trifft die Satzstruktur, die Benennungsformel und die Begründung im Wesentlichen. »Bein« ist jedoch im heutigen Standarddeutsch primär ein Körperglied (ein Leg), während עֶצֶם hier »Knochen« bedeutet; die Formel muss daher mit »Knochen« wiedergegeben werden.
  naturalness: »Diesmal ist sie …« ist als markierter, freudiger Ausruf natürlich und hält die hebräische Zeit-/Anlassnuance besser fest als ein rein idiomatisches »Endlich«. »Knochen von meinen Knochen und Fleisch von meinem Fleisch« ist verständlich, würdig und parallelistisch.
  terminology: »der Mann«, »Frau« und »Mann« geben den Kontext und die hebräische Benennungsassoziation angemessen wieder, ohne Ehebegriffe einzutragen. Die Fußnote erklärt zutreffend, dass das hebräische Klangspiel im Deutschen nicht nachbildbar ist; ihre Anführungszeichen werden korrigiert.
