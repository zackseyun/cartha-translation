  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: de
  text: Und der Mensch gab allem Vieh, den Vögeln des Himmels und allen Wildtieren Namen.[a] Doch für den Menschen fand sich keine Hilfe, die ihm entsprach.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Adam gab allem Vieh … Namen. Doch für Adam fand sich keine Hilfe, die ihm entsprach.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „keine Hilfe, die zu ihm passte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im Hebräischen: „er fand keine“; daher ist auch möglich: „Doch der Mensch fand keine Hilfe, die ihm entsprach.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: der Mensch / für den Menschen
  rationale: Der Ausdruck bezeichnet hier den einzelnen Menschen in der Erzählung. „Der Mensch“ bewahrt die Nähe zum hebräischen Gattungswort, ohne es vorschnell ausschließlich als Eigennamen wiederzugeben.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: gab … Namen
  rationale: Die Wendung bezeichnet das Vergeben von Namen. Die deutsche Formulierung ist natürlich und gibt das ausdrücklich im Plural stehende „Namen“ wieder.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Hier sind die domestizierten Tiere als Gruppe gemeint; „Vieh“ unterscheidet sie knapp und verständlich von den Wildtieren.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: Die Wiedergabe bewahrt das hebräische Bild und ist im Deutschen verständlich und würdevoll.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: alle Wildtiere
  rationale: Die Wendung bezeichnet hier die nicht domestizierten Landtiere. „Wildtiere“ gibt den Gegensatz zum Vieh in modernem Deutsch klar wieder.
- source_word: עֵזֶר
  choice: Hilfe
  rationale: Das hebräische Substantiv kann sowohl die Hilfe als auch die helfende Person bezeichnen. „Hilfe“ bleibt eng am Wortlaut und besagt keine Unterordnung.
- source_word: כְּנֶגְדּוֹ
  choice: die ihm entsprach
  rationale: Die Formulierung bewahrt den Gedanken eines passenden, ihm gegenüberstehenden Entsprechens, ohne die Beziehung genauer festzulegen, als es der hebräische Ausdruck tut.
- source_word: לֹא מָצָא
  choice: fand sich keine
  rationale: Obwohl das Hebräische aktiv „er fand nicht“ formuliert, gibt die unpersönliche deutsche Wendung das Ergebnis der Suche natürlich wieder; die aktive Lesart wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von אָדָם in Genesis 2,20
  choice: der Mensch
  alternative: Adam
  rationale: Der Artikel beim ersten Vorkommen und der Erzählzusammenhang lassen die Gattungsbezeichnung noch deutlich hervortreten. Zugleich kann der Ausdruck bereits namensartig verstanden werden; diese Möglichkeit bleibt in der Fußnote erhalten.
- issue: Bedeutung von עֵזֶר כְּנֶגְדּוֹ
  choice: eine Hilfe, die ihm entsprach
  alternative: eine Hilfe, die zu ihm passte
  rationale: „Entsprach“ erhält die Spannung zwischen Hilfe, Gegenüber und Entsprechung, ohne Unterordnung oder eine bestimmte Theorie der Geschlechterbeziehung in den Text einzutragen.
- issue: Subjekt von לֹא מָצָא
  choice: 'unpersönlich: fand sich keine'
  alternative: 'aktiv: er fand keine'
  rationale: Die aktive hebräische Form kann sich auf den Menschen beziehen; die unpersönliche Wiedergabe betont dagegen das erzählte Ergebnis. Da beide Auffassungen möglich sind, wird die aktive Form in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung ist natürlich deutsch, während zentrale hebräische Bilder und die Mehrdeutigkeit von אָדָם, כְּנֶגְדּוֹ und לֹא מָצָא erhalten bleiben.
