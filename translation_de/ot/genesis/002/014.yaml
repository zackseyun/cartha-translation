id: GEN.2.14
reference: Genesis 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: de
  text: Und der dritte Fluss heißt Hiddekel[a]; er fließt östlich von Assur[b]. Und der vierte Fluss ist der Euphrat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hiddekel wird traditionell mit dem Tigris gleichgesetzt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „östlich von Assyrien“; hebräisch: „östlich von Assur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: heißt
  rationale: Die hebräische Namensformel wird im modernen Deutschen natürlich mit „heißt“ wiedergegeben, ohne ihren Sinn zu verändern.
- source_word: נָּהָר
  choice: Fluss
  rationale: Die übliche und kontextgerechte Bedeutung ist „Fluss“.
- source_word: שְּׁלִישִׁי
  choice: dritte
  rationale: Direkte Wiedergabe der Ordinalzahl.
- source_word: חִדֶּקֶל
  choice: Hiddekel
  rationale: Die hebräische Namensform wird transliteriert; die traditionelle Identifizierung mit dem Tigris steht in einer Fußnote.
- source_word: הוּא הַהֹלֵךְ
  choice: er fließt
  rationale: Bei einem Fluss gibt „fließt“ das partizipiale הֹלֵךְ im Deutschen natürlich und sachgerecht wieder.
- source_word: קִדְמַת
  choice: östlich von
  rationale: Im geografischen Zusammenhang bezeichnet der Ausdruck die Lage im Osten beziehungsweise östlich von Assur.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Die hebräische Namensform bleibt erhalten; ob der Name hier das Land Assyrien bezeichnet, wird in der Fußnote offengehalten.
- source_word: רְבִיעִי
  choice: vierte
  rationale: Direkte Wiedergabe der Ordinalzahl.
- source_word: פְרָת
  choice: Euphrat
  rationale: „Euphrat“ ist die fest etablierte deutsche Bezeichnung dieses Flusses und daher für heutige Leser klar.
