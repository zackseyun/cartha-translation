base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: de
  text: So segnete Gott den siebten Tag und heiligte ihn[a], denn an diesem Tag ruhte er[b] von all seinem Werk, das Gott geschaffen und gemacht hatte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sonderte ihn als heilig aus“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch „hörte auf“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Schlussausdruck ist schwierig. Wörtlich stehen hier die Verben „schaffen“ und „machen/tun“ nebeneinander. Möglich ist: „das Gott geschaffen und gemacht hatte“; auch: „das Gott geschaffen hatte, um es zu machen“ oder „das Gott schuf, indem er es machte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Das Piel von ברך bezeichnet hier das Verleihen von Segen. „Segnete“ ist die direkte, natürliche deutsche Entsprechung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht mit singularischer Verbform und bezeichnet hier den einen Gott.
- source_word: יּוֹם הַשְּׁבִיעִי
  choice: den siebten Tag
  rationale: Formnahe und idiomatische Wiedergabe des Substantivs mit bestimmter Ordnungszahl.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: heiligte ihn
  rationale: Das Piel von קדש bedeutet, etwas zu heiligen beziehungsweise als heilig auszusondern. „Heiligte ihn“ ist knapp, würdevoll und im modernen Deutschen verständlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Segen und Heiligung ein. „Denn“ verbindet die beiden Sätze im Deutschen flüssig.
- source_word: בּוֹ
  choice: an ihm
  rationale: Der Rückbezug gilt dem siebten Tag; bei Tagen ist „an ihm“ idiomatisches Deutsch und bewahrt den pronominalen Bezug.
- source_word: שָׁבַת
  choice: ruhte
  rationale: Das Verb kann „aufhören“ oder „ruhen“ bedeuten. „Ruhte“ ist im Schöpfungszusammenhang natürlich und erhält den sprachlichen Bezug zum Sabbat.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: von all seinem Werk
  rationale: מלאכה bezeichnet Arbeit, Tätigkeit oder ein hervorgebrachtes Werk. „Werk“ passt zum Schöpfungskontext und verbindet sich im Deutschen natürlich mit „ruhen von“.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: das Gott geschaffen und gemacht hatte
  rationale: Die Verbindung des Relativsatzes mit dem Infinitiv לַעֲשׂוֹת ist syntaktisch schwierig. Die koordinierte Wiedergabe ist verständliches Deutsch und gibt beide Verben wieder, ohne die unsichere Beziehung im Haupttext umständlich nachzubilden; die formnähere Fassung wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von שָׁבַת und sein Bezug zum Sabbat
  choice: ruhte
  alternative: hörte auf
  rationale: „Ruhte“ bewahrt den im Kontext wichtigen Bezug zum Sabbat, ohne notwendigerweise Erschöpfung auszusagen. Die ebenfalls mögliche Bedeutung „hörte auf“ bleibt in der Fußnote sichtbar.
- issue: Heiligung des siebten Tages
  choice: heiligte ihn
  alternative: sonderte ihn als heilig aus
  rationale: Die knappe Form bewahrt die Aussage, dass Gott dem Tag Heiligkeit verleiht beziehungsweise ihn als heilig bestimmt, ohne die genaue Nuance unnötig festzulegen.
- issue: Deutung des schwierigen Schlussausdrucks לַעֲשׂוֹת
  choice: geschaffen und gemacht hatte
  alternative: geschaffen hatte, um es zu tun
  rationale: Die Hauptfassung bietet eine traditionelle, verständliche Deutung der schwierigen Konstruktion. Die Fußnote hält die formnähere, aber im Deutschen unklare Möglichkeit sowie eine instrumentale Deutung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Heiligte“ und „Werk“ bewahren die prägnante religiöse Sprache, ohne altertümliche Satzformen zu verwenden. Die Wiederholung von „Gott“ folgt dem hebräischen Text und verhindert zugleich einen unklaren Rückbezug.
