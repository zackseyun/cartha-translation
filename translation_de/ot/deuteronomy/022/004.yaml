review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Tiere, das Unterlassen des Wegsehens, den Nachdruck des Gebots und das gemeinsame Handeln mit dem Besitzer grundsätzlich. Die Formulierung „wie ... gestürzt ist“ gibt jedoch das hebräische Partizip נֹפְלִים nicht angemessen wieder: Sie macht aus der Begegnung mit einem gefallenen Tier eine beobachtete abgeschlossene Handlung und steht zudem unnötig im Perfekt.'
  naturalness: „Du sollst nicht zusehen, wie ... gestürzt ist“ ist im modernen Deutsch semantisch und grammatisch unglücklich. Eine Konditionalfügung mit „wenn du ... gefallen siehst“ gibt die Situation idiomatisch wieder. „Sie ... mit ihm zusammen aufrichten“ ist natürlich und bewahrt die explizite Kooperation.
  terminology: „Bruder“, „Esel“ und „Rind“ sind vertretbar und quellennah. „Rind“ wahrt gegenüber „Ochse“ die lexikalische Offenheit von שׁוֹר. Die Fußnote ist entbehrlich, weil „mit ihm zusammen“ die hebräische Präpositionalphrase bereits ausdrücklich übersetzt.
  issues:
  - severity: medium
    issue: „wie der Esel deines Bruders oder sein Rind auf dem Weg gestürzt ist“
    rationale: Das Hebräische beschreibt die Tiere als gefallen daliegend bzw. zusammengebrochen, nicht primär als einen Vorgang, dem man zusieht. Das Perfekt „gestürzt ist“ verschiebt zudem den Aspekt und klingt in dieser Konstruktion unidiomatisch.
  - severity: low
    issue: Fußnotenanker trotz expliziter Wiedergabe von עִמּוֹ
    rationale: Da „mit ihm zusammen“ bereits direkt im Text steht, liefert die Fußnote keine notwendige lexikalische Alternative und ihre Erklärung geht leicht über die knappe Textaussage hinaus.
