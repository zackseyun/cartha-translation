base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: de
  text: Du sollst nicht wegsehen, wenn du den Esel deines Bruders oder sein Rind auf dem Weg gefallen siehst; du sollst sie vielmehr unbedingt mit ihm zusammen aufrichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: deines Bruders
  rationale: Die wörtliche Wiedergabe bewahrt die familiäre und gemeinschaftliche Ausdrucksweise des deuteronomischen Bundesrechts; gemeint ist hier ein Angehöriger der eigenen Gemeinschaft.
- source_word: חֲמוֹר
  choice: Esel
  rationale: „Esel“ ist die natürliche moderne deutsche Bezeichnung für das genannte Last- und Arbeitstier.
- source_word: שׁוֹרוֹ
  choice: sein Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung, besonders im Zusammenhang mit Nutzvieh. „Rind“ vermeidet die unnötige Festlegung auf einen kastrierten männlichen Ochsen.
- source_word: נֹפְלִים
  choice: gestürzt ist
  rationale: Das Partizip beschreibt die Tiere als zu Fall gekommen beziehungsweise zusammengebrochen. Im Deutschen steht das Verb bei den mit „oder“ verbundenen Einzelsubjekten natürlich im Singular.
- source_word: בַּדֶּרֶךְ
  choice: auf dem Weg
  rationale: Dies ist eine klare und direkte Wiedergabe der Ortsangabe.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: und sie unbeachtet lassen
  rationale: Der Hitpael von עלם bedeutet hier idiomatisch, sich der wahrgenommenen Notlage zu entziehen oder sie absichtlich zu übersehen. „Unbeachtet lassen“ gibt diesen Sinn natürlich wieder.
- source_word: הָקֵם תָּקִים
  choice: du sollst sie vielmehr unbedingt … aufrichten
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Gebot. „Unbedingt“ bildet diese Nachdrücklichkeit ab; „aufrichten“ wahrt das Bild des Hochhelfens der gestürzten Tiere.
- source_word: עִמּוֹ
  choice: mit ihm zusammen
  rationale: Die Formulierung gibt ausdrücklich gemeinsames Handeln mit dem Besitzer an und bleibt näher am Hebräischen als eine bloße Umschreibung mit „ihm helfen“.
theological_decisions:
- issue: Bedeutungsumfang von „Bruder“ im Bundesrecht
  choice: Die konkrete Verwandtschaftsbezeichnung „Bruder“ bleibt im Text erhalten.
  alternative: „Mitglied deines Volkes“, „Landsmann“ oder „Mitmensch“
  rationale: Der Kontext kann auf einen Angehörigen der Bundesgemeinschaft weisen, doch die Übersetzung soll die bewusst familiäre Sprache des Ausgangstextes nicht verflachen oder über ihren unmittelbaren Horizont hinaus verallgemeinern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Rechtssatzton. Die Wiederholung „Du sollst“ und „unbedingt“ bewahren den Nachdruck des hebräischen Gebots, ohne altertümliche Formulierungen zu verwenden.
