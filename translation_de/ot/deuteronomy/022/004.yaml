- from: Du sollst nicht zusehen, wie der Esel deines Bruders oder sein Rind auf dem Weg gestürzt ist, und sie unbeachtet lassen. Du sollst sie vielmehr unbedingt mit ihm zusammen aufrichten.[a]
  to: Du sollst nicht wegsehen, wenn du den Esel deines Bruders oder sein Rind auf dem Weg gefallen siehst; du sollst sie vielmehr unbedingt mit ihm zusammen aufrichten.
  rationale: Die Überarbeitung gibt נֹפְלִים mit der im Deutschen natürlichen Konstruktion „gefallen siehst“ wieder und vermeidet die fehlerhafte beziehungsweise unidiomatische Perfektkonstruktion. „Mit ihm zusammen“ bleibt als direkte Wiedergabe von עִמּוֹ erhalten; deshalb wird kein Fußnotenanker benötigt. Der Nachdruck von הָקֵם תָּקִים wird weiterhin durch „unbedingt“ ausgedrückt.
