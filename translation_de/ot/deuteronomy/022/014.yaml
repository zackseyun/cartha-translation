base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: de
  text: 'und er erhebt gegen sie verleumderische Anschuldigungen[a] und bringt sie in Verruf[b], indem er sagt: »Diese Frau habe ich geheiratet[c]. Als ich mich ihr näherte[d], fand ich bei ihr keine Zeichen der Jungfräulichkeit[e].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung bezeichnet rufschädigende Anschuldigungen; auch: »verleumderische Anklagen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »einen schlechten Namen über sie ausbringt«; das heißt, ihren Ruf schädigt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Diese Frau habe ich genommen«; im Zusammenhang ist gemeint: zur Frau genommen.'
    reason: lexical_alternative
  - marker: d
    text: Eine zurückhaltende hebräische Umschreibung für geschlechtlichen Verkehr.
    reason: lexical_alternative
  - marker: e
    text: 'Wörtlich: »Ich fand bei ihr keine Jungfräulichkeit.« Im Zusammenhang sind Zeichen oder Belege der Jungfräulichkeit gemeint, wie die folgenden Verse zeigen.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: ihr verleumderische Vorwürfe macht
  rationale: Die hebräische Wendung bezeichnet hier belastende, rufschädigende Anschuldigungen. Die Wiedergabe ist im Deutschen idiomatisch und bringt im rechtlichen Zusammenhang den verleumderischen Charakter zum Ausdruck.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: sie in Verruf bringt
  rationale: Die wörtliche Wendung »einen schlechten Namen über sie ausbringen« ist ein Bild für die Schädigung ihres Rufes; »in Verruf bringen« bewahrt dieses Bild in natürlichem Deutsch.
- source_word: הָאִשָּׁה הַזֹּאת
  choice: diese Frau
  rationale: Die demonstrative und distanzierende Ausdrucksweise des Hebräischen bleibt erhalten; »meine Frau« würde diese Nuance abschwächen.
- source_word: לָקַחְתִּי
  choice: habe ich geheiratet
  rationale: לקח bedeutet in diesem Ehekontext »zur Frau nehmen«; »heiraten« gibt den gemeinten Vorgang in modernem Deutsch klar wieder.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: als ich mich ihr näherte
  rationale: Die zurückhaltende hebräische Umschreibung für geschlechtlichen Verkehr wird als Euphemismus bewahrt, ohne sie unnötig zu explizieren.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: fand ich bei ihr keine Zeichen der Jungfräulichkeit
  rationale: Der Plural בְּתוּלִים verweist in diesem Rechtsfall auf feststellbare Zeichen beziehungsweise Belege, wie die folgenden Verse zeigen, nicht nur abstrakt auf den Zustand der Jungfräulichkeit.
