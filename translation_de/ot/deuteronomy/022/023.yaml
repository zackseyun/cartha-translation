base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: de
  text: Wenn eine junge Frau, eine Jungfrau, mit einem Mann verlobt ist[a] und ein anderer Mann sie in der Stadt antrifft und mit ihr schläft,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Mann versprochen“. Das Hebräische bezeichnet eine förmliche, rechtlich bindende Verlobung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Wenn
  rationale: Die Verbindung leitet einen hypothetischen Rechtsfall ein; deutsches „Wenn“ gibt die kasuistische Bedingung natürlich wieder.
- source_word: 'נער (zu lesen: נַעֲרָה)'
  choice: eine junge Frau
  rationale: Gemeint ist eine weibliche Person im heiratsfähigen Alter. „Junge Frau“ ist modern und vermeidet sowohl das altertümliche „Jungfrau/Maid“ als Altersbezeichnung als auch das möglicherweise zu junge „Mädchen“.
- source_word: בְתוּלָה
  choice: eine Jungfrau
  rationale: Der Ausdruck bezeichnet hier ausdrücklich sexuelle Unberührtheit und ist für den Rechtsfall bedeutsam.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: einem Mann rechtsverbindlich versprochen
  rationale: Die hebräische Formulierung meint eine förmliche, rechtlich bindende Verlobung, die stärker ist als das heutige allgemeine Verständnis von „verlobt“.
- source_word: וּמְצָאָהּ אִישׁ
  choice: und ein anderer Mann ihr begegnet
  rationale: מָצָא kann in diesem Zusammenhang natürlich mit „begegnen/antreffen“ wiedergegeben werden. „Anderer“ verdeutlicht kontextgemäß, dass es nicht der Mann ist, dem sie versprochen ist.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die Ortsangabe wird wörtlich bewahrt, da sie für die Fortsetzung des Rechtsfalls wichtig ist.
- source_word: וְשָׁכַב עִמָּהּ
  choice: und mit ihr schläft
  rationale: Die geläufige deutsche Wendung bewahrt den euphemistischen Charakter des Hebräischen und bezeichnet den Geschlechtsverkehr, ohne hier zusätzlich Zwang auszudrücken.
theological_decisions:
- issue: Ob der Geschlechtsverkehr in diesem Vers ausdrücklich als erzwungen bezeichnet werden soll
  choice: Neutral „mit ihr schläft“, ohne „vergewaltigt“ oder „zwingt“ hinzuzufügen
  alternative: „sie vergewaltigt“ / „sie zwingt, mit ihm zu schlafen“
  rationale: Der Wortlaut dieses Verses bezeichnet den Akt nicht ausdrücklich als gewaltsam. Die neutrale Formulierung bewahrt die Spannung des Rechtsfalls und greift den folgenden Versen nicht interpretierend vor.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Satzstruktur bleibt als Einleitung eines Rechtsfalls offen und endet entsprechend mit einem Komma. Der Ausdruck „rechtsverbindlich versprochen“ macht den antiken Rechtsstatus im Haupttext verständlich; die Fußnote nennt die wörtlichere Alternative.
