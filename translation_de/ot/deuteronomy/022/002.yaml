base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: de
  text: Wenn aber dein Bruder nicht in deiner Nähe ist[a] und du ihn nicht kennst[b], sollst du es in dein Haus bringen. Es soll bei dir bleiben, bis dein Bruder danach sucht; dann sollst du es ihm zurückgeben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dein Bruder“ ist hier wahrscheinlich nicht nur ein leiblicher Bruder gemeint, sondern allgemein ein Angehöriger der Bundesgemeinschaft.
    reason: cultural_note
  - marker: b
    text: 'Oder sinngemäß: „und du nicht weißt, wem es gehört“; wörtlich: „und du ihn nicht kennst“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „es ihm zurückbringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten. Im deuteronomischen Gesetz kann sie über einen leiblichen Bruder hinaus einen Angehörigen der Bundesgemeinschaft bezeichnen.
- source_word: קָרוֹב אֵלֶיךָ
  choice: in deiner Nähe ist
  rationale: Die Wendung bezeichnet räumliche Nähe und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: du ihn nicht kennst
  rationale: Das maskuline Objektsuffix bezieht sich grammatisch auf den zuvor genannten Bruder. Im Zusammenhang bedeutet die Aussage, dass der Finder den Eigentümer nicht kennt.
- source_word: וַאֲסַפְתּוֹ
  choice: sollst du das Verlorene ... aufnehmen
  rationale: Das Verb bezeichnet hier das Aufnehmen beziehungsweise Hereinbringen des verlorenen Tieres oder Gegenstands. „Das Verlorene“ macht den aus Vers 1 übernommenen Bezug im Deutschen verständlich, ohne ihn auf eine bestimmte Sache einzuengen.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: in dein Haus
  rationale: Direkte und natürliche Wiedergabe der Zielangabe.
- source_word: וְהָיָה עִמְּךָ
  choice: Es soll bei dir bleiben
  rationale: „Bleiben“ bringt den durch den Zusammenhang gegebenen andauernden Verbleib idiomatisch zum Ausdruck.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: bis dein Bruder danach sucht
  rationale: דרש kann hier „suchen“, „sich erkundigen“ oder „beanspruchen“ bedeuten. „Danach sucht“ bewahrt die naheliegende Bedeutung, ohne den Vorgang enger festzulegen.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: dann sollst du es ihm zurückgeben
  rationale: Der Hifil von שוב bezeichnet das Zurückbringen beziehungsweise Zurückgeben an den Eigentümer; „zurückgeben“ ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Reichweite der Anrede „dein Bruder“
  choice: Die Formulierung „dein Bruder“ wird im Text beibehalten und ihre mögliche gemeinschaftsbezogene Reichweite in einer Fußnote erläutert.
  alternative: „dein israelitischer Mitbürger“ oder „dein Volksgenosse“
  rationale: Die hebräische Verwandtschaftssprache soll nicht eingeebnet werden; zugleich darf sie in diesem Gesetz nicht ohne Weiteres auf biologische Brüder beschränkt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. Die Satzfolge bleibt nahe am Hebräischen; der aus dem vorigen Vers erschlossene Gegenstand wird als „das Verlorene“ ausgedrückt, damit der Vers für sich verständlich bleibt.
