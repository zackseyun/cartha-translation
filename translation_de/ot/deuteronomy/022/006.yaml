  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: de
  text: Wenn dir unterwegs in irgendeinem Baum oder auf dem Boden zufällig ein Vogelnest begegnet[a], mit Jungen oder Eiern, und die Mutter auf den Jungen oder den Eiern sitzt, dann darfst du die Mutter nicht zusammen mit den Jungen nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wenn sich vor dir unterwegs ein Vogelnest findet.“ Das hebräische Verb deutet auf einen zufälligen Fund hin, nicht auf eine gezielte Suche.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Mutter auf den Jungen“. Gemeint ist, dass die Mutter nicht zusammen mit ihrem Nachwuchs genommen werden darf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: Wenn … zufällig … begegnet
  rationale: Die Formulierung leitet einen Rechtsfall ein und gibt zugleich den durch das Nifal von קרא ausgedrückten zufälligen Fund wieder, nicht eine gezielte Suche.
- source_word: קַן צִפּוֹר
  choice: ein Vogelnest
  rationale: Natürliche und genaue deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: dir unterwegs … begegnet
  rationale: Die räumliche Wendung ‚vor dir auf dem Weg‘ wird idiomatisch in den deutschen Satz eingebunden, ohne die Situation einer Begegnung auf dem Weg zu verlieren.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: in irgendeinem Baum oder auf dem Boden
  rationale: כָּל hat hier distributiven Sinn; הָאָרֶץ bezeichnet im konkreten Gegensatz zum Baum den Erdboden.
- source_word: אֶפְרֹחִים
  choice: Jungen
  rationale: Bezeichnet Jungvögel beziehungsweise Nestlinge, ohne deren Entwicklungsstadium unnötig einzugrenzen.
- source_word: וְהָאֵם
  choice: die Mutter
  rationale: Bewahrt die knappe Ausdrucksweise des Hebräischen; aus dem Kontext ist eindeutig, dass die Vogelmutter gemeint ist.
- source_word: רֹבֶצֶת
  choice: sitzt
  rationale: Im Zusammenhang mit einem Vogel auf Jungen oder Eiern ist ‚sitzt‘ natürlich; ‚brütet‘ wäre bei bereits geschlüpften Jungen zu eng.
- source_word: לֹא תִקַּח
  choice: darfst du … nicht nehmen
  rationale: Gibt das rechtliche Verbot in natürlichem modernem Deutsch klar wieder.
- source_word: הָאֵם עַל הַבָּנִים
  choice: die Mutter nicht zusammen mit den Jungen
  rationale: עַל bezeichnet in dieser idiomatischen Verbindung das Nehmen der Mutter samt Nachwuchs; ‚Junge‘ passt zum Vogelkontext besser als das wörtliche ‚Kinder‘.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kasuistische Rechtsform wird mit „Wenn … dann“ deutlich wiedergegeben; die zufällige Art des Fundes bleibt ausdrücklich erhalten.
