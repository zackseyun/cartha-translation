  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: de
  text: 'Dann sollt ihr die beiden zum Tor jener Stadt[a] hinausführen und sie mit Steinen steinigen, sodass sie sterben: die junge Frau, weil sie in der Stadt nicht um Hilfe gerufen hat, und den Mann, weil er die Ehefrau seines Nächsten geschändet hat.[b] So sollst du das Böse aus deiner Mitte entfernen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war in altisraelitischen Städten ein üblicher öffentlicher Ort für Rechtsverhandlungen und Urteile.
    reason: cultural_note
  - marker: b
    text: 'Oder: „erniedrigt“ beziehungsweise „sexuell verletzt“. Das hebräische Verb kann in diesem Zusammenhang eine sexuelle Verletzung samt Demütigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: sollt ihr ... hinausführen
  rationale: Der Hifil von יצא ist kausativ. „Hinausführen“ gibt die angeordnete Überführung beider Beteiligten zum öffentlichen Gerichtsort natürlich wieder.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form bezeichnet ausdrücklich beide zuvor genannten Personen.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: Tor jener Stadt
  rationale: Die Wendung wird knapp und formal wiedergegeben; das Stadttor war zugleich ein öffentlicher Rechts- und Gerichtsort.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: sie mit Steinen steinigen
  rationale: Die ausdrückliche Nennung der Steine bleibt entsprechend dem feierlich-rechtlichen Wortlaut des Hebräischen erhalten.
- source_word: וָמֵתוּ
  choice: sodass sie sterben
  rationale: Die koordinierte Folge bezeichnet hier das Ergebnis der Steinigung. „Sodass“ macht diesen Zusammenhang deutlich, ohne einen eigenständigen Tötungsbefehl hinzuzufügen.
- source_word: הנער
  choice: die junge Frau
  rationale: Die Konsonantenform ist defektiv geschrieben; das feminine Verb צָעֲקָה zeigt eindeutig, dass eine weibliche Person gemeint ist. „Junge Frau“ vermeidet eine unnötig enge Altersfestlegung.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: weil sie in der Stadt nicht um Hilfe gerufen hat
  rationale: עַל דְּבַר führt den genannten Urteilsgrund ein. Im Kontext bezeichnet צעק ein hörbares Rufen um Hilfe; die Übersetzung macht diese pragmatische Bedeutung verständlich.
- source_word: עִנָּה
  choice: geschändet hat
  rationale: Im sexualrechtlichen Zusammenhang bezeichnet ענה eine sexuelle Verletzung, die zugleich Demütigung und Entehrung einschließt. „Geschändet“ bewahrt diese Bedeutungsbreite, ohne den hebräischen Ausdruck auf einen einzelnen modernen Straftatbestand festzulegen.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: die Frau seines Mitmenschen
  rationale: „Mitmensch“ gibt רֵעַ als Angehörigen der sozialen Gemeinschaft wieder; „Frau“ bewahrt hier die Bedeutung „Ehefrau“ im natürlichen deutschen Ausdruck.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: So sollst du das Böse aus deiner Mitte wegschaffen
  rationale: Die wiederkehrende deuteronomische Rechtsformel verlangt die Beseitigung des Bösen aus der Gemeinschaft. „Wegschaffen“ ist verständlich und behält die entschiedene Kraft der Formel.
theological_decisions:
- issue: Begründung des Urteils über die junge Frau
  choice: weil sie in der Stadt nicht um Hilfe gerufen hat
  alternative: weil sie in der Stadt nicht geschrien hat
  rationale: Die Übersetzung gibt die im Vers selbst genannte rechtliche Begründung wieder, ohne daraus weitergehende ethische oder dogmatische Schlussfolgerungen abzuleiten. „Um Hilfe gerufen“ verdeutlicht die kontextuelle Funktion des Schreiens.
- issue: Bedeutung von עִנָּה im sexualrechtlichen Kontext
  choice: geschändet hat
  alternative: erniedrigt hat; sexuell verletzt hat; vergewaltigt hat
  rationale: „Geschändet“ bringt sexuelle Verletzung und Demütigung zum Ausdruck, legt den lexikalisch breiteren Ausdruck aber nicht ohne Not auf den engeren modernen Rechtsbegriff „vergewaltigt“ fest.
- issue: Numeruswechsel in der Schlussformel
  choice: So sollst du ... aus deiner Mitte wegschaffen
  alternative: So sollt ihr ... aus eurer Mitte wegschaffen
  rationale: Das Hebräische wechselt von der Anrede im Plural zum Singular. Dieser auffällige Wechsel wird bewahrt und nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-feierlichem Ton. Der im Hebräischen auffällige Wechsel vom Plural („ihr“) zum Singular („du“) bleibt erhalten. Die Formulierung vermeidet Archaismen und konfessionelle Zusatzdeutungen.
