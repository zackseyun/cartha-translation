  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: de
  text: Du sollst nicht mit einem Rind und einem Esel zusammen pflügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pflüge nicht mit einem Rind und einem Esel zusammen.“'
    reason: Alternative, gleichwertige Wiedergabe der verbietenden Kraft des hebräischen Imperfekts.
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die gewöhnliche Verneinung leitet hier zusammen mit dem Imperfekt ein Verbot ein.
- source_word: תַחֲרֹשׁ
  choice: du sollst … pflügen
  rationale: Das Qal-Imperfekt der 2. Person Singular hat im Gesetzeskontext verbietende Kraft. „Du sollst nicht“ bewahrt den rechtlichen Ton und bleibt im modernen Deutschen verständlich.
- source_word: בְּשׁוֹר
  choice: mit einem Rind
  rationale: שׁוֹר bezeichnet ein Tier aus der Rindergattung und hier ein Zugtier. „Rind“ wahrt die im Hebräischen nicht ausdrücklich festgelegte Geschlechts- beziehungsweise Kastrationsangabe besser als „Ochse“.
- source_word: וּבַחֲמֹר
  choice: und einem Esel
  rationale: חֲמוֹר ist die übliche Bezeichnung für einen Esel; die Verbindung mit בְּ wird im Deutschen parallel durch „mit“ erfasst.
- source_word: יַחְדָּו
  choice: zusammen
  rationale: Das Adverb bezeichnet beide Tiere als gemeinsames Gespann beim Pflügen und wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Rechtscharakter des Verbots
  choice: 'Als direkte gesetzliche Weisung formuliert: „Du sollst nicht …“'
  alternative: 'Imperativisch: „Pflüge nicht …“'
  rationale: Die gewählte Form erhält den Ton der deuteronomischen Gesetzesrede, ohne altertümlich zu wirken. Eine weitergehende theologische Begründung wird nicht in den Vers hineingetragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Gesetzeston. Die Anrede steht entsprechend dem hebräischen Text im Singular. „Rind“ vermeidet die gegenüber שׁוֹר engere Festlegung von „Ochse“.
