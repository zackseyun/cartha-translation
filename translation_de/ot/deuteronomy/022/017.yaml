base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: de
  text: 'Und sieh doch: Er hat verleumderische Anschuldigungen erhoben und behauptet: »Ich habe deine Tochter nicht als Jungfrau vorgefunden.«[a] Doch dies sind die Zeichen[b] der Jungfräulichkeit meiner Tochter. Dann sollen sie das Gewand[c] vor den Ältesten der Stadt ausbreiten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich habe für deine Tochter keine Jungfräulichkeiten gefunden.“ Das Hebräische verwendet hier den Plural „Jungfräulichkeiten“ als idiomatische Wendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beweise“ beziehungsweise „Indizien“ für die Jungfräulichkeit meiner Tochter.'
    reason: lexical_alternative
  - marker: c
    text: Das „Gewand“ bezeichnet hier den Stoff, der in diesem Rechtsfall als Beweismittel vorgelegt wird.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh doch
  rationale: Die aufmerksamkeitslenkende Diskurspartikel wird in natürlichem, heutigem Deutsch wiedergegeben, ohne ihre demonstrative Kraft zu verlieren.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: hat verleumderische Anschuldigungen erhoben
  rationale: Die Wendung bezeichnet das Vorbringen belastender beziehungsweise falscher Beschuldigungen. Die Formulierung wahrt sowohl den rechtlichen als auch den rufschädigenden Aspekt.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Ich habe deine Tochter nicht als Jungfrau vorgefunden
  rationale: Das idiomatische hebräische Pluralwort בְּתוּלִים wird in verständliches Deutsch übertragen; die wörtlichere Ausdrucksweise wird in einer Fußnote dokumentiert.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Doch dies sind die Zeichen der Jungfräulichkeit meiner Tochter
  rationale: בְּתוּלִים bezeichnet hier im forensischen Zusammenhang vorgelegte Zeichen oder Indizien. „Zeichen“ vermeidet die Überaussage, dass das Beweisstück zwingend schlüssig sein müsse.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Dann sollen sie das Gewand ausbreiten
  rationale: Die deutsche Soll-Form gibt die geregelte Verfahrenshandlung wieder. „Gewand“ bewahrt die allgemeine Bedeutung von שִׂמְלָה, ohne den Gegenstand genauer zu bestimmen, als es der Text tut.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: vor den Ältesten der Stadt
  rationale: Die übliche gerichtliche Wendung bezeichnet die Vorlage in Gegenwart der städtischen Autoritäten.
