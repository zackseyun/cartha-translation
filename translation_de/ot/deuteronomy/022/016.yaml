translation:
  language: de
  text: 'Und der Vater der jungen Frau soll zu den Ältesten sagen: »Ich habe meine Tochter diesem Mann zur Frau gegeben, und er hasst sie.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und er hat angefangen, sie zu hassen.« Das hebräische Verb bedeutet schlicht »hassen«; der Zusammenhang kann entweder den gegenwärtigen Zustand oder die Entwicklung zu dieser Haltung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Und ... soll ... sagen
  rationale: Die Verbform steht in einem kasuistischen Rechtsverfahren und bezeichnet den nächsten vorgeschriebenen Handlungsschritt; daher gibt »soll ... sagen« den rechtlich-prozeduralen Sinn besser wieder als eine einfache Vergangenheitsform.
- source_word: אֲבִי הַנַּעַר
  choice: der Vater der jungen Frau
  rationale: Im Zusammenhang ist die Tochter im heiratsfähigen Alter gemeint. »Junge Frau« ist modernes, würdevolles Deutsch und passt besser als das kindlich klingende »Mädchen«; die überlieferte Form ist morphologisch auffällig, doch Kontext und Lesetradition weisen auf die junge Frau.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Gemeint sind die anerkannten kommunalen und richterlichen Autoritäten, nicht lediglich ältere Männer.
- source_word: אֶת בִּתִּי
  choice: meine Tochter
  rationale: אֶת kennzeichnet das direkte Objekt und bleibt im Deutschen unübersetzt; בִּתִּי bedeutet eindeutig »meine Tochter«.
- source_word: נָתַתִּי
  choice: Ich habe ... gegeben
  rationale: נתן bezeichnet hier das Geben der Tochter in die Ehe. Das deutsche Perfekt klingt in direkter Rede natürlich und verweist auf die vorausgegangene Eheschließung.
- source_word: לָאִישׁ הַזֶּה
  choice: diesem Mann
  rationale: אִישׁ bedeutet hier wörtlich »Mann«; seine Rolle als Ehemann wird durch »zur Frau« bereits deutlich.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung »jemandem eine Frau zur Frau geben« bewahrt den ehelichen Beziehungssinn der hebräischen Präpositionalfügung knapp und direkt.
- source_word: וַיִּשְׂנָאֶהָ
  choice: und er hasst sie
  rationale: שׂנא bedeutet schlicht »hassen«. Die Gegenwartsform beschreibt in der direkten Rede seine bestehende Haltung; ein eingetretener Wandel ist kontextuell möglich, wird vom Verb selbst aber nicht ausdrücklich bezeichnet.
