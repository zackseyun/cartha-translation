  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: de
  text: Dann sollen die Ältesten jener Stadt den Mann nehmen und ihn züchtigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn bestrafen« oder »ihn maßregeln«, möglicherweise auch: »ihn auspeitschen«. Das hebräische Verb bezeichnet allgemein Züchtigung oder disziplinierende Zurechtweisung; welche Form sie annimmt, ergibt sich nicht eindeutig aus dem Verb allein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: ergreifen
  rationale: לקח bedeutet grundsätzlich »nehmen«; im rechtlichen Zusammenhang gibt »ergreifen« die amtliche Ingewahrsamnahme natürlich wieder, ohne unnötig starke Gewalt anzudeuten.
- source_word: זִקְנֵי
  choice: die Ältesten
  rationale: זקנים bezeichnet hier die anerkannten kommunalen Amtsträger und nicht lediglich ältere Männer.
- source_word: הָעִיר הַהִוא
  choice: jener Stadt
  rationale: Die Formulierung bewahrt den bestimmten Rückverweis des Demonstrativs und den örtlichen Rechtsrahmen.
- source_word: הָאִישׁ
  choice: den Mann
  rationale: איש bezeichnet den in den vorangehenden Versen genannten Ehemann; »den Mann« bleibt jedoch näher am ausdrücklichen hebräischen Wortlaut.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: und ihn bestrafen
  rationale: יסר umfasst zurechtweisen, züchtigen und disziplinarisch bestrafen. Im gerichtlichen Kontext ist »bestrafen« im modernen Deutsch natürlich, legt die genaue Form der Sanktion aber nicht fest.
