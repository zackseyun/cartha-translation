  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: de
  text: Wenn diese Sache aber wahr ist und bei der jungen Frau keine Zeichen ihrer Jungfräulichkeit gefunden wurden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort בְּתוּלִים ist eine Pluralform und kann in diesem Zusammenhang Jungfräulichkeit oder Zeichen beziehungsweise Nachweise der Jungfräulichkeit bezeichnen; es steht im Rahmen eines alten Rechtsbrauchs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung aus Konjunktion und Konditionalpartikel leitet einen Gegensatz zum vorhergehenden Fall ein; die deutsche Nachstellung von „aber“ klingt natürlich.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: sich diese Sache … als wahr erweist
  rationale: Die Formulierung gibt die prädikative Aussage „diese Sache war/ist wahr“ in gegenwärtigem, rechtlichem Deutsch wieder, ohne „Sache“ vorschnell auf „Anklage“ einzuengen.
- source_word: לֹא נִמְצְאוּ בְתוּלִים
  choice: kein Nachweis ihrer Jungfräulichkeit gefunden wurde
  rationale: בְּתוּלִים ist morphologisch plural, bezeichnet im Zusammenhang jedoch den erwarteten Nachweis beziehungsweise die Zeichen der Jungfräulichkeit. „Nachweis“ ist verständlich und wahrt den rechtlichen Kontext.
- source_word: לַנַּעֲרָ
  choice: bei der jungen Frau
  rationale: נַעֲרָה bezeichnet hier eine junge Frau im heiratsfähigen Alter. Das ל wird idiomatisch als „bei“ wiedergegeben, da es darum geht, ob der betreffende Nachweis in ihrem Fall vorliegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-sachlichem Ton. Der Satz bleibt wie im Hebräischen und im Kontext syntaktisch offen, da die Folge im nächsten Vers genannt wird.
