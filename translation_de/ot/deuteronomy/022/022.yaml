base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: de
  text: 'Wenn ein Mann angetroffen wird, während er bei einer verheirateten Frau[a] liegt, sollen beide sterben: der Mann, der bei der Frau liegt, und die Frau.[b] So sollst du das Böse aus Israel entfernen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „eine Frau, die einen Ehemann hat“; gemeint ist eine durch Ehe an einen Mann gebundene Frau.'
    reason: lexical_alternative
  - marker: b
    text: '„Sollen sterben“ bezeichnet hier die gesetzlich vorgeschriebene Todesstrafe; verdeutlichend kann man übersetzen: „sollen getötet werden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: dabei angetroffen wird
  rationale: Der Niphal von מצא bezeichnet hier im rechtlichen Zusammenhang das Entdeckt- beziehungsweise Angetroffenwerden; die Formulierung gibt diesen passiven Sinn natürlich wieder.
- source_word: שֹׁכֵב עִם
  choice: bei … liegt
  rationale: Die Wendung bezeichnet Geschlechtsverkehr. „Bei einer Frau liegen“ bewahrt das hebräische Bild und den ernsten Rechtston, ohne in eine umgangssprachliche Ausdrucksweise zu wechseln.
- source_word: בְעֻלַת בַּעַל
  choice: verheirateten Frau
  rationale: Die knappe deutsche Formulierung gibt den entscheidenden Sinn, die bestehende eheliche Bindung, natürlich wieder. Die wörtlichere Struktur wird in der Fußnote offengelegt.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: sollen beide sterben
  rationale: Im Gesetzeskontext bezeichnet die Form die vorgeschriebene Todesstrafe. „Sollen sterben“ bleibt nahe am Wortlaut, ohne die im Hebräischen nicht ausdrücklich formulierte Passivkonstruktion „getötet werden“ in den Haupttext einzutragen.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: der Mann, der bei der Frau lag
  rationale: Der Relativsatz klingt im Deutschen natürlich und behält zugleich die wiederholte rechtliche Bestimmung des Mannes als Sexualpartner der Frau bei.
- source_word: וְהָאִשָּׁה
  choice: und die Frau
  rationale: Die ausdrückliche Wiederholung des Hebräischen wird zur rechtlichen Klarheit und zur Wiedergabe der im Gesetz formulierten gemeinsamen Verantwortlichkeit beibehalten.
- source_word: וּבִעַרְתָּ
  choice: So sollst du … wegschaffen
  rationale: בער bezeichnet in der wiederkehrenden deuteronomischen Rechtsformel das entschiedene Entfernen des Bösen aus der Gemeinschaft. „Wegschaffen“ ist verständlich und bewahrt die aktive, nachdrückliche Aussage.
- source_word: הָרָע
  choice: das Böse
  rationale: Der substantivierte Ausdruck gibt das abstrakte Singularwort und den moralisch-rechtlichen Ernst der deuteronomischen Formel wieder.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition bezeichnet die Entfernung aus dem Bundesvolk; die knappe Wiedergabe entspricht der hebräischen Form.
theological_decisions:
- issue: Wiedergabe der ehelichen Statusbezeichnung בְעֻלַת בַּעַל
  choice: verheiratete Frau
  alternative: eine Frau, die einen Ehemann hat / einem Ehemann verbundene Frau
  rationale: Die Übersetzung stellt die bestehende Ehebindung klar heraus, ohne eine Besitzvorstellung in den deutschen Haupttext einzutragen. Die ungewöhnliche wörtliche Struktur bleibt durch die Fußnote sichtbar.
- issue: Ausdrückliche Bezeichnung der Strafe als Hinrichtung
  choice: sollen beide sterben
  alternative: sollen beide getötet werden / müssen beide hingerichtet werden
  rationale: Der rechtliche Zusammenhang schreibt die Todesstrafe vor, doch der hebräische Wortlaut verwendet das Verb „sterben“ und keine ausdrückliche kausative oder passive Hinrichtungsform. Diese Spannung wird im Haupttext bewahrt und in der Fußnote erklärt.
translation_notes:
  register: Moderner, würdevoller Rechtston. Die Formulierung „bei einer Frau liegen“ bewahrt bewusst das hebräische Bild für den Geschlechtsverkehr; die Rechtsfolge bleibt eng am Wortlaut, während die Fußnoten notwendige lexikalische und rechtliche Erläuterungen geben.
