source:
  edition: WLC
  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: de
  text: Dann soll der Mann, der mit ihr geschlafen hat, dem Vater der jungen Frau fünfzig Schekel Silber geben, und sie soll seine Frau werden, weil er sie geschändet hat.[a] Er darf sie sein Leben lang nicht entlassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „weil er sie erniedrigt/gedemütigt hat“. Das hebräische Verb bezeichnet hier eine erniedrigende sexuelle Verletzung.'
    reason: lexical_alternative
  - marker: b
    text: „Entlassen“ meint hier, sie fortzuschicken beziehungsweise sich von ihr scheiden zu lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Dann soll … geben
  rationale: Das mit Waw angeschlossene Perfekt führt in diesem Rechtssatz die vorgeschriebene Folge weiter. „Dann“ verdeutlicht den Ablauf, während „soll“ den verpflichtenden Charakter wiedergibt.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: der Mann, der mit ihr geschlafen hat
  rationale: Die partizipiale Fügung bezeichnet den Mann durch den sexuellen Akt. „Mit ihr geschlafen“ ist im heutigen Deutsch klarer und natürlicher als das wörtlichere, aber altertümliche „bei ihr gelegen“.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: dem Vater der jungen Frau
  rationale: נַעֲרָה bezeichnet hier eine junge Frau im heiratsfähigen Alter. „Junge Frau“ wahrt diese Alters- und Statusangabe, ohne sie unnötig als Kind erscheinen zu lassen.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: fünfzig Schekel Silber
  rationale: Wörtlich steht „fünfzig Silber“; im rechtlich-wirtschaftlichen Zusammenhang ist eine Gewichtseinheit gemeint. „Schekel Silber“ ist die übliche präzise Wiedergabe.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: und sie soll seine Frau werden
  rationale: Die Wendung bezeichnet den daraus folgenden Ehestand. Diese Formulierung gibt den Zukunfts- und Verpflichtungscharakter wieder, ohne ein über den ehelichen Zusammenhang hinausgehendes Besitzverhältnis auszudrücken.
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Fügung nennt in diesem Rechtssatz den Grund für die angeordnete Folge; „weil“ ist die klare und natürliche deutsche Entsprechung.
- source_word: עִנָּהּ
  choice: sie geschändet hat
  rationale: Das Piel von ענה bezeichnet hier eine erniedrigende sexuelle Verletzung. „Geschändet“ macht die Schwere deutlich, ohne die im unmittelbaren Ausdruck nicht ausdrücklich bezeichnete Art des Zwangs weiter festzulegen.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Er darf sie … nicht entlassen
  rationale: Wörtlich heißt es, er könne sie nicht fortschicken. Im ehelichen Rechtszusammenhang ist ihre Entlassung beziehungsweise Scheidung gemeint; „darf … nicht entlassen“ bewahrt sowohl das Verbot als auch die Bildlichkeit des Ausgangstextes.
- source_word: כָּל יָמָיו
  choice: sein Leben lang
  rationale: Die hebräische Wendung „alle seine Tage“ bezeichnet eine lebenslange Dauer. Die deutsche idiomatische Formulierung vermittelt dies unmittelbar.
theological_decisions:
- issue: Wiedergabe von עִנָּהּ, ohne die sexuelle Gewalttat abzuschwächen oder den Wortlaut unnötig zu präzisieren
  choice: weil er sie geschändet hat
  alternative: weil er sie erniedrigt/gedemütigt hat; weil er sie vergewaltigt hat
  rationale: „Erniedrigt“ oder „gedemütigt“ wäre im heutigen Deutsch für diesen sexuellen Rechtskontext zu unbestimmt und könnte die Schwere verharmlosen. „Vergewaltigt“ kann sich aus dem größeren Zusammenhang nahelegen, legt den einzelnen Ausdruck jedoch stärker fest. „Geschändet“ wahrt die erniedrigende und sexuelle Dimension sowie die verbleibende lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Satzführung. „Mit ihr geschlafen“ vermeidet die altertümliche Wendung „bei ihr gelegen“, während „geschändet“ die Schwere des Vorgangs ausdrückt. Die lebenslange Dauer wird idiomatisch als „sein Leben lang“ wiedergegeben.
