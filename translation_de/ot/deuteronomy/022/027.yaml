  text: כִּ֥י בַ/שָּׂדֶ֖ה מְצָאָ֑/הּ צָעֲקָ֗ה ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/אֵ֥ין מוֹשִׁ֖יעַ לָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: de
  text: Denn er traf sie auf dem Feld[a] an; die verlobte junge Frau schrie, aber niemand war da, der sie rettete[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im offenen Land“. Die hebräische Wendung bezeichnet hier eine ländliche, abgelegene Umgebung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der sie befreite“. Gemeint ist die Rettung aus der unmittelbaren Gefahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die unmittelbar vorausgehende rechtliche Beurteilung; „denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: בַשָּׂדֶה
  choice: auf dem Feld
  rationale: Die Wendung bezeichnet einen offenen, ländlichen und möglicherweise abgelegenen Ort. „Auf dem Feld“ ist quellenah und im Deutschen verständlich; die räumliche Tragweite wird in der Fußnote erläutert.
- source_word: מְצָאָהּ
  choice: er traf sie … an
  rationale: מצא bedeutet grundsätzlich „finden“, kann bei Personen in diesem Zusammenhang jedoch natürlich als „antreffen“ wiedergegeben werden. Die Formulierung vermeidet den im Deutschen möglichen Beiklang, sie sei gesucht worden.
- source_word: צָעֲקָה
  choice: schrie
  rationale: צעק bezeichnet einen lauten Not- oder Hilferuf. „Schrie“ bewahrt die Dringlichkeit, ohne den nicht ausdrücklich genannten Inhalt des Rufes in den Haupttext einzutragen.
- source_word: הַנַּעַר
  choice: die junge Frau
  rationale: Obwohl die überlieferte Konsonantenschreibung formal mehrdeutig wirkt, weisen Kontext, Artikelverbindung und die weibliche Referenz eindeutig auf eine junge Frau. Die moderne deutsche Wiedergabe ist geschlechtsgenau und nicht altertümlich.
- source_word: הַמְאֹרָשָׂה
  choice: verlobte
  rationale: Das Partizip bezeichnet eine rechtsverbindlich zur Ehe versprochene Frau. „Verlobte“ ist die natürliche moderne deutsche Entsprechung, auch wenn die damalige Verlobung rechtlich bindender war als viele heutige Verlobungen.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: aber niemand war da, der sie rettete
  rationale: Die Klausel stellt fest, dass kein Retter verfügbar war. „Aber“ bildet den sachlichen Gegensatz zu ihrem Schrei ab; „rettete“ bezeichnet hier konkret die Befreiung aus der Gefahr.
theological_decisions:
- issue: Rechtlicher Status von הַמְאֹרָשָׂה
  choice: verlobte
  alternative: zur Ehe versprochene
  rationale: Die Übersetzung hält den rechtlich bedeutsamen Ehestatus fest, ohne spätere konfessionelle Vorstellungen einzutragen. Die nähere Tragweite ergibt sich aus dem Gesetzeskontext.
- issue: Geschlechtsbezogene Wiedergabe von הַנַּעַר
  choice: junge Frau
  alternative: Mädchen
  rationale: Der Kontext identifiziert die betroffene Person eindeutig als weiblich. „Junge Frau“ ist würdig und modern und legt ihr genaues Alter nicht unnötig fest.
- issue: Bedeutung von מוֹשִׁיעַ im unmittelbaren Kontext
  choice: der sie rettete
  alternative: der ihr half
  rationale: Das Wort bezeichnet hier einen Menschen, der sie aus einer konkreten Gewaltsituation befreit hätte. „Rettete“ bewahrt die Stärke des hebräischen Ausdrucks, ohne ihm eine darüber hinausgehende heilsgeschichtliche Aussage aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Begründungsgang, während „traf … an“ idiomatischer als ein missverständliches „fand“ ist. Der Notruf wird nicht zu „schrie um Hilfe“ erweitert, da der Inhalt im Hebräischen nur durch den Kontext erschlossen wird.
