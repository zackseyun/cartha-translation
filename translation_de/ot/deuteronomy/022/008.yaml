  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: de
  text: Wenn du ein neues Haus baust, sollst du auf deinem Dach eine Brüstung[a] anbringen, damit du nicht Blutschuld auf dein Haus lädst, falls jemand davon herunterfällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geländer“ beziehungsweise „Schutzgeländer“. Das hebräische Wort bezeichnet eine schützende Einfassung am Rand eines Flachdachs.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion leitet hier den Fall eines kasuistischen Gesetzes ein. „Wenn“ gibt diese rechtliche Fallsituation im Deutschen natürlich wieder.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: du ein neues Haus baust
  rationale: Die Formulierung gibt Verb, Objekt und Adjektiv direkt und idiomatisch wieder.
- source_word: וְעָשִׂיתָ
  choice: sollst du … anbringen
  rationale: Die Verbform hat im gesetzlichen Zusammenhang gebietende Kraft. „Sollst“ bewahrt den verbindlichen Ton; „anbringen“ passt im Deutschen natürlich zur Errichtung einer Brüstung.
- source_word: מַעֲקֶה
  choice: Brüstung
  rationale: Das Wort bezeichnet eine schützende Einfassung am Rand eines Flachdachs. „Brüstung“ ist präzise und im modernen Standarddeutsch verständlich; weitere mögliche Bezeichnungen stehen in der Fußnote.
- source_word: לְגַגֶּךָ
  choice: auf deinem Dach
  rationale: Die Wiedergabe benennt den Ort, an dem die Schutzvorrichtung anzubringen ist, im Deutschen klar und natürlich.
- source_word: וְלֹא תָשִׂים דָּמִים
  choice: damit du nicht Blutschuld … bringst
  rationale: Der hebräische Ausdruck „Blut setzen/legen“ bezeichnet hier das Herbeiführen rechtlicher und moralischer Verantwortung für einen vermeidbaren Todesfall. Die Zweckkonstruktion macht den Zusammenhang mit dem Gebot deutlich.
- source_word: בְּבֵיתֶךָ
  choice: auf dein Haus
  rationale: Die Schuld wird bildlich mit dem Haus beziehungsweise dem Verantwortungsbereich seines Besitzers verbunden. Die ungewöhnliche, aber verständliche Formulierung wahrt dieses Bild.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: falls jemand … herunterfällt
  rationale: Die hebräische Verbindung bezeichnet unbestimmt eine Person, die möglicherweise stürzt. „Falls jemand“ gibt diese Bedingung ohne die im Deutschen unbeholfene Wiederholung „der Fallende fällt“ wieder.
- source_word: מִמֶּנּוּ
  choice: davon
  rationale: Das Pronomen verweist auf das zuvor genannte Bauwerk beziehungsweise Dach. „Davon“ bewahrt die knappe Bezugnahme, ohne den möglichen Bezug unnötig festzulegen.
theological_decisions:
- issue: Bedeutung von דָּמִים im Rechtszusammenhang
  choice: Blutschuld
  alternative: Blutvergießen; Schuld an vergossenem Blut
  rationale: Der Vers behandelt die rechtliche und moralische Verantwortung für einen durch mangelnde Vorsorge vermeidbaren Tod. „Blutschuld“ bewahrt diese Bedeutung, ohne darüber hinausgehende Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die konkrete antike Situation eines begehbaren Flachdachs bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei dem erläuterten Begriff.
