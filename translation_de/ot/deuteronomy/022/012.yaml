  text: גְּדִלִ֖ים תַּעֲשֶׂה לָּ֑/ךְ עַל אַרְבַּ֛ע כַּנְפ֥וֹת כְּסוּתְ/ךָ֖ אֲשֶׁ֥ר תְּכַסֶּה בָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: de
  text: Du sollst dir Quasten[a] an den vier Zipfeln deines Gewandes[b] machen, mit dem du dich bedeckst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gedrehte Schnüre“ oder „Fransen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „deiner Bedeckung“; auch „deines Mantels“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: Quasten
  rationale: Das Substantiv bezeichnet hier herabhängende, wohl aus gedrehten Fäden bestehende Anhänge an einem Kleidungsstück. „Quasten“ ist im heutigen Deutsch klar und passt zum Sachzusammenhang, ohne die genaue Form stärker festzulegen als der hebräische Ausdruck.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: du sollst dir … machen
  rationale: Das Qal-Imperfekt hat im Gesetzeskontext gebietenden Sinn. Das Dativpronomen „dir“ gibt לָּךְ knapp und idiomatisch wieder.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: an den vier Zipfeln
  rationale: כָּנָף kann „Flügel“, „Rand“ oder „äußerstes Ende“ bedeuten. Bei einem Gewand bezeichnet es dessen herabhängende Ecken beziehungsweise Zipfel; „Zipfel“ ist im Deutschen für diesen Zusammenhang natürlich und anschaulich.
- source_word: כְּסוּתְךָ
  choice: deines Gewandes
  rationale: כְּסוּת bezeichnet etwas, womit man sich bedeckt, häufig ein Kleidungsstück oder einen Mantel. „Gewand“ ist verständlich und lässt die genaue Art des Kleidungsstücks offen.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: mit dem du dich bedeckst
  rationale: Die Relativkonstruktion beschreibt den Gebrauch des Gewandes. „Sich bedecken“ bewahrt die Bedeutung von כסה und vermeidet die zusätzliche Vorstellung des Einhüllens oder Wickelns.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Gesetzessprache mit direkter Anrede. „Gewand“ vermeidet das im Deutschen unnatürliche „Bedeckung“, während die Fußnote die formnähere Wiedergabe festhält. Die Satzstellung bleibt flüssig und bewahrt den abschließenden Relativsatz des Hebräischen.
