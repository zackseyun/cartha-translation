base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: de
  text: Ebenso sollst du mit seinem Esel verfahren, ebenso mit seinem Mantel; ebenso sollst du mit jedem verlorenen Gegenstand deines Bruders verfahren, der ihm abhandengekommen ist und den du findest. Du darfst darüber nicht hinwegsehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du kannst dich nicht verbergen“; gemeint ist: Du darfst nicht so tun, als würdest du es nicht bemerken.'
    reason: Bewahrt die konkrete reflexive Bildsprache von לְהִתְעַלֵּם und erläutert ihre rechtliche Funktion.
lexical_decisions:
- source_word: וְכֵן
  choice: Ebenso
  rationale: Gibt den fortführenden Anschluss an den vorherigen Vers und die dreifache Wiederholung der Rechtsanweisung natürlich und prägnant wieder.
- source_word: תַּעֲשֶׂה
  choice: sollst du es … machen
  rationale: Das Imperfekt hat im Rechtskontext anweisende Kraft. „Sollst“ wahrt den verbindlichen Ton, ohne unnötig archaisch zu wirken.
- source_word: לַחֲמֹרוֹ
  choice: mit seinem Esel
  rationale: Bezieht sich auf das verlorene Tier des Bruders im vorherigen Kontext; „mit“ entspricht hier natürlichem deutschem Sprachgebrauch.
- source_word: לְשִׂמְלָתוֹ
  choice: mit seinem Mantel
  rationale: שִׂמְלָה bezeichnet häufig ein Obergewand beziehungsweise einen Mantel. „Mantel“ ist anschaulich und im Kontext verlorenen Eigentums gut verständlich.
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: mit allem, was dein Bruder verliert
  rationale: Die Wendung weitet die Vorschrift auf jeden verlorenen Gegenstand aus. Die deutsche Relativkonstruktion ist natürlich; das maskuline Verwandtschaftswort „Bruder“ bleibt erhalten.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: was dein Bruder verliert
  rationale: Natürliches Deutsch für das vom Bruder Abhandengekommene. Die hebräische Form legt die handelnde Ursache des Verlusts nicht fest; „verlieren“ ist hier nicht als absichtliches Handeln zu verstehen.
- source_word: וּמְצָאתָהּ
  choice: und du findest
  rationale: Gibt die anschließende Handlung direkt und idiomatisch wieder; das Objekt ist durch „was“ bereits ausgedrückt.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: Du darfst dich dem nicht entziehen
  rationale: 'Erfasst sowohl die rechtliche Verbotskraft von לֹא תוּכַל als auch die reflexive Bedeutung von לְהִתְעַלֵּם: sich der Wahrnehmung beziehungsweise Verantwortung zu entziehen. Die wörtlichere Bildsprache wird in der Fußnote bewahrt.'
theological_decisions:
- issue: Bedeutung von אָחִיךָ im bundesrechtlichen Zusammenhang
  choice: dein Bruder
  alternative: dein israelitischer Mitbruder / dein Volksgenosse
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Verwandtschaftswort. Die Übersetzung bewahrt diese soziale und bundestheologische Bezeichnung, statt sie im Haupttext zu verallgemeinern.
- issue: Rechtliche Kraft und Bildsprache von לֹא תוּכַל לְהִתְעַלֵּם
  choice: Du darfst dich dem nicht entziehen
  alternative: Du kannst dich nicht verbergen / Du darfst nicht so tun, als würdest du es nicht bemerken
  rationale: Im Rechtskontext bezeichnet die Wendung keine bloße Unfähigkeit, sondern ein Verbot, sich der Verantwortung zu entziehen. Die gewählte Formulierung bewahrt zugleich mehr von der reflexiven Bildlichkeit als das schlichte „ignorieren“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarem Gesetzeston. Die dreifache Wiederholung von „ebenso“ erhält die rhetorische Struktur des Hebräischen; der letzte Satz formuliert die Verpflichtung idiomatisch, ohne die zugrunde liegende Bildsprache völlig aufzulösen.
