base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: de
  text: Wenn aber ein Mann auf freiem Feld eine verlobte junge Frau antrifft, sie ergreift[a] und bei ihr liegt, dann soll nur der Mann sterben, der bei ihr gelegen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie überwältigt“ oder „sie vergewaltigt“. Das Hebräische lautet wörtlich „sie ergreift“; der Zusammenhang des Gesetzes macht deutlich, dass die Handlung nicht einvernehmlich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Die Wendung leitet einen bedingten Kontrast zum vorherigen Rechtsfall ein; „Wenn aber“ gibt beides natürlich wieder.
- source_word: בַּשָּׂדֶה
  choice: auf dem freien Feld
  rationale: שָׂדֶה bedeutet „Feld“; „freies Feld“ verdeutlicht den für den Rechtsfall wesentlichen ungeschützten Ort, ohne die Aussage auf „Land“ oder „Wildnis“ auszuweiten.
- source_word: יִמְצָא
  choice: antrifft
  rationale: מצא heißt grundsätzlich „finden“; im beschriebenen Zusammentreffen klingt „antrifft“ im modernen deutschen Rechtssatz natürlicher.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: die junge Frau, die verlobt ist
  rationale: Die Wiedergabe wahrt die relative Bestimmung und bezeichnet eine junge weibliche Person, ohne sie als Kind erscheinen zu lassen. „Verlobt“ ist im Deutschen verständlich, auch wenn die damalige Bindung rechtlich stärker war als eine heutige Verlobung.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: sie mit Gewalt festhält
  rationale: Der Hifil von חזק mit ב bezeichnet ein gewaltsames Ergreifen bzw. Überwältigen. „Mit Gewalt festhält“ bewahrt die konkrete Handlung und macht ihren Zwangscharakter im Deutschen unmissverständlich, ohne unmittelbar das weitergehende Deutungswort „vergewaltigt“ einzusetzen.
- source_word: וְשָׁכַב עִמָּהּ
  choice: bei ihr liegt
  rationale: Die traditionelle, würdevolle deutsche Wendung bildet den hebräischen Ausdruck für Geschlechtsverkehr eng nach.
- source_word: וּמֵת
  choice: dann soll ... sterben
  rationale: Im Rechtstext bezeichnet die Form die vorgeschriebene Folge. „Soll sterben“ wahrt den normativen Ton.
- source_word: לְבַדּוֹ
  choice: nur der Mann
  rationale: לבדו schließt die junge Frau von der Todesstrafe aus; die Voranstellung von „nur“ bringt diese Exklusivität im Deutschen klar zum Ausdruck.
theological_decisions:
- issue: Ob die sexuelle Gewalt im Haupttext ausdrücklich als Vergewaltigung bezeichnet werden soll
  choice: Die körperliche Nötigung wird mit „sie mit Gewalt festhält“ ausdrücklich wiedergegeben, während für den Geschlechtsakt die quellennähere Wendung „bei ihr liegt“ bleibt.
  alternative: „sie vergewaltigt“ oder „sie überwältigt und mit ihr schläft“
  rationale: Der Zusammenhang beschreibt eindeutig eine nicht einvernehmliche Tat, doch חזק selbst bedeutet ergreifen, festhalten oder überwältigen und ist kein eigenständiges Verb für „vergewaltigen“. Die gewählte Formulierung macht den Zwang deutlich und bleibt zugleich lexikalisch transparent.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit rechtssatzartiger Klarheit. Die Wiederholung von „der Mann“ folgt der ausdrücklichen Subjektsetzung des Hebräischen; die Satzstellung wurde für natürliches Deutsch leicht gestrafft.
