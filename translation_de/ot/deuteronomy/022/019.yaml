base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: de
  text: Dann sollen sie ihm eine Geldstrafe von hundert Schekel Silber auferlegen und die hundert Schekel Silber dem Vater der jungen Frau geben, denn er hat eine Jungfrau Israels in Verruf gebracht. Sie soll seine Frau bleiben; er darf sie sein Leben lang nicht wegschicken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er darf sich sein Leben lang nicht von ihr scheiden lassen.« Das Hebräische sagt wörtlich: »Er kann sie nicht wegschicken alle seine Tage.«'
    reason: Lexikalische Alternative und Erläuterung der ehegesetzlichen Wendung.
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: sie sollen ihm eine Geldstrafe auferlegen
  rationale: Im rechtlichen Zusammenhang bezeichnet das Verb die Verhängung einer Geldbuße; die Formulierung macht den finanziellen Charakter ausdrücklich und klingt im modernen Deutschen natürlich.
- source_word: מֵאָה כֶסֶף
  choice: hundert Schekel Silber
  rationale: Hebräisch steht elliptisch »hundert Silber«. Im Rechts- und Wirtschaftsgebrauch ist eine Gewichtsmenge gemeint; »Schekel« ergänzt die konventionell vorausgesetzte Einheit.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: dem Vater der jungen Frau
  rationale: נַעֲרָה bezeichnet hier eine junge Frau im heiratsfähigen Alter. Die Wiedergabe ist modern und vermeidet das altertümliche »Jungfrau« als bloße Altersbezeichnung.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: denn er hat … in Verruf gebracht
  rationale: Die hebräische Wendung bedeutet wörtlich, einen schlechten Namen hervorzubringen. »In Verruf bringen« bewahrt das Bild der Rufschädigung und ist idiomatisches Deutsch.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: eine Jungfrau Israels
  rationale: בְּתוּלָה bezeichnet im Zusammenhang der Anschuldigung eine Jungfrau. Der Genitiv »Israels« bewahrt die Einordnung in die Bundesgemeinschaft.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Sie soll seine Frau bleiben
  rationale: Wörtlich heißt es, sie solle ihm zur Frau sein. Da sie nach dem Kontext bereits seine Frau ist, gibt »bleiben« die rechtliche Folge im Deutschen klar wieder, ohne einen neuen Eheschluss anzudeuten.
- source_word: לֹא יוּכַל
  choice: er darf … nicht
  rationale: Die Konstruktion drückt im Gesetzestext rechtliches Unvermögen beziehungsweise ein Verbot aus, nicht bloß fehlende körperliche Fähigkeit.
- source_word: לְשַׁלְּחָהּ
  choice: sie entlassen
  rationale: Das Verb bedeutet wörtlich »wegschicken« und dient im Eherecht als Ausdruck für die Entlassung aus der Ehe. »Entlassen« hält die rechtliche Bildsprache fest; die eindeutige Deutung »sich von ihr scheiden lassen« wird in der Fußnote genannt.
- source_word: כָּל יָמָיו
  choice: sein Leben lang
  rationale: Die hebräische Wendung »alle seine Tage« bezeichnet lebenslange Dauer; »sein Leben lang« ist die natürliche moderne deutsche Entsprechung.
theological_decisions:
- issue: Rechtsformel für die Auflösung der Ehe
  choice: nicht entlassen
  alternative: sich nicht von ihr scheiden lassen
  rationale: Das hebräische Verb bedeutet grundsätzlich »wegschicken«, kann in diesem ehegesetzlichen Zusammenhang jedoch die Scheidung bezeichnen. Der Haupttext bewahrt mit »entlassen« die Ausdrucksweise, während die Fußnote die rechtliche Bedeutung verdeutlicht.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil. Die Satzfolge bleibt eng am Hebräischen; rechtliche Formulierungen werden verständlich wiedergegeben. »Jungfrau Israels« erhält die gemeinschaftsbezogene Ausdrucksweise des Ausgangstextes.
