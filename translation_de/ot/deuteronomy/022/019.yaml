  naturalness: Der Gesetzesstil ist insgesamt klar und modern. Die explizite Wiederholung von »die hundert Schekel Silber« macht die Zahlung syntaktisch klarer als das an »Geldstrafe« rückverweisende Pronomen. »Wegschicken« ist hier verständlicher als »entlassen« und passt zugleich zur bewusst wörtlichen Wiedergabe.
  terminology: »Junge Frau«, »Jungfrau Israels«, »Schekel Silber« und »in Verruf gebracht« sind angemessen. Die Formulierung »Sie soll seine Frau bleiben« gibt die rechtliche Folge im Kontext verständlich wieder. Die Fußnote dokumentiert sachgerecht, dass die Wendung im Eherecht Scheidung bezeichnen kann, ohne die Hauptübersetzung darauf zu verengen.
