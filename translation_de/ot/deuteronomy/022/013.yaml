  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: de
  text: Wenn ein Mann eine Frau heiratet, mit ihr Geschlechtsverkehr hat[a] und sie danach hasst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihr hineingeht“. Die hebräische Wendung ist ein verhüllender Ausdruck für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den Fall eines kasuistischen Gesetzes ein; „wenn“ kennzeichnet im Deutschen natürlich den Bedingungssatz.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ein Mann eine Frau heiratet
  rationale: לקח bedeutet wörtlich „nehmen“, bezeichnet in dieser Verbindung jedoch die Eheschließung. „Eine Frau heiraten“ gibt den Sinn im heutigen Deutsch klar und natürlich wieder; „sich eine Frau nehmen“ wäre formnäher, klingt aber weniger gegenwärtig.
- source_word: וּבָא אֵלֶיהָ
  choice: mit ihr verkehrt
  rationale: Die hebräische Wendung „zu ihr hineingehen“ ist ein verhüllender Ausdruck für Geschlechtsverkehr. „Mit ihr verkehren“ bewahrt einen zurückhaltenden, würdigen Ton, ohne die Bedeutung zu verschleiern.
- source_word: וּשְׂנֵאָהּ
  choice: und sie dann hasst
  rationale: שׂנא bedeutet „hassen“. „Dann“ verdeutlicht knapp die Abfolge der Handlungen, die durch die verbundenen Verbformen ausgedrückt wird.
