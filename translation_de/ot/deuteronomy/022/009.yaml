  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: de
  text: Du sollst deinen Weinberg nicht mit zweierlei Saat besäen, damit nicht das Ganze heilig wird[a] – die Saat, die du aussäst, und der Ertrag des Weinbergs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »damit nicht das Ganze heilig wird«. Gemeint ist, dass Saat und Weinbergsertrag dem gewöhnlichen Gebrauch entzogen werden.'
    reason: Bewahrt die wörtliche sakrale Bedeutung von קדש und erläutert die rechtliche Folge im Kontext, ohne deren genaue institutionelle Ausgestaltung festzulegen.
lexical_decisions:
- source_word: לֹא תִזְרַע
  choice: Du sollst … nicht … besäen
  rationale: Das Verbot wird in natürlichem deutschem Gesetzesstil wiedergegeben; זרע bezeichnet hier das Aussäen von Saatgut.
- source_word: כַּרְמְךָ
  choice: deinen Weinberg
  rationale: כרם ist die übliche Bezeichnung für einen Weinberg.
- source_word: כִּלְאָיִם
  choice: mit zweierlei Saat
  rationale: כלאים bezeichnet eine verbotene Mischung verschiedener Arten. »Zweierlei Saat« ist knapp, verständlich und wahrt den Bezug auf unterschiedliche Arten, ohne eine genaue Zahl botanischer Sorten überzubetonen.
- source_word: פֶּן
  choice: Sonst
  rationale: פן leitet die zu vermeidende Folge ein; »sonst« klingt im modernen deutschen Gesetzesstil natürlicher als »damit nicht«.
- source_word: תִּקְדַּשׁ
  choice: als geheiligt ausgesondert
  rationale: Die Wiedergabe hält sowohl die Grundbedeutung »heilig werden/geheiligt werden« als auch die rechtliche Folge fest, dass der Ertrag dem gewöhnlichen Gebrauch entzogen ist.
- source_word: הַמְלֵאָה
  choice: der gesamte Ertrag
  rationale: המלאה bezeichnet hier die Fülle beziehungsweise den gesamten Ertrag der Anbaufläche.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: die Saat, die du aussäst
  rationale: Die Relativkonstruktion und der landwirtschaftliche Sinn werden unmittelbar bewahrt.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: als auch der Ertrag des Weinbergs
  rationale: תבואה bezeichnet den Ertrag beziehungsweise die Erzeugnisse; die korrelative Form »sowohl … als auch« verdeutlicht die beiden betroffenen Bestandteile.
theological_decisions:
- issue: Bedeutung von תִּקְדַּשׁ in diesem gesetzlichen Zusammenhang
  choice: »als geheiligt ausgesondert« mit einer Fußnote zur wörtlichen Bedeutung
  alternative: »verfällt« beziehungsweise »wird eingezogen«
  rationale: 'Das hebräische Verb bedeutet wörtlich »heilig werden«. Eine rein rechtliche Umschreibung würde diese auffällige sakrale Sprache beseitigen; eine unkommentierte wörtliche Fassung könnte dagegen wie eine positive Würdigung der verbotenen Mischkultur wirken. Die gewählte Form bewahrt beides: die sakrale Begrifflichkeit und den Entzug vom gewöhnlichen Gebrauch.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verbotsformel. Der Gedankenstrich leitet die nähere Bestimmung des gesamten betroffenen Ertrags ein.
