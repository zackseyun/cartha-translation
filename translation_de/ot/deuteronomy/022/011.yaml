  language: de
  text: Du sollst kein Mischgewebe aus Wolle und Leinen tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Schaatnes, Wolle und Leinen zusammen.“ Das seltene Wort „Schaatnes“ bezeichnet hier einen Mischstoff aus diesen beiden Materialien.'
