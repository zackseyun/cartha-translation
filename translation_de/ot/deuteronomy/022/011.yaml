lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Du sollst … nicht tragen
  rationale: Die Negation mit dem Qal-Imperfekt der 2. Person Singular formuliert im Gesetz ein direktes Verbot; „Du sollst … nicht tragen“ gibt dies im Deutschen würdig und geläufig wieder.
- source_word: שַׁעַטְנֵז
  choice: Mischgewebe
  rationale: Das seltene Wort bezeichnet einen verbotenen Mischstoff; die folgende Apposition präzisiert ihn als Verbindung von Wolle und Leinen. „Mischgewebe“ vermittelt den Sinn verständlich, während die Fußnote die ungewöhnliche hebräische Bezeichnung offenlegt.
- source_word: צֶמֶר
  choice: Wolle
  rationale: Die übliche Bedeutung des Substantivs im Zusammenhang mit Textilien.
- source_word: וּפִשְׁתִּים
  choice: und Leinen
  rationale: Das Wort kann Flachs als Rohstoff bezeichnen; beim Tragen eines Stoffes ist „Leinen“ im Deutschen die natürliche Wiedergabe.
- source_word: יַחְדָּו
  choice: aus Wolle und Leinen
  rationale: Das Adverb bezeichnet hier die Verbindung beider Materialien. Die Konstruktion mit „Mischgewebe aus“ bringt dieses gemeinsame Vorkommen idiomatisch zum Ausdruck.
