  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: de
  text: Aber der jungen Frau sollst du nichts antun; die junge Frau hat keine Schuld, die den Tod verdient.[a] Denn wie wenn ein Mann sich gegen seinen Mitmenschen erhebt und ihn ermordet, so ist es in diesem Fall.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Bei der jungen Frau liegt keine Todesschuld vor.« Gemeint ist eine Schuld, die die Todesstrafe nach sich zieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »So ist diese Sache.« Der Fall wird mit einem Mord verglichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Aber der jungen Frau
  rationale: נַעַר bezeichnet hier im Zusammenhang die zuvor genannte verlobte junge Frau. Das einleitende ו markiert den Gegensatz zur Bestrafung des Mannes im vorhergehenden Vers.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: sollst du nichts antun
  rationale: Die Wendung untersagt in direkter rechtlicher Anrede jede Strafmaßnahme gegen sie; „antun“ macht den Personenbezug im Deutschen natürlich deutlich.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: die junge Frau hat keine Schuld, die den Tod verdient
  rationale: Die hebräische Wendung bezeichnet im rechtlichen Zusammenhang keine Schuld, die mit dem Tod zu ahnden wäre, ohne eine darüber hinausgehende Aussage über völlige moralische Schuldlosigkeit zu erzwingen.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: wie wenn ein Mann seinen Mitmenschen überfällt
  rationale: יָקוּם עַל beschreibt hier ein feindliches Vorgehen beziehungsweise einen Angriff. „Mitmensch“ gibt רֵעַ im zwischenmenschlichen Rechtskontext verständlich wieder.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: und ihn ermordet
  rationale: רצח bezeichnet hier rechtswidriges Töten; das Suffix verweist auf den angegriffenen Mitmenschen. נֶפֶשׁ wird in der natürlichen deutschen Formulierung idiomatisch mit erfasst.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: dieser Fall ist so
  rationale: Die Wendung schließt den Vergleich ab; דָּבָר hat in diesem Rechtstext den Sinn „Fall“ beziehungsweise „Sache“.
theological_decisions:
- issue: Art und Umfang der Schuldlosigkeit der jungen Frau
  choice: Der Vers spricht ihr in diesem Rechtsfall jede todwürdige Schuld ab.
  alternative: Der Vers erklärt sie ohne besondere rechtliche Eingrenzung für vollkommen moralisch schuldlos.
  rationale: חֵטְא מָוֶת ist im Kontext der kasuistischen Rechtsbestimmung juristisch zu verstehen. Die Übersetzung bewahrt diesen Schwerpunkt und weitet die Aussage nicht über den Text hinaus aus.
- issue: Funktion des Mordvergleichs
  choice: Der Fall wird ausdrücklich mit einem tödlichen Überfall verglichen.
  alternative: Der Vergleich wird als vollständige Gleichsetzung aller Aspekte beider Taten verstanden.
  rationale: כֵּן הַדָּבָר הַזֶּה kennzeichnet eine rechtliche Analogie; die Übersetzung lässt offen, in welchen Einzelheiten der Vergleich über den entscheidenden Aspekt des gewaltsamen Angriffs hinausreicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter rechtlicher Anrede. „Junge Frau“ vermeidet die mögliche Minderjährigkeitskonnotation von „Mädchen“; „Mitmensch“ ist heute verständlicher als das in diesem Kontext missverständliche „Nächster“.
