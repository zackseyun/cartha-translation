source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: de
  text: Wenn ein Mann eine junge Frau findet, eine Jungfrau, die nicht verlobt[a] ist, und sie packt[b] und mit ihr schläft und sie dabei entdeckt werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die keinem Mann zur Ehe versprochen ist“. Die damalige Verlobung war rechtlich verbindlicher als eine heutige Verlobung.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann „packen“, „ergreifen“ oder „festhalten“ bedeuten. Manche verstehen die Formulierung hier als Hinweis auf eine Vergewaltigung; andere folgern die genaue rechtliche Einordnung erst aus dem weiteren Zusammenhang.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Bedingungsfall eines kasuistischen Gesetzes ein; „wenn“ entspricht natürlichem deutschem Rechtsstil.
- source_word: יִמְצָא
  choice: findet
  rationale: Gibt die übliche Bedeutung des Verbs direkt wieder; „antrifft“ wäre kontextuell ebenfalls möglich.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt die geschlechtsspezifische Einzahl des hebräischen Substantivs.
- source_word: נער בְתוּלָה
  choice: eine junge Frau, eine Jungfrau
  rationale: Gibt sowohl das junge Alter als auch die ausdrücklich genannte Jungfräulichkeit wieder, ohne das altertümliche „Jungfrau im heiratsfähigen Alter“ oder das möglicherweise zu kindlich klingende „Mädchen“ zu verwenden.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: die nicht verlobt ist
  rationale: „Verlobt“ ist die verständliche moderne Wiedergabe für eine rechtlich zur Ehe versprochene Frau; die historisch-rechtliche Nuance wird in der Fußnote kenntlich gemacht.
- source_word: וּתְפָשָׂהּ
  choice: und sie packt
  rationale: „Packen“ bewahrt den körperlich-zugreifenden Gehalt von תפשׂ, ohne die gesamte Handlung bereits mit einer engeren rechtlichen Deutung zu benennen.
- source_word: וְשָׁכַב עִמָּהּ
  choice: und mit ihr schläft
  rationale: Natürliche und im Zusammenhang eindeutige deutsche Wendung für Geschlechtsverkehr, die dem hebräischen Ausdruck formal nahebleibt.
- source_word: וְנִמְצָאוּ
  choice: und beide entdeckt werden
  rationale: Der hebräische Plural wird ausdrücklich durch „beide“ wiedergegeben; „entdeckt werden“ vermittelt, dass das Geschehen bekannt wird.
theological_decisions:
- issue: Ob die Handlung im Haupttext ausdrücklich als Vergewaltigung bezeichnet werden soll
  choice: Die einzelnen hebräischen Handlungsausdrücke werden als „sie packt und mit ihr schläft“ wiedergegeben.
  alternative: „sie vergewaltigt“ oder das weichere „sie ergreift und mit ihr schläft“
  rationale: תפשׂ bezeichnet ein Packen, Ergreifen oder Festhalten und trägt einen körperlichen Zug in sich, legt aber für sich allein nicht jede rechtliche und situationsbezogene Einzelheit fest. Die gewählte Formulierung bewahrt sowohl die Härte des Verbs als auch die in der Forschung bestehende Auslegungsfrage.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satz bleibt wegen seiner Fortsetzung im nächsten Vers mit einem Komma offen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
