  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: de
  text: Dann sollen der Vater der jungen Frau und ihre Mutter die Zeichen für die Jungfräulichkeit der jungen Frau nehmen und sie den Ältesten der Stadt am Tor vorlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Jungfräulichkeiten der jungen Frau“; eine hebräische Wendung für die Zeichen oder Beweisstücke, die als Nachweis ihrer Jungfräulichkeit vorgelegt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: sollen … nehmen
  rationale: Das Qal Perfekt mit וְ setzt im gesetzlichen Ablauf die vorgeschriebene Handlung fort. „Sollen“ gibt diesen rechtlich-anweisenden Sinn in modernem Deutsch angemessen wieder.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: der Vater der jungen Frau und ihre Mutter
  rationale: נַעֲרָה bezeichnet hier eine junge Frau im heiratsfähigen Alter. „Junge Frau“ ist gegenwärtig und vermeidet sowohl den kindlichen Beiklang von „Mädchen“ als auch das altertümliche „Jungfrau“ als Personenbezeichnung.
- source_word: וְהוֹצִיאוּ
  choice: vorlegen
  rationale: Der Hifil von יצא bezeichnet hier das Herausbringen beziehungsweise Präsentieren vor den zuständigen Ältesten. „Vorlegen“ drückt die förmliche Beweisvorlage im Rechtsverfahren natürlich aus.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: die Zeichen für die Jungfräulichkeit der jungen Frau
  rationale: Wörtlich steht der ungewöhnliche Plural „die Jungfräulichkeiten der jungen Frau“. Gemeint sind konkrete Zeichen oder Beweisstücke, die in diesem Rechtsfall als Nachweis ihrer Jungfräulichkeit präsentiert werden. „Zeichen für“ bleibt näher am konkreten Ausdruck als das abstraktere „Beweis“.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: den Ältesten der Stadt
  rationale: אֶל bezeichnet die Ausrichtung auf die Ältesten als zuständige richterliche Instanz; im Deutschen verbindet „vorlegen“ das Ziel idiomatisch mit dem Dativ.
- source_word: הַשַּׁעְרָה
  choice: am Tor
  rationale: Die Richtungsendung kann formal „zum Tor“ bedeuten. Im Zusammenhang bezeichnet das Stadttor jedoch den Ort, an dem die Ältesten Recht sprechen; „am Tor“ gibt diese örtliche Funktion natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Gesetzesstil. Die etwas formelle Wendung „sollen … nehmen und … vorlegen“ bewahrt die Abfolge der im Hebräischen vorgeschriebenen Handlungen; „am Tor“ bezeichnet den öffentlichen Gerichtsplatz der Stadt.
