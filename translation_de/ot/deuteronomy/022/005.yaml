  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: de
  text: Eine Frau soll keinen Gegenstand eines Mannes[a] an sich tragen, und ein Mann soll kein Gewand einer Frau anziehen; denn jeder, der diese Dinge tut, ist dem HERRN, deinem Gott, ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keine Kleidung eines Mannes«. Das hebräische Wort im ersten Satzteil ist weiter gefasst als das im zweiten Satzteil verwendete konkrete Wort für »Gewand« und kann auch einen Gegenstand, ein Gerät oder Ausrüstung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: Gegenstand eines Mannes
  rationale: כְּלִי ist weiter gefasst als Kleidung und kann einen Gegenstand, ein Gerät, eine Ausrüstung oder ein Utensil bezeichnen. Da im zweiten Satzteil mit שִׂמְלָה ausdrücklich ein Kleidungsstück genannt wird, bleibt diese Unterscheidung erhalten.
- source_word: עַל אִשָּׁה
  choice: an sich tragen
  rationale: Die Wendung »auf/über einer Frau sein« bezeichnet hier idiomatisch, dass sie den betreffenden Gegenstand am Körper beziehungsweise bei sich trägt. »An sich tragen« lässt den weiteren Sinn von כְּלִי offen.
- source_word: יִלְבַּשׁ
  choice: anziehen
  rationale: Das Verb bezeichnet das Anlegen von Kleidung. »Anziehen« ist im Deutschen natürlich und unterscheidet sich passend von der Formulierung des ersten Satzteils.
- source_word: שִׂמְלַת אִשָּׁה
  choice: Gewand einer Frau
  rationale: שִׂמְלָה bezeichnet ein Kleidungsstück, häufig ein Obergewand. »Gewand« ist würdevoll und hinreichend bestimmt, ohne eine konkrete Kleidungsart vorauszusetzen.
- source_word: גֶּבֶר
  choice: Mann
  rationale: גֶּבֶר bezeichnet hier im ausdrücklichen Gegensatz zu אִשָּׁה einen Mann.
- source_word: אִשָּׁה
  choice: Frau
  rationale: אִשָּׁה bezeichnet hier im geschlechtlichen Gegensatz zu גֶּבֶר eine Frau.
- source_word: תּוֹעֲבַת יְהוָה
  choice: dem HERRN … ein Gräuel
  rationale: תּוֹעֵבָה ist ein starker Ausdruck für etwas, das vor Gott verabscheuungswürdig ist. Die traditionelle und weiterhin verständliche Wendung »ein Gräuel« bewahrt dieses Gewicht; der Gottesname wird im deutschen Bibelregister mit »HERR« wiedergegeben.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: jeder, der so etwas tut
  rationale: Die partizipiale Konstruktion hat verallgemeinernde Bedeutung. Das neutrale Singularpronomen »so etwas« nimmt beide zuvor genannten Handlungen zusammen und ergibt natürliches modernes Deutsch.
theological_decisions:
- issue: Reichweite des ersten Verbots (כְלִי גֶבֶר)
  choice: Weiter gefasst als »Gegenstand eines Mannes« wiedergeben.
  alternative: »Männerkleidung« oder enger »Waffe/Ausrüstung eines Mannes«
  rationale: Der erste Satzteil verwendet einen breiteren Begriff als der zweite, der ausdrücklich ein Gewand nennt. Die Übersetzung bewahrt diese lexikalische Spannung und legt nicht fest, ob ausschließlich Kleidung oder auch andere männlich zugeordnete Ausrüstung gemeint ist.
- issue: Geschlechtsspezifische Sprache
  choice: »Frau« und »Mann« verwenden.
  alternative: Geschlechtsneutrale Bezeichnungen wie »Person« oder »jemand«
  rationale: Der hebräische Text stellt Frau und Mann ausdrücklich einander gegenüber; diese Unterscheidung wird ohne zusätzliche Deutung wiedergegeben.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: »HERR«
  alternative: »JHWH« oder »Jahwe«
  rationale: »HERR« entspricht der etablierten deutschen Bibelkonvention. Die Beziehung in »deinem Gott« bleibt unmittelbar erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar, während »an sich tragen« und »anziehen« idiomatisch formuliert sind. »Gräuel« wahrt die starke wertende Sprache des Ausgangstextes.
