  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: de
  text: Dann soll man die junge Frau an den Eingang des Hauses ihres Vaters bringen, und die Männer ihrer Stadt sollen sie zu Tode steinigen. Denn sie hat in Israel eine Schandtat begangen, indem sie im Haus ihres Vaters Hurerei trieb.[a] So sollst du das Böse aus deiner Mitte beseitigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann wörtlich ein Verhalten wie das einer Prostituierten bezeichnen, wird aber auch weiter für unerlaubtes sexuelles Verhalten gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: die junge Frau
  rationale: Das kontextuell feminin gebrauchte נַעַר bezeichnet hier eine junge Frau. Diese Wiedergabe ist im modernen Deutschen natürlich und passt zum rechtlichen Kontext.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: an den Eingang des Hauses ihres Vaters
  rationale: Die konkrete Ortsangabe wird eng am Hebräischen wiedergegeben; „Eingang“ entspricht פֶּתַח, während „Haus“ sowohl Gebäude als auch familiären Lebensbereich anklingen lassen kann.
- source_word: אַנְשֵׁי עִירָהּ
  choice: die Männer ihrer Stadt
  rationale: Die maskuline Pluralform אַנְשֵׁי wird geschlechtsgenau wiedergegeben. „Stadt“ bewahrt die übliche Bedeutung von עִיר, ohne auf „Ortschaft“ auszuweichen.
- source_word: וּסְקָלוּהָ בָּאֲבָנִים וָמֵתָה
  choice: sollen sie zu Tode steinigen
  rationale: Die idiomatische deutsche Formulierung gibt sowohl die Steinigung als auch das ausdrücklich genannte Todesresultat wieder, ohne die im Deutschen unnötige Doppelung „mit Steinen steinigen“.
- source_word: נְבָלָה
  choice: eine Schandtat
  rationale: „Schandtat“ vermittelt den moralisch und gemeinschaftlich empörenden Charakter des hebräischen Ausdrucks stärker als bloße „Torheit“, bleibt aber natürlich und würdevoll.
- source_word: לִזְנוֹת
  choice: indem sie … Hurerei trieb
  rationale: Die Wiedergabe bewahrt die starke Bild- und Wertungssprache von זנה. Sie lässt zugleich offen, ob das Verb hier im engeren Sinn Prostitution oder allgemeiner unerlaubtes sexuelles Verhalten bezeichnet.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: So sollst du das Böse aus deiner Mitte beseitigen
  rationale: Die wiederkehrende deuteronomische Rechtsformel wird klar und nah am Wortlaut wiedergegeben. Der kollektive Singular „du“ bleibt erhalten.
theological_decisions:
- issue: Rechtlich-sexuelle Terminologie
  choice: Die starke Formulierung „Hurerei trieb“ wird beibehalten und durch eine Fußnote als semantisch weiter möglicher Ausdruck erläutert.
  alternative: „sexuelle Unmoral beging“ oder „sich sexuell verging“
  rationale: Der Text soll weder abgeschwächt noch enger festgelegt werden, als es זנה erlaubt. Haupttext und Fußnote bewahren gemeinsam die Bildsprache und ihre Bedeutungsbreite.
- issue: Bezeichnung der Tat als נְבָלָה
  choice: „Schandtat“
  alternative: „schändliche Tat“, „Freveltat“ oder „empörende Tat“
  rationale: „Schandtat“ trägt die schwere moralisch-soziale Wertung des Ausdrucks, ohne eine spätere dogmatische Kategorie einzuführen.
- issue: Ausführende der Strafe
  choice: „die Männer ihrer Stadt“
  alternative: „die Bewohner ihrer Stadt“
  rationale: Die Übersetzung erhält die grammatisch maskuline Bezeichnung des hebräischen Rechtstextes und neutralisiert sie nicht ohne textlichen Grund.
translation_notes:
  register: Moderner, würdevoller rechtlicher Erzählstil. Die harten Aussagen des Ausgangstextes werden weder beschönigt noch durch zusätzliche Erklärungen verschärft. Die deutsche Satzstruktur ist idiomatisch; der kollektive Singular der abschließenden Rechtsformel bleibt gewahrt.
