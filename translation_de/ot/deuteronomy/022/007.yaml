base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: de
  text: Du sollst die Mutter unbedingt freilassen[a]; die Jungen aber darfst du für dich nehmen[b], damit es dir gut geht und du lange lebst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du sollst die Mutter ganz gewiss wegschicken.“'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „die Söhne“; im Zusammenhang des Vogelnests sind die Jungen gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „und du wirst deine Tage verlängern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: sollst ... unbedingt fliegen lassen
  rationale: Der Infinitivus absolutus mit derselben finiten Verbform verstärkt das Gebot. „Unbedingt“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder; „fliegen lassen“ passt zum unmittelbaren Kontext des Vogelnests.
- source_word: הָאֵם
  choice: die Mutter
  rationale: Der Zusammenhang bezeichnet eindeutig das Muttertier im Vogelnest; die knappe Wiedergabe entspricht dem Hebräischen, ohne „Vogel“ unnötig zu ergänzen.
- source_word: הַבָּנִים
  choice: die Jungen
  rationale: Wörtlich steht „die Söhne/Kinder“. Im Zusammenhang eines Vogelnests ist „die Jungen“ die natürliche deutsche Bezeichnung und lässt den Rückbezug auf Junge oder Eier aus Vers 6 offen.
- source_word: תִּקַּח לָךְ
  choice: darfst du für dich nehmen
  rationale: Nach dem nachdrücklichen Gebot hat die Imperfektform hier im Zusammenhang erlaubenden Sinn. „Für dich“ bewahrt לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: Dann wird es dir gut gehen
  rationale: Die Zweck- bzw. Folgeformel wird in verständlichem Deutsch wiedergegeben, ohne ihre Aussage zu einer mechanischen Garantie auszubauen.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: und du wirst lange leben
  rationale: Wörtlich etwa „und du wirst Tage verlängern“. „Lange leben“ gibt den hebräischen Sinn idiomatisch und klar wieder.
theological_decisions:
- issue: Art der zugesagten Folge
  choice: Die Aussage bleibt als an Gehorsam geknüpfte Segens- bzw. Folgeaussage stehen.
  alternative: Eine ausnahmslose mechanische Garantie langen Lebens für jeden einzelnen Fall.
  rationale: Die hebräische Zweck-/Folgeformel nennt die verheißene Folge, erläutert aber nicht, wie sie in jedem Einzelfall eintritt. Die Übersetzung sollte diese Spannung weder abschwächen noch dogmatisch auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Nachdruck des hebräischen Gebots wird natürlich ausgedrückt; die Erlaubnis im zweiten Satzteil und die Segensfolge bleiben voneinander klar unterscheidbar.
