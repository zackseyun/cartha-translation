  source_fidelity: 'Die Grundbedeutung wird getroffen: Es geht um das Rind oder ein Tier aus dem Kleinviehbestand des Bruders, das abgeirrt bzw. versprengt ist, und um die nachdrückliche Pflicht zur Rückgabe. „Nicht zusehen, wie“ verschiebt jedoch das schlichte Wahrnehmen (ראה) zu einem beobachteten Vorgang. „Dich ihnen entziehen“ ist zwar möglich, klingt im Deutschen aber weniger direkt als die idiomatische Entsprechung für das bewusste Wegsehen bzw. Sich-Abwenden. Die Ursache des Abirrens bleibt in der Revision offen.'
