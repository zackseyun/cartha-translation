  terminology: „Bruder“ bleibt als Übersetzung von אָחִיךָ erhalten. „Tier aus der Kleinviehherde“ gibt die nicht näher festgelegte Kleinviehbedeutung von שֶׂה wieder. „Unbedingt zurückbringen“ gibt den verstärkenden Infinitivus absolutus sachgerecht und modern wieder.
