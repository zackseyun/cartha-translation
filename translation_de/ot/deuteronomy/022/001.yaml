  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: de
  text: Wenn du das Rind deines Bruders oder eines seiner Tiere aus der Kleinviehherde siehst, das umherirrt, darfst du nicht wegsehen. Du sollst es deinem Bruder unbedingt zurückbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: deines Bruders / deinem Bruder
  rationale: Das hebräische Verwandtschaftswort wird formal bewahrt; im Gesetzeskontext kann es neben dem leiblichen Bruder auch einen Angehörigen der Gemeinschaft bezeichnen.
- source_word: שֵׂיוֹ
  choice: ein Stück Kleinvieh
  rationale: שֶׂה bezeichnet ein einzelnes Tier aus der Schaf- oder Ziegenherde; „Kleinvieh“ erhält diese Offenheit besser als ausschließlich „Schaf“.
- source_word: נִדָּחִים
  choice: umherirrt
  rationale: Das Partizip kann ein abgeirrtes, versprengtes oder fortgetriebenes Tier bezeichnen. „Umherirrt“ gibt den sichtbaren Zustand wieder, ohne ausdrücklich einen nicht genannten Treiber vorauszusetzen.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: und dich ihnen entziehen
  rationale: Die reflexive Form bezeichnet ein Sich-Verbergen beziehungsweise bewusstes Sich-Entziehen; die Wiedergabe ist genauer als ein bloßes unbeabsichtigtes Übersehen.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: Du sollst sie ... unbedingt zurückbringen
  rationale: Infinitivus absolutus plus finites Verb verstärkt die Verpflichtung; „unbedingt“ bildet die emphatische Konstruktion natürlich ab.
theological_decisions:
- issue: Bedeutungsumfang von „Bruder“
  choice: „Bruder“ im Haupttext beibehalten
  alternative: „Mitmensch“ oder „Landsmann“
  rationale: Die verwandtschaftlich-gemeinschaftliche Sprache des Hebräischen soll nicht interpretierend verallgemeinert werden.
- issue: Ursache des Abirrens
  choice: den Zustand als „umherirrt“ wiedergeben
  alternative: „fortgetrieben wurde“
  rationale: Die passive Form lässt sowohl Verirrung als auch Vertreibung zu; der deutsche Haupttext vermeidet eine unnötige Festlegung auf einen äußeren Verursacher.
translation_notes:
  register: Modernes, würdevolles Gesetzesdeutsch mit direkter Anrede. „Stück Kleinvieh“ ist präzise, aber noch allgemein verständlich; die Wiederholung von „Du sollst“ erhält den verpflichtenden Nachdruck.
