    issue: „selbst aber nichts leihen müssen“ für וְאַתָּה לֹא תַעֲבֹט
    rationale: Die Formulierung fügt mit „müssen“ ein im Ausgangstext nicht ausgedrücktes Erfordernis hinzu. Außerdem ist „leihen“ im Deutschen in beiden Kreditrichtungen möglich. „Du wirst selbst nicht borgen“ gibt die Bedeutung des Qal von עבט klarer und ohne zusätzliche Modalität wieder.
  revised_text: Denn Jahwe, dein Gott, hat dich gesegnet, wie er es dir versprochen hat.[a] Du wirst vielen Völkern leihen, selbst aber nicht borgen; und du wirst über viele Völker herrschen, sie aber werden nicht über dich herrschen.
