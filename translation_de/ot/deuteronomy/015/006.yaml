revisions:
- from: Denn Jahwe, dein Gott, hat dich gesegnet, wie er es dir versprochen hat.[a] Du wirst vielen Völkern leihen, selbst aber nichts leihen müssen; und du wirst über viele Völker herrschen, sie aber werden nicht über dich herrschen.
  to: Denn Jahwe, dein Gott, hat dich gesegnet, wie er es dir versprochen hat.[a] Du wirst vielen Völkern leihen, selbst aber nicht borgen; und du wirst über viele Völker herrschen, sie aber werden nicht über dich herrschen.
  rationale: Eine gezielte Korrektur ersetzt die modalisierende und richtungsbedingt mögliche mehrdeutige Formulierung „nichts leihen müssen“ durch „nicht borgen“. Dadurch bleibt der Gegensatz zwischen Kredit geben und Kredit aufnehmen ebenso klar wie im Hebräischen, ohne die Aussage zu erweitern. Die Fußnote bewahrt die wörtliche Alternative zu „versprochen hat“.
