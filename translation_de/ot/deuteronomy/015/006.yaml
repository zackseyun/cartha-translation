base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: de
  text: Denn Jahwe, dein Gott, hat dich gesegnet, wie er es dir versprochen hat.[a] Du wirst vielen Völkern leihen, selbst aber nicht borgen; und du wirst über viele Völker herrschen, sie aber werden nicht über dich herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie er zu dir geredet hat“. Im Zusammenhang ist Gottes Zusage gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּרַכְךָ
  choice: hat dich gesegnet
  rationale: Das hebräische Perfekt bezeichnet hier die feststehende beziehungsweise bereits wirksame Segnung, auf der die folgenden Aussagen beruhen.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: wie er es dir versprochen hat
  rationale: Wörtlich steht hier „wie er zu dir geredet hat“; im Bundeskontext hat das Reden den Sinn einer Zusage. Eine Fußnote bewahrt die formale Alternative.
- source_word: וְהַעֲבַטְתָּ
  choice: du wirst vielen Völkern leihen
  rationale: Der Hifil-Stamm von עבט bedeutet hier, anderen Darlehen zu geben. „Leihen“ ist im Zusammenhang mit dem Dativ eindeutig und natürlich.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: גּוֹיִם bezeichnet hier politische beziehungsweise ethnische Gemeinschaften; „Völker“ ist idiomatisches Standarddeutsch.
- source_word: וְאַתָּה לֹא תַעֲבֹט
  choice: selbst aber nichts leihen müssen
  rationale: Der Qal von עבט bezeichnet im Gegensatz zum vorigen Hifil das Aufnehmen eines Darlehens. „Nichts leihen müssen“ macht im Deutschen die Richtung deutlich, ohne das Bild zu verändern.
- source_word: וּמָשַׁלְתָּ
  choice: du wirst über viele Völker herrschen
  rationale: משׁל bezeichnet das Ausüben von Herrschaft; „herrschen über“ wahrt die politische Aussage und die Parallele des Verses.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: sie aber werden nicht über dich herrschen
  rationale: Das pluralische Subjekt verweist natürlich auf die zuvor genannten Völker; das Pronomen macht diesen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der üblichen deutschen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussageweise der Segnung und ihrer Folgen
  choice: Perfekt bei der Segnung, Futur bei Leihen und Herrschen
  alternative: durchgehend futurische Wiedergabe
  rationale: Diese Wiedergabe folgt den hebräischen Verbformen und lässt zugleich offen, wie die bereits zugesicherte Segnung zeitlich zu ihrer vollen Verwirklichung steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede Israels im Singular bleibt erhalten. Die parallelen Gegensätze zwischen Leihen und Borgen sowie Herrschen und Beherrschtwerden wurden klar und rhythmisch wiedergegeben.
