source:
  edition: WLC
  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: de
  text: Du sollst es zusammen mit allen, die zu deinem Haus gehören, Jahr für Jahr vor Jahwe, deinem Gott,[a] an dem Ort essen, den Jahwe auswählen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Gegenwart Jahwes, deines Gottes.'
    reason: Lexikalische Alternative für לִפְנֵי.
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Verbindung mit פָּנִים bedeutet idiomatisch „vor“ beziehungsweise „in der Gegenwart von“. „Vor“ ist knapp, natürlich und bewahrt den Gedanken des Essens in Gottes Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die Konstruktverbindung mit dem Suffix der 2. Person Singular bezeichnet den Gott des angesprochenen Israeliten.
- source_word: תֹאכֲלֶנּוּ
  choice: sollst es … essen
  rationale: Das Qal-Imperfekt der 2. Person Singular mit Objektsuffix bezieht sich auf das zuvor genannte erstgeborene Tier. „Sollst“ entspricht dem rechtlich-anweisenden Zusammenhang, ohne einen stärkeren Zwang als der Text auszudrücken.
- source_word: שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die distributive Wendung bezeichnet eine jährlich wiederkehrende Handlung und lässt zugleich den hebräischen Rhythmus erkennen.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: an dem Ort, den Jahwe auswählen wird
  rationale: Die Formulierung gibt die für das Deuteronomium typische Aussage über den von Jahwe bestimmten Kultort wieder; das Futur bewahrt die vorausblickende Form des hebräischen Imperfekts.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: du … zusammen mit allen, die zu deinem Haus gehören
  rationale: בַּיִת bezeichnet hier nicht nur das Gebäude, sondern die häusliche Gemeinschaft. Die Umschreibung ist im modernen Deutsch verständlich, bewahrt diesen weiteren sozialen Sinn und ermöglicht zugleich die durchgehend singularische Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den offenbarten persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי im kultischen Zusammenhang
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: Beide Wiedergaben sind sprachlich möglich. Der Haupttext verwendet die knappe räumlich-relationale Formulierung „vor Jahwe“; die Fußnote macht den ausdrücklich auf Gegenwart bezogenen Sinn sichtbar, ohne die Mehrdeutigkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die singularische Anrede des hebräischen Textes bleibt durch „Du sollst … zusammen mit …“ erhalten; „alle, die zu deinem Haus gehören“ vermeidet das im heutigen Deutsch leicht nur als Gebäude verstandene „dein Haus“.
