  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: de
  text: Wenn dein Bruder oder deine Schwester, ein Hebräer oder eine Hebräerin, an dich verkauft wird und dir sechs Jahre dient, sollst du ihn[a] im siebten Jahr frei aus deinem Dienst entlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach »ein Hebräer oder eine Hebräerin« verwendet der hebräische Text für die freizulassende Person die maskuline Singularform »ihn« als allgemeinen Rückbezug. Die Vorschrift gilt für einen Mann ebenso wie für eine Frau.
    reason: grammatical_gender
lexical_decisions:
- source_word: יִמָּכֵר
  choice: an dich verkauft wird
  rationale: Das Nifal von מכר wird zunächst passiv wiedergegeben. So bleibt offen, durch welchen konkreten Vorgang die Person in das Dienstverhältnis gelangt.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Bewahrt die familiäre und gemeinschaftsbezogene Bezeichnung des Hebräischen, statt sie zu »Landsmann« oder »Volksgenosse« zu verflachen.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: ein Hebräer oder eine Hebräerin
  rationale: Die beiden Formen bezeichnen ausdrücklich eine männliche beziehungsweise weibliche hebräische Person; sie sind nicht selbst die üblichen Wörter für Sklave oder Sklavin.
- source_word: וַעֲבָדְךָ
  choice: und dir ... dient
  rationale: Gibt עבד in diesem rechtlichen Zusammenhang natürlich als geleisteten Dienst wieder, ohne die Art der Arbeit näher festzulegen.
- source_word: שֵׁשׁ שָׁנִים
  choice: sechs Jahre
  rationale: Direkte Wiedergabe der Zeitangabe.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: im siebten Jahr
  rationale: Die Wendung bezeichnet den Zeitpunkt der vorgeschriebenen Freilassung nach sechs Dienstjahren.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: sollst du ihn ... entlassen
  rationale: שלח bedeutet wörtlich »senden/wegschicken«; »entlassen« gibt die rechtliche Freilassung im Deutschen idiomatisch wieder. Das Suffix ist maskulin Singular und wird im Haupttext sichtbar bewahrt.
- source_word: חָפְשִׁי
  choice: als freien Menschen
  rationale: Drückt hier den Status bei der Entlassung aus und macht deutlich, dass die Person frei wird.
- source_word: מֵעִמָּךְ
  choice: aus deinem Dienst
  rationale: Das Hebräische lautet wörtlich »von bei dir«. Im Zusammenhang bezeichnet es die Entlassung aus dem Dienst- und Abhängigkeitsverhältnis; »aus deinem Dienst« ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Maskulines Freilassungspronomen nach der ausdrücklichen Nennung eines Hebräers oder einer Hebräerin
  choice: Im Haupttext steht entsprechend der hebräischen Form »ihn«; eine Fußnote erklärt den generischen Bezug.
  alternative: »ihn oder sie« beziehungsweise ein umformulierter geschlechtsneutraler Plural
  rationale: Der hebräische Text nennt ausdrücklich Mann und Frau, fährt danach jedoch mit einem maskulinen Singularsuffix fort. Die Übersetzung bewahrt diese grammatische Spannung, ohne den Anwendungsbereich des Gesetzes auf Männer zu beschränken.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Rechtsdeutsch. Die Gedankenstriche kennzeichnen die erläuternde Apposition. »Entlassen« ist idiomatischer als das wörtliche »wegschicken«, während »als freien Menschen« den Status חָפְשִׁי ausdrücklich wiedergibt.
