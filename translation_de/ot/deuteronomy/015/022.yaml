  edition: WLC
  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: de
  text: Du darfst es in deinen Ortschaften[a] essen. Der Unreine wie der Reine darf davon essen[b], wie von einer Gazelle und einem Hirsch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »in deinen Toren«; gemeint sind die Ortschaften oder örtlichen Gemeinschaften in deinem Siedlungsgebiet.
    reason: cultural_note
  - marker: b
    text: 'Gemeint ist: Sowohl Menschen, die rituell unrein sind, als auch Menschen, die rituell rein sind, dürfen davon essen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Wörtlich »in deinen Toren«; die Wendung bezeichnet die Orte beziehungsweise örtlichen Gemeinschaften im eigenen Siedlungsgebiet. »Ortschaften« gibt den Sinn im heutigen Deutsch natürlich wieder, während die Fußnote das hebräische Bild bewahrt.
- source_word: תֹּאכֲלֶנּוּ
  choice: du darfst es essen
  rationale: Die Form ist 2. Person maskulin Singular mit einem maskulinen Objektpronomen. Im Zusammenhang hat die Aussage erlaubenden Sinn; »darfst« bringt diesen deutlicher zum Ausdruck als ein bloßes Futur.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: der Unreine wie der Reine
  rationale: Die substantivierten Adjektive bezeichnen Menschen mit unterschiedlichem rituellem Status, nicht moralisch schlechte beziehungsweise gute Menschen. Die knappe Gegenüberstellung des Hebräischen bleibt erhalten.
- source_word: יַחְדָּו
  choice: wie … Reine
  rationale: Die Konstruktion »der Unreine wie der Reine« gibt wieder, dass beide Gruppen gleichermaßen essen dürfen. Sie vermeidet die mögliche Fehldeutung von »zusammen« als notwendigerweise gleichzeitig oder am selben Ort.
- source_word: כַּצְּבִי
  choice: wie von einer Gazelle
  rationale: צְבִי bezeichnet gewöhnlich eine Gazelle. Die Vergleichspartikel wird mit »wie« wiedergegeben.
- source_word: וְכָאַיָּל
  choice: oder einem Hirsch
  rationale: אַיָּל bezeichnet einen Hirsch beziehungsweise ein Tier aus der Familie der Hirsche. Im Deutschen ist »Hirsch« die klare und geläufige Entsprechung; »oder« entspricht in dieser Vergleichsreihe natürlichem deutschem Sprachgebrauch, ohne die beiden Beispiele als ausschließende Alternativen zu verstehen.
theological_decisions:
- issue: Bedeutung von »unrein« und »rein«
  choice: Die Begriffe werden knapp als Personenbezeichnungen wiedergegeben und in der Fußnote ausdrücklich auf den rituellen Status bezogen.
  alternative: »der rituell Unreine und der rituell Reine« im Haupttext
  rationale: Damit bleibt die traditionelle und quellennähere Begrifflichkeit im Text erhalten, ohne den rituellen Sinn mit moralischer Schuld oder Tugend zu verwechseln.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Anrede bleibt entsprechend dem Hebräischen im Singular. Die kulturspezifische Tor-Wendung und der rituelle Sinn von »rein/unrein« werden in Fußnoten erläutert.
