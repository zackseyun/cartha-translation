  text: מִ/קֵּ֥ץ שֶֽׁבַע שָׁנִ֖ים תַּעֲשֶׂ֥ה שְׁמִטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: de
  text: Am Ende von jeweils sieben Jahren sollst du einen Erlass vollziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Freigabe oder einen Verzicht. Das hebräische Wort שְׁמִטָּה bezeichnet hier den im Gesetz für das siebte Jahr angeordneten Schuldenerlass.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Am Ende von
  rationale: Die Verbindung von מִן mit קֵץ bezeichnet hier den Abschluss eines Zeitraums. »Am Ende von« bewahrt den zeitlichen Bezug, ohne den genauen Vollzugszeitpunkt enger festzulegen als der hebräische Text.
- source_word: שֶׁבַע שָׁנִים
  choice: jeweils sieben Jahren
  rationale: Wörtlich steht »sieben Jahre«. »Jeweils« macht den im Gesetzeskontext vorausgesetzten wiederkehrenden Siebenjahresrhythmus in natürlichem Deutsch deutlich.
- source_word: תַּעֲשֶׂה
  choice: sollst du … vollziehen
  rationale: Das Imperfekt hat in dieser Gesetzesbestimmung verpflichtende Kraft. עשה bedeutet allgemein »tun, machen«; mit dem institutionellen Erlass als Objekt gibt »vollziehen« die angeordnete Durchführung idiomatisch wieder.
- source_word: שְׁמִטָּה
  choice: einen Erlass
  rationale: שְׁמִטָּה bezeichnet ein Loslassen beziehungsweise Erlassen und wird hier als Fachwort für die im siebten Jahr angeordnete Schuldenfreigabe gebraucht. »Erlass« ist knapp und lässt die folgenden Verse dessen konkrete Ausgestaltung erklären.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Gesetzessprache. »Jeweils« verdeutlicht den wiederkehrenden Zyklus; »Erlass vollziehen« bewahrt den institutionellen Charakter, ohne die Einzelheiten der folgenden Verse vorwegzunehmen.
