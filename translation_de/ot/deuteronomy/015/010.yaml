  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: de
  text: Du sollst ihm unbedingt geben und nicht missmutig sein, wenn du ihm gibst. Denn wegen dieser Sache wird Jahwe, dein Gott, dich bei all deinem Tun und bei allem segnen, was du mit deiner Hand unternimmst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei jedem Aussenden deiner Hand“; gemeint ist alles, was du in Angriff nimmst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Gib ihm bereitwillig
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. Im Deutschen gibt „bereitwillig“ die nachdrückliche, vorbehaltlose Aufforderung im Zusammenhang wieder, ohne eine bloß formale Dopplung wie „geben sollst du geben“.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: dein Herz soll es nicht bedauern
  rationale: Die Wendung bezeichnet eine negative innere Reaktion auf das Geben. „Es nicht bedauern“ wahrt das Herzbild und kann sowohl schmerzliche Abneigung als auch widerwilliges Bereuen ausdrücken, ohne die Bedeutung auf offenen Groll zu verengen.
- source_word: בְּתִתְּךָ לוֹ
  choice: wenn du ihm gibst
  rationale: Die Präposition mit dem Infinitiv constructus ist hier zeitlich beziehungsweise begleitend zu verstehen; die gewählte Form ist natürliches modernes Deutsch.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: Denn deswegen
  rationale: בגלל bezeichnet den Grund; הַדָּבָר הַזֶּה verweist auf das soeben gebotene Geben. „Deswegen“ gibt diesen Rückbezug idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname YHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: bei all deinem Tun
  rationale: מַעֲשֶׂה umfasst Arbeit, Handeln und Hervorgebrachtes. „Tun“ bewahrt diese Breite.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: bei allem, was du mit deiner Hand unternimmst
  rationale: Die Formulierung gibt das hebräische Handbild verständlich wieder und vermittelt zugleich den idiomatischen Sinn jedes Vorhabens oder Tätigkeitsbereichs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Maskulines Singularpronomen für den Empfänger
  choice: ihm
  alternative: der bedürftigen Person
  rationale: Das hebräische Suffix steht im maskulinen Singular und verweist im unmittelbaren Zusammenhang auf den bedürftigen Bruder. „Ihm“ bildet diese Textgestalt genau ab.
- issue: Zusammenhang von Geben und Segen
  choice: Denn deswegen wird Jahwe … dich segnen
  alternative: damit Jahwe … dich segnet
  rationale: כִּי בִּגְלַל bezeichnet eine Begründung beziehungsweise Folge, nicht ausdrücklich den Zweck des Gebens. Die Übersetzung bewahrt die Aussage, ohne den Segen als menschlich steuerbaren Zweck zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Anrede. Das traditionelle Herzbild bleibt erhalten; schwer verständliche hebräische Verstärkung und Idiomatik werden sinngenau und natürlich wiedergegeben.
