revisions:
- from: Gib ihm bereitwillig, und dein Herz soll es nicht bedauern, wenn du ihm gibst. Denn deswegen wird Jahwe, dein Gott, dich segnen bei all deinem Tun und bei allem, was du mit deiner Hand unternimmst.[a]
  to: Du sollst ihm unbedingt geben und nicht missmutig sein, wenn du ihm gibst. Denn wegen dieser Sache wird Jahwe, dein Gott, dich bei all deinem Tun und bei allem segnen, was du mit deiner Hand unternimmst.[a]
  rationale: Die Revision gibt die emphatische hebräische Befehlsform ohne die zusätzliche Bedeutungsnuance von „bereitwillig“ wieder. Sie ersetzt die etwas mehrdeutige und unnatürliche Bedauernsformulierung durch eine idiomatische Wiedergabe der missmutig-widerwilligen inneren Haltung und bewahrt mit „wegen dieser Sache“ den ausdrücklich genannten Rückverweis. Die Wortstellung im Schlussteil macht zugleich klar, dass sich „bei all deinem Tun“ und „bei allem, was du mit deiner Hand unternimmst“ auf den göttlichen Segen beziehen.
