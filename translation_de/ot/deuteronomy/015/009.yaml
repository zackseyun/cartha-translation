source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: de
  text: 'Hüte dich, dass sich nicht in deinem Herzen ein verwerflicher Gedanke regt: »Das siebte Jahr, das Jahr des Erlasses[a], ist nahe«, und dass du deinen bedürftigen Bruder[b] missgünstig ansiehst[c] und ihm nichts gibst. Sonst wird er zu Yahweh gegen dich rufen, und du machst dich schuldig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Erlassjahr«. Das hebräische Wort kann Loslassen, Ruhenlassen oder Erlassen bezeichnen; im Zusammenhang von Deuteronomium 15 geht es besonders um den Erlass von Schuldforderungen im siebten Jahr.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Bruder« ist hier ein Angehöriger der Bundesgemeinschaft gemeint, nicht nur ein leiblicher Bruder.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »und dein Auge gegen deinen bedürftigen Bruder böse ist«; ein hebräisches Bild für missgünstige oder geizige Haltung, die Hilfe verweigert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Die Niphal-Imperativform mit dem Dativpronomen warnt nachdrücklich vor einer inneren Haltung. „Hüte dich davor“ ist im modernen Deutschen klar und zugleich würdevoll.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: in deinem Herzen den gewissenlosen Gedanken aufkommen zu lassen
  rationale: דָבָר bezeichnet hier angesichts von לֵאמֹר einen inneren Gedanken oder Vorsatz. בְלִיַּעַל beschreibt ihn als moralisch verwerflich; es ist hier kein Eigenname. „Gewissenlos“ bringt den gemeinschaftsschädigenden Charakter zum Ausdruck.
- source_word: קָרְבָה
  choice: ist nahe
  rationale: Das Perfekt bezeichnet hier die bereits unmittelbar bevorstehende Nähe des siebten Jahres. Die präsentische Wiedergabe ist im Deutschen natürlich.
- source_word: שְׁנַת הַשֶּׁבַע
  choice: das siebte Jahr
  rationale: Gemeint ist das siebte Jahr des gesetzlich festgelegten Siebenjahreszyklus.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: das Jahr des Schuldenerlasses
  rationale: שְׁמִטָּה bezeichnet im unmittelbaren Kontext von Deuteronomium 15 das Erlassen beziehungsweise Ruhenlassen von Schuldforderungen. „Schuldenerlass“ macht diesen konkreten Bezug verständlich, ohne die weitere Bedeutung des Begriffs zu leugnen.
- source_word: וְרָעָה עֵינְךָ
  choice: mit missgünstigem Blick anzusehen
  rationale: Die wörtliche Wendung vom „bösen Auge“ ist ein hebräisches Idiom für geizige, missgünstige Verweigerung. Die deutsche Form bewahrt das Bild des Blicks und vermittelt zugleich seine Bedeutung.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: deinen bedürftigen Bruder
  rationale: אָח wird als „Bruder“ beibehalten und bezeichnet in diesem Gesetz einen Angehörigen der Bundesgemeinschaft. אֶבְיוֹן betont Bedürftigkeit; „bedürftig“ passt besonders zum Kontext erbetener Hilfe.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: ihm nichts zu geben
  rationale: Die Formulierung gibt die praktische Folge der verneinten Handlung knapp und natürlich wieder. Der Kontext lässt insbesondere an die Verweigerung eines Darlehens denken, doch das Verb selbst bleibt allgemein.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: wird er gegen dich zu Yahweh rufen
  rationale: עַל markiert den Adressaten der Klage beziehungsweise denjenigen, gegen den sich der Hilferuf richtet. Die Verbfolge beschreibt die drohende Folge und wird deshalb futurisch wiedergegeben.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: Sünde wird auf dir liegen
  rationale: Die Wendung bezeichnet die dem Verweigernden zugerechnete Sünde beziehungsweise Schuld. „Auf dir liegen“ bewahrt den zugeschriebenen Zustand, ohne ihn auf bloße innere Sündhaftigkeit zu verengen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im Ausgangstext ausdrücklich stehende Gottesname wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname bleibt als Eigenname sichtbar. „Yahweh“ ist eine verbreitete wissenschaftlich begründete Vokalisierung; die masoretische Schreibtradition und alternative deutsche Konventionen werden nicht stillschweigend zum Haupttext gemacht.
- issue: Bild vom bösen Auge
  choice: mit missgünstigem Blick anzusehen
  alternative: dein Auge wird böse gegen ihn; ihm gegenüber geizig zu sein
  rationale: Die gewählte Form wahrt das Bild des Blicks, erklärt aber zugleich idiomatisch die missgünstige Haltung. Damit wird weder ein übernatürliches Konzept des „bösen Blicks“ importiert noch die Bildsprache vollständig beseitigt.
- issue: Bedeutung von אָחִיךָ
  choice: deinen bedürftigen Bruder
  alternative: deinen bedürftigen Volksgenossen; deinen bedürftigen Verwandten
  rationale: „Bruder“ bewahrt die familiäre Sprache des Textes. Eine Fußnote erläutert, dass im gesetzlichen Zusammenhang nicht ausschließlich ein leiblicher Bruder gemeint ist.
- issue: Art des Erlasses im siebten Jahr
  choice: Jahr des Schuldenerlasses
  alternative: Jahr der Freilassung; Erlassjahr
  rationale: Der Kontext von Deuteronomium 15,1–11 betrifft das Erlassen von Forderungen. Die Übersetzung benennt diesen Bezug, während die Fußnote die breitere lexikalische Möglichkeit offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzes- und Mahnton. Die direkte Rede bleibt knapp; die hebräische Bildsprache des Auges wird erkennbar gehalten und in einer Fußnote erläutert. Der Satzbau wurde gegenüber dem Hebräischen leicht gegliedert, ohne die Abfolge von innerem Gedanken, missgünstiger Haltung, verweigerter Hilfe, Klageruf und zugerechneter Sünde aufzulösen.
