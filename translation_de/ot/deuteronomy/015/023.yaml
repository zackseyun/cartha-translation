  text: רַ֥ק אֶת דָּמ֖/וֹ לֹ֣א תֹאכֵ֑ל עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: de
  text: Nur sein Blut darfst du nicht essen; du sollst es auf die Erde ausgießen wie Wasser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Markiert knapp und natürlich die Einschränkung gegenüber der zuvor erteilten Erlaubnis.
- source_word: אֶת דָּמוֹ
  choice: sein Blut
  rationale: Gibt das Suffix wörtlich und im Deutschen idiomatisch wieder; gemeint ist das Blut des Tieres, ohne die stärkere Deutung „Lebensblut“ einzutragen.
- source_word: לֹא תֹאכֵל
  choice: darfst du nicht essen
  rationale: Drückt das verbindliche Verbot in natürlichem modernem Deutsch aus und passt zur gesetzlichen Redeform.
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: Bezeichnet hier konkret den Erdboden, auf den das Blut gegossen wird; die traditionelle und zugleich verständliche Wendung bewahrt die Bildsprache.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: du sollst es … gießen
  rationale: Gibt die angeordnete Entsorgung des Blutes präzise wieder; das Objekt „es“ verweist eindeutig auf das Blut.
- source_word: כַּמָּיִם
  choice: wie Wasser
  rationale: Bewahrt den einfachen Vergleich unmittelbar und idiomatisch.
theological_decisions:
- issue: Umgang mit Blut im Speisegesetz
  choice: Das Verbot, das Blut des Tieres zu essen, wird ohne ergänzende theologische Begründung wiedergegeben.
  alternative: „Lebensblut“ verwenden, um den Zusammenhang von Blut und Leben hervorzuheben.
  rationale: Der Vers ordnet konkret an, das Blut nicht zu verzehren, sondern auszugießen. Die im weiteren Pentateuch erkennbare Verbindung zwischen Blut und Leben wird hier nicht ausdrücklich begründet und daher nicht in die Übersetzung eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Kombination „darfst du nicht“ und „du sollst“ unterscheidet das Verbot natürlich von der positiven Anweisung, ohne den rechtlichen Charakter abzuschwächen.
