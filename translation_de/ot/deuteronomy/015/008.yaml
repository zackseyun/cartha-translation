  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: de
  text: Sondern du sollst ihm deine Hand weit öffnen[a] und ihm so viel leihen, wie er braucht, um seinen Mangel zu beheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Öffnen sollst du deine Hand öffnen … leihen sollst du ihm leihen“ – im Hebräischen werden die Verben zur nachdrücklichen Betonung wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sondern
  rationale: Im Zusammenhang steht die Aussage im Gegensatz zur Warnung vor Hartherzigkeit und verweigerter Hilfe im vorherigen Vers. „Sondern“ gibt diesen adversativen Anschluss natürlich wieder.
- source_word: פָתֹחַ תִּפְתַּח
  choice: du sollst ... weit öffnen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. „Weit öffnen“ bewahrt das Bild der geöffneten Hand und bringt die Nachdrücklichkeit idiomatisch zum Ausdruck.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die konkrete hebräische Metapher für Freigebigkeit ist auch im Deutschen verständlich und bleibt daher erhalten.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen bezeichnet den bedürftigen Mitmenschen aus dem Kontext als Empfänger der Hilfe.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: und ihm bereitwillig leihen
  rationale: Auch hier verstärkt ein Infinitivus absolutus das finite Verb. „Bereitwillig“ vermittelt die nachdrückliche Verpflichtung in natürlichem Deutsch, ohne das Leihen als bloßes Schenken wiederzugeben.
- source_word: דֵּי
  choice: so viel ... braucht
  rationale: דֵּי bezeichnet das ausreichende Maß. Die Formulierung drückt aus, dass die Hilfe zur Deckung des Bedarfs genügen soll.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: für das, was ihm fehlt
  rationale: Die Formulierung erhält sowohl den Begriff des Mangels als auch den erläuternden Relativsatz, vermeidet aber im Deutschen eine schwerfällige wörtliche Wiederholung.
