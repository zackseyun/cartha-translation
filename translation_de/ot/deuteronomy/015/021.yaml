source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: de
  text: Wenn es aber einen Fehler hat – wenn es lahm oder blind ist oder irgendeinen schlimmen Fehler[a] hat –, sollst du es nicht Jahwe, deinem Gott, opfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »irgendeinen bösen/schlechten Fehler«; gemeint ist ein körperlicher Fehler, der das Tier als Opfer untauglich macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn es aber
  rationale: Die Wendung leitet eine Bedingung ein und stellt zugleich den Gegensatz zur vorausgehenden Anweisung her.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: es einen Fehler hat
  rationale: Wörtlich steht »in ihm ist ein Fehler«; die gewählte Formulierung ist natürliches Deutsch und bewahrt den Sinn.
- source_word: פִּסֵּחַ
  choice: lahm
  rationale: Bezeichnet eine körperliche Beeinträchtigung der Gehfähigkeit und passt präzise zum Opfertier.
- source_word: עִוֵּר
  choice: blind
  rationale: Direkte und eindeutige Wiedergabe des körperlichen Merkmals.
- source_word: כֹּל מוּם רָע
  choice: irgendeinen schlimmen Fehler
  rationale: Die relativ formnahe Wiedergabe bewahrt die wertende Schärfe von רָע, ohne sie vorschnell als »schwerwiegend« oder »unannehmbar« auszulegen.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: sollst du es nicht ... opfern
  rationale: Gibt das Verbot in der Rechtssprache natürlich wieder; »opfern« erfasst den kultischen Vorgang besser als das allgemeinere »schlachten«.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Bewahrt den Gottesnamen und die persönliche Bundesformel; die Richtung bzw. Widmung des Opfers wird durch die Einfügung in »Jahwe ... opfern« idiomatisch ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מוּם רָע
  choice: schlimmer Fehler
  alternative: schwerwiegender beziehungsweise als Opfer unannehmbarer Fehler
  rationale: Die Übersetzung wahrt die ungewöhnlich wertende hebräische Formulierung; die kultische Tragweite wird in der Fußnote erläutert, statt in den Haupttext eingetragen zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Anrede. Die Gedankenstriche bilden die erläuternde Aufzählung des Hebräischen lesbar ab; »sollst du nicht« entspricht dem rechtlichen Ton des Zusammenhangs.
