base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: de
  text: Es soll dir nicht schwerfallen, wenn du ihn von dir in die Freiheit entlässt. Denn sechs Jahre lang hat er dir gedient – doppelt so viel wert wie der Lohn eines Lohnarbeiters[a]. Und Jahwe, dein Gott, wird dich bei allem segnen, was du tust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Doppelte des Lohns eines Lohnarbeiters«. Die knappe hebräische Wendung beschreibt den Wert seiner sechsjährigen Dienstzeit im Vergleich zu entlohnter Arbeit; auch möglich: »was dem Doppelten des Lohns eines Lohnarbeiters entspricht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Es soll dir nicht schwerfallen
  rationale: Die hebräische Wendung bedeutet wörtlich, etwas solle in den Augen des Angeredeten nicht hart sein. Die gewählte Formulierung gibt den Sinn »belastend, schmerzlich oder anstößig erscheinen« natürlich wieder.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: wenn du ihn als freien Mann von dir entlässt
  rationale: Die Präposition mit dem Infinitiv bezeichnet den Zeitpunkt beziehungsweise Begleitumstand. חָפְשִׁי meint einen rechtlich freien Menschen; »von dir« bewahrt die relationale Offenheit von מֵעִמָּךְ, ohne Haushalt oder Dienstverhältnis ausdrücklich in den Text einzutragen.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: für den Gegenwert des doppelten Lohns eines Lohnarbeiters
  rationale: מִשְׁנֶה bezeichnet das Doppelte, שְׂכַר שָׂכִיר den Lohn eines angeworbenen Arbeiters. »Gegenwert« macht deutlich, dass der Satz den Wert der geleisteten Arbeit vergleicht und nicht zwingend behauptet, der Freizulassende habe diesen Lohn erhalten.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: sechs Jahre lang hat er dir … gedient
  rationale: 'Die Form wird verbal verstanden: Er hat dem Angeredeten gedient. Die Dauerangabe wird im Deutschen idiomatisch mit »sechs Jahre lang« wiedergegeben; der rechtlich gebundene Status ergibt sich aus dem Zusammenhang des Gesetzes.'
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Und Jahwe, dein Gott, wird dich … segnen
  rationale: Das Verb hat hier einen zukünftigen beziehungsweise verheißenden Sinn. Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: bei allem, was du tust
  rationale: Die umfassende Wendung schließt sämtliche Tätigkeiten und Vorhaben des Angeredeten ein und wird in natürlichem Gegenwartsdeutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« ist die geläufige deutsche Form der wissenschaftlich weithin angenommenen Aussprache und bewahrt den Charakter als Eigenname.
- issue: Ausdrückliche Benennung des rechtlich gebundenen Status
  choice: er hat dir gedient
  alternative: dein Sklave hat dir gedient; dein Knecht hat dir gedient
  rationale: עֲבָדְךָ ist hier eine Verbform mit Objektsuffix und bezeichnet das Dienen. Der Status des Mannes ist durch das umgebende Freilassungsgesetz gegeben; eine zusätzliche substantivische Bezeichnung würde die Form des vorliegenden Satzes stärker festlegen als das Hebräische.
- issue: Verhältnis der sechs Dienstjahre zum Lohn eines Lohnarbeiters
  choice: Gegenwert des doppelten Lohns
  alternative: doppelt so viel wert wie der Lohn eines Lohnarbeiters
  rationale: Die knappe hebräische Vergleichsformel lässt die genaue Berechnung unausgesprochen. Die Hauptfassung deutet sie als Wertvergleich, ohne zu behaupten, dass tatsächlich Lohn ausgezahlt wurde; die alternative Form wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Freilassungssprache. »Lohnarbeiter« ist gegenüber »Tagelöhner« gewählt, weil שָׂכִיר allgemein einen gegen Lohn angeworbenen Arbeiter bezeichnet. Die maskulinen Pronomen entsprechen der grammatischen Form und dem unmittelbaren Kontext des hebräischen Gesetzestextes.
