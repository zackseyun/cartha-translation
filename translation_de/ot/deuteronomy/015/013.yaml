base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: de
  text: Und wenn du ihn als freien Mann von dir entlässt,[a] sollst du ihn nicht mit leeren Händen entlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und falls du ihn als freien Mann von dir entlässt“. Die hebräische Konjunktion kann sowohl konditional („falls“) als auch temporal („wenn“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Und wenn
  rationale: Die Verbindung kann temporal oder konditional verstanden werden. Im Zusammenhang dieser Rechtsbestimmung ist der erwartete Fall gemeint; „Und wenn“ klingt natürlich und bewahrt zugleich die Verknüpfung mit dem Vorhergehenden.
- source_word: תְשַׁלְּחֶנּוּ
  choice: du ihn entlässt / du ihn fortschickst
  rationale: Das Piel von שלח mit Suffix bezeichnet ein Wegschicken oder Entlassen. Im ersten Satzteil verdeutlicht „entlässt“ den Zusammenhang der Freilassung; im zweiten gibt „fortschickst“ die konkrete Wiederholung idiomatisch wieder.
- source_word: חָפְשִׁי
  choice: als freien Mann
  rationale: Das Adjektiv bezeichnet einen Freien im Gegensatz zu einem in Dienstabhängigkeit Stehenden. Die Wendung ist im Deutschen klarer und natürlicher als „frei von dir entlässt“.
- source_word: מֵעִמָּךְ
  choice: von dir
  rationale: Die Präposition bedeutet wörtlich „von bei dir“. „Von dir“ bleibt nah am Wortlaut und vermeidet interpretierende Ergänzungen wie „aus deinem Dienst“ oder „aus deinem Haushalt“.
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: sollst du ihn nicht fortschicken
  rationale: Die Verbindung aus Negation und Imperfekt formuliert hier ein verbindliches Verbot. „Sollst ... nicht“ bewahrt den rechtlichen Ton in natürlichem Deutsch.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: Das Adverb bedeutet „leer“ beziehungsweise „mit nichts“. Die deutsche Redewendung bezeichnet treffend, dass der Freigelassene nicht ohne Ausstattung gehen soll.
