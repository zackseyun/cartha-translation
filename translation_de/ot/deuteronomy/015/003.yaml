  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: de
  text: Von einem Fremden darfst du die Rückzahlung einfordern[a]. Doch was du bei deinem Bruder[b] zu fordern hast, sollst du erlassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von einem Fremden darfst du Zahlung verlangen.“ Das hebräische Verb bezeichnet im Zusammenhang mit Schulden das Drängen auf Rückzahlung oder deren Eintreibung.'
    reason: lexical_alternative
  - marker: b
    text: „Bruder“ bezeichnet hier einen Angehörigen der israelitischen Bundesgemeinschaft.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „soll deine Hand loslassen“. Gemeint ist, dass der Gläubiger im Erlassjahr auf seine Forderung verzichtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: einem Fremden
  rationale: נָכְרִי bezeichnet hier einen Menschen außerhalb der israelitischen Bundesgemeinschaft. „Fremder“ bewahrt die soziale und rechtliche Unterscheidung, ohne moderne staatsrechtliche Vorstellungen in den Text einzutragen.
- source_word: תִּגֹּשׂ
  choice: darfst du die Rückzahlung einfordern
  rationale: נגשׂ bedeutet im Zusammenhang mit Schulden, einen Schuldner zur Zahlung zu drängen beziehungsweise die Zahlung einzutreiben. Die Formulierung gibt den rechtlichen Sinn in natürlichem Deutsch wieder.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ אֶת אָחִיךָ
  choice: was du bei deinem Bruder zu fordern hast
  rationale: Die offene hebräische Formulierung bezeichnet das, was dem Gläubiger gegenüber seinem Bruder zusteht. „Zu fordern hast“ macht den Schuldenkontext verständlich, ohne die Art der Forderung enger zu bestimmen.
- source_word: אָחִיךָ
  choice: deinem Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten. Im deuteronomischen Rechtszusammenhang bezeichnet sie einen Angehörigen der israelitischen Bundesgemeinschaft.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: sollst du erlassen
  rationale: Die Wendung bedeutet wörtlich, dass die Hand loslässt, und bezeichnet hier den Verzicht auf die Forderung im Erlassjahr. „Erlassen“ vermittelt diese rechtliche Handlung klar; das konkrete Bild wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutungsumfang von „dein Bruder“ im deuteronomischen Recht
  choice: Die wörtliche Bundes- und Verwandtschaftsbezeichnung „dein Bruder“ bleibt im Haupttext erhalten.
  alternative: dein israelitischer Volksgenosse
  rationale: Der Vers stellt den Fremden dem „Bruder“ innerhalb Israels gegenüber. Die wörtliche Bezeichnung bewahrt die Bundesterminologie und vermeidet eine stillschweigende Auslegung im Haupttext; der rechtlich-soziale Bezug wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext gibt den rechtlichen Sinn klar wieder, bewahrt aber mit „Bruder“ die prägende Bundesterminologie; die ungewöhnliche hebräische Hand-Metapher wird in der Fußnote erhalten.
