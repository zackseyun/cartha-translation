base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: de
  text: 'Und wenn er zu dir sagt: »Ich will nicht von dir weggehen«[a], weil er dich und dein Haus[b] liebt und weil es ihm bei dir gut geht,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich will nicht von dir hinausgehen«; gemeint ist, dass er nicht freigelassen werden und den Haushalt verlassen will.'
    reason: lexical_alternative
  - marker: b
    text: »Haus« bezeichnet hier nicht nur das Gebäude, sondern die Hausgemeinschaft und den häuslichen Lebensbereich.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die rechtssprachliche Wendung leitet einen möglichen Fall ein; »Und wenn« gibt sie im modernen Deutschen natürlich und knapp wieder.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Ich will dich nicht verlassen
  rationale: Wörtlich steht »Ich will nicht von dir hinausgehen«. Im Zusammenhang ist das Verlassen des Haushalts bei der Freilassung gemeint; die gewählte Formulierung bewahrt den relationalen Sinn in natürlichem Deutsch.
- source_word: בֵּיתֶךָ
  choice: dein Haus
  rationale: »Haus« bewahrt das hebräische Bild und kann hier wie im Deutschen die Hausgemeinschaft einschließlich Familie und Gesinde bezeichnen.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: weil es ihm bei dir gut geht
  rationale: Die idiomatische deutsche Wendung gibt den Zustand des Wohlergehens beim Herrn genau und verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist idiomatisch formuliert; »Haus« erhält bewusst die soziale Weite des hebräischen בַּיִת. Das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
