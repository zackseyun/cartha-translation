base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: de
  text: Jede männliche Erstgeburt, die bei deinen Rindern und deinem Kleinvieh geboren wird, sollst du Jahwe, deinem Gott, weihen.[a] Du sollst das erstgeborene Tier deiner Rinder nicht zur Arbeit einsetzen und das erstgeborene Tier deines Kleinviehs nicht scheren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Alle männlichen Erstgeburten, die bei deinen Rindern und deinem Kleinvieh geboren werden, sollst du … weihen.“'
    reason: כָּל mit einem singularischen Ausdruck kann distributiv („jede“) oder kollektiv („alle“) wiedergegeben werden; der Sinn bleibt im Wesentlichen gleich.
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: Jede … Erstgeburt
  rationale: כָּל mit dem singularischen Ausdruck הַבְּכוֹר ist hier am natürlichsten distributiv zu verstehen. „Jede Erstgeburt“ ist im modernen Deutsch klarer als eine wörtlich-kollektive Formulierung.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: die … geboren wird
  rationale: Der Nifal von ילד bezeichnet hier das Geborenwerden des Tieres; die Passivform bewahrt die Struktur des Hebräischen in natürlichem Deutsch.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: bei deinen Rindern und deinem Kleinvieh
  rationale: בקר bezeichnet Rinder beziehungsweise Großvieh, צאן dagegen Kleinvieh, vor allem Schafe und Ziegen. „Kleinvieh“ bewahrt den weiteren Umfang des hebräischen Begriffs.
- source_word: הַזָּכָר
  choice: männliche
  rationale: Der Ausdruck grenzt die Vorschrift ausdrücklich auf männliche Erstgeburten ein.
- source_word: תַּקְדִּישׁ
  choice: sollst du … weihen
  rationale: Der Hifil von קדש bedeutet, etwas als heilig auszusondern. „Weihen“ gibt den kultischen Sinn knapp und verständlich wieder.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Apposition „deinem Gott“ folgt dem hebräischen Ausdruck.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Du sollst das erstgeborene Tier deiner Rinder nicht zur Arbeit einsetzen
  rationale: עבד mit ב bezeichnet hier die Nutzung des Tieres zur Arbeit. Die gewählte Formulierung macht das Verbot im Deutschen eindeutig und vermeidet die missverständliche Wendung „mit dem Tier arbeiten“.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: und das erstgeborene Tier deines Kleinviehs nicht scheren
  rationale: גזז bedeutet „scheren“. „Kleinvieh“ lässt den Oberbegriff צאן bestehen, statt ihn ohne Not auf Schafe zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erstgeburt“ wahrt den kultisch-rechtlichen Charakter, während „Rinder“ und „Kleinvieh“ die beiden hebräischen Viehkategorien verständlich unterscheiden.
