  terminology: „Jahwe“ ist eine im Deutschen etablierte Wiedergabe von יהוה und wahrt den Eigennamen. „Weihen“ vermittelt die kultische Aussonderung von הקדיש; „Kleinvieh“ vermeidet eine unzulässige Beschränkung von צאן auf Schafe. Die Fußnote ist korrekt am Ausdruck „Jede“ verankert und erläutert die mögliche kollektive Lesart ohne eine Sinnabweichung zu behaupten.
