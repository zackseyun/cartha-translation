  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: de
  text: Doch[a] soll es bei dir keinen Armen geben; denn Yahweh wird dich in dem Land, das Yahweh, dein Gott, dir als Erbbesitz gibt, damit du es in Besitz nimmst, ganz gewiss segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Allerdings«, »Dennoch« oder »Nur dass«. Das hebräische אֶפֶס kennzeichnet hier eine Einschränkung oder Präzisierung der vorausgehenden Anweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Allerdings
  rationale: Das Wort leitet eine einschränkende oder kontrastierende Präzisierung der vorausgehenden Erlassbestimmung ein. »Allerdings« gibt diesen Diskurswechsel in natürlichem Deutsch wieder, ohne ihn zu stark als Ausnahme festzulegen.
- source_word: אֶבְיוֹן
  choice: Armen
  rationale: Das Substantiv bezeichnet einen wirtschaftlich armen oder bedürftigen Menschen. »Armer« ist hier die natürliche und zugleich hinreichend breite deutsche Entsprechung.
- source_word: כִּי
  choice: denn
  rationale: Das zweite כִּי begründet die Aussage mit Yahwehs Segen. »Denn« bildet den kausalen Zusammenhang würdig und idiomatisch ab.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: wird dich … ganz gewiss segnen
  rationale: Der absolute Infinitiv vor der finiten Verbform verstärkt die Aussage. »Ganz gewiss« bewahrt diese emphatische Kraft, ohne einen besonderen materiellen Umfang des Segens hinzuzufügen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als »Yahweh« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Partizip beschreibt die gegenwärtig wirksame beziehungsweise feststehende Gabe des Landes. Im Deutschen gibt das Präsens dies natürlich wieder.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Der Ausdruck bezeichnet das von Gott zugeteilte Land als bleibendes Erbe. »Erbbesitz« bewahrt sowohl den rechtlichen als auch den bundestheologischen Klang.
- source_word: לְרִשְׁתָּהּ
  choice: damit du es in Besitz nimmst
  rationale: Die Form von ירשׁ bezeichnet das Erlangen beziehungsweise Antreten des Landbesitzes. Die finale Wiedergabe macht die Funktion der hebräischen Infinitivkonstruktion deutlich und vermeidet die Wiederholung von »erben«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Umschrift »Yahweh« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über das Fehlen von Armen
  choice: sollte es … keinen Armen geben
  alternative: wird es … keinen Armen geben
  rationale: יִהְיֶה kann formal als Zukunftsaussage verstanden werden; im Zusammenhang der vorausgehenden Sozialordnung und der folgenden Segensbegründung lässt sich die Aussage jedoch auch normativ beziehungsweise erwartend lesen. »Sollte« erhält diese Spannung, ohne eine bedingungslose Behauptung zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Anrede Israels bleibt entsprechend dem hebräischen Singular bei »deiner«, »dich« und »du«. »In deiner Mitte« gibt בְּךָ natürlicher und genauer wieder als ein Wechsel zum deutschen Plural.
