base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: de
  text: 'Und dies ist die Bestimmung für den Schuldenerlass[a]: Jeder Gläubiger soll die Forderung aus einem Darlehen an seinen Nächsten erlassen. Er soll seinen Nächsten und seinen Bruder[b] nicht zur Zahlung drängen; denn für Jahwe ist ein Schuldenerlass ausgerufen worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit „Freigabe“ oder „Fallenlassen“ wiedergegeben werden. Gemeint ist das vorgeschriebene Loslassen von Schuldforderungen im Sabbatjahr.
    reason: lexical_alternative
  - marker: b
    text: '„Bruder“ bezeichnet hier einen Angehörigen der Bundesgemeinschaft; sinngemäß auch: „israelitischer Volksgenosse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: die Bestimmung für den Schuldenerlass
  rationale: דָּבָר bezeichnet hier die nun erläuterte rechtliche Regelung. שְׁמִטָּה meint im Zusammenhang des Sabbatjahres das Fallenlassen beziehungsweise Erlassen von Schuldforderungen.
- source_word: שָׁמוֹט
  choice: soll … erlassen
  rationale: Der absolute Infinitiv verstärkt die Verpflichtung. Die deutsche Soll-Form gibt den rechtlich gebietenden Charakter natürlich wieder.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: jeder Gläubiger
  rationale: Die hebräische Wendung bezeichnet den Inhaber einer aus einem Darlehen entstandenen Forderung. „Gläubiger“ ist dafür der präzise, allgemein verständliche deutsche Rechtsbegriff.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: die Forderung aus einem Darlehen an seinen Nächsten
  rationale: Die Formulierung macht im Deutschen deutlich, dass nicht das bereits übergebene Darlehensgut, sondern der daraus bestehende Anspruch erlassen wird, ohne den Gegenstand über den hebräischen Kontext hinaus festzulegen.
- source_word: לֹא יִגֹּשׂ
  choice: nicht zur Zahlung drängen
  rationale: Das Verb bezeichnet das bedrängende Einfordern einer geschuldeten Leistung. Die Wiedergabe wahrt diesen Sinn und ist im heutigen Deutsch klarer als das isolierte „nicht bedrängen“.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: „Nächster“ ist die traditionelle und weiterhin verständliche Entsprechung für רֵעַ in diesem sozialen und bundesgemeinschaftlichen Zusammenhang.
- source_word: אָחִיו
  choice: seinen Bruder
  rationale: Die wörtliche maskuline Bezeichnung wird beibehalten; ihre gemeinschaftsbezogene Bedeutung wird in einer Fußnote erläutert.
- source_word: כִּי קָרָא
  choice: denn … ist … ausgerufen worden
  rationale: Das Hebräische formuliert unpersönlich. Das deutsche Passiv gibt die öffentliche Ausrufung des Erlassjahres natürlich wieder.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Zuordnung des Schuldenerlasses zu Jahwe. „Für“ wahrt die mögliche Nuance von Zugehörigkeit, Widmung oder Vollzug in seinem Auftrag, ohne sie enger festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bedeutung von אָחִיו im rechtlich-sozialen Zusammenhang
  choice: Bruder
  alternative: Mitglied des eigenen Volkes / israelitischer Volksgenosse
  rationale: Die konkrete Ausdrucksweise des hebräischen Textes bleibt im Haupttext erhalten. Eine Fußnote erklärt, dass hier die Zugehörigkeit zur Bundesgemeinschaft im Blick steht.
- issue: Reichweite des Schuldenerlasses
  choice: Forderung erlassen
  alternative: die Einziehung vorübergehend aussetzen
  rationale: שְׁמִטָּה und שׁמט sprechen vom Fallenlassen beziehungsweise Erlassen. Ob die Forderung dauerhaft aufgehoben oder nur im Sabbatjahr nicht eingetrieben werden durfte, wird im Vers nicht ausdrücklich rechtssystematisch geklärt; die Übersetzung vermeidet eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher rechtlicher Terminologie. Die Satzstruktur bleibt nahe am hebräischen Rechtssatz, ohne unnatürliche hebräische Besitz- und Hand-Idiome wörtlich nachzubilden.
