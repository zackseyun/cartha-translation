source:
  edition: WLC
  text: רַ֚ק אִם שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: de
  text: Doch nur, wenn du genau auf die Stimme des HERRN, deines Gottes, hörst und darauf achtest, dieses ganze Gebot zu tun, das ich dir heute gebiete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: Doch nur, wenn
  rationale: Gibt die einschränkende Bedingung im Zusammenhang wieder; je nach Kontext kann die Wendung auch den Wunschton „wenn du doch nur“ tragen.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: genau ... hörst
  rationale: Der Infinitivus absolutus mit finitem Verb verstärkt das Hören; „genau hören“ vermittelt dies natürlich im Deutschen.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: auf die Stimme des HERRN, deines Gottes
  rationale: Die hebräische Verbindung „auf die Stimme hören“ schließt gehorsames Hören ein, ohne dies durch ein zusätzliches Deutungswort festzulegen. Das Tetragramm wird nach verbreiteter deutscher Bibeltradition als HERR wiedergegeben.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: darauf achtest, ... zu tun
  rationale: 'Bewahrt beide Verbalaspekte: sorgfältig beachten und praktisch ausführen.'
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: dieses ganze Gebot
  rationale: Der hebräische Singular wird erhalten; „ganz“ gibt כָּל idiomatisch wieder.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: das ich dir heute gebiete
  rationale: Direkte, formnahe Wiedergabe mit gegenwärtigem Vollzug des Gebietens.
theological_decisions:
- issue: Bedingungs- oder Wunschton von רַק אִם
  choice: 'einschränkende Bedingung: „Doch nur, wenn“'
  alternative: „Wenn du doch nur“
  rationale: Im Zusammenhang von Dtn 15,4–6 formuliert der Vers die Bedingung für die vorausgehende Verheißung. Der mögliche Wunschton bleibt lexikalisch vorhanden, wird hier aber zugunsten des syntaktischen Zusammenhangs nicht in den Vordergrund gestellt.
- issue: Semantik des Hörens
  choice: „auf die Stimme ... hören“
  alternative: „der Stimme ... gehorchen“
  rationale: Die Übersetzung bewahrt das konkrete Bild und die Spannung zwischen Hören und Gehorsam, statt den theologischen Vollsinn ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch „darauf achtest“ flüssig und verständlich gestaltet.
