  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: de
  text: Dann sollst du die Ahle nehmen und sie durch sein Ohr in die Tür stechen. So wird er auf Dauer dein Sklave sein.[a] Mit deiner Sklavin sollst du ebenso verfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: für immer; im rechtlichen Zusammenhang kann der hebräische Ausdruck auch lebenslang bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: die Ahle
  rationale: מַרְצֵעַ bezeichnet ein spitzes Werkzeug zum Durchbohren; „Ahle“ ist die präzise und im Deutschen geläufige Bezeichnung.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: sie durch sein Ohr in die Tür stechen
  rationale: Wörtlich steht, die Ahle „in/an sein Ohr und in/an die Tür“ zu bringen. Der Zusammenhang beschreibt ein Durchbohren des Ohres an der Tür; die Formulierung macht den Vorgang verständlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im rechtlichen Zusammenhang bezeichnet עֶבֶד einen Menschen in einem bindenden Abhängigkeitsverhältnis. „Sklave“ bewahrt diese soziale und rechtliche Schärfe besser als das mildere „Diener“.
- source_word: עוֹלָם
  choice: auf Dauer
  rationale: עוֹלָם bezeichnet hier den bleibenden Charakter des Rechtsverhältnisses, ohne zwingend metaphysische Endlosigkeit auszudrücken. „Auf Dauer“ lässt die im rechtlichen Kontext mögliche Bedeutung „lebenslang“ offen.
- source_word: אֲמָתְךָ
  choice: deine Sklavin
  rationale: אָמָה bezeichnet eine weibliche Sklavin beziehungsweise unfreie Dienerin. „Sklavin“ entspricht der Wiedergabe von עֶבֶד und erhält die rechtliche Aussagekraft.
- source_word: וְאַף ... תַּעֲשֶׂה כֵּן
  choice: Mit deiner Sklavin sollst du ebenso verfahren
  rationale: וְאַף erweitert die Vorschrift ausdrücklich auf die Sklavin; תַּעֲשֶׂה כֵּן bedeutet idiomatisch „ebenso verfahren“.
theological_decisions:
- issue: Bezeichnung des unfreien Status im israelitischen Dienstrecht
  choice: „Sklave“ und „Sklavin“
  alternative: „Diener“ und „Dienerin“ beziehungsweise „Knecht“ und „Magd“
  rationale: Der Vers regelt einen förmlich besiegelten, fortdauernden Status persönlicher Unfreiheit. Die gewählte Bezeichnung gibt die sozialrechtliche Härte wieder, ohne das Verhältnis durch beschönigende oder altertümliche Begriffe abzuschwächen.
- issue: Zeitliche Tragweite von עוֹלָם
  choice: „auf Dauer“ mit Fußnote
  alternative: „für immer“ oder „lebenslang“
  rationale: Der hebräische Ausdruck betont Beständigkeit, kann in diesem Rechtszusammenhang aber unterschiedlich bestimmt werden. Der Haupttext vermeidet sowohl eine unbegrenzte metaphysische Lesart als auch die Festlegung auf eine ausdrücklich lebenslange Dauer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Soll-Form bleibt erhalten; „ebenso verfahren“ ist natürlich und sachlich. Der Fußnotenmarker steht unmittelbar bei der zeitlich mehrdeutigen Wendung.
