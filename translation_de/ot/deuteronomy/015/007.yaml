  terminology: »Jahwe« gibt den Gottesnamen als Eigennamen wieder. »Brüder/Bruder« bewahrt die maskuline familiale Bundesgemeinschaftssprache, ohne sie im Haupttext interpretierend zu erweitern. Die Fußnoten erläutern sowohl die Tor-Stadt-Metonymie als auch den nicht ausschließlich leiblichen Sinn von »Bruder« angemessen.
