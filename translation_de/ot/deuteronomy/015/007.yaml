source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: de
  text: Wenn es bei dir einen Armen gibt, einen deiner Brüder, in einer deiner Städte[a], in deinem Land, das Jahwe, dein Gott, dir gibt, dann verhärte dein Herz nicht und verschließe deine Hand nicht vor deinem armen Bruder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einem deiner Tore«; das Tor steht hier für die betreffende Stadt oder Ortschaft.'
    reason: lexical_alternative
  - marker: b
    text: »Bruder« bezeichnet hier ein Mitglied der Bundesgemeinschaft, nicht nur einen leiblichen Bruder.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Wenn es … gibt
  rationale: Die Verbindung eröffnet einen kasuistischen Bedingungssatz; im Deutschen gibt das Präsens eine allgemein geltende Rechtsweisung natürlich wieder.
- source_word: אֶבְיוֹן
  choice: einen Armen
  rationale: Bezeichnet einen armen bzw. bedürftigen Menschen. Die substantivierte Form bewahrt hier den maskulinen Singular und klingt zugleich natürlich.
- source_word: מֵאַחַד אַחֶיךָ
  choice: einen deiner Brüder
  rationale: Bewahrt die familiäre Sprache für ein Mitglied der Bundesgemeinschaft; das etwas ungewöhnliche hebräische מִן mit אֶחָד wird idiomatisch wiedergegeben.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: in einer deiner Städte
  rationale: Wörtlich ist von einem der »Tore« die Rede; metonymisch bezeichnet die Wendung die zugehörige Stadt bzw. Ortschaft. Die natürliche Bedeutung steht im Haupttext, das Bild in der Fußnote.
- source_word: בְּאַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: in deinem Land, das Jahwe, dein Gott, dir gibt
  rationale: Das Präsens gibt das Partizip נֹתֵן angemessen wieder und bewahrt den Charakter des Landes als fortdauernde göttliche Gabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen als gebräuchliche wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: verhärte dein Herz nicht
  rationale: Bewahrt das hebräische Körperbild und gibt die gemeinte innere Unnachgiebigkeit verständlich wieder.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: und verschließe deine Hand nicht
  rationale: Erhält das anschauliche Bild der geschlossenen, nicht gebenden Hand; »verschließen« ist im Deutschen würdevoll und verständlich.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: vor deinem armen Bruder
  rationale: Bei »die Hand verschließen« bezeichnet »vor« idiomatisch die Person, der Hilfe verweigert wird, und entspricht dem relationalen Sinn von מִן.
theological_decisions:
- issue: Bundesgemeinschaftliche Verwandtschaftssprache אַחֶיךָ / אָחִיךָ
  choice: Brüder / Bruder
  alternative: Angehörige; Mitisraeliten
  rationale: Die wörtliche Verwandtschaftssprache prägt die wirtschaftliche Pflicht als Verantwortung innerhalb der Bundesgemeinschaft. Eine Fußnote erläutert den gemeinschaftlichen Bezug, ohne das Bild im Text einzuebnen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält einen Eigennamen. »Jahwe« bewahrt diesen Status und vermeidet die Ersetzung durch einen Titel.
- issue: Reichweite des maskulinen Singulars אֶבְיוֹן / אָחִיךָ
  choice: einen Armen / armen Bruder
  alternative: eine arme Person / bedürftiges Mitglied der Gemeinschaft
  rationale: Die grammatische Form und die familiäre Bildsprache bleiben erhalten; zugleich erklärt die Fußnote, dass die Rechtsweisung ein Mitglied der Bundesgemeinschaft bezeichnet und nicht auf leibliche Brüder beschränkt ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Imperative geben die hebräischen Verbote direkt wieder. Das konkrete Bild von Herz und Hand bleibt erhalten; nur die metonymische Wendung mit »Tor« wird im Haupttext natürlich als »Stadt« wiedergegeben.
