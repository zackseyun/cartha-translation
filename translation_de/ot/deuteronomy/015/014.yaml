  source_fidelity: Die Übersetzung gibt die emphatische hebräische Verbform הַעֲנֵיק תַּעֲנִיק angemessen mit „reichlich ausstatten“ wieder. Die dreigliedrige Herkunftsangabe (Herde, Tenne, Kelter) bleibt konkret erhalten, und „von dem, womit … dich gesegnet hat“ bildet den Bezug auf Gottes gewährten Segen treffend ab. Die abschließende Verpflichtung „sollst du ihm geben“ entspricht תִּתֶּן לוֹ.
