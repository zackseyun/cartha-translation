base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: de
  text: Du sollst ihn reichlich ausstatten[a] – aus deiner Herde, von deiner Tenne und aus deiner Kelter. Von dem, womit Jahwe, dein Gott, dich gesegnet hat, sollst du ihm geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Du sollst ihn gut versorgen.« Im Hebräischen wird das Verb durch eine emphatische Konstruktion verstärkt; gemeint ist eine reichliche Versorgung bei seiner Freilassung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: du sollst ihn reichlich ausstatten
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt das Gebot. „Reichlich ausstatten“ gibt sowohl die nachdrückliche Formulierung als auch den Sinn einer großzügigen Versorgung bei der Freilassung in natürlichem Deutsch wieder.
- source_word: מִצֹּאנְךָ
  choice: aus deiner Herde
  rationale: צֹאן bezeichnet als Kollektiv Kleinvieh, besonders Schafe und Ziegen. „Herde“ bewahrt das landwirtschaftliche Bild, ohne den Umfang unnötig einzuengen.
- source_word: וּמִגָּרְנְךָ
  choice: von deiner Tenne
  rationale: גֹּרֶן ist wörtlich die Tenne und steht hier zugleich für ihren Ertrag. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: וּמִיִּקְבֶךָ
  choice: aus deiner Kelter
  rationale: יֶקֶב bezeichnet eine Kelter beziehungsweise einen Kelterbehälter. „Kelter“ ist im landwirtschaftlichen Zusammenhang klar und bewahrt die konkrete Dreierreihe.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: von dem, womit Jahwe, dein Gott, dich gesegnet hat
  rationale: Die Relativkonstruktion stellt die Gabe als Anteil an dem dar, was der Geber zuvor als Segen Gottes empfangen hat. Die Formulierung bewahrt diesen Herkunftsbezug, ohne eine genaue Mengenregel hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תִּתֶּן לוֹ
  choice: sollst du ihm geben
  rationale: Die abschließende Wendung wiederholt die Verpflichtung ausdrücklich und bleibt in natürlichem Deutsch nahe an der hebräischen Satzstruktur.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht das Tetragramm als persönlicher Gottesname. „Jahwe“ bewahrt diese Funktion, statt den Namen durch einen Titel zu ersetzen.
- issue: Stärke des Gebots הַעֲנֵיק תַּעֲנִיק
  choice: reichlich ausstatten
  alternative: ausstatten
  rationale: Die emphatische hebräische Verbalkonstruktion verlangt eine erkennbare Verstärkung. „Reichlich“ macht den Nachdruck sichtbar, ohne eine bestimmte Menge festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete landwirtschaftliche Bildfolge Herde–Tenne–Kelter bleibt erhalten; der zweite Satz bildet die hebräische Wiederaufnahme des Gebens ab.
