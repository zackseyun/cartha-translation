  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: de
  text: Und du sollst daran denken, dass du im Land Ägypten ein Sklave warst und dass Jahwe, dein Gott, dich erlöst[a] hat. Darum gebiete ich dir heute dies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „losgekauft“ beziehungsweise „freigekauft“. Das hebräische Verb bezeichnet die Erlösung oder Befreiung aus Gebundenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Und du sollst daran denken
  rationale: Die Form wirkt im gesetzlichen Zusammenhang als Aufforderung. „Du sollst daran denken“ bewahrt den verpflichtenden Ton und ist im Deutschen natürlich.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im Zusammenhang der ägyptischen Knechtschaft steht der gebundene und unterdrückte Status im Vordergrund; „Sklave“ gibt diesen Sinn deutlicher wieder als „Diener“.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Bewahrt die konkrete hebräische Wendung, ohne sie zum bloßen „in Ägypten“ zu verkürzen.
- source_word: וַיִּפְדְּךָ
  choice: dich erlöst hat
  rationale: פדה bezeichnet das Loskaufen beziehungsweise Befreien aus Gebundenheit. „Erlöst“ wahrt sowohl den konkreten als auch den theologischen Gehalt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext ausdrücklich verwendeten Gottesnamen wieder.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte Wiedergabe der Verbindung mit dem Suffix der zweiten Person Singular.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus Gottes Erlösungstat.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: gebiete ich dir
  rationale: Die betonte erste Person und das Partizip drücken eine gegenwärtige, ausdrückliche Anordnung aus. Die deutsche Verb-Erststellung nach „Darum“ trägt den Nachdruck natürlich.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: dies
  rationale: Das Demonstrativpronomen verweist im Deutschen idiomatisch auf die unmittelbar behandelte Anweisung; „diese Sache“ wäre unnötig schwerfällig, „dieses Gebot“ enger als das hebräische דָּבָר.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und idiomatische Wiedergabe des Zeitadverbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sozialstatus עֶבֶד in der Erinnerung an Ägypten
  choice: Sklave
  alternative: Diener
  rationale: Der Kontext bezeichnet Israels erzwungene Knechtschaft in Ägypten. „Sklave“ wahrt deren historischen und ethischen Ernst.
- issue: Bedeutungsumfang von פדה
  choice: erlöst
  alternative: losgekauft
  rationale: „Erlöst“ lässt sowohl die konkrete Befreiung aus der Sklaverei als auch die theologische Tragweite bestehen; die mögliche Lösegeld- beziehungsweise Loskaufnuance wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem hebräischen Begründungszusammenhang nahe, vermeidet aber unnatürliche Formulierungen wie „diese Sache“. Das wiederholte „dass“ verdeutlicht, dass sowohl die frühere Sklaverei als auch Jahwes Erlösung Gegenstand des Erinnerns sind.
