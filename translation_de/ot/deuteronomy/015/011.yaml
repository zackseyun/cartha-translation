id: DEU.15.11
reference: Deuteronomy 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: de
  text: 'Denn Bedürftige wird es im Land immer geben. Darum gebiete ich dir: Öffne deine Hand weit für deinen Bruder[a], für den Notleidenden[b] und den Bedürftigen in deinem Land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Bruder“ ist hier ein Angehöriger des Bundesvolkes gemeint; der Ausdruck wird stellvertretend gebraucht.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann einen armen, erniedrigten oder bedrängten Menschen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Gebot ein und gibt den erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: לֹא יֶחְדַּל
  choice: wird es … immer geben
  rationale: Die verneinte Verbform bezeichnet eine fortdauernde Wirklichkeit. Die positive deutsche Wendung ist idiomatisch und entspricht sinngemäß dem hebräischen ‚wird nicht aufhören/fehlen‘.
- source_word: אֶבְיוֹן
  choice: Bedürftige / den Bedürftigen
  rationale: Das singularische Substantiv wird im ersten Satz kollektiv gebraucht. ‚Bedürftig‘ erfasst die wirtschaftliche Notlage und bleibt vom folgenden עָנִי unterscheidbar.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: im Land
  rationale: קֶרֶב bezeichnet das Innere beziehungsweise die Mitte; im natürlichen Deutschen genügt hier ‚im Land‘. הָאָרֶץ meint im deuteronomischen Zusammenhang das Bundesland, nicht abstrakt die ganze Erde.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem ersten Satz knapp und klar.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: gebiete ich dir
  rationale: Bewahrt die unmittelbare, autoritative Form des gegenwärtig ergehenden Gebots in würdigem, verständlichem Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im Deutschen natürlich die Funktion der hebräischen Einleitungsformel ‚indem ich sage‘.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: Öffne … weit
  rationale: Infinitivus absolutus und finite Verbform verstärken das Gebot. ‚Weit öffnen‘ bewahrt sowohl die Betonung als auch das Bild großzügigen Gebens.
- source_word: אֶת יָדְךָ
  choice: deine Hand
  rationale: Das hebräische Bild für Freigebigkeit bleibt erhalten.
- source_word: לְאָחִיךָ
  choice: für deinen Bruder
  rationale: Bewahrt die männliche Singularform und die familiär-bundestheologische Sprache; der repräsentative Sinn wird in einer Fußnote erläutert.
- source_word: לַעֲנִיֶּךָ
  choice: für den Notleidenden
  rationale: עָנִי kann einen Armen, Erniedrigten oder Bedrängten bezeichnen. ‚Notleidender‘ hält diese Bedeutungsbreite offen und unterscheidet den Ausdruck von אֶבְיוֹן.
- source_word: וּלְאֶבְיֹנְךָ
  choice: und den Bedürftigen
  rationale: Gibt den zweiten Armutsbegriff eigenständig wieder und stellt zugleich die lexikalische Verbindung zum ersten Satz her.
theological_decisions:
- issue: Repräsentative Verwandtschaftssprache
  choice: deinen Bruder
  alternative: deinen israelitischen Mitmenschen
  rationale: Das Hebräische verwendet die Sprache familiärer Zugehörigkeit innerhalb des Bundesvolkes. ‚Bruder‘ bewahrt dieses Bild, ohne den repräsentativen Gebrauch auf Männer allein zu beschränken.
- issue: Bezugsbereich von הָאָרֶץ / אַרְצֶךָ
  choice: Land / deinem Land
  alternative: Erde / deinem Land
  rationale: Im unmittelbaren Zusammenhang des Deuteronomiums ist das Israel verheißene Land gemeint. Die Übersetzung vermeidet deshalb eine vom Kontext gelöste Aussage über die gesamte Erde.
- issue: Verhältnis der drei Empfängerbezeichnungen
  choice: Bruder, Notleidender und Bedürftiger als parallele, einander erläuternde Bezeichnungen
  alternative: drei voneinander getrennte Personengruppen
  rationale: Die Folge singularischer Ausdrücke kann appositionell beziehungsweise beschreibend verstanden werden. Die deutsche Fassung lässt ihre genaue Beziehung offen und macht daraus nicht ausdrücklich getrennte Gruppen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Bild der geöffneten Hand und die bundeshafte Anrede „Bruder“ bleiben erhalten. Die verstärkte hebräische Verbform wird mit „weit öffnen“ wiedergegeben; unnötig altertümliche Formulierungen werden vermieden.
