base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: de
  text: Dann sollst du diesen Mann oder diese Frau, die diese böse Tat[a] begangen haben, zu deinen Toren[b] hinausführen — den Mann oder die Frau — und sie mit Steinen steinigen, und sie werden sterben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese böse Sache“ beziehungsweise „diese böse Angelegenheit“. Das hebräische Wort kann im rechtlichen Zusammenhang sowohl eine Sache als auch eine Tat bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Toren“ sind die Stadttore gemeint. Sie waren im alten Israel übliche öffentliche Orte für Gerichtsverhandlungen und rechtliche Entscheidungen.
    reason: cultural_note
  - marker: c
    text: Der hebräische Text spricht zunächst alternativ von „diesem Mann oder dieser Frau“, verwendet bei „begangen haben“, „sie“ und „werden sterben“ jedoch die Mehrzahl.
    reason: grammatical_note
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: Dann sollst du … hinausführen
  rationale: Das mit Waw verbundene Perfekt setzt die rechtliche Verfahrensfolge fort. „Dann sollst du“ gibt diese Abfolge und den verpflichtenden Charakter wieder; „hinausführen“ entspricht dem Kontext einer Hinrichtung außerhalb des unmittelbaren Wohnbereichs beziehungsweise am Stadttor.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת־הָאִשָּׁה הַהִוא
  choice: diesen Mann oder diese Frau
  rationale: Artikel und Demonstrativpronomen bezeichnen die zuvor festgestellte schuldige Person ausdrücklich; zugleich bleibt die im Hebräischen genannte Unterscheidung zwischen Mann und Frau erhalten.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: diese böse Tat
  rationale: דָּבָר kann „Sache“, „Angelegenheit“ oder „Tat“ bezeichnen. Im gerichtlichen Zusammenhang ist „Tat“ im Deutschen natürlich, während eine Fußnote die weitere Bedeutungsmöglichkeit bewahrt.
- source_word: אֶל־שְׁעָרֶיךָ
  choice: zu deinen Toren
  rationale: Die Mehrzahl des hebräischen Ausdrucks bleibt erhalten. Die Tore waren in den israelitischen Ortschaften öffentliche Orte der Rechtsprechung; diese kulturelle Bedeutung wird in einer Fußnote erklärt.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: und sie mit Steinen steinigen
  rationale: Die ausdrückliche Nennung der Steine wird trotz der im Deutschen entstehenden Wiederholung beibehalten, da auch der hebräische Text sowohl das Verb als auch das Mittel nennt.
- source_word: וָמֵתוּ
  choice: und sie werden sterben
  rationale: Die Form bezeichnet hier das eintretende Ergebnis der Hinrichtung. Das Futur gibt dieses Ergebnis wieder, ohne eine zusätzliche Zweckangabe oder eine nicht ausdrücklich formulierte Modalität einzuführen.
theological_decisions:
- issue: Geschlechtsspezifische Rechtsformulierung
  choice: diesen Mann oder diese Frau
  alternative: diese Person
  rationale: Der Ausgangstext nennt Mann und Frau ausdrücklich. Die Übersetzung neutralisiert diese Formulierung nicht.
- issue: Ort des gerichtlichen Vollzugs
  choice: zu deinen Toren
  alternative: zum öffentlichen Gerichtsplatz
  rationale: Die konkrete Bildsprache des Ausgangstextes bleibt im Haupttext erhalten; die historische Funktion der Tore wird nicht paraphrasierend in den Vers eingetragen, sondern in einer Fußnote erläutert.
- issue: Wechsel von der Einzahlalternative zu Mehrzahlformen
  choice: die … begangen haben; sie … werden sterben
  alternative: der beziehungsweise die … begangen hat; ihn oder sie … sodass er oder sie stirbt
  rationale: Der hebräische Text nennt alternativ einen Mann oder eine Frau, verwendet danach jedoch mehrfach grammatische Mehrzahlformen. Die Übersetzung bewahrt diese auffällige Spannung und erklärt sie in einer Fußnote, statt sie stillschweigend auszugleichen.
translation_notes:
  register: Moderne, würdige Rechtssprache mit unmittelbarer Anrede in der Einzahl. Die Wiederholung „den Mann oder die Frau“ und die konkrete Wendung „mit Steinen steinigen“ bleiben erhalten, weil sie die nachdrückliche Form des hebräischen Gesetzestextes abbilden. Gedankenstriche gliedern die wiederholte Apposition, ohne sie abzuschwächen.
