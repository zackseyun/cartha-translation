source:
  edition: WLC
  text: וּ/בָאתָ֗ אֶל הַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם וְ/אֶל הַ/שֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/דָרַשְׁתָּ֙ וְ/הִגִּ֣ידוּ לְ/ךָ֔ אֵ֖ת דְּבַ֥ר הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: de
  text: Dann sollst du zu den levitischen Priestern und zu dem Richter gehen, der zu jener Zeit im Amt ist, und sie befragen. Sie werden dir die Entscheidung in dem Rechtsfall mitteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Wort des Rechtsspruchs“. Gemeint ist die verbindliche richterliche Entscheidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Dann sollst du … gehen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die rechtliche Anweisung fort. Im Deutschen bezeichnet „gehen“ natürlich die Bewegung des Angesprochenen zur zuständigen Instanz; „sollst“ bewahrt den verpflichtenden Charakter.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die Apposition bestimmt die Priester als dem Stamm Levi zugehörig, ohne zu behaupten, alle Leviten seien Priester.
- source_word: הַשֹּׁפֵט אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: der Richter, der zu jener Zeit im Amt ist
  rationale: Die Wendung meint den jeweils amtierenden Richter. „Im Amt“ gibt diesen institutionellen Bezug in natürlichem Deutsch wieder.
- source_word: וְדָרַשְׁתָּ
  choice: sie befragen
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb das Einholen einer autoritativen Auskunft oder Entscheidung. Das ergänzte Pronomen nimmt beide zuvor genannten Instanzen auf.
- source_word: וְהִגִּידוּ לְךָ
  choice: Sie werden dir … mitteilen
  rationale: Der Hiphil von נגד bezeichnet hier die verbindliche Bekanntgabe. „Mitteilen“ ist im modernen Deutschen klar und angemessen förmlich.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: die Entscheidung in dem Rechtsfall
  rationale: Wörtlich „das Wort der Rechtsprechung/des Urteils“; im Kontext ist die autoritative richterliche Entscheidung gemeint. Eine Fußnote bewahrt die formale Ausdrucksweise.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Anweisung wird mit „sollst“ wiedergegeben; der abschließende Plural des Hebräischen bleibt durch „sie“ erhalten.
