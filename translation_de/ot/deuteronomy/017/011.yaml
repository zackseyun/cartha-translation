source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: de
  text: Nach der Weisung[a], die sie dir erteilen, und nach dem Rechtsspruch, den sie dir mitteilen, sollst du handeln. Von dem Wort[b], das sie dir verkünden, sollst du weder nach rechts noch nach links abweichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Gesetz« oder »der Unterweisung« (hebräisch tora).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Sache« oder »der Entscheidung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: nach
  rationale: Die hebräische Wendung bedeutet hier »gemäß« oder »in Übereinstimmung mit«. In Verbindung mit »Weisung« klingt »nach« im Deutschen natürlich und behält die rechtliche Verbindlichkeit bei.
- source_word: הַתּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה bezeichnet grundlegend Unterweisung oder Weisung. Im gerichtlichen Zusammenhang ist die verbindliche Anweisung für den vorliegenden Fall gemeint; »Weisung« vermeidet eine vorschnelle Verengung auf ein kodifiziertes Gesetz.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: die sie dir erteilen
  rationale: Der Hifil von ירה bedeutet hier anweisen oder unterweisen. »Eine Weisung erteilen« ist eine natürliche deutsche Verbindung und gibt die autoritative Anleitung wieder.
- source_word: הַמִּשְׁפָּט
  choice: der Rechtsspruch
  rationale: מִשְׁפָּט bezeichnet in diesem gerichtlichen Kontext eine Entscheidung beziehungsweise einen verbindlichen Spruch. »Rechtsspruch« macht den juristischen Zusammenhang deutlich, ohne über den Einzelfall hinauszugehen.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: den sie dir mitteilen
  rationale: אָמַר heißt gewöhnlich »sagen«. »Mitteilen« ist hier idiomatisches Deutsch für die Bekanntgabe der gerichtlichen Entscheidung.
- source_word: תַּעֲשֶׂה
  choice: sollst du handeln
  rationale: Das Imperfekt hat verpflichtende Funktion. »Sollst du handeln« bewahrt den Gebotscharakter und bezieht das Tun natürlich auf Weisung und Rechtsspruch.
- source_word: לֹא תָסוּר
  choice: sollst du … nicht abweichen
  rationale: סוּר bedeutet abweichen, sich abwenden oder beiseitetreten. »Abweichen« passt im Deutschen zur anschließenden Richtungsformel.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. »Wort« erhält die Einzahl und die feierliche Formulierung; der Kontext kennzeichnet es als autoritative Entscheidung.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: das sie dir verkünden
  rationale: Der Hifil von נגד bedeutet bekannt machen, mitteilen oder verkünden. »Verkünden« entspricht dem förmlichen gerichtlichen Zusammenhang und wahrt die Nuance gegenüber dem vorangehenden אָמַר.
- source_word: יָמִין וּשְׂמֹאל
  choice: weder nach rechts noch nach links
  rationale: Die feste Richtungsformel bezeichnet jede Abweichung. Die deutsche Paarformel »weder … noch« gibt den umfassenden negativen Sinn klar wieder.
theological_decisions:
- issue: Reichweite des Gehorsams gegenüber priesterlicher und richterlicher Autorität
  choice: Der Vers gebietet, der im behandelten Fall erteilten autoritativen Weisung und gerichtlichen Entscheidung zu folgen.
  alternative: Eine uneingeschränkte oder unfehlbare Autorität späterer religiöser Institutionen aus dem Vers abzuleiten.
  rationale: Der hebräische Text steht im Rahmen des Bundesrechts Israels und des dort geregelten Gerichtsverfahrens. Die Übersetzung bewahrt die verbindliche Kraft des Gebots, ohne weitergehende ekklesiologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem Rechtsregister. »Weisung erteilen«, »Rechtsspruch« und »verkünden« tragen die formelle Autorität des Zusammenhangs, bleiben aber für heutige Leser verständlich. Die Satzteilung verbessert die Lesbarkeit, ohne die Parallelstruktur oder die Verpflichtung des hebräischen Textes abzuschwächen.
