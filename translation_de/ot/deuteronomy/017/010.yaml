  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: de
  text: Du sollst nach dem Spruch handeln, den sie dir von jenem Ort verkünden werden, den Jahwe erwählen wird,[a] und darauf achten, alles so zu tun, wie sie dich anweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der Entscheidung handeln, die sie dir … bekannt geben werden“. Das hebräische Wort דָּבָר kann „Wort“, „Sache“ oder im gerichtlichen Zusammenhang „Entscheidung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ עַל פִּי הַדָּבָר
  choice: Du sollst nach dem Spruch handeln
  rationale: עשה bezeichnet hier das entsprechende Handeln; עַל־פִּי drückt die maßgebliche Grundlage aus. „Spruch“ gibt דָּבָר im gerichtlichen Zusammenhang als autoritative Äußerung wieder, ohne es bereits eindeutig auf „Entscheidung“ festzulegen.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: den sie dir … verkünden werden
  rationale: Der Hifil von נגד bezeichnet ein Bekanntmachen oder Verkünden. Das Futur passt zum vorausblickenden Gesetzeskontext und der förmlichen Mitteilung.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: von jenem Ort aus … den Jahwe erwählen wird
  rationale: „Von … aus“ gibt den Ausgangspunkt der autoritativen Verkündung natürlich wieder. Das Yiqtol יִבְחַר ist im Kontext zukunftsbezogen; יְהוָה wird als persönlicher Name „Jahwe“ wiedergegeben.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: und sorgfältig … tun
  rationale: שׁמר mit Infinitiv verlangt aufmerksame, gewissenhafte Befolgung. Die deutsche Formulierung ist knapp und bewahrt den verpflichtenden Gesetzesstil.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: alles tun, was sie dich anweisen
  rationale: Der Hifil von ירה kann „lehren, unterweisen, anweisen“ bedeuten. Im Rechtskontext bezeichnet „anweisen“ eine autoritative Weisung, ohne den Ausdruck unnötig auf Unterricht oder ein Einzelurteil zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im Deutschen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der priesterlich-richterlichen Weisung
  choice: sprachlich als verbindliche Anweisung wiedergegeben
  alternative: eine ausdrücklich unbegrenzte religiöse Lehrvollmacht formulieren
  rationale: Der Vers fordert umfassende Befolgung der im konkreten Rechtsverfahren erteilten Weisung. Die Übersetzung bewahrt diese Verbindlichkeit, importiert aber keine über den Kontext hinausgehende konfessionelle Amtslehre.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. „Spruch“ wahrt die sachliche und gerichtliche Färbung sowie die Bedeutungsbreite von דָּבָר; die Fußnote nennt die kontextuell naheliegende Alternative „Entscheidung“. Die Satzstruktur bleibt nahe am Hebräischen, ist aber idiomatisch deutsch.
