source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: de
  text: Doch der Mann, der vermessen handelt und nicht auf den Priester hört, der dort steht, um Jahwe, deinem Gott, zu dienen, oder auf den Richter – dieser Mann soll sterben.[a] So sollst du das Böse aus Israel wegschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Nicht auf ... hört“ kann hier auch „nicht auf ... hört und gehorcht“ oder „nicht ... befolgt“ bedeuten. Gemeint ist die bewusste, trotzige Missachtung der verbindlichen Entscheidung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Doch der Mann
  rationale: Das וְ führt den Rechtsfall fort und markiert hier den Gegensatz zur zuvor geforderten Befolgung des Urteils. אִישׁ bleibt als maskuliner Singular erhalten.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: vermessen handelt
  rationale: Die Wendung bezeichnet bewusstes, anmaßendes und trotziges Handeln, nicht ein versehentliches Versäumnis.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: nicht ... hört
  rationale: שׁמע bedeutet wörtlich hören, umfasst im rechtlichen Zusammenhang aber auch das Befolgen. Die Formulierung bewahrt das hebräische Bild, ohne den Gehorsamsaspekt auszuschließen.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם אֶת יְהוָה אֱלֹהֶיךָ
  choice: der dort steht, um Jahwe, deinem Gott, zu dienen
  rationale: Die Partizipialkonstruktion beschreibt die amtliche priesterliche Tätigkeit. אֶת nach שׁרת kennzeichnet den, dem gedient wird; daher ist „Jahwe ... zu dienen“ quellennah und im Deutschen natürlich.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: oder auf den Richter
  rationale: שֹׁפֵט bezeichnet die richterliche Autorität; die Wiederaufnahme von „auf ... hört“ macht die Zuordnung im Deutschen eindeutig.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: dieser Mann soll sterben
  rationale: Die Verbform formuliert im Rechtskontext die verbindliche Straf Folge. „Soll sterben“ bewahrt den gesetzlichen Ton, ohne eine Vollstreckungsweise hinzuzufügen.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: So sollst du das Böse aus Israel wegschaffen
  rationale: בער bezeichnet in der deuteronomischen Rechtsformel die Beseitigung des Bösen aus der Gemeinschaft. „Wegschaffen“ ist verständlich und erhält sowohl die Handlung als auch die Formelhaftigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersetzung durch den Titel „der HERR“ bleibt eine mögliche Editionskonvention, wird hier aber nicht in den Haupttext übernommen.
- issue: Maskuliner Singular für den Rechtsbrecher
  choice: der Mann / dieser Mann
  alternative: die Person / wer
  rationale: אִישׁ und das Demonstrativum stehen im maskulinen Singular. Die Übersetzung bewahrt diese konkrete grammatische Form, ohne über den Anwendungsbereich des Gesetzes hinausgehende Aussagen zu treffen.
- issue: Bedeutung von שׁמע im Rechtskontext
  choice: hört
  alternative: gehorcht
  rationale: Der Grundsinn „hören“ bleibt sichtbar, während der Kontext eindeutig ein Beachten beziehungsweise Befolgen der verbindlichen Entscheidung meint. Diese Spannung wird nicht durch eine rein interpretierende Wiedergabe aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ton. „Vermessen“ bildet den vorsätzlichen Trotz knapp ab; „wegschaffen“ ist verständlicher als das fachsprachlichere „ausmerzen“. Der Gedankenstrich gliedert die lange Rechtsbestimmung. Alle Fußnotenmarker stehen im Haupttext.
