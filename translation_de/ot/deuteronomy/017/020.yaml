base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: de
  text: damit sich sein Herz nicht über seine Brüder[a] erhebt und damit er weder nach rechts noch nach links von dem Gebot abweicht, damit er und seine Söhne lange Zeit die Königsherrschaft in Israel innehaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über seine israelitischen Volksgenossen“. Wörtlich steht im Hebräischen „über seine Brüder“; dies ist Sprache der Bundesgemeinschaft.'
    reason: lexikalische Alternative und Erläuterung der Verwandtschaftssprache
lexical_decisions:
- source_word: לְבִלְתִּי
  choice: damit … nicht
  rationale: Die Konstruktion bezeichnet hier einen verneinten Zweck beziehungsweise eine beabsichtigte Vorbeugung und wird so im Deutschen natürlich wiedergegeben.
- source_word: רוּם לְבָבוֹ
  choice: sich sein Herz … erhebt
  rationale: Bewahrt das hebräische Bild für innere Überheblichkeit, ohne es durch eine rein deutende Wiedergabe wie „hochmütig werden“ zu ersetzen.
- source_word: מֵאֶחָיו
  choice: über seine Brüder
  rationale: Gibt sowohl den Vergleich beziehungsweise die Erhebung über andere als auch die Bundesverwandtschaftssprache des hebräischen Textes wieder.
- source_word: סוּר מִן הַמִּצְוָה
  choice: von dem Gebot abweicht
  rationale: „Abweichen“ ist im Deutschen idiomatisch und erhält die Vorstellung, den vorgeschriebenen Weg zu verlassen; der bestimmte Singular „das Gebot“ bleibt gewahrt.
- source_word: יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die feste Richtungsmetapher bezeichnet jede Form der Abweichung und wird vollständig beibehalten.
- source_word: יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: lange über sein Königreich herrschen
  rationale: Die idiomatische deutsche Wiedergabe vermittelt die lange Dauer seiner königlichen Herrschaft; עַל bezeichnet hier seine Stellung über dem Königreich.
- source_word: הוּא וּבָנָיו
  choice: er und seine Söhne
  rationale: Bewahrt den ausdrücklich männlichen dynastischen Wortlaut und vermeidet die interpretierende Erweiterung zu „Nachkommen“.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: inmitten Israels
  rationale: Erhält das räumlich-gemeinschaftliche Bild des hebräischen Ausdrucks und klingt zugleich würdig und verständlich.
theological_decisions:
- issue: Verwandtschaftssprache im Königsgesetz
  choice: seine Brüder
  alternative: seine israelitischen Volksgenossen
  rationale: Der hebräische Text gebraucht ausdrücklich „Brüder“ als Sprache der Bundesgemeinschaft. Die Übersetzung bewahrt diese Form; die umfassendere Bezugnahme wird in einer Fußnote erläutert.
- issue: Dynastische Aussage
  choice: er und seine Söhne
  alternative: er und seine Nachkommen
  rationale: „Söhne“ entspricht der konkreten hebräischen Form und dem Zusammenhang königlicher Nachfolge; „Nachkommen“ wäre eine interpretierende Verallgemeinerung.
- issue: Verhältnis von Zweck und Folge bei לְמַעַן
  choice: sodass
  alternative: damit
  rationale: לְמַעַן kann Zweck oder beabsichtigte Folge markieren. „Sodass“ lässt hier den Übergang zum erhofften Ergebnis der Gesetzestreue natürlich erkennen, ohne einen unbedingten dynastischen Anspruch zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den vorausgehenden Zusammenhang fort. Bildhafte biblische Sprache wie „sein Herz erhebt“ und „nach rechts oder links“ bleibt erhalten; weniger natürliche Hebraismen werden behutsam idiomatisiert.
