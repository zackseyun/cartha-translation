base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: de
  text: und hingeht, anderen Göttern dient und sich vor ihnen niederwirft – vor der Sonne oder dem Mond oder dem ganzen Heer des Himmels[a] –, was ich nicht geboten habe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Heer des Himmels“ bezeichnet die Gesamtheit der Himmelskörper; in manchen Zusammenhängen kann der Ausdruck auch an himmlische Wesen denken lassen.
    reason: lexical_alternative
  - marker: b
    text: „Was ich nicht geboten habe“ kann sich unmittelbar auf das ganze Heer des Himmels oder weiter auf die gesamte hier beschriebene Verehrung anderer Götter beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: hingeht
  rationale: Im gesetzlichen Bedingungssatz führt die hebräische Verbform die Voraussetzung fort. Das Präsens „hingeht“ entspricht diesem Zusammenhang und bewahrt zugleich die Bewegungsbedeutung.
- source_word: וַיַּעֲבֹד
  choice: dient
  rationale: עבד bezeichnet bei einer Gottheit kultischen Dienst. „Dient“ hält die Wortbedeutung fest, während das folgende Verb die konkrete Gebärde der Anbetung ausdrückt.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies gibt den schlichten Sinn wieder, ohne die nicht ausdrücklich vorhandene ethnische Bedeutung „fremde Götter“ einzutragen.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: sich vor ihnen niederwirft
  rationale: Das Verb bezeichnet das Sich-Niederwerfen beziehungsweise Sich-Verbeugen. Die Formulierung bewahrt die körperliche Handlung und unterscheidet sie vom umfassenderen kultischen Dienen.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: vor der Sonne oder dem Mond oder dem ganzen Heer des Himmels
  rationale: Die Präposition wird passend zum deutschen Verb mit „vor“ wiedergegeben. Die Oder-Reihe bildet die hebräische Aufzählung natürlich ab; „Heer des Himmels“ bewahrt die kollektive und nicht völlig festgelegte Bedeutung von צבא השמים.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: was ich nicht geboten habe
  rationale: „Nicht geboten“ bleibt beim Wortlaut und ersetzt ihn nicht durch das stärkere „verboten“. Das relativische „was“ lässt offen, ob sich der Satzteil eng auf das zuletzt Genannte oder weiter auf den beschriebenen Götzendienst bezieht.
theological_decisions:
- issue: Bezugsbereich von אֲשֶׁר לֹא צִוִּיתִי
  choice: Die offene Formulierung „was ich nicht geboten habe“ wird beibehalten.
  alternative: Der Relativsatz könnte ausschließlich auf „das ganze Heer des Himmels“ bezogen oder ausdrücklich als Zusammenfassung der gesamten beschriebenen Verehrung wiedergegeben werden.
  rationale: Grammatisch steht der Relativsatz unmittelbar nach „dem ganzen Heer des Himmels“, doch im Zusammenhang kann er die gesamte abgöttische Handlung zurückweisen. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in einem gesetzlichen Bedingungssatz. Die Gedankenstriche ordnen die nähere Aufzählung der verehrten Größen, ohne die hebräische Mehrdeutigkeit des abschließenden Relativsatzes aufzulösen.
