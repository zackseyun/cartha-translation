base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: de
  text: Wenn er auf dem Thron seines Königreichs sitzt, soll er für sich auf eine Schriftrolle eine Abschrift dieses Gesetzes schreiben, von vor den levitischen Priestern.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor den levitischen Priestern“. Wahrscheinlich ist gemeint, dass die Abschrift nach einer bei ihnen verwahrten maßgeblichen Vorlage angefertigt werden soll; möglich ist auch, dass die Abschrift in ihrer Gegenwart angefertigt werden soll.'
    reason: Erläutert die wahrscheinlichste kontextuelle Bedeutung von מִלִּפְנֵי, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
  - marker: b
    text: 'Hebräisch: „die Priester, die Leviten“.'
    reason: Dokumentiert die formal appositionelle Struktur hinter der natürlichen Wiedergabe „levitische Priester“.
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Wenn er ... sitzt
  rationale: Die Konstruktion leitet den zeitlichen Umstand der folgenden Rechtsbestimmung ein. Die deutsche Wenn-Konstruktion gibt dies natürlich wieder, ohne das hebräische וְהָיָה unbeholfen mit „und es wird geschehen“ abzubilden.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: auf dem Thron seines Königreichs
  rationale: Bewahrt sowohl das konkrete Bild des Thrones als auch die Genitivverbindung mit dem Königreich.
- source_word: וְכָתַב לוֹ
  choice: soll er für sich ... schreiben
  rationale: Im rechtlichen Zusammenhang drückt die Verbfolge eine Verpflichtung aus; לוֹ bezeichnet hier den König als denjenigen, für dessen eigenen Gebrauch die Abschrift bestimmt ist.
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  choice: eine Abschrift dieses Gesetzes
  rationale: מִשְׁנֵה bezeichnet hier eine Abschrift beziehungsweise ein Duplikat. „Gesetz“ passt zum königlichen Rechtskontext, ohne den Umfang der bezeichneten Tora über den Vers hinaus festzulegen.
- source_word: עַל סֵפֶר
  choice: auf eine Schriftrolle
  rationale: סֵפֶר bezeichnet hier den materiellen Schriftträger beziehungsweise ein Schriftstück; „Schriftrolle“ macht den historischen Gegenstand verständlich und gibt die Präposition עַל mit „auf“ wieder.
- source_word: מִלִּפְנֵי
  choice: nach der Vorlage, die sich bei ... befindet
  rationale: Wörtlich bedeutet die Wendung „von vor/aus der Gegenwart von“. Im Zusammenhang liegt nahe, dass die königliche Abschrift anhand eines bei den Priestern befindlichen autorisierten Exemplars angefertigt wird; die Fußnote bewahrt die formale und alternative Deutung.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die natürliche deutsche Wiedergabe versteht „die Leviten“ als nähere Bestimmung der Priester. Die formal appositionelle Wiedergabe bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Umfang von הַתּוֹרָה הַזֹּאת im Königsgesetz
  choice: dieses Gesetz
  alternative: diese Weisung; diese Tora
  rationale: Der unmittelbare Zusammenhang ist eine rechtlich formulierte Verpflichtung des Königs. „Gesetz“ entspricht diesem Kontext, ohne eine weitergehende Aussage über den kanonischen Umfang zu erzwingen.
- issue: Bedeutung der Herkunftsangabe מִלִּפְנֵי
  choice: nach der Vorlage, die sich bei den Priestern befindet
  alternative: in Gegenwart der Priester; von vor den Priestern
  rationale: Die Formulierung weist wahrscheinlich auf ein priesterlich verwahrtes Referenzexemplar hin. Weil der hebräische Ausdruck auch räumlich beziehungsweise als Anwesenheitsangabe verstanden werden kann, wird diese Mehrdeutigkeit ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Schriftrolle“ vermittelt den historischen Schriftträger; „nach der Vorlage“ ist idiomatisch, während die Fußnote die wörtliche Form und die echte Auslegungsbreite offenhält.
