source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: de
  text: 'Wenn du in das Land kommst, das Jahwe, dein Gott, dir gibt, und es in Besitz nimmst und darin wohnst und dann sagst: »Ich will einen König über mich einsetzen[a], wie alle Völker rings um mich«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen König über mich setzen«; auch möglich: »einen König über mich bestimmen«.'
    reason: Die Fußnote bewahrt die konkrete Ausdrucksweise von שׂים und weist auf die mögliche institutionelle Bedeutung »bestimmen/einsetzen« hin.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Wenn du … kommst
  rationale: כִּי leitet hier einen erwarteten künftigen Fall ein; im Deutschen gibt »wenn« die zeitlich-bedingende Offenheit angemessen wieder. תָבֹא wird mit dem natürlichen Ausdruck »in das Land kommen« übersetzt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im deuteronomischen Zusammenhang bezeichnet der Ausdruck das Israel verheißene Land; »das Land« ist die etablierte, kontextgerechte Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip bezeichnet Gottes gegenwärtig zugesagte beziehungsweise bevorstehende Gabe. Das deutsche Präsens ist in diesem Zukunftsszenario natürlich und wahrt die göttliche Initiative.
- source_word: וִירִשְׁתָּהּ
  choice: es in Besitz nimmst
  rationale: ירשׁ bezeichnet im Landkontext die tatsächliche Besitzergreifung; »in Besitz nehmen« ist präziser als das im modernen Deutschen möglicherweise missverständliche »erben«.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: und darin wohnst
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen beziehungsweise Ansässigsein. »Wohnen« ist modern, würdig und näher am hebräischen Ausdruck als eine bloß punktuelle Formulierung.
- source_word: וְאָמַרְתָּ
  choice: und dann sagst
  rationale: »Dann« macht die hebräische Ereignisfolge im Deutschen klar, ohne einen zusätzlichen sachlichen Inhalt einzutragen.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Ich will einen König über mich einsetzen
  rationale: שׂים kann »setzen« oder »einsetzen« bedeuten. »Einsetzen« ist im Deutschen bei der Bestellung eines Königs idiomatisch und bewahrt mit »über mich« die Perspektive von עָלַי.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: wie alle Völker rings um mich
  rationale: גּוֹיִם meint hier die umgebenden Völker beziehungsweise Nationen, nicht »Heiden« in einem späteren theologischen Sinn. »Rings um mich« bewahrt die erste Person der direkten Rede knapp und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« gibt ihn als persönlichen Namen wieder, statt ihn durch den Titel »der HERR« zu ersetzen; »Jehova« beruht auf einer späteren Verbindung der Konsonanten mit fremden Lesevokalen.
- issue: Bewertung des Wunsches nach einem König
  choice: Keine ausdrückliche moralische Bewertung in Vers 14 ergänzt
  alternative: Den Königs Wunsch bereits hier ausdrücklich als erlaubt oder verwerflich kennzeichnen
  rationale: Der Vers formuliert zunächst Israels künftige Aussage. Seine Spannung zum folgenden Gesetz und zu späteren Erzählungen bleibt bestehen und darf nicht durch einen interpretierenden Zusatz vorentschieden werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. Die lange hebräische Satzkette bleibt erhalten, da der Vers in den folgenden Vers hineinführt. »Jahwe« steht als Eigenname; »Völker« vermeidet eine konfessionell oder heilsgeschichtlich aufgeladene Wiedergabe.
