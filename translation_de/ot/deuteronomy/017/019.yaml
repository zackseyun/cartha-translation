base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: de
  text: sie soll bei ihm sein, und er soll alle Tage seines Lebens darin lesen, damit er lernt, Jahwe, seinen Gott, zu fürchten[a], alle Worte dieser Weisung und diese Satzungen zu bewahren und sie zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe, seinen Gott, zu verehren“. Das hebräische Wort umfasst Furcht, Ehrfurcht und gehorsame Achtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Sie soll bei ihm sein
  rationale: Das feminine Pronomen bezieht sich auf die im vorherigen Vers erwähnte Abschrift der Weisung. „Bei ihm sein“ wahrt den Gedanken dauernder Verfügbarkeit, ohne „bleiben“ ausdrücklich hinzuzufügen.
- source_word: וְקָרָא בוֹ
  choice: und er soll darin lesen
  rationale: Das präpositionale בּוֹ wird natürlich und quellennah mit „darin“ wiedergegeben.
- source_word: כָּל יְמֵי חַיָּיו
  choice: alle Tage seines Lebens
  rationale: Bewahrt die volle hebräische Zeitformel und ihren feierlichen Rhythmus.
- source_word: לְמַעַן יִלְמַד
  choice: damit er lernt
  rationale: Gibt den Zweck des lebenslangen Lesens klar und idiomatisch wieder.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: Jahwe, seinen Gott, zu fürchten
  rationale: „Fürchten“ erhält das Bedeutungsspektrum von ehrfürchtiger Scheu bis zu gehorsamer Unterordnung; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לִשְׁמֹר
  choice: zu bewahren
  rationale: „Bewahren“ bildet die Bundes- und Gesetzessprache von שׁמר ab und bleibt natürlicher als ein rein wörtliches „hüten“.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: alle Worte dieser Weisung
  rationale: תּוֹרָה bezeichnet hier die schriftlich vorliegende göttliche Weisung mit rechtlicher Verbindlichkeit. „Weisung“ bewahrt die semantische Breite besser als das enger wirkende „Gesetz“.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: diese Satzungen
  rationale: „Satzungen“ ist eine verständliche, würdige Wiedergabe des rechtlichen Fachworts חֻקִּים.
- source_word: לַעֲשֹׂתָם
  choice: und sie zu tun
  rationale: Die konkrete hebräische Wendung wird bewahrt, statt sie interpretierend zu „befolgen“ oder „auszuführen“ aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ירא
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ erhält die biblische Spannung zwischen Furcht, Ehrfurcht und gehorsamer Unterordnung. Die Alternative wäre erklärender, aber semantisch enger.
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ wahrt den breiteren Sinn des hebräischen Wortes, während der Zusammenhang mit „Worten“ und „Satzungen“ seine rechtliche Verbindlichkeit erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzstruktur. Das feminine „Sie“ setzt den Bezug zur Abschrift im vorherigen Vers voraus. Die Infinitivfolge bleibt bewusst erhalten, um Zweck und Ziel des Lesens eng miteinander zu verbinden.
