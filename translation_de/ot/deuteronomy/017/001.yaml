  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: de
  text: Du sollst Yahweh, deinem Gott, kein Rind und kein Tier vom Kleinvieh[a] opfern, an dem ein Makel oder sonst etwas Schlechtes ist; denn das ist für Yahweh, deinen Gott, ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein einzelnes Tier vom Kleinvieh und kann ein Schaf oder eine Ziege meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: opfern
  rationale: Im kultischen Zusammenhang bezeichnet זבח das Darbringen eines Tieres als Opfer und nicht lediglich das Schlachten.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als »Yahweh« wiedergegeben und als Eigenname bewahrt.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet hier ein einzelnes Tier aus dem Rinderbestand, ohne dessen Geschlecht unnötig festzulegen.
- source_word: שֶׂה
  choice: Tier vom Kleinvieh
  rationale: שֶׂה kann sowohl ein Schaf als auch eine Ziege bezeichnen; die Formulierung bewahrt diese lexikalische Breite.
- source_word: מוּם
  choice: Makel
  rationale: »Makel« ist ein natürlicher deutscher Ausdruck für einen körperlichen Fehler, der ein Opfertier disqualifiziert.
- source_word: כֹּל דָּבָר רָע
  choice: irgendetwas Schlechtes
  rationale: Die Wiedergabe bleibt nahe am breiten Wortlaut »jede schlechte Sache«, statt ihn ausschließlich als weiteren körperlichen Defekt auszulegen.
- source_word: תוֹעֲבַת
  choice: Gräuel
  rationale: »Gräuel« bewahrt die starke kultische und moralische Wertung von תועבה und den würdevollen biblischen Sprachton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als offenbarten Eigennamen.
- issue: Bezug von כֹּל דָּבָר רָע
  choice: als breite, erläuternde Apposition zu »Makel«
  alternative: als »irgendein schwerer Fehler« vollständig auf körperliche Defekte verengen
  rationale: Die wörtlich breite Wendung steht appositionell bei מום. Die Übersetzung erhält diese semantische Spannung, ohne den Zusammenhang mit dem Makel aufzugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gesetzesformel »Du sollst … kein …« ist allgemein verständlich. »Rind« vermeidet eine nicht belegte Geschlechtsfestlegung; »Tier vom Kleinvieh« wahrt die Breite des hebräischen Begriffs. Die etwas markierte Apposition »ein Makel, irgendetwas Schlechtes« bildet die offene hebräische Formulierung ab.
