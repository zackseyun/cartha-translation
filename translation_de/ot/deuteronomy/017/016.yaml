  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: de
  text: 'Doch soll er sich nicht viele Pferde anschaffen[a] und das Volk nicht nach Ägypten zurückführen[b], um sich viele Pferde anzuschaffen. Denn Jahwe hat zu euch gesagt: »Ihr dürft nie wieder auf diesem Weg zurückkehren.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er soll die Pferde für sich nicht vermehren.“ Gemeint ist, dass der König keinen großen Pferdebestand für sich aufbauen soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Volk nicht dazu bringen, nach Ägypten zurückzukehren“. Die hebräische Verbform ist kausativ: Der König darf eine solche Rückkehr nicht veranlassen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Ihr sollt nicht hinzufügen, auf diesem Weg nochmals zurückzukehren.“ Dies ist eine hebräische Ausdrucksweise für „Ihr dürft nie wieder auf diesem Weg zurückkehren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur soll er
  rationale: רַק schränkt die zuvor beschriebene königliche Vollmacht ein. Die vorangestellte Formulierung bewahrt diese begrenzende Funktion in natürlichem Deutsch.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: soll er sich nicht viele Pferde anschaffen
  rationale: Die Wendung bezeichnet wörtlich das Vermehren von Pferden für sich selbst. Im Zusammenhang königlicher Pferdebestände gibt „sich viele Pferde anschaffen“ den Sinn idiomatisch wieder; die wörtlichere Möglichkeit wird in Fußnote [a] genannt.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: und das Volk nicht nach Ägypten zurückführen
  rationale: Der Hifil von שוב ist kausativ. „zurückführen“ bewahrt sowohl den Rückkehrgedanken als auch die Verantwortung des Königs dafür.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: um die Zahl seiner Pferde zu vermehren
  rationale: לְמַעַן mit Infinitiv drückt den Zweck aus. Die Formulierung hält die lexikalische Verbindung zum vorausgehenden Verbot fest und ist im Deutschen klar.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: Ihr dürft nie wieder ... zurückkehren
  rationale: Die Verbindung von יסף mit dem Infinitiv und עוֹד verbietet eine erneute Rückkehr. „nie wieder“ gibt die verstärkte idiomatische Aussage natürlich wieder.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: auf diesem Weg
  rationale: דֶּרֶךְ kann Weg oder Route bezeichnen. „auf diesem Weg“ bewahrt das Bild und ist idiomatisches Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt den Bundesnamen als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Verbots der Rückkehr nach Ägypten
  choice: Die Aussage bleibt als direktes, an das Volk gerichtetes Verbot formuliert
  alternative: Das Verbot ausdrücklich nur auf den König oder ausschließlich auf Pferdehandel beziehen
  rationale: Der Text sagt im Plural „zu euch“ und „ihr dürft ... zurückkehren“. Die Übersetzung lässt Reichweite und historische Anwendung des Verbots offen, statt sie dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „sich viele Pferde anschaffen“ ist für gewöhnliche Leser natürlicher als „Pferde vermehren“, während die Fußnote die formale Gestalt des Hebräischen dokumentiert. Die direkte Rede und der Gottesname bleiben deutlich erhalten.
