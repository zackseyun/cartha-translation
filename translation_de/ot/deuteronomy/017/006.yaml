source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: de
  text: Aufgrund der Aussage von zwei Zeugen oder drei Zeugen[a] soll derjenige, der sterben soll, getötet werden[b]; aufgrund der Aussage eines einzigen Zeugen soll er nicht getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Mund von zwei Zeugen oder drei Zeugen«. Die hebräische Redewendung meint die rechtlich maßgebliche Aussage oder den Beweis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »derjenige, der dem Tod verfallen ist«; gemeint ist die Person, die nach dem Gesetz der Todesstrafe unterliegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: aufgrund der Aussage von
  rationale: Die Wendung bedeutet wörtlich »auf den Mund von«, bezeichnet hier aber die rechtlich maßgebliche Zeugenaussage. Die gewählte Formulierung gibt den juristischen Sinn in natürlichem Deutsch wieder.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: zwei Zeugen oder drei Zeugen
  rationale: Das Hebräische wiederholt »Zeugen« nach beiden Zahlwörtern. Die Wiederholung bleibt erhalten und spiegelt den förmlichen Rechtsstil.
- source_word: יוּמַת
  choice: soll ... getötet werden
  rationale: Die passive Kausativform bezeichnet nicht nur das Sterben, sondern das Vollziehen der Todesstrafe. »Getötet werden« bewahrt diese Bedeutung, ohne durch »hingerichtet« zusätzliche Einzelheiten einzutragen.
- source_word: הַמֵּת
  choice: derjenige, der sterben soll
  rationale: Die substantivierte Partizipialform ist knapp und elliptisch. Die Wiedergabe hält diese Spannung fest und bezeichnet im Zusammenhang den Menschen, an dem die Todesstrafe vollzogen werden soll, nicht einen bereits Verstorbenen.
- source_word: לֹא יוּמַת
  choice: soll er nicht getötet werden
  rationale: Die Formulierung wiederholt dasselbe Verb und gibt das verbindliche rechtliche Verbot wieder.
- source_word: עֵד אֶחָד
  choice: eines einzigen Zeugen
  rationale: »Eines einzigen Zeugen« ist im Deutschen idiomatisch und hebt wie das Hebräische hervor, dass eine Einzelperson als Zeuge nicht genügt.
theological_decisions:
- issue: Bezug und Aussagekraft von הַמֵּת im Zusammenhang des Kapitalrechts
  choice: derjenige, der sterben soll
  alternative: der zum Tod Verurteilte; der des Todes Schuldige; der Tote
  rationale: Der Vers legt die Beweisanforderung für die Vollstreckung der Todesstrafe fest. »Der Tote« passt nicht zum Zusammenhang; »der zum Tod Verurteilte« und »der des Todes Schuldige« formulieren Urteil beziehungsweise Schuld ausdrücklicher als der hebräische Text. Die gewählte Fassung bewahrt dessen knappe, leicht spannungsvolle Ausdrucksweise.
translation_notes:
  register: Moderner, würdiger deutscher Rechtsstil. Die Wiederholung von »Zeugen« und »getötet werden« folgt bewusst der formalen Struktur des Hebräischen. Die etwas ungewöhnliche Wendung »derjenige, der sterben soll« erhält die Ellipse des Ausgangstextes, während die Fußnote den gemeinten Rechtsbezug erläutert.
