base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: de
  text: 'und es dir gemeldet wird und du davon hörst und gründlich nachforschst, und siehe, die Sache ist wahr und erwiesen: Dieser Gräuel ist in Israel begangen worden,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: und es dir gemeldet wird
  rationale: Das Hophal von נגד bezeichnet hier die passive Übermittlung einer Meldung. „Dir gemeldet wird“ ist im modernen Deutschen natürlich und bewahrt den passiven Sinn.
- source_word: וְשָׁמָעְתָּ
  choice: und du davon hörst
  rationale: שׁמע bedeutet „hören“. „Davon“ nimmt den zuvor gemeldeten Sachverhalt auf, ohne neue Information hinzuzufügen.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: dann sollst du gründlich nachforschen
  rationale: דרש hat im gerichtlichen Zusammenhang den Sinn „untersuchen, nachforschen“; הֵיטֵב verstärkt die gebotene Sorgfalt. Die modale Wiedergabe entspricht der Rechtsanweisung im Kontext.
- source_word: וְהִנֵּה
  choice: Wenn sich herausstellt
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das Ergebnis der Untersuchung. Im deutschen Rechtssatz gibt „wenn sich herausstellt“ diese Ergebnisfunktion natürlich wieder.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: dass die Sache wahr ist und feststeht
  rationale: 'Die doppelte gerichtliche Bestätigung wird bewahrt: אֱמֶת bezeichnet die Wahrheit des Sachverhalts, נָכוֹן seine feste Bestätigung.'
- source_word: נֶעֶשְׂתָה
  choice: begangen wurde
  rationale: Das passive Verb עשה bezieht sich auf die vollzogene Tat. Bei einem schweren Vergehen ist „begangen wurde“ im Deutschen idiomatischer als „getan wurde“.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: dieser Gräuel
  rationale: תּוֹעֵבָה ist eine starke moralisch-bundestheologische Wertung. „Gräuel“ bewahrt das Gewicht des Ausdrucks und ist in würdigem modernem Bibeldeutsch verständlich.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präpositionalphrase verortet die Tat innerhalb Israels als Bundesgemeinschaft; „in Israel“ ist direkt und eindeutig.
theological_decisions:
- issue: Wiedergabe der gerichtlichen Bestätigungsformel אֱמֶת נָכוֹן הַדָּבָר
  choice: dass die Sache wahr ist und feststeht
  alternative: die Sache ist wahr und bestätigt
  rationale: Die Übersetzung erhält beide Aspekte der hebräischen Formel—Wahrheit und gesicherte Feststellung—ohne sie zu einer einzigen Aussage zusammenzuziehen.
- issue: Wiedergabe von תּוֹעֵבָה
  choice: Gräuel
  alternative: abscheuliche Tat
  rationale: „Gräuel“ bewahrt die starke moralische und bundesbezogene Bewertung des Ausgangstextes; die Alternative wäre erklärender, könnte aber die terminologische Prägnanz abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in einem gerichtlichen Gesetzeskontext. Die Satzführung bildet den konditionalen Zusammenhang der Verse 2–5 natürlich ab. Keine Fußnote ist erforderlich, da die echte Bedeutungsbreite der Bestätigungsformel im Haupttext erhalten bleibt.
