id: DEU.17.15
reference: Deuteronomy 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: de
  text: Du sollst unbedingt einen König über dich einsetzen, den Jahwe, dein Gott, erwählt. Aus der Mitte deiner Brüder[a] sollst du einen König über dich einsetzen. Du darfst keinen Ausländer[b] über dich setzen, der nicht dein Bruder ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ sind hier Angehörige des Volkes Israel gemeint, also Menschen aus dem eigenen Volk.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen ausländischen Mann“; der folgende Satzteil erklärt dies als jemanden, der nicht „dein Bruder“ ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: du sollst unbedingt … einsetzen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Anweisung. „Unbedingt“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder.
- source_word: עָלֶיךָ
  choice: über dich
  rationale: Die Präposition bezeichnet die Herrschaft über den als Einzahl angesprochenen Israelitenverband. „Über dich“ wahrt diese kollektive Singularanrede.
- source_word: מֶלֶךְ
  choice: König
  rationale: Direkte und kontextgemäße Wiedergabe des hebräischen Substantivs.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: den Jahwe, dein Gott, erwählt
  rationale: Das deutsche Präsens eignet sich für die allgemeine Rechtsbestimmung und lässt offen, ob die konkrete Erwählung künftig erfolgt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt den im hebräischen Text ausdrücklich gebrauchten Gottesnamen.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: aus der Mitte deiner Brüder
  rationale: Diese Formulierung bewahrt sowohl das Bild der Mitte als auch die verwandtschaftliche Bundessprache; eine Fußnote erläutert den kollektiven Bezug auf Angehörige Israels.
- source_word: לֹא תוּכַל לָתֵת
  choice: du darfst … nicht setzen
  rationale: Die wörtliche Formulierung „du kannst nicht“ hat im gesetzlichen Zusammenhang verbietende Kraft, die im Deutschen idiomatisch mit „du darfst nicht“ wiedergegeben wird.
- source_word: אִישׁ נָכְרִי
  choice: keinen Ausländer
  rationale: „Ausländer“ bezeichnet natürlich und präzise einen Mann, der nicht zum eigenen Volk gehört; das grammatische Maskulinum passt zum männlichen Königsamt.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: der nicht dein Bruder ist
  rationale: Die erklärende Relativkonstruktion und die verwandtschaftliche Sprache des Hebräischen bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ gibt ihn wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verwandtschaftssprache אַחֶיךָ / אָחִיךָ
  choice: deine Brüder / dein Bruder
  alternative: deine Volksgenossen / einer aus deinem Volk
  rationale: Die Übersetzung erhält die männliche Verwandtschaftssprache und damit den Kontrast des Textes; die Fußnote erläutert, dass hier Zugehörigkeit zum Volk Israel gemeint ist.
- issue: Verhältnis von göttlicher Erwählung und menschlicher Einsetzung
  choice: den Jahwe erwählt … sollst du einsetzen
  alternative: den Jahwe erwählen wird
  rationale: Die Übersetzung bewahrt beide Aussagen nebeneinander, ohne ihr theologisches Verhältnis näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kollektiver Singularanrede. Die Wiederholung von „einen König über dich einsetzen“ wird als bewusstes Merkmal der hebräischen Gesetzessprache beibehalten.
