  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: de
  text: Wenn in deiner Mitte, in einer deiner Städte[a], die Jahwe, dein Gott, dir gibt, ein Mann oder eine Frau gefunden wird, der oder die in den Augen Jahwes, deines Gottes, Böses tut, indem er oder sie Jahwes Bund übertritt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in einem deiner Tore“; „Tore“ kann hier für die jeweiligen Städte oder örtlichen Gemeinwesen stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „indem er oder sie Jahwes Bund verletzt“; auch: „um Jahwes Bund zu brechen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet hier den Bedingungssatz einer kasuistischen Rechtsbestimmung ein.
- source_word: יִמָּצֵא
  choice: gefunden wird
  rationale: Das Nifal von מצא wird passiv wiedergegeben und bewahrt die unpersönliche Rechtssprache.
- source_word: בְקִרְבְּךָ
  choice: bei dir
  rationale: Bezeichnet die Anwesenheit innerhalb der angesprochenen Gemeinschaft und ist im modernen Deutschen natürlicher als „in deiner Mitte“.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: in einer deiner Städte
  rationale: „Tore“ bezeichnet hier metonymisch die zum jeweiligen Stadttor gehörende Stadt beziehungsweise örtliche Gerichtsbarkeit; die wörtliche Form wird in einer Fußnote angegeben.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: die Jahwe, dein Gott, dir gibt
  rationale: Das Partizip נֹתֵן wird im Deutschen idiomatisch präsentisch wiedergegeben; der Relativsatz bezieht sich auf die Städte.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ein Mann oder eine Frau
  rationale: Bewahrt die ausdrücklich genannte geschlechtliche Paarform des Hebräischen.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: der oder die tut, was … böse ist
  rationale: Gibt die hebräische Wendung „das Böse tun“ natürlich wieder und wahrt zugleich den Bezug auf Mann oder Frau.
- source_word: בְעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: in den Augen Jahwes, deines Gottes
  rationale: Bewahrt die transparente hebräische Bewertungsmetapher.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: indem er oder sie seinen Bund übertritt
  rationale: Die Infinitivkonstruktion erläutert, worin die böse Handlung besteht; „übertritt“ wahrt die Bundesbruch-Terminologie, ohne die im Folgevers genannte konkrete Tat vorwegzunehmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen erkennbar als Eigennamen wieder.
theological_decisions:
- issue: Art der Bundesübertretung
  choice: „indem er oder sie seinen Bund übertritt“ ohne nähere Bestimmung
  alternative: „um seinen Bund zu brechen“ oder „wodurch er oder sie seinen Bund verletzt“
  rationale: Der Vers bezeichnet die Tat allgemein als Bundesübertretung; erst der folgende Vers konkretisiert sie. Die Übersetzung nimmt diese Konkretisierung nicht vorweg.
translation_notes:
  register: Moderne, würdige deutsche Rechtssprache. Die Satzstruktur bleibt als noch nicht abgeschlossener Bedingungssatz offen, entsprechend dem hebräischen Kontext. Die Formulierung „der oder die“ wahrt den ausdrücklichen Bezug auf Mann und Frau, ohne ihn in eine generische Personenbezeichnung aufzulösen.
