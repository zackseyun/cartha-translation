  to: Wenn in deiner Mitte, in einer deiner Städte[a], die Jahwe, dein Gott, dir gibt, ein Mann oder eine Frau gefunden wird, der oder die in den Augen Jahwes, deines Gottes, Böses tut, indem er oder sie Jahwes Bund übertritt[b],
