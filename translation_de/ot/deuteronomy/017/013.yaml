base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: de
  text: Und das ganze Volk wird davon hören, sich fürchten und nicht mehr vermessen handeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Und das ganze Volk
  rationale: Gibt die ausdrückliche Formulierung des Hebräischen wieder, ohne »Israel« ergänzend einzufügen; die Konjunktion bleibt erhalten.
- source_word: יִשְׁמְעוּ
  choice: soll es hören
  rationale: שמע bedeutet hier »hören«; das ergänzte »es« macht im Deutschen natürlich deutlich, dass das Volk von dem Urteil beziehungsweise Geschehen hört, ohne dessen Gegenstand enger festzulegen.
- source_word: וְיִרָאוּ
  choice: und sich fürchten
  rationale: Bewahrt die knappe Aussage ohne ein Objekt der Furcht hinzuzufügen und lässt offen, ob Gott, die Strafe oder beides gemeint ist.
- source_word: וְלֹא יְזִידוּן
  choice: und nicht vermessen handeln
  rationale: Der Hifil von זיד bezeichnet vorsätzliches, anmaßendes oder überhebliches Handeln. »Vermessen handeln« erfasst im rechtlichen Zusammenhang den bewussten, unverschämten Trotz.
- source_word: עוֹד
  choice: wieder
  rationale: Bezeichnet hier, dass ein solches Verhalten künftig nicht erneut vorkommen soll; »wieder« ist dafür knapp und idiomatisch.
theological_decisions:
- issue: Gegenstand der Furcht
  choice: Die Furcht wird ohne ausdrückliches Objekt wiedergegeben.
  alternative: »den HERRN fürchten« oder »sich vor der Strafe fürchten«
  rationale: Auch der hebräische Text nennt kein Objekt. Die Übersetzung bewahrt deshalb die mögliche Beziehung auf Gott, die gerichtliche Strafe oder beides.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. Die Soll-Form wahrt den normativen Zukunftsbezug. »Vermessen handeln« ist bewusst gehobener, aber allgemein verständlich und entspricht der Schwere vorsätzlicher, anmaßender Auflehnung.
