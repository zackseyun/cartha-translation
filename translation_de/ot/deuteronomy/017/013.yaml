revisions:
- from: Und das ganze Volk soll es hören und sich fürchten[a] und nicht wieder vermessen handeln.
  to: Und das ganze Volk wird davon hören, sich fürchten und nicht mehr vermessen handeln.
  rationale: Die Revision fasst die hebräischen Verbformen als Folgeaussage, nicht als zusätzliche Vorschrift. Sie erhält die offene Referenz des Furchtobjekts und die Bedeutung willentlich-anmaßenden Handelns, während sie die deutsche Formulierung idiomatischer gestaltet und die semantisch nicht gleichwertige Fußnote entfernt.
