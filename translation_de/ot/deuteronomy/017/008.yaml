source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: de
  text: Wenn dir eine Rechtssache zu schwierig ist – sei es bei der Unterscheidung zwischen Blutschuld und Blutschuld[a], zwischen Rechtsanspruch und Rechtsanspruch[b] oder zwischen Verletzung und Verletzung[c], also bei Streitfällen in deinen Toren[d] –, dann mach dich auf und geh hinauf zu dem Ort, den Jahwe, dein Gott, erwählen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen Blut und Blut«. Gemeint ist wohl die Unterscheidung verschiedener Fälle von Tötung oder Blutschuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zwischen Rechtssache und Rechtssache« beziehungsweise »zwischen Urteil und Urteil«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch »Leiden«, »Befall« oder »Plage« bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Die Stadttore waren im alten Israel übliche Orte der örtlichen Rechtsprechung; gemeint sind daher Streitfälle vor den örtlichen Gerichten.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: zu schwierig ist
  rationale: Das Nifal von פלא bezeichnet hier eine Sache, die die örtliche richterliche Entscheidungsfähigkeit übersteigt.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: eine Rechtssache
  rationale: Die knappe deutsche Rechtsbezeichnung gibt den gerichtlichen Zusammenhang natürlich wieder, ohne die Art des Falls vorwegzunehmen.
- source_word: בֵּין דָּם לְדָם
  choice: zwischen Blutschuld und Blutschuld
  rationale: Die Wiederholung und das konkrete Blutmotiv bleiben erhalten; »Blutschuld« macht zugleich den forensischen Sinn verständlich.
- source_word: בֵּין דִּין לְדִין
  choice: zwischen Rechtsanspruch und Rechtsanspruch
  rationale: דִּין kann Anspruch, Rechtssache oder Urteil bedeuten. »Rechtsanspruch« passt in die gerichtliche Reihe, ohne die Mehrdeutigkeit durch eine detailliertere Fallart aufzulösen.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: zwischen Verletzung und Verletzung
  rationale: נֶגַע hat ein breites Bedeutungsspektrum von Schlag oder Verletzung bis zu Leiden beziehungsweise Befall. Im gerichtlichen Kontext ist »Verletzung« die naheliegende Hauptlesart; Alternativen werden in der Fußnote bewahrt.
- source_word: דִּבְרֵי רִיבֹת
  choice: Streitfälle
  rationale: Die Wendung bezeichnet strittige Angelegenheiten und lässt sich im Deutschen knapp und juristisch verständlich mit »Streitfälle« wiedergeben.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Toren
  rationale: Die wörtliche Ortsangabe bewahrt das altisraelitische Bild des Stadttores als Ort örtlicher Rechtsprechung; eine Kulturfußnote erklärt es.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: mach dich auf und geh hinauf
  rationale: Die Doppelbewegung wird in natürlichem, würdevollem Deutsch bewahrt; »hinauf« gibt die Richtung des hebräischen עלה wieder.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: der Ort, den … erwählen wird
  rationale: Das Futur bewahrt die vorausblickende Formulierung des Deuteronomiums; »erwählen« entspricht dem gehobenen sakralen Kontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im modernen Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text gebraucht das Tetragramm als persönlichen Gottesnamen. Die Übersetzung »Jahwe« bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite von נֶגַע im gerichtlichen Zusammenhang
  choice: Verletzung
  alternative: Leiden; Befall; Plage
  rationale: Der Zusammenhang legt Fälle körperlicher Schädigung nahe, doch das hebräische Wort ist weiter. Deshalb steht die kontextuell plausible Lesart im Text, während die semantische Offenheit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher juristischer Sprache. Die parallele hebräische Struktur wird bewahrt, aber durch »sei es« und »also« im Deutschen lesbar gegliedert. »Jahwe« folgt der üblichen deutschen Schreibung des Gottesnamens.
