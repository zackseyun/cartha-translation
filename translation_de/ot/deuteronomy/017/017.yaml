base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: de
  text: Er soll sich nicht viele Ehefrauen nehmen[a], damit sich sein Herz nicht abwendet; auch Silber und Gold soll er nicht übermäßig für sich anhäufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sein Herz soll sich nicht abwenden“. Das Hebräische kann hier auch als nebengeordnetes Verbot verstanden werden, nicht ausdrücklich als Zweck- oder Folgesatz.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה לּוֹ נָשִׁים
  choice: sich viele Frauen nehmen
  rationale: Das Hifil von רבה bezeichnet hier das Vermehren beziehungsweise Anhäufen. Im Zusammenhang der Königsgesetze meint נָשִׁים Ehefrauen. Die deutsche Wendung ist natürlich und gibt das Verbot einer großen Zahl von Ehefrauen wieder.
- source_word: יָסוּר
  choice: abweicht
  rationale: סור bedeutet abweichen oder sich abwenden. „Abweicht“ bewahrt das Bild, ohne ein im Hebräischen nicht ausdrücklich genanntes Ziel des Abweichens zu ergänzen.
- source_word: לְבָבוֹ
  choice: sein Herz
  rationale: „Herz“ bewahrt den biblisch-anthropologischen Ausdruck für den inneren Willen, das Denken und die Zuneigung.
- source_word: כֶסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die konkreten Substantive werden direkt wiedergegeben; so bleibt die traditionelle Paarformel erhalten.
- source_word: יַרְבֶּה לּוֹ מְאֹד
  choice: nicht übermäßig für sich anhäufen
  rationale: „Anhäufen“ gibt das erneute רבה im Zusammenhang mit Reichtum idiomatisch wieder. „Übermäßig“ drückt die Verstärkung durch מְאֹד aus und betont das verbotene Übermaß.
theological_decisions:
- issue: Verhältnis zwischen der Vielzahl von Frauen und dem Abweichen des Herzens
  choice: 'Die mittlere Klausel wird als Zweck- beziehungsweise Folgeaussage wiedergegeben: „damit sein Herz nicht abweicht“.'
  alternative: „und sein Herz soll nicht abweichen“ als nebengeordnetes Verbot
  rationale: Der Zusammenhang legt nahe, dass die Klausel den Grund für das vorangehende Verbot nennt. Die hebräische Syntax lässt jedoch auch ein nebengeordnetes Verbot zu; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt. Ein Ziel wie „vom HERRN“ wird nicht ergänzt, da es im Vers nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Ausdrucksweise. „Sich viele Frauen nehmen“ und „für sich anhäufen“ sind verständlich und idiomatisch; die semantische Wiederholung des hebräischen רבה wird im Deutschen kontextgerecht variiert.
