  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: de
  text: Die Zeugen sollen als Erste Hand an ihn legen, um ihn zu töten; danach soll das ganze Volk Hand an ihn legen.[a] So sollst du das Böse aus deiner Mitte beseitigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Hand der Zeugen soll zuerst gegen ihn sein, um ihn zu töten, und danach die Hand des ganzen Volkes.“ Diese Rechtswendung weist den Zeugen die erste Verantwortung bei der Vollstreckung des Urteils zu.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „aus eurer Mitte“ beziehungsweise „unter euch“; das Hebräische redet Israel als Gemeinschaft im Singular an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד הָעֵדִים
  choice: die Zeugen sollen Hand an ihn legen
  rationale: Die hebräische Wendung bezeichnet nicht nur körperliches Handeln, sondern weist den Zeugen die erste Verantwortung bei der Vollstreckung des Urteils zu. Die deutsche Redewendung „Hand an jemanden legen“ bewahrt das Bild und ist zugleich verständlich.
- source_word: הָעֵדִים
  choice: die Zeugen
  rationale: Das Substantiv bezeichnet rechtlich auftretende Zeugen, nicht bloß Ankläger.
- source_word: בּוֹ
  choice: an ihn
  rationale: In Verbindung mit „Hand an ihn legen“ bezeichnet die Präposition das gegen den Verurteilten gerichtete Handeln.
- source_word: בָרִאשֹׁנָה
  choice: als Erste
  rationale: Die adverbiale Form legt die zeitliche und verantwortliche Priorität der Zeugen bei der Vollstreckung fest.
- source_word: לַהֲמִיתוֹ
  choice: um ihn zu töten
  rationale: Der Hifil-Infinitiv von מות bedeutet, den Tod herbeizuführen. „Um ihn zu töten“ gibt die Aussage unmittelbar wieder, ohne eine bestimmte Hinrichtungsart hinzuzufügen.
- source_word: וְיַד כָּל הָעָם
  choice: danach soll das ganze Volk mitwirken
  rationale: Die idiomatische Bedeutung der „Hand“ wird hier natürlich als Beteiligung wiedergegeben; die parallele hebräische Bildsprache wird in der Fußnote dokumentiert.
- source_word: בָאַחֲרֹנָה
  choice: danach
  rationale: Das Wort bildet den zeitlichen Gegenpol zu „als Erste“ und kennzeichnet die nachfolgende Beteiligung des Volkes.
- source_word: וּבִעַרְתָּ
  choice: so sollst du … beseitigen
  rationale: In der deuteronomischen Rechtsformel bedeutet בער die Entfernung des Bösen aus der Gemeinschaft, nicht ein wörtliches Verbrennen.
- source_word: הָרָע
  choice: das Böse
  rationale: Die substantivierte Form bleibt bewusst allgemein und bezeichnet das Böse als gemeinschaftsschädigende Wirklichkeit, ohne sie ausschließlich mit dem Täter gleichzusetzen.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die Wendung bewahrt die gemeinschaftliche Perspektive und die Anrede Israels im Singular.
theological_decisions:
- issue: Wiedergabe der deuteronomischen Rechtsformel וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: So sollst du das Böse aus deiner Mitte beseitigen.
  alternative: So sollst du den Übeltäter aus deiner Mitte beseitigen.
  rationale: Der hebräische Wortlaut nennt „das Böse“ und ist weiter gefasst als eine ausdrückliche Bezeichnung des Täters. Die Übersetzung bewahrt diese rechtliche und theologische Spannung, ohne den Gegenstand eigenmächtig auf die Person zu verengen.
- issue: Verantwortung der Zeugen bei der Vollstreckung
  choice: Die Zeugen beginnen die Vollstreckung, danach wirkt das ganze Volk mit.
  alternative: Die Zeugen sprechen lediglich das belastende Zeugnis aus.
  rationale: Der Wortlaut weist den Zeugen ausdrücklich die erste tätige Beteiligung an der Tötung zu. Damit wird ihre Verantwortung für die Wahrheit ihres Zeugnisses sichtbar, ohne dem Vers eine weitergehende konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Hand-Metapher wird teilweise durch die geläufige Wendung „Hand an ihn legen“ bewahrt und beim zweiten Vorkommen idiomatisch als Mitwirkung ausgedrückt; die vollständige Parallelstruktur steht in der Fußnote. Die singularische Gemeinschaftsanrede bleibt mit „du/deiner“ erhalten.
