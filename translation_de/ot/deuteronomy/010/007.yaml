  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: de
  text: Von dort brachen sie nach Gudgoda auf und zogen von Gudgoda weiter nach Jotbata, einem Land mit Wasserläufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Land mit Bächen“ oder „einem Land mit Wasserläufen/Wadis“. Das hebräische נַחֲלֵי מָיִם bezeichnet Wasserläufe, Bäche oder Rinnen; in passendem Gelände können auch Wadis gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Präposition mit dem Ortsadverb bezeichnet den Ausgangspunkt der nächsten Reiseetappe; „von dort“ ist im Deutschen knapp und natürlich.
- source_word: נָסְעוּ
  choice: brachen sie … auf
  rationale: נסע bezeichnet in Reiserouten häufig das Aufbrechen beziehungsweise den Abmarsch von einem Lagerplatz und nicht bloß allgemeines Reisen.
- source_word: הַגֻּדְגֹּדָה
  choice: nach Gudgoda
  rationale: Das angehängte lokale ה zeigt die Bewegungsrichtung an. Der Ortsname wird in einer im Deutschen gut lesbaren Form wiedergegeben.
- source_word: וּמִן הַגֻּדְגֹּדָה
  choice: und zogen von Gudgoda weiter
  rationale: Die Formulierung führt die Reiseroute vom genannten Ort aus fort. „zogen … weiter“ ergänzt im Deutschen idiomatisch das im zweiten Teilsatz ausgesparte Bewegungsverb.
- source_word: יָטְבָתָה
  choice: nach Jotbata
  rationale: Auch hier zeigt das lokale ה die Richtung an; der Ortsname wird nach deutscher Laut- und Schreibkonvention transliteriert.
- source_word: אֶרֶץ
  choice: in ein Land
  rationale: Die Nominalgruppe beschreibt Jotbata beziehungsweise das Zielgebiet näher. „in ein Land“ bindet diese appositionale Ortsbeschreibung natürlich an das Richtungsverb an.
- source_word: נַחֲלֵי מָיִם
  choice: mit Wasserläufen
  rationale: נַחַל kann Bach, Wasserlauf oder Wadi bezeichnen. „Wasserläufe“ ist verständlich und bewahrt die topografische Bedeutungsbreite besser als eine Festlegung auf ständig fließende Bäche.
