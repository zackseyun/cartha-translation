base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: de
  text: Ich aber blieb wie beim ersten Mal vierzig Tage und vierzig Nächte auf dem Berg. Auch diesmal hörte mich Jahwe[a] an; Jahwe wollte dich nicht vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe erhörte mich.“ Das hebräische Verb kann sowohl das Hören als auch das wohlwollende Eingehen auf eine Bitte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Ich aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Mose leicht hervor und nimmt den Erzählfaden wieder auf.
- source_word: עָמַדְתִּי
  choice: blieb
  rationale: Das Verb bedeutet wörtlich „stand“, bezeichnet hier angesichts der vierzig Tage und Nächte aber idiomatisch Moses Verbleiben auf dem Berg.
- source_word: בָהָר
  choice: auf dem Berg
  rationale: Dies ist die natürliche deutsche Ortsangabe für Moses Aufenthalt am Sinai/Horeb.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: wie beim ersten Mal
  rationale: Die Wendung vergleicht diesen Aufenthalt mit der ersten vierzigtägigen Zeit auf dem Berg; eine wörtliche Wiedergabe als „wie die ersten Tage“ wäre im Deutschen missverständlich.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Präzise und idiomatische Wiedergabe der Zeitangabe.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: erhörte mich Jahwe
  rationale: שׁמע mit אֶל bezeichnet hier im Zusammenhang mit Moses Fürbitte ein günstiges Hören beziehungsweise Eingehen auf seine Bitte. „Erhörte“ gibt diesen Zusammenhang natürlich wieder, ohne die mögliche Grundbedeutung „hörte auf mich“ zu verschweigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: Auch diesmal
  rationale: Die Formulierung bringt knapp und natürlich zum Ausdruck, dass Gott Mose auch bei dieser Gelegenheit Gehör schenkte.
- source_word: לֹא אָבָה
  choice: wollte nicht
  rationale: Das Verb bezeichnet fehlende Bereitschaft oder Willigkeit; „wollte nicht“ bewahrt den volitionalen Sinn.
- source_word: הַשְׁחִיתֶךָ
  choice: dich vernichten
  rationale: Der Singular bezeichnet Israel als angesprochenes Kollektiv; „vernichten“ gibt die drohende vollständige Zerstörung klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von וַיִּשְׁמַע יְהוָה אֵלַי
  choice: erhörte mich Jahwe
  alternative: hörte Jahwe auf mich
  rationale: Im Kontext von Moses Fürbitte umfasst das Verb sowohl Hören als auch eine günstige Reaktion. „Erhörte“ ist idiomatisch, während die Fußnote die lexikalische Spannweite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, ohne den Gedankengang zu verändern. „Ich aber“ bewahrt die leichte Hervorhebung; „blieb“ vermeidet die im Deutschen irreführende Vorstellung, Mose habe vierzig Tage ununterbrochen gestanden.
