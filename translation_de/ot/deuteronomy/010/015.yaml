  rationale: Die Revision stellt die Wortstellung so um, dass die exklusive Zuwendung zu den Vätern klar hervortritt, und gibt לְאַהֲבָה אֹתָם unmittelbar mit „um sie zu lieben“ wieder. „Jemandem anhängen“ ist eine natürliche deutsche Entsprechung für die starke Bindung von חָשַׁק. Die Apposition „– euch –“, die Erwählung und die Gegenwartsformel bleiben erhalten.
