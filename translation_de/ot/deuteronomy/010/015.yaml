  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: de
  text: Doch nur deinen Vätern hing Jahwe an, um sie zu lieben, und er erwählte ihre Nachkommen nach ihnen – euch – aus allen Völkern, wie es heute der Fall ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: doch nur
  rationale: 'Die Verbindung gibt sowohl die einschränkende als auch die kontrastierende Kraft im Zusammenhang wieder: Obwohl Jahwe Himmel und Erde gehören, wandte er sich gerade Israels Vätern zu.'
- source_word: בַּאֲבֹתֶיךָ חָשַׁק יְהוָה לְאַהֲבָה אֹתָם
  choice: an deinen Vätern hing Jahwe in Liebe
  rationale: חָשַׁק mit ב bezeichnet eine starke persönliche Zuneigung oder Bindung. „An jemandem hängen“ ist im Deutschen idiomatisch; „in Liebe“ bewahrt den ausdrücklich folgenden Liebesbegriff, ohne die Wendung schwerfällig zu verdoppeln.
- source_word: וַיִּבְחַר
  choice: und er erwählte
  rationale: „Erwählen“ gibt den bewussten Akt göttlicher Wahl würdig und theologisch transparent wieder, ohne ihn weiter auszudeuten.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: nach ihnen ihre Nachkommen
  rationale: זֶרַע ist hier kollektiv gebraucht. „Nachkommen“ ist im modernen Deutschen klarer als das formale „Same“ und bezeichnet die auf die Väter folgenden Generationen.
- source_word: בָּכֶם
  choice: – euch –
  rationale: Das Pronomen identifiziert appositionell die gegenwärtigen Angesprochenen mit den genannten Nachkommen; Gedankenstriche machen diese Hervorhebung sichtbar.
- source_word: מִכָּל הָעַמִּים
  choice: aus allen Völkern
  rationale: Die Formulierung bewahrt den separativen beziehungsweise auswählenden Sinn von מִן und gibt עַמִּים treffend mit „Völker“ wieder.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es noch heute der Fall ist
  rationale: Die natürliche deutsche Wendung bezeichnet den gegenwärtig erkennbaren Sachverhalt als Bestätigung der Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Göttliche Erwählung
  choice: Die ausdrückliche Aussage von Jahwes Liebe zu den Vätern und seiner Erwählung ihrer Nachkommen bleibt erhalten.
  alternative: Die Wahl als bloße historische Bevorzugung abzuschwächen oder sie im Sinn eines späteren Lehrsystems auszuformulieren.
  rationale: Der hebräische Text verbindet persönliche Zuneigung, Liebe und Wahl, erklärt aber an dieser Stelle weder deren umfassende dogmatische Bedeutung noch hebt er die Spannung zur universalen Herrschaft Jahwes im vorausgehenden Vers auf.
- issue: Bezug von רַק
  choice: „Doch nur“ wird auf Jahwes besondere Zuwendung zu den Vätern bezogen.
  alternative: רַק rein adversativ als „doch“ oder rein restriktiv als „nur“ wiederzugeben.
  rationale: Das Hebräische lässt beide Nuancen anklingen; die Doppelung bewahrt die überraschende Besonderheit der Wahl im Kontrast zum vorausgehenden universalen Anspruch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch die idiomatische Wendung „in Liebe hängen“ und die erläuternde Apposition „– euch –“ natürlich lesbar. Der Fußnotenmarker steht im Haupttext.
