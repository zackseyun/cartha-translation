source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: de
  text: Die Israeliten brachen von Beerot-Bene-Jaakan nach Mosera auf.[a] Dort starb Aaron, und dort wurde er begraben. Sein Sohn Eleasar diente an seiner Stelle als Priester.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Beerot-Bene-Jaakan“ kann wörtlich als „Brunnen der Söhne Jaakans“ verstanden werden; hier wird die Wortfolge als Ortsname wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sein Sohn Eleasar diente nach ihm als Priester.“ Das Hebräische lautet wörtlich „an seiner Stelle“ und bezeichnet seine Nachfolge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Die Israeliten
  rationale: Die übliche moderne deutsche Volksbezeichnung gibt den hebräischen Ausdruck „Söhne Israels“ natürlich und verständlich wieder; das einleitende ו wird im Deutschen nicht eigens ausgedrückt, da der Vers als eingeschobene Reiseangabe beginnt.
- source_word: נָסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet in Reiseberichten häufig das Aufbrechen beziehungsweise Weiterziehen von einem Lagerplatz.
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: von Beerot-Bene-Jaakan
  rationale: Die Wortfolge wird als zusammengesetzter Ortsname transkribiert; die Präposition מִן wird mit „von“ wiedergegeben.
- source_word: מוֹסֵרָה
  choice: nach Mosera
  rationale: Nach dem Verb des Aufbrechens bezeichnet der präpositionslose Ortsname das Ziel; im Deutschen wird dafür idiomatisch „nach“ ergänzt.
- source_word: שָׁם מֵת אַהֲרֹן וַיִּקָּבֵר שָׁם
  choice: Dort starb Aaron, und dort wurde er begraben
  rationale: Die zweimalige Ortsangabe wird entsprechend dem Hebräischen wiederholt; der Nifal von קבר wird passiv übersetzt.
- source_word: וַיְכַהֵן אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: Sein Sohn Eleasar diente an seiner Stelle als Priester
  rationale: Das Verb כהן bezeichnet die Ausübung des Priesteramts. תחתיו bedeutet wörtlich und sachlich „an seiner Stelle“ und markiert die Nachfolge.
theological_decisions:
- issue: Art der Nachfolge Eleasars
  choice: diente an seiner Stelle als Priester
  alternative: diente nach ihm als Priester
  rationale: Die Übersetzung bewahrt die konkrete Stellvertretungs- beziehungsweise Nachfolgebedeutung von תחתיו, ohne zusätzliche Aussagen über Amtsübertragung oder institutionelle Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Israeliten“ ist natürlicher als das im Deutschen markierte „die Söhne Israels“. Die Ortsnamen folgen einer gut lesbaren deutschen Transkription. Die Wiederholung von „dort“ bewahrt die örtliche Betonung des hebräischen Textes.
