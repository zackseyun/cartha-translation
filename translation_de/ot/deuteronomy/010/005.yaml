  terminology: „Tafeln“, „Lade“ und „Yahweh“ sind kontextgerecht und terminologisch konsistent. Es wird kein nicht im Vers stehendes „Stein“ ergänzt. Der Gottesname wird als Eigenname wiedergegeben.
