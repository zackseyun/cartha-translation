language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: de
  text: Dann wandte ich mich um und stieg vom Berg hinab. Ich legte die Tafeln in die Lade, die ich gemacht hatte; und sie waren dort[a], genau wie Yahweh mir geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie waren dort“; die Formulierung kann auch bedeuten, dass sie bis zur Zeit des Sprechens dort blieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Dann wandte ich mich um
  rationale: פנה bedeutet hier „sich umwenden“. „Dann“ gibt die fortschreitende Erzählfolge des hebräischen Narrativs natürlich wieder.
- source_word: וָאֵרֵד מִן הָהָר
  choice: und stieg vom Berg hinab
  rationale: ירד bezeichnet eine Bewegung nach unten. „Vom Berg hinabsteigen“ ist im Deutschen natürlich und bewahrt den bestimmten Bezug auf den Berg.
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: Ich legte die Tafeln
  rationale: שׂים bedeutet „legen, setzen, stellen“. „Legte“ passt zur Unterbringung der Tafeln; „Steintafeln“ wird nicht ergänzt, da „Stein“ in diesem Vers nicht ausdrücklich steht.
- source_word: בָּאָרוֹן
  choice: in die Lade
  rationale: אָרוֹן bezeichnet eine Lade oder Truhe; im Bundeszusammenhang ist „Lade“ die sachlich und traditionell passende deutsche Bezeichnung. Der Akkusativ gibt die durch das Verb ausgedrückte Bewegung ins Innere wieder.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: die ich gemacht hatte
  rationale: Der Relativsatz bezieht sich auf die Lade. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass ihre Anfertigung dem Einlegen der Tafeln vorausging.
- source_word: וַיִּהְיוּ שָׁם
  choice: und sie waren dort
  rationale: Die Form von היה mit שׁם besagt zunächst, dass die Tafeln dort waren. Eine Fortdauer bis zur Zeit des Sprechens ist möglich, wird aber nicht interpretierend in den Haupttext eingetragen.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: genau wie … mir geboten hatte
  rationale: כַּאֲשֶׁר drückt Entsprechung aus; „genau wie“ gibt diesen Sinn klar wieder. Das Plusquamperfekt entspricht der im Deutschen vorausliegenden Anweisung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Yahweh“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration „Yahweh“ bewahrt dessen Funktion als persönlicher Bundesname.
- issue: Zeitlicher Sinn von וַיִּהְיוּ שָׁם
  choice: sie waren dort
  alternative: sie blieben dort; sie sind dort
  rationale: Der Haupttext bewahrt die grammatisch unmittelbare Vergangenheitsaussage. Die mögliche Aussage fortdauernden Verbleibs wird in der Fußnote genannt, ohne die zeitliche Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Lade“ wahrt den etablierten biblischen Ausdruck, ohne altertümliche Satzformen zu verwenden. Der Fußnotenmarker steht bei der Wendung, auf die sich die Anmerkung tatsächlich bezieht.
