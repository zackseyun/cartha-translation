  source_fidelity: 'Der Entwurf gibt sämtliche Sinnelemente des Hebräischen zuverlässig wieder: die Zeitangabe, den Gottesnamen, das Behauen der zwei steinernen Tafeln nach dem Vorbild der ersten, den Aufstieg zu Jahwe auf den Berg sowie die Anfertigung einer hölzernen Lade. Die benefaktive Nuance von לְךָ ist mit „dir“ angemessen erhalten.'
