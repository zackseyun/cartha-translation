source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: de
  text: 'Zu jener Zeit sagte Jahwe zu mir: „Haue dir zwei steinerne Tafeln wie die ersten zurecht[a], steig zu mir auf den Berg hinauf und fertige dir eine Lade aus Holz an[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „zwei Tafeln aus Stein wie die früheren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Kasten aus Holz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Zu jener Zeit
  rationale: Die Wendung gibt den erzählerischen Zeitbezug natürlich und mit der deiktischen Kraft von הַהִוא wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: פְּסָל
  choice: Haue ... zurecht
  rationale: Der Imperativ bezeichnet das Behauen beziehungsweise Formen der steinernen Tafeln. Die deutsche Wendung ist anschaulich, verständlich und nicht unnötig altertümlich.
- source_word: לְךָ
  choice: dir
  rationale: Der deutsche Dativ gibt in diesem Zusammenhang die reflexiv-benefaktive Bedeutung natürlich wieder.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: zwei steinerne Tafeln wie die ersten
  rationale: Die Formulierung bewahrt Zahl, Material und den Vergleich mit den zuvor genannten ersten Tafeln in idiomatischem Deutsch.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: steig zu mir auf den Berg hinauf
  rationale: „Hinaufsteigen“ bildet die Aufwärtsbewegung ab; „zu mir“ und „auf den Berg“ bewahren sowohl den Bezug auf Gott als auch das Ziel der Bewegung.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: und fertige dir eine Lade aus Holz an
  rationale: „Lade“ ist im deutschen biblischen Sprachgebrauch die klare Bezeichnung für den heiligen Behälter der Tafeln; „aus Holz“ gibt die Materialangabe unmittelbar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von אֲרוֹן im Bundeskontext
  choice: Lade
  alternative: Kasten
  rationale: Das Wort kann allgemein einen Kasten oder Behälter bezeichnen; hier ist wegen seiner Bestimmung für die Bundestafeln „Lade“ sachlich und traditionsgeschichtlich angemessen, ohne im Haupttext „Bundeslade“ ausdrücklich zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und gebietend. Die Fußnotenmarker stehen jeweils unmittelbar bei der Wendung, auf die sich die Alternative bezieht.
