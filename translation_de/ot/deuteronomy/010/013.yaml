  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: de
  text: Jahwes Gebote und seine Satzungen zu halten[a], die ich dir heute gebiete, zu deinem Besten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu befolgen“ oder „zu bewahren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: zu halten
  rationale: Der Infinitiv mit ל setzt inhaltlich fort, was Jahwe im vorausgehenden Vers fordert. „Gebote halten“ ist im Deutschen eine natürliche, würdige Wendung für verbindlichen Gehorsam und bewahrt zugleich den praktischen Sinn von שׁמר.
- source_word: מִצְוֺת
  choice: Gebote
  rationale: Der Plural von מִצְוָה bezeichnet die von Jahwe auferlegten Verpflichtungen. „Gebote“ wahrt den rechtlich-bundestheologischen Sprachgebrauch des Deuteronomiums.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben. „Jahwe“ ist die im modernen Deutschen gebräuchliche Form, statt den Namen durch den Titel „der HERR“ zu ersetzen.
- source_word: חֻקֹּתָיו
  choice: seine Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte, verbindliche Ordnungen. „Satzungen“ erhält den rechtlichen Klang und unterscheidet den Ausdruck von „Gebote“.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Die Relativkonstruktion bezieht sich auf die zusammengehörige Wortgruppe „Gebote und Satzungen“. Das Präsens und „heute“ bewahren die unmittelbare Bundesansprache.
- source_word: לְטוֹב לָךְ
  choice: zu deinem Besten
  rationale: Die Wendung bezeichnet den Nutzen beziehungsweise das Wohlergehen des Angesprochenen. „Zu deinem Besten“ ist knapp, idiomatisch und lässt Zweck und Ergebnis gleichermaßen offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Nutzen der göttlichen Gebote in לְטוֹב לָךְ
  choice: zu deinem Besten
  alternative: damit es dir gut geht
  rationale: Die nominale Formulierung wahrt die Offenheit zwischen Zweck und Folge und fügt keine ausdrückliche Verheißung eines bestimmten Wohlergehens hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-bundestheologischem Klang. Der Satz bleibt als Fortsetzung der Frage aus dem vorausgehenden Vers fragmentarisch und endet daher mit einem Fragezeichen.
