base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: de
  text: Denn Jahwe, euer Gott, ist der Gott der Götter und der Herr der Herren, der große, mächtige und ehrfurchtgebietende[a] Gott, der niemanden bevorzugt und keine Bestechung annimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „furchtgebietend“ oder „Furcht erregend“; das hebräische Wort bezeichnet den, der Furcht und ehrfürchtiges Erschauern hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und bewahrt den kausalen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Das Suffix der zweiten Person Plural bezieht sich auf Israel; im Zusammenhang bezeichnet אֱלֹהִים den einen Gott Israels.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: der Gott der Götter
  rationale: Die hebräische Genitivverbindung bleibt als Hoheits- und Überlegenheitsformel erhalten, ohne die Existenz oder das Wesen anderer Götter näher auszudeuten.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: und der Herr der Herren
  rationale: Bewahrt die parallele Titelformel und ihren feierlichen Klang.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר
  choice: der große, mächtige … Gott
  rationale: Gibt die appositionelle Folge göttlicher Titel und Eigenschaften verständlich und mit würdigem Rhythmus wieder.
- source_word: וְהַנּוֹרָא
  choice: und Ehrfurcht gebietende
  rationale: Das von ירא abgeleitete Wort bezeichnet den, der Furcht beziehungsweise ehrfürchtiges Erschauern hervorruft. Die Formulierung wahrt beide Aspekte besser als das im heutigen Deutsch oft abgeschwächte „großartig“.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: der niemanden bevorzugt
  rationale: Gibt die hebräische Wendung wörtlich „kein Gesicht erhebt“ idiomatisch als unparteiisches Handeln wieder.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: und keine Bestechung annimmt
  rationale: Bewahrt die rechtlich-ethische Aussage, dass Gott sich durch keine Bestechung beeinflussen lässt.
theological_decisions:
- issue: Die Formel „Gott der Götter und Herr der Herren“
  choice: Die hebräischen Genitivverbindungen werden wörtlich als Hoheitsformel beibehalten.
  alternative: „der höchste Gott und höchste Herr“ oder „Gott über allen Göttern“
  rationale: Die wörtliche Form bewahrt die rhetorische Aussage uneingeschränkter Vorrangstellung, ohne eine weitergehende ontologische Deutung der genannten „Götter“ in den Text einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Name wird sichtbar erhalten; die traditionelle Ersetzung durch einen Titel steht nicht im hebräischen Konsonantentext.
- issue: Bedeutung von הַנּוֹרָא
  choice: Ehrfurcht gebietend
  alternative: furchtgebietend oder Furcht erregend
  rationale: Die Übersetzung hält die Spannung zwischen Furcht und ehrfürchtigem Staunen aufrecht, ohne das Wort ausschließlich als bedrohlich oder bloß als bewundernswert zu verstehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Satzrhythmus. Die traditionelle Titelfolge bleibt erhalten; idiomatische Rechtsbegriffe machen den abschließenden Parallelismus klar.
