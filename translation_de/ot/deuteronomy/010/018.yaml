source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: de
  text: Er verschafft der Waise und der Witwe Recht und liebt den Fremden[a], indem er ihm Nahrung und Kleidung gibt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Fremder“ ist hier ein Nichtisraelit gemeint, der als Zugezogener unter Israel lebt, nicht lediglich ein Durchreisender.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Brot und Kleidung“. „Nahrung und Kleidung“ bezeichnet hier die grundlegende Versorgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: verschafft … Recht
  rationale: Die feste Verbindung bezeichnet, dass Gott den Rechtsanspruch gefährdeter Menschen wirksam durchsetzt. Die deutsche Wendung ist natürlich und bewahrt den rechtlichen Akzent.
- source_word: יָתוֹם
  choice: Waise
  rationale: Im heutigen Standarddeutsch ist „Waise“ die natürliche Bezeichnung; das hebräische Wort kann genauer ein vaterloses Kind meinen.
- source_word: אַלְמָנָה
  choice: Witwe
  rationale: Dies ist die genaue und geläufige Bezeichnung der genannten sozial gefährdeten Personengruppe.
- source_word: אֹהֵב
  choice: liebt
  rationale: Die direkte Wiedergabe bewahrt Gottes aktive Zuwendung, die im folgenden Satzteil durch konkrete Versorgung sichtbar wird.
- source_word: גֵּר
  choice: Fremden
  rationale: Gemeint ist ein Nichtisraelit, der dauerhaft unter Israel lebt, nicht bloß ein Durchreisender. „Fremder“ ist im Bibelkontext verständlich; eine Fußnote präzisiert den rechtlich-sozialen Sinn.
- source_word: לָתֶת לוֹ
  choice: indem er ihm … gibt
  rationale: Der Infinitiv erläutert, wie sich Gottes Liebe konkret äußert. „Indem“ macht diesen Zusammenhang im Deutschen klar, ohne ihn über das Hebräische hinaus auszudehnen.
- source_word: לֶחֶם
  choice: Nahrung
  rationale: Wörtlich steht „Brot“, hier jedoch als grundlegendes Lebensmittel beziehungsweise Lebensunterhalt. „Nahrung“ gibt die gemeinte Grundversorgung natürlich wieder.
- source_word: שִׂמְלָה
  choice: Kleidung
  rationale: Der allgemeine Ausdruck bezeichnet ein Kleidungsstück oder Kleidung; im Zusammenhang geht es um ein grundlegendes Lebensbedürfnis.
theological_decisions:
- issue: Gottes Sorge für sozial gefährdete Menschen
  choice: Der Vers beschreibt sowohl Gottes wirksames Eintreten für ihr Recht als auch seine Liebe, die sich in materieller Versorgung zeigt.
  alternative: Den Vers ausschließlich als rechtliche Fürsprache oder ausschließlich als gefühlsmäßiges Mitgefühl wiederzugeben.
  rationale: Der hebräische Text verbindet Rechtshandeln, Liebe und konkrete Versorgung. Die Übersetzung erhält diese Aspekte nebeneinander, ohne weitergehende Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschafft … Recht“ wahrt den gerichtlichen und zugleich tätigen Sinn der hebräischen Verbindung. Die Satzstruktur bleibt knapp und gut verständlich.
