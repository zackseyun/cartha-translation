source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: de
  text: 'Und nun, Israel: Was fordert Jahwe, dein Gott, von dir, außer dass du Jahwe, deinen Gott, fürchtest[a], auf allen seinen Wegen gehst, ihn liebst und Jahwe, deinem Gott, mit deinem ganzen Herzen und mit deiner ganzen Seele[b] dienst?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fürchten“ schließt hier Ehrfurcht, Scheu und gehorsame Hingabe gegenüber Jahwe ein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit deinem ganzen Leben“; das hebräische Wort kann Seele, Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den Übergang zur folgenden Ermahnung.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: Was fordert ... von dir
  rationale: שׁאל mit מֵעִם kann hier ein verpflichtendes Fordern bezeichnen. Im Zusammenhang der Bundesermahnung gibt „fordert“ die Verbindlichkeit natürlicher wieder als das schwächere „bittet“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי אִם
  choice: außer dass
  rationale: Bewahrt in der rhetorischen Frage die einschränkende und zugleich inhaltlich einführende Funktion der Wendung.
- source_word: לְיִרְאָה
  choice: fürchtest
  rationale: „Fürchten“ erhält die Spannweite von Furcht, Ehrfurcht und gehorsamer Hingabe, ohne sie auf bloßen Respekt zu verengen.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: auf allen seinen Wegen gehst
  rationale: Bewahrt das hebräische Bild des Gehens als Ausdruck der Lebensführung und ist im Deutschen verständlich.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: ihn liebst
  rationale: Direkte und natürliche Wiedergabe der Liebe zu Jahwe in ihrer persönlichen und bundestreuen Dimension.
- source_word: וְלַעֲבֹד
  choice: dienst
  rationale: „Dienen“ umfasst Anbetung, Gehorsam und tätige Hingabe und verengt die Aussage nicht auf den Kult.
- source_word: בְּכָל לְבָבְךָ
  choice: mit deinem ganzen Herzen
  rationale: „Herz“ ist die etablierte Entsprechung und bezeichnet hier die innere Person einschließlich Denken und Wollen.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: mit deiner ganzen Seele
  rationale: „Seele“ bewahrt die traditionelle Wiedergabe und die mögliche Bedeutung des ganzen lebendigen Selbst; die Alternative „mit deinem ganzen Leben“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transkription bewahrt diesen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von ירא in der Bundesermahnung
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ erhält die theologische Spannung zwischen Furcht, Ehrfurcht und gehorsamer Hingabe; eine reine Umschreibung mit „Ehrfurcht“ würde den Ausdruck abschwächen.
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: Seele
  alternative: Leben / ganzes Selbst
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person meinen. „Seele“ wird im Haupttext beibehalten, ohne die umfassendere Bedeutung durch die Fußnote auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die singularische Anrede Israels wird durchgehend mit „du/dein“ bewahrt. Die hebräische Weg-Metapher bleibt erhalten; die Satzstruktur wurde nur so weit geglättet, dass die rhetorische Frage natürlich lesbar ist.
