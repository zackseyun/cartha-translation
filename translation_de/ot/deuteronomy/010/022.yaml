  source_fidelity: 'Der Entwurf gibt alle maßgeblichen Elemente des hebräischen Textes zutreffend wieder: die siebzig Personen, die Väter als Subjekt, die Bewegung nach Ägypten hinab, den zeitlichen Kontrast „und nun“, Jahwe als Gottesnamen sowie die zahlenmäßige Vermehrung im Vergleich zu den Sternen. „So zahlreich gemacht wie die Sterne am Himmel“ gibt den mit לָרֹב ausgedrückten Mengenvergleich idiomatisch und sachgerecht wieder.'
  naturalness: „Mit siebzig Menschen zogen deine Väter nach Ägypten hinab; und nun hat Jahwe, dein Gott, dich so zahlreich gemacht wie die Sterne am Himmel“ ist verständliches, würdiges modernes Standarddeutsch. Die Stellung von „hinab“ ist stilistisch angemessen und bewahrt die Bewegungsrichtung des Ausgangstextes.
  terminology: „Jahwe“ entspricht der vorgesehenen Wiedergabe von יהוה. „Deine Väter“ wahrt den ausdrücklich männlichen hebräischen Ausdruck; die Fußnote erläutert die mögliche referenzielle Wiedergabe „Vorfahren“, ohne den Haupttext zu neutralisieren. „Menschen“ ist für נֶפֶשׁ als Zählbegriff treffend.
