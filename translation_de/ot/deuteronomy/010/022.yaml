  variant: modern standard German
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: de
  text: Mit siebzig Menschen[a] zogen deine Väter[b] nach Ägypten hinab; und nun hat Jahwe, dein Gott, dich so zahlreich gemacht wie die Sterne am Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit siebzig Seelen“. Das hebräische Wort נֶפֶשׁ wird hier als Zählbegriff für Menschen gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „deine Vorfahren“. Im Hebräischen steht ausdrücklich „deine Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: mit siebzig Menschen
  rationale: נֶפֶשׁ dient hier als Zählbegriff für Personen. „Menschen“ gibt die hebräische Wendung im heutigen Deutsch natürlich wieder, ohne die moderne Vorstellung körperloser „Seelen“ nahezulegen.
- source_word: יָרְדוּ
  choice: zogen … hinab
  rationale: ירד bezeichnet das Hinabgehen beziehungsweise Hinabziehen. Die Formulierung bewahrt die traditionelle räumliche Perspektive auf die Reise nach Ägypten und klingt im Deutschen natürlich.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet hier Israels Vorväter. Die wörtliche Entsprechung bleibt im Haupttext erhalten.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung zeigt eine Bewegung auf Ägypten zu an; „nach Ägypten“ ist dafür die idiomatische deutsche Form.
- source_word: וְעַתָּה
  choice: und nun
  rationale: Die Verbindung wahrt sowohl die hebräische Verknüpfung als auch den Kontrast zwischen dem kleinen Anfang und der gegenwärtigen Menge.
- source_word: שָׂמְךָ
  choice: hat … dich … gemacht
  rationale: שׂים bedeutet grundsätzlich „setzen/stellen“, bezeichnet hier aber idiomatisch das Herbeiführen eines Zustands. „Hat dich so zahlreich gemacht“ gibt das Ergebnis klar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte und natürliche Wiedergabe der Verbindung mit dem Suffix der zweiten Person Singular.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: so zahlreich … wie die Sterne am Himmel
  rationale: לָרֹב verdeutlicht, dass der Vergleich die zahlenmäßige Fülle betrifft. Die deutsche Konstruktion macht diesen Sinn ausdrücklich und bewahrt zugleich das Bild der Himmelssterne.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifischer Ahnenbegriff אֲבֹתֶיךָ
  choice: deine Väter
  alternative: deine Vorfahren
  rationale: Der hebräische Text verwendet ausdrücklich „Väter“. Diese geschlechtsspezifische Form bleibt erhalten, während eine Fußnote die mögliche sinngemäße Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zogen … hinab“ erhält die hebräische Bewegungsmetapher, während „so zahlreich … wie“ den durch לָרֹב bezeichneten Mengenvergleich idiomatisch ausdrückt. Die Fußnotenmarker stehen jeweils unmittelbar beim erläuterten Ausdruck.
