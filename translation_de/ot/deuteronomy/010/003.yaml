base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: de
  text: So machte ich eine Lade aus Akazienholz, hieb zwei Steintafeln wie die ersten[a] zurecht und stieg mit den beiden Tafeln in meiner Hand auf den Berg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „formte zwei Steintafeln wie die ersten“; das hebräische Verb bezeichnet das Behauen und Formen von Stein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: Lade
  rationale: „Lade“ ist im Deutschen die etablierte, kontextuell passende Bezeichnung für den heiligen Behälter der Bundestafeln und bleibt zugleich nahe an der Grundbedeutung eines Kastens oder einer Truhe.
- source_word: עֲצֵי שִׁטִּים
  choice: Akazienholz
  rationale: Die Zusammensetzung gibt die bezeichnete Holzart natürlich und präzise im modernen Deutschen wieder.
- source_word: וָאֶפְסֹל
  choice: hieb … zurecht
  rationale: פסל bezeichnet hier das Behauen und Formen von Stein. „Zurechthauen“ bildet den handwerklichen Vorgang genauer ab als das allgemeinere „schneiden“, ohne altertümlich zu wirken.
- source_word: לֻחֹת אֲבָנִים
  choice: Steintafeln
  rationale: „Steintafeln“ ist idiomatisch, knapp und bewahrt sowohl Material als auch Gegenstandsart.
- source_word: כָּרִאשֹׁנִים
  choice: wie die ersten
  rationale: Die Wendung wahrt den Vergleich mit den zuvor genannten Tafeln, ohne über die genaue Art ihrer Übereinstimmung hinauszugehen.
- source_word: וָאַעַל הָהָרָה
  choice: stieg auf den Berg hinauf
  rationale: Die Form von עלה zusammen mit dem Richtungs-H gibt eine Aufwärtsbewegung auf den Berg an; „hinaufsteigen“ bringt dies im Deutschen deutlich zum Ausdruck.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Die Übersetzung bewahrt den Singular des Hebräischen und ist als Ausdruck für das Tragen der Tafeln verständlich.
- source_word: וָאַעַשׂ
  choice: machte
  rationale: „Machte“ gibt das breite und direkte עשה natürlich wieder; das Material und der Gegenstand verdeutlichen den Herstellungsvorgang.
theological_decisions:
- issue: Bezeichnung des heiligen Behälters für die Bundestafeln
  choice: Lade
  alternative: Truhe
  rationale: „Lade“ bewahrt den im deutschen Bibelsprachgebrauch erkennbaren kultischen und bundesbezogenen Zusammenhang, ohne dem Ausdruck zusätzliche dogmatische Aussagen hinzuzufügen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit enger Bindung an die hebräische Handlungskette. Das traditionelle, aber weiterhin verständliche „Lade“ wird wegen des besonderen Bundeszusammenhangs beibehalten; ansonsten wird unnötig altertümliche Sprache vermieden.
