  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: de
  text: Und ich werde auf die Tafeln die Worte[a] schreiben, die auf den ersten Tafeln standen, die du zerbrochen hast, und du sollst sie in die Lade legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebote“; Hebräisch: „Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: Und ich werde ... schreiben
  rationale: Das Qal-Imperfekt der 1. Person Singular bezeichnet in diesem Zusammenhang Gottes zukünftiges Handeln; die deutsche Futurform gibt dies klar und natürlich wieder.
- source_word: הַלֻּחֹת
  choice: die Tafeln
  rationale: לוח bezeichnet hier die Tafeln des Bundes. Der Zusatz „aus Stein“ steht im unmittelbaren Kontext, wird in diesem Vers aber nicht wiederholt.
- source_word: הַדְּבָרִים
  choice: die Worte
  rationale: Die formnahe Wiedergabe bewahrt die breite Bedeutung von דבר und vermeidet die interpretierende Einengung auf „Gebote“.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: die ... standen
  rationale: Bei einem auf Tafeln befindlichen Schrifttext ist „auf den Tafeln standen“ idiomatischer als das wörtlichere „waren“ und bewahrt den Sinn.
- source_word: הָרִאשֹׁנִים
  choice: die ersten
  rationale: Das Adjektiv bezeichnet den früheren ersten Satz Tafeln im Gegensatz zu den neu angefertigten.
- source_word: שִׁבַּרְתָּ
  choice: die du zerbrochen hast
  rationale: Das Piel von שבר bezeichnet das Zerbrechen der Tafeln; „zerbrochen“ ist präzise, ohne die Art des Vorgangs stärker als der hebräische Text auszumalen.
- source_word: וְשַׂמְתָּם
  choice: dann sollst du sie ... legen
  rationale: Die Verbform trägt hier auffordernden Sinn. „Dann“ bildet den Handlungsfortgang natürlich ab; das Pronomen bezieht sich kontextuell auf die Tafeln.
- source_word: בָּאָרוֹן
  choice: in die Lade
  rationale: ארון bezeichnet hier die heilige Bundeslade. Wegen der gerichteten Bewegung ist im Deutschen „in die Lade“ idiomatisch, obwohl die hebräische Präposition formal auch lokativ sein kann.
theological_decisions:
- issue: Bezugswort des pronominalen Suffixes in וְשַׂמְתָּם
  choice: „sie“ bezieht sich auf die Tafeln.
  alternative: Das Suffix könnte grammatisch auch auf die Worte beziehungsweise Gebote bezogen werden.
  rationale: Sowohl „Tafeln“ als auch „Worte“ sind im Hebräischen maskulin plural. Die konkrete Handlung des Hineinlegens in die Lade und der Zusammenhang in Deuteronomium 10,1–5 sprechen jedoch deutlich für die Tafeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen eng, wird aber durch „standen“ und „dann“ natürlich lesbar. Keine Fußnote ist nötig, da „Worte“ die lexikalische Offenheit des hebräischen Ausdrucks bereits im Haupttext bewahrt.
