source:
  edition: WLC
  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: de
  text: Darum beschneidet die Vorhaut eures Herzens[a][b] und verhärtet euren Nacken nicht länger.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und beschneidet die Vorhaut eures Herzens.“ Die Konjunktion kann rein verbindend verstanden werden; der Zusammenhang erlaubt jedoch auch den Folgerungssinn „Darum“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische bewahrt das Bild wörtlich: „die Vorhaut eures Herzens“. Gemeint ist die Beseitigung des inneren Widerstands gegen Gott.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „macht euren Nacken nicht länger steif“ beziehungsweise „seid nicht länger halsstarrig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Darum beschneidet
  rationale: Das mit וּ verbundene Qal Perfekt der 2. Person Plural hat im argumentativen Zusammenhang auffordernde Kraft. „Darum“ gibt den naheliegenden Folgerungssinn wieder; die rein verbindende Lesart bleibt in Fußnote [a] erhalten.
- source_word: עָרְלַת לְבַבְכֶם
  choice: die Vorhaut eures Herzens
  rationale: Die konkrete Genitivmetapher wird wörtlich bewahrt, damit die bundesbezogene Bildsprache nicht durch eine erklärende Umschreibung eingeebnet wird.
- source_word: לְבַבְכֶם
  choice: eures Herzens
  rationale: „Herz“ ist das natürliche deutsche Äquivalent und kann hier wie das hebräische לֵבָב den inneren Menschen samt Willen und Einsicht bezeichnen.
- source_word: וְעָרְפְּכֶם
  choice: euren Nacken
  rationale: עֹרֶף bezeichnet Nacken beziehungsweise Genick. „Nacken“ bewahrt das körperliche Bild und ist in der deutschen Wendung verständlich.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: verhärtet ... nicht länger
  rationale: Der Hifil von קשׁה bezeichnet hier das Hart- oder Starrmachen. „Nicht länger“ gibt עוֹד im Verbot idiomatisch wieder.
theological_decisions:
- issue: Bundesmetapher der Beschneidung des inneren Menschen
  choice: 'Die Metapher ausdrücklich bewahren: „beschneidet die Vorhaut eures Herzens“'
  alternative: „Reinigt eure Herzen“ oder „legt die Halsstarrigkeit eures Herzens ab“
  rationale: Der hebräische Text überträgt die Beschneidung bewusst auf das Herz. Die wörtliche Bildsprache wahrt die Spannung zwischen äußerem Bundeszeichen und innerer Hinwendung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber zentrale hebräische Metapher bleibt im Haupttext erhalten; die zweite Körpermetapher wird mit „den Nacken verhärten“ formal nah und verständlich wiedergegeben.
