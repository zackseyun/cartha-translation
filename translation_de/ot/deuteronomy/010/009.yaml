source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: de
  text: Darum hat Levi keinen Anteil und kein Erbteil mit seinen Brüdern[a]. Jahwe ist sein Erbteil[b], so wie Jahwe, dein Gott, zu ihm gesprochen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Singular „Levi“ bezeichnet hier den Stamm Levi; mit seinen „Brüdern“ sind die übrigen Stämme Israels gemeint.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „Jahwe ist sein Anteil.“ Durch die Wiederholung von „Erbteil“ betont der hebräische Text, dass Levis Erbteil nicht Land, sondern Jahwe selbst ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und ist in modernem Deutsch natürlich.
- source_word: לְלֵוִי
  choice: Levi
  rationale: Der Eigenname im Singular steht stellvertretend für den Stamm Levi; die hebräische Form bleibt erhalten.
- source_word: חֵלֶק וְנַחֲלָה
  choice: Anteil und Erbteil
  rationale: Die zwei unterschiedlichen hebräischen Begriffe bleiben erkennbar; „Erbteil“ trägt hier besonders den Bezug auf den Landbesitz.
- source_word: עִם אֶחָיו
  choice: unter seinen Brüdern
  rationale: Gibt die Zugehörigkeit beziehungsweise Verteilung innerhalb der übrigen Stämme idiomatisch wieder und bewahrt das maskuline Verwandtschaftswort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא נַחֲלָתוֹ
  choice: ist sein Erbteil
  rationale: Die Wiederholung von נַחֲלָה wird bewahrt und hebt den Gegensatz zum fehlenden Land-Erbteil hervor.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: so wie … es ihm zugesagt hat
  rationale: דבר bedeutet grundsätzlich „reden/sagen“; im Zusammenhang bezeichnet die Aussage jedoch eine verbindliche göttliche Zusage. Das Pronomen „es“ macht den deutschen Satz flüssig, ohne einen zusätzlichen Inhalt einzuführen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Bewahrt die Anrede an Israel in der zweiten Person Singular.
- source_word: לוֹ
  choice: ihm
  rationale: Das singularische Pronomen verweist auf Levi als Repräsentanten des Stammes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen; die Transliteration bewahrt ihn als persönlichen Namen.
- issue: Levi als singularischer Repräsentant
  choice: Levi
  alternative: der Stamm Levi
  rationale: Die Übersetzung folgt der singularischen Ausdrucksweise des Hebräischen; eine Fußnote erklärt den kollektiven Bezug.
- issue: Bedeutung von Jahwe als Levis נַחֲלָה
  choice: Jahwe ist sein Erbteil
  alternative: Jahwe ist sein Anteil
  rationale: '„Erbteil“ erhält die lexikalische Wiederholung und die theologische Spannung: Levi empfängt kein territoriales Erbteil, weil Jahwe selbst sein Erbteil ist.'
- issue: Zeitwert von לֹא הָיָה
  choice: hat … keinen
  alternative: hatte … keinen
  rationale: Das hebräische Perfekt beschreibt hier den aus der damaligen Zuweisung hervorgegangenen und fortbestehenden Zustand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Anteil und Erbteil“ bewahrt die Doppelung des Ausgangstextes; „unter seinen Brüdern“ ist gegenüber dem wörtlicheren „mit seinen Brüdern“ im deutschen Landverteilungskontext idiomatischer.
