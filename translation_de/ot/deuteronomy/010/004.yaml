  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: de
  text: Und er schrieb auf die Tafeln, wie in der ersten Niederschrift, die Zehn Worte[a], die Yahweh auf dem Berg mitten aus dem Feuer am Tag der Versammlung zu euch gesprochen hatte; und Yahweh gab sie mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „die Zehn Gebote“. Hebräisch: „die zehn Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Und er schrieb
  rationale: Das Wayyiqtol der 3. Person Singular erzählt eine vergangene Handlung. „Schrieb“ ist natürlich und bewahrt die Verbindung zu מִכְתָּב („Niederschrift“).
- source_word: הַלֻּחֹת
  choice: die Tafeln
  rationale: Im Zusammenhang sind die Bundestafeln gemeint. „Stein“ ist zwar aus dem Kontext bekannt, steht aber in diesem Vers nicht ausdrücklich.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: wie bei der ersten Niederschrift
  rationale: כְּ drückt einen Vergleich aus; מִכְתָּב bezeichnet hier das Geschriebene beziehungsweise die Niederschrift. Die Formulierung ist im Deutschen natürlicher als „wie die erste Schrift“, ohne die Vergleichsaussage aufzugeben.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: die Zehn Worte
  rationale: Die hebräische Wendung lautet wörtlich „die zehn Worte“. Die traditionelle Bezeichnung „Zehn Gebote“ wird in der Fußnote genannt.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: die Yahweh … zu euch gesprochen hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Yahwehs Reden dem Schreiben und Übergeben vorausging.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die Präposition bezeichnet hier den Ort der Offenbarung am Berg.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Die Wendung bewahrt anschaulich, dass die Stimme aus dem Inneren des Feuers hervorkam, und klingt zugleich natürlich auf Deutsch.
- source_word: בְּיוֹם הַקָּהָל
  choice: am Tag der Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft Israels beziehungsweise das Ereignis ihres Zusammenkommens.
- source_word: וַיִּתְּנֵם … אֵלָי
  choice: Dann gab Yahweh sie mir
  rationale: נתן wird schlicht mit „geben“ wiedergegeben. „Dann“ bildet die fortschreitende Erzählung idiomatisch ab; das Pronomen bezieht sich auf die Tafeln beziehungsweise deren Inhalt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Yahweh“ wahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von עֲשֶׂרֶת הַדְּבָרִים
  choice: die Zehn Worte
  alternative: die Zehn Gebote
  rationale: „Zehn Worte“ entspricht unmittelbar dem hebräischen Ausdruck und lässt dessen Bezeichnung bestehen. Die geläufige traditionelle Wiedergabe wird als verständliche Alternative in der Fußnote bewahrt.
- issue: Bezug des Suffixes in וַיִּתְּנֵם
  choice: „sie“ ohne erläuternde Festlegung
  alternative: die Tafeln; die Worte
  rationale: Das maskuline Pluralsuffix kann im Zusammenhang formal auf die „Worte“ bezogen werden, während sachlich die beschriebenen Tafeln übergeben werden. Das Pronomen bewahrt diese leichte Bezugsoffenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vor dem abschließenden Übergabeakt verbessert die Lesbarkeit, ohne die Abfolge des Hebräischen zu verändern. „Niederschrift“ hält den Zusammenhang zwischen Schreiben und Geschriebenem fest; „Versammlung“ vermeidet konfessionell geprägte Begriffe.
