  terminology: „Yahweh“ entspricht dem Tetragramm; „die Zehn Worte“ wahrt die hebräische Bezeichnung. Die Fußnote bietet die traditionelle deutsche Wiedergabe sachgerecht an. „Tafeln“, „Berg“, „Feuer“ und „Versammlung“ sind treffend und nicht unnötig ausdeutend.
