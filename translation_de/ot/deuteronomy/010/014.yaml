base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: de
  text: 'Sieh: Jahwe, deinem Gott, gehören der Himmel, ja, selbst die höchsten Himmel[a], die Erde und alles, was in ihr ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Himmel und die Himmel der Himmel“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Steigerungsform neben ihrer idiomatischen Wiedergabe im Haupttext.
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende feierliche Aussage hervor. „Sieh“ bewahrt diese auffordernde und betonte Funktion in verständlichem Deutsch.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott, gehören
  rationale: Das mit ל gebildete Besitzverhältnis wird im Deutschen natürlich durch „gehören“ ausgedrückt; der Gottesname und die persönliche Bundesanrede „deinem Gott“ bleiben erhalten.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: Das hebräische Wort steht der Form nach im Plural, bezeichnet hier jedoch den gesamten Himmel beziehungsweise die himmlischen Bereiche. Der deutsche Singular ist in diesem kosmischen Zusammenhang idiomatisch.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: ja, selbst die höchsten Himmel
  rationale: Die wörtliche Verbindung „Himmel der Himmel“ dient als Steigerung. „Die höchsten Himmel“ gibt diesen Sinn klar wieder; „ja, selbst“ macht die Intensivierung gegenüber dem vorangehenden Ausdruck sichtbar.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Gegensatz zum Himmel und die anschließende Gesamtaussage weisen auf die Erde im kosmischen Sinn, nicht lediglich auf ein bestimmtes Land.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: und alles, was auf ihr ist
  rationale: Die Wendung bezeichnet umfassend alles, was sich auf beziehungsweise in der Erde befindet. Im Deutschen ist bei „Erde“ die Formulierung „auf ihr“ am natürlichsten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt das Tetragramm als Eigenname wieder, ohne es durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die feierliche Hervorhebung und bleibt zugleich für heutige Leser klar.
