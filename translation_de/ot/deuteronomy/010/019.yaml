  source_fidelity: Die Übersetzung gibt die auffordernde Funktion von וַאֲהַבְתֶּם angemessen wieder und bewahrt mit „Fremden/Fremde“ die absichtliche Wiederholung von גֵּר. „Darum“ stellt den aus V. 18 folgenden Zusammenhang plausibel heraus; „denn“ gibt כִּי als Begründung treffend wieder. „im Land Ägypten“ entspricht בְּאֶרֶץ מִצְרָיִם vollständig.
  naturalness: „Darum liebt den Fremden, denn ihr seid selbst Fremde im Land Ägypten gewesen“ ist flüssiges, würdiges modernes Standarddeutsch. Das Perfekt „seid ... gewesen“ ist idiomatisch und die Wiederholung klingt nicht störend, sondern trägt den rhetorischen Zusammenhang.
  terminology: „Fremder“ ist als allgemeine, verständliche Wiedergabe von גֵּר vertretbar. Die Fußnote klärt sachgerecht, dass nicht ein bloß unbekannter oder vorüberreisender Mensch, sondern ein dauerhaft ansässiger Nicht-Einheimischer gemeint ist. Die Alternativen machen die semantische Bandbreite transparent, ohne eine moderne Rechtskategorie in den Haupttext einzutragen.
