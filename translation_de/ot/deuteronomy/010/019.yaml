  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: de
  text: Darum liebt den Fremden[a], denn ihr seid selbst Fremde im Land Ägypten gewesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Beisassen« beziehungsweise »den ansässigen Ausländer«. Das hebräische Wort ger bezeichnet einen Nichtisraeliten, der dauerhaft unter Israel lebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Darum liebt
  rationale: Die Form führt den vorherigen Gedanken weiter und hat hier auffordernde Kraft. »Darum liebt« gibt den Folgezusammenhang mit Vers 18 und das Gebot in natürlichem Deutsch wieder.
- source_word: הַ/גֵּר
  choice: den Fremden
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft unter Israel lebt und gesellschaftlich verletzlich ist. »Fremder« ist verständlich und vermeidet eine moderne, bürokratische Rechtskategorie.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Gebots ein. »Denn« wahrt den gehobenen, zugleich gegenwärtigen Bibelton.
- source_word: גֵרִים
  choice: Fremde
  rationale: Der Plural wird entsprechend dem ersten Vorkommen wiedergegeben, sodass die bewusste lexikalische Verbindung zwischen dem Fremden und Israels eigener Erfahrung erhalten bleibt.
- source_word: הֱיִיתֶם
  choice: seid … gewesen
  rationale: Die deutsche Perfektform gibt den vergangenen Zustand idiomatisch wieder und hält dessen Bedeutung für die angesprochenen Menschen präsent.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: »Land« gibt אֶרֶץ ausdrücklich wieder und bewahrt die heilsgeschichtliche Ortsformulierung, ohne im Deutschen unnatürlich zu wirken.
theological_decisions:
- issue: Soziale Identität des גֵּר im Bundesgesetz
  choice: Fremder
  alternative: Beisasse; ansässiger Ausländer; Schutzbürger
  rationale: Der Vers begründet Israels Pflicht zur Liebe mit seiner eigenen Geschichte als nicht einheimische und verletzliche Bevölkerungsgruppe. »Fremder« vermittelt die Außenseiterstellung, während die Fußnote klarstellt, dass kein bloß unbekannter Mensch oder Durchreisender gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Fremden/Fremde« bildet die hebräische Wortwiederholung ab. »Darum« macht den Folgezusammenhang zum vorausgehenden Vers deutlich; »denn« führt die ausdrücklich genannte Begründung ein.
