base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: de
  text: Er ist dein Lob, und er ist dein Gott, der für dich diese großen und ehrfurchtgebietenden Taten vollbracht hat, die deine Augen gesehen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: dein Ruhm
  rationale: Das Substantiv תְהִלָּה bezeichnet Lob beziehungsweise rühmende Anerkennung. In der prädikativen Wendung bleibt „dein Ruhm“ knapp und bewahrt die Spannung, dass Gott sowohl Gegenstand als auch Grund des Rühmens Israels ist.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die übliche Wiedergabe der Bundessprache erhält die direkte Anrede Israels im grammatischen Singular.
- source_word: עָשָׂה אִתְּךָ
  choice: hat für dich … vollbracht
  rationale: Die Verbindung bezeichnet hier Taten, die Gott zugunsten Israels ausgeführt hat. „Für dich“ gibt diesen begünstigenden Sinn natürlich wieder.
- source_word: הַגְּדֹלֹת
  choice: großen … Taten
  rationale: Das Adjektiv wird substantivisch gebraucht. „Große Taten“ bewahrt die semantische Weite, ohne die Aussage allein auf Macht zu verengen.
- source_word: הַנּוֹרָאוֹת
  choice: ehrfurchtgebietenden Taten
  rationale: Der Ausdruck bezeichnet Taten, die Furcht, Staunen und Ehrfurcht hervorrufen. „Ehrfurchtgebietend“ vermeidet sowohl umgangssprachliches „fantastisch“ als auch die ausschließlich negative Wirkung von „schrecklich“.
- source_word: רָאוּ עֵינֶיךָ
  choice: die deine eigenen Augen gesehen haben
  rationale: Die anschauliche hebräische Wendung betont die unmittelbare Augenzeugenschaft. „Eigene“ macht diesen Nachdruck im Deutschen deutlich, ohne den Bildausdruck aufzulösen.
- source_word: הוּא ... וְהוּא
  choice: Er ist … und er ist …
  rationale: Die Wiederholung des Pronomens hebt Gott nachdrücklich hervor. Sie wird beibehalten, ohne ein im Vers nicht ausdrücklich vorhandenes „allein“ hinzuzufügen.
theological_decisions:
- issue: Prädikative Wendung הוּא תְהִלָּתְךָ
  choice: Er ist dein Ruhm
  alternative: Er ist der, den du lobst; er ist dein Lob
  rationale: „Dein Ruhm“ bewahrt die dichte Formulierung und lässt offen, ob vor allem der Gegenstand des Lobes, der Grund des Rühmens oder beides gemeint ist.
- issue: Bedeutungsumfang von הַנּוֹרָאוֹת
  choice: ehrfurchtgebietenden Taten
  alternative: furchterregenden Taten; schrecklichen Taten
  rationale: Die gewählte Formulierung bewahrt die Verbindung von Furcht und ehrfürchtigem Staunen, ohne den Ausdruck auf bloßen Schrecken zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Aussage „Er ist dein Ruhm“ und das Bild der sehenden Augen bleiben erhalten; der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert.
