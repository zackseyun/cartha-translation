revisions:
- from: Er ist dein Ruhm[a], und er ist dein Gott. Er hat für dich diese großen und ehrfurchtgebietenden Taten[b] vollbracht, die deine eigenen Augen gesehen haben.
  to: Er ist dein Lob, und er ist dein Gott, der für dich diese großen und ehrfurchtgebietenden Taten vollbracht hat, die deine Augen gesehen haben.
  rationale: Die Revision ersetzt das semantisch weitergehende „Ruhm“ durch das quellennahe „Lob“, erhält die Beziehung des Relativsatzes zu „dein Gott“ und vermeidet eine nicht ausdrücklich vorhandene Verstärkung. Die Fußnoten sind an den revidierten Wortlaut angepasst; die Marker bleiben bei „Lob“ beziehungsweise „ehrfurchtgebietenden Taten“ verankert.
