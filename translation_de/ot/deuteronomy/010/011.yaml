  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gottesnamen, die Aufforderung zum Aufbruch und Vorausgehen, den Zweck des Einzugs sowie ירשׁ als aktive Besitznahme grundsätzlich treffend wieder. Die Relativsatzstellung „das ihren Vätern zu geben ich geschworen habe“ verschiebt jedoch im Deutschen den Bezug: Sie lässt Gott primär schwören, das Land den Vätern zu geben, statt den Eid gegenüber den Vätern auszudrücken. Der hebräische Text verbindet den Eid mit „ihren Vätern“ und anschließend die Gabe mit „ihnen“; die deutsche Fassung sollte diese Struktur idiomatisch und ohne zusätzliche Deutung wiedergeben.'
  naturalness: „Steh auf, brich auf und zieh dem Volk voran“ ist modernes, würdiges und gut verständliches Deutsch. „Damit sie hineingehen“ ist für וְיָבֹאוּ unmittelbarer als „hineinziehen“ und vermeidet eine nicht erforderliche militärische Nuance. Die Umstellung im Schlusssatz ergibt einen natürlichen deutschen Relativsatz.
  terminology: „Jahwe“, „Land“, „in Besitz nehmen“ und „Vätern“ sind sachgerecht. „Vätern“ bewahrt die im Ausgangstext gewählte patriarchale Bezeichnung; eine Fußnote ist hierfür nicht zwingend erforderlich. Die Formulierung „ihren Vätern ... zugesagt habe“ gibt den Eid als gegenüber den Vätern geleistete Zusage wieder, ohne über die Quelle hinauszugehen.
  issues:
  - severity: medium
    issue: Der Schlusssatz setzt „ihren Vätern“ syntaktisch als Empfänger der Gabe ein.
    rationale: In „das ihren Vätern zu geben ich geschworen habe“ ist „ihren Vätern“ im Deutschen von „zu geben“ abhängig. Im Hebräischen ist לַאֲבֹתָם dagegen mit „ich schwor“ verbunden; לָתֵת לָהֶם folgt als Infinitiv der zugesagten Gabe. „Das ich ihren Vätern zugesagt habe“ stellt den Eid gegenüber den Vätern klar dar.
  - severity: low
    issue: „hineinziehen“ ist gegenüber וְיָבֹאוּ enger und stärker gefärbt als nötig.
    rationale: Das Verb bezeichnet das Hineinkommen bzw. Eintreten. „Hineingehen“ bewahrt die Bewegungsrichtung ohne eine zusätzliche, potenziell militärische Konnotation.
  revised_text: 'Und Jahwe sagte zu mir: „Steh auf, brich auf und zieh dem Volk voran, damit sie hineingehen und das Land in Besitz nehmen, das ich ihren Vätern zugesagt habe.“'
