base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: „Steh auf, brich auf und zieh dem Volk voran, damit sie hineingehen und das Land in Besitz nehmen, das ich ihren Vätern zugesagt habe.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt das Tetragramm als Eigennamen statt es durch einen Titel zu ersetzen.
- source_word: קוּם לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: Steh auf, brich auf und zieh dem Volk voran
  rationale: Die natürliche deutsche Befehlsfolge gibt קוּם mit „Steh auf“ wieder; „brich auf“ erfasst den Reiseantritt in לֵךְ לְמַסַּע, und „zieh dem Volk voran“ bewahrt die räumliche wie leitende Bedeutung von לִפְנֵי הָעָם.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: damit sie hineinziehen und ... in Besitz nehmen
  rationale: Die mit וְ angeschlossenen Verben bezeichnen hier den Zweck beziehungsweise die Folge des Befehls. „Hineinziehen“ hält die Bewegung in das Land fest; „in Besitz nehmen“ gibt die aktive Bedeutung von ירשׁ wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang bezeichnet der Ausdruck das Israel verheißene Land; „das Land“ ist die präzise und etablierte deutsche Wiedergabe.
- source_word: נִשְׁבַּעְתִּי
  choice: ich geschworen habe
  rationale: Die Form bezeichnet einen feierlichen Eid Gottes; „geschworen“ bewahrt die Bundessprache ohne erklärenden Zusatz.
- source_word: לַאֲבֹתָם
  choice: ihren Vätern
  rationale: Die wörtliche, historisch konkrete Bezeichnung verweist auf die Vorväter Israels. Das Deutsche „Väter“ bewahrt diese Ausdrucksweise.
- source_word: לָתֵת לָהֶם
  choice: ihren Vätern zu geben
  rationale: Die Stellung im deutschen Relativsatz macht deutlich, dass das Land den Vätern beziehungsweise ihren Nachkommen gemäß der Verheißung gegeben werden sollte, und folgt der hebräischen Infinitivkonstruktion eng.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder und ersetzt ihn nicht durch einen Titel.
- issue: Bezug von לַאֲבֹתָם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: „Väter“ wahrt die konkrete patriarchale Bezeichnung des Hebräischen; „Vorfahren“ wäre verständlicher, aber weniger formnah.
- issue: Syntaktischer Bezug von לָתֵת לָהֶם
  choice: das ihren Vätern zu geben ich geschworen habe
  alternative: das zu geben ich ihren Vätern geschworen habe
  rationale: Die gewählte Lesart folgt der naheliegenden Konstruktion, wonach Gott schwor, ihnen das Land zu geben. Die alternative deutsche Wortstellung könnte missverständlich so verstanden werden, als sei lediglich der Eid an die Väter gerichtet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Steh auf“ ist gegenwärtiger als „Erhebe dich“; „brich auf und zieh dem Volk voran“ bildet den Reise- und Führungsaspekt idiomatisch ab. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext verständlich erhalten bleiben.
