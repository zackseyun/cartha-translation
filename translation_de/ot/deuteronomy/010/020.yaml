source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: de
  text: Jahwe, deinen Gott, sollst du fürchten[a]. Ihm sollst du dienen, an ihm sollst du festhalten[b], und bei seinem Namen sollst du schwören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe, deinen Gott, sollst du verehren«; das hebräische Verb bezeichnet in Bundeskontexten häufig Furcht, die von Ehrfurcht geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihm anhängen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Die Verbindung mit dem Suffix der 2. Person Singular bezeichnet in der Bundesanrede »deinen Gott«.
- source_word: תִּירָא
  choice: sollst du fürchten
  rationale: ירא bezeichnet hier ehrfürchtige Furcht. »Fürchten« bewahrt die Stärke und theologische Spannung des hebräischen Ausdrucks.
- source_word: אֹתוֹ
  choice: ihm
  rationale: Das vorangestellte Objektpronomen hebt hervor, dass allein ihm gedient werden soll; der deutsche Satzanfang »Ihm« erhält diese Betonung.
- source_word: תַעֲבֹד
  choice: sollst du dienen
  rationale: עבד bedeutet grundlegend »dienen« und kann hier kultische Verehrung einschließen, ohne darauf eingeengt zu werden.
- source_word: וּבוֹ תִדְבָּק
  choice: an ihm sollst du festhalten
  rationale: דבק mit ב bezeichnet enge, beständige Bindung an eine Person. »An ihm festhalten« ist im heutigen Deutsch natürlich und bringt die Bundestreue zum Ausdruck.
- source_word: וּבִשְׁמוֹ
  choice: bei seinem Namen
  rationale: Mit שבע bezeichnet die Präposition ב die Instanz, bei der geschworen wird; »bei seinem Namen« entspricht der deutschen Schwurformel.
- source_word: תִּשָּׁבֵעַ
  choice: sollst du schwören
  rationale: Der Niphal von שבע bedeutet »schwören« beziehungsweise »einen Eid leisten« und bewahrt hier den rechtlich-bundestheologischen Sinn.
theological_decisions:
- issue: Gebotscharakter der hebräischen Imperfektformen
  choice: Wiedergabe mit »sollst du«
  alternative: 'Eine Reihe direkter Imperative: »Fürchte … diene … halte fest … schwöre«'
  rationale: Im gesetzlich-ermahnenden Zusammenhang drücken die Imperfektformen verbindliche Bundesgebote aus. »Sollst du« vermittelt diesen verpflichtenden Charakter in natürlichem, würdigem Deutsch.
- issue: Bedeutungsumfang von ירא
  choice: »fürchten« mit erklärender Fußnote
  alternative: »verehren«
  rationale: Der Ausdruck verbindet wirkliche Furcht mit Ehrfurcht. Die Hauptübersetzung vermeidet eine Abschwächung, während die Fußnote den kontextuellen Bedeutungsumfang sichtbar macht.
- issue: Bindungstreue in דבק
  choice: »an ihm festhalten«
  alternative: »ihm anhängen«
  rationale: Die gewählte Formulierung bewahrt das Bild einer engen und dauerhaften Bindung, ohne es konfessionell oder systematisch auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bundesrechtlichem Klang. Die Wiederholung von »sollst du« erhält die bindende Struktur der hebräischen Ermahnung; die hervorgehobenen Pronomen und die Reihenfolge der Verpflichtungen bleiben erkennbar.
