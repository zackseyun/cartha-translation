  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: de
  text: Zu jener Zeit sonderte Jahwe den Stamm Levi aus, die Lade des Bundes Jahwes zu tragen, vor Jahwe zu stehen, ihm zu dienen und in seinem Namen zu segnen, bis zum heutigen Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: sonderte … dazu aus
  rationale: Die Formulierung gibt sowohl die Absonderung als auch die anschließenden Zweckangaben wieder und klingt im modernen Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: den Stamm Levi
  rationale: Die Wiedergabe erhält Levi als Stammesnamen und bildet die hebräische Genitivverbindung knapp und eindeutig ab.
- source_word: לָשֵׂאת
  choice: zu tragen
  rationale: Im Zusammenhang mit der Bundeslade bezeichnet das Verb die konkrete Aufgabe des Tragens.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die vollständige hebräische Genitivkette wird transparent wiedergegeben, ohne den Bundesbezug zu verkürzen.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: vor Jahwe zu stehen
  rationale: Die wörtlich-nahe Form bewahrt die kultische Dienststellung, ohne sie über den Text hinaus auszudeuten.
- source_word: לְשָׁרְתוֹ
  choice: um ihm zu dienen
  rationale: „Dienen“ ist im Deutschen natürlich und kann hier den heiligen Dienst bezeichnen, ohne eine spätere kirchliche Amtsbezeichnung einzutragen.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: und in seinem Namen zu segnen
  rationale: Die Wendung bewahrt die Beauftragung und Vollmacht, die durch den Namen Jahwes ausgedrückt wird.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies ist eine klare, idiomatische Wiedergabe der fortdauernden Geltung aus der Perspektive des Erzählers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als solchen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des levitischen Dienstes in לַעֲמֹד ... לְשָׁרְתוֹ
  choice: vor Jahwe zu stehen, um ihm zu dienen
  alternative: vor Jahwe zu stehen, um ihm priesterlich zu dienen
  rationale: Die gewählte Fassung erhält den kultischen Sinn, ohne mit „priesterlich“ eine stärker bestimmte Amtsdeutung einzuführen, die nicht ausdrücklich im Wortlaut steht.
- issue: Bezug von „bis zum heutigen Tag“
  choice: auf die fortdauernde levitische Beauftragung bezogen
  alternative: nur auf die unmittelbar letzte Aufgabe des Segnens bezogen
  rationale: Die Schlussformel steht nach der gesamten Aufzählung und wird daher natürlich als Aussage über die fortbestehende Einsetzung und ihre Aufgaben verstanden; die Satzstellung bleibt jedoch nahe genug am Ausgangstext, um die syntaktische Reichweite nicht unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Zweckinfinitive folgt der Struktur des Hebräischen; der Gedankenstrich hebt die abschließende Fortdauerformel lesefreundlich hervor.
