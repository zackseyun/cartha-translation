  source_fidelity: Der Text gibt den kasuistischen Eingang כִּי angemessen mit „Wenn“ wieder. „unter euch einen Mann“ entspricht יִהְיֶה בְךָ אִישׁ; die männliche Bezugnahme ist durch den bezeichneten körperlichen Vorgang textlich gedeckt. „wegen eines nächtlichen Samenergusses nicht rein“ trifft die kultische, nicht moralische Unreinheit und erläutert das hebräische Idiom מִקְרֵה לָיְלָה sachgerecht. „das Lager verlassen“ gibt die geforderte Bewegung nach außerhalb idiomatisch wieder; das anschließende Verbot, „ins Innere des Lagers“ zu kommen, bewahrt die Betonung von תּוֹךְ.
