source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: de
  text: Wenn es unter euch einen Mann gibt, der wegen eines nächtlichen Samenergusses[a] nicht rein ist, soll er das Lager verlassen. Er darf nicht ins Innere des Lagers kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen eines Ereignisses der Nacht“; gemeint ist hier ein nächtlicher Samenerguss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet in diesem Rechtssatz einen möglichen Fall ein und gibt die kasuistische Funktion natürlich wieder.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: es unter euch einen Mann gibt
  rationale: Gibt die existentielle Verwendung von היה mit בך wieder; „Mann“ entspricht der hier aufgrund der beschriebenen Körperfunktion ausdrücklich männlichen Person.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: der … nicht rein ist
  rationale: Bewahrt die kultische Kategorie der Reinheit, ohne moralische Schuld anzudeuten.
- source_word: מִקְּרֵה לָיְלָה
  choice: wegen eines nächtlichen Samenergusses
  rationale: Das wörtlich allgemeinere Idiom „ein Ereignis der Nacht“ bezeichnet in diesem Zusammenhang einen nächtlichen Samenerguss; die Übersetzung ist klar und sachlich.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: soll er das Lager verlassen
  rationale: Gibt sowohl die vorgeschriebene Bewegung als auch das Ziel außerhalb des Lagers in natürlichem Deutsch wieder.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: Er darf nicht ins Innere des Lagers kommen
  rationale: „Ins Innere“ bewahrt die besondere Nuance von תּוֹךְ gegenüber dem allgemeineren „das Lager betreten“.
theological_decisions:
- issue: Art der Unreinheit
  choice: Die Aussage wird als kultische Unreinheit wiedergegeben, nicht als moralische Verfehlung.
  alternative: Die Unreinheit sprachlich als moralische Befleckung oder Schuld erscheinen lassen.
  rationale: Der Zusammenhang behandelt die Heiligkeit des Lagers und einen körperlich bedingten Reinheitszustand; der Vers schreibt dem Mann keine persönliche Schuld zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Samenerguss“ ist eindeutig und allgemein verständlich; die Fußnote bewahrt zugleich die weniger ausdrückliche Formulierung des Hebräischen. „Nicht rein“ vermeidet eine unnötig moralische Färbung.
