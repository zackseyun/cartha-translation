  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: de
  text: weil sie euch unterwegs, als ihr aus Ägypten auszogt, nicht mit Brot und Wasser entgegenkamen und weil er[a] Bileam, den Sohn Beors, aus Petor in Aram-Naharajim[b] gegen dich anheuerte, um dich zu verfluchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht hier in der 3. Person Singular, obwohl der vorherige Satzteil Plural verwendet; ein ausdrückliches Subjekt wird nicht genannt.
    reason: textual_and_grammatical_clarification
  - marker: b
    text: Aram-Naharajim wird traditionell mit Mesopotamien gleichgesetzt; der Name bedeutet wörtlich „Aram der zwei Ströme“.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: weil
  rationale: Die Wendung nennt den Grund für den vorausgehenden Ausschluss; „weil“ gibt die kausale Funktion im Deutschen natürlich wieder.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: euch … nicht … entgegenkamen
  rationale: Das Verb bezeichnet hier das Entgegenkommen beziehungsweise Begrüßen mit Versorgung. „Entgegenkamen“ bewahrt dies, ohne die stärkere Deutung „willkommen hießen“ einzutragen.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: mit Brot und Wasser
  rationale: Die konkreten hebräischen Substantive bleiben erhalten; im Deutschen genügt eine gemeinsame Präposition.
- source_word: בַּדֶּרֶךְ בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: unterwegs, als ihr aus Ägypten zogt
  rationale: „Unterwegs“ gibt die Ortsangabe idiomatisch wieder, während der Temporalsatz den Infinitiv mit בְּ angemessen ausdrückt und den Exodus-Bezug wahrt.
- source_word: שָׂכַר עָלֶיךָ
  choice: gegen dich anwarb
  rationale: שׂכר bedeutet „anwerben/mieten“; עַל bezeichnet hier die feindliche Ausrichtung. Der Wechsel vom Plural zum Singular wird entsprechend dem hebräischen Text bewahrt.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam, den Sohn Beors
  rationale: Die im Deutschen etablierten Namensformen werden verwendet; der Akkusativ macht Bileam zum Objekt von „anwarb“.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: aus Petor in Aram-Naharajim
  rationale: Beide Ortsnamen werden transliteriert. „in“ macht die Beziehung Petors zur Region natürlich verständlich, ohne Aram-Naharajim vorschnell mit „Mesopotamien“ gleichzusetzen.
- source_word: לְקַלְלֶךָּ
  choice: um dich zu verfluchen
  rationale: Die finale Bedeutung des Infinitivs wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Unvermittelter Numeruswechsel und Subjekt von שָׂכַר
  choice: „sie/euch“ im ersten Grund, danach „er/gegen dich“ entsprechend dem masoretischen Text; „er“ erhält eine erklärende Fußnote
  alternative: 'Den gesamten Satz im Plural harmonisieren: „sie … gegen euch anwarben“'
  rationale: Der hebräische Text wechselt tatsächlich vom Plural zum Singular. Eine Harmonisierung würde die grammatische Spannung beseitigen und das singularische Subjekt interpretierend festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Begründung an den vorausgehenden Vers gebunden. Der auffällige Numeruswechsel des Hebräischen wird nicht stillschweigend geglättet; eine Fußnote erläutert ihn.
