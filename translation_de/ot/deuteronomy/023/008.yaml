source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: de
  text: Du sollst einen Edomiter nicht verabscheuen[a], denn er ist dein Bruder[b]. Du sollst einen Ägypter nicht verabscheuen, denn du warst ein Fremder[c] in seinem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verachten“ beziehungsweise „als abscheulich behandeln“.'
    reason: lexical_alternative
  - marker: b
    text: „Dein Bruder“ verweist auf Israels Verwandtschaft mit Edom durch Esau.
    reason: cross_reference
  - marker: c
    text: 'Das hebräische Wort bezeichnet einen Fremden, der außerhalb seiner Heimat unter einem anderen Volk lebt; auch: „ansässiger Fremder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: verabscheuen
  rationale: Das Piel von תעב bezeichnet, jemanden oder etwas als abscheulich anzusehen beziehungsweise mit starker Abneigung zu behandeln. „Verabscheuen“ gibt diese Stärke in natürlichem modernem Deutsch wieder; die Wiederholung in beiden Verboten bleibt erhalten.
- source_word: אֲדֹמִי
  choice: Edomiter
  rationale: Übliche deutsche Bezeichnung für einen Angehörigen Edoms; der repräsentative Singular des Hebräischen bleibt gewahrt.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt den Bezug auf die geschichtliche Verwandtschaft Israels mit Edom durch Esau, ohne sie durch „Verwandter“ auszulegen oder abzuschwächen.
- source_word: מִצְרִי
  choice: Ägypter
  rationale: Übliche deutsche Bezeichnung; der repräsentative Singular des hebräischen Rechtstextes bleibt erhalten.
- source_word: גֵר
  choice: Fremder
  rationale: גֵר bezeichnet hier jemanden, der außerhalb seines eigenen Landes beziehungsweise Sippenverbands unter einem anderen Volk lebt. „Fremder“ ist im Satz natürlich und verständlich; eine Fußnote weist auf die präzisere soziale Nuance „ansässiger Fremder“ hin.
- source_word: בְאַרְצוֹ
  choice: in seinem Land
  rationale: Die Formulierung erhält das singularische Suffix und die personifizierende beziehungsweise repräsentative Rede vom Ägypter und seinem Land.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ führt in beiden Satzhälften klar und würdig die Begründung des Verbots ein.
theological_decisions:
- issue: Repräsentativer Singular für Volksgruppen
  choice: 'Singularformen beibehalten: „einen Edomiter“, „einen Ägypter“, „er“, „seinem Land“'
  alternative: 'Für flüssigeren deutschen Stil pluralisieren: „Edomiter … Ägypter … ihr Land“'
  rationale: Das Hebräische spricht im rechtlichen Stil durch singularische Volksbezeichnungen repräsentativ von Angehörigen der jeweiligen Völker. Der Singular bewahrt sowohl die Form als auch die persönliche Kraft des Gebots.
- issue: Verwandtschaftssprache gegenüber Edom
  choice: Wörtlich „dein Bruder“
  alternative: Deutend „dein Verwandter“
  rationale: Der Text begründet das Verbot mit der familiären Beziehung Israels zu Edom. „Bruder“ erhält die theologisch-geschichtliche Spannung und vermeidet interpretierende Glättung.
- issue: Status Israels in Ägypten
  choice: גֵר im Haupttext als „Fremder“ wiedergeben und die rechtlich-soziale Nuance in der Fußnote ausweisen
  alternative: Im Haupttext „ansässiger Fremder“ oder „Schutzbürger“
  rationale: „Fremder“ ist für heutige Leser unmittelbar verständlich, während die Fußnote die spezifischere Bedeutung eines außerhalb der eigenen Heimat lebenden Fremden bewahrt. „Schutzbürger“ wäre stärker institutionell festgelegt, als der Vers selbst erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die hebräische Parallelstruktur. Die zweimalige Formulierung „Du sollst … nicht verabscheuen“ und die beiden Begründungen mit „denn“ bleiben erhalten. Die singularische Redeweise wird trotz leichter Fremdheit im Deutschen bewusst bewahrt.
