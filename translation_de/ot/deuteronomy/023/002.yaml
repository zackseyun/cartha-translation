  verdict: revise
  source_fidelity: Die Übersetzung gibt das Verbot, die beiden alternativ genannten Verletzungszustände und die Zugehörigkeit zur „Versammlung Jahwes“ grundsätzlich treffend wieder. „Glied“ ist jedoch im heutigen Standarddeutsch nicht hinreichend eindeutig für שָׁפְכָה, das hier konkret das männliche Geschlechtsorgan bezeichnet.
  naturalness: 'Der Satz weist einen grammatischen Unebenheit auf: Bei „dessen Hoden zerquetscht oder dessen Glied abgeschnitten ist“ bleibt die für das pluralische Subjekt „Hoden“ erforderliche Form „sind“ unausgedrückt. Die ausdrückliche anatomische Benennung ist zugleich klarer und natürlicher als „Glied“.'
  terminology: „Jahwe“ und „Versammlung“ sind angemessen und bewahren den Gottesnamen sowie die im Hebräischen nicht näher bestimmte institutionelle Reichweite. „Penis“ ist hier die präzisere moderne Entsprechung und nicht unnötig klinisch.
  issues:
  - severity: medium
    issue: Grammatische Inkongruenz bei „dessen Hoden zerquetscht ... ist“
    rationale: „Hoden“ ist Plural; daher muss der erste Relativsatzteil „zerquetscht sind“ lauten. Das nachfolgende „ist“ kann dies nicht grammatisch eindeutig mittragen, da es sich auf das zweite, singularische Bezugswort bezieht.
  - severity: medium
    issue: „Glied“ ist semantisch zu unbestimmt
    rationale: Im modernen Deutsch kann „Glied“ auch eine Extremität oder allgemein ein Körperteil meinen. Der hebräische Ausdruck bezeichnet in diesem Kontext konkret das männliche Geschlechtsorgan; „Penis“ gibt dies klar und sachgerecht wieder.
  revised_text: Ein Mann, dessen Hoden zerquetscht sind oder dessen Penis abgeschnitten ist, darf nicht in die Versammlung Jahwes kommen.[a]
