base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: de
  text: Ein Mann, dessen Hoden zerquetscht sind oder dessen Penis abgeschnitten ist, darf nicht in die Versammlung Jahwes kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Versammlung Jahwes“ kann die förmliche Teilnahme an Israels Bundesgemeinschaft bezeichnen; der genaue Umfang dieses Ausschlusses ist umstritten.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: darf … kommen
  rationale: בוא bedeutet „kommen/eintreten“. Zusammen mit לֹא gibt „darf nicht … kommen“ das gesetzliche Verbot in natürlichem Deutsch wieder, ohne den Bereich der Zugehörigkeit näher festzulegen.
- source_word: פְצוּעַ דַּכָּא
  choice: dessen Hoden zerquetscht sind
  rationale: Die Wortverbindung bezeichnet eine durch Quetschung verursachte Verletzung der männlichen Geschlechtsorgane; „Hoden“ ist hier anatomisch klarer und wahrscheinlich genauer als das allgemeinere „Geschlechtsteile“.
- source_word: וּכְרוּת שָׁפְכָה
  choice: oder dessen Glied abgeschnitten ist
  rationale: Die Wendung bezeichnet das abgeschnittene männliche Glied. „Glied“ ist im Deutschen eindeutig genug, würdevoll und weniger klinisch als „Penis“; „oder“ gibt die disjunktive Funktion des Waw im Zusammenhang wieder.
- source_word: בִּקְהַל
  choice: in die Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft. „Versammlung“ ist transparent und vermeidet eine vorschnelle Festlegung auf ausschließlich kultische, politische oder spätere kirchliche Kategorien.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der Eigenname erhalten bleibt und nicht durch den Titel „der HERR“ ersetzt wird.
- source_word: לֹא
  choice: darf nicht
  rationale: In Verbindung mit dem Imperfekt formuliert לֹא hier ein Verbot; „darf nicht“ entspricht natürlichem modernem deutschem Rechtsstil.
- source_word: impliziter männlicher Referent
  choice: Ein Mann
  rationale: Die genannten Verletzungen beziehen sich ausdrücklich auf männliche Geschlechtsorgane; „Ein Mann“ macht den Referenten idiomatisch und sachgerecht deutlich.
theological_decisions:
- issue: Bedeutung des Ausschlusses aus der „Versammlung Jahwes“
  choice: Die Wendung bleibt unbestimmt als Verbot, in die Versammlung Jahwes zu kommen.
  alternative: Ausdrückliche Deutung als Ausschluss vom Gottesdienst, vom Bürgerrecht, von der Eheschließung oder vom Heil.
  rationale: Der hebräische Text bestimmt den genauen rechtlichen und theologischen Umfang der „Versammlung Jahwes“ in diesem Vers nicht. Die Übersetzung bewahrt diese Offenheit und vermeidet spätere konfessionelle oder heilsgeschichtliche Festlegungen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die anatomische Aussage wird direkt, aber nicht unnötig klinisch formuliert. „In die Versammlung … kommen“ hält sich eng an בוא ב und bewahrt die Unbestimmtheit des rechtlichen Geltungsbereichs.
