    issue: „oder“ verbindet die beiden Objekte alternativ.
    rationale: Der hebräische Text verbindet שְׁלֹמָם und טֹבָתָם mit „und“. Unter der Verneinung ist „weder ... noch“ die natürliche deutsche Entsprechung und vermeidet einen nicht belegten Alternativsinn.
  - severity: low
    issue: Die Fußnote bietet eine Alternativformulierung in umgekehrter semantischer Zuordnung an.
    rationale: „um ihr Wohlergehen und ihr Gutes“ ersetzt den ersten Hauptbegriff „Frieden“ und lässt die Alternative dadurch weniger präzise erscheinen. Eine Fußnote mit „ihren Frieden und ihr Gutes“ bildet die hebräische Wortfolge und den lexikalischen Kontrast klar ab.
