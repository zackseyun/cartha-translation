  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: de
  text: Du sollst dich weder um ihren Frieden noch um ihr Wohlergehen bemühen – alle deine Tage, für immer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Frieden und ihr Gutes“. Die hebräischen Begriffe bezeichnen mehr als nur politischen Frieden oder wirtschaftlichen Wohlstand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: dich … bemühen
  rationale: דרש bedeutet „suchen“, „sich erkundigen“ oder „auf etwas bedacht sein“. Bei den abstrakten Objekten „Frieden“ und „Wohlergehen“ gibt „sich um … bemühen“ die aktive Ausrichtung im heutigen Deutsch natürlich wieder.
- source_word: שְׁלֹמָם
  choice: ihren Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Unversehrtheit. „Frieden“ wahrt den Grundbegriff und hält ihn vom folgenden Ausdruck unterscheidbar.
- source_word: טֹבָתָם
  choice: ihr Wohlergehen
  rationale: טוֹבָה bezeichnet hier das Gute, den Nutzen oder einen günstigen Zustand. „Wohlergehen“ ist im Deutschen verständlich und breiter als rein wirtschaftlicher „Wohlstand“.
- source_word: כָּל יָמֶיךָ
  choice: alle deine Tage
  rationale: Die Wendung bleibt eng an der hebräischen Ausdrucksweise und bewahrt die Anrede in der zweiten Person Singular.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die eigenständige Wiedergabe erhält die nachdrückliche Dauerangabe des hebräischen Textes.
theological_decisions:
- issue: Häufung der Zeitangaben „alle deine Tage“ und „für immer“
  choice: Beide Ausdrücke werden ausdrücklich beibehalten.
  alternative: Zu „solange du lebst“ oder „niemals“ zusammenziehen.
  rationale: Der hebräische Text stellt כָּל יָמֶיךָ und לְעוֹלָם nebeneinander und verstärkt dadurch das Verbot. Eine Glättung würde diese Nachdrücklichkeit abschwächen.
- issue: Bedeutungsumfang von „Frieden“ und „Wohlergehen“
  choice: Die beiden Begriffe werden getrennt wiedergegeben, ohne sie auf Politik oder Wirtschaft einzuengen.
  alternative: „ihren politischen Frieden oder ihren wirtschaftlichen Wohlstand“
  rationale: Beide hebräischen Wörter haben einen weiteren Bedeutungsumfang; eine engere Deutung wäre sachlich nicht im Text festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche doppelte Zeitangabe wurde aus Treue zur nachdrücklichen hebräischen Formulierung bewusst nicht geglättet.
