  source_fidelity: Die beiden Objekte stehen im Hebräischen mit וְ ... וְ („ihren Frieden und ihr Gutes/Wohlergehen“), nicht alternativ. In einer deutschen Negativkonstruktion gibt „weder ... noch“ diese Verbindung idiomatisch und genau wieder. Die doppelte Dauerangabe כָּל־יָמֶיךָ לְעוֹלָם bleibt ausdrücklich erhalten.
  naturalness: Die Stellung von „nicht“ nach der doppelten Zeitangabe ist zwar verständlich, aber schwerfällig. Die vorgeschlagene Fassung hat einen natürlichen Satzkern; der Gedankenstrich kennzeichnet die bewusst nachdrücklich nachgestellte, im Hebräischen gestapelte Zeitangabe.
  terminology: „Frieden“ für שָׁלוֹם und „Wohlergehen“ für טוֹבָה sind tragfähige, voneinander unterscheidbare Wiedergaben. Die Fußnote wird an die tatsächliche hebräische Verbindung und die deutsche Hauptfassung angepasst.
