    issue: „um irgendein Gelübde zu erfüllen“ ergänzt eine nicht ausdrücklich genannte Erfüllungshandlung.
    rationale: לְכָל נֶדֶר lautet wörtlich „für/zu jedem Gelübde“ und bezeichnet den Zusammenhang bzw. Zweck. Die Formulierung „zu erfüllen“ ist als Auslegung möglich, schränkt die offene hebräische Formulierung aber unnötig ein.
  - severity: low
    issue: Die Fußnote spricht vom „Lohn eines männlichen Prostituierten“.
    rationale: Die diskutierte alternative Deutung betrifft die Wortgruppe מְחִיר כֶּלֶב („Preis eines Hundes“) und sollte daher als „Preis eines männlichen Prostituierten“ formuliert werden. So bleibt die lexikalische Differenz zu אֶתְנַן („Lohn“) erkennbar.
  - severity: low
    issue: „abscheulich“ gibt das Substantiv תוֹעֵבָה weniger unmittelbar wieder.
    rationale: „Ein Gräuel“ bewahrt die substantivische Prädikation und die starke kultisch-ethische Wertung des hebräischen Begriffs, ohne den Sinn zu verändern.
