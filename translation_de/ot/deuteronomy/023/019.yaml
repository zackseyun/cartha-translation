  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: de
  text: Du sollst den Lohn einer Prostituierten oder den Preis eines Hundes nicht in das Haus Jahwes, deines Gottes, bringen, für irgendein Gelübde.[a] Denn beides ist Jahwe, deinem Gott, ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „den Preis eines männlichen Prostituierten“, wenn „Hund“ hier als abwertende Bezeichnung für einen männlichen Kultprostituierten verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: bringen
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen einer Sache an einen Ort; „bringen“ gibt die konkrete Handlung natürlich wieder.
- source_word: אֶתְנַן זוֹנָה
  choice: der Lohn einer Prostituierten
  rationale: אֶתְנַן bezeichnet den gezahlten Lohn bzw. das Entgelt, זוֹנָה eine Prostituierte. Die Formulierung ist klar und bewahrt den Sinn der Genitivverbindung.
- source_word: מְחִיר כֶּלֶב
  choice: der Preis für einen Hund
  rationale: מְחִיר bedeutet gewöhnlich „Preis“, כֶּלֶב wörtlich „Hund“. Da die übertragene Deutung umstritten ist, bleibt der konkrete Wortlaut im Haupttext erhalten.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: das Haus Jahwes, deines Gottes
  rationale: בֵּית wird als „Haus“ wiedergegeben, ohne durch „Tempel“ eine stärkere historische Festlegung einzutragen. Der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: לְכָל נֶדֶר
  choice: um irgendein Gelübde zu erfüllen
  rationale: Die Präposition לְ bezeichnet hier Zweck oder Anlass. Im Deutschen verdeutlicht „um … zu erfüllen“ knapp, dass die genannten Zahlungen nicht als Leistung aufgrund eines Gelübdes ins Heiligtum gebracht werden dürfen.
- source_word: תוֹעֲבַת
  choice: abscheulich
  rationale: Das starke Wertungswort תוֹעֵבָה bezeichnet etwas, das vor Gott verabscheuungswürdig ist. „Abscheulich“ wahrt die Schärfe und klingt in modernem Deutsch natürlich.
- source_word: גַּם שְׁנֵיהֶם
  choice: beides
  rationale: Die Wendung schließt ausdrücklich beide zuvor genannten Dinge ein. „Beides“ gibt dies im Deutschen knapp und idiomatisch wieder.
theological_decisions:
- issue: Deutung von כֶּלֶב in מְחִיר כֶּלֶב
  choice: Im Haupttext wörtlich als „Hund“ wiedergeben.
  alternative: „männlicher Prostituierter“ bzw. abwertende Bezeichnung für einen männlichen Kultprostituierten
  rationale: כֶּלֶב bedeutet lexikalisch „Hund“. Eine übertragene sexuelle oder kultische Bedeutung ist möglich, aber nicht sicher genug, um sie in den Haupttext einzutragen; sie wird deshalb in einer Fußnote dokumentiert.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ bewahrt ihn als Gottes persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Verbot, während „um irgendein Gelübde zu erfüllen“ die Funktion der knappen hebräischen Präpositionalphrase idiomatisch ausdrückt. Die umstrittene Bedeutung von „Hund“ wird nicht im Haupttext entschieden.
