revisions:
- from: Du sollst weder den Lohn einer Prostituierten noch den Preis für einen Hund in das Haus Jahwes, deines Gottes, bringen, um irgendein Gelübde zu erfüllen.[a] Denn beides ist für Jahwe, deinen Gott, abscheulich.
  to: Du sollst den Lohn einer Prostituierten oder den Preis eines Hundes nicht in das Haus Jahwes, deines Gottes, bringen, für irgendein Gelübde.[a] Denn beides ist Jahwe, deinem Gott, ein Gräuel.
  rationale: Die Revision entfernt die interpretierende Ergänzung „zu erfüllen“ und bewahrt damit die offene Bezugsangabe לְכָל נֶדֶר. Sie verwendet bei תוֹעֵבָה die direkte substantivische Entsprechung „ein Gräuel“ und präzisiert die Fußnote entsprechend der umstrittenen Deutung der gesamten Wortgruppe מְחִיר כֶּלֶב. Die wörtliche Haupttextlesart „Hund“ bleibt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:56:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Hauptaussage wird weitgehend zutreffend wiedergegeben: אֶתְנַן זוֹנָה als „Lohn einer Prostituierten“, מְחִיר כֶּלֶב wörtlich als „Preis eines Hundes“, „Haus Jahwes“ und die Einschließung beider Gegenstände sind sachgerecht. Die Wiedergabe von לְכָל נֶדֶר als „um irgendein Gelübde zu erfüllen“ legt jedoch eine Gelübdeerfüllung ausdrücklich fest, die der hebräische Wortlaut nicht nennt. Die knappe Zweck-/Bezugsangabe sollte ohne diese Ergänzung erhalten bleiben.'
  naturalness: Der Entwurf ist insgesamt modernes, verständliches Standarddeutsch. „Denn beides ist für Jahwe, deinen Gott, abscheulich“ ist idiomatisch, doch „ein Gräuel“ entspricht dem substantivischen und starken Charakter von תוֹעֵבָה unmittelbarer. „Preis eines Hundes“ ist hier präziser als „Preis für einen Hund“, da der Gegenstand als Herkunft beziehungsweise Verkaufsobjekt der Zahlung ausgedrückt wird.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Prostituierte“ und „Gelübde“ sind registergerecht. Die Fußnote sollte die alternative Deutung von מְחִיר כֶּלֶב als „Preis eines männlichen Prostituierten“ wiedergeben, nicht als dessen „Lohn“; außerdem muss die Formulierung klar als mögliche, umstrittene Deutung gekennzeichnet bleiben.
  issues:
