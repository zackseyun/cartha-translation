  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: de
  text: Die Kinder[a], die ihnen geboren werden, dürfen in der dritten Generation in die Versammlung Jahwes eintreten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne«; im rechtlich-genealogischen Zusammenhang sind damit allgemein Kinder beziehungsweise Nachkommen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder formaler: »Eine dritte Generation darf/soll in die Versammlung Jahwes eintreten.« Das Hebräische kann auch mit »wird« oder »soll eintreten« wiedergegeben werden; gemeint ist die Zulassung von der dritten Generation an.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Kinder
  rationale: Wörtlich »Söhne«; im rechtlich-genealogischen Zusammenhang bezeichnet der maskuline Plural die Nachkommen einer Linie. »Kinder« bewahrt den familiären Ausdruck, ohne den Bezug unnötig auf männliche Nachkommen zu beschränken.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: die ihnen geboren werden
  rationale: Das Passiv von ילד mit ל und Pronomen bedeutet hier natürlich »ihnen geboren werden«. Die Relativkonstruktion wird im Deutschen ausdrücklich wiedergegeben.
- source_word: דּוֹר שְׁלִישִׁי
  choice: in der dritten Generation
  rationale: Die Wendung bezeichnet die Generation, ab der die Aufnahme möglich ist. Die gewählte Formulierung gibt diesen zeitlich-genealogischen Sinn idiomatisch wieder.
- source_word: יָבֹא
  choice: dürfen … kommen
  rationale: Das Verb bedeutet »kommen/eintreten«. Im rechtlichen Zusammenhang drückt es die Zulassung zur Versammlung aus; »dürfen« macht diesen modalen Sinn im heutigen Deutsch deutlich.
- source_word: בִּקְהַל
  choice: in die Versammlung
  rationale: קהל bezeichnet die versammelte Gemeinschaft, besonders in rechtlichen und bundesbezogenen Zusammenhängen. Bei einem Verb der Bewegung gibt »in die Versammlung kommen« die hebräische Konstruktion natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im Deutschen geläufige Form der wissenschaftlichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Wiedergabe »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von בָּנִים im rechtlich-genealogischen Zusammenhang
  choice: Kinder
  alternative: Söhne
  rationale: Obwohl die Form grammatisch maskulin ist, kann sie hier die Nachkommenschaft der genannten Gruppe bezeichnen. »Kinder« wahrt den familiären und genealogischen Sinn; die wörtliche Form wird in der Fußnote genannt.
- issue: Modalität von יָבֹא
  choice: dürfen … kommen
  alternative: werden/sollen … kommen
  rationale: Die Vorschrift legt fest, ab welcher Generation der Zugang eröffnet ist. Die permissive Wiedergabe ist im Deutschen verständlich, während die formalere Alternative die sprachliche Spannung zwischen Feststellung, Vorschrift und Erlaubnis bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, ohne steif zu wirken. »Versammlung« erhält den rechtlich-gemeinschaftlichen Charakter von קהל; »Jahwe« gibt den Gottesnamen als Eigennamen wieder.
