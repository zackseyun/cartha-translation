source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: de
  text: Wer aus einer nicht rechtmäßigen Verbindung stammt[a], darf nicht in die Versammlung Jahwes eintreten. Selbst in der zehnten Generation darf keiner seiner Nachkommen in die Versammlung Jahwes eintreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch mamser. Die genaue Bedeutung dieses Rechtsbegriffs ist unsicher. Traditionell wird er mit „unehelich Geborener“ oder „Bastard“ wiedergegeben; möglicherweise bezeichnet er insbesondere einen Menschen, der aus einer verbotenen Verbindung stammt.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: wer aus einer nicht rechtmäßigen Verbindung stammt
  rationale: Der seltene hebräische Rechtsbegriff bezeichnet einen Menschen mit einem aufgrund seiner Abstammung ausgeschlossenen Status; seine genaue Reichweite ist umstritten. Die Formulierung ist verständlich, vermeidet das heute abwertende Wort „Bastard“ und legt den Begriff nicht einseitig auf außereheliche Geburt fest.
- source_word: יָבֹא
  choice: darf … kommen
  rationale: Das Verb bedeutet wörtlich „kommen/hineinkommen“. Im gesetzlichen Verbot gibt „darf nicht … kommen“ sowohl die Handlung als auch den normativen Charakter natürlich wieder.
- source_word: קְהַל יְהוָה
  choice: Versammlung Jahwes
  rationale: „Versammlung“ gibt קהל als versammelte Bundesgemeinschaft wieder, ohne vorschnell den später kirchlich geprägten Begriff „Gemeinde“ einzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: auch in der zehnten Generation
  rationale: Die Formulierung bewahrt die zeitlich-genealogische Reichweite der hebräischen Rechtsformel.
- source_word: לֹא יָבֹא לוֹ
  choice: darf keiner seiner Nachkommen … kommen
  rationale: Im Zusammenhang mit der zehnten Generation verweist לוֹ auf die dem Betroffenen zugehörige Abstammungslinie. „Keiner seiner Nachkommen“ macht diesen im Hebräischen knappen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die deutsche Namensform „Jahwe“ bewahrt diesen Charakter, anstatt den Namen durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von „Versammlung Jahwes“
  choice: Die rechtliche Formel ohne nähere Bestimmung der betroffenen Teilhaberechte wiedergeben
  alternative: den Ausschluss ausdrücklich als Verbot von Gottesdienstbesuch, Eheschließung oder politischer Mitgliedschaft deuten
  rationale: Der Vers selbst bestimmt nicht genauer, welche Formen der Zugehörigkeit oder Teilnahme קהל umfasst. Die Übersetzung wahrt diese Spannung und legt keine konfessionelle oder historische Einzelauslegung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der zweifachen Verbotsformel des Hebräischen. Der belastete traditionelle Ausdruck „Bastard“ steht nur als lexikalische Alternative in der Fußnote.
