  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: de
  text: Wenn du aber darauf verzichtest, ein Gelübde abzulegen, ist es für dich keine Sünde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »trifft dich keine Schuld.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Wenn du aber
  rationale: Die Verbindung leitet gegenüber der Pflicht zur Erfüllung eines bereits abgelegten Gelübdes eine kontrastierende Bedingung ein. »Wenn … aber« gibt beide Funktionen im Deutschen natürlich wieder.
- source_word: תֶחְדַּל
  choice: darauf verzichtest
  rationale: חדל bedeutet aufhören, ablassen oder etwas unterlassen. Mit dem folgenden Infinitiv bezeichnet es hier die bewusste Entscheidung, kein Gelübde abzulegen; »darauf verzichten« ist dafür idiomatisches modernes Deutsch.
- source_word: לִנְדֹּר
  choice: ein Gelübde abzulegen
  rationale: נדר bezeichnet das Geloben. Die feste deutsche Wendung »ein Gelübde ablegen« bewahrt den konkreten Rechts- und Verpflichtungscharakter des Vorgangs.
- source_word: לֹא יִהְיֶה
  choice: ist es … keine
  rationale: Die verneinte Existenzform wird im Deutschen als nominale Aussage natürlich wiedergegeben. Das Präsens formuliert die allgemein geltende Folge der Bedingung, ohne den hebräischen resultativen Sinn zu verändern.
- source_word: בְ/ךָ
  choice: für dich
  rationale: Wörtlich steht »in dir/an dir«. In Verbindung mit חֵטְא bezeichnet die Präposition den Betroffenen beziehungsweise seine moralische Belastung; »für dich« ist verständlich und bleibt nahe an der hebräischen Aussage.
- source_word: חֵטְא
  choice: Sünde
  rationale: חֵטְא kann sowohl die Sünde als Verfehlung als auch die daraus erwachsende Schuld bezeichnen. »Sünde« gibt hier den moralischen Hauptsinn wieder; die Schuldnuance bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Moralischer Status des Verzichts auf ein Gelübde
  choice: Wer kein Gelübde ablegt, begeht dadurch keine Sünde.
  alternative: Der Vers betont vor allem, dass daraus keine Schuld oder rechtliche Haftung entsteht.
  rationale: Der Kontext unterscheidet zwischen dem freiwilligen Eingehen eines Gelübdes und der Pflicht, ein eingegangenes Gelübde zu erfüllen. חֵטְא lässt sowohl die Verfehlung als auch die Schuldfolge anklingen; der Haupttext nennt die Sünde, während die Fußnote die alternative Schuldnuance bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ein Gelübde ablegen« wahrt den rechtlich-religiösen Charakter, während »darauf verzichten« die hebräische Konstruktion natürlich wiedergibt. Die Fußnotenmarke steht bei der Aussage über Sünde, auf die sich die lexikalische Alternative tatsächlich bezieht.
