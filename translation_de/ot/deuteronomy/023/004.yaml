  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: de
  text: Kein Ammoniter oder Moabiter darf in die Versammlung Jahwes kommen.[a] Selbst bis zur zehnten Generation[b] darf keiner von ihnen in die Versammlung Jahwes kommen – auf ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen sowohl „bis zur zehnten Generation“ als auch „auf ewig“. Beide Formulierungen werden beibehalten, ohne die eine auf die andere zu reduzieren.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: darf … kommen
  rationale: Der Imperfekt mit לֹא drückt in diesem Rechtstext den Ausschluss beziehungsweise ein Verbot aus. „Darf … kommen“ gibt die fehlende Zulassung in natürlichem Deutsch wieder.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: Ammoniter oder Moabiter
  rationale: Die üblichen deutschen Volksbezeichnungen geben die beiden Gentilicia knapp und eindeutig wieder; das hebräische וּ wird in der negierten Verbindung idiomatisch mit „oder“ ausgedrückt.
- source_word: קְהַל יְהוָה
  choice: Versammlung Jahwes
  rationale: „Versammlung“ bewahrt den offiziellen gemeinschaftlichen Sinn von קָהָל, ohne unnötig kirchliche Vorstellungen einzutragen. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: selbst bis zur zehnten Generation
  rationale: Die Formulierung erhält die verstärkende Wirkung von גַּם und die ausdrücklich genannte zehnte Generation in verständlichem Deutsch.
- source_word: לָהֶם
  choice: keiner von ihnen
  rationale: Im Zusammenhang der wiederholten Ausschlussformel macht diese Wendung den Bezug auf Angehörige beziehungsweise Nachkommen der genannten Völker im Deutschen klar, ohne eine bestimmte genealogische Theorie festzulegen.
- source_word: עַד עוֹלָם
  choice: auf ewig
  rationale: Die eigenständige Schlusswendung bewahrt den Gedanken fortdauernder Geltung und bleibt neben der Formel von der zehnten Generation ausdrücklich stehen.
theological_decisions:
- issue: Verhältnis von „zehnter Generation“ und „auf ewig“
  choice: Beide Zeitangaben bleiben im Haupttext nebeneinander stehen.
  alternative: Die zehnte Generation lediglich als Redewendung für „niemals“ aufzufassen oder „auf ewig“ abzuschwächen.
  rationale: Der hebräische Text enthält beide Formulierungen. Die Gedankenstrichstellung macht ihre spannungsvolle Verbindung sichtbar, ohne sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Ausschlussformel wird klar und ohne konfessionell geprägte Zusatzdeutung wiedergegeben; der Gedankenstrich hebt die abschließende Dauerformel hervor.
