source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: de
  text: 'Du sollst deinem Bruder[a] keine Zinsen berechnen: weder für Geld[b] noch für Lebensmittel noch für irgendetwas, das gegen Zinsen verliehen wird.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »deinem Bruder«; im Kontext ist ein Angehöriger des eigenen Volkes gemeint.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »Silber«; hier im Sinn von Geld.
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Wendung kann auch als »wofür Zinsen erhoben werden« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: Zinsen auferlegen
  rationale: Der Hifil von נשׁך bezeichnet hier das Auferlegen oder Erheben von Zinsen. Die Formulierung wahrt die an den Kreditgeber gerichtete Rechtsvorschrift.
- source_word: לְאָחִיךָ
  choice: deinem Bruder
  rationale: Die wörtliche familiäre und bundestheologische Bezeichnung wird beibehalten; im Kontext ist damit ein Angehöriger des eigenen Volkes gemeint.
- source_word: נֶשֶׁךְ
  choice: Zinsen
  rationale: Das Wort bezeichnet Kreditzinsen allgemein, nicht nur überhöhte oder ausbeuterische Zinsen.
- source_word: כֶּסֶף
  choice: Geld
  rationale: Wörtlich bedeutet das Wort »Silber«, bezeichnet im rechtlich-wirtschaftlichen Zusammenhang jedoch Geld.
- source_word: אֹכֶל
  choice: Lebensmittel
  rationale: Die Wiedergabe bezeichnet Nahrung beziehungsweise essbare Vorräte als Gegenstand eines Darlehens und klingt in der rechtlichen Aufzählung natürlich.
- source_word: כָּל דָּבָר
  choice: irgendetwas
  rationale: Die umfassende Wendung erweitert das Verbot über Geld und Lebensmittel hinaus.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: wofür man Zinsen verlangen kann
  rationale: Die bewusst allgemein formulierte Relativkonstruktion gibt wieder, dass jeder zinstragende Gegenstand beziehungsweise jedes entsprechende Darlehen gemeint ist, ohne den hebräischen Satz enger festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von »Bruder«
  choice: Die wörtliche Anrede »deinem Bruder« bleibt im Haupttext stehen und wird in einer Fußnote kontextuell erläutert.
  alternative: »deinem israelitischen Mitbürger« oder »deinem Volksgenossen«
  rationale: So bleibt die familiär-bundestheologische Ausdrucksweise des Hebräischen erhalten, ohne den historischen Geltungsbereich für moderne Leser zu verschleiern.
- issue: Art der untersagten Zinsen
  choice: »Zinsen« ohne Einschränkung auf überhöhte Zinsen
  alternative: »Wucherzinsen«
  rationale: נֶשֶׁךְ bezeichnet hier Zinsen allgemein. Eine Beschränkung auf missbräuchlich hohe Zinssätze würde den Rechtssatz unbegründet verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich klarer Satzstruktur. Die dreifache Wiederholung von נֶשֶׁךְ wird durch die Wiederholung von »Zinsen« bewahrt. »Lebensmittel« ist im wirtschaftlich-rechtlichen Kontext präziser als das allgemeinere »Essen«.
