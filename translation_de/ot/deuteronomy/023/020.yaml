review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt das Zinsverbot, die dreigliedrige Aufzählung und die wörtliche Anrede »deinem Bruder« grundsätzlich zutreffend wieder. Die Relativkonstruktion אֲשֶׁר יִשָּׁךְ bezeichnet jedoch nicht bloß etwas, »wofür man Zinsen verlangen kann«, sondern etwas, das tatsächlich gegen Zinsen verliehen wird bzw. zinstragend verliehen ist.
  naturalness: »Zinsen auferlegen« ist verständlich, aber »Zinsen berechnen« ist im modernen Standarddeutsch für diese rechtlich-wirtschaftliche Aussage idiomatischer. Die revidierte Satzstellung bewahrt die Aufzählung und liest sich flüssiger.
  terminology: »Zinsen«, »Geld«, »Lebensmittel« und »deinem Bruder« sind angemessen. Die Fußnote zu »Bruder« sollte die kontextuelle Eingrenzung erläutern, ohne die wörtliche Bedeutung im Haupttext zu ersetzen. Die bisherige Alternativformulierung »auf dem Zinsen liegen« ist im Deutschen unnatürlich und für den hebräischen Satz nicht hilfreich.
  issues:
  - severity: medium
    issue: Die Wiedergabe der abschließenden Relativkonstruktion als »wofür man Zinsen verlangen kann« ist modal und potenziell.
    rationale: Der hebräische Ausdruck beschreibt den Gegenstand eines gegen Zinsen gegebenen Darlehens, nicht lediglich die Möglichkeit, Zinsen zu fordern. Dadurch wird die Aussage des Verbots im Entwurf abgeschwächt.
  - severity: low
    issue: Fußnote c enthält die unidiomatische Alternative »auf dem Zinsen liegen«.
    rationale: Diese Wendung ist kein natürliches modernes Deutsch. Eine Fußnote sollte stattdessen die mögliche Nuance von »gegen Zinsen verliehen« beziehungsweise »wofür Zinsen erhoben werden« sachlich erläutern.
