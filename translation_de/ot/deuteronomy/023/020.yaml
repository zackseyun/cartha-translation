revisions:
- from: Du sollst deinem Bruder[a] weder Zinsen auf Geld[b] noch Zinsen auf Lebensmittel noch Zinsen auf irgendetwas auferlegen, wofür man Zinsen verlangen kann.[c]
  to: 'Du sollst deinem Bruder[a] keine Zinsen berechnen: weder für Geld[b] noch für Lebensmittel noch für irgendetwas, das gegen Zinsen verliehen wird.[c]'
  rationale: Die Revision ersetzt die modale und damit abschwächende Formulierung der letzten Klausel durch eine Wiedergabe, die den tatsächlichen zinstragenden Darlehensvorgang ausdrückt. Zugleich wird mit »Zinsen berechnen« eine natürliche moderne deutsche Rechts- und Wirtschaftssprache verwendet. Die Fußnoten bleiben an den einschlägigen Textstellen verankert und erläutern die lexikalischen beziehungsweise syntaktischen Alternativen ohne zusätzliche theologische Festlegung.
