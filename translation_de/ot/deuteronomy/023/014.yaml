  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: de
  text: Auch sollst du einen Pflock bei deiner Ausrüstung haben.[a] Wenn du dich draußen hinsetzt,[b] sollst du damit graben; danach sollst du dich umwenden und deine Ausscheidung bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „auf deinem Ohr“. Gemeint ist wahrscheinlich die mitgeführte Ausrüstung. Der „Pflock“ kann hier als Grabwerkzeug gedient haben; andere übersetzen daher „kleiner Spaten“.
    reason: lexical_alternative
  - marker: b
    text: „Dich draußen hinsetzen“ ist eine verhüllende Redeweise für das Verrichten der Notdurft.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: Pflock
  rationale: Das Substantiv bezeichnet gewöhnlich einen Pflock oder Pfahl. Hier dient der Gegenstand zum Graben; „Pflock“ bewahrt dennoch das konkrete Wortbild, ohne ihn ausdrücklich zu einem Spaten umzudeuten.
- source_word: עַל אֲזֵנֶךָ
  choice: bei deiner Ausrüstung
  rationale: אֹזֶן bedeutet wörtlich „Ohr“, doch die Wendung bezeichnet hier wahrscheinlich die mitgeführte Ausrüstung beziehungsweise den Platz daran. Eine wörtliche Wiedergabe wäre im Deutschen unverständlich; die Fußnote bewahrt die ungewöhnliche Formulierung.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: wenn du dich draußen hinsetzt
  rationale: Die Formulierung bedeutet wörtlich etwa „bei deinem Sitzen draußen“ und dient im Zusammenhang als verhüllende Redeweise für das Verrichten der Notdurft. Die Übersetzung wahrt diesen Euphemismus.
- source_word: וְחָפַרְתָּה בָהּ
  choice: sollst du damit graben
  rationale: Das feminine Pronomen bezieht sich auf יָתֵד. Ein Loch ist sachlich vorausgesetzt, im Hebräischen aber nicht ausdrücklich genannt.
- source_word: וְשַׁבְתָּ
  choice: danach sollst du dich umwenden
  rationale: שׁוב bezeichnet hier wahrscheinlich das Sich-Zurückwenden nach dem Graben, um die Ausscheidung zu bedecken. „Sich umwenden“ gibt die Handlungsfolge im Deutschen natürlich wieder.
- source_word: צֵאָתֶךָ
  choice: deine Ausscheidung
  rationale: Das Wort bezeichnet menschliche Exkremente. „Ausscheidung“ ist verständlich, sachlich und für einen würdevollen Rechtstext angemessen.
