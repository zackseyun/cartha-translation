id: DEU.23.18
reference: Deuteronomy 23:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: de
  text: Unter den Töchtern Israels soll es keine Kultprostituierte geben[a], und unter den Söhnen Israels soll es keinen Kultprostituierten geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kultdienerin beziehungsweise Kultdiener. Die hebräischen Wörter bedeuten wörtlich etwa „Geweihte“ und „Geweihter“. Traditionell werden sie auf sexuelle Dienste im Rahmen fremder Kulte bezogen; ihre genaue Funktion ist jedoch umstritten.'
    reason: lexikalische Alternative und Erhaltung sachlicher Ambiguität
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: Kultprostituierte
  rationale: Die feminine Bezeichnung meint in diesem Verbotskontext eine Frau mit einer verwerflichen kultischen Funktion. „Kultprostituierte“ macht die traditionell angenommene sexuelle und religiöse Dimension sichtbar; die Unsicherheit über die genaue Funktion wird in der Fußnote offengehalten.
- source_word: קָדֵשׁ
  choice: Kultprostituierter
  rationale: Die maskuline Parallelbezeichnung wird geschlechtsgenau und lexikalisch parallel wiedergegeben. So bleibt der bewusste Gegensatz zwischen den Töchtern und den Söhnen Israels erhalten.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: soll es keine/keinen … geben
  rationale: Diese Formulierung gibt das gesetzliche Verbot in natürlichem, würdigem modernem Deutsch wieder und bewahrt zugleich die Existenzkonstruktion des Hebräischen.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: unter den Töchtern Israels / unter den Söhnen Israels
  rationale: „Unter“ gibt die Zugehörigkeit innerhalb der Gemeinschaft idiomatisch wieder. „Töchter“ und „Söhne Israels“ bewahren die geschlechtsspezifische Parallelstruktur und die Bundesvolkssprache des Hebräischen.
theological_decisions:
- issue: Bedeutung von קְדֵשָׁה und קָדֵשׁ in diesem Gesetz
  choice: Kultprostituierte beziehungsweise Kultprostituierter, mit Hinweis auf die umstrittene genaue Funktion
  alternative: Kultdienerin beziehungsweise Kultdiener; wörtlich eine „Geweihte“ beziehungsweise ein „Geweihter“
  rationale: Die herkömmliche Deutung verbindet die Begriffe mit sexuellen Praktiken im Rahmen fremder Kulte; zugleich ist die genaue historische Funktion solcher Personen in der Forschung umstritten. Der Haupttext vermittelt die kontextuell wahrscheinliche kultisch-sexuelle Bedeutung, während die Fußnote die echte lexikalische Unsicherheit bewahrt und eine neutrale positive Vorstellung von Heiligkeit vermeidet.
translation_notes:
  register: Moderner, verständlicher Gesetzesstil mit würdiger Satzform. Die parallelen Bezeichnungen „Töchter Israels“ und „Söhne Israels“ wurden bewusst beibehalten; „unter“ ist im Deutschen natürlicher als ein mechanisches „von“.
