  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: de
  text: Wenn du aber Jahwe, deinem Gott, ein Gelübde ablegst, darfst du nicht zögern, es zu erfüllen. Denn Jahwe, dein Gott, wird es gewiss von dir fordern, und es wird dir zur Sünde werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du wirst dich dadurch schuldig machen“. Wörtlich: „und Sünde wird in dir sein“.'
    reason: Die hebräische Wendung וְהָיָה בְךָ חֵטְא beschreibt, dass die unterlassene Erfüllung dem Gelobenden zur Sünde beziehungsweise Schuld wird; die wörtliche Formulierung ist im Deutschen weniger idiomatisch.
lexical_decisions:
- source_word: כִּי
  choice: Wenn … aber
  rationale: כִּי leitet hier im Zusammenhang eine Bedingung ein; „aber“ gibt zugleich den leichten Kontrast zum vorausgehenden Vers wieder.
- source_word: תִדֹּר נֶדֶר
  choice: ein Gelübde ablegen
  rationale: Die Verbindung aus dem Verb נדר und dem gleichstämmigen Substantiv נדר wird im Deutschen idiomatisch mit „ein Gelübde ablegen“ wiedergegeben.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Die Präposition bezeichnet den Empfänger des Gelübdes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: darfst du nicht zögern, es zu erfüllen
  rationale: Das negierte Imperfekt hat in dieser Rechtsweisung verpflichtende Kraft. שלם bezeichnet bei einem Gelübde dessen Erfüllung; „erfüllen“ ist weiter und treffender als das ausschließlich finanziell klingende „bezahlen“.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: wird es gewiss … fordern
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage. „gewiss“ bildet diese nachdrückliche Gewissheit natürlich ab.
- source_word: מֵעִמָּךְ
  choice: von dir
  rationale: Die Wendung bezeichnet die Person, von der Jahwe die Erfüllung des Gelübdes fordert.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: und Sünde wird auf dir liegen
  rationale: Die Formulierung bewahrt das knappe Bild der hebräischen Wendung und lässt zugleich erkennen, dass der Betreffende durch die Nichterfüllung Schuld auf sich lädt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וְהָיָה בְךָ חֵטְא
  choice: Sünde wird auf dir liegen
  alternative: du wirst dich schuldig machen
  rationale: Die gewählte Fassung bewahrt die bildhafte und etwas offene hebräische Konstruktion, statt sie vollständig als abstrakte Schuldaussage aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Verbindlichkeit wird klar ausgedrückt, während die bildhafte Schlusswendung des Hebräischen erhalten bleibt.
