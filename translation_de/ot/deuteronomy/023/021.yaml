  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: de
  text: Von einem Ausländer darfst du Zinsen verlangen[a], aber von deinem Bruder darfst du keine Zinsen verlangen[b], damit Yahweh, dein Gott, dich bei allem segnet, was deine Hand unternimmt, in dem Land, in das du kommst, um es in Besitz zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einem Ausländer gegen Zinsen leihen“ oder „von einem Ausländer Zinsen erheben“. Das ältere Wort „Wucher“ kann heute eine überhöhte oder rechtswidrige Verzinsung nahelegen, die der hebräische Ausdruck nicht zwingend bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: „Dein Bruder“ bezeichnet hier einen Mitangehörigen Israels; der hebräische Text verwendet die familiäre Bezeichnung.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: von einem Ausländer
  rationale: נָכְרִי bezeichnet hier einen Ausländer bzw. Außenstehenden im Gegensatz zu einem Angehörigen Israels. Die Präposition wird im Deutschen wegen des Verbs idiomatisch mit „von“ wiedergegeben.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: Zinsen verlangen / keine Zinsen verlangen
  rationale: Der Hifil von נשׁך bezeichnet in diesem Darlehenskontext das Auferlegen bzw. Erheben von Zinsen. „Zinsen verlangen“ ist gegenwärtiges, neutrales Deutsch und vermeidet die zusätzliche moralische Wertung von „Wucher“.
- source_word: אָחִיךָ
  choice: deinem Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; im Rechtskontext bezeichnet sie einen Mitangehörigen Israels.
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck- bzw. Ergebniszusammenhang knapp und natürlich wieder.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: damit Yahweh, dein Gott, dich … segnet
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben. Die Verbform steht in einem von לְמַעַן eingeleiteten Zweck- oder Ergebnissatz; im Deutschen ist der Indikativ nach „damit“ natürlich.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: bei allem, was deine Hand unternimmt
  rationale: Bewahrt das hebräische Bild der Hand und vermittelt zugleich idiomatisch den Sinn „bei all deinen Unternehmungen“.
- source_word: עַל הָאָרֶץ
  choice: in dem Land
  rationale: Das lokative עַל wird in diesem Zusammenhang im Deutschen natürlich mit „in“ ausgedrückt.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: in das du hineinziehst, um es in Besitz zu nehmen
  rationale: „Hineinziehst“ gibt die bevorstehende Bewegung in das Land wieder; „um es in Besitz zu nehmen“ wahrt die Zweckbedeutung des Infinitivs.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Yahweh“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite von אָחִיךָ im Bundesrecht
  choice: Bruder im Sinn eines Mitangehörigen Israels, mit Fußnotenerklärung
  alternative: Mit-Israelit im Haupttext
  rationale: Die familiäre Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar, während die kontextuelle soziale Bedeutung erklärt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular und das Hand-Bild des Hebräischen bleiben erhalten. „Zinsen“ wird wertneutral gebraucht; die soziale Bundesgrenze zwischen Ausländer und „Bruder“ wird nicht geglättet.
