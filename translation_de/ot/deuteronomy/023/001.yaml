  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: de
  text: Kein Mann darf die Frau seines Vaters nehmen[a] und den Gewandsaum seines Vaters nicht aufdecken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heiraten« oder »zur Frau nehmen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Flügel/Rand seines Vaters aufdecken«. Die Wendung ist eine sexuelle Umschreibung und bezeichnet eine Verletzung der ehelichen beziehungsweise sexuellen Sphäre seines Vaters; die genaue Bildsprache bleibt mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: nehmen
  rationale: לָקַח kann zusammen mit »Frau« idiomatisch »zur Frau nehmen/heiraten« bedeuten. »Nehmen« bewahrt die Ausdrucksweise des Hebräischen, während die mögliche Bedeutung »heiraten« in der Fußnote erläutert wird.
- source_word: אִישׁ
  choice: Kein Mann
  rationale: Die Verbindung aus לֹא und dem maskulinen Singular אִישׁ wird als natürliches deutsches Rechtsgebot wiedergegeben.
- source_word: אֵשֶׁת אָבִיו
  choice: die Frau seines Vaters
  rationale: Die Wiedergabe entspricht der hebräischen Genitivverbindung und vermeidet die engere Deutung »Stiefmutter«.
- source_word: יְגַלֶּה
  choice: aufdecken
  rationale: Das Verb גלה bedeutet hier wörtlich »aufdecken/entblößen« und ist Bestandteil einer sexuellen Umschreibung.
- source_word: כְּנַף
  choice: Gewandsaum
  rationale: כָּנָף bezeichnet wörtlich einen Flügel, Rand oder in Bezug auf Kleidung einen Saum beziehungsweise Gewandzipfel. »Gewandsaum« erhält das konkrete Bild, ohne das sexuell-eheliche Idiom im Haupttext vorschnell aufzulösen.
theological_decisions:
- issue: Soll die sexuelle Umschreibung im Haupttext ausdrücklich aufgelöst werden?
  choice: Das Bild »den Gewandsaum seines Vaters aufdecken« bleibt im Haupttext erhalten.
  alternative: mit der Frau seines Vaters geschlechtlich verkehren; das Ehebett seines Vaters verletzen; die Blöße seines Vaters aufdecken
  rationale: Der hebräische Text verwendet hier nicht die gewöhnliche Formel »die Blöße aufdecken«, sondern eine ungewöhnliche Wendung mit כָּנָף. Die bildhafte Formulierung bewahrt diese Besonderheit und ihre Mehrdeutigkeit; die gemeinte sexuelle beziehungsweise eheliche Verletzung wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Darf nicht« formuliert das rechtliche Verbot natürlich; »Gewandsaum« hält die ungewöhnliche hebräische Metapher sichtbar. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Wendung.
