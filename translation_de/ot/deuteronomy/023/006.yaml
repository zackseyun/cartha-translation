source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: de
  text: Doch Jahwe, dein Gott, wollte nicht auf Bileam hören. Stattdessen verwandelte Jahwe, dein Gott, den Fluch für dich in Segen, denn Jahwe, dein Gott, liebte dich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: wollte nicht
  rationale: Das Verb bezeichnet fehlende Bereitschaft oder Zustimmung. „Wollte nicht“ bewahrt diesen Willensaspekt und klingt im modernen Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form enthält ein Suffix der 2. Person Maskulin Singular und wird direkt mit „dein Gott“ wiedergegeben.
- source_word: לִשְׁמֹעַ אֶל
  choice: auf … hören
  rationale: Die hebräische Verbindung bedeutet, auf jemanden zu hören beziehungsweise ihm Gehör zu schenken; „auf Bileam hören“ erhält die Nähe zum Wortlaut, ohne die Wirkung weiter auszudeuten.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: וַיַּהֲפֹךְ
  choice: verwandelte
  rationale: הפך bezeichnet hier das Umkehren beziehungsweise Verwandeln einer Sache in eine andere. „Verwandelte … in“ ist im Deutschen idiomatisch.
- source_word: הַקְּלָלָה
  choice: den Fluch
  rationale: Das Substantiv bezeichnet den gegen Israel beabsichtigten beziehungsweise ausgesprochenen Fluch.
- source_word: לִבְרָכָה
  choice: in Segen
  rationale: Die Präposition markiert hier das Ergebnis der Verwandlung. Die artikellose Form „in Segen“ entspricht dem Hebräischen und ist idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für Jahwes Handeln an. „Denn“ wahrt den begründenden Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: אֲהֵבְךָ
  choice: liebte dich
  rationale: Das Verb bedeutet schlicht „lieben“; das Präteritum entspricht der erzählenden Rückschau des Verses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ gibt ihn als persönlichen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Gottes Nicht-Hören auf Bileam
  choice: wollte nicht auf Bileam hören
  alternative: weigerte sich, Bileam zu erhören
  rationale: Die gewählte Fassung erhält sowohl den Willensaspekt von אָבָה als auch die relativ offene Bedeutung von שׁמע אל. Sie legt nicht über den Text hinaus fest, ob damit ein Gebet, eine Bitte oder die beabsichtigte Wirkung des Fluches gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Jahwe, dein Gott“ bleibt wie im Hebräischen vollständig erhalten. Die Satzteilung erhöht die Verständlichkeit; „Stattdessen“ verdeutlicht den im וַ-Anschluss liegenden Gegensatz, ohne den Inhalt zu verändern.
