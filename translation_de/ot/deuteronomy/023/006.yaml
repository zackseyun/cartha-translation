  terminology: „Jahwe“ ist als Wiedergabe des Tetragramms konsistent; „Bileam“, „Fluch“ und „Segen“ sind die im Deutschen etablierten Formen. Es sind keine problematischen theologischen Festlegungen hinzugefügt.
