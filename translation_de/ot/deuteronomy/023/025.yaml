base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: de
  text: Wenn du in den Weinberg deines Nächsten kommst[a], darfst du nach Herzenslust Trauben essen, bis du satt bist; aber in dein Gefäß[b] darfst du nichts hineintun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Falls du in den Weinberg deines Nächsten kommst.“ Das hebräische Wort kann den Satz sowohl zeitlich als auch bedingt einleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Behälter“. Das hebräische Wort legt nicht fest, um was für ein Gefäß es sich handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Wenn du … kommst
  rationale: כִּי leitet hier einen situationsbezogenen Rechtsfall ein; „wenn“ bewahrt im Deutschen die mögliche zeitliche wie bedingte Nuance. בוא mit ב bezeichnet das Hineinkommen in einen Ort.
- source_word: בְּכֶרֶם רֵעֶךָ
  choice: in den Weinberg deines Nächsten
  rationale: כֶּרֶם bezeichnet einen Weinberg; רֵעַ meint hier den Nächsten beziehungsweise Mitmenschen und wird im Deutschen natürlich possessiv wiedergegeben.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: darfst du … Trauben essen
  rationale: Die Verbform beschreibt in diesem Rechtszusammenhang eine erlaubte Handlung. „darfst“ macht die Erlaubnis klar, ohne daraus ein Gebot zu machen.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: nach Herzenslust …, bis du satt bist
  rationale: נֶפֶשׁ bezeichnet hier das persönliche Verlangen beziehungsweise den Appetit, nicht terminologisch die „Seele“; שָׂבְעֶךָ drückt Sättigung aus. Die deutsche Wendung gibt das Idiom natürlich wieder.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: aber in dein Gefäß darfst du nichts tun
  rationale: כְּלִי ist ein allgemeiner Ausdruck für Gefäß oder Behälter; נתן bedeutet mit der Richtungsangabe „hineintun“. Die Formulierung untersagt das Mitnehmen, ohne die Art des Gefäßes festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nach Herzenslust“ vermittelt die hebräische Rede vom persönlichen Verlangen idiomatisch; „bis du satt bist“ hält zugleich die Begrenzung auf den unmittelbaren Verzehr fest.
