base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: de
  text: Was über deine Lippen gekommen ist, sollst du einhalten und erfüllen, entsprechend dem, was du Jahwe, deinem Gott, als freiwillige Opfergabe[a] gelobt und mit deinem Mund ausgesprochen hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als freiwillige Gabe“. Das hebräische Wort bezeichnet eine Gabe, die freiwillig dargebracht wird, besonders eine Opfergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: Was über deine Lippen gekommen ist
  rationale: Die konkrete hebräische Wendung bezeichnet das, was aus den Lippen hervorgegangen ist, also die ausgesprochene Verpflichtung. Die deutsche Form bewahrt das Bild und bleibt verständlich.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: sollst du einhalten und ausführen
  rationale: שׁמר bezeichnet hier das treue Einhalten, עשה die praktische Erfüllung des Gelübdes. Beide Verben werden wiedergegeben.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: so wie du es ... gelobt hast
  rationale: Die Formulierung bindet die geforderte Ausführung genau an den Inhalt des Gelübdes.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Der Gottesname יהוה wird als Jahwe wiedergegeben; die appositionelle Verbindung mit 'deinem Gott' bleibt erhalten.
- source_word: נְדָבָה
  choice: freiwillig
  rationale: נְדָבָה kann eine freiwillige Gabe beziehungsweise Opfergabe bezeichnen. Syntaktisch lässt sich das Wort hier auch adverbial auf das Geloben beziehen; 'freiwillig' bewahrt diesen Sinn, ohne eine im Satz nicht ausdrücklich genannte Opferart festzulegen.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: was du mit deinem Mund ausgesprochen hast
  rationale: Die bewusste Wiederholung des mündlichen Aussprechens wird erhalten; 'ausgesprochen' ist im Deutschen natürlicher als das wörtlichere 'gesprochen'.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. 'Jahwe' gibt den Gottesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Bedeutung von נְדָבָה
  choice: freiwillig gelobt
  alternative: als freiwillige Opfergabe gelobt
  rationale: Das Wort bezeichnet Freiwilligkeit und kann kultisch eine freiwillige Gabe meinen. Da der hebräische Satz keine Präposition vor נְדָבָה setzt, bleibt offen, ob es den Inhalt des Gelübdes als Opfergabe benennt oder die freiwillige Art des Gelobens hervorhebt. Der Haupttext vermeidet eine unnötige Festlegung; die Fußnote nennt die Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Anrede. Die hebräische Lippen-Metapher und die Wiederholung des mündlichen Aussprechens bleiben erhalten. Der Gedankenstrich macht den nachgestellten Relativsatz lesbar, ohne ihn vom Gelübde zu lösen.
