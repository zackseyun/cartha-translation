base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: de
  text: Wenn du in das stehende Getreide deines Nächsten kommst, darfst du mit der Hand Ähren pflücken[a], aber du darfst keine Sichel an das stehende Getreide deines Nächsten legen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Getreideköpfe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du darfst keine Sichel über dem stehenden Getreide deines Nächsten schwingen“. Das hebräische Verb kann das Bewegen, Schwingen oder Ansetzen der Sichel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Wenn du … kommst
  rationale: כִּי leitet hier den Anwendungsfall des Gesetzes ein; zusammen mit בוא gibt „wenn du … kommst“ den kasuistischen Sinn natürlich wieder, ohne ihn zu einem bloß zeitlichen Vorgang zu verengen.
- source_word: בְּקָמַת רֵעֶךָ
  choice: in das Kornfeld deines Nächsten
  rationale: קָמָה bezeichnet das noch stehende Getreide. „Kornfeld“ ist am Versanfang im Deutschen die natürliche Ortsangabe; die Wiederholung als „stehendes Getreide“ bewahrt bei der Verbotsbestimmung die sachliche Präzision des Hebräischen.
- source_word: וְקָטַפְתָּ
  choice: darfst du … pflücken
  rationale: Die Verbform bezeichnet im rechtlichen Gegensatz zur folgenden Untersagung eine erlaubte Handlung. „Darfst“ macht diese pragmatische Funktion im Deutschen deutlich.
- source_word: מְלִילֹת
  choice: Ähren
  rationale: Das Wort bezeichnet die körnertragenden Ähren beziehungsweise Getreideköpfe, die von Hand abgerissen werden können. „Ähren“ ist im modernen Deutschen eindeutig und natürlich.
- source_word: בְּיָדֶךָ
  choice: mit der Hand
  rationale: Die Formulierung bewahrt die ausdrückliche Begrenzung auf manuelles Pflücken und steht im Kontrast zur Sichel.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: aber du darfst die Sichel nicht … legen
  rationale: Das verbindende וְ ist wegen des Gegensatzes adversativ wiedergegeben. Die Hifil-Form von נוף bezeichnet hier das Ansetzen beziehungsweise Führen der Sichel; „die Sichel an … legen“ gibt das konkrete Erntehandeln idiomatisch wieder.
- source_word: עַל קָמַת רֵעֶךָ
  choice: an das stehende Getreide deines Nächsten
  rationale: „An“ bildet עַל in Verbindung mit dem Ansetzen eines Werkzeugs natürlich ab. „Stehendes Getreide“ erhält die spezifische Bedeutung von קָמָה und die Wiederholung des hebräischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. „Kornfeld“ vermeidet die unnatürliche Ortsangabe „in das stehende Getreide“, während die zweite Vershälfte die wörtlichere Bezeichnung bewahrt. Der Gegensatz zwischen erlaubtem Pflücken für den unmittelbaren Bedarf und verbotenem Abernten mit einem Werkzeug bleibt deutlich.
