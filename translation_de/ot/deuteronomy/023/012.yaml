  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: de
  text: Gegen Abend soll er sich mit Wasser waschen, und wenn die Sonne untergeht[a], darf er in das Innere des Lagers[b] kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn die Sonne hineinkommt“; dies ist eine hebräische Wendung für den Sonnenuntergang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ins Lager“. Das Hebräische sagt genauer: „ins Innere des Lagers“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: und
  rationale: Die Verbindung וְ + היה führt hier die fortlaufende Rechtsanweisung weiter; ein schlichtes „und“ gibt diese Anschlussfunktion im Deutschen natürlich wieder.
- source_word: לִפְנוֹת עֶרֶב
  choice: gegen Abend
  rationale: Die Wendung bezeichnet das Sich-Wenden des Tages zum Abend. „Gegen Abend“ ist im modernen Deutsch idiomatisch und bewahrt die zeitliche Annäherung.
- source_word: יִרְחַץ בַּמָּיִם
  choice: soll er sich mit Wasser waschen
  rationale: רחץ bezeichnet in diesem Zusammenhang die körperliche Waschung. Das reflexive „sich waschen“ macht den im Kontext vorausgesetzten Bezug auf die Person deutlich.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: wenn die Sonne untergeht
  rationale: Wörtlich ist vom „Hineinkommen“ der Sonne die Rede; die hebräische Wendung bezeichnet idiomatisch den Sonnenuntergang.
- source_word: יָבֹא
  choice: darf er kommen
  rationale: Im rechtlichen Zusammenhang erlaubt die Form den Wiedereintritt nach Waschung und Sonnenuntergang; „darf“ drückt diese Erlaubnis klar aus.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: ins Innere des Lagers
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise den Binnenbereich des Lagers und ist genauer als das glattere „ins Lager“.
