base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: de
  text: Er soll bei dir wohnen[a], in deiner Mitte, an dem Ort, den er sich in einer deiner Städte auswählt, wo es gut für ihn ist[b]; du sollst ihn nicht unterdrücken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er soll bei dir bleiben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in einem deiner Tore, im Guten für ihn“. „Tore“ steht hier für Städte oder Ortsgemeinschaften; gemeint ist ein Ort, der für ihn gut beziehungsweise passend ist.'
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: soll wohnen
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen oder Sich-Niederlassen. „Wohnen“ ist im Deutschen natürlich und bewahrt den rechtlichen Charakter der gewährten Niederlassung.
- source_word: עִמְּךָ
  choice: bei dir
  rationale: עם mit Suffix bedeutet wörtlich „mit dir“. „Bei dir“ gibt im Deutschen die räumliche und gemeinschaftliche Zugehörigkeit idiomatisch wieder.
- source_word: בְּקִרְבְּךָ
  choice: mitten unter euch
  rationale: Die Wendung bezeichnet die Aufnahme in die Gemeinschaft. Der Wechsel von „dir“ zu „euch“ macht verständlich, dass das singularische Israel als Gemeinschaft angesprochen wird.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: an dem Ort, den er sich auswählt
  rationale: בחר bedeutet „wählen“. Das reflexive „sich auswählt“ klingt im Deutschen natürlich und stellt klar, dass der entlaufene Sklave selbst den Wohnort wählen darf.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: in einer deiner Städte
  rationale: „Tore“ ist hier eine hebräische Metonymie für die zugehörigen Städte beziehungsweise Ortsgemeinden. Die Wiedergabe mit „Städte“ vermittelt den gemeinten Siedlungsraum unmittelbar.
- source_word: בַּטּוֹב לוֹ
  choice: wo es gut für ihn ist
  rationale: Die knappe hebräische Formulierung bedeutet wörtlich etwa „im Guten für ihn“. Die Übersetzung bewahrt, dass sein Wohlergehen beziehungsweise seine eigene Einschätzung des geeigneten Ortes maßgeblich ist.
- source_word: לֹא תּוֹנֶנּוּ
  choice: Du sollst ihn nicht unterdrücken
  rationale: Das Hifil von ינה bezeichnet im rechtlichen Zusammenhang das Bedrücken, Ausbeuten oder Misshandeln eines Schutzbedürftigen. „Unterdrücken“ gibt die soziale und moralische Schärfe des Verbots wieder.
theological_decisions:
- issue: Bezug der maskulinen Singularformen
  choice: Die Formen werden auf den im vorherigen Vers genannten entlaufenen Sklaven als einzelne männlich bezeichnete Person bezogen.
  alternative: Eine geschlechtsneutrale Wiedergabe mit Pluralformen oder „diese Person“.
  rationale: Der hebräische Text verwendet durchgehend den maskulinen Singular. Die Übersetzung bewahrt diese grammatische Gestalt, ohne über den Text hinaus eine allgemeine geschlechtliche Aussage zu formulieren.
- issue: Wahl des Aufenthaltsortes
  choice: Der entlaufene Sklave darf den Ort selbst auswählen.
  alternative: Die Gemeinschaft oder Gott bestimme seinen Aufenthaltsort.
  rationale: Das Subjekt von יבחר ist im unmittelbaren Satzbau dieselbe maskuline Einzelperson. Damit wird ein echter Schutzraum samt eigener Ortswahl zugesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Soll-Form bleibt erhalten. „Städte“ löst die hebräische Metonymie im Haupttext verständlich auf; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
