  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: de
  text: Du sollst einen Sklaven, der von seinem Herrn zu dir geflohen ist, nicht seinem Herrn ausliefern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das hebräische Wort kann einen Diener oder einen Sklaven bezeichnen; hier steht die Unterordnung unter einen Herrn im Mittelpunkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: ausliefern
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe eines Menschen in die Verfügungsgewalt eines anderen. „Ausliefern“ ist im Deutschen natürlich und bewahrt den rechtlichen Charakter des Verbots.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Da die Bindung an einen Herrn und die drohende Rückgabe im Mittelpunkt stehen, gibt „Sklave“ den sozialen Status deutlicher wieder als das mildere „Diener“.
- source_word: אֶל אֲדֹנָיו
  choice: seinem Herrn
  rationale: אָדוֹן bezeichnet in diesem sozialrechtlichen Zusammenhang den menschlichen Herrn des Sklaven, nicht einen göttlichen Titel.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: der … geflohen ist
  rationale: Der Nifal von נצל kann Rettung oder Entkommen ausdrücken. Im Zusammenhang mit der Flucht vor einem Herrn ist „geflohen ist“ idiomatisch und gibt den Relativsatz direkt wieder.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל bezeichnet die Bewegung auf den angeredeten Menschen zu.
- source_word: מֵעִם אֲדֹנָיו
  choice: von seinem Herrn
  rationale: מֵעִם bezeichnet die Trennung aus der unmittelbaren Zugehörigkeit beziehungsweise Gemeinschaft mit dem Herrn; „von seinem Herrn“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Sozialstatus des עֶבֶד
  choice: Sklave
  alternative: Diener
  rationale: Der Text handelt von einem Menschen unter der Gewalt eines Herrn, der geflohen ist und nicht zurückgegeben werden darf. Weil dieses Abhängigkeitsverhältnis für das Gesetz zentral ist, ist „Sklave“ sachlich genauer; die mögliche weitere Bedeutungsbreite wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich, während der hebräische Relativsatz und die wiederholte Bezeichnung „seinem Herrn“ erhalten bleiben.
