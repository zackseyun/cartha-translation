  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Beziehungen des Hebräischen zuverlässig wieder: Das Verbot betrifft die Auslieferung eines עֶבֶד an dessen Herrn; der Relativsatz beschreibt ihn als jemanden, der von seinem Herrn zum Angeredeten entkommen ist. „Ausliefern“ trägt den rechtlich-sozialen Sinn von תַסְגִּיר angemessen. „Geflohen ist“ ist in diesem Kontext eine natürliche und plausible Wiedergabe von יִנָּצֵל, ohne eine über die Vorlage hinausgehende Aussage zu erzwingen.'
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und trotz der vorangestellten Objektgruppe gut lesbar. Die Wiederholung von „seinem Herrn“ entspricht dem hebräischen Text und ist im Deutschen weder störend noch unnatürlich.
