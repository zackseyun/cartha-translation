base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: de
  text: Denn Jahwe, dein Gott, geht mitten in deinem Lager umher, um dich zu retten und deine Feinde in deine Gewalt zu geben.[a] Darum muss dein Lager heilig sein, damit er bei dir nichts Anstößiges sieht und sich nicht von dir abwendet.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und deine Feinde vor dich zu geben“; die hebräische Wendung bedeutet, sie deiner Gewalt auszuliefern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nichts Schamvolles“ beziehungsweise „keine anstößige Sache“. Der hebräische Ausdruck ist weit gefasst und kann etwas Schamvolles, Ungehöriges oder Verunreinigendes bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und sich von hinter dir zurückwenden“. Das Bild zeigt, dass Jahwe das Lager nicht länger begleitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt dessen Eigennamecharakter.
- source_word: מִתְהַלֵּךְ
  choice: geht … umher
  rationale: Gibt die iterative beziehungsweise bewegte Nuance des Hitpael wieder und bewahrt das konkrete anthropomorphe Bild.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: mitten in deinem Lager
  rationale: Entspricht dem räumlichen Ausdruck und klingt im modernen Deutschen natürlich.
- source_word: לְהַצִּילְךָ
  choice: um dich zu retten
  rationale: Passt zum militärischen Zusammenhang und gibt das Befreien aus Gefahr klar wieder.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: und deine Feinde in deine Gewalt zu geben
  rationale: Gibt den Sinn der hebräischen Übergabeformel idiomatisch wieder; die wörtliche Bildgestalt wird in der Fußnote genannt.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Darum muss dein Lager heilig sein
  rationale: Bringt den im Kontext folgernden und verpflichtenden Sinn der Konstruktion in natürlichem Deutsch zum Ausdruck.
- source_word: עֶרְוַת דָּבָר
  choice: nichts Anstößiges
  rationale: Bewahrt die absichtlich breite Bedeutung eines schamvollen, unsittlichen oder verunreinigenden Sachverhalts, ohne sie auf Nacktheit einzuengen.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: und sich nicht von dir abwenden
  rationale: Gibt die Folge idiomatisch wieder; das konkrete Bild des Zurückweichens von hinter Israel wird in der Fußnote bewahrt.
theological_decisions:
- issue: Anthropomorphe Beschreibung der Gegenwart Jahwes
  choice: Das konkrete Bild „geht … umher“ bleibt erhalten.
  alternative: „ist in deinem Lager gegenwärtig“
  rationale: Der hebräische Text beschreibt Gottes Nähe bewusst als Bewegung im Lager; eine Abstraktion würde dieses Bild und seine Begründungsfunktion für die Heiligkeit abschwächen.
- issue: Aussagekraft der Heiligkeitsklausel
  choice: „muss dein Lager heilig sein“
  alternative: „soll dein Lager heilig sein“ oder „wird dein Lager heilig sein“
  rationale: 'Im Zusammenhang hat die Klausel verpflichtende Kraft: Weil Jahwe im Lager gegenwärtig ist, darf es nicht verunreinigt sein.'
- issue: Bedeutungsumfang von עֶרְוַת דָּבָר
  choice: Breite Wiedergabe als „nichts Anstößiges“
  alternative: Engführung auf „Nacktheit“ oder „etwas Unreines“
  rationale: Der Ausdruck ist mehrdeutig und kann etwas Schamvolles, Ungehöriges oder kultisch Verunreinigendes bezeichnen; die Übersetzung legt ihn nicht unnötig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem Hebräischen im Singular. Konkrete Bildsprache wird im Haupttext soweit natürlich bewahrt; schwer verständliche hebräische Wendungen werden idiomatisch wiedergegeben und in Fußnoten transparent gemacht.
