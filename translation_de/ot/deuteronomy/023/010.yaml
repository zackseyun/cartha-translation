  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: de
  text: Wenn du gegen deine Feinde ins Feld ziehst, hüte dich vor allem Bösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor allem Unreinen“; auch: „vor allem Ungehörigen“. Die hebräische Wendung ist weit gefasst und kann in diesem Zusammenhang rituelle Unreinheit einschließen, ohne darauf beschränkt zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier den situativen Nebensatz ein, auf den die folgende Weisung bezogen ist. „Wenn“ ist im Deutschen für diese gesetzliche Formulierung natürlich und lässt offen, ob der Fall als regelmäßig oder bedingt gedacht ist.
- source_word: תֵצֵא מַחֲנֶה
  choice: du … ins Feld ziehst
  rationale: Wörtlich steht etwa „du als Heerlager/Heer ausziehst“. מַחֲנֶה bezeichnet hier im militärischen Zusammenhang metonymisch die Truppe; „ins Feld ziehen“ gibt die Wendung idiomatisch und ohne unnötige Ergänzungen wieder.
- source_word: עַל אֹיְבֶיךָ
  choice: gegen deine Feinde
  rationale: עַל hat in diesem militärischen Zusammenhang adversative Bedeutung; אֹיְבֶיךָ bezeichnet direkt „deine Feinde“.
- source_word: וְנִשְׁמַרְתָּ
  choice: hüte dich
  rationale: Die Nifal-Form von שׁמר hat hier reflexiven Sinn und fordert zur Selbstbewahrung auf. „Hüte dich“ ist knapp, natürlich und bewahrt den mahnenden Charakter.
- source_word: מִכֹּל דָּבָר רָע
  choice: vor allem Bösen
  rationale: Die Wendung ist breit gefasst und kann moralisch Schlechtes, Ungehöriges und im Kontext auch kultisch Unreines einschließen. „Vor allem Bösen“ bewahrt diese Weite besser als eine ausschließlich kultische Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von דָּבָר רָע in den Vorschriften zur Heiligkeit des Heerlagers
  choice: Die breite Wiedergabe „vor allem Bösen“
  alternative: „vor allem Unreinen“ oder „vor allem Ungehörigen“
  rationale: Der folgende Zusammenhang behandelt auch rituelle Unreinheit, doch die hebräische Wendung selbst ist weiter. Die Übersetzung beschränkt die Weisung daher weder ausschließlich auf kultische Unreinheit noch ausschließlich auf moralisches Fehlverhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisungston. „Ins Feld ziehen“ macht den militärischen Zusammenhang natürlich deutlich; „hüte dich“ erhält die persönliche, mahnende Form.
