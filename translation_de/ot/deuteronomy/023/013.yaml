  text: וְ/יָד֙ תִּהְיֶ֣ה לְ/ךָ֔ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/יָצָ֥אתָ שָׁ֖מָּ/ה חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: de
  text: Du sollst außerhalb des Lagers einen Platz[a] haben, und dorthin, nach draußen, sollst du gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „Hand“; das hebräische Wort bezeichnet an dieser Stelle wahrscheinlich idiomatisch einen bestimmten Platz oder Bereich. Wegen des folgenden Verses verstehen manche es konkreter als ein Gerät oder einen Pflock.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: Platz
  rationale: Das gewöhnlich „Hand“ bedeutende Wort wird hier offenbar idiomatisch für einen bestimmten Ort oder Bereich gebraucht. „Platz“ passt zum folgenden Richtungsadverb שָׁמָּה („dorthin“) und zum Zusammenhang der Anweisung.
- source_word: תִּהְיֶה לְךָ
  choice: du sollst … haben
  rationale: Die Konstruktion היה mit לְ bezeichnet hier, was jemandem zur Verfügung stehen soll; die deutsche Fassung gibt zugleich den verpflichtenden Charakter wieder.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Dies ist die direkte und natürliche Wiedergabe der Ortsangabe jenseits der Lagergrenze.
- source_word: וְיָצָאתָ
  choice: sollst du gehen
  rationale: יצא bezeichnet das Hinausgehen. Weil „nach draußen“ am Satzende ausdrücklich folgt, vermeidet „gehen“ die schwerfällige Verdoppelung „hinaus … nach draußen“, ohne die Bewegung zu verschweigen.
- source_word: שָׁמָּה חוּץ
  choice: dorthin, nach draußen
  rationale: „Dorthin“ greift den genannten Platz auf; „nach draußen“ bewahrt die nachdrückliche abschließende Wiederholung von חוּץ.
