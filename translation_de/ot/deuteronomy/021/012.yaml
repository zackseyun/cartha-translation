source:
  edition: WLC
  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: de
  text: Dann sollst du sie in dein Haus bringen, und sie soll sich den Kopf scheren und ihre Nägel kürzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihre Nägel wachsen lassen“. Wörtlich: „und sie soll ihre Nägel machen/zurichten“; die Bedeutung der hebräischen Wendung ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: Dann sollst du sie bringen
  rationale: Das Hifil von בוא mit vorangestelltem Waw führt die nächste vorgeschriebene Handlung der Rechtsbestimmung ein. „Dann sollst du … bringen“ gibt sowohl die Abfolge als auch den verpflichtenden Charakter natürlich wieder.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: in dein Haus
  rationale: תּוֹךְ bezeichnet hier den Innenraum. Im Deutschen gibt „in dein Haus“ die räumliche Bedeutung idiomatisch und vollständig wieder; „in die Mitte deines Hauses“ wäre missverständlich und unnötig wörtlich.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: und sie soll sich den Kopf scheren
  rationale: גלח bedeutet „scheren/rasieren“. Beim Kopfhaar ist „sich den Kopf scheren“ im Deutschen konkret und natürlich, ohne ausdrücklich eine vollständige Kahlrasur hinzuzufügen.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: und ihre Nägel kürzen
  rationale: Die wörtliche Wendung „ihre Nägel machen“ ist idiomatisch und in ihrer genauen Bedeutung umstritten. „Ihre Nägel kürzen“ ist eine verbreitete, im Zusammenhang plausible Deutung; die andere Hauptdeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Mehrdeutigkeit von וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Die Frau soll ihre Nägel kürzen.
  alternative: Die Frau soll ihre Nägel wachsen lassen.
  rationale: Der hebräische Wortlaut sagt wörtlich nur, sie solle „ihre Nägel machen/zurichten“, und legt die konkrete Handlung nicht eindeutig fest. Für einen verständlichen Haupttext wird „kürzen“ gewählt, während die echte textliche Mehrdeutigkeit durch die Fußnote ausdrücklich erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular, entsprechend der hebräischen Rechtsrede. Die Formulierung ist bewusst klar und knapp; die strittige Nagelhandlung wird nicht im Haupttext übererklärt, sondern in einer unmittelbar zugeordneten Fußnote offengelegt.
