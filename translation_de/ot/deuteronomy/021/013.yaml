  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: de
  text: Sie soll die Kleidung ihrer Gefangenschaft ablegen[a] und in deinem Haus bleiben. Einen vollen Monat lang soll sie um ihren Vater und ihre Mutter weinen. Danach darfst du zu ihr eingehen und ihr Ehemann werden, und sie soll deine Frau sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Gewand ihrer Gefangenschaft«; möglicherweise auch: »die Kleidung, die sie bei ihrer Gefangennahme trug«.'
    reason: Die hebräische Genitivverbindung kann die Kleidung ihres Gefangenenstatus oder die bei der Gefangennahme getragene Kleidung meinen.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: Sie soll ... ablegen
  rationale: Das Hifil von סור bezeichnet hier das Entfernen; bei Kleidung ist „ablegen“ im Deutschen natürlich und genau.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: die Kleidung ihrer Gefangenschaft
  rationale: Die Formulierung bewahrt die mehrdeutige hebräische Genitivverbindung, die Kleidung ihres Gefangenenstatus oder die bei der Gefangennahme getragene Kleidung bezeichnen kann.
- source_word: מֵעָלֶיהָ
  choice: ablegen
  rationale: Das wörtliche „von auf ihr“ ist im deutschen Verb „ablegen“ bereits enthalten und muss nicht umständlich wiederholt werden.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: und in deinem Haus bleiben
  rationale: ישב kann sitzen, wohnen oder bleiben bedeuten; „bleiben“ gibt den geregelten Aufenthalt in diesem Zusammenhang natürlich wieder.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: soll sie um ihren Vater und ihre Mutter weinen
  rationale: בכה bedeutet zunächst „weinen“; die Verbindung mit „um“ bringt im Deutschen den Trauerbezug zum Ausdruck, ohne das konkrete Weinen zu verallgemeinern.
- source_word: יֶרַח יָמִים
  choice: einen vollen Monat lang
  rationale: Die Wendung lautet wörtlich „einen Monat von Tagen“ und bezeichnet idiomatisch einen ganzen beziehungsweise vollen Monat.
- source_word: וְאַחַר כֵּן
  choice: Danach
  rationale: Gibt die zeitliche Abfolge knapp und eindeutig wieder.
- source_word: תָּבֹא אֵלֶיהָ
  choice: darfst du zu ihr eingehen
  rationale: „Zu ihr eingehen“ bewahrt den sexuellen Idiomcharakter des Hebräischen; „darfst“ gibt im gesetzlichen Zusammenhang die Erlaubnis nach Ablauf der Frist wieder.
- source_word: וּבְעַלְתָּהּ
  choice: und ihr Ehemann werden
  rationale: Das Verb bezeichnet hier das Eintreten in die Stellung des Ehemanns. Diese Wiedergabe vermeidet sowohl eine bloße Besitzbedeutung als auch die Einebnung mit dem vorhergehenden sexuellen Ausdruck.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: und sie soll deine Frau sein
  rationale: Entspricht der üblichen hebräischen Eheformel und bewahrt den resultierenden rechtlichen Status.
theological_decisions:
- issue: Sexuelle und eheliche Sprache in einem schwierigen Gesetz über eine gefangene Frau
  choice: Den sexuellen Ausdruck „zu ihr eingehen“ und die davon unterschiedene eheliche Stellung ausdrücklich beibehalten.
  alternative: Beides zusammenfassend mit „sie heiraten“ wiedergeben oder den ersten Ausdruck explizit als „Geschlechtsverkehr mit ihr haben“ formulieren.
  rationale: Der hebräische Text unterscheidet zwischen dem Eingehen zu ihr, dem Eintreten in die Stellung des Ehemanns und ihrem Status als Frau. Die Übersetzung bewahrt diese Spannung, ohne den Text romantisierend abzuschwächen oder über seinen Wortlaut hinaus zu verschärfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtssprache bleibt klar; „zu ihr eingehen“ ist bewusst als verständlicher biblischer Sexualidiom erhalten. Der einzige Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
