  text: וְ/עָנ֖וּ וְ/אָמְר֑וּ יָדֵ֗י/נוּ לֹ֤א שפכה אֶת הַ/דָּ֣ם הַ/זֶּ֔ה וְ/עֵינֵ֖י/נוּ לֹ֥א רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: de
  text: 'Dann sollen sie antworten und sagen: »Unsere Hände haben dieses Blut nicht vergossen, und unsere Augen haben es nicht gesehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Dann sollen sie antworten und sagen
  rationale: Die feste hebräische Wendung bezeichnet eine förmliche öffentliche Erklärung. »Dann« gibt den Ablauf des vorgeschriebenen Verfahrens natürlich wieder, ohne die beiden Verben zusammenzuziehen.
- source_word: יָדֵינוּ
  choice: Unsere Hände
  rationale: Die konkrete Körperteilsprache bleibt erhalten; »Hände« bezeichnet hier die unmittelbare Täterschaft beziehungsweise Verantwortung.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: haben dieses Blut nicht vergossen
  rationale: »Blut vergießen« ist die entsprechende deutsche Wendung und bewahrt zugleich das konkrete hebräische »dieses Blut«. Das Perfekt passt im Deutschen zur Erklärung über die vorausgegangene Tat.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: und unsere Augen haben es nicht gesehen
  rationale: Die anschauliche Rede von den Augen wird beibehalten. Das ergänzte »es« verweist auf die Tat beziehungsweise das Blutvergießen und macht den deutschen Satz vollständig.
theological_decisions:
- issue: Umfang der Unschulds- und Unkenntniserklärung
  choice: Konkrete Körperteilsprache bewahren
  alternative: »Wir haben ihn nicht getötet und die Tat nicht beobachtet.«
  rationale: Der hebräische Text unterscheidet zwischen fehlender unmittelbarer Verantwortung (»unsere Hände«) und fehlender Augenzeugenschaft (»unsere Augen«). Eine abstraktere Wiedergabe würde diese rechtlich bedeutsame Spannung stärker auslegen als übersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem formellen Charakter einer vorgeschriebenen Rechtserklärung. Die konkrete Körperteilsprache des Hebräischen wird bewahrt.
