  source_fidelity: 'Der deutsche Haupttext gibt die hebräische Abfolge und die konkreten Ausdrücke korrekt wieder: וְעָנוּ וְאָמְרוּ als förmliches „antworten und sagen“, „unsere Hände“, „dieses Blut“ und „unsere Augen“. Das deutsche Perfekt ist für die rückblickende Unschuldsbeteuerung idiomatisch. Das ergänzte „es“ bei „haben es nicht gesehen“ ist im Deutschen erforderlich und kann sich, wie im Kontext, auf den vorliegenden Fall bzw. das Blutvergießen beziehen.'
