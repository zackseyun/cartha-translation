base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: de
  text: Sein Leichnam darf nicht über Nacht an dem Baum bleiben, sondern du sollst ihn noch am selben Tag begraben; denn ein Gehängter steht unter Gottes Fluch.[a] Du sollst dein Land nicht verunreinigen, das Jahwe, dein Gott, dir als Erbbesitz gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn der Gehängte ist von Gott verflucht“; möglicherweise auch: „denn das Aufhängen ist ein Frevel gegen Gott“. Die knappe hebräische Wendung lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: darf nicht über Nacht bleiben
  rationale: Das Verb bezeichnet hier das Verbleiben über Nacht. Die deutsche Formulierung gibt das Verbot natürlich und mit seiner zeitlichen Aussage wieder.
- source_word: נִבְלָתוֹ
  choice: sein Leichnam
  rationale: נְבֵלָה bezeichnet den toten Körper. „Leichnam“ ist im Deutschen präzise und dem würdigen Gesetzesstil angemessen.
- source_word: עַל הָעֵץ
  choice: am Holz
  rationale: עֵץ kann „Baum“ oder „Holz“ bedeuten. Im Zusammenhang einer Hinrichtung beziehungsweise öffentlichen Aufhängung bezeichnet „am Holz“ natürlich den hölzernen Träger, ohne dessen genaue Form festzulegen.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: du sollst ihn … begraben
  rationale: Infinitivus absolutus und finites Verb verstärken das Gebot. Im Deutschen vermittelt „sollst“ zusammen mit „noch am selben Tag“ dessen verbindlichen und nachdrücklichen Charakter, ohne die unnatürliche Wendung „gewiss begraben“.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Formulierung macht idiomatisch deutlich, dass die Bestattung vor dem Ende dieses Tages erfolgen muss.
- source_word: קִלְלַת אֱלֹהִים
  choice: Gottes Fluch
  rationale: Die knappe Genitivverbindung wird in der Hauptlesart als göttlicher Fluch verstanden. Wegen ihrer Mehrdeutigkeit werden weitere mögliche Deutungen in der Fußnote bewahrt.
- source_word: תָּלוּי
  choice: ein Gehängter
  rationale: Das passive Partizip bezeichnet den aufgehängten Menschen. „Ein Gehängter“ bleibt knapp und entspricht der substantivischen Funktion.
- source_word: תְטַמֵּא
  choice: verunreinigen
  rationale: Das Verb umfasst kultische und moralische Verunreinigung. „Verunreinigen“ bewahrt diese Bedeutungsbreite.
- source_word: אַדְמָתְךָ
  choice: dein Land
  rationale: Im Zusammenhang des von Gott verliehenen Erbbesitzes ist „Land“ die natürliche kontextuelle Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: Das Wort bezeichnet einen durch Zuteilung beziehungsweise Erbe bleibend übertragenen Besitz. „Erbbesitz“ ist prägnant und bewahrt den Bundes- und Landkontext.
theological_decisions:
- issue: Bedeutung von כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: ein Gehängter steht unter Gottes Fluch
  alternative: 'Der Gehängte ist von Gott verflucht; oder: Das Aufhängen ist ein Frevel gegen Gott.'
  rationale: Die hebräische Aussage ist stark verdichtet und lässt unterschiedliche syntaktische beziehungsweise genitivische Deutungen zu. Die Hauptfassung versteht den Gehängten als unter göttlichem Fluch stehend, legt die Wendung aber nicht durch „von Gott verflucht“ eindeutig auf Gott als unmittelbar handelnden Urheber fest. Die anderen ernsthaften Deutungen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger deutscher Gesetzesstil mit direkter Anrede im Singular. Die Satzglieder folgen weitgehend der hebräischen Abfolge, werden jedoch idiomatisch verbunden. „Am Holz“ bewahrt die Bedeutungsbreite von עֵץ im Hinrichtungskontext; „Jahwe“ gibt den Gottesnamen ausdrücklich wieder.
