  naturalness: Der Gesetzesstil ist klar, würdig und modern. „Sein Leichnam“, „noch am selben Tag“ und „Erbbesitz“ sind idiomatisch. „An dem Baum“ ist in diesem Kontext ebenso natürlich und präziser als „am Holz“.
  terminology: „Jahwe“, „Leichnam“, „verunreinigen“ und „Erbbesitz“ sind angemessen. Die Hauptwiedergabe „steht unter Gottes Fluch“ wahrt bei der knappen, strittigen Verbindung קִלְלַת אֱלֹהִים die gebotene Zurückhaltung; die Fußnote dokumentiert tragfähige Alternativen.
