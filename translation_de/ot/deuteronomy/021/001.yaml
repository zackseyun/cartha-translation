revisions:
- from: Wenn in dem Land, das Yahweh, dein Gott, dir zum Besitz gibt, ein Erschlagener gefunden wird, der auf freiem Feld liegt, und nicht bekannt ist, wer ihn erschlagen hat,
  to: Wenn in dem Land, das Yahweh, dein Gott, dir zum Besitz gibt, ein Erschlagener gefunden wird, der im Feld liegt, und nicht bekannt ist, wer ihn geschlagen hat,
  rationale: 'Die Revision beschränkt sich auf zwei sichere Präzisierungen: „im Feld“ folgt dem unmarkierten räumlichen Ausdruck בַּשָּׂדֶה, und „geschlagen hat“ bewahrt die Wortwahl von הִכָּהוּ, ohne die bereits durch „Erschlagener“ ausgedrückte Todesfolge zu verdoppeln. Die Konditionalform, der maskuline Singular, der Gottesname und das abschließende Komma bleiben erhalten.'
