  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: de
  text: Wenn in dem Land, das Yahweh, dein Gott, dir zum Besitz gibt, ein Erschlagener gefunden wird, der im Feld liegt, und nicht bekannt ist, wer ihn geschlagen hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Fall einer kasuistischen Rechtsbestimmung ein; „wenn“ ist im Deutschen dafür die natürliche Form.
- source_word: יִמָּצֵא
  choice: gefunden wird
  rationale: Gibt den Niphal von מצא unmittelbar und idiomatisch als Passiv wieder.
- source_word: חָלָל
  choice: ein Erschlagener
  rationale: Bezeichnet hier einen gewaltsam getöteten Menschen und wahrt zugleich die grammatisch maskuline Singularform, ohne lediglich „Leiche“ zu sagen.
- source_word: בָּאֲדָמָה
  choice: in dem Land
  rationale: Die folgende Relativkonstruktion zeigt, dass das Israel zum Besitz gegebene Gebiet gemeint ist, nicht bloß Erdboden.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: das Yahweh, dein Gott, dir zum Besitz gibt
  rationale: Bewahrt den Gottesnamen und gibt die fortdauernde Gabe des Landes sowie לְרִשְׁתָּהּ in natürlichem modernem Deutsch wieder.
- source_word: נֹפֵל
  choice: liegt
  rationale: Das Partizip beschreibt hier den vorgefundenen Zustand des Erschlagenen; „liegt“ ist im Deutschen natürlicher als das wörtliche „gefallen ist“.
- source_word: בַּשָּׂדֶה
  choice: auf freiem Feld
  rationale: Gibt den räumlichen Sinn idiomatisch wieder und bezeichnet ein Gebiet außerhalb einer Siedlung.
- source_word: לֹא נוֹדַע
  choice: nicht bekannt ist
  rationale: Entspricht der unpersönlichen passivischen Aussage des Niphal.
- source_word: מִי הִכָּהוּ
  choice: wer ihn erschlagen hat
  rationale: Im Deutschen bezeichnet „schlagen“ allein nicht eindeutig die tödliche Handlung. „Erschlagen“ macht im gegebenen Tötungskontext die Bedeutung klar, wiederholt jedoch bewusst den Wortstamm nicht aus dem Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Yahweh“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlecht und Referenz von חָלָל
  choice: ein Erschlagener
  alternative: ein erschlagener Mensch; eine erschlagene Person
  rationale: Die substantivierte Form ist im Hebräischen maskulin Singular. Die deutsche Wiedergabe bewahrt diese Form und bezeichnet zugleich sachgerecht ein Opfer gewaltsamer Tötung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in konditionalem Rechtsstil. Die direkte Anrede steht entsprechend dem hebräischen Singular („dein“, „dir“). Der Satz bleibt wegen der Fortsetzung der Rechtsbestimmung mit einem Komma offen.
