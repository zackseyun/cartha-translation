  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: de
  text: Dann sollen deine Ältesten und deine Richter hinausgehen und die Entfernungen zu den Städten messen, die rings um den Erschlagenen liegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Dann sollen ... hinausgehen
  rationale: Das Waw mit der Verbform führt das vorgeschriebene Verfahren fort. „Dann“ gibt die Abfolge im modernen Deutschen natürlich wieder; „hinausgehen“ bewahrt die konkrete Handlung.
- source_word: זְקֵנֶיךָ
  choice: deine Ältesten
  rationale: Die direkte Wiedergabe erhält das Suffix der zweiten Person Singular und die an Israel als Gemeinschaft gerichtete Anrede.
- source_word: וְשֹׁפְטֶיךָ
  choice: und deine Richter
  rationale: Der Ausdruck bezeichnet Personen mit richterlicher Vollmacht; „Richter“ ist im rechtlichen Zusammenhang präzise und geläufig.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: und die Entfernungen zu den Städten messen
  rationale: Das Verb bedeutet „messen“, und אֶל bezeichnet die Städte als Zielpunkte. Im Deutschen muss der Gegenstand der Messung idiomatisch ausgedrückt werden; der Plural „Entfernungen“ verdeutlicht, dass zu mehreren umliegenden Städten gemessen wird.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: die rings um ... liegen
  rationale: Die Relativkonstruktion bezeichnet die umliegenden Städte. Diese Formulierung ist natürlich, klar und bewahrt die räumliche Aussage.
- source_word: הֶחָלָל
  choice: den Erschlagenen
  rationale: חָלָל bezeichnet einen gewaltsam Getöteten. „Der Erschlagene“ bewahrt diesen Sinn, ohne mit „Ermordeter“ eine rechtliche Bewertung vorwegzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-prozeduralem Ton. Die kollektive Anrede im Singular („deine“) bleibt erhalten. Keine Fußnote ist nötig, da „der Erschlagene“ die substantivierte und hinsichtlich des Geschlechts passende hebräische Form direkt wiedergibt.
