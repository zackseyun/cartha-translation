  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: de
  text: Und alle Ältesten der Stadt, die dem Erschlagenen[a] am nächsten liegt, sollen ihre Hände über der jungen Kuh waschen, der im Bachtal[b] das Genick gebrochen wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Leichnam“. Das hebräische Wort kann sowohl einen erschlagenen Menschen als auch dessen Leichnam bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Bachbett“, „im Tal“ beziehungsweise „im Wadi“. Das hebräische Wort bezeichnet ein Tal oder eine Schlucht, die mit einem Wasserlauf verbunden ist und zeitweise trocken sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Und alle
  rationale: Die Wendung führt die Verfahrensanweisung fort und schließt sämtliche Ältesten der betreffenden Stadt ein.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: die Ältesten jener Stadt
  rationale: זִקְנֵי bezeichnet die maßgeblichen Ältesten beziehungsweise kommunalen Vertreter; „jener Stadt“ bewahrt den bestimmten Rückverweis.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: die dem Erschlagenen am nächsten sind
  rationale: Die Formulierung gibt die räumliche Nähe wieder. „Der Erschlagene“ bewahrt sowohl den Personenbezug als auch den gewaltsamen Todeskontext, ohne חָלָל lediglich als einen beliebigen Toten zu verstehen.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: sollen ihre Hände waschen
  rationale: Der Imperfekt hat hier in einer Rechtsanweisung vorschreibende Kraft; „sollen“ klingt im modernen Deutschen natürlich und verbindlich.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier am ehesten die rituelle Position der Hände beziehungsweise des Waschens über dem Tier.
- source_word: הָעֶגְלָה
  choice: die junge Kuh
  rationale: עֶגְלָה bezeichnet ein junges weibliches Rind. „Junge Kuh“ ist allgemein verständlicher als der fachsprachliche Ausdruck „Färse“.
- source_word: הָעֲרוּפָה
  choice: der ... das Genick gebrochen wurde
  rationale: Die passive Form von ערף bezeichnet in diesem Ritual das Brechen des Genicks; die Wiedergabe vermeidet die möglicherweise irreführende Vorstellung einer Enthauptung.
- source_word: בַנָּחַל
  choice: im Bachtal
  rationale: נַחַל kann ein von einem Wasserlauf geprägtes Tal, ein Bachbett oder ein Wadi bezeichnen. „Bachtal“ hält Tal- und Wasserlaufbezug zusammen; die Alternativen werden in der Fußnote genannt.
