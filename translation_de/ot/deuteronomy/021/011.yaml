  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: de
  text: und du unter den Gefangenen eine Frau von schöner Gestalt[a] siehst, sie begehrst und sie dir zur Frau nimmst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Frau von schönem Aussehen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »sie dir zur Frau nehmen«; eine Wendung für die Eheschließung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רָאִיתָ
  choice: und du … siehst
  rationale: Das Qal Perfekt 2. Person Singular steht in der Folge des vorausgehenden Rechtsfalls und hat hier bedingte beziehungsweise zeitliche Funktion. Das Präsens fügt sich natürlich in den deutschen Satzbau ein.
- source_word: בַּ/שִּׁבְיָה
  choice: unter den Gefangenen
  rationale: Das Substantiv bezeichnet hier die Gesamtheit der im Krieg Gefangengenommenen. „Unter den Gefangenen“ gibt Präposition und bestimmten Artikel idiomatisch wieder, ohne das deutendere „Kriegsgefangenen“ einzuführen.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: eine Frau von schöner Gestalt
  rationale: Die Konstruktion bezeichnet eine Frau von schöner äußerer Form oder Erscheinung. „Von schöner Gestalt“ bewahrt den körperlich-visuellen Bezug und klingt zugleich natürlich und würdig.
- source_word: תֹּאַר
  choice: Gestalt
  rationale: Das Wort bezeichnet die äußere Form oder Erscheinung. „Gestalt“ entspricht der konkreten Bedeutung; „Aussehen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: וְ/חָשַׁקְתָּ בָהּ
  choice: sie begehrst
  rationale: Das Verb drückt starkes Verlangen oder eine intensive Hinwendung aus. „Begehren“ erhält diese Kraft, ohne sie zum bloßen Gefallen oder zur bloßen Anziehung abzuschwächen.
- source_word: וְ/לָקַחְתָּ לְ/ךָ לְ/אִשָּׁה
  choice: sie dir zur Frau nimmst
  rationale: Die hebräische Wendung lautet wörtlich „sie dir zur Frau nehmen“ und ist eine feste Ausdrucksweise für die Eheschließung. Die gewählte Form bewahrt sowohl das Idiom als auch den reflexiven Bezug von לְךָ.
theological_decisions:
- issue: Wiedergabe eines ethisch schwierigen Kriegsgesetzes, ohne es zu beschönigen oder eine im Vers nicht ausgesprochene Wertung einzutragen
  choice: Die nüchterne rechtliche Beschreibung von Begehren und Zur-Frau-Nehmen bleibt erhalten.
  alternative: Die Aussage zu „sie gefällt dir und du möchtest sie heiraten“ abzumildern oder ausdrücklich Zwang beziehungsweise Billigung hinzuzufügen.
  rationale: Der hebräische Text beschreibt die Situation direkt, ohne in diesem Vers eine ausdrückliche ethische Bewertung zu geben. Die Übersetzung soll weder die Spannung durch weichere Sprache beseitigen noch zusätzliche Wertungen eintragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Rechtsstil. Die Satzfolge bleibt wegen des Zusammenhangs als Fortsetzung mit „und“ offen; die körperliche Dimension von תֹּאַר sowie die Direktheit von חָשַׁק werden nicht abgeschwächt.
