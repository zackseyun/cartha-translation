  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: de
  text: Und an dem Tag, an dem er seinen Söhnen das, was ihm gehört, als Erbe zuteilt, darf er nicht den Sohn der geliebten Frau dem Sohn der gehassten Frau[a], der der Erstgeborene ist, gegenüber als Erstgeborenen behandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ungeliebten Frau“; oder: „der weniger geliebten Frau“. Das Hebräische stellt wörtlich „geliebt“ und „gehasst“ gegenüber; in familiären Rechtszusammenhängen kann „gehasst“ jedoch auch bedeuten, dass jemand vergleichsweise weniger geliebt oder weniger begünstigt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und
  rationale: Leitet zusammen mit dem folgenden Zeitausdruck den nächsten Rechtsfall ein; die knappe Verbindung ist im Deutschen natürlich.
- source_word: בְּיוֹם
  choice: an dem Tag, an dem
  rationale: Bewahrt die wörtliche zeitliche Rahmung des Hebräischen und ergibt zugleich einen verständlichen deutschen Rechtssatz.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: er seinen Söhnen das, was ihm gehört, als Erbe zuteilt
  rationale: Die Hifil-Form von נחל bezeichnet das Zuweisen eines Erbes. Die Formulierung hält sowohl die Söhne als Empfänger als auch den Besitz des Vaters als Gegenstand ausdrücklich fest.
- source_word: לֹא יוּכַל
  choice: darf er ... nicht
  rationale: Im Rechtskontext geht es um fehlende rechtliche Befugnis beziehungsweise ein Verbot, nicht um körperliche Unfähigkeit.
- source_word: לְבַכֵּר
  choice: als Erstgeborenen behandeln
  rationale: Die Piel-Form bezeichnet hier, einem Sohn den rechtlichen Rang beziehungsweise die Stellung des Erstgeborenen zuzuerkennen, ohne die Folgeregel aus Vers 17 vorwegzunehmen.
- source_word: בֶּן הָאֲהוּבָה
  choice: den Sohn der geliebten Frau
  rationale: Das Partizip bedeutet wörtlich „die Geliebte“. „Frau“ wird aufgrund des unmittelbaren Zusammenhangs mit den zwei Ehefrauen ergänzt.
- source_word: עַל פְּנֵי
  choice: dem ... gegenüber
  rationale: Die Wendung bezeichnet hier Vorrang oder Bevorzugung. Die deutsche Formulierung fügt sich natürlich in „als Erstgeborenen behandeln“ ein.
- source_word: בֶן הַשְּׂנוּאָה
  choice: dem Sohn der gehassten Frau
  rationale: Das hebräische Partizip bedeutet wörtlich „gehasst“ und bildet einen starken Gegensatz zu „geliebt“. Mögliche vergleichende Abschwächungen werden in der Fußnote bewahrt.
- source_word: הַבְּכֹר
  choice: denn dieser ist der Erstgeborene
  rationale: Der abschließende Ausdruck kennzeichnet den Sohn der gehassten Frau als den tatsächlichen Erstgeborenen. „Dieser“ macht den Bezug im Deutschen eindeutig; „denn“ bringt die begründende Funktion der nachgestellten Apposition natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Beziehungsgegensatzes im Recht einer Familie mit zwei Frauen
  choice: „geliebte Frau“ und „gehasste Frau“ im Haupttext
  alternative: „geliebte Frau“ und „ungeliebte“ beziehungsweise „weniger geliebte Frau“
  rationale: Der hebräische Text verwendet ein starkes Gegensatzpaar, das nicht stillschweigend abgeschwächt werden sollte. Da שׂנא in familiären Vergleichskontexten jedoch auch geringere Zuneigung oder Zurücksetzung bezeichnen kann, werden diese Möglichkeiten in einer Fußnote genannt.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit klarer rechtlicher Aussage. Die Satzstruktur bewahrt die zeitliche Rahmung und die ausdrückliche Bezeichnung des väterlichen Besitzes, vermeidet jedoch unnatürliche Nachbildung der hebräischen Syntax.
