  naturalness: Der Satz ist insgesamt klar und würdevoll. Mit „ergreifen“ sowie „und zum Tor“ ist er idiomatisch und bildet die parallele hebräische Satzstruktur besser ab.
  terminology: „Älteste“ ist für זִקְנֵי im lokalen Rechtskontext angemessen. „Tor seines Ortes“ bewahrt die offenere Formulierung von מָקוֹם; die Erläuterung zum Stadttor gehört in eine Kulturfußnote.
