  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: de
  text: Dann sollen sein Vater und seine Mutter ihn ergreifen und ihn zu den Ältesten seiner Stadt und zum Tor seines Ortes hinausführen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war der öffentliche Ort, an dem die örtlichen Ältesten Rechtsfälle verhandelten.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zum Tor seines Wohnorts«; möglicherweise auch: »zum Tor seiner Stadt«. Hebräisch: »zum Tor seines Ortes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: ihn festhalten
  rationale: תפשׂ mit ב bezeichnet ein körperliches Ergreifen. »Festhalten« vermittelt hier natürlichen modernen Sprachgebrauch und den nötigen Zwang, ohne übermäßig gewaltsam zu klingen.
- source_word: אָבִיו וְאִמּוֹ
  choice: sein Vater und seine Mutter
  rationale: Die getrennten Possessivformen des Hebräischen werden beibehalten; zugleich wird betont, dass beide Eltern gemeinsam handeln.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: ihn … hinausführen
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszubringen oder hinauszuführen. »Hinausführen« beschreibt passend die Bewegung zum öffentlichen Rechtsort.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: zu den Ältesten seiner Stadt
  rationale: Die Wendung bezeichnet die örtlichen Führungspersonen beziehungsweise Rechtsprechenden und folgt eng der hebräischen Struktur.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: zum Tor seines Wohnorts
  rationale: שׁער ist hier das Stadttor als öffentlicher Rechtsort. מקום heißt wörtlich »Ort«; »Wohnort« macht den lokalen Bezug im Deutschen verständlich, ohne ausdrücklich »Stadt« zu wiederholen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Rechtssprache. Die Satzfolge bleibt eng am Hebräischen; »Wohnort« vermeidet das im Deutschen missverständliche »sein Ort«, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
