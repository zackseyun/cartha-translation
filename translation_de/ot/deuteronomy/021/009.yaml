  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: de
  text: So sollst du das unschuldige Blut aus deiner Mitte wegschaffen[a], denn du sollst tun, was in den Augen Jahwes recht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das unschuldige Blut aus deiner Mitte wegschaffen“; auch: „das Blut eines Unschuldigen“. Die Wendung kann im Zusammenhang die Verantwortung der Gemeinschaft für ungesühntes Blutvergießen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: So sollst du
  rationale: Die Konjunktion mit dem selbstständigen Pronomen leitet betont die Folgerung aus dem vorangehenden Verfahren ein; im Deutschen gibt „So sollst du“ diesen Zusammenhang natürlich wieder.
- source_word: תְּבַעֵר
  choice: wegschaffen
  rationale: Das Piel von בער bezeichnet in deuteronomischen Rechtstexten das Beseitigen eines Übels oder einer belastenden Schuld aus der Gemeinschaft. „Wegschaffen“ ist verständlich und bewahrt den gerichtlichen Nachdruck.
- source_word: הַדָּם הַנָּקִי
  choice: die Schuld für das unschuldig vergossene Blut
  rationale: Wörtlich steht „das unschuldige Blut“. Im Zusammenhang geht es nicht darum, Blut als Stoff zu entfernen, sondern die durch den ungesühnten Mord entstandene gemeinschaftliche Blutschuld zu beseitigen. Die Wiedergabe macht die hebräische Rechtsmetapher verständlich; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die feste deuteronomische Wendung bezeichnet das Entfernen aus dem Bereich der als Einheit angesprochenen Gemeinschaft.
- source_word: כִּי
  choice: indem
  rationale: כִּי kann hier die Art und Weise beziehungsweise das Mittel bezeichnen, durch das die Blutschuld beseitigt wird. „Indem“ bildet den Zusammenhang mit der Befolgung des vorgeschriebenen Rituals schlüssig ab, ohne eine bloß zeitliche Lesart zu wählen.
- source_word: תַעֲשֶׂה הַיָּשָׁר
  choice: du tust, was … recht ist
  rationale: Das substantivierte Adjektiv הַיָּשָׁר bedeutet „das Rechte“ beziehungsweise „was recht ist“; das Imperfekt hat im gesetzlichen Kontext verpflichtenden Sinn.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher für Gottes Beurteilung bleibt transparent erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „unschuldigem Blut“ für die Gemeinschaft
  choice: Die Wendung wird im Haupttext als Schuld wegen unschuldig vergossenen Blutes verdeutlicht.
  alternative: „das unschuldige Blut“ oder „das Blut des Unschuldigen“
  rationale: Der Zusammenhang von Deuteronomium 21,1–9 handelt von der Verantwortung der Gemeinschaft für einen ungeklärten Mord und von der Abwendung der Blutschuld. Die Fußnote bewahrt zugleich die konkrete Bildsprache und die mögliche persönlichere Beziehung auf das Opfer.
- issue: Verknüpfung durch כִּי
  choice: 'instrumental-modal: „indem“'
  alternative: 'kausal: „denn/weil“ oder temporal-konditional: „wenn“'
  rationale: 'Die Aussage beschreibt plausibel, wie Israel die Blutschuld beseitigt: durch das Tun dessen, was Jahwe als recht ansieht, nämlich durch die zuvor angeordnete Handlung. Die hebräische Konjunktion lässt jedoch auch eine begründende Nuance zu.'
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular, entsprechend dem Hebräischen. Die Rechtsmetapher wird im Haupttext behutsam verdeutlicht und in der Fußnote wörtlicher dokumentiert.
