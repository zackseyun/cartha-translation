  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: de
  text: Und wenn bei einem Mann ein todeswürdiges Vergehen vorliegt[a] und er getötet wird und du ihn an einen Baum hängst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Vergehen, auf das die Todesstrafe steht«; wörtlich etwa: »ein Vergehen des Todesurteils«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »an einen Pfahl«. Das hebräische Wort lautet wörtlich »Baum« und kann auch »Holz« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִּי
  choice: Und wenn
  rationale: Gibt sowohl die Verknüpfung durch וְ als auch die bedingte Einleitung כִּי in natürlichem deutschem Rechtsstil wieder.
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: ein Mann eine Sünde begangen hat
  rationale: Die wörtliche hebräische Wendung lautet sinngemäß »wenn an/in einem Mann eine Sünde ist«. Die deutsche Fassung macht den gemeinten Sachverhalt verständlich, ohne חֵטְא auf ein rein weltliches Verbrechen zu verengen.
- source_word: מִשְׁפַּט מָוֶת
  choice: die den Tod verdient
  rationale: Die knappe Wendung bedeutet wörtlich etwa »ein Urteil/Rechtsspruch des Todes« und kann sowohl die Todeswürdigkeit als auch ein Todesurteil bezeichnen. Die gewählte Formulierung ist verständlich und lässt die juristische Grundbedeutung in der Fußnote erkennen.
- source_word: וְ/הוּמָת
  choice: und er wird getötet
  rationale: Der Hophal von מות bezeichnet passiv, dass der Mann zu Tode gebracht wird. »Getötet« bewahrt die sprachliche Breite besser als das spezifischere »hingerichtet«.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: und du hängst ihn
  rationale: תלה bedeutet »hängen/aufhängen«. Das Singularpronomen »du« entspricht der Anredeform des Hebräischen.
- source_word: עַל עֵץ
  choice: an einen Baum
  rationale: עֵץ bezeichnet einen Baum oder Holz. »An einen Baum« ist im Deutschen idiomatisch und bewahrt die konkrete, später intertextuell bedeutsame Bildsprache; »Pfahl« wäre enger als der Ausgangstext.
theological_decisions:
- issue: Geschlecht des Rechtssubjekts
  choice: ein Mann
  alternative: jemand; eine Person
  rationale: אִישׁ bezeichnet hier ausdrücklich einen männlichen Einzelnen. Die Übersetzung bewahrt diese grammatisch und semantisch markierte Form.
- issue: Bedeutung von מִשְׁפַּט מָוֶת
  choice: die den Tod verdient
  alternative: auf die der Tod steht; für die er zum Tod verurteilt ist
  rationale: Die Formulierung wahrt die Spannung zwischen der Todeswürdigkeit des Vergehens und einem richterlichen Todesurteil, statt den Ausdruck ausschließlich auf eine Verfahrensstufe festzulegen.
- issue: Wiedergabe von עַל עֵץ
  choice: an einen Baum
  alternative: an einen Pfahl; an Holz
  rationale: Die Übersetzung bleibt nahe am gewöhnlichen Sinn von עֵץ und legt die genaue Form der Aufhängung nicht enger fest, als es der hebräische Text tut.
translation_notes:
  register: Moderner, würdevoller deutscher Rechtsstil. Der Vers bleibt als bedingter Satz offen, da die Anweisung im folgenden Vers fortgesetzt wird. Die maskuline Einzelform und die singularische Anrede werden beibehalten.
