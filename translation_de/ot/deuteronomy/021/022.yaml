  source_fidelity: 'Die Grundstruktur des hebräischen Konditionals sowie die passive Tötung und das Aufhängen an einem Baum sind zutreffend wiedergegeben. »Ein Mann eine Sünde begangen hat« geht jedoch über יִהְיֶה בְאִישׁ חֵטְא hinaus: Der Text formuliert zunächst das Vorliegen eines todeswürdigen Delikts bei einem Mann, nicht ausdrücklich dessen Begehung in dieser Verbform. »Vergehen« gibt חֵטְא im Rechtskontext angemessen wieder, ohne die moralische Dimension auszuschließen.'
  naturalness: Die vorgeschlagene Fassung ist modernes, klares Standarddeutsch und behält den bewusst offenen Satzanschluss zum folgenden Vers bei. »Bei einem Mann ... vorliegt« ist in juristisch geprägtem Deutsch natürlich und bildet die hebräische Existenzkonstruktion genauer ab.
  terminology: »Todeswürdiges Vergehen« gibt מִשְׁפַּט מָוֶת idiomatisch wieder, ohne zwischen Todeswürdigkeit und einem bereits ergangenen Todesurteil unangemessen zu entscheiden. »Baum« bewahrt den gewöhnlichen Sinn von עֵץ; die Fußnote nennt »Pfahl« nur als mögliche, engere Alternative.
