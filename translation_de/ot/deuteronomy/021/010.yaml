base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: de
  text: Wenn du gegen deine Feinde in den Krieg ziehst und Jahwe, dein Gott, sie in deine Hand gibt[a] und du Gefangene gefangen nimmst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihn/es in deine Hand gibt“. Das singularische Suffix bezieht sich wahrscheinlich kollektiv auf die feindliche Streitmacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und du seine Gefangenschaft/seine Gefangenen gefangen nimmst“. Im Hebräischen stehen ein Verb und ein stammverwandtes Substantiv; das singularische Suffix kann sich kollektiv auf die feindliche Streitmacht beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier den Fall einer kasuistischen Rechtsbestimmung ein. Im modernen deutschen Rechtssatz klingt „wenn“ natürlich und lässt den situationsbezogenen Charakter erkennen.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: du … in den Krieg ziehst
  rationale: Diese idiomatische Wendung bewahrt sowohl die Bewegung von יָצָא als auch den militärischen Sinn von מִלְחָמָה und ist im Deutschen geläufig.
- source_word: עַל אֹיְבֶיךָ
  choice: gegen deine Feinde
  rationale: עַל bezeichnet bei feindlicher Handlung die Ausrichtung „gegen“; der Plural und das Possessivsuffix werden direkt wiedergegeben.
- source_word: וּנְתָנוֹ
  choice: und … sie … gibt
  rationale: נתן wird grundsätzlich mit „geben“ wiedergegeben. Das maskuline Singularsuffix bezieht sich wahrscheinlich kollektiv auf die zuvor genannten Feinde; daher steht im deutschen Haupttext „sie“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die übliche Bundesformel mit dem Suffix der zweiten Person Singular wird unmittelbar und natürlich wiedergegeben.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die hebräische Bildsprache für die Übergabe in jemandes Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: und du Gefangene von ihnen machst
  rationale: Die Wiedergabe vermittelt den Sinn der figura etymologica aus dem Verb „gefangen nehmen“ und dem verwandten Substantiv „Gefangene/Beute“, ohne im Deutschen unnatürlich zu klingen. Das Suffix wird kollektiv auf die feindliche Gruppe bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Numerus beim Objekt von וּנְתָנוֹ und beim Suffix von שִׁבְיוֹ
  choice: kollektiver Bezug auf „deine Feinde“
  alternative: 'wörtlicher Singular: „ihn/es“ beziehungsweise „seine Gefangenen“'
  rationale: Die singularischen Suffixe stehen nach dem pluralischen אֹיְבֶיךָ und können die gegnerische Streitmacht kollektiv bezeichnen. Die deutsche Pluralwiedergabe macht diesen wahrscheinlichen Bezug verständlich, während die Fußnoten die formale Singularform offenlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen kasuistischen Rechtssatz; „in deine Hand geben“ bewahrt die verständliche Quellmetapher. Die Anrede ist wie im Hebräischen singularisch.
