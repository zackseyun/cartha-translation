base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: de
  text: Wenn ein Mann zwei Ehefrauen hat, die eine geliebt und die andere ungeliebt[a], und sowohl die geliebte als auch die ungeliebte ihm Söhne geboren haben und der erstgeborene Sohn der ungeliebten Frau gehört,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gehasst. Das hebräische Wort kann diese stärkere Bedeutung haben, bezeichnet hier aber wahrscheinlich die Frau, die im Gegensatz zur geliebten Frau nicht bevorzugt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Fall einer kasuistischen Rechtsbestimmung ein; „wenn“ entspricht dieser bedingten Funktion im Deutschen.
- source_word: תִהְיֶיןָ לְאִישׁ שְׁתֵּי נָשִׁים
  choice: ein Mann zwei Frauen hat
  rationale: Die hebräische Existenzkonstruktion wird idiomatisch mit „haben“ wiedergegeben; נָשִׁים bezeichnet hier aufgrund des ehe- und erbrechtlichen Zusammenhangs Ehefrauen. Im Deutschen ist „Frauen“ in dieser Konstruktion natürlich und eindeutig.
- source_word: הָאַחַת אֲהוּבָה
  choice: von denen er die eine liebt
  rationale: Gibt das passive אֲהוּבָה natürlich und unmittelbar als Beziehung des Mannes zu dieser Frau wieder, ohne es zum bloßen Bevorzugen abzuschwächen.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: und die andere nicht liebt
  rationale: שְׂנוּאָה kann wörtlich „gehasst“ bedeuten, bezeichnet in kontrastiven Familienzusammenhängen aber auch die nicht geliebte beziehungsweise zurückgesetzte Frau. Die Formulierung wahrt den Gegensatz und vermeidet eine unnötige Festlegung auf aktive Feindschaft.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: ihm Söhne geboren haben
  rationale: בָנִים wird geschlechtsgenau als „Söhne“ wiedergegeben; das Perfekt erscheint im deutschen Fallsatz natürlich als vollendete Handlung.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: sowohl die geliebte als auch die ungeliebte
  rationale: Die substantivierten Bezeichnungen beider Frauen und die Aussage, dass beide Söhne geboren haben, bleiben ausdrücklich erhalten.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר לַשְּׂנִיאָה
  choice: der erstgeborene Sohn aber von der ungeliebten Frau ist
  rationale: „Von der ... Frau“ drückt die mütterliche Zuordnung idiomatisch aus. „Aber“ macht den für den Rechtsfall entscheidenden Gegensatz verständlich, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bedeutung von שְׂנוּאָה im familienrechtlichen Kontext
  choice: nicht liebt / ungeliebt
  alternative: gehasst
  rationale: Das Lexem kann stärkeren Hass bezeichnen, doch der Gegensatz zur geliebten Frau kann hier auch unterschiedlichen ehelichen Status oder Zuneigung ausdrücken. Der Haupttext lässt die rechtlich relevante Benachteiligung erkennen; die Fußnote bewahrt die stärkere lexikalische Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Fallsatzstruktur. Der Vers bleibt als syntaktisch offener Vordersatz stehen, da die Rechtsfolge erst im folgenden Vers einsetzt.
