base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: de
  text: Dann sollen die Ältesten der Stadt, die dem Erschlagenen[a] am nächsten liegt, eine Färse[b] aus der Rinderherde nehmen, mit der noch keine Arbeit verrichtet worden ist und die noch nicht unter einem Joch gezogen hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „dem Getöteten“ oder „dem Leichnam“. Das hebräische Wort bezeichnet hier einen Menschen, der getötet worden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „eine junge Kuh“. Gemeint ist ein junges weibliches Rind aus der Rinderherde.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die nicht unter einem Joch gezogen hat“, also ein Tier, das zuvor nicht für Zugarbeiten eingesetzt worden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann soll … so vorgehen
  rationale: Gibt die hebräische erzählend-rechtliche Übergangsformel in natürlichem modernem Deutsch wieder und leitet den nächsten Verfahrensschritt ein.
- source_word: הָעִיר הַקְּרֹבָה
  choice: die Stadt, die … am nächsten liegt
  rationale: Bewahrt den im Zusammenhang vorausgesetzten Superlativ und klingt im Deutschen idiomatisch.
- source_word: אֶל הֶחָלָל
  choice: dem Erschlagenen
  rationale: חָלָל bezeichnet hier einen getöteten Menschen; „der Erschlagene“ erhält den persönlichen Bezug und passt zum ungeklärten Tötungsfall.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: Die Ältesten jener Stadt sollen … nehmen
  rationale: Bewahrt sowohl die rechtliche Anweisung als auch die Zuständigkeit der anerkannten Stadtältesten.
- source_word: עֶגְלַת בָּקָר
  choice: eine junge Kuh aus der Rinderherde
  rationale: עֶגְלָה ist ein junges weibliches Rind; בָּקָר wird durch die Herkunft aus der Rinderherde ausdrücklich wiedergegeben. „Junge Kuh“ ist allgemein verständlicher als „Färse“.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: mit der noch nicht gearbeitet worden ist
  rationale: Die passive Form von עבד bezeichnet Arbeit, die mithilfe des Tieres verrichtet wurde; die instrumentale Beziehung bleibt ausdrücklich erhalten.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: die noch nie in einem Joch gezogen hat
  rationale: משך bedeutet „ziehen“. Die Formulierung beschreibt ein Tier, das bislang nicht als Zugtier eingesetzt wurde, ohne den konkreten Bildgehalt aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem Hebräischen leicht gegliedert, um den rechtlichen Ablauf verständlich wiederzugeben. Fachsprachliches „Färse“ steht nur als Fußnotenalternative; im Haupttext wurde das allgemein verständliche „junge Kuh“ gewählt.
