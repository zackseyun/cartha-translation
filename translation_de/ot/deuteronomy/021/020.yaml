  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: de
  text: 'Dann sollen sie zu den Ältesten seiner Stadt sagen: »Unser Sohn hier ist widerspenstig und rebellisch. Er hört nicht auf unsere Stimme[a]; er ist ein Fresser und ein Säufer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er gehorcht uns nicht.« Wörtlich: »Er hört nicht auf unsere Stimme.« Die hebräische Wendung kann »hören« im Sinn von beachten oder gehorchen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Dann sollen sie … sagen
  rationale: Die Verbform mit der Konjunktion führt das vorgeschriebene Verfahren fort. »Dann sollen sie sagen« gibt diesen rechtlich-prozeduralen Sinn in natürlichem Deutsch wieder.
- source_word: זִקְנֵי עִירוֹ
  choice: die Ältesten seiner Stadt
  rationale: »Älteste« bezeichnet hier das örtliche Leitungsgremium; עִיר wird im rechtlich-administrativen Zusammenhang mit »Stadt« wiedergegeben.
- source_word: בְּנֵנוּ זֶה
  choice: Dieser Sohn von uns
  rationale: Die Formulierung bewahrt die nachdrückliche Identifizierung durch das Demonstrativpronomen und gibt das Suffix der ersten Person Plural natürlich wieder.
- source_word: סוֹרֵר
  choice: widerspenstig
  rationale: Das Partizip bezeichnet hartnäckigen Widerstand beziehungsweise ein eigensinniges Abweichen. »Widerspenstig« passt zur rechtlichen Anklage.
- source_word: וּמֹרֶה
  choice: rebellisch
  rationale: Der Ausdruck bezeichnet aktive Auflehnung und verstärkt den vorangehenden Vorwurf, ohne ihn lediglich zu wiederholen.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: Er hört nicht auf unsere Stimme
  rationale: Die Übersetzung bewahrt die hebräische Redeweise, in der Hören zugleich Beachten und Gehorchen einschließt. Die eindeutigere Deutung »Er gehorcht uns nicht« steht in der Fußnote.
- source_word: זוֹלֵל
  choice: ein Schlemmer
  rationale: In der Verbindung mit סֹבֵא bezeichnet das Wort einen Menschen, der sich maßlos dem Essen hingibt. »Schlemmer« erhält die substantivische Anklageform.
- source_word: וְסֹבֵא
  choice: ein Säufer
  rationale: Das Partizip bezeichnet jemanden, der gewohnheitsmäßig übermäßig trinkt. »Säufer« gibt den deutlichen Vorwurfscharakter und den habituellen Sinn wieder.
