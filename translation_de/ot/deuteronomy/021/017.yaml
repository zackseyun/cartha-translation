  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: de
  text: Sondern er muss den Erstgeborenen, den Sohn der ungeliebten Frau,[a] anerkennen, indem er ihm von allem, was sich im Besitz des Vaters befindet, einen doppelten Anteil[b] gibt; denn dieser ist der Erstling seiner Kraft.[c] Ihm steht das Recht des Erstgeborenen zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der gehassten Frau“. Das hebräische Wort kann wörtlich „gehasst“ bedeuten; hier bezeichnet es wahrscheinlich die im Vergleich weniger geliebte oder ungeliebte Frau.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Mund von zweien“; eine hebräische Redewendung für einen zweifachen Erbanteil.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Erste seiner Stärke“. Gemeint ist der erste Nachkomme als erster Ausdruck der Zeugungskraft des Vaters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: muss ... anerkennen
  rationale: Das Hifil von נכר bezeichnet hier die rechtliche Anerkennung des tatsächlichen Erstgeborenen; „anerkennen“ gibt den juristischen Zusammenhang treffend wieder.
- source_word: הַבְּכֹר
  choice: den Erstgeborenen
  rationale: „Erstgeborener“ bewahrt den fachsprachlichen Sinn des erb- und familienrechtlichen Status.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: den Sohn der ungeliebten Frau
  rationale: שְׂנוּאָה kann wörtlich „gehasst“ bedeuten, bezeichnet im Gegensatz zur geliebten Frau hier aber wahrscheinlich die ungeliebte beziehungsweise weniger geliebte Frau.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: ihm ... einen doppelten Anteil geben
  rationale: Die hebräische Wendung bedeutet im Erbrecht einen zweifachen Anteil; „doppelter Anteil“ ist im Deutschen klar und natürlich.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: von allem, was ihm gehört
  rationale: Die Formulierung bezeichnet den Besitz beziehungsweise Nachlass des Vaters. Die natürliche deutsche Wiedergabe macht den rechtlichen Bezug deutlich.
- source_word: רֵאשִׁית אֹנוֹ
  choice: der Erstling seiner Kraft
  rationale: Die Wendung bezeichnet den ersten Nachkommen als ersten Ausdruck der Zeugungskraft des Vaters und bewahrt in dieser Wiedergabe das Bild des Hebräischen.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: das Recht des Erstgeborenen
  rationale: Die Formulierung bezeichnet den rechtlichen Anspruch, der mit dem Erstgeburtsstatus verbunden ist.
- source_word: כִּי ... כִּי
  choice: Sondern ... denn
  rationale: Das erste כִּי setzt adversativ beim Verbot des vorigen Verses an; das zweite begründet die Vorschrift kausal.
theological_decisions:
- issue: Wiedergabe von שְׂנוּאָה im eherechtlichen Zusammenhang
  choice: ungeliebte Frau
  alternative: gehasste Frau; weniger geliebte Frau
  rationale: „Ungeliebt“ wahrt den relationalen Gegensatz zur geliebten Frau, ohne die mögliche Bedeutung unnötig auf ausdrücklichen Hass festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer juristischer Ausdrucksweise. Die Satzstruktur bleibt nahe am hebräischen Gedankengang; echte lexikalische Alternativen werden in Fußnoten offengehalten.
