base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: de
  text: Wenn ein Mann einen eigensinnigen und widerspenstigen Sohn hat, der weder auf die Stimme seines Vaters noch auf die Stimme seiner Mutter hört[a] und der, obwohl seine Eltern ihn zurechtweisen, nicht auf sie hört[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Auf die Stimme hören“ bedeutet hier, die elterliche Weisung zu beachten und ihr zu gehorchen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und sie ihn zurechtweisen und er nicht auf sie hört“. Die hebräische Satzverbindung kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang ist auch der konzessive Sinn „obwohl“ möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Tatbestand eines kasuistischen Rechtssatzes ein; „wenn“ ist im Deutschen die natürliche Form und kann zugleich den möglichen temporalen Beiklang tragen.
- source_word: יִהְיֶה לְאִישׁ
  choice: ein Mann … hat
  rationale: Die hebräische Besitzkonstruktion mit היה und ל wird idiomatisch deutsch mit „haben“ wiedergegeben.
- source_word: בֵּן
  choice: Sohn
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich einen Sohn.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: eigensinnig und widerspenstig
  rationale: Das Wortpaar beschreibt beharrliche Unfügsamkeit und aktive Auflehnung; die beiden deutschen Begriffe bewahren die verstärkende Doppelung.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: der … nicht … hört
  rationale: „Hören“ bewahrt die Wiederholung von שמע; im Zusammenhang ist damit zugleich gemeint, einer Weisung Folge zu leisten.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: weder auf die Stimme seines Vaters noch auf die Stimme seiner Mutter
  rationale: Die Formulierung erhält das hebräische Bild der „Stimme“; „weder … noch“ gibt unter der Verneinung die beiden mit ו verbundenen Glieder natürlich wieder.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: und sie ihn zurechtweisen
  rationale: יסר bezeichnet erzieherische Korrektur oder Zucht. „Zurechtweisen“ ist gegenwärtig, würdig und legt keine bestimmte körperliche Maßnahme fest.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: er aber nicht auf sie hört
  rationale: Die erneute Wiedergabe mit „hört“ bewahrt die bewusste Wiederholung von שמע; „aber“ macht den im Zusammenhang naheliegenden Gegensatz verständlich, ohne ihn als „obwohl“ stärker auszubauen.
