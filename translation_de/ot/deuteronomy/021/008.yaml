source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: de
  text: Schaffe Sühne für dein Volk Israel, das du erlöst hast, Jahwe, und lass unschuldiges Blut nicht auf deinem Volk Israel lasten. Dann wird ihnen die Blutschuld gesühnt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Dann wird ihnen das Blut gesühnt werden.“ „Das Blut“ ist hier ein rechtlicher Ausdruck für die Haftung, die aus dem Blutvergießen entsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: Schaffe Sühne
  rationale: Der Piël-Imperativ von כפר bezeichnet hier kultisch-rechtliche Sühne. „Schaffe Sühne“ ist im Deutschen verständlich, würdevoll und bewahrt den Vorgangscharakter besser als das ungebräuchliche „entsühne“.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: für dein Volk Israel
  rationale: לְ kennzeichnet den Begünstigten der erbetenen Sühne; die Formulierung wahrt zugleich die Bundesbeziehung in der direkten Anrede.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: das du erlöst hast
  rationale: פדה bezeichnet das Loskaufen beziehungsweise Befreien. „Erlöst“ bewahrt den im Pentateuch wichtigen Zusammenhang der Befreiung Israels.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: und lass unschuldiges Blut nicht … lasten
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet in diesem rechtlichen Zusammenhang jedoch das Auferlegen beziehungsweise Fortbestehen der durch unschuldiges Blut entstandenen Belastung. „Lasten“ erhält das Bild und ist natürliches Deutsch.
- source_word: דָּם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste hebräische Rechtswendung bezeichnet das Blut eines unschuldig Getöteten und zugleich die durch seinen Tod entstandene rechtliche Belastung.
- source_word: בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: auf deinem Volk Israel
  rationale: Obwohl בְּקֶרֶב räumlich „inmitten/unter“ bedeutet, verlangt das deutsche Verb „lasten“ die Präposition „auf“. So wird der gemeinschaftliche Haftungszusammenhang idiomatisch ausgedrückt.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Dann wird ihnen die Blutschuld gesühnt sein
  rationale: Der Nifal ist passiv-resultativ. Das hebräische „Blut“ fungiert hier als rechtlicher Ausdruck für die aus dem Blutvergießen erwachsene Haftung; „Blutschuld“ verdeutlicht diesen Sinn, während die Fußnote den Wortlaut offenlegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen in direkter Anrede. Die Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Eigenname und Titel.
- issue: Deutung von הַדָּם im Schlusssatz
  choice: Blutschuld
  alternative: Blut
  rationale: Im Zusammenhang des unaufgeklärten Tötungsdelikts bezeichnet „das Blut“ die aus dem Blutvergießen erwachsene gemeinschaftliche Haftung. „Blutschuld“ macht den rechtlichen Sinn verständlich; die wörtliche Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Verhältnis von göttlicher Erlösung und erbetener Sühne
  choice: Beide Aussagen bleiben unverkürzt nebeneinander stehen
  alternative: Die Erlösung als bereits vollzogene Sühne deuten
  rationale: Der Vers bezeichnet Israel bereits als von Jahwe erlöst und bittet dennoch um Sühne angesichts unschuldigen Blutes. Diese Spannung wird nicht systematisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schaffe Sühne“ erhält die kultisch-rechtliche Sprache, ohne unnötig altertümlich zu wirken. Die bildhafte Wendung „auf … lasten“ macht den Rechtszusammenhang verständlich und vermeidet die im Deutschen missverständliche Formulierung, Gott solle unschuldiges Blut räumlich nicht „in die Mitte setzen“.
