source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: de
  text: Wenn du aber kein Gefallen an ihr hast, sollst du sie freilassen[a]. Du darfst sie keinesfalls für Geld verkaufen und sie nicht wie eine Ware behandeln[b], denn du hast sie erniedrigt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sollst du sie für sich selbst fortschicken“; das heißt, sie in die Freiheit entlassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie nicht zu deinem Vorteil ausbeuten“. Das seltene hebräische Verb hat hier wahrscheinlich den Sinn, sie als Gegenstand wirtschaftlicher Nutzung zu behandeln.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn du hast sie verletzt“. Das hebräische Wort kann Bedrängung, Erniedrigung oder – je nach Zusammenhang – sexuelle Verletzung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Wenn ... aber
  rationale: Die konditionale Wendung wird im Deutschen natürlich wiedergegeben; „aber“ markiert den Gegensatz zur vorausgehenden Regelung.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: du kein Gefallen an ihr hast
  rationale: חפץ bezeichnet Gefallen, Verlangen oder Wohlgefallen. Die Formulierung bewahrt den persönlichen und affektiven Sinn, ohne ein im Hebräischen nicht ausdrückliches „nicht mehr“ hinzuzufügen.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: sollst du sie freilassen
  rationale: Wörtlich etwa „sie für sich selbst fortschicken“; gemeint ist ihre Entlassung in die eigene Freiheit und Verfügungsgewalt.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Du darfst sie keinesfalls für Geld verkaufen
  rationale: Infinitivus absolutus und finite Verbform verstärken das Verbot. „Keinesfalls“ bildet diese Emphase ab; כֶּסֶף wird kontextgerecht mit „Geld“ wiedergegeben.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: sie nicht wie eine Ware behandeln
  rationale: Das seltene Verb bezeichnet hier im Zusammenhang mit dem Verkaufsverbot wahrscheinlich wirtschaftliche beziehungsweise herrschaftliche Ausbeutung. Die Formulierung bewahrt die ökonomische Verdinglichung, ohne den Sinn auf Versklavung einzuengen.
- source_word: תַּחַת אֲשֶׁר
  choice: denn
  rationale: Die Wendung nennt den Grund für die Verbote; „denn“ verbindet ihn im Deutschen würdig und natürlich mit dem Hauptsatz.
- source_word: עִנִּיתָהּ
  choice: du hast sie erniedrigt
  rationale: Das Piel von ענה kann Bedrängung, Demütigung oder im sexuellen Kontext Verletzung bezeichnen. „Erniedrigt“ wahrt die Schwere und Breite des Ausdrucks; die stärkere kontextuelle Alternative steht in der Fußnote.
theological_decisions:
- issue: Ethische Aussage des Gesetzes über die gefangene Frau
  choice: 'Der Vers wird als Einschränkung der Macht des Mannes wiedergegeben: Er muss die Frau freilassen und darf sie weder verkaufen noch wirtschaftlich verdinglichen.'
  alternative: Den Text entweder als rein einvernehmliche Scheidung darzustellen oder die vorausgegangene Handlung im Haupttext ausdrücklich als Vergewaltigung zu bezeichnen.
  rationale: Der hebräische Text benennt die Erniedrigung beziehungsweise mögliche sexuelle Verletzung der Frau und begründet damit ihren Schutz vor Verkauf und Ausbeutung. Die Übersetzung darf den Zwangskontext nicht beschönigen, soll aber auch keine engere rechtliche Bezeichnung festschreiben, als der Ausdruck selbst eindeutig trägt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gesetzesstil. Die direkte Anrede im Singular bleibt erhalten. Die Formulierungen sind verständlich, ohne den Zwangskontext abzuschwächen oder die Mehrdeutigkeit des seltenen Verbs und von ענה vorschnell aufzulösen.
