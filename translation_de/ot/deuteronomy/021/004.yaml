  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: de
  text: Dann sollen die Ältesten jener Stadt die junge Kuh zu einem Tal mit ständig fließendem Wasser[a] hinabführen, das weder bearbeitet noch besät wird. Dort im Tal sollen sie der jungen Kuh das Genick brechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem beständigen Wadi“ oder „zu einem dauerhaft wasserführenden Bachbett“. Der hebräische Ausdruck נַחַל אֵיתָן kann ein Wadi, eine Talrinne oder einen Wasserlauf bezeichnen, der als dauerhaft oder immer fließend verstanden wird. Die Bedeutung von אֵיתָן („stark“, „fest“, „dauerhaft“) ist in diesem Zusammenhang nicht völlig eindeutig.'
    reason: Die Fußnote bewahrt die Unsicherheit sowohl der Geländeform von נַחַל als auch der genauen Nuance von אֵיתָן, ohne eine einzelne Deutung als sicher auszugeben.
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: sollen … hinabführen
  rationale: Der Hifil von ירד bezeichnet das Veranlassen einer Abwärtsbewegung. „Hinabführen“ bewahrt sowohl den kausativen Sinn als auch die Bewegung in das tiefer gelegene Bachbett oder Tal.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: die Ältesten jener Stadt
  rationale: Dies gibt die Statusbezeichnung זִקְנֵי und den rückverweisenden Ausdruck הָעִיר הַהִוא knapp und natürlich wieder.
- source_word: הָעֶגְלָה
  choice: die junge Kuh
  rationale: עֶגְלָה bezeichnet ein junges weibliches Rind. „Junge Kuh“ ist allgemein verständlicher als das fachsprachliche „Färse“ und bleibt sachlich genau.
- source_word: אֶל נַחַל אֵיתָן
  choice: zu einem ständig wasserführenden Bachlauf
  rationale: נַחַל kann einen Bachlauf, ein Bachbett oder ein Wadi bezeichnen; אֵיתָן trägt hier wahrscheinlich den Sinn „dauerhaft, beständig“. Die Formulierung vermittelt das wahrscheinlich Gemeinte, ohne aus dem Gelände ausdrücklich einen Fluss zu machen.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: der weder bearbeitet noch besät wird
  rationale: Die beiden Passivformen werden bewahrt und als zusammengehörige landwirtschaftliche Bestimmungen idiomatisch wiedergegeben.
- source_word: וְעָרְפוּ
  choice: sollen … das Genick brechen
  rationale: ערף bezeichnet in diesem Ritual die Tötung durch Brechen beziehungsweise Durchtrennen des Nackens von hinten. „Das Genick brechen“ bewahrt die besondere Handlung besser als das allgemeinere „schlachten“.
- source_word: בַּנָּחַל
  choice: im Bachlauf
  rationale: Die Wiederholung von נַחַל im hebräischen Text wird auch in der Übersetzung beibehalten.
