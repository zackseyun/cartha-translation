revisions:
- from: Dann sollen die Ältesten jener Stadt die junge Kuh zu einem ständig wasserführenden Bachlauf[a] hinabführen, der weder bearbeitet noch besät wird. Dort im Bachlauf sollen sie der jungen Kuh das Genick brechen.
  to: Dann sollen die Ältesten jener Stadt die junge Kuh zu einem Tal mit ständig fließendem Wasser[a] hinabführen, das weder bearbeitet noch besät wird. Dort im Tal sollen sie der jungen Kuh das Genick brechen.
  rationale: Die Revision ersetzt die zu enge Geländeangabe „Bachlauf“ durch „Tal mit ständig fließendem Wasser“. Damit bleibt die in der englischen Auditspur bevorzugte Deutung eines perennial wadi erhalten, während die mögliche Bedeutung von נַחַל als Wadi, Bachbett oder Talrinne besser abgedeckt wird. Die Fußnote wurde lexikalisch vorsichtiger gefasst.
