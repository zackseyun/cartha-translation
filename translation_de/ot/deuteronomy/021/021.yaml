    issue: „sodass er stirbt“ deutet die Verknüpfung als explizite Resultativkonstruktion.
    rationale: 'Das Hebräische verbindet mit וָמֵת koordinierend: „und er soll sterben“ bzw. „und er stirbt“. Die Revision bewahrt diese rechtlich-sequenzielle Form, ohne einen zusätzlichen syntaktischen Zusammenhang festzulegen.'
  - severity: low
    issue: „wegschaffen“ ist für die wiederkehrende Rechtsformel weniger idiomatisch als „beseitigen“.
    rationale: „Beseitigen“ gibt die metaphorische gerichtliche Entfernung des Bösen klar und in modernem Standarddeutsch wieder, ohne die nicht gemeinte wörtliche Bedeutung von בער („verbrennen“) aufzurufen.
