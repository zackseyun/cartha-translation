base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: de
  text: Dann sollen alle Männer seiner Stadt ihn mit Steinen steinigen, und er soll sterben. So sollst du das Böse aus deiner Mitte beseitigen. Ganz Israel soll davon hören und sich fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: sollen … ihn … steinigen
  rationale: רגם bezeichnet im gerichtlichen Zusammenhang die Hinrichtung durch Steinigung; „steinigen“ ist im Deutschen die klare und idiomatische Entsprechung.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: alle Männer seiner Stadt
  rationale: אַנְשֵׁי ist ausdrücklich maskulin und bezeichnet hier die Männer der Stadt als gemeinschaftlich Handelnde; die Übersetzung wahrt diese Formulierung.
- source_word: בָאֲבָנִים
  choice: mit Steinen
  rationale: Die konkrete Angabe des Mittels wird beibehalten, obwohl sie im Deutschen neben „steinigen“ semantisch wiederholend wirkt.
- source_word: וָמֵת
  choice: sodass er stirbt
  rationale: Die Formulierung gibt die resultative Folge der Steinigung natürlich wieder, ohne sie ausdrücklich als Zweck zu deuten.
- source_word: וּבִעַרְתָּ הָרָע
  choice: sollst du das Böse … wegschaffen
  rationale: בער bezeichnet in der deuteronomischen Rechtsformel das entschiedene Entfernen des Bösen aus der Gemeinschaft, nicht ein wörtliches Verbrennen.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Dies bewahrt das Bild der Bundesgemeinschaft und entspricht der wiederkehrenden deuteronomischen Formel.
- source_word: יִשְׁמְעוּ
  choice: soll davon hören
  rationale: „Davon“ macht im Deutschen den impliziten Bezug auf das Geschehen verständlich, ohne den Sinn zu erweitern.
- source_word: וְיִרָאוּ
  choice: und sich fürchten
  rationale: Die Wendung bewahrt sowohl die Reaktion der Furcht als auch die abschreckende Funktion der gerichtlichen Warnung.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der städtischen Vollstrecker
  choice: alle Männer seiner Stadt
  alternative: alle Einwohner seiner Stadt
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin. Die Übersetzung wahrt dies, ohne daraus eine über den Wortlaut hinausgehende Aussage über Geschlechterrollen abzuleiten.
- issue: Deuteronomische Formel zur Beseitigung des Bösen
  choice: das Böse aus deiner Mitte wegschaffen
  alternative: das Böse aus deiner Mitte ausrotten
  rationale: „Wegschaffen“ gibt die gerichtliche Entfernung wieder und vermeidet die im Deutschen mögliche zusätzliche Konnotation einer Vernichtung ganzer Personengruppen. Der abstrakte Ausdruck „das Böse“ bleibt erhalten.
translation_notes:
  register: Moderne, verständliche und zugleich feierlich-rechtliche Standardsprache. Das modale „sollen“ gibt die verbindliche Rechtsanweisung natürlich wieder. Die konkrete hebräische Verbindung „mit Steinen steinigen“ bleibt trotz ihrer deutschen Redundanz erhalten; „sodass er stirbt“ verdeutlicht anschließend die Folge.
