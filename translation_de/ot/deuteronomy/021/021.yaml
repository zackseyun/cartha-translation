revisions:
- from: Dann sollen alle Männer seiner Stadt ihn mit Steinen steinigen, sodass er stirbt. So sollst du das Böse aus deiner Mitte wegschaffen. Ganz Israel soll davon hören und sich fürchten.
  to: Dann sollen alle Männer seiner Stadt ihn mit Steinen steinigen, und er soll sterben. So sollst du das Böse aus deiner Mitte beseitigen. Ganz Israel soll davon hören und sich fürchten.
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-semantische Verbesserungen: Die Folge der Steinigung wird koordinierend wiedergegeben, und die deuteronomische Beseitigungsformel wird in natürlichem modernem Deutsch formuliert. Bedeutung, Register, die maskuline Personenbezeichnung und die abschreckende Aussage bleiben unverändert.'
