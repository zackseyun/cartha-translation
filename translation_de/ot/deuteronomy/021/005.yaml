  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: de
  text: Und die Priester, die Söhne Levis, sollen herantreten; denn sie hat Jahwe, dein Gott, dazu erwählt, ihm zu dienen und im Namen Jahwes zu segnen. Nach ihrem Ausspruch soll über jeden Rechtsstreit und jede Verletzung[a] entschieden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann eine Verletzung, einen Schlag, eine Plage oder eine andere Schädigung bezeichnen. In diesem rechtlichen Zusammenhang sind wahrscheinlich Fälle körperlicher Verletzung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: sollen herantreten
  rationale: Das Nifal von נגשׁ bezeichnet hier das förmliche Herantreten der Priester zur rechtlich-rituellen Handlung. „Herantreten“ ist natürlich und bewahrt den Vorgang des Sichnäherns.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: die Priester, die Söhne Levis
  rationale: Die hebräische Apposition bleibt sichtbar. Die Formulierung ist genauer als das stärker zusammenfassende „die levitischen Priester“.
- source_word: כִּי בָם בָּחַר
  choice: denn sie hat … erwählt
  rationale: כִּי begründet die amtliche Rolle der Priester. Die Voranstellung von „sie“ gibt die Hervorhebung durch בָם wieder; „erwählt“ bezeichnet Gottes vorausgehende, weiterhin maßgebliche Wahl.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Bundesformel אֱלֹהֶיךָ bleibt mit „dein Gott“ direkt erhalten.
- source_word: לְשָׁרְתוֹ
  choice: ihm zu dienen
  rationale: שרת bezeichnet im priesterlichen Zusammenhang den Dienst vor Gott. „Ihm zu dienen“ ist würdig, verständlich und lässt den kultischen Kontext aus dem Zusammenhang hervorgehen.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: und im Namen Jahwes zu segnen
  rationale: Die Formulierung bewahrt sowohl die priesterliche Segenshandlung als auch ihre Ausübung unter der Autorität des Gottesnamens.
- source_word: וְעַל פִּיהֶם
  choice: Nach ihrem Ausspruch
  rationale: Wörtlich „nach ihrem Mund“ ist eine Redeweise für einen maßgeblichen mündlichen Spruch. „Ausspruch“ hält den Bezug zum gesprochenen Wort fest, ohne die Wendung unnatürlich wörtlich abzubilden.
- source_word: יִהְיֶה
  choice: soll … entschieden werden
  rationale: Das einfache „soll sein“ benötigt im Deutschen in diesem Rechtszusammenhang eine sinngemäße Ergänzung. „Entschieden werden“ bringt die richterliche Funktion zum Ausdruck, ohne den Inhalt des Entscheids festzulegen.
- source_word: כָּל רִיב
  choice: jeder Rechtsstreit
  rationale: רִיב kann Streit oder Rechtssache bezeichnen. „Rechtsstreit“ macht den juristischen Zusammenhang deutlich und bleibt zugleich breit genug.
- source_word: וְכָל נָגַע
  choice: jeder Fall einer Verletzung
  rationale: נֶגַע umfasst Schlag, Verletzung, Plage oder sonstige Schädigung. Im rechtlichen Zusammenhang ist eine körperliche Verletzung wahrscheinlich; „Fall einer Verletzung“ ist jedoch weniger eng als „Körperverletzung“ oder „Angriff“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den offenbarten Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang der priesterlichen Entscheidungsbefugnis
  choice: Nach ihrem Ausspruch soll … entschieden werden
  alternative: Auf ihrer Autorität beruht …; nach ihrem Mund soll … sein
  rationale: Die Übersetzung gibt die rechtlich maßgebliche Rolle der Priester wieder, bestimmt aber nicht näher, ob sie allein entscheiden oder einen verbindlichen Spruch innerhalb des beschriebenen Verfahrens abgeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Hebräischen, wird aber zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Apposition „die Söhne Levis“ und der Bezug auf den priesterlichen Ausspruch bleiben ausdrücklich erhalten.
