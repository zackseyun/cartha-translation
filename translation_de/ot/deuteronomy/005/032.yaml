base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: de
  text: Achtet also darauf, so zu handeln, wie Jahwe, euer Gott, es euch geboten hat; weicht weder nach rechts noch nach links ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „weder nach rechts noch nach links abweichen“ bedeutet, in keiner Richtung von dem abzuweichen, was Gott geboten hat.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: Achtet also darauf, so zu handeln
  rationale: שׁמר in Verbindung mit dem Infinitiv עשה bezeichnet hier aufmerksames Befolgen, nicht bloßes Bewahren. Die Formulierung gibt sowohl die Sorgfalt als auch das praktische Tun in natürlichem Deutsch wieder.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion verlangt Übereinstimmung mit dem göttlichen Gebot. „Wie“ bewahrt diesen Bezug knapp und idiomatisch.
- source_word: צִוָּה
  choice: es euch geboten hat
  rationale: Das Perfekt bezeichnet den ergangenen Befehl, dessen Verbindlichkeit fortbesteht. Das deutsche Perfekt klingt im unmittelbaren Zusammenhang natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Wiedergabe des Tetragramms.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: 'Die Konstruktion mit dem Suffix der zweiten Person Plural bezeichnet die Bundesbeziehung: „euer Gott“.'
- source_word: לֹא תָסֻרוּ
  choice: weicht … nicht ab
  rationale: סור beschreibt bildhaft das Abweichen vom gebotenen Weg. „Abweichen“ erhält dieses Wegmotiv und ist zugleich verständliches modernes Deutsch.
- source_word: יָמִין וּשְׂמֹאל
  choice: weder nach rechts noch nach links
  rationale: Das hebräische Gegensatzpaar bezeichnet ein Abweichen in irgendeine Richtung. Die deutsche Paarformel gibt das Bild und seinen umfassenden Sinn wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm als persönlicher Gottesname. Die Umschrift „Jahwe“ bewahrt den Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderung bleibt direkt und eindringlich; das hebräische Wegbild wird im Haupttext bewahrt und in der Fußnote erläutert.
