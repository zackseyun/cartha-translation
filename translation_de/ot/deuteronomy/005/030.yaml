  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: de
  text: 'Geh und sag ihnen: »Kehrt zu euren Zelten zurück.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך fordert Mose unmittelbar auf, sich auf den Weg zu machen; „Geh“ ist die natürliche und präzise deutsche Entsprechung.
- source_word: אֱמֹר
  choice: sag
  rationale: Der Imperativ von אמר leitet den auszurichtenden Wortlaut ein. „Sag“ ist in modernem Standarddeutsch direkt und idiomatisch.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition mit dem Suffix der 3. Person maskulin Plural bezeichnet die Empfänger der Botschaft.
- source_word: שׁוּבוּ
  choice: Kehrt … zurück
  rationale: Der Pluralimperativ von שוב bezeichnet hier die Rückkehr der Israeliten an ihren bisherigen Aufenthaltsort. Die trennbare deutsche Verbform gibt die Bewegungsrichtung natürlich wieder.
- source_word: לָכֶם
  choice: zu euren
  rationale: Die Verbindung von ל mit dem Suffix der 2. Person maskulin Plural bezeichnet idiomatisch die Rückkehr an den eigenen Ort; im Deutschen wird dies zusammen mit dem folgenden Substantiv als „zu euren“ ausgedrückt.
- source_word: לְאָהֳלֵיכֶם
  choice: Zelten
  rationale: „Zelte“ bewahrt die konkrete Bezeichnung des hebräischen Textes und den historischen Schauplatz, ohne die Bedeutung verallgemeinernd als „Wohnstätten“ oder „Häuser“ wiederzugeben.
