base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: de
  text: 'Und als ihr die Stimme mitten aus der Finsternis hörtet[a], während der Berg im Feuer brannte, da tratet ihr zu mir heran: alle Oberhäupter eurer Stämme und eure Ältesten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Schall“. Das hebräische Wort kann sowohl eine Stimme als auch einen Schall oder Laut bezeichnen; hier passt „Stimme“ am besten, weil Gott aus der Finsternis spricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: Und als ihr ... hörtet
  rationale: Die Konstruktion führt ein zeitliches Folgeereignis ein. Die deutsche Formulierung gibt den erzählerischen Übergang natürlich wieder, ohne ein schwerfälliges „Und es geschah“.
- source_word: הַקּוֹל
  choice: die Stimme
  rationale: קוֹל kann „Stimme“ oder „Schall/Laut“ bedeuten. Da im Horeb-Kontext Gottes Reden gemeint ist, passt „Stimme“ am besten; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: mitten aus der Finsternis
  rationale: Die Wendung bewahrt das Bild des Hervorkommens aus dem Inneren der Dunkelheit und klingt zugleich idiomatisch deutsch.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: während der Berg im Feuer brannte
  rationale: Das Waw wird als Umstandsangabe verstanden; das Partizip bezeichnet den gleichzeitig andauernden Brand. „Im Feuer brannte“ entspricht der hebräischen Bildsprache.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: da tratet ihr zu mir heran
  rationale: קרב bezeichnet die Annäherung an Mose. Das korrelative „da“ schließt den mit „als“ eröffneten deutschen Satz klar ab.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: alle Oberhäupter eurer Stämme
  rationale: רָאשׁ bezeichnet hier die führenden Vertreter der Stämme. „Oberhäupter“ erhält die hebräische Metapher in einer verständlichen deutschen Amtsbezeichnung.
- source_word: וְזִקְנֵיכֶם
  choice: und eure Ältesten
  rationale: זָקֵן meint hier anerkannte Gemeinschaftsälteste und nicht lediglich alte Männer.
