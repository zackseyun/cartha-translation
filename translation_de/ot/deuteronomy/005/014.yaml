source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: de
  text: Aber der siebte Tag ist ein Sabbat für Jahwe, deinen Gott. Du sollst keinerlei Arbeit verrichten – du, dein Sohn, deine Tochter, dein Sklave, deine Sklavin, dein Rind, dein Esel, keines deiner Nutztiere und auch nicht der ansässige Fremde[a], der in deinen Ortschaften lebt[b] –, damit dein Sklave und deine Sklavin ebenso ruhen wie du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der bei dir lebende Ausländer“. Das hebräische גֵּר bezeichnet einen nicht einheimischen Menschen, der innerhalb der Gemeinschaft ansässig ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in deinen Toren“. Die hebräische Wendung meint die Ortschaften beziehungsweise den örtlichen Gemeinschafts- und Rechtsbereich.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: Sabbat
  rationale: Bezeichnet hier den besonderen, geheiligten Ruhetag und nicht bloß Ruhe im Allgemeinen; „Sabbat“ ist im Deutschen etabliert.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier Zugehörigkeit bzw. Widmung; „für Jahwe“ klingt im Deutschen natürlicher als „Jahwe“ mit Dativ und bewahrt diesen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: מְלָאכָה
  choice: Arbeit
  rationale: Die breite, kontextgemäße Bezeichnung für die am Sabbat untersagte Tätigkeit, ohne die Kategorie unnötig einzuengen.
- source_word: עַבְדְּךָ
  choice: dein Sklave
  rationale: Das Wort bezeichnet hier ein männliches, rechtlich gebundenes Haushaltsmitglied; „Sklave“ macht diesen sozialen Status deutlicher als „Diener“.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: deine Sklavin
  rationale: Das weibliche Gegenstück zu עבד bezeichnet eine rechtlich gebundene Frau im Haushalt; die Übersetzung erhält Geschlecht und Status.
- source_word: שׁוֹר
  choice: Rind
  rationale: Im rechtlichen Zusammenhang ist ein Hausrind gemeint; „Rind“ ist modern und schließt das als Arbeitstier eingesetzte Tier ein.
- source_word: חֲמוֹר
  choice: Esel
  rationale: Direkte und gegenwärtige deutsche Entsprechung.
- source_word: בְּהֵמָה
  choice: Nutztiere
  rationale: Im Haushalts- und Besitzkontext sind domestizierte Tiere gemeint; „Nutztiere“ ist präziser als das allgemeine „Tiere“.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: Bezeichnet einen nicht einheimischen Menschen, der dauerhaft innerhalb der Gemeinschaft lebt; die Formulierung vermeidet den Eindruck eines bloß Durchreisenden.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Die Wendung „in deinen Toren“ ist ein Orts- und Rechtsidiom für die Siedlungen bzw. den örtlichen Gemeinschaftsbereich; die Wiedergabe erschließt den gemeinten Sinn.
- source_word: לְמַעַן
  choice: damit
  rationale: Drückt den Zweck der Anordnung klar und idiomatisch aus.
- source_word: כָּמוֹךָ
  choice: ebenso wie du
  rationale: Bewahrt den ausdrücklichen Vergleich und betont die gleichartige Sabbatruhe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als persönlichen Gottesnamen. „Jahwe“ macht dies sichtbar, ohne es durch einen Titel zu ersetzen.
- issue: Sozialer Status von עבד und אמה
  choice: Sklave / Sklavin
  alternative: Diener / Dienerin
  rationale: Die Begriffe bezeichnen im vorliegenden Haushaltsrecht gebundene Personen. Die direkte Wiedergabe bewahrt die sozialgeschichtliche und ethische Spannung des Textes, statt sie abzumildern.
- issue: Geltungsbereich von בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  alternative: in deinen Toren
  rationale: Die hebräische Wendung ist räumlich und rechtlich zu verstehen. Eine sinngemäße Wiedergabe verhindert, dass sie fälschlich nur auf den unmittelbaren Torbereich bezogen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Aufzählung bleibt vollständig erhalten. „Keinerlei Arbeit“ gibt das emphatische לֹא ... כָל idiomatisch wieder; „ebenso ruhen können wie du“ formuliert den Zweck natürlich, ohne den Vergleich abzuschwächen.
