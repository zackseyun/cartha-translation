revisions:
- from: Doch der siebte Tag ist ein Sabbat für Jahwe, deinen Gott. Du sollst keinerlei Arbeit verrichten – weder du noch dein Sohn oder deine Tochter, dein Sklave oder deine Sklavin, dein Rind oder dein Esel oder irgendeines deiner Nutztiere noch der ansässige Fremde[a], der in deinen Ortschaften lebt[b] –, damit dein Sklave und deine Sklavin ebenso ruhen können wie du.
  to: Aber der siebte Tag ist ein Sabbat für Jahwe, deinen Gott. Du sollst keinerlei Arbeit verrichten – du, dein Sohn, deine Tochter, dein Sklave, deine Sklavin, dein Rind, dein Esel, keines deiner Nutztiere und auch nicht der ansässige Fremde[a], der in deinen Ortschaften lebt[b] –, damit dein Sklave und deine Sklavin ebenso ruhen wie du.
  rationale: Die Revision beseitigt die syntaktisch uneinheitliche „weder ... noch“-Aufzählung und gibt die Zweckangabe ohne den nicht ausgedrückten Modalzusatz „können“ wieder. Die inhaltlichen Entscheidungen, einschließlich der Fußnotenanker und der Erklärung des Tor-Idioms, bleiben erhalten.
