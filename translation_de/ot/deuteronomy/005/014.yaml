  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Ansässiger Fremder“ wahrt bei גֵּר die Bedeutung eines nicht einheimischen, aber zur Gemeinschaft gehörenden Bewohners; die Fußnote erläutert dies hilfreich. Die Erklärung von „in deinen Ortschaften“ als Wiedergabe des Tor-Idioms ist angemessen und die Fußnoten sind an den jeweiligen Bezugswörtern korrekt verankert.
