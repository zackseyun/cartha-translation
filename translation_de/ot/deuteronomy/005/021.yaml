  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: de
  text: Du sollst die Frau deines Nächsten nicht begehren. Du sollst nicht nach dem Haus[a] deines Nächsten, seinem Feld, seinem Sklaven, seiner Sklavin, seinem Rind, seinem Esel oder nach irgendetwas verlangen, das deinem Nächsten gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ kann im Hebräischen auch den Haushalt oder den gesamten Hausstand bezeichnen. Die anschließende Aufzählung legt hier besonders den Besitzaspekt nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: begehren
  rationale: Das Verb bezeichnet hier ein auf den Besitz eines anderen gerichtetes, unerlaubtes Begehren. „Begehren“ bewahrt im Deutschen sowohl die ethische Schärfe als auch den vertrauten Klang des Gebots.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: die Frau deines Nächsten
  rationale: Die Status-constructus-Verbindung bezeichnet eindeutig die Ehefrau des Nächsten; „Frau“ ist im Kontext natürlich und verständlich.
- source_word: תִתְאַוֶּה
  choice: Verlangen haben nach
  rationale: Der Hitpael von אוה überschneidet sich mit חמד, ist aber nicht dasselbe Verb. Die Wiedergabe mit „Verlangen haben“ erhält den lexikalischen Wechsel.
- source_word: בֵּית רֵעֶךָ
  choice: das Haus deines Nächsten
  rationale: בַּיִת kann Haus, Haushalt oder Hausstand bezeichnen. Die folgende Besitzliste legt hier zunächst die konkrete Wiedergabe „Haus“ nahe; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: שָׂדֵהוּ
  choice: sein Feld
  rationale: שָׂדֶה bezeichnet hier am natürlichsten ein Feld beziehungsweise landwirtschaftliches Grundstück und wird ausdrücklich wiedergegeben.
- source_word: עַבְדּוֹ
  choice: sein Sklave
  rationale: Im Zusammenhang einer Aufzählung dessen, was einem anderen gehört, ist der rechtlich unfreie Status deutlich. „Sklave“ gibt diesen Status unverhüllt wieder und wahrt zusammen mit dem folgenden Ausdruck die Geschlechtsunterscheidung.
- source_word: אֲמָתוֹ
  choice: seine Sklavin
  rationale: אָמָה bezeichnet eine unfreie Frau. „Sklavin“ ist die klare moderne Entsprechung und bildet das weibliche Gegenstück zu „Sklave“.
- source_word: שׁוֹרוֹ
  choice: sein Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung, häufig ein Arbeitsrind. „Rind“ ist im modernen Deutschen klar und vermeidet eine nicht sicher festgelegte Geschlechts- oder Kastrationsangabe.
- source_word: חֲמֹרוֹ
  choice: sein Esel
  rationale: „Esel“ ist die geläufige und genaue moderne Entsprechung.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: oder nach irgendetwas, das deinem Nächsten gehört
  rationale: Die Formulierung fasst das Verbot umfassend zusammen. „Gehört“ macht die hebräische Besitzkonstruktion in natürlichem Deutsch deutlich.
- source_word: רֵעֶךָ
  choice: dein Nächster
  rationale: „Nächster“ ist die etablierte und kontextuell passende Wiedergabe für den Mitmenschen im Bereich zwischenmenschlicher Verpflichtungen.
theological_decisions:
- issue: Unterscheidung der beiden Verben des Begehrens
  choice: חמד mit „begehren“ und אוה mit „Verlangen haben nach“ wiedergeben
  alternative: Beide Verben einheitlich mit „begehren“ oder „Verlangen haben“ wiedergeben
  rationale: Der hebräische Text verwendet bewusst zwei verwandte, aber verschiedene Verben. Die deutsche Differenzierung bewahrt diese sprachliche Spannung, ohne einen weitergehenden sachlichen Unterschied zu behaupten.
- issue: Wiedergabe der Bezeichnungen für unfreie Personen
  choice: „Sklave“ und „Sklavin“
  alternative: „Knecht“ und „Magd“ oder „Diener“ und „Dienerin“
  rationale: Die Einordnung in eine Besitzliste macht den unfreien Status in diesem Vers besonders deutlich. Die direkte Wiedergabe vermeidet eine beschönigende Auflösung des historischen und ethischen Spannungsfeldes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Gebotsform. Der traditionelle Schlüsselbegriff „begehren“ bleibt erhalten, während „Verlangen haben“ den Wechsel des hebräischen Verbs sichtbar macht. Die Aufzählung ist syntaktisch geglättet, ohne einzelne Elemente auszulassen.
