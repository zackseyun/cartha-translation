base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: de
  text: Geht den ganzen Weg, den Jahwe, euer Gott, euch geboten hat, damit ihr lebt, damit es euch gut geht und ihr lange in dem Land lebt, das ihr in Besitz nehmen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ihr erben werdet“. Das hebräische Verb kann sowohl das Inbesitznehmen als auch das Erben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: auf dem ganzen Weg
  rationale: Bewahrt den Singular und das hebräische Bild eines von Gott vorgegebenen Lebenswegs; zugleich ist die Formulierung im Deutschen natürlich.
- source_word: צִוָּה
  choice: geboten hat
  rationale: Das Perfekt bezeichnet ein ergangenes Gebot, dessen Geltung fortbesteht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Entspricht der bundesbezogenen Wendung und verbindet sich natürlich mit dem Gottesnamen.
- source_word: תֵּלֵכוּ
  choice: Geht
  rationale: Erhält im Zusammenhang mit „Weg“ die bildhafte Bedeutung des Lebenswandels und gibt zugleich den auffordernden Ton wieder.
- source_word: לְמַעַן
  choice: damit
  rationale: Drückt Ziel beziehungsweise beabsichtigte Folge knapp und idiomatisch aus.
- source_word: תִּחְיוּן
  choice: ihr lebt
  rationale: Direkte Wiedergabe des Verbs für leben; der Kontext beschreibt die Folgen des Gehorsams.
- source_word: וְטוֹב לָכֶם
  choice: damit es euch gut geht
  rationale: Gibt die hebräische Aussage über Wohlergehen in natürlichem modernem Deutsch wieder.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: und ihr lange … lebt
  rationale: Natürliche deutsche Wiedergabe des hebräischen Idioms „Tage verlängern“, ohne dessen Sinn auf bloßes Verweilen im Land zu verengen.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: Entspricht dem üblichen deutschen Ausdruck für das deuteronomische Landmotiv.
- source_word: תִּירָשׁוּן
  choice: in Besitz nehmen werdet
  rationale: Erfasst den konkreten Sinn von ירשׁ als Erlangen und Besitzen des Landes; die ebenfalls mögliche Erbterminologie wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; „Jahwe“ macht diesen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירשׁ in der Landverheißung
  choice: das ihr in Besitz nehmen werdet
  alternative: das ihr erben werdet
  rationale: „In Besitz nehmen“ wahrt den konkreten territorialen Sinn; „erben“ bleibt eine echte lexikalische Alternative und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular „Weg“ und das Bild des Gehens bleiben erhalten. Die dreifache Ziel- beziehungsweise Folgestruktur wird durch wiederholtes „damit“ klar wiedergegeben; vor dem letzten Glied ist die Ellipse natürlich verständlich.
