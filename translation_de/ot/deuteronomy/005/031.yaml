source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: de
  text: Du aber, bleib hier bei mir stehen, dann will ich dir das ganze Gebot, die Ordnungen und die Rechtsbestimmungen sagen, die du sie lehren sollst, damit sie danach handeln in dem Land, das ich ihnen gebe, damit sie es in Besitz nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie es erben“. Das hebräische Verb kann in diesem Zusammenhang „in Besitz nehmen“, „besitzen“ oder „erben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: bleib hier bei mir stehen
  rationale: Die Wendung bewahrt das konkrete עמד „stehen“ und gibt zugleich den kontextuellen Sinn des Verbleibens in Gottes Gegenwart in natürlichem Deutsch wieder.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: dann will ich dir … sagen
  rationale: Der Kohortativ nach dem Imperativ bezeichnet die beabsichtigte Folge. „Dann will ich“ wahrt den volitiven Klang; „sagen“ passt zu dem folgenden Akkusativ der mitgeteilten Weisung.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: das ganze Gebot
  rationale: מִצְוָה steht im Singular und כָּל bezeichnet hier die Gesamtheit. „Das ganze Gebot“ erhält beides und ist im Deutschen idiomatischer als „all das Gebot“.
- source_word: הַחֻקִּים
  choice: die Ordnungen
  rationale: „Ordnungen“ ist eine verständliche rechtlich-bundestheologische Wiedergabe von חֻקִּים und bleibt von den folgenden Rechtsbestimmungen unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Der Ausdruck macht den rechtlichen Charakter von מִשְׁפָּטִים deutlich, ohne ihn auf einzelne richterliche Urteile zu verengen.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: die du sie lehren sollst
  rationale: 'Das Imperfekt hat hier beauftragenden Charakter. Das doppelte Akkusativmuster ist im Deutschen möglich: Mose soll Israel diese Weisungen lehren.'
- source_word: וְעָשׂוּ
  choice: damit sie danach handeln
  rationale: Die Form bezeichnet im Zusammenhang die beabsichtigte Folge des Lehrens. „Danach handeln“ gibt idiomatisch wieder, dass Israel die Weisungen ausführen soll.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: das ich ihnen gebe
  rationale: Das Partizip נֹתֵן stellt die Landgabe als gegenwärtig wirksames beziehungsweise unmittelbar bevorstehendes Handeln Gottes dar.
- source_word: לְרִשְׁתָּהּ
  choice: damit sie es in Besitz nehmen
  rationale: ירש bezeichnet hier das Erlangen und Besitzen des Landes. Die Zweckformulierung gibt den Infinitiv mit לְ natürlich wieder; das Pronomen bezieht sich auf „Land“.
theological_decisions:
- issue: Die dreigliedrige Rechtsbezeichnung מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: Gebot, Ordnungen und Rechtsbestimmungen
  alternative: Weisung, Satzungen und Rechte
  rationale: Die drei Ausdrücke bleiben unterscheidbar, statt zu einem allgemeinen Begriff wie „Gesetze“ zusammengezogen zu werden. So bleibt die rechtliche Textur des Bundeswortes erhalten.
- issue: Der Singular מִצְוָה
  choice: das ganze Gebot
  alternative: alle Gebote
  rationale: Der hebräische Singular wird als zusammenfassende Bezeichnung bewahrt. Eine pluralische Wiedergabe würde die Form des Ausgangstextes unnötig einebnen.
- issue: Verhältnis von Lehren und Tun
  choice: damit sie danach handeln
  alternative: und sie sollen danach handeln
  rationale: Der Zusammenhang legt einen Zweck- beziehungsweise Folgesinn nahe, ohne die Verpflichtung zum Gehorsam abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der feierlichen direkten Rede, bleibt aber gut verständlich. „Bleib … stehen“ erhält sowohl den konkreten Wortlaut als auch den Sinn des Verweilens. Der kollektive Singular „das ganze Gebot“ und die rechtliche Dreierformel werden bewusst bewahrt.
