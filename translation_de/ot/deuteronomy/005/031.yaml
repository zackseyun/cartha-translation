  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die wesentlichen Bedeutungen zuverlässig wieder: Mose soll bei Gott stehen bleiben; Gott wird ihm die gesamte Weisung einschließlich der Ordnungen und Rechtsbestimmungen mitteilen; Mose soll Israel diese lehren, damit es im gegebenen Land danach handelt und es in Besitz nimmt. Der kollektive Singular von הַמִּצְוָה ist mit „das ganze Gebot“ erhalten, und die drei Rechtstermini bleiben differenziert.'
  naturalness: Modernes, würdiges Standarddeutsch. „Bleib hier bei mir stehen“ bewahrt die konkrete Aufforderung zu stehen und ist idiomatisch. Die Doppelakkusativfügung „die du sie lehren sollst“ ist korrekt, wenn auch gehoben, und passt zum Register.
  terminology: „Gebot“, „Ordnungen“ und „Rechtsbestimmungen“ sind nachvollziehbar voneinander abgegrenzte Wiedergaben von מִצְוָה, חֻקִּים und מִשְׁפָּטִים. „In Besitz nehmen“ trifft ירש im Landgabe-Kontext. Die Fußnote stellt die mögliche Alternative „erben“ angemessen und ohne Überinterpretation dar.
