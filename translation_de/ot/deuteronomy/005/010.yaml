  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: de
  text: sondern Tausenden treue Liebe erweist, denen, die mich lieben und seine Gebote halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Handschriften und Übersetzungen lesen „meine Gebote“. Das entspricht der Ich-Rede im Zusammenhang; der hier zugrunde gelegte hebräische Text lautet „seine Gebote“.
    reason: Textvariante und auffälliger Wechsel der grammatischen Person.
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: sondern … erweist
  rationale: Das Partizip führt den Gegensatz zum vorhergehenden Vers fort. „Erweist“ gibt die idiomatische Verbindung mit חֶסֶד wieder; „sondern“ macht den kontextuellen Gegensatz deutlich.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Der Ausdruck bezeichnet verlässliche, von Loyalität geprägte Liebe. „Treue Liebe“ ist verständlich und bewahrt sowohl den Beziehungs- als auch den Bundestreue-Aspekt.
- source_word: לַאֲלָפִים
  choice: Tausenden
  rationale: Im hebräischen Text steht kein ausdrückliches Bezugswort wie „Generationen“. Die offene Formulierung wird daher nicht ergänzt.
- source_word: לְאֹהֲבַי
  choice: denen, die mich lieben
  rationale: Das Partizip mit Suffix der ersten Person wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: וּלְשֹׁמְרֵי
  choice: und … halten
  rationale: שׁמר bedeutet hier, Gebote zu bewahren beziehungsweise zu befolgen; „Gebote halten“ ist im Deutschen klar und idiomatisch.
- source_word: מצות/ו
  choice: seine Gebote
  rationale: Die vorgelegte hebräische Textform trägt ein Suffix der dritten Person Singular. Die Übersetzung folgt dieser Form, auch wenn sie im Zusammenhang unerwartet ist.
theological_decisions:
- issue: Person des Pronomens bei „Gebote“
  choice: seine Gebote
  alternative: meine Gebote
  rationale: Die vorgelegte hebräische Form weist auf „seine Gebote“, während die umgebende Rede in der ersten Person und abweichende Textzeugen beziehungsweise Übersetzungen „meine Gebote“ nahelegen. Die Hauptübersetzung folgt dem bereitgestellten WLC-Text; die kontextuell naheliegende Variante wird in der Fußnote genannt.
- issue: Bezugsgröße von „Tausenden“
  choice: Tausenden
  alternative: tausend Generationen / Tausenden von Generationen
  rationale: Da im vorgelegten hebräischen Wortlaut kein Substantiv für „Generationen“ steht, bleibt die Aussage wie im Ausgangstext offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des vorhergehenden Verses fragmentarisch. Die Wortstellung hält „Tausenden“ bewusst ohne ergänztes Bezugswort und bewahrt den unerwarteten Wechsel von „mich“ zu „seine“.
