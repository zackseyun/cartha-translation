source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: de
  text: Ehre deinen Vater und deine Mutter, wie Jahwe, dein Gott, es dir geboten hat, damit du lange lebst und damit es dir gut geht in dem Land, das Jahwe, dein Gott, dir gibt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Ehre
  rationale: Der Piel-Imperativ von כבד fordert in diesem Beziehungskontext, Vater und Mutter als gewichtig anzuerkennen und entsprechend zu behandeln. „Ehre“ gibt dies prägnant und idiomatisch wieder.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: deinen Vater und deine Mutter
  rationale: Die Wiederholung des direkten Objektzeichens vor beiden Elternteilen verleiht beiden gleiches Gewicht; die ausgeschriebene Form bewahrt diese Ausgewogenheit.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: wie ... es dir geboten hat
  rationale: כַּאֲשֶׁר stellt den Bezug zu dem bereits ergangenen göttlichen Gebot her. Das Perfekt wird im Deutschen natürlich mit „geboten hat“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Wiedergabe des göttlichen Eigennamens und ersetzt ihn nicht durch einen Titel.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form mit Suffix der zweiten Person Singular bezeichnet unmittelbar „dein Gott“ und bewahrt den persönlichen Bundesbezug.
- source_word: לְמַעַן
  choice: damit
  rationale: לְמַעַן bezeichnet Zweck beziehungsweise Folge. Das zweimalige „damit“ bildet die Wiederholung im Hebräischen ab und hält die beiden Aussagen parallel.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: du lange lebst
  rationale: Wörtlich heißt die Wendung etwa „deine Tage lange werden“. „Du lange lebst“ gibt den hebräischen Sinn in natürlichem, allgemein verständlichem Deutsch wieder.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: und damit es dir gut geht
  rationale: Die feste Wendung ייטב לך bezeichnet Wohlergehen. „Es dir gut geht“ ist die natürliche moderne deutsche Entsprechung, ohne die Art des Wohlergehens unnötig einzuengen.
- source_word: עַל הָאֲדָמָה
  choice: auf dem Land
  rationale: אֲדָמָה meint hier das von Gott gegebene Land und nicht bloß Erdboden. „Auf dem Land“ bewahrt sowohl den konkreten territorialen Bezug als auch die Präposition עַל.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip bezeichnet die gegenwärtig gewisse beziehungsweise fortdauernde Gabe Gottes. Im Deutschen bringt das Präsens „dir gibt“ dies idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen und entspricht der üblichen deutschen Schreibweise, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Verheißung für die Ehrung der Eltern
  choice: Die Verheißung langen Lebens und Wohlergehens im gegebenen Land bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: Eine ausnahmslose individuelle Lebensgarantie; eine ausschließlich nationale oder symbolische Verheißung
  rationale: Der hebräische Text verbindet das Gebot real mit langem Leben und Wohlergehen im Land, legt aber nicht ausdrücklich fest, wie individuelles und gemeinschaftliches Ergehen zueinander stehen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzstruktur, löst jedoch die Wendung „deine Tage mögen lang werden“ idiomatisch als „du lange lebst“ auf. Die im englischen Konsultationstext gesetzten Fußnotenmarker stimmen dort nicht mit ihren Fußnoteninhalten überein; da der hebräische Text an diesen Stellen keine für die deutsche Veröffentlichung notwendige textkritische oder semantische Fußnote erfordert, wurden keine Marker übernommen.
