source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: de
  text: Wenn sie doch ein solches Herz hätten, mich zu fürchten und alle meine Gebote ihr Leben lang zu halten, damit es ihnen und ihren Kindern für immer gut ginge!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Wenn sie doch
  rationale: Die wörtliche Frage »Wer wird geben?« ist hier eine hebräische Wunschformel. »Wenn sie doch« gibt die Sehnsucht natürlich und nachdrücklich wieder.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: immer ein solches Herz hätten
  rationale: Die Konstruktion bezeichnet den ersehnten Besitz einer bestimmten inneren Haltung. »Ein solches Herz« wahrt den qualitativen Bezug von זֶה; »immer« nimmt כָּל הַיָּמִים im Sinn dauerhafter Lebenshaltung auf.
- source_word: לְבָבָם
  choice: Herz
  rationale: »Herz« bewahrt die biblische Bezeichnung für Denken, Wollen und innere Haltung und verengt sie nicht auf den Verstand.
- source_word: לְיִרְאָה אֹתִי
  choice: sodass sie mich fürchteten
  rationale: »Fürchten« wahrt den etablierten Bundesbegriff, der ehrfürchtige Gottesfurcht und gehorsame Hinwendung umfasst.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: und alle meine Gebote hielten
  rationale: »Gebote halten« ist im Deutschen die natürliche und sachlich genaue Verbindung für gehorsames Befolgen.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: damit es ihnen ... gut ginge
  rationale: Die Formulierung erhält den Zweck- beziehungsweise Ergebnisbezug und lässt die umfassende, nicht bloß materielle Wohlfahrt offen.
- source_word: וְלִבְנֵיהֶם
  choice: und ihren Kindern
  rationale: בנים bezeichnet hier im Zusammenhang die Nachkommen allgemein; »Kinder« gibt diesen repräsentativen Sinn angemessen wieder.
- source_word: לְעֹלָם
  choice: für immer
  rationale: Die Wendung gibt die zeitlich unbeschränkte Fortdauer der verheißenen Wohlfahrt wieder.
theological_decisions:
- issue: Anthropologische Bedeutung von לְבָבָם
  choice: Herz
  alternative: Sinn; innere Haltung
  rationale: »Herz« bewahrt die theologisch gewichtige biblische Anthropologie, ohne sie auf Gefühl oder Verstand zu reduzieren.
- issue: Bedeutung der Gottesfurcht
  choice: mich fürchteten
  alternative: mich ehrten; Ehrfurcht vor mir hätten
  rationale: Die direkte Wiedergabe wahrt die Spannung des Bundesbegriffs zwischen Ehrfurcht, Bindung und gehorsamer Haltung, statt ihn erklärend abzuschwächen.
- issue: Referenz von וְלִבְנֵיהֶם
  choice: ihren Kindern
  alternative: ihren Söhnen; ihren Nachkommen
  rationale: Der grammatisch maskuline Ausdruck ist hier generisch auf die nachfolgende Generation bezogen; »Kinder« entspricht dem gemeinten Umfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschformel wird idiomatisch mit »Wenn sie doch« wiedergegeben; der Konjunktiv wahrt den optativen Charakter. Die Satzstruktur bleibt eng am hebräischen Gedankengang, ohne unnatürliche Wörtlichkeit.
