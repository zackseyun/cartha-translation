source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: de
  text: Ich bin Jahwe, dein Gott, der dich aus dem Land Ägypten, aus dem Sklavenhaus[a], herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Haus der Sklaven“; möglich ist auch: „aus dem Haus der Sklaverei“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ich bin
  rationale: Der selbstständige hebräische Ich-Pronominalsatz enthält keine ausdrückliche Kopula; im Deutschen gibt „Ich bin“ die feierliche Selbstvorstellung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlich erschlossenen Aussprache des Tetragramms.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der Singularsuffix der zweiten Person wird direkt mit „dein“ wiedergegeben; im Bundeszusammenhang bezeichnet אֱלֹהִים Gott.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf Jahwe; „der“ ist im Deutschen die natürliche persönliche Relativform.
- source_word: הוֹצֵאתִיךָ
  choice: dich … herausgeführt hat
  rationale: Der Hifil von יצא bedeutet „hinausführen/herausführen“. Die Satzklammer mit „herausgeführt“ ist idiomatisches Deutsch und bewahrt die Ausgangsbewegung.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: מִן bezeichnet den Ausgangspunkt; „aus dem Land Ägypten“ ist klar und entspricht der hebräischen Konstruktion.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Das deutsche Kompositum ist knapp, verständlich und bewahrt das konkrete Bild eines „Hauses der Sklaven“, ohne עֲבָדִים vorschnell zum Abstraktum „Sklaverei“ umzudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Bundesnamen ausdrücklich. Die Wiedergabe als Eigenname bewahrt dies, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe von עֲבָדִים in der Exodusformel
  choice: Sklavenhaus
  alternative: Haus der Sklaverei; Fronhaus
  rationale: Der hebräische Plural bezeichnet konkret Sklaven. „Sklavenhaus“ erhält dieses konkrete Bild und bezeichnet im Zusammenhang zugleich den Ort bzw. Zustand der Versklavung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Ich bin Jahwe“ wahrt den feierlichen Auftakt; die Wiederholung von „aus“ bildet die hebräische Parallelstruktur ab. „Sklavenhaus“ ist bewusst konkreter als das abstrakte „Haus der Sklaverei“.
