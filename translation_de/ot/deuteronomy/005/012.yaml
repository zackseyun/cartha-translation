  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: de
  text: Bewahre den Sabbattag[a], um ihn heilig zu halten, wie Jahwe, dein Gott, dir geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte den Sabbattag“. Das hebräische Verb betont die sorgfältige Bewahrung und Beachtung des Gebots.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Achte auf
  rationale: Der imperativisch gebrauchte Infinitiv absolutus fordert zu sorgfältiger Beachtung auf. „Achte auf“ ist im modernen Deutsch natürlich, vermittelt wachsame Befolgung und bewahrt den bewussten Unterschied zu „Gedenke“ in Exodus 20,8.
- source_word: יוֹם הַשַׁבָּת
  choice: den Sabbattag
  rationale: Die geläufige deutsche Wiedergabe bezeichnet klar den konkreten, für die Sabbatruhe bestimmten Tag.
- source_word: לְקַדְּשׁוֹ
  choice: und halte ihn heilig
  rationale: Die Zweckangabe verlangt, den Tag als heilig und ausgesondert zu behandeln. Die koordinierte deutsche Formulierung gibt den Zweck idiomatisch wieder, ohne zu unterstellen, Israel verleihe dem Tag erst seine Heiligkeit.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet knapp und natürlich den Bezug auf das bereits ergangene göttliche Gebot ein.
- source_word: צִוְּךָ
  choice: es dir geboten hat
  rationale: צוה bezeichnet ein autoritatives Gebot. Das deutsche Perfekt entspricht natürlichem Gegenwartsdeutsch und stellt den vorausgehenden Auftrag dar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Gibt die Bundesbezeichnung mit dem Suffix der zweiten Person Singular direkt und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְקַדְּשׁוֹ
  choice: halte ihn heilig
  alternative: heilige ihn; mache ihn heilig
  rationale: Die Formulierung beschreibt die Behandlung des Sabbattages als heilig beziehungsweise ausgesondert. Sie vermeidet die mögliche Fehlvorstellung, Menschen würden seine Heiligkeit erst hervorbringen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede steht entsprechend dem Hebräischen im Singular. „Sabbattag“ ist allgemein verständlich; „Achte auf“ hebt die aufmerksame Befolgung hervor.
