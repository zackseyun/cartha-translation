base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: de
  text: Du sollst den Namen Jahwes, deines Gottes, nicht missbrauchen[a]; denn Jahwe wird den nicht ungestraft lassen[b], der seinen Namen missbraucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du sollst den Namen Jahwes, deines Gottes, nicht zu Falschem tragen/aufnehmen.« Das Hebräische kann einen falschen, leeren oder unrechtmäßigen Gebrauch des Gottesnamens einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den nicht für schuldlos erklären« beziehungsweise »den nicht freisprechen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: missbrauchen
  rationale: Das Verb bedeutet wörtlich »heben, tragen, auf sich nehmen«. In der Verbindung mit »Name« und לַשָּׁוְא bezeichnet es hier einen unberechtigten, falschen oder leeren Gebrauch. »Missbrauchen« ist im modernen Deutschen natürlich, lässt den Umfang des Verbots aber bewusst offen.
- source_word: שֵׁם
  choice: Name
  rationale: Die Grundbedeutung wird bewahrt. Der Name kann zugleich für die offenbarte Identität, Autorität und den Ruf Gottes stehen, ohne dass dies im Haupttext ausgedeutet wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt. »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Bewahrt die direkte Bundesanrede in der zweiten Person Singular und fügt sich natürlich in die deutsche Genitivkonstruktion ein.
- source_word: לַשָּׁוְא
  choice: 'missbrauchen; Fußnote: zu Falschem / ohne Grund / in nichtiger Weise'
  rationale: שָׁוְא umfasst Falschheit, Nichtigkeit, Leere und Zwecklosigkeit. Da keine einzelne deutsche Wendung die ganze Spannweite trägt, steht im Haupttext das breite »missbrauchen«; die Fußnote erhält die lexikalische Mehrdeutigkeit.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung des Gebots klar und in einem würdigen deutschen Rechtsstil ein.
- source_word: יְנַקֶּה (נקה)
  choice: nicht ungestraft lassen
  rationale: Das Piel bezeichnet hier, jemanden nicht von Schuld beziehungsweise deren Folgen freizusprechen. Die Formulierung ist verständlich und bewahrt den gerichtlichen Ernst.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezeichnet allgemein denjenigen, der die Übertretung begeht; die deutsche Formulierung ist knapp und natürlich.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Der Rückbezug auf Jahwes eigenen Namen wird ausdrücklich bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Seine Wiedergabe als »Jahwe« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang des Verbots
  choice: den Namen ... nicht missbrauchen
  alternative: den Namen ... nicht zu Falschem tragen; den Namen ... nicht unnütz gebrauchen; beim Namen ... nicht falsch schwören
  rationale: Der Wortlaut kann falsches Schwören, leeres Anrufen und einen weiter gefassten unrechtmäßigen Gebrauch einschließen. Der Haupttext legt das Gebot daher nicht auf nur eine Anwendung fest; die Fußnote bewahrt die möglichen Nuancen.
- issue: Gerichtliche Aussage von נקה
  choice: nicht ungestraft lassen
  alternative: nicht für schuldlos erklären; nicht freisprechen
  rationale: Die gewählte Formulierung bringt die sichere Ahndung verständlich zum Ausdruck, während die Fußnote die engere forensische Formulierung sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Singularanrede. »Missbrauchen« vermeidet die heute missverständliche traditionelle Wendung »den Namen ... nicht eitel gebrauchen« und hält zugleich den sachlichen Umfang des hebräischen Ausdrucks offen. Beide Fußnotenmarker erscheinen im Haupttext.
