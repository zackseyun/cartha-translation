base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: de
  text: 'Und Jahwe hörte eure Worte, als ihr zu mir gesprochen habt.[a] Da sagte Jahwe zu mir: »Ich habe die Worte dieses Volkes gehört, die sie zu dir gesprochen haben. Sie haben in allem, was sie gesagt haben, gut gesprochen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Jahwe hörte die Stimme (oder: den Klang) eurer Worte«; das Hebräische verwendet hier eine akustische Wendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie haben gut daran getan, das alles zu sagen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, der im Deutschen üblichen Form der wissenschaftlich erschlossenen Aussprache des Tetragramms.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: hörte / habe gehört
  rationale: שׁמע bezeichnet hier das Hören der gesprochenen Worte. Im direkten Zitat bringt das Perfekt »habe gehört« die abgeschlossene Wahrnehmung mit gegenwärtiger Relevanz natürlich zum Ausdruck.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: eure Worte / die Worte
  rationale: Die wörtliche Verbindung »Stimme/Klang der Worte« ist im Deutschen unnatürlich. »Worte hören« bewahrt den auditiven Sinn in verständlicher, würdiger Sprache; die hebräische Ausdrucksweise wird in Fußnote [a] dokumentiert.
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: als ihr zu mir redetet
  rationale: Die Präposition בְּ mit dem Infinitiv constructus bezeichnet die gleichzeitig stattfindende Handlung. »Als« gibt diesen zeitlichen Zusammenhang idiomatisch wieder.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die singularische Kollektivbezeichnung עָם und das Demonstrativpronomen werden formal und im Deutschen natürlich als »dieses Volk« wiedergegeben.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: die sie zu dir gesprochen haben
  rationale: Der Relativsatz wird beibehalten und bewahrt durch »gesprochen« die wiederholte Verwendung von דבר.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Alles, was sie gesagt haben, ist gut
  rationale: Der Hifil von יטב drückt eine positive Bewertung aus. Die deutsche Formulierung bezieht diese Bewertung, wie der Kontext, auf den gesamten Inhalt ihrer Rede, ohne sie als allgemeines moralisches Urteil über das Volk auszuweiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration »Jahwe« macht den persönlichen Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der göttlichen Zustimmung
  choice: Alles, was sie gesagt haben, ist gut
  alternative: Sie haben in allem, was sie gesagt haben, gut gehandelt
  rationale: Die Zustimmung wird eng auf die Äußerung des Volkes bezogen. So bleibt die Aussage des Verses erhalten, ohne daraus eine weitergehende Beurteilung ihres gesamten Verhaltens abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Wiederholung von »Worte« und »gesprochen/gesagt« bewahrt die Struktur des hebräischen Textes, während die unidiomatische Wendung »Stimme der Worte« in eine Fußnote verlegt wird.
