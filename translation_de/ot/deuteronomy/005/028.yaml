    rationale: 'Hebräisch lautet wörtlich näher: »Sie haben gut gehandelt/gesprochen in allem, was sie gesagt haben.« Die Fassung »Alles ... ist gut« kann als uneingeschränkte Qualitäts- oder Wahrheitsbehauptung über jede einzelne Aussage gelesen werden und verdeckt das Subjekt »sie«.'
