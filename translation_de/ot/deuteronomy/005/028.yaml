revisions:
- from: 'Und Jahwe hörte eure Worte, als ihr zu mir redetet.[a] Da sagte Jahwe zu mir: »Ich habe die Worte dieses Volkes gehört, die sie zu dir gesprochen haben. Alles, was sie gesagt haben, ist gut.«[b]'
  to: 'Und Jahwe hörte eure Worte, als ihr zu mir gesprochen habt.[a] Da sagte Jahwe zu mir: »Ich habe die Worte dieses Volkes gehört, die sie zu dir gesprochen haben. Sie haben in allem, was sie gesagt haben, gut gesprochen.«[b]'
  rationale: 'Die Revision korrigiert die Subjekt-Prädikat-Beziehung im letzten Satz und bewahrt damit die Formulierung des hebräischen Textes: Das Volk »hat gut gesprochen« bzw. »gut daran getan«, während »in allem, was sie gesagt haben« den Umfang der Zustimmung bezeichnet. Zugleich wird die Erzählform im ersten Satz modernisiert. Die Fußnotenanker bleiben an ihren jeweiligen Bezugsstellen erhalten.'
