base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: de
  text: Tritt du näher und höre alles, was der HERR, unser Gott, sagt; und teile uns alles mit, was der HERR, unser Gott, zu dir spricht; wir werden darauf hören und danach handeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Tritt du näher
  rationale: Der Imperativ mit ausdrücklich gesetztem Pronomen hebt Mose gegenüber dem Volk hervor; „näher treten“ gibt die räumliche Annäherung natürlich wieder.
- source_word: וּשֲׁמָע
  choice: und höre
  rationale: שׁמע bezeichnet hier zunächst das unmittelbare Hören dessen, was Gott sagt.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: teile uns … mit
  rationale: Eine natürliche deutsche Wiedergabe für das Weitergeben der empfangenen Worte; der Inhalt bleibt durch „alles“ vollständig bestimmt.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: wir werden darauf hören und danach handeln
  rationale: Beim zweiten שׁמע umfasst „hören“ auch bereitwilliges Annehmen; „danach handeln“ gibt ועשינו idiomatisch wieder, ohne den Gehorsamsaspekt zu verlieren.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht der vorgegebenen Publikationskonvention und dem konsultierten englischen Text.
theological_decisions:
- issue: Vermittlerrolle des Mose
  choice: Die direkte Rede bewahrt die Bitte des Volkes, Mose solle sich nähern, Gottes Worte hören und vollständig weitergeben.
  alternative: Die Aussage ausdrücklich als dauerhafte priesterliche oder kirchliche Vermittlungsordnung deuten.
  rationale: Der hebräische Text beschreibt hier die konkrete Vermittlung am Horeb; weitergehende konfessionelle Folgerungen werden nicht in die Übersetzung eingetragen.
- issue: Bedeutung von שׁמע am Versende
  choice: „darauf hören“ bewahrt sowohl den Hörvorgang als auch die Bereitschaft zum Gehorsam.
  alternative: Nur „gehorchen“ oder nur „anhören“.
  rationale: Die hebräische Formulierung verbindet Hören und Tun ausdrücklich; die Übersetzung soll diese Spannung nicht auf einen einzigen Aspekt reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „der HERR, unser Gott“ und das zweimalige göttliche Sprechen bleiben erhalten; das abschließende Begriffspaar Hören und Tun wird in natürlicher deutscher Form bewahrt.
