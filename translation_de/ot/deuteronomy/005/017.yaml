lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Negationspartikel bildet zusammen mit der Verbform ein kategorisches Verbot. Die traditionelle deutsche Formulierung „Du sollst nicht“ gibt diesen Gebotsstil natürlich und würdig wieder.
- source_word: תִּרְצָח
  choice: morden
  rationale: Das Verb רָצַח bezeichnet hier spezifischer Mord beziehungsweise widerrechtliches Töten, nicht unterschiedslos jede Form des Tötens. „Morden“ wahrt die knappe Form des hebräischen Gebots und seine rechtlich-ethische Aussage.
theological_decisions:
- issue: Reichweite des Verbots im sechsten Gebot
  choice: „Du sollst nicht morden.“
  alternative: „Du sollst nicht töten.“
  rationale: Da im Hebräischen רָצַח und nicht ein allgemeineres Verb für Töten steht, gibt „morden“ die spezifische Bedeutung genauer wieder. Zugleich bleibt durch die Fußnote die traditionelle Formulierung sichtbar, ohne das Gebot als ausnahmsloses Verbot jeder Tötung auszulegen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit bewusster Beibehaltung der würdigen und vertrauten Dekalogformel „Du sollst nicht“. Der Satz folgt der äußersten Kürze des hebräischen Textes.
