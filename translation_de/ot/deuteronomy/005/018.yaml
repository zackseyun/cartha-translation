  text: Und du sollst nicht ehebrechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ohne die einleitende Verknüpfung: »Du sollst nicht ehebrechen.« Im Hebräischen steht eine Konjunktion (»und«), die dieses Gebot mit den umgebenden Geboten verbindet.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Und … nicht
  rationale: Die vorangestellte Konjunktion verbindet das Gebot mit den umgebenden Geboten und wird daher mit »Und« wiedergegeben. לֹא drückt hier ein verbindliches Verbot aus.
- source_word: תִּנְאָף
  choice: du sollst die Ehe brechen
  rationale: Die Qal-Imperfektform in der 2. Person maskulin Singular bezeichnet hier im Dekalog das Verbot des Ehebruchs. »Die Ehe brechen« ist im modernen Standarddeutsch natürlich, präzise und dem feierlichen Rechtscharakter angemessen.
theological_decisions:
- issue: Wiedergabe des Verbots in der 2. Person Singular im Bundesgesetz
  choice: Und du sollst nicht die Ehe brechen.
  alternative: Du sollst nicht die Ehe brechen. / Brich nicht die Ehe.
  rationale: »Du sollst nicht« bewahrt die direkte singularische Anrede und den feierlichen, verpflichtenden Charakter des Dekalogs. Das einleitende »Und« gibt die im Hebräischen ausdrücklich vorhandene Verknüpfung mit der Gebotsfolge wieder, ohne die Aussage theologisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der im Dekalog geläufigen Verbotsform »du sollst nicht«. Die hebräische Koordination wird sichtbar erhalten.
