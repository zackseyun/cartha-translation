  text: וְ/לֹֽא תַעֲנֶ֥ה בְ/רֵֽעֲ/ךָ֖ עֵ֥ד שָֽׁוְא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: de
  text: Du sollst gegen deinen Mitmenschen nicht als falscher Zeuge aussagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst gegen deinen Nächsten kein falsches Zeugnis ablegen.“'
    reason: Lexikalisch und syntaktisch mögliche, traditionelle Wiedergabe der hebräischen Rechtsformel; „Nächster“ bildet רֵעַ enger ab, während „Zeugnis ablegen“ die Verbindung von ענה und עֵד idiomatisch wiedergibt.
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die Verneinung bildet zusammen mit der deutschen Gebotsform „du sollst … nicht“ ein klares Verbot.
- source_word: תַעֲנֶה
  choice: aussagen
  rationale: ענה bedeutet grundsätzlich „antworten“; in Verbindung mit עֵד bezeichnet es hier jedoch das Aussagen in einem rechtlichen Zusammenhang.
- source_word: בְרֵעֲךָ
  choice: gegen deinen Mitmenschen
  rationale: רֵעַ bezeichnet den Nächsten, Gefährten oder Mitmenschen. „Gegen“ gibt die nachteilige Ausrichtung der Zeugenaussage wieder; „Mitmensch“ ist heute verständlich und bewahrt den allgemeinen Geltungsbereich.
- source_word: עֵד
  choice: als … Zeuge
  rationale: עֵד bezeichnet einen Zeugen. Die Konstruktion „als falscher Zeuge aussagen“ gibt die knappe hebräische Rechtsformel natürlich und präzise wieder.
- source_word: שָׁוְא
  choice: falsch
  rationale: שָׁוְא kann Falschheit, Nichtigkeit oder Täuschung bezeichnen. Im Zusammenhang einer Zeugenaussage ist „falsch“ die treffendste Wiedergabe, ohne den Sinn unnötig einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular bewahrt die Form des hebräischen Gebots. „Mitmensch“ vermeidet eine mögliche Verengung von „Nächster“ auf räumliche Nachbarschaft; die Fußnote bietet die traditionelle Formulierung.
