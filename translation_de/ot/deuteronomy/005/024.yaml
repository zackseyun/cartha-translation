  text: וַ/תֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אֶת כְּבֹד֣/וֹ וְ/אֶת גָּדְל֔/וֹ וְ/אֶת קֹל֥/וֹ שָׁמַ֖עְנוּ מִ/תּ֣וֹךְ הָ/אֵ֑שׁ הַ/יּ֤וֹם הַ/זֶּה֙ רָאִ֔ינוּ כִּֽי יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת הָֽ/אָדָ֖ם וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: de
  text: 'Und ihr sagtet: »Sieh, der HERR, unser Gott, hat uns seine Herrlichkeit und seine Größe sehen lassen, und wir haben seine Stimme mitten aus dem Feuer gehört. Heute haben wir gesehen, dass Gott mit einem Menschen reden kann und dieser dennoch am Leben bleibt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht der konsultierten Fassung und ist im deutschen Bibelstil weithin verständlich.
- source_word: הֶרְאָנוּ
  choice: hat uns … sehen lassen
  rationale: Gibt die kausative Form von ראה genauer wieder als ein bloßes »gezeigt« und klingt dennoch natürlich.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: seine Herrlichkeit und seine Größe
  rationale: Bewahrt die beiden parallelen Begriffe des Hebräischen ohne sie zusammenzuziehen.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Gibt die räumliche Bedeutung von מִתּוֹךְ idiomatisch und anschaulich wieder.
- source_word: יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם
  choice: Gott mit einem Menschen reden kann
  rationale: Der unbestimmte menschliche Referent wird im Deutschen natürlich mit »einem Menschen« ausgedrückt; »kann« erfasst hier die durch die Erfahrung bestätigte Möglichkeit, ohne eine allgemeine Gewohnheit zu behaupten.
- source_word: וָחָי
  choice: und dieser dennoch am Leben bleibt
  rationale: Das waw verbindet das überraschende Fortleben des Menschen mit Gottes Reden; »dennoch« macht diese im Kontext liegende Spannung sichtbar, und »dieser« klärt den Subjektbezug.
theological_decisions:
- issue: Modalität von יְדַבֵּר
  choice: dass Gott mit einem Menschen reden kann
  alternative: dass Gott mit einem Menschen redet
  rationale: Der Kontext beschreibt die erstaunte Erkenntnis, dass unmittelbares göttliches Reden möglich ist, ohne dass der Mensch stirbt. Die Wiedergabe mit »kann« bewahrt diesen Sinn, statt eine zeitlose Regelmäßigkeit zu formulieren.
- issue: Subjekt von וָחָי
  choice: der Mensch bleibt dennoch am Leben
  alternative: Gott redet und lebt
  rationale: Grammatisch und kontextuell bezieht sich das Leben auf הָאָדָם, den Menschen, der Gottes Stimme hört.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit direkter Rede. »Sieh« bewahrt den hebräischen Aufmerksamkeitspartikel הֵן; die Satzführung bleibt nahe am hebräischen Parallelismus, ohne im Deutschen schwerfällig zu wirken.
