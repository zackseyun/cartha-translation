  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: de
  text: Du sollst dir weder ein geschnitztes Bild[a] noch irgendein Abbild[b] von dem machen, was oben im Himmel, unten auf der Erde oder in den Wassern unter der Erde ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Götzenbild«. Das hebräische Wort bezeichnet ein geschnitztes oder behauenes Bild, häufig im Zusammenhang mit Götzendienst; hier bleibt die konkrete Bedeutung erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gestalt«. Das hebräische Wort kann eine Form oder Ähnlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: geschnitztes Bild
  rationale: Der Ausdruck bezeichnet ein durch Schnitzen oder Behauen gefertigtes Bild, häufig im Zusammenhang mit Götzendienst. Die konkrete Wiedergabe vermeidet es, die Deutung »Götzenbild« bereits in den Wortlaut einzutragen.
- source_word: תְּמוּנָה
  choice: Abbild
  rationale: Das Wort bezeichnet eine Gestalt oder Ähnlichkeit. »Abbild« ist im modernen Deutschen natürlich und erfasst hier eine gegenständliche Darstellung.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Du sollst dir nicht machen
  rationale: »Du sollst nicht« entspricht dem verbindlichen Verbot im Bundesgesetz; »dir« bewahrt לְךָ und bezeichnet die Herstellung zur eigenen Verfügung oder Verwendung.
- source_word: כָּל תְּמוּנָה
  choice: keinerlei Abbild
  rationale: Im verneinten Satz bringt »keinerlei« den umfassenden Sinn von כָּל idiomatisch zum Ausdruck.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: dessen, was oben im Himmel ... ist
  rationale: Die Formulierung bewahrt den Relativsatz und den räumlichen Gegensatz; der deutsche Singular »Himmel« ist für das hebräische שָׁמַיִם idiomatisch.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: unten auf der Erde
  rationale: »Auf der Erde« ist für die Lage von Lebewesen und Dingen im irdischen Bereich natürlich; »unten« erhält den vertikalen Gegensatz zu »oben«.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: im Wasser unter der Erde
  rationale: Die direkte, verständliche Wiedergabe erhält das im Text vorausgesetzte räumliche Bild des Wassers unter der Erde.
theological_decisions:
- issue: Reichweite des Bilderverbots
  choice: Der Vers wird als Verbot wiedergegeben, ein geschnitztes Bild oder ein Abbild herzustellen, ohne hier den Zweck der Verehrung hinzuzufügen.
  alternative: Deutender als Verbot übersetzen, Götzenbilder zur Verehrung anzufertigen.
  rationale: Erst Vers 9 nennt ausdrücklich das Niederwerfen und Dienen. Die zurückhaltende Übersetzung bewahrt die Abfolge des Textes und legt die theologische Reichweite nicht enger fest, als es dieser Vers allein tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebotsform »Du sollst nicht« wahrt den rechtlich-bündischen Ton; »geschnitztes Bild« und »Abbild« sind verständlich, ohne altertümlich oder unnötig deutend zu wirken.
