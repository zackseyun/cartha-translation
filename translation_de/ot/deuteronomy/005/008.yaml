  naturalness: Die Gebotsform ist modernes, würdevolles Standarddeutsch. Die Umstellung zu »weder ... noch ...« macht die koordinierte Verneinung klarer und idiomatischer als die Kombination »kein ... und keinerlei ...«. »von dem, was« ist hier etwas flüssiger als »dessen, was« und erhält den Bezug der Darstellung auf die genannten Bereiche.
  terminology: »Geschnitztes Bild« und »Abbild« sind terminologisch angemessen. Eine Fußnote zu »Abbild« sollte, entsprechend der lexikalischen Alternative und dem englischen Audit-Trail, ergänzt und unmittelbar an diesem Wort verankert werden. Die Fußnote zu »Götzenbild« bleibt zurückhaltend und wahrt die Abfolge zu Vers 9.
