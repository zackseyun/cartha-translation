- from: 'Ich stand damals zwischen Yahweh und euch, um euch das Wort Yahwehs zu verkünden; denn ihr hattet Angst vor dem Feuer und stiegt nicht auf den Berg. Er sagte:'
  to: 'Ich stand damals zwischen Yahweh und euch, um euch das Wort Yahwehs zu verkünden, weil ihr euch vor dem Feuer fürchtetet und nicht auf den Berg stiegt, mit den Worten:'
  rationale: Die kausale Satzverbindung wird mit „weil“ unmittelbar und natürlich wiedergegeben. „mit den Worten:“ wahrt die Funktion von לֵאמֹר als Einleitung der folgenden Rede, ohne einen im hebräischen Wortlaut nicht ausdrücklich gesetzten Sprecher einzuführen. Die übrigen Formulierungen bleiben aufgrund ihrer Quelltreue und ihres modernen Standards beibehalten.
