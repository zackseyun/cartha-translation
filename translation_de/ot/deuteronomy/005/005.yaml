  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: de
  text: 'Ich stand damals zwischen Yahweh und euch, um euch das Wort Yahwehs zu verkünden, weil ihr euch vor dem Feuer fürchtetet und nicht auf den Berg stiegt, mit den Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: Ich stand
  rationale: Das selbstständige Pronomen hebt Mose hervor; das Partizip bezeichnet im vergangenen Erzählzusammenhang seine damalige Stellung. Natürliches Deutsch gibt dies knapp mit „Ich stand“ wieder.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: zwischen Yahweh und euch
  rationale: Die Präpositionsverbindung bezeichnet Moses vermittelnde Stellung zwischen den beiden Parteien; der Gottesname wird als Yahweh wiedergegeben.
- source_word: בָּעֵת הַהִוא
  choice: damals
  rationale: Die idiomatische Zeitangabe verweist auf das Geschehen am Horeb und wird im Deutschen natürlich mit „damals“ ausgedrückt.
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: um euch das Wort Yahwehs zu verkünden
  rationale: Der Hifil-Infinitiv gibt den Zweck von Moses vermittelnder Stellung an; „verkünden“ wahrt den feierlichen Charakter, „Wort“ die konkrete göttliche Rede.
- source_word: כִּי יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: denn ihr hattet Angst vor dem Feuer
  rationale: כִּי ist hier kausal. מִפְּנֵי kann im Zusammenhang mit ירא im Deutschen idiomatisch als „Angst vor“ wiedergegeben werden, ohne die hebräische Wendung wörtlich nachzubilden.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: und stiegt nicht auf den Berg
  rationale: עלה bezeichnet die Aufwärtsbewegung; „auf den Berg steigen“ ist präzise und natürlich.
- source_word: לֵאמֹר
  choice: 'Er sagte:'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Da ein deutsches „sagend“ unnatürlich und grammatisch mehrdeutig wäre, wird der implizite Sprecher aus dem Ausdruck „Wort Yahwehs“ aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Yahweh“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Moses Stellung zwischen Gott und dem Volk
  choice: räumlich und funktional offen als „zwischen Yahweh und euch“
  alternative: ausdrücklich „als Vermittler“
  rationale: Der Text beschreibt eine vermittelnde Stellung, verwendet aber kein Substantiv für „Vermittler“. Die Übersetzung bewahrt diese Bildhaftigkeit und vermeidet eine zusätzliche theologische Festlegung.
- issue: Subjekt der mit לֵאמֹר eingeleiteten Rede
  choice: Er sagte
  alternative: indirekter Anschluss „mit den Worten:“
  rationale: Die folgende Rede ist nach dem unmittelbaren Zusammenhang das Wort Yahwehs. Die explizite deutsche Subjektaufnahme beseitigt nur eine durch die Zielsprache entstehende Unklarheit und verändert nicht den Sprecherwechsel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, wird jedoch vor der folgenden Gottesrede in zwei Sätze gegliedert. Keine Fußnote ist erforderlich, da die hebräische Wendung מִפְּנֵי הָאֵשׁ mit „Angst vor dem Feuer“ sowohl idiomatisch als auch bedeutungsgenau wiedergegeben wird.
