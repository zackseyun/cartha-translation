    issue: „Er sagte:“ präzisiert bei לֵאמֹר einen Sprecher.
    rationale: לֵאמֹר bedeutet hier wörtlich etwa „indem man sagt/mit den Worten“ und führt die folgende Rede ein. Die Form selbst benennt kein Subjekt. Obwohl der Kontext die anschließende Rede Yahweh zuschreibt, ist eine subjektneutrale deutsche Anschlussform genauer und vermeidet eine über das Hebräische hinausgehende Festlegung.
