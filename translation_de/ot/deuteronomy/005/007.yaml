  text: You shall have no other gods before me[a].
translation:
  language: de
  text: Du sollst keine anderen Götter vor mir haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neben mir“ oder „außer mir“. Wörtlich: „vor meinem Angesicht“; die hebräische Wendung kann sowohl Gottes Gegenwart als auch Ausschließlichkeit ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: keine / nicht
  rationale: Die Verneinung leitet das Verbot ein und wird im Deutschen idiomatisch durch „keine“ zusammen mit „haben“ ausgedrückt.
- source_word: יִהְיֶה לְךָ
  choice: du sollst … haben
  rationale: Die Verbindung von היה („sein“) mit לְךָ („für/zu dir“) bezeichnet hier ein Bestehen beziehungsweise Haben in Beziehung zum Angeredeten. „Du sollst … haben“ ist natürliches Deutsch und bewahrt den verpflichtenden Charakter.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Der Plural mit dem Adjektiv „andere“ bezeichnet Gottheiten, die neben dem HERRN als Rivalen gelten. „Andere Götter“ gibt die Wendung direkt und verständlich wieder.
- source_word: עַל פָּנָי
  choice: neben mir
  rationale: Wörtlich lautet die Wendung „vor meinem Angesicht“. Im Zusammenhang des Verbots kann sie sowohl Gegenwart als auch Ausschließlichkeit ausdrücken. „Neben mir“ ist im Deutschen natürlich und wahrt den Gedanken, dass keine anderen Götter in Gottes Gegenwart beziehungsweise an seiner Seite stehen dürfen; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Schlusswendung עַל פָּנָי
  choice: neben mir
  alternative: vor mir / in meiner Gegenwart
  rationale: Die hebräische Wendung kann räumliche Gegenwart und daraus folgend Ausschließlichkeit bezeichnen. Der Haupttext verwendet die geläufige und klare Formulierung „neben mir“, während die Fußnote den wörtlichen Ausdruck und seine Bedeutungsbreite festhält, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular „du“. Die traditionelle Formulierung ist allgemein verständlich und vermeidet konfessionelle Zusätze.
