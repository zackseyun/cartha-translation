  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: de
  text: Du sollst dich vor ihnen nicht niederwerfen[a] und ihnen nicht dienen; denn ich, Jahwe, dein Gott, bin ein eifersüchtiger Gott, der die Schuld der Väter an den Kindern bis in die dritte und vierte Generation derer heimsucht, die mich hassen.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich vor ihnen zu Boden werfen“. Das hebräische Verb bezeichnet das ehrerbietige Niederbeugen oder Sich-Niederwerfen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ahndet“ beziehungsweise „zur Rechenschaft zieht“. Das hebräische Wort bezeichnet hier ein richterliches Einschreiten und kann sowohl Rechenschaft als auch Strafe einschließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im Hebräischen: „an den Dritten und an den Vierten“; „Generationen“ ist zum Verständnis ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: dich niederwerfen
  rationale: Das Verb bezeichnet konkret das ehrerbietige Niederbeugen oder Sich-Niederwerfen. Die Wiedergabe bewahrt diese körperliche Handlung und unterscheidet sie vom folgenden „dienen“.
- source_word: תָעָבְדֵם
  choice: ihnen dienen
  rationale: עבד bezeichnet hier den kultischen Dienst an fremden Göttern oder Götzen; „dienen“ hält die lexikalische Unterscheidung zum Niederwerfen aufrecht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte Wiedergabe der Gottesbezeichnung mit dem Suffix der zweiten Person Singular.
- source_word: אֵל קַנָּא
  choice: ein eifersüchtiger Gott
  rationale: קַנָּא bezeichnet im Bundeskontext Gottes ausschließlichen Anspruch auf Verehrung und seine Ablehnung konkurrierender Gottesverehrung. „Eifersüchtig“ bewahrt die relationale Schärfe.
- source_word: פֹּקֵד
  choice: heimsucht
  rationale: Das Partizip bezeichnet hier ein richterliches Einschreiten. „Heimsuchen“ wahrt die Bedeutungsbreite zwischen zur Rechenschaft ziehen und bestrafen, ohne sie vorschnell einzuengen.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folgen bezeichnen. Das deutsche „Schuld“ lässt die moralische Tat und die daraus entstehende Haftung mitschwingen.
- source_word: אָבוֹת
  choice: Väter
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet in der Generationenfolge die Väter beziehungsweise Vorväter.
- source_word: עַל בָּנִים
  choice: an den Kindern
  rationale: בנים kann in diesem generationellen Zusammenhang die Nachkommen bezeichnen; „Kinder“ ist im Deutschen natürlich und schließt die Nachkommenschaft ein.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: an der dritten und an der vierten Generation
  rationale: Im Hebräischen stehen substantivierte Ordnungszahlen; „Generation“ wird zur idiomatischen Verständlichkeit ergänzt, ohne „bis“ einzufügen.
- source_word: לְשֹׂנְאָי
  choice: derer, die mich hassen
  rationale: Die Formulierung wahrt den Bezug auf Menschen, die Gott hassen, und lässt die syntaktische Reichweite des abschließenden Ausdrucks möglichst offen.
theological_decisions:
- issue: Wiedergabe der göttlichen Eifersucht
  choice: ein eifersüchtiger Gott
  alternative: ein leidenschaftlich eifernder Gott
  rationale: Der Zusammenhang fordert ausschließliche Verehrung. „Eifersüchtig“ bewahrt den Anspruch einer exklusiven Bundesbeziehung und mildert ihn nicht zu allgemeinem Eifer ab.
- issue: Reichweite der Schuld der Väter über Generationen
  choice: Die abschließende Wendung „derer, die mich hassen“ bleibt eng am Generationenausdruck stehen, ohne die genaue Verteilung von Schuld und Gericht dogmatisch auszudeuten.
  alternative: Die Nachkommen werden unabhängig von ihrer eigenen Haltung automatisch für die Sünde ihrer Vorfahren bestraft.
  rationale: Der hebräische Satz spricht scharf von generationenübergreifender Heimsuchung und schließt mit לְשֹׂנְאָי. Die Übersetzung bewahrt diese Spannung, ohne eine Lehre automatischer, von der eigenen Haltung unabhängiger Bestrafung einzutragen.
- issue: Bedeutungsumfang von פֹּקֵד
  choice: heimsucht
  alternative: bestraft / zur Rechenschaft zieht
  rationale: Das hebräische Wort kann richterliche Zuwendung, Rechenschaft und Strafe umfassen. Die gewählte Form hält diesen Umfang offen; die Fußnote erläutert die mögliche gerichtliche Zuspitzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. „Heimsuchen“ ist bewusst als gehobenes, jedoch etabliertes biblisch-juristisches Wort beibehalten; die Fußnote sichert die heutige Verständlichkeit. Die Parallelität von „sich niederwerfen“ und „dienen“ bleibt erhalten.
