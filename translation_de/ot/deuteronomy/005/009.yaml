  to: Du sollst dich vor ihnen nicht niederwerfen[a] und ihnen nicht dienen; denn ich, Jahwe, dein Gott, bin ein eifersüchtiger Gott, der die Schuld der Väter an den Kindern bis in die dritte und vierte Generation derer heimsucht, die mich hassen.[b][c]
