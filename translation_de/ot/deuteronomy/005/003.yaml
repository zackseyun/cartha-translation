  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: de
  text: Nicht mit unseren Vätern[a] hat Jahwe diesen Bund geschlossen[b], sondern mit uns – mit uns allen[c], die wir heute hier am Leben sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Vorfahren“. Wörtlich steht im Hebräischen: „unseren Vätern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „diesen Bund geschnitten“. „Einen Bund schneiden“ ist die hebräische Wendung für „einen Bund schließen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Manche verstehen den Gegensatz rhetorisch: nicht mit unseren Vätern allein, sondern besonders mit uns, die wir heute hier am Leben sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: diesen Bund geschlossen
  rationale: Die übliche deutsche Wendung „einen Bund schließen“ gibt das hebräische Idiom natürlich wieder und bewahrt mit „diesen“ das Demonstrativpronomen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲבֹתֵינוּ
  choice: unseren Vätern
  rationale: Dies entspricht der ausdrücklichen Formulierung des Hebräischen; die mögliche weitere Bedeutung „Vorfahren“ wird in einer Fußnote genannt.
- source_word: כִּי
  choice: sondern
  rationale: Nach der Verneinung bringt כִּי hier den scharfen Gegensatz idiomatisch als „sondern“ zum Ausdruck.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה ... כֻּלָּנוּ
  choice: mit uns – mit uns allen
  rationale: Die Wiederaufnahme von „mit uns“ und „allen“ bildet die emphatische, appositionelle Struktur des Hebräischen in natürlichem Deutsch ab.
- source_word: פֹה הַיּוֹם ... חַיִּים
  choice: die wir heute hier am Leben sind
  rationale: Die Wiedergabe bewahrt „heute“, „hier“ und den prädikativen Gedanken des Lebendigseins.
theological_decisions:
- issue: Ob der Vers jede Bundesbeziehung zu den Vätern verneint oder die gegenwärtige Geltung für die lebende Generation rhetorisch hervorhebt
  choice: 'Der Haupttext bewahrt den uneingeschränkten Gegensatz: „Nicht mit unseren Vätern ... sondern mit uns“.'
  alternative: 'Der Sinn kann rhetorisch verstanden werden: nicht mit den Vätern allein, sondern in besonderer Weise auch mit der heute lebenden Generation.'
  rationale: Im Hebräischen steht kein Wort für „allein“ oder „nur“. Deshalb wird diese Deutung nicht in den Haupttext eingefügt, sondern als mögliche Lesart in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bund schließen“ ist idiomatisch und allgemein verständlich; der Gedankenstrich und die Wiederholung bewahren die starke Betonung der gegenwärtigen Generation.
