  yaml_path: translation/ot/deuteronomy/005/019.yaml
  text: And you shall not steal[a].
translation:
  language: de
  text: Und du sollst nicht stehlen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann in manchen Zusammenhängen auch „einen Menschen rauben“ oder „entführen“ bedeuten; hier ist das Gebot allgemein formuliert: „stehlen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Und ... nicht
  rationale: Die Konjunktion וְ verbindet dieses Gebot mit den vorhergehenden Geboten; לֹא drückt das klare Verbot aus. „Und“ bewahrt die hebräische Reihung und den Rhythmus des Dekalogs.
- source_word: תִּגְנֹב
  choice: du sollst ... stehlen
  rationale: Das Qal-Imperfekt in der 2. Person Singular hat hier verbietende Kraft. „Stehlen“ gibt den allgemeinen Sinn wieder, ohne das nicht genannte Objekt auf Eigentum oder Menschen einzugrenzen.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Das Gebot wird allgemein als Verbot des Stehlens formuliert.
  alternative: Das Verb ausschließlich als „einen Menschen rauben/entführen“ verstehen.
  rationale: גנב kann je nach Zusammenhang auch Menschenraub bezeichnen, doch der objektlose Wortlaut dieses Verses legt keine solche Einschränkung fest. Die allgemeine Formulierung erhält die Offenheit des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Gebotsformel „du sollst nicht“ ist allgemein verständlich und bewahrt den rechtlich-feierlichen Klang sowie die hebräische Satzverknüpfung.
