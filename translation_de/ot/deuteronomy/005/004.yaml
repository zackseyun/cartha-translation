source:
  edition: WLC
  text: פָּנִ֣ים בְּ/פָנִ֗ים דִּבֶּ֨ר יְהוָ֧ה עִמָּ/כֶ֛ם בָּ/הָ֖ר מִ/תּ֥וֹךְ הָ/אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: de
  text: Von Angesicht zu Angesicht[a] sprach Jahwe mit euch auf dem Berg, mitten aus dem Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Angesicht zu Angesicht“; eine hebräische Wendung für eine unmittelbare persönliche Anrede. Vergleiche 5. Mose 4,12, wo Israel die Stimme hört, aber keine Gestalt sieht.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: von Angesicht zu Angesicht
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und dessen Aussage einer unmittelbaren persönlichen Anrede, ohne es auf ein buchstäbliches Sehen Gottes festzulegen.
- source_word: דִּבֶּר
  choice: sprach
  rationale: Das Verb bezeichnet schlicht das Sprechen; zusammen mit עִמָּכֶם ergibt sich im Deutschen natürlich „sprach … mit euch“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der offenbarte Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die Präposition עִם bedeutet gewöhnlich „mit“ und unterstreicht hier die Unmittelbarkeit der Anrede.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die Präposition ist hier lokal gebraucht; „auf dem Berg“ entspricht dem Sinai-Kontext und ist idiomatisches Deutsch.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Die Formulierung gibt die Bewegung aus dem Inneren des Feuers anschaulich und in natürlichem Deutsch wieder, statt sie zu einem bloßen „aus dem Feuer“ abzuflachen.
theological_decisions:
- issue: Anthropomorphe Ausdrucksweise „von Angesicht zu Angesicht“ im Zusammenhang der Sinai-Offenbarung
  choice: Die bildhafte Wendung bleibt erhalten und bezeichnet eine unmittelbare Bundesanrede, ohne ausdrücklich eine visuelle Wahrnehmung Gottes zu behaupten.
  alternative: Interpretierend mit „unmittelbar“ oder „persönlich“ übersetzen, um ein Missverständnis als sichtbare Begegnung auszuschließen.
  rationale: Der weitere Kontext sagt, dass Israel die Stimme hörte, aber keine Gestalt sah (5. Mose 4,12.15). Die Übersetzung soll weder eine buchstäbliche Schau hineinlesen noch die markante hebräische Wendung und ihre theologische Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt der rhetorischen Hervorhebung des hebräischen Anfangsausdrucks; „mitten aus dem Feuer“ hält das Bild lebendig und bleibt zugleich gut verständlich.
