base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: de
  text: Und nun, warum sollten wir sterben? Denn dieses große Feuer wird uns verzehren. Wenn wir weiterhin die Stimme Jahwes, unseres Gottes, hören, werden wir sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von ו als auch den zeitlich-folgernden Diskursmarker עַתָּה.
- source_word: לָמָּה נָמוּת
  choice: warum sollen wir sterben?
  rationale: Die rhetorische Frage beschreibt den befürchteten Ausgang; „sollen“ gibt diese Nuance natürlicher wieder als ein schlichtes Futur.
- source_word: כִּי תֹאכְלֵנוּ
  choice: Dieses große Feuer wird uns verzehren
  rationale: אכל bedeutet wörtlich „essen“, bezeichnet bei Feuer aber idiomatisch das Verzehren oder Vernichten. Die asyndetische deutsche Aussage ist als Begründung im Kontext klar und natürlich.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: dieses große Feuer
  rationale: Entspricht der hebräischen bestimmten Nominalgruppe in natürlicher deutscher Wortstellung.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Wenn wir weiterhin … hören
  rationale: יסף mit Infinitiv bedeutet hier „fortfahren, weiterhin tun“; „weiterhin hören“ gibt das Idiom knapp und idiomatisch wieder.
- source_word: קול יהוה אלהינו
  choice: die Stimme Jahwes, unseres Gottes
  rationale: קוֹל bezeichnet im Zusammenhang göttlicher Rede die „Stimme“; der Gottesname und die possessive Bundesbezeichnung bleiben erhalten.
- source_word: עוֹד וָמָתְנוּ
  choice: werden wir sterben
  rationale: עוֹד ist bereits durch „weiterhin“ ausgedrückt; eine zusätzliche Wiedergabe als „noch länger“ wäre im Deutschen redundant. Das abschließende Verb bezeichnet die befürchtete Folge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die rhetorische Dringlichkeit und die Wiederholung von „sterben“ bleiben erhalten; unnötige Archaismen wurden vermieden.
