id: DEU.5.26
reference: Deuteronomy 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: de
  text: Denn wer von allen Menschen[a] hat wie wir die Stimme des lebendigen Gottes mitten aus dem Feuer reden hören und ist am Leben geblieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von allem Fleisch«; eine hebräische Wendung für die sterbliche Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die Furcht und Bitte des Volkes ein.
- source_word: מִי כָל בָּשָׂר
  choice: wer von allen Menschen
  rationale: Gibt die rhetorische Frage in natürlichem modernem Deutsch wieder; die wörtliche Wendung »alles Fleisch« wird in der Fußnote dokumentiert.
- source_word: קוֹל
  choice: die Stimme
  rationale: Da Gott als redend beschrieben wird, ist »Stimme« hier genauer als »Laut« oder »Schall«.
- source_word: אֱלֹהִים חַיִּים
  choice: des lebendigen Gottes
  rationale: Die formal pluralische hebräische Wendung bezeichnet im Kontext idiomatisch den einen Gott Israels.
- source_word: מְדַבֵּר
  choice: reden hören
  rationale: Die partizipiale Aussage wird zusammen mit »Stimme« durch die natürliche deutsche Konstruktion »die Stimme … reden hören« wiedergegeben.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Bewahrt anschaulich den Sinn, dass die Stimme aus dem Inneren des Feuers kam.
- source_word: כָּמֹנוּ
  choice: wie wir
  rationale: Vergleicht die einzigartige Erfahrung der Angeredeten mit der hypothetischen Erfahrung anderer Menschen, ohne den Vergleich weiter auszudeuten.
- source_word: וַיֶּחִי
  choice: und ist am Leben geblieben
  rationale: Gibt den Sinn von »leben« im Zusammenhang idiomatisch wieder, ohne ihn stärker als nötig mit »überleben« zu interpretieren.
theological_decisions:
- issue: Anthropologische Wendung כָל בָּשָׂר
  choice: allen Menschen
  alternative: allem Fleisch
  rationale: Die natürliche deutsche Wiedergabe bezeichnet die sterbliche Menschheit; die konkrete hebräische Bildsprache und ihr Bedeutungsgehalt werden in der Fußnote bewahrt.
- issue: Numerus und Bedeutung von אֱלֹהִים חַיִּים
  choice: des lebendigen Gottes
  alternative: der lebendigen Götter
  rationale: Trotz der formal pluralischen Formen ist die Wendung im unmittelbaren Kontext eine singularische Bezeichnung für Israels Gott; eine pluralische Übersetzung wäre sachlich irreführend.
- issue: Ausgang der Gottesbegegnung in וַיֶּחִי
  choice: ist am Leben geblieben
  alternative: hat überlebt
  rationale: Die gewählte Fassung bewahrt die Spannung, dass ein Mensch Gottes Stimme hört und dennoch lebt, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; »mitten aus dem Feuer« bewahrt die Anschaulichkeit des Hebräischen. Der Fußnotenmarker steht unmittelbar bei der dynamisch wiedergegebenen Wendung.
