  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: de
  text: Jahwe, unser Gott, hat am Horeb einen Bund mit uns geschlossen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hat am Horeb mit uns einen Bund geschnitten“.'
    reason: Das wörtliche hebräische Idiom wird dokumentiert, während der Haupttext die natürliche deutsche Wendung „einen Bund schließen“ verwendet.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit dem Suffix der 1. Person Plural bezeichnet unmittelbar „unseren Gott“ und bewahrt den Beziehungsbezug.
- source_word: כָּרַת ... בְּרִית
  choice: einen Bund geschlossen
  rationale: Das hebräische Idiom lautet wörtlich „einen Bund schneiden“. Im Deutschen entspricht „einen Bund schließen“ sowohl dem Sinn als auch einer natürlichen, würdigen Ausdrucksweise.
- source_word: עִמָּנוּ
  choice: mit uns
  rationale: Die Präposition mit dem Suffix der 1. Person Plural wird direkt und beziehungsbezogen wiedergegeben.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Die Ortsangabe wird im Deutschen natürlich mit „am Horeb“ ausgedrückt; der überlieferte Ortsname bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen modernen deutschen Transkription, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung hebt zunächst Jahwe und die Beziehung „unser Gott“ hervor; „einen Bund schließen“ ist idiomatisch und inhaltlich präzise.
