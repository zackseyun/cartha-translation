  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: de
  text: Sechs Tage sollst du arbeiten und all deine Arbeit verrichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sechs Tage darfst du arbeiten und all deine Arbeit verrichten.« Die hebräische Verbform kann in diesem Gesetzeskontext als Anweisung oder als Erlaubnis verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage
  rationale: Die Verbindung aus Zahlwort und Substantiv bezeichnet hier unmittelbar die Zeitdauer; im Deutschen ist dafür keine zusätzliche Präposition nötig.
- source_word: תַּעֲבֹד
  choice: sollst du arbeiten
  rationale: עבד bezeichnet in diesem Zusammenhang die gewöhnliche Arbeit. „Sollst“ gibt den anweisenden Charakter der hebräischen Imperfektform im Gesetzeskontext wieder.
- source_word: וְעָשִׂיתָ
  choice: und … verrichten
  rationale: עשה hat eine breite Bedeutung und meint hier das Ausführen der anfallenden Tätigkeiten. „Verrichten“ ist mit „Arbeit“ idiomatisch und vermeidet die schwerfällige Wiederholung „Arbeit tun“.
- source_word: כָּל
  choice: all
  rationale: כָּל bezeichnet hier die Gesamtheit der zu erledigenden Arbeit.
- source_word: מְלַאכְתֶּךָ
  choice: deine Arbeit
  rationale: מְלָאכָה bezeichnet besonders im Sabbatkontext Arbeit, Tätigkeit oder Aufgabe; „deine Arbeit“ ist die natürliche und sachlich passende Wiedergabe.
theological_decisions:
- issue: Anweisende oder erlaubende Bedeutung im Sabbatgebot
  choice: „Sechs Tage sollst du arbeiten …“
  alternative: „Sechs Tage darfst du arbeiten …“
  rationale: Im Zusammenhang des Bundesgesetzes liegt eine anweisende Lesart nahe. Die hebräische Imperfektform kann hier jedoch auch erlaubend verstanden werden; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular entspricht den hebräischen Formen. „Arbeit verrichten“ bewahrt die Unterscheidung zwischen עבד und עשה, ohne im Deutschen unnatürlich zu wirken.
