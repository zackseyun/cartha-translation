source:
  edition: WLC
  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: de
  text: Diese Worte sprach Jahwe auf dem Berg zu eurer ganzen Versammlung, mitten aus dem Feuer, der Wolke und dem dichten Dunkel, mit lauter Stimme; er fügte nichts weiter hinzu.[a] Dann schrieb er sie auf zwei Steintafeln und gab sie mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er fuhr nicht fort“. Die hebräische Wendung kann bedeuten, dass er nichts weiter hinzufügte oder dass er nicht weitersprach.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Gottesnamens gibt das Tetragramm als persönlichen Namen wieder, statt es durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: Diese Worte
  rationale: „Worte“ bewahrt den Bezug auf das zuvor von Gott Gesprochene und legt den Ausdruck nicht vorschnell auf „Gebote“ fest.
- source_word: כָּל קְהַלְכֶם
  choice: eure ganze Versammlung
  rationale: קָהָל bezeichnet hier die versammelte Gemeinschaft Israels; „Versammlung“ ist verständlich und gibt den kollektiven Sinn unmittelbar wieder.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: mitten aus dem Feuer, der Wolke und dem dichten Dunkel
  rationale: „Mitten aus“ gibt מִתּוֹךְ anschaulich wieder; „dichtes Dunkel“ bewahrt die Bedeutung von עֲרָפֶל als undurchdringliches Dunkel beziehungsweise Finsternis.
- source_word: קוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Wörtlich steht „mit großer Stimme“; „mit lauter Stimme“ ist im Deutschen natürlich und vermittelt die Stärke der hörbaren Gottesrede.
- source_word: וְלֹא יָסָף
  choice: er fügte nichts weiter hinzu
  rationale: Die Wendung kann bedeuten, dass Jahwe nichts weiter hinzufügte oder dass er nicht fortfuhr. Die Hauptfassung wahrt den Bezug auf die abgeschlossene öffentliche Verkündigung; die andere Deutung wird in der Fußnote genannt.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: zwei Steintafeln
  rationale: Die natürliche deutsche Zusammensetzung gibt die beiden Tafeln aus Stein knapp und genau wieder.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: und gab sie mir
  rationale: Die Form führt die Handlung fort; Jahwe bleibt das Subjekt, und das Pronomen nimmt die beschriebenen Tafeln beziehungsweise das darauf Geschriebene auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den offenbarten persönlichen Namen im Haupttext, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von וְלֹא יָסָף
  choice: er fügte nichts weiter hinzu
  alternative: und er fuhr nicht fort
  rationale: Beide Auffassungen sind sprachlich möglich. Die Hauptfassung betont, dass zu diesen öffentlich gesprochenen Worten nichts hinzukam; die Fußnote erhält die echte Mehrdeutigkeit, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Satzführung. „Jahwe“ folgt der im Deutschen üblichen Form des Gottesnamens. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Anmerkung bezieht.
