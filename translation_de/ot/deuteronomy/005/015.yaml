  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: de
  text: 'Und denke daran: Du warst ein Sklave im Land Ägypten, und Jahwe, dein Gott, führte dich von dort mit starker Hand und ausgestrecktem Arm heraus. Darum hat Jahwe, dein Gott, dir geboten, den Sabbattag zu halten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Sabbattag zu tun“; gemeint ist, ihn zu halten beziehungsweise zu befolgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Und denke daran
  rationale: Gibt die an den vorausgehenden Zusammenhang anknüpfende, auffordernde Kraft der Form natürlich wieder.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Bezeichnet hier Israels unfreie, bedrückende Lage in Ägypten deutlicher als das mehrdeutige „Diener“.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Bewahrt den konkreten hebräischen Ausdruck und ist im Deutschen verständlich.
- source_word: וַיֹּצִאֲךָ
  choice: führte dich ... heraus
  rationale: Natürliche deutsche Wiedergabe des Hiphil von יצא im Exoduszusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Bewahrt das hebräische Bild und bildet חֲזָקָה unmittelbar ab.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: und ausgestrecktem Arm
  rationale: Bewahrt das parallele Bild der machtvollen Befreiung; die Präposition wird im Deutschen für beide Glieder gemeinsam verwendet.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Markiert knapp und klar die Folgerung von der Befreiung zum Sabbatgebot.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: den Sabbattag zu halten
  rationale: Das wörtliche „den Sabbattag zu tun“ ist im Deutschen nicht idiomatisch; „halten“ gibt die gemeinte Befolgung würdig und geläufig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als Gottesnamen; „Jahwe“ macht diesen Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von עֶבֶד für Israels Lage in Ägypten
  choice: Sklave
  alternative: Diener
  rationale: Der Zusammenhang von Unterdrückung und Befreiung macht den Status der Versklavung theologisch und ethisch wesentlich.
- issue: Verhältnis von Befreiung und Sabbatgebot
  choice: Darum
  alternative: Deshalb
  rationale: Die kausale Folgerung des Textes bleibt ausdrücklich erhalten, ohne näher zu bestimmen, wie die Befreiung jedes einzelne Element des Sabbatgebots begründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular, entsprechend den hebräischen Formen. Die traditionellen Machtbilder „starke Hand“ und „ausgestreckter Arm“ bleiben erhalten. Der Doppelpunkt nach der Erinnerungsaufforderung macht den Inhaltsanschluss im Deutschen klar.
