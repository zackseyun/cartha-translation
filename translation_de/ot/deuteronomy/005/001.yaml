base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: de
  text: 'Da rief Mose ganz Israel zusammen und sagte zu ihnen: »Höre[a], Israel, die Ordnungen und Rechtsbestimmungen[b], die ich euch heute verkünde. Lernt sie und haltet sie, indem ihr sie befolgt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hör zu“. Das hebräische Verb meint hier aufmerksames Hören, das auf Gehorsam ausgerichtet ist, nicht nur akustisches Wahrnehmen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch mit „Rechtssprüche“, „Rechtsordnungen“ oder „Vorschriften“ wiedergegeben werden; es bezeichnet verbindliche rechtliche Entscheidungen oder Normen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zusammen
  rationale: קרא bezeichnet hier das Herbeirufen der versammelten Gemeinschaft. „Zusammenrufen“ gibt den erzählerischen Sinn im modernen Deutschen natürlicher wieder als das bloße „rufen“.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive Bezeichnung des gesamten Bundesvolkes bleibt erhalten; „ganz Israel“ ist idiomatisches, würdevolles Deutsch.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Höre, Israel
  rationale: Der Singular spricht Israel als kollektive Einheit an. „Höre“ bewahrt den feierlichen Bundesappell und umfasst im Kontext aufmerksames, zum Gehorsam führendes Hören.
- source_word: הַחֻקִּים
  choice: die Ordnungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften. „Ordnungen“ ist verständlich und hält den Begriff von מִשְׁפָּטִים unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann Rechtssprüche, Rechtsnormen oder verbindliche Regelungen bezeichnen. „Rechtsbestimmungen“ wahrt die juristische Färbung, ohne den Sinn unnötig auf einzelne Gerichtsurteile einzuengen.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: die ich heute vor euch ausspreche
  rationale: Der hebräische Ausdruck lautet wörtlich etwa „die ich heute vor euren Ohren rede“. Die gewählte Form erhält die unmittelbare, öffentlich hörbare Verkündigung in natürlichem Deutsch.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Lernt sie
  rationale: למד fordert dazu auf, die Bestimmungen aufzunehmen und sich anzueignen. Das direkte „Lernt sie“ entspricht der knappen hebräischen Aufforderung.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: achtet darauf, sie auszuführen
  rationale: שמר mit dem folgenden Infinitiv verlangt sorgfältiges Beachten mit dem Ziel praktischer Umsetzung. Diese Formulierung gibt den Zusammenhang im heutigen Deutschen klar wieder, ohne Hören und Tun voneinander zu lösen.
theological_decisions:
- issue: Bundesrechtliche Wortpaarung חֻקִּים / מִשְׁפָּטִים
  choice: Ordnungen und Rechtsbestimmungen
  alternative: Satzungen und Rechtssprüche
  rationale: Die beiden verwandten, aber nicht identischen Rechtsbegriffe werden getrennt wiedergegeben. Zugleich wird מִשְׁפָּטִים nicht vorschnell auf gerichtliche Einzelentscheidungen beschränkt.
- issue: Bedeutungsweite des Bundesappells שְׁמַע
  choice: Höre
  alternative: Hör zu
  rationale: „Höre“ bewahrt den literarischen und theologischen Nachdruck des Aufrufs. Die mögliche Bedeutung aufmerksamen, gehorsamsbereiten Hörens wird nicht in den Haupttext hineinerklärt, sondern in einer Fußnote kenntlich gemacht.
- issue: Verhältnis von Bewahren und Tun in וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: achtet darauf, sie auszuführen
  alternative: bewahrt sie, um sie zu tun
  rationale: Die Übersetzung wahrt den Zielbezug auf tatsächlichen Vollzug, vermeidet aber eine im Deutschen missverständliche oder unnatürliche wörtliche Konstruktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Singular „Höre, Israel“ bleibt erhalten, während die anschließenden Pluralformen die einzelnen Angehörigen des Volkes ansprechen. Die Rechtsbegriffe werden verständlich, aber bewusst voneinander unterschieden wiedergegeben.
