  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: de
  text: Du sollst all ihre Beute mitten auf ihrem öffentlichen Platz zusammentragen und die Stadt samt all ihrer Beute im Feuer verbrennen, als vollständige Opfergabe[a] für den HERRN, deinen Gott. Sie soll für immer ein Trümmerhügel bleiben[b] und nie wieder aufgebaut werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig für den HERRN, deinen Gott“. Das hebräische Wort kann adverbial „ganz, vollständig“ bedeuten oder kultisch verstanden werden: als etwas, das Gott ganz hingegeben und vollständig verbrannt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Hügel für immer“, also ein dauerhaft bestehender Ruinen- oder Trümmerhügel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: ihre Beute
  rationale: שָׁלָל bezeichnet erbeutete Güter. „Beute“ ist im Deutschen knapp, geläufig und dem rechtlich-kriegerischen Zusammenhang angemessen.
- source_word: תִּקְבֹּץ
  choice: du sollst … zusammentragen
  rationale: Das Qal-Imperfekt 2. Person Singular hat hier anweisenden Charakter. „Zusammentragen“ gibt sowohl das Sammeln als auch das Verbringen an einen gemeinsamen Ort wieder.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: mitten auf ihrem freien Platz
  rationale: רְחוֹב bezeichnet hier einen breiten öffentlichen Platz innerhalb der Stadt, nicht bloß eine Straße. „Freier Platz“ ist verständlich und bewahrt den räumlichen Charakter.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: im Feuer verbrennen
  rationale: Die deutsche Wendung gibt das hebräische Mittel bzw. die Art der vollständigen Zerstörung natürlich und quellennah wieder.
- source_word: כָּלִיל
  choice: als vollständige Opfergabe
  rationale: כָּלִיל kann adverbial „vollständig“ bedeuten, besitzt hier vor לַיהוָה aber wahrscheinlich auch kultische Färbung. Die Formulierung bewahrt beides, ohne die Stadt ausdrücklich mit dem technischen Tieropferbegriff „Brandopfer“ gleichzusetzen.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition ל kennzeichnet hier die Weihung bzw. Bestimmung für Gott. Der Gottesname יהוה wird traditionsgemäß als „der HERR“ wiedergegeben.
- source_word: תֵּל עוֹלָם
  choice: für immer ein Trümmerhügel
  rationale: תֵּל bezeichnet einen Hügel oder Haufen, häufig aus Ruinen; עוֹלָם drückt hier dauernden Bestand aus. „Trümmerhügel“ bewahrt das konkrete Bild.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: nie wieder aufgebaut werden
  rationale: Das Nifal von בנה mit עוֹד bezeichnet, dass die Stadt künftig nicht erneut errichtet werden darf bzw. wird. „Nie wieder“ ist im modernen Deutsch prägnant und eindeutig.
theological_decisions:
- issue: Kultische Bedeutung von כָּלִיל beim Verbrennen der Stadt
  choice: „als vollständige Opfergabe für den HERRN, deinen Gott“
  alternative: „vollständig für den HERRN, deinen Gott“
  rationale: Die gewählte Fassung erhält die mögliche Opfer- und Weihebedeutung, lässt durch die Fußnote aber die grammatisch mögliche rein adverbiale Lesart ausdrücklich offen. Der technisch engere Ausdruck „Ganzbrandopfer“ wird vermieden, da hier eine Stadt und kein reguläres Tieropfer gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Gesetzesstil. Die direkte Anrede im Singular bleibt erhalten. „Samt“ bündelt Stadt und Beute natürlich; die Fußnoten markieren die echte Mehrdeutigkeit von כָּלִיל und das konkrete Bild von תֵּל עוֹלָם.
