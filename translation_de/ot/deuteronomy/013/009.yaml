base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: de
  text: Du sollst ihm nicht nachgeben und nicht auf ihn hören. Dein Auge soll kein Mitleid mit ihm haben; du sollst ihn weder schonen noch verbergen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Schuld verschweigen“. Wörtlich: „ihn bedecken“; gemeint sein kann, ihn oder seine Schuld zu verbergen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לּוֹ
  choice: ihm nachgeben
  rationale: אָבָה bezeichnet hier das Bereitsein, Einwilligen oder Nachgeben gegenüber der Verführung. „Ihm nachgeben“ ist im Deutschen natürlich und wahrt den Zusammenhang.
- source_word: תִשְׁמַע אֵלָיו
  choice: auf ihn hören
  rationale: שׁמע mit אֶל meint hier auf jemanden hören beziehungsweise ihm Gehör schenken, nicht bloß akustisch hören und auch nicht zwingend bereits gehorchen.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: dein Auge soll kein Mitleid mit ihm haben
  rationale: Die ausdrückliche Erwähnung des Auges bewahrt das hebräische Bild; חוּס trägt den Sinn von Mitleid haben oder schonen.
- source_word: תַחְמֹל
  choice: ihn schonen
  rationale: חמל bezeichnet Mitleid beziehungsweise Verschonung. „Schonen“ unterscheidet diesen Ausdruck vom vorhergehenden Bild des mitleidigen Auges und erhält die steigernde Reihung.
- source_word: תְכַסֶּה עָלָיו
  choice: ihn decken
  rationale: כסה im Piel mit עַל kann bedeuten, jemanden zu decken, also ihn oder seine Schuld verborgen zu halten. Das deutsche „decken“ bewahrt die mögliche personale und rechtlich relevante Bedeutung.
theological_decisions:
- issue: Strenge bundesrechtliche Sprache gegenüber dem Verführer zum Abfall
  choice: Die unmittelbare Folge der Verbote wird ohne Abschwächung beibehalten.
  alternative: Die Aussage lediglich als allgemeine Missbilligung oder als Verbot emotionaler Anteilnahme wiederzugeben.
  rationale: Der hebräische Rechtstext untersagt nacheinander Nachgeben, Hören, Mitleid, Schonung und Verdeckung. Eine weichere Paraphrase würde die Schärfe und kumulative Wirkung des Ausgangstextes mindern.
- issue: Bedeutung von תְכַסֶּה עָלָיו
  choice: „ihn decken“ mit erklärender Fußnote
  alternative: „ihn verbergen“ oder eindeutig „seine Schuld verschweigen“
  rationale: Die Formulierung kann sich auf das Verbergen beziehungsweise Schützen der Person oder auf das Verdecken ihrer Schuld beziehen. Die Übersetzung lässt diese sachliche Spannweite bestehen, statt sie einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Verbote und das hebräische Bild vom Auge bleiben erhalten; ein Semikolon gliedert die kumulative Reihe, ohne sie abzuschwächen.
