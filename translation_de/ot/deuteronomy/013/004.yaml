source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: de
  text: Du sollst nicht auf die Worte jenes Propheten oder auf den Träumer jenes Traums[a] hören; denn Jahwe, euer Gott, stellt euch auf die Probe, um zu erkennen, ob ihr Jahwe, euren Gott, mit eurem ganzen Herzen und mit eurer ganzen Seele[b] liebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Träumer jenes Traums“. Die hebräische Wendung verbindet ein Wort für „Träumer“ mit „Traum“; sie bezeichnet nicht ausdrücklich einen Traumdeuter.'
    reason: lexical_alternative
  - marker: b
    text: „Seele“ kann hier auch „Leben“, „Selbst“ oder „ganzes Wesen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Du sollst nicht auf … hören
  rationale: שׁמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten bzw. Befolgen. Die deutsche Wendung „auf jemanden hören“ bewahrt beide Aspekte. Der Numeruswechsel vom Singular „du“ zum Plural „euch/ihr“ bleibt erhalten.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Die Grundbedeutung von דָּבָר wird formal und im Deutschen verständlich wiedergegeben, ohne den Ausdruck interpretierend zu „Botschaft“ zu erweitern.
- source_word: הַנָּבִיא הַהוּא
  choice: jenes Propheten
  rationale: Artikel und Demonstrativum kennzeichnen den zuvor genannten Propheten; „jenes“ gibt diesen Rückverweis knapp wieder.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: jenes Traumträumers
  rationale: Die auffällige hebräische Verbindung aus dem Partizip „träumend/Träumer“ und „jener Traum“ wird bewusst nicht zu „Traumdeuter“ umgedeutet. Eine Fußnote erläutert die wörtliche Form.
- source_word: מְנַסֶּה
  choice: stellt euch auf die Probe
  rationale: Das Piel von נסה bedeutet „prüfen, erproben, auf die Probe stellen“. Die gewählte Wendung ist natürliches modernes Deutsch und bewahrt den evaluativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָדַעַת
  choice: um zu erkennen
  rationale: Der Zweckinfinitiv wird eng am Wortlaut übersetzt. Die mögliche theologische Spannung der Aussage wird nicht durch „um sichtbar zu machen“ oder eine ähnliche Deutung aufgelöst.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: ob ihr … liebt
  rationale: Die Fragepartikel mit dem Partizip bezeichnet den bestehenden bzw. fortdauernden Zustand des Liebens. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: בְּכָל לְבַבְכֶם
  choice: mit eurem ganzen Herzen
  rationale: לֵבָב umfasst das innere Denken, Wollen und Empfinden; „Herz“ bewahrt die etablierte Bundes- und Beziehungssprache.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: und mit eurer ganzen Seele
  rationale: נֶפֶשׁ kann auch „Leben“, „Selbst“ oder „Wesen“ bedeuten. „Seele“ wahrt hier die traditionelle und intertextuell bedeutsame Verbindung mit „Herz“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Gottes Prüfung „um zu erkennen“
  choice: Die anthropomorphe Formulierung bleibt unverändert erhalten.
  alternative: „um offenbar zu machen“ oder „um euch erkennen zu lassen“
  rationale: Der hebräische Text sagt ausdrücklich לָדַעַת, „um zu erkennen/zu wissen“. Eine erklärende Umformulierung würde die theologische Spannung eigenmächtig auflösen.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: „Du sollst … euer Gott … euch … ihr“
  alternative: 'Durchgehend pluralisch: „Ihr sollt …“'
  rationale: Der hebräische Text wechselt von der singularischen Verbform תִשְׁמַע zu pluralischen Suffixen und Formen. Dieser auffällige Wechsel wird nicht stillschweigend vereinheitlicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der ungewöhnliche Numeruswechsel und die anthropomorphe Zweckangabe werden bewahrt. „Traumträumer“ ist bewusst leicht fremdartig, um die markante hebräische Wortverbindung sichtbar zu halten; die Fußnote bietet die wörtliche Analyse.
