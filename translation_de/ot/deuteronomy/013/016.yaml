base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: de
  text: Du sollst die Bewohner jener Stadt ganz gewiss mit dem Schwert erschlagen. Weihe die Stadt, alles, was in ihr ist, und ihr Vieh dem Bann[a] und vernichte sie mit dem Schwert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gib sie der vollständigen Vernichtung preis.“ Das hebräische Verb bezeichnet, etwas unwiderruflich dem Bann und damit der Vernichtung zu übergeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit dem Mund des Schwertes“; eine hebräische Wendung für das Töten oder Vernichten mit dem Schwert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: Du sollst … ganz gewiss … erschlagen
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt die Aufforderung. „Ganz gewiss“ gibt den Nachdruck wieder; „erschlagen“ entspricht im Zusammenhang mit dem Schwert der tödlichen Bedeutung.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: die Bewohner jener Stadt
  rationale: Das Partizip bezeichnet die dort wohnende Bevölkerung. „Bewohner“ ist gegenwärtiges, klares Standarddeutsch; „jener“ wahrt den rückverweisenden Charakter von הַהוּא.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die Wendung bedeutet wörtlich „mit/nach dem Mund des Schwertes“. Die deutsche Formulierung bewahrt das konkrete Bild und vermittelt zugleich den idiomatischen Sinn.
- source_word: הַחֲרֵם
  choice: Vollstrecke … den Bann
  rationale: Das Hifil von חרם bezeichnet hier die unwiderrufliche Aussonderung zur Vernichtung. „Den Bann vollstrecken“ erhält den kultisch-rechtlichen Gehalt, ohne ihn auf bloßes militärisches Zerstören zu reduzieren.
- source_word: אֹתָהּ וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: an der Stadt … ebenso an allem, was in ihr ist
  rationale: Das feminine Pronomen bezieht sich auf die Stadt. Die Wiederaufnahme als „der Stadt“ beseitigt im Deutschen eine mögliche unklare Pronomenreferenz und wahrt den Umfang der Aussage.
- source_word: בְּהֶמְתָּהּ
  choice: ihrem Vieh
  rationale: בְּהֵמָה bezeichnet kollektiv die Nutz- und Haustiere. „Vieh“ ist im Deutschen präzise und lässt sich als Kollektivum mit dem singularischen Pronomen „es“ aufnehmen.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang von Krieg und Gericht
  choice: den Bann vollstrecken
  alternative: vollständig vernichten
  rationale: Die gewählte Formulierung bewahrt die sakrale Dimension der unwiderruflichen Aussonderung zur Vernichtung und lässt die theologische Spannung des Begriffs bestehen.
- issue: Härte des Gerichtsgebots
  choice: Die uneingeschränkte Gewalt- und Vernichtungssprache bleibt erhalten.
  alternative: Abschwächende Wiedergaben wie „besiegen“ oder „unschädlich machen“
  rationale: Der hebräische Text formuliert ein schweres, umfassendes Gebot. Eine mildere Wortwahl würde die Aussage interpretierend abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Aufforderung und die Wiederholung der Schwertformel werden bewahrt. Der zweite Satz entfaltet die dichte hebräische Koordination leicht, damit Bezug und Umfang im Deutschen klar bleiben.
