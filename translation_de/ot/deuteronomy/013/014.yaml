  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: de
  text: 'Aus deiner Mitte sind nichtsnutzige Männer[a] hervorgetreten und haben die Bewohner ihrer Stadt auf Abwege gebracht, indem sie sagten: »Lasst uns gehen und anderen Göttern dienen, die ihr nicht gekannt habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne der Nichtsnutzigkeit«; traditionell: »Söhne Belials«.'
    reason: Die Fußnote dokumentiert die hebräische Idiomatik und die traditionelle Wiedergabe, während der Haupttext ihre Bedeutung verständlich ausdrückt.
lexical_decisions:
- source_word: יָצְאוּ
  choice: sind … hervorgetreten
  rationale: Das Qal Perfekt bezeichnet hier das Auftreten von Unruhestiftern aus der Gemeinschaft selbst; das deutsche Perfekt passt zum berichteten Sachverhalt im Bedingungsgefüge des Kontextes.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: nichtsnutzige Männer
  rationale: אֲנָשִׁים ist ausdrücklich maskulin; בְּנֵי בְלִיַּעַל ist eine idiomatische Bezeichnung für moralisch verdorbene oder gesetzlose Männer, ohne dass בְלִיַּעַל hier als Eigenname verstanden werden muss.
- source_word: מִקִּרְבְּךָ
  choice: aus deiner Mitte
  rationale: Die Formulierung bewahrt die singularische Anrede und betont, dass die Männer aus der eigenen Gemeinschaft stammen.
- source_word: וַיַּדִּיחוּ
  choice: haben … auf Abwege gebracht
  rationale: Der Hifil von נדח bezeichnet hier das Veranlassen religiöser Abkehr; die Formulierung gibt sowohl das Irreführen als auch dessen apostatischen Zusammenhang wieder.
- source_word: יֹשְׁבֵי עִירָם
  choice: die Bewohner ihrer Stadt
  rationale: Die partizipiale Wendung bezeichnet die in ihrer Stadt Wohnenden; „Bewohner“ ist präzise und gegenwärtiges Standarddeutsch.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Lasst uns gehen und … dienen
  rationale: Die Kohortative drücken eine gemeinsame Aufforderung aus. „Dienen“ erhält die umfassende bundesbezogene Bedeutung von עבד und verengt sie nicht auf einen einzelnen Kultakt.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die direkte und im Deutschen natürliche Wiedergabe der festen deuteronomischen Wendung.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: die ihr nicht gekannt habt
  rationale: „Gekannt“ bewahrt die mögliche relationale Nuance von ידע und die pluralische Anrede; das Relativpronomen bezieht sich grammatisch eindeutig auf die anderen Götter.
theological_decisions:
- issue: Deutung von בְּנֵי בְלִיַּעַל
  choice: nichtsnutzige Männer
  alternative: Söhne Belials
  rationale: Die Wendung fungiert in diesem Kontext als Idiom für verdorbene oder gesetzlose Menschen. Eine Wiedergabe mit dem Eigennamen „Belial“ könnte spätere personifizierende oder dämonologische Vorstellungen in den Text eintragen, die dieser Vers nicht ausdrücklich voraussetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; singularische und pluralische Anredeformen des Hebräischen bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
