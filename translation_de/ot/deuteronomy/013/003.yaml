base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: de
  text: 'und das Zeichen oder Wunder, von dem er zu dir gesprochen hat, trifft ein[a], mit den Worten: »Lasst uns anderen Göttern folgen, die du nicht gekannt hast[b], und ihnen dienen[c]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und das Zeichen und das Wunder … treffen ein«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die dir unbekannt waren«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »und sie verehren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: trifft ein
  rationale: Das Verb bedeutet wörtlich »kommt«; in Verbindung mit einem angekündigten Zeichen oder Wunder bezeichnet »trifft ein« im Deutschen natürlich, dass das Vorausgesagte tatsächlich geschieht.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: das Zeichen oder Wunder
  rationale: Die hebräische Wortpaarung kann idiomatisch zwei Arten bestätigender Ereignisse bezeichnen. »Zeichen oder Wunder« ist im Deutschen natürlich; das wörtliche »Zeichen und Wunder« bleibt als Alternative in der Fußnote erhalten.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: von dem er zu dir gesprochen hat
  rationale: Die Formulierung bewahrt den Relativsatz und gibt die Rede an den Angesprochenen in natürlichem Deutsch wieder.
- source_word: לֵאמֹר
  choice: und er sagt
  rationale: Der Infinitiv leitet den Inhalt der Rede ein. Eine finite Form macht im Deutschen eindeutig, dass die folgende Aufforderung zum Reden des Zeichengebers gehört.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Lasst uns … folgen
  rationale: Die Kohortativform drückt eine gemeinsame Aufforderung aus. »Folgen« gibt die hebräische Wendung »hinter jemandem hergehen« und ihre Bedeutung religiöser Gefolgschaft idiomatisch wieder.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe der deuteronomischen Bundesformel.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: die du nicht gekannt hast
  rationale: »Kennen« bewahrt die mögliche Bedeutung von Bekanntschaft beziehungsweise Anerkennung, ohne sie näher auszudeuten. Das deutsche Relativpronomen »die« ist grammatisch durch das maskuline Pluralwort »Götter« vorgegeben und entscheidet nicht über deren Wirklichkeit oder Personalität.
- source_word: וְנָעָבְדֵם
  choice: und ihnen dienen
  rationale: עבד bezeichnet hier religiösen Dienst. »Dienen« bleibt nah am Hebräischen und bewahrt den weiteren bundesbezogenen Sinn; »verehren« ist eine passende kontextuelle Alternative.
theological_decisions:
- issue: Darstellung der anderen Götter
  choice: anderen Göttern … die du nicht gekannt hast
  alternative: anderen Gottheiten … die dir unbekannt waren
  rationale: Die Übersetzung gibt die Verlockung zum Götzendienst wieder, ohne über Wirklichkeit oder Personalität dieser Götter eine Aussage einzuführen, die der Vers selbst nicht ausdrücklich macht.
- issue: Bedeutung des religiösen Dienstes
  choice: ihnen dienen
  alternative: sie verehren
  rationale: »Dienen« wahrt die im hebräischen עבד liegende Bundes- und Loyalitätsdimension, während die Fußnote die eindeutig kultische Sinnmöglichkeit »verehren« nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängige Fortsetzung des vorhergehenden Verses mit kleingeschriebenem »und« eröffnet. Die direkte Rede ist klar gegliedert; »Lasst uns« ist allgemein verständlich, und »dienen« erhält den biblischen Bundeswortschatz ohne konfessionelle Zusätze.
