source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: de
  text: Doch jener Prophet oder jener Träumer soll getötet werden, denn er hat Auflehnung gegen Jahwe, euren Gott, verkündet, der euch aus dem Land Ägypten herausgeführt und dich aus dem Sklavenhaus erlöst hat, indem er dich von dem Weg abzubringen versuchte, auf dem zu gehen Jahwe, dein Gott, dir geboten hat. So sollst du das Böse aus deiner Mitte beseitigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: Doch jener Prophet
  rationale: Das Waw nimmt den vorigen Rechtsfall auf und hat hier adversativ-resümierende Kraft. „Jener“ bewahrt die demonstrative Hervorhebung.
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: oder jener Traumseher
  rationale: Die wörtliche Wendung „Träumer jenes Traums“ bezeichnet idiomatisch jemanden, der sich auf einen Traum beruft. „Traumseher“ ist im Deutschen knapp und verständlich.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Der Hophal bezeichnet nicht bloß das Sterben, sondern eine veranlasste, im Kontext gerichtliche Tötung.
- source_word: כִּי דִבֶּר סָרָה עַל יְהוָה אֱלֹהֵיכֶם
  choice: denn er hat zum Abfall von Jahwe, eurem Gott, aufgerufen
  rationale: סָרָה bezeichnet Abkehr, Auflehnung oder Abfall von der Bundestreue. „Zum Abfall … aufgerufen“ gibt den Sinn der ungewöhnlichen Verbindung דִבֶּר סָרָה natürlich wieder, ohne ihn auf bloß anstößige Rede zu verengen.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: der euch aus dem Land Ägypten herausgeführt hat
  rationale: Bewahrt die typische Exodusformel und den pluralischen Bezug.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: und aus dem Sklavenhaus befreit hat
  rationale: פּדה bedeutet loskaufen, erlösen oder befreien. „Sklavenhaus“ bewahrt das konkrete Bild von בֵּית עֲבָדִים und ist im Deutschen idiomatischer als „Haus der Sklaven“.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: Er wollte dich von dem Weg abbringen
  rationale: Der Hiphil von נדח bezeichnet ein Wegtreiben oder Verleiten. Der Singular des hebräischen Textes bleibt erhalten.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: auf dem zu gehen Jahwe, dein Gott, dir geboten hat
  rationale: „Gehen auf dem Weg“ bewahrt die deuteronomische Metapher für die Lebensführung.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: So sollst du das Böse aus deiner Mitte beseitigen
  rationale: בער ist in dieser deuteronomischen Rechtsformel das entschiedene Entfernen des Bösen; „beseitigen“ ist natürlich und sachlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im Deutschen unmittelbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von סָרָה
  choice: Abfall
  alternative: Auflehnung
  rationale: Im Zusammenhang mit dem Versuch, Israel von Jahwes Weg wegzuführen, bezeichnet das Wort die Abkehr von der Bundestreue. „Abfall“ hält diese religiös-politische Spannung fest; die Fußnote nennt die ebenfalls mögliche Nuance „Auflehnung“.
- issue: Wechsel zwischen Plural und Singular der Anrede
  choice: euch … dich/dein/dir
  alternative: durchgehend pluralische Anrede
  rationale: Der masoretische Text wechselt bewusst von der Gemeinschaft im Plural zur kollektiv-distributiven Anrede im Singular. Die Übersetzung glättet diesen Wechsel nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ernst. Die deuteronomische Weg-Metapher und der Wechsel von pluralischer zu singularischer Anrede bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar an der erklärten Wendung.
