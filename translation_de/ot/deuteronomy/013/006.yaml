revisions:
- from: Doch jener Prophet oder jener Traumseher soll getötet werden, denn er hat zum Abfall von Jahwe, eurem Gott, aufgerufen[a], der euch aus dem Land Ägypten herausgeführt und aus dem Sklavenhaus befreit hat. Er wollte dich von dem Weg abbringen, auf dem zu gehen Jahwe, dein Gott, dir geboten hat. So sollst du das Böse aus deiner Mitte beseitigen.
  to: Doch jener Prophet oder jener Träumer soll getötet werden, denn er hat Auflehnung gegen Jahwe, euren Gott, verkündet, der euch aus dem Land Ägypten herausgeführt und dich aus dem Sklavenhaus erlöst hat, indem er dich von dem Weg abzubringen versuchte, auf dem zu gehen Jahwe, dein Gott, dir geboten hat. So sollst du das Böse aus deiner Mitte beseitigen.
  rationale: Die Revision bewahrt den im Hebräischen vorhandenen Wechsel von pluralischer zu singularischer Anrede auch bei „erlöst“. Sie ersetzt das ungebräuchliche „Traumseher“ durch das natürliche „Träumer“ und bindet den Finalgedanken ausdrücklich an die Handlung des Propheten bzw. Träumers. Die Fußnote wird an die revidierte Hauptlesart angepasst und bewahrt die lexikalische Ambiguität von סָרָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:55:05Z'
review_pass:
  verdict: revise
  source_fidelity: Die rechtliche Tötungsformel, die Exodusbegründung, die Wegmetapher und die abschließende Rechtsformel sind grundsätzlich treffend wiedergegeben. Eine Korrektur ist nötig, weil der masoretische Text innerhalb der Exodusbegründung von „euch“ zu singularischem „dich“ wechselt; die Fassung glättet diesen Wechsel bei „erlöst/befreit“ unzutreffend. Außerdem ist „Er wollte dich“ als selbstständiger Satz weniger eng an die vorausgehende Anklage gebunden als der hebräische Finalausdruck.
  naturalness: „Traumseher“ ist im modernen Standarddeutsch ungebräuchlich und kann eher einen Seher als einen Menschen, der träumt, bezeichnen. „Träumer“ ist natürlich und im biblisch-rechtlichen Register verständlich. Die Umformung mit „indem er dich ... abzubringen versuchte“ stellt den Zweck eindeutig dem Propheten bzw. Träumer zu, nicht Jahwe.
  terminology: „Jahwe“, „Sklavenhaus“, „das Böse ... beseitigen“ und „auf dem ... zu gehen“ sind angemessen. Für סָרָה ist „Auflehnung gegen Jahwe verkündet“ eine quellennahe, idiomatische Wiedergabe; die Fußnote kann die Nuance „Abfall“ transparent machen.
  issues:
  - severity: medium
    issue: Der Singular von וְהַפֹּדְךָ wird nicht erhalten.
    rationale: Nach dem pluralischen „euch ... herausgeführt“ lautet das hebräische Suffix bei „erlöst“ singularisch („dich“). Die Übersetzung verwendet dort nochmals „euch“, obwohl ihre eigenen Entscheidungen den Wechsel ausdrücklich bewahren wollen.
  - severity: medium
    issue: „Er wollte dich ... abbringen“ ist syntaktisch und semantisch zu locker angeschlossen.
    rationale: לְהַדִּיחֲךָ ist ein Finalausdruck, der das aufrührerische Reden als auf die Abbringung zielend kennzeichnet. Als neuer Hauptsatz wird die enge Begründungs- und Zweckbeziehung abgeschwächt; zudem ist das Pronomen „Er“ nach der Relativkonstruktion potenziell weniger klar.
  - severity: low
    issue: „Traumseher“ ist kein geläufiger moderner Ausdruck für חֹלֵם הַחֲלוֹם.
    rationale: „Träumer“ gibt den Kernbegriff natürlich wieder. Die hebräische Verstärkung durch das Objekt „den Traum“ muss im Deutschen nicht mechanisch reproduziert werden.
  revised_text: Doch jener Prophet oder jener Träumer soll getötet werden, denn er hat Auflehnung gegen Jahwe, euren Gott, verkündet, der euch aus dem Land Ägypten herausgeführt und dich aus dem Sklavenhaus erlöst hat, indem er dich von dem Weg abzubringen versuchte, auf dem zu gehen Jahwe, dein Gott, dir geboten hat. So sollst du das Böse aus deiner Mitte beseitigen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „denn er hat Abfall von Jahwe, eurem Gott, verkündet“. Das hebräische Wort bezeichnet Auflehnung oder Abkehr von der Bundestreue.'
    reason: lexical_alternative
  revision_rationale: Die Revision bewahrt den im Hebräischen vorhandenen Wechsel von pluralischer zu singularischer Anrede auch bei „erlöst“. Sie ersetzt das ungebräuchliche „Traumseher“ durch das natürliche „Träumer“ und bindet den Finalgedanken ausdrücklich an die Handlung des Propheten bzw. Träumers. Die Fußnote wird an die revidierte Hauptlesart angepasst und bewahrt die lexikalische Ambiguität von סָרָה.
