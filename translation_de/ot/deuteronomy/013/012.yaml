  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: de
  text: Und ganz Israel wird es hören und sich fürchten und keine solche böse Tat mehr in deiner Mitte[a] begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“. Im Hebräischen wird Israel als ein einziges Volk in der Einzahl angesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Und ganz Israel
  rationale: כָּל mit dem Eigennamen Israel bezeichnet das gesamte Volk als Einheit. „Ganz Israel“ ist im Deutschen natürlich und bewahrt den kollektiven Sinn.
- source_word: יִשְׁמְעוּ
  choice: soll es hören
  rationale: Das Qal-Imperfekt hat im rechtlichen Zusammenhang Folge- und Zielcharakter. Das ergänzte „es“ verweist natürlich auf das zuvor berichtete Gerichtsgeschehen.
- source_word: וְיִרָאוּן
  choice: und sich fürchten
  rationale: ירא bezeichnet hier eine Furcht, die von einer Wiederholung abschrecken soll. „Sich fürchten“ gibt dies knapp wieder, ohne die Stärke des Gefühls näher festzulegen.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: Sie sollen … nicht noch einmal … begehen
  rationale: יסף mit Infinitiv bedeutet hier, etwas nicht erneut zu tun. „Nicht noch einmal“ gibt die verhinderte Wiederholung idiomatisch wieder; „begehen“ passt im Deutschen zu einer bösen Tat.
- source_word: כַדָּבָר הָרָע הַזֶּה
  choice: eine solche böse Tat
  rationale: דָּבָר kann „Sache“, „Angelegenheit“ oder eine konkrete Handlung bezeichnen. In diesem Rechtszusammenhang ist „Tat“ natürlich; כַּ…הַזֶּה wird treffend mit „eine solche“ wiedergegeben.
- source_word: בְּקִרְבֶּךָ
  choice: in deiner Mitte
  rationale: Die Wendung bedeutet wörtlich „in deiner Mitte“. Der Singular richtet sich an Israel als kollektive Einheit und wird deshalb beibehalten.
theological_decisions:
- issue: Numerus der Anrede im Suffix von בְּקִרְבֶּךָ
  choice: 'Singular: „in deiner Mitte“'
  alternative: 'Plural: „unter euch“'
  rationale: Das hebräische Suffix steht im maskulinen Singular und spricht Israel als ein Volk an. Die Hauptübersetzung bewahrt diese korporative Anrede; die geläufigere pluralische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht rechtlichem Ton. Die Wiederholung von „sollen“ macht den normativen und abschreckenden Zusammenhang verständlich, ohne die hebräischen Imperfektformen dogmatisch festzulegen.
