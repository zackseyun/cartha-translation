base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: de
  text: Denn du musst ihn unbedingt töten[a]; deine Hand soll die erste sein, die ihn tötet, danach die Hand des ganzen Volkes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst ihn gewiss töten.“ Das Hebräische verstärkt das Verb durch einen absoluten Infinitiv mit finitem Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert hier das vorangehende Gebot und bewahrt mit „Denn“ den logischen Zusammenhang.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: du musst ihn unbedingt töten
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt die Aussage. „Musst … unbedingt töten“ gibt sowohl den Nachdruck als auch den verpflichtenden Charakter wieder.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die konkrete hebräische Rechts- und Handlungssprache wird bewahrt, statt das Bild zu einem bloßen Pronomen abzuflachen.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: soll sich als Erste gegen ihn richten
  rationale: Die Formulierung bewahrt das Bild der Hand und drückt in natürlichem Deutsch aus, dass der Angesprochene beim Vollzug zuerst handeln soll.
- source_word: לַהֲמִיתוֹ
  choice: um ihn zu töten
  rationale: Der Hifil von מות bezeichnet das Verursachen des Todes, hier im rechtlichen Zusammenhang. Die direkte Wiedergabe vermeidet sowohl Beschönigung als auch zusätzliche Auslegung.
- source_word: וְיַד כָּל הָעָם
  choice: und danach die Hand des ganzen Volkes
  rationale: Die Wiederholung von „Hand“ erhält den Parallelismus und die im Gesetz verlangte gemeinschaftliche Beteiligung.
- source_word: בָּאַחֲרֹנָה
  choice: danach
  rationale: Das Adverb steht im Gegensatz zu „als Erste“ und bezeichnet die nachfolgende Handlung.
theological_decisions:
- issue: Wiedergabe der Sprache einer gerichtlich angeordneten Tötung ohne Abschwächung oder Verschärfung
  choice: töten
  alternative: zu Tode bringen / hinrichten
  rationale: „Töten“ entspricht den beiden verschiedenen hebräischen Verben hier direkt und lässt den rechtlichen Kontext aus dem Zusammenhang hervorgehen. „Hinrichten“ wäre kontextuell möglich, würde die Verfahrensart jedoch stärker festlegen; „zu Tode bringen“ klänge im modernen Deutsch unnötig indirekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzstruktur. Das konkrete Bild „deine Hand … die Hand des ganzen Volkes“ und die harte rechtliche Aussage des Ausgangstextes bleiben erhalten; die emphatische hebräische Konstruktion wird idiomatisch mit „unbedingt“ wiedergegeben.
