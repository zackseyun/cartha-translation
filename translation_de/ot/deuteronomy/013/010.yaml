    rationale: Die Alternative „um ihn zu Tode zu bringen“ bezieht sich auf den zweiten Infinitivzweck und nicht auf die in der Anmerkung erklärte emphatische Konstruktion. Eine Alternative wie „Du sollst ihn gewiss töten“ entspricht dem Bezug besser.
  revised_text: Denn du musst ihn unbedingt töten[a]; deine Hand soll die erste sein, die ihn tötet, danach die Hand des ganzen Volkes.
