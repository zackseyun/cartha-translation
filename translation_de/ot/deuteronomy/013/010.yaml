  rationale: Die Revision ersetzt die missverständliche Wendung „sich gegen ihn richten“ durch eine im modernen Deutsch klare Formulierung, die die im Hebräischen geforderte Reihenfolge des Vollzugs ausdrückt. Der Parallelismus „deine Hand … die Hand des ganzen Volkes“ bleibt erhalten. Die Fußnote wird an die tatsächlich erläuterte emphatische Verbform gesetzt und inhaltlich auf diese bezogen.
