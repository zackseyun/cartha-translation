id: DEU.13.18
reference: Deuteronomy 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: de
  text: Und nichts von dem, was der Vernichtung geweiht ist, soll an deiner Hand haften[a], damit Jahwe von der Glut seines Zorns ablässt[b], dir Erbarmen schenkt, sich über dich erbarmt und dich zahlreich werden lässt, wie er es deinen Vätern geschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Nichts von dem Bann“ oder „nichts von dem, was unter dem Bann steht“. Das hebräische חֵרֶם bezeichnet etwas, das Gott unwiderruflich geweiht ist, hier zur Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen eine Wendung von der „Glut seiner Nase/seines Zorns“; sie bezeichnet heftigen, entbrannten Zorn.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: soll an deiner Hand haften
  rationale: דבק bezeichnet ein Haften oder Sich-Anklammern. In Verbindung mit „Hand“ ist die Wendung zugleich ein konkretes Bild und eine Aussage über Besitz beziehungsweise Zurückbehalten; die deutsche Fassung bewahrt beides.
- source_word: מְאוּמָה
  choice: nichts
  rationale: Das Wort bezeichnet etwas, irgendetwas oder auch nur das Geringste; zusammen mit der Verneinung wird die uneingeschränkte Aussage natürlich mit „nichts“ wiedergegeben.
- source_word: הַחֵרֶם
  choice: was der Vernichtung geweiht ist
  rationale: חֵרֶם bezeichnet hier etwas, das Gott unwiderruflich übereignet und zur Vernichtung bestimmt ist. Die Formulierung erschließt den kultisch-bundesbezogenen Begriff, ohne ihn auf das im Deutschen missverständliche Wort „Bann“ zu verkürzen.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion leitet den beabsichtigten beziehungsweise daraus folgenden Zweck ein; „damit“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: damit Jahwe von der Glut seines Zorns ablässt
  rationale: שׁוב mit מן bezeichnet das Abwenden oder Ablassen von etwas. חֲרוֹן אַף ist ein intensives Zornidiom; „Glut seines Zorns“ bewahrt dessen Bildkraft in natürlichem Deutsch.
- source_word: רַחֲמִים
  choice: Erbarmen
  rationale: Das Substantiv bezeichnet barmherzige Zuwendung oder Mitgefühl. Mit נתן wird es im Deutschen idiomatisch als „Erbarmen schenken“ formuliert.
- source_word: וְרִחַמְךָ
  choice: sich über dich erbarmt
  rationale: Die verbale Form wird von dem vorangehenden Substantiv unterschieden. So bleibt die hebräische, bedeutungsverwandte Verstärkung aus „Erbarmen“ und „sich erbarmen“ hörbar.
- source_word: וְהִרְבֶּךָ
  choice: dich zahlreich werden lässt
  rationale: Der Hifil von רבה bedeutet, jemanden zahlreich zu machen. Diese natürliche Formulierung bewahrt den Bezug auf die Mehrungsverheißung.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: wie er es deinen Vätern geschworen hat
  rationale: „Väter“ gibt den geschlechtsspezifischen Ausdruck und den Bezug auf die patriarchale Bundeslinie wieder. Das ergänzte „es“ macht den deutschen Satz flüssig, ohne den Inhalt festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von חֵרֶם
  choice: was der Vernichtung geweiht ist
  alternative: der Bann; was unter dem Bann steht
  rationale: Die gewählte Fassung macht sowohl die unwiderrufliche Weihung als auch die in diesem Zusammenhang beabsichtigte Vernichtung erkennbar, ohne darüber hinausgehende konfessionelle Deutungen einzutragen.
- issue: Bildhafte Sprache für Gottes Zorn
  choice: von der Glut seines Zorns ablässt
  alternative: von seinem brennenden Zorn umkehrt; von der Zornesglut seiner Nase umkehrt
  rationale: Die Übersetzung bewahrt Intensität und persönliche Dimension des göttlichen Zorns, vermeidet aber eine im Deutschen irreführende wörtliche Wiedergabe von „Nase“.
- issue: Wiedergabe von אֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: Der Ausgangstext spricht spezifisch von den Vätern und ruft damit die patriarchale Verheißung auf; diese Präzision bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Bild des Haftens an der Hand bleibt erhalten; schwer verständliche Fachsprache wie „Bann“ steht nur als traditionelle Alternative in der Fußnote. Die Wiederholung von „Erbarmen“ ist bewusst beibehalten, weil sie die hebräische Intensivierung abbildet.
