revisions:
- from: Dann sollst du gründlich nachforschen, sorgfältig untersuchen und genau nachfragen. Wenn es sich als wahr und bestätigt erweist, dass dieser Gräuel in deiner Mitte verübt worden ist,
  to: 'Dann sollst du nachforschen, untersuchen und gründlich nachfragen. Und siehe: Es ist wahr und gewiss: Dieser Gräuel ist in deiner Mitte geschehen,'
  rationale: Die Revision stellt die nichtkonditionale hebräische Ergebnisformel wieder her, gibt וְהִנֵּה mit „Und siehe“ wieder und bewahrt die rechtliche Abfolge von Nachforschung, Untersuchung und gründlichem Fragen. Die Aussage bleibt, wie im Ausgangstext, mit Komma zum folgenden Vers hin offen.
