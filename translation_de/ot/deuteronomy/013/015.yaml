review_pass:
  verdict: revise
  source_fidelity: 'Die hebräische Fassung enthält nach den drei Untersuchungsverben keine Kondition („wenn“), sondern eine Ergebnis- bzw. Bestätigungsformel: „und siehe, wahr/gewiss ist die Sache; dieser Gräuel ist ... geschehen“. Die Einleitung mit „Wenn es sich ... erweist“ macht die Feststellung unnötig hypothetisch und gibt וְהִנֵּה nicht angemessen wieder. Die dreifache Aufforderung zur sorgfältigen Prüfung und die abschließende Aussage über den Gräuel sind ansonsten zutreffend erfasst.'
  naturalness: Die vorliegende Fassung ist flüssig, doch die drei adverbial verstärkten Verben wirken im Deutschen etwas überladen, obwohl הֵיטֵב unmittelbar nur das dritte Verb qualifiziert. Eine knappe Dreierreihe mit „gründlich nachfragen“ am Schluss ist natürlich und bewahrt die Steigerung.
  terminology: „Gräuel“ ist als Wiedergabe von תּוֹעֵבָה passend und erhält den gewichtigen rechtlich-kultischen Registerton. „In deiner Mitte“ gibt בְּקִרְבֶּךָ präzise wieder. „Verübt worden“ ist möglich; „geschehen“ folgt dem allgemeinen Verb עשה enger und vermeidet eine über das Hebräische hinausgehende strafrechtliche Nuance.
  issues:
  - severity: medium
    issue: Konditionale Umformung der Bestätigungsformel
    rationale: „Wenn es sich als wahr und bestätigt erweist“ fügt eine im masoretischen hebräischen Text nicht vorhandene Bedingung ein. וְהִנֵּה leitet vielmehr die nach der Untersuchung festgestellte Sachlage ein.
  - severity: low
    issue: Dreifache Adverbverstärkung
    rationale: „gründlich“, „sorgfältig“ und „genau“ verteilen die Verstärkung von הֵיטֵב auf alle drei Verben. Die kumulative Verbfolge bleibt auch ohne die ersten beiden Adverbien deutlich; „gründlich“ sollte beim dritten Verb stehen.
  revised_text: 'Dann sollst du nachforschen, untersuchen und gründlich nachfragen. Und siehe: Es ist wahr und gewiss: Dieser Gräuel ist in deiner Mitte geschehen,'
  revised_footnotes: []
