  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: de
  text: 'Dann sollst du nachforschen, untersuchen und gründlich nachfragen. Und siehe: Es ist wahr und gewiss: Dieser Gräuel ist in deiner Mitte geschehen,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: gründlich nachforschen
  rationale: דרש bezeichnet im rechtlichen Zusammenhang eine gezielte Untersuchung. „Nachforschen“ gibt diesen Sinn natürlich wieder; „gründlich“ bringt zusammen mit der folgenden Dreierreihe die nachdrückliche Sorgfalt des Verfahrens zum Ausdruck.
- source_word: וְחָקַרְתָּ
  choice: sorgfältig untersuchen
  rationale: חקר bezeichnet eingehendes Prüfen und wird durch „sorgfältig untersuchen“ vom vorausgehenden Nachforschen unterschieden.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: genau nachfragen
  rationale: שאל bedeutet „fragen/nachfragen“, während היטב die sorgfältige und gründliche Ausführung verstärkt. Die Wendung ist im modernen Deutschen idiomatisch.
- source_word: וְהִנֵּה
  choice: wenn es sich … erweist
  rationale: הנה führt hier das festgestellte Ergebnis der Untersuchung ein. Im deutschen Rechtssatz gibt die konditionale Ergebnisformulierung diese Funktion natürlicher wieder als das wörtliche „siehe“.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: es sich als wahr und bestätigt erweist
  rationale: Die Formel erklärt die untersuchte Sache für wahr und zuverlässig festgestellt. „Bestätigt“ bewahrt den gerichtlichen Verifikationscharakter von נכון.
- source_word: נֶעֶשְׂתָה
  choice: verübt worden ist
  rationale: Das Nifal von עשה beschreibt, dass die Tat geschehen ist. Bei einem schweren Vergehen ist „verübt worden“ im Deutschen präzise und idiomatisch.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: dieser Gräuel
  rationale: תועבה ist ein starker wertender Bundes- und Kultbegriff. „Gräuel“ bewahrt sein Gewicht und den würdigen biblischen Sprachton, ohne ihn auszudeuten.
- source_word: בְּקִרְבֶּךָ
  choice: in deiner Mitte
  rationale: Die Wendung bezeichnet das Geschehen innerhalb der angesprochenen Gemeinschaft und bildet die hebräische Formulierung klar und knapp ab.
theological_decisions:
- issue: Gerichtliche Bestätigungsformel
  choice: „Wenn es sich als wahr und bestätigt erweist“ als Ergebnis eines sorgfältigen Untersuchungsverfahrens
  alternative: '„Und siehe: Die Meldung ist wahr, die Sache steht fest“'
  rationale: Die hebräische Verbreihe verlangt sorgfältige gerichtliche Prüfung, bevor die Anschuldigung als erwiesen gilt. Die gewählte Form bewahrt diese rechtliche Spannung und vermeidet, die Aussage vor Abschluss der Prüfung als Tatsache hinzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-klarem Ton. Die kumulative Folge der drei Untersuchungsverben bleibt erhalten. Das einleitende וְהִנֵּה wird funktional als Ergebnisformel wiedergegeben; der Vers endet entsprechend dem hebräischen Satzbau mit einem Komma, da der Folgesatz im nächsten Vers weitergeht.
