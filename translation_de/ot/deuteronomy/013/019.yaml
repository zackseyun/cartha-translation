source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: de
  text: wenn du auf die Stimme Jahwes, deines Gottes, hörst, alle seine Gebote hältst, die ich dir heute gebiete, und tust, was in den Augen Jahwes, deines Gottes, recht ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier die Bedingung ein, von der die vorangehende Zusage abhängt; „wenn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: תִשְׁמַע בְּקוֹל
  choice: auf die Stimme … hörst
  rationale: Die Wendung bezeichnet ein Hören, das Gehorsam einschließt. „Auf die Stimme hören“ bewahrt sowohl das hebräische Bild als auch den Gehorsamsaspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: alle seine Gebote hältst
  rationale: שׁמר bezeichnet hier die sorgfältige Beachtung der Gebote. Die koordinierte Verbform ist im Deutschen klarer als eine wörtlich nachgebildete Infinitivkonstruktion.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Der Relativsatz und der gegenwärtige Sprechakt werden in natürlichem Deutsch präzise wiedergegeben.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: und tust, was … recht ist
  rationale: Die substantivierte Form הַיָּשָׁר bezeichnet das Rechte; die deutsche Relativkonstruktion wahrt den ethischen Sinn und verbindet den zweiten Infinitiv sachgerecht mit dem ersten.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die vertraute deutsche Wendung bewahrt das hebräische Bild der Beurteilung aus Gottes Sicht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Infinitive werden als koordinierte finite Verben wiedergegeben, damit Bedingung und Handlungen klar und idiomatisch erscheinen; die persönliche Bildsprache „auf die Stimme hören“ und „in den Augen“ bleibt erhalten.
