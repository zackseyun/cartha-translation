source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: de
  text: Du sollst ihn mit Steinen steinigen, sodass er stirbt, denn er hat versucht, dich von Jahwe, deinem Gott, abzubringen[a], der dich aus dem Land Ägypten, aus dem Haus der Sklaverei[b] herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich von Jahwe wegzuführen“ beziehungsweise „dich zur Abkehr von Jahwe zu verleiten“.'
    reason: lexical_alternative
  - marker: b
    text: „Haus der Sklaverei“ ist eine feste Bundesformel, die an Israels Befreiung aus Ägypten erinnert.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: Du sollst ihn mit Steinen steinigen, sodass er stirbt
  rationale: Die Rechtsanweisung und ihr ausdrücklich genanntes tödliches Ergebnis bleiben erhalten. „Sodass er stirbt“ gibt die Ergebnisfolge im heutigen Deutsch natürlicher wieder als ein bloß anreihendes „und er stirbt“.
- source_word: כִּי בִקֵּשׁ
  choice: denn er hat versucht
  rationale: כִּי begründet das Urteil; בקש bezeichnet hier ein zielgerichtetes Vorhaben beziehungsweise einen Versuch. Das Perfekt wird im Deutschen idiomatisch mit „hat versucht“ wiedergegeben.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: dich … abzubringen
  rationale: Der Hifil von נדח bezeichnet das Veranlassen einer Abkehr. „Jemanden von jemandem abbringen“ bewahrt die Richtung der Trennung und klingt im Deutschen natürlich; mögliche Nuancen werden in der Fußnote genannt.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Apposition bewahrt die persönliche Bundesbeziehung des hebräischen Ausdrucks.
- source_word: הַמּוֹצִיאֲךָ
  choice: der dich … herausgeführt hat
  rationale: Das Partizip beschreibt Jahwe durch seine geschichtliche Befreiungstat. Das deutsche Perfekt gibt den zurückliegenden Exodus klar wieder.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Nahe und idiomatische Wiedergabe der geografischen Herkunftsangabe.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Haus der Sklaverei
  rationale: Die prägnante Bundesformel bleibt bildhaft und verständlich; sie bezeichnet Ägypten als Ort der Versklavung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bundesabfall in לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: dich von Jahwe … abzubringen
  alternative: dich von Jahwe wegzuführen; dich zur Abkehr von Jahwe zu verleiten
  rationale: Die Formulierung wahrt den kausativen Sinn und die beabsichtigte Abkehr von der Bundestreue, ohne die genaue Art der Einflussnahme enger festzulegen.
- issue: „Haus der Sklaverei“ als Exodusformel
  choice: wörtliche Bildsprache beibehalten
  alternative: Ort der Sklaverei; Sklavenhaus
  rationale: Die Wendung erinnert an Israels Befreiung aus Ägypten und sollte nicht zu einer bloßen Ortsangabe verflacht werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ernst. Die direkte Anrede im Singular und die Wiederholung der Exodusangaben bleiben erhalten. Beide Fußnotenmarker stehen an den jeweils sachlich passenden Stellen im Haupttext.
