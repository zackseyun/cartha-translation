source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: de
  text: Ihr sollt Jahwe, eurem Gott, folgen[a], ihn fürchten, seine Gebote halten, auf seine Stimme hören[b], ihm dienen und an ihm festhalten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hinter Jahwe, eurem Gott, hergehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung kann auch bedeuten: „seiner Stimme gehorchen“ oder „ihm gehorchen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihm anhängen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי ... תֵּלֵכוּ
  choice: folgen
  rationale: Die hebräische Wendung bedeutet wörtlich „hinter … hergehen“, bezeichnet hier aber die loyale Ausrichtung des Lebens an Jahwe. „Folgen“ gibt den Sinn in natürlichem Deutsch wieder; das zugrunde liegende Bild bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen geläufige Wiedergabe des Gottesnamens JHWH und bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Form enthält das Suffix der 2. Person Plural und bezeichnet Jahwe in seiner Bundesbeziehung zu den angesprochenen Israeliten.
- source_word: תִירָאוּ
  choice: ihn fürchten
  rationale: Das Verb umfasst im Verhältnis zu Gott Furcht, Ehrfurcht und Achtung. „Fürchten“ bewahrt die Stärke und theologische Spannung des hebräischen Ausdrucks.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: seine Gebote halten
  rationale: שׁמר bezeichnet bei Geboten deren gewissenhafte Beachtung. Die feste deutsche Wendung „Gebote halten“ entspricht dem bundesbezogenen Aussagegehalt.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: auf seine Stimme hören
  rationale: Die Formulierung bildet das hebräische Sprachbild natürlich ab. Da „hören“ hier zugleich gehorsames Befolgen einschließen kann, wird diese Bedeutungsnuance in einer Fußnote genannt.
- source_word: תַעֲבֹדוּ
  choice: ihm dienen
  rationale: עבד kann sowohl Dienst als auch kultische Verehrung bezeichnen. „Dienen“ ist die breitere Wiedergabe und verengt die Aussage nicht auf gottesdienstliche Handlungen.
- source_word: תִדְבָּקוּן
  choice: an ihm festhalten
  rationale: דבק bezeichnet ein enges, beständiges Sich-Anschließen. „An ihm festhalten“ drückt die geforderte treue Bindung idiomatisch und anschaulich aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt diese Eigenart und ersetzt ihn nicht stillschweigend durch einen Titel.
- issue: Bedeutungsumfang von שׁמע בְּקוֹל
  choice: auf seine Stimme hören
  alternative: ihm gehorchen
  rationale: Die Wendung schließt Gehorsam ein, nennt aber ausdrücklich das Hören auf seine Stimme. Der Haupttext bewahrt dieses Bild, während die Fußnote die mögliche Bedeutungsentfaltung nennt.
- issue: Bedeutungsumfang von עבד im Verhältnis zu Gott
  choice: ihm dienen
  alternative: ihn anbeten
  rationale: Im Kontext kann der Dienst auch Verehrung umfassen. „Dienen“ wahrt jedoch den weiteren Sinn des hebräischen Verbs und beschränkt die Forderung nicht auf kultische Anbetung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Reihe der Aufforderungen bleibt eng am hebräischen Satzbau, wird jedoch durch idiomatische deutsche Formulierungen lesbar gehalten. Der Gottesname wird in der deutschen Form „Jahwe“ wiedergegeben.
