  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: de
  text: Das ganze Wort, das ich euch gebiete, sollt ihr gewissenhaft tun. Ihr sollt ihm nichts hinzufügen und nichts davon wegnehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In manchen Bibelausgaben wird dieser Vers als Deuteronomium 12,32 gezählt.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: das ganze Wort
  rationale: Bewahrt den kollektiven Singular des Hebräischen und klingt im Deutschen würdevoll und verständlich; gemeint ist die Gesamtheit des Gebotenen.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: das ich euch gebiete
  rationale: Das deutsche Präsens gibt die gegenwärtige bzw. fortdauernde Geltung des hebräischen Partizips natürlich wieder.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: sollt ihr gewissenhaft tun
  rationale: Gibt die Verbindung von aufmerksamem Bewahren und tatsächlichem Tun idiomatisch wieder, ohne sie auf bloßes inneres Beachten zu verkürzen.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Ihr sollt ihm nichts hinzufügen
  rationale: Entspricht der räumlich formulierten hebräischen Wendung und wahrt den Bezug auf das kollektiv-singularische »Wort«.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: und nichts davon wegnehmen
  rationale: Natürliches modernes Deutsch für das Vermindern oder Entfernen eines Teils.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das eigenständige Pronomen wird durch das ausdrückliche deutsche »ich« wiedergegeben; eine zusätzliche Hervorhebung wie »ich selbst« wäre im Kontext unnötig markiert.
theological_decisions:
- issue: Umfang und Einheit des Gebotenen
  choice: Der kollektive Singular wird als »das ganze Wort« bewahrt.
  alternative: »Alles, was ich euch gebiete« oder »jedes Wort«
  rationale: Die Formulierung lässt die Weisung als zusammengehöriges Ganzes hervortreten, ohne sie konfessionell oder systematisch näher zu bestimmen.
- issue: Verszählung und Zusammenhang
  choice: Der Vers wird als vollständige Weisung für sich übersetzt.
  alternative: In manchen Verszählungen ist er Deuteronomium 12,32 und wird enger an den vorangehenden Abschnitt angeschlossen.
  rationale: Der hebräische Wortlaut bildet eine vollständige Mahnung; die abweichende Zählung betrifft die Referenz, nicht den übersetzten Inhalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Das ganze Wort« ist bewusst leicht formal, um den kollektiven Singular des Hebräischen zu erhalten; »gewissenhaft tun« vermittelt die Verbindung von sorgfältigem Beachten und Ausführen.
