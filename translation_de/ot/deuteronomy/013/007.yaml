  terminology: „Verleitet“, „heimlich“, „dienen“ und „andere Götter“ sind passend. Die Fußnoten sollen die bildhafte beziehungsweise mehrdeutige Ausdrucksweise transparent machen, ohne eine einzelne Bedeutung von נֶפֶשׁ dogmatisch festzulegen.
