  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: de
  text: 'Wenn dich dein Bruder, der Sohn deiner Mutter, oder dein Sohn oder deine Tochter oder deine Frau, die du im Arm hältst,[a] oder dein Freund, der dir so nahesteht wie du dir selbst,[b] heimlich verleitet und sagt: »Lass uns gehen und anderen Göttern dienen, die weder du noch deine Vorfahren gekannt haben«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Frau deines Schoßes“ beziehungsweise „deines Busens“; ein Bild für die Ehefrau in engster Vertrautheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Freund, der wie deine eigene Seele ist“. „Seele“ kann hier auch das eigene Leben oder die eigene Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: dich … verleitet
  rationale: Das Hifil von סות bezeichnet das Verleiten oder Anstiften zu einer Handlung. „Verleiten“ gibt die negative, zielgerichtete Einflussnahme natürlich wieder; „heimlich“ übersetzt das gesonderte בַּסֵּתֶר.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: dein Bruder, der Sohn deiner Mutter
  rationale: Die ausdrückliche Apposition des Hebräischen bleibt erhalten und unterstreicht die engste familiäre Bindung.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: die Frau, die du in den Armen hältst
  rationale: חֵיק bezeichnet Schoß, Brustbereich oder bergende Arme. Die Formulierung bewahrt das Bild körperlicher und ehelicher Nähe, ohne im Deutschen altertümlich zu wirken.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: dein Freund, der dir wie dein eigenes Leben ist
  rationale: נֶפֶשׁ kann „Seele“, „Leben“ oder die eigene Person bezeichnen. „Wie dein eigenes Leben“ bewahrt die starke persönliche Verbundenheit und ist zugleich verständliches Deutsch.
- source_word: בַּסֵּתֶר
  choice: heimlich
  rationale: Die adverbiale Wiedergabe entspricht „im Verborgenen“ und fügt sich im Deutschen natürlich zum Verb.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Lass uns gehen und … dienen
  rationale: Die beiden Kohortative drücken eine Aufforderung aus. Sowohl das Gehen als auch der religiöse Dienst bleiben ausdrücklich erhalten.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: אֲחֵרִים bedeutet schlicht „andere“; „fremde“ wäre eine stärkere Deutung.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: die weder du noch deine Vorfahren gekannt haben
  rationale: Die weder-noch-Konstruktion gibt die hebräische Zuordnung klar wieder. „Vorfahren“ ist im heutigen Deutsch inklusiver und natürlicher als das hier kollektiv gebrauchte „Väter“, ohne den historischen Bezug zu verändern.
theological_decisions:
- issue: Wiedergabe der Bilder für engste menschliche Bindungen
  choice: Die Verwandtschaftsangabe und die Bilder ehelicher sowie freundschaftlicher Nähe werden weitgehend bewahrt.
  alternative: Glättende Wiedergaben wie „dein leiblicher Bruder“, „deine geliebte Frau“ und „dein engster Freund“.
  rationale: Die Aufzählung steigert die Warnung durch den Verweis auf besonders enge Beziehungen. Eine zu starke Glättung würde diese Bildkraft abschwächen.
- issue: Bedeutungsumfang von עבד im Blick auf andere Götter
  choice: dienen
  alternative: anbeten
  rationale: עבד umfasst religiöse Verehrung, bezeichnet aber grundlegend den Dienst. „Dienen“ erhält diesen weiteren Bedeutungsumfang, ohne den Ausdruck auf eine einzelne Kulthandlung einzuengen.
- issue: Bedeutungsbreite von נֶפֶשׁ
  choice: wie dein eigenes Leben
  alternative: wie deine eigene Seele / wie du selbst
  rationale: Die Übersetzung hält die mögliche Bedeutung „Leben“ und die intensive persönliche Nähe fest. Eine Fußnote macht transparent, dass auch „Seele“ beziehungsweise die eigene Person mitschwingt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen hebräischen Nähe-Bilder werden nicht durch bloße Beziehungsbezeichnungen ersetzt, sondern verständlich im Haupttext wiedergegeben und in Fußnoten näher erläutert. Der Vers bleibt syntaktisch offen, weil der Satz im folgenden Vers weitergeführt wird.
