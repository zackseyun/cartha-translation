  verdict: revise
  source_fidelity: Die Aufzählung, die heimliche Verleitung, die Kohortativaufforderung und der religiöse Dienst an „anderen Göttern“ sind quellentreu wiedergegeben. „Vorfahren“ gibt אֲבֹתֶיךָ in diesem Kontext angemessen wieder. Bei אֵשֶׁת חֵיקֶךָ sollte jedoch ausdrücklich „deine Frau“ stehen; „die Frau“ ist im heutigen Deutsch nicht zuverlässig als Ehefrau erkennbar. Für רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ ist die vorliegende Formulierung „der dir wie dein eigenes Leben ist“ sprachlich und semantisch zu unbestimmt.
