base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: de
  text: 'Wenn[a] du in einer deiner Städte, die Jahwe, dein Gott, dir gibt, damit du dort wohnst[b], Folgendes hörst:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bindewort kann in Rechtstexten neben dem bedingten auch einen zeitlichen Fall einleiten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit du dich dort ansiedelst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: In diesem kasuistischen Rechtssatz leitet כִּי den angenommenen Fall ein. „Wenn“ gibt diese Funktion im Deutschen natürlich wieder; eine zeitliche Nuance bleibt möglich und wird in der Fußnote genannt.
- source_word: תִשְׁמַע
  choice: du … hörst
  rationale: שׁמע bezeichnet hier das Vernehmen einer Nachricht. Zusammen mit לֵאמֹר wird die Wendung im Deutschen idiomatisch als „Folgendes hörst“ wiedergegeben.
- source_word: בְּאַחַת עָרֶיךָ
  choice: in einer deiner Städte
  rationale: Die Präposition בְּ wird räumlich und עִיר mit „Stadt“ wiedergegeben. So bleibt die Formulierung eng am Hebräischen, ohne die Präposition deutend zu „über/von“ zu verschieben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die direkte Anrede im maskulinen Singular und die bundesbezogene Wendung bleiben erhalten.
- source_word: נֹתֵן לְךָ
  choice: dir gibt
  rationale: Das Partizip beschreibt Jahwes fortdauerndes beziehungsweise charakteristisches Geben. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: לָשֶׁבֶת שָׁם
  choice: damit du dort wohnst
  rationale: Der Infinitiv mit לְ bezeichnet hier Zweck beziehungsweise Ergebnis. „Wohnen“ ist gegenwärtig, würdig und weniger eng als „sich ansiedeln“.
- source_word: לֵאמֹר
  choice: 'Folgendes … :'
  rationale: לֵאמֹר leitet den Inhalt der gehörten Meldung ein, der im nächsten Vers folgt. Die deutsche Ankündigungsformel mit Doppelpunkt gibt diese Funktion klar wieder, ohne ein unnatürliches „sagend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedingte oder zeitliche Einleitung durch כִּי
  choice: Wenn
  alternative: Sobald / Als
  rationale: Der rechtliche Zusammenhang stellt einen möglichen Fall vor. „Wenn“ wahrt zugleich die im Hebräischen vorhandene Nähe zwischen bedingter und zeitlicher Lesart, die in der Fußnote ausdrücklich benannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die hebräische Satzstruktur bleibt weitgehend sichtbar; לֵאמֹר wird jedoch idiomatisch durch „Folgendes“ und einen Doppelpunkt ausgedrückt. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
