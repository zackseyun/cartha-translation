base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: de
  text: von den Göttern der Völker rings um euch, die dir nahe oder fern sind, von einem Ende der Erde[a] bis zum anderen Ende der Erde —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Landes“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: von den Göttern
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt beziehungsweise den Bereich, aus dem die genannten Götter stammen; die knappe Formulierung gibt dies natürlich wieder.
- source_word: הָעַמִּים
  choice: der Völker
  rationale: עַמִּים bezeichnet hier ethnische Gemeinschaften; „Völker“ bewahrt diesen kollektiven Sinn besser als „Nationen“.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: rings um euch
  rationale: Die Formulierung gibt die räumliche Bedeutung prägnant und in natürlichem modernem Deutsch wieder.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: seien sie dir nahe oder fern
  rationale: Die Wendung bewahrt den Gegensatz zwischen Nähe und Ferne. Der Wechsel vom pluralischen „euch“ zum singularischen „dir“ entspricht dem hebräischen Text und redet Israel zugleich gemeinschaftlich und als Einheit an.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: von einem Ende der Erde bis zum anderen
  rationale: Die idiomatische Wendung bezeichnet die größtmögliche geografische Ausdehnung. „Erde“ erhält die weite rhetorische Aussage; die Wiederholung von „Ende der Erde“ wird im Deutschen zur Vermeidung unnötiger Schwerfälligkeit leicht gestrafft.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ in der Schlusswendung
  choice: Erde
  alternative: Land
  rationale: אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten. In der umfassenden Wendung „von einem Ende … bis zum anderen“ liegt „Erde“ nahe, doch die mögliche engere Bedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im Hebräischen vorhandene Wechsel zwischen pluralischer und singularischer Anrede („euch“/„dir“) bleibt erhalten. Der Gedankenstrich zeigt, dass der Satz über diesen Vers hinaus weitergeführt wird.
