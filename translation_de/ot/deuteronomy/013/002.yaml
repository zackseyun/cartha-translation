source:
  edition: WLC
  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: de
  text: Wenn unter euch ein Prophet oder ein Traumseher auftritt und euch ein Zeichen oder ein Wunder[a] gibt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Zeichen oder ein Vorzeichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: In diesem kasuistischen Rechtskontext leitet כִּי den Bedingungssatz ein, der im folgenden Vers fortgeführt wird.
- source_word: יָקוּם
  choice: auftritt
  rationale: Das Verb bezeichnet hier das Hervortreten einer Person innerhalb der Gemeinschaft; „auftritt“ ist im modernen Deutsch natürlich und treffend.
- source_word: בְּקִרְבְּךָ
  choice: unter euch
  rationale: Die Wendung bezeichnet die Mitte beziehungsweise den Kreis der angesprochenen Gemeinschaft.
- source_word: נָבִיא
  choice: Prophet
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe.
- source_word: חֹלֵם חֲלוֹם
  choice: einer, der Träume hat
  rationale: Die idiomatische Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet einen Träumer beziehungsweise jemanden, der Träume empfängt. Die Formulierung ist verständlich und bewahrt die Unterscheidung vom Propheten.
- source_word: וְנָתַן אֵלֶיךָ
  choice: und euch … ankündigt
  rationale: נָתַן אֵל kann in diesem Zusammenhang das Vorlegen beziehungsweise Ankündigen eines Zeichens bezeichnen. Der deutsche Singular „euch“ entspricht dem kollektiv gebrauchten hebräischen Singular der Anrede.
- source_word: אוֹת
  choice: Zeichen
  rationale: Das Wort bezeichnet häufig ein bestätigendes oder beweiskräftiges Zeichen.
- source_word: מוֹפֵת
  choice: Wunder
  rationale: Das Wort bezeichnet eine auffällige, Staunen erregende Erscheinung und bildet hier mit אוֹת ein festes Begriffspaar, ohne dass seine Ursache näher bestimmt wird.
theological_decisions:
- issue: Art des Zeichens oder Wunders
  choice: „Zeichen oder Wunder“ ohne nähere Qualifizierung
  alternative: „Zeichen oder Vorzeichen“ beziehungsweise „Wunderzeichen“
  rationale: Der Vers entscheidet nicht, ob das Phänomen tatsächlich übernatürlich, täuschend oder nur behauptet ist. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wegen der Fortsetzung der Bedingung im folgenden Vers syntaktisch offen. „Einer, der Träume hat“ vermeidet das im Deutschen möglicherweise abwertend klingende „Träumer“, während die eigene Kategorie neben dem Propheten erhalten bleibt.
