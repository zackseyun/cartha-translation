review_pass:
  verdict: revise
  source_fidelity: 'Der Bedingungssatz, „unter euch“, die Unterscheidung zwischen Prophet und Traumgestalt sowie die offene Paarung אוֹת / מוֹפֵת sind grundsätzlich zutreffend wiedergegeben. „Ankündigt“ ist für וְנָתַן jedoch zu eng: Das Verb besagt hier, dass die Person ein Zeichen oder Wunder gibt bzw. vorlegt, nicht lediglich dessen Ankündigung.'
  naturalness: „Wenn unter euch ein Prophet oder einer, der Träume hat, auftritt“ ist verständlich, aber „einer, der Träume hat“ kann im heutigen Deutsch gewöhnliche Träume meinen und gibt die fachlich-religiöse Kategorie חֹלֵם חֲלוֹם nur unzureichend wieder. „ein Traumseher“ ist knapp, modern verständlich und kontextuell präziser.
  terminology: „Prophet“, „Zeichen“ und „Wunder“ sind angemessen. Die Alternative „Vorzeichen“ ist für מוֹפֵת als mögliche Wiedergabe vertretbar, ohne über die Art des Phänomens zu entscheiden.
  issues:
  - severity: medium
    issue: „… euch ein Zeichen oder Wunder ankündigt“
    rationale: וְנָתַן אֵלֶיךָ bedeutet in diesem Zusammenhang „euch ein Zeichen oder Wunder gibt/vorlegt“. Eine bloße Ankündigung kann das Geschehen selbst ausschließen und verengt daher den Sinn.
  - severity: low
    issue: „einer, der Träume hat“
    rationale: Die Formulierung ist alltagssprachlich mehrdeutig und kann normale Träume bezeichnen. חֹלֵם חֲלוֹם benennt eine besondere, neben dem Propheten stehende Personenkategorie.
  revised_text: Wenn unter euch ein Prophet oder ein Traumseher auftritt und euch ein Zeichen oder ein Wunder[a] gibt,
  revised_footnotes:
  - marker: a
    text: 'Oder: „ein Zeichen oder ein Vorzeichen“.'
    reason: lexical_alternative
