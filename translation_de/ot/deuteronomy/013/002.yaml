revisions:
- from: Wenn unter euch ein Prophet oder einer, der Träume hat, auftritt und euch ein Zeichen oder Wunder[a] ankündigt,
  to: Wenn unter euch ein Prophet oder ein Traumseher auftritt und euch ein Zeichen oder ein Wunder[a] gibt,
  rationale: Die Revision gibt וְנָתַן mit „gibt“ wieder, damit der Text nicht auf eine bloße Ankündigung eingeschränkt wird. „Traumseher“ kennzeichnet die im Hebräischen genannte Traumgestalt klarer als eine Person, die einfach Träume hat. Der offene bedingende Satzbau und die theologische Unbestimmtheit von Zeichen und Wunder bleiben erhalten.
