  text: וַ/יְבִאֵ֖/נוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יִּתֶּן לָ֨/נוּ֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: de
  text: Und er brachte uns an diesen Ort und gab uns dieses Land, ein Land, in dem Milch und Honig fließen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Land, das reich an Milch und Honig ist“. Das hebräische Bild bezeichnet Fruchtbarkeit und Überfluss.'
    reason: lexical_alternative
  - marker: b
    text: „Honig“ kann hier möglicherweise auch Sirup, etwa Dattelsirup, einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ אֶל הַמָּקוֹם הַזֶּה
  choice: er brachte uns an diesen Ort
  rationale: Die Hifil-Form von בוא bezeichnet das Heran- beziehungsweise Hineinbringen an ein Ziel. „An diesen Ort“ gibt אֶל mit dem Zielbezug natürlich wieder, ohne mehr als den hebräischen Text auszusagen.
- source_word: וַיִּתֶּן לָנוּ אֶת הָאָרֶץ הַזֹּאת
  choice: und gab uns dieses Land
  rationale: נתן mit ל bezeichnet das Geben an einen Empfänger. „Gab uns dieses Land“ ist schlicht, idiomatisch und bewahrt den konkreten Bezug auf das Israel gegebene Gebiet.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die partizipiale Wendung zeichnet das Bild eines von Milch und Honig fließenden Landes und steht idiomatisch für Fruchtbarkeit und Überfluss. Die deutsche Formulierung erhält Bild und Aussage in natürlicher Sprache.
- source_word: דְבָשׁ
  choice: Honig
  rationale: דְבָשׁ bezeichnet gewöhnlich Honig, kann im altorientalischen Gebrauch jedoch möglicherweise auch eingedickten Fruchtsaft, etwa Dattelsirup, einschließen. Die vertraute Hauptbedeutung bleibt im Text; die weitere Möglichkeit wird angemerkt.
theological_decisions:
- issue: Göttliches Subjekt im geschichtlichen Bekenntnis
  choice: Das Pronomen „er“ bleibt stehen.
  alternative: „Der HERR brachte uns an diesen Ort …“
  rationale: Im Vers selbst steht bei den Verben nur die dritte Person Singular; das Subjekt ergibt sich aus dem Zusammenhang. Das Pronomen bewahrt diese Textgestalt und setzt den Gottesnamen nicht ausdrücklich dort ein, wo er in diesem Vers nicht steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Bildsprache „Milch und Honig fließen“ bleibt erhalten; die Satzstellung ist klar und für heutige Leser gut verständlich.
