  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: de
  text: Dann nimmt der Priester den Korb aus deiner Hand und stellt ihn vor den Altar Jahwes, deines Gottes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann nimmt
  rationale: Das Perfekt mit vorangestelltem Waw führt im Ablauf der Ritualanweisung den nächsten Schritt ein. Das deutsche Präsens ist für Anweisungen natürlich; „Dann“ macht die Abfolge deutlich.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Bestimmtes Substantiv im Singular für den amtierenden Priester.
- source_word: הַטֶּנֶא
  choice: den Korb
  rationale: טֶנֶא bezeichnet hier den Korb, der die Erstlingsfrüchte enthält.
- source_word: מִיָּדֶךָ
  choice: aus deiner Hand
  rationale: Bewahrt das konkrete Bild der Übergabe aus der Hand des Opfernden und klingt im Deutschen idiomatisch.
- source_word: וְהִנִּיחוֹ
  choice: und stellt ihn
  rationale: Der Hifil von נוח bedeutet hier „hinstellen/platzieren“. Das Suffix bezieht sich auf den Korb; „stellt“ gibt die Handlung natürlich wieder, ohne eine nicht ausdrücklich bezeichnete Lage anzunehmen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Übliche räumlich-kultische Wiedergabe in Bezug auf den Altar.
- source_word: מִזְבַּח
  choice: den Altar
  rationale: Standardbezeichnung für den Opferaltar; durch die folgende Gottesbezeichnung näher bestimmt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen JHWH als im Deutschen etablierte Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Der Suffix der zweiten Person Singular bleibt erhalten. Nach „Jahwes“ ist die Apposition im Genitiv ein natürliches deutsches Äquivalent.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen Namen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das instruktive Präsens entspricht natürlichem deutschem Gesetzes- und Ritualstil. Die direkte Anrede im Singular bleibt erhalten.
