source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: de
  text: Wenn du in das Land kommst, das Jahwe, dein Gott, dir als Erbbesitz gibt[a], und du es in Besitz nimmst und darin wohnst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum bleibenden Besitz“. Das hebräische Wort bezeichnet einen zugeteilten Besitz, der als Erbe weitergegeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und dich darin niederlässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn
  rationale: Die hebräische Zukunfts- und Zeitformel leitet hier einen künftig eintretenden Umstand ein. Im modernen Deutschen gibt „Wenn“ ihre zeitliche Funktion natürlich wieder; die Satzverknüpfung ergibt sich aus dem Zusammenhang.
- source_word: תָבֹוא אֶל־הָאָרֶץ
  choice: du in das Land kommst
  rationale: בוא mit אֶל bezeichnet hier das Hineinkommen in das Land. Die zweite Person Singular bleibt entsprechend dem hebräischen Bundesappell erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die singularische Anrede und die persönliche Bundesbeziehung werden direkt bewahrt.
- source_word: נֹתֵן לְךָ
  choice: dir … gibt
  rationale: Das Partizip stellt Jahwes Geben als gegenwärtig gewiss beziehungsweise im Vollzug begriffen dar. Das deutsche Präsens wahrt diese Nuance natürlicher als eine ausdrücklich futurische Form.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet einen zugeteilten, bleibenden Besitz mit Erbcharakter. „Erbbesitz“ bewahrt sowohl den Besitz- als auch den Erbgedanken.
- source_word: וִירִשְׁתָּהּ
  choice: und du es in Besitz nimmst
  rationale: ירשׁ bezeichnet im Zusammenhang mit dem Land dessen tatsächliche Inbesitznahme. Diese Wiedergabe hält den aktiven Sinn fest und unterscheidet ihn vom vorausgehenden Erbbesitz.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: und darin wohnst
  rationale: ישׁב bezeichnet hier dauerhaftes Wohnen beziehungsweise Ansiedeln. „Darin wohnst“ ist zugleich genau, würdig und gegenwärtig verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname יהוה und kein bloßer Titel. Seine Wiedergabe als „Jahwe“ lässt den persönlichen Bundesnamen im Text sichtbar.
- issue: Verhältnis von göttlicher Gabe und menschlicher Inbesitznahme
  choice: Jahwe gibt das Land als Erbbesitz; Israel nimmt es anschließend in Besitz und wohnt darin.
  alternative: Die Abfolge zu einer allgemeinen Aussage über den Empfang des Landes zusammenziehen.
  rationale: Der hebräische Satz unterscheidet ausdrücklich Gottes Geben von Israels nachfolgendem Einzug, der Inbesitznahme und dem Wohnen. Diese Spannung und Abfolge wird nicht eingeebnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die singularische Du-Anrede, die zeitliche Satzstruktur und die Abfolge von Kommen, Gabe, Inbesitznahme und Wohnen bleiben erhalten.
