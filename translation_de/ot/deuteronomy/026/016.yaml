    rationale: 'Das Hebräische verbindet zwei Verben mit demselben direkten Objekt: die Bestimmungen bewahren und tun. „Nach ihnen handeln“ ist zwar sinngemäß, aber weniger direkt und schwächt die formelhafte Wiederholung. „Sie bewahren und befolgen“ ist sowohl quellentreuer als auch idiomatisch.'
