  source_fidelity: 'Der Entwurf gibt Zeitangabe, Gottesnamen, singularische Anrede sowie die beiden Rechtsbegriffe zutreffend wieder. Die Wendung „Halte sie und handle nach ihnen“ ist jedoch keine enge und idiomatische Wiedergabe von וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם („du sollst sie bewahren/halten und sie tun/befolgen“): Insbesondere „handle nach ihnen“ verschiebt das ausdrücklich wiederholte Objekt zu einer freieren Umschreibung.'
