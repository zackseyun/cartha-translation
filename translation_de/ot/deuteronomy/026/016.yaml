base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: de
  text: An diesem Tag gebietet dir Jahwe, dein Gott, diese Ordnungen und Rechtsbestimmungen zu befolgen; du sollst sie bewahren und befolgen mit deinem ganzen Herzen und mit deiner ganzen Seele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Seele“ kann auch „Leben“, „Person“ oder „ganzes Wesen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: An diesem Tag
  rationale: Die betonte Zeitangabe wird würdevoll und im Deutschen natürlich wiedergegeben; „Heute“ wäre ebenfalls möglich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Bewahrt die singularische, bundesbezogene Anrede Israels.
- source_word: מְצַוְּךָ
  choice: gebietet dir
  rationale: Das Partizip bezeichnet das gegenwärtige, unmittelbar geltende Gebieten; das Präsens gibt dies im Deutschen idiomatisch wieder.
- source_word: לַעֲשׂוֹת אֶת הַחֻקִּים הָאֵלֶּה וְאֶת הַמִּשְׁפָּטִים
  choice: diese Ordnungen und Rechtsbestimmungen zu befolgen
  rationale: Bei Rechtsnormen gibt „befolgen“ das kontextuelle Tun natürlich wieder. „Ordnungen“ und „Rechtsbestimmungen“ halten die beiden hebräischen Rechtsbegriffe unterscheidbar.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם
  choice: Halte sie und handle nach ihnen
  rationale: Bewahrt die Doppelung von Beachten und Ausführen, ohne im Deutschen die unnatürliche Wendung „tue sie“ zu verwenden.
- source_word: בְּכָל לְבָבְךָ
  choice: mit deinem ganzen Herzen
  rationale: Gibt die umfassende innere Ausrichtung von Denken, Wollen und Empfinden wieder.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: und mit deiner ganzen Seele
  rationale: Bewahrt die traditionelle Formulierung; eine Fußnote weist auf das breitere Bedeutungsspektrum von נֶפֶשׁ hin.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Singularische Anrede Israels
  choice: dir/dein/deinem/deiner
  alternative: euch/euer
  rationale: Das Hebräische redet Israel durchgehend in der zweiten Person Singular an; diese bundesbezogene Kollektivanrede bleibt im Deutschen erhalten.
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: Seele
  alternative: Leben; ganzes Wesen; Person
  rationale: „Seele“ wahrt die vertraute Paarung mit „Herz“, ohne das breitere Bedeutungsspektrum des hebräischen Wortes dogmatisch einzuengen; dieses wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte singularische Anrede und die rechtlich-bundestheologische Prägung bleiben erhalten; schwerfällige wörtliche Wendungen werden idiomatisch wiedergegeben.
