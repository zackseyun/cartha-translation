  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: de
  text: Du sollst von den Erstlingen aller Erträge des Erdbodens nehmen, die du von deinem Land einbringst, das Jahwe, dein Gott, dir gibt.[a] Lege sie in einen Korb und geh zu dem Ort, den Jahwe, dein Gott, erwählen wird, um seinen Namen dort wohnen zu lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom ersten Teil aller Frucht des Erdbodens“. „Frucht“ kann hier landwirtschaftliche Erträge insgesamt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Eine für das 5. Buch Mose typische Wendung für den Ort, den Jahwe erwählen wird; wörtlich: „um seinen Namen dort wohnen zu lassen“.'
    reason: theological_idiom
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann sollst du … nehmen
  rationale: Das Qal-Perfekt mit וְ führt in diesem Gesetzestext die Anweisungsfolge fort. „Sollst du“ gibt die verpflichtende Kraft in natürlichem Deutsch wieder; „Dann“ bindet den Vers an den vorausgehenden Zusammenhang an.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: von den Erstlingen aller Erträge des Erdbodens
  rationale: מִן bezeichnet eine Auswahl aus dem ersten Anteil; „Erstlinge“ bewahrt den kultisch-landwirtschaftlichen Sinn, ohne zu behaupten, sämtliche ersten Stücke müssten genommen werden. „Erträge“ verdeutlicht, dass פְּרִי hier nicht nur Baumfrüchte meint, während „Erdboden“ אֲדָמָה konkret wiedergibt.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: die du in deinem Land einbringst
  rationale: Der Hifil von בוא bezeichnet hier das Einbringen der Ernte. Die Formulierung bewahrt diese Bewegungsnuance und vermeidet die stärker deutende Übersetzung „erntest“.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: das Jahwe, dein Gott, dir gibt
  rationale: Das Partizip נֹתֵן beschreibt Gottes gegenwärtiges beziehungsweise charakteristisches Geben. Im Deutschen trägt das Präsens „gibt“ diesen fortdauernden Sinn natürlich.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: Du sollst sie in einen Korb legen
  rationale: טֶנֶא ist ein zum Tragen von Erzeugnissen dienender Korb. Das Pronomen „sie“ bezieht sich im Deutschen natürlich auf die Erstlinge beziehungsweise Erträge.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: und zu dem Ort gehen
  rationale: Die Form setzt die Anweisungsfolge fort. „Ort“ ist die angemessene Wiedergabe für Deuteronomiums Formel vom erwählten Heiligtumsort.
- source_word: אֲשֶׁר יִבְחַר
  choice: den … erwählen wird
  rationale: Der Imperfekt ist von Moses Rede aus zukunftsgerichtet. „Erwählen“ bewahrt zudem den bewussten Auswahlakt in der Heiligtumsformel.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  rationale: Der Hifil-Infinitiv von שכן ist kausativ. Die Wiedergabe erhält die prägnante deuteronomische Rede vom Wohnen des göttlichen Namens, statt sie zu „seinen Namen dort anbringen“ oder zu einer Aussage über räumliche Begrenzung Gottes zu verflachen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, anstatt ihn durch einen Titel zu ersetzen.
- issue: Heiligtumsformel לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  alternative: um seinen Namen dort anzubringen
  rationale: 'Die gewählte Fassung bewahrt sowohl den kausativen Sinn von שכן als auch die theologische Spannung der Aussage: Am erwählten Ort wohnt Gottes Name; der Text sagt nicht schlicht, Gott selbst sei räumlich dort eingeschlossen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede. Die Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Erstlinge“, „Erdboden“ und „erwählen“ halten den kultischen und landwirtschaftlichen Ton aufrecht, ohne unnötig altertümlich zu wirken.
