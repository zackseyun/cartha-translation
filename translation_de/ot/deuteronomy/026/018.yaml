base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: de
  text: Und der HERR hat heute erklärt, dass du ihm als kostbares Volk gehören sollst[a], wie er zu dir geredet hat[b], und dass du alle seine Gebote halten sollst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du sein kostbares Volk sein sollst“; wörtlich: „dass du ihm zu einem Volk, einem kostbaren Besitz, sein sollst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie er dir versprochen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und der HERR
  rationale: Der Gottesname JHWH wird nach der etablierten deutschen Bibelkonvention mit „der HERR“ wiedergegeben; „und“ bildet das verbindende וַ ab.
- source_word: הֶאֱמִירְךָ
  choice: hat erklärt, dass du … sein sollst
  rationale: Die seltene Hifil-Form bezeichnet im Zusammenhang von Dtn 26,17–18 eine feierliche, wirksame Erklärung. Die Formulierung gibt ihren förmlichen Bundescharakter wieder, ohne sie deutend mit „erwählt“ zu übersetzen.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ ist die natürliche moderne Entsprechung und bewahrt die unmittelbare Gegenwart des Bundesschlusses.
- source_word: לִהְיוֹת לוֹ
  choice: dass du sein … sein sollst
  rationale: Die Infinitivkonstruktion beschreibt den Inhalt beziehungsweise die Folge der Erklärung; die deutsche Nebensatzform ist klar und idiomatisch.
- source_word: לְעַם סְגֻלָּה
  choice: sein Volk, sein kostbarer Besitz
  rationale: Die Wiedergabe bewahrt sowohl das ausdrücklich genannte „Volk“ als auch die Bedeutung von סְגֻלָּה als besonders wertvoller Besitz. Die Apposition vermeidet das fachsprachlich wirkende Kompositum „Eigentumsvolk“.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: wie er zu dir geredet hat
  rationale: דִּבֶּר bedeutet zunächst „reden/sprechen“. Die wörtlich nahe Wiedergabe lässt offen, ob hier speziell eine Verheißung gemeint ist, statt dies im Haupttext festzulegen.
- source_word: וְלִשְׁמֹר
  choice: und dass du … halten sollst
  rationale: שׁמר bezeichnet bei Geboten deren gewissenhaftes Halten beziehungsweise Befolgen. Die wiederholte Nebensatzkonstruktion macht die syntaktische Zuordnung im Deutschen deutlich.
- source_word: כָּל מִצְוֺתָיו
  choice: alle seine Gebote
  rationale: Dies ist die direkte, im deutschen Bundes- und Gesetzeskontext geläufige Entsprechung.
theological_decisions:
- issue: Bundescharakter der seltenen Form הֶאֱמִירְךָ
  choice: förmliche göttliche Erklärung
  alternative: „erwählt“ oder „zu seinem Volk gemacht“
  rationale: Der unmittelbare Parallelismus mit Vers 17 beschreibt gegenseitige Bundeserklärungen. „Erklärt“ bewahrt den performativen Charakter, ohne eine weitergehende Lehre von Erwählung oder eine abgeschlossene Verwandlung ausdrücklich in das Verb hineinzulegen.
- issue: Bedeutung von דִּבֶּר im Rückverweis
  choice: „wie er zu dir geredet hat“
  alternative: „wie er dir versprochen hat“
  rationale: Der Kontext kann ein Versprechen einschließen, doch das hebräische Verb selbst lautet „reden“. Die Übersetzung erhält diese Offenheit; die idiomatisch mögliche Deutung als Verheißung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt trotz des langen Bundesformulars gut verständlich. „Der HERR“ folgt der geläufigen typografischen Wiedergabe des Gottesnamens; „kostbarer Besitz“ vermittelt den Wertakzent von סְגֻלָּה ohne konfessionell geprägte Zusatzdeutung.
