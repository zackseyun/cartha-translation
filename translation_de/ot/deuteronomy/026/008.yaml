  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: de
  text: Und Jahwe führte uns mit starker Hand und ausgestrecktem Arm aus Ägypten heraus, mit großem Schrecken[a] und mit Zeichen und Wundern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Ehrfurcht“ oder „mit großen, Ehrfurcht gebietenden Taten“. Das hebräische Wort kann Furcht beziehungsweise Schrecken oder eine Ehrfurcht erregende Machtoffenbarung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: führte uns … heraus
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszuführen oder herauszubringen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt das Motiv des Auszugs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Umschrift.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten heraus
  rationale: Die Präposition מִן bezeichnet zusammen mit dem Verb klar die Bewegung aus Ägypten heraus.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die bildhafte hebräische Wendung für machtvolles Handeln wird nah am Wortlaut und zugleich verständlich wiedergegeben.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: und ausgestrecktem Arm
  rationale: Die traditionelle und transparente Wiedergabe erhält das Bild göttlicher Macht in Aktion.
- source_word: וּבְמֹרָא גָּדֹל
  choice: mit großem Schrecken
  rationale: מוֹרָא kann Schrecken, Furcht oder eine Ehrfurcht erregende Erscheinung bezeichnen. „Großer Schrecken“ bewahrt im Kontext der Machttaten gegen Ägypten die starke Wirkung des Ausdrucks.
- source_word: וּבְאֹתוֹת
  choice: mit Zeichen
  rationale: אוֹתוֹת bedeutet hier „Zeichen“; deren übernatürlicher Charakter ergibt sich aus dem Zusammenhang und muss nicht ergänzt werden.
- source_word: וּבְמֹפְתִים
  choice: und Wundern
  rationale: מוֹפְתִים bildet mit „Zeichen“ die geläufige und sachgerechte Verbindung „Zeichen und Wunder“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Charakter eines Eigennamens, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von מוֹרָא in der Auszugsformel
  choice: großer Schrecken
  alternative: große Ehrfurcht; große Ehrfurcht gebietende Taten
  rationale: Der Ausdruck kann sowohl die hervorgerufene Furcht als auch eine Ehrfurcht erregende Machtoffenbarung bezeichnen. Der Haupttext gibt die starke Furchtdimension wieder; die Fußnote hält die echte lexikalische Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen mit-Wendungen und die überlieferten Bilder „starke Hand“ und „ausgestreckter Arm“ bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei „Schrecken“, auf dessen Mehrdeutigkeit sich die Anmerkung bezieht.
