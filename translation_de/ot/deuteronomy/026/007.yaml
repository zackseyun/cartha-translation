  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: de
  text: Da schrien wir zu Jahwe, dem Gott unserer Väter, und Jahwe hörte unsere Stimme und sah unser Elend, unsere Mühsal und unsere Bedrückung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: Da schrien wir
  rationale: צעק bezeichnet hier einen dringenden Hilferuf. „Schrien“ bewahrt die Intensität und fügt sich natürlich in die erzählende Rückschau ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: dem Gott unserer Väter
  rationale: Die Wiedergabe erhält die konkrete Bundesformel und den Bezug auf Israels Vorväter.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: hörte unsere Stimme
  rationale: Dies bildet die hebräische Wendung eng ab und ist im Deutschen verständlich; gemeint ist, dass Jahwe ihren Hilferuf vernahm.
- source_word: וַיַּרְא
  choice: sah
  rationale: Das einfache Verb bewahrt die knappe, theologisch gewichtige Aussage, ohne sie durch „beachtete“ oder „nahm sich an“ auszudeuten.
- source_word: עָנְיֵנוּ
  choice: unser Elend
  rationale: עֳנִי bezeichnet einen leidvollen, erniedrigten Zustand. „Elend“ ist im modernen Deutsch klar und unterscheidet sich von der abschließenden Bedrückung.
- source_word: עֲמָלֵנוּ
  choice: unsere Mühsal
  rationale: עָמָל kann beschwerliche Arbeit, Mühe und Plage bezeichnen. „Mühsal“ erhält diese Bedeutungsbreite und den Bezug zur auferlegten Fronarbeit.
- source_word: לַחֲצֵנוּ
  choice: unsere Bedrückung
  rationale: לַחַץ bezeichnet bedrängenden Druck beziehungsweise Unterdrückung. „Bedrückung“ bewahrt das Bild des auf Israel ausgeübten Drucks und bleibt von „Elend“ und „Mühsal“ unterscheidbar.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen unmittelbar. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von Gottes Sehen
  choice: sah
  alternative: nahm sich an
  rationale: „Sah“ lässt offen, wie das wahrnehmende Sehen näher theologisch zu bestimmen ist, und vermeidet eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Anlehnung an die hebräische Satzstruktur. Die Dreierfolge „Elend, Mühsal und Bedrückung“ bewahrt die unterschiedlichen, sich überschneidenden Leidensbegriffe. Keine Fußnoten erforderlich.
