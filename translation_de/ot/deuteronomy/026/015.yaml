  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: de
  text: Blicke herab von deiner heiligen Wohnung, vom Himmel, und segne dein Volk Israel und das Land, das du uns gegeben hast, wie du unseren Vätern[a] geschworen hast – ein Land, in dem Milch und Honig fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Vorfahren“. Das hebräische Wort lautet „Väter“ und bezieht sich hier besonders auf die Erzväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Blicke herab
  rationale: Der Imperativ bezeichnet ein Hinschauen von einem erhöhten Ort. „Blicke herab“ gibt sowohl die Blickrichtung als auch den durch den Himmel bestimmten Standort natürlich wieder.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: von deiner heiligen Wohnung
  rationale: מָעוֹן bezeichnet einen Wohn- oder Aufenthaltsort. „Heilige Wohnung“ ist verständlich, würdevoll und bewahrt die sakrale Bestimmung durch קָדְשְׁךָ.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel
  rationale: Das formal pluralische הַשָּׁמַיִם wird in dieser Ortsangabe im Deutschen idiomatisch mit dem Singular „Himmel“ wiedergegeben.
- source_word: וּבָרֵךְ
  choice: und segne
  rationale: Die direkte Imperativform von ברך wird transparent und sachgerecht mit „segne“ wiedergegeben.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: dein Volk Israel
  rationale: Die Apposition identifiziert Gottes Volk als Israel. Die knappe deutsche Form bewahrt sowohl die Zugehörigkeit zu Gott als auch den Namen des Volkes.
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: אֲדָמָה kann Ackerboden oder Land bezeichnen. Im Kontext der Gabe an Israel und der anschließenden Beschreibung als Land von Milch und Honig ist „das Land“ natürlich und sachlich passend, auch wenn dadurch die lexikalische Abgrenzung zu אֶרֶץ weniger sichtbar wird.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: das du uns gegeben hast
  rationale: Das deutsche Perfekt bringt die vollzogene Gabe mit ihrer fortdauernden Bedeutung für die Betenden natürlich zum Ausdruck.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: wie du unseren Vätern geschworen hast
  rationale: Die Formulierung hält sich an den maskulinen hebräischen Ausdruck und an die Bundesformel, die in diesem Zusammenhang besonders auf die Erzväter verweist.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die etablierte deutsche Wendung vermittelt das hebräische Bild von Fruchtbarkeit und Überfluss klar und ohne es erklärend aufzulösen.
theological_decisions:
- issue: Wiedergabe von לַאֲבֹתֵינוּ in der Bundesformel
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural „Väter“; im Zusammenhang des göttlichen Eides sind besonders die Erzväter gemeint. Die mögliche weitere Bedeutung „Vorfahren“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetssprache bleibt direkt und verständlich. Der Gedankenstrich vor der abschließenden Landbeschreibung macht ihre appositionelle Funktion deutlich, ohne die syntaktische Offenheit des Hebräischen unnötig auszubauen.
