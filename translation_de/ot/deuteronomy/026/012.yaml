base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: de
  text: Wenn du im dritten Jahr, dem Jahr des Zehnten, damit fertig bist, den gesamten Zehnten deines Ertrags auszusondern, dann gib ihn dem Leviten, dem ansässigen Fremden, der Waise und der Witwe. Sie sollen in deinen Ortschaften[a] davon essen und satt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: in deinen Toren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den zeitlichen Umstand ein, nach dessen Abschluss die folgende Anweisung gilt.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: vollständig ausgesondert hast
  rationale: Die Verbindung bezeichnet den vollständigen Vollzug des Verzehntens. „Ausgesondert“ gibt die praktische Handlung in natürlichem Deutsch wieder; der unmittelbar folgende „Zehnte“ bewahrt den sachlichen Begriff.
- source_word: מַעְשַׂר תְּבוּאָתְךָ
  choice: den ganzen Zehnten von deinem Ertrag
  rationale: מַעְשַׂר ist der Zehnte; תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag beziehungsweise die Hervorbringung des Landes.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: dem Jahr des Zehnten
  rationale: Die konstruktive Wortverbindung wird eng und verständlich wiedergegeben, ohne den besonderen Charakter dieses Jahres weiter auszudeuten.
- source_word: וְנָתַתָּה
  choice: dann gib ihn
  rationale: Die deutsche Aufforderung gibt die fortlaufende Rechtsanweisung natürlich wieder; „ihn“ bezieht sich auf den Zehnten.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: גֵּר bezeichnet hier einen nichtisraelitischen Fremden, der dauerhaft innerhalb der Gemeinschaft lebt, nicht lediglich einen Durchreisenden.
- source_word: יָתוֹם
  choice: Waise
  rationale: „Waise“ ist die geläufige moderne deutsche Bezeichnung für die in den Rechtstexten genannte schutzbedürftige Person.
- source_word: בִשְׁעָרֶיךָ
  choice: in deinen Toren
  rationale: Die konkrete Bildsprache des Hebräischen bleibt im Haupttext erhalten; die gemeinte örtliche Bedeutung wird in einer Fußnote erläutert.
- source_word: וְשָׂבֵעוּ
  choice: und satt werden
  rationale: Das Verb bezeichnet das Essen bis zur Sättigung und wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Benennung der sozial und rechtlich besonders geschützten Empfänger
  choice: Levit, ansässiger Fremder, Waise und Witwe
  alternative: religiöse Amtsträger, Zugewanderte und andere Bedürftige
  rationale: Der Text nennt konkrete Gruppen innerhalb der Bundesordnung. Ihre Bezeichnungen werden bewahrt und nicht zu einer allgemeinen sozialen Kategorie erweitert.
- issue: Wiedergabe von בִשְׁעָרֶיךָ
  choice: wörtliches Bild „in deinen Toren“ im Haupttext
  alternative: „in deinen Ortschaften“ im Haupttext
  rationale: Die hebräische Ortsformel bezeichnet den Siedlungs- und Lebensbereich. Das Bild bleibt sichtbar, während die Fußnote die idiomatische Bedeutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Der Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die Abfolge und sämtliche Empfängergruppen des hebräischen Textes bleiben erhalten.
