  source_fidelity: Der Entwurf gibt die zeitliche Bedingung, das dritte Jahr als „Jahr des Zehnten“, den vollständigen Zehnten des Ertrags, alle vier Empfängergruppen und das Essen bis zur Sättigung sachgerecht wieder. „In deinen Toren“ ist jedoch im modernen Deutschen keine verständliche Ortsangabe für die hebräische Siedlungsformel בִּשְׁעָרֶיךָ; die idiomatische Bedeutung sollte im Haupttext stehen, während die wörtliche Formulierung in der Fußnote erhalten bleibt.
  naturalness: „Den ganzen Zehnten ... vollständig ausgesondert“ ist unnötig doppelt markiert und weniger flüssig. Die Wendung „damit fertig bist, ... auszusondern“ bildet den Abschlussaspekt von תְכַלֶּה natürlich ab. „In deinen Ortschaften“ ist modernes, verständliches Standarddeutsch; die Fußnote dokumentiert die hebräische Bildsprache.
  terminology: „Zehnter“, „Levit“, „Waise“ und „Witwe“ sind angemessen. „Ansässiger Fremder“ ist als präzise Bezeichnung für גֵּר vertretbar. Die Umstellung der Ortsformel ist keine theologische Auslegung, sondern die Wiedergabe eines hebräischen Idioms.
