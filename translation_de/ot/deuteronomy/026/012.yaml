  to: Wenn du im dritten Jahr, dem Jahr des Zehnten, damit fertig bist, den gesamten Zehnten deines Ertrags auszusondern, dann gib ihn dem Leviten, dem ansässigen Fremden, der Waise und der Witwe. Sie sollen in deinen Ortschaften[a] davon essen und satt werden.
