revisions:
- from: 'Du sollst vor Jahwe, deinem Gott, antworten und sagen: »Mein Vater war ein dem Untergang naher Aramäer.[a] Er zog nach Ägypten hinab und lebte dort als Fremder, mit nur wenigen Leuten. Dort wurde er zu einem großen, starken und zahlreichen Volk.«'
  to: 'Du sollst vor Jahwe, deinem Gott, antworten und sagen: »Mein Vater war ein umherziehender Aramäer.[a] Er zog nach Ägypten hinab und lebte dort als Fremder, in geringer Zahl. Dort wurde er zu einem großen, starken und zahlreichen Volk.«'
  rationale: Die Revision ersetzt die unidiomatische Hauptformulierung durch die im unmittelbaren Kontext der Wanderung und des Hinabziehens nach Ägypten gut passende Lesart „umherziehender“. Die Fußnote erhält die alternative Bedeutung des Partizips und weist vorsichtig auf die bekannte abweichende traditionelle Satzdeutung hin. „In geringer Zahl“ bildet die hebräische Mengenangabe genauer und natürlicher ab.
  reviewer_model: gpt-5.6-terra
