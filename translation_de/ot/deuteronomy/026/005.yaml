    issue: Unnatürliche und zu eng geführte Hauptübersetzung von אֹבֵד
    rationale: „Ein dem Untergang naher Aramäer“ ist im Deutschen keine geläufige attributive Formulierung. Zudem ist אֲרַמִּי אֹבֵד אָבִי umstritten; eine flüssige kontextuelle Hauptlesung mit einer umfassenderen Anmerkung bewahrt die Ungewissheit besser.
