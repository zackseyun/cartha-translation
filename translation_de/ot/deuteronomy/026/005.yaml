base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: de
  text: 'Du sollst vor Jahwe, deinem Gott, antworten und sagen: »Mein Vater war ein umherziehender Aramäer.[a] Er zog nach Ägypten hinab und lebte dort als Fremder, in geringer Zahl. Dort wurde er zu einem großen, starken und zahlreichen Volk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Vater war ein dem Untergang preisgegebener Aramäer.« Das hebräische Partizip kann sowohl „zugrunde gehend“ als auch, im Zusammenhang dieser Erzählung, „umherziehend“ bedeuten. Traditionell wird die Wortgruppe auch als »Ein Aramäer wollte meinen Vater vernichten« verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: du sollst antworten und sagen
  rationale: Die hebräische Doppelformel leitet ein festes, feierliches Bekenntnis ein. Die direkte Wiedergabe bewahrt ihren liturgischen Charakter und bleibt im Deutschen verständlich.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: „Vor“ gibt לִפְנֵי knapp und idiomatisch wieder; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֲרַמִּי אֹבֵד אָבִי
  choice: Mein Vater war ein dem Untergang naher Aramäer
  rationale: אֹבֵד ist ein Partizip von אבד und kann einen Verlorenen beziehungsweise vom Untergang Bedrohten bezeichnen. „Dem Untergang nah“ bewahrt diesen Zustandssinn, ohne den Text auf eine konkrete Todesursache festzulegen. Die ebenfalls mögliche Deutung als „umherziehend“ steht in der Fußnote.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Er zog nach Ägypten hinab
  rationale: „Hinabziehen“ erhält die hebräische Richtungsangabe und ist im Deutschen als geografisch-theologische Reiseformel verständlich.
- source_word: וַיָּגָר שָׁם
  choice: lebte dort als Fremder
  rationale: גור bezeichnet den Aufenthalt als Fremder beziehungsweise Schutzbürger und nicht bloß ein neutrales Wohnen oder Bleiben.
- source_word: בִּמְתֵי מְעָט
  choice: mit nur wenigen Leuten
  rationale: Die Wendung bezeichnet die geringe Zahl der Gruppe. „Leute“ gibt den kollektiven Sinn natürlich wieder, ohne ihn unnötig auf erwachsene Männer zu beschränken.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: Dort wurde er zu einem Volk
  rationale: Der Singular stellt den Stammvater repräsentativ für seine Nachkommen dar. Die Formulierung erhält dieses auffällige Bild, statt den Subjektwechsel stillschweigend auszudeuten.
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: groß, stark und zahlreich
  rationale: Die drei Adjektive geben Größe, Stärke und zahlenmäßiges Wachstum in einer natürlichen deutschen Reihung wieder.
theological_decisions:
- issue: Deutung von אֲרַמִּי אֹבֵד אָבִי
  choice: Mein Vater war ein dem Untergang naher Aramäer
  alternative: 'Mein Vater war ein umherziehender Aramäer; außerdem traditionell: Ein Aramäer wollte meinen Vater vernichten'
  rationale: Nach der masoretischen Akzentuierung und der gewöhnlichen Syntax ist „mein Vater“ das Subjekt und אֹבֵד eine nähere Bestimmung. Das Partizip kann den drohenden Untergang oder, kontextuell verstanden, ein unstetes Umherziehen ausdrücken. Die Hauptfassung hält sich eng an den Grundsinn von אבד; die Fußnote bewahrt die verbreitete alternative Deutung. Die Lesart mit dem Aramäer als Angreifer erfordert eine stärker interpretierende Umdeutung der Syntax und wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die liturgische Einleitungsformel bleibt bewusst nah am Hebräischen; „lebte dort als Fremder“ erklärt dagegen das heute wenig gebräuchliche Konzept des Beisassen ohne altertümliches Vokabular.
