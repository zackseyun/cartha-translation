  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: de
  text: Und nun, sieh, ich habe den ersten Anteil vom Ertrag des Ackerbodens[a] gebracht, den du, Yahweh, mir gegeben hast. Dann sollst du ihn vor Yahweh, deinem Gott, niederlegen und dich vor Yahweh, deinem Gott, niederwerfen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die Erstlingsfrüchte des Erdbodens« oder »das Erste vom Ertrag des Landes«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet hier ausdrücklich das Sich-Niederwerfen; »anbeten« wäre eine weiter gefasste, deutende Wiedergabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den Übergang vom zuvor gesprochenen Bekenntnis zur gegenwärtigen Darbringung und klingt im Deutschen natürlich.
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt die hinweisende und aufmerksamkeitslenkende Funktion der Partikel in würdiger, heutiger Sprache wieder.
- source_word: הֵבֵאתִי
  choice: Ich habe ... gebracht
  rationale: Das Perfekt bezeichnet die vollzogene Handlung; das deutsche Perfekt passt zur gesprochenen Ritualformel.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: den ersten Ertrag des Ackerbodens
  rationale: Bewahrt den Gedanken des ersten Anteils am landwirtschaftlichen Ertrag, ohne das Hebräische unnötig mit einem kirchlich geprägten Fachwort festzulegen.
- source_word: הָאֲדָמָה
  choice: Ackerboden
  rationale: Im Zusammenhang mit Feldfrüchten steht der kultivierte Erdboden im Vordergrund; zugleich wird eine Verwechslung mit dem territorialen »Land« vermieden.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: den du ... mir gegeben hast
  rationale: Erhält den Relativsatz und das ausdrückliche Bekenntnis, dass der Ertrag Gottes Gabe ist.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen direkt und unterscheidbar von Titeln wieder.
- source_word: וְהִנַּחְתּוֹ
  choice: Dann sollst du ihn ... niederstellen
  rationale: Die verbundene Perfektform hat hier innerhalb der Ritualanweisung verpflichtenden beziehungsweise anweisenden Sinn; »niederstellen« bezeichnet die konkrete Platzierung.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die knappe deutsche Entsprechung bewahrt sowohl die räumliche als auch die kultische Bedeutung der Gegenwart Gottes.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Bewahrt die singularische Anrede und die Bundesbezeichnung an beiden Stellen.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: und dich ... niederwerfen
  rationale: Bezeichnet ausdrücklich die körperliche Gebärde der tiefen Verbeugung beziehungsweise Prostration und ist genauer als das umfassendere »anbeten«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; seine direkte Wiedergabe bewahrt diese Unterscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וְהִשְׁתַּחֲוִיתָ
  choice: dich niederwerfen
  alternative: anbeten
  rationale: Die Übersetzung wahrt die konkrete körperliche Handlung. Dass sie hier verehrende Anbetung ausdrückt, bleibt im Kontext erkennbar, wird aber nicht an die Stelle der Bildlichkeit gesetzt.
translation_notes:
  register: Moderne, würdige Standardsprache. »Sieh« erhält die deiktische Kraft von הִנֵּה ohne das altertümlich wirkende »siehe«. Die direkte Anrede »Yahweh« bleibt erhalten; die zweimalige Wendung »vor Yahweh, deinem Gott« wird entsprechend der feierlichen Wiederholung des Hebräischen nicht verkürzt.
