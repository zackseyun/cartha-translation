source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: de
  text: und dich hoch über alle Völker zu stellen, die er gemacht hat, zu Lob, Ruhm[a] und Pracht[b], und damit du dem HERRN, deinem Gott, ein heiliges Volk bist, wie er gesagt hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Name“; das hebräische Wort kann hier einen guten Namen, Ansehen oder Ruhm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schönheit“, „herrlicher Glanz“ oder „Herrlichkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie er verheißen hat“; wörtlich: „wie er geredet/gesagt hat“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: und dich hoch über alle Völker zu stellen
  rationale: Die Infinitivkonstruktion führt die Aussage des vorausgehenden Verses fort. „Hoch über … stellen“ gibt sowohl נתן als auch die prädikative Erhöhung durch עֶלְיוֹן klar und natürlich wieder.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er gemacht hat
  rationale: Das Relativpronomen bezieht sich auf die Völker. „Gemacht“ bleibt beim allgemeinen Bedeutungsumfang von עשה und vermeidet die stärkere Festlegung auf „erschaffen“.
- source_word: לִתְהִלָּה
  choice: zu Lob
  rationale: Die Präposition ל bezeichnet hier Ziel oder Ergebnis. „Lob“ wahrt die knappe nominale Dreierreihe.
- source_word: וּלְשֵׁם
  choice: Ruhm
  rationale: Wörtlich steht „Name“; שֵׁם bezeichnet jedoch häufig den guten Namen, das Ansehen oder den Ruhm. „Ruhm“ ist im Deutschen in dieser Aufzählung verständlicher, während die Fußnote die Bildsprache offenlegt.
- source_word: וּלְתִפְאָרֶת
  choice: Pracht
  rationale: תִּפְאֶרֶת kann Schönheit, herrlichen Glanz, Pracht oder Herrlichkeit bezeichnen. „Pracht“ erhält den ästhetischen und zugleich erhabenen Sinn, ohne ihn ausschließlich theologisch als „Herrlichkeit“ festzulegen.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: und damit du … ein heiliges Volk bist
  rationale: Die Infinitivkonstruktion drückt einen weiteren Zweck beziehungsweise ein Ergebnis aus. „Damit du … bist“ ist im modernen Deutschen natürlicher als eine substantivierte oder wörtlich infinitivische Fassung.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: dem HERRN, deinem Gott
  rationale: Das ל markiert hier Zugehörigkeit oder Beziehung. Der Gottesname יהוה wird nach der festgelegten Konvention mit „der HERR“ wiedergegeben; der Dativ fügt sich natürlich in den deutschen Satz ein.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: wie er gesagt hat
  rationale: דבר bedeutet zunächst „reden/sagen“. Die Formulierung bleibt daher näher am Hebräischen als „wie er verheißen hat“, ohne die im Bundeskontext mögliche Verheißungsbedeutung auszuschließen.
theological_decisions:
- issue: Ob die abschließende Aussage ausdrücklich als Verheißung wiederzugeben ist
  choice: wie er gesagt hat
  alternative: wie er verheißen hat
  rationale: Der hebräische Wortlaut verwendet das allgemeine Verb דבר. Der Kontext kann eine Verheißung meinen, doch die Hauptfassung legt diese Deutung nicht ausdrücklich in das Verb hinein.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die Hauptfassung folgt der vorgegebenen Übersetzungskonvention für das Tetragramm und verwendet „HERR“ in Kapitälchen-Schreibweise.
- issue: Bezug der Erhöhung Israels auf Lob, Ruhm und Pracht
  choice: Die dreifache Ziel- oder Ergebnisangabe bleibt grammatisch an die Erhöhung Israels angeschlossen.
  alternative: Die Begriffe ausdrücklich als Lob und Herrlichkeit Gottes deuten
  rationale: Der hebräische Satz nennt nicht ausdrücklich, wer gelobt wird oder wessen Ruhm und Pracht gemeint sind. Die Übersetzung bewahrt diese Offenheit und ergänzt keinen theologischen Besitzer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortführende Infinitivstruktur am Versanfang wird beibehalten, da der Vers syntaktisch an 26,18 anschließt. Die nominale Dreierreihe bleibt knapp und rhythmisch; ungebräuchliches „zu einem Namen“ wird zugunsten des kontextuellen „Ruhm“ vermieden und durch eine Fußnote transparent gemacht.
