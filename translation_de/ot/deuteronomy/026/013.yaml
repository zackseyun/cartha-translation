  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: de
  text: 'Dann sollst du vor Yahweh, deinem Gott, sagen: »Ich habe das Geheiligte[a] aus dem Haus entfernt und es auch dem Leviten, dem ansässigen Fremden[b], der Waise und der Witwe gegeben, ganz nach deinem ganzen Gebot, das du mir geboten hast. Ich habe keines deiner Gebote übertreten und keines vergessen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die heilige Abgabe«. Gemeint ist der geheiligte Zehnte beziehungsweise der ausgesonderte Ertrag, der verteilt werden sollte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dem Fremden, der unter euch lebt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Dann sollst du … sagen
  rationale: Das Perfekt mit Waw führt die rituelle Handlungsfolge fort; „Dann“ gibt diese Abfolge im modernen Deutsch natürlich wieder.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Yahweh, deinem Gott
  rationale: לִפְנֵי bezeichnet hier das Sprechen vor beziehungsweise in der Gegenwart Gottes; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: בִּעַרְתִּי
  choice: Ich habe … entfernt
  rationale: בער meint in diesem Zusammenhang das vollständige Wegschaffen der geheiligten Abgabe aus dem Haushalt, nicht ein Verbrennen.
- source_word: הַקֹּדֶשׁ
  choice: das Geheiligte
  rationale: Die substantivierte Form bewahrt die knappe Bedeutung „das Heilige/Geheiligte“ und bezeichnet im Kontext die ausgesonderte, geheiligte Abgabe.
- source_word: מִן הַבַּיִת
  choice: aus dem Haus
  rationale: Die bestimmte Form des Hebräischen wird formal gewahrt; dass es sich um das Haus des Sprechers handelt, ergibt sich aus dem Zusammenhang.
- source_word: וְגַם נְתַתִּיו
  choice: und es auch … gegeben
  rationale: Das Suffix bezieht sich auf das Geheiligte; das Perfekt bezeichnet die abgeschlossene, nun erklärte Handlung.
- source_word: לַלֵּוִי
  choice: dem Leviten
  rationale: Der Text nennt den Leviten und schränkt die Bezeichnung nicht auf einen Priester ein.
- source_word: לַגֵּר
  choice: dem ansässigen Fremden
  rationale: גֵּר bezeichnet einen dauerhaft unter Israel lebenden Fremden; „ansässiger Fremder“ drückt diese soziale Stellung verständlicher aus als das bloße „Fremder“.
- source_word: לַיָּתוֹם
  choice: der Waise
  rationale: „Waise“ ist die natürliche moderne deutsche Bezeichnung für die im hebräischen Recht genannte schutzbedürftige Gruppe; das Geschlecht bleibt wie im generischen hebräischen Ausdruck offen.
- source_word: וְלָאַלְמָנָה
  choice: der Witwe
  rationale: Direkte und geläufige Wiedergabe der genannten sozialen Gruppe.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: ganz nach deinem Gebot, das du mir gegeben hast
  rationale: Der Singular מִצְוָה wird beibehalten; die Wiederholung von Substantiv und Verb bleibt erkennbar, ohne im Deutschen unnatürlich „geboten hast“ direkt nach „Gebot“ zu formulieren.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Ich habe keines deiner Gebote übertreten
  rationale: עבר מן bedeutet hier, eine Weisung zu übertreten. „Keines“ gibt die verneinte Aussage mit dem pluralischen Objekt idiomatisch und vollständig wieder.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: und keines vergessen
  rationale: Das ergänzte „keines“ nimmt im Deutschen eindeutig die Gebote wieder auf; im Hebräischen ist das Objekt aus dem vorherigen Satzglied mitzudenken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Tetragrammaton. Die Transliteration wahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַקֹּדֶשׁ
  choice: das Geheiligte
  alternative: die heilige Abgabe
  rationale: „Das Geheiligte“ bewahrt die sprachliche Offenheit des Ausdrucks, während der Kontext erkennen lässt, dass die ausgesonderte Abgabe beziehungsweise der Zehnte gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die kultische Erklärung bleibt formal erkennbar, wird aber mit natürlicher deutscher Syntax wiedergegeben. Die Anführungszeichen kennzeichnen die vorgeschriebene Erklärung.
