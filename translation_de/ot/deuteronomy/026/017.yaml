base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: de
  text: Heute hast du Jahwe als deinen Gott anerkannt und dich verpflichtet, auf seinen Wegen zu gehen, seine Satzungen, Gebote und Rechtsbestimmungen zu halten und auf seine Stimme zu hören.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier verwendete hebräische Verbform ist ungewöhnlich. Auch möglich: „Heute hast du Jahwe feierlich als deinen Gott erklärt“ oder „... feierlich anerkannt“.'
    reason: lexical_alternative
  - marker: b
    text: „Auf seine Stimme hören“ schließt hier ein, ihr zu gehorchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: הֶאֱמַרְתָּ
  choice: hast du dich … bekannt und erklärt
  rationale: Die seltene Hifil-Form bezeichnet hier im Zusammenhang mit Vers 18 eine feierliche, wechselseitige Erklärung beziehungsweise Anerkennung. Die deutsche Formulierung gibt den Bundescharakter verständlich wieder, ohne die ungewöhnliche Wendung als gewöhnliches Sprechen zu verflachen.
- source_word: הַיּוֹם
  choice: Heute
  rationale: Dies ist die natürliche und genaue moderne Wiedergabe der zeitlichen Hervorhebung.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: als deinem Gott
  rationale: 'Die Formulierung bezeichnet die anerkannte Bundesbeziehung: Jahwe soll für Israel Gott sein.'
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: dass du auf seinen Wegen gehen … wirst
  rationale: Das biblische Bild vom Gehen auf Gottes Wegen bleibt erhalten; der deutsche Nebensatz verdeutlicht den Anschluss der Infinitive an die feierliche Erklärung.
- source_word: חֻקָּיו
  choice: seine Satzungen
  rationale: „Satzungen“ wahrt den rechtlich-bundestheologischen Sprachgebrauch und unterscheidet den Begriff von Geboten und Rechtsbestimmungen.
- source_word: מִצְוֺתָיו
  choice: Gebote
  rationale: „Gebote“ ist die geläufige und präzise Wiedergabe im rechtlichen und bundestheologischen Zusammenhang.
- source_word: מִשְׁפָּטָיו
  choice: Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet verbindliche rechtliche Ordnungen beziehungsweise Entscheidungen; „Rechtsbestimmungen“ ist im heutigen Deutsch klarer als „Rechtssprüche“ und hält die drei Gesetzesbegriffe auseinander.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: auf seine Stimme hören
  rationale: Die konkrete hebräische Wendung bleibt erhalten. Im Bundeszusammenhang schließt das Hören Gehorsam ein, ohne dass dieser Bedeutungsanteil die Bildsprache verdrängt.
theological_decisions:
- issue: Bundeserklärung und handelnde Person
  choice: Israel bekennt sich feierlich zu Jahwe als seinem Gott und erklärt zugleich seine Verpflichtung, nach seinen Weisungen zu leben.
  alternative: Die seltene Verbform kann formaler mit „du hast Jahwe erklären lassen“ oder „du hast Jahwe feierlich anerkannt“ wiedergegeben werden.
  rationale: Die parallele Formulierung in Vers 18 legt eine wechselseitige Bundeserklärung nahe. Die Übersetzung macht Israels Bekenntnis und Verpflichtung deutlich, ohne die grammatisch ungewöhnliche Konstruktion als bloße Aussage aufzulösen.
- issue: Hören und Gehorchen
  choice: Die Hauptübersetzung lautet „auf seine Stimme hören“.
  alternative: „seiner Stimme gehorchen“ oder „auf seine Stimme hören und ihr gehorchen“.
  rationale: שׁמע בקול trägt hier eindeutig eine Gehorsamskomponente, doch die wörtliche Bildsprache des Hörens ist theologisch und literarisch bedeutsam und soll bewahrt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild „auf seinen Wegen gehen“ und die konkrete Wendung „auf seine Stimme hören“ bleiben erhalten. Die drei Rechtstermini werden als „Satzungen, Gebote und Rechtsbestimmungen“ unterschieden.
