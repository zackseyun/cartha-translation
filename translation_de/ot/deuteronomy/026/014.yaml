base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: de
  text: Ich habe während meiner Trauer nichts davon gegessen[a], nichts davon beseitigt[b], als ich unrein war, und nichts davon für einen Toten gegeben[c]. Ich habe der Stimme Jahwes, meines Gottes, gehorcht; ich habe alles so getan, wie du es mir geboten hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in meinem Kummer“ oder „in meiner Bedrängnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „verbrannt“ oder „weggeschafft“. Das hebräische Verb kann sowohl Verbrennen als auch Entfernen oder Beseitigen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „einem Toten“ oder „im Zusammenhang mit einem Toten“. Welche verbotene Verwendung gemeint ist, wird nicht näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: während meiner Trauer
  rationale: אֹנִי bezeichnet hier Trauer, Kummer oder Bedrängnis. Der Kontext kultischer Reinheit legt Trauer nahe; das Possessivsuffix wird mit „meiner“ ausdrücklich wiedergegeben.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: nichts davon beseitigt
  rationale: בער im Piel kann „verbrennen“, „wegschaffen“ oder „beseitigen“ bedeuten. „Beseitigt“ wahrt die Bedeutungsbreite, ohne eine bestimmte Art des Entfernens festzulegen.
- source_word: בְּטָמֵא
  choice: als ich unrein war
  rationale: Die Wendung beschreibt einen Zustand kultischer Unreinheit. Die temporale Formulierung ist im Deutschen natürlich und lässt die rituelle Dimension bestehen.
- source_word: לְמֵת
  choice: für einen Toten
  rationale: Die knappe hebräische Formulierung nennt den genauen Zweck oder Ritus nicht. „Für einen Toten“ bleibt ebenso offen und verengt die Aussage weder auf eine Leiche noch auf eine bestimmte Totenzeremonie.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Ich habe der Stimme … gehorcht
  rationale: שמע בקול ist eine feste Wendung für gehorsames Hören. Die Wiedergabe bewahrt zugleich das Bild der Stimme und den Sinn des Gehorsams.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: ich habe alles so getan, wie du es mir geboten hast
  rationale: Die Formulierung drückt vollständige Übereinstimmung mit dem göttlichen Gebot aus und klingt zugleich natürlich und würdig.
theological_decisions:
- issue: Art der verbotenen Verwendung für einen Toten
  choice: Die allgemeine Formulierung „für einen Toten“ bleibt erhalten.
  alternative: „für Totenriten“, „einem Toten“ oder „im Zusammenhang mit einer Leiche“
  rationale: Der hebräische Text bestimmt die konkrete Handlung nicht näher. Eine präzisere Deutung würde eine bestimmte Bestattungs- oder Reinheitspraxis in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Erklärung bleibt klar und mündlich sprechbar; kultische Begriffe und echte lexikalische Mehrdeutigkeiten werden nicht unnötig erklärt oder vereinheitlicht.
