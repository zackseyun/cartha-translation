  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: de
  text: Du sollst dich über all das Gute freuen, das Jahwe, dein Gott, dir und deinem Haus gegeben hat – du, der Levit und der Fremde[a], der in deiner Mitte lebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ansässige Ausländer“. Das hebräische Wort גֵּר bezeichnet einen Nichtisraeliten, der in Israel lebt und unter dem Schutz der israelitischen Gemeinschaft steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Dann sollst du dich … freuen
  rationale: Das Qal-Perfekt mit וְ steht im Anweisungskontext und wird als Aufforderung wiedergegeben. „Sich freuen“ bewahrt sowohl den emotionalen als auch den festlichen Sinn.
- source_word: בְכָל הַטּוֹב
  choice: über all das Gute
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Gegenstand der Freude. Diese Formulierung ist im modernen Deutschen natürlich und bleibt der umfassenden Bedeutung von כָל הַטּוֹב nahe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּלְבֵיתֶךָ
  choice: und deiner Hausgemeinschaft
  rationale: בַּיִת bezeichnet hier nicht nur ein Gebäude, sondern die zum Haus gehörende familiäre und soziale Gemeinschaft. „Hausgemeinschaft“ macht diesen Sinn deutlich.
- source_word: הַלֵּוִי
  choice: der Levit
  rationale: Die geläufige und genaue Bezeichnung für einen Angehörigen Levis wird beibehalten.
- source_word: הַגֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft unter Israel lebt. „Fremder“ ist gut verständlich; die besondere rechtlich-soziale Bedeutung wird in einer Fußnote erläutert.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: der bei dir lebt
  rationale: Die Wendung wird idiomatisch wiedergegeben und bezeichnet die Zugehörigkeit zum örtlichen Lebensumfeld des Angesprochenen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Einbeziehung des Leviten und des Fremden in die Freude
  choice: Die hebräische Nachstellung „du, der Levit und der Fremde“ bleibt als erläuternde Aufzählung erhalten.
  alternative: „Zusammen mit dem Leviten und dem Fremden sollst du dich freuen“
  rationale: Die gewählte Fassung bewahrt die auffällige Syntax und den Nachdruck des ausdrücklichen אַתָּה, ohne die gemeinsame Teilnahme an der Freude zu verdunkeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die hebräische Nachstellung der ausdrücklich genannten Teilnehmer verständlich. „Hausgemeinschaft“ vermeidet das Missverständnis eines bloßen Gebäudes.
