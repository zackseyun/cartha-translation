  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: de
  text: Die Ägypter behandelten uns schlecht[a], unterdrückten uns[b] und legten uns harte Arbeit auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gingen hart mit uns um«; auch: »taten uns Böses an«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bedrängten uns«; auch: »demütigten uns«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: behandelten uns schlecht
  rationale: Die Hifil-Form von רעע bezeichnet schädigendes oder schlechtes Handeln an jemandem. Die Formulierung ist natürliches modernes Deutsch und legt die Art der Misshandlung nicht enger fest als der hebräische Ausdruck.
- source_word: הַמִּצְרִים
  choice: die Ägypter
  rationale: Die bestimmte Volksbezeichnung benennt die Menschen Ägyptens als handelnde Gruppe.
- source_word: וַיְעַנּוּנוּ
  choice: unterdrückten uns
  rationale: ענה im Piel kann Bedrängung, Demütigung oder Unterdrückung bezeichnen. »Unterdrückten« passt hier zum Kontext, bleibt aber vom vorausgehenden allgemeinen schlechten Behandeln unterschieden.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: legten uns … auf
  rationale: Die Verbindung נתן על bezeichnet das Auferlegen einer Last oder Verpflichtung; die deutsche Wendung erhält dieses Bild.
- source_word: עֲבֹדָה קָשָׁה
  choice: harte Arbeit
  rationale: עֲבֹדָה bezeichnet Arbeit oder Dienst, קָשָׁה etwas Hartes oder Schweres. »Harte Arbeit« ist klar, idiomatisch und lässt den Zwangskontext erkennen, ohne einen zusätzlichen Rechtsbegriff einzuführen.
theological_decisions:
- issue: Unterscheidung der aufeinanderfolgenden Ausdrücke für die Unterdrückung
  choice: 'Drei getrennte Aussagen: »behandelten uns schlecht«, »unterdrückten uns« und »legten uns harte Arbeit auf«'
  alternative: Die ersten beiden Verben zu einer einzigen Aussage über Unterdrückung zusammenziehen oder alle drei ausdrücklich mit Sklavereibegriffen wiedergeben
  rationale: Der hebräische Text reiht verwandte, aber nicht gleichbedeutende Ausdrücke aneinander. Ihre Unterscheidung bewahrt die rhetorische Steigerung, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt eng am Hebräischen; die Wiederholung von »uns« erhält den Nachdruck des Ausgangstextes.
