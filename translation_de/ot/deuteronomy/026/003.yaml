base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: de
  text: 'Dann geh zu dem Priester, der zu jener Zeit im Amt ist,[a] und sag zu ihm: »Heute bezeuge ich Jahwe, deinem Gott, dass ich in das Land gekommen bin, das Jahwe unseren Vätern[c] geschworen hat, uns zu geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der in jenen Tagen sein wird«, das heißt der Priester, der dann dient beziehungsweise im Amt ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »unseren Vorfahren«. Der hebräische Ausdruck ist maskulin und kann hier besonders die patriarchalischen Väter meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Dann geh
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »eintreten« bedeuten. Die Bewegung zum Priester wird im Deutschen natürlich mit »geh« ausgedrückt; »dann« gibt die Abfolge der Anweisungen wieder.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: der zu jener Zeit im Amt ist
  rationale: Wörtlich »der in jenen Tagen sein wird«; im kultisch-rechtlichen Zusammenhang ist der jeweils amtierende Priester gemeint.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Heute erkläre ich
  rationale: 'Die Perfektform kann hier performativ sein: Mit diesen Worten vollzieht der Sprecher die Erklärung. Die Fußnote bewahrt die formnähere Vergangenheitsalternative.'
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Die Präposition ל markiert hier den Adressaten beziehungsweise die Instanz, vor der die feierliche Erklärung abgelegt wird. »Vor Jahwe« ist im Deutschen idiomatisch und passt zum ritualrechtlichen Kontext.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Der maskuline Singularsuffix bezieht sich auf den angesprochenen Priester; die auffällige Formulierung des Hebräischen wird nicht zu »unserem Gott« geglättet.
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: dass ich in das Land gekommen bin
  rationale: כִּי leitet den Inhalt der Erklärung ein; das deutsche Perfekt hält die vollzogene Ankunft mit ihrer gegenwärtigen Bedeutung fest.
- source_word: לַאֲבֹתֵינוּ
  choice: unseren Vätern
  rationale: Die ausdrücklich maskuline Bezeichnung wird bewahrt und dürfte im deuteronomischen Verheißungskontext besonders auf die Vorväter beziehungsweise Patriarchen weisen.
- source_word: לָתֶת לָנוּ
  choice: es uns zu geben
  rationale: Das Pronomen »es« nimmt im Deutschen eindeutig »das Land« auf; die Infinitivkonstruktion und der Geschenkcharakter der Verheißung bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im Ausgangstext ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bezug von לַאֲבֹתֵינוּ
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: »Väter« bewahrt die maskuline Form und die mögliche besondere Bezugnahme auf die patriarchalischen Väter, ohne diese im Haupttext weiter festzulegen.
- issue: Adressat beziehungsweise Instanz der Erklärung
  choice: vor Jahwe
  alternative: Jahwe gegenüber / Jahwe
  rationale: Die Erklärung wird zwar unmittelbar zum Priester gesprochen, gilt aber Jahwe. »Vor Jahwe« macht die kultische Ausrichtung natürlich verständlich, ohne den Priester zum eigentlichen Empfänger des Bekenntnisses zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Anweisungsfolge wird knapp und natürlich formuliert. Der Gottesname bleibt als »Jahwe« sichtbar; genuine sprachliche Alternativen werden in den Fußnoten bewahrt.
