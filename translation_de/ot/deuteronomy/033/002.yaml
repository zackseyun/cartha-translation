    rationale: Die deutsche attributive Verbindung bezeichnet gewöhnlich Myriaden, die selbst heilig sind, und damit faktisch heilige Wesen. Die überlieferte hebräische Formulierung ist jedoch umstritten; entsprechend dem Audit Trail soll auch die abstrakte Lesung im Haupttext möglich bleiben.
  - severity: low
