  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: de
  text: 'Und er sprach:


    „Jahwe kam vom Sinai;


    von Seïr her ging er ihnen strahlend auf.


    Vom Berg Paran her leuchtete er auf


    und kam aus Myriaden der Heiligkeit[a].


    Aus seiner rechten Hand kam ihnen eine feurige Weisung[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist mehrdeutig. Sie kann auch „aus Myriaden heiliger Wesen“ oder „aus heiligen Myriaden“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort ist in Form und Bedeutung äußerst unsicher. Nach traditionellem Verständnis bezeichnet es eine „feurige Weisung“ oder ein „feuriges Gesetz“; möglich sind auch Feuer oder Feuerstrahlen, die aus seiner rechten Hand hervorgehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִסִּינַי בָּא
  choice: kam vom Sinai
  rationale: Die Wendung beschreibt Jahwes machtvolles Kommen beziehungsweise Erscheinen und bewahrt die Richtung von מִן.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: von Seïr her ging er ihnen strahlend auf
  rationale: זרח bezeichnet häufig das Aufgehen und Strahlen von Licht. Die Formulierung bewahrt das poetische Bild und gibt לָמוֹ als Bezug auf die Empfänger wieder.
- source_word: הוֹפִיעַ
  choice: leuchtete er auf
  rationale: Der Hifil von יפע bezeichnet ein strahlendes Hervortreten oder Erscheinen.
- source_word: מֵהַר פָּארָן
  choice: vom Berg Paran her
  rationale: Die Ortsangabe wird direkt und im parallelen Aufbau der poetischen Zeilen wiedergegeben.
- source_word: וְאָתָה
  choice: und kam
  rationale: Das Verb führt die Reihe der Aussagen über das göttliche Kommen fort.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: aus heiligen Myriaden
  rationale: Die knappe poetische Formulierung bildet die Verbindung von רִבְבֹת und קֹדֶשׁ nach, ohne im Haupttext ausdrücklich festzulegen, ob damit heilige Wesen oder abstrakte Heiligkeit gemeint sind.
- source_word: מִימִינוֹ
  choice: aus seiner rechten Hand
  rationale: מִן wird mit seiner gewöhnlichen Herkunftsbedeutung wiedergegeben; „Hand“ ist im Deutschen zur Verdeutlichung des gemeinten Körperteils ergänzt.
- source_word: אשדת
  choice: feurige Weisung
  rationale: Die überlieferte Lesetradition verbindet die schwierige Form mit Feuer und Weisung beziehungsweise Gesetz. „Weisung“ ist im Deutschen natürlicher als „Feuergesetz“, während die Fußnote die erhebliche lexikalische Unsicherheit offenlegt.
- source_word: לָמוֹ
  choice: für sie
  rationale: Das pluralische Pronomen bezeichnet die Empfänger dessen, was aus Jahwes rechter Hand kommt.
theological_decisions:
- issue: Identität des göttlichen Subjekts in der Theophanie
  choice: Das Subjekt wird mit dem alttestamentlichen Gottesnamen „Jahwe“ bezeichnet.
  alternative: Eine spätere christologische Deutung ausdrücklich in den Wortlaut einzutragen.
  rationale: Der Vers schildert im Zusammenhang des Mose-Segens Jahwes Erscheinen. Mögliche typologische Deutungen gehören nicht in die Übersetzung selbst.
- issue: Deutung von מֵרִבְבֹת קֹדֶשׁ
  choice: „aus heiligen Myriaden“ mit erläuternder Fußnote
  alternative: „von Zehntausenden heiliger Wesen“ oder eine rein abstrakte Wiedergabe wie „von Myriaden der Heiligkeit“
  rationale: Die hebräische Verbindung ist mehrdeutig. Die gewählte poetische Form lässt den genauen Bezug offen; die Fußnote nennt die wichtigsten Verständnismöglichkeiten.
- issue: Deutung von אשדת
  choice: „feurige Weisung“ mit deutlichem Unsicherheitshinweis
  alternative: „Feuerblitze“, „Feuer“ oder „ein feuriges Gesetz“
  rationale: Die Konsonantenfolge ist außergewöhnlich schwierig. Die traditionelle Verbindung mit Feuer und Weisung passt zum Sinai-Kontext, darf aber wegen der unsicheren Wortgestalt nicht als zweifelsfrei erscheinen.
translation_notes:
  register: Poetische, feierliche Standardsprache mit kurzen Parallelzeilen. „Myriaden“ bewahrt die gewaltige Größenangabe und den gehobenen Ton; ungewöhnliche oder unsichere Wendungen werden nicht geglättet, sondern durch Fußnoten transparent gemacht.
