base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: de
  text: Keiner ist wie Gott, Jeschurun[a], der dir zu Hilfe auf den Himmeln einherfährt und in seiner Hoheit auf den Wolken.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeschurun ist ein poetischer Name für Israel.
    reason: cultural_note
  - marker: c
    text: 'Oder: „auf den Himmelshöhen“; das hebräische Wort kann Wolken oder den oberen Himmelsraum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Keiner ist wie Gott
  rationale: Die negative Existenzformel mit Vergleichspartikel bezeichnet Gottes Unvergleichlichkeit. „Keiner ist wie Gott“ ist im Deutschen natürlich, knapp und poetisch.
- source_word: יְשֻׁרוּן
  choice: Jeschurun
  rationale: Der poetische Eigenname für Israel wird transliteriert und durch eine Fußnote erklärt.
- source_word: רֹכֵב שָׁמַיִם
  choice: über den Himmel fährt
  rationale: Das Partizip רֹכֵב zeichnet Gott als den majestätisch Fahrenden. „Über den Himmel fährt“ gibt das Bild idiomatisch wieder, ohne eine im Hebräischen nicht ausdrücklich genannte Präposition überzubetonen.
- source_word: בְעֶזְרֶךָ
  choice: dir zu Hilfe
  rationale: Die Präposition בְּ bezeichnet hier am ehesten Zweck oder Nutzen. Die deutsche Wendung „dir zu Hilfe“ bewahrt den Sinn und den poetischen Ton.
- source_word: וּבְגַאֲוָתוֹ
  choice: und in seiner Hoheit
  rationale: גַּאֲוָה bezeichnet bei Gott Erhabenheit oder Majestät. „Hoheit“ vermeidet die im Deutschen negative Bedeutung von „Stolz“.
- source_word: שְׁחָקִים
  choice: die Wolken
  rationale: Das poetische Wort kann die Wolken oder den oberen Himmelsraum bezeichnen. „Wolken“ schafft ein anschauliches, zum parallelen „Himmel“ passendes Bild.
theological_decisions:
- issue: Bedeutung von אֵל im Vergleich
  choice: Gott
  alternative: El; der Mächtige
  rationale: אֵל dient hier als allgemeine Gottesbezeichnung. „Gott“ gibt die Aussage von der Unvergleichlichkeit des Gottes Israels natürlich wieder, ohne einen von ihm unterschiedenen Eigennamen nahezulegen.
- issue: Bezug der Anrede יְשֻׁרוּן
  choice: poetischer Name Israels
  alternative: Übersetzung als „Aufrechter“
  rationale: Da יְשֻׁרוּן als poetischer Eigenname für Israel gebraucht wird, bleibt der Name im Text erhalten; seine Bedeutung und sein Bezug werden nicht dogmatisch ausgeweitet, sondern knapp erklärt.
translation_notes:
  register: Gehobene, aber gegenwärtige poetische Standardsprache. Die Anrede bleibt ohne altertümliches „o“. Der Parallelismus von „Himmel“ und „Wolken“ sowie das majestätische Bild des fahrenden Gottes werden bewahrt.
