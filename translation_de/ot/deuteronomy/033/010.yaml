base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: de
  text: Sie werden Jakob deine Rechtsbestimmungen lehren und Israel deine Weisung[a]. Sie werden Räucherwerk vor dich bringen[b] und Ganzopfer auf deinen Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Gesetz“. Das hebräische Wort תּוֹרָה kann „Weisung“, „Lehre“ oder „Gesetz“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an deine Nase“; eine anthropomorphe Wendung für das vor Gott dargebrachte Räucherwerk.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: sie werden … lehren
  rationale: Der Hifil von ירה bedeutet im priesterlich-rechtlichen Zusammenhang „lehren“ oder „unterweisen“. „Lehren“ ist klar und bewahrt den Bezug zu den folgenden Lehrinhalten.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Rechtsbestimmungen
  rationale: מִשְׁפָּט bezeichnet hier verbindliche rechtliche Entscheidungen oder Satzungen. „Rechtsbestimmungen“ gibt den juridischen Sinn natürlich wieder, ohne ihn auf einzelne Gerichtsurteile zu verengen.
- source_word: וְתוֹרָתְךָ
  choice: und deine Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder Weisung bedeuten. „Weisung“ wahrt hier die priesterliche Lehrdimension und zugleich den verbindlichen Charakter; „Gesetz“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: יָשִׂימוּ קְטוֹרָה
  choice: sie werden Räucherwerk … bringen
  rationale: Wörtlich steht „Räucherwerk hinlegen/setzen“. Im Deutschen bezeichnet „bringen“ die kultische Darbringung natürlich und ohne unnötige Konkretisierung der Handlung.
- source_word: בְּאַפֶּךָ
  choice: vor dich
  rationale: Die Wendung lautet wörtlich „an/in deine Nase“. Im Zusammenhang mit Räucherwerk ist sie anthropomorph und bezeichnet dessen Darbringung unmittelbar vor Gott. „Vor dich“ erhält die räumlich-kultische Aussage; die wörtliche Bildsprache wird angemerkt.
- source_word: וְכָלִיל
  choice: und Ganzopfer
  rationale: כָּלִיל bezeichnet ein Opfer, das vollständig verbrannt wird. Der kollektive Plural „Ganzopfer“ ist im Deutschen idiomatisch und lässt die grammatisch mögliche generische beziehungsweise kollektive Bedeutung offen.
- source_word: עַל מִזְבְּחֶךָ
  choice: auf deinen Altar
  rationale: Dies ist die direkte und natürliche Wiedergabe der präpositionalen Wendung im Opferkontext.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה im Bundes- und Lehrkontext
  choice: Weisung
  alternative: Gesetz
  rationale: Der Vers beschreibt den Auftrag Levis, Gottes verbindliche Offenbarung zu lehren. „Weisung“ umfasst sowohl Unterweisung als auch bindende Anordnung und vermeidet eine unnötige Verengung auf modernes kodifiziertes Recht.
- issue: Anthropomorphe Formulierung בְּאַפֶּךָ
  choice: vor dich
  alternative: an deine Nase / vor dein Angesicht
  rationale: Die wörtliche Körpermetapher wäre im heutigen Deutschen missverständlich. „Vor dich“ vermittelt die kultische Darbringung, ohne die Formulierung als Hinweis auf göttlichen Zorn zu deuten; die konkrete Bildsprache bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. „Jakob“ und „Israel“ bleiben als parallele Bezeichnungen erhalten. Die Satzteilung macht die beiden priesterlichen Aufgaben – Lehre und Opferdienst – gut erfassbar.
