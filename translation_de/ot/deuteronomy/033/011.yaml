source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: de
  text: Segne, Jahwe, seine Kraft[a] und nimm das Werk seiner Hände an. Zerschmettere die Lenden[b] derer, die sich gegen ihn erheben, und derer, die ihn hassen, damit sie sich nicht wieder erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Vermögen“, „seinen Reichtum“ oder „sein Heer“; das hebräische Wort kann Kraft, Besitz oder militärische Macht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Lenden“. Im Hebräischen können die Lenden ein Bild für Kraft sein.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Segne
  rationale: Der Imperativ richtet sich an Jahwe. „Segne“ gibt die direkte Bedeutung natürlich und ohne die interpretierende Verengung auf „Lass gedeihen“ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: חֵילוֹ
  choice: seine Kraft
  rationale: חַיִל kann Kraft, Vermögen, Reichtum oder Heeresmacht bezeichnen. „Kraft“ bewahrt im Kontext die größte Bedeutungsbreite; Alternativen werden in der Fußnote genannt.
- source_word: וּפֹעַל יָדָיו
  choice: das Werk seiner Hände
  rationale: Die konkrete hebräische Wendung bezeichnet sein Tun beziehungsweise seine Arbeit und ist auch im Deutschen verständlich und würdevoll.
- source_word: תִּרְצֶה
  choice: nimm … an
  rationale: Das Verb bittet um göttliche Annahme beziehungsweise Wohlgefallen an Levis Dienst. „Nimm … an“ ist knapp und lässt den kultischen Bezug offen.
- source_word: מְחַץ
  choice: Zerschmettere
  rationale: Der starke Imperativ bezeichnet ein vernichtendes Schlagen oder Zerschmettern und wahrt die Wucht der poetischen Sprache.
- source_word: מָתְנַיִם
  choice: die Hüften
  rationale: מָתְנַיִם bezeichnet die Hüft- beziehungsweise Lendengegend als Sitz der Kraft. „Hüften“ bewahrt das Körperbild in gegenwärtigem Deutsch.
- source_word: קָמָיו
  choice: die sich gegen ihn erheben
  rationale: Die partizipiale Form von קום enthält das Bild des Sich-Erhebens gegen Levi und wird daher nicht zum abstrakten „Gegner“ verflacht.
- source_word: וּמְשַׂנְאָיו
  choice: die ihn hassen
  rationale: Die Wiedergabe hält die persönliche Feindschaft des hebräischen Partizips ausdrücklich fest.
- source_word: מִן יְקוּמוּן
  choice: sodass sie nicht wieder aufstehen
  rationale: 'Die knappe, elliptische Konstruktion bezeichnet das Ergebnis des Zerschmetterns: Die Feinde sollen sich nicht wieder erheben können. „Wieder“ macht den idiomatischen Sinn im Deutschen deutlich.'
theological_decisions:
- issue: Bezug der Singularpronomen „sein/ihn“
  choice: Die Pronomen beziehen sich auf Levi, der im unmittelbaren Zusammenhang gesegnet wird.
  alternative: Sie können allgemeiner auf den priesterlichen Diener oder auf Levis repräsentativen Dienst bezogen werden.
  rationale: Der unmittelbare literarische Zusammenhang ist Moses Segen über Levi in Dtn 33,8–11. Die singularischen Pronomen erhalten die Form des Hebräischen, ohne im Haupttext eine weitergehende Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Wucht. Das konkrete Körperbild „Hüften“ bleibt im Haupttext stehen; seine Funktion als Bild für Kraft ist aus der Formulierung und dem Kontext erschließbar. Der Gottesname wird als „Jahwe“ wiedergegeben.
