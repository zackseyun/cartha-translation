  terminology: Die kultische Terminologie »Opfer ... darbringen« ist passend. »Völker«, »Berg«, »Meere«, »Überfluss« und »verborgene Schätze« sind treffend gewählt. Der Berg bleibt zu Recht unidentifiziert; auch die Wendung zu den Opfern wird nicht konfessionell eingeengt.
