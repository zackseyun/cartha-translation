source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: de
  text: Sie werden Völker zum Berg rufen[a]; dort werden sie Opfer der Gerechtigkeit darbringen. Denn sie werden aus dem Überfluss der Meere schöpfen[b] und aus den verborgenen Schätzen des Sandes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie werden Völker auf einen Berg rufen.« Welcher Berg gemeint ist, sagt der hebräische Text nicht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »sie werden den Überfluss der Meere saugen« – ein Bild dafür, Nahrung oder Reichtum aus dem Meer zu gewinnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aus den verborgenen Dingen / den verborgenen Reichtümern des Sandes«. Gemeint sind wahrscheinlich Güter aus Küsten- oder Sandgebieten; eine genaue Bestimmung ist nicht möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural von עַם bezeichnet mehrere Volksgruppen oder Gemeinschaften; »Völker« bewahrt diesen kollektiven Sinn.
- source_word: הַר
  choice: zum Berg
  rationale: Das artikellose Singularwort bezeichnet hier das Ziel des Rufens. »Zum Berg« lässt dessen Identität offen, statt etwa Zion oder einen bestimmten Stammesberg einzutragen.
- source_word: יִקְרָאוּ
  choice: werden … rufen
  rationale: קרא kann »rufen«, »herbeirufen« oder »einladen« bedeuten. »Rufen« hält die Art des Rufes bewusst offen.
- source_word: יִזְבְּחוּ זִבְחֵי צֶדֶק
  choice: werden … Opfer der Gerechtigkeit darbringen
  rationale: זבח ist kultisch spezifisch; die Wiedergabe der Genitivverbindung bewahrt die mögliche Spannung zwischen rechten, gerechten und in Gerechtigkeit dargebrachten Opfern.
- source_word: שֶׁפַע יַמִּים
  choice: Überfluss der Meere
  rationale: שׁפע bezeichnet Fülle oder reichen Ertrag. Die allgemeine Formulierung legt nicht fest, ob Nahrung, Rohstoffe oder Handelsgewinn gemeint sind.
- source_word: יִינָקוּ
  choice: werden … schöpfen
  rationale: Wörtlich bedeutet das Verb »saugen«. »Schöpfen« gibt im Deutschen den übertragenen Sinn des Gewinnens von Nahrung oder Reichtum wieder; die Bildlichkeit wird in der Fußnote dokumentiert.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: und aus den verborgenen Schätzen des Sandes
  rationale: Die Häufung von Begriffen des Verbergens beziehungsweise Verwahrens bezeichnet wahrscheinlich verborgene oder eingelagerte Güter in sandigen Küstengebieten. »Schätze« bleibt poetisch und vermeidet eine konkrete Identifizierung.
theological_decisions:
- issue: Art der »Opfer der Gerechtigkeit«
  choice: Die hebräische Genitivverbindung wird beibehalten.
  alternative: »rechte Opfer« oder »Opfer, die in Gerechtigkeit dargebracht werden«
  rationale: Der Ausdruck kann die Opfer selbst, die Weise ihres Darbringens oder ihre kultische Angemessenheit kennzeichnen. Die Übersetzung legt keine spätere Lehrkategorie fest.
- issue: Identität des Berges
  choice: Der Berg bleibt unbenannt.
  alternative: Zion, Sinai, ein Bergheiligtum oder das Bergland eines Stammes
  rationale: Der hebräische Text nennt keinen Eigennamen. Eine ausdrückliche Identifizierung würde über die Quelle hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Färbung. Die Satzteilung erhöht die Verständlichkeit; ungeklärte Orts- und Sachbezüge sowie die kultische Mehrdeutigkeit bleiben erhalten.
