  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und Bildsprache zuverlässig wieder: Völker werden zum Berg gerufen, dort werden זִבְחֵי צֶדֶק dargebracht, und die Begünstigten gewinnen Ertrag aus Meer und Sand. »Schöpfen« überträgt יִינָקוּ angemessen, während die Fußnote das wörtliche Bild des Saugens wahrt. Die doppelte Vorstellung des Verborgenen in וּשְׂפוּנֵי טְמוּנֵי חוֹל wird sinnvoll und ohne unzulässige konkrete Identifikation als »verborgene Schätze des Sandes« wiedergegeben.'
