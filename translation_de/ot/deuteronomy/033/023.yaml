id: DEU.33.23
reference: Deuteronomy 33:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: de
  text: 'Und über Naftali sagte er:


    »Naftali, mit Gunst gesättigt

    und erfüllt vom Segen Jahwes,

    nimm das Meer[a] und den Süden in Besitz!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Westen“. Das hebräische Wort für „Meer“ kann auch als Richtungsangabe für den Westen gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: Und über Naftali
  rationale: Die Präposition לְ leitet in der Reihe der Stammessegen den Adressaten beziehungsweise das Thema des Ausspruchs ein. „Über Naftali“ klingt im Deutschen natürlich und passt zur Segensformel.
- source_word: אָמַר
  choice: sagte er
  rationale: Die einfache narrative Bedeutung von אמר bleibt erhalten.
- source_word: שְׂבַע רָצוֹן
  choice: mit Gunst gesättigt
  rationale: שְׂבַע bezeichnet einen Zustand des Gesättigt- oder Erfülltseins; רָצוֹן meint hier am ehesten gewährte Gunst beziehungsweise Wohlwollen. Die Formulierung bewahrt das kräftige Bild des Hebräischen.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: und erfüllt vom Segen Jahwes
  rationale: מָלֵא steht parallel zu שְׂבַע und wird idiomatisch mit „erfüllt“ wiedergegeben. Der Konstruktus bezeichnet den von Jahwe kommenden Segen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: יָם
  choice: das Meer
  rationale: Die Grundbedeutung von יָם ist „Meer“. Da das Wort auch als Richtungsangabe „Westen“ dienen kann, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
- source_word: וְדָרוֹם
  choice: und den Süden
  rationale: דָרוֹם bezeichnet den Süden oder das südliche Gebiet; „den Süden“ wahrt die knappe Parallelstruktur.
- source_word: יְרָשָׁה
  choice: nimm … in Besitz
  rationale: Die imperativische Form von ירשׁ fordert zur Besitzergreifung des genannten Gebiets auf. „In Besitz nehmen“ gibt den territorialen Sinn im modernen Deutschen klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von רָצוֹן
  choice: Gunst, ohne ausdrückliche Ergänzung des Gebers
  alternative: Jahwes Gunst; Wohlgefallen
  rationale: Der Parallelismus mit „Segen Jahwes“ legt göttliche Gunst nahe, doch der erste Ausdruck nennt Jahwe nicht ausdrücklich. Die Übersetzung vermeidet daher eine stillschweigende Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Zeilengliederung macht den Parallelismus sichtbar; das kräftige Bild „mit Gunst gesättigt“ bleibt erhalten. Der Imperativ wird direkt und verständlich formuliert.
