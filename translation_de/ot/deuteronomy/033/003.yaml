base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: de
  text: 'Ja, er liebt die Völker;


    alle seine Heiligen sind in deiner Hand.


    Sie lassen sich zu deinen Füßen nieder[a];


    jeder nimmt deine Worte entgegen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Verbs ist unsicher. Es wird auch mit „sie wurden versammelt“, „sie kauern“ oder „sie wurden niedergeschlagen“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Jeder nimmt etwas von deinen Worten auf“ beziehungsweise „trägt deine Aussprüche“. Der hebräische Ausdruck ist selten und schwer zu deuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die Partikel bekräftigt hier die Aussage. „Ja“ gibt diese emphatische Funktion im Deutschen knapp und natürlich wieder.
- source_word: חֹבֵב
  choice: liebt
  rationale: Das Partizip bezeichnet eine anhaltende Haltung der Liebe; das Präsens ist im Deutschen idiomatisch.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bleibt erhalten, ohne die gemeinten Gruppen vorschnell näher zu bestimmen.
- source_word: כָּל קְדֹשָׁיו
  choice: alle seine Heiligen
  rationale: Die Form bezeichnet die ihm zugehörigen Heiligen beziehungsweise Geheiligten. Die offene Bezeichnung legt weder Engel noch Israel als alleinigen Bezug fest.
- source_word: בְּיָדֶךָ
  choice: in deiner Hand
  rationale: Die wörtliche Wendung ist auch im Deutschen verständlich und bewahrt den Wechsel von der dritten zur zweiten Person.
- source_word: תֻּכּוּ
  choice: sie lassen sich nieder
  rationale: Die schwierige Verbform wird im Zusammenhang mit „zu deinen Füßen“ als Niederlassen verstanden; die erhebliche lexikalische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: לְרַגְלֶךָ
  choice: zu deinen Füßen
  rationale: Die Wendung bezeichnet anschaulich die Haltung von Zuhörenden oder Untergebenen vor dem Angeredeten.
- source_word: יִשָּׂא
  choice: nimmt … entgegen
  rationale: Das Verb bedeutet grundsätzlich „heben, tragen, aufnehmen“. Mit den folgenden Worten ergibt „entgegennehmen“ einen verständlichen Sinn, ohne den seltenen Ausdruck zu stark auszudeuten.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: deine Worte
  rationale: Das seltene Wort gehört zum Bereich des Redens. Die Präposition מִן kann partitiv verstanden werden; diese Unsicherheit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wechsel der grammatischen Person
  choice: „er liebt … seine Heiligen … deiner Hand … deinen Füßen … deine Worte“
  alternative: Alle Bezüge einheitlich in die zweite oder dritte Person setzen
  rationale: Der poetische Wechsel zwischen dritter und zweiter Person steht im hebräischen Text und wird nicht harmonisiert.
- issue: Identität der „Heiligen“
  choice: Die allgemeine Bezeichnung „seine Heiligen“ bleibt stehen
  alternative: „Engel“, „Israel“ oder eine andere bestimmte Gruppe
  rationale: Der Vers selbst bestimmt die Gruppe nicht eindeutig; eine engere theologische Identifikation wäre interpretierend.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Zeilengliederung. Die Pronomenwechsel und die beiden wesentlichen lexikalischen Unsicherheiten des hebräischen Textes bleiben sichtbar.
