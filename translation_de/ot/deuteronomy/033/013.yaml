  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: de
  text: 'Und über Josef sagte er:


    »Von Jahwe gesegnet sei sein Land


    mit dem Köstlichsten des Himmels,


    mit dem Tau


    und mit der Tiefe, die darunter lagert.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich die Wasser unter der Erde, die das Land speisen.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: Und über Josef sagte er
  rationale: לְ bei der Einleitung eines Stammessegens bezeichnet den, über den gesprochen wird; „über Josef“ ist im Deutschen natürlich und bewahrt den Rahmen der Segenssprüche.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Vom HERRN gesegnet sei sein Land
  rationale: Das passive Partizip wird als Segenswunsch wiedergegeben. Der Gottesname wird nach etablierter deutscher Bibelkonvention mit „HERR“ in Kapitälchen vertreten.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: mit dem Köstlichsten des Himmels
  rationale: מֶגֶד bezeichnet Kostbares, Erlesenes oder besonders guten Ertrag. Die substantivierte Form vermeidet die interpretierende Ergänzung „Gaben“.
- source_word: מִטָּל
  choice: mit dem Tau
  rationale: Das מן leitet hier parallel die Quellen beziehungsweise Bestandteile des Segens ein; „mit“ ergibt im Deutschen eine flüssige Aufzählung.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: und mit der Tiefe, die unten lagert
  rationale: תְּהוֹם bleibt als bildhafte „Tiefe“ erhalten; רֹבֶצֶת bedeutet wörtlich „lagernd/liegend“ und wird nicht vorschnell zu „Grundwasser“ erklärt.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: Die deutsche Bibeltradition kennzeichnet den Gottesnamen weithin durch „HERR“ in Kapitälchen. Dies ist keine Übersetzung als bloßer Titel, sondern eine typografisch markierte Stellvertretung des Namens; „Jahwe“ bleibt als direkte Transkription möglich.
- issue: Bedeutung von תְּהוֹם
  choice: Tiefe
  alternative: unterirdische Wasser
  rationale: Der hebräische Ausdruck bezeichnet die Wassertiefe beziehungsweise Urflut. Im landwirtschaftlichen Segenszusammenhang sind wahrscheinlich Wasser unter der Erde gemeint, doch die poetische und kosmologische Bildsprache wird im Haupttext bewahrt.
translation_notes:
  register: Poetisch-gehobene, aber gegenwärtige Standardsprache. Die Verszeilen bilden die parallele Segensform ab; „lagert“ erhält das anschauliche Bild des hebräischen Partizips.
