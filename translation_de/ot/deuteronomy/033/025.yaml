base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: de
  text: Deine Riegel seien aus Eisen und Bronze[a], und wie deine Tage, so sei deine Kraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Sandalen (Schuhe) seien aus Eisen und Bronze.« Das hebräische Substantiv kann Fußbekleidung bezeichnen; wegen der Metalle und des Schutzmotivs verstehen viele es hier jedoch als Riegel oder Verschlüsse.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und wie deine Tage, so sei deine Ruhe« oder: »… deine Sicherheit«. Das letzte hebräische Wort ist selten und in seiner Bedeutung unsicher; »Kraft« ist eine traditionelle Wiedergabe, die zum Segenszusammenhang passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Die gewöhnliche Bezeichnung des Metalls; hier mit נְחֹשֶׁת zu einem Materialpaar verbunden.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das hebräische Wort kann Kupfer oder Bronze bezeichnen. »Bronze« ist in dieser Verbindung idiomatisch und entspricht dem traditionellen Metallbild.
- source_word: מִנְעָלֶיךָ
  choice: deine Riegel
  rationale: Obwohl das Substantiv auch Fußbekleidung bezeichnen kann, passen eiserne und bronzene Riegel gut zum Bild von Schutz und Sicherheit. Die echte lexikalische Alternative bleibt in einer Fußnote erhalten.
- source_word: וּכְיָמֶיךָ
  choice: und wie deine Tage
  rationale: כְּ drückt hier einen Vergleich oder eine Entsprechung aus. Die knappe Form bewahrt die poetische Parallelität und lässt offen, ob die Lebensdauer oder der tägliche Lebenslauf gemeint ist.
- source_word: דָּבְאֶךָ
  choice: deine Kraft
  rationale: Das seltene Schlusswort ist in seiner Bedeutung unsicher. »Kraft« ist eine traditionelle, im Segenszusammenhang gut passende Wiedergabe; andere mögliche Bedeutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Bildsprache des Segens
  choice: Der Vers verheißt dauerhaften Schutz und eine den Lebenstagen entsprechende Kraft.
  alternative: Die Metalle können festes Schuhwerk bezeichnen; das Schlusswort kann auch Ruhe oder Sicherheit meinen.
  rationale: Der Segenskontext stützt die Hauptfassung, doch der hebräische Wortlaut ist an beiden Stellen unsicher. Deshalb werden die Alternativen nicht dogmatisch ausgeschlossen, sondern ausdrücklich dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzform. Der Jussiv »seien/sei« gibt den Charakter des Segens natürlich wieder. Beide bedeutenden lexikalischen Unsicherheiten sind durch Fußnoten markiert.
