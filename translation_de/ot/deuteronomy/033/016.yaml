translation:
  language: de
  text: mit dem Kostbarsten der Erde und ihrer ganzen Fülle[a] und mit der Gunst dessen, der im Dornbusch wohnt[b]. All dies komme auf das Haupt Josefs und auf den Scheitel dessen, der von seinen Brüdern abgesondert ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Landes und all dessen, was es enthält“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung spielt auf Gottes Offenbarung an Mose im brennenden Dornbusch an.
    reason: historical_allusion
  - marker: c
    text: 'Oder: „der Fürst unter seinen Brüdern“ beziehungsweise „der unter seinen Brüdern Geweihte“. Das hebräische Wort bezeichnet jemanden, der abgesondert oder geweiht ist, und kann hier zugleich Josefs herausgehobene Stellung andeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד
  choice: mit dem Kostbarsten
  rationale: מֶגֶד bezeichnet in diesem Segenszusammenhang kostbare oder erlesene Gaben, besonders Ertrag. Das einleitende מִן führt die Reihe der Segensgaben aus den vorangehenden Versen fort; im natürlichen Deutschen gibt „mit“ diese Funktion am besten wieder.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: der Erde und ihrer ganzen Fülle
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Zusammen mit מְלֹאָהּ liegt die umfassende poetische Wendung „Erde und ihre Fülle“ nahe; „ganzen“ verdeutlicht idiomatisch alles, was sie enthält.
- source_word: רְצוֹן
  choice: Gunst
  rationale: Das Wort bezeichnet hier Gottes wohlwollende Zuwendung. „Gunst“ ist knapp, würdig und lässt den Segenscharakter erkennen.
- source_word: שֹׁכְנִי סְנֶה
  choice: dessen, der im Dornbusch wohnte
  rationale: Die partizipiale Wendung wird als Relativsatz wiedergegeben. „Dornbusch“ bewahrt die konkrete Bedeutung von סְנֶה und den erkennbaren Bezug auf Gottes Erscheinung vor Mose.
- source_word: תָּבוֹאתָה
  choice: All dies komme
  rationale: Die feminine Singularform fasst die zuvor genannten Segensgüter kollektiv zusammen. „All dies“ macht diesen Rückbezug im Deutschen verständlich, während der Wunsch- beziehungsweise Segenscharakter durch den Konjunktiv „komme“ erhalten bleibt.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: auf das Haupt Josefs
  rationale: Die traditionelle Segensformel wird formal nah und in würdigem Deutsch wiedergegeben.
- source_word: קָדְקֹד
  choice: Scheitel
  rationale: קָדְקֹד bezeichnet den obersten Teil des Kopfes. „Scheitel“ wahrt die poetische Parallelität zu „Haupt“, ohne unnötige Wiederholung.
- source_word: נְזִיר אֶחָיו
  choice: dessen, der von seinen Brüdern abgesondert war
  rationale: נָזִיר bezeichnet grundlegend einen Abgesonderten oder Geweihten. Bei Josef kann zugleich seine herausgehobene Stellung anklingen. Die gewählte Formulierung bewahrt den lexikalischen Kern und die Mehrdeutigkeit besser als die eindeutigere Deutung „Fürst“.
theological_decisions:
- issue: Identität dessen, „der im Dornbusch wohnte“
  choice: Die beschreibende Gottesbezeichnung bleibt im Haupttext stehen und spielt auf Gottes Offenbarung an Mose an.
  alternative: Die Wendung ausdrücklich als „Gott, der Mose im brennenden Dornbusch erschien“ aufzulösen.
  rationale: Die Anspielung auf Exodus 3 ist deutlich, doch der hebräische Text nennt weder Mose noch das Brennen ausdrücklich. Die beschreibende Wiedergabe erhält die Anspielung, ohne sie im Haupttext interpretierend auszubauen.
- issue: Bedeutung von נְזִיר אֶחָיו
  choice: „der von seinen Brüdern abgesondert war“
  alternative: „der Fürst unter seinen Brüdern“ oder „der unter seinen Brüdern Geweihte“
  rationale: Die Formulierung kann sowohl Josefs tatsächliche Trennung von seinen Brüdern als auch seine besondere, erhöhte Stellung bezeichnen. Der Haupttext legt sich nicht einseitig auf Rang oder kultische Weihe fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. „Haupt“ und „Scheitel“ halten den gehobenen Segensstil aufrecht, ohne veraltet oder schwer verständlich zu wirken. Der Vers beginnt als Fortsetzung der Segensreihe aus dem vorherigen Kontext bewusst mit „mit“.
