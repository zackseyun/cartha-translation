  naturalness: Die doppelte Relativanschlussform »der … sagte …, der seine Brüder …« ist syntaktisch unglücklich, weil im Hebräischen ein einziger relativischer Bezug mit koordinierten Prädikaten vorliegt. Ohne das zweite »der« ist der Satz im modernen Standarddeutsch klar und flüssig. »von seinem Vater und seiner Mutter sagte« entspricht der referenziellen Funktion von לְ bei אמר idiomatischer als »über«.
  terminology: »anerkannte«, »kannte«, »dein Wort« und »deinen Bund« sind angemessen. »hielten dein Wort« ist als direkte Wiedergabe von שׁמר natürlicher und prägnanter als »hielten sich an dein Wort«; »bewahrten« erhält die Nuance von נצר.
