base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: de
  text: 'der von seinem Vater und seiner Mutter sagte: »Ich habe ihn nicht gesehen«[a], seine Brüder nicht anerkannte und seine Söhne nicht kannte. Denn sie hielten dein Wort und bewahrten deinen Bund.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich habe ihn nicht gesehen.« Im Zusammenhang kann dies auch bedeuten: »Ich habe ihn nicht beachtet« oder »keine Rücksicht auf ihn genommen«; die Aussage kann die Treue zum Bund gegenüber Familienbindungen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: der … sagte
  rationale: Das substantivierte Partizip bezieht sich relativisch auf Levi; das deutsche Präteritum gibt die rückblickende Aussage natürlich wieder.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: über seinen Vater und seine Mutter
  rationale: לְ bei אמר kann die Personen bezeichnen, auf die sich die Aussage bezieht. »Über« passt zu den folgenden Aussagen über die nächsten Angehörigen.
- source_word: לֹא רְאִיתִיו
  choice: Ich habe ihn nicht beachtet
  rationale: ראה bedeutet wörtlich »sehen«, hat hier im Zusammenhang des Vorrangs der Bundestreue vor Familienbindungen jedoch wahrscheinlich den Sinn »beachten, Rücksicht nehmen auf«.
- source_word: הִכִּיר
  choice: anerkannte
  rationale: Der Hifil von נכר bezeichnet hier nicht bloß optisches Erkennen, sondern die Anerkennung einer familiären Beziehung.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Der hebräische Ausdruck ist ausdrücklich maskuliner Plural und wird nicht verallgemeinert.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der Text nennt ausdrücklich Söhne, nicht allgemein Kinder.
- source_word: יָדָע
  choice: kannte
  rationale: Die Grundbedeutung »kennen« bleibt erhalten; im Parallelismus ist relationale Anerkennung mitgemeint, ohne sie in der Übersetzung festzuschreiben.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zurückstellung familiärer Ansprüche ein.
- source_word: שָׁמְרוּ
  choice: hielten sich an
  rationale: שׁמר bezeichnet das Halten bzw. Befolgen; »sich an dein Wort halten« ist im heutigen Deutsch natürlich und wahrt den Bundeszusammenhang.
- source_word: אִמְרָתֶךָ
  choice: dein Wort
  rationale: אמרה heißt »Wort, Ausspruch«; »Wort« vermeidet eine unbegründete Einengung auf ein einzelnes Gebot.
- source_word: בְּרִיתְךָ
  choice: deinen Bund
  rationale: »Bund« ist die etablierte und sachlich genaue Wiedergabe von ברית.
- source_word: יִנְצֹרוּ
  choice: bewahrten
  rationale: נצר trägt den Gedanken des Hütens und Bewahrens. Die abweichende Wiedergabe gegenüber שׁמר erhält die lexikalische Abstufung des Parallelismus.
theological_decisions:
- issue: Wechsel zwischen Singular und Plural
  choice: Der repräsentative Singular für Levi bleibt in den Relativsätzen erhalten; in der Begründung steht wie im Hebräischen der Plural »sie«.
  alternative: Alle Formen einheitlich auf Levi als Einzelperson oder auf die Leviten als Gruppe beziehen.
  rationale: Der hebräische Text wechselt bewusst von Singularformen zu Pluralverben. Die Übersetzung glättet diese korporative Spannung nicht.
- issue: Bedeutung von »nicht gesehen« im Verhältnis zur Familie
  choice: »nicht beachtet« im Haupttext, die wörtliche Bedeutung in der Fußnote
  alternative: »Ich habe ihn nicht gesehen« im Haupttext
  rationale: Der Zusammenhang beschreibt die Zurückstellung engster Familienbindungen zugunsten der Bundestreue. »Nicht beachtet« vermittelt diesen idiomatischen Sinn, während die Fußnote die genuine lexikalische Offenheit bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der harte Kontrast zwischen Familienbindung und Bundestreue sowie der Wechsel vom repräsentativen Singular zum korporativen Plural werden beibehalten.
