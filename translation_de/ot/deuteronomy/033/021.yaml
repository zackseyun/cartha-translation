  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: de
  text: Er wählte sich den besten Landanteil aus[a], denn dort war der Anteil des Herrschers[b] vorbehalten. Er kam mit den Oberhäuptern des Volkes; er vollzog die Gerechtigkeit Jahwes[c] und seine Rechtsbestimmungen gemeinsam mit Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den ersten“ oder „den vornehmsten Anteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Anteil des Gesetzgebers“. Manche verstehen dies als Hinweis auf Mose.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „das Recht Jahwes“ beziehungsweise „die gerechten Taten Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא רֵאשִׁית לוֹ
  choice: Er wählte sich das beste Land aus
  rationale: Wörtlich steht etwa „er sah sich den ersten/vornehmsten Teil“. Im Zusammenhang der Landzuteilung bezeichnet רֵאשִׁית den bevorzugten oder besten Anteil; „wählte sich … aus“ gibt den idiomatischen Sinn von „für sich ansehen“ natürlich wieder.
- source_word: חֶלְקַת מְחֹקֵק
  choice: der Anteil des Herrschers
  rationale: חֶלְקָה bezeichnet einen zugeteilten Anteil. מְחֹקֵק kann einen Herrscher, Gebieter oder Gesetzgeber meinen; „Herrscher“ wahrt den allgemeinen Leitungstitel, ohne die Person ausdrücklich mit Mose gleichzusetzen.
- source_word: סָפוּן
  choice: vorbehalten
  rationale: Das passive Wort bezeichnet etwas Verwahrtes, Verborgenes oder Zurückbehaltenes. Bei einem Landanteil vermittelt „vorbehalten“ den kontextuellen Sinn klar.
- source_word: וַיֵּתֵא רָאשֵׁי עָם
  choice: Er kam mit den Oberhäuptern des Volkes
  rationale: וַיֵּתֵא bezeichnet ein Kommen; רָאשֵׁי עָם sind die führenden Personen des Volkes. Die knappe poetische Konstruktion wird mit dem im Zusammenhang naheliegenden „mit“ wiedergegeben.
- source_word: צִדְקַת יְהוָה
  choice: die Gerechtigkeit Jahwes
  rationale: צְדָקָה kann Gerechtigkeit, gerechtes Handeln oder konkrete gerechte Taten bezeichnen. Die substantivische Wiedergabe bewahrt die Mehrdeutigkeit des Hebräischen.
- source_word: וּמִשְׁפָּטָיו
  choice: und seine Rechtsentscheide
  rationale: מִשְׁפָּטִים bezeichnet hier Jahwes rechtliche Entscheidungen, Ordnungen oder Rechtsbestimmungen. „Rechtsentscheide“ ist präzise und verständlich.
- source_word: עִם יִשְׂרָאֵל
  choice: gemeinsam mit Israel
  rationale: עִם bedeutet „mit“. „Gemeinsam mit“ macht im Deutschen deutlich, dass das Handeln in Gemeinschaft mit Israel geschah, ohne die Präposition als „für“ umzudeuten.
theological_decisions:
- issue: Bedeutung und mögliche Identität von מְחֹקֵק
  choice: allgemein als „Herrscher“ wiedergegeben
  alternative: „Gesetzgeber“, möglicherweise als Hinweis auf Mose
  rationale: Der poetisch verdichtete Ausdruck legt keine eindeutige Identifizierung fest. Die Hauptübersetzung vermeidet daher, Mose ausdrücklich einzutragen; die traditionelle und lexikalisch mögliche Lesart wird in der Fußnote bewahrt.
- issue: Bedeutungsumfang von צִדְקַת יְהוָה
  choice: „die Gerechtigkeit Jahwes“
  alternative: „das Recht Jahwes“ oder „die gerechten Taten Jahwes“
  rationale: Die Formulierung kann Jahwes Gerechtigkeit als Maßstab oder sein konkretes gerechtes Handeln bezeichnen. Die Hauptfassung lässt diese theologische Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. „Jahwe“ gibt den Gottesnamen יהוה wieder. Die parallele Satzstruktur und die knappe Ausdrucksweise des hebräischen Segensspruchs bleiben erhalten; strittige Bedeutungen werden nicht dogmatisch festgelegt.
