source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: de
  text: Sein erstgeborener Stier ist von majestätischer Pracht. Seine Hörner sind die Hörner eines Wildrinds[a]; mit ihnen stößt er die Völker allesamt bis an die Enden der Erde. Das sind die Zehntausende Ephraims[b], und das sind die Tausende Manasses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet wahrscheinlich ein mächtiges wildes Rind, möglicherweise den Auerochsen. Ältere Übersetzungen geben es auch mit „Einhorn“ wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die zahllosen Scharen Ephraims“. Das hebräische Wort kann Zehntausende oder allgemein eine sehr große Zahl bezeichnen und steht hier den „Tausenden Manasses“ gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: sein erstgeborener Stier
  rationale: בְּכוֹר bezeichnet den Erstgeborenen beziehungsweise das erstgeborene Tier; שׁוֹר ist ein Rind und wird wegen des männlichen Bildes und der anschließenden Hörner als „Stier“ wiedergegeben. Die ungewöhnliche Metapher bleibt erhalten.
- source_word: הָדָר לוֹ
  choice: ist von majestätischer Pracht
  rationale: הָדָר umfasst Hoheit, Glanz und Pracht. Die Formulierung gibt den nominalen hebräischen Satz in natürlichem, gehobenem Deutsch wieder.
- source_word: קַרְנֵי רְאֵם
  choice: die Hörner eines Wildstiers
  rationale: רְאֵם bezeichnet wahrscheinlich ein mächtiges wildes Rind, möglicherweise den Auerochsen. „Wildstier“ ist verständlich, bewahrt das Tierbild und vermeidet das sachlich irreführende traditionelle „Einhorn“.
- source_word: יְנַגַּח
  choice: stößt er
  rationale: נָגַח bezeichnet das Stoßen oder Durchbohren mit Hörnern. „stößt“ hält das konkrete Hornbild fest, ohne im Deutschen zwingend eine tödliche Verletzung auszudrücken.
- source_word: עַמִּים יְנַגַּח יַחְדָּו
  choice: stößt er die Völker allesamt
  rationale: עַמִּים wird als „Völker“ wiedergegeben; יַחְדָּו bezeichnet hier ihre gemeinsame Gesamtheit. „allesamt“ klingt im poetischen Zusammenhang natürlicher als das missverständliche „zusammen“.
- source_word: אַפְסֵי אָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die feste poetische Wendung bezeichnet die äußersten Fernen der Erde und wird im Deutschen idiomatisch wiedergegeben.
- source_word: רִבְבוֹת אֶפְרַיִם
  choice: die Zehntausende Ephraims
  rationale: רִבְבוֹת kann große Scharen oder Einheiten von Zehntausend bezeichnen. „Zehntausende“ wahrt den beabsichtigten zahlenmäßigen Kontrast zu den Tausenden Manasses.
- source_word: אַלְפֵי מְנַשֶּׁה
  choice: die Tausende Manasses
  rationale: Im Parallelismus zu רִבְבוֹת ist die numerische Bedeutung von אֶלֶף am wahrscheinlichsten; der deutsche Genitiv des Namens lautet „Manasses“.
theological_decisions:
- issue: Bezug des Stierbildes im Segen über Josef
  choice: Das Bild bleibt grammatisch auf den nicht ausdrücklich näher bestimmten männlichen Bezug von „sein/er“ ausgerichtet und wird am Ende mit Ephraim und Manasse verbunden.
  alternative: Der „erstgeborene Stier“ könnte speziell Ephraim als den herausragenden Nachkommen Josefs bezeichnen.
  rationale: Der hebräische Text nennt zunächst Josef im Zusammenhang des Segens und identifiziert anschließend die Hörner beziehungsweise ihre Macht mit Ephraim und Manasse. Die Übersetzung legt nicht genauer fest, welcher Nachkomme im ersten Satz gemeint ist.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Das kraftvolle Stier- und Hörnerbild sowie der zahlenmäßige Parallelismus zwischen Ephraim und Manasse bleiben erhalten.
