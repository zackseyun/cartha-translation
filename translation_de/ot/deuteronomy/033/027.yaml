  source_fidelity: Der Entwurf gibt die Satzglieder, das räumliche Bild der tragenden Arme, das Vertreiben des Feindes und den schroffen Imperativ insgesamt zutreffend wieder. »Unter dir« ist als im Deutschen notwendige kontextuelle Entfaltung der elliptischen hebräischen Wendung vertretbar. »Urzeit« legt jedoch nahe, Gott gehöre einer prähistorischen oder mythischen Epoche an; קֶדֶם bezeichnet hier natürlicher Gottes Dasein »von alters her«.
  naturalness: Die poetisch-knappe Satzform ist gut verständlich und registergerecht. »Der Gott von alters her« ist im modernen Standarddeutsch idiomatischer und theologisch weniger missverständlich als »der Gott der Urzeit«, ohne die zeitliche Aussage des Hebräischen zu verstärken.
  terminology: »Wohnstätte«, »ewige Arme«, »vertrieb«, »Feind« und »Vernichte!« sind sachgerecht. Die Fußnote soll den revidierten Wortlaut der unmittelbaren Übersetzung genau wiederholen.
