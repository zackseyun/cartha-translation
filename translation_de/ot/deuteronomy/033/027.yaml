  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: de
  text: 'Der Gott von alters her ist eine Wohnstätte[a], und unter dir sind ewige Arme. Er vertrieb den Feind vor dir und sprach: »Vernichte!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der ewige Gott ist deine Zuflucht.« So kann das Hebräische traditionell und stärker deutend verstanden werden; unmittelbarer lautet es: »Der Gott von alters her ist eine Wohnstätte.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: Wohnstätte
  rationale: Das Substantiv bezeichnet eine Wohnung oder einen schützenden Aufenthaltsort. »Wohnstätte« bewahrt das konkrete Bild, ohne es vorschnell als »Zuflucht« auszudeuten.
- source_word: אֱלֹהֵי קֶדֶם
  choice: der Gott der Urzeit
  rationale: קֶדֶם verweist hier am ehesten auf früheste, längst vergangene Zeit. »Gott der Urzeit« gibt dies im Deutschen natürlicher und würdevoller wieder als »Gott von alters her«, während die traditionelle Deutung »der ewige Gott« in der Fußnote erhalten bleibt.
- source_word: וּמִתַּחַת
  choice: und unter dir
  rationale: Die Präposition bezeichnet den Bereich darunter. Das im Hebräischen nur sinngemäß vorhandene »dir« macht im Deutschen den Bezug auf Israel verständlich, ohne das räumliche Bild aufzulösen.
- source_word: זְרֹעֹת עוֹלָם
  choice: ewige Arme
  rationale: »Arme« bewahrt die Metapher für tragende Kraft und Schutz; עוֹלָם bezeichnet hier dauerhafte, unbegrenzte Beständigkeit.
- source_word: וַיְגָרֶשׁ
  choice: Er vertrieb
  rationale: גרש bedeutet wegtreiben oder vertreiben. »Vertrieb« ist im militärischen Zusammenhang klar und kraftvoll.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Wörtlich steht »von deinem Angesicht weg«; gemeint ist, dass der Feind vor Israels Vorrücken beseitigt wird. »Vor dir« wahrt die knappe räumliche Ausdrucksweise.
- source_word: אוֹיֵב
  choice: den Feind
  rationale: Der formal singularische Ausdruck kann kollektiv gebraucht sein. Der Singular wird im Deutschen beibehalten.
- source_word: וַיֹּאמֶר
  choice: und sprach
  rationale: Die einfache Erzählfortsetzung bezieht sich am natürlichsten auf Gott. »Sprach« passt zum würdevollen poetischen Register.
- source_word: הַשְׁמֵד
  choice: Vernichte!
  rationale: Der Hifil-Imperativ von שמד fordert vollständige Zerstörung. »Vernichte!« ist stark und präzise, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Ob קֶדֶם in אֱלֹהֵי קֶדֶם als früheste Vergangenheit oder ausdrücklich als Ewigkeit wiederzugeben ist
  choice: der Gott der Urzeit
  alternative: der ewige Gott
  rationale: קֶדֶם bezeichnet unmittelbar Vorzeit beziehungsweise früheste Vergangenheit; »ewig« ist eine alte und kontextuell mögliche, aber stärker deutende Wiedergabe. Die Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzstruktur. Die konkreten Bilder »Wohnstätte« und »Arme« bleiben erhalten; die traditionelle Deutung wird nicht in den Haupttext eingetragen, sondern als echte Alternative ausgewiesen.
