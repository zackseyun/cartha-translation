  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: de
  text: 'Und über Sebulon sagte er: „Freue dich, Sebulon, wenn du ausziehst[a], und du, Issachar, in deinen Zelten!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei deinem Ausziehen“. Die hebräische Wendung kann auch den Tätigkeits- oder Erfolgsbereich Sebulons bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: Und über Sebulon
  rationale: Die Präposition leitet den Stamm ein, dem der folgende Segensspruch gilt. „Über Sebulon“ ist im modernen Deutschen natürlich und bewahrt den Bezugssinn.
- source_word: אָמַר
  choice: sagte er
  rationale: Schlichte und genaue Wiedergabe der Redeeinleitung.
- source_word: שְׂמַח
  choice: Freue dich
  rationale: Gibt den an Sebulon gerichteten Imperativ in einem natürlichen, würdigen Register wieder; bei Issachar ist dasselbe Verb sinngemäß mitzudenken.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Im Deutschen gebräuchliche Form des Stammesnamens.
- source_word: בְּ/צֵאתֶךָ
  choice: bei deinem Ausziehen
  rationale: Bewahrt das Bild des Ausziehens sowie die mit בְּ ausgedrückte zeitliche oder bereichsbezogene Offenheit, ohne diese auf Handel, Krieg oder eine andere bestimmte Tätigkeit festzulegen.
- source_word: וְ/יִשָּׂשכָר
  choice: und du, Issachar
  rationale: Die Ergänzung „du“ macht im Deutschen deutlich, dass auch Issachar angeredet wird, während das Verb elliptisch aus dem ersten Satzteil übernommen wird.
- source_word: בְּ/אֹהָלֶיךָ
  choice: in deinen Zelten
  rationale: Bewahrt den konkreten Plural und den Parallelismus zum Ausziehen Sebulons; die allgemeinere Deutung „zu Hause“ wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Worin Sebulon und Issachar sich freuen sollen
  choice: Die räumlich bzw. situativ offene Formulierung „bei deinem Ausziehen“ und „in deinen Zelten“ bleibt erhalten.
  alternative: Die Wendungen ausdrücklich als Handel und häusliches Leben oder als militärisches Ausziehen und sesshaftes Wohnen deuten.
  rationale: Der hebräische Text nennt die jeweiligen Tätigkeitsbereiche, legt ihre konkrete geschichtliche oder theologische Bedeutung hier jedoch nicht eindeutig fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Segensstil. Die knappe Parallelstruktur und die Ellipse des hebräischen Verses bleiben erkennbar; „du“ vor Issachar dient lediglich der deutschen Verständlichkeit.
