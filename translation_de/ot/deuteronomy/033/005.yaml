revisions:
- from: Und er war König in Jeschurun[a], als sich die Häupter des Volkes versammelten, die Stämme Israels allesamt.[b]
  to: Und er wurde König in Jeschurun[a], als sich die Häupter des Volkes zusammen mit den Stämmen Israels versammelten.[b]
  rationale: Die Revision ersetzt die im Deutschen unklare Nachstellung durch eine natürliche, quellengerechte Verbindung der Häupter mit den Stämmen. Sie gibt וַיְהִי als „wurde“ wieder, ohne den nicht genannten König zu identifizieren. Die Fußnoten bewahren sowohl die Referentenambiguität als auch die komprimierte hebräische Syntax.
