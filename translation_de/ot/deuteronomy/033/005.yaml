  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: de
  text: Und er wurde König in Jeschurun[a], als sich die Häupter des Volkes zusammen mit den Stämmen Israels versammelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Jeschurun“ ist ein poetischer Name für Israel. Auch möglich: „Und der HERR wurde König in Jeschurun“; andere beziehen „er“ auf Mose. Das hebräische Subjekt wird nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich ist die Schlussfügung knapp: „beim Versammeln der Häupter des Volkes, gemeinsam die Stämme Israels“. „Gemeinsam“ kann die gesamte Versammlung kennzeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und er war
  rationale: Die Form von היה kann hier einen Zustand oder ein Eintreten bezeichnen. Im Zusammenhang klingt „war“ im Deutschen natürlich und lässt offen, ob ein Beginn des Königtums hervorgehoben wird.
- source_word: בִישֻׁרוּן
  choice: in Jeschurun
  rationale: Jeschurun ist ein poetischer Name für Israel und wird als Eigenname wiedergegeben; ב bezeichnet hier am naheliegendsten den Bereich beziehungsweise die Gemeinschaft.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die gewöhnliche Entsprechung des Substantivs; der nicht ausdrücklich genannte Träger des Titels bleibt unbestimmt.
- source_word: בְּהִתְאַסֵּף
  choice: als sich … versammelten
  rationale: Der Infinitiv mit ב hat hier zeitliche Funktion. Die reflexive deutsche Form gibt das Zusammenkommen natürlich wieder.
- source_word: רָאשֵׁי עָם
  choice: die Häupter des Volkes
  rationale: Die Wiedergabe bewahrt das hebräische Bild für die führenden Vertreter des Volkes und bleibt in einem würdigen poetischen Register verständlich.
- source_word: יַחַד
  choice: allesamt
  rationale: Das Adverb bezeichnet das gemeinsame, geschlossene Zusammenkommen. „Allesamt“ verbindet die nachgestellte Wendung natürlich mit den Stämmen Israels.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: die Stämme Israels
  rationale: Direkte und idiomatische Wiedergabe der Stammesverbände Israels; die knappe hebräische Satzfügung bleibt erkennbar.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts bei „König“
  choice: Im Haupttext steht lediglich „er“, ohne den Bezug ausdrücklich festzulegen.
  alternative: „Der HERR war König in Jeschurun“ oder „Mose war König in Jeschurun“.
  rationale: Im Hebräischen wird das Subjekt nicht ausdrücklich genannt. Sowohl der HERR als auch Mose werden als Bezug erwogen; die Übersetzung bewahrt diese echte Mehrdeutigkeit.
- issue: Einheit der Versammlung Israels
  choice: Die Führung des Volkes und die Stämme werden als gemeinsam versammelt dargestellt.
  alternative: Deutung als förmliche Thronbesteigung oder als ausdrücklich bezeichnete Bundesversammlung.
  rationale: Der Text nennt Sammlung und Einheit, bestimmt aber den politischen oder kultischen Anlass nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Färbung. „Häupter“ bewahrt bewusst das Bild des Ausgangstextes; „allesamt“ bildet die Geschlossenheit der versammelten Stämme ab.
