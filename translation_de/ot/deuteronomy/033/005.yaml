  source_fidelity: Die Wiedergabe des unausgedrückten Subjekts durch „er“ bewahrt die im Hebräischen bestehende Unbestimmtheit. Das Wayyiqtol וַיְהִי ist in diesem Kontext besser mit „wurde“ als mit dem rein statischen „war“ wiederzugeben. Die knappe Schlussfügung verbindet die Versammlung der Häupter mit den Stämmen Israels und deren Gemeinsamkeit; eine explizite Koordination im Deutschen macht dies verständlich, ohne einen bestimmten politischen oder kultischen Anlass einzutragen.
  naturalness: „Die Stämme Israels allesamt“ steht im Entwurf nach einem vollständigen Satz zwar als poetisch gemeinte Nachstellung, ist im modernen Standarddeutsch jedoch syntaktisch unklar und kann fälschlich als Apposition zu „Häupter“ gelesen werden. „zusammen mit den Stämmen Israels“ ist natürlich und präzise. „Häupter des Volkes“ ist in einem würdig-poetischen Bibelregister vertretbar.
  terminology: „Jeschurun“, „König“, „Häupter des Volkes“ und „Stämme Israels“ sind angemessene, quellennah verständliche Wiedergaben. Die Fußnote soll die mögliche Identifikation mit dem HERRN oder Mose als Auslegung kennzeichnen, nicht als im hebräischen Text ausgedrückte Benennung.
