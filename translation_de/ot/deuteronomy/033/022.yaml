  text: וּ/לְ/דָ֣ן אָמַ֔ר דָּ֖ן גּ֣וּר אַרְיֵ֑ה יְזַנֵּ֖ק מִן הַ/בָּשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: de
  text: 'Über Dan sagte er:


    „Dan ist ein Löwenjunges;

    er springt aus dem Baschan hervor.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „er schnellt aus dem Baschan hervor“. Das hebräische Verb bezeichnet eine plötzliche Sprungbewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: Über Dan
  rationale: Die Präposition leitet den Stammesspruch ein und bedeutet hier idiomatisch „über“ beziehungsweise „was Dan betrifft“; das vorangestellte וּ verbindet ihn mit der Reihe der Segenssprüche.
- source_word: אָמַר
  choice: sagte er
  rationale: Schlichte und transparente Wiedergabe der üblichen Redeeinleitung.
- source_word: דָּן
  choice: Dan
  rationale: Der Eigenname des Stammvaters beziehungsweise Stammes wird in der gebräuchlichen deutschen Form wiedergegeben.
- source_word: גּוּר אַרְיֵה
  choice: ein Löwenjunges
  rationale: Die Verbindung bezeichnet einen jungen Löwen. „Löwenjunges“ bewahrt sowohl das Tierbild als auch den Altersaspekt und klingt im heutigen Deutsch natürlich.
- source_word: יְזַנֵּק
  choice: er springt … hervor
  rationale: Das Verb bezeichnet eine plötzliche, kraftvolle Sprungbewegung. Die Formulierung bleibt anschaulich, ohne das stärker deutende „stürzt sich“ oder „fällt an“ einzutragen.
- source_word: מִן הַבָּשָׁן
  choice: aus dem Baschan
  rationale: מִן bezeichnet den Ausgangspunkt. Der Artikel des hebräischen Ortsnamens wird im Deutschen idiomatisch durch „dem“ wiedergegeben.
