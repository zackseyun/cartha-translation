id: DEU.33.1
reference: Deuteronomy 33:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: de
  text: 'Und dies ist der Segen, mit dem Mose, der Mann Gottes, die Söhne Israels[a] vor seinem Tod segnete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „die Söhne Israels“, eine übliche Sammelbezeichnung für das Volk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativ eröffnet den abschließenden Abschnitt. „Und dies ist“ gibt beides transparent wieder und klingt in einer feierlichen Überschrift natürlich.
- source_word: הַבְּרָכָה
  choice: der Segen
  rationale: Das Substantiv bezeichnet hier den förmlichen Segensspruch; der bestimmte Artikel bleibt erhalten.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: mit dem … segnete
  rationale: Der Relativsatz bestimmt „Segen“ näher. Die instrumentale deutsche Wendung bildet die hebräische Verbindung idiomatisch ab und bewahrt zugleich die Wortverwandtschaft von „Segen“ und „segnen“.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen Standarddeutsch übliche biblische Namensform.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste Bezeichnung für einen von Gott beauftragten Menschen wird in ihrer maskulinen Singularform direkt und traditionsverständlich wiedergegeben.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die familiäre und grammatisch maskuline Form des Hebräischen wird bewahrt. Eine Fußnote erklärt, dass die Wendung kollektiv das Volk Israel bezeichnet.
- source_word: לִפְנֵי מוֹתוֹ
  choice: vor seinem Tod
  rationale: Die nominale Zeitangabe wird knapp und formal entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe des geschlechtlich markierten Kollektivausdrucks בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; das Volk Israel; die Kinder Israels
  rationale: Die Übersetzung erhält die familiäre und maskuline Form „Söhne“ des Ausgangstextes, ohne sie stillschweigend zu neutralisieren. Da die hebräische Standardwendung kollektiv das ganze Volk bezeichnen kann, wird dieser Umfang in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Leitwortstruktur des Hebräischen. Der Doppelpunkt kennzeichnet den folgenden Segensspruch.
