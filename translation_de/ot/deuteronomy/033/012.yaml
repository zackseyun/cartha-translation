base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: de
  text: 'Über Benjamin sagte er:


    „Der Geliebte Jahwes wohnt sicher bei ihm.[a]

    Er beschirmt ihn den ganzen Tag,

    und zwischen seinen Schultern wohnt er.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wohnt sicher neben ihm“, „wohnt sicher unter ihm“ oder „wohnt sicher über ihm“. Die knappe hebräische Präposition kann Nähe oder schützende Obhut ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zwischen seinen Schultern“. Das kann als Bild schützender Nähe verstanden werden; möglich ist auch eine topografische Deutung auf Benjamins Bergland oder auf das Heiligtum in seinem Gebiet. Zudem bleibt im Hebräischen offen, auf wen „er“ und „seinen“ zu beziehen sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Über Benjamin
  rationale: Die Präposition leitet hier innerhalb der Stammessegen den nächsten Segensspruch ein. „Über Benjamin“ ist im Deutschen natürlich und lässt offen, ob die Worte an ihn oder über ihn gesprochen werden.
- source_word: יְדִיד יְהוָה
  choice: der Geliebte Jahwes
  rationale: יְדִיד bezeichnet einen geliebten oder innig verbundenen Menschen. Der bestimmte Ausdruck bewahrt die Wärme und die Beziehungsaussage des Hebräischen.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: wohnt sicher
  rationale: שׁכן bedeutet „wohnen, sich aufhalten“; לָבֶטַח beschreibt einen Zustand der Sicherheit. Das Präsens entspricht dem dichterischen Charakter des Segens.
- source_word: עָלָיו
  choice: bei ihm
  rationale: Die Präposition עַל ist hier räumlich und syntaktisch mehrdeutig. „Bei ihm“ drückt schützende Nähe aus, ohne eindeutig „über“, „auf“ oder „unter“ festzulegen; weitere Möglichkeiten stehen in der Fußnote.
- source_word: חֹפֵף
  choice: beschirmt
  rationale: Das Partizip bezeichnet ein schützendes Bedecken oder Überschatten. „Beschirmt“ erhält sowohl das Bild des Bedeckens als auch dessen Schutzfunktion.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe und bewahrt den Gedanken ununterbrochenen Schutzes.
- source_word: וּבֵין כְּתֵיפָיו
  choice: und zwischen seinen Schultern
  rationale: Die wörtliche Körpermetapher wird beibehalten. כָּתֵף kann auch eine Bergflanke oder einen Hang bezeichnen, doch diese topografische Deutung soll den Haupttext nicht festlegen.
- source_word: שָׁכֵן
  choice: wohnt er
  rationale: Die erneute Verwendung von „wohnen“ bewahrt die Wiederholung der Wurzel שׁכן und die dichterische Geschlossenheit; die Endstellung des Pronomens erhält die Mehrdeutigkeit seines Bezugs.
theological_decisions:
- issue: Bezug der Pronomen und Subjektwechsel
  choice: Der Haupttext legt nahe, dass der Geliebte sicher bei Jahwe wohnt und Jahwe ihn beschirmt; im letzten Versglied bleibt offen, wer zwischen wessen Schultern wohnt.
  alternative: Jahwe wohnt über Benjamin und zwischen Benjamins Schultern; oder Benjamin wohnt zwischen Jahwes Schultern.
  rationale: Die knappe hebräische Dichtung nennt die Subjekte nicht erneut, und die Pronominalsuffixe können unterschiedlich zugeordnet werden. Eine eindeutige Auflösung würde die echte syntaktische und theologische Spannung des Textes beseitigen.
- issue: Bild der Schultern
  choice: Die anthropomorphe Formulierung „zwischen seinen Schultern“ bleibt im Haupttext stehen.
  alternative: Gemeint sind Benjamins Berghänge oder das in seinem Gebiet gelegene Heiligtum.
  rationale: Die topografische beziehungsweise heiligtumsbezogene Auslegung ist möglich, geht aber über die ausdrücklich formulierte Bildsprache hinaus und wird deshalb nur als Deutungsmöglichkeit vermerkt.
translation_notes:
  register: Moderne, würdevolle deutsche Bibelsprache mit knapper poetischer Zeilengliederung. Der Gottesname wird als „Jahwe“ wiedergegeben. Ungewöhnliche Bilder und grammatische Mehrdeutigkeiten des Hebräischen bleiben erhalten und werden nicht konfessionell aufgelöst.
