translation_notes:
  register: Poetisch und würdevoll, zugleich in heutigem Standarddeutsch verständlich. Die parallele Satzstruktur und der Anschluss mit „und mit“ bleiben erhalten; „Ertrag“ wird in der zweiten Hälfte als kollektiver Singular wiedergegeben.
