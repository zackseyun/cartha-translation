  text: and with the choicest produce of the sun[a], and with the yield of the months[b],
translation:
  language: de
  text: und mit den kostbaren Erträgen der Sonne[a] und mit dem kostbaren Ertrag der Monate[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den kostbaren Gaben der Sonne“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Monate“; das hebräische Wort ist mit „Mond“ verwandt und kann an den Ertrag erinnern, der Monat für Monat hervorgebracht wird.
    reason: cultural_note
lexical_decisions:
- source_word: מֶגֶד
  choice: kostbar / kostbarsten
  rationale: Das Wort bezeichnet wertvolle, erlesene Gaben oder reichen Segen. In der ersten Vershälfte gibt der Superlativ „kostbarsten“ den hohen Wert idiomatisch wieder; in der zweiten wird die Wiederholung durch „kostbaren Ertrag“ natürlich aufgenommen.
- source_word: תְּבוּאֹת
  choice: Erträge
  rationale: Der Plural bezeichnet umfassend das, was das Land hervorbringt. „Erträge“ bewahrt sowohl den landwirtschaftlichen Sinn als auch die Mehrzahl.
- source_word: שָׁמֶשׁ
  choice: der Sonne
  rationale: Die Sonne wird als die mit dem Wachstum verbundene Größe genannt; die knappe Genitivverbindung entspricht dem poetischen Parallelismus.
- source_word: גֶּרֶשׁ
  choice: Ertrag
  rationale: Das seltene Wort bezeichnet hier wohl das Hervorgebrachte. „Ertrag“ ist verständlich, wahrt den landwirtschaftlichen Zusammenhang und vermeidet eine irreführend wörtliche Wiedergabe wie „das Herausgetriebene“.
- source_word: יְרָחִים
  choice: der Monate
  rationale: Der Plural bedeutet gewöhnlich „Monate“, steht aber sprachlich in Beziehung zum Mond. Die Übersetzung erhält den zeitlichen Zyklus, während die Fußnote den möglichen Anklang erläutert.
