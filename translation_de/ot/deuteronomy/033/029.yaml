  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: de
  text: Wie glücklich bist du, Israel! Wer ist wie du, ein Volk, gerettet durch Jahwe, den Schild deiner Hilfe und das Schwert deiner Hoheit? Deine Feinde werden sich dir unterwerfen[a], und du wirst über ihre Höhen schreiten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Feinde werden vor dir kriechen.« Das hebräische Verb kann erzwungene, ängstliche oder nur vorgetäuschte Unterwerfung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du wirst ihre Höhen beziehungsweise Festungen niedertreten«; manche verstehen das Bild als »ihre Rücken«. »Höhen« ist die unmittelbarste Wiedergabe des hebräischen Substantivs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Wie glücklich bist du
  rationale: Die Ausrufungsform bezeichnet einen beneidenswerten Zustand des Glücks und Wohlergehens. Die Formulierung ist im Deutschen natürlich und vermeidet, dass „gesegnet“ irrtümlich als passives Verb verstanden wird.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: ein Volk, gerettet durch Jahwe
  rationale: Das Nifal-Partizip beschreibt Israel als ein von Jahwe gerettetes beziehungsweise befreites Volk. „Gerettet“ wahrt die umfassende Bedeutung; „durch“ bezeichnet Jahwe als Urheber der Rettung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt das Tetragramm, den persönlichen Gottesnamen; die übliche deutsche Umschrift „Jahwe“ bewahrt diesen Namen.
- source_word: מָגֵן עֶזְרֶךָ
  choice: den Schild deiner Hilfe
  rationale: Die knappe hebräische Genitivverbindung wird formal bewahrt und stellt Jahwe als schützende Quelle der Hilfe Israels dar.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: und das Schwert deiner Hoheit
  rationale: Die elliptische Parallelwendung setzt die Beschreibung Jahwes fort. „Hoheit“ gibt die positive Bedeutung von Erhöhung und Würde wieder, ohne den häufig negativen Beiklang von „Stolz“.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Deine Feinde werden sich dir heuchlerisch unterwerfen
  rationale: Das Verb kann erzwungene, nur vorgetäuschte Unterwerfung ausdrücken. „Heuchlerisch unterwerfen“ erhält diesen im Hebräischen vorhandenen Aspekt deutlicher als bloßes „sich beugen“.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: du wirst über ihre Höhen schreiten
  rationale: במות bezeichnet unmittelbar Höhen; im kriegerischen Zusammenhang können besonders beherrschende Höhen oder befestigte Plätze gemeint sein. Die direkte Bildsprache bleibt im Haupttext erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen verwendet, wird er transliteriert und nicht durch einen Titel ersetzt.
- issue: Bedeutung von גַּאֲוָה
  choice: Hoheit
  alternative: Stolz / Erhöhung
  rationale: „Hoheit“ bewahrt hier den positiven Sinn von Würde und Erhöhung, ohne eine moralisch negative Deutung einzutragen.
- issue: Art der Unterwerfung der Feinde
  choice: heuchlerische Unterwerfung
  alternative: ängstliches Kriechen
  rationale: Die Form kann sowohl abjekte als auch nur vorgetäuschte Gefügigkeit bezeichnen. Der Haupttext wahrt den Täuschungsaspekt; die Fußnote nennt die andere mögliche Akzentsetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Ton. Die direkte Anrede und die parallelen Gottesbilder bleiben erhalten; ungewöhnliche, aber verständliche Bildsprache wird nicht geglättet.
