  rationale: Die Revision beseitigt die im Deutschen missverständliche Formulierung „ein Erbe“ und ersetzt die weniger idiomatische Verbindung „Weisung gebieten“ durch die natürliche, quellentreue Verbindung „ein Gesetz gebieten“. Die alternative breitere Bedeutung von תּוֹרָה bleibt in der Fußnote zugänglich. Der Gedankenstrich bewahrt die hebräische Kürze sowie die nicht völlig aufgelöste appositionelle Beziehung der zweiten Nominalgruppe.
