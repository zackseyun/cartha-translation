  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: de
  text: Mose gebot uns ein Gesetz[a] – ein Erbbesitz für die Versammlung Jakobs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weisung“. Das hebräische Wort kann sowohl „Weisung“ als auch „Gesetz“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Mose gebot uns ein Gesetz, das Erbe der Versammlung Jakobs.“ Der hebräische Satz ist stark verdichtet; „Erbbesitz“ kann in enger Apposition zu „Gesetz“ stehen. Auch „Erbe“ oder „Besitz“ sind mögliche Wiedergaben.'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹרָה
  choice: Weisung
  rationale: „Weisung“ gibt das Bedeutungsspektrum von תּוֹרָה natürlich wieder und vermeidet, den Ausdruck vorschnell auf ein modernes Gesetzesverständnis zu verengen; im Zusammenhang ist die verbindliche, durch Mose vermittelte Weisung gemeint.
- source_word: צִוָּה
  choice: gebot
  rationale: Das starke Verb bewahrt den Sinn autoritativen Anordnens und folgt der poetischen Wortstellung des Hebräischen.
- source_word: לָנוּ
  choice: uns
  rationale: Beim deutschen Verb „gebieten“ bezeichnet der Dativ idiomatisch die Empfänger; damit kann לָנוּ knapp und quellennah wiedergegeben werden.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
- source_word: מוֹרָשָׁה
  choice: ein Erbe
  rationale: Der Ausdruck bezeichnet einen bleibenden, als Erbbesitz empfangenen Besitz. „Erbe“ ist verständlich und bewahrt den Bundes- und Besitzgedanken.
- source_word: קְהִלַּת
  choice: die Versammlung
  rationale: „Versammlung“ bildet den gemeinschaftlichen und korporativen Sinn ab, ohne eine spätere kirchliche Organisationsform einzutragen.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der ausdrücklich genannte Name Jakob bleibt erhalten und wird nicht deutend durch „Israel“ ersetzt.
theological_decisions:
- issue: Syntaktisches Verhältnis von תּוֹרָה und מוֹרָשָׁה
  choice: 'Die zweite Nominalgruppe wird als an die erste Aussage angeschlossene Charakterisierung wiedergegeben: Die Weisung ist ein Erbe für Jakobs Versammlung.'
  alternative: „Mose gebot uns Weisung, das Erbe der Versammlung Jakobs.“
  rationale: Der hebräische Satz ist poetisch verdichtet und besitzt im zweiten Teil kein ausdrückliches Verb. Die Hauptfassung wahrt diese Knappheit und lässt die enge sachliche Beziehung erkennen, ohne die appositionelle Analyse als einzig mögliche Syntax festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Kürze. „Weisung“ ist für heutige Leser verständlich und bildet תּוֹרָה breiter ab als „Gesetz“. Die ungewöhnliche, aber klare Formulierung „Mose gebot uns Weisung“ erhält die Kraft und Verdichtung der hebräischen Zeile.
