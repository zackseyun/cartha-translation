    rationale: Mit unbestimmtem Artikel bezeichnet „ein Erbe“ im heutigen Deutsch normalerweise einen Erben, also eine Person. Gemeint ist hier ein ererbter Besitz bzw. eine Hinterlassenschaft.
  - severity: low
    issue: Die Verbindung „jemandem Weisung gebieten“ ist im modernen Deutsch unnatürlich.
    rationale: Das Verb „gebieten“ verbindet sich idiomatisch mit „Gesetz“ oder mit Infinitiv-/Dass-Sätzen; „Weisung“ wird eher „erteilt“ oder „gegeben“. Die Hauptfassung sollte daher „Gesetz“ verwenden.
