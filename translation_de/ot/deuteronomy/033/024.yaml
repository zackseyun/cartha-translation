base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: de
  text: 'Und über Ascher sagte er:


    »Unter den Söhnen sei Ascher am meisten gesegnet[a].

    Bei seinen Brüdern[b] finde er Wohlgefallen,

    und seinen Fuß tauche er in Öl[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Gesegneter als die Söhne sei Ascher.« Die hebräische Vergleichskonstruktion kann vergleichend oder superlativisch verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Mit seinen »Brüdern« sind hier wahrscheinlich die anderen Stämme Israels gemeint.
    reason: cultural_note
  - marker: c
    text: Das Bild, den Fuß in Öl zu tauchen, deutet wahrscheinlich auf Überfluss oder Wohlstand hin; im Text bleibt es wörtlich wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: Über Ascher sagte er
  rationale: Die Präposition לְ führt hier den nächsten Stammesspruch ein. »Über Ascher« ist im Deutschen eine natürliche Einleitung und bewahrt den Bezug des Segensspruchs.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: Unter den Söhnen sei Ascher am meisten gesegnet
  rationale: Die Konstruktion mit מִן kann vergleichend beziehungsweise superlativisch verstanden werden. Die Hauptfassung gibt den im Zusammenhang naheliegenden Superlativ wieder; die echte sprachliche Alternative wird in Fußnote [a] offengehalten.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: Bei seinen Brüdern finde er Wohlgefallen
  rationale: רְצוּי bezeichnet jemanden, der wohlgefällig beziehungsweise gern angenommen ist. Die deutsche Wunschform entspricht dem jussivischen Sinn von יְהִי und vermeidet die mögliche moderne Nebenbedeutung von »begünstigt«.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: und seinen Fuß tauche er in Öl
  rationale: Die konkrete poetische Metapher, einschließlich des Singulars »Fuß«, bleibt erhalten. Der deutsche Konjunktiv führt den Segenswunsch der vorangehenden Zeile fort.
theological_decisions:
- issue: Bedeutung des Bildes, den Fuß in Öl zu tauchen
  choice: Das Bild wird im Haupttext wörtlich wiedergegeben.
  alternative: Es unmittelbar als landwirtschaftlichen Reichtum, Wohlstand, Sicherheit oder Luxus auszudeuten.
  rationale: Das Bild legt Überfluss und Wohlstand nahe, legt seine genaue Bedeutung aber nicht fest. Eine wörtliche Wiedergabe wahrt die poetische und theologische Offenheit.
- issue: Bezug der »Brüder«
  choice: Die konkrete Verwandtschaftsbezeichnung bleibt im Haupttext stehen.
  alternative: »die anderen Stämme Israels« in den Haupttext aufzunehmen.
  rationale: Im Zusammenhang sind wahrscheinlich die anderen von Jakob abstammenden Stämme gemeint; die ausdrückliche Deutung gehört jedoch in eine Anmerkung und nicht an die Stelle des hebräischen Bildes.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Ton. Die Zeilenform bildet den Segensspruch ab; die Konjunktivformen »sei«, »finde« und »tauche« geben seinen Wunschcharakter wieder. Konkrete Familien- und Wohlstandsbilder des Hebräischen bleiben erhalten.
