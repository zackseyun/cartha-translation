base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: de
  text: Möge Ruben leben und nicht sterben; mögen seine Männer gering an Zahl sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seine Männer mögen mitgezählt werden.“ Der hebräische Wortlaut des letzten Satzteils ist schwierig. Er wurde auch als Bitte verstanden, Ruben möge nicht unbedeutend werden oder von der Zählung der Stämme ausgeschlossen sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: soll leben
  rationale: Der Qal-Jussiv von חיה drückt hier einen Segenswunsch aus. Die deutsche Konstruktion mit „soll“ gibt diesen Wunsch würdig und natürlich wieder.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Der Personen- und Stammesname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וְאַל יָמֹת
  choice: und nicht sterben
  rationale: אַל mit der jussivischen Verbform bezeichnet einen verneinten Wunsch. „Nicht sterben“ entspricht dem schlichten lexikalischen Sinn von מות und bildet mit „leben“ ein klares Gegenüber.
- source_word: וִיהִי
  choice: und … sollen … sein
  rationale: Der zweite Jussiv führt einen weiteren Wunsch beziehungsweise Segenssatz ein; die deutsche Soll-Konstruktion bewahrt die Parallelität.
- source_word: מְתָיו
  choice: seine Männer
  rationale: Das schwierige Substantiv wird in diesem Stammessegen am ehesten auf die Männer beziehungsweise Angehörigen Rubens bezogen. Die Unsicherheit der Wendung wird in der Fußnote kenntlich gemacht.
- source_word: מִסְפָּר
  choice: wenige
  rationale: Wörtlich bezeichnet das Wort eine „Zahl“ oder etwas Zählbares. Zusammen mit היה liegt idiomatisch wahrscheinlich „wenige an Zahl“ nahe, obwohl die knappe hebräische Wendung auch anders verstanden worden ist.
theological_decisions:
- issue: Deutung der Schlussklausel וִיהִי מְתָיו מִסְפָּר
  choice: '„und seine Männer sollen wenige sein“: Ruben soll trotz geringer Stärke fortbestehen.'
  alternative: „und seine Männer sollen mitgezählt werden“, also nicht aus der Zählung beziehungsweise dem Stammesverband ausgeschlossen sein.
  rationale: Der masoretische Text ist knapp und schwierig. Die Hauptfassung folgt der naheliegenden Bedeutung „wenige an Zahl“, ohne die Spannung des Segens zu glätten. Die wichtige positivere Alternativdeutung wird in einer Fußnote bewahrt; textkritische Ergänzungen werden nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Soll-Konstruktion gibt die hebräischen Segenswünsche natürlich wieder. Die schwierige und theologisch spannungsreiche Schlussklausel bleibt im Haupttext knapp; ihre maßgebliche Alternativdeutung steht in der Fußnote.
