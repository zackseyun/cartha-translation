base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: de
  text: 'Und über Levi sagte er:


    »Deine Tummim und deine Urim gehören deinem Getreuen[a], den du bei Massa auf die Probe gestellt hast[b], mit dem du an den Wassern von Meriba gestritten hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinem Frommen« beziehungsweise »dem, der dir treu ist«. Der hebräische Ausdruck kann einen Menschen bezeichnen, der durch Treue und Bundestreue geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: Massa bedeutet »Prüfung«, und Meriba hängt mit »Streit« zusammen (siehe 2. Mose 17,1–7; 4. Mose 20,1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: Und über Levi
  rationale: Die Präposition לְ leitet im Zusammenhang der Stammessegnungen den Stamm ein, über den gesprochen wird. „Über Levi“ ist im Deutschen natürlich und wahrt den Bezug.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Deine Tummim und deine Urim
  rationale: Beide Wörter sind technische priesterliche Begriffe, deren genaue Gegenstände und Funktion nicht völlig sicher sind. Deshalb werden sie transliteriert und nicht mit möglichen etymologischen Bedeutungen wiedergegeben.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: gehören deinem Getreuen
  rationale: Der hebräische Nominalsatz erfordert im Deutschen eine sinngemäße Ergänzung. „Deinem Getreuen“ gibt אִישׁ חֲסִידֶךָ knapp wieder und bewahrt den Gedanken persönlicher Treue beziehungsweise Bundestreue, ohne den Gemeinten näher zu bestimmen.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: den du ... auf die Probe gestellt hast
  rationale: נסה im Piel bedeutet prüfen oder auf die Probe stellen. Die Formulierung ist modernes, gut verständliches Deutsch und passt zur Anspielung auf das Wüstenereignis.
- source_word: בְּמַסָּה
  choice: bei Massa
  rationale: Massa wird als Ortsname beibehalten; בְּ wird hier idiomatisch-lokativ mit „bei“ wiedergegeben.
- source_word: תְּרִיבֵהוּ
  choice: mit dem du ... gestritten hast
  rationale: ריב bezeichnet Streiten, Hadern oder einen Streit austragen. Die deutsche Konstruktion wahrt, dass Gott und der bezeichnete Getreue als Streitparteien erscheinen.
- source_word: עַל מֵי מְרִיבָה
  choice: an den Wassern von Meriba
  rationale: Die Wendung bezeichnet den Ort beziehungsweise das Ereignis bei den Wassern von Meriba. „An“ gibt den lokalen Gebrauch von עַל hier natürlich wieder.
theological_decisions:
- issue: Bezug von „deinem Getreuen“ im Levisegen
  choice: Die singularische Bezeichnung bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Aaron, Levi oder der Stamm Levi als Ganzes ausdrücklich benennen.
  rationale: Der hebräische Singular lässt mehrere Bezugsmöglichkeiten zu. Die Übersetzung bewahrt diese Mehrdeutigkeit und legt nicht fest, wen der Text genau meint.
- issue: Gott als Subjekt des Prüfens und Streitens
  choice: Die zweite Person Singular bleibt in beiden Aussagen direkt auf Gott bezogen.
  alternative: Die Formulierungen abschwächen oder so umstellen, dass menschliche Akteure als Prüfende beziehungsweise Streitende erscheinen.
  rationale: Die hebräischen Verbformen sprechen Gott unmittelbar als Handelnden an. Die dadurch entstehende Spannung zu den angespielten Wüstenerzählungen darf nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelstil. Die technischen Begriffe Tummim und Urim sowie die Ortsnamen Massa und Meriba bleiben erhalten. Die poetische Direktheit und die theologische Spannung der Gottesrede werden nicht geglättet.
