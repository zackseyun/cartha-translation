  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: de
  text: So wohnt Israel sicher, für sich allein[b] – Jakobs Quelle[a] – in einem Land mit Korn und Most; selbst seine Himmel träufeln Tau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jakobs Auge“. Das hebräische Wort kann sowohl „Auge“ als auch „Quelle“ bedeuten; „Quelle“ passt zum anschließenden Bild eines fruchtbaren Landes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „abgesondert“ oder „für sich“. Gemeint ist hier im Segenszusammenhang eigenständiges, unbedrohtes Wohnen, nicht notwendigerweise Einsamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: wohnte
  rationale: שׁכן bezeichnet dauerhaftes Wohnen oder Sich-Niederlassen. „wohnte“ ist im modernen Deutschen natürlich und bewahrt die erzählende Verbform.
- source_word: בֶּטַח
  choice: sicher
  rationale: Das Wort wird hier adverbial gebraucht und beschreibt Israels geschützte, unbedrohte Lage.
- source_word: בָּדָד
  choice: für sich allein
  rationale: בָּדָד bezeichnet ein abgesondertes, eigenständiges Wohnen. Im Segenszusammenhang ist keine Verlassenheit gemeint; „für sich allein“ lässt dennoch die Spannung des Ausdrucks bestehen.
- source_word: עֵין יַעֲקֹב
  choice: Jakobs Quelle
  rationale: עֵין kann „Auge“ oder „Quelle“ bedeuten. Die Bilder von Korn, Most und Tau sprechen hier eher für „Quelle“; die anatomische Bedeutung wird in einer Fußnote bewahrt.
- source_word: אֶל אֶרֶץ
  choice: in einem Land
  rationale: אֶל bedeutet gewöhnlich „zu/auf … hin“, kann in dichterischer Sprache aber eine räumliche Zuordnung ausdrücken. Im Deutschen gibt „in einem Land“ den Zusammenhang verständlich wieder.
- source_word: דָּגָן
  choice: Korn
  rationale: דָּגָן ist eine Sammelbezeichnung für Getreide beziehungsweise Getreideertrag. „Korn“ ist knapp, idiomatisch und landwirtschaftlich passend.
- source_word: תִּירוֹשׁ
  choice: Most
  rationale: תִּירוֹשׁ bezeichnet häufig frischen beziehungsweise neuen Wein als Erzeugnis des Landes. „Most“ bewahrt im Deutschen diesen landwirtschaftlichen Akzent.
- source_word: אַף
  choice: selbst
  rationale: 'אַף steigert die Aussage: Nicht nur das Land ist fruchtbar, selbst der Himmel trägt zum Segen bei.'
- source_word: שָׁמָיו
  choice: sein Himmel
  rationale: Die maskuline Singularendung wird beibehalten. Das deutsche Singularwort „Himmel“ gibt den Sinn natürlicher wieder als der ungewöhnliche Plural „Himmel“.
- source_word: יַעַרְפוּ טָל
  choice: träufelte Tau
  rationale: ערף bezeichnet hier das Tropfen oder Herabträufeln von Feuchtigkeit. Die Formulierung erhält das poetische Bild und folgt der zeitlichen Perspektive des Versanfangs.
theological_decisions:
- issue: Deutung von עֵין יַעֲקֹב
  choice: „Jakobs Quelle“ als dichterische Bezeichnung in Apposition zu Israel
  alternative: „Jakobs Auge“ oder eine syntaktisch ergänzte Aussage wie „Jakobs Quelle lag …“
  rationale: Der Fruchtbarkeitszusammenhang begünstigt „Quelle“. Die appositionelle, im Hebräischen knappe Konstruktion vermeidet zugleich das Einfügen eines nicht ausdrücklich vorhandenen Verbs; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
- issue: Bedeutung von בָּדָד
  choice: „für sich allein“ im Sinn eigenständiger, sicherer Abgesondertheit
  alternative: „abgesondert“, „allein“ oder „für sich“
  rationale: Der Segenskontext spricht gegen das Verständnis als Verlassenheit, ohne die im Wort liegende Vorstellung des Alleinseins aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzfügung. Die Apposition „Jakobs Quelle“ bewahrt die verdichtete hebräische Syntax; „Korn und Most“ hält den landwirtschaftlichen Parallelismus prägnant fest.
