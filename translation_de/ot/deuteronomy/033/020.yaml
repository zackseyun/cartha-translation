  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: de
  text: 'Und über Gad sagte er:


    „Gesegnet sei, wer Gad Raum schafft.[a]


    Gad lagert wie ein Löwe[b]

    und zerreißt Arm, ja selbst Scheitel.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Gesegnet ist, wer Gad Raum schafft.“ Als Handelnder kann Gott mitgemeint sein, doch der hebräische Text nennt ihn nicht ausdrücklich.'
    reason: alternative_reading
  - marker: b
    text: „Löwe“ kann hier auch mit „Löwin“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Arm, ja sogar Scheitel“; „Scheitel“ bezeichnet den oberen Teil des Kopfes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: Und über Gad
  rationale: Die Formel leitet den an beziehungsweise über den Stamm Gad gerichteten Segensspruch ein; „über Gad“ ist im Deutschen natürlich und treffend.
- source_word: בָּרוּךְ מַרְחִיב גָּד
  choice: Gesegnet sei, wer Gad Raum schafft
  rationale: Das Partizip מַרְחִיב bezeichnet jemanden, der Weite beziehungsweise Raum gibt. Die Formulierung lässt den im Hebräischen ungenannten Handelnden offen.
- source_word: כְּלָבִיא
  choice: wie ein Löwe
  rationale: לָבִיא kann einen Löwen oder eine Löwin, besonders ein kräftiges ausgewachsenes Tier, bezeichnen. „Löwe“ gibt die allgemeine Raubtier- und Stärkevorstellung idiomatisch wieder; die mögliche spezifische Wiedergabe „Löwin“ wird in der Fußnote bewahrt.
- source_word: שָׁכֵן
  choice: lagert er
  rationale: Das Verb kann wohnen, sich niederlassen oder lagern bedeuten. Im Löwenvergleich verbindet „lagert“ die territoriale Aussage mit dem Bild eines ruhenden Raubtiers.
- source_word: וְטָרַף
  choice: und zerreißt
  rationale: טרף bezeichnet das gewaltsame Reißen eines Raubtiers; „zerreißt“ wahrt die drastische Bildsprache.
- source_word: זְרוֹעַ אַף קָדְקֹד
  choice: Arm und Scheitel
  rationale: Beide konkreten Körperteile bleiben erhalten. אַף wirkt hier additiv beziehungsweise steigernd; im natürlichen Deutschen kann diese Verbindung knapp mit „und“ wiedergegeben werden.
theological_decisions:
- issue: Wer Gad Raum schafft
  choice: 'Der Handelnde bleibt ungenannt: „wer Gad Raum schafft“'
  alternative: „Gesegnet sei Gott, der Gad Raum schafft“ oder „Gesegnet ist, der Gad Raum schafft“
  rationale: Der hebräische Text nennt Gott nicht ausdrücklich, auch wenn er als Handelnder mitgemeint sein kann. Die Übersetzung wahrt diese Offenheit. Der deutsche Segenswunsch „Gesegnet sei“ gibt die knappe hebräische Segensformel würdig wieder.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Die knappe und gewaltsame Bildsprache des hebräischen Segensspruchs bleibt erhalten; unnötige Explizierungen werden vermieden.
