source:
  edition: WLC
  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: de
  text: 'Und dies sagte er über Juda:


    »Höre, Jahwe, die Stimme Judas,

    und bring ihn zu seinem Volk.

    Seine Hände mögen für ihn kämpfen[a],

    und sei du ihm eine Hilfe gegen seine Bedränger.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seine Hände mögen ihm genügen.« Der hebräische Satz ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: Und dies sagte er über Juda
  rationale: Die Formel leitet Judas Segen ein. »Über Juda« gibt das thematische לְ im Deutschen natürlich wieder; »dies« nimmt den folgenden Segensspruch auf.
- source_word: שְׁמַע יְהוָה
  choice: Höre, Jahwe
  rationale: Der Imperativ ist als unmittelbare Bitte an Gott wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: קוֹל יְהוּדָה
  choice: die Stimme Judas
  rationale: Die wörtliche Bildsprache bleibt erhalten, ohne קוֹל enger als »Hilferuf« zu deuten.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: und bring ihn zu seinem Volk
  rationale: Der Hifil von בוא bezeichnet das Hinbringen. Die Übersetzung lässt offen, ob eine Rückkehr aus dem Kampf oder eine andere Zusammenführung gemeint ist.
- source_word: יָדָיו רָב לוֹ
  choice: Seine Hände mögen für ihn kämpfen
  rationale: Die schwierige, knappe Wendung wird im Zusammenhang als Bitte um Judas eigene Kampfkraft verstanden. »Hände« bewahrt das hebräische Bild; die alternative Deutung wird in der Fußnote genannt.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: und sei du ihm eine Hilfe gegen seine Bedränger
  rationale: 'Das ungenannte Subjekt wird im Gebetszusammenhang als Jahwe verstanden. מִן wird adversativ gefasst: Hilfe gegen die Bedränger.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben und in der direkten Anrede ohne Artikel verwendet.
- issue: Deutung von יָדָיו רָב לוֹ
  choice: Seine Hände mögen für ihn kämpfen
  alternative: Seine Hände mögen ihm genügen
  rationale: Die Hauptfassung passt zum militärischen Zusammenhang und zur anschließenden Bitte um Hilfe gegen Feinde. Da Wortform und Syntax mehrere Deutungen zulassen, wird die andere verbreitete Auffassung ausdrücklich in einer Fußnote bewahrt.
- issue: Bezug des Subjekts in תִּהְיֶה
  choice: 'Jahwe als angeredetes Subjekt: »sei du«'
  alternative: 'unpersönlich: »und Hilfe werde ihm zuteil«'
  rationale: Die direkte Anrede an Jahwe am Versanfang legt nahe, auch die abschließende Bitte an ihn zu richten; »du« macht den im Deutschen sonst missverständlichen Bezug deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. Die direkte Rede bleibt knapp und gebetsartig; ungewöhnliche hebräische Bildsprache wird soweit verständlich bewahrt.
