  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: de
  text: und vom Besten der uralten Berge[a] und von den Kostbarkeiten der ewigen Hügel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Gipfeln der uralten Berge“. Der hebräische Ausdruck kann räumlich („Kopf/Gipfel“) oder qualitativ („das Vorzüglichste/Beste“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom kostbaren Ertrag der ewigen Hügel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: vom Besten
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ oder „Gipfel“, kann hier im Segenskontext aber das Vorzüglichste bezeichnen. Der qualitative Sinn passt zum parallelen מֶגֶד; die räumliche Lesart bleibt in der Fußnote erhalten.
- source_word: הַרְרֵי
  choice: Berge
  rationale: Der Plural constructus von הַר wird seinem üblichen Sinn entsprechend mit „Berge“ wiedergegeben und von גִּבְעוֹת („Hügel“) unterschieden.
- source_word: קֶדֶם
  choice: uralten
  rationale: קֶדֶם kann „Osten“ oder „Vorzeit“ bedeuten. Die Parallele zu עוֹלָם spricht hier für den zeitlichen Sinn; „uralt“ ist poetisch und in modernem Deutsch verständlich.
- source_word: מִמֶּגֶד
  choice: vom kostbaren Ertrag
  rationale: מֶגֶד bezeichnet Kostbares, besonders reichen oder erlesenen Ertrag. „Kostbarer Ertrag“ wahrt sowohl den Wertaspekt als auch den Segens- und Fruchtbarkeitskontext.
- source_word: גִּבְעוֹת
  choice: Hügel
  rationale: Die gewöhnliche Bedeutung von גִּבְעָה ist „Hügel“; dadurch bleibt der poetische Gegensatz zu den Bergen erhalten.
- source_word: עוֹלָם
  choice: ewigen
  rationale: עוֹלָם kann unbegrenzte Dauer oder fernste Vorzeit ausdrücken. „Ewig“ bewahrt die erhabene poetische Sprache und lässt die mögliche Spannung zwischen Alter und Fortdauer bestehen.
theological_decisions: []
translation_notes:
  register: Poetische, würdevolle Segenssprache in modernem Standarddeutsch. Die paarweise Struktur von „Berge“ und „Hügel“ sowie die zeitlich erhabenen Bezeichnungen „uralt“ und „ewig“ bleiben erhalten.
