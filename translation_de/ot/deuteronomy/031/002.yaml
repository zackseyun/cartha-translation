  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Ich bin heute hundertzwanzig Jahre alt. Ich kann nicht mehr hinausgehen und hereinkommen[a], und Jahwe hat zu mir gesagt: ‚Du wirst diesen Jordan nicht überqueren.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „hinausgehen und hereinkommen“. Die hebräische Wendung kann sowohl gewöhnliche Tätigkeit als auch die Führung des Volkes bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Und er sagte zu ihnen
  rationale: Der narrative Wayyiqtol wird schlicht wiedergegeben; der indirekte Bezug אֲלֵהֶם bedeutet „zu ihnen“.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Ich bin heute hundertzwanzig Jahre alt
  rationale: Die hebräische Altersformel „Sohn von ... Jahren“ wird in natürlichem modernem Deutsch als Altersangabe formuliert; „heute“ bleibt hervorgehoben.
- source_word: לֹא אוּכַל עוֹד
  choice: Ich kann nicht mehr
  rationale: יכל bezeichnet Fähigkeit oder Vermögen; עוֹד mit Negation ergibt „nicht mehr“.
- source_word: לָצֵאת וְלָבוֹא
  choice: ausziehen und einziehen
  rationale: Die konkrete hebräische Paarformel bleibt erhalten. Sie kann gewöhnliche Betätigung oder die Führung des Volkes bezeichnen; diese Offenheit wird nicht im Haupttext aufgelöst.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der im Quelltext stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben, entsprechend der angegebenen theologischen Entscheidung und der englischen POB-Konsultationsfassung.
- source_word: אָמַר אֵלַי
  choice: hat zu mir gesagt
  rationale: Das Perfekt bezeichnet eine vorausgegangene Aussage, die für die gegenwärtige Lage maßgeblich bleibt; das deutsche Perfekt ist hier natürlich.
- source_word: לֹא תַעֲבֹר אֶת הַיַּרְדֵּן הַזֶּה
  choice: Du wirst diesen Jordan nicht überqueren
  rationale: Die nicht-volitive Verbform kann als bestimmte göttliche Ankündigung verstanden werden. „Diesen“ bewahrt die deiktische Kraft von הַזֶּה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im hebräischen Text. „Jahwe“ bewahrt ihn als Namen und folgt der aktualisierten theologischen Vorgabe in den bereitgestellten Entscheidungen.
- issue: Kraft von לֹא תַעֲבֹר
  choice: Du wirst ... nicht überqueren
  alternative: Du sollst ... nicht überqueren
  rationale: Im unmittelbaren Zusammenhang berichtet Mose, was Jahwe über sein künftiges Nichtüberschreiten erklärt hat. Die Zukunftsform gibt die bestimmte Ankündigung wieder, ohne einen bloßen moralischen Befehl zu unterstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bewegungsformel wird bewusst formal bewahrt und in einer Fußnote erklärt; ansonsten folgt die Fassung natürlicher deutscher Syntax.
