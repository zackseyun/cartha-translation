revisions:
- from: Wenn dann viel Unheil und Bedrängnis über ihn kommen[a], wird dieses Lied vor ihm als Zeuge antworten[b]; denn es wird im Mund seiner Nachkommen nicht in Vergessenheit geraten. Denn ich kenne seine Neigung und weiß, was er heute schon tut[c], noch bevor ich ihn in das Land bringe, das ich ihm zugeschworen habe[d].
  to: Wenn ihn viele Unglücke und Bedrängnisse treffen[a], wird dieses Lied vor ihm als Zeuge aussagen[b]; denn es wird aus dem Mund seiner Nachkommen nicht in Vergessenheit geraten. Denn ich kenne seine Neigung, wie sie sich heute zeigt[c], noch bevor ich ihn in das Land bringe, das ich zu geben geschworen habe[d].
  rationale: Die Revision glättet die deutsche Syntax, wahrt die Pluralität der widrigen Ereignisse und stellt die enge hebräische Verbindung zwischen Israels Neigung und seinem gegenwärtigen Verhalten wieder her. Sie vermeidet zudem die nicht ausdrücklich genannte Ergänzung „ihm“ beim Schwur. Die forensische Funktion des Liedes wird verständlich wiedergegeben, während die im Hebräischen mögliche Nuance von „vor“ beziehungsweise „gegen“ in der Fußnote erhalten bleibt.
