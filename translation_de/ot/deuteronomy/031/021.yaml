source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: de
  text: Wenn ihn viele Unglücke und Bedrängnisse treffen[a], wird dieses Lied vor ihm als Zeuge aussagen[b]; denn es wird aus dem Mund seiner Nachkommen nicht in Vergessenheit geraten. Denn ich kenne seine Neigung, wie sie sich heute zeigt[c], noch bevor ich ihn in das Land bringe, das ich zu geben geschworen habe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn finden“ beziehungsweise „ihn ereilen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor ihm als Zeuge antworten“. „Vor ihm“ kann im Zusammenhang auch die Bedeutung „gegen ihn“ annehmen, weil das Lied als belastender Zeuge auftritt.'
    reason: lexical_and_syntactic_clarification
  - marker: c
    text: „Neigung“ bezeichnet Israels innere Ausrichtung, Absicht oder seinen Hang. Der hebräische Wortlaut verbindet sie knapp mit dem, was Israel heute tut.
    reason: lexical_and_syntactic_clarification
  - marker: d
    text: 'Wörtlich steht nur: „das ich geschworen habe“. „Zu geben“ ist aus der Bundesverheißung und dem Zusammenhang ergänzt.'
    reason: implicit_information
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn dann
  rationale: Gibt die hebräische zeitliche Zukunftsformel natürlich wieder, ohne das schwerfällige „Und es wird geschehen, wenn“.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: über ihn kommen
  rationale: Das Verb bezeichnet hier das Eintreffen beziehungsweise Überkommen widriger Ereignisse; die Alternative „ihn ereilen“ wird in der Fußnote bewahrt.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: viel Unheil und Bedrängnis
  rationale: רָעוֹת meint in diesem Zusammenhang schlimme Ereignisse und nicht moralisch Böses; die kollektive Formulierung klingt im modernen Deutsch natürlich.
- source_word: וְעָנְתָה
  choice: wird … antworten
  rationale: Bewahrt das konkrete Bild des hebräischen Verbs ענה („antworten“); die anschließende Wendung „als Zeuge“ verdeutlicht seine forensische Funktion.
- source_word: לְפָנָיו לְעֵד
  choice: vor ihm als Zeuge
  rationale: „Vor ihm“ gibt לְפָנָיו formal wieder, während „als Zeuge“ die Beweisfunktion des Liedes ausdrückt, ohne „gegen ihn“ stillschweigend festzulegen.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: es wird im Mund seiner Nachkommen nicht in Vergessenheit geraten
  rationale: Erhält das Bild vom Mund und damit den Gedanken der mündlichen Weitergabe; זרע ist hier kollektiv als „Nachkommen“ wiedergegeben.
- source_word: יִצְרוֹ
  choice: seine Neigung
  rationale: Bezeichnet die innere Ausrichtung, Absicht oder den Hang. „Neigung“ wahrt die moralisch-volitionale Bedeutung, ohne eine spätere dogmatische Kategorie einzutragen.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: und weiß, was er heute schon tut
  rationale: Eine verständliche deutsche Wiedergabe der knappen und syntaktisch schwierigen Verbindung zwischen Israels innerer Neigung und seinem gegenwärtigen Tun.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבָּעְתִּי
  choice: in das Land …, das ich ihm zugeschworen habe
  rationale: „Zugeschworen“ gibt die elliptische hebräische Bundesformel idiomatisch wieder; das indirekte Objekt ist aus dem Zusammenhang erschlossen und wird in der Fußnote offengelegt.
theological_decisions:
- issue: Gottes Kenntnis von Israels יֵצֶר vor dem Einzug ins Land
  choice: seine Neigung
  alternative: sein Trachten / seine Absicht / sein Sinnen
  rationale: Die Übersetzung hält Gottes Vorwissen und Israels gegenwärtiges verantwortliches Handeln nebeneinander, ohne daraus eine weitergehende Lehre über Determinismus oder eine bestimmte Anthropologie abzuleiten.
- issue: Funktion des Liedes als Zeuge
  choice: vor ihm als Zeuge antworten
  alternative: gegen ihn Zeugnis ablegen
  rationale: Die Hauptfassung bewahrt sowohl das Antwortmotiv von ענה als auch die wörtliche räumliche Formulierung לְפָנָיו. Die mögliche belastende Bedeutung „gegen ihn“ bleibt als kontextuelle Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das durchgehend männliche Singularpronomen „ihn/er“ folgt dem Hebräischen, das Israel als kollektive Einzelperson anspricht. Die ungewöhnliche Personifikation des Liedes als antwortender Zeuge wurde bewusst erhalten.
