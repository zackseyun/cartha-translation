    rationale: Die Verbindung bezeichnet sorgfältiges Achten auf bzw. Bewahren mit dem Ziel des Tuns. „Darauf achten, ... zu befolgen“ gibt diesen Sinn im modernen Deutschen unmittelbarer wieder.
