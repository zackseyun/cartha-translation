- from: Versammle das Volk – die Männer, die Frauen, die kleinen Kinder und den Fremden, der in deinen Städten lebt[a] –, damit sie hören und lernen, Jahwe, euren Gott, zu fürchten[b] und gewissenhaft nach allen Worten dieser Weisung zu handeln[c].
  to: Versammle das Volk – die Männer, die Frauen, die kleinen Kinder und den Fremden, der in deinen Toren lebt[a] –, damit sie hören, damit sie lernen, Jahwe, euren Gott, zu fürchten[b] und darauf zu achten, alle Worte dieser Weisung zu befolgen[c].
  rationale: 'Die Revision bewahrt die hebräische Tor-Metonymie im Haupttext und verlegt ihre kulturelle Erklärung in die Fußnote. Ferner wird die Formel וְשָׁמְרוּ לַעֲשׂוֹת mit einer natürlichen deutschen Formulierung wiedergegeben, die sowohl sorgfältige Beachtung als auch tatsächliches Befolgen ausdrückt. Die unterschiedliche Anrede im Hebräischen bleibt erhalten: „deinen Toren“ und „euren Gott“.'
