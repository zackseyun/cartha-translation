  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: de
  text: Versammle das Volk – die Männer, die Frauen, die kleinen Kinder und den Fremden, der in deinen Toren lebt[a] –, damit sie hören, damit sie lernen, Jahwe, euren Gott, zu fürchten[b] und darauf zu achten, alle Worte dieser Weisung zu befolgen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Fremde in deinen Toren“. Gemeint ist ein nicht einheimischer Bewohner, der in den israelitischen Ortschaften beziehungsweise Gemeinschaften ansässig ist.'
    reason: Erläutert גֵר sowie die Ortsidiomatik „in deinen Toren“, ohne sie im Haupttext zu ersetzen.
  - marker: b
    text: 'Oder: „Jahwe, euren Gott, zu verehren“. Das hebräische Verb umfasst Furcht ebenso wie Ehrfurcht und gehorsame Scheu.'
    reason: Erläutert die Bedeutungsbreite von ירא.
  - marker: c
    text: 'Oder: „alle Worte dieses Gesetzes“. Das hebräische Wort Tora kann „Weisung“, „Unterweisung“ oder „Gesetz“ bedeuten.'
    reason: Dokumentiert die lexikalische Alternative für תּוֹרָה im Bundeszusammenhang.
lexical_decisions:
- source_word: הַקְהֵל אֶת הָעָם
  choice: Versammle das Volk
  rationale: Der Hifil-Imperativ fordert dazu auf, das ganze Volk als Versammlung zusammenzubringen. „Versammle“ ist präzise, natürlich und bewahrt den förmlichen Charakter des Aufrufs.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: die Männer, die Frauen, die kleinen Kinder
  rationale: Die ausdrücklich genannten Gruppen werden einzeln wiedergegeben. טַף bezeichnet häufig kleine Kinder beziehungsweise die abhängigen Kleinen.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: und den Fremden, der in deinen Städten lebt
  rationale: גֵר bezeichnet einen nicht einheimischen, dauerhaft unter Israel lebenden Bewohner. „In deinen Städten“ gibt die deuteronomische Wendung „in deinen Toren“ verständlich wieder; der Singular „deinen“ in גֵרְךָ wird durch „der … lebt“ sachlich mitgetragen.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: damit sie hören und lernen
  rationale: Die beiden Zweckangaben bleiben erkennbar, ohne die im Deutschen schwerfällige Wiederholung von „damit“ zwingend nachzubilden. „Hören“ bewahrt den wichtigen deuteronomischen Zusammenhang von Hören und Gehorsam.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euren Gott, zu fürchten
  rationale: ירא umfasst in diesem Bundeszusammenhang Furcht, Ehrfurcht und gehorsame Anerkennung. „Fürchten“ wahrt die direkte und spannungsreiche Aussage des Hebräischen. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: und gewissenhaft … zu handeln
  rationale: Die Verbindung von שמר mit dem Infinitiv bezeichnet sorgfältiges Beachten mit dem Ziel tatsächlichen Tuns. „Gewissenhaft … handeln“ ist idiomatisches modernes Deutsch und erhält diesen Handlungsaspekt.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: nach allen Worten dieser Weisung
  rationale: דִּבְרֵי wird konkret mit „Worten“ wiedergegeben. תּוֹרָה kann sowohl Gesetz als auch Unterweisung/Weisung bezeichnen; „Weisung“ wahrt diese semantische Breite, während die Fußnote auf „Gesetz“ als mögliche kontextuelle Wiedergabe hinweist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ירא
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ bewahrt die unmittelbare Formulierung und die theologische Spannung; eine Fußnote erläutert, dass ehrfürchtige, gehorsame Haltung eingeschlossen ist.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: תּוֹרָה bezeichnet göttliche Unterweisung und kann im Bundeskontext auch „Gesetz“ heißen. „Weisung“ vermeidet eine vorschnelle Verengung, während die Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Aufzählung der Bevölkerungsgruppen und die Folge von Hören, Lernen, Gottesfurcht und Tun bleiben erhalten. Die antike Tor-Idiomatik wird im Haupttext verständlich als „Städte“ wiedergegeben und in der Fußnote transparent gemacht.
