  source_fidelity: Die militärische Wendung וּנְתָנָם יְהוָה לִפְנֵיכֶם ist mit „wird sie euch ausliefern“ kontextgerecht wiedergegeben. וַעֲשִׂיתֶם לָהֶם verlangt „mit ihnen verfahren/ihnen tun“ und ist treffend erfasst. Die Relativklausel אֲשֶׁר צִוִּיתִי אֶתְכֶם bedeutet jedoch „das ich euch geboten habe“, nicht lediglich „gegeben habe“; letztere Formulierung schwächt den expliziten Befehlscharakter von צוה ab.
  naturalness: „Mit ihnen ... verfahren“ und „ausliefern“ sind natürliches modernes Standarddeutsch in einem würdigen Bibelregister. „Gemäß dem ganzen Gebot“ bewahrt sowohl den bestimmten Singular als auch die durch כְּכָל ausgedrückte Ganzheit klarer als „ganz nach dem Gebot“.
  terminology: „der HERR“ ist als Wiedergabe des Tetragramms konsistent mit verbreiteter deutscher Bibelkonvention. „Gebot“ gibt מִצְוָה im Singular angemessen wieder. „Geboten habe“ erhält die Terminologie und die Verbindlichkeit des hebräischen Verbs צִוָּה.
