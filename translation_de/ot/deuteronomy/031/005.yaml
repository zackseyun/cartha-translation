  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: de
  text: Und der HERR wird sie euch ausliefern, und ihr sollt mit ihnen gemäß dem ganzen Gebot verfahren, das ich euch geboten habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: Und der HERR wird sie euch ausliefern
  rationale: נתן לפני bezeichnet hier im militärischen Zusammenhang das Preisgeben bzw. Ausliefern der feindlichen Völker in Israels Gewalt. „Euch ausliefern“ gibt die Wendung natürlich und kontextgerecht wieder; das Tetragramm wird nach verbreiteter deutscher Bibelkonvention als „der HERR“ gesetzt.
- source_word: וַעֲשִׂיתֶם לָהֶם
  choice: und ihr sollt mit ihnen … verfahren
  rationale: Die wörtliche Wendung „ihnen tun“ bedeutet hier, entsprechend einer Anweisung mit ihnen zu handeln. „Mit ihnen verfahren“ ist idiomatisches, würdevolles Deutsch.
- source_word: כְּכָל־הַמִּצְוָה
  choice: ganz nach dem Gebot
  rationale: כְּכָל betont die vollständige Übereinstimmung mit der Weisung. Der Singular מצוה wird als „dem Gebot“ bewahrt.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: das ich euch gegeben habe
  rationale: Bei „Gebot“ ist „ein Gebot geben“ im modernen Deutschen natürlicher als „ein Gebot gebieten“; der verpflichtende Sinn von צוה bleibt erhalten.
theological_decisions:
- issue: Referenz des Gebots
  choice: Der Singular „dem Gebot“ bleibt ohne nähere Erläuterung stehen.
  alternative: „nach allen Weisungen“ oder ausdrücklicher Verweis auf frühere Banngebote
  rationale: Der hebräische Text verwendet den Singular הַמִּצְוָה und erläutert seinen Inhalt in diesem Vers nicht. Eine Konkretisierung würde Kontextwissen in den Wortlaut eintragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Register. Die militärische Aussage wird präzise, aber ohne erklärende Zusätze wiedergegeben.
