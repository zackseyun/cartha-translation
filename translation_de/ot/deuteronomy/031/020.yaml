  naturalness: Die Konstruktion „Es wird essen, satt und wohlgenährt werden“ wirkt im modernen Standarddeutsch ungeschmeidig. „… wird essen, satt werden und fett werden“ bildet die hebräische Reihung klar ab. Die getrennten Hauptsätze machen die markanten Numeruswechsel verständlich und natürlich lesbar.
  terminology: „Andere Götter“, „ihnen dienen“, „mich verachten“ und „meinen Bund brechen“ sind sachgerecht. „Unter Eid zugesagt“ gibt die Schwurformulierung idiomatisch wieder, ohne den Gehalt zu erweitern.
