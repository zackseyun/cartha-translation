  to: Denn wenn ich es in das Land bringe, das ich seinen Vätern unter Eid zugesagt habe[a], ein Land, in dem Milch und Honig fließen, wird es essen, satt werden und fett werden. Dann wird es sich anderen Göttern zuwenden; sie werden ihnen dienen und mich verachten; es wird meinen Bund brechen.
