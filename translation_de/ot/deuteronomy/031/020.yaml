  - severity: medium
    issue: Die Fußnote beschreibt den Numeruswechsel unzutreffend.
    rationale: Sie setzt den Wechsel erst bei „sie werden mich verachten“ an, obwohl er bei „sie werden ihnen dienen“ beginnt. Die Rückkehr zum Singular beim Bundesbruch sollte ebenfalls textlich sichtbar sein.
