  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: de
  text: Denn wenn ich es in das Land bringe, das ich seinen Vätern unter Eid zugesagt habe[a], ein Land, in dem Milch und Honig fließen, wird es essen, satt werden und fett werden. Dann wird es sich anderen Göttern zuwenden; sie werden ihnen dienen und mich verachten; es wird meinen Bund brechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wird Israel zunächst im kollektiven Singular bezeichnet („es“). Bei „sie werden ihnen dienen“ und „mich verachten“ wechselt der Text in den Plural; bei „es wird meinen Bund brechen“ kehrt er zum Singular zurück.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Warnung ein; die zeitliche Abfolge wird im Deutschen durch die folgenden Futurformen deutlich.
- source_word: אֲבִיאֶנּוּ
  choice: ich werde es … bringen
  rationale: Das maskuline Singularobjekt bezeichnet Israel kollektiv. Da „Israel“ im Deutschen grammatisch sächlich ist, bewahrt „es“ den kollektiven Singular natürlich.
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: Gemeint ist im Zusammenhang das verheißene Land, nicht bloß Erdboden oder Ackerland.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: das ich seinen Vätern zugeschworen habe
  rationale: „Zuschwören“ gibt die Verbindung von Schwur und zugesagtem Land idiomatisch wieder; „seinen Vätern“ erhält den kollektiven Singular und die konkrete Bundesformulierung.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Natürliche deutsche Wiedergabe des festen Bildes für Fruchtbarkeit und Überfluss.
- source_word: וְשָׂבַע וְדָשֵׁן
  choice: satt und wohlgenährt werden
  rationale: „Satt“ wahrt die Bedeutung von שׂבע; „wohlgenährt“ erhält das körperliche Bild von דשׁן, ohne im Deutschen unnötig spöttisch zu klingen.
- source_word: וּפָנָה אֶל
  choice: wird es sich … zuwenden
  rationale: Bewahrt das Bild einer Hinwendung und damit des Wechsels der religiösen Loyalität.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Entspricht unmittelbar dem hebräischen „andere“; „fremde Götter“ wäre stärker auslegend.
- source_word: וַעֲבָדוּם
  choice: ihnen dienen
  rationale: „Dienen“ erhält die umfassende Sprache religiöser und bundeshafter Loyalität; im Kontext schließt dies Verehrung ein.
- source_word: וְנִאֲצוּנִי
  choice: sie werden mich verachten
  rationale: Das Verb bezeichnet verächtliche Missachtung. Die Pluralform wird ausdrücklich beibehalten.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: meinen Bund brechen
  rationale: Gibt den Bundesbruch klar und idiomatisch wieder; die hebräische Verbform kehrt zum kollektiven Singular zurück, der im Deutschen in der koordinierten Form nicht nochmals sichtbar markiert werden kann.
theological_decisions:
- issue: Wechsel zwischen kollektivem Singular und Plural bei Israel
  choice: Den kollektiven Singular mit „es“ bewahren und den eindeutigen Plural bei „sie werden mich verachten“ sichtbar machen.
  alternative: Alle Bezüge einheitlich pluralisch oder einheitlich singularisch wiedergeben.
  rationale: Der hebräische Text behandelt Israel zunächst als ein Volk im Singular, wechselt bei וְנִאֲצוּנִי aber ausdrücklich in den Plural und kehrt bei וְהֵפֵר zum Singular zurück. Die Übersetzung glättet diesen bedeutsamen Wechsel nicht stillschweigend; die Fußnote erläutert die grammatische Spannung.
- issue: Sprache des Bundesbruchs und der Hinwendung zu anderen Göttern
  choice: Die konkreten Handlungen „sich anderen Göttern zuwenden“, „ihnen dienen“, „mich verachten“ und „meinen Bund brechen“ übersetzen.
  alternative: Zusammenfassende Begriffe wie „Götzendienst treiben“ oder „vom Glauben abfallen“ verwenden.
  rationale: Die konkreten Aussagen des Ausgangstextes bleiben stehen, ohne zusätzliche konfessionelle oder systematisch-theologische Terminologie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Bezug auf Israel wird mit dem grammatisch natürlichen Neutrum „es“ wiedergegeben. Das konkrete Bild des Wohlgenährtseins bleibt erhalten; der auffällige Numeruswechsel wird im Text soweit möglich sichtbar gemacht und in der Fußnote erklärt.
