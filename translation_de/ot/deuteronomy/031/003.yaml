  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: de
  text: Jahwe, dein Gott, er selbst zieht vor dir hinüber.[a] Er selbst wird diese Völker vor dir vernichten, und du wirst sie verdrängen.[b] Josua selbst zieht vor dir hinüber, wie Jahwe gesagt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geht vor dir her“ beziehungsweise „wird vor dir hinüberziehen“. Das hebräische Partizip kann eine andauernde, unmittelbar bevorstehende oder als gewiss dargestellte künftige Handlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du wirst sie in Besitz nehmen“. Das hebräische Verb kann im Zusammenhang der Landnahme das Inbesitznehmen einschließen, indem die bisherigen Bewohner verdrängt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Konstruktform mit Suffix der 2. Person Singular bezeichnet in der Bundesanrede „dein Gott“.
- source_word: הוּא
  choice: er selbst / selbst
  rationale: Das selbstständige Pronomen trägt hier Nachdruck. Dieser wird sowohl bei Jahwe als auch bei Josua bewahrt.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: zieht vor dir hinüber
  rationale: Das Partizip kann eine gegenwärtige, unmittelbar bevorstehende oder gewisse künftige Handlung ausdrücken. „Hinüberziehen“ wahrt im Zusammenhang den Bezug zum bevorstehenden Übergang, während „vor dir“ das Vorausgehen ausdrückt.
- source_word: יַשְׁמִיד
  choice: wird vernichten
  rationale: Der Hifil von שׁמד bezeichnet das Herbeiführen von Vernichtung; „vernichten“ ist stark, verständlich und lexikalisch angemessen.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: גּוֹיִם bezeichnet hier die ethnisch-politischen Völker Kanaans; im Deutschen ist „Völker“ natürlicher als „Nationen“.
- source_word: מִלְּפָנֶיךָ
  choice: vor dir
  rationale: Die deutsche Wendung gibt die räumliche Entfernung aus Israels Weg idiomatisch wieder, ohne den Satz unnötig zu beschweren.
- source_word: וִירִשְׁתָּם
  choice: du wirst sie verdrängen und ihr Land in Besitz nehmen
  rationale: ירשׁ verbindet im Eroberungskontext häufig das Inbesitznehmen mit der Verdrängung der bisherigen Bewohner. Die zweigliedrige Wiedergabe macht beide Aspekte verständlich; „ihr Land“ ist eine kontextuell erschlossene Ergänzung und wird deshalb durch eine Fußnote kenntlich gemacht.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: wie Jahwe gesagt hat
  rationale: דִּבֶּר bedeutet „reden/sagen“. „Gesagt hat“ ist natürliches modernes Deutsch und vermeidet die interpretierende Festlegung auf „versprochen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zusammenspiel göttlichen und menschlichen Handelns
  choice: Den Nachdruck sowohl bei Jahwe als auch bei Josua bewahren
  alternative: Das betonte הוּא jeweils nur mit einem unbetonten „er“ wiedergeben
  rationale: Der Vers stellt Jahwes vorausgehendes und entscheidendes Handeln neben Josuas von Gott angekündigtes Vorausgehen. Die wiederholte Betonung bleibt erhalten, ohne das Verhältnis beider Handlungsträger über den Text hinaus zu erklären.
- issue: Bedeutungsumfang von ירשׁ im Landnahmekontext
  choice: Verdrängung und Inbesitznahme gemeinsam ausdrücken
  alternative: nur „sie vertreiben“ oder nur „sie/ihr Land in Besitz nehmen“
  rationale: Das Verb kann hier beide eng verbundenen Seiten der Landnahme bezeichnen. Die Übersetzung wahrt diese Spannung, statt sich stillschweigend auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular („dein“, „dir“, „du“) bleibt erhalten, da Mose Israel als kollektives Gegenüber anspricht. Die Wiederholung „er selbst / selbst“ bildet den Nachdruck des Hebräischen ab; der Gottesname erscheint konsequent als „Jahwe“.
