  naturalness: „Jahwe, dein Gott, er selbst“ ist als emphatische, würdige Anrede verständlich. „Du wirst sie verdrängen“ ist modernes, natürliches Deutsch und gibt im Kontext die Bedeutung von ירשׁ mit direktem Personen-/Völkerobjekt angemessen wieder.
  terminology: „Jahwe“, „Josua“ und „Völker“ sind konsistent und standardsprachlich. Die wiederholte Hervorhebung mit „selbst“ bewahrt den Nachdruck von הוּא. Die Fußnote zu ירשׁ soll die Alternative des Inbesitznehmens nennen, ohne aus dem Objekt „sie“ ausdrücklich „ihr Land“ zu machen.
