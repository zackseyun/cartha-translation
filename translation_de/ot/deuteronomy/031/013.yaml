source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: de
  text: Und ihre Kinder[a], die es noch nicht kennen, sollen zuhören und lernen, Jahwe[b], euren Gott, zu fürchten, solange ihr in dem Land lebt, in das ihr über den Jordan zieht, um es in Besitz zu nehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Söhne«. Das hebräische Wort kann männliche Nachkommen im engeren Sinn oder Kinder beziehungsweise Nachkommen allgemein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »um es zu erben«. Das hebräische Verb kann sowohl das Erben als auch die Inbesitznahme bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: Und ihre Kinder
  rationale: בנים kann enger »Söhne« oder weiter »Kinder/Nachkommen« bezeichnen. Im Zusammenhang der Unterweisung der nächsten Generation ist »Kinder« sachlich angemessen und im Deutschen natürlich.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: die es noch nicht kennen
  rationale: Das Perfekt von ידע bezeichnet hier fehlende bisherige Kenntnis bzw. Erfahrung. Das im Deutschen nötige Objekt »es« ergibt sich aus dem vorausgehenden Zusammenhang, nämlich der verlesenen Weisung; »noch« macht die zeitliche Perspektive idiomatisch deutlich, ohne den Sinn festzulegen.
- source_word: יִשְׁמְעוּ
  choice: sollen zuhören
  rationale: שמע bedeutet sowohl hören als auch aufmerksam zuhören. Im Kontext einer öffentlichen Verlesung gibt »zuhören« die beabsichtigte Aufnahme wieder; »sollen« bildet den zweckbezogenen bzw. verpflichtenden Zukunftssinn ab.
- source_word: וְלָמְדוּ
  choice: und lernen
  rationale: Die Form setzt die Folge bzw. den Zweck des Hörens fort. Die knappe deutsche Koordination bewahrt den hebräischen Ablauf.
- source_word: לְיִרְאָה
  choice: zu fürchten
  rationale: ירא bezeichnet im Deuteronomium die ehrfürchtige, gehorsame Gottesfurcht. »fürchten« bewahrt die theologische Spannung besser als das abschwächende »verehren«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die Pluralanrede wird direkt und idiomatisch als »euren Gott« wiedergegeben.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: solange ihr … lebt
  rationale: Die idiomatische Wendung gibt die gesamte Lebensdauer wieder, die das Hebräische wörtlich als »alle Tage, die ihr lebt« ausdrückt.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: אדמה bezeichnet hier das von Israel zu bewohnende Land. Im Deutschen ist »in dem Land leben« natürlicher als das formal nähere »auf dem Land leben«, das zudem als Gegensatz zur Stadt missverstanden werden könnte.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: in das ihr über den Jordan zieht
  rationale: שמה drückt die Richtung dorthin aus; der Relativsatz mit »in das« macht das Ziel im Deutschen klar. »über den Jordan ziehen« ist für den Übergang eines Volkes idiomatisch.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירשׁ umfasst hier das Erlangen und Besitzen des verheißenen Landes. »in Besitz nehmen« bewahrt die aktive Besitzergreifung; »erben« wäre möglich, könnte diesen Aspekt aber abschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Transliteration bewahrt den persönlichen Bundesnamen, während »der HERR« eine traditionelle Ersatzlesung ist.
- issue: Bedeutungsumfang von בנים
  choice: Kinder
  alternative: Söhne
  rationale: Im Zusammenhang der generationenübergreifenden Bundesunterweisung ist die nächste Generation insgesamt gemeint. »Kinder« wahrt diesen möglichen weiteren Umfang, ohne den Ausdruck auf männliche Nachkommen zu verengen.
- issue: Bedeutung von Gottesfurcht
  choice: zu fürchten
  alternative: zu verehren
  rationale: »fürchten« lässt sowohl Ehrfurcht als auch die ernsthafte Verpflichtung gegenüber Gott stehen und löst die im hebräischen ירא enthaltene Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Pluralanrede. »Zuhören«, »solange« und »in Besitz nehmen« sind allgemein verständlich; die traditionelle theologische Ausdruckskraft von »Jahwe … fürchten« bleibt erhalten.
