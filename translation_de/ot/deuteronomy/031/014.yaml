source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: »Sieh, deine Zeit zu sterben ist nahe. Ruf Josua, und findet euch im Zelt der Begegnung ein, damit ich ihm Weisung gebe[a].« Da gingen Mose und Josua hin und fanden sich im Zelt der Begegnung ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »damit ich ihn beauftrage« oder »und ich werde ihm Weisung geben«. Das hebräische Verb kann befehlen, Weisung geben oder jemanden mit einer Aufgabe betrauen; die Satzverknüpfung kann einen Zweck oder eine anschließende Aussage ausdrücken.'
    reason: Bewahrt die lexikalische Spannweite von צוה und die mögliche syntaktische Deutung der mit ו eingeleiteten Verbform.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt das Tetragramm als Eigennamen, statt es durch einen Titel zu ersetzen.
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird in gehobenem, aber verständlichem Gegenwartsdeutsch wiedergegeben.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: die Zeit, da du sterben musst, ist nahe
  rationale: Gibt den Sinn der hebräischen Wendung natürlich wieder und bewahrt sowohl die Nähe des Todes als auch dessen Unausweichlichkeit.
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: Ruf Josua
  rationale: Entspricht dem schlichten Imperativ und klingt im Deutschen unmittelbar und natürlich.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: stellt euch auf / stellten sich auf
  rationale: Bewahrt die Vorstellung, dass Mose und Josua an dem bestimmten Ort vor Jahwe ihren Platz einnehmen, und gibt beide Vorkommen konsistent wieder.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Gibt die feste Bezeichnung des Heiligtums verständlich wieder und folgt der hebräischen Ortsangabe.
- source_word: וַאֲצַוֶּנּוּ
  choice: damit ich ihn beauftrage
  rationale: Im Zusammenhang der bevorstehenden Nachfolge Josuas bezeichnet das Verb eine verbindliche göttliche Weisung beziehungsweise Beauftragung; eine Fußnote hält die lexikalischen und syntaktischen Alternativen offen.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: Da gingen Mose und Josua hin
  rationale: Gibt die fortschreitende Erzählung und die unmittelbare Ausführung des Befehls idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von צוה bei Josuas Einsetzung
  choice: beauftrage
  alternative: ihm befehle / ihm Weisung gebe
  rationale: Der Kontext spricht für eine förmliche göttliche Beauftragung Josuas, doch kann das Verb auch allgemeiner »befehlen« oder »Weisung geben« bedeuten; diese Spannung wird in der Fußnote kenntlich gemacht.
- issue: Verhältnis von וַאֲצַוֶּנּוּ zum vorhergehenden Imperativ
  choice: damit ich ihn beauftrage
  alternative: und ich werde ihn beauftragen
  rationale: Die deutsche Zweckkonstruktion passt zum Zusammenhang, während die hebräische Koordination auch als anschließende Zukunftsaussage verstanden werden kann; die Fußnote nennt diese Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist natürlich, bleibt jedoch nahe an der hebräischen Erzählstruktur. Der Gottesname wird als »Jahwe« wiedergegeben; die kultische Bezeichnung lautet durchgehend »Zelt der Begegnung«.
