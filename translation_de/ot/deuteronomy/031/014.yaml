review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Handlungsablauf, die Anrede und die kultische Ortsbezeichnung insgesamt zutreffend wieder. »musst« fügt jedoch zur hebräischen Aussage über das Nahen des Todes eine Modalität der Notwendigkeit hinzu. »sich aufstellen« ist für התיצב in diesem Kontext unnötig körperlich bzw. militärisch gefärbt; gemeint ist das förmliche Erscheinen. Bei ואצוננו ist die Bedeutung zwischen Weisung/Anweisung und förmlicher Beauftragung offen zu halten.
  naturalness: »Die Zeit, da du sterben musst« wirkt leicht gehoben und durch »musst« stärker als der Ausgangstext. »Findet euch … ein« bzw. »fanden sich … ein« ist modernes, würdiges Standarddeutsch und passt zum formellen Erscheinen am Zelt der Begegnung.
  terminology: »Jahwe«, »Mose«, »Josua« und »Zelt der Begegnung« sind konsistent und sachgerecht. Für צוה ist »Weisung geben« als Haupttext weniger einengend als »beauftragen«; die Fußnote dokumentiert die mögliche Lesart einer Beauftragung sowie die syntaktische Alternative.
  issues:
  - severity: medium
    issue: »da du sterben musst«
    rationale: Das hebräische למות nennt das Sterben, ohne ausdrücklich ein deutsches Modalverb der Notwendigkeit zu setzen. Die Formulierung sollte diese zusätzliche Nuance vermeiden.
  - severity: low
    issue: »stellt euch … auf« / »stellten sich … auf«
    rationale: Die Wiedergabe kann im Deutschen eine Aufstellung oder Formation nahelegen. Der Kontext verlangt vielmehr ein förmliches Sich-Einfinden bzw. Erscheinen.
  - severity: low
    issue: Haupttext »damit ich ihn beauftrage«
    rationale: Die kontextuell mögliche förmliche Beauftragung ist nicht die einzige lexikalische oder syntaktische Deutung von צוה. Ein neutraleres »ihm Weisung gebe« wahrt die Offenheit, während die Fußnote die Alternativen nennt.
