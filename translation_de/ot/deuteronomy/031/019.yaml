id: DEU.31.19
reference: Deuteronomy 31:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: de
  text: Und nun schreibt euch dieses Lied auf[a]; lehre es die Israeliten[b] und lege es ihnen in den Mund, damit dieses Lied mir zum Zeugen gegen die Israeliten[c] wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „schreibt“ im Plural; die folgenden Aufforderungen „lehre“ und „lege“ stehen im Singular.
    reason: textual_grammar
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“; gemeint ist das Volk Israel. Ebenso am Ende des Verses.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unter den Israeliten“. Im Zusammenhang ist wahrscheinlich gemeint, dass das Lied als Zeuge gegen sie auftritt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch וְ als auch den zeitlichen und dringlichen Übergang durch עַתָּה.
- source_word: כִּתְבוּ לָכֶם
  choice: schreibt euch dieses Lied auf
  rationale: Der Plural des Imperativs und die dativisch-reflexive Wendung לָכֶם bleiben erhalten. „Aufschreiben“ ist im modernen Deutschen die natürliche Bezeichnung für das schriftliche Festhalten.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: dieses Lied
  rationale: שִׁירָה bezeichnet hier unmittelbar ein Lied; die poetische Form rechtfertigt keine Abschwächung zu „Gedicht“.
- source_word: וְלַמְּדָהּ
  choice: lehre es
  rationale: Der folgende Imperativ steht anders als כִּתְבוּ im Singular. Das feminine Suffix bezieht sich auf das grammatisch feminine שִׁירָה und wird im Deutschen sachgerecht mit „es“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung schließt hier das ganze Bundesvolk ein. Die formnähere Wendung „Söhne Israels“ wird in einer Fußnote genannt.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: lege es ihnen in den Mund
  rationale: Bewahrt das konkrete hebräische Bild dafür, dass das Lied gelernt und gesprochen beziehungsweise gesungen werden soll, ohne es erklärend auf „auswendig lernen“ zu verengen.
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweckbeziehung knapp und natürlich wieder.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: mir zum Zeugen wird
  rationale: Die deutsche Fügung „jemandem zum Zeugen werden“ bildet sowohl לִי als auch לְעֵד prägnant ab und bewahrt die personifizierende Funktion des Liedes.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: gegen die Israeliten
  rationale: Im gerichtlichen und bundesbezogenen Zusammenhang bezeichnet בְּ wahrscheinlich diejenigen, gegen die das Lied Zeugnis ablegt. Die räumlichere Möglichkeit „unter“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Numeruswechsel zwischen den Aufforderungen
  choice: „schreibt euch“ im Plural, danach „lehre“ und „lege“ im Singular
  alternative: Alle Aufforderungen einheitlich im Singular oder Plural wiedergeben
  rationale: Der masoretische Text wechselt tatsächlich vom pluralischen כִּתְבוּ zu den singularischen Formen וְלַמְּדָהּ und שִׂימָהּ. Eine Angleichung würde eine echte Spannung des Ausgangstextes verdecken.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet in diesem Zusammenhang das gesamte Volk Israel. Das natürliche deutsche Ethnonym vermeidet den möglichen Fehlschluss, nur männliche Personen seien gemeint; die wörtliche Form bleibt per Fußnote zugänglich.
- issue: Funktion des Liedes als Zeuge
  choice: gegen die Israeliten
  alternative: unter den Israeliten
  rationale: Der Kontext der angekündigten Untreue und des Bundeszeugnisses spricht für eine belastende, adversative Funktion. Da die Präposition auch räumlich verstanden werden kann, wird diese Alternative ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffällige Wechsel vom pluralischen zum singularischen Imperativ wird nicht geglättet. Das Bild „in den Mund legen“ und die Personifizierung des Liedes als Zeuge bleiben erhalten.
