  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: de
  text: 'Dann rief Mose Josua und sagte vor den Augen ganz Israels zu ihm: „Sei stark und mutig! Denn du wirst mit diesem Volk in das Land kommen[a], das Jahwe ihren Vätern zu geben geschworen hat, und du wirst es ihnen als Erbe zuteilen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn du wirst dieses Volk in das Land führen.“ Die hebräische Formulierung kann bedeuten, dass Josua mit dem Volk hineingeht, oder dass er es hineinführt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier das Herbeirufen Josuas; „rief“ ist im Deutschen natürlich und wahrt den Erzählstil.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: vor den Augen ganz Israels
  rationale: Die konkrete hebräische Wendung wird verständlich wiedergegeben und betont den öffentlichen, sichtbaren Charakter der Beauftragung.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sei stark und mutig
  rationale: Die geläufige deutsche Verbindung gibt die beiden Aufforderungen im Zusammenhang von Führung und bevorstehender Landnahme prägnant wieder.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: du wirst mit diesem Volk … kommen
  rationale: 'Die Formulierung bewahrt die mögliche komitative Bedeutung: Josua kommt zusammen mit dem Volk in das Land. Die alternative kausative Auffassung wird in der Fußnote genannt.'
- source_word: הָאָרֶץ
  choice: das Land
  rationale: „Land“ wahrt den zentralen Bundes- und Verheißungsbegriff des Kontextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Form „Jahwe“ gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לַאֲבֹתָם
  choice: ihren Vätern
  rationale: Die Übersetzung erhält den ausdrücklich männlichen Verwandtschaftsbegriff des hebräischen Textes.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: du wirst es ihnen als Erbe zuteilen
  rationale: Der Hifil von נחל bezeichnet das Zuweisen beziehungsweise Übertragen als Erbbesitz; „als Erbe zuteilen“ ist klar und erhält den Erbgedanken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ macht dies sichtbar und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von תָּבוֹא אֶת הָעָם
  choice: Josua wird mit dem Volk in das Land kommen
  alternative: Josua wird das Volk in das Land führen
  rationale: Die hebräische Konstruktion kann komitativ oder in einem führenden beziehungsweise hineinbringenden Sinn verstanden werden. Der Haupttext wahrt die naheliegende komitative Lesart; die andere Möglichkeit wird ausdrücklich in einer Fußnote erhalten.
- issue: Wiedergabe von אֲבֹתָם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: „Väter“ entspricht der konkreten Wortwahl des Ausgangstextes; „Vorfahren“ wäre eine mögliche, aber verallgemeinernde Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der öffentliche Rahmen wird mit der anschaulichen Wendung „vor den Augen ganz Israels“ bewahrt. Die direkte Rede bleibt knapp und feierlich; theologisches Bundesvokabular wie „Land“ und „Erbe“ wird erhalten.
