base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: de
  text: Und ich selbst werde an jenem Tag mein Gesicht[a] ganz gewiss verbergen wegen all des Bösen, das er getan hat, weil er sich anderen Göttern zugewandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „mein Gesicht“. Diese Wendung kann den Entzug göttlicher Gunst oder Gegenwart bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Und ich selbst
  rationale: Das selbstständige Pronomen אָנֹכִי ist betont; „ich selbst“ bewahrt diesen Nachdruck. וְ wird im Zusammenhang verbindend mit „und“ wiedergegeben.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: werde … ganz gewiss verbergen
  rationale: Der Infinitivus absolutus vor dem finiten Verb verstärkt die Aussage. „ganz gewiss“ gibt diese Bekräftigung in natürlichem Deutsch wieder.
- source_word: פָּנַי
  choice: mein Gesicht
  rationale: Die konkrete hebräische Wendung wird beibehalten, statt sie deutend als Entzug von Gegenwart oder Gunst aufzulösen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der temporalen Fügung mit bewahrter demonstrativer Distanz.
- source_word: עַל כָּל הָרָעָה
  choice: wegen all des Bösen
  rationale: עַל bezeichnet hier den Grund; הָרָעָה meint in diesem Zusammenhang moralisch Böses, nicht bloß Unglück.
- source_word: אֲשֶׁר עָשָׂה
  choice: das es getan hat
  rationale: Das Verb steht im maskulinen Singular und bezieht sich kollektiv auf Israel. Das deutsche Neutrum „es“ entspricht dem grammatischen Geschlecht von „Israel“ und bewahrt den Singular, ohne eine männliche Einzelperson nahezulegen.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet hier eine Begründung ein; „weil“ ist im modernen Deutsch klar und natürlich.
- source_word: פָנָה אֶל
  choice: sich … zugewandt hat
  rationale: Die Wendung bezeichnet eine Hinwendung in Loyalität oder Verehrung. „sich zuwenden“ bewahrt dies, ohne stärker auszudeuten.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Direkte und übliche Wiedergabe für Gottheiten außer dem HERRN.
theological_decisions:
- issue: Anthropomorphe Rede vom göttlichen Rückzug
  choice: „mein Gesicht … verbergen“ im Haupttext beibehalten
  alternative: „meine Gegenwart entziehen“ oder „meine Gunst entziehen“
  rationale: Der hebräische Text verwendet die konkrete Metapher vom Verbergen des Gesichts. Die Übersetzung bewahrt sie und löst die mögliche Bedeutung von Gegenwart oder Gunst nicht dogmatisch auf.
- issue: Israel als kollektiver Singular
  choice: Singular mit dem auf „Israel“ bezogenen Pronomen „es“
  alternative: Plural „sie haben … sie haben sich zugewandt“ oder maskuliner Singular „er“
  rationale: Die hebräischen Verben stehen im Singular und personifizieren Israel als Einheit. Im Deutschen bewahrt „es“ sowohl den kollektiven Singular als auch den natürlichen Bezug auf den Namen „Israel“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Konstruktion und das konkrete Bild des hebräischen Textes bleiben erhalten; der kollektive Singular wird idiomatisch auf „Israel“ bezogen.
