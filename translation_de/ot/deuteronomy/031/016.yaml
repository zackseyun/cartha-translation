  naturalness: Der würdige, moderne Satzbau ist gut verständlich. „Dieses Volk wird aufstehen“ und „in dessen Mitte es einzieht“ sind im Deutschen natürlicher und präziser. „Nachhuren“ ist bewusst markiert und hart, aber als bewahrte kultische Sexualmetapher vertretbar; die Fußnote sollte nicht behaupten, gerade diese deutsche Zusammensetzung stehe wörtlich im Hebräischen.
  terminology: „Jahwe“, „Bund“, „Vorfahren“ und die Beibehaltung des kollektiven Singulars sind angemessen. Die Metapher darf nicht zu bloßer „Untreue“ abgeschwächt werden; die Erklärung als durch Götzendienst ausgedrückte Bundesuntreue ist sachgerecht und nicht konfessionell verengt.
