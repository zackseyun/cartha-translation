source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Sieh, du wirst dich bald zu deinen Vorfahren legen. Dann wird dieses Volk aufstehen und den fremden Göttern des Landes nachhuren[a], in dessen Mitte es einzieht[b]. Es wird mich verlassen und meinen Bund brechen, den ich mit ihm geschlossen habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet eine bewusst scharfe sexuelle Metapher: Das Volk wird den fremden Göttern „nachhuren“. Gemeint ist seine Untreue gegenüber Jahwe durch Götzendienst.'
    reason: Erklärt die Metapher, ohne die zielsprachliche Formulierung unzutreffend als wörtliche deutsche Entsprechung auszugeben.
  - marker: b
    text: 'Der hebräische Text gebraucht für Israel beziehungsweise „dieses Volk“ die Einzahl: „es kommt hinein“ und später „mit ihm“.'
    reason: Macht den kollektiven Singular des Ausgangstextes sichtbar; „einzieht“ gibt das Hineinkommen in das Land idiomatisch wieder.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in der geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: Sieh, du wirst dich bald zu deinen Vorfahren legen
  rationale: Bewahrt das hebräische Bild für den Tod und gibt die unmittelbar bevorstehende Handlung natürlich wieder. „Vorfahren“ ist im heutigen Deutsch inklusiver und verständlicher als das traditionelle „Väter“.
- source_word: וְקָם
  choice: Dann wird sich dieses Volk erheben
  rationale: Gibt den zukünftigen Sinn der Abfolge wieder, ohne bereits ausdrücklich Aufruhr oder Rebellion in das Verb hineinzulesen.
- source_word: וְזָנָה אַחֲרֵי
  choice: den … nachhuren
  rationale: Bewahrt die bewusst anstößige sexuelle Metapher für kultische und bundesbezogene Untreue. Das seltenere, aber verständliche Verb entspricht der Konstruktion mit אַחֲרֵי knapp und kräftig.
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: den fremden Göttern des Landes
  rationale: Verbindet die Götter mit dem Land, in das Israel einzieht, und gibt נֵכַר als Fremdheit wieder.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: in dessen Mitte es hineinzieht
  rationale: 'Bewahrt den kollektiven Singular des hebräischen Textes im Deutschen natürlich: „Volk“ wird mit „es“ aufgenommen; „dessen“ bezieht sich grammatisch auf das Land.'
- source_word: וַעֲזָבַנִי
  choice: Es wird mich verlassen
  rationale: „Verlassen“ ist im modernen Deutsch klar und trägt hier das Gewicht des Bundesbruchs, ohne unnötig altertümlich zu wirken.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: und meinen Bund brechen
  rationale: „Einen Bund brechen“ ist eine natürliche und genaue deutsche Entsprechung für die Verletzung des Bundes.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: den ich mit ihm geschlossen habe
  rationale: Gibt die feste hebräische Wendung כרת ברית idiomatisch als „einen Bund schließen“ wieder und wahrt den kollektiven Singular.
theological_decisions:
- issue: Sexuelle Metapher für Götzendienst
  choice: Die Metapher wird mit „nachhuren“ ausdrücklich bewahrt.
  alternative: „anderen Göttern untreu nachlaufen“ oder „sich anderen Göttern zuwenden“
  rationale: זנה bezeichnet sexuelle Untreue beziehungsweise Hurerei und wird hier metaphorisch auf den Bruch der ausschließlichen Bundesbindung bezogen. Eine bloße Wiedergabe als „untreu sein“ würde die Schärfe des Ausgangstextes abschwächen.
- issue: Kollektiver Singular für Israel
  choice: Der Singular wird mit „dieses Volk … es … ihm“ beibehalten.
  alternative: Pluralische Wiedergabe mit „sie … ihnen“
  rationale: Anders als im Englischen lässt sich der hebräische kollektive Singular im Deutschen grammatisch klar und natürlich wiedergeben. Dadurch bleibt auch der Wechsel der Bezugsformen sichtbar, ohne den Sinn zu verdunkeln.
- issue: Bildhafte Umschreibung des Todes
  choice: „sich zu seinen Vorfahren legen“ bleibt als Bild erhalten.
  alternative: „sterben“
  rationale: Die hebräische Formulierung bezeichnet den Tod in Beziehung zu den Vorfahren. Ihre Bewahrung erhält den feierlichen Ton und vermeidet eine unnötige Verflachung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, bleibt aber gut lesbar. „Jahwe“ wahrt den Eigennamen; „nachhuren“ ist absichtlich kräftig und wird durch eine Fußnote erläutert. Der kollektive Singular wird im Deutschen beibehalten.
