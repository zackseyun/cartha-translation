  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: de
  text: Wenn ganz Israel kommt, um vor Jahwe, deinem Gott, an dem Ort zu erscheinen, den er auswählen wird, sollst du dieses Gesetz vor ganz Israel so vorlesen, dass alle es hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um das Angesicht Jahwes, deines Gottes, zu sehen“. Die Wendung bedeutet in diesem Zusammenhang, in seiner Gegenwart zu erscheinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל יִשְׂרָאֵל
  choice: Wenn ganz Israel kommt
  rationale: ב mit dem Infinitivus constructus leitet einen Temporalsatz ein. Die kollektive Bezeichnung כָל יִשְׂרָאֵל wird formnah und natürlich mit „ganz Israel“ wiedergegeben.
- source_word: לֵרָאוֹת אֶת פְּנֵי
  choice: um vor … zu erscheinen[a]
  rationale: Im Wallfahrts- und Kultzusammenhang bezeichnet die Wendung das Erscheinen in Gottes Gegenwart. Die Fußnote bewahrt die formnahe Bildsprache und die im Hebräischen erkennbare Spannung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Umschrift.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die maskuline Singularform der Anrede an Israel wird direkt bewahrt.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: an dem Ort, den er auswählen wird
  rationale: Die futurische Aussage und das deuteronomische Motiv des von Gott bestimmten Kultortes bleiben erhalten. „Auswählen“ ist gegenwärtiges Standarddeutsch.
- source_word: תִּקְרָא
  choice: sollst du … laut vorlesen
  rationale: קרא bezeichnet mit der Tora als Objekt hier das öffentliche, hörbare Verlesen; „laut vorlesen“ macht diesen Kontext im Deutschen eindeutig.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieses Gesetz
  rationale: In diesem Zusammenhang meint תּוֹרָה die vorliegende Bundesweisung beziehungsweise Gesetzessammlung. „Gesetz“ ist zugänglich und kontextuell passend.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: vor ganz Israel
  rationale: Die Formulierung bezeichnet die öffentliche Verlesung in Gegenwart des versammelten Volkes.
- source_word: בְּאָזְנֵיהֶם
  choice: laut vorlesen
  rationale: Die wörtliche Wendung „in ihren Ohren“ betont die Hörbarkeit. Im Deutschen wird ihre Funktion idiomatisch durch „laut vorlesen“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Umschrift bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von לֵרָאוֹת אֶת פְּנֵי יְהוָה
  choice: vor Jahwe … erscheinen
  alternative: Jahwes Angesicht sehen
  rationale: Der kultische Kontext legt das Erscheinen in Gottes Gegenwart nahe; die alternative, formnahe Lesart wird in der Fußnote offengelegt, ohne die sprachliche Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die singularische Bundesanrede („deinem“, „du“) bleibt erhalten. „Laut vorlesen“ bündelt die öffentliche Rezitation und die hebräische Wendung „in ihren Ohren“ zu einer natürlichen deutschen Formulierung.
