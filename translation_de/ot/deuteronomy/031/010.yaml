base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: de
  text: 'Und Mose gebot ihnen: „Am Ende von jeweils sieben Jahren, zur festgesetzten Zeit des Erlassjahres, am Laubhüttenfest,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: gebot
  rationale: צוה bezeichnet hier eine verbindliche Anordnung; „gebot“ bewahrt deren Nachdruck und passt zum würdevollen Erzählstil.
- source_word: אוֹתָם
  choice: ihnen
  rationale: Das hebräische Akkusativobjekt wird bei deutschem „gebieten“ idiomatisch als Dativ wiedergegeben; der Bezug ergibt sich aus dem Kontext.
- source_word: לֵאמֹר
  choice: Direkte Rede nach Doppelpunkt
  rationale: Die formelhafte Einleitung der direkten Rede muss im heutigen Deutsch nicht eigens mit „und sprach“ oder „folgendermaßen“ wiedergegeben werden.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: Am Ende von jeweils sieben Jahren
  rationale: מִקֵּץ bedeutet „am Ende von“; „jeweils“ macht den im Gesetzeskontext wiederkehrenden Siebenjahreszyklus deutlich, ohne die zeitliche Endgrenze aufzugeben.
- source_word: בְּמוֹעֵד
  choice: zur festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet einen festgelegten Zeitpunkt oder Termin; „festgesetzt“ wahrt diesen Sinn natürlich und präzise.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: im Erlassjahr
  rationale: שְׁמִטָּה bezeichnet den im siebten Jahr vorgesehenen Erlass beziehungsweise die Freilassung; „Erlassjahr“ ist knapp, verständlich und näher am lexikalischen Sinn als „Sabbatjahr“.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: beim Laubhüttenfest
  rationale: „Laubhüttenfest“ ist die im Deutschen geläufige und bildhafte Bezeichnung für חַג הַסֻּכּוֹת.
