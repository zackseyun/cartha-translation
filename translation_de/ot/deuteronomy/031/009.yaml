source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: de
  text: Mose schrieb dieses Gesetz auf und übergab es den Priestern, den Söhnen Levis, als Trägern der Lade des Bundes Jahwes[a], sowie allen Ältesten Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: Die Fußnote nennt die hebräische Namensform und die verbreitete traditionelle Wiedergabe.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb ... auf
  rationale: כתב bezeichnet unmittelbar das Schreiben; das im Deutschen idiomatische „aufschreiben“ verdeutlicht hier, dass Mose den Text schriftlich festhielt.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieses Gesetz
  rationale: תּוֹרָה kann „Weisung“ oder „Gesetz“ bedeuten. Im deuteronomischen Zusammenhang ist der schriftlich niedergelegte Bundes- und Gesetzestext gemeint; „dieses Gesetz“ ist daher natürlich und kontextgerecht.
- source_word: וַיִּתְּנָהּ
  choice: übergab es
  rationale: נתן bedeutet grundsätzlich „geben“. Da Mose einen schriftlich fixierten Text verantwortlichen Amtsträgern anvertraut, gibt „übergeben“ den Vorgang im Deutschen präzise wieder.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: den Priestern, den Söhnen Levis
  rationale: Die appositionale Struktur des Hebräischen bleibt erhalten. „Söhne Levis“ bildet die ausdrückliche Abstammungsbezeichnung ab, statt sie zu „Leviten“ zu verkürzen.
- source_word: הַנֹּשְׂאִים
  choice: die ... trugen
  rationale: Das Partizip bezeichnet die als Träger der Lade charakterisierte Gruppe. Das Präteritum fügt sich natürlich in die deutsche Erzählung ein, ohne eine bloß einmalige Handlung zu behaupten.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die hebräische Genitivkette wird eng und verständlich wiedergegeben. „Lade“ ist die etablierte Bezeichnung für die Bundeslade; die Vollform bewahrt die Struktur des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname YHWH wird im Deutschen als „Jahwe“ wiedergegeben, statt durch den Titel „HERR“ ersetzt zu werden.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: allen Ältesten Israels
  rationale: Dies ist die direkte und im Deutschen etablierte Wiedergabe der israelitischen Leitungspersonen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung; Tora
  rationale: Im unmittelbaren Zusammenhang wird ein maßgeblicher Bundes- und Gesetzestext schriftlich festgehalten und übergeben. „Gesetz“ passt dazu, während „Weisung“ die weitere lexikalische Möglichkeit und „Tora“ eine transliterierende Wiedergabe darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, bleibt aber idiomatisch. „Sowie“ vermeidet eine schwerfällige Wiederholung von „und“ und macht deutlich, dass auch die Ältesten Empfänger waren.
