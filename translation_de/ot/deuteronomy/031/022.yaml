  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: de
  text: So schrieb Mose an jenem Tag dieses Lied auf und lehrte die Israeliten dieses Lied.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; eine übliche Bezeichnung für das Volk Israel. Auch möglich: „die Kinder Israels“.'
    reason: lexikalische Alternative und Offenlegung der hebräischen Ausdrucksform
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb … auf
  rationale: Das Qal-Wayyiqtol von כתב bezeichnet den nächsten Erzählungsschritt. „schrieb … auf“ gibt im Deutschen natürlich wieder, dass Mose den Liedtext schriftlich festhielt.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: dieses Lied
  rationale: שִׁירָה bezeichnet hier das im Zusammenhang angekündigte Lied. „Lied“ bewahrt dessen literarische und poetische Einordnung.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die übliche Zeitangabe wird idiomatisch und ohne die verstärkende Deutung „noch am selben Tag“ wiedergegeben.
- source_word: וַיְלַמְּדָהּ
  choice: lehrte es
  rationale: Das Piel von למד bedeutet „lehren“; das feminine Suffix der dritten Person Singular verweist auf הַשִּׁירָה („das Lied“), was im Deutschen durch „es“ aufgenommen wird.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“, eine feste kollektive Bezeichnung für das Volk Israel. „die Israeliten“ vermittelt die gemeinte Volksbezeichnung in natürlichem modernem Deutsch; die Form des Hebräischen wird in der Fußnote offengelegt.
theological_decisions:
- issue: Geschlechtlich markierte Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die Wendung ist grammatisch maskulin und lautet wörtlich „Söhne Israels“, fungiert hier jedoch als konventionelle Bezeichnung des gesamten Bundesvolkes. „Israeliten“ bewahrt den kollektiven Bezug, ohne die Zugehörigkeit auf männliche Personen einzuengen; die wörtliche Form bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzfolge bleibt eng an der hebräischen Erzählstruktur; „schrieb … auf“ klingt im Deutschen natürlicher als das bloße „schrieb“. Die Fußnote bewahrt die wörtliche, geschlechtlich markierte Form der kollektiven Bezeichnung.
