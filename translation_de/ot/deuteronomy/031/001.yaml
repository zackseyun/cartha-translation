  text: וַ/יֵּ֖לֶךְ מֹשֶׁ֑ה וַ/יְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/001.yaml
  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: de
  text: Dann ging Mose und sprach diese Worte zu ganz Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und Mose ging und sprach diese Worte zu ganz Israel.« Die einleitende Konjunktion kann formaler mit »und« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das Verb הלך bedeutet in dieser Erzählform gewöhnlich »gehen«. Obwohl kein Ziel genannt wird und manche die Wendung im Sinn von »fuhr fort« verstehen, bleibt »ging« näher am einfachen Wortsinn und bewahrt die mögliche räumliche Bedeutung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: »Mose« ist die im Deutschen etablierte Namensform.
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: דבר im Piel bedeutet gewöhnlich »sprechen«. »Sprach« passt zur direkten Verbindung mit »diese Worte« und bewahrt den würdevollen Erzählstil.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Die Wendung bezeichnet wörtlich »diese Worte« und verweist auf die folgende Rede; diese Wiedergabe ist präziser als das allgemeinere »diese Dinge«.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition אֶל kennzeichnet hier die angesprochene Hörerschaft und wird natürlich mit »zu« wiedergegeben.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: »Ganz Israel« gibt die kollektive Bezeichnung des Volkes knapp und idiomatisch wieder, ohne sie in einzelne Israeliten aufzulösen.
- source_word: וַ
  choice: Dann
  rationale: Das einleitende Waw führt die Erzählung weiter. »Dann« macht diese zeitlich-fortschreitende Funktion in modernem Deutsch deutlich; das formalere »Und« bleibt als Alternative in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Satzfolge bleibt erhalten; auf ein ergänzendes »hin« oder eine idiomatische Auflösung wie »fuhr fort« wurde verzichtet, damit die im Ausgangstext offene Bewegungsangabe nicht eingeengt wird.
