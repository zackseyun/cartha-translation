  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: de
  text: 'Dann wird an jenem Tag mein Zorn gegen sie entbrennen. Ich werde sie verlassen und mein Angesicht vor ihnen verbergen. So werden sie zum Fraß werden[a], und viel Unheil und viele Bedrängnisse werden sie treffen. An jenem Tag wird Israel sagen[b]: »Hat mich all dieses Unheil nicht deshalb getroffen, weil mein Gott nicht in meiner Mitte ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »und es/er wird zum Essen sein«. Die knappe hebräische Wendung kann ausdrücken, dass Israel der Vernichtung preisgegeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Israel wird hier als ein einziges Gegenüber personifiziert und spricht deshalb im Singular: »mich … meiner Mitte«.'
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: mein Zorn wird entbrennen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild des brennenden Zorns, ohne die wörtliche Rede von der Nase nachzuahmen.
- source_word: בּוֹ
  choice: gegen sie
  rationale: Die Singularform bezieht sich kollektiv auf Israel; im deutschen Erzählzusammenhang ist der Plural natürlich.
- source_word: וַעֲזַבְתִּים
  choice: ich werde sie verlassen
  rationale: »Verlassen« gibt den Entzug göttlicher Zuwendung würdig und unmittelbar wieder; »im Stich lassen« wäre stärker idiomatisch und interpretierend.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: mein Angesicht vor ihnen verbergen
  rationale: Die theologisch bedeutsame Bildsprache des Hebräischen bleibt erhalten; »Angesicht« entspricht dem würdigen biblischen Register.
- source_word: וְהָיָה לֶאֱכֹל
  choice: so werden sie zum Fraß werden
  rationale: Die komprimierte Wendung lautet wörtlich etwa »und es/er wird zum Essen sein«. »Zum Fraß werden« bewahrt sowohl das Bild des Verzehrtwerdens als auch die unausgesprochene handelnde Macht.
- source_word: וּמְצָאֻהוּ
  choice: werden sie treffen
  rationale: Bei Unheil ist »treffen« im Deutschen natürlicher als »finden«; die Singularendung bezeichnet Israel kollektiv.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: viel Unheil und Bedrängnis
  rationale: רָעוֹת bezeichnet hier widerfahrendes Unheil, während צָרוֹת Bedrängnisse beziehungsweise Nöte meint. Die beiden deutschen Begriffe halten die Unterscheidung fest.
- source_word: וְאָמַר
  choice: es wird sagen
  rationale: Das Neutrum nimmt das grammatisch neutrale »Israel« als personifiziertes Kollektiv auf und erhält den hebräischen Singular.
- source_word: הֲלֹא עַל כִּי
  choice: Hat ... nicht deshalb ... weil
  rationale: Diese deutsche Satzgestalt gibt die kausale rhetorische Frage natürlich wieder.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: mein Gott nicht in meiner Mitte ist
  rationale: »In meiner Mitte« erhält den auffälligen Singular der Selbstrede Israels und bildet בְּקִרְבִּי genauer und natürlicher ab als »unter mir«.
- source_word: מְצָאוּנִי
  choice: hat mich ... getroffen
  rationale: Die Perfektform wird als gegenwärtiges Ergebnis ausgedrückt. Zugleich entspricht das Verb idiomatischem Deutsch bei widerfahrendem Unheil.
theological_decisions:
- issue: Kollektiver Singular und Plural bei Israel
  choice: In Gottes Handeln gegenüber Israel steht der natürliche deutsche Plural; in Israels personifizierter Selbstrede bleibt der Singular mit »es/mich/meiner« erhalten.
  alternative: Durchgehend Singular oder durchgehend Plural verwenden.
  rationale: So bleibt die kollektive Einheit Israels in der direkten Rede erkennbar, während die erzählenden Sätze verständlich und natürlich bleiben.
- issue: Bedeutung des verborgenen göttlichen Angesichts
  choice: Die Wendung »mein Angesicht vor ihnen verbergen« bleibt als Bild stehen.
  alternative: »Mich von ihnen abwenden« oder »ihnen meine Gegenwart entziehen«.
  rationale: Das Bild bezeichnet Gericht und Beziehungsentzug, ohne beides vollständig gleichzusetzen. Eine Paraphrase würde diese theologische Spannung vorzeitig auflösen.
- issue: Israels Deutung seines Unheils
  choice: Die Aussage bleibt als rhetorische Frage formuliert.
  alternative: 'Als sichere Feststellung wiedergeben: »Gewiss hat mich dieses Unheil getroffen, weil ...«'
  rationale: Der hebräische Text verbindet Einsicht und Frageform. Die Übersetzung soll nicht entscheiden, ob hier volle Umkehr, bloße Erkenntnis oder eine anklagende Reaktion vorliegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionellen Bildwörter »Zorn entbrennen« und »Angesicht verbergen« bleiben wegen ihrer Nähe zum Hebräischen erhalten. Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der Aussagen zu verändern.
