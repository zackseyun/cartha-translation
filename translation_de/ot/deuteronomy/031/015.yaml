source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: de
  text: Da erschien Jahwe im Zelt[a] in einer Wolkensäule, und die Wolkensäule stand am Eingang[b] des Zeltes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang wahrscheinlich das Zelt der Begegnung; im Hebräischen steht hier lediglich „das Zelt“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über dem Eingang“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier eine sichtbare Erscheinung. „erschien“ ist im Deutschen natürlich und wahrt den theophanischen Charakter, ohne die Art der Offenbarung näher zu bestimmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erhalten bleibt.
- source_word: בָּאֹהֶל
  choice: im Zelt
  rationale: אֹהֶל bedeutet „Zelt“. Der Kontext legt das Zelt der Begegnung nahe, doch der Vers selbst sagt lediglich „das Zelt“.
- source_word: בְּעַמּוּד עָנָן
  choice: in einer Wolkensäule
  rationale: Die Präposition ב wird räumlich beziehungsweise als Angabe des Erscheinungsmediums wiedergegeben. Der unbestimmte Ausdruck wird im Deutschen natürlich mit „einer“ formuliert.
- source_word: וַיַּעֲמֹד
  choice: stand
  rationale: עמד bezeichnet hier schlicht das Stehen beziehungsweise Verweilen an einem Ort; „stand“ bewahrt das konkrete Bild.
- source_word: עַמּוּד הֶעָנָן
  choice: die Wolkensäule
  rationale: Die bestimmte Form greift die zuvor genannte Säule wieder auf. Das gebräuchliche deutsche Kompositum „Wolkensäule“ ist klar und prägnant.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: am Eingang des Zeltes
  rationale: עַל kann „auf/über“ bedeuten, bezeichnet bei einem Eingang in diesem räumlichen Zusammenhang aber natürlich die Position „am Eingang“. Die wörtlichere räumliche Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt den persönlichen Bundesnamen des Gottes Israels, ohne ihn durch einen Titel zu ersetzen.
- issue: Beschreibung der Gotteserscheinung
  choice: Jahwe erschien im Zelt in einer Wolkensäule
  alternative: Jahwe wurde im Zelt als Wolkensäule sichtbar
  rationale: Die Übersetzung hält sowohl die sichtbare Erscheinung als auch die Wolkensäule als deren Medium fest, ohne Jahwe mit der Wolkensäule gleichzusetzen oder das geheimnisvolle Verhältnis näher zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Erzählstil, während „Wolkensäule“ und „am Eingang“ idiomatisches Deutsch gewährleisten.
