source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: de
  text: 'Denn ich weiß: Nach meinem Tod werdet ihr euch ganz gewiss verderben[a] und von dem Weg abweichen, den ich euch geboten habe. In späteren Tagen[c] wird euch Unheil[b] treffen, weil ihr tun werdet, was in den Augen Jahwes böse ist, und ihn durch das Werk eurer Hände zum Zorn reizen werdet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werdet ihr völlig verderbt handeln« beziehungsweise »werdet ihr ganz und gar verderben«. Das Hebräische verstärkt das Verb und lässt hier eine reflexive oder intransitive Auffassung zu.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann »Unheil«, »Unglück« oder allgemeiner »Böses« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »am Ende der Tage«. Die Wendung kann auch »in späteren Tagen« oder »in den letzten Tagen« bedeuten und je nach Zusammenhang endzeitliches Gewicht tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Denn ich weiß
  rationale: כִּי begründet hier die vorausgehende Aussage; das Perfekt יָדַעְתִּי bezeichnet Moses festes Wissen und wird im Deutschen natürlich im Präsens wiedergegeben.
- source_word: אַחֲרֵי מוֹתִי
  choice: Nach meinem Tod
  rationale: Gibt die hebräische Nominalkonstruktion knapp und natürlich wieder.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: ihr werdet euch ganz gewiss ins Verderben stürzen
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. Die reflexive Formulierung gibt den kontextuellen Sinn wieder, ohne ein im Hebräischen nicht genanntes äußeres Objekt einzuführen.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: und von dem Weg abweichen
  rationale: Bewahrt das bundesbezogene Bild des Abweichens vom gebotenen Weg in natürlichem Deutsch.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: den ich euch geboten habe
  rationale: Der Weg steht metonymisch für die gebotene Lebensführung; die enge hebräische Form bleibt im Deutschen verständlich.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: wird euch Unheil treffen
  rationale: קרא mit רָעָה beschreibt hier das Eintreffen schädlichen Geschehens. „Unheil“ vermeidet im Deutschen die missverständliche Vorstellung, moralisch Böses sei das grammatische Handlungssubjekt.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: In künftigen Tagen
  rationale: Die Wendung ist zukunftsbezogen und kann je nach Kontext weitergehendes endzeitliches Gewicht haben; die Übersetzung legt dies nicht vorschnell fest.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע בְּעֵינֵי יְהוָה
  choice: weil ihr tun werdet, was in den Augen Jahwes böse ist
  rationale: Bewahrt die hebräische Bewertungsformel und gibt אֶת־הָרַע idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Transkription gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְהַכְעִיסוֹ בְּמַעֲשֵׂה יְדֵיכֶם
  choice: und ihn durch das Werk eurer Hände zum Zorn reizen werdet
  rationale: Gibt die kausative Bedeutung von הכעיס sowie das wörtliche Bild vom Werk der Hände wieder; im Kontext sind besonders menschengemachte Götzen mitgemeint, aber nicht ausdrücklich genannt.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen direkt. „Jahwe“ bewahrt ihn als Eigennamen und verwendet die im modernen Deutschen geläufige wissenschaftliche Form.
- issue: Zeitliche Tragweite von בְּאַחֲרִית הַיָּמִים
  choice: in künftigen Tagen
  alternative: am Ende der Tage / in den letzten Tagen
  rationale: Die Wendung blickt auf eine spätere Zukunft, erzwingt hier aber keine eng umrissene endzeitliche Deutung. Die Fußnote hält die mögliche stärkere Nuance offen.
- issue: Das Werk eurer Hände
  choice: Bild wörtlich bewahren
  alternative: eure Götzen
  rationale: Götzendienst liegt im Kontext nahe, doch der hebräische Text nennt ausdrücklich nur das Werk der Hände. Die Übersetzung vermeidet eine interpretierende Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach dem Erkenntnisverb gliedert den langen Satz. „Ganz gewiss“ bildet die hebräische Verstärkung hörbar ab; „das Werk eurer Hände“ bewahrt das konkrete biblische Bild. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
