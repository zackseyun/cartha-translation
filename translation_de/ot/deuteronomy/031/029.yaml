  to: 'Denn ich weiß: Nach meinem Tod werdet ihr euch ganz gewiss verderben[a] und von dem Weg abweichen, den ich euch geboten habe. In späteren Tagen[c] wird euch Unheil[b] treffen, weil ihr tun werdet, was in den Augen Jahwes böse ist, und ihn durch das Werk eurer Hände zum Zorn reizen werdet.'
