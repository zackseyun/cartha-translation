  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: de
  text: Dann sprach Mose vor der ganzen Versammlung Israels die Worte dieses Liedes, bis sie vollständig vorgetragen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis er sie vollständig vorgetragen hatte“ – das heißt, bis Mose alle Worte des Liedes vorgetragen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach Mose
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge im modernen Deutsch natürlich wieder; „sprach“ entspricht dem schlichten Sinn von דבר.
- source_word: בְּאָזְנֵי
  choice: vor
  rationale: Wörtlich „in den Ohren von“ bezeichnet hier das hörbare Sprechen zu einer versammelten Zuhörerschaft. „Vor“ ist im Deutschen natürlich und bewahrt die öffentliche Adressierung.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: der ganzen Versammlung Israels
  rationale: קהל bezeichnet die zusammengekommene Gemeinschaft. „Versammlung“ ist verständlich und vermeidet eine unnötig konfessionelle Färbung; „ganzen“ gibt כָּל idiomatisch wieder.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: die Worte dieses Liedes
  rationale: Die ausdrückliche Nennung der „Worte“ wird beibehalten, statt den Ausdruck auf „dieses Lied“ zu verkürzen.
- source_word: עַד תֻּמָּם
  choice: bis sie zu Ende waren
  rationale: Das Suffix der 3. Person maskulin Plural kann sich am natürlichsten auf „die Worte“ beziehen. Die Formulierung bewahrt diese grammatische Beziehung und den Abschluss des Vortrags.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung בְּאָזְנֵי wird natürlich mit „vor“ wiedergegeben; die mögliche Mehrdeutigkeit des Schlusses bleibt durch eine Fußnote sichtbar.
