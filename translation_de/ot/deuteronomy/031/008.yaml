base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: de
  text: Jahwe selbst ist es, der vor dir hergeht. Er selbst wird mit dir sein; er wird dich nicht fallen lassen[a] und dich nicht verlassen. Fürchte dich nicht und erschrick nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er wird dich nicht loslassen« beziehungsweise »Er wird dich nicht im Stich lassen«.'
    reason: Das hebräische Verb kann hier bedeuten, jemanden nicht sinken zu lassen, nicht loszulassen oder nicht im Stich zu lassen.
lexical_decisions:
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich gebrauchte Gottesname wird als »Jahwe« wiedergegeben.
- source_word: הוּא הַהֹלֵךְ
  choice: selbst ist es, der … hergeht
  rationale: Die selbstständige Form des Pronomens ist betont; die Konstruktion erhält sowohl diese Hervorhebung als auch den fortdauernden Charakter des Partizips.
- source_word: לְפָנֶיךָ
  choice: vor dir her
  rationale: Die deutsche Wendung bezeichnet natürlich, dass Jahwe vorausgeht, und bewahrt das Bild räumlicher Führung.
- source_word: יִהְיֶה עִמָּךְ
  choice: wird mit dir sein
  rationale: Dies gibt die Zusage der Gegenwart knapp und unmittelbar wieder.
- source_word: יַרְפְּךָ
  choice: wird dich nicht fallen lassen
  rationale: Die Wendung bewahrt das Bild von רפה im Hifil, jemanden nicht loszulassen oder sinken zu lassen, und unterscheidet es vom folgenden עזב.
- source_word: יַעַזְבֶךָּ
  choice: dich nicht verlassen
  rationale: »Verlassen« ist im modernen Deutsch würdig und verständlich und gibt das Zurücklassen oder Aufgeben wieder.
- source_word: לֹא תִירָא
  choice: Fürchte dich nicht
  rationale: Im Kontext ist die Imperfektform als Verbot beziehungsweise Ermutigung zu verstehen.
- source_word: תֵחָת
  choice: lass dich nicht einschüchtern
  rationale: Die Form kann Erschrecken, Verzagen oder Zerschmettertwerden ausdrücken; diese Wiedergabe unterscheidet die Aussage von der vorausgehenden Furcht und ist gegenwärtiges Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Umschrift bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsabgrenzung von רפה und עזב
  choice: nicht fallen lassen … nicht verlassen
  alternative: nicht im Stich lassen … nicht verlassen
  rationale: Die gewählte Fassung erhält zwei unterscheidbare Aussagen und bewahrt bei רפה das mögliche Bild des Loslassens, ohne beide Verben zu einer einzigen Vorstellung zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Betonung durch הוּא wird mit »selbst« bewahrt; die abschließenden Aufforderungen sind direkt und ermutigend formuliert.
