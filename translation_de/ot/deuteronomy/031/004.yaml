  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: de
  text: Und der HERR wird an ihnen handeln, wie er an Sihon und Og, den Königen der Amoriter, und an ihrem Land gehandelt hat, die er vernichtet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה ... לָהֶם
  choice: wird mit ihnen ... verfahren
  rationale: Die deutsche Wendung gibt das hebräische »ihnen tun« natürlich und zugleich sachlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht dem vorgegebenen Publikationsstil.
- source_word: הִשְׁמִיד
  choice: vernichtete
  rationale: Das Hifil von שׁמד bezeichnet hier die vollständige Vernichtung und wird ohne Abschwächung wiedergegeben.
- source_word: אֲשֶׁר
  choice: als
  rationale: Der Relativanschluss kann im Zusammenhang zeitlich verstanden werden; »als« ergibt im Deutschen einen klaren Bezug auf Gottes Vorgehen gegen die Könige und ihr Land.
theological_decisions:
- issue: Bezug und Funktion von אֲשֶׁר הִשְׁמִיד אֹתָם
  choice: »als er sie vernichtete« als zeitlicher Nebensatz
  alternative: »die er vernichtete« als Relativsatz mit Rückbezug auf Land oder Könige und Land
  rationale: Das maskuline Pluralpronomen אֹתָם passt nicht zu אֶרֶץ im Singular. Der zeitliche Anschluss bewahrt den umfassenden Rückbezug und vermeidet einen grammatisch irreführenden unmittelbaren Bezug allein auf »Land«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »verfahren« bildet die Vergleichsstruktur des Hebräischen deutlich ab; Eigennamen und Volksbezeichnung folgen der geläufigen deutschen Bibelsprache.
