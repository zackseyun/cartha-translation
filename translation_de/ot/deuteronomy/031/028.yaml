  text: הַקְהִ֧ילוּ אֵלַ֛/י אֶת כָּל זִקְנֵ֥י שִׁבְטֵי/כֶ֖ם וְ/שֹׁטְרֵי/כֶ֑ם וַ/אֲדַבְּרָ֣ה בְ/אָזְנֵי/הֶ֗ם אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/אָעִ֣ידָה בָּ֔/ם אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: de
  text: Versammelt alle Ältesten eurer Stämme und eure Amtsträger zu mir, damit ich diese Worte in ihrer Gegenwart ausspreche und Himmel und Erde[a] als Zeugen gegen sie aufrufe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Himmel und die Erde“. Im Hebräischen ist dies im 5. Buch Mose eine feste Formel, mit der Himmel und Erde als Zeugen angerufen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: Versammelt
  rationale: Der Hifil-Imperativ Plural von קהל fordert mehrere Angesprochene auf, die genannten Leiter zusammenzubringen. „Versammelt“ gibt den verursachenden Sinn knapp und natürlich wieder.
- source_word: אֵלַי
  choice: bei mir
  rationale: Die Präposition bezeichnet hier das Ziel der Versammlung. Im Deutschen ist „bei mir“ bei Personen idiomatischer als das formal nähere, aber steifere „zu mir“.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: alle Ältesten eurer Stämme
  rationale: Die Konstruktverbindung bezeichnet die Ältesten, die den Stämmen zugeordnet sind. Die Wiedergabe bleibt transparent und nah an der hebräischen Struktur.
- source_word: שֹׁטְרֵיכֶם
  choice: eure Amtsträger
  rationale: שֹׁטְרִים bezeichnet im deuteronomischen Verwaltungszusammenhang untergeordnete Leiter oder Funktionsträger. „Amtsträger“ ist weiter und sachgerechter als „Schreiber“.
- source_word: וַאֲדַבְּרָה
  choice: damit ich … ausspreche
  rationale: Der Kohortativ bezeichnet Moses beabsichtigte Handlung nach der Versammlung; „damit“ macht den Zweckzusammenhang im Deutschen klar.
- source_word: בְּאָזְנֵיהֶם
  choice: vor ihren Ohren
  rationale: Die hebräische Wendung lautet wörtlich „in ihren Ohren“ und meint hörbar in ihrer Gegenwart. „Vor ihren Ohren“ bewahrt das konkrete Bild, ohne unverständlich zu sein.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים meint hier die auszusprechenden Worte und nicht bloß allgemeine Angelegenheiten.
- source_word: וְאָעִידָה בָּם
  choice: als Zeugen gegen sie aufrufe
  rationale: Der Hifil von עוּד hat hier rechtlich-bundestheologischen Sinn. Die Formulierung stellt klar, dass Himmel und Erde als Zeugen gegen die Betroffenen angerufen werden.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: Himmel und Erde
  rationale: Die artikellose deutsche Paarformel entspricht idiomatisch der festen deuteronomischen Zeugenformel und bewahrt deren feierlichen Klang.
theological_decisions:
- issue: Bundesrechtliche Zeugenformel
  choice: Himmel und Erde als Zeugen gegen sie aufrufen
  alternative: mit Himmel und Erde gegen sie Zeugnis ablegen
  rationale: Im deuteronomischen Bundeskontext fungieren Himmel und Erde als kosmische Zeugen für Israels Verantwortlichkeit. Die gewählte Fassung erhält dieses Rechtsbild, ohne es konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete hebräische Hörformel bleibt mit „vor ihren Ohren“ erhalten; Verwaltungs- und Bundessprache werden verständlich, aber nicht umgangssprachlich wiedergegeben.
