source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת הַ/לְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: de
  text: Da befahl Mose den Leviten, die die Lade des Bundes Jahwes trugen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Leviten, den Trägern der Lade des Bundes Jahwes“. Das hebräische Partizip kann auch als titelartige Bezeichnung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Da befahl
  rationale: Das wayyiqtol von צוה führt die Erzählung fort und bezeichnet das Erteilen eines verbindlichen Befehls. „Da befahl“ ist im Deutschen natürlich und wahrt den narrativen Anschluss.
- source_word: הַלְוִיִּם
  choice: den Leviten
  rationale: Die etablierte deutsche Bezeichnung für die Angehörigen Levis steht hier mit bestimmtem Artikel als indirektes Objekt von „befahl“.
- source_word: נֹשְׂאֵי
  choice: die … trugen
  rationale: Das attributive Partizip beschreibt die Leviten als Träger der Lade. Ein Relativsatz ist im modernen Deutschen klar und natürlich; die titelartige Wiedergabe „den Trägern“ bleibt als Alternative in der Fußnote erhalten.
- source_word: אֲרוֹן
  choice: die Lade
  rationale: Im Heiligtums- und Bundeskontext ist „Lade“ die herkömmliche und sachlich passende Wiedergabe, nicht das allgemeinere „Kasten“ oder „Truhe“.
- source_word: בְּרִית
  choice: des Bundes
  rationale: Die Constructusverbindung ergibt die feste Wendung „Lade des Bundes“ und bewahrt die ausdrückliche Bundesbedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname „Jahwe“ wiedergegeben, statt durch den Titel „der HERR“ ersetzt zu werden.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Infinitivformel leitet die direkte Rede des folgenden Verses ein. Im idiomatischen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion natürlicher als das formale „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel idiomatisch wieder und weist darauf hin, dass der Befehl im folgenden Vers steht.
