  source_fidelity: 'Der Entwurf gibt die hebräische Anweisung zutreffend wieder: imperativisches לָקֹחַ mit dem folgenden Plural, die Platzierung neben (nicht in) der Bundeslade, den Gottesnamen Jahwe, die fortdauernde Präsenz des Buches sowie seine Funktion als Zeuge gegen Israel. Der Wechsel von Plural („eures“) zu Singular („dich“) bleibt wie im Hebräischen erhalten und wird angemessen erläutert.'
  naturalness: „Nehmt dieses Buch der Weisung und legt es neben die Bundeslade Jahwes, eures Gottes“ ist modernes, verständliches und zugleich würdiges Standarddeutsch. „Dort soll es als Zeuge gegen dich bleiben“ ist trotz des absichtlichen Numeruswechsels klar; die Anmerkung verhindert Missverständnisse.
  terminology: „Buch der Weisung“ gibt תּוֹרָה angemessen weit wieder und ist durch die Alternative „Schriftrolle“ sinnvoll ergänzt. „Bundeslade“, „Jahwe“ und „Zeuge“ sind sachgerecht und konsistent. Die Aussage „gegen dich“ bewahrt den gerichtlichen bzw. belastenden Sinn von לְעֵד בְּךָ, ohne ihn konfessionell auszudeuten.
