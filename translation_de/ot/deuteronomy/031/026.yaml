language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: de
  text: „Nehmt dieses Buch der Weisung[a] und legt es neben die Bundeslade Jahwes, eures Gottes. Dort soll es als Zeuge gegen dich bleiben.[b]“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Schriftrolle der Weisung“. Das hebräische Wort kann ein Buch, eine Schriftrolle oder allgemein ein schriftliches Dokument bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Wechsel von „eures“ zum Singular „dich“ entspricht dem Hebräischen: Israel wird hier als Einheit angesprochen. Das Buch soll im Fall des Bundesbruchs gegen Israel Zeugnis ablegen.'
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Nehmt
  rationale: Der Qal-Infinitiv wird hier imperativisch gebraucht. Der folgende Plural וְשַׂמְתֶּם zeigt, dass mehrere Angesprochene gemeint sind.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: dieses Buch der Weisung
  rationale: סֵפֶר bezeichnet ein Schriftstück, in dieser Zeit gewöhnlich eine Schriftrolle; תּוֹרָה umfasst Weisung und Unterweisung und ist hier zugleich die verschriftlichte Bundesweisung.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: und legt es
  rationale: שׂים bezeichnet das konkrete Hinlegen oder Platzieren; „legt“ ist im Deutschen für einen Gegenstand neben der Lade natürlich.
- source_word: מִצַּד
  choice: neben
  rationale: Die Wendung bezeichnet eine Lage an der Seite der Lade, nicht in ihrem Inneren.
- source_word: אֲרוֹן בְּרִית
  choice: Bundeslade
  rationale: Die etablierte deutsche Zusammensetzung gibt die hebräische Konstruktverbindung prägnant und verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Der Pluralsuffix wird entsprechend der an mehrere Personen gerichteten Anweisung wiedergegeben.
- source_word: וְהָיָה שָׁם
  choice: Dort soll es … bleiben
  rationale: Wörtlich steht „und es soll dort sein“; im Zusammenhang bezeichnet dies den fortdauernden Ort des Buches nach seiner Niederlegung.
- source_word: בְּךָ לְעֵד
  choice: als Zeuge gegen dich
  rationale: עֵד wird personhaft als „Zeuge“ wiedergegeben. בְּ trägt im gerichtlichen Bundeskontext adversative Bedeutung; der Singular spricht Israel kollektiv an und wird als „dich“ bewahrt.
theological_decisions:
- issue: Funktion des Buches als Zeuge
  choice: Das Buch steht als Zeuge gegen Israel.
  alternative: Das Buch dient lediglich als neutrales Erinnerungszeichen oder als Zeugnis bei Israel.
  rationale: Die Verbindung לְעֵד בְּךָ und der unmittelbare Kontext von Israels Widerspenstigkeit (Vers 27) stützen die gerichtliche, belastende Funktion, ohne über den Text hinauszugehen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ bewahrt den weiteren Bedeutungsumfang von תּוֹרָה, während der Kontext klar erkennen lässt, dass die verbindliche Bundesweisung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Buch der Weisung“ vermeidet eine unnötige Verengung von תּוֹרָה, während „Bundeslade“ den geläufigen biblischen Ausdruck wahrt. Der Numeruswechsel des Ausgangstextes bleibt sichtbar.
