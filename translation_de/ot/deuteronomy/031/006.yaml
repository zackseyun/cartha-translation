base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: de
  text: Seid stark und mutig! Fürchtet euch nicht und lasst euch nicht von ihnen einschüchtern. Denn Jahwe, dein Gott, geht selbst mit dir[a]. Er wird dich nicht fallen lassen[b] und dich nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aufforderungen stehen im Hebräischen in der Mehrzahl; ab „dein Gott“ wechselt der Text in die Einzahl.
    reason: textual_ambiguity
  - marker: b
    text: 'Wörtlich kann das Verb bedeuten: „dich nicht loslassen“ oder „dich nicht fallen lassen“. Gemeint ist, dass Jahwe seinen Halt und seine Unterstützung nicht aufgibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Seid stark und mutig!
  rationale: Die beiden pluralischen Imperative bilden eine feste Ermutigungsformel. Die Wiedergabe ist zugleich nah am Hebräischen und im heutigen Deutsch natürlich.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: Fürchtet euch nicht und erschreckt nicht
  rationale: Die zwei Verbformen werden unterschieden; ערץ bezeichnet eine besonders heftige Furcht oder ein Entsetzen. „Erschreckt nicht“ bewahrt die Steigerung, ohne eine unnatürliche Formulierung zu erzwingen.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Die Präposition bezeichnet hier die Furcht angesichts der anderen und lässt sich idiomatisch mit „vor ihnen“ wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: geht selbst mit dir
  rationale: Das selbstständige Pronomen הוּא hebt das Subjekt hervor. „selbst“ bringt diese Betonung knapp und natürlich zum Ausdruck; das Partizip beschreibt Jahwe als den mitgehenden Gott.
- source_word: לֹא יַרְפְּךָ
  choice: Er lässt dich nicht fallen
  rationale: Das Hifil von רפה kann das Nachlassen des Halts beziehungsweise Fallenlassen ausdrücken. Diese bildhafte Wiedergabe bleibt näher am Ausgangstext als das allgemeinere „im Stich lassen“.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: und verlässt dich nicht
  rationale: עזב bedeutet verlassen oder aufgeben. „verlässt dich nicht“ ist würdevoll, klar und vom vorhergehenden Bild des Fallenlassens unterscheidbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn sichtbar, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Unterscheidung der Zusageverben רפה und עזב
  choice: Er lässt dich nicht fallen und verlässt dich nicht.
  alternative: Er lässt dich nicht im Stich und verlässt dich nicht.
  rationale: Die gewählte Fassung erhält sowohl die Bildlichkeit des ersten Verbs als auch die zweifache Zusage, ohne beide Verben zu bloßen Synonymen einzuebnen.
- issue: Numeruswechsel innerhalb des Verses
  choice: Plural in den Aufforderungen, Singular in der Gottesbeziehung
  alternative: Durchgehend pluralische Anrede
  rationale: Der hebräische Text spricht die Angeredeten zunächst im Plural an, wechselt aber bei „dein Gott“, „mit dir“ und den folgenden Zusagen in den Singular. Dieser auffällige Wechsel wird bewahrt und nicht harmonisiert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Der Wechsel von pluralischer zu singularischer Anrede bleibt entsprechend dem hebräischen Text erhalten. Die Fußnotenmarker [a] und [b] stehen jeweils an der sachlich passenden Stelle im Haupttext.
