  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: de
  text: Denn ich kenne deine Auflehnung und deinen harten Nacken[a]. Ja, solange ich heute noch lebend bei euch bin, habt ihr euch gegen Jahwe aufgelehnt[b] – wie viel mehr erst nach meinem Tod!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinen harten Nacken“; ein hebräisches Bild für Starrsinn und Unbeugsamkeit.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „mit Jahwe“; im Zusammenhang bezeichnet die Formulierung Widerstand gegen Jahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: deine Auflehnung
  rationale: מֶרִי bezeichnet Auflehnung, Widersetzlichkeit oder Rebellion. „Auflehnung“ bewahrt die substantivische Form und passt zum Bundesbruch-Kontext, ohne unnötig militärisch zu klingen.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: deinen harten Nacken
  rationale: Die wörtliche Metapher beschreibt hartnäckige Unbeugsamkeit. Sie bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: הֵן
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Feststellung hervor. „Seht“ gibt diese Funktion in würdigem, verständlichem Deutsch wieder.
- source_word: בְּעוֹדֶנִּי חַי עִמָּכֶם הַיּוֹם
  choice: Solange ich heute noch bei euch am Leben bin
  rationale: Die Formulierung bewahrt sowohl den zeitlichen Rahmen als auch das betonte „heute“ und klingt im Deutschen natürlich.
- source_word: מַמְרִים הֱיִתֶם
  choice: habt ihr … rebelliert
  rationale: Die Verbindung aus Partizip und היה beschreibt anhaltendes beziehungsweise wiederholtes rebellisches Verhalten bis in die Gegenwart der Rede. Das deutsche Perfekt erfasst diesen Rückblick mit Gegenwartsbezug.
- source_word: עִם יְהוָה
  choice: gegen Jahwe
  rationale: עִם bedeutet gewöhnlich „mit“, bezeichnet hier beim Verb des Rebellierens jedoch die Person, der Widerstand entgegengesetzt wird. Daher ist „gegen“ im Deutschen sachgemäß; die formale Alternative wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאַף כִּי
  choice: wie viel mehr erst
  rationale: Die Wendung steigert den Schluss vom bisherigen Verhalten auf die erwartete Zeit nach Moses Tod. „Wie viel mehr erst“ erhält die rhetorische Zuspitzung.
- source_word: אַחֲרֵי מוֹתִי
  choice: nach meinem Tod
  rationale: Die nominale hebräische Wendung wird knapp und formal entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Verhältnis der Rebellion zu Jahwe in עִם יְהוָה
  choice: gegen Jahwe
  alternative: mit Jahwe
  rationale: Obwohl עִם formal meist „mit“ bedeutet, verlangt der Zusammenhang mit ממרים eine gegnerische Beziehung. Die Übersetzung macht diese kontextuelle Bedeutung deutlich, während die Fußnote die formale Lesart offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Nackenmetapher und die rhetorische Steigerung bleiben erhalten. Der Wechsel vom Singular („deine“) zum Plural („euch“, „ihr“) folgt dem hebräischen Text und wird nicht geglättet.
