  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: de
  text: 'Und er befahl Josua, den Sohn Nuns, und sagte: »Sei stark und mutig! Denn du wirst die Söhne Israels[a] in das Land bringen, das ich ihnen zugeschworen habe. Und ich selbst werde mit dir sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten« oder »das Volk Israel«. Wörtlich: »die Söhne Israels«.'
    reason: 'Lexikalische Alternative: Die Fußnote nennt geläufigere kollektive Wiedergaben, während der Haupttext die hebräische Familienbezeichnung erhält.'
lexical_decisions:
- source_word: וַיְצַו
  choice: er befahl
  rationale: Das Piel von צוה bezeichnet ein verbindliches Befehlen oder Beauftragen. »Befahl« gibt die Verbindlichkeit knapp und unmittelbar wieder.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, dem Sohn Nuns
  rationale: Die geläufigen deutschen Namensformen werden verwendet; die Apposition steht nach dem Dativobjekt ebenfalls im Dativ.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sei stark und mutig
  rationale: Das feste hebräische Aufforderungspaar verbindet Stärke mit innerer Entschlossenheit und Tapferkeit. »Stark und mutig« ist verständlich, prägnant und würdevoll.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aufforderung. »Denn« bewahrt diesen kausalen Zusammenhang.
- source_word: תָּבִיא
  choice: du wirst … bringen
  rationale: Die Hifil-Form von בוא ist kausativ und bedeutet »hineinbringen« beziehungsweise »hinführen«. »Bringen« bleibt der Verbform nahe, ohne Josuas Führungsrolle übermäßig auszudeuten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre Wendung bewahrt sowohl die grammatisch maskuline Form als auch den bundesgeschichtlichen Bezug auf Israel; geläufigere kollektive Wiedergaben werden in der Fußnote genannt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: »Das Land« ist im Kontext der Bundesverheißung die sachlich und thematisch passende Wiedergabe.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: das ich ihnen zugeschworen habe
  rationale: »Zugeschworen« gibt die hebräische Eidformel idiomatisch wieder, ohne das im Hebräischen nicht ausdrücklich wiederholte »zu geben« einzufügen.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: Und ich selbst werde mit dir sein
  rationale: »Ich selbst« bildet die durch das selbstständige Pronomen אָנֹכִי gesetzte Betonung ab; zugleich bleibt die zentrale Zusage »mit dir sein« klar erkennbar.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; das Volk Israel
  rationale: Die Hauptfassung bewahrt die konkrete familiäre Ausdrucksweise des Hebräischen und glättet sie nicht stillschweigend zu einer rein kollektiven Bezeichnung. Die natürlichen deutschen Alternativen stehen in der Fußnote.
- issue: Unausgesprochenes Subjekt von וַיְצַו und וַיֹּאמֶר
  choice: er
  alternative: der HERR
  rationale: Im Vers selbst ist das Subjekt nur durch die Verbform der dritten Person Singular bezeichnet. »Er« bewahrt diese Form und vermeidet, den im unmittelbaren Zusammenhang erkennbaren Sprecher im Vers ausdrücklich einzusetzen.
- issue: Betonung in וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: ich selbst werde mit dir sein
  alternative: ich werde mit dir sein
  rationale: Das eigenständige Pronomen אָנֹכִי kann gegenüber der bereits eindeutigen Verbform Nachdruck tragen. »Ich selbst« erhält diesen Akzent, ohne die Art der göttlichen Gegenwart näher zu bestimmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Die direkte Rede ist knapp und feierlich; der Ausruf nach der doppelten Aufforderung und die Satzgliederung heben Zuspruch, Auftrag und Gegenwartsverheißung hervor.
