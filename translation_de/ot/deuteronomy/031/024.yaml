  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת מֹשֶׁ֗ה לִ/כְתֹּ֛ב אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את עַל סֵ֑פֶר עַ֖ד תֻּמָּֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: de
  text: Und als Mose damit fertig war, die Worte dieser Weisung vollständig auf eine Schriftrolle[a] zu schreiben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ein Schriftstück“. Das hebräische Wort סֵפֶר bezeichnet ein Schriftstück oder eine Schriftrolle, nicht notwendigerweise ein gebundenes Buch im heutigen Sinn.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Und als ... damit fertig war
  rationale: Die Konstruktion leitet einen zeitlichen und erzählerischen Übergang ein. Die deutsche Formulierung gibt sowohl die Abfolge als auch den Abschluss der Handlung natürlich wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname folgt der etablierten deutschen Bibeltradition.
- source_word: לִכְתֹּב
  choice: zu schreiben
  rationale: Der Infinitiv bezeichnet die Handlung, die Mose zu Ende führte; mit „damit fertig war“ ist die Formulierung im Deutschen idiomatisch.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: דברים bezeichnet hier den schriftlich festgehaltenen Wortlaut; „Worte“ wahrt den literarischen Bezug.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieser Weisung
  rationale: תורה kann Gesetz, Unterweisung oder Weisung bedeuten. „Weisung“ hält die Bedeutungsbreite offen und passt zum bundesrechtlichen Zusammenhang, ohne den Ausdruck auf modernes Gesetzesrecht zu verengen.
- source_word: עַל סֵפֶר
  choice: in eine Schriftrolle
  rationale: ספר bezeichnet hier einen beschriebenen Schriftträger, wahrscheinlich eine Rolle. Das deutsche „in eine Schriftrolle schreiben“ ist idiomatisch; die Fußnote bewahrt die lexikalische Breite.
- source_word: עַד תֻּמָּם
  choice: vollständig
  rationale: Der Ausdruck betont, dass die genannten Worte bis zu ihrem Abschluss niedergeschrieben wurden. „Vollständig“ gibt dies in der deutschen Satzstruktur klar und natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von הַתּוֹרָה הַזֹּאת
  choice: dieser Weisung
  alternative: dieses Gesetzes
  rationale: „Weisung“ bewahrt die weitere Bedeutung von תורה, während der unmittelbare Kontext weiterhin den rechtlich-bundeshaften Charakter erkennen lässt. Damit wird keine engere theologische Deutung erzwungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als einleitender Nebensatz offen, da der hebräische Satz im folgenden Vers fortgesetzt wird. „Schriftrolle“ vermeidet den modernen Eindruck eines gebundenen Buches; die Fußnote nennt die allgemeinere Möglichkeit.
