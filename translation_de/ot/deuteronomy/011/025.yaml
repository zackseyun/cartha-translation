  terminology: „Jahwe, euer Gott“ gibt den Gottesnamen und die Apposition angemessen wieder. „Furcht und Schrecken“ wahrt die zweigliedrige hebräische Intensivierung. „Land“ ist im Kontext gegenüber „Erde“ vorzuziehen.
