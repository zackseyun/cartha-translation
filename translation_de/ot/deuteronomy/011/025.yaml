base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: de
  text: Niemand wird vor euch bestehen können.[a] Jahwe, euer Gott, wird Furcht und Schrecken vor euch über das ganze Land bringen, das ihr betreten werdet,[b] wie er zu euch gesprochen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Kein Mann wird sich vor euch aufstellen.“ Die hebräische Wendung bedeutet hier, jemandem standhalten oder sich ihm erfolgreich widersetzen zu können.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „über die Oberfläche des ganzen Landes, auf dem ihr auftreten werdet“. Das hebräische Wort kann auch „Erde“ bedeuten; hier weist der Zusammenhang auf das von Israel betretene Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Niemand wird vor euch bestehen können
  rationale: Die Wendung bezeichnet hier nicht bloß das Stehen in jemandes Gegenwart, sondern die Fähigkeit, ihm standzuhalten. „Niemand“ gibt den repräsentativen und verneinten Gebrauch von אִישׁ im natürlichen heutigen Deutsch wieder.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: Angst und Schrecken vor euch
  rationale: Die beiden sinnverwandten Substantive werden als verstärkendes Wortpaar wiedergegeben, ohne sie zu einem einzigen Begriff einzuebnen.
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: wird ... über ... kommen lassen
  rationale: נתן bezeichnet hier das Bewirken beziehungsweise Auferlegen von Angst im ganzen Gebiet. Die deutsche Formulierung ist idiomatisch und bewahrt die kausative Aussage.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben; die appositionelle Verbindung mit „euer Gott“ bleibt erhalten.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: über das ganze Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der folgende Relativsatz begrenzt den Bezug auf das von Israel betretene Gebiet, weshalb „Land“ hier sachlich näherliegt.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: das ihr betreten werdet
  rationale: דרך bezeichnet konkret das Treten oder Auftreten. „Betreten“ bewahrt das räumliche Bild und klingt im Deutschen natürlich.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: so wie er es euch zugesagt hat
  rationale: דבר bedeutet grundsätzlich „reden/sagen“; im Zusammenhang nimmt das Gesagte den Charakter einer göttlichen Zusage an. „Zugesagt“ drückt diese kontextuelle Funktion idiomatisch aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottes Bundesname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verneintes repräsentatives אִישׁ
  choice: Niemand
  alternative: Kein Mann
  rationale: לֹא ... אִישׁ bildet hier eine allgemein verneinende Aussage. „Niemand“ entspricht ihrer Reichweite im modernen Deutschen, ohne eine ausschließlich männliche Bezugsgruppe zu behaupten.
- issue: Aussage über den Widerstand gegen Israel
  choice: wird vor euch bestehen können
  alternative: wird sich vor euch aufstellen
  rationale: Die idiomatische Bedeutung des Hebräischen ist erfolgreicher Widerstand. Die Übersetzung macht diese Bedeutung deutlich, ohne über den Text hinaus militärische Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des Betretens bleibt erhalten; schwer verständliche hebräische Idiomatik wird im Haupttext natürlich wiedergegeben und in den Fußnoten transparent gemacht.
