  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: de
  text: und was er für euch in der Wüste getan hat, bis ihr an diesen Ort gekommen seid –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: und was
  rationale: Die Verbindung aus Konjunktion und Relativpartikel setzt die vorausgehende Aufzählung fort. „Und was“ bewahrt den relativen Sinn und klingt im Deutschen natürlich.
- source_word: עָשָׂה
  choice: getan hat
  rationale: Das häufige Verb עשה bedeutet hier „tun“ und bezeichnet die Taten Gottes zugunsten Israels.
- source_word: לָכֶם
  choice: für euch
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung des Handelns auf Israel beziehungsweise zu dessen Gunsten; „für euch“ ist idiomatisch und kontextgemäß.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet die Wüsten- beziehungsweise Wildnisregion der Wanderungszeit. „Wüste“ ist die geläufige, geografisch passende deutsche Wiedergabe.
- source_word: עַד בֹּאֲכֶם
  choice: bis ihr … gekommen seid
  rationale: Das erste עַד bezeichnet die zeitliche Erstreckung bis zur Ankunft; der Infinitiv mit Suffix wird im Deutschen natürlich als finiter Nebensatz wiedergegeben.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: Das zweite עַד bezeichnet das räumliche Ziel. In Verbindung mit „kommen“ gibt „an diesen Ort“ die hebräische Zielangabe idiomatisch wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt von עָשָׂה
  choice: „er“ mit Bezug auf den HERRN im vorausgehenden Zusammenhang
  alternative: den Gottesnamen im Vers ausdrücklich wiederholen
  rationale: Der hebräische Verbform ist das Subjekt grammatisch eingeschrieben, und der Kontext nennt den HERRN als Handelnden. Das Pronomen wahrt den Satzanschluss, ohne eine im Vers nicht wiederholte Bezeichnung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Teil des übergreifenden Satzes syntaktisch offen; der Gedankenstrich entspricht diesem fortlaufenden Charakter. Keine unnötige Interpunktion vor „bis“.
