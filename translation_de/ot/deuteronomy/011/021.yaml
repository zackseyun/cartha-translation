  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: de
  text: damit eure Tage und die Tage eurer Söhne[a] sich mehren in dem Land, das Jahwe euren Vätern geschworen hat, ihnen zu geben, wie die Tage des Himmels über der Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eurer Kinder«. Wörtlich steht im Hebräischen »eurer Söhne«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »solange der Himmel über der Erde besteht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck beziehungsweise die Folge der vorausgehenden Gebote knapp und natürlich wieder.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: eure Tage … zahlreich werden
  rationale: Bewahrt das hebräische Bild von sich mehrenden Tagen, ohne es vorschnell zu »lange leben« aufzulösen.
- source_word: וִימֵי בְנֵיכֶם
  choice: und die Tage eurer Söhne
  rationale: Gibt das ausdrücklich maskuline בנים formal wieder; die im Zusammenhang mögliche umfassendere Bedeutung wird in einer Fußnote genannt.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: Im deuteronomischen Verheißungskontext bezeichnet אֲדָמָה das zugesagte Land; deutsches »in dem Land« ist hier natürlicher als »auf dem Land«.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם
  choice: das Jahwe euren Vätern geschworen hat
  rationale: Bewahrt die Eid- und Bundesprache sowie die personale Bezeichnung »Väter«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: לָתֵת לָהֶם
  choice: ihnen zu geben
  rationale: Natürliche deutsche Wiedergabe des Infinitivs mit dem ausdrücklichen pluralischen Empfängerpronomen.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: solange der Himmel über der Erde besteht
  rationale: Gibt die idiomatische Dauerformel verständlich wieder; die formalere Bildfassung bleibt als Fußnotenalternative erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בְנֵיכֶם
  choice: eure Söhne
  alternative: eure Kinder
  rationale: Die Form bedeutet wörtlich »eure Söhne«, kann im generationenbezogenen Zusammenhang jedoch repräsentativ die Nachkommen beziehungsweise Kinder einschließen; diese Spannung wird durch die Fußnote bewahrt.
- issue: Deutung der abschließenden Vergleichsformel
  choice: solange der Himmel über der Erde besteht
  alternative: wie die Tage des Himmels über der Erde
  rationale: Die Wendung kann als idiomatische Aussage dauerhaften Verbleibs verstanden oder bildnäher wiedergegeben werden; die Hauptfassung ist im Deutschen klar, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber durch idiomatisches »in dem Land« und die verständliche Dauerformel natürlich lesbar gehalten.
