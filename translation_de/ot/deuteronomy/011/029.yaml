  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: de
  text: Und wenn Jahwe, dein Gott, dich in das Land bringt, in das du ziehst, um es in Besitz zu nehmen, dann sollst du den Segen auf den Berg Garizim und den Fluch auf den Berg Ebal legen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann sollst du auf dem Berg Garizim den Segen und auf dem Berg Ebal den Fluch aussprechen.“ Das hebräische Verb bedeutet wörtlich „geben, setzen, legen“; die genaue zeremonielle Handlung wird im weiteren Zusammenhang erläutert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Einleitungsformel bezeichnet hier einen künftigen Zeitpunkt. „Und wenn“ gibt ihre zeitliche Funktion natürlich wieder, ohne die Wendung hölzern nachzubilden.
- source_word: יְבִיאֲךָ
  choice: dich … bringt
  rationale: Die Hifil-Form von בוא bedeutet „hineinbringen“. Im Deutschen ergibt die Konstruktion mit „in das Land“ bereits eindeutig die räumliche Richtung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Tetragramms bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form mit Suffix der zweiten Person Singular wird direkt wiedergegeben und bewahrt die persönliche Bundesanrede.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Kontext des Deuteronomiums bezeichnet der Ausdruck das Land, das Israel in Besitz nehmen soll; „das Land“ ist knapp und kontextgerecht.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: in das du ziehst
  rationale: Das Partizip בָא mit dem Richtungsadverb שָׁמָּה beschreibt das bevorstehende Hineingehen. „In das du ziehst“ ist idiomatisch und bewahrt die Zielrichtung.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירשׁ bezeichnet hier das Erlangen beziehungsweise Antreten des Landes. Die Formulierung gibt diesen Sinn klar wieder, ohne ihn allein auf Erbschaft oder militärische Eroberung festzulegen.
- source_word: וְנָתַתָּה
  choice: dann sollst du … legen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“. „Legen“ wahrt das konkrete Bild und lässt die genaue zeremonielle Ausführung offen; die mögliche Bedeutung „aussprechen“ wird in der Fußnote genannt.
- source_word: הַבְּרָכָה
  choice: den Segen
  rationale: Der bestimmte Ausdruck bezeichnet den im Zusammenhang genannten Bundessegen.
- source_word: עַל הַר גְּרִזִים
  choice: auf den Berg Garizim
  rationale: עַל wird zusammen mit dem gerichteten Verb idiomatisch durch „auf“ mit Akkusativ wiedergegeben; „Garizim“ ist die etablierte deutsche Namensform.
- source_word: הַקְּלָלָה
  choice: den Fluch
  rationale: Die bestimmte Nominalform steht parallel zu „den Segen“ und bezeichnet dessen Gegenstück im Bund.
- source_word: עַל הַר עֵיבָל
  choice: auf den Berg Ebal
  rationale: Die Formulierung wahrt die genaue Parallelität zum Berg Garizim und verwendet die etablierte deutsche Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der im modernen Deutschen üblichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Handlung mit Segen und Fluch
  choice: den Segen … und den Fluch … legen
  alternative: den Segen … und den Fluch … aussprechen
  rationale: Das hebräische נתן bezeichnet wörtlich ein Geben, Setzen oder Legen. Die Hauptfassung bewahrt diese konkrete und nicht völlig eindeutige Ausdrucksweise; die zeremonielle Deutung als Aussprechen wird nicht ausgeschlossen, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede im Singular. Die Satzführung bleibt gut verständlich, bewahrt aber die Parallelität von Segen und Fluch sowie die konkrete Mehrdeutigkeit des hebräischen Verbs נתן.
