id: DEU.11.23
reference: Deuteronomy 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: de
  text: Dann wird Jahwe alle diese Völker vor euch vertreiben, und ihr werdet Völker aus ihrem Besitz verdrängen, die größer und stärker sind als ihr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: wird … vertreiben
  rationale: Der Hifil von ירשׁ bezeichnet hier das Veranlassen des Besitzverlusts; im Eroberungskontext gibt „vertreiben“ dies natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: alle diese Völker
  rationale: גּוֹיִם bezeichnet hier die ethnisch-politischen Völker des Landes; „Völker“ ist im Deutschen idiomatischer als „Nationen“.
- source_word: מִלִּפְנֵיכֶם
  choice: vor euch
  rationale: Die Wendung bedeutet wörtlich „von vor eurem Angesicht“ und bezeichnet im Zusammenhang das Vertreiben aus Israels Weg beziehungsweise Gegenwart.
- source_word: וִירִשְׁתֶּם
  choice: ihr werdet … aus ihrem Besitz verdrängen
  rationale: Da Völker und nicht das Land das direkte Objekt sind, ist die transitive Bedeutung „enteignen/verdrängen“ gemeint. Die Formulierung bewahrt den Besitzaspekt von ירשׁ und klingt zugleich natürlich.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Die Wiederholung desselben deutschen Ausdrucks erhält die lexikalische Verbindung zum ersten Satzteil.
- source_word: גְּדֹלִים
  choice: größer
  rationale: Durch מִכֶּם liegt ein Vergleich vor; „größer“ kann sowohl zahlenmäßige Größe als auch Bedeutung umfassen.
- source_word: וַעֲצֻמִים
  choice: stärker
  rationale: עָצוּם bezeichnet Stärke oder Macht; „stärker“ ist präzise, modern und bildet den Parallelvergleich natürlich ab.
- source_word: מִכֶּם
  choice: als ihr
  rationale: מִן mit Suffix hat hier eindeutig vergleichende Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Form und ersetzt sie nicht durch den Titel „der HERR“.
- issue: Bedeutung von וִירִשְׁתֶּם bei Völkern als Objekt
  choice: aus ihrem Besitz verdrängen
  alternative: in Besitz nehmen
  rationale: Der Vers stellt Gottes Vertreiben und Israels Handeln parallel dar. Weil das Objekt „Völker“ lautet, wäre „Völker in Besitz nehmen“ missverständlich; die gewählte Fassung erhält die Vorstellung des Besitzentzugs, ohne eine darüber hinausgehende Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Parallelismus, vermeidet jedoch unnatürliche Wörtlichkeit. „Aus ihrem Besitz verdrängen“ ist etwas ausführlicher als das Hebräische, gibt aber dessen kontextuelle Bedeutung bei einem Personenobjekt klar wieder.
