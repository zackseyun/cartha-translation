base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: de
  text: Hütet euch davor, dass euer Herz verführt wird und ihr abweicht, anderen Göttern dient und euch vor ihnen niederwerft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass euer Herz getäuscht wird“. Das hebräische Verb kann überreden, verlocken oder täuschen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hütet euch davor
  rationale: Die reflexive Warnformel wird im Deutschen natürlich und eindringlich wiedergegeben; „davor“ leitet passend den mit פֶּן bezeichneten drohenden Fall ein.
- source_word: פֶּן
  choice: dass … [nicht eintrete]
  rationale: In Verbindung mit „Hütet euch davor“ führt „dass“ im Deutschen idiomatisch den zu vermeidenden Fall ein. Die warnende, negative Bedeutung ergibt sich aus der Gesamtkonstruktion.
- source_word: יִפְתֶּה
  choice: sich verführen lässt
  rationale: Das Verb kann Überredung, Verlockung oder Täuschung bezeichnen. Die reflexiv-passive Formulierung ist natürlich und wahrt die mögliche Bedeutung des Verführtwerdens; „getäuscht wird“ bleibt als Alternative in der Fußnote erhalten.
- source_word: לְבַבְכֶם
  choice: euer Herz
  rationale: „Herz“ bewahrt das hebräische Bild für das innere Zentrum von Denken, Wollen und Entscheiden.
- source_word: וְסַרְתֶּם
  choice: und ihr abweicht
  rationale: „Abweichen“ gibt das Verlassen des rechten Weges beziehungsweise der gebotenen Bundestreue knapp wieder, ohne das Ziel der Abkehr zusätzlich auszudeuten.
- source_word: וַעֲבַדְתֶּם
  choice: anderen Göttern dient
  rationale: עבד bezeichnet hier religiösen Dienst. „Dienen“ hält diesen Begriff vom folgenden konkreten Niederwerfen unterschieden.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe; „fremden Göttern“ wäre enger und stärker interpretierend.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: und euch vor ihnen niederwerft
  rationale: Die Formulierung bewahrt die konkrete körperliche Handlung des Sich-Niederwerfens und lässt deren kultische Bedeutung im Zusammenhang deutlich werden.
theological_decisions:
- issue: Verlauf des Abfalls
  choice: Die Abfolge von innerer Verführung über das Abweichen bis zum Dienst an anderen Göttern und zum Niederwerfen vor ihnen bleibt erhalten.
  alternative: Die ganze Abfolge zusammenfassend als Warnung vor Götzendienst wiederzugeben.
  rationale: Der hebräische Text entfaltet einzelne Schritte. Diese Spannung zwischen innerem Vorgang, Abkehr und äußerer Verehrung soll nicht zu einem abstrakten Begriff eingeebnet werden.
- issue: Bedeutung von פתה
  choice: „sich verführen lässt“
  alternative: „getäuscht wird“
  rationale: Das hebräische Verb umfasst sowohl Verlockung als auch Täuschung. Die Hauptfassung wählt eine im Kontext natürlicherweise zum Abfall führende Verführung, während die alternative Nuance ausdrücklich in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht entsprechend dem hebräischen Plural in der Ihr-Form. Konkrete Kultsprache („dient“, „niederwerft“) und das biblische Bild des Herzens bleiben erhalten.
