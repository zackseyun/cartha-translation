base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: de
  text: ein Land, um das Jahwe, dein Gott, sich kümmert[a]; die Augen Jahwes, deines Gottes, sind beständig darauf gerichtet, vom Anfang des Jahres bis zum Ende des Jahres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach dem Jahwe, dein Gott, fragt« oder »das Jahwe, dein Gott, sucht«. Das hebräische Verb kann suchen oder nachfragen bedeuten; hier bezeichnet es Jahwes fürsorgliche Zuwendung zu dem Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: Land
  rationale: Im Kontext des Deuteronomiums ist das verheißene Land bzw. Gebiet gemeint, nicht die Erde als Ganzes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Gibt die Konstruktion mit dem Suffix der 2. Person Singular maskulin und die direkte Bundesanrede genau wieder.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: sich um es kümmert
  rationale: דרש kann suchen, nachfragen oder sich annehmen bedeuten; bei dem Land als Objekt bezeichnet es hier Jahwes tätige Fürsorge und Aufsicht. Im Satz wird idiomatisch „um das … sich kümmert“ verwendet.
- source_word: תָּמִיד
  choice: beständig
  rationale: Bezeichnet die fortdauernde, durchgängige Aufmerksamkeit; „beständig“ ist natürlich, würdevoll und enger am Aspekt der Kontinuität als eine bloß allgemeine Aussage.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: Die Augen Jahwes, deines Gottes, sind darauf gerichtet
  rationale: Bewahrt das anthropomorphe Bild der Augen und gibt בָּהּ im Deutschen idiomatisch als gerichtete Aufmerksamkeit wieder.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: vom Anfang des Jahres bis zum Ende des Jahres
  rationale: Gibt die umfassende zeitliche Spanne klar und nah an der hebräischen Formulierung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namenscharakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Rede von Gottes Augen
  choice: Die Augen Jahwes … sind … darauf gerichtet
  alternative: Jahwe wacht beständig darüber
  rationale: Das konkrete Bild des Ausgangstextes bleibt erhalten; es bezeichnet Gottes fortdauernde Aufmerksamkeit, ohne die Bildsprache erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versabschnitt beginnt entsprechend dem hebräischen Zusammenhang mit „ein Land“; die Wiederholung „des Jahres“ wahrt den feierlichen Parallelismus. Die Fußnote erläutert nur die idiomatische Spannweite des Augenbildes.
