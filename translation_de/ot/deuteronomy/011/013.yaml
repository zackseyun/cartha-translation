  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: de
  text: Und wenn ihr wirklich auf meine Gebote hört, die ich euch heute gebiete,[a] um Jahwe,[b] euren Gott, zu lieben und ihm mit eurem ganzen Herzen und mit eurer ganzen Seele[c] zu dienen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »wenn ihr wirklich hört«. Die hebräische Verstärkungsform kann im Zusammenhang auch bedeuten: »wenn ihr gewissenhaft gehorcht«.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben; auch »Yahweh« geschrieben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »mit eurem ganzen Leben« beziehungsweise »mit eurem ganzen Sein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Und wenn
  rationale: Die einleitende Wendung eröffnet den Bedingungssatz, dessen Folgesatz erst in Vers 14 steht. »Und wenn« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: ihr wirklich … hört
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt שׁמע. »Wirklich hört« bewahrt sowohl die Betonung als auch den Grundsinn des Hörens; der Zusammenhang schließt gehorsames Befolgen ein.
- source_word: אֶל מִצְוֺתַי
  choice: auf meine Gebote
  rationale: »Auf … hören« ist die natürliche deutsche Verbindung und lässt den verpflichtenden, bundesbezogenen Sinn von מִצְוֺת erkennen.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: die ich euch heute gebe
  rationale: Im Deutschen werden Gebote idiomatisch »gegeben«. Das Präsens und »heute« erhalten den gegenwärtigen Charakter der Rede.
- source_word: לְאַהֲבָה
  choice: indem ihr … liebt
  rationale: Der Infinitiv bezeichnet hier die durch das Hören auf die Gebote geprägte Antwort. »Indem« ergibt einen verständlichen deutschen Satz, ohne Liebe und Dienst vom vorausgehenden Gehorsam zu trennen; die mögliche Zweck- oder Inhaltsnuance wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des hebräischen Gottesnamens bewahrt ihn als Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וּלְעָבְדוֹ
  choice: und ihm … dient
  rationale: עבד umfasst ergebenen Dienst und kann kultische Verehrung einschließen. »Dienen« wahrt diesen weiteren Bedeutungsumfang besser als das engere »anbeten«.
- source_word: בְּכָל לְבַבְכֶם
  choice: mit eurem ganzen Herzen
  rationale: לֵבָב bezeichnet die innere Person einschließlich Denken, Wollen und Empfinden. »Herz« ist hier die etablierte und verständliche Entsprechung.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: mit eurer ganzen Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder die ganze Person bezeichnen. »Seele« bewahrt die traditionelle Formulierung; die größere Bedeutungsbreite wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« ist seine geläufige deutsche Wiedergabe und vermeidet, den Namen im Haupttext durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שָׁמֹעַ תִּשְׁמְעוּ
  choice: ihr wirklich … hört
  alternative: ihr genau gehorcht; ihr gewissenhaft hört
  rationale: Die hebräische Konstruktion ist nachdrücklich und verbindet Hören im Kontext mit gehorsamer Antwort. Der Haupttext erhält das Bild des Hörens, während die Fußnote den Gehorsamsaspekt ausdrücklich nennt.
- issue: Beziehung der Infinitive לְאַהֲבָה und וּלְעָבְדוֹ zum Gebotshören
  choice: indem ihr … liebt und … dient
  alternative: um … zu lieben und … zu dienen; nämlich … zu lieben und … zu dienen
  rationale: Die hebräischen Infinitive lassen eine Zweck-, Inhalts- oder erläuternde Beziehung zu. »Indem« stellt Liebe und Dienst als konkrete Gestalt des geforderten Hörens dar, ohne die anderen syntaktischen Möglichkeiten zu leugnen; diese werden in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt mit einem Komma offen, weil der hebräische Bedingungssatz erst in Vers 14 fortgeführt wird. »Jahwe« folgt der üblichen deutschen Form des Gottesnamens; »Gebote«, »Herz« und »Seele« bewahren den deuteronomischen Bundeswortschatz, während die Fußnoten wesentliche Bedeutungsalternativen offenhalten.
