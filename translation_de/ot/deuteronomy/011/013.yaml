  naturalness: Der Satz bleibt als bis Vers 14 reichender Bedingungssatz bewusst offen und ist in modernem Standarddeutsch gut lesbar. »um ... zu lieben und ... zu dienen« ist idiomatisch und bildet die parallelen hebräischen Infinitive klarer ab als »indem«.
  terminology: »Jahwe«, »Gebote«, »dienen«, »Herz« und »Seele« sind im würdevollen deutschen Bibelregister angemessen. Die Fußnoten bewahren die wichtige Bedeutungsbreite von שמע und נפש. Die traditionelle Ersetzung des Namens durch »der HERR« wird zutreffend nur als Alternative genannt.
