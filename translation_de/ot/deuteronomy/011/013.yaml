revisions:
- from: Und wenn ihr wirklich auf meine Gebote hört, die ich euch heute gebe,[a] indem ihr Jahwe,[b] euren Gott, liebt und ihm mit eurem ganzen Herzen und mit eurer ganzen Seele[c] dient,
  to: Und wenn ihr wirklich auf meine Gebote hört, die ich euch heute gebiete,[a] um Jahwe,[b] euren Gott, zu lieben und ihm mit eurem ganzen Herzen und mit eurer ganzen Seele[c] zu dienen,
  rationale: Die Revision ersetzt die abgeschwächte Wiedergabe von מְצַוֶּה durch »gebiete« und gibt die beiden parallelen לְ-Infinitive mit einer im Deutschen natürlichen zielbezogenen Konstruktion wieder. Der offene Satzabschluss, die Fußnotenanker und die übrige Terminologie bleiben erhalten.
