base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: de
  text: und den Fluch, wenn ihr nicht auf die Gebote Jahwes, eures Gottes, hört[a] und von dem Weg abweicht, den ich euch heute zu gehen gebiete, um anderen Göttern zu folgen, die ihr nicht gekannt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Geboten Jahwes, eures Gottes, gehorcht“. Das hebräische Verb für „hören“ umfasst in diesem Bundeskontext häufig auch das Befolgen des Gehörten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: und den Fluch
  rationale: Der bestimmte Ausdruck steht parallel zum Segen im vorhergehenden Vers. Der Akkusativ ergibt sich im Deutschen aus dem übergreifenden Satzbau von Vers 26.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: wenn ihr nicht auf … hört
  rationale: Die Bedingung bleibt erhalten; „auf jemanden oder etwas hören“ gibt שׁמע אֶל natürlich wieder und lässt den mitgemeinten Gehorsam erkennen.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: „Gebote“ ist die übliche, verständliche Wiedergabe des pluralischen מִצְוָה im Bundeskontext.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwes, eures Gottes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Apposition bewahrt die Beziehung „euer Gott“ in natürlichem Deutsch.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: und von dem Weg abweicht
  rationale: Die Formulierung erhält das Bild des Abweichens von einem vorgeschriebenen Weg.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: den ich euch heute gebiete
  rationale: Das Partizip bezeichnet die gegenwärtige Weisung Moses; das deutsche Präsens ist hier natürlich und unmittelbar.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: indem ihr anderen Göttern folgt
  rationale: Der Infinitiv erläutert, worin das Abweichen besteht. „folgen“ gibt die hebräische Bewegungswendung idiomatisch wieder.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: die ihr nicht gekannt habt
  rationale: Das Perfekt wird als rückblickende Aussage wiedergegeben; „kennen“ bewahrt die relationale Offenheit des hebräischen Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar als Gottes Bundesname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: auf … hören
  alternative: gehorchen
  rationale: Im Bundeskontext schließt das Verb Gehorsam ein. Die formal nähere Wendung bewahrt jedoch das Bild des hörenden Annehmens, ohne den Sinn auf bloß akustisches Hören zu begrenzen.
- issue: Verhältnis des Abweichens zum Folgen anderer Götter
  choice: indem ihr anderen Göttern folgt
  alternative: um anderen Göttern zu folgen
  rationale: Der hebräische Infinitiv kann das Abweichen näher bestimmen oder dessen Folge beziehungsweise Ziel ausdrücken. „indem“ beschreibt den Inhalt des Abweichens, ohne eine bloße Absicht zwingend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Fortsetzung von Vers 26 syntaktisch fragmentarisch („und den Fluch“), wie es der hebräische Zusammenhang verlangt. Die Wegmetapher und die Bundesbegrifflichkeit bleiben erhalten.
