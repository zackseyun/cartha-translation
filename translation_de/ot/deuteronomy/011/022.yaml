  naturalness: Der Satz ist grundsätzlich modernes, würdevolles Standarddeutsch. Eine parallele Infinitivreihe nach dem Gedankenstrich ist idiomatischer und entspricht der offenen Reihung des Hebräischen besser. „An ihm festzuhalten“ gibt die Bildsprache von דבק präziser wieder als „euch an ihn haltet“.
  terminology: „Jahwe“ ist als Wiedergabe des Tetragramms konsequent. „Gebot“ bewahrt den hebräischen Singular. „Auf allen seinen Wegen gehen“ erhält die biblische Metapher ohne sie ausdeutend zu ersetzen.
