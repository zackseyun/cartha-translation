  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: de
  text: Denn wenn ihr dieses ganze Gebot, das ich euch zu tun gebiete, gewissenhaft befolgt – Jahwe, euren Gott, zu lieben, auf allen seinen Wegen zu gehen und an ihm festzuhalten –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Wendung führt mit Nachdruck eine Bedingung ein und knüpft zugleich an den vorherigen Zusammenhang an.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: gewissenhaft befolgt
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aufforderung; „gewissenhaft“ gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: dieses ganze Gebot
  rationale: Der hebräische Singular wird gewahrt und kann das Bundesgebot als zusammenhängenden Gesamtauftrag bezeichnen.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: das ich euch zu tun gebiete
  rationale: Die Formulierung bildet sowohl das gegenwärtige Gebieten als auch das konkrete Tun ab, ohne ein im Deutschen schwerfälliges zusätzliches Pronomen einzufügen.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: indem ihr Jahwe, euren Gott, liebt
  rationale: Die Infinitivreihe erläutert hier den Inhalt beziehungsweise die Weise des Befolgens. „Indem“ stellt diesen Zusammenhang im Deutschen klar, ohne ihn dogmatisch einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: auf allen seinen Wegen geht
  rationale: Das biblische Bild des Gehens als Lebensführung bleibt erhalten; „auf Wegen gehen“ ist im Deutschen idiomatischer als „in Wegen wandeln“.
- source_word: וּלְדָבְקָה בוֹ
  choice: und euch an ihn haltet
  rationale: דבק bezeichnet enges Festhalten und treue Verbundenheit. Die Wendung ist natürlich, gegenwärtig und bewahrt die relationale Kraft des Bildes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als persönlicher Bundesname.
- issue: Metaphorische Bundessprache bei „gehen“ und דבק
  choice: Die Bilder des Gehens und Sich-an-Gott-Haltens bewahren
  alternative: 'Deutend: nach Gottes Willen leben und ihm treu bleiben'
  rationale: Die konkreten Bilder tragen eigene theologische und relationale Bedeutung; eine vollständige Auflösung würde den Aussagegehalt unnötig verengen.
- issue: Verhältnis der Infinitive zum Befolgen des Gebots
  choice: Mit „indem“ als Erläuterung der Weise beziehungsweise des Inhalts wiedergeben
  alternative: 'Reine Zweckangabe: „um ... zu lieben“'
  rationale: Die hebräische Konstruktion lässt Zweck und inhaltliche Entfaltung anklingen. „Indem“ passt zum unmittelbaren Satzgefüge, ohne Liebe als bloßes Ergebnis des Gehorsams festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Singular „Gebot“ und die Bundesmetaphern bleiben erhalten. Der abschließende Gedankenstrich zeigt an, dass der Bedingungssatz im folgenden Vers fortgeführt wird.
