  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: de
  text: Dann wird Jahwes Zorn gegen euch entbrennen[a], und er wird den Himmel verschließen, sodass kein Regen fällt und der Boden keinen Ertrag bringt. Ihr werdet rasch aus dem guten Land verschwinden, das Jahwe euch gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahwes Nase wird gegen euch entbrennen“ – eine hebräische Redewendung für heftigen Zorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Dann wird Jahwes Zorn gegen euch entbrennen
  rationale: Die hebräische Verbindung חרה אף bezeichnet bildhaft das Entbrennen heftigen Zorns. „Zorn … entbrennen“ bewahrt das Bild und klingt im Deutschen natürlich. „Dann“ gibt den Folgezusammenhang des einleitenden Waw wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: und er wird den Himmel verschließen
  rationale: „Den Himmel verschließen“ bewahrt das hebräische Bild für das Ausbleiben des Regens; der deutsche Singular ist in dieser Wendung natürlicher als „die Himmel“.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: sodass kein Regen fällt
  rationale: Die Formulierung macht die im Zusammenhang erkennbare Folge des verschlossenen Himmels deutlich und ist idiomatisches Deutsch.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: und der Acker keinen Ertrag bringt
  rationale: אֲדָמָה meint hier den bebauten Erdboden und wird von הָאָרֶץ, dem Land, unterschieden. „Acker“ und „Ertrag bringen“ vermitteln den landwirtschaftlichen Sinn klar.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטֹּבָה
  choice: Dann werdet ihr schon bald aus dem guten Land verschwinden
  rationale: אבד kann hier Untergang beziehungsweise das Verschwinden aus dem Land bezeichnen. Zusammen mit מֵעַל bewahrt „aus dem Land verschwinden“ den Gedanken der Entfernung, ohne die konkrete Art des Gerichts festzulegen. „Schon bald“ gibt מְהֵרָה natürlich wieder.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: das Jahwe euch gibt
  rationale: Das Partizip נֹתֵן bezeichnet die gegenwärtig zugesagte und bevorstehende Gabe; das deutsche Präsens gibt dies knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Zorneswendung חרה אף
  choice: Jahwes Zorn wird gegen euch entbrennen
  alternative: Jahwe wird zornig auf euch sein
  rationale: Die gewählte Fassung erhält die Metapher des brennenden Zorns, ohne die Wendung wörtlich als „Nase“ wiederzugeben oder ihre Aussage abzuschwächen.
- issue: Bedeutung von אבד im Zusammenhang des Bundesgerichts
  choice: aus dem guten Land verschwinden
  alternative: im guten Land umkommen
  rationale: Der Zusatz מֵעַל הָאָרֶץ legt die Entfernung vom Land nahe. Die Fassung lässt offen, ob Tod, Vertreibung oder beides die konkrete Erfüllung bildet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Sprache des Hebräischen bleibt erhalten, während unnatürliche Hebraismen vermieden werden. „Acker“ und „Land“ unterscheiden אֲדָמָה von אֶרֶץ.
