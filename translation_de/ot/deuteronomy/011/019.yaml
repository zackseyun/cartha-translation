  rationale: Die Revision beschränkt sich auf die deutsche Verbfügung. »Euren Kindern beibringen« gibt das Lehren beziehungsweise Vermitteln der im Kontext vorausgesetzten Worte wieder, ohne deren Inhalt im Haupttext zu ergänzen. Pluralische Gemeinschaftsanrede am Satzanfang und anschließende singularische Anrede bleiben wie im hebräischen Text erhalten.
