    issue: Unnatürliche und mehrdeutige Rektion bei »sie eure Kinder lehren«
    rationale: Das Hebräische erlaubt bei למד zwei Akkusativobjekte; im Deutschen ist die entsprechende Stellung jedoch ungewöhnlich. »Ihr sollt sie euren Kindern beibringen« drückt denselben Sachverhalt natürlich aus und verhindert, dass »sie« als Objekt zu »Kinder« gelesen wird.
