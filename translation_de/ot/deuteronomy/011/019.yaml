review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge und den auffälligen Wechsel von pluralischer zu singularischer Anrede im Hebräischen zutreffend wieder. »Kinder« ist als umfassende Wiedergabe von בְּנֵיכֶם im Kontext vertretbar; die formnähere Alternative »Söhne« ist angemessen vermerkt. Die zeitlichen Wendungen sowie »von ihnen reden« bewahren den Bezug des pronominalen Objekts auf die vorausgehenden Weisungen/Worte.
  naturalness: Die Folge »Ihr sollt sie eure Kinder lehren« ist zwar als vorangestelltes Sachobjekt mit doppeltem Akkusativ grundsätzlich analysierbar, wirkt im modernen Standarddeutsch jedoch stark sperrig und ist leicht so misszuverstehen, dass »sie« die Kinder meint. Mit »euren Kindern beibringen« ist die Satzfügung idiomatisch und der Bezug klar.
  terminology: »Beibringen« ist hier eine sachgemäße moderne Entsprechung für למד im Sinn der Weitergabe von Weisung. Der Begriff trägt keine konfessionelle Vorentscheidung. Die Fußnote zu »Kinder/Söhne« ist terminologisch korrekt und hinreichend zurückhaltend.
  issues:
