  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: de
  text: Ihr sollt sie euren Kindern[a] beibringen und von ihnen reden, wenn du in deinem Haus sitzt und wenn du auf dem Weg gehst, wenn du dich hinlegst und wenn du aufstehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Söhne«. Die hebräische maskuline Pluralform kann hier stellvertretend für die Kinder insgesamt stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Ihr sollt … lehren
  rationale: Das Piel von למד bedeutet gewöhnlich »lehren«. Das vorangestellte ו setzt den Gedankengang fort, muss im Deutschen aber nicht eigens mit »und« wiedergegeben werden. Der Plural richtet sich an die Gemeinschaft.
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist auf die zuvor genannten Worte beziehungsweise Gebote. Die Übersetzung bewahrt den Rückverweis, ohne den Bezug im Haupttext unnötig auszuschreiben.
- source_word: אֶת־בְּנֵיכֶם
  choice: eure Kinder
  rationale: בנים kann enger »Söhne« oder umfassender »Kinder« bezeichnen. Im Zusammenhang der Weitergabe der Bundesunterweisung bezeichnet es den Nachwuchs allgemein; die lexikalische Alternative wird in einer Fußnote festgehalten.
- source_word: לְדַבֵּר בָּם
  choice: und von ihnen reden
  rationale: Der Infinitiv mit ל beschreibt die begleitende Tätigkeit beziehungsweise Weise des Lehrens. »Von ihnen reden« ist natürliches Deutsch und wahrt den pronominalen Bezug auf die Worte oder Gebote.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: wenn du in deinem Haus sitzt
  rationale: ב mit Infinitivkonstrukt bezeichnet den zeitlichen Umstand. Der Singular des hebräischen Textes wird beibehalten.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: und wenn du auf dem Weg gehst
  rationale: הלך bedeutet hier gewöhnlich »gehen«. »Auf dem Weg« gibt בַדֶּרֶךְ idiomatisch und zugleich quellennah wieder.
- source_word: וּבְשָׁכְבְּךָ
  choice: wenn du dich hinlegst
  rationale: Das Infinitivkonstrukt von שכב mit ב bezeichnet einen weiteren zeitlichen Rahmen. Die reflexive deutsche Form ist natürlich und bleibt der konkreten Bildsprache treu.
- source_word: וּבְקוּמֶךָ
  choice: und wenn du aufstehst
  rationale: קום bezeichnet das Aufstehen. »Aufstehst« bildet mit »dich hinlegst« ein klares, idiomatisches Gegensatzpaar.
theological_decisions:
- issue: Geschlechtlicher Umfang von בְּנֵיכֶם
  choice: eure Kinder
  alternative: eure Söhne
  rationale: Die maskuline Pluralform kann im Hebräischen die Nachkommenschaft repräsentativ bezeichnen. Im Zusammenhang der Bundesunterweisung ist eine Beschränkung auf männliche Kinder nicht ausdrücklich markiert; »Kinder« gibt daher den wahrscheinlichen Umfang wieder, während »Söhne« als formnähere Alternative in der Fußnote erhalten bleibt.
- issue: Wechsel zwischen Plural und Singular der Anrede
  choice: Plural bei »Ihr sollt … eure Kinder«, danach Singular bei »du … dein«
  alternative: Durchgehend pluralisierte oder singularisierte Anrede
  rationale: Der hebräische Text wechselt bewusst von der pluralischen Gemeinschaftsanrede וְלִמַּדְתֶּם/בְּנֵיכֶם zur singularischen Anrede in den folgenden Wendungen. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzmelodie. Der auffällige Wechsel von pluralischer zu singularischer Anrede bleibt erhalten; dadurch entsteht im Deutschen dieselbe Spannung zwischen der angesprochenen Gemeinschaft und dem einzelnen Mitglied.
