  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: de
  text: Das Land aber, in das ihr hinüberzieht, um es in Besitz zu nehmen[a], ist ein Land mit Bergen und Tälern. Es trinkt Wasser vom Regen des Himmels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um es zu erben«. Das hebräische Verb kann im Zusammenhang des Bundes sowohl Besitzergreifung als auch Erbschaft anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der Himmel«; im Hebräischen steht der Ausdruck grammatisch im Plural und kann den Himmel beziehungsweise den Himmelsraum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Das Land aber
  rationale: Das Waw setzt das Land in einen Kontrast zu Ägypten im vorhergehenden Vers. Die Nachstellung von »aber« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: עֹבְרִים שָׁמָּה
  choice: in das ihr hinüberzieht
  rationale: Das Partizip bezeichnet den bevorstehenden beziehungsweise bereits begonnenen Übergang in das Land; das Richtungsadverb wird durch »in das« natürlich ausgedrückt.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: Die Wendung bewahrt die aktive Bedeutung von ירשׁ im Zusammenhang mit Israels Einzug; zugleich wird die mögliche Bundes- und Erbkomponente in einer Fußnote offengehalten.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: ein Land mit Bergen und Tälern
  rationale: »Berge und Täler« bildet den Geländegegensatz klar ab; »mit« klingt im modernen Deutschen natürlicher als das mögliche »ein Land der Berge und Täler«.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: vom Regen des Himmels
  rationale: Die Formulierung gibt Mittel beziehungsweise Quelle des Wassers wieder. Der grammatische Plural שָׁמַיִם wird im Deutschen idiomatisch durch den kollektiven Singular »Himmel« wiedergegeben.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: Es trinkt Wasser
  rationale: Die Personifikation des Landes bleibt erhalten und wird nicht zum abstrakten »wird bewässert« verflacht.
theological_decisions:
- issue: Bedeutung von ירשׁ im Bundeszusammenhang
  choice: in Besitz nehmen
  alternative: als Erbe empfangen / erben
  rationale: Der unmittelbare Zusammenhang betont Israels aktiven Übergang und die Besitzergreifung. Da das Verb zugleich Erbvorstellungen anklingen lassen kann, wird diese Bedeutung als echte Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Aussage, dass das Land Wasser »trinkt«, bleibt erhalten. Die Satzteilung vermeidet einen schwerfälligen deutschen Semikolon-Satz, ohne den Gedankengang zu verändern.
