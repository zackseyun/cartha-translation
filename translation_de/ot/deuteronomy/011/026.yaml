base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: de
  text: Sieh, ich lege euch heute Segen und Fluch vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich „geben“. In Verbindung mit „vor euch“ bezeichnet es hier das Vorlegen von Alternativen; „vorlegen“ ist im Deutschen idiomatisch.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Singularimperativ lenkt nachdrücklich die Aufmerksamkeit der gesamten Hörerschaft auf die folgende Gegenüberstellung. „Sieh“ bewahrt Numerus und Befehlsform, ohne altertümlich zu klingen.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Personalpronomen hebt den Sprecher hervor; das ausdrücklich gesetzte „ich“ gibt dies im Deutschen angemessen wieder, ohne durch „ich selbst“ zu überbetonen.
- source_word: נֹתֵן
  choice: lege … vor
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“. Zusammen mit לִפְנֵיכֶם bezeichnet es hier idiomatisch das Vorlegen zweier Alternativen.
- source_word: לִפְנֵיכֶם
  choice: euch … vor
  rationale: Die Verbindung mit נתן wird im modernen Deutschen natürlich durch das trennbare Verb „vorlegen“ wiedergegeben; das Suffix ist pluralisch.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der temporalen Bestimmung.
- source_word: בְּרָכָה
  choice: Segen
  rationale: Der artikellose Singular wird im Deutschen in dieser antithetischen Paarung natürlich ohne unbestimmten Artikel wiedergegeben.
- source_word: וּקְלָלָה
  choice: und Fluch
  rationale: Die koordinierte Gegenüberstellung zu „Segen“ bleibt knapp und formal parallel erhalten.
theological_decisions:
- issue: Charakter der Gegenüberstellung von Segen und Fluch
  choice: Als zwei vorgelegte Bundesalternativen wiedergeben, ohne sie im Vers näher auszudeuten.
  alternative: Als allgemeines Prinzip von Belohnung und Bestrafung paraphrasieren.
  rationale: Der Vers eröffnet im deuteronomischen Zusammenhang die Gegenüberstellung von Segen und Fluch. Eine weitergehende dogmatische Erklärung wäre ein Zusatz zum Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Singular „Sieh“ folgt dem hebräischen Imperativ, während „euch“ die angesprochene Gemeinschaft bezeichnet. Die knappe Paarung „Segen und Fluch“ bewahrt die rhetorische Spannung.
