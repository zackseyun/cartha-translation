source:
  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: de
  text: Liegen sie nicht jenseits des Jordan[a], hinter dem Weg zum Sonnenuntergang[b], im Land der Kanaaniter, die in der Araba wohnen, gegenüber von Gilgal, bei den Eichen von More[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Jordan“. Die hebräische geografische Wendung hängt in ihrer genauen Bedeutung vom Standort des Betrachters ab.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „hinter dem Weg des Eingangs der Sonne“; gemeint ist eine Richtung nach Westen, zum Sonnenuntergang hin.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bei den Terebinthen von More“. Das hebräische Wort kann große Bäume beider Arten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Liegen sie nicht
  rationale: Die rhetorische Frage erwartet Zustimmung; das Pluralpronomen verweist auf die beiden Berge im vorigen Vers. „Liegen“ ist bei geografischen Orten im Deutschen natürlicher als ein bloßes „sind“.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Bewahrt die hebräische geografische Wendung, ohne den Bezugspunkt eindeutiger festzulegen, als es der Ausgangstext tut.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: hinter dem Weg zum Sonnenuntergang
  rationale: Gibt אַחֲרֵי als „hinter“, דֶּרֶךְ als „Weg“ und die bildhafte Richtungsangabe des Sonnenuntergangs wieder, ohne sie stillschweigend auf eine bloße Himmelsrichtung zu reduzieren.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: im Land der Kanaaniter
  rationale: Der singularische hebräische Volksname wird im Deutschen idiomatisch kollektiv im Plural wiedergegeben.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: die in der Araba wohnen
  rationale: Das kollektiv gebrauchte Partizip wird passend zu „Kanaaniter“ pluralisch wiedergegeben; „Araba“ bleibt als geografische Bezeichnung erhalten.
- source_word: מוּל הַגִּלְגָּל
  choice: gegenüber von Gilgal
  rationale: Drückt die räumliche Beziehung in natürlichem modernem Deutsch aus; der Ortsname wird transliteriert.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: bei den Eichen von More
  rationale: „Bei“ bezeichnet die Nähe klar. אֵלוֹן kann eine Eiche oder Terebinthe bezeichnen; die botanische Unsicherheit wird in einer Fußnote bewahrt.
