base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: de
  text: Darum haltet das ganze Gebot[a], das ich dir heute gebiete, damit ihr stark werdet[b] und hineinzieht und das Land in Besitz nehmt, in das ihr hinüberzieht, um es in Besitz zu nehmen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Singular „Gebot“ kann hier die Gesamtheit der Gebote bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit ihr erstarkt“ beziehungsweise „gestärkt werdet“.'
    reason: lexical_alternative
  - marker: c
    text: Für „in Besitz nehmen“ ist auch „erben“ möglich; dasselbe hebräische Verb steht an beiden Stellen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Darum haltet
  rationale: שׁמר bezeichnet im Zusammenhang mit Bundesgeboten deren treue Befolgung. „Darum“ gibt den folgernden Anschluss an den vorausgehenden Kontext natürlich wieder.
- source_word: כָּל הַמִּצְוָה
  choice: das ganze Gebot
  rationale: Der hebräische Singular מִצְוָה mit כָּל wird formal bewahrt und zugleich als Sammelbegriff für die Gesamtheit der Weisung verständlich gemacht.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: das ich dir heute gebe
  rationale: Das singularische Suffix wird mit „dir“ bewahrt und zeigt Israel als korporativ angesprochenes Gegenüber. „Ein Gebot geben“ ist im Deutschen natürlicher als „gebieten“, ohne den verpflichtenden Sinn abzuschwächen.
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise mögliche Folgebeziehung knapp und idiomatisch wieder.
- source_word: תֶּחֶזְקוּ
  choice: ihr stark seid
  rationale: Der Qal von חזק bezeichnet hier Stärke beziehungsweise Erstarken für die bevorstehende Landnahme; die Formulierung vermeidet eine unnötige Festlegung auf ausschließlich militärischen Mut.
- source_word: וּבָאתֶם
  choice: und hineinzieht
  rationale: בוא bezeichnet im Kontext den Eintritt in das Land. „Hineinziehen“ passt zur gemeinsamen Bewegung Israels und zum folgenden Hinüberziehen.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: und das Land in Besitz nehmt ... um es in Besitz zu nehmen
  rationale: ירשׁ kann erben, besitzen, vertreiben oder in Besitz nehmen bedeuten. Die wiederholte Wendung erhält die lexikalische Wiederaufnahme und passt zum aktiven Eintritt in das Land.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: in das ihr hinüberzieht
  rationale: Die Richtungskraft von שָׁמָּה ist im deutschen „in das“ bereits enthalten; ein zusätzliches „dorthin“ wäre schwerfällig. „Hinüberziehen“ spiegelt den bevorstehenden Übergang über den Jordan.
theological_decisions:
- issue: Wechsel zwischen singularischer und pluralischer Anrede Israels
  choice: „dir“ im Relativsatz, sonst „ihr“
  alternative: Die Anrede durchgehend in den Plural setzen
  rationale: Das Hebräische wechselt vom singularischen Suffix in מְצַוְּךָ zu pluralischen Verbformen. Der Wechsel wird bewahrt, weil Israel zugleich als Einheit und als Gemeinschaft angesprochen wird, ohne diese Spannung erklärend aufzulösen.
- issue: Bedeutungsbreite von ירשׁ
  choice: „in Besitz nehmen“
  alternative: „erben“ oder „vertreiben und besitzen“
  rationale: „In Besitz nehmen“ erfasst in diesem Satz sowohl Ziel als auch aktiven Vorgang, ohne die mögliche Erbvorstellung auszuschließen oder ein nicht ausdrücklich genanntes Objekt des Vertreibens einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von singularischer zu pluralischer Anrede sowie die Wiederholung von „in Besitz nehmen“ folgen bewusst der hebräischen Form. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Textstellen.
