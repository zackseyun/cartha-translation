  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: de
  text: und seine Zeichen und seine Taten, die er mitten in Ägypten gegenüber dem Pharao, dem König von Ägypten, und dessen ganzem Land[a] vollbrachte –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen den Pharao … und gegen dessen ganzes Land«; die hebräische Präposition bedeutet wörtlich »zu/für«, bezeichnet hier aber diejenigen, auf die sich die Taten richten beziehungsweise die von ihnen betroffen sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: seine Zeichen
  rationale: אוֹת bezeichnet ein Zeichen, Kennzeichen oder Vorzeichen. »Zeichen« gibt den Ausdruck direkt und ohne die interpretierende Ergänzung »Wunder-« wieder.
- source_word: מַעֲשָׂיו
  choice: seine Taten
  rationale: מַעֲשֶׂה bezeichnet etwas Getanes, eine Handlung oder Tat. »Taten« ist im modernen Deutsch natürlich und bewahrt den konkreten Sinn.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er … vollbrachte
  rationale: Die Relativkonstruktion bezieht sich auf Zeichen und Taten. »Vollbrachte« vermeidet im Deutschen die schwerfällige Wiederholung »Taten, die er tat« und gibt עשה in diesem Zusammenhang idiomatisch wieder.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: mitten in Ägypten
  rationale: בְּתוֹךְ bedeutet wörtlich »in der Mitte/inmitten«. »Mitten in Ägypten« bewahrt diese räumliche Hervorhebung und klingt zugleich natürlich.
- source_word: לְפַרְעֹה
  choice: am Pharao
  rationale: לְ kennzeichnet hier das Ziel beziehungsweise den Betroffenen der Taten. Die deutsche Wendung »etwas an jemandem vollbringen/tun« bewahrt die formale Weite besser als das ausdrücklich feindliche »gegen«.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: dem König von Ägypten
  rationale: Standardmäßige Wiedergabe der hebräischen Status-constructus-Verbindung; die Apposition wird im Deutschen passend flektiert.
- source_word: וּלְכָל אַרְצוֹ
  choice: und an seinem ganzen Land
  rationale: Die Wiederholung von לְ wird durch »an« erhalten. »Seinem ganzen Land« gibt כָּל und das Possessivsuffix natürlich wieder.
- source_word: וְאֶת ... וְאֶת
  choice: und … und
  rationale: Die wiederholte Verbindung knüpft die Objekte an den vorherigen Satz an. Da אֵת im Deutschen nicht eigens wiedergegeben wird, bleibt die Koordination durch »und« erhalten.
theological_decisions:
- issue: Richtung der göttlichen Taten gegenüber dem Pharao und seinem Land
  choice: am Pharao … und an seinem ganzen Land
  alternative: gegen den Pharao … und gegen sein ganzes Land
  rationale: Der Gerichtskontext lässt »gegen« zu, doch die Präposition לְ ist weiter. »An« wahrt die Ziel- beziehungsweise Betroffenenrelation, ohne die im Kontext erkennbare Feindrichtung ausdrücklich in die Präposition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mitten in Ägypten« bewahrt die Bildhaftigkeit des Hebräischen; »vollbrachte« sorgt für eine natürliche Formulierung ohne die tautologische Wendung »Taten, die er tat«. Der Gedankenstrich zeigt wie im Ausgangstext an, dass der Satz in den folgenden Vers hinein weiterläuft.
