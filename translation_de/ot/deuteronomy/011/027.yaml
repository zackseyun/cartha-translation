  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: de
  text: den Segen[a], wenn ihr auf die Gebote Jahwes, eures Gottes, hört[b], die ich euch heute gebiete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „den Segen, der euch zuteilwird, wenn ihr …“ Das hebräische Relativwort hat hier konditionalen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „gehorcht“. Das hebräische Verb bezeichnet häufig ein Hören, das zu entsprechendem Handeln führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: den Segen
  rationale: Der Akkusativ setzt die elliptische Gegenüberstellung aus Vers 26 fort. Die knappe Form bewahrt diesen Satzanschluss, ohne im Hebräischen nicht ausdrücklich Gesagtes zu ergänzen.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Das formal relative Anschlusswort hat hier im Zusammenhang konditionalen Sinn und bezeichnet die Bedingung, unter der der Segen gilt.
- source_word: תִּשְׁמְעוּ אֶל
  choice: ihr auf … hört
  rationale: Die Verbindung bezeichnet aufmerksames Hören, das im Bundeszusammenhang gehorsames Handeln einschließt. „Auf … hört“ bewahrt sowohl den Höraspekt als auch die mitschwingende Verpflichtung.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: „Gebote“ ist die präzise und im rechtlich-bundestheologischen Zusammenhang geläufige Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des hebräischen Gottesnamens erhält den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Die Genitivform gibt den Possessivsuffix der zweiten Person Plural natürlich wieder und steht als Apposition zu „Jahwes“.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: die ich euch heute gebiete
  rationale: Das Relativpronomen bezieht sich auf „Gebote“; das Präsens gibt den gegenwärtigen Redeakt des Mose wieder, und „heute“ wahrt dessen unmittelbare Dringlichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Form, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Verhältnis von Hören und Gehorsam in תִּשְׁמְעוּ
  choice: auf die Gebote … hört
  alternative: den Geboten … gehorcht
  rationale: Das Verb bezeichnet zunächst Hören, trägt hier jedoch den Sinn einer gehorsamen Reaktion mit. Die Hauptfassung erhält diese Bedeutungsbreite; die Fußnote nennt die explizitere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Eröffnung wird als Anschluss an Vers 26 beibehalten. „Gebieten“ trägt den rechtlichen Ernst des Zusammenhangs, ohne altertümlich zu wirken; die Kommas um „eures Gottes“ kennzeichnen die Apposition.
