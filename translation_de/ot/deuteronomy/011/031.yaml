id: DEU.11.31
reference: Deuteronomy 11:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: de
  text: Denn ihr überquert den Jordan, um in das Land zu kommen und es in Besitz zu nehmen, das Jahwe[a], euer Gott, euch gibt; ihr werdet es in Besitz nehmen und darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Ermahnung ein und bewahrt den verbindenden Charakter des hebräischen Satzes.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: ihr überquert den Jordan
  rationale: Das Qal-Partizip bezeichnet hier eine unmittelbar bevorstehende beziehungsweise als gegenwärtig dargestellte Handlung; das Präsens gibt dies im Deutschen natürlich wieder.
- source_word: לָבֹא לָרֶשֶׁת
  choice: um in das Land zu kommen und es in Besitz zu nehmen
  rationale: Die beiden Infinitive bezeichnen das Ziel des Überschreitens. Die Formulierung erhält die hebräische Abfolge von Hineinkommen und Besitzergreifen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bezeichnet im Kontext das Israel zugesagte Land; „Land“ ist die übliche und sachlich passende Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen JHWH wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Entspricht der Constructusverbindung mit dem Suffix der zweiten Person Plural.
- source_word: נֹתֵן לָכֶם
  choice: euch gibt
  rationale: Das Partizip stellt die Gabe als gegenwärtig und gewiss dar; das deutsche Präsens bewahrt diese Aussage ohne unnötige Verdeutlichung.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: ihr werdet es in Besitz nehmen
  rationale: Die Verbform führt die erwartete Ereignisfolge fort. „In Besitz nehmen“ trifft den landbezogenen Sinn von ירשׁ und wird innerhalb des Verses einheitlich verwendet.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: und darin wohnen
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen im Land. „Wohnen“ ist modernes, würdevolles Standarddeutsch und enger am hebräischen Ausdruck als eine ausdrückliche Festlegung auf „sich ansiedeln“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „in Besitz nehmen“ bildet die Wiederholung desselben hebräischen Verbs ab; „darin wohnen“ vermeidet sowohl altertümliches „darin weilen“ als auch die stärkere Festlegung von „sich dort ansiedeln“.
