base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: de
  text: 'Und erkennt heute: Ich rede nicht zu euren Kindern, die die Erziehung Jahwes, eures Gottes, sowie seine Größe, seine starke Hand und seinen ausgestreckten Arm weder kennengelernt noch gesehen haben –'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: Und erkennt heute
  rationale: Das Qal Perfekt mit vorangestelltem וְ dient hier im Redefluss als nachdrücklicher Aufruf. „Erkennt heute“ wahrt die direkte Anrede und die zeitliche Unmittelbarkeit.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: Ich rede nicht zu euren Kindern
  rationale: Der hebräische Ausdruck ist elliptisch („denn nicht eure Kinder“). Die Ergänzung macht im Deutschen den aus dem Zusammenhang hervorgehenden Gegensatz zwischen den Angeredeten und ihren Kindern verständlich, ohne den Bezug sachlich zu erweitern.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: die … nicht kennengelernt und nicht gesehen haben
  rationale: יָדַע bezeichnet hier erfahrungsbezogenes Kennen. Das Perfekt „haben … kennengelernt und … gesehen“ bringt zum Ausdruck, dass den Kindern diese eigene Erfahrung fehlt.
- source_word: מוּסַר
  choice: Erziehung
  rationale: מוּסַר umfasst formende Unterweisung, Zurechtweisung und Disziplin. „Erziehung“ ist im modernen Deutschen verständlich und bewahrt den pädagogisch-korrigierenden Sinn, ohne ihn auf Bestrafung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen üblichen transliterierten Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גָּדְלוֹ
  choice: seine Größe
  rationale: Die direkte Wiedergabe bezeichnet Jahwes in seinen Taten sichtbar gewordene Größe.
- source_word: יָדוֹ הַחֲזָקָה
  choice: seine starke Hand
  rationale: Die Formulierung bildet חֲזָקָה transparent ab und bewahrt zugleich das hebräische Bild für wirksame göttliche Macht.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: seinen ausgestreckten Arm
  rationale: Die etablierte Bildsprache für Jahwes aktiv ausgeübte Macht wird wörtlich und im Deutschen verständlich wiedergegeben.
theological_decisions:
- issue: Elliptischer Gegensatz zu „euren Kindern“
  choice: Ergänzung „Ich rede nicht zu“ im Haupttext
  alternative: „Denn nicht eure Kinder sind es, die …“
  rationale: Im Hebräischen fehlt nach „nicht eure Kinder“ das regierende Verb. Der Zusammenhang stellt die gegenwärtigen Augenzeugen der nachfolgenden Generation gegenüber. Die Ergänzung verdeutlicht diese Redeebene, während die Fußnote die Ellipse offenlegt.
- issue: Bedeutungsumfang von מוּסַר
  choice: Erziehung
  alternative: Zurechtweisung; Züchtigung; Unterweisung
  rationale: Der Kontext spricht von Jahwes formendem und korrigierendem Handeln an Israel. „Erziehung“ hält pädagogische und disziplinierende Aspekte zusammen und vermeidet eine einseitige Festlegung auf Strafe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die Satzstruktur bleibt wegen der Fortsetzung in Vers 3 bewusst offen; Gedankenstriche markieren den weiterführenden Aufzählungscharakter. Der Gottesname erscheint als „Jahwe“.
