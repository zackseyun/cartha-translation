revisions:
- from: 'Und erkennt heute: Ich rede nicht zu euren Kindern, die die Erziehung durch Jahwe, euren Gott, nicht kennengelernt und nicht gesehen haben[a] – seine Größe, seine starke Hand[b] und seinen ausgestreckten Arm –'
  to: 'Und erkennt heute: Ich rede nicht zu euren Kindern, die die Erziehung Jahwes, eures Gottes, sowie seine Größe, seine starke Hand und seinen ausgestreckten Arm weder kennengelernt noch gesehen haben –'
  rationale: Die Revision ordnet sämtliche Objekte eindeutig beiden Verben zu und ersetzt die präpositionale Umschreibung durch den dem Hebräischen entsprechenden Genitiv. Die erklärende Ergänzung zur Ellipse, der offene Satzanschluss und die vorhandenen Anmerkungsanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:43Z'
review_pass:
  verdict: revise
  source_fidelity: Die Ergänzung „Ich rede nicht zu euren Kindern“ gibt die im Hebräischen elliptisch ausgedrückte Gegenüberstellung im gegebenen Kontext vertretbar wieder und wird durch die Anmerkung transparent gemacht. Die Aufzählung sollte jedoch syntaktisch eindeutig als gemeinsames Objekt von „kennengelernt“ und „gesehen“ kenntlich sein. „Erziehung Jahwes“ gibt den hebräischen Genitiv unmittelbarer wieder als „Erziehung durch Jahwe“.
  naturalness: Die vorliegende Fassung ist grundsätzlich verständlich, doch die Stellung von „nicht“ sowie die eingeschobenen Gedankenstriche lassen offen, ob „seine Größe, seine starke Hand und seinen ausgestreckten Arm“ noch zu beiden Verben gehören. Eine Umstellung ergibt einen flüssigen, modernen deutschen Satz bei unverändert offenem Anschluss an Vers 3.
  terminology: „Jahwe“, „Erziehung“, „Größe“, „starke Hand“ und „ausgestreckter Arm“ sind sachgerecht. „Starke Hand“ bewahrt die Nähe zu חֲזָקָה; die lexikalische Alternative „mächtige Hand“ kann in der Fußnote bleiben.
  issues:
  - severity: medium
    issue: Unklare syntaktische Zuordnung der Aufzählung und der Verneinung
    rationale: In „die die Erziehung durch Jahwe ... nicht kennengelernt und nicht gesehen haben – seine Größe ...“ ist nicht eindeutig, ob die nach dem Gedankenstrich folgenden Ausdrücke noch von beiden Verben abhängen. Das Hebräische bezieht sowohl „kennen“ als auch „sehen“ auf die gesamte folgende Reihe.
  - severity: low
    issue: „Erziehung durch Jahwe“ schwächt die genitivische Zuordnung ab
    rationale: מוּסַר יְהוָה אֱלֹהֵיכֶם ist unmittelbar „die Erziehung/Unterweisung Jahwes, eures Gottes“. „Durch“ ist zwar sinngemäß möglich, kann im Deutschen aber stärker den Urheber eines Vorgangs als die Jahwe zugehörige Erziehung hervorheben.
  revised_text: 'Und erkennt heute: Ich rede nicht zu euren Kindern, die die Erziehung Jahwes, eures Gottes, sowie seine Größe, seine starke Hand und seinen ausgestreckten Arm weder kennengelernt noch gesehen haben –'
  revised_footnotes:
  - marker: a
    text: 'Im Hebräischen steht verkürzt: „denn nicht eure Kinder, die nicht kennengelernt und nicht gesehen haben …“ Gemeint ist: Mose spricht zu denen, die Jahwes Handeln selbst miterlebt haben, nicht zur nachfolgenden Generation.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mächtige Hand“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ordnet sämtliche Objekte eindeutig beiden Verben zu und ersetzt die präpositionale Umschreibung durch den dem Hebräischen entsprechenden Genitiv. Die erklärende Ergänzung zur Ellipse, der offene Satzanschluss und die vorhandenen Anmerkungsanker bleiben erhalten.
