  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: de
  text: Und ich werde auf deinem Feld Gras[a] für dein Vieh wachsen lassen; dann wirst du essen und satt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pflanzenwuchs“ beziehungsweise „Kräuter“. Das hebräische Wort kann Pflanzenwuchs allgemein bezeichnen; hier ist wahrscheinlich Viehfutter gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „gesättigt sein“. Das hebräische Verb bezeichnet, dass man nach dem Essen satt beziehungsweise gesättigt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … wachsen lassen
  rationale: Das Qal Perfekt der 1. Person Singular bezeichnet im Zusammenhang der Verheißung Zukünftiges. Bei Gras ist „wachsen lassen“ im Deutschen die natürliche Wiedergabe von „geben“, ohne den Gedanken göttlicher Versorgung zu erweitern.
- source_word: עֵשֶׂב
  choice: Gras
  rationale: Der Ausdruck kann allgemein Pflanzenwuchs bezeichnen; durch die Bestimmung „für dein Vieh“ ist hier Futterwuchs gemeint. „Gras“ ist dafür klar und idiomatisch.
- source_word: בְּשָׂדְךָ
  choice: auf deinem Feld
  rationale: שָׂדֶה bezeichnet hier konkret das landwirtschaftlich genutzte Feld. Im Deutschen heißt es bei Pflanzenwuchs natürlich „auf deinem Feld“.
- source_word: לִבְהֶמְתֶּךָ
  choice: für dein Vieh
  rationale: בְּהֵמָה steht kollektiv für domestizierte Nutztiere. „Vieh“ bewahrt diesen kollektiven Sinn knapp und in heutiger Standardsprache.
- source_word: וְאָכַלְתָּ
  choice: dann wirst du essen
  rationale: Die 2. Person maskulin Singular wird als Bundesanrede an Israel beibehalten. „Dann“ macht die sachliche Folge im Deutschen deutlich, die durch die hebräische Satzverknüpfung getragen wird.
- source_word: וְשָׂבָעְתָּ
  choice: und satt werden
  rationale: Das Verb bezeichnet das Satt- beziehungsweise Erfülltsein nach dem Essen. „Satt werden“ ist natürlich und wahrt den konkreten Zusammenhang der Nahrung.
theological_decisions:
- issue: Israel wird als kollektive Größe im Singular angeredet
  choice: 'Die zweite Person Singular bleibt erhalten: „deinem“, „dein“, „du“.'
  alternative: Eine pluralische Wiedergabe wie „euren Feldern … euer Vieh … ihr“
  rationale: Der hebräische Text verwendet durchgehend den maskulinen Singular. Seine Beibehaltung wahrt Form und rhetorische Kraft der Bundesanrede.
- issue: Art der verheißenen Segnung
  choice: Die Aussage bleibt auf die konkrete landwirtschaftliche Versorgung und das Sattwerden beschränkt.
  alternative: Eine ausdrückliche Ausweitung auf allgemeinen Wohlstand oder Überfluss
  rationale: Der Vers nennt Futter für das Vieh sowie Nahrung, die satt macht. Weitergehende Wohlstandsvorstellungen stehen nicht ausdrücklich im Text.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstellung ist natürlich deutsch, der konkrete landwirtschaftliche Wortlaut und die singularische Bundesanrede bleiben erhalten. Das Semikolon trennt Versorgung und Folge, ohne ihren Zusammenhang aufzulösen.
