  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: de
  text: Denn ihr habt mit eigenen Augen das ganze große Werk gesehen, das Jahwe getan hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn eure Augen, die sehen“; die hebräische Formulierung hebt hervor, dass die Angesprochenen selbst Augenzeugen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung; „Denn“ bewahrt diesen erklärenden Anschluss im Deutschen.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: ihr habt mit eigenen Augen … gesehen
  rationale: Die markierte hebräische Wendung („eure Augen, die sehenden“) betont die unmittelbare Augenzeugenschaft. Die deutsche Formulierung gibt diese Betonung natürlich wieder.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: all das … Werk
  rationale: Der Singular kann hier die Gesamtheit von Jahwes Handeln bezeichnen; „all das Werk“ erhält diesen kollektiven Singular.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַגָּדֹל
  choice: große
  rationale: Die direkte Bedeutung ist „groß“; das Adjektiv beschreibt das Werk nach Umfang und Bedeutung, ohne ausdrücklich „mächtig“ einzutragen.
- source_word: אֲשֶׁר עָשָׂה
  choice: das … getan hat
  rationale: Die Relativkonstruktion und das Qal-Perfekt werden schlicht und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mit eigenen Augen“ bringt die hebräische Hervorhebung idiomatisch zum Ausdruck; der kollektive Singular „Werk“ bleibt erhalten.
