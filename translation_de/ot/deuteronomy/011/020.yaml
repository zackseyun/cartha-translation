  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: de
  text: Und du sollst sie auf die Türpfosten deines Hauses und an deine Tore schreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an deine Toranlagen“. Das hebräische Wort kann sowohl die Tore selbst als auch den Bereich am Tor bezeichnen.'
