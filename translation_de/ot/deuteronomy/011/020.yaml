lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Und du sollst sie schreiben
  rationale: Das Qal-Perfekt mit vorangestelltem וּ setzt in diesem Anweisungszusammenhang die Reihe der Bundesgebote fort. „Du sollst“ gibt die verpflichtende Kraft angemessen wieder; das Suffix der 3. Person maskulin Plural verweist auf die zuvor genannten Worte.
- source_word: עַל מְזוּזוֹת
  choice: auf die Türpfosten
  rationale: עַל bezeichnet hier die Anbringung auf einer Oberfläche; מְזוּזוֹת meint die seitlichen Pfosten eines Eingangs. „Türpfosten“ ist konkret, verständlich und vermeidet eine Übertragung aus späterer jüdischer Praxis.
- source_word: בֵּיתֶךָ
  choice: deines Hauses
  rationale: בַּיִת bezeichnet hier konkret das Haus und damit den häuslichen Bereich.
- source_word: וּבִשְׁעָרֶיךָ
  choice: und an deine Tore
  rationale: שַׁעַר bezeichnet Tore beziehungsweise den Torbereich. Das בְּ wird mit „an“ natürlich wiedergegeben und lässt offen, ob die Toranlage oder ihre konkrete Oberfläche gemeint ist.
