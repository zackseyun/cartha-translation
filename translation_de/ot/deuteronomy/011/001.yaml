base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: de
  text: Deshalb[a] sollst du Jahwe, deinen Gott, lieben und seine Vorschriften, seine Satzungen, seine Rechtsbestimmungen[b] und seine Gebote halten – allezeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du sollst Jahwe, deinen Gott, lieben.“ Das hebräische Bindewort kann einfach „und“ bedeuten; hier wird es aufgrund des vorausgehenden Zusammenhangs folgernd als „deshalb“ verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seine Rechtssprüche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Deshalb sollst du … lieben
  rationale: אָהַב bedeutet „lieben“. Das vorangestellte וְ verbindet den Vers mit dem vorhergehenden Gedankengang und kann hier folgernd als „deshalb“ wiedergegeben werden; die schlichte Bedeutung „und“ bleibt in einer Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Die Konstruktform mit Suffix der 2. Person Singular bezeichnet „deinen Gott“ und bewahrt die im Hebräischen ausgedrückte Bundesbeziehung.
- source_word: וְשָׁמַרְתָּ מִשְׁמַרְתּוֹ
  choice: und dich an das halten, was er dir aufgetragen hat
  rationale: שׁמר bezeichnet „bewahren, einhalten, befolgen“, מִשְׁמֶרֶת einen anvertrauten Auftrag oder eine einzuhaltende Verpflichtung. Die Formulierung gibt die verwandten hebräischen Wörter verständlich und idiomatisch wieder.
- source_word: חֻקֹּתָיו
  choice: seine Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften oder Satzungen; „Satzungen“ erhält den rechtlichen Charakter und die Unterscheidung von den benachbarten Begriffen.
- source_word: וּמִשְׁפָּטָיו
  choice: seine Rechtsbestimmungen
  rationale: מִשְׁפָּט kann Rechtsspruch, Rechtsentscheid oder rechtliche Bestimmung bedeuten. „Rechtsbestimmungen“ ist im Deutschen verständlich und passt in die Reihe der Bundesvorschriften, ohne den Begriff mit „Gebote“ gleichzusetzen.
- source_word: וּמִצְוֺתָיו
  choice: seine Gebote
  rationale: מִצְוָה ist der übliche Ausdruck für ein Gebot; „Gebote“ entspricht dem rechtlichen Register des Verses.
- source_word: כָּל־הַיָּמִים
  choice: allezeit
  rationale: Wörtlich steht „alle Tage“. Im Zusammenhang bezeichnet die Wendung fortdauernde Treue; „allezeit“ gibt dies knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verknüpfung mit dem vorausgehenden Zusammenhang durch וְ
  choice: Deshalb
  alternative: Und
  rationale: Der Vers zieht eine praktische Folgerung aus dem vorhergehenden Abschnitt. Da וְ jedoch auch schlicht koordinierend verstanden werden kann, wird diese echte Übersetzungsmöglichkeit in der Fußnote genannt.
- issue: Bedeutungsbreite von מִשְׁפָּטָיו
  choice: seine Rechtsbestimmungen
  alternative: seine Rechtssprüche
  rationale: Die gewählte Fassung bezeichnet verbindliche rechtliche Regelungen und hält den Ausdruck von „Satzungen“ und „Geboten“ unterscheidbar. „Rechtssprüche“ ist lexikalisch ebenfalls möglich und bleibt als Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die rechtlichen Begriffe bleiben voneinander unterscheidbar; die schwer verständliche wörtliche Verbindung „seine Obhut bewahren“ wird sinngenau und natürlich als Einhalten des von Gott Aufgetragenen formuliert. Der Gedankenstrich hebt die umfassende zeitliche Geltung hervor.
