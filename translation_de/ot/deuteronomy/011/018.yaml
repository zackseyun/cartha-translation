base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: de
  text: So legt diese meine Worte auf euer Herz und auf eure Seele. Bindet sie als Zeichen auf eure Hand, und sie sollen als Stirnschmuck[a] zwischen euren Augen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stirnbänder“; traditionell: „Gebetsriemen“. Das seltene hebräische Wort bezeichnet wohl etwas, das am Kopf getragen wird; seine genaue Bedeutung ist unsicher. Später wurde es mit den in der jüdischen Praxis getragenen Tefillin verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: So legt
  rationale: שׂים bedeutet „legen, setzen, anbringen“. Der deutsche Imperativ gibt die Anweisung natürlich wieder; „So“ nimmt die Fortführung aus dem vorherigen Zusammenhang auf.
- source_word: דְּבָרַי אֵלֶּה
  choice: diese meine Worte
  rationale: Die Form bewahrt sowohl das Demonstrativpronomen als auch den Suffix der ersten Person und klingt in würdigem Standarddeutsch natürlich.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: auf euer Herz und eure Seele
  rationale: „Auf“ erhält die konkrete hebräische Bildsprache. נֶפֶשׁ hat ein breites Bedeutungsspektrum; „Seele“ bewahrt hier neben „Herz“ die traditionelle, nicht vorschnell eingeengte Aussage.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: Bindet sie
  rationale: קשׁר bedeutet „binden, festbinden“. Die Formulierung lässt eine wörtliche wie auch eine bildliche Auffassung offen.
- source_word: לְאוֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet ein Zeichen, Merkmal oder Kennzeichen. „Als Zeichen“ ist idiomatisch und wahrt die symbolische Offenheit.
- source_word: עַל יֶדְכֶם
  choice: auf eure Hand
  rationale: יָד bedeutet gewöhnlich „Hand“, kann aber auch den Arm einschließen. Die Grundbedeutung wird im Haupttext beibehalten.
- source_word: וְהָיוּ
  choice: und sie sollen … sein
  rationale: Die Form führt die Anweisungsfolge fort; „sollen“ gibt diesen normativen Sinn im Deutschen klar wieder.
- source_word: לְטוֹטָפֹת
  choice: wie Stirnbänder
  rationale: טוֹטָפֹת ist ein seltenes, nicht sicher bestimmbares Wort für etwas im Stirnbereich. „Stirnbänder“ bewahrt die konkrete Vorstellung, während die Fußnote auf die lexikalische Unsicherheit und die spätere Praxis hinweist.
- source_word: בֵּין עֵינֵיכֶם
  choice: zwischen euren Augen
  rationale: Dies entspricht der konkreten hebräischen Wendung; „auf eurer Stirn“ wäre bereits eine erklärende Deutung.
theological_decisions:
- issue: Wörtliche oder bildliche Bedeutung des Bindens an Hand und Stirn
  choice: Die konkrete körperliche Bildsprache bleibt stehen, ohne ihre praktische Umsetzung festzulegen.
  alternative: Man könnte den Satz rein bildlich als ständiges Denken und Handeln nach Gottes Worten oder ausschließlich als Vorschrift für später getragene Gebetsriemen verstehen.
  rationale: Der hebräische Text erlaubt eine konkrete und eine sinnbildliche Dimension, entscheidet aber an dieser Stelle nicht ausdrücklich zwischen ihnen. Die Übersetzung soll diese Spannung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative sind für eine deutsche Gesetzes- und Mahnrede natürlicher als eine Reihe futurischer Formen. Die konkrete Bildsprache des Hebräischen bleibt erhalten; der Fußnotenmarker steht unmittelbar bei dem seltenen Ausdruck, den die Anmerkung erläutert.
