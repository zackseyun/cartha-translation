source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: de
  text: Denn das Land, in das du kommst, um es in Besitz zu nehmen, ist nicht wie das Land Ägypten, aus dem ihr ausgezogen seid, wo du deinen Samen aussätest und mit deinem Fuß bewässertest wie einen Gemüsegarten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mit deinem Fuß“ kann sich auf eine fußbetriebene Bewässerungsvorrichtung oder darauf beziehen, dass Wasser mit dem Fuß durch kleine Rinnen geleitet wurde.
    reason: Kulturgeschichtlicher Hinweis zu einer im Einzelnen nicht sicheren Bewässerungspraxis.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung zur vorausgehenden Ermahnung ein und gibt den hebräischen Diskurszusammenhang natürlich wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bewahrt den in Deuteronomium prägenden geografischen und bundestheologischen Leitbegriff.
- source_word: בָא שָׁמָּה
  choice: in das du kommst
  rationale: Gibt das Partizip mit seiner unmittelbar bevorstehenden Bewegung knapp und natürlich wieder; das deiktische שָׁמָּה wird im deutschen Relativsatz durch „in das“ aufgenommen.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: Gibt den finalen Infinitiv und den deuteronomischen Besitzgedanken klar wieder, ohne die zusätzliche familiäre Nuance von „erben“ einzutragen.
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: ist nicht wie das Land Ägypten
  rationale: Bewahrt den ausdrücklichen Vergleich zwischen dem kommenden Land und Ägypten.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: aus dem ihr ausgezogen seid
  rationale: „Ausgezogen“ erhält den für den Exodus charakteristischen Ausdruck; der Wechsel vom Singular zum Plural des hebräischen Textes bleibt sichtbar.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: Dort hast du deinen Samen gesät
  rationale: Der deutsche Perfektsatz bezeichnet die zurückliegende ägyptische Praxis; „Samen“ bleibt nahe am konkreten hebräischen Ausdruck.
- source_word: וְהִשְׁקִיתָ
  choice: und es … bewässert
  rationale: „Bewässert“ bezeichnet im landwirtschaftlichen Zusammenhang präzise die künstliche Wasserzufuhr; das Objekt „es“ wird aus dem Kontext ergänzt und bezieht sich auf das Besäte beziehungsweise das Gartenland.
- source_word: בְרַגְלְךָ
  choice: mit deinem Fuß
  rationale: Die konkrete, aber nicht völlig eindeutige hebräische Wendung bleibt erhalten; mögliche antike Bewässerungsverfahren werden nicht in den Haupttext eingetragen.
- source_word: כְּגַן הַיָּרָק
  choice: wie einen Gemüsegarten
  rationale: Bezeichnet verständlich eine kleine, intensiv bewässerte Gartenfläche für Gemüse oder Grünpflanzen.
theological_decisions:
- issue: Exodus-Anklang in אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: aus dem ihr ausgezogen seid
  alternative: das ihr verlassen habt
  rationale: „Ausgezogen“ bewahrt die sprachliche Verbindung zum Auszug Israels aus Ägypten, ohne dem Text eine zusätzliche Auslegung hinzuzufügen.
- issue: Numeruswechsel zwischen אַתָּה/ךָ und יְצָאתֶם
  choice: Wechsel zwischen „du“ und „ihr“ beibehalten
  alternative: durchgehend „ihr“ oder durchgehend „du“
  rationale: Der unvermittelte Wechsel steht im masoretischen Text und ist für die kollektive Anrede Israels in Deuteronomium charakteristisch; eine Vereinheitlichung würde ein echtes Merkmal der Quelle beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formnaher Satzführung. Der Numeruswechsel des Hebräischen und die anschauliche, mehrdeutige Wendung „mit deinem Fuß“ wurden bewusst bewahrt.
