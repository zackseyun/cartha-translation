  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: de
  text: Und achtet darauf, alle Satzungen und Rechtsbestimmungen zu befolgen, die ich euch heute vorlege.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die ich heute vor euch gebe“; die hebräische Wendung bedeutet, dass sie euch vorgelegt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: Und achtet darauf, … zu befolgen
  rationale: שׁמר mit dem Infinitiv עשה fordert dazu auf, gewissenhaft dafür zu sorgen, dass die Gebote ausgeführt werden. „Achtet darauf“ gibt diesen verpflichtenden Sinn in natürlichem modernem Deutsch wieder; „befolgen“ passt idiomatisch zu rechtlichen Vorschriften.
- source_word: כָּל
  choice: alle
  rationale: Das Wort betont die Gesamtheit der folgenden Vorschriften.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften. „Satzungen“ wahrt den rechtlich-bundestheologischen Sprachgebrauch und unterscheidet den Ausdruck von מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann richterliche Entscheidungen, Rechtsordnungen oder einzelne rechtliche Vorschriften bezeichnen. „Rechtsbestimmungen“ ist im modernen Deutsch verständlich und hält die begriffliche Unterscheidung zu „Satzungen“ aufrecht.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: die ich euch … vorlege
  rationale: נתן bedeutet für sich genommen „geben“, bildet hier mit לִפְנֵי („vor“) jedoch die Wendung „jemandem etwas vorlegen/vor Augen stellen“. „Vorlege“ gibt dieses Bild natürlich wieder und bewahrt die gegenwärtige Redehandlung.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ bewahrt die zeitliche Unmittelbarkeit der Bundesrede in gegenwärtigem Deutsch.
