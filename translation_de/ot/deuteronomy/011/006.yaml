base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: de
  text: 'und was er mit Datan und Abiram, den Söhnen Eliabs, des Sohnes Rubens, tat: wie die Erde ihren Mund auftat und sie verschlang samt ihren Häusern[a], ihren Zelten und allem, was sich zu ihren Füßen befand[b] – inmitten von ganz Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihren Häusern«. Das hebräische Wort kann hier die Gebäude oder umfassender die zugehörigen Hausgemeinschaften bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »allem Bestehenden, das zu ihren Füßen war«. Die Wendung kann alles bezeichnen, was ihnen gehörte oder sie begleitete; sie lässt offen, ob Personen, Tiere oder Besitz im Blick sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: tat
  rationale: Die übliche Bedeutung »tun« passt in den rückblickenden Relativsatz und bewahrt die Anbindung an den vorausgehenden Kontext.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: den Söhnen Eliabs, des Sohnes Rubens
  rationale: Gibt die genealogische Abfolge des Hebräischen wieder, ohne »Rubens« vorschnell als Stammesbezeichnung auf Eliab umzudeuten.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: die Erde ihren Mund auftat
  rationale: Bewahrt die anschauliche Personifikation und die konkrete Mund-Metapher des Ausgangstextes.
- source_word: וַתִּבְלָעֵם
  choice: sie verschlang
  rationale: »Verschlingen« bildet das konkrete Bild des hebräischen Verbs בלע präzise und idiomatisch ab.
- source_word: בָּתֵּיהֶם
  choice: ihren Häusern
  rationale: Die formnahe Wiedergabe erhält die Mehrdeutigkeit zwischen Gebäuden und Hausgemeinschaften; die daneben genannten Zelte lassen eine übertragene Bedeutung möglich erscheinen.
- source_word: אָהֳלֵיהֶם
  choice: ihren Zelten
  rationale: Direkte und im Wüstenkontext natürliche Entsprechung.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: allem, was ihnen zugehörte
  rationale: היקום bezeichnet hier umfassend das Vorhandene beziehungsweise den Besitz; die Wendung »zu ihren Füßen« kann Zugehörigkeit oder Gefolgschaft ausdrücken. Die Übersetzung ist verständlich, während die Fußnote die ungewöhnliche Bildsprache offenlegt.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: mitten in ganz Israel
  rationale: Erhält den räumlichen und öffentlichen Sinn von בקרב und folgt der hebräischen Formulierung eng.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher Satzführung. »Auftat« wahrt den biblisch-anschaulichen Ton, ist aber weiterhin allgemein verständlich. Die ungewöhnlichen und mehrdeutigen Ausdrücke בָּתֵּיהֶם und כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם werden im Text lesbar wiedergegeben und in Fußnoten transparent gemacht.
