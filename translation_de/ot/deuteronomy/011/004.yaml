source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: de
  text: 'und was er dem Heer Ägyptens antat, seinen Pferden und seinen Streitwagen: Er ließ die Wasser des Schilfmeers[a] über sie hinwegfluten, als sie euch verfolgten, und Jahwe vernichtete sie bis zum heutigen Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schilfmeer“; traditionell auch „Rotes Meer“ genannt.'
    reason: Die Fußnote dokumentiert die traditionelle geografische Bezeichnung, während der Haupttext die hebräische Benennung יַם סוּף unmittelbar wiedergibt.
lexical_decisions:
- source_word: חֵיל
  choice: Heer
  rationale: Im Zusammenhang mit Pferden und Streitwagen bezeichnet חֵיל die militärische Streitmacht Ägyptens; „Heer“ ist dafür klar und idiomatisch.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: seinen Pferden und seinen Streitwagen
  rationale: Die Suffixe beziehen sich kollektiv auf Ägypten beziehungsweise dessen Heer. רֶכֶב kann den Wagenbestand oder die Streitwagentruppe bezeichnen; „Streitwagen“ ist im Deutschen natürlich und macht den militärischen Zusammenhang deutlich.
- source_word: הֵצִיף
  choice: ließ … hinwegfluten
  rationale: Die Hifil-Form drückt Verursachung aus. Die Formulierung bewahrt diese Bedeutung und gibt zugleich das Überströmen der Verfolger idiomatisch wieder.
- source_word: מֵי יַם סוּף
  choice: die Wasser des Schilfmeers
  rationale: יַם סוּף bedeutet wörtlich „Schilfmeer“ und ist auch eine etablierte deutsche Wiedergabe. Die traditionelle Bezeichnung „Rotes Meer“ wird in der Fußnote genannt.
- source_word: עַל־פְּנֵיהֶם
  choice: über sie hinweg
  rationale: Die Wendung bezeichnet hier, dass die Wassermassen über die Verfolger kamen; eine wörtliche Wiedergabe mit „Gesicht“ wäre im Deutschen missverständlich.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: als sie euch verfolgten
  rationale: ב mit dem Infinitivus constructus bezeichnet eine gleichzeitige Handlung. „Als sie euch verfolgten“ gibt den zeitlichen Zusammenhang natürlich wieder.
- source_word: וַיְאַבְּדֵם
  choice: und Jahwe vernichtete sie
  rationale: Die kausative Form von אבד bezeichnet, dass Jahwe ihr Verderben herbeiführte; „vernichtete“ ist knapp und kontextgerecht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die feste hebräische Wendung wird mit der entsprechenden geläufigen deutschen Zeitformel wiedergegeben. Die knappe Anfügung bewahrt die im Hebräischen vorhandene Spannung hinsichtlich des bis in die Gegenwart reichenden Ergebnisses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von יַם סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: „Schilfmeer“ gibt die hebräische Bezeichnung unmittelbar wieder. Da „Rotes Meer“ die traditionelle und vielen Lesern vertraute Bezeichnung ist, wird sie als Übersetzungsalternative in einer Fußnote dokumentiert.
- issue: Zeitlicher Bezug von עַד הַיּוֹם הַזֶּה
  choice: unmittelbarer Anschluss an „vernichtete sie“
  alternative: explizite Deutung als bis heute fortdauerndes Ergebnis
  rationale: Der hebräische Wortlaut fügt „bis auf diesen Tag“ knapp an das Verb an. Die Übersetzung lässt diese ungewöhnliche Verbindung bestehen, statt sie durch einen erklärenden Zusatz wie „sodass sie bis heute verschwunden sind“ eindeutig auszulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt gliedert den langen Satzteil lesefreundlich, ohne die inhaltliche Abhängigkeit vom Kontext aufzuheben. „Hinwegfluten ließ“ erhält die kausative Aussage des hebräischen Verbs; die Schlussformulierung bleibt bewusst knapp und deutungsoffen.
