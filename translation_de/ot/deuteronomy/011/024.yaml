  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: de
  text: Jeder Ort, auf den eure Fußsohle tritt, wird euch gehören; von der Wüste und dem Libanon[a], vom Strom, dem Euphratstrom, bis zum westlichen Meer[b] wird sich eure Grenze erstrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn einer Grenzspanne: „von der Wüste bis zum Libanon“.'
    reason: Die knappe hebräische Grenzformel mit וְ („und“) lässt sich im Zusammenhang auch als Angabe der Ausdehnung verstehen.
  - marker: b
    text: 'Wörtlich: „bis zum hinteren/letzten Meer“; gemeint ist das Meer im Westen, traditionell das Mittelmeer.'
    reason: Die Übersetzung „westliches Meer“ gibt die geografische Bedeutung wieder, während die Fußnote die wörtliche Ausdrucksweise bewahrt.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Jeder Ort
  rationale: Die distributive Wendung bezeichnet jeden einzelnen Ort und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: den eure Fußsohle betritt
  rationale: כַּף רֶגֶל bezeichnet die Fußsohle; die konkrete Bildsprache des Betretens bleibt erhalten. Das Relativpronomen steht im Akkusativ, wie es das deutsche Verb verlangt.
- source_word: לָכֶם יִהְיֶה
  choice: wird euch gehören
  rationale: Die Zugehörigkeitsformel wird in idiomatischem modernem Deutsch ausgedrückt, ohne den Verheißungscharakter abzuschwächen.
- source_word: מִן הַמִּדְבָּר
  choice: Von der Wüste
  rationale: מִדְבָּר kann Wüste oder unbesiedeltes Steppenland bezeichnen. „Wüste“ ist im geografischen Zusammenhang verständlich und prägnant.
- source_word: וְהַלְּבָנוֹן
  choice: und dem Libanon
  rationale: Das hebräische וְ wird formal als „und“ bewahrt; eine mögliche Deutung als Grenzspanne „bis zum Libanon“ wird in der Fußnote genannt.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: vom Strom, dem Euphratstrom
  rationale: 'Die appositionale Struktur des Hebräischen bleibt sichtbar: Zuerst steht die bekannte Bezeichnung „der Strom“, danach die ausdrückliche Identifikation als Euphrat.'
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: bis zum westlichen Meer
  rationale: אַחֲרוֹן bedeutet wörtlich „hinteres/letztes“. Bei der hebräischen Orientierung nach Osten bezeichnet es hier das im Westen gelegene Meer; die wörtliche Bildform wird angemerkt.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: wird eure Grenze reichen
  rationale: גְּבוּל bezeichnet Grenze oder Grenzgebiet. „Eure Grenze wird reichen“ ist im Deutschen eine natürliche Wiedergabe der geografischen Ausdehnungsformel.
theological_decisions:
- issue: Geografische Sprache der Landverheißung
  choice: Der Vers wird als Verheißung eines territorialen Umfangs wiedergegeben.
  alternative: Die Grenzen als idealisiert, typologisch oder als Aussage über einen bedingungslos dauerhaften Besitz auslegen.
  rationale: Der hebräische Text nennt die geografische Ausdehnung, entscheidet aber nicht ausdrücklich spätere Fragen nach Erfüllung, Dauer oder Typologie. Die Übersetzung lässt diese theologischen Fragen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Körpermetapher „Fußsohle“ und die doppelte Benennung des Euphrat bleiben erhalten. Der zweite Satz folgt der hebräischen Grenzformel, wird aber mit „wird … reichen“ idiomatisch lesbar gemacht.
