  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: de
  text: Dann werde ich eurem Land zur rechten Zeit Regen geben, den Frühregen und den Spätregen, und du wirst dein Getreide, deinen jungen Wein[a] und dein Öl[b] einbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deinen Wein; gemeint ist frisch erzeugter Wein beziehungsweise Most.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Olivenöl.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: dann werde ich … geben
  rationale: Das Qal Perfekt der 1. Person Singular mit וְ führt im Bedingungsgefüge aus dem vorherigen Vers die göttliche Zusage fort; „dann“ gibt diese Folgewirkung im Deutschen natürlich wieder.
- source_word: מְטַר אַרְצְכֶם
  choice: eurem Land … Regen
  rationale: מָטָר bezeichnet den für die Landwirtschaft nötigen Regen, אֶרֶץ hier das Land beziehungsweise Gebiet Israels.
- source_word: בְּעִתּוֹ
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den passenden, jahreszeitlich bestimmten Zeitpunkt des Regens und klingt im modernen Deutsch natürlicher als „zu seiner Zeit“.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: den Frühregen und den Spätregen
  rationale: Die Begriffe bezeichnen die ersten Regenfälle im Herbst und die späteren Regenfälle im Frühjahr; das traditionelle deutsche Wortpaar bewahrt ihren zeitlichen Gegensatz.
- source_word: וְאָסַפְתָּ
  choice: sodass du … einbringen wirst
  rationale: Das Verb bezeichnet hier das Einsammeln der landwirtschaftlichen Erzeugnisse. „Einbringen“ ist idiomatisch und bewahrt den resultativen Zusammenhang mit dem gegebenen Regen.
- source_word: דְגָנֶךָ
  choice: dein Getreide
  rationale: דָּגָן ist eine Sammelbezeichnung für Getreideerzeugnisse; „Getreide“ ist die klare, gegenwärtige Entsprechung.
- source_word: וְתִירֹשְׁךָ
  choice: deinen jungen Wein
  rationale: תִּירוֹשׁ bezeichnet häufig frisch erzeugten Wein beziehungsweise Most. „Junger Wein“ bewahrt diese Besonderheit, ohne Gärung oder Alkoholgehalt genauer festzulegen.
- source_word: וְיִצְהָרֶךָ
  choice: dein Öl
  rationale: יִצְהָר meint in der festen Dreierformel Getreide, Wein und Öl konkret Olivenöl; die knappe Wiedergabe „Öl“ hält die biblische Formel fest, während eine Fußnote den Sachbezug erklärt.
theological_decisions:
- issue: Landwirtschaftlicher Segen im Bundeskontext
  choice: Konkrete Zusage von jahreszeitlichem Regen und landwirtschaftlichem Ertrag
  alternative: Den Regen vorwiegend symbolisch, geistlich, sakramental, eschatologisch oder im Sinn einer allgemeinen Wohlstandsverheißung deuten
  rationale: Der hebräische Wortlaut spricht unmittelbar vom landwirtschaftlichen Segen für Israel im Land. Die Übersetzung gibt diese konkrete Aussage wieder, ohne spätere theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von „eurem Land“ zum singularischen „du/dein“ folgt bewusst dem Numeruswechsel des hebräischen Textes. „Frühregen und Spätregen“ ist verständlich und bewahrt die traditionelle agrarische Terminologie.
