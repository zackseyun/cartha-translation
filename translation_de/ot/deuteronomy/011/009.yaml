source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: de
  text: damit ihr lange in dem Land lebt, das Jahwe euren Vätern geschworen hat, ihnen und ihren Nachkommen[a] zu geben – einem Land, in dem Milch und Honig fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihrem Samen“. Das hebräische Wort bezeichnet hier kollektiv die Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die beabsichtigte Folge ein und setzt den vorausgehenden Satz natürlich fort.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: ihr lange lebt
  rationale: Gibt die hebräische Wendung „Tage verlängern“ in natürlichem modernem Deutsch als Aussage über ein langes Leben wieder.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: אֲדָמָה bezeichnet hier das verheißene Land als Lebensraum; deutsches „in dem Land“ ist idiomatischer als „auf dem Land“ und vermeidet die Bedeutung „ländliche Gegend“.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: das Jahwe … geschworen hat
  rationale: Bewahrt sowohl den Relativsatz als auch die ausdrückliche Eidesaussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner verbreiteten wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לַאֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: Entspricht der konkreten hebräischen Bezeichnung und bewahrt den Bezug auf die Erzväter.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: ihnen und ihren Nachkommen zu geben
  rationale: „Nachkommen“ gibt זֶרַע als kollektive Bezeichnung natürlich wieder, ohne die Mehrdeutigkeit auf eine einzelne Generation einzuengen.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: einem Land, in dem Milch und Honig fließen
  rationale: Die etablierte deutsche Wendung vermittelt anschaulich Fruchtbarkeit und Überfluss; der Dativ bindet die Apposition eindeutig an das zu gebende Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Adressaten des Eides und der Landgabe
  choice: euren Vätern … ihnen und ihren Nachkommen
  alternative: euren Vorfahren … ihnen und ihren Nachkommen
  rationale: 'Die Formulierung lässt die Spannung des Textes bestehen: Der Eid und die Gabe beziehen sich sowohl auf die Väter selbst als auch auf ihre Nachkommenschaft; sie wird nicht zu einer bloßen Verheißung an spätere Generationen umgedeutet.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängiger Zwecksatz an den vorausgehenden Kontext angeschlossen. „In dem Land“ vermeidet die im Deutschen mögliche Fehlbedeutung von „auf dem Land“. Der Gedankenstrich macht die appositionelle Beschreibung des Landes gut lesbar.
