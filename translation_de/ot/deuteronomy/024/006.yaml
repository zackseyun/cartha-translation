  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: de
  text: Niemand darf die beiden Mühlsteine oder auch nur den oberen Mühlstein als Pfand nehmen; denn damit nimmt er ein Leben[a] als Pfand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn damit nimmt er die Lebensgrundlage eines Menschen als Pfand.“'
    reason: Lexikalische Alternative zu נֶפֶשׁ, das hier sowohl das konkrete Leben als auch die lebensnotwendige Existenzgrundlage bezeichnen kann.
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: als Pfand nehmen
  rationale: Das Verb חבל bezeichnet in diesem Rechtszusammenhang die Annahme eines Gegenstands als Sicherheit für eine Schuld. Die gleiche deutsche Wendung an beiden Stellen bewahrt die Wiederholung des hebräischen Verbs.
- source_word: רֵחַיִם
  choice: die beiden Mühlsteine
  rationale: Die Dualform bezeichnet das aus zwei Steinen bestehende Mahlwerk. Diese Wiedergabe macht die Paarigkeit deutlich und lässt den anschließenden Hinweis auf den oberen Stein verständlich werden.
- source_word: וָרָכֶב
  choice: oder auch nur den oberen Mühlstein
  rationale: 'רָכֶב bezeichnet hier den beweglichen oberen Mühlstein. Obwohl וְ gewöhnlich „und“ heißt, bringt „oder auch nur“ den rechtlichen Sinn natürlich zum Ausdruck: Weder das ganze Mahlwerk noch auch nur sein unentbehrlicher oberer Stein darf als Pfand genommen werden.'
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein; „denn“ ist in diesem gesetzlichen Satz knapp und würdevoll.
- source_word: נֶפֶשׁ
  choice: ein Leben
  rationale: נֶפֶשׁ bezeichnet hier nicht ausdrücklich eine immaterielle Seele, sondern das konkrete, durch die tägliche Nahrungszubereitung erhaltene Leben. „Ein Leben“ bewahrt die zugespitzte Formulierung des Hebräischen; die mögliche Bedeutung „Lebensgrundlage“ wird in der Fußnote genannt.
- source_word: הוּא
  choice: damit nimmt er
  rationale: Das Pronomen hebt den Pfandnehmer als Handelnden hervor. Die deutsche Formulierung stellt den Zusammenhang mit dem vorherigen Verbot klar her, ohne den Sinn zusätzlich auszudeuten.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im sozialrechtlichen Zusammenhang
  choice: konkretes Leben, mit Hinweis auf die Lebensgrundlage
  alternative: Seele; Person; Lebensgrundlage
  rationale: Die Mühlsteine waren für die Zubereitung der täglichen Nahrung nötig. Das Pfand gefährdet daher das Leben beziehungsweise entzieht die Lebensgrundlage. Die Hauptfassung bewahrt die starke Aussage des hebräischen Textes, während die Fußnote die kontextuell naheliegende Bedeutungsnuance offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Rechtston. „Niemand darf“ formuliert das unpersönliche hebräische Verbot natürlich; „oder auch nur“ verdeutlicht die Steigerung, ohne die sachliche Prägnanz zu verlieren.
