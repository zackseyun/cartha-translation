base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: de
  text: Du sollst ihm seinen Lohn am selben Tag geben; die Sonne soll nicht darüber untergehen. Denn er ist arm, und sein Leben hängt davon ab.[a] Damit er nicht gegen dich zu Jahwe schreit und du dich schuldig machst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Zu ihm trägt/hebt er sein Leben.« Die hebräische Redewendung beschreibt die dringende, existenzielle Abhängigkeit des Arbeiters von seinem Lohn.'
    reason: Die bildhafte hebräische Wendung wird im Haupttext idiomatisch wiedergegeben; die Fußnote dokumentiert die wörtliche Ausdrucksweise und wahrt deren Nachdruck.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: noch am selben Tag
  rationale: Die Wendung bedeutet wörtlich »an seinem Tag« und verlangt die Auszahlung am jeweiligen Arbeitstag. Die natürliche deutsche Formulierung macht diese zeitliche Unmittelbarkeit deutlich.
- source_word: תִתֵּן שְׂכָרוֹ
  choice: sollst ihm seinen Lohn geben
  rationale: Der Imperfekt dient in dieser Rechtsbestimmung als Gebot; שָׂכָר bezeichnet den verdienten Arbeitslohn.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: die Sonne darf nicht darüber untergehen
  rationale: Die bildhafte Zeitgrenze des hebräischen Textes bleibt erhalten. »Darüber« bezieht sich am ehesten auf den noch ausstehenden Lohn beziehungsweise seine Auszahlung.
- source_word: כִּי עָנִי הוּא
  choice: Denn er ist arm
  rationale: עָנִי bezeichnet hier die wirtschaftlich bedrängte und verletzliche Lage des Tagelöhners.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: auf diesen Lohn ist er mit seinem Leben angewiesen
  rationale: Die wörtlich etwa »zu ihm trägt/hebt er sein Leben« lautende Wendung drückt existenzielle Abhängigkeit aus. Die Übersetzung bewahrt mit »mit seinem Leben« den Nachdruck von נֶפֶשׁ, ohne im Deutschen unverständlich zu werden.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Sonst könnte er deinetwegen zu Jahwe schreien
  rationale: Der Anschluss warnt vor dem Hilferuf des unterdrückten Arbeiters gegen den säumigen Arbeitgeber. »Deinetwegen« gibt עָלֶיךָ in natürlichem Deutsch wieder, während »schreien« die Dringlichkeit des Rechtsrufes ausdrückt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: du würdest Schuld auf dich laden
  rationale: Die hebräische Wendung sagt aus, dass dem Adressaten Sünde beziehungsweise Schuld anhaftet. Die deutsche Formulierung gibt die rechtlich-moralische Folge idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Transkription bewahrt seinen Charakter als Eigenname.
- issue: Bedeutung von חֵטְא in der Schlussklausel
  choice: Schuld auf sich laden
  alternative: es wäre Sünde an dir
  rationale: חֵטְא kann Sünde und die daraus entstehende Schuld bezeichnen. Im rechtlich-ethischen Zusammenhang ist »Schuld auf sich laden« verständlich, ohne die göttliche Beurteilung abzuschwächen.
- issue: Funktion von וְלֹא יִקְרָא
  choice: 'warnende Folge: »Sonst könnte er … schreien«'
  alternative: 'Zweck: »damit er nicht … schreit«'
  rationale: Im Zusammenhang bezeichnet die negierte Verbform die zu vermeidende Folge. Die Übersetzung lässt offen, ob der Hilferuf tatsächlich erfolgt, und bewahrt den Warncharakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Der Parallelismus und die Dringlichkeit des Gebots bleiben erhalten; schwer verständliche Hebraismen werden idiomatisch wiedergegeben und bei Bedarf in der Fußnote erläutert.
