source:
  edition: WLC
  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: de
  text: Wenn du deinem Nächsten irgendetwas leihst[a], sollst du nicht in sein Haus hineingehen, um sein Pfand zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du deinem Nächsten irgendein Darlehen gewährst, sollst du nicht sein Haus betreten, um das von ihm verpfändete Gut zu nehmen.“'
    reason: Die hebräische Formulierung kann den Darlehensvorgang ausdrücklich benennen; עֲבֹטוֹ kann sowohl als „sein Pfand“ als auch als „das von ihm Verpfändete“ wiedergegeben werden.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier einen kasuistischen Rechtsfall ein. Das deutsche „wenn“ gibt diesen Bedingungs- bzw. Fallcharakter natürlich wieder.
- source_word: תַשֶּׁה
  choice: du … leihst
  rationale: Der Hifil von נשה bezeichnet hier das Gewähren eines Darlehens bzw. Kredits. Zusammen mit מַשַּׁאת lässt sich die Wendung im Deutschen natürlich mit „jemandem etwas leihen“ ausdrücken.
- source_word: בְרֵעֲךָ
  choice: deinem Nächsten
  rationale: רֵעַ bezeichnet einen Mitmenschen bzw. Angehörigen der Gemeinschaft. „Nächster“ ist würdig, verständlich und im biblischen Rechtskontext passend.
- source_word: מַשַּׁאת מְאוּמָה
  choice: irgendetwas
  rationale: מַשַּׁאת bezeichnet hier das Darlehen, während מְאוּמָה dessen uneingeschränkten Umfang ausdrückt. Da das deutsche Verb „leihen“ den Darlehensgedanken bereits trägt, gibt „irgendetwas“ die Gesamtwendung knapp und natürlich wieder.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: sollst du nicht in sein Haus hineingehen
  rationale: Das mit לֹא verneinte Imperfekt hat im Rechtstext verbietende Kraft. „Sollst du nicht“ wahrt den normativen Ton; „hineingehen“ verdeutlicht das Betreten des Hauses.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: um sein Pfand zu nehmen
  rationale: Die Verbindung aus dem Verb עבט und dem zugehörigen Substantiv bezeichnet das Entgegennehmen eines als Sicherheit dienenden Pfandes. „Nehmen“ vermeidet die stärkere, nicht zwingend ausgedrückte Bedeutung von „beschlagnahmen“.
