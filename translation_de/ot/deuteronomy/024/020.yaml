translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher landwirtschaftlicher Bildsprache. Die apodiktische Rechtsforderung wird mit „sollst“ ausgedrückt. Die erläuternde Formulierung „Was übrig bleibt“ verdeutlicht den Bezug von יִהְיֶה, ohne die rechtliche Spannung des Gebots aufzulösen.
