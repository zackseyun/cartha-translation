base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: de
  text: Wenn du die Oliven von deinem Baum abschlägst, sollst du die Zweige danach nicht noch einmal absuchen[a]. Was übrig bleibt, soll dem Fremden[b], der Waise[c] und der Witwe gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du nicht noch einmal hinterher abernten“. Gemeint ist, dass die nach dem ersten Abschlagen verbliebenen Oliven nicht in einem zweiten Durchgang eingesammelt werden dürfen.'
    reason: lexical_alternative
  - marker: b
    text: Der „Fremde“ ist hier ein nicht einheimischer Mensch, der unter Israel lebt; möglich wäre auch „der ansässige Fremde“.
    reason: cultural_note
  - marker: c
    text: 'Oder: „dem vaterlosen Kind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: In diesem Rechtssatz leitet כִּי den vorausgesetzten Fall ein; das deutsche „wenn“ gibt diese kasuistische Funktion natürlich wieder.
- source_word: תַחְבֹּט
  choice: abschlägst
  rationale: חבט bezeichnet hier das Schlagen der Zweige, durch das die Oliven gelöst werden. „abschlagen“ bildet Handlung und Erntezweck knapp ab.
- source_word: זֵיתְךָ
  choice: die Oliven von deinem Baum
  rationale: זַיִת kann den Ölbaum oder seine Frucht bezeichnen. Die Formulierung macht die gemeinte Olivenernte verständlich, ohne einen im Hebräischen nicht genannten Plural von Bäumen einzuführen.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: sollst du die Zweige danach nicht noch einmal absuchen
  rationale: Das seltene Piel von פאר bezeichnet in diesem Erntegesetz offenbar das nachträgliche vollständige Abernten. Die Wiedergabe wahrt das Bild einer untersagten zweiten Durchsicht und vermeidet das im Deutschen missverständliche „nach dir“.
- source_word: לַגֵּר
  choice: dem Fremden
  rationale: גֵּר ist ein nicht einheimischer Mensch, der als ansässiger Fremder unter Israel lebt. „Fremder“ ist im deutschen Bibel- und Rechtsregister verständlich; die genauere soziale Bedeutung wird in der Fußnote erläutert.
- source_word: לַיָּתוֹם
  choice: der Waise
  rationale: יָתוֹם bezeichnet ein elternloses beziehungsweise besonders vaterloses und daher sozial schutzbedürftiges Kind. „Waise“ ist die natürliche moderne deutsche Entsprechung; die mögliche Spezifizierung steht in der Fußnote.
- source_word: וְלָאַלְמָנָה
  choice: und der Witwe
  rationale: „Witwe“ ist die direkte und kontextgerechte Entsprechung von אַלְמָנָה.
- source_word: יִהְיֶה
  choice: soll ... gehören
  rationale: Das Verb „sein“ drückt hier eine rechtliche Zuweisung aus. „gehören“ macht diese Bestimmung im Deutschen deutlich; „Was übrig bleibt“ nimmt den sachlich vorausgesetzten Rest der Ernte auf.
