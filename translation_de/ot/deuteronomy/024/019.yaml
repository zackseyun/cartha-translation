source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: de
  text: Wenn du auf deinem Feld deine Ernte einholst und eine Garbe auf dem Feld vergisst, sollst du nicht zurückgehen, um sie zu holen. Sie soll für den ansässigen Fremden[a], die Waise[b] und die Witwe bestimmt sein, damit Jahwe, dein Gott, dich bei allem segnet, was deine Hände tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen nicht einheimischen Menschen, der als ansässiger Fremder unter Israel lebt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: dem Vaterlosen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Fall einer kasuistischen Rechtsbestimmung ein und bewahrt zugleich den bedingten Sinn.
- source_word: תִקְצֹר קְצִירְךָ
  choice: du deine Ernte einholst
  rationale: Gibt das Abernten des Feldes natürlich wieder, ohne die im Deutschen schwerfällige Wiederholung „deine Ernte erntest“.
- source_word: עֹמֶר
  choice: eine Garbe
  rationale: Bezeichnet hier ein Bündel geschnittenen Getreides, nicht das gleichnamige Hohlmaß.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: sollst du nicht zurückgehen, um sie zu holen
  rationale: Bewahrt sowohl die untersagte Rückkehr als auch den Zweck, die vergessene Garbe an sich zu nehmen.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: Bezeichnet einen Nichtisraeliten beziehungsweise Ortsfremden, der dauerhaft unter Israel lebt; die Formulierung macht diese sozialrechtliche Stellung verständlich.
- source_word: יָתוֹם
  choice: Waise
  rationale: Ist im heutigen Deutsch die natürliche Bezeichnung für das sozial schutzbedürftige Kind; das Hebräische kann besonders Vaterlosigkeit voraussetzen.
- source_word: יִהְיֶה
  choice: soll ... gehören
  rationale: Drückt die bestimmungsgemäße Überlassung der Garbe aus, ohne eine weitergehende eigentumsrechtliche Theorie einzutragen.
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Folgebeziehung knapp und idiomatisch wieder.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: bei allem, was deine Hände tun
  rationale: Bewahrt das hebräische Bild der tätigen Hände in natürlichem modernem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form der wahrscheinlichen Aussprache.
- issue: Sozialrechtliche Kategorie גֵּר
  choice: ansässiger Fremder
  alternative: Fremder; Beisasse; Schutzbürger
  rationale: Die Übersetzung kennzeichnet eine nicht einheimische Person, die innerhalb der Gemeinschaft lebt, ohne den Begriff auf einen bloßen Besucher oder einen modernen staatsrechtlichen Status festzulegen.
- issue: Bedeutungsumfang von יָתוֹם
  choice: Waise
  alternative: Vaterloser
  rationale: „Waise“ ist die natürliche moderne Bezeichnung; eine Fußnote hält offen, dass der hebräische Ausdruck insbesondere ein vaterloses Kind meinen kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Rechtssatzton. Die Wiederholung von „Feld“ folgt dem hebräischen Text, während unnötig altertümliche Wendungen vermieden werden.
