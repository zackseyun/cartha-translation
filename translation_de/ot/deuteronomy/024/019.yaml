  to: Wenn du auf deinem Feld deine Ernte einholst und eine Garbe auf dem Feld vergisst, sollst du nicht zurückgehen, um sie zu holen. Sie soll für den ansässigen Fremden[a], die Waise[b] und die Witwe bestimmt sein, damit Jahwe, dein Gott, dich bei allem segnet, was deine Hände tun.
