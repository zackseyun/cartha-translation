base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: de
  text: Wenn ein Mann gerade eine Frau geheiratet hat, soll er nicht mit dem Heer ausziehen[a], und es soll ihm keinerlei Verpflichtung auferlegt werden[b]. Ein Jahr lang soll er für seinen Haushalt frei sein[c] und seiner Frau, die er geheiratet hat, Freude bereiten[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll er nicht zum Krieg ausziehen“. Das hebräische Wort kann das Heer oder den Militärdienst bezeichnen; die Aussage muss daher nicht nur den unmittelbaren Kampfeinsatz meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und es soll ihm keinerlei Aufgabe übertragen werden“. Der hebräische Ausdruck ist weiter als eine rein militärische Dienstpflicht.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Ein Jahr lang soll er zu Hause freigestellt sein“. Der hebräische Ausdruck kann sowohl seine Freistellung zugunsten des häuslichen Lebens als auch sein Bleiben bei seinem Haushalt hervorheben.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „und er soll seine Frau, die er geheiratet hat, erfreuen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet den Fall eines kasuistischen Gesetzes ein; „wenn“ ist im modernen deutschen Rechtsstil natürlich und wahrt den konditional-generalisierenden Charakter.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: Wenn ein Mann eine Frau neu geheiratet hat
  rationale: לקח אשה ist ein feststehender Ausdruck für das Heiraten. Die adverbiale Wiedergabe „neu geheiratet“ macht deutlich, dass חֲדָשָׁה die frische Eheschließung bezeichnet, und vermeidet das missverständliche „eine neue Frau“.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: soll er nicht mit dem Heer ausziehen
  rationale: Bewahrt das hebräische Bild des Ausziehens mit dem Heer und beschränkt die Aussage nicht unnötig auf unmittelbare Kampfhandlungen.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: und es soll ihm keinerlei Verpflichtung auferlegt werden
  rationale: Gibt die idiomatische Wendung als passive Auferlegung einer Pflicht wieder. „Keinerlei Verpflichtung“ bewahrt die Weite von לְכָל דָּבָר, statt sie ausschließlich militärisch zu verstehen.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת
  choice: Ein Jahr lang soll er für sein Haus frei sein
  rationale: נָקִי bezeichnet hier das Freisein von Verpflichtungen. „Für sein Haus“ erhält die Zielrichtung von לְבֵיתוֹ und kann Haus, Familie beziehungsweise Haushalt umfassen.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: und seiner Frau … Freude bereiten
  rationale: Die Piel-Form ist kausativ. „Freude bereiten“ klingt im Deutschen natürlich und bewahrt den Gedanken, dass der Mann die Freude seiner Frau fördern soll.
- source_word: אֲשֶׁר לָקָח
  choice: die er geheiratet hat
  rationale: Der deutsche Eheausdruck gibt die Bedeutung des wiederholten לקח klar wieder; eine wörtliche Form wie „die er genommen hat“ wäre im modernen Deutsch unnatürlich und potenziell missverständlich.
