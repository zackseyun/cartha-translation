translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gesetzessprache. Die Satzstellung vermeidet Archaismen; „Haus“ bleibt bewusst offen für Familie und Haushalt. Sämtliche textlich relevanten Alternativen werden in Fußnoten bewahrt.
