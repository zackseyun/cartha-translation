revisions:
- from: Du sollst einen Tagelöhner, der arm und bedürftig ist, nicht ausbeuten[a], ob er nun zu deinen Brüdern gehört oder zu den Fremden, die bei dir in deinem Land leben, innerhalb deiner Tore[b].
  to: Du sollst einen armen und bedürftigen Lohnarbeiter nicht ausbeuten[a], sei es einer deiner Brüder oder ein Fremder, der bei dir in deinem Land innerhalb deiner Tore lebt[b].
  rationale: Die Revision stellt den Singular von גֵּר wieder her, gibt שָׂכִיר ohne vermeidbare Einengung als „Lohnarbeiter“ wieder und integriert die Wendung „innerhalb deiner Tore“ in den Relativsatz. Die Bildsprache, der Rechtscharakter und die soziale Schutzintention des hebräischen Textes bleiben erhalten.
