  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: de
  text: Du sollst einen armen und bedürftigen Lohnarbeiter nicht ausbeuten[a], sei es einer deiner Brüder oder ein Fremder, der bei dir in deinem Land innerhalb deiner Tore lebt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bedrücken oder übervorteilen. Das hebräische Verb schließt wirtschaftliche Ausbeutung ein.'
    reason: lexical_alternative
  - marker: b
    text: „Innerhalb deiner Tore“ ist eine hebräische Ausdrucksweise für die Ortschaften beziehungsweise den örtlichen Gemeinschafts- und Rechtsbereich.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: ausbeuten
  rationale: Das Verb עָשַׁק bezeichnet bedrückende oder betrügerische Ausbeutung, hier im wirtschaftlichen Verhältnis zu einem Lohnarbeiter. „Ausbeuten“ gibt diesen Kontext im modernen Deutsch prägnant wieder; „unterdrücken“ wäre weiter, „übervorteilen“ enger.
- source_word: שָׂכִיר
  choice: Tagelöhner
  rationale: שָׂכִיר ist ein gegen Lohn beschäftigter Arbeiter. Im Zusammenhang mit der täglichen Lohnauszahlung des folgenden Verses bezeichnet „Tagelöhner“ die prekäre Lohnarbeit natürlich und konkret.
- source_word: עָנִי וְאֶבְיוֹן
  choice: arm und bedürftig
  rationale: Die zwei verbundenen Begriffe betonen die wirtschaftliche und soziale Verwundbarkeit, ohne zwingend zwei klar abgestufte Armutsgrade zu bezeichnen.
- source_word: מֵאַחֶיךָ
  choice: zu deinen Brüdern gehört
  rationale: Die Form bedeutet wörtlich „von deinen Brüdern“ und bezeichnet im deuteronomischen Bundesrecht einen Angehörigen Israels. Die Verwandtschaftssprache des Ausgangstextes bleibt erhalten.
- source_word: מִגֵּרְךָ
  choice: zu den Fremden, die bei dir … leben
  rationale: גֵּר bezeichnet einen ortsansässigen Fremden ohne einheimische Zugehörigkeit. „Fremde, die bei dir leben“ ist im heutigen Deutsch verständlicher als „Beisassen“ und vermeidet moderne ausländerrechtliche Kategorien.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: die bei dir in deinem Land leben
  rationale: Der Relativsatz bezieht sich am natürlichsten auf den גֵּר. Die deutsche Pluralform stimmt mit „den Fremden“ überein, während der einzelne Tagelöhner durch die Konstruktion „zu … gehört“ erkennbar bleibt.
- source_word: בִּשְׁעָרֶיךָ
  choice: innerhalb deiner Tore
  rationale: Die wörtliche Wendung bewahrt das hebräische Rechts- und Gemeinschaftsbild; eine Fußnote erläutert, dass damit die Ortschaften beziehungsweise der örtliche Zuständigkeitsbereich gemeint sind.
theological_decisions:
- issue: Bundesrechtliche Verwandtschaftsbezeichnung אַחֶיךָ
  choice: deine Brüder
  alternative: deine israelitischen Mitbürger
  rationale: Die grammatisch maskuline Verwandtschaftsbezeichnung und ihr bundesbezogener Klang werden bewahrt, ohne den Bezug auf Angehörige Israels zu verschleiern.
- issue: Sozialrechtliche Kategorie גֵּר
  choice: Fremde, die bei dir leben
  alternative: ansässige Fremde
  rationale: Die Formulierung bezeichnet geschützte nicht einheimische Bewohner, ohne den Begriff mit einer modernen staats- oder ausländerrechtlichen Kategorie gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Tagelöhner“ passt zum unmittelbaren Kontext der täglichen Lohnauszahlung. Die traditionelle Bildsprache „innerhalb deiner Tore“ bleibt erhalten und wird erläutert; schwer verständliche Fachwörter wie „Beisasse“ werden vermieden.
