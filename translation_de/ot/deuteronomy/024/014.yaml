    rationale: Der folgende Vers erwähnt die tägliche Auszahlung, doch die Bezeichnung selbst meint allgemein einen Lohnarbeiter. „Lohnarbeiter“ ist im modernen Deutsch präzise und ohne zusätzliche zeitliche Spezifizierung.
  - severity: medium
