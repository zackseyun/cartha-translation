  naturalness: Die Schlussstellung „die bei dir in deinem Land leben, innerhalb deiner Tore“ ist im Deutschen syntaktisch schwerfällig und lässt „innerhalb deiner Tore“ nachgetragen wirken. Eine singuläre Relativkonstruktion ist klarer und natürlicher.
  terminology: „ausbeuten“, „arm und bedürftig“, „Brüder“ und „Fremder“ sind angemessen. „Lohnarbeiter“ gibt שָׂכִיר weiter wieder als „Tagelöhner“. Die Fußnoten sind inhaltlich passend; Fußnote b erläutert die idiomatische Wendung zutreffend.
