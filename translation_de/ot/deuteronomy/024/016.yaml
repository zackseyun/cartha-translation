id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: de
  text: Väter sollen nicht wegen ihrer Söhne getötet werden, und Söhne sollen nicht wegen ihrer Väter getötet werden. Jeder soll für seine eigene Sünde getötet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: sollen … getötet werden
  rationale: Der Hophʿal von מות ist kausativ-passiv und bezeichnet hier nicht bloß das Sterben, sondern das Getötetwerden im rechtlichen Zusammenhang. „Hingerichtet werden“ wäre juristisch eindeutiger, aber etwas stärker auslegend.
- source_word: אָבוֹת
  choice: Väter
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich Väter und steht parallel zu „Söhne“.
- source_word: בָּנִים
  choice: Söhne
  rationale: Die wörtliche Bedeutung ist hier „Söhne“. Die konkrete familiäre Ausdrucksweise des Ausgangstextes bleibt so erhalten.
- source_word: עַל
  choice: wegen
  rationale: עַל bezeichnet in diesem rechtlichen Kontext den Grund beziehungsweise die Grundlage der Bestrafung; „wegen“ ist im Deutschen klar und idiomatisch.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird distributiv gebraucht. „Jeder“ gibt die individuelle Zuordnung natürlich wieder, ohne das im Deutschen schwerfällige „jeder Mann“.
- source_word: בְּחֶטְאוֹ
  choice: für seine eigene Sünde
  rationale: Die Präposition bezeichnet hier den Strafgrund. „Eigene“ verdeutlicht den Possessivsuffix und den Gegensatz zur Bestrafung für die Tat eines Angehörigen.
theological_decisions:
- issue: Individuelle Verantwortlichkeit bei der Todesstrafe
  choice: Die gerichtliche Tötung darf nur aufgrund der eigenen Sünde des Betroffenen erfolgen, nicht aufgrund der Sünde von Vätern oder Söhnen.
  alternative: Eine allgemeine Aussage über sämtliche generationenübergreifenden Folgen der Sünde.
  rationale: Die wiederholte Hophʿal-Form von מות spricht konkret vom Getötetwerden. Daher bleibt die Übersetzung beim unmittelbaren rechtlichen Zusammenhang, ohne den Grundsatz stillschweigend auf alle Folgen der Sünde auszuweiten.
translation_notes:
  register: Moderne, klare und würdige Rechtssprache. Die symmetrische Satzstruktur des Hebräischen wird bewahrt. Keine Fußnote ist nötig, da „Söhne“ und das passive „getötet werden“ die maßgeblichen Ausgangsformen unmittelbar wiedergeben.
