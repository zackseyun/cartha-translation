  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: de
  text: Du sollst ihm das Pfand bei Sonnenuntergang unbedingt zurückgeben,[a] damit er in seinem Mantel schlafen und dich segnen kann. Und das wird dir als Gerechtigkeit gelten[b] vor Jahwe, deinem Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das als Sicherheit Genommene“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und das wird vor Jahwe, deinem Gott, eine gerechte Tat von dir sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: unbedingt zurückgeben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Verpflichtung. „Unbedingt“ gibt diesen Nachdruck in natürlichem Deutsch wieder.
- source_word: הַעֲבוֹט
  choice: das Pfand
  rationale: Das Wort bezeichnet einen als Sicherheit für ein Darlehen genommenen Gegenstand. „Pfand“ ist im deutschen Rechts- und Alltagsgebrauch präzise und verständlich.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: bei Sonnenuntergang
  rationale: Die wörtliche Wendung „beim Kommen der Sonne“ ist eine hebräische Bezeichnung für den Sonnenuntergang.
- source_word: וְשָׁכַב
  choice: damit er sich … legen … kann
  rationale: 'Im Zusammenhang bezeichnet die Verbfolge den beabsichtigten Erfolg der Rückgabe: Der Bedürftige kann das Kleid nachts als Decke verwenden.'
- source_word: בְּשַׂלְמָתוֹ
  choice: in seinen Mantel
  rationale: שַׂלְמָה bezeichnet hier ein äußeres Kleidungsstück, das beim Schlafen zugleich als Bedeckung dient. „Mantel“ macht diese Funktion anschaulich.
- source_word: וּבֵרֲכֶךָּ
  choice: und dich segnen kann
  rationale: Subjekt ist der Empfänger des zurückgegebenen Pfandes; er spricht dem Gläubiger Segen zu. Die Koordination mit „sich legen“ gibt die Zweck- beziehungsweise Folgebeziehung natürlich wieder.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: das wird dir als Gerechtigkeit gelten
  rationale: Die Formulierung bewahrt sowohl den Begriff „Gerechtigkeit“ als auch den möglichen Sinn einer vor Gott anerkannten gerechten Tat, ohne eine bestimmte spätere Lehrformel festzuschreiben.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: לִפְנֵי bedeutet „vor/in der Gegenwart von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צְדָקָה in der Wendung וּלְךָ תִּהְיֶה צְדָקָה
  choice: das wird dir als Gerechtigkeit gelten
  alternative: das wird für dich eine gerechte Tat sein; das wird dir zur Gerechtigkeit angerechnet
  rationale: Der hebräische Ausdruck kann die gerechte Qualität der Handlung oder ihre Anerkennung vor Gott bezeichnen. Die gewählte Formulierung erhält diese Spannung und vermeidet eine unnötig enge dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtsvorschrift bleibt direkt und nachdrücklich; „Pfand“ und „Mantel“ sind allgemein verständlich. Der Satzbau wurde für natürliche deutsche Lesbarkeit leicht gegliedert, ohne die Zweck- und Folgebeziehungen des Hebräischen einzuebnen.
