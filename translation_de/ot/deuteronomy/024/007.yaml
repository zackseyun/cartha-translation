source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: de
  text: Wenn ein Mann dabei ertappt wird, wie er einen seiner Brüder, einen von den Israeliten,[a] entführt, ihn wie einen Sklaven behandelt[b] und verkauft, dann soll dieser Entführer sterben. So sollst du das Böse aus deiner Mitte beseitigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen seiner Brüder von den Söhnen Israels«. Mit »Brüder« sind hier Angehörige des Volkes Israel gemeint, nicht nur leibliche Brüder.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »ihn versklavt«; möglicherweise auch: »ihn als Ware behandelt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא
  choice: dabei ertappt wird
  rationale: Das Niphal von מצא bedeutet hier im rechtlichen Bedingungssatz, dass die Tat entdeckt beziehungsweise der Täter dabei angetroffen wird.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Singularform wird entsprechend der konkreten Form des hebräischen Rechtssatzes wiedergegeben.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: entführt
  rationale: Die Wendung bedeutet wörtlich, einen Menschen zu stehlen, und bezeichnet in diesem Zusammenhang Menschenraub beziehungsweise Entführung.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: einen seiner Brüder, einen von den Israeliten
  rationale: Bewahrt die verwandtschaftliche Bundes- und Volkszugehörigkeitssprache von אָח und erklärt zugleich durch den folgenden Ausdruck ihren israelitischen Umfang.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: ihn wie einen Sklaven behandelt
  rationale: Der seltene Hitpael-Ausdruck bezeichnet hier die Verfügung über den Entführten als Besitz beziehungsweise seine Behandlung als Sklave; die Formulierung wahrt diese Bedeutung, ohne die lexikalische Unsicherheit unnötig zu verdecken.
- source_word: וּמְכָרוֹ
  choice: und verkauft
  rationale: Gibt das Verb מכר samt seinem auf den Entführten bezogenen Objektsuffix direkt wieder.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: dann soll dieser Entführer sterben
  rationale: Der wörtliche 'Dieb' ist im Kontext der Menschenräuber; 'Entführer' stellt den eindeutigen Rückbezug im Deutschen her.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: So sollst du das Böse aus deiner Mitte beseitigen
  rationale: Wiedergabe der wiederkehrenden deuteronomischen Rechtsformel in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Verwandtschaftssprache für die Zugehörigkeit zum Bundesvolk
  choice: Brüder im Haupttext beibehalten und durch 'einen von den Israeliten' erläutern
  alternative: einen seiner israelitischen Volksgenossen
  rationale: Die familiäre Rhetorik des Hebräischen bleibt erhalten, während der Zusatz deutlich macht, dass nicht nur leibliche Brüder gemeint sind.
- issue: Bedeutung von והתעמר בו
  choice: ihn wie einen Sklaven behandelt
  alternative: ihn versklavt; ihn als Ware behandelt; ihn ausbeutet
  rationale: Die gewählte Formulierung bringt die Verfügung über den Menschen als Sklaven zum Ausdruck und wahrt zugleich die lexikalische Spannweite des seltenen Verbs.
translation_notes:
  register: Moderner deutscher Rechtsstil mit würdigem biblischem Ton. 'Dabei ertappt', 'entführt' und 'Entführer' machen den Tatbestand klar; die wiederkehrende Schlussformel bleibt eng an der deuteronomischen Ausdrucksweise.
