  text: הִשָּׁ֧מֶר בְּ/נֶֽגַע הַ/צָּרַ֛עַת לִ/שְׁמֹ֥ר מְאֹ֖ד וְ/לַ/עֲשׂ֑וֹת כְּ/כֹל֩ אֲשֶׁר יוֹר֨וּ אֶתְ/כֶ֜ם הַ/כֹּהֲנִ֧ים הַ/לְוִיִּ֛ם כַּ/אֲשֶׁ֥ר צִוִּיתִ֖/ם תִּשְׁמְר֥וּ לַ/עֲשֽׂוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: de
  text: Achtet bei einem Fall von Hautkrankheit[a] sehr sorgfältig darauf, alles zu befolgen und zu tun, was die levitischen Priester euch anweisen. Wie ich es ihnen geboten habe, so sollt ihr sorgfältig darauf achten, es zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell „Aussatz“. Der hebräische Begriff bezeichnet in der Tora ein breiteres Spektrum von Befunden, besonders an der Haut, und nicht speziell die moderne Hansen-Krankheit (Lepra).
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Hütet euch
  rationale: Der Nifal-Imperativ von שׁמר warnt eindringlich und fordert die angesprochene Gemeinschaft zur Wachsamkeit auf. „Hütet euch“ bewahrt diese Warnfunktion in würdigem, verständlichem Deutsch.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: bei einem Fall von Hautkrankheit
  rationale: נֶגַע bezeichnet hier einen Befall oder Krankheitsfall; צָרַעַת umfasst im Pentateuch verschiedene diagnostizierte Erscheinungen und ist nicht mit der modernen Hansen-Krankheit gleichzusetzen. „Fall von Hautkrankheit“ ist im Kontext einer priesterlichen Fallbeurteilung natürlich.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: achtet sehr genau darauf, ... zu tun
  rationale: שׁמר mit מְאֹד betont äußerste Sorgfalt; die deutsche Konstruktion verbindet auf natürliche Weise gewissenhafte Beachtung und anschließende Ausführung, ohne die Verstärkung abzuschwächen.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: alles so zu tun, wie ... euch anweisen
  rationale: ירה im Hifil bedeutet hier „anweisen/unterweisen“. „Anweisen“ passt zur verbindlichen priesterlichen Anleitung in einem Rechts- und Reinheitsfall.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die deuteronomische Wortverbindung bezeichnet die Priester aus Levi. Die adjektivische Wiedergabe ist im Deutschen klar und liest die Ausdrücke nicht unnötig als zwei getrennte Gruppen.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Wie ich es ihnen geboten habe
  rationale: Die Verbform ist 1. Person Singular mit einem Suffix der 3. Person Plural und verweist auf das Gebot, das Mose den Priestern erteilt hat.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: so sollt ihr darauf achten, es zu tun
  rationale: Die Wiedergabe erhält die korrelative Struktur „wie ... so“ und nimmt die wiederholte Verbindung von שׁמר und עשׂה auf, ohne im Deutschen übermäßig schwerfällig zu werden.
theological_decisions:
- issue: Bedeutungsumfang von צָרַעַת
  choice: Hautkrankheit
  alternative: Aussatz
  rationale: צָרַעַת ist ein torainterner Sammelbegriff für verschiedene äußerlich feststellbare Befunde und darf nicht ohne Weiteres mit moderner Lepra beziehungsweise der Hansen-Krankheit identifiziert werden. Die Fußnote hält zugleich die traditionelle Benennung fest.
- issue: Bestimmung von הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  alternative: die Priester, die Leviten
  rationale: Die Formulierung wird als die für das Deuteronomium typische nähere Bestimmung der Priester als zu Levi gehörig verstanden. Die mögliche formal-appositionelle Analyse wird dadurch nicht zu einer Aussage über zwei eigenständige Gruppen gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural richtet sich an Israel als Gemeinschaft. Die Wiederholung der Aufforderung zur sorgfältigen Befolgung bleibt erhalten; medizinisch anachronistische Präzision wird vermieden.
