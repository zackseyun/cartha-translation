source:
  edition: WLC
  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: de
  text: Und denke daran, dass du im Land Ägypten ein Sklave warst. Darum gebiete ich dir, dies[a] zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich auch „diese Sache“ oder „diese Angelegenheit“. Gemeint ist die vorausgehende Weisung, einen Teil der Ernte für Fremde, Waisen und Witwen zurückzulassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Und denke daran
  rationale: Die Qal-Perfektform mit vorangestelltem וְ hat in diesem Gesetzeskontext auffordernde Kraft. „Denke daran“ ist natürliches modernes Deutsch; „Und“ bewahrt die Verbindung zur vorausgehenden Weisung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, woran Israel denken soll.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im Zusammenhang mit Ägypten bezeichnet das Wort einen Zustand der Unfreiheit und nicht gewöhnlichen Dienst.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Bewahrt die konkrete hebräische Wendung und ihren feierlichen Klang, ohne im Deutschen unnatürlich zu wirken.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet die Folgerung aus Israels früherer Versklavung und klingt im heutigen Deutsch klar und würdig.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: gebiete ich dir
  rationale: Die selbstständige Form des Pronomens setzt einen leichten Nachdruck auf den Sprecher; die deutsche Wortstellung nach „Darum“ lässt die Aussage natürlich und bestimmt klingen. Das Partizip bezeichnet das gegenwärtig ergehende Gebot.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Gibt die breite Grundbedeutung von עשה unmittelbar wieder, ohne eine speziellere Bedeutung einzutragen.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: dies
  rationale: Das deutsche Pronomen verweist natürlich auf die unmittelbar vorausgehende Vorschrift. Es bewahrt die in דָּבָר liegende Bedeutungsbreite besser als die engeren Wiedergaben „dieses Gebot“ oder „diese Anweisung“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem gesetzlichem Ton. „Sklave“ macht die erzwungene Unfreiheit in Ägypten deutlich; „dies zu tun“ vermeidet zugleich das unnatürliche „diese Sache zu tun“ und eine unnötige Verengung von דָּבָר.
