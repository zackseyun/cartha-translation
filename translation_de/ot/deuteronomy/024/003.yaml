source:
  edition: WLC
  text: וּ/שְׂנֵאָ/הּ֮ הָ/אִ֣ישׁ הָ/אַחֲרוֹן֒ וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּית֑/וֹ א֣וֹ כִ֤י יָמוּת֙ הָ/אִ֣ישׁ הָ/אַחֲר֔וֹן אֲשֶׁר לְקָחָ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: de
  text: und der zweite Mann sie hasst[a], ihr eine Scheidungsurkunde schreibt[b], sie ihr in die Hand gibt und sie aus seinem Haus entlässt, oder wenn der zweite Mann, der sie sich zur Frau genommen hat[c], stirbt —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie zu hassen beginnt“. Die hebräische Verbform kann als Glied einer rechtlichen Fallfolge wiedergegeben werden; gemeint sein kann, dass der zweite Mann Hass gegen sie entwickelt und daraufhin die Scheidung vollzieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine Urkunde der Abtrennung“. Gemeint ist ein förmliches Schriftstück, das die Ehe auflöst.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Ausdruck „sie sich zur Frau nehmen“ bedeutet, sie zu heiraten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: sie hasst
  rationale: שׂנא bezeichnet starkes Ablehnen beziehungsweise Hassen. Die direkte Wiedergabe bewahrt die lexikalische Schärfe; der deutsche Präsensgebrauch passt zum fortlaufend formulierten Rechtsfall.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: der zweite Mann
  rationale: אַחֲרוֹן bedeutet hier im Gegensatz zum ersten Mann der nachfolgende beziehungsweise zweite Mann. „Der zweite Mann“ ist im Deutschen natürlicher als „der letztere Mann“ und greift dem kontextuellen Begriff „Ehemann“ nicht vor.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: ihr eine Scheidungsurkunde schreibt
  rationale: סֵפֶר כְּרִיתֻת bezeichnet ein förmliches Schriftstück zur Auflösung der Ehe. „Scheidungsurkunde“ ist eine klare, moderne und sachlich genaue Wiedergabe.
- source_word: וְנָתַן בְּיָדָהּ
  choice: sie ihr in die Hand gibt
  rationale: Die konkrete Verfahrenshandlung des hebräischen Ausdrucks wird unmittelbar und idiomatisch wiedergegeben; das erste „sie“ nimmt die feminine „Scheidungsurkunde“ auf.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: sie aus seinem Haus entlässt
  rationale: שׁלח bezeichnet in diesem Zusammenhang das Fortschicken beziehungsweise Entlassen der Frau. „Aus seinem Haus entlässt“ erhält sowohl den rechtlichen als auch den räumlichen Aspekt.
- source_word: אוֹ כִי יָמוּת
  choice: oder wenn … stirbt
  rationale: Die Wendung führt den zweiten möglichen Fall ein. Im deutschen Rechtsstil drückt „oder wenn“ diese alternative Bedingung natürlich aus.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: der sie sich zur Frau genommen hat
  rationale: Die Formulierung bildet das hebräische Heiratsidiom לקח + לו + לאשה transparent ab und bleibt in gehobenem modernem Deutsch verständlich.
theological_decisions: []
