base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: de
  text: Du sollst draußen stehen bleiben, und der Mann, dessen Gläubiger du bist,[a] soll das Pfand zu dir hinausbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der bei dir verschuldet ist“. Die hebräische Wendung kann entweder die Stellung des Gläubigers oder den Zustand des Schuldners hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: draußen
  rationale: Die Präposition mit dem Substantiv bezeichnet den Ort außerhalb des Hauses; „draußen“ ist im Deutschen natürlich und passt zum rechtlichen Zusammenhang.
- source_word: תַּעֲמֹד
  choice: sollst stehen bleiben
  rationale: עמד bedeutet konkret „stehen“; „stehen bleiben“ bewahrt den körperlichen Sinn und lässt zugleich das gebotene Warten vor dem Haus erkennen.
- source_word: וְהָאִישׁ
  choice: und der Mann
  rationale: איש bezeichnet hier im kasuistischen Recht ausdrücklich einen Mann; die Wiedergabe wahrt die grammatische und semantische Geschlechtsangabe.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: dessen Gläubiger du bist
  rationale: Die Wendung beschreibt das Gläubiger-Schuldner-Verhältnis. Diese Formulierung ist natürlich, präzise und vermeidet, den möglichen Akzent einseitig auf das Gewähren oder Eintreiben des Darlehens zu legen.
- source_word: יוֹצִיא
  choice: soll ... hinausbringen
  rationale: Der Hifil von יצא bedeutet „hinausführen/hinausbringen“; zusammen mit הַחוּצָה wird die Bewegung aus dem Haus klar ausgedrückt.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Richtung auf den Gläubiger zu.
- source_word: הָעֲבוֹט
  choice: das Pfand
  rationale: עבוט ist ein als Sicherheit für ein Darlehen dienender Gegenstand; „Pfand“ ist die knappe und geläufige rechtliche Entsprechung.
- source_word: הַחוּצָה
  choice: hinaus
  rationale: Die Richtungsform bedeutet „nach draußen“; „hinaus“ gibt die Bewegung idiomatisch wieder, ohne „draußen“ unnötig zu wiederholen.
