  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: de
  text: Du sollst das Recht eines ansässigen Fremden oder einer Waise[a] nicht beugen und einer Witwe kein Kleidungsstück als Pfand nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines vaterlosen Kindes“. Das hebräische Wort bezeichnet besonders ein Kind, dem der Schutz des Vaters fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: beugen
  rationale: Der Hifil von נטה bezeichnet hier das Beugen oder Verdrehen im rechtlichen Sinn. Die deutsche Wendung „das Recht beugen“ ist präzise und idiomatisch.
- source_word: מִשְׁפַּט
  choice: das Recht
  rationale: מִשְׁפַּט kann Recht, Rechtsprechung oder Rechtsanspruch bedeuten. Zusammen mit „beugen“ bringt „das Recht“ sowohl gerechte Rechtsprechung als auch den geschützten Anspruch der Betroffenen zum Ausdruck.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: גֵּר bezeichnet einen Nichtisraeliten, der dauerhaft unter Israel lebt und in dessen sozialer und rechtlicher Ordnung Schutz genießt; „ansässiger Fremder“ unterscheidet ihn von einem bloß Durchreisenden.
- source_word: יָתוֹם
  choice: Waise
  rationale: יָתוֹם bezeichnet ein Kind ohne väterlichen Schutz. „Waise“ ist die klare und natürliche moderne deutsche Entsprechung.
- source_word: תַחֲבֹל
  choice: als Pfand nehmen
  rationale: חבל bezeichnet in diesem Rechtszusammenhang die Inbesitznahme eines Gegenstands als Sicherheit für eine Schuld. „Als Pfand nehmen“ ist im Deutschen eindeutig und geläufig.
- source_word: בֶּגֶד
  choice: Kleid
  rationale: בֶּגֶד ist eine allgemeine Bezeichnung für ein Kleidungsstück. „Kleid“ ist hier im biblisch-rechtlichen Sinn als Kleidungsstück zu verstehen, ohne die Art näher festzulegen.
- source_word: אַלְמָנָה
  choice: einer Witwe
  rationale: Die Genitivfügung gibt den Besitz des Kleidungsstücks natürlich wieder und bewahrt den Schutz der sozial gefährdeten Personengruppe.
theological_decisions:
- issue: Wiedergabe der geschützten sozialen Kategorie גֵּר
  choice: ansässiger Fremder
  alternative: Fremder; Schutzbürger; Beisasse
  rationale: Der Ausdruck bezeichnet keinen beliebigen Ausländer oder Reisenden, sondern einen nicht einheimischen Menschen, der innerhalb der Gemeinschaft lebt. Die gewählte Formulierung wahrt die soziale und rechtliche Besonderheit, ohne eine konfessionelle Deutung einzutragen.
- issue: Syntaktische Zuordnung von יָתוֹם
  choice: „eines ansässigen Fremden oder einer Waise“
  alternative: „eines ansässigen Fremden, einer Waise“
  rationale: Der masoretische Text verbindet גֵּר und יָתוֹם ohne ausdrücklich wiederholte Konjunktion. Die deutsche Koordination mit „oder“ macht beide geschützten Personengruppen lesbar, ohne ihre jeweilige Eigenständigkeit aufzuheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte Rechtswendung „das Recht beugen“ erhält die juristische Schärfe des Hebräischen. „Ansässiger Fremder“ erklärt die soziale Kategorie knapp im Haupttext; die Fußnote behandelt dagegen die Bedeutungsnuance von יָתוֹם und steht entsprechend unmittelbar nach „Waise“.
