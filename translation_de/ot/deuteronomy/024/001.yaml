source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: de
  text: Wenn ein Mann eine Frau nimmt und ihr Mann wird und es geschieht, dass sie keine Gunst in seinen Augen findet, weil er an ihr etwas Anstößiges[a] gefunden hat, und er ihr einen Scheidebrief schreibt, ihn ihr in die Hand gibt und sie aus seinem Haus wegschickt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine anstößige Sache“ oder „etwas Schändliches“. Die hebräische Wendung ist mehrdeutig und wurde unterschiedlich verstanden.'
    reason: Die Bedeutung von עֶרְוַת דָּבָר ist umstritten und darf nicht unnötig auf einen bestimmten Tatbestand festgelegt werden.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי eröffnet hier den Bedingungssatz eines kasuistischen Rechtsfalls. „Wenn“ macht deutlich, dass noch kein Scheidungsgebot ausgesprochen wird.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ein Mann eine Frau nimmt
  rationale: Die hebräische Wendung wird in verständlichem Deutsch relativ formnah wiedergegeben; der folgende Ausdruck verdeutlicht, dass es um die Eheschließung geht.
- source_word: וּבְעָלָהּ
  choice: und sie heiratet
  rationale: Das Verb bezeichnet hier das Eingehen der ehelichen Verbindung. „Heiratet“ ist natürlich und vermeidet irreführende Besitzvorstellungen.
- source_word: וְהָיָה
  choice: und es geschieht
  rationale: Die Wendung führt den angenommenen Rechtsfall weiter und bewahrt zugleich den formelhaften Charakter des Hebräischen.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: sie keine Gunst in seinen Augen findet
  rationale: Die bildhafte hebräische Redeweise bleibt erhalten und ist im Deutschen verständlich.
- source_word: כִּי מָצָא בָהּ
  choice: weil er … an ihr gefunden hat
  rationale: כִּי begründet innerhalb des Falls, weshalb sie in seinen Augen keine Gunst findet.
- source_word: עֶרְוַת דָּבָר
  choice: etwas Anstößiges
  rationale: Die schwierige und unbestimmte Wendung wird bewusst nicht auf ein bestimmtes Fehlverhalten eingeengt. Eine Fußnote nennt mögliche Bedeutungsnuancen.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: und er ihr einen Scheidebrief schreibt
  rationale: „Scheidebrief“ bezeichnet im Deutschen knapp und klar die förmliche Urkunde zur Auflösung der Ehe.
- source_word: וְנָתַן בְּיָדָהּ
  choice: ihn ihr in die Hand gibt
  rationale: Die konkrete, rechtlich bedeutsame Übergabe der Urkunde wird bewahrt.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: und sie aus seinem Haus entlässt
  rationale: „Entlässt“ gibt das Wegschicken im rechtlichen Zusammenhang wieder; „aus seinem Haus“ bewahrt die räumliche Aussage des Ausgangstextes.
theological_decisions:
- issue: Ob der Vers als Anweisung zur Scheidung oder als Einleitung eines Rechtsfalls zu verstehen ist
  choice: Als bedingter Rechtsfall formuliert, nicht als Gebot oder Billigung der Scheidung
  alternative: Eine imperativische oder eigenständig abgeschlossene Formulierung könnte den Eindruck erwecken, der Mann werde hier zur Scheidung ermächtigt oder aufgefordert.
  rationale: Deuteronomium 24,1–4 bildet syntaktisch einen kasuistischen Rechtssatz. Vers 1 gehört zur mehrteiligen Voraussetzung; die eigentliche rechtliche Bestimmung folgt erst später. Die offene Satzform mit abschließendem Komma bewahrt diesen Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-sachlichem Ton. Die längere Satzperiode und das Schlusskomma zeigen, dass Vers 1 nur den Bedingungsteil des bis Vers 4 reichenden Rechtsfalls eröffnet.
