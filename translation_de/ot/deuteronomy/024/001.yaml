review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die kasuistische Satzstruktur, den Grund der fehlenden Gunst, die bewusst unbestimmte Wendung עֶרְוַת דָּבָר sowie die Abfolge von Scheideurkunde, Übergabe und Wegschicken insgesamt zuverlässig wieder. „Nimmt und sie heiratet“ bildet jedoch die zwei hebräischen Verben im Deutschen unnötig doppelt und nicht ganz idiomatisch ab. „… und ihr Mann wird“ bewahrt die zweite Prädikation, ohne den Sinn einzuengen.
  naturalness: Der lange, mit Komma offene Bedingungssatz ist im rechtlich-sachlichen Register angemessen. „Ihr Mann wird“ ist hier natürlicher als die Wiederholung „sie heiratet“. „Aus seinem Haus wegschickt“ entspricht dem konkreten שׁלח und ist im heutigen Deutsch klarer als „entlässt“, das auch andere institutionelle Bedeutungen haben kann.
  terminology: „Scheidebrief“ ist als etablierte, verständliche Bezeichnung für סֵפֶר כְּרִיתֻת geeignet. „Etwas Anstößiges“ lässt die umstrittene Bedeutung von עֶרְוַת דָּבָר offen; die Fußnote wahrt die erforderliche Ambiguität. Es wird weder ein bestimmter Scheidungsgrund noch eine normative Billigung der Scheidung hineinübersetzt.
  issues:
  - severity: low
    issue: Die Verbindung „eine Frau nimmt und sie heiratet“ ist im modernen Deutsch redundant und stilistisch holprig.
    rationale: Die hebräische Abfolge „eine Frau nehmen und ihr Mann werden“ enthält zwei eng verwandte Ausdrücke. Mit „und ihr Mann wird“ bleibt die zweite Aussage sichtbar, ohne sie im Deutschen bloß zu wiederholen.
  - severity: low
    issue: „Entlässt“ ist für וְשִׁלְּחָהּ weniger konkret als möglich.
    rationale: Das Verb bezeichnet das Wegschicken; „aus seinem Haus wegschickt“ gibt sowohl die Handlung als auch die räumliche Ergänzung direkt wieder.
  revised_text: Wenn ein Mann eine Frau nimmt und ihr Mann wird und es geschieht, dass sie keine Gunst in seinen Augen findet, weil er an ihr etwas Anstößiges[a] gefunden hat, und er ihr einen Scheidebrief schreibt, ihn ihr in die Hand gibt und sie aus seinem Haus wegschickt,
  revised_footnotes:
