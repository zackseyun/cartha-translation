revisions:
- from: Wenn ein Mann eine Frau nimmt und sie heiratet und es geschieht, dass sie keine Gunst in seinen Augen findet, weil er etwas Anstößiges[a] an ihr gefunden hat, und er ihr einen Scheidebrief schreibt, ihn ihr in die Hand gibt und sie aus seinem Haus entlässt,
  to: Wenn ein Mann eine Frau nimmt und ihr Mann wird und es geschieht, dass sie keine Gunst in seinen Augen findet, weil er an ihr etwas Anstößiges[a] gefunden hat, und er ihr einen Scheidebrief schreibt, ihn ihr in die Hand gibt und sie aus seinem Haus wegschickt,
  rationale: Die Revision verbessert die idiomatische deutsche Wiedergabe der beiden einleitenden hebräischen Eheformulierungen und macht das abschließende Wegschicken konkreter. Die offene, bis in die folgenden Verse reichende Bedingungsperiode, die rechtliche Abfolge und die lexikalische Unbestimmtheit des Scheidungsgrundes bleiben erhalten.
