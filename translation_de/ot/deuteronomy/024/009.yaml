  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: de
  text: Denk daran, was Jahwe, dein Gott, Mirjam angetan hat, als ihr aus Ägypten zogt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was Jahwe, dein Gott, Mirjam angetan hatte“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Israels Weg nach dem Auszug aus Ägypten; siehe 4. Mose 12,1–15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Denk daran
  rationale: Der Qal-Imperativ Singular fordert unmittelbar zum bewussten Erinnern auf. „Denk daran“ ist im heutigen Deutsch klar und bewahrt die mahnende Kraft.
- source_word: אֵת אֲשֶׁר
  choice: was
  rationale: Die Verbindung aus Objektmarker und Relativpartikel leitet den Inhalt des Erinnerns ein; „was“ gibt dies natürlich wieder.
- source_word: עָשָׂה
  choice: getan hat
  rationale: Das häufige Verb עשה bezeichnet hier Jahwes Handeln. Das deutsche Perfekt klingt natürlich; die genauere Art des Handelns wird nicht in das Verb hineingelesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Konstruktverbindung mit Suffix der 2. Person maskulin Singular wird direkt und als persönliche Bundesbezeichnung wiedergegeben.
- source_word: לְמִרְיָם
  choice: mit Mirjam
  rationale: ל markiert hier die von der Handlung betroffene Person. „Mit Mirjam getan“ ist idiomatisch genug und vermeidet, die grammatisch offene Beziehung vorschnell als ausdrücklich feindliches Handeln festzulegen.
- source_word: בַּדֶּרֶךְ
  choice: unterwegs
  rationale: Die Wendung bedeutet wörtlich „auf dem Weg“ und bezeichnet hier Israels Reise; „unterwegs“ ist knapp und natürlich.
- source_word: בְּצֵאתְכֶם
  choice: als ihr ... zogt
  rationale: Der Infinitiv mit ב und dem Suffix der 2. Person Plural hat temporale Bedeutung. Die Formulierung gibt den gemeinschaftlichen Auszug flüssig wieder.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; zusammen mit „ziehen“ ist „aus Ägypten“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Art von Jahwes Handeln an Mirjam
  choice: mit Mirjam getan hat
  alternative: Mirjam angetan hat
  rationale: Der Zusammenhang in Numeri 12 zeigt ein strafendes Eingreifen, doch עשה mit ל benennt im Vers selbst lediglich das Handeln gegenüber der betroffenen Person. Die gewählte Fassung bewahrt diese sprachliche Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Mahnton. „Denk daran“ ist natürlicher als das gehobenere „Gedenke“, ohne den Imperativ abzuschwächen. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
