lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: und sie sein Haus verlässt
  rationale: יצא mit מן bezeichnet hier das Hinausgehen aus seinem Haus. „Sein Haus verlässt“ gibt die Bewegung samt Ausgangspunkt im Deutschen natürlich und vollständig wieder.
- source_word: וְהָלְכָה
  choice: fortgeht
  rationale: הלך führt die rechtliche Fallfolge weiter. „Fortgeht“ vermeidet die im Deutschen schwerfällige Wiederholung „geht hinaus … und geht“ und bewahrt den Gedanken des Weggehens.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: und die Frau eines anderen Mannes wird
  rationale: היה mit ל bezeichnet hier im Zusammenhang den Eintritt in eine neue eheliche Beziehung. Die Formulierung wahrt den Übergangscharakter von וְהָיְתָה und macht den im Hebräischen idiomatisch ausgedrückten Ehebezug verständlich.
theological_decisions:
- issue: Art der Beziehung zu dem anderen Mann
  choice: die Frau eines anderen Mannes wird
  alternative: zu einem anderen Mann gehört
  rationale: Der Scheidungs- und Wiederverheiratungskontext zeigt eine Ehe an; „gehört“ könnte dagegen bloßen Besitz oder eine nicht näher bestimmte Beziehung nahelegen. Die Übersetzung macht den kontextuellen Sinn deutlich, während die Fußnote den wörtlichen Ausdruck dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Nebensatzwortstellung setzt die in Vers 1 begonnene rechtliche Fallbeschreibung fort; das abschließende Komma signalisiert, dass der Satz im folgenden Vers weitergeht.
