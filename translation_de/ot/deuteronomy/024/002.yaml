  text: and she leaves his house and goes and becomes another man's wife,[a]
translation:
  language: de
  text: und sie sein Haus verlässt, fortgeht und die Frau eines anderen Mannes wird,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einem anderen Mann wird«. Die hebräische Wendung bedeutet hier, dass sie einen anderen Mann heiratet.'
