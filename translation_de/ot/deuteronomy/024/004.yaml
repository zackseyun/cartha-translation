base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: de
  text: Ihr erster Mann, der sie fortgeschickt hat, darf sie nicht wieder zur Frau nehmen, nachdem sie verunreinigt worden ist[a]; denn das ist ein Gräuel vor Jahwe. Du sollst das Land, das Jahwe, dein Gott, dir als Erbbesitz gibt, nicht mit Sünde belasten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem sie unrein geworden ist“ oder „nachdem sie unrein gemacht worden ist“. Das Hebräische sagt, dass sie verunreinigt worden ist, ohne die genaue Art dieser Verunreinigung zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: ihr erster Mann
  rationale: בעל bezeichnet im ehelichen Zusammenhang den Ehemann. „Erster Mann“ gibt הָרִאשׁוֹן direkt wieder und wahrt den Gegensatz zum späteren Ehemann.
- source_word: שִׁלְּחָהּ
  choice: sie fortgeschickt hat
  rationale: שלח bedeutet wörtlich „fortschicken“. Im rechtlichen Zusammenhang ist die Scheidung gemeint; die konkrete hebräische Ausdrucksweise bleibt jedoch erhalten.
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: sie nicht wieder zur Frau nehmen
  rationale: Die Infinitivfolge beschreibt die erneute Aufnahme als Ehefrau. Die gewählte Formulierung ist im Deutschen natürlich und gibt die Wiederverheiratung klar wieder.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: nachdem sie verunreinigt worden ist
  rationale: Der passive Stamm von טמא bezeichnet ein Verunreinigtwerden, ohne hier dessen genaue rechtliche, kultische oder relationale Art festzulegen.
- source_word: תוֹעֵבָה
  choice: ein Gräuel
  rationale: „Gräuel“ bewahrt die starke moralisch-bundestheologische Wertung von תוֹעֵבָה und ist als biblischer Begriff im modernen Deutschen verständlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor/in der Gegenwart von“. Der Gottesname יְהוָה wird in der üblichen deutschen Form „Jahwe“ wiedergegeben.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Du sollst das Land … nicht mit Sünde belasten
  rationale: Der Hifil von חטא kann das Verursachen von Sünde oder das Bringen von Schuld bezeichnen. „Mit Sünde belasten“ ist natürliches Deutsch und bewahrt den Gedanken, dass das Handeln Sünde beziehungsweise Schuld über das Land bringt.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: dir als Erbbesitz gibt
  rationale: נַחֲלָה bezeichnet das zugeteilte Erbe beziehungsweise den bleibenden Erbbesitz und trägt hier den Bundes- und Landbezug.
theological_decisions:
- issue: Bedeutung der Verunreinigung in der Wiederverheiratungsregel
  choice: Die allgemeine passive Formulierung „verunreinigt worden ist“ bleibt erhalten.
  alternative: „unrein geworden ist“, „sexuell entehrt worden ist“ oder „durch die zweite Ehe unzulässig geworden ist“
  rationale: Der hebräische Text nennt mit dem Passiv von טמא eine Verunreinigung, bestimmt aber in diesem Vers nicht ausdrücklich, ob sie kultisch, sexuell, rechtlich oder relational zu verstehen ist. Die Übersetzung entscheidet diese Spannung nicht.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR oder Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben; dies ist die im modernen Deutschen geläufige Form der wissenschaftlich üblichen Rekonstruktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Satzstruktur bleibt erkennbar, wird aber durch natürliche deutsche Wortstellung lesbar gehalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Anmerkung bezieht.
