lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt die fortführende Konjunktion ו und leitet natürlich die Bedingung ein.
- source_word: אִישׁ עָנִי הוּא
  choice: er ein armer Mann ist
  rationale: Gibt das singularische Maskulinum אִישׁ und die durch הוּא hervorgehobene Aussage über seine Armut genau und verständlich wieder.
- source_word: לֹא תִשְׁכַּב
  choice: darfst du dich nicht schlafen legen
  rationale: Bewahrt das konkrete Bild des hebräischen Verbs שׁכב, während die Fußnote die rechtliche Bedeutung im Zusammenhang erläutert.
- source_word: בַּעֲבֹטוֹ
  choice: mit seinem Pfand
  rationale: עֲבוֹט bezeichnet den als Sicherheit überlassenen Gegenstand; „Pfand“ ist im Deutschen präzise und allgemein verständlich. Die Präposition ב wird bildnah mit „mit“ wiedergegeben.
