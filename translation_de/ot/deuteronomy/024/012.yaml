  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: de
  text: Und wenn er ein armer Mann ist, sollst du sein Pfand nicht über Nacht bei dir behalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du sollst nicht mit seinem Pfand schlafen.“ Gemeint ist, dass du den als Sicherheit für ein Darlehen gegebenen Gegenstand nicht über Nacht behalten darfst.'
