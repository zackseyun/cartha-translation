  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: de
  text: Und denk daran, dass du in Ägypten ein Sklave warst und Jahwe, dein Gott, dich von dort erlöst hat. Darum gebiete ich dir, dies zu tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Und denk daran
  rationale: Das Qal Perfekt 2. Person Singular mit vorangestelltem וְ hat im Kontext auffordernde Kraft. Die imperativische Wiedergabe ist im Deutschen natürlich; „Und“ bewahrt die schlichte Verknüpfung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt des Erinnerns ein, nicht primär eine Begründung.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Das Wort bezeichnet hier Israels unfreien Status in Ägypten. „Diener“ würde die Härte dieses Zustands abschwächen.
- source_word: וַיִּפְדְּךָ
  choice: dich … erlöst hat
  rationale: פדה bezeichnet das Loskaufen beziehungsweise Befreien aus Bindung. „Erlöst“ bewahrt sowohl den Befreiungssinn als auch die theologische Resonanz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte und idiomatische Wiedergabe der Konstruktverbindung mit Suffix der 2. Person Singular.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die adverbiale Wendung verweist knapp auf Ägypten zurück.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet die Folgerung aus Israels eigener Befreiung. „Darum“ ist im modernen Deutsch klarer und natürlicher als „deshalb“ oder „daher“ an dieser Stelle.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: gebiete ich dir
  rationale: Das ausdrückliche Pronomen אָנֹכִי und das Partizip tragen Gegenwartsbezug und Nachdruck. Die deutsche Verb-Erststellung nach „Darum“ bewahrt diesen Zusammenhang idiomatisch.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: so zu handeln
  rationale: Die Wendung verweist auf die unmittelbar vorausgehende Rechtsanweisung. „So zu handeln“ gibt diesen Rückbezug in natürlichem Deutsch wieder, ohne „Gebot“ in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe von עֶבֶד für Israels Lage in Ägypten
  choice: Sklave
  alternative: Knecht
  rationale: Im Rückblick auf Ägypten steht der unfreie, versklavte Status im Vordergrund. „Sklave“ macht diese soziale Wirklichkeit im heutigen Deutsch eindeutig; „Knecht“ ist mehrdeutig und altertümlich.
- issue: Bedeutungsumfang von פדה
  choice: erlöst
  alternative: befreit
  rationale: „Erlöst“ schließt die konkrete Befreiung aus der Sklaverei ein und erhält zugleich die im Verb angelegte Loskaufs- beziehungsweise Erlösungsdimension. Der Vers selbst legt den Mechanismus nicht näher fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede in der 2. Person Singular. Die Satzstruktur bleibt knapp und folgt dem Erinnerungs- und Folgerungszusammenhang des Hebräischen. „So zu handeln“ vermeidet das im Deutschen schwerfällige „diese Sache zu tun“.
