  register: Moderne, würdige Standardsprache. Die Wiederholung von „danach“ und „noch einmal“ verdeutlicht den in עולל und אַחֲרֶיךָ liegenden zweiten Erntegang. Die sozialrechtliche Dreiergruppe wird ohne konfessionelle Zusätze wiedergegeben.
