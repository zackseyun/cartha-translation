base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: de
  text: Wenn du die Trauben deines Weinbergs erntest, sollst du hinter dir her keine Nachlese halten[a]. Sie sollen dem ansässigen Fremden[b], der Waise[c] und der Witwe gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du die verbliebenen Trauben nicht nachträglich einsammeln“. Das hebräische Verb bezeichnet hier einen zweiten Durchgang, bei dem die nach der Ernte verbliebenen Trauben gesammelt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist ein nichtheimischer Bewohner, der dauerhaft im Land lebte; auch: „der Fremde mit Wohnrecht“.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „dem Vaterlosen“. Das hebräische Wort kann besonders ein Kind bezeichnen, das keinen Vater hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den vorausgesetzten Fall einer Rechtsbestimmung ein; „wenn“ ist im modernen Deutschen dafür natürlich.
- source_word: תִבְצֹר כַּרְמְךָ
  choice: die Trauben in deinem Weinberg erntest
  rationale: בצר bezeichnet spezifisch die Weinlese beziehungsweise das Ernten von Trauben. Die explizite Nennung der Trauben gibt den im hebräischen Verb enthaltenen Sinn natürlich wieder.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: sollst du danach nicht noch einmal nachlesen
  rationale: Das Verb bezeichnet hier das Einsammeln der nach dem ersten Durchgang verbliebenen Trauben. „Danach nicht noch einmal nachlesen“ verbindet die zweite Nachlese ausdrücklich mit der eigenen Ernte und ist im Deutschen verständlich.
- source_word: לַגֵּר
  choice: dem ansässigen Fremden
  rationale: גֵּר bezeichnet einen nichtisraelitischen, dauerhaft unter Israel lebenden Einwohner. „Ansässiger Fremder“ bewahrt sowohl Fremdstatus als auch Ortsansässigkeit.
- source_word: לַיָּתוֹם
  choice: der Waise
  rationale: יָתוֹם kann „Vaterloser“ oder allgemeiner „Waise“ bedeuten. „Waise“ ist die natürliche heutige Bezeichnung; die engere wörtliche Möglichkeit wird in der Fußnote genannt.
- source_word: וְלָאַלְמָנָה
  choice: der Witwe
  rationale: אַלְמָנָה bedeutet eindeutig „Witwe“.
- source_word: יִהְיֶה
  choice: Was übrig bleibt, soll … gehören
  rationale: Das grammatische Subjekt ist im Hebräischen nur durch den Kontext erschlossen. Die Formulierung macht den Bezug auf die verbliebenen Trauben idiomatisch deutlich, ohne den Rechtsgehalt zu verändern.
