source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: de
  text: Sieben Tage lang darf in deinem ganzen Gebiet kein Sauerteig bei dir zu sehen sein, und von dem Fleisch, das du am Abend des ersten Tages opferst, darf nichts bis zum Morgen übrig bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Am Abend des ersten Tages“ kann sich besonders auf das Passahopfer zu Beginn des Festes beziehen; ausdrücklich steht hier jedoch weder „Passahopfer“ noch „Passahlamm“.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: darf … zu sehen sein
  rationale: Das Nifal von ראה ist passiv; die Formulierung gibt das Verbot in natürlichem Deutsch wieder.
- source_word: שְׂאֹר
  choice: Sauerteig
  rationale: Der Begriff bezeichnet ein Gär- bzw. Triebmittel; „Sauerteig“ ist im Passahkontext präziser als das engere moderne „Hefe“.
- source_word: בְּכָל גְּבֻלְךָ
  choice: in deinem ganzen Gebiet
  rationale: גְּבוּל bezeichnet hier das gesamte Territorium, nicht nur dessen Grenzen.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die vorangestellte Zeitangabe ist idiomatisch und bewahrt den zeitlichen Umfang.
- source_word: יָלִין
  choice: darf … bis zum Morgen übrig bleiben
  rationale: לין bezeichnet hier das Verbleiben über Nacht; im Zusammenhang mit Opferfleisch ist diese deutsche Wendung klar und natürlich.
- source_word: מִן הַבָּשָׂר
  choice: von dem Fleisch … nichts
  rationale: Die partitive Konstruktion wird im Deutschen natürlich wiedergegeben; בָּשָׂר bedeutet wörtlich „Fleisch“ und ist zugleich ein üblicher Opferbegriff.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: das du … opferst
  rationale: זבח bezeichnet im kultischen Zusammenhang das Schlachten bzw. Darbringen als Opfer; „opfern“ vermittelt diesen Sinn knapp.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: des ersten Tages
  rationale: Der hebräische Text nennt nur den „ersten Tag“; eine Ergänzung wie „des Festes“ oder „Passah“ wäre interpretierend.
- source_word: לַבֹּקֶר
  choice: bis zum Morgen
  rationale: Die Präposition mit בֹּקֶר markiert in diesem Verbot die zeitliche Grenze.
theological_decisions:
- issue: Bezug des am ersten Tag geopferten Fleisches
  choice: Im Haupttext allgemein als „Fleisch“ wiedergeben, ohne es ausdrücklich als Passahopfer oder Passahlamm zu bezeichnen.
  alternative: Die Wendung ausdrücklich auf das Passahopfer beziehen oder weiter als Opferfleisch der Festeröffnung verstehen.
  rationale: Der hebräische Wortlaut sagt lediglich „das Fleisch, das du am Abend des ersten Tages opferst“. Die Übersetzung bewahrt diese Offenheit und entscheidet die umstrittene Bezugsfrage nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sauerteig“ bewahrt den kultischen Passahwortschatz; die Satzstellung dient der Klarheit. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen Auslegungsfrage er sich bezieht.
