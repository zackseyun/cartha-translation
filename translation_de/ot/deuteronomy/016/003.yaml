source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: de
  text: Du sollst dazu kein gesäuertes Brot essen. Sieben Tage lang sollst du dazu ungesäuertes Brot essen, das Brot des Elends; denn in Eile bist du aus dem Land Ägypten ausgezogen, damit du dich alle Tage deines Lebens an den Tag erinnerst, an dem du aus dem Land Ägypten ausgezogen bist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלָיו
  choice: dazu
  rationale: Die Präposition bezeichnet hier idiomatisch die Speisen, die zusammen mit dem Passahopfer gegessen werden. „Dazu“ ist im Deutschen natürlich und lässt den Bezug auf den vorherigen Vers bestehen.
- source_word: חָמֵץ
  choice: gesäuertes Brot
  rationale: Im Zusammenhang der Mahlzeit bezeichnet der Ausdruck gesäuerte Nahrung, insbesondere Brot; diese Wiedergabe bildet zugleich den klaren Gegensatz zu מַצּוֹת.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Dies ist die geläufige und verständliche deutsche Bezeichnung für das Festbrot und wahrt den Gegensatz zu gesäuertem Brot.
- source_word: לֶחֶם עֹנִי
  choice: Brot des Elends
  rationale: „Elend“ bewahrt die Bedeutungsbreite von עֹנִי zwischen Bedrängnis, Not und Armut, ohne die Wendung ausschließlich wirtschaftlich zu deuten.
- source_word: בְחִפָּזוֹן
  choice: in Eile
  rationale: Die Formulierung gibt den dringlichen, hastigen Aufbruch wieder, ohne zusätzlich Angst oder Flucht ausdrücklich in den Text einzutragen.
- source_word: לְמַעַן תִּזְכֹּר
  choice: So sollst du dich … erinnern
  rationale: Die deutsche Satzverknüpfung bringt die Zweck- beziehungsweise Folgewirkung des Erinnerungsmahls natürlich zum Ausdruck.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: alle Tage deines Lebens
  rationale: Die formnahe Wendung bewahrt den Gedanken fortdauernden Erinnerns während des ganzen Lebens.
theological_decisions:
- issue: Bedeutung von לֶחֶם עֹנִי als Erinnerungszeichen des Exodus
  choice: Brot des Elends
  alternative: Brot der Armut; Brot der Not
  rationale: Die Wiedergabe hält die Erinnerung an Israels Bedrängnis und Befreiung zusammen und verengt עֹנִי weder auf wirtschaftliche Armut noch auf eine einzelne Form des Leidens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Singular folgt dem Hebräischen. „Dazu“ nimmt den im vorigen Vers genannten Passahschlachtopfer-Kontext auf; die Wiederholung „aus dem Land Ägypten gezogen“ bewahrt die eindringliche Wiederholung des Ausgangstextes.
