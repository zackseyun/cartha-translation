  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: das Verbot von Gesäuertem zur Mahlzeit, die siebentägige Pflicht zu ungesäuertem Brot, die Bezeichnung לֶחֶם עֹנִי, den hastigen Auszug und die lebenslange Erinnerung. Die Wiedergabe von עָלָיו mit „dazu“ ist im Kontext des vorher genannten Passahopfers idiomatisch vertretbar. Allerdings drückt „So sollst du dich … erinnern“ den durch לְמַעַן eingeleiteten Zweck weniger genau aus und kann wie eine zusätzliche, koordinierte Aufforderung wirken.'
  naturalness: Das Deutsch ist insgesamt klar und würdevoll. „damit du dich … erinnerst“ ist sowohl natürlicher als auch syntaktisch präziser als „So sollst du dich … erinnern“. Die Wiederaufnahme „aus dem Land Ägypten gezogen“ ist verständlich; „ausgezogen“ entspricht dem etablierten deutschen Bibelgebrauch und dem Ausgangsverb genauer.
  terminology: „Gesäuertes Brot“, „ungesäuertes Brot“ und „Brot des Elends“ sind sachgerecht und registerangemessen. Die Fußnote bewahrt die lexikalische Offenheit von עֹנִי, ohne die Hauptübersetzung einseitig auf wirtschaftliche Armut festzulegen.
