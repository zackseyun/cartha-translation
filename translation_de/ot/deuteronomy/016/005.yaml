review_pass:
  verdict: revise
  source_fidelity: Die Verbotsformel „Du darfst nicht“ gibt לֹא תוּכַל לִזְבֹּחַ im Gesetzeskontext treffend wieder. „Passah“ mit der Alternative „Passahopfer“ wahrt den im Hebräischen möglichen Bedeutungsspielraum. שְׁעָרֶיךָ („deine Tore“) ist hier jedoch eine feste Metonymie für die zugeteilten Städte bzw. Siedlungen; eine rein wörtliche Wiedergabe im Haupttext legt im modernen Deutschen fälschlich ein Opfer im Torbauwerk nahe.
  naturalness: Der Relativsatz „Tore, die Jahwe … dir gibt“ ist zwar grammatisch möglich, aber semantisch unnatürlich, weil Gott im Kontext die Siedlungsorte, nicht deren Tore, gibt. „Ortschaften“ gibt den gemeinten Bezug im modernen Standarddeutsch klar und würdevoll wieder. Die hebräische Bildsprache wird in der Fußnote dokumentiert.
  terminology: „Jahwe“ entspricht dem ausdrücklich verwendeten Gottesnamen יהוה. „Passah“ und „opfern“ sind im kultischen Kontext angemessen. Die Fußnote zum Passahopfer bleibt als sachlich begründete lexikalische Alternative bestehen.
  issues:
  - severity: medium
    issue: „Tore“ wird im Haupttext als wörtlicher Ortsausdruck verstanden werden können.
    rationale: שַׁעַר ist hier metonymisch für die Städte bzw. Ortschaften innerhalb Israels verwendet. Die bisherige Fußnote erklärt dies, beseitigt aber die im Deutschen auffällige und potenziell missverständliche Vorstellung, Jahwe gebe „Tore“ und das Opfer finde in ihnen statt, nicht vollständig.
  revised_text: Du darfst das Passah[a] nicht in irgendeiner deiner Ortschaften[b] opfern, die Jahwe, dein Gott, dir gibt.
  revised_footnotes:
