base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: de
  text: Du darfst das Passah[a] nicht in irgendeiner deiner Ortschaften[b] opfern, die Jahwe, dein Gott, dir gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Passahopfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deiner Tore“; damit sind hier die Städte oder Ortschaften gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Du darfst nicht
  rationale: Die Verbindung von יכל mit Infinitiv hat hier im Gesetzeskontext verbietende Kraft und bezeichnet nicht bloß Unvermögen.
- source_word: לִזְבֹּחַ
  choice: opfern
  rationale: זבח bezeichnet im kultischen Zusammenhang das schlachtende Darbringen eines Opfers; „opfern“ ist im Deutschen knapp und eindeutig.
- source_word: הַפָּסַח
  choice: das Passah
  rationale: פסח kann das Fest, das Opfertier oder das Passahopfer bezeichnen. Beim Verb „opfern“ bleibt die knappe Wiedergabe verständlich, während die sachliche Präzisierung in einer Fußnote steht.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: in irgendeinem deiner Tore
  rationale: Im Geltungsbereich der Verneinung gibt „irgendeinem“ den Sinn von אַחַד natürlich wieder. „Tore“ bewahrt die deuteronomische Metonymie für Städte oder Ortschaften.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: die Jahwe, dein Gott, dir gibt
  rationale: Das Partizip נֹתֵן wird in der wiederkehrenden Landgabeformel idiomatisch präsentisch wiedergegeben; das Relativpronomen bezieht sich dem gemeinten Sinn nach auf die durch „Tore“ bezeichneten Ortschaften.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich; „Jahwe“ bewahrt ihn als Namen.
- issue: Bezugsumfang von הַפָּסַח
  choice: Passah, mit Fußnote „Passahopfer“
  alternative: Passahlamm
  rationale: Der Ausdruck kann hier das Opfer beziehungsweise Opfertier bezeichnen. Der Haupttext wahrt die lexikalische Mehrdeutigkeit und vermeidet die nicht ausdrücklich genannte Festlegung auf ein Lamm.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt im Singular. Die wörtliche Bildsprache „Tore“ wird erhalten und durch eine knappe Fußnote erklärt.
