  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: de
  text: Und du sollst dir keinen Steinpfeiler[a] aufrichten, den Yahweh, dein Gott, hasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „aufgerichteter Stein“ oder „Kultstein“. Das hebräische Wort bezeichnet einen aufrecht aufgestellten Stein, der häufig mit religiöser Verehrung verbunden war.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: aufrichten
  rationale: Das Hifil von קום bezeichnet hier das Aufstellen beziehungsweise Errichten eines Gegenstands; „aufrichten“ ist im Deutschen natürlich und passt zu einem aufrecht stehenden Stein.
- source_word: לְךָ
  choice: dir
  rationale: Der Dativ gibt die persönliche Beteiligung wieder; die knappe deutsche Form „dir“ entspricht dem Hebräischen, ohne den möglichen Zweck näher auszudeuten.
- source_word: מַצֵּבָה
  choice: Steinpfeiler
  rationale: Der Ausdruck bezeichnet einen aufgerichteten Stein oder Pfeiler, häufig im Zusammenhang mit religiöser Verehrung. „Steinpfeiler“ benennt den Gegenstand klar, während die Fußnote den kultischen Zusammenhang erläutert, ohne ihn im Haupttext zwingend festzuschreiben.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen leitet den Relativsatz ein und bezieht sich grammatisch auf den maskulinen deutschen Ausdruck „Steinpfeiler“.
- source_word: שָׂנֵא
  choice: hasst
  rationale: Das Verb bezeichnet Hass oder starke Abneigung. „hasst“ bewahrt die direkte und starke Aussage des Hebräischen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Dies gibt sowohl das Possessivsuffix als auch die persönliche Bundesbeziehung der direkten Anrede wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von מַצֵּבָה
  choice: Steinpfeiler mit erläuternder Fußnote
  alternative: Kultstein; heiliger Pfeiler; Mazzebe
  rationale: Der unmittelbare Kontext ist kultisch, doch das Substantiv bezeichnet zunächst einen aufgerichteten Stein beziehungsweise Pfeiler. Die Übersetzung vermeidet sowohl eine rein architektonische Lesart als auch eine unnötige Festlegung im Haupttext; die Fußnote nennt die kultische Verwendung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem hebräischen Verbotssatz, bleibt aber idiomatisch. „Steinpfeiler“ ist allgemein verständlich; die Fußnote bewahrt die Bedeutungsbreite und den kultischen Kontext.
