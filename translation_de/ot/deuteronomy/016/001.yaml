id: DEU.16.1
reference: Deuteronomy 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: de
  text: Achte auf den Monat Abib[a] und feiere das Passafest für Jahwe, deinen Gott; denn im Monat Abib hat Jahwe, dein Gott, dich bei Nacht aus Ägypten herausgeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Abib ist die Bezeichnung des Monats, in dem das Getreide früh heranreift; auch möglich: „der Frühlingsmonat“.'
    reason: Lexikalische Alternative und Erklärung der kalendarischen Bezeichnung.
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Achte auf
  rationale: Der Imperativ verlangt die sorgfältige Beachtung des festgelegten Monats. „Achte auf“ ist im Deutschen natürlich und bewahrt den verpflichtenden Charakter.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: den Monat Abib
  rationale: אָבִיב bezeichnet reifendes Frühgetreide und dient hier als kalendarische Bezeichnung. Der Monatsname wird bewahrt; die mögliche saisonale Bedeutung wird in der Fußnote genannt.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: und feiere das Passafest
  rationale: Wörtlich steht „ein Passa machen“. Im kultischen Gesetzeskontext gibt „das Passafest feiern“ die gebotene Durchführung verständlich und idiomatisch wieder.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise Widmung der Feier an Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹצִיאֲךָ
  choice: dich ... herausgeführt
  rationale: Die Hifil-Form bezeichnet das Herausführen aus Ägypten; „herausgeführt“ entspricht der geläufigen Exodusformel.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt der Herausführung.
- source_word: לָיְלָה
  choice: bei Nacht
  rationale: Das Wort wird adverbial gebraucht und bezeichnet den Zeitpunkt beziehungsweise die nächtlichen Umstände des Auszugs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: אָבִיב als Monatsbezeichnung oder Jahreszeit
  choice: Abib als kalendarische Bezeichnung
  alternative: Frühling; Monat des Ährenreifens
  rationale: Im Zusammenhang des Passagesetzes bezeichnet die Wendung den für das Fest maßgeblichen Monat. Da אָבִיב zugleich auf junges beziehungsweise reifendes Getreide verweist, bleibt diese Bedeutungsbreite in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten. Das Semikolon macht die Begründungsstruktur des hebräischen Satzes deutlich.
