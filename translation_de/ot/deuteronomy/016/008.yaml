  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die direkte Konstruktion „ist eine feierliche Versammlung“ ist ebenso natürlich wie „soll ... stattfinden“, aber quellennäher.
  terminology: „Jahwe, deinen Gott“, „ungesäuertes Brot“ und „keine Arbeit verrichten“ sind sachgerecht. Für עֲצֶרֶת ist „feierliche Versammlung“ als Haupttext neutraler; die mögliche Nuance einer Schlussversammlung gehört in die Fußnote.
