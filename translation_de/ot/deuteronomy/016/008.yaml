base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: de
  text: Sechs Tage lang sollst du ungesäuertes Brot essen, und am siebten Tag ist eine feierliche Versammlung für Jahwe, deinen Gott; du sollst keine Arbeit verrichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage lang
  rationale: Die Konstruktverbindung bezeichnet eine Zeitdauer; „Sechs Tage lang“ gibt sie im Deutschen natürlich und genau wieder.
- source_word: תֹּאכַל
  choice: sollst du … essen
  rationale: Das Imperfekt hat im gesetzlichen Zusammenhang anweisenden Charakter. Die Soll-Form wahrt den verpflichtenden Sinn in natürlichem Deutsch.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Im Passakontext bezeichnet der Plural Brot ohne Sauerteig. Der deutsche Kollektivausdruck ist klar und gebräuchlich.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Das Waw verbindet die Anweisungen schlicht. Im Deutschen genügt nach dem Satzwechsel „Am“; ein adversatives „aber“ wäre eine unnötige Festlegung.
- source_word: עֲצֶרֶת
  choice: feierliche Festversammlung
  rationale: Das Substantiv bezeichnet eine förmliche kultische Versammlung an einem Festtag und kann zugleich den Abschlusscharakter des Festes anklingen lassen. Die gewählte Wiedergabe vermittelt die sakrale Feierlichkeit, ohne die mögliche Bedeutung auf „Schlussversammlung“ zu verengen.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: für Jahwe, deinen Gott
  rationale: Die Präposition ל kennzeichnet hier die Zuordnung beziehungsweise Widmung der Versammlung. „Für“ ist dafür im Deutschen natürlich; יהוה wird als der Gottesname „Jahwe“ wiedergegeben.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: du sollst keinerlei Arbeit verrichten
  rationale: Die Formulierung gibt das umfassende Arbeitsverbot klar und mit dem angemessenen gesetzlichen Register wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter der עֲצֶרֶת
  choice: feierliche Festversammlung
  alternative: heilige Versammlung; Schlussversammlung
  rationale: Der Ausdruck bezeichnet eine besondere kultische Zusammenkunft und kann im Festzusammenhang auch deren abschließende Funktion meinen. Der Haupttext wahrt den formellen Festcharakter; die Fußnote erhält die lexikalische Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Soll-Form. Der kurze hebräische Satz wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die einfache sachliche Verbindung blieb erhalten. Die genuine Bedeutungsbreite von עֲצֶרֶת wird durch eine Fußnote bewahrt.
