  to: Sechs Tage lang sollst du ungesäuertes Brot essen, und am siebten Tag ist eine feierliche Versammlung für Jahwe, deinen Gott; du sollst keine Arbeit verrichten.
  rationale: Die Revision entfernt die im Haupttext nicht ausdrücklich enthaltene Einengung auf eine „Festversammlung“, gibt die hebräische Nominalkonstruktion unmittelbar wieder und bewahrt die umstrittene beziehungsweise kontextuelle Abschlussnuance von עֲצֶרֶת in der Fußnote. Die Satzverbindung mit „und“ spiegelt das Waw sichtbar wider.
