base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: de
  text: Sieben Tage lang sollst du für Jahwe, deinen Gott, an dem Ort, den Jahwe erwählen wird, ein Fest feiern. Denn Jahwe, dein Gott, wird dich bei all deinem Ertrag und bei allem Werk deiner Hände segnen, und du wirst ganz und gar fröhlich sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du sollst nur fröhlich sein“ oder: „und du wirst dich gewiss freuen“. Der hebräische Ausdruck betont eine volle, ungetrübte Freude, kann aber auch wörtlicher mit „nur“ wiedergegeben werden.'
    reason: lexikalische Alternative und Bewahrung der Mehrdeutigkeit von אַךְ
lexical_decisions:
- source_word: תָּחֹג
  choice: ein Fest feiern
  rationale: Das Verb חָגַג bezeichnet das Begehen eines Festes, besonders eines Wallfahrtsfestes. „Ein Fest feiern“ gibt die festliche Handlung in natürlichem modernem Deutsch wieder.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier die Ausrichtung beziehungsweise Widmung des Festes. „Für Jahwe“ ist im Deutschen natürlicher als „Jahwe ein Fest feiern“ und bewahrt diese Ausrichtung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: an dem Ort, den Jahwe erwählen wird
  rationale: Die Wendung bezeichnet den von Gott bestimmten Ort der Gottesverehrung. „An dem Ort“ ist idiomatisches Deutsch; „erwählen“ bewahrt den bewussten Auswahlakt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Festfreude ein. „Denn“ gibt den kausalen Zusammenhang würdig und natürlich wieder.
- source_word: יְבָרֶכְךָ
  choice: wird dich … segnen
  rationale: Die Form von ברך bezeichnet den göttlichen Segen. Die persönliche Konstruktion „dich segnen“ folgt dem hebräischen Objekt.
- source_word: תְּבוּאָתְךָ
  choice: dein ganzer Ertrag
  rationale: תְּבוּאָה umfasst den landwirtschaftlichen Ertrag allgemein und wird daher nicht auf Getreide oder eine einzelne Ernteart verengt.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: alles Werk deiner Hände
  rationale: Die hebräische Wendung bezeichnet die Arbeit eines Menschen und deren Ergebnisse. Die bildhafte Form bleibt im Deutschen verständlich.
- source_word: וְהָיִיתָ
  choice: und du wirst … sein
  rationale: Die Verbform führt die erwartete Folge des Segens fort. Das deutsche Futur entspricht dem vorausgehenden „wird dich segnen“.
- source_word: אַךְ
  choice: ganz und gar
  rationale: אַךְ kann restriktiv oder verstärkend verstanden werden. Im Zusammenhang hebt es wahrscheinlich die uneingeschränkte Fülle der Freude hervor; die Fußnote bewahrt die mögliche alternative Nuance.
- source_word: שָׂמֵחַ
  choice: fröhlich
  rationale: Das prädikative Adjektiv beschreibt einen Zustand der Freude. „Fröhlich“ ist gegenwärtig, verständlich und nicht unnötig abstrakt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: und du wirst ganz und gar fröhlich sein
  alternative: und du sollst nur fröhlich sein; und du wirst dich gewiss freuen
  rationale: אַךְ lässt sowohl eine restriktive Wiedergabe mit „nur“ als auch eine verstärkende Deutung zu. Im Kontext des Festes und des Segens ist volle, ungetrübte Freude wahrscheinlich; die Fußnote macht die echte Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Satzführung. Der lange hebräische Satz wurde nach der Ortsangabe geteilt, ohne den Begründungszusammenhang zu verändern. Die traditionelle biblische Wendung „Werk deiner Hände“ wurde wegen ihrer Klarheit und Bildkraft beibehalten.
