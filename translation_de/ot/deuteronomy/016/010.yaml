source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: de
  text: Dann sollst du für Jahwe, deinen Gott, das Wochenfest feiern und eine freiwillige Gabe aus deiner Hand darbringen[a] – entsprechend dem Segen, den Jahwe, dein Gott, dir schenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher möglicherweise: „nach dem Maß der freiwilligen Gabe deiner Hand“. Der hebräische Ausdruck ist selten und verbindet die Freiwilligkeit der Gabe mit ihrem angemessenen Umfang entsprechend dem empfangenen Segen.'
    reason: lexikalische Alternative und Erhalt einer Mehrdeutigkeit im hebräischen Ausdruck
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Dann sollst du … feiern
  rationale: עשה bezeichnet zusammen mit חג das Begehen oder Feiern eines Festes. „Dann“ gibt die Abfolge im Kontext natürlich wieder.
- source_word: חַג שָׁבֻעוֹת
  choice: das Wochenfest
  rationale: Dies ist die im Deutschen geläufige Bezeichnung des Festes; sie bewahrt den Bezug auf die zuvor gezählten Wochen.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: für Jahwe, deinen Gott
  rationale: Die Präposition ל kennzeichnet hier die Ausrichtung beziehungsweise Widmung des Festes an Jahwe.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: eine freiwillige Gabe aus deiner Hand
  rationale: נִדְבָה bezeichnet eine freiwillige Gabe, und „aus deiner Hand“ bewahrt das persönliche hebräische Bild. Der schwer eindeutig zu bestimmende Maß- oder Anteilsaspekt von מִסַּת wird zusammen mit dem abschließenden Proportionssatz ausgedrückt und in der Fußnote offengelegt.
- source_word: אֲשֶׁר תִּתֵּן
  choice: darbringen
  rationale: Das Relativgefüge wird im Deutschen in die verbale Formulierung integriert, ohne den Sinn des Gebens einer Festgabe zu verändern.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: entsprechend dem Segen, den … dir schenkt
  rationale: Die Wendung bezeichnet die göttliche Segnung als Maßstab für den Umfang der Gabe. „Schenkt“ klingt im Deutschen natürlich und wahrt den fortlaufend geltenden Charakter der Weisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den offenbarten Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von freiwilliger Gabe und göttlichem Segen
  choice: Die Gabe bleibt freiwillig, ihr Umfang richtet sich jedoch nach dem empfangenen Segen.
  alternative: Eine fest bemessene Pflichtabgabe
  rationale: נִדְבָה betont Freiwilligkeit, während מִסַּת und כַּאֲשֶׁר den Gedanken eines angemessenen, am Segen orientierten Umfangs tragen. Die Spannung zwischen Freiwilligkeit und Verhältnismäßigkeit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wochenfest“ ist verständlich und etabliert; „aus deiner Hand“ bewahrt bewusst das konkrete Bild des Hebräischen. Der Gedankenstrich verdeutlicht, dass der empfangene Segen den angemessenen Umfang der freiwilligen Gabe bestimmt.
