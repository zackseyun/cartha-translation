source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: de
  text: Und du sollst dich vor Jahwe, deinem Gott, freuen – du, dein Sohn, deine Tochter, dein Sklave und deine Sklavin[a], der Levit, der in deinen Städten lebt[b], der ansässige Fremde[c], die Waise[d] und die Witwe, die in deiner Mitte sind – an dem Ort, den Jahwe, dein Gott, erwählen wird, um dort seinen Namen wohnen zu lassen[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter können auch mit „Diener und Dienerin“ wiedergegeben werden; hier bezeichnen sie abhängige Mitglieder des Haushalts.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in deinen Toren“. Gemeint sind die Ortschaften beziehungsweise örtlichen Gemeinwesen.'
    reason: idiom
  - marker: c
    text: Gemeint ist ein dauerhaft ansässiger Fremder; auch „Schutzbürger“ oder „Beisasse“ ist möglich.
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Wort kann besonders ein vaterloses Kind bezeichnen.
    reason: lexical_alternative
  - marker: e
    text: 'Wörtlich: „seinen Namen dort wohnen zu lassen“. Die hebräische Verbform ist kausativ.'
    reason: source_form
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: du sollst dich freuen
  rationale: שׂמח bezeichnet Freude und festlichen Jubel. „Sich freuen“ ist im heutigen Deutsch natürlich und bewahrt den verpflichtenden Charakter der Festanweisung.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die feste Wendung bedeutet „vor“ beziehungsweise „in der Gegenwart von“ und bezeichnet hier die Feier in Gottes Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname wahrt, dass im hebräischen Text das Tetragramm und nicht ein Titel steht.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: dein Sklave und deine Sklavin
  rationale: Die beiden geschlechtsspezifischen Begriffe können Dienende bezeichnen, benennen im sozialrechtlichen Zusammenhang aber abhängige beziehungsweise unfreie Mitglieder des Haushalts. „Sklave und Sklavin“ lässt diesen Status sichtbar.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Wörtlich steht „in deinen Toren“; im deuteronomischen Rechtsgebrauch sind damit die örtlichen Gemeinwesen beziehungsweise Städte gemeint. Die sinngemäße Wiedergabe ist für heutige Leser verständlicher.
- source_word: וְהַגֵּר
  choice: der ansässige Fremde
  rationale: גֵּר bezeichnet keinen bloß Durchreisenden, sondern einen Fremden, der dauerhaft unter Israels Sozialordnung lebt.
- source_word: וְהַיָּתוֹם
  choice: die Waise
  rationale: יָתוֹם bezeichnet ein elternloses oder insbesondere vaterloses, damit sozial schutzbedürftiges Kind. „Waise“ ist die geläufige deutsche Wiedergabe.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  rationale: Die Form ist kausativ. Diese Wiedergabe erhält sowohl die Kausativität als auch die charakteristische deuteronomische Aussage vom Wohnen des göttlichen Namens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ macht diesen lexikalischen Unterschied sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Sozialer Status von עבד und אמה
  choice: Sklave und Sklavin
  alternative: Diener und Dienerin
  rationale: Die Wörter besitzen einen Bedeutungsbereich von Dienst bis Unfreiheit. Im haushalts- und sozialrechtlichen Kontext soll der mögliche Besitz- und Abhängigkeitsstatus nicht beschönigt werden; die Fußnote hält die lexikalische Breite offen.
- issue: Aussage über Gottes Namen am erwählten Ort
  choice: seinen Namen wohnen zu lassen
  alternative: seinen Namen dorthin zu setzen
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Gottes Transzendenz und seiner zugesagten Gegenwart am Heiligtum und bildet zugleich den Kausativ des hebräischen Verbs ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange hebräische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; „Freut euch“ nimmt die gemeinschaftliche Festfreude der aufgezählten Gruppe auf, während die einleitende Anrede im Singular erhalten bleibt. Sozialrechtliche Begriffe werden klar, aber mit Fußnoten zu ihrer Bedeutungsbreite wiedergegeben.
