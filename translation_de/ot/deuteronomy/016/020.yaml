  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: de
  text: Gerechtigkeit, Gerechtigkeit sollst du verfolgen[a], damit du lebst und das Land in Besitz nimmst[b], das Jahwe, dein Gott, dir gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich auch »nachjagen«; gemeint ist ein entschlossenes Streben nach Gerechtigkeit.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Land erbst«. Das hebräische Verb kann sowohl »in Besitz nehmen« als auch »erben« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Gerechtigkeit, Gerechtigkeit
  rationale: Das doppelte Substantiv wird als nachdrückliche Wiederholung bewahrt. »Gerechtigkeit« passt zum gerichtlichen Zusammenhang und umfasst im Deutschen sowohl gerechtes Handeln als auch eine gerechte Rechtsordnung.
- source_word: תִּרְדֹּף
  choice: sollst du verfolgen
  rationale: Das Verb bezeichnet ein entschlossenes Verfolgen oder Nachjagen. Die Formulierung wahrt das konkrete Bild und den verpflichtenden Charakter der Weisung.
- source_word: לְמַעַן תִּחְיֶה
  choice: damit du lebst
  rationale: »Damit« gibt die Zweck- beziehungsweise Folgebeziehung knapp wieder; »lebst« bleibt bei der weiten Bedeutung des hebräischen Verbs, ohne Wohlergehen ausdrücklich hinzuzufügen.
- source_word: וְיָרַשְׁתָּ
  choice: und das Land in Besitz nimmst
  rationale: Im Zusammenhang der Landgabe bezeichnet das Verb das Erlangen und Besitzen des Landes. Die ebenfalls mögliche Erbterminologie wird in einer Fußnote erhalten.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: »Das Land« bewahrt den zentralen deuteronomischen Ausdruck für das verheißene Land.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Umschrift gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Einzahl der persönlichen Anrede und die Bundesbeziehung werden direkt wiedergegeben.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Präsens gibt die partizipiale, gegenwärtig beziehungsweise unmittelbar wirksame Landgabe natürlich auf Deutsch wieder.
theological_decisions:
- issue: Bedeutungsumfang von צֶדֶק im gerichtlichen Zusammenhang
  choice: Gerechtigkeit
  alternative: Recht; Rechtschaffenheit
  rationale: Der Zusammenhang mit Richtern, Bestechung und unparteiischer Rechtsprechung legt die öffentliche und rechtliche Dimension nahe. »Gerechtigkeit« wahrt zugleich die weiter reichende ethische Bedeutung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Bundesnamen; die Umschrift bewahrt diesen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von ירשׁ bei der Landgabe
  choice: in Besitz nehmen
  alternative: erben
  rationale: Die Hauptfassung betont das tatsächliche Erlangen des von Gott gegebenen Landes; die mögliche Bundesterminologie des Erbens bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter singularischer Anrede. Die emphatische Wiederholung am Satzanfang bleibt erhalten; der Gottesname wird als »Jahwe« wiedergegeben.
