base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: de
  text: Du sollst sieben Wochen[a] zählen. Von dem Zeitpunkt an, wenn man die Sichel an das stehende Getreide legt, sollst du beginnen, sieben Wochen zu zählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Wochen“ ist mit der Zahl sieben verwandt; die Formulierung betont sieben Zeitabschnitte zu je sieben Tagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: sieben Wochen
  rationale: שָׁבֻעוֹת bezeichnet im kalendarischen Zusammenhang Wochen. Die wörtliche Wortbildung „Siebener“ wird in einer Fußnote kenntlich gemacht.
- source_word: תִּסְפָּר לָךְ
  choice: du sollst … abzählen
  rationale: Der imperfektive Verbalsatz hat hier auffordernde Bedeutung. „Abzählen“ gibt das auf ein festes Ziel gerichtete Zählen natürlich wieder; das dativische לָךְ ist im Deutschen in dieser Wendung nicht eigens auszudrücken, ohne unnatürlich zu klingen.
- source_word: מֵהָחֵל
  choice: von dem Zeitpunkt an, an dem … gelegt wird
  rationale: מִן mit dem Infinitiv des Beginnens bezeichnet den zeitlichen Ausgangspunkt. Die deutsche Formulierung macht diesen Beginn ausdrücklich.
- source_word: חֶרְמֵשׁ
  choice: die Sichel
  rationale: חֶרְמֵשׁ bezeichnet das bei der Getreideernte verwendete Schneidewerkzeug; der bestimmte Artikel passt zur allgemeinen Erntehandlung.
- source_word: בַּקָּמָה
  choice: an das stehende Getreide
  rationale: קָמָה ist die noch auf dem Halm stehende Getreideernte. In Verbindung mit der Sichel gibt „an das stehende Getreide legen“ den hebräischen Ernteausdruck verständlich wieder.
- source_word: תָּחֵל לִסְפֹּר
  choice: sollst du beginnen, … zu zählen
  rationale: Die Verbindung des Verbs „beginnen“ mit dem Infinitiv von ספר wird formal klar und zugleich idiomatisch wiedergegeben.
