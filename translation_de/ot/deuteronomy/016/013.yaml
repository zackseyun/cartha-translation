  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: de
  text: Das Laubhüttenfest sollst du sieben Tage lang feiern,[a] wenn du von deiner Tenne und aus deiner Kelter eingebracht hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeichnet der hebräische Name ein „Fest der Hütten“; „Hütten“ meint zeitweilige Unterkünfte.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Laubhüttenfest
  rationale: Dies ist die im modernen Deutschen geläufige und zugleich anschauliche Bezeichnung des Festes; סֻכּוֹת meint Hütten beziehungsweise zeitweilige Unterkünfte.
- source_word: תַּעֲשֶׂה לְךָ
  choice: sollst du … feiern
  rationale: Mit חַג bezeichnet עשה idiomatisch das Begehen oder Feiern eines Festes. Die Soll-Form bewahrt den verpflichtenden Charakter der Vorschrift.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Formulierung gibt die Dauer im Deutschen natürlich und genau wieder.
- source_word: בְּאָסְפְּךָ
  choice: wenn du … eingebracht hast
  rationale: Die Präposition ב mit dem Infinitiv von אסף hat hier temporale Bedeutung. Das Perfekt erfasst natürlich den Zeitpunkt beim Einbringen der Ernte, ohne eine weitergehende zeitliche Festlegung zu erzwingen.
- source_word: מִגָּרְנְךָ
  choice: den Ertrag von deiner Tenne
  rationale: גֹּרֶן bezeichnet konkret die Tenne; im Zusammenhang mit אסף ist metonymisch das dort verarbeitete und eingebrachte Erntegut gemeint. „Ertrag“ macht diese im Deutschen sonst schwierige Verbindung verständlich und erhält zugleich das konkrete Bild.
- source_word: וּמִיִּקְבֶךָ
  choice: und aus deiner Kelter
  rationale: יֶקֶב bezeichnet eine Kelter beziehungsweise den dazugehörigen Kelterbottich. „Kelter“ ist die prägnante, traditionelle und weiterhin verständliche deutsche Entsprechung.
