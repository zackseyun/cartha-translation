  naturalness: 'Die vorhandene Satzstellung ist grundsätzlich modernes, verständliches Deutsch. Die Wendung „aus irgendeiner Art von Baum pflanzen“ ist jedoch semantisch und stilistisch nicht gelungen: Man pflanzt keinen Kultgegenstand „aus“ einer Baumart. Eine Gedankenstrich-Apposition macht die hebräische Spannung lesbar, ohne eine Holzherkunft zu behaupten.'
