base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: de
  text: Du sollst dir neben dem Altar Jahwes, deines Gottes, den du dir errichtest, keine Aschera – irgendeinen Baum – pflanzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Ascherapfahl“. Das hebräische Wort אֲשֵׁרָה kann einen mit der Göttin Aschera verbundenen Kultgegenstand bezeichnen und nicht nur die Göttin selbst.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: pflanzen
  rationale: Das Verb נטע bedeutet gewöhnlich „pflanzen“. Die konkrete, möglicherweise bewusst spannungsreiche Bildsprache des Hebräischen bleibt damit erhalten, statt sie zu „aufstellen“ zu glätten.
- source_word: אֲשֵׁרָה
  choice: Aschera
  rationale: Die Transliteration bewahrt die mögliche Bedeutung als Göttin, Kultsymbol oder mit ihrem Kult verbundener Baum beziehungsweise Holzgegenstand, ohne die Mehrdeutigkeit vorschnell aufzulösen.
- source_word: כָּל עֵץ
  choice: aus irgendeiner Art von Baum
  rationale: Die Wendung bedeutet wörtlich etwa „jeder/irgendein Baum“. Die Formulierung gibt den umfassenden Charakter des Verbots wieder und verbindet die Aschera verständlich mit ihrem baum- oder holzartigen Charakter.
- source_word: אֵצֶל
  choice: neben
  rationale: „Neben“ gibt die räumliche Nähe konkret und in einem Rechtssatz natürlich wieder.
- source_word: מִזְבַּח
  choice: Altar
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe von מזבח.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Der Genitiv passt zur deutschen Apposition nach „Jahwes“ und bewahrt die persönliche Bundesanrede.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: den du dir errichtest
  rationale: Bei einem Altar ist „errichten“ idiomatischer als das wörtliche „machen“; „dir“ bewahrt den reflexiven Bezug von לָּךְ.
theological_decisions:
- issue: Bezeichnet אֲשֵׁרָה die Göttin Aschera oder einen mit ihr verbundenen Kultgegenstand?
  choice: Der Name „Aschera“ bleibt im Haupttext transliteriert; eine Fußnote erläutert die kultgegenständliche Bedeutungsmöglichkeit.
  alternative: Ascherapfahl; hölzernes Kultbild der Aschera
  rationale: Der hebräische Ausdruck kann je nach Zusammenhang die Gottheit oder ein mit ihrem Kult verbundenes Objekt bezeichnen. Die Transliteration erhält diese sachlich und theologisch relevante Spannung.
translation_notes:
  register: Moderne, würdevolle Rechtssprache in direkter Anrede. Die Satzstellung ist für heutiges Standarddeutsch geglättet, während das auffällige Verb „pflanzen“ und die Mehrdeutigkeit von „Aschera“ erhalten bleiben.
