  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: de
  text: sondern nur an dem Ort, den Jahwe, dein Gott, erwählen wird, um seinen Namen dort wohnen zu lassen[a]. Dort sollst du am Abend, bei Sonnenuntergang, das Passa opfern[b], zu der festgesetzten Zeit deines Auszugs aus Ägypten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sein Name dort wohnt“; wörtlicher: „um seinen Namen dort wohnen zu lassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Passa schlachten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu der festgesetzten Zeit deines Herausgehens aus Ägypten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die Wortverbindung schränkt im Gegensatz zum vorausgehenden Verbot entschieden ein; „sondern nur“ gibt diese ausschließende Kraft natürlich wieder.
- source_word: הַמָּקוֹם
  choice: der Ort
  rationale: „Ort“ ist die übliche und kontextgerechte Wiedergabe; im Deuteronomium bezeichnet das Wort häufig die von Gott erwählte zentrale Kultstätte.
- source_word: יִבְחַר
  choice: erwählen wird
  rationale: Das Imperfekt hat in dieser Rechtsbestimmung Zukunftsbedeutung. „Erwählen“ wahrt zudem den feierlichen, kultischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um seinen Namen dort wohnen zu lassen
  rationale: Die kausative Form wird ausdrücklich wiedergegeben. Zugleich bleibt das deuteronomische Bild vom Wohnen des Namens erhalten, ohne es als räumliche Begrenzung Gottes auszudeuten.
- source_word: תִּזְבַּח
  choice: sollst du … opfern
  rationale: Das Verb bezeichnet hier das kultische Schlachten beziehungsweise Darbringen. „Opfern“ bringt den rituellen Sinn im Deutschen am klarsten zum Ausdruck.
- source_word: הַפֶּסַח
  choice: das Passa
  rationale: Das Substantiv kann das Passafest oder das Passaopfer bezeichnen. Als Objekt von „opfern“ ist hier das Passaopfer gemeint, während die knappe traditionelle Bezeichnung die begriffliche Spannweite bewahrt.
- source_word: בָּעָרֶב
  choice: am Abend
  rationale: Direkte und idiomatische deutsche Zeitangabe.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: bei Sonnenuntergang
  rationale: Die hebräische Wendung bezeichnet idiomatisch das Untergehen der Sonne. „Bei Sonnenuntergang“ ist präzise und natürlich.
- source_word: מוֹעֵד
  choice: zu der festgesetzten Zeit
  rationale: Das Wort bezeichnet einen bestimmten beziehungsweise festgelegten Zeitpunkt; die Formulierung wahrt die zeitliche Verbindlichkeit.
- source_word: צֵאתְךָ מִמִּצְרַיִם
  choice: deines Auszugs aus Ägypten
  rationale: „Auszug“ ist eine natürliche, quellennah gebildete Wiedergabe des nominalen Ausdrucks und vermeidet eine unnötig umständliche Formulierung.
theological_decisions:
- issue: Die Namensformel in der deuteronomischen Zentralisierung des Gottesdienstes
  choice: um seinen Namen dort wohnen zu lassen
  alternative: um seinen Namen dort hinzusetzen / damit sein Name dort wohnt
  rationale: Die Übersetzung bewahrt sowohl die kausative Verbform als auch das theologisch bedeutsame Bild vom Wohnen des göttlichen Namens. Sie legt nicht fest, wie Gottes Gegenwart ontologisch zu verstehen ist, und erhält so die Spannung zwischen seiner Erhabenheit und seiner Bundesgegenwart.
- issue: Bedeutungsumfang von „Passa“ als Opferhandlung oder Fest
  choice: das Passa opfern
  alternative: das Passa schlachten / das Passaopfer darbringen
  rationale: Die knappe Form folgt der hebräischen Ausdrucksweise. Durch das Verb „opfern“ wird der kultische Vorgang deutlich, ohne das Substantiv enger als nötig auf ein bestimmtes Opfertier festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular wird beibehalten. „Jahwe“ gibt den Gottesnamen wieder; „Passa“ folgt dem im Deutschen etablierten biblischen Begriff. Die Satzfolge bleibt quellennah, wird aber durch Punktsetzung und natürliche deutsche Wortstellung gut verständlich gemacht.
