source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: de
  text: Du sollst das Recht nicht beugen, niemanden bevorzugen[a] und kein Bestechungsgeschenk annehmen; denn das Bestechungsgeschenk macht die Augen der Weisen blind und verdreht die Worte der Gerechten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kein Gesicht erkennen“; eine hebräische Redewendung dafür, jemanden zu begünstigen oder parteiisch zu urteilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verdreht die Aussagen beziehungsweise die Rechtssache derer, die im Recht sind“. Das hebräische Wort kann sowohl ihre Worte als auch im juristischen Zusammenhang ihre Sache bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: das Recht beugen
  rationale: Die Hifil-Form von נטה bezeichnet hier das Abbiegen oder Verdrehen eines rechtmäßigen Urteils. „Das Recht beugen“ ist im Deutschen eine natürliche juristische Wendung und bewahrt die forensische Aussage.
- source_word: תַכִּיר פָּנִים
  choice: jemanden bevorzugen
  rationale: Wörtlich bedeutet die hebräische Wendung „Gesichter erkennen“; im Gerichtskontext bezeichnet sie Parteilichkeit oder Begünstigung. Die deutsche Wiedergabe gibt den idiomatischen Sinn klar wieder.
- source_word: שֹׁחַד
  choice: Bestechungsgeschenk
  rationale: Das Wort bezeichnet im vorliegenden Rechtskontext eine Gabe, mit der ein Urteil beeinflusst werden soll. „Bestechungsgeschenk“ ist eindeutig, ohne die Gabe unnötig auf Geld zu beschränken.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: macht die Augen der Weisen blind
  rationale: Die bildhafte Formulierung des Hebräischen bleibt erhalten und ist im Deutschen unmittelbar verständlich.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Der maskuline Plural bezeichnet hier allgemein weise Menschen. „Die Weisen“ gibt dies knapp und ohne unnötige Beschränkung auf Männer wieder.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: verdreht die Worte der Gerechten
  rationale: סלף bedeutet „verdrehen, entstellen“. דִּבְרֵי kann wörtlich „Worte“ oder im Rechtskontext auch „Aussagen, Sache, Rechtsfall“ bezeichnen. Die Hauptfassung bleibt nah am Wortlaut; die juristische Möglichkeit wird in der Fußnote bewahrt.
- source_word: צַדִּיקִם
  choice: die Gerechten
  rationale: Der Ausdruck kann moralisch Gerechte oder im Rechtsstreit diejenigen bezeichnen, die im Recht sind. „Die Gerechten“ erhält diese Bedeutungsbreite besser als „die Unschuldigen“.
theological_decisions:
- issue: Bedeutungsumfang von צַדִּיקִם im Gerichtskontext
  choice: die Gerechten
  alternative: diejenigen, die im Recht sind
  rationale: Die Hauptfassung bewahrt sowohl die moralische als auch die rechtliche Dimension, statt den Ausdruck ausschließlich forensisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer juristischer Sprache. Die parallelen Verbote bleiben knapp; die anschaulichen Bilder des hebräischen Textes werden beibehalten. Alle Fußnotenmarker stehen an den Ausdrücken, auf die sie sich beziehen.
