  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Verben des Hebräischen zutreffend wieder: Zubereiten/Kochen und Essen am erwählten Ort, danach morgendliches Aufbrechen und Gehen zu den eigenen Zelten. Das nicht ausdrücklich genannte Objekt wird mit „es“ angemessen ergänzt. Die Relativkonstruktion „den der HERR, dein Gott, erwählen wird“ ist eine natürliche deutsche Wiedergabe des Ortsausdrucks einschließlich des hebräischen בּוֹ, ohne einen ungesicherten Zweck- oder Besitzsinn hinzuzufügen.'
