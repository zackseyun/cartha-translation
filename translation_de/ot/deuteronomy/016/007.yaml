  text: וּ/בִשַּׁלְתָּ֙ וְ/אָ֣כַלְתָּ֔ בַּ/מָּק֕וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ וּ/פָנִ֣יתָ בַ/בֹּ֔קֶר וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: de
  text: Du sollst es an dem Ort kochen und essen, den der HERR, dein Gott, erwählen wird. Am Morgen sollst du dich auf den Weg machen und zu deinen Zelten zurückkehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Du sollst es … kochen
  rationale: Das Verb kann je nach Zusammenhang allgemein „zubereiten“ oder konkreter „kochen“ bedeuten. „Kochen“ gibt die übliche Bedeutung wieder und lässt das im vorigen Vers genannte Passa als unausgesprochenes Objekt erkennen.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: an dem Ort …, den der HERR, dein Gott, erwählen wird
  rationale: Das pronominale בּוֹ wird im Deutschen natürlich durch die Relativkonstruktion mit „den“ wiedergegeben; ein zusätzliches „dafür“ wäre schwerfällig und semantisch unnötig.
- source_word: וּפָנִיתָ
  choice: sollst du dich auf den Weg machen
  rationale: Wörtlich „dich wenden“; im Zusammenhang bezeichnet es das Aufbrechen beziehungsweise die Rückkehr und wird daher idiomatisch wiedergegeben.
- source_word: לְאֹהָלֶיךָ
  choice: zu deinen Zelten zurückkehren
  rationale: „Zelte“ bewahrt das konkrete Bild des hebräischen Textes. „Zurückkehren“ macht die durch וּפָנִיתָ … וְהָלַכְתָּ bezeichnete Rückbewegung natürlich verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die erkennbare Unterscheidung des Gottesnamens, ohne eine umstrittene Vokalisierung festzulegen.
- issue: Bezug des Ortsausdrucks בּוֹ
  choice: als Bestandteil der Relativkonstruktion „den … erwählen wird“
  alternative: „den … dafür erwählen wird“
  rationale: Im Hebräischen nimmt בּוֹ den Ort innerhalb der Relativkonstruktion wieder auf. Die Übersetzung vermeidet, einen ausdrücklich zweckbezogenen Sinn („dafür“) einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge von Essen, morgendlichem Aufbruch und Rückkehr zu verändern.
