  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: de
  text: Und du sollst Jahwe, deinem Gott, das Passa opfern[a], vom Kleinvieh und von den Rindern, an dem Ort, den Jahwe erwählen wird, um seinen Namen dort wohnen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Passa“ steht hier in Verbindung mit „vom Kleinvieh und von den Rindern“. Manche verstehen dies so, dass nicht nur das eigentliche Passatier gemeint ist, sondern auch die Festopfer, die zum Passa und zum Fest der Ungesäuerten Brote gehören.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Und du sollst … opfern
  rationale: זבח bezeichnet das kultische Schlachten beziehungsweise Darbringen eines Opfers. „Opfern“ gibt den kultischen Sinn natürlich wieder; „sollst“ bewahrt den Weisungscharakter.
- source_word: פֶּסַח
  choice: das Passa
  rationale: פֶּסַח kann das Passafest, den Passaritus oder das Passaopfer bezeichnen. Als Objekt von „opfern“ ist der Opferbezug erkennbar, während die knappe und mehrdeutige Ausdrucksweise des Hebräischen erhalten bleibt.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Die Präposition ל kennzeichnet den Empfänger beziehungsweise die Widmung des Opfers. Die deutsche Dativkonstruktion mit „opfern“ ist idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: צֹאן וּבָקָר
  choice: vom Kleinvieh und von den Rindern
  rationale: Die hebräischen Sammelbegriffe bezeichnen Kleinvieh und Großvieh beziehungsweise Rinder. „Vom“ macht die im Deutschen erforderliche Herkunftsbeziehung deutlich, ohne einzelne Tierarten enger festzulegen.
- source_word: בַּמָּקוֹם
  choice: an dem Ort
  rationale: Gemeint ist der von Gott bestimmte Kultort. „An dem Ort“ ist dafür im Deutschen natürlich und präzise.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: den Jahwe erwählen wird
  rationale: Das Imperfekt verweist im Redekontext auf die zukünftige Wahl des Ortes. „Erwählen“ trägt dem bewussten göttlichen Bestimmen Rechnung.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um seinen Namen dort wohnen zu lassen
  rationale: Die Kausativform von שכן wird mit „wohnen zu lassen“ wiedergegeben. So bleibt die theologisch bedeutsame Rede vom Wohnen des göttlichen Namens erhalten, statt sie zu „seinen Namen dort einsetzen“ abzuflachen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den offenbarten Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang von „Passa“ im Verhältnis zu „Kleinvieh und Rindern“
  choice: Die breite Formulierung des Hebräischen bleibt im Haupttext erhalten.
  alternative: Deutende Aufteilung in „Passaopfer und zugehörige Festopfer“
  rationale: Die Erwähnung sowohl des Kleinviehs als auch der Rinder ist weiter als die Vorschriften für das eigentliche Passatier. Der Haupttext harmonisiert dies nicht; die mögliche Einbeziehung zusätzlicher Festopfer wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-anweisende Form „du sollst“ und die biblisch-theologische Wendung „seinen Namen … wohnen zu lassen“ bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
