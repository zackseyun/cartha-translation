base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: de
  text: Du sollst dir in allen deinen Toren[a], die Jahwe, dein Gott, dir nach deinen Stämmen gibt, Richter und Amtsträger einsetzen. Sie sollen dem Volk gerechtes Recht sprechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in allen deinen Ortschaften«. Wörtlich: »in allen deinen Toren«; die Bereiche am Stadttor dienten als öffentliche Versammlungs- und Gerichtsstätten.'
    reason: Kulturgeschichtliche Erläuterung der wörtlich beibehaltenen Wendung.
  - marker: b
    text: 'Oder: »Sie sollen das Volk mit gerechtem Urteil richten.«'
    reason: Lexikalische und syntaktische Alternative für die gerichtliche Wendung »dem Volk gerechtes Recht sprechen«.
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: Die Bezeichnung meint Personen, die Rechtsentscheidungen treffen; »Richter« ist im rechtlich-administrativen Zusammenhang die klare und übliche deutsche Entsprechung.
- source_word: שֹׁטְרִים
  choice: Amtsträger
  rationale: Das Wort bezeichnet Verwaltungs- oder Vollzugsbeamte im Umfeld der Rechtspflege. »Amtsträger« bewahrt den institutionellen Sinn, ohne ihre genaue Funktion unbelegt festzulegen.
- source_word: תִּתֶּן
  choice: einsetzen
  rationale: Das Verb bedeutet wörtlich »geben« oder »setzen«, bezeichnet hier aber die Bestellung von Personen für ein Amt. »Einsetzen« gibt diesen kontextuellen Sinn natürlich wieder.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: in allen deinen Toren
  rationale: Die konkrete Formulierung des Hebräischen bleibt erhalten. Eine Fußnote erläutert, dass Stadttore zugleich öffentliche und gerichtliche Zentren waren und der Ausdruck daher auch die jeweiligen Orte bezeichnen kann.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִשְׁבָטֶיךָ
  choice: für deine Stämme
  rationale: Die Präposition kann Zugehörigkeit, Zuweisung oder Gliederung ausdrücken. »Für deine Stämme« bewahrt diese knappe Beziehung, ohne sie stärker als nötig als organisatorische Verteilung auszudeuten.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Sie sollen dem Volk … Recht sprechen
  rationale: Die deutsche Rechtswendung »Recht sprechen« gibt die gerichtliche Bedeutung des Verbs idiomatisch wieder; »dem Volk« entspricht dem Gegenstand ihrer richterlichen Tätigkeit.
- source_word: מִשְׁפַּט צֶדֶק
  choice: gerechtes Recht
  rationale: Die Verbindung bezeichnet eine Rechtsprechung beziehungsweise Entscheidung, die von Gerechtigkeit bestimmt ist. »Gerechtes Recht« erhält sowohl die rechtliche als auch die ethische Dimension.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch den Titel »der HERR« wird nicht in den Haupttext übernommen.
- issue: Bedeutung von מִשְׁפַּט צֶדֶק
  choice: gerechtes Recht
  alternative: gerechtes Urteil
  rationale: Die Formulierung verbindet die Rechtsentscheidung mit moralischer Gerechtigkeit. »Gerechtes Recht« lässt offen, ob vor allem der einzelne Urteilsspruch oder die Rechtsprechung als Tätigkeit im Blick steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Singular und die institutionelle Rechtssprache des Verses bleiben erhalten. Die ungewöhnliche Tor-Metapher wird aus Quelltexttreue im Haupttext bewahrt und in der Fußnote erklärt.
