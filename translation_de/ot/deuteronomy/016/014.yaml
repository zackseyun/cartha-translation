  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: de
  text: 'Und du sollst dich an deinem Fest freuen: du, dein Sohn und deine Tochter, dein Sklave und deine Sklavin, der Levit, der ansässige Fremde[a], die Waise[b] und die Witwe, die in deinen Ortschaften wohnen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist ein Fremder nichtisraelitischer Herkunft, der dauerhaft unter den Israeliten lebt; auch: „der fremde Einwohner“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der Vaterlose“. Das hebräische Wort hebt besonders den Verlust des väterlichen Schutzes hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die in deinen Toren sind“. „In den Toren“ meint hier die Ortschaften beziehungsweise das örtliche Gemeinwesen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Und du sollst dich freuen
  rationale: Das Qal-Perfekt mit וְ hat im gesetzlichen Anweisungskontext gebietenden bzw. futurischen Sinn. „Sollst“ bewahrt den verbindlichen Ton und ist im Deutschen idiomatisch.
- source_word: בְּחַגֶּךָ
  choice: an deinem Fest
  rationale: חַג bezeichnet ein religiöses Fest, insbesondere ein Wallfahrtsfest. „An deinem Fest“ gibt sowohl den zeitlichen als auch den feierlichen Bezug natürlich wieder.
- source_word: וְעַבְדְּךָ / וַאֲמָתֶךָ
  choice: dein Sklave und deine Sklavin
  rationale: עֶבֶד und אָמָה bezeichnen hier Personen in gebundener, rechtlich abhängiger Stellung. „Sklave/Sklavin“ vermeidet eine beschönigende Verallgemeinerung zu bloßen Bediensteten.
- source_word: וְהַלֵּוִי
  choice: der Levit
  rationale: Die etablierte Bezeichnung für ein Mitglied des Stammes Levi wird beibehalten.
- source_word: וְהַגֵּר
  choice: der ansässige Fremde
  rationale: גֵּר meint einen nichtisraelitischen Fremden, der dauerhaft unter Israel lebt. Die Formulierung gibt sowohl Fremdherkunft als auch Ortsansässigkeit wieder, ohne moderne ausländerrechtliche Kategorien einzutragen.
- source_word: וְהַיָּתוֹם
  choice: die Waise
  rationale: יָתוֹם bezeichnet ein Kind ohne väterlichen Schutz. Das natürliche deutsche Sammelwort „Waise“ wahrt die soziale Schutzbedürftigkeit; die engere Nuance wird in einer Fußnote genannt.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: die in deinen Ortschaften wohnen
  rationale: „In deinen Toren“ ist eine hebräische Metonymie für die Städte bzw. Siedlungen im eigenen Gemeinwesen. Die Wiedergabe erschließt den gemeinten Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Sozialer Status von עֶבֶד und אָמָה
  choice: Sklave und Sklavin
  alternative: Knecht und Magd; Diener und Dienerin
  rationale: Der rechtlich gebundene und abhängige Status soll nicht abgeschwächt werden. Zugleich zeigt der Vers ausdrücklich ihre Einbeziehung in die gemeinsame Festfreude.
- issue: Identität des גֵּר
  choice: ansässiger Fremder
  alternative: Fremdling; Schutzbürger; Beisasse
  rationale: Die Übersetzung bewahrt die Spannung, dass die Person nicht einheimischer Herkunft ist, aber dauerhaft innerhalb der israelitischen Gemeinschaft lebt.
- issue: Bedeutung von יָתוֹם
  choice: Waise
  alternative: Vaterloser
  rationale: „Waise“ ist im modernen Deutsch die natürliche Bezeichnung; „vaterlos“ bildet die im Tora-Kontext hervorgehobene Schutzlosigkeit genauer ab und wird daher als mögliche Nuance angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Einzelanrede und die singularischen Haushaltsbezeichnungen des Hebräischen bleiben erhalten. Der hebräische Tor-Idiom wird im Haupttext verständlich aufgelöst und in der Fußnote wörtlich dokumentiert.
