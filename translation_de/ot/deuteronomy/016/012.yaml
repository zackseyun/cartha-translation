base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: de
  text: Denk daran, dass du in Ägypten Sklave warst[a], und halte dich an diese Bestimmungen und befolge sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener. Das hebräische Wort עֶבֶד kann einen Diener oder einen Sklaven bezeichnen; hier weist der Zusammenhang auf Israels erzwungene Knechtschaft in Ägypten hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Denk daran
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat hier im Anweisungskontext auffordernde Kraft. „Denk daran“ ist natürliches modernes Deutsch.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt des Erinnerns ein, nicht primär eine Begründung.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Obwohl עֶבֶד sowohl einen Diener als auch einen Sklaven bezeichnen kann, steht hier Israels erzwungene Knechtschaft in Ägypten im Vordergrund.
- source_word: הָיִיתָ
  choice: du … warst
  rationale: Die Form von היה bezeichnet hier einen vergangenen Zustand.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe; „Land“ steht im Hebräischen nicht ausdrücklich.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ
  choice: achte darauf, … zu befolgen
  rationale: Die verbale Verbindung drückt sowohl sorgfältige Beachtung als auch tatsächliche Ausführung aus. Die deutsche Formulierung bildet beides idiomatisch ab, ohne die hebräische Doppelung hölzern nachzuahmen.
- source_word: הַחֻקִּים
  choice: Bestimmungen
  rationale: חֻקִּים bezeichnet verbindlich festgesetzte Vorschriften. „Bestimmungen“ ist im Deutschen präzise und allgemein verständlich.
- source_word: הָאֵלֶּה
  choice: diese
  rationale: Direkte Wiedergabe des Demonstrativpronomens.
theological_decisions:
- issue: Wiedergabe von עֶבֶד im Zusammenhang mit Israels Aufenthalt in Ägypten
  choice: Sklave
  alternative: Diener oder Knecht
  rationale: Der Zusammenhang erinnert an Israels erzwungene Unterdrückung in Ägypten. „Sklave“ bringt diesen sozialen Status deutlicher zum Ausdruck, während die Fußnote die größere Bedeutungsbreite des hebräischen Wortes offenhält.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten. Die hebräische Verbindung „bewahren und tun“ wird idiomatisch wiedergegeben, wobei sowohl sorgfältige Beachtung als auch praktische Befolgung erkennbar bleiben.
