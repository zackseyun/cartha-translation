base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: de
  text: Jeder Mann soll geben, je nachdem, was er geben kann,[a] entsprechend dem Segen, den Jahwe, dein Gott, dir gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach der Gabe seiner Hand“; eine Wendung für das, was jemand zu geben vermag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Jeder Mann
  rationale: Das singularische אִישׁ wird hier distributiv gebraucht. „Jeder Mann“ bewahrt die ausdrücklich männliche Form des Ausgangstextes und passt zum Zusammenhang der zuvor genannten männlichen Festpilger.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: was seine Hand vermag
  rationale: Wörtlich steht „nach der Gabe seiner Hand“. Die Hand bezeichnet idiomatisch die verfügbare Fähigkeit beziehungsweise die Mittel zum Geben. Die gewählte Formulierung erhält das Bild der Hand und vermittelt zugleich den Sinn in natürlichem Deutsch.
- source_word: כְּבִרְכַּת
  choice: entsprechend dem Segen
  rationale: Das Präfix כְּ bezeichnet hier Maß oder Verhältnis. „Entsprechend“ drückt aus, dass die Gabe sich nach dem empfangenen Segen richten soll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die maskuline Singularform der Anrede wird entsprechend dem Hebräischen mit „dein“ wiedergegeben.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: den … dir gegeben hat
  rationale: Der Relativsatz bezieht sich auf „Segen“. Das deutsche Perfekt stellt die erfolgte Gabe mit ihrer fortdauernden Bedeutung passend dar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen als Namen und verwendet die im Deutschen übliche wissenschaftlich und sprachlich etablierte Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen menschlicher Gabe und göttlichem Segen
  choice: entsprechend dem Segen
  alternative: nach dem Segen; im Verhältnis zu dem Segen
  rationale: Die Formulierung bewahrt den proportionalen Sinn von כְּ, ohne eine starre rechnerische Quote oder eine bestimmte Opferlehre in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist klar und gut vorlesbar. Das hebräische Bild der Hand bleibt in verständlicher Form erhalten; der Gottesname wird mit „Jahwe“ wiedergegeben.
