source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: de
  text: 'Dreimal im Jahr sollen alle deine Männer vor Jahwe, deinem Gott, erscheinen[a], und zwar an dem Ort, den er erwählen wird: am Fest der ungesäuerten Brote, am Wochenfest und am Laubhüttenfest[b]. Niemand soll mit leeren Händen vor Jahwe erscheinen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »soll vor Jahwe gesehen werden«. Die hebräische Verbform ist passiv beziehungsweise reflexiv; hier bezeichnet sie das Sich-Einfinden vor Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Fest der Hütten«. »Laubhüttenfest« ist die traditionelle deutsche Bezeichnung.'
    reason: alternative_reading
  - marker: c
    text: '»Mit leeren Händen« bedeutet hier: ohne Gabe oder Opfergabe zu kommen.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: soll … erscheinen
  rationale: Die Nifalform bedeutet wörtlich »soll gesehen werden«, dient hier aber als feste Wendung für das Erscheinen beziehungsweise Sich-Einfinden vor Gott. »Erscheinen« ist im Deutschen natürlich und bewahrt zugleich die mögliche Anspielung auf das Gesehenwerden.
- source_word: כָל זְכוּרְךָ
  choice: jeder Mann bei dir
  rationale: זָכוּר bezeichnet hier ausdrücklich jede männliche Person, die zur Festwallfahrt verpflichtet ist. Die Formulierung gibt den männlichen Geltungsbereich verständlich wieder, ohne ihn geschlechtsneutral auszuweiten.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: Die Wendung »das Angesicht Jahwes« bezeichnet hier seine Gegenwart. Das idiomatische deutsche »vor« vermittelt diesen Sinn ohne eine unnötig körperliche Deutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: an dem Ort, den er erwählen wird
  rationale: Das Futur bewahrt den vorausweisenden Charakter der göttlichen Ortswahl; »erwählen« entspricht dem gewichtigen Sprachgebrauch des Deuteronomiums.
- source_word: חַג הַמַּצּוֹת
  choice: Fest der ungesäuerten Brote
  rationale: Dies ist die geläufige und inhaltlich transparente deutsche Bezeichnung des Wallfahrtsfestes.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Wochenfest
  rationale: Die Wiedergabe folgt dem hebräischen Festnamen und vermeidet die spätere griechisch geprägte Bezeichnung »Pfingsten«.
- source_word: חַג הַסֻּכּוֹת
  choice: Laubhüttenfest
  rationale: »Laubhüttenfest« ist die etablierte deutsche Bezeichnung und gibt סֻכּוֹת, »Hütten«, anschaulich wieder.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: Niemand soll mit leeren Händen vor Jahwe erscheinen
  rationale: »Mit leeren Händen« gibt רֵיקָם idiomatisch wieder und bezeichnet im kultischen Zusammenhang das Kommen ohne die gebotene Gabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. »Jahwe« bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifischer Geltungsbereich von כָל זְכוּרְךָ
  choice: jeder Mann bei dir
  alternative: alle bei dir; jeder bei dir
  rationale: Der Ausgangstext verpflichtet ausdrücklich die männlichen Angehörigen. Eine geschlechtsneutrale Formulierung würde den rechtlichen Umfang verändern.
- issue: Mehrdeutigkeit der Nifalform יֵרָאֶה
  choice: erscheinen, mit Fußnote zur wörtlichen passiven Lesart
  alternative: vor Jahwe gesehen werden
  rationale: Im Zusammenhang ist »erscheinen« die natürliche idiomatische Wiedergabe. Die grammatisch naheliegende passive Bedeutung bleibt in der Fußnote sichtbar und wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Festnamen sind in geläufiger deutscher Form wiedergegeben. Der Satzbau bleibt nahe an der hebräischen Rechtsformulierung, wird aber durch »und zwar« und die Aufzählung natürlich lesbar gemacht.
