  source_fidelity: 'Die Grundstruktur und das Metallbild entsprechen dem Hebräischen: Himmel über dem Angeredeten, Erde unter ihm sowie נְחֹשֶׁת und בַּרְזֶל als kontrastierende Metalle. Im Fluchkontext trägt וְהָיוּ zukunftsbezogene, eintretende Bedeutung; „zu … werden“ gibt dies idiomatisch und ohne Ausdeutung wieder.'
