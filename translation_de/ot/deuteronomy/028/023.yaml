  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: de
  text: Der Himmel über deinem Kopf wird zu Bronze werden und die Erde unter dir zu Eisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: wird … sein
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Zusammenhang des Fluchwortes zukünftige Bedeutung. Die deutsche Futurform bewahrt Vorhersage und feierlichen Ernst.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: der Himmel über deinem Kopf
  rationale: שָׁמַיִם kann »Himmel« oder »Luftraum« bezeichnen. Der Singular »der Himmel« ist im Deutschen für den sichtbaren Wetterhimmel natürlich; die Ortsangabe gibt den hebräischen Bezug idiomatisch wieder.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen. »Bronze« bewahrt das geläufige biblische Metallbild und bildet mit »Eisen« ein eindrückliches Paar; die echte lexikalische Alternative wird in der Fußnote genannt.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: und die Erde unter dir
  rationale: אֶרֶץ kann »Erde«, »Land« oder »Boden« bedeuten. Im vertikalen Gegensatz zum Himmel ist »Erde« naheliegend; »unter dir« bewahrt die Parallelität zu »über deinem Kopf«.
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Die übliche und kontextuell eindeutige Wiedergabe des Metallbegriffs; das Bild vermittelt Härte und Unfruchtbarkeit, ohne diese im Haupttext auszudeuten.
theological_decisions:
- issue: Bildhafte Aussage des Bundesfluchs
  choice: Das Metallbild mit »Bronze« und »Eisen« bleibt ohne erklärende Auflösung im Haupttext stehen.
  alternative: Den Himmel als regenlos und den Boden als dürrehart umschreiben.
  rationale: Der hebräische Text formuliert ein starkes Bild, dessen Anspielung auf Dürre und unnachgiebigen Boden erkennbar ist, aber nicht ausdrücklich erklärt wird. Die Übersetzung bewahrt Bildkraft und theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die parallele räumliche Bildstruktur und der feierliche Zukunftscharakter des Fluchwortes bleiben erhalten.
