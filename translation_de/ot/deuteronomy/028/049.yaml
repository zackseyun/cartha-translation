source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: de
  text: Jahwe wird ein Volk aus der Ferne gegen dich aufbieten, vom Ende der Erde[a], das wie ein Adler heranfliegt[b] – ein Volk, dessen Sprache du nicht verstehst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom äußersten Ende des Landes“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten; die Wendung bezeichnet hier sehr große Entfernung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Adler fliegt“ oder „heranschießt“. Das hebräische Verb bezeichnet eine schnelle Flugbewegung; das mit „Adler“ übersetzte Wort kann auch einen großen Geier bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „dessen Zunge du nicht hörst“. Gemeint ist, dass du seine Sprache nicht verstehst.'
    reason: literal_rendering
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: wird ... gegen dich aufbieten
  rationale: נשא bedeutet wörtlich „heben, tragen“, bezeichnet hier mit עַל jedoch, dass Jahwe ein fremdes Volk gegen Israel heranführt. „Aufbieten“ wahrt die aktive göttliche Verursachung und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: גּוֹי
  choice: Volk
  rationale: גוי bezeichnet hier ein fremdes politisch-ethnisches Gemeinwesen, das als angreifende Macht auftritt. „Volk“ ist im Deutschen idiomatisch und lässt offen, wie seine staatliche Organisation genau beschaffen ist.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Die Wendung betont die große Entfernung, aus der das angreifende Volk kommt.
- source_word: מִקְצֵה הָאָרֶץ
  choice: vom Ende der Erde
  rationale: Die bildhafte hebräische Wendung wird möglichst anschaulich bewahrt. הָאָרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten; hier steht die äußerste Entfernung im Vordergrund.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: Es wird dahinschießen wie der Adler
  rationale: דאה bezeichnet eine schnelle Flugbewegung und kann als Fliegen, Dahinschießen oder Herabstoßen verstanden werden. „Dahinschießen“ vermittelt die bedrohliche Schnelligkeit, ohne eine ausdrücklich abwärts gerichtete Bewegung festzulegen.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: dessen Sprache du nicht verstehst
  rationale: Wörtlich steht „dessen Zunge du nicht hörst“. In Verbindung mit „Zunge/Sprache“ meint שמע hier, dass die fremde Sprache nicht verstanden wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Umschrift „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält die wiederholte Bezeichnung des fremden Volkes und den bedrohlichen Vergleich des hebräischen Textes fest, vermeidet aber unnötig altertümliche Formulierungen.
