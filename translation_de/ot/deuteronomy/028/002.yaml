base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: de
  text: Und alle diese Segnungen werden über dich kommen und dich einholen, wenn du auf die Stimme Jahwes, deines Gottes, hörst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du der Stimme Jahwes, deines Gottes, gehorchst“. Die hebräische Wendung „auf die Stimme hören“ schließt häufig eine gehorsame Antwort ein.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: werden über dich kommen
  rationale: Die Zukunftsfolge im Segenszusammenhang wird natürlich mit „werden … kommen“ ausgedrückt; עַל bezeichnet die Bewegung auf den Angesprochenen hin.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: alle diese Segnungen
  rationale: Direkte und im Bundeszusammenhang angemessene Wiedergabe der bestimmten Nominalgruppe.
- source_word: וְהִשִּׂיגֻךָ
  choice: und dich einholen
  rationale: Das Hifil von נשׂג zeichnet anschaulich Segnungen, die den Angesprochenen erreichen beziehungsweise einholen.
- source_word: כִּי
  choice: wenn
  rationale: Im Zusammenhang der vorausgehenden Bedingung und der folgenden Segenszusage leitet כִּי die Voraussetzung ein; „wenn“ klingt hier im Deutschen natürlicher als „falls“.
- source_word: תִשְׁמַע בְּקוֹל
  choice: auf die Stimme … hörst
  rationale: Die hebräische Wendung wird bildnah bewahrt und bezeichnet in diesem Bundeszusammenhang ein Hören, das gehorsames Handeln einschließt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die Singularanrede mit Possessivsuffix wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen; „Jahwe“ bewahrt ihn als persönlichen Bundesnamen.
- issue: Bedeutung von שׁמע בקול
  choice: auf die Stimme … hören
  alternative: der Stimme … gehorchen
  rationale: Die gewählte Formulierung erhält das hebräische Sprachbild und seine Spannung zwischen Hören und gehorsamer Antwort; eine Fußnote verdeutlicht den eingeschlossenen Gehorsamssinn.
- issue: Syntaktische Funktion von כִּי
  choice: wenn
  alternative: weil
  rationale: Der unmittelbare Kontext der Bundesbedingungen stützt eine konditionale Lesart, ohne die lexikalisch mögliche kausale Bedeutung generell auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Singularanrede „du“ und das lebendige Bild der Segnungen, die den Angesprochenen einholen, bleiben erhalten.
