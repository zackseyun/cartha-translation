base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: de
  text: Die zarte und verwöhnte Frau unter euch, die es aus Verwöhntheit und Zartheit nicht einmal versucht hat, ihre Fußsohle auf die Erde zu setzen, wird den Mann an ihrer Brust[b], ihren Sohn und ihre Tochter mit bösem Blick ansehen[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr Auge wird böse sein gegen …“ Gemeint sein kann, dass sie ihnen feindselig begegnet oder ihnen aus selbstsüchtiger Missgunst etwas vorenthält.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Mann ihrer Brust“ oder „der Mann ihres Schoßes“; eine innige Bezeichnung für ihren Ehemann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: die zarte
  rationale: רַךְ bezeichnet Weichheit oder Zartheit. „Zart“ ist im Deutschen verständlich und bewahrt die Charakterisierung einer äußerst behüteten Frau.
- source_word: וְהָעֲנֻגָּה
  choice: und verwöhnte
  rationale: Das passive Adjektiv von ענג bezeichnet eine durch Luxus und Schonung verweichlichte oder verwöhnte Person. „Verwöhnt“ gibt diesen Aspekt deutlicher wieder als eine bloße Wiederholung von „zart“.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: die … nicht einmal versucht hat, ihre Fußsohle auf den Boden zu setzen
  rationale: נִסְּתָה wird formnah als „versucht hat“ wiedergegeben. „Nicht einmal“ macht die im Kontext hervorgehobene außergewöhnliche Zartheit natürlich verständlich, ohne die Aussage inhaltlich zu erweitern.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: aus Verwöhntheit und Zartheit
  rationale: Die beiden mit מִן eingeleiteten Begriffe nennen den Grund dafür, dass sie ihren Fuß nicht auf den Boden setzte. Die Wiedergabe greift die beiden vorausgehenden Charakterisierungen auf.
- source_word: תֵּרַע עֵינָהּ
  choice: mit bösem Blick ansehen
  rationale: Die hebräische Wendung lautet bildhaft, ihr Auge werde gegen jemanden „böse“ sein. „Mit bösem Blick ansehen“ bewahrt das Augenmotiv und bleibt in modernem Deutsch verständlich; die mögliche Bedeutung von Feindseligkeit oder missgünstigem Vorenthalten wird in der Fußnote erläutert.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: ihren Mann, den sie in den Armen hält
  rationale: אִישׁ bezeichnet hier im ehelichen Zusammenhang ihren Mann; חֵיקָהּ ist wörtlich ihr Schoß oder Busen und drückt innige Nähe aus. Die Formulierung vermeidet im Deutschen missverständliches „Mann ihres Schoßes“, erhält aber das Bild der Intimität.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: ihren Sohn und ihre Tochter
  rationale: Der hebräische Text nennt Sohn und Tochter ausdrücklich; diese Einzelbezeichnungen bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Charakterisierung als „zart und verwöhnt“ sowie das Bild vom bösen Blick bleiben erhalten. Der Gedankenstrich am Versende zeigt an, dass der Satz in Vers 57 weitergeführt wird.
