base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: de
  text: Jahwe wird dich und den König, den du über dich einsetzt[a], zu einer Nation bringen, die weder du noch deine Väter gekannt haben, und dort wirst du anderen Göttern aus Holz und Stein dienen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den König, den du über dich bestellst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dort wirst du andere Götter aus Holz und Stein verehren“; das hebräische Verb bedeutet wörtlich „dienen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: wird … führen
  rationale: Der Hifil von הלך bedeutet hier, jemanden gehen zu lassen bzw. an einen Ort zu führen. „Führen“ gibt die kausative Bewegung wieder, ohne das Exil über den Wortlaut hinaus ausdrücklich zu benennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: den König, den du über dich einsetzt
  rationale: Der Hifil von קום bezeichnet hier das Einsetzen eines Herrschers; „über dich“ bewahrt die hebräische Konstruktion und ihre politische Spannung.
- source_word: גּוֹי
  choice: eine Nation
  rationale: גוי bezeichnet eine Nation bzw. ein Volk; „Nation“ passt zur fremden politischen Gemeinschaft, zu der Israel geführt wird.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: die weder du noch deine Väter gekannt haben
  rationale: Die Formulierung bewahrt die ausdrückliche Gegenüberstellung von „du“ und „deine Väter“ und bringt die völlige Unvertrautheit mit dieser Nation zum Ausdruck.
- source_word: וְעָבַדְתָּ שָׁם
  choice: Dort wirst du … dienen
  rationale: עבד bedeutet wörtlich „dienen“ und kann bei Gottheiten kultische Verehrung bezeichnen. „Dienen“ erhält sowohl den lexikalischen Sinn als auch die mögliche Zwangs- und Gerichtsdimension.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die direkte und im Bundeswortlaut übliche Wiedergabe der hebräischen Wendung.
- source_word: עֵץ וָאָבֶן
  choice: Holz und Stein
  rationale: Die knappe Apposition wird formal bewahrt; sie bezeichnet die anderen Götter verächtlich nach dem Material ihrer Bilder, ohne ein erklärendes „aus“ in den Haupttext einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen unmittelbar. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von עבד bei anderen Göttern
  choice: dienen
  alternative: verehren
  rationale: „Dienen“ hält sich an die Grundbedeutung und lässt offen, ob vor allem Kultdienst, Unterwerfung oder beides im Blick ist; die religiöse Bedeutung ergibt sich aus „anderen Göttern“.
- issue: Referenz von עֵץ וָאָבֶן
  choice: 'appositionell: „anderen Göttern …, Holz und Stein“'
  alternative: „anderen Göttern aus Holz und Stein“
  rationale: Der hebräische Text stellt „Holz und Stein“ ohne ausdrückliche Materialpräposition daneben. Die knappe Apposition erhält die rhetorische Abwertung und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular und „deine Väter“ bleiben entsprechend dem hebräischen Wortlaut erhalten. Die Wortstellung wurde für natürliches Deutsch geglättet, während die knappe Schlussapposition „Holz und Stein“ bewusst bewahrt wurde.
