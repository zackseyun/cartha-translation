  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Jahwe als handelndes Subjekt, das Schlagen mit einem schweren Hautleiden, die Lokalisierung an Knien und Unterschenkeln, die Unheilbarkeit sowie die umfassende Formel von der Fußsohle bis zum Scheitel. Der Plural „Geschwüren“ ist als idiomatische kollektive Wiedergabe des hebräischen Singulars sachgerecht.'
  naturalness: „Jahwe wird dich an den Knien und Unterschenkeln mit schlimmen Geschwüren schlagen“ ist verständliches modernes Standarddeutsch und behält einen angemessen würdigen biblischen Ton. Auch „von denen du nicht geheilt werden kannst“ ist natürlich und gibt die im Hebräischen nicht näher bestimmte Unheilbarkeit wieder.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Geschwüre“ ist für שְׁחִין eine tragfähige, nicht unnötig medizinisch spezifizierende Wahl. „Unterschenkel“ trifft שׁוֹק im Kontext präziser als das allgemeinere „Beine“; die Fußnote sichert mit „Schienbeinen“ eine plausible engere Alternative ab.
