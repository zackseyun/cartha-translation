  variant: modern standard German
source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: de
  text: Jahwe wird dich an den Knien und Unterschenkeln[a] mit schlimmen Geschwüren schlagen, von denen du nicht geheilt werden kannst, von deiner Fußsohle bis zu deinem Scheitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schienbeinen“; das hebräische Wort bezeichnet genauer den unteren Teil des Beins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: wird dich … schlagen
  rationale: Das Hifil von נכה bezeichnet ein Schlagen oder Heimsuchen. „Wird dich … schlagen“ bewahrt die unmittelbare göttliche Verursachung und klingt im Deutschen würdig, ohne unnötig altertümlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּשְׁחִין רָע
  choice: mit schlimmen Geschwüren
  rationale: שְׁחִין bezeichnet eine entzündliche Hauterkrankung, ein Geschwür oder eine Beule; der Singular kann hier kollektiv verstanden werden. רָע kennzeichnet sie als schlimm oder schwer.
- source_word: עַל הַבִּרְכַּיִם
  choice: an den Knien
  rationale: Eine natürliche und anatomisch genaue deutsche Wiedergabe.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: und Unterschenkeln
  rationale: שׁוֹק bezeichnet hier spezifischer den unteren Teil des Beins. „Unterschenkel“ ist im modernen Deutsch präzise und natürlich; „Schienbeine“ bleibt als mögliche engere Wiedergabe in der Fußnote erhalten.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: von denen du nicht geheilt werden kannst
  rationale: Die passive Form bewahrt den Gedanken einer Erkrankung, für die Heilung nicht möglich ist, ohne festzulegen, wer einen Heilungsversuch unternimmt.
- source_word: מִכַּף רַגְלְךָ
  choice: von deiner Fußsohle
  rationale: כַּף bezeichnet in Verbindung mit רֶגֶל idiomatisch die Fußsohle.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: bis zu deinem Scheitel
  rationale: קָדְקֹד ist der Scheitel beziehungsweise oberste Teil des Kopfes. Die Formulierung erhält die umfassende Bewegung vom untersten bis zum obersten Körperteil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen. Die alternative Vokalisierung „Jehova“ wird nicht gewählt.
- issue: Unmittelbare göttliche Verursachung der Krankheit
  choice: Jahwe wird dich … schlagen
  alternative: Jahwe wird dich … heimsuchen
  rationale: Die direkte Konstruktion des Hebräischen wird beibehalten und nicht zu einer bloßen Zulassung oder indirekten Folge abgeschwächt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die anatomische Präzision des Hebräischen wird gewahrt; zugleich bleibt eine engere lexikalische Alternative in der Fußnote sichtbar.
