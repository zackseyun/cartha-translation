  text: בָּר֧וּךְ פְּרִֽי בִטְנְ/ךָ֛ וּ/פְרִ֥י אַדְמָתְ/ךָ֖ וּ/פְרִ֣י בְהֶמְתֶּ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: de
  text: Gesegnet wird die Frucht deines Leibes sein, die Frucht deines Ackers und die Frucht deines Viehs – der Nachwuchs deiner Rinder und die Jungen deines Kleinviehs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Zuwachs deiner Rinder und der Nachwuchs deines Kleinviehs“. Die hebräischen Wendungen שְׁגַר אֲלָפֶיךָ und עַשְׁתְּרֹת צֹאנֶךָ sind traditionelle Bezeichnungen für die Vermehrung des Viehbestands.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gesegnet wird … sein
  rationale: Das prädikative Adjektiv steht in einer Segensformel. Die futurische Fassung entspricht dem Zusammenhang der angekündigten Bundessegnungen und bewahrt zugleich den feierlichen Klang.
- source_word: פְּרִי
  choice: Frucht
  rationale: Die dreimalige Wiederholung wird beibehalten und verbindet rhetorisch Nachkommenschaft, Ackerertrag und tierischen Nachwuchs.
- source_word: בִטְנְךָ
  choice: deines Leibes
  rationale: בטן bezeichnet hier den Leib als Ort menschlicher Nachkommenschaft. Die feste deutsche Wendung „Frucht des Leibes“ gibt das Bild natürlich und würdevoll wieder.
- source_word: אַדְמָתְךָ
  choice: deines Ackers
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet אֲדָמָה den bebauten Erdboden. „Acker“ macht den Ertragssinn deutlich, ohne den Begriff territorial als „Land“ zu verstehen.
- source_word: בְהֶמְתֶּךָ
  choice: deines Viehs
  rationale: Der Ausdruck umfasst domestizierte Nutztiere allgemein; die folgenden Wendungen gliedern sie in Rinder und Kleinvieh.
- source_word: שְׁגַר
  choice: Nachwuchs
  rationale: In der Verbindung mit Rindern bezeichnet das Wort das von ihnen Hervorgebrachte beziehungsweise ihren Zuwachs.
- source_word: אֲלָפֶיךָ
  choice: deiner Rinder
  rationale: אֲלָפִים bezeichnet hier Rinder beziehungsweise Großvieh. „Rinder“ ist präzise und bildet einen klaren Gegenbegriff zu Kleinvieh.
- source_word: עַשְׁתְּרֹת
  choice: die Jungen
  rationale: Der seltene traditionelle Viehzuchtausdruck bezeichnet im Zusammenhang den Nachwuchs beziehungsweise Zuwachs einer Herde. „Die Jungen“ gibt den konkreten Sinn verständlich wieder.
- source_word: צֹאנֶךָ
  choice: deines Kleinviehs
  rationale: צֹאן ist ein Sammelbegriff für Schafe und Ziegen. „Kleinvieh“ bewahrt diese Breite genauer als allein „Schafe“.
theological_decisions:
- issue: Zeitbezug der Segensformel
  choice: 'futurisch: „Gesegnet wird … sein“'
  alternative: 'präsentisch: „Gesegnet ist …“'
  rationale: Der Vers gehört zu den Segnungen, die Israel bei Gehorsam treffen werden (V. 2). Die futurische Form wahrt diesen Kontext, ohne die Segensaussage als bloße Vorhersage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter dreifacher Wiederholung von „Frucht“. „Leib“ trägt die traditionelle Segenssprache, bleibt aber allgemein verständlich. Der Gedankenstrich kennzeichnet die letzten beiden Ausdrücke als nähere Bestimmung von „Vieh“.
