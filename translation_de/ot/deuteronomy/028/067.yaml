source:
  edition: WLC
  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: de
  text: 'Am Morgen wirst du sagen[a]: »Wäre es doch Abend!«, und am Abend wirst du sagen: »Wäre es doch Morgen!« – wegen der Angst deines Herzens, die du fürchten wirst[b], und wegen des Anblicks, den deine Augen sehen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wer gäbe Abend/Morgen?« Die hebräische Wendung drückt hier einen sehnsüchtigen Wunsch aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische wiederholt hier das Wortfeld »Angst/Schrecken« und »fürchten«; auch möglich: »wegen der Angst in deinem Herzen, die du fürchten wirst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die bestimmte temporale Präpositionalgruppe wird im Deutschen natürlich mit »am Morgen« wiedergegeben.
- source_word: תֹּאמַר
  choice: wirst du sagen
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular bezeichnet im Fluchzusammenhang eine zukünftige Erfahrung, keinen Befehl.
- source_word: מִי יִתֵּן
  choice: Wäre es doch schon
  rationale: Die hebräische Wendung, wörtlich »Wer wird geben?«, drückt einen sehnsüchtigen Wunsch aus. »Wäre es doch schon …« gibt diese Funktion idiomatisch wieder und verdeutlicht das Verlangen nach dem jeweils anderen Tagesabschnitt.
- source_word: עֶרֶב / בֹּקֶר
  choice: Abend / Morgen
  rationale: Die gewöhnlichen Zeitbezeichnungen werden direkt übertragen; ihre Gegenüberstellung strukturiert den Vers.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: wegen des Schreckens, der dein Herz erfüllt
  rationale: מִן ist hier kausal. Die wörtliche Wiederholung von Substantiv und Verb (etwa »wegen des Schreckens deines Herzens, den du erschrecken wirst«) wäre im Deutschen unverständlich; die Formulierung bewahrt Intensität, Herzbezug und kausalen Sinn.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: und wegen dessen, was deine Augen sehen werden
  rationale: מַרְאֶה bezeichnet hier den erschreckenden Anblick beziehungsweise das Gesehene. Die Formulierung hält an den ausdrücklich genannten Augen und an der visuellen Eindringlichkeit fest, ohne eine unnatürliche deutsche Doppelung zu erzeugen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der abrupte Wechsel zwischen Morgen und Abend bleiben erhalten. »Schon« macht die Sehnsucht nach dem raschen Ende des jeweils gegenwärtigen Tagesabschnitts natürlich verständlich; die Fußnoten dokumentieren die ungewöhnlicheren hebräischen Wendungen.
