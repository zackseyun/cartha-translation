  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: de
  text: Du wirst viel Saatgut aufs Feld hinausbringen[a], aber nur wenig einbringen, denn die Heuschrecke wird es auffressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst viel Saatgut auf dem Feld aussäen, aber nur wenig ernten.“ Wörtlicher heißt es im Hebräischen: „viel Saatgut aufs Feld hinausbringen“ und „nur wenig einbringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: viel Saatgut
  rationale: זֶרַע bezeichnet hier konkret das zur Aussaat bestimmte Saatgut, רַב dessen große Menge. „Viel Saatgut“ bewahrt das landwirtschaftliche Bild und klingt im modernen Deutschen natürlich.
- source_word: תּוֹצִיא
  choice: wirst … hinausbringen
  rationale: Der Hifil von יצא bedeutet wörtlich „hinausbringen“. Im Zusammenhang ist das Hinausbringen des Saatguts zur Aussaat gemeint; die konkrete hebräische Ausdrucksweise bleibt so erhalten.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: שׂדה bezeichnet hier das bewirtschaftete Feld. Zusammen mit dem Bewegungsverb gibt „aufs Feld“ die Zielrichtung im Deutschen idiomatisch wieder.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: aber nur wenig einbringen
  rationale: אסף bedeutet „sammeln, einbringen“. „Einbringen“ passt zum Erntezusammenhang, ohne das Verb ausdrücklich durch „ernten“ zu ersetzen; „nur wenig“ verdeutlicht den im Hebräischen scharf angelegten Mengenkontrast.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung des geringen Ertrags ein. „Denn“ ist in diesem warnenden, gehobenen Zusammenhang natürlich und klar.
- source_word: יַחְסְלֶנּוּ
  choice: wird es auffressen
  rationale: חסל bezeichnet vollständiges Verzehren oder Vernichten. „Auffressen“ ist bei Heuschrecken anschaulich und kraftvoll; das Pronomen gibt das hebräische Objektsuffix wieder, dessen Bezug im Kontext allgemein auf Saat beziehungsweise Ertrag zielt.
- source_word: הָאַרְבֶּה
  choice: die Heuschrecke
  rationale: אַרְבֶּה ist die gewöhnliche Bezeichnung für die Wanderheuschrecke. Der bestimmte Singular kann kollektiv gebraucht sein; „die Heuschrecke“ bewahrt diese Form und den kollektiven Sinn.
