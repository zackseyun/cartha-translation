  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Ein bislang unbekanntes Volk konsumiert die landwirtschaftlichen Erträge bzw. das Ergebnis der Arbeit; darauf folgt die anhaltende Lage des Unterdrückt- und Zerschlagenseins. „Ertrag deiner Mühe“ ist im Kontext des Verzehrens eine sachgerechte deutsche Entfaltung der bei יְגִיעֲךָ möglichen Bedeutung „Ertrag/Erworbenes aus Mühe“, während Fußnote b die Lesart „Mühe“ absichert.'
  naturalness: Flüssiges, modernes und zugleich würdiges Standarddeutsch. „Allezeit“ ist leicht gehoben, aber klar verständlich und für den Registerton passend. Die Formulierung „unterdrückt und zerschlagen“ bewahrt die knappe, eindringliche hebräische Doppelung.
  terminology: „Volk“, „Frucht deines Ackers“, „Ertrag deiner Mühe“, „unterdrückt“ und „zerschlagen“ sind kontextgerecht. „Acker“ ist gegenüber dem weiteren אַדָמָה etwas konkreter, aber angesichts des ausdrücklich agrarischen Zusammenhangs vertretbar; die Fußnote bietet zudem „Landes“ als Alternative. Die Fußnotenmarker sind korrekt verankert.
