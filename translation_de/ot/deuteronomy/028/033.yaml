source:
  edition: WLC
  text: פְּרִ֤י אַדְמָֽתְ/ךָ֙ וְ/כָל יְגִ֣יעֲ/ךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא יָדָ֑עְתָּ וְ/הָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְ/רָצ֖וּץ כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: de
  text: Ein Volk, das du nicht gekannt hast, wird die Frucht deines Ackers[a] und den ganzen Ertrag deiner Mühe[b] verzehren. Du wirst allezeit nur unterdrückt und zerschlagen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Ertrag deines Landes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine ganze Mühe« beziehungsweise »alles, wofür du dich abgemüht hast«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: die Frucht deines Ackers
  rationale: „Frucht“ bewahrt das konkrete landwirtschaftliche Bild; „Acker“ gibt אַדָמָה hier als bewirtschafteten Boden natürlich wieder.
- source_word: יְגִיעֲךָ
  choice: den ganzen Ertrag deiner Mühe
  rationale: Da יָגִיעַ sowohl Mühe als auch das dadurch Erworbene bezeichnen kann und vom Essen die Rede ist, macht „Ertrag deiner Mühe“ den gemeinten Gegenstand im Deutschen verständlich, ohne die Mühekomponente aufzugeben.
- source_word: יֹאכַל
  choice: wird … verzehren
  rationale: Das gewöhnliche „essen“ ist beim parallel genannten Ertrag im Deutschen ungeschickt; „verzehren“ wahrt den Sinn des Konsumierens, ohne die Intensität von „verschlingen“ einzutragen.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: Ein Volk, das du nicht gekannt hast
  rationale: Die Formulierung erhält den kollektiven Singular und den Rückblick der hebräischen Perfektform; zugleich bleibt die mögliche relationale Färbung von ידע bestehen.
- source_word: רַק
  choice: nur
  rationale: Das Adverb betont, dass der Angeredete ohne Unterbrechung der folgenden Lage ausgesetzt sein wird.
- source_word: עָשׁוּק
  choice: unterdrückt
  rationale: Die passive Form bezeichnet das Erleiden von Unterdrückung beziehungsweise Ausbeutung; „unterdrückt“ ist breit, klar und kontextgerecht.
- source_word: רָצוּץ
  choice: zerschlagen
  rationale: Das Wort bezeichnet ein Zerdrückt- oder Gebrochensein. „Zerschlagen“ erhält die starke Bildlichkeit und kann sowohl körperliche als auch seelisch-soziale Niedergeschlagenheit anklingen lassen.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Die Wendung bezeichnet eine unablässige beziehungsweise dauernde Lage. „Allezeit“ ist knapp, würdig und natürlich verständlich.
theological_decisions: []
