  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: de
  text: Jahwe wird den Fluch, die Verwirrung und die Zurechtweisung über dich senden bei allem, was du unternimmst[a], bis du vernichtet bist und schnell zugrunde gehst – wegen der Bosheit deiner Taten, mit denen du mich verlassen hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei allem Ausstrecken deiner Hand, das du tust“, das heißt: bei allem, woran du deine Hand legst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: wird … senden
  rationale: Das Piel bezeichnet hier Jahwes aktives Verhängen der Bundesflüche; „senden“ ist natürlich und wahrt die ausdrückliche göttliche Urheberschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּךָ
  choice: über dich
  rationale: Die Präposition bezeichnet bei „senden“ das Ziel, über das die Strafwirkungen kommen.
- source_word: הַמְּאֵרָה
  choice: Fluch
  rationale: Das Substantiv bezeichnet hier den konkreten Bundesfluch als Strafwirkung.
- source_word: הַמְּהוּמָה
  choice: Verwirrung
  rationale: Das Wort kann Verwirrung, Bestürzung, Panik oder Tumult bezeichnen; „Verwirrung“ erhält die semantische Weite im Zusammenhang gestörter Unternehmungen.
- source_word: הַמִּגְעֶרֶת
  choice: Bedrohung
  rationale: Das seltene Substantiv aus גער kann einen scharfen Verweis beziehungsweise drohendes Schelten bezeichnen. „Bedrohung“ passt als hereinbrechende Strafwirkung besser als das im Deutschen stärker auf Worte beschränkte „Zurechtweisung“.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: bei allem, was du unternimmst
  rationale: Die hebräische Wendung „bei allem Ausstrecken deiner Hand, das du tust“ meint idiomatisch alles, woran jemand seine Hand legt; die Übersetzung ist verständlich, während die Bildsprache in der Fußnote erhalten bleibt.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: bis du vernichtet bist und schnell zugrunde gehst
  rationale: Die beiden parallelen Infinitive werden verbal und mit unterschiedlichen deutschen Verben wiedergegeben; מַהֵר bleibt als Adverb beim zweiten Glied stehen, ohne die mögliche Reichweite über den gesamten Vorgang dogmatisch einzuengen.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: wegen deiner bösen Taten
  rationale: מִפְּנֵי ist kausal, und מַעֲלָלִים bezeichnet Handlungen beziehungsweise Taten; die attributive Form ist in modernem Deutsch flüssig.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: durch die du mich verlassen hast
  rationale: Das Relativpronomen kann die vorangehenden bösen Taten näher bestimmen. „Durch die“ bewahrt diesen Bezug und macht das Verlassen Jahwes zum Ausdruck dieser Taten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Urheberschaft des Bundesgerichts
  choice: Jahwe wird … über dich senden
  alternative: Fluch, Verwirrung und Bedrohung werden über dich kommen
  rationale: Jahwe ist ausdrücklich Subjekt des Verbs. Die Übersetzung schwächt seine direkte Urheberschaft weder ab noch macht sie unpersönlich.
- issue: Bezug des Relativsatzes אֲשֶׁר עֲזַבְתָּנִי
  choice: durch die du mich verlassen hast
  alternative: weil du mich verlassen hast
  rationale: Die gewählte Fassung wahrt den grammatisch naheliegenden Bezug auf die bösen Taten und damit die Spannung zwischen konkretem Fehlverhalten und dem Verlassen Jahwes; eine rein kausale Auflösung wäre deutender.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die markante Dreierreihe der Strafwirkungen und die parallelen Endpunkte „vernichtet“/„zugrunde gehen“ bleiben erhalten; der hebräische Hand-Idiom wird im Haupttext natürlich und in der Fußnote wörtlicher wiedergegeben.
