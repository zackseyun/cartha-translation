base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: de
  text: 'Dann wird Jahwe deine Plagen und die Plagen deiner Nachkommen außergewöhnlich[a] machen: große und anhaltende[b] Plagen sowie schwere und anhaltende Krankheiten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erstaunlich«. Das hebräische Verb bezeichnet etwas Außergewöhnliches oder Aufsehenerregendes; hier hebt es die besondere Schwere des Gerichts hervor.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »anhaltend« wiedergegebene hebräische Wort kann »fest«, »dauerhaft« oder »beständig« bedeuten. Dasselbe Wort steht auch bei den Krankheiten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: außergewöhnliche … kommen lassen
  rationale: Das Hifil von פלא bezeichnet hier ein Außergewöhnlich- oder Erstaunlichmachen. Die Umformung mit »kommen lassen« ergibt natürliches Deutsch und bewahrt im Fluchkontext die außergewöhnliche Schwere des Gerichts, ohne einen positiven Beiklang von »wunderbar« hervorzurufen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: Plagen über dich / Plagen
  rationale: מכה kann Schlag, Heimsuchung oder Plage bedeuten. Im Zusammenhang der Bundesflüche gibt »Plagen« die von Gott verhängten Leiden passend wieder.
- source_word: זַרְעֶךָ
  choice: deine Nachkommen
  rationale: זרע ist hier kollektiv gebraucht. »Nachkommen« ist im modernen Deutsch natürlich und eindeutig.
- source_word: גְּדֹלוֹת
  choice: große
  rationale: Die Grundbedeutung »groß« bleibt erhalten und bezeichnet hier Ausmaß beziehungsweise Schwere der Plagen.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: lang anhaltende
  rationale: Das Wort aus der Wurzel אמן bezeichnet hier Festigkeit beziehungsweise Fortdauer. »Lang anhaltend« gibt diesen Sinn bei Plagen und Krankheiten verständlich wieder; die Wiederholung wird in beiden Satzteilen bewahrt.
- source_word: חֳלָיִם
  choice: Krankheiten
  rationale: Der Plural bezeichnet konkrete Krankheiten oder Leiden; »Krankheiten« ist die natürliche moderne Wiedergabe.
- source_word: רָעִים
  choice: schwere
  rationale: רעים bedeutet wörtlich »schlimm/böse«; auf Krankheiten bezogen drückt »schwer« ihre schädliche, leidvolle Beschaffenheit idiomatisch aus.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transliteration bewahrt den persönlichen Namen im Ausgangstext, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פלא im Gerichtskontext
  choice: außergewöhnliche Plagen kommen lassen
  alternative: erstaunliche Plagen; die Plagen außergewöhnlich machen
  rationale: Das Verb beschreibt das Außergewöhnliche oder Erstaunliche der angekündigten Heimsuchung. Die gewählte Formulierung wahrt diese Steigerung, ohne »wunderbar« im heutigen positiven Sinn nahezulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Konstruktion »deine Plagen und die Plagen deiner Nachkommen außergewöhnlich machen« wurde idiomatisch als »über dich und deine Nachkommen außergewöhnliche Plagen kommen lassen« formuliert. Die parallele Wiederholung von »lang anhaltend« bleibt erhalten.
