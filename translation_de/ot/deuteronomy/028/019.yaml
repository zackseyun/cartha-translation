  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: de
  text: Verflucht wirst du sein, wenn du hineingehst[a], und verflucht wirst du sein, wenn du hinausgehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei deinem Hineingehen … bei deinem Hinausgehen“. Diese hebräische Ausdrucksweise kann den gesamten Verlauf des täglichen Lebens umfassen.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: verflucht
  rationale: Das passive Partizip beziehungsweise Adjektiv bezeichnet den Zustand unter einem Fluch. „Verflucht“ ist im Deutschen die natürliche und zugleich feierlich-formelhafte Entsprechung im Zusammenhang der Bundesflüche.
- source_word: אַתָּה
  choice: du
  rationale: Das Pronomen steht in der zweiten Person Maskulinum Singular. „Du“ bildet die singularische Bundesanrede an Israel ausdrücklich ab.
- source_word: בְּבֹאֶךָ
  choice: wenn du hineingehst
  rationale: Die Präposition ב mit dem Infinitiv von בוא und dem Suffix der zweiten Person Singular bedeutet wörtlich „bei deinem Hineingehen“. Die temporale Wiedergabe ist natürliches modernes Deutsch und bewahrt die Richtungskomponente des Verbs.
- source_word: וְ
  choice: und
  rationale: Die einfache Konjunktion verbindet die beiden parallelen Fluchsätze.
- source_word: בְּצֵאתֶךָ
  choice: wenn du hinausgehst
  rationale: Die Präposition ב mit dem Infinitiv von יצא und dem Suffix der zweiten Person Singular bedeutet wörtlich „bei deinem Hinausgehen“. Die Formulierung entspricht idiomatischem Deutsch und erhält den Parallelismus zu „hineingehst“.
theological_decisions:
- issue: Die feierliche Bundesfluchformel natürlich wiedergeben und ihre Hervorhebung bewahren
  choice: Verflucht wirst du sein … und verflucht wirst du sein …
  alternative: Du wirst verflucht sein … und du wirst verflucht sein …
  rationale: Im Hebräischen steht „verflucht“ in beiden Satzteilen betont am Anfang. Die gewählte Wortstellung erhält diese Hervorhebung und den formelhaften Ernst, ohne im modernen Deutschen unverständlich zu wirken.
- issue: Den Umfang des Ausdruckspaars „hineingehen und hinausgehen“ nicht einengen
  choice: Wörtliches Ausdruckspaar im Haupttext mit erläuternder Fußnote
  alternative: Bei allem, was du tust
  rationale: Das hebräische Gegensatzpaar kann umfassend den täglichen Lebensvollzug bezeichnen, bleibt bildhaft aber offen. Die Übersetzung bewahrt das Bild und erklärt seinen möglichen idiomatischen Umfang, statt ihn im Haupttext eindeutig aufzulösen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, formelhaftem Satzrhythmus. Die Wiederholung und die vorangestellte Fluchbezeichnung des hebräischen Textes bleiben erhalten.
