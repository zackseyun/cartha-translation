base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: de
  text: Und du[a] sollst von keinem der Worte abweichen, die ich euch heute gebiete, weder nach rechts noch nach links, um anderen Göttern nachzugehen[b] und ihnen zu dienen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst die Einzahl „du“, im Relativsatz jedoch die Mehrzahl „euch“. Dieser Wechsel ist beibehalten.
    reason: grammatical_shift
  - marker: b
    text: 'Wörtlich: „anderen Göttern hinterhergehen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sie zu verehren“. Das Verb bezeichnet Dienst und kann im Blick auf Gottheiten auch Verehrung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: sollst … abweichen
  rationale: סור bezeichnet ein Abweichen oder Sich-Abwenden. Die deutsche Formulierung gibt die verneinte Weisung natürlich wieder und bewahrt zugleich das räumliche Bild.
- source_word: מִכָּל הַדְּבָרִים
  choice: von keinem der Worte
  rationale: Nach der Verneinung bedeutet מִכָּל hier sinngemäß „von keinem“. „Worte“ bildet דְּבָרִים direkt ab; der folgende Relativsatz macht ihren Gebotscharakter deutlich.
- source_word: מְצַוֶּה
  choice: gebiete
  rationale: Das Partizip hat in der gegenwärtigen Rede des Mose aktuelle, fortdauernde Kraft. „Heute gebiete“ ist im Deutschen natürlich und würdevoll.
- source_word: יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die feste räumliche Wendung bezeichnet ein Abweichen in irgendeine Richtung. „Weder … noch“ passt zur vorausgehenden Verneinung.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: indem du … nachfolgst
  rationale: הלך אחרי bedeutet wörtlich „hinter jemandem hergehen“ und idiomatisch „jemandem nachfolgen“. „Nachfolgen“ erhält sowohl das Bewegungsbild als auch den Gedanken religiöser Gefolgschaft.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Dies ist die direkte Wiedergabe der hebräischen Wendung; „fremde Götter“ wäre stärker deutend.
- source_word: לְעָבְדָם
  choice: um ihnen zu dienen
  rationale: עבד kann gegenüber Gottheiten sowohl „dienen“ als auch „verehren“ bedeuten. „Dienen“ ist die unmittelbarere Entsprechung und lässt die umfassende religiöse Loyalität anklingen.
theological_decisions:
- issue: Bezeichnung anderer Gottheiten in der Bundeswarnung
  choice: andere Götter
  alternative: fremde Götter
  rationale: Die Übersetzung bewahrt die deuteronomische Ausdrucksweise, ohne die vom Vers nicht ausdrücklich behandelte Frage nach dem ontologischen Status dieser Götter aufzulösen.
- issue: Verhältnis von Abweichen und Götterdienst
  choice: indem du anderen Göttern nachfolgst, um ihnen zu dienen
  alternative: sodass du anderen Göttern nachfolgst und ihnen dienst
  rationale: Die Infinitivkonstruktionen verbinden das Abweichen eng mit der Hinwendung zu anderen Göttern. „Indem“ stellt diese erläuternde Verbindung dar, ohne sie ausschließlich als Zweck oder ausschließlich als Folge festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällige Wechsel zwischen Singular und Plural wird als Merkmal des hebräischen Textes bewahrt und durch eine Fußnote erläutert. Die räumliche Metaphorik sowie die Spannung zwischen „dienen“ und „verehren“ bleiben erkennbar.
