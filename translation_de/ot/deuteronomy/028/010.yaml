source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: de
  text: Dann werden alle Völker der Erde sehen, dass der Name Jahwes über dir ausgerufen ist[a], und sie werden sich vor dir fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du nach dem Namen Jahwes genannt bist.“ Hebräisch: Der Name Jahwes ist „über dir gerufen/genannt“. Die Wendung bezeichnet, dass du öffentlich mit Jahwes Namen verbunden bist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Dann werden … sehen
  rationale: Das Qal-Perfekt mit וְ führt innerhalb der Segensfolge eine zukünftige Folge weiter. „Dann“ gibt den resultativen Zusammenhang im Deutschen natürlich wieder.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: עַמֵּי bezeichnet die verschiedenen Völker; הָאָרֶץ ist angesichts der weltweiten Wahrnehmung hier am besten mit „der Erde“ wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was die Völker sehen.
- source_word: שֵׁם יְהוָה
  choice: der Name Jahwes
  rationale: Die hebräische Genitivverbindung bleibt erhalten; das Tetragramm wird als „Jahwe“ wiedergegeben.
- source_word: נִקְרָא עָלֶיךָ
  choice: über dir ausgerufen ist
  rationale: Diese Formulierung bewahrt Passiv und Präposition des hebräischen Ausdrucks und klingt im Deutschen natürlicher als „auf dir genannt ist“. Das Idiom kennzeichnet öffentliche Zuordnung und Zugehörigkeit.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: und sie werden sich vor dir fürchten
  rationale: ירא mit מן bezeichnet hier Furcht vor Israel angesichts der erkennbaren Gunst und Autorität Jahwes. Die deutsche Wendung bewahrt die mögliche Bandbreite von Angst bis ehrfürchtigem Schrecken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Bundesname wird direkt wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Idioms נִקְרָא עָלֶיךָ
  choice: der Name Jahwes ist über dir ausgerufen
  alternative: du bist nach dem Namen Jahwes genannt; du trägst den Namen Jahwes
  rationale: Die gewählte Fassung erhält das hebräische Bild und lässt die damit ausgedrückte öffentliche Identifikation und Zugehörigkeit bestehen, ohne sie im Haupttext vollständig auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Völker“ ist im Deutschen natürlicher als „Volksgruppen“ und wahrt den internationalen Horizont. „Über dir ausgerufen“ erhält die ungewöhnliche, theologisch bedeutsame Bildsprache des Hebräischen; die Fußnote erläutert das Idiom.
