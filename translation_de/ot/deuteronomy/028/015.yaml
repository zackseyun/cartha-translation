source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: de
  text: Doch wenn du nicht auf die Stimme Jahwes, deines Gottes, hörst[a] und nicht darauf achtest, alle seine Gebote und Satzungen auszuführen, die ich dir heute gebiete[b], dann werden all diese Flüche über dich kommen und dich einholen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die Stimme ... hören“. Die hebräische Wendung schließt gehorsames Hören ein; auch möglich: „Jahwe, deinem Gott, nicht gehorchst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu bewahren, um alle seine Gebote und Satzungen zu tun“; auch möglich: „nicht darauf achtest, alle seine Gebote und Satzungen zu befolgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Doch wenn ... dann
  rationale: Die Formulierung leitet als Gegenstück zum vorangehenden Segen eine negative Bedingung mit ihrer Folge ein. „Doch wenn ... dann“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: תִשְׁמַע בְּקוֹל
  choice: auf die Stimme ... hören
  rationale: Bewahrt das hebräische Hörbild und lässt zugleich den im Kontext enthaltenen Sinn gehorsamen Hörens erkennen, ohne ihn auf das abstrakte Verb „gehorchen“ zu reduzieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Natürliche Wiedergabe der Bundesformel mit dem Suffix der zweiten Person Singular.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: darauf achtest, ... auszuführen
  rationale: 'Gibt beide Infinitive wieder: שׁמר bezeichnet das aufmerksame Beachten beziehungsweise Bewahren, עשׂה das tatsächliche Tun oder Ausführen.'
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: alle seine Gebote und Satzungen
  rationale: Bewahrt die rechtlich-bundestheologische Begriffsdifferenz zwischen מִצְוֹת und חֻקּוֹת in verständlichem Deutsch.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Gibt den unmittelbaren Redeakt des Mose knapp und gegenwartsnah wieder.
- source_word: וּבָאוּ עָלֶיךָ
  choice: werden ... über dich kommen
  rationale: Entspricht der hebräischen Wendung für ein Unheil, das jemanden trifft.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: all diese Flüche
  rationale: „Flüche“ ist die direkte und im Bundeszusammenhang passende Wiedergabe von קְלָלוֹת.
- source_word: וְהִשִּׂיגוּךָ
  choice: und dich einholen
  rationale: Bewahrt das anschauliche Bild von Flüchen, die den Betroffenen verfolgen und erreichen.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ wahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Titel.
- issue: Reichweite der Gehorsamsformel תִשְׁמַע בְּקוֹל
  choice: auf die Stimme ... hören
  alternative: '... gehorchen'
  rationale: Die gewählte Formulierung bewahrt sowohl das konkrete Hörmotiv als auch dessen kontextuellen Gehorsamssinn.
- issue: Verhältnis von לִשְׁמֹר und לַעֲשׂוֹת
  choice: darauf achtest, ... auszuführen
  alternative: zu bewahren und zu tun
  rationale: Die beiden Verben bleiben semantisch unterscheidbar, werden aber in idiomatisches modernes Deutsch übertragen. Das nicht ausdrücklich vorhandene Adverb „sorgfältig“ wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die Satzstruktur bewahrt Bedingung und Folge sowie das eindringliche Bild der herankommenden und einholenden Flüche. „Satzungen“ hält den rechtlichen Registerunterschied zu „Geboten“ aufrecht.
