id: DEU.28.44
reference: Deuteronomy 28:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: de
  text: Er wird dir leihen[a], du aber wirst ihm nicht leihen. Er wird das Haupt sein, und du wirst der Schwanz sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Fremde, der sich bei dir aufhält und im vorhergehenden Vers genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: dir leihen / ihm leihen
  rationale: Der Hiphil von לוה bezeichnet hier das Verleihen. Die parallelen Satzteile stellen den Fremden als Kreditgeber und Israel als wirtschaftlich abhängig dar; die gleiche deutsche Wortwahl bewahrt diese Umkehrung.
- source_word: הוּא
  choice: er
  rationale: Das maskuline Singularpronomen verweist auf den in Vers 43 genannten Fremden und bewahrt die pronominale Form des Hebräischen.
- source_word: לְרֹאשׁ
  choice: das Haupt
  rationale: Die wörtliche Metapher bezeichnet Vorrang oder Überlegenheit und greift die Sprache aus Deuteronomium 28,13 in umgekehrter Richtung auf.
- source_word: לְזָנָב
  choice: der Schwanz
  rationale: Die direkte Wiedergabe bewahrt den anschaulichen Gegensatz zum Haupt und bezeichnet Unterordnung beziehungsweise Niedrigkeit.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: wird ... sein / wirst ... sein
  rationale: היה beschreibt hier den künftigen Status als Folge des Bundesfluchs; die Formulierung ist im modernen Deutsch natürlich und deutet keinen zusätzlichen Prozess hinein.
- source_word: וְאַתָּה
  choice: du aber / und du
  rationale: Das betonte Pronomen hebt jeweils den Gegensatz hervor. Im ersten Satz macht „aber“ den Kontrast ausdrücklich; im zweiten wahrt „und“ die hebräische Reihung.
theological_decisions:
- issue: Maskuliner Singularbezug
  choice: „er“ und „du“ im Singular
  alternative: Pluralische oder substantivische Wiedergabe, etwa „die Fremden“ beziehungsweise „der Fremde“ im Haupttext
  rationale: Der hebräische Text verwendet einen grammatisch maskulinen Singular und verweist repräsentativ auf den Fremden aus dem vorhergehenden Vers. Der Singular und die Pronomen werden bewahrt; die Fußnote klärt den Bezug.
- issue: Statusmetapher „Haupt und Schwanz“
  choice: Die konkrete Metapher unverändert bewahren
  alternative: Deutend mit „überlegen“ und „untergeordnet“ übersetzen
  rationale: Die Bildsprache ist verständlich, theologisch nicht einseitig und stellt bewusst die Umkehrung der in Vers 13 genannten Stellung dar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Parallelstruktur. „Haupt“ wurde statt des alltäglicheren „Kopf“ gewählt, weil es die etablierte Rangmetapher und den Bezug zu Deuteronomium 28,13 klarer bewahrt. Der einzige Fußnotenmarker [a] steht unmittelbar nach seinem Bezugswort im Haupttext.
