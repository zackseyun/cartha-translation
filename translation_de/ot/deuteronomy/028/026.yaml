source:
  edition: WLC
  text: וְ/הָיְתָ֤ה נִבְלָֽתְ/ךָ֙ לְ/מַאֲכָ֔ל לְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: de
  text: Dein Leichnam[a] wird allen Vögeln des Himmels und den Tieren der Erde zum Fraß dienen[b], und niemand wird sie verscheuchen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „dein toter Körper“; drastischer: „dein Kadaver“. Das hebräische Wort hat in diesem Gerichtszusammenhang einen entwürdigenden Beiklang.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier die umfassende Paarung „Vögel des Himmels“ und „Tiere der Erde“. Sie unterstreicht, dass der Leichnam völlig schutzlos und der Schande preisgegeben ist.
    reason: cultural_note
  - marker: c
    text: 'Das heißt: Niemand wird die Vögel und Tiere vertreiben, die den Leichnam fressen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird … dienen
  rationale: Die Verbform bezeichnet im Zusammenhang der Fluchandrohung eine künftige Folge. Zusammen mit לְמַאֲכָל gibt „wird … zum Fraß dienen“ die prädikative Wendung natürlich wieder.
- source_word: נִבְלָתְךָ
  choice: dein Leichnam
  rationale: נְבֵלָה bezeichnet einen toten Körper und hat hier durch den Zusammenhang von Gericht, Preisgabe und fehlender Bestattung einen entwürdigenden Klang. „Leichnam“ ist im Deutschen klar auf einen menschlichen Toten bezogen; „zum Fraß dienen“ bewahrt die Härte der Aussage.
- source_word: לְמַאֲכָל
  choice: zum Fraß
  rationale: Das Substantiv bezeichnet Nahrung beziehungsweise etwas, das gegessen wird. „Zum Fraß“ ist in Verbindung mit Aas fressenden Vögeln und Landtieren idiomatisch und erhält den drastischen Ton.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: allen Vögeln des Himmels
  rationale: עוֹף ist kollektiv gebraucht. Das deutsche „allen Vögeln“ gibt die umfassende Aussage natürlich wieder; „des Himmels“ bewahrt das traditionelle räumliche Bild ohne es auf einen religiösen Himmel festzulegen.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: und den Tieren der Erde
  rationale: בְּהֵמָה steht hier kollektiv für Landtiere. „Tiere der Erde“ ist gegenwärtiges, verständliches Deutsch und erhält die Himmel-Erde-Paarung.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand wird sie verscheuchen
  rationale: Das Hiphil-Partizip von חרד bezeichnet jemanden, der Furcht auslöst. Im Kontext ist gemeint, dass niemand die fressenden Tiere abschreckt oder vertreibt; „verscheuchen“ bringt beides knapp zum Ausdruck. Das Pronomen „sie“ macht den im Hebräischen unausgesprochenen Bezug deutlich.
theological_decisions:
- issue: Gericht als völlige Preisgabe des Leichnams
  choice: Die drastische Bildsprache und die Abwesenheit eines Beschützers bleiben ungemildert stehen.
  alternative: Die Aussage durch eine allgemeinere Umschreibung von Tod oder Niederlage abschwächen.
  rationale: Der hebräische Text schildert ausdrücklich die entehrende Aussetzung des toten Körpers als Folge des Bundesfluchs; eine Abschwächung würde die theologische Spannung des Gerichtswortes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst harter Gerichtssprache. „Zum Fraß dienen“ klingt natürlich und bewahrt die Schärfe des Originals; „Leichnam“ vermeidet zugleich eine unnötig zoologische Festlegung durch „Kadaver“.
