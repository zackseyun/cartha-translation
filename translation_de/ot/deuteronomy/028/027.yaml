  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֤ין מִצְרַ֨יִם֙ ו/ב/עפלים וּ/בַ/גָּרָ֖ב וּ/בֶ/חָ֑רֶס אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: de
  text: Jahwe wird dich mit den Geschwüren Ägyptens, mit Geschwülsten[a], mit Schorf und mit Juckreiz schlagen, von denen du nicht geheilt werden kannst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hämorrhoiden«. Das hebräische Wort ist unsicher und kann insbesondere Schwellungen im Analbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: wird dich … schlagen
  rationale: Das Hifil von נכה bezeichnet ein kraftvolles Schlagen beziehungsweise Heimsuchen; die Wendung bewahrt die direkte göttliche Einwirkung und ist im Deutschen klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: mit den Geschwüren Ägyptens
  rationale: שְׁחִין bezeichnet entzündliche Hautgeschwüre. Der Plural ist als Krankheitsbezeichnung im Deutschen natürlich; der Genitiv bewahrt den Bezug zu Ägypten.
- source_word: וּבְעפלים
  choice: mit Geschwülsten
  rationale: Der unsichere Ausdruck bezeichnet Schwellungen oder Geschwülste und kann möglicherweise speziell Hämorrhoiden meinen. Die allgemeinere Wiedergabe vermeidet falsche diagnostische Genauigkeit; die Fußnote nennt die engere Möglichkeit.
- source_word: וּבַגָּרָב
  choice: mit Schorf
  rationale: גָּרָב bezeichnet vermutlich eine schorfige Hautkrankheit. »Schorf« ist anschaulich, ohne eine moderne Diagnose zu behaupten.
- source_word: וּבֶחָרֶס
  choice: mit Krätze
  rationale: חֶרֶס bezeichnet hier eine juckende Hautkrankheit. »Krätze« entspricht einer traditionellen und verständlichen deutschen Wiedergabe, ohne den Ausdruck bloß als Symptom wiederzugeben.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: von denen du nicht geheilt werden kannst
  rationale: Die Formulierung bewahrt den passiven Sinn des Nifal und beschreibt die Unheilbarkeit der genannten Leiden. Der Pluralbezug ist im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname bleibt als Name erkennbar und wird nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Krankheitsbegriffe bleiben konkret, ohne durch moderne medizinische Diagnosen überbestimmt zu werden; die Reihung und der harte Charakter der Fluchankündigung bleiben erhalten.
