  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: de
  text: Und sie[b] werden an dir und an deinen Nachkommen[a] zum Zeichen und zum Wunder sein – für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an deinem Samen“; das hebräische Wort kann kollektiv die Nachkommen oder die Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Sie“ bezieht sich auf die im Zusammenhang beschriebenen Flüche.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: Und sie werden … bleiben
  rationale: Das Qal Perfekt mit וְ führt hier die angekündigten künftigen Folgen fort. „Bleiben“ verbindet sich im Deutschen natürlich mit der Dauerangabe und gibt den fortbestehenden Zustand wieder.
- source_word: בְךָ
  choice: an dir
  rationale: Die Präposition bezeichnet hier, dass die zuvor genannten Flüche dem Angeredeten anhaften beziehungsweise auf ihm liegen. „An dir“ ist im Deutschen in Verbindung mit „Zeichen“ natürlich und wahrt diesen Bezug.
- source_word: לְאוֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet ein Zeichen oder Kennzeichen. „Als Zeichen“ gibt seine Funktion idiomatisch wieder.
- source_word: וּלְמוֹפֵת
  choice: und Wunder
  rationale: מוֹפֵת kann „Wunder“ oder „Wunderzeichen“ bedeuten. „Wunder“ bewahrt die traditionelle Wortpaarung „Zeichen und Wunder“, ohne die ominöse Bedeutung von „Vorzeichen“ ausdrücklich festzulegen.
- source_word: וּבְזַרְעֲךָ
  choice: und an deinen Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich und lässt den kollektiven Umfang offen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine fortdauernde, unabsehbare Dauer. „Für immer“ ist die natürliche deutsche Entsprechung, ohne im Haupttext eine weitergehende metaphysische Bestimmung vorzunehmen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von וְהָיוּ
  choice: Das Pronomen „sie“ bleibt im Haupttext stehen und verweist kontextuell auf die zuvor beschriebenen Flüche beziehungsweise Gerichte.
  alternative: Das Subjekt ausdrücklich als „diese Flüche“ wiedergeben.
  rationale: Der unmittelbare Kontext legt die Flüche als Bezug nahe, doch der hebräische Vers nennt sie nicht erneut. Die pronominale Wiedergabe vermeidet eine unnötige Ausdeutung; die Fußnote erläutert den Kontext.
- issue: Bedeutung von עַד עוֹלָם
  choice: „für immer“
  alternative: „auf unabsehbare Zeit“ oder „für alle Zeiten“
  rationale: Die Standardentsprechung wahrt die starke Dauerformulierung des Hebräischen, ohne zusätzlich zu entscheiden, ob philosophisch absolute Endlosigkeit gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste biblische Wortpaarung „Zeichen und Wunder“ bleibt erhalten. Die Satzstellung stellt die parallelen Bezüge „an dir und an deinen Nachkommen“ heraus; die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
