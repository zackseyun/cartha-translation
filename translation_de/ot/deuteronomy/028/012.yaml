source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: de
  text: Jahwe wird dir seine gute Schatzkammer – den Himmel – öffnen, um deinem Land Regen zur rechten Zeit zu geben und alles Werk deiner Hand zu segnen. Du wirst vielen Völkern leihen, aber du wirst nicht borgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht leihen“. Das hebräische Verb bedeutet in dieser Form „borgen“; es steht im Gegensatz zu „leihen“ im vorigen Satzteil.'
    reason: clarity
lexical_decisions:
- source_word: יִפְתַּח
  choice: wird … öffnen
  rationale: Das Qal-Imperfekt hat im Zusammenhang der Segensverheißung Zukunftsbedeutung; die konkrete Metapher des Öffnens bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in seiner im Deutschen geläufigen wissenschaftlichen Form wieder.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: seinen guten Vorratsspeicher
  rationale: אוֹצָר kann einen Vorratsspeicher oder eine Schatzkammer bezeichnen. Wegen des folgenden Regens und des landwirtschaftlichen Zusammenhangs passt „Vorratsspeicher“ besonders gut; „gut“ bewahrt das Adjektiv des Ausgangstextes.
- source_word: הַשָּׁמַיִם
  choice: den Himmel
  rationale: Die Apposition bestimmt den Vorratsspeicher als Himmel. Der deutsche Singular ist hier die natürliche Bezeichnung für den sichtbaren Himmel, aus dem Regen kommt.
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: um deinem Land Regen zu seiner Zeit zu geben
  rationale: Bewahrt die Zweckkonstruktion und bezieht das Suffix in בְּעִתּוֹ am natürlichsten auf den Regen; zugleich ist die deutsche Wortfolge idiomatisch.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: alles Werk deiner Hand
  rationale: Erhält das hebräische Bild und den Singular „Hand“ in würdigem, verständlichem Deutsch.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Du wirst vielen Völkern leihen
  rationale: Der Hifil von לוה bedeutet hier „leihen/ausleihen“; גּוֹיִם wird im nationalen Bundeskontext mit „Völker“ wiedergegeben.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: selbst aber nichts leihen müssen
  rationale: Das Qal von לוה bedeutet hier „borgen, ein Darlehen aufnehmen“. Die Formulierung macht im Deutschen den Gegensatz zur Stellung als Kreditgeber klar, ohne finanzielle Notwendigkeit als ausdrückliche Zusatzbehauptung einzuführen; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im hebräischen Text. „Jahwe“ bewahrt seinen Charakter als Bundesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Verheißung wirtschaftlicher Vorrangstellung
  choice: „Du wirst vielen Völkern leihen, selbst aber nichts leihen müssen“
  alternative: „Du wirst vielen Völkern leihen, aber selbst nicht borgen“
  rationale: Die Aussage bleibt als konkrete Bundessegen-Verheißung an das angesprochene Israel stehen und wird weder vergeistigt noch zu einer allgemeinen Wohlstandsverheißung ausgeweitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Bildsprache. „Vorratsspeicher“ verdeutlicht den Regen- und Erntezusammenhang; „Werk deiner Hand“ wahrt bewusst den biblischen Idiomcharakter. Alle Fußnotenmarker stehen im Haupttext.
