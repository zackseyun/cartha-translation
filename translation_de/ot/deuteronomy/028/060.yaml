base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: de
  text: Und er wird alle Krankheiten Ägyptens, vor denen du dich gefürchtet hast, wieder über dich bringen, und sie werden an dir haften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: wird … wieder … bringen
  rationale: 'Der Hifil von שוב hat hier kausative Bedeutung: Er lässt die Krankheiten zurückkehren bzw. bringt sie erneut über Israel.'
- source_word: בְּךָ
  choice: über dich
  rationale: In Verbindung mit dem Herbeibringen von Krankheiten gibt „über dich bringen“ die auferlegte Heimsuchung im Deutschen idiomatisch wieder.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: alle Krankheiten Ägyptens
  rationale: מַדְוֶה bezeichnet Krankheit oder Gebrechen. „Krankheiten“ ist direkt, verständlich und vermeidet eine unnötige Präzisierung.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: vor denen du dich gefürchtet hast
  rationale: יגר bezeichnet Furcht oder Grauen; die deutsche Wendung bewahrt den Bezug des pluralischen Suffixes auf die Krankheiten und klingt natürlich.
- source_word: וְדָבְקוּ בָּךְ
  choice: und sie werden an dir haften
  rationale: דבק beschreibt festes Anhaften oder Sich-Anschließen. „An dir haften“ bewahrt das eindringliche Bild ihrer dauerhaften Gegenwart.
