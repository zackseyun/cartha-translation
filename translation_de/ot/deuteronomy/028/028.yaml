source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְהוָ֔ה בְּ/שִׁגָּע֖וֹן וּ/בְ/עִוָּר֑וֹן וּ/בְ/תִמְה֖וֹן לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: de
  text: Jahwe wird dich mit Wahnsinn, Blindheit und Verwirrung des Herzens[a] schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ratlosigkeit des Herzens“ oder „Bestürzung des Herzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: wird dich … schlagen
  rationale: Das Hifil von נכה bezeichnet hier ein Schlagen beziehungsweise das Verhängen eines schweren Leidens. „Wird dich … schlagen“ ist im Deutschen klar und bewahrt die Wucht der Bundesfluchsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בְּשִׁגָּעוֹן
  choice: mit Wahnsinn
  rationale: שִׁגָּעוֹן bezeichnet Wahnsinn oder geistige Zerrüttung; „Wahnsinn“ ist direkt, verständlich und dem Fluchkontext angemessen.
- source_word: וּבְעִוָּרוֹן
  choice: Blindheit
  rationale: עִוָּרוֹן bedeutet wörtlich „Blindheit“. Eine Deutung als geistige Blindheit wird nicht in den Haupttext eingetragen, da der hebräische Ausdruck selbst diese Präzisierung nicht enthält.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: und Verwirrung des Herzens
  rationale: תִמְהוֹן kann Verwirrung, Bestürzung oder Ratlosigkeit bezeichnen. Die Formulierung mit „Herz“ bewahrt das hebräische Menschenbild, in dem לֵבָב auch Denken und innere Ausrichtung umfasst.
- source_word: לֵבָב
  choice: Herz
  rationale: „Herz“ erhält die Bildsprache des Hebräischen; eine Festlegung auf „Verstand“ oder „Inneres“ wäre stärker deutend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Text nennt unmittelbar das Tetragramm. „Jahwe“ gibt den offenbarten persönlichen Namen wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- issue: Reichweite von לֵבָב
  choice: Herz
  alternative: Verstand
  rationale: לֵבָב kann im Hebräischen Denken, Willen und inneres Empfinden umfassen. „Herz“ wahrt diese Spannung und vermeidet eine einseitig intellektuelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Dreierfolge des Hebräischen bleibt erhalten; die körperlich-geistige Spannung von „Blindheit“ und „Verwirrung des Herzens“ wird nicht erklärend aufgelöst.
