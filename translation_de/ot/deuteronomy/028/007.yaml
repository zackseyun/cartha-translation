  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: de
  text: Jahwe wird deine Feinde, die sich gegen dich erheben, dir als Besiegte ausliefern.[a] Auf einem einzigen Weg werden sie gegen dich ausziehen, doch auf sieben Wegen werden sie vor dir fliehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „deine Feinde … geschlagen vor dir geben“; gemeint ist, dass Jahwe sie dir als Besiegte überlässt.'
    reason: Die hebräische Verbindung von נתן („geben, übergeben“) und נִגָּפִים („geschlagen, besiegt“) wird idiomatisch wiedergegeben.
  - marker: b
    text: Das Bild stellt das Vorgehen auf einem Weg der zerstreuten Flucht auf sieben Wegen gegenüber.
    reason: Die Fußnote erläutert die konkrete hebräische Bildsprache, ohne die Zahl sieben im Haupttext interpretierend aufzulösen.
lexical_decisions:
- source_word: יִתֵּן
  choice: wird … dahingeben
  rationale: נתן bedeutet grundsätzlich „geben“, kann im militärischen Zusammenhang aber „preisgeben/übergeben“ bezeichnen. „Dahingeben“ verbindet sich im Deutschen natürlich mit dem prädikativen „geschlagen“ und bewahrt den militärischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte und natürliche Wiedergabe des Plurals mit Suffix der 2. Person Singular.
- source_word: הַקָּמִים עָלֶיךָ
  choice: die sich gegen dich erheben
  rationale: קום mit על bezeichnet hier feindseliges Auftreten gegen jemanden; die Formulierung erhält das hebräische Bild, ohne es auf eine bestimmte Angriffsart zu verengen.
- source_word: נִגָּפִים
  choice: geschlagen
  rationale: Das Partizip bezeichnet hier den Zustand der Niederlage. „Geschlagen“ ist im Deutschen militärisch klar und lässt offen, ob Niederlage, Zerschlagung oder Flucht im Vordergrund steht.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Bewahrt die wiederholte hebräische Wendung und ist im Deutschen sowohl räumlich als auch im Sinn einer Niederlage gegenüber dem Angesprochenen verständlich.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: auf einem einzigen Weg
  rationale: דרך wird konkret als „Weg“ wiedergegeben; „einzigen“ verdeutlicht den Gegensatz zu den sieben Wegen, ohne die Bildsprache in „Richtung“ aufzulösen.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: werden sie gegen dich ausziehen
  rationale: יצא אל hat im militärischen Zusammenhang den Sinn, gegen jemanden auszuziehen. „Ausziehen“ bewahrt die Bewegung zum Kampf besser als das allgemeinere „kommen“.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: doch auf sieben Wegen
  rationale: Die wörtliche Bildsprache und der Kontrast von einem zu sieben Wegen bleiben erhalten; „doch“ bringt den antithetischen Zusammenhang im Deutschen natürlich zum Ausdruck.
- source_word: יָנוּסוּ
  choice: werden sie … fliehen
  rationale: נוס ist das übliche Verb für „fliehen“ und bezeichnet mehr als einen geordneten Rückzug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als persönlichen Gottesnamen. Die Transliteration „Jahwe“ erhält diese Eigenschaft, statt den Namen durch einen Titel zu ersetzen.
- issue: Bedeutung der sieben Fluchtwege
  choice: Bildhafte Aussage von zerstreuter Flucht, ohne die Zahl ausdrücklich zu deuten
  alternative: „in alle Richtungen“
  rationale: Der Text stellt einen Weg beim geschlossenen Angriff sieben Wegen bei der Flucht gegenüber. Eine Deutung der Sieben als Vollständigkeit ist möglich, wird aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem Hebräischen durchgehend Singular. Der Satzbau wahrt Parallelismus und Wiederholung, verwendet jedoch „doch“ für einen natürlichen deutschen Gegensatz. „Ausziehen“ trägt bewusst einen leicht gehobenen, im biblischen Militärkontext verständlichen Ton.
