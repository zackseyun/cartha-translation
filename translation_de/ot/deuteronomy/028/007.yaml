  to: Jahwe wird deine Feinde, die sich gegen dich erheben, dir als Besiegte ausliefern.[a] Auf einem einzigen Weg werden sie gegen dich ausziehen, doch auf sieben Wegen werden sie vor dir fliehen.[b]
  rationale: Die Revision ersetzt ausschließlich die unnatürliche und potenziell missverständliche Wendung „geschlagen vor dir dahingeben“ durch eine idiomatische deutsche Entsprechung. Die übrige Satzstruktur, die Wiederholung von „vor dir“ im Fluchtteil und die bildhafte Gegenüberstellung von einem und sieben Wegen bleiben erhalten. Fußnote b wird geringfügig zurückhaltender formuliert.
