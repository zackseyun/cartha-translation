lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gesegnet werden … sein
  rationale: Das passive Partizip von ברך steht prädikativ in einer Segensformel. Im Zusammenhang der angekündigten Bundessegnungen gibt das deutsche Futur den feststellend-zusagenden Charakter wieder, ohne daraus einen Wunsch zu machen.
- source_word: טַנְאֲךָ
  choice: dein Korb
  rationale: טֶנֶא bezeichnet einen Korb, besonders einen Tragekorb für Erzeugnisse. „Korb“ ist natürlich und bleibt bei der im Hebräischen ausdrücklich gegebenen Bedeutung.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: und deine Knetschüssel
  rationale: מִשְׁאֶרֶת bezeichnet ein Gefäß, in dem Teig zubereitet beziehungsweise geknetet wird. „Knetschüssel“ ist im modernen Deutsch verständlich und bildet die Funktion des Gefäßes knapp ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Segensformel und der Singular der beiden Versorgungsgefäße bleiben erhalten.
