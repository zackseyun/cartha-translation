  yaml_path: translation/ot/deuteronomy/028/005.yaml
  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: de
  text: Gesegnet werden dein Korb und deine Knetschüssel[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dein Knettrog“. Das hebräische Wort bezeichnet ein Gefäß zur Teigzubereitung.
