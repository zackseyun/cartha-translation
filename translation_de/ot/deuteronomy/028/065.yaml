base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: de
  text: Unter diesen Völkern wirst du nicht zur Ruhe kommen[a], und für deine Fußsohle wird es keinen Ruheplatz geben. Dort wird Jahwe dir ein zitterndes Herz, versagende Augen[b] und Seelenqual[c] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du keine Ruhe finden“ beziehungsweise „wirst du nicht ungestört sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „schwindende“ oder „sich verzehrende Augen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Seelenschmerz“ oder „Seelenkummer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: wirst du nicht zur Ruhe kommen
  rationale: Das Hifil von רגע bezeichnet hier, dass jemand zur Ruhe gelangt oder sich ungestört niederlassen kann. Die Formulierung ist im Deutschen natürlich und bewahrt den Bezug auf die Unruhe im Exil.
- source_word: מָנוֹחַ
  choice: Ruheplatz
  rationale: Das Substantiv kann einen Zustand oder einen Ort der Ruhe bezeichnen. Zusammen mit der Fußsohle liegt die konkrete Bedeutung eines Platzes zum Ausruhen nahe.
- source_word: לְכַף רַגְלֶךָ
  choice: für deine Fußsohle
  rationale: כַּף bezeichnet in Verbindung mit רֶגֶל ausdrücklich die Unterseite des Fußes. Die körperhafte Bildsprache des Hebräischen bleibt so erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵב רַגָּז
  choice: ein zitterndes Herz
  rationale: רַגָּז umfasst Zittern, innere Unruhe und Erregung. „Zitterndes Herz“ erhält das anschauliche körperlich-seelische Bild.
- source_word: כִלְיוֹן עֵינַיִם
  choice: versagende Augen
  rationale: כִּלְיוֹן bezeichnet Schwinden, Aufzehrung oder Versagen. „Versagende Augen“ ist verständlich, ohne die im Ausdruck liegende körperliche und seelische Erschöpfung einseitig festzulegen.
- source_word: דַאֲבוֹן נָפֶשׁ
  choice: Seelenqual
  rationale: דַּאֲבוֹן kann Schmerz, Kummer oder Qual ausdrücken; נֶפֶשׁ bezeichnet hier das innere Leben beziehungsweise die Person in ihrem Empfinden. „Seelenqual“ gibt die Intensität knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der von Jahwe gegebenen inneren Not
  choice: Jahwe wird ein zitterndes Herz, versagende Augen und Seelenqual geben
  alternative: Jahwe wird Angst, Blindheit und Verzweiflung verursachen
  rationale: Die Übersetzung lässt die konkrete Bildsprache und die theologische Spannung der Aussage stehen, statt die drei hebräischen Wendungen psychologisch oder medizinisch zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Gedankenverlauf, vermeidet jedoch unnötige Fremdheit. Die Parallelreihe der drei Nöte bleibt knapp und eindringlich; echte lexikalische Spielräume werden in den Fußnoten offengelegt.
