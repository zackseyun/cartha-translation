language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: de
  text: Und Jahwe wird dich unter alle Völker zerstreuen, von einem Ende der Erde bis zum anderen Ende der Erde[a]. Dort wirst du anderen Göttern dienen, die weder du noch deine Väter gekannt haben – Holz und Stein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von einem Ende des Landes bis zum anderen Ende des Landes“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten; wegen der Zerstreuung unter alle Völker wird hier „Erde“ bevorzugt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Holz und Stein“; gemeint sind Götterbilder aus diesen Materialien.'
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: wird dich … zerstreuen
  rationale: Der Hifil von פוץ bezeichnet das Verursachen einer Zerstreuung; „zerstreuen“ ist im Zusammenhang des Bundesfluchs direkt und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל הָעַמִּים
  choice: unter alle Völker
  rationale: עַמִּים bezeichnet Völker; „unter alle Völker“ gibt zudem die Richtung der Zerstreuung im Deutschen natürlich wieder.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: von einem Ende der Erde bis zum anderen Ende der Erde
  rationale: Die Wiedergabe bewahrt die hebräische Wiederholung und versteht אֶרֶץ wegen der Zerstreuung unter alle Völker hier im umfassenden Sinn als „Erde“.
- source_word: וְעָבַדְתָּ
  choice: wirst du … dienen
  rationale: עבד bezeichnet hier den Dienst an Gottheiten; „dienen“ bewahrt die konkrete Wortwahl, ohne sie vorschnell auf „anbeten“ zu verengen.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die direkte und im Bundeszusammenhang geläufige Wiedergabe.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: die weder du noch deine Väter gekannt haben
  rationale: „Gekannt haben“ bewahrt ידע; „deine Väter“ gibt אֲבֹתֶיךָ konkret wieder und kann hier die Vorfahren einschließen.
- source_word: עֵץ וָאָבֶן
  choice: Holz und Stein
  rationale: Die knappe Apposition benennt das Material der fremden Götterbilder; der Gedankenstrich macht diese erläuternde Zuordnung sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הָאָרֶץ in der Zerstreuungsformel
  choice: Erde
  alternative: Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die Zerstreuung unter alle Völker spricht hier für „Erde“; die mögliche engere Lesart bleibt in der Fußnote erhalten.
- issue: Status von „Holz und Stein“
  choice: appositive Kennzeichnung der anderen Götter beziehungsweise ihrer Bilder
  alternative: aus Holz und Stein
  rationale: Der hebräische Text nennt nur „Holz und Stein“. Die Hauptübersetzung bewahrt diese knappe Form, während die Fußnote den kulturellen Bezug erklärt, ohne zusätzliche Wörter in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Satzführung. Die hebräische Wiederholung „Ende der Erde … Ende der Erde“ und die markante Schlusswendung „Holz und Stein“ bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Formulierung.
