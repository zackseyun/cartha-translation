  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: de
  text: Und du wirst wahnsinnig werden bei dem Anblick, den deine Augen sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und du wirst wahnsinnig sein von dem Anblick deiner Augen, den du siehst.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Und du wirst … werden
  rationale: Das Qal Perfekt mit וְ hat in der fortlaufenden Fluchankündigung futurisch-resultative Bedeutung. Die Formulierung gibt sowohl den künftigen Eintritt als auch den entstehenden Zustand natürlich wieder.
- source_word: מְשֻׁגָּע
  choice: wahnsinnig
  rationale: Das passive Partizip von שׁגע bezeichnet den Zustand des Verrückt- oder Wahnsinnigseins. Zusammen mit „werden“ kommt die resultative Bedeutung zum Ausdruck, ohne dem hebräischen Text ein zusätzliches handelndes Subjekt hinzuzufügen.
- source_word: מִמַּרְאֵה
  choice: bei dem Anblick
  rationale: מִן bezeichnet hier den Anlass beziehungsweise die Ursache des Wahnsinns. „Bei dem Anblick“ ist im Deutschen idiomatisch und bewahrt zugleich das konkrete Motiv des Sehens.
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Die wörtliche Wiedergabe erhält die konkrete, eindringliche Sinnesbeschreibung des Hebräischen.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: den deine Augen sehen
  rationale: Der Relativsatz wird auf „Anblick“ bezogen; die Wiederholung des Sehens bleibt wie im Hebräischen erhalten, einschließlich ihrer bewusst eindringlichen Wirkung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas eindringliche Wiederholung von „Anblick“, „Augen“ und „sehen“ wurde bewusst bewahrt; „wahnsinnig werden“ ist klar und allgemein verständlich.
