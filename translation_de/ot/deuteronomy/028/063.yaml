source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: de
  text: 'Und es wird geschehen: Wie Jahwe Freude daran hatte, euch Gutes zu tun und euch zahlreich zu machen, so wird Jahwe Freude daran haben, euch zugrunde zu richten und euch auszulöschen. Und ihr werdet von dem Land weggerissen[a], in das du hineinziehst, um es in Besitz zu nehmen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr werdet aus dem Land entwurzelt“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „du“ in „in das du hineinziehst“ in der Einzahl; Israel wird als ein einziges Volk angesprochen.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Gibt die zukunftsbezogene Folgeformel formal und zugleich in verständlichem modernem Deutsch wieder.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: sich freute / sich freuen wird
  rationale: Derselbe deutsche Wortstamm wahrt die beabsichtigte Parallelität zwischen dem Freuen über Segen und dem Freuen über Gericht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen entsprechend der Projektkonvention wieder.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: euch Gutes zu tun
  rationale: Bewahrt die breite Bedeutung des Hifil von יטב, ohne sie auf materiellen Wohlstand zu verengen.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: euch zahlreich zu machen
  rationale: Gibt die Bundes- und Segenssprache natürlich wieder; „vermehren“ wäre möglich, klingt bei Personen im heutigen Deutsch jedoch weniger idiomatisch.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: euch zugrunde zu richten
  rationale: Bringt die kausative Bedeutung von אבד kräftig zum Ausdruck und bleibt vom folgenden Verb unterscheidbar.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: euch auszulöschen
  rationale: Bewahrt die gesteigerte Härte des zweiten Vernichtungsverbs in verständlichem, würdigem Deutsch.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: ihr werdet von dem Land weggerissen
  rationale: Gibt die gewaltsame Entfernung und die Kraft von מֵעַל wieder, ohne die mögliche Pflanzenmetapher zwingend festzulegen.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: in das du hineinziehst, um es in Besitz zu nehmen
  rationale: Das singularische „du“ bleibt im Deutschen sichtbar und spricht Israel als ein einziges Volk an; „hineinziehst“ nimmt die Richtungsangabe שָׁמָּה idiomatisch auf.
theological_decisions:
- issue: Göttliches Freuen über das Gericht
  choice: Die ausdrückliche Aussage, dass Jahwe sich über Israel freuen wird, um es zugrunde zu richten und auszulöschen, bleibt erhalten.
  alternative: Die Aussage durch „es wird Jahwe gefallen“ abzuschwächen oder das Freuen auszulassen.
  rationale: Der hebräische Text spiegelt bewusst das frühere Freuen über den Segen im künftigen Freuen über das Gericht. Diese theologische Spannung darf nicht geglättet werden.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt die scharfe Vergleichsparallele des Hebräischen. Der Wechsel vom pluralischen „euch/ihr“ zum singularischen „du“ wurde bewusst beibehalten; unnötig altertümliche Wendungen wurden vermieden.
