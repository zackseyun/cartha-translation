base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: de
  text: Du wirst zum Gegenstand des Entsetzens[a], zum Sprichwort[b] und zum Spottwort werden unter allen Völkern, wohin Yahweh dich treiben wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Gegenstand des Staunens“. Das hebräische Wort kann etwas bezeichnen, dessen erschreckender Zustand Entsetzen oder fassungsloses Staunen hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder für „Spottwort“: „Hohnwort“. Im Hebräischen stehen zwei verwandte, aber unterschiedliche Begriffe für öffentliche Verachtung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „führen wird“. Das hebräische Verb kann „führen“ oder „treiben“ bedeuten; im Zusammenhang der erzwungenen Verbannung liegt hier „treiben“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִתָ
  choice: Du wirst … werden
  rationale: Die Verbform hat in der fortlaufenden Fluchankündigung zukünftige beziehungsweise resultative Bedeutung. „Wirst … werden“ gibt den eintretenden Zustand natürlich wieder.
- source_word: לְשַׁמָּה
  choice: zum Gegenstand des Entsetzens
  rationale: שַׁמָּה bezeichnet hier etwas so Verwüstetes oder Erschreckendes, dass es Entsetzen oder Staunen hervorruft. Die Formulierung macht deutlich, dass Israel selbst zum Gegenstand dieser Reaktion wird.
- source_word: לְמָשָׁל
  choice: zum Sprichwort
  rationale: מָשָׁל bedeutet gewöhnlich „Sprichwort“, kann in diesem negativen Zusammenhang aber auch den Sinn eines abschreckenden „Schlagworts“ oder „Sinnbilds“ annehmen.
- source_word: וְלִשְׁנִינָה
  choice: zum Spottwort
  rationale: שְׁנִינָה bezeichnet eine schneidende, höhnische Redensart. „Spottwort“ bewahrt den Bezug auf öffentlich geäußerten Hohn und unterscheidet den Ausdruck von מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  choice: unter all den Völkern
  rationale: עַמִּים ist der Plural von „Volk“. Die deutsche Wendung gibt sowohl die Verteilung als auch das Leben inmitten dieser Völker idiomatisch wieder.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: zu denen … dich treiben wird
  rationale: נהג kann „führen“ oder „treiben“ bedeuten. Im Kontext erzwungener Verschleppung innerhalb der Fluchankündigung bringt „treiben“ den Zwang angemessen zum Ausdruck.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als persönlicher Name „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׁמָּה
  choice: zu denen
  rationale: Das Richtungsadverb „dorthin“ ist im Deutschen natürlich in die relative Zielangabe „zu denen“ aufgenommen; eine zusätzliche Wiedergabe mit „dorthin“ wäre redundant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Yahweh“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Zwangscharakter der Zerstreuung
  choice: treiben
  alternative: führen
  rationale: Das Verb lässt beide Bedeutungen zu. Der Fluch- und Verbannungskontext spricht für die mit Zwang verbundene Bedeutung „treiben“, ohne die lexikalische Alternative auszuschließen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die dreigliedrige hebräische Reihung bleibt erhalten; „Sprichwort“ und „Spottwort“ werden nicht zu einem einzigen Begriff eingeebnet. Der Satz beginnt ohne zusätzliches „Und“, da der Vers im Deutschen auch eigenständig natürlich lesbar sein soll.
