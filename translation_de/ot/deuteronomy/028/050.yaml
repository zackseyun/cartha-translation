  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
translation:
  language: de
  text: ein Volk mit grimmigem Gesicht[a], das auf Alte keine Rücksicht nimmt[b] und mit Jungen kein Erbarmen hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ein Volk, grimmig von Gesicht“. Möglich ist auch: „ein Volk mit hartem Gesicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Idiom lautet wörtlich: „das das Gesicht des Alten nicht erhebt“; gemeint ist, dass es alten Menschen keine Achtung oder Rücksicht erweist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und die Jungen nicht begünstigt“ beziehungsweise „den Jungen keine Gnade erweist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: Volk
  rationale: גּוֹי bezeichnet hier eine fremde Volks- bzw. Völkerschaft als angreifende Macht. „Volk“ ist im Deutschen natürlicher und weniger staatsrechtlich geprägt als „Nation“.
- source_word: עַז פָּנִים
  choice: mit grimmigem Gesicht
  rationale: Die Wendung bedeutet wörtlich etwa „stark/grimmig von Gesicht“. Die Übersetzung bewahrt das Bild des Gesichts und vermittelt zugleich die bedrohliche Härte im Zusammenhang.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen leitet die nähere Beschreibung des Volkes knapp und idiomatisch ein.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: auf Alte keine Rücksicht nimmt
  rationale: Das Idiom נָשָׂא פָנִים, wörtlich „das Gesicht erheben“, bezeichnet hier das Gewähren von Achtung oder Rücksicht. Im Gegensatz zu den Jungen ist זָקֵן generisch als Altersgruppe wiedergegeben.
- source_word: זָקֵן
  choice: Alte
  rationale: Der Singular bezeichnet repräsentativ alte Menschen. Der substantivierte Plural ist im modernen Deutschen natürlich und vermeidet eine unnötige Festlegung auf männliche Personen.
- source_word: וְנַעַר
  choice: und mit Jungen
  rationale: נַעַר kann einen Knaben, Jugendlichen oder jungen Mann bezeichnen. Im Gegensatz zu זָקֵן ist „Junge“ als allgemeine Altersgruppe angemessen.
- source_word: לֹא יָחֹן
  choice: kein Erbarmen hat
  rationale: חנן bedeutet „Gnade/Gunst erweisen, sich erbarmen“. „Kein Erbarmen haben“ gibt in diesem Gewaltkontext die fehlende Schonung natürlich wieder, ohne die Bedeutung auf bloße Höflichkeit abzuschwächen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Gesichtsmetaphorik des Hebräischen bleibt erhalten; die beiden Aussagen über Alte und Junge sind klar und parallel formuliert.
