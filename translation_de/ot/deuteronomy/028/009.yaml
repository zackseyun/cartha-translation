  variant: modern standard German
source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: de
  text: Jahwe wird dich als sein heiliges Volk bestätigen, wie er dir geschworen hat, wenn[a] du die Gebote Jahwes, deines Gottes, hältst und auf seinen Wegen gehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil du die Gebote Jahwes, deines Gottes, hältst“. Das hebräische Bindewort kann auch eine Begründung einleiten; der Zusammenhang spricht hier jedoch eher für „wenn“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: wird dich … bestätigen
  rationale: Das Hifil von קום bezeichnet hier nicht körperliches Aufrichten, sondern die feste Einsetzung beziehungsweise Bestätigung Israels in seinem Bundesstatus. „Bestätigen“ gibt diesen Sinn in natürlichem, heutigem Deutsch wieder.
- source_word: לּוֹ לְעַם קָדוֹשׁ
  choice: als sein heiliges Volk
  rationale: Die Formulierung bewahrt sowohl den resultierenden Status als auch die Zugehörigkeit zu Jahwe. „Sein“ gibt die relationale beziehungsweise possessive Kraft von לּוֹ knapp und idiomatisch wieder.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: wie er dir geschworen hat
  rationale: Die Vergleichsklausel verweist auf Jahwes vorausgehenden Eid und bleibt in dieser Form nah am Hebräischen sowie natürlich im Deutschen.
- source_word: כִּי
  choice: wenn
  rationale: Im Zusammenhang der Segens- und Fluchankündigungen führt כִּי am ehesten die Bedingung ein. Die mögliche kausale Lesart wird in einer Fußnote erhalten.
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: du die Gebote … hältst
  rationale: שׁמר bezeichnet in Verbindung mit Geboten deren treue Beachtung. „Gebote halten“ ist im Deutschen klar, geläufig und wahrt den bundesrechtlichen Ton.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: und auf seinen Wegen gehst
  rationale: Die Übersetzung erhält das hebräische Bild für eine Lebensführung nach Gottes Willen; „auf seinen Wegen gehen“ ist verständlich und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des hebräischen Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Der Genitiv fügt sich natürlich in die feste Bundesformel „Jahwe, dein Gott“ ein und bewahrt den relationalen Sinn.
theological_decisions:
- issue: Bedingte oder begründende Funktion von כִּי
  choice: '„wenn du … hältst“: Die Bestätigung Israels als heiliges Volk steht hier in Verbindung mit seinem Bundesgehorsam.'
  alternative: '„weil du … hältst“: Die Klausel könnte kausal als Begründung verstanden werden.'
  rationale: Syntax und Kontext des Segens- und Fluchabschnitts sprechen eher für eine echte Bedingung. Die alternative kausale Möglichkeit wird jedoch nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname wird als „Jahwe“ wiedergegeben. Die traditionelle Wegmetapher bleibt erhalten; unnötig altertümliche Satzformen werden vermieden.
