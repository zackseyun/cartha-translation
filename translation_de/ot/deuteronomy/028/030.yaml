  source_fidelity: 'Die drei Fluchfolgen und die Satzbeziehungen sind zutreffend wiedergegeben. Bei ישגלנה ist jedoch der im WLC markierte Ketiv/Qere-Befund zu berücksichtigen: Ketiv ישגלנה ist ein derber sexueller Ausdruck, Qere ישכבנה bedeutet „bei ihr liegen“. Keine der beiden Lesarten bezeichnet Gewalt ausdrücklich. Für תחללנו ist „in Gebrauch nehmen“ eine idiomatischere deutsche Wiedergabe des technischen Beginns der gewöhnlichen Nutzung der Erträge.'
