  terminology: „sich mit einer Frau verloben“, „Haus“, „wohnen“ und „Weinberg“ sind angemessen. Die Fußnote soll den Ketiv/Qere-Befund statt einer einseitigen Behauptung über nur ein Verb dokumentieren. Der technische Sinn von חלל ist mit einer knappen Erläuterung zu sichern.
