base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: de
  text: Du wirst dich mit einer Frau verloben, doch ein anderer Mann wird bei ihr liegen[a]. Du wirst ein Haus bauen, aber nicht darin wohnen. Du wirst einen Weinberg pflanzen, aber ihn nicht in Gebrauch nehmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht geschrieben ein derber Ausdruck für Geschlechtsverkehr („sie beschlafen“); gelesen wird jedoch „bei ihr liegen“. Keine der beiden Lesarten bezeichnet Gewalt ausdrücklich.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich etwa: „du wirst ihn nicht entweihen/profan machen“. Gemeint ist der technische Vorgang, die Erträge eines Weinbergs nach der vorgeschriebenen Zeit für den gewöhnlichen Verzehr in Gebrauch zu nehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: dich mit einer Frau verloben
  rationale: ארשׂ bezeichnet das Eingehen einer rechtlich verbindlichen Verlobung. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den ehelichen Zusammenhang, ohne bereits »heiraten« zu sagen.
- source_word: אִישׁ אַחֵר
  choice: ein anderer Mann
  rationale: Direkte, natürliche Wiedergabe des Kontrasts zum Angesprochenen.
- source_word: ישגלנה
  choice: wird mit ihr Geschlechtsverkehr haben
  rationale: Das Verb שׁגל ist ein derber, ausdrücklich sexueller Ausdruck. Die gewählte Formulierung benennt den Vorgang klar, ohne Gewalt grammatisch festzuschreiben, die diese Verbform für sich allein nicht ausdrücklich markiert.
- source_word: תֵשֵׁב בּוֹ
  choice: darin wohnen
  rationale: ישׁב bedeutet in Verbindung mit einem Haus »wohnen«; dies ist die natürliche moderne deutsche Entsprechung.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: Übliche und genaue deutsche Wiedergabe von כרם.
- source_word: תְחַלְּלֶנּוּ
  choice: seine Früchte nicht für den gewöhnlichen Gebrauch freigeben
  rationale: Das Piel von חלל bezeichnet beim Weinberg offenbar den Beginn der gewöhnlichen Nutzung seiner Früchte nach der zuvor geltenden Einschränkung; die Formulierung erhält diesen kultisch-landwirtschaftlichen Sinn.
theological_decisions:
- issue: Ob ישגלנה ausdrücklich eine gewaltsame Vergewaltigung bezeichnet
  choice: Die sexuelle Handlung wird deutlich benannt, Gewalt aber nicht in den Haupttext eingetragen.
  alternative: »wird sie vergewaltigen« oder »wird sie schänden«
  rationale: Das Verb ist grob und erniedrigend, kennzeichnet in dieser Form jedoch nicht eindeutig den Einsatz von Gewalt. Die Übersetzung bewahrt diese Spannung, statt sie aufzulösen.
- issue: Technischer Sinn von תְחַלְּלֶנּוּ
  choice: Beginn des gewöhnlichen Gebrauchs der Weinbergsfrüchte
  alternative: »du wirst ihn nicht genießen« oder wörtlich »du wirst ihn nicht entheiligen«
  rationale: Im Zusammenhang mit einem Weinberg bezeichnet חלל wahrscheinlich die Freigabe der Früchte zum normalen Verzehr, vergleichbar mit dem Hintergrund von 3. Mose 19,23–25. Eine rein wörtliche Wiedergabe wäre im Deutschen missverständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die drastische Folge des Fluchs wird klar ausgedrückt; zugleich werden weder sexuelle Gewalt noch der technische Sinn des Weinbergidioms stärker festgelegt, als es der hebräische Wortlaut erlaubt.
