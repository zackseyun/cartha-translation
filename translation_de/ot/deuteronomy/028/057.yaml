  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: de
  text: und gegenüber ihrer Nachgeburt, die zwischen ihren Beinen hervorkommt[a], und gegenüber ihren Kindern, die sie gebiert, denn aus Mangel an allem[b] wird sie sie heimlich essen, in der Belagerung und Bedrängnis, durch die dein Feind dich innerhalb deiner Tore[c] bedrängen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrer Plazenta“. Das hebräische Wort bezeichnet die Nachgeburt, die bei einer Entbindung ausgestoßen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: wegen völliger Entbehrung.'
    reason: lexical_alternative
  - marker: c
    text: „Innerhalb deiner Tore“ meint hier die belagerten Städte oder Ortschaften, nicht nur den Bereich unmittelbar an ihren Toren.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: ihre Nachgeburt
  rationale: Das Substantiv bezeichnet die bei der Geburt ausgestoßene Nachgeburt beziehungsweise Plazenta. „Nachgeburt“ ist im Deutschen genau, verständlich und weniger klinisch als „Plazenta“.
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  choice: die zwischen ihren Beinen hervorkommt
  rationale: Die Wendung beschreibt den Geburtsvorgang körperlich und direkt. „Beine“ gibt רַגְלַיִם in diesem Zusammenhang idiomatisch wieder.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: und gegenüber ihren Kindern, die sie gebiert
  rationale: בָּנִים kann Söhne oder allgemein Kinder bezeichnen; hier sind die von ihr geborenen Nachkommen gemeint. Die Wiederholung von „gegenüber“ macht den Anschluss an die Satzkonstruktion des vorherigen Verses im Deutschen erkennbar.
- source_word: כִּי תֹאכְלֵם
  choice: Denn ... wird sie sie ... essen
  rationale: כִּי begründet das zuvor beschriebene Verhalten. Das gewöhnliche Verb „essen“ bewahrt die erschütternde Konkretheit der Aussage; das Pronomen bezieht sich grammatisch auf Nachgeburt und Kinder.
- source_word: בְּחֹסֶר כֹּל
  choice: aus Mangel an allem
  rationale: Die Wendung bezeichnet vollständige Entbehrung. Das deutsche „aus Mangel an allem“ gibt sowohl den ursächlichen Zusammenhang als auch die umfassende Not natürlich wieder.
- source_word: בַּסָּתֶר
  choice: heimlich
  rationale: Das Adverb bringt zum Ausdruck, dass die Tat verborgen vor anderen geschieht.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: während der Belagerung und Bedrängnis
  rationale: מָצוֹר bezeichnet die Belagerung, מָצוֹק die dadurch verursachte Enge, Not oder Bedrängnis. Die Paarung der beiden Begriffe bleibt erhalten.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: mit der dein Feind dich ... bedrängen wird
  rationale: Die Hifil-Form von צוק bezeichnet das Ausüben schweren Drucks. „bedrängen“ passt sowohl zum feindlichen Handeln als auch zur konkreten Enge einer Belagerung.
- source_word: בִּשְׁעָרֶיךָ
  choice: innerhalb deiner Tore
  rationale: Die wörtliche Bildsprache bleibt erhalten; gemeint ist der bewohnte und befestigte Bereich der Städte hinter ihren Toren.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst direkter Wortwahl. Da Vers 57 syntaktisch an Vers 56 anschließt, bleibt die einleitende Konstruktion als Fortsetzung mit „und gegenüber“ stehen. Die drastische Körperlichkeit und die Spannung des hebräischen Fluchwortes werden nicht abgeschwächt.
