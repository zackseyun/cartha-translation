  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Gliederung und den drastisch-konkreten Sinn des Hebräischen insgesamt zuverlässig wieder: שִׁלְיָה ist zutreffend als „Nachgeburt“ gefasst, בָּנִים kann hier angemessen mit „Kinder“ wiedergegeben werden, und die heimliche Aufnahme von Nachgeburt und Kindern aufgrund totaler Not bleibt ungemildert. Die abschließende Relativkonstruktion sollte jedoch im Deutschen eindeutig beide Begriffe „Belagerung und Bedrängnis“ umfassen.'
  naturalness: „Aus Mangel an allem“ und „heimlich essen“ sind modernes, verständliches Standarddeutsch. Der Punkt nach „gebiert“ trennt allerdings einen Satzteil, der syntaktisch und semantisch mit der folgenden Begründung verbunden ist. Außerdem lässt das Singular-Relativpronomen „mit der“ formal nur „Bedrängnis“ als Bezug erscheinen, obwohl sich אשר im Hebräischen auf die zusammengehörige Belagerungs- und Bedrängnissituation bezieht.
  terminology: „Nachgeburt“, „Belagerung“, „Bedrängnis“ und „bedrängen“ sind sachgerecht und im Register angemessen. „Innerhalb deiner Tore“ bewahrt die Bildsprache von בִּשְׁעָרֶיךָ; die vorhandene Anmerkung erläutert zutreffend den gemeinten Stadt- bzw. Siedlungsraum.
  issues:
