  text: וֶֽ/הֱשִֽׁיבְ/ךָ֨ יְהוָ֥ה מִצְרַיִם֮ בָּ/אֳנִיּוֹת֒ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְ/ךָ֔ לֹא תֹסִ֥יף ע֖וֹד לִ/רְאֹתָ֑/הּ וְ/הִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְ/אֹיְבֶ֛י/ךָ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת וְ/אֵ֥ין קֹנֶֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: de
  text: 'Und Jahwe wird dich auf Schiffen nach Ägypten zurückbringen, auf dem Weg, von dem ich dir gesagt habe: »Du sollst ihn nie wieder sehen.« Dort werdet ihr euch euren Feinden als Sklaven und Sklavinnen zum Verkauf anbieten[a], aber niemand wird euch kaufen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dort werdet ihr euren Feinden als Sklaven und Sklavinnen verkauft werden.« Die hebräische Verbform kann reflexiv verstanden werden (»euch zum Verkauf anbieten«) oder allgemeiner den Eintritt in die Sklaverei bezeichnen. Der Satz kann zudem so verstanden werden, dass Israel Ägypten nie wieder sehen sollte.'
    reason: 'Lexikalische und syntaktische Mehrdeutigkeit: Bedeutung der Hitpael-Form sowie möglicher Bezug des pronominalen Suffixes.'
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: wird dich … zurückbringen
  rationale: Der Hifil von שוב ist kausativ; die Formulierung gibt wieder, dass Jahwe Israel zur Rückkehr veranlasst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בָּאֳנִיּוֹת
  choice: auf Schiffen
  rationale: Im Deutschen ist dies für die Beförderung mit Schiffen natürlich und sachlich präzise.
- source_word: בַּדֶּרֶךְ
  choice: auf dem Weg
  rationale: דרך bezeichnet hier den Weg beziehungsweise die Route; die Formulierung hält den Bezug zum folgenden Relativsatz fest.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Du sollst ihn nie wieder sehen
  rationale: יסף mit עוד verneint die Wiederholung einer Handlung. Das Suffix bezieht sich grammatisch am ehesten auf den Weg, daher maskulines „ihn“.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: werdet ihr euch … zum Verkauf anbieten
  rationale: Die Hitpael-Form hat reflexive beziehungsweise mediale Bedeutung. Diese Wiedergabe vermeidet zugleich die Aussage eines vollzogenen Verkaufs, den der folgende Satz gerade ausschließt.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: als Sklaven und Sklavinnen
  rationale: Die geschlechtsspezifische Paarung des Hebräischen bleibt erhalten; „Sklaven“ benennt die gemeinte Unfreiheit klarer als beschönigende Alternativen.
- source_word: וְאֵין קֹנֶה
  choice: aber niemand wird euch kaufen
  rationale: Die existentielle Wendung „kein Käufer“ wird idiomatisch wiedergegeben; der Gegensatz zum Angebot zum Verkauf wird deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von לִרְאֹתָהּ
  choice: „ihn“ bezieht sich auf den Weg
  alternative: „es“ beziehungsweise sinngemäß Ägypten
  rationale: Das feminine Suffix kann formal auf דרך bezogen werden, das im biblischen Hebräisch auch feminin gebraucht wird. Im Zusammenhang ist jedoch auch Ägypten als gedanklicher Bezug möglich; diese Spannung wird in einer Fußnote vermerkt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Wechsel vom Singular „dich/du“ für Israel als Kollektiv zum Plural „ihr“ folgt den hebräischen Formen. Die Fußnote bewahrt die echte Mehrdeutigkeit, ohne sie im Haupttext zu überladen.
