base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: de
  text: ohne einem von ihnen etwas vom Fleisch seiner Söhne zu geben, das er isst, weil ihm nichts übrig geblieben ist – in der Belagerung und Bedrängnis, mit der dein Feind dich in allen deinen Städten[a] bedrängen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in allen deinen Toren«. Die Tore stehen hier für die Städte, zu denen sie gehören.'
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: sodass er keinem von ihnen … abgibt
  rationale: Die Präposition מִן mit dem Infinitiv von נתן beschreibt hier das Vorenthalten bzw. die Weigerung, etwas abzugeben. Die distributive Wendung לְאַחַד מֵהֶם wird im Deutschen natürlich mit „keinem von ihnen“ wiedergegeben.
- source_word: מִבְּשַׂר בָּנָיו
  choice: etwas vom Fleisch seiner Söhne
  rationale: בָּשָׂר wird konkret als „Fleisch“ bewahrt; בָּנָיו bezeichnet hier ausdrücklich seine Söhne und wird nicht zum allgemeineren „Kinder“ erweitert.
- source_word: אֲשֶׁר יֹאכֵל
  choice: das er isst
  rationale: Das Imperfekt schildert das Geschehen innerhalb des angekündigten Belagerungsszenarios anschaulich; das deutsche Präsens ist dafür natürlich.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: weil ihm nichts übrig geblieben ist
  rationale: Die Wendung bezeichnet völligen Mangel und begründet im Kontext, warum er nichts abgibt. „Nichts“ gibt כֹּל in der negierten Konstruktion idiomatisch wieder.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: in der Belagerung und Bedrängnis
  rationale: מָצוֹר bezeichnet die Belagerung; מָצוֹק die dadurch entstehende drückende Not. „Bedrängnis“ erhält zugleich den Anklang an den folgenden verwandten Verbstamm.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: mit der dein Feind dich … bedrängen wird
  rationale: Das Hifil von צוק bedeutet, jemanden in Bedrängnis zu bringen bzw. hart zu bedrängen. Die Wiedergabe wahrt die Wortverwandtschaft mit מָצוֹק.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: in allen deinen Städten
  rationale: Wörtlich steht „in allen deinen Toren“; „Tore“ bezeichnet metonymisch die zugehörigen Städte. Im modernen Deutschen vermittelt „Städte“ den gemeinten Ort verständlicher, während die Fußnote das hebräische Bild dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Konkretheit des Ausgangstextes und die ausdrückliche Bezeichnung „Söhne“ bleiben erhalten. Der Satz setzt syntaktisch den vorhergehenden Vers fort; der Gedankenstrich gliedert die lange Umstandsangabe, ohne diese Verbindung aufzulösen.
