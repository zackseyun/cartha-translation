base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: de
  text: Und du wirst am Mittag umhertasten, wie ein Blinder im Dunkeln umhertastet[a], und auf deinen Wegen wirst du keinen Erfolg haben[b]. Du wirst allezeit nur unterdrückt und beraubt werden, und niemand wird dich retten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Blinder in der Finsternis nach etwas tastet“. Das hebräische Verb bezeichnet suchendes Tasten mit den Händen, weil man nicht sehen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und nichts, was du unternimmst, wird dir gelingen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und niemand wird dich befreien“; wörtlicher: „und es gibt keinen Retter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: umhertasten / umhertastet
  rationale: Das Verb bezeichnet ein suchendes Tasten mit den Händen, weil man nicht sehen kann. „Umhertasten“ gibt sowohl die körperliche Handlung als auch die Orientierungslosigkeit wieder.
- source_word: בַּצָּהֳרַיִם
  choice: am hellen Mittag
  rationale: Gemeint ist die hellste Tageszeit. Das ergänzte „hellen“ macht den im hebräischen Vergleich angelegten Gegensatz zur Dunkelheit natürlich und deutlich.
- source_word: הָעִוֵּר
  choice: ein Blinder
  rationale: Das substantivierte Adjektiv steht im Hebräischen maskulin singularisch und bezeichnet hier beispielhaft einen blinden Menschen. „Ein Blinder“ bewahrt Form und Vergleichsstruktur.
- source_word: בָּאֲפֵלָה
  choice: im Dunkeln
  rationale: Das Substantiv bezeichnet Dunkelheit oder Finsternis. „Im Dunkeln“ ist im Deutschen idiomatisch und bildet einen klaren Gegensatz zum hellen Mittag.
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: auf deinen Wegen wirst du keinen Erfolg haben
  rationale: Die Hifil-Form von צלח bezeichnet Erfolg oder Gelingen; „deine Wege“ steht für Lebensführung und Unternehmungen. Die Formulierung erhält das Wegbild, ohne den Sinn auf materiellen Wohlstand zu verengen.
- source_word: אַךְ
  choice: nur
  rationale: 'Die Partikel wirkt einschränkend und verstärkend: Die Betroffenen erfahren nichts als Unterdrückung und Raub.'
- source_word: עָשׁוּק
  choice: unterdrückt
  rationale: Das passive Partizip bezeichnet jemanden, der Unterdrückung, Ausbeutung oder Unrecht erleidet. „Unterdrückt“ ist breit verständlich und kontextgerecht.
- source_word: גָזוּל
  choice: beraubt
  rationale: Das passive Partizip bezeichnet das gewaltsame oder unrechtmäßige Entziehen von Besitz. „Beraubt“ ist natürliches, präzises Deutsch.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Wörtlich „alle Tage“; im Zusammenhang wird eine fortdauernde Lage bezeichnet. „Allezeit“ gibt diese Dauer knapp und würdig wieder.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: und niemand wird dich retten
  rationale: Die Wendung besagt, dass kein Retter oder Befreier vorhanden ist. Die persönliche Formulierung ist im Deutschen natürlich und bewahrt den allgemeinen Rettungssinn.
theological_decisions:
- issue: Wiedergabe von מוֹשִׁיעַ im Zusammenhang des Bundesfluchs
  choice: niemand wird dich retten
  alternative: es gibt keinen Befreier / niemand wird dich befreien
  rationale: Die Wurzel יׁשע bezeichnet hier allgemein Rettung aus Bedrängnis. Die Übersetzung vermeidet sowohl eine unnötige messianische Titulierung als auch eine Verengung auf eine bestimmte Art der Befreiung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Parallelismus bleibt erkennbar; „am hellen Mittag“ und „im Dunkeln“ heben den scharfen Kontrast hervor. „Allezeit“ gibt die ununterbrochene Dauer idiomatisch wieder.
