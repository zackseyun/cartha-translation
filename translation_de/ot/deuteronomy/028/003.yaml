  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: de
  text: Gesegnet wirst du in der Stadt sein[a], und gesegnet wirst du auf dem Feld sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gesegnet bist du in der Stadt, und gesegnet bist du auf dem Feld.«'
    reason: Das Hebräische ist verblos und kann außer als zukünftige Zusage auch als gegenwärtige Feststellung wiedergegeben werden.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: gesegnet
  rationale: Das passive Partizip von ברך bezeichnet im Zusammenhang der Bundeszusage den von Gott gewährten Segen; »gesegnet« bewahrt diesen theologischen und deklarativen Sinn.
- source_word: אַתָּה
  choice: du
  rationale: Das maskuline Personalpronomen der zweiten Person Singular richtet sich an Israel als einheitlichen Bundespartner; das deutsche »du« gibt Numerus und direkte Anrede genau wieder.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die Präposition ב bezeichnet hier den Ort; »in der Stadt« ist direkt und erhält den Gegensatz zum landwirtschaftlichen Lebensbereich.
- source_word: וּבָרוּךְ
  choice: und gesegnet
  rationale: Die Konjunktion und die Wiederholung des Prädikats werden beibehalten, um den ausgewogenen Parallelismus des Hebräischen zu bewahren.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שׂדה bezeichnet Feld, Flur oder offenes Land. Die idiomatische deutsche Wendung »auf dem Feld« bewahrt das konkrete Bild und den Gegensatz zur Stadt.
theological_decisions:
- issue: Wiedergabe der verblosen Segensformel
  choice: Gesegnet wirst du ... sein
  alternative: Gesegnet bist du ...
  rationale: Im Hebräischen steht kein ausdrückliches Verb, sodass sowohl eine gegenwärtig-deklarative als auch eine zukunftsbezogene Wiedergabe möglich ist. Der Zusammenhang der angekündigten Bundessegnungen in Deuteronomium 28 legt im Deutschen die promissorische Form »wirst du ... sein« nahe; die Fußnote bewahrt die genuine grammatische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Segensformel und der Parallelismus zwischen Stadt und Feld bleiben erhalten; »auf dem Feld« ist im Deutschen idiomatischer als »in dem Feld«.
