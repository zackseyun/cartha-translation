review_pass:
  verdict: revise
  source_fidelity: Die Aussage trifft die fortdauernde existenzielle Unsicherheit grundsätzlich. »Wie an einem Faden« fügt jedoch ein im Hebräischen nicht genanntes Vergleichsbild hinzu. תְּלֻאִים bezeichnet das Hängen bzw. Suspendiertsein; die Bedrohung und Ungewissheit ergibt sich aus diesem Bild und dem Kontext.
  naturalness: Die vorgeschlagene Revision ist modernes, verständliches Standarddeutsch und bewahrt zugleich die bildhafte Spannung der Vorlage. »Bei Nacht und bei Tag« sowie »deines Lebens nicht sicher sein« sind idiomatisch und angemessen.
  terminology: »Leben« gibt חַיֶּיךָ idiomatisch wieder. »In der Schwebe hängen« vermittelt sowohl das Bild des Suspendiertseins als auch die unsichere Lage, ohne die nicht im Ausgangstext vorhandene Vorstellung eines Fadens einzutragen. Die Schlussformulierung gibt לֹא תַאֲמִין בְּחַיֶּיךָ als fehlende Gewissheit des Weiterlebens wieder.
  issues:
  - severity: medium
    issue: Die Wendung »wie an einem Faden hängen« ergänzt ein Vergleichsobjekt.
    rationale: Das Hebräische spricht von einem aufgehängten bzw. schwebenden Leben, nennt aber keinen Faden. Die deutsche Redewendung ist zwar naheliegend, präzisiert das Bild jedoch über den Wortlaut hinaus.
  - severity: low
    issue: Die Fußnote bezeichnet »aufgehängt sein« als wörtliche Wiedergabe.
    rationale: Das Partizip kann das Hängen oder Suspendiertsein ausdrücken; »aufgehängt« kann im Deutschen stärker ein bewusstes Aufhängen nahelegen. »In der Schwebe hängen« ist hier neutraler und kontextgemäßer.
