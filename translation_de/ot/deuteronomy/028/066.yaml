- from: Dein Leben wird vor dir wie an einem Faden hängen[a]. Du wirst dich bei Nacht und bei Tag fürchten und deines Lebens nicht sicher sein.
  to: Dein Leben wird vor dir in der Schwebe hängen[a]. Du wirst dich bei Nacht und bei Tag fürchten und deines Lebens nicht sicher sein.
