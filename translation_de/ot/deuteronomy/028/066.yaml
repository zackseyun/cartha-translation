  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: de
  text: Dein Leben wird vor dir in der Schwebe hängen[a]. Du wirst dich bei Nacht und bei Tag fürchten und deines Lebens nicht sicher sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Dein Leben wird vor dir hängen.« Das hebräische Bild stellt das Leben als schwebend und ständig gefährdet dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: dein Leben
  rationale: Der formal pluralische Ausdruck bezeichnet idiomatisch das Leben beziehungsweise Weiterleben der angesprochenen Person; im Deutschen ist der Singular natürlich.
- source_word: תְּלֻאִים
  choice: wie an einem Faden hängen
  rationale: Das Partizip von תלה bezeichnet ein Hängen beziehungsweise Aufgehängtsein. Die deutsche Wendung bewahrt das Bild und macht zugleich die bedrohte, unsichere Lage des Lebens verständlich.
- source_word: לְךָ מִנֶּגֶד
  choice: vor dir
  rationale: Die räumliche Formulierung bedeutet wörtlich »dir gegenüber/vor dir« und stellt die fortwährende Bedrohung unmittelbar vor Augen.
- source_word: וּפָחַדְתָּ
  choice: du wirst dich fürchten
  rationale: פחד bezeichnet Furcht oder Schrecken; die schlichte Wiedergabe wahrt die Stärke des Kontexts ohne unnötige Steigerung.
- source_word: לַיְלָה וְיוֹמָם
  choice: bei Nacht und bei Tag
  rationale: Die hebräische Reihenfolge wird bewahrt; die Formulierung drückt unablässige Furcht aus.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: deines Lebens nicht sicher sein
  rationale: אמן im Hifil kann »vertrauen, glauben, sicher sein« bedeuten. Mit »deinem Leben« als Bezugsgröße geht es hier um fehlende Gewissheit, am Leben zu bleiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Aussage wurde mit der geläufigen Wendung »wie an einem Faden hängen« vermittelt; die Schlussaussage bleibt bewusst auf die Unsicherheit des Weiterlebens bezogen.
