base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: de
  text: Verflucht wird die Frucht deines Leibes sein und die Frucht deines Ackers, der Nachwuchs deiner Rinder und die Jungen deiner Schafe und Ziegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Ausdrücke bezeichnen hier jeweils den Nachwuchs des Viehs: der Rinder sowie der Schafe und Ziegen.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht wird … sein
  rationale: Das prädikative Adjektiv eröffnet eine Bundesfluchformel. Die futurische Formulierung gibt im Deutschen ihren feierlich-deklarativen Charakter im Kontext der angekündigten Fluchfolgen wieder.
- source_word: פְּרִי בִטְנְךָ
  choice: die Frucht deines Leibes
  rationale: Die hebräische Metapher für Nachkommenschaft wird bewahrt; „Leib“ ist im heutigen würdigen Deutsch natürlicher als das wörtliche „Bauch“.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: die Frucht deines Ackers
  rationale: אֲדָמָה bezeichnet hier den bewirtschafteten Erdboden. „Frucht deines Ackers“ bewahrt die Parallelität mit „Frucht deines Leibes“ und ist verständliches Deutsch.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: der Nachwuchs deiner Rinder
  rationale: שְׁגַר bezeichnet den tierischen Nachwuchs, während אֲלָפֶיךָ in diesem Zusammenhang Rinder beziehungsweise Großvieh meint.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: die Jungen deiner Schafe und Ziegen
  rationale: Die feste Wendung bezeichnet den Nachwuchs beziehungsweise Zuwachs des Kleinviehs; צֹאן umfasst gewöhnlich Schafe und Ziegen. Die konkrete Wiedergabe vermeidet eine irreführende Verbindung mit dem ähnlich geschriebenen Götternamen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „Frucht deines …“ erhält die Bildsprache und Parallelität des Hebräischen; die Viehbegriffe werden für heutige Leser konkret wiedergegeben.
