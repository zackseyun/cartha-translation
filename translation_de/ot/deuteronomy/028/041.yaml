translation:
  language: de
  text: Söhne und Töchter wirst du zeugen, doch sie werden nicht dir gehören[a], denn sie werden in Gefangenschaft gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Sie werden nicht bei dir bleiben.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »als Gefangene fortziehen«. Das Hebräische spricht ausdrücklich von Gefangenschaft; »Exil« wäre weiter gefasst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Das Hebräische nennt ausdrücklich männliche und weibliche Nachkommen; die Paarform bleibt erhalten.
- source_word: תּוֹלִיד
  choice: wirst du zeugen
  rationale: Die Hifil-Form der Wurzel ילד richtet sich an eine maskuline Singularperson. „Zeugen“ gibt den Sinn präzise und in verständlichem, gehobenem Deutsch wieder.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: doch sie werden nicht dein sein
  rationale: Die Formulierung bewahrt die knappe und offene hebräische Wendung „sie werden nicht für/zu dir sein“, ohne die Folge bereits eindeutig als bloßes Nicht-bei-dir-Bleiben auszulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für den Verlust der Kinder ein; „denn“ ist im Deutschen natürlich und klar kausal.
- source_word: יֵלְכוּ
  choice: sie werden gehen
  rationale: Die aktive Qal-Form von הלך wird aktiv wiedergegeben. Eine passive Übersetzung wie „sie werden weggeführt“ würde den im Zusammenhang naheliegenden Zwang ausdrücklich machen, obwohl er in diesem Verb nicht steht.
- source_word: בַּשֶּׁבִי
  choice: in Gefangenschaft
  rationale: שֶׁבִי bezeichnet Kriegsgefangenschaft beziehungsweise den Zustand der Verschleppung; „in Gefangenschaft“ ist die direkte deutsche Entsprechung.
