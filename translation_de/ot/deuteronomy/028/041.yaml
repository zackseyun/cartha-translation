translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wortgruppe „Söhne und Töchter“ erhält den rhetorischen Nachdruck des Hebräischen. Die knappe Besitz- beziehungsweise Beziehungsformulierung wird bewusst nicht stillschweigend vereindeutigt.
