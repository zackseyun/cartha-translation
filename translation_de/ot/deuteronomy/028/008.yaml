base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: de
  text: 'Jahwe wird dem Segen gebieten, dass er bei dir sei: in deinen Vorratshäusern[a] und bei allem, was deine Hand unternimmt.[b] Er wird dich in dem Land segnen, das Jahwe, dein Gott, dir gibt.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinen Speichern“ beziehungsweise „in deinen Kornhäusern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „bei allem Aussenden deiner Hand“; eine hebräische Wendung für alle Arbeiten oder Unternehmungen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „dir gerade gibt“ beziehungsweise „dir geben wird“. Das hebräische Partizip lässt hier mehrere zeitliche Wiedergaben zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו יְהוָה אִתְּךָ אֶת הַבְּרָכָה
  choice: Jahwe wird dem Segen gebieten, bei dir zu sein
  rationale: Das Piel von צוה bedeutet gewöhnlich „gebieten“. Die Formulierung bewahrt das anschauliche hebräische Bild, nach dem Jahwe den Segen anweist, bei Israel zu sein, ohne es zu „schenken“ oder „senden“ zu glätten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ gibt den Gottesnamen im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: הַבְּרָכָה
  choice: dem Segen
  rationale: Der bestimmte Artikel wird in der deutschen Formulierung beibehalten; gemeint ist der im Bund verheißene konkrete Segen.
- source_word: בַּאֲסָמֶיךָ
  choice: in deinen Vorratshäusern
  rationale: אָסָם bezeichnet einen Speicher beziehungsweise ein Vorrats- oder Kornhaus. „Vorratshäuser“ ist verständlich und weniger eng als „Scheunen“.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: bei allem, was deine Hand unternimmt
  rationale: Die Wendung bedeutet wörtlich etwa „bei allem Aussenden deiner Hand“ und bezeichnet Arbeit oder Unternehmungen. Die Übersetzung bewahrt das Bild der Hand und ist zugleich natürlich verständlich.
- source_word: וּבֵרַכְךָ
  choice: Er wird dich segnen
  rationale: Das Perfekt mit vorangestelltem Waw führt den Zukunftssinn des ersten Verbs fort. Das ausdrückliche „Er“ macht klar, dass Jahwe weiterhin das Subjekt ist.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: „Land“ bewahrt den für das Deuteronomium wichtigen Bezug auf das Israel verheißene Land, ohne diesen Bezug erläuternd in den Text einzufügen.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip kann gegenwärtig, unmittelbar bevorstehend oder charakteristisch verstanden werden. Das deutsche Präsens „gibt“ lässt diese zeitliche Offenheit weitgehend bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als „Jahwe“ lässt den persönlichen Bundesnamen sichtbar und verwendet die im modernen Deutschen übliche Form, ohne einen bloßen Titel einzusetzen.
- issue: Bundestheologische Bedeutung von הָאָרֶץ
  choice: das Land
  alternative: das Land, das Jahwe dir geben wird; das Land der Verheißung
  rationale: „Das Land“ erhält den deuteronomischen Bundesklang. Ein Zusatz wie „der Verheißung“ wäre zwar kontextuell zutreffend, stünde aber nicht ausdrücklich im Vers.
- issue: Zeitwert des Partizips נֹתֵן
  choice: gibt
  alternative: gerade gibt; geben wird
  rationale: Das Präsens wahrt die mögliche Spannung zwischen gegenwärtiger Gabe und unmittelbar bevorstehender Erfüllung, statt den Zeitbezug unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „dem Segen gebieten“ bewahrt das kräftige hebräische Bild; der folgende Infinitivsatz macht dessen Sinn klar. Die Singularform „deine Hand“ erhält die Bildsprache des Ausgangstextes.
