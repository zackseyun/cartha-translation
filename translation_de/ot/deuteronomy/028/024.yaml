    issue: „Erdstaub“ für עָפָר
    rationale: עָפָר kann Staub, Erde oder loses Erdmaterial bezeichnen. „Erdstaub“ verdoppelt hier den bereits für אָבָק verwendeten Begriff „Staub“ und ist als Kontrastpaar weniger natürlich als „Staub und Erde“.
  - severity: medium
    issue: Mehrdeutiges Pronomen „er“ in „vom Himmel wird er auf dich herabfallen“
    rationale: Im Deutschen kann „er“ aufgrund des vorangehenden Subjekts „Jahwe“ auf Jahwe bezogen werden, obwohl im Hebräischen der Regen bzw. die als Niederschlag kommende Fluchsubstanz gemeint ist. Die explizite Wiederaufnahme stellt den Bezug klar.
