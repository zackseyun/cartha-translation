  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: de
  text: Jahwe wird den Regen deines Landes zu Staub und Erde machen[a]; vom Himmel wird der Regen auf dich herabfallen, bis du vernichtet bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu feinem Staub und loser Erde“. Das Hebräische verbindet zwei verwandte Wörter für trockenes, loses Material und verstärkt so das Bild von Dürre und Verwüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִתֵּן
  choice: wird … zu … machen
  rationale: Das wörtliche „geben“ bezeichnet hier im Zusammenhang, dass Jahwe den erwarteten Regen als Staub und Erdstaub kommen lässt; die deutsche Wendung gibt diesen Sinn natürlich wieder.
- source_word: מְטַר אַרְצְךָ
  choice: den Regen deines Landes
  rationale: Die Genitivverbindung bewahrt die knappe Beziehung des hebräischen Ausdrucks und ist im Deutschen verständlich.
- source_word: אָבָק וְעָפָר
  choice: Staub und Erdstaub
  rationale: Die zwei verwandten Begriffe für trockenes, loses Material werden unterschieden, ohne die im Hebräischen verstärkte Dürre- und Verwüstungsmetaphorik einzuebnen.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel
  rationale: „Himmel“ ist hier die natürliche deutsche Wiedergabe des formal pluralischen hebräischen Ausdrucks für den Himmelsraum.
- source_word: יֵרֵד עָלֶיךָ
  choice: wird er auf dich herabfallen
  rationale: Das maskuline Singularverb kann grammatisch auf den zuvor genannten Regen zurückbezogen werden; „herabfallen“ passt zugleich zur Vorstellung eines verheerenden Niederschlags.
- source_word: עַד הִשָּׁמְדָךְ
  choice: bis du vernichtet bist
  rationale: Die kompakte Infinitivkonstruktion bezeichnet den Endpunkt des Fluches, ohne in diesem Teilsatz ausdrücklich einen Handelnden zu nennen.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: „Jahwe“ wahrt den persönlichen Gottesnamen des Ausgangstextes und ersetzt ihn nicht durch einen Titel.
- issue: Unausgesprochenes Subjekt bei „bis du vernichtet bist“
  choice: Passiv ohne ausdrücklich genannten Handelnden
  alternative: bis er dich vernichtet hat
  rationale: Die Wiedergabe bewahrt die Knappheit und lässt die im hebräischen Teilsatz nicht ausdrücklich markierte Agensfrage offen, auch wenn Jahwe im Gesamtzusammenhang der Urheber des Fluches ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache bleibt konkret; „Erdstaub“ erhält die Zweigliedrigkeit des Hebräischen, während die Fußnote natürlichere lexikalische Alternativen nennt.
