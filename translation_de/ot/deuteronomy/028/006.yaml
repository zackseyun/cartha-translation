translation:
  language: de
  text: Gesegnet wirst du sein, wenn du hineinkommst[a][b], und gesegnet wirst du sein, wenn du hinausgehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „du“ in der Einzahl; Israel wird als ein Volk in der Einzahl angeredet.
    reason: cultural_note
  - marker: b
    text: 'Oder: „bei deinem Hereinkommen … bei deinem Hinausgehen“; die Verbindung kann als umfassende Wendung für den gesamten Lebensweg und alle Tätigkeiten verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gesegnet wirst du sein
  rationale: Das passive Partizip von ברך steht prädikativ in einem Abschnitt über angekündigte Bundesfolgen. Die futurische Formulierung gibt den Zusammenhang wieder und bewahrt zugleich den feierlichen Segensklang.
- source_word: אַתָּה
  choice: du
  rationale: Das Pronomen steht in der zweiten Person Maskulinum Singular und redet Israel als Bundesvolk in der Einzahl an. Das deutsche „du“ bildet diese Form ausdrücklich ab.
- source_word: בְּבֹאֶךָ
  choice: wenn du hineinkommst
  rationale: Die Präposition ב mit dem Infinitiv von בוא und dem Suffix der zweiten Person Singular bezeichnet den Umstand des Herein- oder Eintretens. „Wenn du hineinkommst“ ist gegenwärtiges, natürliches Deutsch und bleibt dem konkreten Bild nah.
- source_word: וּבָרוּךְ
  choice: und gesegnet wirst du sein
  rationale: Die vollständige Wiederholung der Segensformel erhält den Parallelismus und die rhetorische Ausgewogenheit des Hebräischen.
- source_word: בְּצֵאתֶךָ
  choice: wenn du hinausgehst
  rationale: Die Präposition ב mit dem Infinitiv von יצא und dem Suffix der zweiten Person Singular bezeichnet den Umstand des Hinausgehens. Zusammen mit „hineinkommen“ kann die Wendung die gesamte Lebensführung und Tätigkeit umfassen.
theological_decisions:
- issue: Israel wird stellvertretend in der Einzahl angeredet
  choice: Die Anrede mit „du“ in der Einzahl bleibt erhalten und wird nicht zu einem Plural erweitert.
  alternative: „Gesegnet werdet ihr sein …“ oder „Israel wird gesegnet sein …“
  rationale: Der hebräische Text gebraucht die zweite Person Maskulinum Singular, um Israel als ein Bundesvolk anzureden. Die Einzahl bewahrt diese Bundesrede, ohne sie interpretierend auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Segensformel bildet den hebräischen Parallelismus ab; „hineinkommst … hinausgehst“ bewahrt sowohl die konkrete Bewegung als auch die mögliche umfassende Bedeutung.
