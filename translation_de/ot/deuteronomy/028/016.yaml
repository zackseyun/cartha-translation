base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: de
  text: Verflucht[a] bist du in der Stadt, und verflucht bist du auf dem Feld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unter einem Fluch.'
    reason: Lexikalische Alternative zu „verflucht“, welche den bezeichneten Zustand ausdrücklich umschreibt.
lexical_decisions:
- source_word: אָרוּר
  choice: verflucht
  rationale: Das passive Partizip steht prädikativ in einer Bundesfluchformel. „Verflucht“ gibt den erklärten Zustand unter dem Bundesgericht knapp und kraftvoll wieder.
- source_word: אַתָּה
  choice: bist du
  rationale: Das ausdrückliche Personalpronomen der 2. Person Singular wird bewahrt; die Stellung nach dem Prädikat erhält die hebräische Betonung in natürlichem Deutsch.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die Präposition bezeichnet den Ort. „In der Stadt“ ist die direkte und natürliche Wiedergabe und bildet den städtischen Gegenpol zum Feld.
- source_word: וְ
  choice: und
  rationale: Die einfache Konjunktion verbindet die parallelen Aussagen und wahrt ihren kumulativen Charakter.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שָׂדֶה bezeichnet Feld beziehungsweise offenes, landwirtschaftlich genutztes Land. Die idiomatische deutsche Wendung „auf dem Feld“ bewahrt den konkreten ländlichen Gegenpol zur Stadt.
theological_decisions:
- issue: Bundesfluchformel und zeitliche Aussage
  choice: Die unmittelbare Erklärung „Verflucht bist du …“ wird in beiden Satzteilen beibehalten.
  alternative: „Du wirst verflucht sein …“ oder „Du sollst verflucht sein …“
  rationale: Im Hebräischen steht eine verblose prädikative Konstruktion mit wiederholtem Partizip und Pronomen, weder eine ausdrückliche Zukunftsform noch ein Wunsch. Die direkte Erklärung wahrt die rechtlich-bundestheologische Kraft, ohne eine Zeitstufe hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die Wiederholung von „verflucht bist du“ werden bewahrt; „in der Stadt“ und „auf dem Feld“ bilden zusammen eine umfassende Gegenüberstellung der Lebensbereiche.
