base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn du wirklich auf die Stimme Jahwes, deines Gottes, hörst[a] und sorgfältig darauf achtest, alle seine Gebote zu befolgen, die ich dir heute gebiete, dann wird Jahwe, dein Gott, dich hoch über alle Völker der Erde stellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn du die Stimme Jahwes, deines Gottes, hörend hörst“. Die hebräische Verstärkungsform bezeichnet aufmerksames, gehorsames Hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt den vorausweisenden, bundesbezogenen Formelcharakter und leitet die Bedingung natürlich ein.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: Wenn du wirklich auf die Stimme ... hörst
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Hören. Die deutsche Wendung „auf die Stimme hören“ umfasst zugleich aufmerksames Hören und Gehorsam und bewahrt das hebräische Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: sorgfältig darauf achtest, ... zu tun
  rationale: Bringt sowohl das wachsame Beachten als auch die tatsächliche Ausführung der Gebote in natürlichem Deutsch zum Ausdruck.
- source_word: כָּל מִצְוֺתָיו
  choice: alle seine Gebote
  rationale: Bewahrt den bundesrechtlichen Gehalt und den umfassenden Anspruch des Ausdrucks.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebe
  rationale: „Gebote geben“ ist im Deutschen eine natürliche Wiedergabe des gegenwärtigen Anordnens durch Mose und erhält die zeitliche Unmittelbarkeit von „heute“.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: dann wird ... dich hoch ... stellen
  rationale: נתן bezeichnet hier zusammen mit dem Prädikativ die Versetzung in eine erhöhte Stellung; „dann“ verdeutlicht die Folge der Bedingung.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: über alle Völker der Erde
  rationale: Gibt den weltweiten Vergleich mit sämtlichen Völkern wieder; „Erde“ passt hier besser als das regional mögliche „Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; seine Wiedergabe bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundesidiom שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: wirklich auf die Stimme ... hören
  alternative: der Stimme ... gewissenhaft gehorchen
  rationale: Die gewählte Formulierung bewahrt sowohl das konkrete Motiv des Hörens als auch dessen im Deutschen verständlichen Sinn von Gehorsam. Die Fußnote macht die hebräische Verstärkung transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau erhält die feierliche Bedingungs- und Folgeformel, bleibt durch den Doppelpunkt und das ausdrückliche „dann“ aber gut verständlich.
