translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verdeutlicht den Gegensatz. Die ungewöhnliche pronominale Rückbeziehung auf „Wein“ bleibt erhalten, statt sie stillschweigend als „Trauben“ oder „Ertrag“ aufzulösen.
