  source_fidelity: 'Der Entwurf gibt die Abfolge der hebräischen Fluchankündigung grundsätzlich zutreffend wieder: Weinberge pflanzen und bearbeiten, keinen Wein trinken oder sichern, weil ein wurmartiger Schädling ihn frisst. Die pronominale Rückbeziehung auf „Wein“ entspricht der Form des hebräischen Suffixes, auch wenn sie den als Ertrag verstandenen Wein metonymisch behandelt.'
  naturalness: „Wein einsammeln“ ist im modernen Deutschen deutlich unidiomatischer als „Wein einlagern“. Da אגר gerade auch „lagern/aufbewahren“ bedeutet und der Kontext vom Nichtverfügen über den Ertrag handelt, ist „einlagern“ die natürliche Hauptlesart. „Weinberge bewirtschaften“ ist zudem im Deutschen geläufiger als „sie bearbeiten“.
  terminology: „Weinberge“, „Wein“ und „Wurm“ sind angemessen. „Wurm“ bewahrt die vom Hebräischen nicht näher bestimmte Art des Schädlings. Die Formulierung vermeidet eine unbelegte Spezifizierung als Raupe oder Made.
