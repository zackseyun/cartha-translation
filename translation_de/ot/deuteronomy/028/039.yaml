base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: de
  text: Du wirst Weinberge pflanzen und sie bewirtschaften. Doch du wirst keinen Wein trinken und ihn auch nicht einlagern[a], denn der Wurm wird ihn fressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einsammeln“. Das hebräische Verb kann sammeln, einsammeln oder einlagern bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: Weinberge
  rationale: Der Plural bezeichnet im landwirtschaftlichen Zusammenhang eindeutig Weinberge.
- source_word: תִּטַּע
  choice: du wirst … pflanzen
  rationale: Das Qal-Imperfekt der 2. Person Singular steht in der Folge der angekündigten Flüche und wird daher zukunftsbezogen wiedergegeben.
- source_word: וְעָבָדְתָּ
  choice: und sie bearbeiten
  rationale: עבד bedeutet im landwirtschaftlichen Zusammenhang, den Boden beziehungsweise die Weinberge zu bearbeiten oder zu bewirtschaften; das Pronomen macht das im Hebräischen vorausgesetzte Objekt im Deutschen deutlich.
- source_word: יַיִן
  choice: Wein
  rationale: Das Wort bezeichnet hier den erwarteten Ertrag der Weinberge in Form von Wein.
- source_word: וְלֹא תֶאֱגֹר
  choice: und ihn auch nicht einsammeln
  rationale: אגר kann sammeln, einsammeln oder einlagern bedeuten. „Einsammeln“ hält den Bezug auf den Ertrag offen und bewahrt die ungewöhnliche Verbindung mit „Wein“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für den ausbleibenden Genuss und Ertrag ein.
- source_word: תֹאכְלֶנּוּ
  choice: wird ihn fressen
  rationale: Das Verb bedeutet wörtlich „essen“; bei einem Schädling ist „fressen“ im Deutschen idiomatisch. Das maskuline Pronomen nimmt formal „Wein“ auf, auch wenn sachlich die Trauben beziehungsweise der Ertrag gemeint sein können.
- source_word: הַתֹּלָעַת
  choice: der Wurm
  rationale: Das Substantiv bezeichnet allgemein ein wurm- oder larvenartiges Schadtier; „Wurm“ vermeidet eine nicht gesicherte genauere Artbestimmung.
