  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: de
  text: Du wirst in deinem ganzen Gebiet Olivenbäume haben, aber du wirst dich nicht mit Öl salben, denn deine Oliven werden abfallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Olivenbaum wird seine Früchte abwerfen“. Im Hebräischen steht „dein Ölbaum/deine Olive“ im Singular; dies kann kollektiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: Ölbäume
  rationale: Der Plural kann Oliven oder Ölbäume bezeichnen. Zusammen mit der Aussage, dass sie im ganzen Gebiet vorhanden sein werden, sind hier die Bäume gemeint.
- source_word: יִהְיוּ לְךָ
  choice: du wirst … haben
  rationale: Die hebräische Konstruktion drückt Besitz beziehungsweise Verfügbarkeit aus und wird so natürlich und genau wiedergegeben.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: in deinem ganzen Gebiet
  rationale: גְּבוּל kann Grenze oder das von Grenzen umschlossene Gebiet bezeichnen; hier ist das gesamte Landgebiet gemeint.
- source_word: וְשֶׁמֶן
  choice: Öl
  rationale: Der Ausgangstext sagt allgemein „Öl“; durch den Zusammenhang ist klar, dass Olivenöl gemeint ist.
- source_word: לֹא תָסוּךְ
  choice: du wirst dich nicht mit Öl salben
  rationale: סוך bezeichnet das Auftragen beziehungsweise Einreiben von Öl auf den Körper. „Sich mit Öl salben“ bewahrt das konkrete antike Bild.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund dafür ein, weshalb kein Öl zum Salben zur Verfügung stehen wird.
- source_word: יִשַּׁל
  choice: werden abfallen
  rationale: Das Verb bezeichnet hier das Abfallen oder vorzeitige Herabfallen der Frucht.
- source_word: זֵיתֶךָ
  choice: deine Oliven
  rationale: Der Singular wird kollektiv verstanden und bezeichnet im Kontext den Olivenertrag beziehungsweise die Früchte.
