  register: Modernes, würdevolles Standarddeutsch. Die drastische Sprache des Bundesfluches bleibt erhalten. Das wiederholte „Nachwuchs“ bildet die parallelen hebräischen Ausdrücke bewusst ab; die Unsicherheit des seltenen zweiten Ausdrucks wird nicht stillschweigend beseitigt, sondern in einer Fußnote kenntlich gemacht.
