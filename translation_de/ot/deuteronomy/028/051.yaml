base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: de
  text: Es wird den Nachwuchs deines Viehs und den Ertrag deines Landes verzehren, bis du vernichtet bist. Es wird dir weder Getreide noch Most noch Öl übrig lassen, weder den Nachwuchs deiner Rinder noch den Zuwachs deines Kleinviehs[a], bis es dich zugrunde gerichtet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der seltene hebräische Ausdruck עַשְׁתְּרֹת צֹאנֶךָ kann den Zuwachs oder Fortpflanzungsertrag des Kleinviehs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Es wird … verzehren
  rationale: אכל bedeutet wörtlich „essen“, bezeichnet hier im Zusammenhang des Fluches aber das restlose Aufzehren der Lebensgrundlagen. Das unpersönliche „Es“ nimmt das zuvor genannte feindliche Volk auf.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: den Nachwuchs deines Viehs
  rationale: פְּרִי („Frucht“) bezeichnet bei Tieren idiomatisch die Nachkommen; בְּהֵמָה meint hier das Nutzvieh insgesamt.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: den Ertrag deines Ackers
  rationale: פְּרִי bezeichnet zusammen mit אֲדָמָה den landwirtschaftlichen Ertrag. „Acker“ gibt den in diesem Zusammenhang bewirtschafteten Boden natürlich wieder.
- source_word: עַד הִשָּׁמְדָךְ
  choice: bis du vernichtet bist
  rationale: Die Infinitivkonstruktion bezeichnet den Endpunkt des Aufzehrens. „Vernichtet“ bewahrt die Härte des Fluchwortes, ohne stärker als der Ausgangstext zu formulieren.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Es wird dir weder … übrig lassen
  rationale: Die Relativkonstruktion beschreibt die vollständige Entziehung der aufgezählten Vorräte und Tierbestände; im Deutschen ist ein neuer Hauptsatz klar und natürlich.
- source_word: דָּגָן
  choice: Getreide
  rationale: דָּגָן ist die allgemeine Bezeichnung für Getreideerzeugnisse.
- source_word: תִּירוֹשׁ
  choice: Most
  rationale: תִּירוֹשׁ bezeichnet frischen Wein beziehungsweise Traubenmost. „Most“ ist im Deutschen knapp und unterscheidet ihn von gewöhnlichem Wein.
- source_word: יִצְהָר
  choice: Öl
  rationale: In der festen Dreiergruppe mit Getreide und Most ist Olivenöl gemeint; „Öl“ ist die herkömmliche und kontextuell eindeutige Wiedergabe.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: den Nachwuchs deiner Rinder
  rationale: שֶׁגֶר bezeichnet den tierischen Nachwuchs, אֲלָפִים den Rinderbestand. Die Wiedergabe vermeidet die unnötige Einengung auf Kälber, obwohl vor allem diese gemeint sein können.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: den Nachwuchs deiner Schafe
  rationale: Der seltene Ausdruck bezeichnet in der Parallelbildung wahrscheinlich den Fortpflanzungsertrag beziehungsweise die Jungtiere des Kleinviehs. „Schafe“ ist im Kontext verständlich, während die lexikalische Unsicherheit in der Fußnote offengelegt wird.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: bis es dich zugrunde gerichtet hat
  rationale: Der Hifil von אבד bedeutet „zugrunde richten, vernichten“. Die Formulierung wahrt die kausative Bedeutung und variiert die deutsche Ausdrucksweise, ohne die abschließende Wiederholung abzuschwächen.
