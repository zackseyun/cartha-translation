revisions:
- from: Und alle diese Flüche werden über dich kommen, dich verfolgen und dich einholen, bis du vernichtet bist, weil du nicht auf die Stimme Jahwes, deines Gottes, gehört und seine Gebote und Satzungen, die er dir geboten hat, nicht befolgt hast.[a]
  to: Und alle diese Flüche werden über dich kommen, dich verfolgen und dich einholen, bis du vernichtet bist, weil du nicht auf die Stimme Jahwes, deines Gottes, gehört hast, seine Gebote und Satzungen zu befolgen, die er dir geboten hat.[a]
  rationale: Die Revision verbindet den Infinitiv wieder unmittelbar mit „auf die Stimme ... hören“ und vermeidet dadurch die unnötige Aufspaltung in zwei verneinte Aussagen. Der deutsche Haupttext bleibt klar und würdevoll; die Fußnote beschreibt ihre Funktion präziser. Die Bedeutung, der Gottesname und die rechtliche Terminologie bleiben unverändert.
  reviewer_model: gpt-5.6-terra
