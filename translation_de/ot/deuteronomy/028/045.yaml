review_pass:
  verdict: revise
  source_fidelity: Die Abfolge „über dich kommen – verfolgen – einholen“ und der resultative Endpunkt „bis du vernichtet bist“ geben den hebräischen Text zuverlässig wieder. Im Schlussteil entfaltet der Haupttext jedoch die eine negierte Hör-/Gehorsamskonstruktion als zwei getrennte Verneinungen. Das ist sinngemäß möglich, aber weniger eng an die Verknüpfung von שָׁמַע בְּקוֹל mit לִשְׁמֹר gebunden.
  naturalness: Die vorliegende Formulierung ist verständlich, doch „nicht ... gehört und ... nicht befolgt hast“ wirkt durch die wiederholte Negation etwas schwerfällig. Eine Konstruktion mit „nicht darauf gehört hast, ... zu befolgen“ ist modernes, idiomatisches Deutsch und erhält zugleich die Hörmetapher.
  terminology: „Jahwe“, „Gebote“ und „Satzungen“ sind angemessen. „Satzungen“ wahrt den rechtlich-bundesbezogenen Registerunterschied zu „Gebote“. Die Fußnote sollte nicht als „wörtlicher“ bezeichnet werden, wenn sie mit „um ... zu“ bereits eine deutsche syntaktische Auslegung bietet; sie sollte die Alternative sachlich als formnähere Wiedergabe kennzeichnen.
  issues:
  - severity: medium
    issue: Der Haupttext macht aus der negierten Hörhandlung und dem folgenden Infinitiv zwei eigenständige negierte Prädikate.
    rationale: Das Hebräische hat „weil du nicht auf die Stimme ... gehört hast, [um/zu] seine Gebote und Satzungen zu bewahren“. Die Revision bewahrt die Abhängigkeit des Infinitivs, ohne den Gehorsamssinn abzuschwächen.
  - severity: low
    issue: Die Fußnote etikettiert eine nicht völlig wörtliche deutsche Konstruktion als „Wörtlicher“.
    rationale: „Um ... zu bewahren“ ist eine plausible formnahe Wiedergabe von לִשְׁמֹר, aber keine rein wörtliche Glosse. Eine neutrale Kennzeichnung vermeidet eine überzogene Genauigkeitsbehauptung.
