base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: de
  text: Und alle diese Flüche werden über dich kommen, dich verfolgen und dich einholen, bis du vernichtet bist, weil du nicht auf die Stimme Jahwes, deines Gottes, gehört hast, seine Gebote und Satzungen zu befolgen, die er dir geboten hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „weil du nicht auf die Stimme Jahwes, deines Gottes, gehört hast, um seine Gebote und seine Satzungen zu bewahren, die er dir geboten hat.“'
    reason: Dokumentiert die hebräische Hörmetapher und eine formnähere Wiedergabe des Infinitivs לִשְׁמֹר. „Befolgen“ im Haupttext gibt den im Kontext gemeinten Gehorsam idiomatisch wieder.
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: werden über dich kommen
  rationale: Die Perfektform bezeichnet in dieser Bundeswarnung eine künftige Folge; „über dich kommen“ gibt die Verbindung mit עַל natürlich und mit ihrer bedrohlichen Stoßrichtung wieder.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: alle diese Flüche
  rationale: Direkte und im Zusammenhang von Segen und Fluch sachgemäße Wiedergabe.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: dich verfolgen und dich einholen
  rationale: 'Die Bewegungsfolge bleibt anschaulich erhalten: Die Flüche setzen dem Angesprochenen nach und erreichen ihn.'
- source_word: עַד הִשָּׁמְדָךְ
  choice: bis du vernichtet bist
  rationale: Gibt den Endpunkt beziehungsweise das Ergebnis wieder, ohne einen im Hebräischen nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: weil du nicht auf die Stimme … gehört … hast
  rationale: Bewahrt die hebräische Hörmetapher; der Gehorsamssinn wird durch den folgenden Ausdruck „nicht befolgt“ verdeutlicht.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwes, deines Gottes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Apposition wahrt die Bundesformel und klingt im Deutschen natürlich.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: seine Gebote und Satzungen … befolgt
  rationale: לִשְׁמֹר bezeichnet hier den praktischen Gehorsam gegenüber den Geboten. „Gebote und Satzungen“ erhält die rechtliche Begriffspaarung.
- source_word: אֲשֶׁר צִוָּךְ
  choice: die er dir geboten hat
  rationale: Die Relativkonstruktion und der ausdrückliche göttliche Ursprung der Vorschriften bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von שׁמע בקול und לִשְׁמֹר
  choice: die Hörmetapher bewahren und den Gehorsam durch „befolgt“ ausdrücken
  alternative: den gesamten Ausdruck nur mit „gehorchen“ wiedergeben
  rationale: So bleiben sowohl die wörtliche Vorstellung des Hörens auf Gottes Stimme als auch der praktisch-gehorsame Sinn des Infinitivs erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Steigerung „kommen, verfolgen, einholen“ und der ernste bundesrechtliche Ton bleiben erhalten. „Satzungen“ ist bewusst als verständlicher rechtlicher Fachbegriff neben „Gebote“ gewählt.
