base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: de
  text: Jahwe wird die Seuche an dir haften lassen, bis er dich vom Land vertilgt hat, in das du einziehst, um es in Besitz zu nehmen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Pest“ beziehungsweise „die Plage“. Das hebräische Wort kann eine tödliche epidemische Krankheit bezeichnen, die in diesem Zusammenhang als Gericht verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis sie dich völlig vernichtet hat“, wenn „die Seuche“ als unausgesprochenes Subjekt verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: wird … an dir haften lassen
  rationale: Der Hifil von דבק ist kausativ („haften lassen“). Die Formulierung bewahrt das eindringliche Bild einer Seuche, die den Betroffenen nicht loslässt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּךָ
  choice: an dir
  rationale: Die Präposition bezeichnet bei דבק die enge Anhaftung; „an dir haften“ ist im Deutschen natürlich und bildgetreu.
- source_word: הַדָּבֶר
  choice: die Seuche
  rationale: דֶּבֶר bezeichnet besonders in Fluch- und Gerichtstexten eine tödliche epidemische Krankheit. „Seuche“ ist präzise, verständlich und stilistisch angemessen.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: bis er dich … getilgt hat
  rationale: כלה bezeichnet hier das vollständige Zu-Ende-Bringen beziehungsweise Vernichten. „Tilgen“ vermittelt die vollständige Beseitigung aus dem Land; als Subjekt wird entsprechend dem Hauptsatz Jahwe verstanden.
- source_word: מֵעַל הָאֲדָמָה
  choice: aus dem Land
  rationale: אֲדָמָה kann „Erdboden“ bedeuten, bezeichnet hier im Zusammenhang der Landnahme jedoch das Land, aus dem Israel durch das Gericht entfernt würde.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: in das du hineinziehst
  rationale: בוא mit שׁמה beschreibt idiomatisch das Hineingehen in das Land. „Hineinziehst“ passt zum unmittelbar bevorstehenden Einzug Israels.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירש bezeichnet im Deuteronomium häufig die tatsächliche Inbesitznahme des verheißenen Landes; diese Formulierung gibt den Zweck ausdrücklich und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gerichtsbegriffs דֶּבֶר
  choice: die Seuche
  alternative: die Pest; die Plage
  rationale: „Seuche“ lässt die genaue Krankheit offen und bewahrt zugleich den Sinn einer tödlichen epidemischen Heimsuchung im Bundesfluch.
- issue: Subjekt von כַּלֹּתוֹ
  choice: bis er dich … getilgt hat
  alternative: bis sie dich … völlig vernichtet hat
  rationale: Am natürlichsten wird Jahwe, das Subjekt des Hauptsatzes, auch als unausgesprochenes Subjekt der Infinitivkonstruktion verstanden. Die grammatisch mögliche Beziehung auf die Seuche wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildlichkeit des hebräischen Kausativs bleibt erhalten; „getilgt“ bringt die vollständige Entfernung aus dem Land knapp und feierlich zum Ausdruck.
