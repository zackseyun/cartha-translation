base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: de
  text: Und du wirst deinen Feinden dienen, die Jahwe gegen dich senden wird – hungrig und durstig, nackt und ohne alles. Er[a] wird dir ein eisernes Joch auf den Nacken legen, bis er dich vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen können „wird legen“ und „vernichtet“ auch den Feind als kollektiv verstandenes Subjekt haben: „Er wird dir ein eisernes Joch auf den Nacken legen, bis er dich vernichtet.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ אֶת אֹיְבֶיךָ
  choice: du wirst deinen Feinden dienen
  rationale: עבד bezeichnet hier erzwungenen Dienst unter feindlicher Herrschaft, nicht Gottesdienst. Das Futur gibt die Folge des Bundesfluchs im heutigen Deutsch natürlich wieder.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: die Jahwe gegen dich senden wird
  rationale: Die Wendung bezeichnet das feindliche Entsenden gegen Israel. Das pluralische „die“ nimmt das kollektive „deine Feinde“ idiomatisch auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: in Hunger und Durst, in Blöße und völligem Mangel
  rationale: Die wiederholte Präposition beschreibt die entbehrungsreichen Umstände des Dienstes. „Blöße“ wahrt den konkreten Mangel an Kleidung; „völliger Mangel“ gibt die umfassende Bedeutung von חֹסֶר כֹּל knapp und natürlich wieder.
- source_word: עֹל בַּרְזֶל
  choice: ein eisernes Joch
  rationale: Die Konstruktion bezeichnet ein Joch aus Eisen und steht bildhaft für unerbittliche Unterwerfung.
- source_word: עַל צַוָּארֶךָ
  choice: dir ... auf den Nacken
  rationale: Diese deutsche Konstruktion gibt das körperliche Bild der auferlegten Knechtschaft natürlich wieder.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: bis er dich vernichtet hat
  rationale: Der Hifil von שׁמד bezeichnet vollständiges Zerstören oder Vernichten. Das Perfekt im deutschen Nebensatz markiert den erreichten Endpunkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Subjekt von וְנָתַן und הִשְׁמִידוֹ
  choice: Jahwe bleibt im Haupttext das Subjekt
  alternative: Der Feind beziehungsweise die Feinde sind das Subjekt
  rationale: Das zuletzt ausdrücklich genannte grammatische Subjekt ist Jahwe, sodass die singularische Verbfolge mit ihm fortgeführt werden kann. Der hebräische Text lässt jedoch auch eine Rückbeziehung auf den kollektiv verstandenen Feind zu; diese echte Mehrdeutigkeit wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Entbehrungen und das harte Jochbild bleiben erhalten; ein Gedankenstrich gliedert die lange Aussage, ohne ihre Steigerung abzuschwächen.
