source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: de
  text: Jahwe wird dich mit Auszehrung[a], Fieber, Entzündung und Gluthitze schlagen, mit dem Schwert, mit Getreidebrand und Vergilbung[b]; und sie werden dich verfolgen, bis du zugrunde gehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schwindsucht“; das hebräische Wort bezeichnet eine entkräftende, zehrende Krankheit.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb steht im Plural und bezieht sich auf die zuvor genannten Plagen und Katastrophen.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: wird dich … schlagen
  rationale: Das Hifil von נכה bezeichnet ein Schlagen oder Heimsuchen. Die Formulierung wahrt die unmittelbare Strafankündigung und die Anrede im Singular.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שַׁחֶפֶת
  choice: Auszehrung
  rationale: Das Wort bezeichnet eine entkräftende, zehrende Krankheit. „Auszehrung“ ist prägnant, ohne die Krankheit medizinisch zu eng als Tuberkulose festzulegen.
- source_word: קַּדַּחַת
  choice: Fieber
  rationale: Das Substantiv bezeichnet eine fieberhafte Erkrankung; „Fieber“ ist die klare moderne Entsprechung.
- source_word: דַּלֶּקֶת
  choice: Entzündung
  rationale: Der Ausdruck gehört zum Bedeutungsfeld des Brennens und bezeichnet hier wahrscheinlich eine entzündliche Erkrankung.
- source_word: חַרְחֻר
  choice: Gluthitze
  rationale: Der seltene Ausdruck bezeichnet wahrscheinlich sengende Hitze oder brennende Fieberhitze. „Gluthitze“ erhält die Bildkraft, ohne medizinische Sicherheit vorzutäuschen.
- source_word: חֶרֶב
  choice: das Schwert
  rationale: Die gewöhnliche Bedeutung ist „Schwert“; im Zusammenhang kann es zugleich für Krieg und gewaltsamen Tod stehen.
- source_word: שִׁדָּפוֹן
  choice: Getreidebrand
  rationale: Gemeint ist eine vernichtende Pflanzen- oder Getreideplage, die mit sengender Einwirkung verbunden ist. „Getreidebrand“ macht den landwirtschaftlichen Bezug deutlich.
- source_word: יֵרָקוֹן
  choice: Vergilbung
  rationale: Das Wort kann im landwirtschaftlichen Zusammenhang eine krankhafte Gelbfärbung oder ein Welken der Pflanzen bezeichnen. „Vergilbung“ bewahrt diesen konkreten Sinn besser als das möglicherweise zu spezifische „Mehltau“.
- source_word: וּרְדָפוּךָ
  choice: und sie werden dich verfolgen
  rationale: Das Verb steht im Plural und verweist natürlich auf die zuvor aufgezählten Plagen und Katastrophen.
- source_word: עַד אָבְדֶךָ
  choice: bis du zugrunde gehst
  rationale: אבד bezeichnet Untergang oder Verderben. Die Wiedergabe ist natürlich und hält die persönliche Anrede fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Subjekt des pluralischen Verbs וּרְדָפוּךָ
  choice: Die aufgezählten Plagen und Katastrophen verfolgen den Angeredeten
  alternative: Eine geglättete unpersönliche oder singularische Wiedergabe
  rationale: Der hebräische Plural erzeugt das eindringliche Bild, dass die zuvor genannten Heimsuchungen den Menschen verfolgen; diese grammatische und theologische Spannung wird beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Reihung bleibt feierlich und eindringlich; seltene Krankheits- und Agrarbegriffe werden verständlich, aber nicht übermäßig präzise wiedergegeben.
