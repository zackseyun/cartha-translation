  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: de
  text: weil du Jahwe, deinem Gott, bei allem Überfluss nicht mit Freude und frohem Herzen gedient hast[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus/wegen der Fülle von allem“. Die Wendung bezieht sich auf die reiche Versorgung mit allem und kann auch im Sinn von „angesichts all des Überflusses“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Wendung führt hier den Grund für die folgenden Bundesflüche ein; im Deutschen gibt „weil“ diese kausale Funktion natürlich wieder.
- source_word: עָבַדְתָּ
  choice: gedient hast
  rationale: עבד mit Gott als Objekt bezeichnet den umfassenden Dienst in gehorsamer Hingabe und ist weiter als bloßes kultisches „anbeten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Bundesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die maskuline Singularform der Anrede an Israel wird unmittelbar bewahrt.
- source_word: בְּשִׂמְחָה
  choice: mit Freude
  rationale: Die Präpositionalphrase bezeichnet die innere Haltung beim Dienst und wird klar und würdig wiedergegeben.
- source_word: וּבְטוּב לֵבָב
  choice: und frohem Herzen
  rationale: Wörtlich ist vom „Gutsein des Herzens“ die Rede; im Kontext bezeichnet die idiomatische Verbindung eine freudige, positive Herzenshaltung. „Frohen Herzens“ klingt im Deutschen natürlich und hält die Herzensdimension fest.
- source_word: מֵרֹב כֹּל
  choice: obwohl du alles im Überfluss hattest
  rationale: Die knappe hebräische Wendung beschreibt die reichliche Versorgung, angesichts derer Israel dennoch nicht recht diente. „Obwohl“ macht diesen konzessiven Zusammenhang verständlich, ohne den Überfluss als eigentliche Ursache des Versagens darzustellen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עבד im Bundeszusammenhang
  choice: dienen
  alternative: anbeten
  rationale: „Dienen“ umfasst sowohl kultische Verehrung als auch gehorsame Hingabe und verengt die Aussage nicht auf gottesdienstliche Handlungen.
- issue: Verhältnis von מֵרֹב כֹּל zum vorangehenden Versagen
  choice: 'konzessiv: „obwohl du alles im Überfluss hattest“'
  alternative: 'kausal: „wegen des Überflusses an allem“'
  rationale: Die Formulierung benennt die Fülle, in deren Angesicht Israel nicht mit Freude diente. Die konzessive Wiedergabe vermeidet die theologisch und syntaktisch mögliche Fehlannahme, Gottes Gaben hätten das Versagen unmittelbar verursacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als begründender Nebensatz offen, weil Vers 47 syntaktisch in Vers 48 weitergeführt wird. „Frohen Herzens“ ist idiomatisch und bewahrt zugleich den Bezug auf לֵבָב.
