  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: de
  text: Der Fremde[a], der in deiner Mitte ist, wird immer höher über dich steigen, und du wirst immer tiefer hinabsteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der ansässige Fremde«. Das hebräische Wort גֵּר bezeichnet einen nicht einheimischen Menschen, der unter Israel lebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet hier einen Nichtisraeliten, der dauerhaft innerhalb der Gemeinschaft lebt. „Der Fremde“ ist verständlich und würdevoll; die Fußnote präzisiert den rechtlich-sozialen Sinn.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: der in deiner Mitte lebt
  rationale: Die Formulierung gibt die Zugehörigkeit zum Lebensraum Israels natürlich wieder. „Lebt“ ist aus dem Begriff גֵּר erschlossen und vermeidet die im Deutschen unvollständige Wirkung von „der in deiner Mitte ist“.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: wird … über dich aufsteigen
  rationale: Die Bildsprache von עלה und עַל bleibt erhalten und drückt einen umfassenden Rang- oder Statusaufstieg aus, ohne diesen allein wirtschaftlich oder politisch zu bestimmen.
- source_word: מַעְלָה מָּעְלָה
  choice: immer höher
  rationale: Die hebräische Wiederholung bezeichnet eine fortschreitende Steigerung; „immer höher“ gibt dies im modernen Deutschen idiomatisch wieder.
- source_word: וְאַתָּה תֵרֵד
  choice: und du wirst … hinabsinken
  rationale: „Und“ bewahrt die einfache Verbindung, während der Gegensatz aus dem Satzbau hervorgeht. „Hinabsinken“ bildet den anschaulichen Gegenpol zum Aufsteigen.
- source_word: מַטָּה מָּטָּה
  choice: immer tiefer
  rationale: Die parallele Wiederholung wird entsprechend zu מַעְלָה מָּעְלָה als fortschreitender Abstieg wiedergegeben.
theological_decisions:
- issue: Umkehrung der gesellschaftlichen Stellung im Bundesfluch
  choice: Die allgemeine Bildsprache eines fortschreitenden Aufstiegs des ansässigen Fremden über Israel und des entsprechenden Abstiegs Israels wird bewahrt.
  alternative: Die Aussage ausschließlich wirtschaftlich oder ausschließlich politisch deuten.
  rationale: Der hebräische Text legt den Bereich des Auf- und Abstiegs nicht näher fest. Die Übersetzung bewahrt daher die umfassende, spannungsreiche Statusumkehr, ohne sie dogmatisch oder sozialgeschichtlich zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller biblischer Bildsprache. Die parallelen Bewegungen werden durch „immer höher“ und „immer tiefer“ hörbar gemacht; das generische Singularpronomen des hebräischen Textes bleibt erhalten.
