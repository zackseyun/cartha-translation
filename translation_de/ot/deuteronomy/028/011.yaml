  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: de
  text: 'Und Jahwe wird dir reichlich Gutes zuteilwerden lassen[a]: an der Frucht deines Leibes[b], an der Frucht deines Viehs und an der Frucht deines Ackerbodens[c] – in dem Land, das Jahwe deinen Vätern geschworen hat, dir zu geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »zum Guten«; sinngemäß: »zum Wohlergehen« oder »im Überfluss«.'
    reason: lexical_alternative
  - marker: b
    text: Eine hebräische Bildrede für Kinder oder Nachkommen.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »den Ertrag deines Bodens« oder »die Erzeugnisse deines Landes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ לְטוֹבָה
  choice: wird dir reichlich Gutes geben
  rationale: Die Hifil-Form von יתר bezeichnet das Verleihen von Überfluss; לְטוֹבָה bestimmt diesen als etwas Gutes beziehungsweise Wohlergehen. Die Formulierung gibt den kausativen Sinn in natürlichem Deutsch wieder, ohne die Wendung ausschließlich auf materiellen Wohlstand einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּפְרִי בִטְנְךָ
  choice: die Frucht deines Leibes
  rationale: Die hebräische Wendung bezeichnet Kinder beziehungsweise Nachkommen. Ihre bildhafte Form bleibt erhalten und führt zugleich die dreifache Wiederholung von »Frucht« fort.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: die Frucht deines Viehs
  rationale: »Vieh« ist ein natürlicher deutscher Sammelbegriff für die Nutztiere; »Frucht« bewahrt die Parallelstruktur des Hebräischen.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: die Frucht deines Ackerbodens
  rationale: אֲדָמָה bezeichnet hier den bebauten Erdboden. »Ackerboden« macht den landwirtschaftlichen Bezug deutlich und erhält das Bild der Frucht.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: Hier bezeichnet אֲדָמָה das verheißene Land als den Ort des Segens. Im Deutschen ist »in dem Land« in diesem Zusammenhang natürlicher als »auf dem Land«.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: das Jahwe deinen Vätern geschworen hat, dir zu geben
  rationale: Die Formulierung bewahrt sowohl den an die Väter gerichteten Schwur als auch den gegenwärtigen Adressaten als Empfänger des Landes.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bildhafte oder deutende Wiedergabe von »Frucht deines Leibes«
  choice: Das Bild »Frucht deines Leibes« bleibt im Haupttext erhalten.
  alternative: deine Kinder; deine Nachkommen
  rationale: Die Metapher ist im Deutschen verständlich und erhält die bewusste dreifache Verbindung von menschlicher, tierischer und landwirtschaftlicher Fruchtbarkeit.
- issue: Bedeutungsumfang von לְטוֹבָה
  choice: reichlich Gutes
  alternative: zum Guten; zum Wohlergehen; Wohlstand im Überfluss
  rationale: Die Wendung bezeichnet wohltuenden Überfluss, der sich anschließend konkret in Nachkommen, Vieh und Ertrag zeigt. »Gutes« wahrt den weiten Bedeutungsumfang und vermeidet eine Verengung auf finanziellen Wohlstand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von »Frucht« wurde als prägendes Stilmittel bewahrt. Der Gedankenstrich gliedert die Aufzählung von der Ortsangabe, ohne die syntaktische Beziehung zum verheißenen Land aufzulösen.
