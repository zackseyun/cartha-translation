source:
  edition: WLC
  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: de
  text: Dies sind die Worte des Bundes, den Jahwe Mose gebot, im Land Moab mit den Söhnen Israels zu schließen[a], zusätzlich zu dem Bund, den er am Horeb mit ihnen geschlossen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Wendung hier „einen Bund schneiden“; entsprechend später: „den Bund, den er mit ihnen geschnitten hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Dies sind die Worte des Bundes
  rationale: Die deiktische Einleitung und die Constructus-Verbindung werden eng am Hebräischen wiedergegeben; „Worte“ kann hier zugleich den Inhalt beziehungsweise die Bestimmungen des Bundes bezeichnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִוָּה ... לִכְרֹת
  choice: gebot ... zu schließen
  rationale: צוה bezeichnet ein verbindliches Gebot. Für die hebräische Wendung „einen Bund schneiden“ ist „einen Bund schließen“ die natürliche deutsche Entsprechung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die konkrete Form des hebräischen Kollektivausdrucks, der hier das Bundesvolk bezeichnet.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: im Land Moab
  rationale: Die volle geografische Formulierung des Ausgangstextes bleibt erhalten.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Präposition unterscheidet den Bund in Moab vom Bund am Horeb und stellt ihn zugleich neben diesen; „zusätzlich zu“ gibt diese Beziehung klar wieder.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: „Am Horeb“ ist für das mit diesem Ort verbundene Bundesereignis idiomatisches Deutsch; der Name Horeb wird nicht mit Sinai harmonisiert.
theological_decisions:
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: mit den Söhnen Israels
  alternative: mit den Israeliten / mit dem Volk Israel
  rationale: „Söhne Israels“ erhält die Form des Ausgangstextes, obwohl der Ausdruck kollektiv das gesamte Bundesvolk meint.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Namenscharakter statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Pronomens in אֲשֶׁר כָּרַת אִתָּם
  choice: den er am Horeb mit ihnen geschlossen hatte
  alternative: den Jahwe am Horeb mit ihnen geschlossen hatte
  rationale: Das Pronomen „er“ bewahrt die Ausdrucksweise des Hebräischen; im Zusammenhang bezieht es sich natürlich auf Jahwe, ohne den Namen erläuternd zu wiederholen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, ist aber durch die Stellung der Infinitivgruppe natürlich lesbar. Der Ausdruck „Söhne Israels“ ist bewusst quellennah und wirkt daher etwas feierlicher als „Israeliten“.
