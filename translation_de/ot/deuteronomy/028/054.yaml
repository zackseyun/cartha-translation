translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Spannung zwischen dem zuvor zarten, verwöhnten Mann und seinem missgünstigen Verhalten bleibt erhalten. Der Satzbau führt die drei engsten Familienbeziehungen gemeinsam zum Prädikat; die Fußnoten erklären die beiden markanten hebräischen Bilder.
