base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: de
  text: Der Mann unter euch, der zart und sehr verwöhnt ist, wird seinen Bruder, seine Frau, die ihm so nahe ist[b], und die übrigen Kinder, die ihm noch geblieben sind, mit missgünstigem Blick ansehen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sein Auge wird böse sein gegen …“ Die hebräische Redewendung drückt hier Missgunst, Feindseligkeit und die Weigerung aus, mit anderen zu teilen.'
    reason: hebräische Redewendung
  - marker: b
    text: 'Wörtlich: „die Frau seines Busens“, ein Bild für besonders enge eheliche Verbundenheit.'
    reason: Metapher
lexical_decisions:
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der maskuline Singular bezeichnet hier ausdrücklich einen Mann; der folgende Vers stellt ihm eine Frau gegenüber.
- source_word: הָרַךְ בְּךָ
  choice: unter euch, der zart ist
  rationale: רַךְ bezeichnet Weichheit beziehungsweise Zartheit; die Formulierung bewahrt den Kontrast zu seinem späteren Verhalten.
- source_word: וְהֶעָנֹג מְאֹד
  choice: und sehr verwöhnt
  rationale: עָנֹג beschreibt hier einen durch ein behagliches, geschütztes Leben empfindlich gewordenen Menschen. „Verwöhnt“ gibt diesen Zusammenhang im Deutschen natürlicher wieder als „fein“ oder „empfindlich“ allein.
- source_word: תֵּרַע עֵינוֹ בְּ
  choice: mit missgünstigem Blick ansehen
  rationale: Die hebräische Wendung lautet wörtlich, sein Auge werde gegen jemanden böse. Die gewählte Fassung bewahrt das Bild des Blickes und vermittelt zugleich Missgunst, Feindseligkeit und die im Zusammenhang gemeinte Weigerung zu teilen.
- source_word: בְאָחִיו
  choice: seinen Bruder
  rationale: אָח bezeichnet im gewöhnlichen Sinn den Bruder; eine Ausweitung auf Verwandte ist möglich, aber hier nicht ausdrücklich verlangt.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: seine innig vertraute Frau
  rationale: Wörtlich ist von der „Frau seines Busens“ die Rede. Die natürliche deutsche Wiedergabe vermittelt eheliche Nähe und Vertrautheit; das Körperbild wird in der Fußnote offengelegt.
- source_word: יֶתֶר בָּנָיו
  choice: die übrigen Kinder
  rationale: בָּנִים kann neben „Söhne“ auch Kinder beziehungsweise Nachkommen insgesamt bezeichnen. Im Zusammenhang ist die inklusive Wiedergabe sachgerecht.
- source_word: אֲשֶׁר יוֹתִיר
  choice: die ihm noch geblieben sind
  rationale: Das Verb bedeutet „übrig lassen“ oder „übrig bleiben lassen“; hier sind die Kinder gemeint, die ihm in der Not noch verblieben sind, ohne festzulegen, wodurch.
