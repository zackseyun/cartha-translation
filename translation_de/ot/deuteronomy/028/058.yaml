  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: de
  text: Wenn du nicht gewissenhaft darauf achtest, alle Worte dieses Gesetzes zu befolgen, die in diesem Buch[a] geschrieben stehen, und diesen herrlichen und furchtgebietenden Namen zu fürchten[b] — Jahwe[c], deinen Gott —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dieser Schriftrolle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „diesem herrlichen und furchtgebietenden Namen Ehrfurcht entgegenzubringen“. Das hebräische Verb umfasst sowohl Ehrfurcht als auch Furcht.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: gewissenhaft darauf achtest, … zu befolgen
  rationale: Die Verbindung von שׁמר mit dem Infinitiv עשׂה bezeichnet aufmerksames Bewahren mit dem Ziel tatsächlicher Ausführung. Die Formulierung gibt sowohl die Sorgfalt als auch den Gehorsam natürlich wieder.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: alle Worte dieses Gesetzes
  rationale: דִּבְרֵי wird als „Worte“ bewahrt; תּוֹרָה bezeichnet hier den schriftlich festgehaltenen Bundes- und Gesetzestext.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: die in diesem Buch geschrieben stehen
  rationale: Die Partizipialform bezeichnet die schriftliche Niederlegung. „Buch“ ist im heutigen Deutsch verständlich; die historisch mögliche Wiedergabe „Schriftrolle“ wird in einer Fußnote genannt.
- source_word: לְיִרְאָה
  choice: zu fürchten
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Folge. „Fürchten“ bewahrt die im hebräischen ירא enthaltene Spannung zwischen Ehrfurcht und Furcht.
- source_word: הַשֵּׁם הַנִּכְבָּד וְהַנּוֹרָא
  choice: diesen herrlichen und furchtgebietenden Namen
  rationale: נכבד bezeichnet Herrlichkeit und Ehre; נורא etwas Ehrfurcht und Furcht Einflößendes. „Furchtgebietend“ erhält diese stärkere Nuance besser als das inzwischen oft abgeschwächte „ehrfurchtgebietend“.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das Suffix der zweiten Person Singular erscheint unmittelbar in „deinen Gott“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Umschrift „Jahwe“ bewahrt den persönlichen Bundesnamen, während die traditionelle Ersatzlesung in der Fußnote vermerkt wird.
- issue: Bedeutung von ירא
  choice: fürchten
  alternative: verehren / Ehrfurcht haben
  rationale: Das Verb umfasst Ehrfurcht und tatsächliche Furcht. Die Hauptübersetzung vermeidet eine abschwächende Festlegung auf bloße Verehrung; die Bedeutungsbreite wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der als Bedingungssatz beginnende Vers bleibt wegen seiner Fortsetzung in Vers 59 syntaktisch offen und endet mit Komma. Die Stellung der Fußnoten folgt jeweils dem Ausdruck, den sie erläutern.
