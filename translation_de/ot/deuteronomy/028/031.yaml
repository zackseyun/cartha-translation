id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: de
  text: Dein Rind wird vor deinen Augen geschlachtet werden, doch du wirst nichts davon essen. Dein Esel wird dir vor deinen Augen geraubt werden[a] und nicht zu dir zurückkehren. Deine Herde wird deinen Feinden ausgeliefert werden, und niemand wird dich retten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gestohlen“. Das hebräische Wort bezeichnet widerrechtliches, oft gewaltsames Wegnehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und es gibt für dich keinen Retter“; auch: „keinen Befreier“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: dein Rind
  rationale: שׁוֹר bezeichnet ein einzelnes Rind, häufig ein Arbeitsrind. „Rind“ ist im modernen Deutschen natürlicher und weniger geschlechtsspezifisch als „Ochse“.
- source_word: טָבוּחַ
  choice: wird geschlachtet werden
  rationale: Das passive Partizip von טבח bezeichnet das Schlachten eines Tieres; im Fluchzusammenhang hat die hebräische Nominalkonstruktion Zukunftsbezug.
- source_word: לְעֵינֶיךָ
  choice: vor deinen Augen
  rationale: Die geläufige deutsche Wendung bewahrt die Aussage, dass dies offen in der Gegenwart des Betroffenen geschieht.
- source_word: מִמֶּנּוּ
  choice: nichts davon
  rationale: Wörtlich „von ihm/davon“; zusammen mit der Verneinung gibt „nichts davon essen“ den Sinn im Deutschen idiomatisch wieder.
- source_word: חֲמֹרְךָ
  choice: dein Esel
  rationale: Direkte und gegenwärtige deutsche Entsprechung für חֲמוֹר.
- source_word: גָּזוּל
  choice: geraubt
  rationale: Das passive Partizip von גזל bezeichnet gewaltsames oder widerrechtliches Wegnehmen. „Geraubt“ wahrt den stärkeren Sinn gegenüber dem möglicherweise heimlichen „gestohlen“.
- source_word: מִלְּפָנֶיךָ
  choice: dir vor deinen Augen
  rationale: Die Formulierung bedeutet wörtlich eine Wegnahme „von vor deinem Angesicht“. Die deutsche Wiedergabe verbindet Entzug und unmittelbares Miterleben natürlich miteinander.
- source_word: יָשׁוּב לָךְ
  choice: nicht zu dir zurückkehren
  rationale: Bewahrt die aktive Form des hebräischen Verbs שוב und lässt offen, auf welche Weise eine Rückgabe oder Rückkehr ausbleibt.
- source_word: צֹאנְךָ
  choice: deine Herde
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, insbesondere Schafe und Ziegen. „Herde“ vermeidet eine ungerechtfertigte Beschränkung auf Schafe.
- source_word: נְתֻנוֹת
  choice: wird ... ausgeliefert werden
  rationale: Das passive Partizip von נתן heißt grundsätzlich „gegeben“. Im Zusammenhang mit feindlichem Besitzverlust bringt „ausgeliefert“ die ominöse Übergabe natürlich zum Ausdruck, ohne den Empfänger zu verändern.
- source_word: לְאֹיְבֶיךָ
  choice: deinen Feinden
  rationale: Direkte Standardentsprechung für אֹיֵב im Kontext der Bundesflüche.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: und niemand wird dich retten
  rationale: מוֹשִׁיעַ bezeichnet eine rettende oder befreiende Person. Die Formulierung ist natürliches modernes Deutsch und bewahrt den persönlichen Charakter der ausbleibenden Hilfe.
theological_decisions:
- issue: Bedeutungsweite der abschließenden Rettungsaussage
  choice: niemand wird dich retten
  alternative: du wirst keinen Retter haben / es wird für dich keinen Befreier geben
  rationale: Die Wurzel ישׁע trägt echte Rettungs- und Befreiungssprache. Hier bezeichnet sie im Kontext der Flüche konkrete Rettung aus gewaltsamem Verlust, ohne dass deshalb die lexikalische Verbindung zur umfassenderen Rettungssprache abgeschwächt werden sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die parallelen Zukunftsaussagen des Fluchabschnitts bleiben erkennbar; die Wiederholung „vor deinen Augen“ gibt sowohl לְעֵינֶיךָ als auch das anschauliche מִלְּפָנֶיךָ wieder. Sämtliche Fußnotenmarker stehen im Haupttext.
