source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: de
  text: Und ihr werdet nur noch wenige übrig bleiben[a], obwohl ihr so zahlreich geworden wart wie die Sterne am Himmel[b], weil du nicht auf die Stimme Jahwes, deines Gottes, gehört hast.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung bedeutet: „wenige an Zahl“; gemeint ist, dass nur sehr wenige übrig bleiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „während ihr so zahlreich gewesen wart wie die Sterne am Himmel“.'
    reason: alternative_reading
  - marker: c
    text: '„Auf die Stimme … hören“ kann in dieser Bundesformel zugleich bedeuten: „… gehorchen“. Der hebräische Text wechselt hier von der Mehrzahl („ihr“) zur kollektiven Einzahl („du“) und spricht Israel als Einheit an.'
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: ihr werdet nur noch … sein
  rationale: Der Nifal von שׁאר bezeichnet das Übrigbleiben nach Verlust oder Gericht. Die deutsche Wendung gibt den resultativen Sinn natürlich wieder.
- source_word: בִּמְתֵי מְעָט
  choice: nur noch wenige
  rationale: Die idiomatische Verbindung bedeutet, dass nur eine geringe Zahl von Menschen übrig ist; sie ist nicht auf Männer beschränkt.
- source_word: תַּחַת אֲשֶׁר
  choice: obwohl
  rationale: Die Wendung stellt hier den kommenden zahlenmäßigen Rückgang dem früher erreichten großen Umfang gegenüber. „Obwohl“ gibt diesen Kontrast im Deutschen klar wieder.
- source_word: הֱיִיתֶם
  choice: geworden wart
  rationale: Die Vorvergangenheit markiert den bereits erreichten Zustand der Vermehrung vor der angekündigten Verminderung.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: so zahlreich … wie die Sterne am Himmel
  rationale: Die Formulierung bewahrt den Vergleich und gibt לָרֹב idiomatisch als große Anzahl wieder.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: weil du nicht auf die Stimme … gehört hast
  rationale: שׁמע בקול kann Gehorchen bedeuten; die wörtlichkeitsnahe deutsche Wendung bewahrt sowohl das Bild des Hörens als auch den Zusammenhang des Gehorsams.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die singularische Form folgt dem Wechsel zur kollektiven Einzahl in der Anrede Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ wahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wechsel von der Mehrzahl zur kollektiven Einzahl
  choice: „ihr werdet …“ und anschließend „weil du … gehört hast“
  alternative: Durchgängig pluralisch formulieren
  rationale: Der Numeruswechsel steht ausdrücklich im Hebräischen und entspricht der in Deuteronomium häufigen Anrede Israels als Gemeinschaft und als kollektive Einheit. Er wird daher nicht eingeebnet.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: „auf die Stimme … gehört“
  alternative: „… gehorcht“
  rationale: Die gewählte Formulierung lässt die Bundesformel und ihr zugleich enthaltenes Moment des Gehorsams erkennen, ohne den Ausdruck auf nur eine Bedeutungsnuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bewahrt den auffälligen Wechsel von pluralischer zu singularischer Anrede. „Nur noch wenige“ ist idiomatisch und macht den Gerichtskontext des Übrigbleibens deutlich; „Stimme“ erhält die deuteronomische Bundesformel.
