base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: de
  text: Deine Söhne und Töchter werden einem anderen Volk gegeben. Deine Augen werden es mitansehen und den ganzen Tag nach ihnen schmachten; doch deine Hand wird machtlos sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch du wirst nichts dagegen tun können.“ Wörtlich spricht das Hebräische davon, dass in deiner Hand keine Macht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Deine Söhne und Töchter
  rationale: Das Hebräische nennt Söhne und Töchter ausdrücklich; die Wiedergabe bewahrt diese konkrete Zweigliedrigkeit.
- source_word: נְתֻנִים
  choice: werden … gegeben werden
  rationale: Das passive Partizip beschreibt im Zusammenhang der Fluchankündigung ein zukünftiges Geschehen. „Gegeben“ bleibt näher am Hebräischen als das deutendere „ausgeliefert“.
- source_word: לְעַם אַחֵר
  choice: einem anderen Volk
  rationale: עַם bedeutet hier „Volk“, und אַחֵר wird ohne zusätzliche Deutung als „anderes“ wiedergegeben.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: Deine Augen werden es mitansehen
  rationale: Die Formulierung erhält das anschauliche Bild der hilflos zuschauenden Eltern und klingt zugleich natürlich im modernen Deutschen.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: und sich … in Sehnsucht nach ihnen verzehren
  rationale: כלה bezeichnet hier das Schwinden oder Aufgeriebenwerden; mit der auf die Kinder gerichteten Präposition liegt sehnsüchtiges Sichverzehren nahe.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies gibt die anhaltende Dauer idiomatisch und genau wieder.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: doch deine Hand wird machtlos sein
  rationale: Die hebräische Wendung bezeichnet fehlende Macht oder Handlungsfähigkeit. Die Wiedergabe bewahrt das Bild der Hand, ohne fälschlich einen Bezug auf Gott nahezulegen.
theological_decisions:
- issue: Deutung der Wendung וְאֵין לְאֵל יָדֶךָ
  choice: doch deine Hand wird machtlos sein
  alternative: doch du wirst nichts dagegen tun können
  rationale: Die Wendung ist eine Aussage über völlige Handlungsunfähigkeit, nicht über eine Gottheit. Das Bild der machtlosen Hand bewahrt die Ausdrucksweise des Ausgangstextes; die Fußnote nennt die rein idiomatische Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das eindringliche Bild der sehenden und sich verzehrenden Augen sowie der machtlosen Hand bleibt erhalten; unnötig altertümliche oder konfessionell geprägte Sprache wird vermieden.
