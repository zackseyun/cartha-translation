  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: de
  text: Und du wirst die Frucht deines Leibes essen[a], das Fleisch deiner Söhne und Töchter, die Yahweh, dein Gott, dir gegeben hat, während der Belagerung und in der Bedrängnis[b], mit der dein Feind dich bedrängen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Frucht deines Bauches“; gemeint sind die eigenen Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Not“ beziehungsweise „in der Enge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Und du wirst … essen
  rationale: Das Qal Perfekt mit vorangestelltem Waw hat im Zusammenhang der Fluchankündigung futurisch-vorhersagende Bedeutung.
- source_word: פְרִי בִטְנְךָ
  choice: die Frucht deines Leibes
  rationale: Bewahrt das hebräische Bild für die eigenen Nachkommen; „Leib“ ist im Deutschen idiomatischer und weniger geschlechtsspezifisch missverständlich als „Mutterleib“, da ein Mann angeredet wird.
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: das Fleisch deiner Söhne und Töchter
  rationale: Die erschütternde konkrete Aussage über menschliches Fleisch und die ausdrückliche Nennung beider Geschlechter bleiben erhalten.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: die Yahweh, dein Gott, dir gegeben hat
  rationale: Der Relativsatz bewahrt den scharfen Kontrast zwischen den von Gott geschenkten Kindern und dem angekündigten Gericht.
- source_word: בְּמָצוֹר
  choice: während der Belagerung
  rationale: Gibt die Situation einer feindlichen Einschließung in natürlichem modernem Deutsch wieder.
- source_word: וּבְמָצוֹק
  choice: und in der Bedrängnis
  rationale: Der Ausdruck bezeichnet die schwere Enge und Not der Belagerung, ohne die Bedeutung unnötig auf rein seelische Angst einzuengen.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: mit der dein Feind dich bedrängen wird
  rationale: Die Hiphil-Form von צוק bezeichnet das feindliche In-die-Enge-Treiben; die Wortverwandtschaft mit „Bedrängnis“ bildet den Zusammenhang knapp ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der persönliche Bundesname steht ausdrücklich im hebräischen Text; „Yahweh“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Gottes Gabe und der angekündigten Fluchfolge
  choice: Der Relativsatz „die Yahweh, dein Gott, dir gegeben hat“ bleibt ausdrücklich erhalten.
  alternative: Verkürzung zu „deine Kinder“
  rationale: Der Text hält die theologische Spannung zwischen Gottes guter Gabe und der entsetzlichen Folge des Bundesfluchs bewusst fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst schonungsloser Bildsprache entsprechend dem hebräischen Fluchwort. Die maskuline Singularanrede des Ausgangstextes bleibt durch „du/dein“ erhalten.
