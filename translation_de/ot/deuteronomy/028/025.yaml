  naturalness: Der Text ist insgesamt modernes Standarddeutsch. „Schreckensbild“ ist jedoch keine natürliche, hier überzeugende Bezeichnung für זַעֲוָה und klingt stärker nach einem bildlichen oder visuellen Objekt. „Zum Entsetzen werden“ ist idiomatisch und bewahrt den Sinn eines erschreckenden Gegenstands beziehungsweise Anlasses.
