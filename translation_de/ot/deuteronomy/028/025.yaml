- from: Jahwe wird dich deinen Feinden zur Niederlage preisgeben. Auf einem Weg wirst du gegen sie ausziehen, doch auf sieben Wegen wirst du vor ihnen fliehen. Du wirst für alle Königreiche der Erde zum Schreckensbild werden.[a]
  to: Jahwe wird dich deinen Feinden als Besiegten ausliefern. Auf einem Weg wirst du gegen sie ausziehen, doch auf sieben Wegen wirst du vor ihnen fliehen. Du wirst allen Königreichen der Erde zum Entsetzen werden.[a]
  rationale: Die Überarbeitung präzisiert die prädikative Aussage über die militärische Niederlage, ersetzt das unnatürliche und semantisch einengende „Schreckensbild“ und glättet die deutsche Kasusverbindung. Die bildhafte Gegenüberstellung von einem Weg und sieben Wegen sowie die kollektive Referenz auf die Feinde bleiben erhalten.
