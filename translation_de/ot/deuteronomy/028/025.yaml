base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: de
  text: Jahwe wird dich deinen Feinden als Besiegten ausliefern. Auf einem Weg wirst du gegen sie ausziehen, doch auf sieben Wegen wirst du vor ihnen fliehen. Du wirst allen Königreichen der Erde zum Entsetzen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu einem Gegenstand des Entsetzens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ ... נִגָּף
  choice: wird dich ... zur Niederlage preisgeben
  rationale: Die Verbindung von נתן mit dem resultativen נִגָּף bezeichnet hier, dass Jahwe Israel der militärischen Niederlage ausliefert. „Preisgeben“ gibt den Übergabecharakter wieder, ohne das Ergebnis lediglich mit „besiegen lassen“ zu umschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: deinen Feinden
  rationale: Im Zusammenhang mit נִגָּף bezeichnet die Wendung die Niederlage angesichts beziehungsweise durch die Feinde; die natürliche deutsche Formulierung vermeidet ein missverständliches räumliches „vor“.
- source_word: בְּדֶרֶךְ אֶחָד ... וּבְשִׁבְעָה דְרָכִים
  choice: auf einem Weg ... auf sieben Wegen
  rationale: Die konkrete Wegmetapher und der Gegensatz zwischen geschlossenem Auszug und völliger Zerstreuung bleiben erhalten.
- source_word: תֵּצֵא אֵלָיו
  choice: wirst du gegen sie ausziehen
  rationale: יצא אל hat hier militärischen Sinn. Das hebräische Singularsuffix nimmt die Feinde kollektiv auf; im Deutschen ist der pluralische Rückbezug klarer und bewahrt denselben Referenten.
- source_word: תָּנוּס לְפָנָיו
  choice: wirst du vor ihnen fliehen
  rationale: Die Wendung beschreibt die Flucht vor dem siegreichen Feind. Der Plural entspricht im Deutschen dem vorausgehenden „Feinden“.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: Du wirst ... zum Schreckensbild werden
  rationale: זַעֲוָה kann Schrecken, Entsetzen oder etwas Entsetzliches bezeichnen. „Schreckensbild“ wahrt, dass Israel selbst den Königreichen zum erschreckenden Anschauungszeichen wird.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: für alle Königreiche der Erde
  rationale: Die Wendung hat hier einen umfassenden internationalen Bezug; „Erde“ ist daher angemessener als die Einschränkung auf das Land Israel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְזַעֲוָה im Bundesfluch
  choice: zum Schreckensbild
  alternative: zum Entsetzen / zum Gegenstand des Entsetzens
  rationale: Die Übersetzung lässt offen, ob das Wort stärker den hervorgerufenen Schrecken oder Israel als entsetzliches Anschauungsobjekt betont, und macht die öffentliche Wirkung auf die Königreiche deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bildsprache „auf einem Weg … auf sieben Wegen“ wurde bewusst erhalten. Die Anrede bleibt entsprechend dem Hebräischen im kollektiven Singular („du“).
