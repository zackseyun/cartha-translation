  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die zentralen Metaphern zuverlässig wieder: Jahwe setzt das angesprochene Israel „zum Kopf“ und nicht „zum Schwanz“; „oben/unten“ bewahrt die parallele Statusmetapher. כִּי ist im Segenskontext angemessen als Bedingung mit „wenn“ wiedergegeben. „Auf die Gebote … hören“ wahrt den Wortlaut von שמע אל, während „sie zu halten und zu tun“ den im Text explizierten Gehorsamsaspekt ausdrückt.'
