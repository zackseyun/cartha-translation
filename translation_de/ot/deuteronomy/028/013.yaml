  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: de
  text: Und Jahwe wird dich zum Kopf machen und nicht zum Schwanz; du wirst nur oben sein und nicht unten, wenn du auf die Gebote Jahwes, deines Gottes, hörst[a], die ich dir heute gebiete, sie zu halten und zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Geboten Jahwes, deines Gottes, gehorchst“. Wörtlich steht im Hebräischen „auf … hörst“; im Zusammenhang des Bundes schließt dies gehorsames Befolgen ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Und Jahwe wird dich … machen
  rationale: נתן bedeutet wörtlich „geben, setzen, stellen“; mit den prädikativen Ergänzungen „zum Kopf“ und „zum Schwanz“ bezeichnet es hier das Versetzen in einen bestimmten Rang. „Machen“ gibt diese kausative Bedeutung im Deutschen natürlich wieder.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: zum Kopf … und nicht zum Schwanz
  rationale: Die konkrete Gegenüberstellung von Kopf und Schwanz ist eine Statusmetapher für Vorrang beziehungsweise Nachrang. Sie wird bewahrt und nicht durch eine erklärende Rangbezeichnung ersetzt.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: du wirst nur oben sein und nicht unten
  rationale: „Oben“ und „unten“ bilden im Deutschen ein klares Gegensatzpaar und erhalten die räumliche Statusmetapher. „Nur“ gibt die ausschließende Betonung von רַק wieder.
- source_word: כִּי תִשְׁמַע אֶל
  choice: wenn du auf … hörst
  rationale: כִּי führt im Zusammenhang der Segensverheißungen die Bedingung ein. שׁמע אל heißt wörtlich „auf … hören“, schließt im Bundeskontext jedoch gehorsames Befolgen ein; die konkreten Infinitive am Versende verdeutlichen diesen Sinn.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: מִצְוֺת bezeichnet die verbindlichen Bundesgebote; „Gebote“ ist die geläufige und angemessen gewichtige deutsche Wiedergabe.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwes, deines Gottes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֶיךָ bleibt als appositionale Bundesbezeichnung „deines Gottes“ erhalten.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Das Partizip bezeichnet Moses gegenwärtiges Gebieten. Das idiomatische deutsche Präsens und „heute“ bewahren die Unmittelbarkeit der Bundesrede.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: sie zu halten und zu tun
  rationale: Beide Verben werden getrennt wiedergegeben, sodass sowohl sorgfältiges Bewahren als auch tatsächliches Ausführen zum Ausdruck kommen. „Sie“ nimmt die Gebote als sinngemäßes Objekt auf.
theological_decisions:
- issue: Funktion von כִּי als Einleitung der Bundesbedingung
  choice: wenn du auf die Gebote … hörst
  alternative: weil du auf die Gebote … hörst
  rationale: Im Kontext von Deuteronomium 28 formuliert כִּי die Bedingung, unter der der angekündigte Segen gilt. „Wenn“ bildet diese Bundeslogik ab, ohne eine über den Text hinausgehende Aussage über Verdienst oder Kausalität einzutragen.
- issue: Bedeutungsumfang von שׁמע אל
  choice: auf die Gebote … hörst
  alternative: den Geboten … gehorchst
  rationale: Die wörtliche Hörmetapher wird bewahrt, während die Fußnote den im Bundeskontext enthaltenen Gehorsamsaspekt nennt. So wird weder der lexikalische Ausdruck eingeebnet noch der verpflichtende Sinn verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Gegensatzpaare „Kopf/Schwanz“ und „oben/unten“ sowie die deuteronomische Doppelwendung „halten und tun“ bleiben erhalten. Der Satzbau folgt der hebräischen Gedankenfolge, ist aber durch Semikolon und natürliche deutsche Wortstellung gut lesbar.
