  - severity: low
    issue: »bis ... eingestürzt sind« ist gegenüber dem hebräischen Ausdruck für Herabkommen/Fallen stärker resultativ.
    rationale: »Bis ... fallen« bewahrt die offene, bildhafte Aussage des Infinitivs רֶדֶת unmittelbarer und klingt im Deutschen natürlich.
