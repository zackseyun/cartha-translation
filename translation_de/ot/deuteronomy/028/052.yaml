base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: de
  text: Er wird dich bei all deinen Toren belagern, bis deine hohen, befestigten Mauern, auf die du vertraust, in deinem ganzen Land fallen. Er wird dich bei all deinen Toren belagern, in dem ganzen Land, das Jahwe, dein Gott, dir gegeben hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: Er wird dich … belagern
  rationale: Der Hifil von צור bezeichnet hier angesichts von Toren und Mauern eine militärische Belagerung. Die zweimalige Wiederholung wird beibehalten.
- source_word: שְׁעָרֶיךָ
  choice: in allen deinen Städten
  rationale: Wörtlich »in all deinen Toren«. Im Belagerungskontext stehen die Tore metonymisch für die befestigten Städte; die Wiedergabe mit »Städten« ist im Deutschen eindeutig und natürlich.
- source_word: עַד רֶדֶת
  choice: bis … eingestürzt sind
  rationale: Wörtlich bezeichnet ירד ein Herabkommen. Bei Mauern meint die Wendung deren Fall beziehungsweise Einsturz; das deutsche Perfekt nach »bis« stellt das erreichte Ergebnis der Belagerung klar heraus.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: deine hohen, befestigten Mauern
  rationale: Beide Eigenschaften werden bewahrt; בָּצוּר bezeichnet hier den wehrhaft befestigten Zustand.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: auf die du vertraust
  rationale: בטח mit ב bezeichnet Vertrauen beziehungsweise Sichverlassen auf etwas. Bei Mauern ist »auf die« idiomatisches Deutsch.
- source_word: בְּכָל אַרְצֶךָ
  choice: in deinem ganzen Land
  rationale: Die Formulierung gibt den umfassenden räumlichen Geltungsbereich natürlich wieder.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: das Jahwe, dein Gott, dir gegeben hat
  rationale: Das Perfekt wird als vollendete Gabe mit fortbestehender Bedeutung wiedergegeben; der Gottesname wird direkt als »Jahwe« übertragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Eigenname Gottes wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt dessen Charakter als Eigenname und entspricht der üblichen modernen deutschen Transkription.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Belagerungssatzes und der Wechsel von »deinem ganzen Land« zu »dem ganzen Land« folgen der hebräischen Struktur. »Städte« gibt die metonymische Bedeutung von »Tore« im militärischen Zusammenhang verständlich wieder.
