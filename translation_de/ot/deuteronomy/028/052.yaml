revisions:
- from: Er wird dich in allen deinen Städten belagern, bis deine hohen, befestigten Mauern, auf die du vertraust, in deinem ganzen Land eingestürzt sind. Er wird dich in allen deinen Städten belagern, in dem ganzen Land, das Jahwe, dein Gott, dir gegeben hat.
  to: Er wird dich bei all deinen Toren belagern, bis deine hohen, befestigten Mauern, auf die du vertraust, in deinem ganzen Land fallen. Er wird dich bei all deinen Toren belagern, in dem ganzen Land, das Jahwe, dein Gott, dir gegeben hat.
  rationale: Die Revision bewahrt die zweimalige Nennung der Tore und damit die konkrete militärische Bildsprache des Hebräischen. »Bei all deinen Toren« ist im Deutschen idiomatisch genug, ohne die metonymische Deutung als Städte in den Text hineinzutragen. »Fallen« gibt רֶדֶת knapp und ohne zusätzliche Ergebnisnuance wieder. Weitere Fußnoten sind nicht erforderlich, da keine textkritische oder semantisch unauflösbare Mehrdeutigkeit entsteht.
