lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: alle deine Bäume
  rationale: כָּל bezeichnet hier die Gesamtheit; עֵץ hat im landwirtschaftlichen Zusammenhang kollektiven beziehungsweise pluralischen Sinn.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: und die Früchte deines Ackers
  rationale: פְּרִי kann Frucht oder Ertrag bezeichnen, אַדָמָה den bebauten Erdboden. Die Formulierung bewahrt das konkrete landwirtschaftliche Bild und klingt im Deutschen natürlich.
- source_word: יְיָרֵשׁ
  choice: wird … in Besitz nehmen
  rationale: Das Verb ירשׁ bedeutet grundlegend Besitz ergreifen beziehungsweise verdrängen. Die Wendung erhält dieses starke Bild, statt die im Zusammenhang naheliegende Vernichtung lediglich mit „fressen“ wiederzugeben.
- source_word: הַצְּלָצַל
  choice: die Zikade
  rationale: Die genaue zoologische Bestimmung des seltenen hebräischen Insektennamens ist unsicher. „Zikade“ gibt ein summendes beziehungsweise schwirrendes Schadinsekt spezifisch wieder; die Unsicherheit wird in einer Fußnote offengelegt.
