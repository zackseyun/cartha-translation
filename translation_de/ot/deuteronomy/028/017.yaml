lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht werden ... sein
  rationale: Das passive Partizip bildet eine verblosen Fluchformel. Die deutsche Futurform gibt im Zusammenhang der angekündigten Bundesflüche deren deklarativen Zukunftsbezug natürlich wieder.
- source_word: טַנְאֲךָ
  choice: dein Korb
  rationale: טֶנֶא bezeichnet einen Korb, häufig zum Sammeln oder Aufbewahren von Erzeugnissen. „Korb“ bewahrt die vom Hebräischen offengelassene Breite.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: und deine Backschüssel
  rationale: מִשְׁאֶרֶת bezeichnet ein Gefäß, in dem Teig geknetet beziehungsweise zubereitet wurde. „Backschüssel“ ist im modernen Deutschen verständlich; „Teigschüssel“ ist eine mögliche präzisierende Alternative.
