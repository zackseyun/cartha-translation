  naturalness: „Verflucht werden dein Korb und deine Backschüssel sein“ ist zwar verständlich, aber wegen der geteilten Verbklammer und des futurischen „werden ... sein“ im modernen Standarddeutsch unnötig schwerfällig. „Verflucht seien ...“ ist knapp, würdevoll und natürlich im Fluchkontext.
