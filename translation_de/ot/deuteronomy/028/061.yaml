  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: de
  text: Auch jede Krankheit und jede Plage[a], die nicht im Buch dieses Gesetzes geschrieben steht, wird Jahwe über dich bringen, bis du vernichtet bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Heimsuchung“; das hebräische Wort kann einen Schlag, eine Plage oder ein anderes schweres Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die additive Funktion innerhalb der fortlaufenden Fluchankündigungen.
- source_word: כָּל חֳלִי
  choice: jede Krankheit
  rationale: חֳלִי bezeichnet allgemein Krankheit oder Leiden; „Krankheit“ ist klar, gegenwärtig und nicht unnötig fachsprachlich.
- source_word: וְכָל מַכָּה
  choice: und jede Plage
  rationale: מַכָּה kann einen Schlag, eine Wunde, eine Plage oder eine andere schwere Heimsuchung bezeichnen. „Plage“ passt zum Gerichtskontext, ohne den Ausdruck allein auf Krankheiten zu beschränken.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: die nicht … verzeichnet sind
  rationale: „Verzeichnet“ gibt das schriftliche Festhalten im genannten Buch natürlich wieder; der deutsche Plural bezieht die Relativkonstruktion verständlich auf Krankheiten und Plagen.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: im Buch dieses Gesetzes
  rationale: סֵפֶר bezeichnet hier das schriftliche Bundesdokument, und תּוֹרָה wird in diesem Kontext idiomatisch mit „Gesetz“ wiedergegeben.
- source_word: יַעְלֵם … עָלֶיךָ
  choice: wird … über dich bringen
  rationale: Der Hifil von עלה mit עַל bezeichnet hier das Herbeiführen dieser Übel über die angesprochene Person.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַד הִשָּׁמְדָךְ
  choice: bis du vernichtet bist
  rationale: Gibt den Endpunkt der angekündigten Gerichte direkt und ohne Abschwächung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt dessen Funktion als persönlicher Bundesname.
- issue: Reichweite des Relativsatzes
  choice: Bezug auf Krankheiten und Plagen
  alternative: Bezug nur auf die unmittelbar vorausgehende „Plage“
  rationale: Das wiederholte כָּל und der distributive Zusammenhang sprechen dafür, dass alle nicht im Gesetzesbuch verzeichneten Krankheiten und Plagen gemeint sind; die deutsche Pluralform macht diesen natürlichen Gesamtbezug deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hält die angekündigten Übel im Fokus; „vernichtet“ bewahrt die Härte der hebräischen Gerichtsankündigung.
