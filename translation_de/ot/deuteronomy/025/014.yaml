base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: de
  text: Du sollst in deinem Haus nicht zweierlei Efa-Maße[a] haben, ein großes und ein kleines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein altes hebräisches Hohlmaß für trockene Waren.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Du sollst … nicht … haben
  rationale: Die verneinte Imperfektform von היה mit לְךָ bezeichnet idiomatisch ein Besitzverbot. Die deutsche Formulierung bewahrt den rechtlichen Charakter und klingt natürlich.
- source_word: בְּבֵיתְךָ
  choice: in deinem Haus
  rationale: בַּיִת bezeichnet hier am ehesten das konkrete Haus als Aufbewahrungsort der Maße; „Haushalt“ wäre abstrakter.
- source_word: אֵיפָה וְאֵיפָה
  choice: zweierlei Efa-Maße
  rationale: Die Wiederholung bezeichnet zwei unterschiedliche Ausführungen desselben Hohlmaßes und steht parallel zu „zweierlei Gewichtssteine“ im vorherigen Vers. „Zweierlei“ gibt den Gedanken eines betrügerischen Doppelmaßes im Deutschen klar wieder, während „Efa“ die konkrete antike Einheit bewahrt.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: ein großes und ein kleines
  rationale: Die Adjektive beziehen sich auf die beiden Efa-Maße. Die knappe Gegenüberstellung bewahrt die Form und Aussage des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Rechtssprache. „Zweierlei Efa-Maße“ macht die im Hebräischen durch Wiederholung ausgedrückten unterschiedlichen Maßgefäße verständlich, ohne die antike Maßeinheit zu modernisieren.
