source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: de
  text: Und der Erstgeborene, den sie zur Welt bringt, soll den Namen seines verstorbenen Bruders fortführen[a], damit dessen Name nicht aus Israel ausgelöscht wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »soll auf dem Namen seines verstorbenen Bruders stehen«; gemeint ist, dass er dessen Linie, Stellung und Andenken in Israel fortführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: der Erstgeborene
  rationale: Die maskuline Form bezeichnet hier den erstgeborenen Sohn und bewahrt zugleich die rechtliche und familiäre Bedeutung des Ausdrucks.
- source_word: תֵּלֵד
  choice: den sie zur Welt bringt
  rationale: Die feminine Verbform bezieht sich auf die Witwe; die Wiedergabe ist im modernen Deutschen natürlich und lässt sie ausdrücklich als Subjekt erkennen.
- source_word: יָקוּם עַל שֵׁם
  choice: soll den Namen … fortführen
  rationale: Die Wendung bezeichnet in diesem Rechtszusammenhang die Fortführung von Linie, Stellung und Andenken des Verstorbenen, nicht notwendig die Vergabe desselben persönlichen Namens.
- source_word: אָחִיו הַמֵּת
  choice: seines verstorbenen Bruders
  rationale: Eine klare, würdevolle und im heutigen Standarddeutsch natürliche Wiedergabe.
- source_word: יִמָּחֶה
  choice: ausgelöscht wird
  rationale: Das Niphal von מחה bezeichnet hier das Getilgt- oder Ausgelöschtwerden eines Namens beziehungsweise Andenkens und bewahrt die rechtlich-biblische Bildsprache.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition מן bezeichnet die Entfernung aus dem Volk beziehungsweise der Gemeinschaft Israel.
theological_decisions:
- issue: Bedeutung der Leviratsformel יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: Der Erstgeborene führt Namen, Linie und gesellschaftlich-rechtliche Stellung des verstorbenen Bruders fort.
  alternative: Der Erstgeborene erhält buchstäblich den persönlichen Namen des verstorbenen Bruders.
  rationale: Die hebräische Wendung עַל שֵׁם hat in diesem Rechtskontext eine repräsentative und dynastische Bedeutung. Eine bloße Benennung mit demselben Eigennamen würde ihre soziale und erbrechtliche Tragweite zu stark verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche hebräische Rechtsformel wird im Haupttext verständlich wiedergegeben; die Fußnote bewahrt ihre wörtlichere Gestalt und die genuine Bedeutungsbreite.
