base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: de
  text: 'Wenn der Mann aber die Witwe seines Bruders nicht nehmen will, soll sie zum Tor, zu den Ältesten, hinaufgehen und sagen: »Mein Schwager weigert sich, den Namen seines Bruders in Israel fortbestehen zu lassen[a]. Er ist nicht bereit, mir gegenüber die Schwagerpflicht zu erfüllen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »seinem Bruder in Israel einen Namen aufrichten«. Gemeint ist, den Namen, die Familienlinie und die Stellung des Verstorbenen fortbestehen zu lassen.'
    reason: lexical_alternative
  - marker: b
    text: »Die Schwagerpflicht erfüllen« bezeichnet hier die Pflicht, die Witwe des verstorbenen Bruders zu heiraten und so dessen Familienlinie zu erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: nehmen will
  rationale: חפץ bezeichnet Wollen, Begehren oder Bereitwilligkeit. Im deutschen Rechtssatz gibt »nicht … will« die willentliche Ablehnung natürlich und präzise wieder.
- source_word: לָקַחַת
  choice: nehmen
  rationale: לקח bedeutet wörtlich »nehmen« und kann im ehelichen Zusammenhang das Heiraten bezeichnen. »Die Frau seines Bruders nehmen« bleibt nah am Hebräischen; der Kontext erläutert die rechtliche Bedeutung.
- source_word: יְבִמְתּוֹ
  choice: die Frau seines Bruders
  rationale: Der Ausdruck bezeichnet hier spezifisch die kinderlos verwitwete Frau des verstorbenen Bruders. »Frau seines Bruders« ist kontexttreu und vermeidet das im Deutschen mehrdeutige »Schwägerin«.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: soll sie zum Tor ... hinaufgehen
  rationale: Die Bewegungsrichtung »hinauf« und das Ziel »zum Tor« werden bewahrt. Das Tor ist der öffentliche Ort der Rechtsprechung.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Dies ist die geläufige und sachlich passende Bezeichnung für die anerkannten örtlichen Autoritäten.
- source_word: מֵאֵין
  choice: weigert sich
  rationale: Die Form drückt Verweigerung bzw. Ablehnung aus. »Weigert sich« passt zum förmlichen Rechtsvortrag der Frau.
- source_word: לְהָקִים ... שֵׁם
  choice: den Namen ... fortbestehen zu lassen
  rationale: Wörtlich steht »einen Namen aufrichten/erstehen lassen«. Gemeint ist, Namen, Familienlinie und Stellung des Verstorbenen in Israel zu erhalten. Die gewählte Fassung gibt den Sinn verständlich wieder, während die Fußnote die Bildlichkeit dokumentiert.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die einfache örtlich-gemeinschaftliche Angabe wird unmittelbar wiedergegeben.
- source_word: לֹא אָבָה
  choice: ist nicht bereit
  rationale: אבה bezeichnet Bereitschaft oder Einwilligung. Die Wiedergabe wahrt die zweite Willensaussage und variiert natürlich gegenüber »weigert sich«.
- source_word: יַבְּמִי
  choice: an mir die Schwagerpflicht zu erfüllen
  rationale: Das Verb יבם ist ein technischer Ausdruck für die Erfüllung der Leviratspflicht gegenüber der Witwe. »Schwagerpflicht erfüllen« ist knapp, verständlich und wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der Leviratsehe und ihrer Rechtsbegriffe
  choice: 'Im Haupttext klare verwandtschaftliche und rechtliche Sprache verwenden: »Frau seines Bruders«, »Schwager« und »Schwagerpflicht«.'
  alternative: Den Fachausdruck »Leviratsehe« verwenden oder יְבִמְתּוֹ allgemein als »Schwägerin« wiedergeben.
  rationale: Der Vers regelt eine konkrete Rechtspflicht. Die gewählte Wiedergabe macht die beteiligten Beziehungen verständlich, ohne eine konfessionelle Deutung einzutragen; die technische Bedeutung wird in einer Fußnote erklärt.
- issue: Hebräische Wendung »einen Namen aufrichten«
  choice: Den gemeinten Fortbestand des Namens im Haupttext ausdrücken und die wörtlichere Form in der Fußnote nennen.
  alternative: Im Haupttext wörtlich »seinem Bruder einen Namen aufrichten« schreiben.
  rationale: Die hebräische Wendung umfasst das Bewahren von Familienlinie, Erinnerung und sozialer Stellung. »Fortbestehen lassen« ist im heutigen Deutsch verständlich, ohne den Sinn auf bloße biologische Nachkommenschaft einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die direkte Rede bleibt förmlich, aber gut verständlich. Hebräische Wiederholungen zur Willensverweigerung werden durch »weigert sich« und »ist nicht bereit« erhalten; kulturell-technische Begriffe werden knapp im Haupttext und genauer in Fußnoten erklärt.
