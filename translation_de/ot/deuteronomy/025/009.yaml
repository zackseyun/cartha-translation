  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: de
  text: 'Dann soll die Witwe seines Bruders vor den Augen der Ältesten zu ihm treten, ihm den Sandal vom Fuß ziehen, ihm ins Gesicht spucken[a] und daraufhin sagen: »So soll man mit dem Mann verfahren, der das Haus seines Bruders nicht aufbauen will.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ihm ausspucken“. Die hebräische Wendung kann nach anderer Auffassung bedeuten, dass sie vor dem Mann auf den Boden spuckt und nicht unmittelbar in sein Gesicht.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus seines Bruders aufzubauen“ bedeutet hier, durch die Schwagerehe die Familie und Nachkommenschaft des verstorbenen Bruders fortzuführen.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: die Witwe seines Bruders
  rationale: Im Zusammenhang des Levirats bezeichnet das Wort nicht irgendeine Schwägerin, sondern die Witwe des verstorbenen Bruders. Die ausdrückliche Wiedergabe ist im modernen Deutsch eindeutig.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: vor den Augen der Ältesten
  rationale: Die nahezu wörtliche deutsche Wendung bewahrt den öffentlichen, von den Ältesten bezeugten Charakter der Handlung.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: ihm den Sandal vom Fuß ziehen
  rationale: חָלַץ bezeichnet hier das Abziehen eines Schuhs. Der Singular des Hebräischen bleibt erhalten; die Formulierung ist anschaulich und natürlich.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: ihm ins Gesicht spucken
  rationale: Dies gibt die naheliegende Bedeutung der hebräischen Präpositionalverbindung wieder und bewahrt den Charakter der Handlung als öffentliche Beschämung.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: und daraufhin sagen
  rationale: Die häufige hebräische Doppelformel wird in natürliches modernes Deutsch übertragen. „Daraufhin“ erhält den Gedanken einer Reaktion, ohne das schwerfällige „antworten und sagen“ nachzubilden.
- source_word: כָּכָה יֵעָשֶׂה לָאִישׁ
  choice: So soll man mit dem Mann verfahren
  rationale: Die unpersönliche deutsche Formulierung entspricht dem hebräischen Passiv und bewahrt den feierlich-rechtlichen Ton.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: der das Haus seines Bruders nicht aufbauen will
  rationale: „Das Haus aufbauen“ erhält das hebräische Bild für die Fortführung von Familie, Nachkommenschaft und Hausstand. „Nicht ... will“ bringt im Kontext die Weigerung zum Ausdruck.
theological_decisions:
- issue: Bedeutung von בְּפָנָיו im Beschämungsritual
  choice: ihm ins Gesicht spucken
  alternative: vor ihm beziehungsweise vor seinen Augen ausspucken
  rationale: Die Hauptfassung folgt der naheliegenden direkten Bedeutung. Da die Präposition auch räumlich als „vor“ verstanden worden ist, wird diese echte Auslegungsalternative in einer Fußnote offengelegt.
- issue: Bedeutung des Aufbaus des Bruderhauses
  choice: das Haus seines Bruders aufbauen
  alternative: die Familie beziehungsweise das Geschlecht seines Bruders fortführen
  rationale: Die Übersetzung bewahrt die konkrete Metapher des Ausgangstextes; eine Fußnote erklärt ihre rechtlich-familiäre Bedeutung, ohne sie im Haupttext durch eine Deutung zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-feierlichem Ton. Hebräische Metaphern werden erhalten, wo sie im Deutschen verständlich bleiben; schwerfällige semitische Doppelformeln werden idiomatisch wiedergegeben. Sämtliche Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
