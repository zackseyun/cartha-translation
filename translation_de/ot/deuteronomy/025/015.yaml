base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: de
  text: Du sollst ein volles und gerechtes Gewicht[a] haben und ein volles und gerechtes Efa-Maß[b], damit du lange in dem Land lebst, das Jahwe, dein Gott, dir gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stein“; gemeint ist ein im Handel verwendeter Gewichtsstein.'
    reason: lexikalische Alternative; die konkrete hebräische Bezeichnung wird erläutert, während der Text die im Deutschen idiomatische Bedeutung wiedergibt.
  - marker: b
    text: Ein Efa war ein antikes Hohlmaß für trockene Waren.
    reason: Erklärung einer antiken Maßeinheit.
lexical_decisions:
- source_word: אֶבֶן
  choice: Gewichtsstein
  rationale: Das Wort bedeutet wörtlich „Stein“, bezeichnet im Handelskontext aber einen als Gewicht verwendeten Stein. „Gewichtsstein“ bewahrt das konkrete Bild und macht die Funktion deutlich.
- source_word: שְׁלֵמָה וָצֶדֶק
  choice: vollständig und gerecht
  rationale: שְׁלֵמָה bezeichnet ein unverkürztes, vollständiges Maß; צֶדֶק betont dessen Rechtmäßigkeit und Fairness. Die parallele Wiedergabe erhält sowohl den sachlichen als auch den moralischen Aspekt.
- source_word: יִהְיֶה לָּךְ
  choice: du sollst … haben
  rationale: Die wörtliche Formulierung „soll für dich sein“ hat hier rechtlich verpflichtende Kraft. Die gewählte Fassung ist im modernen Deutschen klar und natürlich.
- source_word: אֵיפָה
  choice: Efa-Maß
  rationale: Das Efa war ein bestimmtes antikes Hohlmaß für trockene Waren. Die Umschrift wahrt die konkrete Maßeinheit; „-Maß“ erklärt unmittelbar ihre Funktion.
- source_word: לְמַעַן יַאֲרִיכוּ יָמֶיךָ
  choice: damit du lange … lebst
  rationale: Die hebräische Wendung lautet bildhaft „damit deine Tage lang werden“. Die deutsche idiomatische Wiedergabe vermittelt denselben Sinn und erhält die Zweck- beziehungsweise Folgeverknüpfung.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: אֲדָמָה bezeichnet hier das von Gott gegebene Land, nicht bloß den Erdboden. „In dem Land“ ist im Deutschen idiomatischer als eine formale Wiedergabe mit „auf“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das hebräische Partizip beschreibt Jahwes gegenwärtiges beziehungsweise feststehendes Geben. Das deutsche Präsens kann diese aspektuelle Offenheit natürlich ausdrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen; die deutsche Schreibweise entspricht der üblichen Umschrift von „Yahweh“.
- issue: Zusammenhang zwischen gerechtem Handel und langem Leben im Land
  choice: Zweck- beziehungsweise Folgesatz mit „damit“
  alternative: reine Verheißung ohne erkennbare Verknüpfung
  rationale: לְמַעַן verbindet das Gebot ausdrücklich mit langem Leben im gegebenen Land. Die Übersetzung lässt die im Text bestehende Bundestheologie stehen, ohne die genaue Logik von Zweck und Folge enger festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzparallelität des Hebräischen bleibt weitgehend erhalten; die idiomatische Wendung „lange leben“ vermeidet unnatürliches Deutsch, ohne den Sinn zu verändern.
