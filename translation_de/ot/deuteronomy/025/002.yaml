  - severity: low
    issue: »vor seinen Augen«
    rationale: לְפָנָיו bedeutet schlicht »vor ihm« bzw. »in seiner Gegenwart«. »Vor seinen Augen« wirkt stärker bildhaft und ist daher eine nicht erforderliche Zuspitzung.
  - severity: low
