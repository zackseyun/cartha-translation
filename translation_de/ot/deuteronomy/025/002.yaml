revisions:
- from: Wenn der Schuldige Schläge verdient, soll der Richter ihn hinlegen und vor seinen Augen schlagen lassen, und zwar mit einer seiner Schuld entsprechenden, abgezählten Zahl von Schlägen.[a]
  to: Wenn der Schuldige Schläge verdient, soll der Richter ihn niederlegen lassen und ihn vor sich schlagen lassen, entsprechend seiner Schuld, mit einer abgezählten Zahl von Schlägen.[a]
  rationale: Die Revision gibt den Hifil bei וְהִפִּילוֹ mit »niederlegen lassen« wieder und ersetzt die verstärkende Wendung »vor seinen Augen« durch das quellentreue und idiomatische »vor sich«. Die gezählte und der Schuld angemessene Zahl der Schläge bleibt ausdrücklich erhalten.
