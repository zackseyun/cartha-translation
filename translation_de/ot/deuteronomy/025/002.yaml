translation:
  language: de
  text: Wenn der Schuldige Schläge verdient, soll der Richter ihn niederlegen lassen und ihn vor sich schlagen lassen, entsprechend seiner Schuld, mit einer abgezählten Zahl von Schlägen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »entsprechend seiner Schuld, nach Zahl«. Gemeint ist eine gezählte Zahl von Schlägen, die dem Vergehen angemessen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: Schläge verdient
  rationale: Die wörtliche Wendung »ein Sohn des Schlagens« ist ein hebräisches Rechtsidiom für jemanden, der der Prügelstrafe schuldig beziehungsweise zu ihr verurteilt ist. »Schläge verdient« gibt diesen Sinn natürlich und knapp wieder.
- source_word: הָרָשָׁע
  choice: der Schuldige
  rationale: Das substantivierte Adjektiv bezeichnet hier im gerichtlichen Zusammenhang die schuldig gesprochene Partei. »Der Schuldige« bewahrt den rechtlichen Sinn, ohne die auch mögliche moralische Nuance »der Frevler« völlig auszuschließen.
- source_word: וְהִפִּילוֹ
  choice: soll … ihn hinlegen
  rationale: Der Hifil von נפל bedeutet hier, dass der Richter den Verurteilten zur Vollstreckung niederlegen lässt. Die knappe deutsche Form passt zum Verfahrenskontext.
- source_word: הַשֹּׁפֵט
  choice: der Richter
  rationale: Die übliche und sachlich genaue Bezeichnung für den genannten Amtsträger.
- source_word: וְהִכָּהוּ
  choice: schlagen lassen
  rationale: Die Form kann wörtlich »ihn schlagen« bedeuten; im Zusammenhang beaufsichtigt beziehungsweise veranlasst der Richter die Vollstreckung. »Schlagen lassen« gibt diese richterliche Rolle in natürlichem Deutsch wieder.
- source_word: לְפָנָיו
  choice: vor seinen Augen
  rationale: Die Wendung bedeutet wörtlich »vor ihm« und macht deutlich, dass die Strafe in Gegenwart und unter Aufsicht des Richters vollzogen wird.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: seiner Schuld entsprechend
  rationale: Die Formulierung drückt die Verhältnismäßigkeit von Vergehen und Strafe aus. »Schuld« passt zum gerichtlichen Kontext und erhält die rechtlich-moralische Bedeutung des hebräischen Wortes.
- source_word: בְּמִסְפָּר
  choice: mit einer … abgezählten Zahl von Schlägen
  rationale: Das knappe Hebräisch verlangt eine zahlenmäßig bestimmte Strafe. Die Ergänzung »von Schlägen« ist aus dem Kontext eindeutig und ergibt verständliches modernes Deutsch; die engere Alternative wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die idiomatische Formulierung vermeidet unnatürliche Hebraismen, bewahrt aber die richterliche Aufsicht, die Verhältnismäßigkeit der Strafe und die ausdrücklich begrenzte, gezählte Zahl der Schläge.
