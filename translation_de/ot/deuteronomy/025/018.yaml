base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: de
  text: wie er dir unterwegs begegnete und alle Nachzügler hinter dir angriff, als du müde und erschöpft warst; er fürchtete Gott nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: dir … begegnete
  rationale: Gibt die wahrscheinlichste Bedeutung des Verbs im Kontext natürlich wieder, ohne die im Hebräischen nicht ausdrücklich genannte Feindseligkeit bereits hier einzutragen.
- source_word: וַיְזַנֵּב בְּךָ
  choice: griff … die Nachzügler … an
  rationale: Das seltene Verb bezeichnet hier einen Angriff auf den hinteren Teil des Zuges. „Angriff“ bewahrt den Vorgang, ohne ausdrücklich zu behaupten, alle seien erschlagen worden.
- source_word: כָּל הַנֶּחֱשָׁלִים אַחֲרֶיךָ
  choice: alle Nachzügler hinter dir
  rationale: Bezeichnet diejenigen, die zurückgeblieben waren und am Ende des Zuges gingen; „Nachzügler“ ist prägnant und idiomatisch.
- source_word: עָיֵף וְיָגֵעַ
  choice: müde und erschöpft
  rationale: Bewahrt die verstärkende Doppelbeschreibung in natürlichem modernem Deutsch.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: er fürchtete Gott nicht
  rationale: Gibt die traditionelle und kontextuell naheliegende Bedeutung von Gottesfurcht direkt wieder.
theological_decisions:
- issue: Subjekt des fehlenden Gottesfürchtens
  choice: „er“ bezieht sich auf Amalek
  alternative: „du“ bezieht sich auf Israel
  rationale: Obwohl das unpunktierte Konsonantenbild theoretisch unterschiedlich aufgefasst werden könnte, weist die masoretische Lesung יָרֵא auf die dritte Person Singular und damit auf Amalek als Subjekt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzform bleibt als abhängiger Relativsatz an Vers 17 angeschlossen. Das kollektive „du“ Israels wird entsprechend dem hebräischen Singular beibehalten.
