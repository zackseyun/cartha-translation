translation_notes:
  register: Kurzer, würdevoller Rechtssatz in modernem Standarddeutsch. „Das Maul verbinden“ ist allgemein verständlich und vermeidet sowohl ein ungebräuchliches Fachverb als auch die gegenüber dem Hebräischen engere Festlegung auf „Ochse“.
