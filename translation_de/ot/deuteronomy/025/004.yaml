lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: Du sollst … nicht das Maul verbinden
  rationale: Die Verneinung mit der Präfixkonjugation formuliert hier ein Verbot. חסם bezeichnet das Verschließen beziehungsweise Einschränken des Mauls; „das Maul verbinden“ ist im Deutschen klarer und natürlicher als das seltene Verb „maulkorben“.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung und kann je nach Zusammenhang Ochse, Stier oder Rind meinen. „Rind“ bewahrt die fehlende ausdrückliche Angabe von Geschlecht oder Kastration besser als „Ochse“.
- source_word: בְּדִישׁוֹ
  choice: beim Dreschen
  rationale: Die Präposition ב mit דישׁ und dem Suffix der 3. Person Singular bezeichnet den Umstand beziehungsweise Zeitpunkt des Dreschens. „Beim Dreschen“ gibt dies knapp und idiomatisch wieder; der Bezug des Suffixes auf das Rind ergibt sich im Deutschen aus dem Satz.
