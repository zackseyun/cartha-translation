  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: de
  text: 'Denk daran, was Amalek dir unterwegs angetan hat, als ihr aus Ägypten auszogt:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Denk daran
  rationale: Der Qal-Imperativ im Singular fordert Israel unmittelbar zum Erinnern auf. „Denk daran“ ist modern, natürlich und bewahrt den verpflichtenden Charakter des Befehls.
- source_word: אֵת אֲשֶׁר
  choice: was
  rationale: Objektmarker und Relativpartikel führen den Inhalt des Erinnerns ein; im Deutschen ist „was“ die natürliche Entsprechung.
- source_word: עָשָׂה לְךָ
  choice: dir angetan hat
  rationale: Im feindseligen Zusammenhang bezeichnet עשה mit ל eine gegen Israel gerichtete Handlung. „Dir angetan hat“ bringt diese negative Bedeutung idiomatisch zum Ausdruck, ohne die im Kontext vorausgesetzte Tat vorwegzunehmen.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: בַּדֶּרֶךְ
  choice: unterwegs
  rationale: Die Wendung bezeichnet den Verlauf der Reise. „Unterwegs“ ist im modernen Deutschen knapper und natürlicher als „auf dem Weg“.
- source_word: בְּצֵאתְכֶם
  choice: als ihr … zogt
  rationale: Der Infinitivus constructus mit בְּ bezeichnet den zeitlichen Umstand. Die Pluralform wird mit „ihr“ bewahrt und steht wie im Hebräischen neben der singularischen Anrede im Hauptsatz.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: מִן bezeichnet den Ausgangspunkt; zusammen mit dem Verb des Ausziehens ist „aus Ägypten“ die natürliche deutsche Formulierung.
theological_decisions:
- issue: Wechsel zwischen singularischer und pluralischer Anrede Israels
  choice: „dir“ und „ihr“ werden entsprechend dem hebräischen Numeruswechsel beibehalten.
  alternative: 'Beide Anreden im Plural vereinheitlichen: „euch … ihr“.'
  rationale: Der Wechsel ist im Ausgangstext ausdrücklich vorhanden und stellt Israel zugleich als Einheit und als Gemeinschaft dar; er soll nicht stillschweigend geglättet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt bleibt erhalten, weil der folgende Vers erläutert, was Amalek tat.
