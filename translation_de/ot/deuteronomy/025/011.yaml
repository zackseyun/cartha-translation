base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: de
  text: Wenn ein Mann und sein Bruder[a] miteinander kämpfen und die Frau des einen herbeikommt, um ihren Mann aus der Hand dessen zu retten, der ihn schlägt[b], und sie ihre Hand ausstreckt und an seinen Geschlechtsteilen packt[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ kann hier auch einen Landsmann oder Mitmenschen bezeichnen, nicht unbedingt einen leiblichen Bruder.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „aus der Hand seines Angreifers“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort ist eine verhüllende Bezeichnung für die männlichen Schamteile.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet einen kasuistischen Rechtsfall ein; „wenn“ gibt die bedingte Aussage im Deutschen natürlich wieder.
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: Männer miteinander kämpfen
  rationale: Der Niphal bezeichnet hier einen körperlichen Kampf; אֲנָשִׁים meint in diesem Zusammenhang Männer, und יַחְדָּו beschreibt ihre wechselseitige Auseinandersetzung.
- source_word: אִישׁ וְאָחִיו
  choice: ein Mann und sein Bruder
  rationale: Bewahrt die konkrete hebräische Formulierung und ihre soziale beziehungsweise bundesgemeinschaftliche Färbung, ohne eine leibliche Verwandtschaft zwingend vorauszusetzen.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: und die Frau des einen herbeikommt
  rationale: Gibt die Annäherung und die Zugehörigkeit zu einem der beiden Männer knapp und verständlich wieder.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: um ihren Mann ... zu retten
  rationale: אִישָׁהּ bezeichnet im ehelichen Zusammenhang ihren Ehemann; „retten“ passt zur unmittelbaren körperlichen Gefahr.
- source_word: מִיַּד מַכֵּהוּ
  choice: aus der Hand dessen, der ihn schlägt
  rationale: Erhält das anschauliche Bild „aus der Hand“ und gibt das Partizip מַכֵּהוּ als fortdauernde Handlung wieder.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: und sie ihre Hand ausstreckt
  rationale: Entspricht der geläufigen hebräischen Wendung und klingt im modernen Deutschen natürlich.
- source_word: וְהֶחֱזִיקָה
  choice: packt
  rationale: Das Hiphil bezeichnet ein festes Ergreifen; „packt“ vermittelt die kraftvolle Handlung prägnant.
- source_word: בִּמְבֻשָׁיו
  choice: bei seinen Geschlechtsteilen
  rationale: Die seltene euphemistische Bezeichnung meint die männlichen Scham- beziehungsweise Geschlechtsteile; die Formulierung bleibt sachlich und eindeutig.
