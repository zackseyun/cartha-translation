source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: de
  text: 'Wenn es zwischen Männern[a] zu einem Rechtsstreit kommt und sie vor Gericht treten[b], sollen die Richter über sie urteilen: Sie sollen den, der im Recht ist, freisprechen und den Schuldigen verurteilen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wenn zwischen Männern ein Rechtsstreit besteht“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „zum Gericht“ oder „zum Urteil“; gemeint ist das gerichtliche Verfahren.'
    reason: lexical_alternative
  - marker: c
    text: '„Freisprechen“ und „verurteilen“ geben gerichtliche Begriffe wieder; wörtlich etwa: „den Gerechten für gerecht erklären und den Schuldigen für schuldig erklären“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Wenn es … zu … kommt
  rationale: Leitet einen kasuistischen Rechtsfall ein und gibt die bedingte Aussage im modernen Deutschen natürlich wieder.
- source_word: רִיב
  choice: Rechtsstreit
  rationale: Bezeichnet hier einen gerichtlich auszutragenden Streitfall; „Rechtsstreit“ macht den juristischen Zusammenhang deutlich.
- source_word: בֵּין אֲנָשִׁים
  choice: zwischen Männern
  rationale: Gibt den grammatisch maskulinen Plural und die männlichen Prozessparteien des hebräischen Textes genau wieder.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: und sie vor Gericht treten
  rationale: Die Wendung meint das Herantreten an das gerichtliche Verfahren; „vor Gericht treten“ ist idiomatisches modernes Deutsch.
- source_word: וּשְׁפָטוּם
  choice: sollen die Richter über sie urteilen
  rationale: Das hebräische Verb steht aktiv im Plural mit einem Objektpronomen. Der aus dem Zusammenhang erschlossene Bezug auf die Richter wird zur Klarheit ausdrücklich genannt.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: den, der im Recht ist, freisprechen
  rationale: Im gerichtlichen Kontext bedeutet die Hifil-Form, jemanden als im Recht stehend zu erklären. Die Formulierung wahrt sowohl den forensischen Sinn als auch den Bezug auf den konkreten Streitfall.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: den Schuldigen verurteilen
  rationale: Die Hifil-Form bezeichnet im Rechtskontext den Schuldspruch. „Den Schuldigen“ entspricht hier demjenigen, der im konkreten Fall im Unrecht ist.
theological_decisions:
- issue: Forensischer oder moralischer Sinn von צדק und רשע
  choice: 'Gerichtliche Feststellung: den im Recht Stehenden freisprechen und den Schuldigen verurteilen'
  alternative: Allgemeine moralische Bezeichnung als „den Gerechten“ und „den Gottlosen“
  rationale: Der unmittelbare Zusammenhang beschreibt ein Gerichtsverfahren. Daher bezeichnen die Wörter hier vorrangig die Rechtsstellung der Parteien im vorliegenden Fall, ohne eine umfassende Aussage über ihren moralischen Charakter zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer juristischer Sprache. Der Doppelpunkt bildet die Folge des Gerichtsverfahrens übersichtlich ab. Die Rollenbezeichnungen werden fallbezogen formuliert, um den forensischen Sinn zu bewahren.
