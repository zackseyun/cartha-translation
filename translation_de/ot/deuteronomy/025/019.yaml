  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: de
  text: Und wenn Jahwe, dein Gott, dir Ruhe vor all deinen Feinden ringsum verschafft, in dem Land, das Jahwe, dein Gott, dir als Erbbesitz gibt, damit du es in Besitz nimmst, dann sollst du das Andenken an Amalek[a] unter dem Himmel auslöschen. Vergiss es nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Erinnerung an Amalek; auch: das Gedächtnis an Amalek.'
    reason: זֵכֶר umfasst das Andenken beziehungsweise die Erinnerung und kann im Deutschen mit mehreren nah verwandten Ausdrücken wiedergegeben werden.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: Und wenn … Ruhe … verschafft hat
  rationale: Die Konstruktion leitet einen künftigen Zeitpunkt ein; der deutsche Temporalsatz gibt die zeitliche Funktion und den kausativen Sinn von נוח natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: vor all deinen Feinden ringsum
  rationale: „Vor … Ruhe verschaffen“ ist idiomatisches Deutsch und bewahrt sowohl die Gesamtheit als auch die räumliche Vorstellung.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: dir als Erbbesitz gibt
  rationale: „Erbbesitz“ erhält den bundesgeschichtlich wichtigen Sinn von נַחֲלָה und passt natürlich zum Partizip נֹתֵן.
- source_word: לְרִשְׁתָּהּ
  choice: damit du es in Besitz nimmst
  rationale: Die Form bezeichnet hier das Ergreifen beziehungsweise Antreten des Landes; der Finalsatz ist im Deutschen klar und natürlich.
- source_word: תִּמְחֶה
  choice: sollst du … auslöschen
  rationale: „Auslöschen“ bewahrt die starke Bildlichkeit von מחה und den verpflichtenden Charakter der Anweisung.
- source_word: זֵכֶר עֲמָלֵק
  choice: das Andenken an Amalek
  rationale: זֵכֶר kann Erinnerung, Andenken oder fortbestehendes Gedächtnis bezeichnen. „Andenken“ wahrt diese Breite im feierlich-gerichtlichen Zusammenhang.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die hebräische Wendung und ihr umfassendes räumliches Bild werden unmittelbar bewahrt.
- source_word: לֹא תִּשְׁכָּח
  choice: Vergiss es nicht!
  rationale: Der kurze eigenständige Verbotssatz erhält den nachdrücklichen Imperativcharakter des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Reichweite von זֵכֶר עֲמָלֵק
  choice: das Andenken an Amalek
  alternative: die Erinnerung an Amalek
  rationale: Die Übersetzung lässt offen, ob vor allem das erinnerte Gedächtnis, das fortbestehende Andenken oder beides gemeint ist, und präzisiert die konkrete Durchführung nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstruktur bleibt nahe am hebräischen Bedingungs- und Folgesatz, wird aber durch „dann“ und einen deutschen Finalsatz lesbar gegliedert. Der abschließende kurze Mahnsatz bleibt bewusst pointiert.
