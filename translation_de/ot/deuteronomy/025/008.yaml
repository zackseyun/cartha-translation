base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: de
  text: 'Dann sollen die Ältesten seiner Stadt ihn rufen und mit ihm reden. Bleibt er aber bei seiner Haltung und sagt: »Ich will sie nicht zur Frau nehmen«,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich habe kein Verlangen, sie zu nehmen.“ „Eine Frau nehmen“ ist eine geläufige hebräische Wendung für die Eheschließung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: sollen … ihn rufen
  rationale: Die Verbfolge hat im gesetzlichen Zusammenhang anweisenden Charakter. „Sollen … rufen“ gibt das Verfahren in natürlichem modernem Deutsch wieder.
- source_word: זִקְנֵי עִירוֹ
  choice: die Ältesten seiner Stadt
  rationale: Die Wendung bezeichnet die anerkannte örtliche Führung; „Stadt“ entspricht der üblichen Grundbedeutung von עִיר, das je nach Größe auch einen Ort meinen kann.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: mit ihm reden
  rationale: דבר mit אֶל bezeichnet an ihn gerichtetes Reden. Das deutsche „mit ihm reden“ ist in dieser vermittelnden Verfahrenssituation natürlich.
- source_word: וְעָמַד
  choice: Bleibt er aber bei seiner Haltung
  rationale: Wörtlich steht hier „und er steht“. Im Zusammenhang bezeichnet dies wahrscheinlich sein Beharren nach dem Gespräch mit den Ältesten; die Übersetzung macht den idiomatischen Sinn deutlich, ohne den folgenden Inhalt vorwegzunehmen.
- source_word: וְאָמַר
  choice: und sagt
  rationale: Das einfache Redeverb wird schlicht und gegenwartsbezogen innerhalb der gesetzlichen Fallschilderung wiedergegeben.
- source_word: לֹא חָפַצְתִּי
  choice: Ich will … nicht
  rationale: חפץ kann Wunsch, Begehren oder Willigkeit ausdrücken. „Ich will nicht“ ist hier natürlich und wahrt sowohl die persönliche Ablehnung als auch die fehlende Bereitschaft.
- source_word: לְקַחְתָּהּ
  choice: sie … zur Frau nehmen
  rationale: לקח mit einer Frau als Objekt ist eine geläufige Wendung für die Eheschließung. „Zur Frau nehmen“ bewahrt das Bild des Nehmens und macht zugleich den ehelichen Sinn eindeutig.
theological_decisions: []
translation_notes:
