  language: en
  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: de
  text: Du sollst in deinem Beutel nicht zweierlei Gewichtssteine[a] haben, einen großen und einen kleinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Stein und Stein«; gemeint sind Steine, die beim Handel als Gewichte verwendet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Du sollst … nicht … haben
  rationale: Die hebräische Existenzkonstruktion bedeutet wörtlich etwa »Es soll für dich nicht geben«; im Deutschen gibt »Du sollst nicht haben« das Verbot natürlich und präzise wieder.
- source_word: בְּכִיסְךָ
  choice: in deinem Beutel
  rationale: כִּיס bezeichnet einen Beutel oder eine Tasche, hier den Behälter für beim Handel verwendete Gewichtssteine. »Beutel« passt klar zum historischen Sachzusammenhang.
- source_word: אֶבֶן וָאָבֶן
  choice: zweierlei Gewichtssteine
  rationale: Wörtlich steht »Stein und Stein«. Gemeint sind verschieden bemessene Steine, die als Gewichte dienten. »Zweierlei Gewichtssteine« macht diese Funktion verständlich und bewahrt die paarweise Gegenüberstellung.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: einen großen und einen kleinen
  rationale: Die beiden Adjektive beschreiben die gegensätzlichen Größen der Gewichtssteine. Die knappe deutsche Form entspricht der Struktur des Hebräischen.
