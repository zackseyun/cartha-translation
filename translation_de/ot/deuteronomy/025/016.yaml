  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: de
  text: Denn jeder, der solche Dinge tut, jeder, der Unrecht tut[a], ist Jahwe, deinem Gott, ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ungerechtigkeit begeht“. Das hebräische Wort kann Unrecht, Ungerechtigkeit oder unrechtes Handeln bezeichnen; hier geht es besonders um unredliches Handeln mit Gewichten und Maßen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Verbot falscher Gewichte und Maße ein.
- source_word: תוֹעֲבַת
  choice: ein Gräuel
  rationale: Bewahrt die starke moralische und bundestheologische Wertung des hebräischen Substantivs und entspricht natürlichem, würdevollem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: jeder, der so etwas tut
  rationale: Die partizipiale Wendung bezeichnet allgemein jeden, der die zuvor genannten betrügerischen Praktiken ausübt; „so etwas“ stellt den natürlichen Rückbezug im Deutschen her.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: jeder, der Unrecht tut
  rationale: Spiegelt die Wiederholung von כֹּל עֹשֵׂה und lässt עָוֶל in seiner Breite als Unrecht bzw. Ungerechtigkeit stehen; im Kontext geht es besonders um unredliches Geschäftsgebaren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; seine Umschrift bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Stärke der göttlichen Verurteilung in תוֹעֲבַת יְהוָה
  choice: ist für Jahwe … ein Gräuel
  alternative: ist Jahwe … verabscheuungswürdig
  rationale: Die substantivische Formulierung erhält die starke Aussage des Hebräischen, ohne sie abzuschwächen oder über den Text hinaus auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung „jeder, der … jeder, der …“ bleibt erhalten, weil sie die hebräische Parallelität und nachdrückliche Verallgemeinerung wiedergibt.
