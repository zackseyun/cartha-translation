base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: de
  text: Er darf ihm vierzig Schläge geben[a], aber nicht mehr, damit er ihm nicht über diese hinaus viele weitere Schläge gibt und dein Bruder[b] vor deinen Augen entwürdigt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ihn vierzigmal schlagen“ oder „ihm vierzig Hiebe geben“. Der hebräische Text nennt die Zahl vierzig, legt hier aber weder das Schlaginstrument noch die genaue Art des einzelnen Schlages fest.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dein Bruder“ ist hier ein Mitangehöriger der Bundesgemeinschaft gemeint. Das Gesetz begrenzt die Strafe, damit er nicht als verachtenswert behandelt wird.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Er darf ihn vierzigmal schlagen
  rationale: Die Zahl vierzig bezeichnet die zulässige Höchstzahl der Schläge. „Vierzigmal schlagen“ bleibt nahe an der verbalen Formulierung des Hebräischen und legt weder ein bestimmtes Schlaginstrument noch eine bestimmte Vollzugsart fest.
- source_word: לֹא יֹסִיף
  choice: aber nicht öfter
  rationale: Das Verb יסף bedeutet hier, über die festgesetzte Zahl hinaus weitere Schläge hinzuzufügen. Die Formulierung gibt das Verbot im Deutschen knapp und eindeutig wieder.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: Sonst könnte er ihn … noch … schlagen
  rationale: פֶּן leitet die zu verhindernde Folge ein, während יסף mit Infinitiv die Fortsetzung beziehungsweise Hinzufügung der Handlung ausdrückt.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: über diese Zahl hinaus noch mit vielen weiteren Schlägen
  rationale: עַל אֵלֶּה verweist auf die genannten vierzig Schläge. מַכָּה רַבָּה kann eine große beziehungsweise übermäßige Misshandlung oder eine Vielzahl weiterer Schläge bezeichnen; im Zusammenhang wird der quantitative Überschuss natürlich ausgedrückt.
- source_word: וְנִקְלָה
  choice: würde … erniedrigt
  rationale: Das Nifal von קלה bezeichnet, dass jemand geringgeachtet, entwürdigt oder verächtlich gemacht wird. „Erniedrigt“ wahrt den Bezug zur menschlichen Würde im gerichtlichen Zusammenhang.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten und bezeichnet hier einen Mitangehörigen der Bundesgemeinschaft; gerade sie trägt die ethische Begründung der Strafbegrenzung.
- source_word: לְעֵינֶיךָ
  choice: vor deinen Augen
  rationale: Die geläufige deutsche Wendung bewahrt das konkrete Bild und betont, dass die Entwürdigung offen im Blickfeld der Gemeinschaft geschähe.
theological_decisions:
- issue: Bundesgemeinschaftliche Bezeichnung des Bestraften
  choice: dein Bruder
  alternative: dein israelitischer Mitbürger
  rationale: Der hebräische Text nennt den Bestraften trotz seiner Schuld weiterhin „Bruder“. Diese familiäre Bezeichnung begründet die Begrenzung der Strafe und darf nicht zu einer bloßen sozialen Kategorie verflacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Begrenzung wird klar formuliert; zugleich bleiben die konkrete Art der Schläge und die gemeinschaftliche Bedeutung von „Bruder“ erkennbar, ohne konfessionelle Deutung einzutragen.
