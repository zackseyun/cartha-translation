  yaml_path: translation/ot/deuteronomy/025/010.yaml
  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: de
  text: Und in Israel wird sein Name »Haus des Mannes, dem die Sandale ausgezogen wurde« genannt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Haus des Ausgezogenen der Sandale.« Die knappe hebräische Bezeichnung spielt auf das im vorherigen Vers beschriebene Ritual an.'
    reason: Die Fußnote erläutert die verdichtete Partizipialform des hebräischen Schandtitels, ohne dessen Sinn im Haupttext zu verändern.
lexical_decisions:
- source_word: וְנִקְרָא שְׁמוֹ
  choice: Und … soll man sein Haus … nennen
  rationale: Die hebräische passive Namensformel bedeutet wörtlich »und sein Name soll genannt werden«. Im Deutschen bezeichnet der folgende Titel jedoch ausdrücklich das »Haus«; die unpersönliche aktive Form gibt die öffentliche Benennung natürlich wieder und vermeidet die missverständliche Gleichsetzung einer Person mit einem Haus.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition bezeichnet den gesellschaftlichen Bereich, in dem dieser Schandname gebraucht wird.
- source_word: בֵּית
  choice: Haus
  rationale: בֵּית kann hier das Haus im Sinn von Familie oder Sippe bezeichnen und ist Bestandteil des öffentlichen Schandnamens.
- source_word: חֲלוּץ הַנָּעַל
  choice: des Barfüßers
  rationale: Die knappe hebräische Wendung bezeichnet den Mann, dem im vorausgehenden Ritual die Sandale ausgezogen wurde. »Barfüßer« bewahrt die Kürze und die Form eines Schandnamens, während die Fußnote die wörtliche Bedeutung festhält.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Rechtstext. Der ungewöhnliche Ausdruck »Barfüßer« ist bewusst als kurzer öffentlicher Schandname gestaltet; die Fußnote dokumentiert die formale Struktur und die rituelle Bedeutung des Hebräischen.
