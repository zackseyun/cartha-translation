base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: de
  text: Wenn Brüder beieinander wohnen und einer von ihnen stirbt, ohne einen Sohn zu haben[a], dann soll die Frau des Verstorbenen keinen Mann außerhalb der Familie heiraten[b]. Der Bruder ihres verstorbenen Mannes soll zu ihr eingehen[c], sie sich zur Frau nehmen und ihr gegenüber die Schwagerpflicht erfüllen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er hat keinen Sohn“. Manche verstehen die Bestimmung allgemeiner im Sinn von „kein Kind“; im Hebräischen steht ausdrücklich „Sohn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Die Frau des Verstorbenen soll nicht nach draußen einem fremden Mann gehören.“ Gemeint ist ein Mann außerhalb des Familienkreises, der zu dieser Verpflichtung nicht gehört.'
    reason: lexical_alternative
  - marker: c
    text: „Zu ihr eingehen“ ist eine hebräische Umschreibung für ehelichen Geschlechtsverkehr.
    reason: lexical_alternative
  - marker: d
    text: Die „Schwagerpflicht“ bezeichnet die später sogenannte Schwagerehe oder Leviratsehe, bei der der Bruder eines Verstorbenen dessen Witwe heiratet.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: Brüder beieinander wohnen
  rationale: אַחִים bezeichnet hier männliche Brüder; יַחְדָּו beschreibt ihr gemeinsames beziehungsweise eng verbundenes Wohnen, ohne die genaue Haushaltsform festzulegen.
- source_word: וּבֵן אֵין לוֹ
  choice: ohne einen Sohn zu haben
  rationale: Der hebräische Text nennt ausdrücklich einen Sohn und nicht allgemein ein Kind; diese mögliche rechtliche Spannung bleibt erhalten.
- source_word: אֵשֶׁת הַמֵּת
  choice: die Frau des Verstorbenen
  rationale: Dies bildet die hebräische Genitivverbindung genauer ab als das zwar naheliegende, aber lexikalisch weniger direkte „Witwe“.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: keinen Mann außerhalb der Familie heiraten
  rationale: „Außerhalb“ und „fremder Mann“ bezeichnen im Zusammenhang einen Mann außerhalb des verpflichteten Familienkreises, nicht notwendig einen ethnischen Ausländer. Die natürliche deutsche Fassung macht diesen sozialen Gegensatz deutlich.
- source_word: יְבָמָהּ
  choice: der Bruder ihres verstorbenen Mannes
  rationale: Das Substantiv bezeichnet spezifisch den Bruder des verstorbenen Ehemanns. Die ausgeschriebene Beziehung vermeidet die Mehrdeutigkeit von „Schwager“.
- source_word: יָבֹא עָלֶיהָ
  choice: soll zu ihr eingehen
  rationale: Die traditionelle, würdevolle Wendung bewahrt den hebräischen Euphemismus für ehelichen Geschlechtsverkehr; eine Fußnote erklärt ihn.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: sie sich zur Frau nehmen
  rationale: Die Wendung gibt sowohl das Nehmen „für sich“ als auch die Begründung der Ehe knapp und idiomatisch wieder.
- source_word: וְיִבְּמָהּ
  choice: an ihr die Schwagerpflicht erfüllen
  rationale: Das spezialisierte Verb bezeichnet die Erfüllung der mit der Schwagerehe verbundenen Pflicht. „Schwagerpflicht“ ist verständlicher als ein technischer Fachausdruck und erhält den rechtlichen Charakter.
theological_decisions:
- issue: Reichweite der Bedingung וּבֵן אֵין לוֹ
  choice: Im Haupttext steht entsprechend dem Hebräischen ausdrücklich „ohne einen Sohn“; die mögliche allgemeinere Deutung wird nur in der Fußnote genannt.
  alternative: „ohne ein Kind zu hinterlassen“
  rationale: Der Ausgangstext verwendet בֵּן („Sohn“). Eine Verallgemeinerung im Haupttext würde eine Auslegungsfrage vorentscheiden.
- issue: Wiedergabe der Schwagerehe
  choice: Die Verwandtschaftsbeziehung wird ausgeschrieben und die abschließende Pflicht als „Schwagerpflicht“ bezeichnet.
  alternative: Die Fachbegriffe „Levir“ und „Leviratsehe“ verwenden.
  rationale: Die gewählte Form ist für heutige Leser verständlich, ohne den besonderen rechtlichen und familiären Charakter der Einrichtung aufzulösen.
- issue: Bedeutung von „außerhalb“ und „fremd“
  choice: „außerhalb der Familie“ bezeichnet den für diese Verpflichtung maßgeblichen Familienkreis.
  alternative: 'Wörtlicher: „draußen einem fremden Mann angehören“'
  rationale: Die Alternative wäre im Deutschen unklar und könnte fälschlich ethnische Fremdheit nahelegen. Die gewählte Fassung gibt den rechtlich-sozialen Gegensatz wieder, ohne die Familie genauer zu definieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ton. Der Satzbau bleibt nah am hebräischen Bedingungssatz, während unnatürliche Wörtlichkeit vermieden wird. Der Euphemismus „zu ihr eingehen“ wird wegen seiner textlichen und kulturellen Bedeutung bewahrt und erläutert.
