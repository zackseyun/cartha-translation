translation:
  language: de
  text: Dann sollst du ihr die Hand[a] abschneiden; dein Auge soll kein Mitleid haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Handfläche“. Das hebräische Wort kann speziell die Handfläche, aber auch die Hand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Auge soll sie nicht verschonen“. Die hebräische Wendung nennt wörtlich das Auge und fordert dazu auf, kein Mitleid zu zeigen beziehungsweise nicht zu verschonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: Dann sollst du … abhauen
  rationale: קצץ bezeichnet hier das Abtrennen oder Abhauen. „Abhauen“ gibt die konkrete und harte Rechtsanweisung natürlich und ungeschönt wieder; וְ führt im Zusammenhang die Folgerung beziehungsweise Anweisung fort.
- source_word: אֶת
  choice: '[Akkusativzeichen, unübersetzt]'
  rationale: Das hebräische Kennzeichen des bestimmten direkten Objekts hat im Deutschen keine eigene Entsprechung.
- source_word: כַּפָּהּ
  choice: ihre Hand
  rationale: כַּף kann die Handfläche oder allgemeiner die Hand bezeichnen. In Verbindung mit dem Abtrennen ist „Hand“ im Deutschen die natürliche Wiedergabe; „Handfläche“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: לֹא
  choice: kein / nicht
  rationale: Die hebräische Verneinung wird in der deutschen Satzkonstruktion idiomatisch durch „kein“ ausgedrückt.
- source_word: תָחוֹס
  choice: soll … Mitleid haben
  rationale: חוס kann „Mitleid haben“, „schonen“ oder „verschonen“ bedeuten. Mit dem ausdrücklich genannten Auge bewahrt „Mitleid haben“ das Bild und den Sinn der Formel.
- source_word: עֵינֶךָ
  choice: dein Auge
  rationale: Die wörtliche Nennung des Auges wird beibehalten, damit die eindringliche hebräische Rechtsformel nicht zu einem bloßen Pronomen verflacht wird.
theological_decisions:
- issue: Wörtlichkeit der Strafbestimmung
  choice: Die konkrete Anweisung „die Hand abhauen“ und die Augenformel werden beibehalten.
  alternative: 'Dynamischer: „Du sollst ihr die Hand abtrennen und sie nicht verschonen.“'
  rationale: Der Vers formuliert eine unmittelbare Rechtsbestimmung. Eine abschwächende oder stark deutende Wiedergabe würde die Härte und Bildhaftigkeit des Ausgangstextes verdecken. Die Übersetzung lässt zugleich die lexikalische Möglichkeit „Handfläche“ und die Bedeutungsnuance „verschonen“ in den Fußnoten sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular und die anschauliche hebräische Augenformel bleiben erhalten. „Abhauen“ ist hier im konkreten Sinn des Abtrennens gebraucht, nicht umgangssprachlich im Sinn von Weggehen.
