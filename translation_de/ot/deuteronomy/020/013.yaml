base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: de
  text: Und Jahwe, dein Gott, wird sie in deine Hand geben, und du sollst alle männlichen Personen in ihr[a] mit der Schneide des Schwertes erschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „alles Männliche in ihr“. Das Hebräische bezeichnet ausdrücklich die männlichen Personen und verwendet keinen allgemeineren Ausdruck wie „Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: und … wird sie … geben
  rationale: Das Präfix ו wird als fortführendes „und“ wiedergegeben; die Verbform bezeichnet hier im Zusammenhang die folgende Handlung. Das feminine Objektpronomen bezieht sich auf die Stadt und wird im Deutschen mit „sie“ aufgenommen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form mit Suffix der 2. Person Maskulin Singular wird entsprechend der hebräischen Bundesformel direkt wiedergegeben.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt einer Person; das deutsche Bild bleibt verständlich und wird bewahrt.
- source_word: וְהִכִּיתָ
  choice: und du sollst … erschlagen
  rationale: Das Hifil von נכה bezeichnet im militärischen Zusammenhang tödliches Niederschlagen. „Erschlagen“ gibt die tödliche Bedeutung klar wieder, ohne sie abzuschwächen.
- source_word: כָּל זְכוּרָהּ
  choice: alle männlichen Personen in ihr
  rationale: זְכוּר bezeichnet hier die männlichen Personen der Stadt. Die Wiedergabe wahrt die ausdrückliche Geschlechtsangabe, vermeidet aber das im Deutschen möglicherweise nur auf erwachsene Männer beschränkte „Männer“.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die feste Wendung bedeutet wörtlich etwa „mit dem Mund des Schwertes“ und verweist auf dessen Schneide; „mit der Schärfe des Schwertes“ bewahrt das Bild in verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe eines Gott zugeschriebenen Kriegsbefehls
  choice: Die Übergabe der Stadt wird Jahwe zugeschrieben und der tödliche Befehl gegen alle männlichen Personen direkt wiedergegeben.
  alternative: Den Befehl zu „besiegen“ abschwächen oder ihn durch eine Deutung als Gericht beziehungsweise heiliger Krieg erweitern.
  rationale: Der hebräische Text verbindet Jahwes Übergabe der Stadt ausdrücklich mit einer tödlichen militärischen Anweisung. Die Übersetzung bewahrt diese Spannung, ohne sie zu mildern oder theologisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und das Bild von der „Hand“ bleiben nah am Hebräischen; zugleich verhindert „männliche Personen“ eine unbeabsichtigte Beschränkung auf erwachsene Männer.
