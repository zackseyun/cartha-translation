base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: de
  text: So[a] sollst du mit allen Städten verfahren, die sehr weit von dir entfernt liegen und nicht zu diesen Völkern gehören.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf diese Weise“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die nicht von den Städten dieser Völker sind“; gemeint ist, dass sie nicht zu den eben genannten Völkern gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Das Adverb verweist auf die unmittelbar zuvor beschriebene Vorgehensweise. „So“ ist im Deutschen natürlich, knapp und für eine rechtliche Anweisung angemessen.
- source_word: תַּעֲשֶׂה לְכָל הֶעָרִים
  choice: sollst du mit allen Städten verfahren
  rationale: Der imperfektive Verbalsatz hat hier anweisende Kraft. „Mit … verfahren“ gibt die betroffenen Städte idiomatisch wieder und stellt den Bezug zur zuvor beschriebenen Behandlung her.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: die sehr weit von dir entfernt liegen
  rationale: Die Formulierung bewahrt die räumliche Bedeutung von רחק, den Vergleichspunkt mit מן und die Verstärkung durch מְאֹד.
- source_word: אֲשֶׁר לֹא מֵעָרֵי הַגּוֹיִם הָאֵלֶּה הֵנָּה
  choice: die … nicht zu den Städten dieser Völker gehören
  rationale: Die Zugehörigkeitsformulierung gibt den partitiven beziehungsweise abgrenzenden Sinn von מן in natürlichem Deutsch wieder. הֵנָּה wird zusammen mit הָאֵלֶּה durch „dieser“ aufgenommen, ohne ein unnatürliches zusätzliches Demonstrativpronomen einzuführen.
- source_word: הַגּוֹיִם
  choice: Völker
  rationale: „Völker“ bezeichnet hier die im Kontext genannten ethnisch-politischen Gruppen und vermeidet die im Deutschen oft religiös gefärbte Bezeichnung „Heiden“.
theological_decisions:
- issue: Abgrenzung der fernen Städte von den Städten der im Kontext genannten Völker
  choice: Die vorangehende Regel wird ausdrücklich auf weit entfernte Städte bezogen, die nicht zu den genannten Völkern gehören.
  alternative: Den Satz allgemein auf ausländische Städte zu beziehen oder die militärisch-rechtliche Unterscheidung abzuschwächen.
  rationale: Der hebräische Satz markiert den Geltungsbereich der vorausgehenden Anweisung. Die Übersetzung hält diese rechtliche Abgrenzung fest, ohne Einzelheiten aus den Nachbarversen ergänzend in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „sollst du … verfahren“ bewahrt den anweisenden Ton des Rechtstextes, bleibt aber für heutige Leser verständlich.
