  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: de
  text: damit sie euch nicht lehren, entsprechend all ihren Gräueln zu handeln, die sie für ihre Götter[a] verübt haben, und ihr dadurch gegen Jahwe, euren Gott, sündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »zu Ehren ihrer Götter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: damit … nicht
  rationale: Die Verbindung leitet einen verneinten Zweck beziehungsweise die beabsichtigte Verhinderung ein; „damit … nicht“ ist im modernen Deutschen natürlich und wahrt die finale Aussage.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: sie euch … lehren, … nachzuahmen
  rationale: Wörtlich steht „sie euch lehren zu tun“. Zusammen mit כְּכֹל bezeichnet die Aussage jedoch das Erlernen entsprechender Handlungen; „nachahmen“ gibt diese Konformität klar und knapp wieder.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: all ihre Gräuel nachzuahmen
  rationale: כְּ־ bezeichnet die Übereinstimmung mit ihren Handlungen. „Gräuel“ bewahrt die starke religiös-moralische Wertung von תּוֹעֵבָה und die biblische Begriffstradition, ohne den Ausdruck abzuschwächen.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die sie … verübt haben
  rationale: Das Relativpronomen bezieht sich auf die Gräuel. „Verübt haben“ ist bei schwer verwerflichen Taten idiomatischer als das formale „getan haben“ und erhält die negative Wertung.
- source_word: לֵאלֹהֵיהֶם
  choice: für ihre Götter
  rationale: Die Präposition ל kann hier kultische Ausrichtung oder Zuwendung bezeichnen. „Für ihre Götter“ versteht die Praktiken als zu deren Verehrung ausgeführt; „an ihren Göttern“ bleibt als mögliche Alternative vermerkt.
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: und ihr euch so gegen Jahwe … versündigt
  rationale: Die Verbform führt die befürchtete Folge weiter. Das mit חטא verbundene ל bezeichnet hier den, gegen den gesündigt wird. „sich gegen … versündigen“ ist natürliches, würdevolles Deutsch.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euren Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֵיכֶם steht dazu appositionell. Das Komma verdeutlicht diese Beziehung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Gräuel auf die fremden Götter
  choice: für ihre Götter
  alternative: an ihren Göttern
  rationale: Das ל kann die kultische Zielrichtung ausdrücken. Die Hauptfassung bezeichnet Handlungen im Dienst der Götter; die Alternative bewahrt die mögliche direktionale Lesart.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. „Gräuel“ erhält die Schärfe des hebräischen Kult- und Moralbegriffs; „nachahmen“ vermeidet die im Deutschen schwerfällige Formulierung „gemäß all ihren Gräueln tun“. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Wendung.
