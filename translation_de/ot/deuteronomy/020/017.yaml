review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den adversativen Anschluss von כִּי im Kontext mit „Vielmehr“ angemessen wieder. „sollst du sie vollständig der Vernichtung weihen“ wahrt sowohl die Verstärkung durch Infinitivus absolutus als auch den spezifischen Bann-/Weihesinn von החרם. Die sechs Volksbezeichnungen sowie „wie Jahwe, dein Gott, dir geboten hat“ entsprechen dem hebräischen Text.
  naturalness: Der Satz ist würdig und gut verständlich. Ein Gedankenstrich vor der appositiven Völkerliste bildet deren syntaktische Beziehung zu „sie“ im Deutschen etwas flüssiger ab als ein Doppelpunkt.
  terminology: „Jahwe“ ist als Wiedergabe des Tetragramms konsistent. „der Vernichtung weihen“ ist für חרם in diesem Kontext eine sachgerechte, nicht verharmlosende Wiedergabe; die Fußnote erläutert die Bannterminologie. Die übliche deutsche ethnische Bezeichnung lautet jedoch „Hethiter“, nicht „Hetiter“.
  issues:
  - severity: medium
    issue: Volksname „Hetiter“
    rationale: Im modernen deutschen Bibel- und Fachgebrauch ist „Hethiter“ die etablierte Bezeichnung für הַחִתִּי. Die Form „Hetiter“ ist unüblich und sollte vereinheitlicht werden.
  - severity: low
    issue: Doppelpunkt vor der appositiven Völkerliste
    rationale: Die Liste erläutert das vorangehende Objekt „sie“ und ist keine selbstständige Aufzählung. Ein Gedankenstrich liest sich hier natürlicher, ohne den Sinn zu ändern.
