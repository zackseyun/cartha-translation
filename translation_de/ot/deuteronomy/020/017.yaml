base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: de
  text: Vielmehr sollst du sie vollständig der Vernichtung weihen[a] – die Hethiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter –, wie Jahwe, dein Gott, dir geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »du sollst sie ganz dem Bann unterstellen«; das hebräische Verb bezeichnet hier die vollständige Weihe zur Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vielmehr
  rationale: Die Konjunktion hebt im Zusammenhang den Gegensatz zu den zuvor genannten fernen Städten hervor, deren Bewohner verschont werden dürfen.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: sollst du sie vollständig der Vernichtung weihen
  rationale: Der absolute Infinitiv mit der finiten Verbform verstärkt das Gebot. Die Wendung mit חרם bezeichnet nicht nur gewöhnliches Töten, sondern die vollständige Bannweihe zur Vernichtung.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: die Hetiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter
  rationale: Gebräuchliche deutsche Bezeichnungen der kollektiv gemeinten Völker.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Gibt den vergleichenden beziehungsweise modal unterordnenden Sinn knapp und natürlich wieder.
- source_word: צִוְּךָ
  choice: dir geboten hat
  rationale: Das deutsche Perfekt bezeichnet idiomatisch das zuvor erteilte und weiterhin geltende Gebot.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Jahwe wiedergegeben statt durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte und natürliche Wiedergabe der Bundesformel.
theological_decisions:
- issue: Wiedergabe von חרם in einem Kriegsgebot
  choice: vollständig der Vernichtung weihen
  alternative: völlig vernichten; dem Bann übergeben
  rationale: Die Formulierung bewahrt sowohl den totalen Nachdruck als auch den kultisch-rechtlichen Sinn der Bannweihe, ohne sie auf bloßes Töten zu reduzieren.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname wahrt den Charakter des Tetragramms und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vielmehr« stellt den Zusammenhang mit dem vorausgehenden Vers her; »der Vernichtung weihen« erhält die besondere Bedeutung des hebräischen Bannbegriffs.
