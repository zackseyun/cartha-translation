  text: וְ/דִבְּר֣וּ הַ/שֹּֽׁטְרִים֮ אֶל הָ/עָ֣ם לֵ/אמֹר֒ מִֽי הָ/אִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת חָדָשׁ֙ וְ/לֹ֣א חֲנָכ֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: de
  text: 'Dann sollen die Beamten zum Volk sagen: »Wer ist der Mann, der ein neues Haus gebaut und es noch nicht eingeweiht[a] hat? Er soll gehen und in sein Haus zurückkehren, damit er nicht im Kampf stirbt und ein anderer Mann es einweiht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gebrauch genommen“. Das hebräische Verb bezeichnet den feierlichen Beginn der Nutzung eines neuen Hauses, oft mit dem Gedanken einer Weihe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: die Beamten
  rationale: Das Wort bezeichnet hier bestellte Amts- oder Ordnungsträger, die im militärischen Aufgebot Anweisungen bekannt geben. „Beamte“ ist im modernen Standarddeutsch verständlich, ohne sie enger als Heerführer zu bestimmen.
- source_word: הָעָם
  choice: das Volk
  rationale: Die direkte Entsprechung bewahrt die kollektive Bezeichnung des hebräischen Textes; im Zusammenhang ist das zum Kampf versammelte Volk gemeint.
- source_word: מִי הָאִישׁ
  choice: Wer ist der Mann
  rationale: Die ausdrücklich männliche Einzelform wird beibehalten, da der Zusammenhang die zum Kriegsdienst aufgebotenen Männer betrifft.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: ein neues Haus gebaut
  rationale: „Haus“ gibt בַּיִת unmittelbar wieder und vermeidet die weiter gefasste Deutung „Zuhause“.
- source_word: וְלֹא חֲנָכוֹ / יַחְנְכֶנּוּ
  choice: es noch nicht eingeweiht / es einweiht
  rationale: „Einweihen“ bezeichnet im Deutschen sowohl die feierliche Eröffnung als auch die Aufnahme der Nutzung und bewahrt die Wiederholung desselben hebräischen Verbs.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Er soll gehen und in sein Haus zurückkehren
  rationale: Die Imperfektformen haben in dieser rechtlich-prozeduralen Rede auffordernde Kraft; „soll“ gibt diese Anweisung natürlich wieder.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: damit er nicht im Kampf stirbt
  rationale: „Damit nicht“ gibt die abwehrende Bedeutung von פֶּן idiomatisch wieder; „im Kampf“ passt zur konkreten militärischen Situation.
- source_word: וְאִישׁ אַחֵר
  choice: und ein anderer Mann
  rationale: Die ausdrückliche männliche und singularische Form des Ausgangstextes bleibt erhalten.
