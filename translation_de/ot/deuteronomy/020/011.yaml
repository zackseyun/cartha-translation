base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: de
  text: Und wenn sie dir mit Frieden antwortet[a] und sich dir öffnet, dann soll das ganze Volk, das sich darin befindet, dir zu Frondiensten verpflichtet sein[b] und dir dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dir mit Frieden antwortet“; möglich ist auch: „dein Friedensangebot annimmt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dir zu Abgaben verpflichtet sein“. Das hebräische Wort מַס kann eine Abgabe, eine Auflage oder verpflichtenden Arbeitsdienst bezeichnen; hier legt der Zusammenhang Frondienst nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: friedlich
  rationale: Das Substantiv bezeichnet Frieden oder Wohlergehen. In diesem militärischen Zusammenhang beschreibt es die zustimmende, friedliche Antwort auf das Friedensangebot aus dem vorhergehenden Vers. „Friedlich antwortet“ ist im modernen Deutschen natürlicher als das wörtlichere „mit Frieden antwortet“.
- source_word: תַּעַנְךָ
  choice: dir … antwortet
  rationale: ענה bedeutet hier „antworten“ oder „erwidern“. Das feminine Singularpronomen bezieht sich auf die Stadt, die im Deutschen ebenfalls feminin ist.
- source_word: וּפָתְחָה לָךְ
  choice: dir die Tore öffnet
  rationale: Das Hebräische sagt wörtlich nur „dir öffnet“. Im Zusammenhang mit einer belagerten Stadt sind die Stadttore das naheliegende, im Deutschen notwendige Objekt; die Ergänzung macht den Sinn natürlich verständlich, ohne die Handlung näher auszugestalten.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: das ganze Volk, das sich darin befindet
  rationale: נמצא bezeichnet das in der Stadt vorgefundene beziehungsweise dort befindliche Volk. Die reflexive deutsche Wendung gibt den partizipialen Ausdruck natürlich wieder.
- source_word: לָמַס
  choice: zu Frondiensten verpflichtet
  rationale: מַס kann Abgabe, Auflage oder verpflichtenden Arbeitsdienst bezeichnen. Zusammen mit dem folgenden „dienen“ liegt hier auferlegter Arbeitsdienst nahe. „Frondienste“ bewahrt den Zwangscharakter und ist zugleich historisch verständlich.
- source_word: וַעֲבָדוּךָ
  choice: und dir dienen
  rationale: עבד bedeutet „dienen“ oder „arbeiten“. Die allgemeine Wiedergabe „dienen“ wahrt das Unterordnungsverhältnis, ohne eine spezifischere Institution als im Ausgangstext vorauszusetzen.
theological_decisions:
- issue: Unterwerfungssprache in einem Kriegsgesetz
  choice: „zu Frondiensten verpflichtet sein und dir dienen“
  alternative: „dir Abgaben leisten und dir dienen“
  rationale: Die Formulierung lässt den Zwang und die Unterordnung des beschriebenen Verhältnisses deutlich stehen, ohne die Aussage auf bloße Geldabgaben zu verengen oder über den hebräischen Text hinaus eine bestimmte Form der Knechtschaft festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Bedingungssatz, während idiomatisch schwierige Wendungen behutsam geglättet werden. „Frondienste“ hält die Härte der historischen Unterwerfungssprache sichtbar.
