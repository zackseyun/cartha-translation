id: DEU.20.16
reference: Deuteronomy 20:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: de
  text: Doch in den Städten dieser Völker, die Jahwe, dein Gott, dir als Erbbesitz gibt, sollst du nichts, was Atem hat, am Leben lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: רַק kennzeichnet hier die Ausnahme gegenüber den vorausgehenden Bestimmungen für weiter entfernte Städte; „Doch“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: in den Städten dieser Völker
  rationale: Das מן bezeichnet hier den Bereich, auf den die Ausnahme angewandt wird. Im Deutschen ist „in den Städten“ idiomatischer als das missverständliche „von den Städten“; עַמִּים wird als „Völker“ wiedergegeben.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה
  choice: die Jahwe, dein Gott, dir als Erbbesitz gibt
  rationale: Das Partizip נֹתֵן bezeichnet die als gegenwärtig bzw. gewiss dargestellte Gabe. „Erbbesitz“ bewahrt den land- und bundestheologischen Gehalt von נַחֲלָה und klingt im Deutschen in diesem Zusammenhang natürlicher als „Erbe“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא תְחַיֶּה
  choice: sollst du … nicht am Leben lassen
  rationale: 'Die Piel-Form von חיה hat hier kausative Bedeutung: jemanden oder etwas leben bzw. am Leben bleiben lassen.'
- source_word: כָּל נְשָׁמָה
  choice: nichts, was Atem hat
  rationale: Wörtlich bezeichnet die Wendung jedes atmende Wesen. Die Formulierung bewahrt das konkrete hebräische Bild, ohne נְשָׁמָה irreführend als „Seele“ zu übersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ erhält diesen Charakter und ersetzt ihn nicht durch einen Titel.
- issue: Bundes- und Landterminologie bei נַחֲלָה
  choice: Erbbesitz
  alternative: Erbe; Besitz
  rationale: „Erbbesitz“ wahrt sowohl den Aspekt der zugeteilten Gabe als auch den besonderen landtheologischen Gehalt, ohne ihn auf bloßen Besitz zu reduzieren.
- issue: Umfang von כָּל נְשָׁמָה
  choice: nichts, was Atem hat
  alternative: kein Lebewesen; niemanden
  rationale: Die konkrete und umfassende Formulierung des Hebräischen bleibt stehen. Sie wird weder auf Menschen eingeengt noch durch eine abstrakte Seelenterminologie umgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „in den Städten“ und „Erbbesitz“ idiomatisches Deutsch gewährleisten. Keine Fußnote ist nötig, da die konkrete Bedeutung von כָּל נְשָׁמָה im Haupttext erhalten bleibt.
