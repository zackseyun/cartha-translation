  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: de
  text: 'und zu ihnen sagen: »Höre, Israel! Ihr zieht heute gegen eure Feinde in den Kampf. Verliert nicht den Mut![a] Fürchtet euch nicht, geratet nicht in Panik und lasst euch nicht von ihnen einschüchtern![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Euer Herz soll nicht weich werden.« Gemeint ist, dass der Mut nicht zusammenbrechen soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Fürchtet euch nicht, geratet nicht in Panik und lasst euch nicht vor ihnen erschrecken.« Die drei aufeinanderfolgenden Verbote verstärken die Aufforderung, angesichts der Feinde keine Furcht, panische Bestürzung oder Einschüchterung zuzulassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: und zu ihnen sagen
  rationale: Die waw-konsekutive Perfektform setzt im gesetzlichen Verfahrenszusammenhang die Anweisung aus Vers 2 fort. Der deutsche Infinitiv schließt natürlich an den vorausgehenden Satz an, ohne die Form als Vergangenheit misszuverstehen.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Höre, Israel!
  rationale: Bewahrt die für das Deuteronomium charakteristische Bundesaufforderung und umfasst sowohl das Hören als auch das Beachten.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Ihr rückt heute zum Kampf … aus
  rationale: Der Ausdruck bezeichnet das unmittelbar bevorstehende Heranrücken zur Schlacht. „Ausrücken zum Kampf“ ist im Deutschen natürlich und wahrt den militärischen Bewegungssinn.
- source_word: עַל אֹיְבֵיכֶם
  choice: gegen eure Feinde
  rationale: עַל bezeichnet in diesem Kriegskontext die feindliche Ausrichtung und wird klar mit „gegen“ wiedergegeben.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Verliert nicht den Mut!
  rationale: Die wörtliche Rede vom weich beziehungsweise schwach werdenden Herzen ist ein hebräisches Bild für zusammenbrechenden Mut. Die idiomatische deutsche Wiedergabe vermittelt die gemeinte Wirkung deutlich; die Fußnote bewahrt das Bild.
- source_word: אַל תִּירְאוּ
  choice: Fürchtet euch nicht
  rationale: Direkte, würdige Wiedergabe des Verbots; der Pluralbezug auf Israel bleibt erhalten.
- source_word: וְאַל תַּחְפְּזוּ
  choice: geratet nicht in Panik
  rationale: Das Verb bezeichnet hier alarmierte Bestürzung oder Verwirrung, nicht bloß Eile. „In Panik geraten“ trifft den militärischen Zusammenhang in heutigem Deutsch.
- source_word: וְאַל תַּעַרְצוּ
  choice: erschreckt nicht
  rationale: Das Verb beschreibt überwältigenden Schrecken vor dem Gegner. „Erschreckt nicht“ ist natürlich und hält die Steigerung der drei Furchtverbote offen, ohne zusätzliche Deutung einzutragen.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Bewahrt die räumlich-idiomatische Form „vor ihrem Angesicht“ knapper als „vor ihnen“ und vermeidet eine unnötige Festlegung auf eine rein kausale Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die feierliche deuteronomische Anrede „Höre, Israel!“ bleibt erhalten. Die militärische Sprache ist klar, aber nicht unnötig archaisch; die hebräische Herz-Metapher wird in der Fußnote dokumentiert.
