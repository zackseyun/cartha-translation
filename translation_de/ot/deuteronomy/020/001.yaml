  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: de
  text: Wenn du gegen deine Feinde in den Kampf ziehst und Pferde und Streitwagen[a] siehst, ein Volk, das zahlreicher ist als du[b], dann fürchte dich nicht vor ihnen; denn Jahwe, dein Gott, der dich aus dem Land Ägypten heraufgeführt hat[c], ist mit dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Pferd und Streitwagen“; die hebräischen Singularformen sind hier wahrscheinlich kollektiv gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Volk, das größer ist als du“. Gemeint ist wahrscheinlich seine zahlenmäßige Überlegenheit.'
    reason: lexical_alternative
  - marker: c
    text: „Der dich aus dem Land Ägypten heraufgeführt hat“ erinnert an den Auszug aus Ägypten und begründet Israels Zuversicht.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier zusammen mit dem Imperfekt einen vorausgesetzten künftigen Fall ein; „Wenn“ gibt diesen situativen Sinn im Deutschen natürlich wieder.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: du … in den Kampf ziehst
  rationale: Die Wendung bezeichnet das Ausziehen zu einer militärischen Auseinandersetzung. „In den Kampf ziehen“ ist idiomatisch und wahrt das militärische Bild.
- source_word: עַל אֹיְבֶיךָ
  choice: gegen deine Feinde
  rationale: עַל bezeichnet bei feindlicher Handlung die Ausrichtung „gegen“; Numerus und Person werden bewahrt.
- source_word: וְרָאִיתָ
  choice: und … siehst
  rationale: Die Verbform führt im instruktiven Zusammenhang das entworfene Szenario fort und wird im Deutschen präsentisch wiedergegeben.
- source_word: סוּס וָרֶכֶב
  choice: Pferde und Streitwagen
  rationale: Die hebräischen Singularformen können kollektiv gebraucht sein. Der deutsche Plural vermittelt die militärischen Verbände verständlich, während eine Fußnote die Form des Hebräischen nennt.
- source_word: עַם רַב מִמְּךָ
  choice: ein Volk, das zahlreicher ist als du
  rationale: רַב mit vergleichendem מִן bezeichnet hier am ehesten zahlenmäßige Überlegenheit, ohne das Volk vorschnell mit einem Heer gleichzusetzen.
- source_word: לֹא תִירָא מֵהֶם
  choice: dann fürchte dich nicht vor ihnen
  rationale: Das Imperfekt hat in diesem Weisungszusammenhang verbietende Funktion. „Dann“ verdeutlicht im Deutschen den Anschluss an den Wenn-Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: dein Gott, ist mit dir
  rationale: Die direkte Formulierung bewahrt die Aussage von Gottes Gegenwart, ohne sie etwa als bloße Parteinahme auszulegen.
- source_word: הַמַּעַלְךָ
  choice: er, der dich … heraufgeführt hat
  rationale: Das substantivierte Partizip identifiziert Jahwe als den, der Israel aus Ägypten heraufführte. „Heraufgeführt“ erhält die räumlich-theologische Exoduswendung.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Dies ist eine genaue und natürliche Wiedergabe der geographischen Herkunftsangabe.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den göttlichen Eigennamen. „Jahwe“ macht ihn im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Exodus-Erinnerung
  choice: „er, der dich … heraufgeführt hat“ als Apposition zu Jahwe
  alternative: 'ein neuer selbstständiger Satz: „Er hat dich … heraufgeführt“'
  rationale: Das hebräische artikulierte Partizip beschreibt Jahwe näher. Die appositionelle deutsche Fassung bewahrt diesen grammatischen und theologischen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Der Satzbau bleibt dem hebräischen Gedankengang nahe, wird aber durch „dann“ und einen Gedankenstrich für heutige Leser klar gegliedert. Militärische und exodische Bildsprache wird nicht abgeschwächt.
