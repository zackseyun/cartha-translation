  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: de
  text: Und welcher Mann hat einen Weinberg gepflanzt und ihn noch nicht erstmals genutzt[a]? Er soll gehen und in sein Haus zurückkehren, damit er nicht im Kampf stirbt und ein anderer Mann ihn erstmals nutzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher beziehungsweise formeller lässt sich auch übersetzen: „ihn noch nicht in Gebrauch genommen“ oder „ihn noch nicht eingeweiht“. Das hebräische Verb bezeichnet hier wahrscheinlich die erstmalige gewöhnliche Nutzung des Weinbergs, wohl nach den ersten Jahren, in denen seine Frucht nicht zur gewöhnlichen Nutzung bestimmt war (vgl. 3. Mose 19,23–25).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Und welcher Mann
  rationale: Bewahrt die einleitende Frageformel und die ausdrückliche männliche Bezeichnung, die sich im Zusammenhang auf die zum Kampf aufgebotenen Männer bezieht.
- source_word: נָטַע כֶּרֶם
  choice: hat einen Weinberg gepflanzt
  rationale: Gibt die abgeschlossene Handlung mit gegenwärtiger Bedeutung im Deutschen natürlich wieder.
- source_word: וְלֹא חִלְּלוֹ
  choice: aber noch keinen Ertrag davon gehabt
  rationale: Das Verb bezeichnet hier wahrscheinlich die erstmalige gewöhnliche Nutzung des Weinbergs nach der anfänglichen Wartezeit. Die Formulierung gibt den praktischen Nutzen idiomatisch wieder, ohne eine kultische Weihehandlung vorauszusetzen.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Er soll gehen und in sein Haus zurückkehren
  rationale: Die Verbfolge hat im gesetzlichen Zusammenhang anweisenden Charakter. Die Wiedergabe mit „soll“ ist im modernen Deutschen klar und angemessen.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: damit er nicht im Kampf stirbt
  rationale: Gibt die warnende beziehungsweise vorbeugende Funktion von פן natürlich wieder.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: und ein anderer Mann den Ertrag davon hat
  rationale: Bewahrt die ausdrückliche Bezeichnung „ein anderer Mann“ und gibt das zweite Vorkommen desselben Verbs inhaltlich parallel zum ersten wieder.
theological_decisions:
- issue: Bedeutung von חלל beim Weinberg
  choice: als erstmaligen praktischen Nutzen beziehungsweise Ertrag verstanden
  alternative: „ihn weihen“, „ihn entweihen“ oder „ihn in Gebrauch nehmen“
  rationale: Im Zusammenhang eines neu gepflanzten Weinbergs bezeichnet das Verb nicht eindeutig eine kultische Handlung, sondern den Beginn gewöhnlicher Nutzung, wahrscheinlich durch den Genuss seines Ertrags; vgl. 3. Mose 19,23–25. Die Fußnote hält die formelleren Wiedergabemöglichkeiten offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frageform des Hebräischen bleibt erhalten; „Mann“ wird wegen des militärischen Zusammenhangs und der ausdrücklichen maskulinen Form beibehalten. Die idiomatische Haupttextfassung wird durch eine formalere lexikalische Fußnote ergänzt.
