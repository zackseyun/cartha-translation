revisions:
- from: Und welcher Mann hat einen Weinberg gepflanzt, aber noch keinen Ertrag davon gehabt[a]? Er soll gehen und in sein Haus zurückkehren, damit er nicht im Kampf stirbt und ein anderer Mann den Ertrag davon hat.
  to: Und welcher Mann hat einen Weinberg gepflanzt und ihn noch nicht erstmals genutzt[a]? Er soll gehen und in sein Haus zurückkehren, damit er nicht im Kampf stirbt und ein anderer Mann ihn erstmals nutzt.
  rationale: Die Revision ersetzt die auf Ertrag bzw. Gewinn bezogene Umschreibung durch „erstmals nutzen“. Dadurch bleibt die Handlung am Weinberg im Haupttext und im Schlusssatz parallel, ohne „Frucht“ ergänzend einzutragen. Die Fußnote erklärt die kontextuelle Auslegung und wahrt zugleich formellere Übersetzungsmöglichkeiten. Die Konjunktion wird von dem leicht kontrastierenden „aber“ zu „und“ korrigiert.
