id: DEU.20.2
reference: Deuteronomy 20:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֕ה כְּ/קָֽרָבְ/כֶ֖ם אֶל הַ/מִּלְחָמָ֑ה וְ/נִגַּ֥שׁ הַ/כֹּהֵ֖ן וְ/דִבֶּ֥ר אֶל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: de
  text: Wenn ihr euch der Schlacht[a] nähert, soll der Priester vortreten und zum Volk[b] sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Krieg“. Das hebräische Wort מִלְחָמָה kann sowohl Krieg im Allgemeinen als auch eine einzelne Schlacht bezeichnen; hier legt das unmittelbare Heranrücken zum Kampf „Schlacht“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Volk“ ist hier das versammelte israelitische Heer gemeint. Der hebräische Text verwendet jedoch den allgemeineren Ausdruck „Volk“ und nicht eine engere militärische Bezeichnung wie „Truppen“.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Wenn
  rationale: Die Verbindung וְהָיָה mit dem folgenden temporalen Infinitiv leitet einen künftigen Umstand ein; im Deutschen gibt ein temporaler Wenn-Satz dies natürlich wieder.
- source_word: כְּקָרָבְכֶם
  choice: ihr euch nähert
  rationale: Der Infinitiv von קרב mit Suffix der 2. Person Plural wird idiomatisch als temporaler Nebensatz wiedergegeben.
- source_word: אֶל הַמִּלְחָמָה
  choice: der Schlacht
  rationale: מִלְחָמָה kann Krieg oder Schlacht bezeichnen; das unmittelbare Heranrücken zum Kampf spricht hier für „Schlacht“, ohne die weitere Möglichkeit zu verschweigen.
- source_word: וְנִגַּשׁ
  choice: soll ... vortreten
  rationale: נגשׁ bezeichnet das Herantreten; „vortreten“ passt natürlich zur Handlung des Priesters vor seiner Ansprache.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Singular wird ohne sachlich nicht begründete Erweiterung wiedergegeben.
- source_word: וְדִבֶּר
  choice: und ... sprechen
  rationale: דבר im Piel bedeutet gewöhnlich „sprechen“; zusammen mit „soll“ ergibt sich eine natürliche deutsche Koordination.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: הָעָם ist wörtlich „das Volk“. Obwohl hier das versammelte israelitische Heer gemeint ist, bleibt der bewusst breitere Ausdruck erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vortreten“ ist idiomatisch und bewahrt die im hebräischen Verb ausgedrückte Bewegung. Der breitere Ausdruck „Volk“ bleibt erhalten.
