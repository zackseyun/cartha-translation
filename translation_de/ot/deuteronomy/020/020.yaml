  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: de
  text: Nur Bäume, von denen du weißt, dass sie nicht zur Nahrung dienen, darfst du zerstören und fällen und damit Belagerungsanlagen[a] gegen die Stadt errichten, die Krieg gegen dich führt, bis sie fällt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Belagerungswall. Das hebräische Wort kann allgemein Belagerungsbauten bezeichnen und legt keine einzelne Bauform fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: bis du sie niedergezwungen hast. Wörtlich beschreibt die hebräische Wendung das Fallen beziehungsweise Herabkommen der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Ausnahme vom zuvor ausgesprochenen Verbot und bewahrt die einschränkende Kraft des hebräischen Ausdrucks.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: Bäume ... zur Nahrung dienen
  rationale: עֵץ bezeichnet hier lebende Bäume. Die Formulierung gibt עֵץ מַאֲכָל natürlich wieder, ohne es enger als nötig auf eine bestimmte Fruchtart festzulegen.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: von denen du weißt, dass sie nicht ... dienen
  rationale: Die distributive hebräische Einzahl wird im Deutschen idiomatisch als Mehrzahl wiedergegeben; die Feststellung beruht auf erkennbarem Wissen über die Bäume.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: darfst du zerstören und fällen
  rationale: Das Modalverb „darfst“ drückt die im Rechtszusammenhang gewährte Erlaubnis aus. כרת bezeichnet bei Bäumen das Fällen.
- source_word: וּבָנִיתָ מָצוֹר
  choice: damit Belagerungsanlagen errichten
  rationale: מָצוֹר kann verschiedene für eine Belagerung errichtete Anlagen bezeichnen. „Damit“ macht den im Ablauf naheliegenden Bezug zum Holz der gefällten Bäume im Deutschen verständlich.
- source_word: עַל הָעִיר
  choice: gegen die Stadt
  rationale: „Gegen“ gibt die feindliche Ausrichtung der Belagerungsanlagen idiomatisch wieder.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: die Krieg gegen dich führt
  rationale: Dies ist eine natürliche deutsche Wiedergabe des hebräischen Idioms „Krieg machen/führen mit“ und wahrt den fortdauernden Charakter des Partizips.
- source_word: עַד רִדְתָּהּ
  choice: bis sie fällt
  rationale: Die Wendung beschreibt das Fallen beziehungsweise Herabkommen der Stadt und meint im Zusammenhang ihre Einnahme. Die Formulierung bewahrt das Bild und vermeidet eine unnötige Festlegung auf eine aktiv-kausative Deutung.
theological_decisions:
- issue: Handlungsträger bei der Einnahme der Stadt
  choice: bis sie fällt
  alternative: bis du sie zu Fall bringst / niederzwingst
  rationale: Die gewählte Fassung folgt der hebräischen Wendung eng und lässt die im Kontext klare militärische Ursache unausgesprochen, statt die Form ausdrücklich kausativ zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive Einzahl des Hebräischen wird zur besseren Verständlichkeit als Mehrzahl wiedergegeben. Militärische Fachsprache bleibt allgemein genug, um die Bedeutungsbreite von מָצוֹר zu wahren.
