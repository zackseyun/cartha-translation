  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: de
  text: Wenn die Amtsträger ihre Ansprache an das Volk beendet haben, sollen sie die Heerführer an die Spitze des Volkes stellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollen sie Heerführer über das Volk einsetzen“. Das hebräische Verb kann je nach Zusammenhang „einsetzen“, „mustern“ oder „mit der Leitung beauftragen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Wenn … beendet haben
  rationale: Die Verbindung וְהָיָה mit כְּ und Infinitiv führt hier einen temporalen Nebensatz ein; das deutsche Perfekt kennzeichnet den Abschluss der Ansprache vor der folgenden Handlung.
- source_word: הַשֹּׁטְרִים
  choice: die Amtsträger
  rationale: Der Ausdruck bezeichnet im Deuteronomium eingesetzte Verwaltungs- und Ordnungsbeamte. „Amtsträger“ ist verständlich und vermeidet die irreführende Engführung auf Schreiber oder moderne Polizeibeamte.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: ihre Ansprache an das Volk
  rationale: Die substantivische Wendung gibt das Reden zu dem versammelten Volk natürlich wieder, ohne עָם militärisch verengend als „Truppen“ zu übersetzen.
- source_word: וּפָקְדוּ
  choice: sollen sie … stellen
  rationale: פקד kann unter anderem einsetzen, mustern oder mit Verantwortung betrauen bedeuten. Zusammen mit בְּרֹאשׁ bezeichnet es hier am ehesten das Einsetzen beziehungsweise Aufstellen in einer Führungsstellung; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: שָׂרֵי צְבָאוֹת
  choice: die Heerführer
  rationale: שָׂרֵי bezeichnet Führer oder Befehlshaber und צְבָאוֹת militärische Verbände. „Heerführer“ gibt die Konstruktion knapp und in würdigem, verständlichem Deutsch wieder.
- source_word: בְּרֹאשׁ הָעָם
  choice: an die Spitze des Volkes
  rationale: Die Formulierung bewahrt das hebräische Bild vom Haupt beziehungsweise der Spitze und bezeichnet zugleich die Führungsstellung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Amtsträger“ vermeidet sowohl das missverständliche „Schreiber“ als auch die moderne polizeiliche Bedeutung von „Beamte“. Die Wortstellung bewahrt das Bild von der Spitze des Volkes; die Fußnote hält die echte Bedeutungsbreite von פקד offen.
