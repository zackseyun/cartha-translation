base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: de
  text: Und wer ist der Mann, der sich mit einer Frau verlobt hat[a], sie aber noch nicht zur Frau genommen hat[b]? Er soll gehen und nach Hause zurückkehren, damit er nicht im Krieg stirbt und ein anderer Mann sie zur Frau nimmt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verlobung war eine förmliche und rechtlich verbindliche Zusage zur Ehe.
    reason: cultural_note
  - marker: b
    text: „Sie zur Frau nehmen“ bedeutet hier, die Eheschließung zu vollenden und sie als Ehefrau zu sich zu nehmen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „und ein anderer Mann sie heiratet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Und wer ist der Mann
  rationale: Bewahrt die rhetorische Frage, die nächste von der Heeresteilnahme ausgenommene Personengruppe einführt, sowie die maskuline Einzahl des militärischen Zusammenhangs.
- source_word: אֵרַשׂ אִשָּׁה
  choice: sich mit einer Frau verlobt hat
  rationale: Das Verb bezeichnet die förmliche Verlobung vor der vollständigen Eheschließung. Die gewählte Formulierung ist im heutigen Standarddeutsch natürlich; eine Fußnote weist auf das stärkere rechtliche Gewicht der damaligen Verlobung hin.
- source_word: וְלֹא לְקָחָהּ
  choice: sie aber noch nicht zur Frau genommen hat
  rationale: Bewahrt das hebräische Heiratsidiom und den Gegensatz zwischen Verlobung und vollzogener Eheschließung. „Aber noch nicht“ gibt diesen Gegensatz im Deutschen klar wieder.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Er soll gehen und in sein Haus zurückkehren
  rationale: Gibt die anweisende Aussage im Kontext der militärischen Freistellung wieder und hält sich mit „Haus“ eng an das hebräische Substantiv.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: damit er nicht in der Schlacht stirbt
  rationale: פֶּן leitet hier eine abzuwendende Möglichkeit ein. „Damit nicht“ ist gegenwärtiges, würdevolles Deutsch; „in der Schlacht“ bezieht sich auf den bevorstehenden Kampf.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: und ein anderer Mann sie zur Frau nimmt
  rationale: Die Wiederholung von לקח wird mit derselben deutschen Heiratswendung wiedergegeben. Dadurch bleibt die sprachliche Entsprechung zwischen der noch nicht vollzogenen und der möglicherweise von einem anderen eingegangenen Ehe sichtbar.
