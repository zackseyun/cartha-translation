  naturalness: Der Satz ist insgesamt verständlich und würdevoll. „… gehen und in sein Haus zurückkehren“ klingt im modernen Deutsch weniger idiomatisch als „… gehen und nach Hause zurückkehren“.
  terminology: '„Sich mit einer Frau verloben“ und „sie zur Frau nehmen“ geben die ehebezogenen hebräischen Ausdrücke angemessen wieder. Die Fußnote c enthält allerdings einen grammatischen Fehler: „sie heiratet“ würde die Frau zum Subjekt machen; gemeint ist, dass ein anderer Mann sie heiratet.'
