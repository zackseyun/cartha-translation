  to: Und wer ist der Mann, der sich mit einer Frau verlobt hat[a], sie aber noch nicht zur Frau genommen hat[b]? Er soll gehen und nach Hause zurückkehren, damit er nicht im Krieg stirbt und ein anderer Mann sie zur Frau nimmt[c].
