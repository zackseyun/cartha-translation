source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם הַ/הֹלֵ֖ךְ עִמָּ/כֶ֑ם לְ/הִלָּחֵ֥ם לָ/כֶ֛ם עִם אֹיְבֵי/כֶ֖ם לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: de
  text: Denn Jahwe, euer Gott, ist es, der mit euch geht, um für euch gegen eure Feinde zu kämpfen und euch zu retten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch zu befreien“ oder „euch den Sieg zu geben“. Das hebräische Verb kann Rettung oder Befreiung bezeichnen; hier steht es im Zusammenhang eines Kampfes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Ermutigung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Form enthält ein Suffix der 2. Person Plural und bezeichnet Gott in der direkten Anrede Israels.
- source_word: הַהֹלֵךְ
  choice: ist es, der … geht
  rationale: Diese Formulierung bewahrt den beschreibenden und hervorhebenden Charakter des Partizips und klingt zugleich natürlich.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die Präpositionalverbindung bezeichnet Jahwes Begleitung und Gegenwart bei seinem Volk.
- source_word: לְהִלָּחֵם לָכֶם
  choice: um für euch … zu kämpfen
  rationale: Der Infinitiv bezeichnet den Zweck seines Mitgehens; לָכֶם drückt aus, dass der Kampf zugunsten Israels geführt wird.
- source_word: עִם אֹיְבֵיכֶם
  choice: gegen eure Feinde
  rationale: Im Zusammenhang mit dem Verb „kämpfen“ bezeichnet עִם die gegnerische Seite; idiomatisches Deutsch verlangt „gegen“.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: und euch zu retten
  rationale: Das Hifil von ישׁע bezeichnet Retten oder Befreien. „Retten“ wahrt die breite biblische Bedeutung, während der unmittelbare Zusammenhang militärische Befreiung und Sieg einschließt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von לְהוֹשִׁיעַ im Kriegskontext
  choice: euch zu retten
  alternative: euch zu befreien; euch den Sieg zu geben
  rationale: „Retten“ erhält die umfassendere Bedeutung des Verbs und seine theologische Resonanz. Zugleich lässt die Fußnote erkennen, dass hier konkret Befreiung beziehungsweise Sieg im Kampf gemeint sein kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „ist es, der“ gibt die Hervorhebung des hebräischen Partizips wieder; „um … zu kämpfen und … zu retten“ macht die beiden Zweckangaben klar, ohne ihren Zusammenhang aufzulösen.
