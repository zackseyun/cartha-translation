base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: de
  text: Nur die Frauen, die kleinen Kinder, das Vieh und alles, was in der Stadt ist – ihre ganze Beute – darfst du als Beute für dich nehmen. Und die Beute deiner Feinde, die Jahwe, dein Gott, dir gegeben hat, darfst du essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb lautet wörtlich „essen“. In diesem Zusammenhang kann es auch den Gebrauch oder Verbrauch des Erbeuteten einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Kennzeichnet hier die Ausnahme vom unmittelbar vorausgehenden Tötungsgebot; „Doch“ stellt den Gegensatz im Deutschen natürlich her.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: Gibt den bestimmten Plural unmittelbar und ohne Verallgemeinerung wieder.
- source_word: הַטַּף
  choice: die kleinen Kinder
  rationale: טַף bezeichnet typischerweise Kleinkinder beziehungsweise die jungen, abhängigen Angehörigen; die Formulierung wahrt diesen engeren Sinn.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Bezeichnet in diesem Beutekontext domestizierte Nutztiere; „Tiere“ wäre zu weit und „Rinder“ zu eng.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: und alles, was in der Stadt ist
  rationale: Bewahrt den umfassenden Charakter der hebräischen Wendung in geläufigem Deutsch.
- source_word: כָּל שְׁלָלָהּ
  choice: ihre gesamte Beute
  rationale: שָׁלָל bezeichnet Kriegsbeute; das feminine Suffix bezieht sich auf die Stadt.
- source_word: תָּבֹז לָךְ
  choice: darfst du für dich plündern
  rationale: בזז wird mit „plündern“ direkt wiedergegeben; „darfst“ vermittelt im rechtlichen Zusammenhang die erlaubende Kraft, ohne einen bloßen Zukunftssinn anzunehmen.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: Du darfst von der Beute deiner Feinde zehren
  rationale: אָכַל bedeutet wörtlich „essen“, kann hier aber das Nutzen oder Verbrauchen der Beute bezeichnen. „Von … zehren“ erhält das Bild und ist im Deutschen auch auf den Nutzen aus Gütern ausdehnbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: die Jahwe, dein Gott, dir gegeben hat
  rationale: Das Perfekt wird als bereits vollzogene beziehungsweise gewährte Gabe Gottes wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als solcher bewahrt, statt ihn durch einen Titel zu ersetzen.
- issue: Modalität der Verben in der Rechtsanweisung
  choice: 'erlaubend: „darfst du“'
  alternative: 'verpflichtend: „sollst du“; futurisch: „wirst du“'
  rationale: Der Zusammenhang regelt, was mit der Beute geschehen darf. Die erlaubende Übersetzung passt zur instruktiven Funktion, ohne die hebräische Form als bloße Vorhersage zu behandeln.
- issue: Bedeutungsumfang von ואכלת bei Kriegsbeute
  choice: „von der Beute … zehren“ mit Fußnote zur wörtlichen Bedeutung
  alternative: „die Beute … essen“; „die Beute … nutzen“
  rationale: Die Formulierung bewahrt die hebräische Essensmetapher, lässt aber erkennen, dass die gesamte Beute und nicht nur Nahrung gemeint sein kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die appositionelle Zusammenfassung „ihre gesamte Beute“ ab. „Zehren“ ist bewusst bildhaft, aber noch allgemein verständlich; die Fußnote wahrt den wörtlichen Wortlaut und dessen Bedeutungsbreite.
