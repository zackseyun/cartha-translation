review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die Aufzählung, den Gottesnamen und die rechtlich-instruktive Modalität im Grundsatz. „Doch“ schwächt jedoch die restriktive Ausnahmefunktion von רַק gegenüber dem präziseren „Nur“ ab. Vor allem bedeutet „für dich plündern“ im Deutschen eher gewaltsames Ausplündern als das Aneignen von bereits als Beute bezeichneten Gütern; תָּבֹז לָךְ ist hier besser als „als Beute ... nehmen“ wiederzugeben. „Von der Beute ... zehren“ bezeichnet gewöhnlich, wovon man seinen Lebensunterhalt bestreitet, und gibt אָכַל nicht ausreichend unmittelbar wieder.
  naturalness: Die revidierte Fassung ist modernes Standarddeutsch. „Als Beute für dich nehmen“ ist in diesem historischen Rechts- und Kriegskontext klarer als „für dich plündern“. Die wörtliche Wiedergabe „die Beute ... essen“ ist absichtlich markiert, aber durch die Fußnote verständlich gemacht und dem hebräischen Bild näher als „zehren“.
  terminology: „Jahwe, dein Gott“, „Vieh“ und „Beute“ sind treffend. „Nur“, „als Beute nehmen“ und „essen“ bewahren die einschlägigen Wiederholungen und den Bedeutungsumfang des Hebräischen, ohne die Aussage durch eine modernisierende Deutung einzuengen.
  issues:
  - severity: medium
    issue: „Doch“ für רַק
    rationale: רַק markiert hier primär die Einschränkung bzw. Ausnahme. „Nur“ bildet diese Restriktion unmittelbarer ab; „Doch“ legt stärker einen bloßen Gegensatz nahe.
  - severity: high
    issue: „darfst du für dich plündern“ für תָּבֹז לָךְ
    rationale: „Plündern“ beschreibt im heutigen Deutsch vor allem das gewaltsame Ausrauben eines Ortes. Der hebräische Ausdruck bezieht sich hier auf das Nehmen von Kriegsbeute; „als Beute für dich nehmen“ ist genauer.
  - severity: medium
    issue: „von der Beute ... zehren“ für וְאָכַלְתָּ
    rationale: „Zehren von“ bedeutet meist, von etwas zu leben oder sich über längere Zeit daraus zu erhalten. אָכַל lautet wörtlich „essen“ und kann im Kontext erweiterten Gebrauch bzw. Verbrauch einschließen; die wörtliche Hauptübersetzung mit erläuternder Fußnote wahrt beides besser.
  revised_text: Nur die Frauen, die kleinen Kinder, das Vieh und alles, was in der Stadt ist – ihre ganze Beute – darfst du als Beute für dich nehmen. Und die Beute deiner Feinde, die Jahwe, dein Gott, dir gegeben hat, darfst du essen.[a]
