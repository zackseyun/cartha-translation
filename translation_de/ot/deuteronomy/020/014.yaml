revisions:
- from: Doch die Frauen, die kleinen Kinder, das Vieh und alles, was in der Stadt ist – ihre gesamte Beute – darfst du für dich plündern. Du darfst von der Beute deiner Feinde zehren,[a] die Jahwe, dein Gott, dir gegeben hat.
  to: Nur die Frauen, die kleinen Kinder, das Vieh und alles, was in der Stadt ist – ihre ganze Beute – darfst du als Beute für dich nehmen. Und die Beute deiner Feinde, die Jahwe, dein Gott, dir gegeben hat, darfst du essen.[a]
  rationale: Die Revision ersetzt die kontextuell ungenaueren bzw. im Deutschen missverständlichen Ausdrücke „Doch“, „für dich plündern“ und „von ... zehren“. Sie erhält die historische Aussage, die erlaubende Formulierung, die vollständige Aufzählung, die Beuteterminologie und die Wiedergabe des Gottesnamens. Die Fußnote ist an die wörtliche Wiedergabe von אָכַל gesetzt und erläutert deren möglichen erweiterten Kontextumfang.
  reviewer_model: gpt-5.6-terra
