base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: de
  text: Wenn du dich einer Stadt näherst, um gegen sie zu kämpfen, sollst du ihr Frieden anbieten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sollst du ihr Frieden zurufen“; sinngemäß auch: „sollst du ihr Friedensbedingungen anbieten“.'
    reason: Die Fußnote bewahrt die konkrete Ausdrucksweise des Hebräischen und nennt zugleich eine mögliche kontextuelle Wiedergabe.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion leitet hier eine situationsbezogene Anweisung ein. „Wenn“ ist im Deutschen für einen solchen Rechtsfall natürlich und bewahrt zugleich die mögliche konditionale Färbung.
- source_word: תִקְרַב
  choice: du dich … näherst
  rationale: Das Qal von קרב bezeichnet das Sichnähern. Die reflexive deutsche Form ist idiomatisch und gibt die konkrete Annäherung an die Stadt wieder.
- source_word: עִיר
  choice: einer Stadt
  rationale: Der unbestimmte Singular entspricht der allgemeinen Fallbeschreibung.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: um gegen sie zu kämpfen
  rationale: Die Zweckangabe und die feindliche Ausrichtung werden eng am Hebräischen wiedergegeben; „sie“ bezieht sich grammatisch passend auf „Stadt“.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: sollst du ihr Frieden anbieten
  rationale: Wörtlich steht etwa „ihr zum Frieden zurufen“. Im Zusammenhang bezeichnet die Wendung einen Friedensaufruf beziehungsweise ein Friedensangebot; „Frieden anbieten“ ist klares, heutiges Deutsch, ohne konkrete Vertragsbedingungen in den Text hineinzulesen.
theological_decisions:
- issue: Reichweite und Inhalt des Friedensangebots
  choice: Die Übersetzung spricht allgemein von einem Friedensangebot.
  alternative: „Friedensbedingungen verkünden“
  rationale: Der hebräische Ausdruck nennt Frieden, legt hier aber noch nicht ausdrücklich bestimmte Bedingungen fest. Diese werden im folgenden Vers erläutert; daher sollte Vers 10 sie nicht vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und rechtsförmig; „Frieden anbieten“ ist verständlicher als die unidiomatische wörtliche Wendung, während die Fußnote deren Form sichtbar hält.
