base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: de
  text: Wenn du eine Stadt viele Tage lang belagerst und gegen sie kämpfst, um sie einzunehmen, sollst du ihre Bäume nicht zerstören, indem du eine Axt gegen sie schwingst; denn von ihnen kannst du essen. Du sollst sie nicht fällen. Denn ist der Baum auf dem Feld etwa ein Mensch, dass er dir bei der Belagerung entgegenkäme?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn der Mensch ist ein Baum des Feldes“, oder sinngemäß: „Denn der Baum des Feldes dient dem Menschen zur Nahrung.“ Der hebräische Schlusssatz ist schwer zu deuten. Der Haupttext versteht ihn als rhetorische Frage, die einen Baum von einem menschlichen Kriegsgegner unterscheidet.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: belagerst
  rationale: Das Verb bezeichnet hier das militärische Belagern einer Stadt; „belagern“ ist präzise und im Deutschen idiomatisch.
- source_word: יָמִים רַבִּים
  choice: viele Tage lang
  rationale: Die Wendung gibt die lange Dauer der Belagerung konkret wieder und bleibt nah am hebräischen Ausdruck.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: gegen sie kämpfst, um sie einzunehmen
  rationale: „Einnehmen“ ist für die Eroberung einer belagerten Stadt natürlicher als das allgemeinere „ergreifen“ und bewahrt den militärischen Zusammenhang.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: sollst du ihre Bäume nicht zerstören
  rationale: Der Hifil von שׁחת bezeichnet Zerstören oder Verderben; „zerstören“ gibt die Stärke des Verbots klar wieder.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: indem du die Axt gegen sie schwingst
  rationale: Die konkrete Handlung wird in natürlichem Deutsch wiedergegeben. Das singularische Bezugswort im Hebräischen wird nach dem deutschen Plural „Bäume“ mit „sie“ aufgenommen.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: denn du kannst von ihnen essen
  rationale: Die Begründung hebt den Nutzen der Bäume als Nahrungsspender hervor; „kannst“ drückt diesen kontextuellen Sinn aus, ohne ein ausdrückliches Gebot hinzuzufügen.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: Du sollst sie nicht fällen
  rationale: כרת ist das übliche Verb für das Fällen von Bäumen. Ein eigener kurzer Satz erhält die nachdrückliche Wiederholung des Verbots.
- source_word: הָאָדָם עֵץ הַשָּׂדֶה
  choice: ist der Baum auf dem Feld etwa ein Mensch
  rationale: Die rhetorische Frage stellt den Baum einem menschlichen Kriegsgegner gegenüber. „Etwa“ kennzeichnet die erwartete verneinende Antwort, ohne sie ausdrücklich einzusetzen.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: dass du ihn belagern müsstest
  rationale: 'Die schwierige hebräische Wendung wird entsprechend der rhetorischen Deutung idiomatisch wiedergegeben: Ein Baum ist kein menschlicher Gegner, gegen den sich die Belagerung richtet. Die abweichenden Deutungen werden in der Fußnote bewahrt.'
theological_decisions:
- issue: Deutung von כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Rhetorische Frage, die den Baum auf dem Feld von einem menschlichen Kriegsgegner unterscheidet
  alternative: 'Aussagesatz: „Denn der Mensch ist ein Baum des Feldes“; oder sinngemäß: „Denn der Baum des Feldes dient dem Menschen zur Nahrung“'
  rationale: Der hebräische Satzbau ist schwierig und lässt mehrere historisch vertretene Deutungen zu. Im Zusammenhang erklärt die rhetorische Lesart, warum ein nahrungsspendender Baum nicht wie ein Gegner behandelt werden soll. Da die Mehrdeutigkeit echt ist, werden die anderen Deutungen nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Terminologie. Die Wiederholung des Fällverbots bleibt zur Wahrung des hebräischen Nachdrucks erhalten; die schwierige Schlussklausel wird im Haupttext verständlich formuliert, ihre echte Mehrdeutigkeit jedoch in der Fußnote offengelegt.
