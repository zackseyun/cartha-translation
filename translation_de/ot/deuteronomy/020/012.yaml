base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: de
  text: Wenn sie aber keinen Frieden mit dir schließt, sondern Krieg gegen dich führt, dann sollst du sie belagern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Wenn … aber keinen
  rationale: Das einleitende וְ markiert hier im Zusammenhang den Gegensatz zum friedlichen Ausgang des vorherigen Verses; „aber“ gibt diesen Kontrast natürlich wieder.
- source_word: תַשְׁלִים עִמָּךְ
  choice: Frieden mit dir schließt
  rationale: Der Hifil von שׁלם bezeichnet hier das Eingehen oder Schließen friedlicher Beziehungen. „Frieden schließen“ ist im Deutschen idiomatisch und wahrt den aktiven Sinn.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: sondern Krieg gegen dich führt
  rationale: Die Wendung עשה מלחמה bedeutet, Krieg zu führen. Nach der Verneinung gibt „sondern“ den sachlichen Gegensatz klar wieder; „gegen dich“ entspricht der feindlichen Bedeutung von עִם im Kontext.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: dann sollst du sie belagern
  rationale: צור bezeichnet hier die Belagerung einer Stadt. Die deutsche Konstruktion nimmt עָלֶיהָ idiomatisch als direktes Objekt auf; „sollst“ gibt den anweisenden Charakter des Rechtstextes wieder.
