translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Anweisung. Das feminine Pronomen „sie“ nimmt die im Kontext genannte Stadt auf. Keine Fußnote ist nötig, da die wesentlichen hebräischen Wendungen ohne Verlust oder vorschnelle theologische Festlegung natürlich wiedergegeben werden können.
