  source_fidelity: Der Entwurf gibt die Fortsetzungsformel von וְיָסְפוּ לְדַבֵּר, die Funktion der שֹׁטְרִים, die doppelte Charakterisierung »furchtsam und weich/zart am Herzen«, die direktive Rückkehr ins Haus und die beabsichtigte Vermeidung der Entmutigung der Brüder zuverlässig wieder. »damit er nicht« gibt den im Kontext abschirmenden Sinn von וְלֹא angemessen wieder. Der Vergleich mit dem eigenen Herzen bleibt durch »wie sein eigenes« erhalten.
