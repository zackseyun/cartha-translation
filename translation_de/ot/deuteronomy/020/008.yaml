source:
  edition: WLC
  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: de
  text: 'Weiter sollen die Amtsträger zum Volk sprechen und sagen: »Welcher Mann fürchtet sich und ist mutlos?[a] Er soll gehen und in sein Haus zurückkehren, damit er nicht das Herz seiner Brüder[b] ebenso mutlos macht wie sein eigenes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der sich fürchtet und weich beziehungsweise zart am Herzen ist«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüdern« sind hier seine israelitischen Volks- oder Kampfgefährten gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: Weiter sollen
  rationale: יסף mit folgendem Infinitiv bedeutet in dieser Wendung, mit einer Handlung fortzufahren. »Weiter sollen« gibt sowohl den Anschluss als auch die Fortsetzung knapp und natürlich wieder.
- source_word: הַשֹּׁטְרִים
  choice: die Amtsträger
  rationale: שֹׁטְרִים bezeichnet hier eingesetzte Verwaltungs- beziehungsweise Heeresfunktionäre, nicht Polizisten im heutigen Sinn. »Amtsträger« vermeidet diese moderne Fehlassoziation.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: fürchtet sich und ist mutlos
  rationale: Die Formulierung verbindet Furcht mit dem wörtlich »weichen/zarten Herzen«. »Mutlos« erschließt die militärische Bedeutung, während die Fußnote das hebräische Bild ausweist.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Er soll gehen und in sein Haus zurückkehren
  rationale: Die Imperfektformen haben hier auffordernden Sinn. »In sein Haus« hält die konkrete Ausdrucksweise des Hebräischen fest.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: damit er nicht das Herz seiner Brüder ebenso mutlos macht
  rationale: מסס beschreibt bildhaft ein schmelzendes und dadurch den Mut verlierendes Herz. Da im Hebräischen »das Herz seiner Brüder« als Objekt steht, wird die verursachende Wirkung auf die anderen Soldaten im Deutschen ausdrücklich und verständlich wiedergegeben.
- source_word: כִּלְבָבוֹ
  choice: wie sein eigenes
  rationale: Das ausgelassene Substantiv »Herz« wird im Deutschen durch »sein eigenes« aufgenommen; so bleibt der Vergleich mit seinem eigenen Herzen erhalten, ohne schwerfällige Wiederholung.
theological_decisions:
- issue: Geschlechtsspezifische Sprache im militärischen Zusammenhang
  choice: »Mann« und »Brüder« im Haupttext beibehalten
  alternative: »Mensch« und »Kameraden/Mitsoldaten«
  rationale: Der hebräische Text spricht im militärischen Kontext ausdrücklich von einem Mann und verwendet männliche Verwandtschaftssprache. Die Übersetzung bewahrt diese soziale und sprachliche Gestalt; eine Fußnote erklärt den kontextuellen Bezug von »Brüder«.
- issue: Metapher des schmelzenden Herzens
  choice: Die gemeinte Entmutigung mit »mutlos macht« wiedergeben
  alternative: »das Herz … zum Schmelzen bringt«
  rationale: Die wörtliche deutsche Formulierung wäre in diesem Satz unnatürlich und könnte körperlich missverstanden werden. »Mutlos macht« vermittelt die im Kontext klare Wirkung, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Ablauf, wird aber idiomatisch geglättet. »Amtsträger« ist bewusst formeller als »Verantwortliche« und vermeidet die heutige Bedeutung von »Polizisten«; »mutlos« ist allgemein verständlich und für den militärischen Zusammenhang passend.
