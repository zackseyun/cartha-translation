  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: de
  text: Sieh, Jahwe, dein Gott, hat dir das Land gegeben. Zieh hinauf und nimm es in Besitz, wie Jahwe, der Gott deiner Väter, zu dir gesagt hat. Fürchte dich nicht und lass dich nicht entmutigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als Aufmerksamkeitssignal. „Sieh“ bewahrt die direkte Kraft und klingt würdig, ohne altertümlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Konstruktion mit Suffix der 2. Person Maskulin Singular bezeichnet in der Bundesansprache „dein Gott“.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: hat dir ... vor Augen gestellt
  rationale: Die deutsche Wendung gibt das Vorlegen beziehungsweise Bereitstellen des Landes wieder und bewahrt das Bild von לְפָנֶיךָ.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Kontext bezeichnet der Ausdruck das Land, in das Israel einziehen soll; „Land“ ist präzise und geläufig.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: Der Imperativ bezeichnet das Hinaufziehen in das Bergland; „zieh hinauf“ passt zudem zur gemeinschaftlichen Bewegung Israels.
- source_word: רֵשׁ
  choice: nimm es in Besitz
  rationale: Der Imperativ von ירשׁ verbindet hier aktives Inbesitznehmen mit dem von Gott bereitgestellten Land.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: wie ... gesagt hat
  rationale: דבר bedeutet hier „reden/sagen“; die Übersetzung vermeidet, das im Kontext mögliche Versprechen ausdrücklich in das Verb hineinzulesen.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: der Gott deiner Väter
  rationale: Die Übersetzung bewahrt die ausdrücklich männliche, familiäre Bundesformel des Hebräischen.
- source_word: לָךְ
  choice: zu dir
  rationale: Die Dativangabe bezeichnet den Adressaten des Redens und wird im Deutschen idiomatisch mit „zu dir“ wiedergegeben.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die geläufige deutsche Formulierung gibt das direkte Verbot präzise und in würdigem Register wieder.
- source_word: וְאַל תֵּחָת
  choice: und lass dich nicht entmutigen
  rationale: חתת bezeichnet das innerliche Gebrochen- oder Eingeschüchtertwerden. „Lass dich nicht entmutigen“ ist natürliches modernes Deutsch und unterscheidet sich noch ausreichend von „fürchte dich nicht“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bundesformel אֱלֹהֵי אֲבֹתֶיךָ
  choice: der Gott deiner Väter
  alternative: der Gott deiner Vorfahren
  rationale: „Väter“ entspricht dem ausdrücklich maskulinen Plural und bewahrt die traditionelle familiäre Bundesformel, ohne sie zu verallgemeinern.
- issue: Charakter der göttlichen Aussage in כַּאֲשֶׁר דִּבֶּר
  choice: wie ... gesagt hat
  alternative: wie ... versprochen hat
  rationale: Der Kontext kann eine Verheißung einschließen, doch das Verb selbst bedeutet „reden/sagen“. Die Übersetzung lässt diese theologische Bedeutungsweite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter singularischer Anrede. Die Satzstruktur bleibt nah am Hebräischen, wird aber idiomatisch geglättet. Keine Fußnote ist nötig; insbesondere ist „Väter“ bereits quellennah und verständlich.
