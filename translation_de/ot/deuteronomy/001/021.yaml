  to: Sieh, Jahwe, dein Gott, hat dir das Land gegeben. Zieh hinauf und nimm es in Besitz, wie Jahwe, der Gott deiner Väter, zu dir gesagt hat. Fürchte dich nicht und lass dich nicht entmutigen.
  rationale: Die Revision beschränkt sich auf die Wiedergabe von נתן. Sie stellt klar, dass Jahwe das Land gegeben hat, statt es lediglich „vor Augen“ zu stellen. Satzfolge, direkte singularische Anrede, Gottesname, Bundesformel und die differenzierte doppelte Ermutigung bleiben erhalten. Eine Fußnote ist nicht erforderlich.
