  text: אַחַ֨ד עָשָׂ֥ר יוֹם֙ מֵֽ/חֹרֵ֔ב דֶּ֖רֶךְ הַר שֵׂעִ֑יר עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: de
  text: Vom Horeb bis Kadesch-Barnea sind es auf dem Weg über das Bergland Seïr elf Tagesreisen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „elf Tage“. Gemeint ist die Reisezeit auf dieser Route.'
    reason: lexical_alternative
  - marker: b
    text: Im hebräischen Text steht „Horeb“; dieser Name wird häufig mit dem Sinai in Verbindung gebracht.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: elf Tagesreisen
  rationale: Die wörtlich knappe Zeitangabe bezeichnet idiomatisch die Reisedauer. „Elf Tagesreisen“ gibt diesen Sinn natürlich wieder, ohne ein Verb in den hebräischen Nominalsatz hineinzulesen.
- source_word: מֵחֹרֵב
  choice: vom Horeb
  rationale: Der Ortsname חֹרֵב wird entsprechend dem hebräischen Text als „Horeb“ wiedergegeben und nicht durch „Sinai“ ersetzt.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: auf dem Weg zum Bergland Seïr
  rationale: דֶּרֶךְ bezeichnet hier die Route. הַר kann sowohl einen einzelnen Berg als auch eine Bergregion bezeichnen; im Zusammenhang mit Seïr ist „Bergland“ eine sachgerechte Wiedergabe. Die Konstruktion kann als Weg in Richtung Seïr verstanden werden.
- source_word: עַד
  choice: bis
  rationale: עַד kennzeichnet hier den geografischen Endpunkt der Strecke.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kadesch-Barnea
  rationale: Der zusammengesetzte Ortsname wird in einer etablierten deutschen Transliteration mit Bindestrich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Standardsprache. Der knappe hebräische Nominalsatz wird im Deutschen idiomatisch formuliert; die geografische Mehrdeutigkeit von הַר wird durch „Bergland“ berücksichtigt.
