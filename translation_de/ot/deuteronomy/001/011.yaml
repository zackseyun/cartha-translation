  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: de
  text: Jahwe, der Gott eurer Väter, mache euch tausendmal so zahlreich, wie ihr seid, und segne euch, wie er zu euch gesprochen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: der Gott eurer Väter
  rationale: Die wörtliche und bündnisgeschichtlich geprägte Wendung des Hebräischen bleibt erhalten.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: mache euch noch tausendmal so zahlreich, wie ihr jetzt seid
  rationale: Die Form drückt einen Segenswunsch aus. Die natürliche deutsche Formulierung gibt die gemeinte Vermehrung wieder; „noch“ nimmt den Gedanken des Hinzufügens auf, und „wie ihr jetzt seid“ verdeutlicht den Bezug auf die gegenwärtige Zahl.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: und segne euch
  rationale: Der zweite Verbalsatz führt denselben Segenswunsch fort.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: wie er es euch zugesagt hat
  rationale: „Zugesagt“ gibt im Segenskontext den Sinn des Sprechens verbindlich und idiomatisch wieder; eine Fußnote bewahrt die wörtlichere Möglichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Bundesnamen; die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Ahnenbezeichnung אֲבֹתֵיכֶם
  choice: eurer Väter
  alternative: eurer Vorfahren
  rationale: „Väter“ entspricht der ausdrücklich maskulinen Form und bewahrt den patriarchalisch-bündnisgeschichtlichen Anklang.
- issue: Bedeutung von דִּבֶּר im Segenskontext
  choice: zugesagt hat
  alternative: zu euch gesprochen hat
  rationale: Der Zusammenhang legt eine göttliche Zusage nahe, doch die breitere, wörtliche Bedeutung des Verbs wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Segenswunsch wird mit Konjunktiv I („mache“, „segne“) formuliert. „Tausendmal so zahlreich“ ist verständlich und bewahrt die starke zahlenmäßige Steigerung des Hebräischen.
