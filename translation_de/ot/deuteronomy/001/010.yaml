base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: de
  text: 'Jahwe, euer Gott, hat euch vermehrt, und seht: Heute seid ihr so zahlreich wie die Sterne am Himmel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und seht, heute seid ihr wie die Sterne des Himmels an Zahl.“'
    reason: Die Fußnote bewahrt die formalere Struktur von וְהִנְּכֶם הַיּוֹם כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב, einschließlich der aufmerksamkeitslenkenden Partikel, während der Haupttext sie idiomatisch wiedergibt.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Im Bundeskontext bezeichnet אֱלֹהִים hier den einen Gott; das Suffix der 2. Person Plural wird mit „euer“ wiedergegeben.
- source_word: הִרְבָּה אֶתְכֶם
  choice: hat euch vermehrt
  rationale: Der Hifil von רבה bezeichnet das Zahlreichmachen beziehungsweise Vermehren. Die Formulierung ist im Deutschen natürlich und bewahrt den Anklang an die Verheißung großer Nachkommenschaft.
- source_word: וְהִנְכֶם
  choice: und seht
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf den gegenwärtigen Zustand. „Seht“ gibt diese rhetorische Funktion in heutigem Deutsch wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die zeitliche Angabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: wie die Sterne am Himmel
  rationale: Die Wendung gibt den Vergleich natürlich wieder; „am Himmel“ entspricht im Deutschen dem gemeinten Bild besser als das formalere „des Himmels“.
- source_word: לָרֹב
  choice: so zahlreich
  rationale: לָרֹב bezeichnet hier die große Menge beziehungsweise Zahl. Zusammen mit כְּ wird daraus idiomatisch der Vergleich „so zahlreich wie“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen und verwendet die im modernen Deutschen geläufige Umschrift.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und seht:“ erhält den aufmerksamkeitslenkenden Charakter des Hebräischen, ohne das altertümlich wirkende „siehe“ zu verwenden.
