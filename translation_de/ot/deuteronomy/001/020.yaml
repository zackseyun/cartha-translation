source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: de
  text: 'Und ich sagte zu euch[a]: »Ihr seid bis zum Bergland der Amoriter gekommen, das Jahwe, unser Gott, uns gibt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Berg der Amoriter“. Das hebräische Wort kann einen einzelnen Berg oder umfassender ein Bergland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und ich sagte“ bewahrt den schlichten Anschluss des Hebräischen.
- source_word: אֲלֵכֶם
  choice: zu euch
  rationale: Die Form bezeichnet die zweite Person Plural; „euch“ gibt sie im Deutschen eindeutig wieder.
- source_word: בָּאתֶם
  choice: Ihr seid … gekommen
  rationale: Das Qal-Perfekt bezeichnet das erreichte Ziel; das deutsche Perfekt klingt in direkter Rede natürlich und bewahrt den Gegenwartsbezug.
- source_word: עַד
  choice: bis in
  rationale: Bei einer Bewegung markiert עַד den erreichten Endpunkt. Zusammen mit „Bergland“ ist „bis in“ im Deutschen natürlich.
- source_word: הַר הָאֱמֹרִי
  choice: das Bergland der Amoriter
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen; im geografischen Zusammenhang ist „Bergland“ am treffendsten. Der Gentilname ist kollektiv zu verstehen.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen bezieht sich auf das sächliche Substantiv „Bergland“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Konstruktform mit Suffix der ersten Person Plural wird unmittelbar wiedergegeben.
- source_word: נֹתֵן לָנוּ
  choice: uns gibt
  rationale: Das Partizip beschreibt eine gegenwärtige beziehungsweise unmittelbar bevorstehende Gabe. Das deutsche Präsens bewahrt diese Offenheit und ist idiomatischer als eine Verlaufsform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen Gottes. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Zeitlicher Aspekt von נֹתֵן
  choice: uns gibt
  alternative: uns geben wird
  rationale: Das Partizip lässt die Gabe als gegenwärtig oder unmittelbar bevorstehend erscheinen. Das Präsens bewahrt diese Spannung, ohne die Aussage ausschließlich auf die Zukunft festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bergland“ gibt die regionale Bedeutung von הַר im Kontext klar wieder; deshalb ist keine Fußnote erforderlich. Die Wortstellung „Jahwe, unser Gott“ bleibt nah am Hebräischen und klingt zugleich natürlich.
