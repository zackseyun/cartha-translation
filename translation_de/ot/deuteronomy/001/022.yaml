  source_fidelity: 'Der Vers wird insgesamt genau wiedergegeben: das Herantreten aller, der Kohortativ „Lasst uns“, die vorausgesandten Männer, das Erkunden des Landes sowie der Bericht über Route und Städte entsprechen dem hebräischen Text. „Hinaufziehen“ bewahrt die Bewegungsmetapher von עָלָה.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und liest sich flüssig. „Vor uns hersenden“, „Bericht erstatten“ und „in die wir kommen werden“ sind idiomatisch und dem Register angemessen.
  terminology: „Männer“ ist für אֲנָשִׁים in diesem Kontext treffend. „Erkunden“ gibt חָפַר sachlich wieder, ohne eine verdeckte Spionagetätigkeit zu behaupten. „Hinaufziehen“ ist als biblisch geprägte, aber verständliche Formulierung passend.
