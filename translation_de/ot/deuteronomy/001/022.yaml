base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: de
  text: 'Da kamt ihr alle zu mir und sagtet: »Lasst uns Männer vor uns hersenden, damit sie das Land für uns erkunden und uns Bericht erstatten über den Weg, auf dem wir hinaufziehen sollen, und über die Städte, in die wir kommen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: Da kamt ihr alle zu mir
  rationale: קָרַב bezeichnet das Herantreten oder Näherkommen. „Kamt ... zu mir“ ist im Deutschen natürlich; „ihr alle“ bewahrt die Hervorhebung durch כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Lasst uns Männer ... senden
  rationale: Der Kohortativ wird als gemeinsamer Vorschlag wiedergegeben. אֲנָשִׁים meint hier die ausgewählten männlichen Kundschafter.
- source_word: לְפָנֵינוּ
  choice: vor uns her
  rationale: Die Wendung bedeutet in diesem Bewegungskontext, dass die Männer der Gemeinschaft vorausgehen sollen.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: damit sie das Land für uns erkunden
  rationale: חָפַר kann ein gründliches Suchen oder Untersuchen bezeichnen. „Erkunden“ gibt die Erkundungsaufgabe verständlich wieder, ohne eine ausdrücklich heimliche Spionage vorauszusetzen.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: und uns Bericht erstatten
  rationale: Die hebräische Wendung bedeutet idiomatisch, eine Nachricht beziehungsweise einen Bericht zurückzubringen. Die deutsche Formulierung ist klar und sachgerecht.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: über den Weg, auf dem wir hinaufziehen sollen
  rationale: דֶּרֶךְ ist „Weg“ oder „Route“. „Hinaufziehen“ bewahrt den räumlichen und biblischen Sprachgebrauch von עָלָה; „sollen“ gibt den beratenden Sinn der Wegerkundung wieder.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: und über die Städte, in die wir kommen werden
  rationale: Die Präposition אֶל mit dem Bewegungsverb bezeichnet das Gelangen zu beziehungsweise in die Städte. „In die wir kommen werden“ bleibt nah am offenen Wortlaut, ohne „betreten“ oder „einnehmen“ hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt gut verständlich; „hinaufziehen“ bewahrt bewusst das biblische Bewegungsbild. Die Satzstruktur folgt dem Hebräischen, ohne im Deutschen schwerfällig zu wirken.
