  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: de
  text: Der Vorschlag gefiel mir[a], und ich nahm aus eurer Mitte zwölf Männer, einen Mann aus jedem Stamm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Sache war gut in meinen Augen.«'
