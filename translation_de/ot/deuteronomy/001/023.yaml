lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: Der Vorschlag gefiel mir
  rationale: Die Verbindung aus יטב und בְּעֵינַי bezeichnet etwas, das in Moses Augen gut beziehungsweise annehmbar war. „Gefiel mir“ gibt die hebräische Wendung natürlich wieder; die bildhaftere Form steht in der Fußnote.
- source_word: הַדָּבָר
  choice: der Vorschlag
  rationale: דָּבָר verweist hier auf den unmittelbar zuvor geäußerten Plan. „Vorschlag“ macht diesen Zusammenhang im Deutschen klar, ohne den Inhalt weiter auszulegen.
- source_word: וָאֶקַּח
  choice: und so nahm ich
  rationale: לָקַח bedeutet grundsätzlich „nehmen“. Das einleitende „so“ gibt den folgernden Erzählzusammenhang wieder, ohne das Verb stärker als „auswählen“ zu interpretieren.
- source_word: מִכֶּם
  choice: aus eurer Mitte
  rationale: Die Präposition מִן bezeichnet hier die Herkunft aus der angesprochenen Gemeinschaft. „Aus eurer Mitte“ ist im Deutschen natürlich und präzise.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: zwölf Männer
  rationale: Die Wendung bezeichnet ausdrücklich zwölf männliche Personen; „Männer“ ist daher sachlich und sprachlich angemessen.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: einen Mann aus jedem Stamm
  rationale: 'Die Konstruktion hat distributiven Sinn: Jeder Stamm stellte einen Mann. „Aus jedem Stamm“ passt zugleich zu מִכֶּם und drückt die Zugehörigkeit der Männer natürlich aus.'
