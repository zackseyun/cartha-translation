source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: de
  text: Doch ihr wolltet nicht hinaufziehen und widersetztet euch dem Befehl Jahwes, eures Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Mund Jahwes, eures Gottes“; eine hebräische Wendung für die Missachtung seines ausgesprochenen Befehls.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Doch ihr wolltet nicht
  rationale: Die Verbindung aus וְ und der verneinten Form von אבה bezeichnet hier im Kontrast zur vorausgehenden Aufforderung fehlende Bereitschaft. „Doch ihr wolltet nicht“ bewahrt den Willensaspekt und klingt im Deutschen natürlich.
- source_word: לַעֲלֹת
  choice: hinaufziehen
  rationale: עלה bedeutet „hinaufgehen/hinaufziehen“. Im Zusammenhang mit dem Aufbruch des Volkes in das Bergland gibt „hinaufziehen“ sowohl die Richtung als auch die gemeinschaftliche Bewegung idiomatisch wieder.
- source_word: וַתַּמְרוּ
  choice: und widersetztet euch
  rationale: מרה bezeichnet Auflehnung, Trotz oder Widersetzlichkeit gegenüber einer Autorität. „Sich widersetzen“ gibt die aktive Missachtung des göttlichen Befehls klar wieder, ohne den Sinn unnötig zu verstärken.
- source_word: אֶת־פִּי
  choice: dem Befehl
  rationale: Wörtlich steht „dem Mund“. In der Verbindung mit מרה bezeichnet die Wendung den durch Gottes Mund erteilten Befehl. Die sinngemäße Wiedergabe vermeidet im Haupttext ein missverständliches deutsches Bild; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Das Substantiv mit dem Suffix der 2. Person Plural bezieht sich in Verbindung mit Jahwe eindeutig auf „euren Gott“. Der Genitiv „eures Gottes“ schließt sich natürlich an den Namen an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Verhältnis von Rebellion und göttlicher Rede in אֶת־פִּי יְהוָה
  choice: dem Befehl Jahwes widersetzt
  alternative: gegen den Mund Jahwes rebelliert
  rationale: Die hebräische Wendung stellt Gottes gesprochenen Willen als verbindlichen Befehl dar. Die idiomatische deutsche Form wahrt diesen Autoritätsanspruch; die konkrete Bildsprache des Hebräischen bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinaufziehen“ passt zur Bewegung eines ganzen Volkes, und „sich dem Befehl widersetzen“ gibt die hebräische Redewendung verständlich wieder. Der Gottesname erscheint als „Jahwe“.
