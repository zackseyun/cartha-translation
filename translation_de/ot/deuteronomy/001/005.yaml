base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: de
  text: 'Jenseits des Jordan[a], im Land Moab, begann Mose, dieses Gesetz[b] auszulegen, und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf der anderen Seite des Jordan.“ Der hebräische Ausdruck ist vom jeweiligen geografischen Standpunkt abhängig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „diese Weisung“. Das hebräische Wort Tora kann „Gesetz“, aber auch allgemeiner „Weisung“ bedeuten; hier spricht der rechtlich geprägte Zusammenhang des Bundes für „Gesetz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Jenseits des Jordan
  rationale: Die Wendung bezeichnet das Gebiet auf der anderen Seite des Jordan, wobei die Perspektive geografisch relativ ist. „Jenseits des Jordan“ bewahrt die hebräische Ausdrucksweise knapp und natürlich.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: im Land Moab
  rationale: אֶרֶץ bezeichnet hier ein geografisch-politisches Gebiet; „Land Moab“ ist im Deutschen transparent und idiomatisch.
- source_word: הוֹאִיל
  choice: begann
  rationale: In Verbindung mit dem folgenden Verb bezeichnet הוֹאִיל hier das Beginnen beziehungsweise Inangriffnehmen einer Handlung. „Begann“ gibt den erzählerischen Übergang natürlich wieder.
- source_word: בֵּאֵר
  choice: zu erklären
  rationale: באר bedeutet hier, etwas verständlich zu machen oder auszulegen. „Erklären“ ist gegenwärtiges, allgemein verständliches Deutsch und vermeidet einen unnötig fachsprachlichen Ton.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieses Gesetz
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten, hat hier jedoch im Kontext der Bundesbestimmungen deutlich rechtlich-bündischen Charakter. „Gesetz“ wahrt diesen Aspekt; die breitere Bedeutung wird in einer Fußnote genannt.
- source_word: לֵאמֹר
  choice: 'Er sagte:'
  rationale: לֵאמֹר leitet den folgenden Redeinhalt ein. Ein eigener deutscher Satz ist natürlicher als die schwerfällige Verbindung „indem er sprach“ und erhält zugleich die formale Hinführung zur Rede.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Bundeskontext
  choice: dieses Gesetz
  alternative: diese Weisung; diese Tora
  rationale: „Gesetz“ erhält die rechtlich-bündische Dimension der hier erläuterten תּוֹרָה, ohne ihre weiter reichende Bedeutung als göttliche Weisung auszuschließen. Die echte lexikalische Spannweite wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle geografische Wendung „jenseits des Jordan“ bleibt erhalten und wird wegen ihrer relativen Perspektive erläutert. Die Aufteilung von לֵאמֹר in „Er sagte:“ vermeidet eine unnatürliche deutsche Partizipialkonstruktion.
