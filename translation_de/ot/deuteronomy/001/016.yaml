    issue: »oder dem Fremden«
    rationale: Der hebräische Text verbindet die letzte Partei mit וּבֵין („und zwischen“), nicht mit einer disjunktiven Partikel. »und dem Fremden« wahrt die syntaktische Reihung des Ausgangstextes, ohne die genaue rechtliche Konstellation weiter zu harmonisieren.
  - severity: low
    issue: Position des Fußnotenmarkers
    rationale: Die Fußnote erläutert גֵּר; der Marker sollte daher unmittelbar nach »dem Fremden, der bei ihm lebt« stehen.
