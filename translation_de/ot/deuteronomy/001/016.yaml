  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: de
  text: 'Damals gebot ich euren Richtern: »Hört die Streitfälle zwischen euren Brüdern an und urteilt gerecht zwischen einem Mann und seinem Bruder und dem Fremden, der bei ihm lebt[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem bei ihm ansässigen Fremden«. Das hebräische Wort גֵּר bezeichnet einen nicht einheimischen, dauerhaft unter den Israeliten lebenden Fremden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: gebot ich
  rationale: Das Verb צוה bezeichnet ein verbindliches Gebieten oder Beauftragen; »gebot ich« bewahrt den autoritativen Charakter der Anweisung.
- source_word: שֹׁפְטֵיכֶם
  choice: euren Richtern
  rationale: Die Nominalform bezeichnet die zur Entscheidung von Rechtsfällen eingesetzten Richter.
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: Die knappe deutsche Zeitangabe gibt die idiomatische Bedeutung »zu jener Zeit« natürlich wieder.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Hört die Streitfälle zwischen euren Brüdern an
  rationale: שׁמע hat hier imperativische Kraft und meint im gerichtlichen Zusammenhang das Anhören von Rechtssachen. »Brüder« bewahrt die gemeinschaftliche Verwandtschaftssprache des Hebräischen.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: und urteilt gerecht
  rationale: צֶדֶק beschreibt hier die Art des Urteilens und umfasst im Rechtskontext sowohl Gerechtigkeit als auch moralische Rechtschaffenheit.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: zwischen einem Mann und seinem Bruder
  rationale: Die konkrete singularische und verwandtschaftliche Ausdrucksweise des Ausgangstextes bleibt erhalten.
- source_word: גֵּרוֹ
  choice: dem Fremden, der bei ihm lebt
  rationale: גֵּר bezeichnet einen nicht einheimischen, dauerhaft ansässigen Fremden. Der Relativsatz gibt sowohl den Aufenthaltsstatus als auch das Possessivsuffix natürlich wieder.
theological_decisions:
- issue: Verwandtschaftssprache in אֲחֵיכֶם und אָחִיו
  choice: Brüder / seinem Bruder
  alternative: Mitglieder eures Volkes / seinem Mitmenschen
  rationale: Die hebräische Rechtssprache beschreibt die Bundesgemeinschaft mit männlicher Verwandtschaftssprache. Die Übersetzung bewahrt dieses Bild, ohne den rechtlichen Geltungsbereich ausdrücklich auf Männer einzuengen.
- issue: Bedeutungsumfang von צֶדֶק im Rechtskontext
  choice: gerecht
  alternative: nach dem Recht
  rationale: »Gerecht« wahrt die Verbindung von rechtlicher Gerechtigkeit und sittlicher Richtigkeit, ohne eine der beiden Nuancen auszuschließen.
- issue: Status des גֵּר
  choice: Fremder, der bei ihm lebt
  alternative: ansässiger Fremder / Schutzbürger
  rationale: Die Formulierung macht deutlich, dass kein bloßer Besucher gemeint ist, vermeidet aber moderne staatsrechtliche Kategorien, die der hebräische Begriff nicht eindeutig trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet; die konkrete Rechts- und Verwandtschaftssprache des Hebräischen bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung.
