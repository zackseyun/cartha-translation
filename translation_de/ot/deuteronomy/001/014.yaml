    issue: „vorgeschlagen“ verengt „was du gesagt hast“.
    rationale: Der vorherige Kontext betrifft zwar einen Vorschlag Moses, aber דִּבַּרְתָּ bedeutet zunächst „du gesagt/gesprochen hast“. Eine weniger interpretative Formulierung ist vorzuziehen.
