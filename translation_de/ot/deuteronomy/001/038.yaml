source:
  edition: WLC
  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: de
  text: Josua, der Sohn Nuns, der vor dir steht – er wird dort hineingehen. Stärke ihn, denn er wird Israel das Land als Erbe zuteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er wird Israel in den Besitz des Landes bringen“ oder „denn er wird es Israel als Erbe geben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die im Deutschen eingebürgerte Namensform „Josua“ und die natürliche Wiedergabe des Patronyms entsprechen dem hebräischen Ausdruck.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: der vor dir steht
  rationale: Die Formulierung bewahrt das hebräische Bild und lässt offen, ob damit zugleich Josuas Dienststellung gemeint ist.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: er wird dort hineingehen
  rationale: „Hineingehen“ gibt bei בוא mit dem Richtungsadverb שָׁמָּה die Bewegung in das zuvor genannte Land wieder.
- source_word: אֹתוֹ חַזֵּק
  choice: Stärke ihn
  rationale: Die Übersetzung wahrt die breite Bedeutung von חזק, die praktische Festigung ebenso wie Ermutigung umfassen kann.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aufforderung; „denn“ ist dafür im gehobenen modernen Deutsch natürlich.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: er wird Israel das Land als Erbe zuteilen
  rationale: Der Hifil von נחל bezeichnet hier, dass Josua Israel in den Erbbesitz des Landes bringt beziehungsweise es ihm zuteilt. „Das Land“ macht den Bezug des femininen Suffixes natürlich verständlich.
theological_decisions:
- issue: Bezug des femininen Suffixes in יַנְחִלֶנָּה
  choice: Das Suffix wird als Rückverweis auf das verheißene Land verstanden und mit „das Land“ ausdrücklich wiedergegeben.
  alternative: Der Bezug könnte pronominal mit „es“ wiedergegeben werden.
  rationale: Der unmittelbare Kontext handelt vom Eintritt in das Land und dessen Besitznahme; die ausdrückliche Wiederaufnahme klärt den Bezug, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Bedeutungsumfang des Hifil יַנְחִלֶנָּה
  choice: „als Erbe zuteilen“
  alternative: „Israel in seinen Besitz bringen“ oder „es Israel als Erbe geben“
  rationale: Die gewählte Fassung bewahrt sowohl den Erbcharakter als auch Josuas vermittelnde beziehungsweise zuteilende Rolle, ohne zu behaupten, Josua sei der eigentliche Geber des Landes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die Hervorhebung durch das hebräische Pronomen הוּא ab. Die idiomatische Wendung „vor dir steht“ bleibt bewusst nahe am Ausgangstext.
