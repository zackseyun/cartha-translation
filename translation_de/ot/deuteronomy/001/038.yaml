  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen sachgerecht wieder: Josua als Sohn Nuns, seine Stellung „vor dir“, die betonte Aussage über seinen Eintritt in das Land, den Imperativ „Stärke ihn“ sowie die begründende Aussage, dass er Israel das Land als Erbe zuteilen wird. Die explizite Nennung von „das Land“ klärt den Bezug des femininen Suffixes, der im Kontext eindeutig auf das Land verweist.'
