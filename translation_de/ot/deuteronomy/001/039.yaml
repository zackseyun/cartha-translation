  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: de
  text: Und eure kleinen Kinder, von denen ihr gesagt habt, sie würden zur Beute werden, und eure Söhne, die heute Gut und Böse noch nicht kennen[a] – sie werden dorthin kommen. Ihnen werde ich das Land geben, und sie werden es in Besitz nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Gut und Böse noch nicht kennen« ist eine hebräische Wendung für noch fehlendes reifes Urteilsvermögen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »sie werden es erben« beziehungsweise »besitzen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: eure kleinen Kinder
  rationale: טַף bezeichnet kleine Kinder beziehungsweise schutzbedürftige Angehörige. »Eure kleinen Kinder« gibt den Alters- und Schutzaspekt wieder und vermeidet das im Deutschen missverständliche »eure Kleinen«.
- source_word: לָבַז יִהְיֶה
  choice: sie werden zur Beute werden
  rationale: בַּז bezeichnet Beute oder Plündergut, das einem Feind zufällt. Die Formulierung bewahrt die von Israel geäußerte Befürchtung und klingt im Deutschen natürlich.
- source_word: בְנֵיכֶם
  choice: eure Kinder
  rationale: בנים kann wörtlich »Söhne« heißen, bezeichnet hier im parallelen Zusammenhang mit טף jedoch die nachfolgende Kindergeneration insgesamt. »Kinder« bildet diesen kontextuellen Bezug angemessen ab.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: die heute Gut und Böse noch nicht kennen
  rationale: Die nahe Wiedergabe erhält die hebräische Wendung und ihre Offenheit. »Noch« macht im Deutschen den altersbezogenen Kontrast verständlich, ohne daraus eine Lehre über Schuld oder Verantwortlichkeit abzuleiten.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das Richtungsadverb bezeichnet eine Bewegung in das zuvor genannte Land hinein; »dorthin kommen« ist dafür idiomatisches Deutsch.
- source_word: אֶתְּנֶנָּה
  choice: Ihnen werde ich das Land geben
  rationale: Das feminine Objektsuffix verweist auf das zuvor besprochene Land. Die ausdrückliche Nennung von »das Land« klärt den Bezug im Deutschen.
- source_word: יִירָשׁוּהָ
  choice: sie werden es in Besitz nehmen
  rationale: ירש kann je nach Kontext »erben«, »besitzen« oder »in Besitz nehmen« bedeuten. Hier bezeichnet es das Empfangen und Besetzen des verheißenen Landes; die gewählte Formulierung wahrt diese Bedeutungsbreite.
theological_decisions:
- issue: Bedeutung von »Gut und Böse nicht kennen«
  choice: Die hebräische Wendung wird als Hinweis auf noch fehlendes reifes Urteilsvermögen beibehalten.
  alternative: Die Aussage ausdrücklich als völlige moralische Unschuld oder als feste Altersgrenze der Verantwortlichkeit deuten.
  rationale: Der Vers stellt die jüngere Generation der verurteilten Erwachsenengeneration gegenüber, legt aber keine ausgearbeitete Lehre über ein Alter moralischer Verantwortlichkeit fest. Die Übersetzung wahrt diese theologische Offenheit.
- issue: Bedeutung von ירש im Blick auf das Land
  choice: »in Besitz nehmen«
  alternative: »erben«
  rationale: »Erben« hebt den Geschenk- und Verheißungscharakter hervor, während »in Besitz nehmen« auch den tatsächlichen Eintritt und die Aneignung des Landes ausdrückt. Der Kontext erlaubt beide Nuancen; die Hauptfassung bleibt bewusst breit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar markiert; der Gedankenstrich bildet den hervorgehobenen Übergang zum göttlichen Zuspruch ab. Das im Kontext vorausgesetzte Land wird einmal ausdrücklich genannt, um den pronominalen Bezug natürlich verständlich zu machen.
