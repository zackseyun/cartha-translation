lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: So bliebt ihr
  rationale: ישׁב bezeichnet hier das Bleiben bzw. längere Verweilen; „So“ führt die Erzählung als Folge des vorangehenden Geschehens fort.
- source_word: בְקָדֵשׁ
  choice: in Kadesch
  rationale: Die Präposition בְּ bezeichnet den Aufenthaltsort; bei einer Ortsbezeichnung ist „in“ im Deutschen natürlich.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Die Wiedergabe folgt der hebräischen Nominalfügung eng und bewahrt das konkrete Zeitbild.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: so lange, wie ihr dort bliebt
  rationale: Die vergleichende, elliptische Wendung wird verständlich wiedergegeben, ohne die genaue Zeitdauer festzulegen; „dort“ nimmt den im Kontext genannten Ort auf.
