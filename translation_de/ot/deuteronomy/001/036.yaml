source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: de
  text: ausgenommen Kaleb, der Sohn Jefunnes. Er wird es sehen, und ihm und seinen Söhnen[a] werde ich das Land geben, das er betreten hat, weil er Yahweh uneingeschränkt gefolgt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „seinen Kindern“ beziehungsweise „seinen Nachkommen“; wörtlich: „seinen Söhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: ausgenommen
  rationale: Kennzeichnet die Ausnahme vom zuvor ausgesprochenen Gericht und lässt den Anschluss an den vorherigen Vers erkennen.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Kaleb, der Sohn Jefunnes
  rationale: Verwendet die im Deutschen üblichen biblischen Namensformen und gibt die Abstammungsangabe klar wieder.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Er wird es sehen
  rationale: Das feminine Objektsuffix bezieht sich auf das Land; das Futur gibt die feste Zusage natürlich wieder.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: und ihm … werde ich … geben
  rationale: Die Voranstellung von „ihm“ bewahrt die Hervorhebung des hebräischen Dativs.
- source_word: אֶת הָאָ֛רֶץ
  choice: das Land
  rationale: Entspricht der üblichen Bedeutung im Kontext der Landverheißung, ohne den Ausdruck unnötig einzuengen.
- source_word: אֲשֶׁ֥ר דָּרַךְ בָּ֖הּ
  choice: das er betreten hat
  rationale: Gibt das konkrete Bild des Darauftretens in natürlichem modernem Deutsch wieder.
- source_word: וּלְבָנָ֑יו
  choice: und seinen Söhnen
  rationale: Bewahrt den ausdrücklich maskulinen Plural des hebräischen Wortlauts; mögliche weitere Bedeutungsumfänge werden in der Fußnote genannt.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: weil
  rationale: Leitet knapp und idiomatisch die Begründung für die Zusage ein.
- source_word: מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה
  choice: weil er Yahweh uneingeschränkt gefolgt ist
  rationale: Gibt die idiomatische Bedeutung vollständiger, vorbehaltloser Nachfolge verständlich wieder, ohne das Bild wörtlich und unverständlich als „hinter … erfüllt“ abzubilden.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm; „Yahweh“ bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בָּנָיו
  choice: seinen Söhnen
  alternative: seinen Kindern; seinen Nachkommen
  rationale: Der unmittelbare Wortlaut ist maskuliner Plural. Da der Ausdruck im Erb- und Abstammungskontext weiter gefasst sein kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
- issue: Bedeutung von מִלֵּא אַחֲרֵי
  choice: uneingeschränkt gefolgt
  alternative: völlig gefolgt; von ganzem Herzen gefolgt
  rationale: Die gewählte Fassung wahrt den Gedanken vollständiger Nachfolge, ohne ausdrücklich eine innere Herzenshaltung hinzuzufügen, die das Idiom hier nicht eigens benennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als syntaktischer Anschluss an das vorangehende Gerichtswort erkennbar. Die konkrete Sprache des Landbetretens und die Hervorhebung Kalebs werden bewahrt.
