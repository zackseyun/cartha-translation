  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: de
  text: 'Da nahm ich die Oberhäupter eurer Stämme, weise und kundige[a] Männer, und setzte sie als Oberhäupter über euch ein: Anführer über Tausend, über Hundert, über Fünfzig und über Zehn sowie Amtleute für eure Stämme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bekannte“. Das hebräische Wort kann Männer bezeichnen, die kundig sind, oder solche, die bekannt und anerkannt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Da nahm ich
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitlich-folgernde Verbindung im modernen Deutsch natürlich wieder.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם ... רָאשִׁים עֲלֵיכֶם
  choice: die Oberhäupter eurer Stämme ... als Oberhäupter über euch
  rationale: „Oberhäupter“ bewahrt die wiederholte Haupt-Metapher und bezeichnet hier Personen in leitender Stellung.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: weise und kundige Männer
  rationale: „Weise“ bezeichnet praktische Urteilsfähigkeit; „kundig“ gibt im Kontext am ehesten Wissen und Befähigung wieder. Das ausdrücklich männliche אֲנָשִׁים bleibt als „Männer“ erhalten.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: und setzte sie als Oberhäupter über euch ein
  rationale: נתן mit Objekt und Amtsbezeichnung drückt hier eine Einsetzung aus; die Formulierung ist zugleich klar und nah an der hebräischen Struktur.
- source_word: שָׂרֵי אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: Anführer über Tausend, über Hundert, über Fünfzig und über Zehn
  rationale: שַׂר bezeichnet Autoritätsträger; „Anführer“ lässt offen, ob die gegliederten Einheiten primär militärisch oder administrativ verstanden werden, und bewahrt ihre Größenstufen.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: sowie Amtleute für eure Stämme
  rationale: שֹׁטְרִים sind untergeordnete Verwaltungs- oder Vollzugsbeamte. „Amtleute“ ist würdig und unterscheidet diese Funktion von den zuvor genannten Anführern.
theological_decisions:
- issue: Charakter der gestaffelten Führungsämter
  choice: „Anführer“ statt ausdrücklich „Befehlshaber“
  alternative: Befehlshaber
  rationale: Der Text beschreibt eine gegliederte Autoritätsstruktur, legt an dieser Stelle aber nicht eindeutig fest, ob ihre Funktion ausschließlich militärisch ist. Die Übersetzung bewahrt diese sachliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität von „Oberhäupter“ wird bewahrt; die gestaffelte Verwaltungsstruktur bleibt knapp und gut verständlich. Der Fußnotenmarker [a] steht unmittelbar bei dem mehrdeutigen Ausdruck.
