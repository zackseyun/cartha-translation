  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe des Tetragramms. „Euer Gott“ und „für euch kämpfen“ sind terminologisch klar und kontextgerecht. Es sind keine Fußnoten erforderlich; die im englischen Audit vermerkte formale Nähe von עָשָׂה אִתְּכֶם wird in den lexikalischen Entscheidungen bereits transparent dokumentiert.
