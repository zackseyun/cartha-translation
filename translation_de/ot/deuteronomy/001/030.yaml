  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des hebräischen Textes zuverlässig wieder: Jahwe als Gottesname, die plurale Anrede, das vorangehende Handeln, die Emphase von הוּא durch „selbst“, der Kampf zugunsten Israels sowie Ägypten und das öffentliche Miterleben „vor euren Augen“. „Für euch getan“ ist für עָשָׂה אִתְּכֶם im Kontext eine sachgerechte, idiomatische Sinnwiedergabe; ein wörtliches „mit euch getan“ wäre im modernen Deutsch missverständlich.'
