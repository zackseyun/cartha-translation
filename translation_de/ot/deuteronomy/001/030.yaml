source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ הַ/הֹלֵ֣ךְ לִ/פְנֵי/כֶ֔ם ה֖וּא יִלָּחֵ֣ם לָ/כֶ֑ם כְּ֠/כֹל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּ/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: de
  text: Jahwe, euer Gott, der vor euch hergeht, wird selbst für euch kämpfen, genauso wie er es in Ägypten vor euren Augen für euch getan hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich verwendeten Eigennamen zu bewahren.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Form bezeichnet hier zusammen mit dem Gottesnamen eindeutig den Gott Israels; das Suffix richtet sich an die Gemeinschaft im Plural.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: der vor euch hergeht
  rationale: Das Partizip beschreibt Jahwes fortdauerndes Vorangehen und seine Führung; „vor euch hergeht“ ist natürlich und bildnah.
- source_word: הוּא
  choice: selbst
  rationale: 'Das selbstständige Pronomen hebt das Subjekt hervor: Jahwe persönlich wird für Israel kämpfen.'
- source_word: יִלָּחֵם לָכֶם
  choice: wird selbst für euch kämpfen
  rationale: Das Verb bezeichnet den Kampf zugunsten Israels; die deutsche Formulierung gibt sowohl den Zukunftsbezug als auch den emphatischen Charakter wieder.
- source_word: כְּכֹל אֲשֶׁר
  choice: genauso wie
  rationale: Die Wendung leitet den Vergleich mit Jahwes früherem Handeln ein und wird im Deutschen klar und idiomatisch wiedergegeben.
- source_word: עָשָׂה אִתְּכֶם
  choice: es … für euch getan hat
  rationale: Wörtliches „mit euch getan“ wäre im heutigen Deutsch missverständlich. Im Zusammenhang bezeichnet die Wendung Jahwes rettendes Handeln zugunsten Israels.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Direkte und übliche Ortsangabe.
- source_word: לְעֵינֵיכֶם
  choice: vor euren Augen
  rationale: Die hebräische Wendung betont, dass Israel Jahwes Handeln selbst mitangesehen hat; das deutsche Idiom bewahrt dieses Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von עָשָׂה אִתְּכֶם
  choice: für euch getan
  alternative: mit euch getan
  rationale: Die Präposition lässt formal eine Wiedergabe mit „mit“ erkennen, doch der Kontext verweist auf Jahwes machtvolles Handeln zugunsten Israels in Ägypten. Die gewählte Form ist im Deutschen natürlich, ohne eine zusätzliche dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anredeformen im Plural werden konsequent mit „euch/euer“ wiedergegeben. Die Satzstruktur bleibt eng am Hebräischen, während die schwer verständliche Wendung „tat mit euch“ kontextgerecht idiomatisiert wird.
