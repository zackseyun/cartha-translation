  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: de
  text: Im vierzigsten Jahr, im elften Monat, am ersten Tag des Monats, redete Mose zu den Israeliten[a] ganz so, wie Jahwe es ihm für sie geboten hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung ist knapp und kann wörtlicher auch mit „ihm zu ihnen“ oder „ihm in Bezug auf sie“ wiedergegeben werden. Gemeint ist der Auftrag, den Mose für Israel ausrichten sollte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Im … Jahr … redete
  rationale: Die Wayyiqtol-Form von היה führt hier vor allem die Zeitangabe ein. Im Deutschen lässt sich diese Erzählfunktion natürlich durch die vorangestellte Datierung ausdrücken, ohne das schwerfällige „Und es geschah“.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: im vierzigsten Jahr
  rationale: Die hebräische Verbindung bezeichnet idiomatisch das vierzigste Jahr einer Zeitrechnung.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: im elften Monat
  rationale: Die Kardinalzahl hat in dieser Datierungsform ordinale Bedeutung.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Die Ergänzung „Tag“ gibt die übliche Bedeutung der hebräischen Datierungsformel klar und natürlich wieder.
- source_word: דִּבֶּר
  choice: redete
  rationale: „Redete“ gibt דבר schlicht wieder und passt zum folgenden Adressaten, ohne die Art der Rede enger festzulegen.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Damit ist die als Volksbezeichnung verwendete Wendung in modernem Deutsch verständlich wiedergegeben; die wörtliche Form wird in einer Fußnote genannt.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Formulierung bewahrt den Gedanken vollständiger Übereinstimmung zwischen Jahwes Auftrag und Moses Rede.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jahwes Gebot der Rede Moses vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: es ihm für sie
  rationale: Die knappe hebräische Konstruktion bezeichnet den an Mose gerichteten Auftrag im Hinblick auf Israel. „Für sie“ ist im Deutschen verständlich, während die mögliche wörtlichere Zuordnung in der Fußnote offengehalten wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Umschrift „Jahwe“ wahrt diese Eigenname-Funktion.
- issue: Bezug von אֲלֵהֶם am Satzende
  choice: für sie
  alternative: zu ihnen / in Bezug auf sie
  rationale: Die Präposition bezeichnet hier wahrscheinlich Israel als Zielgruppe des Mose erteilten Auftrags. Da die knappe Konstruktion mehrere deutsche Wiedergaben zulässt, wird die Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Datierung bleibt vollständig erhalten; unnötig altertümliche Wendungen werden vermieden. „Israeliten“ dient der heutigen Verständlichkeit, während die hebräische Familienbezeichnung in der Fußnote transparent gemacht wird.
