base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: de
  text: 'Jahwe, unser Gott, sprach am Horeb[a] zu uns: „Ihr seid lange genug an diesem Berg geblieben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horeb ist die im Hebräischen hier verwendete Bezeichnung für den Berg, der auch mit dem Sinai verbunden wird.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form bezeichnet hier eindeutig Israels Gott im Singular.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: sprach … zu uns
  rationale: Dies gibt Verb und Richtungspräposition natürlich und zugleich quellennah wieder.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Die Präposition ist lokal zu verstehen; „am Horeb“ ist im Deutschen idiomatisch und bewahrt den hebräischen Ortsnamen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im natürlichen modernen Deutsch durch einen Doppelpunkt vor der direkten Rede ausgedrückt.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Ihr seid lange genug … geblieben
  rationale: Die idiomatische Verbindung drückt aus, dass die Dauer des Aufenthalts nun ausreicht; diese Wiedergabe ist klar und natürlich.
- source_word: בָּהָר הַזֶּה
  choice: an diesem Berg
  rationale: „Berg“ entspricht הַר; „an“ bezeichnet hier idiomatisch den Aufenthaltsort, ohne die Lage unnötig zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Offenbarungsbergs
  choice: Horeb
  alternative: Sinai
  rationale: Der Text nennt ausdrücklich Horeb; eine Harmonisierung mit der andernorts gebrauchten Bezeichnung Sinai würde die Wortwahl der Quelle verwischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeeinleitungsformel לֵאמֹר wird nicht hölzern mit „indem er sprach“ wiederholt, sondern durch den Doppelpunkt ausgedrückt. Die Mehrdeutigkeit der Präposition ב beim Berg wird mit dem neutralen deutschen „an“ bewahrt.
