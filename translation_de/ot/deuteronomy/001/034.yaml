base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: de
  text: 'Und Jahwe hörte eure Worte[a]. Da wurde er zornig und schwor:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stimme eurer Worte“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise קוֹל דִּבְרֵיכֶם, während der Haupttext natürliches Deutsch verwendet.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Gottesnamens gibt das Tetragramm als persönlichen Namen wieder, statt es durch einen Titel zu ersetzen.
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier im erzählenden Zusammenhang schlicht das Hören; „hörte auf“ würde eine nicht ausdrücklich ausgesagte Bereitschaft zum Gehorsam nahelegen.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: eure Worte
  rationale: Die natürliche deutsche Wiedergabe vermittelt den Sinn der hebräischen Wendung; ihre bildhafte Form „die Stimme eurer Worte“ bleibt in der Fußnote sichtbar.
- source_word: וַיִּקְצֹף
  choice: wurde zornig
  rationale: קצף bezeichnet starken Zorn. „Wurde zornig“ gibt sowohl die Bedeutung als auch die Abfolge der Erzählung klar und würdig wieder.
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Der Nifal von שׁבע bedeutet hier, einen Eid zu schwören; der Inhalt des Eides folgt im nächsten Vers.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt im natürlichen modernen Deutsch die unmittelbar folgende Eidesrede ein und erfüllt damit die Funktion von לֵאמֹר, ohne das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen und verwendet die im modernen Deutschen geläufige Umschrift, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren die erzählerische Abfolge und das Gewicht des göttlichen Zorns und Eides.
