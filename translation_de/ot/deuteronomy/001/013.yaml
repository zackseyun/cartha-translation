base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: de
  text: Wählt euch weise, verständige und in euren Stämmen bekannte[a] Männer aus, und ich werde sie als eure Oberhäupter[b] einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anerkannte“. Das Hebräische kann Männer bezeichnen, die ihren Stämmen bekannt oder von ihnen erkannt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Häupter“. Gemeint sind Leiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Wählt euch … aus
  rationale: Das Imperativgefüge fordert die Israeliten in diesem Zusammenhang auf, geeignete Männer aus den eigenen Reihen auszuwählen. „Euch“ bewahrt den Dativ des Interesses.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Das ausdrücklich maskuline Pluralwort bezeichnet hier Männer, die Leitungsaufgaben in der Stammesordnung übernehmen sollen.
- source_word: חֲכָמִים
  choice: weise
  rationale: Im Zusammenhang mit Leitungs- und Rechtsprechungsaufgaben bezeichnet das Wort Urteilsfähigkeit und Lebensweisheit.
- source_word: וּנְבֹנִים
  choice: verständige
  rationale: Das von בין abgeleitete Wort betont Einsicht und die Fähigkeit, sachgerecht zu unterscheiden.
- source_word: וִידֻעִים לְשִׁבְטֵיכֶם
  choice: in euren Stämmen anerkannte
  rationale: Die Wendung beschreibt Männer, die ihren Stämmen bekannt sind und dort einen gefestigten Ruf genießen; „anerkannt“ gibt diese öffentliche Bekanntheit im Deutschen natürlich wieder.
- source_word: וַאֲשִׂימֵם
  choice: und ich werde sie … einsetzen
  rationale: Mose kündigt als Folge der Auswahl die offizielle Einsetzung der Männer an.
- source_word: בְּרָאשֵׁיכֶם
  choice: als eure Oberhäupter
  rationale: Die Übersetzung erhält das hebräische Bild von ראשׁ („Kopf/Haupt“) und macht zugleich die Leitungsfunktion deutlich.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung אֲנָשִׁים
  choice: Männer
  alternative: Personen
  rationale: Der hebräische Text verwendet ausdrücklich die maskuline Pluralform in einem Zusammenhang mit männlichen Stammesleitern; eine geschlechtsneutrale Wiedergabe würde diese sprachliche Angabe abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verständig“ ist allgemein verständlich und bewahrt neben „weise“ die eigenständige Bedeutung des zweiten Eigenschaftsworts. „Oberhäupter“ erhält die hebräische Metapher, ohne altertümlich zu wirken.
