source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: »Sag ihnen: Zieht nicht hinauf und kämpft nicht, denn ich bin nicht in eurer Mitte, damit ihr nicht vor euren Feinden geschlagen werdet.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder dem Zusammenhang nach: »sonst werdet ihr vor euren Feinden geschlagen.«'
    reason: Die hebräische Schlussklausel kann als zu vermeidende Folge formuliert werden; im Zusammenhang warnt sie zugleich vor der Niederlage, die bei Missachtung des Verbots eintreten wird.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und Jahwe sagte zu mir
  rationale: Die gewöhnliche Erzählform von אמר wird natürlich mit „sagte“ wiedergegeben; אֵלַי bezeichnet Mose als Empfänger der Rede.
- source_word: אֱמֹר לָהֶם
  choice: Sag ihnen
  rationale: Die knappe deutsche Aufforderung entspricht dem Imperativ mit indirektem Objekt und leitet die direkte Rede natürlich ein.
- source_word: לֹא תַעֲלוּ
  choice: Zieht nicht hinauf
  rationale: „Hinaufziehen“ wahrt sowohl die räumliche als auch die militärische Färbung von עלה in diesem Zusammenhang.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: und kämpft nicht
  rationale: Das Niphal von לחם bezeichnet hier das Kämpfen beziehungsweise den Kampf gegen einen Gegner.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: denn ich bin nicht in eurer Mitte
  rationale: Die Formulierung bewahrt das konkrete Bild von Gottes Gegenwart innerhalb des Volkes und klingt zugleich würdig und verständlich.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: damit ihr nicht … geschlagen werdet
  rationale: נגף im Niphal bezeichnet das Geschlagen- oder Besiegtwerden. Die deutsche Zweck- beziehungsweise Vermeidungsform gibt den warnenden Zusammenhang wieder, ohne den negierten hebräischen Ausdruck ins Gegenteil zu verkehren.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: vor euren Feinden
  rationale: Die räumlich-militärische Wendung entspricht dem hebräischen Idiom und ist im Deutschen klar verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Sinn der Schlussklausel וְלֹא תִּנָּגְפוּ
  choice: 'als zu vermeidende Folge: „damit ihr nicht … geschlagen werdet“'
  alternative: 'als ausdrückliche Warnfolge: „sonst werdet ihr … geschlagen“'
  rationale: Die hebräische Negation schließt sich an die Verbote an und lässt sich formal als zu vermeidende Folge beziehungsweise Zweck auffassen; der Kontext macht zugleich deutlich, dass bei Ungehorsam eine Niederlage droht. Die Hauptfassung erhält die Negation, die Fußnote nennt die kontextuell explizitere Wiedergabe.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. „Zieht … hinauf“ bewahrt den geografisch-militärischen Sprachgebrauch; „in eurer Mitte“ erhält das biblische Bild, ohne altertümlich zu wirken.
