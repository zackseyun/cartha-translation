  terminology: „Jahwe“ gibt den Gottesnamen יהוה konsequent als Eigennamen wieder. „geschlagen werdet“ ist für נגף im militärischen Zusammenhang angemessen, ohne die Bedeutung unnötig einzuengen. Die Fußnote bietet mit „sonst werdet ihr … geschlagen“ eine sinnvolle kontextuelle Umformulierung, ohne sie als einzig mögliche syntaktische Analyse auszugeben.
