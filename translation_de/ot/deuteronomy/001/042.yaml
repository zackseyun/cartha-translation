  source_fidelity: 'Die Übersetzung bildet den hebräischen Text vollständig und zutreffend ab: Jahwe spricht zu Mose, dieser soll dem Volk das Hinaufziehen und Kämpfen untersagen; die Begründung ist Jahwes fehlende Gegenwart in ihrer Mitte; die Schlussklausel warnt vor dem Geschlagenwerden vor den Feinden. „Zieht nicht hinauf“ erhält die räumlich-militärische Nuance von עלה. Die Wiedergabe von וְלֹא תִּנָּגְפוּ als „damit ihr nicht … geschlagen werdet“ ist als Vermeidungs-/Warnkonstruktion im Kontext vertretbar und kehrt die hebräische Negation nicht um.'
