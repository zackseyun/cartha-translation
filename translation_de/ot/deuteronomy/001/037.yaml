source:
  edition: WLC
  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: de
  text: 'Auch über mich wurde Jahwe euretwegen zornig[a] und sagte[b]: »Auch du wirst nicht dorthin kommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch gegen mich wurde Jahwe euretwegen zornig.«'
    reason: lexical_alternative
  - marker: b
    text: 'Vergleiche Numeri 20,12: Dort wird Moses Ausschluss vom Betreten des Landes mit seinem eigenen Versagen bei Meriba verbunden; hier in Deuteronomium wird die Rolle des Volkes in dieser Sache betont.'
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Die Partikel bezeichnet in beiden Vorkommen eine Hinzufügung und bewahrt mit „auch“ den kumulativen Nachdruck.
- source_word: בִּי
  choice: über mich
  rationale: Bei הִתְאַנַּף kennzeichnet ב die Person, gegen die sich der Zorn richtet. „Über mich zornig“ ist im Deutschen natürlich und vermeidet eine unnötige Verstärkung.
- source_word: הִתְאַנַּף
  choice: wurde zornig
  rationale: Die Hitpael-Form bezeichnet hier das Entbrennen beziehungsweise Eintreten des Zorns; „wurde zornig“ bildet diesen Aspekt klar ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּגְלַלְכֶם
  choice: euretwegen
  rationale: Die Wendung bezeichnet Ursache oder Anlass. „Euretwegen“ ist direkt, idiomatisch und bewahrt die im Vers ausgesagte Beteiligung des Volkes.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv führt den Inhalt der göttlichen Rede ein; im natürlichen deutschen Erzählstil ist „und sagte“ angemessen.
- source_word: גַּם אַתָּה
  choice: auch du
  rationale: Das ausdrücklich gesetzte Pronomen zusammen mit גַּם hebt hervor, dass neben anderen auch Mose betroffen ist.
- source_word: לֹא תָבֹא
  choice: wirst nicht … kommen
  rationale: בוא bedeutet grundsätzlich „kommen/eintreten“. Mit dem Richtungsadverb „dorthin“ ergibt „nicht dorthin kommen“ im Deutschen natürlich den Sinn, das Land nicht zu erreichen beziehungsweise zu betreten.
- source_word: שָׁם
  choice: dorthin
  rationale: Das lokale Adverb verweist auf das zuvor genannte Land. In Verbindung mit einem Bewegungsverb gibt „dorthin“ die deutsche Zielrichtung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Ursächlicher Zusammenhang zwischen dem Volk und Moses Ausschluss
  choice: Der Haupttext sagt ohne weitere Auflösung, dass Jahwe euretwegen über Mose zornig wurde.
  alternative: Moses eigenes Versagen aus Numeri 20 im Haupttext ausdrücklich als Ursache einzufügen
  rationale: Deuteronomium 1,37 betont hier die Rolle des Volkes. Die Spannung zu Numeri 20,12 wird nicht harmonisierend in den Vers eingetragen, sondern in einer Anmerkung kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ gibt den Gottesnamen wieder. „Euretwegen“ spricht die Mehrzahl an, während „auch du“ Mose ausdrücklich in der Einzahl bezeichnet. Die beiden Fußnotenmarker stehen vollständig im Haupttext.
