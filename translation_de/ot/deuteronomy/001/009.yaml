  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zuverlässig wieder: die zeitliche Einordnung (בָּעֵת הַהִוא: „Damals“), die Anrede an Israel, die Negation der Fähigkeit, das Bild des „Tragens“ (שְׂאֵת) sowie die Einschränkung „allein“ (לְבַדִּי). Das einleitende וָאֹמַר ist im deutschen Satzanschluss idiomatisch mit „sagte ich“ ausreichend erfasst. Das formelhafte לֵאמֹר wird im Deutschen natürlich durch die direkte Rede nach Doppelpunkt wiedergegeben und braucht nicht zusätzlich wörtlich abgebildet zu werden.'
  naturalness: '„Damals sagte ich zu euch: »Ich kann euch nicht allein tragen.«“ ist klares, modernes und zugleich für den Kontext angemessen würdiges Standarddeutsch. Die Formulierung vermeidet eine unidiomatische Verdoppelung wie „sagte ich … und sprach“ oder „sagte ich, indem ich sagte“.'
  terminology: „tragen“ bewahrt die bewusst konkrete, im Kontext auf Leitung und Belastung bezogene Metapher des hebräischen Verbs. „Allein“ ist treffend und lässt die Aussage offen, ohne sie zu einer bloßen Verwaltungs- oder Führungsverantwortung zu erklären.
