  text: וָ/אֹמַ֣ר אֲלֵ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר לֹא אוּכַ֥ל לְ/בַדִּ֖/י שְׂאֵ֥ת אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: de
  text: 'Damals sagte ich zu euch: »Ich kann euch nicht allein tragen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: Gibt die Zeitangabe natürlich und vollständig wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitung wird im modernen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sprach“ wäre schwerfällig und inhaltlich redundant.
- source_word: שְׂאֵת אֶתְכֶם
  choice: euch tragen
  rationale: Bewahrt das konkrete Verb „tragen“ und seine mögliche Bedeutung, die Last der Führung und Verantwortung für das Volk zu tragen.
- source_word: לְבַדִּי
  choice: allein
  rationale: Entspricht knapp und natürlich dem hebräischen Ausdruck „ich für mich allein“.
theological_decisions:
- issue: Bedeutungsumfang von „tragen“
  choice: Die konkrete Metapher „euch tragen“ bleibt erhalten.
  alternative: „die Verantwortung für euch tragen“ oder „euch führen“
  rationale: Der hebräische Wortlaut bezeichnet wörtlich das Tragen und lässt die genaue Art der Belastung im Kontext erkennen; eine explizierende Wiedergabe würde die Mehrdeutigkeit unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist idiomatisch eingeleitet, ohne den hebräischen Infinitiv לֵאמֹר mit einem unnatürlichen „indem ich sagte“ abzubilden.
