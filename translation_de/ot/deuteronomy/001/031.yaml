  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. Die Satzperiode ist dem Anschlusscharakter des Verses angemessen. Der Wechsel zwischen Perfekt bei Gottes vergangenem Handeln und Präsens im allgemeinen Vergleich („trägt“) ist im Deutschen natürlich.
  terminology: „Jahwe“ gibt den Gottesnamen יְהוָה konsistent wieder. „Wüste“ ist für מִדְבָּר eine übliche, kontextgerechte Wahl; die Fußnote bietet „Wildnis“ als sachliche Alternative. „Mann“ und „Sohn“ bewahren die maskuline Bildsprache ohne die über den Wortlaut hinausgehende Wiedergabe „Vater“.
