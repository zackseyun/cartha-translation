source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: de
  text: und in der Wüste[a], wo du gesehen hast, dass Jahwe, dein Gott, dich getragen hat, wie ein Mann seinen Sohn trägt[b], auf dem ganzen Weg, den ihr gegangen seid, bis ihr an diesen Ort kamt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wildnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie ein Mann seinen Sohn trägt“; gemeint ist nicht ausdrücklich „Vater“, obwohl der Zusammenhang dies nahelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: und in der Wüste
  rationale: מִדְבָּר bezeichnet eine Wüsten- oder Wildnisregion. „Wüste“ ist im Deutschen natürlich und passt zum geschichtlichen Kontext der Wüstenwanderung.
- source_word: אֲשֶׁר רָאִיתָ
  choice: wo du gesehen hast
  rationale: Der Relativsatz wird idiomatisch auf „Wüste“ bezogen. Der Singular „du“ folgt dem hebräischen רָאִיתָ und spricht Israel kollektiv an.
- source_word: נְשָׂאֲךָ
  choice: dich getragen hat
  rationale: נשא bedeutet hier „tragen“; dieselbe Wortwahl erhält die Verbindung zum anschließenden Vergleich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die singularische Anrede und die Bundesbezeichnung werden unmittelbar bewahrt.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: wie ein Mann seinen Sohn trägt
  rationale: Die ausdrücklich maskulinen Begriffe אִישׁ und בְּנוֹ werden erhalten; „Vater“ wäre eine plausible, aber über den Wortlaut hinausgehende Präzisierung.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: auf dem ganzen Weg
  rationale: Die Formulierung bringt die Erstreckung des Tragens über den gesamten Reiseweg klar und natürlich zum Ausdruck.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: den ihr gegangen seid
  rationale: הלך heißt „gehen“; der Pluralwechsel zu „ihr“ entspricht הֲלַכְתֶּם und bewahrt den auffälligen Wechsel zwischen kollektiver Singular- und Pluralanrede.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: bis ihr an diesen Ort kamt
  rationale: Die Infinitivkonstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben; der zweite Gebrauch von עַד bezeichnet das erreichte Ziel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifisches Familienbild im Vergleich
  choice: wie ein Mann seinen Sohn trägt
  alternative: wie jemand ein Kind trägt; wie ein Vater sein Kind trägt
  rationale: Der Wortlaut verwendet אִישׁ („Mann“) und בְּנוֹ („seinen Sohn“). Die Übersetzung bewahrt dieses Bild, ohne „Mann“ deutend zu „Vater“ zu verstärken.
- issue: Wechsel zwischen Singular und Plural in der Anrede Israels
  choice: du … dich … ihr … kamt
  alternative: durchgehend ihr/euch
  rationale: Das Hebräische wechselt von singularischen Formen zu Pluralformen. Dieser rhetorisch und auslegungsgeschichtlich bedeutsame Wechsel wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers setzt syntaktisch den vorhergehenden Zusammenhang fort. Die kollektive Singularanrede und der anschließende Wechsel zum Plural bleiben bewusst sichtbar.
