base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/018.yaml
  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: de
  text: Und zu jener Zeit gebot ich euch alles, was ihr tun solltet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Worte“ beziehungsweise „alle Angelegenheiten“; das hebräische Wort דְּבָרִים kann sowohl gesprochene Anweisungen als auch Angelegenheiten oder auszuführende Handlungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: Und … gebot ich
  rationale: Das Verb צוה bezeichnet ein verbindliches Gebieten oder Anweisen. „Gebot“ bewahrt den autoritativen Charakter; „Und“ gibt die fortführende Funktion des ו wieder.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Die Form ist die direkte Anrede in der zweiten Person Plural; „euch“ bildet sie im Deutschen eindeutig ab.
- source_word: בָּעֵת הַהִוא
  choice: zu jener Zeit
  rationale: Die Wendung ist eine übliche Zeitangabe. „Zu jener Zeit“ ist natürlich, würdevoll und wahrt den Rückverweis.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alles
  rationale: דְּבָרִים kann Worte, Angelegenheiten oder Dinge bezeichnen. Im Zusammenhang geht es um den gesamten Inhalt der erteilten Anweisungen; „alles“ gibt dies idiomatisch wieder, ohne die lexikalische Spannweite im Haupttext unnötig festzulegen.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: was ihr tun solltet
  rationale: Der Relativsatz bezeichnet das, was die Angesprochenen aufgrund des Gebots ausführen sollten. „Solltet“ bewahrt im deutschen Erzähltempus die verpflichtende, aber nicht übersteigerte Kraft der Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebot“ hält den verbindlichen Ton, während „alles, was ihr tun solltet“ den Satz natürlich und allgemein verständlich wiedergibt. Die Mehrdeutigkeit von דְּבָרִים wird in der Fußnote offengehalten.
