  to: Dann brachen wir vom Horeb auf und zogen durch die ganze große und furchteinflößende Wüste, die ihr auf dem Weg zum Bergland der Amoriter gesehen habt, wie Jahwe, unser Gott, uns geboten hatte, und kamen bis Kadesch-Barnea.
