source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: de
  text: Dann brachen wir vom Horeb auf und zogen durch die ganze große und furchteinflößende Wüste, die ihr auf dem Weg zum Bergland der Amoriter gesehen habt, wie Jahwe, unser Gott, uns geboten hatte, und kamen bis Kadesch-Barnea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּסַּע
  choice: brachen wir ... auf
  rationale: Das Verb נסע bezeichnet hier das Aufbrechen von einem Lagerplatz und den Beginn einer Reise.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: zogen durch ... die ganze ... Wüste
  rationale: Mit אֵת und dem gesamten Wüstengebiet bezeichnet הלך hier dessen Durchquerung; diese Wiedergabe ist im Deutschen natürlich und quellennah.
- source_word: הַמִּדְבָּר
  choice: Wüste
  rationale: מִדְבָּר bezeichnet das unbesiedelte, trockene Wildnisgebiet der Wanderung; „Wüste“ ist dafür im Deutschen die geläufige biblische Bezeichnung.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: große und furchteinflößende
  rationale: גָּדוֹל bezeichnet Größe beziehungsweise Ausdehnung; נוֹרָא meint etwas, das Furcht, Schrecken oder Ehrfurcht hervorruft. „Furchteinflößend“ bewahrt diese Bedeutungsbreite besser als das wertende „schrecklich“.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: auf dem Weg zum Bergland der Amoriter
  rationale: הַר ist hier kollektiv als Bergland zu verstehen; דֶּרֶךְ bezeichnet den Weg beziehungsweise die Route dorthin.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH; „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ
  choice: So kamen wir bis Kadesch-Barnea
  rationale: עַד wird mit „bis“ wiedergegeben; „So“ stellt im Deutschen flüssig den erzählerischen Anschluss her, ohne zusätzliche Sachinformation einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diese Form und vermeidet die Ersetzung durch den Titel „der HERR“.
- issue: Bedeutungsumfang von נוֹרָא
  choice: furchteinflößend
  alternative: schrecklich
  rationale: Das Adjektiv kann Furcht, Schrecken oder ehrfürchtiges Erschauern bezeichnen. „Furchteinflößend“ legt nicht unnötig fest, ob die Wüste moralisch negativ oder lediglich Schrecken erregend beschrieben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um die lange hebräische Kette verständlich wiederzugeben. Orts- und Volksnamen folgen geläufigen deutschen Formen; der Gottesname steht als „Jahwe“.
