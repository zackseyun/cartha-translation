base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: de
  text: 'Wohin ziehen wir hinauf? Unsere Brüder haben uns den Mut genommen[a], indem sie sagten: »Das Volk ist größer und hochgewachsener als wir; die Städte sind groß und bis an den Himmel befestigt[b]. Außerdem haben wir dort Anakiter[c] gesehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »haben unser Herz zum Schmelzen gebracht«; gemeint ist: Sie haben uns entmutigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »befestigt im Himmel«; eine Übertreibung für außergewöhnlich hohe und starke Befestigungen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »Nachkommen Anaks«; wörtlich: »Söhne Anaks« bzw. »Söhne der Anakiter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Wohin ziehen wir hinauf?
  rationale: Die Fragepartikel bezeichnet das Ziel; „hinaufziehen“ bewahrt die hebräische Bewegungsrichtung und passt zum Zug in das Bergland.
- source_word: אַחֵינוּ
  choice: Unsere Brüder
  rationale: Die maskuline Pluralform bezeichnet hier die israelitischen Volksgenossen und wird entsprechend der rhetorischen Form des Ausgangstextes wiedergegeben.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: haben unser Herz schmelzen lassen
  rationale: Die anschauliche hebräische Wendung wird bewahrt; sie bezeichnet den Verlust von Mut und Zuversicht.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Das Volk ist größer und hochgewachsener als wir
  rationale: גָּדוֹל bezeichnet Größe, רָם hier körperliche Höhe; „hochgewachsener“ gibt den Vergleich im Deutschen natürlich und präzise wieder.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: die Städte sind groß und bis an den Himmel befestigt
  rationale: Die hyperbolische Himmelsvorstellung und der Gedanke außerordentlich starker Befestigungen bleiben erhalten.
- source_word: וְגַם
  choice: Außerdem
  rationale: Das Wort fügt dem einschüchternden Bericht einen weiteren, steigernden Umstand hinzu.
- source_word: בְּנֵי עֲנָקִים
  choice: Anakiter
  rationale: Die deutsche Volksbezeichnung ist verständlich und gibt die Zugehörigkeit zu Anak wieder, ohne die Wendung unnötig zu verholzen.
- source_word: רָאִינוּ שָׁם
  choice: haben wir dort … gesehen
  rationale: Das deutsche Perfekt gibt den zurückliegenden Augenzeugenbericht in natürlicher direkter Rede wieder.
