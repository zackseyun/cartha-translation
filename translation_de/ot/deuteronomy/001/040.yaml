base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: de
  text: Ihr aber, wendet euch und zieht zur Wüste hin, auf dem Weg zum Schilfmeer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: das Rote Meer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Das selbstständige Pronomen hebt die Angesprochenen hervor; zusammen mit der Konjunktion ergibt sich im Zusammenhang ein deutlicher Gegensatz zum zuvor verkündeten Gericht.
- source_word: פְּנוּ לָכֶם
  choice: wendet euch
  rationale: Die Wendung fordert eine konkrete Richtungsänderung. Das reflexive deutsche Verb gibt zugleich die auf die Angesprochenen bezogene Nuance von לָכֶם natürlich wieder, ohne ausdrücklich ein im Hebräischen nicht eigens genanntes »zurück« einzufügen.
- source_word: וּסְעוּ
  choice: brecht … auf
  rationale: נסע bezeichnet häufig das Aufbrechen und Weiterziehen eines Lagers; »aufbrechen« ist dafür eine natürliche und präzise deutsche Entsprechung.
- source_word: הַמִּדְבָּרָה
  choice: in Richtung Wüste
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf die Wüste zu, ohne zwingend den Eintritt in sie auszudrücken.
- source_word: דֶּרֶךְ
  choice: auf dem Weg zum
  rationale: דֶּרֶךְ kennzeichnet hier die einzuschlagende Route.
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: Dies gibt die hebräische Bezeichnung wörtlicher und in heutiger deutscher Bibelsprache geläufig wieder; die traditionelle geografische Wiedergabe »Rotes Meer« bleibt in der Fußnote erhalten.
