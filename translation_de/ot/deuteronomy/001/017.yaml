source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: de
  text: Ihr sollt im Gericht niemanden bevorzugen[a]; den Geringen sollt ihr ebenso anhören wie den Großen. Ihr sollt euch vor keinem Menschen fürchten[b], denn das Gericht gehört Gott. Eine Sache, die zu schwierig für euch ist, sollt ihr vor mich bringen, und ich werde sie anhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr sollt im Gericht keine Gesichter erkennen“; eine hebräische Redewendung für Parteilichkeit oder Begünstigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr sollt euch von niemandem einschüchtern lassen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: niemanden bevorzugen
  rationale: Die Wendung bedeutet wörtlich „Gesichter erkennen“, bezeichnet im gerichtlichen Zusammenhang aber Parteilichkeit beziehungsweise Begünstigung. Die deutsche Formulierung ist natürlich und bewahrt den rechtsethischen Sinn.
- source_word: בַּמִּשְׁפָּט
  choice: im Gericht
  rationale: מִשְׁפָּט bezeichnet hier die richterliche Rechtsprechung beziehungsweise das Gerichtsverfahren, nicht nur abstrakte Gerechtigkeit.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: den Geringen ebenso wie den Großen
  rationale: Das Wortpaar kontrastiert Menschen von niedrigem und hohem Rang. „Gering“ und „groß“ bewahren das Bild und machen den sozialen Gegensatz verständlich.
- source_word: תִּשְׁמָעוּן
  choice: anhören
  rationale: שׁמע bezeichnet hier das gerichtliche Anhören einer Person oder Sache. „Anhören“ gibt diesen juristischen Sinn im modernen Deutschen präzise wieder.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: euch vor keinem Menschen fürchten
  rationale: Die wahrscheinlichste Bedeutung ist, aus Furcht vor einer Person zurückzuweichen. Die Formulierung bleibt nah am Hebräischen; die kontextuell mögliche Nuance „sich einschüchtern lassen“ wird in der Fußnote genannt.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: denn das Gericht gehört Gott
  rationale: Die Aussage begründet die Unparteilichkeit der Richter mit Gottes Hoheit über die Rechtsprechung, ohne näher festzulegen, ob besonders göttliches Recht, Autorität oder Rechenschaft gemeint ist.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: eine Sache, die zu schwierig für euch ist
  rationale: דָּבָר ist im Rechtszusammenhang eine Sache beziehungsweise ein Fall; die Wendung beschreibt einen Fall, der die Richter überfordert.
- source_word: תַּקְרִבוּן אֵלַי
  choice: vor mich bringen
  rationale: Der Hifil von קרב bedeutet „heranbringen“. „Vor mich bringen“ ist im gerichtlichen Zusammenhang idiomatisch und wahrt die Bewegung zum übergeordneten Richter.
- source_word: וּשְׁמַעְתִּיו
  choice: und ich werde sie anhören
  rationale: Das Suffix bezieht sich am natürlichsten auf die zuvor genannte Sache. „Anhören“ bewahrt die wiederholte gerichtliche Hör-Terminologie und vermeidet die stärkere Deutung „entscheiden“.
theological_decisions:
- issue: Göttliche Hoheit über das Gericht
  choice: „Das Gericht gehört Gott“ als offene Aussage über Gottes Autorität über die Rechtsprechung
  alternative: Die Aussage ausdrücklich als Gottes künftiges Gericht über die Richter oder als ausschließliche Bindung an göttliches Gesetz auslegen
  rationale: Der hebräische Wortlaut nennt Gott als den, dem das Gericht zukommt, entfaltet aber nicht, in welchem präzisen Sinn. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Generisches אִישׁ
  choice: „kein Mensch“
  alternative: „kein Mann“
  rationale: אִישׁ bezeichnet hier generisch jede Person, vor der ein Richter sich fürchten könnte. „Mensch“ gibt diesen Umfang im Deutschen genau wieder, ohne eine nicht beabsichtigte Beschränkung auf männliche Prozessbeteiligte nahezulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer juristischer Sprache. Die Anrede im Plural und die verpflichtenden Zukunftsformen des Hebräischen werden durch „sollt“ wiedergegeben. „Der Geringe“ und „der Große“ erhalten den sozialen Kontrast, während „anhören“ den gerichtlichen Kontext verdeutlicht.
