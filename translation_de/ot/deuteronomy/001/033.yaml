base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: de
  text: der euch auf dem Weg vorausging, um für euch einen Lagerplatz zu suchen[a], bei Nacht im Feuer, um euch den Weg zu zeigen, den ihr gehen solltet[b], und bei Tag in einer Wolke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um für euch einen Lagerplatz auszukundschaften“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ihr gehen würdet“. Wörtlicher: „um euch den Weg zu zeigen, den ihr gehen würdet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: der … herzog
  rationale: Das substantivisch-relativ gebrauchte Qal-Partizip führt die Beschreibung des HERRN aus dem vorhergehenden Vers fort. „Herzog“ gibt die Führung auf der Reise natürlich und im erzählerischen Rückblick wieder.
- source_word: לִפְנֵיכֶם
  choice: vor euch
  rationale: Die räumliche Wendung bezeichnet den HERRN als den, der dem Volk vorausging und es führte.
- source_word: בַּדֶּרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ bezeichnet hier den Reiseweg; „auf dem Weg“ ist idiomatisch und wahrt den konkreten Zusammenhang.
- source_word: לָתוּר
  choice: zu suchen
  rationale: Das Verb bezeichnet das suchende Erkunden eines geeigneten Ortes. „Suchen“ ist hier klar und natürlich; die stärker erkundende Nuance wird in Fußnote [a] kenntlich gemacht.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: einen Lagerplatz
  rationale: Die Verbindung meint einen Ort, an dem das Volk lagern kann. Das Kompositum „Lagerplatz“ bündelt die hebräische Zweckangabe knapp und verständlich.
- source_word: בָּאֵשׁ לַיְלָה
  choice: nachts im Feuer
  rationale: Die Formulierung bewahrt das Feuer als Erscheinungsweise der göttlichen Führung und bildet einen natürlichen Gegensatz zu „tagsüber in der Wolke“.
- source_word: לַרְאֹתְכֶם
  choice: um euch … zu zeigen
  rationale: Der Hifil-Infinitiv von ראה ist kausativ; im Zusammenhang der Wegführung ist „zeigen“ die natürliche deutsche Entsprechung.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: den Weg …, den ihr gehen solltet
  rationale: Die Relativkonstruktion bezeichnet den von Gott gewiesenen Reiseweg. „Solltet“ bringt die Wegweisung idiomatisch zum Ausdruck, ohne sie ausdrücklich zu einem moralischen Gebot zu machen.
- source_word: וּבֶעָנָן יוֹמָם
  choice: und tagsüber in der Wolke
  rationale: Die Wolke ist im Zusammenhang als bekannte Erscheinung bestimmt. Die Wortstellung ergibt einen klaren Parallelismus zu „nachts im Feuer“.
theological_decisions:
- issue: Identität des Subjekts
  choice: Der Vers beginnt abhängig vom vorhergehenden Satz mit „der … herzog“, ohne „der HERR“ erneut einzufügen.
  alternative: „der HERR, der … herzog“
  rationale: Im Hebräischen setzt der Relativausdruck die Nennung des HERRN aus dem vorhergehenden Vers fort. Die syntaktische Verbindung bleibt erhalten, ohne einen Gottesnamen in diesen Vers einzutragen, der dort nicht wiederholt wird.
- issue: Bedeutung der Wegweisung
  choice: „den ihr gehen solltet“
  alternative: „den ihr gehen würdet“
  rationale: Der Imperfekt kann die bevorstehende Bewegung bezeichnen; im Kontext göttlicher Führung liegt zugleich eine normative Wegweisung nahe. Die Übersetzung bewahrt diese Spannung, während Fußnote [b] die weniger normative Möglichkeit nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Relativsatz bewusst an den vorhergehenden Vers gebunden. Die parallelen Zeit- und Erscheinungsangaben „nachts im Feuer“ und „tagsüber in der Wolke“ folgen der hebräischen Struktur, ohne unnötig altertümlich zu klingen.
