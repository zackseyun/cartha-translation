base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: de
  text: Da kehrtet ihr zurück und weintet vor Jahwe. Doch Jahwe hörte nicht auf eure Stimme und schenkte euch kein Gehör.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe hörte nicht auf eure Stimme und neigte sein Ohr nicht zu euch.“ Das Hebräische verwendet zwei nahezu parallele Verben des Hörens und betont damit, dass Jahwe auf ihre Klage nicht einging.'
    reason: lexikalische Alternative und Erläuterung des hebräischen Parallelismus
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Da kehrtet ihr zurück
  rationale: שׁוּב bedeutet „zurückkehren/umkehren“. Im Erzählzusammenhang bezeichnet es die Rückkehr nach dem gescheiterten Angriff; „da“ gibt die fortschreitende Erzählfolge des Waw-Konsekutivs natürlich wieder.
- source_word: וַתִּבְכּוּ
  choice: und weintet
  rationale: בכה bedeutet „weinen“. Die Wiedergabe bewahrt den feierlich-ernsten Ton, ohne eine im Hebräischen nicht ausdrücklich genannte Intensität hinzuzufügen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet „vor/in der Gegenwart von“. „Vor Jahwe“ ist im Deutschen knapp, idiomatisch und quellennah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: Doch Jahwe hörte nicht auf eure Stimme
  rationale: שׁמע mit בְּקוֹל meint hier nicht bloß akustisches Hören, sondern auf eine Stimme hören beziehungsweise sie erhören. „Doch“ macht den im Zusammenhang liegenden Gegensatz zum Weinen deutlich, ohne den Sinn zu verändern.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: und schenkte euch kein Gehör
  rationale: האזין bedeutet „das Ohr neigen, aufmerksam hören“. Die deutsche Wendung bewahrt den Parallelismus mit dem vorigen Hörverb, vermeidet aber eine schwerfällige Wiederholung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Gottes Nichthören
  choice: hörte nicht auf eure Stimme und schenkte euch kein Gehör
  alternative: hörte eure Stimme nicht und neigte sein Ohr nicht zu euch
  rationale: Die beiden nahezu parallelen Verben bezeichnen in diesem Zusammenhang ausbleibendes Erhören beziehungsweise Reagieren, nicht mangelnde akustische Wahrnehmung. Die Formulierung lässt die ernste Spannung des Textes bestehen, ohne einen weitergehenden theologischen Grund hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede in der zweiten Person Plural und der hebräische Parallelismus bleiben erkennbar; altertümliche Wendungen werden vermieden.
