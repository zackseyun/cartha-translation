  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: de
  text: 'Wendet euch und brecht auf; zieht zum Bergland der Amoriter und zu allen, die ringsum wohnen: in der Araba, im Bergland, in der Schefela[a], im Negev und an der Meeresküste, in das Land der Kanaaniter und zum Libanon bis an den großen Strom, den Euphrat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schefela ist das westliche Hügelland beziehungsweise die Niederungs- und Vorgebirgszone zwischen dem judäischen Bergland und der Küstenebene.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ וּסְעוּ לָכֶם
  choice: Wendet euch und brecht auf
  rationale: פּנה bezeichnet hier die Richtungsänderung; נסע meint im Reisekontext das Aufbrechen. לָכֶם ist idiomatisch und verlangt im Deutschen kein reflexives »für euch«.
- source_word: וּבֹאוּ
  choice: zieht zum
  rationale: בוא bezeichnet die Bewegung zum genannten Ziel. Im deutschen Befehlszusammenhang ist »zieht zum« natürlich und schließt direkt an »brecht auf« an.
- source_word: הַר הָאֱמֹרִי
  choice: das Bergland der Amoriter
  rationale: הַר bezeichnet hier eine Bergregion, nicht einen einzelnen Berg; der Gentilname ist kollektiv gemeint.
- source_word: וְאֶל כָּל שְׁכֵנָיו
  choice: und zu allen, die ringsum wohnen
  rationale: Wörtlich »und zu allen seinen Nachbarn«. Die verbale Wiedergabe wahrt den Bezug auf die Bewohner der angrenzenden Gebiete und vermeidet eine im Deutschen unklare pronominale Zuordnung.
- source_word: בָּעֲרָבָה
  choice: in der Araba
  rationale: עֲרָבָה ist hier die geografische Bezeichnung für die Jordansenke beziehungsweise Araba und nicht bloß eine allgemeine Ebene.
- source_word: בָהָר
  choice: im Bergland
  rationale: הַר bezeichnet in dieser Aufzählung eine Landschaftszone im Hochland.
- source_word: וּבַשְּׁפֵלָה
  choice: in der Schefela
  rationale: שְׁפֵלָה ist hier die besondere westliche Hügelland- und Niederungsregion. Die Transliteration erhält den geografischen Namen; eine Fußnote erklärt ihn.
- source_word: וּבַנֶּגֶב
  choice: im Negev
  rationale: In der Reihe geografischer Regionen bezeichnet נֶגֶב das südliche Gebiet und nicht lediglich die Himmelsrichtung.
- source_word: וּבְחוֹף הַיָּם
  choice: an der Meeresküste
  rationale: חוֹף bezeichnet Küste oder Ufer; »Meeresküste« gibt den Ausdruck knapp und verständlich wieder.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: in das Land der Kanaaniter
  rationale: Der singularische Gentilname wird kollektiv gebraucht; der deutsche Plural ist hier natürlich.
- source_word: וְהַלְּבָנוֹן
  choice: und zum Libanon
  rationale: Der Ortsname wird im modernen Deutschen ohne Artikel gebraucht; die Präposition verdeutlicht seine Einbindung in die Zielangabe.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: bis an den großen Strom, den Euphrat
  rationale: Die Apposition identifiziert den »großen Strom« als Euphrat. »Strom« bewahrt die feierliche Bezeichnung eines großen Flusses.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Folge der geografischen Regionen bleibt erhalten. »Wendet euch« bewahrt den Richtungswechsel, während »brecht auf« das Losziehen idiomatisch ausdrückt. Der Doppelpunkt macht deutlich, dass die anschließende Liste die umliegenden Wohngebiete näher bestimmt, ohne die syntaktische Mehrdeutigkeit unnötig zu glätten.
