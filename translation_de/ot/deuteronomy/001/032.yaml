base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: de
  text: Doch in dieser Sache vertrautet ihr nicht auf den HERRN, euren Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glaubtet ihr nicht an den HERRN, euren Gott“; auch möglich: „glaubtet ihr dem HERRN, eurem Gott, nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Doch in dieser Sache
  rationale: דָּבָר bezeichnet hier die zuvor geschilderte Angelegenheit; וּבַ wird im Zusammenhang des Vorwurfs natürlich und leicht adversativ mit „Doch in“ wiedergegeben.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: vertrautet ihr nicht
  rationale: Die Negation mit dem Hifil-Partizip von אמן beschreibt Israels anhaltende Haltung in der erzählten Situation. Bei einer Person als Bezugsgröße gibt „vertrauen“ die relationale Bedeutung im Deutschen natürlich wieder.
- source_word: בַּ/יהוָה
  choice: auf den HERRN
  rationale: Die Präposition ב bei אמן markiert den Gegenstand des Vertrauens. „Auf den HERRN vertrauen“ bildet die hebräische Konstruktion idiomatisch ab; der Gottesname יהוה wird traditionsgemäß als „der HERR“ wiedergegeben.
- source_word: אֱלֹהֵי/כֶם
  choice: euren Gott
  rationale: Die Constructusverbindung mit dem Suffix der 2. Person Plural wird direkt wiedergegeben und bewahrt den Bundesbezug.
theological_decisions:
- issue: Bedeutung von אמן + ב in Bezug auf den HERRN
  choice: auf den HERRN, euren Gott, vertrauen
  alternative: an den HERRN, euren Gott, glauben; dem HERRN, eurem Gott, glauben
  rationale: Die Konstruktion kann Vertrauen beziehungsweise Glauben an eine Person ausdrücken. „Vertrauen auf“ ist im Deutschen idiomatisch und bewahrt die relationale Dimension; die Fußnote hält die mögliche Betonung des Glaubens an Gottes Wort beziehungsweise Zusage offen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Anrede im Plural und der vorwurfsvolle Kontrast des Zusammenhangs bleiben erhalten.
