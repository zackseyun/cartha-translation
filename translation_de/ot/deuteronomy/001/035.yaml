  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: de
  text: Keiner von diesen Männern, dieser bösen Generation, wird das gute Land sehen, das ich euren Vätern[a] zu geben geschworen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euren Vorfahren«. Hebräisch: »euren Vätern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kein einziger … wird
  rationale: אִם leitet hier im Zusammenhang mit dem göttlichen Schwur keine gewöhnliche Bedingung, sondern eine nachdrückliche Verneinung ein.
- source_word: יִרְאֶה
  choice: wird … sehen
  rationale: Die Grundbedeutung „sehen“ bleibt erhalten; im Gerichtskontext schließt die Wendung das Betreten und Erleben des Landes ein, ohne dies im Text auszudeuten.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: kein einziger Mann unter diesen Männern
  rationale: Der Singular אִישׁ hat in der negativen Schwurformel verteilenden und emphatischen Sinn; בָּאֲנָשִׁים ist partitiv.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: dieser bösen Generation
  rationale: רַע bezeichnet hier moralische Verwerflichkeit; „böse“ ist daher treffender als „schlecht“.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: das gute Land
  rationale: Die direkte Wiedergabe bewahrt sowohl die Güte als auch die Begehrenswürdigkeit des verheißenen Landes.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: das ich … zu geben geschworen habe
  rationale: Die Formulierung gibt den Eidcharakter von נשבע und den Infinitiv נתן eng und idiomatisch wieder.
- source_word: לַאֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: Der hebräische Ausdruck lautet ausdrücklich „euren Vätern“ und bezieht sich hier auf Israels Vorväter; die mögliche allgemeinere Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von לַאֲבֹתֵיכֶם
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Die Hauptübersetzung wahrt die ausdrücklich maskuline Form des Hebräischen. „Vorfahren“ ist sachlich möglich, wird aber als lexikalische Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Formulierung „Mann unter diesen Männern“ folgt bewusst der emphatischen hebräischen Ausdrucksweise; die Apposition „dieser bösen Generation“ bewahrt die syntaktische Zuordnung des Ausgangstextes.
