base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: de
  text: Wie könnte ich allein eure Mühsal, eure Last und eure Streitfälle[a] tragen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Streitigkeiten“ oder „eure Rechtssachen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie könnte
  rationale: Leitet eine rhetorische Frage ein, die Überforderung beziehungsweise Unmöglichkeit ausdrückt; der Konjunktiv gibt diese Aussagekraft im Deutschen natürlich wieder.
- source_word: אֶשָּׂא
  choice: tragen
  rationale: נשׂא bedeutet hier übertragen, Verantwortung und Belastungen auf sich zu nehmen; „tragen“ passt zu allen drei folgenden Begriffen.
- source_word: לְבַדִּי
  choice: ich allein
  rationale: Bewahrt die Betonung darauf, dass Mose diese Aufgabe nicht ohne Unterstützung bewältigen kann.
- source_word: טָרְחֲכֶם
  choice: eure Mühsal
  rationale: טֹרַח bezeichnet Mühe, Beschwer und zermürbende Belastung. „Mühsal“ unterscheidet den Ausdruck von der folgenden „Last“ und wahrt den würdevollen Ton.
- source_word: מַשַּׂאֲכֶם
  choice: eure Last
  rationale: מַשָּׂא bezeichnet eine zu tragende Last, hier im übertragenen Sinn; „Last“ ist prägnant und idiomatisch.
- source_word: רִיבְכֶם
  choice: eure Streitfälle
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtssache bezeichnen. „Streitfälle“ hält sowohl die zwischenmenschliche als auch die richterlich-rechtliche Dimension offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dreierreihe des Hebräischen bleibt erhalten; „Streitfälle“ wahrt bewusst die Bandbreite zwischen persönlichem Streit und einem vor Gericht gebrachten Fall.
