source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: de
  text: Seht[a], ich habe euch das Land vor Augen gestellt. Zieht hinein und nehmt das Land in Besitz[b], das Jahwe euren Vätern – Abraham, Isaak und Jakob[c] – geschworen hat, ihnen und ihren Nachkommen nach ihnen[d] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein singularischer Aufmerksamkeitsruf: „Sieh!“; Israel wird dabei als Einheit angesprochen.'
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: 'Oder: „besitzt das Land“ beziehungsweise „nehmt das Land als Erbbesitz an“. Das hebräische Verb kann Besitzergreifung und Erbbesitz bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Mit „euren Vätern“ sind hier ausdrücklich Abraham, Isaak und Jakob gemeint.
    reason: referent_clarification
  - marker: d
    text: 'Wörtlich: „ihrem Samen nach ihnen“; gemeint ist ihre Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Seht
  rationale: Der formal singularische Imperativ dient als eindringlicher Aufmerksamkeitsruf an Israel als kollektives Gegenüber. Im Deutschen passt sich der Plural „Seht“ natürlich an die unmittelbar folgenden Pluralformen an, ohne die Hervorhebung aufzugeben.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: ich habe euch ... vor Augen gestellt
  rationale: נתן mit לִפְנֵי bezeichnet hier das Vorlegen bzw. Bereitstellen. „Vor Augen gestellt“ ist gegenwärtiges, verständliches Deutsch und bewahrt die bildhafte Aussage stärker als ein bloßes „gegeben“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet im Zusammenhang das verheißene Land; „Land“ ist die übliche, hinreichend offene Wiedergabe.
- source_word: בֹּאוּ
  choice: Zieht hinein
  rationale: Der pluralische Imperativ fordert zur Bewegung in das Land auf. „Zieht hinein“ gibt Richtung und gemeinschaftliche Bewegung natürlich wieder.
- source_word: וּרְשׁוּ
  choice: nehmt ... in Besitz
  rationale: ירשׁ kann in diesem Zusammenhang Besitzergreifung, Inbesitznahme oder Erbbesitz bezeichnen. „In Besitz nehmen“ bewahrt den aktiven Aspekt, ohne den Verheißungscharakter auszublenden.
- source_word: נִשְׁבַּע יְהוָה
  choice: das Jahwe ... zugeschworen hat
  rationale: „Zuschwören“ bildet den Eid zugunsten der genannten Empfänger idiomatisch ab. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: לַאֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: Das ausdrücklich maskuline אֲבוֹת wird präzise wiedergegeben; Abraham, Isaak und Jakob werden unmittelbar als die gemeinten Väter genannt.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die drei Namen erläutern appositionell „euren Vätern“. Im Deutschen ist die einmalige Kasusmarkierung durch den Rahmen der Apposition ausreichend und flüssig.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: um es ihnen und ihren Nachkommen nach ihnen zu geben
  rationale: זֶרַע ist formal ein kollektiver Singular („Same“), bezeichnet hier aber die fortdauernde Nachkommenschaft. „Nachkommen“ ist klar und wahrt den kollektiven Bezug; „nach ihnen“ bleibt als zeitlich-generationale Bestimmung erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ macht den Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der Patriarchen in אֲבֹתֵיכֶם
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Die nachfolgende Nennung Abrahams, Isaaks und Jakobs zeigt, dass konkrete männliche Stammväter gemeint sind; die geschlechtsspezifische Form des Ausgangstextes bleibt daher erhalten.
- issue: Verhältnis von Verheißung und Besitzergreifung in וּרְשׁוּ
  choice: nehmt ... in Besitz
  alternative: besitzt; erbt
  rationale: Die Formulierung wahrt die Spannung zwischen dem bereits von Gott bereitgestellten Land und der noch geforderten tatsächlichen Besitzergreifung. Sie legt den Vorgang weder ausschließlich als militärische Eroberung noch ausschließlich als passives Erben aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter imperativischer Rede. Der Satzrhythmus folgt dem Hebräischen, wird aber durch Gedankenstriche um die patriarchale Apposition lesbarer gemacht. Die Wiederholung von „das Land“ bleibt zur Bewahrung des Nachdrucks erhalten.
