base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: de
  text: Da wandten sie sich um und zogen ins Bergland hinauf. Sie kamen bis zum Tal Eschkol[a] und kundschafteten das Land aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wadi Eschkol“ beziehungsweise „Bachtal Eschkol“; das hebräische Wort kann ein Tal mit einem nur zeitweise wasserführenden Bachbett bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: Da wandten sie sich um
  rationale: פנה bezeichnet hier in der fortlaufenden Erzählung eine Richtungsänderung; „sich umwenden“ gibt dies unmittelbar und natürlich wieder.
- source_word: וַיַּעֲלוּ הָהָרָה
  choice: zogen ins Bergland hinauf
  rationale: עלה drückt die Aufwärtsbewegung aus, während die Richtungsendung an הָהָרָה die Bewegung ins Bergland bezeichnet. Die Formulierung verbindet beide Aspekte idiomatisch.
- source_word: וַיָּבֹאוּ עַד
  choice: Sie kamen bis
  rationale: בוא mit עַד bezeichnet das Gelangen bis zu einem bestimmten Ort; „kamen bis“ bewahrt diese Grenz- bzw. Zielnuance.
- source_word: נַחַל אֶשְׁכֹּל
  choice: Tal Eschkol
  rationale: נַחַל kann ein Tal beziehungsweise Wadi mit einem zeitweise wasserführenden Bachbett bezeichnen. „Tal Eschkol“ ist im deutschen Haupttext klar und geografisch natürlich; die weitere Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: וַיְרַגְּלוּ
  choice: kundschafteten ... aus
  rationale: Das Piel von רגל meint gezieltes Erkunden beziehungsweise Ausspähen. „auskundschaften“ wahrt den Erkundungs- und Spionagecharakter, ohne unnötig schwer zu klingen.
- source_word: אֹתָהּ
  choice: es
  rationale: Das feminine Singularpronomen verweist auf das zuvor vorausgesetzte Land beziehungsweise Gebiet. Im Deutschen nimmt „es“ idiomatisch das sächliche „Bergland“ oder allgemein das Gebiet auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. „Bergland“ und „auskundschaften“ bewahren die topografische beziehungsweise militärische Nuance des Hebräischen; die Mehrdeutigkeit von נַחַל wird in der Fußnote kenntlich gemacht.
