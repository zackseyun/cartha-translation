base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: de
  text: Dies sind die Worte, die Mose zu ganz Israel jenseits des Jordan[a] sprach, in der Wüste, in der Araba[b], gegenüber von Sup[c], zwischen Paran, Tofel, Laban, Hazerot und Di-Sahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »auf der anderen Seite des Jordan«. Die hebräische Wendung kann je nach geografischem Blickpunkt unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: »Araba« ist eine geografische Bezeichnung für die Senke beziehungsweise Ebenenlandschaft des Jordangrabens; traditionell wird auch »Ebene« übersetzt.
    reason: cultural_note
  - marker: c
    text: 'Hebräisch: »Sup«. Manche verstehen dies als Ortsnamen, andere bringen es mit dem »Schilfmeer« in Verbindung; das Wort »Meer« steht hier jedoch nicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Dies sind die Worte
  rationale: Die präsentierende Eröffnungsformel wird natürlich und würdevoll wiedergegeben; »Worte« passt zum folgenden Verb des Sprechens.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: die Mose … sprach
  rationale: Die Relativkonstruktion und der formelle Charakter der Rede bleiben erhalten.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: zu ganz Israel
  rationale: Gibt die Gesamtheit des Volkes wieder und entspricht natürlichem Standarddeutsch.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Bewahrt die traditionelle geografische Wendung, ohne den räumlichen Blickpunkt über die hebräische Formulierung hinaus festzulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: »Wüste« ist im Deutschen die geläufige biblisch-geografische Bezeichnung und muss nicht ausschließlich eine Sandwüste meinen.
- source_word: בָּעֲרָבָה
  choice: in der Araba
  rationale: Die Transliteration bewahrt den geografischen Eigenwert des Begriffs statt ihn verengend mit »Ebene« zu übersetzen.
- source_word: מוֹל סוּף
  choice: gegenüber von Suf
  rationale: מוֹל bezeichnet die Lage gegenüber einem Ort; סוּף bleibt als möglicher Ortsname stehen, da »Meer« im hebräischen Text fehlt.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: zwischen Paran, Tofel, Laban, Hazerot und Di-Sahab
  rationale: Die Ortsnamen werden in einer natürlichen deutschen Aufzählung wiedergegeben, ohne ein inhaltliches Element auszulassen.
- source_word: דִי זָהָב
  choice: Di-Sahab
  rationale: Der Ausdruck wird als Ortsname transliteriert und nicht nach seiner möglichen wörtlichen Bedeutung gedeutet.
