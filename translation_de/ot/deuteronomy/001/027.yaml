  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: de
  text: 'Und ihr murrtet in euren Zelten und sagtet: »Weil Jahwe uns hasst, hat er uns aus dem Land Ägypten herausgeführt, um uns in die Gewalt der Amoriter[a] zu geben und uns zu vernichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Hand des Amoriters«; die Einzahl bezeichnet hier kollektiv das Volk der Amoriter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: ihr murrtet
  rationale: רגן bezeichnet unzufriedenes, vorwurfsvoll gemurmeltes Klagen. „Murren“ ist im Deutschen prägnant und bewahrt diesen negativen Unterton.
- source_word: בְאָהֳלֵיכֶם
  choice: in euren Zelten
  rationale: Die konkrete Ortsangabe wird unmittelbar wiedergegeben und bewahrt den erzählten Lebenskontext Israels.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Weil Jahwe uns hasst
  rationale: Die Konstruktion mit בְּ und dem Abstraktnomen „Hass“ ist hier kausal zu verstehen. Die verbale Fassung ist natürliches modernes Deutsch und kennzeichnet die Aussage als Vorwurf des Volkes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: hat er uns aus dem Land Ägypten herausgeführt
  rationale: Die Formulierung gibt sowohl das Herausführen als auch אֶרֶץ ausdrücklich wieder und klingt zugleich idiomatisch.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: um uns in die Gewalt der Amoriter zu geben
  rationale: „In die Gewalt geben“ überträgt die hebräische Hand-Metapher verständlich und bewahrt den Sinn der Auslieferung unter fremde Macht.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular bezeichnet kollektiv die Volksgruppe und wird daher im Deutschen im Plural wiedergegeben.
- source_word: לְהַשְׁמִידֵנוּ
  choice: uns zu vernichten
  rationale: Der Hifil von שׁמד bezeichnet vollständige Zerstörung beziehungsweise Ausrottung. „Vernichten“ erhält die starke Aussage, ohne sie umgangssprachlich auszudrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration wahrt dessen Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Aussage, Jahwe hasse Israel
  choice: als direkte Anschuldigung des Volkes unverändert wiedergegeben
  alternative: durch eine abschwächende Deutung wie „Weil wir meinten, Jahwe hasse uns“ erläutern
  rationale: Der Vers berichtet die Behauptung der Israeliten, ohne sie in der direkten Rede abzumildern. Die Übersetzung bewahrt diese theologische Spannung und macht die Behauptung nicht zur Aussage des Erzählers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Murrtet“ erhält den vorwurfsvollen Klang des hebräischen Verbs; „in die Gewalt … geben“ macht das hebräische Hand-Idiom natürlich verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Volksbezeichnung.
