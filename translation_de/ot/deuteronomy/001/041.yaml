base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: de
  text: 'Darauf antwortetet ihr mir: »Wir haben gegen Jahwe gesündigt. Wir wollen hinaufziehen und kämpfen, ganz so, wie Jahwe, unser Gott, es uns geboten hat.« Da legte jeder von euch seine Kriegswaffen an, und in eurem Übermut machtet ihr euch auf[a], ins Bergland[b] hinaufzuziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das seltene hebräische Verb kann auch bedeuten: »ihr machtet euch unbesonnen daran« oder »ihr zogt vermessen hinauf«; es bezeichnet hier offenbar ein übermäßig selbstsicheres, leichtfertiges Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Berg hinauf«; das hebräische Wort kann in diesem Zusammenhang auch die gesamte Bergregion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: Darauf antwortetet ihr mir
  rationale: Die beiden hebräischen Redeeinleitungen werden in natürlichem Deutsch zu einer knappen Einleitung zusammengezogen; der Antwortcharakter bleibt erhalten.
- source_word: חָטָאנוּ לַיהוָה
  choice: Wir haben gegen Jahwe gesündigt
  rationale: חטא mit ל bezeichnet hier den, gegen den sich die Sünde richtet; „gegen … gesündigt“ ist die idiomatische deutsche Wiedergabe.
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: Wir wollen hinaufziehen und kämpfen
  rationale: Die Kohortativbedeutung drückt den entschlossenen Vorsatz der Sprecher aus; „hinaufziehen“ bewahrt zugleich die räumliche Bewegung.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: ganz so, wie … es uns geboten hat
  rationale: Die Formulierung gibt die behauptete vollständige Übereinstimmung mit dem göttlichen Gebot wieder, ohne die Spannung zum unmittelbar folgenden Ungehorsam aufzulösen.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: Da schnallte sich jeder von euch seine Kriegswaffen um
  rationale: חגר bezeichnet das Anlegen beziehungsweise Umschnallen der Ausrüstung; der distributive Singular אִישׁ wird durch „jeder von euch“ deutlich gemacht.
- source_word: וַתָּהִינוּ
  choice: in eurem Übermut wagtet ihr es
  rationale: Das seltene Verb bezeichnet im Kontext ein selbstsicheres, unbesonnenes Unternehmen. Die Wiedergabe wahrt sowohl den Handlungsaspekt als auch die negative Färbung.
- source_word: לַעֲלֹת הָהָרָה
  choice: ins Bergland hinaufzuziehen
  rationale: הָהָר kann einen einzelnen Berg oder eine bergige Region bezeichnen; hier passt die geografisch weiter gefasste Bedeutung „Bergland“ zum Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Moralische Nuance von וַתָּהִינוּ
  choice: in eurem Übermut wagtet ihr es
  alternative: ihr machtet euch daran / ihr zogt unbesonnen hinauf
  rationale: Der unmittelbare Zusammenhang kennzeichnet das Unternehmen als eigenmächtig und ungehorsam. Die Übersetzung lässt jedoch in einer Fußnote erkennen, dass Bedeutung und genaue Stärke des seltenen Verbs unsicher sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich nachvollziehbar. „Kriegswaffen“ bewahrt die martialische Aussage des Hebräischen, während „Bergland“ den wahrscheinlichen geografischen Sinn wiedergibt. Die negative, aber lexikalisch nicht völlig eindeutige Färbung des seltenen Verbs וַתָּהִינוּ wird im Text erkennbar und in der Fußnote offengelegt.
