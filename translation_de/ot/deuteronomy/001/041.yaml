- from: 'Darauf antwortetet ihr mir: »Wir haben gegen Jahwe gesündigt. Wir wollen hinaufziehen und kämpfen, ganz so, wie Jahwe, unser Gott, es uns geboten hat.« Da schnallte sich jeder von euch seine Kriegswaffen um, und in eurem Übermut wagtet ihr es[a], ins Bergland[b] hinaufzuziehen.'
  to: 'Darauf antwortetet ihr mir: »Wir haben gegen Jahwe gesündigt. Wir wollen hinaufziehen und kämpfen, ganz so, wie Jahwe, unser Gott, es uns geboten hat.« Da legte jeder von euch seine Kriegswaffen an, und in eurem Übermut machtet ihr euch auf[a], ins Bergland[b] hinaufzuziehen.'
  rationale: Die Revision ersetzt die potenziell sinnverschiebende Wendung „wagtet ihr es“ durch „machtet ihr euch auf“, verbunden mit „in eurem Übermut“. Damit bleiben sowohl der Aufbruch als auch die im Kontext erkennbare vermessene Haltung erhalten, ohne die umstrittene Nuance des seltenen Verbs zu stark festzulegen. Außerdem wird das Anlegen der militärischen Ausrüstung idiomatischer formuliert. Fußnoteninhalt und -anker bleiben sachgerecht erhalten.
