base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: de
  text: 'Sie nahmen etwas von der Frucht des Landes mit und brachten es zu uns herab. Sie erstatteten uns Bericht und sagten: »Das Land, das Jahwe, unser Gott, uns gibt, ist gut.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: sie nahmen … in ihre Hände
  rationale: Gibt sowohl das gewöhnliche narrative »nahmen« als auch das konkrete hebräische Bild des Tragens in den Händen wieder.
- source_word: מִפְּרִי הָאָרֶץ
  choice: etwas von der Frucht des Landes
  rationale: 'Das מִן wird partitiv verstanden: Die Kundschafter nahmen eine Probe vom Ertrag des Landes mit. Der kollektive Singular »Frucht« bleibt erhalten.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: brachten es zu uns herab
  rationale: Bewahrt die Richtungsangabe des Hifil von ירד, die eine Bewegung aus dem höher gelegenen Land hinab zum Lager bezeichnet.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: sie brachten uns Nachricht zurück
  rationale: Gibt die idiomatische Bedeutung eines zurückgebrachten Berichts wieder und lässt zugleich die Rückkehrvorstellung von שוב erkennen.
- source_word: טוֹבָה הָאָרֶץ
  choice: Das Land … ist gut
  rationale: »Gut« bewahrt die breite positive Bewertung von טוֹבָה, ohne sie unnötig auf Fruchtbarkeit, Schönheit oder Eignung einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: נֹתֵן לָנוּ
  choice: uns gibt
  rationale: Der deutsche Präsensausdruck gibt den partizipial dargestellten gegenwärtigen beziehungsweise sich vollziehenden Vorgang natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst; die Umschrift »Jahwe« macht dies sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Zeitlicher Aspekt von נֹתֵן
  choice: uns gibt
  alternative: uns geben wird
  rationale: Das Partizip bezeichnet Gottes Gabe als gegenwärtig oder im Vollzug begriffen. Eine reine Zukunftsform würde die Aussage stärker festlegen, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge und die konkrete Bewegungsrichtung des Hebräischen bleiben sichtbar; die ungewöhnliche hebräische Berichtswendung wird im Haupttext lesbar formuliert und in der Fußnote transparent gemacht.
