    rationale: „Sie brachten uns Nachricht zurück“ ist keine natürliche deutsche Kollokation. Die idiomatische Bedeutung von וַיָּשִׁבוּ אֹתָנוּ דָבָר lautet, dass sie Bericht erstatteten; die wörtliche Formulierung bleibt in der Fußnote dokumentiert.
