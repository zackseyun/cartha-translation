  source_fidelity: Der Entwurf gibt die partitive Fruchtprobe, die Abwärtsbewegung zu Israel, den Bericht der Kundschafter und die positive Beurteilung des Landes zutreffend wieder. Die hebräische Wendung וַיָּשִׁבוּ אֹתָנוּ דָבָר ist idiomatisch ein Bericht; ihre wörtliche Bildlichkeit kann sinnvoll in der Fußnote stehen. Das Präsens „gibt“ gibt das Partizip נֹתֵן angemessen wieder, ohne es unnötig als reine Zukunft festzulegen.
  naturalness: „Etwas von der Frucht des Landes in ihre Hände nehmen“ ist im modernen Standarddeutsch unidiomatisch. „… mitnehmen“ gibt die in diesem Zusammenhang gemeinte konkrete Mitnahme natürlich wieder. Auch „uns Nachricht zurückbringen“ klingt im Deutschen nicht idiomatisch und kann missverständlich sein; „uns Bericht erstatten“ ist die natürliche Entsprechung.
  terminology: „Jahwe“, „unser Gott“, „Land“ und „gut“ sind treffend und registergerecht. Die Anführungszeichen und der würdige, verständliche Erzählton sind passend.
