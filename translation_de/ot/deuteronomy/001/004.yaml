translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung von Deuteronomium 1,3 formuliert. Die beiden mit בְּ eingeleiteten Ortsnamen werden parallel wiedergegeben; dadurch bleibt die im Hebräischen knappe Beziehung der Ortsangaben möglichst offen.
