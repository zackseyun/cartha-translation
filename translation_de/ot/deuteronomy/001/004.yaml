  naturalness: Der Satz ist insgesamt natürliches modernes Standarddeutsch und kann als Fortsetzung von Vers 3 stehen. „Edreï“ ist im heutigen deutschen Bibelgebrauch unüblich; „Edrei“ ist die geläufige Form. Die knappe doppelte Ortsangabe wird mit einer Fußnote transparent gemacht, statt sie durch „und“ auszudeuten.
  terminology: Sihon, Heschbon, Og und Baschan sind passend. „König der Amoriter“ und „König von Baschan“ sind idiomatisch und quellentreu. „geschlagen“ wahrt bei nüchternem Register die stärkere Bedeutung von נכה besser als „besiegt“.
