base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: de
  text: nachdem er Sihon, den König der Amoriter, der in Heschbon wohnte, und Og, den König von Baschan, der in Aschtarot, in Edrei, wohnte[a], geschlagen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „der in Aschtarot und Edrei wohnte“. Das Hebräische nennt beide Orte jeweils mit „in“; ihre genaue Beziehung zueinander wird nicht ausdrücklich bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: nachdem er … besiegt hatte
  rationale: Die Verbindung aus אַחֲרֵי und Infinitiv constructus bezeichnet eine Handlung, die dem Sprechen des Mose in Vers 3 vorausging. Das Plusquamperfekt gibt dieses Zeitverhältnis im Deutschen natürlich wieder. נכה bezeichnet hier das vernichtende militärische Schlagen; „besiegt“ ist in diesem Zusammenhang idiomatisch und hinreichend deutlich.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, den König der Amoriter
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben; die Konstruktverbindung bezeichnet Sihon als König des betreffenden Volkes.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: der in Heschbon wohnte
  rationale: יָשַׁב bezeichnet hier den Wohn- beziehungsweise Herrschaftssitz. „wohnte“ ist modernes, klares Deutsch.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, den König von Baschan
  rationale: Die Konstruktverbindung bezeichnet Og als König der Region Baschan; im Deutschen ist „König von Baschan“ natürlich.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: der in Aschtarot und in Edreï wohnte
  rationale: Das Hebräische nennt beide Orte jeweils mit בְּ. Die koordinierende Wiedergabe bewahrt beide Ortsangaben, ohne ein im Ausgangstext nicht ausdrücklich bezeichnetes Unterordnungsverhältnis zwischen ihnen einzuführen.
