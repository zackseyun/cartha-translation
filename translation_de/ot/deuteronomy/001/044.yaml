  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: de
  text: Da zogen die Amoriter[a], die in jenem Bergland[b] wohnten, euch entgegen. Sie verfolgten euch, wie es die Bienen tun, und schlugen euch in Seïr bis Horma nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Amoriter«; die hebräische Einzahl bezeichnet hier die Amoriter als Volk, wie die folgenden Verben in der Mehrzahl zeigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf jenem Berg«; das hebräische Wort kann sowohl einen einzelnen Berg als auch ein Bergland bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da zogen … entgegen
  rationale: יצא bezeichnet hier das Heraus- bzw. Ausziehen der Bewohner zur feindlichen Begegnung; zusammen mit לקראתכם ergibt sich im Deutschen natürlich „jemandem entgegenziehen“.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Die Form ist morphologisch singularisch, wird aber kollektiv gebraucht, wie die folgenden pluralischen Verben zeigen.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: die in jenem Bergland wohnten
  rationale: Der Partizipialausdruck bezeichnet dauerhaften Wohnsitz. הַר kann einen einzelnen Berg oder eine bergige Region meinen; im geografischen Zusammenhang ist „Bergland“ angemessen.
- source_word: לִקְרַאתְכֶם
  choice: euch entgegen
  rationale: לקראת bezeichnet die Bewegung zur Begegnung hin; der feindliche Zusammenhang wird durch Verfolgung und Niederschlagen deutlich, ohne dass die Wendung selbst überdeutet wird.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: Sie verfolgten euch
  rationale: רדף ist das gewöhnliche Verb für Verfolgung, besonders auch in militärischen Zusammenhängen.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: wie es die Bienen tun
  rationale: Die ungewöhnlich ausführliche Vergleichsformel wird bewahrt, statt sie zum bloßen „wie Bienen“ zu verkürzen.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: schlugen euch … nieder
  rationale: כתת im Hifil bezeichnet heftiges Schlagen bzw. Zerschlagen; „niederschlagen“ gibt die gewaltsame Niederlage wieder, ohne das Ergebnis weiter zu spezifizieren.
- source_word: בְּשֵׂעִיר
  choice: in Seïr
  rationale: ב bezeichnet hier am einfachsten den räumlichen Bereich, in dem die Niederlage stattfand.
- source_word: עַד חָרְמָה
  choice: bis Horma
  rationale: עד markiert die geografische Grenze bzw. Ausdehnung des Geschehens.
theological_decisions: []
