source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: de
  text: So redete ich zu euch, aber ihr hörtet nicht. Ihr widersetztet euch dem Befehl Jahwes[a], handeltet vermessen und zogt ins Bergland hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Mund Jahwes“; gemeint ist das, was Jahwe befohlen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: So redete ich zu euch
  rationale: דבר im Piel bedeutet „reden/sprechen“. „So“ gibt den folgernden Erzählzusammenhang natürlich wieder; „euch“ bezeichnet bereits eindeutig die angesprochene Mehrzahl.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: aber ihr hörtet nicht
  rationale: שׁמע kann „hören“, „zuhören“ oder „gehorchen“ bedeuten. „Hörtet nicht“ bewahrt diese Bedeutungsbreite und passt zum unmittelbar vorausgehenden Reden Moses, ohne die Aussage vorschnell auf „gehorchen“ festzulegen.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: Ihr widersetztet euch dem Befehl Jahwes
  rationale: מרה bezeichnet Auflehnung oder Widersetzlichkeit. Die Wendung „Mund Jahwes“ meint hier idiomatisch das von Jahwe Ausgesprochene beziehungsweise Gebotene; „Befehl“ ist im Deutschen klar und kontextgerecht, während die Fußnote die konkrete hebräische Bildsprache erhält.
- source_word: וַתָּזִדוּ
  choice: handeltet vermessen
  rationale: זיד beschreibt stolzes, anmaßendes oder vermessenes Handeln. Die verbale Formulierung gibt wieder, dass die Angesprochenen eigenmächtig handelten.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: zogt ins Bergland hinauf
  rationale: עלה bezeichnet die Bewegung nach oben; die Richtungsendung an הָהָרָה markiert das Ziel. „Ins Bergland hinaufziehen“ ist eine natürliche deutsche Wiedergabe des topografischen Sinns im Kontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname und ist die im modernen Deutschen übliche wissenschaftlich begründete Umschrift.
- issue: Idiomhafte Wendung אֶת־פִּי יְהוָה
  choice: dem Befehl Jahwes
  alternative: dem Mund Jahwes; dem Wort Jahwes
  rationale: Wörtlich steht „Mund Jahwes“, doch die Wendung bezeichnet hier das von Jahwe Gebotene. Die Hauptübersetzung vermittelt den gemeinten Sinn, während die Fußnote die hebräische Ausdrucksweise transparent macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Präteritum entspricht der rückblickenden Rede Moses. Die kurzen, koordinierten Aussagen bewahren den nachdrücklichen Fortgang des Hebräischen.
