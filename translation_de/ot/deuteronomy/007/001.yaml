source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: de
  text: Wenn Jahwe, dein Gott, dich in das Land bringt, in das du hineinziehst, um es in Besitz zu nehmen, und viele Völker vor dir vertreibt[a] – die Hethiter, Girgaschiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter, sieben Völker, zahlreicher und mächtiger als du[b] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „enteignet“.'
    reason: Das hebräische Verb kann sowohl das Vertreiben als auch den dadurch bewirkten Verlust des Besitzes hervorheben.
  - marker: b
    text: 'Oder: „größer und stärker als du“.'
    reason: Die Adjektive können neben zahlenmäßiger Überlegenheit und Macht auch allgemeiner Größe und Stärke bezeichnen.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion leitet hier die Situation ein, auf die sich die folgenden Anweisungen beziehen; temporal-konditionales „Wenn“ entspricht dem Zusammenhang.
- source_word: יְבִיאֲךָ
  choice: dich … bringt
  rationale: Der Hifil von בוא bezeichnet das Hineinbringen in ein Zielgebiet; die Zielangabe folgt im Deutschen unmittelbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: „Land“ ist im Deutschen die natürliche und im Deuteronomium sachlich passende Bezeichnung für das verheißene Gebiet.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: in das du hineinziehst
  rationale: Die Form beschreibt Israels bevorstehenden Einzug. „hineinziehst“ gibt Bewegung und gemeinschaftlichen Zug idiomatisch wieder, ohne das im Deutschen überflüssige „dorthin“ nachzuahmen.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירשׁ bezeichnet hier die aktive Besitzergreifung des Landes; diese Formulierung bewahrt den Zweckcharakter des Infinitivs.
- source_word: וְנָשַׁל
  choice: und … vertreibt
  rationale: Das Verb bezeichnet das Entfernen beziehungsweise Verdrängen der bisherigen Bewohner. „vertreibt“ ist natürlich und passt zur Wendung „vor dir“.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: Gemeint sind mehrere ethnisch-politische Bevölkerungsgruppen; „Völker“ ist im Deutschen treffender als „Nationen“.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die hebräische Wendung bezeichnet das Entfernen aus Israels Weg beziehungsweise Gegenwart und lässt sich knapp mit „vor dir“ wiedergeben.
- source_word: הַחִתִּי … הַיְבוּסִי
  choice: die Hetiter, Girgaschiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter
  rationale: Die singularischen hebräischen Volksbezeichnungen werden gemäß deutschem Sprachgebrauch kollektiv im Plural wiedergegeben.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: sieben Völker, zahlreicher und mächtiger als du
  rationale: רבים bezeichnet im Vergleich am ehesten zahlenmäßige Überlegenheit, עצומים überlegene Stärke oder Macht. Die deutsche Steigerung macht den durch מִן ausgedrückten Vergleich deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Aktiver Besitzantritt bei ירשׁ
  choice: in Besitz nehmen
  alternative: erben
  rationale: In diesem Zusammenhang steht der konkrete Einzug in das Land im Vordergrund. „Erben“ ist lexikalisch möglich, könnte hier jedoch den aktiven Aspekt abschwächen; die Gabe des Landes wird durch diese Wortwahl weder bestritten noch zusätzlich ausgedeutet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Vers bleibt als einleitender, in Vers 2 weitergeführter Nebensatz offen; Gedankenstriche gliedern die lange Aufzählung. Die Anredeformen bleiben entsprechend dem Hebräischen im Singular.
