  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: de
  text: sondern weil Jahwe euch liebt und weil er den Eid hält, den er euren Vätern geschworen hat, hat Jahwe euch mit starker Hand herausgeführt und euch aus dem Sklavenhaus[a], aus der Hand des Pharaos, des Königs von Ägypten, erlöst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Haus der Sklaven“; auch möglich: „aus dem Haus der Sklaverei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sondern weil
  rationale: Im Zusammenhang steht die Begründung im Gegensatz zur Verneinung in Vers 7. „Sondern weil“ gibt sowohl den Kontrast als auch den kausalen Sinn wieder.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: weil Jahwe euch liebt
  rationale: Die hebräische Nominalkonstruktion bezeichnet den Grund; die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den kausalen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: und weil er den Eid hält
  rationale: Die parallele Kausalkonstruktion bezeichnet Jahwes treues Einhalten des Eides. Das Präsens „hält“ vermittelt diesen fortdauernden Sinn natürlich.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: den er euren Vätern geschworen hat
  rationale: „Väter“ bewahrt die konkrete patriarchale Bezugnahme; das deutsche Perfekt gibt den vorausliegenden Schwur idiomatisch wieder.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die Formulierung erhält das hebräische Hand-Bild und bezeichnet Jahwes machtvolles Eingreifen.
- source_word: הוֹצִיא
  choice: herausgeführt
  rationale: Dies ist natürliche deutsche Exodus-Sprache und bewahrt den konkreten Vorgang der Herausführung.
- source_word: וַיִּפְדְּךָ
  choice: euch ... erlöst
  rationale: פדה bezeichnet die Befreiung beziehungsweise Auslösung aus Gebundenheit; „erlöst“ wahrt das Gewicht des Exodusmotivs.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Das etablierte deutsche Kompositum bewahrt das konkrete Bild eines von Sklaverei bestimmten Hauses beziehungsweise Herrschaftsbereichs.
- source_word: מִיַּד פַּרְעֹה
  choice: aus der Hand des Pharaos
  rationale: Die Hand-Metapher für Macht und Verfügungsgewalt bleibt erhalten und bildet zugleich einen bewussten Kontrast zur „starken Hand“ Jahwes.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: des Königs von Ägypten
  rationale: Die Apposition wird im Deutschen durch die Kasusangleichung eindeutig und natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der Bundesträger אֲבֹתֵיכֶם
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Der maskuline und heilsgeschichtlich konkrete Bezug auf die Väter beziehungsweise Patriarchen soll nicht unnötig verallgemeinert werden.
- issue: Bildsprache für die ägyptische Knechtschaft
  choice: Sklavenhaus
  alternative: Haus der Sklaverei
  rationale: „Sklavenhaus“ bewahrt sowohl das konkrete Nomen עֲבָדִים als auch die traditionelle deutsche Exodus-Bildsprache, ohne die Härte der Gebundenheit abzuschwächen.
- issue: Zeitlicher Aspekt von וּמִשָּׁמְרוֹ
  choice: weil er den Eid hält
  alternative: weil er den Eid gehalten hat
  rationale: Die Konstruktion lässt sich als treues Einhalten des zuvor geschworenen Eides verstehen. Das Präsens bewahrt den Aspekt fortdauernder Bundestreue, ohne die historische Erfüllung auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur folgt dem argumentativen Zusammenhang mit Vers 7. Wiederholungen des Gottesnamens und die Hand-Metaphorik bleiben erhalten; „Sklavenhaus“ ist prägnant, verständlich und im deutschen Bibelregister verankert.
