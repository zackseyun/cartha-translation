source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: de
  text: Außerdem wird Yahweh, dein Gott, die Hornisse[a] unter sie senden, bis die Übriggebliebenen und die, die sich vor dir verbergen, umkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist übertragen „der Schrecken“ oder „die Panik“ gemeint; manche verstehen die Hornisse als Bild für von Gott gesandte Angst.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Außerdem
  rationale: Gibt die anknüpfende und verstärkende Bedeutung natürlich wieder, ohne die im Deutschen schwerfällige Doppelung „und außerdem“.
- source_word: הַצִּרְעָה
  choice: die Hornisse
  rationale: Die bestimmte Singularform bezeichnet ihrem gewöhnlichen Wortsinn nach die Hornisse; ein kollektives Verständnis ist möglich. Die mögliche übertragene Bedeutung wird in einer Fußnote bewahrt.
- source_word: יְשַׁלַּח
  choice: wird … senden
  rationale: Gibt Yahwehs aktives Aussenden dieses Mittels klar und idiomatisch wieder.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, dein Gott
  rationale: Bewahrt den Gottesnamen und gibt die direkte Possessivverbindung natürlich wieder.
- source_word: בָּם
  choice: unter sie
  rationale: Bewahrt den räumlichen Sinn des Aussendens mitten unter die feindlichen Völker.
- source_word: עַד אֲבֹד
  choice: bis … umgekommen sind
  rationale: Markiert den erreichten Endpunkt der angekündigten Handlung, ohne die Art des Untergangs näher festzulegen.
- source_word: הַנִּשְׁאָרִים
  choice: die Übriggebliebenen
  rationale: Bezeichnet diejenigen, die nach den vorausgehenden Ereignissen noch übrig sind, ohne den theologisch aufgeladenen Ausdruck „Rest“ zu verwenden.
- source_word: וְהַנִּסְתָּרִים
  choice: und die, die sich … verstecken
  rationale: Gibt im Zusammenhang natürlich wieder, dass die Feinde sich verbergen, während die hebräische Form wörtlich auch als „die Verborgenen“ verstanden werden kann.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Ist die natürliche deutsche Entsprechung der Wendung „vor deinem Angesicht/deiner Gegenwart“ und bezeichnet das Verbergen vor Israels Vorrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Yahweh“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wörtliche oder übertragene Deutung von הַצִּרְעָה
  choice: wörtlich „die Hornisse“ im Haupttext
  alternative: „Schrecken/Panik“ als von Gott gesandte Angst
  rationale: Der gewöhnliche lexikalische Sinn ist das Insekt. Da eine übertragene Deutung möglich ist, wird sie in der Fußnote genannt, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Außerdem“ stellt die Verbindung zum vorausgehenden Vers her. Der Satz bleibt nah an der hebräischen Struktur, ist aber im Deutschen flüssig; die echte lexikalische Mehrdeutigkeit bei „Hornisse“ wird in der Fußnote erhalten.
