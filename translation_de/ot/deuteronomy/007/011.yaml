base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: de
  text: Darum[a] sollst du das Gebot, die Satzungen und die Rechtsbestimmungen[b] halten, die ich dir heute gebiete, um sie zu befolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du sollst“ beziehungsweise „Deshalb sollst du“. Das hebräische Bindewort kann einfach anknüpfen oder eine Folgerung aus den vorausgehenden Versen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Rechtsbestimmungen“ kann auch mit „Rechtssätze“, „Ordnungen“ oder „Urteile“ wiedergegeben werden; das hebräische Wort bezeichnet verbindliche rechtliche Entscheidungen oder Regelungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Darum sollst du … halten
  rationale: שׁמר bezeichnet im bundesrechtlichen Zusammenhang das Beachten und Befolgen. „Darum“ gibt den möglichen folgernden Bezug zu den vorausgehenden Versen wieder; die Alternative wird in Fußnote [a] offengehalten.
- source_word: הַמִּצְוָה
  choice: das Gebot
  rationale: Der Singular wird bewahrt. „Gebot“ ist im modernen Deutschen natürlicher als „Gebotssatz“ und bleibt vom folgenden Plural unterschieden.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: „Satzungen“ wahrt den rechtlich-bundestheologischen Klang und unterscheidet חֻקִּים von den übrigen Rechtsbegriffen.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann Urteile, Rechtssätze oder verbindliche Bestimmungen bezeichnen. „Rechtsbestimmungen“ ist im heutigen Deutsch verständlich und wahrt den juristischen Sinn; Alternativen stehen in Fußnote [b].
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Die Formulierung bildet die gegenwärtige autoritative Anordnung idiomatisch ab und erhält das deuteronomische „heute“.
- source_word: לַעֲשׂוֹתָם
  choice: und sie ausführen
  rationale: Der Infinitiv עשה fordert die konkrete Umsetzung. „Ausführen“ vermeidet das im Deutschen schwerfällige „sie zu tun“ und lässt die Handlungsebene gegenüber „halten“ hervortreten.
theological_decisions:
- issue: Unterscheidung der drei bundesrechtlichen Begriffe
  choice: das Gebot, die Satzungen und die Rechtsbestimmungen
  alternative: das Gebot, die Ordnungen und die Rechtssätze
  rationale: Die drei sich überschneidenden Begriffe werden nicht zu einer allgemeinen Bezeichnung eingeebnet. So bleibt die rhetorische und rechtliche Häufung des Hebräischen erhalten.
- issue: Verknüpfung mit dem vorausgehenden Zusammenhang
  choice: Darum sollst du
  alternative: Und du sollst
  rationale: Das einleitende ו kann sowohl koordinierend als auch folgernd verstanden werden. Der Kontext legt eine Folgerung nahe, ohne die koordinierende Möglichkeit auszuschließen; diese wird deshalb in Fußnote [a] genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar rechtlichem Bundesvokabular. Die Satzstellung ist gegenüber einer strikt formalen Wiedergabe leicht geglättet; die Wiederholung von „halten“ und „ausführen“ bewahrt jedoch den Unterschied zwischen Beachtung und konkreter Umsetzung.
