  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: de
  text: Du sollst dich nicht vor ihnen fürchten. Du sollst dich unbedingt[a] daran erinnern, was Jahwe, dein Gott, dem Pharao und ganz Ägypten getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Erinnern, du sollst dich erinnern“ – eine hebräische Verstärkungsform im Sinn von „du sollst dich unbedingt erinnern“ oder „du sollst es dir gut einprägen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Du sollst dich nicht vor ihnen fürchten
  rationale: Das mit לֹא verneinte Imperfekt hat hier auffordernden beziehungsweise verbietenden Sinn. Die reflexive deutsche Wendung gibt das Objekt der Furcht mit מִן natürlich wieder und bewahrt den feierlichen Ton.
- source_word: זָכֹר תִּזְכֹּר
  choice: Du sollst dich vielmehr unbedingt daran erinnern
  rationale: Der absolute Infinitiv vor dem Imperfekt verstärkt die Aufforderung. „Unbedingt“ bringt diesen Nachdruck in natürlichem modernem Deutsch zum Ausdruck; „vielmehr“ verdeutlicht den im Zusammenhang angelegten Gegensatz zwischen Furcht und Erinnerung.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: was … getan hat
  rationale: Die hebräische Objektkonstruktion wird idiomatisch mit „was“ wiedergegeben. Das deutsche Perfekt bezeichnet die abgeschlossene, für die Gegenwart bedeutsame geschichtliche Tat natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Das Suffix steht in der zweiten Person maskulin Singular und entspricht der unmittelbaren Anrede Israels als Einheit.
- source_word: לְפַרְעֹה
  choice: dem Pharao
  rationale: לְ kennzeichnet bei עשה den von der Handlung Betroffenen. Der deutsche Dativ nach „getan hat“ ist idiomatisch.
- source_word: וּלְכָל מִצְרָיִם
  choice: und ganz Ägypten
  rationale: Der hebräische Ausdruck bezeichnet Ägypten kollektiv als Land beziehungsweise Reich, nicht ausdrücklich nur seine Bewohner. „Ganz Ägypten“ bewahrt diesen Umfang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ ist dessen übliche wissenschaftlich begründete deutsche Wiedergabe und vermeidet die Ersetzung durch einen Titel.
- issue: Art der göttlichen Handlung an Pharao und Ägypten
  choice: getan hat
  alternative: angetan hat; gegen … getan hat
  rationale: Die neutrale Formulierung wahrt die Offenheit des Verbs עשה; der Zusammenhang bezeichnet Gerichtstaten, doch der Vers selbst verwendet hier kein engeres Verb für Strafe oder Vernichtung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Wiederholung von „Du sollst“ bewahrt den eindringlichen Aufbau des Hebräischen; die Fußnote erklärt die im Deutschen nicht wörtlich nachgebildete Verstärkungsform.
