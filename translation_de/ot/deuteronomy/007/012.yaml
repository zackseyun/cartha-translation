id: DEU.7.12
reference: Deuteronomy 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: de
  text: Wenn ihr auf diese Rechtsbestimmungen[a] hört, sie einhaltet und ausführt, wird Jahwe, dein Gott, dir gegenüber den Bund und die beständige Liebe[b] wahren, die er deinen Vätern[c] zugeschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „diese Rechtssätze“, „diese Ordnungen“ oder „diese Rechtsentscheide“.'
    reason: lexical_alternative
  - marker: b
    text: '„Beständige Liebe“ übersetzt das hebräische Wort ḥesed, das häufig loyale, bundestreue Liebe bezeichnet; auch: „treue Liebe“, „Bundestreue“ oder „Güte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „deinen Vorfahren“; wörtlich steht im Hebräischen „deinen Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: Wenn … wird
  rationale: Die deutsche Konditionalkonstruktion gibt den Zusammenhang von Israels Hören und Handeln mit der daraus folgenden Reaktion Gottes natürlich wieder, ohne die Bedingung in eine bloße Zeitangabe umzudeuten.
- source_word: תִּשְׁמְעוּן
  choice: auf … hört
  rationale: שׁמע bezeichnet hier ein Hören, das auf Gehorsam zielt. „Auf … hören“ bewahrt im Deutschen sowohl den Höraspekt als auch die Bereitschaft zu gehorchen.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: diese Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet verbindliche rechtliche Anordnungen oder Rechtssätze. „Rechtsbestimmungen“ ist im modernen Deutsch verständlich und hält den Begriff von anderen Gesetzesbezeichnungen im Kontext unterscheidbar.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: sie einhaltet und ausführt
  rationale: Beide hebräischen Verben bleiben erhalten. „Einhalten“ bezeichnet die treue Beachtung, „ausführen“ die konkrete Umsetzung.
- source_word: וְשָׁמַר
  choice: wahren
  rationale: „Wahren“ kann sich im Deutschen sowohl auf den Bund als auch auf die beständige Liebe beziehen und gibt Gottes zuverlässiges Festhalten daran wieder. Zugleich bleibt die inhaltliche Entsprechung zu Israels Einhalten erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die singularische Anrede des hebräischen Textes wird trotz der vorausgehenden Pluralformen bewahrt.
- source_word: לְךָ
  choice: dir gegenüber
  rationale: Die Formulierung bezeichnet Israel als den Begünstigten und Beziehungspartner, ohne den Eindruck zu erwecken, der Bund werde lediglich für später aufbewahrt.
- source_word: הַבְּרִית
  choice: den Bund
  rationale: בְּרִית ist der zentrale Ausdruck für die verbindliche Bundesbeziehung und wird entsprechend mit „Bund“ übersetzt.
- source_word: הַחֶסֶד
  choice: die beständige Liebe
  rationale: חֶסֶד verbindet loyale, verlässliche Zuwendung mit Liebe. „Beständige Liebe“ lässt beide Aspekte anklingen, ohne den Ausdruck ausschließlich rechtlich oder emotional festzulegen.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: die er … zugeschworen hat
  rationale: „Zuschwören“ bringt knapp zum Ausdruck, dass Gott diese Zusage durch einen Eid bekräftigt hat.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Die ausdrücklich maskuline Bezeichnung des Ausgangstextes wird beibehalten; im Zusammenhang sind die Vorväter, insbesondere die Erzväter, gemeint.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Bundeskontext
  choice: die beständige Liebe
  alternative: die Bundestreue; die Güte; die treue Liebe
  rationale: „Beständige Liebe“ bewahrt die Spannung zwischen gnädiger Zuwendung und dauerhafter Loyalität, ohne חֶסֶד auf einen rein rechtlichen oder rein gefühlsbezogenen Begriff zu verengen.
- issue: Wechsel von pluralischer zu singularischer Anrede
  choice: ihr … dein … dir … deinen
  alternative: durchgehend pluralische Anrede
  rationale: Der hebräische Text wechselt bewusst von Pluralformen beim Handeln des Volkes zu Singularformen, die Israel als kollektive Einheit anreden. Dieser Wechsel wird nicht geglättet.
- issue: Geschlechtsspezifische Wiedergabe von לַאֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: Die maskuline Form des Ausgangstextes und ihr Bezug auf die Väter beziehungsweise Erzväter bleiben sichtbar; die allgemeinere Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist flüssig, bewahrt aber den auffälligen Wechsel von der pluralischen Anrede („ihr“) zur singularischen kollektiven Anrede („dein“, „dir“, „deinen“). Der Gottesname erscheint als „Jahwe“.
