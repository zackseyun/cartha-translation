  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: de
  text: Und Jahwe, dein Gott, wird diese Völker vor dir nach und nach[a] vertreiben. Du wirst sie nicht schnell vernichten können, damit die wilden Tiere[b] dir gegenüber nicht zu zahlreich werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stück für Stück“; auch: „allmählich“.'
    reason: Die Wiederholung מְעַט מְעָט betont das schrittweise Vorgehen.
  - marker: b
    text: 'Wörtlich: „das Getier des Feldes“.'
    reason: Die hebräische Wendung חַיַּת הַשָּׂדֶה bezeichnet Tiere des offenen Landes, hier wilde Tiere.
lexical_decisions:
- source_word: וְנָשַׁל
  choice: wird … vertreiben
  rationale: Das Verb bezeichnet hier, dass Jahwe die Völker aus dem Land und aus Israels Weg entfernt. „Vertreiben“ ist im Deutschen natürlich und bewahrt den militärisch-territorialen Sinn; „enteignen“ beziehungsweise „aus ihrem Besitz verdrängen“ wäre ebenfalls möglich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַגּוֹיִם הָאֵל
  choice: diese Völker
  rationale: גּוֹיִם bezeichnet hier die kanaanitischen Völker; das Demonstrativum הָאֵל wird mit „diese“ wiedergegeben.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die räumliche Wendung beschreibt die Entfernung der Völker aus Israels Gegenwart beziehungsweise Weg und lässt sich idiomatisch mit „vor dir“ wiedergeben.
- source_word: מְעַט מְעָט
  choice: nach und nach
  rationale: Die Wiederholung drückt einen schrittweisen Vorgang aus. „Nach und nach“ ist eine natürliche deutsche Entsprechung, die diese allmähliche Entwicklung wahrt.
- source_word: לֹא תוּכַל
  choice: Du wirst … nicht … können
  rationale: Diese Formulierung bewahrt die ausdrückliche Unfähigkeit im zukünftigen Zusammenhang.
- source_word: כַּלֹּתָם
  choice: sie vernichten
  rationale: כלה bezeichnet hier, die Völker vollständig zu beseitigen beziehungsweise ihnen ein Ende zu machen. „Vernichten“ ist würdig und direkt, ohne die umgangssprachliche Färbung von „den Garaus machen“.
- source_word: מַהֵר
  choice: schnell
  rationale: Das Adverb wird schlicht und idiomatisch wiedergegeben.
- source_word: פֶּן
  choice: sonst
  rationale: „Sonst“ gibt die warnende Folgebeziehung im modernen Deutschen natürlicher wieder als das gehobene „damit nicht“ oder „auf dass nicht“.
- source_word: תִּרְבֶּה
  choice: zu zahlreich werden
  rationale: Das Verb bedeutet „zahlreich werden, sich vermehren“. Der Kontext macht deutlich, dass die zunehmende Zahl eine Gefahr darstellt; „zu zahlreich“ bringt dies knapp zum Ausdruck.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere
  rationale: Wörtlich bezeichnet die Wendung „das Getier des Feldes/freien Landes“. „Die wilden Tiere“ ist klares modernes Deutsch und bezeichnet den Gegensatz zu Haustieren.
- source_word: עָלֶיךָ
  choice: dir gegenüber
  rationale: Die Präposition bezeichnet hier eine für Israel bedrohliche Zunahme. „Dir gegenüber“ wahrt den Beziehungs- und möglichen Gegensinn, ohne die Präposition unnötig stark als unmittelbaren Angriff auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von כַּלֹּתָם
  choice: sie vernichten
  alternative: sie völlig beseitigen; ihnen ein Ende machen
  rationale: Die Form bezeichnet ein vollständiges Zu-Ende-Bringen. „Vernichten“ wahrt den ernsten Sinn, ohne über den Vers hinaus zu bestimmen, auf welche Weise dies geschieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „nach und nach“ und „sonst“ natürliches heutiges Deutsch bieten. Die Fußnotenmarker [a] und [b] stehen beide im Haupttext.
