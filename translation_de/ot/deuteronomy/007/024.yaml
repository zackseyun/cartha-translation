source:
  edition: WLC
  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: de
  text: Und er wird ihre Könige in deine Hand geben, und du wirst ihren Namen unter dem Himmel auslöschen. Niemand wird vor dir standhalten, bis du sie vernichtet hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Und er wird … geben
  rationale: Das Qal Perfekt mit וְ setzt in diesem verheißenden Zusammenhang die Folge zukünftiger Handlungen fort. Das Subjekt ist der HERR aus dem Kontext.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: ihre Könige in deine Hand
  rationale: Die Wendung bezeichnet die Auslieferung in Israels Gewalt; die deutsche Formulierung bewahrt zugleich das hebräische Bild.
- source_word: וְהַאֲבַדְתָּ אֶת־שְׁמָם
  choice: und du wirst ihren Namen … auslöschen
  rationale: Das Hifil von אבד ist kausativ. Beim Objekt »Name« bezeichnet es die vollständige Tilgung von Namen und Andenken; »auslöschen« ist im Deutschen natürlich und wahrt den kollektiven Singular.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die feste Wendung bezeichnet den Bereich menschlicher Existenz. Das deutsche »unter dem Himmel« gibt das Bild idiomatisch wieder; die durch מִן bezeichnete Entfernung ist bereits in »auslöschen« enthalten.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Niemand wird vor dir standhalten
  rationale: אִישׁ steht hier repräsentativ und bedeutet kontextuell »niemand«. Das Hitpael von יצב bezeichnet im militärischen Zusammenhang das Sichentgegenstellen beziehungsweise Standhalten.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: bis du sie vernichtet hast
  rationale: Die Infinitivkonstruktion nach עַד markiert den Endpunkt. שׁמד bezeichnet in diesem deuteronomischen Kriegskontext vollständige Vernichtung; das Perfekt nach »bis« drückt den erreichten Abschluss natürlich aus.
theological_decisions:
- issue: Generische Bedeutung von אִישׁ
  choice: Niemand wird vor dir standhalten
  alternative: Kein Mann wird vor dir standhalten
  rationale: Obwohl אִישׁ morphologisch maskulin singular ist, fungiert es nach der Negation generisch. »Niemand« gibt den umfassenden Aussagegehalt im modernen Deutschen präzise wieder, ohne eine Beschränkung auf erwachsene Männer nahezulegen.
- issue: Tilgung ihres Namens
  choice: ihren Namen unter dem Himmel auslöschen
  alternative: ihren Namen unter dem Himmel zugrunde gehen lassen
  rationale: Der kollektive Singular »Name« und die kausative Verbform bleiben erhalten. »Auslöschen« vermittelt idiomatisch die Tilgung ihres Andenkens, ohne den Ausdruck auf bloßen Ruf oder Ruhm zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem hebräischem Handbild und kollektivem Singular »Name«. »Standhalten« verdeutlicht den militärischen Sinn von יצב. Keine Fußnote ist nötig, da »niemand« die generische Funktion von אִישׁ unmittelbar und eindeutig wiedergibt.
