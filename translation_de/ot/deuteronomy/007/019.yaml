source:
  edition: WLC
  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: de
  text: die großen Prüfungen[a], die deine Augen gesehen haben, die Zeichen und die Wunder, die starke Hand und den ausgestreckten Arm, mit denen Jahwe, dein Gott, dich herausgeführt hat. Ebenso wird Jahwe, dein Gott, mit allen Völkern[b] verfahren, vor denen du dich fürchtest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die großen Erprobungen“. Das hebräische Wort kann schwere Prüfungen oder Erprobungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nationen“. Wörtlicher ist „Völker“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: die großen Prüfungen
  rationale: מַסּוֹת bezeichnet schwere Prüfungen oder Erprobungen. „Prüfungen“ ist im heutigen Deutsch verständlich und vermeidet die irreführende Bedeutung einer Verlockung zur Sünde.
- source_word: רָאוּ עֵינֶיךָ
  choice: die deine Augen gesehen haben
  rationale: Die ausdrückliche Nennung der Augen wird als eindringlicher Hinweis auf das selbst Erlebte beibehalten.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: die Zeichen und die Wunder
  rationale: Die geläufige Paarung gibt sowohl den Zeichencharakter als auch das Staunen erregende Wesen der Taten wieder, ohne sie enger zu definieren.
- source_word: הַיָּד הַחֲזָקָה
  choice: die starke Hand
  rationale: Die feste biblische Metapher für Gottes machtvolles Handeln wird unmittelbar und natürlich wiedergegeben.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: den ausgestreckten Arm
  rationale: Die bildhafte Wendung für wirksame göttliche Macht und Befreiung bleibt erhalten.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: mit denen ... dich herausgeführt hat
  rationale: Die Formulierung bezieht das Mittel der Befreiung natürlich auf Hand und Arm; „herausgeführt“ bewahrt den Exodusklang des Hifil von יצא.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den im Hebräischen ausdrücklich stehenden Namen statt ihn durch einen Titel zu ersetzen.
- source_word: כֵּן יַעֲשֶׂה
  choice: Ebenso wird ... verfahren
  rationale: „Ebenso“ macht den Vergleich zwischen dem früheren Handeln in Ägypten und dem angekündigten Handeln an den Völkern deutlich; „verfahren mit“ ergibt mit dem deutschen Objekt eine natürliche Satzfügung.
- source_word: לְכָל הָעַמִּים
  choice: mit allen Völkern
  rationale: עַמִּים bedeutet wörtlich „Völker“. Die Präposition bezeichnet hier die von Gottes Handeln Betroffenen; wegen des Verbs „verfahren“ wird sie im Deutschen mit „mit“ wiedergegeben.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: vor denen du dich fürchtest
  rationale: Diese deutsche Wendung ist natürlich und spiegelt zugleich die hebräische Vorstellung des Fürchtens „vor“ jemandem.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ erhält ihn als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Bezug des Relativsatzes אֲשֶׁר הוֹצִאֲךָ
  choice: auf starke Hand und ausgestreckten Arm bezogen
  alternative: nur auf den unmittelbar vorausgehenden ausgestreckten Arm bezogen
  rationale: Im Deutschen liegt ein gemeinsamer instrumentaler Bezug auf beide parallelen Machtbilder nahe. Die Bildsprache selbst bleibt vollständig erhalten, ohne eine zusätzliche dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung und die Körpermetaphern des Hebräischen bleiben erhalten; der zweite Satz wird für natürliche deutsche Syntax eigenständig formuliert.
