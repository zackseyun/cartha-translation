source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: de
  text: Und Jahwe wird jede Krankheit von dir nehmen. Keine der schlimmen Krankheiten Ägyptens[a], die du kennst[b], wird er über dich bringen; vielmehr wird er sie über alle bringen, die dich hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schädlichen“ beziehungsweise „schweren Krankheiten Ägyptens“. Das hebräische Adjektiv kann etwas Böses, Schlimmes, Schädliches oder Schweres bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die du erfahren hast“. Das hebräische Wort für „kennen“ kann hier ein Kennen aus eigener Erfahrung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: wird … von dir nehmen
  rationale: Der Hifil von סור bezeichnet das Veranlassen einer Entfernung. „Von dir nehmen“ bewahrt den Gedanken des Wegnehmens und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל חֹלִי
  choice: jede Krankheit
  rationale: חֹלִי bezeichnet Krankheit oder Leiden; das distributive „jede Krankheit“ gibt כָּל im modernen Deutschen idiomatisch wieder.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: die schlimmen Krankheiten Ägyptens
  rationale: מַדְוֶה bezeichnet Krankheit, und רַע kann hier schlecht, schlimm, schädlich oder unheilvoll bedeuten. „Schlimm“ ist im Krankheitszusammenhang natürlich, ohne die mögliche Wertung unnötig zu verengen.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: die du kennst
  rationale: ידע bedeutet „kennen“, kann hier aber erfahrungsbezogenes Kennen meinen. Die knappe Wiedergabe wahrt diese Offenheit; die mögliche Erfahrungsnuance wird in einer Fußnote genannt.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: wird er nicht über dich bringen
  rationale: שים mit ב bezeichnet hier das Auferlegen beziehungsweise Eintreffenlassen von Krankheiten. „Über dich bringen“ ist natürliches Deutsch und erhält das Bild einer verhängten Plage.
- source_word: וּנְתָנָם בְּכָל שֹׂנְאֶיךָ
  choice: vielmehr wird er sie über alle bringen, die dich hassen
  rationale: נתן bedeutet grundsätzlich „geben/setzen“, bezeichnet im Kontext jedoch das Auferlegen der Krankheiten. „Vielmehr“ macht den im Zusammenhang liegenden Gegensatz deutlich; שֹׂנְאֶיךָ wird präzise als „die dich hassen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Verheißung über Krankheit
  choice: Konkrete Bundesverheißung im vorliegenden Zusammenhang
  alternative: Allgemeine, bedingungslose Zusage völliger Krankheitsfreiheit für jeden Einzelnen; rein bildliche Deutung
  rationale: Der Vers spricht konkret von Krankheit und den Krankheiten Ägyptens im Bundeszusammenhang. Die Übersetzung erweitert dies weder zu einer zeitlosen Garantie individueller Gesundheit noch verflüchtigt sie es zu einer bloßen Metapher.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung hebt wie im Hebräischen die Krankheiten Ägyptens hervor. „Über dich bringen“ vermeidet das im Deutschen missverständliche wörtliche „auf dich legen“, ohne die konkrete Aussage abzuschwächen.
