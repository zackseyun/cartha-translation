base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: de
  text: Du wirst mehr als alle anderen Völker gesegnet sein[a]. Bei dir wird es weder einen unfruchtbaren Mann noch eine unfruchtbare Frau geben[b], auch nicht unter deinem Vieh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst vor allen Völkern gesegnet sein.“ Die hebräische Präposition drückt hier einen Vergleich aus.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen ausdrücklich eine männliche und eine weibliche Form des Wortes „unfruchtbar“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Du wirst … gesegnet sein
  rationale: Das passive Partizip von ברך zusammen mit dem Imperfekt von היה beschreibt den zugesagten Zustand des Gesegnetseins; die futurische Formulierung ist im modernen Deutsch natürlich.
- source_word: מִכָּל הָעַמִּים
  choice: mehr als alle anderen Völker
  rationale: מן hat hier vergleichende Bedeutung. „Mehr als“ bildet den Vergleich klar ab; „anderen“ macht im Deutschen deutlich, dass Israel mit den übrigen Völkern verglichen wird.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Bei dir wird es … nicht geben
  rationale: Die Existenzkonstruktion mit בְּ bezeichnet das Fehlen innerhalb der als Einheit angesprochenen Gemeinschaft. „Bei dir“ bewahrt zugleich die singularische Anrede Israels.
- source_word: עָקָר וַעֲקָרָה
  choice: weder einen unfruchtbaren Mann noch eine unfruchtbare Frau
  rationale: Die ausdrücklich maskuline und feminine Form wird im Deutschen vollständig wiedergegeben. „Unfruchtbar“ ist verständlich und weniger medizinisch als „steril“.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: auch nicht unter deinem Vieh
  rationale: בְּהֵמָה bezeichnet kollektiv die domestizierten Tiere. „Vieh“ ist eine breite, natürliche deutsche Entsprechung; die Ergänzung „auch nicht“ führt die Verneinung eindeutig fort.
theological_decisions:
- issue: Vergleich der Segnung Israels mit allen Völkern
  choice: „mehr als alle anderen Völker“
  alternative: „vor allen Völkern“
  rationale: Die komparative Funktion von מן wird ausdrücklich bewahrt, ohne eine räumliche oder rangmäßige Bedeutung festzuschreiben.
- issue: Männliche und weibliche Unfruchtbarkeit im Bundessegen
  choice: Mann und Frau ausdrücklich nennen
  alternative: „niemand wird unfruchtbar sein“
  rationale: Der hebräische Text verwendet bewusst eine maskuline und eine feminine Form; eine geschlechtsneutrale Zusammenfassung würde diese Paarung einebnen.
- issue: Korporative singularische Anrede Israels
  choice: Singular „du/dein“ beibehalten
  alternative: Plural „ihr/euer“
  rationale: Israel wird im Hebräischen als ein Bundesvolk in der zweiten Person Singular angesprochen; die Übersetzung erhält diese Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte singularische Anrede bleibt erhalten. Die Vergleichsaussage und die ausdrückliche Nennung beider Geschlechter werden transparent wiedergegeben.
