  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: de
  text: 'Wenn du in deinem Herzen sagst: »Diese Völker sind zahlreicher als ich. Wie kann ich sie aus ihrem Besitz vertreiben?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie enteignen«; das hebräische Verb bezeichnet hier, dass sie den Besitz des Landes verlieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier im Zusammenhang mit dem folgenden Zuspruch einen angenommenen Bedingungsfall ein.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: du in deinem Herzen sagst
  rationale: Die Wiedergabe bewahrt sowohl die Grundbedeutung von אמר als auch das hebräische Bild für inneres Denken oder Selbstgespräch.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: zahlreicher als ich
  rationale: מִן kennzeichnet hier den Vergleich; die knappe Formulierung entspricht dem gehobenen, aber verständlichen deutschen Bibelstil.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: גּוֹיִם bezeichnet hier die verschiedenen Bevölkerungsgruppen des Landes; im Deutschen ist „Völker“ in diesem Zusammenhang natürlicher als „Nationen“.
- source_word: אֵיכָה אוּכַל
  choice: Wie kann ich
  rationale: Die Verbindung fragt nach der Möglichkeit beziehungsweise Fähigkeit und wird im modernen Deutsch natürlich mit „Wie kann ich“ wiedergegeben.
- source_word: לְהוֹרִישָׁם
  choice: sie aus ihrem Besitz vertreiben
  rationale: Der Hifil von ירש bezeichnet im Landnahmekontext, dass jemand seinen Besitz am Land verliert; die Formulierung erhält sowohl den Besitz- als auch den Vertreibungsaspekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular durchgehend in der zweiten Person Singular. Das Quellenbild „im Herzen sagen“ wird trotz der idiomatischen Möglichkeit „bei dir denken“ bewahrt.
