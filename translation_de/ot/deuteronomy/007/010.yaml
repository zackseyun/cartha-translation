  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: de
  text: und denen, die ihn hassen, ins Angesicht vergilt[a], um jeden von ihnen zu vernichten. Gegenüber dem, der ihn hasst, zögert er nicht; ins Angesicht vergilt er es ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihrem/seinem Angesicht“. Die Wendung kann auch „vor ihnen/ihm“ oder „in ihrer/seiner Gegenwart“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: und vergilt
  rationale: Das Piel von שׁלם bezeichnet hier das entsprechende Zurückzahlen beziehungsweise Vergelten. „Vergelten“ ist im Deutschen natürlich, würdevoll und bewahrt den gerichtlichen Sinn.
- source_word: לְשֹׂנְאָיו
  choice: denen, die ihn hassen
  rationale: Das Partizip bezeichnet Menschen, die Gott hassen. Die Umschreibung ist klarer und idiomatischer als „seinen Hassern“ und enger am Hebräischen als „seinen Feinden“.
- source_word: אֶל־פָּנָיו
  choice: ins Angesicht
  rationale: Die Wendung bedeutet wörtlich „zu seinem Angesicht“ und hebt die unmittelbare, persönliche Vergeltung hervor. Die Fußnote nennt mögliche kontextuelle Wiedergaben, ohne die Bildsprache im Haupttext aufzulösen.
- source_word: לְהַאֲבִידוֹ
  choice: um sie zu vernichten
  rationale: Der Hifil-Infinitiv von אבד kann Zweck oder Folge ausdrücken. „Um sie zu vernichten“ bildet die Infinitivkonstruktion eng ab; das deutsche Pluralpronomen nimmt die zuvor genannte Mehrzahl auf.
- source_word: לֹא יְאַחֵר
  choice: zögert er nicht
  rationale: Das Piel von אחר bedeutet hier, eine Handlung nicht hinauszuschieben. „Zögert nicht“ ist knapp und natürlich; im Zusammenhang besagt es, dass Gott die Vergeltung nicht aufschiebt.
- source_word: לְשֹׂנְאוֹ
  choice: bei dem, der ihn hasst
  rationale: Die Präposition ל markiert die Beziehung zu der betreffenden Person. „Bei dem“ erhält diese Konstruktion, während die Singularform ausdrücklich bewahrt bleibt.
- source_word: יְשַׁלֶּם לוֹ
  choice: vergilt er es ihm
  rationale: Die Wiederholung desselben Verbstamms wird durch das erneut verwendete „vergilt“ sichtbar. „Es ihm“ ist im Deutschen idiomatisch und gibt das Dativpronomen לוֹ wieder.
theological_decisions:
- issue: Sprache des göttlichen Gerichts
  choice: Gott vergilt denen, die ihn hassen, persönlich und vernichtet sie
  alternative: Das Gericht als bloß unpersönliche Folge ihres Handelns darzustellen
  rationale: Im Hebräischen bleibt Gott das handelnde Subjekt. Die Übersetzung wahrt diese direkte göttliche Urheberschaft und mildert die Spannung des Gerichtswortes nicht ab.
- issue: Numeruswechsel zwischen den Satzhälften
  choice: Erst Mehrzahl, dann Einzahl
  alternative: Beide Satzhälften auf einen einheitlichen Numerus zu bringen
  rationale: Der hebräische Text wechselt von „denen, die ihn hassen“ zur einzelnen Person, „die ihn hasst“. Dieser Wechsel wird als bewusste Zuspitzung auf jeden Einzelnen erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „ins Angesicht“ und „vergilt“ bildet die markante Wiederholung des Hebräischen ab; der Wechsel von der Mehrzahl zur Einzahl bleibt erhalten.
