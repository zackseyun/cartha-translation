base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: de
  text: Du sollst nichts Abscheuliches in dein Haus bringen, sonst wirst du wie es dem Untergang geweiht sein. Du sollst es zutiefst verabscheuen und völlig verwerfen, denn es ist dem Untergang geweiht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Bann belegt“; traditionell auch: „verflucht“. Das hebräische Wort bezeichnet hier etwas, das unter Gottes Gericht zur Vernichtung bestimmt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: bringen
  rationale: Das Hifil von בוא bezeichnet hier das Hineinbringen in das Haus; „bringen“ ist direkt und natürlich.
- source_word: תּוֹעֵבָה
  choice: etwas Abscheuliches
  rationale: Die Wendung bezeichnet hier einen kultisch und moralisch verwerflichen, insbesondere götzendienerischen Gegenstand. Die substantivierte Form ist im modernen Deutsch verständlich und bewahrt die starke Wertung.
- source_word: בֵּיתֶךָ
  choice: dein Haus
  rationale: Die konkrete Bedeutung des hebräischen Nomens und das Bild des häuslichen Bereichs bleiben erhalten.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: sonst wirst du wie es dem Untergang geweiht
  rationale: Das Waw wird aufgrund des Zusammenhangs als Folge beziehungsweise Warnung wiedergegeben. חֵרֶם bezeichnet hier den Status dessen, was unter göttlichem Gericht zur Vernichtung bestimmt ist.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: Du sollst es zutiefst verabscheuen
  rationale: Infinitivus absolutus und finites Verb verstärken die Aufforderung; „zutiefst“ gibt diese Emphase idiomatisch wieder.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: und völlig verachten
  rationale: Die zweite verstärkte Verbfügung bleibt als eigene, parallele Aussage erhalten, ohne die beiden hebräischen Verben zusammenzuziehen.
- source_word: כִּי חֵרֶם הוּא
  choice: denn es ist dem Untergang geweiht
  rationale: Die Wiederholung derselben deutschen Wendung wahrt die lexikalische Verknüpfung mit dem vorherigen חֵרֶם.
theological_decisions:
- issue: Wiedergabe von חֵרֶם im Zusammenhang des göttlichen Gerichts
  choice: dem Untergang geweiht
  alternative: mit dem Bann belegt; verflucht
  rationale: Die Formulierung bewahrt sowohl das Ausgesondertsein als auch die Bestimmung zur Vernichtung unter göttlichem Gericht. „Bann“ wäre für viele Leser undurchsichtig, „verflucht“ gäbe nur einen Teil des Begriffs wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gebotsform und die parallele, verstärkte Ablehnung des Gegenstands bleiben erhalten. Der Fußnotenmarker steht nach der abschließenden Wiederholung des erklärungsbedürftigen Schlüsselbegriffs.
