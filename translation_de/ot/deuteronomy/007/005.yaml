base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: de
  text: 'Vielmehr sollt ihr so mit ihnen verfahren: Ihre Altäre sollt ihr niederreißen, ihre Steinmale[a] zerbrechen, ihre Aschera-Pfähle[b] umhauen und ihre Schnitzbilder[c] im Feuer verbrennen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Kultsäulen; gemeint sind aufgerichtete Steine mit kultischer Funktion.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Ascherim; wahrscheinlich hölzerne Kultobjekte, die mit der Göttin Aschera verbunden waren. Ihre genaue Gestalt ist nicht sicher.
    reason: cultural_note
  - marker: c
    text: 'Oder: ihre geschnitzten Götzenbilder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: Vielmehr sollt ihr so mit ihnen verfahren
  rationale: כִּי אִם markiert einen starken Gegensatz zum vorausgehenden Verbot, כֹּה weist auf die folgenden Handlungen voraus. Die Formulierung gibt zugleich den verpflichtenden Charakter der Anweisung in natürlichem Deutsch wieder.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: Ihre Altäre sollt ihr niederreißen
  rationale: נתץ bezeichnet das Niederreißen oder Abbrechen eines Bauwerks. „Niederreißen“ ist für Altäre konkret und kraftvoll.
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: ihre Steinmale zerbrechen
  rationale: מַצֵּבָה bezeichnet hier einen aufgerichteten kultischen Stein beziehungsweise eine Steinsäule. „Steinmale“ bewahrt die konkrete Gegenständlichkeit; die kultische Funktion wird in der Fußnote erläutert. Das Piel von שׁבר verlangt ein nachdrückliches „zerbrechen“.
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: ihre Aschera-Pfähle umhauen
  rationale: אֲשֵׁרִים sind Kultobjekte, die mit Aschera verbunden und wahrscheinlich aus Holz waren. „Aschera-Pfähle“ ist verständlich, ohne den Eigennamen zu verallgemeinern; „umhauen“ entspricht גדע und passt zu einem hölzernen Gegenstand.
- source_word: פְסִילֵיהֶם
  choice: ihre Schnitzbilder
  rationale: פֶּסֶל bezeichnet ein durch Schnitzen oder Behauen hergestelltes Bild. „Schnitzbilder“ erhält diesen konkreten Sinn besser als das allgemeinere „Götzenbilder“.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: im Feuer verbrennen
  rationale: Die Wiedergabe behält die im Hebräischen ausdrücklich genannte Feuerangabe bei und klingt im Deutschen natürlich.
theological_decisions:
- issue: אֲשֵׁרִים als bestimmtes Kultobjekt oder als allgemeine Götzenbezeichnung
  choice: Aschera-Pfähle
  alternative: Ascheren; Aschera-Kultmale; Götzenbilder
  rationale: Die Aufzählung unterscheidet mehrere Arten kanaanäischer Kultgegenstände. Die konkrete Wiedergabe wahrt den religionsgeschichtlichen Bezug, während die Fußnote die Unsicherheit über die genaue Gestalt offenlegt.
- issue: Stärke des göttlichen Vernichtungsgebots
  choice: Verpflichtendes „sollt“ mit konkreten, kraftvollen Verben
  alternative: Eine abschwächende Umschreibung wie „beseitigt ihre Kultstätten“
  rationale: Der hebräische Text ordnet konkrete Zerstörungshandlungen an. Die Übersetzung mildert sie nicht ab und fügt zugleich keine über den Vers hinausgehende Begründung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Soll-Konstruktion bewahrt den verpflichtenden Ton; die folgende Reihung bleibt eng an der hebräischen Satzstruktur. Altertümliche Wörter wie „Bildsäulen“ oder „geschnitzte Bilderwerke“ werden vermieden. Sämtliche Fußnotenmarker stehen unmittelbar bei dem jeweils erläuterten Ausdruck.
