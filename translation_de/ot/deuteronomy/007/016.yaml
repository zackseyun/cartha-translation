base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: de
  text: Und du sollst alle Völker vernichten[a], die Jahwe, dein Gott, dir gibt. Du sollst sie nicht verschonen[b] und ihren Göttern nicht dienen; denn es wird dir zur Falle werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „verzehren“ oder „aufessen“; hier im Sinn vollständiger Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Dein Auge soll sie nicht verschonen“; auch: „Du sollst kein Mitleid mit ihnen haben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „denn es ist eine Falle für dich“. Das Pronomen kann sich auf den Dienst an ihren Göttern, auf die Götter selbst oder allgemeiner auf die damit verbundene Situation beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: du sollst … vernichten
  rationale: Das Verb bedeutet wörtlich „essen, verzehren“, bezeichnet hier im Zusammenhang der Eroberung aber idiomatisch die vollständige Vernichtung. „Vernichten“ gibt den gemeinten Sinn im Deutschen natürlich wieder; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: כָּל הָעַמִּים
  choice: alle Völker
  rationale: „Völker“ entspricht dem Plural von עַם und bezeichnet hier die verschiedenen Volksgruppen.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: die Jahwe, dein Gott, dir gibt
  rationale: Das Partizip נֹתֵן beschreibt das gegenwärtige beziehungsweise bevorstehende Handeln Gottes. Das Präsens „gibt“ ist im Deutschen dafür natürlich und bewahrt das ausdrücklich genannte „dir“.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Du sollst sie nicht verschonen
  rationale: Die hebräische Wendung lautet wörtlich „Dein Auge soll sie nicht verschonen“. Die deutsche Fassung gibt den idiomatischen Sinn klar wieder, während die konkrete Bildsprache in einer Fußnote erhalten bleibt.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: und ihren Göttern nicht dienen
  rationale: עבד bedeutet „dienen“ und bezeichnet bei Göttern kultische Verehrung und loyale Bindung. „Dienen“ bleibt näher am Hebräischen als das engere „anbeten“.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: denn das wäre eine Falle für dich
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge. „Das“ bezieht sich am ehesten auf das unmittelbar zuvor genannte Dienen fremden Göttern; die mögliche weitere Beziehung des Pronomens wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug von הוּא in כִּי מוֹקֵשׁ הוּא לָךְ
  choice: „das“ bezieht sich im Haupttext auf das Dienen ihrer Götter
  alternative: Das Pronomen kann weiter gefasst auf ihre Götter, die Völker oder die gesamte damit verbundene Situation bezogen werden.
  rationale: Der unmittelbar vorausgehende Satz macht den Götterdienst zum wahrscheinlichsten Bezug. Da das hebräische Pronomen den Bezug jedoch nicht ausdrücklich festlegt, wird die Ambiguität in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Verzehrmetapher und die Augen-Redewendung werden zugunsten unmittelbarer Verständlichkeit idiomatisch übersetzt und in Fußnoten belegt. „Jahwe“ bewahrt den Gottesnamen; „Falle“ ist heute geläufiger als „Schlinge“.
