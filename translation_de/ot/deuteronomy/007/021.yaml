  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: de
  text: Fürchte dich nicht vor ihnen[a], denn Jahwe, dein Gott, ist in deiner Mitte[b], ein großer und Ehrfurcht gebietender[c] Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erschrick nicht vor ihnen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in deiner Mitte“; gemeint ist Jahwes Gegenwart in der Mitte des als Einheit angesprochenen Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „furchterregend“. Das hebräische Wort bezeichnet jemanden, der Furcht und ehrfürchtiges Staunen hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: Erschrick nicht vor ihnen
  rationale: Das Verb ערץ bezeichnet heftige Furcht oder Entsetzen. Die deutsche Wendung „vor ihnen erschrecken“ gibt sowohl die Intensität als auch die Präposition מִפְּנֵי natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Bundesbeziehung und der Singular der Anrede bleiben ausdrücklich erhalten.
- source_word: בְּקִרְבְּךָ
  choice: in deiner Mitte
  rationale: Die Formulierung bezeichnet Jahwes Gegenwart mitten bei Israel; sie vermeidet die mögliche individualistische Deutung „in dir“.
- source_word: אֵל גָּדוֹל
  choice: ein großer Gott
  rationale: אֵל ist hier Gottesbezeichnung beziehungsweise Apposition, und גָּדוֹל wird in seiner direkten Bedeutung „groß“ wiedergegeben.
- source_word: וְנוֹרָא
  choice: Ehrfurcht gebietend
  rationale: Das Wort bezeichnet jemanden, der Furcht und ehrfürchtiges Staunen hervorruft. „Ehrfurcht gebietend“ bewahrt diese Spannweite besser als das heute oft abgeschwächte „beeindruckend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich; die Transliteration bewahrt den Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וְנוֹרָא
  choice: Ehrfurcht gebietend
  alternative: furchterregend
  rationale: Die Übersetzung lässt sowohl Furcht als auch ehrfürchtiges Staunen anklingen und beschränkt den Ausdruck nicht auf bloßen Schrecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Singularanrede an Israel bleibt erhalten; „Ehrfurcht gebietend“ bewahrt die theologische Spannung zwischen Furcht und Verehrung.
