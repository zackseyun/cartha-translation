  verdict: revise
  source_fidelity: Der Entwurf gibt den verneinten Grund, den Vergleich mit den Völkern, Jahwes Hinwendung und Erwählung sowie Israels zahlenmäßige Geringheit im Wesentlichen zutreffend wieder. Der Konjunktiv II „gewesen wärt“ erzeugt jedoch eine im Hebräischen nicht vorhandene Irrealisbedeutung; erforderlich ist der Indikativ Präteritum „wart“. „Sich euch zugewandt“ ist möglich, schwächt bei sich allein aber die in חָשַׁק enthaltene Nuance starker Zuneigung bzw. Bindung etwas ab.
  naturalness: Mit „wart“ ist der Satz idiomatisch und klar. „das kleinste aller Völker“ ist im Kontext der vorangehenden Zahlenangabe verständlich; „zahlenmäßig kleinste“ macht die im Hebräischen gemeinte Vergleichsdimension ausdrücklich und natürlich deutlich.
  terminology: „Jahwe“, „erwählt“ und „Völker“ sind sachgerecht. „sich euch in Liebe zugewandt“ gibt die personale Zuneigung von חָשַׁק besser wieder, ohne die Aussage zu überdeuten. Die Fußnote bietet mit „an euch gehangen“ eine engere lexikalische Alternative.
