    rationale: „Sich zuwenden“ bezeichnet Hinwendung, drückt aber nicht notwendig die starke Zuneigung oder Bindung des hebräischen Verbs aus. Die Ergänzung „in Liebe“ wahrt diese Nuance in natürlichem Deutsch.
