  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: de
  text: Nicht weil ihr zahlreicher wart als alle anderen Völker, hat Jahwe sich euch in Liebe zugewandt und euch erwählt[a], denn ihr seid das zahlenmäßig kleinste aller Völker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an euch gehangen und euch erwählt“. Das hebräische Verb bezeichnet starke Zuneigung oder Bindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: weil ihr zahlreicher gewesen wärt als alle anderen Völker
  rationale: Die Konstruktion bezeichnet im Zusammenhang mit לֹא den ausdrücklich verneinten Grund und stellt Israels Zahl vergleichend derjenigen der übrigen Völker gegenüber. Der Konjunktiv gibt die verneinte Begründung im Deutschen natürlich wieder.
- source_word: חָשַׁק ... בָּכֶם
  choice: hat ... sich euch zugewandt
  rationale: Das Verb bezeichnet eine starke persönliche Hinwendung oder Bindung. „Sich zuwenden“ ist natürlich und würdevoll; die mögliche Liebesnuance wird in der Fußnote kenntlich gemacht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּבְחַר בָּכֶם
  choice: und euch erwählt
  rationale: בחר bedeutet hier im Bundeskontext „erwählen“. Die Formulierung bewahrt die Aussage göttlicher Wahl, ohne sie systematisch-theologisch auszuweiten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die erläuternde Begründung für die vorangehende Verneinung ein.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: das kleinste unter allen Völkern
  rationale: Der Ausdruck beschreibt Israel als zahlenmäßig geringstes Volk. Im Deutschen ist „das kleinste“ idiomatisch; der vorausgehende Vergleich „zahlreicher“ macht den numerischen Sinn eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Charakter, statt einen Titel einzusetzen.
- issue: Aussage über Gottes Erwählung Israels
  choice: und euch erwählt
  alternative: und euch ausgewählt
  rationale: Die traditionelle und lexikalisch genaue Wendung bewahrt die bundestheologische Aussage des Verses, ohne spätere Lehrsysteme in den Text einzutragen.
- issue: Bedeutungsumfang von חָשַׁק
  choice: sich euch zugewandt
  alternative: euch seine Liebe zugewandt; an euch gehangen
  rationale: Die Hauptfassung gibt die starke persönliche Hinwendung verständlich wieder; die Fußnote hält die echte Liebes- und Bindungsnuance des hebräischen Verbs offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die Satzstellung folgt dem hebräischen Kontrast zwischen nicht vorhandener zahlenmäßiger Größe und Jahwes freier Zuwendung. „Völker“ bewahrt den kollektiv-ethnischen Sinn von עַמִּים.
