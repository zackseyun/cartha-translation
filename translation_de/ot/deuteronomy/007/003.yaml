id: DEU.7.3
reference: Deuteronomy 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: de
  text: 'Und du sollst dich nicht mit ihnen verschwägern: Deine Tochter sollst du nicht seinem Sohn geben, und seine Tochter sollst du nicht für deinen Sohn nehmen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: dich verschwägern
  rationale: Das Hitpael von חתן bezeichnet hier das Eingehen wechselseitiger Heiratsverbindungen mit den zuvor genannten Völkern. „Sich verschwägern“ gibt diesen sozialen und reziproken Sinn im Deutschen prägnant wieder.
- source_word: בָּם
  choice: mit ihnen
  rationale: Die Präposition ב mit dem Suffix der 3. Person maskulin Plural verweist auf die zuvor genannten Völker; „mit ihnen“ entspricht der deutschen Verbindung mit „sich verschwägern“.
- source_word: בִּתְּךָ
  choice: deine Tochter
  rationale: Direkte Wiedergabe des Singulars mit Suffix der 2. Person maskulin Singular.
- source_word: תִתֵּן
  choice: sollst du geben
  rationale: Das einfache Verb „geben“ wird beibehalten; der Zusammenhang der Heiratsverbindung macht den Sinn hinreichend deutlich, ohne „zur Frau“ oder „zur Ehe“ hinzuzufügen.
- source_word: לִבְנוֹ
  choice: seinem Sohn
  rationale: Der Dativ gibt die mit ל markierte Zuordnung im Deutschen natürlich und knapp wieder.
- source_word: וּבִתּוֹ
  choice: seine Tochter
  rationale: Wörtliche Wiedergabe des Substantivs mit Suffix der 3. Person maskulin Singular.
- source_word: תִקַּח
  choice: sollst du nehmen
  rationale: Das hebräische Verb bedeutet schlicht „nehmen“. Die Formulierung bewahrt den Wortlaut, ohne die im Kontext erkennbare Eheschließung ausdrücklich einzufügen.
- source_word: לִבְנֶךָ
  choice: für deinen Sohn
  rationale: „Für deinen Sohn nehmen“ gibt die durch ל bezeichnete Zuordnung idiomatisch wieder und erhält zugleich die Parallelität der beiden Satzhälften.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Das Verbot wird auf Heiratsverbindungen mit den durch „ihnen“ bezeichneten, zuvor genannten Völkern bezogen, ohne die Begründung des folgenden Verses vorwegzunehmen.
  alternative: Ein allgemeines Verbot jeder Ehe mit Fremden oder ein vom Bundeskontext gelöstes ethnisches Verbot.
  rationale: Der Vers selbst bezieht sich mit „ihnen“ auf den unmittelbaren Kontext. Eine weitergehende Verallgemeinerung oder Einschränkung wäre im Wortlaut dieses Verses nicht ausdrücklich enthalten.
- issue: Geschlechtsspezifische Verwandtschaftsbegriffe
  choice: „Tochter“ und „Sohn“ bleiben entsprechend dem hebräischen Singular und Genus erhalten.
  alternative: Geschlechtsneutrale Sammelbegriffe wie „Kinder“.
  rationale: Die hebräische Rechtsformulierung nennt ausdrücklich Tochter und Sohn; eine Neutralisierung würde die konkrete Parallelstruktur verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. „Sich verschwägern“ ist etwas gehobener, aber allgemein verständlich und bildet den Gedanken wechselseitiger Heiratsverbindungen genauer ab als das bloße „heiraten“. Keine Fußnote ist nötig, da keine textkritische oder für das Verständnis wesentliche lexikalische Alternative im Haupttext markiert werden muss.
