  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: de
  text: Denn er wird deinen Sohn davon abbringen, mir zu folgen,[a] und sie werden anderen Göttern dienen.[b] Dann wird der Zorn Jahwes gegen euch entbrennen,[c] und er wird dich schnell vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von hinter mir weg«; gemeint ist, die Nachfolge aufzugeben.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text wechselt von der Einzahl »deinen Sohn« zur Mehrzahl »sie werden dienen«. Dadurch kann die Warnung über den einzelnen Sohn hinaus auf die daraus hervorgehende Familie oder Gemeinschaft weisen.
    reason: alternative_reading
  - marker: c
    text: »Jahwe« gibt den hebräischen Gottesnamen JHWH wieder; traditionell wird er auch mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das Verbot im vorangehenden Vers ein und wahrt den argumentativen Zusammenhang.
- source_word: יָסִיר
  choice: wird ... davon abbringen
  rationale: 'Die Hifil-Form von סור ist kausativ: Jemand bringt den Sohn dazu, sich von der Nachfolge abzuwenden. Die deutsche Wendung ist natürlich und bewahrt diesen Sinn.'
- source_word: בִּנְךָ
  choice: deinen Sohn
  rationale: Der hebräische Text steht im maskulinen Singular und knüpft an die konkrete Heiratsregel des vorherigen Verses an.
- source_word: מֵאַחֲרַי
  choice: mir zu folgen
  rationale: Wörtlich »hinter mir her« beziehungsweise »von hinter mir weg«; idiomatisch bezeichnet die Formulierung das Aufgeben der Nachfolge.
- source_word: וְעָבְדוּ
  choice: sodass sie ... dienen werden
  rationale: Das Verb steht entgegen dem unmittelbar vorausgehenden Singular im Plural. Die Übersetzung erhält diesen Numeruswechsel und macht zugleich die Folgebeziehung verständlich.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Direkte, geläufige Wiedergabe der hebräischen Bezeichnung für Gottheiten neben Jahwe.
- source_word: וְחָרָה אַף יְהוָה
  choice: Dann wird der Zorn Jahwes ... entbrennen
  rationale: Bewahrt das hebräische Bild des brennenden Zorns in einer würdigen und idiomatischen deutschen Formulierung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בָּכֶם
  choice: gegen euch
  rationale: Bei der Wendung vom entbrennenden Zorn bezeichnet ב den Gegenstand, gegen den sich der Zorn richtet. Der Plural wird bewahrt.
- source_word: וְהִשְׁמִידְךָ
  choice: und er wird dich ... vernichten
  rationale: Die Hifil-Form von שׁמד bezeichnet vollständige Zerstörung. »Vernichten« ist stark, klar und dem ernsten Register angemessen; der Singular wird erhalten.
- source_word: מַהֵר
  choice: schnell
  rationale: Gibt die adverbiale Bestimmung wieder und wahrt die Dringlichkeit der Gerichtswarnung.
theological_decisions:
- issue: Numeruswechsel bei den Betroffenen
  choice: »deinen Sohn« im Singular, danach »sie werden dienen« im Plural; außerdem »gegen euch« im Plural und »dich« im Singular
  alternative: Die Pronomen und Verben auf einen einheitlichen Singular oder Plural glätten
  rationale: Der masoretische Text wechselt bewusst oder zumindest tatsächlich zwischen Singular und Plural. Die Übersetzung bewahrt diese Spannung, ohne den Kreis der Gemeinten enger festzulegen, als es der Ausgangstext erlaubt.
- issue: Bezug des Subjekts von יָסִיר
  choice: »er«
  alternative: Im Deutschen ausdrücklich »der fremde Schwiegervater« oder geschlechtsneutral »sie« einsetzen
  rationale: Der hebräische Text hat eine maskuline Singularform, deren Bezug aus dem vorherigen Vers hervorgeht. Die knappe pronominale Wiedergabe vermeidet zusätzliche Auslegung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« kennzeichnet den persönlichen Gottesnamen und unterscheidet ihn transparent von einem bloßen Titel.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, ernstem Ton. Die Satzfolge bleibt eng am Hebräischen, während »davon abbringen, mir zu folgen« und »der Zorn ... entbrennen« natürliches Deutsch bieten. Sämtliche auffälligen Numeruswechsel des Ausgangstextes bleiben sichtbar.
