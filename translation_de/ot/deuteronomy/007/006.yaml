revisions:
- from: Denn du bist ein heiliges Volk für Jahwe, deinen Gott. Dich hat Jahwe, dein Gott, erwählt, damit du ihm als sein kostbares Volk gehörst[a], aus allen Völkern auf der ganzen Erde.
  to: Denn du bist ein heiliges Volk, das Jahwe, deinem Gott, gehört. Dich hat Jahwe, dein Gott, erwählt, damit du ihm als ein Volk gehörst, das sein besonderes Eigentum ist, aus allen Völkern auf der Erde.[a]
  rationale: Die Revision ersetzt die unidiomatische, semantisch offene Wendung „für Jahwe“ durch eine klare Zugehörigkeitsaussage. Sie gibt סְגֻלָּה als „besonderes Eigentum“ wieder und erhält zugleich עַם („Volk“). Die Stellung von „aus allen Völkern auf der Erde“ bleibt nahe am hebräischen Satzverlauf und bezeichnet Auswahl aus der Gesamtheit der Völker, nicht eine Aussage über deren Rang.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Israel wird als heiliges Volk und als von Jahwe erwähltes besonderes Eigentum aus allen Völkern bezeichnet. „Für Jahwe“ ist für die Zugehörigkeitsnuance von לַיהוָה jedoch im Deutschen unidiomatisch und weniger präzise. Zudem gibt „sein kostbares Volk“ den Besitzcharakter von סְגֻלָּה nur abgeschwächt wieder.'
  naturalness: Die Voranstellung von „Dich“ ist natürlich und bewahrt die hebräische Hervorhebung. Die Formulierung „ein heiliges Volk für Jahwe“ klingt dagegen wie eine formnahe Übertragung und nicht wie modernes Standarddeutsch. Die revidierte Fassung stellt Zugehörigkeit und besonderes Eigentum klar und idiomatisch dar.
  terminology: „Jahwe“, „heiliges Volk“ und „erwählt“ sind angemessen. „Besonderes Eigentum“ gibt סְגֻלָּה sachgerecht wieder, während „Volk“ als im Ausgangstext ausdrücklich genannter Begriff erhalten bleibt. „Auf der Erde“ ist eine natürliche Wiedergabe der idiomatischen Wendung עַל־פְּנֵי הָאֲדָמָה.
  issues:
  - severity: medium
    issue: „für Jahwe, deinen Gott“
    rationale: Das ל in לַיהוָה bezeichnet hier Zugehörigkeit bzw. Beziehung. „Für Jahwe“ ist im Deutschen semantisch unscharf und stilistisch unnatürlich; „das Jahwe, deinem Gott, gehört“ gibt den Sinn klar wieder.
  - severity: medium
    issue: „als sein kostbares Volk“
    rationale: Die Wiedergabe enthält zwar den Wertgedanken, lässt aber den Besitzbegriff von סְגֻלָּה zu wenig erkennen. Eine Formulierung mit „besonderes Eigentum“ wahrt diesen Aspekt, ohne das ausdrücklich vorhandene „Volk“ auszulassen.
