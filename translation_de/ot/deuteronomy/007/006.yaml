base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: de
  text: Denn du bist ein heiliges Volk, das Jahwe, deinem Gott, gehört. Dich hat Jahwe, dein Gott, erwählt, damit du ihm als ein Volk gehörst, das sein besonderes Eigentum ist, aus allen Völkern auf der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du ihm als ein Volk zum besonderen Eigentum gehörst“. Das Hebräische verbindet die Vorstellung eines Volkes mit der eines besonders geschätzten Besitzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das zuvor Gebotene ein und bewahrt den erklärenden Zusammenhang.
- source_word: עַם קָדוֹשׁ
  choice: ein heiliges Volk
  rationale: Gibt die Aussonderung und Zugehörigkeit zu Gott in natürlichem, theologisch gewichtigem Deutsch wieder.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: für Jahwe, deinen Gott
  rationale: Das ל bezeichnet hier die Beziehung beziehungsweise Zugehörigkeit; „für“ bleibt nahe an der Form und ist verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: בְּךָ בָּחַר
  choice: Dich hat … erwählt
  rationale: Die Voranstellung von „Dich“ spiegelt die Hervorhebung durch בְּךָ; „erwählt“ bewahrt die Bundes- und Erwählungssprache.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: damit du ihm als sein kostbares Volk gehörst
  rationale: Verbindet Zweck und Zugehörigkeit und bewahrt zugleich das ausdrücklich genannte „Volk“ sowie den Sinn eines besonders geschätzten Eigentums.
- source_word: מִכֹּל הָעַמִּים
  choice: aus allen Völkern
  rationale: Bezeichnet die Auswahl aus der Gesamtheit der Völker, ohne eine nicht ausdrücklich ausgesagte Rangordnung einzutragen.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: auf der ganzen Erde
  rationale: Gibt die hebräische Wendung idiomatisch und allgemein verständlich wieder; sie bezeichnet die Völker auf der Erdoberfläche.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; die Umschrift bewahrt den Charakter als Bundes- und Eigenname.
- issue: Bedeutung von מִכֹּל הָעַמִּים für Israels Erwählung
  choice: aus allen Völkern
  alternative: mehr als alle Völker
  rationale: Die Präposition bezeichnet hier die Auswahl aus einer Gruppe. Die Übersetzung wahrt die Erwählungsaussage, ohne daraus ausdrücklich eine Rangordnung oder einen inneren Vorzug abzuleiten.
- issue: Verhältnis von Volk und Eigentum in לְעַם סְגֻלָּה
  choice: sein kostbares Volk
  alternative: sein kostbarer Besitz
  rationale: „Volk“ ist im Hebräischen ausdrücklich vorhanden, während סְגֻלָּה den Gedanken eines besonders geschätzten Eigentums hinzufügt. Die Hauptfassung hält beide Aspekte zusammen; die Fußnote nennt die stärker besitzbezogene Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt entsprechend dem Hebräischen „Dich“ hervor. „Auf der ganzen Erde“ löst die feste hebräische Wendung natürlich auf, ohne ihren universalen Umfang einzuschränken.
