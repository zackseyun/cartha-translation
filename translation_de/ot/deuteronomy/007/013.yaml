  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: de
  text: 'Er wird dich lieben, dich segnen und dich vermehren. Er wird die Frucht deines Leibes und die Frucht deines Bodens segnen: dein Getreide, deinen neuen Wein und dein Öl, den Nachwuchs deiner Rinder und die Jungtiere deines Kleinviehs – in dem Land, von dem er deinen Vätern[a] geschworen hat, es dir zu geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Vorfahren“. Wörtlich: „deinen Vätern“.'
    reason: 'Lexikalische Alternative: אָבוֹת kann je nach Zusammenhang die Väter im engeren Sinn oder die Vorfahren bezeichnen.'
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Er wird dich lieben
  rationale: Der Zusammenhang führt die verheißenen Bundessegnungen mit Zukunftsbezug fort; „lieben“ bewahrt die direkte Aussage und ihre bundestheologische Färbung.
- source_word: וּבֵרַכְךָ וְהִרְבֶּךָ
  choice: dich segnen und dich vermehren
  rationale: „Segnen“ entspricht dem üblichen Bundeswortschatz; „vermehren“ bewahrt das direkte Objekt und bezeichnet die Zunahme des Volkes.
- source_word: פְּרִי בִטְנְךָ וּפְרִי אַדְמָתֶךָ
  choice: die Frucht deines Leibes und die Frucht deines Bodens
  rationale: Die wiederholte Wiedergabe von פְּרִי erhält die bewusste Parallelität und die konkreten Fruchtbarkeitsbilder des Hebräischen.
- source_word: דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: dein Getreide, deinen neuen Wein und dein Öl
  rationale: Die drei landwirtschaftlichen Grundprodukte werden klar und knapp wiedergegeben; „neuer Wein“ wahrt die besondere Bedeutung von תִּירוֹשׁ gegenüber Wein im Allgemeinen.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: den Nachwuchs deiner Rinder
  rationale: Die Wendung bezeichnet den tierischen Zuwachs der Rinder; der deutsche Plural entspricht dem pluralischen Hebräisch natürlich.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: die Jungtiere deiner Herden
  rationale: Das seltene Wort bezeichnet in dieser Verbindung den Nachwuchs des Kleinviehs. Die Übersetzung gibt den Sinn wieder, ohne fälschlich einen Eigennamen einzutragen.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: Gemeint ist das verheißene Gebiet, in dem die Segnungen eintreten; „in dem Land“ ist dafür im Deutschen idiomatisch.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: von dem er deinen Vätern geschworen hat, es dir zu geben
  rationale: Die Formulierung bewahrt den Schwur, die maskuline Bezeichnung „Väter“ und die singularische Anrede; die deutsche Relativkonstruktion macht den Bezug auf das Land eindeutig.
theological_decisions:
- issue: Wiedergabe von לַאֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: Das Hebräische verwendet ausdrücklich den maskulinen Plural „Väter“. Die Hauptübersetzung bewahrt diese Form; die mögliche allgemeinere Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Parallelität. Die singularische Du-Anrede bezieht sich kollektiv auf Israel. „Frucht des Leibes“ bleibt als verständliches biblisches Bild stehen; ungewöhnliche Viehzuchtbegriffe werden sinngetreu und ohne spekulative Eigennamen wiedergegeben.
