base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: de
  text: Doch Jahwe, dein Gott, wird sie dir ausliefern[a] und sie in große Verwirrung[b] stürzen, bis sie vernichtet sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dich“. Gemeint ist hier, dass Jahwe diese Feinde in deine Gewalt gibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in große Panik“ oder „in große Bestürzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: wird sie dir ausliefern
  rationale: נתן mit direktem Objekt und לְפָנֶיךָ bezeichnet hier idiomatisch die Übergabe der Feinde in Israels Gewalt. „Ausliefern“ gibt den militärischen Sinn natürlich wieder; die wörtlichere Form wird in Fußnote [a] genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form enthält ein Suffix der 2. Person Maskulin Singular und bedeutet unmittelbar „dein Gott“.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: und sie in große Verwirrung stürzen
  rationale: Das Verb המם beschreibt das Versetzen in Bestürzung, Panik oder ungeordnete Verwirrung, besonders im Kampf. Die Formulierung wahrt die kausative Kraft und klingt im modernen Deutschen natürlich.
- source_word: עַד הִשָּׁמְדָם
  choice: bis sie vernichtet sind
  rationale: Die Konstruktion mit עַד bezeichnet den Endpunkt des Geschehens. Die Wiedergabe bewahrt den resultativen Sinn, ohne ausdrücklich festzulegen, wer die Vernichtung unmittelbar vollzieht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm יְהוָה. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Akteur der abschließenden Vernichtung
  choice: 'Passivisch: „bis sie vernichtet sind“'
  alternative: „bis ihr sie vernichtet habt“; „bis sie zugrunde gehen“
  rationale: Die hebräische Infinitivkonstruktion benennt hier vor allem das Ergebnis beziehungsweise den Endpunkt. Die passive deutsche Form vermeidet es, einen im Vers nicht ausdrücklich genannten unmittelbaren Akteur einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. „Doch“ bildet den hebräischen Anschluss natürlich ab; „ausliefern“ und „in Verwirrung stürzen“ vermitteln den militärischen Kontext ohne archaische Sprache.
