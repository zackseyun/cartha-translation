  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: de
  text: Die geschnitzten Bilder ihrer Götter sollt ihr im Feuer verbrennen. Du sollst nicht das Silber und Gold begehren, das an ihnen ist, und es dir nehmen, damit du nicht dadurch in eine Falle gerätst[a]; denn es ist Jahwe, deinem Gott, ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du nicht dadurch verstrickt wirst“. Das hebräische Verb bezeichnet das Fangen mit einer Schlinge oder Falle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  choice: geschnitzten Bilder
  rationale: Bewahrt den konkreten Sinn von פֶּסֶל als geschnitztes oder behauenes Bild und vermeidet sowohl das altertümliche „Götzenbild“ als auch eine unnötig deutende Wiedergabe.
- source_word: אֱלֹהֵיהֶם
  choice: ihrer Götter
  rationale: Direkte und natürliche Wiedergabe der Pluralkonstruktion mit Suffix.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: sollt ihr im Feuer verbrennen
  rationale: Gibt Verb und Mittelangabe vollständig wieder; „im Feuer verbrennen“ ist im Deutschen natürlich.
- source_word: לֹא תַחְמֹד
  choice: Du sollst nicht … begehren
  rationale: „Begehren“ wahrt den ethischen Gehalt von חמד und den würdigen biblischen Sprachgebrauch, ohne altertümlich zu wirken.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: das Silber und Gold, das an ihnen ist
  rationale: Das hebräische וְ wird als „und“ bewahrt. „An ihnen“ lässt offen, ob das Edelmetall aufgebracht, befestigt oder anderweitig Bestandteil der Bilder ist.
- source_word: וְלָקַחְתָּ לָךְ
  choice: und es an dich nehmen
  rationale: Bewahrt die singuläre, kollektiv auf das Edelmetall bezogene Form sowie den reflexiven Nutzen von לָךְ.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: damit du nicht dadurch in eine Falle gerätst
  rationale: Gibt die Fallenmetaphorik des Niphal von יקשׁ in verständlichem modernem Deutsch wieder; „dadurch“ lässt den Bezug hinreichend offen.
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Bewahrt die starke religiös-moralische Wertung des hebräischen Ausdrucks und entspricht einem würdigen, etablierten deutschen Bibelregister.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bezug des abschließenden Pronomens הוּא
  choice: „es“ bleibt ohne engere Festlegung
  alternative: Das Pronomen ausdrücklich nur auf das geschnitzte Bild, das Edelmetall oder den Vorgang des Ansichnehmens beziehen.
  rationale: Der unmittelbare Zusammenhang betrifft das begehrte und genommene Edelmetall, während zugleich der gesamte mit den Götterbildern verbundene Gegenstandskomplex im Blick steht. Das neutrale „es“ bewahrt diese Mehrdeutigkeit.
- issue: Numeruswechsel zwischen תִּשְׂרְפוּן und den folgenden Singularformen
  choice: „sollt ihr“ und danach „Du sollst“
  alternative: Den gesamten Vers einheitlich im Singular oder Plural formulieren.
  rationale: Der Wechsel vom Plural zum kollektiven Singular steht im hebräischen Text und wird sichtbar bewahrt, auch wenn er im Deutschen auffällt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formaler biblischer Diktion. Der auffällige Numeruswechsel des Hebräischen bleibt erhalten. Der Gottesname wird als „Jahwe“ wiedergegeben; die Schlussaussage wahrt die Unbestimmtheit ihres Bezugs.
