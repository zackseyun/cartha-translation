  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: de
  text: 'So erkenne[a]: Jahwe, dein Gott, ist Gott, der treue Gott, der den Bund und die beständige Liebe[b] für die bewahrt, die ihn lieben und seine Gebote halten – für tausend Generationen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und erkenne“ beziehungsweise „Darum erkenne“. Die hebräische Verbindung kann eine einfache Fortsetzung oder eine Folgerung aus dem Vorhergehenden ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort חֶסֶד umfasst hier beständige Liebe, Güte, Barmherzigkeit und Bundestreue.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „bis zu tausend Generationen“. Die Wendung bezeichnet Gottes anhaltende Bundestreue über einen außerordentlich langen Zeitraum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: So erkenne
  rationale: Das Qal-Perfekt der 2. Person Singular hat hier auffordernde Kraft. „So“ gibt den möglichen Folgerungszusammenhang zum vorangehenden Kontext wieder, ohne die Konjunktion lediglich additiv zu verstehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe bewahrt den persönlichen Gottesnamen und seinen bundesbezogenen Charakter.
- source_word: הוּא הָאֱלֹהִים
  choice: ist Gott
  rationale: Das selbstständige Pronomen betont die Aussage. Im Deutschen bringt „ist Gott“ die prädikative Aussage natürlich zum Ausdruck; die Exklusivität ergibt sich aus dem Kontext und der Betonung.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: der treue Gott
  rationale: Die appositionelle Wendung bezeichnet Gott als verlässlich und bundestreu. „Der treue Gott“ ist natürlich, würdig und bewahrt die theologische Resonanz.
- source_word: שֹׁמֵר
  choice: bewahrt
  rationale: Das Partizip beschreibt fortdauerndes Handeln. „Bewahrt“ passt zu Bund und beständiger Liebe und vermittelt deren zuverlässige Aufrechterhaltung.
- source_word: הַבְּרִית
  choice: den Bund
  rationale: Die bestimmte Form verweist auf die verbindliche Bundesbeziehung; „Bund“ ist die etablierte deutsche Entsprechung.
- source_word: וְהַחֶסֶד
  choice: und die beständige Liebe
  rationale: חֶסֶד verbindet in diesem Bundeszusammenhang Liebe, Güte, Loyalität und Verlässlichkeit. „Beständige Liebe“ ist verständlich und hält sowohl die emotionale als auch die bundestreue Dimension offen.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: denen, die ihn lieben und seine Gebote halten
  rationale: Die beiden parallelen Partizipialgruppen bezeichnen die Empfänger von Gottes Bundestreue. Die gemeinsame Relativkonstruktion ist im Deutschen flüssig und bewahrt ihre enge Verbindung.
- source_word: לְאֶלֶף דּוֹר
  choice: bis in tausend Generationen
  rationale: Die Wendung bezeichnet eine außerordentlich lange Dauer. „Bis in tausend Generationen“ bildet die zeitliche Reichweite idiomatisch ab, ohne die Zahl zu verflüchtigen.
theological_decisions:
- issue: Gottes Bundestreue im Verhältnis zu menschlicher Liebe und Gebotstreue
  choice: Gott bewahrt Bund und beständige Liebe denen, die ihn lieben und seine Gebote halten.
  alternative: 'Gott hält den Bund und erweist Güte an denen, die ihn lieben; oder: Die Wendung „tausend Generationen“ wird enger an die Gehorsamen angeschlossen.'
  rationale: Der hebräische Text verbindet Gottes verlässliches Bundeshandeln mit den Menschen, die ihn lieben und seine Gebote halten. Die Übersetzung bewahrt diese Spannung, ohne sie durch ein späteres theologisches System abzuschwächen oder zu verschärfen.
- issue: Bezug von לְאֶלֶף דּוֹר
  choice: Die Wendung beschreibt die zeitliche Reichweite des Bewahrens von Bund und Liebe.
  alternative: 'Sie kann syntaktisch enger mit „denen, die ihn lieben und seine Gebote halten“ verbunden gelesen werden: „für tausend Generationen“.'
  rationale: Die Stellung am Versende erlaubt eine gewisse syntaktische Offenheit. Der Haupttext gibt die natürliche durative Lesart wieder; die Fußnote wahrt die alternative Anbindung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gottesname wird als „Jahwe“ wiedergegeben. Die Satzstruktur bleibt nahe am hebräischen Aufbau, vermeidet aber eine im Deutschen schwerfällige Wiederholung der Präpositionen.
