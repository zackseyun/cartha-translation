source:
  edition: WLC
  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: de
  text: Und wenn Jahwe, dein Gott, sie dir ausliefert und du sie schlägst, sollst du sie vollständig der Vernichtung weihen[a]. Du sollst keinen Bund mit ihnen schließen und ihnen keine Gunst erweisen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst sie unbedingt dem Bann übergeben.“ Im Hebräischen steht das Verb חרם in einer verstärkenden Konstruktion; gemeint ist die vollständige Weihe zur Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihnen kein Erbarmen zeigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: sie dir ausliefert
  rationale: נתן bezeichnet mit Personen als Objekt im militärischen Zusammenhang die Übergabe in die Gewalt eines anderen. „Ausliefert“ bewahrt Gottes Handeln und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְפָנֶיךָ
  choice: dir
  rationale: Das idiomatische לְפָנֶיךָ bezeichnet hier die Übergabe vor Israel beziehungsweise in Israels Gewalt. Im Deutschen ist dies in „sie dir ausliefert“ natürlich mitausgedrückt, ohne die Wendung unnötig wörtlich zu verdoppeln.
- source_word: וְהִכִּיתָם
  choice: du sie schlägst
  rationale: נכה bezeichnet im Krieg das Schlagen beziehungsweise Niederschlagen des Gegners. „Schlägst“ erhält die gewaltsame militärische Aussage, ohne archaisch zu wirken.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: sollst du sie vollständig der Vernichtung weihen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt חרם. Die Formulierung bewahrt sowohl die vollständige Vernichtung als auch den Gedanken, dass die Betroffenen dem Bann geweiht werden.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Du sollst keinen Bund mit ihnen schließen
  rationale: כרת ברית ist die feste Wendung für das Schließen eines Bundes. „Bund“ erhält den breiteren formalen und relationalen Sinn besser als das engere „Vertrag“.
- source_word: וְלֹא תְחָנֵּם
  choice: ihnen keine Gunst erweisen
  rationale: חנן bedeutet Gunst oder Gnade erweisen. „Keine Gunst erweisen“ gibt den lexikalischen Kern wieder; die kontextuell mögliche Bedeutung „kein Erbarmen zeigen“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von חרם im Kontext des Bannkriegs
  choice: vollständig der Vernichtung weihen
  alternative: vollständig vernichten; dem Bann übergeben
  rationale: Diese Wiedergabe lässt die kultisch-theologische Dimension des Bannbegriffs ebenso erkennen wie seine auf vollständige Vernichtung zielende Härte, ohne ihn auf gewöhnliches militärisches Töten zu reduzieren.
- issue: Wiedergabe von תְחָנֵּם
  choice: keine Gunst erweisen
  alternative: kein Erbarmen zeigen
  rationale: „Gunst“ entspricht dem Grundsinn von חנן. „Erbarmen“ ist im Zusammenhang möglich, legt den Ausdruck aber stärker auf Schonung beziehungsweise Mitleid fest und bleibt deshalb als Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt nahe am hebräischen Ablauf, wird aber idiomatisch geglättet. „Der Vernichtung weihen“ erhält bewusst die Spannung zwischen kultischer Bannvorstellung und tatsächlicher Vernichtung.
