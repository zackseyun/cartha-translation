  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: de
  text: Ihr seid lange genug um dieses Bergland herumgezogen[a]; wendet euch nach Norden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um diesen Berg«. Das hebräische Wort kann einen einzelnen Berg oder eine gebirgige Region bezeichnen; der Zusammenhang der Wanderung spricht hier eher für »Bergland«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: Ihr seid lange genug … gezogen
  rationale: Die Wendung bezeichnet hier, dass das Umherziehen nun lange genug gedauert hat; zusammen mit סֹב wird dies im Deutschen natürlich als abgeschlossene Dauer ausgedrückt.
- source_word: סֹב
  choice: um … gezogen
  rationale: Die Form von סבב bezeichnet das Ziehen um ein Gebiet herum. Das Perfekt passt zum rückblickenden Sinn der Aufforderung.
- source_word: הָהָר הַזֶּה
  choice: dieses Bergland
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen. Im Zusammenhang der Wanderroute liegt die regionale Bedeutung nahe.
- source_word: פְּנוּ
  choice: wendet euch
  rationale: Der Imperativ von פנה fordert hier zu einem Richtungswechsel auf. „Wendet euch“ ist würdig und gibt auch die reflexiv-dativische Färbung von לָכֶם natürlich wieder.
- source_word: צָפֹנָה
  choice: nach Norden
  rationale: Die Richtungsendung bezeichnet eine Bewegung nordwärts; „nach Norden“ ist im modernen Deutschen die natürliche Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede steht im Plural. Der hebräische Dativ לָכֶם wird nicht eigens mit „für euch“ wiedergegeben, da dies im Deutschen unnatürlich wäre; die reflexive Form „wendet euch“ fügt sich idiomatisch in den Befehl.
