  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: de
  text: Nun steht auf und überquert das Wadi Sered[a]! Da überquerten wir das Wadi Sered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Sered-Bach“ beziehungsweise „das Seredtal“. Das hebräische Wort נחל kann je nach Zusammenhang ein Wadi, ein Tal oder ein Bachbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Die temporale Diskursmarkierung leitet den nächsten befohlenen Schritt ein; „Nun“ wahrt die Unmittelbarkeit und klingt in diesem erzählenden Kontext würdevoll und natürlich.
- source_word: קֻמוּ
  choice: steht auf
  rationale: Der pluralische Imperativ von קום wird direkt wiedergegeben. „Steht auf“ ist modern und bewahrt den auffordernden Nachdruck.
- source_word: וְעִבְרוּ
  choice: und überquert
  rationale: עבר bezeichnet hier das Hinübergelangen von einer Seite zur anderen. „Überquert“ gibt die Bewegung prägnant wieder.
- source_word: לָכֶם
  choice: nicht gesondert wiedergegeben
  rationale: Der ethische Dativ verstärkt idiomatisch die Aufforderung, lässt sich hier aber nicht natürlich mit „für euch“ übersetzen; seine Wirkung ist im deutschen Imperativ mitenthalten.
- source_word: נַחַל
  choice: Wadi
  rationale: נחל kann ein Talbett beziehungsweise einen zeitweise wasserführenden Lauf bezeichnen. Im Wüstenkontext wahrt „Wadi“ diese geografische Breite besser als „Bach“.
- source_word: זָרֶד
  choice: Sered
  rationale: Der Ortsname wird nach geläufiger deutscher biblischer Umschrift mit S wiedergegeben.
- source_word: וַנַּעֲבֹר
  choice: Da überquerten wir
  rationale: Die Wayyiqtol-Form berichtet die anschließende Ausführung des Befehls. „Da“ kennzeichnet die zeitliche Folge natürlich, ohne eine stärkere Folgerungsbeziehung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „das Wadi Sered“ und „überqueren“ bleibt entsprechend der hebräischen Struktur erhalten.
