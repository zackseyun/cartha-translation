  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: de
  text: Heute überschreitest du die Grenze Moabs bei Ar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Grenze Moabs, nämlich Ar“. Im Hebräischen steht vor „Ar“ erneut der Akkusativmarker; daher kann „Ar“ die moabitische Grenzregion oder Stadt näher bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: du
  rationale: Das Personalpronomen der 2. Person maskulin Singular spricht Israel als kollektive Einheit an; die deutsche Singularform bewahrt diese Rhetorik.
- source_word: עֹבֵר
  choice: überschreitest
  rationale: Das prädikativ gebrauchte Qal-Partizip bezeichnet hier den unmittelbar gegenwärtigen Grenzübertritt. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die gewöhnliche temporale Bedeutung wird in modernem Deutsch knapp und idiomatisch mit „heute“ wiedergegeben.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im geografischen Zusammenhang bezeichnet das Wort die Grenze des moabitischen Gebiets.
- source_word: מוֹאָב
  choice: Moab
  rationale: Gebräuchliche deutsche Form des Orts- und Volksnamens.
- source_word: עָר
  choice: Ar
  rationale: Der Eigenname wird transliteriert; seine genaue syntaktische Beziehung zu „Grenze Moabs“ bleibt erklärungsbedürftig.
- source_word: אֶת ... אֶת
  choice: die Grenze Moabs bei Ar
  rationale: Die Wiederholung des Akkusativmarkers vor „Ar“ lässt eine appositionelle Deutung zu. „bei Ar“ ist im Haupttext geografisch verständlich, ohne die alternative Gleichsetzung auszuschließen.
theological_decisions:
- issue: Singularische Anrede Israels
  choice: „du“ ohne erläuternden Zusatz
  alternative: „ihr“ oder „du, Israel“
  rationale: Der hebräische Singular redet Israel als kollektive Einheit an. Die Wiedergabe mit „du“ erhält die Form und vermeidet eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Satzstellung mit „Heute“ bewahrt die zeitliche Hervorhebung; „überschreitest“ ist für das Überqueren einer Grenze idiomatisch.
