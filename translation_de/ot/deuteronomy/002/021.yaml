base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: de
  text: ein großes, zahlreiches und hochgewachsenes Volk wie die Anakim[a]. Yahweh vernichtete sie vor ihnen, und sie nahmen ihr Land in Besitz und wohnten an ihrer Stelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Anakiter“.'
    reason: Alternative deutsche Wiedergabe des Volksnamens עֲנָקִים.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב וָרָם
  choice: ein großes, zahlreiches und hochgewachsenes Volk
  rationale: 'Die Wiedergabe bewahrt den singularischen Kollektivbegriff עַם und unterscheidet die drei Beschreibungen: Größe beziehungsweise Bedeutung, Volkszahl und körperliche Größe. „Hochgewachsen“ bezeichnet in diesem Zusammenhang natürliche Körpergröße klarer als „hoch“ oder „erhaben“.'
- source_word: כָּעֲנָקִים
  choice: wie die Anakim
  rationale: Die Präposition כְּ drückt den Vergleich aus. Der Volksname wird als „Anakim“ transliteriert; die im Deutschen geläufigere Bildung „Anakiter“ wird in der Fußnote genannt.
- source_word: וַיַּשְׁמִידֵם
  choice: vernichtete sie
  rationale: Der Hifil von שׁמד bezeichnet hier die Beseitigung beziehungsweise Vernichtung des zuvor genannten Volkes. „Vernichtete“ ist kräftig, ohne über den Kontext hinaus eine technische Aussage über restlose Ausrottung zu machen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Die hebräische Wendung bezeichnet, dass Yahweh das frühere Volk vor den Nachkommen Esaus beseitigte. „Vor ihnen“ hält das räumliche Bild knapp und verständlich fest.
- source_word: וַיִּירָשֻׁם
  choice: und sie vertrieben sie
  rationale: ירשׁ bezeichnet in diesem Zusammenhang die Besitzergreifung durch Verdrängung der bisherigen Bewohner. „Vertrieben“ gibt die auf Personen bezogene Objektsendung natürlich wieder; der anschließende Satzteil macht die Übernahme ihres Wohngebiets deutlich.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: und wohnten an ihrer Stelle
  rationale: Die Formulierung bewahrt den Gedanken, dass die neuen Bewohner den Platz des früheren Volkes einnahmen, in natürlichem modernem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Transliteration „Yahweh“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Verhältnis von göttlichem Handeln und menschlicher Besitzergreifung
  choice: Yahweh vernichtete sie … und sie vertrieben sie
  alternative: Yahweh vernichtete sie, sodass sie deren Land einnehmen konnten
  rationale: Die koordinierte Satzfolge des Hebräischen wird beibehalten. Dadurch bleibt die Spannung zwischen Yahwehs vorausgehendem Handeln und dem Handeln der Nachkommen Esaus bestehen, ohne ein ausdrücklich kausales Verhältnis hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Pronomen folgen der knappen hebräischen Erzählweise; der Zusammenhang unterscheidet das vernichtete frühere Volk von den Nachkommen Esaus. Der Vers beginnt hier als Fortsetzung des Satzes aus Vers 20 mit einem Kleinbuchstaben.
