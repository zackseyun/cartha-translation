  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: de
  text: so wie die Söhne Esaus, die in Seïr wohnen, und die Moabiter, die in Ar wohnen, mit mir verfuhren[a], bis ich den Jordan überquere und in das Land komme, das Jahwe, unser Gott, uns gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für mich taten«; im Zusammenhang bezieht sich dies insbesondere auf Nahrung und Wasser, die sie verkauften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Leitet den Vergleich mit dem Verhalten der Bewohner von Seïr und Ar ein und schließt im Deutschen natürlich an den vorausgehenden Satz an.
- source_word: עָשׂוּ לִי
  choice: mit mir verfuhren
  rationale: Gibt die kontextbezogene Bedeutung der wörtlichen Wendung „für mich taten“ idiomatisch wieder, ohne das gewährte Durchzugs- und Versorgungsrecht ausdrücklich in den Text einzutragen.
- source_word: בְּנֵי עֵשָׂו
  choice: die Söhne Esaus
  rationale: Bewahrt die hebräische Verwandtschaftsbezeichnung und deren Darstellung der Edomiter als Nachkommen Esaus.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: die in Seïr wohnen
  rationale: Das Partizip von ישׁב bezeichnet hier den dauerhaften Wohnsitz; „wohnen“ ist gegenwärtiges, natürliches Deutsch.
- source_word: וְהַמּוֹאָבִים
  choice: und die Moabiter
  rationale: Direkte und im Deutschen übliche Wiedergabe des pluralischen Volksnamens.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: die in Ar wohnen
  rationale: Entspricht der parallelen Partizipialkonstruktion; Ar bleibt als Ortsname unübersetzt.
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: bis ich den Jordan überquere
  rationale: עבר mit dem Jordan als direktem Objekt bezeichnet das Überschreiten des Flusses; „überqueren“ ist präzise und idiomatisch.
- source_word: אֶל הָאָרֶץ
  choice: und in das Land komme
  rationale: Macht das Ziel der Jordanüberquerung im Deutschen klar und gibt אֶל als Bewegung in das Land hinein wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die etablierte deutsche Form.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Direkte Wiedergabe der possessiven Bundesbezeichnung.
- source_word: נֹתֵן לָנוּ
  choice: uns gibt
  rationale: Das Partizip stellt die Gabe als gegenwärtig und gewiss dar; das deutsche Präsens bewahrt diesen Aspekt natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt dies, während „der HERR“ den Namen durch einen Titel ersetzen würde.
- issue: Konkreter Sinn von עָשׂוּ לִי
  choice: mit mir verfuhren
  alternative: für mich taten
  rationale: Der Zusammenhang legt gewährten Durchzug und Versorgung nahe, doch die hebräische Formulierung benennt diese Einzelheiten hier nicht ausdrücklich. Die gewählte Fassung bleibt idiomatisch und lässt den Kontext den konkreten Bezug bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „die … wohnen“ erhält den Parallelismus des Hebräischen; „Söhne Esaus“ bewahrt die verwandtschaftliche Ausdrucksweise. Der Vers ist syntaktisch als Fortsetzung des vorausgehenden Satzes formuliert.
