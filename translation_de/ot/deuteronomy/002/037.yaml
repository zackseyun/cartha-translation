  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: de
  text: 'Nur dem Land der Ammoniter[a] bist du nicht nahe gekommen: keinem Gebiet am Jabbok[b], keinen Städten im Bergland und nichts von dem, was Jahwe, unser Gott, geboten hatte.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dem Land der Söhne Ammons«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »der ganzen Seite des Baches Jabbok«. Gemeint ist das Ufer oder das Gebiet entlang des Jabbok.'
    reason: cultural_note
  - marker: c
    text: Die hebräische Formulierung ist verkürzt und lässt das genaue Bezugswort unausgesprochen. Im Zusammenhang kann sie sich auf Gebiete oder andere Dinge beziehen, die Jahwe angewiesen hatte; möglicherweise sind dabei Gebiete gemeint, deren Betreten Israel untersagt war.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Ausnahme gegenüber der zuvor zusammengefassten Eroberung und entspricht der knappen hebräischen Formulierung.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: dem Land der Ammoniter
  rationale: Gibt die Bedeutung der wörtlichen Wendung »Land der Söhne Ammons« in natürlichem modernem Deutsch wieder.
- source_word: לֹא קָרָבְתָּ
  choice: kamst du nicht nahe
  rationale: Bewahrt den räumlichen Sinn von קרב, ohne die Aussage ausdrücklich als militärischen Angriff auszulegen.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: keinem Gebiet am Jabbok
  rationale: Die Konstruktion mit יַד bezeichnet hier die Seite, das Ufer oder das angrenzende Gebiet des Wasserlaufs; im negierten Satz gibt »keinem Gebiet« den umfassenden Sinn von כָּל idiomatisch wieder.
- source_word: וְעָרֵי הָהָר
  choice: nicht den Städten im Bergland
  rationale: הָהָר bezeichnet hier wahrscheinlich eine gebirgige Hochlandregion und nicht einen einzelnen Berg.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: und auch nicht allem, was … geboten hatte
  rationale: Bewahrt die Ellipse und die semantische Offenheit des Hebräischen. Der Zusammenhang legt verbotene beziehungsweise ausgenommene Gebiete nahe, doch das Verb צוה bedeutet zunächst »gebieten/anweisen«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Direkte und natürliche Wiedergabe der possessiven Bundesbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; »Jahwe« bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Bedeutung der elliptischen Schlusswendung וְכֹל אֲשֶׁר צִוָּה
  choice: was Jahwe, unser Gott, geboten hatte
  alternative: was Jahwe, unser Gott, uns verboten hatte
  rationale: Der Kontext kann auf Gebiete weisen, denen Israel auf Gottes Anweisung nicht nahekommen durfte. Da das Hebräische jedoch ausdrücklich »geboten/angewiesen« sagt und das Objekt unausgesprochen bleibt, wird die Spannung im Text bewahrt und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Negation gliedert die geografische Aufzählung natürlich. »Ammoniter« ist idiomatischer als die wörtliche Abstammungsformel; die Ausgangsform wird in der Fußnote dokumentiert. Die elliptische Schlusswendung bleibt bewusst offen.
