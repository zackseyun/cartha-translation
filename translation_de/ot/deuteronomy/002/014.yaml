source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: de
  text: Die Zeit, die wir von Kadesch-Barnea unterwegs waren, bis wir den Bach Sered[a] überschritten, betrug achtunddreißig Jahre, bis die ganze Generation der wehrfähigen Männer aus der Mitte des Lagers verschwunden war, wie Jahwe ihnen geschworen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wadi Sered«. Das hebräische Wort kann einen Bach, ein Wadi oder ein zeitweise trockenes Bachbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Die Zeit
  rationale: Wörtlich steht »die Tage«; im Zusammenhang bezeichnet die Wendung jedoch die Dauer des Weges. »Die Zeit« gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: הָלַכְנוּ
  choice: wir ... unterwegs waren
  rationale: הלך bezeichnet hier das Unterwegssein auf einer längeren Wanderung; die Formulierung ist idiomatisch und wahrt den Reisecharakter.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: von Kadesch-Barnea
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: bis wir ... überschritten
  rationale: עבר bezeichnet bei einem Wasserlauf oder Talgrund das Überschreiten.
- source_word: נַחַל זֶרֶד
  choice: den Seredbach
  rationale: נחל kann einen Bach, ein Wadi oder dessen Talbett bezeichnen. »Seredbach« ist eine verständliche deutsche Wiedergabe; die geografische Alternative wird in der Fußnote bewahrt.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: achtunddreißig Jahre
  rationale: Natürliche deutsche Wiedergabe der hebräischen Zahlform.
- source_word: עַד תֹּם
  choice: Bis dahin war ... verschwunden
  rationale: Die Wendung bezeichnet das vollständige Ende der betreffenden Generation. »Verschwunden« gibt im Kontext ihr Ausscheiden durch Tod wieder, ohne die Todesart näher festzulegen.
- source_word: כָּל הַדּוֹר
  choice: die ganze Generation
  rationale: Entspricht dem kollektiven Sinn der hebräischen Wendung.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: der kriegstüchtigen Männer
  rationale: Die Wendung meint ausdrücklich die zum Krieg gehörenden beziehungsweise kampffähigen Männer; »kriegstüchtig« ist im Kontext präziser und natürlicher als das wörtliche »Männer des Krieges«.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: aus dem Lager
  rationale: Die räumliche Wendung »aus der Mitte des Lagers« wird idiomatisch verkürzt, ohne ihren Sinn zu verändern.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: wie Jahwe es ihnen geschworen hatte
  rationale: Die ausdrückliche Eidessprache und die Vorzeitigkeit gegenüber dem berichteten Zeitraum bleiben erhalten; das Pronomen »es« macht den deutschen Satz flüssig, ohne den Inhalt des Schwurs zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Bedeutung von אַנְשֵׁי הַמִּלְחָמָה
  choice: kriegstüchtige Männer
  alternative: Kriegsleute
  rationale: Das Hebräische bezeichnet ausdrücklich Männer und bezieht sich im Zusammenhang auf die militärisch erfasste männliche Generation; diese Eingrenzung wird nicht neutralisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Ortsnamen folgen geläufiger deutscher Bibelumschrift; der Gottesname wird als »Jahwe« wiedergegeben.
