  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: de
  text: Nahrung sollt ihr von ihnen für Silber kaufen, damit ihr essen könnt[a]; auch Wasser sollt ihr von ihnen für Silber kaufen, damit ihr trinken könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und ihr werdet essen«; entsprechend am Versende: »und ihr werdet trinken«. Die hebräische Verbfolge kann rein koordinierend wiedergegeben werden, bezeichnet hier aber wahrscheinlich die beabsichtigte Folge des Kaufs.'
    reason: Bewahrt die syntaktische Mehrdeutigkeit zwischen einfacher Koordination und beabsichtigter Folge, ohne die nachfolgenden hebräischen Verbformen fälschlich als weitere Sollensformen wiederzugeben.
lexical_decisions:
- source_word: אֹכֶל
  choice: Nahrung
  rationale: Der allgemeine Ausdruck bezeichnet Essbares beziehungsweise Lebensmittel und ist hier nicht auf Getreide beschränkt.
- source_word: תִּשְׁבְּרוּ
  choice: sollt ihr … kaufen
  rationale: שׁבר bedeutet in diesem Zusammenhang, Nahrung gegen Bezahlung zu erwerben.
- source_word: מֵאִתָּם
  choice: von ihnen
  rationale: 'Die Präposition bezeichnet die Herkunft: Israel soll die Versorgungsgüter von den Bewohnern des Landes beziehen.'
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: Die Wiedergabe bewahrt den konkreten hebräischen Ausdruck für das Zahlungsmittel; „für Geld“ wäre idiomatischer, aber weniger formnah.
- source_word: וַאֲכַלְתֶּם
  choice: damit ihr essen könnt
  rationale: Die Verbfolge bezeichnet im Anweisungskontext naheliegend die beabsichtigte Folge des Kaufs. Eine Fußnote bewahrt die formal koordinierende Lesart.
- source_word: וְגַם
  choice: auch
  rationale: Das Wort leitet die parallele zusätzliche Anweisung zum Wasser ein.
- source_word: מַיִם
  choice: Wasser
  rationale: Direkte und eindeutige lexikalische Entsprechung.
- source_word: תִּכְרוּ
  choice: sollt ihr … kaufen
  rationale: Obwohl כרה andernorts „graben“ bedeuten kann, verlangt die Parallele zum Nahrungskauf samt Herkunfts- und Preisangabe hier die Bedeutung „kaufen/erwerben“.
- source_word: וּשְׁתִיתֶם
  choice: damit ihr trinken könnt
  rationale: Parallel zu וַאֲכַלְתֶּם wird die beabsichtigte Folge des Erwerbs ausgedrückt; die formnähere Koordination bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Ethisch-rechtliche Stoßrichtung des Gebots hinsichtlich der Güter Edoms
  choice: Israel soll Nahrung und Wasser gegen Bezahlung erwerben, statt sie entschädigungslos an sich zu nehmen.
  alternative: 'Eine streng formale Wiedergabe könnte die Folgebeziehung offenlassen: „und ihr sollt essen … und ihr sollt trinken“.'
  rationale: Die Angaben „von ihnen“ und „für Silber“ sichern den rechtmäßigen Erwerb. Die Finalsätze geben die im Anweisungskontext naheliegende beabsichtigte Folge wieder, ohne den Gedanken des Bezahlens abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nahrung“ ist breit verständlich; „für Silber“ erhält bewusst die konkrete Ausdrucksweise des Hebräischen. Die parallele Satzstruktur des Ausgangstextes bleibt erhalten.
