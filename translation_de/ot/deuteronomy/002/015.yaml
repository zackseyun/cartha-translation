base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: de
  text: Auch war Jahwes Hand gegen sie, um sie im Lager in Verwirrung zu stürzen[a], bis sie völlig aufgerieben waren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie in Schrecken zu versetzen“ oder „sie in die Flucht zu schlagen“. Das hebräische Verb kann Panik, Verwirrung oder Zerrüttung als göttliches Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis sie zugrunde gegangen waren“ oder „bis sie zu Ende waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die anknüpfende und zugleich verstärkende Funktion der Wendung in natürlichem Deutsch wieder.
- source_word: יַד יְהוָה
  choice: Jahwes Hand
  rationale: Bewahrt das hebräische Bild für Gottes wirksame Macht und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: בָם
  choice: gegen sie
  rationale: Im Zusammenhang mit „Jahwes Hand“ bezeichnet die Präposition hier ein feindlich gegen die Betroffenen gerichtetes Handeln.
- source_word: לְהֻמָּם
  choice: um sie in Verwirrung zu stürzen
  rationale: Das Verb המם kann das Auslösen von Schrecken, Verwirrung oder Zusammenbruch bezeichnen. Die Formulierung bewahrt diesen Vorgang, ohne ihn vorschnell nur als Tötung wiederzugeben.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: aus der Mitte des Lagers hinwegzuraffen
  rationale: „Aus der Mitte des Lagers“ erhält das konkrete hebräische Bild; „hinwegzuraffen“ macht deutlich, dass die Betroffenen durch das Gericht aus der Gemeinschaft beseitigt wurden.
- source_word: עַד תֻּמָּם
  choice: bis sie alle umgekommen waren
  rationale: Gibt das vollständige Ende der betreffenden Generation klar wieder, ohne die genaue Art ihres Todes weiter festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlichem Handeln und dem Ende der Generation
  choice: Jahwes Hand wirkt gegen sie und führt zu ihrem vollständigen Ende
  alternative: Ihr Ende lediglich als natürliche Folge der Zeit darstellen
  rationale: Der Satz schreibt den Vorgang ausdrücklich Jahwes gegen sie gerichteter Hand zu; die Übersetzung erhält diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildrede „Jahwes Hand“ bleibt erhalten; die etwas erklärende Verbindung von Verwirrung und Hinwegraffen macht sowohl den Vorgang als auch dessen Ergebnis verständlich.
