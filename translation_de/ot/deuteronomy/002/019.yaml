  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: de
  text: Wenn du dich den Ammonitern[a] gegenüber näherst, bedränge sie nicht[b] und lass dich nicht auf einen Kampf mit ihnen ein. Denn ich werde dir nichts vom Land der Ammoniter als Besitz[c] geben, weil ich es den Nachkommen Lots als Besitz gegeben habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: den Söhnen Ammons; ebenso im weiteren Verlauf des Verses.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Greif sie nicht an. Das hebräische Verb kann feindliches Vorgehen allgemein bezeichnen und muss nicht auf eine Belagerung beschränkt sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: als Erbbesitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Wenn du in die Nähe … kommst
  rationale: קָרַב bezeichnet die Annäherung, מוּל die räumliche Lage gegenüber bzw. vor einem Gegenüber. Die Formulierung gibt die Annäherung idiomatisch wieder, ohne ein Betreten des ammonitischen Gebiets vorauszusetzen.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Bei einer Volksbezeichnung ist „Ammoniter“ im modernen Deutschen natürlicher als das wörtliche „Söhne Ammons“. Die zugrunde liegende Abstammungsbezeichnung bleibt in einer Fußnote sichtbar.
- source_word: אַל תְּצֻרֵם
  choice: bedränge sie nicht
  rationale: Das Verb bezeichnet hier feindseligen Druck oder feindliches Vorgehen und ist nicht sicher auf eine förmliche Belagerung beschränkt. „Bedrängen“ bewahrt diese Bedeutungsbreite.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: und fang keinen Kampf mit ihnen an
  rationale: Der Hitpael von גרה bezeichnet das Sich-Einlassen auf bzw. Anfachen einer feindlichen Auseinandersetzung. Die Wiedergabe macht den militärischen Kontext verständlich, ohne ein im Hebräischen nicht vorhandenes Wort für „Krieg“ einzufügen.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: nichts vom Land der Ammoniter
  rationale: Unter der Verneinung drückt מִן aus, dass kein Teil ihres Landes gegeben wird. „Nichts vom Land“ gibt diesen partitiven Sinn natürlich wieder.
- source_word: יְרֻשָּׁה
  choice: als Besitz
  rationale: יְרֻשָּׁה kann einen erblich zugewiesenen Landbesitz bzw. ein Erbteil bezeichnen. „Besitz“ passt zum territorialen Zusammenhang, während „Erbbesitz“ als Alternative vermerkt wird.
- source_word: לִבְנֵי לוֹט
  choice: den Nachkommen Lots
  rationale: Gemeint ist die von Lot abstammende Volksgruppe, nicht nur seine unmittelbaren Söhne. „Nachkommen Lots“ macht den genealogischen Bezug im Deutschen klar.
- source_word: נְתַתִּיהָ
  choice: ich es … gegeben habe
  rationale: Das Perfekt bezeichnet eine vollzogene göttliche Zuweisung, deren Geltung fortbesteht; das deutsche Perfekt bringt dies passend zum Ausdruck.
theological_decisions:
- issue: Göttliche Zuweisung des Landes an die Nachkommen Lots
  choice: „weil ich es den Nachkommen Lots als Besitz gegeben habe“
  alternative: „denn den Söhnen Lots habe ich es zum Erbteil gegeben“
  rationale: Die Übersetzung wahrt die Aussage, dass Israels Anspruch durch eine bereits erfolgte göttliche Landzuweisung begrenzt wird, ohne die genaue rechtliche oder theologische Art von יְרֻשָּׁה über „Besitz“ hinaus festzulegen.
- issue: Wiedergabe der Abstammungsbezeichnungen בְּנֵי עַמּוֹן und בְּנֵי לוֹט
  choice: „Ammoniter“ und „Nachkommen Lots“
  alternative: „Söhne Ammons“ und „Söhne Lots“
  rationale: Die idiomatischen deutschen Bezeichnungen machen die Volks- und Abstammungsbezüge verständlich. Die Fußnote bewahrt beim ersten Ausdruck die formale Nähe zum Hebräischen.
