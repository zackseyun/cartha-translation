  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: de
  text: Die Emiter lebten früher dort, ein großes und zahlreiches Volk, hochgewachsen wie die Anakiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵמִים
  choice: die Emiter
  rationale: Das Volksname wird in der im Deutschen üblichen Form mit der Endung „-iter“ wiedergegeben.
- source_word: לְפָנִים
  choice: früher
  rationale: Die Wendung ist hier zeitlich gemeint; „früher“ ist knapp, natürlich und eindeutig.
- source_word: יָשְׁבוּ בָהּ
  choice: lebten dort
  rationale: ישׁב mit ב bezeichnet hier den Wohnsitz; „dort leben“ gibt den Bezug auf das zuvor genannte Gebiet idiomatisch wieder.
- source_word: עַם
  choice: ein … Volk
  rationale: עם bezeichnet hier eine ethnische Volksgruppe und bleibt als kollektiver Singular erhalten.
- source_word: גָּדוֹל
  choice: großes
  rationale: „Groß“ bewahrt die allgemeine Aussage über Größe und Bedeutung, während die folgenden Adjektive Zahl und Körperhöhe näher bestimmen.
- source_word: וְרַב
  choice: zahlreiches
  rationale: רב beschreibt hier die große Zahl der Angehörigen des Volkes.
- source_word: וָרָם
  choice: hochgewachsen
  rationale: Im Vergleich mit den Anakitern bezeichnet רם die außergewöhnliche Körperhöhe; „hochgewachsen“ ist im Deutschen natürlicher als „hoch“.
- source_word: כָּעֲנָקִים
  choice: wie die Anakiter
  rationale: Das Präfix כ markiert einen Vergleich; der Volksname wird in konventioneller deutscher Form wiedergegeben.
