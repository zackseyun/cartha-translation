- from: Auch sie galten als Refaïter[a], ebenso wie die Anakiter; die Moabiter aber nennen sie Emiter.
  to: Auch sie galten als Refaïm[a], ebenso wie die Anakiter; die Moabiter aber nennen sie Emiter.
  rationale: Nur die Wiedergabe von רְפָאִים wird zu „Refaïm“ korrigiert, damit der überlieferte Gruppenname erhalten bleibt und die Übersetzung nicht ohne Grundlage eine deutsche Ableitungsform schafft. Die Fußnote wird entsprechend präzisiert. Die übrige Satzgestaltung gibt Sinn, Vergleich und moabitische Namengebung zuverlässig wieder.
