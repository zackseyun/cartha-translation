review_pass:
  verdict: revise
  source_fidelity: 'Der Satzbau und die Beziehungen sind im Entwurf grundsätzlich zutreffend: אַף הֵם wird mit „Auch sie“ erfasst, יֵחָשְׁבוּ mit „galten als“, der Vergleich zu den Anakim bleibt erhalten, und die moabitische Benennung wird korrekt wiedergegeben. Die Wiedergabe von רְפָאִים als „Refaïter“ ersetzt jedoch den im Hebräischen vorliegenden und im Deutschen etablierten Gruppennamen durch eine unnötige deutsche Neubildung.'
  naturalness: „Auch sie galten als Refaïm, ebenso wie die Anakiter; die Moabiter aber nennen sie Emiter“ ist modernes, klares Standarddeutsch mit angemessen sachlichem Bibelregister. Die Beibehaltung von „Refaïm“ ist zugleich natürlicher für eine bibelsprachliche Personen- bzw. Gruppenbezeichnung als die künstlich wirkende Form „Refaïter“.
  terminology: רְפָאִים sollte als „Refaïm“ transliteriert werden, entsprechend der Quellsprache und der englischen Audit-Entscheidung, die den Namen nicht interpretierend als „Riesen“ wiedergibt. „Anakiter“ und „Emiter“ sind als eingedeutschte Volksnamen vertretbar. Die Fußnote muss deutlich machen, dass „Riesen“ eine mögliche Deutung bzw. Wiedergabe ist, während der hebräische Ausdruck hier am ehesten ein alter Gruppenname ist.
  issues:
