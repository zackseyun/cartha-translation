  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: de
  text: Auch sie galten als Refaïm[a], ebenso wie die Anakiter; die Moabiter aber nennen sie Emiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Riesen« für »Refaïm«; das Hebräische bewahrt hier jedoch am ehesten den Namen einer alten Volksgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: Refaïter
  rationale: Als Bezeichnung einer alten Volksgruppe wiedergegeben, nicht deutend mit »Riesen«. Die deutsche Form mit der Endung »-iter« entspricht den benachbarten Volksnamen und bleibt als Eigenbezeichnung erkennbar.
- source_word: יֵחָשְׁבוּ
  choice: galten als
  rationale: Das Niphal bezeichnet hier die Zuordnung zu einer Gruppe. »Galten als« gibt den passiven Sinn natürlich und knapp wieder.
- source_word: אַף הֵם
  choice: auch sie
  rationale: 'Bewahrt die hervorhebende Einbeziehung: Diese Gruppe wurde ebenfalls so eingeordnet.'
- source_word: כָּעֲנָקִים
  choice: ebenso wie die Anakiter
  rationale: Das Präfix כ markiert den Vergleich. »Ebenso wie« verdeutlicht, dass auch die Anakiter als Refaïter galten, ohne beide Namen gleichzusetzen.
- source_word: וְהַמֹּאָבִים
  choice: die Moabiter aber
  rationale: Das Waw leitet hier den Kontrast zwischen allgemeiner Einordnung und moabitischer Benennung ein; die Nachstellung von »aber« ist idiomatisches, würdevolles Deutsch.
- source_word: יִקְרְאוּ לָהֶם
  choice: nennen sie
  rationale: קרא ל bezeichnet hier die Benennung. Das Präsens folgt der hebräischen Verbform und stellt den moabitischen Sprachgebrauch dar.
- source_word: אֵמִים
  choice: Emiter
  rationale: Als Volksname transliteriert und im Deutschen parallel zu »Moabiter« und »Anakiter« gebildet. Kein Artikel wird unmittelbar in den Namen aufgenommen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Ethnonyme werden in geläufigen eingedeutschten Formen auf »-iter« wiedergegeben; die mögliche Deutung von רְפָאִים als »Riesen« bleibt in der Fußnote erhalten.
