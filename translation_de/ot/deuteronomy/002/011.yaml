    issue: „Refaïter“ statt „Refaïm“
    rationale: Das Hebräische bietet den Eigennamen רְפָאִים. „Refaïter“ ist keine erforderliche Übersetzung, sondern eine sekundäre Umformung nach dem Muster anderer Ethnonyme. „Refaïm“ wahrt die quellsprichliche Benennung und die beabsichtigte Unterscheidung von der interpretierenden Wiedergabe „Riesen“.
  revised_text: Auch sie galten als Refaïm[a], ebenso wie die Anakiter; die Moabiter aber nennen sie Emiter.
