    issue: „im Gebirge Seïr“ ergänzt „Gebirge“.
    rationale: Der hebräische Text hat lediglich „in Seïr“. Obwohl Seïr geografisch ein Bergland bezeichnen kann, ist die Ergänzung hier nicht erforderlich und enger als die Vorlage.
  - severity: high
    issue: „auf dem Weg zur Wüste Moabs“ gibt die zweite Reiseangabe unzutreffend als Zielrichtung wieder.
    rationale: דֶּרֶךְ מִדְבַּר מוֹאָב bezeichnet den Weg der/durch die Wüste Moabs, nicht ausdrücklich einen Weg, der zu ihr führt. Die vorhandene Fußnote behauptet zudem eine Mehrdeutigkeit, die durch die Haupttextwahl erst erzeugt wird.
  revised_text: Da zogen wir weiter, weg von unseren Brüdern, den Söhnen Esaus, die in Seïr wohnen, weg von der Straße der Araba, von Elat und von Ezjon-Geber. Dann wandten wir uns und zogen auf dem Weg durch die Wüste Moabs weiter.
