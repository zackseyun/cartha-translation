  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: de
  text: Da zogen wir weiter, weg von unseren Brüdern, den Söhnen Esaus, die in Seïr wohnen, weg von der Straße der Araba, von Elat und von Ezjon-Geber. Dann wandten wir uns und zogen auf dem Weg durch die Wüste Moabs weiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: zogen wir weiter, weg von
  rationale: עבר bezeichnet hier das Weiterziehen an den Edomitern vorbei beziehungsweise von ihnen weg; die Formulierung gibt sowohl den Reiseverlauf als auch die Präposition מֵאֵת natürlich wieder.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: unseren Brüdern, den Söhnen Esaus
  rationale: Die wörtliche Verwandtschaftssprache bleibt erhalten und macht die im Hebräischen betonte Nähe zwischen Israel und Edom sichtbar.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: die im Gebirge Seïr wohnen
  rationale: ישב bezeichnet hier dauerhaften Wohnsitz. Seïr ist in diesem Zusammenhang das Bergland; „Gebirge Seïr“ ist eine geläufige und geografisch klare deutsche Wiedergabe.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: weg von der Straße durch die Araba
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Straße. Die Wendung kann syntaktisch zum Weiterziehen gehören; „durch die Araba“ kennzeichnet die Route, ohne Araba bloß als allgemeine Ebene zu übersetzen.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: von Elat und Ezjon-Geber
  rationale: Die Ortsnamen werden in einer im Deutschen üblichen biblischen Form wiedergegeben; die wiederholte Präposition markiert den Ausgangsbereich der Reise.
- source_word: וַנֵּפֶן
  choice: Dann wandten wir uns
  rationale: פנה zeigt einen Richtungswechsel an; „sich wenden“ ist präzise, würdig und gegenwärtig verständlich.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: und zogen auf dem Weg zur Wüste Moabs weiter
  rationale: Die erneute Form von עבר wird als Fortsetzung der Reise erkennbar. Die Constructusverbindung kann den Weg zur beziehungsweise durch die Wüste Moabs bezeichnen; diese Mehrdeutigkeit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Verwandtschaftsbezeichnung für die Edomiter
  choice: unseren Brüdern, den Söhnen Esaus
  alternative: unseren Verwandten, den Nachkommen Esaus
  rationale: „Brüder“ bewahrt die ausdrückliche hebräische Verwandtschaftsbezeichnung und die geschichtliche Spannung zwischen Israel und Edom, ohne sie zu verallgemeinern.
- issue: Bestimmung der Reiseroute
  choice: weg von der Straße durch die Araba, von Elat und Ezjon-Geber
  alternative: an unseren Brüdern vorbei … auf der Straße der Araba von Elat und Ezjon-Geber
  rationale: Die hebräische Abfolge lässt einen gewissen Spielraum bei der Zuordnung der Präpositionalgruppen. Der Haupttext folgt der naheliegenden Bewegungsrichtung, während die Fußnote die alternative Verknüpfung offenhält.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung des Weiterziehens bildet die hebräische Reiseerzählung ab. „Brüder“ und „Söhne Esaus“ bleiben bewusst wörtlich; geografische Namen werden in geläufiger deutscher Bibelschreibung verwendet.
