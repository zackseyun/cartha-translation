base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: de
  text: An diesem Tag werde ich beginnen, Furcht und Schrecken vor dir über die Völker unter dem ganzen Himmel kommen zu lassen, die die Kunde von dir hören werden[a]. Sie werden vor dir zittern und sich winden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von deinem Ruf hören“ beziehungsweise „Nachricht von dir hören“. Der hebräische Ausdruck kann sowohl eine Nachricht als auch den dadurch entstehenden Ruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Angst geraten“ beziehungsweise „sich wie eine Gebärende winden“. Das hebräische Verb bezeichnet heftige körperliche Qual und kann an Geburtswehen erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: An diesem Tag
  rationale: Gibt die hervorgehobene Zeitangabe idiomatisch und würdig wieder.
- source_word: אָחֵל תֵּת
  choice: werde ich beginnen, … zu bringen
  rationale: Bewahrt den Beginn-Aspekt der Verbindung aus Hiphil von חלל und Infinitiv von נתן; „bringen“ ist mit Furcht und Schrecken natürliches Deutsch.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: Furcht und Schrecken vor dir
  rationale: Die beiden parallelen Angstbegriffe bleiben unterscheidbar; „vor dir“ macht deutlich, dass Israel Gegenstand und Ursache der Angst ist.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: über die Völker
  rationale: Das hebräische Idiom wird in natürlichem Deutsch als ein über die Völker kommender Zustand ausgedrückt, ohne die unidiomatische Wendung „auf das Angesicht“ zu übernehmen.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: unter dem ganzen Himmel
  rationale: Entspricht dem etablierten deutschen Ausdruck und gibt den umfassenden Geltungsbereich wieder.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Wenn sie die Kunde von dir hören
  rationale: שֵׁמַע kann Kunde, Nachricht oder Ruf bezeichnen. „Kunde von dir“ wahrt diese Bedeutungsbreite; das relative אֲשֶׁר wird hier sinngemäß temporal-konditional angeschlossen.
- source_word: וְרָגְזוּ
  choice: werden sie … zittern
  rationale: Gibt das durch Angst ausgelöste Beben in geläufigem Deutsch wieder.
- source_word: וְחָלוּ
  choice: und sich winden
  rationale: Bewahrt das intensive körperliche Bild des Verbs, ohne die mögliche Geburtsmetapher im Haupttext festzulegen.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Gibt die Reaktion auf Israels Gegenwart knapp und idiomatisch wieder; zugleich bleibt die räumlich-kausale Spannung der Präposition erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortpaarung „Furcht und Schrecken“ bewahrt die zwei parallelen hebräischen Angstbegriffe; die Fußnoten erhalten die lexikalische Offenheit von שִׁמְעֲךָ und וְחָלוּ.
