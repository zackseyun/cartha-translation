source:
  edition: WLC
  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: de
  text: Und die Awwiter[a], die in Siedlungen bis nach Gaza wohnten, wurden von den Kaftoritern, die aus Kaftor kamen, vernichtet; diese ließen sich an ihrer Stelle nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Awwim.'
    reason: Alternative Wiedergabe des hebräischen Volksnamens עַוִּים als engere Umschrift statt der eingedeutschten Form „Awwiter“.
lexical_decisions:
- source_word: הָעַוִּים
  choice: die Awwiter
  rationale: Deutsche Form des Volksnamens; sie ist verständlicher und in deutschen Bibelübersetzungen geläufiger als eine rein formale Umschrift.
- source_word: הַיֹּשְׁבִים
  choice: die ... wohnten
  rationale: ישב bezeichnet hier den dauerhaften Aufenthalt; „wohnten“ ist natürlich und sachlich.
- source_word: בַּחֲצֵרִים
  choice: in Siedlungen
  rationale: חֲצֵרִים kann Dörfer, Weiler oder umfriedete Wohnplätze bezeichnen. „Siedlungen“ erhält die begriffliche Weite.
- source_word: עַד עַזָּה
  choice: bis nach Gaza
  rationale: Gibt die räumliche Ausdehnung idiomatisch wieder, ohne Gaza zwingend als eingeschlossenen Endpunkt festzulegen.
- source_word: כַּפְתֹּרִים
  choice: die Kaftoriter
  rationale: Deutsche, vom Ortsnamen Kaftor abgeleitete Bezeichnung der Volksgruppe.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: die aus Kaftor kamen
  rationale: Gibt die Herkunftsbewegung von יצא in natürlichem modernem Deutsch wieder.
- source_word: הִשְׁמִידֻם
  choice: wurden ... vernichtet
  rationale: Die aktive Bedeutung des Hifil von שׁמד bleibt in einer natürlichen deutschen Passivkonstruktion erhalten; das Verb bezeichnet vollständige gewaltsame Beseitigung.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: diese ließen sich an ihrer Stelle nieder
  rationale: Die Formulierung drückt sowohl die Ansiedlung als auch die Ablösung der früheren Bewohner aus; „diese“ beseitigt eine mögliche Unklarheit über das Subjekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, wird aber durch Passiv und anschließendes „diese“ übersichtlich gehalten. „Siedlungen“ bewahrt die Bedeutungsbreite von חֲצֵרִים.
