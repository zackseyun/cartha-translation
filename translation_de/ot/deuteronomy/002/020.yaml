  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: de
  text: Auch dies gilt als ein Land der Refaiter[a]. Früher lebten Refaiter[b] darin; die Ammoniter aber nennen sie Samsummiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land der Refaiter“.'
    reason: lexical_alternative
  - marker: b
    text: „Refaiter“ kann ein altes Volk bezeichnen, das traditionell mit außergewöhnlicher Körpergröße in Verbindung gebracht wird; manche Übersetzungen geben den Ausdruck hier mit „Riesen“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: ein Land der Refaïter
  rationale: אֶרֶץ bezeichnet ein Land oder Gebiet. Die artikellose Verbindung wird hier natürlich und ihrem erklärenden Zusammenhang entsprechend unbestimmt wiedergegeben; der Volksname bleibt als solcher erkennbar.
- source_word: תֵּחָשֵׁב
  choice: gilt als
  rationale: Der Niphal von חשׁב bedeutet hier, dass etwas als etwas angesehen oder gerechnet wird. „Gilt als“ ist im modernen Deutschen knapp und idiomatisch.
- source_word: אַף הִוא
  choice: Auch dieses
  rationale: Die Wendung ordnet das zuvor erwähnte Gebiet ebenfalls den Ländern der Refaïter zu. Das sächliche Demonstrativpronomen nimmt „Land“ auf.
- source_word: רְפָאִים
  choice: Refaïter
  rationale: Der Ausdruck fungiert im Zusammenhang als Volksname und wird daher nicht deutend mit „Riesen“ übersetzt. Die deutsche Form „Refaïter“ macht die Zugehörigkeit zu einer Volksgruppe deutlich.
- source_word: יָשְׁבוּ בָהּ
  choice: lebten … darin
  rationale: ישׁב bedeutet hier wohnen oder leben; „lebten darin“ ist natürliches, gegenwärtiges Deutsch.
- source_word: לְפָנִים
  choice: Früher
  rationale: Das Adverb verweist auf eine vergangene Zeit; „früher“ gibt dies klar und knapp wieder.
- source_word: וְהָעַמֹּנִים
  choice: die Ammoniter aber
  rationale: Das Waw leitet den Wechsel von der allgemeinen Bezeichnung zur ammonitischen Benennung ein. Das nachgestellte „aber“ macht diesen Kontrast im Deutschen deutlich, ohne einen stärkeren Gegensatz einzuführen.
- source_word: יִקְרְאוּ לָהֶם
  choice: nennen sie
  rationale: Das Imperfekt beschreibt hier die übliche Bezeichnung. Das deutsche Präsens bewahrt diesen durativen beziehungsweise gebräuchlichen Sinn.
- source_word: זַמְזֻמִּים
  choice: Samsummiter
  rationale: Der Volksname wird in einer im Deutschen gut aussprechbaren, an etablierten biblischen Namensformen orientierten Form wiedergegeben und nicht übersetzt.
theological_decisions:
- issue: Deutung von רְפָאִים als „Riesen“ oder als Volksname
  choice: Refaïter
  alternative: Riesen
  rationale: Der unmittelbare Kontext behandelt רְפָאִים als ethnische Bezeichnung und stellt ihr den ammonitischen Namen „Samsummiter“ gegenüber. Die Transliteration vermeidet es, eine traditionelle Deutung ihrer Körpergröße in den Haupttext einzutragen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den erklärenden Charakter des Verses fest; die überlieferten Volksnamen bleiben transparent, während die mögliche Deutung „Riesen“ nicht in den Haupttext vorverlegt wird.
