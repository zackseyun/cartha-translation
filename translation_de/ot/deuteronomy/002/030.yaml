base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: de
  text: Doch Sihon, der König von Heschbon, war nicht bereit, uns durch sein Land ziehen zu lassen, denn Jahwe, dein Gott, hatte seinen Geist verhärtet und sein Herz unnachgiebig gemacht,[a] um ihn in deine Hand zu geben, wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sein Herz stark gemacht«. Das hebräische Verb kann »stärken« oder »fest machen« bedeuten; im Zusammenhang bezeichnet es wahrscheinlich, dass Sihons Herz unnachgiebig und widerständig wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: war nicht bereit
  rationale: Gibt die innere Bereitschaft beziehungsweise Zustimmung wieder und bleibt in modernem Deutsch natürlich.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: uns durch sein Land ziehen zu lassen
  rationale: Der Hifil von עבר bezeichnet hier das Durchziehenlassen; בּוֹ bezieht sich im Kontext auf Sihons Herrschaftsgebiet, nicht auf seine Person.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: hatte seinen Geist verhärtet
  rationale: Bewahrt sowohl die Kausativbedeutung von קשׁה als auch den ausdrücklich genannten anthropologischen Begriff רוּחַ.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: und sein Herz störrisch gemacht
  rationale: אמץ bedeutet grundsätzlich stark oder fest machen; im Zusammenhang der Verhärtung bezeichnet es hier ein unbeugsames, widerstrebendes Herz. Eine Fußnote hält die formnähere Alternative offen.
- source_word: לְמַעַן
  choice: um
  rationale: Drückt die Zweckangabe knapp und idiomatisch aus.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: ihn in deine Hand zu geben
  rationale: Bewahrt das hebräische Macht- und Auslieferungsidiom, das im Deutschen verständlich ist.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Gibt die deuteronomische Wendung als Hinweis auf den nun sichtbaren gegenwärtigen Sachverhalt natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Göttliche Verhärtung und menschliche Unwilligkeit
  choice: Sowohl Sihons fehlende Bereitschaft als auch Jahwes wirksames Verhärten werden ausdrücklich wiedergegeben.
  alternative: Die Aussage als bloßes Zulassen durch Gott oder ausschließlich als Selbstverhärtung Sihons zu umschreiben.
  rationale: Der hebräische Text stellt beide Aussagen unmittelbar nebeneinander. Die Übersetzung bewahrt diese theologische Spannung, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Durch sein Land« macht den im Kontext territorialen Bezug des Pronomens verständlich. Das Plusquamperfekt bindet Jahwes Handeln als Begründung an Sihons vorausgehende Weigerung. Der Fußnotenmarker steht am Versende und verweist auf die lexikalische Alternative zu »störrisch gemacht«.
