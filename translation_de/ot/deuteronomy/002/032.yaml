  text: וַ/יֵּצֵא֩ סִיחֹ֨ן לִ/קְרָאתֵ֜/נוּ ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה יָֽהְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/032.yaml
  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: de
  text: Da zog Sihon mit seinem ganzen Volk aus, uns entgegen, um bei Jahaz gegen uns zu kämpfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da zog … aus
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; „zog aus“ ist in einem militärischen Zusammenhang natürlich und gibt יצא präzise wieder.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לִקְרָאתֵנוּ
  choice: uns entgegen
  rationale: Die Wendung bedeutet wörtlich „uns entgegen/zur Begegnung mit uns“. Der feindliche Sinn ergibt sich aus dem ausdrücklichen Hinweis auf den Kampf und muss daher hier nicht in die Wendung selbst eingetragen werden.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: mit seinem ganzen Volk
  rationale: Das selbstständige Pronomen nimmt Sihon nochmals auf; im Deutschen lässt sich die Beteiligung Sihons und seines gesamten Volkes idiomatisch durch „Sihon mit seinem ganzen Volk“ ausdrücken. עַם bleibt als „Volk“ wiedergegeben und wird nicht auf „Heer“ verengt.
- source_word: לַמִּלְחָמָה
  choice: um … gegen uns zu kämpfen
  rationale: Die Präposition bezeichnet hier den Zweck. Die finite deutsche Formulierung verbindet den Kampf natürlich mit dem bereits genannten Entgegenziehen.
- source_word: יָהְצָה
  choice: bei Jahaz
  rationale: Die Ortsform mit direktionalem -ה bezeichnet hier den Schauplatz beziehungsweise das Ziel bei Jahaz; „bei Jahaz“ ist im deutschen Bibelgebrauch klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung vermeidet die im Deutschen schwerfällige hebräische Nachstellung „er und sein ganzes Volk“, ohne deren Aussage zu verlieren. Die feindliche Begegnung wird durch „gegen uns zu kämpfen“ eindeutig, während „uns entgegen“ die lexikalische Offenheit von לִקְרָאתֵנוּ bewahrt.
