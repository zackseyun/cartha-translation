source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: „Sieh, ich habe begonnen, Sihon und sein Land dir auszuliefern.[a] Fang an, sein Land in Besitz zu nehmen![b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dir zu geben“. Gemeint ist, dass Jahwe Sihon und sein Land in Israels Gewalt gibt.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische wiederholt hier dieselbe Wortwurzel für „in Besitz nehmen“ und verstärkt so die Aufforderung.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als unmittelbarer Aufmerksamkeitsruf; „Sieh“ bewahrt seine knappe, nachdrückliche Form.
- source_word: הַחִלֹּתִי
  choice: ich habe begonnen
  rationale: Die Perfektform bezeichnet hier ein bereits eingeleitetes Geschehen und stellt zugleich die bewusste Parallele zum folgenden Imperativ her.
- source_word: תֵּת לְפָנֶיךָ
  choice: dir auszuliefern
  rationale: Wörtlich steht „vor dir zu geben“. Im Zusammenhang des bevorstehenden Kampfes bezeichnet die Wendung die Übergabe in Israels Gewalt; „auszuliefern“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: הָחֵל
  choice: Fang an
  rationale: 'Der Imperativ greift Gottes vorausgehendes „ich habe begonnen“ auf: Gottes Handeln setzt ein, und Israel soll nun ebenfalls handeln.'
- source_word: רָשׁ לָרֶשֶׁת
  choice: in Besitz zu nehmen
  rationale: Die Wurzel ירש wird im Hebräischen unmittelbar wiederholt. Im Deutschen wird der landbezogene Sinn natürlich als „in Besitz nehmen“ ausgedrückt; die Wiederholung wird in einer Fußnote kenntlich gemacht.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: אֶרֶץ bezeichnet hier das von Sihon beherrschte Gebiet; „Land“ ist die klare und kontextgerechte Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die deutsche Form „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Zusammenspiel von göttlichem und menschlichem Handeln
  choice: Parallele „ich habe begonnen … Fang an“ bewahrt
  alternative: Freie Umformulierung ohne wiederholtes „anfangen“
  rationale: Der Vers stellt Gottes beginnendes Übergeben und Israels beginnendes Inbesitznehmen bewusst nebeneinander. Die Übersetzung erhält diese Spannung, ohne sie theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; „Fang an“ erhält die verbale Parallele zum vorausgehenden „ich habe begonnen“, während „in Besitz nehmen“ den landbezogenen Sinn von ירש verständlich wiedergibt.
