  text: Then Yahweh spoke to me[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe zu mir[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das konsekutive וַ führt die Erzählung zeitlich weiter. „Da sprach“ gibt diese Abfolge in natürlichem, würdigem Deutsch wieder und bewahrt mit „sprach“ den Unterschied zum folgenden לֵאמֹר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: zu mir
  rationale: אֶל mit dem Suffix der ersten Person bezeichnet hier die Richtung der Rede und wird idiomatisch mit „zu mir“ wiedergegeben.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Die feste hebräische Redeeinleitungsformel wird im modernen Deutschen natürlich durch einen Doppelpunkt vor der unmittelbar folgenden direkten Rede ausgedrückt; ein zusätzliches „und sagte“ wäre schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt und „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Da sprach“ entspricht dem erzählerischen Anschluss; der Doppelpunkt gibt die hebräische Formel לֵאמֹר idiomatisch wieder.
