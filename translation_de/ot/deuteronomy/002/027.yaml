  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֔/ךָ בַּ/דֶּ֥רֶךְ בַּ/דֶּ֖רֶךְ אֵלֵ֑ךְ לֹ֥א אָס֖וּר יָמִ֥ין וּ/שְׂמֹֽאול׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: de
  text: Lass mich durch dein Land ziehen. Ich werde ausschließlich auf der Straße gehen[a] und weder nach rechts noch nach links abbiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf der Straße, auf der Straße“. Die Wiederholung betont, dass Israel sich strikt an die Route halten würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Lass mich … ziehen
  rationale: Der Kohortativ Qal 1. Person Singular drückt in diesem diplomatischen Zusammenhang eine höfliche Bitte aus; die Formulierung gibt dies im modernen Deutschen natürlich wieder.
- source_word: בְאַרְצֶךָ
  choice: durch dein Land
  rationale: ב bezeichnet nach עבר idiomatisch das Gebiet, durch das der Weg führt.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: nur auf der Straße
  rationale: Die Wiederholung verstärkt die Zusage, sich strikt an die vorgesehene Straße zu halten. „Straße“ bleibt weniger modern-spezifisch als „Fernstraße“.
- source_word: אֵלֵךְ
  choice: werde … bleiben
  rationale: הלך bedeutet hier gehen beziehungsweise sich fortbewegen. Zusammen mit der emphatischen Wegangabe gibt „auf der Straße bleiben“ den gemeinten Verlauf im Deutschen idiomatisch wieder.
- source_word: לֹא אָסוּר
  choice: weder … abbiegen
  rationale: סור bezeichnet das Abweichen oder Sich-Abwenden vom Weg; „abbiegen“ bewahrt hier das konkrete Bild der Wegführung.
- source_word: יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die feste Richtungsformel wird vollständig und idiomatisch wiedergegeben.
