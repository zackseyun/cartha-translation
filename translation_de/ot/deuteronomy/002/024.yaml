  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: de
  text: Macht euch auf, brecht auf und überquert das Arnontal.[a] Sieh, ich habe Sihon, den König von Heschbon, den Amoriter, und sein Land in deine Hand gegeben. Beginne, es in Besitz zu nehmen,[b] und nimm den Kampf mit ihm auf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wadi Arnon“ beziehungsweise „den Arnonbach“. Das hebräische Wort kann ein Tal, ein Bachbett oder einen Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es zu besitzen“. Das Verb kann je nach Zusammenhang auch „vertreiben“ beziehungsweise „aus dem Besitz verdrängen“ bedeuten; hier ist das zuvor genannte Land das naheliegende Bezugswort.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „tritt mit ihm in einen Krieg ein“, „kämpfe gegen ihn“ oder „fordere ihn zum Kampf heraus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Macht euch auf
  rationale: Der pluralische Imperativ fordert zum Handeln und Weiterziehen auf. Die Wendung ist im modernen Deutsch verständlich und zugleich würdevoll.
- source_word: סְּע֗וּ
  choice: brecht auf
  rationale: נסע bezeichnet im Reisekontext das Aufbrechen beziehungsweise Weiterziehen. „Brecht auf“ fügt sich natürlich in die Befehlsfolge ein.
- source_word: וְ/עִבְרוּ֮
  choice: und überquert
  rationale: עבר mit einem geografischen Objekt bezeichnet hier das Überschreiten beziehungsweise Überqueren.
- source_word: נַ֣חַל אַרְנֹן
  choice: das Arnontal
  rationale: נחל kann ein Wadi, ein zeitweise wasserführendes Bachbett oder das zugehörige Tal bezeichnen. „Arnontal“ ist zugänglich und geografisch angemessen; die Bandbreite wird in einer Fußnote bewahrt.
- source_word: רְאֵ֣ה
  choice: Sieh
  rationale: Der singularische Imperativ richtet die Aufmerksamkeit auf die folgende göttliche Zusage und bewahrt den Numeruswechsel des Hebräischen.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: ich habe … in deine Hand gegeben
  rationale: Die vollendete Form und das hebräische Bild werden bewahrt; die Redewendung bezeichnet die Übergabe in Macht oder Verfügungsgewalt.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Sihon, den König von Heschbon, den Amoriter
  rationale: Die appositionale Folge des Hebräischen wird eng nachgebildet und bezeichnet Sihon sowohl nach Herrschaftssitz als auch Volkszugehörigkeit.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: und sein Land
  rationale: אֶרֶץ bezeichnet hier Sihons Herrschaftsgebiet; „Land“ ist direkt und kontextgerecht.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Fang an, es in Besitz zu nehmen
  rationale: החל fordert zum Beginn auf; ירש kann besitzen, in Besitz nehmen oder vertreiben bedeuten. Das Pronomen bezieht sich am natürlichsten auf das unmittelbar genannte Land.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: und fordere ihn zum Kampf heraus
  rationale: Die Hitpael-Form von גרה mit ב und מלחמה bezeichnet das Auslösen beziehungsweise Aufnehmen kriegerischer Auseinandersetzung. Die gewählte Formulierung bewahrt die aktive, möglicherweise provozierende Nuance.
theological_decisions:
- issue: Göttliche Gabe und menschliches Handeln bei der Landnahme
  choice: Sowohl die bereits ausgesprochene göttliche Übergabe („ich habe … gegeben“) als auch der Befehl zum konkreten Handeln bleiben bestehen.
  alternative: Die vollendete Form als bloße Zukunft („ich werde geben“) wiederzugeben oder ירש im Haupttext ausschließlich als „vertreiben“ auszulegen.
  rationale: Der hebräische Text stellt Gottes vollendete Gewährung und Israels noch ausstehendes Handeln unmittelbar nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Ton. Die Folge kurzer Imperative bleibt erhalten. Der Wechsel von pluralischen Befehlen zu singularischem „Sieh“ und „deine“ wird entsprechend dem hebräischen Text bewahrt. Die Fußnoten stehen jeweils unmittelbar bei der betreffenden Formulierung.
