  to: Dann wandten wir uns und brachen in die Wüste auf, auf dem Weg zum Roten Meer[a], wie Jahwe zu mir gesagt hatte. Viele Tage lang umwanderten wir das Gebirge Seïr.
  rationale: Die Revision verstärkt die im Hebräischen markierte Bewegungsrichtung zur Wüste und ersetzt die im Deutschen unklare Wendung „zogen wir um“ durch das idiomatische, kontexttreue „umwanderten wir“. Gottesname, geografische Terminologie und die lexikalische Fußnote bleiben erhalten.
