base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: de
  text: Dann wandten wir uns und brachen in die Wüste auf, auf dem Weg zum Roten Meer[a], wie Jahwe zu mir gesagt hatte. Viele Tage lang umwanderten wir das Gebirge Seïr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schilfmeer“. So kann der hebräische Name Jam Suf wörtlicher wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Dann wandten wir uns um
  rationale: Das Qal wayyiqtol von פנה bezeichnet hier einen Richtungswechsel; die Formulierung gibt die Erzählfolge wieder, ohne ausdrücklich eine Rückkehr zu behaupten.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: und brachen in Richtung Wüste auf
  rationale: נסע bezeichnet im Reisekontext das Aufbrechen vom Lager; das direktionale ה an מִדְבָּר wird durch „in Richtung“ sichtbar gemacht.
- source_word: דֶּרֶךְ יַם סוּף
  choice: auf dem Weg zum Roten Meer
  rationale: דֶּרֶךְ bezeichnet Weg oder Route. „Rotes Meer“ ist die geläufige deutsche Wiedergabe von יַם־סוּף; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: wie Jahwe zu mir gesagt hatte
  rationale: כַּאֲשֶׁר stellt die Entsprechung her. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Weisung dem Aufbruch vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: zogen wir um das Gebirge Seïr
  rationale: סבב bezeichnet das Umher- oder Herumziehen. הַר kann einen einzelnen Berg oder ein Bergland/Gebirge bezeichnen; bei Seïr passt zum geografischen Zusammenhang „Gebirge“, ohne einen einzelnen Gipfel vorauszusetzen.
- source_word: יָמִים רַבִּים
  choice: Viele Tage lang
  rationale: Die Zeitdauer wird eng am hebräischen Ausdruck und zugleich idiomatisch deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen traditionellen Titel zu ersetzen.
- issue: Geografische Bedeutung von הַר שֵׂעִיר
  choice: das Gebirge Seïr
  alternative: der Berg Seïr
  rationale: הַר kann sowohl einen Berg als auch Bergland bezeichnen. Der Zusammenhang einer längeren Umwanderung lässt die regionale Bedeutung „Gebirge“ natürlich erscheinen, ohne die lexikalische Alternative auszuschließen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Aufbrechen“ wahrt den Lager- und Reisehintergrund; die Satzteilung vermeidet eine schwerfällige Kette von Hauptsätzen. Die Schreibung „Seïr“ markiert die getrennte Aussprache der Vokale.
