  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Bedränge Moab nicht und beginne keinen Krieg mit ihnen[a], denn ich werde dir keinen Teil seines Landes als Besitz geben[b]; Ar habe ich nämlich den Söhnen Lots als Besitz gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Setze Moab nicht zu und lass dich nicht auf einen Krieg mit ihnen ein.«'
    reason: 'Lexikalisch mögliche Wiedergabe der beiden Verbote: Die erste Wendung kann feindseligen Druck bezeichnen, die zweite das Eingehen in eine kriegerische Auseinandersetzung.'
  - marker: b
    text: 'Oder an beiden Stellen: »als Erbbesitz«.'
    reason: יְרֻשָּׁה bezeichnet einen zugewiesenen Besitz und kann dessen Charakter als Erbe betonen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Bedränge Moab nicht
  rationale: צרר bezeichnet hier feindseligen Druck beziehungsweise Bedrängung, noch unterschieden vom anschließenden ausdrücklichen Verbot kriegerischer Auseinandersetzung.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: und fordere sie nicht zum Krieg heraus
  rationale: Die Wendung mit dem Hitpael von גרה und מִלְחָמָה bezeichnet das Heraufbeschwören oder Beginnen einer kriegerischen Auseinandersetzung. Die deutsche Formulierung gibt den feindselig-provozierenden Sinn natürlich wieder.
- source_word: מֵאַרְצוֹ
  choice: keinen Teil seines Landes
  rationale: Das partitive מִן besagt im Zusammenhang, dass Israel nicht einmal einen Anteil des Landes erhalten wird. Das maskuline Suffix bezieht sich auf Moab als Volk beziehungsweise Gebiet.
- source_word: יְרֻשָּׁה
  choice: als Besitz
  rationale: Das Wort bezeichnet einen dauerhaft zugewiesenen, oft ererbten Besitz. »Besitz« ist hier verständlich und lässt sich an beiden Stellen einheitlich verwenden; »Erbbesitz« bleibt als Alternative in der Fußnote erhalten.
- source_word: לִבְנֵי לוֹט
  choice: den Söhnen Lots
  rationale: Die formal nahe Wiedergabe bewahrt die genealogische Ausdrucksweise des Hebräischen; gemeint sind Lots Nachkommen.
- source_word: עָר
  choice: Ar
  rationale: Der Eigenname des mit Moab verbundenen Ortes beziehungsweise Gebiets wird transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« bewahrt ihn in der im Deutschen üblichen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Charakter von Moabs Landgabe
  choice: als Besitz
  alternative: als Erbbesitz
  rationale: יְרֻשָּׁה kann sowohl den Besitz als auch dessen Charakter als zugewiesenes Erbe hervorheben. Der Haupttext bleibt sprachlich zugänglich; die engere erbrechtliche Nuance wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und knapp; »Bedränge« und »zum Krieg herausfordern« unterscheiden feindseligen Druck von offenem Krieg. Der kollektive Bezug wechselt wie im Hebräischen zwischen »Moab« als singularischer Größe (»seines Landes«) und den Angehörigen Moabs im Plural (»sie«).
