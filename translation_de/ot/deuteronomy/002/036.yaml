base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: de
  text: Von Aroër am Rand des Arnon-Tals und der Stadt im Tal bis nach Gilead gab es keine Stadt, die für uns zu hoch[a] war. Jahwe, unser Gott, gab uns alles in die Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu stark für uns“ oder „für uns unzugänglich“. Wörtlich heißt es im Hebräischen, keine Stadt sei „zu hoch für uns“ gewesen; Höhe dient hier als Bild für Wehrhaftigkeit oder Unzugänglichkeit.'
    reason: lexikalische Alternative und Erklärung des hebräischen Bildes
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Von Aroër
  rationale: Das präfigierte מִן kennzeichnet den Ausgangspunkt der geografischen Ausdehnung.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: am Rand des Arnontals
  rationale: שָׂפָה bezeichnet wörtlich Lippe, Rand oder Ufer; נַחַל kann ein Bachtal beziehungsweise Wadi meinen. „Rand des Arnontals“ ist topografisch verständlich und natürlich.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: und der Stadt im Tal
  rationale: Die einfache waw-Verbindung bleibt erhalten, ohne ein zweites, im Hebräischen nicht ausdrücklich gesetztes „von“ einzufügen.
- source_word: וְעַד הַגִּלְעָד
  choice: bis nach Gilead
  rationale: עַד markiert den Endpunkt des beschriebenen Gebietes.
- source_word: קִרְיָה
  choice: Stadt
  rationale: קִרְיָה bezeichnet eine Stadt oder Ortschaft; im militärischen Zusammenhang ist „Stadt“ im Deutschen passend.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: für uns zu hoch
  rationale: Die Übersetzung bewahrt das hebräische Höhenbild, das zugleich Wehrhaftigkeit oder Unzugänglichkeit ausdrücken kann.
- source_word: אֶת־הַכֹּל
  choice: sie alle
  rationale: Das kollektiv gebrauchte „das Ganze/alles“ bezieht sich im Zusammenhang am natürlichsten auf die genannten Städte; die deutsche Form macht diesen Bezug lesbar.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unser Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Apposition bewahrt die Bundesformel.
- source_word: לְפָנֵינוּ
  choice: in unsere Hand
  rationale: Im Eroberungskontext bedeutet die Wendung, dass Gott die Städte der Verfügungsgewalt Israels übergab. Die deutsche Wiedergabe gibt den idiomatischen Sinn wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über die Unbezwingbarkeit der Städte
  choice: für uns zu hoch
  alternative: zu stark für uns / für uns unzugänglich
  rationale: Das Höhenbild des Hebräischen bleibt im Haupttext erhalten; seine militärische Bedeutung wird in der Fußnote offengelegt, ohne die Mehrdeutigkeit auf eine einzige Deutung zu verengen.
- issue: לְפָנֵינוּ im Eroberungskontext
  choice: in unsere Hand
  alternative: vor uns
  rationale: „In unsere Hand geben“ vermittelt im heutigen Deutsch den kontextuellen Sinn der Übergabe in Israels Gewalt, ohne eine zusätzliche theologische Behauptung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geografische Reihung bleibt eng am Hebräischen; die schwerfällige Wiederholung „die Stadt, die im Tal liegt“ wird knapp als „der Stadt im Tal“ wiedergegeben. Das semantisch offene Höhenbild steht im Haupttext und wird durch die Fußnote erläutert.
