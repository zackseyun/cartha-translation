  yaml_path: translation/ot/deuteronomy/002/016.yaml
  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: de
  text: Und als alle Kriegsmänner aus der Mitte des Volkes gestorben waren,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Männer des Krieges“; auch: „die Kämpfer“.'
