lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Und als
  rationale: Die Erzählungsform von היה und die Zeitangabe כַאֲשֶׁר werden in natürlichem Deutsch zu einem temporalen Anschluss verbunden. Der Satz führt unmittelbar in Vers 17 weiter.
- source_word: תַּמּוּ ... לָמוּת
  choice: weggestorben waren
  rationale: Die Verbindung bezeichnet den abgeschlossenen Vorgang des Sterbens. „Weggestorben waren“ gibt sowohl den Abschluss als auch das Ausscheiden aus der Mitte des Volkes idiomatisch wieder, ohne das schwerfällige „zu sterben aufgehört hatten“.
- source_word: כָּל אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Kriegsmänner
  rationale: Die Wiedergabe bewahrt die ausdrücklich männliche und militärische Bedeutung der hebräischen Wendung. „Kriegsmänner“ ist knapp, verständlich und näher am Wortlaut als das deutendere „wehrfähige Männer“.
- source_word: מִקֶּרֶב הָעָם
  choice: aus dem Volk
  rationale: מִקֶּרֶב bezeichnet hier das Verschwinden aus der Mitte der Gemeinschaft. In Verbindung mit „weggestorben“ ist „aus dem Volk“ natürlich und semantisch ausreichend; „aus der Mitte des Volkes“ wäre formaler, aber schwerer.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bewusst offen, da der mit „als“ eingeleitete Nebensatz erst in Vers 17 fortgeführt wird. „Kriegsmänner“ ist leicht historisch gefärbt, vermeidet aber die interpretive Einengung von „wehrfähige Männer“.
