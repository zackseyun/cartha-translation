  source_fidelity: Der Entwurf gibt die temporale Einleitung, die Gesamtheit der militärisch bezeichneten Männer und den abgeschlossenen Sterbevorgang grundsätzlich richtig wieder. „Weggestorben“ trägt jedoch bereits die Bedeutung des Ausscheidens in sich und verwischt dadurch die eigenständige räumlich-soziale Angabe מִקֶּרֶב („aus der Mitte/von mitten aus“).
  naturalness: „Weggestorben waren“ wirkt in modernem Standarddeutsch ungebräuchlich und stilistisch auffällig. „Aus der Mitte des Volkes gestorben waren“ ist trotz der ungewohnten Bildlichkeit im biblisch-würdigen Register klarer und näher am hebräischen Bau.
  terminology: „Kriegsmänner“ ist verständlich, aber leicht archaisierend. Es kann hier beibehalten werden, da es die männliche und militärische Bezeichnung des Hebräischen knapp wiedergibt. Die Fußnote sollte die wörtliche Form und die idiomatischere Alternative nennen, ohne zusätzliche, weniger treffende Umschreibungen anzuhäufen.
