review_pass:
  verdict: revise
  source_fidelity: Die Grundabfolge und die wesentlichen Begriffe sind zutreffend wiedergegeben. Die Formulierung „sodass sie vor ihnen verschwanden“ macht jedoch aus der präpositionalen Bestimmung מִפְּנֵיהֶם eine zusätzliche Folgerung und schwächt zugleich die direkte Zuordnung zu „vernichteten“. Der Vergleichssatz ist im Deutschen außerdem mit „mit dem Land verfuhr, das sein Besitz war“ unnötig umschrieben und weniger nah am Bezug auf Israels Erbbesitz.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Auch in Seïr“ ist knapper und entspricht der Ortsangabe unmittelbar. „es mit dem Land seines Erbbesitzes tat“ ist sowohl idiomatischer als auch genauer als „mit dem Land verfuhr, das sein Besitz war“.
  terminology: „Horiter“, „Nachkommen Esaus“, „vernichteten“, „an ihrer Stelle“, „Erbbesitz“ und „Jahwe“ sind angemessen. Die kollektive Einzahl bei „seines Erbbesitzes“ und der anschließende Plural „ihnen“ bewahren den hebräischen Numeruswechsel.
  issues:
  - severity: medium
    issue: Die Wiedergabe von מִפְּנֵיהֶם als „sodass sie vor ihnen verschwanden“ verändert die Satzrelation.
    rationale: Im Hebräischen bestimmt die Wendung unmittelbar „vernichteten sie“ und bezeichnet ihre Entfernung aus der Gegenwart der Nachkommen Esaus; sie führt nicht ausdrücklich eine Resultat-Nebensatzkonstruktion ein.
  - severity: medium
    issue: Der Vergleichssatz „ebenso wie Israel mit dem Land verfuhr, das sein Besitz war“ ist semantisch und stilistisch zu paraphrasierend.
    rationale: לְאֶרֶץ יְרֻשָּׁתוֹ bezeichnet das Land von Israels Besitz/Erbbesitz. Die vorgeschlagene Fassung gibt dies klarer wieder, ohne die im Text bestehende historische Spannung aufzulösen.
  - severity: low
    issue: Fußnote a enthält die missverständliche Alternative „nahmen ihnen ihren Besitz ab“.
    rationale: Die Verbform bezieht sich auf die Horiter als verdrängte Bewohner; die Besitznahme betrifft im Kontext ihr Land. Eine präzisere Fußnote vermeidet eine unnötige Verschiebung des Bezugs.
  revised_text: Auch in Seïr lebten früher die Horiter. Doch die Nachkommen Esaus vertrieben[a] und vernichteten sie aus ihrer Gegenwart[b] und ließen sich an ihrer Stelle nieder – ebenso wie Israel es mit dem Land seines Erbbesitzes tat, das Jahwe ihnen gegeben hatte.
