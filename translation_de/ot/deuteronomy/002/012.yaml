source:
  edition: WLC
  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: de
  text: Auch in Seïr lebten früher die Horiter. Doch die Nachkommen Esaus vertrieben[a] und vernichteten sie aus ihrer Gegenwart[b] und ließen sich an ihrer Stelle nieder – ebenso wie Israel es mit dem Land seines Erbbesitzes tat, das Jahwe ihnen gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch bedeuten: „sie enteigneten“ oder „nahmen ihr Land in Besitz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von vor ihnen“; eine hebräische Wendung für die Entfernung aus ihrer Gegenwart.'
    reason: hebrew_idiom
lexical_decisions:
- source_word: הַחֹרִים
  choice: die Horiter
  rationale: Die im Deutschen gebräuchliche Bezeichnung für die Volksgruppe in Seïr.
- source_word: לְפָנִים
  choice: früher
  rationale: Das Wort ist hier zeitlich zu verstehen und bezeichnet die frühere Besiedlung.
- source_word: יִירָשׁוּם
  choice: vertrieben sie
  rationale: ירשׁ bezeichnet in diesem Zusammenhang die Besitznahme durch Verdrängung der bisherigen Bewohner; „vertrieben“ gibt den Vorgang natürlich wieder, während eine Fußnote die Besitzkomponente erläutert.
- source_word: וַיַּשְׁמִידוּם
  choice: vernichteten sie
  rationale: Bewahrt die starke Zerstörungsaussage von שׁמד, ohne durch „rotteten vollständig aus“ zusätzliche Präzision einzutragen.
- source_word: מִפְּנֵיהֶם
  choice: sodass sie vor ihnen verschwanden
  rationale: Gibt die hebräische Wendung sinngemäß als Entfernung aus ihrer Gegenwart wieder und vermeidet das unnatürliche deutsche „von vor ihnen“.
- source_word: תַּחְתָּם
  choice: an ihrer Stelle
  rationale: Bezeichnet hier die Ablösung der früheren Bewohner durch die Nachkommen Esaus.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: ebenso wie Israel ... verfuhr
  rationale: Eine natürliche deutsche Vergleichsformulierung, die den historischen Vergleich des hebräischen Textes stehen lässt.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: mit dem Land, das sein Besitz war
  rationale: יְרֻשָּׁה kann sowohl Besitz als auch Erbbesitz bezeichnen. Die kollektive Einzahl des Bezugs auf Israel bleibt durch „sein“ erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Wiedergabe des göttlichen Eigennamens statt Ersetzung durch einen Titel.
- source_word: לָהֶם
  choice: ihnen
  rationale: Bewahrt den Wechsel von Israel als kollektiver Einzahl („sein“) zur Mehrzahl, die sich auf die Angehörigen Israels bezieht.
theological_decisions:
- issue: Zeitlicher und historischer Bezug des Vergleichs mit Israels Landnahme
  choice: Den Vergleich als Aussage des überlieferten hebräischen Textes unverändert stehen lassen.
  alternative: Die Klausel als späteren Zusatz kennzeichnen oder durch eine andere Zeitform chronologisch harmonisieren.
  rationale: Der Text vergleicht ausdrücklich Esaus Vorgehen mit dem Vorgehen Israels. Übersetzung soll weder quellenkritische noch harmonisierende Lösungen in den Wortlaut eintragen.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen Esaus“ ist für בְּנֵי עֵשָׂו natürlicher als „Söhne Esaus“. Die Satzstruktur wahrt die Abfolge von Vertreibung, Vernichtung und anschließender Ansiedlung; Gedankenstrich zur lesbaren Einführung des Vergleichs.
