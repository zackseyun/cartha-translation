revisions:
- from: Auch im Gebiet Seïr lebten früher die Horiter. Doch die Nachkommen Esaus vertrieben[a] und vernichteten sie, sodass sie vor ihnen verschwanden[b], und ließen sich an ihrer Stelle nieder – ebenso wie Israel mit dem Land verfuhr, das sein Besitz[c] war und das Jahwe ihnen gegeben hatte.
  to: Auch in Seïr lebten früher die Horiter. Doch die Nachkommen Esaus vertrieben[a] und vernichteten sie aus ihrer Gegenwart[b] und ließen sich an ihrer Stelle nieder – ebenso wie Israel es mit dem Land seines Erbbesitzes tat, das Jahwe ihnen gegeben hatte.
  rationale: Die Revision bindet die idiomatische Wendung „von vor ihnen“ wieder unmittelbar an die Vernichtung und gibt sie in natürlichem Deutsch wieder. Sie ersetzt die umständliche Umschreibung des Erbbesitzes durch eine dem hebräischen Ausdruck nähere Formulierung. Die Fußnoten erläutern die lexikalischen Alternativen und das Idiom, ohne den Text über das Hebräische hinaus zu präzisieren.
  reviewer_model: gpt-5.6-terra
