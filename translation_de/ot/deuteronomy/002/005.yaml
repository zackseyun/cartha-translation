  to: Legt euch nicht mit ihnen an, denn ich werde euch nichts von ihrem Land geben, nicht einmal so viel, dass ihr euren Fuß darauf setzen könnt.[a] Denn das Bergland Seïr[b] habe ich Esau als Besitz[c] gegeben.
  rationale: Die einzige Änderung ersetzt die unnatürliche Personifikation der Fußsohle durch eine gebräuchliche deutsche Wendung. Sie erhält die Aussage, dass Israel nicht einmal den geringsten Standplatz in diesem Land erhalten wird. Die Fußnote erläutert weiterhin die wörtliche Fußsohlen-Metapher; alle übrigen Übersetzungsentscheidungen bleiben unverändert.
