source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: de
  text: Legt euch nicht mit ihnen an, denn ich werde euch nichts von ihrem Land geben, nicht einmal so viel, dass ihr euren Fuß darauf setzen könnt.[a] Denn das Bergland Seïr[b] habe ich Esau als Besitz[c] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »bis zum Tritt einer Fußsohle«; gemeint ist selbst das kleinste Stück Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »den Berg Seïr«. Der Ausdruck kann die gebirgige Region Seïr bezeichnen.'
    reason: cultural_note
  - marker: c
    text: »Als Besitz« kann auch mit »als Erbteil« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Legt euch nicht mit ihnen an
  rationale: Das Hitpael von גרה mit ב bezeichnet hier feindseliges Sich-Einlassen beziehungsweise das Anfangen eines Konflikts. Die Wendung ist im modernen Deutschen natürlich und verbietet feindliches Vorgehen, ohne den Sinn auf eine förmliche Schlacht zu verengen.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: ich werde euch nichts von ihrem Land geben
  rationale: 'Die Präposition מן ist partitiv gebraucht: Israel erhält keinerlei Anteil von ihrem Land.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: nicht einmal so viel, dass eine Fußsohle darauf treten kann
  rationale: Die konkrete Fußsohlen-Metapher bleibt erhalten und bezeichnet anschaulich selbst das kleinste Stück Land.
- source_word: יְרֻשָּׁה
  choice: als Besitz
  rationale: Das Wort kann sowohl einen Besitz als auch ein Erbteil bezeichnen. Im Zusammenhang steht das von Gott zugeteilte Gebiet im Vordergrund; die mögliche Wiedergabe »Erbteil« wird in einer Fußnote bewahrt.
- source_word: לְעֵשָׂו
  choice: Esau
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben; לְ kennzeichnet den Empfänger der Landgabe.
- source_word: הַר שֵׂעִיר
  choice: das Bergland Seïr
  rationale: הַר kann hier nicht nur einen einzelnen Berg, sondern die gebirgige Region Seïr bezeichnen. »Bergland« vermeidet eine unnötige Verengung auf einen einzelnen Gipfel.
theological_decisions:
- issue: Göttliche Zuteilung des edomitischen Gebiets
  choice: Das Verbot feindlichen Vorgehens wird ausdrücklich damit begründet, dass Gott Seïr Esau zugeteilt hat.
  alternative: Das Verbot lediglich als politische Anweisung wiederzugeben, ohne die göttliche Landzuteilung hervorzuheben.
  rationale: Die beiden כִּי-Sätze begründen das Verbot mit Gottes Entscheidung, Israel nichts von diesem Land zu geben, weil er Seïr Esau als Besitz gegeben hat. Diese Begründung wird bewahrt, ohne sie dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Legt euch nicht mit ihnen an« ist eine geläufige, aber nicht saloppe Warnung vor feindlicher Auseinandersetzung. Die Fußsohlen-Metapher und die Mehrdeutigkeit von יְרֻשָּׁה bleiben erhalten.
