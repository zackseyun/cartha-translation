  source_fidelity: Die Übersetzung gibt das Verbot feindlicher Auseinandersetzung, die partitive Verneinung („nichts von ihrem Land“), die minimale Landmenge der Fuß-Metapher sowie die göttliche Zuteilung Seïrs an Esau zutreffend wieder. Die Formulierung zur Fußsohle ist jedoch im Deutschen semantisch unnatürlich, da nicht eine Fußsohle selbst „tritt“; der Mensch setzt seinen Fuß auf den Boden.
  naturalness: „Legt euch nicht mit ihnen an“ ist modernes, idiomatisches Standarddeutsch und trifft im Kontext die feindselige Konnotation hinreichend. „dass eine Fußsohle darauf treten kann“ klingt dagegen unidiomatisch. „dass ihr euren Fuß darauf setzen könnt“ ist natürlich und bewahrt die Bildaussage.
