  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und Jahwe sagte zu mir, mit den Worten:“ Die abschließende Wendung leitet die Rede ein, die im nächsten Vers folgt; im Deutschen wird ihre Funktion hier durch den Doppelpunkt ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Erzählform von אמר führt die Handlung fort. „Da sagte“ gibt die zeitliche Weiterführung im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der 1. Person Singular bedeutet hier schlicht „zu mir“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar im nächsten Vers folgende direkte Rede ein. Im natürlichen Deutschen erfüllt der Doppelpunkt diese Funktion, ohne das schwerfällige „und sprach“ zu wiederholen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ sorgt für einen flüssigen Anschluss an die Erzählung; der Doppelpunkt macht deutlich, dass der Satz erst mit der folgenden Rede in Vers 3 inhaltlich fortgesetzt wird.
