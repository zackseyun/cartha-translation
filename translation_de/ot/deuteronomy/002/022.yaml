  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: de
  text: 'So tat er es auch für die Nachkommen Esaus, die im Gebirge Seïr wohnen: Er vernichtete die Horiter vor ihnen[a], und sie vertrieben sie[b] und wohnten an ihrer Stelle bis zum heutigen Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „vor ihnen“ ist eine Wendung dafür, dass er die Horiter aus ihrer Gegenwart beziehungsweise ihrem Gebiet entfernte.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie nahmen sie in Besitz“; gemeint ist, dass die Nachkommen Esaus die Horiter verdrängten und ihr Gebiet besetzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: So tat er es auch
  rationale: Bewahrt die vergleichende Rückbindung an den vorherigen Vers und lässt den Inhalt von „tat“ wie im Hebräischen aus dem Kontext ergänzen.
- source_word: לִבְנֵי עֵשָׂו
  choice: für die Nachkommen Esaus
  rationale: בנים bezeichnet hier die ethnischen Nachkommen Esaus, nicht nur seine unmittelbaren Söhne.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: die im Gebirge Seïr lebten
  rationale: Das Partizip bezeichnet ihren Wohnsitz. „Gebirge Seïr“ macht den geografischen Namen im Deutschen eindeutig; die Vergangenheitsform passt zur erzählten Handlung.
- source_word: הִשְׁמִיד אֶת הַחֹרִי
  choice: Er vernichtete die Horiter
  rationale: Das Hifil von שׁמד bezeichnet die vollständige Beseitigung beziehungsweise Vernichtung; „Horiter“ ist die übliche deutsche Völkerbezeichnung.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Gibt die räumliche hebräische Wendung knapp wieder, ohne sie unnötig auszudeuten; eine Erläuterung steht in Fußnote [a].
- source_word: וַיִּירָשֻׁם
  choice: und sie nahmen deren Land in Besitz
  rationale: ירשׁ bezeichnet im Landnahmekontext die Besitzergreifung durch Verdrängung. Das Objektpronomen bezieht sich grammatisch auf die Horiter, sachlich jedoch auf ihren Besitz beziehungsweise ihr Gebiet.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: und ließen sich an ihrer Stelle nieder
  rationale: Drückt die dauerhafte Ansiedlung am Platz der früheren Bewohner natürlich und präzise aus.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: wo sie bis zum heutigen Tag leben
  rationale: Gibt die feste Zeitangabe idiomatisch wieder und verbindet sie verständlich mit der fortdauernden Ansiedlung.
theological_decisions:
- issue: Subjekt von עָשָׂה und הִשְׁמִיד
  choice: Das unausgesprochene Subjekt wird mit „er“ wiedergegeben und bezeichnet den HERRN aus dem unmittelbaren Kontext.
  alternative: Die Verben ohne ausdrückliche Identifikation des Handelnden formulieren.
  rationale: Die maskulinen Singularformen setzen das Subjekt aus Vers 21 fort. Das Pronomen bewahrt die kontextuelle Verknüpfung, ohne den Gottesnamen im Vers zusätzlich einzufügen.
- issue: Bedeutung von וַיִּירָשֻׁם
  choice: „sie nahmen deren Land in Besitz“
  alternative: „sie vertrieben sie“ oder formal „sie nahmen sie in Besitz“
  rationale: Der Vers verbindet die Verdrängung der Horiter mit der Besiedlung ihres Gebiets. Die gewählte Formulierung gibt den gemeinten Besitzwechsel klar wieder, während Fußnote [b] die mögliche stärkere Betonung der Enteignung festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen“ vermeidet das missverständliche wörtliche „Söhne“ bei einer Volksgruppe. Die Übersetzung wahrt die elliptische Rückbindung an den vorherigen Vers und erklärt zwei hebräische Wendungen in knappen Fußnoten.
