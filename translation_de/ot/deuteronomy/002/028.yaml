base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: de
  text: Verkaufe mir Nahrung gegen Silber, damit ich essen kann, und gib mir Wasser gegen Silber, damit ich trinken kann. Lass mich nur zu Fuß hindurchziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: Nahrung
  rationale: Der allgemeine Ausdruck bezeichnet hier Lebensmittel bzw. Nahrung, nicht speziell Brot oder Getreide.
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: Bewahrt den konkreten hebräischen Ausdruck und bezeichnet zugleich eindeutig die Bezahlung.
- source_word: תַּשְׁבִּרֵנִי
  choice: du darfst mir … verkaufen
  rationale: Der Hifil von שׁבר bezeichnet in diesem Zusammenhang den Verkauf von Nahrung; die Modalform gibt den bittenden Charakter wieder.
- source_word: וְאָכַלְתִּי
  choice: damit ich essen kann
  rationale: Gibt die beabsichtigte Folge bzw. den Zweck der Bitte in natürlichem Deutsch wieder.
- source_word: וּמַיִם
  choice: Wasser
  rationale: Direkte und eindeutige Entsprechung.
- source_word: תִּתֶּן לִי
  choice: mir … geben
  rationale: Natürliche Wiedergabe von נתן mit ל.
- source_word: וְשָׁתִיתִי
  choice: damit ich trinken kann
  rationale: Gibt wie beim Essen die beabsichtigte Folge bzw. den Zweck wieder.
- source_word: רַק
  choice: nur
  rationale: Begrenzt die Bitte knapp und idiomatisch auf den freien Durchzug.
- source_word: אֶעְבְּרָה
  choice: Lass mich … durchziehen
  rationale: Die Kohortativform ist im Kontext als Bitte um Erlaubnis zu verstehen.
- source_word: בְרַגְלָי
  choice: zu Fuß
  rationale: Natürliche deutsche Entsprechung des wörtlichen Ausdrucks »auf meinen Füßen«.
