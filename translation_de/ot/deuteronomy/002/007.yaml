base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: de
  text: Denn Yahweh, dein Gott, hat dich bei all deiner Arbeit gesegnet. Er wusste um deinen Weg durch diese große Wüste[a]. Yahweh, dein Gott, ist diese vierzig Jahre bei dir gewesen; dir hat nichts gefehlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat über deinen Weg durch diese große Wüste gewacht.« Wörtlich: »Er hat deinen Weg gekannt.« Das hebräische Verb kann hier aufmerksame, fürsorgliche Begleitung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּרַכְךָ
  choice: hat dich … gesegnet
  rationale: Das Perfekt blickt auf erfahrenen Segen zurück; das deutsche Perfekt klingt im erzählenden Rückblick natürlich.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: bei allem Werk deiner Hände
  rationale: Die hebräische Wendung bezeichnet die gesamte Arbeit beziehungsweise alle Unternehmungen. Der im Hebräischen singularische Kollektivausdruck »deine Hand« wird im Deutschen idiomatisch mit »deine Hände« wiedergegeben.
- source_word: יָדַע
  choice: hat … gekannt
  rationale: Die Grundbedeutung »kennen/wissen« bleibt im Haupttext erhalten; die im Zusammenhang mögliche Bedeutung fürsorglicher Aufmerksamkeit wird in der Fußnote genannt.
- source_word: לֶכְתְּךָ
  choice: deinen Weg
  rationale: Die Form bezeichnet Israels Gehen beziehungsweise Unterwegssein. »Deinen Weg« ist im Deutschen natürlich und bewahrt zugleich das konkrete Bild.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: durch diese große Wüste
  rationale: Im Zusammenhang mit dem Weg gibt »durch« den durchquerten Raum idiomatisch wieder.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: Diese vierzig Jahre
  rationale: Die hebräische Zeitangabe wird knapp und idiomatisch wiedergegeben.
- source_word: עִמָּךְ
  choice: ist … bei dir gewesen
  rationale: Die präpositionale Aussage ohne ausdrückliches Verb bezeichnet Yahwehs fortdauernde Gegenwart während der zurückliegenden vierzig Jahre.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: dir hat nichts gefehlt
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Aussage vollständiger Versorgung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Quelltext verwendet den persönlichen Gottesnamen. »Yahweh« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יָדַע in Bezug auf Israels Weg
  choice: hat … gekannt
  alternative: hat über deinen Weg gewacht; hat sich um deinen Weg gekümmert
  rationale: Die wörtliche Grundbedeutung lässt sowohl Kenntnis als auch die im Kontext naheliegende fürsorgliche Aufmerksamkeit anklingen, ohne diese im Haupttext eindeutig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird jedoch dort idiomatisch geglättet, wo eine streng wörtliche Wiedergabe im Deutschen unnatürlich wäre.
