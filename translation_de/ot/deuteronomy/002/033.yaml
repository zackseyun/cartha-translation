  text: וַֽ/יִּתְּנֵ֛/הוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵ֑י/נוּ וַ/נַּ֥ךְ אֹת֛/וֹ וְ/אֶת בנ/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: de
  text: Da lieferte Jahwe, unser Gott, ihn uns aus[a], und wir schlugen ihn, seine Söhne[b] und sein ganzes Volk nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor uns“; die Wendung bedeutet hier, dass Jahwe ihn in Israels Gewalt gab.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Konsonantentext lautet „seinen Sohn“; in diesem Zusammenhang verstehen viele die Form kollektiv beziehungsweise lesen „seine Söhne“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: lieferte ihn uns aus
  rationale: Die Verbindung von נתן mit לְפָנֵינוּ bezeichnet im militärischen Zusammenhang, dass der Gegner in Israels Gewalt gegeben wird. Die deutsche Wendung ist natürlich und bewahrt diesen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit dem Suffix der ersten Person Plural bedeutet unmittelbar „unser Gott“.
- source_word: וַנַּךְ
  choice: wir schlugen ... nieder
  rationale: נכה bezeichnet hier im Kriegsbericht das entscheidende Schlagen beziehungsweise Besiegen; „niederschlagen“ gibt diese stärkere Bedeutung wieder.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das direkte Objekt verweist auf Sihon im vorhergehenden Vers.
- source_word: בנו
  choice: seine Söhne
  rationale: Obwohl der Konsonantentext als Singular „sein Sohn“ verstanden werden kann, wird die Form in diesem Zusammenhang traditionell und vielfach pluralisch als Hinweis auf seine Söhne aufgefasst. Die textliche Spannung wird in einer Fußnote offengelegt.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: עַם bedeutet gewöhnlich „Volk“; die Wortstellung entspricht natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Numerus von בנו
  choice: seine Söhne
  alternative: seinen Sohn
  rationale: Der überlieferte Konsonantentext lässt den Singular erkennen, während der Kontext und die traditionelle Lesart ein pluralisches Verständnis stützen. Der Haupttext folgt dem pluralischen Verständnis, ohne die abweichende Textform zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ führt die Erzählung flüssig fort; „ausliefern“ und „niederschlagen“ bewahren den militärischen Ernst des Ausgangstextes, ohne ihn unnötig auszudeuten.
