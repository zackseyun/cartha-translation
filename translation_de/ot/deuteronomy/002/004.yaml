source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: de
  text: 'Und gebiete dem Volk: »Ihr zieht nun[a] durch das Gebiet[b] eurer Brüder, der Söhne Esaus, die in Seïr wohnen. Sie werden sich vor euch fürchten. Darum nehmt euch sehr in Acht.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Ihr zieht gerade« oder »ihr werdet ziehen«. Das hebräische Partizip kann einen gegenwärtigen oder unmittelbar bevorstehenden Vorgang ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »durch den Grenzbereich«. Das hebräische Wort kann sowohl eine Grenzlinie als auch das von ihr umschlossene Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »Und hütet euch sehr.« Der hebräische Satz lässt den logischen Anschluss unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: gebiete
  rationale: Der Imperativ von צוה bezeichnet eine verbindliche, autoritative Anweisung. „Gebiete“ bewahrt diese Stärke und passt zum würdevollen biblischen Register.
- source_word: הָעָם
  choice: dem Volk
  rationale: עם bezeichnet hier Israel als Gemeinschaft; „Volk“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: אַתֶּם עֹבְרִים
  choice: ihr zieht nun
  rationale: Das Partizip mit selbstständigem Pronomen bezeichnet im Zusammenhang einen unmittelbar bevorstehenden Vorgang. „Ihr zieht nun“ klingt im Deutschen natürlich und lässt zugleich gegenwärtige beziehungsweise nahe zukünftige Bedeutung zu.
- source_word: בִּגְבוּל
  choice: durch das Gebiet
  rationale: גְּבוּל kann sowohl Grenze als auch das von ihr umschlossene Gebiet bezeichnen. Da Israel hindurchzieht, ist „Gebiet“ im Kontext am wahrscheinlichsten.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: eurer Brüder, der Söhne Esaus
  rationale: „Brüder“ bewahrt die ausdrücklich familiäre Beziehung zwischen Israel und Edom; „Söhne Esaus“ erhält die genealogische Ausdrucksweise des Hebräischen.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: die in Seïr wohnen
  rationale: Das Partizip von ישב bezeichnet hier den festen Wohnsitz. „Wohnen“ ist modern und präzise.
- source_word: וְיִירְאוּ מִכֶּם
  choice: sie werden sich vor euch fürchten
  rationale: ירא mit מן drückt Furcht vor jemandem aus. Die reflexive deutsche Wendung ist idiomatisch und bewahrt den Zukunftssinn.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: Darum nehmt euch sehr in Acht
  rationale: 'Der Niphal von שמר hat hier reflexiven Sinn: sich hüten beziehungsweise vorsichtig sein. „Sehr“ gibt das verstärkende מְאֹד wieder; „darum“ macht den naheliegenden Folgezusammenhang deutlich.'
theological_decisions:
- issue: Verwandtschaftsbezeichnung für Edom
  choice: eurer Brüder, der Söhne Esaus
  alternative: eurer Verwandten, der Nachkommen Esaus
  rationale: Die Formulierung begründet Israels Verhalten gegenüber Edom in der genealogischen Verwandtschaft. „Brüder“ erhält die bewusste familiäre Sprache, ohne sie zu einer bloß ethnischen Bezeichnung abzuschwächen.
- issue: Logischer Bezug der abschließenden Warnung
  choice: Darum nehmt euch sehr in Acht
  alternative: Und nehmt euch sehr in Acht
  rationale: Die Furcht der Edomiter bildet im Zusammenhang den Anlass zur besonderen Vorsicht. „Darum“ gibt diesen naheliegenden Zusammenhang wieder, ohne festzulegen, worin die Vorsicht inhaltlich bestehen muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebiete“ erhält den autoritativen Ton, während „wohnen“, „zieht nun“ und „nehmt euch in Acht“ allgemein verständlich bleiben. Die Schreibung „Seïr“ markiert die getrennte Aussprache der Vokale.
