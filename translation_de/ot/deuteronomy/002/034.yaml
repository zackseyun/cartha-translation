base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: de
  text: Damals nahmen wir alle seine Städte ein und weihten jede Stadt samt Männern, Frauen und kleinen Kindern der Vernichtung[a]. Wir ließen niemanden überleben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Sinn des Bannens (hebräisch ḥerem): Etwas oder jemand wird unwiderruflich der Vernichtung geweiht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nahmen wir … ein
  rationale: לכד ist das übliche militärische Verb für die Einnahme einer Stadt. „einnehmen“ ist im Deutschen natürlich und präzise.
- source_word: כָּל עָרָיו
  choice: alle seine Städte
  rationale: עיר kann Stadt oder Ortschaft bedeuten; „Städte“ entspricht hier dem militärischen Zusammenhang und gibt כָּל umfassend wieder.
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: Eine knappe, idiomatische Wiedergabe der Zeitangabe „zu jener Zeit“.
- source_word: וַנַּחֲרֵם
  choice: vollstreckten … den Bann
  rationale: Die Form von חרם bezeichnet hier die Ausführung des ḥerem, also die vollständige Preisgabe zur Vernichtung. „den Bann vollstrecken“ bewahrt den technischen, sakralen Gehalt besser als das bloße „vernichten“.
- source_word: כָּל עִיר מְתִם
  choice: an jeder Stadt … an den Männern
  rationale: Die gedrängte hebräische Wendung verbindet jede Stadt mit ihren männlichen Bewohnern; die folgende Aufzählung nennt außerdem Frauen und kleine Kinder. Die deutsche Fassung wahrt die Geschlechtsspezifik und vermeidet das missverständliche „bewohnte Stadt“, das Männer nicht ausdrücklich bezeichnet.
- source_word: הַנָּשִׁים
  choice: den Frauen
  rationale: Direkte und transparente Wiedergabe des femininen Plurals.
- source_word: הַטָּף
  choice: den kleinen Kindern
  rationale: טף bezeichnet kleine Kinder beziehungsweise junge Abhängige; „kleine Kinder“ bringt Alter und Schutzlosigkeit klar zum Ausdruck.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Wir ließen niemanden überleben
  rationale: שָׂרִיד bezeichnet einen Überlebenden oder Übriggebliebenen. Die gewählte Formulierung ist im militärischen Zusammenhang klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie im Eroberungsbericht
  choice: vollstreckten … den Bann
  alternative: weihten … der Vernichtung / vernichteten vollständig
  rationale: Die Fassung erhält die technisch-sakrale Dimension von חרם, ohne die Gewaltdarstellung abzuschwächen oder nachträglich theologisch zu erklären. Da „Bann“ heute erklärungsbedürftig sein kann, erläutert eine Fußnote den Sinn.
- issue: Geschlechtsspezifik von מְתִם in der Aufzählung
  choice: die Männer, die Frauen und die kleinen Kinder
  alternative: alle Einwohner samt Frauen und Kindern
  rationale: Der hebräische Text unterscheidet männliche Bewohner, Frauen und kleine Kinder. Diese Unterscheidung wird nicht in einem allgemeinen Ausdruck wie „Menschen“ eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sachliche Härte des Eroberungsberichts bleibt ungemildert. Der erklärungsbedürftige Fachausdruck „Bann“ wird im Haupttext bewahrt und in der Fußnote knapp erläutert.
