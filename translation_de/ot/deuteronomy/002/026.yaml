id: DEU.2.26
reference: Deuteronomy 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: de
  text: 'Da sandte ich Boten aus der Wüste Kedemot zu Sihon, dem König von Heschbon, mit Worten des Friedens[a] und ließ ihm sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Friedensangebot“. Wörtlich steht im Hebräischen „mit Worten des Friedens“, eine Wendung für eine friedliche diplomatische Annäherung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Da sandte ich
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. „Da sandte ich“ gibt die zeitlich-folgernde Erzählbewegung natürlich wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Abgesandte gemeint, nicht Engel. „Boten“ ist klar und eng am hebräischen Ausdruck.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: aus der Wüste Kedemot
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land und kann im Deutschen natürlich mit „Wüste“ wiedergegeben werden. Die Ortsbezeichnung wird als Kedemot transkribiert.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: zu Sihon, dem König von Heschbon
  rationale: אֶל bezeichnet hier das Ziel der Gesandtschaft. Die Apposition wird im Deutschen durch „dem König von Heschbon“ idiomatisch ausgedrückt.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: mit Worten des Friedens
  rationale: Die Wiedergabe bewahrt das hebräische Bild wörtlich und verständlich; gemeint ist eine friedliche diplomatische Annäherung. Die stärker deutende Alternative steht in der Fußnote.
- source_word: לֵאמֹר
  choice: 'und ließ ihm sagen:'
  rationale: Der hebräische Infinitiv führt die nachfolgende direkte Rede ein. Im Deutschen verbindet „und ließ ihm sagen“ den Auftrag der Boten natürlich mit der Rede im nächsten Vers.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Erzählfluss, während „und ließ ihm sagen“ den Übergang zur folgenden direkten Rede idiomatisch gestaltet.
