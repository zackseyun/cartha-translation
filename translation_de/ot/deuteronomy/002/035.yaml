  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: de
  text: Nur das Vieh nahmen wir für uns als Beute und die Beute aus den Städten, die wir eingenommen hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Einschränkung gegenüber der vollständigen Vernichtung der Menschen im vorhergehenden Vers.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Bezeichnet hier die als Kriegsbeute genommenen domestizierten Tiere; „Vieh“ ist der natürliche deutsche Sammelbegriff.
- source_word: בָּזַזְנוּ לָנוּ
  choice: nahmen wir als Beute für uns
  rationale: Gibt sowohl die Bedeutung des Verbs בזז („plündern, als Beute nehmen“) als auch den Nutznießerbezug von לָנוּ wieder.
- source_word: וּשְׁלַל
  choice: ebenso die Beute
  rationale: שָׁלָל bezeichnet Kriegsbeute. „Ebenso“ macht die Koordination im Deutschen verständlich, ohne ihren sachlichen Gehalt zu verändern.
- source_word: הֶעָרִים
  choice: aus den Städten
  rationale: Der Genitivzusammenhang bezeichnet die in den Städten erlangte Beute; „aus den Städten“ ist im modernen Deutsch natürlich.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: die wir erobert hatten
  rationale: לכד bedeutet im militärischen Zusammenhang „einnehmen, erobern“; das Plusquamperfekt ordnet die Eroberung zeitlich vor dem Beutemachen ein.
