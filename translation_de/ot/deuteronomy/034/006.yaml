  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: de
  text: Und er begrub ihn im Tal im Land Moab[a], gegenüber von Bet-Peor, und niemand kennt seine Grabstätte bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „er begrub“ wird in diesem Vers nicht ausdrücklich genannt; der vorhergehende Zusammenhang weist auf den HERRN.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Und er begrub
  rationale: Das Qal 3. Person Singular Maskulinum wird aktiv wiedergegeben. Das Subjekt bleibt wie im hebräischen Vers ungenannt; der Zusammenhang weist auf den HERRN.
- source_word: בַגַּיְ
  choice: im Tal
  rationale: גַּיְ bezeichnet ein Tal oder eine Schlucht; „Tal“ ist hier die natürliche und allgemein verständliche Wiedergabe.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: im Land Moab
  rationale: Bewahrt den konkreten hebräischen Ausdruck, ohne ihn zu „in Moab“ zu verkürzen.
- source_word: מוּל
  choice: gegenüber von
  rationale: Gibt die räumliche Lagebeziehung klar und in natürlichem modernem Deutsch wieder.
- source_word: בֵּית פְּעוֹר
  choice: Bet-Peor
  rationale: Der Ortsname wird nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: וְלֹא יָדַע אִישׁ
  choice: doch … kennt niemand
  rationale: אִישׁ hat hier generische Bedeutung. „Niemand“ ist im modernen Deutsch die natürliche inklusive Wiedergabe; das Perfekt des Hebräischen bezeichnet einen bis zum Erzählzeitpunkt fortbestehenden Wissensstand.
- source_word: קְבֻרָתוֹ
  choice: seine Grabstätte
  rationale: Im Zusammenhang ist der Ort der Bestattung gemeint. „Grabstätte“ ist präzise und würdevoll.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Bewahrt die zeitliche Perspektive und fortdauernde Geltung des hebräischen Ausdrucks.
theological_decisions:
- issue: Identität des Subjekts von „er begrub ihn“
  choice: Das ungenannte „er“ bleibt im Haupttext erhalten.
  alternative: Das Subjekt aufgrund des vorherigen Verses ausdrücklich als „der HERR“ benennen oder passiv mit „er wurde begraben“ übersetzen.
  rationale: Der unmittelbare Zusammenhang legt den HERRN als Subjekt nahe, doch Vers 6 selbst nennt es nicht. Die aktive, pronominale Wiedergabe bewahrt diese formale Offenheit, ohne den naheliegenden Bezug zu verdecken.
- issue: Generisches אִישׁ
  choice: niemand
  alternative: kein Mann
  rationale: אִישׁ steht in der verneinten Konstruktion generisch. „Niemand“ gibt den Sinn in natürlichem modernem Deutsch wieder, ohne eine nur männliche Bezugsgruppe nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aktive Satzform und das ungenannte Subjekt des Hebräischen bleiben erhalten; Semikolon und „doch“ gliedern den langen Satz natürlich. Der Ortsname wird als „Bet-Peor“ transliteriert.
