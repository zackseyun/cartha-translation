source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: de
  text: So starb dort Mose, der Diener Jahwes, im Land Moab nach dem Wort Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Mund Jahwes hin“; die Wendung kann auch mit „auf Befehl Jahwes“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starb
  rationale: Das Wayyiqtol führt die Erzählung zum nächsten Ereignis. „So starb“ gibt sowohl die Abfolge als auch den Kernsinn von מות in natürlichem Deutsch wieder.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf den unmittelbar zuvor genannten Ort zurück.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des Personennamens.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד kann „Sklave“ oder „Diener“ bedeuten; hier ist es ein ehrender Titel für Mose. „Diener“ entspricht dieser Funktion, ohne den Aspekt rechtlicher Unfreiheit in den Vordergrund zu rücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen geläufige Wiedergabe des göttlichen Eigennamens JHWH und bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: im Land Moab
  rationale: Die ausdrückliche Nennung von אֶרֶץ („Land“) und die geografische Hervorhebung werden beibehalten.
- source_word: עַל פִּי יְהוָה
  choice: nach dem Wort Jahwes
  rationale: Die Wendung bedeutet wörtlich „auf den Mund Jahwes hin“ und bezeichnet ein Geschehen gemäß Jahwes Wort oder Befehl. „Nach dem Wort Jahwes“ ist verständlich und bewahrt mehr von der Form und Mehrdeutigkeit als die engere Wiedergabe „auf Befehl Jahwes“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ gibt ihn in der üblichen deutschen Form wieder, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutungsnuance von עֶבֶד als Titel des Mose
  choice: Diener
  alternative: Sklave
  rationale: Obwohl עֶבֶד auch einen Sklaven bezeichnen kann, fungiert die Verbindung hier als ehrender Beziehungs- und Amtstitel. „Sklave“ würde den rechtlichen Status stärker betonen, als es der Zusammenhang nahelegt.
- issue: Deutung von עַל פִּי יְהוָה
  choice: nach dem Wort Jahwes
  alternative: auf Befehl Jahwes; auf den Mund Jahwes hin
  rationale: Die gewählte Fassung lässt offen, ob vor allem Jahwes Ausspruch oder sein Befehl gemeint ist, und vermeidet eine spekulative Auslegung der wörtlichen Wendung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und erzählerisch; die Apposition „der Diener Jahwes“ kennzeichnet Mose ehrend. Die ungewöhnliche Bildsprache der Schlusswendung wird in der Fußnote bewahrt.
