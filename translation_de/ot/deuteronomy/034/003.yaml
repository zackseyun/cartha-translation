  text: וְ/אֶת הַ/נֶּ֗גֶב וְֽ/אֶת הַ/כִּכָּ֞ר בִּקְעַ֧ת יְרֵח֛וֹ עִ֥יר הַ/תְּמָרִ֖ים עַד צֹֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: de
  text: und den Negev[a] und die Ebene, das Tal von Jericho, der Palmenstadt, bis nach Zoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Süden«. Das hebräische Wort kann sowohl den Negev als geografische Region als auch den Süden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: den Negev
  rationale: In der Aufzählung der Gebiete ist נגב am ehesten als geografischer Eigenname zu verstehen; die Transliteration bewahrt diesen Ortsbezug.
- source_word: הַכִּכָּר
  choice: die Jordanebene
  rationale: כִּכָּר bezeichnet hier geografisch die Ebene beziehungsweise den Bezirk im Jordantal. »Jordanebene« ist im Deutschen klarer als das isolierte »die Ebene« und vermeidet die wörtliche, hier missverständliche Bedeutung »Kreis«.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: die Talebene von Jericho
  rationale: בִּקְעָה bezeichnet ein breites Tal oder eine Ebene. »Talebene« bewahrt beide Aspekte und unterscheidet den Ausdruck von der vorangehenden Jordanebene.
- source_word: עִיר הַתְּמָרִים
  choice: der Palmenstadt
  rationale: Die Konstruktverbindung ist eine bildhafte Bezeichnung Jerichos. »Palmenstadt« ist natürliches, knappes Deutsch und bewahrt das Bild.
- source_word: עַד צֹעַר
  choice: bis nach Zoar
  rationale: עַד gibt die räumliche Erstreckung bis zu einem Grenzpunkt an; bei einem Ortsnamen ist »bis nach Zoar« idiomatisches Deutsch.
- source_word: וְאֶת ... וְאֶת
  choice: und ... und
  rationale: Die wiederholte Konjunktion samt Objektmarker führt die Aufzählung dessen fort, was Mose gezeigt wird. Das wiederholte »und« erhält den kumulativen Stil.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Folge des Hebräischen bleibt durch Kommas erhalten; »Jordanebene« und »Talebene« machen die beiden verwandten geografischen Ausdrücke verständlich, ohne sie gleichzusetzen.
