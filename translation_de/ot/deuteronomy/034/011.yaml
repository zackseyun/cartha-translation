base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: de
  text: bei all den Zeichen und Wundern, zu denen Jahwe ihn gesandt hatte, um sie im Land Ägypten für den Pharao, für alle seine Diener und für sein ganzes Land[a] zu vollbringen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen sein ganzes Land“ beziehungsweise „in seinem ganzen Land“. Die hebräische Präposition kann hier unterschiedliche Beziehungen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: bei all den Zeichen und Wundern
  rationale: Das einleitende לְכָל führt die Aussage des vorherigen Verses fort und bezeichnet den Bereich, in dem Mose unvergleichlich war. „Bei all den“ stellt diese syntaktische Verbindung im Deutschen natürlich her; „Zeichen und Wunder“ gibt die feste hebräische Wortverbindung präzise und geläufig wieder.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: zu denen Jahwe ihn gesandt hatte, um sie … zu vollbringen
  rationale: Die Formulierung bewahrt sowohl das Senden Moses durch Jahwe als auch den Zweck, die Zeichen und Wunder auszuführen. „Vollbringen“ klingt im Deutschen bei außergewöhnlichen Taten natürlicher als das formal nähere „tun“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei und entspricht dem gehobenen Erzählstil.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: am Pharao, an all seinen Dienern
  rationale: „An“ gibt die relationale beziehungsweise zielgerichtete Bedeutung der Präposition לְ wieder, ohne sie ausdrücklich auf „gegen“ festzulegen. „Diener“ ist die direkte Entsprechung von עֲבָדִים; im höfischen Zusammenhang können damit auch Amtsträger gemeint sein.
- source_word: וּלְכָל אַרְצוֹ
  choice: und an seinem ganzen Land
  rationale: Die parallele Wiedergabe mit „an“ bleibt nahe an der hebräischen Konstruktion. Da die Präposition hier auch eine Wirkung gegen das Land oder eine Ausdehnung über das ganze Land ausdrücken kann, wird die Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zielrichtung der Zeichen und Wunder
  choice: am Pharao, an all seinen Dienern und an seinem ganzen Land
  alternative: gegen den Pharao, gegen all seine Diener und gegen sein ganzes Land
  rationale: Die Präposition לְ lässt hier sowohl eine allgemeine relationale Zielrichtung als auch eine feindliche Wirkung zu. Der Haupttext entscheidet sich für die offenere Formulierung; die stärker adversative und die räumliche Deutung werden nicht ausgeschlossen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Der Vers bleibt als syntaktische Fortsetzung von Vers 10 bewusst ein Satzfragment und endet daher mit einem Komma.
