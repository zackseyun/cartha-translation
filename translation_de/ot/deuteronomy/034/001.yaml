source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: de
  text: 'Dann stieg Mose aus den Ebenen Moabs auf den Berg Nebo, auf den Gipfel des Pisga, der Jericho gegenüberliegt. Und Jahwe zeigte ihm das ganze Land: Gilead bis Dan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: stieg … auf
  rationale: עלה bezeichnet hier eine Aufwärtsbewegung; „stieg … auf“ ist im Deutschen natürlich und bewahrt die räumliche Richtung.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: aus den Ebenen Moabs
  rationale: עַרְבוֹת bezeichnet die Steppen- beziehungsweise Ebenenlandschaft; „Ebenen Moabs“ ist klar und geografisch passend.
- source_word: אֶל הַר נְבוֹ
  choice: auf den Berg Nebo
  rationale: Die Verbindung הַר mit dem Ortsnamen wird im Deutschen idiomatisch als „Berg Nebo“ wiedergegeben; אֶל bezeichnet hier das Ziel der Aufwärtsbewegung.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: auf den Gipfel des Pisga
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier aber die Spitze beziehungsweise den Gipfel. Der bestimmte Ausdruck הַפִּסְגָּה wird als geografische Bezeichnung „Pisga“ verstanden.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: der Jericho gegenüberliegt
  rationale: עַל־פְּנֵי beschreibt in diesem geografischen Zusammenhang die Lage gegenüber beziehungsweise mit Blick auf Jericho.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: Und Jahwe zeigte ihm
  rationale: Die Hifil-Form von ראה hat kausative Bedeutung („sehen lassen“) und wird natürlich mit „zeigte“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: הָאָרֶץ meint im Kontext das vor Mose liegende Land, nicht die gesamte Erde.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: Gilead bis nach Dan
  rationale: Die Wendung konkretisiert den sichtbaren Landbereich; עַד markiert dessen Ausdehnung bis Dan.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, statt ihn durch einen Titel zu ersetzen.
- issue: Kausative Bedeutung von וַיַּרְאֵהוּ
  choice: zeigte ihm
  alternative: ließ ihn … sehen
  rationale: Beide Wiedergaben entsprechen dem Hifil von ראה. „Zeigte ihm“ ist natürlich und lässt offen, ob eine übernatürliche Befähigung zum Sehen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem erzählenden hebräischen Ablauf, ohne unnötige Archaismen. Der Doppelpunkt macht deutlich, dass „Gilead bis nach Dan“ das zuvor genannte Land näher bestimmt.
