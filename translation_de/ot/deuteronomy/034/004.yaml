base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihm: „Das ist das Land, das ich Abraham, Isaak und Jakob mit einem Eid zugesagt habe, als ich sagte: ‚Deiner Nachkommenschaft[a] werde ich es geben.‘ Ich habe dich das Land mit deinen eigenen Augen sehen lassen, aber du wirst nicht dorthin hinübergehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „deinem Samen“. Das hebräische Wort steht in der Einzahl, wird hier aber als Sammelbegriff gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Form des göttlichen Eigennamens bewahrt den Bundesnamen des hebräischen Textes.
- source_word: זֹאת הָאָרֶץ
  choice: Das ist das Land
  rationale: Im Zusammenhang bezeichnet אֶרֶץ das verheißene Land; „Land“ ist präzise und natürlich.
- source_word: נִשְׁבַּעְתִּי
  choice: unter Eid versprochen habe
  rationale: Die Formulierung gibt sowohl den Schwurcharakter des Verbs als auch den Inhalt der Landverheißung in natürlichem Deutsch wieder.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die drei Empfänger des Eides werden vollständig und in der Reihenfolge des hebräischen Textes genannt; eine Wiederholung von „gegenüber“ oder „für“ wäre im Deutschen schwerfällig.
- source_word: לֵאמֹר
  choice: als ich sagte
  rationale: Leitet den wörtlichen Inhalt des Eides idiomatisch ein.
- source_word: לְזַרְעֲךָ
  choice: Deinen Nachkommen
  rationale: זֶרַע ist grammatisch singularisch und kollektiv gebraucht. „Nachkommen“ ist im modernen Deutschen natürlich, ohne die gemeinte Vielheit näher festzulegen.
- source_word: אֶתְּנֶנָּה
  choice: werde ich es geben
  rationale: Bewahrt die Verheißungsformel und den Bezug auf das Land.
- source_word: הֶרְאִיתִיךָ
  choice: Ich habe dich das Land ... sehen lassen
  rationale: Die kausative Hifil-Form von ראה wird durch „sehen lassen“ ausdrücklich wiedergegeben.
- source_word: בְּעֵינֶיךָ
  choice: mit eigenen Augen
  rationale: Gibt die hebräische Betonung der persönlichen, unmittelbaren Wahrnehmung idiomatisch wieder.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: aber du wirst nicht dorthin hinübergehen
  rationale: „Aber“ macht den sachlichen Gegensatz zwischen Sehen und Nicht-Hinübergehen deutlich; „hinübergehen“ bewahrt das räumliche Bild des Überschreitens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von זֶרַע in der Verheißung an die Erzväter
  choice: Nachkommen
  alternative: Same
  rationale: Das hebräische Wort steht im Singular, hat hier aber kollektive Bedeutung. „Nachkommen“ wahrt diese Offenheit in verständlichem Gegenwartsdeutsch; die wörtlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar gegliedert; der Schwurcharakter der Verheißung und der Kontrast zwischen dem Sehen des Landes und dem verwehrten Hinübergehen werden bewahrt.
