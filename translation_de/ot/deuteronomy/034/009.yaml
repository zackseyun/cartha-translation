base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: de
  text: Josua, der Sohn Nuns, war erfüllt vom Geist der Weisheit[a], denn Mose hatte ihm die Hände aufgelegt. So hörten die Israeliten auf ihn und taten, was Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „war voll von einem Geist der Weisheit“. Die hebräische Wendung kann allgemeiner verstanden werden oder spezifischer als Hinweis auf eine göttliche Befähigung.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: war erfüllt vom Geist der Weisheit
  rationale: Die deutsche Wendung gibt den hebräischen Prädikatsausdruck natürlich und würdig wieder. „Geist der Weisheit“ bewahrt die mögliche göttliche Dimension, ohne die genaue Identität des Geistes im Haupttext festzulegen.
- source_word: רוּחַ
  choice: Geist
  rationale: Im Zusammenhang bezeichnet das Wort eine Befähigung, die sich in Weisheit zeigt. „Geist“ erhält sowohl die allgemeinere als auch die auf göttliches Wirken bezogene Lesart.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: hatte ihm die Hände aufgelegt
  rationale: Dies ist die natürliche deutsche Wiedergabe der formellen Handlung des Handauflegens; das Plusquamperfekt verdeutlicht, dass sie Josuas Erfüllung vorausging.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: hörten ... auf ihn
  rationale: Die deutsche Redewendung drückt sowohl aufmerksames Hören als auch Gehorsam aus und passt zur anschließenden Aussage über ihr Handeln.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste Volksbezeichnung ist im modernen Deutschen die natürliche inklusive Wiedergabe dieser hebräischen Gruppenbezeichnung; das wörtliche „Söhne Israels“ könnte hier fälschlich nur männliche Personen nahelegen.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: handelten, wie Jahwe es Mose geboten hatte
  rationale: Die Formulierung ist idiomatisch und bewahrt den Sinn, dass Israel gemäß dem zuvor an Mose ergangenen Gebot handelte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Wiedergabe des Gottesnamens gibt das Tetragramm als Eigennamen wieder.
theological_decisions:
- issue: Ob רוּחַ חָכְמָה ausdrücklich als der Heilige Geist zu verstehen ist
  choice: „Geist der Weisheit“; die Großschreibung bleibt im Deutschen wegen der Substantivorthografie theologisch unentscheidend
  alternative: „ein Geist der Weisheit“ oder eine ausdrücklich auf den Heiligen Geist festgelegte Formulierung
  rationale: Der Zusammenhang spricht für eine von Gott verliehene Befähigung, doch die hebräische Formulierung identifiziert רוּחַ nicht ausdrücklich als den Heiligen Geist. Die Übersetzung bewahrt diese Spannung; die Fußnote nennt die allgemeinere Lesart.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „die Israeliten“
  alternative: „die Söhne Israels“ oder „die Kinder Israels“
  rationale: Hier bezeichnet die Wendung das Volk als handelnde Gesamtheit. „Israeliten“ gibt den Referenzumfang im Deutschen präzise wieder, ohne Frauen aus dem angesprochenen Kollektiv auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „hörten auf ihn“ und „ihm die Hände aufgelegt“ natürliches heutiges Deutsch verwenden. Der Gottesname wird als „Jahwe“ wiedergegeben.
