base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: de
  text: und für die gesamte gewaltige Machterweisung[a] und alles große Furchtgebietende[b], das Mose vor den Augen ganz Israels[c] vollbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die starke Hand“; „Hand“ bezeichnet hier bildlich machtvolles Handeln bzw. Machterweisung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der große Schrecken“. Das hebräische Wort kann Furcht oder Schrecken, aber auch etwas Furchtgebietendes bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor den Augen ganz Israels“, das heißt öffentlich und für das ganze Volk sichtbar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: und für all
  rationale: Bewahrt sowohl die koordinierende Fortsetzung als auch die Präposition ל und den umfassenden Sinn von כֹל. Die Formulierung ist als Fortsetzung des vorhergehenden Verses zu lesen.
- source_word: הַיָּד הַחֲזָקָה
  choice: die machtvolle Hand
  rationale: Erhält das konkrete hebräische Bild der Hand als Ausdruck wirksamer Macht. „Machtvoll“ klingt im heutigen Deutsch natürlicher als „stark“, ohne das Bild in den abstrakten Begriff „Macht“ aufzulösen.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: den großen Schrecken
  rationale: מוֹרָא kann den Schrecken, die Furcht oder das Furchtgebietende bezeichnen. „Großer Schrecken“ bewahrt die stärkere und objektive Wirkung des Ausdrucks, ohne ihn zu bloßer Ehrfurcht abzuschwächen.
- source_word: אֲשֶׁר עָשָׂה
  choice: die ... wirksam werden ließ
  rationale: Das allgemeine Verb עָשָׂה bedeutet „tun/machen“. Da man im Deutschen weder eine Hand noch einen Schrecken idiomatisch „tut“, gibt diese Formulierung das tätige Hervortreten beider Größen verständlich wieder, ohne konkrete Einzelhandlungen hinzuzufügen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen eingebürgerte Namensform.
- source_word: לְעֵינֵי
  choice: vor den Augen von
  rationale: Bewahrt das anschauliche Bild des hebräischen Ausdrucks und bezeichnet zugleich die öffentliche Sichtbarkeit.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Natürliche deutsche Wiedergabe des kollektiven und umfassenden Sinnes.
theological_decisions:
- issue: Verhältnis von Gottes Macht zu Moses Handeln
  choice: Mose bleibt entsprechend dem grammatischen Satzbau das Subjekt des sichtbaren Wirkens; die Übersetzung erklärt dessen letzte Urheberschaft nicht zusätzlich.
  alternative: Die machtvolle Hand ausdrücklich Gott zuschreiben oder den Vers ausschließlich als Gottes Handeln durch Mose auslegen.
  rationale: Der hebräische Text nennt Mose als Subjekt von עָשָׂה, lässt aber das weitere theologische Verhältnis unausgeführt. Diese Spannung soll nicht durch einen erklärenden Zusatz aufgelöst werden.
- issue: Bedeutung von הַמּוֹרָא הַגָּדוֹל
  choice: den großen Schrecken
  alternative: die große Ehrfurcht; die großen furchterregenden Taten
  rationale: „Schrecken“ wahrt die kräftige Bedeutung von מוֹרָא und die Mehrdeutigkeit zwischen dem Furchtgebietenden und seiner Wirkung. Eine Erweiterung zu „Taten“ würde einen im Ausdruck nicht ausdrücklich genannten Begriff eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhaften Ausdrücke „Hand“ und „vor den Augen“ bleiben erhalten; die etwas markierte Anfangsfügung „und für“ wahrt den Anschluss an Deuteronomium 34,11. Die Prädikatsformulierung ist behutsam idiomatisiert, weil eine rein wörtliche Wiedergabe („Hand und Schrecken tun“) im Deutschen unverständlich wäre.
