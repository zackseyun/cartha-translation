  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: de
  text: Und seitdem ist in Israel kein Prophet mehr aufgetreten wie Mose[a], den Jahwe von Angesicht zu Angesicht kannte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und in Israel ist noch kein Prophet wie Mose aufgetreten.“ Das hebräische Adverb kann hier auch „noch“ bedeuten und den Zeitraum nach Mose bis zum Standpunkt des Erzählers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Und … kein
  rationale: Die Verbindung aus Konjunktion und Verneinung führt den abschließenden Rückblick fort; im Deutschen ist „Und … kein“ natürlich und fügt keinen ausdrücklich markierten Gegensatz hinzu.
- source_word: קָם
  choice: ist … aufgetreten
  rationale: קום bezeichnet hier das Auftreten eines Propheten. Das Perfekt mit „seitdem“ gibt den Rückblick vom Standpunkt des Erzählers idiomatisch wieder.
- source_word: נָבִיא
  choice: Prophet
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe von נָבִיא.
- source_word: עוֹד
  choice: seitdem … mehr
  rationale: עוֹד bezeichnet hier, dass nach Mose kein weiterer ihm vergleichbarer Prophet auftrat. Die deutsche Verbindung „seitdem … kein … mehr“ macht diese zeitliche Bedeutung klar; „bis heute“ wäre stärker als der hebräische Wortlaut.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition ב bezeichnet hier den Bereich, innerhalb dessen kein vergleichbarer Prophet auftrat.
- source_word: כְּמֹשֶׁה
  choice: wie Mose
  rationale: Die Vergleichspartikel כ wird direkt und idiomatisch mit „wie“ wiedergegeben.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen bezieht sich auf Mose als Objekt des Verbs „kannte“.
- source_word: יְדָעוֹ
  choice: kannte
  rationale: ידע mit persönlichem Objekt bedeutet hier „kennen“ und bezeichnet eine unmittelbare Beziehung, die durch den folgenden Ausdruck näher bestimmt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: פָּנִים אֶל פָּנִים
  choice: von Angesicht zu Angesicht
  rationale: Die feste deutsche Wendung bewahrt das konkrete hebräische Bild und seine Bezüge zu anderen Textstellen; eine abstrakte Wiedergabe wie „unmittelbar“ wäre deutender.
theological_decisions:
- issue: Anthropomorphe Sprache für Jahwes Beziehung zu Mose
  choice: Die Wendung „von Angesicht zu Angesicht“ bleibt erhalten.
  alternative: „den Jahwe persönlich kannte“ oder „den Jahwe unmittelbar kannte“
  rationale: Der hebräische Text verwendet konkrete Beziehungssprache. Die Übersetzung bewahrt Bild und theologische Spannung, ohne daraus eine Aussage über göttliche Körperlichkeit abzuleiten oder die einzigartige Unmittelbarkeit der Offenbarung zu verflachen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufgetreten“ ist für das Erscheinen eines Propheten idiomatisch; „von Angesicht zu Angesicht“ bewahrt bewusst den feierlichen biblischen Bildausdruck.
