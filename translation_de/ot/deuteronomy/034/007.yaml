base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: de
  text: Mose war hundertzwanzig Jahre alt, als er starb; sein Augenlicht hatte nicht nachgelassen[a], und seine Lebenskraft war nicht gewichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sein Auge war nicht schwach geworden«; gemeint ist, dass seine Sehkraft nicht nachgelassen hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Seine körperliche Frische hatte nicht nachgelassen.« Der hebräische Ausdruck bezeichnet die unverminderte Frische oder Lebenskraft des Körpers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Mose
  rationale: Das vorangestellte ו führt die Erzählung weiter. Im Deutschen ist hier kein ausdrückliches »Und« nötig; der Zusammenhang trägt die fortführende Funktion.
- source_word: בֶּן־מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: war hundertzwanzig Jahre alt
  rationale: Die hebräische Wendung »ein Sohn von X Jahren« bezeichnet das Lebensalter. Die gewählte Form ist natürliches, genaues Deutsch.
- source_word: בְּמֹתוֹ
  choice: als er starb
  rationale: Die Präposition mit dem Substantiv »Tod« und dem Suffix hat zeitliche Bedeutung. »Als er starb« gibt sie idiomatisch wieder.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: Sein Augenlicht war nicht getrübt
  rationale: כָּהָה bezeichnet hier das Trüb- oder Schwachwerden des Sehens. »Augenlicht« gibt den idiomatischen Sinn des singularischen hebräischen »Auge« in natürlichem Deutsch wieder, während »getrübt« das Bild bewahrt.
- source_word: וְלֹא נָס לֵחֹה
  choice: und seine Lebenskraft war nicht gewichen
  rationale: לֵחַ kann körperliche Frische, Saft oder unverminderte Lebenskraft bezeichnen; נוּס bedeutet wörtlich »fliehen«. »Lebenskraft war nicht gewichen« bewahrt die Bewegungsvorstellung und bleibt verständlich.
