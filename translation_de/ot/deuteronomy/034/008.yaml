  text: וַ/יִּבְכּוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת מֹשֶׁ֛ה בְּ/עַֽרְבֹ֥ת מוֹאָ֖ב שְׁלֹשִׁ֣ים י֑וֹם וַֽ/יִּתְּמ֔וּ יְמֵ֥י בְכִ֖י אֵ֥בֶל מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: de
  text: Und die Israeliten beweinten Mose dreißig Tage lang in den Ebenen Moabs. Dann war die Zeit des Weinens und der Trauer um Mose zu Ende.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: beweinten
  rationale: בכה bezeichnet das Weinen; mit einer verstorbenen Person als Objekt gibt „beweinten“ die Konstruktion im Deutschen natürlich und präzise wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wiedergabe „die Söhne Israels“ könnte im heutigen Deutsch fälschlich nur männliche Personen bezeichnen; „die Israeliten“ gibt die kollektive Bezeichnung treffend wieder.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Die hebräische Objektmarkierung wird mit dem transitiven deutschen Verb „beweinen“ durch den Akkusativ ausgedrückt.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Ebenen Moabs
  rationale: עֲרָבוֹת bezeichnet die Ebenen beziehungsweise das Steppengebiet Moabs; „Ebenen Moabs“ ist verständlich und geografisch angemessen.
- source_word: שְׁלֹשִׁים יוֹם
  choice: dreißig Tage lang
  rationale: „Lang“ kennzeichnet im natürlichen Deutschen eindeutig die Zeitdauer.
- source_word: וַיִּתְּמוּ
  choice: war … zu Ende
  rationale: תם bezeichnet hier das vollständige Ablaufen beziehungsweise Enden einer Zeitspanne; die deutsche Wendung bewahrt den resultativen Sinn ohne unnatürliche Passivform.
- source_word: יְמֵי בְכִי
  choice: die Zeit des Weinens
  rationale: Wörtlich steht „die Tage des Weinens“; „die Zeit des Weinens“ ist im Deutschen natürlicher und erhält die Bedeutung einer festgelegten Trauerperiode.
- source_word: אֵבֶל מֹשֶׁה
  choice: der Trauer um Mose
  rationale: Die Constructusverbindung bezeichnet die auf Mose bezogene Trauer. „Trauer um Mose“ ist die natürliche und semantisch eindeutige deutsche Wiedergabe.
theological_decisions: []
