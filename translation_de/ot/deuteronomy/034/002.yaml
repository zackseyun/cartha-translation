  terminology: Die Namensformen Naftali, Efraim, Manasse und Juda sind im deutschen bibelsprachlichen Gebrauch etabliert. „Westliches Meer“ vermittelt die hebräische Richtungsbezeichnung, ohne im Haupttext den interpretierenden Eigennamen „Mittelmeer“ einzusetzen. Die Fußnote nennt sowohl den wörtlichen Hintergrund als auch die referierte geografische Bedeutung.
