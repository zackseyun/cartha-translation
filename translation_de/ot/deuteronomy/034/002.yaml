  text: וְ/אֵת֙ כָּל נַפְתָּלִ֔י וְ/אֶת אֶ֥רֶץ אֶפְרַ֖יִם וּ/מְנַשֶּׁ֑ה וְ/אֵת֙ כָּל אֶ֣רֶץ יְהוּדָ֔ה עַ֖ד הַ/יָּ֥ם הָ/אַחֲרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: de
  text: und ganz Naftali, das Land von Efraim und Manasse und das ganze Land Juda bis zum westlichen Meer[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das hintere Meer“ oder „das letzte Meer“; eine hebräische Bezeichnung für das Meer im Westen, also das Mittelmeer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: ganz Naftali
  rationale: כָּל mit dem Stammesnamen bezeichnet hier das gesamte Stammesgebiet. „Ganz Naftali“ ist knapp, natürlich und lässt den geografisch-stammesbezogenen Sinn bestehen, ohne „Gebiet“ ausdrücklich hinzuzufügen.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: das Land von Efraim und Manasse
  rationale: אֶרֶץ bezeichnet Land beziehungsweise Gebiet. Die gemeinsame Konstruktion gibt die verbundenen Stammesgebiete flüssig wieder, ohne die Präposition unnötig zu wiederholen.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: das ganze Land Juda
  rationale: Die Wiedergabe behält das ausdrücklich gesetzte אֶרֶץ und damit den geografischen Schwerpunkt bei. „Land Juda“ ist in biblisch-geografischem Zusammenhang verständlich und würdevoll.
- source_word: עַד
  choice: bis zu
  rationale: עַד bezeichnet hier die räumliche Ausdehnung bis zu einem sichtbaren Grenzpunkt. In Verbindung mit „Meer“ wird „bis zu“ idiomatisch zu „bis zum“.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: das westliche Meer
  rationale: Wörtlich ist dies das „hintere/letzte Meer“, eine hebräische Richtungsbezeichnung für das Meer im Westen. „Das westliche Meer“ vermittelt den gemeinten Orientierungssinn, ohne den Eigennamen „Mittelmeer“ in den Haupttext einzutragen.
