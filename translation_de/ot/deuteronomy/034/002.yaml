  source_fidelity: 'Der Text bildet die dreifache geografische Reihung des Hebräischen zuverlässig ab: „ganz Naftali“, „das Land von Efraim und Manasse“ und „das ganze Land Juda“. „Bis zum westlichen Meer“ gibt עַד הַיָּם הָאַחֲרוֹן als räumliche Ausdehnung zutreffend wieder. Die territoriale Nuance bei den Stammesnamen bleibt gewahrt, ohne sie unzulässig zu explizieren.'
