base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: de
  text: um vor dir Völker zu vertreiben, die größer und mächtiger sind als du,[a] um dich hineinzubringen und dir ihr Land als Erbbesitz zu geben, wie es heute der Fall ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu verdrängen“. Das hebräische Verb bezeichnet hier das Entfernen der bisherigen Bewohner, sodass andere das Land erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie an diesem Tag“; eine Wendung im Sinn von „wie es heute offenkundig ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: zu vertreiben
  rationale: Im Hifil bezeichnet ירשׁ hier das Verdrängen beziehungsweise Enteignen der bisherigen Bewohner. Da Völker das Objekt sind, gibt „vertreiben“ den Sinn im Deutschen klar und natürlich wieder.
- source_word: גּוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet hier politisch-ethnische Gemeinschaften. „Völker“ ist im Deutschen kontextgemäßer als „Nationen“ und vermeidet die unpassende Wiedergabe „Heiden“.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: die größer und mächtiger sind als du
  rationale: Die von מִן markierte Vergleichsbeziehung gilt für beide Adjektive. „Größer und mächtiger“ bewahrt den Größen- und Stärkevergleich in natürlichem Deutsch.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die räumliche Wendung bezeichnet die Entfernung aus Israels unmittelbarem Weg beziehungsweise seiner Gegenwart. „Vor dir“ bewahrt das hebräische Bild.
- source_word: לַהֲבִיאֲךָ
  choice: um dich hineinzubringen
  rationale: Der Hifil von בוא bezeichnet das Hineinbringen Israels in das Land; das Ziel wird durch den folgenden Satzteil erschlossen.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: dir ihr Land zu geben
  rationale: Die Formulierung folgt der hebräischen Syntax in gut verständlichem Deutsch und lässt den Charakter des Landes als Gabe hervortreten.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: „Erbbesitz“ bezeichnet ein dauerhaft zugewiesenes Erbteil und erhält damit sowohl den Besitz- als auch den Erbgedanken von נַחֲלָה.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Die deuteronomische Wendung verweist auf den gegenwärtig erkennbaren Sachstand. Diese Wiedergabe ist modern und erhält den idiomatischen Sinn.
theological_decisions:
- issue: Bundes- und Landterminologie in נַחֲלָה
  choice: als Erbbesitz
  alternative: als Besitz
  rationale: „Erbbesitz“ bewahrt die Vorstellung einer von Gott zugewiesenen, bleibenden Landgabe, ohne über den hebräischen Ausdruck hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivfolge des hebräischen Satzes bleibt erhalten. „Erbbesitz“ trägt den zentralen Landbegriff präzise, während die Fußnoten die genuine lexikalische und idiomatische Spannweite offenlegen.
