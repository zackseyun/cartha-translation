  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: de
  text: 'Und hüte dich: Wenn du deine Augen zum Himmel erhebst und die Sonne, den Mond und die Sterne siehst – das ganze Heer des Himmels –, dann lass dich nicht dazu verleiten, dich vor ihnen niederzuwerfen und ihnen zu dienen, die Jahwe, dein Gott, allen Völkern unter dem ganzen Himmel[b] zugeteilt[a] hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugewiesen“ beziehungsweise „unter ihnen verteilt“. Der hebräische Wortlaut sagt nicht, dass Jahwe die Verehrung der Himmelskörper gebilligt hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter allen Himmeln“; die hebräische Wendung bedeutet „unter dem ganzen Himmel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Und hüte dich
  rationale: Die Verbindung leitet eine eindringliche Warnung vor einem möglichen Fehlverhalten ein. Die anschließende Wenn-dann-Struktur gibt die hebräische Abfolge in natürlichem Deutsch wieder.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: deine Augen zum Himmel erhebst
  rationale: Die körperliche Blickbewegung und das hebräische Bild bleiben erhalten.
- source_word: וְרָאִיתָ
  choice: siehst
  rationale: Das Verb gehört zur möglichen Abfolge von Aufblicken, Wahrnehmen und anschließendem Abirren; die Übersetzung macht das Sehen nicht für sich genommen zum Verbot.
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: die Sonne, den Mond und die Sterne
  rationale: Direkte und geläufige Wiedergabe der genannten Himmelskörper.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  rationale: צָבָא bezeichnet ein Heer beziehungsweise eine geordnete Schar; im Zusammenhang sind die Himmelskörper gemeint. Die Formulierung bewahrt das Bild, ohne es auf Engel einzuengen.
- source_word: וְנִדַּחְתָּ
  choice: lass dich nicht dazu verleiten
  rationale: Der Nifal von נדח beschreibt hier ein Abgebracht- oder Irregeführtwerden. Die deutsche Formulierung gibt die passive Verführung zum folgenden Götzendienst natürlich wieder, ohne Zwang zu unterstellen.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: dich vor ihnen niederzuwerfen
  rationale: Die konkrete Geste des Sich-Niederwerfens bleibt erhalten; zusammen mit dem folgenden Dienen bezeichnet sie kultische Verehrung.
- source_word: וַעֲבַדְתָּם
  choice: ihnen zu dienen
  rationale: עבד kann im kultischen Zusammenhang verehren beziehungsweise dienen bedeuten. „Dienen“ bewahrt die eigene Bedeutung neben dem Niederwerfen.
- source_word: אֲשֶׁר חָלַק
  choice: Sie hat ... zugeteilt
  rationale: חלק bedeutet teilen, zuteilen oder zuweisen. „Zugeteilt“ wahrt die Aussage des Textes, ohne ausdrücklich zu bestimmen, zu welchem Zweck die Himmelskörper den Völkern zugeteilt wurden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in einer im Deutschen gebräuchlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Schlichte, direkte Wiedergabe der Bundesanrede an Israel.
- source_word: לְכֹל הָעַמִּים
  choice: allen Völkern
  rationale: עַמִּים bezeichnet hier die Völker insgesamt; „Völker“ ist im Deutschen natürlich und vermeidet moderne staatsrechtliche Nebenbedeutungen.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: unter dem ganzen Himmel
  rationale: Die deutsche idiomatische Einzahl gibt den umfassenden Sinn der hebräischen Wendung wieder.
theological_decisions:
- issue: Bedeutung der Aussage, dass Jahwe die Himmelskörper allen Völkern zugeteilt hat
  choice: Die Zuteilung wird ausgesagt, ohne ihren Zweck näher zu bestimmen oder eine Billigung der Verehrung anzudeuten.
  alternative: Die Aussage ausdrücklich auf den allgemeinen Nutzen der Himmelskörper beziehen oder als Preisgabe der Völker an den Gestirndienst deuten.
  rationale: חלק trägt den Sinn von Zuteilen oder Zuweisen, doch der Satz nennt den Zweck nicht ausdrücklich. Da der unmittelbare Zusammenhang die Verehrung der Himmelskörper verbietet, bleibt die theologische Spannung erhalten, ohne eine weitergehende Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wenn-dann-Gliederung macht die Warnung verständlich, ohne das bloße Betrachten des Himmels als verboten darzustellen. „Heer des Himmels“ bewahrt das hebräische Bild; „Jahwe“ gibt den Gottesnamen wieder.
