  naturalness: Die Wenn-dann-Formulierung ist modernes, gut verständliches Deutsch. Mit einer Relativkonstruktion nach „Heer des Himmels“ wird der Satz zugleich natürlicher und eindeutig. „Unter dem ganzen Himmel“ ist als idiomatische Wiedergabe der hebräischen Wendung angemessen.
  terminology: „Jahwe“, „Heer des Himmels“, „sich niederwerfen“ und „dienen“ sind sachgerecht und bewahren die kultische Begriffspaarung. „Zugeteilt“ gibt חלק angemessen wieder, ohne eine Billigung des Gestirndienstes zu behaupten.
