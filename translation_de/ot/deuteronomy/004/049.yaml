  text: וְ/כָל הָ֨/עֲרָבָ֜ה עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה וְ/עַ֖ד יָ֣ם הָ/עֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: de
  text: und die ganze Araba jenseits des Jordan im Osten bis zum Meer der Araba[a], unterhalb der Hänge des Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Damit ist das Gewässer gemeint, das gewöhnlich als Totes Meer bezeichnet wird.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: die Araba
  rationale: Der geografische Eigenname bezeichnet hier die Senke des Jordangrabens; die Transkription bewahrt den konkreten Ortsbezug besser als das allgemeinere „Ebene“.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die geläufige deutsche Wendung gibt die relationale geografische Perspektive knapp und genau wieder.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Die Richtungsangabe kennzeichnet das Gebiet östlich des Jordan; „im Osten“ ist in dieser Gebietsaufzählung natürliches modernes Deutsch.
- source_word: יָם הָעֲרָבָה
  choice: das Meer der Araba
  rationale: Die wörtliche geografische Bezeichnung des Hebräischen bleibt erhalten, statt sie im Haupttext durch den später üblichen Namen „Totes Meer“ zu ersetzen.
- source_word: תַּחַת
  choice: unterhalb
  rationale: Die Präposition bezeichnet hier eine topografische Lage und wird mit „unterhalb“ präzise wiedergegeben.
- source_word: אַשְׁדֹּת
  choice: die Hänge
  rationale: Im geografischen Zusammenhang sind die Abhänge beziehungsweise Hanglagen eines Bergmassivs gemeint.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Form transkribiert.
- source_word: וְכָל
  choice: und die ganze
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Satz als auch den umfassenden Umfang der Gebietsangabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle geografische Prosa. Der Vers ist als Fortsetzung des vorausgehenden Satzes formuliert; der einleitende Anschluss „und“ bleibt daher erhalten. Der traditionelle Eigenname „Araba“ vermeidet eine vorschnelle Verallgemeinerung zu „Ebene“.
