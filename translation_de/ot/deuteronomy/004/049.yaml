  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen wieder: den Anschluss und die Gesamtheit des Gebiets, die Araba als geografischen Eigennamen, die Lage jenseits bzw. östlich des Jordan, die Ausdehnung bis zum Meer der Araba sowie die topografische Bestimmung unterhalb der Hänge des Pisga. Die räumliche Formulierung „im Osten“ ist eine sachgemäße, idiomatische Wiedergabe von מִזְרָחָה.'
