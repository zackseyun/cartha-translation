base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: de
  text: Denn Jahwe, dein Gott, ist ein barmherziger Gott[a]. Er wird dich nicht im Stich lassen[b], dich nicht vernichten und den Bund deiner Väter[c] nicht vergessen, den er ihnen geschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein mitfühlender Gott“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er wird dich nicht fallen lassen“ oder „nicht preisgeben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deiner Vorfahren“. Das Hebräische sagt „deiner Väter“ und verweist auf Israels Bundesväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung und Verheißung ein und bewahrt den erklärenden Zusammenhang.
- source_word: אֵל רַחוּם
  choice: ein barmherziger Gott
  rationale: רַחוּם bezeichnet erbarmende Zuwendung und Mitgefühl. „Barmherzig“ ist im Deutschen verständlich, würdig und in Gottesprädikationen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Bewahrt die direkte Anrede im maskulinen Singular und die persönliche Bundesbeziehung.
- source_word: לֹא יַרְפְּךָ
  choice: Er wird dich nicht fallen lassen
  rationale: Das Hifil von רפה kann „loslassen“, „im Stich lassen“ oder „preisgeben“ bedeuten. „Nicht fallen lassen“ ist gegenwärtiges, natürliches Deutsch und drückt aus, dass Gott sein Volk nicht seinem Schicksal überlässt.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: und dich nicht vernichten
  rationale: Das Hifil von שׁחת bezeichnet hier das Vernichten oder Zugrunderichten; „vernichten“ bewahrt die Stärke der Aussage.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: Er wird den Bund ... nicht vergessen
  rationale: Bewahrt das theologisch gewichtige Bild des Nichtvergessens und macht den Bund zum klaren Objekt.
- source_word: אֲבֹתֶיךָ
  choice: mit deinen Vätern
  rationale: Die Präposition „mit“ gibt im Deutschen die Beziehung des Bundes zu den Vätern idiomatisch wieder. „Väter“ bewahrt die maskuline und heilsgeschichtlich konkrete Bezeichnung.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: den er ihnen mit einem Eid zugesagt hat
  rationale: Gibt das Schwören als feierliche, eidliche Selbstverpflichtung wieder; die Relativkonstruktion bezieht sich natürlich auf den Bund.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Bundesnamen. „Jahwe“ gibt ihn im Deutschen unmittelbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֲבֹתֶיךָ
  choice: deine Väter
  alternative: deine Vorfahren
  rationale: „Väter“ wahrt die sprachliche Form und den konkreten Bezug auf Israels Bundesväter; eine Fußnote nennt die breitere idiomatische Möglichkeit.
- issue: Zeitliche Aussage der drei verneinten Verben
  choice: Er wird ... nicht
  alternative: Er lässt ... nicht
  rationale: Im Kontext der Zusicherung wird das hebräische Imperfekt als Zukunftsaussage wiedergegeben, ohne die fortdauernde Bundestreue auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Singularanrede bleibt erhalten. Kurze Hauptsätze sorgen für Klarheit; der Gottesname und die konkrete Rede von den Vätern werden quellennah bewahrt.
