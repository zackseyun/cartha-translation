  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: de
  text: 'Und er verkündete euch seinen Bund, den er euch zu tun gebot: die Zehn Worte.[a] Und er schrieb sie auf zwei Steintafeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die Zehn Worte«; traditionell: »die Zehn Gebote«.'
    reason: Die Fußnote nennt die geläufige traditionelle Wiedergabe, während der Haupttext die hebräische Eigenbezeichnung bewahrt.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: verkündete
  rationale: Das Hifil von נגד bedeutet hier »bekannt machen« oder »verkünden«. »Verkündete« wahrt den feierlichen, bundesbezogenen Ton und bleibt im modernen Deutsch verständlich.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: »Bund« ist die sachlich und theologisch angemessene deutsche Wiedergabe von בְּרִית und bewahrt sowohl den bindenden als auch den relationalen Gehalt.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: den er euch zu halten gebot
  rationale: לַעֲשׂוֹת heißt wörtlich »zu tun«. Bei einem Bund ist »halten« im Deutschen natürlich und bezeichnet die geforderte praktische Befolgung, ohne den Satz unnötig zu glätten.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: die Zehn Worte
  rationale: Die hebräische Bezeichnung lautet wörtlich »die zehn Worte«. Diese Wiedergabe folgt der Eigenbezeichnung des Ausgangstextes; die traditionelle Form »Zehn Gebote« wird in der Fußnote genannt.
- source_word: וַיִּכְתְּבֵם
  choice: Er schrieb sie
  rationale: כתב ist das gewöhnliche Verb für »schreiben«. Das Pronomen bezieht sich auf die Zehn Worte; ein stärker spezialisiertes Verb wie »eingravieren« ist vom hebräischen Wort selbst nicht gefordert.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: zwei Steintafeln
  rationale: Die knappe deutsche Zusammensetzung gibt die hebräische Konstruktverbindung natürlich und genau als Tafeln aus Stein wieder.
theological_decisions:
- issue: Wiedergabe von עֲשֶׂרֶת הַדְּבָרִים
  choice: die Zehn Worte
  alternative: die Zehn Gebote
  rationale: Der Haupttext bewahrt die wörtliche Bezeichnung des Hebräischen. Die vertraute traditionelle Benennung »Zehn Gebote« ist sachlich naheliegend, soll aber die Formulierung des Ausgangstextes nicht ersetzen.
- issue: Verhältnis des Bundes zu den Zehn Worten
  choice: Apposition nach einem Doppelpunkt
  alternative: Relativsatz oder Gleichsetzung mit erklärendem Zusatz
  rationale: Der Doppelpunkt macht im Deutschen deutlich, dass »die Zehn Worte« den zuvor genannten Bund beziehungsweise seinen hier bezeichneten Inhalt näher bestimmen, ohne über die knappe Apposition des Hebräischen hinaus eine systematische Gleichsetzung auszuformulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Verkündete« erhält den feierlichen Ton; »Steintafeln« ist natürlicher als »Tafeln aus Stein«. Der Doppelpunkt verdeutlicht die hebräische Apposition, und der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
