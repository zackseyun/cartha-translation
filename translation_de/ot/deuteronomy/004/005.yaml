base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: de
  text: Sieh, ich habe euch Ordnungen und Rechtsbestimmungen gelehrt, so wie Jahwe, mein Gott, mir geboten hat, damit ihr danach handelt in dem Land, in das ihr hineinkommt, um es in Besitz zu nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „inmitten des Landes, in das ihr hineinkommt, um es in Besitz zu nehmen“.'
    reason: Die Fußnote bewahrt die räumliche Nuance von בְּקֶרֶב („inmitten“) gegenüber dem natürlichen „in dem Land“ im Haupttext.
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ Singular dient als aufmerksamkeitslenkender Redemarker. „Sieh“ bewahrt die direkte Form und ist im gehobenen modernen Deutsch verständlich.
- source_word: לִמַּדְתִּי
  choice: ich habe euch … gelehrt
  rationale: Das Perfekt bezeichnet hier eine vollzogene Unterweisung mit bleibender Bedeutung für die gegenwärtige Ermahnung.
- source_word: חֻקִּים
  choice: Ordnungen
  rationale: Der Ausdruck bezeichnet verbindlich festgesetzte Regelungen. „Ordnungen“ wahrt den rechtlichen Klang, ohne unnötig altertümlich zu wirken.
- source_word: מִשְׁפָּטִים
  choice: Rechtsbestimmungen
  rationale: Im deuteronomischen Rechtswortschatz sind konkrete rechtliche Regelungen beziehungsweise richterlich geprägte Satzungen gemeint. „Rechtsbestimmungen“ gibt den juristischen Sinn natürlicher wieder als „Gerichte“.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Wendung bezeichnet die Übereinstimmung von Moses Lehre mit dem göttlichen Auftrag.
- source_word: יְהוָה אֱלֹהָי
  choice: Jahwe, mein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Apposition „mein Gott“ bleibt ausdrücklich erhalten.
- source_word: לַעֲשׂוֹת כֵּן
  choice: damit ihr danach handelt
  rationale: Der Infinitiv drückt hier den Zweck der Unterweisung aus. „Danach handelt“ verweist idiomatisch auf die zuvor genannten Ordnungen und Rechtsbestimmungen.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: in dem Land
  rationale: בְּקֶרֶב kann wörtlich „inmitten“ bedeuten, bezeichnet hier jedoch idiomatisch den Bereich innerhalb des Landes. Natürliches Deutsch verlangt keine räumliche Hervorhebung der Mitte.
- source_word: בָּאִים שָׁמָּה
  choice: in das ihr zieht
  rationale: Das Partizip mit dem Richtungsadverb beschreibt den bevorstehenden Zug in das Land. Die deutsche Relativkonstruktion enthält die Richtung bereits und vermeidet ein schwerfälliges zusätzliches „dorthin“.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירשׁ bezeichnet im Kontext der Landnahme den Erwerb beziehungsweise die Besitzergreifung des Landes. Diese Wiedergabe hält die Zielrichtung und das pronominale Objekt fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Bundesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Funktion von לַעֲשׂוֹת כֵּן
  choice: 'Zweck der Unterweisung: „damit ihr danach handelt“'
  alternative: 'Auftragsinhalt: „es so zu tun“'
  rationale: Die Infinitivkonstruktion lässt sich syntaktisch entweder stärker an Moses Auftrag oder an den Zweck seines Lehrens anschließen. Im Zusammenhang mit der Aufforderung an Israel ist die Zwecklesart wahrscheinlich; die Handlungsforderung bleibt in beiden Lesarten bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Klang. Der Haupttext vermeidet sowohl altertümliche Formulierungen wie „Satzungen und Rechte“ als auch die im Deutschen schwerfällige wörtliche Folge „inmitten des Landes … dorthin“. Der Fußnotenmarker [a] steht unmittelbar am Ende der betreffenden Aussage.
