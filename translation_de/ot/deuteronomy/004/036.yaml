  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: de
  text: Vom Himmel her ließ er dich seine Stimme hören, um dich zu erziehen[a]; und auf der Erde ließ er dich sein großes Feuer sehen, und du hörtest seine Worte mitten aus dem Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um dich zu unterweisen«, »um dich zurechtzuweisen« oder »um dich zu züchtigen«; das hebräische Verb kann sowohl formende Erziehung als auch korrigierende Disziplin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Vom Himmel her
  rationale: Gibt die Herkunftsangabe natürlich wieder und bewahrt den räumlichen Gegensatz zu »auf der Erde«.
- source_word: הִשְׁמִיעֲךָ
  choice: ließ er dich … hören
  rationale: Die deutsche Kausativumschreibung gibt den Hifil von שׁמע idiomatisch wieder, ohne bloßes Zulassen ausdrücken zu wollen.
- source_word: קֹלוֹ
  choice: seine Stimme
  rationale: Im Zusammenhang göttlicher Rede bezeichnet קוֹל die hörbare Stimme, nicht nur einen unbestimmten Laut.
- source_word: לְיַסְּרֶךָּ
  choice: um dich zu erziehen
  rationale: יסר umfasst formende Unterweisung ebenso wie zurechtweisende Disziplin. »Erziehen« hält im Deutschen beide Aspekte eher zusammen als das härter klingende »züchtigen«.
- source_word: וְעַל הָאָרֶץ
  choice: und auf der Erde
  rationale: Bewahrt den kosmischen Gegensatz zum Himmel; »Land« wäre hier unnötig verengend.
- source_word: הֶרְאֲךָ
  choice: ließ er dich … sehen
  rationale: Gibt die kausative Form von ראה natürlich wieder und bildet zugleich eine passende Parallele zu »ließ er dich … hören«.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: sein großes Feuer
  rationale: Direkte und anschauliche Wiedergabe ohne erklärende Erweiterung.
- source_word: וּדְבָרָיו
  choice: seine Worte
  rationale: Bewahrt den im Hebräischen ausdrücklich stehenden Plural und die konkrete Redevorstellung.
- source_word: שָׁמַעְתָּ
  choice: du hörtest
  rationale: Gibt das tatsächliche Hören in der erzählten Vergangenheit präzise und in würdigem Register wieder.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Bewahrt sowohl die Herkunftsrichtung von מִן als auch die Vorstellung des Inneren beziehungsweise der Mitte des Feuers und klingt im Deutschen natürlich.
theological_decisions:
- issue: Pädagogischer Zweck von לְיַסְּרֶךָּ
  choice: um dich zu erziehen
  alternative: um dich zu unterweisen; um dich zurechtzuweisen; um dich zu züchtigen
  rationale: Die Formulierung wahrt die Spannung zwischen formender Unterweisung und korrigierender Disziplin, ohne den Ausdruck auf Strafe oder reine Belehrung zu verengen.
- issue: Konkrete Sprache der göttlichen Selbstoffenbarung
  choice: seine Stimme … sein großes Feuer … seine Worte
  alternative: abstraktere Umschreibungen der Offenbarung
  rationale: Die konkrete Bild- und Redeweise des Hebräischen bleibt erhalten, ohne sie zu vergeistigen oder dogmatisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die parallelen Kausativformulierungen »ließ er dich … hören/sehen« spiegeln die hebräischen Hifilformen. »Mitten aus dem Feuer« erhält die räumliche Anschaulichkeit. Der im englischen Beratungstext bei »great fire« gesetzte Marker b bezog sich offenbar auf מִתּוֹךְ הָאֵשׁ; da die gewählte deutsche Wiedergabe diese Bedeutung bereits unmittelbar ausdrückt, ist keine zusätzliche Fußnote nötig.
