  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: de
  text: 'Denn frage doch nach den früheren Tagen, die vor dir waren: von dem Tag an, als Gott den Menschen[a] auf der Erde schuf, und von einem Ende des Himmels bis zum anderen. Ist je etwas wie dieses große Ereignis geschehen, oder hat man je von etwas Derartigem gehört?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Das hebräische Wort אָדָם kann hier den Menschen repräsentativ für die gesamte Menschheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: frage doch
  rationale: Der Imperativ mit נָא ist eine nachdrückliche Aufforderung. „Frage doch“ klingt im heutigen Deutsch natürlich und bewahrt den appellativen Ton.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: nach den früheren Tagen
  rationale: Die Wendung bezeichnet die weit zurückliegende Vergangenheit. „Nach den früheren Tagen fragen“ gibt sowohl die Präposition als auch den historischen Rückblick angemessen wieder.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: die vor dir waren
  rationale: 'Die Formulierung wahrt den zeitlichen Sinn: Es geht um die Zeit, die der angesprochenen Generation vorausging.'
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: von dem Tag an, als … schuf
  rationale: Damit wird der Ausgangspunkt des gesamten geschichtlichen Rückblicks im Deutschen klar bezeichnet.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang ist der eine Schöpfer gemeint; „Gott“ ist daher die sachgemäße Standardwiedergabe.
- source_word: אָדָם
  choice: den Menschen
  rationale: אָדָם steht hier im Singular, kann im Schöpfungszusammenhang aber den Menschen repräsentativ beziehungsweise die Menschheit als Ganze bezeichnen. „Den Menschen“ bewahrt den Singular und lässt diesen kollektiven Sinn im Deutschen zu.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Dies ist die klare und natürliche lokale Wiedergabe.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: und von einem Ende des Himmels bis zum anderen
  rationale: Die Wendung ist ein Merismus für die größtmögliche räumliche Ausdehnung. Der deutsche Singular „Himmel“ ist in dieser festen räumlichen Vorstellung natürlicher als „Himmel“ im Plural und gibt den Sinn ohne unnötige Fremdheit wieder.
- source_word: הֲנִהְיָה כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: Ist je etwas so Großes geschehen
  rationale: היה fragt hier nach dem Geschehen eines vergleichbaren Ereignisses; דָּבָר bezeichnet entsprechend eine Sache oder ein Ereignis. Die Formulierung erhält die rhetorische Kraft und vermeidet das im Deutschen schwerfällige „eine so große Sache“.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: oder hat man je von etwas Derartigem gehört?
  rationale: Das Niphal von שׁמע meint hier, dass etwas berichtet beziehungsweise bekannt geworden ist. Die unpersönliche deutsche Konstruktion gibt den passiven Sinn idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von אָדָם im Schöpfungszusammenhang
  choice: den Menschen
  alternative: die Menschheit; Adam
  rationale: Der Vers blickt von der Erschaffung des Menschen an auf die gesamte Geschichte zurück. Der hebräische Singular kann sowohl repräsentativ für die Menschheit stehen als auch an den zuerst geschaffenen Menschen denken lassen. „Den Menschen“ bewahrt diese Spannung besser als das abstraktere „die Menschheit“ oder der eindeutig als Eigenname verstandene Ausdruck „Adam“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eröffnende Kausalsatz „Denn“ verbindet den Vers mit dem vorausgehenden Gedankengang. Doppelpunkt und Satzteilung machen den weit gespannten zeitlichen und räumlichen Vergleich verständlich, ohne die rhetorische Struktur des Hebräischen aufzulösen.
