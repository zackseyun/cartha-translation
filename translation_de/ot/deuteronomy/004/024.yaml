base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: de
  text: Denn Jahwe, dein Gott, ist ein verzehrendes Feuer, ein eifersüchtiger Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein leidenschaftlich eifernder Gott“. Das hebräische Wort betont besonders im Zusammenhang mit Götzendienst Jahwes ausschließlichen Bundesanspruch auf sein Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt deren erklärende Funktion in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen etablierte Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Bewahrt die Possessivform der Anrede in der zweiten Person Singular und damit ihren bundesbezogenen Charakter.
- source_word: אֵשׁ אֹכְלָה
  choice: ein verzehrendes Feuer
  rationale: Gibt die substantivisch-partizipiale Bildsprache eng und zugleich idiomatisch wieder; das Bild von Heiligkeit und Gericht bleibt ungemildert erhalten.
- source_word: הוּא
  choice: ist
  rationale: Die Hervorhebung des selbstständigen Pronomens wird in der natürlichen deutschen Prädikatskonstruktion ausgedrückt; ein zusätzliches „er“ wäre schwerfällig.
- source_word: אֵל
  choice: Gott
  rationale: Das Gottesprädikat steht appositionell und wird im Deutschen am natürlichsten mit „Gott“ wiedergegeben.
- source_word: קַנָּא
  choice: eifersüchtiger
  rationale: Bezeichnet hier Jahwes ausschließlichen Bundesanspruch und seine Unvereinbarkeit mit der Verehrung anderer Götter; „eifersüchtig“ bewahrt die relationale Spannung.
theological_decisions:
- issue: Wiedergabe der göttlichen Eifersucht
  choice: ein eifersüchtiger Gott
  alternative: ein leidenschaftlich eifernder Gott
  rationale: Im Zusammenhang der Warnung vor Götzendienst steht Gottes ausschließlicher Anspruch auf sein Volk im Vordergrund. „Eifersüchtig“ bewahrt diese theologische und relationale Spannung, ohne sie zu bloßem Eifer abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und quellennah formulierte Metapher „verzehrendes Feuer“ bleibt erhalten. Die Singularanrede „dein“ entspricht dem hebräischen Text.
