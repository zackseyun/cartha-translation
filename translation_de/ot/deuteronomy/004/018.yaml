  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: de
  text: die Gestalt[a] irgendeines Kriechtiers auf dem Erdboden, die Gestalt irgendeines Fisches, der im Wasser unter der Erde[b] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abbild«, »Ähnlichkeit« beziehungsweise »Form« (hebräisch תַּבְנִית).'
    reason: lexical_alternative
  - marker: b
    text: »Unter der Erde« greift eine feste biblische Wendung für die Wasser unter dem Land auf; vergleiche die Formulierung des Bilderverbots in 2. Mose 20,4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: Gestalt
  rationale: Im Zusammenhang des Bilderverbots bezeichnet das Wort die sichtbare Form beziehungsweise deren gestaltete Darstellung. »Gestalt« bewahrt diese Bedeutungsbreite, ohne vorschnell ein bestimmtes Bildwerk oder Götzenbild vorauszusetzen.
- source_word: כָּל
  choice: irgendeines
  rationale: 'Bei den einzelnen Gattungsbezeichnungen gibt »irgendeines« die distributive und umfassende Kraft idiomatisch wieder: Kein Exemplar der genannten Schöpfungsbereiche ist ausgenommen.'
- source_word: רֹמֵשׂ
  choice: Kriechtier
  rationale: Das Wort bezeichnet hier ein Lebewesen, das sich am Boden fortbewegt. »Kriechtier« ist im Deutschen verständlich und bewahrt die im Kontext verwendete Geschöpfkategorie.
- source_word: בָּאֲדָמָה
  choice: auf dem Erdboden
  rationale: אֲדָמָה meint hier die Boden- oder Landfläche, auf der sich das Tier bewegt. »Auf dem Erdboden« ist räumlich klar und entspricht der hebräischen Präposition.
- source_word: דָּגָה
  choice: Fisch
  rationale: Das Substantiv kann kollektiv für Fische stehen. In Verbindung mit כָּל wird dies im Deutschen natürlich durch »irgendeines Fisches« ausgedrückt.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: der im Wasser … ist
  rationale: Der Relativsatz bleibt ausdrücklich erhalten. Der grammatische Plural מַיִם wird im heutigen Deutschen idiomatisch mit dem singularischen Stoffnamen »Wasser« wiedergegeben.
- source_word: מִתַּחַת לָאָרֶץ
  choice: unter der Erde
  rationale: Die Formulierung bewahrt den räumlichen Ausdruck des Hebräischen und den Anklang an die Bilderverbotsformel in 2. Mose 20,4, ohne das antike Weltbild erklärend in den Haupttext einzutragen.
theological_decisions:
- issue: Bezeichnung der verbotenen Darstellung im Zusammenhang des Bilderverbots
  choice: die Gestalt irgendeines …
  alternative: das Abbild irgendeines … / die Ähnlichkeit irgendeines …
  rationale: »Gestalt« gibt תַּבְנִית breit wieder und vermeidet es, den Ausdruck auf ein bestimmtes Medium oder ausdrücklich auf ein Götzenbild zu verengen. Dass es um hergestellte Darstellungen geht, ergibt sich aus dem unmittelbaren Zusammenhang.
- issue: Kosmologische Formulierung für die Wasser
  choice: im Wasser unter der Erde
  alternative: im Wasser unterhalb des Landes
  rationale: Die wörtlich-räumliche Wendung erhält die Spannung und den intertextuellen Bezug zur Bilderverbotsformel, statt sie an ein modernes kosmologisches Modell anzupassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist entsprechend der Vorlage als Fortsetzung eines Satzes kleingeschrieben. Die wiederholte Satzstruktur des Hebräischen bleibt erhalten; Fachsprache und konfessionell geprägte Zusätze werden vermieden.
