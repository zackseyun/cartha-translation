  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Herz“ und „Seele“ bewahren die etablierte deuteronomische Hingabeformel; die Fußnote erklärt bei „Seele“ sachgerecht den umfassenderen Bedeutungsbereich von נֶפֶשׁ, ohne eine dogmatische Anthropologie festzulegen.
