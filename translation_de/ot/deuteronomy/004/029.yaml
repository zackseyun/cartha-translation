language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: de
  text: Doch von dort aus werdet ihr Jahwe, deinen Gott, suchen[a], und du wirst ihn finden, wenn du mit deinem ganzen Herzen und mit deiner ganzen Seele[b] nach ihm suchst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text beginnt mit „ihr werdet suchen“ und wechselt dann zu „deinen Gott“ und „du wirst finden“. Israel wird dabei zugleich als Gemeinschaft und als eine Einheit angesprochen.
    reason: textual_grammar
  - marker: b
    text: „Seele“ kann hier auch „Leben“ oder „ganzes Wesen“ bedeuten; das hebräische Wort bezeichnet oft den ganzen lebendigen Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: Doch von dort aus werdet ihr … suchen
  rationale: Das einleitende ו wird im Zusammenhang als fortführender Kontrast wiedergegeben; מִשָּׁם bezeichnet den Ausgangspunkt der Suche unter den Völkern. Die Zukunftsform entspricht dem vorausschauenden Zusammenhang.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott
  rationale: Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben. Der Singular „deinen“ bewahrt den auffälligen Numeruswechsel des masoretischen Textes.
- source_word: וּמָצָאתָ
  choice: und du wirst ihn finden
  rationale: Das im Hebräischen nicht wiederholte Objekt wird aus dem vorhergehenden Satzglied eindeutig ergänzt. Der Singular der Verbform bleibt erhalten.
- source_word: כִּי
  choice: wenn
  rationale: כִּי führt hier die Bedingung beziehungsweise den Zeitpunkt des Findens ein. Das deutsche „wenn“ lässt diese in diesem Zusammenhang eng verwandten Nuancen offen.
- source_word: תִדְרְשֶׁנּוּ
  choice: nach ihm suchst
  rationale: דרש bezeichnet hier das ernsthafte, auf Gott gerichtete Suchen; das angehängte Pronomen wird ausdrücklich wiedergegeben.
- source_word: בְּכָל לְבָבְךָ
  choice: mit deinem ganzen Herzen
  rationale: לֵבָב meint das innere Denken, Wollen und Empfinden. Die geläufige deutsche Wendung gibt den Anspruch ungeteilter Hingabe natürlich wieder.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: und mit deiner ganzen Seele
  rationale: נֶפֶשׁ bezeichnet hier den ganzen lebendigen Menschen. „Seele“ bewahrt die vertraute deuteronomische Formel; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt den offenbarten Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Numeruswechsel von der Mehrzahl zur Einzahl
  choice: werdet ihr … deinen … du
  alternative: durchgehend „ihr/euer/euch“
  rationale: Der masoretische Text wechselt nach dem ersten Verb von der Anrede Israels in der Mehrzahl zur Einzahl. Die Übersetzung bewahrt diese kollektive und individuelle Spannung, statt sie anzugleichen.
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: Seele
  alternative: Leben; ganzes Wesen
  rationale: „Seele“ erhält die literarische und theologische Verbindung der deuteronomischen Hingabeformel, darf hier aber nicht auf einen vom Körper getrennten Teil des Menschen verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällige Numeruswechsel wird bewusst beibehalten und erläutert. „Von dort aus“ klingt idiomatisch und wahrt den räumlichen Ausgangspunkt; „nach ihm suchen“ vermeidet eine unnatürliche Wiederholung von „suchen“ mit direktem Objekt.
