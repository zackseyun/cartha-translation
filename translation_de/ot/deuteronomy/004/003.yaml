source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: de
  text: Ihr habt mit eigenen Augen gesehen, was Jahwe bei Baal-Peor[a] getan hat; denn jeden Mann, der dem Baal-Peor folgte, hat Jahwe, dein Gott, aus deiner Mitte vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des Baal-Peor“. Die Präposition kann den Ort bzw. das mit Baal-Peor verbundene Geschehen bezeichnen, möglicherweise auch den Anlass.'
    reason: Die Fußnote bewahrt die mögliche kausale Deutung von בְּ, ohne sie im Haupttext als einzig mögliche Lesart festzulegen.
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Ihr habt mit eigenen Augen gesehen
  rationale: Die hebräische Konstruktion hebt die Augen der Angeredeten als Augenzeugen hervor. Die deutsche Wendung gibt diesen Nachdruck natürlich wieder.
- source_word: עָשָׂה
  choice: getan hat
  rationale: Das Verb bezeichnet hier Jahwes Handeln im Gericht; das Perfekt passt zum Rückblick auf ein von den Angeredeten erlebtes Ereignis.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּבַעַל פְּעוֹר
  choice: wegen des Baal-Peor
  rationale: בְּ kann hier den Anlass beziehungsweise Zusammenhang des Gerichtshandelns bezeichnen. Im Kontext von Numeri 25 ist „wegen des Baal-Peor“ im Deutschen klarer als das missverständliche örtliche „bei Baal-Peor“.
- source_word: כִּי
  choice: ':'
  rationale: 'Der Doppelpunkt gibt die erläuternde Funktion der Partikel natürlich wieder: Der folgende Satz erklärt, was Jahwe getan hat.'
- source_word: כָּל הָאִישׁ
  choice: jeden Mann
  rationale: Der maskuline distributive Singular wird formal bewahrt und dient zugleich als vorangestelltes Objekt des folgenden Satzes.
- source_word: הָלַךְ אַחֲרֵי
  choice: nachlief
  rationale: Die Wendung beschreibt das Folgen in religiöser Gefolgschaft. „Nachlaufen“ bewahrt das Bild und trägt im Deutschen den Beiklang fehlgeleiteter Hingabe.
- source_word: הִשְׁמִידוֹ
  choice: hat … vernichtet
  rationale: Der Hifil von שׁמד bezeichnet vollständiges Beseitigen oder Vertilgen. Durch die Voranstellung von „jeden Mann“ ist das pronominale Objekt der hebräischen Verbform im Deutschen bereits eindeutig ausgedrückt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der hebräische Text wechselt von der pluralischen Anrede am Versanfang zum kollektiven Singular; dieser Wechsel wird bewahrt.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die Wendung bezeichnet die Entfernung aus der Mitte der als Einheit angesprochenen Gemeinschaft und bewahrt den kollektiven Singular.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen. „Jahwe“ erhält ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בְּבַעַל פְּעוֹר
  choice: wegen des Baal-Peor
  alternative: bei Baal-Peor / im Fall des Baal-Peor
  rationale: Die Präposition lässt eine situative oder kausale Deutung zu. Der Kontext spricht für das Ereignis und den Anlass des Gerichts, nicht eindeutig für einen Ort; die Fußnote macht die Spannweite sichtbar.
- issue: Numeruswechsel in der Anrede
  choice: Ihr habt … dein Gott … deiner Mitte
  alternative: Ihr habt … euer Gott … eurer Mitte
  rationale: Der auffällige Wechsel vom Plural עֵינֵיכֶם zum kollektiven Singular אֱלֹהֶיךָ und מִקִּרְבֶּךָ gehört zum hebräischen Text und wird nicht geglättet.
- issue: Maskuliner distributiver Singular כָּל הָאִישׁ
  choice: jeden Mann
  alternative: jeden / alle
  rationale: Die Übersetzung bewahrt die ausdrücklich maskuline Singularform und ihren distributiven Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von pluralischer zu kollektiv-singularischer Anrede ist bewusst erhalten. „Baal-Peor“ erhält den bestimmten Artikel, wie er bei Namen heidnischer Gottheiten im Deutschen möglich ist; die Satzstellung vermeidet ein unidiomatisches wiederholtes Objektpronomen.
