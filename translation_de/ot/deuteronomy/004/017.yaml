id: DEU.4.17
reference: Deuteronomy 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּבְנִ֕ית כָּל בְּהֵמָ֖ה אֲשֶׁ֣ר בָּ/אָ֑רֶץ תַּבְנִית֙ כָּל צִפּ֣וֹר כָּנָ֔ף אֲשֶׁ֥ר תָּע֖וּף בַּ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/017.yaml
  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: de
  text: die Gestalt irgendeines Tieres, das auf der Erde ist,[a] die Gestalt irgendeines geflügelten Vogels, der am Himmel fliegt,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Gestalt“ (תַּבְנִית) auch „Abbild“, „Ähnlichkeit“ oder „Darstellung“; gemeint ist im Zusammenhang eine für die Verehrung angefertigte Darstellung.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „in den Himmeln“. Die hebräische Mehrzahl kann hier den sichtbaren Himmel bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: Gestalt
  rationale: „Gestalt“ gibt die sichtbare Form beziehungsweise nachgebildete Erscheinung wieder und bewahrt zugleich die Bedeutungsbreite des hebräischen Wortes im Zusammenhang verbotener Kultbilder.
- source_word: כָּל
  choice: irgendeines
  rationale: Bei den singularischen Gattungsbezeichnungen bringt „irgendeines“ den umfassenden Sinn des Hebräischen in natürlichem Deutsch zum Ausdruck.
- source_word: בְּהֵמָה
  choice: Tier
  rationale: Hier bezeichnet das Wort im Rahmen der nach Lebensbereichen geordneten Aufzählung allgemein ein Landtier, nicht nur Vieh.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: das auf der Erde ist
  rationale: Die räumliche Formulierung bewahrt den Gegensatz zwischen Erde, Himmel und Wasser in den umliegenden Versen, ohne das Verb durch „lebt“ näher festzulegen.
- source_word: צִפּוֹר כָּנָף
  choice: geflügelten Vogels
  rationale: Die Formulierung bildet sowohl „Vogel“ als auch die ausdrückliche Flügelbezeichnung ab und bleibt trotz einer gewissen Redundanz im Deutschen verständlich.
- source_word: תָּעוּף
  choice: fliegt
  rationale: Das Präsens eignet sich für die allgemeine Beschreibung einer Gattung und gibt die verbale Aussage schlicht wieder.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: „Am Himmel“ bezeichnet im Deutschen idiomatisch den sichtbaren Luftraum, in dem Vögel fliegen; die formale Mehrzahl des Hebräischen wird in der Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur und die ausdrückliche Bezeichnung als „geflügelter Vogel“ bleiben erhalten; „am Himmel“ ist gegenüber dem formalen „in den Himmeln“ idiomatischer.
