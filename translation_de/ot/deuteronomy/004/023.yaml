revisions:
- from: Hütet euch davor, den Bund zu vergessen, den Jahwe, euer Gott, mit euch geschlossen hat, und euch ein geschnitztes Bild anzufertigen, das irgendetwas darstellt, was Jahwe, dein Gott, dir nicht anzufertigen geboten hat.[a]
  to: Hütet euch davor, den Bund zu vergessen, den Jahwe, euer Gott, mit euch geschlossen hat, und euch ein geschnitztes Bild in irgendeiner Gestalt anzufertigen, deren Anfertigung Jahwe, dein Gott, dir verboten hat.[a]
  rationale: Die Revision behält alle tragenden Entscheidungen des Entwurfs bei, ersetzt aber die missverständliche Umschreibung „das irgendetwas darstellt“ durch „in irgendeiner Gestalt“. Dadurch wird תמונת כל als Bildgestalt wiedergegeben und der Relativsatz eindeutig auf deren Anfertigung bezogen. „Verboten hat“ ist im Deutschen die klare, natürliche Entsprechung der aufgrund des Kontexts ergänzten Aussage „geboten hat, nicht anzufertigen“; die Fußnote legt die hebräische Ellipse offen.
