  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: de
  text: Hütet euch davor, den Bund zu vergessen, den Jahwe, euer Gott, mit euch geschlossen hat, und euch ein geschnitztes Bild in irgendeiner Gestalt anzufertigen, deren Anfertigung Jahwe, dein Gott, dir verboten hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gestalt, die Jahwe, dein Gott, dir geboten hat“. Das „nicht“ ist im Hebräischen nicht ausdrücklich vorhanden, ergibt sich aber aus dem Zusammenhang; vergleiche 5. Mose 4,16.'
    reason: Der Ausgangstext enthält im letzten Relativsatz eine kontextuell vorausgesetzte Verneinung, die für ein eindeutiges deutsches Verständnis im Haupttext ergänzt wird.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hütet euch davor
  rationale: Die Wendung gibt den reflexiven Warnruf des Nifal-Imperativs natürlich und eindringlich wieder; zusammen mit dem folgenden Infinitivsatz entspricht sie modernem Standarddeutsch.
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: den Bund zu vergessen
  rationale: פֶּן leitet die befürchtete und zu vermeidende Handlung ein. Nach „Hütet euch davor“ ist der Infinitiv im Deutschen idiomatisch und bewahrt den Warncharakter.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ ist die etablierte und sachlich angemessene Wiedergabe für die besondere, verbindliche Beziehung zwischen Jahwe und Israel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: den … mit euch geschlossen hat
  rationale: כרת ברית ist eine feste hebräische Verbindung; im Deutschen lautet die entsprechende natürliche Wendung „einen Bund schließen“.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: und euch … anzufertigen
  rationale: '„euch“ bewahrt den reflexiv-benefaktiven Sinn: Das Bild wird für den eigenen Gebrauch hergestellt.'
- source_word: פֶּסֶל
  choice: ein geschnitztes Bild
  rationale: Die Wiedergabe erhält den konkreten Sinn eines handwerklich gefertigten, besonders geschnitzten Bildes, ohne ihn vorschnell auf den abstrakteren Begriff „Götzenbild“ zu verengen.
- source_word: תְּמוּנַת כֹּל
  choice: das irgendetwas darstellt
  rationale: Die Formulierung gibt den Gedanken einer Gestalt, Abbildung oder Darstellung von etwas in natürlichem Deutsch wieder.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: euer Gott / dein Gott
  rationale: Der Wechsel vom Plural zum Singular in den hebräischen Suffixen wird sichtbar bewahrt, auch wenn er im Deutschen auffällt.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: was Jahwe, dein Gott, dir nicht anzufertigen geboten hat
  rationale: Das im Kontext vorausgesetzte Verbot wird im Haupttext verständlich gemacht; eine Fußnote dokumentiert, dass das Hebräische kein ausdrückliches „nicht“ enthält.
theological_decisions:
- issue: Implizite Verneinung im letzten Relativsatz
  choice: Die im Zusammenhang vorausgesetzte Verneinung wird mit „nicht“ ausdrücklich wiedergegeben.
  alternative: 'Formal: „was Jahwe, dein Gott, dir geboten hat“, wobei das Verbot nur aus dem Zusammenhang erschlossen wird.'
  rationale: Der unmittelbare Zusammenhang warnt vor der Herstellung eines Bildes, besonders Deuteronomium 4,16. Ohne ergänzte Verneinung könnte der deutsche Satz irreführend besagen, Jahwe habe die Anfertigung eines Bildes geboten. Die Fußnote macht die Ellipse des Ausgangstextes transparent.
- issue: Numeruswechsel in der Anrede
  choice: Der Wechsel von „euch/euer“ zu „dir/dein“ wird beibehalten.
  alternative: Die Anrede könnte im Deutschen durchgehend im Plural formuliert werden.
  rationale: Der masoretische Text wechselt tatsächlich vom Plural zum Singular. Da dies verständlich bleibt und Israel sowohl als Gemeinschaft als auch kollektiv angesprochen werden kann, wird die formale Spannung nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit eindringlichem Warncharakter. „Hütet euch“ ist gehoben, aber weiterhin allgemein verständlich. Der Gottesname erscheint als „Jahwe“. Der auffällige Wechsel zwischen pluralischer und singularischer Anrede wird quellentreu bewahrt.
