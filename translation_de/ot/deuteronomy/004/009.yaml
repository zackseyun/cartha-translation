id: DEU.4.9
reference: Deuteronomy 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: de
  text: Nur hüte dich und achte sehr sorgfältig auf dich selbst, damit du die Dinge nicht vergisst, die deine Augen gesehen haben, und damit sie dein Herz[a] nicht verlassen, solange du lebst. Mache sie deinen Kindern und deinen Kindeskindern[b] bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen bezeichnet das „Herz“ häufig den inneren Menschen, einschließlich Erinnerung, Einsicht und Willen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „deinen Söhnen und den Söhnen deiner Söhne“. Die männlichen Formen im Hebräischen können hier entweder Söhne im engeren Sinn oder allgemeiner Kinder und Nachkommen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die nachdrückliche Einschränkung beziehungsweise Warnung knapp und ohne einen im unmittelbaren Satz nicht zwingend ausgedrückten Gegensatz hinzuzufügen.
- source_word: הִשָּׁמֶר לְךָ
  choice: hüte dich
  rationale: Gibt den reflexiven Warnruf idiomatisch und mit angemessenem Ernst wieder.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: und achte sehr sorgfältig auf dich selbst
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person, nicht notwendig eine vom Körper unterschiedene Seele. Die Formulierung bewahrt die nachdrückliche Wiederholung des Auf-sich-Achtens.
- source_word: פֶּן תִּשְׁכַּח
  choice: damit du … nicht vergisst
  rationale: פֶּן leitet eine Warnung vor einer unerwünschten Folge ein; diese Wiedergabe ist im modernen Deutsch natürlicher als „auf dass nicht“.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: die Dinge …, die deine Augen gesehen haben
  rationale: דְּבָרִים kann Wörter, Angelegenheiten oder Dinge bezeichnen. Der Hinweis auf das Sehen spricht hier für „Dinge“; „deine Augen“ erhält den Nachdruck auf eigener Anschauung.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: und damit sie dein Herz nicht verlassen
  rationale: Bewahrt das Bild des Sich-Entfernens und die umfassende althebräische Bedeutung des Herzens als inneres Zentrum von Erinnerung, Einsicht und Wollen.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: solange du lebst
  rationale: Gibt die hebräische Wendung „alle Tage deines Lebens“ natürlich und vollständig wieder.
- source_word: וְהוֹדַעְתָּם
  choice: Mache sie … bekannt
  rationale: Entspricht dem Hifil von ידע, „wissen lassen/bekannt machen“, genauer als das bereits stärker deutende „lehren“.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: deinen Kindern und deinen Kindeskindern
  rationale: בָּנִים kann je nach Zusammenhang Söhne oder allgemeiner Kinder und Nachkommen bezeichnen. Der generationenübergreifende Zusammenhang stützt die umfassende Wiedergabe.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: als „dich selbst“ wiedergegeben
  alternative: „deine Seele“
  rationale: Im Zusammenhang bezeichnet נֶפֶשׁ die ganze Person. „Seele“ könnte im modernen Deutsch unnötig eine bestimmte Leib-Seele-Aufteilung nahelegen.
- issue: Bedeutungsumfang von לֵבָב
  choice: das Bild „dein Herz“ beibehalten und erläutert
  alternative: „deinem Gedächtnis“ oder „deinem Sinn“
  rationale: Der Ausgangstext beschränkt das Herz nicht auf Gefühl oder Erinnerung allein. Die bildhafte Form lässt den umfassenderen anthropologischen Sinn offen.
- issue: Geschlechtlicher Bedeutungsumfang von בָנֶיךָ
  choice: „deinen Kindern“
  alternative: „deinen Söhnen“
  rationale: Die grammatisch maskuline Bezeichnung kann in diesem generationenübergreifenden Bundeszusammenhang die Nachkommenschaft insgesamt umfassen; die Übersetzung legt keine Beschränkung auf männliche Nachkommen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede. Die doppelte Mahnung zur Wachsamkeit bleibt erhalten, ohne נֶפֶשׁ auf eine immaterielle „Seele“ zu verengen. Die Metapher des Herzens und die Mehrdeutigkeit der Nachkommenbezeichnung werden nicht stillschweigend aufgelöst, sondern durch Fußnoten erläutert.
