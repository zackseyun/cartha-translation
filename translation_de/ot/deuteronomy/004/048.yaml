id: DEU.4.48
reference: Deuteronomy 4:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: de
  text: von Aroër, das am Rand des Arnontals[a] liegt, bis zum Berg Sion – das ist der Hermon[b] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Rand des Arnon-Wadis“ beziehungsweise „am Ufer des Arnonbachs“. Das hebräische Wort נַחַל kann ein Bachbett, ein Trockental oder eine Schlucht bezeichnen und meint nicht zwingend einen ständig wasserführenden Fluss.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „Sion“. Vergleiche 5. Mose 3,9, wo derselbe Berg auch mit dem sidonischen Namen „Sirjon“ bezeichnet wird. Hier setzt der Text Sion ausdrücklich mit dem Hermon gleich.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: von Aroër
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt der Gebietsangabe. Der Ortsname wird in der im Deutschen üblichen Form „Aroër“ wiedergegeben.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: das am Rand … liegt
  rationale: Die Relativkonstruktion beschreibt die Lage Aroërs. שָׂפָה bedeutet wörtlich „Lippe“ beziehungsweise „Rand“; „am Rand … liegt“ ist im Deutschen natürlich und vermeidet die zu enge Festlegung auf das Ufer eines ständig wasserführenden Flusses.
- source_word: נַחַל אַרְנֹן
  choice: des Arnontals
  rationale: נַחַל kann einen Bachlauf, ein Trockental oder die dazugehörige Schlucht bezeichnen. „Arnontal“ gibt die topografische Bedeutung verständlich wieder, ohne einen ganzjährig wasserführenden Fluss vorauszusetzen.
- source_word: וְ/עַד
  choice: bis zum
  rationale: Die Wendung markiert den Endpunkt der genannten Ausdehnung; „bis zum“ ist die natürliche deutsche Entsprechung.
- source_word: הַר שִׂיאֹן
  choice: Berg Sion
  rationale: הַר bezeichnet den Berg; שִׂיאֹן wird als „Sion“ transliteriert und nicht mit dem bekannteren Namen „Zion“ gleichgesetzt.
- source_word: הוּא חֶרְמוֹן
  choice: das ist der Hermon
  rationale: Das Pronomen הוּא erläutert hier appositionell, dass der Berg Sion mit dem Hermon identisch ist. „Das ist“ bewahrt diese ausdrückliche Identifizierung.
theological_decisions: []
