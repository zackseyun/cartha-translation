source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: de
  text: So nehmt euch sehr in Acht[a]; denn ihr habt keinerlei Gestalt[b] gesehen an dem Tag, als Jahwe am Horeb mitten aus dem Feuer zu euch sprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Hütet euch sehr um eures Lebens willen.“ Die hebräische Wendung fordert dazu auf, äußerst sorgfältig auf sich achtzugeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keinerlei Abbild“ beziehungsweise „kein Bild“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: So nehmt euch sehr in Acht
  rationale: Die Verbindung aus dem reflexiv gebrauchten Nifal von שׁמר, dem verstärkenden מְאֹד und לְנַפְשֹׁתֵיכֶם ist eine eindringliche Aufforderung zur Selbsthütung. Die deutsche Wendung ist idiomatisch und bewahrt die Warnkraft.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Warnung; „denn“ gibt diesen Zusammenhang in gehobenem, aber gegenwärtigem Deutsch klar wieder.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: ihr habt keinerlei Gestalt gesehen
  rationale: תְּמוּנָה kann eine sichtbare Gestalt, Ähnlichkeit oder Abbildung bezeichnen. „Gestalt“ passt zum Bericht der Gotteserscheinung, ohne den Ausdruck vorschnell auf ein angefertigtes Bild zu verengen.
- source_word: בְּיוֹם
  choice: an dem Tag, als
  rationale: Bewahrt die zeitliche Formulierung des Hebräischen und verbindet sie natürlich mit dem folgenden Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: „Am Horeb“ ist die natürliche deutsche Ortsangabe für das dortige Geschehen.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Die Wiedergabe erhält die räumliche Anschaulichkeit von מִתּוֹךְ und klingt im Deutschen natürlich.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ in לְנַפְשֹׁתֵיכֶם
  choice: 'idiomatisch-reflexiv: „nehmt euch ... in Acht“'
  alternative: „hütet eure Seelen“
  rationale: Die Wendung fordert zur sorgfältigen Selbsthütung auf und macht hier keine technische Aussage über ein vom Körper unterschiedenes Seelenelement.
- issue: Bedeutung von תְּמוּנָה im Kontext der Gotteserscheinung am Horeb
  choice: „Gestalt“
  alternative: „Abbild“ oder „Bild“
  rationale: Der Vers betont, dass Israel keine sichtbare Gestalt Jahwes sah. „Gestalt“ bewahrt den weiteren Bedeutungsumfang und nimmt die anschließende Bilderwarnung nicht unnötig vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „So“ stellt den folgernden Anschluss an den vorherigen Zusammenhang her; „denn“ kennzeichnet die Begründung. Die Satzstellung bleibt gut lesbar und bewahrt zugleich die Betonung, dass keine sichtbare Gestalt wahrgenommen wurde.
