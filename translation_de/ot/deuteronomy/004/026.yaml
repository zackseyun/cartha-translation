source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: de
  text: 'Ich rufe heute Himmel und Erde als Zeugen gegen euch auf: Ihr werdet ganz gewiss rasch aus dem Land verschwinden, in das ihr über den Jordan zieht, um es in Besitz zu nehmen. Ihr werdet dort nicht lange leben, sondern ganz gewiss vernichtet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Ich rufe ... als Zeugen gegen euch auf
  rationale: 'Der Hifil von עוּד mit בָכֶם hat hier rechtlich-bündischen Sinn: Zeugen werden gegen Israel aufgerufen. Die Formulierung ist im modernen Deutschen klar und bewahrt die juristische Bildwelt.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste deutsche Wendung gibt die umfassende Zeugenformel natürlich wieder; der morphologische Plural von שָׁמַיִם verlangt im Deutschen nicht »Himmel« im Plural.
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר
  choice: Ihr werdet schon bald ... verschwinden
  rationale: Der Infinitivus absolutus verstärkt die Gewissheit der Ankündigung. מַהֵר bezeichnet hier das rasche Eintreten; »schon bald« klingt in diesem Zusammenhang natürlicher als »schnell«. »Aus dem Land verschwinden« bringt die durch מֵעַל הָאָרֶץ bezeichnete Entfernung zum Ausdruck, ohne bereits die Art des Gerichts festzulegen.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: in das ihr über den Jordan zieht, um es in Besitz zu nehmen
  rationale: Das Richtungsadverb שָׁמָּה wird durch »in das« aufgenommen. ירשׁ bezeichnet hier die Besitzergreifung des Landes; »in Besitz nehmen« ist präzise und geläufig.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Ihr werdet dort nicht lange leben
  rationale: Die idiomatische deutsche Wiedergabe vermittelt den Sinn von »die Tage darauf nicht verlängern« verständlich, während »dort« den Bezug auf das Land wahrt.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: ganz gewiss vernichtet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Nifal verstärkt die sichere Vernichtung. »Ganz gewiss« gibt die Emphase wieder, ohne mit »völlig« oder »ausgerottet« den Umfang näher festzulegen, als der hebräische Ausdruck es tut.
theological_decisions:
- issue: Bundesrechtliche Zeugenformel mit Himmel und Erde
  choice: Als förmlichen Aufruf von Himmel und Erde zu Zeugen gegen Israel wiedergegeben
  alternative: Als allgemeine Warnung »bei Himmel und Erde« wiedergeben
  rationale: Der Wortlaut trägt die Struktur einer rechtlichen Zeugenschaft. Diese wird bewahrt, ohne Himmel und Erde eine über den Text hinausgehende aktive oder göttliche Rolle zuzuschreiben.
- issue: Verhältnis von Verschwinden aus dem Land und Vernichtung
  choice: Beide Aussagen bleiben als aufeinanderfolgende, nachdrückliche Gerichtsaussagen stehen
  alternative: Beide zu einer einzigen Aussage über Vertreibung oder vollständige Auslöschung verschmelzen
  rationale: Der Vers spricht zunächst vom raschen Verlust des Landes und anschließend von sicherer Vernichtung. Die Übersetzung lässt die genaue Beziehung und Reichweite beider Aussagen offen und löst die theologische Spannung nicht vorzeitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzstruktur ist gegenüber dem Hebräischen behutsam geglättet; die Wiederholung der verstärkten Gerichtsankündigung und die rechtliche Zeugenmetaphorik bleiben erhalten.
