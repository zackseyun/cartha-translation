source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: de
  text: jenseits des Jordan, im Tal gegenüber von Bet-Peor, im Land Sihons, des Königs der Amoriter, der in Heschbon wohnte und den Mose und die Söhne Israels[a] besiegten, als sie aus Ägypten zogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet das Gebiet auf der anderen Seite des Jordan aus der Perspektive des Sprechers; „jenseits des Jordan“ ist knapp, idiomatisch und wahrt diese räumliche Perspektive.
- source_word: בַּגַּיְא
  choice: im Tal
  rationale: גַּיְא kann ein Tal oder eine Schlucht bezeichnen. „Tal“ ist hier die natürliche topografische Bezeichnung.
- source_word: מוּל בֵּית פְּעוֹר
  choice: gegenüber von Bet-Peor
  rationale: מוּל bezeichnet eine räumliche Lage gegenüber einem Ort. Der Ortsname wird nach gebräuchlicher deutscher Form als „Bet-Peor“ wiedergegeben.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: im Land Sihons
  rationale: אֶרֶץ bezeichnet hier Sihons Herrschaftsgebiet; „Land Sihons“ bewahrt die hebräische Konstruktion und klingt im Deutschen natürlich.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: des Königs der Amoriter
  rationale: Die Apposition identifiziert Sihon als König des amoritischen Volkes; der Genitiv fügt sie im Deutschen klar an seinen Namen an.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: der in Heschbon wohnte
  rationale: Das Partizip יוֹשֵׁב bezeichnet den Wohn- oder Herrschaftssitz. „wohnte“ ist modern und ungekünstelt.
- source_word: אֲשֶׁר הִכָּה
  choice: den ... besiegten
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Besiegen eines Gegners. „besiegten“ gibt den Kontext klar wieder, ohne ausdrücklich zu behaupten, dass Sihon eigenhändig getötet wurde.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: und die Söhne Israels
  rationale: Die formale Wiedergabe erhält das ausdrücklich maskuline בְּנֵי und die traditionelle Bundesbezeichnung; die idiomatische kollektive Lesart wird in einer Fußnote genannt.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: als sie aus Ägypten zogen
  rationale: Die Präposition בְּ beim Infinitiv bezeichnet den zeitlichen Umstand. „als sie aus Ägypten zogen“ ist natürlich und bewahrt den Bezug auf den Exodus.
theological_decisions:
- issue: Geschlechtlich markierte Bundesbezeichnung וּבְנֵי יִשְׂרָאֵל
  choice: und die Söhne Israels
  alternative: und die Israeliten
  rationale: Der hebräische Ausdruck lautet formal „Söhne Israels“, dient zugleich aber als kollektive Volksbezeichnung. Die Hauptlesart wahrt die sprachliche Form; die Fußnote macht die idiomatische kollektive Wiedergabe sichtbar, ohne die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen geografisch-historischen Zusammenhang, wird aber durch deutsche Genitiv- und Relativkonstruktionen flüssig lesbar gemacht. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Satzes bewusst mit einem Kleinbuchstaben.
