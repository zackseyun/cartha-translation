source:
  edition: WLC
  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: de
  text: Und dies ist die Weisung, die Mose den Söhnen Israels vorlegte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“, „dem Volk Israel“; traditionell: „den Kindern Israels“. „Söhne Israels“ ist hier die Bezeichnung für das Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet den folgenden Abschnitt ein; „Und dies ist“ bewahrt sowohl den Anschluss als auch den präsentierenden Charakter.
- source_word: הַתּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה bezeichnet hier die von Mose vorgelegte verbindliche Unterweisung. „Weisung“ erhält die breitere Bedeutung des hebräischen Wortes, ohne es vorschnell auf einzelne Rechtsbestimmungen zu verengen.
- source_word: שָׂם ... לִפְנֵי
  choice: vorlegte
  rationale: Die Verbindung bedeutet wörtlich „vor jemanden setzen/stellen“ und bezeichnet hier die feierliche Vorlage an das Volk. „Vorlegte“ ist im Deutschen natürlich und präzise.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Wiedergabe erhält die maskuline Form des hebräischen nationalen Ausdrucks; zugleich wird in einer Fußnote auf die korporative Bedeutung und idiomatische Alternativen hingewiesen.
theological_decisions:
- issue: Bedeutungsumfang von הַתּוֹרָה
  choice: die Weisung
  alternative: das Gesetz; die Tora
  rationale: „Weisung“ bewahrt die semantische Breite von תּוֹרָה und passt zu der von Mose vermittelten Bundesunterweisung. „Gesetz“ ist traditionell und kontextuell möglich, kann im heutigen Deutschen jedoch enger wirken.
- issue: Geschlechtlich markierte Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  alternative: den Israeliten; dem Volk Israel; den Kindern Israels
  rationale: Die formale maskuline Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar, ohne die korporative Bezeichnung auf ausschließlich männliche Angehörige des Volkes festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Überschrift bleibt knapp und präsentierend; „vorlegte“ vermeidet die im Deutschen schwerfällige wörtliche Formulierung „vor die Söhne Israels stellte“.
