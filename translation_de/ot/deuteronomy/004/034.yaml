  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: de
  text: Oder hat je irgendein Gott versucht, hinzugehen und sich ein Volk aus der Mitte eines anderen Volkes herauszuholen – durch Prüfungen, durch Zeichen und Wunder, durch Krieg, durch eine starke Hand und einen ausgestreckten Arm und durch große furchterregende Taten[a] –, ganz so, wie Jahwe, euer Gott, all dies für euch in Ägypten vor deinen Augen getan hat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch große, Ehrfurcht gebietende Taten“. Der hebräische Ausdruck bezeichnet Furcht und Ehrfurcht hervorrufende Taten oder Ereignisse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: hat je ... versucht
  rationale: Das Verb נסה bezeichnet hier den Versuch beziehungsweise das Unternehmen einer Tat. Die Formulierung passt zur rhetorischen Frage, ohne einen möglichen Fehlschlag anzudeuten.
- source_word: אֱלֹהִים
  choice: irgendein Gott
  rationale: In der rhetorischen Gegenüberstellung ist allgemein nach einer Gottheit gefragt. „Irgendein Gott“ gibt die indefinite Bedeutung idiomatisch wieder; die Großschreibung folgt der deutschen Schreibung von Gottesbezeichnungen.
- source_word: לָבוֹא לָקַחַת
  choice: hinzugehen und sich ... herauszuholen
  rationale: Die Infinitivfolge beschreibt zielgerichtete Bewegung und anschließende Herausnahme. „Herausholen“ bringt zusammen mit מִקֶּרֶב das Bild zum Ausdruck, ein Volk aus einem anderen herauszunehmen.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: ein Volk mitten aus einem anderen Volk
  rationale: Die auffällige Wiederholung von גוי und das Bild eines Volkes innerhalb eines anderen bleiben erhalten.
- source_word: בְּמַסֹּת
  choice: durch Prüfungen
  rationale: Der Ausdruck bezeichnet prüfende Ereignisse beziehungsweise Gerichtsakte beim Auszug. „Prüfungen“ wahrt diese Breite.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: durch Zeichen und Wunder
  rationale: Die geläufige Wortverbindung gibt beide hebräischen Begriffe prägnant wieder und bewahrt ihren Zusammenhang.
- source_word: וּבְמִלְחָמָה
  choice: durch Krieg
  rationale: Die Wiedergabe wahrt den Singular und die kriegerische Dimension der Befreiung aus Ägypten.
- source_word: וּבְיָד חֲזָקָה
  choice: durch eine starke Hand
  rationale: Die feste Exodusformel wird nah am hebräischen Wortlaut und in natürlichem Deutsch wiedergegeben.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: einen ausgestreckten Arm
  rationale: Dies bewahrt das konkrete Bild der zweiten festen Exodusformel.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: durch große Schreckenstaten
  rationale: Der Ausdruck bezeichnet große Taten oder Erscheinungen, die Furcht und Ehrfurcht hervorrufen. „Schreckenstaten“ bezeichnet die furchterregenden Akte selbst; eine Alternative wird in der Fußnote genannt.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: so wie es ... getan hat
  rationale: Die Vergleichsformel verbindet die rhetorische Frage unmittelbar mit Jahwes gesamten Handeln in Ägypten; der Kontext trägt den umfassenden Sinn von כֹל.
- source_word: לָכֶם ... לְעֵינֶיךָ
  choice: für euch ... vor deinen Augen
  rationale: Der Wechsel vom Plural „euch“ zum Singular „deinen“ wird bewahrt. So bleibt die kollektive Anrede Israels mit ihrer singularischen Zuspitzung sichtbar.
theological_decisions:
- issue: Bezug von אֱלֹהִים in der rhetorischen Gegenüberstellung
  choice: irgendein Gott
  alternative: Gott
  rationale: Die Frage vergleicht Jahwes einzigartiges Rettungshandeln mit dem Handeln irgendeiner Gottheit. Die indefinite Wiedergabe erhält die polemische Kraft, ohne den ersten Satzteil eindeutig auf den Gott Israels zu beziehen.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe mit dem Eigennamen macht den Gegensatz zwischen irgendeinem Gott und Jahwe ausdrücklich sichtbar und entspricht einer direkten Wiedergabe des Tetragramms.
- issue: Numeruswechsel in der Anrede
  choice: für euch ... vor deinen Augen
  alternative: für euch ... vor euren Augen
  rationale: Der masoretische Text wechselt vom Plural לָכֶם zum Singular לְעֵינֶיךָ. Dieser Wechsel wird nicht harmonisiert, damit die kollektive und zugleich als Einheit angesprochene Identität Israels erkennbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange rhetorische Frage und die wiederholte instrumentale Struktur werden bewahrt, durch Gedankenstriche jedoch lesbar gegliedert. Der Wechsel zwischen pluralischer und singularischer Anrede bleibt entsprechend dem hebräischen Text erhalten.
