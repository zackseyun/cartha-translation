revisions:
- from: Oder hat je irgendein Gott versucht, hinzugehen und sich ein Volk mitten aus einem anderen Volk herauszuholen – durch Prüfungen, durch Zeichen und Wunder, durch Krieg, durch eine starke Hand und einen ausgestreckten Arm und durch große Schreckenstaten[a] –, so wie es Jahwe, euer Gott, in Ägypten vor deinen Augen für euch getan hat?
  to: Oder hat je irgendein Gott versucht, hinzugehen und sich ein Volk aus der Mitte eines anderen Volkes herauszuholen – durch Prüfungen, durch Zeichen und Wunder, durch Krieg, durch eine starke Hand und einen ausgestreckten Arm und durch große furchterregende Taten[a] –, ganz so, wie Jahwe, euer Gott, all dies für euch in Ägypten vor deinen Augen getan hat?
  rationale: Die Revision schärft die umfassende Vergleichsaussage des Hebräischen, ersetzt eine im modernen Deutsch missverständliche Zusammensetzung und glättet eine idiomatische Wendung. Der Numeruswechsel „für euch“ / „vor deinen Augen“ und die lexikalische Ambivalenz von מוֹרָאִים bleiben erhalten.
