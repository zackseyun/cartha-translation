base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: de
  text: Und dort werdet ihr Göttern dienen, die von Menschenhand aus Holz und Stein gemacht sind und weder sehen noch hören noch essen noch riechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: werdet ihr … dienen
  rationale: עבד bezeichnet hier den Dienst beziehungsweise die Verehrung fremder Götter. Im Zusammenhang der angekündigten Zerstreuung gibt das deutsche Futur den Vorhersagecharakter natürlich wieder.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf die Länder unter den Völkern, von denen im unmittelbaren Zusammenhang die Rede ist.
- source_word: אֱלֹהִים
  choice: Göttern
  rationale: Der Plural bezeichnet hier fremde beziehungsweise falsche Gottheiten. „Götter“ bewahrt den unmittelbaren Wortsinn; dass es sich um menschengemachte Götzen handelt, erklärt die folgende Apposition.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: dem Werk von Menschenhänden
  rationale: Die Wendung wird transparent und im Deutschen idiomatisch wiedergegeben. אָדָם ist hier generisch und bezeichnet menschliche Urheberschaft.
- source_word: עֵץ וָאֶבֶן
  choice: Holz und Stein
  rationale: Gemeint sind die Materialien, aus denen die Götterbilder gefertigt sind; daher ist עֵץ hier mit „Holz“ und nicht mit „Baum“ wiederzugeben.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: die weder sehen noch hören noch essen noch riechen
  rationale: Die wiederholte hebräische Verneinung wird durch „weder … noch“ knapp und rhythmisch bewahrt. Die Formulierung stellt die tatsächliche Leblosigkeit der Götterbilder heraus, ohne das ausdrückliche Modalverb „können“ hinzuzufügen.
- source_word: יְרִיחֻן
  choice: riechen
  rationale: Das Verb bezeichnet hier den Geruchssinn und schließt die Reihe körperlicher Wahrnehmungen und Tätigkeiten natürlich ab.
theological_decisions:
- issue: Bezeichnung der fremden Gottheiten
  choice: Göttern
  alternative: Götzen
  rationale: „Götter“ entspricht אֱלֹהִים unmittelbar und lässt die folgende Beschreibung als polemische Entlarvung stehen, statt diese bereits in das Substantiv hineinzulegen.
- issue: Generische Bedeutung von אָדָם
  choice: Menschenhänden
  alternative: Händen des Menschen
  rationale: Der Ausdruck bezeichnet allgemein menschliche Herstellung, nicht einen bestimmten Mann. „Menschenhände“ ist präzise, würdig und im heutigen Deutsch natürlich.
- issue: Aktualität oder Unfähigkeit der Götterbilder
  choice: die weder sehen noch hören noch essen noch riechen
  alternative: die weder sehen noch hören noch essen noch riechen können
  rationale: Der hebräische Text verneint die Tätigkeiten, ohne ein eigenes Modalverb auszudrücken. Die gewählte Fassung bewahrt diese Form und vermittelt im Kontext dennoch deutlich ihre Leblosigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Negation erhält den polemischen Rhythmus des Hebräischen. Das Relativpronomen „die“ bezieht sich grammatisch auf „Göttern“; „Holz und Stein“ steht als erläuternde Materialangabe innerhalb der Apposition.
