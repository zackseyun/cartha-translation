base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: de
  text: damit jemand, der seinen Nächsten tötet, ohne es zu wissen[a], und ihn zuvor[b] nicht gehasst hat, in eine dieser Städte fliehen und am Leben bleiben kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne Wissen“. In diesem Rechtszusammenhang bezeichnet dies eine unwissentliche oder unabsichtliche Tötung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seit gestern und vorgestern“; eine hebräische Redewendung für „zuvor“ oder „früher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: damit der Totschläger dorthin fliehen kann
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck der im vorherigen Vers vorgenommenen Aussonderung der Städte. Ein deutscher damit-Satz gibt diesen Zusammenhang natürlich wieder.
- source_word: רוֹצֵחַ
  choice: Totschläger
  rationale: Im Zusammenhang der Zufluchtsstädte bezeichnet das Wort jemanden, der einen Menschen getötet hat, ohne ihn bereits als schuldhaften Mörder einzustufen. „Totschläger“ bewahrt diese rechtliche Offenheit besser als „Mörder“.
- source_word: אֲשֶׁר יִרְצַח אֶת רֵעֵהוּ
  choice: der seinen Nächsten ... tötet
  rationale: Die Wiedergabe ist direkt und verständlich; „seinen Nächsten“ entspricht dem relationalen רֵעֵהוּ, ohne es auf eine bestimmte Personengruppe einzuengen.
- source_word: בִּבְלִי דַעַת
  choice: unabsichtlich, ohne es zu wissen
  rationale: Wörtlich bezeichnet die Wendung ein Handeln „ohne Wissen“. Im Rechtszusammenhang geht es um eine nicht wissentlich oder vorsätzlich herbeigeführte Tötung. Haupttext und Fußnote bewahren sowohl Sinn als auch Wortlautnähe.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: und ihn ... nicht gehasst hat
  rationale: Das Partizip beschreibt eine bestehende feindselige Haltung. Natürliches Deutsch drückt dies hier mit „nicht gehasst hat“ aus.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: zuvor
  rationale: Die wörtliche Zeitformel „seit gestern und vorgestern“ ist ein Idiom für eine schon vorher bestehende Haltung; „zuvor“ gibt den Sinn knapp wieder, während die Fußnote die Bildsprache dokumentiert.
- source_word: וְנָס אֶל אַחַת מִן הֶעָרִים הָאֵל וָחָי
  choice: Er kann in eine dieser Städte fliehen und am Leben bleiben
  rationale: Die Verbfolge beschreibt die eröffnete Möglichkeit und ihr Ergebnis. Die Aufteilung in einen zweiten Satz vermeidet im Deutschen einen überladenen Relativsatz und lässt „am Leben bleiben“ den rechtlichen Sinn von וָחָי klar erkennen.
theological_decisions:
- issue: Rechtlicher Status des רוֹצֵחַ
  choice: Totschläger
  alternative: Mörder
  rationale: Der Vers behandelt ausdrücklich eine Tötung ohne vorherigen Hass und ohne Wissen bzw. Absicht. „Mörder“ würde Schuldvorsatz voraussetzen und damit die im Text vorgenommene Unterscheidung vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totschläger“ dient als rechtlich differenzierender Ausdruck und vermeidet die vorschnelle Einstufung als Mörder. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; alle inhaltlichen Beziehungen bleiben erhalten.
