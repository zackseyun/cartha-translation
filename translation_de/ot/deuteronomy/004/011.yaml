base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: de
  text: Da kamt ihr näher und stelltet euch an den Fuß des Berges, während der Berg bis zum Herzen des Himmels[a] in Flammen stand – Finsternis, Wolke und dichtes Dunkel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „bis zum Herzen des Himmels“; gemeint sein kann die Mitte oder Höhe des Himmels.
    reason: lexical_alternative
  - marker: b
    text: Oder „tiefe Finsternis“ oder „dichte Dunkelheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: Da kamt ihr näher
  rationale: Das Qal-Wayyiqtol in der 2. Person Plural bezeichnet das Herannahen. „Da kamt ihr näher“ gibt die erzählerische Folge natürlich wieder.
- source_word: וַתַּעַמְדוּן
  choice: und stelltet euch
  rationale: עמד bedeutet hier, eine stehende Position einzunehmen. Im Deutschen passt das reflexive „sich stellen“ zur Bewegung an den Berg heran besser als das statische „standet“.
- source_word: תַּחַת הָהָר
  choice: an den Fuß des Berges
  rationale: תחת bedeutet wörtlich „unter/unterhalb“; im topografischen Zusammenhang bezeichnet es den Bereich am unteren Ende beziehungsweise Fuß des Berges.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: während der Berg im Feuer brannte
  rationale: Das Partizip בֹּעֵר schildert einen andauernden Zustand. „Während“ bringt die umstandsbezeichnende Verbindung natürlich zum Ausdruck, ohne die Aussage auszudeuten.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: bis zum Herzen des Himmels
  rationale: Die konkrete Metapher „Herz“ bleibt erhalten. שָׁמַיִם bezeichnet hier den Himmel beziehungsweise die Himmelshöhe; der deutsche Singular ist idiomatisch und wahrt das Bild.
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: Finsternis, Wolke und dichtes Dunkel
  rationale: Die dreigliedrige, theophanische Bildfolge wird bewahrt. „Dichtes Dunkel“ unterscheidet עֲרָפֶל von der vorausgehenden חֹשֶׁךְ und gibt seine verhüllende Dichte wieder.
theological_decisions:
- issue: Bildsprache der Gotteserscheinung am Sinai
  choice: Die konkreten und ehrfurchtgebietenden Bilder von Feuer, Finsternis, Wolke und dichtem Dunkel bleiben ungemildert erhalten.
  alternative: Die Ausdrücke als bloße Wettererscheinungen verallgemeinern.
  rationale: Der hebräische Text schildert eine Gotteserscheinung mit bewusst verdichteter Bildsprache. Die Übersetzung bewahrt deren theologisches Gewicht, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt flüssig, während die markante hebräische Metapher „Herz des Himmels“ und die dreifache Dunkelheits- und Wolkenbildfolge erhalten werden.
