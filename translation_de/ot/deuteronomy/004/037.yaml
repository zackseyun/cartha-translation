source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: de
  text: Und weil er deine Väter liebte und ihre Nachkommen nach ihnen erwählte[a], führte er dich durch seine Gegenwart[b] und durch seine große Kraft aus Ägypten heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Nachkommen nach ihm“. Im Hebräischen stehen die Fürwörter im Singular; wahrscheinlich werden „deine Väter“ dabei als eine Einheit aufgefasst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch sein Angesicht“ oder „vor seinem Angesicht“; die Wendung bezeichnet hier Gottes eigene Gegenwart beim Herausführen Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: Und weil
  rationale: Die Wendung nennt den Grund für die vorausgehende Aussage. „Und weil“ gibt ihren kausalen Sinn in natürlichem Deutsch wieder.
- source_word: אָהַב
  choice: liebte
  rationale: Die einfache Vergangenheitsform entspricht der klaren Bedeutung des Verbs, ohne eine zusätzliche Bedeutungsnuance einzutragen.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Das Hebräische bezeichnet ausdrücklich die männlichen Vorfahren Israels. „Väter“ wahrt zugleich den für den Bund bedeutsamen Bezug auf die Erzväter.
- source_word: וַיִּבְחַר
  choice: erwählte
  rationale: „Erwählte“ ist im Deutschen die natürliche und sachlich passende Wiedergabe von בחר in diesem Zusammenhang, ohne einen späteren theologischen Fachbegriff aufzudrängen.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: ihre Nachkommen nach ihnen
  rationale: זֶרַע ist eine kollektive Bezeichnung für die Nachkommenschaft. Die deutschen Pluralpronomen beziehen die Wendung verständlich auf „deine Väter“; die formalen Singularsuffixe werden in einer Fußnote dokumentiert.
- source_word: וַיּוֹצִאֲךָ
  choice: führte er dich … aus Ägypten heraus
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszuführen oder herauszubringen. „Aus Ägypten herausführen“ ist eine klare, natürliche Wiedergabe der Exodusformulierung.
- source_word: בְּפָנָיו
  choice: durch seine Gegenwart
  rationale: Wörtlich steht „durch/mit seinem Angesicht“. Im Kontext bezeichnet die Wendung Gottes eigene, unmittelbare Gegenwart beim Herausführen; die bildhafte Grundform wird in der Fußnote genannt.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: durch seine große Kraft
  rationale: Die instrumentale Präposition und die Grundbedeutung von כֹּחַ werden direkt wiedergegeben; die Parallelität zu „durch seine Gegenwart“ bleibt erhalten.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten heraus
  rationale: In Verbindung mit dem Verb des Herausführens bringt diese Formulierung die räumliche und befreiende Bewegung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Kollektiv-singuläre Suffixe in בְּזַרְעוֹ אַחֲרָיו
  choice: ihre Nachkommen nach ihnen
  alternative: seinen Nachkommen nach ihm
  rationale: Die hebräischen Suffixe stehen im Singular, beziehen sich im Zusammenhang aber wahrscheinlich auf die kollektiv verstandene Gruppe „deine Väter“. Der Haupttext gibt diesen Bezug in verständlichem Deutsch wieder, während die formale Lesart in der Fußnote erhalten bleibt.
- issue: Bedeutung von בְּפָנָיו
  choice: durch seine Gegenwart
  alternative: vor seinem Angesicht / durch sein Angesicht
  rationale: Die gewählte Fassung wahrt die Aussage, dass Gott selbst beim Exodus gegenwärtig und wirksam war, ohne die im Deutschen missverständliche wörtliche Wendung unkommentiert in den Haupttext zu setzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Väter“ und „erwählte“ bewahren den bundesgeschichtlichen Wortlaut; schwer verständliche Hebraismen werden im Haupttext sinngerecht und in den Fußnoten formal transparent wiedergegeben.
