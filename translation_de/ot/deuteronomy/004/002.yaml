reference: Deuteronomy 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: de
  text: Ihr sollt dem Wort, das ich euch gebiete, nichts hinzufügen und nichts davon wegnehmen, damit ihr die Gebote Jahwes[a], eures Gottes, haltet, die ich euch gebiete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben; hier »Jahwe«.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: etwas hinzufügen
  rationale: Das Hifil von יסף mit עַל bezeichnet hier das Hinzufügen zu etwas. Die deutsche Konstruktion »dem Wort nichts hinzufügen« ist idiomatisch und bewahrt den Sinn des Verbots.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דבר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Hier bezeichnet der Singular den gesamten Inhalt der mitgeteilten Weisung als Einheit; »das Wort« erhält diese Form und Bedeutung.
- source_word: מְצַוֶּה
  choice: ich gebiete
  rationale: Das Partizip bezeichnet im unmittelbaren Redekontext das gegenwärtige Gebieten. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: nichts davon wegnehmen
  rationale: גרע bedeutet vermindern oder wegnehmen. »Nichts davon wegnehmen« bildet im Deutschen einen klaren Gegensatz zu »nichts hinzufügen«.
- source_word: לִשְׁמֹר
  choice: damit ihr … haltet
  rationale: Der Infinitiv mit ל drückt hier Zweck oder beabsichtigte Folge aus. »Damit« macht diesen Zusammenhang deutlich, ohne ihn enger festzulegen.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: »Gebote« ist die geläufige und angemessen gewichtige Wiedergabe von מצות im bundesrechtlichen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name mit der im Deutschen geläufigen Form »Jahwe« wiedergegeben; die traditionelle Ersetzung durch einen Titel wird in der Fußnote genannt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: In der Verbindung mit JHWH ist אֱלֹהִים singularisch gemeint. Der Genitiv »eures Gottes« steht als Apposition zu »Jahwes« und ist natürliches Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm JHWH. »Jahwe« bewahrt den persönlichen Bundesnamen, während die traditionelle Wiedergabe »der HERR« als Alternative in der Fußnote dokumentiert wird.
- issue: Beziehung von לִשְׁמֹר zum vorausgehenden Verbot
  choice: damit ihr … haltet
  alternative: um … zu halten
  rationale: Die Zweck- beziehungsweise Folgebedeutung bleibt erhalten. Die Formulierung »damit ihr« ist angesichts des pluralischen Adressaten klar und natürlich, ohne die theologische Spannung zwischen unveränderter Weisung und Gehorsam aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural und die Wiederholung »die ich euch gebiete« bleiben entsprechend dem hebräischen Text erhalten. Der Gottesname wird transparent wiedergegeben; der Fußnotenmarker steht unmittelbar bei »Jahwes«.
