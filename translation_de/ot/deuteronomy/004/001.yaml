  terminology: „Satzungen und Rechtsbestimmungen“ ist als unterscheidbares Begriffspaar vertretbar. „Jahwe“ gibt den Gottesnamen angemessen wieder; die Fußnote zur traditionellen Wiedergabe ist sachlich. Die Alternativfußnote zu ירשׁ wird präziser und paralleler formuliert.
