source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: de
  text: Und nun, Israel, höre auf die Satzungen und Rechtsbestimmungen[a], die ich euch lehre, zu befolgen, damit ihr lebt und in das Land kommt und es in Besitz nehmt[b], das Jahwe[c], der Gott eurer Väter, euch gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ordnungen und Rechtssätze“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es besitzt“ oder „es erbt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den ausdrücklichen Übergang vom vorausgehenden Rückblick zur gegenwärtigen Ermahnung.
- source_word: שְׁמַע אֶל
  choice: höre auf
  rationale: Gibt das aufmerksame Hören mit אֶל wieder und lässt den Gehorsamsaspekt anklingen, ohne ihn vollständig in das Verb hineinzulesen.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: Ein geläufiger rechtlicher Ausdruck, der von מִשְׁפָּטִים unterschieden bleibt.
- source_word: הַמִּשְׁפָּטִים
  choice: Rechtsbestimmungen
  rationale: Bewahrt den rechtlich-richterlichen Sinn und bildet zusammen mit „Satzungen“ ein verständliches, unterscheidbares Begriffspaar.
- source_word: מְלַמֵּד אֶתְכֶם לַעֲשׂוֹת
  choice: die ich euch zu halten lehre
  rationale: Natürliches modernes Deutsch für das Lehren mit dem Ziel des Tuns; „halten“ gibt im Gesetzeskontext das konkrete Befolgen wieder.
- source_word: לְמַעַן תִּחְיוּ
  choice: damit ihr lebt
  rationale: Bewahrt die Zweckangabe knapp und lässt offen, ob Leben hier Fortbestand, Wohlergehen oder beides umfasst.
- source_word: וּבָאתֶם
  choice: und in das Land hineinzieht
  rationale: Macht die gerichtete Bewegung in das verheißene Land idiomatisch deutlich.
- source_word: וִירִשְׁתֶּם
  choice: es in Besitz nehmt
  rationale: Gibt im Landverheißungskontext den konkreten Erwerb des Besitzes wieder; „erbt“ bleibt als mögliche Alternative vermerkt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: der Gott eurer Väter
  rationale: Bewahrt die angestammte Bundesformel und die konkrete maskuline Bezeichnung des hebräischen Textes.
- source_word: נֹתֵן לָכֶם
  choice: euch gibt
  rationale: Das Partizip wird präsentisch wiedergegeben und stellt das Land als gegenwärtige Gabe Jahwes dar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ wahrt den Namenscharakter; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Bedeutungsumfang von לְמַעַן תִּחְיוּ
  choice: damit ihr lebt
  alternative: damit ihr am Leben bleibt / Wohlergehen habt
  rationale: Die knappe Wiedergabe bewahrt die theologische Spannung zwischen physischem Fortbestand und umfassendem Leben im Bund.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Israel“ und der feierliche Ermahnungscharakter bleiben erhalten. Das juristische Begriffspaar ist unterscheidbar, aber für heutige Leser verständlich formuliert.
