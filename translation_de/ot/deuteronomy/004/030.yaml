  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: de
  text: Wenn du in Bedrängnis bist und all dies über dich kommt, wirst du in späteren Tagen[a] zu Jahwe, deinem Gott, zurückkehren und auf seine Stimme hören[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Ende der Tage“. Der hebräische Ausdruck kann allgemein eine spätere zukünftige Zeit bezeichnen und muss nicht auf ein bestimmtes Endzeitschema beschränkt werden.'
    reason: alternative_reading
  - marker: b
    text: „Auf seine Stimme hören“ kann auch mit „seiner Stimme gehorchen“ wiedergegeben werden, da der hebräische Ausdruck häufig gehorsames Befolgen einschließt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: wenn du in Bedrängnis bist
  rationale: Die präpositionale Wendung bezeichnet eine Notlage. Die temporale Formulierung mit „wenn“ gibt den Sinn des verblosen hebräischen Satzanfangs im Deutschen natürlich wieder.
- source_word: וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: und all dies über dich kommt
  rationale: מצא bedeutet wörtlich „finden“; bei angekündigten Ereignissen als Subjekt ist „über jemanden kommen“ idiomatisches Deutsch. דְּבָרִים verweist hier auf die zuvor genannten Geschehnisse, daher „all dies“ statt „alle diese Worte“.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  rationale: Die Wiedergabe bewahrt die bildhafte und theologisch offene hebräische Zeitformel, ohne sie auf ein bestimmtes Endzeitschema festzulegen.
- source_word: וְשַׁבְתָּ עַד
  choice: wirst du … zurückkehren
  rationale: שׁוּב mit עַד bezeichnet die Rückkehr beziehungsweise Hinwendung zu jemandem. „Zurückkehren“ erhält den relationalen und bundesbezogenen Klang, ohne ausdrücklich „Buße tun“ einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die Form mit dem Suffix der zweiten Person Singular wird direkt wiedergegeben und bewahrt die persönliche Bundesanrede.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: und auf seine Stimme hören
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des Hörens; im Kontext kann sie zugleich das befolgende, gehorsame Hören einschließen.
theological_decisions:
- issue: Zeitformel בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  alternative: in künftigen Tagen
  rationale: Die traditionelle bildhafte Formulierung bleibt erhalten, während eine Fußnote klarstellt, dass der hebräische Ausdruck nicht zwingend ein eng umrissenes Endzeitschema voraussetzt.
- issue: Bundesbezogene Rückkehr in וְשַׁבְתָּ עַד יְהוָה
  choice: zu Jahwe, deinem Gott, zurückkehren
  alternative: umkehren und Buße tun zu Jahwe, deinem Gott
  rationale: „Zurückkehren“ wahrt die relationale Aussage des Verbs, ohne eine weiter ausgearbeitete Lehre von der Buße ausdrücklich in den Wortlaut einzutragen.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf seine Stimme hören
  alternative: seiner Stimme gehorchen
  rationale: Die gewählte Fassung erhält die Hörmetapher und lässt zugleich den im hebräischen Ausdruck häufig enthaltenen Sinn des gehorsamen Befolgens offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede bleibt entsprechend dem hebräischen Singular durchgehend bei „du“. Die Satzstruktur wurde leicht geglättet, ohne die zeitliche und theologische Offenheit des Ausgangstextes aufzulösen.
