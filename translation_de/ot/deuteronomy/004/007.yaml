  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: de
  text: Denn welche große Nation gibt es, die Götter[a] hat, die ihr so nahe sind, wie Jahwe, unser Gott, uns nahe ist, sooft wir ihn anrufen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Götter“. Im rhetorischen Vergleich sind die Gottheiten anderer Nationen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sooft wir zu ihm rufen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und bewahrt den argumentativen Zusammenhang.
- source_word: מִי גוֹי גָּדוֹל
  choice: welche große Nation gibt es
  rationale: Gibt die hebräische rhetorische Frage in natürlichem, modernem Deutsch wieder.
- source_word: אֲשֶׁר לוֹ
  choice: der ... sind
  rationale: Die hebräische Zugehörigkeitskonstruktion wird als idiomatische deutsche Dativkonstruktion wiedergegeben.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Das pluralische Prädikatsadjektiv קְרֹבִים und der Vergleich mit Israels Gott sprechen hier für die Gottheiten anderer Nationen.
- source_word: קְרֹבִים אֵלָיו
  choice: ihr so nahe sind
  rationale: Der Dativ bezieht sich auf die Nation; „so nahe“ bringt die vergleichende und rhetorische Zuspitzung zum Ausdruck.
- source_word: כַיהוָה אֱלֹהֵינוּ
  choice: wie Jahwe, unser Gott
  rationale: כ wird vergleichend mit „wie“ wiedergegeben; der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ transliteriert.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: sooft wir ihn anrufen
  rationale: Die Verbindung von בְּכָל mit dem Infinitiv bezeichnet jede entsprechende Gelegenheit; „anrufen“ ist im Gebetskontext idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn in der im Deutschen geläufigen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֱלֹהִים im ersten Satzteil
  choice: Götter als Gottheiten anderer Nationen
  alternative: Gott oder göttliche Wesen
  rationale: Das pluralische קְרֹבִים und der rhetorische Vergleich mit Jahwe sprechen für einen generischen Plural, ohne damit die tatsächliche Existenz oder Gleichrangigkeit dieser Gottheiten zu behaupten.
- issue: Im Vergleich ausgelassene Satzglieder
  choice: „uns nahe ist“ zur Verdeutlichung ergänzt
  alternative: 'wörtlich verkürzt: „wie Jahwe, unser Gott, sooft wir ihn anrufen“'
  rationale: Im Hebräischen ist die Aussage von Jahwes Nähe zu Israel aus dem ersten Satzteil mitzudenken. Die Ergänzung macht den Vergleich im Deutschen grammatisch klar, ohne seinen Sinn zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der Vergleich bleiben erhalten; die elliptische hebräische Vergleichskonstruktion wird zur grammatischen Klarheit im Deutschen behutsam ergänzt.
