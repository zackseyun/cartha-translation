base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: de
  text: Und sie nahmen sein Land und das Land Ogs, des Königs von Baschan, in Besitz – das Land der beiden Könige der Amoriter, die jenseits des Jordan[a] auf der Seite des Sonnenaufgangs[b] waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „auf der anderen Seite des Jordan“. Die hebräische Wendung ist eine übliche geografische Bezeichnung; ihre genaue Perspektive hängt vom Standort des Erzählers ab.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Sonnenaufgang“; gemeint ist die östliche Seite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: sie nahmen … in Besitz
  rationale: ירשׁ bezeichnet im Zusammenhang der Landnahme das Inbesitznehmen eines Gebietes, häufig mit der mitgedachten Verdrängung der bisherigen Herrscher. Die Formulierung ist im heutigen Deutsch natürlich und vermeidet die hier irreführende Vorstellung eines Erbgangs.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: Das Suffix der 3. Person Singular bezieht sich im Zusammenhang auf den zuvor genannten König Sihon. „Sein Land“ gibt die Form knapp und unmittelbar wieder, ohne den Namen erklärend in den Text einzusetzen.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: das Land Ogs, des Königs von Baschan
  rationale: Die hebräische Genitivverbindung wird direkt und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: diese beiden Könige der Amoriter
  rationale: Die Wendung bezeichnet Sihon und Og gemeinsam. Ein neuer Satz macht die im Hebräischen knappe Apposition im Deutschen eindeutig, ohne ihre sachliche Beziehung aufzulösen.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die konventionelle geografische Wendung bewahrt die perspektivische Offenheit des hebräischen Ausdrucks.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: gegen Sonnenaufgang
  rationale: Die Wiedergabe erhält das konkrete Bild des hebräischen Ausdrucks und bezeichnet zugleich verständlich die östliche Richtung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sehr knappe hebräische Apposition wurde zur besseren Verständlichkeit in einen zweiten Satz überführt. Das anaphorische „sein“ bleibt erhalten, damit der Kontextbezug auf Sihon nicht erklärend in den Vers hineingeschrieben wird.
