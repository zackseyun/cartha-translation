id: DEU.4.14
reference: Deuteronomy 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: de
  text: Und mir gebot Jahwe damals, euch Satzungen und Rechtsbestimmungen[a] zu lehren, damit ihr sie in dem Land befolgt, in das ihr hinüberzieht, um es in Besitz zu nehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ordnungen und Rechtssätze«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um es als Erbbesitz zu erhalten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: Und mir
  rationale: Die Voranstellung des Objekts im Hebräischen wird beibehalten und lässt den leichten Kontrast zum vorausgehenden Vers erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Wiedergabe des offenbarten Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: צִוָּה
  choice: gebot
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Anweisung und passt zum würdevollen gesetzlichen Kontext.
- source_word: לְלַמֵּד
  choice: zu lehren
  rationale: Die Form bezeichnet Moses Auftrag, Israel den Inhalt verbindlich zu vermitteln.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: Satzungen und Rechtsbestimmungen
  rationale: Die Wortwahl wahrt die Unterscheidung der beiden hebräischen Rechtsbegriffe und ist zugleich in modernem Deutsch verständlich.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: damit ihr sie befolgt
  rationale: Wörtlich steht „damit ihr sie tut“. Im Deutschen gibt „befolgen“ den idiomatischen Sinn des Tuns gesetzlicher Vorschriften klar wieder.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: „Land“ entspricht dem geografischen und bundesgeschichtlichen Sprachgebrauch des Deuteronomiums.
- source_word: עֹבְרִים שָׁמָּה
  choice: in das ihr hinüberzieht
  rationale: Die Form beschreibt den bevorstehenden Übergang in das Land und bewahrt das deuteronomische Motiv des Hinüberziehens.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: Die Wendung gibt den finalen Infinitiv natürlich wieder und lässt die mögliche Bedeutungsnuance „als Erbbesitz erhalten“ in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den persönlichen Gottesnamen.
- issue: Bedeutungsumfang von ירשׁ
  choice: in Besitz nehmen
  alternative: als Erbbesitz erhalten
  rationale: Im Kontext steht der bevorstehende Einzug in das Land im Vordergrund; zugleich kann das Verb dessen Empfang als Erbbesitz ausdrücken, weshalb die Alternative nicht ausgeschlossen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Anfangsstellung „Und mir“ bildet die hebräische Hervorhebung ab. „Befolgt“ vermeidet die im Deutschen unnatürliche Formulierung „sie tut“, während die rechtliche Verpflichtung erhalten bleibt.
