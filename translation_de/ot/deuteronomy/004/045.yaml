  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: de
  text: Dies sind die Zeugnisse, die Satzungen und die Rechtsbestimmungen, die Mose zu den Israeliten[a] sprach, als sie aus Ägypten auszogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: zu den Söhnen Israels; gemeint sind die Israeliten, das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die pluralische Hinweisform leitet die folgenden Rechtskategorien ein; im Deutschen wird die verblos formulierte hebräische Aussage idiomatisch mit „sind“ wiedergegeben.
- source_word: הָעֵדֹת
  choice: die Zeugnisse
  rationale: „Zeugnisse“ bewahrt die Grundbedeutung des Wortes und seinen Bezug auf verbindliche, den Bund bezeugende Weisungen, ohne es mit den folgenden Rechtsbegriffen gleichzusetzen.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: „Satzungen“ ist eine präzise und im rechtlichen Kontext verständliche Wiedergabe für festgesetzte Vorschriften.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet rechtliche Entscheidungen oder Regelungen. „Rechtsbestimmungen“ erhält den juristischen Sinn und unterscheidet den Begriff von „Satzungen“.
- source_word: אֲשֶׁר דִּבֶּר
  choice: die Mose … verkündete
  rationale: Das hebräische Verb bedeutet grundsätzlich „reden/sprechen“. Im Zusammenhang mit der öffentlichen Mitteilung von Rechtsweisungen gibt „verkündete“ die Funktion natürlich wieder, ohne einen zusätzlichen technischen Akt vorauszusetzen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung schließt hier das ganze Volk ein; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: בְּצֵאתָם
  choice: als sie … zogen
  rationale: Die Präposition mit Infinitiv und Suffix hat zeitliche Bedeutung. „Als sie … zogen“ ist natürliches Deutsch und bewahrt den Bezug auf den Auszug.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Dies ist die übliche deutsche Wiedergabe der Herkunftsangabe und verbindet sich idiomatisch mit „zogen“.
