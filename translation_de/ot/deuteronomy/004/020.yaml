  rationale: Die Revision verdeutlicht die im Hebräischen durch לוֹ ausgedrückte Zuordnung des Volkes zu Jahwe und erhält zugleich die Erb- bzw. Besitzsprache von נַחֲלָה. Die Fußnote kennzeichnet die ungewöhnliche wörtliche Struktur und bietet eine verständliche Erklärung, ohne eine weitergehende theologische Deutung einzutragen. Die Umstellung von „heraus“ dient allein der Natürlichkeit des modernen Standarddeutschen.
