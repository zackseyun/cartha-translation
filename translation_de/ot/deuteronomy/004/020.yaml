  source_fidelity: 'Der Entwurf gibt die Verben „nahm“ und „führte ... heraus“, das Bild vom Eisenschmelzofen sowie die doppelte Ortsangabe „aus Ägypten“ grundsätzlich zutreffend wieder. Die Wendung „ein Volk als Erbbesitz“ ist jedoch im Deutschen semantisch und syntaktisch zu unbestimmt: Sie lässt offen, wessen Erbbesitz gemeint ist und bildet die Zuordnung durch לוֹ nur schwer verständlich ab.'
  naturalness: „führte euch aus dem Eisenschmelzofen, aus Ägypten, heraus“ ist zwar möglich, aber durch die weit getrennte Verbpartikel schwerfällig. Eine Umstellung zu „führte euch heraus aus ...“ ist modernes, natürliches Standarddeutsch und bewahrt die Betonung der Herausführung.
  terminology: „Jahwe“ ist als Wiedergabe des Gottesnamens angemessen. „Eisenschmelzofen“ bewahrt das konkrete Bild besser als eine bloß metaphorische Umschreibung. Die Besitz- und Erbsprache von לְעַם נַחֲלָה sollte ausdrücklich Jahwe zugeordnet und zugleich als ungewöhnliche Formulierung kenntlich bleiben.
