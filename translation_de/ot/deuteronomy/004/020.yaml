  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: de
  text: Doch euch nahm Jahwe und führte euch heraus aus dem Eisenschmelzofen, aus Ägypten, damit ihr ein Volk seid, das ihm als Erbbesitz gehört[a] – so wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um ihm ein Volk des Erbbesitzes zu sein«; auch möglich: »um ihm ein Volk seines Erbbesitzes zu sein«. Gemeint ist ein Volk, das ihm gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Wiedergabe des Gottesnamens bewahrt dessen Charakter als Eigenname.
- source_word: לָקַח
  choice: nahm
  rationale: Entspricht dem schlichten Grundsinn des Verbs und lässt im Zusammenhang das Erwählen und Inbesitznehmen Israels mitschwingen, ohne es ausdrücklich hineinzulesen.
- source_word: וַיּוֹצִא
  choice: führte ... heraus
  rationale: Gibt den kausativen Sinn im Exoduszusammenhang natürlich wieder.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: aus dem Eisenschmelzofen
  rationale: Bewahrt das eindrückliche Bild eines Ofens, in dem Eisen geschmolzen wird, als Bezeichnung für die Bedrängnis in Ägypten.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Die Wiederholung von „aus“ entspricht der hebräischen Präposition und identifiziert Ägypten mit dem zuvor genannten Bild.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: damit ihr ihm ein Volk als Erbbesitz seid
  rationale: „Ihm“ bildet לוֹ ausdrücklich ab; „Volk als Erbbesitz“ bewahrt die ungewöhnliche Erb- und Besitzsprache von נַחֲלָה, ohne sie zu einer bloßen Aussage über besondere Wertschätzung abzuschwächen.
- source_word: כַּיּוֹם הַזֶּה
  choice: so wie es heute der Fall ist
  rationale: Gibt die hebräische Gegenwartsformel in verständlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bundes- und Besitzsprache in לְעַם נַחֲלָה
  choice: ein Volk als Erbbesitz
  alternative: sein eigenes Volk; ein Volk, das ihm gehört
  rationale: Die Formulierung wahrt, dass Israel Jahwe als נַחֲלָה zugeordnet wird, und erhält zugleich die Spannung des Erbbegriffs, statt sie durch eine allgemeinere Besitzumschreibung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die wiederholte Herausführung aus dem »Eisenschmelzofen«, nämlich aus Ägypten, sichtbar fest; die ungewöhnliche Erbbesitzsprache wird im Haupttext bewahrt und in der Fußnote erläutert.
