base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: de
  text: Ihr aber, die ihr an Jahwe, eurem Gott, festhaltet[a], seid heute alle am Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sich an Jahwe klammern“ oder „Jahwe anhängen“; der Ausdruck bezeichnet eine enge, treue Bindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion und das selbstständige Pronomen setzen die Angeredeten in einen deutlichen Gegensatz zu denen, die nach dem vorherigen Vers umkamen.
- source_word: הַ/דְּבֵקִים
  choice: die ihr … festhaltet
  rationale: Das substantivisch gebrauchte Partizip von דבק bezeichnet enge, fortdauernde Bindung und Treue. Das Präsens bildet die partizipiale Aussage natürlich ab, ohne ihren Bundesbezug zu verengen.
- source_word: בַּ/יהוָה
  choice: an Jahwe
  rationale: Die Präposition bezeichnet hier die enge Bindung an den mit seinem Eigennamen genannten Gott Israels.
- source_word: אֱלֹהֵי/כֶם
  choice: euren Gott
  rationale: Die Apposition mit dem Suffix der zweiten Person Plural weist Jahwe ausdrücklich als den Gott der Angeredeten aus.
- source_word: חַיִּים
  choice: am Leben
  rationale: Die prädikative Wendung ist im modernen Deutschen natürlicher als „lebendig“ und bezeichnet ihren gegenwärtigen Zustand.
- source_word: כֻּלְּ/כֶם
  choice: alle
  rationale: Das Wort betont, dass ausnahmslos alle so beschriebenen Angeredeten leben.
- source_word: הַ/יּוֹם
  choice: heute
  rationale: Die geläufige moderne Wiedergabe bewahrt den unmittelbaren zeitlichen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton unmittelbar; „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von דבק
  choice: festhalten an
  alternative: sich anklammern an / anhangen
  rationale: „Festhalten an“ wahrt sowohl die bildhafte enge Bindung als auch den möglichen Sinn treuer Bundesverbundenheit, ohne die Aussage auf eine bestimmte theologische Deutung festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anredeform „Ihr aber“ macht den Kontrast zum vorigen Vers sichtbar; die Satzstellung bewahrt die Hervorhebung der Angeredeten und ihrer gegenwärtigen Lebenssituation.
