  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: de
  text: Und Jahwe war zornig auf mich wegen eurer Worte[a] und schwor, dass ich den Jordan nicht überschreiten und nicht in das gute Land kommen würde, das Jahwe, dein Gott, dir als Erbbesitz gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euretwegen“. Wörtlich steht im Hebräischen: „wegen eurer Worte“.'
    reason: Bewahrt die lexikalische Formulierung im Haupttext und macht zugleich die mögliche idiomatische Bedeutung kenntlich.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in seiner im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִתְאַנֶּף בִּי
  choice: war zornig auf mich
  rationale: Der Hitpael von אנף bezeichnet heftigen Zorn; „zornig auf mich“ ist im Deutschen natürlich und wahrt den Aussagegehalt.
- source_word: עַל דִּבְרֵיכֶם
  choice: wegen eurer Worte
  rationale: Bewahrt das ausdrücklich vorhandene דִּבְרֵי („Worte“); die mögliche idiomatische Verallgemeinerung „euretwegen“ wird in der Fußnote genannt.
- source_word: וַיִּשָּׁבַע
  choice: und schwor
  rationale: Direkte und idiomatische Wiedergabe des Verbs für das Ablegen eines Schwurs.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: dass ich den Jordan nicht überschreiten ... würde
  rationale: Gibt den Inhalt des Schwurs in natürlichem Deutsch wieder; „überschreiten“ passt zur Bewegung über den Jordan.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: und nicht in das ... Land kommen würde
  rationale: Bewahrt die Bewegungsbedeutung von בוא und die Parallelität zum Überschreiten des Jordan.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: das gute Land
  rationale: Direkte Wiedergabe, ohne die Art seiner Güte durch Zusätze wie „fruchtbar“ einzuengen.
- source_word: נֹתֵן לְךָ
  choice: dir ... gibt
  rationale: Das deutsche Präsens gibt den partizipial ausgedrückten, als gegenwärtig bzw. feststehend dargestellten göttlichen Landgrant natürlich wieder.
- source_word: נַחֲלָה
  choice: als Erbbesitz
  rationale: Bezeichnet einen zugeteilten, bleibenden Besitz und wahrt den Zusammenhang von Landgabe und Erbe.
theological_decisions:
- issue: Zusammenhang zwischen Israels Worten und Moses Ausschluss vom Land
  choice: wegen eurer Worte
  alternative: euretwegen
  rationale: Die Übersetzung erhält das im Hebräischen ausdrücklich genannte „eure Worte“ und entscheidet nicht weitergehend, wie die Verantwortung theologisch zu verteilen ist.
- issue: Wechsel von pluralischer zu singularischer Anrede
  choice: eurer Worte ... dein Gott ... dir
  alternative: Vereinheitlichung der Anrede im Plural
  rationale: Der hebräische Text wechselt tatsächlich von der Mehrzahl zur Einzahl; dieser rhetorisch und theologisch mögliche bedeutsame Wechsel bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, ohne unnatürlich zu wirken. Der Wechsel zwischen pluralischer und singularischer Anrede wird bewusst nicht geglättet.
