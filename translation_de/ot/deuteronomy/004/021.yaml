  terminology: „Jahwe“ entspricht der angegebenen deutschen wissenschaftlichen Namenskonvention. „Zornig auf mich“, „das gute Land“ und „als Erbbesitz“ sind sachgerecht; besonders „Erbbesitz“ wahrt die Erb- bzw. Besitzdimension von נַחֲלָה, ohne sie dogmatisch auszudeuten. Die Fußnote ist korrekt verankert und bildet die lexikalische sowie idiomatische Spannweite von עַל־דִּבְרֵיכֶם angemessen ab.
