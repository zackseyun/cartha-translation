  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzinhalt präzise wieder: Jahwes Zorn gegen Mose, die Begründung עַל־דִּבְרֵיכֶם („wegen eurer Worte“), der Schwur bezüglich des Nichtüberschreitens des Jordan und des Nichteintretens in das gute Land sowie die Gabe des Landes als נַחֲלָה. Der Wechsel von pluralischer zu singularischer Anrede bleibt wie im hebräischen Text erhalten.'
