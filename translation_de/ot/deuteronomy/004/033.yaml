base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: de
  text: Hat je ein Volk die Stimme Gottes mitten aus dem Feuer reden hören, wie du sie gehört hast, und gelebt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und lebte“. Im Zusammenhang hebt dies hervor, dass das Volk nach dem Hören der Stimme Gottes weiterlebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע עָם
  choice: Hat je ein Volk … gehört
  rationale: Die Fragepartikel mit dem Perfekt leitet eine rhetorische Frage über eine jemals gemachte Erfahrung ein. „Hat je“ gibt diese Kraft im Deutschen natürlich wieder; עָם bezeichnet hier ein Volk als Gemeinschaft.
- source_word: קוֹל אֱלֹהִים
  choice: die Stimme Gottes
  rationale: קוֹל meint im Zusammenhang mit dem Reden eine vernehmbare Stimme, nicht bloß einen Laut. Der singularische Partizip und der Kontext bestimmen אֱלֹהִים als „Gott“.
- source_word: מְדַבֵּר
  choice: reden hören
  rationale: Die partizipiale Aussage beschreibt Gottes Stimme als redend. Die deutsche Konstruktion „die Stimme … reden hören“ ist idiomatisch und bewahrt den Vorgang des Sprechens.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: mitten aus dem Feuer
  rationale: Die Wendung bezeichnet den Ausgangspunkt aus dem Inneren des Feuers und erhält das räumliche Bild in natürlichem Deutsch.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: wie du sie gehört hast
  rationale: כַּאֲשֶׁר führt den Vergleich mit Israels Erfahrung ein. Das selbstständige Pronomen אַתָּה betont „du“, was durch das ausdrücklich gesetzte deutsche Pronomen wiedergegeben wird.
- source_word: וַ/יֶּחִי
  choice: und ist am Leben geblieben
  rationale: Das Verb bedeutet wörtlich „lebte“. Im Zusammenhang bezeichnet es, dass das Volk nach dem Hören der göttlichen Stimme weiterlebte; „ist am Leben geblieben“ drückt dies natürlich aus, ohne die Aussage über „überleben“ hinaus zu verstärken.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים bei der unmittelbaren göttlichen Selbstoffenbarung
  choice: Gott
  alternative: ein Gott; Götter
  rationale: Der singularische Partizip מְדַבֵּר und der Bundeszusammenhang am Horeb weisen eindeutig auf Israels Gott als singularischen Referenten.
- issue: Der angedeutete Gegensatz zwischen dem Hören Gottes und dem Weiterleben
  choice: und ist am Leben geblieben
  alternative: und überlebte; und lebte
  rationale: Die Übersetzung macht das im Kontext gemeinte Weiterleben verständlich, fügt aber kein verstärkendes „dennoch“ hinzu. So bleibt die knappe theologische Spannung des Hebräischen erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp; „mitten aus dem Feuer“ bewahrt das anschauliche Bild, während „am Leben geblieben“ die hebräische Aussage idiomatisch wiedergibt.
