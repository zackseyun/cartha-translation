  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: de
  text: Da sprach Jahwe aus der Mitte des Feuers[a] zu euch. Ihr hörtet den Klang von Worten[b], doch ihr saht keine Gestalt[c] – nur eine Stimme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Feuer heraus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Stimme/den Klang von Worten“; auch möglich: „den Klang einer Rede“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Abbild“, „Erscheinung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den hebräischen Eigennamen erkennbar zu bewahren und zugleich der im Deutschen etablierten Form zu folgen.
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: דבר bezeichnet hier das Sprechen; „sprach“ entspricht der erzählenden Vergangenheitsform und wahrt den feierlichen Ton.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Die Wendung bezeichnet ein Sprechen aus dem Inneren beziehungsweise aus der Mitte des Feuers; „mitten aus“ gibt dieses räumliche Bild natürlich wieder.
- source_word: קוֹל דְּבָרִים
  choice: den Klang von Worten
  rationale: Die hebräische Verbindung bedeutet wörtlich „Stimme/Klang von Worten“. Die gewählte Form bewahrt die Betonung des hörbaren, gegliederten Redens, ohne sie zu einer bloß undeutlichen Stimme abzuschwächen.
- source_word: שֹׁמְעִים
  choice: hörtet
  rationale: Das Partizip beschreibt im Rückblick das damalige Hören und wird im Deutschen idiomatisch als finite Vergangenheitsform wiedergegeben.
- source_word: תְמוּנָה
  choice: Gestalt
  rationale: תמונה bezeichnet eine sichtbare Form, Gestalt oder Erscheinung. „Gestalt“ ist hier natürlich und hält den Gegensatz zwischen hörbarer Offenbarung und fehlender sichtbarer Darstellung fest.
- source_word: אֵינְכֶם רֹאִים
  choice: ihr saht keine
  rationale: Die hebräische Negativkonstruktion bezeichnet das völlige Fehlen einer visuellen Wahrnehmung; die deutsche Vergangenheitsform passt zum Rückblick.
- source_word: זוּלָתִי קוֹל
  choice: nur eine Stimme
  rationale: זולתי kennzeichnet eine Ausnahme. Die Formulierung stellt der nicht gesehenen Gestalt allein das akustisch Wahrgenommene gegenüber; „Stimme“ ist hier eine natürliche Wiedergabe von קול.
theological_decisions:
- issue: Anthropomorphe beziehungsweise darstellende Sprache über Gottes Offenbarung
  choice: Der Gegensatz zwischen hörbarer göttlicher Rede und dem Fehlen einer sichtbaren Gestalt bleibt ausdrücklich bestehen.
  alternative: „Ihr hörtet seine Stimme, saht aber keine sichtbare Darstellung.“
  rationale: Der Vers bezeugt wirkliche göttliche Rede, ohne eine sichtbare Form zu beschreiben. Die Übersetzung bewahrt diese Spannung und erweitert sie nicht um spätere Lehraussagen zum Bilderverbot.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt klar und gut vorlesbar; der markante Gegensatz zwischen Hören und Nichtsehen sowie die ungewöhnliche hebräische Verbindung „Klang von Worten“ werden bewusst bewahrt.
