base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: de
  text: 'Haltet sie und handelt danach[a]; denn darin liegen eure Weisheit und eure Einsicht vor den Augen der Völker. Wenn sie von all diesen Satzungen[b] hören, werden sie sagen: »Gewiss, dieses große Volk ist ein weises und einsichtiges Volk!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Bewahrt sie und tut sie.« Gemeint ist, die Weisungen zu beachten und auszuführen.'
    reason: translation_clarity
  - marker: b
    text: »Satzungen« übersetzt חֻקִּים, einen Rechtsbegriff, der auch mit »Bestimmungen« oder »Ordnungen« wiedergegeben werden kann.
    reason: lexical_alternative
  - marker: c
    text: 'Das mit »Gewiss« wiedergegebene hebräische רַק bedeutet häufig »nur«, hat hier aber wahrscheinlich bekräftigende Bedeutung: »Gewiss« oder »Wahrhaftig«. Möglich ist auch: »Nur dieses große Volk ist ein weises und einsichtiges Volk.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: So haltet sie und handelt danach
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Befolgen; עשה hebt die praktische Ausführung hervor. Die deutsche Paarung bleibt knapp, vermeidet aber das unnatürliche »sie tun«.
- source_word: כִּי הִוא
  choice: denn darin liegen
  rationale: Das feminine Singularpronomen fasst die zuvor genannten Gebote beziehungsweise ihre Befolgung kollektiv zusammen. »Darin« wahrt diesen Rückbezug im Deutschen, ohne ihn enger festzulegen.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: eure Weisheit und eure Einsicht
  rationale: Die beiden verwandten, aber unterschiedlichen Begriffe bleiben als Begriffspaar erhalten; »Einsicht« ist in modernem Deutsch natürlicher als das substantivische »Verständnis« in diesem Kontext.
- source_word: לְעֵינֵי הָעַמִּים
  choice: vor den Augen der Völker
  rationale: Die bildhafte, öffentliche Dimension des hebräischen Ausdrucks wird direkt und verständlich wiedergegeben.
- source_word: הָעַמִּים
  choice: die Völker
  rationale: »Völker« ist die natürliche deutsche Entsprechung und bewahrt grundsätzlich die Mehrzahl gegenüber dem späteren kollektiven Singular גוי.
- source_word: אֲשֶׁר יִשְׁמְעוּן
  choice: Wenn sie ... hören
  rationale: Die relativische Konstruktion wird als natürlicher deutscher Zeitsatz wiedergegeben; der Zukunftsbezug ergibt sich aus dem anschließenden »werden sie sagen«.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: all diesen Satzungen
  rationale: »Satzungen« erhält den rechtlichen Charakter von חֻקִּים und ist in würdigem biblischem Deutsch weiterhin verständlich.
- source_word: רַק
  choice: Ja
  rationale: רַק hat hier wahrscheinlich bekräftigende, ausrufende Kraft. »Ja« gibt diese im Deutschen natürlich wieder; die wörtlichere Möglichkeit »nur« wird in einer Fußnote festgehalten.
- source_word: עַם חָכָם וְנָבוֹן
  choice: ein weises und einsichtiges Volk
  rationale: Die Formulierung greift »Weisheit und Einsicht« aus dem ersten Satzteil hörbar wieder auf und bewahrt so die innere Wortverbindung.
theological_decisions:
- issue: Verhältnis von Gehorsam und Weisheit
  choice: Das Halten und praktische Befolgen der Satzungen erscheint als Israels öffentlich erkennbare Weisheit und Einsicht.
  alternative: Die Satzungen als solche seien unabhängig von ihrer Befolgung Israels Weisheit und Einsicht.
  rationale: Der unmittelbare Zusammenhang verbindet die Aufforderung zum Halten und Tun mit כִּי הִוא. »Darin« lässt den Bezug auf die Weisungen und ihre Befolgung offen genug, ohne Aussagen über Verdienst oder nationale Überlegenheit hinzuzufügen.
- issue: Beurteilung Israels durch die anderen Völker
  choice: Die Völker erkennen Weisheit und Einsicht am großen Volk.
  alternative: Die Aussage sei ein uneingeschränktes Urteil über angeborene oder nationale Überlegenheit.
  rationale: Der Kontext begründet das Urteil mit dem Hören der Satzungen und deren Befolgung; die Übersetzung erhält diesen Zusammenhang, ohne ihn dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist lebendig, aber nicht umgangssprachlich. »Satzungen« bewahrt den rechtlichen Ton; Fußnoten erklären wörtlichere oder alternative Wiedergaben. Alle Fußnotenmarker stehen im Haupttext.
