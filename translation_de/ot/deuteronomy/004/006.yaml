  naturalness: Der Text ist flüssiges modernes Standarddeutsch. »Satzungen«, »Weisheit« und »Einsicht« ergeben einen angemessen würdevollen, verständlichen Rechtstextregister. »Gewiss« ist in der direkten Rede natürlicher und stilistisch passender als ein einleitendes »Ja«.
  terminology: »Satzungen« ist eine tragfähige Wiedergabe von חֻקִּים; die Fußnote dokumentiert passende Alternativen. Die wiederholte Wortverbindung »Weisheit und Einsicht« / »weises und einsichtiges Volk« erhält die hebräische Verbindung von חָכְמָה und בִּינָה bzw. נָבוֹן. Die Unterscheidung zwischen den Völkern und dem einen großen Volk bleibt erhalten.
