  terminology: „Land“ wahrt die deuteronomische Terminologie von אֶרֶץ. „In Besitz nehmen“ trifft ירשׁ im Kontext der Landnahme; die Fußnote bewahrt zutreffend die Nuancen „besitzen“ und Erbbesitz. Die Namensform „Jordan“ ist korrekt. Die Fußnote zu „werde … sterben“ gibt die mögliche imminente Nuance des Partizips angemessen wieder, ohne sie im Haupttext zu erzwingen.
