  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: כִּי als begründendes „Denn“, Moses’ bevorstehenden Tod, sein Nichtüberschreiten des Jordan sowie den Gegensatz zum Volk und dessen anschließende Inbesitznahme des guten Landes. Die futurischen deutschen Formen sind für die hier vorliegenden Partizipien idiomatisch und sachlich angemessen.'
