source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: de
  text: Denn ich werde in diesem Land sterben[a]; ich werde den Jordan nicht überqueren. Ihr aber werdet hinüberziehen und dieses gute Land in Besitz nehmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich bin im Begriff, in diesem Land zu sterben.“ Das hebräische Partizip kann ein unmittelbar bevorstehendes Geschehen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „als Erbbesitz erhalten“ oder „besitzen“. Das hebräische Verb bezeichnet die Besitzergreifung des Landes, das Israel als Erbe zugesprochen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung bzw. Ermahnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: אָנֹכִי מֵת
  choice: ich werde … sterben
  rationale: Das selbstständige Pronomen hebt Mose gegenüber dem Volk hervor; das Partizip bezeichnet hier seinen bevorstehenden Tod. Die deutsche Futurform ist natürlich, während die zeitliche Nähe in einer Fußnote kenntlich bleibt.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: „Land“ entspricht dem üblichen Sprachgebrauch des Deuteronomiums und bezeichnet hier das Gebiet östlich des Jordan.
- source_word: אֵינֶנִּי עֹבֵר אֶת הַיַּרְדֵּן
  choice: ich werde den Jordan nicht überqueren
  rationale: Die Negation mit Partizip bezeichnet ein unmittelbar bevorstehendes, aber für Mose ausgeschlossenes Geschehen. „Den Jordan überqueren“ ist im modernen Deutschen klar und idiomatisch.
- source_word: וְאַתֶּם עֹבְרִים
  choice: Ihr aber werdet hinüberziehen
  rationale: Das וְ markiert im Zusammenhang den Gegensatz zwischen Mose und Israel. „Hinüberziehen“ bewahrt sowohl die Bewegung über den Fluss als auch den gemeinschaftlichen Aufbruch des Volkes.
- source_word: וִירִשְׁתֶּם
  choice: in Besitz nehmen
  rationale: ירשׁ bezeichnet im Zusammenhang der Landverheißung die Besitzergreifung des Landes, das Israel als Erbbesitz erhält. Die Formulierung ist verständlicher und dynamischer als bloßes „besitzen“.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: dieses gute Land
  rationale: Bewahrt die wertende Bezeichnung und die für das Deuteronomium charakteristische Wendung ohne sie als „fruchtbar“ oder „angenehm“ einzuengen.
theological_decisions:
- issue: Landbesitz als Inbesitznahme oder Erbe
  choice: in Besitz nehmen
  alternative: erben
  rationale: Das Verb ירשׁ kann den Empfang als Erbbesitz und die tatsächliche Besitzergreifung bezeichnen. Der Haupttext gibt die Handlung wieder; die Fußnote erhält die erbrechtliche Bedeutungsnuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gegensatz zwischen Mose und dem Volk wird durch „aber“ ausdrücklich gemacht. Die parallelen Zukunftsaussagen sind im Deutschen idiomatisch formuliert; Fußnoten bewahren die aspektuelle und lexikalische Spannweite des Hebräischen.
