source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: de
  text: 'Dir wurde dies gezeigt, damit du erkennst: Jahwe, er[a] ist Gott; außer ihm gibt es keinen anderen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz hebt durch das zusätzliche Pronomen hervor: „Jahwe, er ist Gott.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: Dir wurde dies gezeigt
  rationale: 'Der Hofal von ראה ist kausativ-passiv: Israel hat nicht lediglich selbst gesehen, sondern bekam die Machttaten Gottes vor Augen geführt. Das deutsche Passiv bildet diese Aussage natürlich ab.'
- source_word: לָדַעַת
  choice: damit du erkennst
  rationale: Der Infinitiv mit ל bezeichnet hier Zweck beziehungsweise beabsichtigtes Ergebnis. „Erkennen“ gibt in diesem Zusammenhang ein durch das Gezeigte gewonnenes, bewusstes Wissen wieder.
- source_word: כִּי
  choice: '[durch Doppelpunkt wiedergegeben]'
  rationale: כִּי leitet den Inhalt der Erkenntnis ein. Ein Doppelpunkt ist im Deutschen nach „erkennst“ idiomatisch und macht dieselbe syntaktische Beziehung deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige Form der wissenschaftlich begründeten Umschrift.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen wird beibehalten, um die emphatische Identifizierung „Jahwe, er ist Gott“ nicht einzuebnen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Obwohl das Hebräische den Artikel hat, ist im deutschen Prädikatsnomen „Gott“ natürlich und gibt die Identifizierung angemessen wieder; „der Gott“ wäre hier missverständlich oder unnötig markiert.
- source_word: אֵין עוֹד
  choice: gibt es keinen anderen
  rationale: Die hebräische Wendung bestreitet die Existenz eines weiteren Gottes. Diese Formulierung ist klares, heutiges Deutsch und wahrt die Ausschließlichkeit der Aussage.
- source_word: מִלְבַדּוֹ
  choice: außer ihm
  rationale: Die Präposition bezeichnet Ausschluss. „Außer ihm“ ist knapp, idiomatisch und inhaltlich genau.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Form „Jahwe“ bewahrt ihn als Namen und entspricht deutscher Sprachkonvention, ohne ihn durch einen Titel zu ersetzen.
- issue: Nachdruck der Identifizierung durch הוּא
  choice: Jahwe, er ist Gott
  alternative: Jahwe ist Gott
  rationale: Das ausdrückliche Pronomen trägt Nachdruck. Seine Beibehaltung erhält die markierte hebräische Form, ohne „allein“ vorwegzunehmen, da der folgende Satz die Ausschließlichkeit ausdrücklich aussagt.
- issue: Reichweite des Ausschließlichkeitsanspruchs
  choice: außer ihm gibt es keinen anderen
  alternative: sonst gibt es keinen; niemand ist außer ihm
  rationale: Die Übersetzung bewahrt die eindeutige Aussage, dass es keinen weiteren Gott gibt, ohne sie durch zusätzliche philosophische oder konfessionelle Begriffe auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Singular „du“ entspricht der direkten Anrede Israels. Die leicht markierte Wortfolge „Jahwe, er ist Gott“ bewahrt den Nachdruck des Hebräischen; die Fußnote erklärt diese Form.
