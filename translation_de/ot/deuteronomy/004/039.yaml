base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: de
  text: 'So erkenne heute und nimm es dir zu Herzen[a]: Jahwe, er ist Gott oben im Himmel und unten auf der Erde; es gibt keinen anderen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Bring es zu deinem Herzen zurück“; eine Wendung dafür, eine Wahrheit innerlich anzuerkennen und anzunehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Es gibt keinen außer ihm.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: So erkenne heute
  rationale: Das Qal Perfekt mit vorangestellter Konjunktion hat hier im Zusammenhang auffordernden Charakter. „Erkenne“ gibt sowohl das Wissen als auch das anerkennende Erfassen wieder; „heute“ bewahrt die unmittelbare zeitliche Zuspitzung.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: und nimm es dir zu Herzen
  rationale: Die Wendung mit dem Hifil von שׁוב und „Herz“ bezeichnet das bewusste innere Aufnehmen einer Wahrheit. Die geläufige deutsche Redewendung bewahrt das Herzmotiv und vermeidet eine rein verstandesmäßige Verengung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא הָאֱלֹהִים
  choice: er ist Gott
  rationale: Das ausdrücklich gesetzte Pronomen הוּא trägt Nachdruck. Die Formulierung „Jahwe, er ist Gott“ bewahrt diese Hervorhebung; der Artikel bei אֱלֹהִים kennzeichnet hier den wahren Gott, ohne dass im Deutschen „der Gott“ nötig wäre.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: im Himmel oben und auf der Erde unten
  rationale: Die räumliche Gegenüberstellung wird knapp und natürlich wiedergegeben und bezeichnet zusammen die gesamte Wirklichkeit. Der hebräische Plural שָׁמַיִם wird entsprechend üblichem modernem Deutsch als „Himmel“ übersetzt.
- source_word: אֵין עוֹד
  choice: es gibt keinen anderen
  rationale: Die Wendung spricht absolute Ausschließlichkeit aus. „Keinen anderen“ ist im Deutschen idiomatisch und lässt den durch den Kontext gegebenen Bezug auf Gott bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Quelltext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Nachdruck in יְהוָה הוּא הָאֱלֹהִים
  choice: Jahwe, er ist Gott
  alternative: Jahwe ist Gott
  rationale: Das selbstständige Pronomen הוּא wird beibehalten, damit die ausdrückliche Identifikation und Hervorhebung des hebräischen Satzes nicht eingeebnet wird.
- issue: Ausschließlichkeitsanspruch in אֵין עוֹד
  choice: es gibt keinen anderen
  alternative: sonst ist keiner; es gibt keinen außer ihm
  rationale: Die Übersetzung bewahrt die uneingeschränkte Aussage über Jahwes einzigartige Gottheit, ohne sie durch spätere dogmatische Formulierungen zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung und die hebräische Hervorhebung „Jahwe, er“ bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der Wendung, die sie erläutern.
