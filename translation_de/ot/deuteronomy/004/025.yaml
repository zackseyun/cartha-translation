revisions:
- from: Wenn du Kinder und Enkel[a] zeugst und ihr im Land alt geworden seid[b], dann aber verderbt handelt, euch ein Schnitzbild in irgendeiner Gestalt[c] macht und tut, was in den Augen Jahwes, deines Gottes, böse ist, und ihn damit zum Zorn reizt —
  to: Wenn du Kinder und Enkelkinder hast[a] und ihr im Land alt geworden seid[b], wenn ihr dann verderbt handelt, ein Schnitzbild anfertigt, das irgendetwas darstellt[c], und tut, was in den Augen Jahwes, deines Gottes, böse ist, und ihn damit zum Zorn reizt —
  rationale: Die Revision präzisiert die Beziehung von Schnitzbild und dargestelltem Gegenstand und ersetzt die im Deutschen problematische Verbindung „Enkel zeugen“ durch eine natürliche genealogische Formulierung. Der quellsprachliche Numeruswechsel, der Gottesname, der warnende Registerton und der satzfortführende Gedankenstrich bleiben bewahrt.
