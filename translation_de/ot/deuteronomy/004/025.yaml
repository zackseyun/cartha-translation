  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: de
  text: Wenn du Kinder und Enkelkinder hast[a] und ihr im Land alt geworden seid[b], wenn ihr dann verderbt handelt, ein Schnitzbild anfertigt, das irgendetwas darstellt[c], und tut, was in den Augen Jahwes, deines Gottes, böse ist, und ihn damit zum Zorn reizt —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Söhne und Enkelsöhne“. Im Hebräischen stehen maskuline Bezeichnungen für Nachkommen; hier sind wahrscheinlich die nachfolgenden Generationen insgesamt gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr schon lange im Land ansässig seid“. Das hebräische Verb kann sowohl das Altwerden als auch langes Eingesessensein hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als Abbild von irgendetwas“ beziehungsweise „in irgendeiner Form“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet hier eine zukünftige Bedingungs- bzw. Zeitangabe ein, deren Folgesatz in Vers 26 steht.
- source_word: תוֹלִיד
  choice: du … zeugst
  rationale: Bewahrt die kausative Bedeutung des Hifil sowie die zunächst singularische, männliche Anrede.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: Kinder und Enkel
  rationale: Die maskulinen Abstammungsbegriffe bezeichnen im generationenübergreifenden Zusammenhang wahrscheinlich die Nachkommenschaft allgemein; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: ihr im Land alt geworden seid
  rationale: Gibt sowohl das Altwerden als auch den Gedanken langen Ansässigseins wieder und wahrt den Wechsel zum Plural.
- source_word: וְהִשְׁחַתֶּם
  choice: verderbt handelt
  rationale: Bezeichnet hier verderbtes, bundwidriges Verhalten, ohne ein im Hebräischen nicht ausdrücklich markiertes Reflexivpronomen einzufügen.
- source_word: פֶּסֶל
  choice: Schnitzbild
  rationale: Bezeichnet konkret ein durch Schnitzen oder Behauen gefertigtes Bild und vermeidet die stärker deutende Wiedergabe „Götzenbild“.
- source_word: תְּמוּנַת כֹּל
  choice: in irgendeiner Gestalt
  rationale: Bewahrt die umfassende Bedeutung der Wendung und klingt im Deutschen natürlich.
- source_word: הָרַע בְּעֵינֵי
  choice: was in den Augen … böse ist
  rationale: Erhält die hebräische Bewertungsmetapher in verständlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לְהַכְעִיסוֹ
  choice: ihn damit zum Zorn reizt
  rationale: Bringt die kausative Bedeutung und den Bezug auf die vorherigen bösen Taten klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Abstammungsbegriffe בָּנִים וּבְנֵי בָנִים
  choice: Kinder und Enkel
  alternative: Söhne und Enkelsöhne
  rationale: Im Zusammenhang der Bundeswarnung umfasst die Wendung wahrscheinlich die Nachkommenschaft über mehrere Generationen; die formale maskuline Lesart bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Numeruswechsel des Hebräischen wird bewahrt: zunächst singularisches „du“ beim Zeugen, danach pluralisches „ihr“ für die angesprochene Gemeinschaft. Der Gedankenstrich zeigt an, dass der Satz in Vers 26 weitergeführt wird.'
