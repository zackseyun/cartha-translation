  text: אָ֣ז יַבְדִּ֤יל מֹשֶׁה֙ שָׁלֹ֣שׁ עָרִ֔ים בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן מִזְרְחָ֖/ה שָֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/041.yaml
  text: Then Moses set apart three cities beyond the Jordan[a], toward the sunrise[b],
translation:
  language: de
  text: Damals sonderte Mose drei Städte jenseits des Jordan[a] aus, in Richtung Sonnenaufgang[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Jordan“. Die hebräische Wendung ist eine geografische Bezeichnung, deren genaue Wiedergabe von der räumlichen Erzählperspektive abhängt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Aufgang der Sonne hin“, das heißt: nach Osten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Das temporale Adverb leitet den nächsten berichteten Vorgang ein. „Damals“ ist im Deutschen natürlich und kann hier den Rückbezug auf die zuvor geschilderte Situation ausdrücken.
- source_word: יַבְדִּיל
  choice: sonderte … aus
  rationale: Der Hifil von בדל bezeichnet das Absondern oder Auswählen für einen bestimmten Zweck. „aussondern“ bewahrt diesen Sinn, ohne die Funktion der Städte bereits im Vers ausdrücklich vorwegzunehmen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: שָׁלֹשׁ עָרִים
  choice: drei Städte
  rationale: Direkte und natürliche Wiedergabe der Zahlwort-Nomen-Verbindung.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die hebräische geografische Wendung bezeichnet die andere Seite des Jordan; „jenseits des Jordan“ ist knapp und bewahrt die vom jeweiligen Standort abhängige Perspektive.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: in Richtung Sonnenaufgang
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild vom Aufgang der Sonne und ist zugleich als Richtungsangabe verständlich.
