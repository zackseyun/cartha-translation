  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: de
  text: Und Jahwe wird euch unter die Völker zerstreuen, und ihr werdet nur wenige an Zahl unter den Nationen übrig bleiben, wohin Jahwe euch treiben[a] wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führen“. Das hebräische Verb kann sowohl „führen“ als auch „treiben“ bedeuten; im Zusammenhang von Gericht und Verbannung liegt hier „treiben“ näher.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: wird ... zerstreuen
  rationale: Der Hifil von פוץ bezeichnet verursachte Zerstreuung. „Zerstreuen“ gibt das Gerichtshandeln präzise und im Deutschen idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּעַמִּים
  choice: unter die Völker
  rationale: „Völker“ entspricht עַמִּים und bewahrt zugleich eine erkennbare, wenn auch semantisch überlappende Unterscheidung zu גּוֹיִם im folgenden Satzteil.
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: ihr werdet nur in geringer Zahl ... übrig bleiben
  rationale: Die Formulierung wahrt den resultativen Sinn des Niphal von שׁאר und gibt das Idiom מְתֵי מִסְפָּר natürlich als stark verminderte, zählbar kleine Zahl wieder.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: „Nationen“ bezeichnet hier die fremden Gemeinwesen und vermeidet die mögliche spätere religiöse Engführung von „Heiden“.
- source_word: אֲשֶׁר יְנַהֵג
  choice: zu denen ... treiben wird
  rationale: נהג kann „führen“ oder „treiben“ bedeuten. Im Zusammenhang von Gericht, Zerstreuung und Verbannung bringt „treiben“ den Zwang der Wegführung angemessen zum Ausdruck.
- source_word: שָׁמָּה
  choice: zu denen
  rationale: Das lokale „dorthin“ wird im Deutschen idiomatisch in die Relativverbindung „zu denen“ aufgenommen; ein zusätzliches „dorthin“ wäre redundant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Transliteration bewahrt seine Funktion als persönlicher Bundesname.
- issue: Bedeutung von יְנַהֵג im Gerichtskontext
  choice: treiben
  alternative: führen
  rationale: Beide Bedeutungen sind lexikalisch möglich. Wegen des Zusammenhangs von Gericht und erzwungener Zerstreuung steht „treiben“ im Haupttext; die weniger harte Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, ohne unnatürlich wörtlich zu wirken. „Völker“ und „Nationen“ erhalten die im Ausgangstext vorhandene lexikalische Variation.
