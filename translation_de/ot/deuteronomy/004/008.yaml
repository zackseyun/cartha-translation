id: DEU.4.8
reference: Deuteronomy 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: de
  text: Und welche große Nation gibt es, die so gerechte Ordnungen und Rechtsbestimmungen hat wie diese ganze Weisung, die ich euch heute vorlege?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »dieses ganze Gesetz«. Das hebräische Wort Tora bedeutet »Weisung«; hier ist der Zusammenhang besonders rechtlich, wie »Ordnungen und Rechtsbestimmungen« zeigt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִי
  choice: Und welche ... gibt es
  rationale: Die wörtliche Frage »Und wer?« bezieht sich auf die folgende Nation; im Deutschen gibt »Und welche große Nation gibt es« die rhetorische Vergleichsfrage natürlich wieder.
- source_word: גּוֹי גָּדוֹל
  choice: große Nation
  rationale: גּוֹי bezeichnet hier ein politisch und ethnisch verstandenes Volk im Vergleich mit anderen Völkern; »Nation« erhält diesen kollektiven Sinn.
- source_word: חֻקִּים
  choice: Ordnungen
  rationale: Der Begriff bezeichnet verbindlich festgesetzte Vorschriften. »Ordnungen« wahrt den rechtlichen Charakter und bleibt von מִשְׁפָּטִים unterscheidbar.
- source_word: וּ/מִשְׁפָּטִים
  choice: und Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet rechtliche Entscheidungen beziehungsweise Regelungen. »Rechtsbestimmungen« macht den juristischen Sinn im heutigen Deutsch deutlich.
- source_word: צַדִּיקִם
  choice: gerecht
  rationale: Das Adjektiv beschreibt die Ordnungen und Rechtsbestimmungen als dem Rechten und der Gerechtigkeit entsprechend; »gerecht« bewahrt die rechtlich-moralische Dimension.
- source_word: כְּ/כֹל הַ/תּוֹרָה הַ/זֹּאת
  choice: wie diese ganze Weisung
  rationale: תּוֹרָה bedeutet grundlegend »Weisung« und bezeichnet hier im unmittelbaren Zusammenhang den gesamten vorgelegten Rechts- und Lehrbestand. »Weisung« bewahrt die semantische Breite, ohne den konkret rechtlichen Kontext zu verdecken.
- source_word: נֹתֵן לִ/פְנֵי/כֶם
  choice: die ich euch ... vorlege
  rationale: Die Verbindung von נָתַן mit לִפְנֵי bezeichnet idiomatisch das Vorlegen beziehungsweise Vorstellen vor den Adressaten; »vorlege« ist dafür natürliches modernes Deutsch.
- source_word: הַ/יּוֹם
  choice: heute
  rationale: »Heute« gibt die zeitliche Hervorhebung klar und ohne archaische Färbung wieder.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: Der Kontext ist ausdrücklich rechtlich, doch תּוֹרָה umfasst mehr als ein Gesetz im modernen Sinn und kann göttliche Unterweisung bezeichnen. »Weisung« erhält diese Breite; die geläufige kontextuelle Alternative »Gesetz« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der rechtliche Parallelismus bleiben erhalten; die beiden hebräischen Rechtsbegriffe werden bewusst unterschiedlich wiedergegeben.
