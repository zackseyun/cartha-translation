  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: de
  text: damit ihr nicht verwerflich handelt und euch ein geschnitztes Bild macht[a], in Gestalt irgendeiner Figur, als Abbild eines Mannes oder einer Frau –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hütet euch, dass ihr euch nicht ins Verderben stürzt, indem ihr euch ein geschnitztes Bild macht: eine Gestalt irgendeiner Figur, ein Abbild eines Mannes oder einer Frau.“'
    reason: Die Warnpartikel פֶּן und die Verbform תַּשְׁחִתוּן können stärker als ausdrückliche Warnung beziehungsweise reflexiv-resultativ verstanden werden; auch das Verhältnis der gehäuften Bildbegriffe lässt sich appositionell wiedergeben.
lexical_decisions:
- source_word: פֶּן
  choice: damit … nicht
  rationale: Leitet im Zusammenhang eine Warnung vor einer unerwünschten Folge ein. „Damit … nicht“ schließt natürlich an den vorhergehenden Satz an; „hütet euch, dass …“ wäre ebenfalls möglich.
- source_word: תַּשְׁחִתוּן
  choice: verderblich handelt
  rationale: Der Hifil von שׁחת bezeichnet hier aktives, zerstörerisch-verwerfliches Handeln. Die Wiedergabe bewahrt sowohl den moralischen als auch den ruinösen Beiklang.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: und euch … macht
  rationale: 'Das deutsche Reflexivpronomen gibt den benefaktiven Sinn von לָכֶם wieder: Sie fertigen das Bild für sich selbst an.'
- source_word: פֶּסֶל
  choice: ein geschnitztes Bild
  rationale: Bezeichnet ein durch Bearbeitung, besonders Schnitzen, hergestelltes Bild. Die Formulierung ist präzise und vermeidet das altertümliche „Schnitzbild“.
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: in Gestalt irgendeiner Figur
  rationale: Die Wendung beschreibt die äußere Form einer bildlichen Darstellung. „Figur“ wahrt die Breite von סֶמֶל und verengt den Ausdruck nicht vorzeitig auf „Götze“.
- source_word: תַּבְנִית
  choice: als Abbild
  rationale: Bezeichnet Muster, Gestalt oder Ähnlichkeit. „Als Abbild“ unterscheidet den Ausdruck sprachlich von תְּמוּנָה und leitet die folgenden Kategorien natürlich ein.
- source_word: זָכָר אֹו נְקֵבָה
  choice: eines männlichen oder weiblichen Wesens
  rationale: Die hebräischen Wörter bezeichnen das männliche beziehungsweise weibliche Geschlecht und sind nicht auf erwachsene Menschen beschränkt. „Wesen“ wahrt diese Breite angesichts der anschließenden Tieraufzählung.
theological_decisions:
- issue: Wiedergabe der gehäuften Begriffe für bildliche Darstellungen
  choice: „geschnitztes Bild“, „Gestalt … einer Figur“ und „Abbild“ werden unterschieden
  alternative: Alle Begriffe einheitlich mit „Bild“ oder סֶמֶל ausdrücklich mit „Götze“ wiedergeben
  rationale: Der hebräische Text häuft mehrere einander überschneidende Begriffe. Unterschiedliche, aber sachlich verwandte deutsche Ausdrücke erhalten diese Rhetorik, ohne den möglichen kultischen Bezug von סֶמֶל durch „Götze“ als alleinige Bedeutung festzulegen.
- issue: Bezug von זָכָר אֹו נְקֵבָה
  choice: „männliches oder weibliches Wesen“
  alternative: „Mann oder Frau“ beziehungsweise „Männchen oder Weibchen“
  rationale: Die gewählte Formulierung lässt offen, ob zunächst Menschen oder allgemeiner geschlechtlich unterschiedene Lebewesen gemeint sind, und bewahrt so die Spannung zur anschließenden Aufzählung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung des vorangehenden Zusammenhangs kleingeschrieben und endet mit einem Gedankenstrich, da die Aufzählung in den folgenden Versen weitergeht. Der Fußnotenmarker [a] steht unmittelbar nach der betroffenen Hauptwendung.
