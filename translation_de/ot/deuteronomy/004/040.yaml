base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: de
  text: Darum halte seine Ordnungen und seine Gebote, die ich dir heute gebiete, damit es dir und deinen Kindern nach dir gut geht[a] und damit du lange auf dem Land lebst, das Jahwe, dein Gott, dir gibt, solange du lebst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „damit es dir und deinen Söhnen nach dir gut geht“. Das hebräische Wort kann je nach Zusammenhang „Söhne“, „Kinder“ oder weiter gefasst „Nachkommen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Darum halte
  rationale: Das mit waw verbundene Perfekt hat hier auffordernde Kraft und zieht die Folgerung aus dem vorausgehenden Zusammenhang. „Halte“ gibt שׁמר im Bundeskontext natürlich als Befolgen wieder.
- source_word: חֻקָּיו וְאֶת מִצְוֺתָיו
  choice: seine Ordnungen und seine Gebote
  rationale: „Ordnungen“ bezeichnet verbindliche Festsetzungen und bleibt von „Geboten“ als Wiedergabe von מִצְוֹת unterschieden.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Die präsentische Redehandlung des Partizips wird in idiomatischem Deutsch mit dem einfachen Präsens wiedergegeben.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: damit es dir ... gut geht
  rationale: Die hebräische Wendung bezeichnet Wohlergehen; die deutsche Formulierung ist gegenwärtig, klar und idiomatisch.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: und deinen Kindern nach dir
  rationale: בָּנִים kann Söhne, Kinder oder Nachkommen bezeichnen. Im generationenbezogenen Zusammenhang ist „Kinder“ angemessen, ohne die mögliche familiäre Unmittelbarkeit zu verlieren.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: und damit du lange ... lebst
  rationale: Die hebräische Bildrede „Tage verlängern“ wird in natürlichem Deutsch als langes Leben ausgedrückt.
- source_word: עַל הָאֲדָמָה
  choice: auf dem Land
  rationale: „Land“ bezeichnet hier das von Gott gegebene Gebiet; „auf“ bewahrt die Präposition עַל und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹתֵן לְךָ
  choice: dir ... gibt
  rationale: Das Partizip bezeichnet Gottes gegenwärtiges beziehungsweise unmittelbar bevorstehendes Geben; das deutsche Präsens lässt diese aspektuelle Offenheit bestehen.
- source_word: כָּל הַיָּמִים
  choice: für alle Zeit
  rationale: Die Wendung drückt hier die fortdauernde Gabe des Landes aus. „Für alle Zeit“ ist im Deutschen natürlich und bewahrt den umfassenden zeitlichen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ macht diesen sichtbar, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Verhältnis von Gehorsam und Wohlergehen
  choice: Zwecksätze mit „damit“
  alternative: rein konsekutive Wiedergabe mit „sodass“
  rationale: אֲשֶׁר und לְמַעַן verbinden die Aufforderung mit dem in Aussicht gestellten Wohlergehen und langen Leben. „Damit“ wahrt diese Ziel- beziehungsweise Folgebeziehung, ohne eine weitergehende systematische Aussage über Verdienst zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstruktur folgt dem hebräischen Gedankengang, wird aber für flüssiges Deutsch leicht gestrafft. Der Gottesname erscheint als „Jahwe“.
