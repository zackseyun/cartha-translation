base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: de
  text: Bezer in der Wüste[a], im Land der Hochebene, für die Rubeniter; Ramot in Gilead für die Gaditer und Golan in Baschan für die Manassiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Steppe“. Das hebräische Wort bezeichnet unbesiedeltes, als Weideland geeignetes Gebiet und nicht zwingend eine Sandwüste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Ortsname; in geläufiger deutscher Transliteration wiedergegeben.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet hier eine Wüsten- bzw. Steppenlandschaft; „Wüste“ ist die natürliche und etablierte deutsche Wiedergabe.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: im Land der Hochebene
  rationale: מִישֹׁר bezeichnet ebenes Land beziehungsweise ein Plateau. „Hochebene“ macht die erhöhte Lage des ostjordanischen Tafellands deutlich.
- source_word: לָרֻאוּבֵנִי
  choice: für die Rubeniter
  rationale: Das hebräische singularische Gentiliz ist kollektiv auf die Stammesangehörigen bezogen; im Deutschen ist der Plural natürlich und eindeutig.
- source_word: רָאמֹת
  choice: Ramot
  rationale: Ortsname; die Form „Ramot“ gibt das hebräische רָאמֹת angemessen und in deutscher Schreibweise wieder.
- source_word: בַּגִּלְעָד
  choice: in Gilead
  rationale: Regionalname; im Deutschen ohne Artikel gebraucht.
- source_word: לַגָּדִי
  choice: für die Gaditer
  rationale: Das singularische Gentiliz wird kollektiv verstanden und im Deutschen idiomatisch als Plural wiedergegeben.
- source_word: גּוֹלָן
  choice: Golan
  rationale: Ortsname; transliteriert.
- source_word: בַּבָּשָׁן
  choice: in Baschan
  rationale: Regionalname; „Baschan“ ist die etablierte deutsche Transliteration.
- source_word: לַמְנַשִּׁי
  choice: für die Manassiter
  rationale: Das singularische Gentiliz bezeichnet kollektiv die Angehörigen des Stammes Manasse und wird daher natürlich im Plural wiedergegeben.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: durch die Aufzählung und „und“ wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine direkte deutsche Entsprechung; die koordinierte Aufzählung bildet die Syntax ab.
