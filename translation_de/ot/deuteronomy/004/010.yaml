  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: de
  text: 'an dem Tag, als du am Horeb vor Jahwe, deinem Gott, standest, als Jahwe zu mir sagte: »Versammle das Volk bei mir! Ich will sie meine Worte hören lassen, damit sie lernen, mich zu fürchten, solange sie auf der Erde[a] leben, und ihre Kinder lehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Land«. Das hebräische Wort kann allgemein die Erde beziehungsweise den Erdboden oder konkreter das Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: an dem Tag, als
  rationale: Die temporale Relativkonstruktion wird im Deutschen natürlich wiedergegeben und bewahrt den Rückbezug auf das erinnerte Ereignis.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: du ... vor ... standest
  rationale: Bewahrt das konkrete Bild des Stehens vor Gott und fügt sich idiomatisch in den deutschen Nebensatz ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Bei einem Bergnamen ist »am Horeb« im Deutschen idiomatisch und lässt offen, ob der weitere Schauplatz der Berg oder die gleichnamige Gegend ist.
- source_word: הַקְהֶל לִי אֶת־הָעָם
  choice: Versammle das Volk bei mir
  rationale: Der Hifil-Imperativ bezeichnet das Zusammenrufen; »bei mir« gibt die Ausrichtung auf Gott natürlich wieder, ohne das לִי lediglich als Nutzenangabe zu deuten.
- source_word: וְאַשְׁמִעֵם אֶת־דְּבָרָי
  choice: Ich will sie meine Worte hören lassen
  rationale: Bewahrt sowohl die kausative Form von שמע als auch den Plural »meine Worte«.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: damit sie lernen, mich zu fürchten
  rationale: Die Zweckbeziehung und das gewichtige Bundesmotiv der Gottesfurcht bleiben ausdrücklich erhalten.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: solange sie ... leben
  rationale: Gibt die hebräische Wendung für die gesamte Lebenszeit in klarem, natürlichem Deutsch wieder.
- source_word: עַל־הָאֲדָמָה
  choice: auf der Erde
  rationale: אֲדָמָה kann allgemein Erde beziehungsweise Erdboden oder konkreter Land bedeuten. Die Hauptfassung vermeidet eine vorschnelle Beschränkung auf das verheißene Land; die Alternative wird in der Fußnote bewahrt.
- source_word: וְאֶת־בְּנֵיהֶם יְלַמֵּדוּן
  choice: und damit sie ihre Kinder darin unterweisen
  rationale: בנים bezeichnet hier die nachfolgende Generation insgesamt. »Darin« macht den im Deutschen nötigen Bezug auf Gottes Worte und Gottesfurcht deutlich, ohne einen zusätzlichen Lehrinhalt einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« ist dessen geläufige deutsche Form und ersetzt ihn nicht durch einen Titel.
- issue: Wiedergabe von ירא im Bundeskontext
  choice: mich zu fürchten
  alternative: mich zu verehren; Ehrfurcht vor mir zu haben
  rationale: »Fürchten« erhält die Spannung zwischen Furcht, Ehrfurcht und gehorsamer Gottesbeziehung, statt den Ausdruck auf eine mildere Deutung einzuengen.
- issue: Referenz von בנים
  choice: Kinder
  alternative: Söhne
  rationale: Der maskuline Plural bezeichnet in diesem generationenbezogenen Zusammenhang die Nachkommen beziehungsweise Kinder insgesamt und ist nicht erkennbar auf männliche Kinder beschränkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; »fürchten« bewahrt die theologische Spannung. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung »auf der Erde«.
