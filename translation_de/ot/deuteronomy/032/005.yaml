  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: de
  text: Sie haben ihm gegenüber verderblich gehandelt[a]; wegen ihres Makels sind sie nicht seine Kinder. Sie sind eine verkehrte und verdrehte Generation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist hier schwierig und stark verdichtet. Der erste Satzteil kann auch als „Sie haben sich selbst verdorben“ verstanden werden; die folgende Wendung lässt sich auch als „ihr Makel“ oder „ihre Schuld“ wiedergeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „eine perverse und verkehrte Generation“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: haben verdorben gehandelt
  rationale: Die Piel-Form bezeichnet hier verderbtes oder verderbliches Handeln. Die Wiedergabe bewahrt die verbale Aussage, ohne einen im Konsonantentext nicht ausdrücklich bezeichneten reflexiven Sinn festzulegen.
- source_word: לוֹ
  choice: ihm gegenüber
  rationale: Die Präposition ל mit Suffix bezeichnet in diesem stark verdichteten Satz die Beziehung zu Gott. „Ihm gegenüber“ bleibt offen, ohne vorschnell ausschließlich „für ihn“ oder „gegen ihn“ zu sagen.
- source_word: לֹא בָּנָיו
  choice: sie sind nicht seine Kinder
  rationale: Der hebräische Nominalsatz wird für natürliches Deutsch mit „sie sind“ ergänzt. Ein zeitliches „nicht mehr“ steht nicht im Ausgangstext.
- source_word: מוּמָם
  choice: wegen ihres Makels
  rationale: מוּם bezeichnet einen Makel oder Fehler. „Makel“ bewahrt das Bild; „wegen“ macht den syntaktischen Zusammenhang verständlich, ohne die schwierige Wendung übermäßig auszudeuten.
- source_word: דּוֹר
  choice: Generation
  rationale: „Generation“ ist in diesem poetischen und bundestheologischen Zusammenhang die präzise und geläufige Entsprechung.
- source_word: עִקֵּשׁ
  choice: verkehrte
  rationale: Das Wort bezeichnet etwas moralisch Verdrehtes oder Verkehrtes. „Verkehrt“ ist im Deutschen verständlich und bewahrt die wertende Bildsprache.
- source_word: וּפְתַלְתֹּל
  choice: verdrehte
  rationale: Das seltene Adjektiv verstärkt das Bild moralischer Verformung. „Verdreht“ unterscheidet den Ausdruck von עִקֵּשׁ und bildet dennoch ein natürliches Wortpaar.
theological_decisions:
- issue: Ob לֹא בָּנָיו einen Verlust der Bundes-Kindschaft behauptet oder den kindlichen Charakter verneint
  choice: sie sind nicht seine Kinder
  alternative: sie sind nicht mehr seine Kinder; keine Kinder sind sie ihm
  rationale: Der hebräische Text formuliert die Verneinung scharf, enthält aber kein ausdrückliches Zeitsignal. Die Übersetzung bewahrt diese Spannung, ohne eine weitergehende Aussage über den Bundesstatus einzutragen.
- issue: Syntaktische Deutung des stark verdichteten ersten Versglieds
  choice: Sie haben ihm gegenüber verdorben gehandelt; wegen ihres Makels sind sie nicht seine Kinder.
  alternative: Sie haben sich selbst verdorben; sie sind nicht seine Kinder; ihr Makel gehört ihnen.
  rationale: Der masoretische Text ist syntaktisch ungewöhnlich und lässt mehrere Verknüpfungen zu. Die Hauptfassung ergibt verständliches Deutsch, während die echte Mehrdeutigkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Kürze und die beiden unterschiedlichen Bilder moralischer Verformung werden bewahrt; notwendige Ergänzungen bleiben sparsam.
