translation:
  language: de
  text: Denn ihr Fels ist nicht wie unser Fels, und unsere Feinde sind Richter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und unsere Feinde [sind] Richter“. Das hebräische Wort פְּלִילִים kann „Richter“ oder „Schiedsrichter“ bedeuten; der knappe Nominalsatz lässt den genauen Bezug ihres Richtens offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang des Mose-Liedes.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: ihr Fels ist nicht wie unser Fels
  rationale: Bewahrt die zweimalige Felsmetapher und ihre pointierte Gegenüberstellung. Im Deutschen wird „Fels“ in beiden Fällen großgeschrieben; eine typografische Unterscheidung zwischen dem Gott Israels und dem vermeintlichen Halt der Feinde lässt sich daher nicht durch Groß- und Kleinschreibung ausdrücken.
- source_word: וְאֹיְבֵינוּ
  choice: selbst unsere Feinde
  rationale: „Selbst“ gibt die rhetorische Pointe wieder, dass gerade die Gegner als bestätigende Instanz erscheinen; das hebräische וְ bleibt im Satzanschluss berücksichtigt.
- source_word: פְּלִילִים
  choice: sind Richter darüber
  rationale: Gibt das prädikativ gebrauchte Substantiv formal als „Richter“ wieder und macht mit „darüber“ den im Deutschen nötigen Bezug zur vorausgehenden Behauptung deutlich, ohne es zu „bezeugen“ oder „urteilen“ umzudeuten.
theological_decisions:
- issue: Deutung von צוּר als Gottesmetapher beziehungsweise Titel
  choice: Die Metapher „Fels“ im Haupttext bewahren
  alternative: Beschützer, Zuflucht oder Stärke
  rationale: Das Hebräische verwendet dasselbe Wort für Israels Gott und für den vermeintlichen Halt der anderen. Die Beibehaltung von „Fels“ erhält Wortspiel, Kontrast und theologische Spannung.
- issue: Forensische Aussage von פְּלִילִים
  choice: „Richter“ als prädikatives Substantiv beibehalten
  alternative: „urteilen“, „entscheiden“ oder „bezeugen“
  rationale: Die nominale Form wahrt den forensischen Klang und vermeidet, die genaue Funktion der Feinde eindeutiger festzulegen, als es der hebräische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den rhetorischen Nachsatz lesbar; „sind Richter darüber“ bleibt nahe an der hebräischen Nominalaussage und klingt zugleich natürlich.
