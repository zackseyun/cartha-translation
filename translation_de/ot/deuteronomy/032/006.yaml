source:
  edition: WLC
  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: de
  text: Vergeltet ihr Yahweh so, du törichtes und unweises Volk? Ist er nicht dein Vater, der dich erworben hat[a]? Er hat dich gemacht und dir Bestand gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der dich erschaffen hat“ oder „der dich gekauft hat“. Das hebräische Verb kann erwerben, besitzen, kaufen oder in manchen Zusammenhängen erschaffen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: Vergeltet ihr
  rationale: Das Verb bezeichnet hier, wie Israel Yahweh sein Handeln erwidert. „Vergelten“ bewahrt den Gedanken einer entsprechenden Rückgabe und passt zur vorwurfsvollen rhetorischen Frage.
- source_word: זֹאת
  choice: so
  rationale: Das Demonstrativum verweist auf die zuvor beschriebene Art des Verhaltens. Im Deutschen gibt „so“ die modale Bedeutung der Frage natürlich wieder.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: du törichtes und unweises Volk
  rationale: נָבָל bezeichnet moralisch verwerfliche Torheit, nicht bloß geringe Intelligenz. Der Singular „du“ bringt die direkte Anrede des kollektiv verstandenen Volkes zum Ausdruck.
- source_word: הֲלוֹא
  choice: Ist er nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, die Zustimmung erwartet; die Frageform bleibt erhalten.
- source_word: אָבִיךָ
  choice: dein Vater
  rationale: Die ausdrückliche Bezeichnung Gottes als Vater Israels wird relational und ohne zusätzliche Deutung wiedergegeben.
- source_word: קָּנֶךָ
  choice: der dich erworben hat
  rationale: קנה kann „erwerben“, „kaufen“, „besitzen“ und in bestimmten Zusammenhängen „erschaffen“ bedeuten. „Erworben“ wahrt hier die lexikalische Unterscheidung zu den nachfolgenden Verben „machen“ und „Bestand geben“.
- source_word: עָשְׂךָ
  choice: Er hat dich gemacht
  rationale: Die direkte Wiedergabe bezeichnet Gottes Hervorbringen beziehungsweise Gestalten Israels.
- source_word: וַיְכֹנְנֶךָ
  choice: und dir Bestand gegeben
  rationale: כון bezeichnet hier das Festigen, Gründen oder dauerhafte Einrichten. „Dir Bestand gegeben“ ist gegenwärtiges, verständliches Deutsch und hebt sich sinnvoll von „gemacht“ ab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von קנה in Bezug auf Gott und Israel
  choice: der dich erworben hat
  alternative: der dich erschaffen hat; der dich gekauft hat
  rationale: Der hebräische Ausdruck lässt mehrere Bedeutungen zu. „Erworben“ bewahrt die Zugehörigkeitsdimension und unterscheidet das Verb von „gemacht“ im nächsten Satz; die bedeutenden Alternativen werden in einer Fußnote offengelegt.
- issue: Gottes Vaterschaft gegenüber Israel
  choice: dein Vater
  alternative: dein Vater im Sinn von Ursprung oder Gründer
  rationale: Der Text nennt Yahweh ausdrücklich Israels Vater. Die Übersetzung wahrt diese Beziehungs- und Herkunftsaussage, ohne sie dogmatisch näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe und die kollektive Anrede im Singular bleiben erhalten. „Yahweh“ gibt den Gottesnamen wieder; „dir Bestand gegeben“ vermeidet ein unnötig fachsprachliches oder altertümliches „dich gegründet“.
