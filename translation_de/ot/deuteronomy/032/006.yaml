  terminology: „Yahweh“ folgt der vorgegebenen Namenskonvention. „Vater“ ist treffend und ohne dogmatische Erweiterung wiedergegeben. Die Fußnote zu קנה ist sprachlich klar, inhaltlich ausgewogen und am richtigen Wort verankert.
