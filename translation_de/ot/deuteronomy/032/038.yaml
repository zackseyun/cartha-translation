base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: de
  text: die das Fett ihrer Schlachtopfer aßen und den Wein ihrer Trankopfer tranken. Sie sollen aufstehen und euch helfen; sie sollen euch Schutz bieten!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: das Fett ihrer Schlachtopfer
  rationale: Gibt die kultische Bedeutung von חֵלֶב und זֶבַח konkret und quellennah wieder.
- source_word: יֵין נְסִיכָם
  choice: den Wein ihrer Trankopfer
  rationale: נֶסֶךְ bezeichnet hier die als Opfer ausgegossene Flüssigkeit; „Trankopfer“ ist die geläufige deutsche Kultbezeichnung.
- source_word: סִתְרָה
  choice: Schutz bieten
  rationale: Das seltene Substantiv bezeichnet einen verborgenen bzw. schützenden Ort. Die verbale Wendung klingt im Deutschen natürlich und bewahrt den Schutzgedanken.
theological_decisions:
- issue: Bezug der pluralischen Verben und Pronomen
  choice: Die fremden Götter werden ironisch aufgefordert, aufzustehen und den Angesprochenen zu helfen.
  alternative: Die Opfergaben oder andere unbestimmte Größen als Subjekt verstehen.
  rationale: Der unmittelbare Kontext von Vers 37 nennt die Götter und den Felsen, bei denen Israel Zuflucht suchte; die Relativkonstruktion führt diese ironische Herausforderung fort.
- issue: Modalität von יָקוּמוּ ... יְהִי
  choice: 'Aufforderung: „Sie sollen ...“'
  alternative: 'Zukünftige Aussage: „Sie werden ...“'
  rationale: Im Kontext der spöttischen Herausforderung sind die Jussivformen als Aufforderung zu verstehen, ohne zu behaupten, dass diese Götter tatsächlich helfen könnten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz setzt syntaktisch Vers 37 fort; deshalb beginnt die Übersetzung kleingeschrieben mit dem Relativsatz. Der ironisch-herausfordernde Ton bleibt erhalten.
