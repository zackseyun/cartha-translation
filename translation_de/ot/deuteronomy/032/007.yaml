  register: Modernes, gehobenes Standarddeutsch mit poetischem Parallelismus. Die direkte Anrede steht entsprechend dem hebräischen Singular durchgehend in der vertrauten Du-Form. „Vorzeit“, „Generation“ und „Älteste“ sind allgemein verständlich und zugleich dem würdevollen Ton des Liedes angemessen.
