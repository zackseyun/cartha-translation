base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: de
  text: Denk an die Tage der Vorzeit; bedenke die Jahre von Generation zu Generation.[a] Frag deinen Vater[b], und er wird es dir erzählen; frag deine Ältesten, und sie werden es dir sagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Jahre von Generation und Generation“; gemeint sind aufeinanderfolgende Generationen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, weiter gefasst: „deinen Vorfahren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Qal-Imperativ fordert unmittelbar zum Erinnern auf. „Denk an“ ist im modernen Deutsch natürlich und bewahrt den auffordernden Charakter.
- source_word: יְמוֹת עוֹלָם
  choice: die Tage der Vorzeit
  rationale: Die Wendung bezeichnet die weit zurückliegende Vergangenheit. „Vorzeit“ klingt würdevoll, ist verständlich und bleibt dem hebräischen Bild der „Tage“ nahe.
- source_word: בִּינוּ
  choice: bedenke
  rationale: Der Imperativ von בין kann verstehen, unterscheiden oder erwägen bedeuten. Im Parallelismus mit „Denk an“ bezeichnet er ein nachdenkliches Betrachten der Geschichte.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: die Jahre von Generation zu Generation
  rationale: Die nahezu wörtliche Wiedergabe bewahrt die distributive Folge aufeinanderfolgender Generationen und den poetischen Parallelismus.
- source_word: שְׁאַל
  choice: Frag
  rationale: Der einfache Imperativ wird direkt und idiomatisch mit „Frag“ wiedergegeben.
- source_word: אָבִיךָ
  choice: deinen Vater
  rationale: Der Singular mit Suffix bedeutet zunächst den eigenen Vater. Eine mögliche weiter gefasste Bedeutung wird nicht in den Haupttext eingetragen.
- source_word: וְיַגֵּדְךָ
  choice: und er wird es dir erzählen
  rationale: Der Hiphil von נגד bezeichnet das Mitteilen oder Bekanntmachen. „Erzählen“ passt zur Weitergabe erinnerter Geschichte; das ergänzte „es“ ist im Deutschen für einen natürlichen Satzanschluss erforderlich.
- source_word: זְקֵנֶיךָ
  choice: deine Ältesten
  rationale: Das Wort bezeichnet hier ältere, angesehene Träger gemeinschaftlicher Erinnerung, nicht lediglich alte Männer.
- source_word: וְיֹאמְרוּ לָךְ
  choice: und sie werden es dir sagen
  rationale: „Sagen“ bewahrt den Wechsel vom vorherigen Verb נגד zu אמר. Das im Deutschen ergänzte „es“ nimmt den erfragten Inhalt auf.
