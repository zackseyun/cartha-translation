  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: de
  text: 'Hätte ich nicht den Übermut des Feindes gescheut[a], damit Israels Gegner es nicht falsch deuteten[b], damit sie nicht sagten: »Unsere Hand ist überlegen[c], und nicht Jahwe hat dies alles getan.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hätte ich nicht die Provokation durch den Feind gescheut.«'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb ist schwierig; möglich sind auch »es verkennten« oder »falsch urteilten«, nämlich über die wahre Ursache von Israels Untergang.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Unsere Hand ist hoch.« Gemeint ist die Behauptung eigener Überlegenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Hätte ich nicht
  rationale: Gibt die konditional-ausnehmende Einleitung im Deutschen natürlich wieder und führt folgerichtig zum unausgesprochenen Gegenfall.
- source_word: כַּעַס אוֹיֵב
  choice: den Unmut des Feindes
  rationale: כַּעַס kann Ärger, Unmut oder Provokation bezeichnen. Im Zusammenhang ist die feindselige, anmaßende Reaktion des Feindes gemeint; »Unmut« bewahrt die Zuordnung zum Feind, ohne eine konkrete Handlung hinzuzufügen.
- source_word: אָגוּר
  choice: gefürchtet
  rationale: Bewahrt die ausdrückliche anthropopathische Rede des hebräischen Textes, statt sie erklärend abzuschwächen.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Gibt die beiden präventiven Finalsätze in natürlichem modernem Deutsch wieder.
- source_word: יְנַכְּרוּ
  choice: es falsch deuteten
  rationale: Das schwierige Piel von נכר bezeichnet hier im Kontext am ehesten ein Verkennen oder falsches Beurteilen der Ursache von Israels Untergang.
- source_word: צָרֵימוֹ
  choice: ihre Gegner
  rationale: Die Form bezeichnet Israels feindliche Bedränger; der Plural des Verbs wird im Deutschen entsprechend aufgenommen.
- source_word: יָדֵינוּ רָמָה
  choice: Unsere Hand ist mächtig
  rationale: Die wörtliche Metapher der »hohen Hand« wird bewahrt, zugleich wird ihr Sinn als überlegene Macht in verständlichem Deutsch ausgedrückt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: פָּעַל כָּל זֹאת
  choice: hat dies alles getan
  rationale: Gibt das bewirkende Handeln schlicht und direkt wieder; durch die deutsche Satzstellung fällt die Verneinung betont auf Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration erhält den im Ausgangstext gebrauchten persönlichen Namen Gottes.
- issue: Anthropopathische Aussage אָגוּר
  choice: gefürchtet
  alternative: bedacht hätte / besorgt gewesen wäre
  rationale: Der Text spricht ausdrücklich vom Fürchten. Diese Spannung wird nicht durch eine theologisch glättende Umschreibung beseitigt.
- issue: Mehrdeutigkeit von יְנַכְּרוּ
  choice: es falsch deuteten
  alternative: es verkennten / falsch urteilten
  rationale: Der unmittelbare Folgesatz zeigt, dass die Gegner Israels Niederlage ihrer eigenen Macht statt Jahwes Handeln zuschreiben könnten. Eine Fußnote hält die lexikalische Unsicherheit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte Konditionalstruktur und die zweifache Präventionsformel des Hebräischen bleiben erkennbar; schwer verständliche Hebraismen werden durch Fußnoten transparent gemacht.
