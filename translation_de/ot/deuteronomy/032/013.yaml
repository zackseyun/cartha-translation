base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: de
  text: Er ließ ihn auf den Höhen des Landes reiten[a]; er aß die Erträge des Feldes[b]. Er ließ ihn Honig aus dem Felsen saugen[c] und Öl aus dem Feuersteinfelsen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Höhen der Erde«. Gemeint ist hier wahrscheinlich erhöhtes, fruchtbares Gelände, nicht eine Kultstätte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Früchte des Feldes«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Er nährte ihn mit Honig aus dem Felsen«. Das hebräische Verb bedeutet wörtlich »saugen lassen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Er ließ ihn … fahren
  rationale: Der Hifil von רכב ist kausativ. „Ließ ihn fahren“ bewahrt diese Bedeutung und klingt im poetischen Zusammenhang natürlich.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: über die Höhen des Landes
  rationale: במות bezeichnet hier wahrscheinlich topografische Höhen. „Höhen des Landes“ vermeidet die missverständliche kultische Nebenbedeutung von „Höhenheiligtümern“.
- source_word: וַיֹּאכַל
  choice: und … essen
  rationale: Die Grundbedeutung von אכל bleibt konkret erhalten; die Infinitivkonstruktion hängt im Deutschen natürlich von „ließ“ ab.
- source_word: תְּנוּבֹת שָׂדָי
  choice: die Erträge des Feldes
  rationale: תנובות meint Ertrag oder hervorgebrachte Früchte. Der deutsche Plural entspricht der hebräischen Form, während „Feld“ den kollektiven Singular wiedergibt.
- source_word: וַיֵּנִקֵהוּ
  choice: Er ließ ihn … saugen
  rationale: Der Hifil von ינק bedeutet „saugen lassen“ bzw. „zum Saugen bringen“. Die Wiedergabe erhält das eindringliche Bild unmittelbarer Nahrung.
- source_word: דְבַשׁ מִסֶּלַע
  choice: Honig aus dem Felsen
  rationale: Die direkte Wiedergabe bewahrt das Bild reichen Ertrags aus einem unwahrscheinlichen, steinigen Ort.
- source_word: וְשֶׁמֶן
  choice: und Öl
  rationale: שמן bedeutet allgemein „Öl“. Obwohl vermutlich Olivenöl gemeint ist, wird die im Hebräischen nicht ausdrücklich genannte Frucht nicht ergänzt.
- source_word: מֵחַלְמִישׁ צוּר
  choice: aus dem Kieselfelsen
  rationale: חלמיש bezeichnet harten Stein bzw. Feuerstein; zusammen mit צור betont die Wendung die Härte des Felsens. „Kieselfelsen“ ist eine knappe, traditionsnahe deutsche Wiedergabe.
theological_decisions:
- issue: Bezug der Pronomen in der dritten Person Singular
  choice: Die hebräischen Pronomen bleiben als „er“ und „ihn“ stehen.
  alternative: Den Handelnden als den HERRN und den Empfänger als Israel oder Jakob ausdrücklich benennen.
  rationale: Der unmittelbare Kontext klärt die Bezüge, während der Vers selbst Pronomen verwendet. Ihre Beibehaltung wahrt den hebräischen Diskursfluss und vermeidet erklärende Ergänzungen im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildlichkeit. Die wiederholte Kausativform wird durch „ließ ihn“ wiedergegeben; die mehrdeutigen Pronomen werden nicht erklärend ersetzt.
