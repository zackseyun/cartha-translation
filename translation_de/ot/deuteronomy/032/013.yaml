- from: Er ließ ihn über die Höhen des Landes fahren[a] und die Erträge des Feldes essen[b]. Er ließ ihn Honig aus dem Felsen saugen[c] und Öl aus dem Kieselfelsen.
  to: Er ließ ihn auf den Höhen des Landes reiten[a]; er aß die Erträge des Feldes[b]. Er ließ ihn Honig aus dem Felsen saugen[c] und Öl aus dem Feuersteinfelsen.
  rationale: Die Revision stellt die eigenständige Aussage »er aß« wieder her, passt die Präposition enger an den hebräischen Ausdruck an und ersetzt den missverständlichen »Kieselfelsen« durch »Feuersteinfelsen«. Die Pronomen und die bildhafte Kausativform bleiben unverändert erhalten.
