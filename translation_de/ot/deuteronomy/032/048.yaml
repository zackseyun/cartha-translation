  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/עֶ֛צֶם הַ/יּ֥וֹם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/048.yaml
  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach an eben diesem Tag zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Eine andere Wiedergabe ist „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Narrativ-Waw führt die Erzählung fort; „sprach“ gibt דבר in der gehobenen, aber allgemein verständlichen Erzählweise angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten des Redens; „Mose“ ist die übliche deutsche Namensform.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: noch an diesem selben Tag
  rationale: Die idiomatische Wendung betont, dass etwas genau an dem bezeichneten Tag geschieht. Das deutsche „noch“ stellt den im Kontext naheliegenden Bezug zu den unmittelbar vorausgehenden Ereignissen natürlich her.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im Deutschen idiomatisch durch einen Doppelpunkt vor der folgenden direkten Rede wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt dessen Charakter als Eigenname; die traditionelle Titelwiedergabe und eine weitere gebräuchliche Namensform werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hebt wie das Hebräische den genauen Zeitpunkt hervor; der Doppelpunkt vermeidet die im Deutschen schwerfällige Formel „indem er sagte“.
