  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: de
  text: Jahwe allein führte ihn[a], und kein fremder Gott war mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leitete ihn“. Das hebräische Verb kann sowohl Führen als auch Leiten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: בָּדָד
  choice: allein
  rationale: Das Adverb betont, dass Jahwe ohne Beistand oder Begleitung handelte; „allein“ ist im Deutschen knapp und idiomatisch.
- source_word: יַנְחֶנּוּ
  choice: führte ihn
  rationale: Die Hifil-Form von נחה bezeichnet hier das Führen oder Leiten. Das maskuline Singularsuffix bleibt erhalten und verweist im Kontext kollektiv auf Israel beziehungsweise Jakob.
- source_word: וְאֵין עִמּוֹ
  choice: und … war mit ihm
  rationale: Die verneinte Existenzaussage bezeichnet fehlende Begleitung; für natürliches Deutsch wird „war“ ergänzt.
- source_word: אֵל נֵכָר
  choice: fremder Gott
  rationale: Die Wendung bezeichnet eine Israel fremde Gottheit und bewahrt die polemische Aussage gegen Götzendienst.
theological_decisions:
- issue: Bezug des maskulinen Singularpronomens in „führte ihn“ und „mit ihm“
  choice: Die Singularform „ihn/ihm“ bleibt erhalten und bezieht sich kollektiv auf Israel beziehungsweise Jakob.
  alternative: Dynamische Wiedergabe mit dem Plural „sie/ihnen“, um das Volk als Gesamtheit hervorzuheben.
  rationale: Der hebräische Text verwendet maskuline Singularsuffixe; auch der nähere Zusammenhang stellt Jakob beziehungsweise Israel als eine einzelne Person dar. Die grammatische Spannung zwischen Person und Volk wird daher nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und poetisch; der Gottesname wird als „Jahwe“ wiedergegeben.
