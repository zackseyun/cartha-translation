  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: de
  text: Denn den Namen Jahwes[a] will ich ausrufen. Schreibt unserem Gott Größe zu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben. Eine weitere deutsche Namensform ist »Jehova«.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Verknüpfung mit dem Kontext, ohne sie stärker festzulegen als nötig.
- source_word: שֵׁם
  choice: Namen
  rationale: Gibt den konkreten hebräischen Ausdruck wieder und lässt seine weiterreichende Bedeutung als offenbarte Identität und Ansehen mitschwingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Eigennamen wieder; die Fußnote nennt die hebräische Form und die traditionelle deutsche Wiedergabe.
- source_word: אֶקְרָא
  choice: will ich ausrufen
  rationale: Das Verb קרא bezeichnet hier im Lied das hörbare, öffentliche Ausrufen beziehungsweise Verkünden des Namens. „Ausrufen“ erhält zugleich die mögliche Nuance des Anrufens, ohne sie allein festzuschreiben.
- source_word: הָבוּ
  choice: Gebt
  rationale: Entspricht unmittelbar dem pluralischen Imperativ. Im Zusammenhang ist keine Vermehrung von Gottes Größe gemeint, sondern ihre anerkennende Zuerkennung.
- source_word: גֹדֶל
  choice: die Größe
  rationale: Ist die direkte und natürliche Wiedergabe des Substantivs und vermeidet eine Einengung auf Herrlichkeit oder Majestät.
- source_word: לֵאלֹהֵינוּ
  choice: unserem Gott
  rationale: Der deutsche Dativ gibt die Richtung der hebräischen Präposition ל idiomatisch wieder; das Suffix der ersten Person Plural bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen direkt. „Jahwe“ bewahrt diesen Charakter, während die traditionelle Ersatzlesung transparent in der Fußnote genannt wird.
- issue: Sinn von הָבוּ גֹדֶל
  choice: Gebt unserem Gott die Größe
  alternative: Erkennt die Größe unseres Gottes an
  rationale: Die formnahe Wendung bewahrt den Imperativ und das Bild des hebräischen Textes. Sie meint im Lobpreis, Gott die ihm zukommende Größe zuzuerkennen, nicht ihm eine zuvor fehlende Eigenschaft zu verleihen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Satzstellung. Der zweite Halbvers bleibt bewusst formnah; der Ausruf verdeutlicht den auffordernden Charakter des pluralischen Imperativs.
