  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: de
  text: Draußen macht das Schwert kinderlos, und in den Kammern herrscht Schrecken – beide treffen den jungen Mann ebenso wie die Jungfrau, den Säugling zusammen mit dem Greis.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und aus/von den Kammern: Schrecken«; das Hebräische stellt die Gefahr draußen dem Schrecken im Inneren gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort bezeichnet eine junge, unverheiratete Frau und schließt häufig Jungfräulichkeit ein; möglich ist daher auch: »junge Frau«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Draußen
  rationale: Die knappe Ortsangabe bewahrt den Gegensatz zu den Kammern im Haus, ohne den Außenbereich unnötig auf eine Straße einzuengen.
- source_word: תְּשַׁכֶּל
  choice: macht kinderlos
  rationale: Der Piel von שׁכל bezeichnet das Berauben von Kindern beziehungsweise das Kinderlosmachen. Die Wiedergabe erhält diesen starken, personifizierenden Ausdruck, statt ihn allgemein mit »tötet« abzuschwächen.
- source_word: חֶרֶב
  choice: das Schwert
  rationale: Das Schwert steht personifiziert für den Tod durch Krieg; der bestimmte Artikel entspricht dieser allgemeinen, feststehenden Bildsprache im Deutschen.
- source_word: וּמֵחֲדָרִים
  choice: und in den Kammern
  rationale: Wörtlich steht »und aus/von den Kammern«. Im räumlichen Gegensatz zu »draußen« bezeichnet die Wendung den Schrecken im geschützten Innenbereich; die Fußnote weist auf die formnähere Alternative hin.
- source_word: אֵימָה
  choice: herrscht Schrecken
  rationale: »Schrecken« gibt die überwältigende Angst prägnant wieder. Das ergänzte »herrscht« macht die im Hebräischen verblos folgende Nominalwendung im Deutschen verständlich.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: beim jungen Mann wie bei der Jungfrau
  rationale: Die paarige Konstruktion גם ... גם wird mit »wie« wiedergegeben und umfasst beide Gruppen. »Jungfrau« bewahrt die spezifischere Bedeutung von בְּתוּלָה, ohne die mögliche allgemeinere Nuance zu verschweigen.
- source_word: יוֹנֵק
  choice: Säugling
  rationale: Das substantivierte Partizip bezeichnet ein Kind, das noch gestillt wird; »Säugling« ist die natürliche und genaue moderne deutsche Entsprechung.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: zusammen mit dem Greis
  rationale: Die Wendung bezeichnet konkret einen Mann mit grauem Haar und damit einen alten Mann. »Greis« ist knapp, würdevoll und bildet den beabsichtigten Gegensatz zum Säugling.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Gegensatzpaare »draußen/Kammern«, »junger Mann/Jungfrau« und »Säugling/Greis« bleiben deutlich; die Härte des Verbs »kinderlos machen« wird nicht zu einem allgemeinen »töten« geglättet.
