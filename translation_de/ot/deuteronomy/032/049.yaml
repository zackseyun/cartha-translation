source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: de
  text: Steig auf diesen Berg im Abarimgebirge, den Berg Nebo, der im Land Moab gegenüber von Jericho[a] liegt, und sieh das Land Kanaan, das ich den Israeliten[b] als Besitz[c] gebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jericho gegenüber“ beziehungsweise „vor Jericho“. Die hebräische Wendung bezeichnet hier die geografische Lage gegenüber einem Ort.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Söhnen Israels“. Gemeint ist das Volk Israel.'
    reason: source_transparency
  - marker: c
    text: 'Oder: „als Besitzung“, möglicherweise auch „zum Erbbesitz“. Das hebräische Wort bezeichnet besonders dauerhaften Landbesitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Steig auf
  rationale: Der Qal-Imperativ 2. Person maskulin Singular von עלה fordert unmittelbar zum Hinaufgehen auf. „Steig auf“ ist natürlich und bewahrt die Richtungsangabe.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: dieses Abarimgebirge
  rationale: הַר kann hier das Bergland bzw. Gebirge bezeichnen; עֲבָרִים wird als geografischer Eigenname transliteriert. Das Demonstrativum הַזֶּה wird mit „dieses“ wiedergegeben.
- source_word: הַר נְבוֹ
  choice: auf den Berg Nebo
  rationale: Die Wendung steht als nähere Bestimmung zum Abarimgebirge. Die wiederholte Präposition „auf“ macht die Apposition im Deutschen klar, ohne eine zusätzliche Aussage einzuführen.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: der im Land Moab liegt
  rationale: Der Relativsatz bezeichnet die geografische Lage. Das im Hebräischen nicht ausgedrückte „liegt“ ist im Deutschen idiomatisch und entspricht der lokalen Aussage von בְּ.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: gegenüber von Jericho
  rationale: Die geografische Wendung עַל־פְּנֵי bezeichnet eine Lage gegenüber bzw. vor einem Ort. „Gegenüber von“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der Imperativ von ראה wird schlicht und direkt wiedergegeben; „sieh“ bewahrt den Befehlscharakter.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: das Land Kanaan
  rationale: Die Objektphrase wird mit der etablierten deutschen Form des Ortsnamens wiedergegeben.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: das ich ... gebe
  rationale: Das Partizip נֹתֵן mit dem ausdrücklich genannten אֲנִי beschreibt Gottes gegenwärtig wirksames bzw. unmittelbar bevorstehendes Geben. Das deutsche Präsens lässt diese zeitliche Offenheit bestehen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich „den Söhnen Israels“. „Den Israeliten“ ist im Deutschen die natürliche ethnische Bezeichnung und schließt das ganze Volk ein.
- source_word: לַאֲחֻזָּה
  choice: zum Besitz
  rationale: אֲחֻזָּה bezeichnet einen Besitz, besonders einen dauerhaften Landbesitz bzw. eine Besitzung. „Zum Besitz“ bewahrt den rechtlich-territorialen Sinn, ohne automatisch „Erbe“ einzusetzen.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל als Bezeichnung des Bundesvolkes
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die grammatisch maskuline Wendung ist hier eine feste ethnische Gesamtbezeichnung. „Israeliten“ gibt im modernen Deutschen das gesamte Volk wieder, ohne die Zugehörigkeit auf männliche Nachkommen zu verengen; die wörtliche Form wird in der Fußnote offengelegt.
- issue: Bedeutungsumfang von אֲחֻזָּה
  choice: zum Besitz
  alternative: zum Erbbesitz
  rationale: Der Vers betont die von Gott gewährte dauerhafte Landbesitzung. „Erbbesitz“ ist sachlich möglich, kann jedoch einen Erbvorgang stärker hervorheben, als das Substantiv an dieser Stelle ausdrücklich tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Imperativform. Geografische Eigennamen folgen den geläufigen deutschen Formen. Die Syntax bleibt nah am hebräischen Satzbau, wird aber durch die wiederholte Präposition vor „den Berg Nebo“ und das ergänzte lokale Verb „liegt“ idiomatisch verständlich.
