base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: de
  text: Mit Fremden[a] machten sie ihn eifersüchtig; mit Gräueln reizten sie ihn zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit fremden Göttern“ oder „mit fremden Gottheiten“; wörtlich steht im Hebräischen „mit Fremden“ beziehungsweise „mit fremden [Dingen]“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: weckten sie seine Eifersucht
  rationale: Der Hifil von קנא mit einem Objekt der 3. Person Singular bezeichnet hier, dass sie Eifersucht beziehungsweise Eifer in ihm hervorriefen. Die Formulierung bewahrt die personale, bundesbezogene Sprache und klingt zugleich natürlich.
- source_word: בְּזָרִים
  choice: durch Fremde
  rationale: זָרִים bedeutet wörtlich „Fremde“ oder „fremde Wesen“. Da „Götter“ im hebräischen Wortlaut nicht ausdrücklich steht, bleibt die knappe Mehrdeutigkeit im Haupttext erhalten; der Zusammenhang legt fremde Gottheiten als Bezug nahe.
- source_word: בְּתוֹעֵבֹת
  choice: durch Gräuel
  rationale: תּוֹעֵבָה bezeichnet etwas Abscheuliches oder Verabscheuungswürdiges, häufig im Zusammenhang mit Götzendienst. „Gräuel“ gibt die starke wertende Sprache würdig und knapp wieder.
- source_word: יַכְעִיסֻהוּ
  choice: reizten sie ihn zum Zorn
  rationale: 'Der Hifil von כעס hat kausative Bedeutung: jemanden erzürnen beziehungsweise zum Zorn reizen. Die Wiedergabe erhält diese Nuance und den Parallelismus des Verses.'
theological_decisions:
- issue: Ob bei זָרִים das im Zusammenhang vorausgesetzte Ziel des Götzendienstes ausdrücklich genannt werden soll
  choice: Im Haupttext steht wörtlich „Fremde“.
  alternative: „fremde Götter“ oder „fremde Gottheiten“
  rationale: Der Zusammenhang handelt von Israels Abwendung zu fremder Verehrung, doch das Substantiv „Götter“ steht in diesem Vers nicht ausdrücklich. Der Haupttext bewahrt daher die sprachliche Offenheit; die Fußnote nennt die kontextuell naheliegende Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Hebräischen bleibt erkennbar; „Eifersucht“ und „Zorn“ bewahren die spannungsreiche personale Rede über Gott, ohne sie abzuschwächen oder dogmatisch auszudeuten.
