source:
  edition: WLC
  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: de
  text: Ist es nicht bei mir verwahrt, versiegelt in meinen Vorratskammern?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meinen Schatzkammern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist es nicht
  rationale: Die Form leitet eine rhetorische Frage ein, die Zustimmung erwartet. „Ist es nicht“ bewahrt sowohl die Frageform als auch den bejahenden Nachdruck.
- source_word: הוּא
  choice: es
  rationale: Das maskuline Singularpronomen verweist hier wahrscheinlich zusammenfassend auf das zuvor Gesagte. Das deutsche Neutrum lässt den genauen sachlichen Bezug offen, ohne eine Person als Referenten festzulegen.
- source_word: כָּמֻס
  choice: verwahrt
  rationale: Das passive Partizip bezeichnet etwas Verborgenes oder Aufbewahrtes. „Verwahrt“ verbindet den Gedanken sicherer Aufbewahrung natürlich mit dem folgenden Bild des Versiegelns.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: Dies gibt die Präposition mit dem Suffix der ersten Person unmittelbar wieder und bewahrt den Gedanken, dass sich die Sache in Gottes Gewahrsam befindet.
- source_word: חָתֻם
  choice: versiegelt
  rationale: Das passive Partizip bezeichnet etwas, das durch ein Siegel verschlossen und gesichert ist; „versiegelt“ ist die direkte und idiomatische Wiedergabe.
- source_word: בְּאוֹצְרֹתָי
  choice: in meinen Vorratskammern
  rationale: אוֹצָר kann einen Vorrat, Schatz oder den entsprechenden Aufbewahrungsort bezeichnen. „Vorratskammern“ passt zum Bild des Verwahrens und vermeidet eine unnötige Verengung auf Geld oder Kostbarkeiten.
theological_decisions:
- issue: Bezug des verwahrten und versiegelten Gegenstands
  choice: Unpersönliches „es“ als zusammenfassender Rückverweis auf das zuvor Beschriebene
  alternative: Ein personales „er“ mit Bezug auf einen Feind oder ein deiktisches „dies“ als Zusammenfassung der vorausgehenden Aussagen
  rationale: Obwohl הוּא grammatisch maskulin ist, muss sein Referent nicht eine männliche Person sein. „Es“ bewahrt die Unbestimmtheit des genauen Bezugs und legt weder ausschließlich eine Schuldurkunde noch ausschließlich das vorbehaltene Gericht fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verwahrt“ ist verständlich und bildet zusammen mit „versiegelt“ die Metaphorik sicherer Aufbewahrung ab. Die Satzstellung folgt der hebräischen rhetorischen Frage, ohne im Deutschen gekünstelt zu wirken.
