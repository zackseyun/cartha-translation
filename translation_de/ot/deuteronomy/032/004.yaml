  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: de
  text: Der Fels – vollkommen ist sein Werk; denn alle seine Wege sind Recht[a]. Ein Gott der Treue[b] und ohne Unrecht[c], gerecht und aufrichtig ist er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle seine Wege sind gerechtes Urteil.“ Das hebräische מִשְׁפָּט kann Recht, Gerechtigkeit oder ein gerechtes Urteil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Ein Gott der Treue“ kann auch als „ein treuer Gott“ oder, in diesem Zusammenhang weniger wahrscheinlich, als „ein Gott der Wahrheit“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bei ihm ist kein Unrecht“ beziehungsweise „ohne Verkehrtheit“. Das hebräische עָוֶל umfasst moralisches Unrecht, Ungerechtigkeit und Verkehrtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Der Fels
  rationale: צוּר bezeichnet einen Felsen und steht hier im Lied des Mose als bildhafter Gottestitel. Die Großschreibung ergibt sich im Deutschen bereits aus der Substantivschreibung; der bestimmte Artikel und die hervorgehobene Stellung bewahren den Titelcharakter.
- source_word: תָּמִים
  choice: vollkommen
  rationale: Das Wort beschreibt Ganzheit, Unversehrtheit und sittliche Integrität. „Vollkommen“ passt zum Werk Gottes und zum gehobenen poetischen Ton.
- source_word: פָּעֳלוֹ
  choice: sein Werk
  rationale: Das Substantiv im Singular bezeichnet Gottes Wirken zusammenfassend. „Sein Werk“ erhält die nominale und knappe Ausdrucksweise des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorangehende Aussage; „denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: כָל־דְּרָכָיו
  choice: alle seine Wege
  rationale: Die hebräische Wegmetapher bezeichnet Gottes gesamtes Handeln. Sie bleibt im Deutschen klar und poetisch verständlich.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Das prädikativ gebrauchte Substantiv umfasst Recht, Gerechtigkeit und gerechtes Urteil. „Recht“ bewahrt die substantivische Form und die rechtlich-ethische Bedeutungsbreite.
- source_word: אֵל אֱמוּנָה
  choice: ein Gott der Treue
  rationale: אֱמוּנָה bezeichnet hier vor allem Verlässlichkeit und Beständigkeit. Die nominale Wendung „Gott der Treue“ folgt der hebräischen Form und lässt zugleich die attributive Deutung „treuer Gott“ offen.
- source_word: וְאֵין עָוֶל
  choice: und ohne Unrecht
  rationale: Die knappe Formulierung verneint jede moralische Verkehrtheit oder Ungerechtigkeit bei Gott und wahrt die parallele Reihung göttlicher Eigenschaften.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv bezeichnet Gottes normgerechtes und moralisch rechtes Wesen; „gerecht“ ist die direkte und geläufige deutsche Entsprechung.
- source_word: וְיָשָׁר
  choice: und aufrichtig
  rationale: יָשָׁר bezeichnet wörtlich und übertragen Geradheit beziehungsweise moralische Lauterkeit. „Aufrichtig“ ist im modernen Deutschen natürlich und bildet mit „gerecht“ ein verständliches Paar.
- source_word: הוּא
  choice: ist er
  rationale: Die Endstellung nimmt die betonte hebräische Schlussstellung auf und erhält den poetischen Nachdruck.
theological_decisions:
- issue: Göttlicher Titel beziehungsweise Metapher הַצּוּר
  choice: „Der Fels“ als hervorgehobene Bezeichnung Gottes
  alternative: „der Fels“ lediglich als gewöhnliche Metapher oder „der Felsen“
  rationale: Im Kontext des Liedes ist צוּר eine bildhafte Bezeichnung für Israels Gott. „Der Fels“ erhält das konkrete Bild, ohne dessen theologische Bedeutung durch eine erklärende Umschreibung festzulegen.
- issue: אֱמוּנָה als Eigenschaft Gottes
  choice: „Treue“
  alternative: „Wahrheit“, „Beständigkeit“ oder attributiv „treu“
  rationale: Der Zusammenhang betont Gottes Verlässlichkeit und moralische Beständigkeit. „Treue“ wahrt dieses Gewicht, ohne den Sinn auf propositionale Wahrheit einzuengen; die Fußnote erhält die möglichen Alternativen.
- issue: Verhältnis von מִשְׁפָּט, עָוֶל und צַדִּיק
  choice: „Recht“, „Unrecht“ und „gerecht“ als miteinander verbundene, aber nicht gleichgesetzte Begriffe
  alternative: Alle drei mit Ableitungen von „gerecht“ wiedergeben
  rationale: Die differenzierte Wortwahl bewahrt die rechtlich-moralische Spannung des hebräischen Parallelismus und vermeidet, verschiedene Ausgangswörter unnötig einzuebnen.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache mit knapper poetischer Satzstellung. Die Endstellung „gerecht und aufrichtig ist er“ spiegelt den Nachdruck des hebräischen Versschlusses. Die Substantivfolge „Werk – Recht – Treue – Unrecht“ erhält Dichte und Parallelismus des Liedes.
