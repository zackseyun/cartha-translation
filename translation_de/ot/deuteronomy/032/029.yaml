  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: de
  text: Wären sie doch weise, würden sie dies verstehen; würden sie ihr Ende erkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Zukunft« oder »ihr späteres Schicksal«. Das hebräische Wort kann den Ausgang oder das bezeichnen, was künftig kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: Wären … doch
  rationale: Die Konstruktion gibt den Wunsch- und Klagecharakter der Partikel natürlich und würdig wieder, statt sie als bloße Bedingung zu verstehen.
- source_word: חָכְמ֖וּ
  choice: sie … weise
  rationale: חכם bezeichnet hier Weisheit beziehungsweise weises Einsichtsvermögen; die deutsche Wendung passt zur irrealen Wunschform.
- source_word: יַשְׂכִּ֣ילוּ
  choice: dann würden sie … begreifen
  rationale: Das Hifil von שׂכל kann verständiges Erfassen oder einsichtiges Handeln bezeichnen. Im Parallelismus mit יָבִינוּ liegt hier die kognitive Bedeutung nahe.
- source_word: זֹ֑את
  choice: dies
  rationale: Das singuläre Demonstrativpronomen wird formal bewahrt und verweist wahrscheinlich auf die zuvor geschilderte Wirklichkeit.
- source_word: יָבִ֖ינוּ
  choice: sie würden erkennen
  rationale: בין bezeichnet unterscheidendes Wahrnehmen oder Erkennen. Die eigene Wortwahl erhält die Nuance gegenüber יַשְׂכִּילוּ.
- source_word: לְאַחֲרִיתָם
  choice: welches Ende sie erwartet
  rationale: אַחֲרִית bezeichnet das spätere Ergebnis, Ende oder die Zukunft. Die Formulierung ist im Deutschen natürlich und bewahrt den warnenden Ausgangssinn, ohne die genaue Art dieses Endes festzulegen.
theological_decisions:
- issue: Bedeutung von אַחֲרִיתָם im Zusammenhang
  choice: welches Ende sie erwartet
  alternative: ihre Zukunft / ihr späteres Schicksal
  rationale: Der Zusammenhang betont den Ausgang, den ihr Handeln und Gottes Gericht für sie haben werden. Die Übersetzung wahrt diese moralisch-gerichtliche Spannung, ohne den Ausdruck ausschließlich auf Tod oder Vernichtung einzuengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem poetischem Ton. Der einleitende Wunsch wird idiomatisch mit »Wären sie doch« ausgedrückt; die beiden Erkenntnisverben bleiben im Parallelismus voneinander unterschieden.
