  source_fidelity: 'Die Übersetzung gibt die hebräischen Aussagen insgesamt zutreffend wieder: Das Verbergen des Angesichts bleibt als wichtige Metapher erhalten, אַחֲרִיתָם wird als endgültiger Ausgang erfasst, und „Treue“ trifft אֵמֻן im Sinn von Verlässlichkeit bzw. Loyalität gut.'
