  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: de
  text: 'Und er sagte: »Ich werde mein Angesicht vor ihnen verbergen. Ich will sehen, wie es mit ihnen endet. Denn sie sind eine verkehrte Generation[a], Kinder, in denen keine Treue ist[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »eine Generation von Verkehrtheiten«; auch: »eine verdrehte Generation«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Kinder, in denen keine Zuverlässigkeit ist« oder »keine Vertrauenswürdigkeit ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Ich werde mein Angesicht vor ihnen verbergen
  rationale: Die hebräische Wendung bezeichnet den Entzug göttlicher Zuwendung oder Gegenwart. „Angesicht“ bewahrt ihr theologisches Gewicht; „verbergen“ gibt das Verb präzise und würdig wieder.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: Ich will sehen, wie es mit ihnen endet
  rationale: אַחֲרִית kann Ende, Ausgang oder späteres Geschick bezeichnen. Die Formulierung ist natürliches Deutsch und lässt offen, ob der Schwerpunkt auf ihrem Ausgang oder ihrem schließlichen Geschick liegt.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: ein verdrehtes Geschlecht
  rationale: תַּהְפֻּכֹת bezeichnet Verdrehungen, Verkehrtheit oder moralische Verworfenheit. „Verdrehtes Geschlecht“ gibt die Wertung idiomatisch wieder; „Geschlecht“ meint hier eine Generation beziehungsweise Menschengruppe, nicht biologisches Geschlecht.
- source_word: בָּנִים
  choice: Kinder
  rationale: בָּנִים bezeichnet hier das Volk in seiner Beziehung zu Gott und ist generisch gemeint. „Kinder“ ist im Deutschen sachgerecht und natürlich.
- source_word: לֹא אֵמֻן בָּם
  choice: in denen keine Treue ist
  rationale: אֵמֻן umfasst Treue, Zuverlässigkeit und Vertrauenswürdigkeit. „Treue“ bewahrt den relationalen und möglichen bundesbezogenen Sinn, ohne ihn zu überbestimmen.
theological_decisions:
- issue: Anthropomorphe Bundesmetapher vom göttlichen Angesicht
  choice: Die Formulierung „mein Angesicht vor ihnen verbergen“ wird beibehalten.
  alternative: „mich von ihnen abwenden“ oder „sie nicht mehr beachten“
  rationale: Die konkrete hebräische Metapher trägt theologisches Gewicht und bezeichnet den Entzug von Zuwendung beziehungsweise Gegenwart, ohne dessen genaue Wirkungsweise auszudeuten.
- issue: Bedeutung von אֵמֻן
  choice: Treue
  alternative: Zuverlässigkeit oder Vertrauenswürdigkeit
  rationale: Der Ausdruck klagt einen relationalen und moralischen Mangel an. „Treue“ lässt den bundesbezogenen Anklang bestehen, während die Fußnote die breitere lexikalische Spannweite nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist bewusst gehoben, weil es die etablierte theologische Bildsprache erhält. „Geschlecht“ wird im Sinn von Generation beziehungsweise Menschengruppe gebraucht. Die Satzführung bleibt nahe am hebräischen Parallelismus, ohne unnatürlich zu wirken.
