  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: de
  text: Er fand ihn in einem wüsten Land und in der heulenden Öde der Wildnis. Er umgab ihn, nahm sich seiner an[a] und behütete ihn wie seine Augenpupille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch bedeuten: „Er gab ihm Einsicht“, „er unterwies ihn“ oder „er achtete aufmerksam auf ihn“.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „wie seinen Augapfel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Er fand ihn
  rationale: Die Qal-Form von מצא bedeutet hier schlicht „finden“. Das Präteritum gibt den poetischen Rückblick natürlich wieder; der Singular bewahrt die kollektive Personifikation Jakobs beziehungsweise Israels.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: in einem wüsten Land
  rationale: Die Wendung bezeichnet ein unbewohntes, unwirtliches Land. „Wüstes Land“ ist im Deutschen natürlich und hält die beiden nominalen Bestandteile zusammen.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: und in der heulenden Öde der Wildnis
  rationale: תֹהוּ bezeichnet Leere oder Öde, יְלֵל das Heulen und יְשִׁמֹן eine verödete Wildnis. Die Wiedergabe bewahrt die verdichtete, bedrohliche Landschaftssprache, ohne תֹהוּ vorschnell kosmologisch als „Chaos“ zu deuten.
- source_word: יְסֹבְבֶנְהוּ
  choice: Er umgab ihn
  rationale: סבב bezeichnet das Umgeben oder Umringen. Die konkrete Bildsprache bleibt erhalten, während die schützende Funktion aus dem Zusammenhang hervorgeht.
- source_word: יְבֹונְנֵהוּ
  choice: sorgte verständig für ihn
  rationale: Die Form aus בין/בונן kann Verstehen, Einsicht vermitteln oder aufmerksames Bedachtsein ausdrücken. „Sorgte verständig für ihn“ bewahrt sowohl die kognitive als auch die fürsorgliche Nuance, statt die genuine Mehrdeutigkeit auf nur eine Seite festzulegen.
- source_word: יִצְּרֶנְהוּ
  choice: behütete ihn
  rationale: נצר bedeutet bewahren, behüten oder schützen. „Behütete“ passt zur Schutzmetaphorik des folgenden Augenbildes und klingt in gehobener moderner Standardsprache natürlich.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: wie die Pupille seines Auges
  rationale: אִישׁוֹן bezeichnet die Pupille, wörtlich wohl das „Männlein“ im Auge. Die direkte Wiedergabe ist für heutige Leser transparent und näher am hebräischen Körperbild als die traditionelle Redewendung „Augapfel“.
theological_decisions:
- issue: Bezug der maskulinen Singularpronomen
  choice: Der Singular bleibt erhalten und bezeichnet Jakob beziehungsweise Israel als kollektive Person.
  alternative: Eine pluralische Wiedergabe mit „sie“ oder ein ausschließlich individueller Bezug auf den Stammvater Jakob.
  rationale: Der weitere Zusammenhang des Liedes spricht vom Volk unter dem Namen Jakob/Israel und personifiziert es im Singular. Eine Umstellung auf den Plural würde die poetische Grammatik einebnen.
- issue: Bedeutungsbreite von יְבֹונְנֵהוּ
  choice: „sorgte verständig für ihn“ verbindet aufmerksame Fürsorge mit Einsicht.
  alternative: „gab ihm Einsicht“, „unterwies ihn“ oder schlicht „sorgte für ihn“.
  rationale: Die Verbfolge beschreibt Gottes Handeln an Israel; zugleich besitzt das hebräische Verb eine echte kognitive Komponente. Die gewählte Formulierung wahrt beide Möglichkeiten, ohne eine rein didaktische oder rein fürsorgliche Deutung festzuschreiben.
- issue: Schutzbild des Auges
  choice: „Pupille seines Auges“
  alternative: „Augapfel“ beziehungsweise „wie seinen Augapfel“.
  rationale: Die Pupille entspricht dem konkreten hebräischen Bild. Die traditionelle deutsche Redewendung ist sachlich nah, verschiebt das Bild aber zu einem etablierten Idiom und wird daher in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzfolge. Die Landschaftsbilder bleiben konkret und rau. Der maskuline Singular wird wegen der kollektiven Personifikation Israels beibehalten. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
