  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: de
  text: Wenn ich den Blitz meines Schwertes schärfe und meine Hand das Gericht ergreift, dann werde ich an meinen Gegnern Rache üben und denen, die mich hassen, vergelten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Wenn … dann
  rationale: Die konditionale Form des Hebräischen wird bewahrt; im poetischen Zusammenhang kann sie zeitlich mitschwingen, ohne dass diese Nuance die Bedingungsform verdrängt.
- source_word: בְּרַק חַרְבִּי
  choice: den Blitz meines Schwertes
  rationale: 'Die markante Bildsprache wird formal bewahrt: Das Schwert erscheint in seinem blitzenden Glanz, ohne die Metapher zu einer bloßen Aussage über Schärfe oder Glanz aufzulösen.'
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: und meine Hand das Gericht ergreift
  rationale: Die personifizierende, konkrete Redeweise des Ausgangstextes bleibt erhalten. מִשְׁפָּט kann Gericht, Recht oder richterliches Urteil bezeichnen; „Gericht“ passt zum Vollzug im Kontext.
- source_word: אָשִׁיב נָקָם
  choice: übe ich Rache
  rationale: Wörtlich liegt eine Wendung wie „Rache zurückbringen/erstatten“ vor. Das natürliche deutsche Idiom „Rache üben“ gibt den angekündigten Vergeltungsvollzug wieder.
- source_word: לְצָרָי
  choice: an meinen Gegnern
  rationale: צַר bezeichnet einen Bedränger oder Widersacher. „Gegner“ ist verständlich und wahrt die feindliche Gegenstellung.
- source_word: וְלִמְשַׂנְאַי אֲשַׁלֵּם
  choice: und vergelte es denen, die mich hassen
  rationale: שׁלם im Piel bedeutet hier zurückzahlen oder vergelten. Die Relativkonstruktion bildet das Partizip „meine Hasser“ in natürlichem Deutsch ab.
theological_decisions:
- issue: Göttliche Rache und Gericht
  choice: Die Aussagen werden direkt als Gottes eigene gerechte Vergeltung wiedergegeben.
  alternative: Abschwächung zu allgemeiner Bestrafung oder bloßer Wiederherstellung des Rechts.
  rationale: Der hebräische Text verbindet ausdrücklich נָקָם mit מִשְׁפָּט. Eine Abschwächung würde die theologische Spannung zwischen Gericht und Rache verdecken.
- issue: Konditionaler oder temporaler Eingang
  choice: „Wenn … dann“
  alternative: „Sobald“ oder „wenn“ im rein zeitlichen Sinn
  rationale: אִם ist formal konditional. Auch wenn der poetische Kontext die sichere künftige Handlung ankündigt und dadurch eine zeitliche Nuance zulässt, soll die genuine Form nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Bildkraft und poetischem Parallelismus. Die Satzstellung bleibt gut verständlich, ohne die ungewöhnlichen Bilder „Blitz meines Schwertes“ und „das Gericht ergreifen“ zu glätten.
