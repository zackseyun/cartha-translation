  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: de
  text: Denn Yahwes Anteil ist sein Volk, Jakob der Anteil seines Erbes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Jakob die Messschnur seines Erbes“; möglich ist ebenso: „Jakob das Los seines Erbes“. Das hebräische Wort חֶבֶל bezeichnet eine Messschnur und, davon abgeleitet, ein vermessenes oder zugeteiltes Gebiet beziehungsweise einen Anteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert hier die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: חֵלֶק
  choice: Anteil
  rationale: Das Wort bezeichnet einen zugewiesenen Teil oder Besitzanteil und passt zur Verteilungs- und Erbmetaphorik.
- source_word: יְהֹוָה
  choice: Yahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: „Volk“ bewahrt den relationalen und gemeinschaftlichen Sinn des hebräischen עַם.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der ausdrücklich gebrauchte Patriarchenname bleibt erhalten und bezeichnet hier zugleich das aus Jakob hervorgegangene Volk.
- source_word: חֶבֶל
  choice: der ihm zugemessene Anteil
  rationale: חֶבֶל bedeutet wörtlich „Messschnur“ und kann übertragen das damit vermessene bzw. zugeloste Gebiet oder den zugewiesenen Anteil bezeichnen. Die Formulierung bewahrt diese Bildgrundlage in verständlichem Deutsch.
- source_word: נַחֲלָתוֹ
  choice: seines Erbes
  rationale: נַחֲלָה bezeichnet Erbbesitz bzw. Erbteil. „Erbe“ erhält die Besitz- und Zuweisungsmetaphorik.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen; die Transliteration bewahrt ihn als Eigennamen.
- issue: Identifikation Jakobs mit Israel
  choice: Jakob
  alternative: Israel
  rationale: Die poetische Benennung des Volkes durch den Patriarchennamen wird nicht durch eine erklärende Deutung ersetzt.
- issue: Bedeutung von חֶבֶל
  choice: der ihm zugemessene Anteil
  alternative: die Messschnur / das Los / der Anteil
  rationale: Die gewählte Fassung vermittelt die übertragene Bedeutung, ohne den wörtlichen Hintergrund der Messschnur völlig auszublenden.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem poetischem Parallelismus. „Der ihm zugemessene Anteil“ ist etwas ausführlicher als das Hebräische, hält aber die Mehrdeutigkeit von חֶבֶל im Haupttext erkennbar; die Fußnote dokumentiert die engeren Alternativen.
