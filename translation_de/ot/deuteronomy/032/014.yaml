translation:
  language: de
  text: Dickmilch von Rindern und Milch vom Kleinvieh, dazu das Fett von Lämmern, Widdern aus Baschan und Ziegenböcken, dazu feinster Weizen[a]; und du trankst schäumenden Wein[b], das Blut der Trauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Fett der Nieren des Weizens“; eine hebräische Bildwendung für besonders vollen, gehaltvollen Weizen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rotwein“. Das hebräische Wort kann kräftigen, gärenden beziehungsweise schäumenden Wein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: Dickmilch von Rindern
  rationale: חֶמְאַת bezeichnet hier wahrscheinlich ein eingedicktes oder gesäuertes Milchprodukt, nicht eindeutig moderne Butter. „Dickmilch“ bewahrt den konkreten Charakter des Hirtenbildes; בָּקָר wird kollektiv als Rinderbestand verstanden.
- source_word: חֲלֵב צֹאן
  choice: Milch von Schafen
  rationale: צֹאן bezeichnet Kleinvieh, vor allem Schafe und Ziegen. Da Ziegenböcke später eigens genannt werden, gibt „Schafe“ den naheliegenden Bezug in natürlichem Deutsch wieder.
- source_word: חֵלֶב כָּרִים
  choice: das Fett von Lämmern
  rationale: חֵלֶב bedeutet konkret „Fett“ und trägt hier zur Bildsprache üppiger Nahrung bei. כָּרִים bezeichnet junge beziehungsweise gemästete Schafe; „Lämmer“ ist im Deutschen klar und ungezwungen.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: Widder aus Baschan
  rationale: Wörtlich sind es „Widder, Söhne Baschans“. Die Herkunftsformulierung bezeichnet Tiere aus der für ihre Viehzucht bekannten Region; „aus Baschan“ gibt das idiomatisch und ohne unnötige Deutung wieder.
- source_word: עַתּוּדִים
  choice: Ziegenböcke
  rationale: Das Wort bezeichnet männliche Ziegen. Anders als das allgemeinere „Ziegen“ erhält „Ziegenböcke“ diese im Hebräischen ausdrücklich enthaltene Bedeutung.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: feinster Weizen
  rationale: Die wörtliche Wendung „Fett der Nieren des Weizens“ ist ein poetisches Idiom für besonders volle, gehaltvolle Körner. „Feinster Weizen“ vermittelt den Sinn verständlich; die konkrete hebräische Bildform wird in der Fußnote dokumentiert.
- source_word: דַם עֵנָב
  choice: das Blut der Trauben
  rationale: Die markante Metapher für Traubensaft beziehungsweise Wein bleibt erhalten und wird als Apposition zu „Wein“ wiedergegeben.
- source_word: תִּשְׁתֶּה
  choice: du trankst
  rationale: Die Imperfektform steht im rückblickenden poetischen Bericht über Israels Versorgung. Das deutsche Präteritum fügt sich in diesen Erzählzusammenhang.
- source_word: חָמֶר
  choice: schäumenden Wein
  rationale: חָמֶר bezeichnet Wein und kann dessen kräftige, gärende oder schäumende Beschaffenheit anklingen lassen. Da auch „Rotwein“ möglich ist, wird die Unsicherheit in einer Fußnote bewahrt.
theological_decisions:
- issue: Poetische Darstellung des göttlichen Segens
  choice: Die konkreten Bilder von Viehprodukten, Getreide und Wein bleiben als gegenständliche Aufzählung erhalten.
  alternative: Die Bilder abstrakt als Wohlstand, Luxus oder Bundesfülle wiederzugeben.
  rationale: Der Vers selbst beschreibt die Versorgung Israels durch anschauliche landwirtschaftliche Erzeugnisse. Eine abstrakte theologische Umschreibung würde mehr festlegen, als der hebräische Text ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher poetischer Reihung. Konkrete Bilder wie „Fett“ und „Blut der Trauben“ bleiben erhalten; schwer verständliche Idiomatik wird im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.
