translation:
  language: de
  text: Hört aufmerksam zu, ihr Himmel, und ich will reden; und die Erde höre die Worte meines Mundes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Horcht auf, ihr Himmel … und die Erde möge die Worte meines Mundes hören.“ Das Hebräische verwendet gehobene poetische Formen des Befehls und der Aufforderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Hört aufmerksam zu
  rationale: Der Hifil-Imperativ von אזן fordert bewusstes, aufmerksames Hören. Die Formulierung ist im heutigen Deutsch verständlich und bewahrt den feierlichen Aufruf.
- source_word: הַשָּׁמַיִם
  choice: ihr Himmel
  rationale: Der hebräische Plural bezeichnet im poetischen kosmischen Gegenüber die Himmel; „ihr“ kennzeichnet im Deutschen die direkte Anrede natürlich.
- source_word: וַאֲדַבֵּרָה
  choice: dann will ich reden
  rationale: Die Kohortativform drückt Absicht beziehungsweise Entschlossenheit aus. „Will ich reden“ erhält diesen volitiven Zug; „dann“ macht den Zusammenhang mit dem vorausgehenden Aufruf idiomatisch deutlich.
- source_word: וְתִשְׁמַע
  choice: und die Erde höre
  rationale: Die Form ist im Parallelismus als jussivischer Wunsch beziehungsweise Aufruf zu verstehen. Der deutsche Konjunktiv „höre“ wahrt die gehobene poetische Appellform und löst sie nicht zu einer bloßen Zukunftsaussage auf.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Paar mit den Himmeln ist die kosmische „Erde“ gemeint, nicht ein bestimmtes Land.
- source_word: אִמְרֵי
  choice: die Worte
  rationale: „Worte“ gibt die gesprochenen Äußerungen natürlich, würdig und ohne unnötige Spezialisierung wieder.
- source_word: פִי
  choice: meines Mundes
  rationale: Die konkrete hebräische Genitivverbindung bleibt erhalten und bewahrt Bildlichkeit und poetischen Klang.
theological_decisions:
- issue: Reichweite der Anrede an Himmel und Erde
  choice: Poetischer Aufruf an den Kosmos als Zeugen
  alternative: Rein rhetorischer Aufruf an sämtliche Zuhörer
  rationale: Die feierliche Gegenüberstellung von Himmeln und Erde entspricht einer kosmischen Zeugenanrufung. Die Übersetzung erhält diese Spannung, ohne die Zeugenfunktion ausdrücklich in den Text einzutragen.
translation_notes:
  register: Feierlich-poetisches, zugleich modernes Standarddeutsch. Der Parallelismus und die unterschiedlichen volitiven Formen werden durch Imperativ, „will ich“ und den jussivisch wirkenden Konjunktiv „höre“ abgebildet.
