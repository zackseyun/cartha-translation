  source_fidelity: Der Entwurf gibt וַיְכַל ... לְדַבֵּר idiomatisch als „zu Ende gesprochen hatte“ wieder und bewahrt damit den Abschluss des Sprechens. „all diese Worte“ entspricht אֶת־כָּל־הַדְּבָרִים הָאֵלֶּה, und „zu ganz Israel“ gibt die kollektive Wendung אֶל־כָּל־יִשְׂרָאֵל ohne unnötige Ausdeutung zu einzelnen Israeliten wieder. Der offene, einleitende Satzanschluss mit Komma entspricht der Funktion des Verses im Zusammenhang.
