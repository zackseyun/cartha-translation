lexical_decisions:
- source_word: וַיְכַל ... לְדַבֵּר
  choice: zu Ende gesprochen hatte
  rationale: Die Verbindung von כלה mit dem Infinitiv bezeichnet den Abschluss des Sprechens. Die deutsche Wendung ist natürlich und gibt den hebräischen Rückblick in diesem anschließenden Nebensatz passend wieder.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all diese Worte
  rationale: דברים bezeichnet hier die vorausgehenden Worte beziehungsweise den Vortrag. „Worte“ bewahrt die konkrete Ausdrucksweise des Hebräischen besser als „Dinge“ oder „Aussagen“.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: zu ganz Israel
  rationale: Israel wird kollektiv bezeichnet. „Ganz Israel“ ist im modernen Deutschen idiomatischer als „alles Israel“, ohne zu „alle Israeliten“ auszudeuten.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Verwendet die im Deutschen etablierte Namensform.
