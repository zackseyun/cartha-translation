  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: de
  text: Als der Höchste den Nationen ihr Erbe zuteilte, als er die Menschen voneinander schied[a], setzte er die Grenzen der Völker fest nach der Zahl der Söhne Israels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne des Menschen«; die hebräische Wendung bezeichnet hier die Menschen beziehungsweise die Menschheit.'
    reason: lexical_alternative
  - marker: b
    text: Handschriften vom Toten Meer und die Septuaginta lesen »Söhne Gottes« beziehungsweise »Engel Gottes« statt »Söhne Israels«.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: Als ... ihr Erbe zuteilte
  rationale: Der Hifil-Infinitiv mit בְּ leitet einen Temporalsatz ein. „Das Erbe zuteilen“ gibt die Zuweisung von Erbteilen an die Nationen natürlich und präzise wieder.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Das Wort dient hier als Gottesbezeichnung; „der Höchste“ bewahrt diesen titulären Charakter.
- source_word: גּוֹיִם
  choice: den Nationen
  rationale: Gemeint sind die verschiedenen Völker der Welt, nicht „Heiden“ in einem späteren religiösen Gegensatz.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: als er ... voneinander schied
  rationale: Auch diese Form bildet einen Temporalsatz. „Voneinander schied“ drückt die Trennung verschiedener Menschengruppen aus und passt zum anschließenden Festsetzen ihrer Grenzen.
- source_word: בְּנֵי אָדָם
  choice: die Menschen
  rationale: Die hebräische Wendung lautet wörtlich „Söhne Adams/des Menschen“, bezeichnet hier jedoch kollektiv die Menschheit. Die natürliche deutsche Wiedergabe vermeidet die missverständliche Vorstellung ausschließlich männlicher Nachkommen; die Bildgestalt wird in einer Fußnote ausgewiesen.
- source_word: יַצֵּב
  choice: setzte ... fest
  rationale: Der Hifil von יצב bezeichnet ein festes Setzen oder Bestimmen; „festsetzen“ eignet sich im Deutschen besonders für Grenzen.
- source_word: גְּבֻלֹת עַמִּים
  choice: die Grenzen der Völker
  rationale: Die Wendung bezeichnet territoriale oder zugewiesene Abgrenzungen von Volksgruppen. „Völker“ variiert gegenüber „Nationen“, ohne den Sinn zu verändern.
- source_word: לְ/מִסְפַּר
  choice: nach der Zahl
  rationale: Die Präposition bezeichnet hier eine Entsprechung oder Bemessung; „nach der Zahl“ ist knapp und idiomatisch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Der vorgegebene masoretische Text liest ausdrücklich „Söhne Israels“. Die formnahe Wiedergabe bewahrt diese Lesart, während die gewichtige Textvariante in einer Fußnote dokumentiert wird.
theological_decisions:
- issue: Textvariante im letzten Satzglied
  choice: der Söhne Israels
  alternative: der Söhne Gottes / der Engel Gottes
  rationale: Der vorgegebene WLC-Text bietet בְּנֵי יִשְׂרָאֵל. Handschriften vom Toten Meer und die Septuaginta bezeugen jedoch eine abweichende Lesart, die das Verständnis des Verses wesentlich beeinflusst. Daher steht die masoretische Lesart im Haupttext und die Alternative in der Fußnote.
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: die Menschen
  alternative: die Söhne Adams / die Menschensöhne
  rationale: Die Wendung ist grammatisch männlich, bezeichnet in diesem Zusammenhang aber Menschen beziehungsweise die Menschheit insgesamt. Natürliches modernes Deutsch gibt den kollektiven Bezug mit „die Menschen“ wieder; die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Parallelität. Die beiden temporalen Gliedsätze bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden. Die Stellung der Fußnotenmarker folgt jeweils unmittelbar auf die betroffene Wendung.
