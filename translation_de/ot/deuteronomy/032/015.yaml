  terminology: »Jeschurun«, »ausschlagen«, »Gott«, »Fels« und »Rettung« sind angemessen. »Fels seiner Rettung« erhält die wichtige Gottesmetapher des Moselieds, ohne sie auszudeuten. »Gott, der ihn gemacht hatte« ist stilistisch natürlich; das Plusquamperfekt markiert keine unzulässige zeitliche Aussage, sondern die vorausliegende Schöpfertat.
