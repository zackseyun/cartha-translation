base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: de
  text: Doch Jeschurun wurde fett und schlug aus; du wurdest fett, dick und feist[a]. Da verließ er Gott, der ihn gemacht hatte, und verachtete den Fels seiner Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »du wurdest von Fett bedeckt« oder »du wurdest aufgedunsen«. Das hebräische Wort ist selten, und seine genaue Bedeutung ist unsicher; deutlich ist jedoch das Bild übermäßiger Fülle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Jeschurun
  rationale: Der poetische Ehrenname für Israel wird transliteriert, damit seine Namens- und Titelfunktion erhalten bleibt, ohne ihn vorschnell als »der Rechtschaffene« auszudeuten.
- source_word: וַיִּשְׁמַן
  choice: wurde fett
  rationale: Die konkrete Metapher des Fettwerdens bleibt erhalten; im Zusammenhang deutet sie auf Wohlstand hin, der zu Selbstzufriedenheit und Auflehnung führt.
- source_word: וַיִּבְעָט
  choice: schlug aus
  rationale: Das Verb zeichnet das Bild eines wohlgenährten Tieres, das ausschlägt. Diese anschauliche Metapher ist präziser als die bloße Deutung »rebellierte«.
- source_word: שָׁמַנְתָּ
  choice: du wurdest fett
  rationale: Die zweite Person Singular bewahrt den unvermittelten Wechsel von der Erzählung zur direkten Anrede.
- source_word: עָבִיתָ
  choice: beleibt
  rationale: Das Wort verstärkt das körperliche Bild übermäßiger Fülle. »Beleibt« ist im Deutschen verständlich und würdevoll.
- source_word: כָּשִׂיתָ
  choice: wohlgenährt
  rationale: Die seltene Form bezeichnet im Kontext wahrscheinlich einen Zustand übermäßiger Fülle. »Wohlgenährt« bewahrt das Bild, während die lexikalische Unsicherheit in der Fußnote kenntlich gemacht wird.
- source_word: וַיִּטֹּשׁ
  choice: verließ
  rationale: »Verließ« gibt die vorsätzliche Abkehr klar und in natürlichem modernem Deutsch wieder, ohne einen altertümlichen Ausdruck zu verwenden.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: den Gott, der ihn gemacht hatte
  rationale: Die Relativsatzstruktur und Gottes Rolle als der Schöpfer Israels werden unmittelbar wiedergegeben.
- source_word: וַיְנַבֵּל
  choice: verachtete
  rationale: Das Verb bezeichnet eine entehrende Behandlung beziehungsweise Geringschätzung. »Verachtete« ist knapp und trifft den aktiven Sinn.
- source_word: צוּר
  choice: den Fels
  rationale: »Fels« bewahrt die wiederkehrende Gottesmetapher des Moseliedes; die Großschreibung kennzeichnet im Deutschen zugleich das Substantiv, ohne zusätzliche Auslegung einzutragen.
- source_word: יְשׁוּעָתוֹ
  choice: seiner Rettung
  rationale: »Rettung« gibt den Sinn göttlicher Befreiung natürlich wieder und passt idiomatisch zur Felsmetapher.
theological_decisions:
- issue: Wechsel von der dritten Person zur direkten Anrede und zurück
  choice: 'Der Wechsel bleibt erhalten: »Jeschurun wurde … du wurdest … er …«'
  alternative: Alle Aussagen in die dritte Person setzen.
  rationale: Der hebräische Personenwechsel steigert die Anklage rhetorisch und darf nicht geglättet werden.
- issue: צוּר als Gottesmetapher
  choice: »der Fels seiner Rettung«
  alternative: Die Metapher deutend als »Gott, der ihn rettete« wiedergeben.
  rationale: Im Moselied ist »Fels« eine wiederkehrende Bezeichnung für Gott. Die konkrete Metapher trägt theologisches und poetisches Gewicht und bleibt daher stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Tier- und Körpermetaphorik. Die abrupten Wechsel der Person und die dreifache Steigerung bleiben als Merkmale der hebräischen Poesie erhalten.
