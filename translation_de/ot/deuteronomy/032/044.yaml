  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: de
  text: Dann kam Mose und sprach vor dem Volk alle Worte dieses Liedes, er und Hoschea[a], der Sohn Nuns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Hoschea“; sonst wird diese Person gewöhnlich Josua genannt (siehe 4. Mose 13,16).'
    reason: Die Fußnote erklärt die ungewohnte, im hebräischen Text dieses Verses ausdrücklich belegte Namensform, ohne sie im Haupttext zu harmonisieren.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier im fortlaufenden Erzählzusammenhang das Kommen beziehungsweise Eintreffen; „kam“ wahrt die schlichte Bewegungsangabe, ohne eine Richtung näher festzulegen.
- source_word: וַיְדַבֵּר
  choice: sprach … aus
  rationale: Das Piel von דבר bedeutet gewöhnlich „sprechen“. Zusammen mit der öffentlichen Wiedergabe aller Worte ist „sprach … aus“ im Deutschen natürlich und fügt keine besondere rhetorische Kraft hinzu.
- source_word: אֶת כָּל דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: alle Worte dieses Liedes
  rationale: Die Wiedergabe erhält sowohl die Vollständigkeit von כָּל als auch die konkrete Bezeichnung שִׁירָה als „Lied“.
- source_word: בְּאָזְנֵי הָעָם
  choice: vor dem ganzen Volk
  rationale: Die hebräische Wendung lautet wörtlich „in den Ohren des Volkes“ und bezeichnet eine öffentliche, hörbare Darbietung. „Vor dem ganzen Volk“ gibt diesen Sinn idiomatisch wieder; „ganz“ verdeutlicht die versammelte Gemeinschaft, ohne eine neue Personengruppe einzuführen.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen wird beibehalten, weil der hebräische Text Mose ausdrücklich wieder aufnimmt und ihn mit Hoschea zusammenordnet.
- source_word: וְהוֹשֵׁעַ
  choice: und Hoschea
  rationale: Der masoretische Text bietet ausdrücklich die Namensform הוֹשֵׁעַ. Daher wird sie als „Hoschea“ wiedergegeben und nicht zur geläufigeren Form „Josua“ harmonisiert.
- source_word: בִּן נוּן
  choice: der Sohn Nuns
  rationale: Die Konstruktverbindung ist eine patronymische Bezeichnung. „Der Sohn Nuns“ ist im Deutschen klar und würdig.
theological_decisions:
- issue: Namensform von Moses Begleiter
  choice: Hoschea
  alternative: Josua
  rationale: Die Übersetzung folgt der in diesem Vers tatsächlich überlieferten hebräischen Form הוֹשֵׁעַ. Die geläufigere Identifizierung als Josua wird nicht in den Haupttext eingetragen, sondern transparent in einer Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die wörtliche Wendung „in den Ohren des Volkes“ wird idiomatisch als „vor dem ganzen Volk“ wiedergegeben. Die etwas markierte Nachstellung „er und Hoschea“ bleibt erhalten, um die ausdrückliche hebräische Subjektangabe nicht einzuebnen.
