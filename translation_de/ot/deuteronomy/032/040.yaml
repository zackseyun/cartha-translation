  text: כִּֽי אֶשָּׂ֥א אֶל שָׁמַ֖יִם יָדִ֑/י וְ/אָמַ֕רְתִּי חַ֥י אָנֹכִ֖י לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: de
  text: 'Denn ich erhebe meine Hand zum Himmel und sage[a]: »So wahr ich ewig lebe!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich erhebe meine Hand zum Himmel und sage: Ich lebe ewig.« Die Übersetzung im Haupttext bringt die Schwurkraft der hebräischen Wendung zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die feierliche Begründung der vorausgehenden Aussage ein und bewahrt den Zusammenhang des Mose-Liedes.
- source_word: אֶשָּׂא
  choice: ich erhebe
  rationale: Gibt נשׂא im konkreten Gestus des Handerhebens beim Schwur natürlich und würdig wieder.
- source_word: אֶל שָׁמַיִם
  choice: zum Himmel
  rationale: Entspricht der deutschen Wendung für die nach oben gerichtete Schwurgeste; der morphologische Plural wird idiomatisch singularisch wiedergegeben.
- source_word: יָדִי
  choice: meine Hand
  rationale: Bewahrt den Singular und den konkreten Gegenstand der Schwurgeste.
- source_word: וְאָמַרְתִּי
  choice: und sage
  rationale: Setzt die performative Schwurhandlung im Deutschen natürlich fort; das Präsens passt zur unmittelbar vollzogenen feierlichen Rede.
- source_word: חַי אָנֹכִי
  choice: So wahr ich … lebe
  rationale: Gibt die hebräische Schwurformel idiomatisch wieder, ohne sie zu einer bloßen Aussage über das Lebendigsein abzuflachen.
- source_word: לְעֹלָם
  choice: ewig
  rationale: Bezeichnet hier die unbegrenzte Dauer des göttlichen Lebens in knapper, geläufiger Form.
theological_decisions:
- issue: Wiedergabe des göttlichen Selbstschwurs
  choice: So wahr ich ewig lebe!
  alternative: Ich lebe ewig.
  rationale: Die gewählte Form bewahrt sowohl die Aussage von Gottes ewigem Leben als auch die im Kontext erkennbare Schwurkraft. Sie fügt keine konfessionell geprägte Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erhebe meine Hand« bewahrt den feierlichen Gestus; »So wahr ich ewig lebe« ist als Selbstschwur verständlich und natürlich.
