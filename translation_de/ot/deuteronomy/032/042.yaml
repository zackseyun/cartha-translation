base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: de
  text: Ich werde meine Pfeile mit Blut trunken machen, und mein Schwert wird Fleisch verschlingen – vom Blut der Erschlagenen und Gefangenen, von den Köpfen der Anführer des Feindes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: „von den langhaarigen Köpfen des Feindes“; auch: „vom Haupt der Anführer des Feindes“. Das seltene hebräische Wort פַּרְעוֹת und die Konstruktion der gesamten Wortverbindung sind unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: werde … trunken machen
  rationale: Der Hifil von שׁכר bedeutet wörtlich „trunken machen“. Die ungewöhnliche, kraftvolle Metapher des Kriegsliedes bleibt so erhalten.
- source_word: חִצַּי
  choice: meine Pfeile
  rationale: Die übliche und natürliche deutsche Wiedergabe des Plurals von חֵץ mit Suffix der 1. Person Singular.
- source_word: מִדָּם
  choice: von Blut
  rationale: Die Präposition מן bezeichnet hier nach „trunken machen“ das, wovon die Pfeile trunken werden. „Von Blut“ bewahrt sowohl die hebräische Konstruktion als auch das poetische Bild.
- source_word: וְחַרְבִּי
  choice: und mein Schwert
  rationale: Direkte Wiedergabe der possessiven Form; das Subjekt des folgenden femininen Verbs bleibt klar.
- source_word: תֹּאכַל בָּשָׂר
  choice: wird Fleisch verschlingen
  rationale: Wörtlich steht „wird Fleisch essen“. „Verschlingen“ gibt im Deutschen die gewaltsame Personifikation des Schwertes natürlich und eindringlich wieder.
- source_word: מִדַּם חָלָל
  choice: vom Blut der Erschlagenen
  rationale: חָלָל bezeichnet hier im Krieg Gefallene beziehungsweise Erschlagene. „Erschlagene“ hält den gewaltsamen Zusammenhang fest.
- source_word: וְשִׁבְיָה
  choice: und der Gefangenen
  rationale: Das Substantiv kann Gefangenschaft, die Schar der Gefangenen oder Gefangene bezeichnen. Parallel zu „Erschlagenen“ ist die personale Wiedergabe hier am natürlichsten.
- source_word: מֵרֹאשׁ
  choice: von den Häuptern
  rationale: רֹאשׁ wird konkret als „Haupt/Kopf“ verstanden. Der deutsche Plural macht den kollektiven Bezug auf mehrere feindliche Anführer verständlich, ohne die Körpermetaphorik aufzugeben.
- source_word: פַּרְעוֹת
  choice: Anführer
  rationale: Das seltene Wort ist umstritten und kann möglicherweise auf frei wallendes Haar beziehungsweise Langhaarige oder auf Anführer/Krieger weisen. „Anführer“ ergibt im Haupttext einen verständlichen Zusammenhang; die konkretere Alternative wird in der Fußnote bewahrt.
- source_word: אוֹיֵב
  choice: des Feindes
  rationale: Der kollektive Singular wird entsprechend der hebräischen Form als „des Feindes“ wiedergegeben.
theological_decisions:
- issue: Deutung von מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: von den Häuptern der Anführer des Feindes
  alternative: vom Haupt der langhaarigen Feinde; vom Haupt der Anführer des Feindes
  rationale: Die Schwierigkeit ist lexikalisch und syntaktisch, nicht primär lehrmäßig. Der Haupttext bietet eine verständliche Deutung, während die Fußnote die echte Unsicherheit des seltenen Wortes פַּרְעוֹת und die mögliche kollektive Lesart von רֹאשׁ offenlegt.
translation_notes:
  register: Poetisch, kraftvoll und würdevoll. Die Personifikationen der trunkenen Pfeile und des Fleisch verschlingenden Schwertes werden bewusst bewahrt. Die schwierige Schlusswendung wird im Haupttext lesbar wiedergegeben, ohne ihre Unsicherheit in der Fußnote zu verdecken.
