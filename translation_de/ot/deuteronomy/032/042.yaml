    rationale: Die Formulierung „vom Haupt der langhaarigen Feinde“ verschiebt die mögliche Bildlichkeit. Als wörtlichere Alternative ist „von den langhaarigen Köpfen des Feindes“ verständlicher; außerdem sollte ausdrücklich gesagt werden, dass sowohl die Bedeutung von פַּרְעוֹת als auch die Konstruktion unsicher sind.
  - severity: low
    issue: „Von Blut“ und der Doppelpunkt sind im deutschen Satz stilistisch unnötig sperrig.
    rationale: „Mit Blut“ gibt die Sättigungs-/Instrumentalbedeutung von מִן in diesem Bild idiomatisch wieder. Ein Gedankenstrich lässt die elliptische poetische Fortsetzung stehen, ohne eine irreführend enge syntaktische Zuordnung zu erzeugen.
