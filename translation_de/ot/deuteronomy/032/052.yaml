  text: כִּ֥י מִ/נֶּ֖גֶד תִּרְאֶ֣ה אֶת הָ/אָ֑רֶץ וְ/שָׁ֨מָּ/ה֙ לֹ֣א תָב֔וֹא אֶל הָ/אָ֕רֶץ אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: de
  text: Denn du wirst das Land aus der Ferne sehen[a]; aber dorthin, in das Land, das ich den Söhnen Israels[b] gebe, wirst du nicht kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von gegenüber“. Die hebräische Wendung besagt hier, dass Mose das Land sehen, aber nicht betreten wird.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Israels“ ist die wörtliche Wiedergabe einer festen hebräischen Bezeichnung für das Volk Israel insgesamt; möglich ist daher auch „Israeliten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und stellt den natürlichen deutschen Satzanschluss her.
- source_word: מִנֶּגֶד
  choice: aus der Ferne
  rationale: Die Wendung bezeichnet den Standort gegenüber dem Land und außerhalb davon. „Aus der Ferne“ gibt in diesem Zusammenhang verständlich wieder, dass Mose das Land sehen, aber nicht betreten wird.
- source_word: תִּרְאֶה
  choice: du wirst sehen
  rationale: Das Imperfekt hat hier vorhersagende, futurische Bedeutung. Die deutsche Futurform wahrt den feierlichen Charakter des göttlichen Ausspruchs ohne altertümlich zu wirken.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: aber dorthin … wirst du nicht kommen
  rationale: „Dorthin“ bewahrt das ausdrückliche Richtungsadverb שָׁמָּה; „kommen“ gibt das breite Bedeutungsspektrum von בוא wieder. Die nachgestellte Satzordnung klingt im Deutschen natürlich und betont die verweigerte Ankunft.
- source_word: אֶל הָאָרֶץ
  choice: in das Land
  rationale: אֶל bezeichnet hier die Bewegung in das Land hinein. Die appositionelle Wiederholung des Landes bleibt entsprechend dem hebräischen Text erhalten.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: das ich … gebe
  rationale: Das Partizip נֹתֵן stellt Gottes Geben als gegenwärtig wirksamen beziehungsweise unmittelbar bevorstehenden Vorgang dar. Das deutsche Präsens kann diese Nuance idiomatisch ausdrücken.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die formale Bedeutung von בְנֵי wird beibehalten. Eine Fußnote erläutert, dass die feste Bezeichnung das ganze Volk Israel meint und nicht nur männliche Angehörige.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels; Volk Israel
  rationale: Die Übersetzung wahrt die grammatisch männliche Form und die traditionelle Abstammungsformel, ohne ihren kollektiven Bezug stillschweigend zu verengen. Die Fußnote macht deutlich, dass im Kontext das gesamte Volk bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt sowohl „dorthin“ als auch die anschließende nähere Bestimmung „in das Land“, ohne die hebräische Wiederholung unnötig zu glätten.
