source:
  edition: WLC
  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: de
  text: Denn es ist für euch kein leeres Wort[a], sondern es ist euer Leben[b]. Durch dieses Wort werdet ihr lange in dem Land leben, in das ihr über den Jordan zieht, um es in Besitz zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine belanglose Sache“ beziehungsweise „nichts Nichtiges“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eure Leben“; die hebräische Pluralform kann als abstrakter Singular „Leben“ gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: leeres Wort
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Hebräischen und bezeichnet das eben verkündete Bundeswort als weder gehaltlos noch bedeutungslos.
- source_word: מִכֶּם
  choice: für euch
  rationale: Die Präposition מן bezeichnet hier idiomatisch die Beziehung zu Israel; ein wörtliches „von euch“ wäre im Deutschen missverständlich.
- source_word: חַיֵּיכֶם
  choice: euer Leben
  rationale: Das morphologisch plurale חַיִּים wird häufig als abstrakter Singular gebraucht. „Euer Leben“ ist natürlich und erhält die gemeinschaftliche Anrede Israels.
- source_word: וּבַדָּבָר הַזֶּה
  choice: Durch dieses Wort
  rationale: ב wird instrumental verstanden. „Wort“ hält die Verbindung zum vorherigen דָבָר aufrecht, ohne die Aussage auf einen unbestimmten Sachverhalt zu reduzieren.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: werdet ihr lange … leben
  rationale: Die deutsche Wendung gibt die Bedeutung des Hifil von ארך mit יָמִים klar und idiomatisch wieder; die wörtlichere Form „eure Tage verlängern“ wäre möglich, klingt hier jedoch weniger natürlich.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: אֲדָמָה bezeichnet in diesem deuteronomischen Zusammenhang das verheißene Land. Das deutsche „in dem Land leben“ ist natürlicher als „auf dem Land“, das ländlichen Raum nahelegen könnte.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: über den Jordan zieht
  rationale: Das Partizip schildert die unmittelbar bevorstehende Überquerung aus Moses Perspektive. „Zieht“ passt zum gemeinschaftlichen Übergang Israels und ist im Deutschen idiomatisch.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: in das …, um es in Besitz zu nehmen
  rationale: Das lokale שָׁמָּה wird durch „in das“ ausgedrückt; ירשׁ bezeichnet hier das Erlangen beziehungsweise Antreten des Landbesitzes. Die Formulierung erhält sowohl Zielrichtung als auch Objektbezug.
theological_decisions:
- issue: Bundesbezogener Zusammenhang von Wort, Leben und langem Wohnen im Land
  choice: Das verkündete Wort wird als Israels Leben und als Mittel zu langem Leben im Land dargestellt.
  alternative: Der Vers könnte lediglich als allgemeine rhetorische Würdigung der Bedeutung des Wortes verstanden werden.
  rationale: Die parallelen Aussagen „es ist euer Leben“ und „durch dieses Wort werdet ihr lange … leben“ verbinden das Wort ausdrücklich mit Israels Leben im Land. Die Übersetzung bewahrt diesen Zusammenhang, ohne ein nicht ausdrücklich genanntes dogmatisches System einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leeres Wort“ bewahrt das hebräische Bild, während „lange … leben“ und „in Besitz nehmen“ die Aussage für heutige Leser natürlich und eindeutig formulieren. Alle Fußnotenmarker stehen unmittelbar an der betreffenden Textstelle.
