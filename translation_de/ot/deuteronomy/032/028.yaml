  text: כִּי ג֛וֹי אֹבַ֥ד עֵצ֖וֹת הֵ֑מָּה וְ/אֵ֥ין בָּ/הֶ֖ם תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: de
  text: 'Denn sie sind ein Volk ohne Rat,

    und es gibt keine Einsicht bei ihnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung oder Erläuterung zum vorausgehenden Gedanken ein und wahrt den Zusammenhang.
- source_word: גּוֹי
  choice: Volk
  rationale: Bezeichnet hier ein kollektiv verstandenes Gemeinwesen; „Volk“ ist im Deutschen natürlich und vermeidet moderne staatsrechtliche Nebenbedeutungen von „Nation“.
- source_word: אֹבַד עֵצוֹת
  choice: ohne Rat
  rationale: Die Verbindung beschreibt ein Volk, dem vernünftiger Rat beziehungsweise kluge Planung fehlt. Die knappe Wendung gibt den idiomatischen Sinn natürlich wieder.
- source_word: הֵמָּה
  choice: sie sind
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; im deutschen Nominalsatz wird die Kopula ergänzt.
- source_word: וְאֵין
  choice: und es gibt keine
  rationale: Gibt die hebräische Existenzverneinung klar wieder und erhält die koordinierte Satzstruktur.
- source_word: בָּהֶם
  choice: bei ihnen
  rationale: Drückt idiomatisch aus, dass innerhalb dieses Volkes keine Einsicht vorhanden ist; „in ihnen“ wäre möglich, klingt hier aber weniger natürlich.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: Bewahrt den weisheitssprachlichen Gedanken von Verständnis und Unterscheidungsvermögen und passt gut zu „Rat“.
