  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des Hebräischen treffend wieder: אָמַרְתִּי als einleitende Selbstrede Gottes, die schwierige Form אַפְאֵיהֶם vorsichtig als „zerstreuen“ und אַשְׁבִּיתָה mit der Bedeutung des Aufhörenlassens als „auslöschen“. „Die Erinnerung an sie unter den Menschen“ gibt זִכְרָם מֵאֱנוֹשׁ idiomatisch und semantisch angemessen wieder, ohne die kollektive Bedeutung von אֱנוֹשׁ zu verengen.'
