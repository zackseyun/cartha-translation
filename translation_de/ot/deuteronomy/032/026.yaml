  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: de
  text: 'Ich sagte: »Ich will sie zerstreuen[a] und die Erinnerung an sie unter den Menschen[b] auslöschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie wegblasen / auseinandertreiben«. Das hebräische Verb ist selten und schwer zu deuten; manche verstehen es als ein Treiben in die Ecken oder als ein Entfernen aus dem Blickfeld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »vom Menschen« oder »von Sterblichen«. Im Hebräischen steht eine Einzahl mit kollektivem Sinn für die Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Das Qal Perfekt 1. Person Singular von אמר führt Gottes erklärte Absicht ein. Die direkte Wiedergabe bewahrt die poetische Redeform.
- source_word: אַפְאֵיהֶם
  choice: ich will sie zerstreuen
  rationale: Die seltene und schwierige Form wird traditionell im Sinn von Zerstreuen oder Auseinandertreiben verstanden. „Zerstreuen“ ist im Deutschen klar, ohne die unsichere Bildvorstellung von Ecken oder Wegblasen festzuschreiben.
- source_word: אַשְׁבִּיתָה
  choice: auslöschen
  rationale: Der Hifil von שבת bezeichnet das Aufhörenlassen. In Verbindung mit „Erinnerung“ gibt „auslöschen“ die verursachte Beendigung idiomatisch und prägnant wieder.
- source_word: מֵאֱנוֹשׁ
  choice: unter den Menschen
  rationale: אֱנוֹשׁ ist hier kollektiv auf die Menschheit beziehungsweise sterbliche Menschen bezogen. Im Deutschen beschreibt „unter den Menschen“ natürlich den Bereich, aus dem die Erinnerung verschwinden soll.
- source_word: זִכְרָם
  choice: die Erinnerung an sie
  rationale: זֵכֶר bezeichnet Erinnerung oder Gedenken. „Die Erinnerung an sie“ ist eindeutiger und idiomatischer als „ihre Erinnerung“, das auch ihre eigene Erinnerungsfähigkeit bezeichnen könnte.
theological_decisions:
- issue: Göttliche Rede und angedrohtes Gericht in poetischer Form
  choice: Die Kohortativformen als erklärte Absicht mit „ich will“ wiedergeben
  alternative: „Ich werde sie zerstreuen und die Erinnerung an sie auslöschen“ oder konditional „ich würde“
  rationale: „Ich will“ bewahrt den volitiven Charakter der hebräischen Formen und lässt zugleich die Spannung zum folgenden Vers bestehen, ohne die Drohung vorzeitig als vollzogene Zukunft oder bloß hypothetische Möglichkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Satzführung. „Die Erinnerung an sie“ vermeidet eine im Deutschen mögliche Bedeutungsverschiebung; „unter den Menschen“ gibt die kollektive hebräische Wendung natürlich wieder.
