  terminology: „Zerstreuen“, „Erinnerung“ und „auslöschen“ sind für den Kontext des angedrohten Gerichts sachgerecht. „Unter den Menschen“ ist eine natürliche deutsche Wiedergabe der kollektiven menschlichen Sphäre; sie behauptet keine weitergehende theologische Deutung.
