  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: de
  text: 'Seht nun: Ich, ja ich, bin es, und kein Gott ist neben mir.[a] Ich töte und mache lebendig; ich habe zerschlagen, und ich werde heilen.[b] Niemand kann aus meiner Hand befreien.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und kein Gott ist mit mir“. Im Zusammenhang bedeutet die Wendung, dass keine andere Gottheit neben ihm steht.'
    reason: lexical_alternative
  - marker: b
    text: Für „zerschlagen“ ist auch „verwundet“ möglich. Das hebräische Verb kann eine schwere, vernichtende Verletzung bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: „Aus meiner Hand“ ist ein Bild für die Macht und Verfügungsgewalt des Sprechers.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Seht nun
  rationale: Der pluralische Imperativ und das Zeitadverb werden knapp und würdevoll wiedergegeben; die Aufforderung zielt auf Einsicht und Anerkennung.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: Ich, ja ich, bin es
  rationale: „Ja ich“ gibt die emphatische Wiederholung des Personalpronomens in natürlichem Deutsch wieder, ohne das interpretierende „allein“ einzufügen.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: und kein Gott ist neben mir
  rationale: „Neben mir“ wahrt sowohl die räumlich-assoziative Grundbedeutung der Präposition als auch den im Kontext naheliegenden Ausschluss einer anderen Gottheit.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Ich töte, und ich mache lebendig
  rationale: „Töte“ gibt den kausativen Sinn von מות direkt wieder; „mache lebendig“ bewahrt die parallele Form und die ausdrückliche göttliche Urheberschaft.
- source_word: מָחַצְתִּי
  choice: ich habe zerschlagen
  rationale: Das Verb bezeichnet eine schwere, zertrümmernde Verletzung. „Zerschlagen“ erhält seine Kraft und bildet dennoch einen verständlichen Gegensatz zu „heilen“.
- source_word: וַאֲנִי אֶרְפָּא
  choice: und ich werde heilen
  rationale: Die futurische Wiedergabe des Imperfekts bewahrt die Abfolge von bereits zugefügter Verletzung und anschließender Heilung; das nochmals gesetzte אֲנִי bleibt durch das Subjekt „ich“ sichtbar.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: Niemand kann aus meiner Hand retten
  rationale: Die Formulierung gibt die existentielle Verneinung und die implizierte Unmöglichkeit der Rettung wieder; „aus meiner Hand“ bewahrt das hebräische Machtbild.
theological_decisions:
- issue: Ausschließlichkeit Gottes gegenüber anderen Göttern
  choice: „kein Gott ist neben mir“ als starke Ausschließlichkeitsaussage
  alternative: „kein Gott ist mit mir“ im Sinn eines fehlenden Verbündeten oder Mitgottes
  rationale: Der Kontext trägt eine Aussage ausschließlicher Gottheit. Die Übersetzung bewahrt zugleich die Präposition bildnah und führt keine spätere philosophische Terminologie ein.
- issue: Theologische Tragweite von אֲנִי אֲנִי הוּא
  choice: „Ich, ja ich, bin es“ ohne dogmatische Erweiterung
  alternative: „Ich allein bin Gott“ oder „Ich bin der Eine“
  rationale: Die emphatische Selbstaussage wird erhalten, aber nicht durch Begriffe ergänzt, die zwar aus dem Kontext erschlossen werden könnten, jedoch nicht ausdrücklich in dieser Wortgruppe stehen.
- issue: Göttliche Verfügung über Tod, Leben, Verwundung und Heilung
  choice: Die vier Tätigkeiten werden uneingeschränkt dem Sprecher zugeschrieben
  alternative: Abschwächende oder nur zulassende Formulierungen
  rationale: Die hebräischen Verben bezeichnen unmittelbares Handeln. Eine Übersetzung mit „zulassen“ würde eine theologische Erklärung in den Text eintragen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit gehobenem poetischem Ernst. Die parallelen Satzglieder und das Bild der Hand bleiben erhalten; altertümliche Formen und konfessionell geprägte Zusätze werden vermieden.
