base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: de
  text: Denn Jahwe wird seinem Volk Recht verschaffen und sich über seine Diener erbarmen[a], wenn er sieht, dass ihre Kraft geschwunden ist[b] und niemand mehr übrig ist, weder der Festgehaltene noch der Verlassene[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seinen Entschluss gegenüber seinen Dienern ändern“ beziehungsweise „über seine Diener Mitleid empfinden“. Das hebräische Verb kann sowohl ein Einlenken als auch erbarmendes Mitleid ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass die Hand geschwunden ist“; „Hand“ bezeichnet hier Kraft oder Macht.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „der Festgehaltene und der Verlassene“. Die Bedeutung dieses schwierigen Ausdrucks ist unsicher; wahrscheinlich meint er umfassend alle Menschen beziehungsweise: „niemand mehr“. Möglich ist auch die traditionelle Deutung „Sklave oder Freier“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: wird … Recht verschaffen
  rationale: Das Verb kann „richten“, „regieren“ oder „Recht verschaffen“ bedeuten. Der Zusammenhang weist hier auf ein richterliches Handeln zugunsten des Volkes; die deutsche Wendung bewahrt zugleich den gerichtlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: Wahrt die kollektive und bundesbezogene Bezeichnung.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: und sich über seine Diener erbarmen
  rationale: נחם kann hier ein Sich-Erbarmen beziehungsweise ein Absehen oder Einlenken bezeichnen. „Sich erbarmen“ ist im Zusammenhang natürlich und lässt die barmherzige Hinwendung zu seinen Dienern hervortreten.
- source_word: כִּי יִרְאֶה
  choice: wenn er sieht
  rationale: Gibt die zeitlich-kausale Überlappung von כִּי im Deutschen natürlich wieder.
- source_word: אָזְלַת יָד
  choice: ihre Kraft geschwunden ist
  rationale: Die wörtliche Aussage „die Hand ist vergangen“ ist eine bildhafte Wendung für erschöpfte Kraft oder Macht.
- source_word: וְאֶפֶס
  choice: und niemand mehr übrig ist
  rationale: Drückt das Ende beziehungsweise Nichtvorhandensein von Personen aus und verbindet sich verständlich mit dem folgenden Paar.
- source_word: עָצוּר וְעָזוּב
  choice: weder Gebundener noch Freigelassener
  rationale: Das schwierige Gegensatzpaar wird relativ formnah wiedergegeben. Es bezeichnet wahrscheinlich umfassend alle noch Verbliebenen; die Fußnote bewahrt alternative Deutungen, ohne die Unsicherheit im Haupttext aufzulösen.
theological_decisions:
- issue: Sinn des göttlichen Handelns in יָדִין ... וְעַל עֲבָדָיו יִתְנֶחָם
  choice: Jahwe verschafft seinem Volk Recht und erbarmt sich über seine Diener.
  alternative: Jahwe richtet sein Volk und lässt sich hinsichtlich seiner Diener umstimmen.
  rationale: Parallelismus und Begründung durch die völlige Hilflosigkeit des Volkes sprechen für ein Handeln zu seinen Gunsten. Die Fußnote hält die breitere richterliche Bedeutung und die Möglichkeit des Einlenkens offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Recht verschaffen“ ist idiomatischer als „rechtfertigen“ und vermeidet dessen zusätzliche dogmatische Konnotationen. Das seltene Schlusspaar bleibt im Haupttext erkennbar, während die sachlich notwendige Unsicherheit in der Fußnote erläutert wird. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
