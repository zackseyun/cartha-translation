  text: חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑/ם וְ/רֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: de
  text: 'Ihr Wein ist Schlangengift[b],

    das grausame Gift der Kobras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gift der Ottern“; das hebräische Wort bezeichnet eine Giftschlange und wird traditionell auch mit „Aspis“ oder „Otter“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Schlangen“ wiedergegebene hebräische Wort kann in anderen Zusammenhängen auch große Reptilien oder Ungeheuer bezeichnen. Der Parallelismus mit einer Giftschlange legt hier die Bedeutung „Schlangen“ nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: Gift
  rationale: In der Verbindung mit Schlangen bezeichnet das Wort hier Gift statt Zorn oder Hitze; „Gift“ ist im Deutschen natürlich und bildet mit dem zweiten Versglied eine bewusste poetische Wiederholung.
- source_word: תַּנִּינִם
  choice: Schlangen
  rationale: Das Wort kann in anderen Zusammenhängen große Reptilien oder Ungeheuer bezeichnen. Der Parallelismus mit einer Giftschlange und der Bezug auf Gift sprechen hier für „Schlangen“.
- source_word: יֵינָם
  choice: ihr Wein
  rationale: Die Possessivkonstruktion wird unmittelbar wiedergegeben; der Wein wird metaphorisch als tödliches Gift bezeichnet.
- source_word: וְרֹאשׁ
  choice: das Gift
  rationale: Hier bezeichnet רֹאשׁ einen giftigen beziehungsweise bitteren Stoff und nicht „Kopf“. Der bestimmte Ausdruck ist im parallelen deutschen Versglied klar und idiomatisch.
- source_word: פְּתָנִים
  choice: Kobras
  rationale: Gemeint ist eine gefährliche Giftschlange; „Kobras“ ist eine plausible moderne Wiedergabe, doch die genaue Art bleibt unsicher und wird deshalb in einer Fußnote erläutert.
- source_word: אַכְזָר
  choice: grausame
  rationale: Das Adjektiv charakterisiert die tödliche, erbarmungslose Wirkung des Gifts und bewahrt die Personifizierung des hebräischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. Die Wiederholung von „Gift“ entspricht der engen Bedeutungsnähe der beiden hebräischen Ausdrücke und klingt im Deutschen kräftig und verständlich. Beide Fußnotenmarker stehen an den jeweils erläuterten Begriffen im Haupttext.
