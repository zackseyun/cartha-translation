  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: de
  text: Ich werde Unheil über sie häufen[a]; meine Pfeile werde ich gegen sie aufbrauchen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Katastrophen“; wörtlich auch „Böses“, hier im Sinn von schädigendem Unheil, nicht von moralischer Bosheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Pfeile werde ich an ihnen erschöpfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: ich werde … häufen
  rationale: Das Verb אסף bezeichnet hier im Hifil ein Anhäufen beziehungsweise Zusammenbringen von Unheil über den Betroffenen. „häufen“ bewahrt das poetische Bild und klingt im Deutschen natürlich.
- source_word: עָלֵימוֹ
  choice: über sie
  rationale: Die Präposition עַל mit dem Suffix der 3. Person Plural bezeichnet hier, dass das Unheil über die Menschen gebracht wird. „über sie“ entspricht der deutschen Wendung „Unheil über jemanden häufen“.
- source_word: רָעוֹת
  choice: Unheil
  rationale: Der Plural von רָע bezeichnet in diesem Gerichtskontext schädigendes Unglück beziehungsweise Katastrophen, nicht moralische Bosheit. Das deutsche Kollektivum „Unheil“ gibt diesen Sinn knapp und würdig wieder.
- source_word: חִצַּי
  choice: meine Pfeile
  rationale: Die wörtliche Kriegsmetapher des hebräischen Plurals mit Suffix bleibt erhalten.
- source_word: אֲכַלֶּה
  choice: werde ich … aufbrauchen
  rationale: Das Piel von כלה bedeutet hier, die Pfeile vollständig einzusetzen beziehungsweise zu verbrauchen. „aufbrauchen“ vermittelt sowohl den Gebrauch als auch die Vollständigkeit.
- source_word: בָּם
  choice: gegen sie
  rationale: בְּ bezeichnet hier das Ziel, gegen das die Pfeile eingesetzt werden. „gegen sie“ gibt die feindliche Ausrichtung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von רָעוֹת im Zusammenhang mit göttlichem Gericht
  choice: Unheil
  alternative: Böses; Katastrophen
  rationale: „Unheil“ bewahrt die Härte des angekündigten Gerichts, ohne dem Ausdruck unnötig den Sinn moralischer Bosheit zuzuschreiben. Die mögliche konkretere Wiedergabe „Katastrophen“ wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem Parallelismus und Kriegsbild. Das Kollektivum „Unheil“ ist im Deutschen natürlicher als ein erzwungener Plural; die beiden Halbverse bleiben eng und poetisch.
