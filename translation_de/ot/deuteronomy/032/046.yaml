base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Nehmt euch alle Worte zu Herzen, die ich euch heute bezeuge[a], damit ihr euren Söhnen[b] gebietet, alle Worte dieser Weisung zu beachten und zu tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ich euch heute eindringlich einschärfe« oder »die ich heute gegen euch bezeuge«. Das hebräische Verb kann im Bundeskontext Bezeugen, Warnen und forensisches Zeugnis verbinden.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Hebräischen »euren Söhnen«; damit kann zugleich die nachfolgende Generation insgesamt gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Nehmt euch … zu Herzen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Herzbild und umfasst Aufmerksamkeit, Willen und Entschlossenheit.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: die Worte / alle Worte
  rationale: דָּבָר bezeichnet hier die ausgesprochenen Bundesworte; die Wiederholung im Vers bleibt erhalten.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: die ich euch heute eindringlich bezeuge
  rationale: Das Hifil von עוּד verbindet feierliches Bezeugen mit Ermahnen oder Warnen. »Eindringlich bezeuge« hält diese Spannweite im Haupttext offen; die forensische Alternative steht in der Fußnote.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: damit ihr … auftragt
  rationale: 'Der Relativsatz mit Imperfekt lässt sich im Zusammenhang zweckbezogen verstehen: Israel soll die Worte beherzigen, um sie der nächsten Generation verbindlich weiterzugeben.'
- source_word: בְּנֵיכֶם
  choice: euren Söhnen
  rationale: Die ausdrücklich maskuline Pluralform wird im Haupttext bewahrt; eine mögliche weitere, repräsentative Bedeutung wird in der Fußnote genannt.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: gewissenhaft zu befolgen
  rationale: Die Verbindung von שׁמר und עשׂה bezeichnet sorgfältiges Bewahren beziehungsweise Beachten, das im Tun Gestalt gewinnt. Die idiomatische deutsche Formulierung gibt beide Aspekte gemeinsam wieder.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieser Weisung
  rationale: תּוֹרָה bezeichnet hier die verbindliche Bundesunterweisung. »Weisung« gibt den Bedeutungsumfang wieder, ohne ihn auf modernes Gesetzesrecht einzuengen.
theological_decisions:
- issue: Zeugnis-, Warn- und forensische Bedeutung von מֵעִיד בָּכֶם
  choice: euch heute eindringlich bezeuge
  alternative: euch heute warne; heute gegen euch als Zeugen anrufe
  rationale: Die Formulierung bewahrt im Haupttext den feierlichen Zeugnischarakter, ohne die im Bundeskontext mögliche Warn- oder Anklagefunktion auszuschließen.
- issue: Geschlechtsspezifischer Bezug von בְּנֵיכֶם
  choice: euren Söhnen
  alternative: euren Kindern
  rationale: Der hebräische Text nennt ausdrücklich die Söhne; dass diese Bezeichnung die nachfolgende Generation weiter gefasst vertreten kann, wird nicht stillschweigend in den Haupttext eingetragen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: »Weisung« bildet den unterweisenden und zugleich verbindlichen Charakter der Tora in diesem Zusammenhang ab; »Gesetz« bleibt eine sachlich mögliche traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung »zu Herzen nehmen« bewahrt das Quellbild; »eindringlich bezeugen« erhält die semantische Spannung des Bundeszeugnisses. Die Satzstruktur bleibt gut vorlesbar und zugleich eng am Hebräischen.
