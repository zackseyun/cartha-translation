  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: de
  text: Wie könnte einer tausend verfolgen, und wie könnten zwei zehntausend in die Flucht schlagen, wenn nicht ihr Fels sie verkauft und Jahwe sie ausgeliefert hätte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preisgegeben hätte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie könnte
  rationale: Gibt die erstaunte rhetorische Frage im Deutschen natürlich wieder.
- source_word: יִרְדֹּף
  choice: verfolgen
  rationale: Bewahrt die übliche militärische Bedeutung von רדף.
- source_word: אֶחָד אֶלֶף
  choice: einer tausend
  rationale: Erhält das auffällige Zahlenverhältnis des hebräischen Textes ohne erklärende Erweiterung.
- source_word: וּשְׁנַיִם יָנִיסוּ רְבָבָה
  choice: und könnten zwei zehntausend in die Flucht schlagen
  rationale: Die Kausativform von נוּס wird mit der geläufigen militärischen Wendung „in die Flucht schlagen“ wiedergegeben; רְבָבָה bezeichnet hier zehntausend.
- source_word: אִם לֹא כִּי
  choice: wenn nicht
  rationale: Leitet die einzig mögliche Erklärung für das beschriebene Missverhältnis ein.
- source_word: צוּרָם
  choice: ihr Fels
  rationale: Bewahrt das im Lied des Mose wiederkehrende Gottesbild und seinen titelartigen Gebrauch.
- source_word: מְכָרָם
  choice: sie verkauft
  rationale: Gibt die konkrete Metapher von מכר direkt wieder und lässt den Gedanken des Überlassens an Feinde erkennen.
- source_word: וַיהוָה
  choice: und Jahwe
  rationale: Gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen in der im Deutschen üblichen Form wieder.
- source_word: הִסְגִּירָם
  choice: sie ausgeliefert
  rationale: Bezeichnet hier das Übergeben in die Gewalt eines anderen; „ausgeliefert“ ist im Deutschen präzise und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt ihn als solchen in einer geläufigen deutschen Form.
- issue: צוּר als Gottesbezeichnung
  choice: ihr Fels
  alternative: ihr Beschützer
  rationale: Die Metapher wird nicht aufgelöst, da sie im Lied des Mose theologisch prägend und im unmittelbaren Zusammenhang bewusst mehrdeutig ist.
- issue: Verhältnis von מכר und סגר
  choice: verkauft und ausgeliefert
  alternative: preisgegeben und übergeben
  rationale: Die beiden unterschiedlichen hebräischen Verben bleiben als parallele, aber nicht identische Aussagen erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Konjunktiv II gibt die rhetorische Unmöglichkeit wieder; die kräftigen militärischen Bilder und die Verkaufsmetapher des Hebräischen bleiben erhalten.
