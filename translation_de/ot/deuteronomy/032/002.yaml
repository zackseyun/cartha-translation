base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: de
  text: Möge meine Lehre wie Regen herabträufeln, meine Rede wie Tau herabrieseln, wie Regenschauer auf junges Grün und wie Regengüsse auf die Pflanzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲרֹף
  choice: träufle
  rationale: Das Verb beschreibt hier ein Herabkommen in Tropfen. „Träufle“ bewahrt das Niederschlagsbild und den poetischen Wunschcharakter.
- source_word: לִקְחִי
  choice: meine Lehre
  rationale: לֶקַח bezeichnet empfangene oder vermittelte Unterweisung; „Lehre“ passt zum mosaischen Lied und ist im Deutschen klar und würdig.
- source_word: תִּזַּל
  choice: riesele
  rationale: נזל kann fließen oder tropfen bedeuten. In Verbindung mit Tau gibt „riesele“ die sanfte Bewegung natürlich wieder.
- source_word: אִמְרָתִי
  choice: meine Rede
  rationale: אִמְרָה bezeichnet Wort, Ausspruch oder Rede. „Meine Rede“ bildet einen natürlichen poetischen Parallelismus zu „meine Lehre“.
- source_word: שְׂעִירִם
  choice: Regenschauer
  rationale: Das seltene Wort bezeichnet im Kontext wahrscheinlich leichte Regenschauer oder Regentropfen; „Regenschauer“ erhält das Niederschlagsbild, ohne eine sachfremde Bedeutung einzutragen.
- source_word: דֶשֶׁא
  choice: junges Grün
  rationale: דֶשֶׁא bezeichnet frisch sprossende Vegetation. „Junges Grün“ gibt diese Nuance wieder und bleibt zugleich poetisch und allgemein verständlich.
- source_word: רְבִיבִים
  choice: Regengüsse
  rationale: רְבִיבִים bezeichnet reichliche oder kräftige Niederschläge. „Regengüsse“ unterscheidet sie von den leichteren Schauern des vorherigen Versglieds.
- source_word: עֵשֶׂב
  choice: die Pflanzen
  rationale: עֵשֶׂב umfasst Kraut und sonstige Vegetation und ist weiter als „Gras“. „Pflanzen“ ist modernes, verständliches Deutsch.
theological_decisions: []
translation_notes:
  register: Poetisches, aber modernes Standarddeutsch. Die beiden Wunschformen „träufle“ und „riesele“ bewahren den hebräischen Parallelismus; die Abstufung von Tau und Schauern zu Regengüssen bleibt erkennbar.
