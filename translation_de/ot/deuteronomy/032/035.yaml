  - marker: b
    text: 'Oder: „wenn ihr Fuß wankt“ beziehungsweise „nachgibt“.'
    reason: lexical_alternative
  - marker: c
    text: Die erste Vershälfte wird in Römer 12,19 und sinngemäß in Hebräer 10,30 aufgegriffen.
    reason: cross_reference
  - marker: d
    text: 'Oder: „und das ihnen Bestimmte kommt eilends“; das Hebräische ist knapp formuliert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: Mein ist die Rache und die Vergeltung
  rationale: Die Voranstellung „Mein ist“ bewahrt die betonte göttliche Zuständigkeit; „Rache“ bezeichnet hier rechtmäßige Ahndung, während „Vergeltung“ den nominal gebrauchten Sinn von שִׁלֵּם wiedergibt.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: für die Zeit, da ihr Fuß wankt
  rationale: לְעֵת lässt sich als Bezug auf den bestimmten Zeitpunkt verstehen. Der singularische „Fuß“ bleibt als kollektives Bild erhalten; „wankt“ wahrt die Bildlichkeit und lässt sowohl Unsicherheit als auch bevorstehenden Sturz anklingen.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: Denn der Tag ihres Verderbens ist nahe
  rationale: כִּי wird kausal mit „Denn“ wiedergegeben. „Verderben“ passt zum feierlich-poetischen Register und bezeichnet die drohende vernichtende Not, ohne unnötige Einzelheiten festzulegen.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: und was für sie bereitsteht, eilt herbei
  rationale: Die komprimierte hebräische Wendung wird konkret, aber offen wiedergegeben. „Bereitsteht“ bewahrt den Gedanken des Bevorstehenden bzw. Bereiteten; „eilt herbei“ macht die rasche Annäherung natürlich verständlich.
theological_decisions:
- issue: Charakter der göttlichen Vergeltung
  choice: „Mein ist die Rache“
  alternative: „Mein ist das Recht zu strafen“ / „Ich werde mich rächen“
  rationale: „Rache“ erhält die Schwere und intertextuelle Wiedererkennbarkeit der Aussage, ohne sie zu bloßer abstrakter Gerechtigkeit abzuschwächen oder als persönlich-vindiktive Reaktion auszudeuten.
- issue: Bedeutung von עֲתִדֹת לָמוֹ
  choice: „was für sie bereitsteht“
  alternative: „ihr Verhängnis“ / „was ihnen bestimmt ist“
  rationale: Die konkrete, offene Formulierung vermeidet es, die komprimierte hebräische Aussage vorschnell auf ein abstraktes Schicksal oder eine präzis definierte Strafe festzulegen.
translation_notes:
  register: Feierlich-poetisches, zugleich allgemein verständliches Standarddeutsch. Die Parallelität von „Rache“ und „Vergeltung“ sowie die Bilder vom wankenden Fuß und vom herbeieilenden Gericht bleiben erhalten.
