  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: de
  text: Mein ist die Rache und die Vergeltung[a][c] zu der Zeit, wenn ihr Fuß ausgleitet[b]. Denn der Tag ihres Unheils ist nahe, und was für sie bereitsteht, eilt herbei[d].
  philosophy: optimal-equivalence
  footnotes:
