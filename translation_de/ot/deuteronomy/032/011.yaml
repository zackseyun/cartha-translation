base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: de
  text: Wie ein Adler[a], der sein Nest aufscheucht[b] und über seinen Jungen schwebt[c], breitet er seine Flügel aus, nimmt ihn und trägt ihn auf seinen Schwingen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Geier“; das hebräische נֶשֶׁר kann einen großen Aasvogel oder einen adlerartigen Greifvogel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der sein Nest aufrüttelt“ beziehungsweise „aufweckt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „über seinen Jungen flattert“; das hebräische Verb kann schwebende oder flatternde Bewegung bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „auf seinen Schwungfedern“. Das hebräische Wort bezeichnet hier das Gefieder beziehungsweise die tragenden Federn der Flügel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Wie ein Adler
  rationale: נֶשֶׁר bezeichnet einen großen Greif- oder Aasvogel. „Adler“ ist im Deutschen die traditionelle, bildkräftige Wiedergabe; die zoologisch mögliche Alternative „Geier“ bleibt in einer Fußnote erhalten.
- source_word: יָעִיר קִנּוֹ
  choice: der sein Nest aufscheucht
  rationale: Das Hifil von עור bedeutet „aufwecken, aufrütteln, aufscheuchen“. „Das Nest aufscheuchen“ gibt das aktive Aufrütteln der Brut natürlich und anschaulich wieder.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: über seinen Jungen schwebt
  rationale: רחף bezeichnet ein schwebendes oder flatterndes Bewegen. „Schwebt“ ist verständlich und bewahrt das schützende Bild; גּוֹזָלִים wird natürlich mit „Jungen“ wiedergegeben.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: so breitete er seine Flügel aus
  rationale: פרשׂ bedeutet „ausbreiten“. Das hinzugefügte „so“ macht die Entsprechung des Vergleichs im Deutschen klar, ohne den Sinn zu erweitern; das maskuline Pronomen lässt den Übergang vom Vogelbild zum göttlichen Handeln anklingen.
- source_word: יִקָּחֵהוּ
  choice: nahm ihn auf
  rationale: לקח bedeutet grundsätzlich „nehmen“. „Aufnehmen“ passt hier zum Bild, dass das einzelne Junge getragen wird, und bewahrt das maskuline Singularobjekt.
- source_word: יִשָּׂאֵהוּ
  choice: trug ihn
  rationale: נשׂא bezeichnet hier das Tragen oder Hochheben. „Trug“ ist natürliches modernes Deutsch und bewahrt das poetische Bild.
- source_word: עַל אֶבְרָתוֹ
  choice: auf seinen Schwingen
  rationale: אֶבְרָה bezeichnet Schwungfeder, Gefieder oder Schwinge und unterscheidet sich von כָּנָף „Flügel“. „Schwingen“ erhält diese poetische lexikalische Abstufung besser als eine erneute Wiedergabe mit „Flügel“.
theological_decisions:
- issue: Pronomenführung und Übergang vom Vergleich zum göttlichen Bezug
  choice: Im zweiten Halbvers maskulines „er/seine/ihn“ verwenden
  alternative: Das Vogelbild durchgehend mit „er“ auf den Adler beziehen oder neutral formulieren
  rationale: 'Das Hebräische verwendet durchgehend maskuline Singularformen; im Kontext beschreibt das Bild das Handeln JHWHs an Israel. Die deutsche Formulierung bewahrt die poetische Offenheit: „er“ kann grammatisch zunächst auf den Adler zurückweisen und zugleich den göttlichen Referenten erkennen lassen, ohne ihn ausdrücklich einzutragen.'
- issue: Singularobjekt in יִקָּחֵהוּ und יִשָּׂאֵהוּ
  choice: „ihn“ im Singular bewahren
  alternative: Pluralisch „sie“ auf die Jungen beziehen oder ausdrücklich „Israel“ einsetzen
  rationale: Die maskuline Singularendung individualisiert ein Junges beziehungsweise im übertragenen Zusammenhang Israel. Die Wiedergabe „ihn“ erhält diese Spannung, ohne den Referenten festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Satzrhythmus. Die Wiederholung von „Flügel“ wird vermieden, um die hebräische Unterscheidung zwischen כָּנָף und אֶבְרָה hörbar zu machen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
