source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: de
  text: und stirb auf dem Berg, auf den du hinaufsteigst, und werde zu deinem Volk versammelt[a], so wie dein Bruder Aaron auf dem Berg Hor starb und zu seinem Volk versammelt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinen Vorfahren versammelt“. Wörtlich lautet die hebräische Wendung: „zu deinem Volk versammelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: und stirb
  rationale: Der Qal-Imperativ richtet sich unmittelbar an Mose. „Stirb“ bewahrt die direkte, knappe Form des Hebräischen, ohne die Aussage in eine bloße Vorhersage umzudeuten.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: auf dem Berg, auf den du hinaufsteigst
  rationale: „Berg“ gibt הַר wieder; „hinaufsteigen“ bewahrt die Aufwärtsbewegung von עלה. Das zielgerichtete שָׁמָּה wird im Deutschen natürlich durch „auf den“ ausgedrückt, ohne ein schwerfälliges zusätzliches „dorthin“.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: und werde zu deinem Volk versammelt
  rationale: Die passive Wendung erhält den Niphal von אסף und bewahrt die hebräische Sterbeformel, statt sie interpretierend auf Bestattung oder Abstammung einzuengen.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Formulierung gibt den Vergleich mit Aarons Tod in natürlichem modernem Deutsch wieder.
- source_word: אַהֲרֹן אָחִיךָ
  choice: dein Bruder Aaron
  rationale: Diese Wortstellung ist im Deutschen natürlicher als „Aaron, dein Bruder“, ohne den Sinn zu verändern.
- source_word: בְּהֹר הָהָר
  choice: auf dem Berg Hor
  rationale: „Berg Hor“ ist die übliche deutsche Wiedergabe des Ortsnamens; „auf“ entspricht dem Bergkontext und der vorangehenden Ortsangabe.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: und zu seinem Volk versammelt wurde
  rationale: Die gleiche Wendung wie bei Mose erhält die lexikalische Entsprechung und die theologische Offenheit der hebräischen Sterbeformel.
theological_decisions:
- issue: Wiedergabe der Sterbeformel אסף אל־עמיו
  choice: Die Wendung „zu deinem/seinem Volk versammelt“ bleibt im Haupttext erhalten.
  alternative: „zu deinen/seinen Vorfahren versammelt“ oder „mit deinen/seinen Angehörigen im Tod vereint“
  rationale: Die hebräische Formel bezeichnet den Tod, kann aber mehr anklingen lassen als Bestattung oder biologische Abstammung. Die wörtlich nahe Wiedergabe bewahrt diese Spannung und legt den Ausdruck nicht konfessionell fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Imperativ und die wiederholte Sterbeformel des Hebräischen werden bewahrt; unnötige Wörtlichkeit bei שָׁמָּה wird durch eine natürliche deutsche Zielkonstruktion vermieden.
