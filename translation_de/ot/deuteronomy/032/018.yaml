base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: de
  text: Den Fels, der dich zeugte[b], hast du missachtet[a], und Gott, der dich gebar[c], hast du vergessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »missachtet« wiedergegebene hebräische Verb ist in seiner Bedeutung unsicher; auch möglich sind »vernachlässigt«, »vergessen« oder »nicht beachtet«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der dich hervorbrachte«. Das hebräische Verb bewahrt hier das Bild des Zeugens.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »der dich zur Welt brachte«. Im Hebräischen steht ein Bild aus dem Geburtsgeschehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: der Fels
  rationale: Das Substantiv bedeutet wörtlich »Fels« und dient im Lied als bildhafter Gottestitel. Die Großschreibung bewahrt sowohl das konkrete Bild als auch die Titelfunktion.
- source_word: יְלָדְךָ
  choice: der dich zeugte
  rationale: Das Verb ילד kann im Qal das Zeugen beziehungsweise Hervorbringen bezeichnen. »Zeugte« erhält hier die väterliche Bildseite und bildet einen bewussten Kontrast zum Geburtsbild im zweiten Halbvers.
- source_word: תֶּשִׁי
  choice: hast du missachtet
  rationale: Die seltene und schwierige Verbform bezeichnet im Zusammenhang schuldhafte Nichtbeachtung. »Missachtet« wahrt die Parallelität zu »vergessen«, ohne beide Aussagen gleichzusetzen.
- source_word: וַתִּשְׁכַּח
  choice: hast du vergessen
  rationale: שכח bedeutet hier eindeutig »vergessen«. Die wiederholte Verbklammer ist im Deutschen natürlich und erhält die poetische Parallelstruktur.
- source_word: אֵל
  choice: Gott
  rationale: אל bezeichnet hier Israels Gott und steht parallel zu »der Fels«. Im Deutschen ist »Gott« ohne Artikel die natürlichste eindeutige Bezeichnung.
- source_word: מְחֹלְלֶךָ
  choice: der dich gebar
  rationale: Die Form von חול verwendet das Bild der Wehen beziehungsweise des Gebärens. »Gebar« bewahrt dieses auffällige mütterliche Geburtsbild knapp und unmittelbar.
theological_decisions:
- issue: Elterliche Bildsprache für Gott
  choice: Die väterliche Vorstellung des Zeugens und die mütterliche Vorstellung des Gebärens bleiben nebeneinander im Haupttext stehen.
  alternative: Die Bilder durch allgemeinere Schöpfungssprache wie »der dich schuf« oder »der dich hervorbrachte« angleichen.
  rationale: Der hebräische Text verbindet bewusst unterschiedliche elterliche Bilder. Eine Verallgemeinerung würde die poetische und theologische Spannung abschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Parallelität. Die markanten Bilder »Fels«, »zeugte« und »gebar« bleiben sichtbar; die wiederholte deutsche Verbklammer unterstützt Klarheit und Rhythmus.
