base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: de
  text: Sie opferten den Dämonen und nicht Gott, den Göttern, die sie nicht gekannt hatten, neuen Göttern, die erst kürzlich gekommen waren[b] und vor denen eure Väter nicht erschaudert hatten[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Gott“. Das Hebräische kann aussagen, dass diese Wesen keine wirklichen Götter sind; im Zusammenhang steht zugleich der Gegensatz zu Israels wahrem Gott im Vordergrund.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „neue, die von nahe kamen“. Die Wendung kann neu hinzugekommene oder kürzlich eingeführte Götter bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die eure Väter nicht gefürchtet hatten“ oder „vor denen eure Väter nicht gezittert hatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: sie opferten
  rationale: Das Qal von זבח bezeichnet das kultische Schlachten beziehungsweise Darbringen eines Opfers. „Sie opferten“ ist knapp, natürlich und bewahrt den kultischen Sinn.
- source_word: לַשֵּׁדִים
  choice: Dämonen
  rationale: שֵׁדִים bezeichnet dämonische Wesen. „Dämonen“ ist die klare, allgemein verständliche deutsche Entsprechung; eine Transliteration würde den Sinn verdunkeln.
- source_word: לֹא אֱלֹהַ
  choice: nicht Gott
  rationale: Der Singular אֱלֹהַ steht in einem polemischen Gegensatz zu den falschen Empfängern der Opfer. „Nicht Gott“ bewahrt sowohl die knappe hebräische Form als auch den möglichen Bezug auf den wahren Gott Israels.
- source_word: אֱלֹהִים
  choice: Göttern
  rationale: Der Plural steht appositionell zu „Dämonen“ und bezeichnet sie als die von Israel verehrten Götter, ohne ihre Göttlichkeit als wahr anzuerkennen.
- source_word: לֹא יְדָעוּם
  choice: die sie nicht gekannt hatten
  rationale: ידע mit Objektsuffix bedeutet hier „kennen“. Das Plusquamperfekt gibt den Rückblick aus der Perspektive des Liedes im Deutschen natürlich wieder.
- source_word: חֲדָשִׁים
  choice: neuen
  rationale: Das Adjektiv wird substantivisch beziehungsweise appositionell gebraucht. „Neuen“ erhält die Kürze des Hebräischen und bezieht sich eindeutig auf die zuvor genannten Götter.
- source_word: מִקָּרֹב בָּאוּ
  choice: die erst vor Kurzem aufgekommen waren
  rationale: Die Wortverbindung beschreibt hier am besten das neue beziehungsweise jüngste Auftreten dieser Götter. „Aufgekommen“ klingt im Deutschen bei neu eingeführten Kulten natürlicher als ein rein räumliches „nahe gekommen“.
- source_word: לֹא שְׂעָרוּם
  choice: vor denen … nicht erschauert waren
  rationale: Das seltene Verb שׂער trägt den Sinn des Schauderns oder Erbebens. „Erschauern“ bewahrt dieses konkrete Bild besser als das allgemeinere „fürchten“, ohne die Aussage unnötig auszudeuten.
- source_word: אֲבֹתֵיכֶם
  choice: eure Väter
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet Israels Vorväter. „Eure Väter“ erhält diese Form und den generationellen Kontrast.
theological_decisions:
- issue: Verhältnis von „Dämonen“ und „Göttern“
  choice: 'Beide Bezeichnungen werden in derselben Reihenfolge wiedergegeben: „Dämonen, nicht Gott, Göttern …“'
  alternative: „Götter“ nur als Erklärung von „Dämonen“ verstehen und zur Glättung auslassen; oder „Nichtgöttern“ schreiben.
  rationale: Der hebräische Text häuft bewusst שֵׁדִים und אֱלֹהִים an und bestreitet zugleich mit לֹא אֱלֹהַ ihre Gleichsetzung mit Gott beziehungsweise echter Gottheit. Die Wiedergabe beider Begriffe erhält diese polemische Spannung.
- issue: Deutung des singularischen אֱלֹהַ
  choice: „Gott“ mit Großschreibung
  alternative: „ein Gott“ oder „kein Gott“
  rationale: Im Zusammenhang des Moseliedes liegt der Gegensatz zwischen Israels Gott und den fremden Kultmächten nahe. Die Fußnote hält zugleich die grammatisch mögliche allgemeinere Bestreitung ihrer Göttlichkeit offen.
- issue: Art der Furcht in לֹא שְׂעָרוּם
  choice: „vor denen … nicht erschauert waren“
  alternative: „die eure Väter nicht gefürchtet hatten“
  rationale: Die konkretere Wiedergabe vermeidet es, das seltene Verb vorschnell als religiöse Verehrung oder bloße Angst festzulegen, und bewahrt seine körperlich-emotionale Bildhaftigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich dichte Apposition „Dämonen, nicht Gott, Göttern“ folgt bewusst der hebräischen Gedankenfolge. „Erschauert“ ist leicht gehoben, aber verständlich und bildet das seltene hebräische Verb genauer ab als eine rein abstrakte Furchtformulierung.
