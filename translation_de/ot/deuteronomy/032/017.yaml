revisions:
- from: Sie opferten Dämonen, nicht Gott[a], Göttern, die sie nicht gekannt hatten, neuen, die erst vor Kurzem aufgekommen waren[b] und vor denen eure Väter nicht erschauert waren[c].
  to: Sie opferten den Dämonen und nicht Gott, den Göttern, die sie nicht gekannt hatten, neuen Göttern, die erst kürzlich gekommen waren[b] und vor denen eure Väter nicht erschaudert hatten[c].[a]
  rationale: Die Revision korrigiert die fehlerhafte Verbform, ersetzt die stärker ausdeutende Formulierung „aufgekommen“ durch das quellennähere „gekommen“ und glättet die deutsche Reihung der Appositionen ohne die wiederholte hebräische Benennung als Dämonen und Götter auszulassen. Die Fußnoten sind sprachlich und semantisch präzisiert. Die Fußnotenmarke a steht am Satzende, weil sie die übergreifende Deutung der Negation „nicht Gott“ erläutert; b und c bleiben an ihren jeweiligen Ausdrücken verankert.
