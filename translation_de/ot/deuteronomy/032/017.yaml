    issue: „vor denen eure Väter nicht erschauert waren“ ist grammatisch fehlerhaft.
    rationale: „Erschauern/erschaudern“ bildet das Perfekt mit „haben“, nicht mit „sein“. Der vorzeitige Bezug verlangt hier „nicht erschaudert hatten“.
  - severity: medium
    issue: „aufgekommen waren“ deutet die Aussage stärker als nötig aus.
    rationale: בָּאוּ bedeutet primär „kamen“. Im Kontext kann מִקָּרֹב zeitlich „kürzlich“ meinen, aber „gekommen waren“ bewahrt die Bildlichkeit und vermeidet die zusätzliche Vorstellung eines sich entwickelnden Kultes.
  - severity: medium
    issue: Die Fußnote a bietet „keinem Gott“ als Alternative.
    rationale: Als alternative Deutung von לֹא אֱלֹהַ ist im Deutschen „kein Gott“ idiomatisch und sachlich passend; „keinem Gott“ wäre ein Dativobjekt und erläutert die hebräische Prädikation nicht präzise.
  - severity: low
    issue: Die Fußnote b formuliert „aus der Nähe“ zu stark als wörtliche Wiedergabe.
    rationale: Die Wendung ist semantisch nicht völlig unstrittig; eine vorsichtige Paraphrase und die zeitliche Kontextdeutung bewahren die Ambiguität besser.
