  source_fidelity: Die Übersetzung trifft die Herkunftsmetapher mit „Weinstock“ sowie רֹאשׁ vorsichtig und angemessen als „Gift“/„giftig“. אַשְׁכְּלֹת bezeichnet jedoch Traubenbüschel bzw. -trauben, nicht einzelne „Beeren“. Die Formulierung „bitter für sie“ bildet לָמוֹ zwar formal ab, ist im Deutschen aber semantisch unklar; die Wendung kann idiomatisch als Zugehörigkeits- bzw. Besitzbezug wiedergegeben werden.
  naturalness: Der Satzbau ist modern und klar. „Bittere Traubenbüschel sind ihnen zu eigen“ wahrt das poetisch-verdichtete Register, gibt den Bezug von לָמוֹ verständlich wieder und vermeidet die missverständliche Aussage, die Früchte seien für die betreffenden Personen bitter.
  terminology: „Weinstock“, „Sodom“, „Gomorra“, „Trauben“ und „Gifttrauben“ sind registergerecht. „Traubenbüschel“ korrigiert die Bedeutung von אַשְׁכְּלֹת und erhält die Bildsprache.
