base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: de
  text: Denn ihr Weinstock stammt vom Weinstock Sodoms und von den Feldern Gomorras. Ihre Trauben sind Gifttrauben, bittere Traubenbüschel sind ihnen zu eigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: Weinstock / ihr Weinstock
  rationale: Das konkrete Bild des hebräischen Textes wird bewahrt; „stammt von“ gibt die Herkunftsangabe mit מִן natürlich wieder.
- source_word: עִנְּבֵי רוֹשׁ
  choice: giftige Trauben
  rationale: רֹאשׁ bezeichnet hier eine giftige beziehungsweise bittere Pflanze oder deren Giftwirkung; „giftige Trauben“ bewahrt das Bild, ohne eine unsichere Pflanzenart festzulegen.
- source_word: אַשְׁכְּלֹת
  choice: Beeren
  rationale: Das Wort bezeichnet eigentlich Traubenbüschel; im parallelen Bild ergibt „ihre Beeren“ ein natürliches Deutsch und vermeidet die schwerfällige Wiederholung „ihre Traubenbüschel“.
- source_word: מְרֹרֹת לָמוֹ
  choice: bitter für sie
  rationale: Die feminine Pluralform bezieht sich auf die zuvor genannten Trauben beziehungsweise Beeren; לָמוֹ wird ausdrücklich mit „für sie“ wiedergegeben.
theological_decisions:
- issue: Bezug des Bildes von Sodom und Gomorra
  choice: Die metaphorische Aussage bleibt ohne erklärende Identifikation stehen.
  alternative: Den Weinstock ausdrücklich als Herkunft oder Wesen eines bestimmten Volkes deuten.
  rationale: Der Vers selbst entfaltet das Gerichtswort bildhaft; eine nähere Identifikation wäre aus dem Kontext zu erschließen und sollte nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus wird durch zwei ausgewogene Sätze erhalten; die drastische Bildsprache bleibt unverharmlost.
