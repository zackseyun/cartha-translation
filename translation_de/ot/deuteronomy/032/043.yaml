  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: de
  text: Jubelt[a], ihr Völker, zusammen mit seinem Volk! Denn er wird das Blut seiner Diener rächen; an seinen Bedrängern wird er Vergeltung üben, und er wird für sein Land und sein Volk Sühne leisten.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Singt vor Freude“. Der hebräische Imperativ kann lauten Jubel oder freudiges Singen bezeichnen. Der knappe hebräische Wortlaut wird unterschiedlich gedeutet; möglich ist auch: „Lasst sein Volk jubeln, ihr Völker!“'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Die griechische Septuaginta und eine Schriftrolle vom Toten Meer überliefern eine längere Fassung dieses Verses. Sie enthält zusätzliche Aufrufe an den Himmel beziehungsweise an göttliche Wesen, sich zu freuen, und an die Völker, Gott zu verehren. Der Haupttext folgt dem masoretischen Hebräisch.
    reason: textual_variant
  - marker: c
    text: 'Oder: „und er wird sein Land und sein Volk reinigen/entsühnen“. Das hebräische Verb kann sowohl den Gedanken der Sühne als auch den der Reinigung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Jubelt
  rationale: Der Imperativ von רנן bezeichnet lauten, freudigen Jubel und kann auch freudiges Singen einschließen. „Jubelt“ bewahrt diese hörbare, poetische Nuance besser als das allgemeinere „Freut euch“.
- source_word: גוֹיִם
  choice: Völker
  rationale: Im internationalen, kollektiven Sinn ist „Völker“ die natürliche deutsche Wiedergabe; „Heiden“ wäre hier unnötig religiös vorgeprägt.
- source_word: עַמּוֹ
  choice: zusammen mit seinem Volk
  rationale: 'Der masoretische Text ist syntaktisch knapp. „Zusammen mit“ gibt die wahrscheinlichste Beziehung wieder: Die Völker sollen gemeinsam mit Gottes Volk jubeln, ohne den längeren Text anderer Überlieferungen in den Haupttext aufzunehmen.'
- source_word: דַם עֲבָדָיו
  choice: das Blut seiner Diener
  rationale: עבד kann „Diener“ oder „Sklave“ bedeuten. Hier steht ihre Zugehörigkeit zu Gott und ihr vergossenes Blut im Vordergrund; deshalb ist „Diener“ kontextgemäß.
- source_word: יִקּוֹם
  choice: rächen
  rationale: In Verbindung mit vergossenem Blut bezeichnet נקם dessen Ahndung; „das Blut … rächen“ ist im Deutschen prägnant und idiomatisch.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: an seinen Bedrängern wird er Vergeltung üben
  rationale: Die Wendung enthält ausdrücklich נָקָם, „Vergeltung/Rache“, und ישיב, wörtlich „zurückgeben/erwidern“. Die deutsche Formulierung erhält den Vergeltungsgedanken und ordnet die mit לְ bezeichneten Gegner nicht fälschlich als direktes Objekt ein.
- source_word: צָרָיו
  choice: seine Bedränger
  rationale: צרים bezeichnet feindliche Gegner, die bedrängen. „Bedränger“ wahrt die konkrete feindselige Nuance und passt zum gehobenen poetischen Register.
- source_word: וְכִפֶּר
  choice: wird … Sühne schaffen
  rationale: כפר kann sühnende, entsühnende oder reinigende Wirkung bezeichnen. „Sühne schaffen für“ bewahrt das theologische Gewicht und bleibt im Deutschen verständlich; die mögliche Reinigungsnuance wird in einer Fußnote genannt.
- source_word: אַדְמָתוֹ עַמּוֹ
  choice: sein Land und sein Volk
  rationale: Die beiden aufeinanderfolgenden Ausdrücke werden im Deutschen natürlich koordiniert. „Land“ ist für אדמה in diesem national-bundestheologischen Zusammenhang angemessener als „Erdboden“.
theological_decisions:
- issue: Beziehung der Völker zu Gottes Volk im ersten Versglied
  choice: Die Völker werden aufgefordert, zusammen mit Gottes Volk zu jubeln.
  alternative: Die Völker sollen Gottes Volk bejubeln; oder der längere griechische und qumranische Text wird in den Haupttext aufgenommen.
  rationale: Der masoretische Wortlaut ist gedrängt und lässt die Beziehung unausgesprochen. Die komitative Ergänzung ist syntaktisch plausibel, wird jedoch wegen der echten Mehrdeutigkeit in der Fußnote kenntlich gemacht.
- issue: Bedeutung von כפר im Schlussglied
  choice: Gott schafft Sühne für sein Land und sein Volk.
  alternative: Gott reinigt oder entsühnt sein Land und sein Volk.
  rationale: Die Übersetzung wahrt den sühnenden Gehalt des Verbs, ohne die Art oder den Mechanismus dieser Sühne dogmatisch näher festzulegen. Die reinigende Bedeutungsdimension bleibt als Alternative sichtbar.
- issue: Textumfang des Verses
  choice: Der Haupttext folgt dem masoretischen hebräischen Text der WLC.
  alternative: Die längere Fassung der Septuaginta und von 4QDeutq mit zusätzlichen Aufrufen an Himmel beziehungsweise göttliche Wesen und zur Verehrung Gottes.
  rationale: Die angegebene Ausgangsausgabe ist die WLC. Die bedeutende ältere Variantenüberlieferung wird transparent in einer Fußnote dokumentiert, aber nicht mit dem masoretischen Haupttext vermischt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Klang. Der Vokativ wird ohne altertümliches „o“ wiedergegeben. „Jubelt“, „Vergeltung“ und „Sühne schaffen“ erhalten die feierliche Dichte des Liedes, bleiben aber für heutige Leser verständlich. Die Fußnotenmarker stehen jeweils an der inhaltlich einschlägigen Stelle im Haupttext.
