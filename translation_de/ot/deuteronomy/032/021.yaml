source:
  edition: WLC
  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: de
  text: Sie haben mich eifersüchtig gemacht mit dem, was kein Gott ist; sie haben mich zum Zorn gereizt mit ihren nichtigen Götzen.[a] So werde auch ich sie eifersüchtig machen durch die, die kein Volk sind;[b] durch eine törichte Nation[c] werde ich sie zum Zorn reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „mit ihren Nichtigkeiten“ oder „mit ihren leeren Dingen“. Das hebräische Wort bezeichnet Hauch, Leere oder Nichtigkeit und meint hier wohl Götzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „durch ein Nicht-Volk“. Das Hebräische bildet bewusst eine Parallele zu „was kein Gott ist“.'
    reason: lexical_alternative
  - marker: c
    text: „Töricht“ bezeichnet hier vor allem moralische und geistliche Verkehrtheit, nicht lediglich mangelnde Intelligenz.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: sie haben mich eifersüchtig gemacht
  rationale: Bewahrt die Bedeutung des Verbs קנא und die bewusst spiegelbildliche Beziehung zu אַקְנִיאֵם in der zweiten Vershälfte.
- source_word: בְּלֹא אֵל
  choice: mit dem, was kein Gott ist
  rationale: Gibt die polemische Verneinung klar wieder, ohne לֹא אֵל vorschnell mit einem bestimmten Götzen oder einer theologischen Deutung gleichzusetzen.
- source_word: כִּעֲסוּנִי
  choice: sie haben mich zum Zorn gereizt
  rationale: Die kausative Bedeutung von כעס wird natürlich und würdevoll wiedergegeben.
- source_word: בְּהַבְלֵיהֶם
  choice: mit ihren nichtigen Götzen
  rationale: Verbindet den kontextuellen Bezug auf Götzen mit der Grundnuance von הֶבֶל als Nichtigkeit, Leere oder Hauch.
- source_word: אַקְנִיאֵם
  choice: werde auch ich sie eifersüchtig machen
  rationale: Spiegelt das erste Verb des Verses und erhält die vergeltende Symmetrie.
- source_word: בְּלֹא עָם
  choice: durch die, die kein Volk sind
  rationale: Bewahrt die auffällige Parallele zu ‚was kein Gott ist‘ und bleibt im Deutschen verständlich; ‚durch‘ bezeichnet hier das Mittel des Handelns.
- source_word: בְּגוֹי נָבָל
  choice: durch eine törichte Nation
  rationale: נָבָל bezeichnet hier moralisch-geistliche Torheit und nicht bloß geringe Intelligenz; ‚Nation‘ entspricht גּוֹי und vermeidet eine Angleichung an עָם.
- source_word: אַכְעִיסֵם
  choice: werde ich sie zum Zorn reizen
  rationale: Bewahrt den Kausativ und die Wiederaufnahme von כִּעֲסוּנִי.
theological_decisions:
- issue: Bezug von ‚kein Volk‘ und ‚törichte Nation‘
  choice: Im Haupttext allgemein belassen
  alternative: Als bestimmtes nichtisraelitisches Volk oder als die Völker insgesamt identifizieren
  rationale: Der hebräische Text nennt keine konkrete Nation. Die allgemeine Wiedergabe erhält die Spannung und vermeidet, eine spätere Auslegung in den Wortlaut einzutragen.
- issue: Bedeutung von Gottes Eifersucht
  choice: Mit ‚eifersüchtig‘ wiedergeben
  alternative: Mit ‚zum Eifer reizen‘ oder ‚meinen Eifer wecken‘ wiedergeben
  rationale: Die gewählte Form erhält die lexikalische und rhetorische Entsprechung beider Vershälften, ohne den göttlichen Affekt näher systematisch zu erklären.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Wiederholungen und spiegelbildlichen Satzstrukturen des Hebräischen werden möglichst erhalten. „Nichtige Götzen“ macht sowohl den konkreten Bezug als auch die Wertung von הבל sichtbar; die Fußnote dokumentiert die wörtlicheren Möglichkeiten.
