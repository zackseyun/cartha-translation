  source_fidelity: 'Der Entwurf gibt die syntaktische und rhetorische Spiegelung des Hebräischen zuverlässig wieder: קנא und die beiden Formen von כעס erscheinen jeweils entsprechend in beiden Vershälften. „Was kein Gott ist“ bildet לֹא־אֵל angemessen ab; „die, die kein Volk sind“ bewahrt die absichtlich anstößige Parallele von לֹא־עָם. Die instrumentale Wiedergabe von בְּ mit „mit“ bzw. „durch“ ist im Kontext sachgerecht. „Nichtige Götzen“ verbindet die Grundbedeutung von הֶבֶל mit dem im Kontext naheliegenden Götzenbezug, ohne eine konkrete historische Identifikation für das „Nicht-Volk“ oder die „törichte Nation“ einzutragen.'
