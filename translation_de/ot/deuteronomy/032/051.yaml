source:
  edition: WLC
  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: de
  text: weil ihr mitten unter den Israeliten[a] treulos gegen mich gehandelt habt, bei den Wassern von Meriba-Kadesch[b] in der Wüste Zin, weil ihr mich mitten unter den Israeliten nicht als heilig erwiesen habt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mitten unter den Söhnen Israels“; ebenso am Ende des Verses.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „bei den Wassern von Meriba bei Kadesch“; wörtlicher: „bei den Wassern des Streits von Kadesch“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „mich nicht geheiligt“ oder „meine Heiligkeit nicht hochgehalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: ihr treulos gegen mich gehandelt habt
  rationale: מעל bezeichnet einen schweren Treuebruch, oft mit bundesbezogenem Klang. Mit מעל kennzeichnet ב die betroffene Partei; „gegen mich“ ist dafür idiomatisches Deutsch.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mitten unter den Israeliten
  rationale: בְּתוֹךְ bedeutet „inmitten/unter“. „Israeliten“ ist im modernen Deutschen die natürliche ethnische Bezeichnung; „mitten unter“ bewahrt zugleich die räumlich-öffentliche Nuance und wird bei beiden Vorkommen gleich wiedergegeben.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: bei den Wassern von Meriba-Kadesch
  rationale: Die Verbindung bezeichnet den Ort beziehungsweise das erinnerte Ereignis. Die Umschrift bewahrt den Eigennamencharakter; die mögliche appellativische Bedeutung von מְרִיבָה wird in der Fußnote genannt.
- source_word: מִדְבַּר צִן
  choice: in der Wüste Zin
  rationale: „Wüste Zin“ ist die geläufige und sachlich passende deutsche geografische Wiedergabe.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: ihr mich … nicht als heilig erwiesen habt
  rationale: Das Piel von קדשׁ bezeichnet hier, Gottes Heiligkeit öffentlich zur Geltung zu bringen. „Als heilig erweisen“ bleibt verständlich und vermeidet den missverständlichen Eindruck, Gott müsse erst heilig gemacht werden.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Wendung lautet formal „Söhne Israels“, fungiert hier jedoch als feste Volksbezeichnung. „Israeliten“ gibt ihren Referenzumfang im modernen Standarddeutsch natürlich wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
- issue: Wiedergabe von קִדַּשְׁתֶּם אֹתִי
  choice: mich als heilig erwiesen
  alternative: mich geheiligt / meine Heiligkeit hochgehalten
  rationale: Die Formulierung beschreibt das Versäumnis von Mose und Aaron, Gottes Heiligkeit öffentlich vor Israel sichtbar anzuerkennen; sie unterstellt keinen Mangel an Gottes eigener Heiligkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als kausaler Nebensatz formuliert, weil er syntaktisch an den vorausgehenden Urteilsspruch anschließt. Die zweimalige Formulierung „mitten unter den Israeliten“ bildet die hebräische Wiederholung ab.
