  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: de
  text: Denn ein Feuer ist in meinem Zorn entbrannt; es brennt bis in die tiefste Scheol[a], verzehrt die Erde und ihren Ertrag und setzt die Grundfesten der Berge in Flammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis in die Tiefen der Scheol«. Wörtlich: »bis zur Scheol, der tiefsten/untersten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Gerichtsankündigung ein und bewahrt den Zusammenhang natürlich.
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: ein Feuer ist in meinem Zorn entbrannt
  rationale: Gibt das Bild eines entzündeten Feuers und die idiomatische Bedeutung von אַף als Zorn klar und würdig wieder.
- source_word: וַתִּיקַד
  choice: es brennt
  rationale: Führt das Feuerbild direkt fort, ohne eine im Verb nicht ausdrücklich enthaltene Verstärkung hinzuzufügen.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: bis in die tiefste Scheol
  rationale: Bewahrt Scheol als Bezeichnung des Totenreichs; תַּחְתִּית wird als Superlativ beziehungsweise tiefster Bereich verstanden.
- source_word: וַתֹּאכַל אֶרֶץ וִיבֻלָהּ
  choice: verzehrt die Erde und ihren Ertrag
  rationale: „Verzehrt“ erhält die anschauliche Metapher des fressenden Feuers; „Ertrag“ bezeichnet umfassend, was die Erde hervorbringt.
- source_word: וַתְּלַהֵט מוֹסְדֵי הָרִים
  choice: setzt die Grundfesten der Berge in Flammen
  rationale: Gibt die intensive Feuerwirkung und das Bild der tiefsten tragenden Bereiche der Berge anschaulich wieder.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: „Scheol“ bewahrt die alttestamentliche Bezeichnung und legt sie nicht vorschnell auf das Grab oder auf spätere Vorstellungen von Hölle fest.
- issue: Deutung von תַּחְתִּית
  choice: die tiefste
  alternative: die unterste; die Tiefe der
  rationale: Die Form bezeichnet hier die äußerst tiefe beziehungsweise unterste Scheol. Die gewählte Fassung erhält die Steigerung, während die Fußnote die syntaktische Alternative sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Bildkraft. „Grundfesten“ ist bewusst gehoben, aber allgemein verständlich und entspricht dem kosmischen Bild des hebräischen Gedichts.
