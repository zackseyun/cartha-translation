  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: de
  text: Vom Hunger ausgezehrt, von Seuche und bitterem Verderben verzehrt; ich lasse die Zähne der Tiere gegen sie los, dazu das Gift der im Staub kriechenden Tiere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: vom Hunger ausgezehrt
  rationale: מְזֵי bezeichnet einen entkräfteten, abgezehrten Zustand. רָעָב kann Hunger oder Hungersnot meinen; die knappe deutsche Form bewahrt die körperliche Wirkung und lässt den Umfang der Not offen.
- source_word: וּלְחֻמֵי רֶשֶׁף
  choice: von Seuche ... verzehrt
  rationale: לְחֻמֵי ist eine seltene passive Bildung mit dem Bild des Aufgefressen- oder Verzehrtwerdens. רֶשֶׁף bezeichnet hier am ehesten eine brennende, todbringende Seuche; die Wiedergabe als Gattungsbegriff passt zur Reihe der Gerichte.
- source_word: וְקֶטֶב מְרִירִי
  choice: und bitterem Verderben
  rationale: קֶטֶב meint eine vernichtende Plage beziehungsweise Zerstörung; מְרִירִי verstärkt sie als bitter oder grausam. „Bitteres Verderben“ erhält das poetische Bild und vermeidet eine Doppelung von „Seuche“.
- source_word: וְשֶׁן בְּהֵמוֹת
  choice: die Zähne wilder Tiere
  rationale: שֵׁן bedeutet wörtlich „Zahn“ und kann kollektiv stehen. בְּהֵמוֹת ist allgemein „Tiere“; „wild“ macht im Deutschen die bedrohliche Funktion deutlich, ohne die Tierart einzuengen.
- source_word: אֲשַׁלַּח בָּם
  choice: lasse ... gegen sie los
  rationale: Die Konstruktion bezeichnet das feindliche Entsenden gegen die Betroffenen. „Gegen sie loslassen“ ist natürliches Deutsch und wahrt die Gerichtsaussage.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: das Gift der im Staub kriechenden Tiere
  rationale: חֵמָה kann Hitze, Zorn oder Gift bedeuten; bei Kriechtieren ist „Gift“ sachlich naheliegend. זֹחֲלֵי עָפָר bleibt bewusst weiter als „Schlangen“ und bewahrt das Staubbild.
theological_decisions:
- issue: Möglicher mythologischer Hintergrund von רֶשֶׁף
  choice: Als Gattungsbegriff „Seuche“ wiedergegeben.
  alternative: Der Eigenname „Reschef“ oder „brennendes Fieber“.
  rationale: Im unmittelbaren Zusammenhang gehört das Wort zu einer poetischen Reihe göttlicher Gerichte. Ein Eigenname ist möglich, aber nicht erforderlich; die Übersetzung soll keine mythologische Deutung in den Haupttext eintragen.
- issue: חֲמַת als „Gift“ oder „Zorn“
  choice: „Gift“
  alternative: „Zorn“ beziehungsweise „Glut“.
  rationale: Die Verbindung mit im Staub kriechenden Tieren legt deren Gift nahe. Die Gerichtsdimension bleibt durch Gottes angekündigtes Loslassen der Gefahren erhalten.
translation_notes:
  register: Dichterisch verdichtetes, würdiges Standarddeutsch. Die parallelen Passivformulierungen und die konkreten Bilder von Zähnen, Gift und Staub spiegeln den hebräischen Gerichtsgesang; unnötig medizinische oder mythologische Festlegungen werden vermieden.
