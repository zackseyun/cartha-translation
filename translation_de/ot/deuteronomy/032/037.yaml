  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: de
  text: 'Und er wird sagen: „Wo sind ihre Götter, der Fels, in dem sie Zuflucht suchten?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Fels, in ihm suchten sie Zuflucht“. Das singularische „Fels“ steht erläuternd neben dem pluralischen „ihre Götter“.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Und er wird sagen
  rationale: Das Qal Perfekt 3. Person Singular mit vorangestelltem וְ wird im poetischen Zusammenhang als zukünftige Fortführung der angekündigten Rede verstanden. „Und“ bewahrt die hebräische Verknüpfung.
- source_word: אֵי
  choice: Wo sind
  rationale: Die Fragepartikel bedeutet „wo?“. Das Prädikat richtet sich im Deutschen nach dem pluralisch verstandenen „ihre Götter“.
- source_word: אֱלֹהֵימוֹ
  choice: ihre Götter
  rationale: Die pluralische Konstruktform mit Suffix der 3. Person maskulin Plural bezeichnet hier die Gottheiten, auf die sie ihr Vertrauen setzten.
- source_word: צוּר
  choice: der Fels
  rationale: Das konkrete Bild „Fels“ bleibt erhalten. Es steht appositionell zu „ihre Götter“ und bezeichnet den vermeintlichen Schutz; die Kleinschreibung vermeidet eine Verwechslung mit der Bezeichnung des HERRN als „Fels“ an anderen Stellen des Liedes.
- source_word: חָסָיוּ
  choice: sie Zuflucht suchten
  rationale: חסה bezeichnet das Suchen von Schutz oder Zuflucht. Die Formulierung bewahrt das anschauliche Schutzmotiv.
- source_word: בּוֹ
  choice: bei dem
  rationale: Die Präposition ב mit maskulinem Singularsuffix bezieht sich auf „Fels“. „Bei dem“ ist im Deutschen eine natürliche Verbindung mit „Zuflucht suchen“, während die wörtlichere Wiedergabe „in dem“ weniger idiomatisch wäre.
theological_decisions:
- issue: Sprecherbezug und Zeitstufe
  choice: 'Die Aussage wird als zukünftige Rede des HERRN wiedergegeben: „Und er wird sagen“'
  alternative: „Und er sagte“ oder „Dann wird man sagen“
  rationale: Im Zusammenhang von Deuteronomium 32,36–38 liegt es nahe, dass der HERR als Sprecher fortfährt und künftig die Ohnmacht der fremden Götter bloßstellt. Die poetische Verbform lässt diese kontextbestimmte Zukunftsbedeutung zu.
- issue: Schreibung von „Fels“
  choice: „der Fels“ mit kleingeschriebenem Substantiv gemäß deutscher Orthografie, ohne besondere Hervorhebung als Gottesbezeichnung
  alternative: „der FELS“ oder eine anderweitig markierte Titelschreibung
  rationale: Hier bezieht sich צוּר unmittelbar auf „ihre Götter“, nicht auf den HERRN. Eine typografische Kennzeichnung als göttlicher Titel würde den beabsichtigten Gegensatz verwischen.
- issue: Numerusspannung zwischen „Götter“ und „Fels“
  choice: 'Die appositionelle Spannung bleibt stehen: „ihre Götter, der Fels“'
  alternative: „ihre Götter, die Felsen“ oder „der Fels, bei dem …“ als syntaktisch geglättete Umformung
  rationale: Der hebräische Text verbindet den pluralischen Ausdruck „ihre Götter“ mit dem singularischen „Fels“. Diese auffällige Formulierung soll nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und das konkrete Felsbild bleiben erhalten; die ungewöhnliche Numerusspannung des Hebräischen wird bewusst nicht geglättet.
