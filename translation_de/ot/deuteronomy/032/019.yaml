  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: de
  text: Und Jahwe sah und verwarf sie wegen der Provokation durch seine Söhne und Töchter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verschmähte sie« oder »behandelte sie mit Verachtung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Bundesname Gottes wird in der im Deutschen üblichen wissenschaftlich-biblischen Form wiedergegeben.
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Qal von ראה hat hier seine gewöhnliche Bedeutung »sehen« und leitet Jahwes Reaktion auf das zuvor geschilderte Verhalten ein.
- source_word: וַיִּנְאָץ
  choice: verwarf sie
  rationale: נאץ bezeichnet ein verächtliches Zurückweisen oder Verschmähen. »Verwarf sie« bewahrt die Schärfe und den Beziehungsbruch; das im Hebräischen unausgedrückte Objekt wird aus dem Kontext ergänzt.
- source_word: מִכַּעַס
  choice: aus Zorn über
  rationale: כעס kann Zorn, Verdruss oder die ihn auslösende Kränkung bezeichnen; מן lässt sich kausal verstehen. Die Formulierung ist natürlich und bewahrt, dass das Verhalten der Kinder Jahwes ablehnende Reaktion auslöst.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: seine Söhne und Töchter
  rationale: Die ausdrücklich männliche und weibliche Bezeichnung des Hebräischen wird beibehalten, statt sie zu »Kinder« zusammenzufassen.
theological_decisions:
- issue: Unausgedrücktes Objekt von וַיִּנְאָץ
  choice: Das Objekt wird als »sie« ergänzt und auf Jahwes Volk bezogen.
  alternative: 'Das Objekt unausgedrückt lassen: »Jahwe sah es und verwarf.«'
  rationale: Der Zusammenhang bestimmt das Volk als betroffenes Objekt; modernes Deutsch verlangt bei »verwerfen« normalerweise eine Ergänzung. Dadurch wird keine zusätzliche theologische Aussage eingeführt.
- issue: Bezug von מִכַּעַס
  choice: »aus Zorn über« gibt den kausalen Zusammenhang und Jahwes Zorn wieder.
  alternative: »wegen der Kränkung durch« oder »erzürnt durch«
  rationale: Die Wendung hält sowohl die göttliche Reaktion als auch ihren Anlass fest, ohne die Aussage abzuschwächen oder übermäßig zu verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Und« bewahrt den erzählerischen Anschluss; »Jahwe« gibt den Gottesnamen wieder. Das zusätzliche »es« nach »sah« verweist idiomatisch auf das zuvor geschilderte Geschehen, während »sie« das kontextuell vorausgesetzte Objekt von »verwarf« ausdrückt.
