revisions:
- from: Und Jahwe sah es und verwarf sie, aus Zorn über seine Söhne und Töchter.[a]
  to: Und Jahwe sah und verwarf sie wegen der Provokation durch seine Söhne und Töchter.[a]
  rationale: Das nicht im Ausgangstext ausgedrückte Objekt bei »sah« wurde entfernt. Die kausale Präpositionalphrase wurde so gefasst, dass sie die Provokation durch Jahwes Söhne und Töchter als Anlass seiner Reaktion ausdrückt, ohne den Text auf eine stärker ausgelegte Beschreibung von Gottes Zorn festzulegen. Die vorhandene Fußnote zu נאץ bleibt sachgerecht.
