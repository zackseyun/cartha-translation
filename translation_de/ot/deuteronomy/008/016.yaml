base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: de
  text: der dich in der Wüste mit Manna ernährte, das deine Väter nicht kannten, um dich zu demütigen, dich auf die Probe zu stellen und dir am Ende[a] Gutes zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »später«; wörtlich auch: »in deiner Zukunft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: der dich … ernährte
  rationale: Das Hifil-Partizip mit Suffix setzt die Beschreibung Gottes aus dem vorherigen Vers fort. Der deutsche Relativsatz ist natürlich und gibt den kausativen Sinn von אכל angemessen wieder.
- source_word: מָן
  choice: Manna
  rationale: Die im Deutschen etablierte Bezeichnung für die Speise während der Wüstenwanderung.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die geläufige biblische Entsprechung für מִדְבָּר und passt zum Exoduskontext.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: das deine Väter nicht gekannt hatten
  rationale: Der Relativsatz bezieht sich auf das Manna; das Plusquamperfekt verdeutlicht rückblickend, dass es den Vätern unbekannt gewesen war.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Die ausdrücklich maskuline hebräische Form wird formal bewahrt; im Kontext sind die Vorfahren Israels gemeint.
- source_word: לְמַעַן עַנֹּתְךָ וּלְמַעַן נַסֹּתֶךָ
  choice: um dich zu demütigen und auf die Probe zu stellen
  rationale: Die zweimalige Zweckangabe wird in flüssigem Deutsch zusammengezogen. „Demütigen“ bewahrt den pädagogischen Sinn von ענה, „auf die Probe stellen“ den von נסה.
- source_word: לְהֵיטִבְךָ
  choice: damit er dir … Gutes tue
  rationale: Die Form bezeichnet Gottes Absicht, Israel Gutes zu tun. Ein eigener Finalsatz macht den abschließenden, wohlwollenden Zweck klar.
- source_word: בְּאַחֲרִיתֶךָ
  choice: am Ende
  rationale: אַחֲרִית bezeichnet hier den späteren Ausgang beziehungsweise das letztliche Ergebnis. „Am Ende“ ist natürliches Deutsch; die mögliche Bedeutung „in deiner Zukunft“ wird in einer Fußnote erhalten.
theological_decisions:
- issue: Zweck der Entbehrung in der Wüste
  choice: Demütigung und Erprobung werden als zielgerichtetes Handeln Gottes dargestellt, das letztlich Israels Gutem dient.
  alternative: Die Demütigung und Erprobung könnten als ausschließlich strafende Maßnahmen verstanden werden.
  rationale: Die abschließende Zweckangabe לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ verbindet die Härte der Erziehung ausdrücklich mit einer guten Absicht. Die Übersetzung bewahrt diese Spannung, ohne die Härte abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die singularischen Anreden werden beibehalten. „Väter“ folgt der Form des hebräischen Textes; eine zusätzliche Fußnote ist hier nicht nötig, da der deutsche Ausdruck im biblischen Zusammenhang verständlich ist.
