base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: de
  text: Doch du sollst an Yahweh, deinen Gott, denken; denn er ist es, der dir die Kraft gibt, Wohlstand zu erwerben,[a] um seinen Bund zu bestätigen, den er deinen Vätern[b] geschworen hat, wie es heute der Fall ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vermögen zu schaffen“; weiter gefasst auch: „Erfolg zu haben“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind besonders die Vorväter des Bundes, die Erzväter.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „wie an diesem Tag“; die hebräische Wendung bedeutet hier etwa: „wie es heute der Fall ist“ oder „wie es heute erkennbar ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Doch du sollst … denken
  rationale: Die Form hat im mahnenden Zusammenhang gebietenden Charakter. „Doch“ nimmt den Gegensatz zur Selbstzuschreibung in Vers 17 auf; „an … denken“ ist für זכר mit אֶת natürliches modernes Deutsch.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, deinen Gott
  rationale: Der Gottesname wird als Eigenname wiedergegeben; die Apposition bewahrt die Bundesbeziehung in „deinen Gott“.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: denn er ist es, der dir … gibt
  rationale: „Denn“ gibt die Begründung wieder, während „er ist es“ das ausdrücklich gesetzte und hervorgehobene Pronomen הוּא abbildet. Das Partizip bezeichnet Gottes fortdauerndes bzw. charakteristisches Handeln.
- source_word: כֹּחַ
  choice: Kraft
  rationale: כֹּחַ bezeichnet Kraft, Fähigkeit oder Vermögen. „Kraft“ ist im Deutschen idiomatisch und lässt sowohl körperliche als auch umfassendere Befähigung zu.
- source_word: לַעֲשׂוֹת חָיִל
  choice: Wohlstand zu erwerben
  rationale: Im unmittelbaren Zusammenhang mit Vers 17 bezeichnet חָיִל materiellen Besitz beziehungsweise Wohlstand. „Erwerben“ gibt die Verbindung mit עשה idiomatisch wieder, ohne Gottes befähigende Rolle abzuschwächen.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  choice: um seinen Bund zu verwirklichen
  rationale: לְמַעַן drückt hier Zweck aus. Das Hiphil von קום kann „aufrichten, bestätigen, in Kraft setzen, verwirklichen“ bedeuten. „Verwirklichen“ hebt die geschichtliche Erfüllung des bereits zugesagten Bundes hervor und vermeidet den Eindruck, der Bund habe zuvor überhaupt nicht bestanden.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: den er deinen Vätern geschworen hat
  rationale: Die maskuline Pluralform wird bewahrt und verweist im Bundeszusammenhang besonders auf die Erzväter. Im Deutschen kann man einen Bund bzw. dessen Zusage jemandem schwören.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute sichtbar ist
  rationale: Die deuteronomische Wendung verweist auf die gegenwärtig erkennbare Bestätigung. Die Wiedergabe macht den Sinn des hebräischen Idioms in natürlichem Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Yahweh“ transliteriert ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חָיִל im Kontext
  choice: Wohlstand
  alternative: Vermögen; Erfolg
  rationale: Vers 17 spricht vom erworbenen Vermögen; daher ist hier die wirtschaftliche Bedeutung vorrangig. Die Fußnote bewahrt die mögliche weitere Bedeutungsbreite.
- issue: Bedeutung von הָקִים für den Bund
  choice: verwirklichen
  alternative: aufrichten; bestätigen; aufrechterhalten
  rationale: Die Form bezeichnet hier, dass Gott seinen Vätern geschworenen Bund geschichtlich zur Geltung bringt. „Verwirklichen“ hält die Spannung zwischen bereits gegebener Verheißung und gegenwärtiger Ausführung fest.
- issue: Referenz von אֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: „Väter“ entspricht der Form des Hebräischen und bewahrt den besonderen Bezug auf die Bundesväter, ohne ihn ausdrücklich auf eine einzige Auslegung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wahrt die nachdrückliche Begründung des Hebräischen, ohne unnötig altertümlich zu klingen. „Doch du sollst“ trägt den mahnenden Gegensatz des Zusammenhangs; die Fußnoten sichern lexikalische und idiomatische Alternativen.
