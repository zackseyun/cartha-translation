base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: de
  text: Deine Kleidung nutzte sich an dir nicht ab[a], und dein Fuß schwoll nicht an[b] – diese vierzig Jahre lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Gewand nutzte sich an dir nicht ab.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dein Fuß wurde nicht dick“; manche verstehen das Verb spezieller im Sinn von Blasenbildung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: deine Kleidung
  rationale: שִׂמְלָה bezeichnet ein Kleidungsstück, besonders ein Obergewand, kann hier aber kollektiv verstanden werden. „Kleidung“ ist im modernen Deutsch natürlich und vermeidet eine unnötige Verengung auf ein einzelnes Gewand.
- source_word: בָלְתָה
  choice: nutzte sich nicht ab
  rationale: Das Verb בלה bezeichnet das Alt- oder Verschlissenwerden. „Sich abnutzen“ gibt dies bei Kleidung idiomatisch und präzise wieder.
- source_word: מֵעָלֶיךָ
  choice: an dir
  rationale: Wörtlich steht „von auf dir“. Im Deutschen bringt „an dir“ natürlich zum Ausdruck, dass die Kleidung während des Tragens nicht verschliss.
- source_word: וְרַגְלְךָ
  choice: und dein Fuß
  rationale: Der hebräische Text verwendet den Singular. Dieser lässt sich im Deutschen verständlich und quellennah bewahren.
- source_word: בָצֵקָה
  choice: schwoll nicht an
  rationale: בצק wird hier traditionell im Sinn von Anschwellen verstanden. Die mögliche speziellere Deutung als Blasenbildung ist lexikalisch weniger sicher und wird daher in einer Fußnote genannt.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: diese vierzig Jahre lang
  rationale: Die hebräische Zeitangabe enthält ausdrücklich זֶה („diese/dies“). „Diese vierzig Jahre lang“ bewahrt diese demonstrative Nuance und ist zugleich klares, natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den hebräischen Singular und die demonstrative Zeitangabe. Der Gedankenstrich gliedert die abschließende Zeitangabe natürlich, ohne ihren Bezug zum gesamten Satz aufzulösen.
