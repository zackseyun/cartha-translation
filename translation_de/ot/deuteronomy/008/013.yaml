  text: וּ/בְקָֽרְ/ךָ֤ וְ/צֹֽאנְ/ךָ֙ יִרְבְּיֻ֔/ן וְ/כֶ֥סֶף וְ/זָהָ֖ב יִרְבֶּה לָּ֑/ךְ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ יִרְבֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/013.yaml
  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: de
  text: und deine Rinder und dein Kleinvieh sich vermehren, Silber und Gold sich bei dir mehren und alles, was dir gehört, zunimmt—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: und deine Rinder
  rationale: בקר bezeichnet kollektiv bovines Großvieh. »Rinder« ist im modernen Deutschen präzise und natürlich.
- source_word: וְצֹאנְךָ
  choice: und deine Schafe und Ziegen
  rationale: צאן bezeichnet Kleinvieh, insbesondere Schafe und Ziegen. Die ausdrückliche Wiedergabe vermeidet die im Deutschen mögliche Unklarheit von »Herden«.
- source_word: יִרְבְּיוּן
  choice: sich vermehren
  rationale: Das Verb רבה bezeichnet hier die zahlenmäßige Zunahme der Tiere; »sich vermehren« entspricht dem pluralischen Subjekt und ist idiomatisch.
- source_word: וְכֶסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die beiden Wertmetalle stehen im Hebräischen ohne eigenes Possessivpronomen; der Besitzbezug folgt durch לָךְ.
- source_word: יִרְבֶּה לָךְ
  choice: sich bei dir mehren
  rationale: »Bei dir« bewahrt den durch לָךְ ausgedrückten Bezug auf die angesprochene Person und klingt natürlicher als das wörtlichere »für dich«.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: und alles, was dir gehört
  rationale: Die Formulierung gibt die possessive Konstruktion vollständig und in natürlichem modernem Deutsch wieder.
- source_word: יִרְבֶּה
  choice: zunimmt
  rationale: Bei der umfassenden Zusammenfassung des Besitzes ist »zunimmt« idiomatischer als »sich vermehrt« und bewahrt den Sinn von רבה.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standardstil. Die fortlaufende Satzstruktur und der Gedankenstrich bleiben erhalten, weil der Vers syntaktisch Teil des größeren Warnsatzes ist. Der Besitzbezug bei Silber und Gold wird durch »bei dir« statt durch ein hinzugefügtes Possessivpronomen ausgedrückt.
