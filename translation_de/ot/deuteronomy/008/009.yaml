base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: de
  text: ein Land, in dem du Brot nicht in Armut[a] essen wirst und in dem dir nichts fehlen wird; ein Land, dessen Steine Eisen sind und aus dessen Bergen du Kupfer[b] gewinnen wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Dürftigkeit« oder »in Not«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann »Kupfer« oder »Bronze« bedeuten. Hier ist »Kupfer« vorzuziehen, weil von einem Rohstoff die Rede ist, der aus den Bergen gewonnen wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: in Armut
  rationale: Das Substantiv bezeichnet Armut, Mangel oder Bedürftigkeit. „In Armut“ bewahrt die konkrete soziale und materielle Notlage; die folgende Aussage, dass nichts fehlen wird, gibt den Gedanken des Mangels zusätzlich wieder.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung ist „Brot“. Obwohl das Wort weiter gefasst Nahrung bezeichnen kann, bleibt das anschauliche Bild im Deutschen verständlich.
- source_word: תֶחְסַר כֹּל
  choice: dir nichts fehlen wird
  rationale: Diese natürliche deutsche Wendung gibt die vollständige Versorgung und die verneinte Gesamtheit von כֹּל treffend wieder.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: dessen Steine Eisen sind
  rationale: Die knappe nominale Aussage des Hebräischen wird bewusst beibehalten. So bleibt das eindrückliche Bild erhalten, das vermutlich auf eisenhaltiges Gestein beziehungsweise Eisenerz verweist.
- source_word: תַּחְצֹב
  choice: hauen wirst
  rationale: Das Verb bedeutet „aushauen“ oder „brechen“. In Verbindung mit Bergen und Metall gibt „hauen“ die Gewinnung aus dem Gestein knapp wieder, ohne die moderne industrielle Vorstellung von „abbauen“ in den Vordergrund zu stellen.
- source_word: נְחֹשֶׁת
  choice: Kupfer
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Da hier ein aus Bergen gewonnener natürlicher Rohstoff gemeint ist, passt „Kupfer“ besser als die Legierung Bronze.
