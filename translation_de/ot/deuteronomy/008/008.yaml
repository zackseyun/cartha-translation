lexical_decisions:
- source_word: אֶרֶץ
  choice: ein Land mit
  rationale: Leitet in der appositionellen Aufzählung die Erzeugnisse des verheißenen Landes ein. „Mit“ klingt im modernen Deutschen natürlich und bewahrt den beschreibenden Sinn.
- source_word: חִטָּה
  choice: Weizen
  rationale: Die übliche und kontextuell eindeutige Bezeichnung der Getreideart.
- source_word: שְׂעֹרָה
  choice: Gerste
  rationale: Die übliche Bezeichnung; sie bildet mit „Weizen“ ein natürliches Paar.
- source_word: גֶּפֶן
  choice: Weinstöcke
  rationale: Der kollektive Singular bezeichnet den Weinstock als Kulturpflanze. Der Plural ist in einer deutschen Aufzählung natürlich und macht den Bezug zu Weintrauben deutlich, ohne auf die Früchte zu verengen.
- source_word: תְּאֵנָה
  choice: Feigenbäume
  rationale: Das hebräische Substantiv bezeichnet gewöhnlich den Feigenbaum und nicht nur dessen Frucht.
- source_word: רִמּוֹן
  choice: Granatäpfel
  rationale: Das Wort kann Frucht oder Baum bezeichnen. In der Aufzählung der Landeserzeugnisse ist „Granatäpfel“ idiomatisch und vermeidet eine unnötige Festlegung auf die Bäume.
- source_word: אֶרֶץ
  choice: ein Land mit
  rationale: Die Wiederholung wird beibehalten, um die rhetorische Gliederung und Hervorhebung des Hebräischen wiederzugeben.
- source_word: זֵית שֶׁמֶן
  choice: Olivenöl
  rationale: Die Konstruktverbindung verbindet „Olive“ und „Öl“. „Olivenöl“ gibt den gemeinten Ertrag im Deutschen klar und idiomatisch wieder.
- source_word: דְּבָשׁ
  choice: Honig
  rationale: „Honig“ ist die breite und traditionelle Grundbedeutung; in diesem Zusammenhang kann jedoch auch ein süßer Fruchtsirup, möglicherweise Dattelsirup, gemeint sein. Diese Alternative wird in der Fußnote bewahrt.
