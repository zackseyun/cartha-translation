translation:
  language: de
  text: ein Land mit Weizen und Gerste, mit Weinstöcken, Feigenbäumen und Granatäpfeln, ein Land mit Olivenöl und Honig[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Dattelsirup“. Das hebräische Wort kann in Beschreibungen der Erzeugnisse des Landes auch einen süßen Fruchtsirup bezeichnen.'
