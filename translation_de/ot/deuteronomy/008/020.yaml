  source_fidelity: 'Die Übersetzung bildet die hebräische Vergleichs- und Folgestruktur angemessen ab: כַּגּוֹיִם … כֵּן als „Wie … so …“, das Hifil-Partizip מַאֲבִיד als gegenwärtig/andauerndes „vernichtet“ und תֹאבֵדוּן als Zukunftsaussage „werdet … zugrunde gehen“. „Vor euch“ gibt מִפְּנֵיכֶם idiomatisch und kontextgerecht wieder. Die Wiedergabe von עֵקֶב mit „weil“ ist sachgemäß. Das Präsens in „weil ihr … hört“ ist für den allgemein formulierten Ungehorsam im Warnzusammenhang möglich und wahrt die im Hebräischen bestehende aspektuelle Offenheit.'
