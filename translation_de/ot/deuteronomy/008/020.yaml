base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: de
  text: Wie die Völker, die Jahwe vor euch vernichtet, so werdet auch ihr zugrunde gehen, weil ihr nicht auf die Stimme Jahwes, eures Gottes, hört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil ihr Jahwe, eurem Gott, nicht gehorcht“. Die hebräische Wendung bedeutet wörtlich „auf die Stimme Jahwes, eures Gottes, hören“ und schließt häufig den Gedanken des Gehorsams ein.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Wie die Völker
  rationale: כְּ leitet einen Vergleich ein; גּוֹיִם bezeichnet hier die Völker im Land. Die deutsche Korrespondenz „Wie … so …“ bildet die hebräische Struktur klar ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: מַאֲבִיד
  choice: vernichtet
  rationale: Das Hifil-Partizip von אבד bezeichnet ein verursachendes Zugrundegehen. Das Präsens wahrt den andauernden beziehungsweise bevorstehenden Vorgang.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die Wendung bedeutet wörtlich „von eurem Angesicht weg“ und bezeichnet hier die Beseitigung der Völker vor den vorrückenden Israeliten.
- source_word: תֹאבֵדוּן
  choice: werdet auch ihr zugrunde gehen
  rationale: Das Qal-Imperfekt kündigt Israels künftiges Verderben an. „zugrunde gehen“ bewahrt die inhaltliche Verbindung zum vorhergehenden אבד, ohne im Deutschen unnatürlich zu wirken; „auch ihr“ verdeutlicht die Vergleichskorrelation.
- source_word: עֵקֶב
  choice: weil
  rationale: Die Konjunktion führt den Grund beziehungsweise die Folgebegründung des angekündigten Gerichts ein.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: nicht auf die Stimme … hört
  rationale: Die Formulierung bewahrt das hebräische Bild des Hörens auf eine Stimme; im Kontext schließt es Gehorsam ein.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Der Ausdruck steht in Apposition zu Jahwe und bezeichnet eindeutig Israels einen Gott. Der Genitiv fügt sich natürlich in „die Stimme Jahwes, eures Gottes“ ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Umschrift „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf die Stimme … hören
  alternative: gehorchen
  rationale: Die wörtlichere Wendung erhält das Bundesmotiv des Hörens auf Gottes Stimme und lässt zugleich den im Idiom enthaltenen Sinn des Gehorsams erkennen. Die Fußnote nennt die dynamische Alternative.
- issue: Zeitbezug von לֹא תִשְׁמְעוּן
  choice: weil ihr nicht … hört
  alternative: weil ihr nicht … hören werdet
  rationale: Die hebräische Imperfektform kann im Warnzusammenhang gegenwärtig-allgemein beziehungsweise zukünftig verstanden werden. Das deutsche Präsens formuliert den begründenden Ungehorsam natürlich, ohne ihn entgegen der Form ausdrücklich in die Vergangenheit zu verlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur „Wie … so …“ und das Bundesmotiv des Hörens auf Gottes Stimme bleiben erhalten; schwerfällige Wörtlichkeit wird vermieden.
