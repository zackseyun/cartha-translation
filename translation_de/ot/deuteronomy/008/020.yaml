  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigenname wieder. „Die Stimme Jahwes, eures Gottes“ erhält sowohl die Apposition als auch die bildhafte Formulierung des Ausgangstextes. Die Fußnote erklärt zutreffend, dass die Wendung häufig Gehorsam einschließt, ohne diesen Sinn im Haupttext exklusiv festzulegen.
