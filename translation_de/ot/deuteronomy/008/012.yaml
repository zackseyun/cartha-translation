  text: dass du nicht etwa, wenn du gegessen hast und satt[a] bist, gute Häuser gebaut hast und darin wohnst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „völlig satt“. Das hebräische Verb kann körperliches Sattsein oder völliges Gesättigtsein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: damit du nicht
  rationale: Leitet eine Warnung ein, die syntaktisch in den folgenden Vers hineinreicht. Die Wendung bewahrt den warnenden Zweck- bzw. Vermeidungssinn, ohne den noch ausstehenden Hauptgedanken vorwegzunehmen.
- source_word: תֹּאכַל
  choice: wenn du gegessen hast
  rationale: Das Imperfekt steht hier in einer zukunftsbezogenen Warnungsfolge. Das deutsche Perfekt fügt sich natürlich in den mit „wenn“ eingeleiteten Nebensatz und stimmt mit den folgenden Handlungen überein.
- source_word: וְשָׂבָעְתָּ
  choice: und satt geworden bist
  rationale: Das Verb bezeichnet das Sattwerden beziehungsweise vollständige Gesättigtsein. „Satt geworden bist“ ist konkret, natürlich und wahrt den körperlichen Grundsinn.
- source_word: וּבָתִּים טוֹבִים
  choice: gute Häuser
  rationale: Gibt das einfache Qualitätsurteil von טוֹבִים unmittelbar wieder, ohne einen bestimmten Grad von Wohlstand oder Luxus hinzuzufügen.
- source_word: תִּבְנֶה
  choice: gebaut hast
  rationale: Das deutsche Perfekt stellt den Hausbau als im beschriebenen Wohlstandsszenario vollzogen dar und koordiniert ihn natürlich mit den übrigen Verben.
- source_word: וְיָשָׁבְתָּ
  choice: und darin wohnst
  rationale: ישׁב bedeutet hier „wohnen“. „Darin“ nimmt die Häuser idiomatisch wieder auf; diese Beziehung ist im Hebräischen durch den unmittelbaren Zusammenhang gegeben.
