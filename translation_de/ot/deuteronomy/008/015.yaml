  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: de
  text: der dich durch die große und furchterregende Wüste führte, mit Giftschlangen[a] und Skorpionen und dürrem, wasserlosem Land, und der für dich Wasser aus dem harten Feuersteinfelsen[b] hervorbrachte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »feurige Schlangen«; wahrscheinlich sind Schlangen gemeint, deren Biss ein brennendes Gefühl verursachte.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Feuerstein oder besonders hartes Gestein.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: der dich … führte
  rationale: Das Hifil-Partizip mit Suffix beschreibt im größeren Satz den HERRN und sein vergangenes Handeln; ein deutscher Relativsatz ist natürlich und kontextgerecht.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: durch die große und furchterregende Wüste
  rationale: „Durch“ gibt die geführte Wanderung wieder; „Wüste“ bezeichnet hier die unwirtliche Wildnis, und „furchterregend“ bewahrt die Wirkung von נוֹרָא in verständlichem Deutsch.
- source_word: נָחָשׁ שָׂרָף
  choice: Giftschlangen
  rationale: Die Verbindung bezeichnet Schlangen, deren Biss offenbar als brennend erlebt wurde. „Giftschlangen“ ist im Deutschen natürlich und gibt die konkrete Gefahr wieder; die traditionellere Wiedergabe wird in der Fußnote bewahrt.
- source_word: וְעַקְרָב
  choice: und Skorpione
  rationale: Direkte lexikalische Entsprechung; der Plural entspricht dem kollektiven Sinn der Aufzählung.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: und dürres Land ohne Wasser
  rationale: צִמָּאוֹן bezeichnet Durst beziehungsweise ausgedörrte Trockenheit. Zusammen mit dem Relativsatz ist „dürres Land ohne Wasser“ konkret, knapp und idiomatisch.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: der für dich Wasser … hervorbrachte
  rationale: Das Hifil-Partizip von יצא bezeichnet das Herauskommenlassen des Wassers. „Hervorbrachte“ bewahrt dieses Bild in gehobenem, aber verständlichem Deutsch.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: aus dem harten Kieselfelsen
  rationale: צוּר ist Fels, חַלָּמִישׁ bezeichnet harten Feuerstein beziehungsweise Kieselgestein. Die Wiedergabe macht sowohl das Gestein als auch dessen Härte deutlich.
theological_decisions:
- issue: Art der aufgezählten Gefahren in der Wüste
  choice: Die Gefahren werden als konkrete Gegebenheiten der Wüstenwanderung wiedergegeben.
  alternative: Die Schlangen oder übrigen Gefahren metaphorisch beziehungsweise allegorisch deuten.
  rationale: Der hebräische Text erinnert an Gottes geschichtliche Führung und Versorgung Israels; eine symbolische Deutung wird vom Vers nicht verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die partizipialen Gottesbezeichnungen werden als parallele Relativsätze wiedergegeben. Die Satzfortsetzung wird durch das abschließende Komma offengehalten.
