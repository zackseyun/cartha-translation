  terminology: „Wüste“, „furchterregend“, „Skorpione“ und „hervorbrachte“ passen gut. „Feuersteinfelsen“ ist gegenüber „Kieselfelsen“ die präzisere und verständlichere Wiedergabe von צוּר הַחַלָּמִישׁ. Die Fußnote zu den Schlangen bewahrt die lexikalische Unsicherheit angemessen.
