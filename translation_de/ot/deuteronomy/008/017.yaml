  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: de
  text: 'Dann wirst du in deinem Herzen sagen: »Meine Kraft und die Stärke meiner Hand haben mir diesen Wohlstand[a] verschafft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Vermögen«. Das hebräische Wort חַיִל kann je nach Zusammenhang Vermögen, Ressourcen, Stärke oder Leistungsfähigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Und du sagst
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht im Zusammenhang einer Warnung und lässt sich als künftig mögliche beziehungsweise vorausgesetzte Handlung verstehen. Das deutsche Präsens wahrt die Unmittelbarkeit und fügt sich natürlich in den Kontext ein.
- source_word: בִּלְבָבֶךָ
  choice: in deinem Herzen
  rationale: Die Formulierung bezeichnet inneres Denken oder Selbstgespräch. Die deutsche Wendung bewahrt das hebräische Bild und bleibt gut verständlich.
- source_word: כֹּחִי
  choice: meine Kraft
  rationale: כֹּחַ bezeichnet Kraft, Stärke oder Fähigkeit. »Kraft« ist im Deutschen natürlich und bildet zusammen mit der folgenden Wendung die Selbstzuschreibung eigener Leistungsfähigkeit ab.
- source_word: וְעֹצֶם יָדִי
  choice: und die Stärke meiner Hand
  rationale: עֹצֶם bezeichnet hier Stärke oder Macht. Die konkrete Metapher der Hand wird beibehalten, statt sie zu einer bloß abstrakten Fähigkeit aufzulösen.
- source_word: עָשָׂה לִי
  choice: haben mir … verschafft
  rationale: עָשָׂה bedeutet grundsätzlich »tun/machen«, bezeichnet hier mit לִי und dem Objekt jedoch das Hervorbringen beziehungsweise Erlangen des Wohlstands. »Verschafft« gibt diese kontextuelle Bedeutung idiomatisch wieder.
- source_word: הַחַיִל הַזֶּה
  choice: diesen Wohlstand
  rationale: חַיִל kann Vermögen, Ressourcen, Stärke oder Leistungsfähigkeit bezeichnen. Im Kontext von Deuteronomium 8, der von materieller Fülle handelt, trifft »Wohlstand« den Sinn, ohne den Ausdruck ausschließlich auf Geldbesitz zu verengen.
theological_decisions:
- issue: Bedeutung von חַיִל im Kontext der Bundeswarnung
  choice: Wohlstand
  alternative: Vermögen; Stärke; Leistungsfähigkeit
  rationale: Der unmittelbare Zusammenhang warnt Israel davor, die erfahrene materielle Fülle der eigenen Kraft zuzuschreiben. »Wohlstand« entspricht diesem Kontext und vermeidet zugleich eine unnötige Beschränkung auf militärische Macht oder bloßen Geldbesitz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herzmetapher und das konkrete Bild von der Stärke der Hand bleiben erhalten; die Wortstellung wurde für natürliches Deutsch angepasst.
