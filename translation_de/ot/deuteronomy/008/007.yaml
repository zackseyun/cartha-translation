source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: de
  text: Denn Jahwe, dein Gott, bringt dich in ein gutes Land, ein Land mit Wasserläufen[a], Quellen und tiefen Wassern[b], die in der Talebene und im Bergland[c] hervorströmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Bächen“ beziehungsweise „mit Wadis“; das hebräische Wort kann dauerhafte oder zeitweilige Wasserläufe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wassertiefen“; gemeint sein können tiefe oder unterirdische Wasservorkommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im Tal und auf dem Gebirge“ beziehungsweise „in der Ebene und in den Bergen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Ermahnung ein und bewahrt den Zusammenhang natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Entspricht der Bundesformel mit Suffix der zweiten Person Singular.
- source_word: מְבִיאֲךָ
  choice: bringt dich
  rationale: Das Partizip bezeichnet eine gegenwärtig vorgestellte oder unmittelbar bevorstehende Handlung; das deutsche Präsens wahrt diese Lebendigkeit.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: in ein gutes Land
  rationale: Die Präposition und das Bewegungsverb werden idiomatisch mit „in“ wiedergegeben; „gut“ bleibt bewusst unentfaltet.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: ein Land mit Wasserläufen
  rationale: נַחֲלֵי kann Bäche, zeitweilige Ströme oder Wadis bezeichnen. „Wasserläufe“ ist verständlich und hält den Oberbegriff offen.
- source_word: עֲיָנֹת
  choice: Quellen
  rationale: Bezeichnet natürliche Wasseraustritte; „Quellen“ ist die klare und übliche deutsche Entsprechung.
- source_word: וּתְהֹמֹת
  choice: und tiefen Wassern
  rationale: Bewahrt die Vorstellung von Wasser in der Tiefe, ohne vorschnell ausschließlich Grundwasser oder unterirdische Ströme anzunehmen.
- source_word: יֹצְאִים
  choice: hervorströmen
  rationale: Beschreibt Wasser, das hervortritt; „hervorströmen“ gibt Bewegung und Wasserbild idiomatisch wieder.
- source_word: בַּבִּקְעָה
  choice: in der Talebene
  rationale: בִּקְעָה kann ein Tal oder eine Ebene bezeichnen. „Talebene“ wahrt beide Aspekte und den Gegensatz zum Bergland.
- source_word: וּבָהָר
  choice: und im Bergland
  rationale: Der formale Singular הָר kann kollektiv das bergige Gelände bezeichnen; „Bergland“ ist dafür natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite des pluralischen Partizips יֹצְאִים
  choice: Relativsatz, der sich grammatisch auf Quellen und tiefe Wasser beziehen kann
  alternative: Bezug allein auf die tiefen Wasser oder auf die gesamte Aufzählung
  rationale: Die hebräische Konstruktion lässt die genaue Reichweite offen. Die deutsche Formulierung vermeidet eine ausdrücklich einschränkende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die topografischen und hydrologischen Begriffe bleiben anschaulich, ohne die Mehrdeutigkeit des Hebräischen unnötig festzulegen. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
