source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: de
  text: 'Wenn du aber Jahwe, deinen Gott, tatsächlich vergisst[a], anderen Göttern nachfolgst, ihnen dienst und dich vor ihnen niederwirfst, dann bezeuge ich heute gegen euch: Ihr werdet ganz gewiss zugrunde gehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vergessend vergisst du“ – eine hebräische Verstärkungsform im Sinn von „tatsächlich“ oder „ganz gewiss vergessen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Wenn du aber
  rationale: Leitet eine bedingte Warnung ein. Die deutsche Form gibt den Zusammenhang natürlich wieder, ohne die hebräische Wendung unnötig wörtlich nachzubilden.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: tatsächlich vergisst
  rationale: Der absolute Infinitiv mit dem finiten Verb verstärkt die Aussage. „Tatsächlich“ bewahrt den Nachdruck, ohne „vollständig“ in den Text hineinzulesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Form des Gottesnamens gibt das Tetragramm als Eigennamen wieder.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Die Anrede steht im maskulinen Singular und bezeichnet die Bundesbeziehung zu Israels Gott.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: anderen Göttern nachfolgst
  rationale: Die hebräische Wendung bezeichnet Nachfolge und Zugehörigkeit. „Nachfolgen“ ist im Deutschen natürlich und bewahrt dieses Bild.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: אֲחֵרִים bedeutet unmittelbar „andere“; „fremde“ wäre hier stärker deutend.
- source_word: וַעֲבַדְתָּם
  choice: ihnen dienst
  rationale: עבד bedeutet „dienen“. So bleibt der Ausdruck von dem folgenden Niederwerfen unterschieden.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: dich vor ihnen niederwirfst
  rationale: Das Verb bezeichnet das Niederwerfen als Huldigungs- oder Verehrungsgeste und bewahrt damit die körperliche wie kultische Bedeutung.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: bezeuge ich heute gegen euch
  rationale: Die Form hat hier rechtlich-feierliche Zeugniskraft. „Gegen euch“ gibt die nachteilige Bedeutung von בָכֶם im Zusammenhang wieder.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: Ihr werdet ganz gewiss zugrunde gehen
  rationale: Auch hier verstärkt ein absoluter Infinitiv das finite Verb. „Ganz gewiss“ bringt die starke Sicherheit zum Ausdruck; „zugrunde gehen“ bewahrt die resultative, nicht ausdrücklich passive Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen und ist dessen übliche deutsche Form.
- issue: Wechsel vom Singular zum Plural
  choice: Singular in der Bedingung, Plural in Zeugnis und Urteil
  alternative: Durchgehend Singular oder durchgehend Plural
  rationale: Der hebräische Text spricht zunächst den einzelnen Israeliten beziehungsweise Israel kollektiv im Singular an, wechselt aber bei „gegen euch“ und „ihr werdet zugrunde gehen“ ausdrücklich in den Plural. Dieser bedeutsame Spannungswechsel bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als ernste Bundeswarnung klar und gut verständlich; die parallelen Verben „nachfolgen“, „dienen“ und „sich niederwerfen“ werden nicht zu einem einzigen allgemeinen Begriff für Anbetung eingeebnet.
