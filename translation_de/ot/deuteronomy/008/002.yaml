source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: de
  text: 'Und denke an den ganzen Weg, den Jahwe, dein Gott, dich diese vierzig Jahre lang in der Wüste geführt hat, um dich zu demütigen und auf die Probe zu stellen, um zu erkennen[a], was in deinem Herzen war: ob du seine Gebote halten würdest oder nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „um offenzulegen, was in deinem Herzen war“. Wörtlich steht im Hebräischen „um zu erkennen“; diese Ausdrucksweise bleibt im Haupttext erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Und denke an
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im mahnenden Zusammenhang imperativische Kraft. „Denke an“ ist im heutigen Deutsch natürlicher und ebenso verbindlich wie eine Konstruktion mit „du sollst“.
- source_word: כָּל הַדֶּרֶךְ
  choice: den ganzen Weg
  rationale: דֶּרֶךְ bezeichnet hier sowohl den zurückgelegten Weg als auch den Verlauf der Wüstenwanderung. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: הֹלִיכֲךָ
  choice: dich … geführt hat
  rationale: Der Hifil von הלך drückt ein Führen beziehungsweise Gehenlassen aus. „Geführt hat“ gibt Gottes Leitung idiomatisch und quellennah wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Possessivform bewahrt die Sprache der Bundesbeziehung.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: diese vierzig Jahre lang
  rationale: „Lang“ kennzeichnet die Zeitdauer im Deutschen eindeutig und natürlich.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige deutsche Wiedergabe von מִדְבָּר in diesem Zusammenhang und umfasst die unwirtliche Wildnis der Wanderungszeit.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: um dich zu demütigen
  rationale: ענה bezeichnet hier ein Erniedrigen beziehungsweise Demütigen durch Entbehrung und entspricht dem unmittelbaren Zusammenhang in Deuteronomium 8.
- source_word: לְנַסֹּתְךָ
  choice: auf die Probe zu stellen
  rationale: נסה bezeichnet ein Prüfen oder Erproben. Die gewählte Wendung ist verständlich und bewahrt den prüfenden Charakter.
- source_word: לָדַעַת
  choice: um zu erkennen
  rationale: Die direkte Wiedergabe des Infinitivs von ידע bewahrt die anthropomorphe Aussage, ohne sie erklärend in „offenzulegen“ oder „sichtbar zu machen“ umzudeuten.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: was in deinem Herzen war
  rationale: לֵבָב bezeichnet das innere Denken, Wollen und Entscheiden. „Herz“ bewahrt die biblische Bildsprache und passt zum folgenden Gehorsam gegenüber den Geboten.
- source_word: הֲתִשְׁמֹר מצותו אִם־לֹא
  choice: ob du seine Gebote halten würdest oder nicht
  rationale: Die indirekte Entscheidungsfrage wird im Deutschen natürlich mit „ob … oder nicht“ wiedergegeben; „halten“ bewahrt den Sinn des gehorsamen Bewahrens und Befolgens.
theological_decisions:
- issue: Anthropomorphe Aussage „um zu erkennen, was in deinem Herzen war“
  choice: Die direkte Aussage „um zu erkennen“ bleibt im Haupttext stehen.
  alternative: „um offenzulegen/zu zeigen, was in deinem Herzen war“
  rationale: Der hebräische Text verwendet ידע („wissen/erkennen“). Eine Umformulierung zu „offenzulegen“ würde die Spannung im Blick auf Gottes Wissen stillschweigend auflösen, statt die Ausdrucksweise des Ausgangstextes zu bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Imperativ ist klar und direkt; die Satzstruktur folgt dem hebräischen Gedankengang, bleibt aber durch die gesetzten Kommata und den Doppelpunkt gut verständlich. Der Gottesname erscheint in der deutschen Form „Jahwe“.
