  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: de
  text: Das ganze Gebot[a], das ich dir[b] heute gebiete, sollt ihr gewissenhaft beachten und danach handeln, damit ihr lebt und zahlreich werdet, in das Land kommt und es in Besitz nehmt[c], das Jahwe euren Vätern zugeschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedes Gebot“. Im Hebräischen steht eine kollektive Einzahl, die die Gesamtheit des Gebotenen bezeichnen kann.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text wechselt hier von der Einzahl „dir“ zur Mehrzahl „ihr“ und spricht Israel zugleich als Einheit und als Gemeinschaft an.
    reason: grammatical_clarification
  - marker: c
    text: 'Oder: „erbt“. Das hebräische Verb kann je nach Zusammenhang das Erben oder die Besitzergreifung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: das ganze Gebot
  rationale: Die hebräische Einzahl mit כָּל bezeichnet die Gesamtheit des Gebotenen. „Das ganze Gebot“ bewahrt diese kollektive Einzahl und ist im Deutschen verständlich.
- source_word: מְצַוְּךָ
  choice: das ich dir heute gebe
  rationale: Das Partizip bezeichnet das gegenwärtige Gebieten. „Ein Gebot geben“ ist im modernen Deutschen natürlicher als „ein Gebot gebieten“; die singularische Anrede „dir“ bleibt erhalten.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: sollt ihr gewissenhaft beachten und danach handeln
  rationale: Die Verbindung von שׁמר und עשׂה verlangt nicht nur Aufmerksamkeit, sondern tatsächliche Ausführung. Die Formulierung gibt beide Aspekte natürlich wieder.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ kennzeichnet knapp und idiomatisch den Zweck beziehungsweise die beabsichtigte Folge.
- source_word: תִּחְיוּן
  choice: ihr lebt
  rationale: Die direkte Wiedergabe bewahrt den Gedanken des Lebens beziehungsweise Fortbestehens.
- source_word: וּרְבִיתֶם
  choice: und zahlreich werdet
  rationale: רבה meint hier, dass Israel zahlenmäßig zunimmt; „zahlreich werden“ ist im Deutschen klarer als „sich vermehren“.
- source_word: וּבָאתֶם
  choice: in das Land kommt
  rationale: Im Zusammenhang bezeichnet בוא das Hineinkommen in das verheißene Land.
- source_word: וִירִשְׁתֶּם
  choice: es in Besitz nehmt
  rationale: ירשׁ kann erben, besitzen oder in Besitz nehmen bedeuten. Hier hebt der Kontext Israels tatsächliche Besitzergreifung des Landes hervor.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Der bestimmte Ausdruck bezeichnet im deuteronomischen Zusammenhang das verheißene Land.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נִשְׁבַּע
  choice: zugeschworen hat
  rationale: Der Niphal von שׁבע bezeichnet eine eidliche Zusage. „Zugeschworen“ verbindet den Eid natürlich mit seinen Empfängern.
- source_word: אֲבֹתֵיכֶם
  choice: euren Vätern
  rationale: Die konkrete maskuline Verwandtschaftsbezeichnung bleibt erhalten und verweist hier auf Israels Vorväter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn sichtbar und unterscheidet ihn von einem bloßen Hoheitstitel.
- issue: Kollektive Einzahl in כָּל הַמִּצְוָה
  choice: das ganze Gebot
  alternative: alle Gebote
  rationale: Die kollektive Einzahl kann die Gesamtheit der Weisung bezeichnen. Die Übersetzung bewahrt die Form, ohne den Umfang auf ein einzelnes isoliertes Gebot zu verengen.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: dir … sollt ihr
  alternative: euch … sollt ihr
  rationale: Der hebräische Text wechselt vom singularischen Suffix in מְצַוְּךָ zu pluralischen Verbformen. Die Übersetzung glättet diesen Wechsel nicht, sondern lässt die korporative Anrede Israels erkennbar.
- issue: Bedeutungsbreite von ירשׁ
  choice: in Besitz nehmen
  alternative: erben
  rationale: Beide Bedeutungen sind möglich. Im unmittelbaren Zusammenhang mit dem Hineinkommen in das Land bezeichnet „in Besitz nehmen“ den Vorgang am deutlichsten, ohne die verheißene Gabe des Landes zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, während „gewissenhaft beachten und danach handeln“ die Verbindung von Bewahren und Tun idiomatisch ausdrückt. Der auffällige Numeruswechsel der Anrede wird bewusst erhalten und in einer Fußnote erläutert.
