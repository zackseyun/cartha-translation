  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: de
  text: dann wird dein Herz hochmütig, und du vergisst Jahwe, deinen Gott, der dich aus dem Land Ägypten, aus dem Haus der Sklaven[a] herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Haus der Sklaven“; auch möglich: „aus dem Sklavenhaus“ oder „aus dem Haus der Sklaverei“.'
    reason: Lexikalische und idiomatische Alternativen zu מִבֵּית עֲבָדִים.
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: dann überhebt sich dein Herz
  rationale: Das Verb רום bezeichnet hier im Warnzusammenhang ein hochmütiges Sich-Erheben. „Sich überheben“ bewahrt das hebräische Bild und macht zugleich die negative Bedeutung im heutigen Deutsch deutlich.
- source_word: וְשָׁכַחְתָּ
  choice: und du vergisst
  rationale: Die Verbform setzt die bedingte Folgerung aus dem vorausgehenden Zusammenhang fort. Das Präsens passt im Deutschen zu einer eindringlichen Warnung, ohne die Form einseitig als Vergangenheit oder Zukunft festzulegen.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֶיךָ ist die direkte Apposition „deinen Gott“.
- source_word: הַמּוֹצִיאֲךָ
  choice: der dich … herausgeführt hat
  rationale: Das artikulierte Partizip bezeichnet Jahwe durch sein rettendes Handeln. Der deutsche Relativsatz gibt diese Funktion natürlich wieder und bewahrt das Motiv des Auszugs.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe folgt der vollen hebräischen Wendung und erhält ihren feierlichen Klang.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Haus der Sklaven
  rationale: עֲבָדִים ist konkret der Plural „Sklaven“. Die Formulierung bildet das hebräische Bild genauer ab als das abstrakte „Sklaverei“, bleibt im Deutschen aber verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von מִבֵּית עֲבָדִים
  choice: aus dem Haus der Sklaven
  alternative: aus dem Sklavenhaus; aus dem Haus der Sklaverei
  rationale: Die gewählte Fassung bewahrt das konkrete hebräische Substantiv im Plural und damit die soziale Wirklichkeit der Versklavten, ohne sie zu einem abstrakten Zustand umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich überheben“ hält Bild und Warncharakter zusammen; die wiederholte Präposition „aus“ folgt der hebräischen Parallelstruktur. Der Satz bleibt als Fortsetzung des vorausgehenden Bedingungsgefüges bewusst mit „dann“ eröffnet.
