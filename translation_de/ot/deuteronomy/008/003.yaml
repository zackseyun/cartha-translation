base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: de
  text: 'Er demütigte dich, ließ dich hungern und gab dir das Manna zu essen, das weder du noch deine Vorfahren gekannt hatten, um dir bewusst zu machen: Nicht vom Brot allein lebt der Mensch, sondern von allem, was aus dem Mund Jahwes hervorgeht, lebt der Mensch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sondern von jedem Wort, das aus dem Mund Jahwes kommt“. Der hebräische Ausdruck bezeichnet wörtlich alles, was aus dem Mund Jahwes hervorgeht, und ist daher weiter gefasst als nur „Wort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Er demütigte dich
  rationale: Das Piel von ענה kann „demütigen“ oder „bedrängen“ bedeuten. Im Zusammenhang von Prüfung und Unterweisung gibt „demütigte“ die beabsichtigte Erniedrigung wieder, ohne körperliches Leiden überzubetonen.
- source_word: וַיַּרְעִבֶךָ
  choice: ließ dich hungern
  rationale: Die kausative Form bezeichnet Gottes aktives Zulassen beziehungsweise Herbeiführen des Hungers; die deutsche Formulierung ist natürlich und wahrt diese Spannung.
- source_word: וַיַּאֲכִלְךָ אֶת הַמָּן
  choice: gab er dir das Manna zu essen
  rationale: Die Form ist kausativ („ließ dich essen“/„speiste dich“). „Gab dir … zu essen“ klingt gegenwärtig und gibt die Versorgung präzise wieder.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: das weder du noch deine Vorfahren gekannt hatten
  rationale: ידע meint hier, mit etwas bekannt oder vertraut zu sein. „Vorfahren“ gibt אָבוֹת im generationenübergreifenden Sinn natürlich wieder.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: So ließ er dich erkennen
  rationale: Die kausative Form von ידע wird sichtbar gehalten, ohne das im Hebräischen stehende Zielgeschehen auf das schwächere „zeigen“ zu reduzieren.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: אָדָם bezeichnet hier den Menschen allgemein. „Der Mensch“ ist im Deutschen generisch, würdevoll und nicht auf Männer beschränkt.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: vom Brot allein
  rationale: Die etablierte und natürliche Wendung bewahrt den Kontrast des hebräischen Satzes.
- source_word: כָּל מוֹצָא פִי יְהוָה
  choice: allem, was aus dem Mund Jahwes hervorgeht
  rationale: מוֹצָא bedeutet wörtlich das Herausgehende beziehungsweise Hervorgehende. Die breitere Formulierung vermeidet die nicht ausdrücklich im Hebräischen stehende Einengung auf „Wort“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: Der Mensch lebt nicht ... sondern der Mensch lebt
  rationale: Die Wiederholung von „der Mensch lebt“ erhält die rhetorische Parallelität des Hebräischen.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם
  choice: der Mensch
  alternative: die Menschen / ein Mensch
  rationale: Die Aussage gilt der Menschheit insgesamt. Das generische deutsche „der Mensch“ bewahrt zugleich die singularische Gestalt und den repräsentativen Charakter des Ausgangstextes.
- issue: Bedeutungsumfang von מוֹצָא פִי יְהוָה
  choice: allem, was aus dem Mund Jahwes hervorgeht
  alternative: jedem Wort, das aus dem Mund Jahwes kommt
  rationale: „Wort“ ist kontextuell möglich und durch die spätere Rezeption vertraut, doch מוֹצָא bezeichnet breiter alles, was hervorgeht. Die Hauptfassung bewahrt diese echte lexikalische Weite.
- issue: Göttliche Beteiligung am Hunger
  choice: ließ dich hungern
  alternative: machte dich hungrig
  rationale: Die Formulierung hält Gottes Handlung fest, ohne die im Deutschen mögliche zusätzliche Nuance unmittelbarer Verursachung unnötig zu verstärken.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Kurze Satzglieder verdeutlichen die Abfolge von Demütigung, Hunger, Versorgung und Unterweisung. Die Wiederholung im Schlusssatz wurde zur Wahrung der hebräischen Rhetorik beibehalten.
