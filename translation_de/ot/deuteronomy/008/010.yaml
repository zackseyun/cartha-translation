base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: de
  text: Du wirst essen und satt werden und Jahwe, deinen Gott, für das gute Land segnen[a], das er dir gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „Jahwe … segnen“ bedeutet hier, ihn zu loben und ihm zu danken.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Du wirst essen und satt werden
  rationale: Die beiden Qal-Perfektformen mit ו setzen in diesem Zusammenhang die erwartete Folge fort. Die deutsche Zukunftsform klingt natürlich und bewahrt den Übergang von Gottes Gabe zu Israels Reaktion; שׂבע bezeichnet das Sattwerden.
- source_word: וּבֵרַכְתָּ
  choice: Dann sollst du … preisen
  rationale: ברך mit Gott als Objekt bedeutet, gut von ihm zu sprechen, ihn zu loben beziehungsweise ihm zu danken. Das idiomatische deutsche „preisen“ gibt diese auf Gott gerichtete Bedeutung natürlicher wieder als „segnen“, ohne sie auf bloßen Dank zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird im Deutschen in der geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: 'Die Konstruktform mit Suffix der 2. Person Singular bezeichnet die persönliche beziehungsweise bundeshafte Zuordnung: „deinen Gott“.'
- source_word: עַל
  choice: für
  rationale: עַל bezeichnet hier bei ברך den Anlass oder Grund des Preisens.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: das gute Land
  rationale: Die direkte Wiedergabe bewahrt das Bundesland-Motiv und legt die Art seiner Güte nicht unnötig fest.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: das er dir gegeben hat
  rationale: Der Relativsatz bezeichnet das Land als Gottes Gabe; das deutsche Perfekt bringt deren bleibende Bedeutung natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von ברך, wenn Gott das Objekt ist
  choice: preisen
  alternative: segnen; danken
  rationale: Wörtliches „segnen“ bewahrt zwar die hebräische Ausdrucksweise, ist im heutigen Deutsch bei Gott als Objekt jedoch leicht missverständlich. „Preisen“ bezeichnet verständlich das anerkennende, dankbare Gutreden von Gott; die Fußnote hält die wörtliche Form und die Alternative „danken“ sichtbar.
- issue: Modale Abfolge der Verbformen
  choice: Erwartete Folge mit anschließendem Soll-Gebot
  alternative: 'Durchgehend: „Du sollst essen … und sollst preisen“; temporal: „Wenn du gegessen hast …“'
  rationale: Der Zusammenhang beschreibt zunächst den Genuss und das Sattwerden als Folge der Landgabe und richtet dann die verpflichtende Antwort auf Gott. Die Übersetzung wahrt sowohl den Zukunftsaspekt als auch den mahnenden Ton, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „wenn“ einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. „Satt werden“ ist konkret und alltagssprachlich verständlich; „preisen“ wahrt einen gehobenen, aber geläufigen biblischen Ton. Der Fußnotenmarker [a] steht unmittelbar beim erklärten Ausdruck.
