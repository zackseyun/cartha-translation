  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: de
  text: Darum[a] sollst du die Gebote Jahwes, deines Gottes, halten, indem du auf seinen Wegen gehst und ihn fürchtest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du sollst“. Die hebräische Konjunktion kann eine einfache Fortführung ausdrücken; im Zusammenhang liegt jedoch eine folgernde Bedeutung nahe.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihn fürchten“ meint hier ehrfürchtige Furcht vor Gott; sinngemäß auch: „Ehrfurcht vor ihm haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Darum sollst du … halten
  rationale: שׁמר bezeichnet im Zusammenhang mit Geboten deren treues Halten und Befolgen. Das vorangestellte וְ wird aufgrund des Zusammenhangs folgernd mit „Darum“ wiedergegeben; die einfach koordinierende Lesart bleibt in einer Fußnote erhalten.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: Der Plural von מִצְוָה bezeichnet die von Gott auferlegten Verpflichtungen; „Gebote“ bewahrt den rechtlichen und bundesbezogenen Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die Form enthält das Suffix der zweiten Person Singular und bedeutet „deines Gottes“; als Apposition zu „Jahwes“ ist diese Form im Deutschen natürlich.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: indem du auf seinen Wegen gehst
  rationale: Der Infinitiv erläutert, wie sich das Halten der Gebote verwirklicht. Das Bild des Gehens auf Gottes Wegen bleibt erhalten.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: und ihn fürchtest
  rationale: ירא bezeichnet gegenüber Gott ehrfürchtige Furcht. „Fürchten“ bewahrt die Stärke und theologische Spannung des hebräischen Ausdrucks, ohne ihn auf bloße Achtung abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Die Transliteration wahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Gottesfurcht
  choice: ihn fürchtest
  alternative: ihn ehrst / Ehrfurcht vor ihm hast
  rationale: Im Zusammenhang ist ehrfürchtige Furcht gemeint; dennoch bleibt im Haupttext der volle Bedeutungsgehalt von ירא erhalten. Die Fußnote erläutert die ehrfürchtige Dimension.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem Hebräischen im Singular. Die bildhafte Wendung „auf seinen Wegen gehen“ und das spannungsreiche Wort „fürchten“ werden bewahrt; „indem“ verdeutlicht die Beziehung der beiden Infinitive zum Halten der Gebote.
