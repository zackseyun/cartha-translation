source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: de
  text: Hüte dich davor, Jahwe, deinen Gott, zu vergessen, indem du seine Gebote, seine Rechtsbestimmungen und seine Satzungen nicht hältst, die ich dir heute gebiete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Achte darauf
  rationale: Die nifalische Imperativform mit לְךָ ist eine eindringliche Warnformel. „Achte darauf“ klingt im modernen Deutschen natürlich und bewahrt den mahnenden Charakter.
- source_word: פֶּן תִּשְׁכַּח
  choice: dass du … nicht vergisst
  rationale: פֶּן leitet die zu vermeidende Gefahr ein. Die deutsche Konstruktion „Achte darauf, dass … nicht“ gibt dies idiomatisch und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Direkte Wiedergabe der Bundesbezeichnung mit Suffix der zweiten Person Singular.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: indem du … nicht hältst
  rationale: Die Infinitivkonstruktion kann erläutern, worin das Vergessen konkret besteht bzw. wie es sich zeigt. „Indem“ wahrt diesen Zusammenhang, ohne ihn stärker als eindeutig kausal festzulegen.
- source_word: מִצְוֺתָיו
  choice: seine Gebote
  rationale: Eingebürgerte und präzise Wiedergabe des deuteronomischen Bundesbegriffs מִצְוָה.
- source_word: מִשְׁפָּטָיו
  choice: seine Rechtsbestimmungen
  rationale: „Rechtsbestimmungen“ vermittelt den rechtlich-normativen Sinn von מִשְׁפָּט im Kontext des Bundesgesetzes verständlicher als das mögliche, aber missverständliche „Urteile“.
- source_word: חֻקֹּתָיו
  choice: seine Satzungen
  rationale: „Satzungen“ bewahrt den formellen Charakter festgesetzter Ordnungen und unterscheidet den Begriff von Geboten und Rechtsbestimmungen.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Das Partizip hat gegenwärtige, fortdauernde Redeaktbedeutung. Das idiomatische deutsche Präsens wahrt die Unmittelbarkeit und den Nachdruck von „heute“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen sichtbar als Namen wieder; die traditionelle Ersetzung durch „der HERR“ ist möglich, steht jedoch nicht im hebräischen Wortlaut.
- issue: Verhältnis zwischen dem Vergessen Jahwes und dem Nichtbefolgen der Gebote
  choice: indem du … nicht hältst
  alternative: sodass du … nicht hältst / und … nicht hältst
  rationale: לְבִלְתִּי שְׁמֹר kann das Nichtbefolgen als Ausdruck oder Begleitweise des Vergessens darstellen. „Indem“ bewahrt diese enge Verbindung, ohne eine eigenständige dogmatische Erklärung des Vergessens einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die dreigliedrige Rechtsterminologie des Hebräischen bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
