  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: de
  text: 'So erkenne in deinem Herzen: Wie ein Mann seinen Sohn erzieht[a], so erzieht Jahwe, dein Gott, dich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurechtweist“ oder „züchtigt“; das hebräische Verb kann sowohl korrigierende Bestrafung als auch formende Unterweisung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: So erkenne
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit וְ führt den Gedanken aus dem vorangehenden Zusammenhang folgernd und auffordernd weiter. „So erkenne“ gibt diese Kraft im Deutschen natürlich wieder.
- source_word: עִם לְבָבֶךָ
  choice: in deinem Herzen
  rationale: Die Wendung bezeichnet eine innere, bewusste Einsicht. „In deinem Herzen“ ist idiomatisch und bewahrt zugleich das biblische Bild.
- source_word: כִּי
  choice: ':'
  rationale: כִּי leitet hier den Inhalt dessen ein, was Israel erkennen soll. Ein Doppelpunkt gibt diese Inhaltsbeziehung im Deutschen klarer und natürlicher wieder als ein ausdrücklich eingefügtes „dass“ vor dem Vergleichssatz.
- source_word: כַּאֲשֶׁר
  choice: Wie … so
  rationale: Die deutsche Vergleichskonstruktion „wie … so“ bildet die Entsprechung zwischen der Erziehung des Sohnes und Jahwes Handeln deutlich ab.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: erzieht / erzieht
  rationale: יסר umfasst korrigierende Zurechtweisung und formende Unterweisung. „Erziehen“ wahrt im Deutschen beide Aspekte eher als ein rein strafbezogenes Wort; die Wiederholung entspricht dem Hebräischen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Der Ausgangstext sagt ausdrücklich „ein Mann“ und nicht „ein Vater“; die Vater-Sohn-Beziehung ergibt sich aus „seinen Sohn“.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: בֵּן bezeichnet hier spezifisch den Sohn, nicht allgemein ein Kind.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Gottesnamen wird als direkte Bundesbezeichnung „Jahwe, dein Gott“ wiedergegeben.
theological_decisions:
- issue: Wesen der göttlichen Erziehung
  choice: erzieht
  alternative: weist zurecht; züchtigt
  rationale: Die Übersetzung hält sowohl den korrigierenden als auch den formenden Sinn von יסר offen und beschränkt Jahwes Handeln weder auf Strafe noch auf bloße Belehrung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Vergleichskonstruktion bewahrt die Wiederholung des hebräischen Verbs und vermeidet konfessionell geprägte Zusätze.
