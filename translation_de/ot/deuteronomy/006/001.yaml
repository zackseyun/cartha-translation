  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: de
  text: Dies[a] ist das Gebot – die Satzungen und die Rechtsbestimmungen –, das Jahwe[b], euer Gott, euch zu lehren geboten hat, damit ihr sie in dem Land befolgt, in das ihr hinüberzieht, um es in Besitz zu nehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Und dies ist das Gebot“. Die hebräische Konjunktion verbindet den Satz mit dem Vorhergehenden.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den Gottesnamen JHWH wieder; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: 'Auch: „um es zu besitzen“ oder „um es als Erbe in Besitz zu nehmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Dies
  rationale: Das Demonstrativ eröffnet den neuen Abschnitt; die vorangestellte Konjunktion verbindet ihn zugleich mit dem Vorhergehenden. Im modernen Deutschen ist „Dies ist“ im Haupttext natürlich, während „Und dies ist“ als mögliche Wiedergabe in der Fußnote erhalten bleibt.
- source_word: הַמִּצְוָה
  choice: das Gebot
  rationale: Der Singular bleibt erhalten und dient wahrscheinlich als zusammenfassende Überschrift für die anschließend genannten pluralischen Rechtskategorien.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: „Satzungen“ gibt den Sinn festgesetzter Anordnungen wieder und wahrt das gehobene rechtlich-bundestheologische Register.
- source_word: וְהַמִּשְׁפָּטִים
  choice: und die Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet rechtliche Entscheidungen beziehungsweise verbindliche Regelungen. „Rechtsbestimmungen“ ist für heutige Leser verständlich und bleibt von „Satzungen“ unterscheidbar.
- source_word: אֲשֶׁר צִוָּה ... לְלַמֵּד אֶתְכֶם
  choice: das ... euch zu lehren geboten hat
  rationale: Die Formulierung bewahrt den Relativsatz und lässt wie der hebräische Text unausgesprochen, wem Jahwe den Lehrauftrag gab. „Euch“ bleibt das Objekt des Lehrens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn im Haupttext durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die zweite Person Plural wird direkt und natürlich wiedergegeben.
- source_word: לַעֲשׂוֹת
  choice: damit ihr sie ... befolgt
  rationale: Wörtlich steht „zu tun“. Im Zusammenhang mit Satzungen und Rechtsbestimmungen drückt „befolgen“ die geforderte praktische Ausführung in natürlichem Deutsch aus; „sie“ nimmt die pluralischen Bestimmungen auf.
- source_word: בָּאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: in dem Land, in das ihr hinüberzieht
  rationale: Die Wendung bewahrt sowohl die Bewegung über eine Grenze als auch die Zielrichtung auf das Land hin.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: ירשׁ bezeichnet hier das Erlangen und Besitzen des Landes. Die gewählte Formulierung hält das aktive Moment fest, ohne die ebenfalls mögliche Erbterminologie vorzuschreiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ wahrt diese Tatsache; die traditionelle Ersatzlesung „der HERR“ wird als solche in einer Fußnote genannt.
- issue: Verhältnis des singularischen „Gebots“ zu den pluralischen Satzungen und Rechtsbestimmungen
  choice: Singular und Plural mit einer erläuternden Gedankenstrichkonstruktion bewahren
  alternative: zu „Gebote, Satzungen und Rechtsbestimmungen“ vereinheitlichen
  rationale: Der hebräische Numerusunterschied kann eine zusammenfassende Überschrift mit anschließender Entfaltung anzeigen. Eine Vereinheitlichung würde diese echte Spannung beseitigen.
- issue: Unausgesprochenes Objekt des göttlichen Befehlens
  choice: Den Beauftragten nicht ausdrücklich nennen
  alternative: „das Jahwe ... mir geboten hat, euch zu lehren“
  rationale: Aus dem Zusammenhang ist Mose als Lehrer erkennbar, doch im vorliegenden hebräischen Satz steht kein ausdrückliches „mir“. Die Übersetzung fügt es daher nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Die Gedankenstriche erhalten die hebräische Struktur aus einem singularischen Sammelbegriff und zwei pluralischen Entfaltungen. Der Satz bleibt bewusst nah an der rechtlich-bundestheologischen Ausdrucksweise, ohne altertümliche Formen zu verwenden.
