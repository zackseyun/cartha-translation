  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: de
  text: Haltet die Gebote Jahwes, eures Gottes, unbedingt[a] ein, ebenso seine Weisungen[b] und Satzungen, die er dir geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Haltet sie sorgfältig ein“ oder „Achtet sorgfältig darauf“. Im Hebräischen verstärkt ein absoluter Infinitiv zusammen mit einer finiten Verbform die Aufforderung.'
    reason: lexical_alternative
  - marker: b
    text: „Weisungen“ kann hier auch mit „Zeugnissen“, „Bestimmungen“ oder „Bundesbestimmungen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: Haltet … gewissenhaft
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt die Aufforderung. „Gewissenhaft halten“ gibt sowohl den verpflichtenden Charakter als auch die Betonung in natürlichem Deutsch wieder.
- source_word: מִצְוֺת
  choice: die Gebote
  rationale: מִצְוֹת bezeichnet gebotene Verpflichtungen; „Gebote“ wahrt den rechtlich-bundestheologischen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Die Verbindung mit dem Gottesnamen bildet die für das Deuteronomium typische Bundesformel „Jahwe, euer Gott“.
- source_word: עֵדֹתָיו
  choice: seine Weisungen
  rationale: עֵדוֹת bezeichnet hier verbindliche, den Bund bezeugende Bestimmungen. „Weisungen“ ist im heutigen Deutsch verständlicher als „Zeugnisse“, ohne den rechtlichen Sinn auf eine einzige Nuance festzulegen.
- source_word: חֻקָּיו
  choice: seine Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Bestimmungen. „Satzungen“ bewahrt den formellen Ton und unterscheidet den Ausdruck von „Geboten“ und „Weisungen“.
- source_word: אֲשֶׁר צִוָּךְ
  choice: die er euch geboten hat
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die zuvor genannten Rechtsbegriffe insgesamt. Das Perfekt wird mit fortdauernder Geltung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֵדֹתָיו
  choice: seine Weisungen
  alternative: seine Zeugnisse / seine Bundesbestimmungen
  rationale: Der Ausdruck kann die den Bund bezeugenden Verfügungen meinen. „Weisungen“ bleibt verständlich und wahrt neben „Geboten“ und „Satzungen“ eine eigene Kategorie; die Alternativen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Plural der Anrede wird mit „euch/eures“ bewahrt. Die drei hebräischen Rechtsbegriffe werden durch unterschiedliche deutsche Wörter wiedergegeben, ohne ihre Bedeutungsfelder künstlich scharf voneinander abzugrenzen.
