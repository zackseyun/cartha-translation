  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: de
  text: Ihr sollt Jahwe, euren Gott, nicht auf die Probe stellen[a], wie ihr ihn bei Massa auf die Probe gestellt habt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ihr sollt Jahwe, euren Gott, nicht prüfen.“'
    reason: lexical_alternative
  - marker: b
    text: In Massa stellte Israel Jahwe in der Wüste auf die Probe (2. Mose 17,1–7). Der Name „Massa“ ist mit dem hebräischen Wort für „auf die Probe stellen“ verbunden.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die Verneinung leitet zusammen mit der Imperfektform ein Verbot ein.
- source_word: תְנַסּוּ
  choice: sollt … nicht auf die Probe stellen
  rationale: Das Piel-Imperfekt der 2. Person Plural von נסה steht hier in einer Verbotskonstruktion. „Auf die Probe stellen“ ist im heutigen Deutsch natürlich und gibt die bewusste Erprobung angemessen wieder.
- source_word: אֶת
  choice: '[unübersetzter Akkusativmarker]'
  rationale: Kennzeichnet im Hebräischen das bestimmte direkte Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die Form enthält das Suffix der 2. Person Plural; der Akkusativ ergibt sich aus der deutschen Satzkonstruktion.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den Vergleich mit dem früheren Geschehen bei Massa knapp und idiomatisch ein.
- source_word: נִסִּיתֶם
  choice: ihr ihn … auf die Probe gestellt habt
  rationale: Dasselbe Verb נסה wird wie im ersten Satzteil übersetzt, damit die bewusste lexikalische Wiederholung erhalten bleibt. Das Pronomen „ihn“ macht das im Deutschen erforderliche Objekt deutlich.
- source_word: בַּמַּסָּה
  choice: bei Massa
  rationale: Massa bleibt als Ortsname unübersetzt. „Bei“ ist für den Bezug auf das dortige Geschehen natürlich; die mit „Prüfen/Erproben“ verbundene Bedeutung des Namens wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Umschrift bewahrt diese Unterscheidung gegenüber dem Titel „Herr“, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bedeutungsumfang von נסה
  choice: auf die Probe stellen
  alternative: prüfen / versuchen
  rationale: „Auf die Probe stellen“ bewahrt den warnenden Sinn im Zusammenhang des Bundes. „Versuchen“ könnte im heutigen Deutsch missverständlich nach Verlockung zur Sünde klingen; „prüfen“ ist ebenfalls möglich, aber weniger deutlich.
- issue: Anspielung auf Exodus 17
  choice: Den Ortsnamen „Massa“ im Haupttext beibehalten
  alternative: am Ort der Erprobung
  rationale: Der hebräische Text nennt den Ort, ohne die geschichtliche Anspielung auszulegen. Die Erklärung gehört daher in eine Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem Hebräischen im Plural. Die Wiederholung von „auf die Probe stellen“ bildet die Wiederholung desselben hebräischen Verbs bewusst ab.
