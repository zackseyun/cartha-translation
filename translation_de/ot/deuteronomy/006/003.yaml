base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: de
  text: So höre nun, Israel, und achte darauf, danach zu handeln, damit es dir gut geht und ihr euch sehr vermehrt in einem Land, in dem Milch und Honig fließen, wie Jahwe, der Gott deiner Väter[a], zu dir gesagt hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deiner Vorfahren«. Im Hebräischen steht wörtlich »deiner Väter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »wie Jahwe, der Gott deiner Väter, dir ein Land zugesagt hat, in dem Milch und Honig fließen«. Der hebräische Satzbau ist verdichtet; die Landangabe kann auch als Inhalt oder nähere Bestimmung dessen verstanden werden, was Jahwe gesagt hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: So höre nun
  rationale: שׁמע kann »hören«, »zuhören« oder im Kontext auch »gehorchen« bedeuten. »Höre« bewahrt die Grundbedeutung; der Gehorsamsaspekt ergibt sich aus der anschließenden Aufforderung zum Handeln. »Nun« gibt den folgernden Zusammenhang natürlich wieder.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: achte darauf, danach zu handeln
  rationale: Die Verbindung von שׁמר mit dem Infinitiv עשה bezeichnet sorgfältiges Beachten mit dem Ziel tatsächlicher Ausführung. Die deutsche Formulierung ist idiomatisch und bewahrt beide Aspekte.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: damit es dir gut geht
  rationale: Die geläufige deuteronomische Wendung bezeichnet Wohlergehen als Folge des Gehorsams. »Damit es dir gut geht« ist natürliches modernes Deutsch.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: und ihr euch sehr vermehrt
  rationale: רבה bezeichnet hier zahlenmäßiges Anwachsen; מְאֹד verstärkt es. Der Wechsel vom Singular zum Plural wird entsprechend dem Hebräischen bewahrt.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: wie … gesagt hat
  rationale: דבר bedeutet zunächst »reden/sagen«. Die Übersetzung vermeidet, die im Kontext naheliegende Bedeutung »versprechen/zusagen« bereits in den Haupttext einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: der Gott deiner Väter
  rationale: אבות ist ausdrücklich die maskuline Pluralform »Väter«. Die mögliche allgemeinere Bedeutung »Vorfahren« wird in einer Fußnote genannt.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: in einem Land, in dem Milch und Honig fließen
  rationale: Die traditionelle Bildformel wird verständlich und bildhaft wiedergegeben. »In einem Land« folgt der naheliegenden syntaktischen Verbindung mit dem vorher genannten Wohlergehen und Anwachsen, ohne die komprimierte Konstruktion zu verdecken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« erhält diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung אֲבֹתֶיךָ
  choice: deiner Väter
  alternative: deiner Vorfahren
  rationale: Der Haupttext bewahrt die ausdrücklich maskuline Form des Hebräischen; die im Deutschen mögliche umfassendere Wiedergabe wird als lexikalische Alternative vermerkt.
- issue: Bezug der Wendung אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: in einem Land, in dem Milch und Honig fließen
  alternative: 'als Inhalt beziehungsweise nähere Bestimmung der göttlichen Zusage: »… hat dir ein Land zugesagt, in dem Milch und Honig fließen«'
  rationale: Der hebräische Satzbau ist stark verdichtet. Der Haupttext verbindet die Landangabe räumlich mit dem Wohlergehen und der Vermehrung; die ebenfalls mögliche Auffassung als Inhalt der vorausgehenden Zusage bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Der auffällige Wechsel vom Singular (»dir«) zum Plural (»ihr euch«) entspricht dem hebräischen Personenwechsel und wurde nicht geglättet. Die vertraute Bildsprache von Milch und Honig bleibt erhalten.
