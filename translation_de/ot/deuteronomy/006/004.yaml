  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: de
  text: 'Höre, Israel: Jahwe, unser Gott, Jahwe ist eins.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe ist unser Gott, Jahwe allein“; alternativ: „Jahwe, unser Gott, ist ein einziger.“ Die knappe hebräische Formulierung lässt mehrere syntaktisch plausible Wiedergaben zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ Singular richtet sich an Israel als Gesamtvolk. „Höre“ bewahrt sowohl den eigentlichen Sinn des Hörens als auch den mitgemeinten Aufruf, aufmerksam zu sein und zu gehorchen; zugleich entspricht die Formulierung dem würdevollen biblischen Register.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname des Bundesvolkes wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes persönlicher Name „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, bezeichnet das Wort mit dem Suffix der ersten Person Plural hier nach dem üblichen hebräischen Sprachgebrauch den einen Gott Israels.
- source_word: אֶחָד
  choice: einer
  rationale: „Einer“ gibt die Grundbedeutung des Zahlworts beziehungsweise Adjektivs wieder und passt grammatisch zu „Jahwe“. Mögliche Bedeutungsnuancen wie Einzigkeit oder Ausschließlichkeit werden nicht interpretierend in den Haupttext eingetragen.
theological_decisions:
- issue: Syntax und Sinn des abschließenden Teils des Schema
  choice: Jahwe, unser Gott, Jahwe ist einer
  alternative: 'Jahwe ist unser Gott, Jahwe allein; alternativ: Jahwe, unser Gott, ist ein Jahwe'
  rationale: Der knappe hebräische Nominalsatz lässt mehrere syntaktisch plausible Zuordnungen zu. Die Hauptfassung erhält die traditionelle Aussage von Gottes Einheit mit möglichst wenig Ergänzung. Die ebenfalls mögliche exklusive Lesart mit „allein“ wird in der Fußnote bewahrt, statt die Mehrdeutigkeit stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Anrede „Höre, Israel“ bleibt erhalten, ohne archaische Formen zu verwenden. Der Gottesname wird als „Jahwe“ wiedergegeben; die echte syntaktische Mehrdeutigkeit des Hebräischen wird durch eine Fußnote offengehalten.
