  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: de
  text: Jahwe, deinen Gott, sollst du fürchten[a], ihm sollst du dienen[b], und bei seinem Namen sollst du schwören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht haben vor Jahwe, deinem Gott“. Das hebräische Verb schließt ehrfürchtige Scheu und Staunen ein, nicht nur Angst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihn anbeten“. Das hebräische Verb bedeutet gewöhnlich „dienen“ und umfasst hier den Gottesdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Die Konstruktverbindung mit Suffix der 2. Person Singular bezeichnet im Bundeszusammenhang „deinen Gott“.
- source_word: תִּירָא
  choice: sollst du fürchten
  rationale: Das Verb umfasst ehrfürchtige Furcht und Scheu. „Fürchten“ bewahrt seine volle Bedeutungsbreite und den Ernst des Gebots.
- source_word: וְאֹתוֹ
  choice: ihm
  rationale: Das ausdrücklich gesetzte Objektpronomen wird zur Hervorhebung beibehalten. „Allein“ wird nicht ergänzt, da es in diesem Vers nicht ausdrücklich steht.
- source_word: תַעֲבֹד
  choice: sollst du dienen
  rationale: עבד bedeutet grundsätzlich „dienen“ und schließt hier den Gottesdienst ein, ohne darauf verengt zu sein.
- source_word: וּבִשְׁמוֹ
  choice: und bei seinem Namen
  rationale: Die Präposition ב bezeichnet bei einer Eidesformel die angerufene Instanz; im Deutschen ist „bei seinem Namen schwören“ idiomatisch.
- source_word: תִּשָּׁבֵעַ
  choice: sollst du schwören
  rationale: Der Nifal von שׁבע bedeutet „schwören, einen Eid leisten“; mit „bei seinem Namen“ ist „schwören“ knapp und natürlich.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der direkte Objektmarker besitzt im Deutschen keine eigenständige lexikalische Entsprechung; seine Funktion wird durch den Akkusativ ausgedrückt.
theological_decisions:
- issue: Ob תִּירָא abgeschwächt als „verehren“ wiederzugeben ist
  choice: „fürchten“ im Haupttext
  alternative: „Ehrfurcht haben vor“ oder „verehren“
  rationale: Das Hebräische meint nicht bloßen Schrecken, aber auch mehr als allgemeinen Respekt. „Fürchten“ bewahrt die Spannung zwischen Ehrfurcht, heiliger Scheu und Gehorsam.
- issue: Ob תַעֲבֹד als „dienen“ oder „anbeten“ wiederzugeben ist
  choice: „dienen“
  alternative: „anbeten“
  rationale: „Dienen“ wahrt die lexikalische Breite und bezeichnet die umfassende Bundestreue; der gottesdienstliche Sinn bleibt eingeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die hebräische Hervorhebung Jahwes und des auf ihn bezogenen Dienstes; die Modalform „sollst“ entspricht dem gebietenden Charakter des Imperfekts.
