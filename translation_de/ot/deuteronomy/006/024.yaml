base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: de
  text: Und der HERR gebot uns, alle diese Ordnungen zu befolgen und den HERRN, unseren Gott, zu fürchten – zu unserem Besten alle Tage, damit er uns am Leben erhält, wie es heute der Fall ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֻקִּים
  choice: Ordnungen
  rationale: Gibt die verbindlich festgesetzten Vorschriften natürlich und würdig wieder; „Satzungen“ wäre im heutigen Deutsch stärker altertümlich.
- source_word: לְיִרְאָה
  choice: zu fürchten
  rationale: Bewahrt die religiöse Bedeutung von Ehrfurcht und Furcht, ohne sie auf bloßen Respekt zu verengen.
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: damit es uns allezeit gut geht
  rationale: Gibt Zweck und fortdauerndes Wohlergehen idiomatisch wieder; „allezeit“ bewahrt die zeitliche Weite von כָּל־הַיָּמִים.
- source_word: לְחַיֹּתֵנוּ
  choice: und er uns am Leben erhält
  rationale: Der Hifil-Infinitiv bezeichnet das Bewahren bzw. Erhalten am Leben; das aus dem Hauptsatz erschlossene Subjekt Gott wird für natürliches Deutsch ausdrücklich aufgenommen.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Bewahrt den Vergleich mit der gegenwärtig erfahrenen Lebenserhaltung und vermeidet eine missverständliche rein zeitliche Lesart.
theological_decisions:
- issue: Gottesname יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschen Bibelkonvention und der vorgegebenen konsultativen Fassung, ohne eine unsichere Aussprache zum Haupttext zu machen.
- issue: Verhältnis von Gehorsam, Gottesfurcht und Wohlergehen
  choice: Zwecksätze mit „damit“
  alternative: bloße Reihung von Infinitiven
  rationale: Die hebräischen לְ-Konstruktionen drücken hier den Zweck des Gebots aus. Die Übersetzung wahrt, dass Wohlergehen und Leben als göttliche Zielsetzung erscheinen, ohne daraus eine allgemeine mechanische Vergeltungslehre abzuleiten.
- issue: Subjekt der Lebenserhaltung
  choice: „er“ bezieht sich auf den HERRN
  alternative: 'unpersönlich: „um uns am Leben zu erhalten“'
  rationale: Im Kontext ist Gott der Gebietende und Wohltäter. Die ausdrückliche Aufnahme des Pronomens schafft im Deutschen Klarheit, ohne eine fremde Aussage hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Befolgen“ klingt natürlicher als „tun“ bei Ordnungen; „allezeit“ hält einen leicht gehobenen, aber weiterhin verständlichen Ton.
