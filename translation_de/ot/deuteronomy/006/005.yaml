base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: de
  text: Und du sollst Jahwe, deinen Gott, lieben mit deinem ganzen Herzen, mit deiner ganzen Seele[a] und mit deiner ganzen Kraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Seele“ (nefesch) kann auch „Leben“ oder „Selbst“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Kraft“ übersetzte hebräische Wort (me’od) hängt wörtlich mit „Vielheit“ zusammen und kann Stärke, Intensität oder auch die verfügbaren Mittel bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Und du sollst … lieben
  rationale: Das Qal-Perfekt der 2. Person Singular mit vorangestelltem וְ hat in diesem gesetzlich-ermahnenden Zusammenhang Gebotskraft. „Du sollst“ gibt diese Verpflichtung im modernen Standarddeutsch klar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, bezeichnet es hier mit dem Suffix eindeutig Israels einen Gott.
- source_word: בְּכָל
  choice: mit deinem ganzen
  rationale: Die dreifache Verbindung von בְּ und כָּל bezeichnet die uneingeschränkte Hingabe der ganzen Person. Die Wiederholung wird in allen drei Gliedern bewahrt.
- source_word: לְבָבְךָ
  choice: deinem ganzen Herzen
  rationale: לֵבָב umfasst im Hebräischen das innere Selbst einschließlich Denken und Wollen, nicht nur Gefühle. „Herz“ bewahrt diese traditionelle, breite Bedeutung, ohne den Begriff auf „Verstand“ einzuengen.
- source_word: נַפְשְׁךָ
  choice: deiner ganzen Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder Selbst bezeichnen. „Seele“ wahrt die etablierte Formulierung; eine Fußnote macht die größere Bedeutungsbreite sichtbar.
- source_word: מְאֹדֶךָ
  choice: deiner ganzen Kraft
  rationale: מְאֹד bedeutet grundsätzlich „sehr“ beziehungsweise „Vielheit“ und wird hier ungewöhnlich substantivisch für das gesamte Vermögen, die Intensität oder die Mittel eines Menschen gebraucht. „Kraft“ ist eine natürliche knappe Wiedergabe; die Fußnote bewahrt die weitere Bedeutungsbreite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Begriffe im Liebesgebot
  choice: Herz … Seele … Kraft
  alternative: Inneres … Leben … gesamtes Vermögen
  rationale: Die drei hebräischen Ausdrücke bezeichnen überlappende Aspekte der ganzen Person und keine scharf getrennten modernen Seelenvermögen. Die Übersetzung erhält diese Spannung; die Fußnoten weisen auf die Bedeutungsweite hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Dreierformel bleibt erhalten, während die Fußnoten die umfassendere hebräische Anthropologie erläutern. Die dreifache Totalitätsformel wird syntaktisch wiederholt.
