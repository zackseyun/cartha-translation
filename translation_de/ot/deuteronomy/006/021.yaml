  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: de
  text: 'Dann sollst du deinem Sohn sagen: »Wir waren Sklaven des Pharaos in Ägypten, und Jahwe führte uns mit starker Hand aus Ägypten heraus.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du sollst deinem Sohn sagen“. Das hebräische Bindewort kann schlicht mit „und“ wiedergegeben werden; „dann“ verdeutlicht die Abfolge der Anweisung aus dem vorherigen Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Dann sollst du … sagen
  rationale: Das einleitende וְ führt im Zusammenhang die Anweisungsfolge aus dem vorherigen Vers fort. „Dann“ gibt diese Folge im Deutschen natürlich wieder; auch ein schlichtes „Und“ wäre möglich.
- source_word: לְבִנְךָ
  choice: deinem Sohn
  rationale: Das Hebräische bezeichnet ausdrücklich den Sohn im maskulinen Singular; diese Form wird beibehalten.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: Wir waren Sklaven des Pharaos
  rationale: עֲבָדִים bezeichnet hier angesichts der ägyptischen Zwangsherrschaft Sklaven. Der Genitiv gibt die durch לְ markierte Unterordnung beziehungsweise Zugehörigkeit idiomatisch wieder.
- source_word: וַיּוֹצִיאֵנוּ
  choice: führte uns … heraus
  rationale: Der Hifil von יצא bedeutet, jemanden hinauszubringen. „Herausführen“ ist im Deutschen natürlich und bewahrt den Gedanken des bewirkten Auszugs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die wörtlich nahe und im Deutschen verständliche Wendung bezeichnet Jahwes machtvolles Befreiungshandeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Stärke des Abhängigkeitsverhältnisses bei עֲבָדִים
  choice: Sklaven
  alternative: Knechte
  rationale: Der Exoduszusammenhang beschreibt tatsächliche, bedrückende Versklavung. „Sklaven“ vermittelt dies im heutigen Deutsch deutlicher als das mehrdeutige „Knechte“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich vermittelbar; „mit starker Hand“ bewahrt das markante hebräische Bild.
