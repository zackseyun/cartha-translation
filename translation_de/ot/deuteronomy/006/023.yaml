  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: de
  text: Und uns führte er von dort heraus, um uns hineinzubringen und uns das Land zu geben, das er unseren Vätern[a] zugeschworen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Vorfahren“. Hebräisch: „unseren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתָנוּ הוֹצִיא
  choice: Und uns führte er … heraus
  rationale: Die Voranstellung von „uns“ bewahrt die Hervorhebung des hebräischen direkten Objekts; „herausführen“ gibt den Hifil von יצא im Exoduszusammenhang natürlich wieder.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion drückt den Zweck klar und natürlich aus.
- source_word: הָבִיא אֹתָנוּ
  choice: uns hineinzubringen
  rationale: „Hineinbringen“ bewahrt den beabsichtigten Gegensatz zu „herausführen“, auch wenn das Ziel erst im folgenden Satzteil genannt wird.
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: uns das Land zu geben
  rationale: Gibt die zweite Infinitivkonstruktion knapp wieder; „das Land“ entspricht dem deuteronomischen Verheißungskontext.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵינוּ
  choice: das er unseren Vätern zugeschworen hatte
  rationale: „Zuschwören“ bewahrt die Sprache des Eides und verbindet das Land im Deutschen idiomatisch mit den Empfängern des Schwurs; das Plusquamperfekt verdeutlicht den gegenüber dem Auszug vorausliegenden Eid.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung in לַאֲבֹתֵינוּ
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Der hebräische Ausdruck ist maskulin und verweist im Zusammenhang auf Israels Erzväter; die Übersetzung bewahrt diese konkrete bundestheologische Beziehung.
- issue: Eidessprache in נִשְׁבַּע
  choice: zugeschworen hatte
  alternative: versprochen hatte
  rationale: Die Formulierung erhält das Gewicht eines bindenden Eides und schwächt ihn nicht zu einem allgemeinen Versprechen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Formulierung „Und uns“ ist bewusst markiert, um die hebräische Hervorhebung zu erhalten; die parallelen Bewegungsverben „herausführte“ und „hineinzubringen“ bilden den Auszug und das Hineinführen ins Land ab.
