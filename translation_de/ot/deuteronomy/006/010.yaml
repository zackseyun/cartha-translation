revisions:
- from: Und wenn Yahweh, dein Gott, dich in das Land bringt, das er deinen Vätern[a] – Abraham, Isaak und Jakob – mit einem Eid zugesagt hat, um es dir zu geben, ein Land mit großen und guten Städten, die du nicht gebaut hast,
  to: 'Und wenn Yahweh, dein Gott, dich in das Land bringt, das er deinen Vätern[a] – Abraham, Isaak und Jakob – unter Eid zugesagt hat: dir große und gute Städte zu geben, die du nicht gebaut hast,'
  rationale: Die Revision beseitigt die künstliche Beschränkung des Gebens auf das Land und bindet „große und gute Städte“ wieder unmittelbar an den hebräischen Infinitiv „zu geben“ an. „Unter Eid zugesagt“ gibt die Eidsprache natürlich wieder. Der Doppelpunkt verdeutlicht im Deutschen die inhaltliche Zusage, während der abschließende offene Satzanschluss erhalten bleibt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:53:54Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Gottesnamen, die Anrede im Singular, das Land, die genannten Erzväter und die nicht selbst gebauten Städte im Wesentlichen treffend wieder. Jedoch verengt „um es dir zu geben“ den Infinitiv לָתֶת לָךְ auf das Land und löst die nachfolgende Akkusativgruppe „große und gute Städte“ syntaktisch vom Geben. Im Hebräischen steht diese Gruppe unmittelbar als das, was Yahweh dem Angeredeten geben wird.
  naturalness: Der offene, mit Komma endende Satz ist für den versübergreifenden Zusammenhang angemessen. Die bisherige Ergänzung „ein Land mit“ ist zwar flüssig, verdeckt aber die unmittelbare Anbindung der Städte an „geben“. Die Revision stellt diese Anbindung in natürlichem modernem Deutsch klar.
  terminology: „Yahweh“, „dein Gott“, „Vätern“ sowie die deutschen Namenformen Abraham, Isaak und Jakob sind angemessen. Die Fußnote zu „Vätern“ ist sachlich, korrekt verankert und nicht wertend.
  issues:
