base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: de
  text: 'Und wenn Yahweh, dein Gott, dich in das Land bringt, das er deinen Vätern[a] – Abraham, Isaak und Jakob – unter Eid zugesagt hat: dir große und gute Städte zu geben, die du nicht gebaut hast,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Vorfahren“. Wörtlich steht im Hebräischen „deinen Vätern“; der Zusammenhang nennt ausdrücklich Abraham, Isaak und Jakob.'
    reason: Lexikalische Alternative und Erläuterung der konkreten Bezugnahme.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Konstruktion leitet einen künftigen Umstand ein. „Und wenn“ wahrt den Anschluss an den vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlich.
- source_word: יְבִיאֲךָ
  choice: dich in … bringt
  rationale: 'Der Hifil von בוא hat kausative Bedeutung: jemanden hineinbringen. Die deutsche Formulierung gibt dies idiomatisch wieder.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Suffix der zweiten Person Singular bezeichnet eindeutig „dein Gott“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Bundesverheißung bezeichnet אֶרֶץ das Israel zugesagte Land; „das Land“ bewahrt diesen Zusammenhang.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: das er … mit einem Eid zugesagt hat
  rationale: נשבע bezeichnet das Schwören eines Eides. Die Formulierung macht im Deutschen deutlich, dass das Land Gegenstand der eidlich bekräftigten Zusage ist, ohne die Eidsprache abzuschwächen.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Der maskuline Plural bezeichnet hier aufgrund der unmittelbar folgenden Namen konkret die Erzväter.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die Namen werden nach den üblichen deutschen Bibelnamensformen wiedergegeben. Im Deutschen genügt die appositionelle Aufzählung ohne Wiederholung der Präposition.
- source_word: לָתֶת לָךְ
  choice: um es dir zu geben
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise Inhalt der eidlichen Zusage; das Pronomen „es“ nimmt das Land auf und sorgt für eindeutige deutsche Syntax.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: großen und guten Städten
  rationale: „Groß“ bewahrt die Größen- beziehungsweise Bedeutungsangabe, „gut“ die bewusst allgemein gehaltene positive Bewertung des Hebräischen.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: die du nicht gebaut hast
  rationale: Die negierte Perfektform der zweiten Person Singular wird als direkte Relativkonstruktion wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: Jehova oder HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration „Yahweh“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verwandtschaftsbezeichnung in לַאֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: Der Text nennt unmittelbar Abraham, Isaak und Jakob. „Väter“ erhält daher die konkrete patriarchale Bezugnahme; eine Fußnote weist auf die mögliche allgemeinere Wiedergabe hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt wegen des über Vers 10 hinausführenden hebräischen Konditionals bewusst offen und endet mit einem Komma. „Ein Land mit“ wird zur natürlichen Anbindung der Städte ergänzt, ohne den Sinn zu verändern.
