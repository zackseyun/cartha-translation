  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: de
  text: Und es wird für uns Gerechtigkeit[a] sein, wenn wir darauf achten, dieses ganze Gebot[b] vor Jahwe, unserem Gott, zu befolgen, wie er es uns geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“. Das hebräische Wort kann das bezeichnen, was recht oder gerecht ist; im Zusammenhang des Bundes gibt „Gerechtigkeit“ die Aussage am umfassendsten wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „all dieses Gebot“. Der Singular bezeichnet die Weisung wahrscheinlich als zusammengehöriges Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה bezeichnet hier das, was recht bzw. gerecht ist. „Gerechtigkeit“ bewahrt im Deutschen sowohl die moralische als auch die auf das Bundesverhältnis bezogene Dimension, ohne eine spätere dogmatische Erklärung einzutragen.
- source_word: תִּהְיֶה לָּנוּ
  choice: es wird für uns … sein
  rationale: Die prädikative hebräische Formulierung wird eng nachgebildet. So wird weder „angerechnet“ noch eine andere, im Ausgangstext nicht ausdrücklich genannte Wirkweise ergänzt.
- source_word: כִּי
  choice: wenn
  rationale: Im Zusammenhang führt כִּי die Bedingung ein, unter der die Aussage gilt. „Wenn“ gibt diese Funktion im Deutschen klar wieder.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: wir darauf achten, … zu tun
  rationale: Die Verbindung von שׁמר mit dem Infinitiv עשה drückt sorgfältige, aufmerksame Befolgung aus. Die deutsche Wendung bewahrt beide verbalen Elemente ohne unnötige Wiederholung.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: dieses ganze Gebot
  rationale: Das Singularwort מִצְוָה bezeichnet mit כָּל die Weisung als zusammengehöriges Ganzes. „Dieses ganze Gebot“ ist im Deutschen natürlicher als „all dieses Gebot“ und erhält den Singular.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier das Handeln vor Gott bzw. in seiner Gegenwart. „Vor“ ist knapp, idiomatisch und wahrt diese Bundesdimension.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Form bewahrt sowohl die Gottesbezeichnung als auch die Beziehungsaussage des Suffixes der ersten Person Plural.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: wie er es uns geboten hat
  rationale: Die Form verweist auf das bereits ergangene Gebot. Das ergänzte Pronomen „es“ ist im Deutschen idiomatisch und nimmt das genannte Gebot auf.
theological_decisions:
- issue: Bedeutung von „Gerechtigkeit“ im Zusammenhang des Bundesgehorsams
  choice: Der Vers sagt, dass solcher Gehorsam „für uns Gerechtigkeit“ sein wird, ohne den genauen theologischen Mechanismus näher zu bestimmen.
  alternative: Die Aussage technisch als Anrechnung von Gerechtigkeit zu formulieren oder צְדָקָה ausschließlich mit „Recht“ wiederzugeben.
  rationale: Der hebräische Wortlaut verbindet die gewissenhafte Befolgung des Gebots tatsächlich mit Gerechtigkeit, erläutert aber keine spätere systematisch-theologische Kategorie. Die Formulierung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst etwas feierliche Wendung „es wird für uns Gerechtigkeit sein“ hält sich eng an die hebräische Prädikativkonstruktion und vermeidet eine interpretierende Umschreibung wie „es wird uns als Gerechtigkeit angerechnet“.
