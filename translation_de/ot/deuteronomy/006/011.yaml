base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: de
  text: und Häuser, voller aller guten Dinge, die du nicht gefüllt hast, und ausgehauene Zisternen[a], die du nicht ausgehauen hast, Weinberge und Ölbäume, die du nicht gepflanzt hast; und du wirst essen und satt werden[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brunnen“. Das hebräische Wort bezeichnet hier wahrscheinlich in den Fels gehauene Zisternen, in denen Wasser gesammelt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und du isst und satt wirst“. Die hebräischen Verben führen die Abfolge dessen fort, was nach Israels Einzug in das Land geschehen wird.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: בָתִּים
  choice: Häuser
  rationale: Die konkrete Pluralform passt zur Aufzählung der übernommenen materiellen Güter und vermeidet die gefühlsbetontere Bedeutung von „Heime“.
- source_word: מְלֵאִים כָּל טוּב
  choice: voll von allerlei Gutem
  rationale: Gibt die Fülle an wertvollen Gütern und Vorräten idiomatisch wieder, ohne den Ausdruck auf moralische Güte einzuengen.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: die du nicht gefüllt hast
  rationale: Bewahrt den Relativsatz, die singularische Anrede und den Gegensatz zwischen dem Empfangenen und der nicht selbst geleisteten Arbeit.
- source_word: בֹרֹת חֲצוּבִים
  choice: ausgehauene Zisternen
  rationale: בֹרֹת bezeichnet hier am ehesten Wasserspeicher; חֲצוּבִים weist auf das Aushauen, wahrscheinlich im Fels, hin.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: die du nicht ausgehauen hast
  rationale: Die Wiederholung von „ausgehauen“ bildet die lexikalische Entsprechung zwischen Partizip und Verb im Hebräischen ab.
- source_word: כְּרָמִים
  choice: Weinberge
  rationale: Bezeichnet kultivierte Weinpflanzungen beziehungsweise die entsprechenden Anbauflächen, nicht nur einzelne Reben.
- source_word: זֵיתִים
  choice: Ölbäume
  rationale: Die Pluralform kann die Bäume beziehungsweise Pflanzungen bezeichnen; „Ölbäume“ ist im Deutschen klar und entspricht der anschließenden Aussage über das Pflanzen.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: die du nicht gepflanzt hast
  rationale: Bewahrt die wiederholte Struktur der Güter, die Israel nicht selbst hervorgebracht hat.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: und du wirst essen und satt werden
  rationale: Die Verbfolge beschreibt im Zusammenhang das künftige Geschehen nach dem Einzug. „Satt werden“ gibt die körperliche Sättigung unmittelbar und natürlich wieder.
theological_decisions:
- issue: Charakter des verheißenen Überflusses
  choice: Die materiellen Güter werden schlicht als von Israel nicht selbst geschaffene Versorgung dargestellt.
  alternative: Schon in diesem Vers eine Warnung oder eine moralische Bewertung des Besitzes ausdrücklich einfügen.
  rationale: Der Vers zählt die empfangenen Güter auf; die ausdrückliche Warnung folgt erst im nächsten Vers. Die Übersetzung fügt daher weder eine Verurteilung noch eine konfessionelle Deutung hinzu.
- issue: Singularische Anrede Israels
  choice: Durchgehend „du“
  alternative: Pluralische Wiedergabe mit „ihr“
  rationale: Das Hebräische redet Israel im für das Deuteronomium typischen korporativen Singular an. Das deutsche „du“ bewahrt diese Form.
- issue: Zeitlicher Wert der abschließenden Verbfolge
  choice: 'Futurische Wiedergabe: „du wirst essen und satt werden“'
  alternative: 'Präsentische oder konditionale Wiedergabe: „du isst und satt wirst“ beziehungsweise „wenn du gegessen hast und satt bist“'
  rationale: Die Formen führen die Folge dessen fort, was beim Einzug in das Land geschehen wird. Die Zukunftsform macht dies im Deutschen deutlich, ohne die in Vers 12 anschließende Warnung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Aufzählungsstruktur. Die wiederholten Relativsätze und die singularische Anrede bleiben erhalten. Der Gedankenstrich am Ende zeigt an, dass der Satzgedanke in der Warnung des folgenden Verses weitergeführt wird.
