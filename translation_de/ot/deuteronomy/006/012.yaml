source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: de
  text: Hüte dich davor, Jahwe zu vergessen, der dich aus dem Land Ägypten, aus dem Haus der Sklaven[a], herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „aus dem Haus der Sklaverei“. Wörtlich steht im Hebräischen: „aus dem Haus der Sklaven“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Der Nifal-Imperativ mit לְךָ formuliert eine nachdrückliche persönliche Warnung. „Hüte dich davor“ gibt sowohl den Imperativ als auch den reflexiven Sinn natürlich wieder.
- source_word: פֶּן תִּשְׁכַּח
  choice: zu vergessen
  rationale: 'פֶּן leitet die zu vermeidende Gefahr ein. Nach „Hüte dich davor“ ist der Infinitiv im Deutschen idiomatisch und bewahrt den Warnsinn: Jahwe darf nicht vergessen beziehungsweise vernachlässigt werden.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im modernen Deutschen verbreitete wissenschaftliche Umschrift.
- source_word: הוֹצִיאֲךָ
  choice: dich … herausgeführt hat
  rationale: Der Hifil von יצא bedeutet im Exoduszusammenhang „herausführen“. Die deutsche Verbklammer verlangt die Stellung von „herausgeführt hat“ am Ende des Relativsatzes.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei und klingt im Deutschen natürlich.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Haus der Sklaven
  rationale: Die konkrete hebräische Wendung lautet wörtlich „aus dem Haus der Sklaven“. Diese Form wahrt das Bild und benennt den versklavten Status deutlich; die geläufigere abstrakte Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von עֲבָדִים in der Exodusformel
  choice: Sklaven
  alternative: Sklaverei; Knechtschaft
  rationale: Das hebräische Substantiv steht konkret im Plural und bezeichnet Menschen in einem unfreien Status. „Sklaven“ bewahrt diese Konkretheit; „Sklaverei“ ist idiomatischer, aber abstrakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringliche Formulierung „Hüte dich davor“ entspricht dem Warncharakter des hebräischen Imperativs. Das konkrete, im Deutschen leicht ungewöhnliche Bild „Haus der Sklaven“ bleibt erhalten und wird durch eine idiomatische Alternative in der Fußnote erläutert.
