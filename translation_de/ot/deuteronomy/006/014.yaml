  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: de
  text: Ihr sollt nicht anderen Göttern folgen[a], den Göttern der Völker rings um euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihr sollt nicht hinter anderen Göttern hergehen.“ Gemeint ist, ihnen Gefolgschaft zu leisten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: Ihr sollt nicht … folgen
  rationale: Die Verbindung von הלך mit אַחֲרֵי bezeichnet hier idiomatisch, sich jemandem anzuschließen beziehungsweise ihm religiöse Gefolgschaft zu leisten. „Folgen“ gibt dies im modernen Deutschen natürlicher wieder als das wörtliche „hinter … hergehen“.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die Wendung bezeichnet Gottheiten außer dem Gott Israels. „Andere Götter“ ist transparent und vermeidet die zusätzliche, im Adjektiv nicht ausdrücklich enthaltene Nuance „fremde“.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: den Göttern der Völker
  rationale: 'Das מ kann im Zusammenhang partitiv verstanden werden: Die anderen Götter gehören zu den Göttern der umliegenden Völker. Im Deutschen gibt die Apposition diese Beziehung klar und idiomatisch wieder, ohne ein unnatürliches „von den Göttern“.'
- source_word: הָעַמִּים
  choice: der Völker
  rationale: עַמִּים bedeutet hier die benachbarten Bevölkerungsgruppen; „Völker“ ist die direkte und geläufige deutsche Entsprechung.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: rings um euch
  rationale: Die knappe Ortsangabe bewahrt den Sinn der Israel umgebenden Völker und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Bedeutung des Verbots, anderen Göttern „zu folgen“
  choice: Das Verbot betrifft religiöse Gefolgschaft und Loyalität gegenüber anderen Gottheiten.
  alternative: Das Verbot bezeichne lediglich eine buchstäbliche Bewegung zu heidnischen Heiligtümern.
  rationale: הלך אחרי ist im deuteronomischen Sprachgebrauch eine feste Wendung für Gefolgschaft und religiöse Hinwendung. „Folgen“ bewahrt dieses Bild, ohne es enger mit „anbeten“ auszulegen.
- issue: Beziehung zwischen „anderen Göttern“ und „den Göttern der Völker“
  choice: Die zweite Wortgruppe wird als erläuternde Apposition wiedergegeben.
  alternative: Das מ wird ausdrücklich partitiv als „von den Göttern der Völker“ übersetzt.
  rationale: Ein partitiver Bezug ist grammatisch möglich, doch eine explizite Wiedergabe mit „von“ wäre im Deutschen missverständlich oder schwerfällig. Die Apposition vermittelt im Kontext denselben Referenzbereich klar und erhält die Aussage, dass es um Gottheiten der umliegenden Völker geht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Anrede steht entsprechend dem hebräischen Plural im Plural. „Rings um euch“ ist knapp und natürlich; die Fußnote bewahrt das hebräische Bewegungsbild.
