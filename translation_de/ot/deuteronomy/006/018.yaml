  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: de
  text: Du sollst tun, was in den Augen Jahwes recht und gut ist, damit es dir gut geht und du in das gute Land hineinziehst und es in Besitz nimmst[a], das Jahwe deinen Vätern zugeschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es als Erbe erhältst“. Das hebräische Verb kann „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten; hier geht es darum, dass Israel in das eidlich verheißene Land einzieht und es besitzt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst tun
  rationale: Die Verbform hat im Zusammenhang der Bundesunterweisung auffordernde, auf die Zukunft gerichtete Kraft. „Du sollst“ bewahrt den gebietenden Ton.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: was … recht und gut ist
  rationale: Die beiden ethischen Wertbegriffe bleiben erhalten und werden in natürlichem Deutsch als zusammengehörige Prädikate wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Bewertungsmetapher bleibt transparent erhalten; der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: damit es dir gut geht
  rationale: „Damit“ gibt Zweck beziehungsweise Folge wieder; die idiomatische Wendung bezeichnet umfassendes Wohlergehen und wird nicht auf materiellen Wohlstand verengt.
- source_word: וּבָאתָ
  choice: du … hineinziehst
  rationale: Das Verb bezeichnet hier das Hineingehen beziehungsweise Einziehen in das verheißene Land. „Hineinziehst“ macht die räumliche Bewegung im Deutschen deutlich.
- source_word: וְיָרַשְׁתָּ
  choice: es in Besitz nimmst
  rationale: ירשׁ kann „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten. Im Zusammenhang des Einzugs Israels bezeichnet es die tatsächliche Besitzergreifung des Landes.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: das gute Land
  rationale: Die schlichte wertende Bezeichnung des Hebräischen wird ohne interpretierende Verengung beibehalten.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: das Jahwe deinen Vätern zugeschworen hat
  rationale: „Zugeschworen“ drückt sowohl die Eidleistung als auch die Zusage des Landes idiomatisch aus; „Vätern“ wahrt den konkreten patriarchalischen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Bundesnamen. „Jahwe“ gibt ihn in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von לַאֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und verweist in diesem Zusammenhang auf die Väter, denen die Landverheißung eidlich zugesagt wurde.
- issue: Bedeutung von ירשׁ im Zusammenhang der Landgabe
  choice: in Besitz nehmen
  alternative: erben
  rationale: Der Text verbindet das Betreten des Landes mit seiner Aneignung. Die Übersetzung lässt durch eine Fußnote erkennen, dass das Verb zugleich im Sinn von „erben“ verstanden werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die hebräische Metapher „in den Augen“ und der feierliche Bundes- und Eidcharakter bleiben erhalten.
