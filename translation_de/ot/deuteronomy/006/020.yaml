source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: de
  text: 'Wenn dein Sohn dich künftig[a] fragt: »Was sind[b] die Zeugnisse, die Satzungen und die Rechtsbestimmungen, die Jahwe, unser Gott, euch geboten hat?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »morgen«; hier bezeichnet das hebräische Wort idiomatisch eine spätere Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: »Was bedeuten …?« Der hebräische Wortlaut fragt unmittelbar: »Was sind …?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier einen erwarteten künftigen Fall innerhalb einer Unterweisung ein; »wenn« gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: יִשְׁאָלְךָ
  choice: dich fragt
  rationale: שׁאל bedeutet hier schlicht »fragen«; das singularische Suffix wird durch »dich« bewahrt.
- source_word: בִנְךָ
  choice: dein Sohn
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und singular; deshalb wird es nicht zu »dein Kind« verallgemeinert.
- source_word: מָחָר
  choice: künftig
  rationale: Wörtlich bedeutet das Wort »morgen«, bezeichnet hier aber idiomatisch eine spätere Zeit. »Künftig« bewahrt den Zukunftsbezug knapp und natürlich.
- source_word: לֵאמֹר
  choice: 'fragt:'
  rationale: Der Infinitiv führt den Inhalt der Frage ein. Im natürlichen Deutschen genügt nach »fragt« ein Doppelpunkt; ein zusätzliches »und sagt« wäre schwerfällig.
- source_word: מָה
  choice: Was sind
  rationale: Die direkte Form des hebräischen Fragesatzes wird bewahrt. Eine Deutung als Frage nach Bedeutung oder Zweck ist möglich, wird aber nicht stillschweigend in den Haupttext eingetragen.
- source_word: הָעֵדֹת
  choice: die Zeugnisse
  rationale: »Zeugnisse« erhält den besonderen Bundes- und Bezeugungscharakter von עֵדֹת und unterscheidet den Ausdruck von den beiden folgenden Rechtstermini.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: »Satzungen« ist eine präzise, im Deutschen verständliche Rechtsbezeichnung und wahrt die Dreiergruppe unterschiedlicher Begriffe.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet rechtliche Entscheidungen oder Regelungen. »Rechtsbestimmungen« gibt den juristischen Sinn wieder, ohne ihn mit »Satzungen« gleichzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen übliche Form der wissenschaftlich begründeten Wiedergabe des Tetragramms.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die erste Person Plural und die Bundesbeziehung werden direkt wiedergegeben.
- source_word: צִוָּה ... אֶתְכֶם
  choice: euch geboten hat
  rationale: Das Objekt steht im Hebräischen in der zweiten Person Plural. »Euch« bewahrt den bedeutsamen Wechsel vom singularischen »dich« zur angesprochenen Gemeinschaft; das Perfekt ist im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen und keinen bloßen Titel. Die deutsche Namensform »Jahwe« macht dies sichtbar.
- issue: Geschlecht und Zahl von בִנְךָ
  choice: dein Sohn
  alternative: dein Kind
  rationale: Der Quelltext bezeichnet ausdrücklich einen Sohn im Singular; eine Neutralisierung würde diese Einzelheit beseitigen.
- issue: Wechsel vom singularischen Adressaten zum Pluralobjekt
  choice: dich … euch
  alternative: dich … dir
  rationale: Der Sohn fragt einen einzelnen Vater, spricht am Ende aber von dem Gebot an die Mehrzahl der Israeliten. Dieser grammatisch und theologisch relevante Wechsel bleibt erhalten.
- issue: Sinn der Frage מָה הָעֵדֹת
  choice: Was sind die Zeugnisse …?
  alternative: Was bedeuten die Zeugnisse …?
  rationale: Der hebräische Wortlaut fragt direkt »Was sind …?«; im Zusammenhang kann eine Bitte um Erklärung oder Bedeutung mitgemeint sein. Der Haupttext wahrt die offene Form, die Fußnote nennt die sinngemäße Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Dreierformel bleibt durch drei unterschiedliche Substantive erkennbar. Der Infinitiv לֵאמֹר wird nicht hölzern mit »indem er sagt« wiederholt, sondern durch die deutsche Zeichensetzung in die direkte Frage überführt.
