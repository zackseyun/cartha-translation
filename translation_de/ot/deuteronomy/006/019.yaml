translation:
  language: de
  text: um alle deine Feinde vor dir her zu vertreiben, wie Jahwe gesagt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor dir“; die hebräische Wendung bezeichnet das Entfernen der Feinde aus deinem Weg oder deiner Gegenwart. Auch: „wie Jahwe sprach/sagte“; das hebräische Verb bezeichnet ein früher ergangenes göttliches Wort, das weiterhin gilt.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: zu vertreiben
  rationale: Der Infinitiv mit ל setzt die Zweck- bzw. Folgeangabe aus dem vorhergehenden Vers fort. Die Hifil-Form von נדף bezeichnet hier das Wegtreiben oder Verdrängen der Feinde; „vertreiben“ ist im Deutschen natürlich und dem militärischen Zusammenhang angemessen.
- source_word: אֶת
  choice: '[Akkusativmarker, unübersetzt]'
  rationale: Der hebräische Marker des bestimmten direkten Objekts hat im Deutschen keine eigene Entsprechung.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ gibt die umfassende Bedeutung von כָּל vor dem pluralischen Substantiv unmittelbar wieder.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Die Wiedergabe bewahrt den Singular der persönlichen Anrede an Israel.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Wörtlich steht „von deinem Angesicht weg/vor dir weg“. Im Zusammenhang bezeichnet die Wendung die Entfernung der Feinde aus Israels Weg oder Gegenwart; „vor dir vertreiben“ ist im Deutschen idiomatisch, während die Fußnote die hebräische Bildlichkeit erläutert.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: „Wie“ drückt knapp und natürlich die Übereinstimmung mit dem zuvor ergangenen göttlichen Wort aus.
- source_word: דִּבֶּר
  choice: gesagt hat
  rationale: Das Perfekt bezeichnet ein zuvor gesprochenes Wort, das für die geschilderte Handlung maßgeblich bleibt. „Gesagt hat“ ist natürliches Deutsch und bleibt näher am Verb דבר als das stärker deutende „versprochen hat“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von דִּבֶּר im Bundeszusammenhang
  choice: gesagt hat
  alternative: sagte; versprochen hat
  rationale: „Gesagt hat“ bewahrt die lexikalische Bedeutung „reden/sagen“ und lässt zugleich erkennen, dass das frühere göttliche Wort weiterhin gilt. „Versprochen hat“ würde den Zusammenhang plausibel, aber stärker deutend festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Da der Vers syntaktisch an den vorhergehenden Satz anschließt, beginnt die Übersetzung mit „um“. Die Anrede an Israel bleibt entsprechend dem Hebräischen im Singular.
