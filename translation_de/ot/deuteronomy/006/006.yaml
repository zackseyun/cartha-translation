base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: de
  text: Und diese Worte, die ich dir heute gebiete, sollen in deinem Herzen sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf deinem Herzen“. Das hebräische Bild bezeichnet, dass diese Worte im Inneren beständig gegenwärtig und bewahrt sein sollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: sollen … liegen
  rationale: Die Form trägt im Zusammenhang der vorausgehenden Aufforderung einen verpflichtenden beziehungsweise zukunftsgerichteten Sinn. Die deutsche Wendung gibt diesen Sinn natürlich wieder.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: „Worte“ entspricht דְּבָרִים unmittelbar und verweist hier auf die soeben ausgesprochenen Gebote, ohne den Ausdruck interpretierend auf „Gebote“ zu verengen.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen verbindet den Bezug auf „diese Worte“ idiomatisch und eindeutig.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen kann Nachdruck tragen; im Deutschen vermittelt „ich“ den Sprecherbezug angemessen, ohne eine nicht zwingende Verstärkung einzuführen.
- source_word: מְצַוְּךָ
  choice: dir … gebiete
  rationale: Das Partizip bezeichnet den gegenwärtigen Sprechakt. „Dir heute gebiete“ ist im Deutschen natürlich, würdevoll und bewahrt den verpflichtenden Charakter.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ gibt die zeitliche Unmittelbarkeit der Rede direkt und in modernem Deutsch wieder.
- source_word: עַל לְבָבֶךָ
  choice: dir am Herzen liegen
  rationale: Die feste deutsche Wendung bewahrt das Bild des Herzens und gibt den Gedanken fortdauernder innerer Gegenwart natürlich wieder; eine Fußnote weist auf die wörtlichere hebräische Form hin.
theological_decisions:
- issue: Anthropologische Bedeutung von לְבָב
  choice: Herz
  alternative: Verstand; Inneres
  rationale: Das hebräische „Herz“ umfasst Denken, Wollen und Empfinden. Die Beibehaltung des Herzbildes vermeidet eine Verengung auf den Verstand oder eine abstrakte Umschreibung.
- issue: Verbindlichkeit von וְהָיוּ
  choice: sollen
  alternative: werden; müssen
  rationale: „Sollen“ hält den auffordernden und zukunftsgerichteten Charakter zusammen, ohne den Satz entweder nur als Vorhersage oder als verschärften Zwang auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dir am Herzen liegen“ ist allgemein verständlich und idiomatisch; die Fußnote erhält zugleich das konkrete Bild und die Präposition des Hebräischen.
