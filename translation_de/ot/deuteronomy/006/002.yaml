base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: de
  text: damit du Jahwe, deinen Gott, fürchtest[a], indem du alle seine Satzungen und Gebote hältst, die ich dir gebiete – du, dein Sohn und der Sohn deines Sohnes[b] – alle Tage deines Lebens, und damit deine Tage verlängert werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht vor Jahwe, deinem Gott, hast.“ Das hebräische Verb umfasst Furcht, Ehrfurcht und Scheu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „du, dein Sohn und der Sohn deines Sohnes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Sinngemäß: „damit du lange lebst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: damit du … fürchtest
  rationale: Die Zweckkonstruktion wird mit „damit“ wiedergegeben. „Fürchten“ bewahrt bei der auf Gott bezogenen Wurzel ירא das Bedeutungsspektrum von Furcht, Ehrfurcht und Scheu.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen etablierte Umschrift des Tetragramms.
- source_word: לִשְׁמֹר
  choice: indem du … hältst
  rationale: Der Infinitiv bezeichnet hier, wie sich die Gottesfurcht zeigt. „Indem“ macht diesen Zusammenhang im Deutschen verständlich, ohne ihn von der Gottesfurcht zu trennen.
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: seine Satzungen und Gebote
  rationale: Die beiden unterschiedlichen hebräischen Rechtsbegriffe bleiben auch in der Übersetzung unterschieden; „Satzungen“ und „Gebote“ entsprechen dem würdigen Bundes- und Gesetzesregister.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: die ich dir gebiete
  rationale: Die Form bezeichnet das gegenwärtige Gebieten Moses. Das natürliche deutsche Präsens gibt dies angemessen wieder.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: du, dein Sohn und der Sohn deines Sohnes
  rationale: Die drei ausdrücklich genannten Generationen und die wörtliche Geschlechterfolge werden bewahrt. Die Gedankenstriche geben den hervorgehobenen Einschub wieder.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: alle Tage deines Lebens
  rationale: Die bildhafte und zeitlich umfassende Formulierung des Hebräischen bleibt in natürlichem Deutsch erhalten.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: und damit deine Tage lange währen
  rationale: Das zweite לְמַעַן wird als weitere Zweck- beziehungsweise Folgeangabe gekennzeichnet. „Deine Tage lange währen“ bewahrt das hebräische Bild, klingt aber natürlicher als eine passive Verlängerungsformulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Umschrift wahrt dies, statt den Namen durch einen Titel zu ersetzen.
- issue: Bedeutung von ירא gegenüber Gott
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ erhält die theologische Spannung zwischen Furcht, Ehrfurcht und heiliger Scheu; eine bloße Wiedergabe als Respekt wäre zu eng.
- issue: Verhältnis von Gottesfurcht und Gehorsam
  choice: indem du … hältst
  alternative: und alle … hältst
  rationale: Der Infinitiv verbindet die Gottesfurcht eng mit dem Halten der Gebote. Die Übersetzung stellt Gehorsam als Ausdruck beziehungsweise Vollzug dieser Furcht dar, ohne beide gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem Bundes- und Gesetzeswortschatz. Der Gottesname erscheint als „Jahwe“. Die Satzstruktur folgt der langen hebräischen Zweckkonstruktion, wird aber durch Kommas und Gedankenstriche lesbar gegliedert.
