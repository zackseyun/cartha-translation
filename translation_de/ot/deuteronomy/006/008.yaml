  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: de
  text: Du sollst sie als Zeichen auf deine Hand binden, und sie sollen als Stirnschmuck[a] zwischen deinen Augen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stirnbänder“; traditionell auch mit Tefillin verbunden. Das seltene hebräische Wort bezeichnet wohl etwas, das im Stirnbereich getragen wird; seine genaue Bedeutung ist unsicher. Tefillin sind kleine Schriftkapseln, die in später belegter jüdischer Praxis mit Riemen getragen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Du sollst sie … binden
  rationale: Die Verbform führt die Anweisungsfolge fort. „Sollst … binden“ gibt den verpflichtenden Charakter und die konkrete Handlung wieder; das Suffix „sie“ verweist ausdrücklich auf die zuvor genannten Worte.
- source_word: לְאוֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet ein Zeichen oder Merkmal. „Als Zeichen“ gibt das לְ der Bestimmung natürlich wieder, ohne die symbolische Funktion näher festzulegen.
- source_word: עַל יָדֶךָ
  choice: an deine Hand
  rationale: יָד bedeutet gewöhnlich „Hand“, kann aber mitunter auch den Arm einschließen. „Hand“ bewahrt den unmittelbaren Wortlaut; „Arm“ wäre stärker deutend.
- source_word: וְהָיוּ
  choice: und sie sollen … sein
  rationale: Das Verb setzt die verpflichtende Anweisungsfolge fort und wahrt zugleich den Parallelismus zum ersten Satzteil.
- source_word: לְטֹטָפֹת
  choice: als Stirnschmuck
  rationale: טֹטָפֹת ist ein seltenes, in seiner genauen Bedeutung unsicheres Wort für etwas, das im Stirnbereich getragen wird. „Stirnschmuck“ bleibt anschaulich und vermeidet es, die spätere konkrete Gestalt der Gebetsriemen bereits in den Haupttext einzutragen.
- source_word: בֵּין עֵינֶיךָ
  choice: zwischen deinen Augen
  rationale: Die wörtliche hebräische Wendung bewahrt das körperliche Bild und lässt offen, ob die Anweisung wörtlich, sinnbildlich oder in beiderlei Sinn zu verstehen ist.
theological_decisions:
- issue: Ob die Anweisung als wörtliche körperliche Praxis, als Bild für beständige Erinnerung oder in beiderlei Sinn zu verstehen ist
  choice: Die konkrete körperliche Bildsprache bleibt erhalten, ohne die Auslegungsfrage zu entscheiden.
  alternative: Deutende Wiedergabe als bloßes Erinnerungsbild oder ausdrückliche Identifizierung mit den späteren Gebetsriemen.
  rationale: Der hebräische Text verwendet konkrete Ausdrücke, legt deren Verhältnis zu einer sinnbildlichen Bedeutung jedoch nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die konkrete hebräische Bildsprache. Das seltene טֹטָפֹת wird verständlich, aber bewusst nicht historisch überpräzise wiedergegeben.
