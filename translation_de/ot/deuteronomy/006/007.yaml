base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: de
  text: Du sollst sie deinen Söhnen[b] sorgfältig einprägen[a] und von ihnen reden, wenn du in deinem Haus sitzt und wenn du auf dem Weg gehst, wenn du dich hinlegst und wenn du aufstehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb hat wörtlich den Sinn von „schärfen“ und bezeichnet hier bildlich sorgfältige, wiederholte Unterweisung.
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische sagt ausdrücklich „deinen Söhnen“; die Unterweisung kann darüber hinaus den Familien- und Haushaltsverband insgesamt betreffen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Du sollst sie ... sorgfältig einprägen
  rationale: שׁנן bezeichnet wörtlich das Schärfen und hier bildlich ein eindringliches, wiederholtes Lehren. „Sorgfältig einprägen“ bewahrt sowohl die pädagogische Bedeutung als auch etwas von der Intensität des Bildes.
- source_word: לְבָנֶיךָ
  choice: deinen Söhnen
  rationale: בנים ist morphologisch maskuliner Plural mit Suffix der 2. Person Singular und bedeutet unmittelbar „deine Söhne“. Die Übersetzung bewahrt diese konkrete Form; die mögliche weitere Reichweite wird in einer Fußnote erläutert.
- source_word: וְדִבַּרְתָּ בָּם
  choice: und von ihnen reden
  rationale: דבר mit ב und pronominalem Suffix bedeutet in diesem Zusammenhang idiomatisch, über die zuvor genannten Worte zu sprechen. „Von ihnen reden“ ist natürlich und würdevoll.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: wenn du in deinem Haus sitzt
  rationale: Die Infinitivkonstruktion mit ב bezeichnet einen zeitlichen Begleitumstand und wird knapp und habituell wiedergegeben.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: wenn du auf dem Weg gehst
  rationale: דרך bezeichnet Weg oder Straße. „Auf dem Weg gehen“ bleibt dem Bild des hebräischen Textes nahe und ist im Deutschen verständlich.
- source_word: וּבְשָׁכְבְּךָ
  choice: wenn du dich hinlegst
  rationale: Die Wendung bezeichnet das Sichhinlegen, besonders zum Schlafen. Die reflexive deutsche Form ist idiomatisch.
- source_word: וּבְקוּמֶךָ
  choice: wenn du aufstehst
  rationale: Die Wendung bezeichnet das Aufstehen, im Gegensatz zum Sichhinlegen, und kann besonders das morgendliche Aufstehen meinen.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Nachkommen in der Bundesunterweisung
  choice: deinen Söhnen
  alternative: deinen Kindern
  rationale: Der hebräische Wortlaut nennt ausdrücklich „deine Söhne“. Diese Form wird nicht stillschweigend verallgemeinert; zugleich weist die Fußnote auf die mögliche Anwendung im weiteren Familien- und Haushaltsverband hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die rhythmische Folge der alltäglichen Situationen wird bewahrt. Das intensive Lehrverb wird verständlich wiedergegeben, ohne sein Bild völlig zu glätten.
