  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: de
  text: Du sollst sie auf die Türpfosten deines Hauses und an deine Tore schreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und an deine Torpfosten“ beziehungsweise „und bei deinen Toren“. Das hebräische Wort kann die Tore selbst, die Toranlage oder den Eingangsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Du sollst sie schreiben
  rationale: Das Qal-Perfekt mit vorangestelltem וּ steht in der fortlaufenden Gebotsreihe und wird im Deutschen natürlich als Anweisung mit „sollst“ wiedergegeben. Das Objektsuffix „sie“ verweist auf die zuvor genannten Worte und bleibt ausdrücklich erhalten.
- source_word: עַל מְזוּזֹת
  choice: auf die Türpfosten
  rationale: מְזוּזוֹת bezeichnet die seitlichen Pfosten eines Eingangs. „Türpfosten“ ist im Deutschen präzise und verständlich; עַל wird räumlich mit „auf“ wiedergegeben.
- source_word: בֵּיתֶךָ
  choice: deines Hauses
  rationale: „Haus“ entspricht dem konkreten Sinn von בַּיִת und wahrt den Bezug zum Gebäude bzw. Haushalt.
- source_word: וּבִשְׁעָרֶיךָ
  choice: und an deine Tore
  rationale: שְׁעָרֶיךָ bezeichnet deine Tore bzw. Toranlagen. Im Deutschen ist „an deine Tore schreiben“ idiomatischer als „auf deine Tore“, ohne die räumliche Zuordnung der Inschrift aufzugeben.
