base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: de
  text: Und Jahwe ließ vor unseren Augen in Ägypten, am Pharao und an seinem ganzen Haus große und schlimme Zeichen und Wunder geschehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Jahwe ließ vor unseren Augen in Ägypten große und unheilvolle Zeichen und Wunder gegen den Pharao und sein ganzes Haus geschehen.“ Das hebräische ב kann bei Ägypten den Ort bezeichnen und bei Ägypten, dem Pharao und seinem Haus auch die Betroffenen. „Haus“ kann Haushalt, Hof oder Dynastie meinen.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ließ … kommen
  rationale: נתן bedeutet wörtlich „geben/setzen“. In Verbindung mit Zeichen und Wundern gibt „ließ … kommen“ das bewirkende Handeln im Deutschen natürlich wieder, ohne das allgemeinere „tat“ oder „vollbrachte“ einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: Zeichen und Wunder
  rationale: Die feste Wortverbindung gibt beide hebräischen Begriffe präzise und im Deutschen idiomatisch wieder.
- source_word: גְּדֹלִים וְרָעִים
  choice: große und schreckliche
  rationale: רָעִים bezeichnet hier die schlimme, verderbliche Wirkung der Zeichen und Wunder, nicht moralische Bosheit. „Schrecklich“ bewahrt ihre bedrohliche und verheerende Qualität.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Die Präposition ב wird hier zunächst in ihrem natürlichen lokalen Sinn wiedergegeben; dass Ägypten zugleich betroffen war, ergibt sich aus dem Zusammenhang.
- source_word: בְּפַרְעֹה וּבְכָל בֵּיתוֹ
  choice: über den Pharao und sein ganzes Haus
  rationale: Bei den Betroffenen gibt „über … kommen“ die zielgerichtete, schädigende Wirkung idiomatisch wieder. „Haus“ wahrt das hebräische Bild und kann Haushalt, Hof oder Dynastie umfassen.
- source_word: לְעֵינֵינוּ
  choice: vor unseren Augen
  rationale: Die hebräische Wendung bezeichnet unmittelbare Augenzeugenschaft und wird durch die entsprechende deutsche Redewendung treffend wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. Seine Wiedergabe als „Jahwe“ bewahrt diese textliche Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutung von וְרָעִים bei Gottes Taten
  choice: schreckliche
  alternative: böse; verderbliche
  rationale: Das Adjektiv beschreibt hier die unheilvolle Wirkung der Gerichtszeichen auf Ägypten. „Böse“ könnte im heutigen Deutsch fälschlich moralische Verwerflichkeit der göttlichen Taten aussagen.
- issue: Bezug der mehrfachen Präposition ב
  choice: in Ägypten … über den Pharao und sein ganzes Haus
  alternative: gegen Ägypten, gegen den Pharao und gegen sein ganzes Haus
  rationale: Die Formulierung bewahrt beim ersten Ausdruck den naheliegenden lokalen Sinn, während sie bei Pharao und seinem Haus den kontextuell erkennbaren Bezug als Betroffene ausdrückt, ohne die grammatische Mehrdeutigkeit vollständig zu nivellieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält „vor unseren Augen“ eng beim Geschehen, und „sein ganzes Haus“ bewahrt die bildhafte, semantisch offene Ausdrucksweise des Hebräischen.
