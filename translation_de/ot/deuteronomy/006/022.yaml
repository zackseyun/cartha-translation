    rationale: „Schrecklich“ kann vor allem „angsterregend“ bedeuten. Im Kontext bezeichnet רָעִים eher die schlimme bzw. unheilvolle Wirkung. „schlimme“ ist semantisch breiter und näher an der wertenden Grundbedeutung.
