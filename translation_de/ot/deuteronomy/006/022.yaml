  naturalness: „Jahwe ließ vor unseren Augen in Ägypten, am Pharao und an seinem ganzen Haus große und schlimme Zeichen und Wunder geschehen“ ist modernes, würdiges Standarddeutsch. Es bewahrt die hebräische Reihung und vermeidet die etwas sperrige Verbindung „Zeichen und Wunder über jemanden kommen lassen“.
  terminology: „Jahwe“, „Zeichen und Wunder“ sowie „sein ganzes Haus“ sind passend. „Schlimme“ gibt רָעִים als schädlich/unheilvoll wieder, ohne moralisches Bösesein zu unterstellen; die Fußnote bietet „unheilvolle“ als präzisierende Alternative.
