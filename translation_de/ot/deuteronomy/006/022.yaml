revisions:
- from: Und Jahwe ließ in Ägypten vor unseren Augen große und schreckliche Zeichen und Wunder über den Pharao und sein ganzes Haus kommen.[a]
  to: Und Jahwe ließ vor unseren Augen in Ägypten, am Pharao und an seinem ganzen Haus große und schlimme Zeichen und Wunder geschehen.[a]
  rationale: Die Revision wahrt die lokale Lesart von „in Ägypten“ im Haupttext, gibt die auf Pharao und sein Haus bezogene Formulierung jedoch mit der im Deutschen bei „Zeichen und Wunder“ natürlicheren Präposition „an“ wieder. Die Fußnote hält die kontextuell mögliche adversative Lesart offen. Die Anpassung von „schreckliche“ zu „schlimme“ vermeidet eine unnötige Verengung auf Furchterregendes und bewahrt die unheilvolle Wirkung von רָעִים.
