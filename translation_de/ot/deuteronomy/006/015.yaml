source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: de
  text: Denn Yahweh, dein Gott, der in deiner Mitte ist, ist ein eifersüchtiger Gott[a]. Sonst entbrennt der Zorn Yahwehs, deines Gottes, gegen dich, und er vernichtet dich vom Erdboden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein leidenschaftlich eifernder Gott“. Gemeint ist Yahwehs ausschließlicher Anspruch auf die Treue seines Bundesvolkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von der Oberfläche des Erdbodens“; eine Wendung für vollständige Beseitigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das Verbot im vorhergehenden Vers ein und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: אֵל קַנָּא
  choice: ein eifersüchtiger Gott
  rationale: Bezeichnet Yahwehs ausschließlichen Bundesanspruch und seine Unduldsamkeit gegenüber der Verehrung anderer Götter. „Eifersüchtig“ bewahrt dabei die Spannung des hebräischen Ausdrucks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Entspricht der Form mit Suffix der zweiten Person Maskulinum Singular.
- source_word: בְּקִרְבֶּךָ
  choice: der in deiner Mitte ist
  rationale: Drückt Yahwehs Gegenwart mitten unter seinem Volk räumlich und bundesbezogen aus; der Relativsatz ergibt im Deutschen einen natürlichen Satzbau.
- source_word: פֶּן
  choice: Sonst
  rationale: Leitet die drohende Folge eines Verstoßes ein und ist in modernem Deutsch klarer und natürlicher als „damit nicht“.
- source_word: יֶחֱרֶה אַף
  choice: entbrennt der Zorn
  rationale: Bewahrt das hebräische Bild vom brennenden beziehungsweise aufflammenden Zorn in idiomatischem Deutsch.
- source_word: בָּךְ
  choice: gegen dich
  rationale: Die Präposition bezeichnet bei einem Verb des Zorns die gegen die angesprochene Person gerichtete Reaktion.
- source_word: וְהִשְׁמִידְךָ
  choice: und er vernichtet dich
  rationale: Das Hifil von שׁמד bezeichnet vollständige Vernichtung oder Beseitigung; „vernichten“ gibt die Härte der Warnung präzise wieder.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Erdboden
  rationale: Gibt die hebräische Wendung knapp und idiomatisch wieder; gemeint ist die vollständige Entfernung aus dem Lebensraum.
theological_decisions:
- issue: Wiedergabe der göttlichen Eifersucht
  choice: ein eifersüchtiger Gott
  alternative: ein leidenschaftlich eifernder Gott
  rationale: Der Ausdruck bezeichnet keinen sündhaften Neid, sondern Yahwehs ausschließlichen Anspruch auf die Treue seines Bundesvolkes. „Eifersüchtig“ bewahrt die echte theologische Spannung, während die Fußnote den Sinn erläutert.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Umschrift „Yahweh“ wahrt seinen Charakter als persönlichen Bundesnamen.
- issue: Reichweite von הָאֲדָמָה
  choice: Erdboden
  alternative: Land
  rationale: „Erdboden“ erhält die Bildhaftigkeit der Wendung und lässt offen, ob der unmittelbare Schwerpunkt auf dem Land oder allgemeiner auf dem bewohnten Boden liegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular wird entsprechend dem Hebräischen beibehalten. Der Satzbau ist leicht geglättet, während die Metapher des entbrennenden Zorns und die Härte der Vernichtungsandrohung erhalten bleiben.
