  terminology: „Yahweh“ folgt der vorgegebenen Namenspraxis. „Eifersüchtiger Gott“ bewahrt die im Bundeszusammenhang wichtige, auch im Deutschen spannungsvolle Metapher, ohne sie dogmatisch abzuschwächen. Die Fußnote nennt mit „leidenschaftlich eifernder“ eine mögliche sinngemäße Alternative und erläutert den exklusiven Bundesanspruch. „Vom Erdboden“ ist für מֵעַל פְּנֵי הָאֲדָמָה idiomatisch und treffend.
