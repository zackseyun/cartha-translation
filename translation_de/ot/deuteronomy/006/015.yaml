  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und die wesentlichen Sinnelemente zuverlässig wieder: כִּי als begründendes „Denn“, אֵל קַנָּא als „ein eifersüchtiger Gott“, Gottes Gegenwart „in deiner Mitte“, die mit פֶּן eingeleitete Warnfolge, das Entbrennen des Zorns, die gegen dich gerichtete Reaktion sowie die Vernichtung „vom Erdboden“. „Sonst“ ist für פֶּן im modernen Deutschen eine angemessene, kontextgerechte Warnformulierung.'
