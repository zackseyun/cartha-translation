base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: de
  text: und ihr habt ihre abscheulichen Dinge und ihre Götzen[a] gesehen – Holz und Stein, Silber und Gold –, die bei ihnen waren—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist eine verächtliche Bezeichnung für Götzen und kann eine derbe Nebenbedeutung haben, etwa „Mistgötzen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: und ihr habt … gesehen
  rationale: Das Qal-Wayyiqtol, 2. Person Plural, führt den Rückblick in Moses Anrede fort. Im Deutschen gibt das Perfekt die erinnerte Wahrnehmung natürlich wieder.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihre abscheulichen Dinge
  rationale: שִׁקּוּץ bezeichnet etwas Abscheuliches, besonders im Zusammenhang mit Götzendienst. Die Formulierung wahrt den starken Ausdruck des Abscheus und hält diesen Begriff von גִּלּוּלִים auseinander.
- source_word: גִּלֻּלֵיהֶם
  choice: ihre Götzen[a]
  rationale: גִּלּוּלִים ist eine verächtliche Bezeichnung für Götzen. „Götzen“ nennt den Bezug klar; die möglicherweise derbe Nebenbedeutung wird in der Fußnote bewahrt.
- source_word: עֵץ וָאֶבֶן
  choice: aus Holz und Stein
  rationale: Die Substantive bezeichnen hier am ehesten die Materialien der zuvor genannten Kultgegenstände. „Aus“ macht diese Beziehung im Deutschen knapp und natürlich deutlich.
- source_word: כֶּסֶף וְזָהָב
  choice: aus Silber und Gold
  rationale: Die Materialaufzählung wird parallel zu „aus Holz und Stein“ wiedergegeben; die Wiederholung der Präposition dient im Deutschen der Klarheit.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: die bei ihnen waren
  rationale: Die relative Wendung bezeichnet die Anwesenheit der Kultgegenstände bei den zuvor genannten Völkern, ohne Besitz stärker zu behaupten, als es der hebräische Ausdruck verlangt.
theological_decisions:
- issue: Wiedergabe der beiden abwertenden Bezeichnungen für heidnische Kultgegenstände
  choice: „abscheuliche Dinge“ und „Götzen“ als zwei unterscheidbare Ausdrücke
  alternative: „Gräuel“ und „Mistgötzen“
  rationale: Der hebräische Text verwendet zwei verschiedene, stark abwertende Wörter. Die Haupttextfassung bewahrt ihre Unterscheidung und ihren wertenden Charakter, bleibt aber für heutige Leser verständlich; die derbere mögliche Nuance von גִּלּוּלִים steht in der Fußnote.
- issue: Bezug von אֲשֶׁר עִמָּהֶם
  choice: „die bei ihnen waren“, bezogen auf die Kultgegenstände bei den Völkern
  alternative: „die ihnen gehörten“
  rationale: Der Kontext weist auf die Völker des vorherigen Verses. „Bei ihnen“ erhält die räumlich-assoziative Offenheit von עִם und unterstellt weder Israel den Besitz der Götzen noch ausdrücklich ein Eigentumsverhältnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt entspricht natürlicher deutscher Rückschau. Der Gedankenstrich hält den im Kontext weiterführenden Satz offen.
