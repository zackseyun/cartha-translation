  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die einzelnen Verben sachgerecht wieder: הלך als „gingen hin“, עבד als „dienten“ und השתחוה als konkrete Niederwerfung. Die Wiederaufnahme „Göttern, die …“ entspricht der erneuten Nennung von אֱלֹהִים. Das Plusquamperfekt („nicht gekannt hatten“, „nicht zugeteilt hatte“) ist im deutschen Erzählzusammenhang gut vertretbar. Das implizite Subjekt von חָלַק wird mit „er“ kontextgemäß als Gott verstanden, ohne die im Hebräischen vorhandene implizite Form zu verschleiern.'
