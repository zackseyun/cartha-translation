base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: de
  text: Sie gingen hin, dienten anderen Göttern und warfen sich vor ihnen nieder – Göttern, die sie nicht gekannt hatten und die er ihnen nicht zugeteilt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die ihnen nicht zugeteilt worden waren“. Im Hebräischen ist das Subjekt des singularischen Verbs nicht ausdrücklich genannt; wahrscheinlich ist Gott gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: sie gingen hin
  rationale: הלך bedeutet grundsätzlich „gehen“. „Sie gingen hin“ bewahrt die hebräische Handlungsfolge und deutet das Verb nicht vorschnell metaphorisch als „sie wandten sich ab“ oder „sie folgten“.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד bezeichnet hier das Dienen beziehungsweise den kultischen Dienst. „Dienten“ hält diesen Aspekt von der anschließenden Niederwerfung unterschieden.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Dies ist die direkte und im Deutschen natürliche Wiedergabe. „Fremden Göttern“ wäre möglich, würde aber eine zusätzliche Bedeutungsnuance eintragen.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: warfen sich vor ihnen nieder
  rationale: שׁחה bezeichnet eine körperliche Niederwerfung. Die Formulierung bewahrt dieses konkrete Bild, statt das Verb nur allgemein mit „anbeten“ wiederzugeben.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: Göttern, die sie nicht gekannt hatten
  rationale: ידע kann über bloße Kenntnis hinaus vertraute oder relationale Bekanntschaft bezeichnen. Das Plusquamperfekt ordnet die fehlende vorherige Kenntnis im deutschen Erzählzusammenhang klar ein.
- source_word: וְלֹא חָלַק לָהֶם
  choice: und die er ihnen nicht zugeteilt hatte
  rationale: חלק bedeutet „teilen, zuteilen, als Anteil geben“. Das nicht ausdrücklich genannte Subjekt des singularischen Verbs wird kontextgemäß mit „er“ wiedergegeben, ohne den Gottesnamen in den Text einzufügen.
theological_decisions:
- issue: Nicht genanntes Subjekt des singularischen Verbs חָלַק
  choice: „die er ihnen nicht zugeteilt hatte“, wobei „er“ auf Gott verweist
  alternative: „die ihnen nicht zugeteilt worden waren“
  rationale: Im Hebräischen steht ein Verb in der 3. Person maskulin Singular ohne ausdrücklich genanntes Subjekt. Im Kontext liegt Gott als Handelnder nahe. Da die Konstruktion dennoch eine gewisse Offenheit besitzt, wird die unpersönlich-passive Wiedergabe als Alternative in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Warfen sich vor ihnen nieder“ erhält die konkrete kultische Gebärde; der Gedankenstrich macht die nachgestellte Erläuterung „Göttern …“ verständlich, ohne die hebräische Wiederaufnahme zu glätten.
