source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: de
  text: Brot habt ihr nicht gegessen, und Wein und berauschendes Getränk[a] habt ihr nicht getrunken, damit ihr erkennt, dass ich Jahwe, euer Gott, bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet allgemein ein vergorenes, berauschendes Getränk neben Wein; auch »Rauschtrank« oder »starkes Getränk« ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung »Brot« entspricht dem Hebräischen; eine Verallgemeinerung zu »Nahrung« ist hier nicht erforderlich.
- source_word: יַיִן
  choice: Wein
  rationale: Dies ist die übliche und kontextuell passende Bedeutung.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Der Ausdruck bezeichnet allgemein ein alkoholisches, vergorenes Getränk neben Wein. Diese Wiedergabe ist im heutigen Deutsch verständlicher und weniger eng als »Bier«.
- source_word: לְמַעַן תֵּדְעוּ
  choice: damit ihr erkennt
  rationale: Die Formulierung gibt die Zweck- beziehungsweise Ergebnisbeziehung wieder; »erkennt« bezeichnet hier ein aus Erfahrung gewonnenes Wissen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Possessivverbindung wird unmittelbar wiedergegeben und bewahrt die Aussage der Bundesbeziehung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Gottesname selbst. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zweck oder Ergebnis von לְמַעַן
  choice: damit ihr erkennt
  alternative: sodass ihr erkennt
  rationale: לְמַעַן kann Zweck und beabsichtigtes Ergebnis ausdrücken. »Damit« erhält diese Spannung, ohne eine rein kausale Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rückblickenden hebräischen Perfektformen werden idiomatisch mit dem deutschen Perfekt wiedergegeben. Die Verbindung von יַיִן und שֵׁכָר wird natürlich mit »Wein oder berauschendes Getränk« formuliert; das hebräische ו kann in einer Aufzählung von Alternativen beziehungsweise Kategorien so wiedergegeben werden.
