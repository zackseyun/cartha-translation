  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: de
  text: 'Und alle Völker werden sagen: »Warum hat Jahwe diesem Land das angetan? Warum diese große Zornesglut?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: »Warum diese große Glut des Zorns?«'
    reason: Die alternative Formulierung macht die Konstruktion חֳרִי הָאַף transparenter, wahrt aber die im Hebräischen vorliegende Frage nach dem Grund.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Und … werden sagen
  rationale: Das Qal-Perfekt mit וְ steht im vorausblickenden Bundes- und Gerichtskontext; im Deutschen gibt das Futur die erwartete Reaktion der Völker natürlich wieder.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier die fremden Völker, die das verwüstete Land sehen. „Völker“ ist im Deutschen idiomatischer als „Nationen“ und bewahrt den kollektiven Sinn.
- source_word: עַל מֶה
  choice: Warum
  rationale: Die Wendung fragt nach dem Grund. „Warum“ ist die natürliche deutsche Entsprechung.
- source_word: עָשָׂה יְהוָה כָּכָה לָאָרֶץ הַזֹּאת
  choice: hat Jahwe diesem Land das angetan
  rationale: כָּכָה weist auf das sichtbare Gericht hin; „das angetan“ gibt die Konstruktion mit ל und den negativen Kontext natürlich wieder, ohne die Aussage weiter auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: diese gewaltige Zornesglut
  rationale: „Zornesglut“ erhält das Bild von Hitze beziehungsweise Brennen in חֳרִי und gibt אַף idiomatisch als Zorn wieder. „Gewaltig“ drückt die Stärke von גָּדוֹל in natürlichem Deutsch aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bildsprache des göttlichen Zorns
  choice: Zornesglut
  alternative: heftiger Zorn
  rationale: Die Übersetzung bewahrt die im hebräischen חֳרִי enthaltene Hitze- und Brennmetaphorik, ohne den Zorn abzuschwächen oder systematisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; „Zornesglut“ bewahrt zugleich die markante Bildsprache des Hebräischen.
