  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: de
  text: Und die kommende Generation – eure Kinder, die nach euch aufstehen – und der Fremde, der aus einem fernen Land kommt, werden sagen, wenn sie die Plagen jenes Landes und seine Krankheiten sehen, mit denen Yahweh es heimgesucht hat:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die spätere Generation“. Gemeint ist eine künftige Generation nach der gegenwärtigen, nicht unbedingt die allerletzte Generation.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „seine Krankheiten, mit denen Yahweh es krank gemacht hat“; auch: „mit denen Yahweh es geplagt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: werden sagen
  rationale: Das morphologisch singularische Verb steht vor einem zusammengesetzten Subjekt. Im Deutschen entspricht der Plural dem gesamten nachgestellten Subjekt und klingt in der vorausweisenden Aussage natürlich.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: die kommende Generation
  rationale: Die Wendung bezeichnet hier eine spätere, auf die gegenwärtigen Hörer folgende Generation, nicht zwingend die allerletzte Generation.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: eure Kinder, die nach euch aufstehen
  rationale: „Kinder“ gibt die Nachkommenschaft ohne unnötige Beschränkung auf männliche Nachfahren wieder; „aufstehen“ bewahrt das Bild des hebräischen Verbs.
- source_word: וְהַנָּכְרִי
  choice: und der Fremde
  rationale: נָכְרִי bezeichnet einen Menschen, der von außerhalb Israels kommt. „Fremde“ ist im Deutschen klar und idiomatisch.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: aus einem fernen Land
  rationale: Die Formulierung bewahrt die geografische Ferne und ist natürliches modernes Deutsch.
- source_word: וְרָאוּ
  choice: wenn sie ... sehen
  rationale: Die mit waw verbundene Perfektform beschreibt hier den der Rede vorausgehenden bzw. sie auslösenden Eindruck; ein temporaler Nebensatz macht den Zusammenhang verständlich.
- source_word: מַכּוֹת
  choice: Plagen
  rationale: Das Wort kann Schläge oder Plagen bezeichnen. Im Zusammenhang der sichtbaren Bundesflüche trifft „Plagen“ die strafenden Heimsuchungen.
- source_word: תַּחֲלֻאֶיהָ
  choice: seine Krankheiten
  rationale: Der Plural bezeichnet Krankheiten oder Leiden des Landes und erhält dessen bildhafte Darstellung als krank.
- source_word: חִלָּה
  choice: heimgesucht hat
  rationale: Der Piel-Stamm bedeutet „krank machen“ bzw. „plagen“. „Heimsuchen“ gibt die verursachte schwere Schädigung idiomatisch wieder, während eine Fußnote die wörtliche Krankheitsmetapher sichtbar hält.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: בָּהּ
  choice: es
  rationale: Das Pronomen bezieht sich auf das Land; mit „heimsuchen“ ist das direkte Objekt im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen YHWH. „Yahweh“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von בְּנֵיכֶם
  choice: eure Kinder
  alternative: eure Söhne / eure Nachkommen
  rationale: Der maskuline Plural kann die Nachkommenschaft insgesamt bezeichnen. „Kinder“ wahrt die familiäre Aussage, ohne den Bezug unbegründet auf Männer einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelstrich gliedert die Apposition zu „Generation“; der Doppelpunkt hält den im folgenden Vers fortgesetzten Redeeinsatz offen. Die Krankheitsmetapher des Landes bleibt im Haupttext durch „Krankheiten“ und ergänzend in der Fußnote erhalten.
