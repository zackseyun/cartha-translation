    issue: Unnatürliche Verbindung „in seinen Eid eintrittst“
    rationale: Die hebräische Präpositionalfügung kann im Deutschen nicht ohne Weiteres mit derselben Verbverbindung für „Bund“ und „Eid“ abgebildet werden. Die Formulierung klingt im modernen Standarddeutsch gekünstelt und erschwert das Verständnis.
  - severity: medium
    issue: Der Relativsatz wird durch „den“ formal allein auf „Eid“ bezogen
    rationale: Im Deutschen kann das maskuline „den“ nur „Eid“ aufnehmen. Der hebräische Relativsatz steht nach der Verbindung „Bund ... und seine אָלָה“; im Kontext bezeichnet כרת vor allem das Schließen des Bundes. Eine Umstellung vermeidet diese ungewollte deutsche Festlegung.
  - severity: low
    issue: „Bundesstrafen“ in Fußnote a ist übermäßig technisch
    rationale: אָלָה bezeichnet einen Eid bzw. einen mit Fluch verbundenen Schwur. „Sanktionen oder Flüche“ ist verständlicher und gibt den Bedeutungsbereich ohne zusätzliche juristische Präzisierung wieder.
