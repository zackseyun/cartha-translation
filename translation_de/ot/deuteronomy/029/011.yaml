revisions:
- from: damit du in den Bund Jahwes, deines Gottes, und in seinen Eid[a] eintrittst, den Jahwe, dein Gott, heute mit dir schließt.[b]
  to: damit du dich dem Bund Jahwes, deines Gottes, und dem Eid verpflichtest, den Jahwe, dein Gott, heute mit dir schließt.[a]
  rationale: Die Revision ersetzt die im Deutschen wenig natürliche Doppelverbindung „in den Bund ... und in seinen Eid eintreten“ durch eine idiomatische Verpflichtungsformulierung, ohne den Eintritt in die bindende Bundesordnung abzuschwächen. Zugleich steht der Relativsatz unmittelbar bei „Bund“, dem üblichen Gegenstand von כרת ברית. Da die Fußnote zum Bundesidiom nun am einschlägigen Wort „schließt“ steht und die lexikalische Ambivalenz von אָלָה knapp erläutert, können beide bisherigen Hinweise in einer Fußnote zusammengeführt werden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:38:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsinn wird zutreffend wiedergegeben: Der Infinitiv לְעָבְרְךָ ist final verstanden, בְּרִית als „Bund“, יהוה als „Jahwe“, und die Gegenwartsbedeutung von כֹּרֵת wird gewahrt. אָלָה wird vertretbar mit „Eid“ wiedergegeben, sofern die Fluch- bzw. Sanktionskomponente in der Fußnote erhalten bleibt. Allerdings ist „in seinen Eid eintreten“ im heutigen Standarddeutsch unnötig sperrig, und das maskuline Relativpronomen „den“ legt den Relativsatz grammatisch allein auf „Eid“ fest, obwohl die hebräische Konstruktion im Zusammenhang mit dem koordinierten Bundesausdruck steht und כרת besonders die Bundesstiftung bezeichnet.'
  naturalness: „In den Bund ... eintreten“ ist idiomatisch; „in seinen Eid eintreten“ ist es deutlich weniger. „Dich ... verpflichtest“ ist modernes, verständliches Deutsch und gibt die mit dem Eintreten in Bund und אָלָה verbundene Selbstbindung angemessen wieder. Die Umstellung mit „den Jahwe ... heute mit dir schließt“ lässt den Relativsatz natürlich auf „Bund“ bezogen stehen, ohne den übrigen Ausdruck theologisch einzuengen.
  terminology: „Jahwe“, „Bund“ und „Eid“ sind angemessen und registergerecht. Die Fußnote zu אָלָה sollte nicht von „Bundesstrafen“ sprechen, da dies stärker technisch-juristisch klingt als der hebräische Ausdruck verlangt; „Sanktionen oder Flüche“ wahrt die lexikalische Spannweite. Die idiomatische Fußnote zu כרת ברית ist sachlich richtig.
  issues:
