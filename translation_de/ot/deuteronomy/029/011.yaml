  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: de
  text: damit du dich dem Bund Jahwes, deines Gottes, und dem Eid verpflichtest, den Jahwe, dein Gott, heute mit dir schließt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heute mit dir schneidet“; „einen Bund schneiden“ ist eine hebräische Wendung für das Schließen eines Bundes. Das mit „Eid“ übersetzte hebräische Wort kann auch einen Eid mit den damit verbundenen Sanktionen oder Flüchen bezeichnen.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: damit du … eintrittst
  rationale: Der Infinitiv mit לְ bezeichnet hier Zweck beziehungsweise Ergebnis. In Verbindung mit בְּרִית meint עבר kein räumliches Hinübergehen, sondern den Eintritt in eine bindende Bundesordnung.
- source_word: בִּבְרִית
  choice: in den Bund
  rationale: Die Präposition בְּ wird zusammen mit dem deutschen Verb „eintreten“ idiomatisch durch „in“ wiedergegeben; בְּרִית bezeichnet den Bund.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form enthält das Suffix der zweiten Person Singular und bezeichnet Jahwe als den Gott des angesprochenen Volkes.
- source_word: וּבְאָלָתוֹ
  choice: und in seinen Eid
  rationale: אָלָה kann einen Eid bezeichnen, der zugleich Straf- oder Fluchbestimmungen einschließt. „Eid“ wahrt im Haupttext die Breite des Begriffs; die Sanktionsnuance wird in der Fußnote genannt.
- source_word: כֹּרֵת עִמְּךָ
  choice: mit dir schließt
  rationale: כרת ברית, wörtlich „einen Bund schneiden“, ist die hebräische Wendung für das Schließen eines Bundes. Das Partizip bezeichnet hier das gegenwärtige feierliche Geschehen.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ ist die natürliche moderne Wiedergabe und bewahrt den unmittelbaren zeitlichen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe, dein Gott
  alternative: der HERR, dein Gott
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe „Jahwe“ erhält dessen Funktion als persönlichen Bundesnamen.
- issue: Bedeutungsumfang von אָלָה
  choice: Eid im Haupttext mit Hinweis auf Fluch- und Sanktionscharakter in der Fußnote
  alternative: Fluch; Eid mit seinen Flüchen
  rationale: Das Wort kann sowohl den Eid als auch die mit ihm verbundenen Sanktionen oder Flüche hervorheben. Die gewählte Formulierung legt die genaue Akzentuierung nicht unnötig fest.
- issue: Bezug des Relativsatzes אֲשֶׁר יהוה אלהיך כרת עמך היום
  choice: grammatisch eng an „Bund … und Eid“ angeschlossen
  alternative: ausdrücklich nur auf den Bund bezogen
  rationale: Der hebräische Relativsatz lässt seinen genauen Bezug im koordinierten Ausdruck offen. Die deutsche Fassung bewahrt diese enge Verbindung, ohne eine zusätzliche Erklärung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bundesrechtliche Sprache bleibt erkennbar; der ungewöhnliche Ausdruck „in … seinen Eid eintrittst“ bewahrt bewusst die hebräische Konstruktion und ihre Spannung, während die Fußnoten die mögliche Fluchbedeutung und das hebräische Bundesidiom erläutern.
