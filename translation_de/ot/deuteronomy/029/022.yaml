base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: de
  text: Schwefel und Salz, ein Brand – das ist sein ganzes Land. Es wird nicht besät, es lässt nichts sprießen, und kein Kraut wächst darin – wie bei der Zerstörung von Sodom und Gomorra, Adma und Zebojim, die Jahwe in seinem Zorn und in seinem Grimm zerstörte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: Schwefel und Salz
  rationale: Die konkreten Stoffbezeichnungen werden direkt und in heutigem Deutsch wiedergegeben; zusammen bezeichnen sie Verwüstung und Unfruchtbarkeit.
- source_word: שְׂרֵפָה
  choice: eine Brandstätte
  rationale: Das Substantiv bezeichnet ein Brennen beziehungsweise einen verbrannten Zustand. „Brandstätte“ verbindet das Feuerbild mit dem im Zusammenhang beschriebenen verwüsteten Land, ohne die knappe hebräische Fügung vollständig aufzulösen.
- source_word: כָל אַרְצָהּ
  choice: sein ganzes Land
  rationale: Das Suffix wird dem grammatischen Geschlecht des deutschen Wortes „Land“ entsprechend mit „sein“ wiedergegeben; die hebräische Nominalklausel erhält im Deutschen die Kopula „ist“.
- source_word: לֹא תִזָּרַע
  choice: Es wird nicht besät
  rationale: Die passive Form und der beschreibende Charakter der Aussage bleiben erhalten; eine modale Deutung wie „kann nicht besät werden“ wird nicht hinzugefügt.
- source_word: וְלֹא תַצְמִחַ
  choice: es lässt nichts sprießen
  rationale: 'Die kausative Verbform wird erkennbar wiedergegeben: Das Land bringt keinen Wuchs hervor. „Nichts“ ergänzt im Deutschen idiomatisch das im Hebräischen unausgesprochene Objekt.'
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: und kein Kraut wächst darin
  rationale: עֵשֶׂב kann Gras, Kraut oder allgemein niedrige Vegetation bezeichnen. „Kraut“ hält die Aussage allgemein und bewahrt das Bild dessen, was aus dem Boden aufkommt.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: wie bei der Zerstörung ... die ... zerstörte
  rationale: Die Wiederaufnahme derselben hebräischen Wortwurzel durch Substantiv und Verb wird mit „Zerstörung/zerstörte“ bewahrt; zugleich klingt die Formulierung im Deutschen natürlich.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: Sodom und Gomorra, Adma und Zebojim
  rationale: Verwendet werden die im Deutschen üblichen Formen der vier Ortsnamen.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: in seinem Zorn und in seinem Grimm
  rationale: Die beiden verstärkend verbundenen Ausdrücke für göttlichen Zorn bleiben unterschieden und werden in würdigem, verständlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Verneinung der Vegetation und die Wiederholung von „Zerstörung/zerstörte“ bilden die Struktur des Hebräischen nach. „Grimm“ ist bewusst etwas gehobener als Alltagssprache, bleibt aber verständlich und unterscheidet חֵמָה von אַף.
