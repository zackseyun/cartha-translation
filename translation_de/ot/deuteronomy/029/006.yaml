  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: de
  text: Als ihr an diesen Ort kamt,[a] zogen Sihon, der König von Heschbon, und Og, der König von Baschan, aus, um uns im Kampf entgegenzutreten, und wir schlugen sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ihr kamt an diesen Ort.“ Die hebräische Erzählform kann sowohl durch eine einfache Fortführung als auch durch einen temporalen Nebensatz wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und wir besiegten sie.“ Das hebräische Verb bedeutet wörtlich „wir schlugen sie“ und bezeichnet im militärischen Zusammenhang häufig eine Niederlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Als ihr … kamt
  rationale: Das Qal-Wayyiqtol der 2. Person Plural berichtet ein vergangenes Ereignis. Die temporale Wiedergabe verbindet den Satz im Deutschen natürlich mit dem folgenden Geschehen; die koordinierende Lesart bleibt in der Fußnote erhalten.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: מָקוֹם bedeutet „Ort“; mit einem Bewegungsverb ist „an diesen Ort kommen“ idiomatisches Standarddeutsch.
- source_word: וַיֵּצֵא
  choice: zogen … aus
  rationale: יצא bedeutet „hinausgehen/ausziehen“. Im militärischen Zusammenhang ist „ausziehen“ natürlich, ohne die Aussage über das im Hebräischen Vorhandene hinaus auszubauen.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihon, der König von Heschbon
  rationale: Der Personenname und der Ortsname werden nach gängiger deutscher Bibelschreibung wiedergegeben; die Apposition wird für klares Deutsch mit Artikel gesetzt.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: und Og, der König von Baschan
  rationale: Parallele Wiedergabe der königlichen Titulatur; Baschan folgt der etablierten deutschen Namensform.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: um uns im Kampf entgegenzutreten
  rationale: לִקְרָאתֵנוּ bezeichnet hier das Entgegenkommen beziehungsweise die Konfrontation; לַמִּלְחָמָה bestimmt deren kriegerischen Zweck. Die deutsche Formulierung gibt beides flüssig wieder.
- source_word: וַנַּכֵּם
  choice: und wir schlugen sie
  rationale: Das Hiphil von נכה mit Objektsuffix bedeutet wörtlich „wir schlugen sie“ und bezeichnet im militärischen Kontext häufig das Besiegen. Die konkrete Formulierung bewahrt die Bildhaftigkeit, während die Fußnote die kontextuelle Alternative nennt.
