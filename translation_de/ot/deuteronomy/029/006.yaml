  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und die wesentlichen Aussagen zuverlässig wieder: das Kommen der angesprochenen Israeliten, das Ausziehen Sihons und Ogs zur kriegerischen Begegnung sowie das Schlagen der beiden Gegner. „Als“ ist als natürliche temporale Wiedergabe des Wayyiqtol vertretbar; die koordinierende Möglichkeit wird angemessen erläutert. „Schlugen sie“ bewahrt die konkrete Aussage von נכה, ohne den Ausgang über die im Verb und Kontext liegende militärische Niederlage hinaus zu interpretieren.'
