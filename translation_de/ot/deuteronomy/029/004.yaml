  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: de
  text: Und ich führte euch vierzig Jahre lang in der Wüste. Eure Kleider nutzten sich nicht ab[a], und deine Sandale nutzte sich nicht ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wechselt die Anrede im letzten Satzteil vom Plural zum Singular: wörtlich „deine Sandale nutzte sich nicht ab, von auf deinem Fuß“. Der Singular kann Israel als ein Volk anreden oder verteilend gemeint sein.'
    reason: Der auffällige Numeruswechsel des hebräischen Textes wird erklärt, ohne ihn im Haupttext einzuebnen. Die Fußnote weist außerdem auf die im Deutschen nicht idiomatisch nachbildbare Ortsbeziehung der hebräischen Präposition hin.
lexical_decisions:
- source_word: וָאֹלֵךְ
  choice: ich führte
  rationale: Die Kausativform von הלך bezeichnet hier das Führen des Volkes durch die Wüste; „führte“ ist im Deutschen natürlich und sachlich genau.
- source_word: בַּמִּדְבָּר
  choice: durch die Wüste
  rationale: מִדְבָּר bezeichnet das unbewohnte Wüsten- bzw. Steppengebiet. Mit dem Bewegungsverb gibt „durch die Wüste“ den räumlichen Verlauf im Deutschen idiomatisch wieder.
- source_word: בָּלוּ / בָלְתָה
  choice: nutzten sich … nicht ab / nutzte sich … nicht ab
  rationale: בלה bezeichnet bei Kleidung und Schuhwerk das Abgenutztwerden durch Gebrauch. „Sich abnutzen“ bewahrt den konkreten Sinn und klingt modern.
- source_word: שַׂלְמֹתֵיכֶם
  choice: eure Kleider
  rationale: Der Ausdruck bezeichnet allgemein die getragenen Kleidungsstücke; „Kleider“ ist würdig, verständlich und weniger eng als „Mäntel“.
- source_word: מֵעֲלֵיכֶם
  choice: an euch
  rationale: Wörtlich steht „von auf euch“. In Verbindung mit dem Abnutzen bezeichnet die Wendung die Kleidung, während sie am Körper getragen wird; „an euch“ erhält dieses Bild.
- source_word: נַעַלְךָ
  choice: deine Sandale
  rationale: Das Substantiv mit singularischem Suffix bezeichnet das damalige Schuhwerk konkret als „Sandale“. Der Singular wird entsprechend dem hebräischen Numeruswechsel bewahrt.
- source_word: מֵעַל רַגְלֶךָ
  choice: an deinem Fuß
  rationale: Die wörtliche Konstruktion „von auf deinem Fuß“ wird mit dem deutschen Verb „sich abnutzen“ idiomatisch als „an deinem Fuß“ wiedergegeben.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: „Lang“ kennzeichnet die Akkusativangabe im Deutschen klar als Zeitdauer.
theological_decisions:
- issue: Wechsel von der pluralischen Anrede („euch/eure“) zur singularischen Anrede („deine/deinem“)
  choice: Den Numeruswechsel im Haupttext bewahren
  alternative: 'Für flüssigeres Deutsch durchgehend den Plural verwenden: „eure Sandalen … euren Füßen“'
  rationale: Der masoretische Text wechselt ausdrücklich zum Singular. Dieser kann Israel als kollektive Einheit anreden oder distributiv gemeint sein. Eine Vereinheitlichung würde eine echte Formspannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „nutzte sich … nicht ab“ spiegelt die parallele hebräische Formulierung; der Wechsel vom Plural zum Singular bleibt bewusst erhalten.
