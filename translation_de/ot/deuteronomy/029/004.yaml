revisions:
- from: Und ich führte euch vierzig Jahre lang durch die Wüste. Eure Kleider nutzten sich an euch nicht ab[a], und deine Sandale nutzte sich an deinem Fuß nicht ab.
  to: Und ich führte euch vierzig Jahre lang in der Wüste. Eure Kleider nutzten sich nicht ab[a], und deine Sandale nutzte sich nicht ab.
  rationale: Die Revision glättet nur die im modernen Deutschen unnatürlichen Ergänzungen „an euch“ und „an deinem Fuß“ und passt die Ortsangabe enger an den hebräischen Wortlaut an. Der Parallelismus, die Wiederholung von „nutzte sich nicht ab“ und der Wechsel von pluralischer zu singularischer Anrede bleiben erhalten.
