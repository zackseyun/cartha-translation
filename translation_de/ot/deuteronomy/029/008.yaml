  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: de
  text: Haltet euch also an die Worte dieses Bundes und setzt sie in die Tat um, damit euch alles gelingt, was ihr tut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit ihr bei allem, was ihr tut, verständig handelt.'
    reason: 'Lexikalische Alternative: תַּשְׂכִּילוּ kann sowohl erfolgreiches Gelingen als auch kluges beziehungsweise verständiges Handeln bezeichnen.'
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Haltet euch also an
  rationale: שׁמר bezeichnet im Bundeskontext das treue Beachten und Einhalten der Verpflichtungen. „Sich an etwas halten“ gibt diesen Sinn in natürlichem, modernem Deutsch wieder; „also“ macht den folgernden Anschluss an den vorausgehenden Zusammenhang deutlich.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: die Worte dieses Bundes
  rationale: Die formal nahe Wiedergabe bewahrt das konkrete דִּבְרֵי („Worte“), ohne es deutend auf „Bestimmungen“ oder „Bedingungen“ einzuengen.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und setzt sie in die Tat um
  rationale: Das pluralische „sie“ nimmt wie im Hebräischen die „Worte“ auf. Die deutsche Wendung gibt das wörtliche, aber unidiomatische „tut sie“ verständlich und handlungsbezogen wieder.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ drückt die vom hebräischen Ausdruck eingeleitete Ziel- beziehungsweise Folgebeziehung knapp und natürlich aus.
- source_word: תַּשְׂכִּילוּ
  choice: euch … gelingt
  rationale: Der Hifil von שׂכל kann sowohl kluges, einsichtiges Handeln als auch den daraus hervorgehenden Erfolg bezeichnen. „Gelingen“ passt zur Verbindung mit allem, was getan wird; die Weisheitsnuance bleibt in der Fußnote erhalten.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: alles …, was ihr tut
  rationale: Diese Wiedergabe bewahrt die umfassende Aussage von כָּל אֲשֶׁר und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutungsbreite von תַּשְׂכִּילוּ zwischen verständigem Handeln und erfolgreichem Gelingen
  choice: damit euch alles gelingt, was ihr tut
  alternative: damit ihr bei allem, was ihr tut, verständig handelt
  rationale: Der Haupttext bringt die mögliche Erfolgs- beziehungsweise Gelingenskomponente im Bundeskontext zum Ausdruck, ohne eine allgemeine Wohlstandsverheißung einzutragen. Die ebenso mögliche Weisheitsnuance wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Setzt sie in die Tat um“ vermeidet das im Deutschen harte „tut sie“, bewahrt aber den pluralischen Rückbezug auf die Worte des Bundes. Die Formulierung richtet sich wie der hebräische Text an eine Mehrzahl.
