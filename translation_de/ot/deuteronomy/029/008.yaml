  source_fidelity: Der Text gibt die pluralischen Aufforderungen שׁמרתם und ועשיתם angemessen wieder. „die Worte dieses Bundes“ bewahrt den konkreten Bezug von דברי; „setzt sie in die Tat um“ ist eine idiomatische deutsche Entsprechung für das Ausführen dieser Worte. Die Zweckformel und der umfassende Bezug auf alles, was die Angeredeten tun, sind erhalten. „damit euch alles gelingt“ bildet die Erfolgskomponente von תשכילו plausibel ab.
