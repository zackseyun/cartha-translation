source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: de
  text: 'Ihr alle steht heute vor Jahwe, eurem Gott: eure Oberhäupter, eure Stämme[a], eure Ältesten und eure Amtsträger – jeder Mann Israels[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Oberhäupter eurer Stämme“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich und distributiv: „jeder Mann Israels“; sinngemäß auch: „alle Männer Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: steht
  rationale: Das Nifal-Partizip beschreibt die versammelte Gemeinschaft in ihrer gegenwärtigen Stellung vor Gott. Das deutsche Präsens gibt diese szenische Aussage natürlich wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die übliche moderne Entsprechung bewahrt die zeitliche Betonung des Hebräischen.
- source_word: כֻּלְּכֶם
  choice: alle
  rationale: In Verbindung mit „ihr“ gibt „alle“ die ausdrückliche Gesamtheit der Angesprochenen knapp und idiomatisch wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: „Vor“ ist im Deutschen die natürliche und prägnante Wiedergabe für das Stehen in Gottes Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Form gibt die Possessivbeziehung unmittelbar wieder und fügt sich natürlich in die Anrede ein.
- source_word: רָאשֵׁיכֶם
  choice: eure Oberhäupter
  rationale: „Oberhäupter“ bewahrt die hebräische Metapher, ist im Deutschen verständlich und bezeichnet hier führende Personen.
- source_word: שִׁבְטֵיכֶם
  choice: eure Stämme
  rationale: Dies ist die direkte lexikalische Bedeutung. Die mögliche engere Verbindung mit „Oberhäupter“ wird in einer Fußnote offengehalten.
- source_word: זִקְנֵיכֶם
  choice: eure Ältesten
  rationale: Die etablierte Wiedergabe bezeichnet die anerkannten älteren beziehungsweise leitenden Vertreter der Gemeinschaft.
- source_word: שֹׁטְרֵיכֶם
  choice: eure Amtsträger
  rationale: „Amtsträger“ bezeichnet verständlich Personen mit administrativer Funktion, ohne ihre konkrete Tätigkeit stärker festzulegen, als es der Kontext erlaubt.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: jeder Mann Israels
  rationale: Die singularische, distributive Formulierung des Hebräischen wird genau bewahrt. Zugleich bleibt die männliche Bezeichnung sichtbar, während Frauen und Kinder im folgenden Vers eigens genannt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen und entspricht der üblichen deutschen Form.
- issue: Verhältnis von רָאשֵׁיכֶם und שִׁבְטֵיכֶם
  choice: eure Oberhäupter, eure Stämme
  alternative: die Oberhäupter eurer Stämme
  rationale: Die masoretische Akzentuierung und die Wortfolge lassen eine Aufzählung zu. Da auch die engere syntaktische Verbindung möglich ist, wird sie nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Geschlechtsspezifische und distributive Formulierung כֹּל אִישׁ יִשְׂרָאֵל
  choice: jeder Mann Israels
  alternative: alle Israeliten
  rationale: Die gewählte Fassung erhält sowohl das maskuline אִישׁ als auch dessen distributive Singularform, ohne die im folgenden Vers sichtbar werdende weitere Zusammensetzung der Versammlung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberhäupter“ bewahrt die anschauliche Leitungsmetapher; „Amtsträger“ vermeidet sowohl archaisches „Amtleute“ als auch eine zu eng bestimmte Amtsfunktion. Der Gedankenstrich kennzeichnet die zusammenfassende Apposition am Versende.
