  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: de
  text: Und Jahwe wird ihn aus allen Stämmen Israels zum Unheil aussondern, gemäß allen Flüchen des Bundes, der in diesem Buch der Weisung niedergeschrieben ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eidflüche des Bundes“. Das hebräische Wort kann insbesondere Flüche bezeichnen, die als durch einen Eid bekräftigte Bundessanktionen ausgesprochen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: Und … wird ihn … aussondern
  rationale: Das Hifil von בדל mit Suffix bezeichnet das Absondern einer Person aus einer größeren Gemeinschaft. „Aussondern“ bewahrt den Grundsinn und trägt hier durch den Zusammenhang einen strafenden Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH als Eigennamen wieder.
- source_word: לְרָעָה
  choice: zum Unheil
  rationale: רָעָה bezeichnet hier das durch das Bundesgericht eintretende Unheil, nicht moralische Bosheit.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: Die Präposition מן kennzeichnet die Gemeinschaft, aus der die betreffende Person abgesondert wird.
- source_word: כְּכֹל
  choice: gemäß all
  rationale: כְּ bezeichnet hier die Übereinstimmung des Gerichts mit den schriftlich festgehaltenen Bundessanktionen.
- source_word: אָלֹות הַבְּרִית
  choice: Bundesflüchen
  rationale: אָלָה bezeichnet im Bundeskontext die durch einen Eid bekräftigten Fluchsanktionen; „Bundesflüche“ ist im Haupttext knapp und verständlich.
- source_word: הַכְּתוּבָה
  choice: die … geschrieben stehen
  rationale: Das feminine Partizip steht formal im Singular und bezieht sich grammatisch wohl auf בְּרִית („Bund“), während sachlich die Flüche im Buch geschrieben sind. Die deutsche Formulierung gibt den naheliegenden Sinn natürlich wieder, ohne zusätzliche Aussage einzuführen.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: in diesem Buch der Weisung
  rationale: סֵפֶר wird idiomatisch mit „Buch“ wiedergegeben. תּוֹרָה kann mehr als Einzelgesetze bezeichnen; „Weisung“ bewahrt diese semantische Breite besser als das engere „Gesetz“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen direkt; die Transliteration „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Bedeutung von לְרָעָה
  choice: zum Unheil
  alternative: zum Bösen; zum Verderben
  rationale: Der Kontext handelt von strafendem Bundesgericht. „Unheil“ bezeichnet die schädliche Folge, ohne Jahwe moralisches Böses zuzuschreiben.
- issue: Bedeutung von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ erhält die weitere Bedeutung des hebräischen Begriffs; im Zusammenhang ist die schriftliche Bundesordnung gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung macht deutlich, dass die Person aus der Gemeinschaft Israels ausgesondert und dem Unheil bestimmt wird. „Bundesflüche“ vermeidet eine schwerfällige Genitivkette; die eidliche Nuance wird in der Fußnote bewahrt.
