  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: de
  text: Und wir nahmen ihr Land und gaben es den Rubenitern, den Gaditern und dem halben Stamm Manasse als Erbbesitz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: Und wir nahmen
  rationale: Das Qal-Wayyiqtol von לקח bezeichnet hier schlicht das Nehmen des Landes; „eroberten“ wäre im militärischen Zusammenhang möglich, aber stärker als das Verb selbst.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: אֶרֶץ mit Suffix bezeichnet das Gebiet der zuvor genannten besiegten Könige; „Land“ ist im Deutschen die klare und übliche territoriale Wiedergabe.
- source_word: וַנִּתְּנָהּ
  choice: und gaben es
  rationale: Das feminine Objektsuffix verweist auf אֶרֶץ zurück. „Gaben es“ bewahrt den einfachen Sinn von נתן, ohne ihn administrativ als „teilten es zu“ zu präzisieren.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet besonders bei der Landverteilung einen erblich zugewiesenen Besitz. „Erbbesitz“ ist natürlich, knapp und bewahrt diesen Bedeutungsgehalt.
- source_word: לָראוּבֵנִי
  choice: den Rubenitern
  rationale: Der singularische Volkszugehörigkeitsausdruck ist kollektiv gebraucht; der deutsche Plural gibt die Stammesangehörigen natürlich wieder.
- source_word: וְלַגָּדִי
  choice: den Gaditern
  rationale: Auch dieser singularische Volkszugehörigkeitsausdruck steht kollektiv und wird daher idiomatisch im Plural wiedergegeben.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: dem halben Stamm Manasse
  rationale: חֲצִי שֵׁבֶט bedeutet „halber Stamm“. Das gentilizische הַמְנַשִּׁי wird im Deutschen in dieser festen Stammesbezeichnung natürlich mit dem Namen „Manasse“ wiedergegeben.
