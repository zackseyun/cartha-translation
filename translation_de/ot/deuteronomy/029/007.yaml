  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Das Land der zuvor genannten Gegner wird genommen und den genannten israelitischen Gruppen als נַחֲלָה übergeben. „Erbbesitz“ trifft den landrechtlich-erblichen Gehalt von נַחֲלָה angemessen.'
  naturalness: „Und wir nahmen ihr Land und gaben es den Rubenitern, den Gaditern und dem halben Stamm Manasse als Erbbesitz“ ist flüssiges modernes Standarddeutsch und bewahrt zugleich den würdigen narrativen Registerton. Die Pluralformen bei Rubenitern und Gaditern geben den kollektiv gebrauchten hebräischen Gentilizia idiomatisch wieder.
  terminology: Die Stammesnamen Ruben, Gad und Manasse entsprechen dem üblichen deutschen biblischen Gebrauch. „Halber Stamm Manasse“ ist die etablierte und sachlich präzise Wiedergabe von חֲצִי שֵׁבֶט הַמְנַשִּׁי. Es sind keine theologisch belasteten oder zu eng auslegenden Begriffe eingeführt.
