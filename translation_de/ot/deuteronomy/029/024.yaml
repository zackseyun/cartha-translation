  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen präzise wieder: וְאָמְרוּ als künftige Reaktion („Dann werden sie sagen“), עַל אֲשֶׁר kausal („Weil“), עָזְבוּ als vollzogene Bundesuntreue („verlassen haben“), und die temporale Infinitivkonstruktion („als er sie ... herausführte“). „Bund schließen“ ist die idiomatische deutsche Entsprechung für כָּרַת בְּרִית.'
