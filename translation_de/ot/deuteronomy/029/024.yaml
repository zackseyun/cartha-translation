source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: de
  text: 'Dann werden sie sagen: »Weil sie den Bund Jahwes, des Gottes ihrer Väter, verlassen haben, den er mit ihnen schloss, als er sie aus dem Land Ägypten herausführte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Dann werden sie sagen
  rationale: Die Form setzt die angekündigte Reaktion der Völker im Zusammenhang fort. »Dann« gibt den Fortgang natürlich wieder, während der Plural des Hebräischen erhalten bleibt.
- source_word: עַל אֲשֶׁר
  choice: Weil
  rationale: Die Verbindung leitet hier die Begründung für das zuvor beschriebene Gericht ein.
- source_word: עָזְבוּ
  choice: verlassen haben
  rationale: Das Verb bezeichnet die bewusste Abkehr vom Bund. »Verlassen« ist im heutigen Deutsch verständlich und trägt hier mehr als den Sinn einer bloßen Ortsveränderung.
- source_word: בְּרִית
  choice: Bund
  rationale: »Bund« ist die sachlich und theologisch angemessene deutsche Wiedergabe für die bindende Beziehung zwischen Gott und Israel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: des Gottes ihrer Väter
  rationale: Die Genitivfügung bewahrt die konkrete hebräische Bezeichnung und ihren Bezug auf die väterliche Ahnenlinie.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: den er mit ihnen schloss
  rationale: Hebräisch steht wörtlich »einen Bund schneiden«; im Deutschen lautet die entsprechende feste Wendung »einen Bund schließen«.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: als er sie ... herausführte
  rationale: Die Infinitivkonstruktion ist temporal. »Herausführte« bewahrt sowohl die Bewegung aus Ägypten als auch den Exodusbezug.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe erhält das im Hebräischen ausdrücklich genannte »Land« und bleibt zugleich verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Transliteration wahrt diesen Unterschied gegenüber einem ersetzenden Hoheitstitel.
- issue: Wiedergabe von אֱלֹהֵי אֲבֹתָם
  choice: der Gott ihrer Väter
  alternative: der Gott ihrer Vorfahren
  rationale: »Väter« entspricht der grammatisch maskulinen und traditionsgeschichtlich konkreten Form des Hebräischen; »Vorfahren« wäre möglich, würde diese Form jedoch verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne die hebräische Wendung »einen Bund schneiden« unnatürlich zu übertragen. Keine Fußnote ist erforderlich, da »Gott ihrer Väter« den Ausgangstext eindeutig und idiomatisch wiedergibt.
