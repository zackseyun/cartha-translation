  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigenname wieder. „Bund“ bewahrt den zentralen theologischen Begriff ohne konfessionelle Überformung. „der Gott ihrer Väter“ entspricht der maskulinen hebräischen Formulierung und ist im Deutschen natürlich.
