  text: וְ/לֹ֥א אִתְּ/כֶ֖ם לְ/בַדְּ/כֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת הַ/בְּרִ֣ית הַ/זֹּ֔את וְ/אֶת הָ/אָלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: de
  text: Und nicht mit euch allein schließe ich diesen Bund[a] und diesen Eid[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schneide ich diesen Bund“. „Einen Bund schließen“ gibt die hebräische Redewendung im Deutschen natürlich wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und diesen Fluch“. Das hebräische Wort kann den Eid selbst oder die mit ihm verbundene Fluchsanktion bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: Und nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung setzt den Gedanken in Kontrast zum Zusammenhang und lässt sich im Deutschen knapp und natürlich wiedergeben.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: mit euch allein
  rationale: Die Formulierung bezeichnet ausschließlich die gegenwärtig Angesprochenen; „mit euch allein“ bewahrt die relationale und exklusive Bedeutung.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen markiert das Subjekt ausdrücklich; die deutsche Wortstellung lässt den Satz natürlich klingen, ohne die Aussage abzuschwächen.
- source_word: כֹּרֵת
  choice: schließe
  rationale: Wörtlich steht das hebräische Idiom „einen Bund schneiden“. Im Deutschen ist „einen Bund schließen“ die entsprechende natürliche und würdige Wendung. Das Partizip bezeichnet hier die gegenwärtig vollzogene Handlung.
- source_word: הַבְּרִית הַזֹּאת
  choice: diesen Bund
  rationale: „Bund“ bewahrt im deuteronomischen Kontext das rechtliche und theologische Gewicht von בְּרִית.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: und diesen Eid
  rationale: אָלָה kann den verpflichtenden Eid sowie die mit ihm verbundene Fluchsanktion bezeichnen. „Eid“ eignet sich im Haupttext, während „Fluch“ als echte Alternative dokumentiert wird.
theological_decisions:
- issue: Wiedergabe von אָלָה im Bundeskontext
  choice: Eid
  alternative: Fluch
  rationale: Die Verbindung von בְּרִית und אָלָה bezeichnet den Bund und seine eidlich bekräftigte Sanktion. „Eid“ hebt den Akt der Verpflichtung hervor; „Fluch“ bleibt möglich, weil das Wort auch die beim Eid übernommene Fluchsanktion bezeichnen kann.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die deutsche Bundesredensart „einen Bund schließen“ ersetzt das unnatürliche wörtliche „schneiden“; die Mehrdeutigkeit von אָלָה bleibt durch die Fußnote erhalten.
