source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: de
  text: sondern mit dem, der heute hier bei uns vor Jahwe, unserem Gott, steht, und mit dem, der heute nicht hier bei uns ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sein können Israeliten, die bei der Versammlung nicht anwesend sind, künftige Generationen oder beide Gruppen.
    reason: Bewahrung der offenen Bezugsmöglichkeit des hebräischen Ausdrucks.
lexical_decisions:
- source_word: כִּי
  choice: sondern
  rationale: Im Zusammenhang führt die Partikel den Gegensatz zur Verneinung des vorherigen Verses („nicht mit euch allein“) weiter. Daher gibt „sondern“ die Funktion natürlicher wieder als ein kausales „denn“.
- source_word: אֶת אֲשֶׁר
  choice: mit dem, der
  rationale: Die Akkusativpartikel mit Relativausdruck bezeichnet die in Bund und Eid einbezogenen Personen. „Mit“ wird aus der Bundesformel des vorherigen Verses ergänzt; der Singular bewahrt den distributiven Charakter des Hebräischen.
- source_word: יֶשְׁנוֹ
  choice: ist
  rationale: Die Form von יֵשׁ bezeichnet Sein beziehungsweise Anwesenheit. Zusammen mit „hier bei uns“ ist das schlichte „ist“ im Deutschen natürlich.
- source_word: פֹּה עִמָּנוּ
  choice: hier bei uns
  rationale: Die Wendung bezeichnet die Anwesenheit in der versammelten Gemeinschaft und gibt zugleich die relationale Bedeutung von עִם wieder.
- source_word: עֹמֵד
  choice: steht
  rationale: Die konkrete Körperhaltung wird beibehalten; zugleich ist im Zusammenhang einer Bundesversammlung verständlich, dass damit die gegenwärtige Teilnahme gemeint ist.
- source_word: הַיּוֹם
  choice: heute
  rationale: Moderne und genaue Wiedergabe der in beiden Satzteilen wiederholten Zeitangabe.
- source_word: לִפְנֵי
  choice: vor
  rationale: Knappes und übliches Äquivalent für die räumliche und kultische Vorstellung, in Gottes Gegenwart zu stehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen ausdrücklich wieder.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Direkte Wiedergabe der Form mit dem Suffix der ersten Person Plural; der Dativ folgt auf die deutsche Präposition „vor“.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ
  choice: und mit dem, der … nicht … ist
  rationale: Spiegelt den ersten Satzteil und bewahrt die existentielle Verneinung. „Abwesend ist“ wäre deutender als der hebräische Wortlaut.
theological_decisions:
- issue: Umfang der Bundesgemeinschaft bei denen, die „heute nicht hier bei uns“ sind
  choice: Die offene Formulierung wird ohne nähere Bestimmung wiedergegeben.
  alternative: Ausdrückliche Festlegung auf abwesende Zeitgenossen, künftige Generationen oder beide Gruppen.
  rationale: Der hebräische Text lässt den Bezug bewusst weit. Die Übersetzung soll diese Offenheit bewahren und keine nicht ausdrücklich genannte Gruppe festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede vom Stehen vor Gott und der distributive Singular bleiben erhalten; die Satzverknüpfung setzt den vorherigen Vers voraus.
