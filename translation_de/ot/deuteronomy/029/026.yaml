  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: de
  text: Da entbrannte der Zorn Jahwes gegen jenes Land, um über es den ganzen Fluch zu bringen, der in diesem Buch geschrieben steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte der Zorn
  rationale: Die Wiedergabe bewahrt das anschauliche hebräische Bild vom entbrennenden Zorn und klingt zugleich natürlich und würdig auf Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּאָרֶץ הַהִוא
  choice: gegen jenes Land
  rationale: Die Präposition bezeichnet hier im Zusammenhang mit dem Zorn dessen Zielrichtung; „gegen“ entspricht dem folgenden Gerichtshandeln.
- source_word: לְהָבִיא עָלֶיהָ
  choice: sodass er über es ... brachte
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. „Sodass“ gibt im Kontext die Folge des entbrannten Zorns natürlich wieder; „über es bringen“ bewahrt das räumlich-gerichtliche Bild.
- source_word: כָּל הַקְּלָלָה
  choice: den ganzen Fluch
  rationale: Das Hebräische hat einen bestimmten Singular mit כָּל. „Den ganzen Fluch“ bewahrt diese Form und bezeichnet die Gesamtheit des schriftlich festgehaltenen Bundesfluchs.
- source_word: הַכְּתוּבָה
  choice: der ... geschrieben steht
  rationale: Die attributive Passivform wird idiomatisch wiedergegeben und erhält den schriftlichen beziehungsweise rechtlichen Bezug.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: in diesem Buch
  rationale: סֵפֶר kann Buch, Schriftstück oder Schriftrolle bezeichnen; „Buch“ ist hier die allgemein verständliche und kontextgerechte Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Zweck oder Folge bei לְהָבִיא
  choice: 'Folge: „sodass er ... brachte“'
  alternative: 'Zweck: „um ... zu bringen“'
  rationale: Die Infinitivkonstruktion lässt semantisch Zweck und Folge zu. Im deutschen Satz stellt „sodass“ den Eintritt des angekündigten Gerichts heraus, ohne eine zusätzliche theologische Aussage über Gottes Motivation einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht forensischem Ton. Das kräftige hebräische Zornbild und der kollektive Singular „der ganze Fluch“ bleiben erhalten.
