base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: de
  text: Da riss Jahwe sie[a] im Zorn, im Grimm und in großem Zorn aus ihrem Land und schleuderte sie in ein anderes Land, wie es heute der Fall ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entwurzelte sie“ oder „riss sie aus“; das hebräische Verb bezeichnet ein gewaltsames Ausreißen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie an diesem Tag“. Die Formel kann „wie es heute sichtbar ist“ oder „wie es bis heute der Fall ist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: riss … heraus
  rationale: נתשׁ bezeichnet ein gewaltsames Ausreißen oder Entwurzeln. „riss … heraus“ bewahrt das kräftige Bild und klingt im Deutschen mit Personen und Land natürlicher als „entwurzelte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵעַל אַדְמָתָם
  choice: aus ihrem Land
  rationale: אֲדָמָה kann Erdboden oder Land bezeichnen; im Zusammenhang von Vertreibung und Exil ist „Land“ sachlich und idiomatisch passend.
- source_word: בְּאַף
  choice: in Zorn
  rationale: אַף bedeutet idiomatisch Zorn; die Präposition wird natürlich mit „in“ wiedergegeben.
- source_word: וּבְחֵמָה
  choice: Grimm
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Grimm“ unterscheidet den Ausdruck von den benachbarten Zornesbegriffen und wahrt die rhetorische Häufung.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: und großem Unwillen
  rationale: קֶצֶף bezeichnet Zorn oder heftigen Unwillen. Diese Wiedergabe erhält zusammen mit „Zorn“ und „Grimm“ drei unterscheidbare, sich steigernde Begriffe.
- source_word: וַיַּשְׁלִכֵם
  choice: und schleuderte sie
  rationale: שלך bedeutet werfen oder schleudern. „schleuderte“ bewahrt die Gewalt des hebräischen Verbs und passt zum Gerichtskontext.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: in ein anderes Land
  rationale: Die Formulierung bezeichnet die Verbringung ins Exil und gibt die gerichtete Bewegung ins fremde Gebiet natürlich wieder.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es an diesem Tag zu sehen ist
  rationale: Die hebräische Kurzformel verweist auf den gegenwärtig erkennbaren Zustand. Die Übersetzung macht ihren idiomatischen Sinn verständlich, ohne den Zeitbezug aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Häufung dreier Zornesbegriffe
  choice: Zorn, Grimm und großer Unwille
  alternative: Zorn, Wut und großer Grimm
  rationale: Die drei annähernd synonymen Ausdrücke werden nicht zusammengezogen, damit die rhetorische Steigerung und die Intensität des göttlichen Gerichts erhalten bleiben.
- issue: Gegenwartsformel כַּיּוֹם הַזֶּה
  choice: wie es an diesem Tag zu sehen ist
  alternative: wie an diesem Tag; wie es heute der Fall ist
  rationale: Die Formulierung kann eng zeitlich oder als Hinweis auf den gegenwärtig sichtbaren Zustand verstanden werden. Der Haupttext gibt den idiomatischen Sinn wieder; die Fußnote bewahrt die wörtlichere Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftigen Verben „herausreißen“ und „schleudern“ erhalten die Gewalt der hebräischen Bilder; die dreifache Zornesterminologie bleibt bewusst unverkürzt.
