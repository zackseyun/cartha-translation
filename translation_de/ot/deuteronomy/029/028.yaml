base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: de
  text: Die verborgenen Dinge gehören Jahwe, unserem Gott[a]; die offenbarten Dinge aber gehören uns und unseren Kindern[b] für immer, damit wir alle Worte dieser Weisung[c] befolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname יהוה wird hier mit „Jahwe“ wiedergegeben; traditionell steht dafür „der HERR“.
    reason: translation_convention
  - marker: b
    text: Im masoretischen Text stehen besondere Punkte über den hebräischen Wörtern für „uns und unseren Kindern“. Ihre genaue Bedeutung ist nicht sicher.
    reason: textual_feature
  - marker: c
    text: 'Oder: „dieses Gesetz“. Das hebräische Wort תּוֹרָה bezeichnet hier die Bundesweisung, die Mose Israel vorlegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: die verborgenen Dinge
  rationale: Das substantivisch gebrauchte passive Partizip bezeichnet Dinge oder Angelegenheiten, die dem menschlichen Wissen verborgen sind. Die Wiedergabe bewahrt den Plural und vermeidet die mögliche Nebenbedeutung esoterischer Geheimnisse.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: gehören Jahwe, unserem Gott
  rationale: Die Präposition לְ drückt hier Zugehörigkeit aus. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, אֱלֹהֵינוּ als die appositionelle Bundesbezeichnung „unserem Gott“.
- source_word: וְהַנִּגְלֹת
  choice: die offenbarten aber
  rationale: Das passive Partizip steht parallel zu „die verborgenen Dinge“. „Aber“ gibt den im Zusammenhang deutlich kontrastierenden Sinn der Konjunktion wieder.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: gehören uns und unseren Kindern
  rationale: Das im ersten Satzteil ausgedrückte Zugehörigkeitsverhältnis wird im Deutschen wiederholt. בנים bezeichnet hier im generationenübergreifenden Bundeskontext die Kinder beziehungsweise Nachkommen insgesamt.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wendung bringt die unbegrenzte Fortdauer knapp und natürlich zum Ausdruck.
- source_word: לַעֲשׂוֹת אֶת כָּל דִּבְרֵי
  choice: damit wir alle Worte … befolgen
  rationale: Der Infinitiv mit לְ bezeichnet Zweck oder Ziel. „Befolgen“ ist im Deutschen die natürliche Verbindung mit Gebotsworten und bewahrt zugleich mit „alle Worte“ den textbezogenen Nachdruck des Hebräischen.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieser Weisung
  rationale: תּוֹרָה bezeichnet hier die Mose anvertraute Bundesunterweisung, die auch rechtliche Gebote umfasst. „Weisung“ bewahrt diese Bedeutungsbreite besser als das möglicherweise enger verstandene „Gesetz“.
theological_decisions:
- issue: Umfang des Verborgenen und des Offenbarten
  choice: Der Vers stellt das Gott Vorbehaltene der Israel und seinen Nachkommen gegebenen Offenbarung gegenüber, deren Ziel Gehorsam ist, ohne beide Bereiche näher festzulegen.
  alternative: Der Satz könnte entweder als umfassender Grundsatz über alle göttlichen Geheimnisse oder enger nur auf die unmittelbar vorausgehenden Bundesflüche und -segnungen bezogen werden.
  rationale: Die Übersetzung wahrt die allgemeine Formulierung und die Spannung des hebräischen Textes, ohne den Umfang dessen, was verborgen oder offenbart ist, dogmatisch einzugrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; „befolgen“ vermeidet zugleich die im Deutschen unnatürliche Wendung „Worte tun“.
