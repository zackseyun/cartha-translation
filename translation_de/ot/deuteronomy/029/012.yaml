  terminology: „Gott“, „Väter“ sowie Abraham, Isaak und Jakob sind angemessen. „Dir zum Gott wird“ bewahrt die traditionelle Bundesformel und das hebräische לְךָ, ohne eine konfessionelle Auslegung einzutragen.
