base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: de
  text: damit er dich heute als ein Volk für sich einsetzt[a] und dir zum Gott wird, wie er zu dir gesprochen hat und wie er deinen Vätern, Abraham, Isaak und Jakob, geschworen hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als sein Volk“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „deinen Vätern“ sind hier die ausdrücklich genannten Stammväter Abraham, Isaak und Jakob gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis des Bundesschlusses ein.
- source_word: הָקִים
  choice: einsetzt
  rationale: Das Hifil von קום bezeichnet hier die verbindliche Einsetzung Israels in seinen Status als Gottes Volk; „einsetzt“ ist natürlich und bewahrt den Bundesbezug.
- source_word: אֹתְךָ
  choice: dich
  rationale: Bewahrt die kollektive Anrede Israels in der zweiten Person Singular.
- source_word: הַיּוֹם
  choice: heute
  rationale: Kennzeichnet den gegenwärtigen Augenblick des Bundesschlusses.
- source_word: לוֹ לְעָם
  choice: als sein Volk
  rationale: Gibt die Zugehörigkeit zu Gott in natürlichem Deutsch wieder; die wörtlichere Wortstellung wird in einer Fußnote dokumentiert.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: und er dein Gott ist
  rationale: Entspricht der geläufigen deutschen Form der Bundesformel. Das betonte Pronomen wird durch „er“ bewahrt; der Zusammenhang bezeichnet den durch den Bund bestätigten Status.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: wie er es dir zugesagt
  rationale: דבר bedeutet grundsätzlich „reden“, trägt hier jedoch im Zusammenhang der Bundesformel den Sinn einer verbindlichen Zusage. „Zugesagt“ ist im Deutschen natürlicher als „zu dir geredet“, ohne es mit dem folgenden Schwur gleichzusetzen.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: und wie er ... geschworen hat
  rationale: Gibt den ausdrücklichen Eid präzise wieder.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Der maskuline Ausdruck wird durch die unmittelbar genannten Patriarchen Abraham, Isaak und Jakob konkret bestimmt.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Verwendet die im Deutschen etablierten Namensformen. Die Präposition „deinen Vätern“ regiert alle drei Namen.
theological_decisions:
- issue: Wortlaut der Bundesformel
  choice: als sein Volk ... dein Gott
  alternative: für sich als ein Volk ... dir zum Gott
  rationale: Die gewählte Form ist idiomatisches Deutsch und bewahrt die gegenseitige Bundeszugehörigkeit; die formalere Alternative wird wegen der ungewöhnlichen hebräischen Konstruktion in der Fußnote genannt.
- issue: Zeitwert von יִהְיֶה
  choice: ist
  alternative: sein wird
  rationale: Im Zweckzusammenhang beschreibt die Bundesformel den Status, den Gott am heutigen Tag verbindlich herstellt. „Ist“ vermeidet im Deutschen die missverständliche Aussage, Gott werde erst künftig Israels Gott, während „sein wird“ grammatisch möglich bleibt.
- issue: Bedeutung von דִּבֶּר
  choice: zugesagt
  alternative: zu dir geredet
  rationale: Die Wiedergabe hält die verbindliche Rede Gottes vom ausdrücklich genannten Schwur unterschieden. Die Alternative ist formaler, im Deutschen hier aber unbestimmt und weniger natürlich.
- issue: Bezeichnung der Patriarchen
  choice: deinen Vätern Abraham, Isaak und Jakob
  alternative: deinen Vorfahren Abraham, Isaak und Jakob
  rationale: Da der Text drei Männer ausdrücklich nennt, ist „Väter“ geschlechtsgenau und bewahrt die patriarchale Bezeichnung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kollektiver Singularanrede. Die Satzmelodie bewahrt den feierlichen Charakter der Bundesformel, ohne unnötige Archaismen.
