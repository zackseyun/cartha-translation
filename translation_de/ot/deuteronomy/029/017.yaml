  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: de
  text: dass sich nicht etwa heute das Herz eines Mannes oder einer Frau, einer Sippe oder eines Stammes unter euch von Jahwe, unserem Gott, abwendet, um hinzugehen und den Göttern jener Völker zu dienen; dass es unter euch nicht etwa eine Wurzel gibt, die Gift[a] und Wermut hervorbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Galle“. Das hebräische Wort kann Galle beziehungsweise eine giftige oder bittere Substanz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: dass nicht etwa
  rationale: Die wiederholte Warnpartikel bezeichnet eine befürchtete Möglichkeit. „Nicht etwa“ bewahrt den warnenden Charakter und passt syntaktisch zum Zusammenhang des vorangehenden Verses.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: eines Mannes oder einer Frau
  rationale: Die ausdrückliche Nennung beider Geschlechter bleibt erhalten; die Umstellung mit „das Herz eines …“ vermeidet ein unnatürliches Relativpronomen bei gemischten grammatischen Geschlechtern.
- source_word: מִשְׁפָּחָה
  choice: Sippe
  rationale: Gemeint ist hier eine größere verwandtschaftliche Gruppe und nicht nur die moderne Kernfamilie.
- source_word: שֵׁבֶט
  choice: Stamm
  rationale: Das Wort bezeichnet in diesem Zusammenhang einen Stammesverband Israels.
- source_word: לְבָבוֹ פֹנֶה
  choice: sich das Herz … abwendet
  rationale: Das Partizip kann eine gegenwärtig einsetzende oder andauernde Abkehr bezeichnen. Die deutsche Präsensform gibt dies natürlich wieder, ohne den Aspekt stärker festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: um hinzugehen und … zu dienen
  rationale: Die Bewegungsformulierung und ihr Zweck bleiben erkennbar, ohne sie zu einem bloßen Hilfsverb abzuschwächen.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: den Göttern jener Völker
  rationale: „Völker“ bezeichnet hier die umliegenden Volksgruppen; „jener“ entspricht dem rückweisenden Demonstrativ.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: eine Wurzel …, die Gift und Wermut hervorbringt
  rationale: Das Bild einer verborgenen Wurzel mit verderblichem Ertrag bleibt erhalten. „Hervorbringt“ gibt das Fruchttragen idiomatisch wieder, ohne das im Hebräischen nicht ausdrücklich stehende Substantiv „Frucht“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Bundesnamen. Die Transliteration bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des abgewandten Herzens
  choice: das Herz eines Einzelnen oder eines Kollektivs
  alternative: eine ausschließlich individuelle Abkehr
  rationale: Der Text nennt ausdrücklich Mann, Frau, Sippe und Stamm. Die Übersetzung erhält diese Spannung zwischen persönlicher und gemeinschaftlicher Abkehr.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt als abhängige Warnkonstruktion stehen, weil der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. Die Wiederholung von „nicht etwa“ bildet die zweimalige hebräische Warnpartikel ab.
