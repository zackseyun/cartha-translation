lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: die großen Prüfungen
  rationale: מַסּוֹת bezeichnet hier Erprobungen bzw. prüfende Geschehnisse. „Prüfungen“ ist im heutigen Deutsch natürlich und vermeidet die irreführende Vorstellung einer Verleitung zur Sünde.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: die deine Augen gesehen haben
  rationale: Die ausdrückliche Nennung der Augen wird bewahrt und betont die unmittelbare Augenzeugenschaft.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: Zeichen und Wunder
  rationale: Die geläufige Wortverbindung gibt beide hebräischen Begriffe klar und würdig wieder, ohne die außergewöhnlichen Geschehnisse näher festzulegen.
- source_word: הַגְּדֹלִים הָהֵם
  choice: jene großen
  rationale: „großen“ erhält die Betonung ihrer Bedeutung und ihres Ausmaßes; „jene“ gibt den rückverweisenden und hervorhebenden Demonstrativausdruck wieder.
