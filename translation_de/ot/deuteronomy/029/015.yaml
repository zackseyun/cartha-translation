  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: de
  text: Denn ihr wisst, wie wir im Land Ägypten gelebt haben und wie wir mitten durch die Völker gezogen sind, durch die ihr gezogen seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »was wir während unseres Aufenthalts im Land Ägypten und bei unserem Durchzug mitten unter den Völkern erlebt haben, durch die ihr gezogen seid«. Die hebräischen Konstruktionen können auf die dabei erfahrenen Umstände bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: יְדַעְתֶּם
  choice: ihr wisst
  rationale: Das Perfekt bezeichnet hier ein gegenwärtiges Wissen, das auf eigener vergangener Erfahrung beruht.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: wie wir … gelebt haben
  rationale: Die Konstruktion verweist auf die den Hörern bekannten Umstände des Aufenthalts. Die Wiedergabe ist im modernen Deutschen idiomatisch, ohne bestimmte Erlebnisse hinzuzufügen.
- source_word: יָשַׁבְנוּ
  choice: gelebt haben
  rationale: ישׁב bedeutet hier wohnen oder leben. „Gelebt haben“ ist natürlich und wahrt den Rückblick auf den Aufenthalt in Ägypten.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Bewahrt die traditionelle hebräische Gebietsbezeichnung, ohne altertümlich zu klingen.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: und wie wir … gezogen sind
  rationale: Gibt die Bewegung von עבר wieder und versteht die parallele Konstruktion als Hinweis auf die bekannten Umstände des Durchzugs.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: mitten durch die Völker
  rationale: Verbindet den räumlichen Sinn von בקרב („inmitten/unter“) mit dem Bewegungsverb, ohne „Gebiete“ ausdrücklich in den Text einzutragen.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Im Kontext sind ethnisch-politische Völker beziehungsweise Nationen gemeint. „Heiden“ würde eine spätere religiöse Bedeutungsnuance eintragen.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: durch die ihr gezogen seid
  rationale: Bewahrt den Wechsel von „wir“ zu „ihr“ sowie die im Hebräischen auffällige Wiederholung des Verbs.
