  to: 'Und Mose rief ganz Israel zusammen und sagte zu ihnen: »Ihr habt alles mit eigenen Augen gesehen, was Jahwe im Land Ägypten am Pharao, an allen seinen Dienern und an seinem ganzen Land getan hat.[a]«'
