base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: de
  text: 'Und Mose rief ganz Israel zusammen und sagte zu ihnen: »Ihr habt alles mit eigenen Augen gesehen, was Jahwe im Land Ägypten am Pharao, an allen seinen Dienern und an seinem ganzen Land getan hat.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet hier wiederholt eine Präposition, die die von Jahwes Handeln Betroffenen kennzeichnet. Im Kontext kann sie auch mit „gegen“ wiedergegeben werden: „was Jahwe gegen den Pharao, gegen alle seine Diener und gegen sein ganzes Land getan hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zusammen
  rationale: Im Versammlungskontext bezeichnet קרא das Zusammenrufen des Volkes; die deutsche Wendung ist natürlich und gibt den narrativen Sinn präzise wieder.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die Formulierung bezeichnet kollektiv das gesamte Bundesvolk und entspricht idiomatischem modernem Deutsch.
- source_word: רְאִיתֶם
  choice: ihr habt … gesehen
  rationale: Das Perfekt verweist auf eine selbst erlebte Vergangenheit mit bleibender Bedeutung für die Angesprochenen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעֵינֵיכֶם
  choice: mit eigenen Augen
  rationale: Die deutsche Redewendung bewahrt die Betonung unmittelbarer persönlicher Zeugenschaft.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe erhält das ausdrücklich genannte אֶרֶץ und klingt zugleich im Deutschen natürlich.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: dem Pharao, allen seinen Dienern und seinem ganzen Land angetan hat
  rationale: Die wiederholte Präposition לְ bezeichnet hier die von Jahwes Handeln Betroffenen. „Antun“ gibt den im Kontext negativen bzw. gerichtlichen Charakter natürlich wieder, ohne „gegen“ in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen.
- issue: Charakter von Jahwes Handeln an Ägypten
  choice: dem Pharao … angetan
  alternative: für/an dem Pharao … getan; gegen den Pharao … getan
  rationale: Der Kontext beschreibt Gerichtshandlungen. „Antun“ macht deren negative Wirkung im Deutschen deutlich; die Fußnote bewahrt zugleich die weniger interpretierende formale Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ganz Israel“ und „mit eigenen Augen“ sind allgemein verständlich; die direkte Rede bleibt knapp und feierlich. Die Wiedergabe „angetan“ ist kontextsensibel, während die Fußnote die formale und semantische Spannweite offenlegt.
