  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: de
  text: 'Und wenn er die Worte dieses Schwurs[a] hört und sich in seinem Herzen selbst segnet, indem er sagt: »Mir wird es gut gehen, auch wenn ich in der Verstocktheit meines Herzens lebe« – um das Satte samt dem Durstigen hinwegzuraffen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Fluchs“. Das hebräische Wort kann einen Schwur bezeichnen, der eine Fluchandrohung einschließt.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „das Satte samt dem Durstigen“; möglicherweise ist gemeint: „das bewässerte Land samt dem trockenen“, also alles ohne Unterschied.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: Schwur
  rationale: Das hebräische Wort bezeichnet hier eine eidliche Bundesverpflichtung, die eine Fluchandrohung einschließt. „Schwur“ gibt die Grundbedeutung wieder; „Fluch“ wird als mögliche Wiedergabe in der Fußnote bewahrt.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: sich in seinem Herzen selbst segnet
  rationale: Die reflexive Verbform bezeichnet, dass der Betreffende sich innerlich selbst Segen zuspricht. Die bewusst ungewöhnliche Formulierung bewahrt sowohl die Reflexivität als auch die Ironie seiner Selbstsicherheit.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Mir wird es gut gehen
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Sicherheit. Die deutsche Wendung ist natürlich und lässt diesen Bedeutungsumfang offen.
- source_word: שְׁרִרוּת לִבִּי
  choice: Verstocktheit meines Herzens
  rationale: שְׁרִרוּת bezeichnet eigensinnige, verhärtete Willenshaltung. „Verstocktheit“ passt zum ernsten Bundeswarnkontext und bleibt zugleich verständlich.
- source_word: לְמַעַן
  choice: sodass
  rationale: Die Konjunktion kann Zweck oder Folge bezeichnen. „Sodass“ bewahrt hier die mögliche Ergebnisnuance, ohne die schwierige Aussage als ausdrücklich beabsichtigten Zweck des Sprechers festzulegen.
- source_word: סְפוֹת
  choice: hinweggerafft wird
  rationale: Das Verb trägt in diesem Gerichtskontext am ehesten den Sinn des Wegraffens oder Vernichtens. Das deutsche Passiv fügt sich natürlich in den Satz ein.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: das Satte samt dem Durstigen
  rationale: Die substantivische Metapher des Gesättigten beziehungsweise Bewässerten und des Durstigen beziehungsweise Trockenen wird erhalten, statt sie eindeutig auf Menschen oder Land festzulegen.
theological_decisions:
- issue: Bundessanktionssprache in הָאָלָה
  choice: „Schwur“ im Haupttext, „Fluch“ als Alternative in der Fußnote
  alternative: Fluch
  rationale: Das Wort kann einen mit Fluchfolgen verbundenen Schwur bezeichnen. Die Hauptübersetzung wahrt den eidlichen Charakter, während die Fußnote die Sanktionsbedeutung sichtbar hält.
- issue: Selbstzugesprochener Segen trotz Ungehorsams
  choice: Die reflexive und ironische Aussage wird wörtlich erkennbar wiedergegeben
  alternative: „sich für gesegnet hält“ oder „sich selbst beglückwünscht“
  rationale: Die Übersetzung soll weder die vermessene Selbstsicherheit abschwächen noch über den Text hinaus psychologisieren.
- issue: Deutung von הָרָוָה אֶת־הַצְּמֵאָה
  choice: Die hebräische Metapher bleibt im Haupttext bestehen
  alternative: „das bewässerte Land samt dem trockenen“ beziehungsweise „alles ohne Unterschied“
  rationale: Die Wendung ist tatsächlich schwierig und möglicherweise sprichwörtlich. Eine Festlegung auf Land, Personen oder umfassende Vernichtung würde die Mehrdeutigkeit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „sich in seinem Herzen selbst segnen“ bewahrt gezielt die reflexive Form und Ironie des Hebräischen. Die Schlussmetapher bleibt im Haupttext offen; die geläufigere landbezogene Deutung steht in der Fußnote.
