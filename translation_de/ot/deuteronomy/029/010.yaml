translation:
  language: de
  text: eure kleinen Kinder[a], eure Frauen und der Fremde, der sich inmitten deines Lagers befindet[b], von dem, der dein Holz schlägt, bis zu dem, der dein Wasser schöpft,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Kinder«. Das hebräische Wort bezeichnet besonders kleine Kinder oder abhängige Familienangehörige.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der ansässige Fremde«. Das hebräische Wort bezeichnet einen ausländischen Bewohner, der innerhalb der Gemeinschaft lebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: eure kleinen Kinder
  rationale: טַף bezeichnet besonders kleine Kinder beziehungsweise die abhängigen Kleinen; „kleine Kinder“ gibt den konkreten Sinn in natürlichem Deutsch wieder.
- source_word: נְשֵׁיכֶם
  choice: eure Frauen
  rationale: Im Zusammenhang der versammelten Familien bezeichnet נָשִׁים mit Possessivsuffix die Ehefrauen; „eure Frauen“ ist im Deutschen die natürliche relationale Formulierung.
- source_word: וְגֵרְךָ
  choice: und der Fremde, der … lebt
  rationale: גֵּר ist kein bloßer Besucher, sondern ein dauerhaft innerhalb der Gemeinschaft lebender Fremder. Die Formulierung mit „lebt“ macht diesen Status verständlich, ohne ihn ethnisch oder rechtlich enger festzulegen.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: der mitten in deinem Lager lebt
  rationale: Die Wendung bewahrt das räumliche Bild von בְּקֶרֶב und gibt אֲשֶׁר ausdrücklich wieder. Der Wechsel zum Singular entspricht dem hebräischen Possessivsuffix bei גֵּר und מַחֲנֶיךָ.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: vom Holzfäller
  rationale: Das substantivierte Partizip bezeichnet den, der Holz schlägt. In der deutschen Paarformel ist „Holzfäller“ knapp, natürlich und sachlich genau.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: bis zum Wasserschöpfer
  rationale: שֹׁאֵב bezeichnet den, der Wasser schöpft; „bis zum“ bildet die Spannweite מִן … עַד ab und hält die Parallelität mit „Holzfäller“ fest.
theological_decisions:
- issue: Sozialer Umfang der Bundesversammlung
  choice: Die Aufzählung schließt kleine Kinder, Frauen, ansässige Fremde und Menschen mit einfachen Arbeitsaufgaben ausdrücklich ein.
  alternative: Die Stelle beziehe sich nur auf ethnische Israeliten oder verwende die Arbeitsbezeichnungen lediglich bildlich.
  rationale: Der hebräische Wortlaut zählt reale Gruppen und Tätigkeiten innerhalb des Lagers auf. Die Übersetzung erhält diese soziale Breite, ohne daraus eine weitergehende konfessionelle Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gemischten Anredeformen „eure“ und „deinem“ folgen dem Numeruswechsel des hebräischen Textes; dadurch bleibt dessen rhetorische Bewegung sichtbar. Die kompakte Paarung „vom Holzfäller bis zum Wasserschöpfer“ ist idiomatischer als zwei ausformulierte Relativsätze und bewahrt die soziale Spannweitenformel.
