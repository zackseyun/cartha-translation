revisions:
- from: Aber Jahwe hat euch bis zum heutigen Tag weder ein Herz gegeben, das erkennt, noch Augen, die sehen, noch Ohren, die hören.[a]
  to: Aber Jahwe hat euch bis zum heutigen Tag weder ein Herz zum Erkennen noch Augen zum Sehen noch Ohren zum Hören gegeben.[a]
  rationale: Die Revision bewahrt die Aussage des hebräischen Textes unverändert, stellt aber die parallelen Infinitivkonstruktionen formnäher dar und glättet die Formulierung der Alternativfußnote. Sie entscheidet nicht über die theologische Spannung der ausdrücklichen Aussage, dass Jahwe dieses Vermögen nicht gegeben hat.
