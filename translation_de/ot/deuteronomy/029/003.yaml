  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: de
  text: Aber Jahwe hat euch bis zum heutigen Tag weder ein Herz zum Erkennen noch Augen zum Sehen noch Ohren zum Hören gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und Jahwe hat euch kein Herz zum Erkennen, keine Augen zum Sehen und keine Ohren zum Hören gegeben – bis zum heutigen Tag.“'
    reason: Die Fußnote dokumentiert die mögliche nicht-adversative Wiedergabe der einleitenden Konjunktion und eine formnähere Satzstellung der Zeitangabe.
lexical_decisions:
- source_word: וְלֹא
  choice: Aber ... weder
  rationale: Die Konjunktion führt den Gedankengang fort und bildet zugleich einen Gegensatz zu dem zuvor von Israel Gesehenen. „Aber“ gibt diese adversative Funktion im Deutschen natürlich wieder; „weder ... noch“ bildet die verneinte Reihung idiomatisch ab.
- source_word: נָתַן
  choice: hat ... gegeben
  rationale: Das hebräische Perfekt bezeichnet einen Sachverhalt, dessen Wirkung bis zum genannten Zeitpunkt reicht. Das deutsche Perfekt passt dazu in gegenwärtiger Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
- source_word: לֵב לָדַעַת
  choice: ein Herz ..., das erkennt
  rationale: „Herz“ bewahrt die hebräische Anthropologie, in der לֵב Verstehen und innere Ausrichtung umfasst. „Das erkennt“ gibt ידע natürlich wieder, ohne das Bild auf den bloßen Verstand zu verengen.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: noch Augen, die sehen
  rationale: Die konkrete Bildsprache und der Parallelismus des Hebräischen bleiben erhalten.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: noch Ohren, die hören
  rationale: Die Formulierung bewahrt den Parallelismus sowie das biblische Bild eines wahrnehmenden Hörens.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies ist eine natürliche und zugleich textnahe deutsche Entsprechung, die das Fortbestehen des Zustands bis zu diesem Zeitpunkt ausdrückt.
theological_decisions:
- issue: Göttliches Handeln bei Israels mangelnder Erkenntnis
  choice: Der Text sagt unmittelbar, dass Jahwe Israel bis zu diesem Tag Herz, Augen und Ohren zur wirklichen Erkenntnis nicht gegeben hat.
  alternative: Man könnte die Aussage permissiv als fehlende Befähigung oder Zulassung verstehen oder sie ausschließlich als Beschreibung von Israels eigener Verstockung ausdrücken.
  rationale: Das Hebräische schreibt das Nichtgeben ausdrücklich Jahwe zu. Die Übersetzung schwächt diese Aussage nicht ab, erklärt aber auch nicht über den Vers hinaus, wie sie sich zur menschlichen Verantwortung verhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperbezogene Bildsprache des Hebräischen bleibt erhalten; die verneinte Aufzählung wird mit „weder ... noch“ idiomatisch gestaltet. Der Fußnotenmarker steht im Haupttext.
