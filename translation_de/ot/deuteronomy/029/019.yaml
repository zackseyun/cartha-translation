  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: de
  text: Jahwe wird nicht bereit sein, ihm zu vergeben; denn dann werden Jahwes Zorn und Eifersucht gegen diesen Mann entbrennen. Der ganze Fluch[a], der in diesem Buch geschrieben steht, wird sich auf ihn legen, und Jahwe wird seinen Namen unter dem Himmel auslöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ganze Eidfluch“. Das hebräische Wort kann einen im Zusammenhang eines Bundes- oder Schwureids angerufenen Fluch bezeichnen, nicht nur eine allgemeine Verwünschung.'
    reason: lexikalische Alternative und bundesrechtliche Bedeutungsnuance
lexical_decisions:
- source_word: לֹא יֹאבֶה ... סְלֹחַ לוֹ
  choice: wird nicht bereit sein, ihm zu vergeben
  rationale: אבה bezeichnet Bereitschaft oder Einwilligung, nicht mangelnde Fähigkeit. Die Formulierung bewahrt diesen Willensaspekt und gibt סלח natürlich mit „vergeben“ wieder.
- source_word: כִּי אָז
  choice: denn dann
  rationale: Die Wendung verbindet eine begründende mit einer zeitlich-folgernden Aussage; „denn dann“ bildet beides knapp ab.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: Jahwes Zorn ... werden entbrennen
  rationale: Das Hebräische spricht bildhaft davon, dass Jahwes Zorn „raucht“. „Entbrennen“ bewahrt das Feuerbild in natürlichem Deutsch, ohne den hebräischen Ausdruck unverständlich wörtlich wiederzugeben.
- source_word: קִנְאָתוֹ
  choice: Eifersucht
  rationale: קנאה bezeichnet hier Jahwes eifersüchtigen Anspruch innerhalb des Bundes. „Eifersucht“ gibt diesen Aspekt direkter wieder als das allgemeinere „Eifer“.
- source_word: בָּאִישׁ הַהוּא
  choice: gegen diesen Mann
  rationale: Die Präposition ב bezeichnet im Zusammenhang mit Zorn die feindliche Ausrichtung „gegen“ jemanden; die maskuline Einzahl des Ausgangstextes bleibt erhalten.
- source_word: וְרָבְצָה בוֹ
  choice: wird sich auf ihn legen
  rationale: רבץ bedeutet wörtlich „sich hinlegen, lagern“. Die Formulierung erhält das Bild eines Fluches, der sich auf den Betroffenen legt und dort bleibt.
- source_word: כָּל הָאָלָה
  choice: der ganze Fluch
  rationale: Der hebräische Ausdruck steht im Singular mit bestimmtem Artikel und bezeichnet daher am unmittelbarsten den ganzen im Buch festgehaltenen Fluch. Die bundesrechtliche Bedeutung als Eidfluch wird in der Fußnote genannt.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: der in diesem Buch geschrieben steht
  rationale: ספר kann Buch oder Schriftrolle bedeuten. „Buch“ ist im modernen Deutsch verständlich und lässt die historische Gestalt des Schriftträgers offen.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: wird seinen Namen ... auslöschen
  rationale: מחה bezeichnet Tilgen oder Auswischen. In Verbindung mit „Name“ gibt „auslöschen“ die vollständige Beseitigung von Andenken beziehungsweise Fortbestand idiomatisch wieder.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die feste hebräische Wendung bezeichnet den irdischen Lebensbereich. Die knappe deutsche Entsprechung bewahrt das Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
theological_decisions:
- issue: Bildsprache des göttlichen Gerichts
  choice: „Zorn und Eifersucht ... entbrennen“
  alternative: „Zorn ... raucht“ oder allgemein „Jahwes Grimm richtet sich gegen ihn“
  rationale: „Entbrennen“ erhält die konkrete Hitze- und Feuerbildsprache des hebräischen Verbs, bleibt aber im Deutschen natürlich. Die Aussage wird weder zu einer abstrakten Gerichtsformel verflacht noch zu einer Lehre über Gottes Affekte ausgebaut.
- issue: Maskuline Einzelperson
  choice: „diesen Mann“
  alternative: „diesen Menschen“ oder „diese Person“
  rationale: האיש ההוא ist ausdrücklich maskulin und singularisch. Die Übersetzung bewahrt diese Form, ohne ihre Anwendung über den Text hinaus einzugrenzen.
- issue: Bundesrechtlicher Fluchbegriff
  choice: „der ganze Fluch“ mit Fußnote zur möglichen Bedeutung „Eidfluch“
  alternative: „jeder Fluch“ oder „der ganze Eidfluch“
  rationale: Grammatisch legt der bestimmte Singular „der ganze Fluch“ nahe. Zugleich kann אלה im Bundeskontext einen durch Eid bekräftigten Fluch bezeichnen; diese Bedeutungsnuance wird transparent in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der nachdrücklichen Abfolge des Hebräischen, wird jedoch zur besseren Lesbarkeit in zwei Sätze gegliedert. „Entbrennen“ und „sich auf ihn legen“ erhalten die starke Bildsprache, ohne im Deutschen gekünstelt zu wirken.
