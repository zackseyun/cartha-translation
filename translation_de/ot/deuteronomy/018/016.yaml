base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: de
  text: 'genau so, wie du es am Horeb, am Tag der Versammlung, vom HERRN, deinem Gott, erbeten hast. Du sagtest: »Ich will die Stimme des HERRN, meines Gottes, nicht länger hören und dieses große Feuer nicht mehr sehen, damit ich nicht sterbe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: genau so, wie du es … vom … erbeten hast
  rationale: Gibt die Vergleichsformel und die Herkunftsangabe מֵעִם natürlich wieder; „erbeten“ passt zur Bitte des Volkes im Zusammenhang.
- source_word: בְּיוֹם הַקָּהָל
  choice: am Tag der Versammlung
  rationale: Bewahrt die konkrete Bezeichnung des Tages, an dem das Volk am Horeb versammelt war.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: nicht länger hören
  rationale: אֹסֵף mit Infinitiv bezeichnet hier das Fortsetzen beziehungsweise erneute Tun; im Zusammenhang ist „nicht länger hören“ idiomatisch und präzise.
- source_word: וְאֶת־הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: und dieses große Feuer nicht noch einmal sehen
  rationale: Gibt עוֹד in Verbindung mit der verneinten Handlung als „nicht noch einmal“ wieder.
- source_word: יְהוָה
  choice: HERR
  rationale: Die im modernen deutschen Bibelgebrauch vertraute Wiedergabe des Gottesnamens in Kapitälchenform, ohne eine unsichere Aussprache festzulegen.
theological_decisions:
- issue: Verhältnis des letzten Satzes וְלֹא אָמוּת zur vorausgehenden Bitte
  choice: damit ich nicht sterbe
  alternative: und ich werde nicht sterben
  rationale: Das letzte Glied drückt im Kontext den befürchteten tödlichen Ausgang aus, den die Sprecher durch ihre Bitte vermeiden wollen. Die finale Wiedergabe ist im Deutschen natürlich, ohne die Aussage theologisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers setzt syntaktisch den vorhergehenden Zusammenhang fort; deshalb beginnt die Übersetzung mit kleingeschriebenem „genau so“. Die direkte Rede wird klar markiert, ohne zusätzliche Erläuterungen.
