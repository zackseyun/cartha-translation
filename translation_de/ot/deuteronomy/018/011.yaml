  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: de
  text: oder jemand, der Zaubersprüche wirkt[a], oder jemand, der einen Totengeist befragt[b], oder ein Geisterbeschwörer[c], oder jemand, der sich an die Toten wendet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der eine Bindung bindet“; gemeint ist das Sprechen oder Wirken magischer Beschwörungen. Auch: „ein Bannsprecher“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort kann einen Totengeist oder auch ein Medium bezeichnen. Daher auch: „jemand, der ein Medium befragt“ beziehungsweise „ein Totenbeschwörer“.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Auch: „Wahrsager“. Der seltene hebräische Ausdruck bezeichnet einen mit einem Wahrsage- oder vertrauten Geist verbundenen Praktiker; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „jemand, der die Toten befragt“ oder „die Toten um Auskunft ersucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: jemand, der Zaubersprüche wirkt
  rationale: Die hebräische Wendung lautet wörtlich etwa „eine Bindung bindet“ und bezeichnet im Zusammenhang eine magische Beschwörung. „Zaubersprüche wirkt“ gibt die Tätigkeit in verständlichem, heutigem Deutsch wieder, ohne die schwer verständliche Bildlichkeit zur Hauptformulierung zu machen.
- source_word: שֹׁאֵל אוֹב
  choice: jemand, der einen Totengeist befragt
  rationale: אוֹב kann den heraufgerufenen Totengeist oder die mit ihm verbundene Person beziehungsweise Praxis bezeichnen. Die objektbezogene Wiedergabe folgt der unmittelbaren Konstruktion שֹׁאֵל אוֹב und lässt die sachliche Nähe zum Medium in einer Fußnote erkennen.
- source_word: יִדְּעֹנִי
  choice: Geisterkundiger
  rationale: Das Wort bezeichnet eine Person, die beansprucht, durch Geister über verborgenes Wissen zu verfügen, und steht häufig neben אוֹב. „Geisterkundiger“ wahrt diesen Bezug, ohne die modernen Fantasy-Assoziationen von „Zauberer“ zu importieren.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: jemand, der sich an die Toten wendet
  rationale: דָּרַשׁ אֶל bezeichnet hier das Aufsuchen beziehungsweise Befragen der Toten. Die Formulierung ist natürlich, bewahrt aber gegenüber dem engeren „befragt“ die Bedeutungsbreite des Verbs.
- source_word: וְ
  choice: oder
  rationale: In der fortgesetzten Aufzählung verbotener Personen und Praktiken hat die Konjunktion im Deutschen disjunktive Listenfunktion; daher ist „oder“ idiomatisch.
theological_decisions:
- issue: Bezeichnungen okkulter Praktiken ohne spätere Folklore oder konfessionelle Festlegung
  choice: Moderne, sachlich beschreibende Ausdrücke verwenden und die lexikalische Unsicherheit durch Fußnoten sichtbar machen.
  alternative: Traditionelle Bezeichnungen wie „Bannsprecher“, „Totenbeschwörer“, „Wahrsager“ oder „Zauberer“ in den Haupttext setzen.
  rationale: Der Vers zählt verbotene magische und nekromantische Praktiken auf. Sachliche Umschreibungen geben den hebräischen Befund wieder, ohne spätere Vorstellungen über Magie, Geister oder Medien unbemerkt in den Text einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die wiederholte Form „jemand, der …“ erhält die Gestalt der gesetzlichen Aufzählung. Ungebräuchliche oder missverständliche Traditionswörter stehen nur als Alternativen in den Fußnoten.
