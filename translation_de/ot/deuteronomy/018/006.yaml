revisions:
- from: Und wenn der Levit aus einer deiner Städte irgendwo in Israel kommt, wo er als Fremder wohnt, und ganz nach dem Verlangen seiner Seele an den Ort kommt, den Jahwe erwählen wird,[a]
  to: Und wenn der Levit aus irgendeiner deiner Städte in ganz Israel[a] kommt, wo er sich aufhält, und mit all seiner Sehnsucht zu dem Ort kommt, den Jahwe erwählen wird,[b]
  rationale: Die Revision verbessert die idiomatische Verständlichkeit, ohne den kasuistischen Satzbau, die Wiederholung von „kommt“, die distributive Reichweite „in ganz Israel“, die nicht näher bestimmte Ortsbezeichnung und die futurische Formel von Jahwes Erwählung zu verändern. Sie vermeidet zudem die irreführende moderne Konnotation von „Fremder“, während eine Fußnote die Metonymie von „Tore“ dokumentiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:55:50Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die beiden Wiederholungen von בוא sind zutreffend wiedergegeben. „Städte“ ist als Auflösung der Metonymie „Tore“ vertretbar. „Als Fremder wohnt“ legt jedoch im heutigen Deutsch leicht eine ethnische Fremdheit nahe, die der Text hier nicht behauptet. Die Wiedergabe von בְּכָל־אַוַּת נַפְשׁוֹ ist im Entwurf unnötig schwerfällig.
  naturalness: „Irgendwo in Israel“ und besonders „ganz nach dem Verlangen seiner Seele“ wirken im modernen Standarddeutsch entweder umgangssprachlich bzw. konstruiert. „Aus irgendeiner deiner Städte in ganz Israel“, „wo er sich aufhält“ und „mit all seiner Sehnsucht“ sind idiomatischer und bewahren den Sinn.
  terminology: „Levit“ und „Jahwe“ sind konsistent und sachgerecht. Eine Fußnote zu „Städte“ macht transparent, dass das Hebräische wörtlich „Tore“ sagt und diese metonymisch für Orte bzw. Städte stehen.
  issues:
  - severity: medium
    issue: „wo er als Fremder wohnt“
    rationale: Die Formulierung kann einen ausländischen oder ethnisch fremden Status suggerieren. גָּר bezeichnet hier einen ansässigen Aufenthalt; „wo er sich aufhält“ wahrt die Aussage ohne diese zusätzliche Implikation.
  - severity: medium
    issue: „ganz nach dem Verlangen seiner Seele“
    rationale: Die Wendung ist im heutigen Deutsch nicht natürlich und bildet die hebräische Konstruktion zu mechanisch nach. „Mit all seiner Sehnsucht“ gibt die volle persönliche Wunsch- bzw. Sehnsuchtsintensität verständlich wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
  - severity: low
    issue: Fehlende Transparenz der Metonymie bei „Städte“
    rationale: Da שְׁעָרֶיךָ wörtlich „deine Tore“ lautet, ist eine knappe Fußnote sinnvoll, um die gewählte idiomatische Auflösung nachvollziehbar zu machen.
  revised_text: Und wenn der Levit aus irgendeiner deiner Städte in ganz Israel[a] kommt, wo er sich aufhält, und mit all seiner Sehnsucht zu dem Ort kommt, den Jahwe erwählen wird,[b]
  revised_footnotes:
