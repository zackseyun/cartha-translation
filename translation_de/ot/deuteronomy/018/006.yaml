source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: de
  text: Und wenn der Levit aus irgendeiner deiner Städte in ganz Israel[a] kommt, wo er sich aufhält, und mit all seiner Sehnsucht zu dem Ort kommt, den Jahwe erwählen wird,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus einem deiner Tore“; „Tore“ bezeichnet hier metonymisch eine Stadt oder Ortschaft.'
    reason: cultural_note
  - marker: b
    text: 'Oder wörtlicher: „und mit dem ganzen Verlangen seiner Seele zu dem Ort kommt, den Jahwe erwählen wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Leitet einen an die vorausgehende Gesetzgebung anschließenden Bedingungsfall ein und bewahrt sowohl die Konjunktion als auch die konditionale Bedeutung.
- source_word: הַלֵּוִי
  choice: der Levit
  rationale: Der bestimmte Artikel wird beibehalten; im Gesetzestext bezeichnet die Form einen beispielhaften Angehörigen der Gruppe.
- source_word: מֵאַחַד שְׁעָרֶיךָ מִכָּל יִשְׂרָאֵל
  choice: aus einer deiner Städte irgendwo in Israel
  rationale: שְׁעָרִים bedeutet wörtlich „Tore“, bezeichnet hier aber metonymisch die Städte beziehungsweise Ortschaften. „Irgendwo in Israel“ gibt die distributive Reichweite von מִכָּל יִשְׂרָאֵל natürlich wieder.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: wo er als Fremder wohnt
  rationale: גור bezeichnet einen Aufenthalt ohne angestammten Landbesitz. Die Formulierung bewahrt diesen besonderen Status, ohne einen ausländischen Nichtisraeliten zu unterstellen.
- source_word: וּבָא
  choice: und … kommt
  rationale: 'Die Wiederholung des Verbs בוא wird wie im Hebräischen bewahrt: Der Levit kommt aus seinem Wohnort und kommt an den erwählten Ort.'
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: ganz nach dem Verlangen seiner Seele
  rationale: Gibt die umfassende persönliche Sehnsucht eng am Wortlaut wieder und klingt zugleich in würdigem modernem Deutsch verständlich.
- source_word: אֶל הַמָּקוֹם
  choice: an den Ort
  rationale: Der Text nennt nur „den Ort“; die nähere Deutung als Heiligtum wird nicht erläuternd in den Haupttext eingefügt.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: den Jahwe erwählen wird
  rationale: Das Imperfekt wird in der wiederkehrenden deuteronomischen Formel futurisch wiedergegeben; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Status des Leviten als גָּר
  choice: als Fremder wohnt
  alternative: sich aufhält / wohnt
  rationale: Die Übersetzung lässt erkennen, dass der Levit dort ohne eigenen angestammten Landbesitz ansässig ist, deutet ihn aber nicht als ethnisch fremden Nichtisraeliten.
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch mit würdigem Gesetzesstil. Die hebraistische Seelenformulierung bleibt bewusst erhalten. Das wörtliche „Tore“ wird wegen seiner für heutige Leser missverständlichen Metonymie im Haupttext als „Städte“ wiedergegeben.
