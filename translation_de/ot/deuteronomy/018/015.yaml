  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: de
  text: Der HERR, dein Gott, wird dir aus deiner Mitte, aus deinen Brüdern[a], einen Propheten wie mich[b] erwecken. Auf ihn sollt ihr hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Brüder« bezeichnet hier die Angehörigen Israels, also die anderen Israeliten.
    reason: lexical_alternative
  - marker: b
    text: Im Neuen Testament wird dieser Vers auf den Messias bezogen; der hebräische Wortlaut sagt hier jedoch schlicht »einen Propheten wie mich«.
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: einen Propheten
  rationale: Der unbestimmte Singular bleibt erhalten. Das Wort bezeichnet einen Menschen, der im Auftrag Gottes spricht, ohne dessen Identität im Haupttext näher festzulegen.
- source_word: מִקִּרְבְּךָ
  choice: aus deiner Mitte
  rationale: Die formnahe und im Deutschen verständliche Wendung bringt zum Ausdruck, dass der Prophet aus Israel selbst hervorgeht.
- source_word: מֵאַחֶיךָ
  choice: aus deinen Brüdern
  rationale: Die grammatisch maskuline Verwandtschaftsbezeichnung wird formgetreu wiedergegeben; im deuteronomischen Zusammenhang bezeichnet sie die Angehörigen Israels.
- source_word: כָּמֹנִי
  choice: wie mich
  rationale: Die unmittelbare Vergleichung mit Mose wird schlicht und ohne zusätzliche Deutung bewahrt.
- source_word: יָקִים לְךָ
  choice: wird dir … auftreten lassen
  rationale: Das Kausativ von קום bezeichnet hier das Hervorbringen beziehungsweise Einsetzen eines Propheten. „Auftreten lassen“ ist natürliches modernes Deutsch, vermeidet ein mögliches Missverständnis von „erwecken“ als Auferweckung und bewahrt mit „dir“ den Nutznießerbezug.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: der HERR, dein Gott
  rationale: Der Gottesname wird gemäß der vorgegebenen Konvention mit „der HERR“ wiedergegeben; die Apposition wahrt die persönliche Bundesformulierung.
- source_word: אֵלָיו
  choice: auf ihn
  rationale: „Auf jemanden hören“ ist die idiomatische deutsche Entsprechung der hebräischen Präpositionalverbindung und kann sowohl aufmerksames Hören als auch Befolgen einschließen.
- source_word: תִּשְׁמָעוּן
  choice: sollt ihr hören
  rationale: Die Form richtet sich im Plural an Israel. „Sollt“ gibt die verpflichtende Kraft wieder, ohne das Bedeutungsspektrum von שׁמע vorschnell auf „gehorchen“ zu verengen.
theological_decisions:
- issue: Mögliche messianische Bestimmtheit des „Propheten wie mich“
  choice: Der Haupttext bewahrt den unbestimmten Singular „einen Propheten wie mich“.
  alternative: Eine ausdrücklich messianische Wiedergabe wie „den Propheten“ oder eine ausschließlich kollektive Deutung auf das Prophetenamt.
  rationale: Im hebräischen Vers steht keine ausdrückliche messianische Bezeichnung. Die spätere Anwendung im Neuen Testament wird in einer Fußnote genannt, aber nicht in den Wortlaut des Verses eingetragen.
- issue: Repräsentative Bedeutung von אַח („Bruder“)
  choice: Im Haupttext steht „Brüdern“, ergänzt durch eine erläuternde Fußnote.
  alternative: „Israeliten“, „Volksgenossen“ oder „Brüdern und Schwestern“.
  rationale: „Brüder“ wahrt die maskuline Form des Hebräischen; die Fußnote verdeutlicht, dass im Kontext die Angehörigen Israels insgesamt gemeint sind.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzstellung ist für natürliches Deutsch leicht umgeordnet. Der Wechsel von der singularischen Anrede („dein“) zur pluralischen Aufforderung („ihr“) folgt dem hebräischen Text und bleibt als bedeutsame Spannung erhalten.
