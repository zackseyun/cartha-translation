  naturalness: 'Der Entwurf ist insgesamt verständlich und registergerecht. „Auftreten lassen“ ist jedoch für הֵקִים weniger präzise: Es kann vor allem das Gestatten eines öffentlichen Erscheinens ausdrücken, während das hebräische Hifil hier Gottes Hervorbringen bzw. Erwecken eines Propheten bezeichnet. „Erwecken“ ist im biblisch-würdigen modernen Standarddeutsch die etablierte, knappe und semantisch nähere Wiedergabe; der Kontext schließt ein Missverständnis als Auferweckung von Toten aus.'
