base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: de
  text: 'Und wenn du in deinem Herzen sagst: »Wie sollen wir das Wort[a] erkennen, das Jahwe nicht gesprochen hat?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Botschaft“ oder „Angelegenheit“. Das hebräische Wort davar kann ein Wort, eine Botschaft oder eine Angelegenheit bezeichnen; im Zusammenhang prophetischer Rede passt „Wort“ am besten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Die Verbindung leitet eine mögliche Frage ein und wahrt zugleich den Anschluss an den vorherigen Zusammenhang.
- source_word: תֹאמַר בִּלְבָבֶךָ
  choice: du in deinem Herzen sagst
  rationale: Die Formulierung bewahrt das hebräische Bild vom Herzen als dem Ort des Denkens und Überlegens, ohne es zu „bei dir denkst“ abzuflachen.
- source_word: אֵיכָה נֵדַע
  choice: Wie können wir erkennen
  rationale: Die Wendung gibt die Frage nach der Möglichkeit beziehungsweise dem Verfahren des Erkennens in natürlichem modernem Deutsch wieder.
- source_word: הַדָּבָר
  choice: welches Wort
  rationale: Im Zusammenhang prophetischer Rede bezeichnet דָּבָר hier am ehesten eine Äußerung oder Botschaft. Die Einbindung als „welches Wort“ ergibt im Deutschen einen klaren indirekten Fragesatz.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: Jahwe nicht gesprochen hat
  rationale: Das Perfekt mit Verneinung fragt danach, ob die betreffende Äußerung von Jahwe stammt; „gesprochen hat“ ist dafür natürlich und nah am Ausgangstext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ ist dessen geläufige wissenschaftliche und deutschsprachige Wiedergabe; ein bloßer Titel würde diese Unterscheidung verdecken.
- issue: Bezug von אֲשֶׁר im Fragesatz
  choice: „welches Wort Jahwe nicht gesprochen hat“
  alternative: „das Wort, das Jahwe nicht gesprochen hat“
  rationale: Beide Fassungen sind grammatisch möglich. Die gewählte Form macht im Deutschen natürlich deutlich, dass gefragt wird, wie ein nicht von Jahwe stammendes Wort identifiziert werden kann, ohne ein zusätzliches theologisches Kriterium in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem biblischem Herz-Bild. Die direkte Frage ist idiomatisch formuliert, ohne die Antwort des folgenden Verses vorwegzunehmen.
