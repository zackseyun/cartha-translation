base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: de
  text: Bei dir soll niemand zu finden sein, der seinen Sohn oder seine Tochter durchs Feuer gehen lässt[a], der Wahrsagerei treibt, die Zukunft deutet[b], Vorzeichen deutet[c] oder Zauberei betreibt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seinen Sohn oder seine Tochter im Feuer hindurchgehen lässt“. Möglich ist auch: „im Feuer verbrennt“ oder „im Feuer als Opfer darbringt“.'
    reason: alternative_reading
  - marker: b
    text: Das zugrunde liegende hebräische Wort ist schwierig zu bestimmen. Möglich sind auch Wiedergaben wie „Zeiten deutet“ oder „Orakel stellt“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Orakel aus Vorzeichen gewinnt“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Hexerei treibt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Bei dir darf niemand zu finden sein
  rationale: Das negierte Nifal-Imperfekt formuliert ein Verbot für die Gemeinschaft. „Bei dir“ gibt das singularische בְךָ natürlich wieder und bewahrt die direkte Anrede Israels.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: der seinen Sohn oder seine Tochter durchs Feuer gehen lässt
  rationale: Die Hifil-Form von עבר bedeutet wörtlich „hinübergehen lassen“. Die Wiedergabe wahrt die hebräische Ausdrucksweise und legt nicht fest, ob hier Verbrennung, Opferung oder eine andere Feuerhandlung gemeint ist.
- source_word: קֹסֵם קְסָמִים
  choice: der Wahrsagerei treibt
  rationale: Partizip und stammverwandtes Objekt bezeichnen die Ausübung von Divination. „Wahrsagerei treiben“ ist im Deutschen verständlich und idiomatisch.
- source_word: מְעוֹנֵן
  choice: die Zukunft deutet
  rationale: Das seltene und schwierige Wort bezeichnet wahrscheinlich eine mantische Praxis. Die Formulierung ist modern und verständlich, ohne die unsichere Etymologie als sichere Ritualbeschreibung auszugeben.
- source_word: מְנַחֵשׁ
  choice: Vorzeichen auslegt
  rationale: Das Verb bezeichnet das Deuten von Zeichen oder Omina. Diese Wahl unterscheidet die Tätigkeit von der allgemeineren Wahrsagerei.
- source_word: מְכַשֵּׁף
  choice: Zauberei betreibt
  rationale: Das Piel-Partizip bezeichnet die Ausübung magischer Künste. „Zauberei betreiben“ passt sprachlich zur Reihe von Tätigkeitsbezeichnungen und vermeidet speziellere moderne Nebenbedeutungen von „Hexerei“.
theological_decisions:
- issue: Art des verbotenen Feuerrituals mit Kindern
  choice: Die hebräische Wendung „seinen Sohn oder seine Tochter durchs Feuer gehen lässt“ bleibt im Haupttext erhalten.
  alternative: „seinen Sohn oder seine Tochter im Feuer verbrennt“ beziehungsweise „als Opfer im Feuer darbringt“
  rationale: Der Vers verurteilt eindeutig ein kultisches Feuerritual mit Kindern, bestimmt dessen genaue Durchführung in dieser Wendung aber nicht ausdrücklich. Die wörtlich-nahe Form bewahrt diese Offenheit.
- issue: Abgrenzung der verbotenen mantischen Praktiken
  choice: Die vier hebräischen Bezeichnungen werden als unterscheidbare Tätigkeiten wiedergegeben.
  alternative: Mehrere Begriffe zusammenfassend mit „Wahrsagerei“ oder „Magie“ wiedergeben
  rationale: Die Aufzählung nennt verschiedene, teilweise semantisch überlappende Praktiken. Eine differenzierte Wiedergabe erhält die Breite des Verbots, ohne starre technische Definitionen zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte singularische Anrede wird mit „bei dir“ bewahrt. Parallel gebaute Tätigkeitsbeschreibungen machen die gesetzliche Aufzählung klar; Fach- und altertümliche Wörter werden möglichst vermieden. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
