  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: de
  text: Wenn der Prophet im Namen Jahwes spricht und das Wort[a] nicht Wirklichkeit wird und nicht eintrifft[b], dann ist dies das Wort, das Jahwe nicht gesprochen hat. In Vermessenheit[c] hat der Prophet es gesprochen; du sollst dich vor ihm nicht fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten und hier sowohl die ausgesprochene Botschaft als auch das angekündigte Geschehen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „nicht geschieht und nicht kommt“. Die doppelte Formulierung betont, dass die Ankündigung nicht erfüllt wird.'
    reason: lexical_alternative
  - marker: c
    text: „In Vermessenheit“ bezeichnet hier anmaßendes, eigenmächtiges Reden ohne Jahwes Beauftragung.
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר
  choice: spricht
  rationale: Das Präsens gibt den generischen, bedingenden Gebrauch des hebräischen Imperfekts in dieser Rechtsanweisung natürlich wieder.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Der bestimmte Artikel wird formal beibehalten; im Deutschen kann „der Prophet“ zugleich einen repräsentativen Einzelfall bezeichnen.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die Wendung bezeichnet das Reden unter beanspruchter göttlicher Autorität; „Jahwe“ gibt den Eigennamen יהוה in geläufiger deutscher Form wieder.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier sowohl die prophetische Aussage als auch ihren angekündigten Inhalt. Die Wiederholung von „Wort“ bewahrt die Verbindung zwischen Anspruch, Erfüllung und Urteil.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: nicht Wirklichkeit wird und nicht eintrifft
  rationale: Die zwei parallelen Verben werden als zweigliedrige Aussage über die ausbleibende Erfüllung bewahrt, ohne die heute altertümliche Wendung „sich begeben“ zu verwenden.
- source_word: הוּא הַדָּבָר
  choice: dann ist dies das Wort
  rationale: „Dies“ erhält die identifizierende und hervorhebende Funktion des Pronomens הוּא im Zusammenhang.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: das Jahwe nicht gesprochen hat
  rationale: Die Formulierung bewahrt das Redeverb und bezeichnet die Botschaft als nicht von Jahwe autorisiert.
- source_word: בְּזָדוֹן
  choice: in Vermessenheit
  rationale: Die Wendung drückt die arrogante, eigenmächtige Anmaßung aus, ohne bloß Unvorsichtigkeit oder Irrtum anzudeuten.
- source_word: דִּבְּרוֹ הַנָּבִיא
  choice: hat der Prophet es gesprochen
  rationale: Das Pronomen „es“ gibt das hebräische Objektsuffix wieder und verweist ausdrücklich auf das zuvor genannte Wort.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: du sollst dich vor ihm nicht fürchten
  rationale: Die Übersetzung bewahrt den rechtlich anweisenden Charakter und den Sinn, sich von dem Propheten nicht einschüchtern zu lassen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der prophetischen Prüfung
  choice: Konkrete Prüfung einer im Namen Jahwes ausgesprochenen Ankündigung anhand ihres Nichteintreffens
  alternative: Umfassende Lehrregel über jede Art prophetischen Redens
  rationale: Die Übersetzung bleibt bei dem im Vers ausdrücklich beschriebenen Fall und erweitert ihn nicht zu einer Aussage, die der hebräische Wortlaut hier nicht ausdrücklich macht.
- issue: Art des unautorisierten Redens
  choice: in Vermessenheit
  alternative: irrtümlich
  rationale: בְּזָדוֹן bezeichnet vorsätzliche, anmaßende Eigenmächtigkeit und nicht lediglich einen gutgläubigen Irrtum.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Feierlichkeit von „in Vermessenheit“ entspricht dem rechtlich-theologischen Kontext; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich. Die Wiederholung von „Wort“ bildet die Wiederholung von דָּבָר sichtbar ab.
