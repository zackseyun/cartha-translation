  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: de
  text: Wenn du in das Land kommst, das Jahwe, dein Gott, dir gibt, sollst du nicht lernen, nach den Gräuelpraktiken jener Völker zu handeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gräuelpraktiken wie die jener Völker auszuüben“. Die hebräische Präposition kann sowohl Vergleich als auch Übereinstimmung ausdrücken.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den zeitlichen Umstand ein, unter dem das folgende Verbot gilt. „Wenn“ gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: בָּא אֶל הָאָרֶץ
  choice: in das Land kommst
  rationale: Das Partizip hat im Kontext bevorstehende Bedeutung. Die Wendung bewahrt sowohl die Bewegung in das Land hinein als auch den deuteronomischen Ausdruck „das Land“.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֶיךָ bedeutet mit dem Suffix „dein Gott“.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip bezeichnet Gottes gegenwärtig zugesagte und bevorstehende Gabe. Das deutsche Präsens ist hier idiomatisch und bewahrt diese Perspektive.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: sollst du nicht lernen … zu handeln
  rationale: Der negierte Imperfekt formuliert ein Verbot. „Sollst du nicht“ wahrt den rechtlichen Ernst, während „lernen … zu handeln“ die Verbindung von לָמַד und dem Infinitiv עָשָׂה abbildet.
- source_word: כְּתוֹעֲבֹת
  choice: nach den Gräuelpraktiken … zu handeln
  rationale: תּוֹעֵבָה bezeichnet etwas religiös und moralisch Verabscheuungswürdiges; „Gräuelpraktiken“ bewahrt die starke Wertung und macht zugleich deutlich, dass es um auszuübende Handlungen geht. „Nach … handeln“ gibt die durch כְ ausgedrückte Übereinstimmung wieder.
- source_word: הַגּוֹיִם הָהֵם
  choice: jener Völker
  rationale: גּוֹיִם bezeichnet hier die Völker des Landes; הָהֵם wird durch das distale „jener“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Stärke und Umfang von תּוֹעֵבָה
  choice: Gräuelpraktiken
  alternative: abscheuliche Bräuche
  rationale: „Gräuelpraktiken“ erhält die starke kultisch-moralische Verurteilung, ohne den Begriff vor der anschließenden Aufzählung auf eine einzelne Art von Handlung zu beschränken.
- issue: Bedeutung der Präposition כְ
  choice: 'konformativ: „nach … handeln“'
  alternative: 'komparativ: „Gräuelpraktiken wie die jener Völker ausüben“'
  rationale: Die Präposition kann Übereinstimmung beziehungsweise Vergleich ausdrücken. Der Haupttext formuliert die naheliegende Warnung vor einer Anpassung an diese Praktiken; die Fußnote bewahrt die eng verwandte Vergleichsnuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Klang. „Gräuelpraktiken“ ist bewusst stark, aber verständlich; die Satzstellung bleibt natürlich und eng am hebräischen Aufbau.
