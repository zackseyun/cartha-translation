  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Sie haben gut geredet.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie haben gut getan, was sie geredet haben.«'
    reason: Die Fußnote bewahrt die ungewöhnliche hebräische Konstruktion הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ, während der Haupttext sie idiomatisch wiedergibt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählfolge ein. »Da sagte« gibt diesen Anschluss in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bedeutet hier unmittelbar »zu mir«.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Sie haben gut geredet
  rationale: Wörtlich wird ihr Reden mit »gut handeln/tun« bewertet. Die idiomatische deutsche Formulierung verbindet diese positive Bewertung natürlich mit dem Verb »reden«, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« bewahrt ihn als Namen und vermeidet die Ersetzung durch den Titel »der HERR«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gereden« wird gegenüber dem formelleren »gesprochen« gewählt, weil »gut geredet« die positive Bewertung der konkreten Äußerung klar und natürlich ausdrückt.
