  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: de
  text: Du sollst Jahwe, deinem Gott, gegenüber untadelig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ganz“, „vollständig“ oder „ungeteilt“.'
    reason: 'Lexikalische Alternative: תָּמִים kann neben „untadelig“ auch Ganzheit, Ungeteiltheit oder Vollständigkeit bezeichnen.'
lexical_decisions:
- source_word: תָּמִים
  choice: untadelig
  rationale: Das Wort bezeichnet Unversehrtheit, Ganzheit und lautere Integrität. Im Zusammenhang mit der Abkehr von Wahrsagerei und anderen verbotenen Praktiken gibt „untadelig“ die ethische und bundestreue Ausrichtung wieder, ohne Sündlosigkeit zu behaupten.
- source_word: תִּהְיֶה
  choice: du sollst … sein
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier auffordernde beziehungsweise verpflichtende Kraft. „Du sollst … sein“ bewahrt den Weisungston und klingt im modernen Deutsch würdig und verständlich.
- source_word: עִם
  choice: in deiner Beziehung zu
  rationale: עִם bedeutet grundsätzlich „mit“. Die etwas ausführlichere deutsche Wiedergabe macht die hier gemeinte Beziehung zu Gott idiomatisch verständlich, ohne sie auf bloße räumliche Nähe oder ausschließlich auf ein Stehen „vor“ Gott zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: In der Verbindung mit Jahwe und dem Suffix der 2. Person Singular ist eindeutig der eine Gott Israels als der Gott des Angesprochenen gemeint.
theological_decisions:
- issue: Bedeutung von תָּמִים in der Bundesaufforderung
  choice: untadelig im Sinn lauterer, ungeteilter Treue zu Gott
  alternative: ganz, ungeteilt oder vollkommen mit Jahwe sein
  rationale: Der unmittelbare Kontext fordert Israel zu ungeteilter Bundestreue im Gegensatz zu okkulten Praktiken auf. „Untadelig“ wahrt den ethischen Anspruch; die Fußnote hält zugleich die Bedeutungskomponenten Ganzheit und Ungeteiltheit offen, ohne absolute Sündlosigkeit in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „in deiner Beziehung zu“ gibt das hebräische עִם idiomatisch wieder; „untadelig“ bewahrt die knappe ethische Zuspitzung des Ausgangstextes. Der Gottesname erscheint als „Jahwe“.
