base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: de
  text: Denn Jahwe, dein Gott, hat ihn aus allen deinen Stämmen erwählt, um im Namen Jahwes zu stehen und Dienst zu tun – er und seine Söhne, allezeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Tage«.'
    reason: Die Fußnote dokumentiert die konkrete hebräische Zeitformel hinter der idiomatischen Wiedergabe »allezeit«.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Regelung ein und bewahrt den erklärenden Zusammenhang.
- source_word: בּוֹ בָּחַר
  choice: hat ihn erwählt
  rationale: Bei בחר bezeichnet בּ den Erwählten. Das deutsche Perfekt gibt die vollzogene Wahl mit fortdauernder Bedeutung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: aus allen deinen Stämmen
  rationale: Bezeichnet die Auswahl aus der Gesamtheit der Stämme Israels.
- source_word: לַעֲמֹד
  choice: damit er vor ihm steht
  rationale: Bewahrt das konkrete Bild des Stehens als Ausdruck des priesterlichen Antretens vor Gott; „vor ihm“ macht die im kultischen Ausdruck vorausgesetzte Beziehung im Deutschen verständlich.
- source_word: לְשָׁרֵת
  choice: Dienst tut
  rationale: Kennzeichnet hier den priesterlich-kultischen Dienst und klingt im modernen Deutschen natürlicher als das isolierte „dient“ nach „steht“.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Bewahrt die offene, autoritative und repräsentative Bedeutung der hebräischen Wendung, ohne sie näher auszudeuten.
- source_word: הוּא וּבָנָיו
  choice: er und seine Söhne
  rationale: Gibt die ausdrücklich männliche Abstammungs- und Nachfolgesprache des Textes genau wieder.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Ist eine würdige, idiomatische deutsche Wiedergabe für einen fortdauernden Dienst; die wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Priesterliche Nachfolge in הוּא וּבָנָיו
  choice: er und seine Söhne
  alternative: er und seine Kinder/Nachkommen
  rationale: Der hebräische Text nennt ausdrücklich die Söhne; diese geschlechtsspezifische Aussage wird nicht neutralisiert.
- issue: Dauer des priesterlichen Dienstes
  choice: allezeit
  alternative: alle Tage
  rationale: „Allezeit“ drückt die fortdauernde Geltung aus, ohne die Frage nach ihrer genauen theologischen Reichweite durch „für immer“ vorzuentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die nachgestellte Präzisierung „er und seine Söhne“ klar hervor. Das kultische Bild des Stehens bleibt erhalten, während „allezeit“ die hebräische Dauerformel natürlich wiedergibt.
