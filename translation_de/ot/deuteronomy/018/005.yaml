  to: Denn Jahwe, dein Gott, hat ihn aus allen deinen Stämmen erwählt, um im Namen Jahwes zu stehen und Dienst zu tun – er und seine Söhne, allezeit.[a]
  rationale: Die einzige sichere Korrektur ist die Streichung von „vor ihm“, weil diese Ergänzung über den Wortlaut des hebräischen Textes hinausgeht. Die Satzstruktur, der Gottesname, die priesterliche Dienstsprache, die explizite Nennung der Söhne und die Fußnotenverankerung bleiben erhalten.
