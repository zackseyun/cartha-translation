source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: de
  text: Die levitischen Priester – der ganze Stamm Levi – sollen weder Anteil noch Erbbesitz gemeinsam mit Israel haben. Von den für Jahwe bestimmten Opfergaben[a] und von seinem Erbteil[b] sollen sie essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von den Feueropfern Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: „Seinem Erbteil“ kann sich auf Jahwe oder kollektiv auf Levi beziehen. Vergleiche Vers 2, wo Jahwe als Levis Erbteil bezeichnet wird.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die appositionale Verbindung bezeichnet die Priester als zum Stamm Levi gehörig. Die knappe deutsche Form ist verständlich, ohne eine zweite, von den Priestern getrennte Gruppe einzuführen.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: der ganze Stamm Levi
  rationale: Die nachgestellte Apposition weitet die Aussage ausdrücklich auf den gesamten Stamm Levi aus; Gedankenstriche machen diese Funktion im Deutschen deutlich.
- source_word: חֵלֶק וְנַחֲלָה
  choice: weder Anteil noch Erbbesitz
  rationale: Das Wortpaar bezeichnet Anteil und erblich zugewiesenen Besitz. Die deutsche weder-noch-Konstruktion gibt die Verneinung beider Begriffe natürlich wieder.
- source_word: עִם יִשְׂרָאֵל
  choice: gemeinsam mit Israel
  rationale: Gemeint ist, dass Levi keinen entsprechenden Besitz zusammen mit den übrigen Israeliten erhält. Die Formulierung wahrt das hebräische עִם („mit“).
- source_word: אִשֵּׁי יְהוָה
  choice: die für Jahwe bestimmten Opfergaben
  rationale: אִשִּׁים bezeichnet kultische Opfergaben, die Jahwe dargebracht werden. Die Wiedergabe ist im heutigen Deutsch verständlich; die traditionell wörtlichere Fassung „Feueropfer“ bleibt in einer Fußnote erhalten.
- source_word: וְנַחֲלָתוֹ
  choice: und von seinem Erbteil
  rationale: Das maskuline Singularsuffix wird formal als „sein“ bewahrt. Dadurch bleibt offen, ob es sich auf Jahwe oder kollektiv auf Levi bezieht.
- source_word: יֹאכֵלוּן
  choice: sollen sie essen
  rationale: Der Imperfekt hat hier gesetzlich-normative beziehungsweise regelmäßige Bedeutung. „Sollen sie essen“ erhält zugleich das konkrete Bild der priesterlichen Teilnahme an den Opfergaben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Singularsuffixes in וְנַחֲלָתוֹ
  choice: Die Mehrdeutigkeit durch „sein Erbteil“ bewahren
  alternative: „Jahwes Erbteil“ oder „ihr Erbteil“
  rationale: Das Suffix ist grammatisch Singular und kann sich auf den unmittelbar vorausgehenden Gottesnamen oder kollektiv auf Levi beziehen. Eine eindeutige Festlegung würde die im Ausgangstext vorhandene Spannung beseitigen; Vers 2 ist für die Deutung wichtig, entscheidet die Syntax von Vers 1 aber nicht zweifelsfrei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche kennzeichnen die appositionale Ausweitung auf den ganzen Stamm. Die Schlussstellung „sollen sie essen“ bewahrt den Nachdruck des hebräischen Satzes und den konkreten kultischen Vorgang.
