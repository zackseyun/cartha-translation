source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: de
  text: Ich werde ihnen aus der Mitte ihrer Brüder[a] einen Propheten wie dich erwecken. Ich werde ihm meine Worte in den Mund legen, und er wird ihnen alles sagen, was ich ihm gebiete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Mitte ihrer Verwandten“ beziehungsweise „aus der Mitte ihrer Mitisraeliten“. Wörtlich: „aus der Mitte ihrer Brüder“.'
    reason: Lexikalische Alternative und Erläuterung des gemeinschaftlichen Verwandtschaftssinns von אֲחֵיהֶם.
lexical_decisions:
- source_word: נָבִיא
  choice: einen Propheten
  rationale: Die übliche und sachlich genaue Wiedergabe für einen Menschen, der in Gottes Auftrag spricht; der unbestimmte Ausdruck entspricht dem Kontext der Verheißung.
- source_word: אָקִים
  choice: werde … erwecken
  rationale: Das Hifil von קום bezeichnet hier, dass Gott einen Propheten auftreten lässt und beruft. „Erwecken“ bewahrt diese Bedeutung und den würdevollen biblischen Sprachgebrauch.
- source_word: לָהֶם
  choice: ihnen
  rationale: Der Dativ gibt die Zuwendung der göttlichen Gabe im Deutschen natürlich wieder.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: aus der Mitte ihrer Brüder
  rationale: Die Formulierung bildet sowohl מִקֶּרֶב („aus der Mitte“) als auch das wörtliche אֲחֵיהֶם („ihrer Brüder“) ab. Eine Fußnote erläutert den gemeinschaftlichen Verwandtschaftssinn.
- source_word: כָּמוֹךָ
  choice: wie dich
  rationale: Die unmittelbare Vergleichung mit Mose bleibt knapp und ausdrücklich erhalten.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Ich werde ihm meine Worte in den Mund legen
  rationale: Die natürliche deutsche Wendung bewahrt das anschauliche Bild der von Gott gegebenen prophetischen Botschaft.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: und er wird ihnen … sagen
  rationale: „Sagen“ ist im Deutschen zusammen mit dem Inhaltsobjekt „alles“ idiomatischer als „alles zu ihnen sprechen“ und gibt die gerichtete Mitteilung korrekt wieder.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: alles, was ich ihm gebiete
  rationale: „Alles, was“ gibt die umfassende Aussage wieder; „gebiete“ erhält die Autorität des göttlichen Auftrags, ohne die im Zukunftsrahmen stehende hebräische Verbform unnötig schwerfällig abzubilden.
theological_decisions:
- issue: Mögliche messianische Bestimmtheit des verheißenen Propheten
  choice: Der Haupttext spricht entsprechend dem Hebräischen von „einen Propheten wie dich“, ohne seine Identität festzulegen.
  alternative: Eine fortlaufende Reihe von Propheten oder ein einzelner endzeitlicher, im Messias erfüllter Prophet.
  rationale: Der Vers selbst benennt den Propheten nicht näher. Die Übersetzung bewahrt daher die Offenheit und trägt keine spätere kanonische Identifikation in den Wortlaut ein.
- issue: Bedeutungsumfang von אֲחֵיהֶם
  choice: „ihrer Brüder“ im Haupttext, ergänzt durch eine erläuternde Fußnote
  alternative: „ihrer Verwandten“, „ihrer Stammesgenossen“ oder „ihrer israelitischen Brüder“
  rationale: Die wörtliche männliche Verwandtschaftsbezeichnung bleibt erhalten; die Fußnote macht deutlich, dass sie im Kontext die verwandtschaftlich verbundene Gemeinschaft bezeichnen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des Hebräischen zu verändern. „Erwecken“, „in den Mund legen“ und „gebieten“ bewahren die prophetische und autoritative Prägung des Ausgangstextes.
