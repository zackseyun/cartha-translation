  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: de
  text: Und der Mensch, der nicht auf meine Worte hört, die er in meinem Namen sprechen wird – ich selbst werde ihn dafür zur Rechenschaft ziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich selbst werde es von ihm fordern.“ Das Hebräische bringt zum Ausdruck, dass Gott den Betreffenden für sein Nicht-Hören auf die durch den Propheten gesprochenen Worte zur Rechenschaft zieht.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und
  rationale: Die einleitende Verbform führt die Folge der vorausgehenden Verheißung ein. Ein schlichtes „Und“ ist im Deutschen natürlich und bewahrt den Anschluss.
- source_word: הָאִישׁ
  choice: der Mensch
  rationale: Das hebräische maskuline Singularwort bezeichnet hier repräsentativ eine Person. „Der Mensch“ bleibt der Form nahe und klingt im Deutschen würdig und allgemein verständlich.
- source_word: לֹא יִשְׁמַע אֶל
  choice: nicht auf … hört
  rationale: Die Verbindung kann Hören, Beachten und Gehorchen einschließen. „Auf … hören“ bewahrt diese Bedeutungsbreite, ohne sie auf bloßes akustisches Hören oder ausdrücklichen Gehorsam zu verengen.
- source_word: דְּבָרַי
  choice: meine Worte
  rationale: Der hebräische Plural mit Suffix wird unmittelbar wiedergegeben.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: die er … reden wird
  rationale: Das Imperfekt verweist im Zusammenhang auf das künftige Reden des angekündigten Propheten. „Reden wird“ erhält diesen Zukunftsbezug.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Die formnahe Wendung ist im Deutschen verständlich und bewahrt den Gedanken göttlicher Beauftragung und Autorität.
- source_word: אָנֹכִי
  choice: ich selbst
  rationale: Das selbstständige Personalpronomen setzt Nachdruck auf Gottes eigenes Handeln.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: werde ihn dafür zur Rechenschaft ziehen
  rationale: Die hebräische Wendung bedeutet in diesem Zusammenhang, dass Gott Rechenschaft fordert. Die deutsche Formulierung gibt den gerichtlichen Sinn natürlich wieder, ohne eine bestimmte Art der Strafe festzulegen.
theological_decisions:
- issue: Art der göttlichen Reaktion auf die Zurückweisung der prophetischen Worte
  choice: ich selbst werde ihn dafür zur Rechenschaft ziehen
  alternative: ich selbst werde es von ihm fordern
  rationale: Die Übersetzung bringt die göttliche Verantwortlichmachung zum Ausdruck, lässt aber offen, in welcher konkreten Weise Gott richtet oder straft.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Der Gedankenstrich hebt entsprechend der emphatischen Stellung von אָנֹכִי Gottes eigenes Eingreifen hervor.
