  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: de
  text: Die Erstlingsgabe von deinem Getreide, deinem jungen Wein und deinem Öl[a][b] sowie den ersten Anteil der Schur deiner Herde[c] sollst du ihm geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den ersten Anteil von deinem Getreide, deinem Wein und deinem Öl.'
    reason: lexical_alternative
  - marker: b
    text: „Junger Wein“ gibt einen hebräischen Ausdruck wieder, der häufig frisch erzeugten Wein bezeichnet.
    reason: cultural_note
  - marker: c
    text: 'Oder: den ersten Anteil der Wolle deiner Herde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: Erstlingsgabe / erster Anteil
  rationale: Das Wort bezeichnet das Erste beziehungsweise den vorrangigen Anteil. Bei den landwirtschaftlichen Erzeugnissen gibt „Erstlingsgabe“ den kultischen Zusammenhang natürlich wieder; bei der Schur ist „erster Anteil“ im Deutschen verständlicher.
- source_word: דָּגָן
  choice: Getreide
  rationale: Der hebräische Sammelbegriff bezeichnet Getreideerzeugnisse; „Getreide“ ist die übliche moderne deutsche Entsprechung.
- source_word: תִּירוֹשׁ
  choice: junger Wein
  rationale: Der Ausdruck bezeichnet häufig frisch erzeugten Wein. „Junger Wein“ bewahrt diesen Unterschied gegenüber dem allgemeinen Wort für Wein, ohne unnatürlich zu klingen.
- source_word: יִצְהָר
  choice: Öl
  rationale: Gemeint ist frisches Öl, im israelitischen Umfeld gewöhnlich Olivenöl. „Öl“ bleibt bei der allgemeineren Formulierung des Hebräischen.
- source_word: גֵּז
  choice: Schur
  rationale: Das Wort kann die Schur oder die dabei gewonnene Wolle bezeichnen. „Anteil von der Schur“ lässt diese sachliche Nähe bestehen und passt zum Gegenstand der Abgabe.
- source_word: צֹאן
  choice: Schafe
  rationale: Der Begriff kann Kleinvieh insgesamt bezeichnen, doch im Zusammenhang mit der Schur stehen die wolltragenden Schafe im Vordergrund; „Schafe“ ist hier idiomatisch und sachlich klar.
- source_word: תִּתֶּן לוֹ
  choice: sollst du ihm geben
  rationale: Die Imperfektform hat in dieser Rechtsbestimmung verpflichtende Kraft. Die Formulierung bewahrt zugleich das singularische „ihm“.
theological_decisions:
- issue: Bezug des Pronomens לוֹ („ihm“)
  choice: Das singularische „ihm“ bleibt im Text stehen.
  alternative: Den Empfänger ausdrücklich als „dem Priester“ oder kollektiv als Priesterschaft zu benennen.
  rationale: Der unmittelbare Zusammenhang bestimmt den priesterlichen Empfänger, doch der Vers selbst verwendet nur ein singularisches Pronomen. Die Übersetzung vermeidet daher eine unnötige Präzisierung.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Sollst du ihm geben“ hält den verpflichtenden Ton, ohne altertümlich zu wirken. Die Wiederholung von רֵאשִׁית wird sinngemäß durch „Erstlingsgabe“ und „ersten Anteil“ sichtbar gehalten.
