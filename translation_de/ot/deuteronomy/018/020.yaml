source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: de
  text: Doch der Prophet, der sich anmaßt[a], in meinem Namen ein Wort zu verkünden, das ich ihm nicht zu verkünden geboten habe, oder der im Namen anderer Götter spricht – dieser Prophet muss sterben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vermessen handelt“ beziehungsweise „der in seiner Vermessenheit spricht“. Das hebräische Verb bezeichnet vorsätzliche Anmaßung und ein arrogantes Überschreiten der eigenen Befugnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „soll sterben“ beziehungsweise „soll getötet werden“. Das Hebräische formuliert das Todesurteil knapp, ohne hier die Art der Vollstreckung ausdrücklich zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Markiert den starken Gegensatz zum zuvor beschriebenen legitimen Propheten in natürlichem, würdigem Deutsch.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Standardentsprechung für נָבִיא; der bestimmte Artikel bleibt erhalten.
- source_word: יָזִיד
  choice: der sich anmaßt
  rationale: Das Hifil von זיד bezeichnet vorsätzliche Anmaßung beziehungsweise vermessenes Überschreiten einer Grenze. Die verbale Wiedergabe passt natürlich zur folgenden Infinitivkonstruktion.
- source_word: לְדַבֵּר דָּבָר
  choice: ein Wort zu verkünden
  rationale: Bewahrt das Substantiv דָּבָר, während „verkünden“ im prophetischen Kontext natürlicher ist als die Wiederholung „ein Wort zu sprechen“.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Gibt die beanspruchte göttliche Bevollmächtigung wörtlich und idiomatisch wieder.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: das ich ihm nicht zu verkünden geboten habe
  rationale: Erhält den Relativsatz, den ausdrücklichen Befehl Gottes und den männlichen Bezug auf den Propheten.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: oder der … spricht
  rationale: Das Waw verbindet eine zweite alternative Verfehlung; „oder“ verdeutlicht, dass jede der beiden Handlungen unter das Urteil fällt.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: im Namen anderer Götter
  rationale: Nahe und zugleich natürliche Wiedergabe der Berufung auf andere Gottheiten als Autorität.
- source_word: וּמֵת
  choice: muss sterben
  rationale: Drückt die knappe rechtliche Todesbestimmung im heutigen Deutsch klar aus, ohne die im Hebräischen nicht ausdrücklich genannte Vollstreckungsweise hinzuzufügen.
- source_word: הַנָּבִיא הַהוּא
  choice: dieser Prophet
  rationale: Bewahrt die nachdrückliche Identifizierung durch Nomen und Demonstrativpronomen in idiomatischem Deutsch.
theological_decisions:
- issue: Bezug auf den göttlichen Namen in direkter Rede
  choice: „in meinem Namen“ bleibt in der ersten Person stehen.
  alternative: „im Namen des HERRN“
  rationale: Der hebräische Text enthält direkte Gottesrede. Die erste Person bewahrt diese Perspektive und fügt keinen Gottesnamen ein, der in diesem Vers nicht ausdrücklich steht.
- issue: Formulierung der Todesstrafe
  choice: „muss sterben“
  alternative: „soll getötet werden“ oder „wird sterben“
  rationale: Die Formulierung wahrt den knappen rechtlich-normativen Charakter, ohne ausdrücklich eine passive Hinrichtung zu behaupten oder die Aussage als bloße Vorhersage erscheinen zu lassen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Gesetzesstil. Die Konstruktion „der sich anmaßt, … zu verkünden“ vermeidet ein schwerfälliges Adverb und bewahrt die vorsätzliche Anmaßung. Der Gedankenstrich hebt das abschließende Urteil hervor.
