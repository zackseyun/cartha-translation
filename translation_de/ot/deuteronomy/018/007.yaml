  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: de
  text: Dann darf er[a] im Namen Jahwes, seines Gottes,[b] Dienst tun wie alle seine Brüder, die Leviten,[c] die dort vor Jahwe stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann soll er … Dienst tun.“ Das hebräische Imperfekt kann hier je nach Verständnis der Rechtsbestimmung erlaubend oder mit stärker zukünftig-verpflichtender Kraft wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: Hebräisch wörtlich „seine Brüder“, das heißt seine levitischen Brüder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Dann darf er … Dienst tun
  rationale: Das Piel von שׁרת bezeichnet hier den kultischen Dienst. „Dienst tun“ ist im Deutschen natürlich und bewahrt den sachlichen Bezug zum levitischen Dienst. Das Präfix וְ führt die Rechtsbestimmung aus dem Zusammenhang fort; „dann“ gibt diese Folgebeziehung wieder. „Darf“ wahrt die im Kontext naheliegende erlaubende Bedeutung des Imperfekts, ohne die stärker verpflichtende Lesart zu verschweigen.
- source_word: בְּשֵׁם
  choice: im Namen
  rationale: Die feste Wendung bezeichnet Handeln unter Berufung auf die Autorität beziehungsweise in Anrufung des Namens; „im Namen“ ist dafür die idiomatische deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname YHWH wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Der Possessivsuffix wird direkt wiedergegeben. Der Genitiv fügt sich nach „Jahwes“ als erklärende Apposition natürlich ins Deutsche ein.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: wie alle seine Brüder, die Leviten
  rationale: כְּכָל wird vergleichend mit „wie alle“ wiedergegeben. „Brüder“ bewahrt den ausdrücklich männlichen Verwandtschaftsausdruck; „die Leviten“ bleibt als appositionelle Erläuterung erhalten.
- source_word: הָעֹמְדִים שָׁם לִפְנֵי יְהוָה
  choice: die dort vor Jahwe stehen
  rationale: עמד wird in seiner anschaulichen Grundbedeutung „stehen“ bewahrt, obwohl das Stehen im Heiligtum zugleich Dienstbereitschaft einschließen kann. „Vor Jahwe“ entspricht der üblichen Wendung für die Gegenwart Gottes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ bewahrt seinen Charakter als persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
- issue: Modalität von וְשֵׁרֵת im rechtlichen Zusammenhang
  choice: darf … Dienst tun
  alternative: soll … Dienst tun; wird … Dienst tun
  rationale: Der vorausgehende Zusammenhang gewährt dem Leviten Zugang zum Dienst, weshalb die erlaubende Wiedergabe gut passt. Da das hebräische Imperfekt auch unmittelbarer zukünftig oder verpflichtend verstanden werden kann, bleibt diese Spannung in der Fußnote sichtbar.
- issue: Geschlechtsspezifischer Verwandtschaftsbegriff אֶחָיו
  choice: seine Brüder
  alternative: seine levitischen Stammesgenossen; die anderen Leviten
  rationale: Die Form bedeutet wörtlich „seine Brüder“ und bezieht sich hier auf männliche Leviten. Die nachfolgende Apposition erklärt den Bezug, sodass keine neutralisierende Umschreibung nötig ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dienst tun“ hält den kultischen Bezug fest, ohne altertümlich zu wirken. Die Satzstellung folgt natürlichem Deutsch, während die hebräische Apposition und das wörtliche „stehen“ erhalten bleiben.
