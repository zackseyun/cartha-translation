  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: de
  text: 'Und dies ist der Anteil, der den Priestern vom Volk zusteht: Wer ein Schlachtopfer darbringt, sei es ein Rind oder ein Schaf, soll dem Priester den Vorderlauf[a], die beiden Backen[b] und den Magen[c] geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Arm“; beim Tier ist der Vorderlauf oder Schulterabschnitt gemeint.
    reason: lexical_alternative
  - marker: b
    text: Auch „Kinnbacken“ oder „Kiefer“. Das Hebräische hat eine Dualform.
    reason: lexical_alternative
  - marker: c
    text: Auch „Labmagen“; die genaue anatomische Zuordnung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: steht ... zu
  rationale: Im kultisch-rechtlichen Zusammenhang bezeichnet das Wort den vorgeschriebenen Anspruch beziehungsweise den zustehenden Anteil der Priester, nicht ein abstraktes Urteil.
- source_word: הַכֹּהֲנִים
  choice: den Priestern
  rationale: Der Plural wird direkt bewahrt; zusammen mit „steht ... zu“ ergibt sich im Deutschen eine natürliche Wiedergabe des priesterlichen Anspruchs.
- source_word: מֵאֵת הָעָם
  choice: vom Volk
  rationale: Dies gibt den allgemeinen Ausdruck des Hebräischen knapp und direkt wieder, ohne ihn ausdrücklich auf die Israeliten einzuengen.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: von denen, die ein Schlachtopfer darbringen
  rationale: Die Wortstammwiederholung des Hebräischen lässt sich im natürlichen Deutschen nicht ohne Schwerfälligkeit nachbilden. „Schlachtopfer darbringen“ bewahrt den kultischen Sinn und kennzeichnet die betreffende Gruppe aus dem Volk.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: sei es ein Rind oder ein Schaf
  rationale: „Rind“ vermeidet die im Deutschen mögliche Festlegung von „Ochse“ auf ein kastriertes männliches Tier; „Schaf“ ist eine klare, kontextgerechte Wiedergabe des Kleinviehsbegriffs.
- source_word: וְנָתַן
  choice: Man soll ... geben
  rationale: Die hebräische Singularform hat hier verteilenden rechtlichen Sinn. Das unpersönliche „man“ ist im modernen Deutschen natürlich und bleibt ohne unnötige Geschlechtsfestlegung.
- source_word: לַכֹּהֵן
  choice: dem Priester
  rationale: Der bestimmte Singular des Hebräischen wird direkt wiedergegeben und bezeichnet den jeweils empfangenden Priester.
- source_word: הַזְּרֹעַ
  choice: den Vorderlauf
  rationale: Wörtlich bezeichnet das Wort den „Arm“; beim Opfertier ist damit der Vorderlauf beziehungsweise Schulterabschnitt gemeint. „Vorderlauf“ ist anatomisch klar und vermeidet die ungenaue Übertragung menschlicher Anatomie.
- source_word: הַלְּחָיַיִם
  choice: die beiden Kinnbacken
  rationale: Die duale Form wird durch „beiden“ sichtbar gemacht. „Kinnbacken“ gibt den anatomischen Bezug bei einem Tier deutlicher wieder als das möglicherweise missverständliche „Wangen“.
- source_word: הַקֵּבָה
  choice: den Magen
  rationale: „Magen“ ist die klare moderne Bezeichnung; das traditionelle „Labmagen“ beziehungsweise „Magenstück“ wäre spezifischer, als die lexikalische Evidenz sicher verlangt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Rechtssprache mit verständlicher Opfertier-Terminologie. Der Satzbau folgt der hebräischen Anspruchs- und Zuteilungsstruktur, wird aber für heutiges Standarddeutsch geglättet. Die partitive Beziehung zwischen „Volk“ und den Opfernden bleibt erhalten.
