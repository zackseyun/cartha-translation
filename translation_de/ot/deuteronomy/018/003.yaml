- from: 'Und dies steht den Priestern vom Volk zu, von denen, die ein Schlachtopfer darbringen, sei es ein Rind oder ein Schaf: Man soll dem Priester den Vorderlauf[a], die beiden Kinnbacken[b] und den Magen[c] geben.'
  to: 'Und dies ist der Anteil, der den Priestern vom Volk zusteht: Wer ein Schlachtopfer darbringt, sei es ein Rind oder ein Schaf, soll dem Priester den Vorderlauf[a], die beiden Backen[b] und den Magen[c] geben.'
  rationale: Die Revision klärt die deutsche Konstruktion des priesterlichen Anspruchs und gibt die distributive hebräische Singularform idiomatisch durch „Wer ... soll“ wieder. Die Empfängereinheit „dem Priester“ bleibt erhalten. Die Anmerkungen sichern die einschlägigen anatomischen Alternativen ab, ohne beim letzten Begriff eine umstrittene Spezifizierung im Haupttext zu erzwingen.
