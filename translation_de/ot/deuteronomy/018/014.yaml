source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: de
  text: Denn diese Völker, die du aus ihrem Besitz verdrängst,[a] hören auf Zeichendeuter[b] und Wahrsager. Doch dir hat Jahwe, dein Gott, so etwas nicht gegeben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Land du in Besitz nimmst“. Das hebräische Verb kann sowohl die Besitznahme als auch die Verdrängung der bisherigen Bewohner bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Zeichendeuter“ sind Menschen, die Zeichen oder Vorzeichen beobachten und auslegen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: „Doch du – nicht so hat Jahwe, dein Gott, dir gegeben.“ Was „gegeben“ wurde, bleibt im Hebräischen unausgesprochen; gemeint sind im Zusammenhang solche Praktiken oder Mittel der Weisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zu den vorangehenden Verboten ein.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: Bezeichnet hier die nichtisraelitischen Bevölkerungsgruppen des Landes; „Völker“ ist sachlich und im Deutschen geläufig.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם
  choice: die du aus ihrem Besitz verdrängst
  rationale: ירשׁ umfasst in diesem Zusammenhang sowohl die Besitznahme als auch die damit verbundene Verdrängung der bisherigen Bewohner. Die Formulierung bringt beide Seiten möglichst knapp zum Ausdruck.
- source_word: אֶל מְעֹנְנִים
  choice: auf Zeichendeuter
  rationale: Das Wort bezeichnet Personen, die Zeichen oder Vorzeichen deuten. „Zeichendeuter“ ist verständlich und legt sich nicht auf eine einzelne mutmaßliche Technik fest.
- source_word: וְאֶל קֹסְמִים
  choice: und Wahrsager
  rationale: קֹסְמִים bezeichnet Menschen, die Wahrsagerei beziehungsweise Divination betreiben. „Wahrsager“ ist im modernen Deutsch unmittelbar verständlich.
- source_word: יִשְׁמָעוּ
  choice: hören auf
  rationale: Bewahrt den Grundsinn von שׁמע und drückt zugleich aus, dass die Völker den genannten Personen Beachtung schenken.
- source_word: וְאַתָּה לֹא כֵן
  choice: Doch dir … so etwas nicht
  rationale: Die hebräische Wendung ist verkürzt und stellt Israel betont den Völkern gegenüber. „Doch dir“ erhält diesen Kontrast; „so etwas“ nimmt den ausgelassenen Bezug auf.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: hat Jahwe, dein Gott, … nicht gegeben
  rationale: „Gegeben“ gibt נתן formal wieder und vermeidet es, die Aussage ausschließlich als Erlaubnisformel auszulegen. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht genanntes Objekt bei נָתַן לְךָ
  choice: so etwas nicht gegeben
  alternative: nicht erlaubt, so etwas zu tun
  rationale: Im Hebräischen bleibt das Objekt unausgesprochen. „So etwas“ macht den deutschen Satz verständlich, ohne die offene Aussage auf ein ausdrückliches Erlauben oder Verbieten zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt knapp und kontrastreich. „Zeichendeuter“ und „Wahrsager“ unterscheiden die beiden hebräischen Bezeichnungen, während die Fußnoten kulturelle und lexikalische Unschärfen offenlegen.
