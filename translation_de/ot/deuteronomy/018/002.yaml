base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: de
  text: Er soll kein Erbteil unter seinen Brüdern[a] haben; Jahwe ist sein Erbteil, wie er zu ihm geredet hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter seinen Stammesgenossen“. Wörtlich steht im Hebräischen „unter seinen Brüdern“; gemeint sind seine israelitischen Volksgenossen, besonders die anderen Stämme.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie er zu ihm gesagt hat“. Das hebräische Verb ist das gewöhnliche Wort für „reden“; „wie er es ihm versprochen hat“ ist dem Sinn nach möglich, aber stärker deutend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: Erbteil
  rationale: Im deuteronomischen Zusammenhang bezeichnet נַחֲלָה den erblich zugeteilten Landanteil. „Erbteil“ bewahrt sowohl diesen rechtlichen Sinn als auch die metaphorische Aussage über Jahwe; die Wiederholung entspricht dem Hebräischen.
- source_word: בְּקֶרֶב
  choice: unter
  rationale: בְּקֶרֶב אֶחָיו bedeutet idiomatisch „unter seinen Brüdern“. Diese Formulierung ist natürliches, gehobenes Standarddeutsch.
- source_word: אֶחָיו
  choice: seinen Brüdern
  rationale: Das hebräische Wort lautet wörtlich „seine Brüder“ und bezeichnet hier seine israelitischen Stammesgenossen, insbesondere die anderen Stämme. Die konkrete Verwandtschaftsbezeichnung bleibt im Haupttext erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא
  choice: ist
  rationale: Das selbstständige Pronomen hebt Jahwe hervor. Im Deutschen vermittelt die knappe Satzstellung „Jahwe ist sein Erbteil“ die Aussage natürlich, ohne das schwerfällige „er selbst“ einzufügen.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: wie er zu ihm geredet hat
  rationale: דִּבֶּר ist das gewöhnliche Verb für „reden/sprechen“. „Ger edet hat“ bewahrt den Wortlaut, während „versprochen hat“ die im Zusammenhang mögliche Zusage ausdrücklich machen und damit stärker deuten würde.
theological_decisions:
- issue: Bezug der männlichen Singularpronomen
  choice: Der Singular bleibt als repräsentative beziehungsweise kollektive Bezeichnung des Leviten erhalten.
  alternative: Die Pronomen könnten ausschließlich Levi als Stammvater oder distributiv jeden einzelnen Priester bezeichnen.
  rationale: Der unmittelbare Zusammenhang betrifft die levitischen Priester beziehungsweise den Stamm Levi. Der hebräische Singular lässt die genaue Nuance offen; die deutsche Singularform wahrt diese Offenheit.
- issue: Bedeutung von „Jahwe ist sein Erbteil“
  choice: Die bündige bundestheologische Metapher bleibt ohne erklärenden Zusatz stehen.
  alternative: Man könnte ausdeutend formulieren, Jahwe sei anstelle eines Landanteils der zugeteilte Besitz der Leviten.
  rationale: Der hebräische Text bezeichnet Jahwe selbst als Erbteil. Die Übersetzung bewahrt diese theologische Spannung und erweitert sie nicht zu einer Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbteil“ wird in beiden Satzhälften beibehalten, um die hebräische Wiederholung und den Übergang vom Landanteil zur theologischen Metapher sichtbar zu machen. Die Formulierung „geredet hat“ ist bewusst etwas feierlicher, bleibt aber allgemein verständlich.
