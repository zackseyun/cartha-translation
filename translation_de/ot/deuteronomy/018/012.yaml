base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: de
  text: Denn jeder, der all dies tut, ist für Jahwe ein Gräuel. Und wegen dieser Gräuel vertreibt[a] Jahwe, dein Gott, sie vor dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nimmt ihnen ihr Land weg; das hebräische Verb kann sowohl das Vertreiben als auch den dadurch bewirkten Verlust des Landes hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehenden Verbote; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: תוֹעֲבַת יְהוָה
  choice: für Jahwe ein Gräuel
  rationale: Die Wendung bezeichnet etwas, das in Jahwes Augen zutiefst verabscheuungswürdig ist. „Ein Gräuel“ bewahrt die starke moralische Wertung und ermöglicht die Wiederaufnahme im Plural.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: jeder, der all dies tut
  rationale: כָּל mit Partizip bezeichnet umfassend jede Person, die die zuvor genannten Praktiken ausübt.
- source_word: וּבִגְלַל
  choice: Und wegen
  rationale: Die Präposition bezeichnet den ursächlichen Grund des folgenden Gerichts.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: dieser Gräuel
  rationale: Der Plural verweist auf die zuvor aufgezählten verbotenen Praktiken; die Wortwahl wahrt die lexikalische Verbindung zum singularischen „Gräuel“.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der Singular der Anrede bleibt erhalten und richtet das Wort unmittelbar an Israel.
- source_word: מוֹרִישׁ אֹתָם
  choice: vertreibt sie
  rationale: Der Hifil von ירש bezeichnet hier, dass die Völker ihren Besitz am Land verlieren und von dort entfernt werden. „Vertreibt“ ist im Kontext idiomatisch; die Besitzkomponente wird in der Fußnote kenntlich gemacht.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die wörtliche Vorstellung „von deinem Angesicht weg“ ist in diesem Eroberungskontext mit „vor dir“ knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Wiedergabe als „Jahwe“ bewahrt den offenbarten Bundesnamen.
- issue: Träger der Verabscheuungswürdigkeit
  choice: Jeder Täter ist für Jahwe ein Gräuel
  alternative: Die Handlungen sind für Jahwe ein Gräuel
  rationale: Das hebräische Subjekt כָּל עֹשֵׂה אֵלֶּה bezeichnet ausdrücklich jeden, der diese Dinge tut. Die Übersetzung schwächt diese personenbezogene Aussage nicht zu einer bloßen Bewertung der Handlungen ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Gräuel“ bewahrt den bewussten lexikalischen Zusammenhang des hebräischen Singulars und Plurals. Der Vers wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
