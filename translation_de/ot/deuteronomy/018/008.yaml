  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: de
  text: Sie sollen zu gleichen Teilen essen, zusätzlich zu den Einkünften, die ihnen aus dem Verkauf ihres Erbbesitzes zufallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zusätzlich zu seinen Einkünften aus dem Besitz seines Vaterhauses«. Der hebräische Wortlaut der Schlusswendung ist schwierig und kann allgemeiner Einkünfte oder Ansprüche bezeichnen, die mit seinem angestammten Familienverband zusammenhängen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: den gleichen Anteil
  rationale: Die idiomatische Verbindung bedeutet wörtlich »Anteil wie Anteil« und bezeichnet eine gleichberechtigte Zuteilung.
- source_word: יֹאכֵלוּ
  choice: essen
  rationale: Die konkrete Bedeutung des Verbs bleibt erhalten; im Zusammenhang geht es um den Verzehr der den Priestern zustehenden Anteile.
- source_word: לְבַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet etwas, das neben dem gleichen Anteil aus einer anderen Quelle hinzukommt.
- source_word: מִמְכָּרָיו
  choice: was er durch den Verkauf … erhält
  rationale: Das Wort kann Verkäufe, Verkauftes oder Verkaufserlös bezeichnen. Die Formulierung gibt den wahrscheinlichen wirtschaftlichen Sinn natürlich wieder.
- source_word: עַל הָאָבוֹת
  choice: seines Erbbesitzes
  rationale: Die elliptische Wendung lautet wörtlich etwa »bei/auf den Vätern« und verweist wahrscheinlich auf Besitz oder Ansprüche aus dem angestammten Familienverband.
theological_decisions:
- issue: Deutung der schwierigen Schlussklausel מִמְכָּרָיו עַל הָאָבוֹת
  choice: Sie bezeichnet Einnahmen aus dem Verkauf angestammten Familienbesitzes, die zum gleichen priesterlichen Anteil hinzukommen.
  alternative: Die Klausel kann allgemeiner auf Einkünfte oder Ansprüche aus seinem Vaterhaus bezogen werden.
  rationale: Der hebräische Ausdruck ist syntaktisch stark verkürzt. Die Hauptübersetzung gibt eine plausible Lesart wieder, während die Fußnote die echte Unsicherheit offenhält und keine besondere spätere Rechts- oder Lehrtradition voraussetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede vom Essen bleibt erhalten; die schwer verständliche Schlusswendung wird im Haupttext lesbar wiedergegeben, ihre Unsicherheit jedoch in der Fußnote ausdrücklich bewahrt.
