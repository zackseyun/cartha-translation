    issue: Unnatürlicher Numeruswechsel im Haupttext
    rationale: Der Entwurf verbindet „Sie sollen“ mit „was er ... erhält“. Der hebräische Wechsel ist textlich vorhanden, aber eine deutsche pluralische Sammelbezugnahme ist hier natürlich und inhaltlich neutral.
  - severity: medium
    issue: Formulierung der Schlussklausel kann präziser an der gewählten Lesart ausgerichtet werden
    rationale: „Was er durch den Verkauf seines Erbbesitzes erhält“ ist verständlich, aber „Einkünfte aus dem Verkauf“ bildet מִמְכָּרָיו als Verkäufe/Verkaufserträge unmittelbarer ab. Die Fußnote muss die erhebliche Auslegungsunsicherheit weiterhin klar markieren.
