  source_fidelity: Die Wiedergabe von חֵלֶק כְּחֵלֶק als gleiche Zuteilung und von יֹאכֵלוּ mit „essen“ trifft den hebräischen Ausdruck im Kontext der priesterlichen Versorgung. Die Schlussklausel מִמְכָּרָיו עַל־הָאָבוֹת ist jedoch elliptisch und umstritten; „Erbbesitz“ ist als Hauptlesart vertretbar, sollte aber sprachlich als Einkunft aus dessen Verkauf formuliert werden. Die pluralische deutsche Bezugnahme vermeidet zudem den im Entwurf etwas abrupten Wechsel von „Sie“ zu „er“, ohne eine sachliche Einzelperson festzulegen.
  naturalness: „Den gleichen Anteil essen“ ist im Deutschen verständlich, aber weniger idiomatisch. „Zu gleichen Teilen essen“ bewahrt das konkrete „essen“ und gibt die distributive Gleichheit natürlich wieder. „Was ihnen ... zufällt“ ist flüssiger als der Wechsel zu „was er ... erhält“.
  terminology: „Erbbesitz“ ist für eine mögliche patrimoniale Deutung angemessen, darf aber wegen der schwierigen hebräischen Syntax nicht als einzig mögliche Erklärung behandelt werden. Die Fußnote bewahrt die breitere Möglichkeit von Einkünften oder Ansprüchen im Zusammenhang mit dem Vaterhaus.
