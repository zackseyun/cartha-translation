- from: Sie sollen den gleichen Anteil essen, zusätzlich zu dem, was er durch den Verkauf seines Erbbesitzes erhält.[a]
  to: Sie sollen zu gleichen Teilen essen, zusätzlich zu den Einkünften, die ihnen aus dem Verkauf ihres Erbbesitzes zufallen.[a]
  rationale: Die Revision macht die Gleichheit der Anteile im modernen Deutschen idiomatischer und glättet den nicht erforderlichen Numeruswechsel. Zugleich bleibt die im englischen Audit Trail bevorzugte Lesart von Verkaufserträgen aus patrimonialem Besitz im Haupttext erhalten. Die Fußnote sichert die umstrittene und syntaktisch verkürzte Schlussklausel gegen eine zu enge Festlegung ab.
