  verdict: approve
  source_fidelity: „Und alle geflügelten Kleintiere“ gibt כָּל־שֶׁרֶץ הָעוֹף als umfassende Kategorie angemessen wieder. Die Formulierung wahrt, dass es sich um kleine fliegende bzw. geflügelte Lebewesen handelt, ohne die Kategorie im Haupttext unzulässig auf Insekten einzuengen. „Sind für euch unrein“ trifft den kultisch-speiserechtlichen Sinn von טָמֵא לָכֶם; „sie dürfen nicht gegessen werden“ gibt das passive pluralische Verbot לֹא יֵאָכֵלוּ idiomatisch wieder.
  naturalness: Der Satz ist modernes, verständliches und dem Gesetzeskontext angemessen würdevolles Standarddeutsch. Der Plural in „Kleintiere … sie“ ist syntaktisch klar und entspricht dem pluralischen hebräischen Verb.
  terminology: „Unrein“ ist der im Deutschen etablierte Ausdruck für die rituelle Kategorie. „Geflügelte Kleintiere“ ist als verständliche Haupttextlösung vertretbar; die Fußnote legt die wörtlichere und lexikalisch weiter gefasste hebräische Wendung offen und erläutert sachgerecht den wahrscheinlichen Bezug auf fliegende Insekten.
