  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: de
  text: Und alle geflügelten Kleintiere sind für euch unrein[a]; sie dürfen nicht gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „alles Gewimmel der fliegenden Tiere“ oder „alles fliegende Kleingetier“. Die hebräische Wortverbindung meint wahrscheinlich vor allem fliegende Insekten und nicht Vögel im gewöhnlichen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Und alle
  rationale: וְ verbindet die Vorschrift mit dem vorhergehenden Speisegesetz; כֹל bezeichnet die gesamte betreffende Tierklasse. Der Plural ist im Deutschen bei einer Gattungsbezeichnung natürlich und passt zum folgenden hebräischen Pluralverb.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: geflügelten Kleintiere
  rationale: שֶׁרֶץ bezeichnet sich zahlreich bewegendes beziehungsweise wimmelndes Kleingetier, während עוֹף fliegende oder geflügelte Tiere bezeichnet. Die Verbindung meint hier wahrscheinlich vor allem fliegende Insekten. „Geflügelte Kleintiere“ gibt die gemeinte Kategorie verständlich wieder, ohne sie ausdrücklich auf Insekten zu beschränken.
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ ist der etablierte deutsche Ausdruck für die kultisch-rituelle und speiserechtliche Kategorie, nicht bloß für körperliche Verschmutzung.
- source_word: הוּא לָ/כֶם
  choice: sind für euch
  rationale: לָכֶם kennzeichnet die Geltung der Reinheitsbestimmung für Israel. Das resumptive הוּא muss im natürlichen Deutschen nicht gesondert wiedergegeben werden; der deutsche Plural folgt der als Mehrzahl formulierten Tierklasse.
- source_word: לֹא יֵאָכֵלוּ
  choice: sie dürfen nicht gegessen werden
  rationale: Die passive Form des hebräischen Niphal und der grammatische Plural bleiben erhalten. „Dürfen nicht“ drückt das rechtliche Verbot in heutigem Deutsch natürlicher aus als ein futurisch missverständliches „werden nicht“.
