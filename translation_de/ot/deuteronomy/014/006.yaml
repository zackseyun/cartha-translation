  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: de
  text: Jedes Tier, das gespaltene Hufe hat, die vollständig in zwei Teile geteilt sind, und wiederkäut, dürft ihr essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jedes Tier, das den Huf spaltet und eine Spaltung macht, nämlich zwei Hufe, das unter den Tieren Wiedergekäutes heraufbringt – dieses dürft ihr essen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: Von allen Tieren … jedes
  rationale: Diese Formulierung gibt den distributiven Sinn von וְכָל natürlich wieder. בְּהֵמָה bezeichnet hier allgemein die betreffende Klasse der Landtiere, nicht nur Nutzvieh.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: gespaltene Hufe hat
  rationale: Die idiomatische deutsche Wendung bewahrt das konkrete Merkmal des gespaltenen Hufs.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: deren Spalt sie vollständig in zwei Hufteile teilt
  rationale: Die verstärkende hebräische Formulierung wird so als tatsächliche, vollständige Teilung in zwei Hufteile wiedergegeben, ohne archaisch zu klingen.
- source_word: מַעֲלַת גֵּרָה
  choice: wiederkäut
  rationale: „Wiederkäuen“ ist die natürliche und präzise deutsche Bezeichnung für das Heraufbringen und erneute Kauen der Nahrung.
- source_word: בַּבְּהֵמָה
  choice: Von allen Tieren
  rationale: Die Einordnung innerhalb der Tierklasse wird im Deutschen natürlich an den Satzanfang gezogen.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: dürft ihr jedes essen
  rationale: Im gesetzlichen Zusammenhang bezeichnet die Form eine Erlaubnis, nicht ein Gebot, jedes entsprechende Tier tatsächlich zu essen; das Objektpronomen wird durch „jedes“ aufgenommen.
