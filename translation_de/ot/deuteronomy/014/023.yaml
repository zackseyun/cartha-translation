source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: de
  text: Du sollst vor Jahwe, deinem Gott, an dem Ort, den er erwählen wird, um seinen Namen dort wohnen zu lassen, den Zehnten von deinem Getreide, deinem jungen Wein und deinem Öl sowie die Erstgeburten deiner Rinder und deiner Schafe und Ziegen essen, damit du lernst, Jahwe, deinen Gott, dein Leben lang zu fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Du sollst … essen
  rationale: Das Qal-Perfekt mit וְ setzt im gesetzlichen Zusammenhang die Anweisung fort. Die deutsche Soll-Form gibt diesen verpflichtenden, zukunftsbezogenen Sinn natürlich wieder.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: לִפְנֵי bezeichnet hier das Essen vor beziehungsweise in der Gegenwart Gottes. „Vor“ bewahrt die knappe kultische Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: an dem Ort, den er erwählen wird
  rationale: Die Formulierung bewahrt den vorausweisenden Charakter der deuteronomischen Heiligtumsformel und gibt בַּמָּקוֹם im Deutschen idiomatisch mit „an dem Ort“ wieder.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um seinen Namen dort wohnen zu lassen
  rationale: Die Wiedergabe wahrt sowohl die kausative Form von שכן als auch das theologisch bedeutungsvolle Bild vom Wohnen des Namens am erwählten Ort.
- source_word: מַעְשַׂר
  choice: den Zehnten
  rationale: „Der Zehnte“ ist die etablierte deutsche Bezeichnung für den als Abgabe bestimmten zehnten Teil.
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: von deinem Getreide, deinem jungen Wein und deinem Öl
  rationale: Die traditionelle landwirtschaftliche Dreierformel bleibt erkennbar. „Junger Wein“ unterscheidet תִּירוֹשׁ von allgemeineren Wörtern für Wein, während „Öl“ die übliche Bedeutung von יִצְהָר wiedergibt.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: sowie die Erstgeburten deiner Rinder und deiner Schafe und Ziegen
  rationale: בְּכֹרוֹת bezeichnet die erstgeborenen Tiere. בָּקָר meint Großvieh, צֹאן dagegen Kleinvieh und umfasst Schafe wie Ziegen; die ausdrückliche Wiedergabe verhindert eine ungerechtfertigte Verengung auf Schafe.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: So sollst du lernen, … zu fürchten
  rationale: Die Formulierung gibt den von לְמַעַן bezeichneten Zweck in natürlichem Deutsch wieder. „Fürchten“ bewahrt die Spannweite von ehrfürchtiger Gottesfurcht und gehorsamer Haltung.
- source_word: כָּל־הַיָּמִים
  choice: dein Leben lang
  rationale: Die idiomatische deutsche Wendung gibt die zeitliche Gesamtheit von „alle Tage“ verständlich und ohne altertümlichen Klang wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als solcher sichtbar. Die deutsche Form „Jahwe“ ist eine etablierte Umschrift und vermeidet die Ersetzung des Namens durch einen Titel.
- issue: Die Heiligtumsformel לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: um seinen Namen dort wohnen zu lassen
  alternative: um seinen Namen dort einzusetzen
  rationale: Die gewählte Fassung bewahrt das hebräische Wohnbild sowie die Spannung zwischen Gottes unverfügbarer Gegenwart und der besonderen Bindung seines Namens an den erwählten Ort.
- issue: Bedeutung von לְיִרְאָה אֶת־יְהוָה
  choice: Jahwe … zu fürchten
  alternative: Jahwe … zu verehren
  rationale: „Fürchten“ hält die volle biblische Bedeutungsbreite offen und reduziert den Ausdruck weder auf Angst noch auf kultische Verehrung allein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gesetzessprache. Der Satzbau folgt dem hebräischen Gedankengang, wird aber durch einen zweiten Satz beim Zwecksatz lesbarer. „Schafe und Ziegen“ verdeutlicht den Umfang von צֹאן, ohne die Aussage konfessionell oder theologisch einzuengen.
