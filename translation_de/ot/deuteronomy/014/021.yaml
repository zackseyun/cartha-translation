    rationale: Die deutsche Konstruktion „jemandem heilig sein“ bezeichnet häufig etwas, das einer Person besonders teuer oder unverletzlich ist. Der hebräische Ausdruck beschreibt hier ein heiliges, Jahwe zugehöriges beziehungsweise ihm geweihtes Volk.
  - severity: low
    issue: „Ziegenjunges“ ist stilistisch weniger geläufig.
    rationale: „Junge Ziege“ ist im modernen Deutsch die natürlichere, klare Wiedergabe von גְּדִי und legt anders als „Böckchen“ kein Geschlecht fest.
