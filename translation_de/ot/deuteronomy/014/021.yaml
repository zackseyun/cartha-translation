  to: Ihr sollt kein verendetes Tier essen.[a] Du darfst es dem ansässigen Fremden[b] geben, der in deinen Ortschaften lebt,[c] und er darf es essen; oder du darfst es an einen Ausländer verkaufen.[d] Denn du bist ein Jahwe, deinem Gott, geweihtes heiliges Volk. Du sollst eine junge Ziege nicht in der Milch ihrer Mutter kochen.[e]
  rationale: Die Revision klärt die Weihe und Zugehörigkeit des heiligen Volkes zu Jahwe und ersetzt die weniger idiomatische Tierbezeichnung. Die im Ausgangstext und im englischen Audit Trail dokumentierte mögliche Rechtsnuance bei Geben und Verkaufen bleibt durch die Fußnote ausdrücklich erhalten.
