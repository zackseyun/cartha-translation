  source_fidelity: 'Die Grundstruktur und die wesentlichen Unterscheidungen des Hebräischen werden getroffen: נְבֵלָה, גֵּר gegenüber נָכְרִי, die Ortsformel „in deinen Toren“, der Gottesname und das Kochverbot. Die Formulierung „Jahwe ... heilig ist“ kann im Deutschen jedoch eher bedeuten, dass das Volk Jahwe besonders wertvoll oder heilig ist, statt dass es ein ihm geweihtes heiliges Volk ist. „Jahwe geweiht“ gibt לַיהוָה in diesem Zusammenhang klarer wieder.'
  naturalness: Der Text ist überwiegend modernes Standarddeutsch. „Ziegenjunges“ ist verständlich, aber weniger idiomatisch als „junge Ziege“. Die Anpassung vermeidet zugleich die unnötige männliche Festlegung von „Böckchen“.
  terminology: „Jahwe“ wahrt den Gottesnamen. „Ansässiger Fremder“ und „Ausländer“ erhalten die rechtlich-soziale Unterscheidung zwischen גֵּר und נָכְרִי. „Geweiht“ stellt die für עַם קָדוֹשׁ לַיהוָה zentrale Heiligkeit und Zugehörigkeit klar dar, ohne zusätzliche theologische Deutung.
