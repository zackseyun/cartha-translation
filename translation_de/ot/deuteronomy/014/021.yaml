  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: de
  text: Ihr sollt kein verendetes Tier essen.[a] Du darfst es dem ansässigen Fremden[b] geben, der in deinen Ortschaften lebt,[c] und er darf es essen; oder du darfst es an einen Ausländer verkaufen.[d] Denn du bist ein Jahwe, deinem Gott, geweihtes heiliges Volk. Du sollst eine junge Ziege nicht in der Milch ihrer Mutter kochen.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas, das von selbst verendet ist“. Das hebräische Wort נְבֵלָה bezeichnet ein totes Tier, das nicht auf die erlaubte Weise geschlachtet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Der „ansässige Fremde“ (גֵּר) war ein Nichtisraelit, der innerhalb der israelitischen Gemeinschaft lebte. Er ist vom „Ausländer“ (נָכְרִי) im folgenden Satzteil zu unterscheiden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der in deinen Toren ist“. „In den Toren“ ist eine hebräische Ausdrucksweise für das Leben in den Ortschaften oder örtlichen Gemeinschaften.'
    reason: cultural_note
  - marker: d
    text: 'Formaler ließe sich übersetzen: „Du sollst es ihm geben, und er soll es essen; oder verkaufe es an einen Ausländer.“ Die hebräische Rechtssprache kann hier als Erlaubnis oder als Anweisung verstanden werden.'
    reason: alternative_reading
  - marker: e
    text: 'Traditionell: „Du sollst ein Böckchen nicht in der Milch seiner Mutter kochen.“ Das hebräische גְּדִי bezeichnet ein junges Tier, gewöhnlich eine junge Ziege.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: verendetes Tier
  rationale: Gemeint ist der Körper eines Tieres, das nicht auf die erlaubte Weise geschlachtet wurde, insbesondere eines von selbst verendeten Tieres. „Verendetes Tier“ ist im modernen Deutsch klarer und als Speisebezeichnung natürlicher als das mehrdeutige „Kadaver“ oder das wertende „Aas“.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: Der Ausdruck bezeichnet einen Nichtisraeliten, der dauerhaft innerhalb der israelitischen Gemeinschaft lebt und dort einen anerkannten sozialen Status besitzt. Die Wiedergabe unterscheidet ihn vom נָכְרִי im folgenden Satzteil.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Wörtlich steht „in deinen Toren“. Gemeint sind die Orte beziehungsweise örtlichen Gemeinschaften unter Israels Zuständigkeit; „in deinen Ortschaften“ gibt dieses Idiom verständlich wieder.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: du darfst es ... geben ... und er darf es essen
  rationale: Die hebräischen Verbformen stehen im Rechtsstil. Im Zusammenhang gestatten sie die Weitergabe und den Verzehr durch den ansässigen Fremden, statt eine Pflicht zur Weitergabe aufzuerlegen.
- source_word: נָכְרִי
  choice: Ausländer
  rationale: Der Ausdruck bezeichnet hier einen auswärtigen Fremden ohne den ansässigen Status des גֵּר. „Ausländer“ hält den Unterschied zwischen beiden Gruppen deutlich.
- source_word: עַם קָדוֹשׁ לַיהוָה
  choice: ein Volk, das Jahwe ... heilig ist
  rationale: Die Formulierung bezeichnet Israel als Jahwe geweihtes und ihm zugehöriges Volk. Der Relativsatz klingt im Deutschen natürlicher als „ein heiliges Volk für Jahwe“ und bewahrt die Zuordnung durch die Präposition לְ.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גְּדִי
  choice: Ziegenjunges
  rationale: Das Wort bezeichnet ein junges Tier, gewöhnlich eine junge Ziege. „Ziegenjunges“ ist eindeutig und allgemein verständlich; „Böckchen“ wäre unnötig männlich festgelegt.
- source_word: תְבַשֵּׁל
  choice: kochen
  rationale: Das Verb bezeichnet das Garen beziehungsweise Kochen, häufig in Flüssigkeit. Im Deutschen erfasst „kochen“ die konkrete Handlung natürlicher als „sieden“.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: in der Milch seiner Mutter
  rationale: Die Formulierung bildet die konkrete Aussage des Hebräischen unmittelbar und idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn sichtbar und unterscheidet ihn von einem bloßen Titel.
- issue: Bedeutung der Heiligkeit Israels
  choice: ein Volk, das Jahwe, deinem Gott, heilig ist
  alternative: ein heiliges Volk für Jahwe, deinen Gott
  rationale: Die gewählte Fassung wahrt sowohl die Heiligkeit als auch die Beziehung der Zugehörigkeit und Weihe, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Rechtskraft der Verben beim Geben und Verkaufen
  choice: 'Erlaubnis: „darfst ... geben/verkaufen“'
  alternative: 'Anweisung: „sollst ... geben/verkaufen“'
  rationale: Im Zusammenhang liegt der Schwerpunkt auf dem Verbot für Israeliten und der erlaubten Weitergabe an Nichtisraeliten. Die permissive Wiedergabe vermeidet, aus der möglichen Verfügung eine zwingende Pflicht zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlichen Rechtsformulierungen. Der im Hebräischen vorhandene Wechsel von der pluralischen Anrede am Versanfang zur singularischen kollektiven Anrede Israels wird im Deutschen beibehalten („Ihr sollt ... Du darfst ...“), obwohl er auffällt. Fachsprachlich oder altertümlich wirkende Wörter wie „Beisasse“, „Aas“ und „Böckchen“ werden im Haupttext vermieden; die traditionelle Tierbezeichnung wird in einer Fußnote genannt.
