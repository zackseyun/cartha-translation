source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: de
  text: Den Leviten, der in deinen Städten lebt, sollst du nicht im Stich lassen,[a] denn er hat weder Anteil noch Erbbesitz bei dir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der in deinen Toren ist“. Gemeint sind die Städte beziehungsweise örtlichen Gemeinschaften.'
    reason: cultural_note
  - marker: b
    text: Die Leviten erhielten keinen gewöhnlichen Stammesanteil am Land Israels.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: Den Leviten
  rationale: Der bestimmte Singular bezeichnet repräsentativ einen Angehörigen des Stammes Levi. „Priester“ wäre zu eng, da nicht jeder Levit Priester war.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: der in deinen Städten lebt
  rationale: Wörtlich „der in deinen Toren [ist]“. Die hebräische Wendung meint die Ortschaften beziehungsweise örtlichen Gemeinschaften; die sinngemäße Wiedergabe ist im modernen Deutschen klar und natürlich.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: sollst du nicht im Stich lassen
  rationale: עזב kann „verlassen“, „im Stich lassen“ oder kontextuell „vernachlässigen“ bedeuten. „Nicht im Stich lassen“ bewahrt die Stärke des Verbs und schließt hier die praktische Versorgung ein.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung des Gebots ein und entspricht dem würdigen, zugleich natürlichen deutschen Bibelstil.
- source_word: אֵין לוֹ
  choice: er hat weder
  rationale: Idiomatistische Wiedergabe der hebräischen Existenzkonstruktion; „weder ... noch“ verbindet die beiden folgenden Begriffe natürlich.
- source_word: חֵלֶק וְנַחֲלָה
  choice: Anteil noch Erbbesitz
  rationale: חֵלֶק bezeichnet einen Anteil oder eine Zuteilung, נַחֲלָה den erblich zugewiesenen Besitz, besonders Land. „Erbbesitz“ macht den territorialen Hintergrund deutlicher als das allgemeinere „Erbe“.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Gibt die Zugehörigkeit zum Besitzstand Israels wieder, ohne den Ausdruck auf eine rein räumliche Bedeutung zu beschränken.
theological_decisions:
- issue: Art dessen, was dem Leviten fehlt
  choice: Der Levit besitzt keinen normalen Anteil am erblichen Landbesitz Israels.
  alternative: Die Aussage bezeichnet lediglich eine allgemeine gesellschaftliche Benachteiligung.
  rationale: Das Wortpaar חֵלֶק וְנַחֲלָה bezeichnet im deuteronomischen Zusammenhang den Anteil am territorialen Erbbesitz. Der Haupttext wahrt diese Aussage, ohne weitergehende konfessionelle Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung rückt den Leviten als Gegenstand des Gebots hervor. Das Quellenbild „in deinen Toren“ wird zugunsten unmittelbarer Verständlichkeit im Haupttext als „in deinen Städten“ wiedergegeben und in der Fußnote dokumentiert.
