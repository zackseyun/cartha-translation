  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: de
  text: den Strauß[a], den Habicht, die Möwe und den Falken nach seiner Art[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich »die Tochter der ya''anah«; damit ist wahrscheinlich der Strauß bezeichnet. Die genaue Bestimmung mehrerer Vögel in diesem Vers ist unsicher: Für תַּחְמָס kommen auch »Eule« oder ein anderer Vogel, für שָׁחַף auch »Kuckuck« oder ein Seevogel und für נֵץ auch »Habicht« infrage.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung bedeutet: »nach seiner Art«.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: den Strauß
  rationale: Die wörtliche Wendung »Tochter der ya'anah« fungiert hier als Tierbezeichnung. »Strauß« gibt die wahrscheinlichste heutige Bestimmung verständlich wieder; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: הַתַּחְמָס
  choice: den Habicht
  rationale: Die Vogelart ist nicht sicher bestimmbar. »Habicht« ist als Bezeichnung eines Greifvogels plausibel; abweichende Möglichkeiten werden in der Fußnote genannt.
- source_word: הַשָּׁחַף
  choice: die Möwe
  rationale: Die genaue Identifizierung ist unsicher, doch die neuere lexikalische Beurteilung weist häufig auf eine Möwe oder einen ähnlichen Seevogel. Die traditionelle Wiedergabe »Kuckuck« bleibt als Alternative vermerkt.
- source_word: הַנֵּץ
  choice: den Falken
  rationale: Das Wort bezeichnet einen Greifvogel und kann mit »Falke« oder »Habicht« wiedergegeben werden. »Falke« unterscheidet ihn im Deutschen von תַּחְמָס, ohne eine nicht belegte genauere Art festzulegen.
- source_word: לְמִינֵהוּ
  choice: nach seiner Art
  rationale: Die feste hebräische Klassifikationsformel wird nah am Wortlaut und zugleich idiomatisch wiedergegeben; sie schließt die zugehörigen Arten beziehungsweise Unterarten ein.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Listenstil; der Akkusativ und das abschließende Komma erhalten den syntaktischen Anschluss an den vorhergehenden Vers. Unsichere zoologische Identifizierungen werden nicht im Haupttext ausgebreitet, sondern transparent in der Fußnote dokumentiert.
