  text: You shall not eat any detestable thing[a].
translation:
  language: de
  text: Du sollst nichts Abscheuliches essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichts Verabscheuungswürdiges“. Das hebräische Wort bezeichnet etwas, das als abscheulich oder verabscheuenswert gilt; hier leitet es die folgende Liste verbotener Speisen ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: Du sollst … nicht essen
  rationale: Die Negation mit dem Qal-Imperfekt in diesem Rechtskontext drückt ein direktes Verbot aus. Die deutsche Formulierung mit „sollst … nicht“ bewahrt den verbindlichen Charakter.
- source_word: כָּל
  choice: nichts
  rationale: Mit einem singularischen Substantiv unter Verneinung bezeichnet כָּל den umfassenden Geltungsbereich. Im Deutschen ist „nichts Verabscheuungswürdiges“ natürlich und präzise.
- source_word: תּוֹעֵבָה
  choice: Verabscheuungswürdiges
  rationale: Das Wort bezeichnet etwas Abscheuliches oder Verabscheuenswertes. Die substantivierte Form ist in modernem Deutsch verständlich, bewahrt die starke Wertung und legt den Begriff nicht vorschnell ausschließlich auf rituelle Unreinheit fest.
theological_decisions:
- issue: Geltung des Verbots im Bundesgesetz
  choice: 'Direktes rechtliches Verbot: „Du sollst nichts Verabscheuungswürdiges essen.“'
  alternative: 'Beschreibende Aussage: „Du isst nichts Verabscheuungswürdiges.“'
  rationale: לֹא mit dem Imperfekt ist hier im Zusammenhang der Speisevorschriften als verbindliches Verbot zu verstehen; weitergehende theologische Deutungen werden nicht hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Singular entspricht der hebräischen Form. „Verabscheuungswürdiges“ erhält die inhaltliche Stärke des Ausgangsworts, während die Fußnote eine geläufigere Alternative und den unmittelbaren Speisekontext nennt.
