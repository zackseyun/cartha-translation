  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: de
  text: 'Und Folgende dürft ihr nicht essen: der Adler[a], der Bartgeier und der Mönchsgeier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung der hebräischen Vogelnamen in diesem Vers ist unsicher. „Adler“ kann möglicherweise einen großen Geier bezeichnen; der „Bartgeier“ wurde traditionell auch „Knochenbrecher“ genannt; statt „Mönchsgeier“ übersetzen manche „Fischadler“ oder „Seeadler“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Und dies sind
  rationale: Die hebräische Form ist grammatisch singular („und dies ist“), leitet aber eine Aufzählung ein. Im Deutschen ist die pluralische Wiedergabe „dies sind“ natürlich und sachgerecht.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: die ihr von ihnen nicht essen dürft
  rationale: Bewahrt das Verbot und gibt zugleich den partitiven Sinn von מִן („von/aus ihrer Mitte“) wieder; „ihnen“ verweist im Zusammenhang auf die Vögel.
- source_word: הַנֶּשֶׁר
  choice: der Adler
  rationale: Die traditionelle und allgemein verständliche Wiedergabe. Das hebräische Wort kann möglicherweise einen großen Geier bezeichnen; diese Unsicherheit wird in der Fußnote offengelegt.
- source_word: הַפֶּרֶס
  choice: der Bartgeier
  rationale: Bezeichnet wahrscheinlich den Bartgeier, einen großen aasfressenden Greifvogel; diese moderne Bezeichnung ist verständlicher als das veraltete „Knochenbrecher“.
- source_word: הָעָזְנִיָּה
  choice: der Mönchsgeier
  rationale: Eine plausible moderne Bestimmung des unsicher identifizierten Vogelnamens. Andere Übersetzungen nennen Fischadler oder Seeadler; die Unsicherheit bleibt in der Fußnote sichtbar.
theological_decisions: []
