base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: de
  text: Du sollst unbedingt den Zehnten vom gesamten Ertrag deiner Saat abgeben, der Jahr für Jahr vom Feld kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder flüssiger: „Du sollst jedes Jahr den Zehnten vom gesamten Ertrag deines Feldes abgeben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Du sollst gewissenhaft den Zehnten … abgeben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Gebot. „Gewissenhaft“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder, während „den Zehnten abgeben“ die Bedeutung klar ausdrückt.
- source_word: תְּבוּאַת
  choice: Ertrag
  rationale: Das Substantiv bezeichnet allgemein den landwirtschaftlichen Ertrag. „Ertrag“ ist breit genug und vermeidet eine unnötige Beschränkung auf eine bestimmte Feldfrucht.
- source_word: זַרְעֶךָ
  choice: deiner Aussaat
  rationale: Wörtlich steht „deines Samens“. Im Zusammenhang ist das Ausgesäte samt seinem Ertrag gemeint. „Aussaat“ bewahrt das landwirtschaftliche Bild und klingt im Deutschen natürlicher als „Samen“.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: der … vom Feld kommt
  rationale: Die Formulierung bleibt dem Bild des Hebräischen nahe, ohne im Deutschen unverständlich zu wirken. Die dynamischere Wiedergabe „den dein Feld hervorbringt“ ist ebenfalls möglich.
- source_word: שָׁנָה שָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wiederholung bezeichnet die regelmäßige jährliche Wiederkehr. „Jahr für Jahr“ bewahrt sowohl den Nachdruck als auch die distributive Bedeutung.
theological_decisions: []
