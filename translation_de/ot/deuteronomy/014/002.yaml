base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: de
  text: Denn du bist ein heiliges Volk, das Jahwe, deinem Gott, gehört. Jahwe hat dich aus allen Völkern, die auf der Erde leben, dazu erwählt, für ihn ein Volk zu sein, das sein kostbarer Besitz ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein besonderes Eigentumsvolk“. Das hebräische Wort סְגֻלָּה bezeichnet einen besonders geschätzten Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Verbot ein und bewahrt dessen erklärende Funktion.
- source_word: עַם קָדוֹשׁ
  choice: ein heiliges Volk
  rationale: Gibt die Bundesgemeinschaft als ein für Gott ausgesondertes Volk in natürlichem, theologisch offenem Deutsch wieder.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: für Jahwe, deinen Gott
  rationale: Das ל bezeichnet hier die Beziehung beziehungsweise Zugehörigkeit zu Gott; „für“ ist im Deutschen natürlicher als ein wörtliches „zu“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als solchen wieder und bewahrt seinen bundesbezogenen Gebrauch.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: Und dich hat Jahwe … erwählt
  rationale: ב mit בחר bezeichnet idiomatisch die Person, auf die Gottes Wahl fällt; die Voranstellung von „dich“ bewahrt die hebräische Hervorhebung.
- source_word: לִהְיוֹת לוֹ
  choice: damit du ihm … bist
  rationale: Drückt Zweck beziehungsweise Ergebnis der Erwählung aus und bewahrt die auf Gott bezogene Zugehörigkeit.
- source_word: לְעַם סְגֻלָּה
  choice: als Volk ein kostbarer Besitz
  rationale: Bewahrt sowohl עַם („Volk“) als auch סְגֻלָּה, das einen besonders geschätzten persönlichen Besitz bezeichnet, ohne den Ausdruck auf bloße Besonderheit abzuschwächen.
- source_word: מִכֹּל הָעַמִּים
  choice: aus allen Völkern
  rationale: מן bezeichnet die Auswahl aus einer Gesamtheit; die Formulierung vermeidet die zusätzliche Aussage eines höheren Ranges.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: auf der Erde
  rationale: Gibt die hebräische Wendung idiomatisch und mit ihrem weltweiten Bezug wieder.
theological_decisions:
- issue: Aussage über Israels Erwählung
  choice: Erwählung aus allen Völkern zu heiliger Zugehörigkeit und kostbarem Besitz Gottes
  alternative: „über allen Völkern“ als Aussage eines überlegenen Ranges oder eine Ausdeutung durch spätere Erwählungslehren
  rationale: Der hebräische Text betont Gottes Wahl, die Zugehörigkeit zu ihm und den besonderen Wert des Volkes. Er verlangt weder eine Aussage ethnischer Überlegenheit noch eine Einordnung in ein späteres theologisches System.
- issue: Bedeutung von Heiligkeit
  choice: „heilig“ ohne erklärenden Zusatz
  alternative: Paraphrasen wie „moralisch vollkommen“ oder ausschließlich „abgesondert“
  rationale: קָדוֹשׁ umfasst die besondere Zugehörigkeit und Aussonderung für Gott, besitzt aber eine theologische Bedeutungsbreite, die nicht auf nur einen Aspekt verengt werden soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den begründenden Zusammenhang zu lösen. Die Voranstellung „dich“ spiegelt die Hervorhebung des hebräischen וּבְךָ. Der Fußnotenmarker steht unmittelbar bei der Wiedergabe von סְגֻלָּה.
