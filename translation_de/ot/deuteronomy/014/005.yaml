  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: de
  text: den Hirsch[a], die Gazelle, den Damhirsch, die Wildziege, den Steinbock, die Antilope und das Wildschaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Tiernamen in diesem Vers lassen sich nicht sicher bestimmen. Der „Damhirsch“ kann auch als Reh oder Rothirsch bestimmt werden; die „Wildziege“ möglicherweise als Steinbock; der „Steinbock“ möglicherweise als Addaxantilope; die „Antilope“ möglicherweise als Wildrind oder Auerochse; das „Wildschaf“ möglicherweise als Gämse oder Bergziege.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: Hirsch
  rationale: Bezeichnet einen Hirsch beziehungsweise ein Tier der Hirschfamilie; „Hirsch“ ist im Deutschen klar und sachlich, ohne Geschlecht oder Art unnötig eng festzulegen.
- source_word: צְבִי
  choice: Gazelle
  rationale: Die in der heutigen Forschung übliche und im Kontext gut verständliche Bestimmung; „Antilope“ wäre weniger spezifisch.
- source_word: יַחְמוּר
  choice: Damhirsch
  rationale: Die genaue Hirschart ist unsicher; „Damhirsch“ ist eine verbreitete lexikalische Bestimmung und im Deutschen natürlicher als eine traditionsbedingte Wiedergabe mit „Rehbock“.
- source_word: אַקּוֹ
  choice: Wildziege
  rationale: Wahrscheinlich ist ein wild lebender Ziegenartiger gemeint; „Wildziege“ bleibt verständlich und lässt die mögliche genauere Bestimmung als Steinbock offen.
- source_word: דִישֹׁן
  choice: Steinbock
  rationale: Die zoologische Zuordnung ist umstritten. „Steinbock“ gibt eine plausible traditionelle Bestimmung wieder; als Alternative kommt besonders die Addaxantilope infrage.
- source_word: תְאוֹ
  choice: Antilope
  rationale: Die Tierart ist nicht sicher bestimmbar. „Antilope“ passt zur Liste essbarer Wildtiere; die mögliche Deutung als Wildrind oder Auerochse wird in der Fußnote bewahrt.
- source_word: זָמֶר
  choice: Bergschaf
  rationale: Die genaue Art ist unbekannt. „Bergschaf“ ist eine verständliche Wiedergabe für ein gebirgsbewohnendes Schaf- oder Ziegentier; Gämsen oder Bergziegen werden ebenfalls erwogen.
