translation:
  language: de
  text: Dann sollst du es gegen Silber eintauschen[a], das Silber zusammenbinden und mitnehmen[b] und zu dem Ort gehen, den Jahwe, dein Gott, erwählen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es in Geld umtauschen“. Wörtlich ist von „Silber“ die Rede, das hier als Zahlungsmittel dient.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Silber in deiner Hand zusammenbinden“. Gemeint ist, es für die Reise gebündelt und sicher bei sich zu führen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: sollst du es gegen Silber eintauschen
  rationale: Die Wendung bezeichnet hier den Tausch des Zehnten beziehungsweise der Erzeugnisse gegen Silber. „Gegen Silber eintauschen“ gibt den Vorgang natürlich wieder und bewahrt zugleich das konkrete כֶּסֶף („Silber“), das hier als Zahlungsmittel dient.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: das Silber in deiner Hand fest verschnüren
  rationale: צָרַר bedeutet binden, bündeln oder verschnüren. Die Formulierung bewahrt das konkrete Bild, dass das Silber für die Reise sicher zusammengebunden wird.
- source_word: בְּיָדְךָ
  choice: in deiner Hand
  rationale: Die wörtliche Wendung wird beibehalten; sie kann zugleich Besitz beziehungsweise sichere Verfügung ausdrücken.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: und zu dem Ort gehen
  rationale: הלך ist das gewöhnliche Verb für „gehen“. Die deutsche Formulierung ist direkt, verständlich und dem Rechtstext angemessen.
- source_word: אֲשֶׁר יִבְחַר
  choice: den ... erwählen wird
  rationale: Der Imperfekt bezeichnet in dieser Anweisung natürlich eine zukünftige Wahl. „Erwählen“ entspricht dem wiederkehrenden Sprachgebrauch des Deuteronomiums und ist in modernem gehobenem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Dies ist die natürliche Wiedergabe der singularischen Bundesbezeichnung mit dem Suffix der zweiten Person.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die konkrete Bildsprache des Hebräischen bleibt erhalten; Fußnoten erläutern die idiomatische Geldbedeutung von „Silber“ und die mögliche Nuance des sicheren Verwahrens.
