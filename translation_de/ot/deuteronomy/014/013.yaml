translation_notes:
  register: Natürliche, würdige Listensprache in modernem Standarddeutsch. Der wiederholte Artikel bildet die hebräische Aufzählung ab; die zoologische Unsicherheit wird nicht im Haupttext überladen, sondern in einer Fußnote kenntlich gemacht.
