  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: de
  text: den Milan[a], den Falken und den Habicht nach seiner Art,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung dieser Greifvögel ist unsicher. Überlieferte und moderne Übersetzungen schwanken unter anderem zwischen Rotmilan, Milan, Falke und Habicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: Milan
  rationale: Die genaue Vogelart ist unsicher. „Milan“ gibt die verbreitete Zuordnung zu einem Greifvogel der Milan-Gruppe wieder, ohne die im Hebräischen nicht eindeutige Bestimmung unnötig auf den Rotmilan zu verengen.
- source_word: הָאַיָּה
  choice: Falke
  rationale: Der Name bezeichnet wahrscheinlich einen Greifvogel und wird häufig als „Falke“ verstanden. Die Wiedergabe hält ihn von den benachbarten Bezeichnungen unterscheidbar.
- source_word: הַדַּיָּה
  choice: Habicht
  rationale: Auch dieser Vogelname ist zoologisch nicht sicher bestimmbar. „Habicht“ wahrt im Deutschen die Dreierfolge verschiedener Greifvogelbezeichnungen; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: לְמִינָהּ
  choice: nach seinen Arten
  rationale: Die formelhafte Wendung bezeichnet die zugehörigen Unterarten beziehungsweise Arten einer Tiergruppe. Der Singular des hebräischen Suffixes wird mit dem kollektiven Bezug „seinen“ wiedergegeben.
- source_word: וְאֶת
  choice: und den
  rationale: Die Konjunktion verbindet die Listenelemente; der Akkusativmarker wird im Deutschen durch den Kasus des Artikels ausgedrückt.
