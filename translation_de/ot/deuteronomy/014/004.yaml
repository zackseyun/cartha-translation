base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: de
  text: 'Dies sind die Tiere, die ihr essen dürft: Rind, Schaf und Ziege.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dies ist das Tier, das ihr essen dürft: ein Rind, ein Stück Kleinvieh von den Schafen und ein Stück Kleinvieh von den Ziegen.“ Der Singular führt hier eine Gruppe ein, deren einzelne Tierarten anschließend genannt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Dies sind die Tiere
  rationale: Die formal singularische Wendung („Dies ist das Tier“) führt kollektiv die anschließend aufgezählten erlaubten Tierarten ein. Der deutsche Plural gibt diese Funktion natürlich und klar wieder.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: die ihr essen dürft
  rationale: Die Wendung bezeichnet hier erlaubte Speisetiere. „Dürft“ drückt die Erlaubnis aus, ohne daraus ein Gebot zum Essen zu machen.
- source_word: שׁוֹר
  choice: Rind
  rationale: Das hebräische Wort bezeichnet ein Tier der Rindergattung und ist hier als Artbezeichnung gebraucht. „Rind“ ist im Deutschen geschlechtsneutraler und als Kategorie natürlicher als „Ochse“.
- source_word: שֵׂה כְשָׂבִים
  choice: Schaf
  rationale: שֵׂה bezeichnet ein einzelnes Kleinvieh, das durch כְשָׂבִים der Schafgattung zugeordnet wird. „Schaf“ bewahrt die Artbezeichnung, ohne ein bestimmtes Alter vorauszusetzen.
- source_word: וְשֵׂה עִזִּים
  choice: und Ziege
  rationale: Parallel zur vorigen Wendung wird ein Stück Kleinvieh aus der Ziegengattung bezeichnet. „Ziege“ ist die natürliche deutsche Artbezeichnung und legt kein Alter fest.
theological_decisions: []
