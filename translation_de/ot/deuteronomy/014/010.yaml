  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: de
  text: Alles jedoch, was keine Flossen und Schuppen hat, dürft ihr nicht essen; es ist für euch unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Alles aber
  rationale: כֹל bezeichnet umfassend „alles“. Das nachgestellte „aber“ gibt den durch ו markierten Gegensatz zur vorherigen Erlaubnis natürlich und würdig wieder.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: was keine … hat
  rationale: Die Verbindung aus Relativpartikel und אֵין mit pronominalem Suffix drückt fehlenden Besitz aus; „was keine … hat“ ist idiomatisches modernes Deutsch.
- source_word: סְנַפִּיר וְ/קַשְׂקֶשֶׂת
  choice: Flossen und Schuppen
  rationale: Die hebräischen Kollektiv- beziehungsweise Klassenbezeichnungen werden im Deutschen bei dieser allgemeinen Speisevorschrift natürlich im Plural wiedergegeben.
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nicht essen
  rationale: Der negierte Imperfekt der 2. Person Plural hat im Gesetzeskontext prohibitive Kraft. „Dürft ihr nicht“ formuliert ein verbindliches Verbot in natürlichem modernem Deutsch.
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ ist die etablierte deutsche Bezeichnung für die kultisch-rechtliche Kategorie טָמֵא und vermeidet eine bloß hygienische Deutung.
- source_word: הוּא לָכֶם
  choice: es ist für euch unrein
  rationale: „Für euch“ bewahrt die relationale Kraft von לָכֶם und bezeichnet den Status des betreffenden Tieres gegenüber Israel.
