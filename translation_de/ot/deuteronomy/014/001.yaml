  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: de
  text: Ihr seid Söhne[a] Jahwes, eures Gottes. Ihr sollt euch keine Einschnitte machen und euch für einen Toten keine kahle Stelle zwischen euren Augen[b] scheren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kinder«. Das hebräische Wort steht im maskulinen Plural und bedeutet wörtlich »Söhne«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: auf eurer Stirn.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בָּנִים
  choice: Söhne
  rationale: Das hebräische Substantiv steht im maskulinen Plural und bedeutet wörtlich »Söhne«. Die Form wird in der Aussage über die Bundeszugehörigkeit bewahrt; die mögliche umfassende Wiedergabe »Kinder« wird in einer Fußnote genannt.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: 'Das ל bezeichnet hier die Zugehörigkeit beziehungsweise Beziehung: Sie sind Söhne Jahwes. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.'
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Die Konstruktion mit Suffix bedeutet »euer Gott«. Der Genitiv fügt sich im Deutschen natürlich als Apposition an »Jahwes« an.
- source_word: תִתְגֹּדְדוּ
  choice: euch keine Einschnitte machen
  rationale: Die reflexive Form bezeichnet das Einschneiden des eigenen Körpers, besonders als Trauerbrauch. Die gewählte Formulierung ist klar und vermeidet die mögliche Abschwächung von »sich ritzen«.
- source_word: תָשִׂימוּ קָרְחָה
  choice: eine kahle Stelle scheren
  rationale: Die Wortverbindung bezeichnet das absichtliche Herstellen einer kahlen Stelle, offenbar durch Scheren oder Rasieren. Die deutsche Formulierung gibt den konkreten Trauerbrauch natürlich wieder.
- source_word: בֵּין עֵינֵיכֶם
  choice: zwischen euren Augen
  rationale: Die hebräische Wendung wird im Haupttext formal bewahrt; gemeint ist der Bereich der Stirn, was eine Fußnote erläutert.
- source_word: לָמֵת
  choice: für einen Toten
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Bezug des Trauerbrauchs. Der Singular »einen Toten« entspricht dem hebräischen Singular und ist im Deutschen eindeutig.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Bundesgemeinschaft
  choice: Söhne
  alternative: Kinder
  rationale: Der Ausgangstext verwendet ausdrücklich den maskulinen Plural »Söhne«. Diese Form wird nicht stillschweigend neutralisiert; eine mögliche inklusive Deutung der angesprochenen Gemeinschaft bleibt durch die Fußnote sichtbar.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bleibt knapp und nah am Hebräischen; zugleich werden die beiden verbotenen Trauerpraktiken in natürlichem Deutsch benannt. Die wörtliche Körperangabe »zwischen euren Augen« bleibt im Haupttext erhalten und wird erläutert.
