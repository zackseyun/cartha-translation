source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: de
  text: 'Gib das Geld[a] für alles aus, wonach du verlangst[b]: für Rinder, Kleinvieh, Wein, berauschendes Getränk[c] und für alles, was du dir wünschst. Iss dort vor Jahwe, deinem Gott, und freue dich, du und dein Haushalt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Silber“; gemeint ist das Geld.'
    reason: lexical_alternative
  - marker: b
    text: In beiden Wunschformulierungen steht wörtlich „deine Seele“. „Seele“ bezeichnet hier die Person mit ihrem Verlangen oder Appetit.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein berauschendes alkoholisches Getränk, das von Wein unterschieden wird; die genaue Getränkesorte bleibt offen.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: Gib das Geld aus
  rationale: Das Verb bedeutet wörtlich „geben“, bezeichnet hier im Zusammenhang mit dem Erwerb von Festgaben aber idiomatisch das Ausgeben des zuvor in Geld umgewandelten Zehnten. כֶּסֶף heißt wörtlich „Silber“ und dient zugleich als Bezeichnung für Geld.
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: wonach es dich verlangt
  rationale: נֶפֶשׁ bezeichnet hier die begehrende Person beziehungsweise ihr Verlangen. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne eine vom Zusammenhang nicht geforderte Trennung von Leib und Seele einzutragen.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: für Rinder, Schafe
  rationale: בָּקָר bezeichnet kollektiv Rindvieh. צֹאן kann Kleinvieh, insbesondere Schafe und Ziegen, bezeichnen; „Schafe“ ist hier eine knappe konventionelle Wiedergabe, während die mögliche weitere Bedeutung nicht entscheidend ist.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: Wein, berauschendes Getränk
  rationale: יַיִן ist Wein. שֵׁכָר bezeichnet ein alkoholisches beziehungsweise berauschendes Getränk, das vom Wein unterschieden wird. „Berauschendes Getränk“ vermeidet die anachronistische Vorstellung moderner Spirituosen, die „starkes Getränk“ nahelegen könnte.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: und alles, was du dir wünschst
  rationale: Die zweite, umfassende Formulierung verstärkt die erste. Das wörtliche Bild „was deine Seele von dir fordert“ wäre im Deutschen schwerfällig; „was du dir wünschst“ bewahrt den Sinn und die personale Reichweite.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. Der Gottesname יהוה wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: und freue dich, du und alle, die zu deinem Haus gehören
  rationale: שׂמח bezeichnet festliche Freude. בֵּיתֶךָ meint hier nicht nur das Gebäude, sondern den Haushalt beziehungsweise die Hausgemeinschaft; die ausgeführte Form ist für heutige Leser unmittelbar verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname; die deutsche Schreibweise entspricht modernem Standarddeutsch.
- issue: Ausdrückliche Nennung alkoholischer Getränke
  choice: Wein, berauschendes Getränk
  alternative: Wein, Bier / Wein, starkes Getränk
  rationale: Der Text nennt sowohl Wein als auch שֵׁכָר und darf nicht aus theologischer Rücksicht abgeschwächt werden. Zugleich legt der hebräische Ausdruck keine einzelne Getränkesorte sicher fest.
- issue: Bedeutung von נֶפֶשׁ in den beiden Wunschformulierungen
  choice: Verlangen der ganzen Person
  alternative: Seele
  rationale: Hier bezeichnet נֶפֶשׁ die Person als Trägerin von Wunsch und Appetit. Eine wörtliche Wiedergabe mit „Seele“ könnte im heutigen Deutschen eine dualistische oder rein geistige Bedeutung nahelegen, die der Ess- und Trinksituation nicht entspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Handelsidiom und Festcharakter werden natürlich wiedergegeben. „Jahwe“ steht als deutscher Eigenname; „alle, die zu deinem Haus gehören“ erläutert das im Hebräischen kollektiv verstandene „Haus“, ohne es auf die Kernfamilie zu verengen.
