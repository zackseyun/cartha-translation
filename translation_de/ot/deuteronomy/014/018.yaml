  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: de
  text: den Storch[a], den Reiher nach seiner Art[b], den Wiedehopf[c] und die Fledermaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reiher“. Die genaue Bestimmung mehrerer in diesem Vers genannter Tiere ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Für das hier mit „Reiher“ wiedergegebene Wort werden auch „Ibis“ oder „Regenpfeifer“ vorgeschlagen.
    reason: lexical_alternative
  - marker: c
    text: Ältere Übersetzungen geben das hebräische Wort teils anders wieder; wahrscheinlich ist der Wiedehopf gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: den Storch
  rationale: „Storch“ ist die traditionelle und weiterhin wahrscheinlichste Bestimmung; da die genaue zoologische Zuordnung nicht völlig sicher ist, wird eine Fußnote gesetzt.
- source_word: הָאֲנָפָה
  choice: den Reiher
  rationale: Die genaue Vogelart ist unsicher. „Reiher“ ist eine verbreitete und sachlich passende Wiedergabe für einen Watvogel beziehungsweise eine entsprechende Vogelgruppe.
- source_word: לְמִינָהּ
  choice: nach seinen Arten
  rationale: Die formelhafte Wendung bezeichnet hier nicht nur eine einzelne Art, sondern die zugehörigen Gruppen; der Plural „Arten“ ist im Deutschen idiomatisch und bewahrt diese Weite.
- source_word: הַדּוּכִיפַת
  choice: den Wiedehopf
  rationale: Die moderne lexikalische Forschung bevorzugt für das seltene hebräische Vogelwort die Bestimmung „Wiedehopf“.
- source_word: הָעֲטַלֵּף
  choice: die Fledermaus
  rationale: Das hebräische Wort bezeichnet eindeutig die Fledermaus. Ihre Einordnung unter die fliegenden Tiere der Liste wird ohne Anpassung an moderne Taxonomie beibehalten.
