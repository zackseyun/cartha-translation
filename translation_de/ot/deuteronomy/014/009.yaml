lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: dürft ihr Folgendes essen
  rationale: Gibt die einleitende Demonstrativformel natürlich wieder und bewahrt zugleich den Charakter einer Erlaubnis innerhalb der Speisegebote.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: Von allem, was im Wasser lebt
  rationale: Im Kontext bezeichnet die substantivierte Wendung die im Wasser vorkommenden Lebewesen; „lebt“ macht diesen Bezug im Deutschen idiomatisch deutlich, ohne die zulässige Gruppe zu erweitern.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: Flossen und Schuppen
  rationale: Die üblichen und sachlich passenden deutschen Bezeichnungen für die beiden geforderten Merkmale.
- source_word: תֹּאכֵלוּ
  choice: dürft ihr essen
  rationale: Der unmittelbare Kontext der Reinheitsvorschriften verlangt eine Erlaubnisformulierung; das deutsche Modalverb drückt diese Funktion klar aus.
