  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die hebräische Begründung und die beiden Kriterien zutreffend wieder: Das Schwein hat gespaltene Hufe, käut jedoch nicht wieder und ist daher für die angesprochene Gemeinschaft unrein. Die Verbote, von seinem/ihrem Fleisch zu essen und seine/ihre Kadaver zu berühren, bleiben direkt und ohne interpretierende Erweiterung erhalten. Die pluralischen Suffixe in מִבְּשָׂרָם und נִבְלָתָם werden angemessen durch „ihrem“ und „ihre“ abgebildet.'
  naturalness: '„Auch das Schwein: Weil es zwar gespaltene Hufe hat, aber nicht wiederkäut, ist es für euch unrein“ ist modernes, verständliches Standarddeutsch und bildet den kontrastiven Aufbau des Hebräischen natürlich nach. „Kadaver“ ist für tierische tote Körper sachlich und im rechtlich-kultischen Kontext angemessen.'
  terminology: „Schwein“, „wiederkäut“, „unrein“ und „berühren“ sind fachlich und idiomatisch passende Entscheidungen. Besonders „unrein“ bewahrt die kultisch-rechtliche Kategorie, ohne eine moralische Bewertung einzutragen. Die Fußnote erklärt den im Deutschen auffälligen Wechsel vom singularischen „das Schwein/es“ zu pluralischen Besitzanzeigern transparent.
