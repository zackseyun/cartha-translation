source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: de
  text: 'Auch das Schwein: Weil es zwar gespaltene Hufe hat, aber nicht wiederkäut, ist es für euch unrein. Ihr sollt nichts von ihrem Fleisch[a] essen und ihre Kadaver nicht berühren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich stehen im Hebräischen hier und bei „ihre Kadaver“ Pluralformen. Sie beziehen sich wohl zusammenfassend auf die betreffenden Tiere.
    reason: textual_grammar
lexical_decisions:
- source_word: הַחֲזִיר
  choice: das Schwein
  rationale: „Schwein“ ist die klare, natürliche und sachlich genaue moderne Bezeichnung des Tieres.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier die Begründung für die Einstufung als unrein ein.
- source_word: מַפְרִיס פַּרְסָה
  choice: gespaltene Hufe hat
  rationale: Die Wendung bezeichnet einen geteilten beziehungsweise gespaltenen Huf. Diese Formulierung ist im Deutschen unmittelbar verständlich.
- source_word: וְלֹא גֵרָה
  choice: aber nicht wiederkäut
  rationale: Das knappe Hebräisch nennt den fehlenden zweiten Reinheitsmaßstab. „Wiederkäuen“ ist dafür der geläufige deutsche Ausdruck.
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ bewahrt die kultisch-rechtliche Kategorie des Speisegesetzes, ohne sie als moralische Verwerflichkeit auszulegen.
- source_word: לָכֶם
  choice: für euch
  rationale: Die Formulierung gibt die auf die angesprochene Gemeinschaft bezogene Geltung wörtlich und natürlich wieder.
- source_word: מִבְּשָׂרָם
  choice: nichts von ihrem Fleisch
  rationale: „Nichts von“ gibt den partitiven Sinn von מִן wieder; „ihrem“ bewahrt den Pluralsuffix des hebräischen Textes.
- source_word: נִבְלָתָם
  choice: ihre Kadaver
  rationale: „Kadaver“ bezeichnet eindeutig die toten Körper der Tiere; das Possessivpronomen bewahrt den hebräischen Plural.
- source_word: תִגָּעוּ
  choice: berühren
  rationale: „Berühren“ entspricht dem direkten Sinn des Verbs und erweitert das Verbot nicht zu bloßer Nähe oder allgemeinem Umgang.
theological_decisions:
- issue: Art der Unreinheit im Speisegesetz
  choice: „unrein“ ohne weitere theologische Deutung
  alternative: „unrein“ als moralisch böse oder sündhaft auszudeuten
  rationale: Der Vers bezeichnet den rechtlich-kultischen Status des Tieres für Israel; eine moralische Wertung des Tieres selbst steht nicht im Text.
- issue: Reichweite des Berührungsverbots
  choice: direktes Verbot des Berührens
  alternative: „nicht anfassen“, „nicht damit umgehen“ oder „sich nicht nähern“
  rationale: Das hebräische נגע bedeutet hier schlicht „berühren“. Die Übersetzung wahrt die Stärke und zugleich die Grenzen des Verbots.
- issue: Numerus der Possessivsuffixe
  choice: den hebräischen Plural in „ihrem Fleisch“ und „ihre Kadaver“ bewahren
  alternative: 'auf das unmittelbar zuvor genannte einzelne Schwein bezogen: „von seinem Fleisch“ und „seinen Kadaver“'
  rationale: Der masoretische Text hat an beiden Stellen Pluralsuffixe. Sie können sich zusammenfassend auf die betreffende Tierklasse beziehungsweise die zuvor behandelten Tiere beziehen; eine stillschweigende Singularisierung würde diese Form des Ausgangstextes verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Auch das Schwein“ bindet den Vers an die vorausgehende Aufzählung an. Die Konstruktion „zwar … aber“ bildet den Kontrast der beiden Reinheitsmerkmale natürlich ab. Der hebräische Numeruswechsel wird im Haupttext erhalten und in der Fußnote knapp erläutert.
