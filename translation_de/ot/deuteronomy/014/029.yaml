  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: de
  text: Dann soll der Levit kommen, denn er hat bei dir weder Anteil noch Erbbesitz. Auch der ansässige Fremde[a], die Waise und die Witwe, die in deinen Ortschaften wohnen[b], sollen kommen. Sie sollen essen und satt werden, damit Yahweh, dein Gott, dich bei allem segnet, was du mit deinen Händen tust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist ein Nichtisraelit, der unter den Israeliten ansässig ist; auch möglich: „der Fremde mit Wohnrecht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die in deinen Toren sind“. Die Stadttore stehen hier für die Ortschaften oder örtlichen Gemeinschaften.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא הַלֵּוִי
  choice: Dann soll der Levit kommen
  rationale: Das Qal-Perfekt mit vorangestelltem ו hat im gesetzlichen Zusammenhang erwartenden beziehungsweise anweisenden Sinn. „Soll … kommen“ bewahrt diesen Ton, ohne eine bereits vergangene Handlung auszudrücken.
- source_word: חֵלֶק וְנַחֲלָה
  choice: weder Anteil noch Erbbesitz
  rationale: Die beiden Begriffe bezeichnen einen zugewiesenen Anteil und erblichen Landbesitz. Die negative deutsche Paarform mit „weder … noch“ gibt אֵין … חֵלֶק וְנַחֲלָה natürlich und präzise wieder.
- source_word: הַגֵּר
  choice: der ansässige Fremde
  rationale: גֵּר bezeichnet hier einen Nichtisraeliten, der dauerhaft innerhalb der israelitischen Gemeinschaft lebt. „Ansässiger Fremder“ bildet sowohl Fremdstatus als auch Ortsansässigkeit verständlich ab.
- source_word: הַיָּתוֹם
  choice: die Waise
  rationale: „Waise“ ist im heutigen Standarddeutsch die natürliche Bezeichnung für die im hebräischen Recht genannte sozial schutzbedürftige Person; das grammatische Geschlecht des deutschen Wortes schränkt das natürliche Geschlecht nicht ein.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: die in deinen Ortschaften wohnen
  rationale: Wörtlich steht „die in deinen Toren [sind]“. „Tore“ bezeichnet metonymisch die Städte beziehungsweise örtlichen Gemeinwesen. Die Übersetzung gibt den gemeinten Lebensbereich im modernen Deutsch wieder; eine Fußnote bewahrt das Bild.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: Sie sollen essen und satt werden
  rationale: Die Verben beschreiben die beabsichtigte Nutzung und ausreichende Versorgung. „Satt werden“ ist natürliches Deutsch und entspricht dem Bedeutungsgehalt von שׂבע.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: damit … dich … segnet
  rationale: לְמַעַן leitet Zweck beziehungsweise beabsichtigte Folge ein. Der deutsche Präsenskonjunktiv ist hier nicht nötig; „damit … segnet“ trägt diese offene Zielbeziehung idiomatisch.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: bei allem …, was deine Hände tun
  rationale: Die Formulierung bewahrt das hebräische Handlungsbild und klingt zugleich natürlich. „Bei allem segnen“ drückt den Bereich aus, in dem der Segen wirksam sein soll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Transliteration wahrt den persönlichen Namen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Verhältnis zwischen Versorgung der Schutzbedürftigen und göttlichem Segen
  choice: „damit … segnet“ als Zweck beziehungsweise beabsichtigte Folge
  alternative: „sodass … segnen wird“ als feste Zusage
  rationale: לְמַעַן mit Imperfekt lässt Zweck und erwartete Folge anklingen, ohne hier eine mechanische oder unbedingt eintretende Gegenleistung zu formulieren.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die gesetzliche Aussage wird mit „soll“ wiedergegeben. Das altertümliche Bild „in deinen Toren“ steht in der Fußnote, während der Haupttext den gemeinten sozialen und örtlichen Bezug unmittelbar verständlich ausdrückt.
