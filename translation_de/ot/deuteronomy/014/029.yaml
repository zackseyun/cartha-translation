revisions:
- from: Dann soll der Levit kommen, denn er hat weder Anteil noch Erbbesitz bei dir, ebenso der ansässige Fremde[a], die Waise und die Witwe, die in deinen Ortschaften wohnen[b]. Sie sollen essen und satt werden, damit Yahweh, dein Gott, dich bei allem segnet, was deine Hände tun.
  to: Dann soll der Levit kommen, denn er hat bei dir weder Anteil noch Erbbesitz. Auch der ansässige Fremde[a], die Waise und die Witwe, die in deinen Ortschaften wohnen[b], sollen kommen. Sie sollen essen und satt werden, damit Yahweh, dein Gott, dich bei allem segnet, was du mit deinen Händen tust.
  rationale: Die Revision glättet die deutsche Syntax, indem sie die Ankunft der weiteren Personengruppen ausdrücklich mit „sollen kommen“ aufnimmt. Sie vermeidet in der Fußnote eine nicht erforderliche Festlegung auf einen dauerhaften Aufenthalt und formuliert den Bereich des Segens idiomatischer, wobei das Bild der „Hände“ erhalten bleibt. Bedeutung, Register, Gottesname und Fußnotenanker bleiben gewahrt.
