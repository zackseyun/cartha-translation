  - severity: low
    issue: Fußnote zu גֵּר überbestimmt die Aufenthaltsdauer
    rationale: „Dauerhaft“ ist als Erklärung enger als das hebräische גֵּר, das einen ansässigen nichtisraelitischen Bewohner bezeichnet, ohne hier zwingend die Dauer seines Aufenthalts festzulegen.
  - severity: low
    issue: Formulierung zum Werk der Hände
    rationale: „dich bei allem segnet, was deine Hände tun“ ist verständlich, aber stilistisch weniger idiomatisch. „bei allem, was du mit deinen Händen tust“ bewahrt das hebräische Bild und liest sich flüssiger.
