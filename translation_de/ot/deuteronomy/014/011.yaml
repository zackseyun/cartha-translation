lexical_decisions:
- source_word: כָּל
  choice: alle
  rationale: Der Quantor bezeichnet die Gesamtheit der erlaubten Kategorie. Im Deutschen gibt „alle“ die umfassende Erlaubnis in Verbindung mit dem pluralisch wiedergegebenen Gattungsbegriff natürlich wieder.
- source_word: צִפּוֹר
  choice: Vögel
  rationale: Das Substantiv bezeichnet hier Vögel. Der deutsche Plural ergibt zusammen mit כָּל eine natürliche und klare Formulierung.
- source_word: טְהֹרָה
  choice: reinen
  rationale: Im Zusammenhang der Speisegebote bezeichnet das Wort die kultisch-rechtliche Kategorie „rein“, nicht allgemein sittliche oder stoffliche Reinheit.
- source_word: תֹּאכֵלוּ
  choice: dürft ihr essen
  rationale: Das Imperfekt der 2. Person Plural drückt hier im rechtlichen Zusammenhang Erlaubnis aus. „Dürft ihr essen“ ist modernes, eindeutiges Deutsch und bewahrt die Anrede im Plural.
theological_decisions: []
