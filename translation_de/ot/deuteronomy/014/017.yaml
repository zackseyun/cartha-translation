  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: de
  text: den Pelikan[a], den Aasgeier[b] und den Kormoran[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung der hebräischen Vogelnamen in diesem Vers ist unsicher. Statt »Pelikan« werden auch »Wüsteneule« oder einfach »Eule« vorgeschlagen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Geier«; ältere Übersetzungen haben »Gieradler«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch einen anderen Wasservogel bezeichnen, etwa einen Pelikan oder eine Fischeule.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: den Pelikan
  rationale: Die genaue Vogelart ist unsicher. »Pelikan« ist eine verbreitete, verständliche Wiedergabe und passt in den Zusammenhang der Vogelliste; abweichende Identifizierungen werden in der Fußnote genannt.
- source_word: הָרָחָמָה
  choice: den Aasgeier
  rationale: Das Wort bezeichnet wahrscheinlich einen Geier beziehungsweise aasfressenden Greifvogel. »Aasgeier« ist im heutigen Deutsch anschaulich und vermeidet die veraltete Bezeichnung »Gieradler«.
- source_word: הַשָּׁלָךְ
  choice: den Kormoran
  rationale: Die Artbestimmung ist umstritten; wahrscheinlich ist ein fischfressender Wasservogel gemeint. »Kormoran« ist eine geläufige moderne Wiedergabe, während Alternativen in der Fußnote erhalten bleiben.
- source_word: וְ / וְאֶת
  choice: und / Akkusativ ohne eigene Wiedergabe
  rationale: Die Konjunktion וְ wird mit »und« wiedergegeben. Der direkte Objektmarker אֵת hat keine eigene deutsche Entsprechung; seine syntaktische Funktion zeigt sich hier in der Akkusativform der Artikel.
