lexical_decisions:
- source_word: כָּל
  choice: alle
  rationale: Der Quantor umfasst uneingeschränkt die gesamte genannte Gruppe; im Deutschen gibt „alle“ die hebräische Form natürlich und präzise wieder.
- source_word: עוֹף
  choice: Vögel
  rationale: Das Wort kann allgemein fliegende Geschöpfe bezeichnen, doch im unmittelbaren Zusammenhang der Speisevorschriften sind konkret Vögel gemeint.
- source_word: טָהוֹר
  choice: rein
  rationale: „Rein“ bezeichnet hier die kultisch-rechtliche Kategorie der zum Verzehr zugelassenen Tiere, nicht allgemein körperliche oder moralische Reinheit.
- source_word: תֹּאכֵלוּ
  choice: dürft ihr essen
  rationale: Die Imperfektform der 2. Person Plural hat in diesem gesetzlichen Kontrast permissive Bedeutung. „Dürft ihr essen“ gibt die Erlaubnis im modernen Deutschen klar wieder.
