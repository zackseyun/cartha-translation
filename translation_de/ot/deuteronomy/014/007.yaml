source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: de
  text: 'Doch von den Tieren, die wiederkäuen, oder von denen, die gespaltene Hufe haben, dürft ihr folgende nicht essen: das Kamel, den Hasen[a] und den Klippschliefer[b]. Denn sie wiederkäuen, haben aber keine gespaltenen Hufe. Sie sind für euch unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kaninchen“. Das hebräische Tierwort bezeichnet wahrscheinlich einen Hasen; die genaue zoologische Bestimmung ist jedoch nicht völlig sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Klippdachs“. Das hebräische Tierwort wird gewöhnlich als „Klippschliefer“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die Einschränkung der in Vers 6 genannten Regel und gibt die adversativ-restriktive Kraft knapp und natürlich wieder.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: von den Tieren, die wiederkäuen
  rationale: Die geläufige deutsche Wendung gibt das hebräische Bild vom Heraufbringen des Wiedergekäuten verständlich wieder.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: oder von denen, die vollständig gespaltene Hufe haben
  rationale: Das waw verbindet hier die beiden in Vers 6 genannten Tiergruppen als Alternativen, aus denen Ausnahmen folgen. »Vollständig gespalten« bildet הַשְּׁסוּעָה ab; der Plural »Hufe« ist im Deutschen natürlich.
- source_word: הַגָּמָל
  choice: das Kamel
  rationale: Direkte und eindeutige deutsche Entsprechung.
- source_word: הָאַרְנֶבֶת
  choice: den Hasen
  rationale: Traditionelle und wahrscheinlichste zoologische Zuordnung; die verbleibende Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: הַשָּׁפָן
  choice: den Klippschliefer
  rationale: Die heute weithin angenommene zoologische Bestimmung; genauer und im Deutschen gebräuchlicher als ältere Bezeichnungen wie »Klippdachs«.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Denn sie käuen wieder
  rationale: Bewahrt die Begründung und die Begriffskonsistenz, ohne die antike zoologische Einordnung modernisierend umzudeuten.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: haben aber keine gespaltenen Hufe
  rationale: Natürliches modernes Deutsch für das fehlende zweite Kennzeichen; »aber« macht den im Zusammenhang liegenden Gegensatz deutlich.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Sie sind für euch unrein
  rationale: Bewahrt den umfassenden biblischen Reinheitsbegriff und die auf Israel bezogene rechtliche Formulierung, ohne interpretierend »rituell« oder »zeremoniell« hinzuzufügen.
theological_decisions:
- issue: Art der Unreinheit im Speisegesetz
  choice: unrein
  alternative: rituell unrein / kultisch unrein
  rationale: טָמֵא bezeichnet hier eine Reinheitskategorie des Bundesrechts. Die allgemeinere Wiedergabe »unrein« wahrt die lexikalische Offenheit und fügt keine engere theologische Deutung ein.
- issue: Antike Einordnung von Hase und Klippschliefer als Wiederkäuer
  choice: Denn sie käuen wieder
  alternative: erläuternde Anpassung an moderne zoologische Kategorien
  rationale: Die Übersetzung gibt die phänomenologische Aussage des hebräischen Textes wieder, statt sie nach moderner Taxonomie umzuschreiben oder apologetisch zu erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. »Dürft ihr nicht essen« vermittelt das Verbot natürlich, ohne seine Verbindlichkeit abzuschwächen. Die Fußnotenmarker stehen unmittelbar bei den jeweils unsicher bestimmten Tiernamen.
