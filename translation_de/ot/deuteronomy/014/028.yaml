  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: de
  text: Am Ende von jeweils drei Jahren[a] sollst du den gesamten Zehnten von deinem Ertrag in jenem Jahr herausbringen und ihn in deinen Ortschaften[b] niederlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Ende jedes dritten Jahres“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in deinen Toren“; gemeint sind die örtlichen Städte oder Siedlungen.'
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה
  choice: Am Ende von
  rationale: Die Verbindung bezeichnet den erreichten Endpunkt eines Zeitraums. „Am Ende von“ bewahrt den zeitlichen Ausdruck des Hebräischen.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: jeweils drei Jahren
  rationale: Im Zusammenhang ist eine wiederkehrende dreijährige Regelung gemeint. „Jeweils drei Jahren“ gibt diese Wiederholung natürlich wieder; „in jedem dritten Jahr“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: תּוֹצִיא
  choice: sollst du ... herausbringen
  rationale: Der Hifil von יצא bedeutet, etwas herausgehen zu lassen beziehungsweise herauszubringen. Die konkrete Bewegung aus dem bisherigen Aufbewahrungs- oder Verfügungsbereich bleibt erhalten.
- source_word: כָּל מַעְשַׂר
  choice: den gesamten Zehnten
  rationale: כָּל hebt die Vollständigkeit der geschuldeten Zehntabgabe hervor. „Den gesamten Zehnten“ ist im Deutschen klar und idiomatisch.
- source_word: תְּבוּאָתְךָ
  choice: von deinem Ertrag
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag oder die Hervorbringung des Landes. „Ertrag“ ist breit genug und beschränkt die Bedeutung nicht auf Getreide.
- source_word: בַּשָּׁנָה הַהִוא
  choice: in jenem Jahr
  rationale: Die Wendung bezieht den Zehnten auf das betreffende Jahr. „In jenem Jahr“ gibt die demonstrative Form הַהִוא genauer wieder als „in diesem Jahr“.
- source_word: וְהִנַּחְתָּ
  choice: und ihn ... niederlegen
  rationale: Der kausative Stamm von נוח bezeichnet hier das Absetzen oder Deponieren. „Niederlegen“ bewahrt das konkrete Bild, ohne eine bestimmte Lagerungsform vorauszusetzen.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Wörtlich steht „in deinen Toren“. Im biblischen Sprachgebrauch sind damit die örtlichen Siedlungen beziehungsweise Gemeinwesen unter der eigenen Zuständigkeit gemeint. Die verständliche Bedeutung steht im Haupttext, das hebräische Bild in der Fußnote.
