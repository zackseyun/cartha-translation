  source_fidelity: Der Entwurf gibt die zeitliche Angabe מִקְצֵה שָׁלֹשׁ שָׁנִים als wiederkehrenden Dreijahresrhythmus sachgerecht wieder. „Den gesamten Zehnten von deinem Ertrag in jenem Jahr“ entspricht כָּל מַעְשַׂר תְּבוּאָתְךָ בַּשָּׁנָה הַהִוא. „Herausbringen“ und „niederlegen“ bewahren die konkreten Verben, ohne über die genaue Art der Aufbewahrung hinauszugehen. Die Wiedergabe von בִּשְׁעָרֶיךָ durch „in deinen Ortschaften“ trifft die gemeindlich-örtliche Bedeutung; die Fußnote dokumentiert zutreffend das wörtliche Bild.
  naturalness: Modernes, gut verständliches und angemessen würdiges Standarddeutsch. Die Formulierung „Am Ende von jeweils drei Jahren“ ist verständlich und bewahrt die zeitliche Struktur des Hebräischen, auch wenn „am Ende jedes dritten Jahres“ eine gleich mögliche stilistische Variante wäre.
  terminology: „Zehnten“, „Ertrag“, „herausbringen“ und „niederlegen“ sind terminologisch passend. Die Anrede im Singular entspricht dem hebräischen Gesetzesstil. Es werden keine konfessionell festgelegten Deutungen eingeführt.
