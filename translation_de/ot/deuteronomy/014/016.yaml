  text: the little owl[a], the great owl, and the white owl;
translation:
  language: de
  text: das Käuzchen[a], die große Eule und die Schleiereule;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Vogelarten mit diesen drei hebräischen Namen genau gemeint sind, ist unsicher. Traditionelle und moderne Übersetzungen geben sie unterschiedlich wieder, häufig als verschiedene Eulenarten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: Käuzchen
  rationale: Das Wort bezeichnet in dieser Liste vermutlich eine Eulenart. »Käuzchen« gibt die herkömmliche Deutung als kleinere Eule wieder und unterscheidet den Namen von den beiden folgenden, ohne eine exakte Art sicher zu behaupten.
- source_word: יַנְשׁוּף
  choice: große Eule
  rationale: Der Ausdruck wird traditionell als Nachtvogel beziehungsweise Eulenart verstanden. »Große Eule« bewahrt die Unterscheidung innerhalb der Dreiergruppe; die genaue zoologische Bestimmung bleibt unsicher.
- source_word: תִּנְשָׁמֶת
  choice: Schleiereule
  rationale: Im Zusammenhang der Vogelliste bezeichnet das Wort wahrscheinlich einen eulenartigen Vogel. »Schleiereule« ist eine geläufige deutsche Wiedergabe, darf jedoch nicht als sichere Artbestimmung verstanden werden.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: Hebräischer Akkusativmarker ohne eigenständige deutsche Entsprechung.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die einzelnen Einträge der Aufzählung.
- source_word: הַ
  choice: bestimmter Artikel
  rationale: Der hebräische Artikel kennzeichnet die genannten Vogelklassen; im Deutschen wird er entsprechend mit »das/die« wiedergegeben.
