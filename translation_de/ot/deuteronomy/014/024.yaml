source:
  edition: WLC
  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: de
  text: Wenn dir der Weg zu weit ist, sodass du es nicht tragen kannst, weil der Ort, den Jahwe, dein Gott, erwählen wird, um seinen Namen dort zu setzen, zu weit von dir entfernt ist, wenn[a] Jahwe, dein Gott, dich segnet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil Jahwe, dein Gott, dich segnet“. Das hebräische Bindewort kann hier sowohl zeitlich als auch begründend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn dir aber
  rationale: Leitet als Fortsetzung der vorherigen Anweisung einen Bedingungsfall ein; „aber“ gibt den weiterführenden und zugleich kontrastierenden Wert des Waw natürlich wieder.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: der Weg zu weit ist
  rationale: Die hebräische Wendung bezeichnet eine Entfernung, die für den Angesprochenen zu groß ist. „Der Weg ist zu weit“ ist im Deutschen idiomatisch und bleibt dem Bild des Weges nahe.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: du es nicht tragen kannst
  rationale: Das Pronomen bezieht sich im Kontext auf den Zehnten beziehungsweise die Erzeugnisse; נשׂא bezeichnet hier konkret das Tragen.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: der Ort ... zu weit von dir entfernt ist
  rationale: Bewahrt den räumlichen Sinn von רחק und die in Deuteronomium wichtige Bezeichnung „der Ort“.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: den Jahwe, dein Gott, erwählen wird
  rationale: Das Yiqtol wird in dieser gesetzlichen Anweisung zukunftsbezogen verstanden; „erwählen“ wahrt den feierlichen, theologischen Charakter des Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der üblichen deutschen Form wieder.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: um seinen Namen dort zu setzen
  rationale: Bleibt der deuteronomischen Bundesformel eng verbunden, ohne durch „wohnen lassen“ oder „Heiligtum errichten“ eine Deutung in den Text einzutragen.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: wenn Jahwe, dein Gott, dich segnet
  rationale: Das abschließende כִּי kann die zeitliche beziehungsweise sachliche Voraussetzung der durch Gottes Segen entstehenden Fülle ausdrücken. Die kausale Lesart bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des abschließenden כִּי
  choice: 'zeitlich-konditional: „wenn“'
  alternative: 'kausal: „weil“'
  rationale: „Wenn“ fügt die Segenszusage als Umstand des beschriebenen Falls in den langen Bedingungssatz ein. Da כִּי hier auch kausal verstanden werden kann, wird diese echte Mehrdeutigkeit ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange, noch nicht abgeschlossene Bedingungssatz und das Schlusskomma werden beibehalten, weil der Gedanke in Vers 25 fortgesetzt wird. Die Wiederholung von „zu weit“ spiegelt die parallele Begründungsstruktur des Hebräischen.
