  text: רְאֵ֨ה נָתַ֤תִּי לְ/פָנֶ֨י/ךָ֙ הַ/יּ֔וֹם אֶת הַֽ/חַיִּ֖ים וְ/אֶת הַ/טּ֑וֹב וְ/אֶת הַ/מָּ֖וֶת וְ/אֶת הָ/רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: de
  text: Sieh, ich lege dir heute das Leben und das Gute vor, den Tod und das Böse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „das Böse“ wiedergegebene hebräische Wort kann je nach Zusammenhang auch „das Übel“ oder „das Unheil“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als eindringlicher Aufmerksamkeitsruf. „Sieh“ wahrt die direkte Anrede und ist gegenüber „Siehe“ moderner.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: ich lege dir … vor
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“; mit לְפָנֶיךָ bezeichnet die Wendung das Vorlegen von Möglichkeiten zur Entscheidung. Das deutsche Präsens gibt das resultative hebräische Perfekt idiomatisch als gegenwärtige Setzung wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: הַחַיִּים
  choice: das Leben
  rationale: Die formal plurale Form חַיִּים bezeichnet hier den abstrakten Begriff „Leben“.
- source_word: הַטּוֹב
  choice: das Gute
  rationale: Die substantivierte Wiedergabe bewahrt die breite Bedeutung und den Parallelismus, ohne auf Wohlergehen oder Segen einzuengen.
- source_word: הַמָּוֶת
  choice: den Tod
  rationale: Direkte Wiedergabe in der Gegenüberstellung zum Leben.
- source_word: הָרָע
  choice: das Böse
  rationale: רַע kann moralisch Böses wie auch Übel oder Unheil bezeichnen. „Das Böse“ bewahrt hier den umfassenden Gegensatz zu „dem Guten“, während eine Fußnote die Bedeutungsbreite offenhält.
theological_decisions:
- issue: Bedeutungsumfang von הָרָע im Bundesgegensatz
  choice: das Böse
  alternative: das Übel / das Unheil
  rationale: Der Vers stellt Leben und Gutes Tod und רַע gegenüber. „Das Böse“ erhält die moralisch-theologische Spannung, ohne die im Kontext möglichen schädlichen Folgen auszuschließen; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe paarweise Gegenüberstellung des Hebräischen bleibt erhalten. „Sieh“ vermeidet das altertümlichere „Siehe“; „ich lege dir … vor“ ist eine natürliche deutsche Wiedergabe der hebräischen Entscheidungsformel.
