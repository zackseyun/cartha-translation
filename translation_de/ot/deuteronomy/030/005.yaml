  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: de
  text: Und Yahweh, dein Gott, wird dich in das Land bringen, das deine Väter in Besitz genommen haben[a], und du wirst es in Besitz nehmen. Er wird dir Gutes tun[b] und dich zahlreicher machen als deine Väter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das deine Väter geerbt hatten“ beziehungsweise „das deine Väter besaßen“. Das hebräische Verb kann sowohl Erben als auch Besitzergreifen oder Besitzen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er wird dich gedeihen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: wird dich … bringen
  rationale: Der Hifil von בוא mit Suffix der 2. Person Singular bedeutet „hineinbringen“. Ein zusätzliches „zurück“ ist im Zusammenhang mitgedacht, steht aber nicht ausdrücklich im Verb.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Suffix der 2. Person Singular bezeichnet unmittelbar „dein Gott“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Kontext des Deuteronomiums ist das verheißene Land gemeint; „Land“ bewahrt den geografischen und bundesbezogenen Sinn.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: das deine Väter in Besitz genommen haben
  rationale: ירשׁ kann erben, besitzen oder in Besitz nehmen bedeuten. Die aktive Formulierung passt dazu, dass die Väter das Land zuvor erlangten, ohne die Bedeutungsbreite ganz auf „erben“ festzulegen.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Die ausdrücklich maskuline Verwandtschaftsbezeichnung wird gewahrt; gemeint sind Israels Vorväter.
- source_word: וִירִשְׁתָּהּ
  choice: du wirst es in Besitz nehmen
  rationale: Bei einem Land als Objekt bezeichnet ירשׁ häufig das Erlangen beziehungsweise Antreten des Besitzes. Die Wiederholung stellt die lexikalische Verbindung zum vorigen Satzteil her.
- source_word: וְהֵיטִבְךָ
  choice: er wird dir Gutes tun
  rationale: Der Hifil von יטב mit Personalsuffix bedeutet wörtlich und idiomatisch „jemandem Gutes tun“. Dies vermeidet eine unnötige Verengung auf materiellen Wohlstand.
- source_word: וְהִרְבְּךָ
  choice: dich zahlreicher machen
  rationale: Der Hifil von רבה bedeutet hier, jemanden zahlreich werden zu lassen. Die natürliche deutsche Formulierung bewahrt den Bezug auf die Vermehrung des Volkes.
- source_word: מֵאֲבֹתֶיךָ
  choice: als deine Väter
  rationale: מן ist hier komparativ; zusammen mit „zahlreicher“ ergibt sich „zahlreicher als deine Väter“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: Jehova; der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung אֲבֹתֶיךָ
  choice: deine Väter
  alternative: deine Vorfahren
  rationale: Die maskuline Form des Ausgangstextes bleibt sichtbar. Im Kontext bezeichnet sie die Vorväter Israels.
- issue: Bedeutung von וְהֵיטִבְךָ
  choice: er wird dir Gutes tun
  alternative: er wird dich gedeihen lassen
  rationale: Die breitere benefaktive Aussage des Hebräischen wird bewahrt und nicht ausschließlich als materielles Wohlergehen verstanden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem Hebräischen im Singular. Die Wiederholung „in Besitz nehmen“ bildet die Wiederholung desselben hebräischen Verbs ab; „dir Gutes tun“ bewahrt dessen weite Bedeutung.
