base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: de
  text: Und Jahwe, dein Gott, wird all diese Flüche[a] auf deine Feinde und auf alle legen, die dich hassen und verfolgt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all diese Eide“; im Deuteronomium bezeichnet das Wort häufig Bundesflüche beziehungsweise Bundessanktionen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: wird … legen
  rationale: נתן kann „geben, setzen, legen“ bedeuten. In Verbindung mit Flüchen und עַל gibt „auf … legen“ das Auferlegen der Bundesflüche natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Suffix der 2. Person maskulin Singular bezeichnet eindeutig „dein Gott“.
- source_word: כָּל הָאָלות הָאֵלֶּה
  choice: all diese Flüche
  rationale: אָלָה kann einen Eid oder einen mit Fluch verbundenen Schwur bezeichnen; im unmittelbaren Bundeszusammenhang sind die angekündigten Sanktionen gemeint, daher „Flüche“.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte und geläufige Wiedergabe des Plurals mit Possessivsuffix.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: und auf die, die dich hassen
  rationale: Die substantivierte Partizipialform wird im modernen Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: und verfolgt haben
  rationale: רדף umfasst „nachjagen, verfolgen“. „Verfolgt haben“ passt zum feindlichen Kontext und gibt die abgeschlossene Handlung des hebräischen Perfekts wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אָלוֹת im Bundeskontext
  choice: Flüche
  alternative: Eide
  rationale: Der Zusammenhang von Deuteronomium 30 verweist auf die zuvor ausgesprochenen Bundesflüche. Die breitere lexikalische Möglichkeit „Eide“ bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die beiden Zielgruppen der Flüche parallel, während der abschließende Relativsatz im Deutschen zur Vermeidung einer missverständlichen Zuordnung beide feindlichen Beschreibungen verbindet.
