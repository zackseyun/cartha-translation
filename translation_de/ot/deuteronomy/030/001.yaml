  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: de
  text: Und wenn all dies über dich kommt – der Segen und der Fluch, die ich dir vorgelegt habe – und du es dir unter all den Völkern zu Herzen nimmst, in die Jahwe, dein Gott, dich vertrieben hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Konstruktion führt einen künftigen Umstand ein. „Und wenn“ wahrt den zeitlichen Sinn und klingt im Deutschen natürlich.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: über dich kommt
  rationale: Die hebräische Wendung bezeichnet Ereignisse, die jemanden treffen. Mit dem kollektiven „all dies“ ist im Deutschen der Singular idiomatisch.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all dies
  rationale: דברים kann Wörter, Angelegenheiten oder Dinge bezeichnen. Hier fasst es die genannten Folgen des Bundes zusammen; „all dies“ ist prägnant und natürlich.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: der Segen und der Fluch
  rationale: Die beiden Ausdrücke benennen die zuvor dargelegten gegensätzlichen Bundesfolgen.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: die ich dir vorgelegt habe
  rationale: נתן mit „vor jemandem“ bedeutet hier, etwas zur Kenntnis oder Entscheidung vorzulegen. Diese Wiedergabe ist idiomatisch und erhält den Bezug auf beide Größen.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: und du es dir zu Herzen nimmst
  rationale: Wörtlich steht „zu deinem Herzen zurückbringen“. Die deutsche Wendung erfasst das bewusste Erinnern und innere Bedenken, ohne es auf bloßes Gefühl zu verengen.
- source_word: בְּכָל הַגּוֹיִם
  choice: unter all den Völkern
  rationale: „Unter“ bringt die Zerstreuung innerhalb fremder Völker idiomatisch zum Ausdruck.
- source_word: הִדִּיחֲךָ
  choice: dich vertrieben hat
  rationale: Das Verb bezeichnet ein Wegtreiben oder Verstoßen und passt zur Exilssituation.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das Komma unterstützt im Deutschen die natürliche Lesung der Apposition.
- source_word: שָׁמָּה
  choice: wohin
  rationale: Das Richtungsadverb wird zusammen mit dem Vertreibungsverb im Deutschen natürlich durch „wohin“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Innere Reaktion in וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: dir zu Herzen nimmst
  alternative: dir wieder ins Gedächtnis rufst
  rationale: Die Formulierung bewahrt sowohl die gedankliche als auch die innere, willentliche Dimension des hebräischen „Herzens“ und legt nicht fest, dass nur Erinnerung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Nebensatz offen, weil Vers 1 syntaktisch in den folgenden Vers hineinführt. Die Gedankenstriche markieren die erklärende Apposition „der Segen und der Fluch“.
