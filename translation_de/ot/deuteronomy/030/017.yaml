  text: וְ/אִם יִפְנֶ֥ה לְבָבְ/ךָ֖ וְ/לֹ֣א תִשְׁמָ֑ע וְ/נִדַּחְתָּ֗ וְ/הִֽשְׁתַּחֲוִ֛יתָ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/עֲבַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: de
  text: Wenn sich aber dein Herz abwendet und du nicht hörst[a] und dich abbringen lässt und dich vor anderen Göttern niederwirfst und ihnen dienst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht gehorchst“. Das hebräische Verb kann sowohl „hören“ als auch „auf jemanden hören, gehorchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn ... aber
  rationale: Die Konstruktion leitet die gegensätzliche Bedingung zur vorausgehenden Aufforderung ein und gibt sowohl die konditionale als auch die adversative Funktion natürlich wieder.
- source_word: יִפְנֶה לְבָבְךָ
  choice: sich dein Herz abwendet
  rationale: פנה bezeichnet eine Wendung; mit לֵבָב beschreibt es hier die innere Abkehr der Loyalität. Das reflexive „sich abwendet“ ist im Deutschen natürlich und lässt das unausgesprochene Ziel der Abkehr im Kontext.
- source_word: וְלֹא תִשְׁמָע
  choice: und du nicht hörst
  rationale: שׁמע umfasst Hören, auf jemanden hören und gehorchen. „hörst“ bewahrt das hebräische Hörmotiv, während der Bundeskontext den Sinn des Befolgens erkennen lässt.
- source_word: וְנִדַּחְתָּ
  choice: sondern dich abbringen lässt
  rationale: Der Nifal von נדח kann ein Fortgerissen-, Abgedrängt- oder Verleitetwerden bezeichnen. „dich abbringen lässt“ wahrt die passive beziehungsweise mediale Spannung und bezeichnet die Abkehr von der rechten Bindung, ohne ihren Urheber festzulegen.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: und dich ... niederwirfst
  rationale: Die Form bezeichnet das Sich-Niederwerfen als körperlichen Akt der Verehrung. Die konkrete Handlung bleibt damit sichtbar, statt allgemein mit „anbeten“ wiedergegeben zu werden.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: vor anderen Göttern
  rationale: „andere Götter“ entspricht der festen deuteronomischen Bezeichnung für rivalisierende Gottheiten; „vor“ ist die natürliche deutsche Ergänzung zu „sich niederwerfen“.
- source_word: וַעֲבַדְתָּם
  choice: und ihnen dienst
  rationale: עבד bezeichnet hier den kultischen Dienst an Gottheiten. „dienen“ erhält die lexikalische Grundbedeutung und ist im Zusammenhang eindeutig religiös.
theological_decisions:
- issue: Abfolge der Abkehr vom Bund
  choice: Die Folge wird als innere Abwendung, Nicht-Hören, Sich-abbringen-Lassen, Niederwerfen und Dienen wiedergegeben.
  alternative: שׁמע ausdrücklich mit „gehorchen“ und נדח aktiver mit „dich verführen lassen“ wiederzugeben.
  rationale: Die Übersetzung erhält die stufenweise Darstellung der Untreue und die Spannung zwischen passiver Beeinflussung und eigener Beteiligung, ohne zusätzliche Aussagen über Ursache oder Verantwortung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht entsprechend der hebräischen Singularformen im Singular. Die Satzform bleibt wegen der Fortsetzung in Vers 18 offen und endet daher mit einem Komma.
