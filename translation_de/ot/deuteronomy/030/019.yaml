base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: de
  text: 'Ich rufe heute Himmel und Erde als Zeugen gegen dich an: Leben und Tod, Segen und Fluch habe ich dir vorgelegt. So wähle das Leben, damit du und deine Nachkommen leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Ich rufe … als Zeugen gegen dich auf
  rationale: 'Der Hifil von עוּד mit ב trägt hier einen rechtlichen, bundesbezogenen Sinn: Himmel und Erde werden als Zeugen gegen den angesprochenen Bundespartner angerufen.'
- source_word: הַיּוֹם
  choice: heute
  rationale: Bewahrt die zeitliche Betonung in natürlichem modernem Deutsch.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste deutsche Wendung gibt die umfassende Zeugenformel idiomatisch und präzise wieder.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: Leben und Tod
  rationale: Direkte Wiedergabe des Gegensatzpaares, das die möglichen Bundesfolgen bezeichnet.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: habe ich dir vorgelegt
  rationale: Die Verbindung bedeutet hier, etwas jemandem zur Entscheidung vorzulegen; die deutsche Formulierung ist natürlich und wahrt die Bildlichkeit hinreichend.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: Segen und Fluch
  rationale: Entspricht dem hebräischen Gegensatzpaar knapp und idiomatisch.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: So wähle das Leben
  rationale: Das verbindende ו leitet im Zusammenhang die folgernde Aufforderung ein. „So“ bewahrt diesen Zusammenhang, ohne ein stärkeres, im Text nicht ausdrücklich vorhandenes „deshalb“ einzuführen.
- source_word: לְמַעַן תִּחְיֶה
  choice: damit … leben
  rationale: Gibt die Zweck- beziehungsweise Ergebnisbeziehung von לְמַעַן klar wieder.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: du und deine Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier jedoch die leibliche beziehungsweise generationenübergreifende Nachkommenschaft; „Nachkommen“ ist im Deutschen klar und würdig.
theological_decisions:
- issue: Rechtliche und bundesbezogene Zeugenformel
  choice: Himmel und Erde werden ausdrücklich als Zeugen gegen den Angesprochenen angerufen.
  alternative: „Ich bezeuge euch heute bei Himmel und Erde“ oder eine allgemeine Warnformel.
  rationale: Die Konstruktion הַעִידֹתִי בָכֶם und der Kontext sprechen für eine forensische Zeugenfunktion. Diese Textur wird bewahrt, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Repräsentative Anrede im maskulinen Singular
  choice: Die Singularformen werden mit „dich“, „dir“, „du“ und „deine“ wiedergegeben.
  alternative: Pluralische Wiedergabe mit „euch“ oder ausdrückliche Einfügung „Israel“.
  rationale: Der hebräische Text spricht den Bundespartner repräsentativ in der zweiten Person Singular an. Das Deutsche kann diese Form genau erhalten.
- issue: Verhältnis von göttlicher Vorlage und menschlicher Wahl
  choice: 'Beide Aussagen bleiben unmittelbar nebeneinander stehen: Gott legt Leben und Tod vor, danach ergeht die Aufforderung, das Leben zu wählen.'
  alternative: Eine erklärende Paraphrase, die das Verhältnis systematisch auflöst.
  rationale: Die theologische Spannung des Ausgangstextes soll weder abgeschwächt noch durch eine konfessionelle Deutung ergänzt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die rechtliche Zeugenformel und die direkte Singularanrede bleiben erhalten. Keine Fußnoten sind erforderlich, da „Himmel und Erde“ sowie „Nachkommen“ im Deutschen klar sind und keine wesentliche Mehrdeutigkeit verdecken.
