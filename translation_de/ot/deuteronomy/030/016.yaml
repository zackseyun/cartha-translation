source:
  edition: WLC
  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: de
  text: 'was ich dir heute gebiete: Jahwe, deinen Gott, zu lieben, auf seinen Wegen zu gehen und seine Gebote, seine Satzungen und seine Rechtsbestimmungen[a] zu halten. Dann wirst du leben und zahlreich werden, und Jahwe, dein Gott, wird dich in dem Land segnen, in das du hineinziehst, um es in Besitz zu nehmen.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtsordnungen“ beziehungsweise „Rechtssätze“.'
    reason: מִשְׁפָּטָיו kann je nach Zusammenhang gerichtliche Entscheidungen, Rechtsnormen oder Ordnungen bezeichnen.
  - marker: b
    text: 'Die hebräische Verbfolge kann auch als Ziel oder Folge wiedergegeben werden: „damit du lebst und zahlreich wirst und Jahwe, dein Gott, dich segnet“.'
    reason: Die syntaktische Beziehung der auf die Gebote folgenden Verben lässt sowohl eine verheißende als auch eine finale beziehungsweise konsekutive Wiedergabe zu.
  - marker: c
    text: 'Oder: „um es als Erbe zu empfangen“.'
    reason: לְרִשְׁתָּהּ bedeutet „es in Besitz nehmen“ und kann besonders im Zusammenhang der Landverheißung auch den Empfang als Erbe bezeichnen.
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: was ich dir heute gebiete
  rationale: Der Relativsatz knüpft an den vorausgehenden Zusammenhang an. Das deutsche Präsens gibt die gegenwärtige, nachdrückliche Weisung natürlich wieder.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott, zu lieben
  rationale: Der Infinitiv erläutert den Inhalt des Gebots. יְהוָה wird als der Eigenname „Jahwe“ wiedergegeben, אֱלֹהֶיךָ als appositionales „deinen Gott“.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: auf seinen Wegen zu gehen
  rationale: Die Wegmetapher für die Lebensführung bleibt erhalten; „auf seinen Wegen“ ist im heutigen Deutsch natürlicher als „in seinen Wegen“.
- source_word: לִשְׁמֹר
  choice: zu halten
  rationale: Im Bundes- und Gesetzeskontext bezeichnet das Verb das treue Beachten und Befolgen der Weisungen.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: seine Gebote, seine Satzungen und seine Rechtsbestimmungen
  rationale: Die drei Rechtstermini werden unterschieden. „Rechtsbestimmungen“ wahrt bei מִשְׁפָּטִים den rechtlichen Sinn, ohne im Deutschen missverständlich von einzelnen Gerichtsurteilen zu sprechen.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: Dann wirst du leben und zahlreich werden
  rationale: Die Verbfolge wird im Haupttext als verheißene Folge des Gehorsams verstanden. „Zahlreich werden“ bringt die auf Israel als Gemeinschaft bezogene Vermehrung klar zum Ausdruck.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: in dem Land, in das du hineinziehst, um es in Besitz zu nehmen
  rationale: „In das ... hineinziehst“ gibt die Zielrichtung einschließlich שָׁמָּה idiomatisch wieder. Der Objektsuffix an לְרִשְׁתָּהּ erscheint ausdrücklich als „es“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die im Deutschen übliche wissenschaftliche Umschrift „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Funktion der Verbfolge וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ
  choice: 'Verheißene Folge: „Dann wirst du ...“'
  alternative: 'Ziel- oder Folgesatz: „damit du ...“'
  rationale: Die auf die Infinitive folgende Verbkette kann als Zusage der Folgen des Gehorsams oder als Ziel-/Folgeaussage verstanden werden. Der Haupttext wählt die natürliche Verheißungsform, die Fußnote hält die andere syntaktische Möglichkeit offen.
- issue: Bedeutung von לְרִשְׁתָּהּ im Zusammenhang der Landverheißung
  choice: um es in Besitz zu nehmen
  alternative: um es als Erbe zu empfangen
  rationale: Das Verb bezeichnet regulär die Besitzergreifung; im Kontext des verheißenen Landes kann zugleich der Gedanke des Erbempfangs mitschwingen, ohne dass dieser im Haupttext festgelegt werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen maskulinen Singular durchgehend im Singular. Die Wegmetapher und die abgestufte Rechtsterminologie werden bewahrt; unnötig hölzerne Doppelungen des hebräischen Richtungsadverbs werden idiomatisch in „in das ... hineinziehst“ aufgenommen.
