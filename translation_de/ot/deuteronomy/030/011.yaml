  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: de
  text: Denn dieses Gebot, das ich dir heute gebiete, ist nicht zu schwer für dich[a] und auch nicht fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »liegt nicht außerhalb deiner Reichweite« oder »ist nicht vor dir verborgen«. Das hebräische Verb kann etwas Außergewöhnliches, Unzugängliches oder dem menschlichen Erfassen Entzogenes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Ermahnung ein und entspricht dem hebräischen Zusammenhang natürlich.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: dieses Gebot
  rationale: Bewahrt den bundesrechtlichen Ton von מִצְוָה und ist im modernen Standarddeutsch klar.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: das ich dir heute gebiete
  rationale: Gibt den unmittelbaren, feierlichen Charakter der Rede des Mose wieder; das einfache Präsens ist im Deutschen idiomatischer als eine Verlaufsform.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: ist nicht zu schwer für dich
  rationale: Drückt im Zusammenhang mit den Versen 12–14 aus, dass das Gebot nicht außerhalb des Zugangs oder Fassungsvermögens der Angesprochenen liegt, ohne die Bedeutungsbreite des Verbs zu verschweigen.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: und auch nicht fern
  rationale: Bewahrt die räumliche Metapher, die in den folgenden Versen entfaltet wird, und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von נִפְלֵאת im Verhältnis zu menschlicher Fähigkeit und Bundesgehorsam
  choice: „nicht zu schwer für dich“ als Aussage über die Zugänglichkeit des Gebots im unmittelbaren Bundeszusammenhang
  alternative: „nicht deinem Zugriff entzogen“, „nicht vor dir verborgen“ oder „nicht jenseits deiner Reichweite“
  rationale: Die Formulierung betont, dass Gottes Gebot nicht unzugänglich ist, ohne daraus eine weitergehende Aussage über autonome menschliche Willens- oder Leistungsfähigkeit abzuleiten. Die theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebot“ und „gebiete“ bewahren bewusst den feierlichen, bundesrechtlichen Ton; die Fußnote erhält die echte Bedeutungsbreite des hebräischen Verbs.
