  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: de
  text: Dann wird Jahwe, dein Gott, dein Geschick wenden[a] und sich über dich erbarmen. Er wird dich wieder sammeln[b] aus allen Völkern[c], unter die Jahwe, dein Gott, dich zerstreut hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »deine Gefangenschaft zurückführen«. Die hebräische Wendung meint, dass jemand aus Not oder Exil wiederhergestellt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Er wird zurückkehren und dich sammeln.«'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Nationen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Bundesnamen Gottes in der im Deutschen etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שָׁב אֶת־שְׁבוּתְךָ
  choice: dein Geschick wenden
  rationale: Die feste hebräische Wendung bezeichnet die Aufhebung einer Not- oder Exillage und ihre Wiederherstellung; die deutsche idiomatische Form bewahrt diesen Sinn, ohne die anschließende Sammlung vorwegzunehmen.
- source_word: וְרִחֲמֶךָ
  choice: und sich über dich erbarmen
  rationale: Bewahrt den Gedanken mitfühlender Barmherzigkeit in natürlicher, würdiger deutscher Sprache.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: Er wird dich wieder sammeln
  rationale: Versteht das zweite שָׁב adverbial im Sinn von „wieder“; die mögliche Auffassung als eigenständiges Verb wird in einer Fußnote erhalten.
- source_word: מִכָּל הָעַמִּים
  choice: aus allen Völkern
  rationale: עַמִּים bezeichnet hier die Mehrzahl der Volksgruppen, unter die Israel zerstreut wurde; „Völker“ ist die naheliegende deutsche Entsprechung.
- source_word: הֱפִיצְךָ
  choice: dich zerstreut hat
  rationale: Gibt den Hifil von פוץ im Zusammenhang von Exil und Verteilung unter andere Völker präzise und anschaulich wieder.
- source_word: שָׁמָּה
  choice: unter die
  rationale: Das wörtliche „dorthin“ wird im deutschen Relativsatz idiomatisch mit der Richtung der Zerstreuung verbunden.
theological_decisions:
- issue: Bedeutung der Wendung שׁוּב אֶת־שְׁבוּת
  choice: dein Geschick wenden
  alternative: deine Gefangenschaft zurückführen / deine Gefangenen zurückbringen
  rationale: Die Wendung beschreibt wahrscheinlich umfassend die Wiederherstellung aus Not und Exil. Eine auf Gefangenschaft oder Gefangene verengte Wiedergabe wäre im Deutschen missverständlich und würde sich unnötig mit der folgenden Sammlung überschneiden.
- issue: Funktion des zweiten וְשָׁב
  choice: wieder sammeln
  alternative: zurückkehren und dich sammeln
  rationale: Das Hebräische lässt sowohl eine adverbiale Deutung („wieder“) als auch die Auffassung als eigenständiges Verb („zurückkehren“) zu. Der Haupttext folgt der im Deutschen flüssigeren adverbialen Deutung; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die hebräische Gedankenfolge zu verändern. Der Bundesname wird als „Jahwe“ wiedergegeben; echte lexikalische und syntaktische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
