  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: de
  text: Wenn deine Verstreuten am Ende des Himmels sind[a], wird Yahweh, dein Gott, dich von dort sammeln, und von dort wird er dich holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Am Ende des Himmels“ ist eine hebräische Wendung für den fernsten denkbaren Ort.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Selbst wenn
  rationale: Die Konjunktion leitet eine Bedingung ein. Im Zusammenhang mit dem äußersten denkbaren Ort gibt „selbst wenn“ die zugespitzte Bedingung im Deutschen natürlich wieder, ohne den Sinn zu verändern.
- source_word: נִדַּחֲךָ
  choice: deine Verstreuten
  rationale: Das Wort bezeichnet fortgetriebene oder zerstreute Menschen. „Verstreute“ bewahrt den passiven Ergebnissinn und passt zum kollektiven Bezug auf Israel.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: am Ende des Himmels
  rationale: Die formnahe Wiedergabe erhält das hebräische Raumbild; gemeint ist der fernste denkbare Ort.
- source_word: יְקַבֶּצְךָ
  choice: wird … dich … sammeln
  rationale: Das Piel von קבץ bedeutet „sammeln, zusammenbringen“. Das singularische „dich“ erhält die kollektive Anrede Israels.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, dein Gott
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben; אֱלֹהֶיךָ ist die appositionelle Bundesbezeichnung „dein Gott“.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: und von dort wird er dich holen
  rationale: לקח bedeutet grundsätzlich „nehmen“. In der Bewegung von einem fernen Ort aus ist „holen“ im Deutschen natürlich und bewahrt gegenüber „bringen“ die Perspektive des Ergreifens und Wegführens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Die Transliteration „Yahweh“ bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Kollektiver Singular in der Anrede Israels
  choice: „deine Verstreuten“ und anschließend singularisch „dich“
  alternative: Eine durchgehend pluralische Wiedergabe wie „euch“
  rationale: Der Text spricht Israel als eine kollektive Einheit in der zweiten Person Singular an, obwohl die Verstreuten mehrere Personen sind. Der Wechsel im Deutschen bildet diese Spannung nach.
- issue: Verhältnis zwischen „Verstreuten“ und „dich“
  choice: Keine erklärende Gleichsetzung im Haupttext
  alternative: „wenn du bis … verstreut bist“ oder „dein verbanntes Volk“
  rationale: 'Die ungewöhnliche Formulierung des Hebräischen bleibt erkennbar: Zunächst werden Israels Verstreute genannt, anschließend wird Israel kollektiv als „dich“ angesprochen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „von dort“ bleibt zur Wahrung der hebräischen Betonung erhalten. „Himmel“ bewahrt das biblische Raumbild; „holen“ klingt natürlicher als das isolierte „nehmen“, ohne die Bewegungsrichtung des folgenden Verses vollständig vorwegzunehmen.
