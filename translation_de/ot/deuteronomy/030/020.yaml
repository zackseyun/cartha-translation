  source_fidelity: 'Die Hauptaussage ist zutreffend wiedergegeben: Die drei לְ-Infinitive erläutern das Wählen des Lebens; Jahwe ist als personaler Bezug von „er“ bewahrt; und die Landverheißung samt den drei Erzvätern und dem expliziten „ihnen“ ist enthalten. Die Umschreibung „mit einem Eid zugesagt hat, ihnen zu geben“ bildet jedoch die hebräische Konstruktion „schwor ... zu geben“ weniger unmittelbar ab und ist im Deutschen syntaktisch schwerfällig.'
  naturalness: Der Vers ist insgesamt modernes, würdiges Deutsch. „Dich an ihn hältst“ ist allerdings weniger präzise und idiomatisch als „an ihm festhältst“. Die Umstellung zu „zu geben geschworen hat“ klärt zudem die Bezüge von „deinen Vätern“ und „ihnen“ ohne Bedeutungsverlust.
  terminology: „Jahwe“, „dein Gott“, „auf seine Stimme hörst“, „dein Leben“, „die Länge deiner Tage“, „Land“ und „Väter“ sind sachgerecht. „An ihm festhältst“ gibt דבק בוֹ präzise und in natürlichem modernen Deutsch wieder. Die Fußnoten bewahren die einschlägigen lexikalischen Alternativen; ihre Anker stehen an den passenden Wörtern.
