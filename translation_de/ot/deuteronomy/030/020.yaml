- from: indem du Jahwe, deinen Gott, liebst, auf seine Stimme hörst[a] und dich an ihn hältst[b]; denn er ist dein Leben und die Länge deiner Tage, sodass du in dem Land wohnen kannst, das Jahwe deinen Vätern[c], Abraham, Isaak und Jakob, mit einem Eid zugesagt hat, ihnen zu geben.
  to: indem du Jahwe, deinen Gott, liebst, auf seine Stimme hörst[a] und an ihm festhältst[b]; denn er ist dein Leben und die Länge deiner Tage, sodass du in dem Land wohnen kannst, das Jahwe deinen Vätern[c] – Abraham, Isaak und Jakob – zu geben geschworen hat.
  rationale: Die Revision ersetzt die umständliche Umschreibung der Schwurformel durch die im Deutschen klare und dem Hebräischen eng entsprechende Konstruktion „zu geben geschworen hat“. Die Namen werden als erläuternde Apposition zu „deinen Vätern“ gesetzt. Außerdem wird דבק בוֹ mit „an ihm festhältst“ präziser wiedergegeben. Die Zweck-/Folgebeziehung von לָשֶׁבֶת bleibt mit „sodass du ... wohnen kannst“ bewusst erhalten.
