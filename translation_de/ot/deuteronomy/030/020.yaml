base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: de
  text: indem du Jahwe, deinen Gott, liebst, auf seine Stimme hörst[a] und an ihm festhältst[b]; denn er ist dein Leben und die Länge deiner Tage, sodass du in dem Land wohnen kannst, das Jahwe deinen Vätern[c] – Abraham, Isaak und Jakob – zu geben geschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Stimme gehorchst“. Die hebräische Wendung „auf seine Stimme hören“ schließt häufig ein, ihr zu folgen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dich fest an ihn klammerst“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deinen Vorfahren“. „Väter“ steht hier, weil unmittelbar Abraham, Isaak und Jakob genannt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: indem du … liebst
  rationale: Der Infinitiv mit לְ führt die Erläuterung dazu fort, wie Israel das Leben wählen soll; „indem“ gibt diesen instrumentalen Zusammenhang im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe bewahrt den Eigennamen und seine bundesbezogene Funktion.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: auf seine Stimme hörst
  rationale: Die deutsche Wendung bewahrt das konkrete hebräische Bild und kann zugleich das im Zusammenhang enthaltene Befolgen ausdrücken.
- source_word: וּלְדָבְקָה בוֹ
  choice: und dich an ihn hältst
  rationale: דבק mit ב bezeichnet enge, beständige Bindung. „Sich an jemanden halten“ ist modernes, natürliches Deutsch und wahrt den Gedanken der Treue.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: denn er ist dein Leben
  rationale: Das Pronomen bezieht sich am ehesten auf Jahwe; die direkte Formulierung bewahrt die personale Aussage des Hebräischen.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: und die Länge deiner Tage
  rationale: Die recht formale Wiedergabe erhält das hebräische Bild und vermeidet eine ausdeutende Verengung auf bloßes langes Leben.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: sodass du in dem Land wohnen kannst
  rationale: Der Infinitiv lässt sich hier als Folge beziehungsweise Ziel verstehen. „Land“ bezeichnet im Zusammenhang das verheißene Gebiet.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: das Jahwe … mit einem Eid zugesagt hat
  rationale: נשבע bezeichnet das Schwören. Die deutsche Formulierung macht deutlich, dass die Landgabe Inhalt der eidlichen Zusage ist, ohne sie als bloßes allgemeines Versprechen abzuschwächen.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Die maskuline Bezeichnung wird beibehalten, da unmittelbar Abraham, Isaak und Jakob genannt werden.
- source_word: לָתֵת לָהֶם
  choice: ihnen zu geben
  rationale: Die Formulierung erhält das ausdrücklich gesetzte indirekte Objekt und den Inhalt des Eides.
theological_decisions:
- issue: Bezug von הוּא in „denn er ist dein Leben“
  choice: Das Pronomen bezieht sich auf Jahwe selbst.
  alternative: Das Pronomen fasst den zuvor beschriebenen Weg des liebenden Gehorsams zusammen.
  rationale: Jahwe ist der nächstliegende personale Bezug, und das maskuline Pronomen unterstützt diese Lesart. Die Aussage wird daher nicht unpersönlich zu „das ist dein Leben“ geglättet.
- issue: Verhältnis von Leben und Wohnen im Land
  choice: 'Der Infinitiv wird als Folge beziehungsweise Ziel wiedergegeben: „sodass du … wohnen kannst“.'
  alternative: Eine formal offenere Wiedergabe wäre „um … zu wohnen“ oder schlicht „zu wohnen“.
  rationale: Der Zusammenhang verbindet Jahwe als Leben und Lebensdauer mit dem dauerhaften Wohnen im verheißenen Land; die deutsche Fassung macht diesen Zusammenhang verständlich, ohne ihn als Verdienstschema auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Bildsprache („auf seine Stimme hören“, „Länge deiner Tage“). Die Satzstruktur bleibt nahe am hebräischen Gedankengang, wird aber durch „indem“ und „sodass“ für heutige Leser klar gegliedert.
