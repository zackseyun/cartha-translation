  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: de
  text: Und Jahwe, dein Gott, wird dein Herz und das Herz deiner Nachkommen beschneiden[a], damit du Jahwe, deinen Gott, mit deinem ganzen Herzen und mit deiner ganzen Seele[b] liebst, damit du lebst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Herz beschneiden“. Die Wendung ist Bildsprache für eine von Gott bewirkte innere Veränderung im Zusammenhang mit dem Bund.'
    reason: cultural_note
  - marker: b
    text: Das hebräische Wort kann auch „Leben“ oder „ganzes Selbst“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: wird … beschneiden
  rationale: Das Verb bezeichnet wörtlich das Beschneiden. Obwohl es hier bildlich auf das Herz bezogen ist, bleibt das für den Bund bedeutsame Bild im Haupttext erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte Wiedergabe der Singularanrede mit Suffix der zweiten Person.
- source_word: לְבָבְךָ
  choice: dein Herz
  rationale: „Herz“ bezeichnet hier den inneren Menschen, besonders Willen, Denken und Zuneigung, und bewahrt zugleich das Bild des Ausgangstextes.
- source_word: לְבַב זַרְעֶךָ
  choice: das Herz deiner Nachkommen
  rationale: זֶרַע ist ein kollektiver Ausdruck für die Nachkommenschaft; „Nachkommen“ ist im modernen Deutschen natürlich und schließt die folgenden Generationen ein.
- source_word: לְאַהֲבָה
  choice: sodass du … liebst
  rationale: Der Infinitiv mit ל kann hier Ziel oder Folge ausdrücken. „Sodass“ gibt diese Offenheit im Zusammenhang natürlich wieder, ohne sie ausschließlich als Absicht festzulegen.
- source_word: בְּכָל לְבָבְךָ
  choice: mit deinem ganzen Herzen
  rationale: Die Wendung drückt ungeteilte Hingabe aus und entspricht der vertrauten Sprache des Liebesgebots.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: und mit deiner ganzen Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Seele“ bewahrt die traditionelle Paarung mit „Herz“; eine Fußnote macht die größere Bedeutungsbreite sichtbar.
- source_word: לְמַעַן חַיֶּיךָ
  choice: damit du lebst
  rationale: לְמַעַן bezeichnet Ziel oder Ergebnis. Die knappe Formulierung bewahrt die Aussage des Hebräischen, ohne sie als bloßes langes Weiterleben einzuengen.
theological_decisions:
- issue: Bildsprache von der Beschneidung des Herzens
  choice: Das Bild „dein Herz … beschneiden“ bleibt im Haupttext erhalten.
  alternative: dein Herz verändern / dein Herz reinigen
  rationale: Der Text verbindet das Bundeszeichen mit einer von Gott bewirkten inneren Veränderung. Eine erklärende Umschreibung würde diese Verbindung abschwächen und die Art der Veränderung stärker festlegen, als es der Ausgangstext tut.
- issue: Bedeutungsumfang von נֶפֶשׁ im Liebesgebot
  choice: „Seele“ im Haupttext, ergänzt durch eine Fußnote.
  alternative: Leben / ganzes Selbst
  rationale: Das Wort meint nicht zwingend einen vom Körper getrennten Seelenteil, sondern kann den lebenden Menschen als Ganzes bezeichnen. Die gewählte Wiedergabe bewahrt die bekannte Formel, während die Fußnote eine anthropologische Überdeutung verhindert.
- issue: Verhältnis von göttlichem Handeln, Liebe und Leben
  choice: „sodass du … liebst – damit du lebst“
  alternative: „um … zu lieben, sodass du am Leben bleibst“
  rationale: Die Formulierung hält sowohl den Ziel- beziehungsweise Folgecharakter der Herzensbeschneidung als auch die abschließende Ausrichtung auf das Leben sichtbar, ohne die genaue kausale Beziehung dogmatisch auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch „sodass“ und den Gedankenstrich natürlich lesbar. Die Singularanrede „du/dein“ ist durchgehend bewahrt.
