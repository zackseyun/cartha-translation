  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: de
  text: Denn das Wort ist dir sehr nahe[a], in deinem Mund und in deinem Herzen, um es zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sache“ oder „das Gebot“. Das hebräische Wort דָּבָר kann je nach Zusammenhang ein Wort, eine Sache oder ein Gebot bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; „Denn“ bewahrt diesen logischen Anschluss in natürlichem Deutsch.
- source_word: קָרוֹב אֵלֶיךָ
  choice: ist dir ganz nah
  rationale: Die deutsche Fügung „jemandem nah sein“ gibt Adjektiv und Präpositionalbezug idiomatisch und präzise wieder.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder kontextuell „Gebot“ bedeuten. „Das Wort“ wahrt die lexikalische Breite und verweist zugleich verständlich auf die vorausgehende Weisung.
- source_word: מְאֹד
  choice: ganz
  rationale: „Ganz nah“ ist die natürliche deutsche Verstärkung und entspricht hier dem intensivierend gebrauchten מְאֹד.
- source_word: בְּפִיךָ
  choice: in deinem Mund
  rationale: Die direkte Wiedergabe bewahrt das körperhafte Bild des hebräischen Textes und die Parallele zu „in deinem Herzen“.
- source_word: וּבִלְבָבְךָ
  choice: und in deinem Herzen
  rationale: „Herz“ bewahrt die traditionelle und kontextuell passende Bezeichnung des inneren Menschen einschließlich Denken und Wollen.
- source_word: לַעֲשֹׂתוֹ
  choice: sodass du danach handeln kannst
  rationale: Der Ausdruck gibt den Zweck beziehungsweise die Folge idiomatisch wieder. „Danach handeln“ vermeidet das im Deutschen unnatürliche „es tun“, während das Modalverb die im Kontext betonte Ausführbarkeit ausdrückt.
theological_decisions:
- issue: Referent von „das Wort“
  choice: Im Haupttext steht allgemein „das Wort“.
  alternative: „das Gebot“ oder „die Sache“
  rationale: Der unmittelbare Zusammenhang betrifft Gottes Gebot, doch דָּבָר ist weiter gefasst. Die Übersetzung engt den Ausdruck daher nicht stillschweigend auf „Gebot“ ein.
- issue: Sinn von לַעֲשֹׂתוֹ
  choice: „sodass du danach handeln kannst“
  alternative: „um es zu tun“
  rationale: Die Formulierung macht in natürlichem Deutsch deutlich, dass die Nähe des Wortes seine Befolgung ermöglicht, ohne eine weitergehende Lehrentscheidung über menschliche Fähigkeit oder Gnade in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten Bilder „Mund“ und „Herz“ bleiben erhalten; „danach handeln“ ist gegenüber dem wörtlichen „es tun“ idiomatischer und klarer.
