  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: de
  text: 'Es ist nicht im Himmel[a], sodass du sagen müsstest: »Wer wird für uns in den Himmel hinaufsteigen, es für uns holen und es uns hören lassen, damit wir es tun?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »in den Himmeln«; im Deutschen bezeichnet »im Himmel« hier idiomatisch den himmlischen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: im Himmel
  rationale: Der Ausdruck bezeichnet hier den für Menschen unerreichbar scheinenden himmlischen Bereich. Der Singular »Himmel« ist im modernen Deutschen idiomatisch.
- source_word: הִוא
  choice: es ist
  rationale: Das feminine hebräische Pronomen verweist im Kontext auf das Gebot beziehungsweise die Weisung; im Deutschen richtet sich das Pronomen nach dem sächlichen »Gebot«.
- source_word: לֵאמֹר
  choice: sodass du sagen müsstest
  rationale: Der Infinitiv leitet den Inhalt eines hypothetischen Einwands ein. Die modale Formulierung gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Wer wird für uns … hinaufsteigen
  rationale: עלה bezeichnet eine Aufwärtsbewegung; לָנוּ hat benefaktive Bedeutung. »Für uns« bleibt bewusst nahe an der hebräischen Formulierung.
- source_word: הַשָּׁמַיְמָה
  choice: zum Himmel
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf den Himmel zu; »zum Himmel« gibt dies knapp und idiomatisch wieder.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: es für uns holen
  rationale: לקח bedeutet grundsätzlich »nehmen«; in diesem Zusammenhang ist das gemeinte Herbeiholen im Deutschen mit »holen« klar und natürlich ausgedrückt.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: es uns hören lassen
  rationale: Die Hifil-Form von שמע ist kausativ. »Hören lassen« bewahrt diese Bedeutung, ohne sie deutend zu »verkünden« zu erweitern.
- source_word: וְנַעֲשֶׂנָּה
  choice: damit wir es tun
  rationale: עשה bezeichnet das Tun beziehungsweise Befolgen des Gebots. Der Finalsatz gibt den Zweckzusammenhang der Verbfolge natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Pronomen und die kausative Wendung »hören lassen« bleiben erhalten, um die Struktur und Aussage des Hebräischen nicht unnötig zu glätten.
