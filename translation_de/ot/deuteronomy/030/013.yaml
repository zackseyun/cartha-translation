  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: de
  text: 'Es ist auch nicht jenseits des Meeres[a], sodass du sagen müsstest: »Wer wird für uns auf die andere Seite des Meeres hinübergehen, es für uns holen[b] und es uns zu Gehör bringen[c], damit wir es tun?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf der anderen Seite des Meeres« beziehungsweise »jenseits vom Meer«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier ein Verb mit der Grundbedeutung »nehmen«; im Zusammenhang ist gemeint, es zu erlangen und herzubringen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »es uns hören lassen«. Die hebräische Kausativform kann bedeuten, etwas zu verkünden oder so zu erklären, dass andere es hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: jenseits des Meeres
  rationale: Die Wendung bezeichnet einen Ort auf der anderen Seite des Meeres. »Jenseits des Meeres« bewahrt das räumliche Bild knapp und idiomatisch.
- source_word: הִוא
  choice: es ist
  rationale: Das feminine hebräische Pronomen verweist im Zusammenhang auf das Gebot beziehungsweise das Wort; im Deutschen wird der Rückbezug sinngemäß mit dem neutralen »es« wiedergegeben.
- source_word: לֵאמֹר
  choice: sodass du sagen müsstest
  rationale: Die Form leitet einen hypothetischen Einwand ein. Die deutsche Konstruktion gibt den rhetorischen Sinn natürlich wieder.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: wird für uns auf die andere Seite des Meeres hinüberfahren
  rationale: Die Übersetzung erhält sowohl die Bewegung des Verbs als auch die ausdrücklich genannte Zielseite. »Hinüberfahren« passt im Zusammenhang mit dem Meer besser als das allgemeinere »hinübergehen«.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: es für uns holen
  rationale: Das Verb bedeutet grundsätzlich »nehmen«, bezeichnet hier aber das Erlangen und Herbeibringen dessen, was sonst unerreichbar wäre. »Holen« drückt dies im Deutschen prägnant aus.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: es uns zu Gehör bringen
  rationale: 'Die Hifil-Form von שׁמע ist kausativ: Jemand bewirkt, dass andere es hören. »Zu Gehör bringen« wahrt diese Nuance, ohne im Deutschen unnatürlich zu klingen.'
- source_word: וְנַעֲשֶׂנָּה
  choice: damit wir es tun
  rationale: Die Wendung gibt Ziel beziehungsweise Folge des Hörens an und bewahrt den konkreten Gehorsamsgedanken des Verbs »tun«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular bei »du«. Das räumliche Bild und die dreigliedrige Abfolge von Hinüberfahren, Holen und Hörbar-Machen werden bewahrt; erläuterungsbedürftige wörtliche Nuancen stehen in Fußnoten.
