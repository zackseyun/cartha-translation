base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: de
  text: und du zu Jahwe, deinem Gott, zurückkehrst und auf seine Stimme hörst, gemäß allem, was ich dir heute gebiete, du und deine Kinder[b], mit deinem ganzen Herzen und mit deiner ganzen Seele[c][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Stimme gehorchst“. Die hebräische Wendung „auf die Stimme hören“ schließt hier das Befolgen ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deine Söhne“; das hebräische Wort kann hier die Kinder beziehungsweise Nachkommen insgesamt bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit deinem ganzen Leben“ beziehungsweise „mit deinem ganzen Sein“. Das hebräische Wort נֶפֶשׁ kann Seele, Leben, Person oder das ganze Selbst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: und du ... zurückkehrst
  rationale: שׁוּב mit עַד bezeichnet hier die Rückkehr zu jemandem. „Zurückkehren“ bewahrt das konkrete Bild und lässt die im Bundeskontext mitschwingende Umkehr erkennen, ohne den engeren theologischen Begriff „Buße tun“ einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die Verbindung mit dem Suffix der zweiten Person Singular bezeichnet eindeutig „deinen Gott“.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: und auf seine Stimme hörst
  rationale: Die deutsche Wendung „auf jemandes Stimme hören“ bewahrt das hebräische Stimmenbild und vermittelt zugleich das gemeinte Beachten und Gehorchen.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: auf alles, was ich dir heute gebiete
  rationale: „Auf alles ... hören“ verbindet den Umfang der Weisung natürlich mit dem vorangehenden Ausdruck. „Gebiete“ gibt das Partizip im gegenwärtigen Sprechakt knapp und würdig wieder.
- source_word: אַתָּה וּבָנֶיךָ
  choice: du und deine Kinder
  rationale: בָּנִים kann Söhne bezeichnen, im familiären und bundesbezogenen Zusammenhang aber auch die Nachkommenschaft insgesamt. „Kinder“ vermeidet eine unbegründete Beschränkung.
- source_word: בְּכָל לְבָבְךָ
  choice: mit deinem ganzen Herzen
  rationale: Die vertraute deutsche Formulierung bewahrt das hebräische Bild; לֵבָב umfasst dabei Denken, Wollen und die innere Person.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: und mit deiner ganzen Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Person oder das ganze Selbst bezeichnen. „Seele“ wahrt die traditionelle Paarung mit „Herz“, während die Fußnote die Bedeutungsbreite offenhält.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Umschrift „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsweite von בָנֶיךָ
  choice: deine Kinder
  alternative: deine Söhne
  rationale: Der maskuline Plural kann in diesem Bundeskontext die Nachkommen generisch bezeichnen. „Kinder“ hält diesen Umfang fest, ohne ausschließlich männliche Nachkommen zu behaupten.
- issue: Bedeutungsweite von נַפְשֶׁךָ
  choice: deine ganze Seele
  alternative: dein ganzes Leben; dein ganzes Sein
  rationale: Die traditionelle Wiedergabe lässt die anthropologische Spannung des hebräischen Begriffs bestehen; eine Fußnote nennt die möglichen ganzheitlichen Bedeutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax setzt den aus Vers 1 fortlaufenden Bedingungs- beziehungsweise Folgesatz bewusst mit „und“ fort. Gedankenstriche verdeutlichen, dass „auf alles, was ich dir heute gebiete“ den Inhalt des Hörens bestimmt. Die Formulierungen bewahren die hebräischen Bilder „zurückkehren“, „Stimme“, „Herz“ und „Seele“, ohne unnötig altertümlich zu wirken.
