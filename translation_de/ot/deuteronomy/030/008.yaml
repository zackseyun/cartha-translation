base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: de
  text: Und du wirst umkehren[a] und auf die Stimme Jahwes hören[b] und alle seine Gebote befolgen, die ich dir heute gebiete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückkehren“; im Zusammenhang kann das Wort auch die Umkehr zu erneuerter Bundestreue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „auf die Stimme … hören“ schließt gewöhnlich ein, ihr zu gehorchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה תָשׁוּב
  choice: Und du wirst umkehren
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten. „Umkehren“ wahrt bei שׁוב sowohl den räumlichen als auch den bundestheologischen Sinn, ohne den Ausdruck auf ausdrückliche Buße einzuengen.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: und auf die Stimme Jahwes hören
  rationale: Die Wendung bedeutet im Kontext gehorsames Hören. Die transparente deutsche Form bewahrt jedoch das hebräische Bild und unterscheidet es von der anschließenden Ausführung der Gebote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְעָשִׂיתָ אֶת כָּל מִצְוֺתָיו
  choice: und alle seine Gebote tun
  rationale: „Tun“ entspricht עשה unmittelbar; „Gebote“ wahrt den rechtlich-bundestheologischen Sprachgebrauch des Deuteronomiums.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Die Formulierung ist natürliches, würdiges Deutsch und bewahrt das deuteronomische Schlüsselwort „heute“ sowie den Wechsel zur ersten Person des redenden Mose.
theological_decisions:
- issue: Bedeutungsumfang von שׁוב
  choice: umkehren
  alternative: zurückkehren; Buße tun
  rationale: „Umkehren“ lässt offen, ob räumliche Rückkehr, erneuerte Bundestreue oder Umkehr im Sinn der Reue im Vordergrund steht.
- issue: Wiedergabe von שׁמע בקול
  choice: auf die Stimme Jahwes hören
  alternative: Jahwe gehorchen
  rationale: Die idiomatische Bedeutung schließt Gehorsam ein, doch die bildhafte Ausgangsformulierung bleibt erhalten; der folgende Satzteil macht den tätigen Gehorsam ausdrücklich.
- issue: Tempus und Aussageweise der Verbfolge
  choice: wirst … umkehren … hören … tun
  alternative: sollst … umkehren … hören … tun
  rationale: Im Zusammenhang von Deuteronomium 30 tragen die Formen vorwiegend voraussagenden Charakter. Das Futur vermeidet, die Aussage ohne Not in eine bloße Aufforderung umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber flüssig lesbar. „Jahwe“ gibt den Gottesnamen wieder; „gebiete“ erhält den gehobenen bundestheologischen Ton, ohne veraltet zu wirken.
