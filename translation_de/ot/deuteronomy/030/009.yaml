source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: de
  text: Und Jahwe, dein Gott, wird dir bei allem Werk deiner Hand, bei der Frucht deines Leibes, bei der Frucht deines Viehs und bei der Frucht deines Ackerbodens Überfluss schenken,[a] zu deinem Besten. Denn Jahwe wird sich wieder zu deinem Besten über dich freuen, wie er sich über deine Väter freute.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird dich bei allem Werk deiner Hand überreich machen“. Das hebräische Verb bezeichnet verursachte Fülle oder einen Überschuss.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Väter“ sind hier Israels Vorväter oder frühere Generationen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: wird dir Überfluss schenken
  rationale: Der Hifil von יתר bezeichnet hier das Verursachen von Fülle oder Überschuss. Die Formulierung wahrt die kausative Bedeutung und klingt im Deutschen natürlicher als eine wörtliche Konstruktion mit „überreich machen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: bei allem, was deine Hand tut
  rationale: Die Wendung bewahrt das konkrete hebräische Bild der Hand und bezeichnet zugleich alle Arbeiten und Unternehmungen.
- source_word: בִּפְרִי בִטְנְךָ
  choice: bei der Frucht deines Leibes
  rationale: Die traditionelle Metapher für Nachkommen bleibt erhalten; „Leib“ ist im Deutschen idiomatischer und würdevoller als das anatomisch engere „Bauch“.
- source_word: בְהֶמְתְּךָ
  choice: deines Viehs
  rationale: Das Wort bezeichnet hier allgemein die domestizierten Nutztiere im landwirtschaftlichen Zusammenhang.
- source_word: אַדְמָתְךָ
  choice: deines Ackerbodens
  rationale: Die Wiedergabe bezeichnet konkret den Erdboden als Quelle des Ertrags und vermeidet die territoriale Mehrdeutigkeit von „Land“.
- source_word: לְטוֹבָה / לְטוֹב
  choice: zu deinem Besten / dir Gutes tun
  rationale: Die beiden eng verwandten Wendungen bezeichnen ein wohltätiges Ergebnis. Im zweiten Satz wird die syntaktische Verbindung mit dem Freuen im Deutschen ausdrücklich und natürlich wiedergegeben.
- source_word: יָשׁוּב ... לָשׂוּשׂ עָלֶיךָ
  choice: wird wieder Freude an dir haben
  rationale: שׁוב mit Infinitiv bezeichnet die Wiederaufnahme einer Handlung; שׂושׂ drückt Freude oder Frohlocken über jemanden aus. Die Formulierung ist natürlich und bewahrt die persönliche Zuwendung.
- source_word: אֲבֹתֶיךָ
  choice: deine Väter
  rationale: Die maskuline Bezeichnung wird als „Väter“ wiedergegeben; im Kontext sind Israels Vorväter beziehungsweise frühere Generationen gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֲבֹתֶיךָ
  choice: deine Väter
  alternative: deine Vorfahren
  rationale: Die ausdrücklich maskuline Form und ihr möglicher Bezug auf die patriarchalische Linie bleiben im Haupttext sichtbar; die weitere Bedeutung „Vorfahren“ wird in der Fußnote erläutert.
- issue: Verhältnis von Freude und Wohltun in לָשׂוּשׂ עָלֶיךָ לְטוֹב
  choice: Freude an dir haben und dir Gutes tun
  alternative: sich zu deinem Besten über dich freuen
  rationale: לְטוֹב kann das erneute Freuen als auf das Gute gerichtetes Wohlwollen näher bestimmen. Die gewählte deutsche Formulierung macht den positiven Zweck verständlich, ohne die göttliche Freude auf bloß materiellen Wohlstand zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Du-Anrede. Die landwirtschaftlichen Bilder und die Wiederholung „Frucht“ bleiben erhalten. Das konkrete Hand-Bild wird bewahrt, zugleich aber syntaktisch verständlich formuliert.
