  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: de
  text: 'Ich erkläre euch heute: Ihr werdet ganz gewiss zugrunde gehen[a]. Ihr werdet in dem Land nicht lange leben[b], in das du[c] über den Jordan hinüberziehst, um dorthin zu gelangen und es in Besitz zu nehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zugrunde gehend werdet ihr zugrunde gehen“; diese hebräische Konstruktion verstärkt die Gewissheit der Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Ihr werdet eure Tage in dem Land nicht verlängern.“'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Text wechselt hier von der Anrede im Plural („euch“, „ihr“) zum Singular („du“) und spricht Israel als ein Volk an.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: Ich erkläre
  rationale: Das Hifil von נגד bezeichnet das Bekanntmachen oder feierliche Erklären. „Ich erkläre“ bewahrt den ernsten Charakter der Warnung.
- source_word: לָכֶם הַיּוֹם
  choice: euch heute
  rationale: לָכֶם ist die Anrede in der zweiten Person Plural; הַיּוֹם bezeichnet die unmittelbare Gegenwart der Erklärung.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: ihr werdet ganz gewiss zugrunde gehen
  rationale: Der absolute Infinitiv vor dem finiten Verb verstärkt die Aussage. „Ganz gewiss“ gibt diese emphatische Gewissheit in natürlichem Deutsch wieder.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: ihr werdet nicht lange leben
  rationale: Wörtlich geht es um das Nichtverlängern der Tage. Die gewählte Formulierung gibt die hebräische Wendung verständlich und idiomatisch wieder; die wörtlichere Alternative steht in der Fußnote.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: הָאֲדָמָה bezeichnet hier im Zusammenhang die verheißene Landfläche jenseits des Jordan, nicht lediglich den Erdboden. Im Deutschen ist „in dem Land leben“ idiomatischer als „auf dem Land leben“, das ländliches Wohnen nahelegen könnte.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: in das du über den Jordan hinüberziehst
  rationale: Der hebräische Text wechselt hier vom Plural zum kollektiven Singular. „Hinüberziehst“ drückt die gerichtete Überquerung des Jordan natürlich aus.
- source_word: לָבֹא שָׁמָּה
  choice: um dorthin zu gelangen
  rationale: Die Formulierung gibt sowohl die Bewegung von בוא als auch das ausdrücklich vorhandene Richtungsadverb שָׁמָּה wieder.
- source_word: לְרִשְׁתָּהּ
  choice: und es in Besitz zu nehmen
  rationale: ירש bezeichnet im Kontext der Landverheißung das Erlangen beziehungsweise In-Besitz-Nehmen des Landes; das feminine Suffix wird mit „es“ wiedergegeben.
theological_decisions:
- issue: Wechsel zwischen pluralischer und singularischer Anrede Israels
  choice: Den Wechsel als „euch/ihr“ und anschließend „du“ sichtbar wiedergeben
  alternative: Durchgehend pluralisch formulieren
  rationale: Der Ausgangstext spricht die Hörerschaft zunächst im Plural an und wechselt bei אַתָּה zum kollektiven Singular. Die Übersetzung bewahrt diesen rhetorischen Wechsel, ohne ihn theologisch aufzulösen.
- issue: Bezeichnung des verheißenen Landes
  choice: הָאֲדָמָה als „das Land“ wiedergeben
  alternative: „der Erdboden“ oder „das Landgebiet“
  rationale: Die Warnung bezieht sich auf das Gebiet jenseits des Jordan, das Israel in Besitz nehmen soll. „Das Land“ wahrt diesen erzählerischen und bundesbezogenen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die feierliche Warnung klar verständlich. Die Übersetzung bewahrt die emphatische Aussage, das Richtungsadverb „dorthin“, das pronominale Objekt „es“ und den auffälligen Wechsel vom Plural zum kollektiven Singular.
