base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: de
  text: wenn du auf die Stimme Jahwes, deines Gottes, hörst[a] und seine Gebote und Satzungen hältst, die in diesem Buch des Gesetzes geschrieben stehen, wenn du zu Jahwe, deinem Gott, umkehrst[b] mit deinem ganzen Herzen und mit deiner ganzen Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung bedeutet, auf das zu achten und dem zu gehorchen, was Jahwe sagt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zurückkehrst“ oder „dich wieder zuwendest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: Beide Vorkommen leiten im Zusammenhang parallele Bedingungen ein; „wenn“ gibt Syntax und Gedankengang angemessen wieder.
- source_word: תִשְׁמַע בְּקוֹל
  choice: auf die Stimme … hörst
  rationale: Die deutsche Wendung bewahrt das hebräische Bild und bezeichnet hier nicht bloßes Hören, sondern gehorsames Beachten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der offenbarte Eigenname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: לִשְׁמֹר
  choice: und … hältst
  rationale: Der Infinitiv erläutert, worin das Hören auf Gottes Stimme besteht. Eine koordinierte deutsche Formulierung ist natürlich und wahrt den Sinn.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: seine Gebote und Satzungen
  rationale: Die beiden unterschiedlichen Rechtstermini werden mit herkömmlichen, zugleich verständlichen deutschen Entsprechungen wiedergegeben.
- source_word: הַכְּתוּבָה
  choice: die … geschrieben stehen
  rationale: Das feminine Singularpartizip bezieht sich kollektiv auf die vorausgehenden Rechtsbestimmungen; im Deutschen ist der Plural grammatisch erforderlich.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: in diesem Buch des Gesetzes
  rationale: „Buch des Gesetzes“ ist eine klare und eingebürgerte Wiedergabe der Bezeichnung für das Bundesdokument.
- source_word: כִּי תָשׁוּב
  choice: wenn du … umkehrst
  rationale: שׁוב bezeichnet das Sich-Zurückwenden zu Gott und trägt hier einen bundesbezogenen Bußsinn, ohne auf den abstrakteren Begriff „bereuen“ verengt zu werden.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: mit deinem ganzen Herzen und mit deiner ganzen Seele
  rationale: Die geläufige deutsche Wendung bewahrt die umfassende hebräische Aussage über den inneren Menschen und das ganze Leben.
theological_decisions:
- issue: Bundesbezogene Bedeutung von שׁוב
  choice: umkehrst
  alternative: zurückkehrst / dich wieder zuwendest
  rationale: „Umkehren“ bewahrt die Bewegungsmetapher und lässt zugleich den Buß- und Bundesbezug erkennen, ohne ihn dogmatisch weiter auszudeuten.
- issue: Bedeutung von שׁמע בקול
  choice: auf die Stimme … hörst
  alternative: der Stimme … gehorchst
  rationale: Die bildhafte Ausgangsform bleibt sichtbar; eine Fußnote verdeutlicht, dass gehorsames Befolgen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Fortsetzung des vorausgehenden Kontextes konditional. Der Gottesname wird als „Jahwe“ wiedergegeben; traditionelle Rechtsbegriffe bleiben erhalten, ohne unnötig altertümlich zu wirken.
