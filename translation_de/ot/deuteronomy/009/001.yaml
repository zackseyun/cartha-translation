source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: de
  text: Höre, Israel! Heute überquerst du den Jordan, um hineinzuziehen und Völker zu vertreiben[a], die größer und mächtiger sind als du und deren Städte groß und bis zum Himmel befestigt sind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land dieser Völker in Besitz zu nehmen“. Das hebräische Verb kann „in Besitz nehmen“ bedeuten; im Zusammenhang einer Eroberung schließt es die Vertreibung der bisherigen Bewohner ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „am Himmel“; eine bildhafte Übertreibung für außerordentlich hohe und starke Befestigungen.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der singularische Imperativ richtet sich an Israel als Gemeinschaft. „Höre“ bewahrt den für das Deuteronomium charakteristischen feierlichen Aufruf.
- source_word: עֹבֵר הַיּוֹם
  choice: Heute überquerst du
  rationale: Das Partizip mit „heute“ bezeichnet das unmittelbar bevorstehende beziehungsweise einsetzende Geschehen und setzt den zeitlichen Akzent an den Satzanfang.
- source_word: אֶת־הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die übliche deutsche Bezeichnung des Flusses; ein ergänzendes „Fluss“ ist im Hebräischen nicht vorhanden und im Deutschen nicht nötig.
- source_word: לָבֹא
  choice: um hineinzuziehen
  rationale: בוא bezeichnet nach der Jordanüberquerung das Hineingehen in das Land. „Hineinziehen“ passt natürlich zum folgenden Eroberungskontext.
- source_word: לָרֶשֶׁת
  choice: und Völker zu vertreiben
  rationale: ירשׁ kann „in Besitz nehmen“ oder im Eroberungskontext „vertreiben/enteignen“ bedeuten. Da Völker das direkte Objekt sind, ist „vertreiben“ hier syntaktisch und kontextuell klar, während die Alternative in der Fußnote erhalten bleibt.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Bezeichnet hier die verschiedenen Bevölkerungsgruppen beziehungsweise politischen Gemeinschaften im Land; „Völker“ ist im modernen Deutschen natürlicher als „Nationen“.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: die größer und mächtiger sind als du
  rationale: Gibt beide komparativ verstandenen Adjektive wieder und bewahrt die direkte Gegenüberstellung mit Israel.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם
  choice: mit großen Städten, die bis an den Himmel befestigt sind
  rationale: „Mit“ verdeutlicht die Zuordnung der Städte zu den Völkern. Die Formulierung bewahrt das starke räumliche Bild der hebräischen Übertreibung.
theological_decisions:
- issue: Bedeutung von ירשׁ im Eroberungskontext
  choice: „Völker zu vertreiben“ im Haupttext
  alternative: „Völker in Besitz zu nehmen“ beziehungsweise „ihr Land in Besitz zu nehmen“
  rationale: Das Verb umfasst Besitzergreifung und kann dabei die Verdrängung der bisherigen Bewohner bezeichnen. Weil hier die Völker selbst grammatisch als Objekt erscheinen, wird „vertreiben“ gewählt, ohne die weitere Bedeutungsbreite zu verschweigen.
- issue: Übersteigerte Beschreibung der Befestigungen
  choice: „bis an den Himmel befestigt“
  alternative: Eine abschwächende Wiedergabe wie „mit sehr hohen Befestigungen“
  rationale: Das konkrete biblische Bild wird erhalten und nicht zu einer sachlichen Erklärung eingeebnet; eine Fußnote weist auf seinen hyperbolischen Charakter hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Auftakt „Höre, Israel!“ wahrt den feierlichen Bundesruf. Die direkte Anrede im Singular entspricht Israel als kollektiv angesprochener Einheit; das Himmelsbild bleibt bewusst erhalten.
