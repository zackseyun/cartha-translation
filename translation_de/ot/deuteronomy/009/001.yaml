  terminology: „Völker“, „Jordan“ und „mächtiger“ sind angemessen. „vertreiben“ ist in diesem Kontext als kontextuelle Entfaltung von ירשׁ vertretbar, sollte aber die Bedeutung des Besitzergreifens nicht durch eine ungenaue Fußnotenalternative ersetzen. Die Alternative „Völker in Besitz zu nehmen“ ist im Deutschen semantisch problematisch; man nimmt ein Land/Gebiet, nicht Völker, „in Besitz“.
