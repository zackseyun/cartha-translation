  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: de
  text: Sogar am Horeb habt ihr Jahwe zum Zorn gereizt[a], und Jahwe wurde so zornig auf euch, um euch zu vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch am Horeb“ beziehungsweise schlicht „Am Horeb“. Die hebräische Konjunktion kann nur den Bericht fortführen, hier aber auch eine Hervorhebung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe zürnte euch, um euch zu vernichten.“ Das Hebräische verbindet Jahwes Zorn unmittelbar mit der drohenden Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Sogar am Horeb
  rationale: Die Konjunktion setzt den Zusammenhang fort und kann hier im Rückblick auf Israels fortgesetzte Widersetzlichkeit hervorhebend verstanden werden. „Sogar am Horeb“ gibt diese wahrscheinliche Emphase natürlich wieder; die neutraleren Möglichkeiten werden in der Fußnote genannt.
- source_word: הִקְצַפְתֶּם
  choice: habt ihr … zum Zorn gereizt
  rationale: Der Hifil von קצף bezeichnet das Verursachen von Zorn. Die Wendung wahrt die kausative Bedeutung und den ernsten Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: Da wurde Jahwe so zornig auf euch
  rationale: אנף bezeichnet heftigen Zorn; ב wird im Deutschen bei dieser feindlichen Ausrichtung idiomatisch mit „auf euch“ wiedergegeben. „so … dass“ verbindet den Zorn eng mit dem folgenden Infinitiv.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: dass er euch vernichten wollte
  rationale: Der Hifil von שׁמד bedeutet vernichten oder ausrotten. Im Zusammenhang drückt ל mit dem Infinitiv Ziel beziehungsweise beabsichtigte Folge des Zorns aus; „wollte“ macht dies auf Deutsch verständlich, ohne zu behaupten, die Vernichtung sei ausgeführt worden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung „der HERR“ wird nicht in den Haupttext übernommen.
- issue: Verhältnis von Gottes Zorn zur angedrohten Vernichtung
  choice: so zornig …, dass er euch vernichten wollte
  alternative: zürnte euch, um euch zu vernichten
  rationale: Die Konstruktion verbindet den Zorn unmittelbar mit der Vernichtung als Ziel oder drohender Folge. Die deutsche Fassung wahrt diesen engen Zusammenhang, ohne die tatsächlich nicht vollzogene Vernichtung als vollendetes Geschehen darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „zum Zorn gereizt“ bewahrt die kausative Aussage; „vernichten“ ist gewichtig, ohne die umgangssprachliche Färbung von „auslöschen“ oder „fertigmachen“. Die Satzteilung verbessert die Lesbarkeit und erhält den narrativen Fortgang.
