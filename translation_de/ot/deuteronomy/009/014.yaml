base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: de
  text: Lass mich[a], damit ich sie vernichte und ihren Namen unter dem Himmel[b] auslösche. Ich werde dich zu einem Volk machen, das mächtiger und zahlreicher ist als sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Lass mich, und ich werde sie vernichten …“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter den Himmeln“; gemeint ist ihre Beseitigung von der Erde und damit aus menschlichem Dasein und Erinnern.'
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Lass ab von mir
  rationale: Der Imperativ von רפה mit מן fordert idiomatisch dazu auf, von jemandem abzulassen beziehungsweise ihn nicht zurückzuhalten. Die Formulierung bleibt nahe am Hebräischen und bewahrt die in der Szene mitschwingende Fürsprache des Mose, ohne sie ausdrücklich hinzuzufügen.
- source_word: וְאַשְׁמִידֵם
  choice: damit ich sie vernichte
  rationale: שׁמד bezeichnet starkes, vollständiges Vernichten. Nach dem Imperativ gibt „damit“ den möglichen Zweck- oder Folgezusammenhang natürlich wieder.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: und ihren Namen … auslösche
  rationale: מחה bedeutet hier das Auslöschen eines Namens und damit die Beseitigung von Fortbestand und Erinnerung. „Auslöschen“ ist im Deutschen sowohl idiomatisch als auch bildlich präzise.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: unter dem Himmel
  rationale: Obwohl das Hebräische formal den Plural „die Himmel“ verwendet, ist „unter dem Himmel“ die natürliche deutsche Wendung für den Bereich der Erde. Eine Fußnote weist auf die Form des Ausgangstextes hin.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Dich aber will ich zu einem Volk machen
  rationale: עשה mit Objekt und ל bezeichnet das Machen zu etwas. Die Voranstellung von „Dich“ bildet den scharfen Kontrast zwischen Israels Vernichtung und der Mose gegebenen Zusage ab; „aber“ macht diesen im Satzbau vorhandenen Gegensatz idiomatisch deutlich.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: das mächtiger und zahlreicher ist als sie
  rationale: עָצוּם bezeichnet Macht oder Stärke, רָב hier die zahlenmäßige Größe. מִמֶּנּוּ ist grammatisch singularisch und bezieht sich kollektiv auf das Volk Israel; im Deutschen ist der Rückbezug mit „sie“ natürlich.
theological_decisions:
- issue: Göttliche Gerichtsankündigung und Zusage, Mose zu einem größeren Volk zu machen
  choice: Die Rede wird als unmittelbare, ernste Ankündigung von Vernichtung und Neuanfang wiedergegeben.
  alternative: Die Aussage bereits in der Übersetzung als bloße Prüfung des Mose oder als rein rhetorische Rede kennzeichnen.
  rationale: Der hebräische Text erklärt die Funktion der Rede an dieser Stelle nicht. Die Übersetzung bewahrt daher die theologische und erzählerische Spannung, ohne sie durch eine bestimmte Deutung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lass ab von mir“ ist bewusst leicht gehoben, aber verständlich und quellennah. Die starken Verben „vernichten“ und „auslöschen“ erhalten die Härte der Gerichtsrede; die Übersetzung schwächt sie nicht ab und erklärt die Spannung der Aussage nicht konfessionell.
