  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: de
  text: Da ergriff ich die beiden Tafeln, warf sie aus meinen beiden Händen und zerbrach sie vor euren Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: Da ergriff ich
  rationale: תפשׂ bezeichnet das Ergreifen oder Festhalten. „Ergriff“ gibt die körperliche Handlung prägnant und in würdigem, modernem Deutsch wieder; „da“ stellt den erzählerischen Anschluss her.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: die beiden Tafeln
  rationale: לֻחוֹת bezeichnet hier die bereits aus dem Zusammenhang bekannten Bundestafeln. „Die beiden Tafeln“ bleibt eng am Wortlaut; dass sie aus Stein waren, wird in diesem Vers nicht ausdrücklich gesagt.
- source_word: וָאַשְׁלִכֵם
  choice: warf sie
  rationale: שלך bedeutet werfen oder schleudern. „Warf“ ist im heutigen Deutsch klar und natürlich, ohne die Heftigkeit stärker auszudeuten, als es der hebräische Ausdruck verlangt.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: aus meinen beiden Händen
  rationale: Die Formulierung bewahrt die ausdrückliche Nennung der zwei Hände und gibt מֵעַל in diesem Zusammenhang idiomatisch als Ausgangspunkt der Wurfbewegung wieder.
- source_word: וָאֲשַׁבְּרֵם
  choice: zerbrach sie
  rationale: שׁבר bedeutet „brechen, zerbrechen“. „Zerbrach“ ist direkt und lässt offen, in wie viele Stücke die Tafeln zerfielen; „zerschmetterte“ wäre anschaulicher, aber stärker ausdeutend.
- source_word: לְעֵינֵיכֶם
  choice: vor euren Augen
  rationale: Die hebräische Wendung bezeichnet eine Handlung im unmittelbaren Sichtbereich der Angesprochenen. „Vor euren Augen“ erhält das konkrete Bild und ist im Deutschen geläufig.
