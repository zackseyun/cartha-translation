base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: de
  text: 'Da betete ich zu Jahwe und sagte: »Herr Jahwe, vernichte nicht dein Volk und dein Erbteil, die du durch deine Größe erlöst hast, die du mit starker Hand aus Ägypten herausgeführt hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: Da betete ich zu Jahwe und sagte
  rationale: Die Wayyiqtol-Formen führen die Erzählung weiter. „Da“ gibt die folgerichtige Abfolge im Deutschen natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Wiedergabe bewahrt beide Bestandteile des zusammengesetzten Gottestitels, ohne den Gottesnamen durch einen bloßen Titel zu ersetzen.
- source_word: אַל תַּשְׁחֵת
  choice: vernichte nicht
  rationale: Die verneinte Jussivform ist eine eindringliche Bitte. „Vernichten“ bewahrt die Schwere von שׁחת, ohne die Art der Vernichtung näher festzulegen.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: dein Volk und dein Erbteil
  rationale: '„Erbteil“ erhält die bildhafte und bundestheologische Bedeutung von נַחֲלָה: Israel ist das Jahwe zugehörige Volk.'
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: das du durch deine Größe erlöst hast
  rationale: „Erlöst“ entspricht פדה im Exoduszusammenhang; „durch deine Größe“ gibt das Substantiv גֹּדֶל eng wieder, ohne es vorschnell als „Macht“ auszudeuten.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה
  choice: das du mit starker Hand aus Ägypten herausgeführt hast
  rationale: Die Formulierung bewahrt die traditionelle Exoduswendung und gibt חֲזָקָה unmittelbar mit „stark“ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ erhält den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR
  rationale: „Herr Jahwe“ bildet beide Elemente des hebräischen Titels transparent ab. Die geläufige Alternative „Gott, der HERR“ vermeidet zwar eine ungewohnte Verbindung, gibt יהוה jedoch nicht als Namen wieder.
- issue: Bezug der Relativsätze אֲשֶׁר ... אֲשֶׁר
  choice: Singularischer Bezug auf die Einheit „dein Volk und dein Erbteil“
  alternative: 'Pluralischer Personenbezug: „die du … erlöst und … herausgeführt hast“'
  rationale: Die hebräischen Verben richten sich an Gott und markieren beim Bezugswort keinen Numerusunterschied; die deutsche Singularform „das“ behandelt „Volk und Erbteil“ als zwei Bezeichnungen derselben Gemeinschaft und wahrt so die Apposition, ohne sie dogmatisch weiter auszulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Erbteil“ und „mit starker Hand“ bewahren die prägnante biblische Bildsprache; „Herr Jahwe“ ist bewusst quellenah und trotz seiner geringeren Alltäglichkeit verständlich.
