source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: de
  text: Da warf ich mich vor Yahweh nieder, wie beim ersten Mal, vierzig Tage und vierzig Nächte. Ich aß kein Brot und trank kein Wasser wegen all eurer Sünde, die ihr begangen hattet, indem ihr tatet, was in den Augen Yahwehs böse war, und ihn so zum Zorn reiztet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Da warf ich mich nieder
  rationale: Die Hitpael-Form von נפל bezeichnet hier, dass Mose sich in seiner Fürbitte vor Gott niederwirft. Die deutsche Wendung gibt die bewusste körperliche Haltung natürlich wieder; „Da“ nimmt die erzählende Verknüpfung auf.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי bezeichnet die Stellung vor beziehungsweise in der Gegenwart Gottes. „Vor Yahweh“ ist knapp und idiomatisch.
- source_word: כָּרִאשֹׁנָה
  choice: wie beim ersten Mal
  rationale: Die Wendung verweist vergleichend auf Moses früheren vierzigtägigen Aufenthalt vor Yahweh und ist im Deutschen klarer als „wie zuerst“.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: Ich aß kein Brot und trank kein Wasser
  rationale: Bewahrt die ausdrückliche Nennung von Brot und Wasser sowie den parallelen Satzbau.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: wegen all eurer Sünde
  rationale: עַל bezeichnet hier den Anlass beziehungsweise Grund. Der hebräische Singular חַטָּאת wird als kollektiver Singular bewahrt.
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: die ihr begangen hattet
  rationale: Im Deutschen wird eine Sünde idiomatisch „begangen“; das Plusquamperfekt macht den Rückblick innerhalb der Erzählung deutlich.
- source_word: לַעֲשׂוֹת הָרַע
  choice: indem ihr tatet, was … böse war
  rationale: Der Infinitiv erläutert Inhalt beziehungsweise Art ihrer Sünde. Die Formulierung ist verständlich und bewahrt die moralische Bewertung.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Yahwehs
  rationale: Bewahrt das hebräische Bild für Yahwehs Beurteilung einer Handlung.
- source_word: לְהַכְעִיסוֹ
  choice: und ihn so zum Zorn reiztet
  rationale: 'Die Hifil-Form hat kausative Bedeutung: Sie reizten Yahweh zum Zorn. „So“ stellt den Zusammenhang mit ihrem bösen Tun her, ohne die mögliche Zweck- oder Folgebeziehung unnötig festzulegen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der hebräische Text enthält das Tetragramm. „Yahweh“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung von לְהַכְעִיסוֹ zum vorausgehenden bösen Tun
  choice: und ihn so zum Zorn reiztet
  alternative: um ihn zum Zorn zu reizen
  rationale: Der hebräische Infinitiv kann Zweck oder Folge ausdrücken. Die gewählte Formulierung bewahrt diese Spannung und behauptet nicht zwingend, dass Israels ausdrückliche Absicht darin bestand, Yahweh zu erzürnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit nach der Zeitangabe geteilt. Die konkrete Fastenformel „kein Brot … kein Wasser“ und das Bild „in den Augen Yahwehs“ bleiben erhalten.
