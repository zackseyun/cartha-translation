source:
  edition: WLC
  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: de
  text: 'ein großes und hochgewachsenes Volk, die Söhne Enaks[a], die du kennst und von denen du gehört hast: »Wer kann vor den Söhnen Enaks bestehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Enakiter«. Wörtlich: »die Söhne Enaks«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: Volk
  rationale: עַם bezeichnet hier eine Volksgruppe; »Volk« ist die natürliche und kontextgerechte deutsche Entsprechung.
- source_word: גָּדוֹל וָרָם
  choice: groß und hochgewachsen
  rationale: גָּדוֹל beschreibt Größe, während רָם in diesem Zusammenhang auf die körperliche Höhe verweist. »Hochgewachsen« macht die gemeinte Körpergröße im modernen Deutsch eindeutig.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: die Söhne Enaks
  rationale: Die wörtliche Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten. Der Eigenname עֲנָק wird entsprechend der im Deutschen etablierten biblischen Form als »Enak« wiedergegeben.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: die du kennst
  rationale: Die knappe Form gibt das hebräische Perfekt natürlich wieder und bezeichnet eine Israel bereits bekannte Volksgruppe.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: und von denen du gehört hast
  rationale: Die Ergänzung »von denen« ist im Deutschen idiomatisch und verbindet die Aussage klar mit dem folgenden bekannten Ausspruch.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Wer kann vor ... bestehen?
  rationale: Die Wendung bezeichnet das Standhalten gegenüber einem Gegner. »Vor ... bestehen« bewahrt das Bild und gibt die rhetorische Kraft natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; »hochgewachsen« verdeutlicht den körperlichen Bezug von רָם.
