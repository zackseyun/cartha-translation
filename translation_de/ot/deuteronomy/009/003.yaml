  rationale: Die Revision entfernt die nicht ausdrücklich im Vers genannte Ergänzung „Landes“, glättet zwei deutsche Formulierungen und erhält zugleich die semantische Differenzierung der hebräischen Verben sowie alle Fußnotenanker. Die Fußnoten dokumentieren die relevanten lexikalischen Alternativen, ohne eine strittige Auslegung festzuschreiben.
