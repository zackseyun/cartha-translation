review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge des hebräischen Textes und die starken Prädikate im Wesentlichen zutreffend wieder. „ihres Landes berauben“ legt jedoch mit „Land“ ein im Vers nicht ausdrücklich genanntes Objekt fest. Das Hifil von ירשׁ beschreibt hier Israels Besitzergreifung zu Lasten der bisherigen Bewohner und lässt sich im Deutschen ohne diese explizite Ergänzung treffender mit „vertreiben“ wiedergeben. „vor dir hinüberzieht“ ist zudem im modernen Deutschen weniger idiomatisch und kann missverständlich wirken, als ziehe Jahwe an Israel vorbei.
  naturalness: „Erkenne heute“ und „vor dir herzieht“ sind klares, würdiges modernes Standarddeutsch. „Vor dir niederwerfen“ gibt die militärische Bedeutung von יכניעם natürlicher wieder als die syntaktisch etwas harte Verbindung „sie vor dir unterwerfen“.
  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe des Gottesnamens. „Verzehrendes Feuer“, „vernichten“, „niederwerfen“, „vertreiben“ und „zugrunde richten“ erhalten die unterschiedlichen hebräischen Aussagen, ohne die historische Gewaltdarstellung abzuschwächen oder zusätzlich auszudeuten.
  issues:
  - severity: medium
    issue: „Du wirst sie ihres Landes berauben“ ergänzt „Landes“ als explizites Objekt.
    rationale: Der hebräische Text hat lediglich das Objekt „sie“. Der territoriale Zusammenhang ist zwar gegeben, doch die Ergänzung schränkt die Formulierung stärker ein als nötig. „Du wirst sie vertreiben“ gibt die im Kontext einschlägige Bedeutung wieder und bewahrt die Knappheit des Ausgangstextes.
  - severity: low
    issue: „vor dir hinüberzieht“ ist idiomatisch und semantisch potenziell missverständlich.
    rationale: Die deutsche Wendung kann ein Vorbeiziehen an der angeredeten Person nahelegen. „vor dir herzieht“ drückt die vorangehende Bewegung klar aus; die Fußnote kann die wörtlichere Nuance des Hinüberziehens dokumentieren.
  - severity: low
    issue: „sie vor dir unterwerfen“ ist im Deutschen stilistisch schwerfällig.
    rationale: „sie vor dir niederwerfen“ bewahrt die räumlich-militärische Aussage von לפני und die Bezwingung durch כנע in natürlicher Form.
