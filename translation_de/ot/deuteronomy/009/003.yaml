source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: de
  text: 'Erkenne heute: Jahwe, dein Gott, ist es, der vor dir herzieht[a] – ein verzehrendes Feuer[b]. Er wird sie vernichten und sie vor dir niederwerfen. Du wirst sie vertreiben[c] und sie rasch zugrunde richten, so wie Jahwe zu dir gesprochen hat[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vor dir hinüberzieht“. Das hebräische Partizip bezeichnet Jahwe wörtlich als den, der Israel voraus hinüberzieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein verschlingendes Feuer“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Du wirst sie ihres Besitzes berauben“. Das hebräische Verb kann die Vertreibung ebenso wie den damit verbundenen Verlust des Besitzes bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „wie Jahwe zu dir sprach“. Gemeint ist, dass dies entsprechend seinem vorausgegangenen Wort an Israel geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: So erkenne heute
  rationale: Die Formulierung gibt den folgernden Zusammenhang mit dem vorherigen Vers wieder und bewahrt zugleich den nachdrücklichen Aufruf, sich diese Wahrheit jetzt bewusst zu machen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Charakter des Tetragramms als Name und ersetzt ihn nicht durch einen Titel.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: ist es, der vor dir hinüberzieht
  rationale: Das Partizip schildert Jahwe anschaulich als den, der Israel voraus über die Grenze in das Land zieht; „hinüberzieht“ erhält den konkreten Bezug von עבר.
- source_word: אֵשׁ אֹכְלָה
  choice: ein verzehrendes Feuer
  rationale: Die feste und würdevolle deutsche Wendung bewahrt das Bild von Gottes zerstörender heiliger Gegenwart, ohne es erklärend aufzulösen.
- source_word: יַשְׁמִידֵם
  choice: Er wird sie vernichten
  rationale: „Vernichten“ gibt die starke kausative Bedeutung von שׁמד wieder, ohne einen modernen technischen Begriff einzuführen.
- source_word: יַכְנִיעֵם
  choice: sie vor dir unterwerfen
  rationale: Im militärischen Zusammenhang bezeichnet כנע das Niederzwingen der Völker; „unterwerfen“ trifft diesen äußeren Vorgang besser als „demütigen“.
- source_word: וְהוֹרַשְׁתָּם
  choice: Du wirst sie ihres Landes berauben
  rationale: 'Die Formulierung bringt die territorial-rechtliche Seite des Hiphil von ירשׁ zum Ausdruck: Die bisherigen Bewohner verlieren ihren Besitz am Land. „Landes“ wird aus dem unmittelbaren Kontext ergänzt.'
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: und sie rasch zugrunde richten
  rationale: „Zugrunde richten“ wahrt die kausative Bedeutung des Hiphil von אבד und unterscheidet das Verb sprachlich vom vorherigen שׁמד; „rasch“ gibt מַהֵר unverändert wieder.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: so wie Jahwe zu dir gesprochen hat
  rationale: Die Übersetzung verweist auf Jahwes vorausgegangenes Wort, ohne es enger als ausdrückliches Versprechen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die deutsche Form entspricht der etablierten Schreibweise.
- issue: Bild des göttlichen Kriegers in אֵשׁ אֹכְלָה
  choice: ein verzehrendes Feuer
  alternative: ein fressendes Feuer
  rationale: Das starke Bild von Gottes heiliger und zerstörender Gegenwart wird weder abgeschwächt noch dogmatisch ausgedeutet.
- issue: Zusammenspiel von göttlichem und menschlichem Handeln
  choice: Gott vernichtet und unterwirft; Israel beraubt und richtet zugrunde
  alternative: Alle Handlungen Gott oder Israel allein zuzuschreiben
  rationale: Der hebräische Text stellt Gottes vorausgehendes Handeln und Israels daraus folgendes Handeln unmittelbar nebeneinander. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die konkreten Kriegs- und Gerichtsbegriffe werden nicht beschönigt. Der Gedankenstrich markiert die appositionelle Bildaussage „ein verzehrendes Feuer“, ohne ein zusätzliches Verb in den hebräischen Text einzutragen.
