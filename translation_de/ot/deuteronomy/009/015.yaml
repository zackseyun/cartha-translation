  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: de
  text: Da wandte ich mich um und stieg vom Berg hinab, während der Berg in Flammen stand[a], und die beiden Tafeln des Bundes hielt ich in meinen beiden Händen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und der Berg stand in Flammen“. Die hebräische Konjunktion kann eine einfache Verbindung ausdrücken; im Zusammenhang ist auch die umstandsbezogene Wiedergabe mit „während“ möglich.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „auf meinen beiden Händen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Da wandte ich mich um
  rationale: פנה bezeichnet hier in der fortlaufenden Erzählung das Sichumwenden. „Da“ gibt die Handlungsfolge im modernen Deutschen natürlich wieder.
- source_word: וָאֵרֵד מִן הָהָר
  choice: und stieg vom Berg hinab
  rationale: ירד bedeutet „hinabsteigen/hinabgehen“; der bestimmte Berg ist aus dem Zusammenhang eindeutig.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: während der Berg im Feuer brannte
  rationale: Die Wendung beschreibt einen gleichzeitig bestehenden Umstand. „Im Feuer brannte“ bewahrt die ausdrückliche Nennung des Feuers; die mögliche rein koordinierende Lesart der Konjunktion wird in der Fußnote erhalten.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: und die beiden Tafeln des Bundes
  rationale: לֻחֹת sind hier die steinernen Tafeln; הַבְּרִית bezeichnet den Bund. Die Genitivverbindung ist im Deutschen klar und traditionsübergreifend.
- source_word: עַל שְׁתֵּי יָדָי
  choice: hielt ich in meinen beiden Händen
  rationale: עַל heißt wörtlich „auf/über“, bezeichnet hier aber idiomatisch das Tragen der Tafeln mit den Händen. Die ausdrückliche Zweizahl des Hebräischen bleibt erhalten.
