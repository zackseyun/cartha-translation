  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: de
  text: Und nach Ablauf von vierzig Tagen und vierzig Nächten gab mir Jahwe die beiden Steintafeln, die Tafeln des Bundes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und
  rationale: Die Form leitet den nächsten Erzählabschnitt ein. Im Deutschen gibt „Und“ zusammen mit der folgenden Zeitangabe diese Funktion natürlich wieder, ohne das schwerfällige „Und es geschah“.
- source_word: מִקֵּץ
  choice: nach Ablauf von
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem der genannte Zeitraum vollständig verstrichen ist. „Nach Ablauf von“ ist im modernen Deutschen präzise und idiomatisch.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: vierzig Tagen und vierzig Nächten
  rationale: Die feste hebräische Zeitangabe wird vollständig und unmittelbar wiedergegeben.
- source_word: נָתַן
  choice: gab
  rationale: Das gewöhnliche Verb „geben“ entspricht hier dem schlichten Sinn, ohne zusätzliche Vorstellungen wie Übergabe oder Aushändigung einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֵלַי
  choice: mir
  rationale: Bei „geben“ wird das hebräische Ziel sprachgerecht als deutsches Dativobjekt ausgedrückt.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: die beiden Steintafeln
  rationale: „Die beiden“ gibt das bestimmte Paar wieder; „Steintafeln“ bezeichnet knapp und verständlich Tafeln aus Stein.
- source_word: לֻחוֹת הַבְּרִית
  choice: die Tafeln des Bundes
  rationale: Die appositionelle Wiederholung von „Tafeln“ bleibt erhalten und hebt ihre Bedeutung für den Bund hervor.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel „Herr“, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Erzählgang, während „nach Ablauf von“ und das Dativobjekt „mir“ natürliches Deutsch gewährleisten. Die im englischen Beratungstext angebotene Fußnote „Oder: Jahwe gab mir“ wurde nicht übernommen, weil sie an der markierten Stelle keine erkennbare, durch den hebräischen Wortlaut gestützte alternative Lesart darstellt.'
