  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: de
  text: Seit dem Tag, an dem ich euch kenne, habt ihr euch Jahwe widersetzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „mit Jahwe“; in dieser Verbindung bezeichnet die Wendung Widerstand gegen ihn.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: habt ihr euch … widersetzt
  rationale: Das Wort aus der Wurzel מרה bezeichnet Auflehnung und Widerstand gegen Autorität. Die verbale Formulierung klingt im modernen Deutsch natürlich und bewahrt den fortdauernden Vorwurf.
- source_word: הֱיִיתֶם
  choice: habt ihr euch … widersetzt
  rationale: Das Qal Perfekt 2. Person Plural von היה bildet mit מַמְרִים eine rückblickende Zustandsaussage. Das deutsche Perfekt gibt diesen bis zur Redesituation reichenden Rückblick idiomatisch wieder.
- source_word: עִם
  choice: Jahwe widersetzt
  rationale: עִם bedeutet gewöhnlich „mit“, bezeichnet hier in Verbindung mit מרה jedoch die Person, der Widerstand entgegengebracht wird. Der deutsche Dativ bei „sich widersetzen“ drückt diese Beziehung natürlich aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִיּוֹם
  choice: Seit dem Tag
  rationale: Die Wendung bezeichnet den Ausgangspunkt eines bis in die Gegenwart reichenden Verhaltens; „seit dem Tag“ ist im Deutschen präzise und idiomatisch.
- source_word: דַּעְתִּי
  choice: an dem ich euch kenne
  rationale: Das Qal Perfekt 1. Person Singular von ידע bezeichnet hier Moses’ Bekanntschaft beziehungsweise Beziehung mit Israel. Im deutschen seit-Satz steht dafür idiomatisch das Präsens.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Die Akkusativpartikel mit dem Suffix der 2. Person Plural wird als direktes Objekt von „kennen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עִם bei מרה
  choice: sich Jahwe widersetzen
  alternative: mit Jahwe widerspenstig sein
  rationale: Obwohl עִם wörtlich „mit“ lautet, kennzeichnet die Verbindung hier Widerstand gegen Jahwe. Die gewählte Fassung gibt diese adversative Beziehung verständlich wieder; die formale Besonderheit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt den langen Zeitraum des Vorwurfs hervor. „Sich widersetzen“ vermeidet unnötig abstraktes oder altertümliches Vokabular und gibt den Gedanken der Auflehnung klar wieder.
