base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: de
  text: Und Jahwe gab mir die beiden Steintafeln, beschrieben mit dem Finger Gottes, und auf ihnen standen alle Worte, die Jahwe am Tag der Versammlung auf dem Berg aus der Mitte des Feuers zu euch gesprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Die schlichte und genaue deutsche Entsprechung von נתן in diesem Zusammenhang.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: die beiden Steintafeln
  rationale: Natürliches modernes Deutsch; der bestimmte Ausdruck bezeichnet die zwei bereits bekannten Tafeln.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: beschrieben mit dem Finger Gottes
  rationale: Bewahrt sowohl das passive Partizip als auch das konkrete anthropomorphe Bild und gibt das instrumentale בְּ mit „mit“ wieder.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: und auf ihnen standen all die Worte
  rationale: Ergänzt für natürliches Deutsch ein Verb, ohne mehr als die Aussage des hebräischen Nominalsatzes einzutragen; כְּ bezeichnet hier die inhaltliche Entsprechung bzw. Gesamtheit.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: die Jahwe … zu euch gesprochen hatte
  rationale: „Zu euch sprechen“ ist im Deutschen die natürliche Wiedergabe des Sprechens an die versammelten Israeliten; das Plusquamperfekt markiert die Vorzeitigkeit gegenüber der Übergabe.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: mitten aus dem Feuer
  rationale: Gibt die räumliche Präzision von מִתּוֹךְ idiomatisch und anschaulich wieder.
- source_word: בְּיוֹם הַקָּהָל
  choice: am Tag der Versammlung
  rationale: Bewahrt die knappe substantivische Form und den gemeinschaftlichen Sinn von קהל.
theological_decisions:
- issue: Anthropomorphe Beschreibung göttlichen Handelns
  choice: mit dem Finger Gottes
  alternative: durch Gottes Macht / von Gott selbst
  rationale: Der konkrete Ausdruck des Hebräischen wird nicht deutend aufgelöst, sodass Bildkraft und theologische Spannung erhalten bleiben.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen etablierte Form.
- issue: עִם beim Verb „sprechen“
  choice: zu euch gesprochen
  alternative: mit euch gesprochen
  rationale: Obwohl עִם wörtlich „mit“ bedeutet, beschreibt der Kontext Gottes Verkündigung an das versammelte Volk. „Zu euch gesprochen“ ist daher natürlich und sachlich passend, ohne einen Dialog zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Das anschauliche Gottesbild bleibt ungemildert; „mitten aus dem Feuer“ und „Tag der Versammlung“ bewahren den feierlichen Charakter des Ausgangstextes.
