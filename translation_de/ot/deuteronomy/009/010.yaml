- from: Und Jahwe gab mir die beiden Steintafeln, beschrieben mit dem Finger Gottes, und auf ihnen standen all die Worte, die Jahwe auf dem Berg mitten aus dem Feuer zu euch gesprochen hatte, am Tag der Versammlung.
  to: Und Jahwe gab mir die beiden Steintafeln, beschrieben mit dem Finger Gottes, und auf ihnen standen alle Worte, die Jahwe am Tag der Versammlung auf dem Berg aus der Mitte des Feuers zu euch gesprochen hatte.
  rationale: Die Revision ordnet die Angaben zur Rede syntaktisch klarer und schärft die Wiedergabe von מִתּוֹךְ („aus der Mitte“), ohne die Aussage, den Registerton oder die theologische Bildsprache zu verändern. Es sind keine Fußnoten erforderlich.
