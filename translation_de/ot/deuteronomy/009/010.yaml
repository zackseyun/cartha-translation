    issue: Nachgestellte Zeitangabe
    rationale: „Am Tag der Versammlung“ sollte näher bei „gesprochen hatte“ stehen, damit eindeutig bleibt, dass es den Zeitpunkt der göttlichen Rede bezeichnet.
  - severity: low
    issue: Wiedergabe von מִתּוֹךְ הָאֵשׁ
    rationale: „Aus der Mitte des Feuers“ bewahrt die ausdrücklich im Hebräischen benannte Lokalisierung besser als das etwas umgangssprachlichere „mitten aus dem Feuer“.
  revised_text: Und Jahwe gab mir die beiden Steintafeln, beschrieben mit dem Finger Gottes, und auf ihnen standen alle Worte, die Jahwe am Tag der Versammlung auf dem Berg aus der Mitte des Feuers zu euch gesprochen hatte.
