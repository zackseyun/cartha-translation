source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: de
  text: 'Und der HERR sagte zu mir: »Steh auf und geh schnell von hier hinab! Denn dein Volk, das du aus Ägypten herausgeführt hast, hat sich verdorben. Schnell sind sie von dem Weg abgewichen, den ich ihnen geboten habe. Sie haben sich ein gegossenes Bild[a] gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein Bild, das aus Metall gegossen wurde.
    reason: Erläutert die konkrete Bedeutung und das Herstellungsverfahren des Kultbildes.
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens in Kapitälchen wahrt dessen besondere Funktion, ohne eine unsichere Aussprache in den Text einzutragen.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Steh auf und geh schnell von hier hinab
  rationale: Gibt die beiden Imperative, die Dringlichkeit und die räumliche Abwärtsbewegung natürlich und vollständig wieder.
- source_word: שִׁחֵת
  choice: hat sich verdorben
  rationale: Bewahrt die starke Aussage moralischer und religiöser Verderbnis; die reflexive Formulierung passt zum intransitiv-reflexiven Sinn im Kontext.
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: dein Volk, das du aus Ägypten herausgeführt hast
  rationale: Erhält die auffällige Anrede an Mose und damit die rhetorische Distanzierung im göttlichen Tadel.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Schnell sind sie von dem Weg abgewichen
  rationale: Bewahrt die Wiederholung von מַהֵר und das Weg-Motiv als Bild für das Abweichen vom gebotenen Verhalten.
- source_word: מַסֵּכָה
  choice: ein gegossenes Bild
  rationale: Bezeichnet konkret ein durch Metallguss hergestelltes Kultbild, ohne den Gegenstand lediglich allgemein als Götzen zu benennen.
theological_decisions:
- issue: Rhetorische Distanzierung in »dein Volk, das du aus Ägypten herausgeführt hast«
  choice: Die Formulierung wird wörtlich in ihrer Zuordnung zu Mose bewahrt.
  alternative: 'Neutralisierend: »das Volk, das ich aus Ägypten geführt habe« oder schlicht »das Volk Israel«'
  rationale: Der hebräische Wortlaut konfrontiert Mose bewusst mit »dein Volk« und »du hast herausgeführt«. Diese Spannung darf nicht harmonisiert werden.
- issue: Bezeichnung des Kultbildes מַסֵּכָה
  choice: gegossenes Bild
  alternative: Götze; gegossener Götze; geschmolzenes Bild
  rationale: Der Ausgangstext hebt das Herstellungsverfahren und die konkrete Gestalt hervor. »Bild« vermeidet eine interpretative Verallgemeinerung, während die Fußnote den metallischen Guss erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erhalten die Dringlichkeit der Rede. »hinabgehen« bewahrt die räumliche Perspektive; »geboten« und »der Weg« erhalten den biblisch-rechtlichen Klang, bleiben aber allgemein verständlich.
