  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: de
  text: Und eure Sünde, das Kalb, das ihr gemacht hattet, nahm ich, verbrannte es im Feuer und zerschlug es; ich zermahlte es gründlich, bis es fein wie Staub war. Dann warf ich seinen Staub in den Bach[a], der vom Berg herabfließt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann einen Bach oder Wasserlauf, aber auch ein Wildbachtal beziehungsweise ein zeitweise trockenes Bachbett bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: eure Sünde
  rationale: Bewahrt die scharfe hebräische Gleichsetzung des Kalbes mit Israels Sünde, statt sie zu „sündiges Gebilde“ abzuschwächen.
- source_word: הָעֵגֶל
  choice: das Kalb
  rationale: Die übliche und im Kontext des goldenen Kalbes eindeutige Wiedergabe.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: verbrannte es im Feuer
  rationale: Gibt die konkrete hebräische Wendung natürlich und genau wieder.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: zerschlug es; ich zermahlte es gründlich
  rationale: Die Kombination gibt sowohl das Schlagen beziehungsweise Zerkleinern als auch den ausdrücklich genannten Mahlvorgang und dessen Intensität wieder.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: bis es fein wie Staub war
  rationale: Drückt den erreichten Feinheitsgrad aus und bewahrt den Bezug auf Staub.
- source_word: עֲפָרוֹ
  choice: seinen Staub
  rationale: Nimmt die Bezeichnung „Staub“ aus dem vorigen Satz auf und legt die Überreste nicht unnötig auf Asche fest.
- source_word: הַנַּחַל
  choice: den Bach
  rationale: Eine verständliche deutsche Wiedergabe; das hebräische Wort kann je nach Gelände und Jahreszeit auch einen Wasserlauf, ein Wildbachtal oder ein trockenes Bachbett bezeichnen.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: der vom Berg herabfließt
  rationale: Gibt die fortdauernde, beschreibende Aussage des Partizips im Deutschen natürlich wieder.
theological_decisions:
- issue: Gleichsetzung des Kalbes mit „eurer Sünde“
  choice: eure Sünde, das Kalb, das ihr gemacht hattet
  alternative: euer sündiges Gebilde, das Kalb, das ihr gemacht hattet
  rationale: Die Apposition im Hebräischen identifiziert das Götzenbild in bewusst scharfer Form mit Israels Sünde. Diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Abfolge der energischen Handlungen bleibt deutlich; „gemacht hattet“ markiert natürlich die Vorzeitigkeit. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Begriff.
