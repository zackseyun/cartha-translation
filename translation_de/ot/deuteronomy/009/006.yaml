  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: de
  text: 'So erkenne: Nicht wegen deiner Gerechtigkeit gibt dir Jahwe, dein Gott, dieses gute Land, damit du es in Besitz nimmst[a]; denn du bist ein halsstarriges Volk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit du es als Erbe empfängst«. Das hebräische Verb kann das Empfangen eines Erbes bezeichnen, schließt im Deuteronomium aber häufig das Inbesitznehmen des Landes ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: So erkenne
  rationale: Das Qal Perfekt 2. Person Singular dient hier als nachdrückliche Aufforderung. „So“ gibt den folgernden Anschluss an die vorausgehende Argumentation natürlich wieder.
- source_word: לֹא בְצִדְקָתְךָ
  choice: nicht wegen deiner Gerechtigkeit
  rationale: ב bezeichnet hier den Grund beziehungsweise die Grundlage. Die Formulierung verneint ausdrücklich, dass Israels eigene Gerechtigkeit der Grund für die Landgabe ist.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das Suffix der 2. Person Singular wahrt die an Israel als Einheit gerichtete Bundesanrede.
- source_word: נֹתֵן לְךָ
  choice: gibt dir
  rationale: Das Partizip bezeichnet im Kontext die unmittelbar bevorstehende beziehungsweise bereits wirksame Gabe. Das deutsche Präsens ist dafür natürlich und prägnant.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: dieses gute Land
  rationale: Bewahrt Demonstrativ und Wertung des hebräischen Ausdrucks; „Land“ entspricht dem Kontext der Landverheißung.
- source_word: לְרִשְׁתָּהּ
  choice: damit du es in Besitz nimmst
  rationale: ירשׁ bezeichnet im Deuteronomium häufig das Erlangen und Halten des verheißenen Landes. Die Formulierung bewahrt den aktiven Besitzergreifungsaspekt; die mögliche Erbbedeutung wird in der Fußnote genannt.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: ein halsstarriges Volk
  rationale: „Halsstarrig“ ist eine natürliche deutsche Entsprechung, die das hebräische Körperbild für hartnäckigen Widerstand bewahrt.
theological_decisions:
- issue: Grund für Israels Empfang des Landes
  choice: Israels eigene Gerechtigkeit wird ausdrücklich als Grundlage der Landgabe verneint.
  alternative: Die Aussage lediglich als allgemeine Mahnung zur Demut wiederzugeben.
  rationale: Der hebräische Text stellt Gottes Gabe direkt Israels fehlendem Anspruch und seiner Halsstarrigkeit gegenüber, ohne hier eine darüber hinausgehende Lehrformel auszuarbeiten.
- issue: Korporative Anrede im Singular
  choice: Israel wird mit „du/dein“ als kollektive Einheit angeredet und zugleich als „Volk“ bezeichnet.
  alternative: Die Anrede als ausdrücklichen Plural („ihr/euer“) wiederzugeben.
  rationale: So bleibt der markante hebräische Singular erhalten und ist im Deutschen dennoch verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt wie im Hebräischen hervor, dass nicht Israels Gerechtigkeit der Grund für die Landgabe ist. Das Bild „halsstarrig“ bleibt erhalten; archaischere Formen wie „verstockten Nackens“ werden vermieden.
