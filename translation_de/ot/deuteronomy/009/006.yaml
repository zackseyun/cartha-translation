  terminology: „Gerechtigkeit“, „Jahwe“, „Land“, „in Besitz nehmen“ und „halsstarriges Volk“ sind treffend und konsistent mit dem hebräischen Kontext. „Halsstarrig“ bewahrt das Bild von קְשֵׁה־עֹרֶף, ohne unnötig archaisch zu wirken.
