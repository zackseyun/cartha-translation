  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die auffordernde Aussage „erkenne“, die Verneinung der eigenen Gerechtigkeit als Grundlage, Jahwe als handelndes Subjekt, das gute Land, den Zweck des Besitzergreifens und die Begründung durch Israels Halsstarrigkeit. Die kollektive Singularanrede bleibt gewahrt. „Damit du es in Besitz nimmst“ gibt לְרִשְׁתָּהּ idiomatisch wieder und wird durch die Fußnote sachgerecht ergänzt.'
