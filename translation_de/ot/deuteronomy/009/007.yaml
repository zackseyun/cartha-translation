source:
  edition: WLC
  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: de
  text: Denk daran – vergiss nicht –, wie du Jahwe, deinen Gott, in der Wüste zum Zorn gereizt hast.[a] Von dem Tag an, an dem du aus dem Land Ägypten gezogen bist, bis zu eurer Ankunft an diesem Ort habt ihr euch Jahwe widersetzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie du Jahwe, deinen Gott, in der Wüste zornig gemacht hast.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier „mit Jahwe“; im Zusammenhang ist der Sinn gegensätzlich: „gegen Jahwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Denk daran – vergiss nicht –
  rationale: Die beiden aufeinanderfolgenden Aufforderungen werden bewahrt, weil ihre Wiederholung die Mahnung nachdrücklich verstärkt.
- source_word: אֵת אֲשֶׁר הִקְצַפְתָּ
  choice: wie du … zum Zorn gereizt hast
  rationale: Die Formulierung gibt sowohl den Inhalt des Erinnerns als auch die kausative Bedeutung des Hifil von קצף wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die natürliche und traditionsgeschichtlich passende Bezeichnung für den unbesiedelten Wüstenraum der Exoduszeit.
- source_word: יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: du aus Ägypten gezogen bist
  rationale: „Aus Ägypten ziehen“ ist die natürliche deutsche Wiedergabe der Exodusformel; „Land“ muss im Deutschen nicht eigens ergänzt werden.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: bis zu eurer Ankunft an diesem Ort
  rationale: Die Nominalformulierung bewahrt den Wechsel vom Singular zum Plural, ohne im Deutschen schwerfällig zu wirken.
- source_word: מַמְרִים הֱיִיתֶם
  choice: habt ihr euch … widersetzt
  rationale: מרה bezeichnet trotzigen Widerstand beziehungsweise Auflehnung gegen Autorität. Das deutsche Perfekt stellt das über den genannten Zeitraum andauernde Verhalten natürlich dar.
- source_word: עִם יְהוָה
  choice: Jahwe widersetzt
  rationale: עִם bedeutet wörtlich „mit“, hat nach מרה hier aber adversativen Sinn; die deutsche Verbfügung „sich jemandem widersetzen“ drückt diesen Zusammenhang idiomatisch aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis Israels zu Jahwe in עִם יְהוָה
  choice: ihr habt euch Jahwe widersetzt
  alternative: ihr seid widerspenstig mit Jahwe gewesen
  rationale: Die Präposition ist formal „mit“, bezeichnet im Zusammenhang mit מרה jedoch eine feindliche Gegenposition. Die Fußnote hält die formale Lesart sichtbar.
- issue: Numeruswechsel innerhalb des Verses
  choice: du … eurer … ihr
  alternative: durchgehend ihr/euch
  rationale: Der Wechsel vom Singular zur Pluralform ist im masoretischen Text vorhanden und wird bewahrt, ohne ihn theologisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Doppelmahnung und der hebräische Wechsel vom angesprochenen Einzelnen zum Volk im Plural bleiben erhalten. „Zum Zorn reizen“ wahrt die Stärke des hebräischen Kausativs; „sich widersetzen“ ist für die Schlussaussage natürlich und präzise.
