source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: de
  text: Denk an deine Diener – an Abraham, Isaak und Jakob. Achte nicht auf[a] den Starrsinn[b] dieses Volkes, auf seine Bosheit und auf seine Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wende dich nicht … zu“; auch möglich: „Sieh nicht auf“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet „Härte“ oder „Starrsinn“; hier steht nicht die andernorts verwendete Wendung „steifnackig“.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Imperativ richtet sich in Moses Fürbitte an Gott. „An jemanden denken“ gibt זכר in diesem Gebetszusammenhang natürlich und verständlich wieder.
- source_word: לַעֲבָדֶיךָ
  choice: deine Diener
  rationale: עבד kann „Diener“ oder „Sklave“ bezeichnen. Hier ist es eine ehrende Bezeichnung für die Erzväter in ihrer Beziehung zu Gott; „Diener“ passt daher zum Kontext.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: an Abraham, Isaak und Jakob
  rationale: Die Namen folgen den üblichen deutschen Namensformen. Der Gedankenstrich mit wiederholtem „an“ macht deutlich, dass die Namen die zuvor genannten Diener näher bestimmen.
- source_word: אַל תֵּפֶן אֶל
  choice: Achte nicht auf
  rationale: פנה אל bedeutet wörtlich, sich etwas zuzuwenden, und bezeichnet hier, diesem Beachtung zu schenken. „Achte nicht auf“ ist im Deutschen natürlich und wahrt den Sinn der Bitte.
- source_word: קְשִׁי
  choice: Starrsinn
  rationale: Das Substantiv bezeichnet Härte beziehungsweise hartnäckige Widersetzlichkeit. „Starrsinn“ vermittelt den moralischen Sinn, ohne die an anderer Stelle verwendete Metapher vom steifen Nacken einzutragen.
- source_word: הָעָם הַזֶּה
  choice: dieses Volkes
  rationale: עם bezeichnet hier das Volk als Gemeinschaft. Die Genitivform ergibt sich aus der natürlichen deutschen Satzfügung.
- source_word: רִשְׁעוֹ
  choice: seine Bosheit
  rationale: Das singularische Suffix bezieht sich auf das kollektiv gebrauchte „Volk“. „Bosheit“ gibt den moralischen Unrechtscharakter von רשע wieder.
- source_word: חַטָּאתוֹ
  choice: seine Sünde
  rationale: Das singularische Suffix stimmt mit dem kollektiv gebrauchten „Volk“ überein. „Sünde“ bewahrt die konkrete moralisch-religiöse Bedeutung von חטאת.
theological_decisions:
- issue: Bedeutung von עבד als Bezeichnung der Erzväter
  choice: deine Diener
  alternative: deine Sklaven
  rationale: Im Fürbittegebet dient der Ausdruck als ehrende Bezeichnung der Zugehörigkeit und Treue zu Gott; ein rechtlicher oder sozialer Sklavenstatus steht nicht im Vordergrund.
- issue: Bitte an Gott, den Starrsinn und die Sünde des Volkes nicht zu beachten
  choice: Achte nicht auf
  alternative: Wende dich nicht … zu / Sieh nicht auf
  rationale: Die Formulierung bewahrt den Charakter einer Fürbitte, ohne näher festzulegen, auf welche Weise Gott die Schuld nicht berücksichtigen soll.
- issue: Singularische Rückbezüge auf das kollektiv gebrauchte Volk
  choice: seine Bosheit … seine Sünde
  alternative: ihre Bosheit … ihre Sünde
  rationale: Im Deutschen ist „das Volk … seine“ grammatisch klar und folgt zugleich der singularischen Form des Hebräischen; daraus wird keine Aussage über individuelle oder kollektive Schuld abgeleitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Bitte bleibt knapp und eindringlich. Der Gedankenstrich kennzeichnet Abraham, Isaak und Jakob eindeutig als Apposition zu „deine Diener“; die dreifache Reihe „auf … auf … und auf“ bildet die hebräische Aufzählung gut lesbar nach.
