base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: de
  text: 'Sag nicht in deinem Herzen, wenn Jahwe, dein Gott, sie vor dir vertreibt: »Wegen meiner Gerechtigkeit hat Jahwe mich hineingebracht, damit ich dieses Land in Besitz nehme«, während Jahwe sie wegen der Bosheit dieser Völker vor dir vertreibt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: Sag nicht in deinem Herzen
  rationale: אַל mit Imperfekt formuliert ein Verbot. Die hebräische Herz-Metapher bezeichnet das innere Denken und bleibt auch im Deutschen verständlich.
- source_word: בַּהֲדֹף יְהוָה אֱלֹהֶיךָ אֹתָם מִלְּפָנֶיךָ
  choice: wenn Jahwe, dein Gott, sie vor dir vertreibt
  rationale: בְּ mit Infinitiv bezeichnet hier den zeitlichen Umstand; נדף bedeutet wegtreiben oder vertreiben. Die deutsche Satzstellung macht den zeitlichen Zusammenhang natürlich deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּצִדְקָתִי
  choice: Weil ich gerecht bin
  rationale: Die Wendung drückt die vermeintliche eigene Gerechtigkeit als Ursache aus. Die adjektivische Form ist im modernen Deutsch natürlicher als »wegen meiner Gerechtigkeit«, ohne den Gedanken moralischen Verdienstes abzuschwächen.
- source_word: הֱבִיאַנִי יְהוָה
  choice: hat Jahwe mich hierhergebracht
  rationale: Der Hifil von בוא bedeutet »hineinbringen«. »Hierhergebracht« macht im Landnahme-Kontext das Ziel idiomatisch deutlich.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: damit ich dieses Land in Besitz nehme
  rationale: ירשׁ bezeichnet hier das Inbesitznehmen des Landes. Der Finalsatz gibt לְ mit Infinitiv natürlich wieder.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Vielmehr ... wegen ihrer Bosheit
  rationale: Das Waw steht im inhaltlichen Gegensatz zur falschen Behauptung Israels. »Vielmehr« bringt die Korrektur klar zum Ausdruck; רִשְׁעָה wird mit »Bosheit« wiedergegeben.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: vertreibt ... vor dir
  rationale: Der Hifil von ירשׁ bedeutet hier »aus ihrem Besitz verdrängen/vertreiben«. Die Wiederholung von »vertreibt« ist im Deutschen klar und wahrt den sachlichen Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. »Jahwe« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Behauptung, Israel habe das Land aufgrund eigener Gerechtigkeit erhalten
  choice: »Weil ich gerecht bin« als ausdrücklich zurückgewiesene innere Behauptung
  alternative: »Wegen meiner Gerechtigkeit«
  rationale: Die Übersetzung bewahrt den Gedanken vermeintlichen moralischen Verdienstes. Durch die Anführungszeichen und »Vielmehr« bleibt klar, dass Mose diese Selbstdeutung zurückweist.
- issue: Verhältnis zwischen Israels Gerechtigkeit und der Bosheit der Völker
  choice: kontrastive Korrektur mit »Vielmehr«
  alternative: bloße Beiordnung mit »und«
  rationale: Der Vers stellt die Bosheit der Völker der falschen Selbstrechtfertigung Israels gegenüber. Die Übersetzung macht diesen Gegensatz sichtbar, ohne über die im Text genannte Begründung hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herz-Metapher und der Begriff der Gerechtigkeit bleiben erhalten; die verschachtelte hebräische Satzstruktur wird für gute Verständlichkeit maßvoll geordnet.
