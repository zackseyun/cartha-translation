base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: de
  text: 'Als Jahwe euch von Kadesch-Barnea aussandte und sagte: »Zieht hinauf und nehmt das Land in Besitz, das ich euch gegeben habe!«, da widersetztet ihr euch dem Befehl Jahwes, eures Gottes,[a] und ihr glaubtet ihm nicht[b] und hörtet nicht auf seine Stimme.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dem Mund Jahwes, eures Gottes«; gemeint ist sein Befehl oder sein Wort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihr vertrautet ihm nicht«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »ihr gehorchtet ihm nicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: Als … aussandte
  rationale: Die Präposition mit dem Infinitiv constructus bezeichnet hier einen zeitlichen Umstand. „Als … aussandte“ gibt dies in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: von Kadesch-Barnea
  rationale: Der Ortsname wird in der im Deutschen geläufigen Form transliteriert.
- source_word: עֲלוּ וּרְשׁוּ
  choice: Zieht hinauf und nehmt … in Besitz
  rationale: „Zieht hinauf“ bewahrt die Bewegungsrichtung von עלה; „in Besitz nehmen“ gibt ירשׁ im Zusammenhang der Landnahme klar und idiomatisch wieder.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: das ich euch gegeben habe
  rationale: Das Perfekt stellt die Gabe als vollzogen und weiterhin gültig dar.
- source_word: וַתַּמְרוּ אֶת־פִּי
  choice: da widersetztet ihr euch dem Befehl
  rationale: Wörtlich steht „ihr widersetztet euch dem Mund“. „Befehl“ erschließt die hebräische Wendung, ohne den Gedanken der Auflehnung abzuschwächen.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: und ihr glaubtet ihm nicht
  rationale: Die Konstruktion kann Glauben oder Vertrauen bezeichnen. „Ihm glauben“ passt unmittelbar zur göttlichen Zusage und lässt die Vertrauensdimension offen.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: und hörtet nicht auf seine Stimme
  rationale: Die Formulierung bewahrt das hebräische Bild und trägt zugleich die Bedeutung des Nichtgehorchens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Wiedergabe als Eigenname bewahrt diese Unterscheidung.
- issue: Bedeutungsbreite von הֶאֱמַנְתֶּם
  choice: ihr glaubtet ihm nicht
  alternative: ihr vertrautet ihm nicht
  rationale: Beide Bedeutungsnuancen sind möglich. Im Haupttext steht die sprachlich unmittelbare Wiedergabe; die Vertrauensnuance wird in einer Fußnote kenntlich gemacht.
- issue: Bedeutungsbreite von שׁמע בקול
  choice: auf seine Stimme hören
  alternative: seiner Stimme gehorchen
  rationale: Die wörtlich-nahe Form wahrt das Bild des Hörens, während der Zusammenhang klar auf Gehorsam zielt; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; hebräische Idiome werden im Haupttext natürlich wiedergegeben und, wo theologisch oder lexikalisch bedeutsam, in Fußnoten transparent gemacht.
