  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: de
  text: Auch in Tabera, in Massa und in Kibrot-Hattaawa[a] habt ihr Jahwe immer wieder zum Zorn gereizt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Kibrot-Hattaawa bedeutet wörtlich »Gräber der Begierde« oder »Gräber des Verlangens«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: Auch in Tabera
  rationale: Die Präposition bezeichnet den Ort; der feste Ortsname wird in einer für das Deutsche angepassten Umschrift wiedergegeben. Das einleitende וּ führt hier weitere Beispiele an und wird natürlich mit »Auch« ausgedrückt.
- source_word: וּ/בְ/מַסָּה
  choice: in Massa
  rationale: Die Präposition bezeichnet den Ort; der Ortsname wird transliteriert. Das wiederholte וּ wird in der deutschen Aufzählung nicht mechanisch wiederholt.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: und in Kibrot-Hattaawa[a]
  rationale: Der Ausdruck ist ein fester Ortsname und wird daher transliteriert; seine wörtliche Bedeutung wird in einer Fußnote genannt.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: habt ihr ... immer wieder zum Zorn gereizt
  rationale: Die Verbindung aus היה und Partizip bezeichnet ein in der Vergangenheit andauerndes beziehungsweise wiederholtes Verhalten. »Immer wieder« gibt diesen Aspekt idiomatisch wieder; »zum Zorn reizen« bewahrt die kausative Bedeutung von קצף im Hifil.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: אֶת kennzeichnet das direkte Objekt und bleibt unübersetzt. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Umschrift »Jahwe« macht diesen erkennbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Stärke und Verlauf des göttlichen Zorns
  choice: zum Zorn gereizt
  alternative: zornig gemacht
  rationale: Die gewählte Formulierung bewahrt die kausative Aussage des Hifil und lässt die Spannung zwischen menschlichem Verhalten und Gottes Reaktion bestehen, ohne sie theologisch abzuschwächen oder näher zu erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Aufzählung ist im Deutschen geglättet, ohne einen Ort auszulassen; »immer wieder« bildet den fortdauernden beziehungsweise wiederholten Charakter der hebräischen Verbverbindung ab.
