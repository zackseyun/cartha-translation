  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: „Ich habe dieses Volk gesehen[a], und siehe, es ist ein halsstarriges Volk.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ich sah dieses Volk, und tatsächlich ist es ein halsstarriges Volk.“'
    reason: Das hebräische Perfekt רָאִיתִי kann hier auch mit dem deutschen Präteritum wiedergegeben werden; וְהִנֵּה kann kontextgemäß „und tatsächlich“ bedeuten.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen gebräuchliche Umschrift des Tetragramms.
- source_word: אֵלַי לֵאמֹר
  choice: 'zu mir:'
  rationale: Der Doppelpunkt leitet die direkte Rede natürlich ein und gibt die Funktion der hebräischen Redeformel לֵאמֹר wieder, ohne das im Deutschen schwerfällige „indem er sprach“.
- source_word: רָאִיתִי
  choice: Ich habe … gesehen
  rationale: Das deutsche Perfekt gibt die abgeschlossene Wahrnehmung mit fortwirkender Beurteilung natürlich wieder; das Präteritum bleibt möglich.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Bewahrt den kollektiven Singular und die unmittelbare Bezeichnung des angesprochenen Volkes.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Siehe“ erhält die nachdrückliche, Aufmerksamkeit weckende Funktion von הִנֵּה und den würdevollen biblischen Ton.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: ein halsstarriges Volk
  rationale: „Halsstarrig“ bewahrt das hebräische Bild vom steifen Nacken und bezeichnet zugleich verständlich hartnäckigen Widerstand.
- source_word: הוּא
  choice: es ist
  rationale: Das Pronomen wird entsprechend dem grammatisch singularischen deutschen Bezugswort „Volk“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen ausdrücklich; die Umschrift bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Charakterisierung Israels durch קְשֵׁה עֹרֶף
  choice: halsstarrig
  alternative: widerspenstig
  rationale: Die gewählte Form erhält sowohl den bildhaften Ausdruck als auch seine Aussage über hartnäckigen Widerstand, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird mit einem Doppelpunkt eingeleitet; „siehe“ und „halsstarrig“ bewahren die markante Bildsprache des Hebräischen, ohne altertümliche Satzbildung zu übernehmen.
