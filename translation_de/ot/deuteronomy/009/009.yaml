  variant: modern standard German
source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: de
  text: Als ich auf den Berg hinaufstieg, um die steinernen Tafeln[a] in Empfang zu nehmen, die Tafeln des Bundes, den Jahwe mit euch geschlossen hatte[b], blieb ich vierzig Tage und vierzig Nächte auf dem Berg. Ich aß kein Brot und trank kein Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um die steinernen Tafeln zu nehmen“. Gemeint ist hier, dass Mose die Tafeln in Empfang nahm.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Jahwe mit euch geschnitten hatte“; dies ist eine hebräische Redewendung für das Schließen eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: Als ich ... hinaufstieg
  rationale: Die Präposition ב mit dem Infinitivus constructus und dem Suffix der 1. Person Singular bezeichnet hier den Zeitpunkt. „Hinaufstieg“ gibt die gerichtete Bewegung natürlich wieder.
- source_word: הָהָרָה
  choice: auf den Berg
  rationale: Das Richtungs-ה bezeichnet die Bewegung zum bestimmten Berg hin; der Kontext meint den Sinai/Horeb.
- source_word: לָקַחַת
  choice: in Empfang zu nehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Da Mose hinaufsteigt, um die von Gott gegebenen Tafeln zu erhalten, gibt „in Empfang nehmen“ den kontextuellen Sinn wieder, ohne Moses als eigenmächtig handelnd darzustellen.
- source_word: לוּחֹת הָאֲבָנִים
  choice: die steinernen Tafeln
  rationale: Die Constructusverbindung bezeichnet Tafeln aus Stein. „Steinerne Tafeln“ ist im Deutschen klar, würdig und idiomatisch.
- source_word: לוּחֹת הַבְּרִית
  choice: die Tafeln des Bundes
  rationale: Die appositionelle Wiederholung des Hebräischen bleibt erhalten und kennzeichnet die Steintafeln ausdrücklich als Bundestafeln.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: den Jahwe mit euch geschlossen hatte
  rationale: כרת ברית, wörtlich „einen Bund schneiden“, ist die feste hebräische Wendung für das Schließen eines Bundes. Das Plusquamperfekt verdeutlicht im Deutschen, dass der Bund für die geschilderte Bergbesteigung vorausgesetzt ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im hebräischen Text verwendeten Eigennamen sichtbar zu bewahren.
- source_word: וָאֵשֵׁב
  choice: blieb ich
  rationale: ישב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Wegen der folgenden Zeitangabe steht hier der Aufenthalt auf dem Berg im Vordergrund.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Die geläufige deutsche Form entspricht der hebräischen Zeitangabe unmittelbar.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Ich aß kein Brot
  rationale: לֶחֶם bezeichnet wörtlich Brot und kann auch Nahrung allgemein meinen. Der konkrete Ausdruck bleibt erhalten.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: und trank kein Wasser
  rationale: Die knappe Form bewahrt die Parallelität zur Aussage über das Brot und gibt den hebräischen Wortlaut natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle ersetzende Lesung wiedergibt.
- issue: Art des Bundesschlusses
  choice: den Jahwe mit euch geschlossen hatte
  alternative: den Jahwe mit euch geschnitten hatte
  rationale: „Einen Bund schneiden“ wäre eine formale Nachbildung des hebräischen Idioms, ist im modernen Deutschen jedoch missverständlich. „Einen Bund schließen“ bewahrt dessen anerkannten Sinn, ohne den Bund näher theologisch auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die appositionelle Wiederholung „die steinernen Tafeln, die Tafeln des Bundes“ und die konkreten Begriffe „Brot“ und „Wasser“ bleiben erhalten. Der lange hebräische Satz wird vor der abschließenden Fastenaussage geteilt, um natürliche deutsche Lesbarkeit zu erreichen.
