base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: de
  text: Da warf ich mich vierzig Tage und vierzig Nächte lang vor Yahweh nieder[a], weil Yahweh gesagt hatte, er werde euch vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da lag ich vierzig Tage und vierzig Nächte lang vor Yahweh hingestreckt.“ Das hebräische Verb kann die ausgestreckte Niederwerfung in der Fürbitte betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: So warf ich mich … nieder
  rationale: Das Hitpael von נפל bezeichnet hier ein bewusstes Niederwerfen vor Gott, im Kontext als Fürbitte. „So“ gibt den folgernden beziehungsweise wiederaufnehmenden Zusammenhang wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי bezeichnet die Gegenwart beziehungsweise das Angesicht Gottes; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: vierzig Tage und vierzig Nächte lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer. Der Relativsatz wiederholt im Hebräischen die Niederwerfung und bezieht sie auf diesen Zeitraum; im Deutschen lässt sich sein Sinn ohne schwerfällige Verdopplung durch die zusammenhängende Dauerangabe ausdrücken.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den Grund für Moses Niederwerfung und Fürbitte ein.
- source_word: אָמַר יְהוָה
  choice: Yahweh gesagt hatte
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass Yahwehs Ankündigung der Niederwerfung vorausging.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: er werde euch vernichten
  rationale: Der Infinitiv mit ל nach אמר bezeichnet die angekündigte Absicht. „Vernichten“ gibt השמיד kräftig wieder, ohne zwingend eine philosophische Aussage über völlige Auslöschung einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Transliteration bewahrt den offenbarten Eigennamen.
- issue: Art der Niederwerfung Moses
  choice: warf ich mich … nieder
  alternative: lag ich … hingestreckt
  rationale: Die Form bezeichnet körperliche Prostration und steht hier im Zusammenhang der Fürbitte. Die Hauptfassung wahrt die Handlung, ohne eine besondere Gebetshaltung über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederaufnahme „die ich mich niedergeworfen hatte“ wird zur Vermeidung einer im Deutschen missverständlichen oder schwerfälligen Verdopplung in die fortlaufende Zeitangabe integriert; die Fußnote bewahrt die körperliche Nuance des Verbs.
