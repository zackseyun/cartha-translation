source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: de
  text: Nicht wegen deiner Gerechtigkeit oder wegen der Aufrichtigkeit deines Herzens ziehst du hinein, um ihr Land in Besitz zu nehmen. Denn wegen der Bosheit dieser Völker vertreibt[a] Jahwe, dein Gott, sie vor dir, und um das Wort[b] zu bestätigen, das Jahwe deinen Vätern[c], Abraham, Isaak und Jakob, geschworen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „enteignet sie vor dir“. Das hebräische Verb kann nicht nur das Vertreiben, sondern auch den Verlust des Landbesitzes hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: „Das Wort“ meint hier das durch einen Eid zugesagte Wort, also die Verheißung.
    reason: lexical_alternative
  - marker: c
    text: Mit „deinen Vätern“ sind hier konkret die anschließend genannten Erzväter Abraham, Isaak und Jakob gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: wegen deiner Gerechtigkeit
  rationale: Das Präfix ב ist in der verneinten Begründung kausal zu verstehen; צְדָקָה bezeichnet hier moralische Gerechtigkeit beziehungsweise rechtes Verhalten.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: oder wegen der Aufrichtigkeit deines Herzens
  rationale: יֹשֶׁר bezeichnet Geradheit beziehungsweise Aufrichtigkeit; zusammen mit לֵבָב ist die innere moralische Haltung gemeint. Die hebräische Herzensmetapher bleibt erhalten.
- source_word: אַתָּה בָא לָרֶשֶׁת אֶת אַרְצָם
  choice: ziehst du hinein, um ihr Land in Besitz zu nehmen
  rationale: בוא mit dem Infinitiv לָרֶשֶׁת verbindet die Bewegung in das Land mit dem Zweck der Besitznahme. „Hineinziehen“ ist im Deutschen für diesen Zusammenhang natürlich.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: wegen ihrer Bosheit ... diese Völker
  rationale: רִשְׁעָה bezeichnet Bosheit oder Schuld; ב ist kausal. Die deutsche Satzstellung vermeidet eine schwerfällige Wiederholung von „dieser Völker“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: vertreibt sie vor dir
  rationale: Der Hifil von ירשׁ kann sowohl das Vertreiben als auch das Entziehen des Landbesitzes hervorheben. „Vertreiben“ gibt den Vorgang idiomatisch wieder; die alternative Nuance wird in einer Fußnote bewahrt.
- source_word: וּלְמַעַן הָקִים
  choice: und er tut es, um ... zu bestätigen
  rationale: לְמַעַן bezeichnet den Zweck. הקים mit דָּבָר im Eid- und Bundeszusammenhang bedeutet ein zugesagtes Wort aufrichten, bestätigen oder verwirklichen.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: das Wort, das ... geschworen hat
  rationale: „Wort“ bleibt eng am semantisch breiten דָּבָר; durch „geschworen“ ist der Sinn eines verbindlich zugesagten Wortes klar.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Die unmittelbar genannten Personen Abraham, Isaak und Jakob zeigen, dass mit אָבוֹת hier konkret die Erzväter gemeint sind.
theological_decisions:
- issue: Grund für Israels Besitznahme des Landes
  choice: Nicht Israels Gerechtigkeit, sondern sowohl die Bosheit der Völker als auch Jahwes Treue zu seinem geschworenen Wort werden als Gründe genannt.
  alternative: Nur die Bosheit der Völker oder nur die Verheißung an die Erzväter als entscheidenden Grund hervorheben.
  rationale: 'Der hebräische Text nennt ausdrücklich beide Gesichtspunkte: כִּי leitet die Bosheit der Völker als Grund ein, וּלְמַעַן nennt die Bestätigung des geschworenen Wortes als Zweck. Beide werden unverkürzt bewahrt.'
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR oder Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. Die Transliteration „Jahwe“ bewahrt dessen Charakter als Gottesname.
- issue: Verhältnis von menschlichem Verdienst und göttlichem Handeln
  choice: Die Besitznahme wird ausdrücklich nicht auf Israels eigene Gerechtigkeit oder innere Aufrichtigkeit gegründet.
  alternative: Die Aussage als bloßen Vergleich unterschiedlicher Grade von Gerechtigkeit verstehen.
  rationale: Die betonte Verneinung לֹא ... כִּי stellt Israels Gerechtigkeit als Begründung ausdrücklich in Abrede, ohne darüber hinaus eine allgemeine dogmatische Aussage in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hineinziehen“ und „in Besitz nehmen“ bewahren die Bewegung und den Besitzaspekt des Hebräischen. Der zweite Satz wird für natürliche deutsche Syntax leicht entfaltet („und er tut es“), ohne einen neuen inhaltlichen Grund einzuführen. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
