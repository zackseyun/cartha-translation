  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: de
  text: 'Sonst könnten die Bewohner des Landes, aus dem du uns herausgeführt hast, sagen: »Weil Yahweh nicht imstande war, sie in das Land zu bringen, das er ihnen zugesagt hatte,[a] und weil er sie hasste, hat er sie herausgeführt, um sie in der Wüste zu töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das er zu ihnen gesprochen hatte«; gemeint ist seine Zusage über das Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Sonst könnten ... sagen
  rationale: Die Partikel bezeichnet hier die befürchtete Folge. Die Verbindung mit »könnten« gibt diesen Sinn im Deutschen natürlich wieder, ohne die Aussage als tatsächlich eintretend darzustellen.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: die Bewohner des Landes, aus dem du uns herausgeführt hast
  rationale: Wörtlich ist »das Land« Subjekt von »sagen«; gemeint sind metonymisch seine Bewohner. Im Deutschen wird die Metonymie zur Verständlichkeit im Haupttext aufgelöst.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Weil Yahweh nicht imstande war
  rationale: Die Wendung drückt behauptetes Unvermögen aus. »Nicht imstande war« ist klar und bewahrt, dass dies die verleumderische Deutung der Landesbewohner wäre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird als »Yahweh« wiedergegeben.
- source_word: לַהֲבִיאָם
  choice: sie ... zu bringen
  rationale: Der Infinitiv bezeichnet das Hineinbringen Israels in das genannte Land.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: in das Land zu bringen, von dem er zu ihnen gesprochen hatte
  rationale: Das Hebräische sagt wörtlich, dass Yahweh »zu ihnen gesprochen« hatte, ohne in diesem Satz ausdrücklich »versprochen« zu verwenden. Diese Formulierung bewahrt die lexikalische Offenheit; eine idiomatische Alternative steht in der Fußnote.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: und weil er sie hasste
  rationale: Die Präposition kennzeichnet den angeblichen Hass als Ursache oder Beweggrund.
- source_word: הוֹצִיאָם
  choice: hat er sie herausgeführt
  rationale: Die Wiedergabe wahrt die Wiederholung desselben hebräischen Verbstamms und den Bezug auf den Auszug.
- source_word: לַהֲמִתָם
  choice: um sie ... zu töten
  rationale: Der kausative Infinitiv bedeutet, ihren Tod herbeizuführen. »Zu töten« ist direkt, verständlich und semantisch genau.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: »Wüste« ist die natürliche deutsche Bezeichnung für den unbewohnten, trockenen Raum der Wüstenwanderung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich; die Transliteration erhält seine Funktion als Eigenname.
- issue: Bedeutung von אֲשֶׁר דִּבֶּר לָהֶם
  choice: von dem er zu ihnen gesprochen hatte
  alternative: das er ihnen versprochen hatte
  rationale: Im Kontext betrifft Yahwehs Rede seine Zusage des Landes, doch das Verb bedeutet zunächst »reden/sprechen«. Der Haupttext bewahrt diese Form und überlässt die kontextuelle Deutung »versprochen« der Fußnote.
- issue: Die Behauptung, Yahweh sei unfähig und hasse Israel
  choice: als mögliche Aussage der Landesbewohner formuliert
  alternative: als direkte Tatsachenbehauptung
  rationale: פֶּן leitet die von Mose befürchtete Reaktion Außenstehender ein. Die Aussagen beschreiben daher nicht die Sicht des Erzählers auf Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche Metonymie »das Land wird sagen« wurde im Haupttext als »die Bewohner des Landes ... sagen« aufgelöst. Die Satzstruktur und die scharfe theologische Spannung der befürchteten Fremdaussage bleiben erhalten.
