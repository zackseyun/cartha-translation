source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: de
  text: 'Da sah ich – und tatsächlich: Ihr hattet gegen Jahwe, euren Gott, gesündigt. Ihr hattet euch ein gegossenes Kalb[a] gemacht und wart schnell von dem Weg abgewichen, den Jahwe euch geboten hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Kalb aus Gussmetall“. Gemeint ist ein durch das Gießen von Metall hergestelltes Kalbsbild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: Da sah ich – und tatsächlich
  rationale: ראה bezeichnet das Sehen, während הִנֵּה die Aufmerksamkeit auf das Wahrgenommene lenkt. Die Formulierung gibt beides in natürlichem modernem Deutsch wieder, ohne den Hinweischarakter von הִנֵּה auszulassen.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: ihr hattet gegen Jahwe, euren Gott, gesündigt
  rationale: Die rückblickende Erzählung legt im Deutschen das Plusquamperfekt nahe. Die Präposition ל bezeichnet hier die gegen Gott gerichtete Sünde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: ihr hattet euch … gemacht
  rationale: Das Dativpronomen gibt wieder, dass das Bild für den eigenen Gebrauch hergestellt wurde; die Wortstellung ist im Deutschen natürlich.
- source_word: עֵגֶל מַסֵּכָה
  choice: ein gegossenes Kalb
  rationale: מַסֵּכָה bezeichnet ein durch Metallguss hergestelltes Bild. „Gegossenes Kalb“ bewahrt sowohl die Gestalt als auch den Herstellungsaspekt.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: wart schnell von dem Weg abgewichen
  rationale: Die Wendung bewahrt das Bild des Abweichens von einem vorgeschriebenen Weg und gibt מַהֵר direkt mit „schnell“ wieder.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: den Jahwe euch geboten hatte
  rationale: Der Relativsatz bezieht sich auf den Weg. Das Plusquamperfekt entspricht der zeitlichen Rückschau auf das zuvor ergangene Gebot.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ macht diesen sichtbar, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und tatsächlich“ vermittelt die aufmerksamkeitslenkende Funktion von הִנֵּה ohne das heute stark altertümlich wirkende „siehe“. Die kurzen Hauptsätze erhalten den nachdrücklichen Ton der Anklage.
