  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: de
  text: Jahwe war gegen Aaron[a] sehr zornig, um ihn zu vernichten; und ich betete damals auch für Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe war sehr zornig mit Aaron.“ Die hebräische Präposition kann in diesem Zusammenhang beide Beziehungsnuancen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: Auch über Aaron
  rationale: Die Präposition בְ beim Verb des Zornes kann hier idiomatisch mit „über“ oder „auf“ wiedergegeben werden. „Auch“ nimmt den Zusammenhang auf und entspricht zugleich dem späteren גַּם.
- source_word: הִתְאַנַּף יְהוָה מְאֹד
  choice: war Jahwe sehr zornig
  rationale: Die Wendung bezeichnet starken Zorn; „sehr zornig“ bewahrt die verbale Aussage und die Verstärkung durch מְאֹד in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לְהַשְׁמִידוֹ
  choice: sodass er ihn vernichten wollte
  rationale: Der Infinitiv mit לְ bezeichnet hier die drohende bzw. beabsichtigte Folge des göttlichen Zorns. „Vernichten“ gibt die Schwere von שׁמד wieder; „wollte“ macht die idiomatische deutsche Satzbeziehung deutlich, ohne die durch Moses’ Gebet abgewendete Vernichtung als vollzogen darzustellen.
- source_word: וָאֶתְפַּלֵּל
  choice: doch ich betete
  rationale: פלל im Hitpael bedeutet „beten“. „Doch“ stellt in diesem Kontext den drohenden Zorn und Moses’ Fürbitte natürlich einander gegenüber.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: auch für Aaron
  rationale: גַּם markiert, dass Mose neben seiner Fürbitte für Israel auch für Aaron betete; בְּעַד bezeichnet hier Fürbitte zugunsten einer Person.
- source_word: בָּעֵת הַהִוא
  choice: damals
  rationale: „Damals“ ist eine knappe, natürliche Wiedergabe der rückverweisenden Zeitangabe „zu jener Zeit“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Ziel oder Folge in לְהַשְׁמִידוֹ
  choice: sodass er ihn vernichten wollte
  alternative: um ihn zu vernichten
  rationale: Die Konstruktion kann Ziel oder beabsichtigte Folge ausdrücken. Die gewählte Fassung ist im Deutschen natürlich und hält fest, dass Aarons Vernichtung unmittelbar drohte, ohne zu behaupten, sie sei eingetreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und mündlich verständlich; „Jahwe“, „zornig“, „vernichten“ und „betete“ bewahren die Schärfe und theologische Spannung des Ausgangstextes.
