revisions:
- from: Auch über Aaron war Jahwe sehr zornig, sodass er ihn vernichten wollte; doch ich betete damals auch für Aaron.[a]
  to: Jahwe war gegen Aaron[a] sehr zornig, um ihn zu vernichten; und ich betete damals auch für Aaron.
