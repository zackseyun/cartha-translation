base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: de
  text: Doch sie sind dein Volk und dein Erbteil, die du mit deiner großen Kraft und deinem ausgestreckten Arm[a] herausgeführt hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »ausgestreckte Arm« ist eine feste Wendung der Exodusüberlieferung für das machtvolle rettende Handeln des HERRN.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Und sie sind dein Volk und dein Erbteil, die du mit deiner großen Kraft und deinem ausgestreckten Arm herausgeführt hast.« Das hebräische Bindewort kann einfach »und« bedeuten; »doch« hebt den wahrscheinlichen Gegensatz in Moses Fürbitte hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Doch sie sind
  rationale: Die Konjunktion וְ kann schlicht mit „und“ wiedergegeben werden. Im Zusammenhang von Moses Fürbitte hebt sie jedoch wahrscheinlich den Gegensatz zur drohenden Vernichtung hervor; „doch“ bringt diese Funktion natürlich zum Ausdruck.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet hier Israel als das zu Gott gehörende Volk; „dein Volk“ ist präzise und idiomatisch.
- source_word: וְנַחֲלָתֶךָ
  choice: und dein Erbteil
  rationale: נַחֲלָה bezeichnet Erbbesitz beziehungsweise zugeteilten Besitz. „Erbteil“ bewahrt die biblische Bundes- und Zugehörigkeitssprache besser als das allgemeinere „Besitz“.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich inhaltlich auf die Menschen des Volkes; der deutsche Plural „die“ ist grammatisch natürlich.
- source_word: הוֹצֵאתָ
  choice: du ... herausgeführt hast
  rationale: Der Hifil von יצא ist die übliche Formulierung für Gottes Herausführung Israels aus Ägypten. „Herausgeführt“ wahrt dieses Exodusmotiv.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: mit deiner großen Kraft
  rationale: כֹּחַ bedeutet „Kraft“ oder „Macht“, und גָּדוֹל heißt „groß“. Das instrumentale בְּ wird im Deutschen natürlich mit „mit“ wiedergegeben.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: und deinem ausgestreckten Arm
  rationale: Die wörtliche Wiedergabe bewahrt das feste Exodusbild für Gottes machtvolles rettendes Handeln.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: „deinem ausgestreckten Arm“ wörtlich beibehalten
  alternative: Dynamisch als „durch deine mächtigen Taten“ wiedergeben
  rationale: Das körperhafte Bild ist ein bewusstes und theologisch bedeutsames Exodusmotiv. Eine abstrakte Umschreibung würde seine literarische Kraft abschwächen.
- issue: Bundesbezogene Zugehörigkeit in נַחֲלָה
  choice: „Erbteil“
  alternative: „Erbe“ oder „Besitz“
  rationale: „Erbteil“ erhält die Vorstellung eines Gott zugehörigen, ihm zugeteilten Volkes, ohne die Aussage näher dogmatisch festzulegen.
- issue: Sinn der einleitenden Konjunktion וְ
  choice: adversativ als „Doch“
  alternative: additiv als „Und“
  rationale: Der Kontext der Fürbitte legt einen Gegensatz nahe, doch die einfach additive Bedeutung bleibt sprachlich möglich und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbteil“ und „ausgestreckter Arm“ bewahren die prägnante biblische Bild- und Bundessprache; Satzbau und Verbwahl bleiben zugleich allgemein verständlich.
