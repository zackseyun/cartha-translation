  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: de
  text: Denn ich fürchtete mich vor dem Zorn und dem Grimm, mit denen Jahwe gegen euch entbrannt war, um euch zu vernichten. Doch Jahwe hörte auch damals auf mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: ich fürchtete mich
  rationale: Das Qal Perfekt bezeichnet Furcht oder tiefes Erschrecken. „Ich fürchtete mich“ ist im modernen Deutsch natürlich und bewahrt die persönliche Aussage.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Gegenstand der Furcht. Im Deutschen ist „sich vor etwas fürchten“ die natürliche idiomatische Wiedergabe.
- source_word: הָאַף וְהַחֵמָה
  choice: der Zorn und der Grimm
  rationale: Beide Wörter bezeichnen heftigen Zorn. Die Doppelung wird bewahrt, ohne die bildliche Grundbedeutung von אַף („Nase“) unpassend wörtlich wiederzugeben.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: mit dem Jahwe über euch erzürnt war
  rationale: קצף bezeichnet heftigen Zorn; עַל markiert hier dessen Ziel. Die Formulierung wahrt die Wiederaufnahme der Zornessprache und klingt zugleich würdig und verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: sodass er euch vernichten wollte
  rationale: שׁמד im Hifil bedeutet „vernichten“. Die deutsche Fassung gibt den drohenden Ausgang beziehungsweise die Absicht des Zorns natürlich wieder; die formnähere Zweckangabe wird in der Fußnote genannt.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Doch Jahwe hörte auf mich
  rationale: שׁמע mit אֶל bedeutet in diesem Zusammenhang nicht bloß akustisches Hören, sondern das günstige Eingehen auf Moses Fürbitte. „Auf mich hören“ bewahrt diese Bedeutung, ohne die Reaktion weiter auszudeuten.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: auch diesmal
  rationale: Die Wendung kennzeichnet einen weiteren entsprechenden Anlass. „Auch diesmal“ ist knapp, idiomatisch und bewahrt die additive Kraft von גַּם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ wahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Gottes Zorn zur angedrohten Vernichtung
  choice: sodass er euch vernichten wollte
  alternative: um euch zu vernichten
  rationale: Der לְ-Infinitiv kann Ziel beziehungsweise beabsichtigte Folge ausdrücken. Die Hauptfassung ist natürliches Deutsch, während die Fußnote die formnähere Zweckformulierung offenhält.
- issue: Bedeutung von Gottes Hören auf Mose
  choice: Jahwe hörte auf mich
  alternative: Jahwe erhörte mich
  rationale: „Erhörte mich“ würde die günstige Reaktion ausdrücklich benennen. „Hörte auf mich“ entspricht שׁמע אֶל enger und lässt die im Kontext erkennbare Wirkung bestehen, ohne sie stärker auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gehobenen, aber geläufigen Wörter „Zorn“, „Grimm“ und „erzürnt“ erhalten die auffällige Häufung der hebräischen Zornesbegriffe. Die Satzstruktur bleibt quellennah, wird jedoch durch „sodass“ für heutige Leser geglättet.
