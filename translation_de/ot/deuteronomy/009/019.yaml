  naturalness: „Vor dem Zorn und dem Grimm, mit denen Jahwe gegen euch entbrannt war“ ist modernes, würdiges Standarddeutsch. „Auch damals“ entspricht der Zeitangabe präziser als „auch diesmal“, das einen stärker wiederholenden, situationsnahen Ton hat.
  terminology: „Jahwe“, „Zorn“, „Grimm“ und „vernichten“ sind angemessen. „Auf mich hören“ bewahrt die Formulierung des Hebräischen, ohne das kontextuell naheliegende günstige Erhören als Übersetzung festzuschreiben.
