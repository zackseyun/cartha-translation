base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: de
  text: Dann wandten wir uns und zogen auf dem Weg nach Baschan hinauf. Da zog Og, der König von Baschan, uns entgegen, zusammen mit seinem ganzen Volk, um bei Edreï zu kämpfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Dann wandten wir uns
  rationale: פנה bezeichnet hier im fortlaufenden Erzählablauf eine Richtungsänderung. „Dann“ gibt die Abfolge natürlich wieder, ohne jedes Waw mit „und“ abzubilden.
- source_word: וַנַּעַל
  choice: zogen … hinauf
  rationale: עלה enthält die Bedeutung des Hinaufziehens. „zogen … hinauf“ ist im Reise- und Heereskontext natürlich und bewahrt die Richtungsangabe.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: auf dem Weg nach Baschan
  rationale: Die hebräische Verbindung bedeutet wörtlich „Weg Baschans“ und kann den nach Baschan führenden oder durch Baschan verlaufenden Weg bezeichnen. Die Hauptfassung verwendet die im Deutschen natürliche Zielangabe; die genuine Alternative wird in der Fußnote erhalten.
- source_word: וַיֵּצֵא
  choice: Da zog … aus
  rationale: יצא bedeutet „hinausgehen/ausziehen“. Im militärischen Zusammenhang ist „ausziehen“ idiomatisch, ohne die Handlung unnötig als Marsch zu spezifizieren.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, der König von Baschan
  rationale: Die Konstruktverbindung wird im Deutschen natürlich durch eine Apposition wiedergegeben; die Eigennamen werden transliteriert.
- source_word: לִקְרָאתֵנוּ
  choice: uns entgegen
  rationale: לקראת bezeichnet eine Bewegung auf jemanden zu bzw. ihm entgegen. Der feindliche Zweck ergibt sich aus לַמִּלְחָמָה und muss hier nicht zusätzlich in das Verb hineingelesen werden.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: mit seinem ganzen Volk
  rationale: עם bedeutet grundsätzlich „Volk“. Obwohl im Kontext wohl die kampffähige Streitmacht gemeint ist, vermeidet „Volk“ eine nicht ausdrücklich markierte Verengung auf „Heer“.
- source_word: לַמִּלְחָמָה
  choice: um … gegen uns zu kämpfen
  rationale: מלחמה kann „Krieg“ oder „Kampf/Schlacht“ bedeuten. Bei dieser konkreten Begegnung gibt eine finale Wendung mit „kämpfen“ den Sinn im modernen Deutschen klar wieder.
- source_word: אֶדְרֶעִי
  choice: bei Edreï
  rationale: Der Ortsname steht adverbial ohne ausdrückliche Präposition und bezeichnet wahrscheinlich den Ort der Konfrontation. „bei“ lässt offen, ob sie unmittelbar in der Stadt oder in ihrer Umgebung stattfand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Rhythmus. „zogen … hinauf“ und „zog … aus“ bewahren die Bewegungsverben des Hebräischen; „Edreï“ markiert die getrennte Aussprache der letzten Vokale.
