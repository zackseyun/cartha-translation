review_pass:
  verdict: revise
  source_fidelity: Die Abfolge und die wesentlichen Bewegungs- und Begegnungsverben sind zutreffend wiedergegeben. Die Formulierung „gegen uns zu kämpfen“ fügt jedoch zu לַמִּלְחָמָה („zum Kampf/zur Schlacht“) ein nicht ausdrücklich ausgedrücktes Objekt hinzu. Der Kampf richtet sich kontextuell zwar gegen Israel, doch der hebräische Wortlaut belässt dies bei der vorausgehenden Begegnung „uns entgegen“.
  naturalness: Der Text ist überwiegend natürliches modernes Standarddeutsch. „zusammen mit seinem ganzen Volk“ bildet die hebräische Verbindung „er und sein ganzes Volk“ idiomatischer ab als eine bloße instrumentale Lesart. „bei Edreï“ ist als Ortsangabe gut möglich und wahrt die Offenheit der präpositionslosen hebräischen Ortsnennung.
  terminology: „Baschan“, „Og“ und „Edreï“ sind angemessene Namensformen. „Volk“ bewahrt die Weite von עַם und verengt den Ausdruck nicht auf ein Heer. „zum Kampf“ gibt לַמִּלְחָמָה unmittelbar wieder, ohne den Bezug durch „gegen uns“ zusätzlich festzulegen.
  issues:
  - severity: medium
    issue: Zusatz „gegen uns“ in der finalen Kampfbestimmung
    rationale: Das Hebräische hat לַמִּלְחָמָה, „zum Kampf/zur Schlacht“, aber kein ausdrückliches Pendant zu „gegen uns“ an dieser Stelle. Die Beziehung zu „uns“ steht bereits in לִקְרָאתֵנוּ („uns entgegen“). Die Ergänzung ist plausibel, aber für eine optimal-äquivalente Übersetzung unnötig spezifizierend.
  revised_text: Dann wandten wir uns und zogen auf dem Weg nach Baschan hinauf. Da zog Og, der König von Baschan, uns entgegen, zusammen mit seinem ganzen Volk, um bei Edreï zu kämpfen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg durch Baschan“. Wörtlich: „auf dem Weg Baschans“.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt ausschließlich die nicht ausdrücklich im hebräischen Text markierte Ergänzung „gegen uns“. Die übrige Satzführung wird beibehalten; „zusammen mit“ macht dabei die koordinierende Konstruktion „er und sein ganzes Volk“ im Deutschen klar und natürlich.
