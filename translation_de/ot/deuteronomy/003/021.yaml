base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: de
  text: 'Und Josua wies ich damals an: »Du hast mit eigenen Augen alles gesehen, was Jahwe, euer Gott, diesen beiden Königen angetan hat. Ebenso wird Jahwe mit allen Königreichen verfahren, in die du hinüberziehst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת־יְהוֹשׁוּעַ צִוֵּיתִי
  choice: Und Josua gebot ich
  rationale: Bewahrt das vorangestellte Objekt und damit die Hervorhebung Josuas; צוה bezeichnet hier ein autoritatives Gebot.
- source_word: בָּעֵת הַהִוא
  choice: damals
  rationale: Natürliche und prägnante Wiedergabe der üblichen Zeitangabe »zu jener Zeit«.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im modernen Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Du hast mit eigenen Augen ... gesehen
  rationale: Gibt die emphatische Augenzeugenschaft natürlich wieder, ohne das hebräische Bild einzuebnen.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; das Suffix an אֱלֹהֵיכֶם ist plural, obwohl Josua persönlich angeredet wird, und verweist auf Israels gemeinsamen Gott.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: diesen beiden Königen angetan hat
  rationale: »Antun« macht im Deutschen die aus dem Zusammenhang erkennbare feindliche Wirkung deutlich und passt idiomatisch zur Präposition ל.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Ebenso wird Jahwe ... verfahren
  rationale: כֵּן stellt das Handeln an den beiden Königen als Muster für das kommende Handeln Jahwes dar.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: zu denen du hinüberziehst
  rationale: Bewahrt sowohl die an Josua gerichtete Singularform als auch das Motiv des Hinüberziehens über den Jordan; שָׁמָּה bezeichnet die Zielrichtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext ausdrücklich stehende Bundesname wird als Eigenname wiedergegeben.
- issue: Wechsel zwischen singularer und pluraler Anrede
  choice: »du« für Josua, »euer Gott« für Israel einschließlich Josuas
  alternative: Angleichung zu »dein Gott«
  rationale: Der hebräische Text bewahrt die Spannung zwischen der persönlichen Anrede Josuas (עֵינֶיךָ, אַתָּה) und dem pluralischen Suffix in אֱלֹהֵיכֶם; sie wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Augenzeugenschaft wird idiomatisch ausgedrückt; der Jordanübergang bleibt durch »hinüberziehst« hörbar. Keine Fußnoten erforderlich.
