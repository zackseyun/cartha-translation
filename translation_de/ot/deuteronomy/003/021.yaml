revisions:
- from: 'Und Josua gebot ich damals: »Du hast mit eigenen Augen alles gesehen, was Jahwe, euer Gott, diesen beiden Königen angetan hat. Ebenso wird Jahwe mit allen Königreichen verfahren, zu denen du hinüberziehst.«'
  to: 'Und Josua wies ich damals an: »Du hast mit eigenen Augen alles gesehen, was Jahwe, euer Gott, diesen beiden Königen angetan hat. Ebenso wird Jahwe mit allen Königreichen verfahren, in die du hinüberziehst.«'
  rationale: Die Revision modernisiert lediglich die deutsche Wortstellung und präzisiert die Bewegungsrichtung der Schlussklausel. Die hebräische Spannung zwischen Josuas singularer Anrede und dem pluralischen »euer Gott« bleibt erhalten; keine Fußnote ist erforderlich.
