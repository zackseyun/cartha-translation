lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: So blieben wir
  rationale: Das Verb יָשַׁב bezeichnet hier im erzählenden Zusammenhang das Bleiben oder Sich-Aufhalten an einem Ort. „So“ gibt die kontextuelle Fortführung durch das Waw wieder; „blieben“ klingt im modernen Deutschen natürlich, ohne einen dauerhaften Wohnsitz vorauszusetzen.
- source_word: בַּגָּיְא
  choice: im Tal
  rationale: גַּיְא kann ein Tal, eine Schlucht oder einen Taleinschnitt bezeichnen. „Tal“ ist die natürliche, nicht übermäßig spezifizierende Wiedergabe.
- source_word: מוּל
  choice: gegenüber von
  rationale: מוּל bezeichnet eine räumliche Lage vor beziehungsweise gegenüber einem Ort. „gegenüber von“ ist im Deutschen mit einem Ortsnamen klar und idiomatisch.
- source_word: בֵּית פְּעוֹר
  choice: Bet-Peor
  rationale: Der hebräische Ortsname wird gemäß gängiger deutscher Bibeltransliteration als „Bet-Peor“ wiedergegeben und nicht etymologisch übersetzt.
