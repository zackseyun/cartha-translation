source:
  edition: WLC
  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: de
  text: Doch beauftrage Josua[a], stärke ihn und ermutige ihn[b]; denn er wird vor diesem Volk hinüberziehen und ihnen das Land, das du sehen wirst, als Erbbesitz geben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gib Josua den Auftrag“ oder „weise Josua an“. Das hebräische Verb kann eine förmliche Beauftragung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mach ihn stark und mutig“. Die beiden hebräischen Verben verbinden Festigkeit und Mut.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „er wird sie das Land erben lassen“. Die hebräische Verbform ist kausativ: Josua wird dazu beitragen, dass das Volk das Land als Erbbesitz erhält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: Doch beauftrage Josua
  rationale: Das Piel von צוה bezeichnet hier die förmliche Übertragung eines Auftrags. „Beauftrage“ gibt diesen amtlichen Charakter natürlicher wieder als das allgemeinere „befiehl“; „doch“ nimmt den vorangehenden Gegensatz auf.
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  choice: stärke ihn und ermutige ihn
  rationale: Die beiden Piel-Imperative bezeichnen sich ergänzend Festigung und Ermutigung. Die deutsche Wortpaarung bleibt nah an der hebräischen Formulierung und klingt zugleich natürlich.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: denn er wird vor diesem Volk hinüberziehen
  rationale: עבר bezeichnet im Zusammenhang den Übergang über den Jordan. „Vor diesem Volk“ bewahrt sowohl die räumliche Aussage als auch den möglichen Führungsaspekt von לִפְנֵי.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: und ihnen das Land … als Erbbesitz geben
  rationale: 'Das Hifil von נחל ist kausativ: Durch Josua wird das Volk das Land als Erbbesitz erhalten. Diese Formulierung gibt den Sinn idiomatischer wieder als „er wird sie das Land erben lassen“.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: das du sehen wirst
  rationale: Der Imperfekt verweist im Kontext auf den noch bevorstehenden Blick des Mose auf das Land.
theological_decisions:
- issue: Josuas Rolle bei der Landgabe
  choice: „ihnen das Land … als Erbbesitz geben“ beschreibt Josua als den beauftragten Vermittler des Besitzes.
  alternative: „sie das Land in Besitz nehmen lassen“
  rationale: Die kausative Verbform weist Josua eine echte ausführende Rolle zu, ohne ihn als eigentlichen Ursprung der göttlichen Verheißung darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „als Erbbesitz geben“ die kausative Konstruktion verständlich und idiomatisch wiedergibt.
