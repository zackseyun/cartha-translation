  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: de
  text: 'Damals flehte ich zu Jahwe[a] und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“. Traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: flehte ich
  rationale: Der Hitpael von חנן bezeichnet hier ein inständiges Bitten um Gunst oder Erbarmen. „flehte ich“ gibt die Eindringlichkeit in natürlichem, gehobenem Deutsch wieder; das vorangestellte Waw wird im fortlaufenden deutschen Erzählzusammenhang nicht eigens mit „und“ wiedergegeben.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet die Ausrichtung der Bitte auf Jahwe. Die Verbindung „zu jemandem flehen“ ist im Deutschen idiomatisch und bewahrt diese Richtung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: „Damals“ ist eine natürliche und genaue deutsche Wiedergabe der zeitlichen Angabe „zu jener Zeit“, ohne einen engeren Zeitpunkt festzulegen.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die hebräische Einleitungsformel für die folgende direkte Rede wird im Deutschen idiomatisch mit „und sagte“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Gottesnamen im Haupttext sichtbar; die traditionelle Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „flehte“ bewahrt die Eindringlichkeit des hebräischen Verbs; die knappe Redeeinleitung führt unmittelbar zum folgenden Vers.
