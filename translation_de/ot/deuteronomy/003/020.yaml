id: DEU.3.20
reference: Deuteronomy 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: de
  text: bis Jahwe euren Brüdern ebenso Ruhe verschafft wie euch[a] und auch sie das Land in Besitz nehmen, das Jahwe, euer Gott, ihnen jenseits des Jordan[b] gibt. Dann soll jeder von euch zu seinem Erbbesitz[c] zurückkehren, den ich euch gegeben habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ sind hier die anderen Israeliten gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf der anderen Seite des Jordan“. Die Angabe erfolgt aus der Perspektive des Gebiets östlich des Flusses.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu seinem Erbteil“ beziehungsweise „zu seinem Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: Ruhe verschafft
  rationale: Der Hifil von נוח bezeichnet hier, dass Jahwe Ruhe beziehungsweise gesicherte Lebensverhältnisse gewährt. „Ruhe verschafft“ ist im Deutschen natürlich und bewahrt das deuteronomische Motiv.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext stehende Eigenname erhalten bleibt.
- source_word: לַאֲחֵיכֶם
  choice: euren Brüdern
  rationale: Das hebräische Substantiv ist ein maskuliner Verwandtschaftsbegriff, der hier die israelitischen Stammesgenossen bezeichnet. Die wörtliche Bildsprache bleibt im Haupttext erhalten; die weitere Bedeutung wird in einer Fußnote erläutert.
- source_word: כָכֶם
  choice: ebenso … wie euch
  rationale: Die knappe hebräische Vergleichsformel ist elliptisch. Die deutsche Fassung macht den Vergleich idiomatisch deutlich, ohne ein zusätzliches Verb in den Ausgangstext hineinzulesen.
- source_word: וְיָרְשׁוּ
  choice: in Besitz nehmen
  rationale: ירשׁ bezeichnet im Zusammenhang der Landnahme den tatsächlichen Erwerb und Besitz des zugewiesenen Landes; „in Besitz nehmen“ gibt diesen konkreten Sinn wieder.
- source_word: גַם הֵם
  choice: auch sie
  rationale: Die Formulierung bewahrt die Betonung, dass auch die übrigen Israeliten wie die bereits versorgten Stämme ihr Land erhalten.
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Partizip stellt Jahwes Gabe als gegenwärtig beziehungsweise gewiss dar. Das deutsche Präsens ist dafür natürlich und aspektuell offen.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die räumlich relative Wendung bezeichnet hier aus der östlichen Sprecherperspektive das Gebiet westlich des Jordan. „Jenseits des Jordan“ wahrt die Perspektivgebundenheit.
- source_word: וְשַׁבְתֶּם
  choice: Dann soll … zurückkehren
  rationale: Die Verbfolge führt zum nächsten Schritt nach erfüllter Verpflichtung. „Dann soll … zurückkehren“ bewahrt den direktiven Charakter des Zusammenhangs, ohne die Form ausdrücklich als bloße Erlaubnis festzulegen.
- source_word: אִישׁ
  choice: jeder von euch
  rationale: אִישׁ wird hier distributiv gebraucht. „Jeder von euch“ ist idiomatisches Deutsch und bezieht sich eindeutig auf die angesprochenen Männer.
- source_word: לִירֻשָּׁתוֹ
  choice: zu seinem Erbbesitz
  rationale: יְרֻשָּׁה bezeichnet den als Anteil erhaltenen, bleibenden Besitz. „Erbbesitz“ verbindet den Gedanken der Zuweisung mit dem konkreten Landbesitz.
- source_word: נָתַתִּי לָכֶם
  choice: den ich euch gegeben habe
  rationale: Das Perfekt bezeichnet die bereits vollzogene Zuweisung mit fortdauernder Geltung; das deutsche Perfekt gibt dies natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Maskuline Bezeichnung לַאֲחֵיכֶם
  choice: euren Brüdern
  alternative: euren israelitischen Stammesgenossen
  rationale: „Brüder“ erhält die maskuline Verwandtschaftsbezeichnung und ihre Bundes- und Volksverbundenheit; eine Fußnote verdeutlicht den kontextuellen Bezug auf die anderen Israeliten.
- issue: Aussagewert von וְשַׁבְתֶּם
  choice: Dann soll jeder von euch … zurückkehren
  alternative: Dann darf jeder von euch … zurückkehren
  rationale: Die hebräische Form bezeichnet sicher die anschließende Rückkehr, legt aber nicht ausdrücklich allein einen Erlaubnissinn fest. „Soll“ wahrt den direktiven Zusammenhang und vermeidet eine unnötige Festlegung auf bloße Erlaubnis.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem hebräischen zeitlichen Ablauf, wird aber für flüssiges Deutsch gegliedert. Der Gottesname erscheint als „Jahwe“; traditionelle, heute unnötig altertümliche Wendungen werden vermieden.
