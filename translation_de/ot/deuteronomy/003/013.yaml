base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: de
  text: 'Den übrigen Teil Gileads und den ganzen Baschan, das Königreich Ogs, gab ich dem halben Stamm Manasse: das ganze Gebiet von Argob, also den ganzen Baschan. Dieses Gebiet wird das Land der Refaïm[a] genannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „das Land der Riesen“. „Refaïm“ ist der hebräische Name eines alten Volkes, das mit dieser Region verbunden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: den übrigen Teil Gileads
  rationale: Gibt den nach der zuvor erwähnten Zuteilung verbleibenden Teil Gileads präzise und in natürlichem Deutsch wieder.
- source_word: כָל הַבָּשָׁן
  choice: den ganzen Baschan
  rationale: Bewahrt die umfassende Bedeutung von כָל und verwendet die etablierte deutsche Form des Ortsnamens.
- source_word: מַמְלֶכֶת עוֹג
  choice: das Königreich Ogs
  rationale: Gibt die hebräische Genitivverbindung knapp und eindeutig wieder.
- source_word: נָתַתִּי
  choice: gab ich
  rationale: Bewahrt die einfache Grundbedeutung des Verbs und die Ich-Rede des Mose im Zuteilungskontext.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: dem halben Stamm Manasse
  rationale: Ist die übliche und verständliche deutsche Bezeichnung für den östlich des Jordan angesiedelten Teil des Stammes.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: das ganze Gebiet von Argob
  rationale: חֶבֶל bezeichnet hier ein abgegrenztes Territorium, nicht wörtlich eine Schnur; „Gebiet“ ist sachgerecht und allgemein verständlich.
- source_word: לְכָל הַבָּשָׁן
  choice: also den ganzen Baschan
  rationale: Versteht die Wendung appositionell bzw. erläuternd. „Also“ macht diese Beziehung im Deutschen lesbar, ohne zusätzliche geografische Einzelheiten einzutragen.
- source_word: יִקָּרֵא
  choice: wird … genannt
  rationale: Das passive Imperfekt bezeichnet hier eine geltende Benennung; das deutsche Präsens gibt diesen fortbestehenden Namen natürlich wieder.
- source_word: אֶרֶץ רְפָאִים
  choice: das Land der Refaïter
  rationale: Behandelt רְפָאִים vorrangig als Namen einer alten Bevölkerungsgruppe und vermeidet im Haupttext die interpretierende Übersetzung „Riesen“.
theological_decisions:
- issue: Wiedergabe von רְפָאִים als Volksname oder als „Riesen“
  choice: Refaïter
  alternative: Riesen
  rationale: Im Vers bezeichnet das hebräische Wort am ehesten eine mit der Region verbundene Bevölkerungsgruppe. Die Transliteration bewahrt diese Funktion, während die traditionelle Deutung in der Fußnote sichtbar bleibt.
- issue: Zeitwert von יִקָּרֵא
  choice: wird genannt
  alternative: wurde genannt
  rationale: Die hebräische Imperfektform kann eine übliche oder fortbestehende Bezeichnung ausdrücken. Das Präsens wahrt diese Offenheit besser als eine rein vergangene Benennung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen weitgehend der hebräischen Aufzählung, werden aber durch Doppelpunkt und einen neuen Satz übersichtlich gegliedert. „Dieser“ greift grammatisch „den ganzen Baschan“ auf.
