  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: de
  text: Aber das ganze Vieh und die Beute aus den Städten nahmen wir für uns als Beute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und das ganze Vieh und die Beute aus den Städten erbeuteten wir für uns.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Aber das ganze
  rationale: Das Waw verbindet den Vers mit der vorherigen Vernichtung der Bevölkerung und hat im Zusammenhang eine leicht gegensätzliche Wirkung; „aber“ gibt diesen Kontrast natürlich wieder, während „das ganze“ die Gesamtheit von כָּל bewahrt.
- source_word: הַ/בְּהֵמָה
  choice: Vieh
  rationale: בְּהֵמָה bezeichnet hier die domestizierten Nutztiere der Städte. „Vieh“ ist im Deutschen präzise und geläufig.
- source_word: וּ/שְׁלַל
  choice: und die Beute
  rationale: שָׁלָל bezeichnet im Krieg erbeutete Güter. „Beute“ ist modern, verständlich und militärisch passend.
- source_word: הֶ/עָרִים
  choice: aus den Städten
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Beute, die den Städten entnommen wurde. Im Deutschen drückt „aus den Städten“ diese Beziehung natürlicher und eindeutig aus als „der Städte“.
- source_word: בַּזּוֹנוּ
  choice: nahmen wir … als Plündergut
  rationale: Das Verb בזז bedeutet plündern beziehungsweise als Beute nehmen. Die Formulierung gibt den militärischen Sinn deutlich wieder und vermeidet die stilistisch schwerfällige Wiederholung „Beute … erbeuteten“.
- source_word: לָֽ/נוּ
  choice: für uns
  rationale: Die Präposition ל mit dem Pronomen der ersten Person Plural bezeichnet die Nutznießer beziehungsweise den Verbleib der Beute; „für uns“ bildet dies knapp und unmittelbar ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht adversative Verknüpfung mit dem vorherigen Vers wird durch „Aber“ sichtbar gemacht; die Fußnote bewahrt die mögliche rein fortführende Wiedergabe von וְ sowie die direktere verbale Übersetzung von בזז.
