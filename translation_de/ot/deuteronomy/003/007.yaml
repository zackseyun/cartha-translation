  - severity: medium
    issue: Ungeeignete Fußnotenalternative „Vieh und die Beute … plünderten wir“
    rationale: Das Verb „plündern“ nimmt im Deutschen gewöhnlich Orte oder Personen als Objekt; „Beute plündern“ ist semantisch unpräzise. Die Alternative sollte die mögliche fortführende Funktion von וְ wiedergeben, ohne diese Schwierigkeit zu erzeugen.
