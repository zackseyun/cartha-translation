  source_fidelity: 'Die Wiedergabe trifft die Bestandteile des Hebräischen grundsätzlich: וְכָל als adversativ verstandenes „Aber“, בְּהֵמָה als „Vieh“, שְׁלַל als Kriegsbeute, die Städte als Herkunftsbereich und לָנוּ als Begünstigtenangabe. Das Verb בזז bezeichnet jedoch unmittelbar das Plündern bzw. Erbeuten. Die Verbindung „die Beute … nahmen wir … als Plündergut“ ist semantisch doppelt und stilistisch unnötig schwer.'
  naturalness: „Vieh und Beute … nahmen wir für uns als Plündergut“ ist zwar verständlich, aber „Beute“ und „Plündergut“ wiederholen dieselbe Aussage. Außerdem ist die Fußnotenalternative „Vieh und die Beute … plünderten wir“ im Deutschen sachlich und idiomatisch weniger passend, da Beute nicht selbst geplündert wird. „… nahmen wir für uns als Beute“ ist modern, klar und bewahrt den militärischen Sinn.
  terminology: „Vieh“ und „Beute“ sind für den Kontext präzise und im modernen Standarddeutsch angemessen. „Aus den Städten“ ist als idiomatische Auslegung der Konstruktverbindung vertretbar.
