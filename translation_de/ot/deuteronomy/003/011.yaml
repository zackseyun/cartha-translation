base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: de
  text: Denn nur Og, der König von Baschan, war vom Rest der Refaïm übrig geblieben.[a] Seht, sein Bett war ein Bett aus Eisen. Steht es nicht in Rabba der Ammoniter? Es ist neun Ellen lang und vier Ellen breit, nach der Elle eines Mannes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Riesen. Hebräisch Refaïm, wahrscheinlich die Bezeichnung eines alten Volkes, das mit außergewöhnlicher Körpergröße in Verbindung gebracht wurde.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: nach der gewöhnlichen Elle. Hebräisch wörtlich: nach der Elle eines Mannes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: nur
  rationale: Kennzeichnet Og als den Einzigen, der aus dieser Gruppe übrig geblieben war.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: war vom Rest … übrig geblieben
  rationale: Gibt die passive Verbform und die Präpositionalfügung im Deutschen natürlich wieder, ohne die Aussage über Ogs alleiniges Übrigbleiben abzuschwächen.
- source_word: הָרְפָאִים
  choice: die Refaïter
  rationale: Bewahrt die Bezeichnung einer alten Volks- oder Menschengruppe, statt sie deutend mit „Riesen“ wiederzugeben.
- source_word: הִנֵּה
  choice: Seht
  rationale: Erhält die hinweisende Kraft des Ausdrucks in verständlichem, gegenwärtigem Deutsch.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: sein Bett war ein Bett
  rationale: Bewahrt die Wiederholung des hebräischen Substantivs; „Bett“ ist im Zusammenhang die naheliegende Bedeutung.
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Direkte Wiedergabe der Materialangabe.
- source_word: הֲלֹה הִוא
  choice: Steht es nicht
  rationale: Gibt die rhetorische Frage idiomatisch wieder; „steht“ macht deutlich, dass nach dem bekannten Standort des Gegenstands gefragt wird.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: in Rabba der Ammoniter
  rationale: Verwendet den gebräuchlichen deutschen Ortsnamen und gibt „Söhne Ammons“ als Volksbezeichnung wieder.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: neun Ellen … vier Ellen
  rationale: Behält das antike Maß bei und vermeidet eine scheinpräzise moderne Umrechnung.
- source_word: בְּאַמַּת אִישׁ
  choice: gemessen nach der Elle eines Mannes
  rationale: Bewahrt die auffällige hebräische Formulierung, während „gemessen“ den Bezug zu den Abmessungen im Deutschen verdeutlicht.
theological_decisions:
- issue: Ob הָרְפָאִים als Gruppenname oder deutend als „Riesen“ wiederzugeben ist
  choice: die Refaïter
  alternative: die Riesen
  rationale: Der hebräische Ausdruck bezeichnet eine bekannte Gruppe. Der Zusammenhang legt außergewöhnliche Körpergröße nahe, doch die Übersetzung sollte diese Deutung nicht an die Stelle des Namens setzen.
- issue: Ob עֶרֶשׂ hier ein Bett oder einen Totenlager beziehungsweise Sarkophag bezeichnet
  choice: Bett
  alternative: Totenlager oder Sarkophag
  rationale: Die angegebenen Maße dienen im unmittelbaren Zusammenhang am ehesten als Hinweis auf Ogs außergewöhnliche Größe. Die speziellere funeräre Deutung ist möglich, wird vom hebräischen Text hier aber nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „sein Bett war ein Bett“ und die rhetorische Frage bleiben bewusst erhalten. Eigennamen folgen geläufigen deutschen Formen; antike Maße werden nicht umgerechnet.
