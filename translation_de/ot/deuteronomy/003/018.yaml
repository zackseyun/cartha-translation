source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: de
  text: 'Und zu jener Zeit gebot ich euch: »Jahwe, euer Gott, hat euch dieses Land gegeben, damit ihr es in Besitz nehmt. Alle kampftüchtigen Männer unter euch sollen bewaffnet[a] vor euren Brüdern, den Israeliten,[b] hinüberziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kampfbereit ausgerüstet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »euren Brüdern, den Söhnen Israels«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא
  choice: Und zu jener Zeit gebot ich euch
  rationale: „Gebieten“ gibt die verbindliche Anordnung von צוה würdig und prägnant wieder; „zu jener Zeit“ ist eine natürliche deutsche Entsprechung der Zeitangabe.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֵיכֶם bedeutet unmittelbar „euer Gott“.
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת
  choice: hat euch dieses Land gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortdauernder Bedeutung für die Angesprochenen.
- source_word: לְרִשְׁתָּהּ
  choice: damit ihr es in Besitz nehmt
  rationale: ירשׁ bezeichnet hier das Erlangen und Festhalten des Landes; die finale Formulierung bildet den hebräischen Infinitiv natürlich ab.
- source_word: חֲלוּצִים
  choice: bewaffnet
  rationale: Das Wort bezeichnet für den Kampf ausgerüstete beziehungsweise kampfbereit aufgestellte Männer; „bewaffnet“ ist im Kontext klar und knapp.
- source_word: תַּעַבְרוּ לִפְנֵי
  choice: sollen ... vor ... hinüberziehen
  rationale: Der Kontext verleiht dem Imperfekt verpflichtende Kraft; לִפְנֵי bezeichnet hier die vorausgehende Stellung beim militärischen Zug.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: euren Brüdern, den Israeliten
  rationale: „Brüder“ bewahrt das Verwandtschaftsbild; „den Israeliten“ gibt die erläuternde Apposition idiomatisch wieder.
- source_word: כָּל בְּנֵי חָיִל
  choice: alle kampftüchtigen Männer unter euch
  rationale: Die Wendung meint in diesem militärischen Zusammenhang die zum Kampf fähigen Männer, nicht lediglich Menschen mit innerem Mut. Die deutsche Satzstellung macht deutlich, dass die Wendung die zum Hinüberziehen Verpflichteten bezeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der maskulinen Gruppenbezeichnungen
  choice: Brüder ... Israeliten ... kampftüchtige Männer
  alternative: israelitische Stammesgenossen ... kampfbereite Leute
  rationale: Der militärische Zusammenhang und die ausdrücklich maskulinen hebräischen Wendungen sprechen hier für eine geschlechtsgenaue Wiedergabe. „Israeliten“ dient nur als idiomatische Apposition und hebt das „Brüder“-Bild nicht auf.
- issue: Bedeutung von בְּנֵי חָיִל
  choice: kampftüchtige Männer
  alternative: tapfere Männer
  rationale: Im Zusammenhang geht es um für den Feldzug geeignete Männer. Eine rein charakterliche Deutung als „tapfer“ wäre zu eng und könnte die militärische Funktion verschleiern.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede wird ohne das im Deutschen schwerfällige formelhafte „indem ich sagte“ eingeleitet. Die abschließende hebräische Wendung „alle Söhne der Tüchtigkeit/Kraft“ wurde zur Klarheit an den Satzanfang gestellt und militärisch-kontextuell als „alle kampftüchtigen Männer unter euch“ wiedergegeben.
