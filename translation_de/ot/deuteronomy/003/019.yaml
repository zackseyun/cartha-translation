base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: de
  text: Nur eure Frauen, eure kleinen Kinder[a] und euer Vieh – ich weiß, dass ihr viel Vieh habt – sollen in euren Ortschaften[b] bleiben, die ich euch gegeben habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Kinder“. Das hebräische Wort bezeichnet kleine Kinder oder abhängige Haushaltsangehörige.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Städten“. Das hebräische Wort kann Siedlungen unterschiedlicher Größe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Ausnahme von dem vorangehenden Befehl und bewahrt knapp die einschränkende Funktion.
- source_word: נְשֵׁיכֶם
  choice: eure Frauen
  rationale: Bezeichnet in diesem Zusammenhang die Ehefrauen der zum Kampf ausziehenden Männer; im Deutschen ist „eure Frauen“ die natürliche Formulierung.
- source_word: טַפְּכֶם
  choice: eure kleinen Kinder
  rationale: טַף bezeichnet kleine Kinder beziehungsweise die abhängigen jungen Angehörigen eines Haushalts. „Kleine Kinder“ gibt den konkreten Sinn in heutigem Deutsch wieder.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: euer Vieh / viel Vieh
  rationale: מִקְנֶה umfasst Haustiere und Herden allgemein, nicht nur Rinder. Die Wiederholung von „Vieh“ entspricht der hebräischen Wiederholung.
- source_word: יָדַעְתִּי כִּי
  choice: ich weiß, dass
  rationale: Bewahrt die ausdrückliche Ich-Aussage; die Gedankenstriche machen den begründenden Einschub erkennbar.
- source_word: יֵשְׁבוּ
  choice: sollen … bleiben
  rationale: Das Verb bedeutet grundsätzlich „sitzen/wohnen“, bezeichnet hier aber im Gegensatz zu den ausziehenden Männern das Zurückbleiben.
- source_word: בְּעָרֵיכֶם
  choice: in euren Ortschaften
  rationale: עִיר kann Siedlungen unterschiedlicher Größe bezeichnen. „Ortschaften“ vermeidet eine unnötige Festlegung auf große Städte.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: die ich euch gegeben habe
  rationale: Das Perfekt bezeichnet die bereits erfolgte Zuteilung mit fortdauernder Bedeutung.
