  naturalness: '„Den Bann an ihnen vollstrecken“ ist verständlich und im würdigen Register möglich. „Jede Stadt weihten wir vollständig der Vernichtung – Männer, Frauen und Kinder“ ist dagegen syntaktisch holprig: Die Aufzählung nach dem Gedankenstrich ist nicht klar als zu jeder Stadt gehörig markiert. „Samt den Männern, den Frauen und den Kindern“ ist modernes, eindeutiges Standarddeutsch.'
