base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: de
  text: 'Wir vollstreckten an ihnen den Bann[a], wie wir es mit Sihon, dem König von Heschbon, getan hatten: Jede Stadt samt den Männern, den Frauen und den Kindern weihten wir der vollständigen Vernichtung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir weihten sie der Vernichtung.“ Das hebräische Verb חרם ist ein Fachwort dafür, Menschen oder Dinge unter den Bann zu stellen und damit der Vernichtung zu übergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם אֹתָם
  choice: Wir vollstreckten an ihnen den Bann
  rationale: Das Hifil von חרם bezeichnet hier den technischen Akt, Menschen dem Bann und damit der Vernichtung zu übergeben. Die deutsche Wendung bewahrt diesen Fachbegriff und verschleiert die Härte des Geschehens nicht.
- source_word: כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: wie wir es mit Sihon, dem König von Heschbon, getan hatten
  rationale: Die Vergleichsklausel blickt auf das zuvor berichtete Handeln an Sihon zurück. „Mit Sihon“ ist im Deutschen für עשה ל idiomatisch; das Plusquamperfekt macht den Rückbezug deutlich.
- source_word: הַחֲרֵם
  choice: weihten wir vollständig der Vernichtung
  rationale: Der Infinitivus absolutus desselben Stammes nimmt die Bannhandlung erläuternd und verstärkend auf. „Vollständig“ gibt die Intensivierung wieder, während „der Vernichtung weihen“ den technischen Sinn von חרם erkennen lässt.
- source_word: כָּל עִיר
  choice: jede Stadt
  rationale: עיר bezeichnet hier die jeweils eroberte Stadt; „jede Stadt“ ist eine direkte und natürliche Wiedergabe.
- source_word: מְתִם הַנָּשִׁים וְהַטָּף
  choice: Männer, Frauen und Kinder
  rationale: Die drei substantivischen Gruppen werden als Aufzählung wiedergegeben. מְתִם bezeichnet Männer, טף die kleinen Kinder beziehungsweise die abhängigen jungen Familienangehörigen; im heutigen Deutsch ist „Kinder“ die klare, nicht unnötig verengende Bezeichnung.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם im Zusammenhang des Krieges
  choice: „den Bann vollstrecken“ im Hauptsatz und erläuternd „vollständig der Vernichtung weihen“
  alternative: „vollständig vernichten“ oder „dem Bann weihen“
  rationale: Die Formulierung bewahrt sowohl den technischen Charakter des hebräischen Bannbegriffs als auch dessen konkrete Folge, die vollständige Vernichtung. Sie mildert die Gewalt nicht ab, vermeidet aber auch, חרם auf ein gewöhnliches Verb für Töten oder Zerstören zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass der zweite Satzteil die Bannhandlung entfaltet; der Gedankenstrich führt die ausdrücklich genannten Menschengruppen an. Der technische Ausdruck „Bann“ wird wegen möglicher Unklarheit in der Fußnote erklärt.
