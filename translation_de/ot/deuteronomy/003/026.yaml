  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: de
  text: 'Doch Jahwe wurde euretwegen[a] zornig auf mich und hörte nicht auf mich. Jahwe sagte zu mir: »Genug![b] Rede mit mir nicht noch einmal über diese Sache.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um euretwillen«; auch möglich: »wegen euch«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Genug für dich«; eine knappe, scharfe Zurückweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: wurde zornig
  rationale: Das Hitpael von עבר bezeichnet in dieser Verbindung den aufkommenden oder geäußerten Zorn Jahwes. »Wurde zornig« gibt den Vorgang klar wieder, ohne die Stärke unnötig zu steigern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben. »Jahwe« ist die im Deutschen übliche Form der wissenschaftlich begründeten Aussprache.
- source_word: בִּי
  choice: auf mich
  rationale: In Verbindung mit »zornig werden« ist »auf mich« im Deutschen idiomatisch und bezeichnet die Person, gegen die sich der Zorn richtet.
- source_word: לְמַעַנְכֶם
  choice: euretwegen
  rationale: Die Wendung nennt hier das Volk als Anlass beziehungsweise Ursache für Jahwes Zorn über Mose. »Euretwegen« ist knapp, natürlich und lässt die im Kontext bestehende Spannung stehen.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: und hörte nicht auf mich
  rationale: שׁמע mit אֶל bedeutet, jemandem zuzuhören oder dessen Bitte Gehör zu geben. Die Formulierung bleibt nahe am Hebräischen und vermeidet die engere Festlegung auf eine Gebetserhörung.
- source_word: רַב לָךְ
  choice: Genug!
  rationale: Die knappe deutsche Zurückweisung gibt die Schärfe des hebräischen Idioms natürlich wieder; seine wörtlichere Form wird in der Fußnote bewahrt.
- source_word: אַל תּוֹסֶף דַּבֵּר
  choice: Rede … nicht noch einmal
  rationale: יסף mit Infinitiv bezeichnet die Wiederholung oder Fortsetzung einer Handlung. Zusammen mit עוֹד wird dies im Deutschen natürlich durch »nicht noch einmal« ausgedrückt.
- source_word: בַּדָּבָר הַזֶּה
  choice: über diese Sache
  rationale: דבר bezeichnet hier die Angelegenheit, über die Mose gebeten hat. »Diese Sache« ist verständlich und entspricht der sachlichen Unbestimmtheit des Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe »Jahwe« bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verantwortungszuschreibung in לְמַעַנְכֶם
  choice: euretwegen
  alternative: um euretwillen
  rationale: Moses führt Jahwes Zorn hier auf das Volk zurück. Die Übersetzung gibt diese Aussage unverändert wieder und harmonisiert sie nicht mit anderen Berichten über Moses eigenes Fehlverhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am hebräischen Erzählfluss; »Genug!« bewahrt die abrupte Schärfe der direkten Rede.
