id: DEU.3.22
reference: Deuteronomy 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: de
  text: Fürchtet sie nicht[a], denn Jahwe, euer Gott, ist es, der für euch kämpft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Habt keine Angst vor ihnen.«'
    reason: Lexikalische Alternative für ירא; beide Formulierungen geben die Bedeutung »fürchten, Angst haben« wieder.
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Fürchtet sie nicht
  rationale: Die Verneinung mit dem Imperfekt drückt hier ein Verbot aus. Das Verb ירא mit Objektsuffix bedeutet direkt »sie fürchten«; die deutsche Formulierung ist knapp, verständlich und bewahrt den unmittelbaren Bezug auf die Feinde.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für das vorausgehende Verbot ein; »denn« gibt diesen Zusammenhang in gehobenem, aber natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: אֱלֹהִים bezeichnet hier Israels Gott im Singular; das Suffix ist zweite Person Plural.
- source_word: הוּא
  choice: ist es, der
  rationale: Das selbstständige Pronomen hebt Jahwe als den Handelnden hervor. »ist es, der« bewahrt diese Betonung in natürlichem Deutsch.
- source_word: הַנִּלְחָם
  choice: kämpft
  rationale: Das Partizip von לחם beschreibt Jahwe als denjenigen, der für Israel kämpft; das deutsche Präsens gibt die fortdauernde beziehungsweise charakteristische Handlung angemessen wieder.
- source_word: לָכֶם
  choice: für euch
  rationale: 'Die Präposition ל bezeichnet hier den Vorteil beziehungsweise die Stellvertretung: Jahwe kämpft zugunsten Israels.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen. »Jahwe« bewahrt diesen Namenscharakter, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede steht entsprechend dem Hebräischen im Plural. Die emphatische Konstruktion »ist es, der« bewahrt die Hervorhebung des göttlichen Handelns.
