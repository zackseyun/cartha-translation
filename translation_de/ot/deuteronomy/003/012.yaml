base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: de
  text: 'Dieses Land nahmen wir damals in Besitz: von Aroër, das am Arnontal liegt, sowie die Hälfte des Berglands von Gilead mit seinen Städten. Ich gab es den Rubenitern und den Gaditern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: nahmen wir … in Besitz
  rationale: Das Verb bezeichnet im Zusammenhang von Eroberung und Landverteilung die aktive Besitznahme eines Gebiets.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: „Land“ ist die natürliche deutsche Bezeichnung für das eroberte Territorium.
- source_word: בָּעֵת הַהִוא
  choice: damals
  rationale: Die knappe, idiomatische deutsche Wiedergabe entspricht der zeitlichen Wendung „zu jener Zeit“.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: das Gebiet von Aroër an der Arnonschlucht
  rationale: מִן markiert hier den Ausgangspunkt beziehungsweise die territoriale Ausdehnung. „An“ gibt עַל bei einer Ortsangabe natürlich wieder; נחל bezeichnet in diesem Gelände einen Taleinschnitt beziehungsweise ein Wadi.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: sowie die Hälfte des Berglands von Gilead
  rationale: הַר kann in territorialen Beschreibungen eine Gebirgs- oder Berglandregion und nicht nur einen einzelnen Berg bezeichnen.
- source_word: וְעָרָיו
  choice: mit seinen Städten
  rationale: Das Suffix bezieht sich auf das Bergland von Gilead; „mit“ verbindet die zugehörigen Städte im Deutschen idiomatisch mit dem Gebiet.
- source_word: נָתַתִּי
  choice: Ich gab es
  rationale: Der Wechsel von der ersten Person Plural zur ersten Person Singular bleibt erhalten. Das ergänzte Pronomen verweist eindeutig auf das beschriebene Land.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: den Rubenitern und den Gaditern
  rationale: Die formal singularischen Volkszugehörigkeitsbezeichnungen stehen kollektiv für die beiden Stammesgruppen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung macht die territoriale Aufzählung verständlich, bewahrt aber den Wechsel von „wir“ zu „ich“. „Aroër“ folgt einer im Deutschen geläufigen Schreibweise des Ortsnamens; „Arnonschlucht“ vermittelt die Topografie ohne das weniger allgemein verständliche Fremdwort „Wadi“ im Haupttext.
