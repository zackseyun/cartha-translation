  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: de
  text: Die Sidonier nennen den Hermon[a] Sirjon, und die Amoriter[b] nennen ihn Senir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „den Berg Hermon“; im Hebräischen steht hier nur „Hermon“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht die Volksbezeichnung „der Amoriter“ in der Einzahl, ist hier aber kollektiv gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידֹנִים
  choice: die Sidonier
  rationale: Der gentilizische Plural bezeichnet die Bewohner beziehungsweise das Volk von Sidon; der bestimmte Artikel entspricht natürlichem deutschem Sprachgebrauch.
- source_word: יִקְרְאוּ
  choice: nennen
  rationale: קרא mit ל bezeichnet hier die Namensgebung; „nennen“ gibt diese Bedeutung im Deutschen knapp und natürlich wieder.
- source_word: לְחֶרְמוֹן
  choice: den Hermon
  rationale: Hermon ist der Eigenname des Berges. Die Präposition ל markiert bei קרא den Träger der Benennung und wird im Deutschen durch den Akkusativ wiedergegeben.
- source_word: שִׂרְיֹן
  choice: Sirjon
  rationale: Der von den Sidoniern gebrauchte Eigenname wird nach geläufiger deutscher Umschrift wiedergegeben.
- source_word: וְהָאֱמֹרִי
  choice: und die Amoriter
  rationale: Die morphologisch singularische Volksbezeichnung ist hier kollektiv gebraucht; das pluralische Verb und der Parallelismus zu „Sidonier“ stützen die Wiedergabe im Plural.
- source_word: יִקְרְאוּ לוֹ
  choice: nennen ihn
  rationale: Das Pronomen verweist auf den Hermon; „nennen ihn“ bildet die hebräische Benennungskonstruktion idiomatisch ab.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Der von den Amoritern gebrauchte Eigenname wird in der üblichen deutschen Form transliteriert.
