base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: de
  text: 'Damals nahmen wir alle seine Städte ein. Es gab keine Stadt, die wir ihnen[a] nicht abnahmen: sechzig Städte, das ganze Gebiet Argob, das Königreich Ogs im Baschan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „von ihnen“; der Plural bezieht sich wahrscheinlich auf Ogs Volk oder seine Streitkräfte, nicht auf Og allein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nahmen wir … ein
  rationale: לכד bezeichnet hier die militärische Einnahme; „einnehmen“ ist im Deutschen natürlich und präzise.
- source_word: כָּל עָרָיו
  choice: alle seine Städte
  rationale: עיר kann Stadt oder Ortschaft bedeuten; „Städte“ passt zum Eroberungskontext, und das Suffix bezieht sich auf Og.
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: Die knappe deutsche Wiedergabe entspricht der üblichen Zeitangabe und vermeidet eine schwerfällige Formulierung.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Es gab keine Stadt, die wir ihnen nicht abnahmen
  rationale: Die doppelte Verneinung und die Relativsatzstruktur des Hebräischen bleiben erhalten; „ihnen“ bewahrt ausdrücklich den Plural.
- source_word: מֵאִתָּם
  choice: ihnen
  rationale: Das hebräische Suffix steht im Plural und verweist offenbar auf Ogs Volk oder Streitkräfte, nicht auf Og allein.
- source_word: שִׁשִּׁים עִיר
  choice: sechzig Städte
  rationale: Direkte und kontextgerechte Wiedergabe der Zahl mit dem Substantiv.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: das ganze Gebiet Argob
  rationale: חבל bezeichnet hier einen Bezirk oder eine Region; „Gebiet“ ist klar und gegenwärtig.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: das Königreich Ogs im Baschan
  rationale: Die Konstruktion bestimmt das Gebiet Argob als Teil von Ogs Königreich im Baschan; der deutsche Genitiv gibt dies knapp wieder.
