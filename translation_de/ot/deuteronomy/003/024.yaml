source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: de
  text: Herr Jahwe[a], du hast begonnen, deinem Diener deine Größe und deine starke Hand zu zeigen. Denn welcher Gott im Himmel oder auf der Erde kann Taten vollbringen wie deine Taten und Machttaten wie die deinen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Adonaj JHWH, das heißt „Herr Jahwe“.'
    reason: Die Fußnote macht sichtbar, dass der hebräische Text an dieser Stelle einen Hoheitstitel und den Gottesnamen miteinander verbindet.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Verbindung aus dem Hoheitstitel Adonaj und dem Gottesnamen JHWH wird mit zwei unterscheidbaren Bezeichnungen wiedergegeben. „Herr Jahwe“ ist im Deutschen verständlich und vermeidet das missverständliche „Herr HERR“.
- source_word: הַחִלּוֹתָ
  choice: du hast begonnen
  rationale: Das Hifil-Perfekt bezeichnet hier den bereits begonnenen Vorgang, dessen Bedeutung in der Gegenwart fortbesteht.
- source_word: לְהַרְאוֹת
  choice: zu zeigen
  rationale: Das Hifil von ראה bedeutet hier idiomatisch „sehen lassen, zeigen“.
- source_word: עַבְדְּךָ
  choice: deinem Diener
  rationale: Im Gebetskontext bezeichnet עבד Mose als Gott unterstellten Diener; „Diener“ ist hier natürlicher als „Sklave“.
- source_word: גָּדְלְךָ
  choice: deine Größe
  rationale: Die direkte Wiedergabe bewahrt sowohl den Gedanken der Erhabenheit als auch den der Macht, ohne ihn einseitig festzulegen.
- source_word: יָדְךָ הַחֲזָקָה
  choice: deine starke Hand
  rationale: Die im Hebräischen geläufige bildhafte Bezeichnung für Gottes wirksame Macht bleibt formal und verständlich erhalten.
- source_word: מִי אֵל
  choice: welcher Gott
  rationale: Die rhetorische Frage stellt die Unvergleichlichkeit Jahwes heraus, ohne die sprachliche Erwähnung anderer Götter umzudeuten.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: im Himmel oder auf der Erde
  rationale: 'Das deutsche „oder“ entspricht in der rhetorischen Frage dem umfassenden Sinn: An keinem der beiden Orte gibt es einen vergleichbaren Gott.'
- source_word: יַעֲשֶׂה
  choice: kann … vollbringen
  rationale: Der Imperfekt hat in der rhetorischen Vergleichsfrage modale Kraft und fragt nach der Fähigkeit zu vergleichbaren Taten.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: Taten … wie deine Taten und Machttaten wie die deinen
  rationale: „Taten“ gibt מעשים wieder; „Machttaten“ bringt bei גבורות den Gedanken sichtbarer Machterweise zum Ausdruck und erhält den parallelen Vergleich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Herr HERR / Herr, der HERR
  rationale: Der Eigenname JHWH bleibt als „Jahwe“ erkennbar, während Adonaj mit „Herr“ wiedergegeben wird. So werden Titel und Name nicht miteinander verschmolzen.
- issue: Rhetorische Erwähnung eines אֵל
  choice: welcher Gott
  alternative: wer ist Gott
  rationale: Der Wortlaut fragt nach einem möglicherweise vergleichbaren Gott. Die Übersetzung bewahrt diese rhetorische Form und löst die darin liegende theologische Spannung nicht durch eine stärker monotheistisch formulierte Paraphrase auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetsanrede. Die Wiederholung „Taten … deine Taten“ bewahrt den hebräischen Parallelismus; „Machttaten“ ist ein verständlicher, leicht gehobener Ausdruck für machtvolle göttliche Taten.
