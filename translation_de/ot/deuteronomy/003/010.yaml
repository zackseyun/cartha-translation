  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: de
  text: alle Städte der Hochebene[a], ganz Gilead und ganz Baschan bis nach Salcha und Edrei, die Städte des Königreichs Ogs in Baschan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ebene“ beziehungsweise „des Tafellands“. Das hebräische Wort bezeichnet hier das ebene Hochland östlich des Jordan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: alle Städte der Hochebene
  rationale: מִישׁוֹר bezeichnet hier die ebene, hoch gelegene Landschaft östlich des Jordan; „Hochebene“ gibt die Topografie im Deutschen präziser wieder als das allgemeinere „Ebene“.
- source_word: וְכָל הַגִּלְעָד
  choice: ganz Gilead
  rationale: Bei einem Gebietsnamen ist „ganz“ im Deutschen natürlicher als „alles“ und bewahrt den umfassenden Sinn von כֹּל.
- source_word: וְכָל הַבָּשָׁן
  choice: ganz Baschan
  rationale: Der Regionsname wird in gebräuchlicher deutscher Bibelschreibung wiedergegeben; כֹּל bezeichnet die gesamte Region.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: bis nach Salcha und Edreï
  rationale: עַד bezeichnet die räumliche Ausdehnung; „bis nach“ ist bei Ortsnamen idiomatisches Deutsch. Die Namensformen orientieren sich an deutscher Bibeltradition und am Hebräischen.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: die Städte des Königreichs Ogs
  rationale: Die hebräische Constructusverbindung wird transparent als Zugehörigkeit zum Königreich Ogs wiedergegeben; die Apposition erhält im Deutschen zur Klarheit den bestimmten Artikel.
- source_word: בַּבָּשָׁן
  choice: in Baschan
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Königreichs und wird daher direkt mit „in“ wiedergegeben.
