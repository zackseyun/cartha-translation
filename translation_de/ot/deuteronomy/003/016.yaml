  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: de
  text: Den Rubenitern und den Gaditern gab ich das Gebiet von Gilead bis zum Arnontal[a], wobei die Mitte des Tals als Grenze diente, und bis zum Jabboktal, der Grenze der Ammoniter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נחל kann ein Bachtal, einen Wadi oder den dazugehörigen Wasserlauf bezeichnen. Hier steht „Tal“, weil anschließend dessen Mitte als Grenze genannt wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Söhne Ammons“; dies ist eine hebräische Verwandtschaftsbezeichnung für die Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: den Rubenitern und den Gaditern
  rationale: Die Gentilformen bezeichnen die beiden Stammesgruppen als Empfänger des Landes; die deutschen Volks- beziehungsweise Stammesbezeichnungen geben dies knapp und natürlich wieder.
- source_word: נָתַתִּי
  choice: gab ich
  rationale: Die einfache Wiedergabe bewahrt die Grundbedeutung von נתן; aus dem Zusammenhang ergibt sich, dass Mose das Gebiet zuwies.
- source_word: מִן הַגִּלְעָד וְעַד נַחַל אַרְנֹן
  choice: das Gebiet von Gilead bis zum Arnontal
  rationale: „Das Gebiet“ ist im Deutschen zur verständlichen Bezeichnung des Gegenstands von „gab“ ergänzt. נחל kann Tal, Wadi oder Wasserlauf bezeichnen; „Arnontal“ passt zur anschließenden Grenzziehung durch die Talmitte.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: wobei die Mitte des Tals als Grenze diente
  rationale: Die Formulierung gibt die appositionale Grenzangabe verständlich wieder, ohne die genaue topografische Gestalt näher festzulegen.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: und bis zum Jabboktal
  rationale: Die Wiedergabe mit „Tal“ bleibt mit dem ersten Vorkommen von נחל konsistent und vermeidet die Festlegung auf einen ständig wasserführenden Fluss.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: der Grenze der Ammoniter
  rationale: „Ammoniter“ ist die natürliche moderne deutsche Bezeichnung für das Volk; die hebräische Verwandtschaftsformel „Söhne Ammons“ wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die topografische Mehrdeutigkeit von נחל wird nicht auf „Fluss“ verengt; die im Deutschen notwendige Ergänzung „das Gebiet“ macht den Gegenstand der Landzuteilung ausdrücklich.
