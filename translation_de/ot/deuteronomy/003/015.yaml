lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: Und Machir
  rationale: Die Konjunktion וּ wird mit „Und“ wiedergegeben; לְ markiert Machir als Empfänger und wird im Deutschen durch den Dativ ausgedrückt. Der Personenname wird als „Machir“ transliteriert.
- source_word: נָתַתִּי
  choice: gab ich
  rationale: Das Qal-Perfekt 1. Person Singular von נתן wird in der rückblickenden Erzählung natürlich mit dem Präteritum „gab ich“ wiedergegeben.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die Partikel kennzeichnet das bestimmte direkte Objekt und besitzt hier keine selbstständige deutsche Entsprechung.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Der etablierte Gebietsname wird im Deutschen ohne Artikel gebraucht. Der hebräische Artikel wird in einer Fußnote kenntlich gemacht, ohne den Text durch das unnatürliche „das Gilead“ zu belasten.
theological_decisions: []
