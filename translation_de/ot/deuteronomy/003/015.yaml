  text: Und Machir gab ich Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gilead“; im Deutschen steht der Gebietsname gewöhnlich ohne Artikel.'
