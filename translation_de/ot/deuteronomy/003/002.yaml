source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: »Fürchte dich nicht vor ihm, denn ich habe ihn, sein ganzes Volk und sein Land in deine Hand gegeben. Du sollst mit ihm so verfahren, wie du mit Sihon, dem König der Amoriter, verfahren bist, der in Heschbon wohnte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Fürchte dich nicht vor ihm
  rationale: Die reflexive deutsche Wendung ist natürlich und bewahrt durch »vor ihm« das ausdrücklich genannte Objekt.
- source_word: בְיָדְךָ נָתַתִּי
  choice: ich habe … in deine Hand gegeben
  rationale: Bewahrt das hebräische Bild der Übergabe in jemandes Hand und damit zugleich den Gedanken der Verfügungsgewalt; das Perfekt stellt die Übergabe als bereits vollzogen dar.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: sein ganzes Volk und sein Land
  rationale: »Volk« gibt עַם ohne unbegründete Einengung auf das Heer wieder; »ganzes« drückt כָּל idiomatisch aus.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Du sollst mit ihm so verfahren, wie du … verfahren bist
  rationale: »Verfahren« gibt das breite עשה im Deutschen natürlich wieder, ohne die Handlung über das durch den Vergleich Gesagte hinaus festzulegen.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: mit Sihon, dem König der Amoriter
  rationale: Die Apposition bleibt erhalten; die Präposition »mit« wird durch die deutsche Konstruktion »mit jemandem verfahren« verlangt.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: der in Heschbon wohnte
  rationale: Der substantivierte bzw. prädikative Partizipialausdruck bezeichnet hier Sihons Wohn- oder Herrschaftssitz; »wohnte« ist modernes, ungekünsteltes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen ausdrücklich. Die Transliteration bewahrt diesen, statt ihn interpretierend durch einen Herrschaftstitel zu ersetzen.
- issue: Zeitwert von נָתַתִּי vor der bevorstehenden Schlacht
  choice: ich habe … gegeben
  alternative: ich werde … geben
  rationale: Die abgeschlossene Verbform wird als aus göttlicher Perspektive bereits feststehende Übergabe wiedergegeben. Die Zukunftsalternative würde den aspektuellen Nachdruck abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Wendung »in deine Hand gegeben« bleibt wegen ihrer Verständlichkeit und Quellennähe erhalten. Direkte Rede mit deutschen Anführungszeichen; keine konfessionell geprägte Zusatzdeutung.
