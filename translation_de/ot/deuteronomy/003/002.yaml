  source_fidelity: 'Der Entwurf gibt alle Sinnelemente des hebräischen Textes wieder: die Aufforderung, Og nicht zu fürchten, die bereits als vollzogen dargestellte Übergabe Ogs, seines gesamten Volkes und seines Landes sowie den Vergleich mit dem Vorgehen gegen Sihon. »In deine Hand gegeben« bewahrt das hebräische Bild und dessen Aussagegehalt. Das Perfekt »ich habe … gegeben« entspricht נָתַתִּי angemessen.'
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. »Mit ihm so verfahren« ist eine idiomatische deutsche Entsprechung für die bewusst allgemein gehaltene Wendung וְעָשִׂיתָ לּוֹ und vermeidet unzulässige Konkretisierung.
  terminology: »Jahwe« gibt den ausdrücklich verwendeten Gottesnamen konsistent wieder. »Sihon«, »Amoriter« und »Heschbon« sind im Deutschen etablierte Bibelformen. »Volk«, »Land« und »König« sind quellentreu und registergerecht.
