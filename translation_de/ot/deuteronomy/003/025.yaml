  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: de
  text: Lass mich doch hinüberziehen und das gute Land jenseits des Jordan sehen, dieses gute Bergland[a] und den Libanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen guten Berg“. Das hebräische Wort kann hier entweder einen bestimmten Berg oder das Bergland westlich des Jordan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Lass mich doch hinüberziehen
  rationale: Der Kohortativ bezeichnet Moses’ dringliche Bitte und nicht eine einfache Zukunftsaussage. „Lass mich … hinüberziehen“ gibt den volitiven Sinn wieder; „doch“ bewahrt den bittenden Ton der Partikel נָא in natürlichem Deutsch.
- source_word: וְאֶרְאֶה
  choice: und … sehen
  rationale: Der koordinierte Kohortativ nennt das mit dem Hinüberziehen verbundene Ziel. Die deutsche Satzstellung verbindet beide Verben natürlich.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: das gute Land
  rationale: Im territorialen Zusammenhang bezeichnet אֶרֶץ das Land; die feste Wendung „das gute Land“ bewahrt zugleich den für das Deuteronomium charakteristischen Klang.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Formulierung bezeichnet aus Moses’ Standort östlich des Flusses das Gebiet auf dessen anderer Seite. „Jenseits des Jordan“ ist knapp, idiomatisch und perspektivisch passend.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: dieses gute Bergland
  rationale: הָר kann sowohl einen einzelnen Berg als auch eine gebirgige Region bezeichnen. Im Zusammenhang der Landbeschreibung ist „Bergland“ wahrscheinlich, ohne die echte lexikalische Alternative zu verschweigen.
- source_word: וְהַלְּבָנוֹן
  choice: und den Libanon
  rationale: Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben; der Akkusativ ergibt sich aus der Fortführung des Objekts zu „sehen“.
theological_decisions:
- issue: 'Geografischer Sinn von הָהָר: einzelner Berg oder Bergland'
  choice: „dieses gute Bergland“ als regionale Bezeichnung
  alternative: „diesen guten Berg“ als Bezeichnung eines einzelnen Berges
  rationale: Der hebräische Singular kann kollektiv eine gebirgige Landschaft bezeichnen. Im Kontext der Beschreibung des Landes und neben dem Libanon liegt der regionale Sinn näher; die Fußnote erhält jedoch die formale und sachlich mögliche Singularlesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bitte klingt eindringlich, aber nicht altertümlich. Die appositionale Reihung des hebräischen Textes bleibt ohne zusätzliche Deutung erhalten.
