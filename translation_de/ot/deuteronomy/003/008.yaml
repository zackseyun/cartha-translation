  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: de
  text: Damals nahmen wir den beiden Königen der Amoriter jenseits des Jordan das Land ab, vom Arnontal bis zum Berg Hermon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: nahmen wir … ab
  rationale: Das Qal-Wayyiqtol der 1. Person Plural von לקח bezeichnet hier die Wegnahme beziehungsweise Inbesitznahme des Gebiets. Die deutsche Verbindung „jemandem etwas abnehmen“ gibt zusammen mit מִיַּד den Sinn natürlich wieder, ohne zusätzliche militärische Färbung einzutragen.
- source_word: בָּעֵת הַהִוא
  choice: Damals
  rationale: Die übliche Zeitangabe wird in knappem, natürlichem Deutsch wiedergegeben; „zu jener Zeit“ wäre formaler, aber nicht genauer.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das abgegrenzte Herrschaftsgebiet der beiden Könige, nicht die Erde insgesamt.
- source_word: מִיַּד
  choice: den … Königen … ab
  rationale: Wörtlich „aus der Hand von“. Die deutsche Dativkonstruktion mit „abnehmen“ bewahrt den Gedanken, dass das Land ihrer Gewalt beziehungsweise ihrem Besitz entzogen wurde, ohne eine im Deutschen schwerfällige wörtliche Wendung.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: den beiden Königen der Amoriter
  rationale: Die Wiedergabe folgt der hebräischen Status-constructus-Verbindung und ist im Deutschen klar und würdig.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: die jenseits des Jordan herrschten
  rationale: Das Hebräische sagt wörtlich nur „die jenseits des Jordan [waren]“. Im Zusammenhang bezieht sich der Relativsatz auf die Könige; „herrschten“ macht die elliptische Zuordnung in natürlichem Deutsch verständlich, ohne das bezeichnete Gebiet genauer festzulegen.
- source_word: מִנַּחַל אַרְנֹן
  choice: vom Arnontal
  rationale: נַחַל kann ein Wadi, ein Bachbett oder das dazugehörige Tal bezeichnen. „Arnontal“ ist verständliches modernes Deutsch und vermeidet die möglicherweise missverständliche Annahme eines ständig wasserführenden Flusses.
- source_word: עַד הַר חֶרְמוֹן
  choice: bis zum Berg Hermon
  rationale: עַד bezeichnet die räumliche Ausdehnung; „bis zum Berg Hermon“ gibt diese Grenzangabe genau und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wendung „aus der Hand“ wird idiomatisch durch „jemandem etwas abnehmen“ wiedergegeben. Die geografische Mehrdeutigkeit von נַחַל bleibt durch eine Fußnote sichtbar.
