  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: de
  text: Steig auf den Gipfel des Pisga und richte deinen Blick nach Westen[a], nach Norden, nach Süden und nach Osten. Sieh mit deinen Augen; denn du wirst diesen Jordan[b] nicht überqueren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zum Meer hin“; dies ist die übliche hebräische Bezeichnung für „nach Westen“.
    reason: cultural_note
  - marker: b
    text: 'Oder: „diesen Jordanfluss“. Im Hebräischen steht einfach „diesen Jordan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Steig auf
  rationale: Der Qal-Imperativ bezeichnet eine Aufwärtsbewegung. „Steig auf“ ist im Deutschen natürlich und bewahrt die Richtung des Befehls.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: den Gipfel des Pisga
  rationale: רֹאשׁ bedeutet hier „Gipfel“ oder „Spitze“; הַפִּסְגָּה wird als geografischer Eigenname „Pisga“ verstanden. Die Formulierung ist prägnant und idiomatisch.
- source_word: וְשָׂא עֵינֶיךָ
  choice: und richte deinen Blick
  rationale: Die hebräische Wendung bedeutet, die Augen zu erheben beziehungsweise den Blick gezielt in eine Richtung zu wenden. „Richte deinen Blick“ ist gegenwärtiges, würdiges Deutsch.
- source_word: יָמָּה
  choice: nach Westen
  rationale: Die Richtungsform von יָם, „Meer“, bedeutet aus israelitischer Perspektive konventionell „westwärts“. Die kulturelle Bildlichkeit wird in einer Fußnote erläutert.
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: nach Norden, nach Süden und nach Osten
  rationale: Die drei Richtungsformen werden einheitlich und in der Reihenfolge des Hebräischen wiedergegeben.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: Sieh es mit eigenen Augen
  rationale: Die Wiederholung von „Augen“ wird bewahrt und das im Deutschen naheliegende emphatische Verständnis ausgedrückt. Das Objekt „es“ ergibt sich aus dem zu überblickenden Land im Kontext.
- source_word: כִּי לֹא תַעֲבֹר
  choice: denn du wirst ... nicht überqueren
  rationale: כִּי begründet den vorausgehenden Befehl. Bei einem Fluss ist „überqueren“ eine natürliche Wiedergabe von עבר.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: diesen Jordan
  rationale: Der Demonstrativ הַזֶּה wird ausdrücklich mit „diesen“ wiedergegeben; „Jordan“ kann im Deutschen wie im Hebräischen ohne den Zusatz „Fluss“ stehen.
theological_decisions: []
