base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: de
  text: Jaïr, der Sohn Manasses, nahm das ganze Gebiet von Argob bis an die Grenze der Geschuriter und Maachatiter ein. Er nannte sie nach seinem Namen Hawwot-Jaïr, das Baschan, bis zum heutigen Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Und er nannte sie nach seinem eigenen Namen, das Baschan, Hawwot-Jaïr.“ Der hebräische Satzbau ist stark verdichtet; insbesondere die genaue Beziehung von „das Baschan“ zu den übrigen Satzgliedern kann unterschiedlich verstanden werden. Hawwot-Jaïr bedeutet wahrscheinlich „die Dörfer Jaïrs“ oder „die Zeltsiedlungen Jaïrs“.'
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: Gebiet
  rationale: Im geografischen Zusammenhang bezeichnet חֶבֶל ein abgegrenztes Landgebiet; „Gebiet“ ist natürlich und sachlich.
- source_word: אַרְגֹּב
  choice: Argob
  rationale: Der Ortsname wird transliteriert.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: bis an die Grenze der Geschuriter und der Maachatiter
  rationale: גְּבוּל bezeichnet hier die Grenze; die Gentilicia werden als Volksbezeichnungen wiedergegeben.
- source_word: לָקַח
  choice: nahm … in Besitz
  rationale: Bei einem Landgebiet bezeichnet לָקַח hier die Inbesitznahme; diese idiomatische Wiedergabe ist im Deutschen klarer als bloßes „nahm“.
- source_word: וַיִּקְרָא אֹתָם
  choice: Er benannte sie
  rationale: Das maskuline Pluralsuffix „sie“ wird bewahrt, obwohl sein genauer Bezug in der verdichteten Syntax nicht eindeutig ist.
- source_word: עַל שְׁמוֹ
  choice: nach sich selbst
  rationale: Die Wendung bedeutet, etwas nach dem eigenen Namen zu benennen.
- source_word: אֶת הַבָּשָׁן
  choice: nämlich Baschan
  rationale: Die schwierige Konstruktion wird appositionell verstanden; „nämlich“ macht diesen Bezug lesbar, ohne die Unsicherheit zu verschweigen.
- source_word: חַוֺּת יָאִיר
  choice: Hawwot-Jaïr
  rationale: Die Verbindung fungiert als Ortsname und wird daher transliteriert; die mögliche Wortbedeutung wird in einer Fußnote angegeben.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: So heißen sie bis heute
  rationale: Die idiomatische Formulierung verdeutlicht, dass der vergebene Name bis zur Gegenwart des Erzählers fortbestand.
