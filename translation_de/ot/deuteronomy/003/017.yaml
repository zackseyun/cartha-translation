  text: וְ/הָֽ/עֲרָבָ֖ה וְ/הַ/יַּרְדֵּ֣ן וּ/גְבֻ֑ל מִ/כִּנֶּ֗רֶת וְ/עַ֨ד יָ֤ם הָֽ/עֲרָבָה֙ יָ֣ם הַ/מֶּ֔לַח תַּ֛חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּ֖ה מִזְרָֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: de
  text: dazu die Araba mit dem Jordan als Grenze, von Kinneret bis zum Meer der Araba, dem Salzmeer[a], unterhalb der Hänge des Pisga nach Osten hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ist das Tote Meer.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: die Araba
  rationale: In dieser Grenzbeschreibung bezeichnet das Wort die Jordansenke als geografischen Eigennamen, nicht allgemein eine Ebene.
- source_word: הַיַּרְדֵּן
  choice: der Jordan
  rationale: Der geläufige deutsche Gewässername genügt; der Zusatz »Fluss« ist nicht erforderlich.
- source_word: גְבֻל
  choice: als Grenze
  rationale: Der hebräische Nominalsatz ist knapp und elliptisch; diese Formulierung gibt die Grenzfunktion des Jordan natürlich wieder.
- source_word: מִכִּנֶּרֶת
  choice: von Kinneret
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, quellenahen Form wiedergegeben; der hebräische Text nennt nicht ausdrücklich den See.
- source_word: יָם הָעֲרָבָה
  choice: das Meer der Araba
  rationale: Die wörtliche geografische Bezeichnung bleibt erhalten und wird anschließend durch »Salzmeer« näher bestimmt.
- source_word: יָם הַמֶּלַח
  choice: das Salzmeer
  rationale: Dies entspricht unmittelbar der hebräischen Benennung; der heute geläufige Name »Totes Meer« wird in einer Fußnote angegeben.
- source_word: תַּחַת
  choice: unterhalb
  rationale: Die topografische Lagebeziehung wird wiedergegeben, ohne sie als Himmelsrichtung umzudeuten.
- source_word: אַשְׁדֹּת
  choice: die Hänge
  rationale: Im geografischen Zusammenhang bezeichnet der Ausdruck Abhänge oder Gefälle am Pisga.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Der geografische Eigenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Die adverbiale Richtungsangabe wird knapp und natürlich wiedergegeben; ihre genaue syntaktische Zuordnung bleibt wie im Hebräischen offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form einer fortlaufenden Gebietsaufzählung bleibt erhalten. »Kinneret« wird nicht erklärend zu »See Kinneret« erweitert, da der Ausgangstext nur den Namen nennt.
