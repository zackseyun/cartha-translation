  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: de
  text: Alle diese Städte waren befestigt, mit einer hohen Mauer, Doppeltoren und Riegeln; dazu kamen sehr viele Ortschaften im offenen Land[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dörfer im offenen Land« beziehungsweise »unbefestigte Ortschaften«. Das Hebräische stellt diese Siedlungen den soeben beschriebenen befestigten Städten gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: befestigt
  rationale: Das Adjektiv bezeichnet gegen Angriffe gesicherte Städte; »befestigt« ist im Deutschen präzise und natürlich.
- source_word: חוֹמָה גְבֹהָה
  choice: mit einer hohen Mauer
  rationale: Die singularische Form des Hebräischen wird bewahrt; sie beschreibt die Befestigungsmauer der jeweiligen Stadt kollektiv.
- source_word: דְּלָתַיִם
  choice: Doppeltore
  rationale: Die Dualform bezeichnet paarige Tür- beziehungsweise Torflügel. Im Zusammenhang befestigter Städte gibt »Doppeltore« sowohl die städtischen Zugänge als auch die Zweiflügeligkeit wieder.
- source_word: וּבְרִיחַ
  choice: und Riegeln
  rationale: Der Singular kann hier kollektiv verstanden werden; der deutsche Plural passt natürlich zu den Toranlagen mehrerer Städte.
- source_word: לְבַד
  choice: dazu kamen
  rationale: Die Wendung markiert hier eine zusätzliche Gruppe von Siedlungen neben den befestigten Städten.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: Ortschaften im offenen Land
  rationale: Die Formulierung bewahrt den Gegensatz zu den zuvor genannten befestigten Städten, ohne die Bedeutung ausschließlich auf »Dörfer« oder »unbefestigte Städte« festzulegen.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr viele
  rationale: Die natürliche deutsche Wendung gibt die starke Mengenangabe knapp und genau wieder.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Alle diese Städte waren
  rationale: Die im Hebräischen nominale Aussage wird im Deutschen mit einer Kopula natürlich wiedergegeben.
