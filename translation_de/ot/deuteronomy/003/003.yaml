  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: de
  text: So gab Jahwe, unser Gott, auch Og, den König von Baschan, und sein ganzes Volk in unsere Hand. Wir schlugen ihn, bis ihm kein Überlebender mehr blieb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „bis er ihm keinen Entronnenen übrig ließ“; die Bezugnahme der nur durch die Verbform bezeichneten Person ist im Hebräischen syntaktisch schwierig.'
    reason: Die Anmerkung bewahrt die aktive hebräische Verbform und weist auf die syntaktische Schwierigkeit hin, ohne die Bezugnahme dogmatisch festzulegen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: gab ... in unsere Hand
  rationale: Die Wiedergabe bewahrt das hebräische Bild für die Auslieferung in die Gewalt eines Gegners und ist im Deutschen verständlich.
- source_word: גַּם
  choice: auch
  rationale: Das Wort verbindet die Niederlage Ogs additiv mit dem zuvor berichteten Sieg über Sihon.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, den König von Baschan
  rationale: Die Apposition gibt Eigenname, Herrschertitel und Gebiet in natürlichem Standarddeutsch wieder.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: עַם bezeichnet das Volk und ist weiter gefasst als „Heer“, auch wenn der Zusammenhang militärisch ist.
- source_word: וַנַּכֵּהוּ
  choice: Wir schlugen ihn
  rationale: „Schlagen“ bewahrt den konkreten, gewaltsamen Sinn von נכה im Kampf; das singularische Objekt des Hebräischen bleibt erhalten.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: bis ihm kein Überlebender mehr blieb
  rationale: Die idiomatische deutsche Formulierung drückt die vollständige Vernichtung aus, ohne einen im Hebräischen nicht ausdrücklich genannten Handelnden für „übrig lassen“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Umschrift bewahrt den persönlichen Gottesnamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der Vernichtungsaussage
  choice: bis ihm kein Überlebender mehr blieb
  alternative: bis ihm kein Entronnener übrig gelassen wurde
  rationale: Die gewählte Fassung gibt die umfassende militärische Vernichtung unverharmlost wieder, lässt aber die im Hebräischen nicht ausdrücklich bezeichnete Agensfrage offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild „in unsere Hand geben“ und der singularische Bezug „ihn“ wurden trotz einer gewissen Spannung zum genannten Volk bewusst beibehalten.
