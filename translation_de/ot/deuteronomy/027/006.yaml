  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: de
  text: Aus ganzen Steinen[a] sollst du den Altar Jahwes, deines Gottes, bauen und darauf Brandopfer für Jahwe, deinen Gott, darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbehauenen Steinen“. Das Hebräische bezeichnet die Steine wörtlich als „ganz“ oder „vollständig“; „unbehauen“ ergibt sich aus der vorausgehenden Anweisung, an ihnen kein eisernes Werkzeug zu verwenden (Vers 5).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: unversehrte Steine
  rationale: שְׁלֵמוֹת bezeichnet die Steine unmittelbar als ganz, vollständig oder unversehrt. „Unversehrte Steine“ gibt diesen Wortsinn natürlich wieder, ohne die aus Vers 5 erschlossene Deutung „unbehauen“ in den Haupttext einzutragen.
- source_word: תִּבְנֶה
  choice: sollst du … bauen
  rationale: Das Imperfekt hat in diesem Anweisungskontext verpflichtende Kraft. Die deutsche Formulierung bewahrt den feierlichen Gebotscharakter.
- source_word: מִזְבַּח
  choice: Altar
  rationale: „Altar“ ist die übliche und genaue deutsche Bezeichnung für die Opferstätte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Verbindung mit dem Suffix der 2. Person Singular bezeichnet unmittelbar „dein Gott“.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: und darauf … darbringen
  rationale: Die Hifil-Form von עלה bezeichnet mit einem Opfer als Objekt dessen Darbringung. „Darbringen“ ist im Deutschen idiomatisch und bewahrt den kultischen Sinn.
- source_word: עוֹלֹת
  choice: Brandopfer
  rationale: עוֹלָה ist die feste Bezeichnung für ein Opfer, das vollständig verbrannt wird; „Brandopfer“ ist das etablierte deutsche Äquivalent.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung bzw. Widmung des Opfers. „Für Jahwe“ klingt im deutschen Opferkontext natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen als Namen und vermeidet seine Ersetzung durch einen Titel.
- issue: Ob שְׁלֵמוֹת deutend als „unbehauen“ wiederzugeben ist
  choice: unversehrte Steine
  alternative: unbehauene Steine
  rationale: Das Adjektiv selbst bedeutet „ganz“, „vollständig“ oder „unversehrt“. „Unbehauen“ ergibt sich plausibel aus dem Verbot eiserner Werkzeuge in Vers 5, ist aber eine kontextuelle Präzisierung und wird deshalb in der Fußnote festgehalten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Gebotsstil. Die Voranstellung „Aus unversehrten Steinen“ folgt dem Nachdruck der hebräischen Wortstellung. Der Gottesname wird in der geläufigen deutschen Form „Jahwe“ wiedergegeben.
