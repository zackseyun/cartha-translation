source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: de
  text: 'Verflucht ist der Mann[a], der ein geschnitztes Bild oder ein gegossenes Bild[b] anfertigt, das für Jahwe ein Gräuel ist, ein Werk der Hände eines Handwerkers, und es im Verborgenen aufstellt. Und das ganze Volk soll antworten und sagen: „Amen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „der Mann“; der maskuline Singular steht hier in einer repräsentativen Rechtsformel.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet ein durch Gießen hergestelltes Bild, häufig aus Metall.
    reason: lexical_clarification
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Gibt die prädikative Bundesfluchformel knapp, verständlich und mit ihrer rechtlich-feierlichen Kraft wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Bewahrt den grammatisch maskulinen Singular der hebräischen Rechtsformel; seine repräsentative Funktion wird in einer Fußnote erläutert.
- source_word: יַעֲשֶׂה
  choice: anfertigt
  rationale: Im Zusammenhang mit der Herstellung eines Bildes ist „anfertigt“ konkreter und natürlicher als das allgemeinere „macht“.
- source_word: פֶסֶל
  choice: ein geschnitztes Bild
  rationale: Bezeichnet ein durch Schnitzen oder Behauen hergestelltes Bild und ist präziser als das allgemeinere „Götzenbild“.
- source_word: מַסֵּכָה
  choice: ein gegossenes Bild
  rationale: Bewahrt die Art der Herstellung, ohne „Metall“ ausdrücklich in den Haupttext einzutragen, da dieses im hebräischen Ausdruck nicht eigens genannt wird.
- source_word: תּוֹעֲבַת יְהוָה
  choice: einen Gräuel für Jahwe
  rationale: Erhält die starke wertende Aussage des Nominalausdrucks und gibt die Beziehung zu Jahwe natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: das Werk der Hände eines Handwerkers
  rationale: Folgt dem konkreten hebräischen Bild und hebt hervor, dass das verehrte Objekt von Menschen hergestellt ist.
- source_word: וְשָׂם בַּסָּתֶר
  choice: und es im Verborgenen aufstellt
  rationale: „Aufstellt“ passt idiomatisch zu einem Bild; „im Verborgenen“ bewahrt den substantivischen Ausdruck für heimliche Platzierung.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: Und das ganze Volk soll antworten und sagen
  rationale: Bewahrt die beiden hebräischen Verben und den feierlich-liturgischen Charakter der vorgeschriebenen Antwort.
- source_word: אָמֵן
  choice: Amen
  rationale: Der etablierte liturgische Ausdruck wird als erkennbare Bekräftigungsformel beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Generisches Maskulinum in der Bundesfluchformel
  choice: der Mann
  alternative: wer / die Person
  rationale: Der Haupttext bildet den maskulinen Singular der hebräischen Formel ab. Die Fußnote stellt klar, dass er hier repräsentativ gebraucht wird und die Vorschrift nicht auf Männer beschränkt.
- issue: Semantische Stärke von תּוֹעֵבָה
  choice: Gräuel
  alternative: etwas Verabscheuungswürdiges
  rationale: „Gräuel“ bewahrt die starke kultisch-moralische Wertung des hebräischen Ausdrucks, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ton der Bundesfluchformel. Konkrete Herstellungsbegriffe und die responsive Liturgie bleiben erhalten; die Gedankenstriche bilden die appositionellen Beschreibungen des Bildes transparent ab.
