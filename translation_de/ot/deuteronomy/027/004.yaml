  terminology: „Jordan“, „Berg Ebal“, „Steine“ und „Kalk“ sind angemessen. Der Plural „Anweisungen“ passt zur deutschen idiomatischen Umschreibung der hebräischen Wendung, ohne den Inhalt der Anweisung zu ergänzen. Die Fußnote verwendet die etablierten Namen Ebal und Garizim.
