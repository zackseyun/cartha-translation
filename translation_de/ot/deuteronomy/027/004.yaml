  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: de
  text: Wenn ihr den Jordan überquert habt, sollt ihr diese Steine, für die ich euch heute Anweisungen gebe, auf dem Berg Ebal[a] aufrichten und sie mit Kalk bestreichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textüberlieferungen, besonders der Samaritanische Pentateuch, lesen hier „Berg Garizim“ statt „Berg Ebal“.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Wenn ihr … überquert habt
  rationale: Die Konstruktion aus וְהָיָה und ב plus Infinitivus constructus führt einen zukünftigen zeitlichen Umstand ein. Das deutsche Perfekt im Nebensatz bezeichnet natürlich die vollzogene Überquerung vor dem Aufrichten der Steine.
- source_word: הַיַּרְדֵּן
  choice: den Jordan
  rationale: Der Eigenname bezeichnet hier den Fluss; im Deutschen ist „den Jordan“ ohne Zusatz „Fluss“ idiomatisch.
- source_word: תָּקִימוּ
  choice: sollt ihr … aufrichten
  rationale: Der Hifil von קום bezeichnet hier das Aufstellen beziehungsweise Aufrichten der Steine. „Aufrichten“ ist präzise und würdig.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: diese Steine
  rationale: Die schlichte Sachbezeichnung bleibt erhalten; „Denkmäler“ würde mehr in den Text hineinlegen.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: derentwegen ich euch heute Anweisung gebe
  rationale: Da nicht die Steine selbst befohlen werden, sondern eine Handlung in Bezug auf sie, vermeidet diese Wiedergabe das missverständliche „die ich euch gebiete“. Sie erhält zugleich den gegenwärtigen Anweisungscharakter des Partizips.
- source_word: בְּהַר עֵיבָל
  choice: auf dem Berg Ebal
  rationale: ב mit dem Bergnamen bezeichnet den Ort auf dem Berg; die deutsche Form nennt die Geländebezeichnung ausdrücklich.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: und sie mit Kalk verputzen
  rationale: שׂוד bezeichnet das Bestreichen beziehungsweise Verputzen, שׂיד das dafür verwendete Kalkmaterial. Die Formulierung ist im Deutschen natürlich und bewahrt beide Bestandteile.
theological_decisions:
- issue: Ortsname in Deuteronomium 27,4
  choice: Berg Ebal
  alternative: Berg Garizim
  rationale: Der vorgegebene WLC-Text und die masoretische Überlieferung lesen עֵיבָל („Ebal“). Der Samaritanische Pentateuch und weitere textliche Zeugnisse bieten „Garizim“; diese bedeutsame Variante wird deshalb in einer Fußnote dokumentiert, ohne den Ausgangstext zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede bleibt entsprechend dem hebräischen Plural durchgehend im Plural; das deontische „sollt“ gibt die Anweisung wieder, ohne unnötig altertümlich zu klingen.
