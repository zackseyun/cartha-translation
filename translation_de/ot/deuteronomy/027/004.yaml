  source_fidelity: 'Der Entwurf folgt dem WLC-Text: Die Adressaten sollen nach der Überquerung des Jordan diese Steine auf dem Berg Ebal aufrichten und mit Kalk bestreichen. Die Textvariante „Garizim“ ist korrekt als Variante des samaritanischen Pentateuchs vermerkt. Die Formulierung „derentwegen ich euch heute Anweisung gebe“ macht jedoch die im Hebräischen knappe Relativbeziehung unnötig abstrakt und singularisiert „Anweisung“; sie ist weniger unmittelbar als eine idiomatische deutsche Wiedergabe.'
