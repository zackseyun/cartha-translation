  terminology: „Friedensopfer“ ist eine vertretbare, etablierte Bezeichnung für שְׁלָמִים. Die Fußnote dokumentiert mit „Gemeinschaftsopfer“ und „Heilsopfer“ sinnvolle etablierte Alternativen. „Jahwe“ ist die im Deutschen übliche wissenschaftlich orientierte Form des Gottesnamens und stimmt sachlich mit dem englischen Audit-Trail „Yahweh“ überein.
