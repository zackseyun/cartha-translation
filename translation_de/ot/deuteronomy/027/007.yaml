  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: de
  text: Du sollst Friedensopfer[a] darbringen, dort essen und dich vor Jahwe, deinem Gott, freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“ oder „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Du sollst … darbringen
  rationale: Im kultischen Zusammenhang bezeichnet זבח das Vollziehen eines Opfers. „Darbringen“ ist im Deutschen natürlich und würdig und vermeidet, den Vorgang auf das Schlachten zu verengen.
- source_word: שְׁלָמִים
  choice: Friedensopfer
  rationale: שְׁלָמִים bezeichnet eine Opfergattung, die mit Wohlergehen, Gemeinschaft und einer gemeinsamen Opfermahlzeit verbunden ist. „Friedensopfer“ bewahrt den traditionellen Bezug zur Wortwurzel, ohne die anderen Bedeutungsaspekte auszuschließen; diese werden in der Fußnote genannt.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: dort essen
  rationale: Die Übersetzung gibt sowohl die einfache Bedeutung von אָכַל („essen“) als auch die Ortsangabe שָׁם („dort“) knapp und idiomatisch wieder.
- source_word: וְשָׂמַחְתָּ
  choice: und dich … freuen
  rationale: שׂמח bezeichnet hier die festliche Freude im Zusammenhang mit Gottesdienst und Opfermahl. „Sich freuen“ ist im modernen Standarddeutsch natürlicher als „frohlocken“, ohne den feierlichen Sinn abzuschwächen.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bedeutet im kultischen Zusammenhang „vor“ beziehungsweise „in der Gegenwart von“. „Vor“ ist prägnant und bewahrt die räumlich-theologische Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Das hebräische Suffix der zweiten Person Singular wird ausdrücklich bewahrt und entspricht der singularischen Anrede Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst und keinen Herrschaftstitel. Die Wiedergabe als „Jahwe“ erhält diesen Unterschied; die deutsche Schreibform folgt dem üblichen modernen Standard.
- issue: Wiedergabe der Opfergattung שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: Der Begriff benennt eine Opfergattung und umfasst Aspekte von Frieden, Wohlergehen und Gemeinschaft. Keine einzelne deutsche Entsprechung bildet das gesamte Bedeutungsspektrum ab; deshalb steht die traditionelle Bezeichnung im Haupttext, während echte lexikalische Alternativen in der Fußnote erhalten bleiben.
- issue: Modalität der Verbfolge
  choice: Du sollst … darbringen, … essen und … freuen
  alternative: Du wirst … darbringen, … essen und … freuen
  rationale: Die Verbformen stehen in einem anweisenden Zusammenhang. „Du sollst“ gibt diesen verpflichtenden Sinn im Deutschen klar wieder, ohne aus jeder verbundenen Verbform einen schwerfälligen eigenen Satz zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit singularischer Anrede. Die koordinierte Satzstruktur folgt dem Hebräischen, wird aber durch nur ein einleitendes „Du sollst“ idiomatisch gestrafft. Der Gottesname erscheint als „Jahwe“.
