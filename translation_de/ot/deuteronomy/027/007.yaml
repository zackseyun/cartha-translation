  source_fidelity: 'Die Übersetzung gibt die drei verbundenen, im anweisenden Kontext stehenden Verbformen vollständig wieder: das Darbringen von Schlacht-/Opfergaben, das Essen an diesem Ort und die Freude vor Jahwe. „Du sollst“ regiert idiomatisch alle nachfolgenden koordinierten Infinitive. Die Singularanrede und „deinem Gott“ entsprechen dem hebräischen Suffix. „Vor Jahwe“ bewahrt לִפְנֵי, ohne eine zusätzliche Deutung einzutragen.'
