source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: de
  text: 'Verflucht ist, wer mit irgendeinem Tier schläft.[a] Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Partizip steht im maskulinen Singular. Daher ist auch die Wiedergabe möglich: »Verflucht ist der Mann, der mit irgendeinem Tier schläft.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das prädikative Adjektiv eröffnet eine feierliche Bundesfluchformel. »Verflucht« ist im modernen Deutsch klar und wahrt ihre rechtlich-liturgische Kraft.
- source_word: שֹׁכֵב
  choice: wer … schläft
  rationale: Das Partizip von שׁכב bezeichnet hier im rechtlichen Zusammenhang euphemistisch Geschlechtsverkehr. Die Verbindung »mit … schlafen« bewahrt diesen verhüllenden Ausdruck und klingt im Deutschen natürlich.
- source_word: עִם
  choice: mit
  rationale: Die Präposition gehört zur deutschen idiomatischen Verbindung »mit jemandem/einem Tier schlafen«.
- source_word: כָּל
  choice: irgendeinem
  rationale: Vor dem unbestimmten Singular בְּהֵמָה hat כָּל distributive Bedeutung; »irgendeinem Tier« gibt dies in einer rechtlichen Aussage idiomatisch wieder.
- source_word: בְּהֵמָה
  choice: Tier
  rationale: Der Ausdruck kann besonders Nutz- oder größere Landtiere bezeichnen, doch hier ist die allgemeine Kategorie gemeint. »Tier« ist klar und nicht unnötig eng.
- source_word: וְאָמַר
  choice: Und … soll sagen
  rationale: Waw mit Qatal setzt die zeremonielle Anweisung fort. »Soll sagen« gibt die geforderte liturgische Antwort natürlich und verbindlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Dies entspricht dem kollektiven Sinn der hebräischen Wendung, ohne die im unmittelbaren Wortlaut nicht genannte Bezeichnung »Israel« hinzuzufügen.
- source_word: אָמֵן
  choice: Amen
  rationale: Die eingebürgerte liturgische Bekräftigung wahrt Form und Funktion des hebräischen Ausdrucks besser als eine Umschreibung wie »So sei es«.
theological_decisions:
- issue: Maskulines substantiviertes Partizip in der Fluchformel
  choice: wer mit irgendeinem Tier schläft
  alternative: der Mann, der mit irgendeinem Tier schläft
  rationale: Das Hebräische verwendet ein maskulines Partizip im Singular, nennt aber nicht ausdrücklich das Substantiv »Mann«. Das deutsche »wer« übersetzt die substantivische Funktion natürlich, ohne ein nicht vorhandenes Nomen einzufügen; eine Fußnote macht die grammatische Form und die mögliche ausdrücklich männliche Wiedergabe transparent.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem feierlichen Rhythmus einer Bundeszeremonie. Der sexuelle Sachverhalt bleibt wie im Hebräischen euphemistisch formuliert; die Anführungszeichen kennzeichnen die gemeinsame liturgische Antwort.
