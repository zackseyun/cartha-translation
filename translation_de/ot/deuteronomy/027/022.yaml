  naturalness: Modernes, würdiges Standarddeutsch mit angemessen rechtlich-liturgischem Register. Die dative Apposition »der Tochter seines Vaters oder der Tochter seiner Mutter« ist grammatisch korrekt und macht die nähere Bestimmung von »Schwester« transparent.
  terminology: »Verflucht«, »mit ... schlafen«, »Schwester«, »Volk« und »Amen« sind treffende und im biblisch-rechtlichen Kontext idiomatische Entsprechungen. Die Formulierung vermeidet sowohl unnötige klinische Explikation als auch eine sachlich nicht gedeckte Einschränkung auf Halbgeschwister.
