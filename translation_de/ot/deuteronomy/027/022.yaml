source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer mit seiner Schwester schläft, der Tochter seines Vaters oder der Tochter seiner Mutter. Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Prädikative Formulierung der bundesrechtlichen Fluchformel; »verflucht« ist im Deutschen klar, würdig und formgetreu.
- source_word: שֹׁכֵב עִם
  choice: mit … schläft
  rationale: Die hebräische Wendung bezeichnet Geschlechtsverkehr. »Mit jemandem schlafen« ist im heutigen Standarddeutsch natürlich und wahrt zugleich die verhüllende Ausdrucksweise des Originals.
- source_word: אֲחֹתוֹ
  choice: seiner Schwester
  rationale: Direkte Wiedergabe des Verwandtschaftsbegriffs mit maskulinem Singularsuffix.
- source_word: בַּת אָבִיו
  choice: der Tochter seines Vaters
  rationale: Die appositionelle Bestimmung wird formal durchsichtig beibehalten und umfasst die väterlicherseits bestehende Schwesterbeziehung.
- source_word: אוֹ
  choice: oder
  rationale: Gibt die einfache disjunktive Verbindung zwischen väterlicher und mütterlicher Abstammung wieder.
- source_word: בַת אִמּוֹ
  choice: der Tochter seiner Mutter
  rationale: Bewahrt die parallele rechtliche Formulierung und deren ausdrückliche Wiederholung.
- source_word: וְאָמַר
  choice: Und … soll sagen
  rationale: Das Waw mit Qatal setzt die vorgeschriebene liturgische Antwort in der Fluchreihe fort; »soll sagen« gibt dies im modernen Deutschen angemessen wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Direkte, nicht erweiternde Wiedergabe; der Text nennt weder Israel ausdrücklich noch verwendet er hier einen besonderen Ausdruck für Versammlung.
- source_word: אָמֵן
  choice: Amen
  rationale: Die im Deutschen etablierte liturgische Übernahme bewahrt den bekräftigenden Charakter der gemeinschaftlichen Antwort.
theological_decisions:
- issue: Umfang und Form des Inzestverbots
  choice: Die Fluchformel gilt dem, der mit seiner Schwester schläft; diese wird durch die Abstammung vom selben Vater oder von derselben Mutter bestimmt.
  alternative: Die Bestimmung ausschließlich auf Halbgeschwister zu verengen oder allgemein als jede nahe weibliche Verwandte zu umschreiben.
  rationale: Der hebräische Text erläutert »Schwester« durch väterliche oder mütterliche Abstammung. Die Übersetzung bewahrt diese Formulierung, ohne ihren Umfang einzuengen oder auszuweiten.
- issue: Generisches maskulines Rechtssubjekt
  choice: »wer … seiner Schwester«
  alternative: »der Mann, der …«
  rationale: Das maskuline Singularpartizip steht in einer allgemeinen rechtlichen Fluchformel. »Wer« klingt im Deutschen natürlich und vermeidet eine unnötige Ergänzung, während »seiner Schwester« die grammatische und verwandtschaftliche Beziehung des Ausgangstextes erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-liturgischem Ton. Die Satzstruktur und die ausdrückliche parallele Abstammungsangabe des Hebräischen bleiben erhalten; auf eine Fußnote wird verzichtet, da die wörtliche Verwandtschaftsbestimmung bereits im Haupttext steht.
