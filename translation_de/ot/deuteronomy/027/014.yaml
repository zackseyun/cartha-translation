id: DEU.27.14
reference: Deuteronomy 27:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָנ֣וּ הַ/לְוִיִּ֗ם וְ/אָֽמְר֛וּ אֶל כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל ק֥וֹל רָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: de
  text: Und die Leviten sollen antworten und mit lauter Stimme zu jedem Mann Israels sagen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu jedem Israeliten“. Wörtlich steht im Hebräischen „zu jedem Mann Israels“; der maskuline Singular wird hier repräsentativ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: sollen antworten
  rationale: ענה leitet hier eine förmliche Antwort beziehungsweise Ausrufung ein. Die Konstruktion mit „sollen“ gibt den Anweisungscharakter des Zusammenhangs wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Der hebräische Text nennt ausdrücklich die Leviten, nicht die levitischen Priester.
- source_word: וְאָמְרוּ
  choice: und … sagen
  rationale: אמר ist das gewöhnliche Verb für „sagen“. Zusammen mit „antworten“ bewahrt die Wiedergabe die formelhafte hebräische Abfolge.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: zu jedem Mann Israels
  rationale: אִישׁ ist grammatisch maskulin und singular („Mann“) und wird hier repräsentativ beziehungsweise kollektiv gebraucht. Die Übersetzung erhält diese Form, statt sie stillschweigend zu neutralisieren.
- source_word: קוֹל רָם
  choice: mit lauter Stimme
  rationale: Die feste Wendung bezeichnet eine öffentliche, deutlich hörbare Ausrufung; „mit lauter Stimme“ ist im Deutschen natürlich und würdevoll.
theological_decisions:
- issue: Repräsentative maskuline Sprache in אִישׁ
  choice: zu jedem Mann Israels
  alternative: zu jedem Israeliten
  rationale: Der Ausgangstext verwendet den maskulinen Singular אִישׁ mit repräsentativer Kraft. Die Hauptübersetzung bewahrt diese sprachliche Form; die idiomatischere kollektive Wiedergabe wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Verbindung „antworten und … sagen“ bleibt erhalten, obwohl sie im Deutschen etwas feierlich wirkt, weil sie den förmlichen Charakter der Bundesausrufung wiedergibt.
