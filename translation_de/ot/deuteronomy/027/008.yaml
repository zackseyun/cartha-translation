  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: de
  text: Und du sollst alle Worte dieses Gesetzes sehr deutlich auf die Steine schreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gut verständlich“ oder „so, dass sie klar verständlich sind“. Der hebräische Ausdruck verbindet ein Verb mit der Bedeutung „klarmachen/erläutern“ mit einer Verstärkung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Und du sollst … schreiben
  rationale: Das Qal Perfekt 2. Person Singular mit וְ setzt hier die Anweisungsfolge fort. Die Formulierung mit „sollst“ bewahrt die persönliche Anrede im Singular und gibt den verpflichtenden Charakter natürlich wieder.
- source_word: עַל הָאֲבָנִים
  choice: auf die Steine
  rationale: עַל bezeichnet hier die Oberfläche, auf der geschrieben wird. Der bestimmte Artikel verweist auf die zuvor genannten Steine.
- source_word: אֵת כָּל דִּבְרֵי
  choice: alle Worte
  rationale: Die formnahe Wiedergabe bewahrt sowohl כָּל als auch den sprachlichen Ausdruck דִּבְרֵי, ohne ihn deutend zu „Bestimmungen“ einzuengen.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: dieses Gesetzes
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten; im deuteronomischen Bundes- und Rechtszusammenhang ist „Gesetz“ eine natürliche und etablierte Entsprechung. „Dieses“ gibt das Demonstrativpronomen wieder.
- source_word: בַּאֵר הֵיטֵב
  choice: sehr deutlich
  rationale: בַּאֵר bezeichnet ein Klar- oder Verständlichmachen, während הֵיטֵב den Ausdruck verstärkt. Im Zusammenhang mit einer Inschrift gibt „sehr deutlich“ die Art des Schreibens wieder, ohne die mögliche Nuance der verständlichen Darlegung auszuschließen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung rückt den vollständigen Gegenstand des Schreibens hervor; „sehr deutlich“ ist idiomatisch und bewahrt zugleich die Spannung zwischen gut lesbarer Inschrift und verständlicher Darlegung.
