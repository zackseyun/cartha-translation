source:
  edition: WLC
  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer die Worte dieses Gesetzes nicht aufrechterhält[a], indem er sie tut. Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht bestätigt« oder »nicht in Kraft hält«. Das hebräische Verb kann bedeuten, die Geltung des Gesetzes zu bestätigen oder aufrechtzuerhalten; hier wird dies mit dem Gehorsam verbunden: »indem er sie tut«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Prädikatives Adjektiv in einer Bundesfluchformel; »verflucht« ist im heutigen Standarddeutsch klar, würdig und weniger altertümlich als »verfluchet«.
- source_word: אֲשֶׁר
  choice: wer
  rationale: Die substantivisch gebrauchte Relativkonstruktion bezeichnet allgemein die Person, auf die der Fluch zutrifft. »Wer« gibt diese generische Bedeutung natürlich und ohne unnötige Geschlechtsfestlegung wieder.
- source_word: לֹא יָקִים
  choice: nicht aufrechterhält
  rationale: Das Hifil von קום kann hier »aufrichten«, »bestätigen« oder »in Geltung halten« bedeuten. »Aufrechterhalten« bewahrt den Gedanken, dass die verbindliche Geltung des Gesetzes praktisch anerkannt wird, ohne den folgenden Gehorsamsausdruck vorwegzunehmen.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: die Worte dieses Gesetzes
  rationale: דִּבְרֵי bezeichnet die Worte beziehungsweise Bestimmungen; תּוֹרָה ist im deuteronomischen Bundeszusammenhang angemessen mit »Gesetz« wiedergegeben.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: indem er sie tut
  rationale: 'Der Infinitiv erläutert, wie die Worte des Gesetzes aufrechterhalten werden: durch ihre praktische Ausführung. Die Formulierung erhält die Zweigliedrigkeit des Hebräischen.'
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk soll sagen
  rationale: Im liturgisch-rechtlichen Ablauf hat die Verbform vorschreibenden beziehungsweise performativen Sinn. »Soll sagen« bezeichnet die angeordnete gemeinsame Antwort.
- source_word: אָמֵן
  choice: Amen
  rationale: »Amen« ist auch im Deutschen als feierliche Bekräftigungsformel etabliert und bewahrt die liturgische Kontinuität des Ausdrucks.
theological_decisions:
- issue: Bundesverpflichtung in יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Der Fluch gilt dem, der die Worte des Gesetzes nicht durch tatsächliches Tun aufrechterhält.
  alternative: Der Vers könnte enger als Fluch über den verstanden werden, der das Gesetz nicht förmlich bestätigt oder in Kraft setzt.
  rationale: Die Verbindung des Verbs יָקִים mit »indem er sie tut« weist über eine bloß mündliche oder öffentliche Bestätigung hinaus auf praktische Anerkennung durch Gehorsam. Die Übersetzung lässt zugleich die Bedeutungsbreite von יָקִים sichtbar.
- issue: Generischer Bezug von אֲשֶׁר
  choice: wer
  alternative: der Mann, der; jeder, der
  rationale: Die hebräische Singularform ist repräsentativ und allgemein. »Wer« gibt den allgemeinen Personenbezug wieder, ohne eine im Ausgangstext nicht beabsichtigte Einschränkung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die liturgische Schlussformel bleibt knapp und feierlich; die echte Bedeutungsbreite von יָקִים wird in der Fußnote offengelegt.
