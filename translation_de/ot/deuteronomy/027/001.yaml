  - severity: low
    issue: „Dann geboten Mose und die Ältesten“ ist für modernes Standarddeutsch stilistisch steif.
    rationale: Das Präteritum von „gebieten“ in dieser Stellung ist möglich, klingt aber deutlich gehoben bzw. bibelsprachlich. „befahlen“ ist idiomatischer, ohne einen Bedeutungsverlust.
