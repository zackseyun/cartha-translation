base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: de
  text: 'Dann befahlen Mose und die Ältesten Israels dem Volk: „Haltet das ganze Gebot, das ich euch heute gebiete.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: geboten
  rationale: צוה bezeichnet das verbindliche Erteilen eines Gebots. „Geboten“ gibt die Autorität der Anweisung knapp und würdig wieder.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: und die Ältesten Israels
  rationale: Das Hebräische verbindet Mose und die Ältesten als gemeinsame Subjekte; „und“ bewahrt diese syntaktische Zuordnung.
- source_word: הָעָם
  choice: dem Volk
  rationale: עָם bezeichnet hier Israel als Bundesvolk; „Volk“ ist die natürliche und transparente deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor wird im modernen Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben; ein zusätzliches „und sprachen“ würde die gemeinsame Subjektkonstruktion unnötig belasten.
- source_word: שָׁמֹר
  choice: Haltet
  rationale: שׁמר bezeichnet im Zusammenhang mit Geboten sorgfältiges Bewahren und Befolgen. „Haltet“ ist im Deutschen die natürliche Wendung für verbindlichen Gehorsam.
- source_word: כָּל הַמִּצְוָה
  choice: das ganze Gebot
  rationale: מִצְוָה steht im Singular, und כָּל mit einem bestimmten Singular lässt sich natürlich als „das ganze Gebot“ wiedergeben. So bleibt die kollektive beziehungsweise umfassende Singularform erhalten.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: das ich euch heute gebe
  rationale: Deutsch sagt idiomatisch „jemandem ein Gebot geben“. Die Wiedergabe erhält den unmittelbaren, gegenwärtigen Akt des Gebietens, ohne die Wortwurzel künstlich zu wiederholen.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ gibt die zeitliche Hervorhebung klar und in modernem Deutsch wieder.
theological_decisions:
- issue: Numerus und Reichweite von מִצְוָה in der Bundesunterweisung
  choice: 'Singular: „das ganze Gebot“'
  alternative: 'Pluralisierend: „alle Gebote“'
  rationale: Der hebräische Text hat ausdrücklich den Singular. Dieser kann die gesamte Bundesweisung kollektiv bezeichnen. Die Übersetzung bewahrt diese Form, statt sie theologisch oder stilistisch zum Plural aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird ohne das im Deutschen schwerfällige „indem sie sagten“ eingeleitet. Der Wechsel vom pluralischen Sprecher („Mose und die Ältesten“) zum singularischen „ich“ bleibt entsprechend dem hebräischen Text unverändert und wird nicht harmonisiert.
