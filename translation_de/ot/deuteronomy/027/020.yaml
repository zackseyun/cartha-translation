  naturalness: Das Deutsch ist modernes, gut verständliches Standarddeutsch und bewahrt einen angemessen knappen rechtlich-liturgischen Ton. „Verflucht ist, wer …“ und „das ganze Volk soll sagen“ sind idiomatisch.
  terminology: Die zentralen Begriffe sind sachgerecht. „Die Frau seines Vaters“ bewahrt die vom Hebräischen gewollte Offenheit gegenüber der engeren Deutung „Stiefmutter“. Die Fußnote zu „Gewandsaum“ erklärt den sexuellen Euphemismus, ohne ihn im Haupttext interpretativ zu ersetzen. Die Fußnotenanker sind im deutschen Text sinnvoll gesetzt.
