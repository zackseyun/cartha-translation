id: DEU.27.20
reference: Deuteronomy 27:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: de
  text: 'Verflucht ist, wer mit der Frau seines Vaters schläft[a], denn er hat den Gewandsaum seines Vaters aufgedeckt[b]. Und das ganze Volk soll sagen: „Amen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Frau seines Vaters kann in diesem Zusammenhang seine Stiefmutter sein; das Hebräische verwendet diese Bezeichnung jedoch nicht ausdrücklich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Gewandsaum seines Vaters aufgedeckt“. Die Wendung ist ein sexueller Euphemismus und steht der Sprache in 3. Mose 18,8 und 20,11 nahe; sinngemäß kann sie auch als „die Blöße seines Vaters aufgedeckt“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht ist
  rationale: Die prädikative Form gibt die einleitende Bundesfluchformel klar und in würdigem Gegenwartsdeutsch wieder.
- source_word: שֹׁכֵב עִם
  choice: mit … schläft
  rationale: Die deutsche Wendung bezeichnet wie das hebräische Idiom den Geschlechtsverkehr, ohne in klinische oder unnötig ausdrückliche Sprache auszuweichen.
- source_word: אֵשֶׁת אָבִיו
  choice: die Frau seines Vaters
  rationale: Dies entspricht dem hebräischen Wortlaut und legt die Frau nicht ausdrücklich als Stiefmutter fest.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Fluches ein; „denn“ passt zum gehobenen rechtlich-liturgischen Ton.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: den Gewandsaum seines Vaters aufgedeckt
  rationale: כָּנָף bezeichnet unter anderem Flügel, Rand oder Gewandsaum. Die Wiedergabe bewahrt das konkrete, hier sexuell-euphemistische Bild und erklärt seine Bedeutung in einer Fußnote.
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk soll sagen
  rationale: Die Formulierung wahrt den wiederkehrenden liturgischen Antwortsatz und den auffordernden Charakter im Zusammenhang.
- source_word: אָמֵן
  choice: Amen
  rationale: Die im Deutschen eingebürgerte Transliteration bewahrt die liturgische Antwort des Hebräischen.
theological_decisions:
- issue: Wiedergabe des sexuellen Euphemismus גִלָּה כְּנַף אָבִיו
  choice: Das Bild wird mit „den Gewandsaum seines Vaters aufgedeckt“ im Haupttext bewahrt.
  alternative: „die Blöße seines Vaters aufgedeckt“ oder deutend „das Ehebett seines Vaters geschändet“
  rationale: Der hebräische Ausdruck spielt auf die Sprache der sexuellen Verbote der Tora an, verwendet hier jedoch כָּנָף („Rand/Gewandsaum“) und nicht ausdrücklich „Blöße“. Die bildhafte und in ihrer genauen Nuance offene Formulierung bleibt daher im Text erhalten; die sexuelle Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-liturgischem Ton. Die Fluchformel und die gemeinsame Antwort des Volkes bleiben knapp und formelhaft; der ungewöhnliche hebräische Euphemismus wird nicht durch eine konfessionell oder interpretativ verengende Paraphrase ersetzt.
