  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: de
  text: 'Diese sollen auf dem Berg Garizim stehen, um das Volk zu segnen, wenn ihr den Jordan überquert: Simeon, Levi, Juda, Issachar, Josef[a] und Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josef vertritt in dieser Stammesaufzählung die beiden Stämme Efraim und Manasse.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das pluralische Demonstrativpronomen führt die anschließend genannten Stämme ein; „Diese“ ist knapp und entspricht der hebräischen Form.
- source_word: יַעַמְדוּ
  choice: sollen … stehen
  rationale: Der Qal-Imperfekt steht im Rahmen einer Anweisung. „Sollen“ gibt den verpflichtenden, auf die Zukunft gerichteten Sinn im heutigen Deutsch natürlich wieder.
- source_word: לְבָרֵךְ
  choice: um … zu segnen
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck des Stehens.
- source_word: הָעָם
  choice: das Volk
  rationale: Gemeint ist Israel als gemeinschaftliches Bundesvolk; „das Volk“ ist die übliche und sachgerechte Wiedergabe.
- source_word: עַל הַר גְּרִזִים
  choice: auf dem Berg Garizim
  rationale: „Auf dem Berg“ bezeichnet den Standort idiomatisch; „Garizim“ ist die etablierte deutsche Namensform.
- source_word: בְּעָבְרְכֶם
  choice: wenn ihr … überquert habt
  rationale: בְּ mit Infinitiv constructus und Suffix hat temporalen Sinn. Das Perfekt markiert natürlich, dass die Überquerung der Aufstellung vorausgeht, ohne den zeitlichen Bezug übermäßig festzulegen.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die herkömmliche deutsche Bezeichnung benötigt keinen Zusatz „Fluss“.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Simeon, Levi, Juda, Issachar, Josef und Benjamin
  rationale: Verwendet werden die etablierten deutschen Formen der Stammesnamen.
theological_decisions:
- issue: Weisender oder vorhersagender Charakter der Aufstellung
  choice: „Diese sollen … stehen“ als Anweisung
  alternative: „Diese werden … stehen“ als Vorhersage
  rationale: Der Vers gehört zu Moses Anordnungen für die künftige Bundeszeremonie. „Sollen“ bewahrt den direktiven Sinn, ohne darüber hinausgehende theologische Aussagen einzutragen.
- issue: Bedeutung Josefs in der Stammesliste
  choice: „Josef“ bleibt unverändert im Haupttext
  alternative: „die Stämme Josefs“ oder „Efraim und Manasse“
  rationale: Der hebräische Text nennt ausdrücklich Josef. Die repräsentative Funktion darf erläutert, aber nicht durch eine Erweiterung in den Haupttext ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem Hebräischen soweit natürlich; „sollen … stehen“ wahrt den Anweisungscharakter. Der Fußnotenmarker steht bei „Josef“, da sich die Erklärung auf diesen Namen bezieht.
