source:
  edition: WLC
  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer seinen Nächsten im Verborgenen niederschlägt.[a] Und das ganze Volk soll sagen: »Amen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlägt« oder »tötet«; das hebräische Verb kann sowohl Schläge als auch tödliche Gewalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das passive Partizip beziehungsweise prädikative Adjektiv eröffnet eine Bundesfluchformel. »Verflucht« ist im Deutschen klar, würdevoll und für diesen liturgischen Zusammenhang eingebürgert.
- source_word: מַכֵּה
  choice: niederschlägt
  rationale: Das Partizip von נכה kann Schlagen mit schwerer bis tödlicher Gewalt bezeichnen. »Niederschlägt« bringt die Schwere der Tat zum Ausdruck, ohne die Bedeutung eindeutig auf Töten festzulegen.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: רֵעַ bezeichnet hier einen Mitmenschen beziehungsweise Angehörigen der Gemeinschaft. »Seinen Nächsten« ist natürlich und bewahrt den biblisch-ethischen Sprachklang.
- source_word: בַּסָּתֶר
  choice: im Verborgenen
  rationale: Die Wendung bezeichnet eine Tat, die der öffentlichen Wahrnehmung entzogen ist. »Im Verborgenen« erhält die substantivische Ausdrucksweise des Hebräischen.
- source_word: וְאָמַר
  choice: Und ... soll sagen
  rationale: Waw mit Qatal hat in dieser zeremoniellen Abfolge prozeduralen beziehungsweise auffordernden Sinn. »Soll sagen« gibt die vorgeschriebene Antwort der Gemeinde in natürlichem Deutsch wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die Formulierung entspricht dem ausdrücklich genannten Gesamtvolk, ohne die im Vers nicht wiederholte Ergänzung »Israel« einzufügen.
- source_word: אָמֵן
  choice: Amen
  rationale: Die etablierte liturgische Wiedergabe bewahrt den Charakter der bestätigenden Bundesantwort.
theological_decisions:
- issue: Grad der in מַכֵּה bezeichneten Gewalt
  choice: »niederschlägt«
  alternative: »schlägt« oder »tötet«
  rationale: נכה deckt ein Bedeutungsspektrum vom Schlagen bis zur tödlichen Gewalttat ab. Im Kontext der Fluchreihe ist eine schwere Gewalttat gemeint; »niederschlägt« wahrt deren Gewicht, ohne ausdrücklich und ausschließlich Mord vorauszusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem liturgischem Klang. Die Satzstruktur folgt der hebräischen Fluchformel, bleibt aber idiomatisch; die echte Bedeutungsbreite des Gewaltverbs wird durch die Fußnote offengehalten.
