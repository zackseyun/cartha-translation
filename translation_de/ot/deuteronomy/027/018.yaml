source:
  edition: WLC
  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: de
  text: 'Verflucht ist, wer einen Blinden auf dem Weg irreführt. Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht ist
  rationale: Das prädikative Adjektiv eröffnet eine Bundesfluchformel. Die Wendung bewahrt deren feststellenden, rechtlich-liturgischen Charakter.
- source_word: מַשְׁגֶּה
  choice: wer … irreführt
  rationale: Das Hifil-Partizip bezeichnet jemanden, der einen anderen irreführt oder vom richtigen Weg abbringt. »Irreführt« gibt den kausativen Sinn knapp und natürlich wieder.
- source_word: עִוֵּר
  choice: einen Blinden
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular. »Einen Blinden« bildet Form und konkreten Einzelfall im Deutschen angemessen ab.
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: Die Präpositionalfügung bezeichnet hier am naheliegendsten den konkreten Weg, auf dem ein Blinder fehlgeleitet wird; zugleich bleibt die mögliche weitere Bedeutung von »Weg« erhalten.
- source_word: וְאָמַר
  choice: Und … soll sagen
  rationale: Im rechtlich-liturgischen Zusammenhang hat die Form vorschreibenden Sinn. »Soll sagen« gibt die angeordnete Antwort der Gemeinschaft natürlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Dies entspricht der kollektiven Singularform, ohne eine im Vers nicht ausdrücklich genannte nähere Bestimmung hinzuzufügen.
- source_word: אָמֵן
  choice: Amen
  rationale: Die etablierte liturgische Übertragung bewahrt die bestätigende Bundesantwort besser als eine Umschreibung.
theological_decisions:
- issue: Wiedergabe des substantivierten maskulinen Singulars עִוֵּר
  choice: einen Blinden
  alternative: einen blinden Menschen
  rationale: Die gewählte Form bewahrt den grammatisch maskulinen Singular und den konkreten rechtlichen Einzelfall, ohne über den hebräischen Wortlaut hinauszugehen.
- issue: Charakter der Fluchformel
  choice: Verflucht ist, wer …
  alternative: Verflucht sei, wer …
  rationale: Der hebräische Wortlaut ist eine prädikative, deklarative Fluchformel und nicht ausdrücklich als Wunsch formuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bundesfluchformel und die gemeinschaftliche liturgische Antwort bleiben erhalten; unnötige Ergänzungen werden vermieden.
