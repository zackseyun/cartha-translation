id: DEU.27.19
reference: Deuteronomy 27:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer das Recht des Fremden[a], der Waise[b] und der Witwe beugt. Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Fremder« ist hier ein nicht einheimischer Einwohner gemeint, der unter den Israeliten lebte.
    reason: cultural_note
  - marker: b
    text: 'Oder: »des vaterlosen Kindes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Die prädikative Form eröffnet eine Bundesfluchformel; »Verflucht« gibt deren feierliche Rechtskraft natürlich und unmittelbar wieder.
- source_word: מַטֶּה
  choice: beugt
  rationale: Das Hifil-Partizip von נטה bezeichnet hier das Abbiegen oder Verdrehen des Rechts. »Das Recht beugen« ist eine geläufige deutsche Rechtswendung und bewahrt zugleich das Bild des hebräischen Verbs.
- source_word: מִשְׁפַּט
  choice: das Recht
  rationale: מִשְׁפַּט meint in diesem Zusammenhang den rechtlichen Anspruch beziehungsweise das zustehende Recht der genannten Schutzbedürftigen, nicht nur abstrakte Gerechtigkeit.
- source_word: גֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft unter Israel lebt und gesellschaftlich besonders verletzlich ist. »Fremder« ist verständlich und historisch offen; eine Fußnote präzisiert die soziale Kategorie.
- source_word: יָתוֹם
  choice: die Waise
  rationale: יָתוֹם bezeichnet ein elternloses beziehungsweise besonders einen vaterlosen Kind. »Waise« ist im modernen Deutschen die natürliche Bezeichnung, ohne das Geschlecht des Kindes festzulegen.
- source_word: אַלְמָנָה
  choice: die Witwe
  rationale: Direkte und natürliche Wiedergabe der gesellschaftlich schutzbedürftigen Gruppe.
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk soll sagen
  rationale: Das Perfekt mit וְ in der liturgischen Anweisungsfolge hat hier auffordernden beziehungsweise festlegenden Sinn. »Soll sagen« passt zur vorgeschriebenen Antwort des Volkes.
- source_word: אָמֵן
  choice: Amen
  rationale: Die etablierte liturgische Transliteration bewahrt die feierliche Zustimmung und Selbstverpflichtung der Versammlung.
theological_decisions:
- issue: Wiedergabe der rechtlich-sozialen Dreiergruppe ohne moderne politische Kategorien einzutragen
  choice: der Fremde, die Waise und die Witwe
  alternative: der Schutzbürger, das vaterlose Kind und die Witwe
  rationale: Die gewählte Form ist für heutige Leser verständlich und bewahrt die geschichtlich-rechtlichen Gruppen des hebräischen Textes. Die Fußnoten erläutern, dass גֵּר einen nicht einheimischen, unter Israel lebenden Einwohner meint und יָתוֹם auch spezifisch »vaterloses Kind« bedeuten kann.
- issue: Gegenstand der Rechtsbeugung
  choice: das Recht des Fremden, der Waise und der Witwe
  alternative: das Urteil über den Fremden, die Waise und die Witwe
  rationale: מִשְׁפַּט kann Recht, Rechtsanspruch oder Urteil bezeichnen. Im Kontext des Schutzes verletzlicher Menschen liegt ihr zustehendes Recht näher; die Formulierung lässt den rechtlichen Gehalt bestehen, ohne ihn auf ein einzelnes Gerichtsverfahren zu begrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung »das Recht beugen« verbindet Verständlichkeit mit der Bildlichkeit des hebräischen Verbs. Die Satzstruktur erhält den feierlichen Charakter der Bundeszeremonie, ohne archaische Formen zu verwenden.
