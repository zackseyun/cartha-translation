source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: de
  text: Und du sollst alle Worte dieser Weisung[a] auf sie schreiben, wenn du hinüberziehst, damit du in das Land kommst, das Yahweh, dein Gott, dir gibt – ein Land, in dem Milch und Honig fließen –, wie Yahweh, der Gott deiner Väter,[b] zu dir geredet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Worte dieses Gesetzes“. Das hebräische Wort Tora kann sowohl „Weisung“ als auch „Gesetz“ bedeuten; hier steht es im Zusammenhang des Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Gott deiner Vorfahren“. Wörtlich steht im Hebräischen „deiner Väter“, eine im 5. Buch Mose häufige Bundesformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Und du sollst … schreiben
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Anweisungskontext gebietenden Sinn; „sollst“ wahrt den rechtlich-feierlichen Ton.
- source_word: עֲלֵיהֶן
  choice: auf sie
  rationale: Das Pronomen verweist auf die Steine aus dem vorherigen Vers.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: alle Worte dieser Weisung
  rationale: דִּבְרֵי wird konkret mit „Worte“ wiedergegeben. תּוֹרָה bezeichnet Weisung und kann im Bundeszusammenhang auch „Gesetz“ heißen; „Weisung“ bewahrt hier die größere Bedeutungsbreite.
- source_word: בְּעָבְרֶךָ
  choice: wenn du hinüberziehst
  rationale: Die Präposition mit Infinitivus constructus ist temporal. „Hinüberziehen“ passt zum gemeinschaftlichen Zug Israels über den Jordan.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: damit du … kommst
  rationale: Die Wendung drückt Zweck beziehungsweise beabsichtigtes Ergebnis aus; das schlichte „kommst“ entspricht תָּבֹא und klingt im Deutschen natürlich.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, dein Gott
  rationale: Der im hebräischen Text stehende Bundesname wird als „Yahweh“ wiedergegeben.
- source_word: נֹתֵן לְךָ
  choice: dir gibt
  rationale: Das Partizip stellt die Gabe als gegenwärtig wirksam und gewiss dar; deutsches Präsens gibt dies natürlich wieder.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die traditionelle Fülle-Metapher bleibt bildhaft erhalten und ist zugleich idiomatisches Deutsch.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: wie … zu dir geredet hat
  rationale: דִּבֶּר bedeutet ausdrücklich „reden/sprechen“; „versprochen“ wäre kontextuell plausibel, aber interpretierend.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: der Gott deiner Väter
  rationale: „Väter“ wahrt den ausdrücklich maskulinen Wortlaut und die deuteronomische Bundesformel.
- source_word: לָךְ
  choice: zu dir
  rationale: Trotz der auffälligen Form der Überlieferung ist der kontextuelle Sinn die Anrede Israels in der zweiten Person Singular.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Yahweh“ transliteriert, damit der im Ausgangstext verwendete Bundesname erkennbar bleibt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ erhält den weiteren Bedeutungsumfang von תּוֹרָה; der rechtlich-bundestheologische Sinn bleibt im Kontext vorhanden und wird in der Fußnote angezeigt.
- issue: Wiedergabe von אֲבֹתֶיךָ
  choice: deiner Väter
  alternative: deiner Vorfahren
  rationale: Die Übersetzung bewahrt sowohl die maskuline Form des Ausgangstextes als auch die feste Bundesformel, ohne auszuschließen, dass die Vorfahren insgesamt gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, wird aber durch Gedankenstriche lesbar gegliedert. Die Singularanrede Israels bleibt erhalten; „hinüberziehen“ trägt zugleich dem gemeinschaftlichen Geschehen Rechnung.
