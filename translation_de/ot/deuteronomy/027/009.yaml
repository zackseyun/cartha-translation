  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: de
  text: 'Dann sprachen Mose und die levitischen Priester zu ganz Israel: »Sei still[a] und höre, Israel! Heute bist du Jahwe, deinem Gott, zu einem Volk geworden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hör aufmerksam zu.“ Der seltene hebräische Imperativ kann Stille oder konzentrierte Aufmerksamkeit betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redeten
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann redeten“ gibt diesen Fortgang natürlich wieder und berücksichtigt das zusammengesetzte Subjekt.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die appositionelle Verbindung bezeichnet die Priester als Leviten; die gewählte Formulierung ist im Deutschen knapp und sachlich.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die geläufige kollektive Wendung bewahrt die Anrede des gesamten Volkes.
- source_word: הַסְכֵּת
  choice: Sei still
  rationale: Der seltene Imperativ fordert wahrscheinlich zu schweigender Aufmerksamkeit auf. Die mögliche allgemeinere Bedeutung wird in der Fußnote genannt.
- source_word: וּשְׁמַע
  choice: und höre
  rationale: „Höre“ bewahrt die knappe, eindringliche Imperativform und den vertrauten biblischen Anredeklang, ohne unverständlich zu sein.
- source_word: הַיּוֹם הַזֶּה
  choice: Heute
  rationale: Dies ist die natürliche moderne Wiedergabe der deiktischen Zeitangabe.
- source_word: נִהְיֵיתָ לְעָם
  choice: bist du zu einem Volk ... geworden
  rationale: Der maskuline Singular redet Israel als kollektive Einheit an; „zu einem Volk geworden“ bildet היה mit לְ eng ab.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition לְ kann Ziel, Zuordnung oder Zugehörigkeit ausdrücken. „Für Jahwe“ erhält diese knappe Mehrdeutigkeit; die Zugehörigkeitsnuance steht in der Fußnote.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Der Singular des Possessivpronomens entspricht der korporativen singularischen Anrede Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Israel als korporativer Singular
  choice: Sei ... höre ... du ... deinen
  alternative: Seid ... hört ... ihr ... euren
  rationale: Die hebräischen Formen stehen im maskulinen Singular und sprechen Israel als ein einziges Bundesvolk an. Dies bleibt im Deutschen erhalten.
- issue: Bedeutung von לַיהוָה bei היה לְ
  choice: für Jahwe
  alternative: Jahwe gehörend
  rationale: Die Hauptfassung bewahrt die knappe Zuordnungsformulierung; die Fußnote verdeutlicht die darin mögliche Aussage der Bundeszugehörigkeit, ohne sie als einzig mögliche Nuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; der korporative Singular wird trotz möglicher anfänglicher Irritation bewusst bewahrt.
