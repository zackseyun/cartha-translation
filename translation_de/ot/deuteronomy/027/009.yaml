  naturalness: „Dann redeten ... zu“ und besonders „zu einem Volk für Jahwe“ wirken im modernen Standarddeutsch unnötig hölzern. „Sprachen zu“ und die Stellung „Jahwe ... zu einem Volk geworden“ sind würdevoll, verständlich und nahe am hebräischen Satzbau.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Levitische Priester“ und der Singular bei „Israel“ sind korrekt. Die Fußnotenverankerung muss die jeweilige lexikalische Alternative unmittelbar kenntlich machen.
