  verdict: revise
  source_fidelity: Die Übersetzung bewahrt den Wechsel von pluralischer Anrede beim Überschreiten des Jordan zu kollektiv-singularischer Anrede in „dein Gott“, „dir“ und „sollst du dir“. Allerdings gibt „Und wenn“ die ausdrücklich genannte Zeitbestimmung בַּיּוֹם („an dem Tag“) nicht vollständig wieder. „An dem Tag, an dem“ stellt diese präzise her. Die Verbindung „über den Jordan in das Land zieht“ gibt die Bewegungsrichtung des Hebräischen idiomatisch wieder.
  naturalness: Die revidierte Fassung ist modernes, würdevolles Standarddeutsch. „Mit Kalk bestreichen“ ist für das Auftragen eines Beschichtungsmaterials auf Steine klarer als „mit Kalk verputzen“, ohne den materiellen Sinn einzuengen.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Land“, „große Steine“ und „Kalk“ sind sachlich und natürlich. Die Fußnote wird unmittelbar bei „Kalk“ verankert, da sie dessen lexikalische Spannweite erläutert.
