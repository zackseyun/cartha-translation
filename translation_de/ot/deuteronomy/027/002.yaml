  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: de
  text: Und an dem Tag, an dem ihr über den Jordan in das Land zieht, das Jahwe, dein Gott, dir gibt, sollst du dir große Steine aufrichten und sie mit Kalk[a] bestreichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Putz“. Das hebräische Wort kann Kalk oder daraus bereiteten Putz als Beschichtungsmaterial bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: Und wenn
  rationale: Die hebräische Zukunfts- und Zeitformel wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben; der konkrete Tag ist durch das Ereignis des Überschreitens bestimmt.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: ihr den Jordan überschreitet
  rationale: Das Verb steht im Plural und bezeichnet das Überqueren des Jordan durch das Volk.
- source_word: אֶל הָאָרֶץ
  choice: in das Land kommt
  rationale: Die Präposition bezeichnet hier das Ziel der Überquerung. Die Ergänzung „kommt“ macht die deutsche Verbindung natürlich, ohne den Sinn zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als im Deutschen geläufige Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip beschreibt Jahwes gegenwärtig zugesagte und sichere Gabe. Das Präsens bewahrt diese Perspektive natürlich.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: sollst du dir ... aufrichten
  rationale: Der Befehl wechselt zur grammatischen Einzahl, die Israel kollektiv anspricht. Das Dativpronomen gibt לְךָ knapp wieder.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: große Steine
  rationale: Dies ist die direkte und natürliche Wiedergabe der Größenangabe.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: und sie mit Kalk verputzen
  rationale: Das Verb bezeichnet das Überziehen beziehungsweise Verputzen; שִׂיד ist Kalk oder daraus bereiteter Putz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ bewahrt ihn als Namen und ist die im modernen Deutschen übliche wissenschaftlich begründete Form.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: „ihr … überschreitet“, danach „dein Gott … dir … sollst du dir“
  alternative: durchgehend pluralische Anrede
  rationale: Der hebräische Text wechselt bewusst vom Plural תעברו zur kollektiven Einzahl in אלהיך, לך und והקמות. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive singularische Anrede Israels nach dem anfänglichen Plural wird entsprechend dem hebräischen Text beibehalten. „Verputzen“ ist gegenwärtig verständlich und bezeichnet hier das Beschichten der Steine mit Kalkputz.
