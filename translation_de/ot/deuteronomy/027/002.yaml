revisions:
- from: Und wenn ihr den Jordan überschreitet und in das Land kommt, das Jahwe, dein Gott, dir gibt, sollst du dir große Steine aufrichten und sie mit Kalk verputzen.[a]
  to: Und an dem Tag, an dem ihr über den Jordan in das Land zieht, das Jahwe, dein Gott, dir gibt, sollst du dir große Steine aufrichten und sie mit Kalk[a] bestreichen.
  rationale: Die Revision stellt die im hebräischen Text ausdrücklich genannte Zeitbestimmung wieder her, bewahrt den Wechsel von pluralischer zu kollektiv-singularischer Anrede und setzt die lexikalische Fußnote an den tatsächlich erläuterten Ausdruck. Die Formulierung zum Beschichten der Steine wird zugleich idiomatischer und semantisch neutraler gefasst.
