  text: And on that day Moses commanded the people, saying,
translation:
  language: de
  text: 'An jenem Tag gebot Mose dem Volk:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: gebot
  rationale: Das Verb צוה bezeichnet hier ein autoritatives Gebieten. „Gebot“ bewahrt diese Verbindlichkeit und ist im Deutschen prägnant und natürlich.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die im Deutschen eingebürgerte Namensform.
- source_word: אֶת הָעָם
  choice: dem Volk
  rationale: עָם bezeichnet hier Israel als Gemeinschaft. Wegen der deutschen Rektion von „gebieten“ steht die Bezeichnung im Dativ.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die Wendung gibt den zeitlichen Bezug ausdrücklich wieder; „an jenem Tag“ entspricht dem rückverweisenden הַהוּא in natürlichem, würdigem Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Wortlaut des Gebots in den folgenden Versen ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die hebräische Satzfolge bleibt weitgehend erhalten; der abschließende Doppelpunkt zeigt an, dass der Inhalt des Gebots folgt.
