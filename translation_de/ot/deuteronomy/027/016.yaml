  variant: modern standard German
source:
  edition: WLC
  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer seinen Vater oder seine Mutter entehrt.[a] Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geringschätzt«, »verächtlich behandelt« oder »mit Verachtung behandelt«. Das hebräische Verb bezeichnet, dass jemand als unbedeutend oder verachtenswert behandelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das passive Partizip eröffnet eine bundesrechtliche Fluchformel. »Verflucht« ist im Deutschen klar, würdig und für diesen liturgisch-rechtlichen Zusammenhang geläufig.
- source_word: מַקְלֶה
  choice: entehrt
  rationale: Das Verb קלה bezeichnet hier im Hifil, jemanden gering zu achten, verächtlich zu behandeln oder seiner Ehre zu berauben. »Entehrt« gibt die soziale und ethische Tragweite knapp und natürlich wieder, ohne die Handlung auf eine bloß innere Haltung oder bestimmte Äußerung einzuengen.
- source_word: אָבִיו וְאִמּוֹ
  choice: seinen Vater oder seine Mutter
  rationale: 'Die Personenbezeichnungen mit Suffix der 3. Person Maskulin Singular sind mit »seinen« wiedergegeben. Obwohl die hebräische Verbindung formal »und« lautet, bringt »oder« den distributiven Sinn der Fluchbestimmung im natürlichen deutschen Rechtsstil zum Ausdruck: Die Missachtung eines der beiden Elternteile fällt darunter.'
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk soll sagen
  rationale: Die fortschreitende Erzähl- beziehungsweise Liturgieform wird mit »Und« beibehalten; »soll sagen« entspricht der vorgeschriebenen gemeinsamen Antwort. Das ausdrücklich stehende »ganze Volk« wird ohne kontextuelle Ergänzung wiedergegeben.
- source_word: אָמֵן
  choice: Amen
  rationale: Die eingebürgerte Umschrift bewahrt die feierliche liturgische Bekräftigung und ist im modernen Deutschen unmittelbar verständlich.
theological_decisions:
- issue: Art des Vergehens gegenüber den Eltern
  choice: »entehrt« als soziale und ethische Missachtung
  alternative: »geringschätzt«, »verächtlich behandelt« oder »mit Verachtung behandelt«
  rationale: Der hebräische Ausdruck beschreibt, dass jemand als gering oder verächtlich behandelt wird. »Entehrt« stellt den Bezug zur Pflicht her, Vater und Mutter zu ehren, ohne das Vergehen auf Gefühlsabneigung, Beschimpfung oder eine einzelne konkrete Handlung zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper bundesrechtlich-liturgischer Satzform. Die männliche Singularform »wer … seinen« folgt der grammatischen Gestalt des Hebräischen und fungiert im Deutschen allgemein personenbezogen. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Anmerkung erläutert.
