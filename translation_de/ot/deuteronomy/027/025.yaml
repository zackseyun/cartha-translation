id: DEU.27.25
reference: Deuteronomy 27:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: de
  text: 'Verflucht ist, wer Bestechungsgeld annimmt, um einen Unschuldigen zu töten[a]! Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine Wendung mit »unschuldigem Blut«. Gemeint ist die Tötung eines Menschen, der unschuldig ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht ist
  rationale: Das prädikative Adjektiv eröffnet eine Bundesfluchformel. »Verflucht ist« gibt diese feierlich und zugleich in heutigem Standarddeutsch wieder.
- source_word: לֹקֵחַ שֹׁחַד
  choice: wer Bestechungsgeld annimmt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet allgemein die betreffende Person. »Bestechungsgeld« macht den rechtswidrigen Charakter der Zahlung eindeutig.
- source_word: לְהַכּוֹת
  choice: um … zu töten
  rationale: Das Hifil von נכה kann »schlagen«, »niederschlagen« oder im gegebenen Zusammenhang »töten« bedeuten. In Verbindung mit unschuldigem Blut ist tödliche Gewalt gemeint.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: einen Unschuldigen
  rationale: נֶפֶשׁ bezeichnet hier eine Person beziehungsweise ihr Leben, nicht eine vom Körper getrennte Seele. Die Wendung mit »unschuldigem Blut« meint einen Menschen, der keine den Tod rechtfertigende Schuld trägt; die konkrete hebräische Bildsprache wird in der Fußnote bewahrt.
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk soll sagen
  rationale: Die Verbform bezeichnet in diesem liturgisch-rechtlichen Zusammenhang die vorgeschriebene Antwort der versammelten Gemeinschaft.
- source_word: אָמֵן
  choice: Amen
  rationale: Das eingebürgerte liturgische Wort bewahrt die bekräftigende Antwort der Bundeszeremonie.
theological_decisions:
- issue: Fluchformel im Bundeszusammenhang
  choice: Verflucht ist, wer Bestechungsgeld annimmt, um einen Unschuldigen zu töten
  alternative: Verflucht ist, wer Bestechungsgeld annimmt, um unschuldiges Blut zu vergießen
  rationale: Die gewählte Fassung hält sowohl den rechtswidrigen finanziellen Anreiz als auch die Tötung eines unschuldigen Menschen klar fest. Sie deutet nicht näher aus, ob die bestochene Person selbst tötet oder die Tötung im Rahmen eines korrumpierten Rechtsverfahrens bewirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ton der Bundesfluchformel. »Bestechungsgeld« ist präziser als das allgemeinere »Bestechung«; »einen Unschuldigen« ist idiomatisch und bewahrt den generischen Singular. Der Fußnotenmarker [a] steht unmittelbar bei der erklärten Wendung.
