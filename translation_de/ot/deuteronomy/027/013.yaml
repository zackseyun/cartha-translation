  naturalness: Die Namensformen und der Satzbau sind modernes, würdiges Standarddeutsch. Die Verbindung „für den Fluch ... stehen“ ist allerdings im Deutschen nicht idiomatisch und kann so wirken, als stünden die Stämme zugunsten oder anstelle eines Fluches. „Um den Fluch auszusprechen“ gibt die rituale Funktion klar und natürlich wieder.
