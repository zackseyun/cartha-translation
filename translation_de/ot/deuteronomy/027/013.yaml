  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: de
  text: 'Und diese sollen auf dem Berg Ebal stehen, um den Fluch[a] auszusprechen: Ruben, Gad, Ascher, Sebulon, Dan und Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für den Fluch«; auch: »zum Verfluchen« oder »zur Verkündung des Fluches«.'
    reason: Die hebräische Wendung עַל הַקְּלָלָה ist knapp und benennt die rituelle Zuordnung; die Fußnote weist auf die wörtlichere und weitere Wiedergabe hin.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und diese
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet als Gegenstück zum vorigen Vers die zweite Gruppe ein.
- source_word: יַעַמְדוּ
  choice: sollen … stehen
  rationale: Das Imperfekt bezeichnet hier eine noch auszuführende Anweisung. »Sollen stehen« gibt den anordnenden Charakter in natürlichem Deutsch wieder.
- source_word: עַל הַקְּלָלָה
  choice: für den Fluch
  rationale: עַל bezeichnet in diesem rituellen Zusammenhang die Zuordnung zum Fluch beziehungsweise zu dessen Ausrufung. Die knappe Formulierung bewahrt die Unbestimmtheit des Hebräischen.
- source_word: בְּהַר עֵיבָל
  choice: auf dem Berg Ebal
  rationale: Die Präposition bezeichnet hier den Ort; »auf dem Berg Ebal« ist die natürliche deutsche Wiedergabe.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: גָּד
  choice: Gad
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: דָּן
  choice: Dan
  rationale: Übliche deutsche Form des Stammesnamens.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Moderne deutsche Schreibung des Stammesnamens.
theological_decisions:
- issue: Rituelle Aufgabe der Stämme im Zusammenhang mit dem Fluch
  choice: für den Fluch
  alternative: für die Verkündung des Fluches; zum Verfluchen
  rationale: Der hebräische Text nennt kein ausdrückliches Verb wie »verkünden«. Der Zusammenhang mit Segen und Fluch in den Versen 12–13 legt eine zeremonielle Funktion nahe, ohne sie hier genauer zu bestimmen. Die Hauptfassung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am Hebräischen, ist jedoch gut verständlich; die knappe rituelle Formulierung wird nicht erklärend erweitert.
