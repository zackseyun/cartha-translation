source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer mit seiner Schwiegermutter schläft.[a] Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: »mit seiner Schwiegermutter Geschlechtsverkehr hat«. Im Hebräischen steht die euphemistische Wendung »mit … liegt/schläft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das passive Partizip eröffnet die feststehende Bundesfluchformel. »Verflucht« ist im heutigen Deutsch klar, würdig und dem rechtlich-liturgischen Zusammenhang angemessen.
- source_word: שֹׁכֵב עִם
  choice: bei … liegt
  rationale: Die hebräische Wendung bezeichnet hier in verhüllender Sprache Geschlechtsverkehr. »Bei jemandem liegen« bewahrt das Bild des Ausgangstextes und ist im Kontext verständlich; eine Fußnote nennt die ausdrückliche Bedeutung.
- source_word: חֹתַנְתּוֹ
  choice: seiner Schwiegermutter
  rationale: חֹתֶנֶת bezeichnet die Schwiegermutter; das Suffix ist maskulin Singular der dritten Person. Die gewählte Form ist die direkte, idiomatische deutsche Entsprechung.
- source_word: וְאָמַר
  choice: Und … soll sagen
  rationale: Das Perfekt mit ו setzt die liturgische Anweisung der Fluchformeln fort. »Soll sagen« gibt deren vorgeschriebenen beziehungsweise performativen Charakter natürlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Dies entspricht dem ausdrücklich genannten Umfang. »Israel« wird nicht ergänzt, obwohl es aus dem Zusammenhang hervorgeht.
- source_word: אָמֵן
  choice: Amen
  rationale: Die überlieferte liturgische Bekräftigung ist auch im Deutschen geläufig und wird daher als »Amen« wiedergegeben.
theological_decisions:
- issue: Sexueller Euphemismus in einer Fluchformel
  choice: Die hebräische Bildrede wird mit »bei seiner Schwiegermutter liegt« bewahrt.
  alternative: »mit seiner Schwiegermutter Geschlechtsverkehr hat«
  rationale: Die Übersetzung erhält die zurückhaltende, aber im Rechtskontext erkennbare Ausdrucksweise des Hebräischen. Die Fußnote verhindert, dass die sexuelle Bedeutung übersehen wird.
- issue: Maskuliner Singular des Handelnden
  choice: Die deutsche Konstruktion »wer … seiner Schwiegermutter« gibt den einzelnen Handelnden wieder; das Possessivpronomen macht den im Hebräischen grammatisch maskulinen Bezug sichtbar.
  alternative: »derjenige, der bei seiner Schwiegermutter liegt«
  rationale: »Wer« ist in einer deutschen Rechts- und Fluchformel natürlicher als das schwerfällige »derjenige, der«. Ein ausdrücklich eingefügtes »Mann« stünde nicht als eigenes Substantiv im Ausgangstext.
- issue: Charakter der Antwort des Volkes
  choice: »soll sagen« wird als vorgeschriebene liturgische Antwort verstanden.
  alternative: »sage« oder »wird sagen«
  rationale: Im Zusammenhang der wiederholten Bundesflüche bezeichnet וְאָמַר die vom Volk zu sprechende Bekräftigung, ohne daraus lediglich eine Zukunftsvorhersage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rechtlich-liturgischer Satzform. Der sexuelle Euphemismus des Hebräischen bleibt im Haupttext erhalten und wird in der Fußnote transparent erläutert. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wendung.
