base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: de
  text: Und dort sollst du Jahwe, deinem Gott, einen Altar bauen, einen Altar aus Steinen; du sollst kein Eisen über ihnen schwingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Du sollst sie nicht mit einem eisernen Werkzeug bearbeiten.'
    reason: Die hebräische Wendung spricht wörtlich davon, „Eisen“ über den Steinen zu schwingen bzw. zu führen; sie kann den Einsatz eines eisernen Werkzeugs meinen.
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Und … sollst du … bauen
  rationale: Das Qal-Perfekt mit vorangestelltem וּ hat im Anweisungskontext verpflichtende bzw. imperativische Kraft; „sollst du bauen“ wahrt den Gesetzesstil.
- source_word: שָׁם
  choice: dort
  rationale: Direkte Wiedergabe des lokalen Adverbs mit Rückbezug auf den zuvor genannten Ort.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Die übliche und kontextgemäße Bezeichnung für einen Opferaltar.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: ל kennzeichnet den Empfänger bzw. den, dem der Altar geweiht ist; im Deutschen drückt der Dativ dies natürlich aus. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִזְבַּח אֲבָנִים
  choice: einen Altar aus Steinen
  rationale: Die Konstruktverbindung bezeichnet das Material des Altars; „aus Steinen“ ist im modernen Deutsch klar und natürlich.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: Du sollst kein Eisen an sie bringen
  rationale: Die Formulierung bewahrt „Eisen“ als konkreten Ausdruck des Hebräischen und gibt das Verbot idiomatisch wieder, ohne die Art des eisernen Geräts genauer festzulegen als der Ausgangstext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gesetzlich-anweisendem Ton. Die Wiederholung von „Altar“ bleibt als rhetorische Präzisierung des hebräischen Textes erhalten.
