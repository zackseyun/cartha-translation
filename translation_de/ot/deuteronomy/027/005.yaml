    rationale: Das Hifil von נוף bezeichnet hier nicht das bloße Heranbringen von Eisen, sondern dessen Schwingen bzw. den Einsatz über den Steinen. Die Übersetzung muss die verbale Handlung ausdrücken, ohne das nicht ausdrücklich genannte Werkzeug zwingend in den Haupttext einzutragen.
