  source_fidelity: 'Die Grundstruktur und die wesentlichen Lexeme sind zutreffend wiedergegeben: der Bauauftrag, der Ort, die Weihung an Jahwe, das Material und das Verbot. „Kein Eisen an sie bringen“ trifft jedoch תָנִיף („schwingen/führen, anwenden“) nicht hinreichend; es kann bloßes Heranbringen bedeuten und verliert die vom Verb bezeichnete Handlung.'
  naturalness: Der Satz ist ansonsten modernes, würdiges Standarddeutsch. „Kein Eisen über ihnen schwingen“ ist als gesetzlich-kultische Anweisung verständlich und näher am hebräischen Ausdruck als „an sie bringen“.
  terminology: „Jahwe“ gibt יהוה angemessen wieder; „deinem Gott“, „Altar“ und „aus Steinen“ sind treffend. Die Wiederholung von „Altar“ soll erhalten bleiben.
