  naturalness: »Verflucht ist, wer die Grenze seines Nächsten verschiebt« ist modernes, idiomatisches Standarddeutsch und bewahrt den knappen rechtlich-liturgischen Stil. »Verrückt« wäre in diesem Sinn zwar verständlich, ist aber weniger eindeutig und weniger natürlich als »verschiebt« beziehungsweise bei einer konkreten Markierung »versetzt«.
  terminology: »Verflucht«, »Nächster«, »Volk« und »Amen« sind registergerecht. Die lexikalische Mehrdeutigkeit von גְּבוּל sollte in der Hauptfassung nicht durch »Grenzstein« auf eine steinerne Markierung eingeengt werden; die konkrete Lesart kann in der Fußnote stehen.
