source:
  edition: WLC
  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: de
  text: 'Verflucht ist, wer die Grenze[a] seines Nächsten verschiebt. Und das ganze Volk soll sagen: »Amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Grenzstein seines Nächsten versetzt«. Das Hebräische kann die Grundstücksgrenze oder eine Markierung bezeichnen, die ihren Verlauf kennzeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht
  rationale: Das Prädikatsadjektiv eröffnet eine förmliche Bundesfluchformel. »Verflucht« ist im Deutschen klar, würdevoll und rechtlich ernst.
- source_word: מַסִּיג
  choice: wer … verrückt
  rationale: Das Partizip bezeichnet die Person, die diese Tat begeht. »Verrückt« bringt hier prägnant zum Ausdruck, dass eine Grundstücksgrenze durch das Versetzen ihres Zeichens unrechtmäßig verschoben wird.
- source_word: גְּבוּל
  choice: Grenzstein
  rationale: Im Zusammenhang des Landrechts bezeichnet das Wort die Grundstücksgrenze beziehungsweise konkret das Zeichen, das sie kenntlich macht. »Grenzstein« vermittelt den gemeinten Rechtsverstoß im modernen Deutschen unmittelbar.
- source_word: רֵעֵהוּ
  choice: seines Nächsten
  rationale: Das Wort bezeichnet im zwischenmenschlichen und rechtlichen Zusammenhang einen Mitmenschen beziehungsweise Angehörigen der Gemeinschaft. »Seines Nächsten« bewahrt zudem den singularischen Possessivbezug.
- source_word: וְאָמַר
  choice: Und … soll sagen
  rationale: Die Verbform führt die liturgisch-rechtliche Formel fort. »Soll sagen« gibt die vorgeschriebene gemeinschaftliche Antwort natürlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Dies entspricht dem hebräischen Wortlaut, ohne die kontextuell naheliegende, aber hier nicht ausdrücklich genannte Ergänzung »Israel« einzufügen.
- source_word: אָמֵן
  choice: Amen
  rationale: »Amen« ist auch im Deutschen die etablierte liturgische Bekräftigung und bewahrt die gemeinschaftliche Zustimmung zur ausgesprochenen Bundesfluchformel.
theological_decisions:
- issue: Fluchformel im bundesrechtlichen Zusammenhang
  choice: Verflucht ist, wer den Grenzstein seines Nächsten verrückt
  alternative: Verflucht sei, wer die Grenze seines Nächsten verschiebt
  rationale: Die gewählte Fassung bewahrt den förmlichen Charakter des Bundesfluchs und macht zugleich den konkreten Landrechtsverstoß verständlich, ohne über den hebräischen Text hinauszugehen.
- issue: Generischer maskuliner Singular des Partizips
  choice: wer … seines Nächsten
  alternative: derjenige, der … seines Nächsten
  rationale: »Wer« gibt den repräsentativen Einzelfall natürlich und ohne unnötige Ausweitung in den Plural wieder; »seines Nächsten« erhält den singularischen Bezug des hebräischen Suffixes.
- issue: Konkrete Grenzmarkierung oder abstrakte Grenze
  choice: Grenzstein
  alternative: Grenze
  rationale: Der landrechtliche Kontext legt eine markierte Grundstücksgrenze nahe. Da גְּבוּל sowohl die Grenze als auch ihre konkrete Markierung bezeichnen kann, wird die alternative Wiedergabe in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Rechts- und Liturgiestil. Die Satzstruktur folgt der hebräischen Fluch- und Antwortformel; archaische Formen werden vermieden.
