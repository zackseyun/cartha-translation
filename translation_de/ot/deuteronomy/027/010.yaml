base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: de
  text: So sollst du auf die Stimme Jahwes, deines Gottes, hören und seine Gebote und seine Ordnungen halten, die ich dir heute gebiete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So gehorche der Stimme Jahwes, deines Gottes.“ Die hebräische Wendung „auf die Stimme hören“ schließt häufig den Sinn des Gehorchens ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: So höre auf die Stimme
  rationale: Die Wendung שׁמע בקול bedeutet, auf jemanden zu hören, und schließt häufig Gehorsam ein. Die Wiedergabe bewahrt das hebräische Bild der Stimme, ohne den Ausdruck vollständig auf „gehorchen“ zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Form der wissenschaftlichen Umschrift des Tetragramms.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die Genitivform fügt sich natürlich in die deutsche Wendung „die Stimme Jahwes, deines Gottes“ ein und bewahrt die persönliche Anrede Israels.
- source_word: וְעָשִׂיתָ
  choice: und halte
  rationale: עשה bezeichnet hier das Ausführen bzw. Befolgen der Gebote. „Halte“ ist im Deutschen bei Geboten idiomatisch und drückt die praktische Umsetzung aus.
- source_word: מִצְוֺתָיו
  choice: seine Gebote
  rationale: „Gebote“ ist die klare und geläufige Entsprechung für מִצְוֹת im bundesrechtlichen Zusammenhang.
- source_word: חֻקָּיו
  choice: seine Ordnungen
  rationale: „Ordnungen“ unterscheidet חֻקִּים von den zuvor genannten Geboten und ist zugleich verständlich und rechtlich geprägt.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: die ich dir heute gebiete
  rationale: Die Formulierung gibt die gegenwärtige, nachdrückliche Anrede des Mose natürlich wieder und bewahrt das für das Deuteronomium wichtige „heute“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf die Stimme hören
  alternative: der Stimme gehorchen
  rationale: Die Wendung schließt Gehorsam ein, doch die bildhafte und lexikalische Bedeutung „hören“ bleibt erhalten; der folgende Aufruf zum Halten der Gebote entfaltet den Gehorsamsaspekt ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nah am Hebräischen, ist aber idiomatisch; „auf die Stimme hören“ bewahrt das Bundesmotiv und die genuine Bedeutungsweite des Ausdrucks.
