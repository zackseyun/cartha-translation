    rationale: Nach „weder den Zehnten … essen noch die Erstgeburten …“ folgen weitere Akkusativgruppen ohne verbindendes „noch“. Dadurch ist der Bezug zum Verb weniger klar und die Aufzählung wirkt syntaktisch gebrochen.
  - severity: medium
    issue: „Schafe“ verengt צאן
    rationale: צאן bezeichnet Kleinvieh, insbesondere Schafe und Ziegen. „Kleinvieh“ erhält den Umfang des hebräischen Kollektivbegriffs.
