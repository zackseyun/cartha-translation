- from: Du darfst innerhalb deiner Tore[a] weder den Zehnten von deinem Getreide, deinem jungen Wein und deinem Öl essen noch die Erstgeburten deiner Rinder und Schafe, all die Gelübdeopfer, die du gelobst[b], deine freiwilligen Gaben oder die Abgabe deiner Hand[c].
  to: Du darfst innerhalb deiner Tore[a] weder den Zehnten deines Getreides, deines jungen Weins und deines Öls noch die Erstgeburten deines Rindviehs und deines Kleinviehs noch irgendeines deiner Gelübdeopfer, die du gelobst[b], noch deine freiwilligen Gaben noch die Abgabe aus deiner Hand[c] essen.
  rationale: Die Überarbeitung gliedert die gesamte Objektliste eindeutig unter „essen“, ersetzt die zu enge Wiedergabe von צאן und glättet die deutschen Genitiv- und Präpositionsformen. Der kultische Bezug von נדר bleibt als „Gelübdeopfer“ im Kontext verständlich, während die Fußnote die wörtliche Form und die damit verbundene Auslegungsfrage transparent hält.
