  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: de
  text: Du darfst innerhalb deiner Tore[a] weder den Zehnten deines Getreides, deines jungen Weins und deines Öls noch die Erstgeburten deines Rindviehs und deines Kleinviehs noch irgendeines deiner Gelübdeopfer, die du gelobst[b], noch deine freiwilligen Gaben noch die Abgabe aus deiner Hand[c] essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinen Ortschaften“. Wörtlich: „innerhalb deiner Tore“; die hebräische Wendung bezeichnet die örtlichen Siedlungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „irgendeines/all deine Gelübde, die du gelobst“. Im Zusammenhang mit den essbaren heiligen Gaben kann die Wendung die aufgrund eines Gelübdes dargebrachten Opfergaben bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Gabe aus deiner Hand“; traditionell: „das Hebopfer deiner Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Du darfst … nicht essen
  rationale: Die Verbindung von יכל mit Infinitiv hat hier im Gesetzestext verbietende, nicht bloß die Fähigkeit betreffende Bedeutung.
- source_word: בִּשְׁעָרֶיךָ
  choice: innerhalb deiner Tore
  rationale: Bewahrt das hebräische Bild und den rechtlichen Ton; gemeint sind idiomatisch die örtlichen Siedlungen beziehungsweise Wohnorte.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: den Zehnten von deinem Getreide
  rationale: מַעְשַׂר bezeichnet den kultisch bestimmten zehnten Anteil; דָּגָן meint Getreide und nicht Erzeugnisse allgemein.
- source_word: תִירֹשְׁךָ
  choice: deinem jungen Wein
  rationale: תִּירוֹשׁ bezeichnet typischerweise neuen beziehungsweise jungen Wein; die Wiedergabe wahrt die Unterscheidung von allgemeineren Wörtern für Wein.
- source_word: יִצְהָרֶךָ
  choice: deinem Öl
  rationale: Das Wort bezeichnet gewöhnlich frisches Öl, besonders Olivenöl; „Öl“ bleibt so knapp wie der hebräische Ausdruck.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: die Erstgeburten deiner Rinder und Schafe
  rationale: בְּכוֹר bezeichnet das erstgeborene Tier; die deutschen Kollektivbezeichnungen geben בקר und צאן im Kontext natürlich wieder.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: all die Gelübdeopfer, die du gelobst
  rationale: נדר bezeichnet wörtlich ein Gelübde, doch als essbarer Posten in dieser kultischen Liste sind die aufgrund eines Gelübdes dargebrachten Gaben gemeint. Die Wiederholung des hebräischen Ausdrucks bleibt erkennbar.
- source_word: נִדְבֹתֶיךָ
  choice: deine freiwilligen Gaben
  rationale: Bezeichnet freiwillig dargebrachte Gaben im Unterschied zu den durch ein Gelübde gebundenen Gaben.
- source_word: תְּרוּמַת יָדֶךָ
  choice: die Abgabe deiner Hand
  rationale: Die formale Wendung bewahrt sowohl den Opfer- beziehungsweise Abgabenbegriff תְּרוּמָה als auch das ungewöhnliche hebräische Bild „deiner Hand“, ohne eine bestimmte Bewegungszeremonie vorauszusetzen.
theological_decisions:
- issue: Kultische Bedeutung von נדר in einer Liste essbarer heiliger Gaben
  choice: Gelübdeopfer
  alternative: Gelübde
  rationale: Der unmittelbare Zusammenhang zeigt, dass nicht gesprochene Versprechen gegessen werden, sondern die mit ihnen verbundenen Opfergaben. Eine Fußnote hält die wörtliche Form und damit die sprachliche Spannung sichtbar.
- issue: Deutung von תְּרוּמַת יָדֶךָ
  choice: Abgabe deiner Hand
  alternative: Hebopfer deiner Hand / Gabe aus deiner Hand
  rationale: Die gewählte Form legt weder eine bestimmte Opferbewegung noch eine ausschließlich allgemeine Gabe fest und bewahrt die konkrete Ausdrucksweise des Hebräischen.
translation_notes:
  register: Moderne, würdige Rechtssprache in direkter Anrede. Die Satzstruktur ist trotz der langen kultischen Aufzählung durch „weder … noch“ gegliedert. Fachbegriffe werden nur dort verwendet, wo die Opferkategorie sonst verloren ginge; ungewöhnliche hebräische Bilder bleiben mit erläuternden Fußnoten erhalten.
