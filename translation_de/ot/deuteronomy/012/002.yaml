base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: de
  text: 'Ihr sollt alle Orte vollständig zerstören, an denen die Völker, die ihr vertreibt, ihren Göttern gedient haben[a]: auf den hohen Bergen, auf den Hügeln und unter jedem grünen Baum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Götter verehrt haben“. Das hebräische Verb für „dienen“ kann den religiösen Dienst, also die Verehrung einer Gottheit, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: sollt ... vollständig zerstören
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die finite Verbform. „Vollständig zerstören“ gibt den Nachdruck in natürlichem modernem Deutsch wieder, ohne die Totalität über „alle Orte“ hinaus unnötig zu steigern.
- source_word: כָּל הַמְּקֹמוֹת
  choice: alle Orte
  rationale: מָקוֹם bezeichnet hier konkrete Kultorte. „Orte“ bleibt direkt und verständlich; „Kultstätten“ wäre im Deutschen präziser, würde die im Hebräischen nur kontextuell erkennbare Funktion aber ausdrücklich eintragen.
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: an denen ... ihren Göttern gedient haben
  rationale: עבד mit einer Gottheit als Objekt bezeichnet religiösen Dienst beziehungsweise Verehrung. „Gedient“ bewahrt die Grundbedeutung; die Fußnote nennt die idiomatische Alternative „verehrt“.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die nichtisraelitischen Völker des Landes. „Völker“ ist im Deutschen kontextgerecht und vermeidet die Eintragung späterer Bedeutungsfelder von „Heiden“.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: die ihr vertreibt
  rationale: ירשׁ bezeichnet im Landnahmekontext Besitzergreifung, die mit der Verdrängung der bisherigen Bewohner verbunden ist. „Vertreibt“ bringt die hier auf die Völker gerichtete Bedeutung klar und natürlich zum Ausdruck.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: auf den hohen Bergen
  rationale: Direkte Wiedergabe des Substantivs mit attributivem Adjektiv und der Präposition עַל.
- source_word: וְעַל הַגְּבָעוֹת
  choice: auf den Hügeln
  rationale: גְּבָעוֹת bedeutet „Hügel“; „Hügelkuppen“ wäre eine unnötige Präzisierung.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: und unter jedem grünen Baum
  rationale: רַעֲנָן bezeichnet frisches, üppiges Grün. „Grüner Baum“ bewahrt die konkrete Bildsprache und die wiederkehrende biblische Wendung.
theological_decisions:
- issue: Gegenstand des gebotenen Zerstörens
  choice: Das Gebot richtet sich konkret gegen sämtliche Orte, an denen die verdrängten Völker ihren Göttern dienten.
  alternative: Das Gebot könnte allgemeiner als Abschaffung fremder Gottesverehrung paraphrasiert werden.
  rationale: Das ausdrückliche hebräische Objekt lautet „alle Orte“. Deshalb bleibt die Übersetzung beim konkreten räumlichen Bezug und macht die weiterreichende Folge nicht zur eigentlichen Formulierung des Verses.
- issue: Bedeutung von עבד im Verhältnis zu fremden Göttern
  choice: „ihren Göttern gedient haben“
  alternative: „ihre Götter verehrt haben“
  rationale: Beide Bedeutungen sind kontextuell möglich und sachlich eng verbunden. Der Haupttext wahrt die lexikalische Grundbedeutung „dienen“, während die Fußnote die kultische Bedeutung ausdrücklich erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural und die Gebotsform „ihr sollt“ bewahren den bundesrechtlichen Ton. Die Satzstellung wurde so gestaltet, dass der Relativsatz im Deutschen klar auf „Orte“ bezogen ist; der Doppelpunkt führt die drei Ortsangaben übersichtlich ein.
