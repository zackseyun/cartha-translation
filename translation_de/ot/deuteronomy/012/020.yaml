  to: 'Wenn der HERR, dein Gott, dein Gebiet erweitert, wie er es dir zugesagt hat, und du sagst: »Ich möchte Fleisch essen«, weil du Lust hast, Fleisch zu essen, dann darfst du so viel Fleisch essen, wie du möchtest.'
