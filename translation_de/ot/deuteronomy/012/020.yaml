base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: de
  text: 'Wenn der HERR, dein Gott, dein Gebiet erweitert, wie er es dir zugesagt hat, und du sagst: »Ich möchte Fleisch essen«, weil du Lust hast, Fleisch zu essen, dann darfst du so viel Fleisch essen, wie du möchtest.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wahrt seinen besonderen Charakter und entspricht einem würdigen, allgemein verständlichen Bibelregister.
- source_word: יַרְחִיב ... אֶת גְּבוּלְךָ
  choice: dein Gebiet erweitert
  rationale: Die Wendung bezeichnet die räumliche Ausdehnung des Landes beziehungsweise Herrschaftsgebiets; »Gebiet« ist hier natürlicher als das wörtliche »Grenze«.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: wie er es dir zugesagt hat
  rationale: דבר bedeutet wörtlich »reden«, verweist hier aber auf Gottes vorausgehende Zusage; »zugesagt« gibt die kontextuelle Kraft präzise wieder.
- source_word: אָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 'du sagst: »Ich möchte Fleisch essen«'
  rationale: Der Kohortativ אֹכְלָה drückt hier den Wunsch beziehungsweise Entschluss des Sprechers aus; »möchte« klingt im Deutschen natürlich und bewahrt den volitionalen Sinn.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: du Verlangen danach hast
  rationale: נפשך bezeichnet hier die Person in ihrem Begehren, nicht eine vom Körper getrennte »Seele«. Die idiomatische Wiedergabe vermeidet ein missverständliches Menschenbild.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: ganz nach deinem Verlangen
  rationale: Die Formulierung gibt die erlaubende Weite von בכל und das starke persönliche Begehren natürlich wieder, ohne unnötig »Seele« zu wiederholen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: »der HERR« folgt der etablierten deutschen Bibelkonvention, ohne eine unsichere Aussprache des Tetragramms festzulegen.
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: idiomatisch als persönliches Verlangen wiedergegeben
  alternative: »Seele« wörtlich beibehalten
  rationale: Im Vers bezeichnet נֶפֶשׁ den begehrenden Menschen beziehungsweise sein Verlangen. Die idiomatische Wiedergabe vermeidet, eine Leib-Seele-Dichotomie in den Text hineinzulesen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede bleibt alltagsnah; die Wiederholung von »Fleisch essen« wird als bewusstes Merkmal des hebräischen Textes bewahrt.
