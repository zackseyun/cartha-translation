  naturalness: „Mit jemandem so verfahren“ ist modernes, würdiges Standarddeutsch und gibt die knappe, kontextabhängige Aussage idiomatisch wieder. Es vermeidet das zusätzliche, unklare Platzhalterobjekt „es“ des Entwurfs.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Eurem Gott“ bewahrt die 2. Person Plural des hebräischen Suffixes; auch die Kontextanmerkung sollte diese Anrede beibehalten.
