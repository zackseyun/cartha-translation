  text: לֹֽא תַעֲשׂ֣וּ/ן כֵּ֔ן לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: de
  text: Ihr sollt mit Jahwe, eurem Gott, nicht so verfahren.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „So“ verweist auf die vorausgehenden Anweisungen, die Kultstätten der Völker zu zerstören. Israel soll mit Jahwe, eurem Gott, nicht auf diese Weise verfahren.
    reason: cross_reference
  - marker: b
    text: Hebräisch JHWH; traditionell „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die Negation bildet zusammen mit dem Imperfekt in dieser Gesetzesanweisung ein direktes Verbot.
- source_word: תַעֲשׂוּן
  choice: ihr sollt … machen
  rationale: Das Qal-Imperfekt 2. Person Plural hat mit לֹא prohibitive Kraft. „Ihr sollt nicht“ ist im modernen Deutschen klar und bewahrt den rechtlich-bündischen Ton.
- source_word: כֵּן
  choice: so
  rationale: Das Wort verweist knapp auf das zuvor beschriebene Vorgehen gegen die Kultstätten der Völker; die anaphorische Offenheit des Hebräischen bleibt erhalten.
- source_word: לַיהוָה
  choice: mit Jahwe
  rationale: Die Präposition ל bezeichnet hier die Beziehung beziehungsweise die Behandlung Jahwes. Im Deutschen gibt „es mit jemandem so machen“ den Sinn natürlich wieder, ohne die knappe Aussage auszuweiten.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Konstruktform mit dem Suffix der 2. Person Plural bezeichnet ausdrücklich die Bundesbeziehung und wird vollständig wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Haupttext gibt den Eigennamen als „Jahwe“ wieder. Eine Fußnote nennt die traditionelle Wiedergabe „der HERR“, damit diese bekannte Lesetradition transparent bleibt.
- issue: Reichweite des Verbots im Kontext
  choice: Die knappe Rückverweisung „so“ bleibt im Haupttext erhalten.
  alternative: Das Verbot im Haupttext ausdrücklich als Verbot erklären, Jahwe beziehungsweise seinen Gottesdienst wie die Kultstätten der Völker zu behandeln.
  rationale: Der hebräische Vers ist bewusst knapp und hängt vom vorherigen Kontext ab. Die Übersetzung löst diese Spannung nicht stillschweigend auf; die Fußnote erläutert den Rückbezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „Ihr sollt … nicht“ wahrt den Charakter einer Bundesweisung; „es mit … so machen“ ist natürlich und erhält zugleich den knappen Rückverweis des hebräischen Textes.
