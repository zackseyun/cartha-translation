  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: de
  text: Dies sind die Ordnungen und Rechtsbestimmungen, die ihr im Land, das Jahwe, der Gott deiner Väter, dir gegeben hat, um es in Besitz zu nehmen, gewissenhaft befolgen sollt – solange ihr auf der Erde lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solange ihr auf dem Land lebt“; אֲדָמָה kann hier „Erde“, „Land“ oder „Boden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: Dies sind die Ordnungen und Rechtsbestimmungen
  rationale: „Ordnungen“ und „Rechtsbestimmungen“ bewahren die Unterscheidung der beiden hebräischen Rechtsbegriffe, ohne im Deutschen unnatürlich oder missverständlich zu klingen.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: die ihr gewissenhaft befolgen sollt
  rationale: Die Verbindung von שׁמר mit dem Infinitiv von עשׂה bezeichnet achtsame, praktische Befolgung. „Gewissenhaft befolgen“ gibt beide Aspekte idiomatisch wieder.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: Im Kontext des Deuteronomiums bezeichnet אֶרֶץ hier das Israel zugesagte Land.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: der Gott deiner Vorfahren
  rationale: Die Formulierung erhält den Wechsel zur singularischen Anrede. „Vorfahren“ ist im heutigen Standarddeutsch natürlich und schließt die Bundesgeschichte ein.
- source_word: לְרִשְׁתָּהּ
  choice: damit du es in Besitz nimmst
  rationale: ירשׁ bezeichnet in diesem Landkontext das Erlangen beziehungsweise Antreten des Besitzes; die Wiedergabe macht auch das feminine Objektsuffix ausdrücklich.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: solange ihr … lebt
  rationale: Diese natürliche deutsche Zeitangabe bewahrt die umfassende Dauer und die pluralische Anrede.
- source_word: עַל הָאֲדָמָה
  choice: auf der Erde
  rationale: Nach dem engeren „Land“ gibt „Erde“ den möglichen weiteren Sinn von אֲדָמָה wieder und vermeidet eine unbegründete Gleichsetzung der beiden Ausdrücke.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration wahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: „deiner … dir … du“ und „ihr … lebt“
  alternative: durchgehend pluralische Anrede
  rationale: Der masoretische Text wechselt innerhalb des Verses bewusst zwischen Singular und Plural. Dieser grammatische und möglicherweise rhetorische Wechsel wird nicht eingeebnet.
- issue: Bedeutungsumfang von אֲדָמָה
  choice: Erde
  alternative: Land / Boden
  rationale: Der Ausdruck kann enger das Land oder den Erdboden bezeichnen. Im abschließenden Lebenszeit-Satz ist die weitere Bedeutung plausibel, doch die engere Lesart bleibt als Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ton. Die traditionelle Wendung „Satzungen und Rechte“ wurde zugunsten verständlicherer Gegenwartssprache vermieden. Der auffällige Wechsel zwischen singularischer und pluralischer Anrede bleibt erhalten; der Gedankenstrich gliedert den langen Satz, ohne seine Struktur aufzulösen.
