  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: de
  text: Hüte dich davor, deine Brandopfer an irgendeinem Ort darzubringen, den du siehst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hüte dich davor, deine Brandopfer an jedem Ort darzubringen, den du siehst.“'
    reason: 'Lexikalische Alternative für בְּכָל מָקוֹם: Im Warnsatz ist „an irgendeinem Ort“ idiomatisch, während „an jedem Ort“ die distributive Form des Hebräischen enger abbildet.'
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Die reflexive Warnformel gibt den Niphal-Imperativ mit Dativpronomen natürlich und nachdrücklich wieder.
- source_word: פֶּן
  choice: davor … zu
  rationale: Die deutsche Konstruktion „Hüte dich davor, … zu“ vermittelt die vorbeugende Warnung idiomatisch, ohne das im Deutschen gehobene „damit nicht“ oder eine schwerfällige Negation zu benötigen.
- source_word: תַּעֲלֶה
  choice: darzubringen
  rationale: Der Hiphil von עלה bezeichnet im Opferkontext das Darbringen auf dem Altar. „Darbringen“ ist im Deutschen präzise, würdig und natürlich.
- source_word: עֹלֹתֶיךָ
  choice: deine Brandopfer
  rationale: „Brandopfer“ ist der etablierte deutsche Kultbegriff für עֹלָה und bezeichnet das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: בְּכָל מָקוֹם
  choice: an irgendeinem Ort
  rationale: 'Im Geltungsbereich der Warnung gibt „irgendeinem“ die prohibitive Bedeutung wieder: Es geht um einen beliebig selbst gewählten Ort. Die formal mögliche distributive Wiedergabe „an jedem Ort“ bleibt in der Fußnote erhalten.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: den du siehst
  rationale: Die konkrete Ausdrucksweise des Hebräischen wird bewahrt, ohne „sehen“ deutend als „auswählen“ wiederzugeben.
theological_decisions:
- issue: Sprache der Kultzentralisation
  choice: Die Warnung wird als Verbot formuliert, Brandopfer an einem beliebig selbst bestimmten Ort darzubringen.
  alternative: Den Vers ausdrücklich als umfassendes Verbot jeglicher Gottesverehrung außerhalb des zentralen Heiligtums formulieren.
  rationale: Der unmittelbare Wortlaut nennt Brandopfer und beliebige Orte. Der größere Zusammenhang betrifft die Zentralisierung des Kultes, doch diese weitergehende Aussage wird nicht in den Vers hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hüte dich davor“ bewahrt den eindringlichen Charakter der hebräischen Warnformel; „darbringen“ entspricht dem kultischen Zusammenhang, ohne altertümlich zu wirken.
