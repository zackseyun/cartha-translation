revisions:
- from: 'Hüte dich davor, dich nach ihnen verstricken zu lassen, nachdem sie vor dir vernichtet worden sind. Erkundige dich nicht nach ihren Göttern und sage nicht: »Wie haben diese Völker ihren Göttern gedient? Genauso will auch ich es tun.«'
  to: 'Hüte dich, dass du nicht, nachdem sie vor dir vernichtet worden sind, ihnen nach in eine Falle gerätst und dass du nicht nach ihren Göttern forschst, indem du sagst: »Wie haben diese Völker ihren Göttern gedient, sodass auch ich es ebenso tun will?«'
  rationale: Die Revision stellt die beiden hebräischen Warnungen wieder her und bindet die direkte Rede als Ausdruck der beabsichtigten Nachahmung an das verbotene Forschen zurück. Das Bild des Verstricktwerdens wird mit der natürlichen deutschen Entsprechung „in eine Falle geraten“ wiedergegeben; „ihnen nach“ erhält dabei die im Ausgangstext angelegte Offenheit.
