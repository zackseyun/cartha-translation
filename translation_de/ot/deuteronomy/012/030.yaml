base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: de
  text: 'Hüte dich, dass du nicht, nachdem sie vor dir vernichtet worden sind, ihnen nach in eine Falle gerätst und dass du nicht nach ihren Göttern forschst, indem du sagst: »Wie haben diese Völker ihren Göttern gedient, sodass auch ich es ebenso tun will?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Die hebräische Warnformel bedeutet, auf sich achtzugeben; im Deutschen gibt »Hüte dich davor« die eindringliche Warnung natürlich und würdig wieder.
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: dich nach ihnen verstricken zu lassen
  rationale: Das Verb נקש beschreibt bildhaft das Geraten in eine Schlinge. »Sich verstricken lassen« bewahrt das Bild und lässt »nach ihnen« bewusst relativ offen.
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: Erkundige dich nicht nach ihren Göttern
  rationale: דרש mit ל bezeichnet hier das forschende Nachfragen nach den fremden Göttern beziehungsweise ihrer Verehrung; »sich erkundigen nach« passt zum anschließenden direkten Zitat.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: Genauso will auch ich es tun
  rationale: Die Formulierung gibt die beabsichtigte Nachahmung knapp wieder, ohne über den ausdrücklich genannten Dienst hinaus zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Gegenstand des Verbots
  choice: Das Nachforschen wird als auf Nachahmung zielendes Erkunden wiedergegeben.
  alternative: Ein ausnahmsloses Verbot jeder sachlichen Kenntnis über fremde Religionen.
  rationale: 'Der unmittelbare Wortlaut verbindet das Erkundigen mit der Absicht: »Genauso will auch ich es tun.« Die Übersetzung wahrt diesen Zusammenhang, ohne das Verbot enger oder weiter dogmatisch festzulegen.'
- issue: Bezug von אַחֲרֵיהֶם (»nach ihnen«)
  choice: Die mehrdeutige knappe Formulierung »nach ihnen« bleibt erhalten.
  alternative: Explizit »ihren Göttern nachzulaufen« oder »in dieselbe Falle zu geraten wie sie«.
  rationale: Der hebräische Bezug kann die beseitigten Völker und das ihnen folgende Verstricktwerden betreffen. Eine explizitere Auslegung würde die genuine syntaktische Spannung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Warn- und Gesetzesstil. Die Satzteilung erhöht die Lesbarkeit, ohne den gedanklichen Zusammenhang zu verändern.
