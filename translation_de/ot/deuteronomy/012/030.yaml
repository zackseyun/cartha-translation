review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen. Die hebräische Satzstruktur enthält jedoch zwei mit פן eingeleitete Warnungen: nicht in eine Falle zu geraten und nicht nach den Göttern zu forschen, wobei das anschließende Zitat die nachahmende Absicht ausdrückt. Die Fassung „Erkundige dich nicht … und sage nicht“ macht daraus zwei selbständige Verbote und löst den Zweckzusammenhang zu stark.'
  naturalness: „Dich nach ihnen verstricken zu lassen“ ist im modernen Deutschen nicht idiomatisch; insbesondere ist „nach ihnen“ an dieser Stelle schwer anschließbar. „Ihnen nach in eine Falle geraten“ bewahrt sowohl das Schlingenbild als auch die im Hebräischen bestehende, nicht weiter aufgelöste Bezugnahme.
  terminology: „Götter“, „Völker“ und „vor dir vernichtet“ sind angemessen. „Nach ihren Göttern forschen“ gibt דרש mit ל in diesem Kontext präziser wieder als die bloß neutrale Wendung „sich erkundigen nach“ und bleibt durch das folgende Zitat klar auf kultische Nachahmung bezogen.
  issues:
  - severity: medium
    issue: Die zweite Warnung und das Zitat sind syntaktisch umgestaltet.
    rationale: פן תדרש לאלהיהם לאמר verbindet das Forschen nach den Göttern mit dem anschließend geäußerten Wunsch zur Nachahmung. „Erkundige dich nicht … und sage nicht“ setzt stattdessen zwei koordinierte Verbote.
  - severity: medium
    issue: „dich nach ihnen verstricken zu lassen“ ist sprachlich unnatürlich.
    rationale: Das Deutsche verwendet hier eher „in eine Falle geraten“ oder „sich fangen lassen“. Die Stellung von „nach ihnen“ bleibt in der Entwurfsfassung zudem semantisch und grammatisch unerquicklich.
  revised_text: 'Hüte dich, dass du nicht, nachdem sie vor dir vernichtet worden sind, ihnen nach in eine Falle gerätst und dass du nicht nach ihren Göttern forschst, indem du sagst: »Wie haben diese Völker ihren Göttern gedient, sodass auch ich es ebenso tun will?«'
