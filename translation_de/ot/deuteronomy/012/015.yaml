source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: de
  text: Doch sooft es dich danach verlangt[a], darfst du in allen deinen Städten[b] Tiere schlachten und Fleisch essen, entsprechend dem Segen, den Jahwe, dein Gott, dir gegeben hat. Der Unreine und der Reine dürfen davon essen, wie von einer Gazelle oder einem Hirsch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach allem Verlangen deiner Seele«; gemeint ist: sooft du es wünschst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in allen deinen Toren«. Das ist eine hebräische Ausdrucksweise für die eigenen Städte oder Siedlungen.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Kennzeichnet die einschränkende beziehungsweise abgrenzende Fortführung des vorherigen Gebots und klingt im Deutschen natürlich.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: sooft es dich danach verlangt
  rationale: Gibt die hebräische Wendung wörtlich etwa »nach allem Verlangen deiner Seele« idiomatisch wieder, ohne den Wunsch stärker als im Ausgangstext zu bewerten.
- source_word: תִּזְבַּח
  choice: darfst du … Tiere schlachten
  rationale: Der Kontext drückt eine Erlaubnis aus. »Schlachten« bezeichnet das Töten von Tieren zur Fleischgewinnung präzise; »Tiere« ist als notwendiges deutsches Objekt aus dem Zusammenhang erschlossen.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: und Fleisch essen
  rationale: בָשָׂר bezeichnet hier tierisches Fleisch als Nahrung.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: entsprechend dem Segen, den Jahwe, dein Gott, dir gegeben hat
  rationale: Bewahrt das Vergleichselement כ sowie das Substantiv »Segen« und damit den Bezug auf das von Gott gewährte Maß der Versorgung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Namens erhält den Eigennamencharakter des Tetragramms.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: in allen deinen Städten
  rationale: »In deinen Toren« ist eine hebräische Ortsformel für die Städte beziehungsweise Siedlungen im eigenen Gebiet. Die Bedeutung wird im Haupttext verständlich wiedergegeben und die Bildform in der Fußnote dokumentiert.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Der Unreine und der Reine
  rationale: Bezeichnet den kultischen Status, nicht den moralischen Charakter. Die substantivierten Adjektive bewahren die knappe Form des Hebräischen.
- source_word: יֹאכְלֶנּוּ
  choice: dürfen davon essen
  rationale: Im Zusammenhang handelt es sich um eine Erlaubnis; »davon« verweist natürlich auf das zuvor genannte Fleisch.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: wie man Gazelle oder Hirsch isst
  rationale: Die Vergleichstiere sind essbares Wild, dessen Verzehr keine Opferhandlung voraussetzt. Die generische Formulierung macht den im Hebräischen knappen Vergleich im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Jahwe« gibt es als Eigennamen wieder, statt es durch einen Titel zu ersetzen.
- issue: Bedeutung von »unrein« und »rein«
  choice: kultischer Status von Personen, ohne erläuternden Zusatz im Haupttext
  alternative: der kultisch Unreine und der Reine
  rationale: Der Zusammenhang betrifft die rituelle Reinheit und erlaubt beiden Gruppen den Verzehr. Ein Zusatz im Haupttext wäre zwar erklärend, würde jedoch mehr explizieren als der hebräische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Hebräische Idiome werden im Haupttext verständlich wiedergegeben und, wo für die Nachvollziehbarkeit wichtig, in Fußnoten wörtlich erläutert. Der kultische Sinn von »rein/unrein« bleibt erhalten, ohne konfessionelle Zusätze einzutragen.
