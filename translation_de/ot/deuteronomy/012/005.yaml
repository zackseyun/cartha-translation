- from: Sondern den Ort, den Jahwe, euer Gott, aus allen euren Stämmen erwählen wird, um dort seinen Namen wohnen zu lassen[a] – seine Wohnstätte –, sollt ihr aufsuchen; dorthin sollt ihr gehen.
  to: Sondern den Ort, den Jahwe, euer Gott, aus allen euren Stämmen erwählen wird, um dort seinen Namen hinzusetzen[a] und dort zu wohnen, sollt ihr aufsuchen; dorthin sollt ihr gehen.
  rationale: 'Die Revision stellt die Abfolge der hebräischen Formulierungen wieder her: Gottes Name wird an den erwählten Ort gesetzt, und das anschließende Wohnmotiv bleibt erhalten. Die Fußnote dokumentiert die umstrittene syntaktische Verbindung, ohne eine Deutung im Haupttext zu erzwingen.'
