review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe des Kontrasts, des erwählten Ortes, des Gottesnamens, der Stämme sowie von „aufsuchen“ und „dorthin gehen“ ist im Wesentlichen quellentreu. „Seinen Namen wohnen zu lassen“ verschiebt jedoch die hebräische Namensformel: לָשׂוּם אֶת־שְׁמוֹ שָׁם bedeutet zunächst, seinen Namen dort zu setzen/aufzurichten. Die anschließende, syntaktisch schwierige Wendung לְשִׁכְנוֹ sollte nicht durch die ungrammatische Apposition „– seine Wohnstätte –“ wiedergegeben werden.'
  naturalness: 'Die bestehende Gedankenstrich-Apposition ist im Deutschen weder syntaktisch noch semantisch klar: Sie kann den Namen fälschlich als „Wohnstätte“ bestimmen. Die revidierte Fassung ist modernes, würdiges Standarddeutsch und wahrt zugleich die knappe, spannungsvolle Struktur der Vorlage.'
  terminology: „Jahwe“, „euer Gott“, „erwählen“ und „Stämme“ sind angemessen. „Seinen Namen dort hinzusetzen“ bildet die kultische Namensformel transparent ab. „Um dort zu wohnen“ gibt das Wohnmotiv wieder, ohne den Ort historisch zu identifizieren oder weitergehende theologische Schlüsse einzutragen.
  issues:
  - severity: high
    issue: „seinen Namen wohnen zu lassen“ vermischt zwei hebräische Ausdrücke.
    rationale: Der Text unterscheidet das Setzen des Namens (לָשׂוּם אֶת־שְׁמוֹ שָׁם) vom folgenden Wohn-Ausdruck (לְשִׁכְנוֹ). Die vorliegende Fassung macht den Namen zum Objekt von „wohnen lassen“ und gibt das Verb „setzen“ nicht wieder.
  - severity: high
    issue: „– seine Wohnstätte –“ ist keine tragfähige deutsche Wiedergabe von לְשִׁכְנוֹ.
    rationale: Die isolierte Apposition hat keinen klaren syntaktischen Bezug und kann nahelegen, Gottes Name sei selbst die Wohnstätte. Die hebräische Konstruktion ist umstritten; dies sollte mit einer klaren Hauptfassung und einer Fußnote behandelt werden.
  revised_text: Sondern den Ort, den Jahwe, euer Gott, aus allen euren Stämmen erwählen wird, um dort seinen Namen hinzusetzen[a] und dort zu wohnen, sollt ihr aufsuchen; dorthin sollt ihr gehen.
  revised_footnotes:
