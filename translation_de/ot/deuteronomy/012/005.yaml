  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: de
  text: Sondern den Ort, den Jahwe, euer Gott, aus allen euren Stämmen erwählen wird, um dort seinen Namen hinzusetzen[a] und dort zu wohnen, sollt ihr aufsuchen; dorthin sollt ihr gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um dort seinen Namen hinzusetzen, damit er dort wohne“; auch „um dort seinen Namen hinzusetzen – zu seiner Wohnstätte“ wird vertreten. Das Hebräische ist knapp; das genaue Verhältnis zwischen dem Setzen von Gottes Namen, seinem Wohnen und dem Ort bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: Die Wendung stellt der zuvor untersagten Kultpraxis die gebotene Alternative gegenüber; „sondern“ gibt diesen Kontrast im Deutschen prägnant wieder.
- source_word: הַמָּקוֹם
  choice: den Ort
  rationale: „Ort“ ist die natürliche, konkrete und zugleich noch unbestimmte Wiedergabe.
- source_word: יִבְחַר
  choice: erwählen wird
  rationale: Das Imperfekt weist hier auf die künftige Wahl des zentralen Kultortes; „erwählen“ entspricht dem würdigen biblischen Register, ohne unverständlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Gibt die direkte Bundesbeziehung in der Anrede genau wieder.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: aus allen euren Stämmen
  rationale: Bewahrt die Auswahl aus dem Bereich der israelitischen Stämme.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  rationale: Die deutsche Namenswohnformel gibt das biblische Motiv der autorisierten Gegenwart Gottes idiomatischer wieder als das hölzerne „seinen Namen dort hinzusetzen“; die kompakte Verbindung mit לְשִׁכְנוֹ bleibt durch die Fußnote offen.
- source_word: לְשִׁכְנוֹ
  choice: – seine Wohnstätte –
  rationale: Die appositionelle Fassung bewahrt das Motiv des Wohnens, ohne eindeutig festzulegen, ob die Wendung Zweck, Handlung oder Kennzeichnung des Ortes ausdrückt.
- source_word: תִדְרְשׁוּ
  choice: sollt ihr aufsuchen
  rationale: דרש bezeichnet hier das gezielte Aufsuchen des von Gott bestimmten Kultortes; „aufsuchen“ ist im Kontext klarer als das allgemeinere „suchen“.
- source_word: וּבָאתָ שָׁמָּה
  choice: dorthin sollt ihr gehen
  rationale: „Gehen“ ist aus der Perspektive der Angesprochenen im Deutschen natürlich; „dorthin“ gibt שָׁמָּה wieder. Der hebräische Numeruswechsel wird nicht künstlich nachgebildet.
theological_decisions:
- issue: Gottesname
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Transliteration bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Namens- und Wohnstättenformel
  choice: „seinen Namen wohnen zu lassen – seine Wohnstätte –“ mit Fußnote
  alternative: „seinen Namen dort hinzusetzen, damit er dort wohnt“
  rationale: Die knappe hebräische Syntax verbindet Gottes Namen, Wohnen und den erwählten Ort, ohne deren grammatisches Verhältnis völlig eindeutig zu machen. Die Fassung erhält beide Motive und vermeidet eine überpräzise tempeltheologische Deutung.
- issue: Zentraler Kultort
  choice: der von Jahwe erwählte Ort
  alternative: Jerusalem oder der Tempel ausdrücklich nennen
  rationale: Der Vers selbst nennt den späteren Ort nicht. Daher wird keine historische Identifikation in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahwe“ wahrt den Eigennamen; „erwählen“ und „Wohnstätte“ tragen den feierlichen Ton. Die Satzstellung bleibt quellennah, wird aber durch Gedankenstriche und einen Semikolon lesbar gegliedert.
