base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: de
  text: 'Und ihr sollt euch vor Jahwe, eurem Gott, freuen: ihr, eure Söhne und eure Töchter, eure Sklaven und eure Sklavinnen und der Levit, der in euren Ortschaften[a] ist; denn er hat bei euch weder Anteil noch Erbbesitz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in euren Toren“; die Wendung kann die Ortschaften beziehungsweise örtlichen Gemeinwesen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: Und ihr sollt euch freuen
  rationale: Das Verb bezeichnet hier im gesetzlich-gottesdienstlichen Zusammenhang die gebotene Freude; die deutsche Soll-Form gibt die instruktive Funktion der hebräischen Verbform angemessen wieder.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: vor Jahwe, eurem Gott
  rationale: „Vor“ bewahrt die knappe räumlich-kultische Wendung im Sinn von „in der Gegenwart“. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: eure Söhne und eure Töchter
  rationale: Die ausdrücklich genannten männlichen und weiblichen Familienangehörigen werden einzeln beibehalten.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: eure Sklaven und eure Sklavinnen
  rationale: Die Wörter bezeichnen männliche und weibliche Personen in unfreier beziehungsweise abhängiger Stellung. „Sklaven und Sklavinnen“ macht diesen sozialen Status deutlicher als „Knechte und Mägde“.
- source_word: וְהַלֵּוִי
  choice: der Levit
  rationale: Dies ist die übliche und präzise Bezeichnung für einen Angehörigen des Stammes Levi.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: der in euren Ortschaften lebt
  rationale: „In euren Toren“ ist eine hebräische metonymische Wendung für die örtlichen Gemeinwesen. „Ortschaften“ gibt den gemeinten Sinn natürlich wieder; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: denn er hat bei euch weder Anteil noch Erbbesitz
  rationale: „Denn“ kennzeichnet die Begründung für die Einbeziehung des Leviten. „Weder … noch“ bewahrt beide hebräischen Begriffe und formuliert die Verneinung idiomatisch; „bei euch“ gibt אִתְּכֶם natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Sozialer Status von עֶבֶד und אָמָה
  choice: Sklaven und Sklavinnen
  alternative: Knechte und Mägde
  rationale: Im Rahmen der Aufzählung des gesamten Haushalts bezeichnet das Wortpaar abhängige, unfreie Personen. Die gewählte Wiedergabe vermeidet eine Abschwächung dieses sozialen Sachverhalts, ohne über den Text hinauszugehen.
- issue: Anteil und Erbbesitz des Leviten
  choice: weder Anteil noch Erbbesitz
  alternative: keinen Anteil oder Erbbesitz
  rationale: Die Formulierung hält die beiden miteinander verbundenen Begriffe auseinander und lässt offen, in welchem genauen Verhältnis allgemeiner Anteil und erblicher Landbesitz zueinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Der Doppelpunkt macht die nachgestellte, ausdrücklich betonte Aufzählung der Beteiligten erkennbar. Die kultische Wendung „vor Jahwe“ und der rechtliche Ausdruck „Erbbesitz“ bewahren den Charakter des Ausgangstextes.
