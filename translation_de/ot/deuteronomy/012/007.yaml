  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: de
  text: Dort sollt ihr vor Jahwe, eurem Gott, essen und euch über alles freuen, was eure Hand unternimmt[a] – ihr und eure Haushalte –, womit Jahwe, dein Gott, dich gesegnet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über alles Aussenden eurer Hand“; gemeint sein können alle eure Unternehmungen, eure Arbeit oder alles, was ihr in Angriff nehmt.'
    reason: Die hebräische Wendung מִשְׁלַח יָד ist bildhaft und lässt im Kontext mehrere eng verwandte Bedeutungsnuancen zu.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: Dort sollt ihr essen
  rationale: Das mit Waw verbundene Perfekt hat im gesetzlichen Zusammenhang anweisende Zukunftsbedeutung; „dort“ bewahrt den Rückverweis auf den von Jahwe erwählten Ort.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: vor Jahwe, eurem Gott
  rationale: „Vor“ gibt לִפְנֵי knapp und natürlich als Gegenwart Jahwes im gottesdienstlichen Zusammenhang wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּשְׂמַחְתֶּם
  choice: und euch freuen
  rationale: Die Form steht parallel zu וַאֲכַלְתֶּם und trägt denselben anweisenden Sinn; „sich freuen“ ist gegenwärtiges, natürliches Deutsch.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: über alles, was eure Hand unternimmt
  rationale: Die Formulierung bewahrt das hebräische Bild vom Ausstrecken bzw. Aussenden der Hand, vermittelt aber zugleich idiomatisch den Sinn von Tätigkeit oder Unternehmung. Die Präposition ב wird beim deutschen Verb „sich freuen“ natürlich mit „über“ wiedergegeben.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: ihr und eure Hausgemeinschaften
  rationale: בָּתִּים bezeichnet hier nicht Gebäude, sondern die zum Haus gehörenden Menschen. „Hausgemeinschaften“ ist weiter als „Familien“ und kann auch andere Haushaltsangehörige einschließen.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: womit Jahwe, dein Gott, dich gesegnet hat
  rationale: Die Relativkonstruktion bleibt eng am Hebräischen und bewahrt den auffälligen Wechsel von der pluralischen zur singularischen Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: „euch/eure“ und anschließend „dein/dich“
  alternative: Durchgehend pluralisch oder durchgehend singularisch formulieren
  rationale: Das Hebräische wechselt ausdrücklich vom Plural zum Singular. Diese für das Deuteronomium charakteristische Spannung zwischen Israel als Gemeinschaft und als kollektiver Einheit wird nicht eingeebnet.
- issue: Bezug des Relativsatzes אֲשֶׁר בֵּרַכְךָ
  choice: „womit … dich gesegnet hat“ mit Bezug auf das zuvor genannte Tätigkeitsfeld bzw. dessen Ertrag
  alternative: „weil Jahwe, dein Gott, dich gesegnet hat“
  rationale: Der Relativanschluss wird formal bewahrt. Da der genaue Bezug im Hebräischen nicht völlig eindeutig ist, vermeidet die Übersetzung eine kausale Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt trotz des Anredewechsels lesbar; Gedankenstriche markieren den eingeschobenen Zusatz „ihr und eure Hausgemeinschaften“. Der Fußnotenmarker steht unmittelbar an der erklärungsbedürftigen Wendung.
