  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: de
  text: 'Ihr sollt es nicht so machen, wie wir es heute hier machen: Jeder tut, was in seinen eigenen Augen richtig ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder Mann“; die Formulierung ist distributiv und meint, dass jeder Einzelne nach seinem eigenen Urteil handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: Ihr sollt es nicht … machen
  rationale: Der negierte Imperfekt der 2. Person Plural formuliert eine verbindliche Anweisung beziehungsweise ein Verbot. „Ihr sollt nicht“ bewahrt den rechtlichen Ton und klingt zugleich natürlich.
- source_word: כְּכֹל אֲשֶׁר
  choice: so … wie
  rationale: Die Vergleichsformel bezeichnet die Art und Weise. Die deutsche Korrespondenz „so … wie“ gibt sie idiomatisch wieder.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: wie wir es heute hier machen
  rationale: Das Partizip beschreibt die gegenwärtige Praxis. „Heute hier“ gibt Zeit- und Ortsangabe knapp und natürlich wieder.
- source_word: אִישׁ
  choice: Jeder
  rationale: Das singularische אִישׁ wird hier distributiv gebraucht. „Jeder“ bewahrt diese Einzelzuweisung im Deutschen, ohne die Aussage auf erwachsene Männer einzuengen.
- source_word: כָּל הַיָּשָׁר
  choice: was … richtig ist
  rationale: Die Wendung bezeichnet das, was als recht oder richtig beurteilt wird. Die mögliche subjektive Wertung wird durch „in seinen eigenen Augen“ ausgedrückt, ohne sie zusätzlich in „richtig erscheint“ hineinzulesen.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die geläufige hebräische Redewendung für das persönliche Urteil lässt sich im Deutschen formnah und verständlich wiedergeben.
theological_decisions:
- issue: Distributive maskuline Singularform אִישׁ … בְּעֵינָיו
  choice: Jeder … in seinen eigenen Augen
  alternative: Jeder Mann … in seinen eigenen Augen
  rationale: Die Konstruktion weist das Handeln jedem Einzelnen zu. Im Deutschen ist „jeder“ grammatisch maskulin, kann hier aber entsprechend dem distributiven Gebrauch alle angesprochenen Personen vertreten; „jeder Mann“ könnte den Umfang unnötig auf männliche Erwachsene verengen.
- issue: Bewertung von הַיָּשָׁר
  choice: was … richtig ist
  alternative: was … richtig erscheint
  rationale: Der Text spricht wörtlich vom „Richtigen“ in den Augen des Einzelnen. Die gewählte Fassung erhält die Spannung zwischen dem Anspruch des Richtigen und subjektivem Urteil, statt sie durch „erscheint“ ausdrücklich auf bloßen Schein festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit rechtlich-mahnendem Ton. Der Doppelpunkt macht die nachfolgende distributive Erläuterung sichtbar. Die Fußnotenmarke steht am Satzende und erläutert die hebräische Form אִישׁ.
