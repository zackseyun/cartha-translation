    rationale: תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא kann natürlich als das von Jahwe Verabscheute verstanden werden; die Revision erhält die Wertung und den Relativsatz, ohne eine semantisch redundante Doppelung zu erzeugen.
  revised_text: Du sollst für Jahwe, deinen Gott, nicht so handeln. Denn alles Abscheuliche, das Jahwe hasst, haben sie für ihre Götter getan; sogar ihre Söhne und Töchter verbrennen sie im Feuer für ihre Götter.
