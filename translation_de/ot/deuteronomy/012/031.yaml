  verdict: revise
  source_fidelity: Der Entwurf gibt die Grundbedeutung, die kultische Ausrichtung von לְ und die ausdrückliche Nennung von Söhnen und Töchtern zutreffend wieder. Die Wiedergabe von כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא als zwei koordinierte Aussagen („was für Jahwe ein Gräuel ist und was er hasst“) legt jedoch eine Doppelung nahe, die im Hebräischen nicht erforderlich ist. Die Revision gibt die Aussage klar als „alles Abscheuliche, das Jahwe hasst“ wieder und wahrt damit die genitivische Beziehungsnuance ohne künstliche Verdopplung.
  naturalness: „Es mit Jahwe … nicht so machen“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch als eine Formulierung mit „für Jahwe … handeln“. Die revidierte Fassung ist direkt, würdig und natürlich, ohne den rückverweisenden Sinn von כֵן aufzugeben.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Abscheuliche“ bewahrt die starke wertende Bedeutung von תּוֹעֵבָה in heutigem Deutsch; „hasst“ erhält die ungemilderte Aussage von שָׂנֵא. Keine Fußnote ist für diese Fassung erforderlich.
