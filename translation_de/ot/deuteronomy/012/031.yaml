    rationale: Das hebräische לַיהוָה bezeichnet die Beziehung bzw. Ausrichtung der Handlung auf Jahwe. „Für Jahwe … nicht so handeln“ ist im Deutschen natürlicher und gibt diese Relation ausreichend genau wieder.
  - severity: medium
