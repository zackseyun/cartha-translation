base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: de
  text: Du sollst für Jahwe, deinen Gott, nicht so handeln. Denn alles Abscheuliche, das Jahwe hasst, haben sie für ihre Götter getan; sogar ihre Söhne und Töchter verbrennen sie im Feuer für ihre Götter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ
  choice: Du sollst es mit Jahwe, deinem Gott, nicht so machen
  rationale: Die Wendung bewahrt das rückverweisende כֵן („so“) und gibt לַיהוָה relational wieder. „Mit Jahwe … so machen“ ist im Deutschen verständlich und vermeidet die missverständliche Vorstellung, die Handlung werde Jahwe unmittelbar angetan.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: alles, was für Jahwe ein Gräuel ist und was er hasst
  rationale: תּוֹעֵבָה wird mit dem starken, kultisch-moralisch gewichtigen „Gräuel“ wiedergegeben. Die relationale Bedeutung der Constructusverbindung und der ausdrückliche Relativsatz אֲשֶׁר שָׂנֵא bleiben beide sichtbar, ohne die schwerfällige Formulierung „jeden Gräuel Jahwes, den er hasst“.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: haben sie für ihre Götter getan
  rationale: Das Perfekt bezeichnet die bereits ausgeübten Praktiken der Völker; „haben … getan“ erhält ihre gegenwärtige Relevanz. „Für“ drückt die kultische Ausrichtung von לְ natürlich aus.
- source_word: כִּי גַם
  choice: sogar
  rationale: גַם hebt die folgende, besonders entsetzliche Praxis steigernd hervor; „sogar“ bildet diese emphatische Funktion knapp und idiomatisch ab.
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: ihre Söhne und ihre Töchter
  rationale: Die ausdrückliche Nennung beider Geschlechter wird bewahrt und nicht zum allgemeineren „Kinder“ zusammengezogen.
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: verbrennen sie für ihre Götter im Feuer
  rationale: Das hebräische Imperfekt schildert hier die charakteristische Praxis anschaulich; deutsches Präsens passt dazu. „Im Feuer“ bewahrt die konkrete Aussage, „für ihre Götter“ die kultische Widmung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Bundesgottes wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich stehende Gottesname als Name erkennbar bleibt.
- issue: Stärke der göttlichen Wertung in תּוֹעֵבָה und שָׂנֵא
  choice: „Gräuel“ und „hasst“
  alternative: „verabscheuungswürdig“ und „ablehnt“
  rationale: Die starken Aussagen des Hebräischen werden nicht abgeschwächt. Zugleich fügt die Übersetzung keine über den Text hinausgehende theologische Erklärung hinzu.
- issue: Bezug von תּוֹעֲבַת יְהוָה und אֲשֶׁר שָׂנֵא
  choice: „was für Jahwe ein Gräuel ist und was er hasst“
  alternative: „jeden Gräuel Jahwes, den er hasst“
  rationale: Die gewählte Form wahrt sowohl die relationale Mehrdeutigkeit der Constructusverbindung als auch die explizite Aussage, dass Jahwe diese Praktiken hasst, in natürlichem Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstruktur bleibt quellenah, wird aber durch Punkt und Semikolon für heutige Leser gegliedert. Keine konfessionell geprägte Zusatzdeutung.
