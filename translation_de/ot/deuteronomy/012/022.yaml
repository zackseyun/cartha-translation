  source_fidelity: Der Vergleich כַּאֲשֶׁר … כֵּן wird angemessen wiedergegeben. Die passiv-generiche Aussage über Gazelle und Hirsch und die anschließende Erlaubnis an die pluralisch Angeredeten entsprechen dem hebräischen Satzbau und Sinn. „Gleichermaßen“ gibt יַחְדָּו hier treffend als gleiche Berechtigung wieder.
  naturalness: Der Vers ist modernes, würdiges Standarddeutsch und gut verständlich. Der Wechsel von generischem „man“ zu „ihr“ ist im Deutschen natürlich und bildet den Wechsel vom Passiv zur direkten pluralischen Anrede sinnvoll ab.
  terminology: „Gazelle“ und „Hirsch“ sind für צְבִי und אַיָּל tragfähige moderne Bezeichnungen; die Fußnote dokumentiert die Unsicherheit. „Unreine und Reine“ bewahrt das rituelle Begriffspaar knapp und idiomatisch; die Erläuterung verhindert eine moralisierende Fehllektüre.
