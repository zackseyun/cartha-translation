source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: de
  text: 'Doch genauso, wie man Gazelle und Hirsch isst[a], dürft ihr es essen[b]: Unreine und Reine dürfen es gleichermaßen essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reh und Hirsch“. Die genaue Bestimmung der beiden Wildtierarten ist nicht völlig sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sowohl rituell unreine als auch rituell reine Personen dürfen davon essen.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel schränkt die vorherige Anweisung ein beziehungsweise setzt eine qualifizierende Fortführung; „Doch“ gibt diesen Zusammenhang natürlich wieder.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: genauso, wie ...
  rationale: Die Vergleichskonstruktion wird im Deutschen klar und idiomatisch als Entsprechung wiedergegeben.
- source_word: הַצְּבִי
  choice: Gazelle
  rationale: צְבִי bezeichnet wahrscheinlich eine Gazellenart; „Gazelle“ ist die klarste moderne Entsprechung.
- source_word: הָאַיָּל
  choice: Hirsch
  rationale: אַיָּל bezeichnet ein Tier der Hirschfamilie, häufig ein männliches Tier; „Hirsch“ bewahrt diese mögliche Spezifizierung, ohne veraltet zu klingen.
- source_word: תֹּאכְלֶנּוּ / יֹאכְלֶנּוּ
  choice: dürft ihr es essen / dürfen es ... essen
  rationale: Die Imperfektformen haben in diesem Rechtszusammenhang erlaubenden Sinn.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Unreine und Reine
  rationale: Das Wortpaar bezeichnet hier rituellen Status und bewahrt die knappe Gegenüberstellung des Hebräischen.
- source_word: יַחְדָּו
  choice: gleichermaßen
  rationale: Gemeint ist die gleiche Erlaubnis für beide Gruppen, nicht notwendig gemeinsames oder gleichzeitiges Essen.
theological_decisions:
- issue: Ritueller Reinheitsstatus
  choice: Unreine und Reine
  alternative: rituell Unreine und rituell Reine
  rationale: Die knappe traditionelle Begriffspaarung bleibt im Haupttext erhalten; eine Fußnote stellt klar, dass Personen und ihr ritueller Status gemeint sind, nicht moralische Eigenschaften.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem hebräischen Plural im Plural. „Gleichermaßen“ vermeidet das mögliche Missverständnis, beide Gruppen müssten gemeinsam essen.
