base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: de
  text: Du sollst es nicht essen[a]; du sollst es auf den Boden ausgießen wie Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das Blut des Tieres, wie aus dem Zusammenhang hervorgeht.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die gewöhnliche Verneinung leitet hier im rechtlichen Zusammenhang ein Verbot ein.
- source_word: תֹּאכְלֶנּוּ
  choice: du sollst es nicht essen
  rationale: Das Qal-Imperfekt der 2. Person Singular mit Objektsuffix hat hier gebietenden beziehungsweise verbietenden Sinn. Die Formulierung bewahrt den rechtlichen Ton und das Pronomen, das auf das Blut im Kontext verweist.
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: אֶרֶץ bezeichnet hier konkret den Erdboden als Ort des Ausgießens. „Auf die Erde“ ist im Deutschen natürlich und erhält zugleich die knappe Ausdrucksweise des Hebräischen.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: du sollst es gießen
  rationale: Das Qal-Imperfekt der 2. Person Singular mit Objektsuffix beschreibt das vorgeschriebene Ausgießen des Blutes. Zusammen mit „auf die Erde“ gibt „gießen“ die Handlung präzise und idiomatisch wieder.
- source_word: כַּמָּיִם
  choice: wie Wasser
  rationale: Die Vergleichspartikel und das Substantiv bilden einen Vergleich, der im modernen Deutschen natürlich mit „wie Wasser“ wiedergegeben wird.
theological_decisions:
- issue: Bezug der Pronominalsuffixe
  choice: Das wiederholte „es“ bezieht sich auf das im Zusammenhang genannte Blut, ohne „Blut“ im Haupttext erneut einzusetzen.
  alternative: Zur Verdeutlichung „das Blut“ ausdrücklich in den Haupttext aufnehmen.
  rationale: Der hebräische Vers verwendet Objektsuffixe und wiederholt das Substantiv nicht. „Es“ wahrt diese Struktur und lässt den Bezug aus dem unmittelbaren Kontext hervorgehen, ohne eine erläuternde Ergänzung in den Bibeltext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem rechtlichem Ton. Die Anrede im Singular entspricht den hebräischen Verbformen. Der Parallelismus der beiden Anweisungen bleibt erhalten.
