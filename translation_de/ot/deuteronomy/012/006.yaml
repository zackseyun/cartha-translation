base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: de
  text: Dorthin sollt ihr eure Brandopfer, eure Schlachtopfer, eure Zehnten, die Abgabe, die ihr darbringt[a], eure Gelübdeopfer, eure freiwilligen Opfergaben und die Erstgeburten eurer Rinder, Schafe und Ziegen bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Abgabe eurer Hand“; gemeint ist eine persönlich dargebrachte, ausgesonderte Gabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: sollt ihr … bringen
  rationale: Der Hifil von בוא bezeichnet hier im Rahmen einer Rechtsanweisung das Hinbringen; „sollt“ gibt den vorschreibenden Charakter natürlich wieder.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das Adverb verweist auf den zuvor bezeichneten Ort und drückt neben der Ortsangabe auch die Zielrichtung aus.
- source_word: עֹלֹתֵיכֶם
  choice: eure Brandopfer
  rationale: עוֹלָה ist der übliche Fachausdruck für das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte und verständliche deutsche Entsprechung.
- source_word: זִבְחֵיכֶם
  choice: eure Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer und wird so von den zuvor genannten Brandopfern unterscheidbar, ohne eine engere Opferart festzulegen.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: eure Zehnten
  rationale: Das Substantiv bezeichnet als Abgabe bestimmte zehnte Teile; „Zehnten“ ist die geläufige deutsche Wiedergabe.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: die Abgabe aus eurer Hand
  rationale: „Abgabe“ gibt תְּרוּמָה als ausgesonderte Gabe wieder; „aus eurer Hand“ bewahrt das konkrete hebräische Bild einer persönlich dargebrachten Gabe.
- source_word: נִדְרֵיכֶם
  choice: eure Gelübdeopfer
  rationale: In der Liste von Opfergaben sind nicht bloß ausgesprochene Gelübde, sondern die zu ihrer Erfüllung dargebrachten Gaben gemeint.
- source_word: נִדְבֹתֵיכֶם
  choice: eure freiwilligen Gaben
  rationale: Das Wort bezeichnet aus freiem Entschluss dargebrachte Gaben im Unterschied zu solchen, die aufgrund eines Gelübdes geschuldet sind.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: die Erstgeburten eurer Rinder, Schafe und Ziegen
  rationale: בָּקָר bezeichnet Rinder, צֹאן das Kleinvieh, also insbesondere Schafe und Ziegen; die ausdrückliche Wiedergabe ist für heutige Leser klarer als „Herde und Herde“ oder ein unbestimmtes „Vieh“.
