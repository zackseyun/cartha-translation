base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: de
  text: Reißt ihre Altäre nieder, zerbrecht ihre Kultsteine, verbrennt ihre Aschera-Pfähle[a] im Feuer, zerschlagt die Schnitzbilder ihrer Götter[b] und tilgt ihren Namen[c] von jenem Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Ascheren“ oder „ihre Kultpfähle“. Das hebräische Wort bezeichnet Kultobjekte, die mit Aschera verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die geschnitzten Götterbilder“. Das hebräische Wort hebt hervor, dass diese Kultbilder angefertigt beziehungsweise geschnitzt waren.'
    reason: lexical_alternative
  - marker: c
    text: „Ihren Namen tilgen“ bedeutet hier, ihre erinnerte und kultische Gegenwart an diesem Ort zu beseitigen.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: Reißt ihre Altäre nieder
  rationale: נתץ bezeichnet das Niederreißen oder Zerstören gebauter Anlagen; die deutsche Wendung ist anschaulich und idiomatisch.
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: zerbrecht ihre Kultsteine
  rationale: מצבה bezeichnet aufgerichtete Steine beziehungsweise Steinmale mit kultischer Funktion. „Kultsteine“ macht diese Funktion deutlich, ohne eine bestimmte Form festzulegen.
- source_word: אֲשֵׁרֵיהֶם
  choice: ihre Aschera-Pfähle
  rationale: Der Ausdruck bezeichnet Kultobjekte, die mit Aschera verbunden waren. „Aschera-Pfähle“ erhält den religionsgeschichtlich spezifischen Bezug und bleibt allgemein verständlich.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: verbrennt ... im Feuer
  rationale: Die Formulierung bewahrt die ausdrückliche Feuerangabe des Hebräischen und klingt im Deutschen natürlich.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: die Schnitzbilder ihrer Götter
  rationale: פסיל bezeichnet ein durch Schnitzen oder Behauen gefertigtes Bild. „Schnitzbilder“ erhält den konkreten Herstellungsaspekt, den „Götzenbilder“ stärker deutend wiedergeben würde.
- source_word: תְּגַדֵּעוּן
  choice: haut ... um
  rationale: גדע bedeutet abhauen oder umhauen. Bei den hier genannten gefertigten Kultobjekten gibt „umhauen“ die gewaltsame Beseitigung prägnant wieder.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: tilgt ihren Namen
  rationale: Die Wendung bewahrt das hebräische Bild, nach dem Name, Erinnerung und gegenwärtige kultische Geltung beseitigt werden.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: von jenem Ort
  rationale: Direkte, würdige Wiedergabe der Ortsangabe; „jenem“ verweist auf die zuvor genannten Kultstätten.
theological_decisions:
- issue: Deutung von אֲשֵׁרֵיהֶם
  choice: Aschera-Pfähle
  alternative: Ascheren; Kultpfähle
  rationale: Die Wiedergabe wahrt sowohl den Bezug auf Aschera als auch den Charakter als Kultobjekt, ohne es mit der Göttin selbst gleichzusetzen.
- issue: Bezeichnung der פְסִילֵי אֱלֹהֵיהֶם
  choice: Schnitzbilder ihrer Götter
  alternative: Götzenbilder ihrer Götter
  rationale: Die konkrete Beschaffenheit der Gegenstände bleibt sichtbar; die Übersetzung fügt keine über den Kontext hinausgehende wertende Bezeichnung ein.
- issue: Bedeutung von „ihren Namen tilgen“
  choice: Das hebräische Namensmotiv bleibt im Haupttext erhalten
  alternative: jede Erinnerung an sie beseitigen
  rationale: „Name“ kann für erinnerte und kultisch geltende Gegenwart stehen. Die bildhafte und theologisch spannungsreiche Ausdrucksweise wird nicht durch eine einzige Erklärung ersetzt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Befehlsform im Plural. Die konkreten Zerstörungsverben und die hebräische Wendung vom Tilgen des Namens bleiben erhalten; religionsgeschichtlich spezifische Begriffe werden knapp erläutert.
