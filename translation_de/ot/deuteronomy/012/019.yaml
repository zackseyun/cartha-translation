id: DEU.12.19
reference: Deuteronomy 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: de
  text: Achte darauf, dass du den Leviten nicht im Stich lässt, solange du auf deinem Land lebst.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Leviten“. Im Hebräischen steht der Singular „der Levit“, wahrscheinlich stellvertretend für die Leviten als Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in deinem Land“. Wörtlich steht im Hebräischen „auf deinem Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Achte darauf
  rationale: Der Nifal-Imperativ mit לְךָ ist eine eindringliche Warnformel. „Achte darauf“ ist im modernen Deutschen natürlich und erhält den mahnenden Ton.
- source_word: פֶּן
  choice: dass du … nicht
  rationale: פֶּן leitet eine negative Warnung ein. Die Konstruktion mit „darauf, dass … nicht“ gibt sie verständlich und idiomatisch wieder.
- source_word: תַּעֲזֹב
  choice: im Stich lässt
  rationale: עזב kann „verlassen“, „aufgeben“ oder „im Stich lassen“ bedeuten. Im Zusammenhang der sozialen Fürsorge bezeichnet „im Stich lassen“ verständlich und mit angemessenem moralischem Gewicht die unterlassene Unterstützung.
- source_word: אֶת הַלֵּוִי
  choice: den Leviten
  rationale: Der hebräische Text hat den bestimmten Singular, der hier wahrscheinlich stellvertretend für die Gruppe gebraucht wird. Der deutsche Singular bewahrt diese Form.
- source_word: כָּל יָמֶיךָ
  choice: solange du … lebst
  rationale: Wörtlich „alle deine Tage“; die gewählte idiomatische deutsche Wendung gibt die lebenslange Dauer klar wieder.
- source_word: עַל אַדְמָתֶךָ
  choice: auf deinem Land
  rationale: „Auf deinem Land“ bildet עַל und אַדְמָה eng ab und ist im Deutschen verständlich; „in deinem Land“ ist kontextuell ebenfalls möglich.
theological_decisions:
- issue: Repräsentativer Singular bei der Bezeichnung des Leviten
  choice: den Leviten
  alternative: die Leviten
  rationale: Der bestimmte Singular des Hebräischen wird beibehalten, ohne auszuschließen, dass er die Leviten als Gruppe repräsentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnung ist direkt und gut verständlich; der repräsentative Singular und die räumliche Formulierung des Hebräischen bleiben im Haupttext sichtbar.
