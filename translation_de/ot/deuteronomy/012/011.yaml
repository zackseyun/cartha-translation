  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: de
  text: 'Dann sollt ihr alles, was ich euch gebiete, an den Ort bringen, den Jahwe, euer Gott, erwählen wird, um seinen Namen dort wohnen zu lassen: eure Brandopfer, eure Schlachtopfer, eure Zehnten, die Abgabe aus eurer Hand und das Beste von allen Gelübden, die ihr Jahwe gelobt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה ... שָׁמָּה תָבִיאוּ
  choice: Dann sollt ihr an den Ort ... alles bringen
  rationale: Die deutsche Satzstellung gibt den zukünftigen Folgezusammenhang und die Bewegungsrichtung zum erwählten Ort natürlich wieder, ohne das schwerfällige hebräische Satzgefüge nachzuahmen.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: den Ort, den ... erwählen wird
  rationale: Bewahrt den bestimmten Ort als zentrales Motiv und gibt den vorausblickenden Kontext des Yiqtol mit Futur wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: damit sein Name dort wohnt
  rationale: Bewahrt das deuteronomische Bild vom Wohnen des Namens in natürlichem Deutsch; die ausdrücklich kausative Wiedergabe steht in der Fußnote.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: alles, was ich euch gebiete
  rationale: Natürliches modernes Deutsch mit uneingeschränktem Umfang; das präsentische Verb gibt die aktuell geltende Weisung wieder.
- source_word: עוֹלֹתֵיכֶם
  choice: eure Brandopfer
  rationale: Etablierte und sachlich genaue Bezeichnung für vollständig verbrannte Opfer.
- source_word: זִבְחֵיכֶם
  choice: eure Schlachtopfer
  rationale: Gibt den Opferbegriff genauer als das sehr allgemeine „Opfer“ wieder, ohne ihn auf eine einzelne Unterart wie das Gemeinschaftsopfer zu verengen.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: eure Zehnten
  rationale: Übliche deutsche Wiedergabe für Abgaben des zehnten Teils.
- source_word: תְרֻמַת יֶדְכֶם
  choice: die Abgabe aus eurer Hand
  rationale: Erhält das konkrete Bild der Hand und bleibt verständlicher als ein technischer Ausdruck wie „Hebopfer“.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: und alles Auserlesene von euren Gelübden
  rationale: Bewahrt sowohl den Gedanken des Besten beziehungsweise Erwählten als auch den ausdrücklichen Bezug auf Gelübde, ohne das im Hebräischen nicht stehende Substantiv „Opfergaben“ einzufügen.
- source_word: אֲשֶׁר תִּדְּרוּ לַיהוָה
  choice: die ihr Jahwe ablegt
  rationale: „Ein Gelübde ablegen“ ist eine natürliche deutsche Verbindung und erhält Jahwe als Empfänger der Gelübde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Das Wohnen des Namens in לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: damit sein Name dort wohnt
  alternative: um seinen Namen dort wohnen zu lassen
  rationale: Der Haupttext bewahrt die charakteristische Rede vom Wohnen des Namens, ohne Gottes Wesen mit dem Ort gleichzusetzen. Die Fußnote hält die kausative Form des hebräischen Verbs ausdrücklich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Opferbegriffe bleiben präzise, aber allgemein verständlich. Die lange hebräische Satzstruktur wurde für natürliche deutsche Lesbarkeit maßvoll umgestellt; zentrale Wiederholungen und die theologisch bedeutsame Namensformel bleiben erhalten.
