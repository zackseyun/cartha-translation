revisions:
- from: 'Dann sollt ihr an den Ort, den Jahwe, euer Gott, erwählen wird, damit sein Name dort wohnt[a], alles bringen, was ich euch gebiete: eure Brandopfer, eure Schlachtopfer, eure Zehnten, die Abgabe aus eurer Hand und alles Auserlesene von euren Gelübden, die ihr Jahwe ablegt.'
  to: 'Dann sollt ihr alles, was ich euch gebiete, an den Ort bringen, den Jahwe, euer Gott, erwählen wird, um seinen Namen dort wohnen zu lassen: eure Brandopfer, eure Schlachtopfer, eure Zehnten, die Abgabe aus eurer Hand und das Beste von allen Gelübden, die ihr Jahwe gelobt.'
  rationale: Die Umstellung macht die deutsche Satzführung flüssiger, ohne die Richtungsbewegung oder die umfassende Aufzählung zu verändern. „Um seinen Namen dort wohnen zu lassen“ gibt den hebräischen Kausativ unmittelbar wieder; daher ist die bisherige Alternativfußnote nicht mehr erforderlich. „Das Beste von allen Gelübden“ gibt מִבְחַר נִדְרֵיכֶם idiomatisch und quellennah wieder, ohne das nicht ausdrücklich vorhandene Wort „Opfer“ hinzuzufügen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:50Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder, die Zukunfts-/Weisungsdimension, die Opferliste und den Gottesnamen insgesamt zuverlässig wieder. Die Wiedergabe von לְשַׁכֵּן als „damit sein Name dort wohnt“ lässt jedoch die kausative Verbform im Haupttext zurücktreten; die Fußnote weist zwar darauf hin, doch eine kausativere deutsche Formulierung ist hier ohne Bedeutungsverlust möglich. Außerdem bedeutet מִבְחַר nicht „alles Auserlesene von“ im Sinn einer unklaren Teilmenge, sondern „alles Beste/Erlesenste eurer Gelübde“.
  naturalness: „Dann sollt ihr an den Ort ... alles bringen“ ist verständlich, aber die Wiederaufnahme „dorthin“ ist im Deutschen flüssiger und bildet die Richtungsangabe שָׁמָּה klar ab. „Das Beste von allen Gelübden, die ihr Jahwe gelobt“ ist idiomatischer als „alles Auserlesene von euren Gelübden, die ihr Jahwe ablegt“.
  terminology: „Jahwe“, „Brandopfer“, „Schlachtopfer“ und „Zehnten“ sind angemessen. „Abgabe aus eurer Hand“ bewahrt die hebräische Wendung, ist jedoch leicht hölzern; „eure Handabgabe“ ist kompakter, aber technisch. Die vorliegende Form kann beibehalten werden. Für נִדְרֵיכֶם ist „Gelübde“ korrekt; das Verb sollte mit „geloben“ verbunden werden.
  issues:
  - severity: medium
    issue: Kausativ von לְשַׁכֵּן im Haupttext nur abgeschwächt wiedergegeben
    rationale: „damit sein Name dort wohnt“ gibt das Wohnen wieder, nicht ausdrücklich das Veranlassen des Wohnens. „um seinen Namen dort wohnen zu lassen“ ist natürliches modernes Deutsch und spiegelt den Hiphil direkt wider.
  - severity: medium
    issue: „alles Auserlesene von euren Gelübden“ ist semantisch und idiomatisch unpräzise
    rationale: מִבְחַר bezeichnet das Beste bzw. Erlesenste. Die deutsche Konstruktion „Auserlesenes von“ klingt unnatürlich und kann den Bezug verschleiern. „das Beste von allen Gelübden“ stellt den Superlativgedanken klar dar.
  - severity: low
    issue: Verbverbindung zu Gelübden
    rationale: Im Deutschen gelobt man ein Gelübde; „ein Gelübde ablegen“ ist möglich, aber bei der Relativkonstruktion „die ihr Jahwe gelobt“ unmittelbarer und näher am hebräischen Verb נדר.
  revised_text: 'Dann sollt ihr alles, was ich euch gebiete, an den Ort bringen, den Jahwe, euer Gott, erwählen wird, um seinen Namen dort wohnen zu lassen: eure Brandopfer, eure Schlachtopfer, eure Zehnten, die Abgabe aus eurer Hand und das Beste von allen Gelübden, die ihr Jahwe gelobt.'
  revised_footnotes: []
  revision_rationale: Die Umstellung macht die deutsche Satzführung flüssiger, ohne die Richtungsbewegung oder die umfassende Aufzählung zu verändern. „Um seinen Namen dort wohnen zu lassen“ gibt den hebräischen Kausativ unmittelbar wieder; daher ist die bisherige Alternativfußnote nicht mehr erforderlich. „Das Beste von allen Gelübden“ gibt מִבְחַר נִדְרֵיכֶם idiomatisch und quellennah wieder, ohne das nicht ausdrücklich vorhandene Wort „Opfer“ hinzuzufügen.
