id: DEU.12.10
reference: Deuteronomy 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: de
  text: Wenn ihr aber den Jordan überquert und in dem Land wohnt, das Jahwe, euer Gott, euch als Erbbesitz gibt, und er euch Ruhe vor all euren Feinden ringsum verschafft, dann werdet ihr in Sicherheit wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: wenn ihr aber … überquert
  rationale: Das waw-präfigierte Perfekt steht in einer zukunftsbezogenen Folge. Die temporale Wiedergabe mit „wenn“ führt natürlich zum abschließenden „dann“; „aber“ markiert den Gegensatz zur noch nicht erreichten Ruhe in Vers 9.
- source_word: וִישַׁבְתֶּם
  choice: wohnt / werdet … wohnen
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen im Land. „Wohnen“ ist gegenwärtiges, klares Deutsch und bewahrt den Siedlungsaspekt.
- source_word: מַנְחִיל אֶתְכֶם
  choice: euch als Erbbesitz gibt
  rationale: Der Hifil von נחל bezeichnet, dass Gott Israel das Land zum erblichen Besitz übergibt. Diese Formulierung bewahrt sowohl Gottes Handeln als auch den Erbteilgedanken.
- source_word: וְהֵנִיחַ לָכֶם
  choice: er euch Ruhe … verschafft
  rationale: Der Hifil von נוח bedeutet hier, Ruhe beziehungsweise Entlastung zu gewähren. „Ruhe verschaffen“ erhält das Leitmotiv der Ruhe im Land und klingt im Deutschen natürlich.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: vor all euren Feinden ringsum
  rationale: „Vor“ ist im Deutschen die idiomatische Verbindung mit „Ruhe verschaffen“; „ringsum“ bewahrt die räumliche und umfassende Aussage von מִסָּבִיב.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: dann werdet ihr in Sicherheit wohnen
  rationale: בֶּטַח beschreibt ein sicheres, von Bedrohung freies Wohnen. „In Sicherheit wohnen“ gibt dies würdig und verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Das Land als von Gott gewährter Erbbesitz
  choice: das Jahwe … euch als Erbbesitz gibt
  alternative: das Jahwe … euch erben lässt
  rationale: Die gewählte Fassung hält Gottes aktive Zuweisung und den Charakter des Landes als Erbbesitz zusammen, ohne über den Wortlaut hinaus eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Wenn-dann-Struktur bildet den syntaktischen und gedanklichen Zusammenhang des hebräischen Satzes ab, bleibt aber durch klare Teilsätze gut verständlich.
