base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: de
  text: Achte darauf, all diese Worte zu bewahren und auf sie zu hören[a], die ich dir gebiete, damit es dir und deinen Kindern[b] nach dir für immer gut geht; denn du wirst tun, was in den Augen Jahwes, deines Gottes, gut und recht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Bewahre und höre all diese Worte.“ Das Hebräische verbindet sorgfältiges Bewahren mit aufmerksamem Hören; im Zusammenhang ist Gehorsam eingeschlossen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Söhnen“; hier im umfassenderen Sinn von Kindern beziehungsweise Nachkommenschaft.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Achte darauf, … zu hören
  rationale: Die Verbindung gibt sowohl die auffordernde Sorgfalt von שׁמר als auch das aufmerksame Hören von שׁמע wieder. Im Zusammenhang schließt das Hören Gehorsam ein, ohne dass dieser ausdrücklich an die Stelle des hebräischen Hörens gesetzt wird.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all diese Worte
  rationale: דברים bezeichnet hier die von Mose ausgesprochenen Weisungen; „Worte“ wahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: מְצַוֶּךָּ
  choice: ich dir gebiete
  rationale: Das Partizip bezeichnet das gegenwärtige Gebieten. Das Präsens ist im Deutschen natürlich und inhaltlich genau.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: damit es dir … gut geht
  rationale: Dies gibt die deuteronomische Wendung für Wohlergehen idiomatisch und zugleich eng am Sinn wieder.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: und deinen Kindern nach dir
  rationale: בנים bedeutet formal „Söhne“, kann in dieser Verheißungsformel jedoch die Kinder beziehungsweise Nachkommenschaft insgesamt bezeichnen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte Fortdauer in die Zukunft; „für immer“ ist knapp und geläufig.
- source_word: כִּי
  choice: wenn
  rationale: 'Im Zusammenhang lässt sich כִּי konditional verstehen: Das Wohlergehen steht damit in Beziehung zum Tun des Guten und Rechten. Da auch eine kausale Deutung möglich ist, wird diese in einer Fußnote genannt.'
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: was … gut und recht ist
  rationale: Die substantivisch gebrauchten Adjektive werden im Deutschen natürlich als „was gut und recht ist“ wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die deutsche Form bewahrt das hebräische Bild für Gottes Bewertung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehovah
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ ist dessen geläufige deutsche Wiedergabe und bewahrt den Unterschied zu einem bloßen Titel.
- issue: Umfang von בָנֶיךָ
  choice: Kinder
  alternative: Söhne; Nachkommen
  rationale: Im Rahmen der Bundesverheißung kann der maskuline Plural die gesamte Nachkommenschaft umfassen. „Kinder“ erhält den familiären Ausdruck, ohne den Bezug unnötig auf männliche Nachkommen zu begrenzen.
- issue: Verhältnis von כִּי zum vorausgehenden Wohlergehen
  choice: wenn
  alternative: weil; denn
  rationale: Die konditionale Wiedergabe bringt den sachlichen Zusammenhang zwischen Gehorsam und Wohlergehen natürlich zum Ausdruck. Die hebräische Konjunktion bleibt jedoch mehrdeutig und kann auch kausal verstanden werden; diese Spannung wird durch die Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt trotz der langen hebräischen Periode gut verständlich. „Gebieten“ wahrt den feierlichen Charakter des Gesetzestextes, ohne altertümlich zu wirken; „Jahwe“ folgt der deutschen Form des Gottesnamens.
