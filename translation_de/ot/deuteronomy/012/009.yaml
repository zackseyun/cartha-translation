  source_fidelity: Der kausale Anschluss, die Verneinung mit Zeitbezug, die beiden Zielbegriffe und die Präsenswiedergabe von נֹתֵן sind grundsätzlich treffend. Der hebräische Relativsatz אֲשֶׁר ... נֹתֵן לָךְ ist jedoch hinsichtlich seines Bezugs nicht ausdrücklich auf beide koordinierten Begriffe festgelegt. Das pluralische deutsche Relativpronomen „die“ legt diesen Bezug stärker fest als der Ausgangstext.
