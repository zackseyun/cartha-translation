  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: de
  text: Denn bis jetzt seid ihr noch nicht zu dem Ort der Ruhe und zu dem Erbbesitz gelangt, den Jahwe, euer Gott, euch gibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Ruhe“. Das hebräische Wort מְנוּחָה kann sowohl „Ruhe“ als auch einen konkreten „Ort der Ruhe“ bezeichnen; der Zusammenhang des Landes legt hier die konkretere Bedeutung nahe.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anweisung ein und bewahrt den kausalen Zusammenhang.
- source_word: בָּאתֶם
  choice: seid … gekommen
  rationale: Gibt das gewöhnliche Bedeutungsspektrum von בוא wieder und verbindet sich natürlich mit der Zeitangabe und den folgenden Zielangaben.
- source_word: עַד עָתָּה
  choice: bis jetzt noch nicht
  rationale: Die Verbindung mit der Verneinung bezeichnet einen bis zum gegenwärtigen Zeitpunkt noch nicht eingetretenen Vorgang.
- source_word: הַמְּנוּחָה
  choice: der Ort der Ruhe
  rationale: מְנוּחָה kann sowohl den Zustand der Ruhe als auch einen Ruheort bezeichnen. Im Zusammenhang des Einzugs in das Land liegt die konkrete Zielvorstellung nahe, ohne dass die Bedeutung „Ruhe“ verloren geht.
- source_word: הַנַּחֲלָה
  choice: der Erbbesitz
  rationale: Bezeichnet hier das von Gott zugeteilte Land als bleibenden, ererbten Besitz; „Erbbesitz“ bewahrt sowohl den Gabe- als auch den Zuteilungsaspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Partizip stellt Gottes Geben als gegenwärtig wirksam beziehungsweise unmittelbar bevorstehend dar; das deutsche Präsens lässt beide Nuancen zu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt diese Form, ohne sie durch einen Titel zu ersetzen.
- issue: Bezug des Relativsatzes אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: auf den Ort der Ruhe und den Erbbesitz gemeinsam
  alternative: nur auf den Erbbesitz
  rationale: Stellung und Sinnzusammenhang erlauben, beide koordinierten Zielbegriffe als Gottes Gabe zu verstehen. Das pluralische „die“ macht diesen Bezug im Deutschen deutlich, ohne die beiden Begriffe gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ort der Ruhe“ vermeidet die heute oft mit Grabstätten verbundene Nebenbedeutung von „Ruhestätte“. Die Wiederholung von „zu“ bildet die parallelen hebräischen Zielangaben ab; „Erbbesitz“ hält den Land- und Zuteilungsbezug fest.
