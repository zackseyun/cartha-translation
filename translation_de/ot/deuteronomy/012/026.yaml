  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: de
  text: Nur deine heiligen Gaben, die dir gehören, und deine Gelübdegaben[a] sollst du mitnehmen und zu dem Ort kommen, den Jahwe erwählen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Gelübde“. Das Hebräische kann entweder die Gelübde selbst oder, in diesem Opferzusammenhang, die Gaben zu ihrer Erfüllung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Markiert im Zusammenhang eine einschränkende Ausnahme gegenüber der zuvor erlaubten örtlichen Schlachtung; „Doch“ gibt den adversativ-restriktiven Übergang natürlich wieder.
- source_word: קָדָשֶׁיךָ
  choice: deine heiligen Gaben
  rationale: Bezeichnet Dinge, die für den heiligen Gebrauch ausgesondert sind. „Heilige Gaben“ bewahrt die kultische Breite, ohne eine bestimmte Opferart festzulegen.
- source_word: אֲשֶׁר יִהְיוּ לְךָ
  choice: die dir gehören
  rationale: Gibt die possessive Wendung wörtlich und zugleich idiomatisch wieder.
- source_word: וּנְדָרֶיךָ
  choice: deine Gelübdegaben
  rationale: Das Wort bedeutet formal „deine Gelübde“, kann im Opferkontext aber konkret die zur Erfüllung dieser Gelübde bestimmten Gaben bezeichnen; „Gelübdegaben“ macht den sachlichen Bezug deutlich.
- source_word: תִּשָּׂא
  choice: sollst du mitnehmen
  rationale: Bewahrt den konkreten Sinn des Tragens beziehungsweise Transportierens zum zentralen Heiligtum.
- source_word: וּבָאתָ
  choice: und … kommen
  rationale: Erhält die im Hebräischen ausgedrückte Abfolge von Mitnehmen und Ankommen, statt beide Verben zusammenzuziehen.
- source_word: הַמָּקוֹם
  choice: den Ort
  rationale: Entspricht der wiederkehrenden deuteronomischen Bezeichnung für die von Gott bestimmte zentrale Kultstätte.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: den Jahwe erwählen wird
  rationale: Die Verbform ist hier zukunftsbezogen; „erwählen“ entspricht dem würdevollen, im Deutschen vertrauten Sprachgebrauch dieser Formel. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וּנְדָרֶיךָ im Opferkontext
  choice: Gelübdegaben
  alternative: Gelübde; was du gelobt hast
  rationale: Im unmittelbaren kultischen Zusammenhang sind die Gegenstände gemeint, die aufgrund von Gelübden zum erwählten Ort gebracht werden. Die Übersetzung konkretisiert den Referenten, ohne eine bestimmte Opferklasse einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen, klingt aber natürlich. „Heilige Gaben“ und „Gelübdegaben“ verwenden verständliche kultische Begriffe, ohne konfessionelle Sonderdeutungen.
