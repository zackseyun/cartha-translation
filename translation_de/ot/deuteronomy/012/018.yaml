review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Text insgesamt eng: Der exklusive Kontrast von כִּי אִם, die Einzelanrede, die vollständige Haushaltsliste, der Gottesname und die kultische Lokalisierung sind erhalten. Die Wendung בִּשְׁעָרֶיךָ wird zutreffend erläutert. Das zusätzliche „wohnt“ ist jedoch eine nicht notwendige Einengung von „ist/in deinen Toren“ und sollte im Haupttext nicht ergänzt werden.'
  naturalness: Der Satz ist überwiegend modernes, würdiges Standarddeutsch. „Sich bei allem freuen“ ist allerdings weniger idiomatisch und kann ein begleitendes Sichfreuen bei einer Tätigkeit nahelegen. „Sich über alles freuen, was du unternimmst“ gibt die deutsche Rektion natürlicher wieder und wahrt den gemeinten Umfang der hebräischen Wendung.
  terminology: „Jahwe“ gibt יְהוָה konsequent als Eigennamen wieder. „Sklave und Sklavin“ erhält die geschlechtliche Unterscheidung und bezeichnet den historischen Status klar, ohne eine weitergehende sozialgeschichtliche Präzisierung zu behaupten. „Levit“ ist korrekt.
  issues:
  - severity: low
    issue: „wohnt“ ergänzt den Ausdruck „der in deinen Toren ist“.
    rationale: בִּשְׁעָרֶיךָ bezeichnet die örtliche Gemeinschaft bzw. den kommunalen Bereich; ein eigenes Verb für Wohnen steht nicht im hebräischen Text. Die Fußnote kann die idiomatische Bedeutung erläutern, ohne den Haupttext durch eine Zusatzinformation einzuengen.
  - severity: low
    issue: „bei allem, was du unternimmst“ ist stilistisch und semantisch weniger präzise als „über alles, was du unternimmst“.
    rationale: Das Deutsche verwendet bei „sich freuen“ hier natürlicher „über“. בְּכֹל markiert den Bereich bzw. Anlass des Freuens; die revidierte Form gibt dies klar wieder.
