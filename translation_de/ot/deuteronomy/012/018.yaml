  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: de
  text: 'Sondern vor Jahwe, deinem Gott, sollst du es essen, an dem Ort, den Jahwe, dein Gott, erwählen wird: du, dein Sohn und deine Tochter, dein Sklave und deine Sklavin und der Levit, der in deinen Toren ist.[a] Und du sollst dich vor Jahwe, deinem Gott, über alles freuen, was du unternimmst.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Levit, der in deinen Toren ist“. „In deinen Toren“ bezeichnet im Hebräischen den örtlichen Lebens- und Rechtsbereich, also die eigene Stadt oder Gemeinschaft.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: „bei allem Aussenden deiner Hand“; gemeint ist alles, woran du arbeitest oder was du unternimmst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: Die Wendung setzt der Untersagung im vorherigen Vers die allein zulässige Möglichkeit entgegen. „Sondern“ gibt diesen restriktiven Gegensatz im Deutschen knapp und natürlich wieder.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: vor Jahwe, deinem Gott
  rationale: „Vor“ bewahrt die räumliche und gegenwartsbezogene Bedeutung von לִפְנֵי; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: תֹּאכְלֶנּוּ
  choice: sollst du es essen
  rationale: Das Qal-Imperfekt in diesem Weisungszusammenhang hat verpflichtende Kraft; das Objektsuffix wird mit „es“ ausdrücklich wiedergegeben.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר ... בּוֹ
  choice: an dem Ort, den ... erwählen wird
  rationale: Die Formulierung bewahrt die für das Deuteronomium typische Rede vom künftig erwählten Ort. Das rückbezügliche בּוֹ ist in der natürlichen deutschen Relativkonstruktion mitenthalten.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: dein Sklave und deine Sklavin
  rationale: Die Wiedergabe benennt den historischen unfreien Status und erhält die ausdrückliche Unterscheidung zwischen männlicher und weiblicher Person.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: der Levit, der in deinen Toren wohnt
  rationale: Die hebräische kommunale Wendung „in deinen Toren“ bleibt im Text erhalten; „wohnt“ verdeutlicht ihren Bezug auf den am Ort ansässigen Leviten.
- source_word: וְשָׂמַחְתָּ
  choice: du sollst dich ... freuen
  rationale: Die reflexive deutsche Form gibt das aktive, festliche Sichfreuen natürlich und mit dem weisenden Charakter des Kontextes wieder.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: bei allem, was du unternimmst
  rationale: Die hebräische Wendung bezeichnet alles, woran jemand seine Hand legt, also Arbeit und Unternehmungen. Die idiomatische deutsche Fassung vermittelt diesen Sinn, während die Fußnote das Bild bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Einzelanrede. Die Aufzählung des Haushalts bleibt vollständig und singularisch. Der Doppelpunkt macht deutlich, dass alle genannten Personen gemeinsam an dem Mahl teilnehmen. Archaische Wörter wie „Knecht“ und „Magd“ werden vermieden; die bildhafte Schlusswendung wird im Haupttext verständlich und in der Fußnote quellennah wiedergegeben.
