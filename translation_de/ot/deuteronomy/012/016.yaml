  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: de
  text: Nur das Blut dürft ihr nicht essen; ihr sollt es wie Wasser auf den Boden ausgießen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Einschränkung der zuvor erteilten Erlaubnis knapp und natürlich.
- source_word: הַדָּם
  choice: das Blut
  rationale: Der bestimmte Artikel wird beibehalten; gemeint ist das Blut des geschlachteten Tieres.
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nicht essen
  rationale: Gibt die verneinte Imperfektform als verbindliches Verbot in natürlichem modernem Deutsch wieder.
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: אֶרֶץ bezeichnet hier die Erdoberfläche, auf die das Blut gegossen wird; „Erde“ ist in dieser festen, anschaulichen Wendung natürlich.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: ihr sollt es … gießen
  rationale: Das Verb bezeichnet das Ausgießen; das Suffix „es“ verweist eindeutig auf das Blut zurück.
- source_word: כַּמָּיִם
  choice: wie Wasser
  rationale: Bewahrt den schlichten Vergleich idiomatisch und ohne zusätzliche Deutung.
theological_decisions:
- issue: Umgang mit Blut im Speisegebot
  choice: Das Verbot, Blut zu essen, und die Anweisung, es auf die Erde zu gießen, werden unmittelbar wiedergegeben.
  alternative: Eine symbolische oder auf spätere theologische Zusammenhänge ausgeweitete Deutung in den Wortlaut aufzunehmen.
  rationale: Der Vers formuliert eine konkrete Rechtsanweisung; die Übersetzung sollte keine über den Wortlaut hinausgehende theologische Erklärung eintragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gesetzeston. Der Wechsel von „dürft nicht“ beim Verbot zu „sollt“ bei der positiven Anweisung bildet die beiden unterschiedlichen Funktionen natürlich ab.
