  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: de
  text: Achte jedoch unbedingt darauf, das Blut nicht zu essen[a]; denn das Blut ist das Leben, und du sollst nicht das Leben zusammen mit dem Fleisch essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Seele« für »das Leben« an beiden Stellen. Das hebräische Wort נֶפֶשׁ bezeichnet hier die Lebenskraft des Geschöpfes; deshalb geben es viele Übersetzungen mit »Leben« wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Leitet nach der zuvor gewährten Erlaubnis eine nachdrückliche Einschränkung ein; »Doch« stellt diesen Gegensatz im Deutschen natürlich her.
- source_word: חֲזַק
  choice: achte unbedingt darauf
  rationale: Wörtlich »sei stark«; zusammen mit לְבִלְתִּי ist es eine eindringliche Aufforderung, etwas entschlossen zu unterlassen. Die gewählte Formulierung gibt diese Kraft idiomatisch wieder.
- source_word: לְבִלְתִּי אֲכֹל
  choice: nicht zu essen
  rationale: Die Konstruktion bezeichnet hier das entschiedene Unterlassen des Essens.
- source_word: הַדָּם
  choice: das Blut
  rationale: Direkte und im Vers konsequent beibehaltene Wiedergabe.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung des Verbots ein und wahrt zugleich den würdigen Gesetzesstil.
- source_word: הַנָּפֶשׁ
  choice: das Leben
  rationale: נֶפֶשׁ bezeichnet hier das belebende Leben des Tieres, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: וְלֹא תֹאכַל
  choice: und du sollst nicht essen
  rationale: Gibt die verbietende Kraft der hebräischen Verbform in einem angemessenen Rechtston wieder.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: das Leben zusammen mit dem Fleisch
  rationale: Bewahrt die konkrete Verknüpfung von Leben, Blut und Fleisch; »zusammen mit« verdeutlicht עִם, ohne die Aussage auszulegen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang des Blutverbots
  choice: Leben
  alternative: Seele
  rationale: Der Zusammenhang identifiziert das Blut mit dem belebenden Leben des Geschöpfes. »Seele« könnte hier unbeabsichtigt einen späteren Leib-Seele-Dualismus nahelegen, den der hebräische Text nicht festlegt; die Fußnote hält die echte lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Einschränkung und die eindringliche Kraft von חֲזַק werden idiomatisch ausgedrückt; der gesetzliche Ton von »du sollst nicht« und die konkrete Bildsprache des Hebräischen bleiben erhalten.
