revisions:
- from: Wenn der Ort, den Jahwe, dein Gott, erwählen wird, um seinen Namen dort hinzusetzen[a], zu weit von dir entfernt ist, darfst du von deinen Rindern und deinem Kleinvieh, die Jahwe dir gegeben hat, schlachten, wie ich dir geboten habe. Dann darfst du es in deinen Ortschaften[b] essen, ganz nach deinem Verlangen[c].
  to: Wenn der Ort, den Jahwe, dein Gott, erwählen wird, um dort seinen Namen zu setzen[a], zu weit von dir entfernt ist, darfst du von deinem Rind- und Kleinvieh, das Jahwe dir gegeben hat, schlachten, wie ich dir geboten habe, und es in deinen Ortschaften[b] essen, ganz nach deinem Verlangen[c].
  rationale: Die Revision beschränkt sich auf eine natürlichere, zugleich quellennähere Fassung der formelhaften Wendung über den Namen Jahwes sowie auf eine präzisere Fußnotenalternative. Die erlaubende Rechtsfunktion, die direkte Singularanrede, die Bezeichnung Jahwes und die metonymische Wiedergabe von „Toren“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
