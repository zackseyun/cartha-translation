    issue: Unidiomatische Stellung von „hinzusetzen“ in der Heiligtumsformel
    rationale: Das Präfix in „dort hinzusetzen“ ist im Deutschen hier nicht erforderlich. „Um dort seinen Namen zu setzen“ bewahrt die wörtliche, nicht weiter theologisch ausgedeutete Formel und liest sich klarer.
  - severity: low
    issue: Fußnote c formuliert „voller Appetit“ unpräzise
    rationale: בכל אֲוַּת נַפְשֶׁךָ bezeichnet umfassendes Verlangen beziehungsweise Appetit, nicht notwendigerweise einen „vollen“ Appetit. Die Alternative sollte dies neutral ausdrücken.
