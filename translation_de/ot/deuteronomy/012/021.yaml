review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Bedingung, die Entfernung des erwählten Ortes, die Erlaubnis zum Schlachten von Rind- und Kleinvieh, die Gabe Jahwes, den Verweis auf Moses' vorherige Weisung sowie den Verzehr am Wohnort inhaltlich zuverlässig wieder. „Erwählen wird“ ist für den hebräischen Yiqtol im deuteronomischen Gesetzesrahmen möglich. Die Wiedergabe „darfst“ bildet den permissiven Sinn im Kontext angemessen ab. „Es essen“ benennt lediglich das aus dem Schlachten resultierende Fleisch und ergänzt keine inhaltliche Bestimmung.
  naturalness: „Seinen Namen dort hinzusetzen“ ist im modernen Standarddeutsch unnötig sperrig und kann den Eindruck einer bloß physischen Verlagerung erwecken. „Um dort seinen Namen zu setzen“ ist näher an der hebräischen Wortstellung und als bewusst formelhafte Sprache verständlich. Eine durchgehende Satzverbindung mit „und“ bildet die hebräische Abfolge natürlicher ab als der zusätzliche Satzbeginn „Dann“.
  terminology: „Jahwe“ gibt יהוה konsequent als Namen wieder. „Rind- und Kleinvieh“ ist eine präzise, natürliche Wiedergabe von בקר und צאן. „Ortschaften“ gibt die metonymische Bedeutung von „Toren“ wieder; die wörtliche Form bleibt zutreffend in der Fußnote dokumentiert. Die Fußnote zum Verlangen sollte die Bedeutung von נפש nicht durch die missverständliche Wendung „voller Appetit“ einengen.
  issues:
