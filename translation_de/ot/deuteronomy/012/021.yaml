source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: de
  text: Wenn der Ort, den Jahwe, dein Gott, erwählen wird, um dort seinen Namen zu setzen[a], zu weit von dir entfernt ist, darfst du von deinem Rind- und Kleinvieh, das Jahwe dir gegeben hat, schlachten, wie ich dir geboten habe, und es in deinen Ortschaften[b] essen, ganz nach deinem Verlangen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um seinen Namen dort zu setzen“. Die hebräische Wendung lautet wörtlich: „seinen Namen dort zu setzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „innerhalb deiner Tore“; die Tore stehen für die jeweiligen Städte oder Ortschaften.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nach allem Verlangen deiner Seele“; auch: „ganz nach deinem Appetit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Wenn … zu weit von dir entfernt ist
  rationale: כִּי leitet hier die Bedingung ein; רחק bezeichnet räumliche Entfernung. „Zu weit“ gibt die praktische Voraussetzung der folgenden Erlaubnis idiomatisch wieder.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: der Ort, den Jahwe, dein Gott, erwählen wird
  rationale: Der Yiqtol von בחר lässt in der Gesetzesrede eine zukünftige Wahl erkennen; „erwählen“ bewahrt zugleich den würdevollen Sprachgebrauch der wiederkehrenden Heiligtumsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: um seinen Namen dort hinzusetzen
  rationale: Die Wiedergabe bleibt nahe bei שׂים („setzen, anbringen“) und vermeidet es, die Formulierung durch „wohnen lassen“ stärker auszudeuten.
- source_word: וְזָבַחְתָּ
  choice: darfst du … schlachten
  rationale: זבח bezeichnet hier das Schlachten zum gewöhnlichen Verzehr außerhalb des zentralen Heiligtums. Die Erlaubnisfunktion des Rechtssatzes wird mit „darfst“ ausgedrückt.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: von deinen Rindern und deinem Kleinvieh
  rationale: בקר bezeichnet Rinder als Großvieh; צאן ist ein Sammelbegriff für Schafe und Ziegen und wird prägnant mit „Kleinvieh“ wiedergegeben.
- source_word: אֲשֶׁר נָתַן יְהוָה לְךָ
  choice: die Jahwe dir gegeben hat
  rationale: Das hebräische Perfekt bezeichnet die Gabe, die nun im Besitz des Angeredeten ist; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: wie ich dir geboten habe
  rationale: Die erste Person Singular bleibt erhalten und verweist auf die Weisung des redenden Mose, ohne ihren genauen Inhalt zusätzlich festzulegen.
- source_word: בִּשְׁעָרֶיךָ
  choice: in deinen Ortschaften
  rationale: Wörtlich sind die „Tore“ gemeint; metonymisch bezeichnet die Wendung die jeweiligen Wohnorte. „Ortschaften“ vermittelt diesen Sinn im heutigen Deutsch.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: ganz nach deinem Verlangen
  rationale: אַוָּה bezeichnet Begehren oder Appetit, נֶפֶשׁ die Person beziehungsweise ihr inneres Verlangen. Die Formulierung ist verständlich, ohne das Bild durch „Herz“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung des Schlachtens außerhalb des erwählten Ortes
  choice: Erlaubnis zum Schlachten für den örtlichen Verzehr
  alternative: Gebot zu einem örtlichen Opfer
  rationale: Der Zusammenhang erlaubt wegen der Entfernung gewöhnliches Schlachten und Essen in den eigenen Ortschaften. Deshalb wird זבח nicht mit „opfern“ wiedergegeben.
- issue: Heiligtumsformel לָשׂוּם שְׁמוֹ שָׁם
  choice: seinen Namen dort hinzusetzen
  alternative: seinen Namen dort wohnen zu lassen
  rationale: „Hinzusetzen“ folgt dem Verb שׂים enger und lässt offen, wie die Gegenwart Gottes an diesem Ort theologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Die Rechtssprache wird durch „darfst“ klar als Erlaubnis formuliert. Ungebräuchliche Hebraismen werden im Haupttext nur dort bewahrt, wo sie theologisch oder formelhaft bedeutsam sind; ihre wörtliche Gestalt wird in den Fußnoten kenntlich gemacht.
