id: DEU.12.25
reference: Deuteronomy 12:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: de
  text: Du sollst es nicht essen, damit es dir und deinen Kindern nach dir gut geht, weil du tust, was in den Augen Jahwes recht ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du tust, was in den Augen Jahwes recht ist“. „Kinder“ kann hier auch „Söhne“ oder weiter gefasst „Nachkommen“ bedeuten.'
    reason: כִּי kann hier begründend oder konditional aufgefasst werden; zudem besitzt בָּנִים eine kontextabhängige Bedeutungsbreite.
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: es essen
  rationale: Das Verb אָכַל bedeutet „essen“; das maskuline Suffix verweist im unmittelbaren Zusammenhang auf das Blut (Verse 23–24).
- source_word: לְמַעַן יִיטַב לְךָ
  choice: damit es dir … gut geht
  rationale: Die geläufige deuteronomische Wendung bezeichnet umfassendes Wohlergehen und sollte nicht auf materiellen Erfolg verengt werden.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: und deinen Kindern nach dir
  rationale: בָּנִים kann „Söhne“, „Kinder“ oder im weiteren Sinn „Nachkommen“ bezeichnen. „Kinder“ bewahrt die familiäre Ausdrucksweise und lässt die kontextuelle Reichweite offen.
- source_word: כִּי תַעֲשֶׂה
  choice: weil du tust
  rationale: כִּי begründet hier das verheißene Wohlergehen mit dem rechten Handeln. Das deutsche Präsens gibt die allgemein-konditionale beziehungsweise erwartete Handlung natürlicher wieder als ein Futur.
- source_word: הַיָּשָׁר בְּעֵינֵי
  choice: was in den Augen … recht ist
  rationale: Die Formulierung bewahrt das hebräische Bild der göttlichen Beurteilung und klingt zugleich verständlich und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ wahrt dies, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite von בָנֶיךָ
  choice: Kinder
  alternative: Söhne; Nachkommen
  rationale: Der maskuline Plural kann leibliche Söhne bezeichnen, wird hier im Bundeszusammenhang aber wahrscheinlich umfassender für die folgende Generation gebraucht. „Kinder“ wahrt die familiäre Sprache, während die Fußnote die echte lexikalische Spannweite nennt.
- issue: Verhältnis von Wohlergehen und rechtem Handeln
  choice: weil du tust
  alternative: wenn du tust; denn du wirst tun
  rationale: כִּי kann begründend oder kontextuell bedingend verstanden werden. Die Hauptfassung folgt der naheliegenden Begründung; die Fußnote hält die konditionale Möglichkeit offen.
translation_notes:
  register: Modernes Standarddeutsch mit direkter, würdiger Gebotssprache. Die feste Wendung „in den Augen Jahwes“ bewahrt bewusst das hebräische Bild. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen zwei Ausdrücke sich die Anmerkung bezieht.
