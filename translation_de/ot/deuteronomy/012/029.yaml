revisions:
- from: Wenn Jahwe, dein Gott, die Völker vor dir beseitigt, zu denen du kommst, um sie aus ihrem Besitz zu verdrängen, und wenn du sie verdrängt hast und in ihrem Land wohnst,
  to: Wenn Jahwe, dein Gott, die Völker beseitigt, zu denen du ziehst, um sie vor dir zu vertreiben, und du sie vertreibst und in ihrem Land wohnst,
  rationale: Die Revision bindet „vor dir“ an das Vertreiben der Völker, vermeidet die nicht ausdrücklich genannte Kategorie ihres persönlichen Besitzes und bewahrt die syntaktisch offene, auf den folgenden Vers hinführende Zukunftssituation. Die Formulierung bleibt nah am hebräischen Relativsatz, ohne den schwierigen historischen Vorgang weiter auszudeuten.
