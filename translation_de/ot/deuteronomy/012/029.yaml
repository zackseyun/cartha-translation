review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zentralen Lexeme sind zutreffend wiedergegeben. Die Orts-/Entfernungsangabe מִפָּנֶיךָ steht jedoch im Hebräischen bei „sie in Besitz nehmen/vertreiben“ und sollte im Deutschen nicht ausschließlich an Jahwes „Beseitigen“ gebunden werden. „Aus ihrem Besitz“ konkretisiert zudem stärker als der Text, der die Verdrängung der Völker im Rahmen der Landnahme ausdrückt.
  naturalness: Der unabgeschlossene temporale Satz und das abschließende Komma sind richtig, da Vers 30 den Hauptsatz fortführt. Eine einfache Reihung mit „und du sie vertreibst“ bildet die hebräische Erzählfolge natürlicher ab als ein zusätzliches „und wenn du sie verdrängt hast“.
  terminology: „Jahwe“, „dein Gott“, „Völker“, „beseitigt“, „vertreiben“ und „wohnen“ sind für modernes Standarddeutsch passend. „Vertreiben“ gibt ירש bei menschlichem Objekt im Kontext angemessen wieder, ohne über den Text hinaus von individuellem Eigentum zu sprechen.
  issues:
  - severity: medium
    issue: Die Wendung „aus ihrem Besitz“ ist eine unnötige Konkretisierung.
    rationale: ירש mit den Völkern als Objekt bezeichnet hier ihre Verdrängung beziehungsweise Entmachtung im Zuge der Landnahme; ein ausdrücklich besitzrechtlicher Entzug wird nicht formuliert.
  - severity: medium
    issue: „Vor dir“ ist nur an „beseitigt“ angeschlossen.
    rationale: מִפָּנֶיךָ folgt unmittelbar auf „sie in Besitz nehmen/vertreiben“ und sollte in der deutschen Satzgestaltung bei diesem Vorgang erkennbar bleiben.
  - severity: low
    issue: Das zusätzliche „und wenn“ verändert die lineare Folge der hebräischen Verbformen.
    rationale: Die hebräischen Perfektformen führen die in der Zukunft vorgestellte Situation fort; eine bloße Koordination ist im Deutschen näher am Ausgangstext und flüssiger.
  revised_text: Wenn Jahwe, dein Gott, die Völker beseitigt, zu denen du ziehst, um sie vor dir zu vertreiben, und du sie vertreibst und in ihrem Land wohnst,
  revised_footnotes: []
