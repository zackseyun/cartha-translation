source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: de
  text: Wenn Jahwe, dein Gott, die Völker beseitigt, zu denen du ziehst, um sie vor dir zu vertreiben, und du sie vertreibst und in ihrem Land wohnst,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion leitet hier den künftigen Umstand ein, an den die Warnung im folgenden Vers anknüpft; daher ist die temporale Wiedergabe natürlich.
- source_word: יַכְרִית
  choice: beseitigt
  rationale: Der Hifil von כרת bezeichnet hier das Entfernen der Völker vor Israel. „Beseitigt“ gibt dies wieder, ohne ausdrücklich eine vollständige Vernichtung festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Im Zusammenhang sind die im Land ansässigen ethnisch-politischen Gemeinschaften gemeint; „Völker“ ist dafür im Deutschen idiomatischer als „Nationen“.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: zu denen du kommst, um sie aus ihrem Besitz zu verdrängen
  rationale: Der Relativsatz bezieht sich grammatisch auf die Völker. Die Formulierung wahrt diesen Bezug und gibt ירש im Eroberungskontext als Entzug ihres Besitzes wieder.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die hebräische Wendung bezeichnet ihre Entfernung aus Israels Weg beziehungsweise Gegenwart.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: und wenn du sie verdrängt hast
  rationale: Die erneute Verwendung von ירש wird konsistent wiedergegeben; die vollendete deutsche Form bezeichnet den vorausgesetzten Abschluss vor dem Wohnen im Land.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: und in ihrem Land wohnst
  rationale: „Wohnen“ gibt ישב natürlich und mit angemessen würdigem Ton wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Umschrift bewahrt diesen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Reichweite von יַכְרִית
  choice: beseitigt
  alternative: vernichtet
  rationale: Die Wortwahl lässt offen, ob hier vollständige Tötung oder allgemein die Entfernung der Völker aus Israels Weg im Vordergrund steht, und vermeidet so eine unnötige Präzisierung.
- issue: Bedeutung von ירש mit den Völkern als Objekt
  choice: aus ihrem Besitz verdrängen / verdrängt
  alternative: in Besitz nehmen
  rationale: Da Personen beziehungsweise Völker das direkte Objekt sind, ist die Verdrängung aus ihrem bisherigen Besitz gemeint; zugleich bleibt die enge Verbindung zur anschließenden Landnahme sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch unabgeschlossener Bedingungs- beziehungsweise Zeitsatz mit Komma stehen, weil der Hauptgedanke erst im folgenden Vers folgt. Das Singularpronomen „du“ entspricht der Anrede Israels als kollektivem Gegenüber.
