  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: de
  text: Du sollst deine Brandopfer – das Fleisch und das Blut – auf dem Altar Jahwes, deines Gottes, darbringen. Das Blut deiner Schlachtopfer soll auf den Altar Jahwes, deines Gottes, gegossen werden, und das Fleisch sollst du essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung kann im gesetzlichen Zusammenhang auch übersetzt werden: „Das Fleisch aber darfst du essen.“'
    reason: Bewahrt die mögliche permissive Aussagekraft der hebräischen Verbform und den im Zusammenhang liegenden Gegensatz zwischen Blut und Fleisch.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: du sollst … darbringen
  rationale: Das Verb bedeutet grundsätzlich „tun/machen“, bezeichnet zusammen mit עֹלֹתֶיךָ im Opferzusammenhang jedoch das Vollziehen beziehungsweise Darbringen der Opfer.
- source_word: עֹלֹתֶיךָ
  choice: deine Brandopfer
  rationale: עֹלָה ist der feste kultische Ausdruck für ein vollständig verbranntes Opfer; „Brandopfer“ ist dafür die geläufige und präzise deutsche Bezeichnung.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: das Fleisch und das Blut
  rationale: „Fleisch“ bewahrt den konkreten körperlichen Sinn von בָּשָׂר und passt zum kultischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְדַם זְבָחֶיךָ
  choice: das Blut deiner Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer, von dessen Fleisch häufig gegessen werden durfte. „Schlachtopfer“ hält diese Opferart genauer fest als das allgemeinere „Opfer“.
- source_word: יִשָּׁפֵךְ
  choice: soll … gegossen werden
  rationale: Die passive Form beschreibt die vorgeschriebene rituelle Behandlung des Blutes; „gießen“ ist im Deutschen natürlich und sachlich.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: und das Fleisch sollst du essen
  rationale: Die Wiedergabe folgt der hebräischen Konjunktion und der unmarkierten verbalen Form eng. Ein permissiver Sinn ist im gesetzlichen Zusammenhang möglich und wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Aussagekraft von וְהַבָּשָׂר תֹּאכֵל
  choice: und das Fleisch sollst du essen
  alternative: das Fleisch aber darfst du essen
  rationale: Die Hauptübersetzung wahrt Anschluss und Form des Hebräischen. Weil die Vorschrift im Zusammenhang auch eine Erlaubnis im Gegensatz zum Blutverbot ausdrücken kann, bleibt diese Deutung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche kennzeichnen „das Fleisch und das Blut“ als nähere Bestimmung der Brandopfer, ohne den Satzfluss unnötig zu erschweren. Kultische Fachbegriffe werden beibehalten, soweit sie allgemein verständlich sind.
