  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: de
  text: sondern nur[a] an dem Ort, den Yahweh in einem deiner Stämme[b] erwählen wird. Dort sollst du deine Brandopfer darbringen, und dort sollst du alles tun, was ich dir gebiete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »außer an dem Ort«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in einem deiner Stämme«; gemeint ist der Bereich beziehungsweise das Gebiet eines der Stämme Israels.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die Wendung bildet nach dem Verbot in Vers 13 einen einschränkenden Gegensatz und bezeichnet den einzig erlaubten Ort. »Sondern nur« gibt sowohl den Gegensatz als auch die Ausschließlichkeit natürlich wieder.
- source_word: בַּמָּקוֹם
  choice: an dem Ort
  rationale: Gemeint ist der bestimmte, von Gott ausgewählte Ort des Opferdienstes. »An dem Ort« ist im Deutschen idiomatisch und bewahrt die Bestimmtheit.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: den Yahweh … erwählen wird
  rationale: Das Yiqtol weist hier auf die noch bevorstehende Auswahl hin. »Erwählen wird« bewahrt diesen Zukunftsbezug und den bewussten Auswahlakt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als »Yahweh« wiedergegeben.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: in einem deiner Stämme
  rationale: Die formal nahe Wiedergabe bewahrt den israelitischen Stammesbegriff und die mögliche metonymische Beziehung zwischen Stamm und Stammesgebiet; eine Fußnote erläutert den räumlichen Sinn.
- source_word: שָׁם
  choice: dort
  rationale: Das zweimalige שָׁם wird beide Male mit »dort« wiedergegeben, um die Betonung des ausschließlich bestimmten Ortes zu erhalten.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: sollst du deine Brandopfer darbringen
  rationale: Der Hifil von עלה bezeichnet zusammen mit עֹלָה das opfernde Darbringen. »Brandopfer darbringen« ist im modernen Deutschen klar und kultisch präzise.
- source_word: תַּעֲשֶׂה
  choice: sollst du … tun
  rationale: Das breite Verb עשה wird direkt und natürlich mit »tun« wiedergegeben.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: alles …, was ich dir gebiete
  rationale: Diese Formulierung gibt den umfassenden Gehorsamsanspruch und die gegenwärtig ergehende Anweisung in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Vers nennt ausdrücklich das Tetragramm. »Yahweh« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Ausschließlichkeit des von Yahweh erwählten Opferortes
  choice: sondern nur an dem Ort
  alternative: außer an dem Ort
  rationale: Die Fassung lässt die exklusive Einschränkung des hebräischen כִּי אִם deutlich hervortreten, ohne den später erwählten Ort näher zu identifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »dort« bleibt als nachdrückliche Ortsbindung erhalten. »Stämme« bewahrt die Ausdrucksweise des Ausgangstextes; die räumliche Bedeutung wird in der Fußnote erläutert.
