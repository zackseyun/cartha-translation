  text: וְ/דָרְשׁ֥וּ הַ/שֹּׁפְטִ֖ים הֵיטֵ֑ב וְ/הִנֵּ֤ה עֵֽד שֶׁ֨קֶר֙ הָ/עֵ֔ד שֶׁ֖קֶר עָנָ֥ה בְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: de
  text: Dann sollen die Richter gründlich nachforschen. Stellt sich heraus, dass der Zeuge ein falscher Zeuge ist und gegen seinen Bruder falsch ausgesagt hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: Dann sollen ... gründlich nachforschen
  rationale: Das Verb דרש bezeichnet hier eine sorgfältige gerichtliche Untersuchung; הֵיטֵב verstärkt sie. „Gründlich nachforschen“ ist natürliches, präzises Deutsch.
- source_word: וְהִנֵּה
  choice: Stellt sich heraus
  rationale: Im Untersuchungskontext markiert הִנֵּה das festgestellte Ergebnis. Die deutsche Wendung gibt diese Funktion idiomatisch wieder, ohne ein zusätzliches Konditional ausdrücklich einzuführen.
- source_word: עֵד שֶׁקֶר
  choice: ein falscher Zeuge
  rationale: Die formnahe Wiedergabe bewahrt sowohl die Personbezeichnung als auch den Vorwurf der Unwahrheit.
- source_word: שֶׁקֶר עָנָה
  choice: falsch ausgesagt hat
  rationale: ענה bedeutet in diesem gerichtlichen Zusammenhang „aussagen/Zeugnis ablegen“; שֶׁקֶר bestimmt die Aussage als falsch.
- source_word: בְאָחִיו
  choice: gegen seinen Bruder
  rationale: „Bruder“ bewahrt die gemeinschaftsbezogene Sprache des Hebräischen; die Präposition bezeichnet hier die Person, gegen die ausgesagt wurde.
theological_decisions:
- issue: Bedeutung von אָחִיו im Bundes- und Rechtskontext
  choice: seinen Bruder
  alternative: seinen Mitmenschen / einen anderen Israeliten
  rationale: Die wörtliche Verwandtschafts- und Gemeinschaftssprache bleibt erhalten, ohne den Ausdruck durch eine interpretierende Verallgemeinerung aufzulösen.
- issue: Verhältnis von וְהִנֵּה zur Bedingung im Satz
  choice: Stellt sich heraus, dass
  alternative: 'und siehe: Der Zeuge ist ... / wenn der Zeuge ... ist'
  rationale: Der hebräische Text stellt nach der Untersuchung einen Befund vor Augen. Die gewählte Form ist im Deutschen natürlich und wahrt den feststellenden Charakter, während „wenn“ die Konstruktion stärker konditional deutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gerichtlicher Klarheit. Der Vers bleibt als syntaktisch offener Vordersatz stehen, da die Rechtsfolge erst in Vers 19 folgt.
