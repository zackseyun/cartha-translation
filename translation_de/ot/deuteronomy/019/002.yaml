  text: שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑/ךְ בְּ/ת֣וֹךְ אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: de
  text: Du sollst dir drei Städte in deinem Land aussondern, das Jahwe, dein Gott, dir gibt, damit du es in Besitz nimmst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du es erbst“. Das hebräische Verb kann im Zusammenhang einer Landgabe sowohl „in Besitz nehmen“ als auch „erben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: drei Städte
  rationale: עִיר kann Stadt oder Ortschaft bezeichnen; „Städte“ ist im Zusammenhang der Zufluchtsstädte die übliche und angemessen würdevolle Wiedergabe.
- source_word: תַּבְדִּיל
  choice: aussondern
  rationale: Das Hifil von בדל bezeichnet ein Trennen beziehungsweise Aussondern. „Aussondern“ bewahrt sowohl den räumlichen als auch den rechtlichen Sinn der besonderen Bestimmung dieser Städte.
- source_word: לָךְ
  choice: dir
  rationale: Der Dativ gibt hier den Bezug beziehungsweise Vorteil für den angesprochenen Einzelnen wieder; im Deutschen ist „dir“ natürlich und ausreichend.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: in deinem Land
  rationale: בְּתוֹךְ bezeichnet das Innere eines Bereichs. „In deinem Land“ gibt den räumlichen Sinn im Deutschen natürlich wieder; „mitten in deinem Land“ könnte eine nicht ausdrücklich gemeinte zentrale Lage nahelegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Constructusverbindung mit Suffix der zweiten Person Singular wird in der bundesbezogenen Anrede unmittelbar als „dein Gott“ wiedergegeben.
- source_word: נֹתֵן לְךָ
  choice: dir zum Besitz gibt
  rationale: Das Partizip נֹתֵן beschreibt die von Gott ausgehende, im Kontext zugesagte Landgabe. Die deutsche Präsensform „gibt“ ist idiomatisch und kann die gegenwärtig wirksame beziehungsweise unmittelbar bevorstehende Gabe ausdrücken.
- source_word: לְרִשְׁתָּהּ
  choice: zum Besitz
  rationale: ירשׁ kann in Landgabezusammenhängen „besitzen“, „in Besitz nehmen“ oder „erben“ bedeuten. „Zum Besitz“ fügt sich natürlich in den deutschen Relativsatz ein und bewahrt den Landbesitz-Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch den traditionellen Ersatztitel „der HERR“ zu verdecken.
- issue: Bedeutung von ירשׁ im Zusammenhang der Landgabe
  choice: zum Besitz
  alternative: als Erbe; damit du es in Besitz nimmst
  rationale: Der Vers verbindet Gottes Gabe und Israels Besitznahme. „Zum Besitz“ hält diese Spannung fest, ohne die mögliche Erbbedeutung auszuschließen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gesetzessprache. Die Satzstellung hält Gottes Landgabe eng bei „Land“ und vermeidet unnötig altertümliche Wendungen.
