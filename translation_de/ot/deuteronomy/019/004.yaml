  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: de
  text: 'Dies ist die Regelung für jemanden, der dorthin fliehen darf, um am Leben zu bleiben: wenn er seinen Nächsten ohne Absicht erschlagen hat und ihn zuvor[a] nicht gehasst hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seit gestern und vorgestern“. Die hebräische Wendung bedeutet hier „schon vorher“ oder „zuvor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: Regelung
  rationale: Im rechtlichen Zusammenhang bezeichnet דָּבָר die für den betreffenden Fall geltende Bestimmung. „Regelung“ ist im modernen Deutschen verständlicher und präziser als das wörtliche „Wort“ oder das allgemeinere „Sache“.
- source_word: הָרֹצֵחַ
  choice: Totschläger
  rationale: Der Ausdruck bezeichnet hier denjenigen, der einen Menschen getötet hat, ohne ihn notwendigerweise vorsätzlich ermordet zu haben. „Totschläger“ wahrt diesen rechtlichen Unterschied besser als „Mörder“.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: der dorthin fliehen und am Leben bleiben darf
  rationale: Der Imperfekt beschreibt die Person, die zur Flucht in die Zufluchtsstadt berechtigt ist; וָחָי nennt die daraus folgende Rettung des Lebens. Die deutsche Formulierung gibt Erlaubnis und Folge natürlich wieder.
- source_word: יַכֶּה
  choice: erschlagen
  rationale: נכה bedeutet grundsätzlich „schlagen“. Im Zusammenhang mit dem Totschläger ist ein tödlicher Ausgang vorausgesetzt; „erschlagen“ bewahrt sowohl das Bild des Schlagens als auch diesen Kontext.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: „Seinen Nächsten“ ist eine geläufige und sachlich passende Wiedergabe von רֵעַ in zwischenmenschlichen Rechtstexten.
- source_word: בִּבְלִי דַעַת
  choice: ohne Absicht
  rationale: Wörtlich heißt die Wendung „ohne Wissen“. Im vorliegenden Rechtsfall bezeichnet sie fehlendes Wissen beziehungsweise fehlende Absicht; „ohne Absicht“ vermittelt diese Bedeutung klar, ohne Vorsatz zu unterstellen.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: ihn … nicht gehasst
  rationale: Das negierte Partizip beschreibt eine bereits vorher bestehende feindselige Haltung. Die Formulierung bewahrt Hass als Kriterium für die rechtliche Beurteilung.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: zuvor
  rationale: Die hebräische Zeitformel bedeutet idiomatisch „schon vorher“ beziehungsweise „seit früher“. „Zuvor“ ist knappes, natürliches Standarddeutsch; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Abgrenzung zwischen unbeabsichtigter Tötung und Mord
  choice: „Totschläger“ und „ohne Absicht“
  alternative: „Mörder“ und „ohne Wissen“
  rationale: Der Zufluchtsstadt-Kontext unterscheidet die hier beschriebene unbeabsichtigte Tötung von vorsätzlichem Mord. Die Übersetzung bildet diese im Text selbst angelegte rechtliche und ethische Spannung ab, ohne eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Ausdrucksweise. Die Satzstruktur folgt dem hebräischen Aufbau weitgehend, wird aber so geglättet, dass sie für heutige Leser unmittelbar verständlich bleibt.
