base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: de
  text: Und wenn Jahwe, dein Gott, dein Gebiet erweitert, wie er deinen Vätern[a] geschworen hat, und dir das ganze Land gibt, von dem er gesagt hat, dass er es deinen Vätern geben werde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorfahren“, hier und beim zweiten Vorkommen von „Vätern“. Wörtlich steht im Hebräischen „Väter“; gemeint sind Israels patriarchale Vorfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt die gesetzliche Anweisung des vorigen Verses weiter; „Und wenn“ bewahrt diesen Anschluss.
- source_word: יַרְחִיב ... אֶת גְּבֻלְךָ
  choice: dein Gebiet erweitert
  rationale: Das Hifil von רחב bezeichnet hier die Ausweitung des israelitischen Territoriums; „Gebiet erweitern“ ist im Deutschen natürlich und sachlich genau.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte Wiedergabe der Verbindung mit Suffix der 2. Person Singular.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: wie er ... geschworen hat
  rationale: Die Formulierung gibt den Rückbezug auf den Eid an die Vorfahren idiomatisch und eng am Hebräischen wieder.
- source_word: לַאֲבֹתֶיךָ
  choice: deinen Vätern
  rationale: Die wörtliche patriarchale Bundesformel bleibt erhalten; die kontextuelle Alternative „Vorfahren“ wird in der Fußnote genannt.
- source_word: וְנָתַן לְךָ
  choice: und dir ... gibt
  rationale: Das Perfekt mit waw steht innerhalb der zukunftsbezogenen Bedingung; deutsches Präsens nach „wenn“ gibt diese Folge natürlich wieder.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: ארץ bezeichnet hier das Israel verheißene Land, nicht die Erde insgesamt.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: von dem er gesagt hat, dass er es ... geben werde
  rationale: Diese Wiedergabe bewahrt das eigentliche Verb „reden/sagen“ und lässt zugleich den verpflichtenden Verheißungszusammenhang erkennen, ohne „versprechen“ direkt in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift.
- issue: Wiedergabe von אבות
  choice: Väter
  alternative: Vorfahren
  rationale: „Väter“ bewahrt die konkrete patriarchale Ausdrucksweise des Hebräischen; „Vorfahren“ ist als kontextuelle Verständnishilfe in der Fußnote angegeben.
- issue: Bedeutung von דִּבֶּר im Verheißungskontext
  choice: gesagt hat
  alternative: versprochen hat
  rationale: Die formal nähere Wiedergabe „gesagt hat“ bewahrt den Wortlaut und die mögliche Spannung zwischen Rede und Verheißung; der Kontext macht den verpflichtenden Charakter deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt mit Komma offen, da Vers 8 syntaktisch in den folgenden Vers hineinführt. Die Wiederholung von „Vätern“ entspricht dem Hebräischen; der Fußnotenmarker steht beim ersten Vorkommen und erläutert beide.
