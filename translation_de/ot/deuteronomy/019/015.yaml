base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: de
  text: Ein einzelner Zeuge soll gegen einen Mann[a] wegen irgendeiner Schuld oder Sünde, bei irgendeiner Verfehlung, die er begeht, nicht als Beweis gelten. Aufgrund der Aussage von zwei Zeugen oder aufgrund der Aussage von drei Zeugen[b] soll eine Sache als erwiesen gelten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen jemanden“ beziehungsweise „gegen eine Person“. Im Hebräischen steht „gegen einen Mann“ in repräsentativer rechtlicher Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf den Mund von zwei Zeugen oder auf den Mund von drei Zeugen“. Gemeint ist die Aussage beziehungsweise das Zeugnis.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische verwendet am Anfang und am Ende des Verses dasselbe Verb, wörtlich etwa: Ein einzelner Zeuge soll nicht „stehen“, und eine Sache soll „stehen“. Im rechtlichen Zusammenhang bezeichnet es die Geltung oder Feststellung einer Sache. Auch möglich: „soll eine Sache Bestand haben“ oder „soll ein Fall festgestellt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: darf nicht ... auftreten ... soll ... als erwiesen gelten
  rationale: קום bezeichnet hier im gerichtlichen Zusammenhang zunächst das Auftreten beziehungsweise rechtliche Geltendmachen eines Zeugnisses und am Schluss die Feststellung einer Sache. Natürliches heutiges Deutsch erfordert unterschiedliche Formulierungen; eine Fußnote weist auf die Wiederholung desselben hebräischen Verbs hin.
- source_word: עֵד אֶחָד
  choice: ein einzelner Zeuge
  rationale: Die Formulierung hebt klar hervor, dass die Aussage nur eines Zeugen rechtlich nicht ausreicht.
- source_word: בְּאִישׁ
  choice: gegen einen Mann
  rationale: Die Präposition bezeichnet im Rechtszusammenhang die Person, gegen die ausgesagt wird. Das maskuline Singularwort אִישׁ wird formal bewahrt; eine Fußnote erläutert seinen repräsentativen Gebrauch.
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: wegen irgendeiner Schuld oder irgendeiner Sünde
  rationale: Die beiden hebräischen Begriffe bleiben unterscheidbar. „Schuld“ trägt den moralisch-rechtlichen Sinn von עָוֺן, während „Sünde“ חַטָּאת breit wiedergibt.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: was für eine Verfehlung er auch begangen hat
  rationale: Diese idiomatische Wendung erhält die umfassende Reichweite und gibt die Wiederholung der hebräischen Wortwurzel חטא sinngemäß wieder, ohne im Deutschen unnatürlich zu klingen.
- source_word: עַל פִּי
  choice: aufgrund der Aussage
  rationale: Wörtlich „nach dem Mund“; im gerichtlichen Kontext ist die Aussage beziehungsweise das Zeugnis gemeint.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: zwei oder drei Zeugen
  rationale: Die koordinierte Kurzform ist im Deutschen natürlich und bewahrt die vorgeschriebene Mindestzahl.
- source_word: דָּבָר
  choice: eine Sache
  rationale: דָּבָר bezeichnet hier breit die gerichtlich zu entscheidende Angelegenheit; „Sache“ bewahrt diese Offenheit besser als das engere „Anklagepunkt“.
theological_decisions:
- issue: Repräsentativ maskuline Sprache in אִישׁ
  choice: einen Mann
  alternative: jemanden / eine Person
  rationale: Der Haupttext bewahrt die maskuline Singularform des Hebräischen, ohne die allgemeine Reichweite des Rechtssatzes zu leugnen; diese wird in der Fußnote erläutert.
- issue: Rechtliche Bedeutung von קום
  choice: Ein Zeuge darf nicht allein auftreten; eine Sache gilt erst durch mehrere Zeugen als erwiesen.
  alternative: Ein Zeuge soll nicht bestehen; eine Sache soll bestehen.
  rationale: Der gerichtliche Sinn wird in natürlichem Deutsch wiedergegeben. Die Spannung zwischen dem konkreten Auftreten des Zeugen und dem rechtlichen Bestand der Sache wird nicht zu einer konfessionellen Deutung erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer juristischer Diktion. Die umfassende Dreierfolge der Begriffe für Schuld, Sünde und Verfehlung bleibt erkennbar. Die hebräische Verbwiederholung wird wegen deutscher Idiomatik im Haupttext funktional wiedergegeben und in Fußnote c offengelegt.
