  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: de
  text: Wenn Jahwe, dein Gott, die Völker beseitigt[a], deren Land Jahwe, dein Gott, dir gibt, und du sie vertreibst und in ihren Städten und Häusern wohnst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „abschneidet“; auch: „vernichtet“ oder „ausrottet“.'
    reason: Lexikalische Alternative und Bewahrung der hebräischen Bildsprache von כרת; die Hauptübersetzung vermeidet eine unnötige Festlegung auf vollständige Vernichtung.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Im Gesetzeskontext leitet כִּי den künftig erwarteten Umstand ein, an den die folgenden Anweisungen anknüpfen. „Wenn“ gibt diesen zeitlich-konditionalen Sinn natürlich wieder.
- source_word: יַכְרִית
  choice: ausrottet
  rationale: Das Hifil von כרת bezeichnet hier das Beseitigen der Völker. „Ausrotten“ ist im Deutschen verständlicher als eine wörtliche Wiedergabe mit „abschneiden“; die konkrete hebräische Bildsprache wird in der Fußnote kenntlich gemacht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Genaue und natürliche Wiedergabe der Verbindung mit Suffix der zweiten Person maskulin Singular.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: „Völker“ bezeichnet die im Land ansässigen ethnisch-politischen Gruppen natürlich und ohne spätere Bedeutungsnuancen von „Heiden“.
- source_word: נֹתֵן לְךָ
  choice: dir gibt
  rationale: Das Partizip stellt Jahwes Gabe als gegenwärtig wirksam beziehungsweise gewiss dar. Im deutschen Nebensatz ist das Präsens „dir gibt“ idiomatisch.
- source_word: אֶת אַרְצָם
  choice: deren Land
  rationale: Das hebräische „ihr Land“ wird flüssig in den Relativsatz einbezogen, ohne den Besitzbezug zu verändern.
- source_word: וִירִשְׁתָּם
  choice: du sie vertreibst
  rationale: Mit einem Personenobjekt bezeichnet ירש hier das Verdrängen beziehungsweise Enteignen der Völker, nicht das Erben von Personen. „Vertreiben“ gibt dies im Deutschen klar wieder.
- source_word: וְיָשַׁבְתָּ
  choice: wohnst
  rationale: „Wohnen“ deckt sowohl das Sich-Niederlassen als auch das dauerhafte Leben am Ort ab und ist in modernem Deutsch natürlich.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: in ihren Städten und Häusern
  rationale: Die Präposition und das Possessivwort gelten im Deutschen natürlich für beide koordinierten Substantive; dadurch bleibt die Zugehörigkeit zu den vertriebenen Völkern erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Beseitigung der Völker
  choice: ausrottet
  alternative: abschneidet; beseitigt; vernichtet
  rationale: Die Übersetzung bewahrt die Härte der Aussage, ohne sie abzuschwächen. Da „abschneiden“ im Deutschen hier missverständlich wäre, wird die wörtliche Bildform in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-erzählendem Ton. Der Satz bleibt wegen seiner Fortsetzung in Vers 2 offen und endet daher mit einem Komma. Die Anrede steht entsprechend dem Hebräischen im Singular.
