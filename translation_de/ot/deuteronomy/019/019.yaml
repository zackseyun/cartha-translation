base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: de
  text: Dann sollt ihr mit ihm genauso verfahren, wie er es seinem Bruder[a] anzutun beabsichtigte. So sollst du das Böse aus deiner Mitte beseitigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Angehörigen der Bundesgemeinschaft“ beziehungsweise „seinem Volksgenossen“. Wörtlich steht im Hebräischen „seinem Bruder“; in diesem Rechtskontext kann damit ein Angehöriger der Bundesgemeinschaft gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Dann sollt ihr … verfahren
  rationale: Die waw-präfigierte Form richtet die Rechtsanweisung im Plural an die Gemeinschaft beziehungsweise die Richter. „Dann“ gibt den Fortgang wieder; „mit ihm verfahren“ klingt im Deutschen bei einer entsprechenden gerichtlichen Behandlung natürlicher als das wörtliche „ihm tun“.
- source_word: לוֹ
  choice: mit ihm
  rationale: Das Pronomen bezieht sich im Zusammenhang auf den falschen Zeugen und wird passend zur deutschen Wendung „mit jemandem verfahren“ wiedergegeben.
- source_word: כַּאֲשֶׁר
  choice: genauso, wie
  rationale: Die Formulierung drückt die genaue Entsprechung zwischen beabsichtigter Schädigung und gerichtlicher Folge aus.
- source_word: זָמַם
  choice: beabsichtigte
  rationale: Das Verb bezeichnet hier ein geplantes Vorgehen mit schädlicher Absicht. „Beabsichtigte“ bewahrt den juristisch nüchternen Ton, ohne die im Kontext erkennbare Bosheit zusätzlich auszumalen.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Der Infinitiv ergänzt זָמַם und lässt sich direkt mit „zu tun“ wiedergeben.
- source_word: לְאָחִיו
  choice: seinem Bruder
  rationale: אָח bedeutet wörtlich „Bruder“ und bezeichnet in diesem Rechtskontext zugleich einen Angehörigen der Bundesgemeinschaft. Die konkrete Ausgangsform bleibt im Haupttext erhalten; die weitere Bedeutung wird in der Fußnote genannt.
- source_word: וּבִעַרְתָּ
  choice: So sollst du … beseitigen
  rationale: בער bezeichnet in dieser deuteronomischen Rechtsformel die Entfernung des Bösen aus der Gemeinschaft, nicht ein buchstäbliches Verbrennen. Der Wechsel zum Singular wird bewahrt.
- source_word: הָרָע
  choice: das Böse
  rationale: Die substantivierte Form trägt sowohl moralisches als auch gemeinschaftsbezogenes Gewicht und wird formelgerecht als „das Böse“ wiedergegeben.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die Wendung bewahrt das Bild des Bösen, das aus dem Inneren der Gemeinschaft entfernt wird, und entspricht dem hebräischen Singular.
theological_decisions:
- issue: Der gemeinschaftsbezogene, grammatisch maskuline Ausdruck אָחִיו
  choice: seinem Bruder
  alternative: seinem Mitmenschen / seinem Volksgenossen
  rationale: Der Haupttext bewahrt die konkrete hebräische Verwandtschaftsbezeichnung und damit die Sprache der Bundesgemeinschaft. Eine Fußnote macht deutlich, dass „Bruder“ hier nicht zwingend einen leiblichen Bruder meint.
- issue: Numeruswechsel zwischen Rechtsinstanz und Bundesgemeinschaft
  choice: „sollt ihr“ und anschließend „sollst du“
  alternative: durchgehend „sollt ihr“ oder durchgehend „soll man“
  rationale: Der hebräische Text wechselt bewusst vom Plural וַעֲשִׂיתֶם zum Singular וּבִעַרְתָּ und מִקִּרְבֶּךָ. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend zu glätten.
translation_notes:
  register: Moderne, würdevolle Rechtssprache. „Mit ihm … verfahren“ vermeidet unnatürliches Deutsch, ohne das Vergeltungsprinzip abzuschwächen. Der auffällige Wechsel vom Plural zum Singular bleibt entsprechend dem hebräischen Text erhalten.
