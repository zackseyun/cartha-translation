  terminology: „Bluträcher“ ist die übliche fachsprachliche und bibelsprachliche Wiedergabe von גֹּאֵל הַדָּם. „Totschläger“ bleibt im Kontext angemessen, da „Mörder“ den hier gerade ausgeschlossenen vorsätzlichen Hass nahelegen würde. „Kein Todesurteil zustand“ wahrt den juristischen Charakter von מִשְׁפַּט מָוֶת.
