base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: de
  text: Sonst könnte der Bluträcher den Totschläger verfolgen, weil sein Herz vor Zorn entbrannt ist, ihn einholen, weil der Weg weit ist, und ihn erschlagen, obwohl ihm kein Todesurteil zustand; denn der Totschläger hatte den Getöteten zuvor nicht gehasst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: sonst könnte
  rationale: Gibt den warnenden und vorbeugenden Sinn im Zusammenhang natürlich wieder, ohne das mögliche Geschehen als sicher darzustellen.
- source_word: גֹּאֵל הַדָּם
  choice: der Blutrücher
  rationale: Im Deutschen etablierte Bezeichnung für den nächsten Angehörigen in seiner rechtlichen Rolle als Rächer des vergossenen Blutes.
- source_word: הָרֹצֵחַ
  choice: den Totschläger
  rationale: Bezeichnet hier denjenigen, der einen Menschen getötet hat, ohne ihn zuvor gehasst zu haben; „Mörder“ würde unberechtigt Vorsatz voraussetzen.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: wenn sein Herz vor Zorn entbrannt ist
  rationale: Bewahrt das Bild des erhitzten Herzens und macht zugleich den idiomatisch gemeinten heftigen Zorn verständlich.
- source_word: וְהִשִּׂיגוֹ
  choice: und ihn einholen
  rationale: Gibt das Erreichen des Flüchtenden während der Verfolgung direkt und idiomatisch wieder.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: weil der Weg weit ist
  rationale: Bewahrt das konkrete Bild des langen Weges zur Zufluchtsstadt in natürlichem Deutsch.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: und ihn erschlagen
  rationale: Gibt die Wendung für einen tödlichen Schlag knapp, konkret und würdig wieder.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: obwohl ihm kein Todesurteil zustand
  rationale: 'Bewahrt den rechtlichen Gehalt von מִשְׁפַּט מָוֶת: Gegen den Totschläger besteht in diesem Fall kein rechtmäßiges Todesurteil.'
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: denn er hatte ihn nicht gehasst
  rationale: Gibt den rechtlich entscheidenden Mangel an vorausgehendem Hass unmittelbar wieder.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: zuvor
  rationale: Natürliches modernes Deutsch für die hebräische Zeitformel „seit gestern und vorgestern“, die eine frühere Feindschaft verneint.
theological_decisions:
- issue: Rechtlicher Status des unbeabsichtigten Totschlägers
  choice: „obwohl ihm kein Todesurteil zustand“
  alternative: „obwohl er den Tod nicht verdient hatte“
  rationale: Die gewählte Formulierung bleibt näher an der juristischen Aussage des Hebräischen und vermeidet eine weitergehende moralische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Terminologie. Der Satzbau folgt der fortlaufenden Warnung des hebräischen Textes; das Bild vom erhitzten Herzen wird verständlich, aber nicht vollständig aufgelöst.
