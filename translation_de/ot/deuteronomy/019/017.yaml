  source_fidelity: Die Übersetzung gibt den Verfahrensfortgang von וְעָמְדוּ angemessen mit „Dann sollen ... treten“ wieder. „Die beiden Männer“ bewahrt die ausdrücklich männliche Personenbezeichnung, und „zwischen denen der Streit besteht“ gibt die hebräische Konstruktion אֲשֶׁר לָהֶם הָרִיב idiomatisch wieder, ohne die Bedeutung unzulässig auf eine bestimmte Prozessform zu verengen. Die doppelte Ausrichtung „vor Jahwe, vor die Priester und die Richter“ sowie die zeitliche Bestimmung der jeweils amtierenden Instanzen sind erhalten.
  naturalness: Modernes, klares und würdiges Standarddeutsch. „Vor Jahwe treten“ ist im formellen Rechts- und Kultkontext idiomatisch; die Wiederholung von „vor“ sorgt für eine verständliche Satzgliederung.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Priester“, „Richter“, „Streit“ und „im Amt“ sind sachgerecht und registerangemessen. Es wird keine institutionelle oder theologische Deutung hinzugefügt.
