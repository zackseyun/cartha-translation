  text: וְ/עָמְד֧וּ שְׁנֵֽי הָ/אֲנָשִׁ֛ים אֲשֶׁר לָ/הֶ֥ם הָ/רִ֖יב לִ/פְנֵ֣י יְהוָ֑ה לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ וְ/הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: de
  text: Dann sollen die beiden Männer, zwischen denen der Streit besteht[a], vor Jahwe treten, vor die Priester und die Richter, die zu jener Zeit im Amt sind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „denen der Streit gehört“; auch möglich: „die den Rechtsstreit führen“ oder „deren Rechtssache es ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die in jenen Tagen sein werden“; gemeint sind die damals zuständigen Priester und Richter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Dann sollen … treten
  rationale: Das Waw mit der Verbform führt das gesetzliche Verfahren weiter. „Dann“ gibt die Abfolge natürlich wieder; „vor … treten“ entspricht dem gerichtlichen Kontext.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: die beiden Männer
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet die beiden am Rechtsstreit Beteiligten.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: zwischen denen der Streit besteht
  rationale: רִיב kann einen Streit, eine Rechtssache oder einen Rechtsstreit bezeichnen. Die gewählte Formulierung gibt die ungewöhnliche hebräische Besitzkonstruktion idiomatisch wieder, ohne sie auf einen rein technischen Rechtsbegriff festzulegen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier das Erscheinen in Gottes Gegenwart beziehungsweise vor seinem Gericht; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: vor die Priester und die Richter
  rationale: Die anerkannten priesterlichen und richterlichen Amtsträger werden entsprechend dem bestimmten hebräischen Ausdruck bezeichnet.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: die zu jener Zeit im Amt sind
  rationale: Die Wendung meint die jeweils zu dieser Zeit zuständigen Amtsträger. „Im Amt sind“ macht diese Funktion in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt unmittelbar das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Erscheinens „vor Jahwe“
  choice: Die Formulierung bleibt wörtlich und offen
  alternative: vor das Heiligtumsgericht treten
  rationale: Der Kontext verbindet das Verfahren mit Priestern und Richtern, doch der Vers nennt weder ausdrücklich einen bestimmten Ort noch erklärt er die genaue institutionelle Beziehung. Die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Vor … treten“ ist idiomatischer als „vor … stehen“ und bewahrt den formellen Gerichtsrahmen. Die Satzstruktur folgt eng dem hebräischen Ablauf, ohne unnatürlich zu wirken.
