  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: de
  text: Wenn aber ein Mann seinen Nächsten hasst, ihm auflauert, sich gegen ihn erhebt und ihn so schlägt, dass er stirbt, und dann in eine dieser Städte flieht,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Leitet gegenüber dem vorausgehenden Fall einer unbeabsichtigten Tötung einen kontrastierenden Bedingungsfall ein.
- source_word: יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ
  choice: ein Mann seinen Nächsten hasst
  rationale: Die deutsche Konditionalkonstruktion gibt den existenziellen hebräischen Ausdruck natürlich wieder; »Mann« wahrt die grammatisch und rechtlich männlich formulierte Fallbeschreibung, »Nächster« den sozialen und rechtlichen Sinn von רֵעַ.
- source_word: וְאָרַב לוֹ
  choice: ihm auflauert
  rationale: Bezeichnet ein vorsätzliches Warten auf das Opfer aus dem Hinterhalt und macht die Planung der Tat deutlich.
- source_word: וְקָם עָלָיו
  choice: sich gegen ihn erhebt
  rationale: Bewahrt das hebräische Bild und bezeichnet hier den feindseligen Angriff, ohne die Handlung durch ein zusammenfassendes Verb vorwegzunehmen.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: ihn so schlägt, dass er stirbt
  rationale: Gibt die idiomatische Verbindung mit נֶפֶשׁ sowie das ausdrücklich folgende וָמֵת verständlich als tödlichen Schlag und dessen Folge wieder, ohne die Aussage doppelt mit »tödlich ... stirbt« auszudrücken.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: und dann in eine dieser Städte flieht
  rationale: »Flieht« entspricht dem Verb; »dann« verdeutlicht lediglich die Abfolge und verhindert eine unklare Zuordnung des Subjekts nach dem Tod des Opfers. »Diese Städte« verweist auf die zuvor bestimmten Zufluchtsstädte.
theological_decisions:
- issue: Vorsätzliche Tötung im Gegensatz zur unbeabsichtigten Tötung
  choice: Die Abfolge »hasst … auflauert … sich gegen ihn erhebt … so schlägt, dass er stirbt« bleibt erhalten.
  alternative: 'Zusammenfassend: »ihn ermordet«'
  rationale: Der Zusammenhang beschreibt eindeutig eine vorsätzliche Tötung, doch der hebräische Text entfaltet sie durch Motive und Handlungen. Die Übersetzung bewahrt diese rechtlich bedeutsame Abfolge, statt sie durch eine interpretierende Sammelbezeichnung zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in klarer Rechtssprache. Die Satzstruktur bleibt als noch nicht abgeschlossener Bedingungssatz erhalten, da der Rechtssatz im folgenden Vers fortgesetzt wird. Keine Fußnote ist nötig; die tödliche Wirkung des idiomatischen Ausdrucks wird im Haupttext transparent wiedergegeben.
