  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: de
  text: Du sollst die Grenze deines Nächsten nicht verschieben[a], die frühere Generationen festgelegt haben, in deinem Erbteil, das du in dem Land erben wirst, das Jahwe, dein Gott, dir gibt, damit du es in Besitz nimmst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Grenzstein deines Nächsten nicht versetzen«. Das hebräische Wort bezeichnet die Grenze; im Zusammenhang kann dabei ein Grenzzeichen gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: versetzen
  rationale: Der Hifil von נסג bezeichnet hier das unrechtmäßige Verschieben einer Grundstücksgrenze, konkret des Grenzzeichens. »Versetzen« ist im Deutschen natürlich und lässt die genaue Richtung offen.
- source_word: גְּבוּל
  choice: Grenzstein
  rationale: Im rechtlichen Zusammenhang ist die durch ein sichtbares Grenzzeichen festgelegte Grundstücksgrenze gemeint. »Grenzstein« bezeichnet den beweglichen Gegenstand präzise und idiomatisch.
- source_word: רֵעֲךָ
  choice: deines Nächsten
  rationale: רֵעַ meint hier einen Mitmenschen beziehungsweise Angehörigen der Gemeinschaft; im Grundstücksrecht passt »Nächster« und bewahrt zugleich den biblischen Gemeinschaftsbezug.
- source_word: גָּבְלוּ
  choice: gesetzt haben
  rationale: Das Verb bezeichnet das Festlegen oder Abstecken einer Grenze. Zusammen mit »Grenzstein« ist »gesetzt haben« knapp und natürlich.
- source_word: רִאשֹׁנִים
  choice: frühere Generationen
  rationale: Die substantivierte Mehrzahl bezeichnet Menschen aus früherer Zeit, die die ursprünglichen Grenzen festlegten. »Frühere Generationen« gibt dies verständlich wieder, ohne sie enger als Vorfahren zu bestimmen.
- source_word: בְּנַחֲלָתְךָ
  choice: in deinem Erbteil
  rationale: נַחֲלָה bezeichnet den erblich zugeteilten Landbesitz. »Erbteil« bewahrt sowohl den rechtlichen als auch den bundestheologischen Landbezug.
- source_word: תִּנְחַל
  choice: das du … erhalten wirst
  rationale: Das Verb greift den Gedanken des Erbteils auf und bezeichnet den künftigen Empfang des Landes. »Als Erbe erhalten« wäre expliziter, doch »erhalten wirst« vermeidet im Deutschen eine schwerfällige Wiederholung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֹתֵן לְךָ
  choice: dir … gibt
  rationale: Das Partizip beschreibt Jahwes gegenwärtige beziehungsweise kennzeichnende Gabe des Landes. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: לְרִשְׁתָּהּ
  choice: zum Besitz
  rationale: Der Ausdruck bezeichnet die Inbesitznahme und den Besitz des Landes. »Zum Besitz« ist knapp und bewahrt den Zweckbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: נַחֲלָה als Landgabe und Erbbesitz
  choice: Erbteil
  alternative: Grundbesitz
  rationale: »Erbteil« erhält die Spannung zwischen göttlicher Landgabe, Zuteilung und dauerhaftem Familienbesitz; »Grundbesitz« würde den theologischen Gehalt verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Konkretheit des Grenzzeichens und der theologische Begriff des Erbteils bleiben erhalten; Wiederholungen des hebräischen Stammes נחל werden zugunsten eines natürlichen deutschen Satzes leicht variiert.
