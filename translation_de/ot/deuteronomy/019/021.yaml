  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: de
  text: 'Dein Auge soll kein Mitleid haben: Leben für Leben[a], Auge für Auge, Zahn für Zahn, Hand für Hand, Fuß für Fuß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet hier „Leben“, nicht „Seele“ in einem späteren theologischen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: soll kein Mitleid haben
  rationale: חוס bezeichnet hier Mitleid beziehungsweise Schonung. Zusammen mit עֵינֶךָ bewahrt „Dein Auge soll kein Mitleid haben“ das konkrete hebräische Bild und den bestimmten Ton der Rechtsanweisung.
- source_word: עֵינֶךָ
  choice: Dein Auge
  rationale: Die konkrete Wendung wird beibehalten, statt sie zu dem bloßen „du“ zu verallgemeinern.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: In der Formel נֶפֶשׁ בְּנֶפֶשׁ ist das Leben gemeint, nicht die „Seele“ in einem späteren metaphysischen Sinn.
- source_word: בְּ
  choice: für
  rationale: Die Präposition kennzeichnet in der wiederholten Rechtsformel Entsprechung beziehungsweise Vergeltung; „für“ ist im Deutschen knapp und idiomatisch.
- source_word: עַיִן
  choice: Auge
  rationale: Wörtliche und geläufige Wiedergabe des Körperteils in der Talionsformel.
- source_word: שֵׁן
  choice: Zahn
  rationale: Wörtliche und präzise Wiedergabe des Körperteils.
- source_word: יָד
  choice: Hand
  rationale: Wörtliche und präzise Wiedergabe des Körperteils.
- source_word: רֶגֶל
  choice: Fuß
  rationale: Wörtliche und in dieser Rechtsformel herkömmliche Wiedergabe; „Bein“ wäre möglich, ist hier aber weniger naheliegend.
theological_decisions:
- issue: Konkrete Talionsformel oder Verallgemeinerung als Grundsatz verhältnismäßiger Strafe
  choice: Die konkrete Formel „Leben für Leben, Auge für Auge, Zahn für Zahn, Hand für Hand, Fuß für Fuß“ wird bewahrt.
  alternative: Dynamische Verallgemeinerung wie „Die Strafe muss der Tat entsprechen“.
  rationale: Der hebräische Text bietet eine feste, konkrete Rechtsformel. Eine abstrakte Umschreibung würde ihre Rhetorik, ihre rechtliche Spannung und ihre Bezüge zu anderen Tora-Texten verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Augen-Wendung und die knappe, rhythmische Rechtsformel bleiben erhalten.
