translation:
  language: de
  text: Dann sollen die Ältesten seiner Stadt nach ihm schicken, ihn von dort holen und ihn dem Bluträcher[a] ausliefern; er soll sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rächer des Blutes“. Der hebräische Ausdruck גֹּאֵל הַדָּם ist ein juristischer Fachbegriff für die Person, die dafür zuständig war, vergossenes Blut zu rächen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: sollen … holen lassen
  rationale: Das Qal-Perfekt mit וְ hat im Rechtskontext vorschreibende Kraft. Zusammen mit וְלָקְחוּ wird die natürliche deutsche Wendung „holen lassen“ verwendet, ohne den Sinn der Entsendung auszulassen.
- source_word: זִקְנֵי עִירוֹ
  choice: die Ältesten seiner Stadt
  rationale: זִקְנֵי bezeichnet die anerkannten kommunalen Verantwortungsträger; „Älteste“ bewahrt den historischen Rechtsbegriff. עִיר kann Stadt oder Ortschaft bedeuten; „Stadt“ entspricht hier dem rechtlich-administrativen Kontext.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: ihn von dort holen lassen
  rationale: לקח bedeutet allgemein „nehmen/holen“. Im Zusammenhang mit der Zufluchtsstadt bezeichnet es die Wegnahme des Täters von dort; „holen lassen“ ist idiomatisch und vermeidet eine übermäßige Festlegung auf gewaltsames Ergreifen.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: ihn … ausliefern
  rationale: Die Wendung נתן ביד bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen. „Ausliefern“ gibt diesen rechtlichen Vorgang knapp und modern wieder.
- source_word: גֹּאֵל הַדָּם
  choice: Bluträcher
  rationale: Die hebräische Wortgruppe ist ein technischer Rechtsausdruck für denjenigen, der das vergossene Blut rächen soll. „Bluträcher“ ist im Deutschen knapp, transparent und traditionsfähig.
- source_word: וָמֵת
  choice: und er soll sterben
  rationale: Die knappe Schlussklausel bezeichnet die vorgeschriebene rechtliche Folge. „Soll sterben“ bewahrt den injunktiven beziehungsweise resultativen Charakter, ohne einen Zweckzusammenhang hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber durch „holen lassen“ idiomatisch geglättet. Der technische Ausdruck „Bluträcher“ bleibt erhalten und wird in der Fußnote erläutert.
