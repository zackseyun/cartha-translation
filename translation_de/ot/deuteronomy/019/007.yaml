  text: עַל כֵּ֛ן אָנֹכִ֥י מְצַוְּ/ךָ֖ לֵ/אמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: de
  text: 'Darum gebiete ich dir: »Du sollst dir drei Städte aussondern[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bestimmen«. Das hebräische Verb kann »absondern«, »aussondern« oder in diesem Zusammenhang »bestimmen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus dem vorausgehenden Zusammenhang; »Darum« ist knapp, natürlich und bewahrt die logische Verbindung.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen setzt das Subjekt hervor. Das ausdrückliche »ich« trägt dies im Deutschen ausreichend, ohne durch »ich selbst« eine möglicherweise zu starke Betonung einzuführen.
- source_word: מְצַוְּךָ
  choice: gebiete ich dir
  rationale: Das Partizip mit Suffix bezeichnet den gegenwärtig ausgesprochenen verbindlichen Befehl. »Gebiete ich dir« ist direkt, würdig und quellennah.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor leitet den Inhalt des Gebots ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne ein schwerfälliges »indem ich sage« einzufügen.
- source_word: שָׁלֹשׁ עָרִים
  choice: drei Städte
  rationale: Die einfache Verbindung aus Zahlwort und Substantiv wird unmittelbar wiedergegeben.
- source_word: תַּבְדִּיל
  choice: sollst … aussondern
  rationale: Der Hifil von בדל bedeutet »absondern/aussondern« und kann im Kontext auch die offizielle Bestimmung bezeichnen. »Aussondern« bewahrt den Grundgedanken der Trennung beziehungsweise besonderen Zwecksetzung.
- source_word: לָךְ
  choice: dir
  rationale: Die Präposition mit Suffix bezeichnet die Aussonderung für den Nutzen beziehungsweise Gebrauch des angesprochenen Israel. Die Stellung »dir drei Städte« ist idiomatisches Deutsch und bewahrt den singularischen Bezug.
theological_decisions:
- issue: Anrede Israels in der zweiten Person Singular im Bundesgesetz
  choice: Die singularische Anrede mit »dir« und »du« bewahren.
  alternative: Die kollektive Bedeutung durch eine pluralische Anrede oder eine unpersönliche Form ausdrücklich machen.
  rationale: Der hebräische Text redet Israel im Singular an. Die Beibehaltung dieser Form erhält den rhetorischen Charakter des Bundesgesetzes und vermeidet eine interpretierende Umformung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder; die direkte Rede macht den Inhalt des Gebots klar. »Aussondern« ist bewusst quellennäher als das kontextuell mögliche »bestimmen«.
