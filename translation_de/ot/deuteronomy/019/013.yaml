  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: de
  text: Du sollst kein Mitleid mit ihm haben[a], sondern die Blutschuld für unschuldig vergossenes Blut aus Israel beseitigen[b]. Und es wird dir gut gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Auge soll ihn nicht bemitleiden“; auch möglich: „Du sollst ihn nicht schonen.“ Im Hebräischen gilt das Auge bildlich als Sitz des Mitleids.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das unschuldige Blut aus Israel beseitigen“. Gemeint ist, die durch das Vergießen unschuldigen Blutes entstandene Blutschuld aus der Gemeinschaft Israels zu entfernen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Du sollst kein Mitleid mit ihm haben
  rationale: Die hebräische Wendung nennt wörtlich das Auge als Sitz des Mitleids und kann sowohl „Mitleid haben“ als auch „schonen“ ausdrücken. Die gewählte Formulierung gibt den Sinn in natürlichem modernem Deutsch wieder; das Bild des Auges und die Alternative „schonen“ werden in der Fußnote bewahrt.
- source_word: וּבִעַרְתָּ
  choice: sondern … beseitigen
  rationale: בער bezeichnet in den Rechtsbestimmungen des Deuteronomiums das Entfernen eines Übels oder einer Belastung aus der Gemeinschaft, nicht ein wörtliches Verbrennen. „Beseitigen“ ist hier klar und sachgemäß. „Sondern“ gibt den logischen Gegensatz im Deutschen natürlicher wieder als ein bloßes „und“.
- source_word: דַם הַנָּקִי
  choice: die Blutschuld wegen des unschuldig vergossenen Blutes
  rationale: Wörtlich steht „das unschuldige Blut“. Im rechtlichen Zusammenhang bezeichnet die Wendung zugleich die durch das Vergießen dieses Blutes entstandene gemeinschaftliche Blutschuld. Die Übersetzung macht diesen Bezug verständlich, ohne das unschuldige Opfer mit dem verurteilten Täter zu verwechseln; die wörtliche Ausdrucksweise bleibt in der Fußnote erhalten.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition מן bezeichnet die Entfernung aus der Bundesgemeinschaft. „Aus Israel“ bewahrt diesen gemeinschaftlichen Bezug knapp und direkt.
- source_word: וְטוֹב לָךְ
  choice: Dann wird es dir gut gehen
  rationale: Die geläufige deuteronomische Formel beschreibt die gute Folge des Gehorsams. „Dann“ bringt den folgernden Zusammenhang im heutigen Deutsch natürlich zum Ausdruck, ohne eine ausdrückliche Zweckangabe einzuführen.
theological_decisions:
- issue: Charakter des Gebots gegenüber dem Mörder
  choice: Das Gebot verlangt im Rahmen des vorausgehenden Rechtsverfahrens, fehlgeleitetes Mitleid zurückzustellen und die durch unschuldiges Blut entstandene Blutschuld aus der Gemeinschaft zu entfernen.
  alternative: Der Satz könnte als Aufforderung zu persönlicher Rache oder eigenmächtiger Vergeltung verstanden werden.
  rationale: Deuteronomium 19,11–12 beschreibt die geordnete Auslieferung und gerichtliche Bestrafung eines vorsätzlichen Mörders. Die Übersetzung fügt diese Kontextangabe nicht in den Vers ein, vermeidet aber eine Formulierung, die private Vergeltung nahelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rechtlichem Ton. Die hebräischen Bilder werden dort, wo eine wörtliche Wiedergabe im Deutschen missverständlich wäre, im Haupttext sinngemäß und in den Fußnoten formal bewahrt.
