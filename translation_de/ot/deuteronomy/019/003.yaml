  to: Du sollst den Weg für dich vorbereiten und das Gebiet deines Landes, das Jahwe, dein Gott, dir als Erbbesitz gibt, in drei Teile einteilen, damit jeder, der einen Menschen getötet hat, dorthin fliehen kann.[a]
