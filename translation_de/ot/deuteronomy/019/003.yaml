base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: de
  text: Du sollst den Weg für dich vorbereiten und das Gebiet deines Landes, das Jahwe, dein Gott, dir als Erbbesitz gibt, in drei Teile einteilen, damit jeder, der einen Menschen getötet hat, dorthin fliehen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und es soll zum Fliehen dorthin sein“. Das hebräische Wort kann in diesem Zusammenhang auch jemanden bezeichnen, der einen Menschen unabsichtlich getötet hat; die näheren Voraussetzungen werden in den folgenden Versen erläutert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: Du sollst den Weg dorthin instand setzen
  rationale: Das Hifil von כון bezeichnet hier das Bereitmachen eines Verkehrswegs. „Instand setzen“ gibt die praktische Zugänglichkeit natürlich wieder; „dorthin“ macht das im Deutschen erforderliche Ziel aus dem Zusammenhang der Zufluchtsstädte deutlich.
- source_word: וְשִׁלַּשְׁתָּ
  choice: in drei Bereiche einteilen
  rationale: Das Piel von שלש verlangt eine Dreiteilung. Die Formulierung wahrt den räumlichen Bezug und ist im Deutschen verständlich.
- source_word: גְּבוּל אַרְצְךָ
  choice: das Gebiet deines Landes
  rationale: גְּבוּל kann Grenze oder abgegrenztes Gebiet bedeuten. Da hier das Land für die Erreichbarkeit der Zufluchtsstädte gegliedert wird, ist „Gebiet“ sachgerechter als eine bloße Grenzlinie.
- source_word: יַנְחִילְךָ
  choice: dir als Erbbesitz geben wird
  rationale: Das Hifil von נחל verbindet das Geben des Landes mit dem Gedanken des Erbes. „Als Erbbesitz geben“ bewahrt beide Aspekte in natürlichem Deutsch.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben; die Bundesformel bleibt unmittelbar erkennbar.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: damit … dorthin fliehen kann
  rationale: Die knappe hebräische Wendung lautet wörtlich etwa „und es soll zum Dorthin-Fliehen sein“. Die deutsche Zweckkonstruktion gibt ihre Funktion klar wieder.
- source_word: כָּל רֹצֵחַ
  choice: jeder, der einen Menschen getötet hat
  rationale: רֹצֵחַ bezeichnet in diesem Kontext auch jemanden, der unabsichtlich getötet hat. Die Formulierung vermeidet das im Deutschen meist vorsätzliches Töten voraussetzende „Mörder“, ohne die im weiteren Gesetz zu klärende Schuldfrage vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den im Ausgangstext ausdrücklich verwendeten persönlichen Bundesnamen.
- issue: Ob רֹצֵחַ bereits Mordschuld bezeichnet
  choice: jeder, der einen Menschen getötet hat
  alternative: jeder Totschläger / jeder Mörder
  rationale: Der Zusammenhang der Zufluchtsstädte umfasst insbesondere unabsichtliche Tötung. Die gewählte Wiedergabe erhält die rechtliche Offenheit des Einzelverses und legt weder Mord noch Schuldlosigkeit vorzeitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer, aber allgemein verständlicher Ausdrucksweise. Die Satzstruktur folgt dem hebräischen Gedankengang, ohne dessen knappe Konstruktionen unnatürlich nachzuahmen.
