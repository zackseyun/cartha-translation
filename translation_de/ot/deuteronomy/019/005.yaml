  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: de
  text: Wenn jemand mit seinem Mitmenschen in den Wald geht, um Holz zu schlagen, und mit der Axt ausholt, um einen Baum zu fällen, dabei aber der Eisenkopf sich vom Stiel löst[a] und seinen Mitmenschen trifft, sodass dieser stirbt, dann darf er in eine dieser Städte fliehen und am Leben bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Eisen löst sich von dem Holz“. Mit „Eisen“ ist hier der eiserne Axtkopf, mit „Holz“ der hölzerne Stiel gemeint.'
    reason: Die Fußnote legt die metonymische Deutung offen und bewahrt den konkreten Wortlaut des Hebräischen.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Wenn jemand
  rationale: Die Wendung führt im fortlaufenden Gesetzestext einen konkreten Fall ein. Die konditionale Wiedergabe ist im heutigen Deutschen natürlich, ohne ein Geschlecht ausdrücklich festzulegen.
- source_word: רֵעֵהוּ
  choice: seinem Mitmenschen
  rationale: רֵעַ bezeichnet hier im rechtlichen Zusammenhang einen anderen Angehörigen der Gemeinschaft, nicht notwendig einen persönlichen Freund. „Mitmensch“ ist klarer als das heute teils räumlich verstandene „Nachbar“.
- source_word: בַיַּעַר
  choice: in den Wald
  rationale: יַעַר bezeichnet bewaldetes Gelände; „Wald“ ist die natürliche moderne Entsprechung.
- source_word: לַחְטֹב עֵצִים
  choice: um Holz zu schlagen
  rationale: Die Formulierung bezeichnet allgemein das Holzfällen beziehungsweise Holzschlagen und bleibt näher an עֵצִים als eine ausschließliche Festlegung auf einzelne Bäume.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: und mit der Axt ausholt
  rationale: Wörtlich ist von der Bewegung seiner Hand mit der Axt die Rede. „Mit der Axt ausholen“ gibt den konkreten Bewegungsablauf idiomatisch und knapp wieder.
- source_word: לִכְרֹת הָעֵץ
  choice: um einen Baum zu fällen
  rationale: כרת bezeichnet in diesem Zusammenhang das Fällen eines Baumes. Der hebräische bestimmte Artikel kann im beispielhaften Fall im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben werden.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: der Eisenkopf vom Stiel abrutscht
  rationale: „Das Eisen“ steht metonymisch für den eisernen Axtkopf, „das Holz“ für den hölzernen Stiel. Die verständliche Wiedergabe wird durch eine Fußnote mit dem wörtlichen Wortlaut transparent gemacht.
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: und seinen Mitmenschen trifft
  rationale: מצא bedeutet grundsätzlich „finden/erreichen“, bezeichnet hier aber das Auftreffen des gelösten Eisenteils auf die andere Person.
- source_word: וָמֵת
  choice: sodass dieser stirbt
  rationale: „Dieser“ macht eindeutig, dass der getroffene Mitmensch stirbt, und gibt den resultativen Zusammenhang natürlich wieder.
- source_word: הוּא יָנוּס
  choice: dann darf er ... fliehen
  rationale: Im rechtlichen Kontext eröffnet die Form Schutz und Zuflucht. „Darf“ drückt diese gewährte Möglichkeit aus, ohne daraus einen uneingeschränkten Befehl zu machen.
- source_word: וָחָי
  choice: und am Leben bleiben
  rationale: Die Form bezeichnet hier das Überleben infolge der Flucht in die Zufluchtsstadt.
