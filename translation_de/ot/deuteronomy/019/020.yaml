  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: de
  text: Und die Übrigen[a] werden davon hören und sich fürchten; sie werden nie wieder eine solche böse Tat[b] in deiner Mitte[c] begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verbliebenen“ beziehungsweise „die Zurückgebliebenen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „etwas wie diese böse Sache“, das heißt eine böse Tat dieser Art.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische steht im Singular und spricht Israel als gemeinschaftliches Ganzes an: „in deiner Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: die Übrigen
  rationale: Das substantivierte Nifal-Partizip von שׁאר bezeichnet die Menschen, die nach der gerichtlichen Bestrafung verbleiben. „Die Übrigen“ ist im Deutschen natürlich und bewahrt diesen Bezug.
- source_word: יִשְׁמְעוּ
  choice: werden davon hören
  rationale: שמע bedeutet grundsätzlich „hören“. Das ergänzte „davon“ macht im Deutschen natürlich deutlich, dass die Übrigen von dem vollzogenen Urteil erfahren, ohne den Sinn auszudeuten.
- source_word: וְיִרָאוּ
  choice: und sich fürchten
  rationale: ירא bezeichnet hier die durch die Strafe ausgelöste Furcht mit abschreckender Wirkung. „Sich fürchten“ erhält den ernsten rechtlichen Ton.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: sie werden nie wieder … begehen
  rationale: יסף mit Infinitiv und עוֹד drückt aus, dass die betreffende Handlung nicht erneut geschehen soll. „Nie wieder“ gibt diese Verbindung idiomatisch und nachdrücklich wieder.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: eine solche böse Tat
  rationale: דבר kann „Sache“, „Angelegenheit“ oder „Tat“ bedeuten; im gerichtlichen Zusammenhang ist eine böse Handlung gemeint. „Eine solche“ wahrt die vergleichende Kraft der Präposition כ.
- source_word: בְּקִרְבֶּךָ
  choice: in deiner Mitte
  rationale: Die feste gemeinschaftsbezogene Wendung bezeichnet das Geschehen innerhalb Israels. „In deiner Mitte“ bewahrt zudem die singularische Anrede des hebräischen Textes.
theological_decisions:
- issue: Numerus und Adressat in בְּקִרְבֶּךָ
  choice: die singularische Form „in deiner Mitte“
  alternative: idiomatisch „unter euch“
  rationale: Das hebräische Suffix steht in der zweiten Person Maskulinum Singular und redet Israel als gemeinschaftliches Ganzes an. Die singularische Wiedergabe bewahrt diese Spannung, ohne sie konfessionell auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-ernstem Ton. Der Satzbau ist leicht geglättet; „davon“ verdeutlicht den im Kontext vorausgesetzten Gegenstand des Hörens. Alle sachlich bedeutsamen Mehrdeutigkeiten werden im Text oder in den Fußnoten erhalten.
