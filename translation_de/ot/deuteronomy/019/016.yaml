base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: de
  text: Wenn ein böswilliger Zeuge[a] gegen jemanden auftritt, um gegen ihn wegen Auflehnung[b] auszusagen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ein Zeuge der Gewalttat/des Unrechts“; gemeint sein kann auch ein falscher oder schädigender Zeuge.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eines Vergehens“, „des Abfalls“ oder „der Abtrünnigkeit“. Das hebräische Wort bezeichnet eine schwerwiegende Abkehr oder Auflehnung; worin sie hier besteht, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier einen Rechtsfall als Bedingung ein; „Wenn“ entspricht dem deutschen Gesetzesstil.
- source_word: יָקוּם
  choice: auftritt
  rationale: קום bezeichnet in diesem gerichtlichen Zusammenhang das Auftreten beziehungsweise Erheben eines Zeugen. „Auftritt“ ist im Deutschen natürlich und bewahrt den forensischen Sinn.
- source_word: עֵד חָמָס
  choice: ein böswilliger Zeuge
  rationale: Die Wendung bedeutet wörtlich etwa „Zeuge der Gewalttat/des Unrechts“ und bezeichnet hier einen Zeugen, der in schädigender oder unrechtmäßiger Absicht handelt.
- source_word: בְּאִישׁ
  choice: gegen jemanden
  rationale: בְּ kennzeichnet hier die Zielperson der Aussage. אִישׁ kann in einer allgemeinen Rechtsformulierung eine beliebige Person bezeichnen; „jemanden“ gibt dies idiomatisch wieder.
- source_word: לַעֲנוֹת בּוֹ
  choice: um ihn … zu beschuldigen
  rationale: ענה bedeutet im Rechtskontext aussagen oder Zeugnis ablegen; zusammen mit בּוֹ und dem feindlichen Kontext ist die anklagende Funktion mit „beschuldigen“ klar und natürlich wiedergegeben.
- source_word: סָרָה
  choice: Auflehnung
  rationale: סָרָה bezeichnet ein Abweichen oder eine trotzige Abkehr und kann Rebellion oder Abfall meinen. „Auflehnung“ bewahrt den ernsten Charakter, ohne die Anschuldigung ausdrücklich auf religiösen Abfall festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von סָרָה
  choice: Auflehnung
  alternative: Vergehen; Abfall; Abtrünnigkeit; Falsches
  rationale: Der Ausdruck kann eine schwerwiegende Abkehr oder Rebellion bezeichnen, doch der knappe Rechtsfall nennt weder den Bereich noch den genauen Tatbestand. Die Übersetzung hält diese Spannung offen und vermeidet eine ausschließlich kultische Deutung.
- issue: Generischer Personenbezug von אִישׁ
  choice: jemanden
  alternative: einen Mann
  rationale: אִישׁ ist grammatisch maskulin, dient hier jedoch in einer kasuistischen Rechtsbestimmung als allgemeine Bezeichnung der betroffenen Person. „Jemanden“ wahrt den allgemeinen Geltungsbereich, ohne das Geschlecht der Zielperson unnötig festzulegen.
translation_notes:
  register: Moderner, würdiger deutscher Rechtsstil. Der Satz bleibt entsprechend dem folgenden Vers syntaktisch offen und endet mit einem Komma. Die Formulierung vermeidet sowohl altertümliches „wider“ als auch eine vorschnelle kultisch-theologische Festlegung von סָרָה.
