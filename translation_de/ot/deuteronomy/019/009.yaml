source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: de
  text: Wenn du dieses ganze Gebot, das ich dir heute gebiete, hältst, indem du danach handelst[a] – Jahwe, deinen Gott, zu lieben und allezeit auf seinen Wegen zu gehen –, dann sollst du zu diesen drei noch drei weitere Städte hinzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dieses ganze Gebot bewahrst, es zu tun«; »Gebot« steht im Hebräischen im Singular.'
    reason: Die Fußnote dokumentiert die engere hebräische Konstruktion und den bedeutungstragenden Singular, während der Haupttext idiomatisches Deutsch verwendet.
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: Die Partikel leitet hier die Bedingung für die Erweiterung der Zufluchtsstädte ein.
- source_word: תִשְׁמֹר
  choice: du … hältst
  rationale: Im Bundeskontext bezeichnet שׁמר das Bewahren beziehungsweise Befolgen eines Gebots. Ein zusätzliches »sorgfältig« steht nicht ausdrücklich im Hebräischen.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: dieses ganze Gebot
  rationale: Die Formulierung bewahrt den Singular von מִצְוָה und gibt zugleich die umfassende Bedeutung von כָּל in natürlichem Deutsch wieder.
- source_word: לַעֲשֹׂתָהּ
  choice: und danach handelst
  rationale: Der Infinitiv bezeichnet die praktische Ausführung des Gebots; die deutsche Wendung vermeidet ein schwerfälliges »es tust«.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: das ich dir heute gebiete
  rationale: Dies gibt den gegenwärtigen Sprechakt des Mose knapp und idiomatisch wieder.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinen Gott, zu lieben
  rationale: Der Infinitiv benennt Inhalt beziehungsweise Ziel des Gebots; der Gottesname wird als Jahwe wiedergegeben.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: und … auf seinen Wegen zu gehen
  rationale: Die Bundesmetapher des Gehens auf Gottes Wegen bleibt erhalten.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Die Wendung bezeichnet beständige, lebenslange Treue und lässt sich im Deutschen natürlich mit »allezeit« ausdrücken.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: dann sollst du … noch drei weitere Städte hinzufügen
  rationale: Die Fortsetzung des Bedingungssatzes wird mit »dann« verdeutlicht; לְךָ ist in der deutschen Konstruktion nicht eigens auszudrücken, ohne Besitz überzubetonen.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: zu diesen drei
  rationale: עַל hat hier additive Bedeutung und verweist auf die bereits bestimmten drei Städte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Metapher »auf seinen Wegen gehen« und der Singular »Gebot« bleiben erhalten; der lange Bedingungssatz wird durch Gedankenstriche gegliedert.
