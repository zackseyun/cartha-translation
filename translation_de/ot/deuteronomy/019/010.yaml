base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: de
  text: damit in deinem Land, das Jahwe, dein Gott, dir als Erbbesitz gibt, kein unschuldiges Blut vergossen wird und keine Blutschuld auf dir lastet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und Blut auf dir ist/sein wird“; die hebräische Wendung bezeichnet die Verantwortung für unschuldiges Blutvergießen, also Blutschuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: vergossen wird
  rationale: Das Nifal von שׁפך bezeichnet hier passiv das Vergießen von Blut; „Blut vergießen“ ist die natürliche deutsche Rechts- und Bibelsprache.
- source_word: דָּם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste rechtlich-moralische Wendung bezeichnet das Blut eines Menschen, der keine den Tod rechtfertigende Schuld trägt; die knappe hebräische Ausdrucksweise bleibt erhalten.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: in deinem Land
  rationale: קֶרֶב bezeichnet das Innere beziehungsweise den Bereich des Landes. Im Deutschen gibt „in deinem Land“ den räumlichen Sinn natürlich wieder, ohne das schwerfällige „inmitten deines Landes“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Umschrift.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: dir als Erbbesitz gibt
  rationale: Das Partizip נֹתֵן wird im gegenwärtigen Zusammenhang mit „gibt“ wiedergegeben; נַחֲלָה bezeichnet den als bleibenden Erbanteil zugewiesenen Besitz.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: und keine Blutschuld auf dich kommt
  rationale: דָּמִים bezeichnet in diesem rechtlichen Kontext die Haftung für vergossenes unschuldiges Blut. Die Formulierung mit „auf dich kommt“ bewahrt das Bild der auf dem Angesprochenen liegenden Schuld und fügt sich unter den negativen Zwecksatz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Umschrift „Jahwe“ bewahrt diesen Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bezug der Blutschuld
  choice: keine Blutschuld auf dich kommt
  alternative: Blut auf dir ist
  rationale: Die idiomatische Bedeutung als rechtliche und moralische Verantwortung wird im Haupttext verständlich ausgedrückt; die wörtlichere, mehrdeutige Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige deutsche Rechtssprache mit knapper Satzführung. Der Vers wird als negativer Zwecksatz formuliert; „Erbbesitz“ erhält den Bundes- und Landzuteilungsbezug von נַחֲלָה.
