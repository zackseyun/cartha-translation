  source_fidelity: Der Text gibt וְאֵלֶּה ... אֲשֶׁר לוֹ idiomatisch als „Und dies waren seine“ wieder und trifft שָׂרִים im Verwaltungskontext angemessen mit „hohen Beamten“. Name und Abstammungsangabe sind korrekt wiedergegeben. „der Priester“ bewahrt sowohl den bestimmten Artikel als auch die im Hebräischen nicht abschließend geklärte Zuordnung der Apposition, ohne „Hohepriester“ einzutragen.
  naturalness: „Und dies waren seine hohen Beamten“ ist flüssiges modernes Standarddeutsch mit angemessen würdigem Bibelregister. Die Appositionsfolge „Asarja, der Sohn Zadoks, der Priester“ ist leicht verdichtet, aber verständlich und gerade wegen der Fußnote vertretbar.
  terminology: „Hohe Beamte“ ist für שָׂרִים sachgerecht und vermeidet die heute missverständliche dynastische Konnotation von „Fürsten“. „Priester“ ist terminologisch präzise; die etablierte deutsche Namensform „Asarja“ ist angemessen.
