source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הַ/שָּׂרִ֖ים אֲשֶׁר ל֑/וֹ עֲזַרְיָ֥הוּ בֶן צָד֖וֹק הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: de
  text: 'Und dies waren seine hohen Beamten: Asarja, der Sohn Zadoks, der Priester.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen ist nicht eindeutig, ob »der Priester« Zadok bezeichnet oder ein Titel Asarjas ist. Wörtlich steht hier nicht »der Hohepriester«.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies waren
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet die folgende Liste ein und wahrt zugleich den erzählerischen Anschluss.
- source_word: הַשָּׂרִים
  choice: die hohen Beamten
  rationale: שׂרים bezeichnet hier ranghohe Amtsträger der königlichen Verwaltung. »Hohe Beamte« ist im Deutschen verständlich und vermeidet die erbliche oder dynastische Nebenbedeutung von »Fürsten«.
- source_word: אֲשֶׁר לוֹ
  choice: seine
  rationale: Die knappe possessive Wiedergabe bezeichnet die Amtsträger als Angehörige von Salomos Verwaltung, ohne ihre genaue Funktion über den Text hinaus festzulegen.
- source_word: עֲזַרְיָהוּ
  choice: Asarja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶן צָדוֹק
  choice: der Sohn Zadoks
  rationale: Die hebräische Abstammungsformel wird transparent und idiomatisch wiedergegeben.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Das Hebräische sagt wörtlich »der Priester« und nicht ausdrücklich »der Hohepriester«. Die Übersetzung bewahrt diese Formulierung.
theological_decisions:
- issue: Bezug und Amtsrang von הַכֹּהֵן (»der Priester«)
  choice: Die Formulierung »Asarja, der Sohn Zadoks, der Priester« bleibt im Haupttext formal mehrdeutig.
  alternative: »Asarja, der Sohn des Priesters Zadok« oder »Asarja, der Sohn Zadoks, war Priester«
  rationale: Die hebräische Wortfolge lässt offen, ob »der Priester« Zadok näher bestimmt oder Asarja als Amtsträger bezeichnet. Zudem steht dort nicht ausdrücklich »Hohepriester«. Diese Spannung wird nicht stillschweigend aufgelöst, sondern in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Hohe Beamte« vermittelt den administrativen Kontext; die mehrdeutige Apposition am Versende wird bewusst erhalten und durch die Fußnote erklärt.
