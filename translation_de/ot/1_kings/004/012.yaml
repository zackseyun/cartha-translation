  text: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ וְ/כָל בֵּ֣ית שְׁאָ֡ן אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: de
  text: 'Baana, der Sohn Ahiluds: Taanach und Megiddo sowie ganz Bet-Schean, das bei Zaretan unterhalb von Jesreel liegt, von Bet-Schean bis Abel-Mehola und bis jenseits von Jokmeam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis in das Gebiet jenseits von Jokmeam“. Die hebräische Grenzangabe ist knapp und nicht ganz eindeutig; daher ist auch diese etwas glattere geografische Wiedergabe möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Baana, der Sohn Ahiluds
  rationale: Die Personennamen werden nach dem Hebräischen transliteriert; die deutsche Genitivform gibt die Abstammungsangabe knapp und natürlich wieder.
- source_word: תַּעְנַ֖ךְ וּמְגִדּוֹ
  choice: Taanach und Megiddo
  rationale: Beide Ortsnamen werden in geläufiger deutscher Schreibweise wiedergegeben.
- source_word: וְכָל בֵּית שְׁאָן
  choice: sowie ganz Bet-Schean
  rationale: כָל bezeichnet hier die gesamte Ortschaft beziehungsweise den zugehörigen Verwaltungsraum; die knappe Formulierung bewahrt diese territoriale Weite, ohne ausdrücklich eine nicht genannte Gebietsbezeichnung einzufügen.
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: das bei Zaretan liegt
  rationale: אֵצֶל bezeichnet räumliche Nähe. „Bei“ ist im Deutschen natürlich und legt die genaue Entfernung nicht fest.
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: unterhalb von Jesreel
  rationale: Die Formulierung bewahrt die topografische Aussage einer tieferen Lage und vermeidet die interpretierende Festlegung auf eine Himmelsrichtung.
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: von Bet-Schean bis Abel-Mehola
  rationale: Die Wendung markiert die räumliche Ausdehnung des Bezirks; die Ortsnamen werden transliteriert.
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: bis jenseits von Jokmeam
  rationale: Diese Wiedergabe erhält die knappe und etwas schwierige hebräische Grenzformel, ohne den gemeinten Raum genauer zu bestimmen, als es der Ausgangstext erlaubt.
