  text: וַֽ/יְהִי֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/001.yaml
  text: King Solomon was king over all Israel.
translation:
  language: de
  text: König Salomo war König über ganz Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: Die Form leitet hier den neuen Abschnitt ein und trägt zusammen mit dem Prädikat die Aussage des Bestehens. Im natürlichen Deutschen ist kein zusätzlicher zeitlicher oder erzählerischer Ausdruck wie »nun« oder »und es geschah« nötig.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Der bestimmte Titel steht appositionell vor dem Eigennamen; im Deutschen lautet die idiomatische Titelfügung ohne Artikel »König Salomo«.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: מֶלֶךְ
  choice: war König
  rationale: Die zweite Verwendung von מלך ist prädikativ. »War König« bewahrt die nominale Struktur und die Wiederholung des Königstitels besser als »regierte«.
- source_word: עַל
  choice: über
  rationale: Bei Herrschaft über ein Volk bezeichnet עַל den Bereich königlicher Autorität; »über« ist die natürliche deutsche Entsprechung.
- source_word: כָּל
  choice: ganz
  rationale: Der Quantor bezeichnet Israel in seiner Gesamtheit. Vor einem artikellosen Ländernamen ist »ganz Israel« idiomatisches Deutsch.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Gebräuchliche deutsche Form des Volks- und Landesnamens.
theological_decisions:
- issue: Wiedergabe der doppelten Verwendung von מלך
  choice: 'Beide Vorkommen werden wiedergegeben: »König Salomo war König über ganz Israel.«'
  alternative: »Salomo war König über ganz Israel« oder »König Salomo regierte über ganz Israel«
  rationale: Die Wiederholung bezeichnet Salomo zunächst mit seinem Titel und sagt dann seine Königsherrschaft über ganz Israel aus. Ihre Beibehaltung bewahrt die Betonung des hebräischen Textes, ohne eine weitergehende Deutung einzutragen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die im Deutschen auffällige Wiederholung von »König« ist bewusst beibehalten, weil sie der ebenso auffälligen hebräischen Konstruktion entspricht.
