lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: Baana
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenkonvention transliteriert.
- source_word: בֶּן חוּשָׁי
  choice: der Sohn Huschais
  rationale: Die hebräische Abstammungsangabe wird natürlich und zugleich formnah wiedergegeben; der Name Huschai steht im Deutschen im Genitiv.
- source_word: בְּ/אָשֵׁר
  choice: in Ascher
  rationale: Die Präposition בְּ bezeichnet hier das dem Beamten zugewiesene Gebiet. „In Ascher“ bleibt näher am Hebräischen als das stärker deutende „über Ascher“.
- source_word: וּ/בְעָלֽוֹת
  choice: und Bealot
  rationale: Die Form wird als zweiter Ortsname verstanden. Die knappe Reihung ohne ergänztes „in“ entspricht dem hebräischen Listenstil; die unsichere Lesung wird in einer Fußnote kenntlich gemacht.
