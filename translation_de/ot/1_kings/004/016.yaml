  text: Baana, der Sohn Huschais, in Ascher und Bealot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »und Alot«. Der letzte Ortsname ist textlich und geografisch nicht sicher zu bestimmen.'
