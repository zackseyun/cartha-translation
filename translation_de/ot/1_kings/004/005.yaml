lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Asarjahu
  rationale: Der Personenname wird in einer dem Hebräischen nahen deutschen Umschrift wiedergegeben; die Endung -jahu bleibt erhalten.
- source_word: בֶן נָתָן
  choice: der Sohn Natans
  rationale: Natürliche deutsche Wiedergabe der hebräischen Abstammungs- beziehungsweise Beziehungsangabe.
- source_word: עַל הַנִּצָּבִים
  choice: stand den Statthaltern vor
  rationale: עַל bezeichnet hier Aufsicht oder Weisungsbefugnis. נִצָּבִים meint im salomonischen Verwaltungszusammenhang eingesetzte Amtsträger; „Statthalter“ vermittelt deren administrative Funktion verständlich.
- source_word: זָבוּד
  choice: Sabud
  rationale: Der Personenname wird nach deutscher Laut- und Umschriftkonvention transliteriert.
- source_word: כֹּהֵן
  choice: Priester
  rationale: Die primäre lexikalische Bedeutung wird im Haupttext bewahrt. Eine mögliche Bedeutung als hoher Hofbeamter wird wegen des Verwaltungszusammenhangs in der Fußnote genannt.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: ein Freund des Königs
  rationale: Die Formulierung gibt den hebräischen Ausdruck unmittelbar und idiomatisch wieder, ohne vorschnell auf einen förmlichen Hoftitel festgelegt zu werden.
theological_decisions:
- issue: Bedeutung von כֹּהֵן im königlichen Verwaltungszusammenhang
  choice: „Priester“ im Haupttext, mit Hinweis auf eine mögliche höfische Amtsbezeichnung in der Fußnote
  alternative: „oberster Beamter“ oder „königlicher Berater“
  rationale: Die gewöhnliche Bedeutung des hebräischen Wortes ist „Priester“. Da es in einem höfischen Kontext möglicherweise einen hohen Amtsträger bezeichnet, bleibt diese echte lexikalische Möglichkeit in der Fußnote erhalten, ohne den Haupttext interpretierend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form einer königlichen Ämterliste bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Wort „Priester“.
