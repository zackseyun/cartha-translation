  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: de
  text: Geber, der Sohn Uris, im Land Gilead, dem Land Sihons, des Königs der Amoriter, und Ogs, des Königs von Baschan; er war der einzige Statthalter, der in diesem Land war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der über dieses Land eingesetzt war“. Wörtlich lautet das Hebräische: „der in dem Land war“; die Formulierung kann hier auch im verwaltungsmäßigen Sinn verstanden werden.'
    reason: Bewahrt die mögliche administrative Bedeutung von אֲשֶׁר בָּאָרֶץ, ohne die wörtliche lokale Lesart im Haupttext aufzugeben.
lexical_decisions:
- source_word: גֶּבֶר
  choice: Geber
  rationale: Der Personenname wird in seiner herkömmlichen deutschen Form wiedergegeben.
- source_word: בֶּן אֻרִי
  choice: der Sohn Uris
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Abstammungsangabe natürlich und genau wieder.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: im Land Gilead
  rationale: אֶרֶץ wird ausdrücklich mit „Land“ wiedergegeben; dadurch bleibt auch die appositionelle Wiederholung im folgenden Satzteil erkennbar.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: dem Land Sihons, des Königs der Amoriter, und Ogs, des Königs von Baschan
  rationale: Die Apposition bezeichnet Gilead näher als das frühere Herrschaftsgebiet Sihons und Ogs. Die Genitive bewahren die knappe territoriale Zuordnung des Hebräischen.
- source_word: נְצִיב
  choice: Statthalter
  rationale: Im Verwaltungszusammenhang von 1. Könige 4 bezeichnet das Wort einen eingesetzten regionalen Amtsträger; „Statthalter“ ist im Deutschen klar und dem würdevollen Register angemessen.
- source_word: אֶחָד
  choice: der einzige
  rationale: 'In Verbindung mit dem bestimmten Bezug auf Geber gibt „der einzige“ die hervorhebende Funktion von אֶחָד idiomatisch wieder: Für dieses Gebiet war nur ein Statthalter zuständig.'
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: der in diesem Land war
  rationale: Die Wiedergabe folgt der gewöhnlichen lokalen Bedeutung der Präposition בְּ und ergänzt nur die im Hebräischen unausgesprochene Kopula. „diesem“ stellt den Rückbezug auf das unmittelbar genannte Land im Deutschen klar.
