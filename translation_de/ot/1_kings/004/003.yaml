  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: de
  text: Elihoref und Ahija, die Söhne Schischas[a], waren Schreiber[b]; Joschafat, der Sohn Ahiluds, war der Kanzler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Söhne Schischas“. Die Parallelstelle in 2. Samuel 8,17 hat die verwandte Namensform Schawscha.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: Staatsschreiber. Gemeint sind königliche Beamte, die für Schriftstücke und Urkunden zuständig waren.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: Chronist oder Berichterstatter. Die hebräische Amtsbezeichnung meint wahrscheinlich einen Hofbeamten, der Vorgänge festhielt und dem König Angelegenheiten vortrug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Elihoref
  rationale: Der Personenname wird nach im Deutschen üblicher bibelhebräischer Lautung wiedergegeben.
- source_word: וַאֲחִיָּה
  choice: und Ahija
  rationale: Der Personenname samt vorangestellter Konjunktion wird in geläufiger deutscher Form wiedergegeben.
- source_word: בְּנֵי שִׁישָׁא
  choice: die Söhne Schischas
  rationale: Die hebräische Genitivverbindung bezeichnet die Abstammung. Der masoretische Text dieses Verses nennt Schischa; die abweichende Namensform der Parallelstelle wird nicht in den Haupttext eingetragen.
- source_word: סֹפְרִים
  choice: Staatsschreiber
  rationale: Im Zusammenhang der königlichen Ämterliste bezeichnet das Wort mit Schreib- und Urkundenaufgaben betraute Hofbeamte. „Staatsschreiber“ ist verständlich und grenzt dieses Amt vom nachfolgend genannten מַזְכִּיר ab.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן אֲחִילוּד
  choice: der Sohn Ahiluds
  rationale: Natürliche und zugleich formnahe deutsche Wiedergabe der Abstammungsangabe.
- source_word: הַמַּזְכִּיר
  choice: der Kanzler
  rationale: Der Titel bezeichnet einen hohen Hofbeamten, der Vorgänge festhielt und dem König Angelegenheiten vortrug. „Kanzler“ vermittelt die amtliche Funktion im heutigen Deutsch, ohne ihn mit den Staatsschreibern gleichzusetzen.
