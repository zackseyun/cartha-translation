  yaml_path: translation/ot/1_kings/004/020.yaml
  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: de
  text: Juda und Israel waren so zahlreich wie der Sand am Meer[a]. Sie aßen und tranken und freuten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie der Sand, der am Meer ist, an Menge« – eine hebräische Wendung für eine außerordentlich große Bevölkerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Juda und Israel
  rationale: Die beiden Eigennamen bilden gemeinsam das Subjekt; die üblichen deutschen Namensformen werden verwendet.
- source_word: רַבִּים כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: waren so zahlreich wie der Sand am Meer
  rationale: רַבִּים steht prädikativ, weshalb im Deutschen „waren“ ergänzt wird. Die Vergleichsformulierung gibt das Bild natürlich wieder; לָרֹב verstärkt die Aussage über die große Zahl und wird durch „so zahlreich“ erfasst.
- source_word: אֹכְלִים וְשֹׁתִים וּשְׂמֵחִים
  choice: Sie aßen und tranken und freuten sich
  rationale: Die hebräischen Partizipien schildern einen fortdauernden beziehungsweise charakteristischen Zustand. Eine finite deutsche Satzfolge ist hier natürlicher und bewahrt durch die dreifache Verbindung mit „und“ den Rhythmus.
