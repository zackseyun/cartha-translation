base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/011.yaml
  text: Ben-abinadab, over all the height of Dor; Taphath the daughter of Solomon was his wife.
translation:
  language: de
  text: Ben-Abinadab war für das ganze Gebiet von Dor[a] zuständig; Tafat, die Tochter Salomos, war seine Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: das ganze Nafat-Dor; gemeint ist wahrscheinlich der Verwaltungsbezirk beziehungsweise das Gebiet von Dor.'
    reason: Die seltene Gebietsbezeichnung נָפָה lässt sich entweder als Gattungsbegriff „Bezirk/Gebiet“ verstehen oder enger am Hebräischen als Teil eines Orts- beziehungsweise Bezirksnamens wiedergeben.
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Ben-Abinadab
  rationale: Der hebräische Ausdruck wird hier wie die Bezeichnung beziehungsweise der Name des Amtsträgers wiedergegeben; eine Auflösung zu „Sohn Abinadabs“ wäre zwar sprachlich möglich, würde aber die knappe Namensform der Beamtenliste unnötig festlegen.
- source_word: כָּל נָפַת דֹּאר
  choice: das ganze Gebiet von Dor
  rationale: נָפָה bezeichnet hier am natürlichsten einen Bezirk oder ein Gebiet. „Höhe von Dor“ ist als etymologisch geprägte Wiedergabe im Deutschen missverständlich und passt weniger gut zum administrativen Zusammenhang der Liste.
- source_word: טָפַת
  choice: Tafat
  rationale: Der Personenname wird entsprechend der hebräischen Form ins Deutsche übertragen.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: war seine Frau
  rationale: Dies gibt die hebräische Besitz- und Beziehungsformel natürlich und vollständig wieder.
theological_decisions: []
translation_notes:
  register: Knappe, sachliche Sprache entsprechend einer Beamtenliste. Das im Hebräischen ausgelassene Amtsprädikat wird mit „war … zuständig“ aus dem unmittelbaren Kontext ergänzt. Moderne deutsche Namensformen und eine verständliche administrative Bezeichnung werden verwendet.
