translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihung entspricht dem Charakter der Verwaltungsliste; das Semikolon trennt den Beamten und seinen Amtssitz von den ihm zugeteilten Gebieten. Beide Fußnotenmarker erscheinen im Haupttext.
