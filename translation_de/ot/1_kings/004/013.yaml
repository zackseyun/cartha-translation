  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: de
  text: 'Ben-Geber in Ramot-Gilead; ihm waren die Siedlungen Jaïrs[a], des Sohnes Manasses, die in Gilead lagen, zugeteilt, ebenso das Gebiet Argob[b] in Baschan: sechzig große Städte mit Mauern und bronzenen Riegeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zeltsiedlungen Jaïrs“; als Ortsname: „Hawwot-Jaïr“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Bezirk“ beziehungsweise „der Landstrich Argob“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-Geber
  rationale: Die Wortgruppe fungiert in dieser Beamtenliste am ehesten als Name; die Transliteration bewahrt diese namensartige Verwendung, ohne sie zu einer gewöhnlichen Abstammungsangabe aufzulösen.
- source_word: בְּרָמֹת גִּלְעָד
  choice: in Ramot-Gilead
  rationale: ב ist hier lokal; „Ramot-Gilead“ ist eine geläufige und verständliche deutsche Form des Ortsnamens.
- source_word: לֹו
  choice: ihm waren … zugeteilt / ebenso
  rationale: Das zweimalige לֹו bezeichnet die einem Beamten unterstellten beziehungsweise zugewiesenen Gebiete. Die deutsche Formulierung gibt den Verwaltungskontext natürlich wieder; „ebenso“ vertritt die Wiederholung beim zweiten Gebiet.
- source_word: חַוֺּת יָאִיר
  choice: die Zeltdörfer Jaïrs
  rationale: חַוּוֹת bezeichnet Siedlungen beziehungsweise Zeltdörfer. „Zeltdörfer“ bewahrt die konkrete Eigenart des Ausdrucks; die traditionelle Namensform steht in der Fußnote.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: in Gilead
  rationale: Die Relativkonstruktion lokalisiert Jaïrs Siedlungen. Im Deutschen lässt sie sich knapp und ohne Bedeutungsverlust als nachgestellte Ortsangabe wiedergeben.
- source_word: חֶבֶל אַרְגֹּב
  choice: das Gebiet Argob
  rationale: חֶבֶל bezeichnet hier einen abgegrenzten Landstrich oder Bezirk. „Gebiet“ ist im modernen Deutsch natürlich und lässt den genauen Verwaltungsstatus offen.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: in Baschan
  rationale: Die Wendung lokalisiert Argob; die knappe Ortsangabe entspricht natürlichem Deutsch.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: sechzig große Städte
  rationale: גְּדֹלוֹת beschreibt hier wahrscheinlich Größe oder Bedeutung; „große“ bewahrt die lexikalische Offenheit.
- source_word: חוֹמָה
  choice: mit Mauern
  rationale: Das Singularwort steht kollektiv beziehungsweise beschreibend zu den sechzig Städten; im Deutschen ist der Plural „Mauern“ idiomatisch.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: und bronzenen Riegeln
  rationale: בְרִיחַ bezeichnet einen Sperrriegel oder Balken, nicht das Tor selbst. „Bronzene Riegel“ bewahrt das konkrete Bild der Befestigung.
