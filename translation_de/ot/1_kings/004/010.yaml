lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-Hesed
  rationale: In der Liste königlicher Bezirksbeamter kann die Verbindung als Personenname verstanden werden. Die Transliteration bewahrt diese namensartige Funktion; die formal wörtliche Deutung steht in der Fußnote.
- source_word: בָּאֲרֻבּוֹת
  choice: in Arubbot
  rationale: Die Präposition ב ist lokal zu verstehen; der Ortsname wird nach deutscher Konvention transliteriert.
- source_word: לוֹ
  choice: ihm waren … zugeteilt
  rationale: Im Zusammenhang der Verwaltungsbezirke bezeichnet die Wendung den Zuständigkeitsbereich des Beamten. Die Formulierung gibt diesen Sinn natürlich wieder, ohne Eigentum im engeren Sinn vorauszusetzen.
- source_word: שֹׂכֹה
  choice: Socho
  rationale: Der Ortsname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: und das ganze Land Hefer
  rationale: אֶרֶץ bezeichnet hier ein Gebiet beziehungsweise Land; כָל wird vollständig durch »das ganze« wiedergegeben.
