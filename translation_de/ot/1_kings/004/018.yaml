- source_word: בְּ/בִנְיָמִן
  choice: in Benjamin
  rationale: Die Präposition בְ bezeichnet zunächst die räumliche beziehungsweise territoriale Zuordnung; „in Benjamin“ bewahrt diese Grundbedeutung, ohne die Amtsbeziehung näher festzulegen.
