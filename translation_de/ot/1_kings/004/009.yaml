  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: de
  text: Ben-Deker[a], in Makaz, in Schaalbim, in Bet-Schemesch und in Elon-Bet-Hanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „der Sohn Dekers“; hier wird die hebräische Namensform als Personenbezeichnung „Ben-Deker“ beibehalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Deker
  rationale: In dieser Verwaltungsliste dient die Verbindung aus בֶּן und einem Eigennamen als Personenbezeichnung. Die Umschrift bewahrt die hebräische Namensform; die mögliche wörtliche Wiedergabe wird in der Fußnote genannt.
- source_word: בְּ/מָקַץ
  choice: in Makaz
  rationale: Die Präposition בְ bezeichnet hier unmittelbar den Ort beziehungsweise Bezirk, der diesem Beamten zugeordnet ist. „In“ gibt den lokativen Sinn wieder, ohne das aus dem Zusammenhang erschlossene „über“ in den Ausdruck hineinzutragen.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: in Schaalbim
  rationale: Konjunktion und Präposition werden sinngemäß wiedergegeben; der Ortsname wird in einer für deutsche Leser transparenten Umschrift geboten.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: in Bet-Schemesch
  rationale: Obwohl die Präposition vor diesem Namen nicht erneut ausdrücklich steht, wirkt ihre lokative Bedeutung in der Aufzählung fort. Der Ortsname wird transliteriert und nicht als „Haus der Sonne“ übersetzt.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: in Elon-Bet-Hanan
  rationale: Die Wortfolge wird als zusammengesetzter Ortsname verstanden. Das ergänzte „in“ gibt die aus den vorherigen Gliedern fortwirkende lokative Konstruktion natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Ortsnamen werden deutsch lesbar transliteriert; die knappe Listenform des Hebräischen bleibt erhalten. Das im Hebräischen nur beim ersten und zweiten Ort ausdrücklich gesetzte „in“ wird für die gesamte Ortsreihe wiederholt, um die fortwirkende lokative Beziehung im Deutschen klar auszudrücken.
