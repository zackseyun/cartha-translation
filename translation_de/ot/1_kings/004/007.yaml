base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: de
  text: Salomo hatte zwölf Beauftragte über ganz Israel[a]. Sie versorgten den König und seinen Haushalt; jeder war jeweils einen Monat im Jahr für die Versorgung zuständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Amtsträger“, „Verwalter“ oder „Aufseher“. Der hebräische Ausdruck bezeichnet allgemein Personen, die für eine Aufgabe eingesetzt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: Salomo hatte
  rationale: Die Präposition לְ bezeichnet hier Besitz beziehungsweise Zuordnung; im natürlichen Deutschen wird dies mit „Salomo hatte“ wiedergegeben. Das einleitende וְ dient der fortlaufenden Erzählverknüpfung und muss hier nicht eigens mit „und“ übersetzt werden.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: נִצָּבִים
  choice: Beauftragte
  rationale: Das Wort bezeichnet eingesetzte Amtsträger oder Verwalter. „Beauftragte“ wahrt die administrative Bedeutung, ohne ihre genaue Amtsstellung enger festzulegen, als der hebräische Ausdruck erlaubt.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל bezeichnet hier den Bereich ihrer Zuständigkeit; die formnahe Wendung ist im Deutschen verständlich und bewahrt die mögliche administrative Autorität.
- source_word: וְכִלְכְּלוּ
  choice: Sie versorgten
  rationale: כלכל bezeichnet in diesem Zusammenhang die Bereitstellung des Unterhalts beziehungsweise der Lebensmittel für den königlichen Hof.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: den König und seinen Hof
  rationale: בַּיִת meint hier nicht nur ein Gebäude, sondern den königlichen Haushalt beziehungsweise Hofstaat. „Hof“ passt prägnant zum administrativen Kontext.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: einen Monat im Jahr
  rationale: Die Wendung bezeichnet die jährliche Dauer der jeweils turnusmäßigen Versorgungspflicht.
- source_word: יִהְיֶה עַל אֶחָד
  choice: jeder von ihnen hatte ... zu sorgen
  rationale: Wörtlich liegt die Pflicht „auf einem“; אֶחָד ist hier distributiv zu verstehen, sodass jeweils einer der zwölf für seinen Monat verantwortlich war.
- source_word: לְכַלְכֵּל
  choice: für die Versorgung zu sorgen
  rationale: Der Infinitiv greift dasselbe Verb wie zuvor auf. Die nominale Wendung vermeidet im Deutschen eine schwerfällige Wiederholung von „versorgen“.
