  text: וּ/בְנָיָ֥הוּ בֶן יְהוֹיָדָ֖ע עַל הַ/צָּבָ֑א וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: de
  text: Benaja, der Sohn Jojadas, befehligte das Heer, und Zadok und Abjatar waren Priester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „oberste Amtsträger“ beziehungsweise „führende Beamte“, falls כֹּהֲנִים hier im weiteren Sinn für hohe königliche Amtsträger gebraucht wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: befehligte das Heer
  rationale: Die Verbindung von עַל mit einem Amts- oder Zuständigkeitsbereich bezeichnet hier Aufsicht beziehungsweise Befehlsgewalt. Die deutsche Wiedergabe ist natürlich und macht die militärische Zuständigkeit deutlich, ohne einen im Hebräischen nicht ausdrücklich genannten Amtstitel einzuführen.
- source_word: הַצָּבָא
  choice: das Heer
  rationale: צָבָא bezeichnet hier die organisierte militärische Streitmacht. „Heer“ ist im Deutschen eine klare, knappe und dem historischen Kontext angemessene Entsprechung.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Die gewöhnliche und primäre Bedeutung des Wortes ist „Priester“. Da Zadok und Abjatar auch andernorts als priesterliche Personen bekannt sind, gibt es keinen hinreichenden Grund, hier eine weiter gefasste höfisch-administrative Bedeutung in den Haupttext aufzunehmen.
- source_word: בְנָיָהוּ
  choice: Benaja
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: יְהוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
theological_decisions:
- issue: Ob כֹּהֲנִים wegen des höfisch-administrativen Kontexts nicht kultisch als „oberste Amtsträger“ oder „führende Beamte“ wiederzugeben ist.
  choice: Priester
  alternative: oberste Amtsträger; führende Beamte
  rationale: Der lexikalische Regelfall ist „Priester“, und Zadok sowie Abjatar sind ausdrücklich mit dem Priestertum verbunden. Die Hauptübersetzung bewahrt daher den naheliegenden Sinn; die mögliche breitere Amtsbedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Befehligte das Heer“ ist natürlicher als die formale Wendung „war über dem Heer“, ohne den Sinn zu überpräzisieren. Die in deutschen Bibeln geläufigen Namensformen werden verwendet.
