source:
  edition: WLC
  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: de
  text: Und Ahischar war für den königlichen Haushalt zuständig[a], und Adoniram, der Sohn Abdas, war für die Zwangsarbeit zuständig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stand dem Palast vor“ / „war für das Haus zuständig“. Wörtlich heißt es im Hebräischen „über dem Haus“; gemeint ist ein Hofamt mit Aufsicht über den königlichen Haushalt beziehungsweise die Palastverwaltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „war für den Frondienst zuständig“. Der hebräische Ausdruck bezeichnet eine vom Staat auferlegte Arbeitspflicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Und Ahischar
  rationale: Der Personenname wird nach geläufiger deutscher Umschrift wiedergegeben; die vorangestellte Konjunktion וַ wird mit „Und“ ausgedrückt.
- source_word: עַל הַבָּיִת
  choice: war für den königlichen Haushalt zuständig
  rationale: עַל bezeichnet in dieser Liste die amtliche Zuständigkeit oder Aufsicht. הַבַּיִת bedeutet wörtlich „das Haus“, meint im höfischen Zusammenhang aber den königlichen Haushalt beziehungsweise die Palastverwaltung.
- source_word: וַאֲדֹנִירָם
  choice: und Adoniram
  rationale: Der Personenname wird transliteriert; die Konjunktion וַ wird mit „und“ wiedergegeben.
- source_word: בֶּן עַבְדָּא
  choice: der Sohn Abdas
  rationale: Die übliche deutsche Wiedergabe der patronymischen Angabe; der Genitiv wahrt den knappen Charakter der Amtsliste.
- source_word: עַל הַמַּס
  choice: war für die Zwangsarbeit zuständig
  rationale: מַס bezeichnet in diesem königlichen Verwaltungskontext eine verpflichtende staatliche Arbeitsleistung. „Zwangsarbeit“ ist im heutigen Deutsch klarer als der Fachausdruck „Frondienst“ und genauer als eine bloße Abgabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zuständig“ vermittelt die administrative Funktion natürlich; „königlichen“ verdeutlicht den durch den Kontext bestimmten Bezug von „Haus“, während die wörtlicheren Möglichkeiten in der Fußnote erhalten bleiben.
