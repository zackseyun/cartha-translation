base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: de
  text: Ahimaaz[a] in Naftali; auch er heiratete Basemat, eine Tochter Salomos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über Naftali« beziehungsweise »für Naftali«. Die hebräische Präposition kann hier das Ahimaaz zugewiesene Verwaltungsgebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nahm Basemat, Tochter Salomos, zur Frau«; dies ist eine übliche hebräische Wendung für »heiratete sie«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ahimaaz
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: בְּנַפְתָּלִי
  choice: in Naftali
  rationale: Die Präposition בְ bezeichnet hier im Zusammenhang der Verwaltungsbezirke wahrscheinlich das Gebiet, in dem Ahimaaz eingesetzt war; die knappe Ortsangabe bewahrt die Offenheit der hebräischen Formulierung.
- source_word: גַּם הוּא
  choice: auch er
  rationale: Gibt den additiven Nachdruck der hebräischen Wortverbindung natürlich und eng am Ausgangstext wieder.
- source_word: לָקַח ... לְאִשָּׁה
  choice: heiratete
  rationale: Die wörtliche Wendung »nahm ... zur Frau« ist ein geläufiges hebräisches Heiratsidiom; »heiratete« vermittelt dessen Bedeutung in natürlichem modernem Deutsch.
- source_word: בָּשְׂמַת
  choice: Basemat
  rationale: Transliteration des hebräischen Personennamens in einer im Deutschen gebräuchlichen Form.
- source_word: בַּת שְׁלֹמֹה
  choice: eine Tochter Salomos
  rationale: Die Constructusverbindung bezeichnet die Abstammung; der unbestimmte Artikel ist im Deutschen natürlich und behauptet nicht, Basemat sei Salomos einzige Tochter.
