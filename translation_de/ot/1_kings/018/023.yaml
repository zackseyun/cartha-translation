source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: de
  text: Sie sollen uns zwei Stiere geben. Sie sollen sich einen davon auswählen, ihn in Stücke zerlegen und auf das Holz legen, aber kein Feuer anzünden.[a] Ich werde den anderen Stier zubereiten und auf das Holz legen, aber auch ich werde kein Feuer anzünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aber kein Feuer setzen/legen«; ebenso am Ende des Verses. „Anzünden“ gibt im Zusammenhang die gemeinte Handlung idiomatisch wieder.'
    reason: Die hebräische Formulierung nennt lediglich das Setzen beziehungsweise Legen von Feuer; die deutsche Übersetzung gibt den kontextuell gemeinten Vorgang wieder, ohne einen nicht ausdrücklich genannten Ort hinzuzufügen.
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ שְׁנַיִם פָּרִים
  choice: Man soll uns zwei Stiere geben
  rationale: Die mit וְ verbundenen Imperfektformen formulieren hier einen Vorschlag beziehungsweise eine Aufforderung. פָּרִים bezeichnet im Opferkontext Stiere; eine Altersangabe ist nicht ausdrücklich enthalten.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Sie sollen sich den einen Stier auswählen
  rationale: לָהֶם wird durch das reflexive „sich“ wiedergegeben. „Den einen Stier“ bezeichnet einen der beiden, ohne eine bestimmte Auswahl vorwegzunehmen.
- source_word: וִינַתְּחֻהוּ
  choice: ihn in Stücke zerlegen
  rationale: נתח bezeichnet bei der Opferzubereitung das Zerteilen des Tieres. „In Stücke zerlegen“ ist präzise und in modernem Deutsch natürlich.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: auf das Holz legen
  rationale: הָעֵצִים bezeichnet kollektiv das als Brennmaterial aufgeschichtete Holz. „Legen“ gibt die konkrete Handlung idiomatisch wieder.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: aber kein Feuer anzünden
  rationale: Wörtlich steht „kein Feuer hinlegen/setzen“. Gemeint ist im Kontext, dass das vorbereitete Opfer nicht entzündet werden darf. Die deutsche Wendung ist natürlich, ohne den im Hebräischen nicht genannten Ort „darunter“ einzufügen.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Ich werde den anderen Stier zubereiten
  rationale: עשה bezeichnet hier im Zusammenhang die Vorbereitung des Opfertiers. Nachdem den Baalspropheten einer der beiden Stiere zugewiesen wurde, ist der verbleibende sachgemäß „der andere“.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: und auf das Holz legen
  rationale: נתן hat hier die konkrete Bedeutung „legen/setzen“. Die Wiedergabe wahrt die Parallelität zum Vorgehen der Gegenseite.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: aber auch ich werde kein Feuer anzünden
  rationale: Die Formulierung entspricht der vorherigen Anweisung. „Auch ich“ verdeutlicht die im Subjektpronomen וַאֲנִי hervorgehobene Parallelität.
theological_decisions:
- issue: Opfersprachliche Beschreibung ohne zusätzliche kultische oder dogmatische Deutung
  choice: Konkrete Tätigkeiten mit „zerlegen“, „auf das Holz legen“ und „kein Feuer anzünden“ wiedergeben
  alternative: Durchgehend technische Begriffe wie „herrichten“, „darbringen“ oder „opfern“ verwenden
  rationale: Der Vers beschreibt die praktische Vorbereitung des Gottesurteils auf dem Karmel. Die Übersetzung bleibt bei den ausdrücklich genannten Handlungen und trägt keine weitergehende Opfertheologie ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen parallelen Anweisungen des Hebräischen bleiben erkennbar. Das unpersönliche „Man soll“ vermeidet ein unbelegtes ausdrückliches Subjekt bei der Bereitstellung der Stiere; anschließend bezeichnet „sie“ die Baalspropheten.
