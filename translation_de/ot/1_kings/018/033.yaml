  text: Dann legte er das Holz zurecht, zerlegte den Stier und legte ihn auf das Holz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: schichtete … auf
  rationale: ערך bezeichnet hier das geordnete Anordnen des Brennholzes. „Aufschichten“ ist im Zusammenhang mit einem Altar natürlich und anschaulich.
- source_word: הָעֵצִים
  choice: das Holz
  rationale: Der hebräische Plural wird im Deutschen für Brennmaterial idiomatisch als kollektiver Singular „Holz“ wiedergegeben.
- source_word: וַיְנַתַּח
  choice: zerlegte
  rationale: נתח bezeichnet das Zerteilen eines Opfertiers in einzelne Stücke. „Zerlegte“ gibt den Vorgang knapp, würdig und ohne unnötig drastische Färbung wieder.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet im Opferzusammenhang einen Stier; eine Altersangabe ist in diesem Vers nicht ausdrücklich enthalten.
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: שים bedeutet allgemein „setzen, legen, stellen“. Bei den Teilen des Opfertiers auf dem Holz ist „legte“ im Deutschen die natürlichste räumliche Wiedergabe.
- source_word: עַל הָעֵצִים
  choice: auf das Holz
  rationale: עַל bezeichnet hier eindeutig die räumliche Lage auf dem zuvor aufgeschichteten Holz.
