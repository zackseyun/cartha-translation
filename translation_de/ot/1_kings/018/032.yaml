  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: de
  text: Aus den Steinen baute er einen Altar im Namen Jahwes. Dann legte er rings um den Altar einen Graben an, der dem Maß von zwei Sea Saatgut entsprach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie das Maß von zwei Sea Saatgut«. Die schwierige hebräische Wendung bezeichnet die Größe oder möglicherweise das Fassungsvermögen des Grabens. Ein Sea war ein altes Hohlmaß.'
    reason: Die Fußnote erläutert die elliptische Maßangabe, ohne ihre umstrittene genaue räumliche Bedeutung einseitig festzulegen.
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Aus den Steinen baute er einen Altar
  rationale: Die Formulierung gibt die instrumentale Bedeutung natürlich wieder, ohne aus dem Zusammenhang zusätzlich »wieder aufbauen« einzutragen.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Dies entspricht der üblichen Bedeutung von בְּשֵׁם und bewahrt den Gottesnamen als Eigennamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: legte … einen Graben an
  rationale: תְּעָלָה bezeichnet hier einen Graben oder Kanal; »einen Graben anlegen« ist im modernen Deutschen natürlich.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: der etwa zwei Sea Saatgut hätte fassen können
  rationale: Die schwierige elliptische Maßangabe wird verständlich wiedergegeben, ohne die alte Einheit Sea durch eine unsichere moderne Umrechnung zu ersetzen. Die mögliche Beziehung auf Größe oder Fassungsvermögen wird in der Fußnote offengelegt.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: rings um den Altar
  rationale: Die Wendung bezeichnet die den Altar umgebende Lage des Grabens knapp und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diesen Befund; die Form »Jahwe« ist die im Deutschen übliche Umschrift.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die alte Maßeinheit bleibt erhalten; die genuine Unsicherheit der hebräischen Größenangabe wird nicht im Haupttext überladen, sondern in der Fußnote kenntlich gemacht.
