id: 1KI.18.15
reference: 1 Kings 18:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: de
  text: 'Und Elia sagte: „So wahr Jahwe, der Herr der Heerscharen, lebt, vor dem ich stehe: Noch heute werde ich mich ihm zeigen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ihm erscheinen“. Das hebräische Verb kann bedeuten, gesehen zu werden, zu erscheinen oder sich jemandem zu zeigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: So wahr Jahwe … lebt
  rationale: Die feste hebräische Schwurformel wird mit einer natürlichen und feierlichen deutschen Schwurformel wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Der Gottesname bleibt als „Jahwe“ erhalten; „Herr der Heerscharen“ gibt den traditionellen Hoheitstitel verständlich wieder, ohne ihn auf menschliche Armeen einzuengen.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: vor dem ich stehe
  rationale: Die Formulierung bewahrt das hebräische Bild des Dieners oder Amtsträgers, der in der Gegenwart seines Herrn steht.
- source_word: כִּי הַיּוֹם
  choice: Noch heute
  rationale: Im Zusammenhang des Schwurs drückt die Wendung die nachdrückliche Zusicherung aus, dass es an diesem selben Tag geschehen wird.
- source_word: אֵרָאֶה אֵלָיו
  choice: werde ich mich ihm zeigen
  rationale: 'Die Niphal-Form von ראה kann hier reflexiv beziehungsweise medial verstanden werden: Elia wird dafür sorgen, dass Ahab ihn sieht. Die Wiedergabe ist im Deutschen natürlich und lässt die Nähe zu „erscheinen“ erkennen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צְבָאוֹת im Gottesnamen
  choice: Herr der Heerscharen
  alternative: Jahwe der Heerscharen; Jahwe der Heere
  rationale: Die gewählte Form macht im heutigen Deutsch deutlich, dass „Heerscharen“ zu Jahwes Hoheitstitel gehört, ohne die umfassende Bedeutung auf irdische Streitkräfte festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel und das Bild des Stehens vor Jahwe bleiben erhalten; die altertümlichere Wendung „Heerscharen“ wird nur im feststehenden Gottesprädikat verwendet.
