id: 1KI.18.8
reference: 1 Kings 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: de
  text: 'Da sagte er zu ihm: »Ich bin es[a]. Geh und sag deinem Herrn: ›Sieh, Elia ist da!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur das betonte Pronomen „ich“; hier dient es der Selbstidentifikation. Auch möglich: „Ja, ich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein. „Da sagte er“ gibt den Fortgang im modernen Deutschen natürlich wieder.
- source_word: לוֹ
  choice: zu ihm
  rationale: Die Präposition ל mit Suffix der 3. Person Singular bezeichnet den Adressaten der Rede.
- source_word: אָ֑נִי
  choice: Ich bin es
  rationale: Das selbstständige, betonte Pronomen dient im Zusammenhang der Selbstidentifikation. Im Deutschen wird dies idiomatisch durch „Ich bin es“ ausgedrückt.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך wird knapp und unmittelbar wiedergegeben.
- source_word: אֱמֹר
  choice: sag
  rationale: Der Imperativ von אמר leitet den auszurichtenden Wortlaut ein; „sag“ ist natürlich und wahrt die direkte Rede.
- source_word: לַאדֹנֶיךָ
  choice: deinem Herrn
  rationale: אָדוֹן bezeichnet hier Ahabs Stellung als menschlichen Vorgesetzten Obadjas. „Herr“ ist im Deutschen die natürliche Bezeichnung innerhalb dieses Dienstverhältnisses.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel lenkt nachdrücklich die Aufmerksamkeit auf Elias Anwesenheit. „Sieh“ bewahrt diese Funktion ohne das altertümliche „siehe“.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von אָדוֹן bei einem menschlichen Vorgesetzten
  choice: deinem Herrn
  alternative: deinem Gebieter
  rationale: Gemeint ist Ahab als Obadjas irdischer Herr, nicht Gott. Der Kontext macht den menschlichen Bezug deutlich; „Herr“ ist würdig und idiomatisch, während „Gebieter“ unnötig feudal oder hart klingt.
- issue: Elliptische Selbstidentifikation durch אָ֑נִי
  choice: Ich bin es
  alternative: Ich
  rationale: Der hebräische Text enthält nur das betonte Pronomen „ich“. Die deutsche Ergänzung „bin es“ macht seine kontextuelle Funktion als Selbstidentifikation verständlich, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die direkte Rede bleibt lebendig; altertümliche Wendungen wie „siehe“ werden vermieden.
