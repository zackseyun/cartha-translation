base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: de
  text: 'Da sagte Elia zum ganzen Volk: »Kommt zu mir!« Da trat das ganze Volk zu ihm. Und er stellte den niedergerissenen Altar Jahwes wieder her.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »heilte den niedergerissenen Altar Jahwes«; gemeint ist, dass Elia ihn wiederherstellte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ
  choice: Kommt zu mir her
  rationale: Der Imperativ von נגשׁ fordert das Volk auf, körperlich näher zu treten; die Wendung ist im Deutschen natürlich und bewahrt die Richtung auf Elia zu.
- source_word: וַיִּגְּשׁוּ
  choice: kam ... zu ihm
  rationale: Die Form erzählt unmittelbar, dass das ganze Volk Elias Aufforderung folgt. Die Wiederholung von »zu« hält den Zusammenhang erkennbar, ohne unnatürlich zu klingen.
- source_word: וַיְרַפֵּא
  choice: stellte ... wieder her
  rationale: רפא bedeutet wörtlich »heilen«, bezeichnet beim Altar aber bildhaft dessen Wiederherstellung. »Wiederherstellen« ist hier klar und idiomatisch; die wörtliche Metapher wird in der Fußnote bewahrt.
- source_word: מִזְבַּח יְהוָה
  choice: den Altar Jahwes
  rationale: Die Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben, statt ihn durch den Titel »der HERR« zu ersetzen.
- source_word: הֶהָרוּס
  choice: niedergerissenen
  rationale: Das passive Partizip von הרס bezeichnet einen gewaltsam abgebrochenen oder zerstörten Altar; »niedergerissen« ist präzise und natürlich.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Da« bildet den Fortgang in modernem deutschem Erzählstil ab.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Dies ist die natürliche deutsche Wiedergabe des kollektiven Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildhafte Bedeutung von רפא beim Altar
  choice: stellte ... wieder her
  alternative: heilte
  rationale: Die wörtliche Wiedergabe »heilte den Altar« bewahrt zwar die Metapher, wirkt im heutigen Deutsch jedoch ungewöhnlich. Der Haupttext vermittelt die kontextuelle Bedeutung; die Fußnote erhält das hebräische Bild.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Rede ist leicht verständlich; der Gottesname erscheint als »Jahwe«. Die ungewöhnliche hebräische Heilungsmetapher wird im flüssigen Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.
