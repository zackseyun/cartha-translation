source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: de
  text: Nun sende aus und versammle ganz Israel bei mir auf dem Berg Karmel[a], dazu die vierhundertfünfzig Propheten des Baal und die vierhundert Propheten der Aschera[b], die am Tisch Isebels essen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Berg Karmel“; die hebräische Präposition bezeichnet die Bewegung zum Ort der Versammlung.'
    reason: lexical_alternative
  - marker: b
    text: „Aschera“ kann die gleichnamige Göttin oder in manchen Zusammenhängen einen mit ihr verbundenen Kultgegenstand bezeichnen. Die Parallele zu „Baal“ spricht hier für die Göttin.
    reason: cultural_note
  - marker: c
    text: Das Essen an Isebels Tisch weist darauf hin, dass diese Propheten von ihr unterhalten und versorgt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Leitet als knapper Diskursmarker Elias unmittelbar folgenden Befehl ein; „Nun“ ist in modernem Deutsch natürlich und würdevoll.
- source_word: שְׁלַח קְבֹץ
  choice: sende Boten aus und versammle
  rationale: Der erste Imperativ setzt kontextuell das Aussenden von Boten oder Anordnungen voraus, der zweite bezeichnet das Zusammenbringen. Die Ergänzung „Boten“ macht den deutschen Satz verständlich, ohne das Handlungsmoment zu verändern.
- source_word: אֵלַי
  choice: bei mir
  rationale: Bezeichnet die Ausrichtung der Versammlung auf Elia hin; „bei mir“ fügt sich natürlich in die deutsche Konstruktion mit „versammeln“, während die Zielrichtung erhalten bleibt.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt die kollektive nationale Bezeichnung und ihre rhetorische Weite.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: auf dem Berg Karmel
  rationale: Die Präposition bezeichnet das Ziel der Bewegung. Bei einer Versammlung ist „auf dem Berg Karmel“ im Deutschen idiomatisch; die wörtlichere Zielangabe wird in der Fußnote genannt.
- source_word: נְבִיאֵי הַבַּעַל
  choice: die Propheten des Baal
  rationale: Gibt die Zugehörigkeit beziehungsweise kultische Bindung der Propheten an Baal klar und konventionell wieder.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: vierhundertfünfzig
  rationale: Die Zahl wird im literarischen Bibeltext ausgeschrieben.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: die Propheten der Aschera
  rationale: Die Parallelstellung zu Baal spricht hier dafür, Aschera als Namen der Gottheit zu verstehen. Die Form „Aschera“ entspricht dem geläufigen deutschen Namen.
- source_word: אַרְבַּע מֵאוֹת
  choice: vierhundert
  rationale: Die Zahl wird konsistent ausgeschrieben.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: die am Tisch Isebels essen
  rationale: Bewahrt das konkrete Bild des Essens an Isebels Tisch und lässt zugleich die damit verbundene königliche Versorgung erkennen, ohne sie in den Haupttext hineinzuerklären.
theological_decisions:
- issue: Bedeutung von אֲשֵׁרָה in diesem Vers
  choice: 'Aschera wird als Name der Gottheit wiedergegeben: „die Propheten der Aschera“.'
  alternative: Das Wort könnte in anderen Zusammenhängen einen mit Aschera verbundenen Kultgegenstand bezeichnen.
  rationale: Die syntaktische und semantische Parallele zu „den Propheten des Baal“ begünstigt hier den Bezug auf die Gottheit. Eine Fußnote bewahrt die grundsätzliche lexikalische Mehrdeutigkeit.
- issue: Umfang von „ganz Israel“
  choice: Die kollektive nationale Wendung „ganz Israel“ bleibt erhalten.
  alternative: „alle Israeliten“ könnte distributiver verstanden werden.
  rationale: Der hebräische Ausdruck ist eine nationale Gesamtbezeichnung. Die Übersetzung wahrt seine rhetorische Breite, ohne festzulegen, ob ausnahmslos jeder Einzelne gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Die Satzstruktur bleibt befehlsartig und knapp. Traditionell vertraute Eigennamenformen wie „Karmel“, „Baal“, „Aschera“ und „Isebel“ werden verwendet; strittige Bedeutungsnuancen stehen in Fußnoten.
