id: 1KI.18.22
reference: 1 Kings 18:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: de
  text: 'Da sagte Elia zum Volk: »Ich allein bin als Prophet Jahwes übrig geblieben[a]; die Propheten des Baal dagegen sind 450 Mann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elias Aussage beschreibt seine Stellung in dieser öffentlichen Auseinandersetzung. An anderer Stelle berichtet die Erzählung jedoch von weiteren Propheten Jahwes, die Obadja versteckt hatte (1. Könige 18,4.13).
    reason: Die erzählerische Spannung zu den zuvor erwähnten versteckten Propheten soll kenntlich bleiben, ohne Elias Aussage im Haupttext umzudeuten.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Die im Deutschen eingebürgerte Namensform wird verwendet.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: עָם bezeichnet hier das versammelte Volk Israel; »Volk« ist direkt und kontextgerecht.
- source_word: אֲנִי ... לְבַדִּי
  choice: Ich allein
  rationale: Das ausdrücklich gesetzte Pronomen und לְבַדִּי betonen Elias isolierte Stellung. »Ich allein« bewahrt diesen Nachdruck, ohne das Pronomen im Deutschen unnatürlich zu verdoppeln.
- source_word: נוֹתַרְתִּי
  choice: bin ... übrig geblieben
  rationale: Das Verb bezeichnet das Verbleiben beziehungsweise Übrigbleiben und beschreibt hier Elias gegenwärtig behaupteten Zustand.
- source_word: נָבִיא לַיהוָה
  choice: als Prophet Jahwes
  rationale: Die Wendung kennzeichnet Elia als einen Propheten, der Jahwe zugehört und für ihn spricht; der Genitiv ist im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: die Propheten des Baal dagegen
  rationale: Das Waw verbindet die Sätze, trägt im Kontext jedoch einen klaren Gegensatz zwischen dem einzelnen Elia und den zahlreichen Baalspropheten.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: 450 Mann
  rationale: Die Zahl wird genau wiedergegeben; das singularische אִישׁ dient nach der Zahl als Personenbezeichnung, wofür »Mann« im Deutschen idiomatisch ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Elias Aussage, er sei allein übrig geblieben
  choice: Ich allein bin als Prophet Jahwes übrig geblieben
  alternative: Nur ich bin als Prophet Jahwes übrig geblieben
  rationale: Die Aussage wird so wiedergegeben, wie Elia sie in dieser Konfrontation äußert. Die Erwähnung anderer, von Obadja versteckter Propheten wird nicht zur Harmonisierung in den Haupttext eingetragen; die Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ich allein« trägt die hebräische Betonung natürlich; das Semikolon hebt den scharfen zahlenmäßigen Gegensatz hervor.
