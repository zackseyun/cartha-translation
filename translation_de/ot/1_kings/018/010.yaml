source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: de
  text: 'So wahr Jahwe, dein Gott, lebt: Es gibt kein Volk und kein Königreich, wohin mein Herr nicht geschickt hat, um dich zu suchen. Wenn sie sagten: »Er ist nicht hier«, ließ er das Königreich und das Volk schwören, dass sie dich nicht finden konnten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: So wahr Jahwe, dein Gott, lebt
  rationale: Die geläufige deutsche Schwurformel gibt die hebräische Wendung natürlich und feierlich wieder und bewahrt ihren Eidcharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: Es gibt kein Volk und kein Königreich, wohin … nicht
  rationale: אִם steht innerhalb der Schwurformel und hat hier verneinend-bekräftigende, nicht unsichere konditionale Kraft.
- source_word: גּוֹי וּמַמְלָכָה
  choice: Volk und Königreich
  rationale: Die beiden politischen Begriffe bleiben unterschieden; גּוֹי bezeichnet hier ein Volk beziehungsweise eine Nation, מַמְלָכָה ein Königreich oder Herrschaftsgebiet.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Obadja bezeichnet damit respektvoll König Ahab, nicht Gott.
- source_word: שָׁלַח … לְבַקֶּשְׁךָ
  choice: geschickt hat, um dich zu suchen
  rationale: Die deutsche Formulierung bewahrt die Abfolge von Aussenden und Suchen, ohne ein im Hebräischen unausgesprochenes Objekt wie »Boten« hinzuzufügen.
- source_word: וְאָמְרוּ אָיִן
  choice: 'Wenn sie sagten: »Er ist nicht hier«'
  rationale: Das knappe אָיִן bezeichnet hier Elias Abwesenheit; das Pronomen wird für verständliches Deutsch aus dem Zusammenhang ergänzt.
- source_word: וְהִשְׁבִּיעַ
  choice: ließ … schwören
  rationale: Der Hifil von שבע bedeutet, jemanden einen Eid ablegen zu lassen.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: dass sie dich nicht gefunden hatten
  rationale: כִּי leitet den Inhalt des Eides ein. Im rückblickenden Erzählzusammenhang ist das Nichtauffinden die naheliegende Aussage; die mögliche modale Nuance wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname wahrt den Unterschied zwischen dem Gottesnamen und dem Titel אֲדֹנִי, der im selben Vers für Ahab gebraucht wird.
- issue: Inhalt des von den fremden Reichen verlangten Eides
  choice: dass sie dich nicht gefunden hatten
  alternative: dass sie dich nicht finden konnten
  rationale: Das Hebräische kann das tatsächliche Nichtauffinden oder, kontextuell, das Unvermögen auszudrücken scheinen. Der Haupttext wählt die zeitlich passende Ergebnisaussage und bewahrt die Nuance in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle deutsche Schwurformel »So wahr … lebt« vermittelt die Feierlichkeit ohne altertümliche Satzstellung. »Mein Herr« bleibt wegen des höfischen Zusammenhangs erhalten; die Wiederholung »das Königreich und das Volk« folgt der hebräischen Paarung.
