  text: 'Und nun sagst du: »Geh und sag deinem Herrn: ›Sieh, Elia ist hier!‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt die fortführende Konjunktion und den zeitlichen Ausdruck knapp und natürlich wieder.
- source_word: לַאדֹנֶיךָ
  choice: deinem Herrn
  rationale: אדון bezeichnet hier Obadjas menschlichen Herrn, König Ahab; »Herrn« bewahrt die respektvolle Amts- und Rangbezeichnung.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf Elias Anwesenheit; »Sieh« ist würdevoll und näher an der hebräischen Form als eine bloße Ortsangabe.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Verwendet die im Deutschen etablierte Namensform.
