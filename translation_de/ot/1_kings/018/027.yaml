base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: de
  text: 'Als es Mittag wurde, verspottete Elia sie und sagte: »Ruft mit lauter Stimme! Denn er ist ein Gott. Vielleicht ist er in Gedanken, oder er ist zur Seite gegangen,[a] oder er ist auf Reisen. Vielleicht schläft er und wird aufwachen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »er erleichtert sich«. Die hebräische Wendung ist wahrscheinlich eine verhüllende Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: Um die Mittagszeit
  rationale: Die hebräische Erzählungsform führt den nächsten Zeitpunkt ein. Im Deutschen gibt die knappe Zeitangabe die Funktion natürlich wieder, ohne ein schwerfälliges »Und es geschah«.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: verspottete Elia sie
  rationale: Das Verb bezeichnet höhnisches, herabsetzendes Spotten; »verspotten« bewahrt den scharfen Ton.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Ruft mit lauter Stimme!
  rationale: Bewahrt den Imperativ und das konkrete hebräische Bild einer lauten Stimme.
- source_word: כִּי אֱלֹהִים הוּא
  choice: Er ist doch ein Gott
  rationale: Der unbestimmte Ausdruck bezieht sich im ironischen Reden Elias auf Baal. »doch« vermittelt im Deutschen die spöttische Begründung, ohne die Aussage als Bekenntnis zu formulieren.
- source_word: שִׂיחַ
  choice: Vielleicht ist er in Gedanken
  rationale: Die seltene Wendung kann gedankliche Versunkenheit oder Beschäftigung bezeichnen. Die Übersetzung bleibt bewusst allgemein und passt zum ironischen Zusammenhang.
- source_word: שִׂיג לוֹ
  choice: er hat sich zurückgezogen
  rationale: Die seltene, vermutlich euphemistische Wendung wird auch im Haupttext verhüllend wiedergegeben; die wahrscheinlich konkretere Bedeutung steht in der Fußnote.
- source_word: דֶרֶךְ לוֹ
  choice: er ist auf Reisen
  rationale: Gibt die idiomatische Bedeutung, unterwegs beziehungsweise abwesend zu sein, in natürlichem Deutsch wieder.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Vielleicht schläft er und wacht wieder auf
  rationale: Bewahrt die Möglichkeitspartikel und gibt das intransitive Erwachen wieder, ohne interpretierend »man muss ihn wecken« einzuführen.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים mit Bezug auf Baal
  choice: ein Gott
  alternative: Gott
  rationale: Elia spricht ironisch über Baal und identifiziert ihn nicht mit dem Gott Israels. Der unbestimmte Ausdruck erhält die Polemik, ohne ein theologisches Bekenntnis daraus zu machen.
- issue: Deutung der euphemistischen Wendung שִׂיג לוֹ
  choice: er hat sich zurückgezogen
  alternative: er erleichtert sich
  rationale: Der Haupttext bewahrt die indirekte Ausdrucksweise des Hebräischen. Die wahrscheinlich gemeinte körperliche Verrichtung wird als lexikalische Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarem Spott. Die direkte Rede bleibt lebendig, ohne umgangssprachlich oder unnötig derb zu werden; die seltene euphemistische Wendung wird nicht überpräzisiert.
