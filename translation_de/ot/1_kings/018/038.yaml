  text: וַ/תִּפֹּ֣ל אֵשׁ יְהוָ֗ה וַ/תֹּ֤אכַל אֶת הָֽ/עֹלָה֙ וְ/אֶת הָ֣/עֵצִ֔ים וְ/אֶת הָ/אֲבָנִ֖ים וְ/אֶת הֶ/עָפָ֑ר וְ/אֶת הַ/מַּ֥יִם אֲשֶׁר בַּ/תְּעָלָ֖ה לִחֵֽכָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: de
  text: Da fiel das Feuer Jahwes[a] herab und verzehrte das Brandopfer, das Holz, die Steine und den Staub; auch das Wasser im Graben leckte es auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Da fiel Feuer von Jahwe herab. Der hebräische Ausdruck kann die göttliche Herkunft des Feuers hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: das Feuer Jahwes
  rationale: Die unmittelbare Verbindung beider Substantive bezeichnet Feuer, das Jahwe zugeordnet ist. Die Formulierung bewahrt die direkte göttliche Urheberschaft und die Prägnanz des Hebräischen.
- source_word: וַתִּפֹּל
  choice: Da fiel … herab
  rationale: נפל bedeutet wörtlich „fallen“. „Herab“ verdeutlicht im Deutschen die im Kontext vorausgesetzte Bewegung von oben, ohne das Bild des Fallens aufzugeben.
- source_word: וַתֹּאכַל
  choice: verzehrte
  rationale: Das Verb bedeutet wörtlich „essen“, wird aber bei Feuer idiomatisch im Sinn von „verzehren“ gebraucht.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עלה bezeichnet im Opferkontext das vollständig auf dem Altar verbrannte Opfer; „Brandopfer“ ist der geläufige und präzise deutsche Ausdruck.
- source_word: הָעֵצִים
  choice: das Holz
  rationale: Der hebräische Plural bezeichnet hier das aufgeschichtete Brennholz; im Deutschen ist der Kollektivsingular natürlich.
- source_word: הָאֲבָנִים
  choice: die Steine
  rationale: Direkte Wiedergabe, die die außergewöhnliche Heftigkeit des Feuers sichtbar macht.
- source_word: הֶעָפָר
  choice: den Staub
  rationale: עפר kann Staub oder lockere Erde bezeichnen; „Staub“ bewahrt das anschauliche Bild und die Abgrenzung von den Steinen.
- source_word: לִחֵכָה
  choice: leckte … auf
  rationale: Das Verb לחך bedeutet „lecken“. Die Wendung bewahrt das lebhafte Bild des hebräischen Textes und ist mit Wasser als Objekt idiomatisch.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: das Wasser im Graben
  rationale: תעלה bezeichnet den um den Altar angelegten Graben beziehungsweise eine Rinne. „Graben“ ist im Erzählzusammenhang konkret und allgemein verständlich.
- source_word: וַ
  choice: Da / und / auch
  rationale: Die aufeinanderfolgenden Waw-Formen treiben die Erzählung voran. Wechselnde natürliche deutsche Verknüpfungen erhalten die Abfolge, ohne einen schwerfälligen Satz zu erzeugen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von אֵשׁ zu יְהוָה
  choice: das Feuer Jahwes
  alternative: Feuer von Jahwe
  rationale: Der knappe hebräische Ausdruck lässt die Zuordnung eng und kann sowohl Besitz beziehungsweise Kennzeichnung als auch die göttliche Herkunft hervorheben. Der Haupttext bleibt formal nah; die Fußnote nennt die mögliche Hervorhebung der Herkunft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulichen Verben. Das Semikolon gliedert die lange Aufzählung und hebt das abschließende Bild vom aufgeleckten Wasser hervor.
