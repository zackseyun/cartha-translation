  - severity: low
    issue: „den einen Stier“ ist im Deutschen übermarkiert
    rationale: Die Formulierung bezieht sich kontextuell auf einen der zwei Stiere. „Wählt euch einen Stier aus“ ist idiomatisch und verliert keine relevante Information.
  - severity: medium
    issue: Fußnote a erklärt die hebräische Wendung als „Ruft im Namen ...“
    rationale: Bei קרא בשם ist „den Namen ... anrufen“ die passende formnahe deutsche Konstruktion; „im Namen“ kann im Deutschen eine andere Bedeutung nahelegen.
