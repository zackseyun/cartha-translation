base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: de
  text: 'Da sagte Elia zu den Propheten Baals: „Wählt euch einen Stier aus und bereitet ihn zuerst zu, denn ihr seid viele. Ruft dann den Namen eures Gottes an,[a] aber legt kein Feuer dazu.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ruft den Namen eures Gottes an.“ Die hebräische Wendung bezeichnet das Anrufen oder die Bitte um das Eingreifen einer Gottheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „legt kein Feuer“. Das Hebräische sagt nicht ausdrücklich, wohin das Feuer gelegt werden sollte; der Opferkontext macht den Bezug deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: zu den Propheten Baals
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Baal zugehörigen Propheten.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Wählt euch den einen Stier aus
  rationale: Der Artikel mit „einer“ verweist im Kontext auf einen der zuvor genannten beiden Stiere; „euch“ bewahrt לָכֶם.
- source_word: וַעֲשׂוּ
  choice: bereitet ihn zu
  rationale: Im Opferkontext bezeichnet עשה hier die Vorbereitung des Tieres; „opfert ihn“ wäre zu stark interpretierend.
- source_word: רִאשֹׁנָה
  choice: zuerst
  rationale: Die adverbial gebrauchte Form bestimmt die Reihenfolge.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: denn ihr seid die Vielen
  rationale: Die auffällige Determination הָרַבִּים wird bewahrt und hebt die zahlenmäßige Überlegenheit der Baalspropheten hervor.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: Ruft dann den Namen eures Gottes an
  rationale: קרא בשם ist eine feste Wendung für das Anrufen einer Gottheit; die Wiedergabe behält zugleich das ausdrückliche „Name“ bei.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: aber legt kein Feuer dazu
  rationale: Das Hebräische nennt keine räumliche Ergänzung wie „darunter“. „Dazu“ ist im Opferkontext natürlich, ohne die implizierte Lage unnötig festzulegen.
theological_decisions:
- issue: אֱלֹהֵיכֶם mit Bezug auf Baal
  choice: eures Gottes
  alternative: eurer Götter
  rationale: Obwohl אֱלֹהִים formal plural sein kann, ist hier der einzelne Baal der eindeutige Bezugspunkt. Der Singular vermeidet eine im unmittelbaren Satz nicht ausgesagte Mehrzahl von Gottheiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und direkt. „Die Vielen“ bewahrt die markierte hebräische Formulierung, während die Fußnoten die idiomatische und räumliche Offenheit des Ausgangstextes erläutern.
