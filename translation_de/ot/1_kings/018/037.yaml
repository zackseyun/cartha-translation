  text: עֲנֵ֤/נִי יְהוָה֙ עֲנֵ֔/נִי וְ/יֵֽדְעוּ֙ הָ/עָ֣ם הַ/זֶּ֔ה כִּֽי אַתָּ֥ה יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/אַתָּ֛ה הֲסִבֹּ֥תָ אֶת לִבָּ֖/ם אֲחֹרַנִּֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: de
  text: Antworte mir, Jahwe, antworte mir, damit dieses Volk erkennt, dass du, Jahwe, Gott bist[a] und dass du ihr Herz[b] zurückgewandt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du, Jahwe, der Gott bist“.'
    reason: Der Artikel in הָאֱלֹהִים kann ausdrücklich bestimmt wiedergegeben werden; im deutschen Haupttext ist „Gott bist“ idiomatischer.
  - marker: b
    text: 'Wörtlich: „ihr Herz“ im Singular; gemeint ist das Volk als Ganzes. Möglich ist auch: „ihre Herzen“.'
    reason: Die Fußnote erklärt die kollektive Singularform des Hebräischen.
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Antworte mir
  rationale: Das Verb ענה bezeichnet hier die erbetene göttliche Antwort, die sich im unmittelbaren Zusammenhang durch eine Tat erweisen soll. Die Wiederholung wird zur Betonung beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: וְיֵדְעוּ
  choice: damit … erkennt
  rationale: Das mit וְ eingeleitete Imperfekt drückt hier am natürlichsten den Zweck beziehungsweise das beabsichtigte Ergebnis der Bitte aus.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: עם ist ein kollektiver Singular; „dieses Volk“ ist im Deutschen natürlich und bleibt der hebräischen Form nahe.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: dass du, Jahwe, Gott bist
  rationale: Die Formulierung identifiziert Jahwe im Gegensatz zu Baal als Gott. Das Deutsche kommt hier idiomatisch ohne Artikel aus; die bestimmtere Wiedergabe wird in einer Fußnote genannt.
- source_word: הֲסִבֹּתָ
  choice: zurückgewandt hast
  rationale: Der Hifil von סבב bezeichnet verursachendes Wenden; das Perfekt wird als vollzogene Handlung wiedergegeben. „Zurückgewandt“ wahrt die göttliche Urheberschaft, ohne ein im Hebräischen nicht genanntes Ziel hinzuzufügen.
- source_word: אֶת־לִבָּם
  choice: ihr Herz
  rationale: Der hebräische Singular mit pluralischem Suffix ist eine kollektive Ausdrucksweise für das Volk als Ganzes und wird formal bewahrt.
- source_word: אֲחֹרַנִּית
  choice: zurück
  rationale: Das Adverb bezeichnet eine Rückwendung. Das Ziel der Wendung bleibt, wie im hebräischen Text, unausgesprochen.
theological_decisions:
- issue: Göttliches Handeln bei der Umkehr des Volkes
  choice: dass du ihr Herz zurückgewandt hast
  alternative: dass du ihr Herz wieder zurückwendest
  rationale: Die gewählte Fassung bewahrt die starke Aussage über Gottes verursachendes Handeln und gibt das hebräische Perfekt als vollzogen wieder. Die Alternative kann den im Gebetszusammenhang beabsichtigten beziehungsweise sich gerade erweisenden Vorgang hervorheben; keine der Fassungen soll zu einem umfassenderen Lehrsystem ausgebaut werden.
- issue: Unausgesprochenes Ziel der Rückwendung
  choice: zurückgewandt
  alternative: zu dir zurückgewandt
  rationale: Obwohl der Zusammenhang eine Rückkehr zu Jahwe nahelegt, nennt der hebräische Satz das Ziel nicht ausdrücklich. Die Übersetzung ergänzt daher „zu dir“ nicht und erhält die knappe Spannung des Originals.
- issue: Bestimmtheit von הָאֱלֹהִים
  choice: Gott
  alternative: der Gott
  rationale: Der Artikel kann die ausschließliche Identifikation Jahwes als des wahren Gottes unterstreichen. Im heutigen Deutsch ist „Gott“ in dieser Aussage natürlicher; „der Gott“ wird als formnähere Alternative dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Gebetsanrede. Die eindringliche Wiederholung „Antworte mir“ bleibt erhalten. „Erkennt“ gibt das im Kontext gemeinte anerkennende Wissen etwas prägnanter wieder als „weiß“, ohne zusätzliche Lehraussagen einzutragen.
