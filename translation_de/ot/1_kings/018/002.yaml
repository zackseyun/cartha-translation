  text: וַ/יֵּ֨לֶךְ֙ אֵֽלִיָּ֔הוּ לְ/הֵרָא֖וֹת אֶל אַחְאָ֑ב וְ/הָ/רָעָ֖ב חָזָ֥ק בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: de
  text: Da ging Elia hin, um sich Ahab zu zeigen.[a] Die Hungersnot aber war in Samaria schwer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um vor Ahab zu erscheinen“ beziehungsweise „um sich Ahab zu stellen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Hungersnot aber war in Samaria heftig.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging ... hin
  rationale: Das Waw-Consecutivum führt die Erzählung als Folge des vorangehenden Auftrags weiter. „Da“ gibt diesen narrativen Anschluss im modernen Deutschen natürlich wieder.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: um sich Ahab zu zeigen
  rationale: Der Nifal-Infinitiv von ראה bezeichnet hier das Sich-Zeigen beziehungsweise Erscheinen. Die Formulierung bewahrt die reflexive Nuance und bleibt verständlich.
- source_word: וְהָרָעָב
  choice: Die Hungersnot aber
  rationale: Das Waw eröffnet hier einen begleitenden Hintergrundsatz. „Aber“ markiert den Umstand und zugleich die Spannung zwischen Elias Gang und der fortdauernden Not.
- source_word: חָזָק
  choice: war ... schwer
  rationale: חָזָק bezeichnet bei einer Hungersnot deren große Stärke oder Heftigkeit. „Schwer“ ist im Deutschen idiomatisch und würdevoll.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition ב bezeichnet den Ort. „Samaria“ kann hier die Stadt beziehungsweise ihr Gebiet meinen; die Übersetzung lässt diese mögliche Weite offen.
theological_decisions: []
