base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: de
  text: '„Ruft den Namen eures Gottes[a] an, und ich werde den Namen Jahwes anrufen. Der Gott, der durch Feuer antwortet, der ist Gott!“ Da antwortete das ganze Volk und sagte: „Der Vorschlag ist gut.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurer Götter“. Das hebräische Wort kann hier als Mehrzahl oder als Bezeichnung einer einzelnen Gottheit verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Das Wort ist gut“; ebenso möglich: „Die Sache ist gut“. Das hebräische דָּבָר kann „Wort“, „Sache“ oder „Vorschlag“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: Ruft den Namen … an
  rationale: קרא mit בְּשֵׁם bezeichnet hier das kultische Anrufen einer Gottheit. Die deutsche Wendung „den Namen … anrufen“ gibt den hebräischen Ausdruck natürlich und zugleich eng wieder.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Obwohl die Form morphologisch plural sein kann, weist der unmittelbare Kontext auf die eine von den Baalspropheten angerufene Gottheit. Die mögliche Mehrzahl bleibt in einer Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Umschrift.
- source_word: יַעֲנֶה בָאֵשׁ
  choice: durch Feuer antwortet
  rationale: 'בְּ wird instrumental verstanden: Das Feuer ist das sichtbare Mittel bzw. Zeichen der Antwort. „Mit Feuer“ wäre ebenfalls möglich.'
- source_word: הוּא הָאֱלֹהִים
  choice: der ist Gott
  rationale: Das betonte Pronomen הוּא wird durch das wiederaufnehmende „der“ bewahrt; die Aussage identifiziert den antwortenden Gott als den wahren Gott.
- source_word: וַיַּעַן … וַיֹּאמְרוּ
  choice: Da antwortete … und sagte
  rationale: Die beiden hebräischen Erzählverben werden formal bewahrt, auch wenn im Deutschen „antwortete“ allein genügen könnte. Das kollektive Singularverb bei „das ganze Volk“ ist idiomatisch.
- source_word: טוֹב הַדָּבָר
  choice: Der Vorschlag ist gut
  rationale: דָּבָר kann „Wort“, „Sache“ oder im Kontext „Vorschlag“ bedeuten. Hier stimmt das Volk dem von Elia vorgeschlagenen Verfahren zu; „Vorschlag“ ist daher klares, natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Wiedergabe als Eigenname wahrt den Gegensatz zwischen Jahwe und der von den Baalspropheten angerufenen Gottheit.
- issue: Numerus von אֱלֹהֵיכֶם
  choice: eures Gottes
  alternative: eurer Götter
  rationale: Die Form lässt grammatisch beide Deutungen zu. Der Wettstreit ist im Kontext jedoch zwischen Jahwe und Baal als jeweils einer Gottheit gestaltet; die echte Mehrdeutigkeit wird durch die Fußnote erhalten.
- issue: Bestimmtheit und Aussagekraft von הָאֱלֹהִים … הוּא הָאֱלֹהִים
  choice: Der Gott, der …, der ist Gott
  alternative: Die Gottheit, die …, sie ist der wahre Gott
  rationale: Die Übersetzung bewahrt die knappe Identifikationsaussage, ohne „wahr“ ergänzend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich. „Jahwe“ gibt den Gottesnamen als Eigennamen wieder; das betonte „der ist Gott“ bildet die hebräische Hervorhebung ab.
