  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: de
  text: Als Isebel die Propheten Jahwes ausrottete[a], nahm Obadja hundert Propheten und versteckte sie, je fünfzig Mann in einer Höhle[b], und versorgte sie mit Brot und Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vernichtete“; wörtlicher: „abschnitt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „fünfzig Mann in der Höhle“. Gemeint sind wahrscheinlich Gruppen von je fünfzig, offenbar in getrennten Höhlen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Als … ausrottete
  rationale: Die Konstruktion aus וַיְהִי und Infinitivus constructus führt den zeitlichen Hintergrund ein. Das Hifil von כרת bedeutet wörtlich „abschneiden“, bezeichnet hier aber idiomatisch das gewaltsame Beseitigen beziehungsweise Töten.
- source_word: אִיזֶבֶל
  choice: Isebel
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: נְבִיאֵי יְהוָה
  choice: die Propheten Jahwes
  rationale: Die hebräische Status-constructus-Verbindung wird natürlich wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: עֹבַדְיָהוּ
  choice: Obadja
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Direkte Wiedergabe von לקח; im Zusammenhang bedeutet es, dass Obadja die Propheten in seine Obhut nahm, ohne dies im Haupttext auszudeuten.
- source_word: וַיַּחְבִּיאֵם
  choice: versteckte sie
  rationale: Das Hifil von חבא bezeichnet das Verbergen oder Verstecken; „versteckte“ ist hier klar und natürlich.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: je fünfzig Mann in einer Höhle
  rationale: 'Der Wortlaut ist knapp und im Singular formuliert. Im Kontext von hundert Propheten liegt eine distributive Aussage nahe: zwei Gruppen von je fünfzig, offenbar in verschiedenen Höhlen. Die Fußnote bewahrt den formalen Wortlaut und die verbleibende Unsicherheit.'
- source_word: וְכִלְכְּלָם
  choice: versorgte sie mit
  rationale: כלכל bezeichnet das Erhalten beziehungsweise Versorgen. Mit Brot und Wasser als folgenden Objekten ist „versorgte sie mit“ präzise und idiomatisch.
- source_word: לֶחֶם וָמָיִם
  choice: Brot und Wasser
  rationale: Die konkrete hebräische Wendung wird direkt beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den Gottesnamen im modernen Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am Hebräischen, wird aber natürlich formuliert. Die gewaltsame Bedeutung von כרת wird im Haupttext idiomatisch ausgedrückt; das hebräische Bild und die formale Mehrdeutigkeit der Höhlenangabe bleiben in den Fußnoten sichtbar.
