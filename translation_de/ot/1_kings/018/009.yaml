  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: de
  text: 'Da sagte er: »Welche Sünde habe ich begangen, dass du deinen Diener in die Hand Ahabs gibst, damit er mich zu Tode bringt[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit er mich tötet«.'
    reason: Lexikalische Alternative für לַהֲמִיתֵנִי; die kürzere Wiedergabe ist ebenfalls möglich.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Gibt das narrative Wayyiqtol in natürlichem modernem Deutsch wieder, ohne eine übermäßig starke zeitliche Folgerung einzutragen.
- source_word: מֶה חָטָאתִי
  choice: Welche Sünde habe ich begangen
  rationale: Bewahrt die moralisch-religiöse Bedeutung von חטא und gibt die hebräische Frage idiomatisch wieder; das wörtlichere »Was habe ich gesündigt?« wäre im heutigen Deutsch unnatürlich.
- source_word: כִּי
  choice: dass
  rationale: Leitet hier den beklagten Sachverhalt beziehungsweise die Folge ein und entspricht der natürlichen deutschen Konstruktion nach der Frage.
- source_word: אַתָּה נֹתֵן
  choice: du … gibst
  rationale: Bewahrt das ausdrücklich gesetzte, betonte Pronomen sowie die gegenwärtige beziehungsweise unmittelbar bevorstehende Bedeutung des Partizips.
- source_word: עַבְדְּךָ
  choice: deinen Diener
  rationale: Ist in dieser ehrerbietigen Selbstbezeichnung kontextgemäßer als »deinen Sklaven«, ohne das Abhängigkeitsverhältnis zu beseitigen.
- source_word: בְּיַד אַחְאָב
  choice: in Ahabs Hand
  rationale: Erhält das hebräische Bild für die Auslieferung an Ahabs Macht und bleibt im Deutschen verständlich.
- source_word: לַהֲמִיתֵנִי
  choice: damit er mich zu Tode bringt
  rationale: Gibt den Hifil-Infinitiv von מות mit seiner kausativen, tödlichen Bedeutung wieder. Das Subjekt »er« wird aus dem unmittelbar genannten Ahab erschlossen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede »deinen Diener« wahrt den höfisch-ehrerbietigen Ton; das Bild »in Ahabs Hand« bleibt erhalten.
