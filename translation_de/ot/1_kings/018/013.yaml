  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: de
  text: Ist meinem Herrn nicht berichtet worden, was ich tat, als Isebel die Propheten Jahwes tötete? Ich versteckte hundert von Jahwes Propheten, jeweils fünfzig Männer in einer Höhle,[a] und versorgte sie mit Brot und Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fünfzig, fünfzig Mann in der Höhle“. Die Wiederholung von „fünfzig“ bezeichnet eine Verteilung in Gruppen zu je fünfzig. Möglich ist auch: „in zwei Gruppen zu je fünfzig in Höhlen“.'
    reason: Die hebräische distributive Formulierung mit dem Singular „Höhle“ lässt sich im Deutschen nicht zugleich ganz wörtlich und eindeutig wiedergeben.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Ist meinem Herrn nicht berichtet worden
  rationale: Die rhetorische Frage erwartet Zustimmung. „Meinem Herrn“ bewahrt die ehrerbietige Anrede an Elia, ohne einen göttlichen Titel anzudeuten.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: als Isebel … töten ließ
  rationale: Die Konstruktion bezeichnet den zeitlichen Umstand. Im Kontext veranlasst Isebel die Tötung; die kausative deutsche Wendung gibt dies natürlich wieder, ohne zu behaupten, sie habe eigenhändig getötet.
- source_word: נְבִיאֵי יְהוָה
  choice: die Propheten Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Genitivverbindung bildet den hebräischen Constructus transparent ab.
- source_word: וָאַחְבִּא מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: Ich versteckte hundert von den Propheten Jahwes
  rationale: 'מִן ist partitiv: Es waren hundert aus der Gruppe der Propheten. Das folgende אִישׁ gehört zugleich zur Zähl- und Verteilungsformulierung und wird im Deutschen bei „fünfzig Mann“ ausdrücklich sichtbar.'
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: jeweils fünfzig Mann in einer Höhle
  rationale: Die Wiederholung von „fünfzig“ drückt eine Verteilung in Gruppen aus. Der singularische Ausdruck „in der Höhle“ kann distributiv verstanden werden; idiomatisches Deutsch verwendet hier „jeweils … in einer Höhle“.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: und versorgte sie mit Brot und Wasser
  rationale: כלכל bezeichnet das Unterhalten bzw. Versorgen. Die konkreten Lebensmittel „Brot und Wasser“ bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch direkt und in einer verbreiteten wissenschaftlichen Form wieder.
- issue: Art der Beteiligung Isebels an der Tötung
  choice: töten ließ
  alternative: tötete; dabei war, … zu töten
  rationale: Der Infinitiv benennt Isebel grammatisch als Subjekt des Tötens, legt aber nicht fest, dass sie die Propheten eigenhändig tötete. „Töten ließ“ entspricht ihrer königlichen Verantwortlichkeit im Kontext und vermeidet diese unnötige Implikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und Obadjas respektvolle Anrede bleiben erhalten. Der Gedankenstrich der englischen Beratungsschicht wurde durch einen Fragesatz mit anschließendem erläuterndem Satz ersetzt, weil dies im Deutschen klar und natürlich klingt.
