lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Da riefen sie
  rationale: קרא bezeichnet hier das laute Anrufen Baals. „Riefen“ ist im Deutschen natürlich und bewahrt den Zusammenhang des kultischen Anrufens.
- source_word: בְּקוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die konkrete hebräische Wendung wird verständlich und würdig wiedergegeben.
- source_word: וַיִּתְגֹּדְדוּ
  choice: ritzten sich
  rationale: Die reflexive Form bezeichnet eine kultische Selbstverletzung. „Ritzten sich“ ist klar, ohne die Stärke des Ausdrucks unnötig zu steigern.
- source_word: כְּמִשְׁפָּטָם
  choice: nach ihrem Brauch
  rationale: מִשְׁפָּט bezeichnet hier die für sie übliche oder festgelegte Ritualpraxis, nicht ein gerichtliches Urteil.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: mit Schwertern und Speeren
  rationale: Das ב markiert die Werkzeuge; die gebräuchlichen deutschen Bezeichnungen geben beide Waffen direkt wieder.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: bis das Blut an ihnen herabströmte
  rationale: Die Formulierung gibt das Ausströmen des Blutes und עֲלֵיהֶם idiomatisch wieder, ohne über das Hebräische hinaus „herausspritzen“ anzunehmen.
