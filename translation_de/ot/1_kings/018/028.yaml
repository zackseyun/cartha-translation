  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: de
  text: Da riefen sie mit lauter Stimme und schnitten sich[a] nach ihrem Brauch[b] mit Schwertern und Speeren, bis Blut an ihnen herabfloss.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ritzten sich“ oder „fügten sich Schnittwunden zu“. Das hebräische Wort bezeichnet hier rituelle Selbstverletzung.'
