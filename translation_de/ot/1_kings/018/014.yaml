base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: de
  text: 'Und nun sagst du: »Geh und sag deinem Herrn: ›Elija ist hier!‹« und er wird mich töten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt die fortführende Verbindung und den zeitlichen Übergang knapp und natürlich wieder.
- source_word: לַאדֹנֶיךָ
  choice: deinem Herrn
  rationale: אדון bezeichnet hier Ahabs Stellung als menschlicher Herr Obadjas; »Herrn« bewahrt den respektvollen Amtston.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Elija ist hier!
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf Elijas Anwesenheit; im natürlichen modernen Deutsch vermittelt die präsentische Aussage mit Ausrufezeichen diese deiktische Funktion.
- source_word: וַהֲרָגָנִי
  choice: Dann wird er mich töten
  rationale: Die waw-Verbindung bezeichnet hier die von Obadja erwartete Folge; die deutsche Zukunftsform gibt seine Befürchtung idiomatisch wieder.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in וַהֲרָגָנִי
  choice: »er« bezieht sich im Kontext auf Ahab, Obadjas Herrn
  alternative: Unbestimmt lassen oder auf Elija beziehen
  rationale: Der unmittelbare Kontext von 1 Könige 18,12–14 zeigt, dass Obadja fürchtet, Ahab werde ihn töten, wenn Elija nach der Meldung nicht aufzufinden ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte direkte Rede bleibt erhalten; »Elija« folgt der heute verbreiteten deutschen Namensform. Keine Fußnoten erforderlich.
