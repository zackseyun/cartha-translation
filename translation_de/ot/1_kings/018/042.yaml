  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: de
  text: Da ging Ahab hinauf, um zu essen und zu trinken. Elia aber stieg auf den Gipfel des Karmel[a], beugte sich zur Erde hinab[b] und legte sein Gesicht zwischen seine Knie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „auf die Höhe des Karmel“ oder „auf den Gipfel des Berges Karmel“. Im Hebräischen steht hier nur „der Karmel“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text beschreibt Elias Körperhaltung. Der Zusammenhang legt nahe, dass er betete, doch in diesem Vers wird das nicht ausdrücklich gesagt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: ging hinauf
  rationale: Das gewöhnliche Erzählverb עלה bezeichnet eine Aufwärtsbewegung; „ging hinauf“ ist im Deutschen natürlich und bewahrt diese Richtungsangabe.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: um zu essen und zu trinken
  rationale: Die Infinitive drücken hier den Zweck aus. Die deutsche Konstruktion mit „um zu“ gibt dies idiomatisch wieder.
- source_word: וְאֵלִיָּהוּ
  choice: Elia aber
  rationale: Die Konjunktion bedeutet formal „und“, doch die gegenübergestellten Handlungen Ahabs und Elias legen im Deutschen eine kontrastive Wiedergabe mit „aber“ nahe.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: stieg auf den Gipfel des Karmel
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und bezeichnet hier idiomatisch den Gipfel. „Stieg“ bringt die Aufwärtsbewegung prägnant zum Ausdruck.
- source_word: וַיִּגְהַר אַרְצָה
  choice: beugte sich bis zur Erde hinab
  rationale: Das seltene Verb גהר beschreibt ein tiefes Sichbeugen. Die Formulierung bleibt bei der körperlichen Haltung und deutet sie nicht ausdrücklich als Gebet.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: legte sein Gesicht zwischen seine Knie
  rationale: Die konkrete Beschreibung der Haltung wird direkt und verständlich wiedergegeben, ohne ihre Bedeutung auszudeuten.
theological_decisions:
- issue: Ob Elias Haltung im Haupttext ausdrücklich als Gebet bezeichnet werden soll
  choice: Nur die körperliche Haltung wiedergeben
  alternative: „Er beugte sich zum Gebet nieder“ oder „er betete mit dem Gesicht zwischen den Knien“
  rationale: Der weitere Zusammenhang legt Gebet nahe, doch der Vers selbst beschreibt lediglich Elias Körperhaltung. Die Übersetzung fügt daher „betete“ nicht hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Elia aber“ macht den Gegensatz zu Ahab sichtbar. Konkrete Körperbeschreibungen bleiben erhalten; eine ausdrückliche Gebetsdeutung wird nicht in den Haupttext aufgenommen.
