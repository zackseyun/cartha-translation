source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: de
  text: 'Beim siebten Mal sagte er: »Sieh, eine kleine Wolke, wie die Handfläche eines Mannes,[a] steigt aus dem Meer auf.« Da sagte Elia: »Geh hinauf und sag Ahab: ›Spann den Wagen an[b] und fahr hinunter, damit dich der Regen nicht aufhält.[c]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Hand eines Mannes“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, das Gespann vor den Wagen zu spannen und ihn zur Abfahrt bereitzumachen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „sonst hält dich der Regen zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: Beim siebten Mal
  rationale: Die Wendung führt das Ereignis beim siebten Gang des Dieners ein. „Mal“ macht den aus dem Zusammenhang erschlossenen Bezug im Deutschen natürlich deutlich.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel lenkt unmittelbar die Aufmerksamkeit auf die sichtbare Wolke; „Sieh“ ist knapp, würdig und gegenwärtig verständlich.
- source_word: עָב קְטַנָּה
  choice: eine kleine Wolke
  rationale: Die einfache Nominalfügung wird direkt und idiomatisch wiedergegeben.
- source_word: כְּכַף אִישׁ
  choice: wie die Handfläche eines Mannes
  rationale: כַּף bezeichnet hier die Hand beziehungsweise Handfläche. Die Formulierung bewahrt das konkrete Größenbild und den maskulinen Singular des Hebräischen.
- source_word: עֹלָה מִיָּם
  choice: steigt aus dem Meer auf
  rationale: Das Partizip bezeichnet einen gerade beobachteten Vorgang; „steigt … auf“ gibt dieses Bild natürlich wieder.
- source_word: עֲלֵה
  choice: Geh hinauf
  rationale: Der Imperativ enthält eine räumliche Richtungsangabe, die nicht zu einem bloßen „Geh“ eingeebnet wird.
- source_word: אֱסֹר
  choice: Spann den Wagen an
  rationale: אסר bedeutet grundsätzlich „binden, festmachen“ und bezeichnet hier idiomatisch das Anspannen des Gespanns beziehungsweise Wagens. Das im Hebräischen vorausgesetzte Objekt wird für verständliches Deutsch ergänzt.
- source_word: וָרֵד
  choice: und fahr hinunter
  rationale: Nach dem Anspannen ist die Fahrt mit dem Wagen gemeint. „Hinunter“ bewahrt die topografische Richtung vom Karmel.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: damit dich der Regen nicht aufhält
  rationale: עצר kann „zurückhalten, hindern, aufhalten“ bedeuten. Die Wiedergabe bewahrt die praktische Warnung, vor dem einsetzenden Regen aufzubrechen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Richtungsangaben „hinauf“ und „hinunter“ sowie das anschauliche Handflächenbild bleiben erhalten. „Elia“ wird zur eindeutigen Zuordnung des im Hebräischen impliziten Sprechers aus dem unmittelbaren Kontext ergänzt.
