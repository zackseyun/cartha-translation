  terminology: Die Namen Elia und Ahab entsprechen dem deutschen Standardgebrauch. „Handfläche eines Mannes“ bildet ככף איש präzise ab, ohne die Vergleichsrichtung unnötig zu interpretieren. „Den Wagen anspannen“ und die erläuternde Fußnote geben das kontextuelle Idiom von אסר sachgerecht wieder.
