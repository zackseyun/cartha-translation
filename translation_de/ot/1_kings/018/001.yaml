  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: de
  text: 'Nach langer Zeit kam im dritten Jahr das Wort Jahwes zu Elia: „Geh, zeige dich Ahab, und ich werde dem Land Regen geben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Regen auf die Oberfläche des Landes geben.“'
    reason: Die Fußnote dokumentiert die räumliche hebräische Wendung עַל־פְּנֵי הָאֲדָמָה, die im deutschen Haupttext idiomatisch wiedergegeben ist.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Nach langer Zeit
  rationale: Die hebräische Wendung bezeichnet idiomatisch einen längeren verstrichenen Zeitraum. Die deutsche Formulierung ist natürlich und bewahrt den zeitlichen Übergang.
- source_word: וּדְבַר יְהוָה הָיָה אֶל אֵלִיָּהוּ
  choice: kam das Wort Jahwes zu Elia
  rationale: Bewahrt die geläufige prophetische Offenbarungsformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: im dritten Jahr
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Zeitangabe; der Bezugspunkt wird im Vers nicht ausdrücklich genannt und daher nicht ergänzt.
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: Geh und zeige dich Ahab!
  rationale: Der Nifal-Imperativ von ראה fordert Elia auf, für Ahab sichtbar zu werden. „Zeige dich“ wahrt diese reflexive Bedeutung ohne unnötige Ausdeutung.
- source_word: וְאֶתְּנָה מָטָר עַל פְּנֵי הָאֲדָמָה
  choice: Dann werde ich Regen auf das Land geben
  rationale: „Geben“ bildet נתן genau ab und lässt den Regen als Gabe Gottes erscheinen. Das im Hebräischen idiomatische „auf der Oberfläche des Landes“ wird in natürlichem Deutsch zu „auf das Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen deutschen Bibelregister direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Elias Auftreten und der Regenankündigung
  choice: Dann werde ich Regen auf das Land geben
  alternative: und ich werde Regen auf das Land geben
  rationale: Das hebräische וְ kann hier den Fortgang beziehungsweise die Folge ausdrücken. „Dann“ macht den natürlichen Zusammenhang verständlich, ohne eine weitergehende Bedingung ausdrücklich einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar, während schwerfällige Hebraismen vermieden werden. Keine Fußnote ist nötig, da „auf das Land geben“ sowohl die Bedeutung als auch das Bild hinreichend wiedergibt.
