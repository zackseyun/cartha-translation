base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: de
  text: 'Da nahmen sie den Stier, den man ihnen gegeben hatte, bereiteten ihn zu und riefen vom Morgen bis zum Mittag den Namen des Baal an: »Baal, antworte uns!« Doch kein Laut war zu hören, und niemand antwortete. Dabei hinkten[a] sie um den Altar, der errichtet worden war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hüpften« beziehungsweise »tanzten«. Das hebräische Verb bezeichnet hier wahrscheinlich eine hinkende oder hüpfende rituelle Bewegung und könnte bewusst an dasselbe Verb in Vers 21 anknüpfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר אֲשֶׁר נָתַן לָהֶם
  choice: Da nahmen sie den Stier, den man ihnen gegeben hatte
  rationale: לקח bezeichnet hier schlicht das Nehmen; die unpersönliche deutsche Form bewahrt den Sinn der Relativklausel, ohne den im unmittelbaren Satz nicht genannten Geber eigens einzusetzen.
- source_word: וַיַּעֲשׂוּ
  choice: bereiteten ihn zu
  rationale: Das Objekt ist aus dem Zusammenhang zu ergänzen. Im Opferkontext bezeichnet עשה hier die Vorbereitung des Stieres; „opferten ihn“ würde den Ablauf vorwegnehmen.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: riefen … den Namen des Baal an
  rationale: Die kultische Wendung קרא בשם wird im Deutschen idiomatisch und zugleich quellennah mit „den Namen … anrufen“ wiedergegeben.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: vom Morgen bis zum Mittag
  rationale: Natürliche deutsche Wiedergabe der Zeitspanne.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Baal, antworte uns!
  rationale: Gibt den direkten Anruf und den Imperativ knapp und deutlich wieder.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: Doch kein Laut war zu hören, und niemand antwortete
  rationale: Bewahrt die zweifache Verneinung. „Laut“ ist im Deutschen in diesem Zusammenhang natürlicher als „Stimme“, ohne die völlige Reaktionslosigkeit abzuschwächen.
- source_word: וַיְפַסְּחוּ
  choice: hinkten
  rationale: Das Verb bezeichnet wahrscheinlich eine hinkende oder hüpfende rituelle Bewegung. „Hinkten“ wahrt zudem den möglichen Wortanklang an dasselbe Verbum in Vers 21.
- source_word: עַל הַמִּזְבֵּחַ
  choice: um den Altar
  rationale: עַל bezeichnet hier im Zusammenhang mit der rituellen Bewegung am wahrscheinlichsten eine Bewegung am beziehungsweise um den Altar, nicht auf seiner Oberfläche.
- source_word: אֲשֶׁר עָשָׂה
  choice: der errichtet worden war
  rationale: Das Hebräische hat formal ein maskulines Singularverb ohne ausdrücklich genannten Handelnden. Die Passivform vermeidet eine unsichere Identifizierung des Subjekts und passt idiomatisch zum Errichten eines Altars.
theological_decisions:
- issue: Anrufung Baals
  choice: den Namen des Baal anrufen
  alternative: Baal anrufen
  rationale: Die biblische Anrufungsformel bleibt erkennbar, ohne der Anrufung Legitimität zuzuschreiben; Baals Ohnmacht wird durch den Erzählverlauf selbst gezeigt.
- issue: Rituelle Bewegung der Baalspropheten
  choice: hinkten um den Altar
  alternative: tanzten beziehungsweise hüpften um den Altar
  rationale: „Hinkten“ bewahrt die ungewöhnliche Bildlichkeit und den möglichen literarischen Rückbezug auf Vers 21, ohne die nicht völlig sichere Art der Bewegung im Haupttext weiter festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; die Wiederholung der hebräischen Verneinung wird in natürlicher deutscher Syntax erhalten.
