  terminology: „Diener“ ist im Kontext eine angemessene, nicht überpräzisierende Wiedergabe von נַעֲרוֹ. Die alternative Fußnote mit „jungen Mann“ und „Begleiter“ erhält die lexikalische Spannweite. Es sind keine theologischen Fachbegriffe betroffen.
