  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen hebräischen Ausdrücke zutreffend wieder: Elia spricht seinen untergeordneten נער an, fordert ihn zum Hinaufgehen und Blick Richtung Meer auf, erhält die Antwort, dass nichts zu sehen ist, und gebietet eine siebenfache Wiederholung. Die Fußnote b legt jedoch mit „insgesamt siebenmal“ eine Zählweise fest, die der knappe hebräische Imperativ שׁוּב שֶׁבַע פְּעָמִים nicht ausdrücklich erläutert.'
