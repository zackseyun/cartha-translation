  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: de
  text: 'Dann sagte er zu seinem Diener[a]: »Geh bitte hinauf und schau zum Meer hin.« Da ging er hinauf, schaute und sagte: »Da ist nichts.« Er sagte: »Geh wieder hin – siebenmal.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinem jungen Mann« oder »seinem Begleiter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: seinem Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Im Kontext führt die Person Elias Auftrag aus; »Diener« gibt diese Funktion natürlich wieder, ohne ihr Alter festzulegen.
- source_word: עֲלֵה נָא
  choice: Geh bitte hinauf
  rationale: Der Imperativ עֲלֵה bezeichnet die Bewegung nach oben; נָא mildert oder unterstreicht die Aufforderung. »Geh bitte hinauf« bewahrt beides.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: schau zum Meer hin
  rationale: הַבֵּט bedeutet »schau/blicke«, während דֶּרֶךְ יָם die Blickrichtung zum Meer angibt. Die Formulierung ist idiomatisch und quellennah.
- source_word: אֵין מְאוּמָה
  choice: Da ist nichts
  rationale: Die Wendung verneint, dass irgendetwas zu sehen ist. »Da ist nichts« klingt in der direkten Rede natürlich und knapp.
- source_word: שֻׁב
  choice: Geh wieder hin
  rationale: שׁוּב bedeutet grundsätzlich »zurückkehren/umkehren«. Hier fordert Elia dazu auf, den gerade ausgeführten Gang samt Ausschau zu wiederholen; »Geh wieder hin« macht diesen Kontext deutlich.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Die unmittelbare Entsprechung bezeichnet die siebenfache Wiederholung des Auftrags.
