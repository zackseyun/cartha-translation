base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: de
  text: Nach kurzer Zeit[a] verdunkelte sich der Himmel; Wolken zogen auf und Wind kam auf, und ein heftiger Regen setzte ein. Ahab bestieg den Wagen[b] und fuhr nach Jesreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und es geschah bis hierhin und bis hierhin«; eine hebräische Redewendung für eine kurze Zwischenzeit.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb nennt den Wagen nicht ausdrücklich; er ergibt sich aus dem Zusammenhang.
    reason: implicit_object
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Nach kurzer Zeit
  rationale: Die hebräische Wendung bezeichnet eine kurze verstrichene Zeit. Die deutsche Formulierung gibt den zeitlichen Sinn natürlich wieder, ohne die wörtliche, im Deutschen unverständliche Struktur nachzubilden.
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: verdunkelte sich der Himmel
  rationale: Im Wetterzusammenhang bezeichnet שׁמים den sichtbaren Himmel; das Verb beschreibt sein Dunkelwerden beziehungsweise seine düstere Färbung.
- source_word: עָבִים וְרוּחַ
  choice: durch Wolken und Wind
  rationale: Die Präposition ist im Hebräischen nicht ausdrücklich gesetzt; der Zusammenhang lässt Wolken und Wind als Ursache oder Begleiterscheinung der Verdunkelung verstehen. »Durch« ergibt im Deutschen einen klaren, natürlichen Satz.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: ein heftiger Regen setzte ein
  rationale: Wörtlich steht »es entstand/war ein großer Regen«. »Heftiger Regen« entspricht dem üblichen deutschen Ausdruck für starken Niederschlag; »setzte ein« bildet den Ereignisbeginn ab.
- source_word: וַיִּרְכַּב
  choice: bestieg den Wagen
  rationale: Das Verb kann »aufsteigen, besteigen, fahren« bedeuten. Der Wagen ist im unmittelbaren Kontext vorausgesetzt und wird für heutige Leser ausdrücklich genannt.
- source_word: יִזְרְעֶאלָה
  choice: nach Jesreel
  rationale: Das angehängte Richtungszeichen -ה bezeichnet die Bewegung auf Jesreel zu; im Deutschen wird dies mit »nach« wiedergegeben.
