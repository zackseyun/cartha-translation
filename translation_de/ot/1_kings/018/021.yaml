source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: de
  text: 'Da trat Elija vor das ganze Volk und sagte: »Wie lange wollt ihr noch auf beiden Seiten hinken[a]? Wenn Jahwe Gott ist, dann folgt ihm; wenn aber Baal Gott ist, dann folgt ihm!« Doch das Volk antwortete ihm kein Wort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »auf den beiden Verzweigungen (oder: Seiten) hinken«. Das ungewöhnliche hebräische Bild bezeichnet eine zwischen zwei Loyalitäten geteilte Haltung; sinngemäß: »zwischen zwei Möglichkeiten schwanken«.'
    reason: Die konkrete Metapher und die Bedeutungsbreite von סְעִפִּים lassen sich im Haupttext nicht zugleich vollständig und natürlich abbilden.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Da trat Elija vor
  rationale: נגשׁ bezeichnet das Herantreten. »Trat … vor« gibt Elijas körperliche und konfrontative Annäherung an die Versammlung natürlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die kollektive Wendung wird umfassend und im Deutschen idiomatisch wiedergegeben.
- source_word: עַד מָתַי
  choice: Wie lange … noch
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Herausforderung; »noch« unterstreicht den im Hebräischen angelegten Vorwurf.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: auf beiden Seiten hinken
  rationale: פסח bewahrt das konkrete Bild des Hinkens. סעפים kann Verzweigungen, Gabelungen oder Seiten bezeichnen; »auf beiden Seiten« erhält die räumliche Metapher und lässt zugleich die geteilte Loyalität erkennen, ohne sie abstrakt als »Meinungen« aufzulösen.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Wenn Jahwe Gott ist
  rationale: Die Prädikatskonstruktion wird natürlich wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: לְכוּ אַחֲרָיו
  choice: dann folgt ihm
  rationale: Die hebräische Wendung »hinter jemandem hergehen« bezeichnet hier Gefolgschaft und Loyalität; »folgt ihm« ist klar und idiomatisch.
- source_word: הַבַּעַל
  choice: der Baal
  rationale: Der hebräische Artikel wird erhalten. Im Deutschen ist »der Baal« möglich und hebt zugleich die Bezeichnung dieser Gottheit hervor.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Doch das Volk antwortete ihm kein Wort
  rationale: Die Formulierung bewahrt die betonte völlige Stille; »Doch« gibt den kontextuellen Gegensatz wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bild der geteilten Loyalität in פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: das konkrete Bild des Hinkens auf zwei Seiten bewahren
  alternative: zwischen zwei Meinungen schwanken
  rationale: Die abstrakte Deutung als Unentschlossenheit ist sachlich naheliegend, aber der hebräische Wortlaut formuliert ein auffälliges Bewegungsbild. Die Übersetzung bewahrt dieses Bild; die Fußnote nennt die lexikalische Spannweite.
- issue: Elliptischer zweiter Bedingungssatz וְאִם הַבַּעַל
  choice: wenn aber der Baal Gott ist
  alternative: wenn aber der Baal
  rationale: »Gott ist« wird zur natürlichen deutschen Verständlichkeit aus dem parallelen ersten Satz ergänzt, ohne dessen Aussage inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und verständlich; die ungewöhnliche hebräische Metapher wird im Haupttext sichtbar gehalten und in der Fußnote erläutert.
