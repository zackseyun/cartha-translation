source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: de
  text: 'Da sagte Elia zu ihnen: »Ergreift die Propheten des Baal! Keiner von ihnen soll entkommen.« Da ergriffen sie sie. Elia führte sie zum Bach Kischon[a] hinab und schlachtete sie dort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Wadi Kischon« beziehungsweise »zum Kischon-Bachtal«. Das hebräische Wort נַחַל kann einen Bach, ein Bachtal oder ein zeitweise trockenes Flussbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  choice: Ergreift / sie ergriffen sie
  rationale: תפשׂ bezeichnet hier das gewaltsame Ergreifen oder Festnehmen. Die Wiederholung desselben deutschen Verbs bewahrt den Zusammenhang zwischen Befehl und Ausführung.
- source_word: נְבִיאֵי הַבַּעַל
  choice: die Propheten des Baal
  rationale: Die hebräische Genitivverbindung wird direkt und im Deutschen natürlich wiedergegeben.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: Kein Einziger von ihnen darf entkommen
  rationale: 'אִישׁ steht distributiv: Nicht eine einzige Person aus der genannten Gruppe soll entkommen. Die deutsche Formulierung gibt diesen Sinn klar und idiomatisch wieder.'
- source_word: וַיּוֹרִדֵם
  choice: führte sie … hinab
  rationale: Der Hifil von ירד hat kausativen Sinn, also jemanden hinabbringen oder hinabführen. „Führte … hinab“ ist im erzählenden Zusammenhang natürlich, ohne die Art des Transports näher festzulegen.
- source_word: נַחַל קִישׁוֹן
  choice: zum Kischonbach
  rationale: נַחַל kann einen Bach, ein Bachtal oder ein zeitweise trockenes Flussbett bezeichnen. „Kischonbach“ ist eine verständliche geografische Wiedergabe; die Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: וַיִּשְׁחָטֵם
  choice: schlachtete sie … ab
  rationale: שׁחט bezeichnet ein Schlachten und ist deutlich stärker als das allgemeine „töten“. „Abschlachten“ bewahrt im Deutschen die schonungslose Gewaltsamkeit des Verbs.
theological_decisions:
- issue: Darstellung der Tötung der Baalspropheten
  choice: Die gewaltsame Handlung wird ohne Abschwächung als Abschlachten wiedergegeben, aber nicht ausdrücklich als göttlich angeordnet oder rechtmäßig bewertet.
  alternative: Mit „hinrichten“ oder „töten“ abschwächen beziehungsweise eine göttliche Beauftragung in den Vers hineintragen.
  rationale: Der hebräische Text berichtet die Ergreifung und Schlachtung unmittelbar. Eine Übersetzung soll weder die Gewalt verdecken noch eine theologische Beurteilung ergänzen, die dieser Vers nicht ausdrücklich ausspricht.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Der knappe Befehl und die harte Gewaltdarstellung des Hebräischen bleiben erhalten; altertümliche Wendungen und erklärende Zusätze im Haupttext werden vermieden.
