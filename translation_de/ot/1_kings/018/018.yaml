id: 1KI.18.18
reference: 1 Kings 18:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: de
  text: 'Er antwortete: „Nicht ich habe Israel ins Unglück gebracht, sondern du und dein Vaterhaus[a], weil ihr die Gebote Jahwes verlassen habt und du den Baalen[b] gefolgt bist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Haus deines Vaters“; gemeint ist Ahabs Familie beziehungsweise Dynastie.'
    reason: cultural_note
  - marker: b
    text: 'Hebräisch im Plural: „die Baale“; gemeint sind die verschiedenen örtlichen Erscheinungs- oder Kultformen des Baal.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: habe … ins Unglück gebracht
  rationale: Das Verb עכר bezeichnet hier das Verursachen von Unheil oder schwerer Not für die Gemeinschaft und greift Ahabs Vorwurf aus dem vorigen Vers auf.
- source_word: כִּי אִם
  choice: sondern
  rationale: Die Partikelverbindung stellt Elijas Zurückweisung dem eigentlichen Schuldigen gegenüber; im Deutschen drückt „sondern“ diesen Gegensatz nach einer Verneinung natürlich aus.
- source_word: וּבֵית אָבִיךָ
  choice: und dein Vaterhaus
  rationale: „Vaterhaus“ bewahrt die familiäre und dynastische Tragweite des hebräischen Ausdrucks, ohne ihn auf Ahabs unmittelbare Kernfamilie einzuengen.
- source_word: בַּעֲזָבְכֶם
  choice: weil ihr … verlassen habt
  rationale: Die Präposition mit dem Infinitiv gibt hier den Grund für das über Israel gebrachte Unglück an. Die deutsche Pluralform bewahrt den Wechsel zur Mehrzahl im Hebräischen und bezieht Ahab samt seinem Vaterhaus ein.
- source_word: מִצְוֺת יְהוָה
  choice: die Gebote Jahwes
  rationale: „Gebote“ erhält das rechtliche und bundesbezogene Gewicht von מִצְוֺת; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: und du … gefolgt bist
  rationale: Die Wendung bezeichnet Gefolgschaft und kultische Hinwendung. Das Singularpronomen „du“ bewahrt den Wechsel zurück zur Einzahl und richtet den Vorwurf unmittelbar an Ahab.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der hebräische Text verwendet ausdrücklich den Plural. „Den Baalen“ bewahrt ihn in natürlichem Deutsch und verweist auf die verschiedenen örtlichen Erscheinungs- oder Kultformen des Baal.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Pluralform הַבְּעָלִים
  choice: die Baale
  alternative: Baal
  rationale: Die Mehrzahl des hebräischen Textes bleibt erhalten, ohne die verschiedenen Baalskulte zu einer einzigen singularischen Bezeichnung zu vereinheitlichen.
- issue: Wechsel zwischen Mehrzahl und Einzahl
  choice: „ihr … verlassen habt“ und „du … gefolgt bist“
  alternative: beide Aussagen einheitlich in der Mehrzahl oder Einzahl
  rationale: 'Der grammatische Wechsel im Hebräischen wird bewahrt: Das Verlassen der Gebote betrifft Ahab und sein Vaterhaus, während die anschließende Anklage Ahab persönlich in der Einzahl trifft.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anklage ist knapp und direkt formuliert. „Vaterhaus“ erhält den familiär-dynastischen Sinn; der auffällige Wechsel von „ihr“ zu „du“ folgt bewusst dem Hebräischen.
