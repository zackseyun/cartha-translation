  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: de
  text: 'Als das ganze Volk das sah, fiel es auf sein Angesicht und sagte: »Jahwe, er ist Gott! Jahwe, er ist Gott!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Jahwe, er ist der Gott! Jahwe, er ist der Gott!« Der bestimmte Artikel hebt Jahwe gegenüber Baal als den wahren Gott hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: Als das ganze Volk das sah
  rationale: Das Verb bedeutet schlicht »sehen«. Das im Deutschen nötige Objekt »das« verweist auf das unmittelbar zuvor geschilderte Geschehen, ohne es näher auszudeuten.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: fielen sie auf ihr Angesicht
  rationale: Die konkrete hebräische Wendung für eine ehrfürchtige Niederwerfung bleibt erhalten; »Angesicht« gibt dem Satz einen würdigen biblischen Klang, ohne unverständlich zu sein.
- source_word: וַיֹּאמְרוּ
  choice: sagten
  rationale: Das gewöhnliche Redeverb bezeichnet für sich weder Lautstärke noch besondere Gefühlsintensität; daher wird nicht mit »riefen« erweitert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא
  choice: er ist
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck und wird deshalb nicht ausgelassen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Artikel kennzeichnet Jahwe im Gegensatz zu Baal als den wahren Gott. Im natürlichen Deutschen bringt das prädikative »Gott« diesen Sinn besser zum Ausdruck als das schwerfällige »der Gott«.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Jahwe, er ist Gott!
  rationale: Die Formulierung erhält das betonte Pronomen sowie die zweimalige, feierliche Bekenntnisformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bestimmter Artikel in הָאֱלֹהִים
  choice: Gott
  alternative: der Gott
  rationale: Der Artikel stellt Jahwe als den wahren Gott gegenüber Baal heraus. Natürliches Deutsch drückt diese Identifikation hier mit »Gott« aus; die im Hebräischen ausdrücklich bestimmte Form wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Wendung »auf ihr Angesicht fallen« bewahrt das Bild der Niederwerfung; die doppelte Bekenntnisformel und das betonte Pronomen bleiben erhalten.
