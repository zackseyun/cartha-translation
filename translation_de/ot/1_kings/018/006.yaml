base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: de
  text: 'Da teilten sie das Land unter sich auf, um es zu durchziehen: Ahab ging allein auf einem Weg, und Obadja ging allein auf einem anderen Weg.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wiederholt das Hebräische bei beiden Männern „auf einem Weg“: „Ahab ging allein auf einem Weg, und Obadja ging allein auf einem Weg.“ „Auf einem anderen Weg“ macht den im Zusammenhang erkennbaren Gegensatz im Deutschen deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: So teilten sie ... unter sich auf
  rationale: Das Piel von חלק bezeichnet aktives Teilen oder Aufteilen; לָהֶם hat hier im Zusammenhang wechselseitige Bedeutung. Die deutsche Wendung ist natürlich und bewahrt den Verteilungssinn.
- source_word: אֶת הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das zu durchsuchende Gebiet. „Land“ ist die übliche, ausreichend offene Wiedergabe.
- source_word: לַעֲבָר בָּהּ
  choice: um es zu durchziehen
  rationale: Der Infinitiv von עבר mit בָּהּ bezeichnet die Bewegung durch das Gebiet; „durchziehen“ gibt dies knapp und idiomatisch wieder.
- source_word: הָלַךְ
  choice: zog
  rationale: הלך bedeutet gehen oder sich fortbewegen. Bei der Beschreibung verschiedener Routen klingt „zog“ im Deutschen natürlich, ohne die Fortbewegungsart festzulegen.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: in die eine Richtung / in die andere
  rationale: דֶּרֶךְ kann Weg, Route oder Richtung bezeichnen. Im Deutschen macht das Gegensatzpaar „die eine ... die andere“ die beabsichtigte räumliche Aufteilung klar; die wörtliche Wiederholung wird in der Fußnote dokumentiert.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: לְבַדּוֹ bedeutet „allein“ oder „für sich“. „Allein“ bewahrt die zweimalige Betonung, dass beide getrennt voneinander zogen.
- source_word: עֹבַדְיָהוּ
  choice: Obadja
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch geläufigen Form wiedergegeben.
