  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: de
  text: Und wenn ich von dir weggehe[a], könnte der Geist Jahwes dich forttragen, ich weiß nicht, wohin. Wenn ich dann zu Ahab komme und es ihm melde und er dich nicht findet, wird er mich töten. Doch dein Diener fürchtet Jahwe seit seiner Jugend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Wind Jahwes könnte dich forttragen“. Das hebräische Wort רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten; hier liegt „Geist“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: Und wenn ich von dir weggehe
  rationale: Die Konstruktion leitet den befürchteten künftigen Fall ein; „wenn“ gibt den zeitlich-bedingten Sinn in natürlichem Deutsch wieder.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. Im Zusammenhang einer von Gott bewirkten Entrückung Elias liegt „Geist“ nahe; die echte lexikalische Alternative „Wind“ bleibt in der Fußnote erhalten.
- source_word: יִשָּׂאֲךָ
  choice: könnte dich forttragen
  rationale: נשׂא bezeichnet hier das Tragen beziehungsweise Wegtragen. Der Konjunktiv „könnte“ macht Obadjas Befürchtung kenntlich, ohne die göttliche Handlung als Gewissheit darzustellen.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: ich weiß nicht wohin
  rationale: Die schwerfällige wörtliche Formulierung bezeichnet ein unbekanntes Ziel; die deutsche Wendung ist idiomatisch und bewahrt den Sinn.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Wenn ich dann zu Ahab komme und es ihm melde
  rationale: הגיד bedeutet hier berichten oder melden. Das ergänzte „es ihm“ macht das im Zusammenhang eindeutige Berichtete natürlich verständlich.
- source_word: וַהֲרָגָנִי
  choice: wird er mich töten
  rationale: Die Form bezeichnet die von Obadja erwartete tödliche Folge; „töten“ ist direktes, modernes Standarddeutsch.
- source_word: וְעַבְדְּךָ
  choice: Dabei ... dein Diener
  rationale: עבד ist hier eine ehrerbietige Selbstbezeichnung gegenüber Elia. „Dabei“ gibt den spannungsvollen, appellativen Anschluss wieder, ohne einen ausdrücklich konzessiven Partikelwert vorzutäuschen.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: fürchtet ... Jahwe seit seiner Jugend
  rationale: Gottesfurcht bezeichnet ehrfürchtige, beständige Bindung. Die dritte Person entspricht der höflichen Selbstbezeichnung „dein Diener“; „seit seiner Jugend“ drückt den vom früheren Beginn bis zur Gegenwart reichenden Zeitraum aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Geist Jahwes
  alternative: der Wind Jahwes
  rationale: Der prophetische Zusammenhang und die Vorstellung, Elia werde durch göttliches Wirken an einen unbekannten Ort gebracht, sprechen für „Geist“. Da רוּחַ zugleich „Wind“ bedeuten kann, wird diese Möglichkeit nicht ausgeschlossen, sondern angemerkt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Aussagewert von יִשָּׂאֲךָ in Obadjas Befürchtung
  choice: könnte dich forttragen
  alternative: wird dich forttragen
  rationale: Der hebräische Imperfekt kann formal zukünftig verstanden werden; im Redezusammenhang äußert Obadja jedoch eine befürchtete Möglichkeit. Der deutsche Konjunktiv bildet diese pragmatische Spannung natürlich ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt unmittelbar und verständlich; Obadjas ehrerbietige Selbstbezeichnung wird beibehalten. Der Gottesname erscheint als „Jahwe“.
