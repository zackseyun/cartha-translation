  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: de
  text: 'Als Ahab Elia sah, sagte Ahab zu ihm: »Bist du es, der Israel ins Unglück bringt[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Israel in Schwierigkeiten bringt«; »der Unheil über Israel bringt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Als …
  rationale: Die narrative Fortführung wird zusammen mit der folgenden Zeitangabe in einem natürlichen deutschen Temporalsatz wiedergegeben; die altertümliche Formel »und es geschah« ist hier nicht nötig.
- source_word: כִּרְאוֹת
  choice: als … sah
  rationale: Der Infinitivus constructus mit כ bezeichnet hier den Zeitpunkt des folgenden Geschehens. »Als Ahab Elia sah« ist im Deutschen natürlich und sachlich genau.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das gewöhnliche hebräische Redeverb wird direkt und natürlich übersetzt.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition mit pronominalem Suffix bezeichnet den Adressaten der Rede.
- source_word: הַאַתָּה זֶה
  choice: Bist du es
  rationale: Die betonte, konfrontative Frage wird mit einer idiomatischen deutschen Wendung wiedergegeben.
- source_word: עֹכֵר
  choice: der … ins Unglück stürzt
  rationale: Das Partizip von עכר bezeichnet jemanden, der Not, Unheil oder Verderben verursacht. Die verbale Formulierung ist im modernen Deutsch natürlicher als ein ungebräuchliches Substantiv wie »Unheilstifter« und bewahrt den anklagenden Ton.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname des Volkes wird in der üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Ton und Tragweite von Ahabs Vorwurf
  choice: 'Direkter Vorwurf: »der Israel ins Unglück stürzt«'
  alternative: »der Israel in Schwierigkeiten bringt«; »der Unheil über Israel bringt«
  rationale: Ahab macht Elia für Israels Not verantwortlich. Die Übersetzung lässt diesen Vorwurf als Aussage Ahabs stehen, ohne ihn zu bestätigen oder die im Zusammenhang bestehende theologische Spannung vorweg aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Namens Ahab bleibt erhalten, da sie dem hebräischen Erzählstil entspricht und im Deutschen noch gut verständlich ist. Die direkte Rede klingt bewusst scharf und konfrontativ.
