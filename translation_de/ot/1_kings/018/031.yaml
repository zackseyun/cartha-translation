  terminology: »Elia«, »Jahwe«, »Stämme«, »Söhne Jakobs« und »Israel« entsprechen dem üblichen deutschen Bibelgebrauch und dem hebräischen Text. Die Fußnote zu »Kinder Jakobs« bietet eine sinnvolle idiomatische Alternative, ohne den Wortlaut zu verwischen.
