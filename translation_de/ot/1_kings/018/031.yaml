id: 1KI.18.31
reference: 1 Kings 18:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: de
  text: 'Und Elia nahm zwölf Steine, entsprechend der Zahl der Stämme der Söhne Jakobs[a], an den das Wort Jahwes ergangen war: »Israel soll dein Name sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »der Kinder Jakobs«. Wörtlich steht im Hebräischen »der Söhne Jakobs«.'
    reason: lexical_alternative
  - marker: b
    text: 'Dies erinnert an Gottes Umbenennung Jakobs in 1. Mose 32,29 und 35,10: »Israel soll dein Name sein.«'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die übliche und natürliche Wiedergabe des erzählenden wayyiqtol von לקח in diesem Zusammenhang.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: zwölf Steine
  rationale: Direkte und idiomatische Wiedergabe der Zahl mit dem Substantiv.
- source_word: כְּמִסְפַּר
  choice: entsprechend der Zahl
  rationale: Gibt den vergleichenden Sinn von כְּ zusammen mit מִסְפָּר präzise und in natürlichem Deutsch wieder.
- source_word: שִׁבְטֵי
  choice: Stämme
  rationale: Standardbezeichnung für שׁבט im genealogisch-nationalen Sinn.
- source_word: בְנֵי יַעֲקֹב
  choice: der Söhne Jakobs
  rationale: Bewahrt die konkrete familiäre Ausdrucksweise des Hebräischen; die mögliche weiter gefasste Bedeutung wird in einer Fußnote genannt.
- source_word: אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: an den das Wort Jahwes ergangen war
  rationale: Das singularische Relativpronomen bezieht sich am natürlichsten auf Jakob und verweist auf die frühere göttliche Namensgebung. Die Formulierung ist würdig und im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die hebräische Einleitungsformel wird im Deutschen natürlich durch den Übergang zur unmittelbar folgenden direkten Rede ausgedrückt.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel soll dein Name sein
  rationale: Bewahrt die Voranstellung und damit den Nachdruck auf »Israel«; »soll« passt zur feierlichen göttlichen Namensbestimmung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich; »Jahwe« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Relativsatzes אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: Bezug auf Jakob
  alternative: weiter gefasster Bezug auf die Söhne beziehungsweise Stämme Jakobs
  rationale: Das singularische אֵלָיו und das singularische שְׁמֶךָ weisen grammatisch auf Jakob als Bezugswort; zugleich verknüpft die Aussage die zwölf Stämme mit seiner von Gott verliehenen Identität als Israel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Der Satzbau folgt dem Hebräischen hinreichend eng, vermeidet aber unnötige Wörtlichkeit. Die Stellung von »Israel« am Anfang der direkten Rede bewahrt den Akzent des Ausgangstextes.
