  source_fidelity: 'Der Entwurf gibt den hebräischen Erzählverlauf und die zentralen Ausdrücke treffend wieder: Elia nimmt zwölf Steine in Entsprechung zur Zahl der Stämme der Söhne Jakobs. Der maskuline Singular in »an den« gibt das hebräische אֵלָיו sachgerecht wieder und macht deutlich, dass der Relativsatz Jakob betrifft. Die direkte Namenszusage ist vollständig und in ihrer feierlichen Modalität angemessen wiedergegeben.'
