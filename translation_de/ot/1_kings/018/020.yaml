  text: וַ/יִּשְׁלַ֥ח אַחְאָ֖ב בְּ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקְבֹּ֥ץ אֶת הַ/נְּבִיאִ֖ים אֶל הַ֥ר הַ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: de
  text: Da sandte Ahab zu allen Israeliten[a] und versammelte die Propheten auf dem Karmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu allen Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Das Verb bedeutet wörtlich „senden“. Die knappe Form wahrt, dass der hebräische Text weder eine Botschaft noch Boten ausdrücklich nennt.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: zu allen Israeliten
  rationale: Nach שׁלח kann בְּ die Adressaten bezeichnen. „Israeliten“ gibt die feste hebräische Bezeichnung בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich wieder; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: קבץ bezeichnet hier das Zusammenbringen einer Gruppe; „versammelte“ ist präzise und idiomatisch.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: נְבִיאִים ist die übliche Bezeichnung für Propheten; der Zusammenhang bestimmt die hier gemeinte Gruppe.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: auf dem Karmel
  rationale: Bei Bergen wird eine Bewegung zum Versammlungsort im Deutschen natürlich mit „auf“ ausgedrückt. „Karmel“ ist die etablierte geografische Bezeichnung für das Karmelgebirge beziehungsweise den Berg Karmel.
theological_decisions: []
translation_notes:
