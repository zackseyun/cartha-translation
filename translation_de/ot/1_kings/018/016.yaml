  text: וַ/יֵּ֧לֶךְ עֹבַדְיָ֛הוּ לִ/קְרַ֥את אַחְאָ֖ב וַ/יַּגֶּד ל֑/וֹ וַ/יֵּ֥לֶךְ אַחְאָ֖ב לִ/קְרַ֥את אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: de
  text: Da ging Obadja Ahab entgegen und berichtete ihm[a] davon. Darauf ging Ahab Elia entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »teilte es ihm mit«. Das hebräische Verb kann »mitteilen«, »berichten« oder »verkünden« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das Wayyiqtol von הלך führt die Erzählung mit der schlichten Bedeutung »gehen« fort; »ging« ist im Deutschen natürlich und fügt keine zusätzliche Nuance hinzu.
- source_word: עֹבַדְיָהוּ
  choice: Obadja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: Die Konstruktion bezeichnet eine Bewegung auf jemanden zu, um ihm zu begegnen. Zusammen mit »gehen« gibt »entgegengehen« beide Vorkommen knapp und idiomatisch wieder.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: וַיַּגֶּד לוֹ
  choice: berichtete ihm davon
  rationale: נגד im Hifil kann »mitteilen«, »berichten« oder »verkünden« bedeuten. Das ergänzte »davon« verweist natürlich auf den aus dem Kontext erschließbaren Sachverhalt, ohne dessen Inhalt ausdrücklich festzulegen.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: Darauf ging Ahab
  rationale: Das zweite Wayyiqtol setzt die zeitliche Handlungsfolge fort. »Darauf« macht diese Abfolge in natürlichem Deutsch deutlich.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions: []
