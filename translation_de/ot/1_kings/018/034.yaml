id: 1KI.18.34
reference: 1 Kings 18:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: de
  text: 'Dann sagte er: »Füllt vier Krüge[a] mit Wasser und gießt es über das Brandopfer und über das Holz.« Dann sagte er: »Tut es ein zweites Mal!« Und sie taten es ein zweites Mal. Dann sagte er: »Tut es ein drittes Mal!« Und sie taten es ein drittes Mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vier Wasserkrüge«; das hebräische Wort bezeichnet ein Gefäß, das unter anderem zum Tragen von Flüssigkeiten diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Das narrative Waw führt die Handlung weiter; »Dann sagte er« gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: מִלְאוּ
  choice: Füllt
  rationale: Der pluralische Imperativ von מלא fordert die Angesprochenen auf, die Gefäße zu füllen.
- source_word: אַרְבָּעָה כַדִּים
  choice: vier Krüge
  rationale: כַּד bezeichnet ein Gefäß zum Aufbewahren oder Tragen von Flüssigkeiten. »Krüge« ist verständlich, sachgerecht und legt die genaue Form nicht unnötig fest.
- source_word: מַיִם
  choice: Wasser
  rationale: Direkte Wiedergabe des geläufigen hebräischen Substantivs.
- source_word: וְיִצְקוּ
  choice: und gießt es
  rationale: Die Verbform setzt hier die an mehrere Personen gerichtete Aufforderung fort. Das Pronomen »es« nimmt das Wasser als Stoffbezeichnung auf.
- source_word: עַל הָעֹלָה
  choice: über das Brandopfer
  rationale: עֹלָה ist der übliche Opferbegriff für das vollständig verbrannte Opfer; »über« beschreibt das Ausgießen im Deutschen natürlich.
- source_word: וְעַל הָעֵצִים
  choice: und über das Holz
  rationale: עֵצִים bezeichnet hier das für das Opfer aufgeschichtete Holz.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: Tut es ein zweites Mal / und sie taten es ein zweites Mal
  rationale: Die ausdrückliche Zählung bewahrt die im Hebräischen angelegte Wiederholung und den parallelen Erzählrhythmus.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: Tut es ein drittes Mal / und sie taten es ein drittes Mal
  rationale: Die Form bezeichnet im Zusammenhang die dritte Durchführung; die parallele Wiedergabe erhält die Steigerung des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs עֹלָה
  choice: Brandopfer
  alternative: Ganzbrandopfer
  rationale: »Brandopfer« ist die etablierte und genaue deutsche Bezeichnung. »Ganzbrandopfer« verdeutlicht zwar die vollständige Verbrennung, würde den Text hier jedoch stärker erläutern als übersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Formulierungen bilden den betonten, stufenweisen Ablauf des hebräischen Textes nach; direkte Rede wird klar und natürlich gestaltet.
