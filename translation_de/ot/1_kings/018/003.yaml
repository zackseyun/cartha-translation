source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: de
  text: Ahab rief Obadja, der dem königlichen Haushalt vorstand.[a] Obadja aber fürchtete Jahwe sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der über dem Haus war“; gemeint ist ein hoher Beamter, der für den königlichen Haushalt oder den Palast verantwortlich war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: Ahab rief Obadja
  rationale: קרא mit אֶל bezeichnet hier Ahabs Ruf nach Obadja. Das schlichte „rief“ gibt den Vorgang natürlich wieder, ohne die stärkere Nuance von „vorladen“ oder „befehlen“ einzutragen.
- source_word: עֹבַדְיָהוּ
  choice: Obadja
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: der dem königlichen Haushalt vorstand
  rationale: Wörtlich steht hier „der über dem Haus war“. Im höfischen Zusammenhang bezeichnet die Wendung einen hohen Beamten, der für den königlichen Haushalt beziehungsweise Palast verantwortlich war.
- source_word: וְעֹבַדְיָהוּ
  choice: Obadja aber
  rationale: Die Konjunktion leitet eine Hintergrundangabe über Obadja ein. „Aber“ markiert im Deutschen zugleich den im Kontext bedeutsamen Gegensatz zwischen seiner Stellung am Hof Ahabs und seiner Gottesfurcht.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: fürchtete Jahwe
  rationale: Die Konstruktion beschreibt eine beständige Eigenschaft Obadjas. „Jahwe fürchten“ bewahrt sowohl den Wortlaut als auch die Bedeutung ehrfürchtiger Gottesverehrung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְאֹד
  choice: sehr
  rationale: Das Adverb verstärkt Obadjas Gottesfurcht; „sehr“ ist präzise, schlicht und im modernen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von ירא in Bezug auf Gott
  choice: fürchtete Jahwe
  alternative: verehrte Jahwe
  rationale: „Fürchtete“ erhält die genuine Spannung des hebräischen Begriffs zwischen Furcht, Ehrfurcht und treuer Gottesverehrung; „verehrte“ würde den Aspekt der Furcht abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Amtsbezeichnung wird verständlich formuliert, während die wörtliche hebräische Wendung und ihre mögliche institutionelle Reichweite in der Fußnote erhalten bleiben.
