  text: וְ/יַד יְהוָ֗ה הָֽיְתָה֙ אֶל אֵ֣לִיָּ֔הוּ וַ/יְשַׁנֵּ֖ס מָתְנָ֑י/ו וַ/יָּ֨רָץ֙ לִ/פְנֵ֣י אַחְאָ֔ב עַד בֹּאֲ/כָ֖ה יִזְרְעֶֽאלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: de
  text: Da lag die Hand Jahwes auf Elia[a]. Er raffte sein Gewand um die Hüften hoch[b] und lief vor Ahab her bis zum Eingang von Jesreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Da kam die Hand des HERRN über Elia.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er gürtete seine Lenden“; gemeint ist, dass er sein langes Gewand zum Laufen hochraffte und befestigte.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des göttlichen Eigennamens bewahrt den Namenscharakter des hebräischen Tetragramms.
- source_word: וְיַד יְהוָה הָיְתָה אֶל אֵלִיָּהוּ
  choice: Da lag die Hand Jahwes auf Elia
  rationale: Die Formulierung bleibt nahe beim hebräischen Bild und bezeichnet göttliches Wirken oder göttliche Befähigung, ohne deren genaue Art festzulegen. „Lag“ gibt הָיְתָה („war“) natürlicher wieder als das traditionelle „kam“.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: Er raffte sein Gewand um die Hüften hoch
  rationale: Das hebräische Idiom beschreibt das Hochnehmen und Befestigen eines langen Gewandes, damit man ungehindert laufen kann. Die Wiedergabe macht die gemeinte Handlung heutigen Lesern verständlich; die wörtliche Körperteilmetapher wird in der Fußnote bewahrt.
- source_word: וַיָּרָץ לִפְנֵי אַחְאָב
  choice: und lief vor Ahab her
  rationale: Die Wendung gibt die räumliche Bedeutung von לִפְנֵי direkt und idiomatisch wieder, ohne zusätzlich eine zeremonielle Funktion Elias anzunehmen.
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: bis zum Eingang von Jesreel
  rationale: Die Konstruktion bezeichnet hier den Zugang beziehungsweise die Stelle, an der man nach Jesreel hineinkommt. Diese Wiedergabe ist im Deutschen natürlich und wahrt das Ziel der Bewegung.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Im Deutschen etablierte biblische Schreibweise des Ortsnamens.
theological_decisions:
- issue: Art der göttlichen Befähigung Elias
  choice: Das Bild von der auf Elia liegenden Hand Jahwes bleibt erhalten.
  alternative: Eine ausdrückliche Deutung als übernatürliche Kraft zum Laufen oder ausschließlich als prophetische Inspiration.
  rationale: Der hebräische Ausdruck kennzeichnet Jahwe als den Handelnden, legt aber nicht fest, ob körperliche Stärkung, prophetischer Antrieb oder beides gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anschauliche Gottesbild bleibt erhalten; das heute schwer verständliche Kleidungsidiom wird im Haupttext behutsam erschlossen und in der Fußnote wörtlich dokumentiert.
