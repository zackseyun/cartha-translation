base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: de
  text: 'Da sagte Elia zu Ahab: „Geh hinauf, iss und trink! Denn das Brausen des Regens ist zu hören.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort הֲמוֹן kann „Brausen“ oder „Getöse“, aber auch „Menge“ oder „Fülle“ bedeuten. Die Wendung kann daher sowohl das laute Herannahen des Regens als auch seine große Menge hervorheben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter. „Da sagte“ ist im modernen deutschen Erzählstil natürlich und gibt die zeitliche Abfolge wieder.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: לְאַחְאָב
  choice: zu Ahab
  rationale: Die Präposition ל kennzeichnet hier den Adressaten der Rede; „zu Ahab“ ist die übliche deutsche Wiedergabe.
- source_word: עֲלֵה
  choice: Geh hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Geh hinauf“ bewahrt diesen räumlichen Sinn.
- source_word: אֱכֹל וּשְׁתֵה
  choice: iss und trink
  rationale: Die beiden Imperative werden unmittelbar und ohne erklärende Erweiterung wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für Elias Aufforderung ein.
- source_word: קוֹל
  choice: ist zu hören
  rationale: קוֹל bezeichnet einen Klang, ein Geräusch oder eine Stimme. Die deutsche Existenzformulierung „ist zu hören“ gibt den Sinn der knappen hebräischen Nominalwendung natürlich wieder.
- source_word: הֲמוֹן
  choice: Brausen
  rationale: הֲמוֹן kann ein Getöse, Brausen, eine Menge oder Fülle bezeichnen. „Brausen“ bewahrt hier das anschauliche akustische Bild und vermeidet eine vorschnelle Festlegung auf bloße Regenmenge.
- source_word: הַגָּשֶׁם
  choice: des Regens
  rationale: גֶּשֶׁם bedeutet „Regen“; der bestimmte Artikel wird in der Genitivverbindung natürlich wiedergegeben.
theological_decisions:
- issue: Ob Elia den Regen bereits tatsächlich hört oder sein Kommen prophetisch ankündigt
  choice: Die unpersönliche Formulierung „ist zu hören“ bleibt nahe an der knappen hebräischen Aussage.
  alternative: „Ich höre schon …“ oder „Ein starker Regen kommt.“
  rationale: Im Hebräischen steht weder ausdrücklich „ich“ noch ein Verb des Kommens. Die Übersetzung soll die Spannung zwischen Wahrnehmung und prophetischer Gewissheit nicht auflösen.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die knappe Befehlsfolge bleibt erhalten; das markante akustische Bild des Hebräischen wird mit „Brausen“ bewahrt.
