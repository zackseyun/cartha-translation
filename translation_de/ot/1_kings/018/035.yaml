  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: de
  text: Das Wasser floss rings um den Altar[a] und füllte auch den Graben[b] mit Wasser.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ging rings um den Altar“. Das hebräische Verb beschreibt hier die Bewegung des Wassers.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Rinne“ beziehungsweise „den Kanal“.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Verbform steht hier im männlichen Singular, obwohl „Wasser“ zuvor als Subjekt genannt wird. Der Bezug der Singularform wird unterschiedlich verstanden.
    reason: source_clarity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: floss
  rationale: Das Verb bedeutet wörtlich „ging“, beschreibt hier mit Wasser als Subjekt jedoch dessen Bewegung. „Floss“ ist im Deutschen natürlich und gibt den Vorgang präzise wieder.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Die hebräische Pluralform wird im Deutschen idiomatisch als singularisches Stoffwort wiedergegeben.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: rings um den Altar
  rationale: „Rings um“ gibt die räumliche Bedeutung von סָבִיב prägnant wieder und bezeichnet das Umgeben des Altars.
- source_word: וְגַם
  choice: und auch
  rationale: Bewahrt die hinzufügende und leicht hervorhebende Funktion der hebräischen Verbindung.
- source_word: אֶת־הַתְּעָלָה
  choice: den Graben
  rationale: תְּעָלָה bezeichnet hier den um den Altar angelegten Graben; je nach Auffassung sind auch „Rinne“ oder „Kanal“ möglich.
- source_word: מִלֵּא
  choice: füllte er
  rationale: Die maskuline Singularform hat ein unausgesprochenes menschliches Subjekt. Das Pronomen „er“ wird für einen natürlichen deutschen Satz ergänzt, ohne den möglichen Bezug übermäßig festzulegen.
- source_word: מָיִם
  choice: mit Wasser
  rationale: Die deutsche Fügung „mit Wasser füllen“ gibt die hebräische Konstruktion idiomatisch wieder.
