base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: de
  text: 'Als Obadja unterwegs war, da kam Elia ihm entgegen. Als er ihn erkannte, warf er sich mit dem Gesicht zur Erde nieder und sagte: »Bist du es, mein Herr Elia?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: plötzlich
  rationale: Kennzeichnet das unvermittelte Auftreten Elias und gibt die narrative Überraschung in natürlichem modernem Deutsch wieder.
- source_word: לִקְרָאתוֹ
  choice: kam ihm … entgegen
  rationale: Gibt die Bewegungsrichtung und die Begegnungsabsicht des hebräischen Ausdrucks präzise wieder.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: warf sich mit dem Gesicht zur Erde nieder
  rationale: Bewahrt die konkrete Körperhaltung und ihren Ausdruck tiefer Ehrerbietung.
- source_word: הַאַתָּה זֶה
  choice: Bist du es
  rationale: Natürliche deutsche Wiedergabe der erstaunten Identifikationsfrage.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Bewahrt die respektvolle Anrede; hier ist ein menschlicher Herr gemeint, nicht der Gottesname.
theological_decisions:
- issue: Art der Ehrerbietung vor Elia
  choice: Konkrete Niederwerfung ohne theologische Zusatzdeutung
  alternative: als Anbetung bezeichnen
  rationale: Der Text beschreibt die Körperhaltung, legt aber nicht ausdrücklich kultische Anbetung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Folge des Hebräischen bleibt erkennbar, wird jedoch idiomatisch geglättet; »plötzlich« vermittelt die Funktion von וְהִנֵּה besser als das heute markierte »siehe«.
