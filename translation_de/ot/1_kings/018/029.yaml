base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: de
  text: Als der Mittag vorüber war, prophezeiten sie weiter[a], bis das Speiseopfer dargebracht wurde[b]. Doch keine Stimme war zu hören, niemand antwortete, und niemand schenkte Beachtung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie gerieten in Raserei.“ Im Hebräischen steht das übliche Verb für prophetisches Reden oder Verhalten; hier beschreibt es das ekstatische Verhalten der Propheten Baals.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung kann auch als Zeitangabe verstanden werden: „bis zur Zeit des regelmäßigen Abendopfers“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כַּעֲבֹר הַצָּהֳרַיִם
  choice: Als der Mittag vorüber war
  rationale: Die Konstruktion führt die nächste Phase der Erzählung ein und bezeichnet den Zeitpunkt nach dem Mittag. Im Deutschen ist kein zusätzliches „Und es geschah“ nötig, um die hebräische Erzählfunktion natürlich wiederzugeben.
- source_word: וַיִּתְנַבְּאוּ
  choice: prophezeiten sie weiter
  rationale: Der Hitpael von נבא ist das übliche Verb für prophetisches Reden oder Verhalten. „Weiter“ gibt im Zusammenhang die anhaltende Tätigkeit wieder; die ekstatische beziehungsweise rasende Ausprägung wird als stärker deutende Alternative in der Fußnote genannt.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: bis das Speiseopfer dargebracht wurde
  rationale: Die Wendung bezeichnet wörtlich das Hinaufbringen beziehungsweise Darbringen der minchah. „Speiseopfer“ wahrt die konkrete Opferbezeichnung, ohne „Abend“ in den Haupttext einzutragen.
- source_word: וְאֵין קוֹל
  choice: keine Stimme war zu hören
  rationale: קוֹל kann „Stimme“ oder „Laut“ bedeuten. Im Kontext der erwarteten Antwort Baals passt „Stimme“; „war zu hören“ ergibt idiomatisches Deutsch.
- source_word: וְאֵין עֹנֶה
  choice: niemand antwortete
  rationale: Das Partizip bezeichnet das völlige Fehlen eines Antwortenden. Die finite deutsche Form gibt dies natürlich und prägnant wieder.
- source_word: וְאֵין קָשֶׁב
  choice: niemand achtete darauf
  rationale: קָשֶׁב bezeichnet Aufmerksamkeit oder Beachtung. Die personale Formulierung bringt zum Ausdruck, dass nicht einmal jemand zuhörte oder sich darum kümmerte.
theological_decisions:
- issue: Ekstatisches Verhalten der Baalspropheten
  choice: prophezeiten sie weiter
  alternative: sie gerieten weiter in Raserei
  rationale: Der hebräische Text verwendet das reguläre Verb für prophetisches Verhalten. Der Haupttext bewahrt diese lexikalische Verbindung und die erzählerische Ironie; die im Kontext mögliche, stärker wertende Wiedergabe wird in der Fußnote offengelegt.
- issue: Zeitliche Bedeutung des Speiseopfers
  choice: bis das Speiseopfer dargebracht wurde
  alternative: bis zur Zeit des regelmäßigen Abendopfers
  rationale: מִנְחָה bezeichnet hier ausdrücklich die Opfergabe, kann in einer Zeitangabe jedoch auf den Zeitpunkt des regelmäßigen Abendopfers verweisen. Der Haupttext vermeidet eine nicht ausdrücklich genannte Tageszeit, während die Fußnote die zeitliche Deutung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Verneinung am Schluss wird in natürlicher deutscher Syntax bewahrt und steigert die völlige Wirkungslosigkeit des Rufens.
