  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: de
  text: 'Ahab sagte zu Obadja: „Zieh durch das Land zu allen Wasserquellen und zu allen Bachtälern[a]. Vielleicht finden wir Gras und können Pferde und Maultiere am Leben erhalten, damit wir keinen Teil des Viehbestands aufgeben müssen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann ein Bachtal, ein Bachbett oder den darin fließenden Bach bezeichnen; im Dürrekontext sind besonders saisonale Wasserläufe oder ihre Betten im Blick.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „damit wir nicht vom Vieh abschneiden“. Gemeint ist vermutlich, dass der Tierbestand wegen Futtermangels verringert werden müsste; auf welche Weise, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: durch das Land
  rationale: Bei הלך kann ב die Bewegung durch ein Gebiet bezeichnen; im Zusammenhang einer landesweiten Suche ist „durch das Land“ natürlich und sachgerecht.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: Wasserquellen
  rationale: Die kompakte deutsche Zusammensetzung gibt die konkreten natürlichen Wasserstellen präzise wieder.
- source_word: הַנְּחָלִים
  choice: Bachtäler
  rationale: נחל kann sowohl ein Wasserbett beziehungsweise Tal als auch den darin fließenden Bach bezeichnen. „Bachtäler“ bewahrt im Dürrekontext den Gedanken an Wasserläufe, ohne ganzjährig fließende Bäche vorauszusetzen.
- source_word: אוּלַי נִמְצָא
  choice: Vielleicht finden wir
  rationale: Die Formulierung wahrt die Unsicherheit und die gemeinsame Absicht der ersten Person Plural.
- source_word: חָצִיר
  choice: Gras
  rationale: Gemeint ist als Tierfutter geeignete Vegetation; „Gras“ ist hier natürlich und behauptet nicht, es handle sich um bereits geschnittenes Heu.
- source_word: וּנְחַיֶּה
  choice: am Leben erhalten
  rationale: Der Hifil bezeichnet das Bewahren beziehungsweise Erhalten von Leben; die deutsche Wendung gibt den Zweck der Futtersuche klar wieder.
- source_word: סוּס וָפֶרֶד
  choice: Pferde und Maultiere
  rationale: Die hebräischen Kollektivsingulare werden im Deutschen idiomatisch als Gattungsplurale wiedergegeben.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: sodass wir keinen Teil des Viehbestands aussondern müssen
  rationale: „Aussondern“ lässt das Bild von כרת („abschneiden, aus dem Bestand entfernen“) erkennen, ohne festzulegen, ob die Tiere geschlachtet, verkauft oder anderweitig aufgegeben würden. „Keinen Teil“ gibt das partitive מן wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Obadja“ folgt der im Deutschen gebräuchlichen biblischen Namensform. Die direkte Rede ist flüssig formuliert; die Mehrdeutigkeit von נחל und die bildhafte, nicht völlig eindeutige Aussage über die Verringerung des Viehbestands werden in den Fußnoten offengehalten.
