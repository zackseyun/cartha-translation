source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: de
  text: 'Als das Speiseopfer dargebracht wurde, trat der Prophet Elija heran und sagte: »Jahwe, Gott Abrahams, Isaaks und Israels[a], heute soll offenbar werden, dass du Gott in Israel bist, dass ich dein Diener bin und dass ich all dies auf dein Wort hin[b] getan habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier ausdrücklich „Israel“, nicht „Jakob“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch dein Wort“ beziehungsweise „nach deinem Wort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: Als das Speiseopfer dargebracht wurde
  rationale: Die Infinitivverbindung mit עלה bezeichnet hier das Darbringen des מִנְחָה. „Speiseopfer“ ist im Deutschen die verständliche und sachlich präzise Bezeichnung; eine ausdrückliche Ergänzung „Abend-“ steht nicht im hebräischen Text.
- source_word: וַיִּגַּשׁ
  choice: trat … heran
  rationale: Gibt die konkrete Annäherung und zugleich den feierlich-kultischen Ton von נגשׁ natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen üblichen Form transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Gott Abrahams, Isaaks und Israels
  rationale: Der masoretische Text hat ausdrücklich „Israel“, nicht „Jakob“. Die Genitivform ist idiomatisches, würdiges Deutsch.
- source_word: הַיּוֹם יִוָּדַע
  choice: heute soll offenbar werden
  rationale: Der Nifal-Imperfekt hat im Gebet auffordernd-wünschenden Sinn. „Soll offenbar werden“ bewahrt sowohl den Gebetscharakter als auch den Gedanken öffentlicher Erkenntnis.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Gott in Israel
  rationale: Die Wiedergabe mit „in“ folgt der naheliegenden Bedeutung der Präposition ב, ohne sie zu „über“ oder „unter“ auszudeuten.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: Im prophetischen Auftragszusammenhang bezeichnet עבד einen Gott unterstellten und von ihm beauftragten Diener; „Sklave“ wäre hier im modernen Deutsch missverständlich.
- source_word: וּבִדְבָרֶךָ
  choice: auf dein Wort hin
  rationale: Die Formulierung gibt die maßgebende und veranlassende Kraft des göttlichen Wortes idiomatisch wieder; die mögliche instrumentale Nuance wird in einer Fußnote genannt.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ich all dies … getan habe
  rationale: דברים meint hier die genannten Handlungen oder Angelegenheiten, nicht bloß gesprochene Wörter. Das deutsche Perfekt passt zur abgeschlossenen Handlung in Elijas gegenwärtigem Gebet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Quelltext verwendet den persönlichen Gottesnamen. Seine deutsche Transliteration bewahrt dies, statt ihn durch einen Titel zu ersetzen.
- issue: Patriarchenformel mit „Israel“ statt „Jakob“
  choice: Gott Abrahams, Isaaks und Israels
  alternative: Gott Abrahams, Isaaks und Jakobs
  rationale: Die Lesart „Israel“ ist im hebräischen Text eindeutig und wird nicht an die geläufigere Formel angeglichen.
- issue: Verhältnis von Elijas Handeln zu Gottes Wort
  choice: auf dein Wort hin
  alternative: durch dein Wort; nach deinem Wort
  rationale: Die Präposition ב kann Veranlassung, Mittel oder Maßstab ausdrücken. Der Haupttext wahrt den Gehorsams- und Auftragsgedanken, während die Fußnote die echten Übersetzungsalternativen offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem Gebetston. „Elija“ folgt der heutigen deutschen Namensform; Satzbau und Wortwahl vermeiden unnötige Archaismen. Die Fußnotenmarker stehen jeweils direkt an der erklärten Stelle.
