base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: de
  text: 'Als er diese Nachricht[a] hörte, während er und die Könige in den Hütten[b] tranken, sagte er zu seinen Dienern: »Nehmt Stellung!«[c] Da nahmen sie gegen die Stadt Stellung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Wort« beziehungsweise »diese Sache«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in den Unterständen«; traditionell auch: »in den Pavillons«.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Befehl lautet wörtlich nur: »Setzt!« oder »Stellt auf!« Gemeint ist im Zusammenhang vermutlich, dass die Truppen gegen die Stadt Stellung beziehen sollen.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: diese Nachricht
  rationale: דָּבָר kann »Wort«, »Sache« oder »Nachricht« bedeuten. Hier reagiert Ben-Hadad auf Ahabs übermittelte Antwort; »Nachricht« ist daher im modernen Deutsch natürlich, während eine Fußnote die lexikalische Breite bewahrt.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: während er und die Könige … tranken
  rationale: Das Partizip bezeichnet die gleichzeitig andauernde Handlung. Die deutsche Pluralform gibt die hebräische Konstruktion »er trank, er und die Könige« idiomatisch wieder.
- source_word: בַּסֻּכּוֹת
  choice: in den Laubhütten
  rationale: סֻכּוֹת bezeichnet einfache oder zeitweilige Hütten beziehungsweise Schutzdächer. »Laubhütten« ist anschaulich und lexikalisch nah, ohne den höfischen Charakter von »Pavillons« in den Text hineinzutragen.
- source_word: שִׂימוּ
  choice: Nehmt Stellung!
  rationale: Der kurze Imperativ von שׂים lautet wörtlich etwa »Setzt!« beziehungsweise »Stellt auf!«. Im militärischen Zusammenhang gibt »Nehmt Stellung!« die knappe Befehlsform wieder, ohne nicht genannte Belagerungsgeräte vorauszusetzen.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: Da nahmen sie gegen die Stadt Stellung
  rationale: Die hebräische Wendung ist elliptisch. עַל markiert hier die feindliche Ausrichtung gegen die Stadt; die Wiederaufnahme von »Stellung nehmen« bewahrt zugleich die Wortverbindung mit dem vorausgehenden Befehl.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp; der militärische Sinn der elliptischen Befehlsform wird verständlich wiedergegeben, während Fußnoten die wörtlicheren Möglichkeiten offenhalten.
