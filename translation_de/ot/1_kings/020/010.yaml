  to: 'Ben-Hadad schickte zu ihm und ließ ihm sagen: »Die Götter sollen mir dies und noch mehr antun, wenn der Staub Samarias ausreicht, damit jeder von all den Leuten in meinem Gefolge[b] auch nur eine Handvoll[a] bekommt!«'
